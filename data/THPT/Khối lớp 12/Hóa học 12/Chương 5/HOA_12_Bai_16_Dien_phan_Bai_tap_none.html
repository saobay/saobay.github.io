{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Điện phân là quá trình:","options":["A. oxi hóa – khử xảy ra khi có dòng điện một chiều qua chất điện li","B. oxi hóa – khử tự xảy ra","C. trung hòa acid – base","D. hòa tan kim loại"],"answer":"A","explain":"Điện phân: oxi hóa – khử cưỡng bức nhờ dòng điện một chiều.","points":0.25},{"type":"mcq","level":"NB","q":"Trong điện phân, cathode mang dấu:","options":["A. âm (−), xảy ra khử","B. dương (+), xảy ra khử","C. âm (−), xảy ra oxi hóa","D. dương (+), xảy ra oxi hóa"],"answer":"A","explain":"Điện phân: cathode (−, khử); anode (+, oxi hóa).","points":0.25},{"type":"mcq","level":"TH","q":"Điện phân nóng chảy NaCl, sản phẩm ở cathode là:","options":["A. Na","B. $\\mathrm{Cl_2}$","C. $\\mathrm{H_2}$","D. NaOH"],"answer":"A","explain":"$\\mathrm{Na^+ + e \\rightarrow Na}$ ở cathode.","points":0.25},{"type":"mcq","level":"TH","q":"Điện phân nóng chảy NaCl, sản phẩm ở anode là:","options":["A. $\\mathrm{Cl_2}$","B. Na","C. $\\mathrm{O_2}$","D. HCl"],"answer":"A","explain":"$\\mathrm{2Cl^- \\rightarrow Cl_2 + 2e}$ ở anode.","points":0.25},{"type":"mcq","level":"VD","q":"Điện phân nóng chảy $11,7$ gam NaCl ($M = 58,5$). Thể tích $\\mathrm{Cl_2}$ (đktc) thu được là:","options":["A. $2,24$ lít","B. $4,48$ lít","C. $1,12$ lít","D. $11,2$ lít"],"answer":"A","explain":"$n_{NaCl} = 0,2$ mol → $n_{\\mathrm{Cl_2}} = 0,1$ mol → $V = 2,24$ lít.","points":0.25},{"type":"mcq","level":"VDC","q":"Điện phân nóng chảy $m$ gam $\\mathrm{Al_2O_3}$ thu được $5,4$ gam Al. Giá trị của $m$ là: ($M_{\\mathrm{Al_2O_3}} = 102$)","options":["A. $10,2$ gam","B. $5,1$ gam","C. $20,4$ gam","D. $2,55$ gam"],"answer":"A","explain":"$n_{Al} = 0,2$ mol → $n_{\\mathrm{Al_2O_3}} = 0,1$ mol → $m = 10,2$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện phân cần dòng điện một chiều.","b) Cathode (−, khử); anode (+, oxi hóa).","c) Điện phân NaCl nóng chảy cho Na ở cat ân dung dịch NaCl (có màng ngăn), sản phẩm ở cathode là:","options":["A. $\\mathrm{H_2}$","B. Na","C. $\\mathrm{Cl_2}$","D. $\\mathrm{O_2}$"],"answer":"A","explain":"$\\mathrm{Na^+}$ (trước Al) không bị khử → nước bị khử: $\\mathrm{2H_2O + 2e \\rightarrow H_2 + 2OH^-}$.","points":0.25},{"type":"mcq","level":"TH","q":"Điện phân dung dịch NaCl (có màng ngăn), sản phẩm ở anode là:","options":["A. $\\mathrm{Cl_2}$","B. $\\mathrm{O_2}$","C. Na","D. $\\mathrm{H_2}$"],"answer":"A","explain":"$\\mathrm{Cl^-}$ (không oxi) bị oxi hóa: $\\mathrm{2Cl^- \\rightarrow Cl_2 + 2e}$.","points":0.25},{"type":"mcq","level":"VD","q":"Điện phân dung dịch $\\mathrm{CuSO_4}$ với $I = 2$ A, $t = 9650$ s. Khối lượng Cu bám cathode là: ($A_{Cu} = 64$, $F = 96500$)","options":["A. $6,4$ gam","B. $3,2$ gam","C. $12,8$ gam","D. $1,6$ gam"],"answer":"A","explain":"$m = 64 \\times 2 \\times 9650/(2 \\times 96500) = 6,4$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Điện phân dung dịch $\\mathrm{AgNO_3}$ với $I = 1$ A, $t = 9650$ s. Khối lượng Ag bám cathode là: ($A_{Ag} = 108$)","options":["A. $10,8$ gam","B. $5,4$ gam","C. $21,6$ gam","D. $1,08$ gam"],"answer":"A","explain":"$m = 108 \\times 1 \\times 9650/(1 \\times 96500) = 10,8$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện phân $\\mathrm{CuSO_4}$: cathode cho Cu.","b) Điện phân $\\mathrm{CuSO_4}$: anode cho $\\mathrm{O_2}$.","c) Điện phân dung dịch NaCl: cathode cho $\\mathrm{H_2}$.","d) Điện phân dung dịch NaCl: anode cho $\\mathrm{Cl_2}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện phân $\\mathrm{CuSO_4}$ ($I = 2$ A, $9650$ s) cho $6,4$ gam Cu.","b) Điện phân $\\mathrm{AgNO_3}$ ($I = 1$ A, $9650$ s) cho $10,8$ gam Ag.","c) $m = AIt/nF$.","d) $\\mathrm{Na^+}$ bị khử khi điện phân dung dịch NaCl."],"answer":["T","T","T level":"NB","q":"Tinh luyện đồng dùng phương pháp:","options":["A. điện phân (anode tan)","B. pin điện hóa","C. nhiệt luyện","D. thủy luyện"],"answer":"A","explain":"Tinh luyện Cu bằng điện phân dung dịch $\\mathrm{CuSO_4}$ với anode là Cu thô.","points":0.25},{"type":"mcq","level":"TH","q":"Khi mạ bạc lên vật kim loại, vật cần mạ đóng vai trò:","options":["A. cathode","B. anode","C. cầu muối","D. dây dẫn"],"answer":"A","explain":"Vật cần mạ là cathode (để $\\mathrm{Ag^+}$ bị khử bám lên).","points":0.25},{"type":"mcq","level":"TH","q":"Khi mạ bạc, anode làm bằng:","options":["A. Ag","B. Cu","C. Fe","D. graphite"],"answer":"A","explain":"Anode tan làm bằng kim loại mạ (Ag).","points":0.25},{"type":"mcq","level":"VD","q":"Điện phân dung dịch $\\mathrm{AgNO_3}$ với $I = 2$ A, $t = 4825$ s. Khối lượng Ag bám cathode là:","options":["A. $10,8$ gam","B. $5,4$ gam","C. $21,6$ gam","D. $2,7$ gam"],"answer":"A","explain":"$m = 108 \\times 2 \\times 4825/(1 \\times 96500) = 10,8$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Mạ $10,8$ gam Ag lên vật kim loại bằng điện phân $\\mathrm{AgNO_3}$ với $I = 1$ A. Thời gian cần là:","options":["A. $9650$ s","B. $4825$ s","C. $19300$ s","D. $965$ s"],"answer":"A","explain":"$t = 10,8 \\times 96500/(108 \\times 1) = 9650$ s.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện phân dùng để mạ điện.","b) Tinh luyện Cu bằng điện phân anode tan.","c) Vật cần mạ là cathode.","d) Anode khi mạ bạc làm bằng Ag."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện phân $\\mathrm{AgNO_3}$ ($I = 2$ A, $4825$ s) cho $10,8$ gam Ag.","b) Mạ $10,8$ gam Ag ($I = 1$ A) cần $9650$ s.","c) Mạ điện là ứng dụng của pin.","d) Tinh luyện kim loại là ứng dụng của điện phân."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: mạ điện là ứng dụng của ĐIỆN PHÂN.","points":1},{"type":"short","level":"VD","q":"Điện phân dung dịch $\\mathrm{NiSO_4}$ với $I = 2$ A trong $9650$ s. Khối lượng Ni thu được là bao nhiêu gam? ($A_{Ni} = 59$)","answer":"5,9","explain":"$m = 59 \\times 2 \\times 9650/(2 \\times 96500) = 5,9$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cần cường độ dòng điện bao nhiêu để điện phân $\\mathrm{CuSO_4}$ trong $4825$ s thu được $3,2$ gam Cu?","answer":"2","explain":"$I = m \\times n \\times F/(A \\times t) = 3,2 \\times 2 \\times 96500/(64 \\times 4825) = 2$ A.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Điện phân nóng chảy $\\mathrm{Al_2O_3}$ (có cryolite) điều chế:","options":["A. Al","B. Na","C. Fe","D. Cu"],"answer":"A","explain":"Al điều chế bằng điện phân nóng chảy $\\mathrm{Al_2O_3}$.","points":0.25},{"type":"mcq","level":"NB","q":"Cryolite ($\\mathrm{Na_3AlF_6}$) trong điện phân $\\mathrm{Al_2O_3}$ có tác dụng:","options":["A. hạ nhiệt độ nóng chảy","B. tăng nhiệt độ nóng chảy","C. làm anode","D. làm cathode"],"answer":"A","explain":"Cryolite hạ nhiệt độ nóng chảy của $\\mathrm{Al_2O_3}$ (từ $2050^\\circ\\mathrm{C}$ xuống ~$900^\\circ\\mathrm{C}$).","points":0.25},{"type":"mcq","level":"TH","q":"Kim loại nào sau đây điều chế bằng điện phân nóng chảy?","options":["A. Na","B. Cu","C. Fe","D. Ag"],"answer":"A","explain":"Kim loại mạnh (Na, K, Ca, Mg, Al) điều chế bằng điện phân nóng chảy.","points":0.25},{"type":"mcq","level":"TH","q":"Kim loại nào sau đây KHÔNG điều chế bằng điện phân dung dịch?","options":["A. Na","B. Cu","C. Ag","D. Zn"],"answer":"A","explain":"Na (kim loại mạnh) không điều chế được bằng điện phân dung dịch.","points":0.25},{"type":"mcq","level":"VD","q":"Điện phân nóng chảy $19$ gam $\\mathrm{MgCl_2}$ ($M = 95$). Khối lượng Mg thu được là: (hiệu suất $100\\%$)","options":["A. $4,8$ gam","B. $9,6$ gam","C. $2,4$ gam","D. $19$ gam"],"answer":"A","explain":"$n_{\\mathrm{MgCl_2}} = 19/95 = 0,2$ mol → $m_{Mg} = 0,2 \\times 24 = 4,8$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Điện phân nóng chảy $m$ gam $\\mathrm{CaCl_2}$ ($M = 111$) thu được $4$ gam Ca. Giá trị của $m$ là:","options":["A. $11,1$ gam","B. $5,55$ gam","C. $22,2$ gam","D. $4$ gam"],"answer":"A","explain":"$n_{Ca} = 0,1$ mol → $n_{\\mathrm{CaCl_2}} = 0,1$ mol → $m = 11,1$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Al điều chế bằng điện phân nóng chảy $\\mathrm{Al_2O_3}$.","b) Cryolite hạ nhiệt độ nóng chảy.","c) Na điều chế bằng điện phân nóng chảy.","d) Na điều chế bằng điện phân dung dịch."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Na KHÔNG điều chế được bằng điện phân dung dịch.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $19$ gam $\\mathrm{MgCl_2}$ điện phân nóng chảy cho $4,8$ gam Mg.","b) $11,1$ gam $\\mathrm{CaCl_2}$ điện phân cho $4$ gam Ca.","c) Kim loại mạnh điều chế bằng điện phân nóng chảy.","d) Cu điều chế bằng điện phân nóng chảy."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Cu (kim loại trung bình) không cần điện phân nóng chảy.","points":1},{"type":"short","level":"VD","q":"Điện phân nóng chảy $22,2$ gam $\\mathrm{CaCl_2}$. Khối lượng Ca thu được là bao nhiêu gam?","answer":"8","explain":"$n = 0,2$ mol → $m = 8$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Điện phân nóng chảy $m$ gam $\\mathrm{MgCl_2}$ ($M = 95$) thu được $2,4$ gam Mg. Giá trị của $m$ là bao nhiêu?","answer":"9,5","explain":"$n_{Mg} = 0,1$ mol → $m = 9,5$ gam.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Khi điện phân dung dịch $\\mathrm{KCl}$ (không màng ngăn), sản phẩm thu được là:","options":["A. KOH, $\\mathrm{H_2}$, $\\mathrm{Cl_2}$","B. K, $\\mathrm{H_2}$, $\\mathrm{Cl_2}$","C. KOH, $\\mathrm{O_2}$","D. K, $\\mathrm{O_2}$"],"answer":"A","explain":"Cathode: $\\mathrm{H_2}$ + $\\mathrm{OH^-}$ (tạo KOH); anode: $\\mathrm{Cl_2}$.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm của điện phân dung dịch NaCl (có màng ngăn) dùng sản xuất:","options":["A. NaOH (xút)","B. Na kim loại","C. $\\mathrm{Na_2CO_3}$","D. HCl"],"answer":"A","explain":"Điện phân dung dịch NaCl có màng ngăn sản xuất NaOH (công nghiệp chlor-kiềm).","points":0.25},{"type":"mcq","level":"TH","q":"Điện phân dung dịch $\\mathrm{H_2SO_4}$ loãng (điện cực trơ), sản phẩm là:","options":["A. $\\mathrm{H_2}$ và $\\mathrm{O_2}$","B. S và $\\mathrm{O_2}$","C. $\\mathrm{H_2}$ và S","D. $\\mathrm{SO_2}$ và $\\mathrm{O_2}$"],"answer":"A","explain":"Thực chất là điện phân nước: cathode $\\mathrm{H_2}$, anode $\\mathrm{O_2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Điện phân dung dịch $\\mathrm{Na_2SO_4}$ (điện cực trơ), sản phẩm là:","options":["A. $\\mathrm{H_2}$ và $\\mathrm{O_2}$","B. Na và $\\mathrm{O_2}$","C. Na và S","D. $\\mathrm{H_2}$ và S"],"answer":"A","explain":"Điện phân nước: cathode $\\mathrm{H_2}$, anode $\\mathrm{O_2}$.","points":0.25},{"type":"mcq","level":"VD","q":"Điện phân dung dịch NaCl (có màng ngăn) với $I = 2$ A, $t = 9650$ s. Thể tích $\\mathrm{Cl_2}$ (đktc) thu được là:","options":["A. $2,24$ lít","B. $4,48$ lít","C. $1,12$ lít","D. $11,2$ lít"],"answer":"A","explain":"$n_e = 2 \\times 9650/96500 = 0,2$ mol → $n_{\\mathrm{Cl_2}} = 0,1$ mol → $V = 2,24$ lít.","points":0.25},{"type":"mcq","level":"VDC","q":"Điện phân dung dịch $\\mathrm{CuSO_4}$ đến khi cathode tăng $6,4$ gam thì thể tích $\\mathrm{O_2}$ (đktc) ở anode là:","options":["A. $1,12$ lít","B. $2,24$ lít","C. $0,56$ lít","D. $4,48$ lít"],"answer":"A","explain":"$n_{Cu} = 0,1$ mol → $n_e = 0,2$ mol → $n_{\\mathrm{O_2}} = 0,05$ mol → $V = 1,12$ lít.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện phân dung dịch KCl cho KOH, $\\mathrm{H_2}$, $\\mathrm{Cl_2}$.","b) Điện phân dung dịch NaCl (màng ngăn) sản xuất NaOH.","c) Điện phân $\\mathrm{H_2SO_4}$ loãng cho $\\mathrm{H_2}$ và $\\mathrm{O_2}$.","d) Điện phân $\\mathrm{Na_2SO_4}$ cho Na và $\\mathrm{O_2}$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cho $\\mathrm{H_2}$ và $\\mathrm{O_2}$ (điện phân nước).","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện phân NaCl ($I = 2$ A, $9650$ s) cho $2,24$ lít $\\mathrm{Cl_2}$ (đktc).","b) Cathode tăng $6,4$ gam Cu thì anode cho $1,12$ lít $\\mathrm{O_2}$ (đktc).","c) Nước bị điện phân khi cation/anion không tham gia.","d) $\\mathrm{K^+}$ bị khử khi điện phân dung dịch KCl."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: $\\mathrm{K^+}$ KHÔNG bị khử.","points":1},{"type":"short","level":"VD","q":"Điện phân dung dịch NaCl (có màng ngăn) với $I = 1$ A trong $19300$ s. Thể tích $\\mathrm{H_2}$ (đktc) thu được là bao nhiêu lít?","answer":"2,24","explain":"$n_e = 19300/96500 = 0,2$ mol → $n_{\\mathrm{H_2}} = 0,1$ mol → $V = 2,24$ lít.","points":0.5},{"type":"short","level":"VDC","q":"Điện phân dung dịch $\\mathrm{CuSO_4}$ đến khi thu được $2,24$ lít $\\mathrm{O_2}$ (đktc) ở anode. Khối lượng Cu bám cathode là bao nhiêu gam?","answer":"12,8","explain":"$n_{\\mathrm{O_2}} = 0,1$ mol → $n_e = 0,4$ mol → $n_{Cu} = 0,2$ mol → $m = 12,8$ gam.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng?","options":["A. điện phân tiêu thụ điện năng","B. điện phân tự phát điện","C. pin tiêu thụ điện năng","D. pin và điện phân giống nhau"],"answer":"A","explain":"Điện phân tiêu thụ điện năng; pin tự phát điện.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây sai?","options":["A. cathode trong điện phân là cực dương","B. cathode trong điện phân là cực âm","C. anode trong điện phân là cực dương","D. ở cathode xảy ra khử"],"answer":"A","explain":"Cathode trong điện phân là cực ÂM (−).","points":0.25},{"type":"mcq","level":"TH","q":"So sánh dấu điện cực: trong pin, cathode là cực (+); trong điện phân, cathode là cực:","options":["A. (−)","B. (+)","C. không mang điện","D. trung hòa"],"answer":"A","explain":"Điện phân: cathode (−), anode (+); ngược dấu với pin.","points":0.25},{"type":"mcq","level":"TH","q":"Trong điện phân, quá trình oxi hóa xảy ra ở:","options":["A. anode (+)","B. cathode (−)","C. cầu muối","D. dung dịch"],"answer":"A","explain":"Anode (+): oxi hóa; cathode (−): khử.","points":0.25},{"type":"mcq","level":"VD","q":"Điện phân dung dịch $\\mathrm{FeCl_2}$ với $I = 2$ A, $t = 9650$ s. Khối lượng Fe thu được là: ($A_{Fe} = 56$)","options":["A. $5,6$ gam","B. $11,2$ gam","C. $2,8$ gam","D. $28$ gam"],"answer":"A","explain":"$m = 56 \\times 2 \\times 9650/(2 \\times 96500) = 5,6$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Điện phân dung dịch $X\\mathrm{SO_4}$ ($X$ là kim loại hóa trị II) với $I = 2$ A, $t = 9650$ s thu được $3,25$ gam kim loại X. Nguyên tử khối của X là:","options":["A. $65$","B. $64$","C. $56$","D. $108$"],"answer":"A","explain":"$A = m \\times n \\times F/(I \\times t) = 3,25 \\times 2 \\times 96500/(2 \\times 9650) = 65$ (Zn).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện phân tiêu thụ điện năng.","b) Cathode trong điện phân là cực âm.","c) Oxi hóa xảy ra ở anode (+).","d) Pin tự phát điện."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện phân $\\mathrm{FeCl_2}$ ($I = 2$ A, $9650$ s) cho $5,6$ gam Fe.","b) Kim loại X ($3,25$ gam, $I = 2$ A, $9650$ s, $n = 2$) có $A = 65$.","c) $m = AIt/nF$.","d) Trong điện phân, cathode là cực dương."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cathode là cực ÂM.","points":1},{"type":"short","level":"VD","q":"Điện phân dung dịch $\\mathrm{SnCl_2}$ với $I = 2$ A trong $9650$ s. Khối lượng Sn thu được là bao nhiêu gam? ($A_{Sn} = 119$, $n = 2$)","answer":"11,9","explain":"$m = 119 \\times 2 \\times 9650/(2 \\times 96500) = 11,9$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Điện phân dung dịch $\\mathrm{CuSO_4}$ với dòng điện $I = x$ A trong $9650$ s thu được $6,4$ gam Cu. Giá trị của $x$ là bao nhiêu?","answer":"2","explain":"$I = 6,4 \\times 2 \\times 96500/(64 \\times 9650) = 2$ A.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Tổng hợp bài 16: điện phân dung dịch $\\mathrm{CuSO_4}$ thu được ở cathode là:","options":["A. Cu","B. $\\mathrm{H_2}$","C. $\\mathrm{O_2}$","D. S"],"answer":"A","explain":"$\\mathrm{Cu^{2+}}$ bị khử thành Cu.","points":0.25},{"type":"mcq","level":"NB","q":"Điện phân dung dịch $\\mathrm{CuSO_4}$ thu được ở anode là:","options":["A. $\\mathrm{O_2}$","B. Cu","C. $\\mathrm{H_2}$","D. S"],"answer":"A","explain":"Nước bị oxi hóa cho $\\mathrm{O_2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Điện phân dung dịch $\\mathrm{NaCl}$ (không màng ngăn), dung dịch thu được làm quỳ tím:","options":["A. chuyển xanh","B. chuyển đỏ","C. mất màu","D. không đổi màu"],"answer":"A","explain":"Tạo NaOH → quỳ tím chuyển xanh.","points":0.25},{"type":"mcq","level":"TH","q":"Điện phân dung dịch $\\mathrm{CuSO_4}$, dung dịch sau điện phân làm quỳ tím:","options":["A. chuyển đỏ","B. chuyển xanh","C. mất màu","D. không đổi màu"],"answer":"A","explain":"Tạo $\\mathrm{H_2SO_4}$ → quỳ tím chuyển đỏ.","points":0.25},{"type":"mcq","level":"VD","q":"Điện phân $100$ ml dung dịch $\\mathrm{CuSO_4}$ $1M$ đến khi hết $\\mathrm{Cu^{2+}}$ ($I = 2$ A). Thời gian là:","options":["A. $9650$ s","B. $4825$ s","C. $19300$ s","D. $965$ s"],"answer":"A","explain":"$n_e = 0,2$ mol → $t = 0,2 \\times 96500/2 = 9650$ s.","points":0.25},{"type":"mcq","level":"VDC","q":"Điện phân dung dịch $\\mathrm{AgNO_3}$ đến khi anode thoát $1,12$ lít $\\mathrm{O_2}$ (đktc). Khối lượng Ag bám cathode là:","options":["A. $21,6$ gam","B. $10,8$ gam","C. $43,2$ gam","D. $5,4$ gam"],"answer":"A","explain":"$n_{\\mathrm{O_2}} = 0,05$ mol → $n_e = 0,2$ mol → $n_{Ag} = 0,2$ mol → $m = 21,6$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện phân $\\mathrm{CuSO_4}$: cathode cho Cu, anode cho $\\mathrm{O_2}$.","b) Điện phân NaCl (không màng ngăn) cho dung dịch NaOH.","c) Điện phân $\\mathrm{CuSO_4}$ cho dung dịch acid.","d) $\\mathrm{Ag^+}$ bị khử ở cathode."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện phân $100$ ml $\\mathrm{CuSO_4}$ $1M$ ($I = 2$ A) cần $9650$ s.","b) Anode thoát $1,12$ lít $\\mathrm{O_2}$ thì cathode có $21,6$ gam Ag.","c) Dung dịch sau điện phân NaCl làm quỳ xanh.","d) Dung dịch sau điện phân $\\mathrm{CuSO_4}$ làm quỳ xanh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: làm quỳ ĐỎ (tạo acid).","points":1},{"type":"short","level":"VD","q":"Điện phân dung dịch $\\mathrm{K_2SO_4}$ (điện cực trơ). Khí thoát ra ở cathode là khí gì? (viết công thức)","answer":"H2","explain":"Điện phân nước: cathode cho $\\mathrm{H_2}$.","points":0.5},{"type":"short","level":"VDC","q":"Điện phân dung dịch $\\mathrm{NaCl}$ (có màng ngăn) với $I = 2$ A trong $4825$ s. Khối lượng NaOH tạo thành là bao nhiêu gam?","answer":"4","explain":"$n_e = 0,1$ mol → $n_{NaOH} = 0,1$ mol → $m = 4$ gam.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Trong các kim loại sau, kim loại điều chế bằng điện phân nóng chảy là:","options":["A. Al","B. Cu","C. Fe","D. Ag"],"answer":"A","explain":"Al (kim loại mạnh) điều chế bằng điện phân nóng chảy $\\mathrm{Al_2O_3}$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các kim loại sau, kim loại KHÔNG điều chế bằng điện phân nóng chảy là:","options":["A. Cu","B. Na","C. Mg","D. Al"],"answer":"A","explain":"Cu (kim loại trung bình) không cần điện phân nóng chảy.","points":0.25},{"type":"mcq","level":"TH","q":"Phương pháp điều chế Na là:","options":["A. điện phân nóng chảy NaCl","B. điện phân dung dịch NaCl","C. nhiệt luyện","D. thủy luyện"],"answer":"A","explain":"Na điều chế bằng điện phân nóng chảy NaCl.","points":0.25},{"type":"mcq","level":"TH","q":"Phương pháp tinh luyện Cu là:","options":["A. điện phân dung dịch $\\mathrm{CuSO_4}$ (anode tan)","B. điện phân nóng chảy CuO","C. nung CuO với C","D. pin điện hóa"],"answer":"A","explain":"Tinh luyện Cu: điện phân với anode là Cu thô tan dần.","points":0.25},{"type":"mcq","level":"VD","q":"Điện phân nóng chảy $m$ gam $\\mathrm{NaCl}$ thu được $2,3$ gam Na. Giá trị của $m$ là:","options":["A. $5,85$ gam","B. $11,7$ gam","C. $2,3$ gam","D. $2,925$ gam"],"answer":"A","explain":"$n_{Na} = 0,1$ mol → $n_{NaCl} = 0,1$ mol → $m = 5,85$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Điện phân dung dịch $\\mathrm{CuSO_4}$ với điện cực Cu (anode tan). Khối lượng cathode tăng $3,2$ gam thì khối lượng anode giảm:","options":["A. $3,2$ gam","B. $6,4$ gam","C. $1,6$ gam","D. $0$ gam"],"answer":"A","explain":"Anode tan: $\\mathrm{Cu \\rightarrow Cu^{2+} + 2e}$; cathode: $\\mathrm{Cu^{2+} + 2e \\rightarrow Cu}$ → khối lượng chuyển nguyên vẹn $3,2$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 16):","statements":["a) Al điều chế bằng điện phân nóng chảy.","b) Na điều chế bằng điện phân nóng chảy NaCl.","c) Tinh luyện Cu bằng điện phân anode tan.","d) Cu điều chế bằng điện phân nóng chảy."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Cu KHÔNG cần điện phân nóng chảy.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $5,85$ gam NaCl điện phân nóng chảy cho $2,3$ gam Na.","b) Cathode tăng $3,2$ gam thì anode tan giảm $3,2$ gam.","c) Mạ điện là ứng dụng của điện phân.","d) Điện phân tự phát điện."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: điện phân TIÊU THỤ điện năng.","points":1},{"type":"short","level":"VD","q":"Điện phân nóng chảy $11,1$ gam $\\mathrm{CaCl_2}$ ($M = 111$). Thể tích $\\mathrm{Cl_2}$ (đktc) thu được là bao nhiêu lít?","answer":"2,24","explain":"$n = 0,1$ mol → $n_{\\mathrm{Cl_2}} = 0,1$ mol → $V = 2,24$ lít.","points":0.5},{"type":"short","level":"VDC","q":"Điện phân dung dịch $\\mathrm{ZnCl_2}$ với $I = 1$ A trong $19300$ s. Khối lượng Zn thu được là bao nhiêu gam? ($A_{Zn} = 65$)","answer":"6,5","explain":"$m = 65 \\times 1 \\times 19300/(2 \\times 96500) = 6,5$ gam.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tổng hợp chương 5: pin điện hóa và điện phân khác nhau ở:","options":["A. pin tự phát điện, điện phân tiêu thụ điện","B. cả hai đều tự phát điện","C. cả hai đều tiêu thụ điện","D. không khác nhau"],"answer":"A","explain":"Pin: hóa năng → điện năng; điện phân: điện năng → hóa năng.","points":0.25},{"type":"mcq","level":"NB","q":"Công thức Faraday là:","options":["A. $m = AIt/nF$","B. $m = nF/AIt$","C. $m = AIn/Ft$","D. $m = AF/nIt$"],"answer":"A","explain":"$m = AIt/nF$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong pin, anode là cực (−); trong điện phân, anode là cực:","options":["A. (+)","B. (−)","C. không dấu","D. trung hòa"],"answer":"A","explain":"Điện phân: anode (+) nối với cực dương của nguồn.","points":0.25},{"type":"mcq","level":"TH","q":"Trong pin, cathode là cực (+); trong điện phân, cathode là cực:","options":["A. (−)","B. (+)","C. không dấu","D. trung hòa"],"answer":"A","explain":"Điện phân: cathode (−) nối với cực âm của nguồn.","points":0.25},{"type":"mcq","level":"VD","q":"Sức điện động chuẩn của pin $\\mathrm{Zn - Cu}$ là $1,10$ V. Biết $E^\\circ_{Zn^{2+}/Zn} = -0,76$ V, tính $E^\\circ_{Cu^{2+}/Cu}$:","options":["A. $+0,34$ V","B. $-0,34$ V","C. $+1,86$ V","D. $-1,86$ V"],"answer":"A","explain":"$1,10 = E^\\circ_{Cu} - (-0,76)$ → $E^\\circ_{Cu} = +0,34$ V.","points":0.25},{"type":"mcq","level":"VDC","q":"Điện phân dung dịch $\\mathrm{CuSO_4}$ với $I = 2$ A. Sau $t$ giây, cathode tăng $12,8$ gam. Giá trị của $t$ là:","options":["A. $19300$ s","B. $9650$ s","C. $38600$ s","D. $4825$ s"],"answer":"A","explain":"$n_e = 0,4$ mol → $t = 0,4 \\times 96500/2 = 19300$ s.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 5):","statements":["a) Pin tự phát điện, điện phân tiêu thụ điện.","b) $m = AIt/nF$.","c) Trong điện phân, anode là cực (+).","d) Trong điện phân, cathode là cực (−)."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Pin Zn-Cu ($E^\\circ_{pin} = 1,10$ V) thì $E^\\circ_{Cu} = +0,34$ V.","b) Cathode tăng $12,8$ gam Cu ($I = 2$ A) cần $19300$ s.","c) $E^\\circ_{pin} = E^\\circ_{cathode} - E^\\circ_{anode}$.","d) Điện phân NaCl nóng chảy cho Na ở anode."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cho Na ở CATHODE.","points":1},{"type":"short","level":"VD","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Fe - Cu}$ ($E^\\circ_{Fe^{2+}/Fe} = -0,44$ V; $E^\\circ_{Cu^{2+}/Cu} = +0,34$ V). (đơn vị V)","answer":"0,78","explain":"$E^\\circ_{pin} = 0,34 - (-0,44) = 0,78$ V.","points":0.5},{"type":"short","level":"VDC","q":"Điện phân dung dịch $\\mathrm{AgNO_3}$ với $I = 1$ A trong $t$ giây thu được $5,4$ gam Ag. Giá trị của $t$ là bao nhiêu?","answer":"4825","explain":"$t = 5,4 \\times 96500/(108 \\times 1) = 4825$ s.","points":0.5}]}]}</script>
