ét tính đúng, sai của các khẳng định sau:","statements":["a) $E^\\circ_{pin\\ Zn-Fe} = 0,32$ V.","b) Pin X-Cu ($E^\\circ_{pin} = 1,10$ V) thì $E^\\circ_X = -0,76$ V.","c) $E^\\circ_{pin} = E^\\circ_{cathode} - E^\\circ_{anode}$.","d) Electron chuyển từ cực dương sang cực âm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: electron chuyển từ CỰC ÂM sang cực dương.","points":1},{"type":"short","level":"VD","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Ag - Cu}$ ($E^\\circ_{Ag^+/Ag} = +0,80$ V; $E^\\circ_{Cu^{2+}/Cu} = +0,34$ V). (đơn vị V)","answer":"0,46","explain":"$E^\\circ_{pin} = 0,80 - 0,34 = 0,46$ V.","points":0.5},{"type":"short","level":"VDC","q":"Pin $\\mathrm{Y - Zn}$ có $E^\\circ_{pin} = 1,61$ V ($E^\\circ_{Zn^{2+}/Zn} = -0,76$ V), Y có $E^\\circ$ âm hơn Zn. Tính $E^\\circ_{Y^{n+}/Y}$. (đơn vị V)","answer":"-2,37","explain":"$1,61 = -0,76 - E^\\circ_Y$ → $E^\\circ_Y = -2,37$ V (Y là Mg).","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Nguồn điện hóa học là thiết bị:","options":["A. biến hóa năng thành điện năng","B. biến điện năng thành hóa năng","C. biến quang năng thành điện năng","D. biến nhiệt năng thành cơ năng"],"answer":"A","explain":"Nguồn điện hóa học (pin, acquy) biến hóa năng thành điện năng.","points":0.25},{"type":"mcq","level":"NB","q":"Acquy chì là nguồn điện:","options":["A. có thể nạp lại","B. dùng một lần","C. không đảo ngược","D. tự hủy"],"answer":"A","explain":"Acquy là pin có thể nạp lại (sạc điện).","points":0.25},{"type":"mcq","level":"TH","q":"Khi pin Daniell hoạt động, khối lượng điện cực Zn:","options":["A. giảm dần","B. tăng dần","C. không đổi","D. tăng rồi giảm"],"answer":"A","explain":"Zn bị oxi hóa tan vào dung dịch → khối lượng giảm.","points":0.25},{"type":"mcq","level":"TH","q":"Khi pin Daniell hoạt động, khối lượng điện cực Cu:","options":["A. tăng dần","B. giảm dần","C. không đổi","D. giảm rồi tăng"],"answer":"A","explain":"$\\mathrm{Cu^{2+}}$ bị khử bám vào điện cực → khối lượng tăng.","points":0.25},{"type":"mcq","level":"VD","q":"Sức điện động chuẩn của pin $\\mathrm{Pb - Cu}$ ($E^\\circ_{Pb^{2+}/Pb} = -0,13$ V; $E^\\circ_{Cu^{2+}/Cu} = +0,34$ V) là:","options":["A. $0,47$ V","B. $0,21$ V","C. $-0,47$ V","D. $0,81$ V"],"answer":"A","explain":"$E^\\circ_{pin} = 0,34 - (-0,13) = 0,47$ V.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho các thế điện cực: $E^\\circ_{X^{2+}/X} = -0,76$ V; $E^\\circ_{Y^{2+}/Y} = +0,34$ V. Pin X-Y có $E^\\circ_{pin} = 1,10$ V. Kết luận đúng là:","options":["A. X là cực âm, Y là cực dương","B. X là cực dương, Y là cực âm","C. X và Y đều là cực âm","D. không xác định được"],"answer":"A","explain":"X có $E^\\circ$ nhỏ hơn → cực âm (anode); Y → cực dương.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Pin biến hóa năng thành điện năng.","b) Acquy có thể nạp lại.","c) Khi pin Daniell hoạt động, Zn giảm khối lượng.","d) Khi pin Daniell hoạt động, Cu giảm khối lượng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Cu TĂNG khối lượng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $E^\\circ_{pin\\ Pb-Cu} = 0,47$ V.","b) Trong pin X-Y ($E^\\circ_X \\lt E^\\circ_Y$), X là cực âm.","c) Electron đi từ anode sang cathode.","d) Cầu muối dẫn electron."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cầu muối dẫn ION, dây dẫn dẫn electron.","points":1},{"type":"short","level":"VD","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Ni - Cu}$ ($E^\\circ_{Ni^{2+}/Ni} = -0,25$ V; $E^\\circ_{Cu^{2+}/Cu} = +0,34$ V). (đơn vị V)","answer":"0,59","explain":"$E^\\circ_{pin} = 0,34 - (-0,25) = 0,59$ V.","points":0.5},{"type":"short","level":"VDC","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Cd - Ag}$ ($E^\\circ_{Cd^{2+}/Cd} = -0,40$ V; $E^\\circ_{Ag^+/Ag} = +0,80$ V). (đơn vị V)","answer":"1,2","explain":"$E^\\circ_{pin} = 0,80 - (-0,40) = 1,20$ V.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Phản ứng trong pin điện hóa là phản ứng:","options":["A. oxi hóa – khử tự xảy ra","B. oxi hóa – khử cần điện năng","C. trung hòa","D. trao đổi ion"],"answer":"A","explain":"Pin điện hóa hoạt động nhờ phản ứng oxi hóa – khử TỰ xảy ra.","points":0.25},{"type":"mcq","level":"NB","q":"Phản ứng điện phân là phản ứng oxi hóa – khử:","options":["A. cần dòng điện một chiều","B. tự xảy ra","C. không cần năng lượng","D. chỉ xảy ra ở nhiệt độ cao"],"answer":"A","explain":"Điện phân cần cung cấp điện năng (trái với pin).","points":0.25},{"type":"mcq","level":"TH","q":"So sánh pin điện hóa và điện phân, điểm khác nhau là:","options":["A. pin tự phát điện, điện phân tiêu thụ điện","B. cả hai đều tự phát điện","C. cả hai đều tiêu thụ điện","D. không có điểm khác"],"answer":"A","explain":"Pin: hóa năng → điện năng (tự phát); điện phân: điện năng → hóa năng (cưỡng bức).","points":0.25},{"type":"mcq","level":"TH","q":"Trong pin Galvani, dòng electron chạy từ:","options":["A. cực âm sang cực dương","B. cực dương sang cực âm","C. dung dịch sang điện cực","D. cầu muối sang điện cực"],"answer":"A","explain":"Electron từ anode (−) qua dây dẫn sang cathode (+).","points":0.25},{"type":"mcq","level":"VD","q":"Cho $E^\\circ_{Cr^{3+}/Cr} = -0,74$ V; $E^\\circ_{Cu^{2+}/Cu} = +0,34$ V. $E^\\circ_{pin\\ Cr-Cu}$ là:","options":["A. $1,08$ V","B. $0,40$ V","C. $-1,08$ V","D. $1,42$ V"],"answer":"A","explain":"$E^\\circ_{pin} = 0,34 - (-0,74) = 1,08$ V.","points":0.25},{"type":"mcq","level":"VDC","q":"Một pin có $E^\\circ_{pin} = 2,00$ V gồm Cu ($+0,34$ V) và kim loại M. Biết M là cực âm. $E^\\circ_{M^{n+}/M}$ là:","options":["A. $-1,66$ V","B. $+1,66$ V","C. $-2,34$ V","D. $+2,34$ V"],"answer":"A","explain":"$2,00 = 0,34 - E^\\circ_M$ → $E^\\circ_M = -1,66$ V (M là Al).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phản ứng trong pin tự xảy ra.","b) Điện phân cần dòng điện một chiều.","c) Pin tự phát điện, điện phân tiêu thụ điện.","d) Electron chạy từ cực âm sang cực dương."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $E^\\circ_{pin\\ Cr-Cu} = 1,08$ V.","b) Pin Cu-M ($E^\\circ_{pin} = 2,00$ V, M là cực âm) thì $E^\\circ_M = -1,66$ V.","c) Điện phân biến điện năng thành hóa năng.","d) Pin biến điện năng thành hóa năng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: pin biến HÓA NĂNG thành điện năng.","points":1},{"type":"short","level":"VD","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Sn - Cu}$ ($E^\\circ_{Sn^{2+}/Sn} = -0,14$ V; $E^\\circ_{Cu^{2+}/Cu} = +0,34$ V). (đơn vị V)","answer":"0,48","explain":"$E^\\circ_{pin} = 0,34 - (-0,14) = 0,48$ V.","points":0.5},{"type":"short","level":"VDC","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Co - Ag}$ ($E^\\circ_{Co^{2+}/Co} = -0,28$ V; $E^\\circ_{Ag^+/Ag} = +0,80$ V). (đơn vị V)","answer":"1,08","explain":"$E^\\circ_{pin} = 0,80 - (-0,28) = 1,08$ V.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Thế điện cực chuẩn của $\\mathrm{H^+/H_2}$ được quy ước là:","options":["A. $0,00$ V","B. $+1,00$ V","C. $-1,00$ V","D. $+0,34$ V"],"answer":"A","explain":"Cặp $\\mathrm{H^+/H_2}$ được chọn làm chuẩn: $E^\\circ = 0,00$ V.","points":0.25},{"type":"mcq","level":"NB","q":"Kim loại có $E^\\circ$ âm đẩy được $\\mathrm{H_2}$ khỏi dung dịch acid vì:","options":["A. có tính khử mạnh hơn $\\mathrm{H_2}$","B. có tính khử yếu hơn $\\mathrm{H_2}$","C. không tác dụng với acid","D. là kim loại quý"],"answer":"A","explain":"$E^\\circ \\lt 0$ → kim loại khử được $\\mathrm{H^+}$ thành $\\mathrm{H_2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Kim loại nào sau đây đẩy được $\\mathrm{H_2}$ khỏi HCl?","options":["A. Fe","B. Cu","C. Ag","D. Au"],"answer":"A","explain":"Fe ($E^\\circ = -0,44$ V $\\lt 0$) đẩy được $\\mathrm{H_2}$; Cu, Ag, Au ($E^\\circ \\gt 0$) không.","points":0.25},{"type":"mcq","level":"TH","q":"Kim loại nào sau đây KHÔNG đẩy được $\\mathrm{H_2}$ khỏi HCl?","options":["A. Cu","B. Zn","C. Mg","D. Al"],"answer":"A","explain":"Cu ($E^\\circ = +0,34$ V $\\gt 0$) không đẩy được $\\mathrm{H_2}$.","points":0.25},{"type":"mcq","level":"VD","q":"Sức điện động chuẩn của pin $\\mathrm{H_2 - Cu}$ ($E^\\circ_{H^+/H_2} = 0,00$ V; $E^\\circ_{Cu^{2+}/Cu} = +0,34$ V) là:","options":["A. $0,34$ V","B. $-0,34$ V","C. $0,68$ V","D. $0,17$ V"],"answer":"A","explain":"$E^\\circ_{pin} = 0,34 - 0,00 = 0,34$ V.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $E^\\circ_{Pb^{2+}/Pb} = -0,13$ V. Pin $\\mathrm{Pb - H_2}$ có $E^\\circ_{pin}$ là:","options":["A. $0,13$ V","B. $-0,13$ V","C. $0,26$ V","D. $1,13$ V"],"answer":"A","explain":"$E^\\circ_{pin} = 0,00 - (-0,13) = 0,13$ V.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $E^\\circ_{H^+/H_2} = 0,00$ V.","b) Kim loại $E^\\circ \\lt 0$ đẩy được $\\mathrm{H_2}$ khỏi acid.","c) Fe đẩy được $\\mathrm{H_2}$ khỏi HCl.","d) Cu đẩy được $\\mathrm{H_2}$ khỏi HCl."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Cu ($E^\\circ \\gt 0$) KHÔNG đẩy được $\\mathrm{H_2}$.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $E^\\circ_{pin\\ H_2-Cu} = 0,34$ V.","b) $E^\\circ_{pin\\ Pb-H_2} = 0,13$ V.","c) Zn ($E^\\circ = -0,76$ V) khử được $\\mathrm{H^+}$.","d) Ag ($E^\\circ = +0,80$ V) khử được $\\mathrm{H^+}$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Ag KHÔNG khử được $\\mathrm{H^+}$.","points":1},{"type":"short","level":"VD","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Zn - H_2}$ ($E^\\circ_{Zn^{2+}/Zn} = -0,76$ V). (đơn vị V)","answer":"0,76","explain":"$E^\\circ_{pin} = 0,00 - (-0,76) = 0,76$ V.","points":0.5},{"type":"short","level":"VDC","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Mg - H_2}$ ($E^\\circ_{Mg^{2+}/Mg} = -2,37$ V). (đơn vị V)","answer":"2,37","explain":"$E^\\circ_{pin} = 0,00 - (-2,37) = 2,37$ V.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Trong pin $\\mathrm{Al - Cu}$, cực âm là:","options":["A. Al","B. Cu","C. cả hai","D. không xác định"],"answer":"A","explain":"Al có $E^\\circ$ nhỏ hơn → cực âm.","points":0.25},{"type":"mcq","level":"NB","q":"Trong pin $\\mathrm{Al - Cu}$, cực dương là:","options":["A. Cu","B. Al","C. cả hai","D. không xác định"],"answer":"A","explain":"Cu có $E^\\circ$ lớn hơn → cực dương.","points":0.25},{"type":"mcq","level":"TH","q":"Phản ứng xảy ra trong pin $\\mathrm{Al - Cu}$ là:","options":["A. $\\mathrm{2Al + 3Cu^{2+} \\rightarrow 2Al^{3+} + 3Cu}$","B. $\\mathrm{3Cu + 2Al^{3+} \\rightarrow 3Cu^{2+} + 2Al}$","C. $\\mathrm{Al + Cu \\rightarrow AlCu}$","D. $\\mathrm{Al^{3+} + Cu \\rightarrow Al + Cu^{2+}}$"],"answer":"A","explain":"Al (cực âm) bị oxi hóa, $\\mathrm{Cu^{2+}}$ (cực dương) bị khử.","points":0.25},{"type":"mcq","level":"TH","q":"Số electron trao đổi trong phản ứng pin $\\mathrm{Al - Cu}$ là:","options":["A. $6$","B. $2$","C. $3$","D. $5$"],"answer":"A","explain":"$\\mathrm{2Al \\rightarrow 2Al^{3+} + 6e}$; $\\mathrm{3Cu^{2+} + 6e \\rightarrow 3Cu}$ → $6$ electron.","points":0.25},{"type":"mcq","level":"VD","q":"Sức điện động chuẩn của pin $\\mathrm{Mn - Cu}$ ($E^\\circ_{Mn^{2+}/Mn} = -1,18$ V; $E^\\circ_{Cu^{2+}/Cu} = +0,34$ V) là:","options":["A. $1,52$ V","B. $0,84$ V","C. $-1,52$ V","D. $1,86$ V"],"answer":"A","explain":"$E^\\circ_{pin} = 0,34 - (-1,18) = 1,52$ V.","points":0.25},{"type":"mcq","level":"VDC","q":"Pin $\\mathrm{M - Ag}$ có $E^\\circ_{pin} = 2,46$ V ($E^\\circ_{Ag^+/Ag} = +0,80$ V), M là cực âm. $E^\\circ_{M^{n+}/M}$ là:","options":["A. $-1,66$ V","B. $+1,66$ V","C. $-3,26$ V","D. $+3,26$ V"],"answer":"A","explain":"$2,46 = 0,80 - E^\\circ_M$ → $E^\\circ_M = -1,66$ V (M là Al).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trong pin Al-Cu, Al là cực âm.","b) Trong pin Al-Cu, Cu là cực dương.","c) Phản ứng pin: $\\mathrm{2Al + 3Cu^{2+} \\rightarrow 2Al^{3+} + 3Cu}$.","d) Số electron trao đổi là $6$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $E^\\circ_{pin\\ Mn-Cu} = 1,52$ V.","b) Pin M-Ag ($E^\\circ_{pin} = 2,46$ V, M cực âm) thì $E^\\circ_M = -1,66$ V.","c) Al bị oxi hóa ở cực âm.","d) $\\mathrm{Cu^{2+}}$ bị oxi hóa ở cực dương."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: $\\mathrm{Cu^{2+}}$ bị KHỬ ở cực dương.","points":1},{"type":"short","level":"VD","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Zn - Pb}$ ($E^\\circ_{Zn^{2+}/Zn} = -0,76$ V; $E^\\circ_{Pb^{2+}/Pb} = -0,13$ V). (đơn vị V)","answer":"0,63","explain":"$E^\\circ_{pin} = -0,13 - (-0,76) = 0,63$ V.","points":0.5},{"type":"short","level":"VDC","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Fe - Sn}$ ($E^\\circ_{Fe^{2+}/Fe} = -0,44$ V; $E^\\circ_{Sn^{2+}/Sn} = -0,14$ V). (đơn vị V)","answer":"0,3","explain":"$E^\\circ_{pin} = -0,14 - (-0,44) = 0,30$ V.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tổng hợp bài 15: công thức tính sức điện động chuẩn của pin là:","options":["A. $E^\\circ_{pin} = E^\\circ_{cathode} - E^\\circ_{anode}$","B. $E^\\circ_{pin} = E^\\circ_{anode} - E^\\circ_{cathode}$","C. $E^\\circ_{pin} = E^\\circ_{cathode} + E^\\circ_{anode}$","D. $E^\\circ_{pin} = E^\\circ_{anode} \\times E^\\circ_{cathode}$"],"answer":"A","explain":"$E^\\circ_{pin} = E^\\circ_{(+) } - E^\\circ_{(-)} = E^\\circ_{cathode} - E^\\circ_{anode}$.","points":0.25},{"type":"mcq","level":"NB","q":"Cực âm của pin điện hóa được gọi là:","options":["A. anode","B. cathode","C. catot","D. điện cực trơ"],"answer":"A","explain":"Cực âm = anode (xảy ra oxi hóa); cực dương = cathode (xảy ra khử).","points":0.25},{"type":"mcq","level":"TH","q":"Sắp xếp tính khử giảm dần: Mg ($-2,37$ V), Zn ($-0,76$ V), Cu ($+0,34$ V):","options":["A. Mg, Zn, Cu","B. Cu, Zn, Mg","C. Zn, Mg, Cu","D. Mg, Cu, Zn"],"answer":"A","explain":"$E^\\circ$ càng âm → tính khử càng mạnh: Mg $\\gt$ Zn $\\gt$ Cu.","points":0.25},{"type":"mcq","level":"TH","q":"Sắp xếp tính oxi hóa tăng dần: $\\mathrm{Mg^{2+}}$, $\\mathrm{Zn^{2+}}$, $\\mathrm{Cu^{2+}}$:","options":["A. $\\mathrm{Mg^{2+}}$, $\\mathrm{Zn^{2+}}$, $\\mathrm{Cu^{2+}}$","B. $\\mathrm{Cu^{2+}}$, $\\mathrm{Zn^{2+}}$, $\\mathrm{Mg^{2+}}$","C. $\\mathrm{Zn^{2+}}$, $\\mathrm{Mg^{2+}}$, $\\mathrm{Cu^{2+}}$","D. $\\mathrm{Mg^{2+}}$, $\\mathrm{Cu^{2+}}$, $\\mathrm{Zn^{2+}}$"],"answer":"A","explain":"$E^\\circ$ càng dương → tính oxi hóa càng mạnh.","points":0.25},{"type":"mcq","level":"VD","q":"Cho pin $\\mathrm{Cu - Ag}$: $E^\\circ_{pin} = 0,46$ V. Biết $E^\\circ_{Cu^{2+}/Cu} = +0,34$ V, tính $E^\\circ_{Ag^+/Ag}$:","options":["A. $+0,80$ V","B. $+0,34$ V","C. $-0,12$ V","D. $+1,14$ V"],"answer":"A","explain":"$0,46 = E^\\circ_{Ag} - 0,34$ → $E^\\circ_{Ag} = +0,80$ V.","points":0.25},{"type":"mcq","level":"VDC","q":"Có 3 kim loại X, Y, Z với $E^\\circ_X \\lt E^\\circ_Y \\lt E^\\circ_Z$. Pin có $E^\\circ_{pin}$ lớn nhất là:","options":["A. X – Z","B. X – Y","C. Y – Z","D. cả ba bằng nhau"],"answer":"A","explain":"$E^\\circ_{pin} = E^\\circ_{cathode} - E^\\circ_{anode}$ lớn nhất khi chênh lệch $E^\\circ$ lớn nhất: X – Z.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 15):","statements":["a) $E^\\circ_{pin} = E^\\circ_{cathode} - E^\\circ_{anode}$.","b) Cực âm là anode.","c) Tính khử: Mg $\\gt$ Zn $\\gt$ Cu.","d) Tính oxi hóa: $\\mathrm{Mg^{2+} \\lt Zn^{2+} \\lt Cu^{2+}}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Pin Cu-Ag ($E^\\circ_{pin} = 0,46$ V) thì $E^\\circ_{Ag} = +0,80$ V.","b) Pin X-Z có $E^\\circ_{pin}$ lớn nhất.","c) $E^\\circ$ càng âm, tính khử càng mạnh.","d) $E^\\circ$ càng dương, tính khử càng mạnh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: $E^\\circ$ càng dương, tính OXI HÓA càng mạnh.","points":1},{"type":"short","level":"VD","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Cr - Ag}$ ($E^\\circ_{Cr^{3+}/Cr} = -0,74$ V; $E^\\circ_{Ag^+/Ag} = +0,80$ V). (đơn vị V)","answer":"1,54","explain":"$E^\\circ_{pin} = 0,80 - (-0,74) = 1,54$ V.","points":0.5},{"type":"short","level":"VDC","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Mn - Ag}$ ($E^\\circ_{Mn^{2+}/Mn} = -1,18$ V; $E^\\circ_{Ag^+/Ag} = +0,80$ V). (đơn vị V)","answer":"1,98","explain":"$E^\\circ_{pin} = 0,80 - (-1,18) = 1,98$ V.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Ứng dụng của pin điện hóa là:","options":["A. nguồn điện cho thiết bị","B. mạ điện","C. tinh luyện kim loại","D. điều chế $\\mathrm{Cl_2}$"],"answer":"A","explain":"Pin điện hóa là nguồn điện (pin, acquy); mạ điện, tinh luyện thuộc về điện phân.","points":0.25},{"type":"mcq","level":"NB","q":"Điểm giống nhau giữa pin và acquy là:","options":["A. đều biến hóa năng thành điện năng","B. đều cần nạp điện","C. đều dùng một lần","D. đều không có phản ứng hóa học"],"answer":"A","explain":"Cả pin và acquy đều là nguồn điện hóa học.","points":0.25},{"type":"mcq","level":"TH","q":"Khi acquy hoạt động (phóng điện), nó đóng vai trò:","options":["A. nguồn điện (giống pin)","B. bình điện phân","C. dây dẫn","D. cầu muối"],"answer":"A","explain":"Khi phóng điện, acquy là nguồn điện; khi nạp, nó là bình điện phân.","points":0.25},{"type":"mcq","level":"TH","q":"Khi nạp acquy, nó đóng vai trò:","options":["A. bình điện phân","B. nguồn điện","C. dây dẫn","D. cầu muối"],"answer":"A","explain":"Khi nạp (sạc), acquy là bình điện phân (tiêu thụ điện năng).","points":0.25},{"type":"mcq","level":"VD","q":"Sức điện động chuẩn của pin $\\mathrm{Zn - Ni}$ ($E^\\circ_{Zn^{2+}/Zn} = -0,76$ V; $E^\\circ_{Ni^{2+}/Ni} = -0,25$ V) là:","options":["A. $0,51$ V","B. $1,01$ V","C. $-0,51$ V","D. $0,25$ V"],"answer":"A","explain":"$E^\\circ_{pin} = -0,25 - (-0,76) = 0,51$ V.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho dãy $E^\\circ$: $\\mathrm{Al^{3+}/Al}$ $-1,66$ V; $\\mathrm{Zn^{2+}/Zn}$ $-0,76$ V; $\\mathrm{Fe^{2+}/Fe}$ $-0,44$ V. Kim loại khử được cả $\\mathrm{Zn^{2+}}$ và $\\mathrm{Fe^{2+}}$ là:","options":["A. Al","B. Zn","C. Fe","D. cả ba"],"answer":"A","explain":"Al đứng trước cả Zn và Fe → khử được cả hai ion.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Pin là nguồn điện.","b) Acquy khi phóng điện là nguồn điện.","c) Acquy khi nạp là bình điện phân.","d) Al khử được $\\mathrm{Zn^{2+}}$ và $\\mathrm{Fe^{2+}}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $E^\\circ_{pin\\ Zn-Ni} = 0,51$ V.","b) Mạ điện thuộc về điện phân.","c) Pin biến điện năng thành hóa năng.","d) Điện phân biến hóa năng thành điện năng."],"answer":["T","T","F","F"],"explain":"a), b) Đúng. c) Sai: pin biến HÓA NĂNG thành điện năng. d) Sai: điện phân biến ĐIỆN NĂNG thành hóa năng.","points":1},{"type":"short","level":"VD","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Pb - Ag}$ ($E^\\circ_{Pb^{2+}/Pb} = -0,13$ V; $E^\\circ_{Ag^+/Ag} = +0,80$ V). (đơn vị V)","answer":"0,93","explain":"$E^\\circ_{pin} = 0,80 - (-0,13) = 0,93$ V.","points":0.5},{"type":"short","level":"VDC","q":"Tính $E^\\circ_{pin}$ của pin $\\mathrm{Cd - Cu}$ ($E^\\circ_{Cd^{2+}/Cd} = -0,40$ V; $E^\\circ_{Cu^{2+}/Cu} = +0,34$ V). (đơn vị V)","answer":"0,74","explain":"$E^\\circ_{pin} = 0,34 - (-0,40) = 0,74$ V.","points":0.5}]}]}</script>
