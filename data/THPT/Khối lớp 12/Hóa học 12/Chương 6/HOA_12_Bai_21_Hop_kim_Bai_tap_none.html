iệt (thép hợp kim) khác thép thường ở:", "options": ["A. có thêm Cr, Ni, Mn...", "B. chứa nhiều C hơn", "C. không chứa Fe", "D. mềm hơn"], "answer": "A", "explain": "Thép hợp kim có thêm nguyên tố đặc biệt cho tính chất mong muốn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sợi cáp bằng hợp kim Al nặng $5$ kg chứa $4,75$ kg Al. Phần trăm Al là:", "options": ["A. $95\\%$", "B. $5\\%$", "C. $90\\%$", "D. $47,5\\%$"], "answer": "A", "explain": "$\\%Al = 4,75/5 = 95\\%$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $8,1$ gam Al vào dung dịch $\\mathrm{HNO_3}$ loãng dư thu được $2,24$ lít $\\mathrm{N_2O}$ (đktc) duy nhất. Số mol electron Al đã nhường là:", "options": ["A. $0,9$ mol", "B. $0,8$ mol", "C. $0,3$ mol", "D. $2,4$ mol"], "answer": "A", "explain": "$n_{Al} = 0,3$ mol → $n_e = 0,3 \\times 3 = 0,9$ mol.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồng thau không chứa Fe.", "b) Dây cáp điện dùng hợp kim Al.", "c) Dao kéo làm bằng thép.", "d) Thép hợp kim có thêm Cr, Ni."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cáp hợp kim Al ($5$ kg, $4,75$ kg Al) có $95\\%$ Al.", "b) $8,1$ gam Al + $\\mathrm{HNO_3}$ cho $2,24$ lít $\\mathrm{N_2O}$ thì $n_e = 0,9$ mol.", "c) $\\mathrm{Al_2O_3}$ bị CO khử.", "d) Fe không tác dụng với $\\mathrm{Cl_2}$."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c) Sai: CO KHÔNG khử được $\\mathrm{Al_2O_3}$. d) Sai: Fe cháy trong $\\mathrm{Cl_2}$ tạo $\\mathrm{FeCl_3}$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một hợp kim $\\mathrm{Fe - Cr}$ chứa $12\\%$ Cr. Khối lượng Fe trong $250$ gam hợp kim là bao nhiêu gam?", "answer": "220", "explain": "$m_{Fe} = 250 \\times 88\\% = 220$ gam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho $m$ gam Fe tác dụng với $\\mathrm{H_2SO_4}$ đặc nóng dư thu được $6,72$ lít $\\mathrm{SO_2}$ (đktc). Giá trị của $m$ là:", "answer": "11,2", "explain": "$n_{\\mathrm{SO_2}} = 0,3$ mol → $n_{Fe} = 0,2$ mol → $m = 11,2$ gam.", "points": 0.5}]}]}</script>
