, "options": ["A. $\\mathrm{Fe + CuSO_4 \\rightarrow FeSO_4 + Cu}$", "B. $\\mathrm{Cu + 2AgNO_3 \\rightarrow Cu(NO_3)_2 + 2Ag}$", "C. $\\mathrm{Zn + FeSO_4 \\rightarrow ZnSO_4 + Fe}$", "D. $\\mathrm{2Al + 3CuSO_4 \\rightarrow Al_2(SO_4)_3 + 3Cu}$"], "answer": "A", "explain": "Fe đẩy được Cu ra khỏi muối → Fe khử mạnh hơn Cu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại nào sau đây điều chế được bằng phương pháp thủy luyện?", "options": ["A. Cu", "B. Na", "C. Al", "D. K"], "answer": "A", "explain": "Thủy luyện dùng cho kim loại trung bình, yếu (Cu, Ag, Au...).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $11,2$ gam Fe tác dụng với $\\mathrm{Cl_2}$ dư. Khối lượng muối thu được là:", "options": ["A. $32,5$ gam", "B. $25,4$ gam", "C. $16,25$ gam", "D. $48,75$ gam"], "answer": "A", "explain": "$n_{Fe} = 0,2$ mol → $n_{\\mathrm{FeCl_3}} = 0,2$ mol → $m = 32,5$ gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan $10,4$ gam hỗn hợp Mg và Fe bằng HCl dư thu được $6,72$ lít $\\mathrm{H_2}$ (đktc). Phần trăm khối lượng Fe trong hỗn hợp là:", "options": ["A. $53,8\\%$", "B. $46,2\\%$", "C. $26,9\\%$", "D. $73,1\\%$"], "answer": "A", "explain": "Đặt $a$, $b$: $24a + 56b = 10,4$; $a + b = 0,3$ → $a = 0,2$ (Mg), $b = 0,1$ (Fe) → $m_{Fe} = 5,6$ gam → $53,8\\%$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau (ôn tập chương 6):", "statements": ["a) K có tính khử mạnh nhất trong K, Al, Fe, Ag.", "b) $\\mathrm{K^+}$ có tính oxi hóa yếu nhất.", "c) $\\mathrm{Fe + CuSO_4 \\rightarrow FeSO_4 + Cu}$ chứng tỏ Fe khử mạnh hơn Cu.", "d) Cu điều chế được bằng thủy luyện."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $11,2$ gam Fe + $\\mathrm{Cl_2}$ cho $32,5$ gam $\\mathrm{FeCl_3}$.", "b) Hỗn hợp Mg + Fe ($10,4$ gam) + HCl cho $6,72$ lít  gam", "C. $3,7$ gam", "D. $14,8$ gam"], "answer": "A", "explain": "$n_{CaO} = 0,1$ mol → $m = 7,4$ gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $m$ gam Zn vào dung dịch chứa $0,3$ mol $\\mathrm{CuSO_4}$. Sau phản ứng (Zn tan hết) thu được $19,2$ gam chất rắn. Giá trị của $m$ là:", "options": ["A. $19,5$ gam", "B. $13$ gam", "C. $6,5$ gam", "D. $26$ gam"], "answer": "A", "explain": "$\\mathrm{Zn + Cu^{2+} \\rightarrow Zn^{2+} + Cu}$: $n_{Cu} = 19,2/64 = 0,3$ mol → $n_{Zn} = 0,3$ mol → $m = 19,5$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Fe có $t^\\circ_{nc}$ cao nhất trong Fe, Cu, Al, Na.", "b) Mg nhẹ nhất trong Mg, Al, Fe, Pb.", "c) Tính khử tăng dần: Cu, Fe, Zn, Mg.", "d) Al điều chế bằng điện phân nóng chảy $\\mathrm{Al_2O_3}$."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $5,6$ gam CaO + nước cho $7,4$ gam $\\mathrm{Ca(OH)_2}$.", "b) $19,5$ gam Zn + $0,3$ mol $\\mathrm{CuSO_4}$ cho $19,2$ gam Cu.", "c) Duralumin là hợp kim của Al.", "d) Ăn mòn điện hóa phổ biến hơn ăn mòn hóa học."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Sức điện động của pin $\\mathrm{Zn - Ag}$ là bao nhiêu V? ($-0,76$ V; $+0,80$ V)", "answer": "1,56", "explain": "$0,80 - (-0,76) = 1,56$ V.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một mẫu thép chứa $0,5\\%$ C. Khối lượng Fe trong $4$ tấn thép là bao nhiêu tấn? (coi còn lại là Fe)", "answer": "3,98", "explain": "$m_{Fe} = 4 \\times 99,5\\% = 3,98$ tấn.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Kim loại dẫn nhiệt tốt nhất trong Au, Ag, Cu, Fe là:", "options": ["A. Ag", "B. Au", "C. Cu", "D. Fe"], "answer": "A", "explain": "Ag dẫn điện, dẫn nhiệt tốt nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kim loại cứng nhất trong các kim loại thông thường là:", "options": ["A. Cr", "B. Fe", "C. Cu", "D. Al"], "answer": "A", "explain": "Cr cứng nhất (cắt được kính).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cặp kim loại nào sau đây đều tác dụng với nước ở nhiệt độ thường?", "options": ["A. Na, K", "B. Fe, Cu", "C. Al, Zn", "D. Mg, Fe"], "answer": "A", "explain": "Kim loại kiềm Na, K tác dụng mãnh liệt với nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại nào sau đây không tác dụng với $\\mathrm{H_2SO_4}$ loãng?", "options": ["A. Cu", "B. Fe", "C. Zn", "D. Mg"], "answer": "A", "explain": "Cu đứng sau H → không đẩy được $\\mathrm{H_2}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $6,5$ gam Zn tác dụng với HCl dư. Thể tích $\\mathrm{H_2}$ (đktc) là:", "options": ["A. $2,24$ lít", "B. $1,12$ lít", "C. $4,48$ lít", "D. $3,36$ lít"], "answer": "A", "explain": "$n_{Zn} = 0,1$ mol → $V = 2,24$ lít.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hỗn hợp X gồm Cu và Al. Cho $12,3$ gam X tác dụng với $\\mathrm{H_2SO_4}$ loãng dư thu được $6,72$ lít $\\mathrm{H_2}$ (đktc). Phần trăm khối lượng Cu trong X là:", "options": ["A. $56,1\\%$", "B. $43,9\\%$", "C. $28\\%$", "D. $72\\%$"], "answer": "A", "explain": "Chỉ Al phản ứng: $n_{\\mathrm{H_2}} = 0,3$ mol → $n_{Al} = 0,2$ mol → $m_{Al} = 5,4$ gam → $m_{Cu} = 6,9$ gam → $56,1\\%$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 6):", "statements": ["a) Ag dẫn nhiệt tốt nhất trong Au, Ag, Cu, Fe.", "b) Cr cứng nhất.", "c) Na, K tác dụng với nước ở nhiệt độ thường.", "d) Cu không tác dụng với $\\mathrm{H_2SO_4}$ loãng."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $6,5$ gam Zn + HCl cho $2,24$ lít $\\mathrm{H_2}$ (đktc).", "b) Hỗn hợp Cu + Al ($12,3$ gam) + $\\mathrm{H_2SO_4}$ loãng cho $6,72$ lít $\\mathrm{H_2}$ thì $\\%Cu = 56,1\\%$.", "c) Hợp kim cứng hơn kim loại thành phần.", "d) Gỉ sắt bảo vệ sắt khỏi ăn mòn tiếp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: gỉ sắt XỐP, không bảo vệ được.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho $2,3$ gam Na tác dụng với nước dư. Thể tích $\\mathrm{H_2}$ (đktc) là bao nhiêu lít?", "answer": "1,12", "explain": "$n_{Na} = 0,1$ mol → $V = 1,12$ lít.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhúng thanh Fe vào dung dịch $\\mathrm{CuSO_4}$ dư. Sau phản ứng khối lượng thanh tăng $1,6$ gam. Khối lượng Cu bám vào thanh là bao nhiêu gam?", "answer": "12,8", "explain": "Tăng $= n \\times (64-56) = 1,6$ → $n = 0,2$ mol → $m_{Cu} = 12,8$ gam.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Kết thúc chương 6: dãy điện hóa sắp xếp theo:", "options": ["A. $E^\\circ$ tăng dần", "B. $E^\\circ$ giảm dần", "C. $M$ tăng dần", "D. độ cứng tăng dần"], "answer": "A", "explain": "Dãy điện hóa sắp xếp theo thế điện cực chuẩn tăng dần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo định luật Faraday, khối lượng chất thu được ở điện cực tỉ lệ thuận với:", "options": ["A. cường độ dòng điện và thời gian điện phân", "B. nhiệt độ của dung dịch", "C. thể tích dung dịch điện phân", "D. diện tích bề mặt điện cực"], "answer": "A", "explain": "Theo $m = \\\\frac{AIt}{nF}$, khối lượng chất tỉ lệ thuận với cường độ dòng điện $I$ và thời gian điện phân $t$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại vừa tác dụng với HCl vừa tác dụng với NaOH là:", "options": ["A. Al", "B. Fe", "C. Cu", "D. Zn"], "answer": "A", "explain": "Al lưỡng tính: tác dụng với cả acid và base.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Oxit nào sau đây bị CO khử ở nhiệt độ cao?", "options": ["A. $\\mathrm{Fe_2O_3}$", "B. $\\mathrm{Na_2O}$", "C. $\\mathrm{Al_2O_3}$", "D. MgO"], "answer": "A", "explain": "CO chỉ khử được oxit kim loại trung bình, yếu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $5,4$ gam Al tác dụng với NaOH dư. Thể tích $\\mathrm{H_2}$ (đktc) là:", "options": ["A. $6,72$ lít", "B. $3,36$ lít", "C. $13,44$ lít", "D. $2,24$ lít"], "answer": "A", "explain": "$n_{Al} = 0,2$ mol → $n_{\\mathrm{H_2}} = 0,3$ mol → $V = 6,72$ lít.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hỗn hợp X gồm Na và Al. Cho $m$ gam X tác dụng với nước dư thu được $4,48$ lít $\\mathrm{H_2}$ (đktc); cũng $m$ gam X tác dụng với NaOH dư thu được $7,84$ lít $\\mathrm{H_2}$ (đktc). Giá trị của $m$ là:", "options": ["A. $11,9$ gam", "B. $5,95$ gam", "C. $23,8$ gam", "D. $7,7$ gam"], "answer": "A", "explain": "Với nước (chỉ Na phản ứng): $n_{\\mathrm{H_2}} = 0,2$ mol → $n_{Na} = 0,4$ mol. Với NaOH: $n_{\\mathrm{H_2}} = 0,35$ mol → Al cho $0,15$ mol $\\mathrm{H_2}$ → $n_{Al} = 0,1$ mol. $m = 0,4 \\times 23 + 0,1 \\times 27 = 11,9$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 6):", "statements": ["a) Dãy điện hóa sắp xếp theo $E^\\circ$ tăng dần.", "b) $m = AIt/nF$.", "c) Al tác dụng với cả HCl và NaOH.", "d) CO khử được $\\mathrm{Fe_2O_3}$."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $5,4$ gam Al + NaOH cho $6,72$ lít $\\mathrm{H_2}$ (đktc).", "b) Hỗn hợp Na + Al ($m$ gam) cho $4,48$ lít $\\mathrm{H_2}$ với nước và $7,84$ lít với NaOH thì $m = 11,9$ gam.", "c) Al là kim loại lưỡng tính.", "d) $\\mathrm{Na_2O}$ bị CO khử."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: CO KHÔNG khử được $\\mathrm{Na_2O}$.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho $2,7$ gam Al tác dụng với $\\mathrm{H_2SO_4}$ loãng dư. Thể tích $\\mathrm{H_2}$ (đktc) là bao nhiêu lít?", "answer": "3,36", "explain": "$n_{Al} = 0,1$ mol → $V = 3,36$ lít.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hòa tan $m$ gam hỗn hợp Fe và FeO bằng HCl dư thu được $2,24$ lít $\\mathrm{H_2}$ (đktc) và $25,4$ gam $\\mathrm{FeCl_2}$. Giá trị của $m$ là bao nhiêu? ($M_{FeO} = 72$)", "answer": "12,8", "explain": "$n_{\\mathrm{H_2}} = 0,1$ mol → $n_{Fe} = 0,1$ mol; $n_{\\mathrm{FeCl_2}} = 0,2$ mol → $n_{FeO} = 0,1$ mol → $m = 5,6 + 7,2 = 12,8$ gam.", "points": 0.5}]}]}</script>
