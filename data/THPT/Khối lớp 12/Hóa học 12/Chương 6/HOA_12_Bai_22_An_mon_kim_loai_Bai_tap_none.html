{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Ăn mòn kim loại là:","options":["A. sự phá hủy kim loại do tác dụng hóa học của môi trường","B. sự hòa tan kim loại trong nước","C. sự bay hơi kim loại","D. sự nóng chảy kim loại"],"answer":"A","explain":"Ăn mòn: kim loại bị phá hủy do môi trường; bản chất là bị oxi hóa.","points":0.25},{"type":"mcq","level":"NB","q":"Bản chất của ăn mòn kim loại là kim loại bị:","options":["A. oxi hóa","B. khử","C. trung hòa","D. phân hủy"],"answer":"A","explain":"$\\mathrm{M \\rightarrow M^{n+} + ne}$ (mất electron).","points":0.25},{"type":"mcq","level":"TH","q":"Ăn mòn hóa học khác ăn mòn điện hóa ở điểm:","options":["A. không phát sinh dòng điện","B. có phát sinh dòng điện","C. kim loại bị khử","D. cần 2 điện cực"],"answer":"A","explain":"Ăn mòn hóa học: electron chuyển trực tiếp, không có dòng điện.","points":0.25},{"type":"mcq","level":"TH","q":"Ví dụ về ăn mòn hóa học là:","options":["A. Fe bị oxi hóa trong không khí khô ở nhiệt độ cao","B. Fe tiếp xúc Cu trong không khí ẩm","C. vỏ tàu biển bị ăn mòn","D. đinh sắt trong dung dịch acid"],"answer":"A","explain":"Ăn mòn hóa học: tác dụng trực tiếp với chất oxi hóa, không tạo pin.","points":0.25},{"type":"mcq","level":"VD","q":"Điều kiện xảy ra ăn mòn điện hóa gồm:","options":["A. 2 điện cực khác nhau + môi trường điện li","B. 1 kim loại + không khí khô","C. nhiệt độ cao","D. chỉ cần nước"],"answer":"A","explain":"Cần 2 điện cực khác bản chất, tiếp xúc nhau, cùng trong môi trường điện li.","points":0.25},{"type":"mcq","level":"VDC","q":"Lá Fe tiếp xúc lá Cu trong không khí ẩm. Kim loại bị ăn mòn là:","options":["A. Fe","B. Cu","C. cả hai","D. không kim loại nào"],"answer":"A","explain":"Fe ($E^\\circ = -0,44$ V) âm hơn Cu ($+0,34$ V) → Fe là cực âm → bị ăn mòn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ăn mòn là sự phá hủy kim loại do môi trường.","b) Bản chất ăn mòn là kim loại bị oxi hóa.","c) Ăn mòn hóa học không phát sinh dòng điện.","d) Fe tiếp xúc Cu trong không khí ẩm thì Fe bị ăn mòn."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ăn mòn điện hóa cần 2 điện cực khác nhau.","b) Kim loại $E^\\circ$ âm hơn bị ăn mòn.","c) Ăn mòn hóa học có phát sinh dòng điện.","d) $\\mathrm{M \\rightarrow M^{n+} + ne}$ là quá trình ăn mòn."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: ăn mòn hóa học KHÔNG phát sinh dòng điện.","points":1},{"type":"short","level":"VD","q":"Trong cặp Fe – Cu bị ăn mòn điện hóa, kim loại bị ăn mòn là kim loại nào? (viết kí hiệu)","answer":"Fe","explain":"Fe có $E^\\circ$ âm hơn → cực âm → bị ăn mòn.","points":0.5},{"type":"short","level":"VDC","q":"Trong cặp Zn – Fe bị ăn mòn điện hóa, kim loại được bảo vệ là kim loại nào? (viết kí hiệu)","answer":"Fe","explain":"Zn ($E^\\circ = -0,76$ V) âm hơn Fe ($-0,44$ V) → Zn bị ăn mòn, Fe được bảo vệ.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Trong ăn mòn điện hóa, kim loại bị ăn mòn là kim loại:","options":["A. có $E^\\circ$ âm hơn (cực âm)","B. có $E^\\circ$ dương hơn (cực dương)","C. có khối lượng lớn hơn","D. có $t^\\circ_{nc}$ cao hơn"],"answer":"A","explain":"Cực âm (anode) bị oxi hóa → bị ăn mòn.","points":0.25},{"type":"mcq","level":"NB","q":"Để bảo vệ vỏ tàu biển bằng thép, người ta gắn:","options":["A. Zn","B. Cu","C. Ag","D. Au"],"answer":"A","explain":"Zn ($E^\\circ$ âm hơn Fe) là anode hi sinh, bị ăn mòn thay vỏ tàu.","points":0.25},{"type":"mcq","level":"TH","q":"Phương pháp bảo vệ điện hóa là:","options":["A. gắn kim loại hoạt động mạnh hơn vào vật cần bảo vệ","B. sơn phủ bề mặt","C. mạ vàng","D. để trong không khí khô"],"answer":"A","explain":"Kim loại mạnh hơn (Zn, Mg) bị ăn mòn thay (anode hi sinh).","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp nào sau đây chống ăn mòn bằng cách bảo vệ bề mặt?","options":["A. sơn","B. gắn Zn","C. dùng inox","D. mạ điện hóa"],"answer":"A","explain":"Sơn ngăn kim loại tiếp xúc với môi trường.","points":0.25},{"type":"mcq","level":"VD","q":"Một chiếc đinh sắt đóng vào tấm kẽm để ngoài không khí ẩm. Kim loại bị ăn mòn là:","options":["A. Zn","B. Fe","C. cả hai","D. không kim loại nào"],"answer":"A","explain":"Zn ($-0,76$ V) âm hơn Fe ($-0,44$ V) → Zn bị ăn mòn, Fe được bảo vệ.","points":0.25},{"type":"mcq","level":"VDC","q":"Tôn lợp mái là sắt tráng kẽm. Khi lớp kẽm bị xước, kim loại bị ăn mòn trước là:","options":["A. Zn","B. Fe","C. cả hai cùng lúc","D. không bị ăn mòn"],"answer":"A","explain":"Zn âm hơn Fe → Zn bị ăn mòn trước, bảo vệ Fe (đây là ưu điểm của tôn kẽm).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kim loại $E^\\circ$ âm hơn bị ăn mòn.","b) Vỏ tàu biển gắn Zn để bảo vệ.","c) Gắn Zn là bảo vệ điện hóa.","d) Sơn là bảo vệ bề mặt."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đinh sắt + tấm kẽm (không khí ẩm) thì Zn bị ăn mòn.","b) Tôn kẽm bị xước thì Zn bị ăn mòn trước.","c) Inox là hợp kim chống gỉ.","d) Cu gắn vào vỏ tàu để bảo vệ Fe."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Cu ($E^\\circ$ dương hơn) sẽ làm Fe bị ăn mòn NHANH hơn.","points":1},{"type":"short","level":"VD","q":"Để bảo vệ đường ống thép chôn dưới đất, người ta gắn kim loại nào? (viết kí hiệu, chọn Zn hoặc Mg)","answer":"Zn","explain":"Zn/Mg ($E^\\circ$ âm hơn Fe) là anode hi sinh.","points":0.5},{"type":"short","level":"VDC","q":"Trong cặp Al – Fe bị ăn mòn điện hóa, kim loại bị ăn mòn là kim loại nào? (viết kí hiệu)","answer":"Al","explain":"Al ($-1,66$ V) âm hơn Fe ($-0,44$ V) → Al bị ăn mòn.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Ăn mòn điện hóa phát sinh:","options":["A. dòng điện","B. nhiệt","C. ánh sáng","D. khí độc"],"answer":"A","explain":"Ăn mòn điện hóa tạo pin điện hóa → có dòng điện.","points":0.25},{"type":"mcq","level":"NB","q":"Hợp kim chống gỉ là:","options":["A. inox","B. thép thường","C. gang","D. duralumin"],"answer":"A","explain":"Inox (thép không gỉ) chống ăn mòn tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Khi hai kim loại Fe và Cu tiếp xúc trong không khí ẩm, cực dương là:","options":["A. Cu","B. Fe","C. cả hai","D. không có"],"answer":"A","explain":"Cu ($E^\\circ$ dương hơn) là cực dương (cathode), được bảo vệ.","points":0.25},{"type":"mcq","level":"TH","q":"Khi hai kim loại Fe và Cu tiếp xúc trong không khí ẩm, cực âm là:","options":["A. Fe","B. Cu","C. cả hai","D. không có"],"answer":"A","explain":"Fe ($E^\\circ$ âm hơn) là cực âm (anode), bị ăn mòn.","points":0.25},{"type":"mcq","level":"VD","q":"Sắt tây (sắt tráng thiếc) bị xước, kim loại bị ăn mòn là:","options":["A. Fe","B. Sn","C. cả hai","D. không bị"],"answer":"A","explain":"Sn ($-0,14$ V) dương hơn Fe ($-0,44$ V) → Fe là cực âm → Fe bị ăn mòn (nhược điểm của sắt tây so với tôn kẽm).","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh tôn kẽm và sắt tây khi bị xước, kết luận đúng là:","options":["A. tôn kẽm bảo vệ Fe tốt hơn","B. sắt tây bảo vệ Fe tốt hơn","C. cả hai như nhau","D. cả hai đều không bảo vệ"],"answer":"A","explain":"Tôn kẽm: Zn bị ăn mòn thay Fe; sắt tây: Fe bị ăn mòn (Sn được bảo vệ).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ăn mòn điện hóa phát sinh dòng điện.","b) Inox chống gỉ.","c) Cặp Fe-Cu: Cu là cực dương.","d) Cặp Fe-Cu: Fe là cực âm."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sắt tây bị xước thì Fe bị ăn mòn.","b) Tôn kẽm bảo vệ Fe tốt hơn sắt tây.","c) $E^\\circ_{Fe} = -0,44$ V; $E^\\circ_{Sn} = -0,14$ V.","d) Sn bị ăn mòn trước Fe trong sắt tây."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Fe bị ăn mòn trước Sn.","points":1},{"type":"short","level":"VD","q":"Trong ăn mòn điện hóa, quá trình xảy ra ở cực âm là quá trình gì? (viết: oxi hóa)","answer":"oxi hóa","explain":"Cực âm (anode): oxi hóa.","points":0.5},{"type":"short","level":"VDC","q":"Trong cặp Mg – Fe bị ăn mòn điện hóa, kim loại bị ăn mòn là kim loại nào? (viết kí hiệu)","answer":"Mg","explain":"Mg ($-2,37$ V) âm hơn Fe → Mg bị ăn mòn.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng?","options":["A. ăn mòn điện hóa cần môi trường điện li","B. ăn mòn hóa học cần môi trường điện li","C. ăn mòn hóa học phát sinh dòng điện","D. mọi ăn mòn đều phát sinh dòng điện"],"answer":"A","explain":"Ăn mòn điện hóa cần môi trường điện li để tạo pin.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây sai?","options":["A. kim loại $E^\\circ$ dương hơn bị ăn mòn trong pin điện hóa","B. kim loại $E^\\circ$ âm hơn bị ăn mòn","C. anode bị ăn mòn","D. cực âm bị oxi hóa"],"answer":"A","explain":"Kim loại $E^\\circ$ ÂM hơn (cực âm) mới bị ăn mòn.","points":0.25},{"type":"mcq","level":"TH","q":"Cặp kim loại nào sau đây khi tiếp xúc trong không khí ẩm thì Fe bị ăn mòn?","options":["A. Fe – Cu","B. Fe – Zn","C. Fe – Mg","D. Fe – Al"],"answer":"A","explain":"Fe âm hơn Cu → Fe bị ăn mòn; trong các cặp còn lại Fe dương hơn → được bảo vệ.","points":0.25},{"type":"mcq","level":"TH","q":"Cặp kim loại nào sau đây khi tiếp xúc thì Fe được bảo vệ?","options":["A. Fe – Zn","B. Fe – Cu","C. Fe – Sn","D. Fe – Ag"],"answer":"A","explain":"Zn âm hơn Fe → Zn bị ăn mòn thay, Fe được bảo vệ.","points":0.25},{"type":"mcq","level":"VD","q":"Một vật bằng Fe được mạ Cu. Khi lớp mạ bị xước, kim loại bị ăn mòn là:","options":["A. Fe","B. Cu","C. cả hai","D. không bị"],"answer":"A","explain":"Fe âm hơn Cu → Fe (cực âm) bị ăn mòn.","points":0.25},{"type":"mcq","level":"VDC","q":"Một vật bằng Fe được mạ Zn. Khi lớp mạ bị xước, kim loại bị ăn mòn là:","options":["A. Zn","B. Fe","C. cả hai","D. không bị"],"answer":"A","explain":"Zn âm hơn Fe → Zn bị ăn mòn thay, Fe được bảo vệ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ăn mòn điện hóa cần môi trường điện li.","b) Kim loại $E^\\circ$ âm hơn bị ăn mòn.","c) Cặp Fe-Cu: Fe bị ăn mòn.","d) Cặp Fe-Zn: Fe được bảo vệ."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vật Fe mạ Cu bị xước thì Fe bị ăn mòn.","b) Vật Fe mạ Zn bị xước thì Zn bị ăn mòn.","c) Mạ Zn bảo vệ Fe tốt hơn mạ Cu.","d) Mạ Cu bảo vệ Fe tốt hơn mạ Zn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mạ Zn (anode hi sinh) bảo vệ tốt hơn.","points":1},{"type":"short","level":"VD","q":"Để bảo vệ chân cầu thép trong nước biển, người ta gắn thỏi kim loại nào? (viết kí hiệu)","answer":"Zn","explain":"Zn (hoặc Mg) là anode hi sinh.","points":0.5},{"type":"short","level":"VDC","q":"Trong cặp Cu – Ag bị ăn mòn điện hóa, kim loại bị ăn mòn là kim loại nào? (viết kí hiệu)","answer":"Cu","explain":"Cu ($+0,34$ V) âm hơn Ag ($+0,80$ V) → Cu bị ăn mòn.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Tổng hợp bài 22: bản chất ăn mòn kim loại là:","options":["A. $\\mathrm{M \\rightarrow M^{n+} + ne}$","B. $\\mathrm{M^{n+} + ne \\rightarrow M}$","C. $\\mathrm{M + H_2O \\rightarrow}$","D. $\\mathrm{M \\rightarrow}$ bay hơi"],"answer":"A","explain":"Kim loại nhường electron (bị oxi hóa).","points":0.25},{"type":"mcq","level":"NB","q":"Anode hi sinh là:","options":["A. kim loại hoạt động mạnh hơn, bị ăn mòn thay vật cần bảo vệ","B. kim loại quý","C. kim loại được bảo vệ","D. điện cực không bị ăn mòn"],"answer":"A","explain":"Zn, Mg gắn vào vật cần bảo vệ sẽ bị ăn mòn thay.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không nên dùng đinh sắt đóng vào tấm đồng ngoài trời?","options":["A. Fe bị ăn mòn điện hóa","B. Cu bị ăn mòn","C. đinh bị gỉ do mưa","D. đồng bị oxi hóa"],"answer":"A","explain":"Tạo pin Fe-Cu trong không khí ẩm → Fe (âm hơn) bị ăn mòn nhanh.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp chống ăn mòn hiệu quả cho tàu biển là:","options":["A. gắn Zn vào vỏ tàu","B. sơn màu đẹp","C. dùng Cu làm vỏ","D. để khô"],"answer":"A","explain":"Gắn Zn (anode hi sinh) bảo vệ vỏ thép.","points":0.25},{"type":"mcq","level":"VD","q":"Trong các cặp sau, cặp nào Fe bị ăn mòn nhanh nhất khi tiếp xúc trong không khí ẩm?","options":["A. Fe – Cu","B. Fe – Zn","C. Fe – Mg","D. Fe – Al"],"answer":"A","explain":"Fe âm hơn Cu → Fe bị ăn mòn; các cặp còn lại Fe được bảo vệ (là cực dương).","points":0.25},{"type":"mcq","level":"VDC","q":"Kim loại nào sau đây bảo vệ Fe tốt nhất khi ghép cặp làm anode hi sinh?","options":["A. Mg","B. Zn","C. Al","D. Cu"],"answer":"A","explain":"Mg có $E^\\circ = -2,37$ V âm nhất → chênh lệch thế lớn nhất → bảo vệ Fe tốt nhất (Cu không bảo vệ được vì dương hơn Fe).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 22):","statements":["a) Bản chất ăn mòn: $\\mathrm{M \\rightarrow M^{n+} + ne}$.","b) Anode hi sinh bị ăn mòn thay.","c) Không nên dùng đinh sắt với tấm đồng ngoài trời.","d) Gắn Zn bảo vệ vỏ tàu."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp Fe-Cu: Fe bị ăn mòn nhanh (không được bảo vệ).","b) Kim loại ghép càng âm hơn Fe thì càng bị ăn mòn mạnh.","c) Ăn mòn điện hóa phổ biến hơn ăn mòn hóa học.","d) Ăn mòn hóa học cần 2 kim loại."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ăn mòn hóa học KHÔNG cần 2 kim loại.","points":1},{"type":"short","level":"VD","q":"Trong ăn mòn điện hóa, Fe ở cực âm bị oxi hóa tạo thành ion nào? (viết kí hiệu)","answer":"Fe2+","explain":"Fe bị oxi hóa: $\\mathrm{Fe \\rightarrow Fe^{2+} + 2e}$.","points":0.5},{"type":"short","level":"VDC","q":"Trong cặp Sn – Pb bị ăn mòn điện hóa, kim loại bị ăn mòn là kim loại nào? (viết kí hiệu, biết $E^\\circ_{Sn} = -0,14$ V, $E^\\circ_{Pb} = -0,13$ V)","answer":"Sn","explain":"Sn ($-0,14$ V) âm hơn Pb ($-0,13$ V) → Sn bị ăn mòn.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Ôn tập bài 22: ăn mòn hóa học xảy ra khi:","options":["A. kim loại tác dụng trực tiếp với chất oxi hóa","B. có 2 kim loại tiếp xúc","C. có dòng điện ngoài","D. có môi trường điện li"],"answer":"A","explain":"Ăn mòn hóa học: electron chuyển trực tiếp cho chất oxi hóa.","points":0.25},{"type":"mcq","level":"NB","q":"Ăn mòn điện hóa xảy ra khi:","options":["A. tạo thành pin điện hóa","B. nung nóng kim loại","C. kim loại nguyên chất","D. không có nước"],"answer":"A","explain":"Ăn mòn điện hóa gắn với sự tạo thành pin.","points":0.25},{"type":"mcq","level":"TH","q":"Hiện tượng nào sau đây là ăn mòn điện hóa?","options":["A. vỏ tàu thép bị gỉ trong nước biển","B. Fe cháy trong $\\mathrm{O_2}$","C. nung Fe trong không khí khô","D. Cu nung trong $\\mathrm{O_2}$"],"answer":"A","explain":"Vỏ tàu trong nước biển: tạo nhiều pin điện hóa cục bộ → ăn mòn điện hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Hiện tượng nào sau đây là ăn mòn hóa học?","options":["A. thanh Fe nung đỏ trong không khí","B. đinh sắt trong không khí ẩm","C. vỏ tàu trong nước biển","D. tôn kẽm bị xước"],"answer":"A","explain":"Fe nung trong không khí: tác dụng trực tiếp với $\\mathrm{O_2}$ ở nhiệt độ cao.","points":0.25},{"type":"mcq","level":"VD","q":"Để chống gỉ cho cửa sắt, biện pháp đơn giản nhất là:","options":["A. sơn phủ","B. gắn Mg","C. dùng inox thay thế","D. mạ vàng"],"answer":"A","explain":"Sơn phủ bảo vệ bề mặt — đơn giản, rẻ.","points":0.25},{"type":"mcq","level":"VDC","q":"Một thanh Fe và một thanh Cu nối với nhau bằng dây dẫn, nhúng vào dung dịch NaCl. Sau một thời gian, hiện tượng là:","options":["A. thanh Fe bị ăn mòn","B. thanh Cu bị ăn mòn","C. cả hai bị ăn mòn như nhau","D. không hiện tượng"],"answer":"A","explain":"Tạo pin điện hóa Fe-Cu → Fe (cực âm) bị ăn mòn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ăn mòn hóa học: kim loại tác dụng trực tiếp với chất oxi hóa.","b) Ăn mòn điện hóa: tạo pin điện hóa.","c) Vỏ tàu bị gỉ là ăn mòn điện hóa.","d) Fe nung trong không khí là ăn mòn điện hóa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: là ăn mòn HÓA HỌC.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sơn phủ là cách chống gỉ đơn giản.","b) Pin Fe-Cu trong NaCl thì Fe bị ăn mòn.","c) Ăn mòn điện hóa phổ biến trong thực tế.","d) Ăn mòn hóa học phát sinh dòng điện."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ăn mòn hóa học KHÔNG phát sinh dòng điện.","points":1},{"type":"short","level":"VD","q":"Viết tên phương pháp bảo vệ kim loại bằng cách gắn Zn/Mg vào vật cần bảo vệ. (viết: bảo vệ điện hóa)","answer":"bảo vệ điện hóa","explain":"Bảo vệ điện hóa (anode hi sinh).","points":0.5},{"type":"short","level":"VDC","q":"Trong cặp Ni – Cu bị ăn mòn điện hóa ($E^\\circ_{Ni} = -0,25$ V, $E^\\circ_{Cu} = +0,34$ V), kim loại bị ăn mòn là kim loại nào? (viết kí hiệu)","answer":"Ni","explain":"Ni âm hơn Cu → Ni bị ăn mòn.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Tổng hợp chương 6: tính chất hóa học chung của kim loại là:","options":["A. tính khử","B. tính oxi hóa","C. lưỡng tính","D. trơ"],"answer":"A","explain":"Kim loại thể hiện tính khử.","points":0.25},{"type":"mcq","level":"NB","q":"Hợp kim là:","options":["A. vật liệu kim loại chứa từ 2 nguyên tố trở lên","B. kim loại nguyên chất","C. phi kim","D. hợp chất ion"],"answer":"A","explain":"Định nghĩa hợp kim.","points":0.25},{"type":"mcq","level":"TH","q":"Kim loại điều chế bằng điện phân nóng chảy là:","options":["A. Na","B. Fe","C. Cu","D. Ag"],"answer":"A","explain":"Na (mạnh): điện phân nóng chảy NaCl.","points":0.25},{"type":"mcq","level":"TH","q":"Kim loại bị ăn mòn khi ghép với Cu trong không khí ẩm là:","options":["A. Fe","B. Ag","C. Au","D. Pt"],"answer":"A","explain":"Fe âm hơn Cu → Fe bị ăn mòn.","points":0.25},{"type":"mcq","level":"VD","q":"Khử $16$ gam $\\mathrm{Fe_2O_3}$ bằng CO dư. Khối lượng Fe thu được là:","options":["A. $11,2$ gam","B. $5,6$ gam","C. $22,4$ gam","D. $8$ gam"],"answer":"A","explain":"$n = 0,1$ mol → $m_{Fe} = 11,2$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Sức điện động của pin Fe – Cu là: ($E^\\circ_{Fe} = -0,44$ V; $E^\\circ_{Cu} = +0,34$ V)","options":["A. $0,78$ V","B. $0,10$ V","C. $1,22$ V","D. $-0,78$ V"],"answer":"A","explain":"$0,34 - (-0,44) = 0,78$ V.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 6):","statements":["a) Kim loại có tính khử.","b) Hợp kim chứa từ 2 nguyên tố trở lên.","c) Na điều chế bằng điện phân nóng chảy.","d) Fe ghép với Cu thì Fe bị ăn mòn."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $16$ gam $\\mathrm{Fe_2O_3}$ khử bằng CO cho $11,2$ gam Fe.","b) $E^\\circ_{pin\\ Fe-Cu} = 0,78$ V.","c) Thép cứng hơn sắt.","d) Ăn mòn hóa học phát sinh dòng điện."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ăn mòn hóa học KHÔNG phát sinh dòng điện.","points":1},{"type":"short","level":"VD","q":"Cho $5,6$ gam Fe tác dụng với HCl dư. Thể tích $\\mathrm{H_2}$ (đktc) là bao nhiêu lít?","answer":"2,24","explain":"$n_{Fe} = 0,1$ mol → $V = 2,24$ lít.","points":0.5},{"type":"short","level":"VDC","q":"Điện phân nóng chảy $11,7$ gam NaCl. Khối lượng Na thu được là bao nhiêu gam?","answer":"4,6","explain":"$n_{NaCl} = 0,2$ mol → $m_{Na} = 4,6$ gam.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Ôn tập chương 6: liên kết kim loại là:","options":["A. liên kết giữa ion dương và electron tự do","B. liên kết ion","C. liên kết cộng hóa trị","D. liên kết hydrogen"],"answer":"A","explain":"Liên kết kim loại đặc trưng.","points":0.25},{"type":"mcq","level":"NB","q":"Trong ăn mòn điện hóa, kim loại có $E^\\circ$ âm hơn sẽ:","options":["A. bị ăn mòn","B. được bảo vệ","C. không phản ứng","D. tan ra"],"answer":"A","explain":"Kim loại âm hơn bị oxi hóa → bị ăn mòn.","points":0.25},{"type":"mcq","level":"TH","q":"Phản ứng nhiệt nhôm là:","options":["A. $\\mathrm{2Al + Fe_2O_3 \\rightarrow Al_2O_3 + 2Fe}$","B. $\\mathrm{Fe + CuSO_4 \\rightarrow FeSO_4 + Cu}$","C. $\\mathrm{2NaCl \\rightarrow 2Na + Cl_2}$","D. $\\mathrm{Zn + Cu^{2+} \\rightarrow Zn^{2+} + Cu}$"],"answer":"A","explain":"Nhiệt nhôm: Al khử oxit kim loại.","points":0.25},{"type":"mcq","level":"TH","q":"Thép chứa:","options":["A. dưới 2% C","B. 2–5% C","C. trên 5% C","D. không chứa C"],"answer":"A","explain":"Thép: dưới 2% C; gang: 2–5% C.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $2,7$ gam Al tác dụng với HCl dư. Thể tích $\\mathrm{H_2}$ (đktc) là:","options":["A. $3,36$ lít","B. $2,24$ lít","C. $1,12$ lít","D. $4,48$ lít"],"answer":"A","explain":"$n_{Al} = 0,1$ mol → $V = 3,36$ lít.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhúng thanh Fe vào $\\mathrm{CuSO_4}$ dư, khối lượng thanh tăng $1,6$ gam. Khối lượng Cu bám vào là:","options":["A. $12,8$ gam","B. $6,4$ gam","C. $1,6$ gam","D. $3,2$ gam"],"answer":"A","explain":"$\\Delta m = 8n = 1,6$ → $n = 0,2$ mol → $m_{Cu} = 12,8$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 6):","statements":["a) Liên kết kim loại giữa ion dương và electron tự do.","b) Ag dẫn điện tốt nhất.","c) Nhiệt nhôm: $\\mathrm{2Al + Fe_2O_3 \\rightarrow Al_2O_3 + 2Fe}$.","d) Thép chứa dưới 2% C."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $2,7$ gam Al + HCl cho $3,36$ lít $\\mathrm{H_2}$ (đktc).","b) Thanh Fe tăng $1,6$ gam thì có $12,8$ gam Cu bám vào.","c) Inox chống gỉ.","d) Gang dẻo hơn thép."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: gang GIÒN hơn thép.","points":1},{"type":"short","level":"VD","q":"Điện phân dung dịch $\\mathrm{CuSO_4}$ ($I = 1$ A) trong $9650$ s. Khối lượng Cu thu được là bao nhiêu gam?","answer":"3,2","explain":"$m = 64 \\times 9650/(2 \\times 96500) = 3,2$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cần bao nhiêu tấn quặng boxite chứa $60\\%$ $\\mathrm{Al_2O_3}$ để sản xuất $2,7$ tấn Al? (hiệu suất $100\\%$)","answer":"8,5","explain":"$m_{\\mathrm{Al_2O_3}} = 2,7/(54/102) = 5,1$ tấn → $m_{quặng} = 5,1/0,6 = 8,5$ tấn.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Trong ăn mòn điện hóa, electron chuyển từ:","options":["A. cực âm sang cực dương qua dây dẫn","B. cực dương sang cực âm","C. dung dịch sang điện cực","D. không khí sang kim loại"],"answer":"A","explain":"Electron từ anode (âm) qua dây dẫn/mạch ngoài sang cathode (dương).","points":0.25},{"type":"mcq","level":"NB","q":"Chất điện li trong ăn mòn điện hóa của Fe trong không khí ẩm là:","options":["A. nước (có hòa tan $\\mathrm{O_2}$, $\\mathrm{CO_2}$)","B. dầu mỡ","C. không khí khô","D. sơn"],"answer":"A","explain":"Màng nước mỏng trên bề mặt kim loại trong không khí ẩm là môi trường điện li.","points":0.25},{"type":"mcq","level":"TH","q":"Gỉ sắt có thành phần chính là:","options":["A. $\\mathrm{Fe_2O_3 \\cdot nH_2O}$","B. FeO","C. $\\mathrm{Fe_3O_4}$","D. $\\mathrm{Fe(OH)_2}$"],"answer":"A","explain":"Gỉ sắt là oxit sắt ngậm nước $\\mathrm{Fe_2O_3 \\cdot nH_2O}$ (xốp, không bảo vệ).","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao gỉ sắt không bảo vệ được sắt khỏi ăn mòn tiếp?","options":["A. gỉ xốp, không bám chắc","B. gỉ cứng","C. gỉ cách điện","D. gỉ không thấm nước"],"answer":"A","explain":"Lớp gỉ xốp, dễ bong → không ngăn được tiếp xúc với môi trường (khác màng $\\mathrm{Al_2O_3}$).","points":0.25},{"type":"mcq","level":"VD","q":"Một lá Fe và một lá Zn nhúng vào dung dịch NaCl và nối với nhau. Sau một thời gian, khối lượng lá Zn giảm $1,3$ gam. Số mol electron Zn đã nhường là:","options":["A. $0,04$ mol","B. $0,02$ mol","C. $0,08$ mol","D. $0,01$ mol"],"answer":"A","explain":"$n_{Zn} = 1,3/65 = 0,02$ mol → $n_e = 0,04$ mol.","points":0.25},{"type":"mcq","level":"VDC","q":"Một chi tiết máy bằng thép được bảo vệ bằng Zn. Sau 1 năm, Zn bị ăn mòn $6,5$ gam. Khối lượng Fe được bảo vệ tương đương (nếu không có Zn, Fe bị ăn mòn với cùng số mol electron) là:","options":["A. $5,6$ gam","B. $6,5$ gam","C. $11,2$ gam","D. $2,8$ gam"],"answer":"A","explain":"$n_e = 2 \\times 6,5/65 = 0,2$ mol → $n_{Fe} = 0,1$ mol → $m_{Fe} = 5,6$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Electron chuyển từ cực âm sang cực dương.","b) Nước trong không khí ẩm là môi trường điện li.","c) Gỉ sắt là $\\mathrm{Fe_2O_3 \\cdot nH_2O}$.","d) Gỉ sắt xốp, không bảo vệ được sắt."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lá Zn giảm $1,3$ gam thì đã nhường $0,04$ mol electron.","b) $6,5$ gam Zn bị ăn mòn tương đương bảo vệ $5,6$ gam Fe.","c) Màng $\\mathrm{Al_2O_3}$ bảo vệ Al khỏi ăn mòn.","d) Gỉ sắt bám chắc, ngăn ăn mòn tiếp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: gỉ sắt XỐP, dễ bong.","points":1},{"type":"short","level":"VD","q":"Viết công thức của gỉ sắt. (viết: Fe2O3.nH2O)","answer":"Fe2O3.nH2O","explain":"Gỉ sắt: $\\mathrm{Fe_2O_3 \\cdot nH_2O}$.","points":0.5},{"type":"short","level":"VDC","q":"Một tấm Fe được gắn Zn để bảo vệ. Sau một thời gian Zn giảm $3,25$ gam. Số mol Fe đã được bảo vệ khỏi ăn mòn (cùng số mol electron) là bao nhiêu?","answer":"0,05","explain":"$n_e = 2 \\times 3,25/65 = 0,1$ mol → $n_{Fe} = 0,05$ mol.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Ôn tập bài 22: kim loại bị ăn mòn trong pin điện hóa là kim loại ở:","options":["A. cực âm","B. cực dương","C. cầu muối","D. dung dịch"],"answer":"A","explain":"Cực âm (anode) bị oxi hóa → bị ăn mòn.","points":0.25},{"type":"mcq","level":"NB","q":"Cách chống ăn mòn đơn giản nhất là:","options":["A. sơn phủ bề mặt","B. gắn anode hi sinh","C. dùng hợp kim đắt tiền","D. mạ vàng"],"answer":"A","explain":"Sơn phủ ngăn tiếp xúc với môi trường — đơn giản, rẻ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Al ít bị ăn mòn trong không khí?","options":["A. có màng $\\mathrm{Al_2O_3}$ bảo vệ","B. Al là kim loại quý","C. Al không tác dụng với $\\mathrm{O_2}$","D. Al nhẹ"],"answer":"A","explain":"Màng $\\mathrm{Al_2O_3}$ mỏng, bền, bám chắc bảo vệ Al.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Cr được thêm vào thép làm inox?","options":["A. tạo màng oxit bảo vệ, chống gỉ","B. làm thép mềm hơn","C. làm thép rẻ hơn","D. tăng khối lượng"],"answer":"A","explain":"Cr tạo màng oxit bền bảo vệ thép khỏi ăn mòn.","points":0.25},{"type":"mcq","level":"VD","q":"Một cầu thép được bảo vệ bằng cách gắn $m$ kg Mg. Sau 1 năm Mg giảm $2,4$ kg. Số mol electron đã chuyển là:","options":["A. $200$ mol","B. $100$ mol","C. $400$ mol","D. $50$ mol"],"answer":"A","explain":"$n_{Mg} = 2400/24 = 100$ mol → $n_e = 200$ mol.","points":0.25},{"type":"mcq","level":"VDC","q":"Để bảo vệ $1$ tấn Fe khỏi bị ăn mòn (giả sử Fe bị oxi hóa thành $\\mathrm{Fe^{2+}}$), khối lượng Zn cần bị ăn mòn thay (cùng số mol electron) là:","options":["A. $1,16$ tấn","B. $1$ tấn","C. $0,86$ tấn","D. $2$ tấn"],"answer":"A","explain":"$n_e = 2 \\times 1000/56 = 35,71$ kmol → $n_{Zn} = 17,86$ kmol → $m_{Zn} = 17,86 \\times 65 = 1160$ kg $= 1,16$ tấn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 22):","statements":["a) Kim loại ở cực âm bị ăn mòn.","b) Sơn phủ là cách chống gỉ đơn giản.","c) Màng $\\mathrm{Al_2O_3}$ bảo vệ Al.","d) Cr giúp inox chống gỉ."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $2,4$ kg Mg bị ăn mòn cho $200$ mol electron.","b) Bảo vệ $1$ tấn Fe cần $1,16$ tấn Zn bị ăn mòn thay.","c) Ăn mòn điện hóa cần môi trường điện li.","d) Ăn mòn hóa học phổ biến hơn ăn mòn điện hóa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ăn mòn ĐIỆN HÓA phổ biến hơn.","points":1},{"type":"short","level":"VD","q":"Một lá đồng và một lá sắt nối với nhau trong không khí ẩm. Kim loại bị ăn mòn là kim loại nào? (viết kí hiệu)","answer":"Fe","explain":"Fe âm hơn Cu → Fe bị ăn mòn.","points":0.5},{"type":"short","level":"VDC","q":"Gắn $13$ gam Zn vào vỏ tàu thép. Sau một thời gian Zn giảm còn $6,5$ gam. Số mol electron Zn đã nhường là bao nhiêu?","answer":"0,2","explain":"$n_{Zn\\ phản\\ ứng} = 6,5/65 = 0,1$ mol → $n_e = 0,2$ mol.","points":0.5}]}]}</script>
