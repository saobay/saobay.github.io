{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Ester được tạo thành khi thay thế nhóm $-OH$ trong nhóm $-COOH$ của carboxylic acid bằng nhóm nào?","options":["A. $-OR'$ (gốc alkoxy)","B. $-NH_2$","C. $-Cl$","D. $-CH_3$"],"answer":"A","explain":"Theo định nghĩa: thay nhóm $-OH$ của nhóm carboxyl bằng nhóm $-OR'$ ($R'$ là gốc hydrocarbon) thì được ester.","points":0.25},{"type":"mcq","level":"NB","q":"Công thức chung của ester đơn chức là:","options":["A. $RCOOH$","B. $RCOOR'$","C. $ROR'$","D. $(RCOO)_2R'$"],"answer":"B","explain":"Ester đơn chức có công thức chung $RCOOR'$, trong đó $R$ là gốc hydrocarbon hoặc $H$, $R'$ là gốc hydrocarbon.","points":0.25},{"type":"mcq","level":"TH","q":"Số đồng phân cấu tạo là ester ứng với công thức phân tử $\\mathrm{C_3H_6O_2}$ là:","options":["A. 1","B. 2","C. 3","D. 4"],"answer":"B","explain":"Các đồng phân ester của $\\mathrm{C_3H_6O_2}$: $\\mathrm{HCOOC_2H_5}$ và $\\mathrm{CH_3COOCH_3}$ — có 2 đồng phân.","points":0.25},{"type":"mcq","level":"TH","q":"Ester $\\mathrm{CH_3COOCH_3}$ có tên gọi là:","options":["A. ethyl acetate","B. methyl formate","C. methyl acetate","D. ethyl formate"],"answer":"C","explain":"Tên ester = tên gốc $R'$ + tên gốc acid: methyl (gốc $\\mathrm{CH_3}$) + acetate (gốc của acetic acid) → methyl acetate.","points":0.25},{"type":"mcq","level":"VD","q":"Xà phòng hóa hoàn toàn $8,8$ gam ethyl acetate ($\\mathrm{CH_3COOC_2H_5}$, $M = 88$) bằng dung dịch NaOH dư, đun nóng. Khối lượng muối thu được là:","options":["A. $8,2$ gam","B. $6,8$ gam","C. $4,1$ gam","D. $9,8$ gam"],"answer":"A","explain":"$n_{ester} = 8,8/88 = 0,1$ mol. $\\mathrm{CH_3COOC_2H_5 + NaOH \\rightarrow CH_3COONa + C_2H_5OH}$ nên $n_{muối} = 0,1$ mol; $m = 0,1 \\times 82 = 8,2$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Thủy phân hoàn toàn $13,6$ gam phenyl acetate ($\\mathrm{CH_3COOC_6H_5}$, $M = 136$) trong dung dịch NaOH dư. Khối lượng NaOH đã phản ứng là:","options":["A. $4$ gam","B. $8$ gam","C. $12$ gam","D. $6$ gam"],"answer":"B","explain":"$n_{ester} = 13,6/136 = 0,1$ mol. Ester của phenol tác dụng với NaOH theo tỉ lệ $1:2$: $\\mathrm{CH_3COOC_6H_5 + 2NaOH \\rightarrow CH_3COONa + C_6H_5ONa + H_2O}$. $n_{NaOH} = 0,2$ mol → $m = 0,2 \\times 40 = 8$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về ester:","statements":["a) Ester có nhóm chức $-COO-$.","b) Phân tử ester không tạo được liên kết hydrogen liên phân tử.","c) Nhiệt độ sôi của ester cao hơn carboxylic acid có cùng phân tử khối.","d) Nhiều ester có mùi thơm đặc trưng của hoa, quả chín."],"answer":["T","T","F","T"],"explain":"a) Đúng: nhóm chức đặc trưng của ester là $-COO-$. b) Đúng: đây là lí do nhiệt độ sôi của ester thấp. c) Sai: nhiệt độ sôi của ester THẤP HƠN acid cùng $M$. d) Đúng: ví dụ isoamyl acetate mùi chuối chín.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thủy phân ester trong môi trường acid là phản ứng thuận nghịch.","b) Xà phòng hóa ester là phản ứng một chiều, tạo muối carboxylate và alcohol.","c) $\\mathrm{CH_3COOC_6H_5}$ tác dụng với NaOH theo tỉ lệ mol $1:1$.","d) Ester được điều chế bằng phản ứng ester hóa giữa acid và alcohol, xúc tác $\\mathrm{H_2SO_4}$ đặc."],"answer":["T","T","F","T"],"explain":"a) Đúng: $\\mathrm{RCOOR' + H_2O}$ thuận nghịch tạo $\\mathrm{RCOOH + R'OH}$. b) Đúng: phản ứng một chiều. c) Sai: ester của phenol tác dụng với NaOH theo tỉ lệ $1:2$. d) Đúng: đây là phương pháp điều chế ester trong phòng thí nghiệm.","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa hoàn toàn $4,4$ gam ethyl acetate ($M = 88$) bằng dung dịch NaOH dư. Khối lượng sodium acetate thu được là bao nhiêu gam?","answer":"4,1","explain":"$n_{ester} = 4,4/88 = 0,05$ mol → $n_{\\mathrm{CH_3COONa}} = 0,05$ mol → $m = 0,05 \\times 82 = 4,1$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Xà phòng hóa hoàn toàn $m$ gam tristearin ($M = 890$) cần vừa đủ $2,4$ gam NaOH. Giá trị của $m$ là bao nhiêu?","answer":"17,8","explain":"$n_{NaOH} = 2,4/40 = 0,06$ mol. $\\mathrm{(C_{17}H_{35}COO)_3C_3H_5 + 3NaOH \\rightarrow 3C_{17}H_{35}COONa + C_3H_5(OH)_3}$ nên $n_{tristearin} = 0,06/3 = 0,02$ mol → $m = 0,02 \\times 890 = 17,8$ gam.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Nhóm chức đặc trưng của ester là:","options":["A. $-OH$","B. $-COOH$","C. $-COO-$","D. $-CHO$"],"answer":"C","explain":"Nhóm chức đặc trưng của ester là $-COO-$ (nhóm ester).","points":0.25},{"type":"mcq","level":"NB","q":"Ester nào sau đây có mùi chuối chín, được dùng làm hương liệu?","options":["A. ethyl acetate","B. isoamyl acetate","C. methyl salicylate","D. benzyl acetate"],"answer":"B","explain":"Isoamyl acetate có mùi chuối chín đặc trưng, dùng làm hương liệu thực phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Ester được tạo bởi acetic acid ($\\mathrm{CH_3COOH}$) và methanol ($\\mathrm{CH_3OH}$) là:","options":["A. $\\mathrm{HCOOCH_3}$","B. $\\mathrm{CH_3COOCH_3}$","C. $\\mathrm{CH_3COOC_2H_5}$","D. $\\mathrm{C_2H_5COOCH_3}$"],"answer":"B","explain":"Acetic acid ($\\mathrm{CH_3COOH}$) + methanol ($\\mathrm{CH_3OH}$) → methyl acetate ($\\mathrm{CH_3COOCH_3}$) + $\\mathrm{H_2O}$.","points":0.25},{"type":"mcq","level":"TH","q":"Thủy phân $\\mathrm{CH_3COOC_2H_5}$ trong dung dịch NaOH dư, đun nóng thu được:","options":["A. $\\mathrm{CH_3COOH}$ và $\\mathrm{C_2H_5OH}$","B. $\\mathrm{CH_3COONa}$ và $\\mathrm{C_2H_5OH}$","C. $\\mathrm{C_2H_5COONa}$ và $\\mathrm{CH_3OH}$","D. $\\mathrm{HCOONa}$ và $\\mathrm{C_3H_7OH}$"],"answer":"B","explain":"Xà phòng hóa: $\\mathrm{CH_3COOC_2H_5 + NaOH \\rightarrow CH_3COONa + C_2H_5OH}$. Gốc acid giữ nguyên ($\\mathrm{CH_3COO-}$), gốc alcohol tách ra.","points":0.25},{"type":"mcq","level":"VD","q":"Số đồng phân cấu tạo là ester ứng với công thức phân tử $\\mathrm{C_4H_8O_2}$ là:","options":["A. 2","B. 3","C. 4","D. 5"],"answer":"C","explain":"Các ester $\\mathrm{C_4H_8O_2}$: $\\mathrm{HCOOC_3H_7}$, $\\mathrm{HCOOCH(CH_3)_2}$, $\\mathrm{CH_3COOC_2H_5}$, $\\mathrm{C_2H_5COOCH_3}$ — có 4 đồng phân.","points":0.25},{"type":"mcq","level":"VDC","q":"Đun nóng $4,4$ gam $\\mathrm{CH_3COOC_2H_5}$ ($M = 88$) với $100$ ml dung dịch NaOH $1M$. Sau phản ứng, cô cạn dung dịch thu được $m$ gam chất rắn khan. Giá trị của $m$ là:","options":["A. $4,1$ gam","B. $6,1$ gam","C. $8,2$ gam","D. $8,1$ gam"],"answer":"B","explain":"$n_{ester} = 0,05$ mol; $n_{NaOH} = 0,1$ mol → NaOH dư $0,05$ mol. Chất rắn gồm $\\mathrm{CH_3COONa}$ ($0,05 \\times 82 = 4,1$ gam) và NaOH dư ($0,05 \\times 40 = 2$ gam) → $m = 6,1$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về tính chất vật lí của ester:","statements":["a) Ester nhẹ hơn nước và ít tan trong nước.","b) Ester tan tốt trong các dung môi hữu cơ.","c) Nhiệt độ sôi của methyl acetate ($57^\\circ C$) thấp hơn propionic acid ($141^\\circ C$) dù cùng $M = 74$.","d) Tất cả các ester đều là chất rắn ở nhiệt độ thường."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ester có $M$ nhỏ và trung bình là chất lỏng ở nhiệt độ thường.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về chất béo:","statements":["a) Chất béo là triester của glycerol với các acid béo.","b) Acid béo là carboxylic acid đơn chức, mạch dài, số nguyên tử C chẵn.","c) Dầu thực vật ở thể lỏng vì chứa nhiều gốc acid béo no.","d) Chất béo nhẹ hơn nước và không tan trong nước."],"answer":["T","T","F","T"],"explain":"a), b) Đúng theo định nghĩa. c) Sai: dầu thực vật lỏng vì chứa nhiều gốc acid béo KHÔNG NO. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa hoàn toàn $7,4$ gam methyl acetate ($\\mathrm{CH_3COOCH_3}$, $M = 74$) bằng NaOH dư. Khối lượng sodium acetate thu được là bao nhiêu gam?","answer":"8,2","explain":"$n_{ester} = 7,4/74 = 0,1$ mol → $n_{\\mathrm{CH_3COONa}} = 0,1$ mol → $m = 0,1 \\times 82 = 8,2$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân hoàn toàn $8,9$ gam tristearin ($M = 890$) bằng dung dịch NaOH dư. Khối lượng glycerol thu được là bao nhiêu gam?","answer":"0,92","explain":"$n_{tristearin} = 8,9/890 = 0,01$ mol → $n_{glycerol} = 0,01$ mol → $m = 0,01 \\times 92 = 0,92$ gam.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Chất béo là:","options":["A. triester của glycerol với acid béo","B. ester của glycerol với acid vô cơ","C. muối của acid béo với kim loại kiềm","D. hỗn hợp của glycerol và acid béo"],"answer":"A","explain":"Chất béo là triester của glycerol ($\\mathrm{C_3H_5(OH)_3}$) với các acid béo, công thức chung $\\mathrm{(RCOO)_3C_3H_5}$.","points":0.25},{"type":"mcq","level":"NB","q":"Acid béo là:","options":["A. acid vô cơ có trong mỡ động vật","B. carboxylic acid đơn chức, mạch carbon dài, số C chẵn","C. amino acid có trong protein","D. acid có chứa nhóm $-NH_2$"],"answer":"B","explain":"Acid béo là các carboxylic acid đơn chức, mạch dài, số nguyên tử carbon chẵn (ví dụ palmitic, stearic, oleic, linoleic).","points":0.25},{"type":"mcq","level":"TH","q":"Chất nào sau đây KHÔNG phải là chất béo?","options":["A. $\\mathrm{(C_{17}H_{35}COO)_3C_3H_5}$","B. $\\mathrm{(C_{17}H_{33}COO)_3C_3H_5}$","C. $\\mathrm{(CH_3COO)_3C_3H_5}$","D. $\\mathrm{(C_{15}H_{31}COO)_3C_3H_5}$"],"answer":"C","explain":"$\\mathrm{CH_3COO-}$ không phải gốc acid béo (mạch quá ngắn) nên $\\mathrm{(CH_3COO)_3C_3H_5}$ không phải chất béo.","points":0.25},{"type":"mcq","level":"TH","q":"Hydrogen hóa triolein (xúc tác Ni, $t^\\circ$) thu được:","options":["A. tristearin","B. tripalmitin","C. glycerol","D. oleic acid"],"answer":"A","explain":"Triolein $\\mathrm{(C_{17}H_{33}COO)_3C_3H_5}$ cộng $3\\mathrm{H_2}$ thành tristearin $\\mathrm{(C_{17}H_{35}COO)_3C_3H_5}$ — dùng sản xuất bơ thực vật (margarine).","points":0.25},{"type":"mcq","level":"VD","q":"Xà phòng hóa hoàn toàn $8,06$ gam tripalmitin ($\\mathrm{(C_{15}H_{31}COO)_3C_3H_5}$, $M = 806$) bằng NaOH dư. Khối lượng muối sodium palmitate thu được là:","options":["A. $8,34$ gam","B. $9,18$ gam","C. $8,2$ gam","D. $9,12$ gam"],"answer":"A","explain":"$n = 8,06/806 = 0,01$ mol → $n_{muối} = 0,03$ mol; $M_{\\mathrm{C_{15}H_{31}COONa}} = 278$ → $m = 0,03 \\times 278 = 8,34$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Xà phòng hóa hoàn toàn $17,8$ gam tristearin ($M = 890$) cần $V$ ml dung dịch NaOH $1M$. Giá trị của $V$ là:","options":["A. $30$ ml","B. $60$ ml","C. $90$ ml","D. $120$ ml"],"answer":"B","explain":"$n_{tristearin} = 17,8/890 = 0,02$ mol → $n_{NaOH} = 3 \\times 0,02 = 0,06$ mol → $V = 0,06$ lít $= 60$ ml.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lipid không tan trong nước nhưng tan trong dung môi hữu cơ.","b) Mỡ động vật ở thể rắn vì chứa nhiều gốc acid béo no.","c) Dầu thực vật ở thể lỏng vì chứa nhiều gốc acid béo không no.","d) Chất béo là nguồn cung cấp năng lượng quan trọng cho cơ thể."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng theo lí thuyết về lipid và chất béo.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về phản ứng của chất béo:","statements":["a) Thủy phân chất béo trong môi trường kiềm thu được glycerol và xà phòng.","b) Chất béo lỏng cộng $H_2$ tạo thành chất béo rắn.","c) Chất béo để lâu trong không khí bị oxi hóa gây ôi thiu.","d) Thủy phân tristearin trong dung dịch $H_2SO_4$ loãng thu được stearic acid và ethanol."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thủy phân chất béo cho acid béo và GLYCEROL ($\\mathrm{C_3H_5(OH)_3}$), không phải ethanol.","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa hoàn toàn $8,9$ gam tristearin ($M = 890$) cần bao nhiêu gam KOH?","answer":"1,68","explain":"$n_{tristearin} = 0,01$ mol → $n_{KOH} = 0,03$ mol → $m = 0,03 \\times 56 = 1,68$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $4,4$ gam một ester no, đơn chức, mạch hở X (đktc). Thể tích $\\mathrm{CO_2}$ thu được là $4,48$ lít. Số đồng phân cấu tạo là ester của X là:","answer":"4","explain":"$n_{\\mathrm{CO_2}} = 4,48/22,4 = 0,2$ mol. Đặt CT $\\mathrm{C_nH_{2n}O_2}$: $4,4n/(14n+32) = 0,2$ → $4,4n = 2,8n + 6,4$ → $n = 4$ → $\\mathrm{C_4H_8O_2}$ có 4 đồng phân ester.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Phản ứng ester hóa là phản ứng giữa:","options":["A. acid và alcohol tạo ester và nước","B. ester và nước tạo acid và alcohol","C. acid và base tạo muối và nước","D. alcohol và kim loại kiềm tạo alkoxide"],"answer":"A","explain":"Ester hóa: $\\mathrm{RCOOH + R'OH}$ (xúc tác $\\mathrm{H_2SO_4}$ đặc, $t^\\circ$) tạo ester và nước, là phản ứng thuận nghịch.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm của phản ứng xà phòng hóa chất béo là:","options":["A. acid béo và nước","B. glycerol và muối của acid béo (xà phòng)","C. glycerol và alcohol","D. ester và nước"],"answer":"B","explain":"Xà phòng hóa chất béo: $\\mathrm{(RCOO)_3C_3H_5 + 3NaOH \\rightarrow 3RCOONa + C_3H_5(OH)_3}$ — thu được glycerol và xà phòng.","points":0.25},{"type":"mcq","level":"TH","q":"So sánh nhiệt độ sôi: $\\mathrm{CH_3COOCH_3}$ ($M = 74$) và $\\mathrm{C_2H_5COOH}$ ($M = 74$). Khẳng định đúng là:","options":["A. $\\mathrm{CH_3COOCH_3}$ sôi cao hơn vì là ester","B. $\\mathrm{C_2H_5COOH}$ sôi cao hơn vì tạo được liên kết hydrogen liên phân tử","C. Hai chất sôi ở cùng nhiệt độ vì cùng $M$","D. Không so sánh được"],"answer":"B","explain":"Acid tạo được liên kết hydrogen liên phân tử nên nhiệt độ sôi cao hơn ester có cùng $M$ ($141^\\circ C$ so với $57^\\circ C$).","points":0.25},{"type":"mcq","level":"TH","q":"Ester nào sau đây khi thủy phân trong dung dịch NaOH dư cho 2 muối và nước?","options":["A. $\\mathrm{CH_3COOC_2H_5}$","B. $\\mathrm{HCOOCH_3}$","C. $\\mathrm{CH_3COOC_6H_5}$","D. $\\mathrm{C_2H_5COOCH_3}$"],"answer":"C","explain":"Ester của phenol $\\mathrm{CH_3COOC_6H_5 + 2NaOH \\rightarrow CH_3COONa + C_6H_5ONa + H_2O}$ cho 2 muối và nước.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $6$ gam methyl formate ($\\mathrm{HCOOCH_3}$, $M = 60$) trong dung dịch NaOH dư. Khối lượng sodium formate thu được là:","options":["A. $6,8$ gam","B. $8,2$ gam","C. $3,4$ gam","D. $4,1$ gam"],"answer":"A","explain":"$n_{ester} = 6/60 = 0,1$ mol → $n_{\\mathrm{HCOONa}} = 0,1$ mol; $M_{\\mathrm{HCOONa}} = 68$ → $m = 6,8$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm $\\mathrm{CH_3COOH}$ và $\\mathrm{CH_3COOC_2H_5}$. Cho $14,8$ gam X tác dụng vừa đủ với $200$ ml dung dịch NaOH $1M$. Khối lượng $\\mathrm{CH_3COOH}$ trong X là:","options":["A. $6$ gam","B. $8,8$ gam","C. $12$ gam","D. $3$ gam"],"answer":"A","explain":"Đặt $n_{acid} = a$, $n_{ester} = b$: $a + b = 0,2$; $60a + 88b = 14,8$ → $a = 0,1$, $b = 0,1$ → $m_{acid} = 0,1 \\times 60 = 6$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về điều chế và ứng dụng ester:","statements":["a) Trong phòng thí nghiệm, ester được điều chế bằng phản ứng ester hóa có xúc tác $\\mathrm{H_2SO_4}$ đặc.","b) Ethyl acetate được dùng làm dung môi pha sơn, keo dán.","c) Muốn tăng hiệu suất ester hóa có thể dùng dư một chất tham gia.","d) Ester không có ứng dụng nào trong thực tế."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ester có nhiều ứng dụng (hương liệu, dung môi, dược phẩm, chất dẻo...).","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $M_{\\mathrm{CH_3COOC_2H_5}} = 88$.","b) $M_{tristearin} = 890$.","c) $M_{glycerol} = 92$.","d) $M_{\\mathrm{CH_3COONa}} = 98$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $88$. b) Đúng: $890$. c) Đúng: $92$. d) Sai: $M_{\\mathrm{CH_3COONa}} = 82$ (còn $98$ là của $\\mathrm{CH_3COOK}$).","points":1},{"type":"short","level":"VD","q":"Thủy phân $8,8$ gam ethyl acetate trong dung dịch $\\mathrm{H_2SO_4}$ loãng với hiệu suất $80\\%$. Khối lượng acetic acid thu được là bao nhiêu gam?","answer":"4,8","explain":"$n_{ester} = 0,1$ mol → lí thuyết thu $0,1$ mol acid $= 6$ gam; hiệu suất $80\\%$ → $m = 6 \\times 0,8 = 4,8$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $8,8$ gam một ester no, đơn chức, mạch hở X cần vừa đủ $0,5$ mol $\\mathrm{O_2}$. Tổng số nguyên tử trong một phân tử X là:","answer":"14","explain":"$\\mathrm{C_nH_{2n}O_2 + \\frac{3n-2}{2}O_2 \\rightarrow nCO_2 + nH_2O}$. Thử $n = 4$: $n_X = 0,1$ mol, $n_{\\mathrm{O_2}} = 5 \\times 0,1 = 0,5$ mol (đúng) → X là $\\mathrm{C_4H_8O_2}$, tổng số nguyên tử $= 4 + 8 + 2 = 14$.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Ethyl acetate được ứng dụng chủ yếu làm:","options":["A. hương liệu","B. dung môi pha sơn, keo dán","C. chất tẩy rửa","D. phân bón"],"answer":"B","explain":"Ethyl acetate là dung môi hữu cơ quan trọng, dùng pha sơn, keo dán, mực in.","points":0.25},{"type":"mcq","level":"NB","q":"Dầu thực vật ở thể lỏng ở nhiệt độ thường vì:","options":["A. chứa nhiều gốc acid béo no","B. chứa nhiều gốc acid béo không no","C. có phân tử khối nhỏ","D. tan tốt trong nước"],"answer":"B","explain":"Gốc acid béo không no (có nối đôi, cấu trúc gấp khúc) làm giảm nhiệt độ nóng chảy → dầu ở thể lỏng.","points":0.25},{"type":"mcq","level":"TH","q":"Ester $\\mathrm{HCOOC_2H_5}$ có tên gọi là:","options":["A. methyl formate","B. ethyl formate","C. methyl acetate","D. ethyl acetate"],"answer":"B","explain":"Tên ester = tên gốc $R'$ + tên gốc acid: ethyl + formate → ethyl formate.","points":0.25},{"type":"mcq","level":"TH","q":"Hiện tượng dầu mỡ để lâu có mùi khó chịu là do:","options":["A. phản ứng thủy phân","B. phản ứng xà phòng hóa","C. bị oxi hóa bởi oxygen trong không khí","D. phản ứng hydrogen hóa"],"answer":"C","explain":"Chất béo bị oxi hóa bởi oxygen trong không khí tạo các hợp chất có mùi khó chịu — hiện tượng ôi thiu.","points":0.25},{"type":"mcq","level":"VD","q":"Để xà phòng hóa hoàn toàn $4,4$ gam $\\mathrm{CH_3COOC_2H_5}$ ($M = 88$) cần $V$ ml dung dịch NaOH $1M$. Giá trị của $V$ là:","options":["A. $25$ ml","B. $50$ ml","C. $100$ ml","D. $200$ ml"],"answer":"B","explain":"$n_{ester} = 4,4/88 = 0,05$ mol → $n_{NaOH} = 0,05$ mol → $V = 0,05$ lít $= 50$ ml.","points":0.25},{"type":"mcq","level":"VDC","q":"Ester X có công thức phân tử $\\mathrm{C_4H_6O_2}$, mạch hở. Xà phòng hóa $8,6$ gam X bằng NaOH dư thu được $9,4$ gam muối. Công thức cấu tạo của X là:","options":["A. $\\mathrm{CH_3COOCH=CH_2}$","B. $\\mathrm{C_2H_3COOCH_3}$","C. $\\mathrm{HCOOCH_2CH=CH_2}$","D. $\\mathrm{CH_2=CHCOOC_2H_5}$"],"answer":"B","explain":"$M_X = 86$ → $n_X = 0,1$ mol → $M_{muối} = 9,4/0,1 = 94$ → gốc acid $R$ có $M_R = 94 - 67 = 27$ ($\\mathrm{C_2H_3}$) → X là $\\mathrm{C_2H_3COOCH_3}$ (methyl acrylate).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về ứng dụng của ester và chất béo:","statements":["a) Isoamyl acetate (mùi chuối) được dùng làm hương liệu thực phẩm.","b) Chất béo là nguyên liệu sản xuất xà phòng và glycerol.","c) Dầu thực vật được hydrogen hóa để sản xuất bơ thực vật (margarine).","d) Ester không tan trong dung môi hữu cơ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ester tan tốt trong dung môi hữu cơ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thủy phân $0,1$ mol $\\mathrm{CH_3COOC_2H_5}$ trong NaOH dư thu được $0,1$ mol $\\mathrm{CH_3COONa}$.","b) Xà phòng hóa $0,1$ mol tristearin cần $0,3$ mol NaOH.","c) $13,6$ gam $\\mathrm{CH_3COOC_6H_5}$ tác dụng vừa đủ với $0,1$ mol NaOH.","d) Hydrogen hóa $1$ mol triolein cần $3$ mol $\\mathrm{H_2}$."],"answer":["T","T","F","T"],"explain":"a) Đúng: tỉ lệ $1:1$. b) Đúng: tỉ lệ $1:3$. c) Sai: $13,6$ gam $= 0,1$ mol ester phenol cần $0,2$ mol NaOH. d) Đúng: triolein có 3 gốc oleic, mỗi gốc 1 nối đôi.","points":1},{"type":"short","level":"VD","q":"Đun $6$ gam $\\mathrm{CH_3COOH}$ với $4,6$ gam $\\mathrm{C_2H_5OH}$ (xúc tác $\\mathrm{H_2SO_4}$ đặc), hiệu suất phản ứng đạt $75\\%$. Khối lượng ethyl acetate thu được là bao nhiêu gam?","answer":"6,6","explain":"$n_{acid} = 0,1$ mol; $n_{alcohol} = 0,1$ mol → lí thuyết thu $0,1$ mol ester $= 8,8$ gam; hiệu suất $75\\%$ → $m = 8,8 \\times 0,75 = 6,6$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Xà phòng hóa hoàn toàn $26,7$ gam tristearin ($M = 890$) bằng dung dịch NaOH $10\\%$, lượng NaOH dùng dư $20\\%$ so với lượng cần thiết. Khối lượng dung dịch NaOH đã dùng là bao nhiêu gam?","answer":"43,2","explain":"$n_{tristearin} = 0,03$ mol → $n_{NaOH}$ cần $= 0,09$ mol $= 3,6$ gam; dùng dư $20\\%$ → $3,6 \\times 1,2 = 4,32$ gam → $m_{dd} = 4,32/10\\% = 43,2$ gam.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Glycerol có công thức là:","options":["A. $\\mathrm{C_2H_5OH}$","B. $\\mathrm{C_3H_5(OH)_3}$","C. $\\mathrm{C_3H_7OH}$","D. $\\mathrm{HOCH_2CH_2OH}$"],"answer":"B","explain":"Glycerol (glycerin) là alcohol 3 chức: $\\mathrm{C_3H_5(OH)_3}$ hay $\\mathrm{HOCH_2-CH(OH)-CH_2OH}$.","points":0.25},{"type":"mcq","level":"NB","q":"Xà phòng là:","options":["A. ester của glycerol với acid béo","B. muối sodium/kali của các acid béo","C. muối sodium của acid vô cơ","D. alcohol có phân tử khối lớn"],"answer":"B","explain":"Xà phòng là hỗn hợp muối sodium (hoặc kali) của các acid béo, thu được khi xà phòng hóa chất béo.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác nhau cơ bản giữa chất béo và ester đơn chức thông thường là:","options":["A. chất béo không bị thủy phân","B. chất béo là triester của glycerol với acid béo","C. chất béo tan tốt trong nước","D. chất béo không có nhóm $-COO-$"],"answer":"B","explain":"Chất béo là triester của glycerol với acid béo ($\\mathrm{(RCOO)_3C_3H_5}$), còn ester đơn chức thường là $RCOOR'$.","points":0.25},{"type":"mcq","level":"TH","q":"Thủy phân tripalmitin trong dung dịch NaOH dư, đun nóng thu được:","options":["A. $\\mathrm{C_{15}H_{31}COOH}$ và glycerol","B. $\\mathrm{C_{15}H_{31}COONa}$ và glycerol","C. $\\mathrm{C_{17}H_{35}COONa}$ và ethanol","D. $\\mathrm{C_{15}H_{31}COOK}$ và methanol"],"answer":"B","explain":"$\\mathrm{(C_{15}H_{31}COO)_3C_3H_5 + 3NaOH \\rightarrow 3C_{15}H_{31}COONa + C_3H_5(OH)_3}$.","points":0.25},{"type":"mcq","level":"VD","q":"Xà phòng hóa hoàn toàn $17,8$ gam tristearin ($M = 890$) cần bao nhiêu mol NaOH?","options":["A. $0,02$ mol","B. $0,04$ mol","C. $0,06$ mol","D. $0,08$ mol"],"answer":"C","explain":"$n_{tristearin} = 17,8/890 = 0,02$ mol → $n_{NaOH} = 3 \\times 0,02 = 0,06$ mol.","points":0.25},{"type":"mcq","level":"VDC","q":"Đốt cháy hoàn toàn $7,4$ gam một ester no, đơn chức, mạch hở X thu được $13,2$ gam $\\mathrm{CO_2}$. Công thức phân tử của X là:","options":["A. $\\mathrm{C_2H_4O_2}$","B. $\\mathrm{C_3H_6O_2}$","C. $\\mathrm{C_4H_8O_2}$","D. $\\mathrm{C_5H_{10}O_2}$"],"answer":"B","explain":"$n_{\\mathrm{CO_2}} = 13,2/44 = 0,3$ mol. Đặt CT $\\mathrm{C_nH_{2n}O_2}$: $7,4n/(14n+32) = 0,3$ → $7,4n = 4,2n + 9,6$ → $n = 3$ → $\\mathrm{C_3H_6O_2}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về tính chất hóa học của ester:","statements":["a) Ester bị thủy phân trong môi trường acid khi đun nóng.","b) Ester tác dụng với dung dịch kiềm khi đun nóng (phản ứng xà phòng hóa).","c) Ester có phản ứng tráng bạc với $\\mathrm{AgNO_3/NH_3}$.","d) Ester của phenol tác dụng với NaOH cho 2 muối và nước."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: ester không có phản ứng tráng bạc (chỉ formate... không, ester nói chung không tráng bạc).","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\mathrm{CH_3COOC_2H_5}$ có $M = 88$.","b) $\\mathrm{(C_{17}H_{33}COO)_3C_3H_5}$ (triolein) có $M = 884$.","c) $\\mathrm{C_{17}H_{35}COONa}$ (sodium stearate) có $M = 306$.","d) $\\mathrm{CH_3COOC_6H_5}$ (phenyl acetate) có $M = 150$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $884$. c) Đúng: $306$. d) Sai: $M = 136$.","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa $3,7$ gam ethyl formate ($\\mathrm{HCOOC_2H_5}$, $M = 74$) bằng NaOH dư. Khối lượng sodium formate thu được là bao nhiêu gam?","answer":"3,4","explain":"$n_{ester} = 3,7/74 = 0,05$ mol → $n_{\\mathrm{HCOONa}} = 0,05$ mol → $m = 0,05 \\times 68 = 3,4$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $8,8$ gam $\\mathrm{CH_3COOC_2H_5}$ tác dụng với $150$ ml dung dịch NaOH $1M$, đun nóng. Cô cạn dung dịch sau phản ứng thu được bao nhiêu gam chất rắn khan?","answer":"10,2","explain":"$n_{ester} = 0,1$ mol; $n_{NaOH} = 0,15$ mol → NaOH dư $0,05$ mol. Chất rắn: $\\mathrm{CH_3COONa}$ ($8,2$ gam) + NaOH dư ($2$ gam) $= 10,2$ gam.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Vì sao nhiệt độ sôi của ester thấp hơn carboxylic acid có cùng phân tử khối?","options":["A. Vì ester có phân tử khối nhỏ hơn","B. Vì phân tử ester không tạo được liên kết hydrogen liên phân tử","C. Vì ester tan tốt trong nước","D. Vì ester là chất khí"],"answer":"B","explain":"Acid tạo liên kết hydrogen liên phân tử bền vững nên khó bay hơi hơn; ester không tạo được liên kết hydrogen liên phân tử nên sôi ở nhiệt độ thấp hơn.","points":0.25},{"type":"mcq","level":"NB","q":"Ester nào sau đây có mùi hoa nhài?","options":["A. isoamyl acetate","B. benzyl acetate","C. ethyl butyrate","D. methyl acetate"],"answer":"B","explain":"Benzyl acetate ($\\mathrm{CH_3COOCH_2C_6H_5}$) có mùi hoa nhài, dùng trong mỹ phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các ester sau, ester nào ít tan trong nước nhất?","options":["A. $\\mathrm{HCOOCH_3}$","B. $\\mathrm{CH_3COOCH_3}$","C. $\\mathrm{CH_3COOC_2H_5}$","D. $\\mathrm{C_2H_5COOC_2H_5}$"],"answer":"D","explain":"Độ tan của ester trong nước giảm khi phân tử khối tăng: $\\mathrm{C_2H_5COOC_2H_5}$ ($M = 102$) ít tan nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Thủy phân $\\mathrm{CH_3COOC_6H_5}$ trong dung dịch NaOH dư. Khẳng định đúng là:","options":["A. tỉ lệ mol ester : NaOH là $1:1$","B. tỉ lệ mol ester : NaOH là $1:2$, thu được 2 muối và nước","C. thu được $\\mathrm{CH_3COOH}$ và $\\mathrm{C_6H_5OH}$","D. phản ứng không xảy ra"],"answer":"B","explain":"Ester của phenol: $\\mathrm{CH_3COOC_6H_5 + 2NaOH \\rightarrow CH_3COONa + C_6H_5ONa + H_2O}$.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân hoàn toàn $10,2$ gam phenyl acetate ($M = 136$) trong dung dịch NaOH dư. Khối lượng NaOH đã phản ứng là:","options":["A. $3$ gam","B. $6$ gam","C. $9$ gam","D. $12$ gam"],"answer":"B","explain":"$n_{ester} = 10,2/136 = 0,075$ mol → $n_{NaOH} = 2 \\times 0,075 = 0,15$ mol → $m = 0,15 \\times 40 = 6$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm tristearin và tripalmitin. Xà phòng hóa hoàn toàn $16,96$ gam X cần vừa đủ $0,06$ mol NaOH. Phần trăm khối lượng của tristearin trong X là:","options":["A. $47,5\\%$","B. $52,5\\%$","C. $50\\%$","D. $55\\%$"],"answer":"B","explain":"Đặt $n_{tristearin} = a$, $n_{tripalmitin} = b$: $a + b = 0,02$; $890a + 806b = 16,96$ → $a = 0,01$ → $m_{tristearin} = 8,9$ gam → $52,5\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về khái niệm:","statements":["a) Khi thay $-OH$ của nhóm $-COOH$ bằng $-OR'$ thì được ester.","b) $R'$ trong $RCOOR'$ phải là gốc hydrocarbon.","c) $\\mathrm{HCOOCH_3}$ là một ester.","d) $\\mathrm{CH_3COOH}$ là một ester."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: $\\mathrm{CH_3COOH}$ là carboxylic acid, không phải ester.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tính chất vật lí:","statements":["a) Các ester có $M$ nhỏ là chất lỏng, nhẹ hơn nước.","b) Nhiệt độ sôi của ester tăng dần theo phân tử khối.","c) Ethyl acetate sôi ở $77^\\circ C$, thấp hơn ethanol ($78,3^\\circ C$) dù $M$ lớn hơn.","d) Chất béo chứa gốc no thường ở thể rắn."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng: ester lỏng nhẹ hơn nước; nhiệt độ sôi tăng theo $M$; ester sôi thấp hơn alcohol tương ứng do không có liên kết hydrogen; mỡ no ở thể rắn.","points":1},{"type":"short","level":"VD","q":"Điều chế ethyl acetate từ $9$ gam acetic acid với hiệu suất $80\\%$. Khối lượng ester thu được là bao nhiêu gam?","answer":"10,56","explain":"$n_{acid} = 9/60 = 0,15$ mol → lí thuyết thu $0,15$ mol ester $= 13,2$ gam; hiệu suất $80\\%$ → $m = 13,2 \\times 0,8 = 10,56$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $0,1$ mol hỗn hợp hai ester no, đơn chức, mạch hở là đồng đẳng kế tiếp thu được $0,55$ mol $\\mathrm{CO_2}$. Phần trăm số mol của ester có phân tử khối nhỏ hơn là:","answer":"50","explain":"Số C trung bình $= 0,55/0,1 = 5,5$ → hai ester là $\\mathrm{C_5H_{10}O_2}$ ($a$ mol) và $\\mathrm{C_6H_{12}O_2}$ ($b$ mol): $a + b = 0,1$; $5a + 6b = 0,55$ → $a = b = 0,05$ → $50\\%$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Phản ứng xà phòng hóa ester là phản ứng:","options":["A. thuận nghịch","B. một chiều","C. không xảy ra","D. tỏa nhiệt mạnh gây nổ"],"answer":"B","explain":"Xà phòng hóa (thủy phân ester trong môi trường kiềm) là phản ứng một chiều: $\\mathrm{RCOOR' + NaOH \\rightarrow RCOONa + R'OH}$.","points":0.25},{"type":"mcq","level":"NB","q":"Bơ thực vật (margarine) được sản xuất từ dầu thực vật bằng phản ứng:","options":["A. thủy phân","B. xà phòng hóa","C. hydrogen hóa","D. oxi hóa"],"answer":"C","explain":"Hydrogen hóa dầu thực vật (chất béo lỏng, gốc không no) thành chất béo rắn — dùng sản xuất margarine.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các chất sau, chất nào là ester?","options":["A. $\\mathrm{CH_3COOH}$","B. $\\mathrm{C_2H_5OH}$","C. $\\mathrm{CH_3COOC_2H_5}$","D. $\\mathrm{C_6H_5OH}$"],"answer":"C","explain":"$\\mathrm{CH_3COOC_2H_5}$ có nhóm chức $-COO-$ nên là ester; các chất còn lại là acid, alcohol, phenol.","points":0.25},{"type":"mcq","level":"TH","q":"Thủy phân ethyl formate ($\\mathrm{HCOOC_2H_5}$) trong dung dịch NaOH dư thu được:","options":["A. $\\mathrm{HCOONa}$ và $\\mathrm{C_2H_5OH}$","B. $\\mathrm{CH_3COONa}$ và $\\mathrm{C_2H_5OH}$","C. $\\mathrm{HCOOH}$ và $\\mathrm{C_2H_5ONa}$","D. $\\mathrm{CO_2}$ và $\\mathrm{C_2H_5OH}$"],"answer":"A","explain":"$\\mathrm{HCOOC_2H_5 + NaOH \\rightarrow HCOONa + C_2H_5OH}$.","points":0.25},{"type":"mcq","level":"VD","q":"Đun $12$ gam acetic acid với $9,2$ gam ethanol (xúc tác $\\mathrm{H_2SO_4}$ đặc), hiệu suất $60\\%$. Khối lượng ethyl acetate thu được là:","options":["A. $17,6$ gam","B. $10,56$ gam","C. $8,8$ gam","D. $5,28$ gam"],"answer":"B","explain":"$n_{acid} = 0,2$ mol; $n_{alcohol} = 0,2$ mol → lí thuyết $0,2$ mol ester $= 17,6$ gam; hiệu suất $60\\%$ → $10,56$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Xà phòng hóa hoàn toàn $m$ gam phenyl acetate ($M = 136$) bằng $200$ ml dung dịch NaOH $1M$ vừa đủ. Giá trị của $m$ là:","options":["A. $6,8$ gam","B. $13,6$ gam","C. $20,4$ gam","D. $27,2$ gam"],"answer":"B","explain":"$n_{NaOH} = 0,2$ mol; tỉ lệ ester : NaOH $= 1:2$ → $n_{ester} = 0,1$ mol → $m = 0,1 \\times 136 = 13,6$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về lipid:","statements":["a) Lipid là hợp chất hữu cơ có trong tế bào sống.","b) Lipid tan tốt trong nước.","c) Lipid tan trong các dung môi hữu cơ như ether, chloroform.","d) Chất béo thuộc loại lipid."],"answer":["T","F","T","T"],"explain":"a), c), d) Đúng. b) Sai: lipid KHÔNG tan trong nước.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\mathrm{CH_3COOCH_3}$ được tạo bởi acetic acid và methanol.","b) $\\mathrm{HCOOC_2H_5}$ thủy phân trong NaOH cho $\\mathrm{HCOONa}$.","c) Phản ứng ester hóa là phản ứng một chiều.","d) Muốn tăng hiệu suất ester hóa có thể tách nước ra khỏi hỗn hợp phản ứng."],"answer":["T","T","F","T"],"explain":"a), b) Đúng. c) Sai: ester hóa là phản ứng THUẬN NGHỊCH. d) Đúng: theo nguyên lí chuyển dịch cân bằng.","points":1},{"type":"short","level":"VD","q":"Thủy phân $8,8$ gam ethyl acetate trong dung dịch $\\mathrm{H_2SO_4}$ loãng, hiệu suất $75\\%$. Khối lượng ethanol thu được là bao nhiêu gam?","answer":"3,45","explain":"$n_{ester} = 0,1$ mol → lí thuyết $0,1$ mol ethanol $= 4,6$ gam; hiệu suất $75\\%$ → $m = 4,6 \\times 0,75 = 3,45$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Hỗn hợp X gồm $\\mathrm{CH_3COOH}$ và $\\mathrm{CH_3COOC_2H_5}$. Cho $14,8$ gam X tác dụng vừa đủ với $200$ ml dung dịch NaOH $1M$. Khối lượng $\\mathrm{CH_3COOH}$ trong X là bao nhiêu gam?","answer":"6","explain":"$n_{NaOH} = 0,2 = n_{acid} + n_{ester}$; $60a + 88b = 14,8$ với $a + b = 0,2$ → $a = 0,1$ → $m_{acid} = 6$ gam.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Số nguyên tử carbon trong các acid béo thường gặp là số:","options":["A. lẻ","B. chẵn","C. nguyên tố","D. bất kì"],"answer":"B","explain":"Các acid béo thường có số nguyên tử C chẵn: palmitic ($\\mathrm{C_{16}}$), stearic ($\\mathrm{C_{18}}$), oleic ($\\mathrm{C_{18}}$), linoleic ($\\mathrm{C_{18}}$).","points":0.25},{"type":"mcq","level":"NB","q":"Triolein ở nhiệt độ thường ở thể:","options":["A. rắn","B. lỏng","C. khí","D. plasma"],"answer":"B","explain":"Triolein chứa 3 gốc oleic không no nên ở thể lỏng (là thành phần chính của dầu thực vật).","points":0.25},{"type":"mcq","level":"TH","q":"$\\mathrm{(C_{17}H_{35}COO)_3C_3H_5}$ có tên gọi là:","options":["A. tripalmitin","B. tristearin","C. triolein","D. trilinolein"],"answer":"B","explain":"$\\mathrm{C_{17}H_{35}COOH}$ là stearic acid nên triester tương ứng là tristearin.","points":0.25},{"type":"mcq","level":"TH","q":"Sản phẩm của phản ứng hydrogen hóa triolein là:","options":["A. tripalmitin","B. tristearin","C. glycerol","D. stearic acid"],"answer":"B","explain":"Triolein ($3$ gốc $\\mathrm{C_{17}H_{33}}$) $+ 3\\mathrm{H_2} \\rightarrow$ tristearin ($3$ gốc $\\mathrm{C_{17}H_{35}}$).","points":0.25},{"type":"mcq","level":"VD","q":"Xà phòng hóa hoàn toàn $4,45$ gam tristearin ($M = 890$) cần bao nhiêu gam KOH?","options":["A. $0,42$ gam","B. $0,84$ gam","C. $1,68$ gam","D. $1,26$ gam"],"answer":"B","explain":"$n_{tristearin} = 4,45/890 = 0,005$ mol → $n_{KOH} = 0,015$ mol → $m = 0,015 \\times 56 = 0,84$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Đốt cháy hoàn toàn $8,8$ gam một ester no, đơn chức, mạch hở X cần vừa đủ $0,5$ mol $\\mathrm{O_2}$. Công thức phân tử của X là:","options":["A. $\\mathrm{C_3H_6O_2}$","B. $\\mathrm{C_4H_8O_2}$","C. $\\mathrm{C_5H_{10}O_2}$","D. $\\mathrm{C_2H_4O_2}$"],"answer":"B","explain":"$\\mathrm{C_nH_{2n}O_2}$ cần $\\frac{3n-2}{2}$ mol $\\mathrm{O_2}$/mol. Với $n = 4$: $n_X = 8,8/88 = 0,1$ mol; $n_{\\mathrm{O_2}} = 5 \\times 0,1 = 0,5$ mol (khớp) → X là $\\mathrm{C_4H_8O_2}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về điều chế ester:","statements":["a) Ester hóa là phản ứng giữa carboxylic acid và alcohol.","b) Xúc tác của phản ứng ester hóa là $\\mathrm{H_2SO_4}$ đặc.","c) Phản ứng ester hóa cần đun nóng.","d) Phản ứng ester hóa là phản ứng một chiều hoàn toàn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ester hóa là phản ứng thuận nghịch.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xà phòng hóa $8,8$ gam $\\mathrm{CH_3COOC_2H_5}$ cần $0,1$ mol NaOH.","b) $8,9$ gam tristearin xà phòng hóa cho $9,18$ gam sodium stearate.","c) Thủy phân $0,1$ mol $\\mathrm{CH_3COOC_6H_5}$ cần $0,1$ mol NaOH.","d) $6$ gam $\\mathrm{HCOOCH_3}$ xà phòng hóa cho $6,8$ gam $\\mathrm{HCOONa}$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $0,1$ mol ester cần $0,1$ mol NaOH. b) Đúng. c) Sai: cần $0,2$ mol NaOH (tỉ lệ $1:2$). d) Đúng: $0,1$ mol → $6,8$ gam.","points":1},{"type":"short","level":"VD","q":"Cần bao nhiêu gam NaOH để xà phòng hóa hoàn toàn $17,6$ gam ethyl acetate ($M = 88$)?","answer":"8","explain":"$n_{ester} = 17,6/88 = 0,2$ mol → $n_{NaOH} = 0,2$ mol → $m = 0,2 \\times 40 = 8$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân hoàn toàn $20,4$ gam phenyl acetate ($M = 136$) bằng dung dịch NaOH dư. Tổng khối lượng muối thu được là bao nhiêu gam?","answer":"29,7","explain":"$n_{ester} = 20,4/136 = 0,15$ mol → $n_{\\mathrm{CH_3COONa}} = n_{\\mathrm{C_6H_5ONa}} = 0,15$ mol → $m = 0,15 \\times 82 + 0,15 \\times 116 = 12,3 + 17,4 = 29,7$ gam.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Dầu mỡ để lâu ngày có mùi khó chịu (ôi thiu) là do:","options":["A. phản ứng thủy phân với nước","B. bị oxi hóa bởi oxygen trong không khí","C. phản ứng với $\\mathrm{CO_2}$","D. bị phân hủy bởi ánh sáng"],"answer":"B","explain":"Chất béo bị oxi hóa bởi oxygen trong không khí tạo các hợp chất có mùi khó chịu — hiện tượng ôi thiu.","points":0.25},{"type":"mcq","level":"NB","q":"Ethyl butyrate ($\\mathrm{C_3H_7COOC_2H_5}$) có mùi:","options":["A. chuối chín","B. dứa chín","C. hoa nhài","D. táo"],"answer":"B","explain":"Ethyl butyrate có mùi dứa chín, dùng làm hương liệu.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các ester sau, ester nào có nhiệt độ sôi cao nhất?","options":["A. $\\mathrm{HCOOCH_3}$ ($M = 60$)","B. $\\mathrm{CH_3COOCH_3}$ ($M = 74$)","C. $\\mathrm{CH_3COOC_2H_5}$ ($M = 88$)","D. $\\mathrm{C_2H_5COOC_2H_5}$ ($M = 102$)"],"answer":"D","explain":"Nhiệt độ sôi của ester tăng theo phân tử khối → $\\mathrm{C_2H_5COOC_2H_5}$ ($M = 102$) sôi cao nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Xà phòng hóa $\\mathrm{CH_3COOCH_3}$ bằng dung dịch KOH dư thu được:","options":["A. $\\mathrm{CH_3COOK}$ và $\\mathrm{CH_3OH}$","B. $\\mathrm{CH_3COONa}$ và $\\mathrm{CH_3OH}$","C. $\\mathrm{HCOOK}$ và $\\mathrm{C_2H_5OH}$","D. $\\mathrm{CH_3COOH}$ và $\\mathrm{CH_3OK}$"],"answer":"A","explain":"$\\mathrm{CH_3COOCH_3 + KOH \\rightarrow CH_3COOK + CH_3OH}$.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $6$ gam methyl formate ($\\mathrm{HCOOCH_3}$, $M = 60$) trong NaOH dư. Khối lượng sodium formate thu được là:","options":["A. $3,4$ gam","B. $6,8$ gam","C. $8,2$ gam","D. $13,6$ gam"],"answer":"B","explain":"$n_{ester} = 6/60 = 0,1$ mol → $m_{\\mathrm{HCOONa}} = 0,1 \\times 68 = 6,8$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm hai ester no, đơn chức, mạch hở là đồng phân của nhau. Xà phòng hóa hoàn toàn $8,8$ gam X bằng NaOH dư thu được $9,2$ gam hỗn hợp muối. Công thức phân tử của X là:","options":["A. $\\mathrm{C_3H_6O_2}$","B. $\\mathrm{C_4H_8O_2}$","C. $\\mathrm{C_5H_{10}O_2}$","D. $\\mathrm{C_2H_4O_2}$"],"answer":"B","explain":"Thử $\\mathrm{C_4H_8O_2}$ ($M = 88$): $n_X = 0,1$ mol → $M_{muối}$ trung bình $= 9,2/0,1 = 92$, phù hợp với hỗn hợp các muối $\\mathrm{HCOONa}$ ($68$) và $\\mathrm{C_2H_5COONa}$ ($96$) từ các đồng phân $\\mathrm{C_4H_8O_2}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 1):","statements":["a) Ester đơn chức có công thức chung $RCOOR'$.","b) Chất béo là triester của glycerol với acid béo.","c) Xà phòng hóa chất béo thu được glycerol và xà phòng.","d) Tất cả ester đều tan tốt trong nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ester ít tan trong nước.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $17,6$ gam $\\mathrm{CH_3COOC_2H_5}$ xà phòng hóa cần $0,2$ mol NaOH.","b) $10,2$ gam $\\mathrm{CH_3COOC_6H_5}$ tác dụng vừa đủ với $0,15$ mol NaOH.","c) Hydrogen hóa $8,84$ gam triolein ($M = 884$) cần $0,03$ mol $\\mathrm{H_2}$.","d) Đốt cháy $4,4$ gam $\\mathrm{C_4H_8O_2}$ cần $0,25$ mol $\\mathrm{O_2}$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $0,2$ mol ester cần $0,2$ mol NaOH. b) Đúng: $0,075$ mol ester phenol cần $0,15$ mol NaOH. c) Đúng: $0,01$ mol triolein cần $0,03$ mol $\\mathrm{H_2}$. d) Đúng: $0,05$ mol $\\mathrm{C_4H_8O_2}$ cần $5 \\times 0,05 = 0,25$ mol $\\mathrm{O_2}$.","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa $8,8$ gam ethyl acetate bằng dung dịch KOH dư. Khối lượng potassium acetate thu được là bao nhiêu gam?","answer":"9,8","explain":"$n_{ester} = 0,1$ mol → $n_{\\mathrm{CH_3COOK}} = 0,1$ mol; $M_{\\mathrm{CH_3COOK}} = 98$ → $m = 9,8$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đun nóng $9,2$ gam glycerol với $90$ gam stearic acid ($\\mathrm{C_{17}H_{35}COOH}$, $M = 284$) có xúc tác $\\mathrm{H_2SO_4}$ đặc, hiệu suất $80\\%$. Khối lượng tristearin thu được là bao nhiêu gam?","answer":"71,2","explain":"$n_{glycerol} = 0,1$ mol; $n_{acid} = 90/284 = 0,317$ mol (dư so với $0,3$ mol cần) → lí thuyết $0,1$ mol tristearin $= 89$ gam; hiệu suất $80\\%$ → $71,2$ gam.","points":0.5}]}]}</script>
