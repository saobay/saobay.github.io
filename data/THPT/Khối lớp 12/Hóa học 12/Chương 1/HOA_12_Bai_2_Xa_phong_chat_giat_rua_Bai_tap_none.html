<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Xà phòng là:","options":["A. ester của glycerol với acid béo","B. hỗn hợp muối sodium/kali của các acid béo","C. muối sodium của acid vô cơ","D. hỗn hợp alcohol và acid béo"],"answer":"B","explain":"Xà phòng là hỗn hợp muối sodium (hoặc kali) của các acid béo, ví dụ $\\mathrm{C_{17}H_{35}COONa}$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong phân tử xà phòng, phần ưa nước là:","options":["A. gốc hydrocarbon dài $R$","B. nhóm $-COO^-$","C. ion $Na^+$","D. nhóm $-CH_3$"],"answer":"B","explain":"Nhóm $-COO^-$ phân cực là đầu ưa nước; gốc hydrocarbon dài $R$ không phân cực là đuôi kị nước.","points":0.25},{"type":"mcq","level":"TH","q":"Xà phòng được sản xuất chủ yếu bằng cách:","options":["A. hydrogen hóa dầu thực vật","B. xà phòng hóa chất béo bằng dung dịch kiềm","C. thủy phân ester trong acid","D. oxi hóa parafin"],"answer":"B","explain":"Xà phòng hóa chất béo: $\\mathrm{(RCOO)_3C_3H_5 + 3NaOH \\rightarrow 3RCOONa + C_3H_5(OH)_3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không nên dùng xà phòng trong nước cứng?","options":["A. Xà phòng bị phân hủy trong nước cứng","B. Xà phòng tạo kết tủa với ion $\\mathrm{Ca^{2+}}$, $\\mathrm{Mg^{2+}}$, giảm tác dụng giặt rửa","C. Nước cứng làm xà phòng bay hơi","D. Xà phòng tan quá nhiều trong nước cứng"],"answer":"B","explain":"$\\mathrm{2RCOONa + Ca^{2+} \\rightarrow (RCOO)_2Ca}$ (kết tủa) $\\mathrm{+ 2Na^+}$ — vừa tốn xà phòng vừa gây ố vải.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $6,12$ gam sodium stearate ($\\mathrm{C_{17}H_{35}COONa}$, $M = 306$) tác dụng với dung dịch chứa $\\mathrm{Ca^{2+}}$ dư. Khối lượng kết tủa thu được là:","options":["A. $6,07$ gam","B. $3,035$ gam","C. $12,14$ gam","D. $6,12$ gam"],"answer":"A","explain":"$n_{xà\\ phòng} = 6,12/306 = 0,02$ mol → $n_{kết\\ tủa} = 0,01$ mol; $M_{\\mathrm{(C_{17}H_{35}COO)_2Ca}} = 607$ → $m = 6,07$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Một mẫu nước cứng chứa $0,01$ mol $\\mathrm{Ca^{2+}}$. Để kết tủa hoàn toàn ion này cần tối thiểu bao nhiêu gam sodium stearate ($M = 306$)?","options":["A. $3,06$ gam","B. $6,12$ gam","C. $9,18$ gam","D. $12,24$ gam"],"answer":"B","explain":"$\\mathrm{2C_{17}H_{35}COONa + Ca^{2+} \\rightarrow (C_{17}H_{35}COO)_2Ca + 2Na^+}$ → $n_{xà\\ phòng} = 2 \\times 0,01 = 0,02$ mol → $m = 0,02 \\times 306 = 6,12$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về xà phòng:","statements":["a) Xà phòng là muối sodium/kali của acid béo.","b) Đầu ưa nước của xà phòng là nhóm $-COO^-$.","c) Đuôi kị nước của xà phòng là gốc hydrocarbon dài.","d) Xà phòng được sản xuất từ dầu mỏ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: xà phòng sản xuất từ chất béo (thiên nhiên); chất giặt rửa tổng hợp mới từ dầu mỏ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về cơ chế giặt rửa:","statements":["a) Đuôi kị nước của xà phòng bám vào vết dầu mỡ.","b) Đầu ưa nước hướng ra ngoài tiếp xúc với nước.","c) Xà phòng tạo mixen (micelle) bao bọc vết bẩn rồi cuốn trôi theo nước.","d) Xà phòng giặt tốt hơn trong nước cứng so với nước mềm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo cơ chế tạo mixen. d) Sai: trong nước cứng xà phòng tạo kết tủa, giặt KÉM hơn.","points":1},{"type":"short","level":"VD","q":"$3,06$ gam sodium stearate ($M = 306$) tác dụng vừa đủ với $V$ ml dung dịch $\\mathrm{CaCl_2}$ $0,1M$. Giá trị của $V$ là bao nhiêu?","answer":"50","explain":"$n_{xà\\ phòng} = 0,01$ mol → $n_{\\mathrm{Ca^{2+}}} = 0,005$ mol → $V = 0,005/0,1 = 0,05$ lít $= 50$ ml.","points":0.5},{"type":"short","level":"VDC","q":"Xà phòng hóa hoàn toàn $8,9$ gam tristearin ($M = 890$) bằng NaOH dư rồi thêm $\\mathrm{CaCl_2}$ dư vào dung dịch xà phòng thu được. Khối lượng kết tủa $\\mathrm{(C_{17}H_{35}COO)_2Ca}$ ($M = 607$) tối đa thu được là bao nhiêu gam?","answer":"9,105","explain":"$n_{tristearin} = 0,01$ mol → $n_{xà\\ phòng} = 0,03$ mol → $n_{kết\\ tủa} = 0,015$ mol → $m = 0,015 \\times 607 = 9,105$ gam.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Chất giặt rửa tổng hợp được sản xuất từ:","options":["A. chất béo động vật","B. dầu mỏ","C. tinh bột","D. cellulose"],"answer":"B","explain":"Chất giặt rửa tổng hợp được tổng hợp từ dầu mỏ, không phải muối của acid béo.","points":0.25},{"type":"mcq","level":"NB","q":"Chất nào sau đây là chất giặt rửa tổng hợp?","options":["A. $\\mathrm{C_{17}H_{35}COONa}$","B. $\\mathrm{C_{12}H_{25}OSO_3Na}$","C. $\\mathrm{(C_{17}H_{35}COO)_3C_3H_5}$","D. $\\mathrm{C_3H_5(OH)_3}$"],"answer":"B","explain":"$\\mathrm{C_{12}H_{25}OSO_3Na}$ (sodium lauryl sulfate) là chất giặt rửa tổng hợp; A là xà phòng, C là chất béo, D là glycerol.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của chất giặt rửa tổng hợp so với xà phòng là:","options":["A. dễ phân hủy sinh học hơn","B. dùng được trong nước cứng","C. sản xuất từ nguyên liệu thiên nhiên","D. không gây ô nhiễm môi trường"],"answer":"B","explain":"Muối calcium của chất giặt rửa tổng hợp tan được trong nước nên không tạo kết tủa trong nước cứng.","points":0.25},{"type":"mcq","level":"TH","q":"Cơ chế tẩy rửa của chất giặt rửa tổng hợp:","options":["A. khác hoàn toàn xà phòng","B. tương tự xà phòng nhờ cấu tạo đầu ưa nước – đuôi kị nước","C. nhờ tính acid mạnh","D. nhờ tính oxi hóa mạnh"],"answer":"B","explain":"Chất giặt rửa tổng hợp cũng có đầu ưa nước ($-\\mathrm{OSO_3^-}$, $-\\mathrm{SO_3^-}$) và đuôi kị nước nên tạo mixen tương tự xà phòng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,02$ mol sodium stearate tác dụng với dung dịch $\\mathrm{MgCl_2}$ dư. Khối lượng kết tủa $\\mathrm{(C_{17}H_{35}COO)_2Mg}$ ($M = 591$) thu được là:","options":["A. $5,91$ gam","B. $11,82$ gam","C. $2,955$ gam","D. $6,07$ gam"],"answer":"A","explain":"$n_{kết\\ tủa} = 0,02/2 = 0,01$ mol → $m = 0,01 \\times 591 = 5,91$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm sodium stearate và sodium palmitate có khối lượng $5,84$ gam tác dụng vừa đủ với $0,01$ mol $\\mathrm{Ca^{2+}}$. Khối lượng sodium stearate trong X là: (biết $M_{stearate} = 306$, $M_{palmitate} = 278$)","options":["A. $3,06$ gam","B. $2,78$ gam","C. $4,59$ gam","D. $1,53$ gam"],"answer":"A","explain":"$n_{xà\\ phòng} = 2 \\times 0,01 = 0,02$ mol. Đặt $a + b = 0,02$; $306a + 278b = 5,84$ → $a = 0,01$ → $m = 3,06$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về chất giặt rửa tổng hợp:","statements":["a) Chất giặt rửa tổng hợp không phải là muối của acid béo.","b) $\\mathrm{C_{12}H_{25}C_6H_4SO_3Na}$ là một chất giặt rửa tổng hợp.","c) Chất giặt rửa tổng hợp dùng được trong nước cứng.","d) Chất giặt rửa tổng hợp có cơ chế tẩy rửa khác hẳn xà phòng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cơ chế tương tự xà phòng (tạo mixen).","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xà phòng dễ phân hủy sinh học hơn nhiều chất giặt rửa tổng hợp.","b) Phosphate trong chất giặt rửa gây hiện tượng phú dưỡng nguồn nước.","c) Nên dùng chất giặt rửa vừa đủ để bảo vệ môi trường.","d) Xà phòng giặt tốt trong nước cứng hơn chất giặt rửa tổng hợp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: trong nước cứng, chất giặt rửa tổng hợp tốt hơn xà phòng.","points":1},{"type":"short","level":"VD","q":"Nước cứng chứa $0,005$ mol $\\mathrm{Mg^{2+}}$ làm mất tác dụng của bao nhiêu gam sodium stearate ($M = 306$)?","answer":"3,06","explain":"$n_{xà\\ phòng} = 2 \\times 0,005 = 0,01$ mol → $m = 0,01 \\times 306 = 3,06$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Xà phòng hóa $17,8$ gam tristearin ($M = 890$) bằng KOH dư thu được bao nhiêu gam potassium stearate ($\\mathrm{C_{17}H_{35}COOK}$, $M = 322$)?","answer":"19,32","explain":"$n_{tristearin} = 0,02$ mol → $n_{muối} = 0,06$ mol → $m = 0,06 \\times 322 = 19,32$ gam.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Mixen (micelle) trong quá trình giặt rửa là:","options":["A. bọt khí trong nước","B. cụm phân tử chất giặt rửa bao bọc vết bẩn, đầu ưa nước hướng ra ngoài","C. kết tủa của xà phòng với $\\mathrm{Ca^{2+}}$","D. dung dịch muối ăn"],"answer":"B","explain":"Mixen là tập hợp các phân tử chất giặt rửa: đuôi kị nước chụm vào vết dầu mỡ, đầu ưa nước hướng ra nước.","points":0.25},{"type":"mcq","level":"NB","q":"Hiện tượng phú dưỡng nguồn nước do:","options":["A. ion $\\mathrm{Ca^{2+}}$","B. phosphate trong chất giặt rửa","C. xà phòng","D. dầu mỡ"],"answer":"B","explain":"Phosphate làm giàu dinh dưỡng nguồn nước → tảo phát triển mạnh → thiếu oxygen → cá chết (phú dưỡng).","points":0.25},{"type":"mcq","level":"TH","q":"Phương trình hóa học của phản ứng tạo kết tủa khi dùng xà phòng trong nước cứng là:","options":["A. $\\mathrm{RCOONa + Ca^{2+} \\rightarrow RCOOCa + Na^+}$","B. $\\mathrm{2RCOONa + Ca^{2+} \\rightarrow (RCOO)_2Ca + 2Na^+}$","C. $\\mathrm{RCOONa + Mg^{2+} \\rightarrow RCOOMg + Na^+}$","D. $\\mathrm{RCOOH + Ca^{2+} \\rightarrow (RCOO)_2Ca + 2H^+}$"],"answer":"B","explain":"Đúng tỉ lệ: $\\mathrm{2C_{17}H_{35}COONa + Ca^{2+} \\rightarrow (C_{17}H_{35}COO)_2Ca}$ (kết tủa) $\\mathrm{+ 2Na^+}$.","points":0.25},{"type":"mcq","level":"TH","q":"Để phân biệt xà phòng và chất giặt rửa tổng hợp, có thể:","options":["A. cho vào nước cứng: xà phòng tạo kết tủa, chất giặt rửa tổng hợp không","B. đốt cháy","C. cho vào nước mềm","D. ngửi mùi"],"answer":"A","explain":"Trong nước cứng, xà phòng tạo kết tủa $(RCOO)_2Ca$, còn chất giặt rửa tổng hợp không kết tủa.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $3,06$ gam sodium stearate ($M = 306$) vào dung dịch chứa $0,01$ mol $\\mathrm{CaCl_2}$. Khối lượng kết tủa thu được là:","options":["A. $6,07$ gam","B. $3,035$ gam","C. $6,12$ gam","D. $3,06$ gam"],"answer":"B","explain":"$n_{xà\\ phòng} = 0,01$ mol; $n_{\\mathrm{Ca^{2+}}} = 0,01$ mol (dư) → $n_{kết\\ tủa} = 0,005$ mol → $m = 0,005 \\times 607 = 3,035$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Xà phòng hóa hoàn toàn $m$ gam chất béo X bằng NaOH dư thu được $18,36$ gam sodium stearate ($M = 306$). Giá trị của $m$ là: (biết X chỉ chứa tristearin)","options":["A. $8,9$ gam","B. $17,8$ gam","C. $26,7$ gam","D. $13,35$ gam"],"answer":"B","explain":"$n_{muối} = 18,36/306 = 0,06$ mol → $n_{tristearin} = 0,02$ mol → $m = 0,02 \\times 890 = 17,8$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nước cứng là nước chứa nhiều ion $\\mathrm{Ca^{2+}}$, $\\mathrm{Mg^{2+}}$.","b) Xà phòng tạo kết tủa trắng với nước cứng.","c) Chất giặt rửa tổng hợp không tạo kết tủa trong nước cứng.","d) Nên giặt bằng xà phòng trong nước cứng để tiết kiệm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: trong nước cứng nên dùng chất giặt rửa tổng hợp.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\mathrm{C_{12}H_{25}OSO_3Na}$ có đầu ưa nước là $-\\mathrm{OSO_3^-}$.","b) $\\mathrm{C_{12}H_{25}OSO_3Na}$ có đuôi kị nước là $\\mathrm{C_{12}H_{25}-$.","c) Xà phòng được điều chế từ acid béo và NaOH: $\\mathrm{RCOOH + NaOH \\rightarrow RCOONa + H_2O}$.","d) Chất giặt rửa tổng hợp dễ phân hủy sinh học hơn xà phòng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: xà phòng DỄ phân hủy sinh học hơn.","points":1},{"type":"short","level":"VD","q":"Cho $9,18$ gam sodium stearate ($M = 306$) tác dụng với $\\mathrm{CaCl_2}$ dư. Khối lượng kết tủa $\\mathrm{(C_{17}H_{35}COO)_2Ca}$ ($M = 607$) thu được là bao nhiêu gam?","answer":"9,105","explain":"$n_{xà\\ phòng} = 0,03$ mol → $n_{kết\\ tủa} = 0,015$ mol → $m = 0,015 \\times 607 = 9,105$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Một loại xà phòng chứa $72\\%$ sodium stearate về khối lượng. Cần bao nhiêu gam xà phòng này để kết tủa hoàn toàn $0,02$ mol $\\mathrm{Ca^{2+}}$ trong nước cứng?","answer":"17","explain":"$n_{stearate}$ cần $= 2 \\times 0,02 = 0,04$ mol $= 12,24$ gam → $m_{xà\\ phòng} = 12,24/0,72 = 17$ gam.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Nguyên liệu chính để sản xuất xà phòng là:","options":["A. dầu mỏ","B. chất béo","C. tinh bột","D. cellulose"],"answer":"B","explain":"Xà phòng sản xuất bằng cách xà phòng hóa chất béo (mỡ động vật, dầu thực vật).","points":0.25},{"type":"mcq","level":"NB","q":"Nguyên liệu chính để sản xuất chất giặt rửa tổng hợp là:","options":["A. chất béo","B. dầu mỏ","C. protein","D. đường"],"answer":"B","explain":"Chất giặt rửa tổng hợp được tổng hợp từ dầu mỏ (các dẫn xuất của hydrocarbon).","points":0.25},{"type":"mcq","level":"TH","q":"Khi giặt rửa, đuôi kị nước của phân tử chất giặt rửa:","options":["A. hướng ra ngoài tiếp xúc với nước","B. xuyên vào vết dầu mỡ","C. tan trong nước","D. bị phân hủy"],"answer":"B","explain":"Đuôi kị nước (gốc hydrocarbon) tan trong dầu mỡ nên xuyên vào vết bẩn; đầu ưa nước hướng ra nước.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các chất sau, chất giặt rửa được trong nước cứng mà không tạo kết tủa là:","options":["A. $\\mathrm{C_{17}H_{35}COONa}$","B. $\\mathrm{C_{15}H_{31}COOK}$","C. $\\mathrm{C_{12}H_{25}OSO_3Na}$","D. $\\mathrm{(C_{17}H_{35}COO)_3C_3H_5}$"],"answer":"C","explain":"$\\mathrm{C_{12}H_{25}OSO_3Na}$ là chất giặt rửa tổng hợp, muối calcium của nó tan được nên không kết tủa trong nước cứng.","points":0.25},{"type":"mcq","level":"VD","q":"Xà phòng hóa $4,45$ gam tristearin ($M = 890$) bằng NaOH dư. Khối lượng sodium stearate thu được là:","options":["A. $4,59$ gam","B. $9,18$ gam","C. $6,12$ gam","D. $3,06$ gam"],"answer":"A","explain":"$n_{tristearin} = 0,005$ mol → $n_{muối} = 0,015$ mol → $m = 0,015 \\times 306 = 4,59$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $12,24$ gam sodium stearate ($M = 306$) tác dụng với dung dịch chứa $0,03$ mol $\\mathrm{CaCl_2}$. Khối lượng kết tủa thu được là:","options":["A. $12,14$ gam","B. $18,21$ gam","C. $6,07$ gam","D. $9,105$ gam"],"answer":"A","explain":"$n_{xà\\ phòng} = 0,04$ mol; $n_{\\mathrm{Ca^{2+}}} = 0,03$ mol → $\\mathrm{Ca^{2+}}$ dư, xà phòng hết → $n_{kết\\ tủa} = 0,02$ mol → $m = 0,02 \\times 607 = 12,14$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xà phòng là muối của acid béo.","b) Chất giặt rửa tổng hợp là muối của acid béo.","c) Cả xà phòng và chất giặt rửa tổng hợp đều tạo mixen khi giặt.","d) Xà phòng thân thiện với môi trường hơn vì dễ phân hủy sinh học."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: chất giặt rửa tổng hợp KHÔNG phải muối của acid béo. c), d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $6,12$ gam sodium stearate phản ứng vừa đủ với $0,01$ mol $\\mathrm{Ca^{2+}}$.","b) $3,06$ gam sodium stearate cho $3,035$ gam kết tủa với $\\mathrm{Ca^{2+}}$ dư.","c) Xà phòng hóa $8,9$ gam tristearin thu được $9,18$ gam sodium stearate.","d) $0,01$ mol $\\mathrm{Mg^{2+}}$ làm mất tác dụng của $6,12$ gam sodium stearate."],"answer":["T","T","T","T"],"explain":"a) Đúng: $0,02$ mol xà phòng cần $0,01$ mol $\\mathrm{Ca^{2+}}$. b) Đúng: $0,005$ mol kết tủa $= 3,035$ gam. c) Đúng. d) Đúng: $0,01$ mol $\\mathrm{Mg^{2+}}$ cần $0,02$ mol xà phòng $= 6,12$ gam.","points":1},{"type":"short","level":"VD","q":"Điều chế xà phòng từ $8,9$ gam tristearin ($M = 890$). Khối lượng NaOH tối thiểu cần dùng là bao nhiêu gam?","answer":"1,2","explain":"$n_{tristearin} = 0,01$ mol → $n_{NaOH} = 0,03$ mol → $m = 0,03 \\times 40 = 1,2$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $100$ ml dung dịch $\\mathrm{CaCl_2}$ $0,2M$ tác dụng với lượng dư sodium stearate. Khối lượng kết tủa $\\mathrm{(C_{17}H_{35}COO)_2Ca}$ ($M = 607$) thu được là bao nhiêu gam?","answer":"12,14","explain":"$n_{\\mathrm{Ca^{2+}}} = 0,02$ mol → $n_{kết\\ tủa} = 0,02$ mol → $m = 0,02 \\times 607 = 12,14$ gam.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Phản ứng điều chế xà phòng từ acid béo là:","options":["A. $\\mathrm{RCOOH + NaOH \\rightarrow RCOONa + H_2O}$","B. $\\mathrm{RCOOH + Na \\rightarrow RCOONa + H_2}$","C. $\\mathrm{RCOOR' + NaOH \\rightarrow RCOONa + R'OH}$","D. $\\mathrm{(RCOO)_3C_3H_5 + 3H_2O \\rightarrow 3RCOOH + C_3H_5(OH)_3}$"],"answer":"A","explain":"Acid béo trung hòa bởi kiềm: $\\mathrm{RCOOH + NaOH \\rightarrow RCOONa + H_2O}$.","points":0.25},{"type":"mcq","level":"NB","q":"Để bảo vệ môi trường nước, nên chọn chất giặt rửa:","options":["A. chứa nhiều phosphate","B. dễ phân hủy sinh học, không chứa phosphate","C. có tính tẩy rửa mạnh nhất","D. rẻ tiền nhất"],"answer":"B","explain":"Phosphate gây phú dưỡng; nên dùng loại dễ phân hủy sinh học và dùng vừa đủ.","points":0.25},{"type":"mcq","level":"TH","q":"Cho các chất: (1) $\\mathrm{C_{17}H_{35}COONa}$, (2) $\\mathrm{C_{12}H_{25}OSO_3Na}$, (3) $\\mathrm{(C_{17}H_{35}COO)_3C_3H_5}$. Chất giặt rửa được trong nước cứng là:","options":["A. (1)","B. (2)","C. (3)","D. (1) và (3)"],"answer":"B","explain":"Chỉ (2) là chất giặt rửa tổng hợp, không tạo kết tủa trong nước cứng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi cho xà phòng vào nước cứng, hiện tượng quan sát được là:","options":["A. tạo bọt nhiều, giặt sạch","B. xuất hiện kết tủa trắng, ít bọt","C. dung dịch chuyển màu xanh","D. có khí thoát ra"],"answer":"B","explain":"Xà phòng tạo kết tủa trắng $\\mathrm{(RCOO)_2Ca}$ với nước cứng nên ít bọt, giặt kém.","points":0.25},{"type":"mcq","level":"VD","q":"Trung hòa $2,84$ gam stearic acid ($\\mathrm{C_{17}H_{35}COOH}$, $M = 284$) bằng NaOH vừa đủ. Khối lượng sodium stearate thu được là:","options":["A. $3,06$ gam","B. $2,84$ gam","C. $6,12$ gam","D. $3,22$ gam"],"answer":"A","explain":"$n_{acid} = 0,01$ mol → $n_{muối} = 0,01$ mol → $m = 0,01 \\times 306 = 3,06$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Xà phòng hóa $26,7$ gam tristearin ($M = 890$) bằng dung dịch KOH dư. Khối lượng potassium stearate ($M = 322$) thu được là:","options":["A. $19,32$ gam","B. $28,98$ gam","C. $27,54$ gam","D. $9,66$ gam"],"answer":"B","explain":"$n_{tristearin} = 0,03$ mol → $n_{muối} = 0,09$ mol → $m = 0,09 \\times 322 = 28,98$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\mathrm{C_{17}H_{35}COONa}$ là thành phần chính của xà phòng.","b) Glycerol là sản phẩm phụ khi sản xuất xà phòng từ chất béo.","c) Xà phòng có tính kiềm nhẹ nên có thể gây khô da.","d) Xà phòng tan tốt trong dầu mỡ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: xà phòng tan tốt trong NƯỚC (nhờ đầu ưa nước), chỉ đuôi kị nước tan trong dầu mỡ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sodium lauryl sulfate có trong dầu gội đầu.","b) Sodium dodecylbenzene sulfonate có trong bột giặt.","c) Chất giặt rửa tổng hợp giặt được bằng máy.","d) Tất cả chất giặt rửa tổng hợp đều dễ phân hủy sinh học."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: một số loại khó phân hủy, gây ô nhiễm.","points":1},{"type":"short","level":"VD","q":"Một mẫu nước cứng chứa $0,02$ mol $\\mathrm{Ca^{2+}}$ và $0,01$ mol $\\mathrm{Mg^{2+}}$. Khối lượng sodium stearate ($M = 306$) bị mất tác dụng là bao nhiêu gam?","answer":"18,36","explain":"Tổng $n_{ion} = 0,03$ mol → $n_{xà\\ phòng} = 0,06$ mol → $m = 0,06 \\times 306 = 18,36$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Xà phòng hóa hoàn toàn $13,35$ gam tristearin ($M = 890$) bằng NaOH dư. Khối lượng glycerol thu được là bao nhiêu gam?","answer":"1,38","explain":"$n_{tristearin} = 13,35/890 = 0,015$ mol → $n_{glycerol} = 0,015$ mol → $m = 0,015 \\times 92 = 1,38$ gam.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Sản phẩm phụ thu được khi xà phòng hóa chất béo là:","options":["A. ethanol","B. glycerol","C. nước","D. $\\mathrm{CO_2}$"],"answer":"B","explain":"$\\mathrm{(RCOO)_3C_3H_5 + 3NaOH \\rightarrow 3RCOONa + C_3H_5(OH)_3}$ (glycerol).","points":0.25},{"type":"mcq","level":"NB","q":"Chất giặt rửa tổng hợp có tính tẩy rửa nhờ:","options":["A. tính acid mạnh","B. cấu tạo đầu ưa nước – đuôi kị nước tạo mixen","C. tính oxi hóa mạnh","D. tạo bọt nhiều"],"answer":"B","explain":"Cơ chế tương tự xà phòng: tạo mixen bao bọc vết bẩn rồi cuốn trôi.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây KHÔNG đúng?","options":["A. Xà phòng được sản xuất từ chất béo","B. Chất giặt rửa tổng hợp được sản xuất từ dầu mỏ","C. Xà phòng dùng tốt trong nước cứng","D. Chất giặt rửa tổng hợp dùng được trong nước cứng"],"answer":"C","explain":"Xà phòng tạo kết tủa trong nước cứng nên giặt kém — đây là nhược điểm của xà phòng.","points":0.25},{"type":"mcq","level":"TH","q":"Để tăng hiệu quả giặt rửa trong nước cứng, nên:","options":["A. dùng nhiều xà phòng hơn","B. dùng chất giặt rửa tổng hợp thay xà phòng","C. đun sôi xà phòng","D. pha thêm acid"],"answer":"B","explain":"Chất giặt rửa tổng hợp không tạo kết tủa trong nước cứng nên giặt hiệu quả.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $6,12$ gam sodium stearate tác dụng với $\\mathrm{MgCl_2}$ dư. Khối lượng kết tủa $\\mathrm{(C_{17}H_{35}COO)_2Mg}$ ($M = 591$) là:","options":["A. $5,91$ gam","B. $11,82$ gam","C. $2,955$ gam","D. $6,07$ gam"],"answer":"A","explain":"$n_{xà\\ phòng} = 0,02$ mol → $n_{kết\\ tủa} = 0,01$ mol → $m = 5,91$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm $\\mathrm{C_{17}H_{35}COONa}$ ($M = 306$) và $\\mathrm{C_{15}H_{31}COONa}$ ($M = 278$). Cho $11,68$ gam X tác dụng vừa đủ với $0,02$ mol $\\mathrm{Ca^{2+}}$. Khối lượng $\\mathrm{C_{17}H_{35}COONa}$ trong X là:","options":["A. $6,12$ gam","B. $5,56$ gam","C. $3,06$ gam","D. $8,9$ gam"],"answer":"A","explain":"$n_{xà\\ phòng} = 0,04$ mol. Đặt $a + b = 0,04$; $306a + 278b = 11,68$ → $28a = 0,56$ → $a = 0,02$ → $m = 6,12$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đầu ưa nước của chất giặt rửa tan tốt trong nước.","b) Đuôi kị nước của chất giặt rửa tan trong dầu mỡ.","c) Mixen giúp cuốn trôi vết bẩn theo nước.","d) Chất giặt rửa làm sạch nhờ phản ứng hóa học với vết bẩn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: làm sạch chủ yếu nhờ cơ chế vật lí (tạo mixen, cuốn trôi), không phải phản ứng hóa học với vết bẩn.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $2,84$ gam stearic acid trung hòa vừa đủ bởi $0,01$ mol NaOH.","b) $4,45$ gam tristearin xà phòng hóa cho $4,59$ gam sodium stearate.","c) $0,02$ mol $\\mathrm{Ca^{2+}}$ kết tủa hoàn toàn $0,02$ mol sodium stearate.","d) $26,7$ gam tristearin xà phòng hóa cho $28,98$ gam potassium stearate."],"answer":["T","T","F","T"],"explain":"a) Đúng: $0,01$ mol acid cần $0,01$ mol NaOH. b) Đúng. c) Sai: $0,02$ mol $\\mathrm{Ca^{2+}}$ cần $0,04$ mol xà phòng. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa $8,06$ gam tripalmitin ($M = 806$) bằng KOH dư. Khối lượng potassium palmitate ($\\mathrm{C_{15}H_{31}COOK}$, $M = 294$) thu được là bao nhiêu gam?","answer":"8,82","explain":"$n = 0,01$ mol → $n_{muối} = 0,03$ mol → $m = 0,03 \\times 294 = 8,82$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Một bánh xà phòng nặng $100$ gam chứa $80\\%$ sodium stearate. Cần xà phòng hóa bao nhiêu gam tristearin ($M = 890$) để thu được lượng sodium stearate có trong bánh xà phòng này?","answer":"77,56","explain":"$m_{stearate} = 80$ gam → $n = 80/306$ mol → $n_{tristearin} = 80/(306 \\times 3)$ mol → $m = 80 \\times 890/(306 \\times 3) = 77,56$ gam.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Khi giặt, đầu ưa nước của phân tử xà phòng:","options":["A. chui vào vết dầu mỡ","B. hướng ra ngoài tiếp xúc với nước","C. bị phân hủy","D. tạo kết tủa"],"answer":"B","explain":"Đầu ưa nước ($-COO^-$) hướng ra ngoài tiếp xúc với nước, đuôi kị nước chui vào vết dầu mỡ.","points":0.25},{"type":"mcq","level":"NB","q":"Sodium dodecylbenzene sulfonate ($\\mathrm{C_{12}H_{25}C_6H_4SO_3Na}$) có trong:","options":["A. xà phòng cục","B. bột giặt","C. dầu ăn","D. nước mắm"],"answer":"B","explain":"Đây là chất giặt rửa tổng hợp điển hình có trong bột giặt.","points":0.25},{"type":"mcq","level":"TH","q":"So sánh xà phòng và chất giặt rửa tổng hợp, phát biểu đúng là:","options":["A. cả hai đều là muối của acid béo","B. xà phòng từ chất béo, chất giặt rửa tổng hợp từ dầu mỏ","C. cả hai đều không dùng được trong nước cứng","D. cả hai đều khó phân hủy sinh học"],"answer":"B","explain":"Xà phòng: muối của acid béo, từ chất béo. Chất giặt rửa tổng hợp: không phải muối acid béo, từ dầu mỏ.","points":0.25},{"type":"mcq","level":"TH","q":"Cho dung dịch xà phòng vào dung dịch $\\mathrm{CaCl_2}$, hiện tượng là:","options":["A. xuất hiện kết tủa trắng","B. dung dịch chuyển màu vàng","C. có khí không màu thoát ra","D. không có hiện tượng gì"],"answer":"A","explain":"$\\mathrm{2C_{17}H_{35}COONa + CaCl_2 \\rightarrow (C_{17}H_{35}COO)_2Ca}$ (kết tủa trắng) $\\mathrm{+ 2NaCl}$.","points":0.25},{"type":"mcq","level":"VD","q":"Xà phòng hóa hoàn toàn $m$ gam tripalmitin ($M = 806$) bằng NaOH dư thu được $8,34$ gam sodium palmitate ($M = 278$). Giá trị của $m$ là:","options":["A. $4,03$ gam","B. $8,06$ gam","C. $12,09$ gam","D. $16,12$ gam"],"answer":"B","explain":"$n_{muối} = 8,34/278 = 0,03$ mol → $n_{tripalmitin} = 0,01$ mol → $m = 8,06$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $200$ ml dung dịch hỗn hợp $\\mathrm{CaCl_2}$ $0,1M$ và $\\mathrm{MgCl_2}$ $0,1M$ tác dụng với sodium stearate dư. Khối lượng kết tủa thu được là: (biết $M_{\\mathrm{(C_{17}H_{35}COO)_2Ca}} = 607$, $M_{\\mathrm{(C_{17}H_{35}COO)_2Mg}} = 591$)","options":["A. $11,98$ gam","B. $23,96$ gam","C. $5,99$ gam","D. $17,97$ gam"],"answer":"B","explain":"$n_{\\mathrm{Ca^{2+}}} = n_{\\mathrm{Mg^{2+}}} = 0,02$ mol → $m = 0,02 \\times 607 + 0,02 \\times 591 = 12,14 + 11,82 = 23,96$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phân tử chất giặt rửa gồm đầu ưa nước và đuôi kị nước.","b) Đầu ưa nước tan trong dầu mỡ.","c) Đuôi kị nước là gốc hydrocarbon dài.","d) Chất giặt rửa làm sạch nhờ tạo mixen cuốn trôi vết bẩn."],"answer":["T","F","T","T"],"explain":"a), c), d) Đúng. b) Sai: đầu ưa nước tan trong NƯỚC.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $12,24$ gam sodium stearate tác dụng vừa đủ với $0,02$ mol $\\mathrm{Ca^{2+}}$.","b) $100$ ml $\\mathrm{CaCl_2}$ $0,2M$ cho $12,14$ gam kết tủa với xà phòng dư.","c) Xà phòng hóa $13,35$ gam tristearin thu được $1,38$ gam glycerol.","d) $8,06$ gam tripalmitin xà phòng hóa cần $1,2$ gam NaOH."],"answer":["T","T","T","T"],"explain":"a) Đúng: $0,04$ mol xà phòng cần $0,02$ mol $\\mathrm{Ca^{2+}}$. b) Đúng: $0,02$ mol kết tủa $= 12,14$ gam. c) Đúng: $0,015$ mol glycerol. d) Đúng: $0,01$ mol tripalmitin cần $0,03$ mol NaOH $= 1,2$ gam.","points":1},{"type":"short","level":"VD","q":"Cần bao nhiêu ml dung dịch NaOH $2M$ để trung hòa hoàn toàn $5,68$ gam stearic acid ($M = 284$)?","answer":"10","explain":"$n_{acid} = 5,68/284 = 0,02$ mol → $n_{NaOH} = 0,02$ mol → $V = 0,02/2 = 0,01$ lít $= 10$ ml.","points":0.5},{"type":"short","level":"VDC","q":"Xà phòng hóa $44,5$ gam tristearin ($M = 890$) bằng dung dịch NaOH $20\\%$, dùng dư $10\\%$ so với lượng cần. Khối lượng dung dịch NaOH đã dùng là bao nhiêu gam?","answer":"33","explain":"$n_{tristearin} = 0,05$ mol → $n_{NaOH}$ cần $= 0,15$ mol $= 6$ gam; dùng dư $10\\%$ → $6,6$ gam → $m_{dd} = 6,6/20\\% = 33$ gam.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Chất nào sau đây KHÔNG phải là chất giặt rửa?","options":["A. $\\mathrm{C_{17}H_{35}COONa}$","B. $\\mathrm{C_{12}H_{25}OSO_3Na}$","C. $\\mathrm{NaCl}$","D. $\\mathrm{C_{12}H_{25}C_6H_4SO_3Na}$"],"answer":"C","explain":"$\\mathrm{NaCl}$ là muối ăn, không có cấu tạo đầu ưa nước – đuôi kị nước nên không giặt rửa được.","points":0.25},{"type":"mcq","level":"NB","q":"Sodium lauryl sulfate ($\\mathrm{C_{12}H_{25}OSO_3Na}$) thường có trong:","options":["A. dầu gội đầu, sữa tắm","B. xà phòng cục","C. nước mắm","D. dầu ăn"],"answer":"A","explain":"Sodium lauryl sulfate là chất tạo bọt, tẩy rửa dịu nhẹ có trong dầu gội, sữa tắm.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây đúng về nước cứng?","options":["A. Nước cứng chứa nhiều $\\mathrm{Na^+}$, $\\mathrm{K^+}$","B. Nước cứng chứa nhiều $\\mathrm{Ca^{2+}}$, $\\mathrm{Mg^{2+}}$","C. Nước cứng giặt tốt với xà phòng","D. Nước cứng không ảnh hưởng đến xà phòng"],"answer":"B","explain":"Nước cứng chứa nhiều ion $\\mathrm{Ca^{2+}}$, $\\mathrm{Mg^{2+}}$ gây kết tủa với xà phòng.","points":0.25},{"type":"mcq","level":"TH","q":"Trong công nghiệp, glycerol thu được từ quá trình:","options":["A. thủy phân tinh bột","B. xà phòng hóa chất béo","C. lên men rượu","D. chưng cất dầu mỏ"],"answer":"B","explain":"Xà phòng hóa chất béo cho glycerol là sản phẩm phụ có giá trị.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $15,3$ gam sodium stearate ($M = 306$) tác dụng với dung dịch $\\mathrm{CaCl_2}$ dư. Khối lượng kết tủa thu được là:","options":["A. $15,175$ gam","B. $30,35$ gam","C. $7,5875$ gam","D. $15,3$ gam"],"answer":"A","explain":"$n_{xà\\ phòng} = 0,05$ mol → $n_{kết\\ tủa} = 0,025$ mol → $m = 0,025 \\times 607 = 15,175$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Xà phòng hóa hoàn toàn $8,48$ gam chất béo X (chỉ chứa tristearin và tripalmitin) bằng NaOH dư thu được $8,76$ gam hỗn hợp muối sodium. Phần trăm khối lượng của tristearin trong X là: ($M_{tristearin} = 890$, $M_{tripalmitin} = 806$, $M_{stearate} = 306$, $M_{palmitate} = 278$)","options":["A. $47,5\\%$","B. $52,5\\%$","C. $50\\%$","D. $55\\%$"],"answer":"B","explain":"Đặt $a$, $b$ là số mol tristearin, tripalmitin: $890a + 806b = 8,48$; $918a + 834b = 8,76$ → $a = b = 0,005$ → $m_{tristearin} = 4,45$ gam → $4,45/8,48 = 52,5\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 2):","statements":["a) Xà phòng là muối Na/K của acid béo.","b) Chất giặt rửa tổng hợp được sản xuất từ dầu mỏ.","c) Cả hai loại đều làm sạch nhờ cơ chế tạo mixen.","d) Chất giặt rửa tổng hợp nào cũng dễ phân hủy sinh học."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: một số loại khó phân hủy.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $5,68$ gam stearic acid cần $10$ ml NaOH $2M$ để trung hòa.","b) $44,5$ gam tristearin xà phòng hóa cần $6,6$ gam NaOH (dư $10\\%$).","c) $15,3$ gam sodium stearate cho $15,175$ gam kết tủa với $\\mathrm{Ca^{2+}}$ dư.","d) $0,03$ mol $\\mathrm{Ca^{2+}}$ cần $0,03$ mol sodium stearate để kết tủa hoàn toàn."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần $0,06$ mol xà phòng (tỉ lệ $2:1$).","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa $16,12$ gam tripalmitin ($M = 806$) bằng NaOH dư. Khối lượng sodium palmitate ($M = 278$) thu được là bao nhiêu gam?","answer":"16,68","explain":"$n = 16,12/806 = 0,02$ mol → $n_{muối} = 0,06$ mol → $m = 0,06 \\times 278 = 16,68$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Một mẫu xà phòng chứa $60\\%$ potassium stearate ($M = 322$). Cần bao nhiêu gam mẫu xà phòng này để kết tủa hoàn toàn $0,03$ mol $\\mathrm{Mg^{2+}}$?","answer":"32,2","explain":"$n_{stearate}$ cần $= 0,06$ mol $= 19,32$ gam → $m_{mẫu} = 19,32/0,6 = 32,2$ gam.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Khi xà phòng hóa chất béo, ngoài xà phòng còn thu được:","options":["A. ethanol","B. glycerol","C. nước","D. acid béo"],"answer":"B","explain":"Sản phẩm phụ có giá trị là glycerol ($\\mathrm{C_3H_5(OH)_3}$).","points":0.25},{"type":"mcq","level":"NB","q":"Ưu điểm nổi bật nhất của chất giặt rửa tổng hợp so với xà phòng là:","options":["A. rẻ hơn","B. giặt được trong nước cứng","C. dễ phân hủy hơn","D. có mùi thơm hơn"],"answer":"B","explain":"Chất giặt rửa tổng hợp không tạo kết tủa trong nước cứng — ưu điểm nổi bật nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy chất nào sau đây đều là chất giặt rửa?","options":["A. $\\mathrm{C_{17}H_{35}COONa}$, $\\mathrm{NaCl}$","B. $\\mathrm{C_{12}H_{25}OSO_3Na}$, $\\mathrm{C_{12}H_{25}C_6H_4SO_3Na}$","C. $\\mathrm{(C_{17}H_{35}COO)_3C_3H_5}$, $\\mathrm{C_3H_5(OH)_3}$","D. $\\mathrm{CH_3COOC_2H_5}$, $\\mathrm{C_2H_5OH}$"],"answer":"B","explain":"Cả hai đều là chất giặt rửa tổng hợp có cấu tạo đầu ưa nước – đuôi kị nước.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây sai?","options":["A. Xà phòng tạo mixen khi giặt","B. Chất giặt rửa tổng hợp tạo mixen khi giặt","C. Nước cứng chứa nhiều $\\mathrm{Ca^{2+}}$, $\\mathrm{Mg^{2+}}$","D. Xà phòng được sản xuất từ dầu mỏ"],"answer":"D","explain":"Xà phòng sản xuất từ chất béo (thiên nhiên), không phải từ dầu mỏ.","points":0.25},{"type":"mcq","level":"VD","q":"Trung hòa $5,68$ gam stearic acid ($M = 284$) bằng dung dịch NaOH vừa đủ. Khối lượng sodium stearate thu được là:","options":["A. $6,12$ gam","B. $5,68$ gam","C. $3,06$ gam","D. $9,18$ gam"],"answer":"A","explain":"$n_{acid} = 5,68/284 = 0,02$ mol → $m_{muối} = 0,02 \\times 306 = 6,12$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Xà phòng hóa hoàn toàn $m$ gam tristearin ($M = 890$) bằng KOH dư thu được $16,1$ gam potassium stearate ($M = 322$). Giá trị của $m$ là:","options":["A. $8,9$ gam","B. $13,35$ gam","C. $14,83$ gam","D. $17,8$ gam"],"answer":"C","explain":"$n_{muối} = 16,1/322 = 0,05$ mol → $n_{tristearin} = 0,05/3$ mol → $m = 0,05 \\times 890/3 = 14,83$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xà phòng giặt sạch nhờ tạo mixen cuốn trôi vết bẩn.","b) Chất giặt rửa tổng hợp cũng giặt sạch nhờ tạo mixen.","c) Nước cứng làm giảm hiệu quả của xà phòng.","d) Nước cứng làm giảm hiệu quả của chất giặt rửa tổng hợp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chất giặt rửa tổng hợp vẫn tốt trong nước cứng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $5,68$ gam stearic acid trung hòa cho $6,12$ gam sodium stearate.","b) $16,1$ gam potassium stearate điều chế từ $14,83$ gam tristearin.","c) $0,02$ mol $\\mathrm{Ca^{2+}}$ cần $0,04$ mol xà phòng để kết tủa hết.","d) $8,48$ gam hỗn hợp tristearin–tripalmitin (tỉ lệ mol $1:1$) cho $8,76$ gam muối."],"answer":["T","T","T","T"],"explain":"a) Đúng: $0,02$ mol. b) Đúng. c) Đúng: tỉ lệ $2:1$. d) Đúng: $0,005$ mol mỗi chất.","points":1},{"type":"short","level":"VD","q":"Một mẫu nước cứng chứa $0,015$ mol $\\mathrm{Ca^{2+}}$. Khối lượng potassium stearate ($M = 322$) bị mất tác dụng là bao nhiêu gam?","answer":"9,66","explain":"$n_{muối} = 2 \\times 0,015 = 0,03$ mol → $m = 0,03 \\times 322 = 9,66$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Xà phòng hóa $35,6$ gam tristearin ($M = 890$) bằng dung dịch KOH $25\\%$, dùng dư $20\\%$ so với lượng cần. Khối lượng dung dịch KOH đã dùng là bao nhiêu gam?","answer":"32,256","explain":"$n_{tristearin} = 0,04$ mol → $n_{KOH}$ cần $= 0,12$ mol $= 6,72$ gam; dùng dư $20\\%$ → $6,72 \\times 1,2 = 8,064$ gam → $m_{dd} = 8,064/0,25 = 32,256$ gam.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Thành phần chính của xà phòng cục là:","options":["A. $\\mathrm{C_{17}H_{35}COONa}$","B. $\\mathrm{C_{12}H_{25}OSO_3Na}$","C. $\\mathrm{(C_{17}H_{35}COO)_3C_3H_5}$","D. $\\mathrm{Na_2CO_3}$"],"answer":"A","explain":"Sodium stearate là thành phần tẩy rửa chính của xà phòng cục.","points":0.25},{"type":"mcq","level":"NB","q":"Để hạn chế hiện tượng phú dưỡng nguồn nước, cần:","options":["A. dùng nhiều chất giặt rửa chứa phosphate","B. dùng chất giặt rửa không chứa phosphate, dễ phân hủy sinh học","C. xả thẳng nước giặt ra sông","D. dùng xà phòng trong nước cứng"],"answer":"B","explain":"Phosphate gây phú dưỡng; nên dùng loại không phosphate, dễ phân hủy sinh học.","points":0.25},{"type":"mcq","level":"TH","q":"Cho các phát biểu: (1) Xà phòng từ chất béo; (2) Chất giặt rửa tổng hợp từ dầu mỏ; (3) Cả hai đều tạo mixen. Số phát biểu đúng là:","options":["A. 1","B. 2","C. 3","D. 0"],"answer":"C","explain":"Cả 3 phát biểu đều đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi dùng xà phòng trong nước cứng, vải bị ố vàng là do:","options":["A. xà phòng bị phân hủy","B. kết tủa $\\mathrm{(RCOO)_2Ca}$, $\\mathrm{(RCOO)_2Mg}$ bám trên vải","C. nước cứng có màu vàng","D. xà phòng bị oxi hóa"],"answer":"B","explain":"Kết tủa của xà phòng với $\\mathrm{Ca^{2+}}$, $\\mathrm{Mg^{2+}}$ bám trên sợi vải gây ố, cứng vải.","points":0.25},{"type":"mcq","level":"VD","q":"Xà phòng hóa $17,8$ gam tristearin ($M = 890$) bằng NaOH dư. Khối lượng glycerol thu được là:","options":["A. $0,92$ gam","B. $1,84$ gam","C. $2,76$ gam","D. $0,46$ gam"],"answer":"B","explain":"$n_{tristearin} = 0,02$ mol → $n_{glycerol} = 0,02$ mol → $m = 1,84$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm sodium stearate ($M = 306$) và sodium palmitate ($M = 278$) có tỉ lệ mol $1:1$. Cho $m$ gam X tác dụng với $\\mathrm{CaCl_2}$ dư thu được $17,37$ gam kết tủa. Giá trị của $m$ là: (biết $M_{kết\\ tủa\\ stearate} = 607$, $M_{kết\\ tủa\\ palmitate} = 551$)","options":["A. $11,68$ gam","B. $17,52$ gam","C. $23,36$ gam","D. $5,84$ gam"],"answer":"B","explain":"Đặt mỗi muối $a$ mol → kết tủa $= \\frac{a}{2}(607 + 551) = 579a = 17,37$ → $a = 0,03$ → $m = 0,03 \\times (306 + 278) = 17,52$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp):","statements":["a) Xà phòng: muối Na/K của acid béo, từ chất béo.","b) Chất giặt rửa tổng hợp: từ dầu mỏ, dùng được trong nước cứng.","c) Phosphate gây phú dưỡng nguồn nước.","d) Xà phòng giặt tốt trong nước cứng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $17,8$ gam tristearin xà phòng hóa cho $1,84$ gam glycerol.","b) $0,015$ mol $\\mathrm{Ca^{2+}}$ làm mất $9,18$ gam sodium stearate.","c) $35,6$ gam tristearin cần $8,064$ gam KOH (dư $20\\%$).","d) Tỉ lệ mol xà phòng : $\\mathrm{Ca^{2+}}$ khi kết tủa là $1:2$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $0,03$ mol $= 9,18$ gam. c) Đúng. d) Sai: tỉ lệ là $2:1$.","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa $22,25$ gam tristearin ($M = 890$) bằng NaOH dư. Khối lượng sodium stearate thu được là bao nhiêu gam?","answer":"22,95","explain":"$n = 22,25/890 = 0,025$ mol → $n_{muối} = 0,075$ mol → $m = 0,075 \\times 306 = 22,95$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $m$ gam hỗn hợp sodium stearate và sodium palmitate (tỉ lệ mol $1:1$) tác dụng với $\\mathrm{CaCl_2}$ dư thu được $17,37$ gam kết tủa. Giá trị của $m$ là bao nhiêu? (biết $M_{kết\\ tủa} = 607$ và $551$)","answer":"17,52","explain":"Đặt mỗi muối $a$ mol → kết tủa $= 579a = 17,37$ → $a = 0,03$ → $m = 0,03 \\times (306 + 278) = 17,52$ gam.","points":0.5}]}]}</script>
