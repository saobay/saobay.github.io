{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Công thức chung của chất béo là:","options":["A. $RCOOR'$","B. $\\mathrm{(RCOO)_3C_3H_5}$","C. $RCOOH$","D. $\\mathrm{C_3H_5(OH)_3}$"],"answer":"B","explain":"Chất béo là triester của glycerol với acid béo: $\\mathrm{(RCOO)_3C_3H_5}$.","points":0.25},{"type":"mcq","level":"NB","q":"Chất giặt rửa tổng hợp khác xà phòng ở điểm nào?","options":["A. Không tạo mixen","B. Không phải muối của acid béo, được sản xuất từ dầu mỏ","C. Không giặt được","D. Tan trong nước kém"],"answer":"B","explain":"Chất giặt rửa tổng hợp không phải muối của acid béo, sản xuất từ dầu mỏ, cơ chế giặt tương tự xà phòng.","points":0.25},{"type":"mcq","level":"TH","q":"Ester X có $M = 88$, xà phòng hóa cho muối $\\mathrm{CH_3COONa}$. X là:","options":["A. $\\mathrm{HCOOC_3H_7}$","B. $\\mathrm{CH_3COOC_2H_5}$","C. $\\mathrm{C_2H_5COOCH_3}$","D. $\\mathrm{HCOOC_2H_5}$"],"answer":"B","explain":"Muối $\\mathrm{CH_3COONa}$ → gốc acid $\\mathrm{CH_3COO-}$; $M = 88$ → gốc alcohol $\\mathrm{C_2H_5}$ ($M = 88 - 59 = 29$) → X là $\\mathrm{CH_3COOC_2H_5}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho các chất: tristearin, tripalmitin, triolein. Chất ở thể lỏng ở nhiệt độ thường là:","options":["A. tristearin","B. tripalmitin","C. triolein","D. cả ba"],"answer":"C","explain":"Triolein chứa gốc oleic không no nên ở thể lỏng; hai chất còn lại chứa gốc no nên ở thể rắn.","points":0.25},{"type":"mcq","level":"VD","q":"Xà phòng hóa $26,7$ gam tristearin ($M = 890$) bằng NaOH dư. Khối lượng sodium stearate thu được là:","options":["A. $27,54$ gam","B. $18,36$ gam","C. $9,18$ gam","D. $36,72$ gam"],"answer":"A","explain":"$n = 0,03$ mol → $n_{muối} = 0,09$ mol → $m = 0,09 \\times 306 = 27,54$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm $\\mathrm{HCOOCH_3}$ ($M = 60$) và $\\mathrm{CH_3COOC_2H_5}$ ($M = 88$). Xà phòng hóa $14,8$ gam X cần vừa đủ $0,2$ mol NaOH. Khối lượng $\\mathrm{HCOOCH_3}$ trong X là:","options":["A. $6$ gam","B. $8,8$ gam","C. $3$ gam","D. $12$ gam"],"answer":"A","explain":"Đặt $a + b = 0,2$; $60a + 88b = 14,8$ → $a = 0,1$ → $m = 6$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ester có nhóm chức $-COO-$.","b) Chất béo là triester của glycerol với acid béo.","c) Xà phòng là muối Na/K của acid béo.","d) Chất giặt rửa tổng hợp là muối của acid béo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chất giặt rửa tổng hợp KHÔNG phải muối của acid béo.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thủy phân ester trong acid là phản ứng thuận nghịch.","b) $\\mathrm{CH_3COOC_6H_5}$ tác dụng với NaOH theo tỉ lệ $1:2$.","c) Chất giặt rửa tổng hợp dùng được trong nước cứng.","d) Dầu thực vật hydrogen hóa thành mỡ rắn."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa $13,2$ gam ethyl acetate ($M = 88$) bằng KOH dư. Khối lượng potassium acetate ($M = 98$) thu được là bao nhiêu gam?","answer":"14,7","explain":"$n_{ester} = 0,15$ mol → $m = 0,15 \\times 98 = 14,7$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $8,8$ gam ester no, đơn chức, mạch hở X thu được $8,96$ lít $\\mathrm{CO_2}$ (đktc). Số công thức cấu tạo là ester của X là:","answer":"2","explain":"$n_{\\mathrm{CO_2}} = 0,4$ mol → $8,8n/(14n+32) = 0,4$ → $n = 3$ → $\\mathrm{C_3H_6O_2}$ có 2 đồng phân ester ($\\mathrm{HCOOC_2H_5}$, $\\mathrm{CH_3COOCH_3}$).","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Phản ứng xà phòng hóa là phản ứng:","options":["A. ester với dung dịch kiềm","B. acid với dung dịch kiềm","C. alcohol với kim loại kiềm","D. chất béo với nước"],"answer":"A","explain":"Xà phòng hóa là phản ứng thủy phân ester (kể cả chất béo) trong môi trường kiềm.","points":0.25},{"type":"mcq","level":"NB","q":"Trong nước cứng, ch đúng, sai của các khẳng định sau:","statements":["a) $17,8$ gam tristearin thủy phân (H = $90\\%$) cho $15,336$ gam stearic acid.","b) Đốt cháy $17,8$ gam tristearin cần $36,512$ lít $\\mathrm{O_2}$ (đktc).","c) $\\mathrm{CH_3COOC_6H_5}$ + NaOH tỉ lệ $1:2$.","d) $\\mathrm{C_{12}H_{25}OSO_3Na}$ dùng được trong nước cứng."],"answer":["T","T","T","T"],"explain":"a) Đúng. b) Đúng: $0,02 \\times 81,5 = 1,63$ mol $= 36,512$ lít. c), d) Đúng.","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa $4,4$ gam $\\mathrm{CH_3COOC_2H_5}$ ($M = 88$) bằng NaOH dư. Thể tích dung dịch NaOH $0,5M$ tối thiểu cần dùng là bao nhiêu ml?","answer":"100","explain":"$n_{NaOH} = 0,05$ mol → $V = 0,05/0,5 = 0,1$ lít $= 100$ ml.","points":0.5},{"type":"short","level":"VDC","q":"Cho $0,02$ mol tristearin tác dụng với $\\mathrm{H_2}$ dư (Ni, $t^\\circ$). Thể tích $\\mathrm{H_2}$ (đktc) đã phản ứng là bao nhiêu lít?","answer":"0","explain":"Tristearin chứa gốc stearic NO nên không cộng $\\mathrm{H_2}$ → $V = 0$ lít.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Glycerol có công thức:","options":["A. $\\mathrm{C_2H_4(OH)_2}$","B. $\\mathrm{C_3H_5(OH)_3}$","C. $\\mathrm{C_3H_7OH}$","D. $\\mathrm{CH_3OH}$"],"answer":"B","explain":"Glycerol là alcohol 3 chức: $\\mathrm{C_3H_5(OH)_3}$.","points":0.25},{"type":"mcq","level":"NB","q":"Muối nào sau đây là thành phần của xà phòng?","options":["A. $\\mathrm{CH_3COONa}$","B. $\\mathrm{C_{17}H_{35}COONa}$","C. $\\mathrm{NaCl}$","D. $\\mathrm{Na_2CO_3}$"],"answer":"B","explain":"Sodium stearate ($\\mathrm{C_{17}H_{35}COONa}$) là muối của acid béo — thành phần xà phòng.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các phản ứng sau, phản ứng nào là thuận nghịch?","options":["A. $\\mathrm{RCOOR' + NaOH \\rightarrow RCOONa + R'OH}$","B. $\\mathrm{RCOOR' + H_2O}$ (xúc tác $\\mathrm{H^+}$) tạo $\\mathrm{RCOOH + R'OH}$","C. $\\mathrm{RCOOH + NaOH \\rightarrow RCOONa + H_2O}$","D. $\\mathrm{2RCOONa + Ca^{2+} \\rightarrow ( ôi trường kiềm thu được:","options":["A. stearic acid và glycerol","B. sodium stearate và glycerol","C. sodium stearate và ethanol","D. stearic acid và nước"],"answer":"B","explain":"Xà phòng hóa: $\\mathrm{(C_{17}H_{35}COO)_3C_3H_5 + 3NaOH \\rightarrow 3C_{17}H_{35}COONa + C_3H_5(OH)_3}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,1$ mol $\\mathrm{CH_3COOC_6H_5}$ tác dụng với $250$ ml NaOH $1M$. Sau phản ứng, số mol NaOH dư là:","options":["A. $0$ mol","B. $0,05$ mol","C. $0,1$ mol","D. $0,15$ mol"],"answer":"B","explain":"Cần $0,2$ mol NaOH; đã dùng $0,25$ mol → dư $0,05$ mol.","points":0.25},{"type":"mcq","level":"VDC","q":"Đốt cháy hoàn toàn $8,8$ gam ester X no, đơn chức, mạch hở thu được $0,4$ mol $\\mathrm{CO_2}$. Số đồng phân cấu tạo là ester của X là:","options":["A. 2","B. 4","C. 5","D. 9"],"answer":"B","explain":"$8,8n/(14n+32) = 0,4$ → $8,8n = 5,6n + 12,8$ → $3,2n = 12,8$ → $n = 4$ → X là $\\mathrm{C_4H_8O_2}$ có 4 đồng phân ester.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chất béo không tan trong nước.","b) Sodium lauryl sulfate là $\\mathrm{C_{12}H_{25}OSO_3Na}$.","c) Dầu thực vật cộng được $\\mathrm{H_2}$.","d) Xà phòng hóa tristearin cho sodium stearate và ethanol."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cho sodium stearate và GLYCEROL.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,1$ mol $\\mathrm{CH_3COOC_6H_5}$ cần $0,2$ mol NaOH.","b) $250$ ml NaOH $1M$ dư $0,05$ mol khi tác dụng với $0,1$ mol phenyl acetate.","c) $\\mathrm{C_4H_8O_2}$ có 4 đồng phân ester.","d) Thủy phân ester trong acid cho muối và alcohol."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cho ACID và alcohol (muối chỉ thu được khi thủy phân trong kiềm).","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa $17,6$ gam $\\mathrm{CH_3COOC_2H_5}$ ($M = 88$) bằng NaOH dư. Khối lượng $\\mathrm{C_2H_5OH}$ thu được là bao nhiêu gam?","answer":"9,2","explain":"$n = 0,2$ mol → $m_{ethanol} = 0,2 \\times 46 = 9,2$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $13,6$ gam $\\mathrm{CH_3COOC_6H_5}$ ($M = 136$) tác dụng với $300$ ml dung dịch NaOH $1M$. Cô cạn dung dịch sau phản ứng thu được bao nhiêu gam chất rắn khan?","answer":"23,8","explain":"$n_{ester} = 0,1$ mol; $n_{NaOH} = 0,3$ mol → NaOH dư $0,1$ mol. Rắn: $\\mathrm{CH_3COONa}$ ($8,2$ gam) + $\\mathrm{C_6H_5ONa}$ ($11,6$ gam) + NaOH dư ($4$ gam) $= 23,8$ gam.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Ester được điều chế từ:","options":["A. acid và alcohol","B. acid và base","C. alcohol và kim loại","D. aldehyde và alcohol"],"answer":"A","explain":"Ester hóa: carboxylic acid + alcohol (xúc tác $\\mathrm{H_2SO_4}$ đặc, $t^\\circ$) → ester + nước.","points":0.25},{"type":"mcq","level":"NB","q":"Chất nào sau đây dùng làm hương liệu thực phẩm?","options":["A. $\\mathrm{NaCl}$","B. isoamyl acetate","C. $\\mathrm{CaCO_3}$","D. $\\mathrm{H_2SO_4}$"],"answer":"B","explain":"Isoamyl acetate có mùi chuối chín, dùng làm hương liệu thực phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol $\\mathrm{CH_3COOC_2H_5}$ tác dụng với $0,1$ mol NaOH. Sau phản ứng, chất còn dư là:","options":["A. ester","B. NaOH","C. không còn chất nào dư","D. nước"],"answer":"C","explain":"Tỉ lệ $1:1$ nên cả hai vừa đủ, không dư.","points":0.25},{"type":"mcq","level":"TH","q":"Thủy phân hoàn toàn $\\mathrm{CH_3COOCH_3}$ trong NaOH dư thu được:","options":["A. $\\mathrm{CH_3COONa}$ và $\\mathrm{CH_3OH}$","B. $\\mathrm{HCOONa}$ và $\\mathrm{C_2H_5OH}$","C. $\\mathrm{C_2H_5COONa}$ và $\\mathrm{CH_3OH}$","D. $\\mathrm{CH_3COOH}$ và $\\mathrm{CH_3ONa}$"],"answer":"A","explain":"$\\mathrm{CH_3COOCH_3 + NaOH \\rightarrow CH_3COONa + CH_3OH}$.","points":0.25},{"type":"mcq","level":"VD","q":"Xà phòng hóa $3,7$ gam $\\mathrm{HCOOC_2H_5}$ ($M = 74$) bằng NaOH dư. Khối lượng $\\mathrm{C_2H_5OH}$ thu được là:","options":["A. $2,3$ gam","B. $4,6$ gam","C. $3,4$ gam","D. $6,8$ gam"],"answer":"A","explain":"$n_{ester} = 0,05$ mol → $m_{ethanol} = 0,05 \\times 46 = 2,3$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm $\\mathrm{HCOOCH_3}$ ($M = 60$) và $\\mathrm{CH_3COOCH_3}$ ($M = 74$) có tỉ lệ mol $1:1$. Xà phòng hóa $13,4$ gam X bằng NaOH dư. Khối lượng muối thu được là:","options":["A. $15$ gam","B. $16,4$ gam","C. $13,6$ gam","D. $15,6$ gam"],"answer":"A","explain":"$n$ mỗi ester $= 13,4/134 = 0,1$ mol → muối: $0,1 \\times 68 + 0,1 \\times 82 = 6,8 + 8,2 = 15$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ester hóa cần xúc tác $\\mathrm{H_2SO_4}$ đặc và đun nóng.","b) Isoamyl acetate dùng làm hương liệu.","c) $\\mathrm{CH_3COOCH_3}$ xà phòng hóa cho $\\mathrm{CH_3COONa}$.","d) Phản ứng ester hóa là một chiều."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ester hóa thuận nghịch.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $3,7$ gam $\\mathrm{HCOOC_2H_5}$ xà phòng hóa cho $2,3$ gam ethanol.","b) $13,4$ gam hỗn hợp $\\mathrm{HCOOCH_3}$ + $\\mathrm{CH_3COOCH_3}$ (tỉ lệ mol $1:1$) cho $15$ gam muối.","c) $0,1$ mol ester cần $0,1$ mol NaOH để xà phòng hóa.","d) $\\mathrm{CH_3COOC_6H_5}$ xà phòng hóa cho $\\mathrm{CH_3COONa}$ và $\\mathrm{C_6H_5OH}$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cho $\\mathrm{CH_3COONa}$ và $\\mathrm{C_6H_5ONa}$ (muối phenolate), không phải phenol.","points":1},{"type":"short","level":"VD","q":"Đun $9,2$ gam $\\mathrm{C_2H_5OH}$ với $12$ gam $\\mathrm{CH_3COOH}$ (dư). Hiệu suất $70\\%$. Khối lượng ethyl acetate thu được là bao nhiêu gam?","answer":"12,32","explain":"$n_{alcohol} = 0,2$ mol (giới hạn) → lí thuyết $0,2$ mol ester $= 17,6$ gam; hiệu suất $70\\%$ → $12,32$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Hỗn hợp X, Y là hai ester no, đơn chức, mạch hở đồng đẳng kế tiếp (tỉ lệ mol $1:1$). Xà phòng hóa hoàn toàn $8,1$ gam hỗn hợp bằng NaOH dư thu được $10,3$ gam hỗn hợp muối. Số nguyên tử carbon trong X (ester có $M$ nhỏ hơn) là:","answer":"3","explain":"Đặt X: $\\mathrm{C_nH_{2n}O_2}$ ($M = 14n + 32$), Y: $\\mathrm{C_{n+1}H_{2n+2}O_2}$ ($M = 14n + 46$), mỗi chất $a$ mol. Ta có $a(28n + 78) = 8,1$ và muối $a(28n + 122) = 10,3$ → $44a = 2,2$ → $a = 0,05$ → $28n + 78 = 162$ → $n = 3$ → X là $\\mathrm{C_3H_6O_2}$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Phản ứng hydrogen hóa chất béo lỏng nhằm mục đích:","options":["A. tạo xà phòng","B. sản xuất bơ thực vật (margarine)","C. tạo glycerol","D. làm ôi thiu dầu mỡ"],"answer":"B","explain":"Hydrogen hóa dầu thực vật thành chất béo rắn để sản xuất margarine.","points":0.25},{"type":"mcq","level":"NB","q":"Chất nào sau đây là xà phòng?","options":["A. $\\mathrm{C_{12}H_{25}OSO_3Na}$","B. $\\mathrm{C_{17}H_{35}COOK}$","C. $\\mathrm{(C_{17}H_{35}COO)_3C_3H_5}$","D. $\\mathrm{C_3H_5(OH)_3}$"],"answer":"B","explain":"Potassium stearate ($\\mathrm{C_{17}H_{35}COOK}$) là muối kali của acid béo — xà phòng.","points":0.25},{"type":"mcq","level":"TH","q":"Cho dãy chất: $\\mathrm{CH_3COOC_2H_5}$, $\\mathrm{C_2H_5COOH}$, $\\mathrm{C_3H_7OH}$ (có $M$ gần bằng nhau). Sắp xếp theo thứ tự nhiệt độ sôi tăng dần:","options":["A. ester, alcohol, acid","B. acid, alcohol, ester","C. alcohol, ester, acid","D. ester, acid, alcohol"],"answer":"A","explain":"Ester không có liên kết hydrogen → sôi thấp nhất; acid có liên kết hydrogen bền nhất → sôi cao nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Xà phòng hóa $\\mathrm{C_2H_5COOCH_3}$ bằng NaOH thu được:","options":["A. $\\mathrm{C_2H_5COONa}$ và $\\mathrm{CH_3OH}$","B. $\\mathrm{CH_3COONa}$ và $\\mathrm{C_2H_5OH}$","C. $\\mathrm{HCOONa}$ và $\\mathrm{C_3H_7OH}$","D. $\\mathrm{C_2H_5COOH}$ và $\\mathrm{CH_3ONa}$"],"answer":"A","explain":"$\\mathrm{C_2H_5COOCH_3 + NaOH \\rightarrow C_2H_5COONa + CH_3OH}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $4,6$ gam $\\mathrm{HCOOH}$ tác dụng với $3,2$ gam $\\mathrm{CH_3OH}$ (xúc tác $\\mathrm{H_2SO_4}$ đặc). Hiệu suất $75\\%$. Khối lượng methyl formate thu được là:","options":["A. $6$ gam","B. $4,5$ gam","C. $3$ gam","D. $6,75$ gam"],"answer":"B","explain":"$n_{acid} = 0,1$ mol; $n_{alcohol} = 0,1$ mol → lí thuyết $0,1$ mol ester $= 6$ gam; hiệu suất $75\\%$ → $4,5$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Xà phòng hóa hoàn toàn $m$ gam phenyl acetate bằng $150$ ml dung dịch KOH $2M$ vừa đủ. Giá trị của $m$ là: ($M_{phenyl\\ acetate} = 136$)","options":["A. $10,2$ gam","B. $20,4$ gam","C. $13,6$ gam","D. $27,2$ gam"],"answer":"B","explain":"$n_{KOH} = 0,3$ mol; tỉ lệ $1:2$ → $n_{ester} = 0,15$ mol → $m = 0,15 \\times 136 = 20,4$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hydrogen hóa dầu thực vật để sản xuất margarine.","b) $\\mathrm{C_{17}H_{35}COOK}$ là xà phòng.","c) Thứ tự nhiệt độ sôi tăng dần: ester, alcohol, acid (khi $M$ tương đương).","d) $\\mathrm{C_2H_5COOCH_3}$ xà phòng hóa cho $\\mathrm{C_2H_5COONa}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $4,6$ gam $\\mathrm{HCOOH}$ + $3,2$ gam $\\mathrm{CH_3OH}$ (H = $75\\%$) cho $4,5$ gam methyl formate.","b) $0,15$ mol phenyl acetate cần $0,3$ mol KOH.","c) Ester no, đơn chức có công thức $\\mathrm{C_nH_{2n}O_2}$.","d) Chất béo là ester của glycerol với acid vô cơ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chất béo là ester của glycerol với ACID BÉO (acid hữu cơ).","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa $22$ gam $\\mathrm{CH_3COOC_2H_5}$ ($M = 88$) bằng NaOH dư. Khối lượng $\\mathrm{CH_3COONa}$ thu được là bao nhiêu gam?","answer":"20,5","explain":"$n = 0,25$ mol → $m = 0,25 \\times 82 = 20,5$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $0,05$ mol hỗn hợp hai ester no, đơn chức, mạch hở đồng đẳng kế tiếp thu được $0,27$ mol $\\mathrm{CO_2}$. Số nguyên tử C của ester có $M$ lớn hơn là:","answer":"6","explain":"Số C trung bình $= 0,27/0,05 = 5,4$ → hai ester là $\\mathrm{C_5H_{10}O_2}$ và $\\mathrm{C_6H_{12}O_2}$ → ester lớn hơn có 6 carbon.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Benzyl acetate có mùi:","options":["A. chuối chín","B. dứa chín","C. hoa nhài","D. cam"],"answer":"C","explain":"Benzyl acetate có mùi hoa nhài, dùng trong mỹ phẩm.","points":0.25},{"type":"mcq","level":"NB","q":"Khi dùng xà phòng trong nước cứng, hiện tượng là:","options":["A. tạo nhiều bọt","B. xuất hiện kết tủa trắng, ít bọt","C. có khí thoát ra","D. dung dịch trong suốt"],"answer":"B","explain":"Xà phòng tạo kết tủa trắng với $\\mathrm{Ca^{2+}}$, $\\mathrm{Mg^{2+}}$ trong nước cứng.","points":0.25},{"type":"mcq","level":"TH","q":"Ester X được tạo bởi $\\mathrm{HCOOH}$ và $\\mathrm{C_2H_5OH}$. X là:","options":["A. $\\mathrm{CH_3COOC_2H_5}$","B. $\\mathrm{HCOOC_2H_5}$","C. $\\mathrm{C_2H_5COOH}$","D. $\\mathrm{HCOOCH_3}$"],"answer":"B","explain":"Formic acid + ethanol → ethyl formate ($\\mathrm{HCOOC_2H_5}$).","points":0.25},{"type":"mcq","level":"TH","q":"Phản ứng đặc trưng để điều chế xà phòng từ chất béo là:","options":["A. phản ứng hydrogen hóa","B. phản ứng xà phòng hóa","C. phản ứng oxi hóa","D. phản ứng ester hóa"],"answer":"B","explain":"Xà phòng hóa chất béo bằng kiềm tạo xà phòng và glycerol.","points":0.25},{"type":"mcq","level":"VD","q":"Xà phòng hóa $8,8$ gam $\\mathrm{C_2H_5COOCH_3}$ ($M = 88$) bằng NaOH dư. Khối lượng $\\mathrm{C_2H_5COONa}$ ($M = 96$) thu được là:","options":["A. $9,6$ gam","B. $8,8$ gam","C. $4,8$ gam","D. $19,2$ gam"],"answer":"A","explain":"$n_{ester} = 8,8/88 = 0,1$ mol → $m_{muối} = 0,1 \\times 96 = 9,6$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $m$ gam tristearin tác dụng vừa đủ với $120$ ml dung dịch NaOH $1M$. Giá trị của $m$ là:","options":["A. $17,8$ gam","B. $35,6$ gam","C. $8,9$ gam","D. $26,7$ gam"],"answer":"B","explain":"$n_{NaOH} = 0,12$ mol → $n_{tristearin} = 0,04$ mol → $m = 0,04 \\times 890 = 35,6$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Benzyl acetate có mùi hoa nhài.","b) Xà phòng tạo kết tủa trắng trong nước cứng.","c) $\\mathrm{HCOOH}$ + $\\mathrm{C_2H_5OH}$ tạo ethyl formate.","d) Chất giặt rửa tổng hợp được sản xuất từ chất béo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: từ dầu mỏ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,12$ mol NaOH xà phòng hóa vừa đủ $0,04$ mol tristearin.","b) $8,8$ gam $\\mathrm{C_2H_5COOCH_3}$ xà phòng hóa cho $9,6$ gam $\\mathrm{C_2H_5COONa}$.","c) $\\mathrm{CH_3COOC_2H_5}$ có $M = 88$.","d) Ester của phenol + NaOH tỉ lệ $1:1$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tỉ lệ $1:2$.","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa $8,8$ gam $\\mathrm{C_2H_5COOCH_3}$ ($M = 88$) bằng NaOH dư. Khối lượng $\\mathrm{C_2H_5COONa}$ ($M = 96$) thu được là bao nhiêu gam?","answer":"9,6","explain":"$n = 0,1$ mol → $m = 0,1 \\times 96 = 9,6$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Xà phòng hóa hoàn toàn $17,8$ gam tristearin ($M = 890$) bằng dung dịch KOH dư, rồi cô cạn dung dịch sau phản ứng. Khối lượng chất rắn khan thu được là bao nhiêu gam? (biết $M_{\\mathrm{C_{17}H_{35}COOK}} = 322$)","answer":"21,16","explain":"$n_{tristearin} = 0,02$ mol → $m_{muối} = 0,06 \\times 322 = 19,32$ gam; $m_{glycerol} = 0,02 \\times 92 = 1,84$ gam → tổng chất rắn $= 21,16$ gam.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Công thức của sodium palmitate là:","options":["A. $\\mathrm{C_{15}H_{31}COONa}$","B. $\\mathrm{C_{17}H_{35}COONa}$","C. $\\mathrm{C_{17}H_{33}COONa}$","D. $\\mathrm{CH_3COONa}$"],"answer":"A","explain":"Palmitic acid là $\\mathrm{C_{15}H_{31}COOH}$ nên muối sodium là $\\mathrm{C_{15}H_{31}COONa}$.","points":0.25},{"type":"mcq","level":"NB","q":"Chất béo bị ôi thiu là do:","options":["A. thủy phân","B. oxi hóa bởi oxygen trong không khí","C. hydrogen hóa","D. xà phòng hóa"],"answer":"B","explain":"Oxi hóa tạo các hợp chất có mùi khó chịu — ôi thiu.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các chất sau, chất nào tác dụng với NaOH theo tỉ lệ mol $1:2$?","options":["A. $\\mathrm{CH_3COOC_2H_5}$","B. $\\mathrm{CH_3COOC_6H_5}$","C. $\\mathrm{HCOOCH_3}$","D. $\\mathrm{C_2H_5COOCH_3}$"],"answer":"B","explain":"Ester của phenol $\\mathrm{CH_3COOC_6H_5}$ tác dụng với NaOH theo tỉ lệ $1:2$.","points":0.25},{"type":"mcq","level":"TH","q":"Sản phẩm hydrogen hóa hoàn toàn triolein là:","options":["A. tripalmitin","B. tristearin","C. glycerol","D. oleic acid"],"answer":"B","explain":"Triolein $+ 3\\mathrm{H_2} \\rightarrow$ tristearin.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $8,9$ gam tristearin ($M = 890$) trong NaOH dư. Khối lượng $\\mathrm{H_2O}$ tạo thành trong phản ứng xà phòng hóa là:","options":["A. $0$ gam","B. $0,18$ gam","C. $0,54$ gam","D. $1,8$ gam"],"answer":"A","explain":"Xà phòng hóa chất béo không tạo nước: $\\mathrm{(RCOO)_3C_3H_5 + 3NaOH \\rightarrow 3RCOONa + C_3H_5(OH)_3}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm $\\mathrm{CH_3COOH}$ ($M = 60$) và $\\mathrm{HCOOC_2H_5}$ ($M = 74$). Cho $13,4$ gam X tác dụng vừa đủ với $0,2$ mol NaOH. Khối lượng $\\mathrm{HCOOC_2H_5}$ trong X là:","options":["A. $7,4$ gam","B. $6$ gam","C. $3,7$ gam","D. $11,1$ gam"],"answer":"A","explain":"Đặt $a + b = 0,2$; $60a + 74b = 13,4$ → $b = 0,1$ → $m = 7,4$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sodium palmitate là $\\mathrm{C_{15}H_{31}COONa}$.","b) Ôi thiu do oxi hóa.","c) $\\mathrm{CH_3COOC_6H_5}$ : NaOH $= 1:2$.","d) Hydrogen hóa triolein cho tristearin."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xà phòng hóa tristearin không tạo nước.","b) $13,4$ gam hỗn hợp $\\mathrm{CH_3COOH}$ + $\\mathrm{HCOOC_2H_5}$ ($n_{NaOH} = 0,2$) chứa $7,4$ gam ester.","c) $M_{\\mathrm{C_{15}H_{31}COONa}} = 278$.","d) Chất giặt rửa tổng hợp tạo kết tủa trong nước cứng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: không tạo kết tủa.","points":1},{"type":"short","level":"VD","q":"Xà phòng hóa $16,1$ gam potassium stearate... Khối lượng tristearin cần dùng để điều chế $16,1$ gam potassium stearate ($M = 322$) là bao nhiêu gam?","answer":"14,83","explain":"$n_{muối} = 0,05$ mol → $n_{tristearin} = 0,05/3$ mol → $m = 0,05 \\times 890/3 = 14,83$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $27,54$ gam sodium stearate ($M = 306$) tác dụng với dung dịch $\\mathrm{CaCl_2}$ dư. Khối lượng kết tủa thu được là bao nhiêu gam?","answer":"27,315","explain":"$n_{xà\\ phòng} = 0,09$ mol → $n_{kết\\ tủa} = 0,045$ mol → $m = 0,045 \\times 607 = 27,315$ gam.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng?","options":["A. Ester tan tốt trong nước","B. Chất béo là triester của glycerol với acid béo","C. Xà phòng được sản xuất từ dầu mỏ","D. Lipid tan tốt trong nước"],"answer":"B","explain":"Chất béo là triester của glycerol với acid béo — phát biểu đúng duy nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Chất giặt rửa tổng hợp nên được chọn loại:","options":["A. chứa phosphate","B. dễ phân hủy sinh học","C. khó phân hủy","D. có tính acid mạnh"],"answer":"B","explain":"Nên chọn loại dễ phân hủy sinh học, không chứa phosphate để bảo vệ môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy nào sau đây gồm các chất đều là ester?","options":["A. $\\mathrm{CH_3COOC_2H_5}$, $\\mathrm{HCOOCH_3}$, $\\mathrm{C_2H_5COOCH_3}$","B. $\\mathrm{CH_3COOH}$, $\\mathrm{C_2H_5OH}$, $\\mathrm{HCOOH}$","C. $\\mathrm{C_{17}H_{35}COONa}$, $\\mathrm{C_{15}H_{31}COOK}$","D. $\\mathrm{C_3H_5(OH)_3}$, $\\mathrm{C_2H_4(OH)_2}$"],"answer":"A","explain":"Dãy A đều có nhóm $-COO-$; B là acid/alcohol; C là xà phòng; D là alcohol.","points":0.25},{"type":"mcq","level":"TH","q":"Khi thủy phân $\\mathrm{HCOOC_2H_5}$ trong $\\mathrm{H_2SO_4}$ loãng thu được:","options":["A. $\\mathrm{HCOONa}$ và $\\mathrm{C_2H_5OH}$","B. $\\mathrm{HCOOH}$ và $\\mathrm{C_2H_5OH}$","C. $\\mathrm{CH_3COOH}$ và $\\mathrm{CH_3OH}$","D. $\\mathrm{CO}$ và $\\mathrm{C_2H_5OH}$"],"answer":"B","explain":"Thủy phân trong acid: $\\mathrm{HCOOC_2H_5 + H_2O \\rightleftharpoons HCOOH + C_2H_5OH}$.","points":0.25},{"type":"mcq","level":"VD","q":"Xà phòng hóa $7,4$ gam $\\mathrm{HCOOC_2H_5}$ ($M = 74$) bằng NaOH dư. Khối lượng $\\mathrm{HCOONa}$ thu được là:","options":["A. $6,8$ gam","B. $8,2$ gam","C. $3,4$ gam","D. $13,6$ gam"],"answer":"A","explain":"$n = 0,1$ mol → $m = 6,8$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Xà phòng hóa hoàn toàn $26,7$ gam chất béo X (chỉ chứa tristearin, $M = 890$) bằng dung dịch NaOH $12\\%$. Khối lượng dung dịch NaOH tối thiểu cần dùng là:","options":["A. $30$ gam","B. $60$ gam","C. $90$ gam","D. $120$ gam"],"answer":"A","explain":"$n_{tristearin} = 0,03$ mol → $n_{NaOH} = 0,09$ mol $= 3,6$ gam → $m_{dd} = 3,6/0,12 = 30$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 1):","statements":["a) Ester: $RCOOR'$.","b) Chất béo: $\\mathrm{(RCOO)_3C_3H_5}$.","c) Xà phòng: muối Na/K của acid béo.","d) Nên chọn chất giặt rửa khó phân hủy sinh học."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nên chọn loại DỄ phân hủy sinh học.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $7,4$ gam $\\mathrm{HCOOC_2H_5}$ xà phòng hóa cho $6,8$ gam $\\mathrm{HCOONa}$.","b) $26,7$ gam tristearin cần $30$ gam dung dịch NaOH $12\\%$.","c) $\\mathrm{HCOOC_2H_5}$ thủy phân trong acid cho $\\mathrm{HCOOH}$.","d) $\\mathrm{CH_3COOC_2H_5}$, $\\mathrm{HCOOCH_3}$ đều là ester."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Cần bao nhiêu gam NaOH để xà phòng hóa hoàn toàn $44,5$ gam tristearin ($M = 890$)?","answer":"6","explain":"$n = 0,05$ mol → $n_{NaOH} = 0,15$ mol → $m = 6$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $4,4$ gam ester no, đơn chức, mạch hở X cần $0,25$ mol $\\mathrm{O_2}$. Phân tử khối của X là:","answer":"88","explain":"$n_X = 0,25 \\times 2/(3n-2)$. Thử $M = 88$ ($n = 4$): $n_X = 0,05$ mol; $n_{\\mathrm{O_2}} = 5 \\times 0,05 = 0,25$ mol (khớp) → $M_X = 88$.","points":0.5}]}]}</script>
