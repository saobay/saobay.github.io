 mol → $V = 2,24$ lít.","points":0.5},{"type":"short","level":"VDC","q":"Trộn $5,6$ gam CaO với $7,4$ gam $\\mathrm{Ca(OH)_2}$. Tổng số mol Ca là bao nhiêu?","answer":"0,2","explain":"$n_{CaO} = 0,1$; $n_{\\mathrm{Ca(OH)_2}} = 0,1$ → tổng $0,2$ mol.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Ôn tập bài 25: thế điện cực chuẩn của $\\mathrm{Mg^{2+}/Mg}$ là:","options":["A. $-2,37$ V","B. $+2,37$ V","C. $-0,44$ V","D. $0$ V"],"answer":"A","explain":"$E^\\circ_{Mg^{2+}/Mg} = -2,37$ V.","points":0.25},{"type":"mcq","level":"NB","q":"Trong tự nhiên, calcium tồn tại chủ yếu ở dạng:","options":["A. hợp chất","B. đơn chất","C. ion tự do","D. khí"],"answer":"A","explain":"Kim loại hoạt động mạnh → tồn tại dạng hợp chất.","points":0.25},{"type":"mcq","level":"TH","q":"Quặng nào sau đây chứa calcium?","options":["A. đá vôi","B. boxite","C. hematite","D. pirit"],"answer":"A","explain":"Đá vôi: $\\mathrm{CaCO_3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Phản ứng nào sau đây dùng để khắc chữ lên thủy tinh?","options":["A. $\\mathrm{CaF_2 + H_2SO_4 \\rightarrow CaSO_4 + 2HF}$ (HF ăn mòn thủy tinh)","B. $\\mathrm{CaCO_3 \\xrightarrow{t^\\circ} CaO + CO_2}$","C. $\\mathrm{Ca + 2H_2O \\rightarrow Ca(OH)_2 + H_2}$","D. $\\mathrm{CaO + H_2O \\rightarrow Ca(OH)_2}$"],"answer":"A","explain":"HF ăn mòn thủy tinh (thành phần $\\mathrm{SiO_2}$).","points":0.25},{"type":"mcq","level":"VD","q":"Cho $10$ gam $\\mathrm{CaCO_3}$ tác dụng với HCl dư. Thể tích $\\mathrm{CO_2}$ (đktc) là:","options":["A. $2,24$ lít","B. $1,12$ lít","C. $4,48$ lít","D. $3,36$ lít"],"answer":"A","explain":"$n = 0,1$ mol → $V = 2,24$ lít.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $m$ gam Mg vào dung dịch $\\mathrm{HNO_3}$ loãng dư thu được $2,24$ lít NO (đktc). Giá trị của $m$ là:","options":["A. $3,6$ gam","B. $7,2$ gam","C. $1,8$ gam","D. $14,4$ gam"],"answer":"A","explain":"$n_{NO} = 0,1$ mol → $n_{Mg} = 0,15$ mol → $m = 3,6$ gam.","points":0.25},{"type":"truefals + CO_2 + H_2O$.","points":0.25},{"type":"mcq","level":"TH","q":"Tác hại của nước cứng là:","options":["A. tốn xà phòng, đóng cặn thiết bị","B. gây ngộ độc cấp","C. làm nước có màu","D. không có tác hại"],"answer":"A","explain":"Nước cứng: tốn xà phòng, đóng cặn nồi hơi.","points":0.25},{"type":"mcq","level":"VD","q":"Một loại nước cứng chứa $0,005$ mol $\\mathrm{Mg(HCO_3)_2}$ trong $1$ lít. Đun sôi thu được bao nhiêu gam kết tủa $\\mathrm{MgCO_3}$? ($M = 84$)","options":["A. $0,42$ gam","B. $0,29$ gam","C. $0,58$ gam","D. $0,84$ gam"],"answer":"A","explain":"$n = 0,005$ mol → $m = 0,42$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $0,1$ mol $\\mathrm{Ca(HCO_3)_2}$ tác dụng với $0,15$ mol NaOH. Khối lượng kết tủa là:","options":["A. $7,5$ gam","B. $10$ gam","C. $5$ gam","D. $15$ gam"],"answer":"A","explain":"$\\mathrm{Ca(HCO_3)_2 + 2NaOH \\rightarrow CaCO_3 + Na_2CO_3 + 2H_2O}$: NaOH hết → $n_{\\mathrm{CaCO_3}} = 0,075$ mol → $m = 7,5$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cứng toàn phần gồm cả tạm thời và vĩnh cửu.","b) $\\mathrm{Na_2CO_3}$ làm mềm nước cứng vĩnh cửu.","c) Đun sôi nước cứng tạm thời cho kết tủa trắng.","d) Nước cứng tốn xà phòng."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đun sôi $1$ lít nước ($0,005$ mol $\\mathrm{Mg(HCO_3)_2}$) cho $0,42$ gam $\\mathrm{MgCO_3}$.","b) $0,1$ mol $\\mathrm{Ca(HCO_3)_2}$ + $0,15$ mol NaOH cho $7,5$ gam $\\mathrm{CaCO_3}$.","c) Nhựa trao đổi ion làm mềm nước cứng.","d) Nước cất là nước cứng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nước cất KHÔNG cứng.","points":1},{"type":"short","level":"VD","q":"Đun sôi nước cứng tạm thời chứa $\\mathrm{Ca(HCO_3)_2}$ thu được kết tủa trắng là chất nào? (viết công thức)","answer":"CaCO3","explain":"Phương trình: $\\mathrm{Ca(HCO_3)_2 \\xrightarrow{t^\\circ} CaCO_3 + CO_2 + H_2O}$.","points":0.5},{"type":"short","level":"VDC","q":"Một mẫu nước cứng chứa $162$ mg $\\mathrm{Ca(HCO_3)_2}$ trong $1$ lít. Đun sôi thu được bao nhiêu mg $\\mathrm{CaCO_3}$?","answer":"100","explain":"$n = 0,001$ mol → $m = 100$ mg.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Kết thúc bài 25: ion $\\mathrm{Ca^{2+}}$ có cấu hình electron giống:","options":["A. Ar","B. Ne","C. Kr","D. He"],"answer":"A","explain":"Ca ($Z=20$) nhường 2e → giống Ar ($Z=18$).","points":0.25},{"type":"mcq","level":"NB","q":"Ứng dụng của Mg trong đời sống là:","options":["A. hợp kim nhẹ, pháo hoa","B. dây điện","C. tiền xu","D. ắc quy"],"answer":"A","explain":"Mg: hợp kim nhẹ (máy bay), pháo hoa (cháy sáng).","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Be không tác dụng với nước?","options":["A. có màng oxit bảo vệ","B. là phi kim","C. nhẹ","D. trơ"],"answer":"A","explain":"Be có màng BeO bền bảo vệ.","points":0.25},{"type":"mcq","level":"TH","q":"Kim loại kiềm thổ tác dụng với dung dịch acid cho:","options":["A. muối và $\\mathrm{H_2}$","B. oxit và nước","C. base và muối","D. không phản ứng"],"answer":"A","explain":"$M + 2H^+ \\rightarrow M^{2+} + H_2$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $3,6$ gam Mg tác dụng với $\\mathrm{H_2SO_4}$ đặc nóng dư. Thể tích $\\mathrm{SO_2}$ (đktc) là:","options":["A. $3,36$ lít","B. $1,68$ lít","C. $6,72$ lít","D. $2,24$ lít"],"answer":"A","explain":"$n_{Mg} = 0,15$ mol → $n_{\\mathrm{SO_2}} = 0,15$ mol → $V = 3,36$ lít.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm Ca và Mg. Cho $6,4$ gam X tác dụng với HCl dư thu được $4,48$ lít $\\mathrm{H_2}$ (đktc). Phần trăm Ca trong X là:","options":["A. $62,5\\%$","B. $37,5\\%$","C. $31,25\\%$","D. $68,75\\%$"],"answer":"A","explain":"Đặt $a$, $b$: $40a + 24b = 6,4$; $a + b = 0,2$ → $a = b = 0,1$ → $m_{Ca} = 4$ gam → $62,5\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 25):","statements":["a) $\\mathrm{Ca^{2+}}$ có cấu hình giống Ar.","b) Mg dùng làm hợp kim nhẹ, pháo hoa.","c) Be có màng oxit bảo vệ.","d) Kiềm thổ + acid cho muối và $\\mathrm{H_2}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $3,6$ gam Mg + $\\mathrm{H_2SO_4}$ đặc cho $3,36$ lít $\\mathrm{SO_2}$ (đktc).","b) Hỗn hợp Ca + Mg ($6,4$ gam) + HCl cho $4,48$ lít $\\mathrm{H_2}$ thì $\\%Ca = 62,5\\%$.","c) $\\mathrm{CaSO_4 \\cdot 2H_2O}$ là thạch cao sống.","d) Nước cứng chứa $\\mathrm{Na^+}$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nước cứng chứa $\\mathrm{Ca^{2+}}$, $\\mathrm{Mg^{2+}}$.","points":1},{"type":"short","level":"VD","q":"Cho $5$ gam $\\mathrm{CaCO_3}$ tác dụng với HCl dư. Thể tích $\\mathrm{CO_2}$ (đktc) là bao nhiêu lít?","answer":"1,12","explain":"$n = 0,05$ mol → $V = 1,12$ lít.","points":0.5},{"type":"short","level":"VDC","q":"Điện phân nóng chảy $11,1$ gam $\\mathrm{CaCl_2}$ ($M = 111$) thu được bao nhiêu gam Ca?","answer":"4","explain":"$n = 0,1$ mol → $m = 4$ gam.","points":0.5}]}]}</script>
