hrm{Na_2CO_3}$ + $\\mathrm{CaCl_2}$ cho $5$ gam $\\mathrm{CaCO_3}$.", "b) $2,24$ lít $\\mathrm{CO_2}$ + $0,15$ mol NaOH cho $9,5$ gam hỗn hợp muối.", "c) $\\mathrm{NaHCO_3}$ bị nhiệt phân.", "d) $\\mathrm{KNO_3}$ dùng làm phân bón."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho $8,4$ gam $\\mathrm{NaHCO_3}$ tác dụng với HCl dư. Thể tích $\\mathrm{CO_2}$ (đktc) là bao nhiêu lít?", "answer": "2,24", "explain": "$n = 0,1$ mol → $V = 2,24$ lít.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhiệt phân $16,8$ gam $\\mathrm{NaHCO_3}$ (hiệu suất $100\\%$). Khối lượng chất rắn còn lại là bao nhiêu gam?", "answer": "10,6", "explain": "$n = 0,2$ mol → $n_{\\mathrm{Na_2CO_3}} = 0,1$ mol → $m = 10,6$ gam.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tổng hợp bài 24: kim loại kiềm có đặc điểm nào sau đây?", "options": ["A. $ns^1$, tính khử mạnh, mềm, nhẹ", "B. $ns^2$, tính oxi hóa mạnh", "C. cứng, nặng", "D. trơ về mặt hóa học"], "answer": "A", "explain": "Đặc điểm kim loại kiềm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hợp chất nào sau đây của Na được dùng trong sản xuất thủy tinh?", "options": ["A. $\\mathrm{Na_2CO_3}$", "B. NaCl", "C. $\\mathrm{NaHCO_3}$", "D. NaOH"], "answer": "A", "explain": "Soda $\\mathrm{Na_2CO_3}$ dùng sản xuất thủy tinh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy nào sau đây sắp xếp tính khử tăng dần?", "options": ["A. Li, Na, K, Cs", "B. Cs, K, Na, Li", "C. Na, Li, K, Cs", "D. K, Na, Li, Cs"], "answer": "A", "explain": "Tính khử tăng dần từ Li đến Cs.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phản ứng nào sau đây KHÔNG xảy ra?", "options": ["A. Na + $\\mathrm{H_2O}$ (lạnh)", "B. K + $\\mathrm{H_2O}$ (lạnh)", "C. Na + dung dịch $\\mathrm{CuSO_4}$ cho Cu", "D. Na + $\\mathrm{Cl_2}$"], "answer": "C", "explain": "Na tác dụng với NƯỚC trong dung dịch $\\mathrm{CuSO_4}$ trước ": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tố nào sau đây là kim loại kiềm?", "options": ["A. Na", "B. Mg", "C. Al", "D. Fe"], "answer": "A", "explain": "Na thuộc nhóm IA.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số electron lớp ngoài cùng của K ($Z = 19$) là:", "options": ["A. $1$", "B. $2$", "C. $7$", "D. $8$"], "answer": "A", "explain": "K: $[Ar]4s^1$ → 1 electron lớp ngoài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh bán kính nguyên tử Na và K:", "options": ["A. K lớn hơn Na", "B. Na lớn hơn K", "C. bằng nhau", "D. không so sánh được"], "answer": "A", "explain": "Cùng nhóm, K ở chu kì lớn hơn → bán kính lớn hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại kiềm tác dụng với halogen tạo:", "options": ["A. muối halide", "B. oxit", "C. hydroxide", "D. hydride"], "answer": "A", "explain": "$2Na + Cl_2 \\rightarrow 2NaCl$: muối halide.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $11,5$ gam Na tác dụng với $\\mathrm{H_2}$ dư, đun nóng. Khối lượng NaH thu được là:", "options": ["A. $12$ gam", "B. $11,5$ gam", "C. $24$ gam", "D. $6$ gam"], "answer": "A", "explain": "$n_{Na} = 0,5$ mol → $m_{NaH} = 12$ gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hỗn hợp X gồm Li và Na. Cho $6$ gam X tác dụng với nước dư thu được $4,48$ lít $\\mathrm{H_2}$ (đktc). Phần trăm Li trong X là:", "options": ["A. $23,3\\%$", "B. $76,7\\%$", "C. $40,6\\%$", "D. $59,4\\%$"], "answer": "A", "explain": "Đặt $a$, $b$: $7a + 23b = 6$; $0,5a + 0,5b = 0,2$ → $a = b = 0,2$ → $m_{Li} = 1,4$ gam → $\\%Li = 23,3\\%$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Na là kim loại kiềm.", "b) K có 1 electron lớp ngoài cùng.", "c) Bán kính K lớn hơn Na.", "d) Na + halogen tạo muối halide."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $11,5$ gam Na + $\\mathrm{H_2}$ cho $12$ gam NaH.", "b) Hỗn hợp Li + Na ($6$ gam) + nước cho $4,48$ lít $\\mathrm{H_2}$ thì $\\%Li = 23,3\\%$.", "c) Kim loại kiềm có $t^\\circ_{nc}$ thấp.", "d) $\\mathrm{Na_2O}$ là oxit acid."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $\\mathrm{Na_2O}$ là oxit BAZƠ.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho $7,8$ gam K tác dụng với $\\mathrm{O_2}$ dư tạo $\\mathrm{K_2O}$. Khối lượng $\\mathrm{K_2O}$ là bao nhiêu gam?", "answer": "9,4", "explain": "$n_K = 0,2$ mol → $n_{\\mathrm{K_2O}} = 0,1$ mol → $m = 9,4$ gam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện phân nóng chảy $23,4$ gam NaCl thu được bao nhiêu gam Na?", "answer": "9,2", "explain": "$n = 0,4$ mol → $m = 9,2$ gam.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Kim loại kiềm có màu sắc đặc trưng là:", "options": ["A. trắng bạc", "B. vàng", "C. đỏ", "D. xám đen"], "answer": "A", "explain": "Kim loại kiềm màu trắng bạc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ cứng của kim loại kiềm so với các kim loại khác là:", "options": ["A. mềm nhất", "B. cứng nhất", "C. trung bình", "D. rất cứng"], "answer": "A", "explain": "Kim loại kiềm mềm nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi cho Na vào dung dịch $\\mathrm{HCl}$, hiện tượng là:", "options": ["A. Na tan, sủi bọt khí", "B. có kết tủa", "C. không hiện tượng", "D. dung dịch chuyển màu"], "answer": "A", "explain": "Na tác dụng với nước/acid → $H_2$ sủi bọt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để dập tắt đám cháy kim loại Na, KHÔNG dùng:", "options": ["A. nước", "B. cát khô", "C. khí $\\mathrm{CO_2}$", "D. chăn ướt"], "answer": "A", "explain": "Na tác dụng mãnh liệt với nước → KHÔNG dùng nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $0,2$ mol Na tác dụng với $0,1$ mol $\\mathrm{Cl_2}$. Khối lượng NaCl thu được là:", "options": ["A. $11,7$ gam", "B. $5,85$ gam", "C. $23,4$ gam", "D. $58,5$ gam"], "answer": "A", "explain": "$2Na + Cl_2 \\rightarrow 2NaCl$: vừa đủ → $n_{NaCl} = 0,2$ mol → $m = 11,7$ gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $4,6$ gam Na vào $200$ ml dung dịch HCl $1$M. Thể tích $\\mathrm{H_2}$ (đktc) là:", "options": ["A. $2,24$ lít", "B. $1,12$ lít", "C. $4,48$ lít", "D. $3,36$ lít"], "answer": "A", "explain": "$n_{Na} = 0,2$ mol; $n_{HCl} = 0,2$ mol. Na tác dụng với HCl và nước: tổng $n_{\\mathrm{H_2}} = 0,1$ mol → $V = 2,24$ lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kim loại kiềm màu trắng bạc.", "b) Kim loại kiềm mềm nhất.", "c) Na + HCl sủi bọt khí $\\mathrm{H_2}$.", "d) Chữa cháy Na không dùng nước."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $0,2$ mol Na + $0,1$ mol $\\mathrm{Cl_2}$ cho $11,7$ gam NaCl.", "b) $4,6$ gam Na + $200$ ml HCl $1$M cho $2,24$ lít $\\mathrm{H_2}$ (đktc).", "c) Kim loại kiềm dễ cắt bằng dao.", "d) Na có khối lượng riêng lớn hơn nước."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: Na NHẸ hơn nước ($0,97$ g/cm$^3$).", "points": 1}, {"type": "short", "level": "VD", "q": "Cho $3,9$ gam K tác dụng với nước dư. Thể tích $\\mathrm{H_2}$ (đktc) là bao nhiêu lít?", "answer": "1,12", "explain": "$n_K = 0,1$ mol → $V = 1,12$ lít.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hòa tan $9,3$ gam $\\mathrm{Na_2O}$ vào nước. Khối lượng NaOH thu được là bao nhiêu gam?", "answer": "12", "explain": "$n = 0,15$ mol → $n_{NaOH} = 0,3$ mol → $m = 12$ gam.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Ôn tập bài 24: thế điện cực chuẩn của cặp $\\mathrm{Na^+/Na}$ là:", "options": ["A. $-2,71$ V", "B. $+2,71$ V", "C. $-0,76$ V", "D. $0$ V"], "answer": "A", "explain": "$E^\\circ_{Na^+/Na} = -2,71$ V.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kim loại kiềm thổ thuộc nhóm:", "options": ["A. IIA", "B. IA", "C. IIIA", "D. VIIA"], "answer": "A", "explain": "Nhắc lại: nhóm IIA là kim loại kiềm thổ (sang bài 25).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các kim loại kiềm, kim loại có tính khử mạnh nhất là:", "options": ["A. Cs", "B. Li", "C. Na", "D. K"], "answer": "A", "explain": "Cs ($E^\\circ = -3,03$ V) có tính khử mạnh nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các ion $\\mathrm{Li^+}$, $\\mathrm{Na^+}$, $\\mathrm{K^+}$, ion có tính oxi hóa mạnh nhất là:", "options": ["A. $\\mathrm{Li^+}$", "B. $\\mathrm{Na^+}$", "C. $\\mathrm{K^+}$", "D. $\\mathrm{Cs^+}$"], "answer": "A", "explain": "$\\mathrm{Li^+}$ có $E^\\circ$ ít âm nhất → tính oxi hóa mạnh nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $1,4$ gam Li tác dụng với nước dư. Thể tích $\\mathrm{H_2}$ (đktc) là:", "options": ["A. $2,24$ lít", "B. $1,12$ lít", "C. $4,48$ lít", "D. $0,56$ lít"], "answer": "A", "explain": "$n_{Li} = 0,2$ mol → $V = 2,24$ lít.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $m$ gam Na vào nước dư thu được $100$ gam dung dịch NaOH $8\\%$. Giá trị của $m$ là:", "options": ["A. $4,6$ gam", "B. $2,3$ gam", "C. $9,2$ gam", "D. $0,46$ gam"], "answer": "A", "explain": "$m_{NaOH} = 8$ gam → $n = 0,2$ mol → $n_{Na} = 0,2$ mol → $m = 4,6$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $E^\\circ_{Na^+/Na} = -2,71$ V.", "b) Kim loại kiềm thổ thuộc nhóm IIA.", "c) Cs có tính khử mạnh nhất.", "d) $\\mathrm{Li^+}$ có tính oxi hóa mạnh nhất trong các ion kiềm."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $1,4$ gam Li + nước cho $2,24$ lít $\\mathrm{H_2}$ (đktc).", "b) $4,6$ gam Na + nước cho $100$ gam dung dịch NaOH $8\\%$.", "c) Kim loại kiềm là chất khử mạnh.", "d) Ion $\\mathrm{Na^+}$ có tính khử mạnh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: ion $\\mathrm{Na^+}$ có tính OXI HÓA (yếu).", "points": 1}, {"type": "short", "level": "VD", "q": "Điện phân nóng chảy $5,85$ gam NaCl thu được bao nhiêu gam $\\mathrm{Cl_2}$?", "answer": "3,55", "explain": "$n_{\\mathrm{Cl_2}} = 0,05$ mol → $m = 3,55$ gam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho $6,9$ gam Na vào $93,4$ gam nước. Nồng độ phần trăm dung dịch NaOH là bao nhiêu?", "answer": "12", "explain": "$n_{NaOH} = 0,3$ mol ($12$ gam); $m_{dd} = 100$ gam → $C\\% = 12\\%$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Phản ứng đặc trưng của kim loại kiềm với nước tạo ra:", "options": ["A. hydroxide và $\\mathrm{H_2}$", "B. oxit và $\\mathrm{H_2}$", "C. muối và $\\mathrm{H_2O}$", "D. chỉ $\\mathrm{H_2}$"], "answer": "A", "explain": "$2M + 2H_2O \\rightarrow 2MOH + H_2$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Muối nào sau đây được dùng làm bột nở?", "options": ["A. $\\mathrm{NaHCO_3}$", "B. NaCl", "C. $\\mathrm{Na_2CO_3}$", "D. $\\mathrm{KNO_3}$"], "answer": "A", "explain": "$\\mathrm{NaHCO_3}$: bột nở.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận biết dung dịch $\\mathrm{Na_2CO_3}$ và $\\mathrm{NaCl}$ bằng:", "options": ["A. dung dịch HCl", "B. quỳ tím", "C. dung dịch NaOH", "D. nước"], "answer": "A", "explain": "$\\mathrm{Na_2CO_3}$ + HCl sủi bọt $\\mathrm{CO_2}$; NaCl không hiện tượng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Màu ngọn lửa của Na khi thử bằng dây Pt là:", "options": ["A. vàng", "B. tím", "C. đỏ", "D. xanh"], "answer": "A", "explain": "Na: vàng; K: tím.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nung $21$ gam $\\mathrm{NaHCO_3}$. Thể tích $\\mathrm{CO_2}$ (đktc) thu được là:", "options": ["A. $2,8$ lít", "B. $5,6$ lít", "C. $1,4$ lít", "D. $11,2$ lít"], "answer": "A", "explain": "$n = 0,25$ mol → $n_{\\mathrm{CO_2}} = 0,125$ mol → $V = 2,8$ lít.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $0,2$ mol Na vào dung dịch chứa $0,1$ mol $\\mathrm{AlCl_3}$. Khối lượng kết tủa là:", "options": ["A. $5,2$ gam", "B. $7,8$ gam", "C. $15,6$ gam", "D. $3,9$ gam"], "answer": "A", "explain": "$n_{NaOH} = 0,2$ mol; $\\mathrm{Al^{3+} + 3OH^- \\rightarrow Al(OH)_3}$: $OH^-$ hết → $n_{\\mathrm{Al(OH)_3}} = 0,2/3$ mol → $m = 5,2$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $2M + 2H_2O \\rightarrow 2MOH + H_2$.", "b) $\\mathrm{NaHCO_3}$ dùng làm bột nở.", "c) HCl nhận biết được $\\mathrm{Na_2CO_3}$ và NaCl.", "d) Na cho ngọn lửa màu vàng."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nung $21$ gam $\\mathrm{NaHCO_3}$ cho $2,8$ lít $\\mathrm{CO_2}$ (đktc).", "b) $0,2$ mol Na + $0,1$ mol $\\mathrm{AlCl_3}$ cho $5,2$ gam $\\mathrm{Al(OH)_3}$.", "c) K cho ngọn lửa màu tím.", "d) $\\mathrm{Na_2CO_3}$ làm quỳ tím hóa đỏ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $\\mathrm{Na_2CO_3}$ làm quỳ tím hóa XANH.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho $11,7$ gam NaCl tác dụng với $\\mathrm{AgNO_3}$ dư. Khối lượng AgCl là bao nhiêu gam?", "answer": "28,7", "explain": "$n = 0,2$ mol → $m = 28,7$ gam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trộn $100$ ml NaOH $1$M với $100$ ml HCl $1$M. Khối lượng NaCl thu được là bao nhiêu gam?", "answer": "5,85", "explain": "$n = 0,1$ mol → $m = 5,85$ gam.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Kết thúc bài 24: kim loại kiềm có bao nhiêu electron hóa trị?", "options": ["A. $1$", "B. $2$", "C. $3$", "D. $7$"], "answer": "A", "explain": "1 electron hóa trị ($ns^1$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hợp chất nào sau đây là thành phần của thuốc nổ đen?", "options": ["A. $\\mathrm{KNO_3}$", "B. NaCl", "C. $\\mathrm{NaHCO_3}$", "D. $\\mathrm{Na_2CO_3}$"], "answer": "A", "explain": "Thuốc nổ đen: $\\mathrm{KNO_3}$ + C + S.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao kim loại kiềm có tính khử mạnh?", "options": ["A. dễ nhường 1 electron lớp ngoài cùng", "B. dễ nhận electron", "C. bán kính nhỏ", "D. năng lượng ion hóa lớn"], "answer": "A", "explain": "1 electron lớp ngoài, bán kính lớn, $I_1$ nhỏ → dễ nhường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại kiềm nào nhẹ nhất?", "options": ["A. Li", "B. Na", "C. K", "D. Cs"], "answer": "A", "explain": "Li ($0,53$ g/cm$^3$) nhẹ nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $2,8$ gam Li tác dụng với $\\mathrm{N_2}$ dư, đun nóng tạo $\\mathrm{Li_3N}$. Khối lượng sản phẩm là:", "options": ["A. $4,66$ gam", "B. $2,8$ gam", "C. $6,99$ gam", "D. $1,4$ gam"], "answer": "A", "explain": "$n_{Li} = 0,4$ mol → $n_{\\mathrm{Li_3N}} = 0,133$ mol → $m = 4,66$ gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện phân nóng chảy $a$ gam $\\mathrm{KCl}$ thu được $3,9$ gam K. Giá trị của $a$ là:", "options": ["A. $7,45$ gam", "B. $3,725$ gam", "C. $14,9$ gam", "D. $74,5$ gam"], "answer": "A", "explain": "$n_K = 0,1$ mol → $a = 7,45$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 24):", "statements": ["a) Kim loại kiềm có 1 electron hóa trị.", "b) $\\mathrm{KNO_3}$ là thành phần thuốc nổ đen.", "c) Kim loại kiềm dễ nhường electron.", "d) Li nhẹ nhất."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $2,8$ gam Li + $\\mathrm{N_2}$ cho $4,66$ gam $\\mathrm{Li_3N}$.", "b) Điện phân $7,45$ gam KCl nóng chảy cho $3,9$ gam K.", "c) Kim loại kiềm tác dụng với phi kim.", "d) $\\mathrm{Na^+}$ dễ bị khử thành Na."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $\\mathrm{Na^+}$ KHÓ bị khử ($E^\\circ$ rất âm).", "points": 1}, {"type": "short", "level": "VD", "q": "Cho $6,9$ gam Na tác dụng với $\\mathrm{O_2}$ dư tạo $\\mathrm{Na_2O}$. Khối lượng $\\mathrm{Na_2O}$ là bao nhiêu gam?", "answer": "9,3", "explain": "$n_{Na} = 0,3$ mol → $n = 0,15$ mol → $m = 9,3$ gam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hòa tan $m$ gam K vào nước thu được $2,24$ lít $\\mathrm{H_2}$ (đktc). Giá trị của $m$ là bao nhiêu?", "answer": "7,8", "explain": "$n_{\\mathrm{H_2}} = 0,1$ mol → $n_K = 0,2$ mol → $m = 7,8$ gam.", "points": 0.5}]}]}</script>
