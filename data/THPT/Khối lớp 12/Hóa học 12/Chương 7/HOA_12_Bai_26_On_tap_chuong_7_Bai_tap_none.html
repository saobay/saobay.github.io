ập chương 7: kim loại kiềm có màu:","options":["A. trắng bạc","B. vàng","C. đỏ","D. đen"],"answer":"A","explain":"Trắng bạc.","points":0.25},{"type":"mcq","level":"NB","q":"Kim loại kiềm thổ có độ cứng:","options":["A. lớn hơn kim loại kiềm","B. nhỏ hơn kim loại kiềm","C. bằng kim loại kiềm","D. rất mềm"],"answer":"A","explain":"Kiềm thổ cứng hơn kiềm.","points":0.25},{"type":"mcq","level":"TH","q":"Phản ứng của Ca với nước tạo:","options":["A. $\\mathrm{Ca(OH)_2}$ và $\\mathrm{H_2}$","B. CaO và $\\mathrm{H_2}$","C. $\\mathrm{CaCO_3}$","D. không phản ứng"],"answer":"A","explain":"$\\mathrm{Ca + 2H_2O \\rightarrow Ca(OH)_2 + H_2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Để phân biệt Na và Ca, có thể dùng:","options":["A. nước (tốc độ phản ứng)","B. mắt thường","C. nam châm","D. cân"],"answer":"A","explain":"Na phản ứng mãnh liệt hơn, nổi trên mặt nước cháy; Ca chìm, sủi bọt.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $11,7$ gam NaCl điện phân nóng chảy (hiệu suất $80\\%$). Khối lượng Na là:","options":["A. $3,68$ gam","B. $4,6$ gam","C. $1,84$ gam","D. $9,2$ gam"],"answer":"A","explain":"$n_{NaCl} = 0,2$ mol → lý thuyết $4,6$ gam → thực tế $3,68$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm Na và Ba. Cho $m$ gam X tác dụng với nước dư thu được $6,72$ lít $\\mathrm{H_2}$ (đktc). Biết $m = 32,35$ gam, phần trăm Ba trong X là:","options":["A. $84,7\\%$","B. $15,3\\%$","C. $42,4\\%$","D. $57,6\\%$"],"answer":"A","explain":"Đặt $a$, $b$: $23a + 137b = 32,35$; $0,5a + b = 0,3$ → $a = 0,2$, $b = 0,2$ → $m_{Ba} = 27,4$ gam → $84,7\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kim loại kiềm màu trắng bạc.","b) Kiềm thổ cứng hơn kiềm.","c) $\\mathrm{Ca + 2H_2O \\rightarrow Ca(OH)_2 + H_2}$.","d) Phân biệt Na, Ca bằng nước."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của cá ":["A. $4$ gam","B. $2$ gam","C. $8$ gam","D. $0,4$ gam"],"answer":"A","explain":"$m_{\\mathrm{Ca(OH)_2}} = 7,4$ gam → $n = 0,1$ mol → $m_{Ca} = 4$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 7):","statements":["a) Li, Na, K là kim loại kiềm.","b) Be, Mg, Ca là kim loại kiềm thổ.","c) Na tác dụng với nước ở nhiệt độ thường.","d) Mg không tác dụng với nước ở nhiệt độ thường."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $15,6$ gam K + nước cho $22,4$ gam KOH.","b) $4$ gam Ca + nước cho $150$ gam dung dịch $4,93\\%$.","c) $\\mathrm{Na_2CO_3}$ dùng sản xuất thủy tinh.","d) $\\mathrm{CaCO_3}$ là đá vôi."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Cho $4,8$ gam Mg tác dụng với HCl dư. Thể tích $\\mathrm{H_2}$ (đktc) là bao nhiêu lít?","answer":"4,48","explain":"$n_{Mg} = 0,2$ mol → $V = 4,48$ lít.","points":0.5},{"type":"short","level":"VDC","q":"Nung $25$ gam đá vôi chứa $80\\%$ $\\mathrm{CaCO_3}$ (hiệu suất $100\\%$). Khối lượng CaO là bao nhiêu gam?","answer":"11,2","explain":"$m_{\\mathrm{CaCO_3}} = 20$ gam → $n = 0,2$ mol → $m = 11,2$ gam.","points":0.5}]}]}</script>
