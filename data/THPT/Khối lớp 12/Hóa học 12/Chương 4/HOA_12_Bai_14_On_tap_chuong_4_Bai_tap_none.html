, nylon-6,6 — có bao nhiêu polymer điều chế bằng trùng ngưng?", "answer": "2", "explain": "Tơ capron và nylon-6,6 → 2.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đốt cháy hoàn toàn $m$ gam nylon-6,6 (mắt xích $\\mathrm{C_{12}H_{22}N_2O_2}$) thu được $2,24$ lít $\\mathrm{N_2}$ (đktc). Giá trị của $m$ là bao nhiêu?", "answer": "22,6", "explain": "$n_{\\mathrm{N_2}} = 0,1$ mol → $n_{mắt\\ xích} = 0,1$ mol → $m = 22,6$ gam.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Polymer thiên nhiên là:", "options": ["A. cellulose", "B. PE", "C. PVC", "D. nylon-6,6"], "answer": "A", "explain": "Cellulose, tinh bột, protein là polymer thiên nhiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Polymer tổng hợp là:", "options": ["A. PVC", "B. tinh bột", "C. cellulose", "D. tơ tằm"], "answer": "A", "explain": "PVC, PE, nylon là polymer tổng hợp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Polymer bán tổng hợp là:", "options": ["A. tơ acetate", "B. PE", "C. tinh bột", "D. cao su buna"], "answer": "A", "explain": "Tơ acetate, tơ visco là polymer bán tổng hợp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Polymer có cấu trúc mạch nhánh là:", "options": ["A. amylopectin", "B. PE", "C. PVC", "D. tơ nitron"], "answer": "A", "explain": "Amylopectin có cấu trúc mạch nhánh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong các polymer: tinh bột, PE, tơ visco, PVC, protein — số polymer thiên nhiên là:", "options": ["A. $2$", "B. $3$", "C. $1$", "D. $4$"], "answer": "A", "explain": "Tinh bột và protein → 2.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một mẫu polymer có $M = 68000$ gồm mắt xích isoprene ($M = 68$). Số mắt xích là:", "options": ["A. $1000$", "B. $100$", "C. $10000$", "D. $680$"], "answer": "A", "explain": "$n = 68000/68 = 1000$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cellulose là polymer thiên nhiên.", "b) PVC là polymer tổng hợp.", "c) Tơ acetate là polymer bán tổng hợp.", "d) Amylopectin có mạch nhánh."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong 5 polymer (tinh bột, PE, visco, PVC, protein) có 2 polymer thiên nhiên.", "b) Cao su ($M = 68000$) có $1000$ mắt xích isoprene.", "c) Tơ visco là tơ tổng hợp.", "d) PE là polymer thiên nhiên."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c) Sai: tơ visco là tơ BÁN TỔNG HỢP. d) Sai: PE là polymer TỔNG HỢP.", "points": 1}, {"type": "short", "level": "VD", "q": "Một mẫu tinh bột có $M = 1620000$. Số mắt xích glucose trung bình là bao nhiêu? ($M_{mắt\\ xích} = 162$)", "answer": "10000", "explain": "$n = 1620000/162 = 10000$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trùng hợp $13,6$ gam isoprene ($M = 68$) với hiệu suất $75\\%$. Khối lượng cao su thu được là bao nhiêu gam?", "answer": "10,2", "explain": "$m = 13,6 \\times 75\\% = 10,2$ gam.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tính chất chung của polymer là:", "options": ["A. không bay hơi, cách điện", "B. dễ bay hơi, dẫn điện", "C. tan tốt trong nước", "D. có mùi thơm"], "answer": "A", "explain": "Polymer không bay hơi, cách điện, ít tan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ứng dụng của PE là:", "options": ["A. túi nilon", "B. lốp xe", "C. áo len", "D. dây chun"], "answer": "A", "explain": "PE dùng làm túi nilon, màng bọc thực phẩm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ứng dụng của cao su là:", "options": ["A. lốp xe", "B. túi nilon", "C. ống nước", "D. vỏ dây điện"], "answer": "A", "explain": "Cao su dùng làm lốp xe, dây chun, găng tay.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ứng dụng của tơ là:", "options": ["A. dệt vải", "B. làm lốp xe", "C. làm ống nước", "D. dán gỗ"], "answer": "A", "explain": "Tơ dùng dệt vải, may mặc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đốt cháy hoàn toàn $2,8$ gam PE. Thể tích $\\mathrm{CO_2}$ (đktc) thu được là:", "options": ["A. $4,48$ lít", "B. $2,24$ lít", "C. $8,96$ lít", "D. $1,12$ lít"], "answer": "A", "explain": "$n_{mắt\\ xích} = 0,1$ mol → $n_{\\mathrm{CO_2}} = 0,2$ mol → $V = 4,48$ lít.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đốt cháy hoàn toàn $m$ gam PVC (mắt xích $\\mathrm{C_2H_3Cl}$) thu được $8,96$ lít $\\mathrm{CO_2}$ (đktc). Giá trị của $m$ là:", "options": ["A. $12,5$ gam", "B. $6,25$ gam", "C. $25$ gam", "D. $3,125$ gam"], "answer": "A", "explain": "$n_{\\mathrm{CO_2}} = 0,4$ mol → $n_{mắt\\ xích} = 0,2$ mol → $m = 12,5$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Polymer không bay hơi, cách điện.", "b) PE dùng làm túi nilon.", "c) Cao su dùng làm lốp xe.", "d) Tơ dùng dệt vải."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $2,8$ gam PE cháy cho $4,48$ lít $\\mathrm{CO_2}$ (đktc).", "b) $12,5$ gam PVC cháy cho $8,96$ lít $\\mathrm{CO_2}$ (đktc).", "c) Polymer dẫn điện tốt.", "d) PE tan trong nước."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c), d) Sai: polymer cách điện, ít tan trong nước.", "points": 1}, {"type": "short", "level": "VD", "q": "Trùng hợp $m$ gam vinyl chloride thu được $31,25$ gam PVC (hiệu suất $80\\%$). Giá trị của $m$ là bao nhiêu?", "answer": "39,0625", "explain": "$m = 31,25/0,8 = 39,0625$ gam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một mẫu polymer có $M = 85000$, mắt xích trung bình $M = 85$. Hệ số polymer hóa $n$ là bao nhiêu?", "answer": "1000", "explain": "$n = 85000/85 = 1000$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng?", "options": ["A. trùng hợp không tách chất nhỏ", "B. trùng hợp tách nước", "C. trùng ngưng không tách chất nhỏ", "D. trùng ngưng tạo monomer"], "answer": "A", "explain": "Trùng hợp: không tách chất nhỏ; trùng ngưng: tách chất nhỏ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây sai?", "options": ["A. PE là tơ", "B. PE là chất dẻo", "C. PE trùng hợp từ ethylene", "D. PE cách điện"], "answer": "A", "explain": "PE là CHẤT DẺO, không phải tơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cặp polymer nào sau đây đều điều chế bằng trùng hợp?", "options": ["A. PE, PVC", "B. PE, nylon-6,6", "C. PVC, nylon-6,6", "D. nylon-6,6, tơ capron"], "answer": "A", "explain": "PE và PVC đều điều chế bằng trùng hợp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cặp polymer nào sau đây đều điều chế bằng trùng ngưng?", "options": ["A. nylon-6,6, tơ capron", "B. PE, PVC", "C. tơ nitron, cao su buna", "D. PE, tơ nitron"], "answer": "A", "explain": "Nylon-6,6 và tơ capron đều liên quan trùng ngưng/mở vòng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một mẫu polymer có $5000$ mắt xích, mỗi mắt xích $M = 42$. Khối lượng phân tử trung bình là:", "options": ["A. $210000$", "B. $5000$", "C. $21000$", "D. $119$"], "answer": "A", "explain": "$M = 5000 \\times 42 = 210000$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trùng ngưng $m$ gam caprolactam ($M = 113$) thu được $22,6$ gam tơ capron (hiệu suất $100\\%$). Giá trị của $m$ là:", "options": ["A. $22,6$ gam", "B. $11,3$ gam", "C. $45,2$ gam", "D. $20,34$ gam"], "answer": "A", "explain": "Mở vòng không tách chất nhỏ: $m = 22,6$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trùng hợp không tách chất nhỏ.", "b) PE là chất dẻo.", "c) PE, PVC đều từ trùng hợp.", "d) Nylon-6,6, tơ capron từ trùng ngưng."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Polymer ($5000$ mắt xích, $M = 42$) có $M = 210000$.", "b) $22,6$ gam caprolactam cho $22,6$ gam tơ capron.", "c) Trùng ngưng tách nước.", "d) Tơ nitron điều chế bằng trùng ngưng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tơ nitron điều chế bằng TRÙNG HỢP.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong các phản ứng: tạo PE, PVC, nylon-6,6, tơ nitron, cao su buna — có bao nhiêu phản ứng trùng hợp?", "answer": "4", "explain": "PE, PVC, tơ nitron, buna → 4.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một mẫu cao su buna-S có $M = 118000$ ($M_{mắt\\ xích\\ tb} = 59$). Hệ số polymer hóa là bao nhiêu?", "answer": "2000", "explain": "$n = 118000/59 = 2000$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tổng hợp chương 4: polymer nào sau đây có cấu trúc mạng không gian?", "options": ["A. nhựa bakelite", "B. PE", "C. PVC", "D. tơ visco"], "answer": "A", "explain": "Nhựa bakelite (và cao su lưu hóa) có cấu trúc mạng không gian.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Polymer nào sau đây là nhựa nhiệt dẻo?", "options": ["A. PP", "B. bakelite", "C. cao su lưu hóa", "D. keo epoxy đã rắn"], "answer": "A", "explain": "PP là nhựa nhiệt dẻo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Polymer nào sau đây tan được trong dung môi hữu cơ ở nhiệt độ thường?", "options": ["A. cao su chưa lưu hóa", "B. cao su lưu hóa", "C. nhựa bakelite", "D. keo epoxy đã rắn"], "answer": "A", "explain": "Cao su chưa lưu hóa (mạch thẳng) tan được; đã lưu hóa (mạng không gian) không tan.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Polymer nào sau đây KHÔNG tan trong dung môi hữu cơ?", "options": ["A. nhựa bakelite", "B. PE ở nhiệt độ cao", "C. PVC", "D. PS"], "answer": "A", "explain": "Bakelite (mạng không gian) không tan.", "poin
