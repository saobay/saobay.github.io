{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Vật liệu polymer có tính dẻo là:","options":["A. chất dẻo","B. cao su","C. tơ","D. keo dán"],"answer":"A","explain":"Chất dẻo (PE, PVC, PP, PS) có tính dẻo, dễ tạo hình.","points":0.25},{"type":"mcq","level":"NB","q":"PE được dùng làm:","options":["A. màng bọc thực phẩm","B. lốp xe","C. áo len","D. keo dán"],"answer":"A","explain":"PE dùng làm màng bọc thực phẩm, túi nilon, chai lọ.","points":0.25},{"type":"mcq","level":"TH","q":"PVC được dùng làm:","options":["A. ống nước","B. lốp xe","C. vải may mặc","D. dây chun"],"answer":"A","explain":"PVC dùng làm ống nước, vỏ bọc dây điện, da nhân tạo.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các polymer sau, polymer dùng làm chất dẻo là:","options":["A. PS","B. cao su buna","C. tơ nitron","D. keo epoxy"],"answer":"A","explain":"PS (polystyrene) là chất dẻo; các chất còn lại thuộc nhóm khác.","points":0.25},{"type":"mcq","level":"VD","q":"Trùng hợp $10,6$ gam acrylonitrile ($M = 53$) với hiệu suất $80\\%$. Khối lượng tơ nitron thu được là:","options":["A. $8,48$ gam","B. $10,6$ gam","C. $13,25$ gam","D. $5,3$ gam"],"answer":"A","explain":"$m = 10,6 \\times 80\\% = 8,48$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Một mẫu PVC có $M = 62500$. Số mắt xích trung bình là: ($M_{mắt\\ xích} = 62,5$)","options":["A. $1000$","B. $100$","C. $10000$","D. $500$"],"answer":"A","explain":"$n = 62500/62,5 = 1000$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chất dẻo có tính dẻo.","b) PE dùng làm màng bọc thực phẩm.","c) PVC dùng làm ống nước.","d) PS là cao su."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: PS là CHẤT DẺO.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $10,6$ gam acrylonitrile (H = $80\\%$) cho $8,48$ gam tơ nitron.","b) PVC ($M = 62500$) có $1000$ mắt xích.","c) Chất dẻo cách điện.","d) PE tan tốt trong nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: PE KHÔNG tan trong nước.","points":1},{"type":"short","level":"VD","q":"Trùng hợp $m$ gam vinyl chloride thu được $50$ gam PVC (hiệu suất $100\\%$). Giá trị của $m$ là bao nhiêu?","answer":"50","explain":"Trùng hợp không tách chất nhỏ: $m = 50$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Một mẫu PP có $M = 84000$. Hệ số polymer hóa $n$ là bao nhiêu? ($M_{mắt\\ xích} = 42$)","answer":"2000","explain":"$n = 84000/42 = 2000$.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Tơ bán tổng hợp là:","options":["A. tơ visco","B. tơ tằm","C. nylon-6,6","D. bông"],"answer":"A","explain":"Tơ visco, tơ acetate chế biến từ cellulose → tơ bán tổng hợp.","points":0.25},{"type":"mcq","level":"NB","q":"Tơ tổng hợp là:","options":["A. tơ nitron","B. tơ tằm","C. bông","D. len"],"answer":"A","explain":"Tơ nitron, nylon-6,6, tơ capron là tơ tổng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Tơ nylon-6,6 được điều chế bằng phản ứng:","options":["A. trùng ngưng","B. trùng hợp","C. thủy phân","D. ester hóa"],"answer":"A","explain":"Nylon-6,6 trùng ngưng từ hexamethylenediamine và adipic acid.","points":0.25},{"type":"mcq","level":"TH","q":"Tơ nitron được điều chế bằng phản ứng:","options":["A. trùng hợp","B. trùng ngưng","C. thủy phân","D. oxi hóa"],"answer":"A","explain":"Tơ nitron trùng hợp từ acrylonitrile.","points":0.25},{"type":"mcq","level":"VD","q":"Tơ capron được điều chế từ:","options":["A. caprolactam","B. acrylonitrile","C. ethylene","D. styrene"],"answer":"A","explain":"Tơ capron (nylon-6) từ phản ứng mở vòng caprolactam.","points":0.25},{"type":"mcq","level":"VDC","q":"Trùng ngưng $m$ gam adipic acid ($M = 146$) với hexamethylenediamine dư thu được $22,6$ gam nylon-6,6. Giá trị của $m$ là bao nhiêu? ($M_{mắt\\ xích} = 226$, hiệu suất $100\\%$)","options":["A. $14,6$ gam","B. $29,2$ gam","C. $7,3$ gam","D. $22,6$ gam"],"answer":"A","explain":"$n_{mắt\\ xích} = 22,6/226 = 0,1$ mol → $m_{acid} = 0,1 \\times 146 = 14,6$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tơ visco là tơ bán tổng hợp.","b) Tơ nitron là tơ tổng hợp.","c) Nylon-6,6 điều chế bằng trùng ngưng.","d) Tơ nitron điều chế bằng trùng hợp."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tơ capron từ caprolactam.","b) $14,6$ gam adipic acid cho $22,6$ gam nylon-6,6.","c) Tơ tằm là tơ tổng hợp.","d) Nylon-6,6 là tơ polyamide."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: tơ tằm là tơ THIÊN NHIÊN.","points":1},{"type":"short","level":"VD","q":"Trong các tơ: bông, tơ visco, tơ acetate, nylon-6,6 — có bao nhiêu tơ bán tổng hợp?","answer":"2","explain":"Tơ visco và tơ acetate → 2.","points":0.5},{"type":"short","level":"VDC","q":"Một mẫu nylon-6,6 có $M = 45200$. Hệ số polymer hóa $n$ là bao nhiêu? ($M_{mắt\\ xích} = 226$)","answer":"200","explain":"$n = 45200/226 = 200$.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Cao su có tính chất đặc trưng là:","options":["A. đàn hồi","B. dẻo","C. cứng","D. giòn"],"answer":"A","explain":"Cao su (elastomer) có tính đàn hồi cao.","points":0.25},{"type":"mcq","level":"NB","q":"Cao su thiên nhiên là:","options":["A. polyisoprene","B. polybutadiene","C. polyethylene","D. PVC"],"answer":"A","explain":"Cao su thiên nhiên là polyisoprene.","points":0.25},{"type":"mcq","level":"TH","q":"Mục đích của lưu hóa cao su là:","options":["A. tăng độ bền và đàn hồi","B. làm cao su tan trong nước","C. làm cao su dẫn điện","D. giảm khối lượng"],"answer":"A","explain":"Lưu hóa tạo mạng không gian → cao su bền, đàn hồi tốt hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Cầu nối được tạo thành khi lưu hóa cao su là:","options":["A. $-S-S-$","B. $-O-$","C. $-NH-$","D. $-CH_2-$"],"answer":"A","explain":"Cầu nối disulfide $-S-S-$ giữa các mạch cao su.","points":0.25},{"type":"mcq","level":"VD","q":"Cao su buna-S được tổng hợp từ:","options":["A. butadiene và styrene","B. butadiene và acrylonitrile","C. isoprene và styrene","D. ethylene và styrene"],"answer":"A","explain":"Buna-S: đồng trùng hợp butadiene + styrene.","points":0.25},{"type":"mcq","level":"VDC","q":"Đốt cháy hoàn toàn $5,4$ gam cao su buna (mắt xích $\\mathrm{C_4H_6}$, $M = 54$). Thể tích $\\mathrm{CO_2}$ (đktc) thu được là:","options":["A. $8,96$ lít","B. $4,48$ lít","C. $17,92$ lít","D. $2,24$ lít"],"answer":"A","explain":"$n_{mắt\\ xích} = 0,1$ mol → $n_{\\mathrm{CO_2}} = 0,4$ mol → $V = 8,96$ lít.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cao su có tính đàn hồi.","b) Cao su thiên nhiên là polyisoprene.","c) Lưu hóa tăng độ bền của cao su.","d) Cầu nối lưu hóa là $-S-S-$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Buna-S từ butadiene và styrene.","b) $5,4$ gam cao su buna cháy cho $8,96$ lít $\\mathrm{CO_2}$ (đktc).","c) Cao su lưu hóa có cấu trúc mạch thẳng.","d) Cao su dùng làm lốp xe."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cao su lưu hóa có cấu trúc MẠNG KHÔNG GIAN.","points":1},{"type":"short","level":"VD","q":"Một mẫu cao su buna có $M = 108000$. Hệ số polymer hóa $n$ là bao nhiêu? ($M_{mắt\\ xích} = 54$)","answer":"2000","explain":"$n = 108000/54 = 2000$.","points":0.5},{"type":"short","level":"VDC","q":"Trùng hợp $27$ gam butadiene ($M = 54$) với hiệu suất $80\\%$. Khối lượng cao su buna thu được là bao nhiêu gam?","answer":"21,6","explain":"$m = 27 \\times 80\\% = 21,6$ gam.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Keo dán tổng hợp là:","options":["A. keo epoxy","B. hồ tinh bột","C. nhựa thông","D. mủ cao su"],"answer":"A","explain":"Keo epoxy, keo ure-formaldehyde là keo dán tổng hợp.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu composite gồm:","options":["A. nền polymer và cốt sợi","B. chỉ polymer nguyên chất","C. chỉ kim loại","D. chỉ gốm sứ"],"answer":"A","explain":"Composite: nền polymer + cốt (sợi thủy tinh, sợi carbon...).","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của vật liệu composite là:","options":["A. nhẹ, bền, chịu lực tốt","B. nặng, dễ vỡ","C. dẫn điện tốt","D. dễ cháy"],"answer":"A","explain":"Composite nhẹ, bền cơ học cao, dùng làm vỏ tàu, máy bay.","points":0.25},{"type":"mcq","level":"TH","q":"Keo ure-formaldehyde được dùng để:","options":["A. dán gỗ","B. làm lốp xe","C. dệt vải","D. làm túi nilon"],"answer":"A","explain":"Keo ure-formaldehyde dùng dán gỗ, ván ép.","points":0.25},{"type":"mcq","level":"VD","q":"Trong các vật liệu: PE, tơ tằm, cao su buna, keo epoxy, composite sợi thủy tinh — vật liệu composite là:","options":["A. composite sợi thủy tinh","B. PE","C. tơ tằm","D. keo epoxy"],"answer":"A","explain":"Composite sợi thủy tinh là vật liệu tổ hợp.","points":0.25},{"type":"mcq","level":"VDC","q":"Để sản xuất $10,6$ tấn tơ nitron (hiệu suất $80\\%$) cần khối lượng acrylonitrile là:","options":["A. $13,25$ tấn","B. $10,6$ tấn","C. $8,48$ tấn","D. $21,2$ tấn"],"answer":"A","explain":"$m = 10,6/0,8 = 13,25$ tấn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Keo epoxy là keo dán tổng hợp.","b) Composite gồm nền polymer và cốt sợi.","c) Composite nhẹ, bền.","d) Keo ure-formaldehyde dán gỗ."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sản xuất $10,6$ tấn tơ nitron (H = $80\\%$) cần $13,25$ tấn acrylonitrile.","b) Composite dùng làm vỏ tàu.","c) Keo epoxy là keo thiên nhiên.","d) Tơ visco là tơ tổng hợp."],"answer":["T","T","F","F"],"explain":"a), b) Đúng. c) Sai: keo epoxy là keo TỔNG HỢP. d) Sai: tơ visco là tơ BÁN TỔNG HỢP.","points":1},{"type":"short","level":"VD","q":"Trong các vật liệu: PE, PVC, PP, cao su buna, tơ nitron — có bao nhiêu chất dẻo?","answer":"3","explain":"PE, PVC, PP → 3.","points":0.5},{"type":"short","level":"VDC","q":"Trùng hợp $m$ gam styrene ($M = 104$) thu được $20,8$ gam PS (hiệu suất $80\\%$). Giá trị của $m$ là bao nhiêu?","answer":"26","explain":"$m = 20,8/0,8 = 26$ gam.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Tơ polyamide là tơ có chứa liên kết:","options":["A. $-CO-NH-$","B. $-COO-$","C. $-O-$","D. $-S-S-$"],"answer":"A","explain":"Tơ polyamide (nylon-6,6, tơ capron) chứa liên kết amide $-CO-NH-$.","points":0.25},{"type":"mcq","level":"NB","q":"Tơ vinylic là tơ được điều chế bằng:","options":["A. trùng hợp","B. trùng ngưng","C. thủy phân","D. oxi hóa"],"answer":"A","explain":"Tơ vinylic (tơ nitron) điều chế bằng trùng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Tơ nào sau đây thuộc loại tơ polyamide?","options":["A. nylon-6,6","B. tơ nitron","C. tơ visco","D. tơ tằm"],"answer":"A","explain":"Nylon-6,6 và tơ capron là tơ polyamide.","points":0.25},{"type":"mcq","level":"TH","q":"Tơ nào sau đây thuộc loại tơ vinylic?","options":["A. tơ nitron","B. nylon-6,6","C. tơ capron","D. tơ visco"],"answer":"A","explain":"Tơ nitron trùng hợp từ acrylonitrile → tơ vinylic.","points":0.25},{"type":"mcq","level":"VD","q":"Mắt xích của tơ nitron là:","options":["A. $\\mathrm{-CH_2-CH(CN)-}$","B. $\\mathrm{-CH_2-CH_2-}$","C. $\\mathrm{-CH_2-CHCl-}$","D. $\\mathrm{-NH-(CH_2)_6-NH-CO-(CH_2)_4-CO-}$"],"answer":"A","explain":"Mắt xích tơ nitron: $\\mathrm{-CH_2-CH(CN)-}$ ($M = 53$).","points":0.25},{"type":"mcq","level":"VDC","q":"Một mẫu tơ capron có $M = 22600$. Số mắt xích trung bình là: ($M_{mắt\\ xích} = 113$)","options":["A. $200$","B. $100$","C. $2000$","D. $20$"],"answer":"A","explain":"$n = 22600/113 = 200$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tơ polyamide chứa $-CO-NH-$.","b) Tơ vinylic điều chế bằng trùng hợp.","c) Nylon-6,6 là tơ polyamide.","d) Tơ nitron là tơ vinylic."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mắt xích tơ nitron là $\\mathrm{-CH_2-CH(CN)-}$.","b) Tơ capron ($M = 22600$) có $200$ mắt xích.","c) Tơ visco là tơ polyamide.","d) Tơ capron là tơ vinylic."],"answer":["T","T","F","F"],"explain":"a), b) Đúng. c) Sai: tơ visco là tơ BÁN TỔNG HỢP từ cellulose. d) Sai: tơ capron là tơ POLYAMIDE.","points":1},{"type":"short","level":"VD","q":"Trong các tơ: nylon-6,6, tơ capron, tơ nitron, tơ visco — có bao nhiêu tơ polyamide?","answer":"2","explain":"Nylon-6,6 và tơ capron → 2.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $5,3$ gam tơ nitron (mắt xích $\\mathrm{C_3H_3N}$). Thể tích $\\mathrm{N_2}$ (đktc) thu được là bao nhiêu lít?","answer":"1,12","explain":"$n_{mắt\\ xích} = 0,1$ mol → $n_{\\mathrm{N_2}} = 0,05$ mol → $V = 1,12$ lít.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Polymer dùng làm lốp xe là:","options":["A. cao su","B. PE","C. PVC","D. PS"],"answer":"A","explain":"Cao su (đã lưu hóa) dùng làm lốp xe.","points":0.25},{"type":"mcq","level":"NB","q":"Polymer dùng dệt vải là:","options":["A. tơ","B. cao su","C. keo dán","D. composite"],"answer":"A","explain":"Tơ (tơ tằm, nylon, visco...) dùng dệt vải, may mặc.","points":0.25},{"type":"mcq","level":"TH","q":"Sắp xếp nào sau đây đúng về phân loại vật liệu polymer?","options":["A. PE: chất dẻo; tơ tằm: tơ; buna: cao su","B. PE: cao su; tơ tằm: chất dẻo; buna: tơ","C. PE: tơ; tơ tằm: cao su; buna: chất dẻo","D. PE: keo dán; tơ tằm: cao su; buna: tơ"],"answer":"A","explain":"PE là chất dẻo, tơ tằm là tơ, buna là cao su.","points":0.25},{"type":"mcq","level":"TH","q":"Nhóm vật liệu nào sau đây đều là chất dẻo?","options":["A. PE, PVC, PP","B. PE, cao su buna, tơ nitron","C. PVC, tơ tằm, keo epoxy","D. PP, cao su, composite"],"answer":"A","explain":"PE, PVC, PP đều là chất dẻo.","points":0.25},{"type":"mcq","level":"VD","q":"Trùng hợp $8,4$ gam propylene ($M = 42$) với hiệu suất $90\\%$. Khối lượng PP thu được là:","options":["A. $7,56$ gam","B. $8,4$ gam","C. $9,33$ gam","D. $4,2$ gam"],"answer":"A","explain":"$m = 8,4 \\times 90\\% = 7,56$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm tơ nitron và tơ capron. Đốt cháy hoàn toàn $10,6$ gam X thu được $2,24$ lít $\\mathrm{N_2}$ (đktc). Phần trăm khối lượng của tơ nitron trong X là: (mắt xích nitron $53$, capron $113$)","options":["A. $50\\%$","B. $25\\%$","C. $75\\%$","D. $100\\%$"],"answer":"A","explain":"$n_{\\mathrm{N_2}} = 0,1$ mol → tổng $n_{mắt\\ xích} = 0,2$ mol; đặt $a$, $b$: $53a + 113b = 10,6$; $a + b = 0,2$ → $a = b = 0,1$ → $\\% = 50\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cao su dùng làm lốp xe.","b) Tơ dùng dệt vải.","c) PE là chất dẻo, buna là cao su.","d) Tơ tằm là chất dẻo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tơ tằm là TƠ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $8,4$ gam propylene (H = $90\\%$) cho $7,56$ gam PP.","b) Hỗn hợp tơ nitron + tơ capron ($10,6$ gam) cháy cho $2,24$ lít $\\mathrm{N_2}$ thì $\\%_{nitron} = 50\\%$.","c) PE, PVC, PP đều là chất dẻo.","d) Cao su thiên nhiên là polybutadiene."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cao su thiên nhiên là POLYISOPRENE.","points":1},{"type":"short","level":"VD","q":"Đốt cháy hoàn toàn $4,2$ gam PP (mắt xích $\\mathrm{C_3H_6}$). Khối lượng $\\mathrm{CO_2}$ thu được là bao nhiêu gam?","answer":"13,2","explain":"$n_{mắt\\ xích} = 0,1$ mol → $n_{\\mathrm{CO_2}} = 0,3$ mol → $m = 13,2$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Một mẫu tơ visco có $M = 32400$. Số mắt xích cellulose trung bình là bao nhiêu? ($M_{mắt\\ xích} = 162$)","answer":"200","explain":"$n = 32400/162 = 200$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng?","options":["A. cao su buna điều chế từ butadiene","B. cao su buna điều chế từ isoprene","C. cao su buna là cao su thiên nhiên","D. cao su buna không đàn hồi"],"answer":"A","explain":"Cao su buna trùng hợp từ butadiene; là cao su tổng hợp, có tính đàn hồi.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây sai?","options":["A. tơ visco là tơ thiên nhiên","B. tơ visco là tơ bán tổng hợp","C. tơ visco chế biến từ cellulose","D. tơ visco dùng dệt vải"],"answer":"A","explain":"Tơ visco là tơ BÁN TỔNG HỢP (không phải thiên nhiên).","points":0.25},{"type":"mcq","level":"TH","q":"Chất nào sau đây là tơ thiên nhiên?","options":["A. len","B. tơ nitron","C. nylon-6,6","D. tơ visco"],"answer":"A","explain":"Len (lông cừu) là tơ thiên nhiên.","points":0.25},{"type":"mcq","level":"TH","q":"Chất nào sau đây KHÔNG phải tơ?","options":["A. PE","B. tơ tằm","C. nylon-6,6","D. tơ capron"],"answer":"A","explain":"PE là chất dẻo, không phải tơ.","points":0.25},{"type":"mcq","level":"VD","q":"Một mẫu bông (cellulose) có $M = 162000$. Số mắt xích trung bình là: ($M_{mắt\\ xích} = 162$)","options":["A. $1000$","B. $100$","C. $10000$","D. $500$"],"answer":"A","explain":"$n = 162000/162 = 1000$.","points":0.25},{"type":"mcq","level":"VDC","q":"Trùng hợp $m$ gam isoprene ($M = 68$) thu được $13,6$ gam cao su (hiệu suất $80\\%$). Giá trị của $m$ là:","options":["A. $17$ gam","B. $13,6$ gam","C. $10,88$ gam","D. $6,8$ gam"],"answer":"A","explain":"$m = 13,6/0,8 = 17$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cao su buna từ butadiene.","b) Tơ visco là tơ bán tổng hợp.","c) Len là tơ thiên nhiên.","d) PE là tơ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: PE là CHẤT DẺO.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bông ($M = 162000$) có $1000$ mắt xích.","b) Sản xuất $13,6$ gam cao su (H = $80\\%$) cần $17$ gam isoprene.","c) Cao su buna là cao su tổng hợp.","d) Tơ tằm là tơ tổng hợp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tơ tằm là tơ THIÊN NHIÊN.","points":1},{"type":"short","level":"VD","q":"Trong các vật liệu: tơ tằm, bông, len, tơ visco, nylon-6,6 — có bao nhiêu tơ thiên nhiên?","answer":"3","explain":"Tơ tằm, bông, len → 3.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $11,3$ gam tơ capron (mắt xích $\\mathrm{C_6H_{11}NO}$, $M = 113$). Thể tích $\\mathrm{CO_2}$ (đktc) thu được là bao nhiêu lít?","answer":"13,44","explain":"$n_{mắt\\ xích} = 11,3/113 = 0,1$ mol → $n_{\\mathrm{CO_2}} = 0,6$ mol → $V = 13,44$ lít.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Tổng hợp bài 13: vật liệu nào sau đây là keo dán?","options":["A. keo epoxy","B. PE","C. tơ nitron","D. cao su buna"],"answer":"A","explain":"Keo epoxy là keo dán tổng hợp.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu nào sau đây là composite?","options":["A. nhựa cốt sợi thủy tinh","B. PE nguyên chất","C. tơ tằm","D. cao su thiên nhiên"],"answer":"A","explain":"Nhựa cốt sợi thủy tinh là vật liệu composite.","points":0.25},{"type":"mcq","level":"TH","q":"Để phân biệt tơ tằm và tơ visco, có thể dựa vào:","options":["A. nguồn gốc (đốt có mùi khét của protein)","B. màu sắc","C. độ dài sợi","D. khối lượng"],"answer":"A","explain":"Tơ tằm (protein) cháy có mùi khét như tóc cháy; tơ visco (cellulose) cháy không có mùi khét.","points":0.25},{"type":"mcq","level":"TH","q":"Tơ tằm cháy có mùi khét vì:","options":["A. thành phần là protein","B. thành phần là cellulose","C. chứa lưu huỳnh","D. chứa r nào là chất dẻo?","options":["A. PP","B. tơ capron","C. cao su buna","D. keo epoxy"],"answer":"A","explain":"PP (polypropylene) là chất dẻo.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các polymer sau, polymer nào là cao su?","options":["A. buna-N","B. PE","C. nylon-6,6","D. tơ visco"],"answer":"A","explain":"Buna-N là cao su tổng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các polymer sau, polymer nào là tơ tổng hợp?","options":["A. tơ capron","B. tơ tằm","C. bông","D. tơ acetate"],"answer":"A","explain":"Tơ capron là tơ tổng hợp; tơ acetate là tơ bán tổng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các polymer sau, polymer nào có cấu trúc mạng không gian?","options":["A. cao su lưu hóa","B. PE","C. tơ nitron","D. PVC"],"answer":"A","explain":"Cao su lưu hóa có cấu trúc mạng không gian.","points":0.25},{"type":"mcq","level":"VD","q":"Đốt cháy hoàn toàn $m$ gam tơ nitron (mắt xích $\\mathrm{C_3H_3N}$, $M = 53$) thu được $1,12$ lít $\\mathrm{N_2}$ (đktc). Giá trị của $m$ là:","options":["A. $5,3$ gam","B. $10,6$ gam","C. $2,65$ gam","D. $53$ gam"],"answer":"A","explain":"$n_{\\mathrm{N_2}} = 0,05$ mol → $n_{mắt\\ xích} = 0,1$ mol → $m = 5,3$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Một mẫu polymer có $M = 136750$ gồm các mắt xích vinyl chloride ($M = 62,5$) và vinyl acetate ($M = 86$) với tỉ lệ mol $3:1$. Hệ số polymer hóa trung bình là:","options":["A. $2000$","B. $1000$","C. $4000$","D. $1500$"],"answer":"A","explain":"$M_{tb} = (3 \\times 62,5 + 86)/4 = 68,375$ → $n = 136750/68,375 = 2000$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 13):","statements":["a) PP là chất dẻo.","b) Buna-N là cao su.","c) Tơ capron là tơ tổng hợp.","d) Cao su lưu hóa có cấu trúc mạng không gian."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":
