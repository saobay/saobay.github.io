<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Polymer là hợp chất có:","options":["A. khối lượng phân tử lớn, gồm nhiều mắt xích","B. khối lượng phân tử nhỏ","C. một mắt xích duy nhất","D. không chứa carbon"],"answer":"A","explain":"Polymer có khối lượng phân tử lớn do nhiều mắt xích liên kết với nhau.","points":0.25},{"type":"mcq","level":"NB","q":"Monomer là:","options":["A. phân tử nhỏ tạo nên polymer","B. mắt xích của polymer","C. polymer có $M$ lớn","D. chất xúc tác trùng hợp"],"answer":"A","explain":"Monomer là phân tử nhỏ ban đầu phản ứng tạo thành polymer.","points":0.25},{"type":"mcq","level":"TH","q":"Monomer tạo nên polyethylene (PE) là:","options":["A. $\\mathrm{CH_2=CH_2}$","B. $\\mathrm{CH_2=CHCl}$","C. $\\mathrm{CH_3-CH_3}$","D. $\\mathrm{CH \\equiv CH}$"],"answer":"A","explain":"PE trùng hợp từ ethylene $\\mathrm{CH_2=CH_2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Monomer tạo nên PVC là:","options":["A. $\\mathrm{CH_2=CHCl}$","B. $\\mathrm{CH_2=CH_2}$","C. $\\mathrm{C_6H_5CH=CH_2}$","D. $\\mathrm{CH_2=CH-CN}$"],"answer":"A","explain":"PVC trùng hợp từ vinyl chloride $\\mathrm{CH_2=CHCl}$.","points":0.25},{"type":"mcq","level":"VD","q":"Một mẫu PE có $M = 56000$. Hệ số polymer hóa $n$ là: ($M_{mắt\\ xích} = 28$)","options":["A. $2000$","B. $1000$","C. $4000$","D. $200$"],"answer":"A","explain":"$n = 56000/28 = 2000$.","points":0.25},{"type":"mcq","level":"VDC","q":"Trùng hợp $125$ gam vinyl chloride ($M = 62,5$) với hiệu suất $80\\%$. Khối lượng PVC thu được là:","options":["A. $100$ gam","B. $125$ gam","C. $156,25$ gam","D. $80$ gam"],"answer":"A","explain":"Trùng hợp không tách chất nhỏ: $m = 125 \\times 80\\% = 100$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Polymer có khối lượng phân tử lớn.","b) Monomer là phân tử nhỏ tạo nên polymer.","c) PE trùng hợp từ $\\mathrm{CH_2=CH_2}$.","d) PVC trùng hợp từ $\\mathrm{CH_2=CH_2}$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: PVC trùng hợp từ $\\mathrm{CH_2=CHCl}$.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) PE có $M = 56000$ thì $n = 2000$.","b) Trùng hợp $125$ gam vinyl chloride (H = $80\\%$) cho $100$ gam PVC.","c) $M_{polymer} = n \\times M_{mắt\\ xích}$.","d) Monomer và mắt xích là một."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: monomer là phân tử ban đầu, mắt xích là đơn vị lặp lại trong polymer.","points":1},{"type":"short","level":"VD","q":"Một mẫu PVC có $M = 125000$. Hệ số polymer hóa $n$ là bao nhiêu? ($M_{mắt\\ xích} = 62,5$)","answer":"2000","explain":"$n = 125000/62,5 = 2000$.","points":0.5},{"type":"short","level":"VDC","q":"Trùng hợp $m$ gam ethylene ($M = 28$) thu được $56$ gam PE (hiệu suất $100\\%$). Giá trị của $m$ là bao nhiêu?","answer":"56","explain":"Trùng hợp không tách chất nhỏ: $m = 56$ gam.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Polymer thiên nhiên là:","options":["A. tinh bột","B. polyethylene","C. PVC","D. nylon-6,6"],"answer":"A","explain":"Tinh bột, cellulose, protein, cao su thiên nhiên là polymer thiên nhiên.","points":0.25},{"type":"mcq","level":"NB","q":"Polymer tổng hợp là:","options":["A. PE","B. tinh bột","C. cellulose","D. protein"],"answer":"A","explain":"PE, PVC, nylon-6,6 là polymer tổng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Polymer bán tổng hợp là:","options":["A. tơ visco","B. PE","C. tinh bột","D. PVC"],"answer":"A","explain":"Tơ visco, tơ acetate chế biến từ cellulose (thiên nhiên) → bán tổng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Polymer có cấu trúc mạng không gian là:","options":["A. cao su lưu hóa","B. PE","C. PVC","D. amylose"],"answer":"A","explain":"Cao su lưu hóa và nhựa bakelite có cấu trúc mạng không gian.","points":0.25},{"type":"mcq","level":"VD","q":"Polymer nào sau đây có cấu trúc mạch nhánh?","options":["A. amylopectin","B. PE","C. PVC","D. cellulose"],"answer":"A","explain":"Amylopectin (trong tinh bột) và glycogen có mạch nhánh.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhựa nhiệt rắn là:","options":["A. bakelite","B. PE","C. PVC","D. PS"],"answer":"A","explain":"Bakelite đã rắn thì nung không mềm lại → nhựa nhiệt rắn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tinh bột là polymer thiên nhiên.","b) PE là polymer tổng hợp.","c) Tơ visco là polymer bán tổng hợp.","d) PVC là polymer thiên nhiên."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: PVC là polymer TỔNG HỢP.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cao su lưu hóa có cấu trúc mạng không gian.","b) Amylopectin có mạch nhánh.","c) Bakelite là nhựa nhiệt rắn.","d) PE là nhựa nhiệt rắn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: PE là nhựa NHIỆT DẺO.","points":1},{"type":"short","level":"VD","q":"Trong các polymer: PE, PVC, bakelite, cao su lưu hóa — có bao nhiêu polymer có cấu trúc mạng không gian?","answer":"2","explain":"Bakelite và cao su lưu hóa → 2.","points":0.5},{"type":"short","level":"VDC","q":"Trong các polymer: tinh bột, PE, tơ visco, PVC, cellulose — có bao nhiêu polymer thiên nhiên?","answer":"2","explain":"Tinh bột và cellulose → 2.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Phản ứng trùng hợp là:","options":["A. cộng hợp liên tiếp các monomer, không tách chất nhỏ","B. cộng hợp các monomer, có tách nước","C. phân hủy polymer thành monomer","D. đốt cháy polymer"],"answer":"A","explain":"Trùng hợp: cộng hợp liên tiếp monomer, KHÔNG tách chất nhỏ.","points":0.25},{"type":"mcq","level":"NB","q":"Phản ứng trùng ngưng là:","options":["A. cộng hợp monomer, có tách chất nhỏ (thường là nước)","B. cộng hợp monomer, không tách chất nhỏ","C. cắt mạch polymer","D. oxi hóa monomer"],"answer":"A","explain":"Trùng ngưng: cộng hợp monomer đồng thời TÁCH chất nhỏ.","points":0.25},{"type":"mcq","level":"TH","q":"Điều kiện để monomer tham gia phản ứng trùng hợp là:","options":["A. có liên kết đôi","B. có 2 nhóm chức","C. là hợp chất no","D. có vòng benzene"],"answer":"A","explain":"Monomer trùng hợp phải có liên kết đôi (hoặc ba, vòng kém bền).","points":0.25},{"type":"mcq","level":"TH","q":"Điều kiện để monomer tham gia phản ứng trùng ngưng là:","options":["A. có từ 2 nhóm chức trở lên","B. có liên kết đôi","C. là hydrocarbon no","D. có 1 nhóm chức"],"answer":"A","explain":"Monomer trùng ngưng phải có từ 2 nhóm chức trở lên.","points":0.25},{"type":"mcq","level":"VD","q":"Phản ứng nào sau đây là trùng ngưng?","options":["A. tạo nylon-6,6 từ điamine và điacid","B. tạo PE từ ethylene","C. tạo PVC từ vinyl chloride","D. tạo cao su buna từ butadiene"],"answer":"A","explain":"Nylon-6,6 tạo từ trùng ngưng (tách nước); các phản ứng còn lại là trùng hợp.","points":0.25},{"type":"mcq","level":"VDC","q":"Trùng ngưng $m$ gam hexamethylenediamine ($\\mathrm{H_2N(CH_2)_6NH_2}$, $M = 116$) với adipic acid dư. Khối lượng nước tách ra là $3,6$ gam. Giá trị của $m$ là bao nhiêu? (biết mỗi cặp monomer tách $2$ nước)","options":["A. $11,6$ gam","B. $23,2$ gam","C. $5,8$ gam","D. $17,4$ gam"],"answer":"A","explain":"$n_{\\mathrm{H_2O}} = 0,2$ mol → $n_{điamine} = 0,1$ mol → $m = 11,6$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trùng hợp không tách chất nhỏ.","b) Trùng ngưng tách nước.","c) Monomer trùng hợp cần liên kết đôi.","d) Monomer trùng ngưng cần 2 nhóm chức."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tạo nylon-6,6 là trùng ngưng.","b) Tạo PE là trùng hợp.","c) $11,6$ gam điamine trùng ngưng tách $3,6$ gam nước.","d) Trùng hợp tách nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: trùng hợp KHÔNG tách chất nhỏ.","points":1},{"type":"short","level":"VD","q":"Trong các phản ứng tạo polymer: PE, PVC, nylon-6,6, tơ nitron — có bao nhiêu phản ứng trùng ngưng?","answer":"1","explain":"Chỉ nylon-6,6 là trùng ngưng → 1.","points":0.5},{"type":"short","level":"VDC","q":"Trùng hợp $10,8$ gam butadiene ($\\mathrm{C_4H_6}$, $M = 54$) với hiệu suất $90\\%$. Khối lượng cao su buna thu được là bao nhiêu gam?","answer":"9,72","explain":"$m = 10,8 \\times 90\\% = 9,72$ gam.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Mắt xích của PE là:","options":["A. $\\mathrm{-CH_2-CH_2-}$","B. $\\mathrm{-CH_2-CHCl-}$","C. $\\mathrm{-CH_2-CH(C_6H_5)-}$","D. $\\mathrm{-CH_2-CH(CN)-}$"],"answer":"A","explain":"Mắt xích PE: $\\mathrm{-CH_2-CH_2-}$ ($M = 28$).","points":0.25},{"type":"mcq","level":"NB","q":"Mắt xích của PVC là:","options":["A. $\\mathrm{-CH_2-CHCl-}$","B. $\\mathrm{-CH_2-CH_2-}$","C. $\\mathrm{-CH_2-CH(CN)-}$","D. $\\mathrm{-CF_2-CF_2-}$"],"answer":"A","explain":"Mắt xích PVC: $\\mathrm{-CH_2-CHCl-}$ ($M = 62,5$).","points":0.25},{"type":"mcq","level":"TH","q":"Hệ số polymer hóa $n$ được tính bằng công thức:","options":["A. $n = M_{polymer}/M_{mắt\\ xích}$","B. $n = M_{mắt\\ xích}/M_{polymer}$","C. $n = M_{polymer} \\times M_{mắt\\ xích}$","D. $n = M_{polymer} + M_{mắt\\ xích}$"],"answer":"A","explain":"$n = M_{polymer}/M_{mắt\\ xích}$.","points":0.25},{"type":"mcq","level":"TH","q":"Polymer nào sau đây được điều chế bằng phản ứng trùng ngưng?","options":["A. nylon-6,6","B. PE","C. PVC","D. PS"],"answer":"A","explain":"Nylon-6,6 điều chế bằng trùng ngưng điamine + điacid.","points":0.25},{"type":"mcq","level":"VD","q":"Một mẫu nylon-6,6 có $M = 22600$. Hệ số polymer hóa $n$ là: (mắt xích nylon-6,6 $M = 226$)","options":["A. $100$","B. $200$","C. $50$","D. $1000$"],"answer":"A","explain":"$n = 22600/226 = 100$.","points":0.25},{"type":"mcq","level":"VDC","q":"Để sản xuất $113$ gam nylon-6,6 (hiệu suất $100\\%$) cần khối lượng hexamethylenediamine ($M = 116$) và adipic acid ($M = 146$) lần lượt là: (mắt xích $M = 226$)","options":["A. $58$ gam và $73$ gam","B. $116$ gam và $146$ gam","C. $29$ gam và $36,5$ gam","D. $58$ gam và $146$ gam"],"answer":"A","explain":"$n_{mắt\\ xích} = 113/226 = 0,5$ mol → $m_{điamine} = 58$ gam; $m_{acid} = 73$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mắt xích PE là $\\mathrm{-CH_2-CH_2-}$.","b) Mắt xích PVC là $\\mathrm{-CH_2-CHCl-}$.","c) $n = M_{polymer}/M_{mắt\\ xích}$.","d) Nylon-6,6 điều chế bằng trùng hợp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nylon-6,6 điều chế bằng TRÙNG NGƯNG.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nylon-6,6 ($M = 22600$) có $n = 100$.","b) Sản xuất $113$ gam nylon-6,6 cần $58$ gam điamine và $73$ gam acid.","c) Mắt xích nylon-6,6 có $M = 226$.","d) Trùng ngưng không tách nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: trùng ngưng TÁCH nước.","points":1},{"type":"short","level":"VD","q":"Một mẫu PS (polystyrene) có $M = 52000$. Hệ số polymer hóa $n$ là bao nhiêu? ($M_{mắt\\ xích} = 104$)","answer":"500","explain":"$n = 52000/104 = 500$.","points":0.5},{"type":"short","level":"VDC","q":"Trùng ngưng $23,2$ gam hexamethylenediamine ($M = 116$) với adipic acid dư (hiệu suất $100\\%$). Khối lượng nylon-6,6 thu được là bao nhiêu gam? ($M_{mắt\\ xích} = 226$)","answer":"45,2","explain":"$n_{điamine} = 0,2$ mol → $m = 0,2 \\times 226 = 45,2$ gam.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Tính chất vật lí chung của polymer là:","options":["A. không bay hơi, cách điện","B. dễ bay hơi, dẫn điện","C. tan tốt trong nước","D. có nhiệt độ sôi xác định"],"answer":"A","explain":"Polymer không bay hơi, không có nhiệt độ nóng chảy xác định, cách điện, ít tan.","points":0.25},{"type":"mcq","level":"NB","q":"Polymer nào sau đây cách điện?","options":["A. PE","B. đồng","C. nhôm","D. than chì"],"answer":"A","explain":"PE (và hầu hết polymer) cách điện.","points":0.25},{"type":"mcq","level":"TH","q":"Polymer nhiệt dẻo là polymer:","options":["A. mềm khi nung, cứng khi nguội","B. đã rắn thì nung không mềm lại","C. đàn hồi cao","D. tan trong nước"],"answer":"A","explain":"Nhựa nhiệt dẻo (PE, PVC): mềm khi nung nóng, cứng khi để nguội.","points":0.25},{"type":"mcq","level":"TH","q":"Polymer nhiệt rắn là polymer:","options":["A. đã rắn thì nung không mềm lại","B. mềm khi nung, cứng khi nguội","C. đàn hồi","D. dễ kéo sợi"],"answer":"A","explain":"Nhựa nhiệt rắn (bakelite): đã đóng rắn thì không mềm lại khi nung.","points":0.25},{"type":"mcq","level":"VD","q":"Trong các polymer: PE, PVC, bakelite, PS — có bao nhiêu polymer nhiệt dẻo?","options":["A. 3","B. 1","C. 2","D. 4"],"answer":"A","explain":"PE, PVC, PS là nhiệt dẻo; bakelite là nhiệt rắn → 3.","points":0.25},{"type":"mcq","level":"VDC","q":"Đốt cháy hoàn toàn $m$ gam PE thu được $8,8$ gam $\\mathrm{CO_2}$. Giá trị của $m$ là:","options":["A. $2,8$ gam","B. $5,6$ gam","C. $1,4$ gam","D. $8,8$ gam"],"answer":"A","explain":"$n_{\\mathrm{CO_2}} = 0,2$ mol; mắt xích $\\mathrm{CH_2}$ → $n_{PE\\ (mắt\\ xích)} = 0,1$ mol → $m = 2,8$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Polymer không bay hơi, cách điện.","b) PE cách điện.","c) Nhựa nhiệt dẻo mềm khi nung.","d) Nhựa nhiệt rắn mềm khi nung."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhựa nhiệt rắn KHÔNG mềm lại khi nung.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) PE, PVC, PS là nhựa nhiệt dẻo.","b) Đốt $2,8$ gam PE cho $8,8$ gam $\\mathrm{CO_2}$.","c) Polymer tan tốt trong nước.","d) Polymer có nhiệt độ nóng chảy xác định."],"answer":["T","T","F","F"],"explain":"a), b) Đúng. c), d) Sai: polymer ít tan, không có nhiệt độ nóng chảy xác định.","points":1},{"type":"short","level":"VD","q":"Đốt cháy hoàn toàn $5,6$ gam PE. Khối lượng $\\mathrm{CO_2}$ thu được là bao nhiêu gam?","answer":"17,6","explain":"$n_{mắt\\ xích} = 0,2$ mol → $n_{\\mathrm{CO_2}} = 0,4$ mol → $m = 17,6$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Một mẫu cao su buna có $M = 54000$. Hệ số polymer hóa $n$ là bao nhiêu? ($M_{mắt\\ xích} = 54$)","answer":"1000","explain":"$n = 54000/54 = 1000$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Tơ nào sau đây là tơ thiên nhiên?","options":["A. tơ tằm","B. tơ visco","C. nylon-6,6","D. tơ nitron"],"answer":"A","explain":"Tơ tằm, bông, len là tơ thiên nhiên.","points":0.25},{"type":"mcq","level":"NB","q":"Tơ nào sau đây là tơ tổng hợp?","options":["A. nylon-6,6","B. tơ tằm","C. bông","D. tơ visco"],"answer":"A","explain":"Nylon-6,6, tơ nitron, tơ capron là tơ tổng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Tơ visco được chế biến từ:","options":["A. cellulose","B. protein","C. ethylene","D. caprolactam"],"answer":"A","explain":"Tơ visco, tơ acetate chế biến từ cellulose → tơ bán tổng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Monomer để sản xuất tơ nitron là:","options":["A. $\\mathrm{CH_2=CH-CN}$","B. $\\mathrm{CH_2=CH_2}$","C. $\\mathrm{CH_2=CHCl}$","D. $\\mathrm{C_6H_5CH=CH_2}$"],"answer":"A","explain":"Tơ nitron (olon) trùng hợp từ acrylonitrile $\\mathrm{CH_2=CH-CN}$.","points":0.25},{"type":"mcq","level":"VD","q":"Monomer để sản xuất tơ capron là:","options":["A. caprolactam","B. ethylene","C. vinyl chloride","D. styrene"],"answer":"A","explain":"Tơ capron (nylon-6) trùng hợp từ caprolactam (mở vòng).","points":0.25},{"type":"mcq","level":"VDC","q":"Trùng hợp $5,3$ gam acrylonitrile ($\\mathrm{C_3H_3N}$, $M = 53$) với hiệu suất $90\\%$. Khối lượng tơ nitron thu được là:","options":["A. $4,77$ gam","B. $5,3$ gam","C. $5,89$ gam","D. $2,65$ gam"],"answer":"A","explain":"$m = 5,3 \\times 90\\% = 4,77$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tơ tằm là tơ thiên nhiên.","b) Nylon-6,6 là tơ tổng hợp.","c) Tơ visco chế biến từ cellulose.","d) Tơ nitron trùng hợp từ $\\mathrm{CH_2=CH-CN}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tơ capron từ caprolactam.","b) $5,3$ gam acrylonitrile (H = $90\\%$) cho $4,77$ gam tơ nitron.","c) Bông là tơ tổng hợp.","d) Tơ acetate là tơ thiên nhiên."],"answer":["T","T","F","F"],"explain":"a), b) Đúng. c) Sai: bông là tơ THIÊN NHIÊN. d) Sai: tơ acetate là tơ BÁN TỔNG HỢP.","points":1},{"type":"short","level":"VD","q":"Trong các tơ: tơ tằm, tơ visco, nylon-6,6, tơ nitron, bông — có bao nhiêu tơ tổng hợp?","answer":"2","explain":"Nylon-6,6 và tơ nitron → 2.","points":0.5},{"type":"short","level":"VDC","q":"Một mẫu tơ nitron có $M = 53000$. Hệ số polymer hóa $n$ là bao nhiêu? ($M_{mắt\\ xích} = 53$)","answer":"1000","explain":"$n = 53000/53 = 1000$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Cao su thiên nhiên có thành phần chính là:","options":["A. polyisoprene","B. polybutadiene","C. polystyrene","D. polyethylene"],"answer":"A","explain":"Cao su thiên nhiên là polyisoprene $\\mathrm{(-CH_2-C(CH_3)=CH-CH_2-)_n}$.","points":0.25},{"type":"mcq","level":"NB","q":"Cao su buna được điều chế từ:","options":["A. butadiene","B. isoprene","C. ethylene","D. styrene"],"answer":"A","explain":"Cao su buna trùng hợp từ butadiene $\\mathrm{CH_2=CH-CH=CH_2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cao su buna-S là sản phẩm đồng trùng hợp của:","options":["A. butadiene và styrene","B. butadiene và acrylonitrile","C. isoprene và styrene","D. ethylene và propylene"],"answer":"A","explain":"Buna-S: butadiene + styrene; buna-N: butadiene + acrylonitrile.","points":0.25},{"type":"mcq","level":"TH","q":"Quá trình lưu hóa cao su tạo ra:","options":["A. cầu nối disulfide ($-S-S-$) giữa các mạch","B. mạch polymer mới","C. monomer isoprene","D. lưu huỳnh đơn chất"],"answer":"A","explain":"Lưu hóa: sulfur tạo cầu nối $-S-S-$ giữa các mạch cao su → mạng không gian, tăng đàn hồi.","points":0.25},{"type":"mcq","level":"VD","q":"Monomer isoprene có công thức là:","options":["A. $\\mathrm{CH_2=C(CH_3)-CH=CH_2}$","B. $\\mathrm{CH_2=CH-CH=CH_2}$","C. $\\mathrm{CH_2=CH_2}$","D. $\\mathrm{CH_2=CHCl}$"],"answer":"A","explain":"Isoprene: $\\mathrm{CH_2=C(CH_3)-CH=CH_2}$ ($M = 68$).","points":0.25},{"type":"mcq","level":"VDC","q":"Trùng hợp $6,8$ gam isoprene ($M = 68$) với hiệu suất $85\\%$. Khối lượng cao su thiên nhiên (tổng hợp) thu được là:","options":["A. $5,78$ gam","B. $6,8$ gam","C. $8$ gam","D. $3,4$ gam"],"answer":"A","explain":"$m = 6,8 \\times 85\\% = 5,78$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cao su thiên nhiên là polyisoprene.","b) Cao su buna từ butadiene.","c) Buna-S từ butadiene và styrene.","d) Lưu hóa tạo cầu nối $-S-S-$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Isoprene là $\\mathrm{CH_2=C(CH_3)-CH=CH_2}$.","b) $6,8$ gam isoprene (H = $85\\%$) cho $5,78$ gam cao su.","c) Cao su buna-N từ butadiene và styrene.","d) Cao su lưu hóa có cấu trúc mạng không gian."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: buna-N từ butadiene và ACRYLONITRILE.","points":1},{"type":"short","level":"VD","q":"Một mẫu cao su thiên nhiên có $M = 68000$. Hệ số polymer hóa $n$ là bao nhiêu? ($M_{mắt\\ xích} = 68$)","answer":"1000","explain":"$n = 68000/68 = 1000$.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $6,8$ gam cao su thiên nhiên (mắt xích $\\mathrm{C_5H_8}$). Thể tích $\\mathrm{CO_2}$ (đktc) thu được là bao nhiêu lít?","answer":"11,2","explain":"$n_{mắt\\ xích} = 0,1$ mol → $n_{\\mathrm{CO_2}} = 0,5$ mol → $V = 11,2$ lít.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Chất dẻo là vật liệu polymer có tính:","options":["A. dẻo","B. đàn hồi cao","C. dẫn điện","D. tan trong nước"],"answer":"A","explain":"Chất dẻo (PE, PVC, PS): tính dẻo, cách điện.","points":0.25},{"type":"mcq","level":"NB","q":"Keo dán epoxy thuộc loại vật liệu:","options":["A. keo dán tổng hợp","B. chất dẻo","C. tơ","D. cao su"],"answer":"A","explain":"Keo epoxy, keo ure-formaldehyde là keo dán tổng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Vật liệu composite là:","options":["A. vật liệu tổ hợp từ polymer và chất độn","B. polymer nguyên chất","C. kim loại và polymer","D. gốm sứ"],"answer":"A","explain":"Composite: polymer làm nền + sợi/cốt liệu tăng cường.","points":0.25},{"type":"mcq","level":"TH","q":"Ứng dụng của PE là:","options":["A. làm màng bọc, túi nilon","B. làm lốp xe","C. làm áo ấm","D. làm keo dán"],"answer":"A","explain":"PE dùng làm màng bọc thực phẩm, túi nilon, chai lọ.","points":0.25},{"type":"mcq","level":"VD","q":"Ứng dụng của PVC là:","options":["A. làm ống nước, vỏ dây điện","B. làm lốp xe","C. làm tơ may mặc","D. làm cao su"],"answer":"A","explain":"PVC dùng làm ống nước, vỏ bọc dây điện, da nhân tạo.","points":0.25},{"type":"mcq","level":"VDC","q":"Để sản xuất $1$ tấn PE (hiệu suất $95\\%$) cần khối lượng ethylene là:","options":["A. $1,0526$ tấn","B. $1$ tấn","C. $0,95$ tấn","D. $1,9$ tấn"],"answer":"A","explain":"$m = 1/0,95 = 1,0526$ tấn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chất dẻo có tính dẻo.","b) Keo epoxy là keo dán tổng hợp.","c) Composite là vật liệu tổ hợp.","d) PE dùng làm màng bọc thực phẩm."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) PVC dùng làm ống nước.","b) Sản xuất $1$ tấn PE (H = $95\\%$) cần $1,0526$ tấn ethylene.","c) Cao su dùng làm lốp xe.","d) PE dẫn điện tốt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: PE CÁCH điện.","points":1},{"type":"short","level":"VD","q":"Trong các vật liệu: PE, PVC, cao su buna, tơ nitron, keo epoxy — có bao nhiêu chất dẻo?","answer":"2","explain":"PE và PVC là chất dẻo → 2.","points":0.5},{"type":"short","level":"VDC","q":"Trùng hợp $m$ tấn propylene ($M = 42$) thu được $8,4$ tấn PP (hiệu suất $80\\%$). Giá trị của $m$ là bao nhiêu?","answer":"10,5","explain":"$m = 8,4/0,8 = 10,5$ tấn.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng?","options":["A. tơ visco là tơ bán tổng hợp","B. tơ visco là tơ thiên nhiên","C. tơ visco là tơ tổng hợp","D. tơ visco là cao su"],"answer":"A","explain":"Tơ visco chế biến từ cellulose → tơ bán tổng hợp.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây sai?","options":["A. PE là polymer thiên nhiên","B. PVC là polymer tổng hợp","C. tinh bột là polymer thiên nhiên","D. nylon-6,6 là polymer tổng hợp"],"answer":"A","explain":"PE là polymer TỔNG HỢP.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy nào gồm các polymer tổng hợp?","options":["A. PE, PVC, nylon-6,6","B. tinh bột, cellulose, PE","C. protein, PE, PVC","D. tơ visco, PE, PVC"],"answer":"A","explain":"PE, PVC, nylon-6,6 đều là polymer tổng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy nào gồm các polymer thiên nhiên?","options":["A. tinh bột, cellulose, protein","B. PE, PVC, PS","C. nylon-6,6, tơ nitron, buna","D. tơ visco, tơ acetate, PE"],"answer":"A","explain":"Tinh bột, cellulose, protein là polymer thiên nhiên.","points":0.25},{"type":"mcq","level":"VD","q":"Khối lượng phân tử trung bình của một mẫu tơ capron là $11300$. Số mắt xích trung bình là: ($M_{mắt\\ xích} = 113$)","options":["A. $100$","B. $1000$","C. $50$","D. $200$"],"answer":"A","explain":"$n = 11300/113 = 100$.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm PE và PVC. Đốt cháy hoàn toàn $12,45$ gam X thu được $8,96$ lít $\\mathrm{CO_2}$ (đktc). Phần trăm khối lượng của PE trong X là: (mắt xích PE $28$, PVC $62,5$)","options":["A. $22,5\\%$","B. $77,5\\%$","C. $50\\%$","D. $11,25\\%$"],"answer":"A","explain":"Đặt $a$, $b$ mol mắt xích: $28a + 62,5b = 12,45$; $n_{\\mathrm{CO_2}} = 2a + 2b = 0,4$ → $a = b = 0,1$ → $m_{PE} = 2,8$ gam → $\\% = 22,5\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 12–13):","statements":["a) Tơ visco là tơ bán tổng hợp.","b) PE là polymer tổng hợp.","c) PE, PVC, nylon-6,6 là polymer tổng hợp.","d) Tinh bột, cellulose, protein là polymer thiên nhiên."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tơ capron ($M = 11300$) có $100$ mắt xích.","b) Đốt cháy $12,45$ gam hỗn hợp PE + PVC ($1:1$ mol mắt xích) cho $8,96$ lít $\\mathrm{CO_2}$ (đktc).","c) $\\%PE = 22,5\\%$ trong hỗn hợp trên.","d) PVC là polymer thiên nhiên."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: PVC là polymer TỔNG HỢP.","points":1},{"type":"short","level":"VD","q":"Một mẫu cao su buna-S có $M = 59000$. Hệ số polymer hóa trung bình là bao nhiêu? (mắt xích trung bình $M = 59$)","answer":"1000","explain":"$n = 59000/59 = 1000$.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $2,8$ gam PE. Thể tích $\\mathrm{CO_2}$ (đktc) thu được là bao nhiêu lít?","answer":"4,48","explain":"$n_{mắt\\ xích} = 0,1$ mol → $n_{\\mathrm{CO_2}} = 0,2$ mol → $V = 4,48$ lít.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tổng hợp chương 4: polymer nào sau đây là cao su?","options":["A. cao su buna","B. PE","C. PVC","D. nylon-6,6"],"answer":"A","explain":"Cao su buna (và cao su thiên nhiên) thuộc loại elastomer.","points":0.25},{"type":"mcq","level":"NB","q":"Polymer nào sau đây là chất dẻo?","options":["A. PVC","B. cao su buna","C. tơ tằm","D. keo epoxy"],"answer":"A","explain":"PVC là chất dẻo.","points":0.25},{"type":"mcq","level":"TH","q":"Polymer nào sau đây là tơ?","options":["A. nylon-6,6","B. PE","C. cao su buna","D. bakelite"],"answer":"A","explain":"Nylon-6,6 là tơ tổng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Phản ứng điều chế tơ nitron thuộc loại:","options":["A. trùng hợp","B. trùng ngưng","C. thủy phân","D. oxi hóa"],"answer":"A","explain":"Tơ nitron trùng hợp từ acrylonitrile.","points":0.25},{"type":"mcq","level":"VD","q":"Trùng hợp $21,2$ gam acrylonitrile ($M = 53$) với hiệu suất $75\\%$. Khối lượng tơ nitron thu được là:","options":["A. $15,9$ gam","B. $21,2$ gam","C. $28,27$ gam","D. $10,6$ gam"],"answer":"A","explain":"$m = 21,2 \\times 75\\% = 15,9$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Một mẫu polymer có $M = 100000$, gồm $2$ loại mắt xích có $M$ trung bình $50$. Hệ số polymer hóa là:","options":["A. $2000$","B. $1000$","C. $4000$","D. $500$"],"answer":"A","explain":"$n = 100000/50 = 2000$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 4):","statements":["a) Cao su buna là cao su.","b) PVC là chất dẻo.","c) Nylon-6,6 là tơ.","d) Tơ nitron điều chế bằng trùng hợp."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $21,2$ gam acrylonitrile (H = $75\\%$) cho $15,9$ gam tơ nitron.","b) Polymer ($M = 100000$, mắt xích $50$) có $n = 2000$.","c) Bakelite là nhựa nhiệt dẻo.","d) Cao su lưu hóa có cấu trúc mạng không gian."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: bakelite là nhựa NHIỆT RẮN.","points":1},{"type":"short","level":"VD","q":"Trùng ngưng $11,6$ gam hexamethylenediamine ($M = 116$) với adipic acid dư. Khối lượng nước tách ra là bao nhiêu gam? (mỗi mol điamine tách $2$ mol nước)","answer":"3,6","explain":"$n_{điamine} = 0,1$ mol → $n_{\\mathrm{H_2O}} = 0,2$ mol → $m = 3,6$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $m$ gam PVC (mắt xích $\\mathrm{C_2H_3Cl}$) thu được $4,48$ lít $\\mathrm{CO_2}$ (đktc). Giá trị của $m$ là bao nhiêu?","answer":"6,25","explain":"$n_{\\mathrm{CO_2}} = 0,2$ mol → $n_{mắt\\ xích} = 0,1$ mol → $m = 6,25$ gam.","points":0.5}]}]}</script>
