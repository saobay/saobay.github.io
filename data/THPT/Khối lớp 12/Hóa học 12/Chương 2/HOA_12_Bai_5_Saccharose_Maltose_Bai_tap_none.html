 là bao nhiêu gam?","answer":"14,4","explain":"$n_{saccharose} = 0,1$ mol → lí thuyết $0,1$ mol fructose $= 18$ gam; hiệu suất $80\\%$ → $14,4$ gam.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Đường mía chính là:","options":["A. glucose","B. fructose","C. saccharose","D. maltose"],"answer":"C","explain":"Đường mía, đường ăn hàng ngày chính là saccharose.","points":0.25},{"type":"mcq","level":"NB","q":"Đường mạch nha chính là:","options":["A. glucose","B. saccharose","C. maltose","D. fructose"],"answer":"C","explain":"Đường mạch nha chính là maltose, có trong mầm lúa.","points":0.25},{"type":"mcq","level":"TH","q":"Cho các dung dịch: saccharose, maltose, glucose. Thuốc thử phân biệt saccharose với hai chất còn lại là:","options":["A. $\\mathrm{Cu(OH)_2}$ ở nhiệt độ thường","B. dung dịch $\\mathrm{AgNO_3/NH_3}$, đun nóng","C. quỳ tím","D. dung dịch bromine"],"answer":"B","explain":"Glucose và maltose đều tráng bạc; chỉ saccharose không tráng bạc.","points":0.25},{"type":"mcq","level":"TH","q":"Sản phẩm thủy phân của saccharose và maltose đều có thể:","options":["A. tráng bạc","B. làm mất màu nước bromine","C. tác dụng với Na","D. kết tủa với $\\mathrm{AgNO_3}$"],"answer":"A","explain":"Sản phẩm thủy phân chứa glucose/fructose đều tráng bạc được.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $51,3$ gam saccharose ($M = 342$). Khối lượng glucose thu được là:","options":["A. $18$ gam","B. $27$ gam","C. $36$ gam","D. $13,5$ gam"],"answer":"B","explain":"$n_{saccharose} = 0,15$ mol → $m_{glucose} = 0,15 \\times 180 = 27$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm glucose và maltose. Cho $m$ gam X tráng bạc thu được $32,4$ gam Ag; cũng $m$ gam X thủy phân hoàn toàn rồi tráng bạc thu được $54$ gam Ag. Giá trị của $m$ là:","options":["A. $34,2$ gam","B. $43,2$ gam","C. $52,2$ gam","D. $61,2$ gam"],"answer":"B","explain":"Đặt $n_{glucose} = a$, $n_{maltose} = b$: $2a + 2b = 0,3$ → $a + b = 0,15$; sau thủy phân glucose tổng $= a + 2b$ → $2(a + 2b) = 0,5$ → $a + 2b = 0,25$ → $b = 0,1$, $a = 0,05$ → $m = 0,05 \\times 180 + 0,1 \\times 342 = 43,2$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đường mía là saccharose.","b) Đường mạch nha là maltose.","c) $\\mathrm{AgNO_3/NH_3}$ phân biệt được saccharose với glucose.","d) Sản phẩm thủy phân saccharose tráng bạc được."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $51,3$ gam saccharose thủy phân cho $27$ gam glucose.","b) Hỗn hợp glucose + maltose tráng bạc hai lần cho lượng Ag khác nhau.","c) Maltose thủy phân cho 2 glucose.","d) Saccharose thủy phân cho 2 fructose."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: saccharose thủy phân cho 1 glucose + 1 fructose.","points":1},{"type":"short","level":"VD","q":"Thủy phân $25,65$ gam saccharose ($M = 342$). Khối lượng glucose thu được là bao nhiêu gam?","answer":"13,5","explain":"$n_{saccharose} = 0,075$ mol → $m_{glucose} = 0,075 \\times 180 = 13,5$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $68,4$ gam hỗn hợp saccharose và maltose (tỉ lệ mol $1:1$) tráng bạc hoàn toàn. Khối lượng Ag thu được là bao nhiêu gam?","answer":"21,6","explain":"$n$ mỗi chất $= 68,4/684 = 0,1$ mol; chỉ maltose tráng bạc → $n_{Ag} = 0,2$ mol → $m = 21,6$ gam.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Liên kết giữa 2 gốc monosaccharide trong disaccharide gọi là:","options":["A. liên kết hydrogen","B. liên kết glycoside","C. liên kết peptide","D. liên kết ion"],"answer":"B","explain":"Hai gốc monosaccharide liên kết qua nguyên tử oxygen — liên kết glycoside.","points":0.25},{"type":"mcq","level":"NB","q":"Saccharose có vị:","options":["A. đắng","B. ngọt","C. chua","D. mặn"],"answer":"B","explain":"Saccharose (đường ăn) có vị ngọt.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol saccharose thủy phân hoàn toàn. Số mol glucose thu được là:","options":["A. $0,1$ mol","B. $0,2$ mol","C. $0,05$ mol","D. $0,4$ mol"],"answer":"A","explain":"$1$ mol saccharose → $1$ mol glucose + $1$ mol fructose.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol maltose thủy phân hoàn toàn. Số mol glucose thu được là:","options":["A. $0,1$ mol","B. $0,2$ mol","C. $0,05$ mol","D. $0,4$ mol"],"answer":"B","explain":"$1$ mol maltose → $2$ mol glucose.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $34,2$ gam maltose ($M = 342$) với hiệu suất $90\\%$. Khối lượng glucose thu được là:","options":["A. $36$ gam","B. $32,4$ gam","C. $18$ gam","D. $16,2$ gam"],"answer":"B","explain":"Lí thuyết $0,2$ mol glucose $= 36$ gam; hiệu suất $90\\%$ → $32,4$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $m$ gam saccharose thủy phân với hiệu suất $80\\%$, rồi tráng bạc toàn bộ sản phẩm thu được $34,56$ gam Ag. Giá trị của $m$ là:","options":["A. $34,2$ gam","B. $42,75$ gam","C. $27,36$ gam","D. $68,4$ gam"],"answer":"A","explain":"$n_{Ag} = 34,56/108 = 0,32$ mol → $n_{saccharose}$ đã thủy phân $= 0,32/4 = 0,08$ mol → ban đầu $= 0,08/0,8 = 0,1$ mol → $m = 34,2$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Liên kết glycoside nối 2 gốc monosaccharide.","b) $0,1$ mol saccharose thủy phân cho $0,1$ mol glucose.","c) $0,1$ mol maltose thủy phân cho $0,2$ mol glucose.","d) Saccharose ngọt hơn fructose."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: fructose NGỌT HƠN saccharose.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $34,2$ gam maltose thủy phân (H = $90\\%$) cho $32,4$ gam glucose.","b) Tráng bạc sản phẩm thủy phân $0,1$ mol saccharose cho $0,4$ mol Ag.","c) Maltose có trong bia.","d) Saccharose có phản ứng với $\\mathrm{Cu(OH)_2}$ đun nóng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: saccharose KHÔNG phản ứng với $\\mathrm{Cu(OH)_2}$ khi đun nóng.","points":1},{"type":"short","level":"VD","q":"Thủy phân $42,75$ gam saccharose ($M = 342$). Khối lượng fructose thu được là bao nhiêu gam?","answer":"22,5","explain":"$n_{saccharose} = 0,125$ mol → $m_{fructose} = 0,125 \\times 180 = 22,5$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $0,15$ mol maltose thủy phân hoàn toàn rồi tráng bạc toàn bộ sản phẩm. Khối lượng Ag thu được là bao nhiêu gam?","answer":"64,8","explain":"$n_{glucose} = 0,3$ mol → $n_{Ag} = 0,6$ mol → $m = 64,8$ gam.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Saccharose tan tốt trong:","options":["A. dầu mỡ","B. nước","C. xăng","D. ether"],"answer":"B","explain":"Saccharose dễ tan trong nước nhờ nhiều nhóm $-OH$.","points":0.25},{"type":"mcq","level":"NB","q":"Maltose được dùng để sản xuất:","options":["A. bia, kẹo mạch nha","B. xà phòng","C. phân bón","D. thuốc súng"],"answer":"A","explain":"Maltose (đường mạch nha) dùng sản xuất bia, kẹo mạch nha.","points":0.25},{"type":"mcq","level":"TH","q":"Hiện tượng khi cho saccharose vào $\\mathrm{Cu(OH)_2}$ ở nhiệt độ thường là:","options":["A. kết tủa đỏ gạch","B. dung dịch xanh lam","C. kết tủa trắng","D. không hiện tượng"],"answer":"B","explain":"Saccharose có nhiều nhóm $-OH$ nên hòa tan $\\mathrm{Cu(OH)_2}$ tạo dung dịch xanh lam.","points":0.25},{"type":"mcq","level":"TH","q":"Hiện tượng khi đun nóng maltose với $\\mathrm{Cu(OH)_2}$ là:","options":["A. dung dịch xanh lam","B. kết tủa đỏ gạch $\\mathrm{Cu_2O}$","C. kết tủa trắng","D. không hiện tượng"],"answer":"B","explain":"Maltose còn nhóm $-CHO$ nên khử $\\mathrm{Cu(OH)_2}$ thành $\\mathrm{Cu_2O}$ đỏ gạch khi đun nóng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $17,1$ gam saccharose ($M = 342$) thủy phân hoàn toàn. Khối lượng glucose thu được là:","options":["A. $9$ gam","B. $18$ gam","C. $4,5$ gam","D. $13,5$ gam"],"answer":"A","explain":"$n_{saccharose} = 0,05$ mol → $m_{glucose} = 9$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm saccharose và glucose. $m$ gam X tráng bạc trực tiếp thu được $21,6$ gam Ag; thủy phân hoàn toàn $m$ gam X rồi tráng bạc thu được $64,8$ gam Ag. Giá trị của $m$ là:","options":["A. $34,2$ gam","B. $43,2$ gam","C. $52,2$ gam","D. $61,2$ gam"],"answer":"C","explain":"Đặt $n_{sac} = a$, $n_{glu} = b$: tráng trực tiếp $2b = 0,2$ → $b = 0,1$; sau thủy phân $2(2a + b) = 0,6$ → $2a + b = 0,3$ → $a = 0,1$ → $m = 0,1 \\times 342 + 0,1 \\times 180 = 52,2$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Saccharose tan tốt trong nước.","b) Maltose dùng sản xuất bia.","c) Saccharose + $\\mathrm{Cu(OH)_2}$ (nguội) cho dung dịch xanh lam.","d) Maltose + $\\mathrm{Cu(OH)_2}$ (nóng) cho kết tủa đỏ gạch."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $17,1$ gam saccharose thủy phân cho $9$ gam glucose.","b) Tráng bạc trực tiếp $0,1$ mol glucose cho $0,2$ mol Ag.","c) $1$ mol saccharose thủy phân cho $2$ mol monosaccharide.","d) Maltose không bị thủy phân."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: maltose BỊ thủy phân cho 2 glucose.","points":1},{"type":"short","level":"VD","q":"Cho $0,05$ mol saccharose thủy phân hoàn toàn rồi tráng bạc. Khối lượng Ag thu được là bao nhiêu gam?","answer":"21,6","explain":"$n_{Ag} = 4 \\times 0,05 = 0,2$ mol → $m = 21,6$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân $68,4$ gam maltose ($M = 342$) với hiệu suất $75\\%$, rồi tráng bạc toàn bộ glucose thu được. Khối lượng Ag là bao nhiêu gam?","answer":"64,8","explain":"$n_{maltose} = 0,2$ mol → lí thuyết $0,4$ mol glucose; hiệu suất $75\\%$ → $0,3$ mol → $n_{Ag} = 0,6$ mol → $m = 64,8$ gam.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Saccharose được tạo thành từ:","options":["A. 2 phân tử glucose","B. glucose và fructose","C. 2 phân tử fructose","D. glucose và galactose"],"answer":"B","explain":"Saccharose gồm 1 gốc glucose và 1 gốc fructose.","points":0.25},{"type":"mcq","level":"NB","q":"Maltose được tạo thành từ:","options":["A. 2 phân tử glucose","B. glucose và fructose","C. 2 phân tử fructose","D. nhiều phân tử glucose"],"answer":"A","explain":"Maltose gồm 2 gốc glucose.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,05$ mol maltose tráng bạc hoàn toàn. Khối lượng Ag thu được là:","options":["A. $5,4$ gam","B. $10,8$ gam","C. $21,6$ gam","D. $2,7$ gam"],"answer":"B","explain":"$n_{Ag} = 0,1$ mol → $m = 10,8$ gam.","points":0.25},{"type":"mcq","level":"TH","q":"Thủy phân $0,05$ mol saccharose. Số mol fructose thu được là:","options":["A. $0,05$ mol","B. $0,1$ mol","C. $0,025$ mol","D. $0,2$ mol"],"answer":"A","explain":"$1$ mol saccharose → $1$ mol fructose.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $25,65$ gam maltose ($M = 342$) tráng bạc hoàn toàn. Khối lượng Ag thu được là:","options":["A. $8,1$ gam","B. $16,2$ gam","C. $32,4$ gam","D. $4,05$ gam"],"answer":"B","explain":"$n_{maltose} = 0,075$ mol → $n_{Ag} = 0,15$ mol → $m = 16,2$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Thủy phân $m$ gam saccharose ($M = 342$) với hiệu suất $90\\%$, rồi tráng bạc toàn bộ sản phẩm thu được $38,88$ gam Ag. Giá trị của $m$ là:","options":["A. $34,2$ gam","B. $30,78$ gam","C. $38$ gam","D. $27,36$ gam"],"answer":"A","explain":"$n_{Ag} = 38,88/108 = 0,36$ mol → $n_{saccharose}$ đã thủy phân $= 0,36/4 = 0,09$ mol → ban đầu $= 0,09/0,9 = 0,1$ mol → $m = 34,2$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Saccharose = glucose + fructose.","b) Maltose = glucose + glucose.","c) $0,05$ mol maltose tráng bạc cho $10,8$ gam Ag.","d) $0,05$ mol saccharose thủy phân cho $0,05$ mol fructose."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $25,65$ gam maltose tráng bạc cho $16,2$ gam Ag.","b) $38,88$ gam Ag tráng từ sản phẩm thủy phân $0,1$ mol saccharose (H = $90\\%$).","c) Saccharose không có nhóm $-CHO$ tự do.","d) Maltose có nhóm $-CHO$ tự do."],"answer":["T","T","T","T"],"explain":"a) Đúng. b) Đúng: $0,09$ mol saccharose thủy phân → $0,36$ mol Ag. c), d) Đúng.","points":1},{"type":"short","level":"VD","q":"Thủy phân $8,55$ gam saccharose ($M = 342$). Khối lượng fructose thu được là bao nhiêu gam?","answer":"4,5","explain":"$n_{saccharose} = 0,025$ mol → $m_{fructose} = 0,025 \\times 180 = 4,5$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $0,2$ mol saccharose thủy phân hoàn toàn rồi tráng bạc toàn bộ sản phẩm. Khối lượng Ag thu được là bao nhiêu gam?","answer":"86,4","explain":"$n_{Ag} = 4 \\times 0,2 = 0,8$ mol → $m = 86,4$ gam.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Chất nào sau đây là disaccharide?","options":["A. glucose","B. fructose","C. saccharose","D. tinh bột"],"answer":"C","explain":"Saccharose là disaccharide; glucose/fructose là monosaccharide; tinh bột là polysaccharide.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm thủy phân saccharose trong môi trường acid gồm:","options":["A. 2 glucose","B. glucose và fructose","C. 2 fructose","D. maltose"],"answer":"B","explain":"Saccharose thủy phân cho 1 glucose và 1 fructose.","points":0.25},{"type":"mcq","level":"TH","q":"Để chứng minh saccharose không còn nhóm $-CHO$ tự do, dùng:","options":["A. $\\mathrm{Cu(OH)_2}$ ở nhiệt độ thường","B. dung dịch $\\mathrm{AgNO_3/NH_3}$, đun nóng (không có hiện tượng)","C. quỳ tím","D. dung dịch $\\mathrm{HCl}$"],"answer":"B","explain":"Saccharose không tráng bạc — chứng tỏ không còn nhóm $-CHO$ tự do.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol maltose tác dụng với $\\mathrm{Cu(OH)_2}$ dư, đun nóng. Khối lượng $\\mathrm{Cu_2O}$ thu được là:","options":["A. $7,2$ gam","B. $14,4$ gam","C. $28,8$ gam","D. $21,6$ gam"],"answer":"B","explain":"$n_{\\mathrm{Cu_2O}} = 0,1$ mol → $m = 14,4$ gam.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $102,6$ gam saccharose ($M = 342$) với hiệu suất $80\\%$. Khối lượng glucose thu được là:","options":["A. $54$ gam","B. $43,2$ gam","C. $27$ gam","D. $21,6$ gam"],"answer":"B","explain":"Lí thuyết $0,3$ mol glucose $= 54$ gam; hiệu suất $80\\%$ → $43,2$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm saccharose và maltose có tỉ lệ mol $2:1$. Cho $102,6$ gam X tráng bạc hoàn toàn. Khối lượng Ag thu được là:","options":["A. $10,8$ gam","B. $21,6$ gam","C. $32,4$ gam","D. $43,2$ gam"],"answer":"B","explain":"Tổng số mol $= 102,6/342 = 0,3$ mol; tỉ lệ $2:1$ → $n_{maltose} = 0,1$ mol → $n_{Ag} = 0,2$ mol → $m = 21,6$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Saccharose là disaccharide.","b) Thủy phân saccharose cho glucose và fructose.","c) $\\mathrm{AgNO_3/NH_3}$ chứng minh saccharose không còn $-CHO$ tự do.","d) $0,1$ mol maltose + $\\mathrm{Cu(OH)_2}$/t° cho $14,4$ gam $\\mathrm{Cu_2O}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $102,6$ gam saccharose thủy phân (H = $80\\%$) cho $43,2$ gam glucose.","b) Hỗn hợp saccharose : maltose $= 2:1$ ($102,6$ gam) tráng bạc cho $21,6$ gam Ag.","c) Thủy phân maltose cho 2 glucose.","d) Saccharose là đường mía."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Cho $42,75$ gam maltose ($M = 342$) tráng bạc hoàn toàn. Khối lượng Ag thu được là bao nhiêu gam?","answer":"27","explain":"$n_{maltose} = 0,125$ mol → $n_{Ag} = 0,25$ mol → $m = 27$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân hoàn toàn $m$ gam saccharose rồi tráng bạc thu được $54$ gam Ag. Giá trị của $m$ là bao nhiêu?","answer":"42,75","explain":"$n_{Ag} = 0,5$ mol → $n_{saccharose} = 0,125$ mol → $m = 42,75$ gam.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Trong các chất sau, chất không có phản ứng tráng bạc là:","options":["A. glucose","B. fructose","C. maltose","D. saccharose"],"answer":"D","explain":"Saccharose không còn nhóm $-CHO$ tự do nên không tráng bạc.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các chất sau, chất có phản ứng tráng bạc là:","options":["A. saccharose","B. tinh bột","C. maltose","D. cellulose"],"answer":"C","explain":"Maltose còn nhóm $-CHO$ tự do nên tráng bạc.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol saccharose tác dụng với $\\mathrm{Cu(OH)_2}$ ở nhiệt độ thường. Hiện tượng là:","options":["A. kết tủa đỏ gạch","B. dung dịch xanh lam","C. kết tủa trắng","D. không hiện tượng"],"answer":"B","explain":"Saccharose có nhiều nhóm $-OH$ nên hòa tan $\\mathrm{Cu(OH)_2}$ tạo dung dịch xanh lam.","points":0.25},{"type":"mcq","level":"TH","q":"Đun nóng saccharose với $\\mathrm{Cu(OH)_2}$, hiện tượng là:","options":["A. kết tủa đỏ gạch","B. dung dịch xanh lam (không đổi)","C. kết tủa đen","D. có khí thoát ra"],"answer":"B","explain":"Saccharose không có nhóm $-CHO$ nên không khử được $\\mathrm{Cu(OH)_2}$ — vẫn là dung dịch xanh lam.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $17,1$ gam maltose ($M = 342$) với hiệu suất $80\\%$. Khối lượng glucose thu được là:","options":["A. $18$ gam","B. $14,4$ gam","C. $9$ gam","D. $7,2$ gam"],"answer":"B","explain":"Lí thuyết $0,1$ mol glucose $= 18$ gam; hiệu suất $80\\%$ → $14,4$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $m$ gam hỗn hợp saccharose và maltose (tỉ lệ khối lượng $1:1$) tráng bạc thu được $32,4$ gam Ag. Giá trị của $m$ là:","options":[ au đây sai?","options":["A. Maltose thủy phân cho 2 glucose","B. Saccharose thủy phân cho glucose và fructose","C. Saccharose có nhóm $-CHO$ tự do","D. Maltose có nhóm $-CHO$ tự do"],"answer":"C","explain":"Saccharose KHÔNG còn nhóm $-CHO$ tự do.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy chất nào sau đây đều bị thủy phân trong môi trường acid?","options":["A. glucose, fructose","B. saccharose, maltose, tinh bột","C. glucose, saccharose","D. fructose, cellulose"],"answer":"B","explain":"Disaccharide và polysaccharide bị thủy phân; monosaccharide không.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,2$ mol hỗn hợp saccharose và maltose (tỉ lệ mol $1:1$) thủy phân hoàn toàn. Tổng số mol monosaccharide thu được là:","options":["A. $0,2$ mol","B. $0,4$ mol","C. $0,6$ mol","D. $0,3$ mol"],"answer":"B","explain":"Mỗi mol disaccharide cho $2$ mol monosaccharide → $0,4$ mol.","points":0.25},{"type":"mcq","level":"VD","q":"Tráng bạc $34,2$ gam hỗn hợp saccharose và maltose thu được $10,8$ gam Ag. Phần trăm khối lượng maltose là:","options":["A. $25\\%$","B. $50\\%$","C. $75\\%$","D. $100\\%$"],"answer":"B","explain":"$n_{Ag} = 0,1$ mol → $n_{maltose} = 0,05$ mol → $m = 17,1$ gam → $50\\%$.","points":0.25},{"type":"mcq","level":"VDC","q":"Thủy phân hoàn toàn $m$ gam maltose rồi lên men toàn bộ glucose thu được với hiệu suất $80\\%$. Khối lượng ethanol thu được là $18,4$ gam. Giá trị của $m$ là: ($M_{maltose} = 342$)","options":["A. $34,2$ gam","B. $42,75$ gam","C. $51,3$ gam","D. $68,4$ gam"],"answer":"B","explain":"$n_{ethanol}$ thực $= 0,4$ mol → lí thuyết $= 0,5$ mol → $n_{glucose} = 0,25$ mol → $n_{maltose} = 0,125$ mol → $m = 42,75$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 5):","statements":["a) Saccharose và maltose đều là $\\mathrm{C_{12}H_{22}O_{11}}$.","b) Saccharose không tráng bạc; maltose tráng bạc.","c) Thủy phân saccharose cho glucose + fructose.","d) Thủy phân maltose cho 2 glucose."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $34,2$ gam hỗn hợp saccharose + maltose tráng bạc cho $10,8$ gam Ag thì $m_{maltose} = 17,1$ gam.","b) $42,75$ gam maltose thủy phân rồi lên men (H = $80\\%$) cho $18,4$ gam ethanol.","c) $0,2$ mol hỗn hợp disaccharide thủy phân cho $0,4$ mol monosaccharide.","d) Glucose, fructose là monosaccharide nên không bị thủy phân."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Thủy phân $20,52$ gam saccharose ($M = 342$). Khối lượng glucose thu được là bao nhiêu gam?","answer":"10,8","explain":"$n_{saccharose} = 0,06$ mol → $m_{glucose} = 10,8$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $m$ gam maltose tráng bạc thu được $27$ gam Ag. Giá trị của $m$ là bao nhiêu?","answer":"42,75","explain":"$n_{Ag} = 0,25$ mol → $n_{maltose} = 0,125$ mol → $m = 42,75$ gam.","points":0.5}]}]}</script>
