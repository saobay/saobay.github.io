<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Tinh bột có công thức là:","options":["A. $\\mathrm{(C_6H_{10}O_5)_n}$","B. $\\mathrm{C_{12}H_{22}O_{11}}$","C. $\\mathrm{C_6H_{12}O_6}$","D. $\\mathrm{(C_2H_4)_n}$"],"answer":"A","explain":"Tinh bột: $\\mathrm{(C_6H_{10}O_5)_n}$.","points":0.25},{"type":"mcq","level":"NB","q":"Tinh bột gồm hai thành phần là:","options":["A. glucose và fructose","B. amylose và amylopectin","C. saccharose và maltose","D. cellulose và lignin"],"answer":"B","explain":"Tinh bột gồm amylose (mạch không phân nhánh) và amylopectin (mạch phân nhánh).","points":0.25},{"type":"mcq","level":"TH","q":"Thuốc thử để nhận biết hồ tinh bột là:","options":["A. dung dịch $\\mathrm{AgNO_3/NH_3}$","B. dung dịch iodine (màu xanh tím)","C. $\\mathrm{Cu(OH)_2}$","D. nước bromine"],"answer":"B","explain":"Hồ tinh bột + iodine → màu xanh tím đặc trưng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đun nóng hỗn hợp hồ tinh bột và iodine, hiện tượng là:","options":["A. màu xanh tím đậm hơn","B. màu xanh tím biến mất; để nguội lại xuất hiện","C. có kết tủa trắng","D. có khí thoát ra"],"answer":"B","explain":"Phản ứng hấp phụ vật lí: đun nóng màu mất, để nguội màu hiện lại.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân hoàn toàn $16,2$ gam tinh bột. Khối lượng glucose thu được là:","options":["A. $18$ gam","B. $36$ gam","C. $9$ gam","D. $16,2$ gam"],"answer":"A","explain":"$n_{mắt\\ xích} = 16,2/162 = 0,1$ mol → $m_{glucose} = 18$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Thủy phân $32,4$ gam tinh bột với hiệu suất $80\\%$. Khối lượng glucose thu được là:","options":["A. $36$ gam","B. $28,8$ gam","C. $18$ gam","D. $14,4$ gam"],"answer":"B","explain":"Lí thuyết $0,2$ mol glucose $= 36$ gam; hiệu suất $80\\%$ → $28,8$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về tinh bột:","statements":["a) Tinh bột có công thức $\\mathrm{(C_6H_{10}O_5)_n}$.","b) Tinh bột gồm amylose và amylopectin.","c) Hồ tinh bột + iodine cho màu xanh tím.","d) Tinh bột là monosaccharide."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tinh bột là POLYSACCHARIDE.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $16,2$ gam tinh bột thủy phân cho $18$ gam glucose.","b) Đun nóng làm mất màu xanh tím của hồ tinh bột với iodine.","c) Thủy phân tinh bột qua các giai đoạn: dextrin → maltose → glucose.","d) Tinh bột tan tốt trong nước lạnh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tinh bột KHÔNG tan trong nước lạnh.","points":1},{"type":"short","level":"VD","q":"Thủy phân $8,1$ gam tinh bột. Khối lượng glucose thu được là bao nhiêu gam?","answer":"9","explain":"$n_{mắt\\ xích} = 0,05$ mol → $m_{glucose} = 9$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Một loại gạo chứa $80\\%$ tinh bột. Thủy phân $100$ gam gạo với hiệu suất $90\\%$. Khối lượng glucose thu được là bao nhiêu gam?","answer":"80","explain":"$m_{tinh\\ bột} = 80$ gam → $n_{mắt\\ xích} = 80/162$ mol → lí thuyết $m_{glucose} = 80 \\times 180/162 = 88,89$ gam; hiệu suất $90\\%$ → $80$ gam.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Cellulose có nhiều trong:","options":["A. gạo, ngô","B. bông, gỗ, tre nứa","C. mía đường","D. mật ong"],"answer":"B","explain":"Cellulose là thành phần chính của bông, gỗ, tre, nứa.","points":0.25},{"type":"mcq","level":"NB","q":"Mỗi mắt xích cellulose có bao nhiêu nhóm $-OH$?","options":["A. 2","B. 3","C. 5","D. 6"],"answer":"B","explain":"Mỗi mắt xích $\\mathrm{C_6H_{10}O_5}$ của cellulose có 3 nhóm $-OH$ tự do.","points":0.25},{"type":"mcq","level":"TH","q":"Sản phẩm của phản ứng cellulose với $\\mathrm{HNO_3}$ đặc (xúc tác $\\mathrm{H_2SO_4}$ đặc) là:","options":["A. glucose","B. cellulose trinitrate (thuốc súng không khói)","C. sorbitol","D. dextrin"],"answer":"B","explain":"$\\mathrm{[C_6H_7O_2(OH)_3]_n + 3nHNO_3 \\rightarrow [C_6H_7O_2(ONO_2)_3]_n + 3nH_2O}$.","points":0.25},{"type":"mcq","level":"TH","q":"Thủy phân cellulose trong môi trường acid thu được:","options":["A. fructose","B. glucose","C. saccharose","D. maltose"],"answer":"B","explain":"$\\mathrm{(C_6H_{10}O_5)_n + nH_2O \\rightarrow nC_6H_{12}O_6}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $16,2$ gam cellulose tác dụng với $\\mathrm{HNO_3}$ đặc dư. Khối lượng cellulose trinitrate ($M_{mắt\\ xích} = 297$) thu được là:","options":["A. $29,7$ gam","B. $16,2$ gam","C. $14,85$ gam","D. $59,4$ gam"],"answer":"A","explain":"$n_{mắt\\ xích} = 0,1$ mol → $m = 0,1 \\times 297 = 29,7$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $32,4$ gam cellulose tác dụng với $\\mathrm{HNO_3}$ đặc, hiệu suất $90\\%$. Khối lượng cellulose trinitrate thu được là:","options":["A. $59,4$ gam","B. $53,46$ gam","C. $29,7$ gam","D. $26,73$ gam"],"answer":"B","explain":"Lí thuyết $0,2$ mol mắt xích → $59,4$ gam; hiệu suất $90\\%$ → $53,46$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về cellulose:","statements":["a) Cellulose có công thức $\\mathrm{(C_6H_{10}O_5)_n}$.","b) Mỗi mắt xích cellulose có 3 nhóm $-OH$.","c) Cellulose trinitrate dùng làm thuốc súng không khói.","d) Cellulose tan tốt trong nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cellulose KHÔNG tan trong nước.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $16,2$ gam cellulose cho $29,7$ gam cellulose trinitrate.","b) Thủy phân cellulose cho glucose.","c) Cellulose gồm các gốc $\\beta$-glucose.","d) Tinh bột gồm các gốc $\\beta$-glucose."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tinh bột gồm các gốc $\\alpha$-glucose.","points":1},{"type":"short","level":"VD","q":"Thủy phân $32,4$ gam cellulose. Khối lượng glucose thu được là bao nhiêu gam?","answer":"36","explain":"$n_{mắt\\ xích} = 0,2$ mol → $m_{glucose} = 36$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cần bao nhiêu gam $\\mathrm{HNO_3}$ ($M = 63$) để tác dụng vừa đủ với $16,2$ gam cellulose?","answer":"18,9","explain":"$n_{mắt\\ xích} = 0,1$ mol → $n_{\\mathrm{HNO_3}} = 0,3$ mol → $m = 18,9$ gam.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Điểm giống nhau giữa tinh bột và cellulose là:","options":["A. đều tan trong nước","B. đều có công thức $\\mathrm{(C_6H_{10}O_5)_n}$ và thủy phân cho glucose","C. đều cho màu xanh tím với iodine","D. đều là disaccharide"],"answer":"B","explain":"Cả hai đều là polysaccharide $\\mathrm{(C_6H_{10}O_5)_n}$, thủy phân cho glucose.","points":0.25},{"type":"mcq","level":"NB","q":"Điểm khác nhau giữa tinh bột và cellulose là:","options":["A. công thức phân tử","B. loại gốc glucose ($\\alpha$ và $\\beta$) và cấu trúc mạch","C. sản phẩm thủy phân","D. đều không tan trong nước"],"answer":"B","explain":"Tinh bột: gốc $\\alpha$-glucose; cellulose: gốc $\\beta$-glucose, mạch dài không phân nhánh.","points":0.25},{"type":"mcq","level":"TH","q":"Để phân biệt tinh bột và cellulose, dùng thuốc thử:","options":["A. dung dịch $\\mathrm{AgNO_3/NH_3}$","B. dung dịch iodine","C. $\\mathrm{Cu(OH)_2}$","D. nước bromine"],"answer":"B","explain":"Tinh bột cho màu xanh tím với iodine; cellulose không.","points":0.25},{"type":"mcq","level":"TH","q":"Sản phẩm trung gian khi thủy phân tinh bột là:","options":["A. fructose","B. dextrin, maltose","C. saccharose","D. sorbitol"],"answer":"B","explain":"Tinh bột → dextrin → maltose → glucose.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $48,6$ gam tinh bột với hiệu suất $75\\%$. Khối lượng glucose thu được là:","options":["A. $54$ gam","B. $40,5$ gam","C. $27$ gam","D. $20,25$ gam"],"answer":"B","explain":"Lí thuyết $0,3$ mol glucose $= 54$ gam; hiệu suất $75\\%$ → $40,5$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm tinh bột và cellulose. Thủy phân hoàn toàn $32,4$ gam X thu được $36$ gam glucose. Phần trăm khối lượng của tinh bột trong X là:","options":["A. $50\\%$","B. $25\\%$","C. $75\\%$","D. không xác định được"],"answer":"D","explain":"Cả hai thủy phân đều cho glucose theo cùng tỉ lệ khối lượng ($162$ → $180$) nên không phân biệt được.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tinh bột và cellulose đều là $\\mathrm{(C_6H_{10}O_5)_n}$.","b) Cả hai thủy phân đều cho glucose.","c) Iodine phân biệt được tinh bột và cellulose.","d) Cả hai đều tan trong nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cả hai đều KHÔNG tan trong nước (tinh bột chỉ tạo hồ trong nước nóng).","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $48,6$ gam tinh bột thủy phân (H = $75\\%$) cho $40,5$ gam glucose.","b) Thủy phân tinh bột qua dextrin và maltose.","c) Tinh bột: gốc $\\alpha$-glucose; cellulose: gốc $\\beta$-glucose.","d) Cellulose cho màu xanh tím với iodine."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chỉ TINH BỘT cho màu xanh tím.","points":1},{"type":"short","level":"VD","q":"Thủy phân $24,3$ gam tinh bột. Khối lượng glucose thu được là bao nhiêu gam?","answer":"27","explain":"$n_{mắt\\ xích} = 0,15$ mol → $m_{glucose} = 27$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $m$ gam cellulose tác dụng với $\\mathrm{HNO_3}$ đặc dư thu được $59,4$ gam cellulose trinitrate. Giá trị của $m$ là bao nhiêu?","answer":"32,4","explain":"$n_{mắt\\ xích\\ trinitrate} = 59,4/297 = 0,2$ mol → $m_{cellulose} = 0,2 \\times 162 = 32,4$ gam.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Amylose trong tinh bột có cấu trúc mạch:","options":["A. phân nhánh","B. không phân nhánh","C. mạng không gian","D. vòng"],"answer":"B","explain":"Amylose: mạch không phân nhánh; amylopectin: mạch phân nhánh.","points":0.25},{"type":"mcq","level":"NB","q":"Amylopectin trong tinh bột có cấu trúc mạch:","options":["A. không phân nhánh","B. phân nhánh","C. thẳng","D. vòng"],"answer":"B","explain":"Amylopectin (khoảng $80\\%$) có mạch phân nhánh.","points":0.25},{"type":"mcq","level":"TH","q":"Hồ tinh bột là:","options":["A. dung dịch tinh bột trong nước lạnh","B. dung dịch keo của tinh bột trong nước nóng","C. tinh bột khan","D. hỗn hợp tinh bột và iodine"],"answer":"B","explain":"Tinh bột trong nước nóng tạo hồ tinh bột (dung dịch keo).","points":0.25},{"type":"mcq","level":"TH","q":"Ứng dụng nào sau đây là của tinh bột?","options":["A. sản xuất giấy","B. sản xuất ethanol bằng lên men","C. sản xuất thuốc súng","D. sản xuất vải sợi"],"answer":"B","explain":"Tinh bột lên men tạo ethanol; giấy/vải sợi/thuốc súng là ứng dụng của cellulose.","points":0.25},{"type":"mcq","level":"VD","q":"Lên men $16,2$ gam tinh bột với hiệu suất $80\\%$. Khối lượng ethanol thu được là:","options":["A. $9,2$ gam","B. $7,36$ gam","C. $18,4$ gam","D. $14,72$ gam"],"answer":"B","explain":"$n_{mắt\\ xích} = 0,1$ mol → $n_{glucose} = 0,1$ mol → lí thuyết $0,2$ mol ethanol $= 9,2$ gam; hiệu suất $80\\%$ → $7,36$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Thủy phân hoàn toàn $m$ gam tinh bột rồi tráng bạc toàn bộ glucose thu được $43,2$ gam Ag. Giá trị của $m$ là:","options":["A. $16,2$ gam","B. $32,4$ gam","C. $8,1$ gam","D. $24,3$ gam"],"answer":"B","explain":"$n_{Ag} = 0,4$ mol → $n_{glucose} = 0,2$ mol → $n_{mắt\\ xích} = 0,2$ mol → $m = 0,2 \\times 162 = 32,4$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Amylose mạch không phân nhánh.","b) Amylopectin mạch phân nhánh.","c) Hồ tinh bột là dung dịch keo trong nước nóng.","d) Tinh bột lên men tạo ethanol."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $16,2$ gam tinh bột lên men (H = $80\\%$) cho $7,36$ gam ethanol.","b) $43,2$ gam Ag tráng từ glucose thủy phân của $32,4$ gam tinh bột.","c) Tinh bột tan trong nước lạnh.","d) Iodine nhận biết được hồ tinh bột."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: tinh bột KHÔNG tan trong nước lạnh.","points":1},{"type":"short","level":"VD","q":"Thủy phân $40,5$ gam tinh bột. Khối lượng glucose thu được là bao nhiêu gam?","answer":"45","explain":"$n_{mắt\\ xích} = 0,25$ mol → $m_{glucose} = 45$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân $64,8$ gam tinh bột với hiệu suất $85\\%$. Khối lượng glucose thu được là bao nhiêu gam?","answer":"61,2","explain":"$n_{mắt\\ xích} = 0,4$ mol → lí thuyết $0,4$ mol glucose $= 72$ gam; hiệu suất $85\\%$ → $61,2$ gam.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Cellulose trinitrate được dùng làm:","options":["A. thực phẩm","B. thuốc súng không khói","C. phân bón","D. chất tẩy rửa"],"answer":"B","explain":"Cellulose trinitrate là thuốc súng không khói.","points":0.25},{"type":"mcq","level":"NB","q":"Nguyên liệu sản xuất giấy chủ yếu là:","options":["A. tinh bột","B. cellulose","C. glucose","D. saccharose"],"answer":"B","explain":"Giấy sản xuất từ cellulose (bột gỗ, tre nứa).","points":0.25},{"type":"mcq","level":"TH","q":"Phân tử khối của một mắt xích cellulose trinitrate là:","options":["A. $162$","B. $297$","C. $180$","D. $342$"],"answer":"B","explain":"$\\mathrm{C_6H_7O_2(ONO_2)_3}$: $M = 72 + 7 + 32 + 3 \\times 62 = 297$.","points":0.25},{"type":"mcq","level":"TH","q":"Số mol $\\mathrm{HNO_3}$ cần để chuyển hóa $1$ mol mắt xích cellulose thành cellulose trinitrate là:","options":["A. $1$ mol","B. $2$ mol","C. $3$ mol","D. $6$ mol"],"answer":"C","explain":"Mỗi mắt xích có 3 nhóm $-OH$ → cần $3$ mol $\\mathrm{HNO_3}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $8,1$ gam cellulose tác dụng với $\\mathrm{HNO_3}$ đặc dư. Khối lượng cellulose trinitrate thu được là:","options":["A. $14,85$ gam","B. $29,7$ gam","C. $8,1$ gam","D. $7,425$ gam"],"answer":"A","explain":"$n_{mắt\\ xích} = 0,05$ mol → $m = 0,05 \\times 297 = 14,85$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm tinh bột và cellulose. Cho $16,2$ gam X tác dụng với $\\mathrm{HNO_3}$ đặc dư thu được $14,85$ gam cellulose trinitrate. Phần trăm khối lượng của cellulose trong X là:","options":["A. $25\\%$","B. $50\\%$","C. $75\\%$","D. $100\\%$"],"answer":"B","explain":"$n_{trinitrate} = 14,85/297 = 0,05$ mol → $m_{cellulose} = 0,05 \\times 162 = 8,1$ gam → $50\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cellulose trinitrate là thuốc súng không khói.","b) Giấy sản xuất từ cellulose.","c) $M_{mắt\\ xích\\ trinitrate} = 297$.","d) $1$ mắt xích cellulose cần $3$ $\\mathrm{HNO_3}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $8,1$ gam cellulose cho $14,85$ gam cellulose trinitrate.","b) Hỗn hợp tinh bột + cellulose ($16,2$ gam) cho $14,85$ gam trinitrate thì $m_{cellulose} = 8,1$ gam.","c) Tinh bột tác dụng với $\\mathrm{HNO_3}$ đặc cho thuốc súng.","d) Cellulose không tan trong nước."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: chỉ CELLULOSE (không phải tinh bột) cho cellulose trinitrate.","points":1},{"type":"short","level":"VD","q":"Cần bao nhiêu gam cellulose để điều chế $29,7$ gam cellulose trinitrate ($M_{mắt\\ xích} = 297$)?","answer":"16,2","explain":"$n_{mắt\\ xích} = 0,1$ mol → $m_{cellulose} = 16,2$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $24,3$ gam cellulose tác dụng với $\\mathrm{HNO_3}$ đặc dư, hiệu suất $80\\%$. Khối lượng cellulose trinitrate thu được là bao nhiêu gam?","answer":"35,64","explain":"$n_{mắt\\ xích} = 0,15$ mol → lí thuyết $0,15 \\times 297 = 44,55$ gam; hiệu suất $80\\%$ → $35,64$ gam.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Sản phẩm cuối cùng của quá trình thủy phân tinh bột là:","options":["A. dextrin","B. maltose","C. glucose","D. fructose"],"answer":"C","explain":"Tinh bột → dextrin → maltose → glucose (sản phẩm cuối).","points":0.25},{"type":"mcq","level":"NB","q":"Enzyme thủy phân tinh bột trong cơ thể là:","options":["A. zymase","B. amylase","C. pepsin","D. lipase"],"answer":"B","explain":"Amylase (trong nước bọt, dịch tụy) thủy phân tinh bột.","points":0.25},{"type":"mcq","level":"TH","q":"Nhỏ dung dịch iodine vào lát chuối xanh thấy màu xanh tím vì:","options":["A. chuối xanh chứa tinh bột","B. chuối xanh chứa glucose","C. chuối xanh chứa cellulose","D. iodine có màu xanh"],"answer":"A","explain":"Chuối xanh chứa nhiều tinh bột → màu xanh tím với iodine.","points":0.25},{"type":"mcq","level":"TH","q":"Khi chuối chín, tinh bột chuyển thành đường nên:","options":["A. vẫn cho màu xanh tím với iodine","B. không còn cho màu xanh tím đậm với iodine","C. có vị chát","D. cứng hơn"],"answer":"B","explain":"Tinh bột đã chuyển thành đường (glucose, fructose) nên phản ứng với iodine mờ dần.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $81$ gam tinh bột với hiệu suất $90\\%$. Khối lượng glucose thu được là:","options":["A. $90$ gam","B. $81$ gam","C. $72,9$ gam","D. $100$ gam"],"answer":"B","explain":"$n_{mắt\\ xích} = 0,5$ mol → lí thuyết $0,5$ mol glucose $= 90$ gam; hiệu suất $90\\%$ → $81$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm tinh bột và glucose. Thủy phân hoàn toàn $m$ gam X rồi tráng bạc thu được $21,6$ gam Ag. Cũng $m$ gam X cho vào dung dịch iodine thấy màu xanh tím. Giá trị của $m$ là:","options":["A. $16,2$ gam","B. $8,1$ gam","C. $24,3$ gam","D. không xác định được"],"answer":"D","explain":"Cả tinh bột (sau thủy phân) và glucose đều tráng bạc; chỉ biết có tinh bột (xanh tím) nhưng không xác định được tỉ lệ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sản phẩm cuối thủy phân tinh bột là glucose.","b) Amylase thủy phân tinh bột.","c) Chuối xanh chứa tinh bột.","d) Chuối chín ngọt do tinh bột chuyển thành đường."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $81$ gam tinh bột thủy phân (H = $90\\%$) cho $81$ gam glucose.","b) Hỗn hợp tinh bột + glucose tráng bạc không xác định được khối lượng.","c) Dextrin là sản phẩm trung gian thủy phân tinh bột.","d) Tinh bột có trong gạo, ngô, khoai, sắn."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Thủy phân $12,15$ gam tinh bột. Khối lượng glucose thu được là bao nhiêu gam?","answer":"13,5","explain":"$n_{mắt\\ xích} = 0,075$ mol → $m_{glucose} = 13,5$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Lên men $32,4$ gam tinh bột với hiệu suất chung $75\\%$. Khối lượng ethanol thu được là bao nhiêu gam?","answer":"13,8","explain":"$n_{mắt\\ xích} = 0,2$ mol → $n_{glucose} = 0,2$ mol → lí thuyết $0,4$ mol ethanol $= 18,4$ gam; hiệu suất $75\\%$ → $13,8$ gam.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Chất nào sau đây không phải là polysaccharide?","options":["A. tinh bột","B. cellulose","C. saccharose","D. dextrin"],"answer":"C","explain":"Saccharose là disaccharide; các chất còn lại là polysaccharide.","points":0.25},{"type":"mcq","level":"NB","q":"Thuốc súng không khói được điều chế từ:","options":["A. tinh bột và $\\mathrm{HNO_3}$","B. cellulose và $\\mathrm{HNO_3}$ đặc","C. glucose và $\\mathrm{HNO_3}$","D. saccharose và $\\mathrm{H_2SO_4}$"],"answer":"B","explain":"Cellulose + $\\mathrm{HNO_3}$ đặc → cellulose trinitrate (thuốc súng không khói).","points":0.25},{"type":"mcq","level":"TH","q":"Cho các chất: tinh bột, cellulose, saccharose, glucose. Số chất cho màu xanh tím với iodine là:","options":["A. 1","B. 2","C. 3","D. 4"],"answer":"A","explain":"Chỉ tinh bột (hồ tinh bột) cho màu xanh tím với iodine.","points":0.25},{"type":"mcq","level":"TH","q":"Cho các chất: glucose, fructose, saccharose, tinh bột. Số chất có phản ứng tráng bạc trực tiếp là:","options":["A. 1","B. 2","C. 3","D. 4"],"answer":"B","explain":"Glucose (trực tiếp) và fructose (qua chuyển thành glucose trong kiềm) — 2 chất.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $20,25$ gam tinh bột với hiệu suất $80\\%$. Khối lượng glucose thu được là:","options":["A. $22,5$ gam","B. $18$ gam","C. $11,25$ gam","D. $9$ gam"],"answer":"B","explain":"Lí thuyết $0,125$ mol glucose $= 22,5$ gam; hiệu suất $80\\%$ → $18$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $m$ gam cellulose tác dụng với $\\mathrm{HNO_3}$ đặc dư, hiệu suất $85\\%$, thu được $50,49$ gam cellulose trinitrate. Giá trị của $m$ là:","options":["A. $32,4$ gam","B. $27,54$ gam","C. $16,2$ gam","D. $38,1$ gam"],"answer":"A","explain":"Lí thuyết $m_{trinitrate} = 50,49/0,85 = 59,4$ gam → $n_{mắt\\ xích} = 0,2$ mol → $m_{cellulose} = 32,4$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Saccharose là disaccharide.","b) Thuốc súng không khói từ cellulose và $\\mathrm{HNO_3}$ đặc.","c) Chỉ tinh bột cho màu xanh tím với iodine.","d) Glucose và fructose đều tráng bạc được."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $20,25$ gam tinh bột thủy phân (H = $80\\%$) cho $18$ gam glucose.","b) $50,49$ gam cellulose trinitrate (H = $85\\%$) điều chế từ $32,4$ gam cellulose.","c) Tinh bột gồm gốc $\\alpha$-glucose.","d) Cellulose gồm gốc $\\alpha$-glucose."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cellulose gồm gốc $\\beta$-glucose.","points":1},{"type":"short","level":"VD","q":"Thủy phân $56,7$ gam tinh bột. Khối lượng glucose thu được là bao nhiêu gam?","answer":"63","explain":"$n_{mắt\\ xích} = 0,35$ mol → $m_{glucose} = 63$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $48,6$ gam cellulose tác dụng với $\\mathrm{HNO_3}$ đặc dư. Khối lượng $\\mathrm{H_2O}$ tạo thành là bao nhiêu gam?","answer":"16,2","explain":"$n_{mắt\\ xích} = 0,3$ mol → $n_{\\mathrm{H_2O}} = 0,9$ mol → $m = 16,2$ gam.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Trong các chất sau, chất được dùng làm thức ăn cho người là:","options":["A. cellulose trinitrate","B. tinh bột","C. thuốc súng","D. tơ visco"],"answer":"B","explain":"Tinh bột là lương thực quan trọng.","points":0.25},{"type":"mcq","level":"NB","q":"Tơ visco được sản xuất từ:","options":["A. tinh bột","B. cellulose","C. glucose","D. protein"],"answer":"B","explain":"Tơ visco (tơ nhân tạo) sản xuất từ cellulose.","points":0.25},{"type":"mcq","level":"TH","q":"Để nhận biết 3 chất rắn: tinh bột, cellulose, saccharose, dùng thuốc thử lần lượt là:","options":["A. iodine (nhận tinh bột), nước (saccharose tan, cellulose không)","B. $\\mathrm{AgNO_3/NH_3}$","C. $\\mathrm{Cu(OH)_2}$","D. quỳ tím"],"answer":"A","explain":"Iodine nhận tinh bột (xanh tím); hòa tan vào nước: saccharose tan, cellulose không tan.","points":0.25},{"type":"mcq","level":"TH","q":"Sản phẩm của phản ứng thủy phân hoàn toàn cellulose là:","options":["A. fructose","B. glucose","C. saccharose","D. maltose"],"answer":"B","explain":"Cellulose thủy phân hoàn toàn cho glucose.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $m$ gam tinh bột thu được $27$ gam glucose với hiệu suất $75\\%$. Giá trị của $m$ là:","options":["A. $24,3$ gam","B. $32,4$ gam","C. $36$ gam","D. $27$ gam"],"answer":"B","explain":"Lí thuyết $m_{glucose} = 27/0,75 = 36$ gam → $n_{mắt\\ xích} = 0,2$ mol → $m = 32,4$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm tinh bột và cellulose có khối lượng $48,6$ gam. Thủy phân hoàn toàn X thu được $54$ gam glucose. Khối lượng tinh bột trong X là:","options":["A. $24,3$ gam","B. $48,6$ gam","C. $0$ gam","D. không xác định được"],"answer":"D","explain":"Cả hai cho glucose theo cùng tỉ lệ khối lượng nên không xác định được từng chất.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tinh bột là lương thực.","b) Tơ visco từ cellulose.","c) Iodine + nước phân biệt được tinh bột, saccharose, cellulose.","d) Thủy phân hoàn toàn cellulose cho glucose."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $27$ gam glucose (H = $75\\%$) thủy phân từ $32,4$ gam tinh bột.","b) Hỗn hợp tinh bột + cellulose thủy phân không xác định được từng chất.","c) Cellulose không tan trong nước.","d) Tinh bột tan tốt trong nước lạnh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tinh bột KHÔNG tan trong nước lạnh.","points":1},{"type":"short","level":"VD","q":"Lên men $24,3$ gam tinh bột với hiệu suất $90\\%$. Khối lượng ethanol thu được là bao nhiêu gam?","answer":"12,42","explain":"$n_{mắt\\ xích} = 0,15$ mol → $n_{glucose} = 0,15$ mol → lí thuyết $0,3$ mol ethanol $= 13,8$ gam; hiệu suất $90\\%$ → $12,42$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân hoàn toàn $m$ gam cellulose rồi tráng bạc toàn bộ glucose thu được $64,8$ gam Ag. Giá trị của $m$ là bao nhiêu?","answer":"48,6","explain":"$n_{Ag} = 0,6$ mol → $n_{glucose} = 0,3$ mol → $n_{mắt\\ xích} = 0,3$ mol → $m = 48,6$ gam.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng?","options":["A. Tinh bột tan tốt trong nước lạnh","B. Cellulose là polysaccharide có mạch không phân nhánh rất dài","C. Tinh bột cho màu đỏ với iodine","D. Cellulose thủy phân cho fructose"],"answer":"B","explain":"Cellulose: mạch không phân nhánh, rất dài, gồm gốc $\\beta$-glucose.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây sai?","options":["A. Tinh bột thủy phân cho glucose","B. Cellulose thủy phân cho glucose","C. Tinh bột và cellulose đều là $\\mathrm{(C_6H_{10}O_5)_n}$","D. Tinh bột tan tốt trong nước lạnh"],"answer":"D","explain":"Tinh bột KHÔNG tan trong nước lạnh (chỉ tạo hồ trong nước nóng).","points":0.25},{"type":"mcq","level":"TH","q":"Dãy chất nào sau đây đều bị thủy phân?","options":["A. glucose, fructose","B. tinh bột, cellulose, saccharose","C. glucose, tinh bột","D. fructose, cellulose"],"answer":"B","explain":"Di- và polysaccharide bị thủy phân; monosaccharide không.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol mắt xích tinh bột thủy phân hoàn toàn. Số mol glucose thu được là:","options":["A. $0,1$ mol","B. $0,2$ mol","C. $0,05$ mol","D. $1$ mol"],"answer":"A","explain":"Tỉ lệ $1:1$ giữa mắt xích và glucose.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $32,4$ gam tinh bột. Khối lượng glucose thu được là:","options":["A. $36$ gam","B. $18$ gam","C. $32,4$ gam","D. $16,2$ gam"],"answer":"A","explain":"$n_{mắt\\ xích} = 32,4/162 = 0,2$ mol → $m_{glucose} = 0,2 \\times 180 = 36$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Thủy phân $m$ gam tinh bột với hiệu suất $80\\%$, rồi lên men toàn bộ glucose với hiệu suất $90\\%$. Khối lượng ethanol thu được là $16,56$ gam. Giá trị của $m$ là:","options":["A. $32,4$ gam","B. $36$ gam","C. $40,5$ gam","D. $45$ gam"],"answer":"C","explain":"$n_{ethanol}$ thực $= 0,36$ mol → sau lên men lí thuyết $= 0,4$ mol → $n_{glucose}$ thực $= 0,2$ mol → lí thuyết thủy phân $= 0,25$ mol → $n_{mắt\\ xích} = 0,25$ mol → $m = 40,5$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp bài 6):","statements":["a) Cellulose mạch không phân nhánh rất dài.","b) Tinh bột không tan trong nước lạnh.","c) Tinh bột, cellulose, saccharose đều bị thủy phân.","d) $0,1$ mol mắt xích tinh bột cho $0,1$ mol glucose."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thủy phân tinh bột (H = $80\\%$) rồi lên men (H = $90\\%$) cho ethanol với hiệu suất chung $72\\%$.","b) $40,5$ gam tinh bột cho $16,56$ gam ethanol qua 2 giai đoạn trên.","c) Hồ tinh bột + iodine: đun nóng mất màu, để nguội hiện màu.","d) Cellulose tan trong nước nóng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cellulose KHÔNG tan trong nước.","points":1},{"type":"short","level":"VD","q":"Thủy phân $72,9$ gam tinh bột. Khối lượng glucose thu được là bao nhiêu gam?","answer":"81","explain":"$n_{mắt\\ xích} = 0,45$ mol → $m_{glucose} = 81$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $16,2$ gam tinh bột lên men với hiệu suất chung $72\\%$. Khối lượng ethanol thu được là bao nhiêu gam?","answer":"6,624","explain":"$n_{mắt\\ xích} = 0,1$ mol → $n_{glucose} = 0,1$ mol → lí thuyết $0,2$ mol ethanol $= 9,2$ gam; hiệu suất $72\\%$ → $6,624$ gam.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Trong các chất sau, chất thuộc loại polysaccharide là:","options":["A. glucose","B. maltose","C. tinh bột","D. saccharose"],"answer":"C","explain":"Tinh bột là polysaccharide.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các chất sau, chất không bị thủy phân là:","options":["A. tinh bột","B. cellulose","C. glucose","D. saccharose"],"answer":"C","explain":"Glucose là monosaccharide nên không bị thủy phân.","points":0.25},{"type":"mcq","level":"TH","q":"Cho các dung dịch: hồ tinh bột, glucose, saccharose. Thuốc thử phân biệt hồ tinh bột là:","options":["A. $\\mathrm{AgNO_3/NH_3}$","B. dung dịch iodine","C. $\\mathrm{Cu(OH)_2}$","D. quỳ tím"],"answer":"B","explain":"Iodine cho màu xanh tím với hồ tinh bột.","points":0.25},{"type":"mcq","level":"TH","q":"Khối lượng glucose thu được khi thủy phân $1$ mol mắt xích tinh bột là:","options":["A. $162$ gam","B. $180$ gam","C. $342$ gam","D. $90$ gam"],"answer":"B","explain":"$1$ mol mắt xích ($162$ gam) + nước → $1$ mol glucose ($180$ gam).","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $97,2$ gam tinh bột với hiệu suất $85\\%$. Khối lượng glucose thu được là:","options":["A. $108$ gam","B. $91,8$ gam","C. $54$ gam","D. $45,9$ gam"],"answer":"B","explain":"Lí thuyết $0,6$ mol glucose $= 108$ gam; hiệu suất $85\\%$ → $91,8$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm tinh bột và glucose. Cho $m$ gam X vào iodine thấy màu xanh tím; thủy phân $m$ gam X rồi tráng bạc thu được $32,4$ gam Ag. Giá trị của $m$ là:","options":["A. $16,2$ gam","B. $32,4$ gam","C. $48,6$ gam","D. không xác định được"],"answer":"D","explain":"Cả hai đều cho Ag sau thủy phân nên không xác định được tỉ lệ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp):","statements":["a) Tinh bột là polysaccharide.","b) Glucose không bị thủy phân.","c) Iodine nhận biết hồ tinh bột.","d) $1$ mol mắt xích tinh bột cho $1$ mol glucose."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $97,2$ gam tinh bột thủy phân (H = $85\\%$) cho $91,8$ gam glucose.","b) Hỗn hợp tinh bột + glucose không xác định được khối lượng từ lượng Ag.","c) Amylose chiếm khoảng $20\\%$ tinh bột.","d) Amylopectin mạch không phân nhánh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: amylopectin mạch PHÂN NHÁNH.","points":1},{"type":"short","level":"VD","q":"Thủy phân $18,225$ gam tinh bột. Khối lượng glucose thu được là bao nhiêu gam?","answer":"20,25","explain":"$n_{mắt\\ xích} = 0,1125$ mol → $m_{glucose} = 20,25$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $16,2$ gam tinh bột. Thể tích $\\mathrm{CO_2}$ (đktc) thu được là bao nhiêu lít?","answer":"13,44","explain":"$n_{mắt\\ xích} = 0,1$ mol → $n_{\\mathrm{CO_2}} = 0,6$ mol → $V = 13,44$ lít.","points":0.5}]}]}</script>
