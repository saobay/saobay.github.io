cose} = 0,1$ mol → $m = 18$ gam.","points":0.25},{"type":"mcq","level":"VD","q":"Lên men $22,5$ gam glucose với hiệu suất $80\\%$. Thể tích $\\mathrm{CO_2}$ (đktc) thu được là:","options":["A. $5,6$ lít","B. $4,48$ lít","C. $11,2$ lít","D. $2,24$ lít"],"answer":"B","explain":"$n_{glucose} = 0,125$ mol → lí thuyết $0,25$ mol $\\mathrm{CO_2}$; hiệu suất $80\\%$ → $0,2$ mol → $V = 4,48$ lít.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm saccharose và maltose. Cho $51,3$ gam X tráng bạc trực tiếp thu được $21,6$ gam Ag. Phần trăm khối lượng của maltose trong X là:","options":["A. $66,7\\%$","B. $33,3\\%$","C. $50\\%$","D. $25\\%$"],"answer":"A","explain":"Chỉ maltose tráng bạc: $n_{Ag} = 0,2$ mol → $n_{maltose} = 0,1$ mol → $m_{maltose} = 34,2$ gam → $34,2/51,3 = 66,7\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Fructose là monosaccharide.","b) Saccharose là disaccharide.","c) $0,05$ mol glucose + $\\mathrm{Cu(OH)_2}$/t° cho $7,2$ gam $\\mathrm{Cu_2O}$.","d) $0,05$ mol maltose thủy phân cho $18$ gam glucose."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $22,5$ gam glucose lên men (H = $80\\%$) cho $4,48$ lít $\\mathrm{CO_2}$ (đktc).","b) Mỗi mol disaccharide thủy phân cho 2 mol monosaccharide.","c) Mỗi mol monosaccharide tráng bạc cho 2 mol Ag.","d) Thủy phân disaccharide rồi tráng bạc: $1$ mol disaccharide cho $4$ mol Ag."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Cho $0,1$ mol maltose tráng bạc hoàn toàn. Khối lượng Ag thu được là bao nhiêu gam?","answer":"21,6","explain":"$n_{Ag} = 0,2$ mol → $m = 21,6$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân $102,6$ gam saccharose ($M = 342$) với hiệu suất $85\\%$. Khối lượng glucose thu được là bao nhiêu gam?","answe oints":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Glucose có trong máu người.","b) Mía đường chứa saccharose.","c) Iodine phân biệt tinh bột và cellulose.","d) Lên men glucose tạo ethanol và $\\mathrm{CO_2}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $8,1$ gam glucose tráng bạc cho $9,72$ gam Ag.","b) $18$ gam hỗn hợp glucose + fructose đốt cháy cho $0,6$ mol $\\mathrm{CO_2}$.","c) Cả hai chất trong hỗn hợp đều tráng bạc tỉ lệ $1:2$.","d) Fructose không lên men được."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Thủy phân $13,68$ gam saccharose ($M = 342$). Khối lượng fructose thu được là bao nhiêu gam?","answer":"7,2","explain":"$n_{saccharose} = 0,04$ mol → $m_{fructose} = 7,2$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $27$ gam cellulose tác dụng với $\\mathrm{HNO_3}$ đặc dư. Khối lượng cellulose trinitrate thu được là bao nhiêu gam?","answer":"49,5","explain":"$n_{mắt\\ xích} = 27/162 = 0,1667$?? Tính lại: $27/162 = 1/6$ mol → $m = 297/6 = 49,5$ gam.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Thuốc thử Tollens dùng để:","options":["A. nhận biết tinh bột","B. tráng bạc (nhận biết nhóm $-CHO$)","C. nhận biết protein","D. nhận biết lipid"],"answer":"B","explain":"Thuốc thử Tollens ($\\mathrm{AgNO_3/NH_3}$) dùng tráng bạc.","points":0.25},{"type":"mcq","level":"NB","q":"Enzyme thủy phân tinh bột là:","options":["A. zymase","B. amylase","C. pepsin","D. trypsin"],"answer":"B","explain":"Amylase thủy phân tinh bột thành dextrin, maltose.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol fructose tác dụng với $\\mathrm{Cu(OH)_2}$ ở nhiệt độ thường. Hiện tượng là:","options":["A. kết tủa đỏ gạch","B. dung dịch xanh lam","C. kết tủa trắng","D. không hiện tượng"],"answer":"B","explain":"Fructose có 5 nhóm $-OH$ nên hòa tan $\\mathrm{Cu(OH)_2}$ tạo dung dịch xanh lam.","points":0.25},{"type":"mcq","level":"TH","q":"Đun nóng fructose với $\\mathrm{Cu(OH)_2}$, hiện tượng là:","options":["A. dung dịch xanh lam","B. kết tủa đỏ gạch $\\mathrm{Cu_2O}$","C. kết tủa đen","D. không hiện tượng"],"answer":"B","explain":"Trong kiềm nóng, fructose chuyển thành glucose nên khử $\\mathrm{Cu(OH)_2}$ thành $\\mathrm{Cu_2O}$.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $m$ gam maltose ($M = 342$) thu được $36$ gam glucose với hiệu suất $80\\%$. Giá trị của $m$ là:","options":["A. $34,2$ gam","B. $42,75$ gam","C. $51,3$ gam","D. $27,36$ gam"],"answer":"B","explain":"Lí thuyết $m_{glucose} = 45$ gam → $n_{maltose} = 0,125$ mol → $m = 42,75$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm glucose và maltose có tỉ lệ mol $1:1$. Cho $52,2$ gam X tráng bạc hoàn toàn. Khối lượng Ag thu được là:","options":["A. $21,6$ gam","B. $43,2$ gam","C. $32,4$ gam","D. $64,8$ gam"],"answer":"B","explain":"$n$ mỗi chất $= 52,2/522 = 0,1$ mol → $n_{Ag} = 2 \\times 0,2 = 0,4$ mol → $m = 43,2$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thuốc thử Tollens dùng tráng bạc.","b) Amylase thủy phân tinh bột.","c) Fructose + $\\mathrm{Cu(OH)_2}$ (nguội) cho xanh lam.","d) Đun nóng fructose với $\\mathrm{Cu(OH)_2}$ cho kết tủa đỏ gạch."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $45$ gam glucose lí thuyết thủy phân từ $42,75$ gam maltose.","b) Hỗn hợp glucose + maltose (tỉ lệ mol $1:1$, $52,2$ gam) tráng bạc cho $43,2$ gam Ag.","c) Zymase lên men glucose.","d) Pepsin thủy phân protein."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Cho $0,12$ mol glucose tráng bạc hoàn toàn. Khối lượng Ag thu được là bao nhiêu gam?","answer":"25,92","explain":"$n_{Ag} = 0,24$ mol → $m = 25,92$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân $64,8$ gam tinh bột với hiệu suất $90\\%$. Khối lượng glucose thu được là bao nhiêu gam?","answer":"64,8","explain":"$n_{mắt\\ xích} = 64,8/162 = 0,4$ mol → lí thuyết $0,4$ mol glucose $= 72$ gam; hiệu suất $90\\%$ → $64,8$ gam.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Sắp xếp theo độ ngọt tăng dần:","options":["A. glucose, fructose, saccharose","B. glucose, saccharose, fructose","C. fructose, glucose, saccharose","D. saccharose, fructose, glucose"],"answer":"B","explain":"Độ ngọt tăng dần: glucose, saccharose, fructose.","points":0.25},{"type":"mcq","level":"NB","q":"Chất nào sau đây vừa có tính khử vừa có tính oxi hóa?","options":["A. saccharose","B. glucose","C. tinh bột","D. cellulose"],"answer":"B","explain":"Glucose khử $\\mathrm{Ag^+}$ (tính khử) và bị $\\mathrm{H_2}$ khử thành sorbitol (tính oxi hóa).","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol glucose tác dụng với Na dư. Thể tích $\\mathrm{H_2}$ (đktc) là:","options":["A. $1,12$ lít","B. $2,8$ lít","C. $5,6$ lít","D. $11,2$ lít"],"answer":"C","explain":"5 nhóm $-OH$: $n_{\\mathrm{H_2}} = 0,25$ mol → $V = 5,6$ lít.","points":0.25},{"type":"mcq","level":"TH","q":"Thủy phân $0,1$ mol tinh bột (tính theo mắt xích). Số mol glucose thu được là:","options":["A. $0,1$ mol","B. $0,2$ mol","C. $0,6$ mol","D. $0,05$ mol"],"answer":"A","explain":"Tỉ lệ $1:1$.","points":0.25},{"type":"mcq","level":"VD","q":"Tráng bạc $m$ gam glucose thu được $16,2$ gam Ag với hiệu suất $90\\%$. Giá trị của $m$ là:","options":["A. $13,5$ gam","B. $15$ gam","C. $12,15$ gam","D. $27$ gam"],"answer":"B","explain":"Thực $n_{Ag} = 0,15$ mol → lí thuyết $= 0,1667$ mol → $n_{glucose} = 0,0833$ mol → $m = 15$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm glucose và saccharose có tỉ lệ mol $1:1$. Thủy phân hoàn toàn $52,2$ gam X rồi tráng bạc thu được $m$ gam Ag. Giá trị của $m$ là:","options":["A. $43,2$ gam","B. $64,8$ gam","C. $32,4$ gam","D. $86,4$ gam"],"answer":"B","explain":"$n$ mỗi chất $= 52,2/522 = 0,1$ mol; sau thủy phân tổng $0,3$ mol monosaccharide → $n_{Ag} = 0,6$ mol → $m = 64,8$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Độ ngọt tăng dần: glucose, saccharose, fructose.","b) Glucose vừa có tính khử vừa có tính oxi hóa.","c) $0,1$ mol glucose + Na dư cho $5,6$ lít $\\mathrm{H_2}$ (đktc).","d) $0,1$ mol mắt xích tinh bột thủy phân cho $0,1$ mol glucose."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $16,2$ gam Ag (H = $90\\%$) tráng từ $15$ gam glucose.","b) Hỗn hợp glucose + saccharose (tỉ lệ mol $1:1$, $52,2$ gam) thủy phân rồi tráng bạc cho $64,8$ gam Ag.","c) $\\mathrm{Cu(OH)_2}$ ở nhiệt độ thường nhận biết alcohol đa chức.","d) Iodine nhận biết glucose."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: iodine nhận biết TINH BỘT.","points":1},{"type":"short","level":"VD","q":"Lên men $13,5$ gam glucose với hiệu suất $90\\%$. Khối lượng ethanol thu được là bao nhiêu gam?","answer":"6,21","explain":"$n_{glucose} = 0,075$ mol → lí thuyết $0,15$ mol ethanol $= 6,9$ gam; hiệu suất $90\\%$ → $6,21$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân $25,65$ gam saccharose ($M = 342$) với hiệu suất $80\\%$. Khối lượng glucose thu được là bao nhiêu gam?","answer":"10,8","explain":"$n_{saccharose} = 0,075$ mol → lí thuyết $0,075$ mol glucose $= 13,5$ gam; hiệu suất $80\\%$ → $10,8$ gam.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Trong các chất sau, chất có phân tử khối lớn nhất là:","options":["A. glucose ($M = 180$)","B. saccharose ($M = 342$)","C. fructose ($M = 180$)","D. mắt xích tinh bột ($M = 162$)"],"answer":"B","explain":"Saccharose ($M = 342$) có phân tử khối lớn nhất trong các chất đã cho.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm của phản ứng hydrogen hóa glucose là:","options":["A. ethanol","B. sorbitol","C. fructose","D. gluconic acid"],"answer":"B","explain":"Glucose + $\\mathrm{H_2}$ → sorbitol ($\\mathrm{C_6H_{14}O_6}$).","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol saccharose tác dụng với $\\mathrm{Cu(OH)_2}$ ở nhiệt độ thường, sau đó đun nóng. Hiện tượng cuối cùng là:","options":["A. kết tủa đỏ gạch","B. dung dịch xanh lam","C. kết tủa trắng","D. dung dịch không màu"],"answer":"B","explain":"Saccharose chỉ tạo phức xanh lam, không bị oxi hóa khi đun nóng.","points":0.25},{"type":"mcq","level":"TH","q":"Số mắt xích trong $16,2$ gam tinh bột là:","options":["A. $0,1$ mol","B. $0,2$ mol","C. $0,05$ mol","D. $1$ mol"],"answer":"A","explain":"$n = 16,2/162 = 0,1$ mol mắt xích.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $18$ gam fructose ($M = 180$) tác dụng với $\\mathrm{Cu(OH)_2}$ dư, đun nóng. Khối lượng $\\mathrm{Cu_2O}$ thu được là:","options":["A. $7,2$ gam","B. $14,4$ gam","C. $28,8$ gam","D. $21,6$ gam"],"answer":"B","explain":"$n_{fructose} = 0,1$ mol → $m = 14,4$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $m$ gam tinh bột lên men với hiệu suất chung $80\\%$. Thể tích $\\mathrm{CO_2}$ (đktc) thu được là $8,96$ lít. Giá trị của $m$ là:","options":["A. $16,2$ gam","B. $32,4$ gam","C. $20,25$ gam","D. $40,5$ gam"],"answer":"C","explain":"$n_{\\mathrm{CO_2}}$ thực $= 0,4$ mol → lí thuyết $= 0,5$ mol → $n_{glucose} = 0,25$ mol → $n_{mắt\\ xích} = 0,25$ mol → $m = 40,5$ gam. Kiểm tra: $0,25 \\times 162 = 40,5$. Hiệu suất chung $80\\%$ đã tính. Đáp án đúng: $40,5$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hydrogen hóa glucose cho sorbitol.","b) $0,1$ mol mắt xích tinh bột $= 16,2$ gam.","c) Đun nóng saccharose với $\\mathrm{Cu(OH)_2}$ vẫn xanh lam.","d) $18$ gam fructose + $\\mathrm{Cu(OH)_2}$/t° cho $14,4$ gam $\\mathrm{Cu_2O}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $8,96$ lít $\\mathrm{CO_2}$ (H = $80\\%$) lên men từ $40,5$ gam tinh bột.","b) Sorbitol có công thức $\\mathrm{C_6H_{14}O_6}$.","c) Fructose chuyển thành glucose trong môi trường kiềm.","d) Glucose không tác dụng với $\\mathrm{Cu(OH)_2}$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: glucose CÓ tác dụng (xanh lam ở nguội, đỏ gạch khi nóng).","points":1},{"type":"short","level":"VD","q":"Hydrogen hóa $27$ gam glucose ($M = 180$). Khối lượng sorbitol ($M = 182$) thu được là bao nhiêu gam?","answer":"27,3","explain":"$n = 0,15$ mol → $m = 27,3$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $34,2$ gam saccharose. Thể tích $\\mathrm{CO_2}$ (đktc) thu được là bao nhiêu lít?","answer":"26,88","explain":"$n_{saccharose} = 0,1$ mol → $n_{\\mathrm{CO_2}} = 1,2$ mol → $V = 26,88$ lít.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng?","options":["A. Monosaccharide bị thủy phân","B. Disaccharide không bị thủy phân","C. Polysaccharide thủy phân cho nhiều monosaccharide","D. Fructose là disaccharide"],"answer":"C","explain":"Polysaccharide thủy phân cho nhiều phân tử monosaccharide.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây sai?","options":["A. Glucose tráng bạc được","B. Saccharose tráng bạc được","C. Maltose tráng bạc được","D. Fructose tráng bạc được"],"answer":"B","explain":"Saccharose KHÔNG tráng bạc.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy chất nào sau đây đều tác dụng với $\\mathrm{Cu(OH)_2}$ ở nhiệt độ thường?","options":["A. glucose, fructose, saccharose, maltose","B. glucose, tinh bột","C. cellulose, saccharose","D. fructose, tinh bột"],"answer":"A","explain":"Cả 4 chất đều có nhiều nhóm $-OH$ kề nhau nên hòa tan $\\mathrm{Cu(OH)_2}$ (xanh lam).","points":0.25},{"type":"mcq","level":"TH","q":"Dãy chất nào sau đây đều có phản ứng tráng bạc?","options":["A. glucose, saccharose","B. fructose, maltose","C. tinh bột, cellulose","D. saccharose, tinh bột"],"answer":"B","explain":"Fructose và maltose đều tráng bạc được.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,1$ mol hỗn hợp glucose và fructose (tỉ lệ mol $1:1$) tác dụng với $\\mathrm{Cu(OH)_2}$ dư, đun nóng. Khối lượng $\\mathrm{Cu_2O}$ thu được là:","options":["A. $7,2$ gam","B. $14,4$ gam","C. $28,8$ gam","D. $21,6$ gam"],"answer":"B","explain":"Cả hai đều phản ứng tỉ lệ $1:1$ → $n_{\\mathrm{Cu_2O}} = 0,1$ mol → $m = 14,4$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Thủy phân $m$ gam saccharose với hiệu suất $75\\%$, rồi tráng bạc toàn bộ sản phẩm thu được $32,4$ gam Ag. Giá trị của $m$ là:","options":["A. $34,2$ gam","B. $25,65$ gam","C. $45,6$ gam","D. $51,3$ gam"],"answer":"A","explain":"$n_{Ag} = 0,3$ mol → $n_{saccharose}$ đã thủy phân $= 0,3/4 = 0,075$ mol → ban đầu $= 0,075/0,75 = 0,1$ mol → $m = 34,2$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 2):","statements":["a) Polysaccharide thủy phân cho nhiều monosaccharide.","b) Saccharose không tráng bạc.","c) Glucose, fructose, saccharose, maltose đều tác dụng với $\\mathrm{Cu(OH)_2}$ ở nhiệt độ thường.","d) Fructose và maltose đều tráng bạc được."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,1$ mol hỗn hợp glucose + fructose ($1:1$) + $\\mathrm{Cu(OH)_2}$/t° cho $14,4$ gam $\\mathrm{Cu_2O}$.","b) $32,4$ gam Ag tráng từ sản phẩm thủy phân $0,1$ mol saccharose (H = $75\\%$).","c) Tinh bột: amylose + amylopectin.","d) Cellulose: gốc $\\beta$-glucose."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Thủy phân $17,1$ gam maltose ($M = 342$) với hiệu suất $90\\%$. Khối lượng glucose thu được là bao nhiêu gam?","answer":"16,2","explain":"$n_{maltose} = 0,05$ mol → lí thuyết $0,1$ mol glucose $= 18$ gam; hiệu suất $90\\%$ → $16,2$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Lên men $48,6$ gam tinh bột với hiệu suất chung $80\\%$. Khối lượng ethanol thu được là bao nhiêu gam?","answer":"22,08","explain":"$n_{mắt\\ xích} = 48,6/162 = 0,3$ mol → $n_{glucose} = 0,3$ mol → lí thuyết $0,6$ mol ethanol $= 27,6$ gam; hiệu suất $80\\%$ → $22,08$ gam.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Trong các chất sau, chất ngọt nhất là:","options":["A. glucose","B. saccharose","C. fructose","D. maltose"],"answer":"C","explain":"Fructose ngọt nhất trong các loại đường thường gặp.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các chất sau, chất không tan trong nước là:","options":["A. glucose","B. saccharose","C. fructose","D. cellulose"],"answer":"D","explain":"Cellulose không tan trong nước.","points":0.25},{"type":"mcq","level":"TH","q":"Cho các chất: glucose (1), fructose (2), saccharose (3), maltose (4), tinh bột (5). Số chất hòa tan $\\mathrm{Cu(OH)_2}$ ở nhiệt độ thường là:","options":["A. 3","B. 4","C. 5","D. 2"],"answer":"B","explain":"Các chất (1), (2), (3), (4) đều có nhiều nhóm $-OH$; tinh bột không hòa tan $\\mathrm{Cu(OH)_2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho các chất: glucose (1), fructose (2), saccharose (3), maltose (4), tinh bột (5), cellulose (6). Số chất bị thủy phân là:","options":["A. 2","B. 3","C. 4","D. 5"],"answer":"C","explain":"Các chất (3), (4), (5), (6) bị thủy phân; (1), (2) là monosaccharide không bị thủy phân.","points":0.25},{"type":"mcq","level":"VD","q":"Đốt cháy hoàn toàn $9$ gam một monosaccharide X thu được $13,2$ gam $\\mathrm{CO_2}$. X là:","options":["A. glucose hoặc fructose","B. ribose","C. saccharose","D. deoxyribose"],"answer":"A","explain":"$n_{\\mathrm{CO_2}} = 0,3$ mol → $m_C = 3,6$ gam → $\\%C = 40\\%$ → $\\mathrm{C_6H_{12}O_6}$ (glucose hoặc fructose).","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm glucose và maltose. Thủy phân hoàn toàn $m$ gam X rồi lên men toàn bộ sản phẩm với hiệu suất $80\\%$. Khối lượng ethanol thu được là $36,8$ gam. Giá trị của $m$ là:","options":["A. $34,2$ gam","B. $52,2$ gam","C. $43,2$ gam","D. không xác định được"],"answer":"D","explain":"Gọi $n_{glu} = a$, $n_{mal} = b$: sau thủy phân glucose tổng $= a + 2b$; ethanol lí thuyết $= 2(a+2b)$; thực $= 0,8$ mol → $a + 2b = 0,5$. Một phương trình, hai ẩn — không xác định được $m$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp):","statements":["a) Fructose ngọt nhất.","b) Cellulose không tan trong nước.","c) 4 chất (glucose, fructose, saccharose, maltose) hòa tan $\\mathrm{Cu(OH)_2}$ ở nhiệt độ thường.","d) 4 chất (saccharose, maltose, tinh bột, cellulose) bị thủy phân."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đốt cháy $9$ gam $\\mathrm{C_6H_{12}O_6}$ cho $13,2$ gam $\\mathrm{CO_2}$.","b) Hỗn hợp glucose + maltose thủy phân rồi lên men không xác định được khối lượng từ lượng ethanol.","c) $\\%C$ trong glucose là $40\\%$.","d) Lên men $1$ mol glucose cho $2$ mol ethanol."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Tráng bạc $0,08$ mol fructose. Khối lượng Ag thu được là bao nhiêu gam?","answer":"17,28","explain":"$n_{Ag} = 0,16$ mol → $m = 17,28$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân $48,6$ gam tinh bột với hiệu suất $80\\%$. Khối lượng ethanol thu được khi lên men toàn bộ glucose (hiệu suất $90\\%$) là bao nhiêu gam?","answer":"19,872","explain":"$n_{mắt\\ xích} = 0,3$ mol → $n_{glucose}$ thực $= 0,24$ mol → lí thuyết $0,48$ mol ethanol; hiệu suất $90\\%$ → $0,432$ mol $= 19,872$ gam.","points":0.5}]}]}</script>
