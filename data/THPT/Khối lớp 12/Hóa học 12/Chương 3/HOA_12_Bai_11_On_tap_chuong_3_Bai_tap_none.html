ân.","points":1},{"type":"short","level":"VD","q":"Cho $8,9$ gam alanine tác dụng với HCl dư. Khối lượng muối thu được là bao nhiêu gam? ($M_{muối} = 125,5$)","answer":"12,55","explain":"$n = 0,1$ mol → $m = 12,55$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Trùng ngưng $15$ gam glycine. Khối lượng Gly-Gly tối đa thu được là bao nhiêu gam?","answer":"13,2","explain":"$n_{glycine} = 0,2$ mol → $n_{peptide} = 0,1$ mol → $m = 13,2$ gam.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Protein cho màu tím với thuốc thử nào?","options":["A. $\\mathrm{Cu(OH)_2}$/kiềm","B. nước bromine","C. quỳ tím","D. $\\mathrm{AgNO_3/NH_3}$"],"answer":"A","explain":"Phản ứng màu biuret: protein + $\\mathrm{Cu(OH)_2}$/kiềm → màu tím.","points":0.25},{"type":"mcq","level":"NB","q":"Enzyme có bản chất là:","options":["A. protein","B. lipid","C. carbohydrate","D. nucleic acid"],"answer":"A","explain":"Enzyme là protein có hoạt tính xúc tác sinh học.","points":0.25},{"type":"mcq","level":"TH","q":"Hiện tượng khi nhỏ $\\mathrm{Cu(OH)_2}$/NaOH vào lòng trắng trứng là:","options":["A. xuất hiện màu tím","B. xuất hiện kết tủa trắng","C. có khí thoát ra","D. không hiện tượng"],"answer":"A","explain":"Lòng trắng trứng (protein) cho màu tím biuret.","points":0.25},{"type":"mcq","level":"TH","q":"Enzyme bị mất hoạt tính khi:","options":["A. đun nóng","B. để ở nhiệt độ phòng","C. để trong tủ lạnh","D. hòa tan trong nước"],"answer":"A","explain":"Đun nóng làm enzyme biến tính → mất hoạt tính.","points":0.25},{"type":"mcq","level":"VD","q":"Một protein gồm $150$ gốc amino acid (1 chuỗi). Số liên kết peptide là:","options":["A. $149$","B. $150$","C. $151$","D. $148$"],"answer":"A","explain":"$150 - 1 = 149$.","points":0.25},{"type":"mcq","level":"VDC","q":"Thủy phân hoàn toàn $23,1$ gam tripeptide ($M = 231$) trong NaOH dư. Khối lượng muối ($M_{tb} = 130$) thu được là:","options":["A. $39$ gam","B. $23,1$ gam","C. $26,7$ gam","D. $19,5$ gam"],"answer":"A","explain" . $\\mathrm{NH_3}$","D. $\\mathrm{(CH_3)_2NH}$"],"answer":"A","explain":"Aniline có tính base yếu nhất do gốc phenyl hút electron.","points":0.25},{"type":"mcq","level":"TH","q":"Sắp xếp theo thứ tự tính base giảm dần:","options":["A. $\\mathrm{(CH_3)_2NH}$, $\\mathrm{CH_3NH_2}$, $\\mathrm{NH_3}$, $\\mathrm{C_6H_5NH_2}$","B. $\\mathrm{CH_3NH_2}$, $\\mathrm{(CH_3)_2NH}$, $\\mathrm{NH_3}$, $\\mathrm{C_6H_5NH_2}$","C. $\\mathrm{C_6H_5NH_2}$, $\\mathrm{NH_3}$, $\\mathrm{CH_3NH_2}$, $\\mathrm{(CH_3)_2NH}$","D. $\\mathrm{NH_3}$, $\\mathrm{CH_3NH_2}$, $\\mathrm{(CH_3)_2NH}$, $\\mathrm{C_6H_5NH_2}$"],"answer":"A","explain":"Tính base giảm dần: amine bậc 2 $\\gt$ bậc 1 $\\gt$ $\\mathrm{NH_3}$ $\\gt$ aniline.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân aniline có tính base yếu hơn $\\mathrm{NH_3}$ là:","options":["A. gốc phenyl hút electron","B. gốc phenyl đẩy electron","C. aniline có $M$ lớn","D. aniline ít tan"],"answer":"A","explain":"Gốc phenyl hút electron làm giảm mật độ electron trên N.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,1$ mol $\\mathrm{(CH_3)_2NH}$ ($M = 45$) tác dụng với $\\mathrm{H_2SO_4}$ loãng dư. Khối lượng muối thu được là:","options":["A. $9,4$ gam","B. $4,5$ gam","C. $18,8$ gam","D. $8,15$ gam"],"answer":"A","explain":"$n_{muối} = 0,05$ mol; $M_{muối} = 188$ → $m = 9,4$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm alanine và glutamic acid. Cho $23,6$ gam X tác dụng với NaOH dư thu được $28$ gam muối. Khối lượng của alanine trong X là: ($M_{Ala} = 89$, $M_{Glu} = 147$)","options":["A. $8,9$ gam","B. $14,7$ gam","C. $11,8$ gam","D. $4,45$ gam"],"answer":"A","explain":"Đặt $a$, $b$: $89a + 147b = 23,6$; $111a + 191b = 28$ → $a = b = 0,1$ → $m_{Ala} = 8,9$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\mathrm{(CH_3)_2NH}$ có tính base mạnh nhất trong dãy.","b) $\\mathrm{C_6H_5NH_2}$ có tính base yếu nhất trong dãy.","c) Gốc phenyl hút electron.","d) Gốc alkyl đẩy electron."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,1$ mol $\\mathrm{(CH_3)_2NH}$ + $\\mathrm{H_2SO_4}$ cho $9,4$ gam muối.","b) Hỗn hợp Ala + Glu ($23,6$ gam) + NaOH cho $28$ gam muối thì $m_{Ala} = 8,9$ gam.","c) Tính base: $\\mathrm{(CH_3)_2NH \\gt CH_3NH_2 \\gt NH_3 \\gt C_6H_5NH_2}$.","d) Aniline làm quỳ tím xanh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: aniline quá yếu.","points":1},{"type":"short","level":"VD","q":"Cho $0,1$ mol $\\mathrm{(CH_3)_3N}$ tác dụng với HCl dư. Khối lượng muối ($M = 95,5$) thu được là bao nhiêu gam?","answer":"9,55","explain":"$m = 0,1 \\times 95,5 = 9,55$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $15$ gam glycine ($\\mathrm{C_2H_5NO_2}$). Thể tích $\\mathrm{CO_2}$ (đktc) thu được là bao nhiêu lít?","answer":"8,96","explain":"$n_{glycine} = 0,2$ mol → $n_{\\mathrm{CO_2}} = 0,4$ mol → $V = 8,96$ lít.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Phản ứng đặc trưng để nhận biết aniline là:","options":["A. tác dụng với nước bromine cho kết tủa trắng","B. làm quỳ tím xanh","C. tác dụng với NaOH","D. cháy tạo $\\mathrm{CO_2}$"],"answer":"A","explain":"Aniline + nước bromine → kết tủa trắng 2,4,6-tribromoaniline.","points":0.25},{"type":"mcq","level":"NB","q":"Phản ứng đặc trưng để nhận biết protein là:","options":["A. màu tím với $\\mathrm{Cu(OH)_2}$/kiềm","B. kết tủa trắng với bromine","C. làm quỳ tím đỏ","D. sủi bọt với acid"],"answer":"A","explain":"Phản ứng màu biuret: protein + $\\mathrm{Cu(OH)_2}$/kiềm → màu tím.","points":0.25},{"type":"mcq","level":"TH","q":"Để phân biệt aniline và methylamine, dùng:","options":["A. nước bromine","B. quỳ tím","C. dung dịch HCl","D. dung dịch NaOH"],"answer":"A","explain":"Aniline cho kết tủa trắng với bromine; methylamine không.","points":0.25},{"type":"mcq","level":"TH","q":"Để phân biệt protein và amino acid, dùng:","options":["A. $\\mathrm{Cu(OH)_2}$/NaOH","B. nước bromine","C. quỳ tím","D. dung dịch HCl"],"answer":"A","explain":"Protein cho màu tím biuret; amino acid đơn không.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,2$ mol Gly-Gly ($M = 132$) tác dụng với HCl dư. Khối lượng muối ($M = 111,5$) thu được là:","options":["A. $44,6$ gam","B. $26,4$ gam","C. $22,3$ gam","D. $13,2$ gam"],"answer":"A","explain":"$0,2$ mol → $0,4$ mol muối → $m = 44,6$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm Gly-Gly và Ala-Ala (tỉ lệ mol $1:1$). Thủy phân hoàn toàn $29,2$ gam X. Tổng khối lượng amino acid thu được là:","options":["A. $32,8$ gam","B. $29,2$ gam","C. $65,6$ gam","D. $16,4$ gam"],"answer":"A","explain":"$n$ mỗi peptide $= 29,2/292 = 0,1$ mol → $0,2$ mol Gly ($15$ gam) + $0,2$ mol Ala ($17,8$ gam) $= 32,8$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Aniline + bromine cho kết tủa trắng.","b) Protein + $\\mathrm{Cu(OH)_2}$/kiềm cho màu tím.","c) Nước bromine phân biệt aniline và methylamine.","d) $\\mathrm{Cu(OH)_2}$/NaOH phân biệt protein và amino acid."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,2$ mol Gly-Gly + HCl cho $44,6$ gam muối.","b) $29,2$ gam hỗn hợp Gly-Gly + Ala-Ala ($1:1$) thủy phân cho $32,8$ gam amino acid.","c) $M_{Gly-Gly} = 132$, $M_{Ala-Ala} = 160$.","d) Đipeptide cho màu tím biuret."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đipeptide KHÔNG cho màu biuret.","points":1},{"type":"short","level":"VD","q":"Cho $0,3$ mol glycine tác dụng với NaOH dư. Khối lượng muối ($M = 97$) thu được là bao nhiêu gam?","answer":"29,1","explain":"$m = 0,3 \\times 97 = 29,1$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Một protein gồm $3$ chuỗi, mỗi chuỗi $60$ gốc amino acid. Số phân tử nước cần để thủy phân hoàn toàn $1$ mol protein là bao nhiêu?","answer":"177","explain":"Mỗi chuỗi $59$ liên kết → $3 \\times 59 = 177$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Trong các chất sau, chất vừa tác dụng với HCl vừa tác dụng với NaOH là:","options":["A. $\\mathrm{NH_2CH_2COOH}$","B. $\\mathrm{CH_3NH_2}$","C. $\\mathrm{C_6H_5NH_2}$","D. $\\mathrm{CH_3COOH}$"],"answer":"A","explain":"Amino acid có tính lưỡng tính.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các chất sau, chất chỉ tác dụng với HCl (không tác dụng với NaOH) là:","options":["A. $\\mathrm{CH_3NH_2}$","B. $\\mathrm{NH_2CH_2COOH}$","C. $\\mathrm{CH_3COOH}$","D. $\\mathrm{C_6H_5OH}$"],"answer":"A","explain":"Methylamine (base) chỉ tác dụng với acid.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol $\\mathrm{CH_3NH_2}$ và $0,1$ mol $\\mathrm{NH_2CH_2COOH}$ cùng tác dụng với HCl dư. Tổng khối lượng muối thu được là:","options":["A. $17,9$ gam","B. $6,75$ gam","C. $11,15$ gam","D. $35,8$ gam"],"answer":"A","explain":"$m = 0,1 \\times 67,5 + 0,1 \\times 111,5 = 17,9$ gam.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol $\\mathrm{C_6H_5NH_2}$ và $0,1$ mol $\\mathrm{NH_2CH_2COOH}$ cùng tác dụng với NaOH dư. Khối lượng muối thu được là:","options":["A. $9,7$ gam","B. $12,95$ gam","C. $19,4$ gam","D. $22,65$ gam"],"answer":"A","explain":"Chỉ glycine phản ứng: $m = 0,1 \\times 97 = 9,7$ gam.","points":0.25},{"type":"mcq","level":"VD","q":"Đốt cháy hoàn toàn $9,3$ gam aniline. Thể tích $\\mathrm{CO_2}$ (đktc) thu được là:","options":["A. $13,44$ lít","B. $6,72$ lít","C. $26,88$ lít","D. $2,24$ lít"],"answer":"A","explain":"$n_{aniline} = 0,1$ mol → $n_{\\mathrm{CO_2}} = 0,6$ mol → $V = 13,44$ lít.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm aniline và ethylamine (tỉ lệ mol $1:2$). Đốt cháy hoàn toàn $18,3$ gam X thu được $m$ gam $\\mathrm{CO_2}$. Giá trị của $m$ là: ($M_{aniline} = 93$, $M_{ethylamine} = 45$)","options":["A. $44$ gam","B. $30,8$ gam","C. $22$ gam","D. $35,2$ gam"],"answer":"A","explain":"$n_{aniline} = a$, $n_{ethylamine} = 2a$: $183a = 18,3$ → $a = 0,1$ → $n_{\\mathrm{CO_2}} = 1$ mol → $m = 44$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 3):","statements":["a) $\\mathrm{NH_2CH_2COOH}$ có tính lưỡng tính.","b) $\\mathrm{CH_3NH_2}$ chỉ tác dụng với acid.","c) $0,1$ mol $\\mathrm{CH_3NH_2}$ + $0,1$ mol glycine + HCl cho $17,9$ gam muối.","d) Aniline tác dụng với NaOH."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: aniline KHÔNG tác dụng với NaOH.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $9,3$ gam aniline cháy cho $13,44$ lít $\\mathrm{CO_2}$ (đktc).","b) $18,3$ gam hỗn hợp aniline + ethylamine ($1:2$) cháy cho $44$ gam $\\mathrm{CO_2}$.","c) Enzyme là protein có hoạt tính xúc tác.","d) Protein không bị thủy phân."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: protein BỊ thủy phân.","points":1},{"type":"short","level":"VD","q":"Cho $0,2$ mol alanine tác dụng với NaOH dư. Khối lượng muối ($M = 111$) thu được là bao nhiêu gam?","answer":"22,2","explain":"$m = 0,2 \\times 111 = 22,2$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $7,5$ gam glycine ($\\mathrm{C_2H_5NO_2}$). Thể tích $\\mathrm{N_2}$ (đktc) thu được là bao nhiêu lít?","answer":"1,12","explain":"$n_{glycine} = 0,1$ mol → $n_{\\mathrm{N_2}} = 0,05$ mol → $V = 1,12$ lít.","points":0.5}]}]}</script>
