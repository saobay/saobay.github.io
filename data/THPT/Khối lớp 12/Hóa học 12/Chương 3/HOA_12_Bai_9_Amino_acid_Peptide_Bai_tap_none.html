 $n_{glycine} = 0,1$ mol → $m = 7,5$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $7,5$ gam glycine ($\\mathrm{C_2H_5NO_2}$). Thể tích $\\mathrm{CO_2}$ (đktc) thu được là bao nhiêu lít?","answer":"4,48","explain":"$n_{glycine} = 0,1$ mol → $n_{\\mathrm{CO_2}} = 0,2$ mol → $V = 4,48$ lít.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Alanine có công thức là:","options":["A. $\\mathrm{NH_2CH_2COOH}$","B. $\\mathrm{CH_3CH(NH_2)COOH}$","C. $\\mathrm{C_6H_5NH_2}$","D. $\\mathrm{CH_3COOH}$"],"answer":"B","explain":"Alanine (Ala): $\\mathrm{CH_3CH(NH_2)COOH}$ ($M = 89$).","points":0.25},{"type":"mcq","level":"NB","q":"Bột ngọt (mì chính) là muối của:","options":["A. glycine","B. glutamic acid","C. alanine","D. lysine"],"answer":"B","explain":"Bột ngọt là monosodium glutamate — muối của glutamic acid.","points":0.25},{"type":"mcq","level":"TH","q":"Amino acid nào sau đây có 2 nhóm $-COOH$?","options":["A. glycine","B. alanine","C. glutamic acid","D. lysine"],"answer":"C","explain":"Glutamic acid: $\\mathrm{HOOCCH_2CH_2CH(NH_2)COOH}$ có 2 nhóm $-COOH$.","points":0.25},{"type":"mcq","level":"TH","q":"Amino acid nào sau đây có 2 nhóm $-\\mathrm{NH_2}$?","options":["A. glycine","B. lysine","C. alanine","D. glutamic acid"],"answer":"B","explain":"Lysine có 2 nhóm $-\\mathrm{NH_2}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,1$ mol glutamic acid ($\\mathrm{C_5H_9NO_4}$, $M = 147$) tác dụng với NaOH dư (tối đa). Số mol NaOH đã phản ứng là:","options":["A. $0,1$ mol","B. $0,2$ mol","C. $0,3$ mol","D. $0,05$ mol"],"answer":"B","explain":"Glutamic acid có 2 nhóm $-COOH$ → cần $0,2$ mol NaOH.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $0,1$ mol lysine ($\\mathrm{C_6H_{14}N_2O_2}$, $M = 146$) tác dụng với HCl dư (tối đa). Khối lượng muối thu được là:","options":["A. $21,9$ gam","B. $18,25$ gam","C. $14,6$ gam","D. $25,55$ gam"],"answer":"A","explain":"Lysine có 2 nhóm $-\\mathrm{NH_2}$ → cộng $2$ HCl: $M_ "points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân $18,9$ gam tripeptide Gly-Gly-Gly ($M = 189$). Khối lượng glycine thu được là:","options":["A. $22,5$ gam","B. $18,9$ gam","C. $11,25$ gam","D. $45$ gam"],"answer":"A","explain":"$n_{peptide} = 0,1$ mol → $n_{glycine} = 0,3$ mol → $m = 22,5$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm Gly-Gly và Ala-Ala có tỉ lệ mol $1:1$. Thủy phân hoàn toàn $29,2$ gam X. Tổng khối lượng amino acid thu được là:","options":["A. $32,8$ gam","B. $29,2$ gam","C. $65,6$ gam","D. $16,4$ gam"],"answer":"A","explain":"$n$ mỗi peptide $= 29,2/292 = 0,1$ mol → $0,2$ mol Gly ($15$ gam) + $0,2$ mol Ala ($17,8$ gam) $= 32,8$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\mathrm{CH_3CH(NH_2)COOH}$ là $\\alpha$-amino acid.","b) Đecapeptide có 10 gốc amino acid.","c) Đecapeptide mạch hở có 9 liên kết peptide.","d) Thủy phân $1$ mol đecapeptide cần $9$ mol nước."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $18,9$ gam Gly-Gly-Gly thủy phân cho $22,5$ gam glycine.","b) $29,2$ gam hỗn hợp Gly-Gly + Ala-Ala ($1:1$) thủy phân cho $32,8$ gam amino acid.","c) $M_{Gly-Gly-Gly} = 189$.","d) Trùng ngưng tách nước, thủy phân cộng nước."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Cho $0,3$ mol glycine tác dụng với NaOH dư. Khối lượng muối thu được là bao nhiêu gam? ($M_{muối} = 97$)","answer":"29,1","explain":"$m = 0,3 \\times 97 = 29,1$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $8,9$ gam alanine ($\\mathrm{C_3H_7NO_2}$). Thể tích $\\mathrm{CO_2}$ (đktc) thu được là bao nhiêu lít?","answer":"6,72","explain":"$n_{alanine} = 0,1$ mol → $n_{\\mathrm{CO_2}} = 0,3$ mol → $V = 6,72$ lít.","points":0.5}]},{"name":"Đề 10","questions rotein.","c) $0,1$ mol lysine + $0,1$ mol NaOH vừa đủ.","d) $0,1$ mol glutamic acid + $0,1$ mol HCl vừa đủ."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $14,6$ gam lysine + HCl (tỉ lệ $1:1$) cho $18,25$ gam muối.","b) Đốt cháy $16,4$ gam hỗn hợp Gly + Ala ($1:1$) cho $17,6$ gam $\\mathrm{CO_2}$.","c) Lysine có 1 nhóm $-COOH$.","d) Glutamic acid có 1 nhóm $-\\mathrm{NH_2}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Cho $0,2$ mol glutamic acid tác dụng với NaOH dư. Khối lượng muối ($M = 191$) thu được là bao nhiêu gam?","answer":"38,2","explain":"$m = 0,2 \\times 191 = 38,2$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân hoàn toàn $m$ gam đipeptide Ala-Gly ($M = 146$) thu được $17,8$ gam alanine. Giá trị của $m$ là bao nhiêu?","answer":"29,2","explain":"$n_{alanine} = 17,8/89 = 0,2$ mol → $n_{peptide} = 0,2$ mol → $m = 0,2 \\times 146 = 29,2$ gam.","points":0.5}]}]}</script>
