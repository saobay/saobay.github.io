<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Protein là:","options":["A. polypeptide cao phân tử","B. carbohydrate đơn giản","C. lipid đơn giản","D. amine đơn chức"],"answer":"A","explain":"Protein là những polypeptide cao phân tử ($M$ từ vài chục nghìn đến vài triệu).","points":0.25},{"type":"mcq","level":"NB","q":"Thuốc thử để nhận biết protein là:","options":["A. dung dịch $\\mathrm{AgNO_3/NH_3}$","B. $\\mathrm{Cu(OH)_2}$ trong môi trường kiềm","C. nước bromine","D. quỳ tím"],"answer":"B","explain":"Protein cho màu tím đặc trưng với $\\mathrm{Cu(OH)_2}$/kiềm (phản ứng màu biuret).","points":0.25},{"type":"mcq","level":"TH","q":"Hiện tượng khi đun nóng lòng trắng trứng là:","options":["A. đông tụ","B. tan ra","C. bay hơi","D. không đổi"],"answer":"A","explain":"Đun nóng làm protein đông tụ (vón cục).","points":0.25},{"type":"mcq","level":"TH","q":"Thủy phân hoàn toàn protein thu được:","options":["A. các $\\alpha$-amino acid","B. glucose","C. glycerol","D. các amine"],"answer":"A","explain":"Thủy phân protein cho các $\\alpha$-amino acid.","points":0.25},{"type":"mcq","level":"VD","q":"Một phân tử protein gồm $100$ gốc amino acid. Số liên kết peptide là:","options":["A. $100$","B. $99$","C. $101$","D. $98$"],"answer":"B","explain":"$n$ gốc mạch hở → $n - 1 = 99$ liên kết peptide.","points":0.25},{"type":"mcq","level":"VDC","q":"Để phân biệt albumin và glycine, thuốc thử tốt nhất là:","options":["A. $\\mathrm{Cu(OH)_2}$/NaOH","B. nước bromine","C. dung dịch HCl","D. quỳ tím"],"answer":"A","explain":"Albumin (protein) cho màu tím biuret; glycine (amino acid) không cho màu tím.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về protein:","statements":["a) Protein là polypeptide cao phân tử.","b) Protein cho màu tím với $\\mathrm{Cu(OH)_2}$/kiềm.","c) Đun nóng làm protein đông tụ.","d) Thủy phân protein cho amino acid."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Protein 100 gốc amino acid có 99 liên kết peptide.","b) Albumin cho phản ứng màu biuret.","c) Protein tan tốt trong nước ở mọi điều kiện.","d) Thủy phân protein cần enzyme hoặc acid/kiềm đun nóng."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: protein có thể bị đông tụ, không phải lúc nào cũng tan.","points":1},{"type":"short","level":"VD","q":"Một phân tử hemoglobin gồm $574$ gốc amino acid. Số liên kết peptide trong phân tử là bao nhiêu?","answer":"573","explain":"$574 - 1 = 573$.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân hoàn toàn $m$ gam một tripeptide ($M = 231$) thu được $26,7$ gam hỗn hợp 3 amino acid. Giá trị của $m$ là bao nhiêu?","answer":"23,1","explain":"$n_{peptide} = n$: $m_{amino\\ acid} = 231n + 36n = 267n = 26,7$ → $n = 0,1$ mol → $m = 23,1$ gam.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Enzyme là:","options":["A. protein có hoạt tính xúc tác sinh học","B. carbohydrate dự trữ năng lượng","C. lipid cấu tạo màng","D. muối vô cơ"],"answer":"A","explain":"Enzyme là những protein có hoạt tính xúc tác sinh học.","points":0.25},{"type":"mcq","level":"NB","q":"Đặc điểm nào sau đây đúng với enzyme?","options":["A. xúc tác mạnh, đặc hiệu cao","B. xúc tác yếu, không đặc hiệu","C. hoạt động ở nhiệt độ rất cao","D. không bị biến tính"],"answer":"A","explain":"Enzyme xúc tác mạnh, tính đặc hiệu cao, hoạt động trong điều kiện nhẹ.","points":0.25},{"type":"mcq","level":"TH","q":"Enzyme amylase xúc tác phản ứng:","options":["A. thủy phân tinh bột","B. thủy phân protein","C. thủy phân chất béo","D. lên men rượu"],"answer":"A","explain":"Amylase thủy phân tinh bột thành đường.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đun nóng, enzyme bị:","options":["A. biến tính, mất hoạt tính","B. tăng hoạt tính","C. không thay đổi","D. kết tinh"],"answer":"A","explain":"Đun nóng làm enzyme biến tính (protein đông tụ) → mất hoạt tính xúc tác.","points":0.25},{"type":"mcq","level":"VD","q":"Ứng dụng nào sau đây của enzyme?","options":["A. sản xuất bia, rượu","B. sản xuất thép","C. luyện kim","D. sản xuất phân đạm"],"answer":"A","explain":"Enzyme dùng trong sản xuất bia, rượu, phomat, bột giặt sinh học.","points":0.25},{"type":"mcq","level":"VDC","q":"Mỗi enzyme thường chỉ xúc tác một phản ứng nhất định, thể hiện:","options":["A. tính đặc hiệu","B. tính lưỡng tính","C. tính khử","D. tính oxi hóa"],"answer":"A","explain":"Đó là tính đặc hiệu của enzyme.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về enzyme:","statements":["a) Enzyme là protein có hoạt tính xúc tác.","b) Enzyme xúc tác mạnh, đặc hiệu cao.","c) Enzyme hoạt động trong điều kiện nhẹ.","d) Enzyme không bao giờ bị biến tính."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: enzyme DỄ bị biến tính khi đun nóng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Amylase thủy phân tinh bột.","b) Đun nóng làm enzyme mất hoạt tính.","c) Enzyme dùng trong sản xuất bia, rượu.","d) Mỗi enzyme xúc tác mọi phản ứng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mỗi enzyme chỉ xúc tác phản ứng nhất định (đặc hiệu).","points":1},{"type":"short","level":"VD","q":"Một phân tử protein gồm $51$ gốc amino acid (insulin). Số liên kết peptide là bao nhiêu?","answer":"50","explain":"$51 - 1 = 50$.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân hoàn toàn $18,9$ gam tripeptide Gly-Gly-Gly ($M = 189$) trong NaOH dư. Khối lượng muối thu được là bao nhiêu gam? ($M_{muối\\ Gly-Na} = 97$)","answer":"29,1","explain":"$n_{peptide} = 0,1$ mol → $0,3$ mol muối → $m = 0,3 \\times 97 = 29,1$ gam.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Cấu trúc bậc 1 của protein là:","options":["A. trình tự các gốc amino acid","B. cấu trúc xoắn $\\alpha$","C. cấu trúc không gian 3D","D. sự sắp xếp nhiều chuỗi"],"answer":"A","explain":"Bậc 1: trình tự sắp xếp các gốc amino acid trong chuỗi polypeptide.","points":0.25},{"type":"mcq","level":"NB","q":"Hemoglobin có cấu trúc bậc 4 vì:","options":["A. gồm 4 chuỗi polypeptide","B. gồm 4 gốc amino acid","C. có 4 liên kết peptide","D. có $M$ gấp 4 lần"],"answer":"A","explain":"Hemoglobin gồm 4 chuỗi polypeptide → cấu trúc bậc 4.","points":0.25},{"type":"mcq","level":"TH","q":"Phản ứng màu biuret giúp nhận biết:","options":["A. protein","B. glucose","C. tinh bột","D. chất béo"],"answer":"A","explain":"Phản ứng màu biuret (màu tím) đặc trưng cho protein (liên kết peptide).","points":0.25},{"type":"mcq","level":"TH","q":"Vết máu trên quần áo nên rửa bằng nước lạnh vì:","options":["A. nước nóng làm protein đông tụ, khó giặt","B. nước lạnh tẩy màu tốt hơn","C. nước nóng làm loang máu","D. protein tan tốt trong nước nóng"],"answer":"A","explain":"Nước nóng làm protein trong máu đông tụ → bám chặt vào vải.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,1$ mol tripeptide Ala-Ala-Ala ($M = 231$) thủy phân hoàn toàn. Số mol nước cần dùng là:","options":["A. $0,1$ mol","B. $0,2$ mol","C. $0,3$ mol","D. $0,4$ mol"],"answer":"B","explain":"Tripeptide có 2 liên kết peptide → cần $0,2$ mol nước.","points":0.25},{"type":"mcq","level":"VDC","q":"Khối lượng phân tử của một protein ước tính $60000$ đvC, trung bình mỗi gốc amino acid $120$ đvC (sau khi trừ nước). Số gốc amino acid xấp xỉ là:","options":["A. $500$","B. $600$","C. $400$","D. $1000$"],"answer":"A","explain":"$60000/120 = 500$ gốc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cấu trúc bậc 1 là trình tự các gốc amino acid.","b) Hemoglobin có 4 chuỗi polypeptide.","c) Phản ứng biuret nhận biết protein.","d) Nên rửa vết máu bằng nước nóng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nên rửa bằng NƯỚC LẠNH.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,1$ mol tripeptide thủy phân cần $0,2$ mol nước.","b) Protein $M = 60000$ (mỗi gốc $120$) có khoảng $500$ gốc.","c) Cấu trúc bậc 2 là xoắn $\\alpha$ hoặc gấp $\\beta$.","d) Protein không có cấu trúc không gian."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: protein có cấu trúc bậc 3 (không gian 3D).","points":1},{"type":"short","level":"VD","q":"Một đoạn polypeptide gồm $200$ gốc amino acid. Số phân tử nước cần để thủy phân hoàn toàn là bao nhiêu?","answer":"199","explain":"$200 - 1 = 199$ liên kết peptide → cần $199$ nước.","points":0.5},{"type":"short","level":"VDC","q":"Cho $23,1$ gam tripeptide Gly-Ala-Ala ($M = 231$) thủy phân hoàn toàn. Tổng khối lượng amino acid thu được là bao nhiêu gam?","answer":"26,7","explain":"$n_{peptide} = 0,1$ mol → $m = 23,1 + 0,2 \\times 18 = 26,7$ gam.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Vai trò nào sau đây thuộc về protein?","options":["A. cấu tạo tế bào, enzyme, hormone","B. dự trữ năng lượng chính","C. hòa tan vitamin","D. dẫn truyền xung thần kinh"],"answer":"A","explain":"Protein cấu tạo tế bào, làm enzyme, hormone, vận chuyển $\\mathrm{O_2}$.","points":0.25},{"type":"mcq","level":"NB","q":"Insulin là:","options":["A. một loại protein (hormone)","B. một loại đường","C. một loại lipid","D. một loại vitamin"],"answer":"A","explain":"Insulin là protein có vai trò hormone điều hòa đường huyết.","points":0.25},{"type":"mcq","level":"TH","q":"Protein bị đông tụ khi:","options":["A. đun nóng","B. để trong tủ lạnh","C. hòa tan trong nước","D. để khô"],"answer":"A","explain":"Đun nóng (hoặc acid, kiềm, muối kim loại nặng) làm protein đông tụ.","points":0.25},{"type":"mcq","level":"TH","q":"Enzyme mất hoạt tính khi đun nóng vì:","options":["A. protein bị biến tính","B. enzyme bay hơi","C. enzyme kết tinh","D. enzyme bị oxi hóa"],"answer":"A","explain":"Đun nóng làm protein (enzyme) biến tính → mất hoạt tính xúc tác.","points":0.25},{"type":"mcq","level":"VD","q":"Số liên kết peptide trong phân tử protein gồm $2$ chuỗi, mỗi chuỗi $50$ gốc amino acid là:","options":["A. $98$","B. $100$","C. $99$","D. $49$"],"answer":"A","explain":"Mỗi chuỗi $50$ gốc → $49$ liên kết; 2 chuỗi → $98$ liên kết.","points":0.25},{"type":"mcq","level":"VDC","q":"Thủy phân hoàn toàn $1$ mol protein gồm $2$ chuỗi (mỗi chuỗi $50$ gốc) cần số mol nước là:","options":["A. $98$ mol","B. $100$ mol","C. $99$ mol","D. $50$ mol"],"answer":"A","explain":"Cần cắt $98$ liên kết peptide → $98$ mol nước.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Protein làm enzyme, hormone.","b) Insulin là protein.","c) Đun nóng làm protein đông tụ.","d) Enzyme mất hoạt tính khi đun nóng."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Protein 2 chuỗi (mỗi chuỗi 50 gốc) có 98 liên kết peptide.","b) Thủy phân protein đó cần 98 mol nước.","c) Enzyme là carbohydrate.","d) Protein cấu tạo nên tế bào."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: enzyme là PROTEIN.","points":1},{"type":"short","level":"VD","q":"Một phân tử protein gồm $3$ chuỗi, mỗi chuỗi $100$ gốc amino acid. Tổng số liên kết peptide là bao nhiêu?","answer":"297","explain":"Mỗi chuỗi $99$ liên kết → $3 \\times 99 = 297$.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân hoàn toàn $13,2$ gam đipeptide Gly-Gly ($M = 132$) trong HCl dư. Khối lượng muối ($M = 111,5$) thu được là bao nhiêu gam? (biết mỗi glycine cộng 1 HCl)","answer":"22,3","explain":"$n_{peptide} = 13,2/132 = 0,1$ mol → $0,2$ mol muối → $m = 0,2 \\times 111,5 = 22,3$ gam.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Cấu trúc bậc 3 của protein là:","options":["A. cấu trúc không gian ba chiều","B. trình tự amino acid","C. cấu trúc xoắn $\\alpha$","D. nhiều chuỗi polypeptide"],"answer":"A","explain":"Bậc 3: cấu trúc không gian ba chiều của chuỗi polypeptide.","points":0.25},{"type":"mcq","level":"NB","q":"Bột giặt sinh học chứa:","options":["A. enzyme","B. acid mạnh","C. kiềm mạnh","D. chất tẩy trắng"],"answer":"A","explain":"Bột giặt sinh học chứa enzyme phân hủy vết bẩn protein.","points":0.25},{"type":"mcq","level":"TH","q":"Tính chất nào sau đây KHÔNG phải của protein?","options":["A. bị đông tụ khi đun nóng","B. cho phản ứng màu biuret","C. bị thủy phân","D. cháy tạo khí $\\mathrm{CO_2}$ duy nhất"],"answer":"D","explain":"Protein cháy tạo $\\mathrm{CO_2}$, $\\mathrm{H_2O}$, $\\mathrm{N_2}$ (chứa N) — không chỉ $\\mathrm{CO_2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Tính chất nào sau đây KHÔNG phải của enzyme?","options":["A. xúc tác mạnh","B. đặc hiệu cao","C. bền với nhiệt độ cao","D. hoạt động trong điều kiện nhẹ"],"answer":"C","explain":"Enzyme dễ bị biến tính ở nhiệt độ cao.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,2$ mol đipeptide Gly-Ala ($M = 146$) thủy phân hoàn toàn. Khối lượng nước cần dùng là:","options":["A. $3,6$ gam","B. $7,2$ gam","C. $1,8$ gam","D. $5,4$ gam"],"answer":"A","explain":"Mỗi mol đipeptide cần 1 mol nước → $n = 0,2$ mol → $m = 3,6$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Một protein có $M = 45000$, mỗi gốc amino acid trung bình $110$ đvC (đã trừ nước). Số liên kết peptide xấp xỉ là:","options":["A. $409$","B. $410$","C. $408$","D. $450$"],"answer":"C","explain":"Số gốc $\\approx 45000/110 = 409$ → liên kết peptide $\\approx 408$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bậc 3 là cấu trúc không gian 3D.","b) Bột giặt sinh học chứa enzyme.","c) Enzyme bền với nhiệt độ cao.","d) Protein cháy tạo $\\mathrm{N_2}$."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: enzyme DỄ biến tính ở nhiệt độ cao.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,2$ mol Gly-Ala thủy phân cần $3,6$ gam nước.","b) Protein $M = 45000$ (mỗi gốc $110$) có khoảng $408$ liên kết peptide.","c) Protein cho màu tím biuret.","d) Enzyme xúc tác mọi phản ứng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: enzyme có tính đặc hiệu.","points":1},{"type":"short","level":"VD","q":"Thủy phân $14,6$ gam đipeptide Gly-Ala ($M = 146$). Khối lượng nước cần dùng là bao nhiêu gam?","answer":"1,8","explain":"$n_{peptide} = 0,1$ mol → $n_{\\mathrm{H_2O}} = 0,1$ mol → $m = 1,8$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Một đoạn protein gồm $1000$ gốc amino acid. Số phân tử nước cần để thủy phân hoàn toàn là bao nhiêu?","answer":"999","explain":"$1000 - 1 = 999$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Liên kết duy trì cấu trúc bậc 2 của protein chủ yếu là:","options":["A. liên kết hydrogen","B. liên kết ion","C. liên kết cộng hóa trị","D. liên kết kim loại"],"answer":"A","explain":"Cấu trúc bậc 2 (xoắn $\\alpha$, gấp $\\beta$) duy trì bởi liên kết hydrogen.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm cuối cùng của quá trình tiêu hóa protein trong cơ thể là:","options":["A. amino acid","B. glucose","C. acid béo","D. glycerol"],"answer":"A","explain":"Protein được enzyme tiêu hóa thủy phân thành amino acid để hấp thụ.","points":0.25},{"type":"mcq","level":"TH","q":"Phản ứng của protein với $\\mathrm{Cu(OH)_2}$/kiềm cho màu:","options":["A. tím","B. xanh","C. đỏ","D. vàng"],"answer":"A","explain":"Màu tím đặc trưng (phản ứng biuret).","points":0.25},{"type":"mcq","level":"TH","q":"Để nhận biết lòng trắng trứng, dùng:","options":["A. $\\mathrm{Cu(OH)_2}$/NaOH","B. nước bromine","C. quỳ tím","D. dung dịch $\\mathrm{AgNO_3}$"],"answer":"A","explain":"Lòng trắng trứng (albumin) cho màu tím biuret.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,05$ mol một tetrapeptide ($M = 302$) thủy phân hoàn toàn. Số mol amino acid thu được là:","options":["A. $0,05$ mol","B. $0,1$ mol","C. $0,15$ mol","D. $0,2$ mol"],"answer":"D","explain":"Tetrapeptide → 4 amino acid → $0,05 \\times 4 = 0,2$ mol.","points":0.25},{"type":"mcq","level":"VDC","q":"Thủy phân hoàn toàn $30,2$ gam tetrapeptide ($M = 302$) trong NaOH dư. Khối lượng muối thu được là bao nhiêu gam? (biết trung bình $M_{muối} = 116$)","options":["A. $46,4$ gam","B. $30,2$ gam","C. $23,2$ gam","D. $58$ gam"],"answer":"A","explain":"$n_{peptide} = 0,1$ mol → $0,4$ mol muối → $m = 0,4 \\times 116 = 46,4$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cấu trúc bậc 2 duy trì bởi liên kết hydrogen.","b) Tiêu hóa protein cho amino acid.","c) Protein + $\\mathrm{Cu(OH)_2}$/kiềm cho màu tím.","d) Lòng trắng trứng cho phản ứng biuret."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,05$ mol tetrapeptide thủy phân cho $0,2$ mol amino acid.","b) $30,2$ gam tetrapeptide + NaOH cho $46,4$ gam muối.","c) Enzyme là protein.","d) Protein không bị thủy phân bởi enzyme."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: enzyme tiêu hóa thủy phân protein.","points":1},{"type":"short","level":"VD","q":"Cho $0,1$ mol pentapeptide ($M = 373$) thủy phân hoàn toàn. Số mol nước cần dùng là bao nhiêu?","answer":"0,4","explain":"Pentapeptide có 4 liên kết → $0,1 \\times 4 = 0,4$ mol.","points":0.5},{"type":"short","level":"VDC","q":"Một protein có $M = 66000$ (hemoglobin), mỗi gốc amino acid trung bình $110$ đvC. Số gốc amino acid xấp xỉ là bao nhiêu?","answer":"600","explain":"$66000/110 = 600$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng về protein?","options":["A. protein là polypeptide cao phân tử","B. protein là monosaccharide","C. protein không chứa nitrogen","D. protein là chất khí"],"answer":"A","explain":"Protein là polypeptide cao phân tử chứa nitrogen.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây sai về enzyme?","options":["A. enzyme là protein","B. enzyme xúc tác mạnh","C. enzyme bền ở $100^\\circ\\mathrm{C}$","D. enzyme có tính đặc hiệu"],"answer":"C","explain":"Enzyme dễ bị biến tính ở nhiệt độ cao.","points":0.25},{"type":"mcq","level":"TH","q":"Chất nào sau đây cho phản ứng màu biuret?","options":["A. albumin","B. glucose","C. saccharose","D. ethylamine"],"answer":"A","explain":"Albumin (protein) cho màu tím biuret.","points":0.25},{"type":"mcq","level":"TH","q":"Chất nào sau đây KHÔNG cho phản ứng màu biuret?","options":["A. Gly-Gly-Gly","B. protein","C. Gly-Gly","D. glycine"],"answer":"D","explain":"Glycine (amino acid đơn) không cho màu biuret; đipeptide cũng không (cần từ 2 liên kết peptide).","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân hoàn toàn $0,2$ mol đipeptide ($M = 146$) cần số mol HCl (để tạo muối, mỗi amino acid cộng 1 HCl) là:","options":["A. $0,2$ mol","B. $0,4$ mol","C. $0,1$ mol","D. $0,6$ mol"],"answer":"B","explain":"$0,2$ mol đipeptide → $0,4$ mol amino acid → cần $0,4$ mol HCl.","points":0.25},{"type":"mcq","level":"VDC","q":"Một đoạn DNA mã hóa protein gồm $150$ gốc amino acid. Số liên kết peptide trong protein (chuỗi đơn) là:","options":["A. $150$","B. $149$","C. $148$","D. $151$"],"answer":"B","explain":"$150 - 1 = 149$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Protein là polypeptide cao phân tử.","b) Enzyme dễ biến tính ở nhiệt độ cao.","c) Albumin cho phản ứng màu biuret.","d) Glycine cho phản ứng màu biuret."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: amino acid đơn KHÔNG cho màu biuret.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,2$ mol đipeptide thủy phân trong HCl cần $0,4$ mol HCl để tạo muối.","b) Protein 150 gốc (chuỗi đơn) có 149 liên kết peptide.","c) Đipeptide Gly-Gly cho màu tím biuret.","d) Tripeptide cho màu tím biuret."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: đipeptide chỉ có 1 liên kết peptide, KHÔNG cho màu biuret.","points":1},{"type":"short","level":"VD","q":"Thủy phân hoàn toàn $m$ gam đipeptide ($M = 132$) thu được $15$ gam glycine. Giá trị của $m$ là bao nhiêu?","answer":"13,2","explain":"$n_{glycine} = 0,2$ mol → $n_{peptide} = 0,1$ mol → $m = 13,2$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $0,1$ mol tetrapeptide ($M = 302$) tác dụng với NaOH dư. Khối lượng muối trung bình ($M = 116$) thu được là bao nhiêu gam?","answer":"46,4","explain":"$0,1$ mol → $0,4$ mol muối → $m = 46,4$ gam.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Ứng dụng của enzyme trong đời sống là:","options":["A. sản xuất bia, rượu, phomat","B. sản xuất gang thép","C. sản xuất xi măng","D. luyện nhôm"],"answer":"A","explain":"Enzyme dùng trong công nghiệp thực phẩm: bia, rượu, phomat, bánh mì.","points":0.25},{"type":"mcq","level":"NB","q":"Enzyme trong bột giặt sinh học có tác dụng:","options":["A. phân hủy vết bẩn protein","B. tẩy trắng vải","C. làm mềm vải","D. tạo bọt"],"answer":"A","explain":"Enzyme (protease) phân hủy vết bẩn protein (máu, trứng, sữa).","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không dùng nước sôi để pha bột giặt sinh học?","options":["A. enzyme bị biến tính","B. bột giặt bay hơi","C. nước sôi làm cứng vải","D. enzyme tan kém"],"answer":"A","explain":"Nước sôi làm enzyme biến tính → mất tác dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Sữa đậu nành đun sôi bị vón cục vì:","options":["A. protein đông tụ","B. đường cháy","C. chất béo tách lớp","D. nước bay hơi"],"answer":"A","explain":"Đun nóng làm protein trong sữa đậu nành đông tụ.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $18,9$ gam tripeptide ($M = 189$) thủy phân trong HCl dư. Khối lượng muối ($M_{tb} = 125,5$) thu được là:","options":["A. $37,65$ gam","B. $18,9$ gam","C. $25,1$ gam","D. $12,55$ gam"],"answer":"A","explain":"$n_{peptide} = 0,1$ mol → $0,3$ mol muối → $m = 0,3 \\times 125,5 = 37,65$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Protein X có $M = 33000$, gồm 1 chuỗi. Số phân tử nước cần để thủy phân hoàn toàn $1$ mol X (mỗi gốc $110$ đvC) là:","options":["A. $300$ mol","B. $299$ mol","C. $301$ mol","D. $150$ mol"],"answer":"B","explain":"Số gốc $= 33000/110 = 300$ → cần $299$ mol nước.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Enzyme dùng sản xuất bia, rượu.","b) Bột giặt sinh học chứa enzyme.","c) Nước sôi làm enzyme biến tính.","d) Đun sôi làm protein sữa đậu nành đông tụ."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $18,9$ gam tripeptide + HCl cho $37,65$ gam muối.","b) Protein $M = 33000$ (300 gốc) thủy phân cần $299$ mol nước.","c) Enzyme hoạt động tốt ở nhiệt độ rất cao.","d) Protein đông tụ khi đun nóng."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: enzyme hoạt động trong điều kiện nhẹ.","points":1},{"type":"short","level":"VD","q":"Thủy phân $23,1$ gam tripeptide ($M = 231$) trong NaOH dư. Khối lượng muối ($M_{tb} = 130$) thu được là bao nhiêu gam?","answer":"39","explain":"$n_{peptide} = 0,1$ mol → $0,3$ mol muối → $m = 39$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Một protein gồm $4$ chuỗi, mỗi chuỗi $125$ gốc amino acid. Tổng số liên kết peptide là bao nhiêu?","answer":"496","explain":"Mỗi chuỗi $124$ liên kết → $4 \\times 124 = 496$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Trong các chất sau, chất thuộc loại protein là:","options":["A. keratin (tóc)","B. glucose","C. tristearin","D. cellulose"],"answer":"A","explain":"Keratin trong tóc, móng là protein.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các chất sau, chất KHÔNG phải protein là:","options":["A. albumin","B. hemoglobin","C. glucose","D. insulin"],"answer":"C","explain":"Glucose là carbohydrate, không phải protein.","points":0.25},{"type":"mcq","level":"TH","q":"Chất nào sau đây là enzyme?","options":["A. amylase","B. glucose","C. saccharose","D. glycerol"],"answer":"A","explain":"Amylase là enzyme thủy phân tinh bột.","points":0.25},{"type":"mcq","level":"TH","q":"Chất nào sau đây cho màu tím với $\\mathrm{Cu(OH)_2}$/kiềm?","options":["A. lòng trắng trứng","B. dung dịch glucose","C. dung dịch saccharose","D. aniline"],"answer":"A","explain":"Lòng trắng trứng (protein) cho màu tím biuret.","points":0.25},{"type":"mcq","level":"VD","q":"Thủy phân hoàn toàn $0,15$ mol pentapeptide ($M = 373$) trong HCl dư. Số mol muối amino acid thu được là:","options":["A. $0,15$ mol","B. $0,3$ mol","C. $0,6$ mol","D. $0,75$ mol"],"answer":"D","explain":"Pentapeptide → 5 amino acid → $0,15 \\times 5 = 0,75$ mol.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $m$ gam protein (1 chuỗi, $200$ gốc) thủy phân hoàn toàn cần $3,582$ gam nước. Giá trị của $m$ là bao nhiêu? (biết $M$ trung bình mỗi gốc sau trừ nước $= 110$)","options":["A. $22000$ gam","B. $22$ gam","C. $2,2$ gam","D. $220$ gam"],"answer":"B","explain":"$n_{\\mathrm{H_2O}} = 3,582/18 = 0,199$ mol → $n_{protein} = 0,199/199 = 0,001$ mol → $m = 0,001 \\times 22000 = 22$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Keratin trong tóc là protein.","b) Amylase là enzyme.","c) Lòng trắng trứng cho màu tím biuret.","d) Glucose là protein."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: glucose là carbohydrate.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,15$ mol pentapeptide thủy phân cho $0,75$ mol amino acid.","b) $22$ gam protein (200 gốc, $M = 22000$) thủy phân cần $3,582$ gam nước.","c) Enzyme là protein.","d) Protein không chứa nitrogen."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: protein CHỨA nitrogen.","points":1},{"type":"short","level":"VD","q":"Một chuỗi polypeptide có $99$ liên kết peptide. Số gốc amino acid là bao nhiêu?","answer":"100","explain":"$99 + 1 = 100$.","points":0.5},{"type":"short","level":"VDC","q":"Thủy phân $m$ gam đipeptide ($M = 160$) thu được $35,6$ gam hỗn hợp 2 amino acid. Giá trị của $m$ là bao nhiêu?","answer":"32","explain":"$m_{aa} = m + 18n$; $n = m/160$ → $35,6 = m + 18m/160 = 1,1125m$ → $m = 32$ gam.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tổng hợp kiến thức chương 3: chất nào sau đây là amine?","options":["A. $\\mathrm{CH_3NH_2}$","B. $\\mathrm{NH_2CH_2COOH}$","C. $\\mathrm{CH_3COOH}$","D. $\\mathrm{C_6H_5OH}$"],"answer":"A","explain":"$\\mathrm{CH_3NH_2}$ là amine; B là amino acid.","points":0.25},{"type":"mcq","level":"NB","q":"Chất nào sau đây là amino acid?","options":["A. $\\mathrm{NH_2CH_2COOH}$","B. $\\mathrm{CH_3NH_2}$","C. $\\mathrm{C_6H_5NH_2}$","D. $\\mathrm{CH_3COONH_4}$"],"answer":"A","explain":"Glycine là amino acid.","points":0.25},{"type":"mcq","level":"TH","q":"Chất nào sau đây vừa tác dụng với HCl vừa tác dụng với NaOH?","options":["A. $\\mathrm{NH_2CH_2COOH}$","B. $\\mathrm{CH_3NH_2}$","C. $\\mathrm{C_6H_5NH_2}$","D. $\\mathrm{CH_3COOH}$"],"answer":"A","explain":"Amino acid có tính lưỡng tính.","points":0.25},{"type":"mcq","level":"TH","q":"Chất nào sau đây cho kết tủa trắng với nước bromine?","options":["A. aniline","B. methylamine","C. glycine","D. alanine"],"answer":"A","explain":"Aniline + bromine → kết tủa trắng tribromoaniline.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,1$ mol Gly-Gly ($M = 132$) tác dụng với NaOH dư. Khối lượng muối thu được là:","options":["A. $19,4$ gam","B. $13,2$ gam","C. $9,7$ gam","D. $29,1$ gam"],"answer":"A","explain":"$0,1$ mol → $0,2$ mol muối Gly-Na ($M = 97$) → $m = 19,4$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm aniline và glycine. Cho $16,8$ gam X tác dụng với HCl dư thu được $23,05$ gam muối. Phần trăm khối lượng của aniline trong X là: ($M_{aniline} = 93$, $M_{Gly} = 75$)","options":["A. $55,4\\%$","B. $44,6\\%$","C. $50\\%$","D. $27,7\\%$"],"answer":"A","explain":"Đặt $a$, $b$ mol: $93a + 75b = 16,8$; muối: $129,5a + 111,5b = 23,05$ → $a = b = 0,1$ → $m_{aniline} = 9,3$ gam → $55,4\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 3):","statements":["a) $\\mathrm{CH_3NH_2}$ là amine.","b) $\\mathrm{NH_2CH_2COOH}$ là amino acid.","c) Aniline + bromine cho kết tủa trắng.","d) Protein là carbohydrate."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: protein là POLYPEPTIDE.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,1$ mol Gly-Gly + NaOH cho $19,4$ gam muối.","b) Hỗn hợp aniline + glycine ($16,8$ gam) + HCl cho $23,05$ gam muối thì $m_{aniline} = 9,3$ gam.","c) Enzyme có tính đặc hiệu.","d) Amino acid không có tính lưỡng tính."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: amino acid CÓ tính lưỡng tính.","points":1},{"type":"short","level":"VD","q":"Cho $9,3$ gam aniline tác dụng với nước bromine dư. Khối lượng kết tủa thu được là bao nhiêu gam?","answer":"33","explain":"$n = 0,1$ mol → $m = 33$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $7,5$ gam glycine. Thể tích $\\mathrm{N_2}$ (đktc) thu được là bao nhiêu lít?","answer":"1,12","explain":"$n_{glycine} = 0,1$ mol → $n_{\\mathrm{N_2}} = 0,05$ mol → $V = 1,12$ lít.","points":0.5}]}]}</script>
