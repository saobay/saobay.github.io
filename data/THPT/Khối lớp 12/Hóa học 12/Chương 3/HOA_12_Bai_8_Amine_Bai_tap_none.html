{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Amine được tạo thành khi:","options":["A. thay H của $\\mathrm{NH_3}$ bằng gốc hydrocarbon","B. thay H của $\\mathrm{H_2O}$ bằng gốc hydrocarbon","C. thay $-OH$ của acid bằng $-OR'$","D. cộng $\\mathrm{NH_3}$ vào alkene"],"answer":"A","explain":"Thay một hay nhiều nguyên tử H trong $\\mathrm{NH_3}$ bằng gốc hydrocarbon → amine.","points":0.25},{"type":"mcq","level":"NB","q":"$\\mathrm{CH_3NH_2}$ có tên gọi là:","options":["A. ethylamine","B. methylamine","C. aniline","D. dimethylamine"],"answer":"B","explain":"$\\mathrm{CH_3NH_2}$: methylamine.","points":0.25},{"type":"mcq","level":"TH","q":"$\\mathrm{CH_3NHCH_3}$ là amine bậc:","options":["A. 1","B. 2","C. 3","D. 4"],"answer":"B","explain":"Có 2 gốc $\\mathrm{CH_3}$ gắn vào N → amine bậc 2.","points":0.25},{"type":"mcq","level":"TH","q":"Sắp xếp theo tính base tăng dần:","options":["A. aniline, $\\mathrm{NH_3}$, methylamine","B. methylamine, $\\mathrm{NH_3}$, aniline","C. $\\mathrm{NH_3}$, aniline, methylamine","D. aniline, methylamine, $\\mathrm{NH_3}$"],"answer":"A","explain":"Tính base tăng dần: aniline, $\\mathrm{NH_3}$, alkyl amine (gốc alkyl đẩy e, gốc phenyl hút e).","points":0.25},{"type":"mcq","level":"VD","q":"Cho $3,1$ gam methylamine ($M = 31$) tác dụng vừa đủ với HCl. Khối lượng muối thu được là:","options":["A. $6,75$ gam","B. $3,65$ gam","C. $13,5$ gam","D. $6,05$ gam"],"answer":"A","explain":"$n = 0,1$ mol → $m_{\\mathrm{CH_3NH_3Cl}} = 0,1 \\times 67,5 = 6,75$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $9,3$ gam aniline ($M = 93$) tác dụng với nước bromine dư. Khối lượng kết tủa thu được là:","options":["A. $33$ gam","B. $16,5$ gam","C. $49,5$ gam","D. $9,9$ gam"],"answer":"A","explain":"$n_{aniline} = 0,1$ mol → $m_{\\mathrm{C_6H_2Br_3NH_2}} = 0,1 \\times 330 = 33$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về amine:","statements":["a) Amine tạo thành khi thay H của $\\mathrm{NH_3}$ bằng gốc hydrocarbon.","b) $\\mathrm{CH_3NH_2}$ là methylamine.","c) $\\mathrm{CH_3NHCH_3}$ là amine bậc 2.","d) $\\mathrm{C_6H_5NH_2}$ là alkyl amine."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: $\\mathrm{C_6H_5NH_2}$ (aniline) là ARYL amine.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tính base tăng dần: aniline, $\\mathrm{NH_3}$, methylamine.","b) $3,1$ gam methylamine + HCl vừa đủ cho $6,75$ gam muối.","c) $9,3$ gam aniline + bromine dư cho $33$ gam kết tủa trắng.","d) Aniline làm quỳ tím chuyển xanh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: aniline có tính base quá yếu, KHÔNG đổi màu quỳ tím.","points":1},{"type":"short","level":"VD","q":"Cho $4,5$ gam ethylamine ($\\mathrm{C_2H_5NH_2}$, $M = 45$) tác dụng với HCl dư. Khối lượng muối $\\mathrm{C_2H_5NH_3Cl}$ ($M = 81,5$) thu được là bao nhiêu gam?","answer":"8,15","explain":"$n = 0,1$ mol → $m = 0,1 \\times 81,5 = 8,15$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $0,1$ mol aniline tác dụng với bromine dư. Khối lượng bromine đã phản ứng là bao nhiêu gam? ($M_{\\mathrm{Br_2}} = 160$)","answer":"48","explain":"$n_{\\mathrm{Br_2}} = 3 \\times 0,1 = 0,3$ mol → $m = 48$ gam.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Aniline có công thức là:","options":["A. $\\mathrm{C_6H_5NH_2}$","B. $\\mathrm{CH_3NH_2}$","C. $\\mathrm{C_2H_5NH_2}$","D. $\\mathrm{(CH_3)_2NH}$"],"answer":"A","explain":"Aniline (phenylamine): $\\mathrm{C_6H_5NH_2}$.","points":0.25},{"type":"mcq","level":"NB","q":"Ở điều kiện thường, methylamine là:","options":["A. chất rắn","B. chất lỏng","C. chất khí có mùi khai","D. chất khí không mùi"],"answer":"C","explain":"$\\mathrm{CH_3NH_2}$ là chất khí, mùi khai, tan tốt trong nước.","points":0.25},{"type":"mcq","level":"TH","q":"Thuốc thử để nhận biết aniline là:","options":["A. dung dịch $\\mathrm{AgNO_3/NH_3}$","B. nước bromine (kết tủa trắng)","C. $\\mathrm{Cu(OH)_2}$","D. quỳ tím"],"answer":"B","explain":"Aniline + nước bromine → kết tủa trắng 2,4,6-tribromoaniline.","points":0.25},{"type":"mcq","level":"TH","q":"Phản ứng của aniline với nước bromine thuộc loại:","options":["A. phản ứng cộng","B. phản ứng thế ở vòng benzene","C. phản ứng oxi hóa","D. phản ứng trung hòa"],"answer":"B","explain":"Thế 3 nguyên tử H ở vị trí 2,4,6 của vòng benzene bằng Br.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $4,65$ gam aniline ($M = 93$) tác dụng với nước bromine dư. Khối lượng kết tủa thu được là:","options":["A. $16,5$ gam","B. $33$ gam","C. $8,25$ gam","D. $49,5$ gam"],"answer":"A","explain":"$n_{aniline} = 0,05$ mol → $m = 0,05 \\times 330 = 16,5$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Đốt cháy hoàn toàn $4,5$ gam ethylamine ($\\mathrm{C_2H_5NH_2}$, $M = 45$). Thể tích $\\mathrm{O_2}$ (đktc) cần dùng là:","options":["A. $8,4$ lít","B. $16,8$ lít","C. $4,2$ lít","D. $12,6$ lít"],"answer":"A","explain":"$\\mathrm{4C_2H_5NH_2 + 15O_2 \\rightarrow 8CO_2 + 14H_2O + 2N_2}$; $n_{amine} = 0,1$ mol → $n_{\\mathrm{O_2}} = 0,375$ mol → $V = 8,4$ lít.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Aniline là $\\mathrm{C_6H_5NH_2}$.","b) Methylamine là chất khí mùi khai.","c) Nước bromine nhận biết được aniline.","d) Aniline tan tốt trong nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: aniline ÍT tan trong nước.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $4,65$ gam aniline + bromine dư cho $16,5$ gam kết tủa.","b) Đốt cháy $4,5$ gam ethylamine cần $8,4$ lít $\\mathrm{O_2}$ (đktc).","c) Sản phẩm cháy của amine gồm $\\mathrm{CO_2}$, $\\mathrm{H_2O}$ và $\\mathrm{N_2}$.","d) $\\mathrm{(CH_3)_3N}$ là amine bậc 2."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: $\\mathrm{(CH_3)_3N}$ là amine BẬC 3.","points":1},{"type":"short","level":"VD","q":"Cho $6,2$ gam methylamine ($M = 31$) tác dụng với HCl dư. Khối lượng muối thu được là bao nhiêu gam?","answer":"13,5","explain":"$n = 0,2$ mol → $m = 0,2 \\times 67,5 = 13,5$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Trung hòa $9,3$ gam aniline ($M = 93$) cần $V$ ml dung dịch HCl $1M$. Giá trị của $V$ là bao nhiêu?","answer":"100","explain":"$n_{aniline} = 0,1$ mol → $n_{HCl} = 0,1$ mol → $V = 100$ ml.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"$\\mathrm{(CH_3)_3N}$ có tên gọi là:","options":["A. trimethylamine","B. dimethylamine","C. methylamine","D. ethylamine"],"answer":"A","explain":"3 gốc methyl → trimethylamine (amine bậc 3).","points":0.25},{"type":"mcq","level":"NB","q":"Tính chất vật lí của aniline là:","options":["A. chất khí, tan tốt trong nước","B. chất lỏng, ít tan trong nước","C. chất rắn, tan tốt trong nước","D. chất khí, không tan trong nước"],"answer":"B","explain":"Aniline là chất lỏng, ít tan trong nước.","points":0.25},{"type":"mcq","level":"TH","q":"So sánh tính base của: (1) $\\mathrm{CH_3NH_2}$, (2) $\\mathrm{C_2H_5NH_2}$, (3) $\\mathrm{C_6H_5NH_2}$. Thứ tự đúng là:","options":["A. $(1) \\lt (2) \\lt (3)$","B. $(3) \\lt (1) \\lt (2)$","C. $(2) \\lt (1) \\lt (3)$","D. $(3) \\lt (2) \\lt (1)$"],"answer":"B","explain":"Gốc ethyl đẩy e mạnh hơn methyl → $\\mathrm{C_2H_5NH_2}$ base mạnh hơn $\\mathrm{CH_3NH_2}$; aniline yếu nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Aniline không làm đổi màu quỳ tím vì:","options":["A. không tan trong nước","B. tính base quá yếu","C. là chất lỏng","D. bị oxi hóa"],"answer":"B","explain":"Gốc phenyl hút electron làm tính base của aniline rất yếu, không đủ đổi màu quỳ tím.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,15$ mol methylamine tác dụng với HCl dư. Khối lượng muối thu được là:","options":["A. $10,125$ gam","B. $6,75$ gam","C. $20,25$ gam","D. $5,0625$ gam"],"answer":"A","explain":"$m = 0,15 \\times 67,5 = 10,125$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm methylamine và ethylamine. Cho $7,6$ gam X tác dụng với HCl dư thu được $14,9$ gam muối. Phần trăm khối lượng của methylamine trong X là:","options":["A. $40,8\\%$","B. $59,2\\%$","C. $50\\%$","D. $81,6\\%$"],"answer":"A","explain":"Đặt $n_{CH_3NH_2} = a$, $n_{C_2H_5NH_2} = b$: $31a + 45b = 7,6$; $67,5a + 81,5b = 14,9$ → $a = b = 0,1$ → $m_{CH_3NH_2} = 3,1$ gam → $3,1/7,6 = 40,8\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\mathrm{(CH_3)_3N}$ là trimethylamine.","b) Aniline là chất lỏng, ít tan trong nước.","c) Tính base tăng dần: aniline, methylamine, ethylamine.","d) Aniline làm phenolphthalein chuyển hồng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: aniline quá yếu, không đổi màu phenolphthalein.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,15$ mol methylamine + HCl cho $10,125$ gam muối.","b) Hỗn hợp $0,1$ mol mỗi amine ($7,6$ gam) + HCl cho $14,9$ gam muối.","c) Gốc alkyl làm tăng tính base của amine.","d) Gốc phenyl làm tăng tính base của amine."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: gốc phenyl HÚT electron, làm GIẢM tính base.","points":1},{"type":"short","level":"VD","q":"Cho $9$ gam ethylamine ($M = 45$) tác dụng với $\\mathrm{HNO_3}$ vừa đủ. Khối lượng muối $\\mathrm{C_2H_5NH_3NO_3}$ ($M = 108$) thu được là bao nhiêu gam?","answer":"21,6","explain":"$n = 0,2$ mol → $m = 0,2 \\times 108 = 21,6$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $6,2$ gam methylamine ($M = 31$). Thể tích $\\mathrm{N_2}$ (đktc) thu được là bao nhiêu lít?","answer":"2,24","explain":"$\\mathrm{4CH_3NH_2 + 9O_2 \\rightarrow 4CO_2 + 10H_2O + 2N_2}$; $n_{amine} = 0,2$ mol → $n_{\\mathrm{N_2}} = 0,1$ mol → $V = 2,24$ lít.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Amine bậc 1 là amine có:","options":["A. 1 nguyên tử C","B. 1 gốc hydrocarbon gắn vào N","C. 1 nhóm $-NH_2$","D. $M$ nhỏ"],"answer":"B","explain":"Bậc amine = số gốc hydrocarbon gắn vào nguyên tử N.","points":0.25},{"type":"mcq","level":"NB","q":"Methylamine làm quỳ tím chuyển:","options":["A. đỏ","B. xanh","C. không đổi màu","D. vàng"],"answer":"B","explain":"Alkyl amine có tính base đủ mạnh làm quỳ tím chuyển xanh.","points":0.25},{"type":"mcq","level":"TH","q":"Cho các amine: $\\mathrm{CH_3NH_2}$ (1), $\\mathrm{(CH_3)_2NH}$ (2), $\\mathrm{(CH_3)_3N}$ (3). Tính base tăng dần là:","options":["A. $(1) \\lt (2) \\lt (3)$","B. $(3) \\lt (2) \\lt (1)$","C. $(2) \\lt (1) \\lt (3)$","D. $(1) \\lt (3) \\lt (2)$"],"answer":"A","explain":"Trong dãy đồng đẳng, tính base tăng dần theo bậc: bậc 1, bậc 2, bậc 3 (xét pha khí/dung dịch loãng).","points":0.25},{"type":"mcq","level":"TH","q":"Sản phẩm của phản ứng $\\mathrm{C_2H_5NH_2}$ + HCl là:","options":["A. $\\mathrm{C_2H_5Cl}$ và $\\mathrm{NH_3}$","B. $\\mathrm{C_2H_5NH_3Cl}$","C. $\\mathrm{CH_3NH_3Cl}$","D. $\\mathrm{C_2H_5NH_2Cl_2}$"],"answer":"B","explain":"$\\mathrm{C_2H_5NH_2 + HCl \\rightarrow C_2H_5NH_3Cl}$ (ethylammonium chloride).","points":0.25},{"type":"mcq","level":"VD","q":"Cho $0,2$ mol aniline tác dụng với nước bromine dư. Khối lượng kết tủa thu được là:","options":["A. $33$ gam","B. $66$ gam","C. $16,5$ gam","D. $99$ gam"],"answer":"B","explain":"$m = 0,2 \\times 330 = 66$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm aniline và methylamine. Cho $12,4$ gam X tác dụng với HCl dư thu được $19,65$ gam muối. Phần trăm khối lượng của aniline trong X là: ($M_{aniline} = 93$, $M_{methylamine} = 31$)","options":["A. $75\\%$","B. $25\\%$","C. $50\\%$","D. $60\\%$"],"answer":"A","explain":"Đặt $n_{aniline} = a$, $n_{methylamine} = b$: $93a + 31b = 12,4$; muối: $(93+36,5)a + 67,5b = 19,65$ → $129,5a + 67,5b = 19,65$. Giải: $a = 0,1$, $b = 0,1$ → $m_{aniline} = 9,3$ gam → $75\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bậc amine tính theo số gốc hydrocarbon gắn vào N.","b) Methylamine làm quỳ tím chuyển xanh.","c) Tính base tăng dần: $\\mathrm{CH_3NH_2}$, $\\mathrm{(CH_3)_2NH}$, $\\mathrm{(CH_3)_3N}$.","d) $\\mathrm{C_2H_5NH_2}$ + HCl cho $\\mathrm{C_2H_5NH_3Cl}$."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $0,2$ mol aniline + bromine dư cho $66$ gam kết tủa.","b) $12,4$ gam hỗn hợp aniline + methylamine ($n$ bằng nhau) + HCl cho $19,65$ gam muối.","c) Aniline dễ tham gia phản ứng thế hơn benzene.","d) Nhóm $-\\mathrm{NH_2}$ hoạt hóa vòng benzene."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Cho $18,6$ gam aniline ($M = 93$) tác dụng với HCl dư. Khối lượng muối phenylammonium chloride ($M = 129,5$) thu được là bao nhiêu gam?","answer":"25,9","explain":"$n_{aniline} = 0,2$ mol → $m = 0,2 \\times 129,5 = 25,9$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $9$ gam ethylamine ($M = 45$). Khối lượng $\\mathrm{CO_2}$ thu được là bao nhiêu gam?","answer":"17,6","explain":"$\\mathrm{4C_2H_5NH_2 + 15O_2 \\rightarrow 8CO_2 + 14H_2O + 2N_2}$; $n_{amine} = 0,2$ mol → $n_{\\mathrm{CO_2}} = 0,4$ mol → $m = 17,6$ gam.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Nhóm chức của amine là:","options":["A. $-NH_2$ (gắn với gốc hydrocarbon)","B. $-COOH$","C. $-OH$","D. $-CHO$"],"answer":"A","explain":"Nhóm chức amine: $-\\mathrm{NH_2}$, $-\\mathrm{NH}-$, $\\gt\\mathrm{N}-$ gắn với gốc hydrocarbon.","points":0.25},{"type":"mcq","level":"NB","q":"Aniline được dùng để sản xuất:","options":["A. xà phòng","B. phẩm nhuộm, dược phẩm","C. phân bón","D. chất tẩy rửa"],"answer":"B","explain":"Aniline là nguyên liệu sản xuất phẩm nhuộm azo, dược phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Để phân biệt aniline và methylamine, dùng:","options":["A. quỳ tím","B. nước bromine","C. dung dịch HCl","D. dung dịch NaOH"],"answer":"B","explain":"Aniline + nước bromine → kết tủa trắng; methylamine không hiện tượng.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol $\\mathrm{CH_3NH_2}$ tác dụng với $0,1$ mol HCl. Sau phản ứng, dung dịch thu được có môi trường:","options":["A. trung tính","B. acid","C. base","D. không xác định"],"answer":"B","explain":"Muối $\\mathrm{CH_3NH_3Cl}$ bị thủy phân cho môi trường acid (cation của base yếu).","points":0.25},{"type":"mcq","level":"VD","q":"Khối lượng bromine cần dùng để phản ứng vừa đủ với $4,65$ gam aniline ($M = 93$) là:","options":["A. $24$ gam","B. $48$ gam","C. $12$ gam","D. $36$ gam"],"answer":"A","explain":"$n_{aniline} = 0,05$ mol → $n_{\\mathrm{Br_2}} = 0,15$ mol → $m = 24$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm methylamine và ethylamine có khối lượng $15,2$ gam. Cho X tác dụng với HCl dư thu được $29,8$ gam muối. Phần trăm khối lượng của methylamine trong X là:","options":["A. $40,8\\%$","B. $59,2\\%$","C. $50\\%$","D. $20\\%$"],"answer":"A","explain":"Đặt $n_{CH_3NH_2} = a$, $n_{C_2H_5NH_2} = b$: $31a + 45b = 15,2$; $67,5a + 81,5b = 29,8$ → $a = b = 0,2$ → $m_{CH_3NH_2} = 6,2$ gam → $40,8\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhóm chức amine gắn với gốc hydrocarbon.","b) Aniline dùng sản xuất phẩm nhuộm.","c) Nước bromine phân biệt aniline và methylamine.","d) Muối $\\mathrm{CH_3NH_3Cl}$ có môi trường acid."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $4,65$ gam aniline cần $24$ gam bromine để phản ứng vừa đủ.","b) Aniline bị oxi hóa trong không khí chuyển màu sẫm.","c) Alkyl amine tan tốt trong nước.","d) Aniline là chất khí."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: aniline là CHẤT LỎNG.","points":1},{"type":"short","level":"VD","q":"Cho $0,25$ mol ethylamine tác dụng với HCl dư. Khối lượng muối thu được là bao nhiêu gam? ($M_{muối} = 81,5$)","answer":"20,375","explain":"$m = 0,25 \\times 81,5 = 20,375$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $m$ gam methylamine thu được $8,8$ gam $\\mathrm{CO_2}$. Giá trị của $m$ là bao nhiêu?","answer":"6,2","explain":"$n_{\\mathrm{CO_2}} = 0,2$ mol → $n_{amine} = 0,2$ mol → $m = 0,2 \\times 31 = 6,2$ gam.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Dimethylamine có công thức là:","options":["A. $\\mathrm{CH_3NH_2}$","B. $\\mathrm{(CH_3)_2NH}$","C. $\\mathrm{(CH_3)_3N}$","D. $\\mathrm{C_2H_5NH_2}$"],"answer":"B","explain":"Dimethylamine: $\\mathrm{(CH_3)_2NH}$ (amine bậc 2).","points":0.25},{"type":"mcq","level":"NB","q":"Mùi đặc trưng của các amine có $M$ nhỏ là:","options":["A. mùi thơm","B. mùi khai khó chịu","C. không mùi","D. mùi ngọt"],"answer":"B","explain":"Amine $M$ nhỏ có mùi khai khó chịu (giống mùi nước tiểu, cá ươn).","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol $\\mathrm{C_6H_5NH_2}$ tác dụng với HCl dư. Khối lượng muối thu được là:","options":["A. $9,3$ gam","B. $12,95$ gam","C. $18,6$ gam","D. $6,475$ gam"],"answer":"B","explain":"$m = 0,1 \\times 129,5 = 12,95$ gam.","points":0.25},{"type":"mcq","level":"TH","q":"Nhỏ vài giọt aniline vào nước, hiện tượng là:","options":["A. tan hoàn toàn","B. tách thành 2 lớp (ít tan)","C. kết tủa trắng","D. sôi"],"answer":"B","explain":"Aniline ít tan trong nước nên tách lớp.","points":0.25},{"type":"mcq","level":"VD","q":"Đốt cháy $6,2$ gam methylamine ($M = 31$). Thể tích $\\mathrm{CO_2}$ (đktc) thu được là:","options":["A. $2,24$ lít","B. $4,48$ lít","C. $8,96$ lít","D. $1,12$ lít"],"answer":"B","explain":"$n_{amine} = 0,2$ mol → $n_{\\mathrm{CO_2}} = 0,2$ mol → $V = 4,48$ lít.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm $\\mathrm{CH_3NH_2}$ và $\\mathrm{C_2H_5NH_2}$ có tỉ lệ mol $1:1$. Cho $15,2$ gam X tác dụng với $\\mathrm{H_2SO_4}$ loãng dư. Khối lượng muối sulfate thu được là:","options":["A. $29,8$ gam","B. $24,8$ gam","C. $34,8$ gam","D. $19,8$ gam"],"answer":"C","explain":"$n$ mỗi amine $= 15,2/76 = 0,2$ mol → $n_{\\mathrm{H_2SO_4}} = 0,2$ mol; $m_{muối} = 15,2 + 0,2 \\times 98 = 34,8$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dimethylamine là $\\mathrm{(CH_3)_2NH}$.","b) Amine $M$ nhỏ có mùi khai.","c) $0,1$ mol aniline + HCl cho $12,95$ gam muối.","d) Aniline ít tan trong nước."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $6,2$ gam methylamine cháy cho $4,48$ lít $\\mathrm{CO_2}$ (đktc).","b) $15,2$ gam hỗn hợp 2 amine ($1:1$) + $\\mathrm{H_2SO_4}$ cho $34,8$ gam muối.","c) Amine đốt cháy cho $\\mathrm{N_2}$.","d) Aniline tan tốt trong nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: aniline ÍT tan trong nước.","points":1},{"type":"short","level":"VD","q":"Cho $0,3$ mol methylamine tác dụng với $\\mathrm{H_2SO_4}$ loãng dư. Khối lượng muối $\\mathrm{(CH_3NH_3)_2SO_4}$ ($M = 160$) thu được là bao nhiêu gam?","answer":"24","explain":"$2\\mathrm{CH_3NH_2} + \\mathrm{H_2SO_4} \\rightarrow \\mathrm{(CH_3NH_3)_2SO_4}$; $n_{muối} = 0,15$ mol → $m = 24$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $m$ gam aniline tác dụng với nước bromine dư thu được $49,5$ gam kết tủa. Giá trị của $m$ là bao nhiêu?","answer":"13,95","explain":"$n_{kết\\ tủa} = 49,5/330 = 0,15$ mol → $m_{aniline} = 0,15 \\times 93 = 13,95$ gam.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Số đồng phân amine bậc 1 ứng với công thức $\\mathrm{C_3H_9N}$ là:","options":["A. 1","B. 2","C. 3","D. 4"],"answer":"B","explain":"Amine bậc 1 $\\mathrm{C_3H_9N}$: $\\mathrm{CH_3CH_2CH_2NH_2}$ và $\\mathrm{(CH_3)_2CHNH_2}$ — 2 đồng phân.","points":0.25},{"type":"mcq","level":"NB","q":"Aniline có tính base yếu hơn $\\mathrm{NH_3}$ vì:","options":["A. gốc phenyl hút electron","B. gốc phenyl đẩy electron","C. aniline không tan trong nước","D. aniline là chất lỏng"],"answer":"A","explain":"Gốc phenyl hút electron làm giảm mật độ electron trên N → tính base giảm.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol $\\mathrm{C_2H_5NH_2}$ tác dụng với $0,15$ mol HCl. Khối lượng muối thu được là:","options":["A. $8,15$ gam","B. $12,225$ gam","C. $4,075$ gam","D. $16,3$ gam"],"answer":"A","explain":"Amine hết ($0,1$ mol), HCl dư → $m_{muối} = 0,1 \\times 81,5 = 8,15$ gam.","points":0.25},{"type":"mcq","level":"TH","q":"Hiện tượng khi nhỏ nước bromine vào ống nghiệm chứa aniline là:","options":["A. xuất hiện kết tủa trắng","B. dung dịch chuyển màu vàng","C. có khí thoát ra","D. không có hiện tượng"],"answer":"A","explain":"Tạo kết tủa trắng 2,4,6-tribromoaniline.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $18,6$ gam hỗn hợp aniline và methylamine (tỉ lệ mol $1:1$) tác dụng với HCl dư. Khối lượng muối thu được là:","options":["A. $29,55$ gam","B. $14,775$ gam","C. $59,1$ gam","D. $19,7$ gam"],"answer":"A","explain":"$n$ mỗi chất $= 18,6/124 = 0,15$ mol → $m_{muối} = 0,15 \\times (129,5 + 67,5) = 29,55$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Đốt cháy hoàn toàn $m$ gam hỗn hợp methylamine và ethylamine (tỉ lệ mol $1:1$) thu được $13,2$ gam $\\mathrm{CO_2}$. Giá trị của $m$ là:","options":["A. $7,6$ gam","B. $15,2$ gam","C. $3,8$ gam","D. $11,4$ gam"],"answer":"A","explain":"$n_{\\mathrm{CO_2}} = 0,3$ mol; mỗi mol hỗn hợp ($1:1$) cho $1,5$ mol $\\mathrm{CO_2}$ → $n_{hh} = 0,2$ mol → $m = 0,2 \\times 38 = 7,6$ gam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\mathrm{C_3H_9N}$ có 2 đồng phân amine bậc 1.","b) Gốc phenyl hút electron làm giảm tính base của aniline.","c) $0,1$ mol $\\mathrm{C_2H_5NH_2}$ + HCl dư cho $8,15$ gam muối.","d) Aniline + nước bromine cho kết tủa trắng."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hỗn hợp aniline + methylamine ($1:1$, $18,6$ gam) + HCl cho $29,55$ gam muối.","b) Đốt cháy $7,6$ gam hỗn hợp 2 amine ($1:1$) cho $13,2$ gam $\\mathrm{CO_2}$.","c) $1$ mol hỗn hợp amine ($1:1$) cháy cho $1,5$ mol $\\mathrm{CO_2}$.","d) Methylamine là chất lỏng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: methylamine là CHẤT KHÍ.","points":1},{"type":"short","level":"VD","q":"Cho $0,2$ mol dimethylamine ($\\mathrm{(CH_3)_2NH}$, $M = 45$) tác dụng với HCl dư. Khối lượng muối thu được là bao nhiêu gam? ($M_{muối} = 81,5$)","answer":"16,3","explain":"$m = 0,2 \\times 81,5 = 16,3$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Cho $m$ gam aniline tác dụng vừa đủ với $200$ ml dung dịch bromine $1,5M$. Giá trị của $m$ là bao nhiêu?","answer":"9,3","explain":"$n_{\\mathrm{Br_2}} = 0,3$ mol → $n_{aniline} = 0,1$ mol → $m = 9,3$ gam.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng?","options":["A. Amine là hợp chất của N với kim loại","B. Amine có tính base","C. Amine không tác dụng với acid","D. Amine là acid"],"answer":"B","explain":"Amine có cặp electron tự do trên N nên thể hiện tính base.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây sai?","options":["A. Aniline tác dụng với nước bromine","B. Methylamine làm quỳ tím chuyển xanh","C. Aniline tan tốt trong nước","D. Amine cháy tạo $\\mathrm{N_2}$"],"answer":"C","explain":"Aniline ÍT tan trong nước.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy chất nào sau đây đều làm quỳ tím chuyển xanh?","options":["A. $\\mathrm{C ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: aniline quá yếu.","points":1},{"type":"short","level":"VD","q":"Cho $12,4$ gam hỗn hợp aniline và methylamine (tỉ lệ mol $1:1$) tác dụng với nước bromine dư. Khối lượng kết tủa thu được là bao nhiêu gam?","answer":"33","explain":"Chỉ aniline phản ứng: $n_{aniline} = 12,4/124 = 0,1$ mol → $m = 33$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $12,1$ gam hỗn hợp methylamine và ethylamine (tỉ lệ mol $1:2$) thu được bao nhiêu lít $\\mathrm{CO_2}$ (đktc)?","answer":"11,2","explain":"$n_{CH_3NH_2} = a$, $n_{C_2H_5NH_2} = 2a$: $31a + 90a = 121a = 12,1$ → $a = 0,1$ → $n_{\\mathrm{CO_2}} = 0,1 + 0,4 = 0,5$ mol → $V = 11,2$ lít.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Công thức của ethylamine là:","options":["A. $\\mathrm{CH_3NH_2}$","B. $\\mathrm{C_2H_5NH_2}$","C. $\\mathrm{C_6H_5NH_2}$","D. $\\mathrm{(CH_3)_2NH}$"],"answer":"B","explain":"Ethylamine: $\\mathrm{C_2H_5NH_2}$.","points":0.25},{"type":"mcq","level":"NB","q":"Công thức của phenylamine (aniline) là:","options":["A. $\\mathrm{C_6H_5NH_2}$","B. $\\mathrm{C_6H_5OH}$","C. $\\mathrm{C_6H_5CH_3}$","D. $\\mathrm{C_6H_5Cl}$"],"answer":"A","explain":"Phenylamine: $\\mathrm{C_6H_5NH_2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,2$ mol methylamine tác dụng vừa đủ với $\\mathrm{H_2SO_4}$ loãng. Khối lượng muối thu được là:","options":["A. $13,5$ gam","B. $16$ gam","C. $32$ gam","D. $8$ gam"],"answer":"B","explain":"$n_{muối} = 0,1$ mol → $m = 16$ gam.","points":0.25},{"type":"mcq","level":"TH","q":"Số nguyên tử H trong phân tử aniline là:","options":["A. 5","B. 6","C. 7","D. 8"],"answer":"C","explain":"$\\mathrm{C_6H_5NH_2}$: $5 + 2 = 7$ nguyên tử H.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $27,9$ gam aniline ($M = 93$) tác dụng với nước bromine dư. Khối lượng kết tủa thu được là:","options":["A. $99$ gam","B. $66$ gam","C. $49,5$ gam","D. $33$ gam"],"answer":"A","explain":"$n_{aniline} = 0,3$ mol → $m = 0,3 \\times 330 = 99$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm methylamine và aniline. Đốt cháy hoàn toàn $12,4$ gam X thu được $17,6$ gam $\\mathrm{CO_2}$. Phần trăm khối lượng của methylamine trong X là: ($M_{methylamine} = 31$, $M_{aniline} = 93$)","options":["A. $25\\%$","B. $75\\%$","C. $50\\%$","D. $40\\%$"],"answer":"A","explain":"Đặt $n_{CH_3NH_2} = a$, $n_{aniline} = b$: $31a + 93b = 12,4$; $n_{\\mathrm{CO_2}} = a + 6b = 0,4$ → $a = 0,1$, $b = 0,1$ → $m_{CH_3NH_2} = 3,1$ gam → $25\\%$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ethylamine là $\\mathrm{C_2H_5NH_2}$.","b) Phenylamine là $\\mathrm{C_6H_5NH_2}$.","c) $0,2$ mol methylamine + $\\mathrm{H_2SO_4}$ cho $16$ gam muối.","d) Aniline có 7 nguyên tử H."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $27,9$ gam aniline + bromine dư cho $99$ gam kết tủa.","b) Đốt cháy $12,4$ gam hỗn hợp methylamine + aniline ($1:1$) cho $17,6$ gam $\\mathrm{CO_2}$.","c) $n_{\\mathrm{CO_2}} = n_{CH_3NH_2} + 6n_{aniline}$.","d) Aniline là amine bậc 1."],"answer":["T","T","T","T"],"explain":"Cả 4 khẳng định đều đúng (aniline $\\mathrm{C_6H_5NH_2}$ là amine bậc 1 thơm).","points":1},{"type":"short","level":"VD","q":"Cho $0,15$ mol aniline tác dụng với HCl dư. Khối lượng muối thu được là bao nhiêu gam? ($M_{muối} = 129,5$)","answer":"19,425","explain":"$m = 0,15 \\times 129,5 = 19,425$ gam.","points":0.5},{"type":"short","level":"VDC","q":"Đốt cháy hoàn toàn $9,3$ gam aniline ($M = 93$). Thể tích $\\mathrm{CO_2}$ (đktc) thu được là bao nhiêu lít?","answer":"13,44","explain":"$n_{aniline} = 0,1$ mol → $n_{\\mathrm{CO_2}} = 0,6$ mol → $V = 13,44$ lít.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Trong các chất sau, chất là amine bậc 3 là:","options":["A. $\\mathrm{CH_3NH_2}$","B. $\\mathrm{(CH_3)_2NH}$","C. $\\mathrm{(CH_3)_3N}$","D. $\\mathrm{C_6H_5NH_2}$"],"answer":"C","explain":"$\\mathrm{(CH_3)_3N}$ có 3 gốc methyl gắn vào N → amine bậc 3.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các chất sau, chất là amine thơm là:","options":["A. $\\mathrm{CH_3NH_2}$","B. $\\mathrm{C_2H_5NH_2}$","C. $\\mathrm{C_6H_5NH_2}$","D. $\\mathrm{(CH_3)_3N}$"],"answer":"C","explain":"Aniline ($\\mathrm{C_6H_5NH_2}$) là amine thơm.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $0,1$ mol $\\mathrm{(CH_3)_3N}$ tác dụng với HCl dư. Khối lượng muối thu được là: ($M_{amine} = 59$, $M_{muối} = 95,5$)","options":["A. $9,55$ gam","B. $5,9$ gam","C. $19,1$ gam","D. $4,775$ gam"],"answer":"A","explain":"$m = 0,1 \\times 95,5 = 9,55$ gam.","points":0.25},{"type":"mcq","level":"TH","q":"Sản phẩm cháy của $1$ mol $\\mathrm{CH_3NH_2}$ gồm:","options":["A. $1$ mol $\\mathrm{CO_2}$, $2,5$ mol $\\mathrm{H_2O}$, $0,5$ mol $\\mathrm{N_2}$","B. $1$ mol $\\mathrm{CO_2}$, $2$ mol $\\mathrm{H_2O}$, $1$ mol $\\mathrm{N_2}$","C. $2$ mol $\\mathrm{CO_2}$, $2,5$ mol $\\mathrm{H_2O}$, $0,5$ mol $\\mathrm{N_2}$","D. $1$ mol $\\mathrm{CO}$, $2,5$ mol $\\mathrm{H_2O}$, $0,5$ mol $\\mathrm{N_2}$"],"answer":"A","explain":"$\\mathrm{4CH_3NH_2 + 9O_2 \\rightarrow 4CO_2 + 10H_2O + 2N_2}$ → $1$ mol amine cho $1$ $\\mathrm{CO_2}$, $2,5$ $\\mathrm{H_2O}$, $0,5$ $\\mathrm{N_2}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $5,9$ gam $\\mathrm{(CH_3)_3N}$ ($M = 59$) tác dụng với $\\mathrm{H_2SO_4}$ loãng dư. Khối lượng muối thu được là:","options":["A. $7,85$ gam","B. $15,7$ gam","C. $10,8$ gam","D. $5,9$ gam"],"answer":"C","explain":"$n_{amine} = 0,1$ mol → $n_{\\mathrm{H_2SO_4}} = 0,05$ mol → $m_{muối} = 5,9 + 0,05 \\times 98 = 10,8$ gam.","points":0.25},{"type":"mcq","level":"VDC","q":"Hỗn hợp X gồm aniline và ethylamine có tỉ lệ mol $1:2$. Đốt cháy hoàn toàn $18,3$ gam X thu được $m$ gam $\\mathrm{CO_2}$. Giá trị của $m$ là: ($M_
