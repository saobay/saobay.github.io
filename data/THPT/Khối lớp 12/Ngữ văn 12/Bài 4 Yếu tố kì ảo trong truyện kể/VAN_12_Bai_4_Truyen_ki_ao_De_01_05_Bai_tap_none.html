dựng tương lai.", "explain": "DÀN Ý:\n1. Mở đoạn: tương lai không phải điều định sẵn mà do sự nỗ lực hôm nay tạo ra.\n2. Thân đoạn: (a) Vai trò: nỗ lực biến ước mơ thành hiện thực như Nam thay đổi tương lai bằng cố gắng mỗi ngày; (b) Dẫn chứng tấm gương vượt khó; (c) Phê phán thói lười biếng, trông chờ may mắn, phép màu.\n3. Kết đoạn: hãy nỗ lực từ hôm nay.\n\nBÀI MẪU:\nTương lai không phải là điều được định sẵn mà là điều ta tự tạo ra bằng sự nỗ lực của chính mình hôm nay — đó là bài học sâu sắc từ câu chuyện Chiếc gương thần. Chiếc gương cho Nam thấy một tương lai tăm tối nếu cậu tiếp tục lười biếng, và một tương lai rạng rỡ khi cậu quyết tâm thay đổi. Trong cuộc sống, cũng có biết bao tấm gương chứng minh sức mạnh của nỗ lực: những học sinh nghèo vượt khó đỗ thủ khoa, những vận động viên khuyết tật chinh phục đỉnh cao — tất cả đều không trông chờ phép màu mà tự mình vươn lên bằng mồ hôi và ý chí. Ngược lại, những kẻ lười biếng, chỉ biết mơ mộng mà không hành động, hoặc trông chờ vào may rủi, sớm muộn cũng phải trả giá bằng một tương lai mờ mịt. Phép màu lớn nhất, như lời nhắn trong truyện, chính là sự nỗ lực bền bỉ mỗi ngày. Vì vậy, mỗi chúng ta, nhất là tuổi trẻ, hãy bắt đầu xây dựng tương lai ngay từ hôm nay bằng những cố gắng cụ thể: chăm chỉ học tập, rèn luyện không ngừng. Tương lai nằm trong tay ta — hãy nắm lấy nó.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích ý nghĩa của yếu tố kì ảo trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và yếu tố kì ảo (chiếc gương thần) — phương tiện nghệ thuật đặc sắc.\nII. Thân bài:\n1. Yếu tố kì ảo trong truyện: chiếc gương cho thấy tương lai, ông lão giữ gương — hoang đường mà hợp lí.\n2. Vai trò:\n   a. Tạo sức hấp dẫn, lôi cuốn người đọc.\n   b. Là phương tiện giúp nhân vật nhận thức và thay đổi: thấy trước hậu quả để sửa mình.\n   c. Thể hiện ước mơ: con người luôn khát khao biết trước tương lai.\n   d. Gửi gắm triết lí: tương lai do nỗ lực tạo ra — cái kì ảo dẫn đến chân lí hiện thực.\n3. Nghệ thuật: xây dựng yếu tố kì ảo gắn chặt với tâm lí nhân vật; kết thúc bất ngờ mà thấm thía.\nIII. Kết bài: khẳng định giá trị của yếu tố kì ảo; bài học về sự nỗ lực.\n\nĐOẠN MẪU (mở bài):\nYếu tố kì ảo từ lâu đã là phương tiện nghệ thuật đắc lực của truyện kể, giúp nhà văn thể hiện những tư tưởng sâu xa một cách sinh động, hấp dẫn. Truyện ngắn Chiếc gương thần đã sử dụng thành công yếu tố kì ảo — chiếc gương có phép màu cho thấy tương lai — không chỉ để lôi cuốn người đọc mà còn để gửi gắm một triết lí nhân sinh thấm thía: tương lai của con người nằm trong chính sự nỗ lực của họ hôm nay.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIẤC MƠ CỦA BÀ LÃO\n\nBà cụ Lý sống một mình trong căn nhà nhỏ đầu làng. Con cháu đi làm ăn xa, mỗi năm chỉ về được một lần vào dịp Tết. Bà sống lầm lũi, ít nói cười, hàng xóm sang chơi bà cũng chỉ ậm ừ cho qua.\n\nMột đêm, bà mơ thấy mình lạc vào một khu vườn đầy hoa thơm, cỏ lạ. Một ông tiên râu tóc bạc phơ hiện ra, hỏi: Sao bà buồn thế? Bà thở dài: Tôi già rồi, sống một mình, chẳng còn niềm vui gì nữa.\n\nÔng tiên phất tay, khu vườn bỗng hiện ra bao cảnh: những đứa trẻ mồ côi không nơi nương tựa, những cụ già neo đơn không người chăm sóc. Ông tiên nói: Bà thấy không, còn bao người khổ hơn bà mà vẫn sống vui. Niềm vui không phải chờ người khác mang đến, mà do chính mình tạo ra. Hãy mở lòng ra, bà sẽ thấy cuộc đời còn nhiều điều tốt đẹp.\n\nBà tỉnh giấc, trời đã sáng. Lời ông tiên cứ vang vọng bên tai. Hôm đó, bà sang nhà hàng xóm chơi — lần đầu tiên sau bao năm. Bà mang khoai lang sang biếu cụ Tư neo đơn, kể chuyện cổ tích cho lũ trẻ trong xóm nghe. Lũ trẻ quây quần bên bà, ríu rít như chim non.\n\nDần dần, căn nhà nhỏ của bà trở nên rộn rã tiếng cười. Bà dạy lũ trẻ hát những bài đồng dao, kể cho chúng nghe chuyện ngày xưa. Cụ Tư có bầu bạn, lũ trẻ có bà kể chuyện, còn bà — bà tìm lại được niềm vui đã mất từ lâu.\n\nMột năm sau, con cháu về ăn Tết, ngạc nhiên thấy mẹ mình tươi tắn, vui vẻ hẳn ra. Bà cười: Mẹ có cả một khu vườn niềm vui đây này — vừa nói vừa chỉ lũ trẻ đang chơi đùa ngoài sân.\n\nĐêm giao thừa, bà lại mơ thấy ông tiên. Ông mỉm cười: Bà đã tự tạo ra phép màu cho chính mình. Rồi ông tan biến vào ánh sáng. Bà tỉnh dậy, lòng ấm áp lạ thường. Ngoài sân, hoa trong vườn nhà bà đang nở rộ, thơm ngát như khu vườn trong mơ.\n\nCâu 1. Yếu tố kì ảo trong truyện là gì?", "options": ["A. Căn nhà nhỏ đầu làng", "B. Giấc mơ gặp ông tiên trong khu vườn đầy hoa thơm, cỏ lạ", "C. Lũ trẻ trong xóm", "D. Cụ Tư neo đơn"], "answer": "B", "explain": "Cuộc gặp gỡ ông tiên trong khu vườn mơ là yếu tố hoang đường, kì ảo — nó không có thật trong đời sống mà chỉ tồn tại trong giấc mơ mang ý nghĩa biểu tượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIẤC MƠ CỦA BÀ LÃO\n\nBà cụ Lý sống một mình trong căn nhà nhỏ đầu làng. Con cháu đi làm ăn xa, mỗi năm chỉ về được một lần vào dịp Tết. Bà sống lầm lũi, ít nói cười, hàng xóm sang chơi bà cũng chỉ ậm ừ cho qua.\n\nMột đêm, bà mơ thấy mình lạc vào một khu vườn đầy hoa thơm, cỏ lạ. Một ông tiên râu tóc bạc phơ hiện ra, hỏi: Sao bà buồn thế? Bà thở dài: Tôi già rồi, sống một mình, chẳng còn niềm vui gì nữa.\n\nÔng tiên phất tay, khu vườn bỗng hiện ra bao cảnh: những đứa trẻ mồ côi không nơi nương tựa, những cụ già neo đơn không người chăm sóc. Ông tiên nói: Bà thấy không, còn bao người khổ hơn bà mà vẫn sống vui. Niềm vui không phải chờ người khác mang đến, mà do chính mình tạo ra. Hãy mở lòng ra, bà sẽ thấy cuộc đời còn nhiều điều tốt đẹp.\n\nBà tỉnh giấc, trời đã sáng. Lời ông tiên cứ vang vọng bên tai. Hôm đó, bà sang nhà hàng xóm chơi — lần đầu tiên sau bao năm. Bà mang khoai lang sang biếu cụ Tư neo đơn, kể chuyện cổ tích cho lũ trẻ trong xóm nghe. Lũ trẻ quây quần bên bà, ríu rít như chim non.\n\nDần dần, căn nhà nhỏ của bà trở nên rộn rã tiếng cười. Bà dạy lũ trẻ hát những bài đồng dao, kể cho chúng nghe chuyện ngày xưa. Cụ Tư có bầu bạn, lũ trẻ có bà kể chuyện, còn bà — bà tìm lại được niềm vui đã mất từ lâu.\n\nMột năm sau, con cháu về ăn Tết, ngạc nhiên thấy mẹ mình tươi tắn, vui vẻ hẳn ra. Bà cười: Mẹ có cả một khu vườn niềm vui đây này — vừa nói vừa chỉ lũ trẻ đang chơi đùa ngoài sân.\n\nĐêm giao thừa, bà lại mơ thấy ông tiên. Ông mỉm cười: Bà đã tự tạo ra phép màu cho chính mình. Rồi ông tan biến vào ánh sáng. Bà tỉnh dậy, lòng ấm áp lạ thường. Ngoài sân, hoa trong vườn nhà bà đang nở rộ, thơm ngát như khu vườn trong mơ.\n\nCâu 2. Trước khi có giấc mơ, bà cụ Lý sống như thế nào?", "options": ["A. Vui vẻ, hòa đồng", "B. Lầm lũi, ít nói cười, khép mình vì sống một mình, con cháu xa", "C. Giàu có, sung sướng", "D. Bận rộn với công việc"], "answer": "B", "explain": "Văn bản miêu tả: bà sống lầm lũi, ít nói cười, hàng xóm sang chơi cũng chỉ ậm ừ — tâm trạng cô đơn, khép mình của người già neo đơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIẤC MƠ CỦA BÀ LÃO\n\nBà cụ Lý sống một mình trong căn nhà nhỏ đầu làng. Con cháu đi làm ăn xa, mỗi năm chỉ về được một lần vào dịp Tết. Bà sống lầm lũi, ít nói cười, hàng xóm sang chơi bà cũng chỉ ậm ừ cho qua.\n\nMột đêm, bà mơ thấy mình lạc vào một khu vườn đầy hoa thơm, cỏ lạ. Một ông tiên râu tóc bạc phơ hiện ra, hỏi: Sao bà buồn thế? Bà thở dài: Tôi già rồi, sống một mình, chẳng còn niềm vui gì nữa.\n\nÔng tiên phất tay, khu vườn bỗng hiện ra bao cảnh: những đứa trẻ mồ côi không nơi nương tựa, những cụ già neo đơn không người chăm sóc. Ông tiên nói: Bà thấy không, còn bao người khổ hơn bà mà vẫn sống vui. Niềm vui không phải chờ người khác mang đến, mà do chính mình tạo ra. Hãy mở lòng ra, bà sẽ thấy cuộc đời còn nhiều điều tốt đẹp.\n\nBà tỉnh giấc, trời đã sáng. Lời ông tiên cứ vang vọng bên tai. Hôm đó, bà sang nhà hàng xóm chơi — lần đầu tiên sau bao năm. Bà mang khoai lang sang biếu cụ Tư neo đơn, kể chuyện cổ tích cho lũ trẻ trong xóm nghe. Lũ trẻ quây quần bên bà, ríu rít như chim non.\n\nDần dần, căn nhà nhỏ của bà trở nên rộn rã tiếng cười. Bà dạy lũ trẻ hát những bài đồng dao, kể cho chúng nghe chuyện ngày xưa. Cụ Tư có bầu bạn, lũ trẻ có bà kể chuyện, còn bà — bà tìm lại được niềm vui đã mất từ lâu.\n\nMột năm sau, con cháu về ăn Tết, ngạc nhiên thấy mẹ mình tươi tắn, vui vẻ hẳn ra. Bà cười: Mẹ có cả một khu vườn niềm vui đây này — vừa nói vừa chỉ lũ trẻ đang chơi đùa ngoài sân.\n\nĐêm giao thừa, bà lại mơ thấy ông tiên. Ông mỉm cười: Bà đã tự tạo ra phép màu cho chính mình. Rồi ông tan biến vào ánh sáng. Bà tỉnh dậy, lòng ấm áp lạ thường. Ngoài sân, hoa trong vườn nhà bà đang nở rộ, thơm ngát như khu vườn trong mơ.\n\nCâu 3. Lời dạy của ông tiên có ý nghĩa gì?", "options": ["A. Khuyên bà đi tìm con cháu", "B. Nhắn nhủ triết lí: niềm vui do chính mình tạo ra bằng cách mở lòng, sống vì người khác", "C. Bảo bà đừng buồn vì già", "D. Dặn bà chăm sóc vườn hoa"], "answer": "B", "explain": "\"Niềm vui không phải chờ người khác mang đến, mà do chính mình tạo ra. Hãy mở lòng ra\" — lời dạy là chìa khóa giúp bà thay đổi, cũng là thông điệp nhân sinh của truyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIẤC MƠ CỦA BÀ LÃO\n\nBà cụ Lý sống một mình trong căn nhà nhỏ đầu làng. Con cháu đi làm ăn xa, mỗi năm chỉ về được một lần vào dịp Tết. Bà sống lầm lũi, ít nói cười, hàng xóm sang chơi bà cũng chỉ ậm ừ cho qua.\n\nMột đêm, bà mơ thấy mình lạc vào một khu vườn đầy hoa thơm, cỏ lạ. Một ông tiên râu tóc bạc phơ hiện ra, hỏi: Sao bà buồn thế? Bà thở dài: Tôi già rồi, sống một mình, chẳng còn niềm vui gì nữa.\n\nÔng tiên phất tay, khu vườn bỗng hiện ra bao cảnh: những đứa trẻ mồ côi không nơi nương tựa, những cụ già neo đơn không người chăm sóc. Ông tiên nói: Bà thấy không, còn bao người khổ hơn bà  bạc phơ hiện ra, hỏi: Sao bà buồn thế? Bà thở dài: Tôi già rồi, sống một mình, chẳng còn niềm vui gì nữa.\n\nÔng tiên phất tay, khu vườn bỗng hiện ra bao cảnh: những đứa trẻ mồ côi không nơi nương tựa, những cụ già neo đơn không người chăm sóc. Ông tiên nói: Bà thấy không, còn bao người khổ hơn bà mà vẫn sống vui. Niềm vui không phải chờ người khác mang đến, mà do chính mình tạo ra. Hãy mở lòng ra, bà sẽ thấy cuộc đời còn nhiều điều tốt đẹp.\n\nBà tỉnh giấc, trời đã sáng. Lời ông tiên cứ vang vọng bên tai. Hôm đó, bà sang nhà hàng xóm chơi — lần đầu tiên sau bao năm. Bà mang khoai lang sang biếu cụ Tư neo đơn, kể chuyện cổ tích cho lũ trẻ trong xóm nghe. Lũ trẻ quây quần bên bà, ríu rít như chim non.\n\nDần dần, căn nhà nhỏ của bà trở nên rộn rã tiếng cười. Bà dạy lũ trẻ hát những bài đồng dao, kể cho chúng nghe chuyện ngày xưa. Cụ Tư có bầu bạn, lũ trẻ có bà kể chuyện, còn bà — bà tìm lại được niềm vui đã mất từ lâu.\n\nMột năm sau, con cháu về ăn Tết, ngạc nhiên thấy mẹ mình tươi tắn, vui vẻ hẳn ra. Bà cười: Mẹ có cả một khu vườn niềm vui đây này — vừa nói vừa chỉ lũ trẻ đang chơi đùa ngoài sân.\n\nĐêm giao thừa, bà lại mơ thấy ông tiên. Ông mỉm cười: Bà đã tự tạo ra phép màu cho chính mình. Rồi ông tan biến vào ánh sáng. Bà tỉnh dậy, lòng ấm áp lạ thường. Ngoài sân, hoa trong vườn nhà bà đang nở rộ, thơm ngát như khu vườn trong mơ.\n\nCâu 5. Qua truyện, em rút ra bài học gì về cách tìm niềm vui trong cuộc sống? (Trả lời ngắn gọn)", "answer": "Mở lòng, sống vì người khác thì sẽ tìm thấy niềm vui", "explain": "Chấp nhận các cách diễn đạt tương đương: niềm vui do mình tạo ra; đừng khép mình; quan tâm, chia sẻ với mọi người; người già cần được quan tâm...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về cách sống lạc quan, yêu đời.", "explain": "DÀN Ý:\n1. Mở đoạn: lạc quan là thái độ sống tích cực, cần thiết với mỗi người.\n2. Thân đoạn: (a) Biểu hiện: như bà cụ Lý mở lòng tìm niềm vui; nhìn khó khăn bằng con mắt tích cực; (b) Ý nghĩa: giúp vượt qua nghịch cảnh, lan tỏa năng lượng tốt; (c) Phê phán thói bi quan, chán nản, khép mình.\n3. Kết đoạn: hãy chủ động tạo niềm vui.\n\nBÀI MẪU:\nSống lạc quan, yêu đời là thái độ sống tích cực mà mỗi con người cần nuôi dưỡng. Lạc quan không có nghĩa là phủ nhận khó khăn, mà là dám đối mặt với nó bằng niềm tin vào điều tốt đẹp — như bà cụ Lý trong truyện, từ chỗ lầm lũi, buồn bã đã mở lòng ra, tìm thấy niềm vui trong việc quan tâm đến mọi người xung quanh. Người lạc quan luôn nhìn thấy cơ hội trong khó khăn, biến nghịch cảnh thành động lực vươn lên; họ không chỉ hạnh phúc hơn mà còn lan tỏa năng lượng tích cực đến những người xung quanh. Ngược lại, kẻ bi quan, chán nản sẽ tự giam mình trong bóng tối, bỏ lỡ bao điều tốt đẹp của cuộc sống và làm cho những người bên cạnh cũng nặng nề theo. Niềm vui, như lời ông tiên nhắn nhủ, không phải chờ người khác mang đến mà do chính mình tạo ra. Vì vậy, dù hoàn cảnh ra sao, hãy học cách mỉm cười, mở lòng và sống hết mình — bởi thái độ sống quyết định chất lượng cuộc sống của mỗi chúng ta.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích vai trò của yếu tố kì ảo (giấc mơ gặp ông tiên) trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và yếu tố kì ảo (giấc mơ) — cầu nối giữa bế tắc và đổi thay.\nII. Thân bài:\n1. Yếu tố kì ảo: giấc mơ gặp ông tiên trong khu vườn hoa — hoang đường, đẹp đẽ.\n2. Vai trò:\n   a. Tạo bước ngoặt cho cốt truyện: từ bế tắc (bà lầm lũi) đến đổi thay (bà mở lòng).\n   b. Là phương tiện truyền tải triết lí: lời ông tiên là thông điệp về cách tìm niềm vui.\n   c. Mang ý nghĩa biểu tượng: khu vườn mơ là khát vọng về cuộc sống tươi đẹp; ông tiên là tiếng nói của lương tri, của khát vọng đổi thay trong chính bà.\n   d. Tạo sức hấp dẫn: giấc mơ đẹp, kì ảo lôi cuốn người đọc.\n3. Mối quan hệ với hiện thực: giấc mơ chỉ có ý nghĩa khi bà hành động ngoài đời thực — khẳng định vai trò của con người.\n4. Nghệ thuật: kết hợp mơ và thực nhuần nhuyễn; giọng văn nhẹ nhàng, ấm áp.\nIII. Kết bài: khẳng định giá trị; bài học về cách sống.\n\nĐOẠN MẪU (mở bài):\nGiấc mơ là mảnh đất màu mỡ của yếu tố kì ảo trong văn học — nơi hiện thực và hoang đường gặp gỡ, nơi những thông điệp sâu xa được gửi gắm một cách tự nhiên nhất. Truyện ngắn Giấc mơ của bà lão đã sử dụng thành công yếu tố kì ảo này: giấc mơ gặp ông tiên trở thành bước ngoặt giúp nhân vật từ bế tắc, cô đơn tìm lại niềm vui sống. Qua đó, tác phẩm gửi gắm một triết lí nhân sinh thấm thía về cách con người tạo dựng hạnh phúc cho chính mình.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÂY KHẾ BIẾT NÓI\n\nSau vườn nhà ông Ba có một cây khế cổ thụ, thân sần sùi, tán lá xum xuê. Tương truyền cây khế đã có từ thời ông cố của ông Ba, chứng kiến bao thăng trầm của gia đình.\n\nThằng Tèo, cháu nội ông Ba, rất thích trèo lên cây khế chơi. Một buổi trưa hè, khi đang nằm vắt vẻo trên cành, Tèo bỗng nghe thấy tiếng nói trầm ấm vang lên: Cháu ngoan, đừng bẻ cành của ta đau.\n\nTèo giật mình nhìn quanh, không thấy ai. Tiếng nói lại vang lên: Ta là cây khế đây. Ta đã sống hơn trăm năm, chứng kiến bốn thế hệ gia đình cháu khôn lớn.\n\nTừ hôm đó, Tèo thường ra tâm sự với cây khế. Cây kể cho Tèo nghe bao chuyện: thời ông cố còn nghèo khó, cả nhà trông vào mấy quả khế chua để qua bữa; thời chiến tranh, cây khế che giấu cán bộ trong tán lá rậm rạp; rồi thời cha của Tèo còn bé, hay trèo cây hái khế cho mẹ nấu canh chua.\n\nCây khế dặn Tèo: Con người ai cũng có cội nguồn như ta có rễ. Rễ càng sâu, cây càng vững. Cháu hãy nhớ về cội nguồn, biết ơn những người đi trước đã vun trồng cho mình có ngày hôm nay.\n\nTèo đem chuyện kể cho ông Ba nghe. Ông Ba cười, xoa đầu cháu: Cây khế không biết nói đâu con, nhưng những điều nó dạy con đều là thật. Ông cố trồng cây này với mong muốn con cháu đời đời nhớ về gốc rễ.\n\nTừ đó, Tèo càng yêu quý cây khế. Cậu chăm sóc nó cẩn thận, không bao giờ bẻ cành, hái lá bừa bãi. Mỗi mùa khế chín, Tèo hái những quả ngọt nhất biếu ông Ba, biếu hàng xóm. Nhìn cây khế trĩu quả, Tèo thầm nhủ sẽ sống xứng đáng như lời cây dặn: nhớ về cội nguồn, biết ơn người đi trước.\n\nCâu 1. Yếu tố kì ảo trong truyện là gì?", "options": ["A. Cây khế cổ thụ", "B. Cây khế biết nói, kể chuyện cho Tèo nghe", "C. Thằng Tèo thích trèo cây", "D. Quả khế chua"], "answer": "B", "explain": "Cây cối biết nói là yếu tố hoang đường, vượt ngoài hiện thực — yếu tố kì ảo trung tâm, tạo nên sức hấp dẫn đặc biệt cho truyện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÂY KHẾ BIẾT NÓI\n\nSau vườn nhà ông Ba có một cây khế cổ thụ, thân sần sùi, tán lá xum xuê. Tương truyền cây khế đã có từ thời ông cố của ông Ba, chứng kiến bao thăng trầm của gia đình.\n\nThằng Tèo, cháu nội ông Ba, rất thích trèo lên cây khế chơi. Một buổi trưa hè, khi đang nằm vắt vẻo trên cành, Tèo bỗng nghe thấy tiếng nói trầm ấm vang lên: Cháu ngoan, đừng bẻ cành của ta đau.\n\nTèo giật mình nhìn quanh, không thấy ai. Tiếng nói lại vang lên: Ta là cây khế đây. Ta đã sống hơn trăm năm, chứng kiến bốn thế hệ gia đình cháu khôn lớn.\n\nTừ hôm đó, Tèo thường ra tâm sự với cây khế. Cây kể cho Tèo nghe bao chuyện: thời ông cố còn nghèo khó, cả nhà trông vào mấy quả khế chua để qua bữa; thời chiến tranh, cây khế che giấu cán bộ trong tán lá rậm rạp; rồi thời cha của Tèo còn bé, hay trèo cây hái khế cho mẹ nấu canh chua.\n\nCây khế dặn Tèo: Con người ai cũng có cội nguồn như ta có rễ. Rễ càng sâu, cây càng vững. Cháu hãy nhớ về cội nguồn, biết ơn những người đi trước đã vun trồng cho mình có ngày hôm nay.\n\nTèo đem chuyện kể cho ông Ba nghe. Ông Ba cười, xoa đầu cháu: Cây khế không biết nói đâu con, nhưng những điều nó dạy con đều là thật. Ông cố trồng cây này với mong muốn con cháu đời đời nhớ về gốc rễ.\n\nTừ đó, Tèo càng yêu quý cây khế. Cậu chăm sóc nó cẩn thận, không bao giờ bẻ cành, hái lá bừa bãi. Mỗi mùa khế chín, Tèo hái những quả ngọt nhất biếu ông Ba, biếu hàng xóm. Nhìn cây khế trĩu quả, Tèo thầm nhủ sẽ sống xứng đáng như lời cây dặn: nhớ về cội nguồn, biết ơn người đi trước.\n\nCâu 2. Cây khế đã chứng kiến những gì của gia đình?", "options": ["A. Chỉ thấy Tèo chơi đùa", "B. Bốn thế hệ: từ thời ông cố nghèo khó, thời chiến tranh che giấu cán bộ, đến thời cha của Tèo", "C. Chỉ thấy ông Ba trồng rau", "D. Không chứng kiến gì"], "answer": "B", "explain": "Cây khế kể: đã sống hơn trăm năm, chứng kiến bốn thế hệ — từ thời ông cố nghèo khó đến thời chiến tranh và thời cha của Tèo còn bé.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÂY KHẾ BIẾT NÓI\n\nSau vườn nhà ông Ba có một cây khế cổ thụ, thân sần sùi, tán lá xum xuê. Tương truyền cây khế đã có từ thời ông cố của ông Ba, chứng kiến bao thăng trầm của gia đình.\n\nThằng Tèo, cháu nội ông Ba, rất thích trèo lên cây khế chơi. Một buổi trưa hè, khi đang nằm vắt vẻo trên cành, Tèo bỗng nghe thấy tiếng nói trầm ấm vang lên: Cháu ngoan, đừng bẻ cành của ta đau.\n\nTèo giật mình nhìn quanh, không thấy ai. Tiếng nói lại vang lên: Ta là cây khế đây. Ta đã sống hơn trăm năm, chứng kiến bốn thế hệ gia đình cháu khôn lớn.\n\nTừ hôm đó, Tèo thường ra tâm sự với cây khế. Cây kể cho Tèo nghe bao chuyện: thời ông cố còn nghèo khó, cả nhà trông vào mấy quả khế chua để qua bữa; thời chiến tranh, cây khế che giấu cán bộ trong tán lá rậm rạp; rồi thời cha của Tèo còn bé, hay trèo cây hái khế cho mẹ nấu canh chua.\n\nCây khế dặn Tèo: Con người ai cũng có cội nguồn như ta có rễ. Rễ càng sâu, cây càng vững. Cháu hãy nhớ về cội nguồn, biết ơn những người đi trước đã vun trồng cho mình có ngày hôm nay.\n\nTèo đem chuyện kể cho ông Ba nghe. Ông Ba cười, xoa đầu cháu: Cây khế không biết nói đâu con, nhưng những điều nó dạy con đều là thật. Ông cố trồng cây này với mong muốn con cháu đời đời nhớ về gốc rễ.\n\nTừ đó, Tèo càng yêu quý cây khế. Cậu chăm sóc nó cẩn thận, không bao giờ bẻ cành, hái lá bừa bãi. Mỗi mùa khế chín, Tèo hái những quả ngọt nhất biếu ông Ba, biếu hàng xóm. Nhìn cây khế trĩu quả, Tèo thầm nhủ sẽ sống xứng đáng như lời cây dặn: nhớ về cội nguồn, biết ơn người đi trước.\n\nCâu 3. Lời dặn của cây khế \"Rễ càng sâu, cây càng vững. Cháu hãy nhớ về cội nguồn\" có ý nghĩa gì?", "options": ["A. Dạy Tèo cách trồng cây", "B. Nhắn nhủ triết lí: con người phải nhớ về cội nguồn, biết ơn người đi trước thì mới vững vàng trong cuộc sống", "C. Khoe cây có rễ sâu", "D. Bảo Tèo đừng trèo cây"], "answer": "B", "explain": "Bằng hình ảnh ẩn dụ (rễ cây — cội nguồn), cây khế gửi gắm triết lí nhân sinh: lòng biết ơn cội nguồn là nền tảng vững chắc cho mỗi con người — thông điệp sâu sắc được diễn đạt qua yếu tố kì ảo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÂY KHẾ BIẾT NÓI\n\nSau vườn nhà ông Ba có một cây khế cổ thụ, thân sần sùi, tán lá xum xuê. Tương truyền cây khế đã có từ thời ông cố của ông Ba, chứng kiến bao thăng trầm của gia đình.\n\nThằng Tèo, cháu nội ông Ba, rất thích trèo lên cây khế chơi. Một buổi trưa hè, khi đang nằm vắt vẻo trên cành, Tèo bỗng nghe thấy tiếng nói trầm ấm vang lên: Cháu ngoan, đừng bẻ cành của ta đau.\n\nTèo giật mình nhìn quanh, không thấy ai. Tiếng nói lại vang lên: Ta là cây khế đây. Ta đã sống hơn trăm năm, chứng kiến bốn thế hệ gia đình cháu khôn lớn.\n\nTừ hôm đó, Tèo thường ra tâm sự với cây khế. Cây kể cho Tèo nghe bao chuyện: thời ông cố còn nghèo khó, cả nhà trông vào mấy quả khế chua để qua bữa; thời chiến tranh, cây khế che giấu cán bộ trong tán lá rậm rạp; rồi thời cha của Tèo còn bé, hay trèo cây hái khế cho mẹ nấu canh chua.\n\nCây khế dặn Tèo: Con người ai cũng có cội nguồn như ta có rễ. Rễ càng sâu, cây càng vững. Cháu hãy nhớ về cội nguồn, biết ơn những người đi trước đã vun trồng cho mình có ngày hôm nay.\n\nTèo đem chuyện kể cho ông Ba nghe. Ông Ba cười, xoa đầu cháu: Cây khế không biết nói đâu con, nhưng những điều nó dạy con đều là thật. Ông cố trồng cây này với mong muốn con cháu đời đời nhớ về gốc rễ.\n\nTừ đó, Tèo càng yêu quý cây khế. Cậu chăm sóc nó cẩn thận, không bao giờ bẻ cành, hái lá bừa bãi. Mỗi mùa khế chín, Tèo hái những quả ngọt nhất biếu ông Ba, biếu hàng xóm. Nhìn cây khế trĩu quả, Tèo thầm nhủ sẽ sống xứng đáng như lời cây dặn: nhớ về cội nguồn, biết ơn người đi trước.\n\nCâu 4. Vì sao tác giả để cây khế biết nói thay vì để ông Ba trực tiếp dạy Tèo?", "options": ["A. Vì ông Ba không biết dạy cháu", "B. Yếu tố kì ảo tạo sự hấp dẫn, mới lạ, khiến bài học về cội nguồn thấm thía, khó quên hơn", "C. Vì Tèo không nghe lời ông", "D. Để câu chuyện dài hơn"], "answer": "B", "explain": "Đây là dụng ý nghệ thuật: lời dạy qua miệng cây khế trăm tuổi — nhân chứng của lịch sử gia đình — có sức nặng và sức hấp dẫn hơn lời dạy thông thường; yếu tố kì ảo làm cho triết lí trở nên sinh động.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÂY KHẾ BIẾT NÓI\n\nSau vườn nhà ông Ba có một cây khế cổ thụ, thân sần sùi, tán lá xum xuê. Tương truyền cây khế đã có từ thời ông cố của ông Ba, chứng kiến bao thăng trầm của gia đình.\n\nThằng Tèo, cháu nội ông Ba, rất thích trèo lên cây khế chơi. Một buổi trưa hè, khi đang nằm vắt vẻo trên cành, Tèo bỗng nghe thấy tiếng nói trầm ấm vang lên: Cháu ngoan, đừng bẻ cành của ta đau.\n\nTèo giật mình nhìn quanh, không thấy ai. Tiếng nói lại vang lên: Ta là cây khế đây. Ta đã sống hơn trăm năm, chứng kiến bốn thế hệ gia đình cháu khôn lớn.\n\nTừ hôm đó, Tèo thường ra tâm sự với cây khế. Cây kể cho Tèo nghe bao chuyện: thời ông cố còn nghèo khó, cả nhà trông vào mấy quả khế chua để qua bữa; thời chiến tranh, cây khế che giấu cán bộ trong tán lá rậm rạp; rồi thời cha của Tèo còn bé, hay trèo cây hái khế cho mẹ nấu canh chua.\n\nCây khế dặn Tèo: Con người ai cũng có cội nguồn như ta có rễ. Rễ càng sâu, cây càng vững. Cháu hãy nhớ về cội nguồn, biết ơn những người đi trước đã vun trồng cho mình có ngày hôm nay.\n\nTèo đem chuyện kể cho ông Ba nghe. Ông Ba cười, xoa đầu cháu: Cây khế không biết nói đâu con, nhưng những điều nó dạy con đều là thật. Ông cố trồng cây này với mong muốn con cháu đời đời nhớ về gốc rễ.\n\nTừ đó, Tèo càng yêu quý cây khế. Cậu chăm sóc nó cẩn thận, không bao giờ bẻ cành, hái lá bừa bãi. Mỗi mùa khế chín, Tèo hái những quả ngọt nhất biếu ông Ba, biếu hàng xóm. Nhìn cây khế trĩu quả, Tèo thầm nhủ sẽ sống xứng đáng như lời cây dặn: nhớ về cội nguồn, biết ơn người đi trước.\n\nCâu 5. Qua truyện, em hiểu thêm điều gì về đạo lí uống nước nhớ nguồn? (Trả lời ngắn gọn)", "answer": "Phải nhớ về cội nguồn, biết ơn người đi trước", "explain": "Chấp nhận các cách diễn đạt tương đương: rễ sâu cây vững — người nhớ cội nguồn mới vững vàng; biết ơn ông bà, cha mẹ, quê hương...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của việc nhớ về cội nguồn.", "explain": "DÀN Ý:\n1. Mở đoạn: nhớ về cội nguồn là đạo lí quý báu, là nền tảng tinh thần.\n2. Thân đoạn: (a) Ý nghĩa: biết mình từ đâu đến; trân trọng công lao người đi trước như cây khế nhắc Tèo; tạo sức mạnh, niềm tự hào; (b) Phê phán thói quên cội nguồn, sính ngoại, vô ơn.\n3. Kết đoạn: hãy giữ gìn đạo lí tốt đẹp.\n\nBÀI MẪU:\nNhớ về cội nguồn là đạo lí quý báu của dân tộc ta, là nền tảng tinh thần vững chắc cho mỗi con người. Cội nguồn là cha mẹ, ông bà, là quê hương, là những thế hệ đi trước đã đổ mồ hôi, xương máu để ta có cuộc sống hôm nay. Nhớ về cội nguồn giúp ta hiểu mình từ đâu đến, trân trọng những gì mình đang có và có thêm sức mạnh để vươn lên — như lời cây khế dặn Tèo: rễ càng sâu, cây càng vững. Người nhớ về cội nguồn sẽ sống có trách nhiệm, biết ơn và tự hào về truyền thống gia đình, quê hương, đất nước. Ngược lại, kẻ quên cội nguồn, sính ngoại, vô ơn với người đi trước chẳng khác nào cây không rễ — dễ đổ ngã trước phong ba. Trong xã hội hiện đại với nhiều biến động, đạo lí uống nước nhớ nguồn càng cần được giữ gìn. Mỗi chúng ta hãy thể hiện lòng biết ơn cội nguồn bằng hành động cụ thể: hiếu thảo với ông bà cha mẹ, trân trọng truyền thống quê hương, sống xứng đáng với sự hy sinh của các thế hệ đi trước.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ về hiện tượng vay mượn, cải biến mô típ dân gian trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và mô típ cây biết nói (vay mượn từ truyện cổ dân gian) được cải biến, sáng tạo.\nII. Thân bài:\n1. Vay mượn: mô típ vật biết nói quen thuộc trong truyện cổ tích, thần thoại (cây, vật thành tinh).\n2. Cải biến, sáng tạo:\n   a. Không phải cổ tích xa xưa mà đặt trong đời sống hiện đại (gia đình ông Ba, cậu bé Tèo).\n   b. Cây khế không ban phép màu mà truyền dạy triết lí về cội nguồn — sáng tạo mới mẻ.\n   c. Gắn với lịch sử gia đình cụ thể (bốn thế hệ) — tính hiện thực đậm đà.\n3. Giá trị của sự sáng tạo: làm mới mô típ cũ, gửi gắm thông điệp phù hợp thời đại; chứng tỏ sức sống của chất liệu dân gian.\n4. Bài học: vay mượn là quy luật sáng tạo, nhưng phải cải biến, sáng tạo mới có giá trị; sao chép máy móc sẽ sáo rỗng.\nIII. Kết bài: khẳng định sáng tạo là linh hồn của văn học.\n\nĐOẠN MẪU (mở bài):\nVay mượn chất liệu dân gian rồi cải biến, sáng tạo thành tác phẩm mới là quy luật phổ biến của văn học. Truyện ngắn Cây khế biết nói là một minh chứng sinh động: tác giả đã vay mượn mô típ quen thuộc cây biết nói từ truyện cổ dân gian, nhưng bằng sự sáng tạo độc đáo đã thổi vào đó hơi thở của đời sống hiện đại và một thông điệp mới mẻ về cội nguồn. Phân tích sự vay mượn, cải biến này giúp ta hiểu sâu hơn về quy luật sáng tạo trong văn học.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC ĐỒNG HỒ QUAY NGƯỢC\n\nNhân dịp sinh nhật, Minh được ông nội tặng một chiếc đồng hồ quả quýt cũ kĩ. Ông dặn: Đây là kỉ vật của gia đình, con hãy giữ gìn cẩn thận.\n\nMột hôm, Minh vặn núm đồng hồ ngược chiều kim. Bỗng mọi thứ xung quanh quay cuồng, và khi mở mắt ra, Minh thấy mình đang đứng trước cổng trường — nhưng là ngôi trường của... mười năm về trước, khi Minh mới vào lớp một.\n\nMinh gặp chính mình của ngày xưa: cậu bé nhút nhát, hay khóc nhè, bị bạn trêu chọc. Minh muốn chạy đến ôm lấy mình ngày xưa, muốn nói: Đừng sợ, hãy mạnh dạn lên, mọi chuyện rồi sẽ ổn thôi. Nhưng cậu không thể chạm vào quá khứ — cậu chỉ là người quan sát vô hình.\n\nRồi cảnh vật lại thay đổi. Minh thấy mình năm lớp chín: vì mải chơi game mà bỏ bê học hành, khiến cha mẹ buồn lòng. Minh ước gì có thể quay lại để nói với mình rằng: Đừng phí hoài thời gian, hãy trân trọng từng ngày.\n\nKhi Minh tỉnh lại, cậu vẫn đang ngồi trong phòng mình, chiếc đồng hồ nằm im trên bàn. Tất cả chỉ diễn ra trong vài phút. Nhưng Minh hiểu ra một điều: quá khứ không thể thay đổi, nhưng tương lai thì có thể. Chiếc đồng hồ không cho cậu quay ngược thời gian thật sự — nó chỉ cho cậu thấy những gì cậu đã đánh mất để cậu biết trân trọng hiện tại.\n\nTừ hôm đó, Minh thay đổi. Cậu học tập chăm chỉ, dành thời gian cho gia đình, không còn đắm chìm vào game. Mỗi khi nhìn chiếc đồng hồ, Minh lại nhớ: đừng để phải ước mình có thể quay ngược thời gian.\n\nNhiều năm sau, Minh trở thành một kĩ sư giỏi. Trong ngăn kéo bàn làm việc, chiếc đồng hồ quả quýt cũ vẫn được giữ gìn cẩn thận — không phải vì nó có phép màu, mà vì nó đã dạy cho Minh bài học quý giá nhất: hãy sống trọn vẹn từng phút giây của hiện tại.\n\nCâu 1. Yếu tố kì ảo trong truyện là gì?", "options": ["A. Chiếc đồng hồ quả quýt cũ", "B. Vặn núm đồng hồ ngược chiều khiến Minh quay về quá khứ quan sát chính mình", "C. Ông nội tặng quà", "D. Minh trở thành kĩ sư"], "answer": "B", "explain": "Khả năng quay ngược thời gian về quá khứ là yếu tố ho h thời gian cho gia đình, không còn đắm chìm vào game. Mỗi khi nhìn chiếc đồng hồ, Minh lại nhớ: đừng để phải ước mình có thể quay ngược thời gian.\n\nNhiều năm sau, Minh trở thành một kĩ sư giỏi. Trong ngăn kéo bàn làm việc, chiếc đồng hồ quả quýt cũ vẫn được giữ gìn cẩn thận — không phải vì nó có phép màu, mà vì nó đã dạy cho Minh bài học quý giá nhất: hãy sống trọn vẹn từng phút giây của hiện tại.\n\nCâu 4. Chiếc đồng hồ trong truyện tượng trưng cho điều gì?", "options": ["A. Sự giàu có của gia đình", "B. Thời gian và bài học về việc trân trọng hiện tại — đừng để phải ước quay ngược thời gian", "C. Tình cảm ông cháu", "D. Kĩ thuật chế tác đồng hồ"], "answer": "B", "explain": "Chiếc đồng hồ vừa là kỉ vật gia đình vừa là biểu tượng của thời gian; hành trình kì ảo của nó gửi gắm thông điệp: hãy sống trọn vẹn từng phút giây hiện tại.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC ĐỒNG HỒ QUAY NGƯỢC\n\nNhân dịp sinh nhật, Minh được ông nội tặng một chiếc đồng hồ quả quýt cũ kĩ. Ông dặn: Đây là kỉ vật của gia đình, con hãy giữ gìn cẩn thận.\n\nMột hôm, Minh vặn núm đồng hồ ngược chiều kim. Bỗng mọi thứ xung quanh quay cuồng, và khi mở mắt ra, Minh thấy mình đang đứng trước cổng trường — nhưng là ngôi trường của... mười năm về trước, khi Minh mới vào lớp một.\n\nMinh gặp chính mình của ngày xưa: cậu bé nhút nhát, hay khóc nhè, bị bạn trêu chọc. Minh muốn chạy đến ôm lấy mình ngày xưa, muốn nói: Đừng sợ, hãy mạnh dạn lên, mọi chuyện rồi sẽ ổn thôi. Nhưng cậu không thể chạm vào quá khứ — cậu chỉ là người quan sát vô hình.\n\nRồi cảnh vật lại thay đổi. Minh thấy mình năm lớp chín: vì mải chơi game mà bỏ bê học hành, khiến cha mẹ buồn lòng. Minh ước gì có thể quay lại để nói với mình rằng: Đừng phí hoài thời gian, hãy trân trọng từng ngày.\n\nKhi Minh tỉnh lại, cậu vẫn đang ngồi trong phòng mình, chiếc đồng hồ nằm im trên bàn. Tất cả chỉ diễn ra trong vài phút. Nhưng Minh hiểu ra một điều: quá khứ không thể thay đổi, nhưng tương lai thì có thể. Chiếc đồng hồ không cho cậu quay ngược thời gian thật sự — nó chỉ cho cậu thấy những gì cậu đã đánh mất để cậu biết trân trọng hiện tại.\n\nTừ hôm đó, Minh thay đổi. Cậu học tập chăm chỉ, dành thời gian cho gia đình, không còn đắm chìm vào game. Mỗi khi nhìn chiếc đồng hồ, Minh lại nhớ: đừng để phải ước mình có thể quay ngược thời gian.\n\nNhiều năm sau, Minh trở thành một kĩ sư giỏi. Trong ngăn kéo bàn làm việc, chiếc đồng hồ quả quýt cũ vẫn được giữ gìn cẩn thận — không phải vì nó có phép màu, mà vì nó đã dạy cho Minh bài học quý giá nhất: hãy sống trọn vẹn từng phút giây của hiện tại.\n\nCâu 5. Qua truyện, em rút ra bài học gì về cách sử dụng thời gian? (Trả lời ngắn gọn)", "answer": "Trân trọng hiện tại, không lãng phí thời gian vì quá khứ không thể thay đổi", "explain": "Chấp nhận các cách diễn đạt tương đương: sống trọn vẹn từng phút giây; đừng mải chơi để phải hối tiếc; quá khứ là bài học, tương lai do hiện tại quyết định...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của việc sống trọn vẹn từng phút giây.", "explain": "DÀN Ý:\n1. Mở đoạn: quá khứ không thể thay đổi, hãy sống trọn vẹn hiện tại.\n2. Thân đoạn: (a) Ý nghĩa: mỗi phút giây đều quý giá; sống trọn vẹn giúp không hối tiếc như Minh trong truyện; (b) Biểu hiện: tập trung học tập, quan tâm người thân, làm việc có ích; (c) Phê phán lối sống lãng phí thời gian, mải mê vô bổ.\n3. Kết đoạn: hãy bắt đầu từ hôm nay.\n\nBÀI MẪU:\nQuá khứ là điều không thể thay đổi, vì vậy cách tốt nhất để không phải hối tiếc là sống trọn vẹn từng phút giây của hiện tại — đó là bài học sâu sắc từ câu chuyện Chiếc đồng hồ quay ngược. Minh được quay về quá khứ nhưng chỉ có thể đứng nhìn, không thể sửa chữa những sai lầm; điều duy nhất cậu làm được là thay đổi chính mình từ hôm nay. Trong cuộc sống, mỗi phút giây trôi qua đều là duy nhất và không bao giờ trở lại. Sống trọn vẹn nghĩa là tập trung hết mình cho việc đang làm: học tập chăm chỉ khi ngồi trên ghế nhà trường, dành thời gian chất lượng cho gia đình, làm những việc có ích cho cộng đồng. Ngược lại, những ai lãng phí thời gian vào game, mạng xã hội hay những thú vui vô bổ sớm muộn cũng phải hối tiếc như Minh đã từng ước mình có thể quay ngược thời gian. Đừng để đến khi nhìn lại mới thấy thanh xuân đã trôi qua vô ích. Hãy sống sao cho mỗi ngày đều có ý nghĩa — đó là cách duy nhất để ta không bao giờ phải ước: giá như thời gian quay trở lại.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích ý nghĩa triết lí của yếu tố kì ảo trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và yếu tố kì ảo (quay ngược thời gian) — phương tiện chuyển tải triết lí nhân sinh.\nII. Thân bài:\n1. Yếu tố kì ảo: vặn núm đồng hồ ngược chiều để về quá khứ — mô típ quen thuộc được sử dụng sáng tạo.\n2. Ý nghĩa triết lí:\n   a. Quá khứ không thể thay đổi: Minh chỉ là người quan sát vô hình — chân lí về tính một chiều của thời gian.\n   b. Hiện tại mới là điều ta nắm giữ: bài học rút ra là thay đổi từ hôm nay.\n   c. Sự hối tiếc là vô ích nếu không chuyển thành hành động.\n3. Vai trò nghệ thuật: tạo tình huống độc đáo để nhân vật tự nhận thức; kết hợp kì ảo và hiện thực nhuần nhuyễn; chi tiết đồng hồ giàu tính biểu tượng.\n4. Liên hệ: đây cũng là cách các truyện kì ảo kinh điển dùng cái hoang đường để nói về chân lí đời sống.\nIII. Kết bài: khẳng định giá trị; bài học cho người đọc.\n\nĐOẠN MẪU (mở bài):\nƯớc mơ quay ngược thời gian để sửa chữa sai lầm là khát vọng muôn thuở của con người, và văn học đã nhiều lần hiện thực hóa khát vọng ấy bằng yếu tố kì ảo. Truyện ngắn Chiếc đồng hồ quay ngược cũng xây dựng một chuyến hành trình về quá khứ đầy hấp dẫn, nhưng điều đặc biệt là tác giả không dùng nó để nuông chiều ảo tưởng mà để khẳng định một triết lí sâu sắc: quá khứ không thể thay đổi, chỉ có hiện tại mới nằm trong tay ta. Phân tích yếu tố kì ảo này giúp ta thấy rõ nghệ thuật dùng cái hoang đường để nói về chân lí đời sống.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGÔI SAO ƯỚC NGUYỆN\n\nĐêm nào, bé An cũng ra hiên ngắm sao. Cô bé có một ngôi sao rất sáng mà An gọi là ngôi sao của mình. An thường thì thầm với nó những ước nguyện: ước mẹ khỏi bệnh, ước cha bớt vất vả, ước mình học giỏi.\n\nMột đêm, khi An đang thì thầm, ngôi sao bỗng nhấp nháy lạ thường và một giọng nói trong trẻo vang lên: Ta nghe thấy ước nguyện của con. Nhưng con có biết không, ngôi sao chỉ sáng cho những ai biết tự mình cố gắng.\n\nAn ngạc nhiên: Sao lại thế ạ? Giọng nói đáp: Ước nguyện mà không hành động thì chỉ là mơ mộng. Con ước mẹ khỏi bệnh — con đã giúp mẹ uống thuốc đúng giờ chưa? Con ước cha bớt vất vả — con đã đỡ đần cha việc nhà chưa? Con ước học giỏi — con đã chăm chỉ học bài chưa?\n\nAn cúi đầu xấu hổ. Quả thật, cô bé chỉ biết ước mà chưa bao giờ nghĩ mình phải làm gì. Từ hôm đó, An thay đổi. Cô bé nhắc mẹ uống thuốc đúng giờ, phụ cha quét nhà, nấu cơm, và mỗi tối đều học bài chăm chỉ trước khi ra hiên ngắm sao.\n\nKì lạ thay, từ ngày An thay đổi, ngôi sao của cô bé dường như sáng hơn mỗi đêm. Mẹ An khỏe dần lên, cha An cười nhiều hơn, và cuối năm, An đạt học sinh giỏi.\n\nĐêm nhận giấy khen, An chạy ra hiên, reo lên với ngôi sao: Con cảm ơn ngôi sao! Giọng nói trong trẻo lại vang lên, lần này đầy ấm áp: Không phải ta làm nên điều kì diệu, chính con đã tự tạo ra phép màu bằng sự cố gắng của mình. Ngôi sao chỉ soi đường cho những ai dám bước đi.\n\nTừ đó, An hiểu ra: ước nguyện chỉ thành hiện thực khi ta dám hành động. Và mỗi đêm, ngôi sao vẫn sáng — như lời nhắc nhở dịu dàng rằng phép màu luôn nằm trong chính sự nỗ lực của con người.\n\nCâu 1. Yếu tố kì ảo trong truyện là gì?", "options": ["A. Bé An thích ngắm sao", "B. Ngôi sao biết nói chuyện với An", "C. Mẹ An bị bệnh", "D. An đạt học sinh giỏi"], "answer": "B", "explain": "Ngôi sao biết nói, đối thoại với con người là yếu tố hoang đường, kì ảo — trung tâm của câu chuyện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGÔI SAO ƯỚC NGUYỆN\n\nĐêm nào, bé An cũng ra hiên ngắm sao. Cô bé có một ngôi sao rất sáng mà An gọi là ngôi sao của mình. An thường thì thầm với nó những ước nguyện: ước mẹ khỏi bệnh, ước cha bớt vất vả, ước mình học giỏi.\n\nMột đêm, khi An đang thì thầm, ngôi sao bỗng nhấp nháy lạ thường và một giọng nói trong trẻo vang lên: Ta nghe thấy ước nguyện của con. Nhưng con có biết không, ngôi sao chỉ sáng cho những ai biết tự mình cố gắng.\n\nAn ngạc nhiên: Sao lại thế ạ? Giọng nói đáp: Ước nguyện mà không hành động thì chỉ là mơ mộng. Con ước mẹ khỏi bệnh — con đã giúp mẹ uống thuốc đúng giờ chưa? Con ước cha bớt vất vả — con đã đỡ đần cha việc nhà chưa? Con ước học giỏi — con đã chăm chỉ học bài chưa?\n\nAn cúi đầu xấu hổ. Quả thật, cô bé chỉ biết ước mà chưa bao giờ nghĩ mình phải làm gì. Từ hôm đó, An thay đổi. Cô bé nhắc mẹ uống thuốc đúng giờ, phụ cha quét nhà, nấu cơm, và mỗi tối đều học bài chăm chỉ trước khi ra hiên ngắm sao.\n\nKì lạ thay, từ ngày An thay đổi, ngôi sao của cô bé dường như sáng hơn mỗi đêm. Mẹ An khỏe dần lên, cha An cười nhiều hơn, và cuối năm, An đạt học sinh giỏi.\n\nĐêm nhận giấy khen, An chạy ra hiên, reo lên với ngôi sao: Con cảm ơn ngôi sao! Giọng nói trong trẻo lại vang lên, lần này đầy ấm áp: Không phải ta làm nên điều kì diệu, chính con đã tự tạo ra phép màu bằng sự cố gắng của mình. Ngôi sao chỉ soi đường cho những ai dám bước đi.\n\nTừ đó, An hiểu ra: ước nguyện chỉ thành hiện thực khi ta dám hành động. Và mỗi đêm, ngôi sao vẫn sáng — như lời nhắc nhở dịu dàng rằng phép màu luôn nằm trong chính sự nỗ lực của con người.\n\nCâu 2. Ngôi sao đã dạy An điều gì?", "options": ["A. Cứ ước là sẽ được", "B. Ước nguyện chỉ thành hiện thực khi biết hành động, cố gắng; ngôi sao chỉ soi đường cho người dám bước đi", "C. Đừng bao giờ ước nguyện", "D. Ngôi sao có phép màu vạn năng"], "answer": "B", "explain": "Lời ngôi sao: \"Ước nguyện mà không hành động thì chỉ là mơ mộng\" và \"ngôi sao chỉ soi đường cho những ai dám bước đi\" — bài học về sự kết hợp giữa ước mơ và hành động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGÔI SAO ƯỚC NGUYỆN\n\nĐêm nào, bé An cũng ra hiên ngắm sao. Cô bé có một ngôi sao rất sáng mà An gọi là ngôi sao của mình. An thường thì thầm với nó những ước nguyện: ước mẹ khỏi bệnh, ước cha bớt vất vả, ước mình học giỏi.\n\nMột đêm, khi An đang thì thầm, ngôi sao bỗng nhấp nháy lạ thường và một giọng nói trong trẻo vang lên: Ta nghe thấy ước nguyện của con. Nhưng con có biết không, ngôi sao chỉ sáng cho những ai biết tự mình cố gắng.\n\nAn ngạc nhiên: Sao lại thế ạ? Giọng nói đáp: Ước nguyện mà không hành động thì chỉ là mơ mộng. Con ước mẹ khỏi bệnh — con đã giúp mẹ uống thuốc đúng giờ chưa? Con ước cha bớt vất vả — con đã đỡ đần cha việc nhà chưa? Con ước học giỏi — con đã chăm chỉ học bài chưa?\n\nAn cúi đầu xấu hổ. Quả thật, cô bé chỉ biết ước mà chưa bao giờ nghĩ mình phải làm gì. Từ hôm đó, An thay đổi. Cô bé nhắc mẹ uống thuốc đúng giờ, phụ cha quét nhà, nấu cơm, và mỗi tối đều học bài chăm chỉ trước khi ra hiên ngắm sao.\n\nKì lạ thay, từ ngày An thay đổi, ngôi sao của cô bé dường như sáng hơn mỗi đêm. Mẹ An khỏe dần lên, cha An cười nhiều hơn, và cuối năm, An đạt học sinh giỏi.\n\nĐêm nhận giấy khen, An chạy ra hiên, reo lên với ngôi sao: Con cảm ơn ngôi sao! Giọng nói trong trẻo lại vang lên, lần này đầy ấm áp: Không phải ta làm nên điều kì diệu, chính con đã tự tạo ra phép màu bằng sự cố gắng của mình. Ngôi sao chỉ soi đường cho những ai dám bước đi.\n\nTừ đó, An hiểu ra: ước nguyện chỉ thành hiện thực khi ta dám hành động. Và mỗi đêm, ngôi sao vẫn sáng — như lời nhắc nhở dịu dàng rằng phép màu luôn nằm trong chính sự nỗ lực của con người.\n\nCâu 3. Chi tiết ngôi sao sáng hơn mỗi đêm khi An thay đổi có ý nghĩa gì?", "options": ["A. Ngôi sao được lau chùi", "B. Biểu tượng cho sự ghi nhận: nỗ lực của con người làm cho ước mơ thêm rạng rỡ, hiện thực hơn", "C. Thời tiết đẹp hơn", "D. An mua kính thiên văn"], "answer": "B", "explain": "Độ sáng của ngôi sao tỉ lệ thuận với sự cố gắng của An — hình ảnh biểu tượng đẹp: ước mơ chỉ tỏa sáng khi được nuôi dưỡng bằng hành động cụ thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGÔI SAO ƯỚC NGUYỆN\n\nĐêm nào, bé An cũng ra hiên ngắm sao. Cô bé có một ngôi sao rất sáng mà An gọi là ngôi sao của mình. An thường thì thầm với nó những ước nguyện: ước mẹ khỏi bệnh, ước cha bớt vất vả, ước mình học giỏi.\n\nMột đêm, khi An đang thì thầm, ngôi sao bỗng nhấp nháy lạ thường và một giọng nói trong trẻo vang lên: Ta nghe thấy ước nguyện của con. Nhưng con có biết không, ngôi sao chỉ sáng cho những ai biết tự mình cố gắng.\n\nAn ngạc nhiên: Sao lại thế ạ? Giọng nói đáp: Ước nguyện mà không hành động thì chỉ là mơ mộng. Con ước mẹ khỏi bệnh — con đã giúp mẹ uống thuốc đúng giờ chưa? Con ước cha bớt vất vả — con đã đỡ đần cha việc nhà chưa? Con ước học giỏi — con đã chăm chỉ học bài chưa?\n\nAn cúi đầu xấu hổ. Quả thật, cô bé chỉ biết ước mà chưa bao giờ nghĩ mình phải làm gì. Từ hôm đó, An thay đổi. Cô bé nhắc mẹ uống thuốc đúng giờ, phụ cha quét nhà, nấu cơm, và mỗi tối đều học bài chăm chỉ trước khi ra hiên ngắm sao.\n\nKì lạ thay, từ ngày An thay đổi, ngôi sao của cô bé dường như sáng hơn mỗi đêm. Mẹ An khỏe dần lên, cha An cười nhiều hơn, và cuối năm, An đạt học sinh giỏi.\n\nĐêm nhận giấy khen, An chạy ra hiên, reo lên với ngôi sao: Con cảm ơn ngôi sao! Giọng nói trong trẻo lại vang lên, lần này đầy ấm áp: Không phải ta làm nên điều kì diệu, chính con đã tự tạo ra phép màu bằng sự cố gắng của mình. Ngôi sao chỉ soi đường cho những ai dám bước đi.\n\nTừ đó, An hiểu ra: ước nguyện chỉ thành hiện thực khi ta dám hành động. Và mỗi đêm, ngôi sao vẫn sáng — như lời nhắc nhở dịu dàng rằng phép màu luôn nằm trong chính sự nỗ lực của con người.\n\nCâu 4. Thông điệp chính của truyện là gì?", "options": ["A. Nên tin vào phép màu", "B. Ước mơ phải đi đôi với hành động; phép màu thật sự nằm trong sự nỗ lực của chính mình", "C. Trẻ em nên ngắm sao nhiều", "D. Ngôi sao quyết định số phận con người"], "answer": "B", "explain": "Câu kết khẳng định: \"phép màu luôn nằm trong chính sự nỗ lực của con người\" — thông điệp phủ định sự trông chờ thụ động, đề cao hành động.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGÔI SAO ƯỚC NGUYỆN\n\nĐêm nào, bé An cũng ra hiên ngắm sao. Cô bé có một ngôi sao rất sáng mà An gọi là ngôi sao của mình. An thường thì thầm với nó những ước nguyện: ước mẹ khỏi bệnh, ước cha bớt vất vả, ước mình học giỏi.\n\nMột đêm, khi An đang thì thầm, ngôi sao bỗng nhấp nháy lạ thường và một giọng nói trong trẻo vang lên: Ta nghe thấy ước nguyện của con. Nhưng con có biết không, ngôi sao chỉ sáng cho những ai biết tự mình cố gắng.\n\nAn ngạc nhiên: Sao lại thế ạ? Giọng nói đáp: Ước nguyện mà không hành động thì chỉ là mơ mộng. Con ước mẹ khỏi bệnh — con đã giúp mẹ uống thuốc đúng giờ chưa? Con ước cha bớt vất vả — con đã đỡ đần cha việc nhà chưa? Con ước học giỏi — con đã chăm chỉ học bài chưa?\n\nAn cúi đầu xấu hổ. Quả thật, cô bé chỉ biết ước mà chưa bao giờ nghĩ mình phải làm gì. Từ hôm đó, An thay đổi. Cô bé nhắc mẹ uống thuốc đúng giờ, phụ cha quét nhà, nấu cơm, và mỗi tối đều học bài chăm chỉ trước khi ra hiên ngắm sao.\n\nKì lạ thay, từ ngày An thay đổi, ngôi sao của cô bé dường như sáng hơn mỗi đêm. Mẹ An khỏe dần lên, cha An cười nhiều hơn, và cuối năm, An đạt học sinh giỏi.\n\nĐêm nhận giấy khen, An chạy ra hiên, reo lên với ngôi sao: Con cảm ơn ngôi sao! Giọng nói trong trẻo lại vang lên, lần này đầy ấm áp: Không phải ta làm nên điều kì diệu, chính con đã tự tạo ra phép màu bằng sự cố gắng của mình. Ngôi sao chỉ soi đường cho những ai dám bước đi.\n\nTừ đó, An hiểu ra: ước nguyện chỉ thành hiện thực khi ta dám hành động. Và mỗi đêm, ngôi sao vẫn sáng — như lời nhắc nhở dịu dàng rằng phép màu luôn nằm trong chính sự nỗ lực của con người.\n\nCâu 5. Qua truyện, em rút ra bài học gì về mối quan hệ giữa ước mơ và hành động? (Trả lời ngắn gọn)", "answer": "Ước mơ phải đi đôi với hành động mới thành hiện thực", "explain": "Chấp nhận các cách diễn đạt tương đương: đừng chỉ ước mà hãy làm; nỗ lực biến ước mơ thành hiện thực; ước mà không làm chỉ là mơ mộng...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về mối quan hệ giữa ước mơ và hành động.", "explain": "DÀN Ý:\n1. Mở đoạn: ước mơ và hành động là hai mặt không thể tách rời.\n2. Thân đoạn: (a) Ước mơ cho định hướng, hành động biến ước mơ thành hiện thực như bé An; (b) Chỉ ước không làm là mơ mộng viển vông; chỉ làm không ước mơ dễ lạc hướng; (c) Phê phán thói lười biếng, trông chờ phép màu.\n3. Kết đoạn: hãy ước mơ và dám hành động.\n\nBÀI MẪU:\nƯớc mơ và hành động là hai mặt không thể tách rời của thành công — ước mơ cho ta định hướng, còn hành động biến ước mơ thành hiện thực. Bé An trong truyện ban đầu chỉ biết thì thầm ước nguyện với ngôi sao mà không làm gì cả, và chẳng có điều kì diệu nào xảy ra; chỉ khi cô bé bắt đầu hành động — chăm sóc mẹ, đỡ đần cha, chăm chỉ học tập — thì ước nguyện mới dần thành hiện thực. Trong cuộc sống cũng vậy: người chỉ biết mơ mộng mà không chịu hành động thì ước mơ mãi chỉ là ảo ảnh; ngược lại, người hành động mà không có ước mơ, không có mục tiêu thì dễ lạc hướng, uổng phí công sức. Sức mạnh thật sự nằm ở sự kết hợp: dám ước mơ lớn và dám hành động quyết liệt vì nó. Đáng phê phán là những bạn trẻ hoặc sống không ước mơ, buông xuôi, hoặc chỉ biết mơ mộng viển vông mà lười biếng, trông chờ vào may mắn, phép màu. Hãy nhớ lời ngôi sao nhắn nhủ: phép màu luôn nằm trong chính sự nỗ lực của mỗi chúng ta.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích hình tượng ngôi sao trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và hình tượng ngôi sao — yếu tố kì ảo giàu ý nghĩa biểu tượng.\nII. Thân bài:\n1. Hình tượng ngôi sao ở tầng nghĩa tả thực: ngôi sao sáng trên bầu trời mà bé An yêu thích.\n2. Hình tượng ngôi sao ở tầng nghĩa biểu tượng:\n   a. Biểu tượng của ước mơ, khát vọng.\n   b. Biểu tượng của lương tri, tiếng nói thức tỉnh (chất vấn An về hành động).\n   c. Biểu tượng của niềm tin được nuôi dưỡng bằng nỗ lực (sáng hơn khi An cố gắng).\n3. Vai trò trong truyện: tạo sức hấp dẫn; là phương tiện truyền tải triết lí; thúc đẩy sự thay đổi của nhân vật.\n4. Nghệ thuật: nhân hóa ngôi sao; đối thoại giàu triết lí; kết hợp kì ảo và hiện thực.\nIII. Kết bài: khẳng định giá trị biểu tượng; bài học về ước mơ và hành động.\n\nĐOẠN MẪU (mở bài):\nTrong văn học, những hình tượng kì ảo thường mang nhiều tầng ý nghĩa, vừa cụ thể vừa biểu tượng. Truyện ngắn Ngôi sao ước nguyện đã xây dựng thành công hình tượng ngôi sao biết nói — không chỉ là yếu tố hoang đường tạo sức hấp dẫn mà còn là biểu tượng giàu sức gợi về ước mơ, về lương tri và về niềm tin của con người. Phân tích hình tượng này giúp ta thấy rõ nghệ thuật dùng cái kì ảo để gửi gắm triết lí nhân sinh sâu sắc.", "points": 0}]}]}
