ốc của sức mạnh nghệ thuật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỨC TRANH BIẾT CƯỜI\n\nTrong phòng khách nhà ông họa sĩ già có một bức tranh rất đặc biệt: vẽ một cậu bé đang cười tươi. Điều kì lạ là nụ cười của cậu bé trong tranh dường như thay đổi theo tâm trạng của người xem — khi vui, cậu cười rạng rỡ; khi buồn, nụ cười trở nên hiền hòa, an ủi.\n\nCó lần, một doanh nhân thành đạt nhưng luôn cau có đến chơi. Ông ta đứng trước bức tranh hồi lâu rồi bỗng bật khóc: Bao năm bon chen, tôi quên mất cách cười. Bức tranh như nhắc tôi nhớ về tuổi thơ hồn nhiên của mình.\n\nMột lần khác, cô gái trẻ thất tình đến nhà ông họa sĩ. Nhìn nụ cười hiền hòa trong tranh, cô bỗng thấy lòng nhẹ nhõm: Hóa ra, nỗi buồn nào rồi cũng qua, chỉ cần mình biết mỉm cười.\n\nÔng họa sĩ kể: Bức tranh này ta vẽ từ đứa cháu nội đã mất sớm của ta. Nó luôn cười, dù ốm đau. Trước khi đi xa, nó nói: Ông ơi, ông hãy vẽ con đang cười để ai buồn nhìn vào cũng thấy vui.\n\nNghe xong, ai cũng rưng rưng. Hóa ra, phép màu của bức tranh không phải ở kĩ thuật vẽ mà ở tình yêu thương mà ông họa sĩ đã gửi vào từng nét cọ — tình yêu của người ông dành cho đứa cháu bé bỏng.\n\nTừ đó, bức tranh được nhiều người biết đến. Người ta đến không phải để chiêm ngưỡng một kiệt tác hội họa, mà để tìm lại nụ cười đã đánh mất giữa dòng đời bon chen. Và điều kì diệu là: ai ra về cũng mang theo một nụ cười trên môi.\n\nÔng họa sĩ mỉm cười: Nghệ thuật đích thực không nằm ở sự cầu kì, mà ở khả năng chạm đến trái tim con người. Bức tranh biết cười vì nó được vẽ bằng tình yêu thương.\n\nCâu 4. Chi tiết nụ cười trong tranh thay đổi theo tâm trạng người xem có ý nghĩa gì?", "options": ["A. Chứng tỏ tranh có ma thuật", "B. Biểu tượng cho sự đồng cảm: nghệ thuật đích thực biết an ủi, sẻ chia theo nỗi niềm của con người", "C. Để khoe kĩ thuật vẽ", "D. Ngẫu nhiên, không có ý nghĩa"], "answer": "B", "explain": "Nụ cười biến đổi là hình ảnh biểu tượng: nghệ thuật chân chính không vô cảm mà đồng điệu với tâm hồn con người — vui thì rạng rỡ cùng, buồn thì hiền hòa an ủi.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỨC TRANH BIẾT CƯỜI\n\nTrong phòng khách nhà ông họa sĩ già có một bức tranh rất đặc biệt: vẽ một cậu bé đang cười tươi. Điều kì lạ là nụ cười của cậu bé trong tranh dường như thay đổi theo tâm trạng của người xem — khi vui, cậu cười rạng rỡ; khi buồn, nụ cười trở nên hiền hòa, an ủi.\n\nCó lần, một doanh nhân thành đạt nhưng luôn cau có đến chơi. Ông ta đứng trước bức tranh hồi lâu rồi bỗng bật khóc: Bao năm bon chen, tôi quên mất cách cười. Bức tranh như nhắc tôi nhớ về tuổi thơ hồn nhiên của mình.\n\nMột lần khác, cô gái trẻ thất tình đến nhà ông họa sĩ. Nhìn nụ cười hiền hòa trong tranh, cô bỗng thấy lòng nhẹ nhõm: Hóa ra, nỗi buồn nào rồi cũng qua, chỉ cần mình biết mỉm cười.\n\nÔng họa sĩ kể: Bức tranh này ta vẽ từ đứa cháu nội đã mất sớm của ta. Nó luôn cười, dù ốm đau. Trước khi đi xa, nó nói: Ông ơi, ông hãy vẽ con đang cười để ai buồn nhìn vào cũng thấy vui.\n\nNghe xong, ai cũng rưng rưng. Hóa ra, phép màu của bức tranh không phải ở kĩ thuật vẽ mà ở tình yêu thương mà ông họa sĩ đã gửi vào từng nét cọ — tình yêu của người ông dành cho đứa cháu bé bỏng.\n\nTừ đó, bức tranh được nhiều người biết đến. Người ta đến không phải để chiêm ngưỡng một kiệt tác hội họa, mà để tìm lại nụ cười đã đánh mất giữa dòng đời bon chen. Và điều kì diệu là: ai ra về cũng mang theo một nụ cười trên môi.\n\nÔng họa sĩ mỉm cười: Nghệ thuật đích thực không nằm ở sự cầu kì, mà ở khả năng chạm đến trái tim con người. Bức tranh biết cười vì nó được vẽ bằng tình yêu thương.\n\nCâu 5. Qua truyện, em hiểu thêm điều gì về giá trị của nghệ thuật? (Trả lời ngắn gọn)", "answer": "Nghệ thuật đích thực chạm đến trái tim bằng tình cảm chân thành", "explain": "Chấp nhận các cách diễn đạt tương đương: nghệ thuật phải xuất phát từ tình yêu thương; giá trị nghệ thuật nằm ở sự đồng cảm với con người...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về sức mạnh của nụ cười trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: nụ cười có sức mạnh kì diệu.\n2. Thân đoạn: (a) Nụ cười xua tan nỗi buồn, kết nối con người như bức tranh biết cười an ủi bao người; (b) Người hay cười lan tỏa năng lượng tích cực; (c) Phê phán thói cau có, khó chịu, làm mất hòa khí.\n3. Kết đoạn: hãy mỉm cười mỗi ngày.\n\nBÀI MẪU:\nNụ cười có một sức mạnh kì diệu trong cuộc sống mà đôi khi ta không nhận ra. Một nụ cười chân thành có thể xua tan nỗi buồn, sưởi ấm trái tim đang lạnh giá và kết nối những con người xa lạ — như bức tranh biết cười trong truyện đã an ủi bao tâm hồn đang đau khổ: người doanh nhân tìm lại tuổi thơ hồn nhiên, cô gái thất tình thấy lòng nhẹ nhõm. Nụ cười còn là ngôn ngữ không lời của sự thân thiện, giúp ta dễ dàng hòa đồng, được mọi người yêu mến. Người hay cười thường lan tỏa năng lượng tích cực, khiến môi trường xung quanh trở nên vui vẻ, ấm áp hơn. Ngược lại, kẻ luôn cau có, khó chịu không chỉ làm khổ mình mà còn gieo sự nặng nề cho những người bên cạnh. Trong cuộc sống đầy áp lực hôm nay, nụ cười càng trở nên quý giá — nó là liều thuốc tinh thần miễn phí mà ai cũng có thể trao tặng. Vì vậy, hãy học cách mỉm cười mỗi ngày: cười với người thân, với bạn bè, với cả những người xa lạ. Biết đâu, nụ cười của bạn hôm nay sẽ là phép màu an ủi một tâm hồn đang cần được sẻ chia.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ về quan niệm nghệ thuật được thể hiện qua truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và quan niệm nghệ thuật đặc sắc được gửi gắm.\nII. Thân bài:\n1. Quan niệm: nghệ thuật đích thực không nằm ở sự cầu kì kĩ thuật mà ở khả năng chạm đến trái tim con người.\n2. Chứng minh qua truyện:\n   a. Phép màu của bức tranh đến từ tình yêu thương, không phải kĩ thuật.\n   b. Tác động của bức tranh: an ủi, chữa lành tâm hồn người xem.\n   c. Người ta đến không phải chiêm ngưỡng kiệt tác mà để tìm lại nụ cười — giá trị nhân văn.\n3. Mở rộng: quan niệm này phù hợp với truyền thống văn học (văn học vì con người); phê phán nghệ thuật xa rời đời sống, cầu kì hình thức mà rỗng tuếch nội dung.\n4. Nghệ thuật thể hiện quan niệm: yếu tố kì ảo (tranh biết cười) làm phương tiện; kết cấu giàu cảm xúc.\nIII. Kết bài: khẳng định giá trị quan niệm; liên hệ trách nhiệm của người sáng tạo và người thưởng thức.\n\nĐOẠN MẪU (mở bài):\nNghệ thuật là gì và vì ai? Đó là câu hỏi muôn thuở của người sáng tạo. Truyện ngắn Bức tranh biết cười đã đưa ra một câu trả lời thấm thía qua hình tượng bức tranh có nụ cười biến đổi: nghệ thuật đích thực không nằm ở sự cầu kì về kĩ thuật mà ở khả năng chạm đến trái tim con người bằng tình cảm chân thành. Quan niệm nghệ thuật này vừa giàu tính nhân văn vừa có ý nghĩa thời sự sâu sắc.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHUYẾN TÀU TRONG MƠ\n\nĐêm nào Tuấn cũng mơ thấy một chuyến tàu kì lạ. Con tàu không có đầu máy, không cần đường ray, cứ lướt đi trong ánh sáng lung linh. Trên tàu, Tuấn gặp những hành khách đặc biệt: một cụ già mang theo chiếc vali đầy ắp những kỉ niệm, một cô bé ôm khư khư con búp bê rách, một chàng trai trẻ với khuôn mặt đầy lo âu.\n\nNgười soát vé — một ông lão hiền từ — nói với Tuấn: Đây là chuyến tàu của những ước mơ dang dở. Mỗi hành khách đều mang theo một điều chưa làm được trong đời.\n\nCụ già mở vali: toàn là những tấm ảnh gia đình. Cụ thở dài: Cả đời ta bận kiếm tiền, đến khi giàu có mới nhận ra đã bỏ lỡ bao khoảnh khắc bên con cháu. Giá như ta dành nhiều thời gian cho gia đình hơn.\n\nCô bé ôm chặt búp bê: Con ước được đến trường như các bạn, nhưng nhà con nghèo quá. Chàng trai trẻ thì thầm: Tôi ước mình đủ can đảm để theo đuổi đam mê hội họa, thay vì làm công việc mình không yêu thích chỉ vì lương cao.\n\nTuấn chợt nhận ra mình cũng là hành khách của chuyến tàu ấy. Cậu tự hỏi: Ước mơ dang dở của mình là gì? Cậu nhớ ra mình từng ước trở thành cầu thủ bóng đá, nhưng đã bỏ cuộc vì sợ vất vả, sợ thất bại.\n\nSáng hôm sau tỉnh dậy, Tuấn quyết định thay đổi. Cậu xin cha mẹ cho đi học bóng đá trở lại, hứa sẽ cân bằng giữa học văn hóa và tập luyện. Ban đầu cha mẹ ngạc nhiên, nhưng thấy con quyết tâm, họ đồng ý.\n\nNhiều năm sau, Tuấn trở thành cầu thủ chuyên nghiệp. Trong một buổi phỏng vấn, khi được hỏi về động lực, anh mỉm cười: Tôi từng đi trên một chuyến tàu trong mơ, nơi tôi gặp những người mang ước mơ dang dở. Chuyến tàu ấy dạy tôi một điều: đừng để ước mơ của mình cũng trở thành hành khách dang dở.\n\nĐêm đó, Tuấn lại mơ thấy chuyến tàu. Nhưng lần này, người soát vé mỉm cười với anh: Chuyến tàu này không còn chỗ cho con nữa, vì con đã sống trọn vẹn với ước mơ của mình.\n\nCâu 1. Chuyến tàu trong mơ của Tuấn có đặc điểm kì ảo nào?", "options": ["A. Chạy rất nhanh", "B. Không có đầu máy, không cần đường ray, lướt đi trong ánh sáng lung linh", "C. Rất đông khách", "D. Có nhiều toa"], "answer": "B", "explain": "Con tàu không đầu máy, không đường ray mà vẫn lướt đi trong ánh sáng — những đặc điểm hoang đường, kì ảo rõ rệt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHUYẾN TÀU TRONG MƠ\n\nĐêm nào Tuấn cũng mơ thấy một chuyến tàu kì lạ. Con tàu không có đầu máy, không cần đường ray, cứ lướt đi trong ánh sáng lung linh. Trên tàu, Tuấn gặp những hành khách đặc biệt: một cụ già mang theo chiếc vali đầy ắp những kỉ niệm, một cô bé ôm khư khư con búp bê rách, một chàng trai trẻ với khuôn mặt đầy lo âu.\n\nNgười soát vé — một ông lão hiền từ — nói với Tuấn: Đây là chuyến tàu của những ước mơ dang dở. Mỗi hành khách đều mang theo một điều chưa làm được trong đời.\n\nCụ già mở vali: toàn là những tấm ảnh gia đình. Cụ thở dài: Cả đời ta bận kiếm  mơ bỏ dở; lời cảnh tỉnh hãy sống trọn vẹn với ước mơ", "C. Ngành đường sắt phát triển", "D. Giấc mơ vô nghĩa"], "answer": "B", "explain": "Chuyến tàu là hình ảnh biểu tượng: mỗi hành khách là một lời cảnh tỉnh về sự hối tiếc khi để ước mơ dang dở; với Tuấn, nó là động lực để cậu dám theo đuổi đam mê.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHUYẾN TÀU TRONG MƠ\n\nĐêm nào Tuấn cũng mơ thấy một chuyến tàu kì lạ. Con tàu không có đầu máy, không cần đường ray, cứ lướt đi trong ánh sáng lung linh. Trên tàu, Tuấn gặp những hành khách đặc biệt: một cụ già mang theo chiếc vali đầy ắp những kỉ niệm, một cô bé ôm khư khư con búp bê rách, một chàng trai trẻ với khuôn mặt đầy lo âu.\n\nNgười soát vé — một ông lão hiền từ — nói với Tuấn: Đây là chuyến tàu của những ước mơ dang dở. Mỗi hành khách đều mang theo một điều chưa làm được trong đời.\n\nCụ già mở vali: toàn là những tấm ảnh gia đình. Cụ thở dài: Cả đời ta bận kiếm tiền, đến khi giàu có mới nhận ra đã bỏ lỡ bao khoảnh khắc bên con cháu. Giá như ta dành nhiều thời gian cho gia đình hơn.\n\nCô bé ôm chặt búp bê: Con ước được đến trường như các bạn, nhưng nhà con nghèo quá. Chàng trai trẻ thì thầm: Tôi ước mình đủ can đảm để theo đuổi đam mê hội họa, thay vì làm công việc mình không yêu thích chỉ vì lương cao.\n\nTuấn chợt nhận ra mình cũng là hành khách của chuyến tàu ấy. Cậu tự hỏi: Ước mơ dang dở của mình là gì? Cậu nhớ ra mình từng ước trở thành cầu thủ bóng đá, nhưng đã bỏ cuộc vì sợ vất vả, sợ thất bại.\n\nSáng hôm sau tỉnh dậy, Tuấn quyết định thay đổi. Cậu xin cha mẹ cho đi học bóng đá trở lại, hứa sẽ cân bằng giữa học văn hóa và tập luyện. Ban đầu cha mẹ ngạc nhiên, nhưng thấy con quyết tâm, họ đồng ý.\n\nNhiều năm sau, Tuấn trở thành cầu thủ chuyên nghiệp. Trong một buổi phỏng vấn, khi được hỏi về động lực, anh mỉm cười: Tôi từng đi trên một chuyến tàu trong mơ, nơi tôi gặp những người mang ước mơ dang dở. Chuyến tàu ấy dạy tôi một điều: đừng để ước mơ của mình cũng trở thành hành khách dang dở.\n\nĐêm đó, Tuấn lại mơ thấy chuyến tàu. Nhưng lần này, người soát vé mỉm cười với anh: Chuyến tàu này không còn chỗ cho con nữa, vì con đã sống trọn vẹn với ước mơ của mình.\n\nCâu 5. Qua truyện, em rút ra bài học gì về cách đối xử với ước mơ? (Trả lời ngắn gọn)", "answer": "Dám theo đuổi ước mơ đến cùng, đừng để ước mơ dang dở", "explain": "Chấp nhận các cách diễn đạt tương đương: đừng bỏ cuộc vì sợ khó khăn; hãy sống trọn vẹn với đam mê; đừng để phải hối tiếc...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về việc dám theo đuổi đam mê của tuổi trẻ.", "explain": "DÀN Ý:\n1. Mở đoạn: đam mê là ngọn lửa của tuổi trẻ, cần được theo đuổi đến cùng.\n2. Thân đoạn: (a) Ý nghĩa: sống với đam mê mới thấy cuộc đời ý nghĩa như Tuấn trở thành cầu thủ; (b) Khó khăn: sợ thất bại, áp lực gia đình, dư luận; cần bản lĩnh vượt qua; (c) Phê phán: bỏ cuộc giữa chừng, sống theo sự sắp đặt mà không yêu thích.\n3. Kết đoạn: hãy dũng cảm theo đuổi đam mê.\n\nBÀI MẪU:\nDám theo đuổi đam mê đến cùng là phẩm chất đáng quý của tuổi trẻ, là con đường dẫn đến một cuộc đời ý nghĩa. Đam mê là ngọn lửa thắp sáng tâm hồn, cho ta động lực vượt qua mọi khó khăn — như Tuấn trong truyện, nhờ dám quay lại với ước mơ bóng đá mà cuối cùng trở thành cầu thủ chuyên nghiệp, không còn phải day dứt về một ước mơ dang dở. Trên hành trình theo đuổi đam mê, người trẻ sẽ gặp không ít trở ngại: nỗi sợ thất bại, áp lực từ gia đình, định kiến của dư luận. Nhưng chính việc vượt qua những trở ngại ấy mới tôi luyện nên bản lĩnh và ý chí. Đáng tiếc là không ít bạn trẻ đã bỏ cuộc giữa chừng vì sợ vất vả, hoặc cam chịu sống theo sự sắp đặt của người khác với một công việc mình không yêu thích — để rồi mang theo nỗi day dứt suốt đời như các hành khách trên chuyến tàu trong mơ. Đam mê cần đi đôi với sự nỗ lực và cả sự khôn ngoan: cân bằng giữa đam mê và trách nhiệm, giữa ước mơ và thực tế. Hãy dũng cảm theo đuổi đam mê ngay từ hôm nay, để mai này nhìn lại, ta có thể mỉm cười vì đã sống trọn vẹn với ước mơ của mình.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích ý nghĩa biểu tượng của chuyến tàu trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và hình ảnh chuyến tàu — biểu tượng nghệ thuật độc đáo.\nII. Thân bài:\n1. Chuyến tàu ở tầng nghĩa tả thực: con tàu kì lạ trong giấc mơ với những hành khách đặc biệt.\n2. Chuyến tàu ở tầng nghĩa biểu tượng:\n   a. Biểu tượng của cuộc đời, của hành trình sống.\n   b. Biểu tượng của nỗi day dứt về những ước mơ dang dở (mỗi hành khách một câu chuyện).\n   c. Biểu tượng của sự thức tỉnh, cảnh tỉnh (giúp Tuấn nhận ra và thay đổi).\n3. Vai trò: tạo bước ngoặt tâm lí cho nhân vật; gửi gắm thông điệp; tạo sức hấp dẫn kì ảo.\n4. Nghệ thuật: xây dựng biểu tượng qua hệ thống nhân vật (cụ già, cô bé, chàng trai — mỗi người một bài học); kết cấu mơ — thực đan xen.\nIII. Kết bài: khẳng định giá trị biểu tượng; bài học về ước mơ.\n\nĐOẠN MẪU (mở bài):\nNhững hình tượng kì ảo trong văn học thường mang nhiều tầng ý nghĩa, và chuyến tàu trong truyện ngắn Chuyến tàu trong mơ là một hình tượng như thế. Không chỉ là phương tiện di chuyển trong giấc mơ, chuyến tàu với những hành khách mang ước mơ dang dở đã trở thành biểu tượng sâu sắc về cuộc đời, về nỗi day dứt của con người trước những điều chưa làm được. Phân tích hình tượng này giúp ta thấy rõ nghệ thuật dùng cái kì ảo để chuyển tải triết lí nhân sinh của tác phẩm.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHÒN ĐÁ ƯỚC\n\nBên bờ suối sau làng có một hòn đá rất đặc biệt: nhẵn bóng, ấm áp quanh năm. Các cụ già trong làng kể rằng đó là hòn đá ước — ai thành tâm ước một điều tốt đẹp và làm một việc tốt thì điều ước sẽ thành hiện thực.\n\nCậu bé Bi không tin. Một hôm, Bi ra suối, đặt tay lên hòn đá và ước: Con ước có thật nhiều kẹo. Rồi cậu về nhà chờ đợi. Mấy ngày trôi qua, chẳng có viên kẹo nào. Bi bĩu môi: Hòn đá lừa đảo!\n\nHôm sau, Bi thấy bạn Na bị ngã trầy xước đầu gối, khóc nức nở. Bi dìu Na về nhà, rửa vết thương và an ủi bạn. Tối đó, Bi lại ra suối, đặt tay lên hòn đá và ước: Con ước bạn Na mau khỏi đau. Sáng hôm sau, Na đã chạy nhảy vui vẻ, vết thương se lại nhanh đến kì lạ.\n\nBi bắt đầu tin. Cậu ước cho bà ngoại khỏi đau lưng — rồi mỗi ngày cậu đều xoa bóp cho bà. Cậu ước cho cha bớt mệt — rồi cậu phụ cha gánh nước, quét sân. Lạ thay, những điều ước ấy đều thành hiện thực: bà ngoại đỡ đau lưng, cha cười nhiều hơn.\n\nMột hôm, Bi hỏi cụ Tư — người già nhất làng: Sao hòn đá lại linh nghiệm thế ạ? Cụ cười hiền: Hòn đá chẳng có phép màu gì đâu con. Điều ước thành hiện thực không phải vì hòn đá, mà vì chính những việc tốt con đã làm. Hòn đá chỉ là nơi để con gửi gắm niềm tin, còn phép màu thật sự nằm trong bàn tay và tấm lòng của con.\n\nBi ngẫm nghĩ rồi gật đầu. Từ đó, cậu không còn ước những điều cho riêng mình nữa. Mỗi lần ra suối, cậu đều ước những điều tốt đẹp cho mọi người — và luôn kèm theo một việc làm cụ thể.\n\nNhiều năm sau, Bi trở thành một thầy giáo làng được mọi người yêu quý. Hòn đá ước vẫn nằm bên bờ suối, vẫn nhẵn bóng, ấm áp. Và những đứa trẻ trong làng vẫn thường ra đó ước nguyện — với niềm tin trong sáng rằng điều tốt đẹp sẽ đến với những ai biết sống tốt.\n\nCâu 1. Theo lời các cụ già, điều kiện để điều ước thành hiện thực là gì?", "options": ["A. Ước thật nhiều lần", "B. Thành tâm ước một điều tốt đẹp và làm một việc tốt", "C. Mang lễ vật đến cúng", "D. Ước vào ban đêm"], "answer": "B", "explain": "Các cụ dặn: ai thành tâm ước một điều tốt đẹp và làm một việc tốt thì điều ước sẽ thành hiện thực — điều kiện gắn ước nguyện với hành động thiện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHÒN ĐÁ ƯỚC\n\nBên bờ suối sau làng có một hòn đá rất đặc biệt: nhẵn bóng, ấm áp quanh năm. Các cụ già trong làng kể rằng đó là hòn đá ước — ai thành tâm ước một điều tốt đẹp và làm một việc tốt thì điều ước sẽ thành hiện thực.\n\nCậu bé Bi không tin. Một hôm, Bi ra suối, đặt tay lên hòn đá và ước: Con ước có thật nhiều kẹo. Rồi cậu về nhà chờ đợi. Mấy ngày trôi qua, chẳng có viên kẹo nào. Bi bĩu môi: Hòn đá lừa đảo!\n\nHôm sau, Bi thấy bạn Na bị ngã trầy xước đầu gối, khóc nức nở. Bi dìu Na về nhà, rửa vết thương và an ủi bạn. Tối đó, Bi lại ra suối, đặt tay lên hòn đá và ước: Con ước bạn Na mau khỏi đau. Sáng hôm sau, Na đã chạy nhảy vui vẻ, vết thương se lại nhanh đến kì lạ.\n\nBi bắt đầu tin. Cậu ước cho bà ngoại khỏi đau lưng — rồi mỗi ngày cậu đều xoa bóp cho bà. Cậu ước cho cha bớt mệt — rồi cậu phụ cha gánh nước, quét sân. Lạ thay, những điều ước ấy đều thành hiện thực: bà ngoại đỡ đau lưng, cha cười nhiều hơn.\n\nMột hôm, Bi hỏi cụ Tư — người già nhất làng: Sao hòn đá lại linh nghiệm thế ạ? Cụ cười hiền: Hòn đá chẳng có phép màu gì đâu con. Điều ước thành hiện thực không phải vì hòn đá, mà vì chính những việc tốt con đã làm. Hòn đá chỉ là nơi để con gửi gắm niềm tin, còn phép màu thật sự nằm trong bàn tay và tấm lòng của con.\n\nBi ngẫm nghĩ rồi gật đầu. Từ đó, cậu không còn ước những điều cho riêng mình nữa. Mỗi lần ra suối, cậu đều ước những điều tốt đẹp cho mọi người — và luôn kèm theo một việc làm cụ thể.\n\nNhiều năm sau, Bi trở thành một thầy giáo làng được mọi người yêu quý. Hòn đá ước vẫn nằm bên bờ suối, vẫn nhẵn bóng, ấm áp. Và những đứa trẻ trong làng vẫn thường ra đó ước nguyện — với niềm tin trong sáng rằng điều tốt đẹp sẽ đến với những ai biết sống tốt.\n\nCâu 2. Vì sao điều ước có nhiều kẹo của Bi không thành hiện thực?", "options": ["A. Vì hòn đá hết phép màu", "B. Vì đó là ước muốn ích kỉ cho riêng mình mà không kèm theo việc làm tốt", "C. Vì Bi ước chưa đủ to", "D. Vì kẹo quá đắt"], "answer": "B", "explain": "Bi ước kẹo cho riêng mình mà không làm việc tốt nào — điều ước ích kỉ, thiếu hành động nên không thành hiện thực, đúng với quy luật của hòn đá ước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHÒN ĐÁ ƯỚC\n\nBên bờ suối sau làng có một hòn đá rất đặc biệt: nhẵn bóng, ấm áp quanh năm. Các cụ già trong làng kể rằng đó là hòn đá ước — ai thành tâm ước một điều tốt đẹp và làm một việc tốt thì điều ước sẽ thành hiện thực.\n\nCậu bé Bi không tin. Một hôm, Bi ra suối, đặt tay lên hòn đá và ước: Con ước có thật nhiều kẹo. Rồi cậu về nhà chờ đợi. Mấy ngày trôi qua, chẳng có viên kẹo nào. Bi bĩu môi: Hòn đá lừa đảo!\n\nHôm sau, Bi thấy bạn Na bị ngã trầy xước đầu gối, khóc nức nở. Bi dìu Na về nhà, rửa vết thương và an ủi bạn. Tối đó, Bi lại ra suối, đặt tay lên hòn đá và ước: Con ước bạn Na mau khỏi đau. Sáng hôm sau, Na đã chạy nhảy vui vẻ, vết thương se lại nhanh đến kì lạ.\n\nBi bắt đầu tin. Cậu ước cho bà ngoại khỏi đau lưng — rồi mỗi ngày cậu đều xoa bóp cho bà. Cậu ước cho cha bớt mệt — rồi cậu phụ cha gánh nước, quét sân. Lạ thay, những điều ước ấy đều thành hiện thực: bà ngoại đỡ đau lưng, cha cười nhiều hơn.\n\nMột hôm, Bi hỏi cụ Tư — người già nhất làng: Sao hòn đá lại linh nghiệm thế ạ? Cụ cười hiền: Hòn đá chẳng có phép màu gì đâu con. Điều ước thành hiện thực không phải vì hòn đá, mà vì chính những việc tốt con đã làm. Hòn đá chỉ là nơi để con gửi gắm niềm tin, còn phép màu thật sự nằm trong bàn tay và tấm lòng của con.\n\nBi ngẫm nghĩ rồi gật đầu. Từ đó, cậu không còn ước những điều cho riêng mình nữa. Mỗi lần ra suối, cậu đều ước những điều tốt đẹp cho mọi người — và luôn kèm theo một việc làm cụ thể.\n\nNhiều năm sau, Bi trở thành một thầy giáo làng được mọi người yêu quý. Hòn đá ước vẫn nằm bên bờ suối, vẫn nhẵn bóng, ấm áp. Và những đứa trẻ trong làng vẫn thường ra đó ước nguyện — với niềm tin trong sáng rằng điều tốt đẹp sẽ đến với những ai biết sống tốt.\n\nCâu 3. Lời giải thích của cụ Tư về hòn đá ước có ý nghĩa gì?", "options": ["A. Phủ nhận mọi niềm tin dân gian", "B. Khẳng định triết lí: phép màu thật sự nằm trong việc làm tốt và tấm lòng của con người, không phải ở vật thiêng", "C. Cho rằng Bi bị lừa", "D. Khuyên Bi đừng ước nữa"], "answer": "B", "explain": "Cụ Tư nói: \"Hòn đá chẳng có phép màu gì đâu... phép màu thật sự nằm trong bàn tay và tấm lòng của con\" — lời giải thích hóa giải yếu tố kì ảo bằng triết lí nhân sinh sâu sắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHÒN ĐÁ ƯỚC\n\nBên bờ suối sau làng có một hòn đá rất đặc biệt: nhẵn bóng, ấm áp quanh năm. Các cụ già trong làng kể rằng đó là hòn đá ước — ai thành tâm ước một điều tốt đẹp và làm một việc tốt thì điều ước sẽ thành hiện thực.\n\nCậu bé Bi không tin. Một hôm, Bi ra suối, đặt tay lên hòn đá và ước: Con ước có thật nhiều kẹo. Rồi cậu về nhà chờ đợi. Mấy ngày trôi qua, chẳng có viên kẹo nào. Bi bĩu môi: Hòn đá lừa đảo!\n\nHôm sau, Bi thấy bạn Na bị ngã trầy xước đầu gối, khóc nức nở. Bi dìu Na về nhà, rửa vết thương và an ủi bạn. Tối đó, Bi lại ra suối, đặt tay lên hòn đá và ước: Con ước bạn Na mau khỏi đau. Sáng hôm sau, Na đã chạy nhảy vui vẻ, vết thương se lại nhanh đến kì lạ.\n\nBi bắt đầu tin. Cậu ước cho bà ngoại khỏi đau lưng — rồi mỗi ngày cậu đều xoa bóp cho bà. Cậu ước cho cha bớt mệt — rồi cậu phụ cha gánh nước, quét sân. Lạ thay, những điều ước ấy đều thành hiện thực: bà ngoại đỡ đau lưng, cha cười nhiều hơn.\n\nMột hôm, Bi hỏi cụ Tư — người già nhất làng: Sao hòn đá lại linh nghiệm thế ạ? Cụ cười hiền: Hòn đá chẳng có phép màu gì đâu con. Điều ước thành hiện thực không phải vì hòn đá, mà vì chính những việc tốt con đã làm. Hòn đá chỉ là nơi để con gửi gắm niềm tin, còn phép màu thật sự nằm trong bàn tay và tấm lòng của con.\n\nBi ngẫm nghĩ rồi gật đầu. Từ đó, cậu không còn ước những điều cho riêng mình nữa. Mỗi lần ra suối, cậu đều ước những điều tốt đẹp cho mọi người — và luôn kèm theo một việc làm cụ thể.\n\nNhiều năm sau, Bi trở thành một thầy giáo làng được mọi người yêu quý. Hòn đá ước vẫn nằm bên bờ suối, vẫn nhẵn bóng, ấm áp. Và những đứa trẻ trong làng vẫn thường ra đó ước nguyện — với niềm tin trong sáng rằng điều tốt đẹp sẽ đến với những ai biết sống tốt.\n\nCâu 4. Hòn đá ước trong truyện tượng trưng cho điều gì?", "options": ["A. Sự mê tín dị đoan", "B. Niềm tin vào điều thiện và sức mạnh của việc làm tốt", "C. Tài sản của làng", "D. Một thắng cảnh du lịch"], "answer": "B", "explain": "Hòn đá là biểu tượng của niềm tin vào điều thiện: nơi con người gửi gắm ước nguyện tốt đẹp và được thôi thúc làm việc tốt — yếu tố kì ảo phục vụ tư tưởng nhân văn.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHÒN ĐÁ ƯỚC\n\nBên bờ suối sau làng có một hòn đá rất đặc biệt: nhẵn bóng, ấm áp quanh năm. Các cụ già trong làng kể rằng đó là hòn đá ước — ai thành tâm ước một điều tốt đẹp và làm một việc tốt thì điều ước sẽ thành hiện thực.\n\nCậu bé Bi không tin. Một hôm, Bi ra suối, đặt tay lên hòn đá và ước: Con ước có thật nhiều kẹo. Rồi cậu về nhà chờ đợi. Mấy ngày trôi qua, chẳng có viên kẹo nào. Bi bĩu môi: Hòn đá lừa đảo!\n\nHôm sau, Bi thấy bạn Na bị ngã trầy xước đầu gối, khóc nức nở. Bi dìu Na về nhà, rửa vết thương và an ủi bạn. Tối đó, Bi lại ra suối, đặt tay lên hòn đá và ước: Con ước bạn Na mau khỏi đau. Sáng hôm sau, Na đã chạy nhảy vui vẻ, vết thương se lại nhanh đến kì lạ.\n\nBi bắt đầu tin. Cậu ước cho bà ngoại khỏi đau lưng — rồi mỗi ngày cậu đều xoa bóp cho bà. Cậu ước cho cha bớt mệt — rồi cậu phụ cha gánh nước, quét sân. Lạ thay, những điều ước ấy đều thành hiện thực: bà ngoại đỡ đau lưng, cha cười nhiều hơn.\n\nMột hôm, Bi hỏi cụ Tư — người già nhất làng: Sao hòn đá lại linh nghiệm thế ạ? Cụ cười hiền: Hòn đá chẳng có phép màu gì đâu con. Điều ước thành hiện thực không phải vì hòn đá, mà vì chính những việc tốt con đã làm. Hòn đá chỉ là nơi để con gửi gắm niềm tin, còn phép màu thật sự nằm trong bàn tay và tấm lòng của con.\n\nBi ngẫm nghĩ rồi gật đầu. Từ đó, cậu không còn ước những điều cho riêng mình nữa. Mỗi lần ra suối, cậu đều ước những điều tốt đẹp cho mọi người — và luôn kèm theo một việc làm cụ thể.\n\nNhiều năm sau, Bi trở thành một thầy giáo làng được mọi người yêu quý. Hòn đá ước vẫn nằm bên bờ suối, vẫn nhẵn bóng, ấm áp. Và những đứa trẻ trong làng vẫn thường ra đó ước nguyện — với niềm tin trong sáng rằng điều tốt đẹp sẽ đến với những ai biết sống tốt.\n\nCâu 5. Qua truyện, em rút ra bài học gì về cách biến ước mơ thành hiện thực? (Trả lời ngắn gọn)", "answer": "Ước điều tốt đẹp và hành động bằng việc làm cụ thể", "explain": "Chấp nhận các cách diễn đạt tương đương: đừng chỉ ước mà hãy làm; điều thiện mang lại điều tốt đẹp; phép màu nằm trong việc làm của chính mình...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về sức mạnh của việc làm tốt trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: việc làm tốt có sức mạnh kì diệu, như phép màu trong đời thực.\n2. Thân đoạn: (a) Việc tốt mang lại niềm vui cho người nhận và hạnh phúc cho người cho như Bi giúp bạn, chăm bà; (b) Việc tốt lan tỏa, nhân lên điều thiện trong cộng đồng; (c) Phê phán thói vô cảm, ích kỉ, chỉ biết nhận.\n3. Kết đoạn: hãy làm việc tốt mỗi ngày.\n\nBÀI MẪU:\nViệc làm tốt có một sức mạnh kì diệu trong cuộc sống — nó như phép màu có thật giữa đời thường. Khi ta giúp đỡ người khác, không chỉ người nhận được an ủi, sẻ chia mà chính ta cũng cảm thấy hạnh phúc, thanh thản trong lòng — như cậu bé Bi trong truyện, mỗi việc tốt cậu làm đều mang lại điều tốt đẹp trở lại: bạn Na khỏi đau, bà ngoại đỡ nhức mỏi, cha cười nhiều hơn. Hơn nữa, việc tốt có sức lan tỏa mạnh mẽ: một hành động đẹp sẽ truyền cảm hứng cho nhiều người cùng làm điều thiện, nhân lên những điều tốt đẹp trong cộng đồng. Trong cuộc sống, có biết bao việc tốt bình dị mà ý nghĩa: nhường ghế cho người già trên xe buýt, giúp bạn học bài, tham gia tình nguyện... Đáng phê phán là những kẻ vô cảm, ích kỉ, chỉ biết nhận mà không biết cho, thậm chí làm điều xấu hại người. Phép màu, như lời cụ Tư dạy, không nằm ở vật thiêng mà nằm trong chính bàn tay và tấm lòng của mỗi chúng ta. Vì vậy, hãy bắt đầu từ hôm nay bằng những việc tốt nhỏ bé — bởi mỗi việc tốt ta làm đều là một hạt giống thiện gieo vào đời.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích cách hóa giải yếu tố kì ảo trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và nghệ thuật hóa giải yếu tố kì ảo độc đáo.\nII. Thân bài:\n1. Yếu tố kì ảo được xây dựng: hòn đá ước linh nghiệm — tạo sức hấp dẫn, gợi tò mò.\n2. Quá trình hóa giải:\n   a. Từ tin đến nghi ngờ (ước kẹo không thành) — gợi câu hỏi.\n   b. Từ nghi ngờ đến tin (ước điều tốt kèm việc tốt thì thành) — dẫn dắt nhận thức.\n   c. Lời giải thích của cụ Tư: phép màu nằm trong việc làm tốt — hóa giải hoàn toàn bằng triết lí nhân sinh.\n3. Ý nghĩa của cách hóa giải:\n   a. Phủ định mê tín, khẳng định vai trò của con người.\n   b. Làm cho yếu tố kì ảo phục vụ tư tưởng: đề cao việc làm thiện.\n   c. Tạo chiều sâu triết lí, khác với truyện cổ tích đơn thuần.\n4. Nghệ thuật: kết cấu dẫn dắt khéo léo; đối thoại giàu triết lí; giọng văn ấm áp.\nIII. Kết bài: khẳng định tài năng của tác giả; bài học về cách đọc truyện kì ảo — tìm thông điệp sau cái hoang đường.\n\nĐOẠN MẪU (mở bài):\nMột trong những cách sử dụng yếu tố kì ảo tinh tế nhất là xây dựng nó thật hấp dẫn rồi hóa giải nó bằng một triết lí nhân sinh sâu sắc. Truyện ngắn Hòn đá ước đã làm được điều đó: hòn đá linh nghiệm ban đầu gợi sự tò mò, kì thú, nhưng cuối cùng được hóa giải bằng lời dạy của cụ Tư — phép màu thật sự nằm trong việc làm tốt của con người. Nghệ thuật hóa giải này không chỉ tạo nên sức hấp dẫn đặc biệt mà còn nâng tầm tư tưởng của tác phẩm.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÁNH CỬA THỜI GIAN\n\nTrong thư viện cũ của trường có một cánh cửa gỗ luôn đóng kín. Tương truyền, đó là cánh cửa thời gian — ai mở ra sẽ được thấy một lát cắt của quá khứ hoặc tương lai.\n\nNhân ngày trực nhật, Lan được giao chìa khóa kho sách. Tò mò, cô bé tra chìa vào cánh cửa gỗ. Cánh cửa kẽo kẹt mở ra, bên trong là một căn phòng tràn ngập ánh sáng vàng. Giữa phòng có một quả cầu pha lê, trong đó hiện lên những hình ảnh.\n\nLan thấy ngôi trường của mình một trăm năm về trước: mái trường tranh vách đất, học trò ngồi trên những chiếc ghế tre ọp ẹp, thầy đồ dạy chữ bằng bút lông. Các em học trong thiếu thốn mà ánh mắt ai cũng sáng rực khát khao tri thức.\n\nRồi hình ảnh thay đổi: ngôi trường một trăm năm sau — những tòa nhà cao tầng hiện đại, học sinh học với robot, du hành thực tế ảo. Nhưng Lan chợt nhận ra: dù hiện đại đến đâu, ánh mắt khát khao tri thức của học trò vẫn giống hệt các em nhỏ trăm năm trước.\n\nQuả cầu pha lê lại hiện lên hình ảnh hiện tại: chính Lan và các bạn đang ngồi trong lớp học khang trang. Một dòng chữ hiện ra: Quá khứ là nền tảng, tương lai là khát vọng, còn hiện tại là điều quý giá nhất mà các em đang nắm giữ.\n\nLan bàng hoàng tỉnh lại. Cô bé vẫn đang đứng trước cánh cửa gỗ đóng kín, chìa khóa còn trong tay. Hóa ra tất cả chỉ diễn ra trong khoảnh khắc. Nhưng những hình ảnh ấy đã khắc sâu vào tâm trí Lan.\n\nTừ hôm đó, Lan học tập chăm chỉ hơn. Cô bé hiểu rằng mình đang được hưởng thành quả của bao thế hệ đi trước — từ mái trường tranh đến lớp học khang trang hôm nay — và mình có trách nhiệm học tập tốt để xứng đáng với sự hy sinh ấy, để góp phần xây dựng tương lai.\n\nCuối năm, Lan đạt học sinh xuất sắc. Trong bài văn kể về ước mơ, cô bé viết: Em sẽ cố gắng học thật giỏi để mai này góp phần xây dựng đất nước, để một trăm năm sau, các em học sinh nhìn lại sẽ tự hào về thế hệ của chúng em hôm nay.\n\nCâu 1. Cánh cửa thời gian trong truyện nằm ở đâu?", "options": ["A. Trong nhà Lan", "B. Trong thư viện cũ của trường — cánh cửa gỗ luôn đóng kín", "C. Trong bảo tàng", "D. Trong công viên"], "answer": "B", "explain": "Văn bản cho biết: trong thư viện cũ của trường có một cánh cửa gỗ luôn đóng kín, tương truyền là cánh cửa thời gian.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÁNH CỬA THỜI GIAN\n\nTrong thư viện cũ của trường có một cánh cửa gỗ luôn đóng kín. Tương truyền, đó là cánh cửa thời gian — ai mở ra sẽ được thấy một lát cắt của quá khứ hoặc tương lai.\n\nNhân ngày trực nhật, Lan được giao chìa khóa kho sách. Tò mò, cô bé tra chìa vào cánh cửa gỗ. Cánh cửa kẽo kẹt mở ra, bên trong là một căn phòng tràn ngập ánh sáng vàng. Giữa phòng có một quả cầu pha lê, trong đó hiện lên những hình ảnh.\n\nLan thấy ngôi trường của mình một trăm năm về trước: mái trường tranh vách đất, học trò ngồi trên những chiếc ghế tre ọp ẹp, thầy đồ dạy chữ bằng bút lông. Các em học trong thiếu thốn mà ánh mắt ai cũng sáng rực khát khao tri thức.\n\nRồi hình ảnh thay đổi: ngôi trường một trăm năm sau — những tòa nhà cao tầng hiện đại, học sinh học với robot, du hành thực tế ảo. Nhưng Lan chợt nhận ra: dù hiện đại đến đâu, ánh mắt khát khao tri thức của học trò vẫn giống hệt các em nhỏ trăm năm trước.\n\nQuả cầu pha lê lại hiện lên hình ảnh hiện tại: chính Lan và các bạn đang ngồi trong lớp học khang trang. Một dòng chữ hiện ra: Quá khứ là nền tảng, tương lai là khát vọng, còn hiện tại là điều quý giá nhất mà các em đang nắm giữ.\n\nLan bàng hoàng tỉnh lại. Cô bé vẫn đang đứng trước cánh cửa gỗ đóng kín, chìa khóa còn trong tay. Hóa ra tất cả chỉ diễn ra trong khoảnh khắc. Nhưng những hình ảnh ấy đã khắc sâu vào tâm trí Lan.\n\nTừ hôm đó, Lan học tập chăm chỉ hơn. Cô bé hiểu rằng mình đang được hưởng thành quả của bao thế hệ đi trước — từ mái trường tranh đến lớp học khang trang hôm nay — và mình có trách nhiệm học tập tốt để xứng đáng với sự hy sinh ấy, để góp phần xây dựng tương lai.\n\nCuối năm, Lan đạt học sinh xuất sắc. Trong bài văn kể về ước mơ, cô bé viết: Em sẽ cố gắng học thật giỏi để mai này góp phần xây dựng đất nước, để một trăm năm sau, các em học sinh nhìn lại sẽ tự hào về thế hệ của chúng em hôm nay.\n\nCâu 2. Qua quả cầu pha lê, Lan đã thấy những gì?", "options": ["A. Chỉ thấy quá khứ", "B. Ngôi trường một trăm năm trước (tranh tre nứa lá) và một trăm năm sau (hiện đại), cùng hình ảnh hiện tại", "C. Chỉ thấy tương lai", "D. Thấy kho báu"], "answer": "B", "explain": "Quả cầu cho Lan thấy ba lát cắt thời gian: quá khứ (trường tranh vách đất), tương lai (hiện đại với robot) và hiện tại (chính Lan và các bạn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÁNH CỬA THỜI GIAN\n\nTrong thư viện cũ của trường có một cánh cửa gỗ luôn đóng kín. Tương truyền, đó là cánh cửa thời gian — ai mở ra sẽ được thấy một lát cắt của quá khứ hoặc tương lai.\n\nNhân ngày trực nhật, Lan được giao chìa khóa kho sách. Tò mò, cô bé tra chìa vào cánh cửa gỗ. Cánh cửa kẽo kẹt mở ra, bên trong là một căn phòng tràn ngập ánh sáng vàng. Giữa phòng có một quả cầu pha lê, trong đó hiện lên những hình ảnh.\n\nLan thấy ngôi trường của mình một trăm năm về trước: mái trường tranh vách đất, học trò ngồi trên những chiếc ghế tre ọp ẹp, thầy đồ dạy chữ bằng bút lông. Các em học trong thiếu thốn mà ánh mắt ai cũng sáng rực khát khao tri thức.\n\nRồi hình ảnh thay đổi: ngôi trường một trăm năm sau — những tòa nhà cao tầng hiện đại, học sinh học với robot, du hành thực tế ảo. Nhưng Lan chợt nhận ra: dù hiện đại đến đâu, ánh mắt khát khao tri thức của học trò vẫn giống hệt các em nhỏ trăm năm trước.\n\nQuả cầu pha lê lại hiện lên hình ảnh hiện tại: chính Lan và các bạn đang ngồi trong lớp học khang trang. Một dòng chữ hiện ra: Quá khứ là nền tảng, tương lai là khát vọng, còn hiện tại là điều quý giá nhất mà các em đang nắm giữ.\n\nLan bàng hoàng tỉnh lại. Cô bé vẫn đang đứng trước cánh cửa gỗ đóng kín, chìa khóa còn trong tay. Hóa ra tất cả chỉ diễn ra trong khoảnh khắc. Nhưng những hình ảnh ấy đã khắc sâu vào tâm trí Lan.\n\nTừ hôm đó, Lan học tập chăm chỉ hơn. Cô bé hiểu rằng mình đang được hưởng thành quả của bao thế hệ đi trước — từ mái trường tranh đến lớp học khang trang hôm nay — và mình có trách nhiệm học tập tốt để xứng đáng với sự hy sinh ấy, để góp phần xây dựng tương lai.\n\nCuối năm, Lan đạt học sinh xuất sắc. Trong bài văn kể về ước mơ, cô bé viết: Em sẽ cố gắng học thật giỏi để mai này góp phần xây dựng đất nước, để một trăm năm sau, các em học sinh nhìn lại sẽ tự hào về thế hệ của chúng em hôm nay.\n\nCâu 3. Điểm chung giữa học trò trăm năm trước và trăm năm sau là gì?", "options": ["A. Đều nghèo khó", "B. Đều có ánh mắt sáng rực khát khao tri thức — khát vọng học tập là giá trị vượt thời gian", "C. Đều học với robot", "D. Đều ngồi ghế tre"], "answer": "B", "explain": "Dù cách biệt trăm năm, điều kiện khác xa nhau, ánh mắt khát khao tri thức vẫn giống hệt — chi tiết giàu ý nghĩa: khát vọng học tập là giá trị bền vững, vượt qua mọi biến đổi của thời gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÁNH CỬA THỜI GIAN\n\nTrong thư viện cũ của trường có một cánh cửa gỗ luôn đóng kín. Tương truyền, đó là cánh cửa thời gian — ai mở ra sẽ được thấy một lát cắt của quá khứ hoặc tương lai.\n\nNhân ngày trực nhật, Lan được giao chìa khóa kho sách. Tò mò, cô bé tra chìa vào cánh cửa gỗ. Cánh cửa kẽo kẹt mở ra, bên trong là một căn phòng tràn ngập ánh sáng vàng. Giữa phòng có một quả cầu pha lê, trong đó hiện lên những hình ảnh.\n\nLan thấy ngôi trường của mình một trăm năm về trước: mái trường tranh vách đất, học trò ngồi trên những chiếc ghế tre ọp ẹp, thầy đồ dạy chữ bằng bút lông. Các em học trong thiếu thốn mà ánh mắt ai cũng sáng rực khát khao tri thức.\n\nRồi hình ảnh thay đổi: ngôi trường một trăm năm sau — những tòa nhà cao tầng hiện đại, học sinh học với robot, du hành thực tế ảo. Nhưng Lan chợt nhận ra: dù hiện đại đến đâu, ánh mắt khát khao tri thức của học trò vẫn giống hệt các em nhỏ trăm năm trước.\n\nQuả cầu pha lê lại hiện lên hình ảnh hiện tại: chính Lan và các bạn đang ngồi trong lớp học khang trang. Một dòng chữ hiện ra: Quá khứ là nền tảng, tương lai là khát vọng, còn hiện tại là điều quý giá nhất mà các em đang nắm giữ.\n\nLan bàng hoàng tỉnh lại. Cô bé vẫn đang đứng trước cánh cửa gỗ đóng kín, chìa khóa còn trong tay. Hóa ra tất cả chỉ diễn ra trong khoảnh khắc. Nhưng những hình ảnh ấy đã khắc sâu vào tâm trí Lan.\n\nTừ hôm đó, Lan học tập chăm chỉ hơn. Cô bé hiểu rằng mình đang được hưởng thành quả của bao thế hệ đi trước — từ mái trường tranh đến lớp học khang trang hôm nay — và mình có trách nhiệm học tập tốt để xứng đáng với sự hy sinh ấy, để góp phần xây dựng tương lai.\n\nCuối năm, Lan đạt học sinh xuất sắc. Trong bài văn kể về ước mơ, cô bé viết: Em sẽ cố gắng học thật giỏi để mai này góp phần xây dựng đất nước, để một trăm năm sau, các em học sinh nhìn lại sẽ tự hào về thế hệ của chúng em hôm nay.\n\nCâu 4. Dòng chữ \"Quá khứ là nền tảng, tương lai là khát vọng, còn hiện tại là điều quý giá nhất\" có ý nghĩa gì?", "options": ["A. Chỉ nên sống cho hiện tại", "B. Khẳng định mối quan hệ giữa ba thời gian: trân trọng quá khứ, hướng tới tương lai, nhưng quan trọng nhất là sống tốt ở hiện tại", "C. Quá khứ không quan trọng", "D. Tương lai là điều duy nhất đáng quan tâm"], "answer": "B", "explain": "Đây là triết lí trung tâm: biết ơn quá khứ (nền tảng), nuôi khát vọng tương lai, nhưng phải hành động ở hiện tại — thông điệp cân bằng, sâu sắc.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÁNH CỬA THỜI GIAN\n\nTrong thư viện cũ của trường có một cánh cửa gỗ luôn đóng kín. Tương truyền, đó là cánh cửa thời gian — ai mở ra sẽ được thấy một lát cắt của quá khứ hoặc tương lai.\n\nNhân ngày trực nhật, Lan được giao chìa "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lòng biết ơn các thế hệ đi trước của tuổi trẻ hôm nay.", "explain": "DÀN Ý:\n1. Mở đoạn: thế hệ trẻ hôm nay được hưởng thành quả của bao thế hệ đi trước.\n2. Thân đoạn: (a) Sự hy sinh: từ mái trường tranh đến lớp học khang trang; từ chiến tranh đến hòa bình; (b) Biểu hiện biết ơn: học tập tốt, sống xứng đáng, tiếp nối truyền thống; (c) Phê phán thói vô ơn, sống ích kỉ, phụ công người đi trước.\n3. Kết đoạn: hãy sống xứng đáng.\n\nBÀI MẪU:\nTuổi trẻ hôm nay đang được hưởng những thành quả to lớn từ sự hy sinh của bao thế hệ đi trước — từ mái trường tranh vách đất đến lớp học khang trang hiện đại, từ những năm tháng chiến tranh gian khổ đến cuộc sống hòa bình hôm nay. Mỗi trang sách ta học, mỗi con đường ta đi đều thấm đẫm mồ hôi, xương máu của ông cha. Nhận thức được điều ấy, lòng biết ơn các thế hệ đi trước phải trở thành đạo lí, thành động lực sống của mỗi người trẻ. Biết ơn không phải là lời nói suông mà phải thể hiện bằng hành động: chăm chỉ học tập để không phụ công dạy dỗ, sống có lí tưởng, có trách nhiệm, tiếp nối truyền thống tốt đẹp của dân tộc và góp phần xây dựng đất nước ngày càng giàu mạnh. Đáng phê phán là những bạn trẻ vô ơn, sống ích kỉ, hưởng thụ, quên rằng mình đang đứng trên vai những người khổng lồ. Như lời nhắn trong câu chuyện Cánh cửa thời gian: quá khứ là nền tảng để ta vững bước, và cách tốt nhất để tri ân quá khứ là sống thật tốt ở hiện tại, hướng tới một tương lai xứng đáng.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ về sự sáng tạo trong việc sử dụng yếu tố kì ảo của truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và sự sáng tạo trong xây dựng yếu tố kì ảo.\nII. Thân bài:\n1. Mô típ quen thuộc: cánh cửa thời gian, quả cầu pha lê thấy quá khứ — tương lai (vay mượn từ văn học dân gian và khoa học viễn tưởng).\n2. Sự sáng tạo:\n   a. Đặt trong không gian học đường gần gũi (thư viện trường) thay vì thế giới xa xôi.\n   b. Không dùng để phiêu lưu, giải trí mà để giáo dục: so sánh ba thời điểm để khơi dậy lòng biết ơn và trách nhiệm.\n   c. Chi tiết ánh mắt khát khao tri thức vượt thời gian — sáng tạo giàu ý nghĩa.\n   d. Kết thúc: tất cả chỉ trong khoảnh khắc — nhấn mạnh giá trị của nhận thức, không phải phép màu.\n3. Giá trị: làm mới mô típ cũ, phù hợp với tâm lí bạn đọc trẻ; gửi gắm thông điệp thời sự về giáo dục.\n4. Bài học về quy luật sáng tạo: vay mượn là bình thường, sáng tạo mới làm nên giá trị.\nIII. Kết bài: khẳng định tài năng sáng tạo; liên hệ.\n\nĐOẠN MẪU (mở bài):\nVay mượn mô típ cũ không phải là điều đáng chê trách trong sáng tạo nghệ thuật — vấn đề là nhà văn cải biến, sáng tạo nó như thế nào để mang hơi thở mới. Truyện ngắn Cánh cửa thời gian là một ví dụ điển hình: tác giả vay mượn mô típ quen thuộc về cánh cửa thời gian và quả cầu thấy được quá khứ — tương lai, nhưng bằng sự sáng tạo độc đáo đã biến nó thành phương tiện giáo dục sâu sắc về lòng biết ơn và trách nhiệm của thế hệ trẻ. Phân tích sự sáng tạo này giúp ta hiểu rõ hơn quy luật vay mượn — cải biến — sáng tạo trong văn học.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI BẠN TỪ QUÁ KHỨ\n\nHùng là một học sinh cá biệt: hay bỏ học, đánh nhau, khiến thầy cô và cha mẹ phiền lòng. Ai cũng nghĩ cậu là đứa trẻ hư hỏng, không thể cứu vãn.\n\nMột đêm mưa, trên đường về nhà sau một trận ẩu đả, Hùng trú mưa dưới mái hiên một ngôi nhà cổ. Bỗng cậu nghe tiếng khóc thút thít. Nhìn vào trong qua khe cửa, Hùng sững sờ: cậu thấy chính mình — nhưng là mình của năm năm về trước, cậu bé ngoan ngoãn, học giỏi, luôn cười tươi.\n\nCậu bé trong nhà ngẩng lên, nhìn thẳng vào Hùng qua khe cửa: Anh là ai? Sao anh trông giống em thế? Hùng lắp bắp: Anh... anh là em của mười năm sau.\n\nCậu bé reo lên: Thật không? Vậy sau này em sẽ thế nào? Có trở thành người tốt không? Hùng cúi đầu, không dám trả lời. Cậu bé lại hỏi: Em có làm cha mẹ buồn lòng không? Em có còn là học sinh giỏi không?\n\nTừng câu hỏi ngây thơ như những nhát dao đâm vào tim Hùng. Cậu òa khóc: Anh xin lỗi... Anh đã làm hỏng tất cả. Anh đã phụ lòng cha mẹ, phụ cả chính em ngày xưa.\n\nCậu bé im lặng một lúc rồi nói, giọng trong trẻo: Chưa muộn đâu anh. Em tin anh có thể thay đổi. Vì em chính là anh mà — nếu em tin mình là người tốt thì anh cũng có thể trở lại làm người tốt.\n\nMưa tạnh, Hùng ngẩng lên thì ngôi nhà cổ đã biến mất, chỉ còn bãi đất trống. Cậu không biết đó là mơ hay thực, là phép màu hay ảo giác. Nhưng những lời của cậu bé cứ vang mãi trong đầu.\n\nTừ hôm đó, Hùng thay đổi hoàn toàn. Cậu đi học đều, chăm chỉ, xin lỗi những người mình từng làm tổn thương. Ban đầu ai cũng nghi ngờ, nhưng sự kiên trì của Hùng dần khiến mọi người tin tưởng.\n\nCuối năm, Hùng được tuyên dương là học sinh tiến bộ nhất trường. Trong buổi lễ, cậu nói: Em cảm ơn một người bạn đặc biệt — chính là em của ngày xưa — đã giúp em tìm lại chính mình.\n\nĐêm đó, Hùng mơ thấy cậu bé ngày xưa mỉm cười vẫy tay chào. Cậu hiểu rằng: quá khứ không thể thay đổi, nhưng con người có thể thay đổi từ hiện tại. Và đôi khi, để tìm lại chính mình, ta chỉ cần lắng nghe tiếng nói trong trẻo của lương tâm.\n\nCâu 1. Yếu tố kì ảo trong truyện là gì?", "options": ["A. Trận mưa lớn", "B. Hùng gặp chính mình của năm năm về trước trong ngôi nhà cổ — cuộc đối thoại vượt thời gian", "C. Hùng là học sinh cá biệt", "D. Bãi đất trống"], "answer": "B", "explain": "Cuộc gặp gỡ giữa Hùng hiện tại và chính mình trong quá khứ là yếu tố hoang đường, kì ảo — không thể xảy ra trong hiện thực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI BẠN TỪ QUÁ KHỨ\n\nHùng là một học sinh cá biệt: hay bỏ học, đánh nhau, khiến thầy cô và cha mẹ phiền lòng. Ai cũng nghĩ cậu là đứa trẻ hư hỏng, không thể cứu vãn.\n\nMột đêm mưa, trên đường về nhà sau một trận ẩu đ r": "B", "explain": "Văn bản miêu tả rõ: Hùng là học sinh cá biệt, hay bỏ học, đánh nhau — ai cũng nghĩ là đứa trẻ hư hỏng không thể cứu vãn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI BẠN TỪ QUÁ KHỨ\n\nHùng là một học sinh cá biệt: hay bỏ học, đánh nhau, khiến thầy cô và cha mẹ phiền lòng. Ai cũng nghĩ cậu là đứa trẻ hư hỏng, không thể cứu vãn.\n\nMột đêm mưa, trên đường về nhà sau một trận ẩu đả, Hùng trú mưa dưới mái hiên một ngôi nhà cổ. Bỗng cậu nghe tiếng khóc thút thít. Nhìn vào trong qua khe cửa, Hùng sững sờ: cậu thấy chính mình — nhưng là mình của năm năm về trước, cậu bé ngoan ngoãn, học giỏi, luôn cười tươi.\n\nCậu bé trong nhà ngẩng lên, nhìn thẳng vào Hùng qua khe cửa: Anh là ai? Sao anh trông giống em thế? Hùng lắp bắp: Anh... anh là em của mười năm sau.\n\nCậu bé reo lên: Thật không? Vậy sau này em sẽ thế nào? Có trở thành người tốt không? Hùng cúi đầu, không dám trả lời. Cậu bé lại hỏi: Em có làm cha mẹ buồn lòng không? Em có còn là học sinh giỏi không?\n\nTừng câu hỏi ngây thơ như những nhát dao đâm vào tim Hùng. Cậu òa khóc: Anh xin lỗi... Anh đã làm hỏng tất cả. Anh đã phụ lòng cha mẹ, phụ cả chính em ngày xưa.\n\nCậu bé im lặng một lúc rồi nói, giọng trong trẻo: Chưa muộn đâu anh. Em tin anh có thể thay đổi. Vì em chính là anh mà — nếu em tin mình là người tốt thì anh cũng có thể trở lại làm người tốt.\n\nMưa tạnh, Hùng ngẩng lên thì ngôi nhà cổ đã biến mất, chỉ còn bãi đất trống. Cậu không biết đó là mơ hay thực, là phép màu hay ảo giác. Nhưng những lời của cậu bé cứ vang mãi trong đầu.\n\nTừ hôm đó, Hùng thay đổi hoàn toàn. Cậu đi học đều, chăm chỉ, xin lỗi những người mình từng làm tổn thương. Ban đầu ai cũng nghi ngờ, nhưng sự kiên trì của Hùng dần khiến mọi người tin tưởng.\n\nCuối năm, Hùng được tuyên dương là học sinh tiến bộ nhất trường. Trong buổi lễ, cậu nói: Em cảm ơn một người bạn đặc biệt — chính là em của ngày xưa — đã giúp em tìm lại chính mình.\n\nĐêm đó, Hùng mơ thấy cậu bé ngày xưa mỉm cười vẫy tay chào. Cậu hiểu rằng: quá khứ không thể thay đổi, nhưng con người có thể thay đổi từ hiện tại. Và đôi khi, để tìm lại chính mình, ta chỉ cần lắng nghe tiếng nói trong trẻo của lương tâm.\n\nCâu 3. Những câu hỏi ngây thơ của cậu bé có tác dụng gì với Hùng?", "options": ["A. Làm Hùng tức giận", "B. Như những nhát dao đâm vào tim — thức tỉnh lương tâm, khiến Hùng nhận ra mình đã đánh mất chính mình", "C. Không có tác dụng gì", "D. Làm Hùng bỏ nhà đi"], "answer": "B", "explain": "Tác giả ví von: \"như những nhát dao đâm vào tim\" — những câu hỏi ngây thơ trở thành tiếng nói của lương tâm, thức tỉnh Hùng, tạo bước ngoặt thay đổi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI BẠN TỪ QUÁ KHỨ\n\nHùng là một học sinh cá biệt: hay bỏ học, đánh nhau, khiến thầy cô và cha mẹ phiền lòng. Ai cũng nghĩ cậu là đứa trẻ hư hỏng, không thể cứu vãn.\n\nMột đêm mưa, trên đường về nhà sau một trận ẩu đả, Hùng trú mưa dưới mái hiên một ngôi nhà cổ. Bỗng cậu nghe tiếng khóc thút thít. Nhìn vào trong qua khe cửa, Hùng sững sờ: cậu thấy chính mình — nhưng là mình của năm năm về trước, cậu bé ngoan ngoãn, học giỏi, luôn cười tươi.\n\nCậu bé trong nhà ngẩng lên, nhìn thẳng vào Hùng qua khe cửa: Anh là ai? Sao anh trông giống em thế? Hùng lắp bắp: Anh... anh là em của mười năm sau.\n\nCậu bé reo lên: Thật không? Vậy sau này em sẽ thế nào? Có trở thành người tốt không? Hùng cúi đầu, không dám trả lời. Cậu bé lại hỏi: Em có làm cha mẹ buồn lòng không? Em có còn là học sinh giỏi không?\n\nTừng câu hỏi ngây thơ như những nhát dao đâm vào tim Hùng. Cậu òa khóc: Anh xin lỗi... Anh đã làm hỏng tất cả. Anh đã phụ lòng cha mẹ, phụ cả chính em ngày xưa.\n\nCậu bé im lặng một lúc rồi nói, giọng trong trẻo: Chưa muộn đâu anh. Em tin anh có thể thay đổi. Vì em chính là anh mà — nếu em tin mình là người tốt thì anh cũng có thể trở lại làm người tốt.\n\nMưa tạnh, ám nhận và sửa chữa.\n2. Thân đoạn: (a) Ý nghĩa: nhận lỗi là dũng cảm, là bước đầu để hoàn thiện như Hùng đã thay đổi; (b) Sửa sai cần kiên trì, hành động cụ thể; (c) Phê phán: cố chấp, đổ lỗi, tuyệt vọng buông xuôi.\n3. Kết đoạn: không bao giờ quá muộn để trở thành người tốt.\n\nBÀI MẪU:\nTrong cuộc đời, ai cũng có thể mắc sai lầm, nhất là ở tuổi trẻ bồng bột. Điều quan trọng không phải là ta đã sai như thế nào, mà là ta có dám nhận lỗi và quyết tâm sửa chữa hay không — như Hùng trong truyện, từ một học sinh cá biệt đã dũng cảm đối mặt với chính mình để thay đổi và trở thành học sinh tiến bộ nhất trường. Dám nhận lỗi là biểu hiện của dũng khí và sự trưởng thành: nó đòi hỏi ta phải thành thật với chính mình, vượt qua sự xấu hổ và định kiến của mọi người. Sửa chữa sai lầm càng cần sự kiên trì: không phải một sớm một chiều mà bằng những hành động cụ thể, bền bỉ mỗi ngày — đi học đều, chăm chỉ, xin lỗi những người mình từng làm tổn thương như Hùng đã làm. Đáng phê phán là những kẻ cố chấp không nhận sai, đổ lỗi cho hoàn cảnh, hoặc tuyệt vọng buông xuôi vì nghĩ mình không thể thay đổi. Hãy nhớ rằng không bao giờ là quá muộn để trở thành người tốt, và xã hội luôn rộng lòng đón nhận những ai thực sự muốn hoàn lương. Dũng cảm nhận lỗi hôm nay để có một ngày mai tốt đẹp hơn.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích diễn biến tâm trạng của nhân vật Hùng trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và nhân vật Hùng — hành trình từ lầm lỗi đến hoàn lương nhờ cuộc gặp kì ảo.\nII. Thân bài:\n1. Trước cuộc gặp: bất cần, hư hỏng — đánh mất chính mình.\n2. Trong cuộc gặp:\n   a. Sững sờ khi thấy mình ngày xưa ngoan ngoãn.\n   b. Xấu hổ, đau đớn trước những câu hỏi ngây thơ — lương tâm thức tỉnh.\n   c. Òa khóc, xin lỗi — sự sám hối chân thành.\n   d. Được tiếp thêm niềm tin từ chính mình ngày xưa — le lói hy vọng.\n3. Sau cuộc gặp: quyết tâm thay đổi bằng hành động cụ thể, kiên trì vượt qua nghi ngờ để được ghi nhận.\n4. Ý nghĩa: yếu tố kì ảo (gặp mình trong quá khứ) là phương tiện để nhân vật đối thoại với lương tâm — nghệ thuật độc đáo.\n5. Nghệ thuật: xây dựng tình huống kì ảo; miêu tả tâm lí tinh tế; giọng văn giàu cảm xúc.\nIII. Kết bài: khẳng định giá trị nhân văn; bài học về niềm tin và sự hoàn lương.\n\nĐOẠN MẪU (mở bài):\nTrong văn học, hành trình hoàn lương của con người luôn là đề tài giàu sức hấp dẫn và ý nghĩa nhân văn. Truyện ngắn Người bạn từ quá khứ đã kể một hành trình như thế bằng một tình huống kì ảo độc đáo: Hùng — học sinh cá biệt — gặp chính mình của năm năm về trước. Cuộc gặp gỡ vượt thời gian ấy trở thành cuộc đối thoại với lương tâm, thức tỉnh nhân vật và mở ra con đường trở lại làm người tốt. Qua diễn biến tâm trạng tinh tế của Hùng, tác phẩm gửi gắm thông điệp sâu sắc: không bao giờ là quá muộn để sửa chữa sai lầm.", "points": 0}]}]}
