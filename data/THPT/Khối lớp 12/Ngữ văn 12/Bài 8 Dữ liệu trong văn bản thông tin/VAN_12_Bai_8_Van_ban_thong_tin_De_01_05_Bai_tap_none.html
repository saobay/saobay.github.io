 lời ngắn gọn)", "answer": "Trồng và bảo vệ cây xanh; không phá hoại rừng; tuyên truyền bảo vệ rừng", "explain": "Chấp nhận các việc làm cụ thể: tham gia trồng cây; không bẻ cành, phá hoại; tiết kiệm giấy; tố giác hành vi phá rừng...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của rừng đối với cuộc sống con người.", "explain": "DÀN Ý:\n1. Mở đoạn: rừng là lá phổi xanh, có vai trò to lớn.\n2. Thân đoạn: (a) Vai trò: điều hòa khí hậu, giữ đất nước, cung cấp lâm sản, phòng chống thiên tai (dẫn số liệu 14,8 triệu ha, 42% che phủ); (b) Thực trạng đáng lo: chặt phá, cháy rừng; (c) Phê phán hành vi phá rừng.\n3. Kết đoạn: hãy bảo vệ rừng.\n\nBÀI MẪU:\nRừng được ví như lá phổi xanh của Trái Đất, có vai trò vô cùng quan trọng đối với cuộc sống con người. Về môi trường, rừng điều hòa khí hậu, giữ đất, giữ nước, là mái nhà chung của hàng nghìn loài động thực vật. Về kinh tế, rừng cung cấp gỗ, lâm sản và tạo sinh kế cho hàng triệu người dân. Đặc biệt, rừng đầu nguồn có vai trò phòng hộ: giảm lũ lụt, sạt lở đất — những thảm họa ngày càng khốc liệt do biến đổi khí hậu. Việt Nam hiện có khoảng 14,8 triệu ha rừng với độ che phủ khoảng 42%, tăng đáng kể so với trước đây nhờ nỗ lực trồng và bảo vệ rừng. Thế nhưng, rừng vẫn đang bị đe dọa: hàng nghìn ha bị chặt phá trái phép mỗi năm, cháy rừng diễn biến phức tạp. Những kẻ phá rừng vì lợi ích trước mắt đang tự tay hủy hoại tương lai của chính mình và cộng đồng. Bảo vệ rừng là trách nhiệm của mỗi công dân: trồng thêm cây xanh, không tiếp tay cho lâm tặc, nâng cao ý thức cộng đồng. Mỗi cây xanh được giữ gìn hôm nay là một hơi thở trong lành cho ngày mai.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết thư trao đổi (theo kiểu bài viết của Bài 8 trong SGK) với một người bạn về vấn đề bảo vệ rừng ở địa phương em.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở đầu thư: địa điểm, thời gian; lời chào; lí do viết thư (trao đổi về vấn đề bảo vệ rừng).\nII. Nội dung:\n1. Nêu vấn đề: tình trạng rừng ở địa phương (bị chặt phá / được bảo vệ tốt) với những quan sát, số liệu cụ thể.\n2. Trình bày quan điểm: bảo vệ rừng là trách nhiệm chung; phân tích vai trò của rừng.\n3. Đề xuất: những việc hai bạn và mọi người có thể làm (trồng cây, tuyên truyền, tố giác phá rừng).\n4. Tôn trọng, mong nhận được ý kiến phản hồi của bạn.\nIII. Kết thúc: lời chào, chữ kí.\n\nĐOẠN MẪU (mở đầu thư):\nHà Nội, ngày 10 tháng 10 năm 2026\nBạn Lan thân mến!\nĐã lâu rồi chúng mình chưa gặp nhau. Hôm nay, sau khi học bài về vai trò của rừng và đọc được những số liệu đáng lo ngại về tình trạng rừng hiện nay, mình viết thư này để trao đổi với bạn về vấn đề bảo vệ rừng ở quê mình — một vấn đề mà mình nghĩ tuổi trẻ chúng ta không thể thờ ơ.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nĐỌC SÁCH VÀ SỰ PHÁT TRIỂN TRÍ NÃO\n\nNhiều nghiên cứu khoa học đã chứng minh đọc sách có tác động tích cực đến sự phát triển của não bộ. Khi đọc, não phải hoạt động tích cực để xử lí ngôn ngữ, tưởng tượng hình ảnh và suy luận logic — đó là một bài tập thể dục tuyệt vời cho trí não.\n\nMột nghiên cứu được công bố trên tạp chí khoa học cho thấy những người duy trì thói quen đọc sách thường xuyên có khả năng tập trung tốt hơn khoảng 30% so với người ít đọc. Đọc sách còn giúp mở rộng vốn từ vựng: trung bình, một người đọc sách đều đặn có thể tiếp thu thêm hàng nghìn từ mới mỗi năm, từ đó diễn đạt ý tưởng mạch lạc, chính xác hơn.\n\nĐặc biệt, đọc sách giúp giảm căng thẳng hiệu quả. Các nhà khoa học phát hiện chỉ cần đọc sách 6 phút mỗi ngày có thể làm giảm mức độ căng thẳng đến hơn 60% — hiệu quả hơn cả nghe nhạc hay đi dạo. Đó là vì khi đắm chìm vào trang sách, tâm trí được thư giãn, tạm quên đi những lo toan.\n\nĐọc sách còn nuôi dưỡng trí tưởng tượng và khả năng thấu cảm. Khi theo dõi số phận các nhân vật, não bộ của người đọc học cách đặt mình vào vị trí của người khác — kĩ năng quan trọng trong giao tiếp và cuộc sống.\n\nTuy nhiên, cần đọc sách đúng cách: chọn sách có giá trị, đọc tập trung thay vì đọc lướt, kết hợp ghi chép và suy ngẫm. Đọc sách không phải là đọc càng nhiều càng tốt mà là đọc sao cho hiệu quả, để mỗi trang sách đều trở thành dưỡng chất nuôi dưỡng trí tuệ.\n\nCâu 1. Theo nghiên cứu được nêu, người đọc sách thường xuyên có khả năng tập trung tốt hơn bao nhiêu so với người ít đọc?", "options": ["A. Khoảng 10%", "B. Khoảng 30%", "C. Khoảng 50%", "D. Gấp đôi"], "answer": "B", "explain": "Văn bản cung cấp số liệu: người đọc sách thường xuyên có khả năng tập trung tốt hơn khoảng 30% so với người ít đọc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nĐỌC SÁCH VÀ SỰ PHÁT TRIỂN TRÍ NÃO\n\nNhiều nghiên cứu khoa học đã chứng minh đọc sách có tác động tích cực đến sự phát triển của não bộ. Khi đọc, não phải hoạt động tích cực để xử lí ngôn ngữ, tưởng tượng hình ảnh và suy luận logic — đó là một bài tập thể dục tuyệt vời cho trí não.\n\nMột nghiên cứu được công bố trên tạp chí khoa học cho thấy những người duy trì thói quen đọc sách thường xuyên có khả năng tập trung tốt hơn khoảng 30% so với người ít đọc. Đọc sách còn giúp mở rộng vốn từ vựng: trung bình, một người đọc sách đều đặn có thể tiếp thu thêm hàng nghìn từ mới mỗi năm, từ đó diễn đạt ý tưởng mạch lạc, chính xác hơn.\n\nĐặc biệt, đọc sách giúp giảm căng thẳng hiệu quả. Các nhà khoa học phát hiện chỉ cần đọc sách 6 phút mỗi ngày có thể làm giảm mức độ căng thẳng đến hơn 60% — hiệu quả hơn cả nghe nhạc hay đi dạo. Đó là vì khi đắm chìm vào trang sách, tâm trí được thư giãn, tạm quên đi những lo toan.\n\nĐọc sách còn nuôi dưỡng trí tưởng tượng và khả năng thấu cảm. Khi theo dõi số phận các nhân vật, não bộ của người đọc học cách đặt mình vào vị trí của người khác — kĩ năng quan trọng trong giao tiếp và cuộc sống.\n\nTuy nhiên, cần đọc sách đúng cách: chọn sách có giá trị, đọc tập trung thay vì đọc lướt, kết hợp ghi chép và suy ngẫm. Đọc sách không phải là đọc càng nhiều càng tốt mà là đọc sao cho hiệu quả, để mỗi trang sách đều trở thành dưỡng chất nuôi dưỡng trí tuệ.\n\nCâu 2. Đọc sách 6 phút mỗi ngày có thể làm giảm căng thẳng bao nhiêu?", "options": ["A. Khoảng 20%", "B. Khoảng 40%", "C. Đến hơn 60% — hiệu quả hơn cả nghe nhạc hay đi dạo", "D. Không giảm"], "answer": "C", "explain": "Số liệu cụ thể: đọc sách 6 phút mỗi ngày có thể giảm căng thẳng đến hơn 60%, hiệu quả hơn nghe nhạc hay đi dạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nĐỌC SÁCH VÀ SỰ PHÁT TRIỂN TRÍ NÃO\n\nNhiều nghiên cứu khoa học đã chứng minh đọc sách có tác động tích cực đến sự phát triển của não bộ. Khi đọc, não phải hoạt động tích cực để xử lí ngôn ngữ, tưởng tượng hình ảnh và suy luận logic — đó là một bài tập thể dục tuyệt vời cho trí não.\n\nMột nghiên cứu được công bố trên tạp chí khoa học cho thấy những người duy trì thói quen đọc sách thường xuyên có khả năng tập trung tốt hơn khoảng 30% so với người ít đọc. Đọc sách còn giúp mở rộng vốn từ vựng: trung bình, một người đọc sách đều đặn có thể tiếp thu thêm hàng nghìn từ mới mỗi năm, từ đó diễn đạt ý tưởng mạch lạc, chính xác hơn.\n\nĐặc biệt, đọc sách giúp giảm căng thẳng hiệu quả. Các nhà khoa học phát hiện chỉ cần đọc sách 6 phút mỗi ngày có thể làm giảm mức độ căng thẳng đến hơn 60% — hiệu quả hơn cả nghe nhạc hay đi dạo. Đó là vì khi đắm chìm vào trang sách, tâm trí được thư giãn, tạm quên đi những lo toan.\n\nĐọc sách còn nuôi dưỡng trí tưởng tượng và khả năng thấu cảm. Khi theo dõi số phận các nhân vật, não bộ của người đọc học cách đặt mình vào vị trí của người khác — kĩ năng quan trọng trong giao tiếp và cuộc sống.\n\nTuy nhiên, cần đọc sách đúng cách: chọn sách có giá trị, đọc tập trung thay vì đọc lướt, kết hợp ghi chép và suy ngẫm. Đọc sách không phải là đọc càng nhiều càng tốt mà là đọc sao cho hiệu quả, để mỗi trang ệ.\n\nCâu 4. Theo văn bản, đọc sách đúng cách là như thế nào?", "options": ["A. Đọc càng nhiều càng tốt", "B. Chọn sách có giá trị, đọc tập trung thay vì đọc lướt, kết hợp ghi chép và suy ngẫm — hiệu quả quan trọng hơn số lượng", "C. Chỉ đọc sách giáo khoa", "D. Đọc thật nhanh"], "answer": "B", "explain": "Văn bản nhấn mạnh: không phải đọc càng nhiều càng tốt mà phải đọc hiệu quả — chọn sách hay, đọc tập trung, có suy ngẫm.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nĐỌC SÁCH VÀ SỰ PHÁT TRIỂN TRÍ NÃO\n\nNhiều nghiên cứu khoa học đã chứng minh đọc sách có tác động tích cực đến sự phát triển của não bộ. Khi đọc, não phải hoạt động tích cực để xử lí ngôn ngữ, tưởng tượng hình ảnh và suy luận logic — đó là một bài tập thể dục tuyệt vời cho trí não.\n\nMột nghiên cứu được công bố trên tạp chí khoa học cho thấy những người duy trì thói quen đọc sách thường xuyên có khả năng tập trung tốt hơn khoảng 30% so với người ít đọc. Đọc sách còn giúp mở rộng vốn từ vựng: trung bình, một người đọc sách đều đặn có thể tiếp thu thêm hàng nghìn từ mới mỗi năm, từ đó diễn đạt ý tưởng mạch lạc, chính xác hơn.\n\nĐặc biệt, đọc sách giúp giảm căng thẳng hiệu quả. Các nhà khoa học phát hiện chỉ cần đọc sách 6 phút mỗi ngày có thể làm giảm mức độ căng thẳng đến hơn 60% — hiệu quả hơn cả nghe nhạc hay đi dạo. Đó là vì khi đắm chìm vào trang sách, tâm trí được thư giãn, tạm quên đi những lo toan.\n\nĐọc sách còn nuôi dưỡng trí tưởng tượng và khả năng thấu cảm. Khi theo dõi số phận các nhân vật, não bộ của người đọc học cách đặt mình vào vị trí của người khác — kĩ năng quan trọng trong giao tiếp và cuộc sống.\n\nTuy nhiên, cần đọc sách đúng cách: chọn sách có giá trị, đọc tập trung thay vì đọc lướt, kết hợp ghi chép và suy ngẫm. Đọc sách không phải là đọc càng nhiều càng tốt mà là đọc sao cho hiệu quả, để mỗi trang sách đều trở thành dưỡng chất nuôi dưỡng trí tuệ.\n\nCâu 5. Qua văn bản, em sẽ thay đổi thói quen đọc sách của mình như thế nào? (Trả lời ngắn gọn)", "answer": "Đọc sách đều đặn mỗi ngày, chọn sách hay, đọc tập trung và suy ngẫm", "explain": "Chấp nhận các cách cụ thể: dành 30 phút đọc sách mỗi ngày; bớt lướt điện thoại; ghi chép khi đọc...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lợi ích của việc đọc sách.", "explain": "DÀN Ý:\n1. Mở đoạn: đọc sách mang lại nhiều lợi ích đã được khoa học chứng minh.\n2. Thân đoạn: (a) Phát triển trí não, tăng khả năng tập trung (30%); (b) Mở rộng vốn từ, diễn đạt tốt hơn; (c) Giảm căng thẳng (hơn 60% chỉ sau 6 phút); (d) Nuôi dưỡng trí tưởng tượng, lòng thấu cảm; (e) Phê phán thói lười đọc.\n3. Kết đoạn: hãy đọc sách mỗi ngày.\n\nBÀI MẪU:\nĐọc sách mang lại những lợi ích to lớn đã được khoa học chứng minh, xứng đáng trở thành thói quen của mỗi người, nhất là tuổi trẻ. Trước hết, đọc sách là bài tập tuyệt vời cho trí não: não phải hoạt động tích cực để xử lí ngôn ngữ, tưởng tượng và suy luận; người đọc thường xuyên có khả năng tập trung tốt hơn khoảng 30% so với người ít đọc. Đọc sách còn giúp mở rộng vốn từ vựng thêm hàng nghìn từ mỗi năm, từ đó diễn đạt ý tưởng mạch lạc, chính xác hơn — kĩ năng vô cùng quan trọng trong học tập và công việc. Đặc biệt, đọc sách là liều thuốc giảm căng thẳng hiệu quả: chỉ 6 phút đọc mỗi ngày có thể giảm căng thẳng đến hơn 60%, tốt hơn cả nghe nhạc hay đi dạo. Không chỉ vậy, khi đắm chìm vào số phận các nhân vật, ta còn học được cách thấu cảm, đặt mình vào vị trí người khác. Thế nhưng, đáng buồn là nhiều bạn trẻ hôm nay dành hàng giờ cho điện thoại mà không đọc nổi một cuốn sách trong năm. Hãy nhớ: đọc sách đúng cách — chọn sách hay, đọc tập trung, có suy ngẫm — thì mỗi trang sách đều trở thành dưỡng chất nuôi dưỡng trí tuệ. Hãy bắt đầu từ hôm nay với ít nhất 30 phút đọc sách mỗi ngày.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về văn hóa đọc của giới trẻ hiện nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — văn hóa đọc trước thách thức thời đại số.\nII. Thân bài:\n1. Lợi ích của đọc sách (dẫn số liệu khoa học).\n2. Thực trạng: nhiều bạn trẻ lười đọc, đọc lướt, thiếu chọn lọc.\n3. Nguyên nhân: sức hút của giải trí số; thiếu định hướng; thiếu thời gian.\n4. Hậu quả: tri thức nông, tư duy hời hợt, dễ tin vào tin giả.\n5. Giải pháp: xây dựng thói quen đọc mỗi ngày; chọn sách hay; gia đình, nhà trường khuyến khích; tận dụng sách điện tử có chọn lọc.\nIII. Kết bài: khẳng định; kêu gọi.\n\nĐOẠN MẪU (mở bài):\nKhoa học đã chứng minh đọc sách giúp tăng khả năng tập trung 30%, giảm căng thẳng hơn 60% chỉ sau 6 phút đọc. Thế nhưng, nghịch lí là trong thời đại thông tin bùng nổ, văn hóa đọc — nhất là trong giới trẻ — lại đang đứng trước những thách thức nghiêm trọng. Nhiều bạn trẻ có thể dành hàng giờ lướt mạng xã hội mà không đọc nổi một cuốn sách trong cả năm. Thực trạng đáng báo động này đòi hỏi chúng ta phải nhìn nhận nghiêm túc và tìm giải pháp kịp thời.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nRÁC THẢI NHỰA: THÁCH THỨC CỦA NHÂN LOẠI\n\nNhựa là một trong những phát minh vĩ đại của nhân loại, nhưng rác thải nhựa đang trở thành thách thức nghiêm trọng đối với môi trường toàn cầu. Theo ước tính của các tổ chức môi trường, mỗi năm thế giới thải ra khoảng 300 triệu tấn rác nhựa, trong đó có khoảng 8 triệu tấn đổ ra đại dương.\n\nĐiều đáng lo ngại là nhựa phải mất hàng trăm năm mới phân hủy hoàn toàn. Một chiếc túi ni lông cần khoảng 500 năm để phân hủy; chai nhựa cần khoảng 450 năm. Trong thời gian đó, chúng vỡ vụn thành các hạt vi nhựa, xâm nhập vào đất, nước, không khí và cả chuỗi thức ăn — đe dọa sức khỏe con người.\n\nViệt Nam là một trong những quốc gia thải rác nhựa ra biển nhiều. Mỗi ngày, cả nước thải ra hàng nghìn tấn rác nhựa, nhưng tỉ lệ thu gom, tái chế còn thấp. Nhiều bãi biển, dòng sông đang bị ô nhiễm nặng nề bởi rác nhựa.\n\nTrước thực trạng này, nhiều giải pháp đã được triển khai: hạn chế túi ni lông, khuyến khích dùng sản phẩm thân thiện môi trường, tăng cường thu gom, tái chế. Nhiều quốc gia đã cấm đồ nhựa dùng một lần. Tại Việt Nam, phong trào chống rác thải nhựa đang lan tỏa mạnh mẽ với sự tham gia của đông đảo người dân, nhất là giới trẻ.\n\nMỗi chúng ta có thể góp phần từ những việc nhỏ: mang túi vải đi chợ, dùng bình nước cá nhân, hạn chế đồ nhựa dùng một lần, phân loại rác thải. Khi hàng triệu người cùng hành động, thách thức rác thải nhựa sẽ dần được đẩy lùi.\n\nCâu 1. Mỗi năm thế giới thải ra khoảng bao nhiêu rác nhựa, bao nhiêu đổ ra đại dương?", "options": ["A. 100 triệu tấn, 1 triệu tấn ra biển", "B. Khoảng 300 triệu tấn, trong đó khoảng 8 triệu tấn đổ ra đại dương", "C. 500 triệu tấn, 50 triệu tấn ra biển", "D. 50 triệu tấn, không ra biển"], "answer": "B", "explain": "Văn bản cung cấp số liệu: khoảng 300 triệu tấn rác nhựa mỗi năm, trong đó khoảng 8 triệu tấn đổ ra đại dương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nRÁC THẢI NHỰA: THÁCH THỨC CỦA NHÂN LOẠI\n\nNhựa là một trong những phát minh vĩ đại của nhân loại, nhưng rác thải nhựa đang trở thành thách thức nghiêm trọng đối với môi trường toàn cầu. Theo ước tính của các tổ chức môi trường, mỗi năm thế giới thải ra khoảng 300 triệu tấn rác nhựa, trong đó có khoảng 8 triệu tấn đổ ra đại dương.\n\nĐiều đáng lo ngại là nhựa phải mất hàng trăm năm mới phân hủy hoàn toàn. Một chiếc túi ni lông cần khoảng 500 năm để phân hủy; chai nhựa cần khoảng 450 năm. Trong thời gian đó, chúng vỡ vụn thành các hạt vi nhựa, xâm nhập vào đất, nước, không khí và cả chuỗi thức ăn — đe dọa sức khỏe con người.\n\nViệt Nam là một trong những quốc gia thải rác nhựa ra biển nhiều. Mỗi ngày, cả nước thải ra hàng nghìn tấn rác nhựa, nhưng tỉ lệ thu gom, tái chế còn thấp. Nhiều bãi biển, dòng sông đang bị ô nhiễm nặng nề bởi rác nhựa.\n\nTrước thực trạng này, nhiều giải pháp đã được triển khai: hạn chế túi ni lông, khuyến khích dùng sản phẩm thân thiện môi trường, tăng cường thu gom, tái chế. Nhiều quốc gia đã cấm đồ nhựa dùng một lần. Tại Việt Nam, phong trào chống rác thải nhựa đang lan tỏa mạnh mẽ với sự tham gia của đông đảo người dân, nhất là giới trẻ.\n\nMỗi chúng ta có thể góp phần từ những việc nhỏ: mang túi vải đi chợ, dùng bình nước cá nhân, hạn chế đồ nhựa dùng một lần, phân loại rác thải. Khi hàng triệu người cùng hành động, thách thức rác thải nhựa sẽ dần được đẩy lùi.\n\nCâu 2. Túi ni lông và chai nhựa cần bao lâu để phân hủy?", "options": ["A. Vài ngày", "B. Túi ni lông khoảng 500 năm, chai nhựa khoảng 450 năm", "C. Một năm", "D. Mười năm"], "answer": "B", "explain": "Số liệu cụ thể: túi ni lông cần khoảng 500 năm, chai nhựa khoảng 450 năm để phân hủy hoàn toàn — con số gây giật mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nRÁC THẢI NHỰA: THÁCH THỨC CỦA NHÂN LOẠI\n\nNhựa là một trong những phát minh vĩ đại của nhân loại, nhưng rác thải nhựa đang trở thành thách thức nghiêm trọng đối với môi trường toàn cầu. Theo ước tính của các tổ chức môi trường, mỗi năm thế giới thải ra khoảng 300 triệu tấn rác nhựa, trong đó có khoảng 8 triệu tấn đổ ra đại dương.\n\nĐiều đáng lo ngại là nhựa phải mất hàng trăm năm mới phân hủy hoàn toàn. Một chiếc túi ni lông cần khoảng 500 năm để phân hủy; chai nhựa cần khoảng 450 năm. Trong thời gian đó, chúng vỡ vụn thành các hạt vi nhựa, xâm nhập vào đất, nước, không khí và cả chuỗi thức ăn — đe dọa sức khỏe con người.\n\nViệt Nam là một trong những quốc gia thải rác nhựa ra biển nhiều. Mỗi ngày, cả nước thải ra hàng nghìn tấn rác nhựa, nhưng tỉ lệ thu gom, tái chế còn thấp. Nhiều bãi biển, dòng sông đang bị ô nhiễm nặng nề bởi rác nhựa.\n\nTrước thực trạng này, nhiều giải pháp đã được triển khai: hạn chế túi ni lông, khuyến khích dùng sản phẩm thân thiện ng một lần. Tại Việt Nam, phong trào chống rác thải nhựa đang lan tỏa mạnh mẽ với sự tham gia của đông đảo người dân, nhất là giới trẻ.\n\nMỗi chúng ta có thể góp phần từ những việc nhỏ: mang túi vải đi chợ, dùng bình nước cá nhân, hạn chế đồ nhựa dùng một lần, phân loại rác thải. Khi hàng triệu người cùng hành động, thách thức rác thải nhựa sẽ dần được đẩy lùi.\n\nCâu 4. Các giải pháp chống rác thải nhựa được nêu là gì?", "options": ["A. Không có giải pháp", "B. Hạn chế túi ni lông, dùng sản phẩm thân thiện môi trường, tăng thu gom tái chế, cấm đồ nhựa dùng một lần", "C. Thải ra biển", "D. Đốt hết"], "answer": "B", "explain": "Văn bản liệt kê các giải pháp đang triển khai ở nhiều quốc gia và Việt Nam — thông tin có tính định hướng hành động.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nRÁC THẢI NHỰA: THÁCH THỨC CỦA NHÂN LOẠI\n\nNhựa là một trong những phát minh vĩ đại của nhân loại, nhưng rác thải nhựa đang trở thành thách thức nghiêm trọng đối với môi trường toàn cầu. Theo ước tính của các tổ chức môi trường, mỗi năm thế giới thải ra khoảng 300 triệu tấn rác nhựa, trong đó có khoảng 8 triệu tấn đổ ra đại dương.\n\nĐiều đáng lo ngại là nhựa phải mất hàng trăm năm mới phân hủy hoàn toàn. Một chiếc túi ni lông cần khoảng 500 năm để phân hủy; chai nhựa cần khoảng 450 năm. Trong thời gian đó, chúng vỡ vụn thành các hạt vi nhựa, xâm nhập vào đất, nước, không khí và cả chuỗi thức ăn — đe dọa sức khỏe con người.\n\nViệt Nam là một trong những quốc gia thải rác nhựa ra biển nhiều. Mỗi ngày, cả nước thải ra hàng nghìn tấn rác nhựa, nhưng tỉ lệ thu gom, tái chế còn thấp. Nhiều bãi biển, dòng sông đang bị ô nhiễm nặng nề bởi rác nhựa.\n\nTrước thực trạng này, nhiều giải pháp đã được triển khai: hạn chế túi ni lông, khuyến khích dùng sản phẩm thân thiện môi trường, tăng cường thu gom, tái chế. Nhiều quốc gia đã cấm đồ nhựa dùng một lần. Tại Việt Nam, phong trào chống rác thải nhựa đang lan tỏa mạnh mẽ với sự tham gia của đông đảo người dân, nhất là giới trẻ.\n\nMỗi chúng ta có thể góp phần từ những việc nhỏ: mang túi vải đi chợ, dùng bình nước cá nhân, hạn chế đồ nhựa dùng một lần, phân loại rác thải. Khi hàng triệu người cùng hành động, thách thức rác thải nhựa sẽ dần được đẩy lùi.\n\nCâu 5. Theo em, mỗi người có thể làm gì để giảm rác thải nhựa? (Trả lời ngắn gọn)", "answer": "Mang túi vải, dùng bình nước cá nhân, hạn chế đồ nhựa dùng một lần, phân loại rác", "explain": "Chấp nhận các việc làm cụ thể khác: từ chối ống hút nhựa; tái sử dụng; tham gia dọn rác...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về trách nhiệm của tuổi trẻ trong việc chống rác thải nhựa.", "explain": "DÀN Ý:\n1. Mở đoạn: rác thải nhựa là thách thức lớn, tuổi trẻ phải tiên phong chống lại.\n2. Thân đoạn: (a) Thực trạng: 300 triệu tấn/năm, 8 triệu tấn ra biển; túi ni lông 500 năm mới phân hủy; (b) Việc làm cụ thể: túi vải, bình nước cá nhân, hạn chế nhựa dùng một lần, phân loại rác; (c) Phê phán thói vô ý thức: xả rác bừa bãi, lạm dụng đồ nhựa.\n3. Kết đoạn: hành động ngay.\n\nBÀI MẪU:\nRác thải nhựa đang là một trong những thách thức môi trường nghiêm trọng nhất, và tuổi trẻ phải là lực lượng tiên phong trong cuộc chiến chống lại nó. Mỗi năm, thế giới thải ra khoảng 300 triệu tấn rác nhựa, trong đó 8 triệu tấn đổ ra đại dương; một chiếc túi ni lông cần đến 500 năm mới phân hủy — những con số biết nói về mức độ nghiêm trọng của vấn đề. Trách nhiệm của tuổi trẻ thể hiện qua những hành động cụ thể mỗi ngày: mang túi vải đi chợ thay vì túi ni lông, dùng bình nước cá nhân thay vì chai nhựa, từ chối ống hút nhựa, hạn chế đồ nhựa dùng một lần, phân loại rác thải đúng cách. Không chỉ vậy, người trẻ còn cần lan tỏa ý thức bảo vệ môi trường đến gia đình, bạn bè và cộng đồng qua các chiến dịch, phong trào. Đáng phê phán là những bạn trẻ vô ý thức: xả rác bừa bãi nơi công cộng, lạm dụng đồ nhựa dùng một lần vì tiện lợi, thờ ơ trước lời kêu gọi bảo vệ môi trường. Trái Đất chỉ có một — và tương lai của nó nằm trong tay thế hệ trẻ hôm nay. Hãy bắt đầu từ những việc nhỏ nhất ngay từ hôm nay, để mỗi hành động của chúng ta đều góp phần làm cho hành tinh xanh hơn.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về vấn đề ô nhiễm môi trường do rác thải nhựa.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — rác thải nhựa là thách thức toàn cầu.\nII. Thân bài:\n1. Thực trạng (dẫn số liệu): 300 triệu tấn/năm; 8 triệu tấn ra biển; thời gian phân hủy hàng trăm năm; Việt Nam thải nhiều.\n2. Nguyên nhân: tiện lợi, giá rẻ; ý thức kém; thu gom, tái chế thấp.\n3. Hậu quả: ô nhiễm đất, nước, không khí; hạt vi nhựa đe dọa sức khỏe; ảnh hưởng sinh vật biển; tốn kém xử lí.\n4. Giải pháp:\n   a. Cá nhân: giảm thiểu, tái sử dụng, phân loại.\n   b. Doanh nghiệp: sản xuất thân thiện môi trường.\n   c. Nhà nước: cấm nhựa dùng một lần, quản lí chặt chẽ.\n5. Phê phán thói vô ý thức.\nIII. Kết bài: khẳng định; kêu gọi hành động.\n\nĐOẠN MẪU (mở bài):\nNhựa từng được coi là phát minh vĩ đại phục vụ đời sống con người, nhưng hôm nay, rác thải nhựa đang trở thành một trong những thách thức môi trường nghiêm trọng nhất của nhân loại. Mỗi năm khoảng 300 triệu tấn rác nhựa bị thải ra, 8 triệu tấn đổ xuống đại dương; một chiếc túi ni lông cần 500 năm mới phân hủy. Những con số giật mình ấy cho thấy vấn đề đã ở mức báo động và đòi hỏi hành động quyết liệt của toàn xã hội.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIẤC NGỦ VÀ SỨC KHỎE HỌC SINH\n\nGiấc ngủ có vai trò vô cùng quan trọng đối với sức khỏe, nhất là với lứa tuổi học sinh đang phát triển. Trong khi ngủ, cơ thể được nghỉ ngơi, não bộ sắp xếp lại thông tin, củng cố trí nhớ — vì vậy, ngủ đủ giấc giúp học sinh học tập hiệu quả hơn.\n\nTheo khuyến cáo của các chuyên gia, học sinh trung học cần ngủ từ 8 đến 10 giờ mỗi đêm. Thế nhưng, thực tế đáng lo ngại: nhiều khảo sát cho thấy phần lớn học sinh hiện nay chỉ ngủ khoảng 6 giờ mỗi đêm, thậm chí ít hơn vào mùa thi. Nguyên nhân chính là áp lực học tập và thói quen sử dụng điện thoại đến khuya.\n\nThiếu ngủ gây ra nhiều hậu quả nghiêm trọng. Trước mắt, học sinh thiếu ngủ thường mệt mỏi, khó tập trung, giảm khả năng ghi nhớ — học nhiều mà hiệu quả thấp. Về lâu dài, thiếu ngủ kinh niên làm suy giảm hệ miễn dịch, tăng nguy cơ béo phì, trầm cảm và các bệnh tim mạch. Có thể nói, thức khuya học bài là con dao hai lưỡi: tưởng là chăm chỉ nhưng thực chất đang bào mòn sức khỏe.\n\nĐể có giấc ngủ tốt, học sinh cần: sắp xếp thời gian học tập hợp lí, tránh học dồn vào ban đêm; hạn chế dùng điện thoại ít nhất 30 phút trước khi ngủ; tạo không gian ngủ yên tĩnh, thoáng mát; duy trì giờ đi ngủ đều đặn.\n\nSức khỏe là vốn quý nhất. Đừng đánh đổi giấc ngủ lấy vài giờ học thêm kém hiệu quả. Ngủ đủ giấc chính là cách học tập thông minh nhất.\n\nCâu 1. Theo khuyến cáo, học sinh trung học cần ngủ bao nhiêu giờ mỗi đêm?", "options": ["A. 5–6 giờ", "B. Từ 8 đến 10 giờ", "C. 12 giờ", "D. 4 giờ"], "answer": "B", "explain": "Văn bản cung cấp: theo khuyến cáo của chuyên gia, học sinh trung học cần ngủ từ 8 đến 10 giờ mỗi đêm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIẤC NGỦ VÀ SỨC KHỎE HỌC SINH\n\nGiấc ngủ có vai trò vô cùng quan trọng đối với sức khỏe, nhất là với lứa tuổi học sinh đang phát triển. Trong khi ngủ, cơ thể được nghỉ ngơi, não bộ sắp xếp lại thông tin, củng cố trí nhớ — vì vậy, ngủ đủ giấc giúp học sinh học tập hiệu quả hơn.\n\nTheo khuyến cáo của các chuyên gia, học sinh trung học cần ngủ từ 8 đến 10 giờ mỗi đêm. Thế nhưng, thực tế đáng lo ngại: nhiều khảo sát cho thấy phần lớn học sinh hiện nay chỉ ngủ khoảng 6 giờ mỗi đêm, thậm chí ít hơn vào mùa thi. Nguyên nhân chính là áp lực học tập và thói quen sử dụng điện thoại đến khuya.\n\nThiếu ngủ gây ra nhiều hậu quả nghiêm trọng. Trước mắt, học sinh thiếu ngủ thường mệt mỏi, khó tập trung, giảm khả năng ghi nhớ — học nhiều mà hiệu quả thấp. Về lâu dài, thiếu ngủ kinh niên làm suy giảm hệ miễn dịch, tăng nguy cơ béo phì, trầm cảm và các bệnh tim mạch. Có thể nói, thức khuya học bài là con dao hai lưỡi: tưởng là chăm chỉ nhưng thực chất đang bào mòn sức khỏe.\n\nĐể có giấc ngủ tốt, học sinh cần: sắp xếp thời gian học tập hợp lí, tránh học dồn vào ban đêm; hạn chế dùng điện thoại ít nhất 30 phút trước khi ngủ; tạo không gian ngủ yên tĩnh, thoáng mát; duy trì giờ đi ngủ đều đặn.\n\nSức khỏe là vốn quý nhất. Đừng đánh đổi giấc ngủ lấy vài giờ học thêm kém hiệu quả. Ngủ đủ giấc chính là cách học tập thông minh nhất.\n\nCâu 2. Thực tế, phần lớn học sinh hiện nay ngủ bao nhiêu?", "options": ["A. Đủ 8–10 giờ", "B. Chỉ khoảng 6 giờ mỗi đêm, thậm chí ít hơn vào mùa thi", "C. 12 giờ", "D. Không ngủ"], "answer": "B", "explain": "Số liệu khảo sát: phần lớn học sinh chỉ ngủ khoảng 6 giờ mỗi đêm — thấp hơn nhiều so với khuyến cáo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIẤC NGỦ VÀ SỨC KHỎE HỌC SINH\n\nGiấc ngủ có vai trò vô cùng quan trọng đối với sức khỏe, nhất là với lứa tuổi học sinh đang phát triển. Trong khi ngủ, cơ thể được nghỉ ngơi, não bộ sắp xếp lại thông tin, củng cố trí nhớ — vì vậy, ngủ đủ giấc giúp học sinh học tập hiệu quả hơn.\n\nTheo khuyến cáo của các chuyên gia, học sinh trung học cần ngủ từ 8 đến 10 giờ mỗi đêm. Thế nhưng, thực tế đáng lo ngại: nhiều khảo sát cho thấy phần lớn học sinh hiện nay chỉ ngủ khoảng 6 giờ mỗi đêm, thậm chí ít hơn vào mùa thi. Nguyên nhân chính là áp lực học tập và thói quen sử dụng điện thoại đến khuya.\n\nThiếu ngủ gây ra nhiều hậu quả nghiêm trọng. Trước mắt, học sinh thiếu ngủ thường mệt mỏi, khó tập trung, giảm khả năng ghi nhớ — học nhiều mà hiệu quả thấp. Về lâu dài, thiếu ngủ kinh niên làm suy giảm hệ miễn dịch, tăng nguy cơ béo phì, trầm cảm và các bệnh tim mạch. Có thể nói, thức khuya học bài là con dao hai lưỡi: tưởng là chăm chỉ nhưng thực chất đang bào mòn sức khỏe.\n\nĐể có giấc ngủ tốt, học sinh cần: sắp xếp thời gian học tập hợp lí, tránh học dồn vào ban đêm; hạn chế dùng điện thoại ít nhất 30 phút trước khi ngủ; tạo không gian ngủ yên tĩnh, thoáng mát; duy trì giờ đi ngủ đều đặn.\n\nSức khỏe là vốn quý nhất. Đừng đánh đổi giấc ngủ lấy vài giờ học thêm kém hiệu quả. Ngủ đủ giấc chính là cách học tập thông minh nhất.\n\nCâu 3. Vì sao thức khuya học bài được ví như con dao hai lưỡi?", "options": ["A. Vì dao sắc", "B. Vì tưởng là chăm chỉ nhưng thực chất gây mệt mỏi, giảm tập trung, giảm trí nhớ — học nhiều mà hiệu quả thấp, lại hại sức khỏe", "C. Vì tốn điện", "D. Vì cha mẹ mắng"], "answer": "B", "explain": "Văn bản phân tích: thức khuya tưởng chăm chỉ nhưng gây mệt mỏi, khó tập trung, giảm ghi nhớ về trước mắt và suy giảm miễn dịch, tăng bệnh tật về lâu dài — lợi ít hại nhiều.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIẤC NGỦ VÀ SỨC KHỎE HỌC SINH\n\nGiấc ngủ có vai trò vô cùng quan trọng đối với sức khỏe, nhất là với lứa tuổi học sinh đang phát triển. Trong khi ngủ, cơ thể được nghỉ ngơi, não bộ sắp xếp lại thông tin, củng cố trí nhớ — vì vậy, ngủ đủ giấc giúp học sinh học tập hiệu quả hơn.\n\nTheo khuyến cáo của các chuyên gia, học sinh trung học cần ngủ từ 8 đến 10 giờ mỗi đêm. Thế nhưng, thực tế đáng lo ngại: nhiều khảo sát cho thấy phần lớn học sinh hiện nay chỉ ngủ khoảng 6 giờ mỗi đêm, thậm chí ít hơn vào mùa thi. Nguyên nhân chính là áp lực học tập và thói quen sử dụng điện thoại đến khuya.\n\nThiếu ngủ gây ra nhiều hậu quả nghiêm trọng. Trước mắt, học sinh thiếu ngủ thường mệt mỏi, khó tập trung, giảm khả năng ghi nhớ — học nhiều mà hiệu quả thấp. Về lâu dài, thiếu ngủ kinh niên làm suy giảm hệ miễn dịch, tăng nguy cơ béo phì, trầm cảm và các bệnh tim mạch. Có thể nói, thức khuya học bài là con dao hai lưỡi: tưởng là chăm chỉ nhưng thực chất đang bào mòn sức khỏe.\n\nĐể có giấc ngủ tốt, học sinh cần: sắp xếp thời gian học tập hợp lí, tránh học dồn vào ban đêm; hạn chế dùng điện thoại ít nhất 30 phút trước khi ngủ; tạo không gian ngủ yên tĩnh, thoáng mát; duy trì giờ đi ngủ đều đặn.\n\nSức khỏe là vốn quý nhất. Đừng đánh đổi giấc ngủ lấy vài giờ học thêm kém hiệu quả. Ngủ đủ giấc chính là cách học tập thông minh nhất.\n\nCâu 4. Những biện pháp nào giúp học sinh có giấc ngủ tốt?", "options": ["A. Uống cà phê trước khi ngủ", "B. Sắp xếp thời gian hợp lí, hạn chế điện thoại 30 phút trước khi ngủ, không gian yên tĩnh, giờ giấc đều đặn", "C. Học đến 2 giờ sáng", "D. Chơi game trước khi ngủ"], "answer": "B", "explain": "Văn bản đề xuất cụ thể: học tập hợp lí, tránh học dồn ban đêm, hạn chế điện thoại, không gian tốt, giờ giấc đều đặn — những biện pháp khoa học.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIẤC NGỦ VÀ SỨC KHỎE HỌC SINH\n\nGiấc ngủ có vai trò vô cùng quan trọng đối với sức khỏe, nhất là với lứa tuổi học sinh đang phát triển. Trong khi ngủ, cơ thể được nghỉ ngơi, não bộ sắp xếp lại thông tin, củng cố trí nhớ — vì vậy, ngủ đủ giấc giúp học sinh học tập hiệu quả hơn.\n\nTheo khuyến cáo của các chuyên gia, học sinh trung học cần ngủ từ 8 đến 10 giờ mỗi đêm. Thế nhưng, thực tế đáng lo ngại: nhiều khảo sát cho thấy phần lớn học sinh hiện nay chỉ ngủ khoảng 6 giờ mỗi đêm, thậm chí ít hơn vào mùa thi. Nguyên nhân chính là áp lực học tập và thói quen sử dụng điện thoại đến khuya.\n\nThiếu ngủ gây ra nhiều hậu quả nghiêm trọng. Trước mắt, học sinh thiếu ngủ thường mệt mỏi, khó tập trung, giảm khả năng ghi nhớ — học nhiều mà hiệu quả thấp. Về lâu dài, thiếu ngủ kinh niên làm suy giảm hệ miễn dịch, tăng nguy cơ béo phì, trầm cảm và các bệnh tim mạch. Có thể nói, thức khuya học bài là con dao hai lưỡi: tưởng là chăm chỉ nhưng thực chất đang bào mòn sức khỏe.\n\nĐể có giấc ngủ tốt, học sinh cần: sắp xếp thời gian học tập hợp lí, tránh học dồn vào ban đêm; hạn chế dùng điện thoại ít nhất 30 phút trước khi ngủ; tạo không gian ngủ yên tĩnh, thoáng mát; duy trì giờ đi ngủ đều đặn.\n\nSức khỏe là vốn quý nhất. Đừng đánh đổi giấc ngủ lấy vài giờ học thêm kém hiệu quả. Ngủ đủ giấc chính là cách học tập thông minh nhất.\n\nCâu 5. Qua văn bản, em sẽ điều chỉnh thói quen ngủ của mình như thế nào? (Trả lời ngắn gọn)", "answer": "Ngủ đủ 8–10 giờ, không thức khuya, hạn chế điện thoại trước khi ngủ", "explain": "Chấp nhận các cách cụ thể: đi ngủ đúng giờ; sắp xếp bài vở hợp lí; không học dồn ban đêm...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của giấc ngủ đối với sức khỏe.", "explain": "DÀN Ý:\n1. Mở đoạn: giấc ngủ vô cùng quan trọng với sức khỏe.\n2. Thân đoạn: (a) Vai trò: cơ thể nghỉ ngơi, não củng cố trí nhớ; cần 8–10 giờ với học sinh; (b) Hậu quả thiếu ngủ: mệt mỏi, giảm tập trung, suy miễn dịch, tăng bệnh tật; (c) Phê phán thói thức khuya, nghiện điện thoại.\n3. Kết đoạn: hãy ngủ đủ giấc.\n\nBÀI MẪU:\nGiấc ngủ có vai trò vô cùng quan trọng đối với sức khỏe con người, nhất là với lứa tuổi học sinh đang phát triển. Trong khi ngủ, cơ thể được nghỉ ngơi, phục hồi năng lượng; não bộ sắp xếp lại thông tin, củng cố trí nhớ — vì vậy ngủ đủ giấc giúp ta học tập và làm việc hiệu quả hơn. Theo khuyến cáo, học sinh trung học cần ngủ từ 8 đến 10 giờ mỗi đêm, nhưng thực tế nhiều bạn chỉ ngủ khoảng 6 giờ, thậm chí ít hơn. Thiếu ngủ gây ra nhiều hậu quả: trước mắt là mệt mỏi, khó tập trung, giảm khả năng ghi nhớ — học nhiều mà hiệu quả thấp; về lâu dài là suy giảm hệ miễn dịch, tăng nguy cơ béo phì, trầm cảm và bệnh tim mạch. Nguyên nhân chính là áp lực học tập và thói quen dùng điện thoại đến khuya. Để có giấc ngủ tốt, cần sắp xếp thời gian hợp lí, hạn chế điện thoại trước khi ngủ, duy trì giờ giấc đều đặn. Sức khỏe là vốn quý nhất — đừng đánh đổi giấc ngủ lấy vài giờ học thêm kém hiệu quả. Ngủ đủ giấc chính là cách học tập thông minh nhất mà mỗi học sinh cần thực hiện.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về vấn đề sức khỏe học đường hiện nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — sức khỏe học sinh đang đáng báo động.\nII. Thân bài:\n1. Thực trạng:\n   a. Thiếu ngủ (chỉ khoảng 6 giờ so với khuyến cáo 8–10 giờ).\n   b. Ít vận động, ngồi nhiều.\n   c. Cận thị, cong vẹo cột sống gia tăng.\n   d. Áp lực tâm lí, trầm cảm.\n2. Nguyên nhân: áp lực học tập; nghiện thiết bị số; thiếu sân chơi; bữa ăn chưa khoa học.\n3. Hậu quả: ảnh hưởng học tập, sức khỏe lâu dài.\n4. Giải pháp:\n   a. Bản thân: ngủ đủ, vận động, ăn uống khoa học, quản lí thời gian.\n   b. Gia đình: quan tâm, không gây áp lực quá mức.\n   c. Nhà trường: giảm tải, tăng hoạt động thể chất, tư vấn tâm lí.\nIII. Kết bài: khẳng định sức khỏe là vốn quý; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nCó sức khỏe là có tất cả — chân lí giản dị ấy đang bị không ít học sinh hôm nay xem nhẹ. Thiếu ngủ triền miên, ít vận động, cận thị gia tăng, áp lực tâm lí đè nặng... thực trạng sức khỏe học đường đang ở mức đáng báo động. Trong khi các em là tương lai của đất nước, là những chủ nhân cần có cả đức, cả tài lẫn sức khỏe để gánh vác sự nghiệp. Nhìn nhận đúng thực trạng và tìm giải pháp là vấn đề cấp thiết đặt ra với gia đình, nhà trường và toàn xã hội.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNĂNG LƯỢNG MẶT TRỜI: NGUỒN NĂNG LƯỢNG CỦA TƯƠNG LAI\n\nNăng lượng mặt trời là nguồn năng lượng sạch, vô tận đang được cả thế giới quan tâm. Mặt Trời mỗi giờ chiếu xuống Trái Đất lượng năng lượng tương đương với nhu cầu điện của toàn nhân loại trong cả một năm — tiềm năng khổng lồ ấy đang dần được khai thác.\n\nViệt Nam có lợi thế lớn về năng lượng mặt trời. Với vị trí gần xích đạo, nước ta nhận được lượng bức xạ mặt trời dồi dào: trung bình mỗi năm có khoảng 2.000 giờ nắng, tổng bức xạ đạt từ 4 đến 5 kWh trên mỗi mét vuông mỗi ngày ở hầu hết các vùng. Đặc biệt, các tỉnh Nam Trung Bộ và Tây Nguyên có số giờ nắng cao nhất, rất phù hợp phát triển điện mặt trời.\n\nNhững năm gần đây, điện mặt trời ở Việt Nam phát triển bùng nổ. Công suất điện mặt trời đã tăng từ con số gần như bằng 0 lên hàng nghìn MW chỉ trong vài năm, đóng góp đáng kể vào nguồn cung điện quốc gia. Nhiều hộ gia đình lắp đặt điện mặt trời mái nhà, vừa tiết kiệm chi phí, vừa góp phần bảo vệ môi trường.\n\nSo với nhiệt điện than, điện mặt trời có ưu điểm vượt trội: không phát thải khí nhà kính, không gây ô nhiễm không khí, chi phí vận hành thấp. Tuy nhiên, nó cũng có hạn chế: phụ thuộc vào thời tiết, cần diện tích lớn, chi phí đầu tư ban đầu cao và công nghệ lưu trữ điện còn hạn chế.\n\nTrong bối cảnh biến đổi khí hậu và nhu cầu năng lượng ngày càng tăng, phát triển năng lượng mặt trời là hướng đi đúng đắn. Mỗi người dân cũng có thể góp phần bằng cách ủng hộ và sử dụng năng lượng sạch trong đời sống hằng ngày.\n\nCâu 1. Việt Nam có lợi thế gì về năng lượng mặt trời?", "options": ["A. Không có lợi thế", "B. Vị trí gần xích đạo, khoảng 2.000 giờ nắng mỗi năm, bức xạ từ 4 đến 5 kWh/m2/ngày", "C. Chỉ có nắng mùa hè", "D. Nắng ít"], "answer": "B", "explain": "Văn bản cung cấp số liệu: khoảng 2.000 giờ nắng/năm, bức xạ 4–5 kWh/m2/ngày — lợi thế nhờ vị trí gần xích đạo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNĂNG LƯỢNG MẶT TRỜI: NGUỒN NĂNG LƯỢNG CỦA TƯƠNG LAI\n\nNăng lượng mặt trời là nguồn năng lượng sạch, vô tận đang được cả thế giới quan tâm. Mặt Trời mỗi giờ chiếu xuống Trái Đất lượng năng lượng tương đương với nhu cầu điện của toàn nhân loại trong cả một năm — tiềm năng khổng lồ ấy đang dần được khai thác.\n\nViệt Nam có lợi thế lớn về năng lượng mặt trời. Với vị trí gần xích đạo, nước ta nhận được lượng bức xạ mặt trời dồi dào: trung bình mỗi năm có khoảng 2.000 giờ nắng, tổng bức xạ đạt từ 4 đến 5 kWh trên mỗi mét vuông mỗi ngày ở hầu hết các vùng. Đặc biệt, các tỉnh Nam Trung Bộ và Tây Nguyên có số giờ nắng cao nhất, rất phù hợp phát triển điện mặt trời.\n\nNhững năm gần đây, điện mặt trời ở Việt Nam phát triển bùng nổ. Công suất điện mặt trời đã tăng từ con số gần như bằng 0 lên hàng nghìn MW chỉ trong vài năm, đóng góp đáng kể vào nguồn cung điện quốc gia. Nhiều hộ gia đình lắp đặt điện mặt trời mái nhà, vừa tiết kiệm chi phí, vừa góp phần bảo vệ môi trường.\n\nSo với nhiệt điện than, điện mặt trời có ưu điểm vượt trội: không phát thải khí nhà kính, không gây ô nhiễm không khí, chi phí vận hành thấp. Tuy nhiên, nó cũng có hạn chế: phụ thuộc vào thời tiết, cần diện tích lớn, chi phí đầu tư ban đầu cao và công nghệ lưu trữ điện còn hạn chế.\n\nTrong bối cảnh biến đổi khí hậu và nhu cầu năng lượng ngày càng tăng, phát triển năng lượng mặt trời là hướng đi đúng đắn. Mỗi người dân cũng có thể góp phần bằng cách ủng hộ và sử dụng năng lượng sạch trong đời sống hằng ngày.\n\nCâu 2. Các vùng nào của Việt Nam phù hợp nhất để phát triển điện mặt trời?", "options": ["A. Đồng bằng sông Hồng", "B. Nam Trung Bộ và Tây Nguyên — có số giờ nắng cao nhất", "C. Tây Bắc", "D. Đông Bắc"], "answer": "B", "explain": "Văn bản nêu cụ thể: Nam Trung Bộ và Tây Nguyên có số giờ nắng cao nhất, rất phù hợp phát triển điện mặt trời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNĂNG LƯỢNG MẶT TRỜI: NGUỒN NĂNG LƯỢNG CỦA TƯƠNG LAI\n\nNăng lượng mặt trời là nguồn năng lượng sạch, vô tận đang được cả thế giới quan tâm. Mặt Trời mỗi giờ chiếu xuống Trái Đất lượng năng lượng tương đương với nhu cầu điện của toàn nhân loại trong cả một năm — tiềm năng khổng lồ ấy đang dần được khai thác.\n\nViệt Nam có lợi thế lớn về năng lượng mặt trời. Với vị trí gần xích đạo, nước ta nhận được lượng bức xạ mặt trời dồi dào: tru
