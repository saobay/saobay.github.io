g trăm nghìn vụ lừa đảo trực tuyến được ghi nhận, gây thiệt hại hàng nghìn tỉ đồng. Nạn nhân có thể là bất kì ai, từ người già đến học sinh.\n\nCác hình thức lừa đảo phổ biến hiện nay rất tinh vi: giả danh công an, ngân hàng gọi điện đe dọa; gửi đường link giả mạo để đánh cắp tài khoản; rao bán hàng giá rẻ rồi chiếm đoạt tiền; dụ dỗ đầu tư lợi nhuận cao... Kẻ xấu thường đánh vào lòng tham, nỗi sợ hãi hoặc sự thiếu hiểu biết của nạn nhân.\n\nĐể tự bảo vệ, mỗi người cần trang bị những kĩ năng cơ bản: không cung cấp thông tin cá nhân, mã OTP cho người lạ; không bấm vào đường link đáng ngờ; kiểm tra kĩ thông tin trước khi chuyển tiền; đặt mật khẩu mạnh và bật xác thực hai lớp; cập nhật phần mềm thường xuyên.\n\nĐặc biệt, học sinh cần cẩn trọng khi sử dụng mạng xã hội: không chia sẻ địa chỉ nhà, lịch trình cá nhân; không kết bạn với người lạ một cách dễ dãi; báo ngay cho cha mẹ, thầy cô khi gặp tình huống bất thường.\n\nAn toàn thông tin không phải là chuyện của riêng ai. Trong thời đại số, biết tự bảo vệ mình trên mạng cũng quan trọng như biết bơi khi sống gần sông nước. Hãy là người dùng thông minh, tỉnh táo trước mọi cám dỗ và đe dọa trên không gian mạng.\n\nCâu 4. Những kĩ năng tự bảo vệ nào được đề xuất?", "options": ["A. Không dùng internet", "B. Không cung cấp thông tin cá nhân/mã OTP cho người lạ; không bấm link đáng ngờ; kiểm tra kĩ trước khi chuyển tiền; mật khẩu mạnh; xác thực hai lớp", "C. Chia sẻ mọi thứ", "D. Tin mọi cuộc gọi"], "answer": "B", "explain": "Văn bản đưa ra các biện pháp cụ thể, thiết thực — đúng chức năng hướng dẫn hành động của văn bản thông tin.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nAN TOÀN THÔNG TIN TRÊN MẠNG: KĨ NĂNG SỐNG CÒN THỜI ĐẠI SỐ\n\nInternet đã trở thành một phần không thể thiếu của cuộc sống, nhưng cùng với tiện ích là những nguy cơ về an toàn thông tin. Theo thống kê, mỗi năm có hàng trăm nghìn vụ lừa đảo trực tuyến được ghi nhận, gây thiệ MẪU:\nTrong thời đại số, ý thức bảo vệ thông tin cá nhân trên mạng là kĩ năng sống còn mà mỗi người, nhất là học sinh, cần trang bị. Thực trạng đáng báo động: mỗi năm có hàng trăm nghìn vụ lừa đảo trực tuyến với thiệt hại hàng nghìn tỉ đồng; thủ đoạn ngày càng tinh vi — giả danh công an, ngân hàng; gửi link giả mạo đánh cắp tài khoản; dụ dỗ đầu tư lợi nhuận cao. Kẻ xấu thường đánh vào lòng tham, nỗi sợ hãi hoặc sự thiếu hiểu biết của nạn nhân. Với học sinh, nguy cơ còn đến từ thói quen chia sẻ địa chỉ nhà, lịch trình cá nhân lên mạng xã hội hay kết bạn với người lạ một cách dễ dãi. Để tự bảo vệ, cần nhớ những nguyên tắc cơ bản: không bao giờ cung cấp thông tin cá nhân, mã OTP cho người lạ; không bấm vào đường link đáng ngờ; kiểm tra kĩ trước khi chuyển tiền; đặt mật khẩu mạnh và bật xác thực hai lớp. Đáng phê phán là thái độ chủ quan, nhẹ dạ: tin ngay cuộc gọi lạ, ham lợi nhuận cao bất thường. Hãy nhớ: an toàn thông tin không phải chuyện của riêng ai — biết tự bảo vệ mình trên mạng cũng quan trọng như biết bơi khi sống gần sông nước. Hãy là người dùng thông minh và tỉnh táo.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về mặt trái của mạng xã hội đối với giới trẻ.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — mạng xã hội: tiện ích và mặt trái.\nII. Thân bài:\n1. Mặt trái:\n   a. Nghiện mạng xã hội, lãng phí thời gian.\n   b. Lừa đảo, đánh cắp thông tin (số liệu).\n   c. Tin giả, bạo lực mạng.\n   d. So sánh, tự ti, trầm cảm.\n   e. Ảnh hưởng học tập, sức khỏe.\n2. Nguyên nhân: thiếu kĩ năng số; quản lí lỏng lẻo; tâm lí tò mò, thích thể hiện.\n3. Giải pháp:\n   a. Bản thân: dùng có chừng mực, tỉnh táo, bảo vệ thông tin.\n   b. Gia đình: quan tâm, hướng dẫn.\n   c. Nhà trường: giáo dục kĩ năng số.\n   d. Pháp luật: xử lí nghiêm vi phạm.\nIII. Kết bài: khẳng định; nhắn nhủ dùng mạng thông minh.\n\nĐOẠN MẪU (mở bài):\nMạng xã hội đã trở thành một phần không thể thiếu trong đời sống giới trẻ, mang lại nhiều tiện ích: kết nối bạn bè, học tập, giải trí. Thế nhưng, đằng sau những tiện ích ấy là không ít mặt trái đáng lo ngại: nghiện mạng xã hội, lừa đảo trực tuyến với thiệt hại hàng nghìn tỉ đồng mỗi năm, tin giả tràn lan, bạo lực mạng... Những mặt trái này đang âm thầm bào mòn thời gian, sức khỏe và nhân cách của không ít bạn trẻ. Nhìn nhận đúng và tìm cách khắc phục là việc làm cấp thiết.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HÓA GIAO THÔNG: THƯỚC ĐO VĂN MINH\n\nMỗi năm, tai nạn giao thông ở Việt Nam cướp đi sinh mạng của hàng nghìn người và làm bị thương hàng chục nghìn người khác. Đằng sau những con số đau lòng ấy, nguyên nhân hàng đầu là ý thức tham gia giao thông của một bộ phận người dân còn kém: vượt đèn đỏ, đi sai làn, phóng nhanh vượt ẩu, lái xe sau khi uống rượu bia.\n\nVăn hóa giao thông là cách ứng xử có văn hóa khi tham gia giao thông: chấp hành luật lệ, nhường nhịn nhau, tôn trọng người đi bộ và các phương tiện khác. Một xã hội có văn hóa giao thông là xã hội mà mỗi người đều ý thức rằng an toàn của mình gắn liền với an toàn của người khác.\n\nThực tế cho thấy nhiều hành vi thiếu văn hóa vẫn diễn ra hằng ngày: chen lấn, bấm còi inh ỏi, dừng đỗ bừa bãi, không đội mũ bảo hiểm, sử dụng điện thoại khi lái xe. Đáng lo ngại, không ít bạn trẻ coi việc lạng lách, đánh võng là thể hiện cá tính — một quan niệm sai lầm và nguy hiểm.\n\nĐể xây dựng văn hóa giao thông, cần nhiều giải pháp: tăng cường tuyên truyền, giáo dục từ trong nhà trường; xử phạt nghiêm các vi phạm; hoàn thiện hạ tầng giao thông; nêu gương người tốt việc tốt. Đặc biệt, mỗi người cần tự giác: đội mũ bảo hiểm đạt chuẩn, không vượt đèn đỏ, không lái xe khi đã uống rượu bia, nhường đường cho người đi bộ.\n\nAn toàn giao thông là hạnh phúc của mọi nhà. Hãy nhớ: nhanh một phút, chậm cả đời. Mỗi người hãy là một tấm gương về văn hóa giao thông.\n\nCâu 1. Mỗi năm tai nạn giao thông ở Việt Nam gây hậu quả gì?", "options": ["A. Không đáng kể", "B. Cướp đi sinh mạng của hàng nghìn người, làm bị thương hàng chục nghìn người", "C. Chỉ hư hỏng xe", "D. Không có tai nạn"], "answer": "B", "explain": "Văn bản cung cấp số liệu: hàng nghìn người chết, hàng chục nghìn người bị thương mỗi năm — hậu quả nghiêm trọng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HÓA GIAO THÔNG: THƯỚC ĐO VĂN MINH\n\nMỗi năm, tai nạn giao thông ở Việt Nam cướp đi sinh mạng của hàng nghìn người và làm bị thương hàng chục nghìn người khác. Đằng sau những con số đau lòng ấy, nguyên nhân hàng đầu là ý thức tham gia giao thông của một bộ phận người dân còn kém: vượt đèn đỏ, đi sai làn, phóng nhanh vượt ẩu, lái xe sau khi uống rượu bia.\n\nVăn hóa giao thông là cách ứng xử có văn hóa khi tham gia giao thông: chấp hành luật lệ, nhường nhịn nhau, tôn trọng người đi bộ và các phương tiện khác. Một xã hội có văn hóa giao thông là xã hội mà mỗi người đều ý thức rằng an toàn của mình gắn liền với an toàn của người khác.\n\nThực tế cho thấy nhiều hành vi thiếu văn hóa vẫn diễn ra hằng ngày: chen lấn, bấm còi inh ỏi, dừng đỗ bừa bãi, không đội mũ bảo hiểm, sử dụng điện thoại khi lái xe. Đáng lo ngại, không ít bạn trẻ coi việc lạng lách, đánh võng là thể hiện cá tính — một quan niệm sai lầm và nguy hiểm.\n\nĐể xây dựng văn hóa giao thông, cần nhiều giải pháp: tăng cường tuyên truyền, giáo dục từ trong nhà trường; xử phạt nghiêm các vi phạm; hoàn thiện hạ tầng giao thông; nêu gương người tốt việc tốt. Đặc biệt, mỗi người cần tự giác: đội mũ bảo hiểm đạt chuẩn, không vượt đèn đỏ, không lái xe khi đã uống rượu bia, nhường đường cho người đi bộ.\n\nAn toàn giao thông là hạnh phúc của mọi nhà. Hãy nhớ: nhanh một phút, chậm cả đời. Mỗi người hãy là một tấm gương về văn hóa giao thông.\n\nCâu 2. Nguyên nhân hàng đầu của tai nạn giao thông là gì?", "options": ["A. Đường xấu", "B. Ý thức tham gia giao thông của một bộ phận người dân còn kém: vượt đèn đỏ, đi sai làn, phóng nhanh vượt ẩu, lái xe sau khi uống rượu bia", "C. Xe quá nhiều", "D. Thời tiết"], "answer": "B", "explain": "Văn bản xác định nguyên nhân hàng đầu là ý thức người tham gia giao thông — liệt kê các hành vi vi phạm cụ thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HÓA GIAO THÔNG: THƯỚC ĐO VĂN MINH\n\nMỗi năm, tai nạn giao thông ở Việt Nam cướp đi sinh mạng của hàng nghìn người và làm bị thương hàng chục nghìn người khác. Đằng sau những con số đau lòng ấy, nguyên nhân hàng đầu là ý thức tham gia giao thông của một bộ phận người dân còn kém: vượt đèn đỏ, đi sai làn, phóng nhanh vượt ẩu, lái xe sau khi uống rượu bia.\n\nVăn hóa giao thông là cách ứng xử có văn hóa khi tham gia giao thông: chấp hành luật lệ, nhường nhịn nhau, tôn trọng người đi bộ và các phương tiện khác. Một xã hội có văn hóa giao thông là xã hội mà mỗi người đều ý thức rằng an toàn của mình gắn liền với an toàn của người khác.\n\nThực tế cho thấy nhiều hành vi thiếu văn hóa vẫn diễn ra hằng ngày: chen lấn, bấm còi inh ỏi, dừng đỗ bừa bãi, không đội mũ bảo hiểm, sử dụng điện thoại khi lái xe. Đáng lo ngại, không ít bạn trẻ coi việc lạng lách, đánh võng là thể hiện cá tính — một quan niệm sai lầm và nguy hiểm.\n\nĐể xây dựng văn hóa giao thông, cần nhiều giải pháp: tăng cường tuyên truyền, giáo dục từ trong nhà trường; xử phạt nghiêm các vi phạm; hoàn thiện hạ tầng giao thông; nêu gương người tốt việc tốt. Đặc biệt, mỗi người cần tự giác: đội mũ bảo hiểm đạt chuẩn, không vượt đèn đỏ, không lái xe khi đã uống rượu bia, nhường đường cho người đi bộ.\n\nAn toàn giao thông là hạnh phúc của mọi nhà. Hãy nhớ: nhanh một phút, chậm cả đời. Mỗi người hãy là một tấm gương về văn hóa giao thông.\n\nCâu 3. Văn hóa giao thông được hiểu như thế nào?", "options": ["A. Chỉ là chấp hành luật", "B. Là cách ứng xử có văn hóa khi tham gia giao thông: chấp hành luật lệ, nhường nhịn nhau, tôn trọng người khác — an toàn của mình gắn với an toàn của người khác", "C. Là lái xe nhanh", "D. Là bấm còi nhiều"], "answer": "B", "explain": "Văn bản định nghĩa rõ: văn hóa giao thông là ứng xử có văn hóa — chấp hành luật, nhường nhịn, tôn trọng — với ý thức cộng đồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HÓA GIAO THÔNG: THƯỚC ĐO VĂN MINH\n\nMỗi năm, tai nạn giao thông ở Việt Nam cướp đi sinh mạng của hàng nghìn người và làm bị thương hàng chục nghìn người khác. Đằng sau những con số đau lòng ấy, nguyên nhân hàng đầu là ý thức tham gia giao thông của một bộ phận người dân còn kém: vượt đèn đỏ, đi sai làn, phóng nhanh vượt ẩu, lái xe sau khi uống rượu bia.\n\nVăn hóa giao thông là cách ứng xử có văn hóa khi tham gia giao thông: chấp hành luật lệ, nhường nhịn nhau, tôn trọng người đi bộ và các phương tiện khác. Một xã hội có văn hóa giao thông là xã hội mà mỗi người đều ý thức rằng an toàn của mình gắn liền với an toàn của người khác.\n\nThực tế cho thấy nhiều hành vi thiếu văn hóa vẫn diễn ra hằng ngày: chen lấn, bấm còi inh ỏi, dừng đỗ bừa bãi, không đội mũ bảo hiểm, sử dụng điện thoại khi lái xe. Đáng lo ngại, không ít bạn trẻ coi việc lạng lách, đánh võng là thể hiện cá tính — một quan niệm sai lầm và nguy hiểm.\n\nĐể xây dựng văn hóa giao thông, cần nhiều giải pháp: tăng cường tuyên truyền, giáo dục từ trong nhà trường; xử phạt nghiêm các vi phạm; hoàn thiện hạ tầng giao thông; nêu gương người tốt việc tốt. Đặc biệt, mỗi người cần tự giác: đội mũ bảo hiểm đạt chuẩn, không vượt đèn đỏ, không lái xe khi đã uống rượu bia, nhường đường cho người đi bộ.\n\nAn toàn giao thông là hạnh phúc của mọi nhà. Hãy nhớ: nhanh một phút, chậm cả đời. Mỗi người hãy là một tấm gương về văn hóa giao thông.\n\nCâu 4. Những hành vi thiếu văn hóa giao thông nào được nêu?", "options": ["A. Không có", "B. Chen lấn, bấm còi inh ỏi, dừng đỗ bừa bãi, không đội mũ bảo hiểm, dùng điện thoại khi lái xe, lạng lách đánh võng", "C. Đi đúng làn", "D. Nhường đường"], "answer": "B", "explain": "Văn bản liệt kê các hành vi thiếu văn hóa diễn ra hằng ngày — giúp người đọc tự nhận diện và tránh.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HÓA GIAO THÔNG: THƯỚC ĐO VĂN MINH\n\nMỗi năm, tai nạn giao thông ở Việt Nam cướp đi sinh mạng của hàng nghìn người và làm bị thương hàng chục nghìn người khác. Đằng sau những con số đau lòng ấy, nguyên nhân hàng đầu là ý thức tham gia giao thông của một bộ phận người dân còn kém: vượt đèn đỏ, đi sai làn, phóng nhanh vượt ẩu, lái xe sau khi uống rượu bia.\n\nVăn hóa giao thông là cách ứng xử có văn hóa khi tham gia giao thông: chấp hành luật lệ, nhường nhịn nhau, tôn trọng người đi bộ và các phương tiện khác. Một xã hội có văn hóa giao thông là xã hội mà mỗi người đều ý thức rằng an toàn của mình gắn liền với an toàn của người khác.\n\nThực tế cho thấy nhiều hành vi thiếu văn hóa vẫn diễn ra hằng ngày: chen lấn, bấm còi inh ỏi, dừng đỗ bừa bãi, không đội mũ bảo hiểm, sử dụng điện thoại khi lái xe. Đáng lo ngại, không ít bạn trẻ coi việc lạng lách, đánh võng là thể hiện cá tính — một quan niệm sai lầm và nguy hiểm.\n\nĐể xây dựng văn hóa giao thông, cần nhiều giải pháp: tăng cường tuyên truyền, giáo dục từ trong nhà trường; xử phạt nghiêm các vi phạm; hoàn thiện hạ tầng giao thông; nêu gương người tốt việc tốt. Đặc biệt, mỗi người cần tự giác: đội mũ bảo hiểm đạt chuẩn, không vượt đèn đỏ, không lái xe khi đã uống rượu bia, nhường đường cho người đi bộ.\n\nAn toàn giao thông là hạnh phúc của mọi nhà. Hãy nhớ: nhanh một phút, chậm cả đời. Mỗi người hãy là một tấm gương về văn hóa giao thông.\n\nCâu 5. Theo em, học sinh cần làm gì để góp phần xây dựng văn hóa giao thông? (Trả lời ngắn gọn)", "answer": "Chấp hành luật giao thông, đội mũ bảo hiểm, không lạng lách, nhắc nhở người khác", "explain": "Chấp nhận các việc làm cụ thể: đi đúng làn; không vượt đèn đỏ; không dùng điện thoại khi đi xe...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý thức chấp hành luật giao thông của học sinh hiện nay.", "explain": "DÀN Ý:\n1. Mở đoạn: tai nạn giao thông là vấn đề nhức nhối, học sinh cần gương mẫu chấp hành luật.\n2. Thân đoạn: (a) Thực trạng: hàng nghìn người chết/năm; nhiều học sinh vi phạm: không đội mũ, vượt đèn đỏ, lạng lách; (b) Nguyên nhân: ý thức kém, coi thường luật, thích thể hiện; (c) Hậu quả: nguy hiểm tính mạng; (d) Phê phán quan niệm lạng lách là cá tính.\n3. Kết đoạn: hãy là tấm gương văn hóa giao thông.\n\nBÀI MẪU:\nTai nạn giao thông đang là vấn đề nhức nhối của xã hội: mỗi năm cướp đi sinh mạng hàng nghìn người, làm bị thương hàng chục nghìn người — nguyên nhân hàng đầu là ý thức tham gia giao thông còn kém. Đáng lo ngại, một bộ phận học sinh hôm nay chưa gương mẫu chấp hành luật: không đội mũ bảo hiểm, vượt đèn đỏ, đi sai làn, thậm chí lạng lách, đánh võng. Có bạn còn coi việc phóng nhanh, lạng lách là thể hiện cá tính — một quan niệm sai lầm và nguy hiểm, bởi chỉ một phút bất cẩn có thể phải trả giá bằng cả tính mạng và tương lai. Nguyên nhân sâu xa là ý thức pháp luật còn kém, sự nuông chiều của gia đình và thiếu giáo dục thường xuyên. Để xây dựng văn hóa giao thông, mỗi học sinh cần tự giác: đội mũ bảo hiểm đạt chuẩn, chấp hành đèn tín hiệu, không dùng điện thoại khi điều khiển xe, nhường nhịn người khác. Hãy nhớ: nhanh một phút, chậm cả đời. Mỗi học sinh hãy là một tấm gương về văn hóa giao thông, góp phần làm cho đường phố an toàn hơn, xã hội văn minh hơn.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về vấn đề an toàn giao thông hiện nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — tai nạn giao thông: nỗi đau dai dẳng.\nII. Thân bài:\n1. Thực trạng (dẫn số liệu): hàng nghìn người chết, hàng chục nghìn người bị thương mỗi năm.\n2. Nguyên nhân:\n   a. Ý thức người tham gia giao thông kém (liệt kê hành vi).\n   b. Hạ tầng chưa đáp ứng; phương tiện tăng nhanh.\n   c. Xử phạt chưa đủ răn đe ở một số nơi.\n3. Hậu quả: mất mát sinh mạng; gánh nặng gia đình, xã hội; thiệt hại kinh tế.\n4. Giải pháp:\n   a. Mỗi người: tự giác chấp hành luật.\n   b. Tuyên truyền, giáo dục từ nhà trường.\n   c. Xử phạt nghiêm; hoàn thiện hạ tầng.\n5. Phê phán hành vi coi thường luật.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nMỗi năm, tai nạn giao thông cướp đi sinh mạng của hàng nghìn người và làm bị thương hàng chục nghìn người khác ở nước ta — những con số đau lòng không ngừng tăng lên. Đằng sau mỗi con số là một gia đình tan nát, một tương lai dang dở. Nguyên nhân hàng đầu được chỉ ra là ý thức tham gia giao thông của một bộ phận người dân còn kém. Đã đến lúc toàn xã hội phải hành động quyết liệt để đẩy lùi thảm họa này.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNƯỚC SẠCH: TÀI NGUYÊN QUÝ GIÁ CẦN ĐƯỢC BẢO VỆ\n\nNước là nguồn sống của mọi sinh vật trên Trái Đất. Cơ thể con người có đến khoảng 70% là nước; thiếu nước, con người chỉ có thể sống sót vài ngày. Thế nhưng, nghịch lí là trong khi nước bao phủ khoảng 71% bề mặt Trái Đất thì nước ngọt — loại nước con người có thể sử dụng — chỉ chiếm khoảng 2,5%, phần lớn lại đóng băng ở hai cực.\n\nTình trạng thiếu nước sạch đang diễn ra ở nhiều nơi trên thế giới. Theo ước tính của Liên hợp quốc, hiện có khoảng 2 tỉ người trên thế giới chưa được tiếp cận với nguồn nước uống an toàn. Nguyên nhân là do ô nhiễm nguồn nước, khai thác quá mức và biến đổi khí hậu gây hạn hán kéo dài.\n\nTại Việt Nam, nhiều vùng nông thôn, vùng sâu vùng xa vẫn thiếu nước sạch sinh hoạt. Ở đồng bằng sông Cửu Long, xâm nhập mặn ngày càng nghiêm trọng, có năm ảnh hưởng đến hàng trăm nghìn hộ dân. Trong khi đó, ở các thành phố lớn, nguồn nước ngầm đang bị khai thác quá mức, có nguy cơ cạn kiệt và ô nhiễm.\n\nĐể bảo vệ tài nguyên nước, cần nhiều giải pháp: sử dụng nước tiết kiệm, chống lãng phí; xử lí nước thải trước khi xả ra môi trường; bảo vệ rừng đầu nguồn — lá chắn giữ nước tự nhiên; đầu tư hệ thống cấp nước sạch cho vùng khó khăn.\n\nMỗi giọt nước đều quý giá. Tiết kiệm nước hôm nay chính là bảo vệ cuộc sống của chúng ta ngày mai. Hãy bắt đầu từ những việc đơn giản: khóa vòi khi không dùng, tái sử dụng nước hợp lí, không xả rác xuống nguồn nước.\n\nCâu 1. Nước ngọt chiếm bao nhiêu trong tổng lượng nước trên Trái Đất?", "options": ["A. Khoảng 71%", "B. Chỉ khoảng 2,5%, phần lớn lại đóng băng ở hai cực", "C. Khoảng 50%", "D. Khoảng 10%"], "answer": "B", "explain": "Văn bản cung cấp số liệu: nước bao phủ 71% bề mặt Trái Đất nhưng nước ngọt chỉ chiếm khoảng 2,5% — nghịch lí đáng suy ngẫm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNƯỚC SẠCH: TÀI NGUYÊN QUÝ GIÁ CẦN ĐƯỢC BẢO VỆ\n\nNước là nguồn sống của mọi sinh vật trên Trái Đất. Cơ thể con người có đến khoảng 70% là nước; thiếu nước, con người chỉ có thể sống sót vài ngày. Thế nhưng, nghịch lí là trong khi nước bao phủ khoảng 71% bề mặt Trái Đất thì nước ngọt — loại nước con người có thể sử dụng — chỉ chiếm khoảng 2,5%, phần lớn lại đóng băng ở hai cực.\n\nTình trạng thiếu nước sạch đang diễn ra ở nhiều nơi trên thế giới. Theo ước tính của Liên hợp quốc, hiện có khoảng 2 tỉ người trên thế giới chưa được tiếp cận với nguồn nước uống an toàn. Nguyên nhân là do ô nhiễm nguồn nước, khai thác quá mức và biến đổi khí hậu gây hạn hán kéo dài.\n\nTại Việt Nam, nhiều vùng nông thôn, vùng sâu vùng xa vẫn thiếu nước sạch sinh hoạt. Ở đồng bằng sông Cửu Long, xâm nhập mặn ngày càng nghiêm trọng, có năm ảnh hưởng đến hàng trăm nghìn hộ dân. Trong khi đó, ở các thành phố lớn, nguồn nước ngầm đang bị khai thác quá mức, có nguy cơ cạn kiệt và ô nhiễm.\n\nĐể bảo vệ tài nguyên nước, cần nhiều giải pháp: sử dụng n — lá chắn giữ nước tự nhiên; đầu tư hệ thống cấp nước sạch cho vùng khó khăn.\n\nMỗi giọt nước đều quý giá. Tiết kiệm nước hôm nay chính là bảo vệ cuộc sống của chúng ta ngày mai. Hãy bắt đầu từ những việc đơn giản: khóa vòi khi không dùng, tái sử dụng nước hợp lí, không xả rác xuống nguồn nước.\n\nCâu 3. Nguyên nhân gây thiếu nước sạch là gì?", "options": ["A. Trời không mưa", "B. Ô nhiễm nguồn nước, khai thác quá mức và biến đổi khí hậu gây hạn hán kéo dài", "C. Dân số ít", "D. Nước quá nhiều"], "answer": "B", "explain": "Văn bản phân tích ba nguyên nhân chính: ô nhiễm, khai thác quá mức, biến đổi khí hậu — cách trình bày nguyên nhân điển hình của văn bản thông tin.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNƯỚC SẠCH: TÀI NGUYÊN QUÝ GIÁ CẦN ĐƯỢC BẢO VỆ\n\nNước là nguồn sống của mọi sinh vật trên Trái Đất. Cơ thể con người có đến khoảng 70% là nước; thiếu nước, con người chỉ có thể sống sót vài ngày. Thế nhưng, nghịch lí là trong khi nước bao phủ khoảng 71% bề mặt Trái Đất thì nước ngọt — loại nước con người có thể sử dụng — chỉ chiếm khoảng 2,5%, phần lớn lại đóng băng ở hai cực.\n\nTình trạng thiếu nước sạch đang diễn ra ở nhiều nơi trên thế giới. Theo ước tính của Liên hợp quốc, hiện có khoảng 2 tỉ người trên thế giới chưa được tiếp cận với nguồn nước uống an toàn. Nguyên nhân là do ô nhiễm nguồn nước, khai thác quá mức và biến đổi khí hậu gây hạn hán kéo dài.\n\nTại Việt Nam, nhiều vùng nông thôn, vùng sâu vùng xa vẫn thiếu nước sạch sinh hoạt. Ở đồng bằng sông Cửu Long, xâm nhập mặn ngày càng nghiêm trọng, có năm ảnh hưởng đến hàng trăm nghìn hộ dân. Trong khi đó, ở các thành phố lớn, nguồn nước ngầm đang bị khai thác quá mức, có nguy cơ cạn kiệt và ô nhiễm.\n\nĐể bảo vệ tài nguyên nước, cần nhiều giải pháp: sử dụng nước tiết kiệm, chống lãng phí; xử lí nước thải trước khi xả ra môi trường; bảo vệ rừng đầu nguồn — lá chắn giữ nước tự nhiên; đầu tư hệ thống cấp nước sạch cho vùng khó khăn.\n\nMỗi giọt nước đều quý giá. Tiết kiệm nước hôm nay chính là bảo vệ cuộc sống của chúng ta ngày mai. Hãy bắt đầu từ những việc đơn giản: khóa vòi khi không dùng, tái sử dụng nước hợp lí, không xả rác xuống nguồn nước.\n\nCâu 4. Tình trạng nước ở Việt Nam được nêu như thế nào?", "options": ["A. Không có vấn đề", "B. Nhiều vùng nông thôn thiếu nước sạch; đồng bằng sông Cửu Long bị xâm nhập mặn ảnh hưởng hàng trăm nghìn hộ dân; nước ngầm thành phố bị khai thác quá mức", "C. Nước rất sạch", "D. Nước dồi dào"], "answer": "B", "explain": "Văn bản đưa thông tin cụ thể về Việt Nam: thiếu nước vùng nông thôn, xâm nhập mặn ở đồng bằng sông Cửu Long, nước ngầm đô thị cạn kiệt.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNƯỚC SẠCH: TÀI NGUYÊN QUÝ GIÁ CẦN ĐƯỢC BẢO VỆ\n\nNước là nguồn sống của mọi sinh vật trên Trái Đất. Cơ thể con người có đến khoảng 70% là nước; thiếu nước, con người chỉ có thể sống sót vài ngày. Thế nhưng, nghịch lí là trong khi nước bao phủ khoảng 71% bề mặt Trái Đất thì nước ngọt — loại nước con người có thể sử dụng — chỉ chiếm khoảng 2,5%, phần lớn lại đóng băng ở hai cực.\n\nTình trạng thiếu nước sạch đang diễn ra ở nhiều nơi trên thế giới. Theo ước tính của Liên hợp quốc, hiện có khoảng 2 tỉ người trên thế giới chưa được tiếp cận với nguồn nước uống an toàn. Nguyên nhân là do ô nhiễm nguồn nước, khai thác quá mức và biến đổi khí hậu gây hạn hán kéo dài.\n\nTại Việt Nam, nhiều vùng nông thôn, vùng sâu vùng xa vẫn thiếu nước sạch sinh hoạt. Ở đồng bằng sông Cửu Long, xâm nhập mặn ngày càng nghiêm trọng, có năm ảnh hưởng đến hàng trăm nghìn hộ dân. Trong khi đó, ở các thành phố lớn, nguồn nước ngầm đang bị khai thác quá mức, có nguy cơ cạn kiệt và ô nhiễm.\n\nĐể bảo vệ tài nguyên nước, cần nhiều giải pháp: sử dụng nước tiết kiệm, chống lãng phí; xử lí nước thải trước khi xả ra môi trường; bảo vệ rừng đầu nguồn — lá chắn giữ nước tự nhiên; đầu tư hệ thống cấp nước sạch cho vùng khó khăn.\n\nMỗi giọt nước đều quý giá. Tiết kiệm nước hôm nay chính là bảo vệ cuộc sống của chúng ta ngày mai. Hãy bắt đầu từ những việc đơn giản: khóa vòi khi không dùng, tái sử dụng nước hợp lí, không xả rác xuống nguồn nước.\n\nCâu 5. Theo em, mỗi người có thể tiết kiệm nước bằng cách nào? (Trả lời ngắn gọn)", "answer": "Khóa vòi khi không dùng, tái sử dụng nước hợp lí, không xả rác xuống nguồn nước", "explain": "Chấp nhận các cách cụ thể: sửa vòi rò rỉ; dùng nước vo gạo tưới cây; tắm nhanh...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý thức tiết kiệm nước sạch.", "explain": "DÀN Ý:\n1. Mở đoạn: nước sạch là tài nguyên quý giá, cần tiết kiệm.\n2. Thân đoạn: (a) Vai trò: cơ thể 70% là nước; nước ngọt chỉ 2,5%; 2 tỉ người thiếu nước uống an toàn; (b) Thực trạng: lãng phí, ô nhiễm nguồn nước; xâm nhập mặn; (c) Biện pháp: khóa vòi, tái sử dụng, không xả rác xuống nguồn nước; (d) Phê phán thói lãng phí, xả thải bừa bãi.\n3. Kết đoạn: mỗi giọt nước đều quý giá.\n\nBÀI MẪU:\nNước sạch là tài nguyên vô cùng quý giá mà mỗi người cần có ý thức tiết kiệm và bảo vệ. Cơ thể con người có đến 70% là nước; thiếu nước, con người chỉ sống sót được vài ngày. Thế nhưng, nghịch lí là nước ngọt mà con người sử dụng được chỉ chiếm khoảng 2,5% tổng lượng nước trên Trái Đất, và hiện có khoảng 2 tỉ người trên thế giới chưa được tiếp cận nước uống an toàn. Trong khi đó, tình trạng lãng phí và ô nhiễm nguồn nước vẫn diễn ra phổ biến: vòi nước chảy tràn lan, nước thải xả thẳng ra sông hồ, rác thải vứt bừa bãi xuống nguồn nước. Ở nước ta, nhiều vùng nông thôn thiếu nước sạch, đồng bằng sông Cửu Long bị xâm nhập mặn ảnh hưởng hàng trăm nghìn hộ dân. Tiết kiệm nước không khó: khóa vòi ngay khi không dùng, sửa vòi rò rỉ, tái sử dụng nước vo gạo để tưới cây, không xả rác xuống nguồn nước. Đáng phê phán là những người vô ý thức: để nước chảy hoang phí, xả thải bừa bãi — họ đang tự tay hủy hoại nguồn sống của chính mình. Hãy nhớ: mỗi giọt nước đều quý giá; tiết kiệm nước hôm nay chính là bảo vệ cuộc sống của chúng ta ngày mai.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về vấn đề ô nhiễm nguồn nước hiện nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — ô nhiễm nguồn nước: hiểm họa âm thầm.\nII. Thân bài:\n1. Thực trạng:\n   a. Nhiều sông, hồ, kênh rạch bị ô nhiễm nặng.\n   b. Nước ngầm đô thị bị khai thác quá mức, có nguy cơ ô nhiễm.\n   c. Xâm nhập mặn ở đồng bằng sông Cửu Long.\n2. Nguyên nhân:\n   a. Nước thải công nghiệp, sinh hoạt chưa qua xử lí.\n   b. Rác thải, hóa chất nông nghiệp.\n   c. Ý thức người dân kém.\n3. Hậu quả: bệnh tật; thiếu nước sạch; ảnh hưởng sinh thái, kinh tế.\n4. Giải pháp:\n   a. Xử lí nước thải bắt buộc; xử phạt nghiêm.\n   b. Bảo vệ rừng đầu nguồn.\n   c. Tiết kiệm nước, nâng cao ý thức cộng đồng.\nIII. Kết bài: khẳng định; kêu gọi.\n\nĐOẠN MẪU (mở bài):\nNước là nguồn sống, nhưng nguồn sống ấy đang bị đe dọa nghiêm trọng bởi ô nhiễm. Nhiều dòng sông từng trong xanh nay đen ngòm, bốc mùi; nước ngầm ở các đô thị lớn đứng trước nguy cơ cạn kiệt và ô nhiễm; hàng trăm nghìn hộ dân vùng đồng bằng sông Cửu Long khốn đốn vì xâm nhập mặn. Ô nhiễm nguồn nước — hiểm họa âm thầm nhưng khốc liệt — đang gióng lên hồi chuông cảnh báo về ý thức bảo vệ môi trường của con người.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTRÍ TUỆ NHÂN TẠO TRONG GIÁO DỤC: CƠ HỘI VÀ THÁCH THỨC\n\nTrí tuệ nhân tạo (AI) đang thay đổi mạnh mẽ mọi lĩnh vực của đời sống, trong đó có giáo dục. Các công cụ AI có thể giúp học sinh giải đáp thắc mắc, luyện tập bài tập, học ngoại ngữ; giúp giáo viên soạn bài, chấm bài và cá nhân hóa việc dạy học. Theo khảo sát, tỉ lệ học sinh, sinh viên sử dụng công cụ AI hỗ trợ học tập đang tăng nhanh trong những năm gần đây.\n\nLợi ích của AI trong giáo dục là rõ rệt. Học sinh ở vùng sâu vùng xa có thể tiếp cận nguồn tri thức phong phú mà trước đây khó có được. Người học được hỗ trợ 24/7, học theo tốc độ của riêng mình. Giáo viên giảm được gánh nặng công việc hành chính, có thêm thời gian quan tâm đến từng học sinh.\n\nTuy nhiên, AI cũng đặt ra nhiều thách thức. Nguy cơ lớn nhất là học sinh lạm dụng AI để làm bài hộ, dẫn đến lười suy nghĩ, mất dần khả năng tự học. Thông tin do AI cung cấp không phải lúc nào cũng chính xác — AI có thể đưa ra câu trả lời sai một cách rất tự tin. Ngoài ra, việc phụ thuộc quá nhiều vào công nghệ còn làm giảm tương tác giữa thầy và trò, giữa học sinh với nhau.\n\nĐể tận dụng AI hiệu quả, cần nguyên tắc rõ ràng: dùng AI như công cụ hỗ trợ chứ không thay thế tư duy; luôn kiểm chứng thông tin; nhà trường cần hướng dẫn học sinh sử dụng AI đúng cách và có quy định về liêm chính học thuật.\n\nAI là công cụ mạnh mẽ, nhưng giá trị của giáo dục vẫn nằm ở con người: ở sự tò mò, nỗ lực và khát vọng vươn lên của mỗi học sinh. Công nghệ dù tiến bộ đến đâu cũng không thể thay thế được những phẩm chất ấy.\n\nCâu 1. AI mang lại lợi ích gì cho giáo dục?", "options": ["A. Không có lợi ích", "B. Giúp học sinh giải đáp thắc mắc, luyện tập, học ngoại ngữ; giúp giáo viên soạn, chấm bài; học sinh vùng xa tiếp cận tri thức; học theo tốc độ riêng", "C. Chỉ để chơi game", "D. Thay thế giáo viên"], "answer": "B", "explain": "Văn bản liệt kê cụ thể các lợi ích của AI với học sinh và giáo viên — thông tin có hệ thống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTRÍ TUỆ NHÂN TẠO TRONG GIÁO DỤC: CƠ HỘI VÀ THÁCH THỨC\n\nTrí tuệ nhân tạo (AI) đang thay đổi mạnh mẽ mọi lĩnh vực của đời sống, trong đó có giáo dục. Các công cụ AI có thể giúp học sinh giải đáp thắc mắc, luyện tập bài tập, học ngoại ngữ; giúp giáo viên soạn bài, chấm bài và cá nhân hóa việc dạy học. Theo khảo sát, tỉ lệ học sinh, sinh viên sử dụng công cụ AI hỗ trợ học tập  ngoại ngữ; giúp giáo viên soạn bài, chấm bài và cá nhân hóa việc dạy học. Theo khảo sát, tỉ lệ học sinh, sinh viên sử dụng công cụ AI hỗ trợ học tập đang tăng nhanh trong những năm gần đây.\n\nLợi ích của AI trong giáo dục là rõ rệt. Học sinh ở vùng sâu vùng xa có thể tiếp cận nguồn tri thức phong phú mà trước đây khó có được. Người học được hỗ trợ 24/7, học theo tốc độ của riêng mình. Giáo viên giảm được gánh nặng công việc hành chính, có thêm thời gian quan tâm đến từng học sinh.\n\nTuy nhiên, AI cũng đặt ra nhiều thách thức. Nguy cơ lớn nhất là học sinh lạm dụng AI để làm bài hộ, dẫn đến lười suy nghĩ, mất dần khả năng tự học. Thông tin do AI cung cấp không phải lúc nào cũng chính xác — AI có thể đưa ra câu trả lời sai một cách rất tự tin. Ngoài ra, việc phụ thuộc quá nhiều vào công nghệ còn làm giảm tương tác giữa thầy và trò, giữa học sinh với nhau.\n\nĐể tận dụng AI hiệu quả, cần nguyên tắc rõ ràng: dùng AI như công cụ hỗ trợ chứ không thay thế tư duy; luôn kiểm chứng thông tin; nhà trường cần hướng dẫn học sinh sử dụng AI đúng cách và có quy định về liêm chính học thuật.\n\nAI là công cụ mạnh mẽ, nhưng giá trị của giáo dục vẫn nằm ở con người: ở sự tò mò, nỗ lực và khát vọng vươn lên của mỗi học sinh. Công nghệ dù tiến bộ đến đâu cũng không thể thay thế được những phẩm chất ấy.\n\nCâu 5. Theo em, học sinh nên sử dụng AI như thế nào cho đúng? (Trả lời ngắn gọn)", "answer": "Dùng AI hỗ trợ học tập, không làm bài hộ; luôn kiểm chứng thông tin", "explain": "Chấp nhận các cách đúng: hỏi AI để hiểu bài rồi tự làm; không copy bài AI; tuân thủ quy định của thầy cô...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về việc sử dụng trí tuệ nhân tạo trong học tập.", "explain": "DÀN Ý:\n1. Mở đoạn: AI mang lại cơ hội lớn nhưng cũng đặt ra thách thức.\n2. Thân đoạn: (a) Lợi ích: hỗ trợ giải đáp, luyện tập, cá nhân hóa; học sinh vùng xa tiếp cận tri thức; (b) Nguy cơ: lạm dụng làm bài hộ, lười suy nghĩ; thông tin sai; giảm tương tác; (c) Nguyên tắc: công cụ hỗ trợ, kiểm chứng thông tin, liêm chính học thuật; (d) Phê phán thói copy bài AI.\n3. Kết đoạn: giá trị giáo dục nằm ở con người.\n\nBÀI MẪU:\nTrí tuệ nhân tạo đang mở ra những cơ hội to lớn cho giáo dục, nhưng cũng đặt ra không ít thách thức đòi hỏi người học phải tỉnh táo. Về lợi ích, AI giúp học sinh giải đáp thắc mắc, luyện tập bài tập, học ngoại ngữ mọi lúc mọi nơi; giúp giáo viên giảm gánh nặng hành chính để quan tâm hơn đến từng học sinh; học sinh vùng sâu vùng xa có cơ hội tiếp cận nguồn tri thức phong phú. Tuy nhiên, mặt trái cũng rất đáng lo: nhiều bạn lạm dụng AI để làm bài hộ, dần lười suy nghĩ và mất khả năng tự học; thông tin AI cung cấp không phải lúc nào cũng chính xác — AI có thể trả lời sai một cách rất tự tin; sự phụ thuộc vào công nghệ còn làm giảm tương tác giữa thầy trò, bạn bè. Vì vậy, cần nguyên tắc rõ ràng: dùng AI như công cụ hỗ trợ chứ không thay thế tư duy; luôn kiểm chứng thông tin; tuân thủ liêm chính học thuật. Đáng phê phán là những học sinh copy nguyên bài của AI để nộp — đó là sự gian dối với chính mình. Hãy nhớ: công nghệ dù tiến bộ đến đâu cũng không thể thay thế sự tò mò, nỗ lực và khát vọng vươn lên — những giá trị cốt lõi làm nên con người có học.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về tác động của công nghệ số đến đời sống con người.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — công nghệ số: bước tiến vĩ đại và những hệ lụy.\nII. Thân bài:\n1. Tác động tích cực:\n   a. Kết nối, thông tin nhanh chóng.\n   b. Hỗ trợ học tập, làm việc (AI).\n   c. Nâng cao chất lượng sống.\n2. Tác động tiêu cực:\n   a. Nghiện công nghệ, lười vận động, lười tư duy.\n   b. Lừa đảo, tin giả, mất an toàn thông tin.\n   c. Giảm tương tác trực tiếp.\n3. Nguyên nhân: phát triển quá nhanh; thiếu kĩ năng số; quản lí chưa theo kịp.\n4. Giải pháp: dùng công nghệ thông minh, có chừng mực; giáo dục kĩ năng số; hoàn thiện pháp luật.\nIII. Kết bài: khẳng định công nghệ là công cụ; con người làm chủ.\n\nĐOẠN MẪU (mở bài):\nCông nghệ số đã và đang làm thay đổi sâu sắc mọi mặt đời sống con người: từ cách chúng ta học tập, làm việc đến cách giao tiếp, giải trí. Trí tuệ nhân tạo có thể trả lời mọi thắc mắc trong tích tắc; mạng xã hội kết nối hàng tỉ người. Thế nhưng, đằng sau những tiện ích ấy là không ít hệ lụy: nghiện công nghệ, lừa đảo trực tuyến, tin giả tràn lan... Công nghệ là con dao hai lưỡi — vấn đề là con người sử dụng nó như thế nào.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSÁCH — NGƯỜI BẠN THAY ĐỔI LỊCH SỬ LOÀI NGƯỜI\n\nTrong tiến trình văn minh nhân loại, sách giữ một vai trò đặc biệt quan trọng. Nếu không có sách, tri thức của nhân loại sẽ không thể được lưu giữ và truyền lại qua các thế hệ; mỗi thế hệ sẽ phải bắt đầu lại từ đầu.\n\nLịch sử ghi nhận những bước ngoặt gắn liền với sách. Việc phát minh ra máy in vào thế kỉ XV đã làm cho sách trở nên phổ biến, góp phần thúc đẩy phong trào Phục hưng và cải cách tôn giáo ở châu Âu. Những cuốn sách khoa học đã truyền bá tri thức, thay đổi cách con người nhìn nhận về thế giới. Những tác phẩm văn học lớn đã thức tỉnh lương tri, hun đúc lí tưởng cho bao thế hệ.\n\nỞ Việt Nam, sách cũng gắn liền với những trang sử vẻ vang. Trong những năm kháng chiến, những cuốn sách, tờ báo cách mạng đã truyền bá lí tưởng, cổ vũ tinh thần chiến đấu của quân và dân. Nhiều nhà cách mạng đã tìm thấy con đường cứu nước qua những trang sách.\n\nNgày nay, dù có nhiều phương tiện truyền thông hiện đại, sách vẫn giữ vị trí không thể thay thế. Sách điện tử ra đời giúp việc đọc trở nên thuận tiện hơn, nhưng giá trị cốt lõi của sách — tri thức được chắt lọc, hệ thống — vẫn nguyên vẹn. Thống kê cho thấy những quốc gia có văn hóa đọc phát triển thường là những quốc gia phát triển về kinh tế, khoa học.\n\nSách là người bạn trung thành, người thầy thầm lặng của mỗi con người. Đầu tư cho sách, cho văn hóa đọc chính là đầu tư cho tương lai của dân tộc.\n\nCâu 1. Nếu không có sách, điều gì sẽ xảy ra với tri thức nhân loại?", "options": ["A. Không sao cả", "B. Tri thức không thể lưu giữ và truyền lại; mỗi thế hệ phải bắt đầu lại từ đầu", "C. Tri thức phát triển nhanh hơn", "D. Con người thông minh hơn"], "answer": "B", "explain": "Văn bản khẳng định vai trò lưu giữ và truyền lại tri thức của sách — chức năng cốt lõi làm nên văn minh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSÁCH — NGƯỜI BẠN THAY ĐỔI LỊCH SỬ LOÀI NGƯỜI\n\nTrong tiến trình văn minh nhân loại, sách giữ một vai trò đặc biệt quan trọng. Nếu không có sách, tri thức của nhân loại sẽ không thể được lưu giữ và truyền lại qua các thế hệ; mỗi thế hệ sẽ phải bắt đầu lại từ đầu.\n\nLịch sử ghi nhận những bước ngoặt gắn liền với sách. Việc phát minh ra máy in vào thế kỉ XV đã làm cho sách trở nên phổ biến, góp phần thúc đẩy phong trào Phục hưng và cải cách tôn giáo ở châu Âu. Những cuốn sách khoa học đã truyền bá tri thức, thay đổi cách con người nhìn nhận về thế giới. Những tác phẩm văn học lớn đã thức tỉnh lương tri, hun đúc lí tưởng cho bao thế hệ.\n\nỞ Việt Nam, sách cũng gắn liền với những trang sử vẻ vang. Trong những năm kháng chiến, những cuốn sách, tờ báo cách mạng đã truyền bá lí tưởng, cổ vũ tinh thần chiến đấu của quân và dân. Nhiều nhà cách mạng đã tìm thấy con đường cứu nước qua những trang sách.\n\nNgày nay, dù có nhiều phương tiện truyền thông hiện đại, sách vẫn giữ vị trí không thể thay thế. Sách điện tử ra đời giúp việc đọc trở nên thuận tiện hơn, nhưng giá trị cốt lõi của sách — tri thức được chắt lọc, hệ thống — vẫn nguyên vẹn. Thống kê cho thấy những quốc gia có văn hóa đọc phát triển thường là những quốc gia phát triển về kinh tế, khoa học.\n\nSách là người bạn trung thành, người thầy thầm lặng của mỗi con người. Đầu tư cho sách, cho văn hóa đọc chính l ay thế dù có nhiều phương tiện hiện đại?", "options": ["A. Vì sách rẻ", "B. Vì giá trị cốt lõi của sách — tri thức được chắt lọc, hệ thống — vẫn nguyên vẹn; quốc gia có văn hóa đọc phát triển thường phát triển về kinh tế, khoa học", "C. Vì thói quen", "D. Vì không có internet"], "answer": "B", "explain": "Văn bản lí giải: giá trị cốt lõi của sách là tri thức được chắt lọc, hệ thống — điều mà thông tin rời rạc trên mạng khó thay thế.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSÁCH — NGƯỜI BẠN THAY ĐỔI LỊCH SỬ LOÀI NGƯỜI\n\nTrong tiến trình văn minh nhân loại, sách giữ một vai trò đặc biệt quan trọng. Nếu không có sách, tri thức của nhân loại sẽ không thể được lưu giữ và truyền lại qua các thế hệ; mỗi thế hệ sẽ phải bắt đầu lại từ đầu.\n\nLịch sử ghi nhận những bước ngoặt gắn liền với sách. Việc phát minh ra máy in vào thế kỉ XV đã làm cho sách trở nên phổ biến, góp phần thúc đẩy phong trào Phục hưng và cải cách tôn giáo ở châu Âu. Những cuốn sách khoa học đã truyền bá tri thức, thay đổi cách con người nhìn nhận về thế giới. Những tác phẩm văn học lớn đã thức tỉnh lương tri, hun đúc lí tưởng cho bao thế hệ.\n\nỞ Việt Nam, sách cũng gắn liền với những trang sử vẻ vang. Trong những năm kháng chiến, những cuốn sách, tờ báo cách mạng đã truyền bá lí tưởng, cổ vũ tinh thần chiến đấu của quân và dân. Nhiều nhà cách mạng đã tìm thấy con đường cứu nước qua những trang sách.\n\nNgày nay, dù có nhiều phương tiện truyền thông hiện đại, sách vẫn giữ vị trí không thể thay thế. Sách điện tử ra đời giúp việc đọc trở nên thuận tiện hơn, nhưng giá trị cốt lõi của sách — tri thức được chắt lọc, hệ thống — vẫn nguyên vẹn. Thống kê cho thấy những quốc gia có văn hóa đọc phát triển thường là những quốc gia phát triển về kinh tế, khoa học.\n\nSách là người bạn trung thành, người thầy thầm lặng của mỗi con người. Đầu tư cho sách, cho văn hóa đọc chính là đầu tư cho tương lai của dân tộc.\n\nCâu 5. Theo em nts": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ bàn về ý kiến: Sách là ngọn đèn sáng bất diệt của trí tuệ con người.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu ý kiến — sách như ngọn đèn soi sáng trí tuệ.\nII. Thân bài:\n1. Giải thích: sách lưu giữ tri thức; ngọn đèn sáng bất diệt: giá trị trường tồn.\n2. Chứng minh:\n   a. Sách lưu giữ, truyền bá tri thức qua các thế hệ.\n   b. Sách thay đổi nhận thức, thức tỉnh con người (dẫn chứng lịch sử).\n   c. Sách nuôi dưỡng tâm hồn, nhân cách.\n   d. Sách với dân tộc Việt Nam.\n3. Bàn luận mở rộng:\n   a. Ngày nay sách vẫn không thể thay thế.\n   b. Phê phán thói lười đọc, đọc thiếu chọn lọc.\n4. Bài học: xây dựng thói quen đọc; chọn sách hay; lan tỏa văn hóa đọc.\nIII. Kết bài: khẳng định lại ý kiến; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nCó ý kiến cho rằng: Sách là ngọn đèn sáng bất diệt của trí tuệ con người. Thật vậy, trải qua bao thăng trầm của lịch sử, qua bao biến đổi của thời đại, sách vẫn sừng sững như ngọn đèn soi sáng con đường phát triển của nhân loại — lưu giữ tri thức, thức tỉnh lương tri và nuôi dưỡng những tâm hồn. Ý kiến ấy hoàn toàn đúng đắn và đáng để mỗi chúng ta suy ngẫm, nhất là trong thời đại mà văn hóa đọc đang đứng trước nhiều thách thức.", "points": 0}]}]}
