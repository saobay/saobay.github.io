a người dân miền Tây: hãy đón nhận thiên nhiên với lòng biết ơn thay vì oán trách.\n\nCâu 5. Qua văn bản, em hiểu thêm điều gì về mối quan hệ giữa con người và thiên nhiên? (Trả lời ngắn gọn)", "answer": "Con người nên sống hài hòa, biết ơn thiên nhiên thay vì đối đầu", "explain": "Chấp nhận các cách diễn đạt tương đương: thiên nhiên vừa khắc nghiệt vừa hào phóng; cần thích ứng khôn ngoan...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về thái độ ứng xử đúng đắn của con người với thiên nhiên.", "explain": "DÀN Ý:\n1. Mở đoạn: con người cần ứng xử hài hòa với thiên nhiên.\n2. Thân đoạn: (a) Thiên nhiên nuôi sống con người (như mùa nước mang phù sa, sản vật); (b) Cần biết ơn, bảo vệ thay vì tàn phá, oán trách; (c) Phê phán thói tàn phá môi trường, khai thác cạn kiệt.\n3. Kết đoạn: sống hài hòa với thiên nhiên.\n\nBÀI MẪU:\nCon người cần có thái độ ứng xử đúng đắn, hài hòa với thiên nhiên — đó là bài học từ cách người dân miền Tây đón nhận mùa nước nổi. Thiên nhiên là người mẹ nuôi sống con người: cho ta không khí để thở, nước để uống, đất đai để canh tác, và biết bao sản vật như cá tôm, phù sa trong mùa nước. Thế nhưng, thay vì biết ơn, không ít người đã đối xử tàn tệ với thiên nhiên: chặt phá rừng, xả thải bừa bãi, khai thác cạn kiệt tài nguyên — để rồi phải gánh chịu hậu quả: lũ lụt, hạn hán, ô nhiễm. Người miền Tây dạy ta một triết lí sống đẹp: coi thiên nhiên là bạn chứ không phải là thù, đón nhận những gì thiên nhiên ban tặng với lòng biết ơn và thích ứng một cách khôn ngoan. Ứng xử đúng đắn với thiên nhiên hôm nay không chỉ là bảo vệ môi trường mà còn là bảo vệ chính cuộc sống của chúng ta và các thế hệ mai sau. Mỗi người hãy bắt đầu từ những việc nhỏ: tiết kiệm tài nguyên, không xả rác bừa bãi, trồng thêm cây xanh — để con người và thiên nhiên mãi là bạn đồng hành.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về vai trò của thiên nhiên đối với cuộc sống con người.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — thiên nhiên có vai trò to lớn với con người.\nII. Thân bài:\n1. Vai trò của thiên nhiên:\n   a. Cung cấp điều kiện sống (không khí, nước, đất đai).\n   b. Mang lại sản vật, của cải (như mùa nước nổi với cá tôm, phù sa).\n   c. Nuôi dưỡng tâm hồn (cảnh đẹp, sự thanh thản).\n   d. Là bài học, triết lí sống.\n2. Thực trạng: con người tàn phá thiên nhiên — hậu quả.\n3. Giải pháp: bảo vệ môi trường; sống hài hòa với thiên nhiên.\n4. Phê phán thói vô ý thức, khai thác cạn kiệt.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nThiên nhiên là người mẹ vĩ đại của nhân loại — cho ta sự sống, nuôi dưỡng ta từng ngày và dạy ta những bài học sâu sắc về cách sống. Từ không khí ta thở, nguồn nước ta uống đến những mùa nước nổi mang phù sa, sản vật cho đồng bằng, thiên nhiên hiện diện trong mọi mặt của đời sống con người. Thế nhưng, đáng buồn là con người hiện đại đang đối xử ngày càng tệ với người mẹ ấy. Nhìn nhận đúng vai trò của thiên nhiên để có thái độ ứng xử phù hợp là vấn đề cấp thiết hôm nay.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỮA CƠM QUÊ\n(Tùy bút)\n\nĐã lâu lắm rồi tôi mới được ăn một bữa cơm quê đúng nghĩa — bữa cơm ở nhà bà ngoại tôi ở làng.\n\nMâm cơm được bày trên chiếc chõng tre giữa sân, dưới bóng cây vú sữa. Toàn những món dân dã: canh rau đay nấu với cua đồng, cá rô kho tộ, cà pháo mắm tôm, đĩa rau luộc chấm kho quẹt. Không sơn hào hải vị, nhưng món nào cũng đậm đà hương vị quê nhà.\n\nBà ngoại tôi năm nay đã ngoài tám mươi mà vẫn nhanh nhẹn. Bà gắp cho tôi miếng cá rô: Ăn đi con, cá rô đồng nhà mình đấy, thịt chắc lắm! Rồi bà kể chuyện ngày xưa: thời bà còn trẻ, bữa cơm quê còn đạm bạc hơn nhiều, có khi chỉ có rau cháo qua ngày. Được như hôm nay là sung sướng lắm rồi.\n\nTôi vừa ăn vừa nghe bà kể, chợt thấy cay cay nơi sống mũi. Bữa cơm quê không chỉ ngon ở món ăn mà còn ngon ở tình người — tình bà cháu, tình quê hương thấm đẫm trong từng miếng cơm, miếng cá.\n\nĂn xong, bà pha ấm trà xanh, hai bà cháu ngồi hóng mát. Bà bảo: Các con ở thành phố sướng thật, nhưng đừng quên quê nhé. Quê là gốc rễ, đi đâu cũng phải nhớ về.\n\nTôi gật đầu, lòng thầm hứa sẽ thường xuyên về thăm bà, thăm quê. Bởi tôi hiểu ra: bữa cơm quê không chỉ nuôi lớn thể xác mà còn nuôi dưỡng tâm hồn — nhắc ta nhớ về cội nguồn, về những giá trị bình dị mà thiêng liêng nhất của cuộc đời.\n\nCâu 1. Bữa cơm quê trong văn bản gồm những món nào?", "options": ["A. Sơn hào hải vị", "B. Canh rau đay nấu cua đồng, cá rô kho tộ, cà pháo mắm tôm, rau luộc chấm kho quẹt — những món dân dã", "C. Pizza, gà rán", "D. Lẩu hải sản"], "answer": "B", "explain": "Văn bản liệt kê cụ thể: canh rau đay cua đồng, cá rô kho tộ, cà pháo mắm tôm, rau luộc — toàn món dân dã đậm đà hương vị quê nhà.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỮA CƠM QUÊ\n(Tùy bút)\n\nĐã lâu lắm rồi tôi mới được ăn một bữa cơm quê đúng nghĩa — bữa cơm ở nhà bà ngoại tôi ở làng.\n\nMâm cơm được bày trên chiếc chõng tre giữa sân, dưới bóng cây vú sữa. Toàn những món dân dã: canh rau đay nấu với cua đồng, cá rô kho tộ, cà pháo mắm tôm, đĩa rau luộc chấm kho quẹt. Không sơn hào hải vị, nhưng món nào cũng đậm đà hương vị quê nhà.\n\nBà ngoại tôi năm nay đã ngoài tám mươi mà vẫn nhanh nhẹn. Bà gắp cho tôi miếng cá rô: Ăn đi con, cá rô đồng nhà mình đấy, thịt chắc lắm! Rồi bà kể chuyện ngày xưa: thời bà còn trẻ, bữa cơm quê còn đạm bạc hơn nhiều, có khi chỉ có rau cháo qua ngày. Được như hôm nay là sung sướng lắm rồi.\n\nTôi vừa ăn vừa nghe bà kể, chợt thấy cay cay nơi sống mũi. Bữa cơm quê không chỉ ngon ở món ăn mà còn ngon ở tình người — tình bà cháu, tình quê hương thấm đẫm trong từng miếng cơm, miếng cá.\n\nĂn xong, bà pha ấm trà xanh, hai bà cháu ngồi hóng mát. Bà bảo: Các con ở thành phố sướng thật, nhưng đừng quên quê nhé. Quê là gốc rễ, đi đâu cũng phải nhớ về.\n\nTôi gật đầu, lòng thầm hứa sẽ thường xuyên về thăm bà, thăm quê. Bởi tôi hiểu ra: bữa cơm quê không chỉ nuôi lớn thể xác mà còn nuôi dưỡng tâm hồn — nhắc ta nhớ về cội nguồn, về những giá trị bình dị mà thiêng liêng nhất của cuộc đời.\n\nCâu 2. Không gian của bữa cơm quê là ở đâu?", "options": ["A. Trong nhà hàng sang trọng", "B. Trên chiếc chõng tre giữa sân, dưới bóng cây vú sữa — không gian quê bình dị", "C. Trong bếp hiện đại", "D. Ngoài đồng"], "answer": "B", "explain": "Mâm cơm bày trên chõng tre giữa sân dưới bóng cây vú sữa — không gian quê mộc mạc, gần gũi, đậm chất thôn quê.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỮA CƠM QUÊ\n(Tùy bút)\n\nĐã lâu lắm rồi tôi mới được ăn một bữa cơm quê đúng nghĩa — bữa cơm ở nhà bà ngoại tôi ở làng.\n\nMâm cơm được bày trên chiếc chõng tre giữa sân, dưới bóng cây vú sữa. Toàn những món dân dã: canh rau đay nấu với cua đồng, cá rô kho tộ, cà pháo mắm tôm, đĩa rau luộc chấm kho quẹt. Không sơn hào hải vị, nhưng món nào cũng đậm đà hương vị quê nhà.\n\nBà ngoại tôi năm nay đã ngoài tám mươi mà vẫn nhanh nhẹn. Bà gắp cho tôi miếng cá rô: Ăn đi con, cá rô đồng nhà mình đấy, thịt chắc lắm! Rồi bà kể chuyện ngày xưa: thời bà còn trẻ, bữa cơm quê còn đạm bạc hơn nhiều, có khi chỉ có rau cháo qua ngày. Được như hôm nay là sung sướng lắm rồi.\n\nTôi vừa ăn vừa nghe bà kể, chợt thấy cay cay nơi sống mũi. Bữa cơm quê không chỉ ngon ở món ăn mà còn ngon ở tình người — tình bà cháu, tình quê hương thấm đẫm trong từng miếng cơm, miếng cá.\n\nĂn xong, bà pha ấm trà xanh, hai bà cháu ngồi hóng mát. Bà bảo: Các con ở thành phố sướng thật, nhưng đừng quên quê nhé. Quê là gốc rễ, đi đâu cũng phải nhớ về.\n\nTôi gật đầu, lòng thầm hứa sẽ thường xuyên về thăm bà, thăm quê. Bởi tôi hiểu ra: bữa cơm quê không chỉ nuôi lớn thể xác mà còn nuôi dưỡng tâm hồn — nhắc ta nhớ về cội nguồn, về những giá trị bình dị mà thiêng liêng nhất của cuộc đời.\n\nCâu 3. Vì sao tác giả thấy cay cay nơi sống mũi khi ăn cơm?", "options": ["A. Vì món ăn quá cay", "B. Vì xúc động trước tình bà cháu, tình quê hương thấm đẫm trong bữa cơm — bữa cơm ngon ở tình người chứ không chỉ ở món ăn", "C. Vì nhớ nhà", "D. Vì khói bếp"], "answer": "B", "explain": "Cảm xúc dâng trào từ sự thấm thía: bữa cơm quê ngon ở tình người — tình bà cháu, tình quê hương trong từng miếng cơm; đó là rung động của tâm hồn biết trân trọng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỮA CƠM QUÊ\n(Tùy bút)\n\nĐã lâu lắm rồi tôi mới được ăn một bữa cơm quê đúng nghĩa — bữa cơm ở nhà bà ngoại tôi ở làng.\n\nMâm cơm được bày trên chiếc chõng tre giữa sân, dưới bóng cây vú sữa. Toàn những món dân dã: canh rau đay nấu với cua đồng, cá rô kho tộ, cà pháo mắm tôm, đĩa rau luộc chấm kho quẹt. Không sơn hào hải vị, nhưng món nào cũng đậm đà hương vị quê nhà.\n\nBà ngoại tôi năm nay đã ngoài tám mươi mà vẫn nhanh nhẹn. Bà gắp cho tôi miếng cá rô: Ăn đi con, cá rô đồng nhà mình đấy, thịt chắc lắm! Rồi bà kể chuyện ngày xưa: thời bà còn trẻ, bữa cơm quê còn đạm bạc hơn nhiều, có khi chỉ có rau cháo qua ngày. Được như hôm nay là sung sướng lắm rồi.\n\nTôi vừa ăn vừa nghe bà kể, chợt thấy cay cay nơi sống mũi. Bữa cơm quê không chỉ ngon ở món ăn mà còn ngon ở tình người — tình bà cháu, tình quê hương thấm đẫm trong từng miếng cơm, miếng cá.\n\nĂn xong, bà pha ấm trà xanh, hai bà cháu ngồi hóng mát. Bà bảo: Các con ở thành phố sướng thật, nhưng đừng quên quê nhé. Quê là gốc rễ, đi đâu cũng phải nhớ về.\n\nTôi gật đầu, lòng thầm hứa sẽ thường xuyên về thăm bà, thăm quê. Bởi tôi hiểu ra: bữa cơm quê không chỉ nuôi lớn thể xác mà còn nuôi dưỡng tâm hồn — nhắc ta nhớ về cội nguồn, về những giá trị bình dị mà thiêng liêng nhất của cuộc đời.\n\nCâu 4. Lời dặn của bà ngoại có ý nghĩa gì?", "options": ["A. Chê thành phố", "B. Nhắn nhủ: dù đi đâu, sống ở đâu cũng đừng quên quê hương, cội nguồn — quê là gốc rễ", "C. Muốn cháu về quê sống", "D. Khoe quê đẹp"], "answer": "B", "explain": "\"Quê là gốc rễ, đi đâu cũng phải nhớ về\" — lời dặn mộc mạc mà thấm thía về đạo lí uống nước nhớ nguồn, về sự gắn bó với quê hương.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỮA CƠM QUÊ\n(Tùy bút)\n\nĐã lâu lắm rồi tôi mới được ăn một bữa cơm quê đúng nghĩa — bữa cơm ở nhà bà ngoại tôi ở làng.\n\nMâm cơm được bày trên chiếc chõng tre giữa sân, dưới bóng cây vú sữa. Toàn những món dân dã: canh rau đay nấu với cua đồng, cá rô kho tộ, cà pháo mắm tôm, đĩa rau luộc chấm kho quẹt. Không sơn hào hải vị, nhưng món nào cũng đậm đà hương vị quê nhà.\n\nBà ngoại tôi năm nay đã ngoài tám mươi mà vẫn nhanh nhẹn. Bà gắp cho tôi miếng cá rô: Ăn đi con, cá rô đồng nhà mình đấy, thịt chắc lắm! Rồi bà kể chuyện ngày xưa: thời bà còn trẻ, bữa cơm quê còn đạm bạc hơn nhiều, có khi chỉ có rau cháo qua ngày. Được như hôm nay là sung sướng lắm rồi.\n\nTôi vừa ăn vừa nghe bà kể, chợt thấy cay cay nơi sống mũi. Bữa cơm quê không chỉ ngon ở món ăn mà còn ngon ở tình người — tình bà cháu, tình quê hương thấm đẫm trong từng miếng cơm, miếng cá.\n\nĂn xong, bà pha ấm trà xanh, hai bà cháu ngồi hóng mát. Bà bảo: Các con ở thành phố sướng thật, nhưng đừng quên quê nhé. Quê là gốc rễ, đi đâu cũng phải nhớ về.\n\nTôi gật đầu, lòng thầm hứa sẽ thường xuyên về thăm bà, thăm quê. Bởi tôi hiểu ra: bữa cơm quê không chỉ nuôi lớn thể xác mà còn nuôi dưỡng tâm hồn — nhắc ta nhớ về cội nguồn, về những giá trị bình dị mà thiêng liêng nhất của cuộc đời.\n\nCâu 5. Qua văn bản, em cảm nhận được điều gì về giá trị của những điều bình dị? (Trả lời ngắn gọn)", "answer": "Những điều bình dị (bữa cơm quê) chứa đựng giá trị thiêng liêng: tình thân, cội nguồn", "explain": "Chấp nhận các cách diễn đạt tương đương: hạnh phúc đến từ những điều giản dị; cần trân trọng những gì bình dị quanh ta...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của bữa cơm gia đình.", "explain": "DÀN Ý:\n1. Mở đoạn: bữa cơm gia đình có ý nghĩa thiêng liêng.\n2. Thân đoạn: (a) Là nơi sum họp, gắn kết; (b) Chứa đựng tình thương như bữa cơm quê của bà ngoại; (c) Phê phán lối sống bận rộn bỏ bê bữa cơm chung, mỗi người một màn hình.\n3. Kết đoạn: hãy trân trọng bữa cơm gia đình.\n\nBÀI MẪU:\nBữa cơm gia đình có một ý nghĩa thiêng liêng mà không món ăn cao lương mĩ vị nào ở nhà hàng có thể thay thế được. Đó là khoảng thời gian quý giá để các thành viên sum họp sau một ngày bận rộn, cùng nhau chia sẻ những buồn vui trong cuộc sống. Quanh mâm cơm, cha mẹ và con cái thêm gần gũi, thấu hiểu nhau hơn — như bữa cơm quê trong tùy bút, ngon không chỉ ở món ăn dân dã mà còn ở tình bà cháu ấm áp thấm đẫm trong từng miếng cơm. Bữa cơm gia đình còn là nơi giáo dục con cái những bài học đầu đời: lễ phép mời cơm, biết nhường nhịn, biết trân trọng công sức của người nấu. Thế nhưng, trong cuộc sống hiện đại hối hả, không ít gia đình đánh mất thói quen quý giá này: cha mẹ bận việc, con cái dán mắt vào điện thoại, mỗi người ăn một nơi, một giờ. Dần dần, sợi dây gắn kết gia đình trở nên lỏng lẻo mà không ai hay. Vì vậy, dù bận rộn đến đâu, mỗi chúng ta hãy cố gắng giữ gìn những bữa cơm chung — bởi hạnh phúc đôi khi chỉ đơn giản là được quây quần bên mâm cơm với những người thân yêu.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về đạo lí uống nước nhớ nguồn của dân tộc ta.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu đạo lí uống nước nhớ nguồn.\nII. Thân bài:\n1. Giải thích: biết ơn những người đã mang lại cuộc sống hôm nay.\n2. Chứng minh:\n   a. Trong gia đình: biết ơn ông bà, cha mẹ (như tình cảm với bà ngoại trong tùy bút).\n   b. Với quê hương: nhớ về cội nguồn.\n   c. Với đất nước: biết ơn các anh hùng liệt sĩ.\n3. Ý nghĩa: nền tảng đạo đức, gắn kết cộng đồng.\n4. Phê phán: thói vô ơn, quay lưng với cội nguồn.\n5. Bài học: thể hiện bằng hành động cụ thể.\nIII. Kết bài: khẳng định.\n\nĐOẠN MẪU (mở bài):\nDân tộc Việt Nam có một đạo lí đẹp đã trở thành máu thịt: uống nước nhớ nguồn. Đạo lí ấy nhắc nhở mỗi con người phải biết ơn những người đã mang lại cho mình cuộc sống hôm nay — từ ông bà, cha mẹ đến quê hương, đất nước. Như lời bà ngoại dặn trong tùy bút Bữa cơm quê: quê là gốc rễ, đi đâu cũng phải nhớ về. Trong xã hội hiện đại, khi nhiều giá trị có nguy cơ phai nhạt, việc giữ gìn đạo lí uống nước nhớ nguồn càng trở nên cần thiết.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHỮNG NGƯỜI GIỮ BIỂN\n(Kí sự)\n\nTôi ra thăm nhà giàn DK1 vào một ngày biển động. Con tàu chòng chành giữa sóng lớn, phải mất nhiều giờ mới tiếp cận được nhà giàn — những pháo đài thép đứng hiên ngang giữa biển khơi.\n\nĐón tôi là những chiến sĩ hải quân với nụ cười rạng rỡ. Giữa biển khơi mênh mông, thiếu thốn đủ thứ: nước ngọt phải tiết kiệm từng giọt, rau xanh là thứ xa xỉ, sóng điện thoại chập chờn — vậy mà các anh vẫn lạc quan, yêu đời. Anh trung úy trẻ kể: Ở đây, mỗi người đều có hai quê hương — quê nhà và nhà giàn.\n\nTôi được nghe các anh kể về những đêm bão tố, sóng cao hàng chục mét quật vào chân đế; về những lần cứu ngư dân gặp nạn giữa biển khơi; về nỗi nhớ nhà da diết mỗi độ Tết đến. Có anh đã ba năm chưa được về thăm con nhỏ. Nói đến con, mắt anh rưng rưng, nhưng rồi anh cười: Vì bình yên của Tổ quốc, xa con một chút cũng xứng đáng.\n\nTrước lúc chia tay, các anh tặng tôi một lá cờ Tổ quốc đã phai màu vì nắng gió. Anh chính trị viên nói: Lá cờ này đã tung bay trên nhà giàn suốt một năm qua. Tặng em để nhớ về những người lính biển.\n\nTrở về đất liền, tôi mang theo hình ảnh những người lính kiên cường giữa biển khơi và một niềm tin mãnh liệt: với những con người như thế, biển đảo Tổ quốc mãi vững vàng. Họ không chỉ giữ biển bằng súng đạn mà còn bằng trái tim yêu nước nồng nàn.\n\nCâu 1. Nhà giàn DK1 được miêu tả như thế nào?", "options": ["A. Khu nghỉ dưỡng sang trọng", "B. Những pháo đài thép đứng hiên ngang giữa biển khơi", "C. Tàu du lịch", "D. Đảo nổi"], "answer": "B", "explain": "Văn bản miêu tả: nhà giàn DK1 là những pháo đài thép đứng hiên ngang giữa biển khơi — hình ảnh hùng vĩ, thiêng liêng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHỮNG NGƯỜI GIỮ BIỂN\n(Kí sự)\n\nTôi ra thăm nhà giàn DK1 vào một ngày biển động. Con tàu chòng chành giữa sóng lớn, phải mất nhiều giờ mới tiếp cận được nhà giàn — những pháo đài thép đứng hiên ngang giữa biển khơi.\n\nĐón tôi là những chiến sĩ hải quân với nụ cười rạng rỡ. Giữa biển khơi mênh mông, thiếu thốn đủ thứ: nước ngọt phải tiết kiệm từng giọt, rau xanh là thứ xa xỉ, sóng điện thoại chập chờn — vậy mà các anh vẫn lạc quan, yêu đời. Anh trung úy trẻ kể: Ở đây, mỗi người đều có hai quê hương — quê nhà và nhà giàn.\n\nTôi được nghe các anh kể về những đêm bão tố, sóng cao hàng chục mét quật vào chân đế; về những lần cứu ngư dân gặp nạn giữa biển khơi; về nỗi nhớ nhà da diết mỗi độ Tết đến. Có anh đã ba năm chưa được về thăm con nhỏ. Nói đến con, mắt anh rưng rưng, nhưng rồi anh cười: Vì bình yên của Tổ quốc, xa con một chút cũng xứng đáng.\n\nTrước lúc chia tay, các anh tặng tôi một lá cờ Tổ quốc đã phai màu vì nắng gió. Anh chính trị viên nói: Lá cờ này đã tung bay trên nhà giàn suốt một năm qua. Tặng em để nhớ về những người lính biển.\n\nTrở về đất liền, tôi mang theo hình ảnh những người lính kiên cường giữa biển khơi và một niềm tin mãnh liệt: với những con người như thế, biển đảo Tổ quốc mãi vững vàng. Họ không chỉ giữ biển bằng súng đạn mà còn bằng trái tim yêu nước nồng nàn.\n\nCâu 2. Cuộc sống của chiến sĩ trên nhà giàn có những khó khăn gì?", "options": ["A. Đầy đủ tiện nghi", "B. Thiếu nước ngọt, thiếu rau xanh, sóng điện thoại chập chờn; đối mặt bão tố; xa gia đình nhiều năm", "C. Chỉ thiếu giải trí", "D. Không có khó khăn gì"], "answer": "B", "explain": "Văn bản liệt kê cụ thể: nước ngọt tiết kiệm từng giọt, rau xanh xa xỉ, bão tố, nỗi nhớ nhà — cuộc sống gian khổ giữa biển khơi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHỮNG NGƯỜI GIỮ BIỂN\n(Kí sự)\n\nTôi ra thăm nhà giàn DK1 vào một ngày biển động. Con tàu chòng chành giữa sóng lớn, phải mất nhiều giờ mới tiếp cận được nhà giàn — những pháo đài thép đứng hiên ngang giữa biển khơi.\n\nĐón tôi là những chiến sĩ hải quân với nụ cười rạng rỡ. Giữa biển khơi mênh mông, thiếu thốn đủ thứ: nước ngọt phải tiết kiệm từng giọt, rau xanh là thứ xa xỉ, sóng điện thoại chập chờn — vậy mà các anh vẫn lạc quan, yêu đời. Anh trung úy trẻ kể: Ở đây, mỗi người đều có hai quê hương — quê nhà và nhà giàn.\n\nTôi được nghe các anh kể về những đêm bão tố, sóng cao hàng chục mét quật vào chân đế; về những lần cứu ngư dân gặp nạn giữa biển khơi; về nỗi nhớ nhà da diết mỗi độ Tết đến. Có anh đã ba năm chưa được về thăm con nhỏ. Nói đến con, mắt anh rưng rưng, nhưng rồi anh cười: Vì bình yên của Tổ quốc, xa con một chút cũng xứng đáng.\n\nTrước lúc chia tay, các anh tặng tôi một lá cờ Tổ quốc đã phai màu vì nắng gió. Anh chính trị viên nói: Lá cờ này đã tung bay trên nhà giàn suốt một năm qua. Tặng em để nhớ về những người lính biển.\n\nTrở về đất liền, tôi mang theo hình ảnh những người lính kiên cường giữa biển khơi và một niềm tin mãnh liệt: với những con người như thế, biển đảo Tổ quốc mãi vững vàng. Họ không chỉ giữ biển bằng súng đạn mà còn bằng trái tim yêu nước nồng nàn.\n\nCâu 3. Câu nói Mỗi người đều có hai quê hương — quê nhà và nhà giàn có ý nghĩa gì?", "options": ["A. Các anh có hai nhà", "B. Thể hiện tình yêu sâu nặng với biển đảo: nhà giàn đã trở thành quê hương thứ hai, gắn bó máu thịt", "C. Các anh quên quê nhà", "D. Ngẫu nhiên nói"], "answer": "B", "explain": "Câu nói cảm động thể hiện sự gắn bó máu thịt với biển đảo: nhà giàn không chỉ là nơi công tác mà đã thành quê hương — tình yêu Tổ quốc sâu sắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHỮNG NGƯỜI GIỮ BIỂN\n(Kí sự)\n\nTôi ra thăm nhà giàn DK1 vào một ngày biển động. Con tàu chòng chành giữa sóng lớn, phải mất nhiều giờ mới tiếp cận được nhà giàn — những pháo đài thép đứng hiên ngang giữa biển khơi.\n\nĐón tôi là những chiến sĩ hải quân với nụ cười rạng rỡ. Giữa biển khơi mênh mông, thiếu thốn đủ thứ: nước ngọt phải tiết kiệm từng giọt, rau xanh là thứ xa xỉ, sóng điện thoại chập chờn — vậy mà các anh vẫn lạc quan, yêu đời. Anh trung úy trẻ kể: Ở đây, mỗi người đều có hai quê hương — quê nhà và nhà giàn.\n\nTôi được nghe các anh kể về những đêm bão tố, sóng cao hàng chục mét quật vào chân đế; về những lần cứu ngư dân gặp nạn giữa biển khơi; về nỗi nhớ nhà da diết mỗi độ Tết đến. Có anh đã ba năm chưa được về thăm con nhỏ. Nói đến con, mắt anh rưng rưng, nhưng rồi anh cười: Vì bình yên của Tổ quốc, xa con một chút cũng xứng đáng.\n\nTrước lúc chia tay, các anh tặng tôi một lá cờ Tổ quốc đã phai màu vì nắng gió. Anh chính trị viên nói: Lá cờ này đã tung bay trên nhà giàn suốt một năm qua. Tặng em để nhớ về những người lính biển.\n\nTrở về đất liền, tôi mang theo hình ảnh những người lính kiên cường giữa biển khơi và một niềm tin mãnh liệt: với những con người như thế, biển đảo Tổ quốc mãi vững vàng. Họ không chỉ giữ biển bằng súng đạn mà còn bằng trái tim yêu nước nồng nàn.\n\nCâu 4. Chi tiết lá cờ phai màu được tặng có ý nghĩa gì?", "options": ["A. Quà lưu niệm bình thường", "B. Biểu tượng của sự hy sinh thầm lặng, của tình yêu Tổ quốc: lá cờ đã cùng các anh vượt qua nắng gió biển khơi", "C. Cờ cũ cần thay", "D. Không có ý nghĩa"], "answer": "B", "explain": "Lá cờ phai màu vì nắng gió là chứng tích của sự gian khổ, hy sinh; món quà mang ý nghĩa biểu tượng sâu sắc về lòng yêu nước.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHỮNG NGƯỜI GIỮ BIỂN\n(Kí sự)\n\nTôi ra thăm nhà giàn DK1 vào một ngày biển động. Con tàu chòng chành giữa sóng lớn, phải mất nhiều giờ mới tiếp cận được nhà giàn — những pháo đài thép đứng hiên ngang giữa biển khơi.\n\nĐón tôi là những chiến sĩ hải quân với nụ cười rạng rỡ. Giữa biển khơi mênh mông, thiếu thốn đủ thứ: nước ngọt phải tiết kiệm từng giọt, rau xanh là thứ xa xỉ, sóng điện thoại chập chờn — vậy mà các anh vẫn lạc quan, yêu đời. Anh trung úy trẻ kể: Ở đây, mỗi người đều có hai quê hương — quê nhà và nhà giàn.\n\nTôi được nghe các anh kể về những đêm bão tố, sóng cao hàng chục mét quật vào chân đế; về những lần cứu ngư dân gặp nạn giữa biển khơi; về nỗi nhớ nhà da diết mỗi độ Tết đến. Có anh đã ba năm chưa được về thăm con nhỏ. Nói đến con, mắt anh rưng rưng, nhưng rồi anh cười: Vì bình yên của Tổ quốc, xa con một chút cũng xứng đáng.\n\nTrước lúc chia tay, các anh tặng tôi một lá cờ Tổ quốc đã phai màu vì nắng gió. Anh chính trị viên nói: Lá cờ này đã tung bay trên nhà giàn suốt một năm qua. Tặng em để nhớ về những người lính biển.\n\nTrở về đất liền, tôi mang theo hình ảnh những người lính kiên cường giữa biển khơi và một niềm tin mãnh liệt: với những con người như thế, biển đảo Tổ quốc mãi vững vàng. Họ không chỉ giữ biển bằng súng đạn mà còn bằng trái tim yêu nước nồng nàn.\n\nCâu 5. Qua văn bản, em cảm nhận được điều gì về người lính biển? (Trả lời ngắn gọn)", "answer": "Kiên cường, lạc quan, hy sinh thầm lặng vì Tổ quốc", "explain": "Chấp nhận các cách diễn đạt tương đương: yêu nước nồng nàn; vượt khó khăn giữ biển đảo; xứng đáng được kính trọng, biết ơn...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về tình yêu biển đảo Tổ quốc của tuổi trẻ.", "explain": "DÀN Ý:\n1. Mở đoạn: biển đảo là máu thịt của Tổ quốc, tuổi trẻ phải yêu và bảo vệ.\n2. Thân đoạn: (a) Ý nghĩa: biển đảo gắn với chủ quyền, kinh tế, an ninh; (b) Biểu hiện: tìm hiểu về biển đảo, hướng về Trường Sa, tri ân người lính biển như trong kí sự; (c) Phê phán thói vô cảm, thiếu hiểu biết về biển đảo.\n3. Kết đoạn: hãy hành động thiết thực.\n\nBÀI MẪU:\nBiển đảo là máu thịt thiêng liêng của Tổ quốc, và tình yêu biển đảo là một phần không thể thiếu trong tình yêu nước của tuổi trẻ hôm nay. Biển Việt Nam không chỉ giàu tài nguyên, là không gian sinh tồn của dân tộc mà còn gắn liền với chủ quyền quốc gia — mỗi hòn đảo, mỗi nhà giàn như DK1 đều là cột mốc chủ quyền được giữ gìn bằng mồ hôi, xương máu của bao thế hệ. Tình yêu biển đảo của tuổi trẻ thể hiện qua việc tích cực tìm hiểu về biển đảo quê hương; hướng về Trường Sa, Hoàng Sa bằng những việc làm cụ thể: quyên góp ủng hộ, viết thư động viên người lính biển; tri ân sự hy sinh thầm lặng của các anh như trong kí sự Những người giữ biển; và tỉnh táo trước những thông tin sai lệch về chủ quyền. Đáng phê phán là những bạn trẻ vô cảm, thiếu hiểu biết về biển đảo, thậm chí có phát ngôn, hành động ảnh hưởng đến lợi ích quốc gia. Yêu biển đảo không phải là điều gì xa vời — nó bắt đầu từ việc học tốt để mai này góp sức xây dựng, bảo vệ Tổ quốc, từ việc giữ gìn môi trường biển sạch đẹp. Hãy để tình yêu biển đảo trở thành hành động, để xứng đáng với sự hy sinh của những người đang ngày đêm giữ biển.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về trách nhiệm của tuổi trẻ trong việc bảo vệ chủ quyền biển đảo.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — bảo vệ chủ quyền biển đảo là nhiệm vụ thiêng liêng.\nII. Thân bài:\n1. Ý nghĩa của biển đảo: chủ quyền, kinh tế, an ninh quốc gia.\n2. Sự hy sinh của các thế hệ giữ biển (dẫn chứng: chiến sĩ nhà giàn DK1, các anh hùng liệt sĩ).\n3. Trách nhiệm của tuổi trẻ:\n   a. Tìm hiểu, nâng cao nhận thức về biển đảo.\n   b. Hướng về biển đảo bằng việc làm cụ thể (ủng hộ, động viên).\n   c. Học tập tốt để góp sức xây dựng đất nước hùng mạnh.\n   d. Tỉnh táo trước thông tin sai lệch; đấu tranh bảo vệ chủ quyền trên mặt trận tư tưởng.\n   e. Sẵn sàng lên đường khi Tổ quốc cần.\n4. Phê phán: thói vô cảm, thiếu trách nhiệm, phát ngôn sai lệch.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nBiển đảo Việt Nam — với quần đảo Hoàng Sa, Trường Sa, với những nhà giàn DK1 hiên ngang giữa biển khơi — là máu thịt thiêng liêng không thể tách rời của Tổ quốc. Biết bao thế hệ người Việt đã đổ mồ hôi, xương máu để giữ gìn từng tấc biển, tấc đảo. Ngày hôm nay, khi đất nước hòa bình, trách nhiệm bảo vệ chủ quyền biển đảo được trao vào tay thế hệ trẻ chúng ta. Nhận thức đúng trách nhiệm ấy và biến nó thành hành động cụ thể là vấn đề có ý nghĩa sống còn với mỗi người trẻ Việt Nam.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHIÊN CHỢ VÙNG CAO\n(Bút kí)\n\nChợ phiên vùng cao họp vào mỗi sáng chủ nhật. Từ tờ mờ sáng, đồng bào các dân tộc đã gùi hàng xuống chợ: người Mông gùi rau, người Dao gùi thổ cẩm, người Thái gùi xôi nếp... Con đường mòn rộn rã tiếng cười nói, tiếng khèn gọi bạn vang vọng núi rừng.\n\nChợ phiên không chỉ là nơi mua bán mà còn là ngày hội của đồng bào. Người ta đến chợ không chỉ để bán hàng mà còn để gặp gỡ, giao lưu. Các cô gái trong trang phục rực rỡ nhất, các chàng trai thổi khèn, đánh đàn tính. Trẻ em chạy nhảy tung tăng, mắt tròn xoe trước những món đồ chơi sặc sỡ.\n\nTôi ghé vào hàng thổ cẩm của một bà cụ người Dao. Đôi tay bà thoăn thoắt thêu những họa tiết tinh xảo — mỗi họa tiết đều mang một ý nghĩa: hình con chim là khát vọng tự do, hình bông hoa là ước mơ về cuộc sống tươi đẹp. Bà kể, mỗi tấm thổ cẩm phải mất hàng tháng trời mới hoàn thành, nhưng bà vẫn kiên trì vì đó là hồn cốt của dân tộc mình.\n\nĐiều khiến tôi xúc động nhất là tình người ở chợ phiên. Người ta mua bán không mặc cả gay gắt, ai cũng thật thà. Có bà cụ bán rau, thấy tôi là khách lạ, còn dúi thêm cho mớ rau: Ăn đi con, rau nhà trồng đấy, sạch lắm!\n\nChia tay chợ phiên khi nắng đã lên cao, tôi mang theo những tấm thổ cẩm rực rỡ và cả những ấn tượng đẹp về văn hóa, con người vùng cao. Chợ phiên không chỉ là nơi giao thương mà còn là nơi lưu giữ hồn cốt văn hóa của đồng bào các dân tộc — một di sản cần được trân trọng, giữ gìn.\n\nCâu 1. Chợ phiên vùng cao họp vào thời gian nào?", "options": ["A. Mỗi buổi sáng", "B. Mỗi sáng chủ nhật", "C. Mỗi tối", "D. Mỗi tháng một lần"], "answer": "B", "explain": "Văn bản cho biết: chợ phiên vùng cao họp vào mỗi sáng chủ nhật — ngày hội của đồng bào các dân tộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHIÊN CHỢ VÙNG CAO\n(Bút kí)\n\nChợ phiên vùng cao họp vào mỗi sáng chủ nhật. Từ tờ mờ sáng, đồng bào các dân tộc đã gùi hàng xuống chợ: người Mông gùi rau, người Dao gùi thổ cẩm, người Thái gùi xôi nếp... Con đường mòn rộn rã tiếng cười nói, tiếng khèn gọi bạn vang vọng núi rừng.\n\nChợ phiên không chỉ là nơi mua bán mà còn là ngày hội của đồng bào. Người ta đến chợ không chỉ để bán hàng mà còn để gặp gỡ, giao lưu. Các cô gái trong trang phục rực rỡ nhất, các chàng trai thổi khèn, đánh đàn tính. Trẻ em chạy nhảy tung tăng, mắt tròn xoe trước những món đồ chơi sặc sỡ.\n\nTôi ghé vào hàng thổ cẩm của một bà cụ người Dao. Đôi tay bà thoăn thoắt thêu những họa tiết tinh xảo — mỗi họa tiết đều mang một ý nghĩa: hình con chim là khát vọng tự do, hình bông hoa là ước mơ về cuộc sống tươi đẹp. Bà kể, mỗi tấm thổ cẩm phải mất hàng tháng trời mới hoàn thành, nhưng bà vẫn kiên trì vì đó là hồn cốt của dân tộc mình.\n\nĐiều khiến tôi xúc động nhất là tình người ở chợ phiên. Người ta mua bán không mặc cả gay gắt, ai cũng thật thà. Có bà cụ bán rau, thấy tôi là khách lạ, còn dúi thêm cho mớ rau: Ăn đi con, rau nhà trồng đấy, sạch lắm!\n\nChia tay chợ phiên khi nắng đã lên cao, tôi mang theo những tấm thổ cẩm rực rỡ và cả những ấn tượng đẹp về văn hóa, con người vùng cao. Chợ phiên không chỉ là nơi giao thương mà còn là nơi lưu giữ hồn cốt văn hóa của đồng bào các dân tộc — một di sản cần được trân trọng, giữ gìn.\n\nCâu 2. Chợ phiên có ý nghĩa gì ngoài việc mua bán?", "options": ["A. Không có ý nghĩa gì khác", "B. Là ngày hội giao lưu văn hóa: gặp gỡ, múa hát, thể hiện bản sắc dân tộc", "C. Chỉ để ăn uống", "D. Để khoe của"], "answer": "B", "explain": "Văn bản khẳng định: chợ phiên không chỉ là nơi mua bán mà còn là ngày hội — nơi gặp gỡ, giao lưu, thể hiện văn hóa các dân tộc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHIÊN CHỢ VÙNG CAO\n(Bút kí)\n\nChợ phiên vùng cao họp vào mỗi sáng chủ nhật. Từ tờ mờ sáng, đồng bào các dân tộc đã gùi hàng xuống chợ: người Mông gùi rau, người Dao gùi thổ cẩm, người Thái gùi xôi nếp... Con đường mòn rộn rã tiếng cười nói, tiếng khèn gọi bạn vang vọng núi rừng.\n\nChợ phiên không chỉ là nơi mua bán mà còn là ngày hội của đồng bào. Người ta đến chợ không chỉ để bán hàng mà còn để gặp gỡ, giao lưu. Các cô gái trong trang phục rực rỡ nhất, các chàng trai thổi khèn, đánh đàn tính. Trẻ em chạy nhảy tung tăng, mắt tròn xoe trước những món đồ chơi sặc sỡ.\n\nTôi ghé vào hàng thổ cẩm của một bà cụ người Dao. Đôi tay bà thoăn thoắt thêu những họa tiết tinh xảo — mỗi họa tiết đều mang một ý nghĩa: hình con chim là khát vọng tự do, hình bông hoa là ước mơ về cuộc sống tươi đẹp. Bà kể, mỗi tấm thổ cẩm phải mất hàng tháng trời mới hoàn thành, nhưng bà vẫn kiên trì vì đó là hồn cốt của dân tộc mình.\n\nĐiều khiến tôi xúc động nhất là tình người ở chợ phiên. Người ta mua bán không mặc cả gay gắt, ai cũng thật thà. Có bà cụ bán rau, thấy tôi là khách lạ, còn dúi thêm cho mớ rau: Ăn đi con, rau nhà trồng đấy, sạch lắm!\n\nChia tay chợ phiên khi nắng đã lên cao, tôi mang theo những tấm thổ cẩm rực rỡ và cả những ấn tượng đẹp về văn hóa, con người vùng cao. Chợ phiên không chỉ là nơi giao thương mà còn là nơi lưu giữ hồn cốt văn hóa của đồng bào các dân tộc — một di sản cần được trân trọng, giữ gìn.\n\nCâu 3. Chi tiết họa tiết thổ cẩm mang ý nghĩa cho thấy điều gì?", "options": ["A. Người Dao khéo tay", "B. Mỗi sản phẩm thổ cẩm đều chứa đựng tâm hồn, khát vọng và bản sắc văn hóa của dân tộc — là hồn cốt cần giữ gìn", "C. Thổ cẩm đắt tiền", "D. Bà cụ rảnh rỗi"], "answer": "B", "explain": "Họa tiết chim là khát vọng tự do, hoa là ước mơ tươi đẹp — thổ cẩm không chỉ là hàng hóa mà là văn hóa, là hồn cốt dân tộc được thêu dệt bằng tâm huyết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHIÊN CHỢ VÙNG CAO\n(Bút kí)\n\nChợ phiên vùng cao họp vào mỗi sáng chủ nhật. Từ tờ mờ sáng, đồng bào các dân tộc đã gùi hàng xuống chợ: người Mông gùi rau, người Dao gùi thổ cẩm, người Thái gùi xôi nếp... Con đường mòn rộn rã tiếng cười nói, tiếng khèn gọi bạn vang vọng núi rừng.\n\nChợ phiên không chỉ là nơi mua bán mà còn là ngày hội của đồng bào. Người ta đến chợ không chỉ để bán hàng mà còn để gặp gỡ, giao lưu. Các cô gái trong trang phục rực rỡ nhất, các chàng trai thổi khèn, đánh đàn tính. Trẻ em chạy nhảy tung tăng, mắt tròn xoe trước những món đồ chơi sặc sỡ.\n\nTôi ghé vào hàng thổ cẩm của một bà cụ người Dao. Đôi tay bà thoăn thoắt thêu những họa tiết tinh xảo — mỗi họa tiết đều mang một ý nghĩa: hình con chim là khát vọng tự do, hình bông hoa là ước mơ về cuộc sống tươi đẹp. Bà kể, mỗi tấm thổ cẩm phải mất hàng tháng trời mới hoàn thành, nhưng bà vẫn kiên trì vì đó là hồn cốt của dân tộc mình.\n\nĐiều khiến tôi xúc động nhất là tình người ở chợ phiên. Người ta mua bán không mặc cả gay gắt, ai cũng thật thà. Có bà cụ bán rau, thấy tôi là khách lạ, còn dúi thêm cho mớ rau: Ăn đi con, rau nhà trồng đấy, sạch lắm!\n\nChia tay chợ phiên khi nắng đã lên cao, tôi mang theo những tấm thổ cẩm rực rỡ và cả những ấn tượng đẹp về văn hóa, con người vùng cao. Chợ phiên không chỉ là nơi giao thương mà còn là nơi lưu giữ hồn cốt văn hóa của đồng bào các dân tộc — một di sản cần được trân trọng, giữ gìn.\n\nCâu 4. Chi tiết bà cụ dúi thêm mớ rau cho khách lạ cho thấy điều gì?", "options": ["A. Bà cụ bán ế", "B. Tình người chân chất, hiếu khách của đồng bào vùng cao — mua bán thấm đẫm tình nghĩa", "C. Rau rẻ tiền", "D. Bà cụ nhầm"], "answer": "B", "explain": "Hành động dúi thêm rau cho khách lạ thể hiện sự chân chất, hiếu khách — ở chợ phiên, tình người còn quý hơn tiền bạc.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHIÊN CHỢ VÙNG CAO\n(Bút kí)\n\nChợ phiên vùng cao họp vào mỗi sáng chủ nhật. Từ tờ mờ sáng, đồng bào các dân tộc đã gùi hàng xuống chợ: người Mông gùi rau, người Dao gùi thổ cẩm, người Thái gùi xôi nếp... Con đường mòn rộn rã tiếng cười nói, tiếng khèn gọi bạn vang vọng núi rừng.\n\nChợ phiên không chỉ là nơi mua bán mà còn là ngày hội của đồng bào. Người ta đến chợ không chỉ để bán hàng mà còn để gặp gỡ, giao lưu. Các cô gái trong trang phục rực rỡ nhất, các chàng trai thổi khèn, đánh đàn tính. Trẻ em chạy nhảy tung tăng, mắt tròn xoe trước những món đồ chơi sặc sỡ.\n\nTôi ghé vào hàng thổ cẩm của một bà cụ người Dao. Đôi tay bà thoăn thoắt thêu những họa tiết tinh xảo — mỗi họa tiết đều mang một ý nghĩa: hình con chim là khát vọng tự do, hình bông hoa là ước mơ về cuộc sống tươi đẹp. Bà kể, mỗi tấm thổ cẩm phải mất hàng tháng trời mới hoàn thành, nhưng bà vẫn kiên trì vì đó là hồn cốt của dân tộc mình.\n\nĐiều khiến tôi xúc động nhất là tình người ở chợ phiên. Người ta mua bán không mặc cả gay gắt, ai cũng thật thà. Có bà cụ bán rau, thấy tôi là khách lạ, còn dúi thêm cho mớ rau: Ăn đi con, rau nhà trồng đấy, sạch lắm!\n\nChia tay chợ phiên khi nắng đã lên cao, tôi mang theo những tấm thổ cẩm rực rỡ và cả những ấn tượng đẹp về văn hóa, con người vùng cao. Chợ phiên không chỉ là nơi giao thương mà còn là nơi lưu giữ hồn cốt văn hóa của đồng bào các dân tộc — một di sản cần được trân trọng, giữ gìn.\n\nCâu 5. Qua văn bản, em hiểu thêm điều gì về văn hóa các dân tộc? (Trả lời ngắn gọn)", "answer": "Văn hóa các dân tộc đa dạng, đặc sắc, cần được trân trọng giữ gìn", "explain": "Chấp nhận các cách diễn đạt tương đương: mỗi dân tộc có bản sắc riêng; chợ phiên lưu giữ hồn cốt văn hóa...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của việc giữ gìn bản sắc văn hóa các dân tộc.", "explain": "DÀN Ý:\n1. Mở đoạn: Việt Nam có 54 dân tộc với bản sắc văn hóa đa dạng — tài sản vô giá.\n2. Thân đoạn: (a) Ý nghĩa: tạo nên sự phong phú của văn hóa Việt Nam như chợ phiên, thổ cẩm; (b) Nguy cơ mai một; (c) Việc làm: tôn trọng, tìm hiểu, quảng bá; phê phán kì thị, coi thường văn hóa dân tộc khác.\n3. Kết đoạn: đoàn kết trong đa dạng.\n\nBÀI MẪU:\nViệt Nam là đất nước của 54 dân tộc anh em, mỗi dân tộc đều có bản sắc văn hóa riêng độc đáo — đó là tài sản vô giá của dân tộc ta. Từ chợ phiên rực rỡ sắc màu, những tấm thổ cẩm tinh xảo của đồng bào vùng cao đến quan họ, ca trù, cồng chiêng... tất cả tạo nên bức tranh văn hóa Việt Nam đa dạng, phong phú mà thống nhất. Giữ gìn bản sắc văn hóa các dân tộc có ý nghĩa to lớn: nó giữ cho cội nguồn không bị phai nhạt, tạo sức hấp dẫn du lịch, và quan trọng nhất là gắn kết đồng bào các dân tộc trong khối đại đoàn kết. Thế nhưng, đáng lo ngại là nhiều nét văn hóa đang dần mai một trước lối sống hiện đại; không ít bạn trẻ thiếu hiểu biết, thậm chí có thái độ kì thị với văn hóa của dân tộc khác. Mỗi chúng ta cần tôn trọng sự đa dạng văn hóa: tìm hiểu, quảng bá những nét đẹp của các dân tộc; không kì thị, phân biệt; tích cực tham gia bảo tồn. Đoàn kết trong đa dạng — đó là sức mạnh của dân tộc Việt Nam suốt chiều dài lịch sử.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về tinh thần đoàn kết các dân tộc Việt Nam.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — đoàn kết dân tộc là truyền thống quý báu.\nII. Thân bài:\n1. Biểu hiện của tinh thần đoàn kết:\n   a. Trong lịch sử: cùng đánh giặc giữ nước.\n   b. Trong đời sống: đùm bọc nhau lúc khó khăn (như tình người ở chợ phiên).\n   c. Tôn trọng bản sắc văn hóa của nhau.\n2. Ý nghĩa: tạo sức mạnh dân tộc; giữ vững độc lập, phát triển đất nước.\n3. Thực trạng: còn những biểu hiện kì thị, chia rẽ — phê phán.\n4. Trách nhiệm của tuổi trẻ: tôn trọng, tìm hiểu văn hóa các dân tộc; đấu tranh với tư tưởng chia rẽ.\nIII. Kết bài: khẳng định.\n\nĐOẠN MẪU (mở bài):\nDân tộc Việt Nam có một truyền thống quý báu được hun đúc qua hàng nghìn năm lịch sử: tinh thần đoàn kết giữa các dân tộc anh em. Từ những ngày đầu dựng nước, 54 dân tộc đã cùng nhau đánh giặc, cùng nhau xây dựng quê hương. Trong đời sống hôm nay, tinh thần ấy tiếp tục tỏa sáng qua những phiên chợ vùng cao rực rỡ sắc màu đoàn kết, qua những bàn tay nắm lấy nhau mỗi khi đất nước gặp khó khăn. Giữ gìn và phát huy tinh thần đoàn kết các dân tộc là trách nhiệm thiêng liêng của mỗi người Việt Nam, nhất là thế hệ trẻ.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nĐÊM TRÊN BIỂN\n(Bút kí)\n\nTôi có dịp theo tàu ngư dân ra khơi vào một đêm trăng sáng. Biển đêm có một vẻ đẹp huyền ảo mà tôi chưa từng thấy: mặt biển lấp lánh ánh trăng như dát bạc, những con sóng nhẹ nhàng vỗ vào mạn tàu.\n\nCác ngư dân bắt đầu công việc khi màn đêm buông xuống. Họ thả lưới, kéo lưới với những động tác thành thạo, nhịp nhàng. Dưới ánh đèn măng sông, những mẻ cá tươi rói được kéo lên — cá nục, cá cơm, mực... lấp lánh như những mảnh bạc sống động.\n\nBác Tư — chủ tàu — kể cho tôi nghe về cuộc đời ngư dân. Nghề biển vất vả, hiểm nguy: có những chuyến ra khơi gặp bão tố, có những đêm trắng tay vì không có cá. Nhưng ngư dân vẫn bám biển, bởi biển là nhà, là nguồn sống, là máu thịt. Bác nói: Bỏ biển mà vào bờ thì nhớ biển không chịu được. Biển cho ta cá tôm, ta phải biết ơn biển.\n\nĐiều khiến tôi khâm phục nhất là tinh thần đoàn kết của ngư dân. Khi một tàu gặp nạn, các tàu khác không ngần ngại đến cứu giúp dù đang ở xa. Họ còn là những cột mốc sống khẳng định chủ quyền biển đảo của Tổ quốc — mỗi con tàu ra khơi đều mang theo lá cờ đỏ sao vàng.\n\nTrở về bờ khi trời hửng sáng, tôi mang theo hương vị mặn mòi của biển và những suy nghĩ về cuộc đời ngư dân: vất vả mà kiên cường, bình dị mà cao đẹp. Họ không chỉ đánh bắt hải sản mà còn đang ngày đêm góp phần giữ gìn biển đảo quê hương.\n\nCâu 1. Vẻ đẹp của biển đêm được miêu tả như thế nào?", "options": ["A. Đen kịt, đáng sợ", "B. Huyền ảo: mặt biển lấp lánh ánh trăng như dát bạc, sóng nhẹ vỗ mạn tàu", "C. Bình thường", "D. Ồn ào"], "answer": "B", "explain": "Văn bản miêu tả: biển đêm lấp lánh ánh trăng như dát bạc, sóng nhẹ nhàng — vẻ đẹp huyền ảo, thơ mộng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nĐÊM TRÊN BIỂN\n(Bút kí)\n\nTôi có dịp theo tàu ngư dân ra khơi vào một đêm trăng sáng. Biển đêm có một vẻ đẹp huyền ảo mà tôi chưa từng thấy: mặt biển lấp lánh ánh trăng như dát bạc, những con sóng nhẹ nhàng vỗ vào mạn tàu.\n\nCác ngư dân bắt đầu công việc khi màn đêm buông xuống. Họ thả lưới, kéo lưới với những động tác thành thạo, nhịp nhàng. Dưới ánh đèn măng sông, những mẻ cá tươi rói được kéo lên — cá nục, cá cơm, mực... lấp lánh như những mảnh bạc sống động.\n\nBác Tư — chủ tàu — kể cho tôi nghe về cuộc đời ngư dân. Nghề biển vất vả, hiểm nguy: có những chuyến ra khơi gặp bão tố, có những đêm trắng tay vì không có cá. Nhưng ngư dân vẫn bám biển, bởi biển là nhà, là nguồn sống, là máu thịt. Bác nói: Bỏ biển mà vào bờ thì nhớ biển không chịu được. Biển cho ta cá tôm, ta phải biết ơn biển.\n\nĐiều khiến tôi khâm phục nhất là tinh thần đoàn kết của ngư dân. Khi một tàu gặp nạn, các tàu khác không ngần ngại đến cứu giúp dù đang ở xa. Họ còn là những cột mốc sống khẳng định chủ quyền biển đảo của Tổ quốc — mỗi con tàu ra khơi đều mang theo lá cờ đỏ sao vàng.\n\nTrở về bờ khi trời hửng sáng, tôi mang theo hương vị mặn mòi của biển và những suy nghĩ về cuộc đời ngư dân: vất vả mà kiên cường, bình dị mà cao đẹp. Họ không chỉ đánh bắt hải sản mà còn đang ngày đêm góp phần giữ gìn biển đảo quê hương.\n\nCâu 2. Vì sao ngư dân vẫn bám biển dù vất vả, hiểm nguy?", "options": ["A. Vì ham tiền", "B. Vì biển là nhà, là nguồn sống, là máu thịt — tình yêu biển sâu nặng", "C. Vì không biết làm nghề khác", "D. Vì bị ép buộc"], "answer": "B", "explain": "Lời bác Tư: \"Biển cho ta cá tôm, ta phải biết ơn biển\" — ngư dân coi biển là nhà, là máu thịt, gắn bó sâu nặng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nĐÊM TRÊN BIỂN\n(Bút kí)\n\nTôi có dịp theo tàu ngư dân ra khơi vào một đêm trăng sáng. Biển đêm có một vẻ đẹp huyền ảo mà tôi chưa từng thấy: mặt biển lấp lánh ánh trăng như dát bạc, những con sóng nhẹ nhàng vỗ vào mạn tàu.\n\nCác ngư dân bắt đầu công việc khi màn đêm buông xuống. Họ thả lưới, kéo lưới với những động tác thành thạo, nhịp nhàng. Dưới ánh đèn măng sông, những mẻ cá tươi rói được kéo lên — cá nục, cá cơm, mực... lấp lánh như những mảnh bạc sống động.\n\nBác Tư — chủ tàu — kể cho tôi nghe về cuộc đời ngư dân. Nghề biển vất vả, hiểm nguy: có những chuyến ra khơi gặp bão tố, có những đêm trắng tay vì không có cá. Nhưng ngư dân vẫn bám biển, bởi biển là nhà, là nguồn sống, là máu thịt. Bác nói: Bỏ biển mà vào bờ thì nhớ biển không chịu được. Biển cho ta cá tôm, ta phải biết ơn biển.\n\nĐiều khiến tôi khâm phục nhất là tinh thần đoàn kết của ngư dân. Khi một tàu gặp nạn, các tàu khác không ngần ngại đến cứu giúp dù đang ở xa. Họ còn là những cột mốc sống khẳng định chủ quyền biển đảo của Tổ quốc — mỗi con tàu ra khơi đều mang theo lá cờ đỏ sao vàng.\n\nTrở về bờ khi trời hửng sáng, tôi mang theo hương vị mặn mòi của biển và những suy nghĩ về cuộc đời ngư dân: vất vả mà kiên cường, bình dị mà cao đẹp. Họ không chỉ đánh bắt hải sản mà còn đang ngày đêm góp phần giữ gìn biển đảo quê hương.\n\nCâu 3. Ngư dân còn có vai trò gì ngoài việc đánh bắt hải sản?", "options": ["A. Không có vai trò gì khác", "B. Là những cột mốc sống khẳng định chủ quyền biển đảo — mỗi tàu ra khơi đều mang cờ Tổ quốc", "C. Chỉ để du lịch", "D. Buôn bán"], "answer": "B", "explain": "Văn bản khẳng định: ngư dân là cột mốc sống khẳng định chủ quyền biển đảo — vai trò thiêng liêng ngoài kinh tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nĐÊM TRÊN BIỂN\n(Bút kí)\n\nTôi có dịp theo tàu ngư dân ra khơi vào một đêm trăng sáng. Biển đêm có một vẻ đẹp huyền ảo mà tôi chưa từng thấy: mặt biển lấp lánh ánh trăng như dát bạc, những con sóng nhẹ nhàng vỗ vào mạn tàu.\n\nCác ngư dân bắt đầu công việc khi màn đêm buông xuống. Họ thả lưới, kéo lưới với những động tác thành thạo, nhịp nhàng. Dưới ánh đèn măng sông, những mẻ cá tươi rói được kéo lên — cá nục, cá cơm, mực... lấp lánh như những mảnh bạc sống động.\n\nBác Tư — chủ tàu — kể cho tôi nghe về cuộc đời ngư dân. Nghề biển vất vả, hiểm nguy: có những chuyến ra khơi gặp bão tố, có những đêm trắng tay vì không có cá. Nhưng ngư dân vẫn bám biển, bởi biển là nhà, là nguồn sống, là máu thịt. Bác nói: Bỏ biển mà vào bờ thì nhớ biển không chịu được. Biển cho ta cá tôm, ta phải biết ơn biển.\n\nĐiều khiến tôi khâm phục nhất là tinh thần đoàn kết của ngư dân. Khi một tàu gặp nạn, các tàu khác không ngần ngại đến cứu giúp dù đang ở xa. Họ còn là những cột mốc sống khẳng định chủ quyền biển đảo của Tổ quốc — mỗi con tàu ra khơi đều mang theo lá cờ đỏ sao vàng.\n\nTrở về bờ khi trời hửng sáng, tôi mang theo hương vị mặn mòi của biển và những suy nghĩ về cuộc đời ngư dân: vất vả mà kiên cường, bình dị mà cao đẹp. Họ không chỉ đánh bắt hải sản mà còn đang ngày đêm góp phần giữ gìn biển đảo quê hương.\n\nCâu 4. Tinh thần đáng quý nhất của ngư dân được nêu trong văn bản là gì?", "options": ["A. Giỏi đánh cá", "B. Đoàn kết, sẵn sàng cứu giúp nhau khi gặp nạn dù ở xa — tình đồng nghiệp, tình người cao đẹp", "C. Chịu khó", "D. Tiết kiệm"], "answer": "B", "explain": "Khi một tàu gặp nạn, các tàu khác không ngần ngại đến cứu — tinh thần đoàn kết, tương trợ là nét đẹp đáng quý nhất.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nĐÊM TRÊN BIỂN\n(Bút kí)\n\nTôi có dịp theo tàu ngư dân ra khơi vào một đêm trăng sáng. Biển đêm có một vẻ đẹp huyền ảo mà tôi chưa từng thấy: mặt biển lấp lánh ánh trăng như dát bạc, những con sóng nhẹ nhàng vỗ vào mạn tàu.\n\nCác ngư dân bắt đầu công việc khi màn đêm buông xuống. Họ thả lưới, kéo lưới với những động tác thành thạo, nhịp nhàng. Dưới ánh đèn măng sông, những mẻ cá tươi rói được kéo lên — cá nục, cá cơm, mực... lấp lánh như những mảnh bạc sống động.\n\nBác Tư — chủ tàu — kể cho tôi nghe về cuộc đời ngư dân. Nghề biển vất vả, hiểm nguy: có những chuyến ra khơi gặp bão tố, có những đêm trắng tay vì không có cá. Nhưng ngư dân vẫn bám biển, bởi biển là nhà, là nguồn sống, là máu thịt. Bác nói: Bỏ biển mà vào bờ thì nhớ biển không chịu được. Biển cho ta cá tôm, ta phải biết ơn biển.\n\nĐiều khiến tôi khâm phục nhất là tinh thần đoàn kết của ngư dân. Khi một tàu gặp nạn, các tàu khác không ngần ngại đến cứu giúp dù đang ở xa. Họ còn là những cột mốc sống khẳng định chủ quyền biển đảo của Tổ quốc — mỗi con tàu ra khơi đều mang theo lá cờ đỏ sao vàng.\n\nTrở về bờ khi trời hửng sáng, tôi mang theo hương vị mặn mòi của biển và những suy nghĩ về cuộc đời ngư dân: vất vả mà kiên cường, bình dị mà cao đẹp. Họ không chỉ đánh bắt hải sản mà còn đang ngày đêm góp phần giữ gìn biển đảo quê hương.\n\nCâu 5. Qua văn bản, em cảm nhận được điều gì về người ngư dân? (Trả lời ngắn gọn)", "answer": "Vất vả mà kiên cường, bình dị mà cao đẹp; vừa mưu sinh vừa giữ biển", "explain": "Chấp nhận các cách diễn đạt tương đương: yêu biển, đoàn kết, góp phần bảo vệ chủ quyền...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vẻ đẹp của người lao động trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: quanh ta có biết bao người lao động bình dị mà cao đẹp.\n2. Thân đoạn: (a) Vẻ đẹp: cần cù, kiên cường, giàu tình người như ngư dân bám biển; (b) Họ góp phần xây dựng đất nước bằng mồ hôi; (c) Phê phán thói lười biếng, coi thường lao động.\n3. Kết đoạn: biết trân trọng người lao động.\n\nBÀI MẪU:\nTrong cuộc sống, có biết bao người lao động bình dị mà cao đẹp — như những ngư dân ngày đêm bám biển trong bút kí. Vẻ đẹp của họ trước hết ở đức tính cần cù, kiên cường: không quản vất vả, hiểm nguy, vẫn miệt mài lao động để nuôi sống gia đình và góp phần vào sự phát triển của đất nước. Vẻ đẹp còn ở tình người: sẵn sàng giúp đỡ đồng nghiệp khi gặp nạn, đoàn kết vượt qua khó khăn. Và với ngư dân, vẻ đẹp còn ở vai trò thiêng liêng: mỗi con tàu ra khơi đều là một cột mốc sống khẳng định chủ quyền biển đảo. Chính những con người lao động thầm lặng ấy đang ngày ngày dệt nên cuộc sống: người nông dân làm ra hạt gạo, công nhân làm ra sản phẩm, thầy cô ươm mầm tri thức. Đáng phê phán là những kẻ lười biếng, chỉ biết hưởng thụ thành quả của người khác, hoặc coi thường lao động chân tay. Mỗi chúng ta hãy biết trân trọng người lao động bằng thái độ đúng đắn: không lãng phí thành quả lao động, đối xử công bằng và biết ơn những đóng góp thầm lặng của họ — bởi chính họ đang làm cho cuộc đời này tốt đẹp hơn mỗi ngày.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về ý nghĩa của lao động trong cuộc sống con người.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — lao động là vinh quang, là nguồn gốc mọi giá trị.\nII. Thân bài:\n1. Vai trò của lao động:\n   a. Tạo ra của cải vật chất nuôi sống con người.\n   b. Giúp con người trưởng thành, khẳng định giá trị bản thân.\n   c. Góp phần xây dựng xã hội (như ngư dân vừa mưu sinh vừa giữ biển).\n2. Vẻ đẹp của người lao động: cần cù, sáng tạo, đoàn kết.\n3. Phê phán: thói lười biếng, ỷ lại, coi thường lao động.\n4. Bài học: với học sinh, học tập là lao động; cần rèn tính cần cù từ nhỏ.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nLao động là hoạt động đặc trưng của con người, là nguồn gốc tạo ra mọi của cải vật chất và giá trị tinh thần cho xã hội. Từ người nông dân một nắng hai sương, người công nhân miệt mài bên máy móc đến ngư dân kiên cường bám biển — mỗi người lao động đều đang góp phần dệt nên bức tranh cuộc sống. Hiểu đúng ý nghĩa của lao động để có thái độ đúng đắn với nó là điều cần thiết với mỗi chúng ta, nhất là thế hệ trẻ.", "points": 0}]}]}
