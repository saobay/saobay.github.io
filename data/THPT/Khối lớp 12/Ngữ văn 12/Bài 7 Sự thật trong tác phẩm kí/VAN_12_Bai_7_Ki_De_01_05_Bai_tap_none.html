{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMỘT NGÀY Ở CHỢ NỔI\n(Bút kí)\n\nTôi đến chợ nổi Cái Răng khi trời còn chưa sáng hẳn. Sương giăng mờ trên mặt sông, những chiếc ghe, xuồng đã tấp nập ngược xuôi. Tiếng máy nổ, tiếng rao hàng, tiếng cười nói hòa vào nhau thành một bản nhạc rộn ràng của buổi sớm miền Tây.\n\nĐiều đầu tiên khiến tôi ấn tượng là cây bẹo — chiếc sào tre dựng đứng trên mũi ghe, treo lủng lẳng những nông sản: dừa, xoài, dứa, rau củ... Người bán không cần rao nhiều, chỉ cần nhìn cây bẹo là biết ghe bán gì. Một cách quảng cáo mộc mạc mà hiệu quả, chỉ có ở chợ nổi.\n\nTôi ghé vào ghe của cô Hai bán hủ tiếu. Cô thoăn thoắt trụng bánh, chan nước lèo, tay không ngừng nghỉ mà miệng vẫn cười tươi rói: Ăn đi con, hủ tiếu ghe của cô ngon nhất chợ này đấy! Tô hủ tiếu nóng hổi giữa sông nước mênh mông có một hương vị đặc biệt mà tôi chưa từng nếm ở đâu.\n\nCàng về trưa, chợ càng đông. Những ghe trái cây chất đầy ắp, những xuồng hàng rong len lỏi. Tôi thấy những em bé ngồi trên ghe, vừa ăn sáng vừa nhìn dòng người qua lại với ánh mắt hồn nhiên. Cuộc sống sông nước vất vả mà sao thấy ấm áp lạ thường.\n\nChia tay chợ nổi khi nắng đã lên cao, tôi mang theo không chỉ những món quà quê mà còn cả những ấn tượng khó quên về một nét văn hóa độc đáo của miền Tây. Giữa thời đại siêu thị, trung tâm thương mại mọc lên khắp nơi, chợ nổi vẫn tồn tại như một minh chứng cho sức sống bền bỉ của văn hóa truyền thống.\n\nCâu 1. Văn bản trên thuộc thể kí nào?", "options": ["A. Hồi kí", "B. Bút kí — ghi chép những điều mắt thấy tai nghe trong chuyến đi chợ nổi", "C. Truyện ngắn", "D. Thơ"], "answer": "B", "explain": "Tác giả trực tiếp đến chợ nổi, ghi chép những điều mắt thấy tai nghe (cây bẹo, ghe hủ tiếu, không khí chợ) — đó là bút kí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMỘT NGÀY Ở CH ổ, tiếng rao hàng, tiếng cười nói hòa vào nhau thành một bản nhạc rộn ràng của buổi sớm miền Tây.\n\nĐiều đầu tiên khiến tôi ấn tượng là cây bẹo — chiếc sào tre dựng đứng trên mũi ghe, treo lủng lẳng những nông sản: dừa, xoài, dứa, rau củ... Người bán không cần rao nhiều, chỉ cần nhìn cây bẹo là biết ghe bán gì. Một cách quảng cáo mộc mạc mà hiệu quả, chỉ có ở chợ nổi.\n\nTôi ghé vào ghe của cô Hai bán hủ tiếu. Cô thoăn thoắt trụng bánh, chan nước lèo, tay không ngừng nghỉ mà miệng vẫn cười tươi rói: Ăn đi con, hủ tiếu ghe của cô ngon nhất chợ này đấy! Tô hủ tiếu nóng hổi giữa sông nước mênh mông có một hương vị đặc biệt mà tôi chưa từng nếm ở đâu.\n\nCàng về trưa, chợ càng đông. Những ghe trái cây chất đầy ắp, những xuồng hàng rong len lỏi. Tôi thấy những em bé ngồi trên ghe, vừa ăn sáng vừa nhìn dòng người qua lại với ánh mắt hồn nhiên. Cuộc sống sông nước vất vả mà sao thấy ấm áp lạ thường.\n\nChia tay chợ nổi khi nắng đã lên cao, tôi mang theo không chỉ những món quà quê mà còn cả những ấn tượng khó quên về một nét văn hóa độc đáo của miền Tây. Giữa thời đại siêu thị, trung tâm thương mại mọc lên khắp nơi, chợ nổi vẫn tồn tại như một minh chứng cho sức sống bền bỉ của văn hóa truyền thống.\n\nCâu 4. Giá trị của chợ nổi được tác giả khẳng định ở cuối văn bản là gì?", "options": ["A. Nơi mua bán rẻ", "B. Nét văn hóa độc đáo, minh chứng cho sức sống bền bỉ của văn hóa truyền thống giữa thời hiện đại", "C. Điểm du lịch kiếm tiền", "D. Nơi ăn uống ngon"], "answer": "B", "explain": "Câu kết khái quát: giữa thời siêu thị, chợ nổi vẫn tồn tại như minh chứng cho sức sống bền bỉ của văn hóa truyền thống — cái nhìn trân trọng, có chiều sâu.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMỘT NGÀY Ở CHỢ NỔI\n(Bút kí)\n\nTôi đến chợ nổi Cái Răng khi trời còn chưa sáng hẳn. Sương giăng mờ trên mặt sông, những chiếc ghe, xuồng đã tấp nập ngược xuôi. Tiếng máy nổ, tiếng rao hàng, tiếng cười nói hòa vào nhau thành một bản nhạc rộn ràng của buổi sớm miền Tây.\n\nĐiều đầu tiên khiến tôi ấn tượng là cây bẹo — chiếc sào tre dựng đứng trên mũi ghe, treo lủng lẳng những nông sản: dừa, xoài, dứa, rau củ... Người bán không cần rao nhiều, chỉ cần nhìn cây bẹo là biết ghe bán gì. Một cách quảng cáo mộc mạc mà hiệu quả, chỉ có ở chợ nổi.\n\nTôi ghé vào ghe của cô Hai bán hủ tiếu. Cô thoăn thoắt trụng bánh, chan nước lèo, tay không ngừng nghỉ mà miệng vẫn cười tươi rói: Ăn đi con, hủ tiếu ghe của cô ngon nhất chợ này đấy! Tô hủ tiếu nóng hổi giữa sông nước mênh mông có một hương vị đặc biệt mà tôi chưa từng nếm ở đâu.\n\nCàng về trưa, chợ càng đông. Những ghe trái cây chất đầy ắp, những xuồng hàng rong len lỏi. Tôi thấy những em bé ngồi trên ghe, vừa ăn sáng vừa nhìn dòng người qua lại với ánh mắt hồn nhiên. Cuộc sống sông nước vất vả mà sao thấy ấm áp lạ thường.\n\nChia tay chợ nổi khi nắng đã lên cao, tôi mang theo không chỉ những món quà quê mà còn cả những ấn tượng khó quên về một nét văn hóa độc đáo của miền Tây. Giữa thời đại siêu thị, trung tâm thương mại mọc lên khắp nơi, chợ nổi vẫn tồn tại như một minh chứng cho sức sống bền bỉ của văn hóa truyền thống.\n\nCâu 5. Qua văn bản, em hiểu thêm điều gì về việc giữ gìn bản sắc văn hóa? (Trả lời ngắn gọn)", "answer": "Cần trân trọng, giữ gìn những nét văn hóa truyền thống độc đáo", "explain": "Chấp nhận các cách diễn đạt tương đương: phát huy giá trị văn hóa dân tộc; không để mai một trước hiện đại hóa...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của việc giữ gìn bản sắc văn hóa dân tộc.", "explain": "DÀN Ý:\n1. Mở đoạn: bản sắc văn hóa là hồn cốt của dân tộc.\n2. Thân đoạn: (a) Ý nghĩa: tạo nên sự khác biệt, niềm tự hào; là nền tảng tinh thần như chợ nổi với người miền Tây; (b) Nguy cơ mai một trước hội nhập; (c) Phê phán thói sính ngoại, quay lưng với truyền thống.\n3. Kết đoạn: mỗi người có trách nhiệm giữ gìn.\n\nBÀI MẪU:\nBản sắc văn hóa là hồn cốt, là dấu ấn riêng làm nên sự khác biệt và niềm tự hào của mỗi dân tộc. Những nét văn hóa truyền thống như chợ nổi Cái Răng, áo dài, quan họ, cồng chiêng... không chỉ là di sản mà còn là nền tảng tinh thần, là sợi dây gắn kết cộng đồng qua bao thế hệ. Giữ gìn bản sắc văn hóa có ý nghĩa vô cùng quan trọng trong thời đại hội nhập: nó giúp dân tộc ta không bị hòa tan, giữ được cái riêng giữa dòng chảy toàn cầu hóa; đồng thời là nguồn lực để phát triển du lịch, kinh tế. Thế nhưng, đáng lo ngại là nhiều giá trị truyền thống đang dần mai một: giới trẻ sính ngoại, quay lưng với văn hóa dân tộc; nhiều lễ hội bị thương mại hóa, biến tướng. Giữ gìn bản sắc không có nghĩa là bảo thủ, khép kín mà là biết chắt lọc tinh hoa, phát huy giá trị tốt đẹp trong đời sống hiện đại. Mỗi chúng ta, nhất là tuổi trẻ, hãy tự hào về văn hóa dân tộc, tích cực tìm hiểu, quảng bá và có ý thức bảo vệ những di sản quý giá mà cha ông để lại — bởi mất văn hóa là mất tất cả.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về cách ứng xử có văn hóa của tuổi trẻ nơi công cộng.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — ứng xử nơi công cộng là thước đo văn minh.\nII. Thân bài:\n1. Giải thích: ứng xử nơi công cộng là cách hành xử ở những nơi đông người.\n2. Những biểu hiện đẹp: xếp hàng, giữ trật tự, không xả rác, nhường ghế cho người già, nói năng lịch sự.\n3. Thực trạng đáng buồn: chen lấn, xả rác, ồn ào, vô cảm — dẫn chứng cụ thể.\n4. Nguyên nhân: ý thức kém, thiếu giáo dục, tâm lí đám đông.\n5. Giải pháp: giáo dục từ gia đình, nhà trường; nêu gương; xử phạt nghiêm; bản thân tự rèn luyện.\n6. Phê phán những hành vi thiếu văn hóa.\nIII. Kết bài: khẳng định; nhắn nhủ tuổi trẻ hãy là những công dân văn minh.\n\nĐOẠN MẪU (mở bài):\nCách ứng xử nơi công cộng là tấm gương phản chiếu văn hóa của mỗi con người và của cả cộng đồng. Một xã hội văn minh không chỉ được đánh giá qua những tòa nhà cao tầng mà còn qua cách người dân xếp hàng, giữ gìn vệ sinh chung, nhường nhịn nhau trong sinh hoạt hằng ngày. Thế nhưng, đáng buồn là hiện nay vẫn còn không ít hành vi thiếu văn hóa nơi công cộng, trong đó có cả một bộ phận giới trẻ. Bàn về cách ứng xử có văn hóa của tuổi trẻ nơi công cộng vì vậy là vấn đề thiết thực, cần được quan tâm.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHĂM LẠI TRƯỜNG XƯA\n(Hồi kí)\n\nHai mươi năm sau ngày ra trường, tôi mới có dịp trở lại thăm mái trường cấp ba thân yêu. Con đường đến trường giờ đã được trải nhựa phẳng lì, khác hẳn con đường đất đỏ lầy lội ngày xưa mỗi khi mưa xuống.\n\nCổng trường vẫn ở đó, nhưng khang trang hơn nhiều. Hàng phượng vĩ ngày xưa chúng tôi hay ngồi ôn bài giờ đã cao lớn, tán lá xum xuê. Tôi đứng lặng dưới gốc phượng, bao kỉ niệm ùa về: những buổi chào cờ đầu tuần, những giờ ra chơi rộn rã, những lần bị thầy chủ nhiệm phạt vì đi học muộn...\n\nTôi gặp lại thầy Hùng — thầy giáo chủ nhiệm năm xưa, giờ đã ngoài sáu mươi, tóc bạc trắng. Thầy vẫn nhận ra tôi ngay: Em là... thằng bé hay ngủ gật trong giờ văn phải không? Cả hai thầy trò cùng cười vang. Thầy kể về những đổi thay của trường, về các thế hệ học trò đã trưởng thành.\n\nĐi dọc hành lang, tôi ghé vào lớp học cũ. Bàn ghế đã được thay mới, bảng đen thành bảng trắng, nhưng không khí thân thương vẫn vẹn nguyên. Tôi như thấy lại hình ảnh mình ngày xưa: cậu học trò gầy gò, say sưa chép bài, thỉnh thoảng lén nhìn qua cửa sổ ngắm mây trôi.\n\nChia tay thầy, tôi ra về với lòng đầy xúc động. Hai mươi năm, mái trường đã thay đổi nhiều, thầy cô đã già đi, nhưng tình cảm thầy trò, tình bạn bè thì vẫn vẹn nguyên như ngày nào. Tôi thầm cảm ơn mái trường, cảm ơn thầy cô đã cho tôi những năm tháng tươi đẹp nhất của tuổi trẻ — hành trang quý giá theo tôi suốt cuộc đời.\n\nCâu 1. Văn bản trên thuộc thể kí nào?", "options": ["A. Bút kí", "B. Hồi kí — nhớ lại, kể lại chuyện đã qua (hai mươi năm sau ngày ra trường)", "C. Phóng sự", "D. Nhật kí"], "answer": "B", "explain": "Tác giả nhớ lại chuyến thăm trường sau hai mươi năm, kể lại những kỉ niệm xưa — đó là hồi kí, giàu tính chiêm nghiệm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHĂM LẠI TRƯỜNG XƯA\n(Hồi kí)\n\nHai mươi năm sau ngày ra trường, tôi mới có dịp trở lại thăm mái trường cấp ba thân yêu. Con đường đến trường giờ đã được trải nhựa phẳng lì, khác hẳn con đường đất đỏ lầy lội ngày xưa mỗi khi mưa xuống.\n\nCổng trường vẫn ở đó, nhưng khang trang hơn nhiều. Hàng phượng vĩ ngày xưa chúng tôi hay ngồi ôn bài giờ đã cao lớn, tán lá xum xuê. Tôi đứng lặng dưới gốc phượng, bao kỉ niệm ùa về: những buổi chào cờ đầu tuần, những giờ ra chơi rộn rã, những lần bị thầy chủ nhiệm phạt vì đi học muộn...\n\nTôi gặp lại thầy Hùng — thầy giáo chủ nhiệm năm xưa, giờ đã ngoài sáu mươi, tóc bạc trắng. Thầy vẫn nhận ra tôi ngay: Em là... thằng bé hay ngủ gật trong giờ văn phải không? Cả hai thầy trò cùng cười vang. Thầy kể về những đổi thay của trường, về các thế hệ học trò đã trưởng thành.\n\nĐi dọc hành lang, tôi ghé vào lớp học cũ. Bàn ghế đã được thay mới, bảng đen thành bảng trắng, nhưng không khí thân thương vẫn vẹn nguyên. Tôi như thấy lại hình ảnh mình ngày xưa: cậu học trò gầy gò, say sưa chép bài, thỉnh thoảng lén nhìn qua cửa sổ ngắm mây trôi.\n\nChia tay thầy, tôi ra về với lòng đầy xúc động. Hai mươi năm, mái trường đã thay đổi nhiều, thầy cô đã già đi, nhưng tình cảm thầy trò, tình bạn bè thì vẫn vẹn nguyên như ngày nào. Tôi thầm cảm ơn mái trường, cảm ơn thầy cô đã cho tôi những năm tháng tươi đẹp nhất của tuổi trẻ — hành trang quý giá theo tôi suốt cuộc đời.\n\nCâu 2. Sau hai mươi năm, mái trường có những thay đổi gì?", "options": ["A. Không thay đổi gì", "B. Đường được trải nhựa, cổng trường khang trang hơn, bàn ghế mới, bảng trắng thay bảng đen; hàng phượng cao lớn hơn", "C. Trường bị bỏ hoang", "D. Chuyển đi nơi khác"], "answer": "B", "explain": "Văn bản liệt kê cụ thể những đổi thay: đường nhựa thay đường đất, cổng khang trang, bàn ghế mới, bảng trắng — sự phát triển của nhà trường sau hai mươi năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHĂM LẠI TRƯỜNG XƯA\n(Hồi kí)\n\nHai mươi năm sau ngày ra trường, tôi mới có dịp trở lại thăm mái trường cấp ba thân yêu. Con đường đến trường giờ đã được trải nhựa phẳng lì, khác hẳn con đường đất đỏ lầy lội ngày xưa mỗi khi mưa xuống.\n\nCổng trường vẫn ở đó, nhưng khang trang hơn nhiều. Hàng phượng vĩ ngày xưa chúng tôi hay ngồi ôn bài giờ đã cao lớn, tán lá xum xuê. Tôi đứng lặng dưới gốc phượng, bao kỉ niệm ùa về: những buổi chào cờ đầu tuần, những giờ ra chơi rộn rã, những lần bị thầy chủ nhiệm phạt vì đi học muộn...\n\nTôi gặp lại thầy Hùng — thầy giáo chủ nhiệm năm xưa, giờ đã ngoài sáu mươi, tóc bạc trắng. Thầy vẫn nhận ra tôi ngay: Em là... thằng bé hay ngủ gật trong giờ văn phải không? Cả hai thầy trò cùng cười vang. Thầy kể về những đổi thay của trường, về các thế hệ học trò đã trưởng thành.\n\nĐi dọc hành lang, tôi ghé vào lớp học cũ. Bàn ghế đã được thay mới, bảng đen thành bảng trắng, nhưng không khí thân thương vẫn vẹn nguyên. Tôi như thấy lại hình ảnh mình ngày xưa: cậu học trò gầy gò, say sưa chép bài, thỉnh thoảng lén nhìn qua cửa sổ ngắm mây trôi.\n\nChia tay thầy, tôi ra về với lòng đầy xúc động. Hai mươi năm, mái trường đã thay đổi nhiều, thầy cô đã già đi, nhưng tình cảm thầy trò, tình bạn bè thì vẫn vẹn nguyên như ngày nào. Tôi thầm cảm ơn mái trường, cảm ơn thầy cô đã cho tôi những năm tháng tươi đẹp nhất của tuổi trẻ — hành trang quý giá theo tôi suốt cuộc đời.\n\nCâu 3. Chi tiết thầy Hùng vẫn nhận ra học trò cũ sau hai mươi năm cho thấy điều gì?", "options": ["A. Trí nhớ thầy tốt", "B. Tình cảm thầy trò sâu nặng: thầy luôn nhớ về từng học trò, dù thời gian có trôi qua", "C. Học trò không thay đổi", "D. Trường ít học sinh"], "answer": "B", "explain": "Thầy nhận ra ngay \"thằng bé hay ngủ gật trong giờ văn\" — chi tiết cảm động cho thấy tình thầy trò sâu nặng, thầy luôn khắc ghi từng học trò trong tim.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHĂM LẠI TRƯỜNG XƯA\n(Hồi kí)\n\nHai mươi năm sau ngày ra trường, tôi mới có dịp trở lại thăm mái trường cấp ba thân yêu. Con đường đến trường giờ đã được trải nhựa phẳng lì, khác hẳn con đường đất đỏ lầy lội ngày xưa mỗi khi mưa xuống.\n\nCổng trường vẫn ở đó, nhưng khang trang hơn nhiều. Hàng phượng vĩ ngày xưa chúng tôi hay ngồi ôn bài giờ đã cao lớn, tán lá xum xuê. Tôi đứng lặng dưới gốc phượng, bao kỉ niệm ùa về: những buổi chào cờ đầu tuần, những giờ ra chơi rộn rã, những lần bị thầy chủ nhiệm phạt vì đi học muộn...\n\nTôi gặp lại thầy Hùng — thầy giáo chủ nhiệm năm xưa, giờ đã ngoài sáu mươi, tóc bạc trắng. Thầy vẫn nhận ra tôi ngay: Em là... thằng bé hay ngủ gật trong giờ văn phải không? Cả hai thầy trò cùng cười vang. Thầy kể về những đổi thay của trường, về các thế hệ học trò đã trưởng thành.\n\nĐi dọc hành lang, tôi ghé vào lớp học cũ. Bàn ghế đã được thay mới, bảng đen thành bảng trắng, nhưng không khí thân thương vẫn vẹn nguyên. Tôi như thấy lại hình ảnh mình ngày xưa: cậu học trò gầy gò, say sưa chép bài, thỉnh thoảng lén nhìn qua cửa sổ ngắm mây trôi.\n\nChia tay thầy, tôi ra về với lòng đầy xúc động. Hai mươi năm, mái trường đã thay đổi nhiều, thầy cô đã già đi, nhưng tình cảm thầy trò, tình bạn bè thì vẫn vẹn nguyên như ngày nào. Tôi thầm cảm ơn mái trường, cảm ơn thầy cô đã cho tôi những năm tháng tươi đẹp nhất của tuổi trẻ — hành trang quý giá theo tôi suốt cuộc đời.\n\nCâu 4. Cảm xúc chủ đạo của tác giả trong chuyến thăm trường là gì?", "options": ["A. Buồn bã, tiếc nuối", "B. Xúc động, biết ơn: vui trước sự đổi thay của trường, trân trọng tình thầy trò, bạn bè vẹn nguyên", "C. Thờ ơ, lạnh nhạt", "D. Giận hờn"], "answer": "B", "explain": "Toàn bài thấm đẫm cảm xúc xúc động, biết ơn: tác giả vui khi trường khang trang, cảm động khi gặp lại thầy, trân trọng những năm tháng tuổi trẻ — tình cảm chân thành của người trở về.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHĂM LẠI TRƯỜNG XƯA\n(Hồi kí)\n\nHai mươi năm sau ngày ra trường, tôi mới có dịp trở lại thăm mái trường cấp ba thân yêu. Con đường đến trường giờ đã được trải nhựa phẳng lì, khác hẳn con đường đất đỏ lầy lội ngày xưa mỗi khi mưa xuống.\n\nCổng trường vẫn ở đó, nhưng khang trang hơn nhiều. Hàng phượng vĩ ngày xưa chúng tôi hay ngồi ôn bài giờ đã cao lớn, tán lá xum xuê. Tôi đứng lặng dưới gốc phượng, bao kỉ niệm ùa về: những buổi chào cờ đầu tuần, những giờ ra chơi rộn rã, những lần bị thầy chủ nhiệm phạt vì đi học muộn...\n\nTôi gặp lại thầy Hùng — thầy giáo chủ nhiệm năm xưa, giờ đã ngoài sáu mươi, tóc bạc trắng. Thầy vẫn nhận ra tôi ngay: Em là... thằng bé hay ngủ gật trong giờ văn phải không? Cả hai thầy trò cùng cười vang. Thầy kể về những đổi thay của trường, về các thế hệ học trò đã trưởng thành.\n\nĐi dọc hành lang, tôi ghé vào lớp học cũ. Bàn ghế đã được thay mới, bảng đen thành bảng trắng, nhưng không khí thân thương vẫn vẹn nguyên. Tôi như thấy lại hình ảnh mình ngày xưa: cậu học trò gầy gò, say sưa chép bài, thỉnh thoảng lén nhìn qua cửa sổ ngắm mây trôi.\n\nChia tay thầy, tôi ra về với lòng đầy xúc động. Hai mươi năm, mái trường đã thay đổi nhiều, thầy cô đã già đi, nhưng tình cảm thầy trò, tình bạn bè thì vẫn vẹn nguyên như ngày nào. Tôi thầm cảm ơn mái trường, cảm ơn thầy cô đã cho tôi những năm tháng tươi đẹp nhất của tuổi trẻ — hành trang quý giá theo tôi suốt cuộc đời.\n\nCâu 5. Qua văn bản, em cảm nhận được điều gì về tình thầy trò? (Trả lời ngắn gọn)", "answer": "Tình thầy trò thiêng liêng, sâu nặng, vượt qua thời gian", "explain": "Chấp nhận các cách diễn đạt tương đương: thầy cô luôn nhớ học trò; học trò biết ơn thầy cô; tình cảm vẹn nguyên sau hai mươi năm...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lòng biết ơn thầy cô của học sinh.", "explain": "DÀN Ý:\n1. Mở đoạn: biết ơn thầy cô là đạo lí, là bổn phận.\n2. Thân đoạn: (a) Công ơn: dạy chữ, dạy người, chắp cánh ước mơ như thầy Hùng nhớ từng học trò; (b) Biểu hiện: chăm ngoan, học giỏi, lễ phép, thăm hỏi khi ra trường; (c) Phê phán thói vô ơn, thiếu tôn trọng thầy cô.\n3. Kết đoạn: hãy thể hiện lòng biết ơn bằng hành động.\n\nBÀI MẪU:\nBiết ơn thầy cô là đạo lí tốt đẹp, là bổn phận thiêng liêng của mỗi học sinh. Thầy cô không chỉ truyền đạt kiến thức mà còn dạy ta cách làm người, chắp cánh cho những ước mơ bay cao — như thầy Hùng trong hồi kí, sau hai mươi năm vẫn nhớ từng học trò, vẫn dành trọn tâm huyết cho sự nghiệp trồng người. Công ơn ấy sánh ngang với công cha nghĩa mẹ. Lòng biết ơn thầy cô phải được thể hiện bằng những việc làm cụ thể: chăm ngoan, vâng lời, cố gắng học tập để thầy cô vui lòng; lễ phép, kính trọng trong từng lời nói, việc làm; và khi đã trưởng thành, đừng quên thăm hỏi, tri ân những người đã dạy dỗ mình. Đáng phê phán là những học sinh vô lễ, thiếu tôn trọng thầy cô, coi việc học là gánh nặng, phụ công dạy dỗ. Cũng đáng trách những ai khi thành đạt thì quên mất thầy xưa, bạn cũ. Thầy cô không mong học trò đền đáp vật chất — niềm vui lớn nhất của thầy cô là thấy học trò nên người. Vì vậy, món quà ý nghĩa nhất dành cho thầy cô chính là sự trưởng thành, thành đạt của mỗi chúng ta. Hãy biết ơn thầy cô ngay từ hôm nay, khi còn được ngồi trên ghế nhà trường.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về ý nghĩa của những kỉ niệm tuổi học trò.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — kỉ niệm tuổi học trò là tài sản tinh thần vô giá.\nII. Thân bài:\n1. Những kỉ niệm đẹp: thầy cô, bạn bè, mái trường (như trong hồi kí).\n2. Ý nghĩa:\n   a. Nuôi dưỡng tâm hồn, là điểm tựa tinh thần.\n   b. Nhắc nhớ công ơn thầy cô, tình bạn.\n   c. Tiếp thêm động lực sống và làm việc.\n3. Cách tạo nên kỉ niệm đẹp: sống chân thành, chăm ngoan, gắn bó với trường lớp.\n4. Phê phán: những ai đánh mất tuổi học trò vào việc vô bổ; thái độ vô tâm với trường lớp.\nIII. Kết bài: khẳng định; nhắn nhủ hãy trân trọng quãng đời học sinh.\n\nĐOẠN MẪU (mở bài):\nAi cũng chỉ có một thời học sinh — quãng đời trong sáng, hồn nhiên nhất của mỗi con người. Những kỉ niệm về thầy cô, bạn bè, mái trường sẽ theo ta suốt cuộc đời như hành trang tinh thần quý giá, như trong hồi kí Thăm lại trường xưa: sau hai mươi năm, tác giả vẫn xúc động khi trở về, vẫn nhớ như in từng góc sân, từng lời thầy dạy. Kỉ niệm tuổi học trò có ý nghĩa to lớn như thế nào và làm sao để có những kỉ niệm đẹp? Đó là điều mỗi chúng ta cần suy ngẫm khi còn đang ngồi trên ghế nhà trường.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÀNG NGHỀ TRUYỀN THỐNG\n(Phóng sự)\n\nLàng gốm Bát Tràng nằm bên bờ sông Hồng đã có lịch sử hơn năm trăm năm. Trải qua bao thăng trầm, làng nghề vẫn tồn tại và phát triển, trở thành niềm tự hào của văn hóa Việt Nam.\n\nTôi gặp nghệ nhân Trần Văn Độ — người đã gắn bó với nghề gốm hơn bốn mươi năm. Đôi tay ông thoăn thoắt nặn đất, tạo hình những chiếc bình, chiếc ấm với độ chính xác đến kinh ngạc. Ông kể: Nghề gốm đòi hỏi sự kiên nhẫn và tâm huyết. Từ chọn đất, nhào nặn, tạo hình đến nung lò — mỗi công đoạn đều phải tỉ mỉ. Chỉ một sơ suất nhỏ, cả mẻ gốm có thể hỏng.\n\nĐiều khiến tôi trăn trở là hiện nay, nhiều bạn trẻ trong làng không mặn mà với nghề truyền thống. Họ thích làm công nhân ở khu công nghiệp với thu nhập ổn định hơn là ngồi bên bàn xoay vất vả. Một số gia đình đã phải thuê thợ từ nơi khác đến. Nguy cơ mai một làng nghề là có thật.\n\nTuy nhiên, cũng có những tín hiệu vui. Nhiều nghệ nhân trẻ đã kết hợp gốm truyền thống với thiết kế hiện đại, đưa sản phẩm lên sàn thương mại điện tử, thu hút khách du lịch đến trải nghiệm làm gốm. Làng nghề đang tìm hướng đi mới để vừa giữ gìn truyền thống vừa phát triển kinh tế.\n\nChia tay làng gốm khi chiều xuống, tôi mang theo suy nghĩ: giữ gìn làng nghề truyền thống không phải là giữ nguyên mọi thứ như cũ, mà là biết kế thừa tinh hoa và sáng tạo cho phù hợp với thời đại. Đó là trách nhiệm của thế hệ hôm nay với di sản cha ông để lại.\n\nCâu 1. Văn bản trên thuộc thể kí nào?", "options": ["A. Tùy bút", "B. Phóng sự — điều tra, phản ánh vấn đề làng nghề truyền thống", "C. Thơ", "D. Truyện ngắn"], "answer": "B", "explain": "Tác giả đi thực tế, phỏng vấn nghệ nhân, phản ánh vấn đề thời sự (nguy cơ mai một làng nghề) — đó là phóng sự, giàu tính chiến đấu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÀNG NGHỀ TRUYỀN THỐNG\n(Phóng sự)\n\nLàng gốm Bát Tràng nằm bên bờ sông Hồng đã có lịch sử hơn năm trăm năm. Trải qua bao thăng trầm, làng nghề vẫn tồn tại và phát triển, trở thành niềm tự hào của văn hóa Việt Nam.\n\nTôi gặp nghệ nhân Trần Văn Độ — người đã gắn bó với nghề gốm hơn bốn mươi năm. Đôi tay ông thoăn thoắt nặn đất, tạo hình những chiếc bình, chiếc ấm với độ chính xác đến kinh ngạc. Ông kể: Nghề gốm đòi hỏi sự kiên nhẫn và tâm huyết. Từ chọn đất, nhào nặn, tạo hình đến nung lò — mỗi công đoạn đều phải tỉ mỉ. Chỉ một sơ suất nhỏ, cả mẻ gốm có thể hỏng.\n\nĐiều khiến tôi trăn trở là hiện nay, nhiều bạn trẻ trong làng không mặn mà với nghề truyền thống. Họ thích làm công nhân ở khu công nghiệp với thu nhập ổn định hơn là ngồi bên bàn xoay vất vả. Một số gia đình đã phải thuê thợ từ nơi khác đến. Nguy cơ mai một làng nghề là có thật.\n\nTuy nhiên, cũng có những tín hiệu vui. Nhiều nghệ nhân trẻ đã kết hợp gốm truyền thống với thiết kế hiện đại, đưa sản phẩm lên sàn thương mại điện tử, thu hút khách du lịch đến trải nghiệm làm gốm. Làng nghề đang tìm hướng đi mới để vừa giữ gìn truyền thống vừa phát triển kinh tế.\n\nChia tay làng gốm khi chiều xuống, tôi mang theo suy nghĩ: giữ gìn làng nghề truyền thống không phải là giữ nguyên mọi thứ như cũ, mà là biết kế thừa tinh hoa và sáng tạo cho phù hợp với thời đại. Đó là trách nhiệm của thế hệ hôm nay với di sản cha ông để lại.\n\nCâu 2. Làng gốm Bát Tràng có lịch sử bao lâu?", "options": ["A. Hơn một trăm năm", "B. Hơn năm trăm năm", "C. Hơn một nghìn năm", "D. Mới thành lập"], "answer": "B", "explain": "Văn bản cho biết: làng gốm Bát Tràng bên bờ sông Hồng đã có lịch sử hơn năm trăm năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÀNG NGHỀ TRUYỀN THỐNG\n(Phóng sự)\n\nLàng gốm Bát Tràng nằm bên bờ sông Hồng đã có lịch sử hơn năm trăm năm. Trải qua bao thăng trầm, làng nghề vẫn tồn tại và phát triển, trở thành niềm tự hào của văn hóa Việt Nam.\n\nTôi gặp nghệ nhân Trần Văn Độ — người đã gắn bó với nghề gốm hơn bốn mươi năm. Đôi tay ông thoăn thoắt nặn đất, tạo hình những chiếc bình, chiếc ấm với độ chính xác đến kinh ngạc. Ông kể: Nghề gốm đòi hỏi sự kiên nhẫn và tâm huyết. Từ chọn đất, nhào nặn, tạo hình đến nung lò — mỗi công đoạn đều phải tỉ mỉ. Chỉ một sơ suất nhỏ, cả mẻ gốm có thể hỏng.\n\nĐiều khiến tôi trăn trở là hiện nay, nhiều bạn trẻ trong làng không mặn mà với nghề truyền thống. Họ thích làm công nhân ở khu công nghiệp với thu nhập ổn định hơn là ngồi bên bàn xoay vất vả. Một số gia đình đã phải thuê thợ từ nơi khác đến. Nguy cơ mai một làng nghề là có thật.\n\nTuy nhiên, cũng có những tín hiệu vui. Nhiều nghệ nhân trẻ đã kết hợp gốm truyền thống với thiết kế hiện đại, đưa sản phẩm lên sàn thương mại điện tử, thu hút khách du lịch đến trải nghiệm làm gốm. Làng nghề đang tìm hướng đi mới để vừa giữ gìn truyền thống vừa phát triển kinh tế.\n\nChia tay làng gốm khi chiều xuống, tôi mang theo suy nghĩ: giữ gìn làng nghề truyền thống không phải là giữ nguyên mọi thứ như cũ, mà là biết kế thừa tinh hoa và sáng tạo cho phù hợp với thời đại. Đó là trách nhiệm của thế hệ hôm nay với di sản cha ông để lại.\n\nCâu 3. Nguy cơ mà làng nghề đang đối mặt là gì?", "options": ["A. Thiếu đất sét", "B. Nhiều bạn trẻ không mặn mà với nghề truyền thống, thích làm công nhân hơn — nguy cơ mai một", "C. Không bán được hàng", "D. Thiên tai"], "answer": "B", "explain": "Vấn đề thời sự được phản ánh: giới trẻ thờ ơ với nghề truyền thống, chọn làm công nhân cho thu nhập ổn định — làng nghề đứng trước nguy cơ mai một.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÀNG NGHỀ TRUYỀN THỐNG\n(Phóng sự)\n\nLàng gốm Bát Tràng nằm bên bờ sông Hồng đã có lịch sử hơn năm trăm năm. Trải qua bao thăng trầm, làng nghề vẫn tồn tại và phát triển, trở thành niềm tự hào của văn hóa Việt Nam.\n\nTôi gặp nghệ nhân Trần Văn Độ — người đã gắn bó với nghề gốm hơn bốn mươi năm. Đôi tay ông thoăn thoắt nặn đất, tạo hình những chiếc bình, chiếc ấm với độ chính xác đến kinh ngạc. Ông kể: Nghề gốm đòi hỏi sự kiên nhẫn và tâm huyết. Từ chọn đất, nhào nặn, tạo hình đến nung lò — mỗi công đoạn đều phải tỉ mỉ. Chỉ một sơ suất nhỏ, cả mẻ gốm có thể hỏng.\n\nĐiều khiến tôi trăn trở là hiện nay, nhiều bạn trẻ trong làng không mặn mà với nghề truyền thống. Họ thích làm công nhân ở khu công nghiệp với thu nhập ổn định hơn là ngồi bên bàn xoay vất vả. Một số gia đình đã phải thuê thợ từ nơi khác đến. Nguy cơ mai một làng nghề là có thật.\n\nTuy nhiên, cũng có những tín hiệu vui. Nhiều nghệ nhân trẻ đã kết hợp gốm truyền thống với thiết kế hiện đại, đưa sản phẩm lên sàn thương mại điện tử, thu hút khách du lịch đến trải nghiệm làm gốm. Làng nghề đang tìm hướng đi mới để vừa giữ gìn truyền thống vừa phát triển kinh tế.\n\nChia tay làng gốm khi chiều xuống, tôi mang theo suy nghĩ: giữ gìn làng nghề truyền thống không phải là giữ nguyên mọi thứ như cũ, mà là biết kế thừa tinh hoa và sáng tạo cho phù hợp với thời đại. Đó là trách nhiệm của thế hệ hôm nay với di sản cha ông để lại.\n\nCâu 4. Hướng đi mới của làng nghề được nêu trong văn bản là gì?", "options": ["A. Bỏ nghề truyền thống", "B. Kết hợp truyền thống với hiện đại: thiết kế mới, bán hàng trực tuyến, phát triển du lịch trải nghiệm", "C. Chỉ sản xuất hàng loạt", "D. Chuyển sang nghề khác"], "answer": "B", "explain": "Tín hiệu vui: nghệ nhân trẻ kết hợp gốm truyền thống với thiết kế hiện đại, bán trên sàn thương mại điện tử, thu hút du lịch trải nghiệm — vừa giữ truyền thống vừa phát triển.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÀNG NGHỀ TRUYỀN THỐNG\n(Phóng sự)\n\nLàng gốm Bát Tràng nằm bên bờ sông Hồng đã có lịch sử hơn năm trăm năm. Trải qua bao thăng trầm, làng nghề vẫn tồn tại và phát triển, trở thành niềm tự hào của văn hóa Việt Nam.\n\nTôi gặp nghệ nhân Trần Văn Độ — người đã gắn bó với nghề gốm hơn bốn mươi năm. Đôi tay ông thoăn thoắt nặn đất, tạo hình những chiếc bình, chiếc ấm với độ chính xác đến kinh ngạc. Ông kể: Nghề gốm đòi hỏi sự kiên nhẫn và tâm huyết. Từ chọn đất, nhào nặn, tạo hình đến nung lò — mỗi công đoạn đều phải tỉ mỉ. Chỉ một sơ suất nhỏ, cả mẻ gốm có thể hỏng.\n\nĐiều khiến tôi trăn trở là hiện nay, nhiều bạn trẻ trong làng không mặn mà với nghề truyền thống. Họ thích làm công nhân ở khu công nghiệp với thu nhập ổn định hơn là ngồi bên bàn xoay vất vả. Một số gia đình đã phải thuê thợ từ nơi khác đến. Nguy cơ mai một làng nghề là có thật.\n\nTuy nhiên, cũng có những tín hiệu vui. Nhiều nghệ nhân trẻ đã kết hợp gốm truyền thống với thiết kế hiện đại, đưa sản phẩm lên sàn thương mại điện tử, thu hút khách du lịch đến trải nghiệm làm gốm. Làng nghề đang tìm hướng đi mới để vừa giữ gìn truyền thống vừa phát triển kinh tế.\n\nChia tay làng gốm khi chiều xuống, tôi mang theo suy nghĩ: giữ gìn làng nghề truyền thống không phải là giữ nguyên mọi thứ như cũ, mà là biết kế thừa tinh hoa và sáng tạo cho phù hợp với thời đại. Đó là trách nhiệm của thế hệ hôm nay với di sản cha ông để lại.\n\nCâu 5. Theo em, cần làm gì để giữ gìn làng nghề truyền thống? (Trả lời ngắn gọn)", "answer": "Kế thừa tinh hoa, sáng tạo phù hợp thời đại; tạo việc làm, thu nhập cho nghệ nhân trẻ", "explain": "Chấp nhận các giải pháp cụ thể: đào tạo nghề cho giới trẻ; quảng bá, phát triển du lịch; hỗ trợ tiêu thụ sản phẩm; đưa vào trường học...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về trách nhiệm của tuổi trẻ trong việc giữ gìn di sản văn hóa.", "explain": "DÀN Ý:\n1. Mở đoạn: di sản văn hóa là tài sản vô giá, tuổi trẻ có trách nhiệm giữ gìn.\n2. Thân đoạn: (a) Ý nghĩa: là hồn cốt dân tộc, niềm tự hào như làng gốm Bát Tràng; (b) Nguy cơ mai một; (c) Việc làm cụ thể: tìm hiểu, quảng bá, học nghề truyền thống, phê phán thói vô tâm, phá hoại di sản.\n3. Kết đoạn: hãy hành động.\n\nBÀI MẪU:\nDi sản văn hóa — từ làng nghề truyền thống, lễ hội dân gian đến các di tích lịch sử — là tài sản vô giá mà cha ông để lại, và tuổi trẻ hôm nay có trách nhiệm to lớn trong việc giữ gìn, phát huy. Di sản không chỉ là niềm tự hào dân tộc mà còn là nền tảng tinh thần, là nguồn lực phát triển du lịch, kinh tế. Thế nhưng, đáng lo ngại là nhiều di sản đang đứng trước nguy cơ mai một: làng nghề thiếu thợ trẻ như Bát Tràng, nhiều lễ hội bị thương mại hóa, không ít bạn trẻ thờ ơ, thậm chí có hành vi phá hoại di tích. Trách nhiệm của tuổi trẻ thể hiện qua những việc làm cụ thể: tích cực tìm hiểu về di sản quê hương; quảng bá văn hóa dân tộc với bạn bè trong và ngoài nước; tham gia các hoạt động bảo tồn; học tập, kế thừa nghề truyền thống với tinh thần sáng tạo; lên án những hành vi xâm hại di sản. Giữ gìn di sản không có nghĩa là giữ nguyên mọi thứ như cũ mà là biết kế thừa tinh hoa và làm cho nó sống mãi trong đời sống hiện đại. Mỗi người trẻ hãy là một đại sứ văn hóa — để di sản cha ông không chỉ tồn tại trong bảo tàng mà còn tỏa sáng trong cuộc sống hôm nay.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về mối quan hệ giữa truyền thống và hiện đại trong đời sống hôm nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — giữ gìn truyền thống trong thời hiện đại.\nII. Thân bài:\n1. Giải thích: truyền thống là những giá trị tốt đẹp được lưu truyền; hiện đại là sự phát triển của thời đại.\n2. Mối quan hệ:\n   a. Truyền thống là nền tảng, cội nguồn; hiện đại là sự tiếp nối, phát triển.\n   b. Dẫn chứng: làng nghề kết hợp truyền thống — hiện đại; áo dài cách tân; âm nhạc dân gian phối khí mới.\n   c. Không đối lập mà bổ sung cho nhau: giữ tinh hoa, bỏ hủ tục; tiếp thu hiện đại có chọn lọc.\n3. Phê phán: hai thái cực sai lầm — bảo thủ, khư khư giữ cũ và sính ngoại, quay lưng với truyền thống.\n4. Bài học: tuổi trẻ phải biết kế thừa và sáng tạo.\nIII. Kết bài: khẳng định.\n\nĐOẠN MẪU (mở bài):\nTrong dòng chảy của thời đại, mỗi dân tộc đều đứng trước câu hỏi: làm sao vừa giữ gìn được truyền thống tốt đẹp của cha ông vừa hội nhập, phát triển cùng thế giới hiện đại? Đây không phải là sự lựa chọn một trong hai mà là nghệ thuật kết hợp hài hòa — như làng gốm Bát Tràng đang làm: giữ lửa nghề truyền thống bằng những cách thức hiện đại. Hiểu đúng mối quan hệ giữa truyền thống và hiện đại có ý nghĩa quan trọng với mỗi chúng ta, nhất là tuổi trẻ.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI THẦY ĐẦU TIÊN\n(Hồi kí)\n\nTrong cuộc đời mỗi con người, có những người thầy ta không bao giờ quên. Với tôi, đó là cô giáo Lan — cô giáo lớp một của tôi ở ngôi trường làng nhỏ.\n\nNgày đầu tiên đến trường, tôi khóc nức nở, bám chặt lấy mẹ không chịu vào lớp. Cô Lan cúi xuống, nắm lấy tay tôi, giọng ấm áp: Nào, vào lớp với cô. Ở đây có nhiều bạn mới, có nhiều điều thú vị lắm!\n\nCô Lan không chỉ dạy chúng tôi đánh vần, tập viết mà còn dạy những bài học đầu đời về cách làm người. Cô kể chuyện cổ tích, dạy chúng tôi hát, dạy cách chào hỏi lễ phép, cách giúp đỡ bạn bè. Mỗi khi có bạn nào khóc, cô đều ôm vào lòng dỗ dành như mẹ hiền.\n\nTôi nhớ mãi buổi học cuối năm lớp một. Cô tặng mỗi đứa một bông hoa điểm mười bằng giấy màu do chính tay cô cắt dán. Cô nói: Các con đã lớn thêm một tuổi, phải chăm ngoan hơn nhé! Tôi giữ bông hoa ấy trong hộp bút suốt nhiều năm.\n\nSau này, tôi chuyển lên thành phố học, ít có dịp về thăm cô. Mấy năm trước, nghe tin cô đã nghỉ hưu, tôi về thăm. Cô vẫn vậy — hiền từ, ấm áp. Thấy tôi, cô cười: Thằng bé hay khóc nhè ngày xưa giờ đã lớn thế này rồi!\n\nCô Lan chỉ là một cô giáo làng bình thường, không có những thành tích lẫy lừng. Nhưng với tôi và bao thế hệ học trò, cô là người thầy đầu tiên, người đã đặt những viên gạch đầu tiên cho ngôi nhà tri thức và nhân cách của chúng tôi. Công ơn ấy, tôi mang theo suốt cuộc đời.\n\nCâu 1. Cô giáo Lan là ai đối với tác giả?", "options": ["A. Cô giáo dạy văn cấp ba", "B. Cô giáo lớp một — người thầy đầu tiên ở ngôi trường làng", "C. Mẹ của tác giả", "D. Cô hàng xóm"], "answer": "B", "explain": "Văn bản khẳng định: cô Lan là cô giáo lớp một, người thầy đầu tiên của tác giả ở ngôi trường làng nhỏ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI THẦY ĐẦU TIÊN\n(Hồi kí)\n\nTrong cuộc đời mỗi con người, có những người thầy ta không bao giờ quên. Với tôi, đó là cô giáo Lan — cô giáo lớp một của tôi ở ngôi trường làng nhỏ.\n\nNgày đầu tiên đến trường, tôi khóc nức nở, bám chặt lấy mẹ không chịu vào lớp. Cô Lan cúi xuống, nắm lấy tay tôi, giọng ấm áp: Nào, vào lớp với cô. Ở đây có nhiều bạn mới, có nhiều điều thú vị lắm!\n\nCô Lan không chỉ dạy chúng tôi đánh vần, tập viết mà còn dạy những bài học đầu đời về cách làm người. Cô kể chuyện cổ tích, dạy chúng tôi hát, dạy cách chào hỏi lễ phép, cách giúp đỡ bạn bè. Mỗi khi có bạn nào khóc, cô đều ôm vào lòng dỗ dành như mẹ hiền.\n\nTôi nhớ mãi buổi học cuối năm lớp một. Cô tặng mỗi đứa é! Tôi giữ bông hoa ấy trong hộp bút suốt nhiều năm.\n\nSau này, tôi chuyển lên thành phố học, ít có dịp về thăm cô. Mấy năm trước, nghe tin cô đã nghỉ hưu, tôi về thăm. Cô vẫn vậy — hiền từ, ấm áp. Thấy tôi, cô cười: Thằng bé hay khóc nhè ngày xưa giờ đã lớn thế này rồi!\n\nCô Lan chỉ là một cô giáo làng bình thường, không có những thành tích lẫy lừng. Nhưng với tôi và bao thế hệ học trò, cô là người thầy đầu tiên, người đã đặt những viên gạch đầu tiên cho ngôi nhà tri thức và nhân cách của chúng tôi. Công ơn ấy, tôi mang theo suốt cuộc đời.\n\nCâu 3. Món quà cô Lan tặng học trò cuối năm lớp một là gì? Có ý nghĩa gì?", "options": ["A. Sách giáo khoa", "B. Bông hoa điểm mười bằng giấy màu do chính tay cô cắt dán — khích lệ, ghi nhận sự cố gắng của học trò", "C. Tiền thưởng", "D. Quần áo mới"], "answer": "B", "explain": "Món quà đơn sơ mà ý nghĩa: bông hoa điểm mười bằng giấy tự tay cô làm — sự khích lệ chân thành, được học trò giữ gìn suốt nhiều năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI THẦY ĐẦU TIÊN\n(Hồi kí)\n\nTrong cuộc đời mỗi con người, có những người thầy ta không bao giờ quên. Với tôi, đó là cô giáo Lan — cô giáo lớp một của tôi ở ngôi trường làng nhỏ.\n\nNgày đầu tiên đến trường, tôi khóc nức nở, bám chặt lấy mẹ không chịu vào lớp. Cô Lan cúi xuống, nắm lấy tay tôi, giọng ấm áp: Nào, vào lớp với cô. Ở đây có nhiều bạn mới, có nhiều điều thú vị lắm!\n\nCô Lan không chỉ dạy chúng tôi đánh vần, tập viết mà còn dạy những bài học đầu đời về cách làm người. Cô kể chuyện cổ tích, dạy chúng tôi hát, dạy cách chào hỏi lễ phép, cách giúp đỡ bạn bè. Mỗi khi có bạn nào khóc, cô đều ôm vào lòng dỗ dành như mẹ hiền.\n\nTôi nhớ mãi buổi học cuối năm lớp một. Cô tặng mỗi đứa một bông hoa điểm mười bằng giấy màu do chính tay cô cắt dán. Cô nói: Các con đã lớn thêm một tuổi, phải chăm ngoan hơn nhé! Tôi giữ bông hoa ấy trong hộp bút suốt nhiều năm.\n\nSau này, tôi chuyển lên thành phố học, ít có dịp về thăm cô. Mấy năm trước, nghe tin cô đã nghỉ hưu, tôi về thăm. Cô vẫn vậy — hiền từ, ấm áp. Thấy tôi, cô cười: Thằng bé hay khóc nhè ngày xưa giờ đã lớn thế này rồi!\n\nCô Lan chỉ là một cô giáo làng bình thường, không có những thành tích lẫy lừng. Nhưng với tôi và bao thế hệ học trò, cô là người thầy đầu tiên, người đã đặt những viên gạch đầu tiên cho ngôi nhà tri thức và nhân cách của chúng tôi. Công ơn ấy, tôi mang theo suốt cuộc đời.\n\nCâu 4. Vì sao tác giả gọi cô Lan là người \"đặt những viên gạch đầu tiên\"?", "options": ["A. Vì cô xây nhà", "B. Ẩn dụ: cô là người dạy những bài học đầu đời về tri thức và nhân cách — nền móng cho cả cuộc đời học trò", "C. Vì cô dạy môn xây dựng", "D. Ngẫu nhiên"], "answer": "B", "explain": "Hình ảnh ẩn dụ \"những viên gạch đầu tiên\" chỉ những bài học đầu đời về chữ nghĩa và cách làm người — nền móng cho ngôi nhà tri thức, nhân cách của mỗi học trò.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI THẦY ĐẦU TIÊN\n(Hồi kí)\n\nTrong cuộc đời mỗi con người, có những người thầy ta không bao giờ quên. Với tôi, đó là cô giáo Lan — cô giáo lớp một của tôi ở ngôi trường làng nhỏ.\n\nNgày đầu tiên đến trường, tôi khóc nức nở, bám chặt lấy mẹ không chịu vào lớp. Cô Lan cúi xuống, nắm lấy tay tôi, giọng ấm áp: Nào, vào lớp với cô. Ở đây có nhiều bạn mới, có nhiều điều thú vị lắm!\n\nCô Lan không chỉ dạy chúng tôi đánh vần, tập viết mà còn dạy những bài học đầu đời về cách làm người. Cô kể chuyện cổ tích, dạy chúng tôi hát, dạy cách chào hỏi lễ phép, cách giúp đỡ bạn bè. Mỗi khi có bạn nào khóc, cô đều ôm vào lòng dỗ dành như mẹ hiền.\n\nTôi nhớ mãi buổi học cuối năm lớp một. Cô tặng mỗi đứa một bông hoa điểm mười bằng giấy màu do chính tay cô cắt dán. Cô nói: Các con đã lớn thêm một tuổi, phải chăm ngoan hơn nhé! Tôi giữ bông hoa ấy trong hộp bút suốt nhiều năm.\n\nSau này, tôi chuyển lên thành phố học, ít có dịp về thăm cô. Mấy năm trước, nghe tin cô đã nghỉ hưu, tôi về thăm. Cô vẫn vậy — hiền từ, ấm áp. Thấy tôi, cô cười: Thằng bé hay khóc nhè ngày xưa giờ đã lớn thế này rồi!\n\nCô Lan chỉ là một cô giáo làng bình thường, không có những thành tích lẫy lừng. Nhưng với tôi và bao thế hệ học trò, cô là người thầy đầu tiên, người đã đặt những viên gạch đầu tiên cho ngôi nhà tri thức và nhân cách của chúng tôi. Công ơn ấy, tôi mang theo suốt cuộc đời.\n\nCâu 5. Qua văn bản, em cảm nhận được điều gì về vai trò của người thầy đầu tiên? (Trả lời ngắn gọn)", "answer": "Người thầy đầu tiên đặt nền móng tri thức, nhân cách, ảnh hưởng suốt đời", "explain": "Chấp nhận các cách diễn đạt tương đương: dạy dỗ bằng tình thương; là người mẹ hiền thứ hai; công ơn khó quên...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về công ơn của thầy cô giáo.", "explain": "DÀN Ý:\n1. Mở đoạn: thầy cô có công ơn to lớn trong việc hình thành con người.\n2. Thân đoạn: (a) Công ơn: dạy chữ, dạy người như cô Lan với học trò lớp một; (b) Sự hy sinh thầm lặng; (c) Phê phán thói vô ơn.\n3. Kết đoạn: biết ơn bằng hành động.\n\nBÀI MẪU:\nCông ơn của thầy cô giáo đối với mỗi học sinh là vô cùng to lớn, sánh ngang với công cha nghĩa mẹ. Thầy cô không chỉ truyền đạt kiến thức mà còn dạy ta cách làm người, đặt những viên gạch đầu tiên cho ngôi nhà tri thức và nhân cách — như cô Lan trong hồi kí, bằng tình thương của người mẹ hiền đã dìu dắt những bước đi đầu tiên của học trò lớp một. Đằng sau mỗi thành công của học trò đều có bóng dáng thầm lặng của thầy cô: những đêm thức khuya soạn bài, những lời động viên khi ta nản lòng, những nghiêm khắc đầy yêu thương để ta nên người. Nghề giáo là nghề cao quý nhất trong các nghề cao quý, bởi thầy cô đã dâng hiến cả cuộc đời cho sự nghiệp trồng người. Thế nhưng, đáng buồn là vẫn còn những học sinh vô lễ, thiếu tôn trọng thầy cô, phụ công dạy dỗ. Lòng biết ơn thầy cô phải được thể hiện bằng hành động cụ thể: chăm ngoan, học giỏi, lễ phép hằng ngày và khi trưởng thành đừng quên thăm hỏi, tri ân. Hãy nhớ rằng niềm vui lớn nhất của thầy cô chính là thấy học trò nên người — đó cũng là món quà ý nghĩa nhất ta có thể dành tặng thầy cô.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về cách ứng xử lễ phép, kính trọng thầy cô của học sinh hiện nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — lễ phép với thầy cô là nét đẹp cần giữ gìn.\nII. Thân bài:\n1. Ý nghĩa của việc lễ phép, kính trọng thầy cô (đạo lí tôn sư trọng đạo; tạo môi trường học tập tốt).\n2. Những biểu hiện đẹp: chào hỏi lễ phép, vâng lời, chăm học, thăm hỏi khi ra trường.\n3. Thực trạng đáng buồn: một bộ phận học sinh vô lễ, thiếu tôn trọng (dẫn chứng).\n4. Nguyên nhân: ý thức kém, ảnh hưởng xấu từ mạng xã hội, thiếu giáo dục.\n5. Giải pháp: giáo dục từ gia đình, nhà trường; nêu gương; bản thân tự rèn luyện.\n6. Phê phán những hành vi vô lễ.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nTôn sư trọng đạo là truyền thống quý báu của dân tộc ta từ ngàn xưa. Người thầy với vai trò dạy chữ, dạy người luôn được xã hội kính trọng. Thế nhưng, trong đời sống hiện nay, bên cạnh nhiều học sinh lễ phép, chăm ngoan, vẫn còn một bộ phận có cách ứng xử thiếu tôn trọng với thầy cô — điều đáng báo động và cần được chấn chỉnh. Bàn về cách ứng xử lễ phép, kính trọng thầy cô của học sinh hiện nay là vấn đề có ý nghĩa thiết thực.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHUYẾN ĐI TÂY BẮC\n(Du kí)\n\nTôi đến Tây Bắc vào một ngày đầu xuân, khi hoa ban đang nở trắng núi rừng. Con đường đèo quanh co, một bên là vách núi dựng đứng, một bên là vực sâu thăm thẳm. Mỗi khúc cua mở ra một khung cảnh mới khiến tôi không khỏi trầm trồ.\n\nĐiểm dừng chân đầu tiên là bản Lác — bản của người Thái trắng. Những ngôi nhà sàn gỗ lim nằm nép mình dưới những tán cây ng. Con đường đến trường dài hun hút, có đoạn phải lội qua suối. Thế mà các em vẫn ríu rít, cặp sách trên vai, tiếng cười vang cả núi rừng. Nhìn các em, tôi chợt thấy mình thật may mắn và cũng thật hổ thẹn vì đôi khi đã than vãn về những khó khăn nhỏ bé của mình.\n\nChia tay Tây Bắc, tôi mang theo những ấn tượng khó quên: về cảnh đẹp hùng vĩ, về văn hóa đặc sắc và về những con người chân chất, hiếu khách. Chuyến đi không chỉ cho tôi những trải nghiệm thú vị mà còn dạy tôi biết trân trọng những gì mình đang có và thêm yêu đất nước mình.\n\nCâu 3. Chi tiết các em nhỏ lội suối đến trường gợi cho tác giả suy nghĩ gì?", "options": ["A. Thương hại các em", "B. Thấy mình may mắn và hổ thẹn vì đôi khi than vãn về khó khăn nhỏ bé của mình — bài học về sự trân trọng", "C. Muốn ở lại dạy học", "D. Không có suy nghĩ gì"], "answer": "B", "explain": "Hình ảnh các em vượt khó đến trường với tiếng cười rộn rã khiến tác giả chiêm nghiệm: mình may mắn hơn nhiều mà đôi khi còn than vãn — bài học biết trân trọng những gì mình có.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHUYẾN ĐI TÂY BẮC\n(Du kí)\n\nTôi đến Tây Bắc vào một ngày đầu xuân, khi hoa ban đang nở trắng núi rừng. Con đường đèo quanh co, một bên là vách núi dựng đứng, một bên là vực sâu thăm thẳm. Mỗi khúc cua mở ra một khung cảnh mới khiến tôi không khỏi trầm trồ.\n\nĐiểm dừng chân đầu tiên là bản Lác — bản của người Thái trắng. Những ngôi nhà sàn gỗ lim nằm nép mình dưới những tán cây cổ thụ. Người dân bản hiền hòa, mến khách. Tôi được mời uống rượu cần, ăn cơm lam, xôi nếp nương — những món ăn đậm đà hương vị núi rừng.\n\nTối đó, tôi được dự lễ hội xòe hoa. Trong ánh lửa bập bùng, những cô gái Thái trong trang phục thổ cẩm rực rỡ nắm tay nhau múa xòe. Tiếng khèn, tiếng sáo vang vọng núi rừng. Tôi như lạc vào một thế giới khác — thế giới của những điệu múa, lời ca ngàn đời.\n\nSáng hôm sau, tôi theo chân các em nhỏ đến trường. Con đường đến trường dài hun hút, có đoạn phải lội qua suối. Thế mà các em vẫn ríu rít, cặp sách trên vai, tiếng cười vang cả núi rừng. Nhìn các em, tôi chợt thấy mình thật may mắn và cũng thật hổ thẹn vì đôi khi đã than vãn về những khó khăn nhỏ bé của mình.\n\nChia tay Tây Bắc, tôi mang theo những ấn tượng khó quên: về cảnh đẹp hùng vĩ, về văn hóa đặc sắc và về những con người chân chất, hiếu khách. Chuyến đi không chỉ cho tôi những trải nghiệm thú vị mà còn dạy tôi biết trân trọng những gì mình đang có và thêm yêu đất nước mình.\n\nCâu 4. Giá trị của chuyến đi đối với tác giả là gì?", "options": ["A. Chỉ để ngắm cảnh", "B. Không chỉ có trải nghiệm thú vị mà còn dạy biết trân trọng những gì đang có và thêm yêu đất nước", "C. Để khoe với bạn bè", "D. Để viết báo"], "answer": "B", "explain": "Câu kết khái quát: chuyến đi mang lại trải nghiệm và bài học — biết trân trọng, thêm yêu đất nước; đó cũng là giá trị của du kí chân chính.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHUYẾN ĐI TÂY BẮC\n(Du kí)\n\nTôi đến Tây Bắc vào một ngày đầu xuân, khi hoa ban đang nở trắng núi rừng. Con đường đèo quanh co, một bên là vách núi dựng đứng, một bên là vực sâu thăm thẳm. Mỗi khúc cua mở ra một khung cảnh mới khiến tôi không khỏi trầm trồ.\n\nĐiểm dừng chân đầu tiên là bản Lác — bản của người Thái trắng. Những ngôi nhà sàn gỗ lim nằm nép mình dưới những tán cây cổ thụ. Người dân bản hiền hòa, mến khách. Tôi được mời uống rượu cần, ăn cơm lam, xôi nếp nương — những món ăn đậm đà hương vị núi rừng.\n\nTối đó, tôi được dự lễ hội xòe hoa. Trong ánh lửa bập bùng, những cô gái Thái trong trang phục thổ cẩm rực rỡ nắm tay nhau múa xòe. Tiếng khèn, tiếng sáo vang vọng núi rừng. Tôi như lạc vào một thế giới khác — thế giới của những điệu múa, lời ca ngàn đời.\n\nSáng hôm sau, tôi theo chân các em nhỏ đến trường. Con đường đến trường dài hun hút, có đoạn phải lội qua suối. Thế mà các em vẫn ríu rít, cặp sách trên vai, tiếng cười vang cả núi rừng. Nhìn các em, tôi chợt thấy mình thật may mắn và cũng thật hổ thẹn vì đôi khi đã than vãn về những khó khăn nhỏ bé của mình.\n\nChia tay Tây Bắc, tôi mang theo những ấn tượng khó quên: về cảnh đẹp hùng vĩ, về văn hóa đặc sắc và về những con người chân chất, hiếu khách. Chuyến đi không chỉ cho tôi những trải nghiệm thú vị mà còn dạy tôi biết trân trọng những gì mình đang có và thêm yêu đất nước mình.\n\nCâu 5. Qua văn bản, em hiểu thêm điều gì về vẻ đẹp của đất nước? (Trả lời ngắn gọn)", "answer": "Đất nước có cảnh đẹp hùng vĩ, văn hóa đặc sắc, con người chân chất", "explain": "Chấp nhận các cách diễn đạt tương đương: tự hào về quê hương; mỗi vùng miền đều có nét đẹp riêng...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của những chuyến đi trải nghiệm đối với tuổi trẻ.", "explain": "DÀN Ý:\n1. Mở đoạn: đi trải nghiệm mang lại nhiều giá trị cho tuổi trẻ.\n2. Thân đoạn: (a) Mở rộng hiểu biết về đất nước, con người như chuyến đi Tây Bắc; (b) Rèn tính tự lập, bản lĩnh; (c) Nuôi dưỡng tâm hồn, thêm yêu quê hương; (d) Phê phán thói lười đi, chỉ quanh quẩn trong nhà.\n3. Kết đoạn: hãy đi để trưởng thành.\n\nBÀI MẪU:\nNhững chuyến đi trải nghiệm có ý nghĩa vô cùng to lớn đối với sự trưởng thành của tuổi trẻ. Đi là để mở rộng tầm mắt: ta được chiêm ngưỡng cảnh đẹp hùng vĩ của đất nước, tìm hiểu văn hóa đặc sắc của các vùng miền, gặp gỡ những con người chân chất, hiếu khách — như những gì tác giả đã cảm nhận trong chuyến đi Tây Bắc. Đi còn là để rèn luyện bản thân: tự lập trong sinh hoạt, bản lĩnh trước những tình huống bất ngờ, khả năng thích nghi với môi trường mới. Hơn nữa, mỗi chuyến đi đều nuôi dưỡng tâm hồn ta: ta thêm yêu quê hương đất nước, thêm trân trọng những gì mình đang có và hiểu hơn về cuộc sống của đồng bào mình. Có những bài học mà sách vở không dạy được, chỉ có thể học bằng chính đôi chân và trái tim mình trên những nẻo đường. Đáng tiếc là nhiều bạn trẻ hôm nay lười đi, chỉ quanh quẩn trong bốn bức tường với điện thoại, để tuổi trẻ trôi qua mà không có những trải nghiệm đáng nhớ. Dĩ nhiên, đi phải có mục đích, có kế hoạch và đảm bảo an toàn. Hãy đi khi còn trẻ — để mỗi chuyến đi đều là một bài học, một kỉ niệm đẹp làm giàu thêm hành trang cuộc đời.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về tình yêu quê hương đất nước của tuổi trẻ hôm nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — tình yêu quê hương là tình cảm thiêng liêng, cần được thể hiện bằng hành động.\nII. Thân bài:\n1. Biểu hiện của tình yêu quê hương:\n   a. Tự hào về vẻ đẹp đất nước, văn hóa dân tộc.\n   b. Gắn bó, nhớ nhung quê hương.\n   c. Có trách nhiệm xây dựng, bảo vệ Tổ quốc.\n2. Cách thể hiện trong thời đại hôm nay:\n   a. Học tập tốt để góp sức xây dựng đất nước.\n   b. Giữ gìn bản sắc văn hóa.\n   c. Bảo vệ môi trường quê hương.\n   d. Sẵn sàng bảo vệ chủ quyền.\n3. Phê phán: thói vô cảm, sính ngoại, quay lưng với quê hương.\n4. Liên hệ bản thân.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nQuê hương là gì mà ai cũng nhớ, ai cũng yêu? Đó là nơi ta sinh ra và lớn lên, là mảnh đất thấm đẫm mồ hôi của ông cha, là cội nguồn nuôi dưỡng tâm hồn mỗi con người. Tình yêu quê hương đất nước là tình cảm thiêng liêng nhất, là nền tảng của mọi tình cảm cao đẹp khác. Với tuổi trẻ hôm nay, tình yêu quê hương không chỉ là niềm tự hào, nỗi nhớ nhung mà còn phải thể hiện bằng những hành động cụ thể, thiết thực.", "points": 0}]}]}
