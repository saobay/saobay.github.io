{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA XUÂN CỦA TUỔI TRẺ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nXuân về trên những cành non,\nNắng vàng rót mật xuống con đường làng.\nTuổi trẻ như buổi sáng hồng,\nƯớc mơ chắp cánh bay cùng gió xuân.\n\nĐừng để xuân qua hững hờ,\nĐừng để tuổi trẻ đợi chờ tháng năm.\nHãy sống như ngọn lửa hồng,\nCháy lên rực rỡ giữa dòng đời trôi.\n\nMỗi ngày là một món quà,\nMỗi sớm mai thức dậy, ta thêm yêu.\nYêu đời, yêu cả những điều\nBé nhỏ, giản dị, thân yêu quanh mình.\n\nCâu 1. Bài thơ trên thuộc thể loại nào?", "options": ["A. Tự sự", "B. Trữ tình — bộc lộ trực tiếp cảm xúc, suy tư của cái tôi trữ tình", "C. Kịch", "D. Nghị luận"], "answer": "B", "explain": "Bài thơ bộc lộ trực tiếp cảm xúc, suy tư về tuổi trẻ và mùa xuân — đặc trưng của loại trữ tình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA XUÂN CỦA TUỔI TRẺ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nXuân về trên những cành non,\nNắng vàng rót mật xuống con đường làng.\nTuổi trẻ như buổi sáng hồng,\nƯớc mơ chắp cánh bay cùng gió xuân.\n\nĐừng để xuân qua hững hờ,\nĐừng để tuổi trẻ đợi chờ tháng năm.\nHãy sống như ngọn lửa hồng,\nCháy lên rực rỡ giữa dòng đời trôi.\n\nMỗi ngày là một món quà,\nMỗi sớm mai thức dậy, ta thêm yêu.\nYêu đời, yêu cả những điều\nBé nhỏ, giản dị, thân yêu quanh mình.\n\nCâu 2. Hình ảnh nào được dùng để ví với tuổi trẻ?", "options": ["A. Cành non", "B. Buổi sáng hồng và ngọn lửa hồng — gợi sự tươi mới, rực rỡ, tràn đầy sức sống", "C. Con đường làng", "D. Gió xuân"], "answer": "B", "explain": "Tuổi trẻ được ví với buổi sáng hồng và ngọn lửa hồng — những hình ảnh gợi sự tươi mới, nhiệt huyết, rực rỡ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA XUÂN CỦA TUỔI TRẺ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nXuân về trên những cành non,\nNắng vàng rót mật xuống con đường làng.\nTuổi trẻ như buổi sáng hồng,\nƯớc mơ chắp cánh bay cùng gió xuân.\n\nĐừng để xuân qua hững hờ,\nĐừng để tuổi trẻ đợi chờ tháng năm.\nHãy sống như ngọn lửa hồng,\nCháy lên rực rỡ giữa dòng đời trôi.\n\nMỗi ngày là một món quà,\nMỗi sớm mai thức dậy, ta thêm yêu.\nYêu đời, yêu cả những điều\nBé nhỏ, giản dị, thân yêu quanh mình.\n\nCâu 3. Hai câu thơ Đừng để xuân qua hững hờ, / Đừng để tuổi trẻ đợi chờ tháng năm thể hiện thái độ gì?", "options": ["A. Thờ ơ", "B. Khẩn thiết nhắn nhủ: hãy sống hết mình, đừng lãng phí tuổi trẻ — tinh thần sống gấp, trân trọng từng khoảnh khắc", "C. Buồn bã", "D. Giận dữ"], "answer": "B", "explain": "Điệp cấu trúc đừng để... thể hiện giọng điệu khẩn thiết, nhắn nhủ hãy sống trọn vẹn, đừng lãng phí tuổi trẻ — gần với tinh thần Vội vàng của Xuân Diệu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA XUÂN CỦA TUỔI TRẺ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nXuân về trên những cành non,\nNắng vàng rót mật xuống con đường làng.\nTuổi trẻ như buổi sáng hồng,\nƯớc mơ chắp cánh bay cùng gió xuân.\n\nĐừng để xuân qua hững hờ,\nĐừng để tuổi trẻ đợi chờ tháng năm.\nHãy sống như ngọn lửa hồng,\nCháy lên rực rỡ giữa dòng đời trôi.\n\nMỗi ngày là một món quà,\nMỗi sớm mai thức dậy, ta thêm yêu.\nYêu đời, yêu cả những điều\nBé nhỏ, giản dị, thân yêu quanh mình.\n\nCâu 4. Biện pháp tu từ nào nổi bật trong bài thơ?", "options": ["A. Nói quá", "B. So sánh, ẩn dụ (tuổi trẻ như buổi sáng hồng, như ngọn lửa hồng) và điệp ngữ (đừng để..., yêu...)", "C. Hoán dụ", "D. Chơi chữ"], "answer": "B", "explain": "Bài thơ dùng so sánh, ẩn dụ để khắc họa tuổi trẻ và điệp ngữ để nhấn mạnh lời nhắn nhủ — các biện pháp tu từ đặc trưng của thơ trữ tình.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA XUÂN CỦA TUỔI TRẺ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nXuân về trên những cành non,\nNắng vàng rót mật xuống con đường làng.\nTuổi trẻ như buổi sáng hồng,\nƯớc mơ chắp cánh bay cùng gió xuân.\n\nĐừng để xuân qua hững hờ,\nĐừng để tuổi trẻ đợi chờ tháng năm.\nHãy sống như ngọn lửa hồng,\nCháy lên rực rỡ giữa dòng đời trôi.\n\nMỗi ngày là một món quà,\nMỗi sớm mai thức dậy, ta thêm yêu.\nYêu đời, yêu cả những điều\nBé nhỏ, giản dị, thân yêu quanh mình.\n\nCâu 5. Qua bài thơ, em rút ra bài học gì cho tuổi trẻ của mình? (Trả lời ngắn gọn)", "answer": "Sống hết mình, trân trọng từng ngày, đừng lãng phí tuổi trẻ", "explain": "Chấp nhận các bài học: sống có ước mơ; yêu đời, yêu những điều giản dị; hành động ngay...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận văn học khoảng 200 chữ phân tích vẻ đẹp tâm hồn tuổi trẻ trong bài thơ trên.", "explain": "DÀN Ý:\n1. Mở đoạn: bài thơ là khúc ca tươi đẹp về tuổi trẻ.\n2. Thân đoạn: (a) Tuổi trẻ hiện lên tươi mới, rực rỡ qua hình ảnh so sánh (buổi sáng hồng, ngọn lửa hồng); (b) Thái độ sống tích cực: sống hết mình, cháy rực rỡ, trân trọng từng ngày; (c) Nghệ thuật: thể thơ giàu nhạc điệu, so sánh, ẩn dụ, điệp ngữ; (d) Liên hệ: gần gũi với tinh thần Vội vàng của Xuân Diệu.\n3. Kết đoạn: bài thơ khơi dậy khát vọng sống đẹp.\n\nBÀI MẪU:\nBài thơ là khúc ca tươi đẹp về tuổi trẻ, thể hiện một tâm hồn tràn đầy nhiệt huyết và khát vọng sống. Tuổi trẻ hiện lên thật rực rỡ qua những hình ảnh so sánh, ẩn dụ giàu sức gợi: như buổi sáng hồng tươi mới, như ngọn lửa hồng cháy rực rỡ giữa dòng đời. Đó là tuổi của ước mơ được chắp cánh bay cùng gió xuân, của niềm tin yêu cuộc sống. Điệp cấu trúc đừng để... ở khổ thơ thứ hai thể hiện giọng điệu khẩn thiết như một lời nhắn nhủ: đừng hững hờ để xuân qua, đừng đợi chờ mà hãy sống hết mình ngay hôm nay. Triết lí sống ấy thật đẹp: mỗi ngày là một món quà, mỗi sớm mai thức dậy ta thêm yêu đời, yêu cả những điều bé nhỏ, giản dị quanh mình. Về nghệ thuật, bài thơ có nhạc điệu trong sáng, ngôn ngữ giản dị mà giàu hình ảnh, biện pháp so sánh, điệp ngữ được sử dụng hiệu quả. Tinh thần sống gấp, trân trọng từng khoảnh khắc của bài thơ gợi nhớ đến Vội vàng của Xuân Diệu — nhà thơ của tình yêu tha thiết với cuộc sống. Bài thơ như một lời đánh thức: tuổi trẻ chỉ đến một lần, hãy sống sao cho xứng đáng với những năm tháng rực rỡ nhất của đời người.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ bàn về quan niệm sống của tuổi trẻ qua bài thơ Vội vàng của Xuân Diệu và bài thơ trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — quan niệm sống của tuổi trẻ trong thơ ca.\nII. Thân bài:\n1. Quan niệm sống trong Vội vàng (Xuân Diệu):\n   a. Tình yêu tha thiết với cuộc sống, với mùa xuân, tuổi trẻ.\n   b. Triết lí sống gấp: tận hưởng từng khoảnh khắc vì thời gian trôi nhanh.\n   c. Nghệ thuật: hình ảnh táo bạo, nhịp điệu gấp gáp.\n2. Quan niệm sống trong bài thơ trên:\n   a. Tuổi trẻ tươi đẹp như buổi sáng hồng, ngọn lửa hồng.\n   b. Lời nhắn nhủ: sống hết mình, trân trọng từng ngày.\n   c. Yêu cả những điều bé nhỏ, giản dị.\n3. So sánh:\n   a. Điểm giống: đều ca ngợi tuổi trẻ, kêu gọi sống trọn vẹn, trân trọng thời gian.\n   b. Điểm khác: Vội vàng nồng nàn, táo bạo, gấp gáp; bài thơ trên trong sáng, nhẹ nhàng, hướng tới sự an nhiên.\n4. Bài học cho tuổi trẻ hôm nay.\nIII. Kết bài: khẳng định giá trị; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nTuổi trẻ là đề tài muôn thuở của thơ ca, là nguồn cảm hứng bất tận cho các nhà thơ mọi thời đại. Xuân Diệu với Vội vàng đã thể hiện một quan niệm sống nồng nàn, gấp gáp: tận hưởng từng khoảnh khắc của tuổi xuân. Bài thơ Mùa xuân của tuổi trẻ cũng cất lên khúc ca về tuổi trẻ với lời nhắn nhủ hãy sống hết mình. So sánh hai bài thơ giúp ta hiểu sâu hơn quan niệm sống của tuổi trẻ qua các thời kì và rút ra bài học cho chính mình.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI ĐÀN ÔNG VÀ CƠN BÃO\n(Truyện ngắn tự sáng tác dùng làm ngữ liệu)\n\nÔng Sáu là ngư dân đã ngoài sáu mươi, cả đời gắn bó với biển. Mùa bão năm ấy, chiếc thuyền của ông bị sóng đánh vỡ khi đang trên đường vào bờ. Ông bám vào một tấm ván, lênh đênh giữa biển khơi suốt hai ngày đêm.\n\nĐói, khát, kiệt sức — nhưng ông Sáu không buông tay. Ông tự nhủ: Biển đã nuôi sống gia đình ta bao năm, biển không thể cướp đi mạng sống của ta dễ dàng như vậy. Ông hát những câu hò biển quen thuộc để giữ tỉnh táo, đếm từng con sóng để không ngủ quên.\n\nĐến rạng sáng ngày thứ ba, một chiếc tàu cứu hộ phát hiện ra ông. Người ta kinh ngạc khi thấy một ông lão gầy gò vẫn còn đủ sức vẫy tay cầu cứu sau hai ngày đêm vật lộn với biển cả.\n\nKhi được hỏi bí quyết, ông Sáu cười hiền: Tôi chẳng có bí quyết gì đâu. Chỉ là tôi nghĩ, mình còn vợ con đang chờ ở nhà, mình không được phép gục ngã. Con người ta, chỉ cần còn một lí do để sống thì sẽ tìm được sức mạnh để vượt qua tất cả.\n\nCâu 1. Truyện trên thuộc thể loại nào?", "options": ["A. Trữ tình", "B. Tự sự — kể lại câu chuyện về ông Sáu với cốt truyện, nhân vật, tình huống rõ ràng", "C. Kịch", "D. Kí"], "answer": "B", "explain": "Truyện có cốt truyện (gặp bão, vật lộn, được cứu), nhân vật (ông Sáu), người kể — đặc trưng của loại tự sự.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI ĐÀN ÔNG VÀ CƠN BÃO\n(Truyện ngắn tự sáng tác dùng làm ngữ liệu)\n\nÔng Sáu là ngư dân đã ngoài sáu mươi, cả đời gắn bó với biển. Mùa bão năm ấy, chiếc thuyền của ông bị sóng đánh vỡ khi đang trên đường vào bờ. Ông bám vào một tấm ván, lênh đênh giữa biển khơi suốt hai ngày đêm.\n\nĐói, khát, kiệt sức — nhưng ông Sáu không buông tay. Ông tự nhủ: Biển đã nuôi sống gia đình ta bao năm, biển không thể cướp đi mạng sống của ta dễ dàng như vậy. Ông hát những câu hò biển quen thuộc để giữ tỉnh táo, đếm từng con sóng để không ngủ quên.\n\nĐến rạng sáng ngày thứ ba, một chiếc tàu cứu hộ phát hiện ra ông. Người ta kinh ngạc khi thấy một ông lão gầy gò vẫn còn đủ sức vẫy tay cầu cứu sau hai ngày đêm vật lộn với biển cả.\n\nKhi được hỏi bí quyết, ông Sáu cười hiền: Tôi chẳng có bí quyết gì đâu. Chỉ là tôi nghĩ, mình còn vợ con đang chờ ở nhà, mình không được phép gục ngã. Con người ta, chỉ cần còn một lí do để sống thì sẽ tìm được sức mạnh để vượt qua tất cả.\n\nCâu 2. Tình huống truyện là gì?", "options": ["A. Ông Sáu đi chợ", "B. Thuyền bị bão đánh vỡ, ông Sáu bám ván lênh đênh giữa biển hai ngày đêm và được cứu", "C. Ông Sáu đánh cá", "D. Ông Sáu ở nhà"], "answer": "B", "explain": "Tình huống éo le: thuyền vỡ giữa bão, một mình chống chọi với biển khơi hai ngày đêm — thử thách khắc nghiệt bộc lộ phẩm chất nhân vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI ĐÀN ÔNG VÀ CƠN BÃO\n(Truyện ngắn tự sáng tác dùng làm ngữ liệu)\n\nÔng Sáu là ngư dân đã ngoài sáu mươi, cả đời gắn bó với biển. Mùa bão năm ấy, chiếc thuyền của ông bị sóng đánh vỡ khi đang trên đường vào bờ. Ông bám vào một tấm ván, lênh đênh giữa biển khơi suốt hai ngày đêm.\n\nĐói, khát, kiệt sức — nhưng ông Sáu không buông tay. Ông tự nhủ: Biển đã nuôi sống gia đình ta bao năm, biển không thể cướp đi mạng sống của ta dễ dàng như vậy. Ông hát những câu hò biển quen thuộc để giữ tỉnh táo, đếm từng con sóng để không ngủ quên.\n\nĐến rạng sáng ngày thứ ba, một chiếc tàu cứu hộ phát hiện ra ông. Người ta kinh ngạc khi thấy một ông lão gầy gò vẫn còn đủ sức vẫy tay cầu cứu sau hai ngày đêm vật lộn với biển cả.\n\nKhi được hỏi bí quyết, ông Sáu cười hiền: Tôi chẳng có bí quyết gì đâu. Chỉ là tôi nghĩ, mình còn vợ con đang chờ ở nhà, mình không được phép gục ngã. Con người ta, chỉ cần còn một lí do để sống thì sẽ tìm được sức mạnh để vượt qua tất cả.\n\nCâu 3. Điều gì giúp ông Sáu vượt qua hai ngày đêm giữa biển khơi?", "options": ["A. Sức khỏe tốt", "B. Ý chí kiên cường và tình yêu gia đình — nghĩ đến vợ con đang chờ nên không cho phép mình gục ngã", "C. May mắn", "D. Có người giúp"], "answer": "B", "explain": "Ông Sáu tự nhủ về vợ con đang chờ; ông khẳng định: chỉ cần còn một lí do để sống sẽ tìm được sức mạnh vượt qua tất cả — sức mạnh của ý chí và tình thân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI ĐÀN ÔNG VÀ CƠN BÃO\n(Truyện ngắn tự sáng tác dùng làm ngữ liệu)\n\nÔng Sáu là ngư dân đã ngoài sáu mươi, cả đời gắn bó với biển. Mùa bão năm ấy, chiếc thuyền của ông bị sóng đánh vỡ khi đang trên đường vào bờ. Ông bám vào một tấm ván, lênh đênh giữa biển khơi suốt hai ngày đêm.\n\nĐói, khát, kiệt sức — nhưng ông Sáu không buông tay. Ông tự nhủ: Biển đã nuôi sống gia đình ta bao năm, biển không thể cướp đi mạng sống của ta dễ dàng như vậy. Ông hát những câu hò biển quen thuộc để giữ tỉnh táo, đếm từng con sóng để không ngủ quên.\n\nĐến rạng sáng ngày thứ ba, một chiếc tàu cứu hộ phát hiện ra ông. Người ta kinh ngạc khi thấy một ông lão gầy gò vẫn còn đủ sức vẫy tay cầu cứu sau hai ngày đêm vật lộn với biển cả.\n\nKhi được hỏi bí quyết, ông Sáu cười hiền: Tôi chẳng có bí quyết gì đâu. Chỉ là tôi nghĩ, mình còn vợ con đang chờ ở nhà, mình không được phép gục ngã. Con người ta, chỉ cần còn một lí do để sống thì sẽ tìm được sức mạnh để vượt qua tất cả.\n\nCâu 4. Câu nói Con người ta, chỉ cần còn một lí do để sống thì sẽ tìm được sức mạnh để vượt qua tất cả thể hiện triết lí gì?", "options": ["A. Bi quan", "B. Triết lí kiên cường: con người có thể bị thử thách nhưng không bị đánh bại khi còn niềm tin và lí do để sống — gần với tinh thần Ông già và biển cả của Hê-minh-uê", "C. Yếu đuối", "D. Thờ ơ"], "answer": "B", "explain": "Triết lí về sức mạnh của ý chí con người trước thử thách — tương đồng với tư tưởng của Hê-minh-uê: con người có thể bị hủy diệt nhưng không thể bị đánh bại.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI ĐÀN ÔNG VÀ CƠN BÃO\n(Truyện ngắn tự sáng tác dùng làm ngữ liệu)\n\nÔng Sáu là ngư dân đã ngoài sáu mươi, cả đời gắn bó với biển. Mùa bão năm ấy, chiếc thuyền của ông bị sóng đánh vỡ khi đang trên đường vào bờ. Ông bám vào một tấm ván, lênh đênh giữa biển khơi suốt hai ngày đêm.\n\nĐói, khát, kiệt sức — nhưng ông Sáu không buông tay. Ông tự nhủ: Biển đã nuôi sống gia đình ta bao năm, biển không thể cướp đi mạng sống của ta dễ dàng như vậy. Ông hát những câu hò biển quen thuộc để giữ tỉnh táo, đếm từng con sóng để không ngủ quên.\n\nĐến rạng sáng ngày thứ ba, một chiếc tàu cứu hộ phát hiện ra ông. Người ta kinh ngạc khi thấy một ông lão gầy gò vẫn còn đủ sức vẫy tay cầu cứu sau hai ngày đêm vật lộn với biển cả.\n\nKhi được hỏi bí quyết, ông Sáu cười hiền: Tôi chẳng có bí quyết gì đâu. Chỉ là tôi nghĩ, mình còn vợ con đang chờ ở nhà, mình không được phép gục ngã. Con người ta, chỉ cần còn một lí do để sống thì sẽ tìm được sức mạnh để vượt qua tất cả.\n\nCâu 5. Qua câu chuyện ông Sáu, em rút ra bài học gì? (Trả lời ngắn gọn)", "answer": "Kiên cường, không gục ngã trước khó khăn; lấy tình thân làm động lực", "explain": "Chấp nhận các bài học: ý chí quyết định; có niềm tin sẽ vượt qua...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận văn học khoảng 200 chữ phân tích nhân vật ông Sáu.", "explain": "DÀN Ý:\n1. Mở đoạn: ông Sáu là hình tượng đẹp về con người lao động kiên cường.\n2. Thân đoạn: (a) Hoàn cảnh: ngư dân ngoài sáu mươi, thuyền vỡ giữa bão, lênh đênh hai ngày đêm; (b) Phẩm chất: ý chí kiên cường (không buông tay), lạc quan (hát hò biển), tình yêu gia đình (nghĩ đến vợ con); (c) Nghệ thuật: tình huống thử thách, lời thoại, lời kể giản dị; (d) Triết lí: sức mạnh của niềm tin.\n3. Kết đoạn: nhân vật khơi dậy niềm tin vào con người.\n\nBÀI MẪU:\nÔng Sáu là hình tượng đẹp về con người lao động Việt Nam kiên cường, giàu tình cảm. Đặt nhân vật vào tình huống thử thách nghiệt ngã — thuyền bị bão đánh vỡ, một mình bám ván lênh đênh giữa biển khơi suốt hai ngày đêm, đói khát kiệt sức — tác giả đã làm nổi bật phẩm chất phi thường của một con người bình thường. Trước hết, ông Sáu có ý chí kiên cường: dù kiệt sức vẫn không buông tay, hát hò biển để giữ tỉnh táo, đếm từng con sóng để không ngủ quên. Sâu xa hơn, sức mạnh ấy bắt nguồn từ tình yêu gia đình: nghĩ đến vợ con đang chờ ở nhà, ông không cho phép mình gục ngã. Câu nói giản dị mà triết lí — chỉ cần còn một lí do để sống thì sẽ tìm được sức mạnh vượt qua tất cả — đã khái quát vẻ đẹp tâm hồn nhân vật. Nghệ thuật xây dựng nhân vật giản dị mà hiệu quả: tình huống éo le, lời thoại mộc mạc, lời kể chân thực. Hình tượng ông Sáu gợi nhớ ông lão San-ti-a-gô trong Ông già và biển cả của Hê-minh-uê với triết lí: con người có thể bị hủy diệt nhưng không thể bị đánh bại. Qua nhân vật, tác giả khơi dậy ở người đọc niềm tin vào sức mạnh của ý chí và tình người.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về ý chí, nghị lực của con người trong cuộc sống.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — ý chí, nghị lực: sức mạnh giúp con người vượt qua thử thách.\nII. Thân bài:\n1. Giải thích: ý chí, nghị lực là gì.\n2. Biểu hiện:\n   a. Kiên trì theo đuổi mục tiêu.\n   b. Không gục ngã trước thất bại (dẫn chứng: ông Sáu; tấm gương người khuyết tật vươn lên; nhà khoa học...).\n3. Vai trò: giúp vượt qua khó khăn; đạt thành công; truyền cảm hứng.\n4. Phê phán: thói nản chí, bỏ cuộc; ỷ lại.\n5. Bài học: rèn luyện ý chí từ việc nhỏ; lấy gia đình, ước mơ làm động lực.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nTrong cuộc đời, ai cũng phải đối mặt với khó khăn, thử thách. Có người gục ngã, có người vươn lên — điều làm nên sự khác biệt chính là ý chí, nghị lực. Ông Sáu trong câu chuyện trên đã bám ván lênh đênh giữa biển hai ngày đêm mà không buông xuôi, chỉ vì trong lòng còn một lí do để sống. Câu chuyện ấy nhắc nhở chúng ta về sức mạnh kì diệu của ý chí con người — sức mạnh có thể giúp ta vượt qua mọi giông bão của cuộc đời.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLỰA CHỌN\n(Trích kịch bản tự sáng tác dùng làm ngữ liệu)\n\nCảnh: Phòng khách gia đình. Tối. AN (học sinh lớp 12) đứng trước BỐ.\n\nBỐ: (nghiêm giọng) Bố đã quyết định rồi. Con sẽ thi vào trường kinh tế như anh con. Đừng cãi.\n\nAN: Nhưng bố ơi, con thích vẽ. Con muốn thi vào trường mĩ thuật. Đó là ước mơ của con từ nhỏ.\n\nBỐ: Ước mơ? Ước mơ có nuôi sống được con không? Nhìn anh con kìa, ra trường có việc làm ngay, lương cao. Vẽ vời thì làm được gì?\n\nAN: (xúc động) Bố ơi, mỗi người có một con đường. Anh Hai hợp với kinh tế, còn con... con chỉ sống thật với mình khi được cầm cọ. Bố cho con một cơ hội được không?\n\nBỐ: (lặng đi một lúc) Bố... bố chỉ sợ con khổ. Ngày xưa bố cũng từng có ước mơ, nhưng rồi bố phải gác lại để lo cho gia đình.\n\nAN: Con hiểu bố lo cho con. Nhưng bố ơi, sống mà phải từ bỏ ước mơ thì có khác gì cái xác không hồn? Con hứa sẽ cố gắng hết mình.\n\nBỐ: (thở dài, giọng trùng xuống) Thôi được... Bố cho con một năm. Nếu không đỗ trường mĩ thuật, con phải nghe lời bố.\n\nAN: (ôm chầm lấy bố) Con cảm ơn bố! Con sẽ không làm bố thất vọng!\n\nCâu 1. Đoạn trích trên thuộc thể loại nào?", "options": ["A. Thơ trữ tình", "B. Kịch — có phân cảnh, nhân vật đối thoại, xung đột, chỉ dẫn sân khấu", "C. Truyện ngắn", "D. Tùy bút"], "answer": "B", "explain": "Đoạn trích có phân cảnh, lời thoại nhân vật, chỉ dẫn sân khấu trong ngoặc đơn — đặc trưng của kịch bản.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLỰA CHỌN\n(Trích kịch bản tự sáng tác dùng làm ngữ liệu)\n\nCảnh: Phòng khách gia đình. Tối. AN (học sinh lớp 12) đứng trước BỐ.\n\nBỐ: (nghiêm giọng) Bố đã quyết định rồi. Con sẽ thi vào trường kinh tế như anh con. Đừng cãi.\n\nAN: Nhưng bố ơi, con thích vẽ. Con muốn thi vào trường mĩ thuật. Đó là ước mơ của con từ nhỏ.\n\nBỐ: Ước mơ? Ước mơ có nuôi sống được con không? Nhìn anh con kìa, ra trường có việc làm ngay, lương cao. Vẽ vời thì làm được gì?\n\nAN: (xúc động) Bố ơi, mỗi người có một con đường. Anh Hai hợp với kinh tế, còn con... con chỉ sống thật với mình khi được cầm cọ. Bố cho con một cơ hội được không?\n\nBỐ: (lặng đi một lúc) Bố... bố chỉ sợ con khổ. Ngày xưa bố cũng từng có ước mơ, nhưng rồi bố phải gác lại để lo cho gia đình.\n\nAN: Con hiểu bố lo cho con. Nhưng bố ơi, sống mà phải từ bỏ ước mơ thì có khác gì cái xác không hồn? Con hứa sẽ cố gắng hết mình.\n\nBỐ: (thở dài, giọng trùng xuống) Thôi được... Bố cho con một năm. Nếu không đỗ trường mĩ thuật, con phải nghe lời bố.\n\nAN: (ôm chầm lấy bố) Con cảm ơn bố! Con sẽ không làm bố thất vọng!\n\nCâu 2. Xung đột kịch trong đoạn trích là gì?", "options": ["A. Xung đột giữa hai anh em", "B. Xung đột giữa người bố (muốn con thi kinh tế vì thực tế) và An (muốn theo đuổi ước mơ mĩ thuật)", "C. Xung đột với nhà trường", "D. Không có xung đột"], "answer": "B", "explain": "Xung đột giữa quan niệm thực tế của người bố và khát vọng theo đuổi ước mơ của người con — xung đột thế hệ, xung đột giữa ước mơ và thực tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLỰA CHỌN\n(Trích kịch bản tự sáng tác dùng làm ngữ liệu)\n\nCảnh: Phòng khách gia đình. Tối. AN (học sinh lớp 12) đứng trước BỐ.\n\nBỐ: (nghiêm giọng) Bố đã quyết định rồi. Con sẽ thi vào trường kinh tế như anh con. Đừng cãi.\n\nAN: Nhưng bố ơi, con thích vẽ. Con muốn thi vào trường mĩ thuật. Đó là ước mơ của con từ nhỏ.\n\nBỐ: Ước mơ? Ước mơ có nuôi sống được con không? Nhìn anh con kìa, ra trường có việc làm ngay, lương cao. Vẽ vời thì làm được gì?\n\nAN: (xúc động) Bố ơi, mỗi người có một con đường. Anh Hai hợp với kinh tế, còn con... con chỉ sống thật với mình khi được cầm cọ. Bố cho con một cơ hội được không?\n\nBỐ: (lặng đi một lúc) Bố... bố chỉ sợ con khổ. Ngày xưa bố cũng từng có ước mơ, nhưng rồi bố phải gác lại để lo cho gia đình.\n\nAN: Con hiểu bố lo cho con. Nhưng bố ơi, sống mà phải từ bỏ ước mơ thì có khác gì cái xác không hồn? Con hứa sẽ cố gắng hết mình.\n\nBỐ: (thở dài, giọng trùng xuống) Thôi được... Bố cho con một năm. Nếu không đỗ trường mĩ thuật, con phải nghe lời bố.\n\nAN: (ôm chầm lấy bố) Con cảm ơn bố! Con sẽ không làm bố thất vọng!\n\nCâu 3. Câu nói Sống mà phải từ bỏ ước mơ thì có khác gì cái xác không hồn của An thể hiện điều gì?", "options": ["A. Sự hỗn láo", "B. Khát vọng được sống thật với chính mình, quyết tâm theo đuổi ước mơ — lập luận chân thành, có sức thuyết phục", "C. Sự tuyệt vọng", "D. Sự đầu hàng"], "answer": "B", "explain": "Câu nói dùng so sánh mạnh mẽ để khẳng định khát vọng sống thật với mình — lập luận chân thành khiến người bố phải suy nghĩ lại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLỰA CHỌN\n(Trích kịch bản tự sáng tác dùng làm ngữ liệu)\n\nCảnh: Phòng khách gia đình. Tối. AN (học sinh lớp 12) đứng trước BỐ.\n\nBỐ: (nghiêm giọng) Bố đã quyết định rồi. Con sẽ thi vào trường kinh tế như anh con. Đừng cãi.\n\nAN: Nhưng bố ơi, con thích vẽ. Con muốn thi vào trường mĩ thuật. Đó là ước mơ của con từ nhỏ.\n\nBỐ: Ước mơ? Ước mơ có nuôi sống được con không? Nhìn anh con kìa, ra trường có việc làm ngay, lương cao. Vẽ vời thì làm được gì?\n\nAN: (xúc động) Bố ơi, mỗi người có một con đường. Anh Hai hợp với kinh tế, còn con... con chỉ sống thật với mình khi được cầm cọ. Bố cho con một cơ hội được không?\n\nBỐ: (lặng đi một lúc) Bố... bố chỉ sợ con khổ. Ngày xưa bố cũng từng có ước mơ, nhưng rồi bố phải gác lại để lo cho gia đình.\n\nAN: Con hiểu bố lo cho con. Nhưng bố ơi, sống mà phải từ bỏ ước mơ thì có khác gì cái xác không hồn? Con hứa sẽ cố gắng hết mình.\n\nBỐ: (thở dài, giọng trùng xuống) Thôi được... Bố cho con một năm. Nếu không đỗ trường mĩ thuật, con phải nghe lời bố.\n\nAN: (ôm chầm lấy bố) Con cảm ơn bố! Con sẽ không làm bố thất vọng!\n\nCâu 4. Chi tiết người bố từng phải gác lại ước mơ có tác dụng gì?", "options": ["A. Không có tác dụng", "B. Lí giải nguyên nhân sâu xa của sự nghiêm khắc: bố lo con khổ vì từng trải qua; đồng thời tạo sự đồng cảm, làm mềm xung đột, dẫn đến cái kết có hậu", "C. Làm bố xấu đi", "D. Thừa thãi"], "answer": "B", "explain": "Chi tiết hé lộ quá khứ của người bố: sự nghiêm khắc xuất phát từ tình thương và nỗi lo — tạo chiều sâu nhân vật, hóa giải xung đột một cách hợp lí.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLỰA CHỌN\n(Trích kịch bản tự sáng tác dùng làm ngữ liệu)\n\nCảnh: Phòng khách gia đình. Tối. AN (học sinh lớp 12) đứng trước BỐ.\n\nBỐ: (nghiêm giọng) Bố đã quyết định rồi. Con sẽ thi vào trường kinh tế như anh con. Đừng cãi.\n\nAN: Nhưng bố ơi, con thích vẽ. Con muốn thi vào trường mĩ thuật. Đó là ước mơ của con từ nhỏ.\n\nBỐ: Ước mơ? Ước mơ có nuôi sống được con không? Nhìn anh con kìa, ra trường có việc làm ngay, lương cao. Vẽ vời thì làm được gì?\n\nAN: (xúc động) Bố ơi, mỗi người có một con đường. Anh Hai hợp với kinh tế, còn con... con chỉ sống thật với mình khi được cầm cọ. Bố cho con một cơ hội được không?\n\nBỐ: (lặng đi một lúc) Bố... bố chỉ sợ con khổ. Ngày xưa bố cũng từng có ước mơ, nhưng rồi bố phải gác lại để lo cho gia đình.\n\nAN: Con hiểu bố lo cho con. Nhưng bố ơi, sống mà phải từ bỏ ước mơ thì có khác gì cái xác không hồn? Con hứa sẽ cố gắng hết mình.\n\nBỐ: (thở dài, giọng trùng xuống) Thôi được... Bố cho con một năm. Nếu không đỗ trường mĩ thuật, con phải nghe lời bố.\n\nAN: (ôm chầm lấy bố) Con cảm ơn bố! Con sẽ không làm bố thất vọng!\n\nCâu 5. Qua đoạn kịch, em hiểu gì về cách giải quyết mâu thuẫn trong gia đình? (Trả lời ngắn gọn)", "answer": "Cần đối thoại chân thành, lắng nghe và thấu hiểu nhau", "explain": "Chấp nhận các cách hiểu: cha mẹ nên tôn trọng ước mơ của con; con cái cần thuyết phục bằng quyết tâm...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận văn học khoảng 200 chữ phân tích xung đột kịch trong đoạn trích trên.", "explain": "DÀN Ý:\n1. Mở đoạn: xung đột là linh hồn của kịch; đoạn trích xây dựng xung đột hấp dẫn.\n2. Thân đoạn: (a) Xung đột giữa bố và An: thực tế vs ước mơ; (b) Diễn biến: bố áp đặt — An thuyết phục — bố hé lộ quá khứ — bố nhượng bộ có điều kiện; (c) Nghệ thuật: đối thoại, chỉ dẫn sân khấu, chi tiết quá khứ của bố; (d) Ý nghĩa: xung đột thế hệ, bài học về thấu hiểu.\n3. Kết đoạn: xung đột được hóa giải nhân văn.\n\nBÀI MẪU:\nXung đột là linh hồn của kịch, và đoạn trích đã xây dựng một xung đột gần gũi, hấp dẫn: mâu thuẫn giữa người bố muốn con thi trường kinh tế vì lí do thực tế và An khát khao theo đuổi ước mơ mĩ thuật. Đây là xung đột giữa hai thế hệ, giữa ước mơ và thực tế cơm áo — vấn đề muôn thuở trong nhiều gia đình. Xung đột phát triển qua các lớp lang: ban đầu người bố áp đặt quyết định một cách nghiêm khắc; An không cãi vã mà thuyết phục bằng tình cảm chân thành, bằng câu nói giàu sức nặng: sống mà phải từ bỏ ước mơ thì có khác gì cái xác không hồn. Bước ngoặt đến khi người bố hé lộ quá khứ: ông cũng từng có ước mơ nhưng phải gác lại — chi tiết này lí giải sự nghiêm khắc của ông xuất phát từ tình thương và nỗi lo con khổ, đồng thời tạo sự đồng cảm. Xung đột được hóa giải nhân văn: người bố cho con một năm thử sức có điều kiện. Nghệ thuật thể hiện xung đột chủ yếu qua đối thoại — lời thoại tự nhiên, có tính cách — kết hợp chỉ dẫn sân khấu tinh tế (lặng đi, thở dài, giọng trùng xuống) khắc họa diễn biến tâm lí. Đoạn kịch gợi nhớ Hồn Trương Ba, da hàng thịt của Lưu Quang Vũ ở khát vọng được sống thật với chính mình. Qua xung đột, tác giả gửi gắm thông điệp: trong gia đình, chỉ có đối thoại chân thành và sự thấu hiểu mới hóa giải được mâu thuẫn.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về mối quan hệ giữa ước mơ và thực tế trong lựa chọn nghề nghiệp của tuổi trẻ.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — chọn nghề: ước mơ hay thực tế.\nII. Thân bài:\n1. Ước mơ có vai trò quan trọng: là động lực, giúp sống có ý nghĩa.\n2. Thực tế không thể xem nhẹ: việc làm, thu nhập, năng lực bản thân.\n3. Mối quan hệ: ước mơ cần gắn với thực tế; thực tế cần được soi sáng bởi ước mơ.\n4. Thực trạng: nhiều bạn chọn nghề theo phong trào, theo ý cha mẹ mà bỏ qua năng lực, sở thích; hoặc mơ mộng viển vông.\n5. Giải pháp: hiểu mình (sở thích, năng lực); tìm hiểu nghề; lắng nghe tư vấn; dám thử sức có trách nhiệm.\n6. Phê phán: thói chạy theo nghề hot; ép buộc con cái.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nĐứng trước ngưỡng cửa cuộc đời, mỗi học sinh lớp 12 đều phải đối mặt với câu hỏi lớn: chọn nghề theo ước mơ hay theo thực tế? An trong đoạn kịch trên đã dũng cảm bảo vệ ước mơ mĩ thuật trước sự áp đặt của người bố. Câu chuyện ấy phản ánh một vấn đề nóng bỏng của tuổi trẻ hôm nay: làm thế nào để hài hòa giữa khát vọng của trái tim và những đòi hỏi của thực tế khi lựa chọn con đường tương lai.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHỤ NỮ VÀ VẤN ĐỀ BẢO VỆ MÔI TRƯỜNG\n\nTrong cuộc chiến bảo vệ môi trường, phụ nữ đang đóng vai trò ngày càng quan trọng. Nhiều nghiên cứu cho thấy phụ nữ thường có ý thức bảo vệ môi trường cao hơn: họ là người trực tiếp quản lí việc tiêu dùng trong gia đình, quyết định phần lớn những gì được mua, được thải ra mỗi ngày.\n\nTrên thế giới, nhiều phong trào môi trường lớn do phụ nữ khởi xướng và dẫn dắt. Ở một số quốc gia châu Phi, phụ nữ đã trồng hàng triệu cây xanh để chống sa mạc hóa. Ở Việt Nam, nhiều chị em phụ nữ nông thôn đi đầu trong phong trào phân loại rác thải, ủ phân hữu cơ, trồng rau sạch.\n\nCác nhà khoa học lí giải: phụ nữ gắn bó mật thiết với thiên nhiên qua vai trò chăm sóc gia đình; họ nhạy cảm hơn với những thay đổi của môi trường sống và lo lắng nhiều hơn cho tương lai của con cháu. Vì vậy, trao quyền cho phụ nữ cũng chính là tăng cường sức mạnh cho công cuộc bảo vệ môi trường.\n\nTuy nhiên, phụ nữ — nhất là ở vùng khó khăn — cũng là đối tượng chịu ảnh hưởng nặng nề nhất của ô nhiễm môi trường và biến đổi khí hậu: thiếu nước sạch, gánh nặng mưu sinh tăng lên khi thiên tai xảy ra.\n\nBảo vệ môi trường cần sự chung tay của tất cả mọi người, trong đó vai trò của phụ nữ cần được ghi nhận và phát huy xứng đáng. Mỗi người phụ nữ hành động vì môi trường hôm nay là đang gieo mầm xanh cho tương lai mai sau.\n\nCâu 1. Văn bản trên thuộc loại nào?", "options": ["A. Văn bản văn học", "B. Văn bản thông tin — cung cấp tri thức về vai trò của phụ nữ trong bảo vệ môi trường một cách khách quan", "C. Văn bản nghị luận", "D. Văn bản hành chính"], "answer": "B", "explain": "Văn bản cung cấp tri thức, số liệu, phân tích một cách khách quan — đặc trưng của văn bản thông tin.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHỤ NỮ VÀ VẤN ĐỀ BẢO VỆ MÔI TRƯỜNG\n\nTrong cuộc chiến bảo vệ môi trường, phụ nữ đang đóng vai trò ngày càng quan trọng. Nhiều nghiên cứu cho thấy phụ nữ thường có ý thức bảo vệ môi trường cao hơn: họ là người trực tiếp quản lí việc tiêu dùng trong gia đình, quyết định phần lớn những gì được mua, được thải ra mỗi ngày.\n\nTrên thế giới, nhiều phong trào môi trường lớn do phụ nữ khởi xướng và dẫn dắt. Ở một số quốc gia châu Phi, phụ nữ đã trồng hàng triệu cây xanh để chống sa mạc hóa. Ở Việt Nam, nhiều chị em phụ nữ nông thôn đi đầu trong phong trào phân loại rác thải, ủ phân hữu cơ, trồng rau sạch.\n\nCác nhà khoa học lí giải: phụ nữ gắn bó mật thiết với thiên nhiên qua vai trò chăm sóc gia đình; họ nhạy cảm hơn với những thay đổi của môi trường sống và lo lắng nhiều hơn cho tương lai của con cháu. Vì vậy, trao quyền cho phụ nữ cũng chính là tăng cường sức mạnh cho công cuộc bảo vệ môi trường.\n\nTuy nhiên, phụ nữ — nhất là ở vùng khó khăn — cũng là đối tượng chịu ảnh hưởng nặng nề nhất của ô nhiễm môi trường và biến đổi khí hậu: thiếu nước sạch, gánh nặng mưu sinh tăng lên khi thiên tai xảy ra.\n\nBảo vệ môi trường cần sự chung tay của tất cả mọi người, trong đó vai trò của phụ nữ cần được ghi nhận và phát huy xứng đáng. Mỗi người phụ nữ hành động vì môi trường hôm nay là đang gieo mầm xanh cho tương lai mai sau.\n\nCâu 2. Vì sao phụ nữ có ý thức bảo vệ môi trường cao?", "options": ["A. Ngẫu nhiên", "B. Họ trực tiếp quản lí tiêu dùng gia đình, gắn bó với thiên nhiên qua vai trò chăm sóc, nhạy cảm với thay đổi môi trường và lo cho tương lai con cháu", "C. Vì rảnh rỗi", "D. Vì bị ép buộc"], "answer": "B", "explain": "Văn bản phân tích nguyên nhân: vai trò quản lí tiêu dùng, sự gắn bó với thiên nhiên, sự nhạy cảm và trách nhiệm với tương lai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHỤ NỮ VÀ VẤN ĐỀ BẢO VỆ MÔI TRƯỜNG\n\nTrong cuộc chiến bảo vệ môi trường, phụ nữ đang đóng vai trò ngày càng quan trọng. Nhiều nghiên cứu cho thấy phụ nữ thường có ý thức bảo vệ môi trường cao hơn: họ là người trực tiếp quản lí việc tiêu dùng trong gia đình, quyết định phần lớn những gì được mua, được thải ra mỗi ngày.\n\nTrên thế giới, nhiều phong trào môi trường lớn do phụ nữ khởi xướng và dẫn dắt. Ở một số quốc gia châu Phi, phụ nữ đã trồng hàng triệu cây xanh để chống sa mạc hóa. Ở Việt Nam, nhiều chị em phụ nữ nông thôn đi đầu trong phong trào phân loại rác thải, ủ phân hữu cơ, trồng rau sạch.\n\nCác nhà khoa học lí giải: phụ nữ gắn bó mật thiết với thiên nhiên qua vai trò chăm sóc gia đình; họ nhạy cảm hơn với những thay đổi của môi trường sống và lo lắng nhiều hơn cho tương lai của con cháu. Vì vậy, trao quyền cho phụ nữ cũng chính là tăng cường sức mạnh cho công cuộc bảo vệ môi trường.\n\nTuy nhiên, phụ nữ — nhất là ở vùng khó khăn — cũng là đối tượng chịu ảnh hưởng nặng nề nhất của ô nhiễm môi trường và biến đổi khí hậu: thiếu nước sạch, gánh nặng mưu sinh tăng lên khi thiên tai xảy ra.\n\nBảo vệ môi trường cần sự chung tay của tất cả mọi người, trong đó vai trò của phụ nữ cần được ghi nhận và phát huy xứng đáng. Mỗi người phụ nữ hành động vì môi trường hôm nay là đang gieo mầm xanh cho tương lai mai sau.\n\nCâu 3. Dẫn chứng nào cho thấy vai trò của phụ nữ trong bảo vệ môi trường?", "options": ["A. Không có dẫn chứng", "B. Phụ nữ châu Phi trồng hàng triệu cây chống sa mạc hóa; phụ nữ nông thôn Việt Nam đi đầu phân loại rác, ủ phân hữu cơ, trồng rau sạch", "C. Phụ nữ thích hoa", "D. Phụ nữ nấu ăn"], "answer": "B", "explain": "Văn bản đưa dẫn chứng cụ thể trong nước và quốc tế — cách dùng dữ liệu, dẫn chứng của văn bản thông tin.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHỤ NỮ VÀ VẤN ĐỀ BẢO VỆ MÔI TRƯỜNG\n\nTrong cuộc chiến bảo vệ môi trường, phụ nữ đang đóng vai trò ngày càng quan trọng. Nhiều nghiên cứu cho thấy phụ nữ thường có ý thức bảo vệ môi trường cao hơn: họ là người trực tiếp quản lí việc tiêu dùng trong gia đình, quyết định phần lớn những gì được mua, được thải ra mỗi ngày.\n\nTrên thế giới, nhiều phong trào môi trường lớn do phụ nữ khởi xướng và dẫn dắt. Ở một số quốc gia châu Phi, phụ nữ đã trồng hàng triệu cây xanh để chống sa mạc hóa. Ở Việt Nam, nhiều chị em phụ nữ nông thôn đi đầu trong phong trào phân loại rác thải, ủ phân hữu cơ, trồng rau sạch.\n\nCác nhà khoa học lí giải: phụ nữ gắn bó mật thiết với thiên nhiên qua vai trò chăm sóc gia đình; họ nhạy cảm hơn với những thay đổi của môi trường sống và lo lắng nhiều hơn cho tương lai của con cháu. Vì vậy, trao quyền cho phụ nữ cũng chính là tăng cường sức mạnh cho công cuộc bảo vệ môi trường.\n\nTuy nhiên, phụ nữ — nhất là ở vùng khó khăn — cũng là đối tượng chịu ảnh hưởng nặng nề nhất của ô nhiễm môi trường và biến đổi khí hậu: thiếu nước sạch, gánh nặng mưu sinh tăng lên khi thiên tai xảy ra.\n\nBảo vệ môi trường cần sự chung tay của tất cả mọi người, trong đó vai trò của phụ nữ cần được ghi nhận và phát huy xứng đáng. Mỗi người phụ nữ hành động vì môi trường hôm nay là đang gieo mầm xanh cho tương lai mai sau.\n\nCâu 4. Nghịch lí nào được nêu về phụ nữ và môi trường?", "options": ["A. Không có nghịch lí", "B. Phụ nữ đóng vai trò quan trọng trong bảo vệ môi trường nhưng cũng là đối tượng chịu ảnh hưởng nặng nề nhất của ô nhiễm và biến đổi khí hậu", "C. Phụ nữ không quan tâm", "D. Phụ nữ gây ô nhiễm"], "answer": "B", "explain": "Văn bản chỉ ra nghịch lí: vừa là lực lượng bảo vệ môi trường, vừa là nạn nhân nặng nề nhất — cách nhìn đa chiều, sâu sắc.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHỤ NỮ VÀ VẤN ĐỀ BẢO VỆ MÔI TRƯỜNG\n\nTrong cuộc chiến bảo vệ môi trường, phụ nữ đang đóng vai trò ngày càng quan trọng. Nhiều nghiên cứu cho thấy phụ nữ thường có ý thức bảo vệ môi trường cao hơn: họ là người trực tiếp quản lí việc tiêu dùng trong gia đình, quyết định phần lớn những gì được mua, được thải ra mỗi ngày.\n\nTrên thế giới, nhiều phong trào môi trường lớn do phụ nữ khởi xướng và dẫn dắt. Ở một số quốc gia châu Phi, phụ nữ đã trồng hàng triệu cây xanh để chống sa mạc hóa. Ở Việt Nam, nhiều chị em phụ nữ nông thôn đi đầu trong phong trào phân loại rác thải, ủ phân hữu cơ, trồng rau sạch.\n\nCác nhà khoa học lí giải: phụ nữ gắn bó mật thiết với thiên nhiên qua vai trò chăm sóc gia đình; họ nhạy cảm hơn với những thay đổi của môi trường sống và lo lắng nhiều hơn cho tương lai của con cháu. Vì vậy, trao quyền cho phụ nữ cũng chính là tăng cường sức mạnh cho công cuộc bảo vệ môi trường.\n\nTuy nhiên, phụ nữ — nhất là ở vùng khó khăn — cũng là đối tượng chịu ảnh hưởng nặng nề nhất của ô nhiễm môi trường và biến đổi khí hậu: thiếu nước sạch, gánh nặng mưu sinh tăng lên khi thiên tai xảy ra.\n\nBảo vệ môi trường cần sự chung tay của tất cả mọi người, trong đó vai trò của phụ nữ cần được ghi nhận và phát huy xứng đáng. Mỗi người phụ nữ hành động vì môi trường hôm nay là đang gieo mầm xanh cho tương lai mai sau.\n\nCâu 5. Theo em, cần làm gì để phát huy vai trò của phụ nữ trong bảo vệ môi trường? (Trả lời ngắn gọn)", "answer": "Trao quyền, tạo điều kiện, ghi nhận đóng góp của phụ nữ", "explain": "Chấp nhận các cách: hỗ trợ phụ nữ vùng khó khăn; tuyên truyền; tạo phong trào...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của phụ nữ trong bảo vệ môi trường.", "explain": "DÀN Ý:\n1. Mở đoạn: phụ nữ đóng vai trò ngày càng quan trọng trong bảo vệ môi trường.\n2. Thân đoạn: (a) Lí do: quản lí tiêu dùng gia đình, gắn bó thiên nhiên, nhạy cảm, lo cho tương lai; (b) Dẫn chứng: phụ nữ châu Phi trồng hàng triệu cây; phụ nữ Việt Nam phân loại rác, trồng rau sạch; (c) Nghịch lí: vừa bảo vệ vừa là nạn nhân nặng nề nhất; (d) Cần trao quyền, ghi nhận.\n3. Kết đoạn: phát huy vai trò của phụ nữ.\n\nBÀI MẪU:\nTrong cuộc chiến bảo vệ môi trường, phụ nữ đang đóng vai trò ngày càng quan trọng và cần được ghi nhận xứng đáng. Nhiều nghiên cứu cho thấy phụ nữ thường có ý thức môi trường cao hơn nam giới, bởi họ là người trực tiếp quản lí việc tiêu dùng trong gia đình — quyết định phần lớn những gì được mua và thải ra mỗi ngày; họ gắn bó mật thiết với thiên nhiên qua vai trò chăm sóc gia đình, nhạy cảm hơn với những thay đổi của môi trường sống và lo lắng nhiều hơn cho tương lai con cháu. Thực tế đã chứng minh: phụ nữ ở một số quốc gia châu Phi đã trồng hàng triệu cây xanh chống sa mạc hóa; ở Việt Nam, nhiều chị em nông thôn đi đầu trong phân loại rác thải, ủ phân hữu cơ, trồng rau sạch. Tuy nhiên, tồn tại một nghịch lí đáng suy ngẫm: phụ nữ vừa là lực lượng tích cực bảo vệ môi trường, vừa là đối tượng chịu ảnh hưởng nặng nề nhất của ô nhiễm và biến đổi khí hậu, nhất là ở vùng khó khăn. Vì vậy, trao quyền cho phụ nữ — tạo điều kiện, hỗ trợ và ghi nhận đóng góp của họ — cũng chính là tăng cường sức mạnh cho công cuộc bảo vệ môi trường. Mỗi người phụ nữ hành động vì môi trường hôm nay là đang gieo mầm xanh cho tương lai mai sau.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về vai trò của người phụ nữ trong xã hội hiện đại.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — vai trò của phụ nữ ngày càng được khẳng định.\nII. Thân bài:\n1. Vai trò trong gia đình: người giữ lửa, chăm sóc, giáo dục con cái.\n2. Vai trò trong xã hội:\n   a. Tham gia mọi lĩnh vực: khoa học, kinh doanh, chính trị.\n   b. Đi đầu trong bảo vệ môi trường, hoạt động cộng đồng.\n   c. Dẫn chứng: nữ khoa học, nữ doanh nhân, nữ lãnh đạo...\n3. Những thách thức: định kiến giới; gánh nặng việc nhà; là nạn nhân của ô nhiễm, bạo lực.\n4. Giải pháp: bình đẳng giới thực chất; chia sẻ việc nhà; bảo vệ quyền phụ nữ.\n5. Phê phán: tư tưởng trọng nam khinh nữ; bạo lực gia đình.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nTừ bao đời nay, người phụ nữ Việt Nam được ca ngợi với những phẩm chất cao đẹp: đảm đang, nhân hậu, kiên cường. Trong xã hội hiện đại, vai trò của phụ nữ càng được khẳng định mạnh mẽ: họ không chỉ là người giữ lửa trong gia đình mà còn tham gia tích cực vào mọi lĩnh vực của đời sống xã hội, từ khoa học, kinh doanh đến bảo vệ môi trường. Tôn vinh và phát huy vai trò của phụ nữ là yêu cầu của một xã hội văn minh, tiến bộ.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVỀ THĂM QUÊ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nCon về thăm lại quê xưa,\nCon đò còn đó, sớm trưa đợi người.\nCây đa, bến nước, sân chơi,\nTuổi thơ con gửi một thời đã xa.\n\nMẹ giờ tóc đã pha sương,\nNụ cười vẫn ấm như hương lúa đồng.\nCha ngồi vá lại lưới chài,\nBóng chiều in xuống bờ vai hao gầy.\n\nQuê hương hai tiếng thiêng liêng,\nĐi xa mới thấm nỗi niềm nhớ thương.\nDù đời xuôi ngược muôn phương,\nLòng con vẫn hướng về đường quê xưa.\n\nCâu 1. Thể thơ của bài thơ trên là gì?", "options": ["A. Thơ tự do", "B. Lục bát — mỗi cặp câu gồm câu 6 chữ và câu 8 chữ, hiệp vần chân", "C. Thất ngôn bát cú", "D. Song thất lục bát"], "answer": "B", "explain": "Bài thơ viết theo thể lục bát truyền thống: cặp câu 6–8, vần chân — thể thơ đậm đà bản sắc dân tộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVỀ THĂM QUÊ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nCon về thăm lại quê xưa,\nCon đò còn đó, sớm trưa đợi người.\nCây đa, bến nước, sân chơi,\nTuổi thơ con gửi một thời đã xa.\n\nMẹ giờ tóc đã pha sương,\nNụ cười vẫn ấm như hương lúa đồng.\nCha ngồi vá lại lưới chài,\nBóng chiều in xuống bờ vai hao gầy.\n\nQuê hương hai tiếng thiêng liêng,\nĐi xa mới thấm nỗi niềm nhớ thương.\nDù đời xuôi ngược muôn phương,\nLòng con vẫn hướng về đường quê xưa.\n\nCâu 2. Những hình ảnh quê hương nào xuất hiện trong bài thơ?", "options": ["A. Nhà cao tầng", "B. Con đò, cây đa, bến nước, sân chơi, hương lúa đồng — những hình ảnh quen thuộc của làng quê Việt Nam", "C. Phố xá", "D. Siêu thị"], "answer": "B", "explain": "Các hình ảnh con đò, cây đa, bến nước, hương lúa là biểu tượng quen thuộc của làng quê Việt Nam trong thơ ca.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVỀ THĂM QUÊ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nCon về thăm lại quê xưa,\nCon đò còn đó, sớm trưa đợi người.\nCây đa, bến nước, sân chơi,\nTuổi thơ con gửi một thời đã xa.\n\nMẹ giờ tóc đã pha sương,\nNụ cười vẫn ấm như hương lúa đồng.\nCha ngồi vá lại lưới chài,\nBóng chiều in xuống bờ vai hao gầy.\n\nQuê hương hai tiếng thiêng liêng,\nĐi xa mới thấm nỗi niềm nhớ thương.\nDù đời xuôi ngược muôn phương,\nLòng con vẫn hướng về đường quê xưa.\n\nCâu 3. Hình ảnh cha mẹ trong bài thơ gợi cảm xúc gì?", "options": ["A. Vui vẻ", "B. Xúc động, thương cảm: mẹ tóc pha sương, cha vai hao gầy — hình ảnh cha mẹ già đi theo năm tháng khiến người con chạnh lòng", "C. Giận dữ", "D. Thờ ơ"], "answer": "B", "explain": "Chi tiết mẹ tóc pha sương, cha bóng chiều in xuống bờ vai hao gầy gợi niềm thương cảm sâu sắc — thời gian đã in dấu lên cha mẹ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVỀ THĂM QUÊ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nCon về thăm lại quê xưa,\nCon đò còn đó, sớm trưa đợi người.\nCây đa, bến nước, sân chơi,\nTuổi thơ con gửi một thời đã xa.\n\nMẹ giờ tóc đã pha sương,\nNụ cười vẫn ấm như hương lúa đồng.\nCha ngồi vá lại lưới chài,\nBóng chiều in xuống bờ vai hao gầy.\n\nQuê hương hai tiếng thiêng liêng,\nĐi xa mới thấm nỗi niềm nhớ thương.\nDù đời xuôi ngược muôn phương,\nLòng con vẫn hướng về đường quê xưa.\n\nCâu 4. Câu thơ Đi xa mới thấm nỗi niềm nhớ thương thể hiện quy luật tình cảm nào?", "options": ["A. Càng gần càng nhớ", "B. Xa quê hương, con người mới thấm thía nỗi nhớ — khoảng cách làm cho tình yêu quê hương thêm sâu đậm", "C. Quên quê hương", "D. Không nhớ"], "answer": "B", "explain": "Câu thơ khái quát một quy luật tình cảm: phải xa quê mới thấm nỗi nhớ quê — tình yêu quê hương được thử thách và bồi đắp qua khoảng cách.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVỀ THĂM QUÊ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nCon về thăm lại quê xưa,\nCon đò còn đó, sớm trưa đợi người.\nCây đa, bến nước, sân chơi,\nTuổi thơ con gửi một thời đã xa.\n\nMẹ giờ tóc đã pha sương,\nNụ cười vẫn ấm như hương lúa đồng.\nCha ngồi vá lại lưới chài,\nBóng chiều in xuống bờ vai hao gầy.\n\nQuê hương hai tiếng thiêng liêng,\nĐi xa mới thấm nỗi niềm nhớ thương.\nDù đời xuôi ngược muôn phương,\nLòng con vẫn hướng về đường quê xưa.\n\nCâu 5. Qua bài thơ, em hiểu thêm điều gì về tình yêu quê hương? (Trả lời ngắn gọn)", "answer": "Quê hương thiêng liêng; đi xa càng nhớ; phải biết trân trọng, hướng về quê hương", "explain": "Chấp nhận các cách hiểu: yêu những điều giản dị; nhớ về cội nguồn...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận văn học khoảng 200 chữ phân tích tình cảm quê hương trong bài thơ trên.", "explain": "DÀN Ý:\n1. Mở đoạn: bài thơ là tiếng lòng tha thiết về quê hương.\n2. Thân đoạn: (a) Quê hương hiện lên qua hình ảnh quen thuộc: con đò, cây đa, bến nước, hương lúa; (b) Tình cảm với cha mẹ: thương cảm trước sự già đi của cha mẹ; (c) Nỗi nhớ quê khi đi xa: đi xa mới thấm nỗi niềm nhớ thương; (d) Nghệ thuật: thể lục bát, hình ảnh giản dị, giọng điệu thiết tha.\n3. Kết đoạn: bài thơ bồi đắp tình yêu quê hương.\n\nBÀI MẪU:\nBài thơ là tiếng lòng tha thiết về quê hương, thể hiện một tình cảm chân thành, sâu nặng. Quê hương hiện lên qua những hình ảnh quen thuộc, gần gũi của làng quê Việt Nam: con đò sớm trưa đợi người, cây đa, bến nước, sân chơi tuổi thơ, hương lúa đồng ấm áp. Đó là không gian của kí ức, nơi con gửi lại một thời thơ ấu. Xúc động nhất là hình ảnh cha mẹ: mẹ tóc đã pha sương mà nụ cười vẫn ấm, cha ngồi vá lưới chài với bờ vai hao gầy in bóng chiều — thời gian đã lặng lẽ in dấu lên những người thân yêu nhất, khiến người con chạnh lòng thương cảm. Hai câu kết khái quát triết lí sâu sắc: đi xa mới thấm nỗi niềm nhớ thương — phải xa quê, con người mới hiểu hết giá trị thiêng liêng của hai tiếng quê hương, và dù đời xuôi ngược muôn phương, lòng vẫn luôn hướng về đường quê xưa. Về nghệ thuật, bài thơ viết theo thể lục bát truyền thống với nhạc điệu êm đềm, hình ảnh giản dị mà giàu sức gợi, giọng điệu thiết tha. Bài thơ không chỉ là nỗi niềm riêng của tác giả mà còn khơi dậy trong mỗi người đọc tình yêu quê hương, ý thức về cội nguồn — một trong những giá trị bền vững nhất của văn học.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về tình yêu quê hương đất nước của tuổi trẻ hôm nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — tình yêu quê hương: tình cảm thiêng liêng.\nII. Thân bài:\n1. Biểu hiện của tình yêu quê hương:\n   a. Gắn bó, nhớ về quê hương, cội nguồn.\n   b. Tự hào về truyền thống dân tộc.\n   c. Có trách nhiệm xây dựng, bảo vệ quê hương.\n2. Tình yêu quê hương của tuổi trẻ hôm nay:\n   a. Học tập tốt để xây dựng đất nước.\n   b. Giữ gìn bản sắc văn hóa.\n   c. Sẵn sàng bảo vệ Tổ quốc.\n   d. Dẫn chứng: tấm gương thanh niên tình nguyện, khởi nghiệp...\n3. Phê phán: thói vô cảm, quên cội nguồn; sính ngoại mù quáng.\n4. Bài học: nuôi dưỡng tình yêu quê hương từ những việc nhỏ.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nQuê hương là gì hở mẹ, mà cô giáo dạy phải yêu — câu hỏi ngây thơ trong bài thơ của Đỗ Trung Quân đã trở thành nỗi niềm của bao thế hệ. Quê hương là nơi ta sinh ra, lớn lên; là con đò, cây đa, bến nước; là vòng tay ấm của cha mẹ. Tình yêu quê hương là tình cảm thiêng liêng nhất của con người. Với tuổi trẻ hôm nay, tình yêu ấy không chỉ là nỗi nhớ mà còn là trách nhiệm: học tập, rèn luyện để xây dựng và bảo vệ quê hương đất nước.", "points": 0}]}]}
