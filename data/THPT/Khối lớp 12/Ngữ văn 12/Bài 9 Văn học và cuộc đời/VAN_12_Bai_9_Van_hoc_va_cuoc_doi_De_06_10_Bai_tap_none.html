\n\nChị Hoa rưng rưng nước mắt. Anh kĩ sư trẻ nói: Bát cháo năm ấy đã sưởi ấm cả tuổi thơ của cháu. Hôm nay, cháu chỉ làm đúng lời cô dặn: giúp người khác khi có thể.\n\nCâu chuyện nhỏ lan truyền khắp khu phố. Người ta đến quán cháo không chỉ để ăn mà còn để cảm nhận hơi ấm của tình người — thứ gia vị đặc biệt nhất mà không quán ăn nào có được.\n\nCâu 4. Câu nói Bát cháo năm ấy đã sưởi ấm cả tuổi thơ của cháu có ý nghĩa gì?", "options": ["A. Cháo rất nóng", "B. Dùng cách nói ẩn dụ: bát cháo không chỉ no bụng mà còn sưởi ấm tâm hồn — lòng tốt của chị Hoa đã nuôi dưỡng tâm hồn cậu bé suốt tuổi thơ", "C. Tuổi thơ lạnh", "D. Cháo dở"], "answer": "B", "explain": "Sưởi ấm cả tuổi thơ là cách nói ẩn dụ: lòng tốt không chỉ giúp vật chất mà còn nuôi dưỡng tâm hồn — giá trị sâu xa của sự giúp đỡ.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBÁT CHÁO HÀNH\n(Truyện ngắn tự sáng tác dùng làm ngữ liệu)\n\nĐêm ấy, trời mưa tầm tã. Chị Hoa — chủ quán cháo nhỏ ven đường — đang dọn hàng thì thấy một cậu bé khoảng mười tuổi, quần áo ướt sũng, đứng nép dưới mái hiên nhìn vào quán với ánh mắt thèm thuồng.\n\nChị Hoa múc một bát cháo nóng hổi đưa cho cậu bé: Ăn đi con, trời lạnh lắm. Cậu bé ngần ngại rồi ăn ngấu nghiến. Ăn xong, cậu rụt rè hỏi: Cô ơi, cháu không có tiền... Chị Hoa cười: Không sao, coi như cô mời. Mai mốt lớn lên, giúp người khác là được.\n\nMười lăm năm sau, quán cháo của chị Hoa gặp khó khăn, sắp phải đóng cửa vì không có tiền sửa lại mái nhà dột nát. Một buổi sáng, có người đàn ông trẻ đến gặp chị, tự giới thiệu là cậu bé năm xưa. Anh đã trở thành kĩ sư, và hôm nay đến để sửa lại toàn bộ quán cháo cho chị — miễn phí.\n\nChị Hoa rưng rưng nước mắt. Anh kĩ sư trẻ nói: Bát cháo năm ấy đã sưởi ấm cả tuổi thơ của cháu. Hôm nay, cháu chỉ làm đúng lời cô dặn: giúp người khác khi có thể.\n\nCâu chuyện nhỏ lan truyền khắp khu phố. Người ta đến quán cháo không chỉ để ăn mà còn để cảm nhận hơi ấm của tình người — thứ gia vị đặc biệt nhất mà không quán ăn nào có được.\n\nCâu 5. Qua truyện, em rút ra bài học gì về lòng nhân ái? (Trả lời ngắn gọn)", "answer": "Cho đi lòng tốt không toan tính; lòng tốt sẽ được đền đáp; hãy giúp người khác khi có thể", "explain": "Chấp nhận các bài học: gieo nhân nào gặt quả ấy; sống nhân ái...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận văn học khoảng 200 chữ phân tích nhân vật chị Hoa.", "explain": "DÀN Ý:\n1. Mở đoạn: chị Hoa là hình tượng đẹp về lòng nhân ái.\n2. Thân đoạn: (a) Hoàn cảnh: chủ quán cháo nhỏ ven đường, đêm mưa gặp cậu bé đói rét; (b) Hành động: múc bát cháo nóng mời cậu bé, không lấy tiền, dặn giúp người khác; (c) Phẩm chất: nhân ái vô tư, không toan tính, gieo mầm thiện; (d) Nghệ thuật: tình huống, chi tiết bát cháo, lời thoại giản dị; kết cấu khép kín (cho — nhận — đền đáp).\n3. Kết đoạn: nhân vật lan tỏa hơi ấm tình người.\n\nBÀI MẪU:\nChị Hoa là hình tượng đẹp về lòng nhân ái bình dị mà cao quý. Chỉ là chủ một quán cháo nhỏ ven đường, nhưng trong đêm mưa tầm tã, thấy cậu bé mười tuổi ướt sũng đứng nép dưới mái hiên với ánh mắt thèm thuồng, chị đã không ngần ngại múc một bát cháo nóng hổi mời cậu ăn miễn phí. Hành động ấy thể hiện tấm lòng nhân ái vô tư, không toan tính: giúp người không cần báo đáp. Đẹp hơn nữa là lời dặn của chị: mai mốt lớn lên, giúp người khác là được — chị không chỉ cho cậu bé bát cháo mà còn gieo vào lòng cậu mầm thiện, dạy cậu bài học về sự sẻ chia. Mười lăm năm sau, mầm thiện ấy đã đơm hoa: cậu bé năm xưa trở thành kĩ sư, trở về sửa lại quán cháo cho chị miễn phí, thực hiện đúng lời dặn năm nào. Nghệ thuật xây dựng nhân vật giản dị mà hiệu quả: tình huống đời thường, chi tiết bát cháo giàu sức gợi, lời thoại mộc mạc, kết cấu khép kín theo vòng cho — nhận — đền đáp. Qua chị Hoa, tác giả khẳng định: lòng nhân ái là thứ gia vị đặc biệt nhất của cuộc đời; cho đi lòng tốt chính là cách làm cho thế giới ấm áp hơn.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về lòng nhân ái trong cuộc sống.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — lòng nhân ái: phẩm chất cao đẹp.\nII. Thân bài:\n1. Giải thích: lòng nhân ái là tình yêu thương, sự sẻ chia với đồng loại.\n2. Biểu hiện:\n   a. Giúp đỡ người khó khăn (dẫn chứng: chị Hoa; các hoạt động từ thiện).\n   b. Cảm thông, chia sẻ nỗi đau.\n   c. Sống bao dung, vị tha.\n3. Vai trò: sưởi ấm tâm hồn; gắn kết cộng đồng; làm xã hội tốt đẹp hơn.\n4. Phê phán: thói vô cảm, ích kỉ; giúp đỡ vụ lợi.\n5. Bài học: rèn luyện lòng nhân ái từ việc nhỏ; cho đi không toan tính.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nTrong cuộc sống, có những giá trị không thể đong đếm bằng tiền bạc, và lòng nhân ái là một trong số đó. Một bát cháo nóng cho cậu bé đói rét trong đêm mưa, một lời dặn giúp người khác khi có thể — những hành động giản dị ấy đã sưởi ấm cả một tuổi thơ và lan tỏa hơi ấm khắp khu phố. Câu chuyện về chị Hoa nhắc nhở chúng ta về sức mạnh kì diệu của lòng nhân ái — phẩm chất làm nên vẻ đẹp của con người.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC VÍ\n(Trích kịch bản tự sáng tác dùng làm ngữ liệu)\n\nCảnh: Sân trường giờ ra chơi. MINH nhặt được một chiếc ví.\n\nMINH: (mở ví ra xem) Wow! Nhiều tiền quá! Còn có cả thẻ học sinh nữa... của bạn lớp bên.\n\nHÙNG: (bạn thân của Minh) Trời ơi, may thế! Chia đôi đi, tao với mày đi ăn gà rán!\n\nMINH: (phân vân) Nhưng... đây là tiền của người ta mà.\n\nHÙNG: Người ta đánh rơi thì coi như của trời cho. Mày không lấy thì đứa khác cũng lấy. Nhanh lên!\n\nMINH: (lặng im một lúc, rồi gấp ví lại) Không. Tao sẽ mang lên văn phòng đoàn trường. Người mất ví chắc đang lo lắng lắm. Nếu là tao đánh rơi, tao cũng mong có người trả lại.\n\nHÙNG: (cười nhạt) Mày dại thế! Thôi kệ mày.\n\n(Chiều hôm đó, bạn nữ lớp bên nhận lại được ví, cảm động tìm gặp Minh để cảm ơn. Cô giáo chủ nhiệm biết chuyện, khen Minh trước lớp.)\n\nHÙNG: (gãi đầu, ngượng ngùng) Này... tao xin lỗi. Hôm nay tao mới hiểu, nhặt được của rơi trả lại mới là người đáng nể. Tao... tao nể mày thật đấy!\n\nCâu 1. Xung đột trong đoạn kịch là gì?", "options": ["A. Xung đột giữa Minh và bạn nữ", "B. Xung đột nội tâm của Minh: giữa lòng tham (giữ tiền, chia đôi đi ăn) và lương tâm (trả lại của rơi) — cùng sự giằng xé qua lời xúi giục của Hùng", "C. Xung đột với thầy cô", "D. Không có xung đột"], "answer": "B", "explain": "Xung đột diễn ra trong nội tâm Minh: lòng tham vs lương tâm, được đẩy cao qua lời xúi giục của Hùng — xung đột tâm lí đặc trưng của kịch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC VÍ\n(Trích kịch bản tự sáng tác dùng làm ngữ liệu)\n\nCảnh: Sân trường giờ ra chơi. MINH nhặt được một chiếc ví.\n\nMINH: (mở ví ra xem) Wow! Nhiều tiền quá! Còn có cả thẻ học sinh nữa... của bạn lớp bên.\n\nHÙNG: (bạn thân của Minh) Trời ơi, may thế! Chia đôi đi, tao với mày đi ăn gà rán!\n\nMINH: (phân vân) Nhưng... đây là tiền của người ta mà.\n\nHÙNG: Người ta đánh rơi thì coi như của trời cho. Mày không lấy thì đứa khác cũng lấy. Nhanh lên!\n\nMINH: (lặng im một lúc, rồi gấp ví lại) Không. Tao sẽ mang lên văn phòng đoàn trường. Người mất ví chắc đang lo lắng lắm. Nếu là tao đánh rơi, tao cũng mong có người trả lại.\n\nHÙNG: (cười nhạt) Mày dại thế! Thôi kệ mày.\n\n(Chiều hôm đó, bạn nữ lớp bên nhận lại được ví, cảm động tìm gặp Minh để cảm ơn. Cô giáo chủ nhiệm biết chuyện, khen Minh trước lớp.)\n\nHÙNG: (gãi đầu, ngượng ngùng) Này... tao xin lỗi. Hôm nay tao mới hiểu, nhặt được của rơi trả lại mới là người đáng nể. Tao... tao nể mày thật đấy!\n\nCâu 2. Minh đã lựa chọn như thế nào?", "options": ["A. Chia tiền với Hùng", "B. Mang ví lên văn phòng đoàn trường để trả lại người mất — đặt mình vào vị trí người mất của", "C. Giấu ví", "D. Vứt ví đi"], "answer": "B", "explain": "Sau phút phân vân, Minh quyết định trả lại: người mất ví chắc đang lo lắng; nếu là mình cũng mong được trả lại — sự đặt mình vào vị trí người khác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC VÍ\n(Trích kịch bản tự sáng tác dùng làm ngữ liệu)\n\nCảnh: Sân trường giờ ra chơi. MINH nhặt được một chiếc ví.\n\nMINH: (mở ví ra xem) Wow! Nhiều tiền quá! Còn có cả thẻ học sinh nữa... của bạn lớp bên.\n\nHÙNG: (bạn thân của Minh) Trời ơi, may thế! Chia đôi đi, tao với mày đi ăn gà rán!\n\nMINH: (phân vân) Nhưng... đây là tiền của người ta mà.\n\nHÙNG: Người ta đánh rơi thì coi như của trời cho. Mày không lấy thì đứa khác cũng lấy. Nhanh lên!\n\nMINH: (lặng im một lúc, rồi gấp ví lại) Không. Tao sẽ mang lên văn phòng đoàn trường. Người mất ví chắc đang lo lắng lắm. Nếu là tao đánh rơi, tao cũng mong có người trả lại.\n\nHÙNG: (cười nhạt) Mày dại thế! Thôi kệ mày.\n\n(Chiều hôm đó, bạn nữ lớp bên nhận lại được ví, cảm động tìm gặp Minh để cảm ơn. Cô giáo chủ nhiệm biết chuyện, khen Minh trước lớp.)\n\nHÙNG: (gãi đầu, ngượng ngùng) Này... tao xin lỗi. Hôm nay tao mới hiểu, nhặt được của rơi trả lại mới là người đáng nể. Tao... tao nể mày thật đấy!\n\nCâu 3. Chi tiết Hùng từ xúi giục chuyển sang nể phục Minh có ý nghĩa gì?", "options": ["A. Không có ý nghĩa", "B. Cho thấy sức cảm hóa của hành động đúng đắn: lòng trung thực của Minh đã khiến Hùng nhận ra sai lầm và thay đổi — thông điệp giáo dục sâu sắc", "C. Hùng giả vờ", "D. Hùng sợ"], "answer": "B", "explain": "Sự chuyển biến của Hùng chứng minh: hành động trung thực có sức cảm hóa; cái thiện có thể chiến thắng cái xấu ngay trong đời thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC VÍ\n(Trích kịch bản tự sáng tác dùng làm ngữ liệu)\n\nCảnh: Sân trường giờ ra chơi. MINH nhặt được một chiếc ví.\n\nMINH: (mở ví ra xem) Wow! Nhiều tiền quá! Còn có cả thẻ học sinh nữa... của bạn lớp bên.\n\nHÙNG: (bạn thân của Minh) Trời ơi, may thế! Chia đôi đi, tao với mày đi ăn gà rán!\n\nMINH: (phân vân) Nhưng... đây là tiền của người ta mà.\n\nHÙNG: Người ta đánh rơi thì coi như của trời cho. Mày không lấy thì đứa khác cũng lấy. Nhanh lên!\n\nMINH: (lặng im một lúc, rồi gấp ví lại) Không. Tao sẽ mang lên văn phòng đoàn trường. Người mất ví chắc đang lo lắng lắm. Nếu là tao đánh rơi, tao cũng mong có người trả lại.\n\nHÙNG: (cười nhạt) Mày dại thế! Thôi kệ mày.\n\n(Chiều hôm đó, bạn nữ lớp bên nhận lại được ví, cảm động tìm gặp Minh để cảm ơn. Cô giáo chủ nhiệm biết chuyện, khen Minh trước lớp.)\n\nHÙNG: (gãi đầu, ngượng ngùng) Này... tao xin lỗi. Hôm nay tao mới hiểu, nhặt được của rơi trả lại mới là người đáng nể. Tao... tao nể mày thật đấy!\n\nCâu 4. Đoạn kịch thể hiện giá trị nào của văn học?", "options": ["A. Chỉ giải trí", "B. Giá trị giáo dục: bồi đắp phẩm chất trung thực, hướng con người tới cái thiện — văn học góp phần hình thành nhân cách", "C. Không có giá trị", "D. Chỉ thẩm mĩ"], "answer": "B", "explain": "Qua câu chuyện gần gũi, đoạn kịch bồi đắp phẩm chất trung thực cho người xem — thể hiện giá trị giáo dục của văn học.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC VÍ\n(Trích kịch bản tự sáng tác dùng làm ngữ liệu)\n\nCảnh: Sân trường giờ ra chơi. MINH nhặt được một chiếc ví.\n\nMINH: (mở ví ra xem) Wow! Nhiều tiền quá! Còn có cả thẻ học sinh nữa... của bạn lớp bên.\n\nHÙNG: (bạn thân của Minh) Trời ơi, may thế! Chia đôi đi, tao với mày đi ăn gà rán!\n\nMINH: (phân vân) Nhưng... đây là tiền của người ta mà.\n\nHÙNG: Người ta đánh rơi thì coi như của trời cho. Mày không lấy thì đứa khác cũng lấy. Nhanh lên!\n\nMINH: (lặng im một lúc, rồi gấp ví lại) Không. Tao sẽ mang lên văn phòng đoàn trường. Người mất ví chắc đang lo lắng lắm. Nếu là tao đánh rơi, tao cũng mong có người trả lại.\n\nHÙNG: (cười nhạt) Mày dại thế! Thôi kệ mày.\n\n(Chiều hôm đó, bạn nữ lớp bên nhận lại được ví, cảm động tìm gặp Minh để cảm ơn. Cô giáo chủ nhiệm biết chuyện, khen Minh trước lớp.)\n\nHÙNG: (gãi đầu, ngượng ngùng) Này... tao xin lỗi. Hôm nay tao mới hiểu, nhặt được của rơi trả lại mới là người đáng nể. Tao... tao nể mày thật đấy!\n\nCâu 5. Nếu là Minh, em sẽ làm gì khi nhặt được của rơi? Vì sao? (Trả lời ngắn gọn)", "answer": "Trả lại người mất / nộp cho thầy cô vì đó là việc đúng, trung thực", "explain": "Chấp nhận các cách xử lí đúng với lí do chính đáng.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận văn học khoảng 200 chữ phân tích nhân vật Minh.", "explain": "DÀN Ý:\n1. Mở đoạn: Minh là hình tượng đẹp về lòng trung thực của tuổi học trò.\n2. Thân đoạn: (a) Tình huống thử thách: nhặt được ví nhiều tiền, bị bạn xúi giục chia đôi; (b) Diễn biến tâm lí: phân vân — lặng im suy nghĩ — quyết định trả lại; (c) Phẩm chất: trung thực, biết đặt mình vào vị trí người khác, có bản lĩnh trước cám dỗ; (d) Nghệ thuật: xung đột nội tâm qua đối thoại, chỉ dẫn sân khấu.\n3. Kết đoạn: nhân vật là tấm gương cho bạn đọc.\n\nBÀI MẪU:\nMinh là hình tượng đẹp về lòng trung thực của tuổi học trò, được khắc họa qua một tình huống thử thách gần gũi. Nhặt được chiếc ví nhiều tiền, Minh đứng trước cám dỗ lớn, lại bị bạn thân xúi giục chia đôi đi ăn gà rán với lí lẽ người ta đánh rơi thì coi như của trời cho. Diễn biến tâm lí của Minh được thể hiện tinh tế qua đối thoại và chỉ dẫn sân khấu: từ phân vân (nhưng... đây là tiền của người ta mà), lặng im suy nghĩ, đến quyết định dứt khoát mang ví lên văn phòng đoàn trường. Điều làm nên vẻ đẹp của nhân vật là khả năng đặt mình vào vị trí người khác: người mất ví chắc đang lo lắng lắm; nếu là mình đánh rơi cũng mong có người trả lại. Minh không chỉ trung thực mà còn có bản lĩnh: dám từ chối lời xúi giục của bạn thân để làm điều đúng. Sức cảm hóa của hành động ấy thể hiện qua sự chuyển biến của Hùng — từ cười nhạt đến ngượng ngùng xin lỗi và thật lòng nể phục. Qua nhân vật Minh, tác giả khẳng định giá trị giáo dục của văn học: bồi đắp phẩm chất trung thực, hướng con người — nhất là tuổi trẻ — tới cái thiện. Minh chính là tấm gương để mỗi học sinh soi mình.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về lòng trung thực trong cuộc sống.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — trung thực: phẩm chất quý giá.\nII. Thân bài:\n1. Giải thích: trung thực là thật thà, ngay thẳng, dám nhận đúng sai.\n2. Biểu hiện:\n   a. Nhặt được của rơi trả lại (dẫn chứng: Minh).\n   b. Trung thực trong học tập, thi cử.\n   c. Dám nhận lỗi, không gian dối.\n3. Vai trò: tạo niềm tin; được tôn trọng; xã hội lành mạnh.\n4. Phê phán: gian dối, quay cóp, tham lam.\n5. Bài học: rèn luyện từ việc nhỏ; có bản lĩnh trước cám dỗ.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nTrong kho tàng phẩm chất của con người, trung thực là viên ngọc quý giá nhất. Một học sinh nhặt được ví tiền đã vượt qua cám dỗ để trả lại người mất; hành động giản dị ấy khiến bạn bè nể phục và thầy cô khen ngợi. Câu chuyện về Minh nhắc nhở chúng ta: giữa một xã hội còn không ít sự gian dối, lòng trung thực càng trở nên đáng quý và cần được giữ gìn, phát huy.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÁCH MẠNG CÔNG NGHIỆP 4.0 VÀ VAI TRÒ CỦA TRÍ THỨC KHOA HỌC – CÔNG NGHỆ\n\nCách mạng công nghiệp 4.0 — với các trụ cột là trí tuệ nhân tạo, dữ liệu lớn, in-tơ-nét vạn vật và rô-bốt — đang làm thay đổi sâu sắc nền kinh tế thế giới. Theo dự báo của các tổ chức quốc tế, trong những năm tới, hàng triệu việc làm truyền thống có thể bị thay thế bởi máy móc, đồng thời hàng triệu việc làm mới sẽ ra đời, đòi hỏi kĩ năng hoàn toàn khác.\n\nTrong bối cảnh ấy, đội ngũ trí thức khoa học – công nghệ giữ vai trò then chốt. Họ là người nghiên cứu, sáng tạo và làm chủ công nghệ; là cầu nối đưa tiến bộ khoa học vào sản xuất, đời sống. Những quốc gia phát triển nhanh trong thời đại 4.0 đều là những quốc gia đầu tư mạnh cho khoa học – công nghệ và trọng dụng nhân tài.\n\nTại Việt Nam, Đảng và Nhà nước đã xác định khoa học – công nghệ là quốc sách hàng đầu. Nhiều nhà khoa học Việt Nam đã đạt thành tựu được quốc tế ghi nhận. Tuy nhiên, chúng ta vẫn đối mặt với thách thức: chảy máu chất xám, đầu tư cho nghiên cứu còn hạn chế, mối liên kết giữa nhà trường – viện nghiên cứu – doanh nghiệp chưa chặt chẽ.\n\nĐể không bị bỏ lại phía sau trong cuộc cách mạng 4.0, mỗi quốc gia cần: đầu tư mạnh cho giáo dục, khoa học; có chính sách thu hút, trọng dụng nhân tài; khuyến khích đổi mới sáng tạo trong toàn xã hội.\n\nVới tuổi trẻ, thông điệp rõ ràng: hãy trang bị tri thức, kĩ năng số, ngoại ngữ và tinh thần sáng tạo — hành trang không thể thiếu để bước vào thời đại 4.0. Tương lai thuộc về những người ham học hỏi và dám đổi mới.\n\nCâu 1. Các trụ cột của cách mạng công nghiệp 4.0 là gì?", "options": ["A. Than, thép, điện", "B. Trí tuệ nhân tạo, dữ liệu lớn, in-tơ-nét vạn vật và rô-bốt", "C. Nông nghiệp, thủ công", "D. Than đá, dầu mỏ"], "answer": "B", "explain": "Văn bản cung cấp thông tin: bốn trụ cột của CMCN 4.0 là AI, dữ liệu lớn, IoT và rô-bốt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÁCH MẠNG CÔNG NGHIỆP 4.0 VÀ VAI TRÒ CỦA TRÍ THỨC KHOA HỌC – CÔNG NGHỆ\n\nCách mạng công nghiệp 4.0 — với các trụ cột là trí tuệ nhân tạo, dữ liệu lớn, in-tơ-nét vạn vật và rô-bốt — đang làm thay đổi sâu sắc nền kinh tế thế giới. Theo dự báo của các tổ chức quốc tế, trong những năm tới, hàng triệu việc làm truyền thống có thể bị thay thế bởi máy móc, đồng thời hàng triệu việc làm mới sẽ ra đời, đòi hỏi kĩ năng hoàn toàn khác.\n\nTrong bối cảnh ấy, đội ngũ trí thức khoa học – công nghệ giữ vai trò then chốt. Họ là người nghiên cứu, sáng tạo và làm chủ công nghệ; là cầu nối đưa tiến bộ khoa học vào sản xuất, đời sống. Những quốc gia phát triển nhanh trong thời đại 4.0 đều là những quốc gia đầu tư mạnh cho khoa học – công nghệ và trọng dụng nhân tài.\n\nTại Việt Nam, Đảng và Nhà nước đã xác định khoa học – công nghệ là quốc sách hàng đầu. Nhiều nhà khoa học Việt Nam đã đạt thành tựu được quốc tế ghi nhận. Tuy nhiên, chúng ta vẫn đối mặt với thách thức: chảy máu chất xám, đầu tư cho nghiên cứu còn hạn chế, mối liên kết giữa nhà trường – viện nghiên cứu – doanh nghiệp chưa chặt chẽ.\n\nĐể không bị bỏ lại phía sau trong cuộc cách mạng 4.0, mỗi quốc gia cần: đầu tư mạnh cho giáo dục, khoa học; có chính sách thu hút, trọng dụng nhân tài; khuyến khích đổi mới sáng tạo trong toàn xã hội.\n\nVới tuổi trẻ, thông điệp rõ ràng: hãy trang bị tri thức, kĩ năng số, ngoại ngữ và tinh thần sáng tạo — hành trang không thể thiếu để bước vào thời đại 4.0. Tương lai thuộc về những người ham học hỏi và dám đổi mới.\n\nCâu 2. Đội ngũ trí thức khoa học – công nghệ giữ vai trò gì?", "options": ["A. Không quan trọng", "B. Then chốt: nghiên cứu, sáng tạo, làm chủ công nghệ; cầu nối đưa tiến bộ khoa học vào sản xuất, đời sống", "C. Chỉ giảng dạy", "D. Chỉ kinh doanh"], "answer": "B", "explain": "Văn bản khẳng định vai trò then chốt của trí thức KH-CN — người làm chủ công nghệ, đưa khoa học vào đời sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÁCH MẠNG CÔNG NGHIỆP 4.0 VÀ VAI TRÒ CỦA TRÍ THỨC KHOA HỌC – CÔNG NGHỆ\n\nCách mạng công nghiệp 4.0 — với các trụ cột là trí tuệ nhân tạo, dữ liệu lớn, in-tơ-nét vạn vật và rô-bốt — đang làm thay đổi sâu sắc nền kinh tế thế giới. Theo dự báo của các tổ chức quốc tế, trong những năm tới, hàng triệu việc làm truyền thống có thể bị thay thế bởi máy móc, đồng thời hàng triệu việc làm mới sẽ ra đời, đòi hỏi kĩ năng hoàn toàn khác.\n\nTrong bối cảnh ấy, đội ngũ trí thức khoa học – công nghệ giữ vai trò then chốt. Họ là người nghiên cứu, sáng tạo và làm chủ công nghệ; là cầu nối đưa tiến bộ khoa học vào sản xuất, đời sống. Những quốc gia phát triển nhanh trong thời đại 4.0 đều là những quốc gia đầu tư mạnh cho khoa học – công nghệ và trọng dụng nhân tài.\n\nTại Việt Nam, Đảng và Nhà nước đã xác định khoa học – công nghệ là quốc sách hàng đầu. Nhiều nhà khoa học Việt Nam đã đạt thành tựu được quốc tế ghi nhận. Tuy nhiên, chúng ta vẫn đối mặt với thách thức: chảy máu chất xám, đầu tư cho nghiên cứu còn hạn chế, mối liên kết giữa nhà trường – viện nghiên cứu – doanh nghiệp chưa chặt chẽ.\n\nĐể không bị bỏ lại phía sau trong cuộc cách mạng 4.0, mỗi quốc gia cần: đầu tư mạnh cho giáo dục, khoa học; có chính sách thu hút, trọng dụng nhân tài; khuyến khích đổi mới sáng tạo trong toàn xã hội.\n\nVới tuổi trẻ, thông điệp rõ ràng: hãy trang bị tri thức, kĩ năng số, ngoại ngữ và tinh thần sáng tạo — hành trang không thể thiếu để bước vào thời đại 4.0. Tương lai thuộc về những người ham học hỏi và dám đổi mới.\n\nCâu 3. Những thách thức nào của Việt Nam được nêu?", "options": ["A. Không có thách thức", "B. Chảy máu chất xám, đầu tư cho nghiên cứu còn hạn chế, liên kết giữa nhà trường – viện nghiên cứu – doanh nghiệp chưa chặt chẽ", "C. Thừa nhân tài", "D. Công nghệ quá cao"], "answer": "B", "explain": "Văn bản chỉ ra thẳng thắn ba thách thức — cách trình bày trung thực, khách quan của văn bản thông tin.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÁCH MẠNG CÔNG NGHIỆP 4.0 VÀ VAI TRÒ CỦA TRÍ THỨC KHOA HỌC – CÔNG NGHỆ\n\nCách mạng công nghiệp 4.0 — với các trụ cột là trí tuệ nhân tạo, dữ liệu lớn, in-tơ-nét vạn vật và rô-bốt — đang làm thay đổi sâu sắc nền kinh tế thế giới. Theo dự báo của các tổ chức quốc tế, trong những năm tới, hàng triệu việc làm truyền thống có thể bị thay thế bởi máy móc, đồng thời hàng triệu việc làm mới sẽ ra đời, đòi hỏi kĩ năng hoàn toàn khác.\n\nTrong bối cảnh ấy, đội ngũ trí thức khoa học – ũ trí thức khoa học – công nghệ giữ vai trò then chốt. Họ là người nghiên cứu, sáng tạo và làm chủ công nghệ; là cầu nối đưa tiến bộ khoa học vào sản xuất, đời sống. Những quốc gia phát triển nhanh trong thời đại 4.0 đều là những quốc gia đầu tư mạnh cho khoa học – công nghệ và trọng dụng nhân tài.\n\nTại Việt Nam, Đảng và Nhà nước đã xác định khoa học – công nghệ là quốc sách hàng đầu. Nhiều nhà khoa học Việt Nam đã đạt thành tựu được quốc tế ghi nhận. Tuy nhiên, chúng ta vẫn đối mặt với thách thức: chảy máu chất xám, đầu tư cho nghiên cứu còn hạn chế, mối liên kết giữa nhà trường – viện nghiên cứu – doanh nghiệp chưa chặt chẽ.\n\nĐể không bị bỏ lại phía sau trong cuộc cách mạng 4.0, mỗi quốc gia cần: đầu tư mạnh cho giáo dục, khoa học; có chính sách thu hút, trọng dụng nhân tài; khuyến khích đổi mới sáng tạo trong toàn xã hội.\n\nVới tuổi trẻ, thông điệp rõ ràng: hãy trang bị tri thức, kĩ năng số, ngoại ngữ và tinh thần sáng tạo — hành trang không thể thiếu để bước vào thời đại 4.0. Tương lai thuộc về những người ham học hỏi và dám đổi mới.\n\nCâu 5. Theo em, vì sao khoa học – công nghệ được xác định là quốc sách hàng đầu? (Trả lời ngắn gọn)", "answer": "Vì quyết định sự phát triển, vị thế quốc gia trong thời đại 4.0", "explain": "Chấp nhận các cách diễn đạt: ai làm chủ công nghệ người đó phát triển...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của tuổi trẻ trong thời đại cách mạng công nghiệp 4.0.", "explain": "DÀN Ý:\n1. Mở đoạn: CMCN 4.0 đặt ra yêu cầu mới cho tuổi trẻ.\n2. Thân đoạn: (a) Bối cảnh: AI, dữ liệu lớn thay đổi việc làm; (b) Vai trò tuổi trẻ: lực lượng nhanh nhạy với công nghệ, cần trang bị tri thức, kĩ năng số, ngoại ngữ, sáng tạo; (c) Thực trạng: một số bạn trẻ lãng phí thời gian, lười học; (d) Phê phán thói ỷ lại, ngại đổi mới.\n3. Kết đoạn: tương lai thuộc về người ham học hỏi.\n\nBÀI MẪU:\nCách mạng công nghiệp 4.0 với trí tuệ nhân tạo, dữ liệu lớn, in-tơ-nét vạn vật đang làm thay đổi sâu sắc thế giới việc làm: hàng triệu việc làm truyền thống có thể bị thay thế, đồng thời hàng triệu việc làm mới ra đời. Trong bối cảnh ấy, tuổi trẻ giữ vai trò đặc biệt quan trọng: là lực lượng nhanh nhạy nhất với công nghệ, là chủ nhân tương lai của đất nước. Để không bị bỏ lại phía sau, mỗi bạn trẻ cần trang bị hành trang vững chắc: tri thức chuyên môn sâu, kĩ năng số thành thạo, ngoại ngữ tốt và tinh thần sáng tạo, dám đổi mới. Thực tế, nhiều bạn trẻ Việt Nam đã vươn ra thế giới với những sản phẩm công nghệ ấn tượng — minh chứng cho tiềm năng to lớn của tuổi trẻ. Thế nhưng, vẫn còn không ít bạn lãng phí thời gian vào những thú vui vô bổ, lười học hỏi, ngại thay đổi, ỷ lại vào người khác. Thái độ ấy trong thời đại 4.0 chẳng khác nào tự loại mình khỏi cuộc chơi. Hãy nhớ thông điệp của thời đại: tương lai thuộc về những người ham học hỏi và dám đổi mới. Mỗi ngày hôm nay nỗ lực học tập chính là một viên gạch xây nên tương lai của bản thân và đất nước.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về tinh thần đổi mới sáng tạo của tuổi trẻ.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — đổi mới sáng tạo: chìa khóa của thời đại.\nII. Thân bài:\n1. Giải thích: đổi mới sáng tạo là gì.\n2. Vai trò:\n   a. Với cá nhân: phát triển bản thân, thành công.\n   b. Với đất nước: động lực phát triển trong thời đại 4.0.\n   c. Dẫn chứng: tấm gương khởi nghiệp, nhà khoa học trẻ...\n3. Thực trạng: nhiều bạn trẻ năng động, sáng tạo; một số còn rập khuôn, ngại đổi mới.\n4. Để rèn luyện: ham học hỏi; dám nghĩ dám làm; chấp nhận thất bại; học từ thực tiễn.\n5. Phê phán: thói bảo thủ, lười suy nghĩ.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nTrong thời đại cách mạng công nghiệp 4.0, khi tri thức cũ nhanh chóng lạc hậu và công nghệ thay đổi từng ngày, đổi mới sáng tạo đã trở thành chìa khóa của thành công — với mỗi cá nhân và với cả dân tộc. Tuổi trẻ, với sự nhanh nhạy và khát vọng vươn lên, chính là lực lượng tiên phong của đổi mới sáng tạo. Hiểu đúng và rèn luyện tinh thần ấy là nhiệm vụ của mỗi bạn trẻ hôm nay.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI LÍNH TRẺ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nAnh lên đường khi nắng còn xanh,\nBa lô con cóc, bước chân rộn ràng.\nMẹ già tiễn đến đầu làng,\nNước mắt mẹ mặn, nắng vàng vẫn tươi.\n\nĐêm Trường Sơn, sao thưa rơi,\nAnh mơ thấy mẹ, thấy nụ cười em thơ.\nSúng chắc trong tay, lòng không vơi\nNiềm tin chiến thắng, rạng ngời tương lai.\n\nHòa bình về, anh trở lại,\nVết thương còn đó, nụ cười còn đây.\nQuê hương đổi mới từng ngày,\nAnh cười: Xương máu mình, đất này nở hoa.\n\nCâu 1. Đề tài của bài thơ là gì?", "options": ["A. Tình yêu đôi lứa", "B. Người lính — hình tượng người lính trẻ lên đường chiến đấu, hi sinh vì Tổ quốc", "C. Thiên nhiên", "D. Lao động"], "answer": "B", "explain": "Bài thơ viết về người lính trẻ: lên đường, chiến đấu, trở về — đề tài quen thuộc và cao đẹp trong thơ ca Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI LÍNH TRẺ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nAnh lên đường khi nắng còn xanh,\nBa lô con cóc, bước chân rộn ràng.\nMẹ già tiễn đến đầu làng,\nNước mắt mẹ mặn, nắng vàng vẫn tươi.\n\nĐêm Trường Sơn, sao thưa rơi,\nAnh mơ thấy mẹ, thấy nụ cười em thơ.\nSúng chắc trong tay, lòng không vơi\nNiềm tin chiến thắng, rạng ngời tương lai.\n\nHòa bình về, anh trở lại,\nVết thương còn đó, nụ cười còn đây.\nQuê hương đổi mới từng ngày,\nAnh cười: Xương máu mình, đất này nở hoa.\n\nCâu 2. Hình ảnh nào thể hiện sự hi sinh của người lính?", "options": ["A. Ba lô con cóc", "B. Vết thương còn đó — dấu tích của những năm tháng chiến đấu gian khổ in trên cơ thể người lính", "C. Nắng vàng", "D. Nụ cười"], "answer": "B", "explain": "Chi tiết vết thương còn đó là dấu tích cụ thể của sự hi sinh — người lính mang thương tật nhưng nụ cười vẫn rạng rỡ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI LÍNH TRẺ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nAnh lên đường khi nắng còn xanh,\nBa lô con cóc, bước chân rộn ràng.\nMẹ già tiễn đến đầu làng,\nNước mắt mẹ mặn, nắng vàng vẫn tươi.\n\nĐêm Trường Sơn, sao thưa rơi,\nAnh mơ thấy mẹ, thấy nụ cười em thơ.\nSúng chắc trong tay, lòng không vơi\nNiềm tin chiến thắng, rạng ngời tương lai.\n\nHòa bình về, anh trở lại,\nVết thương còn đó, nụ cười còn đây.\nQuê hương đổi mới từng ngày,\nAnh cười: Xương máu mình, đất này nở hoa.\n\nCâu 3. Hai câu thơ Anh cười: Xương máu mình, đất này nở hoa thể hiện điều gì?", "options": ["A. Sự đau đớn", "B. Niềm tự hào, lạc quan: sự hi sinh của người lính đã làm nên hòa bình, đổi mới của quê hương — triết lí về giá trị của sự hi sinh", "C. Sự hối tiếc", "D. Sự sợ hãi"], "answer": "B", "explain": "Câu thơ khẳng định triết lí: xương máu của người lính đã làm nên mùa xuân của đất nước — sự hi sinh cao cả, có ý nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI LÍNH TRẺ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nAnh lên đường khi nắng còn xanh,\nBa lô con cóc, bước chân rộn ràng.\nMẹ già tiễn đến đầu làng,\nNước mắt mẹ mặn, nắng vàng vẫn tươi.\n\nĐêm Trường Sơn, sao thưa rơi,\nAnh mơ thấy mẹ, thấy nụ cười em thơ.\nSúng chắc trong tay, lòng không vơi\nNiềm tin chiến thắng, rạng ngời tương lai.\n\nHòa bình về, anh trở lại,\nVết thương còn đó, nụ cười còn đây.\nQuê hương đổi mới từng ngày,\nAnh cười: Xương máu mình, đất này nở hoa.\n\nCâu 4. Tình cảm của tác giả với người lính là gì?", "options": ["A. Thờ ơ", "B. Ngưỡng mộ, biết ơn, tự hào — thể hiện qua giọng điệu trang trọng, hình ảnh đẹp về người lính", "C. Thương hại", "D. Phê phán"], "answer": "B", "explain": "Giọng điệu trang trọng, hình ảnh người lính đẹp (bước chân rộn ràng, niềm tin rạng ngời, nụ cười còn đây) thể hiện sự ngưỡng mộ, biết ơn.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI LÍNH TRẺ\n(Thơ tự sáng tác dùng làm ngữ liệu)\n\nAnh lên đường khi nắng còn xanh,\nBa lô con cóc, bước chân rộn ràng.\nMẹ già tiễn đến đầu làng,\nNước mắt mẹ mặn, nắng vàng vẫn tươi.\n\nĐêm Trường Sơn, sao thưa rơi,\nAnh mơ thấy mẹ, thấy nụ cười em thơ.\nSúng chắc trong tay, lòng không vơi\nNiềm tin chiến thắng, rạng ngời tương lai.\n\nHòa bình về, anh trở lại,\nVết thương còn đó, nụ cười còn đây.\nQuê hương đổi mới từng ngày,\nAnh cười: Xương máu mình, đất này nở hoa.\n\nCâu 5. Qua bài thơ, em hiểu gì về trách nhiệm của thế hệ trẻ với Tổ quốc? (Trả lời ngắn gọn)", "answer": "Biết ơn sự hi sinh của thế hệ trước; sống xứng đáng, góp phần xây dựng đất nước", "explain": "Chấp nhận các cách hiểu: tiếp nối truyền thống; không phụ xương máu cha anh...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận văn học khoảng 200 chữ phân tích hình tượng người lính trong bài thơ trên.", "explain": "DÀN Ý:\n1. Mở đoạn: bài thơ khắc họa đẹp hình tượng người lính trẻ.\n2. Thân đoạn: (a) Lúc lên đường: trẻ trung, rộn ràng, mang theo tình mẹ; (b) Trong chiến đấu: vững tay súng, giàu niềm tin, mơ về mẹ và em thơ — vừa dũng cảm vừa giàu tình cảm; (c) Khi trở về: mang vết thương nhưng nụ cười rạng rỡ, tự hào về sự đổi mới của quê hương; (d) Nghệ thuật: hình ảnh giản dị, giọng điệu thiết tha.\n3. Kết đoạn: hình tượng khơi dậy lòng biết ơn.\n\nBÀI MẪU:\nBài thơ khắc họa thành công hình tượng người lính trẻ với vẻ đẹp vừa dũng cảm vừa giàu tình cảm. Lúc lên đường, anh hiện lên thật trẻ trung, rộn ràng: ba lô con cóc, bước chân rộn ràng giữa nắng xanh, mang theo nước mắt mặn của mẹ già tiễn đến đầu làng. Trong những đêm Trường Sơn gian khổ, anh vẫn vững tay súng, lòng đầy niềm tin chiến thắng, và giữa bom đạn vẫn mơ thấy mẹ, thấy nụ cười em thơ — chất lính dũng cảm hòa quyện với tâm hồn giàu tình cảm. Đẹp nhất là hình ảnh anh khi trở về: vết thương còn đó — dấu tích của sự hi sinh — nhưng nụ cười còn đây, rạng rỡ niềm tự hào khi thấy quê hương đổi mới từng ngày. Câu thơ Anh cười: Xương máu mình, đất này nở hoa đã khái quát triết lí sâu sắc: sự hi sinh của người lính đã làm nên hòa bình, làm nên mùa xuân của đất nước. Về nghệ thuật, bài thơ dùng hình ảnh giản dị, gần gũi, giọng điệu thiết tha, vừa hào hùng vừa trữ tình. Hình tượng người lính trong bài thơ khơi dậy trong lòng người đọc niềm biết ơn sâu sắc với thế hệ cha anh và ý thức trách nhiệm: phải sống xứng đáng với xương máu mà các anh đã đổ xuống cho Tổ quốc.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về lòng biết ơn thế hệ cha anh của tuổi trẻ hôm nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — uống nước nhớ nguồn: đạo lí dân tộc.\nII. Thân bài:\n1. Sự hi sinh của thế hệ cha anh:\n   a. Trong chiến tranh: xương máu cho độc lập.\n   b. Trong hòa bình: lao động xây dựng đất nước.\n2. Biểu hiện lòng biết ơn của tuổi trẻ:\n   a. Tri ân: thăm viếng, chăm sóc gia đình thương binh, liệt sĩ.\n   b. Sống xứng đáng: học tập, rèn luyện, xây dựng đất nước.\n   c. Giữ gìn, phát huy truyền thống.\n3. Phê phán: thói vô ơn, quên cội nguồn; sống hưởng thụ, vô trách nhiệm.\n4. Bài học: biết ơn bằng hành động cụ thể.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nUống nước nhớ nguồn là đạo lí ngàn đời của dân tộc Việt Nam. Hòa bình, độc lập và cuộc sống ấm no hôm nay được đánh đổi bằng xương máu của biết bao thế hệ cha anh — những người lính trẻ đã lên đường khi nắng còn xanh và có người mãi mãi không trở về. Vết thương còn đó trên cơ thể các anh, nhưng nụ cười vẫn rạng rỡ vì đất này đã nở hoa. Với tuổi trẻ hôm nay, lòng biết ơn ấy không chỉ là tình cảm mà còn là trách nhiệm thiêng liêng.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HỌC — NGƯỜI BẠN ĐỒNG HÀNH CỦA CON NGƯỜI\n(Văn bản tổng hợp dùng làm ngữ liệu)\n\nCó người hỏi: trong thời đại công nghệ, văn học còn cần thiết không? Câu trả lời là: càng cần thiết hơn bao giờ hết. Bởi công nghệ có thể cho ta tiện nghi, nhưng chỉ văn học mới nuôi dưỡng tâm hồn.\n\nVăn học giúp ta hiểu đời, hiểu người. Qua số phận các nhân vật, ta học được bài học về tình yêu thương, lòng dũng cảm, sự trung thực. Một câu thơ hay có thể an ủi ta trong lúc buồn; một trang truyện hay có thể thắp lên trong ta niềm tin vào cuộc sống.\n\nVăn học còn là nơi lưu giữ kí ức của dân tộc. Những câu chuyện về cha ông, những bài thơ về quê hương đất nước đã hun đúc nên tâm hồn Việt Nam qua bao thế hệ. Không có văn học, một dân tộc sẽ mất đi một phần linh hồn của mình.\n\nMỗi thể loại văn học có một cách riêng để chạm đến trái tim con người: thơ ca bằng cảm xúc và nhạc điệu; truyện kể bằng số phận nhân vật; kịch bằng xung đột và đối thoại. Nhưng tất cả đều hướng tới một mục đích chung: làm cho con người tốt đẹp hơn, cuộc đời đáng sống hơn.\n\nHãy đọc sách, yêu văn học — không phải vì điểm số, mà vì chính tâm hồn mình. Người bạn đồng hành thầm lặng ấy sẽ không bao giờ phản bội ta.\n\nCâu 1. Theo văn bản, trong thời đại công nghệ, văn học có còn cần thiết không?", "options": ["A. Không cần", "B. Càng cần thiết hơn bao giờ hết — công nghệ cho tiện nghi, nhưng chỉ văn học mới nuôi dưỡng tâm hồn", "C. Ít cần", "D. Chỉ cần cho học sinh"], "answer": "B", "explain": "Văn bản khẳng định: văn học càng cần thiết hơn trong thời đại công nghệ — vì chỉ văn học mới nuôi dưỡng tâm hồn con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HỌC — NGƯỜI BẠN ĐỒNG HÀNH CỦA CON NGƯỜI\n(Văn bản tổng hợp dùng làm ngữ liệu)\n\nCó người hỏi: trong thời đại công nghệ, văn học còn cần thiết không? Câu trả lời là: càng cần thiết hơn bao giờ hết. Bởi công nghệ có thể cho ta tiện nghi, nhưng chỉ văn học mới nuôi dưỡng tâm hồn.\n\nVăn học giúp ta hiểu đời, hiểu người. Qua số phận các nhân vật, ta học được bài học về tình yêu thương, lòng dũng cảm, sự trung thực. Một câu thơ hay có thể an ủi ta trong lúc buồn; một trang truyện hay có thể thắp lên trong ta niềm tin vào cuộc sống.\n\nVăn học còn là nơi lưu giữ kí ức của dân tộc. Những câu chuyện về cha ông, những bài thơ về quê hương đất nước đã hun đúc nên tâm hồn Việt Nam qua bao thế hệ. Không có văn học, một dân tộc sẽ mất đi một phần linh hồn của mình.\n\nMỗi thể loại văn học có một cách riêng để chạm đến trái tim con người: thơ ca bằng cảm xúc và nhạc điệu; truyện kể bằng số phận nhân vật; kịch bằng xung đột và đối thoại. Nhưng tất cả đều hướng tới một mục đích chung: làm cho con người tốt đẹp hơn, cuộc đời đáng sống hơn.\n\nHãy đọc sách, yêu văn học — không phải vì điểm số, mà vì chính tâm hồn mình. Người bạn đồng hành thầm lặng ấy sẽ không bao giờ phản bội ta.\n\nCâu 2. Văn học giúp con người điều gì?", "options": ["A. Giàu có", "B. Hiểu đời, hiểu người; học bài học về tình yêu thương, dũng cảm, trung thực; được an ủi, thắp niềm tin", "C. Nổi tiếng", "D. Khỏe mạnh"], "answer": "B", "explain": "Văn bản nêu vai trò: qua nhân vật, thơ ca, truyện kể, con người học được yêu thương, dũng cảm, trung thực và tìm thấy niềm tin.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HỌC — NGƯỜI BẠN ĐỒNG HÀNH CỦA CON NGƯỜI\n(Văn bản tổng hợp dùng làm ngữ liệu)\n\nCó người hỏi: trong thời đại công nghệ, văn học còn cần thiết không? Câu trả lời là: càng cần thiết hơn bao giờ hết. Bởi công nghệ có thể cho ta tiện nghi, nhưng chỉ văn học mới nuôi dưỡng tâm hồn.\n\nVăn học giúp ta hiểu đời, hiểu người. Qua số phận các nhân vật, ta học được bài học về tình yêu thương, lòng dũng cảm, sự trung thực. Một câu thơ hay có thể an ủi ta trong lúc buồn; một trang truyện hay có thể thắp lên trong ta niềm tin vào cuộc sống.\n\nVăn học còn là nơi lưu giữ kí ức của dân tộc. Những câu chuyện về cha ông, những bài thơ về quê hương đất nước đã hun đúc nên tâm hồn Việt Nam qua bao thế hệ. Không có văn học, một dân tộc sẽ mất đi một phần linh hồn của mình.\n\nMỗi thể loại văn học có một cách riêng để chạm đến trái tim con người: thơ ca bằng cảm xúc và nhạc điệu; truyện kể bằng số phận nhân vật; kịch bằng xung đột và đối thoại. Nhưng tất cả đều hướng tới một mục đích chung: làm cho con người tốt đẹp hơn, cuộc đời đáng sống hơn.\n\nHãy đọc sách, yêu văn học — không phải vì điểm số, mà vì chính tâm hồn mình. Người bạn đồng hành thầm lặng ấy sẽ không bao giờ phản bội ta.\n\nCâu 3. Vì sao nói không có văn học, một dân tộc sẽ mất đi một phần linh hồn?", "options": ["A. Vì văn học kiếm tiền", "B. Vì văn học là nơi lưu giữ kí ức dân tộc: chuyện cha ông, thơ về quê hương đã hun đúc tâm hồn Việt Nam qua bao thế hệ", "C. Vì văn học đẹp", "D. Ngẫu nhiên"], "answer": "B", "explain": "Văn bản lí giải: văn học lưu giữ kí ức, hun đúc tâm hồn dân tộc qua các thế hệ — mất văn học là mất một phần bản sắc, linh hồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HỌC — NGƯỜI BẠN ĐỒNG HÀNH CỦA CON NGƯỜI\n(Văn bản tổng hợp dùng làm ngữ liệu)\n\nCó người hỏi: trong thời đại công nghệ, văn học còn cần thiết không? Câu trả lời là: càng cần thiết hơn bao giờ hết. Bởi công nghệ có thể cho ta tiện nghi, nhưng chỉ văn học mới nuôi dưỡng tâm hồn.\n\nVăn học giúp ta hiểu đời, hiểu người. Qua số phận các nhân vật, ta học được bài học về tình yêu thương, lòng dũng cảm, sự trung thực. Một câu thơ hay có thể an ủi ta trong lúc buồn; một trang truyện hay có thể thắp lên trong ta niềm tin vào cuộc sống.\n\nVăn học còn là nơi lưu giữ kí ức của dân tộc. Những câu chuyện về cha ông, những bài thơ về quê hương đất nước đã hun đúc nên tâm hồn Việt Nam qua bao thế hệ. Không có văn học, một dân tộc sẽ mất đi một phần linh hồn của mình.\n\nMỗi thể loại văn học có một cách riêng để chạm đến trái tim con người: thơ ca bằng cảm xúc và nhạc điệu; truyện kể bằng số phận nhân vật; kịch bằng xung đột và đối thoại. Nhưng tất cả đều hướng tới một mục đích chung: làm cho con người tốt đẹp hơn, cuộc đời đáng sống hơn.\n\nHãy đọc sách, yêu văn học — không phải vì điểm số, mà vì chính tâm hồn mình. Người bạn đồng hành thầm lặng ấy sẽ không bao giờ phản bội ta.\n\nCâu 4. Mỗi thể loại văn học chạm đến trái tim con người bằng cách nào?", "options": ["A. Giống nhau", "B. Thơ ca bằng cảm xúc và nhạc điệu; truyện kể bằng số phận nhân vật; kịch bằng xung đột và đối thoại — nhưng cùng hướng tới làm con người tốt đẹp hơn", "C. Chỉ bằng hình ảnh", "D. Không chạm đến"], "answer": "B", "explain": "Văn bản tổng kết đặc trưng ba loại: thơ (cảm xúc, nhạc điệu), truyện (số phận nhân vật), kịch (xung đột, đối thoại) — cùng mục đích nhân văn.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HỌC — NGƯỜI BẠN ĐỒNG HÀNH CỦA CON NGƯỜI\n(Văn bản tổng hợp dùng làm ngữ liệu)\n\nCó người hỏi: trong thời đại công nghệ, văn học còn cần thiết không? Câu trả lời là: càng cần thiết hơn bao giờ hết. Bởi công nghệ có thể cho ta tiện nghi, nhưng chỉ văn học mới nuôi dưỡng tâm hồn.\n\nVăn học giúp ta hiểu đời, hiểu người. Qua số phận các nhân vật, ta học được bài học về tình yêu thương, lòng dũng cảm, sự trung thực. Một câu thơ hay có thể an ủi ta trong lúc buồn; một trang truyện hay có thể thắp lên trong ta niềm tin vào cuộc sống.\n\nVăn học còn là nơi lưu giữ kí ức của dân tộc. Những câu chuyện về cha ông, những bài thơ về quê hương đất nước đã hun đúc nên tâm hồn Việt Nam qua bao thế hệ. Không có văn học, một dân tộc sẽ mất đi một phần linh hồn của mình.\n\nMỗi thể loại văn học có một cách riêng để chạm đến trái tim con người: thơ ca bằng cảm xúc và nhạc điệu; truyện kể bằng số phận nhân vật; kịch bằng xung đột và đối thoại. Nhưng tất cả đều hướng tới một mục đích chung: làm cho con người tốt đẹp hơn, cuộc đời đáng sống hơn.\n\nHãy đọc sách, yêu văn học — không phải vì điểm số, mà vì chính tâm hồn mình. Người bạn đồng hành thầm lặng ấy sẽ không bao giờ phản bội ta.\n\nCâu 5. Theo em, vì sao nên đọc sách, yêu văn học? (Trả lời ngắn gọn)", "answer": "Để nuôi dưỡng tâm hồn, hiểu đời hiểu người, sống tốt đẹp hơn — không chỉ vì điểm số", "explain": "Chấp nhận các cách diễn đạt: văn học làm giàu đời sống tinh thần...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về giá trị của văn học đối với đời sống con người.", "explain": "DÀN Ý:\n1. Mở đoạn: văn học có giá trị to lớn, không thể thay thế.\n2. Thân đoạn: (a) Giá trị nhận thức: hiểu đời, hiểu người qua nhân vật; (b) Giá trị giáo dục: bồi đắp tình cảm, nhân cách; (c) Giá trị thẩm mĩ: rung động, làm giàu tâm hồn; (d) Lưu giữ kí ức dân tộc; (e) Mỗi thể loại một cách chạm đến trái tim; (f) Phê phán thói coi thường văn học, lười đọc.\n3. Kết đoạn: hãy yêu văn học vì chính tâm hồn mình.\n\nBÀI MẪU:\nVăn học có giá trị to lớn, không gì thay thế được đối với đời sống con người, nhất là trong thời đại công nghệ hôm nay. Trước hết, văn học giúp ta hiểu đời, hiểu người: qua số phận các nhân vật, ta học được bài học về tình yêu thương, lòng dũng cảm, sự trung thực; một câu thơ hay có thể an ủi ta trong lúc buồn, một trang truyện hay có thể thắp lên niềm tin vào cuộc sống. Văn học còn bồi đắp tâm hồn, hình thành nhân cách, hướng con người tới chân – thiện – mĩ — đó là giá trị giáo dục và thẩm mĩ sâu sắc. Ở tầm dân tộc, văn học là nơi lưu giữ kí ức: những câu chuyện về cha ông, những bài thơ về quê hương đã hun đúc nên tâm hồn Việt Nam qua bao thế hệ; không có văn học, một dân tộc sẽ mất đi một phần linh hồn của mình. Mỗi thể loại có cách riêng để chạm đến trái tim: thơ ca bằng cảm xúc và nhạc điệu, truyện kể bằng số phận nhân vật, kịch bằng xung đột và đối thoại — nhưng tất cả đều hướng tới mục đích chung: làm cho con người tốt đẹp hơn. Đáng tiếc, nhiều người hôm nay coi thường văn học, lười đọc sách, để tâm hồn mình khô cằn. Hãy đọc sách, yêu văn học — không phải vì điểm số, mà vì chính tâm hồn mình; người bạn đồng hành thầm lặng ấy sẽ không bao giờ phản bội ta.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ so sánh đặc trưng của ba loại trữ tình, tự sự, kịch (lấy dẫn chứng từ các tác phẩm đã học).", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — ba loại văn học lớn với đặc trưng riêng.\nII. Thân bài:\n1. Loại trữ tình:\n   a. Đối tượng: tâm trạng, cảm xúc của cái tôi trữ tình.\n   b. Phương thức: biểu cảm trực tiếp; hình ảnh, nhạc điệu.\n   c. Dẫn chứng: Vội vàng (Xuân Diệu) — tình yêu cuộc sống qua hình ảnh, nhịp điệu.\n2. Loại tự sự:\n   a. Đối tượng: con người, sự kiện qua cốt truyện.\n   b. Phương thức: kể chuyện — cốt truyện, nhân vật, ngôi kể, chi tiết.\n   c. Dẫn chứng: Ông già và biển cả (Hê-minh-uê) — ông lão San-ti-a-gô kiên cường.\n3. Loại kịch:\n   a. Đối tượng: xung đột đời sống.\n   b. Phương thức: đối thoại, độc thoại, hành động sân khấu.\n   c. Dẫn chứng: Hồn Trương Ba, da hàng thịt (Lưu Quang Vũ) — xung đột giữa hồn và xác.\n4. So sánh:\n   a. Điểm giống: đều phản ánh đời sống, hướng tới giá trị nhân văn.\n   b. Điểm khác: đối tượng, phương thức, ngôn ngữ (bảng so sánh).\nIII. Kết bài: khẳng định sự phong phú của văn học; mỗi loại một vẻ đẹp.\n\nĐOẠN MẪU (mở bài):\nVăn học là vườn hoa muôn sắc, trong đó ba loại lớn — trữ tình, tự sự, kịch — là ba lối đi khác nhau cùng dẫn tới một đích đến: phản ánh đời sống và bồi đắp tâm hồn con người. Mỗi loại có đối tượng phản ánh, phương thức biểu đạt và ngôn ngữ nghệ thuật riêng, tạo nên vẻ đẹp độc đáo không thể lẫn. So sánh đặc trưng ba loại qua các tác phẩm đã học — Vội vàng của Xuân Diệu, Ông già và biển cả của Hê-minh-uê, Hồn Trương Ba, da hàng thịt của Lưu Quang Vũ — giúp ta hiểu sâu hơn sự phong phú của văn học và thêm yêu những trang viết.", "points": 0}]}]}
