 lời dặn đều toát lên tình yêu nước, thương dân vô hạn và niềm tin mãnh liệt vào tương lai của dân tộc.\n\nCâu 4. Lời dặn \"không tổ chức đám tang linh đình, không lãng phí thì giờ và tiền bạc của nhân dân\" thể hiện điều gì?", "options": ["A. Bác không quan tâm đến tang lễ", "B. Đến giây phút cuối cùng, Người vẫn nghĩ về dân, về nước; lối sống giản dị, tiết kiệm đến hơi thở cuối cùng", "C. Bác sợ tốn kém", "D. Đó là quy định"], "answer": "B", "explain": "Lời dặn về việc riêng cho thấy đến lúc đi xa, Bác vẫn một lòng vì dân, vì nước — phong cách giản dị, tiết kiệm và tình thương bao la đến hơi thở cuối cùng.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nDI CHÚC CỦA BÁC — NHỮNG LỜI DẶN THIÊNG LIÊNG\n\nTrước lúc đi xa, Chủ tịch Hồ Chí Minh đã để lại bản Di chúc thiêng liêng — kết tinh trí tuệ, tình cảm và tâm huyết cả cuộc đời của Người. Được viết trong những năm 1965–1969, Di chúc là văn kiện lịch sử vô giá, là ngọn đuốc soi đường cho dân tộc.\n\nTrong Di chúc, điều đầu tiên Bác dặn là về Đảng: Đảng ta là một Đảng cầm quyền, mỗi đảng viên phải thật sự thấm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Bác căn dặn phải giữ gìn sự đoàn kết nhất trí trong Đảng như giữ gìn con ngươi của mắt mình.\n\nVới nhân dân, Bác dặn Đảng và Chính phủ phải chăm lo đời sống của nhân dân, nhất là những người có công với cách mạng, những gia đình thương binh, liệt sĩ. Bác mong muốn ai cũng có cơm ăn áo mặc, ai cũng được học hành.\n\nVới thanh niên, Bác dành tình cảm đặc biệt: thanh niên là người chủ tương lai của nước nhà, Đảng cần chăm lo giáo dục đạo đức cách mạng cho họ, đào tạo họ thành những người thừa kế xây dựng chủ nghĩa xã hội vừa hồng vừa chuyên.\n\nVới thiếu niên, nhi đồng, Bác dặn phải chăm sóc, giáo dục các cháu thành những công dân tốt. Tình yêu thương của Bác dành cho các cháu thiếu nhi là vô bờ bến.\n\nCuối cùng, về việc riêng, Bác dặn không tổ chức đám tang linh đình, không lãng phí thì giờ và tiền bạc của nhân dân. Đến giây phút cuối cùng, Người vẫn nghĩ về dân, về nước.\n\nDi chúc của Bác không chỉ là văn kiện chính trị mà còn là áng văn giàu cảm xúc, với ngôn ngữ giản dị, chân thành mà thấm thía. Mỗi lời dặn đều toát lên tình yêu nước, thương dân vô hạn và niềm tin mãnh liệt vào tương lai của dân tộc.\n\nCâu 5. Qua Di chúc, em cảm nhận được điều gì về con người Hồ Chí Minh? (Trả lời ngắn gọn)", "answer": "Một lòng vì nước, vì dân; giản dị, giàu tình thương đến giây phút cuối cùng", "explain": "Chấp nhận các cách diễn đạt tương đương: trí tuệ, tâm huyết; tình yêu nước thương dân vô hạn; niềm tin vào tương lai dân tộc...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về trách nhiệm của tuổi trẻ trong việc thực hiện Di chúc của Bác.", "explain": "DÀN Ý:\n1. Mở đoạn: Di chúc của Bác là kim chỉ nam; tuổi trẻ có trách nhiệm thực hiện.\n2. Thân đoạn: (a) Trách nhiệm: học tập tốt, rèn đạo đức, trở thành người vừa hồng vừa chuyên như Bác dặn; (b) Góp sức xây dựng đất nước; giữ gìn đoàn kết; (c) Phê phán những bạn trẻ sống vô trách nhiệm, phụ lòng mong mỏi của Bác.\n3. Kết đoạn: quyết tâm thực hiện lời Bác dặn.\n\nBÀI MẪU:\nDi chúc thiêng liêng của Chủ tịch Hồ Chí Minh không chỉ là văn kiện lịch sử mà còn là kim chỉ nam cho mọi thế hệ, nhất là tuổi trẻ hôm nay. Thực hiện Di chúc của Bác, trách nhiệm đầu tiên của tuổi trẻ là ra sức học tập, rèn luyện để trở thành những người vừa hồng vừa chuyên như lời Bác dặn — có đức, có tài để gánh vác sự nghiệp xây dựng đất nước. Mỗi bạn trẻ cần nuôi dưỡng đạo đức cách mạng: cần kiệm liêm chính, sống có lí tưởng, có trách nhiệm với cộng đồng. Bên cạnh đó, tuổi trẻ phải giữ gìn và phát huy truyền thống đoàn kết của dân tộc, tích cực tham gia các phong trào tình nguyện, góp sức vào sự phát triển của quê hương. Đáng phê phán là những bạn trẻ sống ích kỉ, vô trách nhiệm, chỉ biết hưởng thụ mà quên đi lời dặn thiêng liêng của Bác, phụ lòng mong mỏi của Người. Hơn nửa thế kỉ đã trôi qua từ ngày Bác đi xa, nhưng những lời dặn trong Di chúc vẫn còn nguyên giá trị thời sự. Mỗi người trẻ hãy tự hứa với lòng mình: sống xứng đáng với niềm tin mà Bác đã đặt vào thế hệ tương lai của nước nhà.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Báo cáo kết quả bài tập dự án (theo kiểu bài viết của Bài 6 trong SGK): Trình bày kết quả tìm hiểu về cuộc đời và sự nghiệp văn học của Hồ Chí Minh.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở đầu: giới thiệu dự án (tìm hiểu tác gia Hồ Chí Minh); mục đích, phương pháp (đọc SGK, tài liệu, thảo luận nhóm).\nII. Nội dung:\n1. Cuộc đời: từ Nguyễn Tất Thành đến Hồ Chí Minh — hành trình tìm đường cứu nước, lãnh đạo cách mạng.\n2. Quan điểm sáng tác: Văn hóa phải soi đường cho quốc dân đi; văn nghệ phục vụ nhân dân.\n3. Sự nghiệp văn học:\n   a. Văn chính luận: Tuyên ngôn Độc lập.\n   b. Truyện kí trào phúng: Những trò lố.\n   c. Thơ ca: Nhật kí trong tù, các bài thơ chữ Hán.\n   d. Di chúc và các văn kiện.\n4. Phong cách: giản dị, trong sáng; thống nhất chất chiến sĩ và thi sĩ.\n5. Nhận xét, bài học: những phát hiện thú vị; ý nghĩa với tuổi trẻ hôm nay.\nIII. Kết luận: khẳng định giá trị; nêu cảm nghĩ và quyết tâm học tập, làm theo.\n\nĐOẠN MẪU (mở đầu):\nHồ Chí Minh không chỉ là Anh hùng giải phóng dân tộc, Danh nhân văn hóa thế giới mà còn là một tác gia lớn với sự nghiệp văn học đa dạng, giàu giá trị. Để hiểu sâu hơn về con người và sự nghiệp của Người, nhóm chúng em đã thực hiện dự án tìm hiểu về cuộc đời và sự nghiệp văn học của Hồ Chí Minh thông qua việc đọc sách giáo khoa, các tài liệu tham khảo và thảo luận nhóm. Báo cáo dưới đây trình bày kết quả tìm hiểu của nhóm.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỒ CHÍ MINH VỚI THIẾU NHI\n\nTrong muôn vàn tình cảm của Hồ Chí Minh, tình yêu dành cho thiếu niên, nhi đồng là một trong những tình cảm đặc biệt, trong sáng nhất. Dù bận trăm công nghìn việc, Bác vẫn luôn dành thời gian quan tâm đến các cháu.\n\nCòn nhớ, mỗi dịp Trung thu, Bác đều gửi thư chúc Tết Trung thu cho các cháu thiếu nhi. Những bức thư với lời lẽ giản dị, ấm áp: Bác mong các cháu chăm ngoan, học giỏi, vâng lời cha mẹ, thầy cô. Bác còn gửi quà, tổ chức đón Trung thu cho các cháu, cùng các cháu rước đèn, phá cỗ.\n\nBác cũng thường đến thăm các trường học, trại trẻ mồ côi. Mỗi lần đến, Bác đều ân cần hỏi han: Các cháu ăn có no không? Học có giỏi không? Có vâng lời thầy cô không? Rồi Bác kể chuyện, dạy các cháu những bài học đầu đời về đạo đức, về lòng yêu nước.\n\nTrong Di chúc thiêng liêng, Bác cũng không quên dặn: phải chăm sóc, giáo dục thiếu niên, nhi đồng thành những công dân tốt. Tình thương của Bác dành cho các cháu là vô bờ bến.\n\nĐáp lại tình cảm ấy, thiếu nhi Việt Nam luôn kính yêu Bác, coi Bác như người ông hiền từ. Các phong trào như Kế hoạch nhỏ, Nghìn việc tốt ra đời từ lòng kính yêu Bác, giáo dục các cháu biết sống có ích.\n\nTình yêu của Bác dành cho thiếu nhi không chỉ là tình cảm cá nhân mà còn thể hiện tầm nhìn xa: trẻ em là tương lai của đất nước, chăm lo cho trẻ em chính là chăm lo cho tương lai của dân tộc.\n\nCâu 1. Tình cảm đặc biệt nào của Hồ Chí Minh được nói đến trong văn bản?", "options": ["A. Tình yêu thiên nhiên", "B. Tình yêu dành cho thiếu niên, nhi đồng", "C. Tình bạn quốc tế", "D. Tình yêu văn nghệ"], "answer": "B", "explain": "Văn bản khẳng định: tình yêu dành cho thiếu niên, nhi đồng là một trong những tình cảm đặc biệt, trong sáng nhất của Hồ Chí Minh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỒ CHÍ MINH VỚI THIẾU NHI\n\nTrong muôn vàn tình cảm của Hồ Chí Minh, tình yêu dành cho thiếu niên, nhi đồng là một trong những tình cảm đặc biệt, trong sáng nhất. Dù bận trăm công nghìn việc, Bác vẫn luôn dành thời gian quan tâm đến các cháu.\n\nCòn nhớ, mỗi dịp Trung thu, Bác đều gửi thư chúc Tết Trung thu cho các cháu thiếu nhi. Những bức thư với lời lẽ giản dị, ấm áp: Bác mong các cháu chăm ngoan, học giỏi, vâng lời cha mẹ, thầy cô. Bác còn gửi quà, tổ chức đón Trung thu cho các cháu, cùng các cháu rước đèn, phá cỗ.\n\nBác cũng thường đến thăm các trường học, trại trẻ mồ côi. Mỗi lần đến, Bác đều ân cần hỏi han: Các cháu ăn có no không? Học có giỏi không? Có vâng lời thầy cô không? Rồi Bác kể chuyện, dạy các cháu những bài học đầu đời về đạo đức, về lòng yêu nước.\n\nTrong Di chúc thiêng liêng, Bác cũng không quên dặn: phải chăm sóc, giáo dục thiếu niên, nhi đồng thành những công dân tốt. Tình thương của Bác dành cho các cháu là vô bờ bến.\n\nĐáp lại tình cảm ấy, thiếu nhi Việt Nam luôn kính yêu Bác, coi Bác như người ông hiền từ. Các phong trào như Kế hoạch nhỏ, Nghìn việc tốt ra đời từ lòng kính yêu Bác, giáo dục các cháu biết sống có ích.\n\nTình yêu của Bác dành cho thiếu nhi không chỉ là tình cảm cá nhân mà còn thể hiện tầm nhìn xa: trẻ em là tương lai của đất nước, chăm lo cho trẻ em chính là chăm lo cho tương lai của dân tộc.\n\nCâu 2. Vào dịp nào Bác thường gửi thư cho các cháu thiếu nhi?", "options": ["A. Tết Nguyên đán", "B. Tết Trung thu", "C. Ngày Quốc tế Thiếu nhi", "D. Ngày khai giảng"], "answer": "B", "explain": "Văn bản cho biết: mỗi dịp Trung thu, Bác đều gửi thư chúc Tết Trung thu cho các cháu với lời lẽ giản dị, ấm áp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỒ CHÍ MINH VỚI THIẾU NHI\n\nTrong muôn vàn tình cảm của Hồ Chí Minh, tình yêu dành cho thiếu niên, nhi đồng là một trong những tình cảm đặc biệt, trong sáng nhất. Dù bận trăm công nghìn việc, Bác vẫn luôn dành thời gian quan tâm đến các cháu.\n\nCòn nhớ, mỗi dịp Trung thu, Bác đều gửi thư chúc Tết Trung thu cho các cháu thiếu nhi. Những bức thư với lời lẽ giản dị, ấm áp: Bác mong các cháu chăm ngoan, học giỏi, vâng lời cha mẹ, thầy cô. Bác còn gửi quà, tổ chức đón Trung thu cho các cháu, cùng các cháu rước đèn, phá cỗ.\n\nBác cũng thường đến thăm các trường học, trại trẻ mồ côi. Mỗi lần đến, Bác đều ân cần hỏi han: Các cháu ăn có no không? Học có giỏi không? Có vâng lời thầy cô không? Rồi Bác kể chuyện, dạy các cháu những bài học đầu đời về đạo đức, về lòng yêu nước.\n\nTrong Di chúc thiêng liêng, Bác cũng không quên dặn: phải chăm sóc, giáo dục thiếu niên, nhi đồng thành những công dân tốt. Tình thương của Bác dành cho các cháu là vô bờ bến.\n\nĐáp lại tình cảm ấy, thiếu nhi Việt Nam luôn kính yêu Bác, coi Bác như người ông hiền từ. Các phong trào như Kế hoạch nhỏ, Nghìn việc tốt ra đời từ lòng kính yêu Bác, giáo dục các cháu biết sống có ích.\n\nTình yêu của Bác dành cho thiếu nhi không chỉ là tình cảm cá nhân mà còn thể hiện tầm nhìn xa: trẻ em là tương lai của đất nước, chăm lo cho trẻ em chính là chăm lo cho tương lai của dân tộc.\n\nCâu 3. Trong Di chúc, Bác dặn gì về thiếu niên, nhi đồng?", "options": ["A. Không nhắc đến", "B. Phải chăm sóc, giáo dục các cháu thành những công dân tốt", "C. Để các cháu tự phát triển", "D. Chỉ quan tâm đến thanh niên"], "answer": "B", "explain": "Trong Di chúc thiêng liêng, Bác dặn phải chăm sóc, giáo dục thiếu niên, nhi đồng thành những công dân tốt — tình thương vô bờ bến đến giây phút cuối cùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỒ CHÍ MINH VỚI THIẾU NHI\n\nTrong muôn vàn tình cảm của Hồ Chí Minh, tình yêu dành cho thiếu niên, nhi đồng là một trong những tình cảm đặc biệt, trong sáng nhất. Dù bận trăm công nghìn việc, Bác vẫn luôn dành thời gian quan tâm đến các cháu.\n\nCòn nhớ, mỗi dịp Trung thu, Bác đều gửi thư chúc Tết Trung thu cho các cháu thiếu nhi. Những bức thư với lời lẽ giản dị, ấm áp: Bác mong các cháu chăm ngoan, học giỏi, vâng lời cha mẹ, thầy cô. Bác còn gửi quà, tổ chức đón Trung thu cho các cháu, cùng các cháu rước đèn, phá cỗ.\n\nBác cũng thường đến thăm các trường học, trại trẻ mồ côi. Mỗi lần đến, Bác đều ân cần hỏi han: Các cháu ăn có no không? Học có giỏi không? Có vâng lời thầy cô không? Rồi Bác kể chuyện, dạy các cháu những bài học đầu đời về đạo đức, về lòng yêu nước.\n\nTrong Di chúc thiêng liêng, Bác cũng không quên dặn: phải chăm sóc, giáo dục thiếu niên, nhi đồng thành những công dân tốt. Tình thương của Bác dành cho các cháu là vô bờ bến.\n\nĐáp lại tình cảm ấy, thiếu nhi Việt Nam luôn kính yêu Bác, coi Bác như người ông hiền từ. Các phong trào như Kế hoạch nhỏ, Nghìn việc tốt ra đời từ lòng kính yêu Bác, giáo dục các cháu biết sống có ích.\n\nTình yêu của Bác dành cho thiếu nhi không chỉ là tình cảm cá nhân mà còn thể hiện tầm nhìn xa: trẻ em là tương lai của đất nước, chăm lo cho trẻ em chính là chăm lo cho tương lai của dân tộc.\n\nCâu 4. Tình yêu của Bác dành cho thiếu nhi thể hiện tầm nhìn gì?", "options": ["A. Chỉ là tình cảm cá nhân", "B. Tầm nhìn xa: trẻ em là tương lai của đất nước, chăm lo cho trẻ em chính là chăm lo cho tương lai dân tộc", "C. Muốn các cháu làm chính trị", "D. Không có ý nghĩa gì"], "answer": "B", "explain": "Văn bản khái quát: tình yêu ấy không chỉ là tình cảm cá nhân mà thể hiện tầm nhìn chiến lược — đầu tư cho trẻ em là đầu tư cho tương lai.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỒ CHÍ MINH VỚI THIẾU NHI\n\nTrong muôn vàn tình cảm của Hồ Chí Minh, tình yêu dành cho thiếu niên, nhi đồng là một trong những tình cảm đặc biệt, trong sáng nhất. Dù bận trăm công nghìn việc, Bác vẫn luôn dành thời gian quan tâm đến các cháu.\n\nCòn nhớ, mỗi dịp Trung thu, Bác đều gửi thư chúc Tết Trung thu cho các cháu thiếu nhi. Những bức thư với lời lẽ giản dị, ấm áp: Bác mong các cháu chăm ngoan, học giỏi, vâng lời cha mẹ, thầy cô. Bác còn gửi quà, tổ chức đón Trung thu cho các cháu, cùng các cháu rước đèn, phá cỗ.\n\nBác cũng thường đến thăm các trường học, trại trẻ mồ côi. Mỗi lần đến, Bác đều ân cần hỏi han: Các cháu ăn có no không? Học có giỏi không? Có vâng lời thầy cô không? Rồi Bác kể chuyện, dạy các cháu những bài học đầu đời về đạo đức, về lòng yêu nước.\n\nTrong Di chúc thiêng liêng, Bác cũng không quên dặn: phải chăm sóc, giáo dục thiếu niên, nhi đồng thành những công dân tốt. Tình thương của Bác dành cho các cháu là vô bờ bến.\n\nĐáp lại tình cảm ấy, thiếu nhi Việt Nam luôn kính yêu Bác, coi Bác như người ông hiền từ. Các phong trào như Kế hoạch nhỏ, Nghìn việc tốt ra đời từ lòng kính yêu Bác, giáo dục các cháu biết sống có ích.\n\nTình yêu của Bác dành cho thiếu nhi không chỉ là tình cảm cá nhân mà còn thể hiện tầm nhìn xa: trẻ em là tương lai của đất nước, chăm lo cho trẻ em chính là chăm lo cho tương lai của dân tộc.\n\nCâu 5. Theo em, thiếu nhi cần làm gì để xứng đáng với tình cảm của Bác? (Trả lời ngắn gọn)", "answer": "Chăm ngoan, học giỏi, vâng lời cha mẹ thầy cô, làm nghìn việc tốt", "explain": "Chấp nhận các cách diễn đạt tương đương: cố gắng học tập; rèn đạo đức; yêu quê hương; giúp đỡ mọi người...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của việc chăm ngoan, học giỏi của thiếu nhi.", "explain": "DÀN Ý:\n1. Mở đoạn: chăm ngoan, học giỏi là bổn phận và niềm vui của tuổi nhỏ.\n2. Thân đoạn: (a) Ý nghĩa: đáp lại công ơn cha mẹ, thầy cô và tình cảm của Bác Hồ; (b) Là nền tảng cho tương lai; (c) Phê phán thói lười học, ham chơi, vô lễ.\n3. Kết đoạn: hãy thực hiện lời Bác dạy.\n\nBÀI MẪU:\nChăm ngoan, học giỏi là bổn phận thiêng liêng và cũng là niềm vui lớn nhất của tuổi nhỏ. Trước hết, đó là cách để các em đáp lại công ơn sinh thành của cha mẹ, công dạy dỗ của thầy cô và tình cảm yêu thương vô bờ bến của Bác Hồ dành cho thiếu nhi. Mỗi điểm mười, mỗi việc tốt các em làm được đều là bông hoa đẹp dâng lên Bác. Bên cạnh đó, chăm ngoan, học giỏi hôm nay chính là nền tảng vững chắc cho tương lai: kiến thức và đạo đức được bồi đắp từ thuở nhỏ sẽ giúp các em trở thành những công dân có ích, gánh vác được sự nghiệp xây dựng đất nước mai sau như lời Bác dặn. Ngược lại, những bạn nhỏ lười học, ham chơi, vô lễ với người lớn không chỉ phụ công cha mẹ, thầy cô mà còn đánh mất tương lai của chính mình. Lời Bác dạy năm xưa vẫn còn vang vọng: các cháu phải chăm ngoan, học giỏi, vâng lời cha mẹ, thầy cô. Mỗi thiếu nhi hãy ghi nhớ và thực hiện lời dạy ấy bằng hành động cụ thể mỗi ngày — để xứng đáng là cháu ngoan Bác Hồ.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về trách nhiệm của xã hội trong việc chăm sóc, giáo dục thiếu nhi.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — trẻ em là tương lai, cần được chăm sóc, giáo dục.\nII. Thân bài:\n1. Vai trò của việc chăm sóc, giáo dục thiếu nhi (lời Bác dặn; trẻ em là chủ nhân tương lai).\n2. Trách nhiệm của các lực lượng:\n   a. Gia đình: nuôi dưỡng, dạy dỗ, làm gương.\n   b. Nhà trường: giáo dục toàn diện đức — trí — thể — mĩ.\n   c. Xã hội: tạo môi trường lành mạnh; bảo vệ trẻ em khỏi bạo lực, xâm hại, tệ nạn.\n3. Thực trạng: còn nhiều trẻ em có hoàn cảnh khó khăn, bị bạo hành, bỏ học — phê phán.\n4. Giải pháp: hoàn thiện pháp luật bảo vệ trẻ em; tăng đầu tư cho giáo dục; mỗi người chung tay.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nTrẻ em là hạnh phúc của gia đình, là tương lai của dân tộc — chân lí ấy đã được Hồ Chí Minh khẳng định bằng cả tình cảm và hành động suốt cuộc đời Người. Trong Di chúc thiêng liêng, Bác dặn phải chăm sóc, giáo dục thiếu niên, nhi đồng thành những công dân tốt. Thực hiện lời dặn của Bác, chăm sóc và giáo dục thiếu nhi không chỉ là trách nhiệm của gia đình, nhà trường mà của toàn xã hội. Nhìn nhận đúng trách nhiệm này có ý nghĩa thiết thực trong bối cảnh hiện nay.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỒ CHÍ MINH VỚI BÁO CHÍ CÁCH MẠNG\n\nHồ Chí Minh không chỉ là nhà cách mạng vĩ đại mà còn là nhà báo xuất sắc. Cả cuộc đời hoạt động cách mạng của Người gắn liền với ngòi bút báo chí — vũ khí sắc bén trong đấu tranh.\n\nTừ những năm 20 của thế kỉ XX, khi hoạt động ở Pháp, Nguyễn Ái Quốc đã viết báo, làm báo. Người là chủ bút báo Người cùng khổ — tờ báo của Hội Liên hiệp thuộc địa, vạch trần tội ác của chủ nghĩa thực dân. Những bài báo của Người với lập luận sắc sảo, giọng văn châm biếm đã gây tiếng vang lớn.\n\nSau này, Người sáng lập và chỉ đạo nhiều tờ báo cách mạng: báo Thanh niên (1925) — cơ quan ngôn luận của Hội Việt Nam Cách mạng Thanh niên, báo Cứu quốc, báo Nhân dân... Qua báo chí, Người tuyên truyền đường lối cách mạng, cổ vũ tinh thần yêu nước, vạch trần kẻ thù.\n\nPhong cách báo chí của Hồ Chí Minh có những đặc điểm nổi bật: viết ngắn gọn, súc tích; ngôn ngữ trong sáng, dễ hiểu; luôn gắn với thực tiễn đời sống; vừa có tính chiến đấu cao vừa giàu tính thuyết phục. Người từng dạy: viết báo phải chân thật, phải vì lợi ích của nhân dân.\n\nNgày nay, báo chí cách mạng Việt Nam vẫn noi theo tấm gương và phong cách của Hồ Chí Minh: trung thực, khách quan, gần gũi với nhân dân, đấu tranh với cái xấu, bảo vệ cái tốt. Tấm gương nhà báo Hồ Chí Minh mãi là niềm tự hào và là bài học quý cho những người làm báo hôm nay.\n\nCâu 1. Tờ báo nào do Nguyễn Ái Quốc làm chủ bút ở Pháp?", "options": ["A. Báo Thanh niên", "B. Báo Người cùng khổ — cơ quan của Hội Liên hiệp thuộc địa", "C. Báo Nhân dân", "D. Báo Cứu quốc"], "answer": "B", "explain": "Văn bản cho biết: ở Pháp, Nguyễn Ái Quốc làm chủ bút báo Người cùng khổ — tờ báo vạch trần tội ác của chủ nghĩa thực dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỒ CHÍ MINH VỚI BÁO CHÍ CÁCH MẠNG\n\nHồ Chí Minh không chỉ là nhà cách mạng vĩ đại mà còn là nhà báo xuất sắc. Cả cuộc đời hoạt động cách mạng của Người gắn liền với ngòi bút báo chí — vũ khí sắc bén trong đấu tranh.\n\nTừ những năm 20 của thế kỉ XX, khi hoạt động ở Pháp, Nguyễn sảo, giọng văn châm biếm đã gây tiếng vang lớn.\n\nSau này, Người sáng lập và chỉ đạo nhiều tờ báo cách mạng: báo Thanh niên (1925) — cơ quan ngôn luận của Hội Việt Nam Cách mạng Thanh niên, báo Cứu quốc, báo Nhân dân... Qua báo chí, Người tuyên truyền đường lối cách mạng, cổ vũ tinh thần yêu nước, vạch trần kẻ thù.\n\nPhong cách báo chí của Hồ Chí Minh có những đặc điểm nổi bật: viết ngắn gọn, súc tích; ngôn ngữ trong sáng, dễ hiểu; luôn gắn với thực tiễn đời sống; vừa có tính chiến đấu cao vừa giàu tính thuyết phục. Người từng dạy: viết báo phải chân thật, phải vì lợi ích của nhân dân.\n\nNgày nay, báo chí cách mạng Việt Nam vẫn noi theo tấm gương và phong cách của Hồ Chí Minh: trung thực, khách quan, gần gũi với nhân dân, đấu tranh với cái xấu, bảo vệ cái tốt. Tấm gương nhà báo Hồ Chí Minh mãi là niềm tự hào và là bài học quý cho những người làm báo hôm nay.\n\nCâu 3. Phong cách báo chí của Hồ Chí Minh có đặc điểm gì?", "options": ["A. Dài dòng, hoa mĩ", "B. Ngắn gọn, súc tích; ngôn ngữ trong sáng, dễ hiểu; gắn với thực tiễn; vừa chiến đấu vừa thuyết phục", "C. Khô khan, khó hiểu", "D. Chỉ viết cho trí thức"], "answer": "B", "explain": "Phong cách báo chí Hồ Chí Minh: ngắn gọn, trong sáng, gần gũi quần chúng, giàu tính chiến đấu — mẫu mực cho báo chí cách mạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỒ CHÍ MINH VỚI BÁO CHÍ CÁCH MẠNG\n\nHồ Chí Minh không chỉ là nhà cách mạng vĩ đại mà còn là nhà báo xuất sắc. Cả cuộc đời hoạt động cách mạng của Người gắn liền với ngòi bút báo chí — vũ khí sắc bén trong đấu tranh.\n\nTừ những năm 20 của thế kỉ XX, khi hoạt động ở Pháp, Nguyễn Ái Quốc đã viết báo, làm báo. Người là chủ bút báo Người cùng khổ — tờ báo của Hội Liên hiệp thuộc địa, vạch trần tội ác của chủ nghĩa thực dân. Những bài báo của Người với lập luận sắc sảo, giọng văn châm biếm đã gây tiếng vang lớn.\n\nSau này, Người sáng lập và chỉ đạo nhiều tờ báo cách mạng: báo Thanh niên (1925) — cơ quan ngôn luận của Hội Việt Nam Cách mạng Thanh niên, báo Cứu quốc, báo Nhân dân... Qua báo chí, Người tuyên truyền đường lối cách mạng, cổ vũ tinh thần yêu nước, vạch trần kẻ thù.\n\nPhong cách báo chí của Hồ Chí Minh có những đặc điểm nổi bật: viết ngắn gọn, súc tích; ngôn ngữ trong sáng, dễ hiểu; luôn gắn với thực tiễn đời sống; vừa có tính chiến đấu cao vừa giàu tính thuyết phục. Người từng dạy: viết báo phải chân thật, phải vì lợi ích của nhân dân.\n\nNgày nay, báo chí cách mạng Việt Nam vẫn noi theo tấm gương và phong cách của Hồ Chí Minh: trung thực, khách quan, gần gũi với nhân dân, đấu tranh với cái xấu, bảo vệ cái tốt. Tấm gương nhà báo Hồ Chí Minh mãi là niềm tự hào và là bài học quý cho những người làm báo hôm nay.\n\nCâu 4. Hồ Chí Minh dạy người làm báo phải như thế nào?", "options": ["A. Viết thật dài", "B. Viết báo phải chân thật, phải vì lợi ích của nhân dân", "C. Chỉ viết tin vui", "D. Tránh đấu tranh"], "answer": "B", "explain": "Người dạy: viết báo phải chân thật, phải vì lợi ích của nhân dân — nguyên tắc đạo đức nghề báo mà Người luôn thực hiện.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỒ CHÍ MINH VỚI BÁO CHÍ CÁCH MẠNG\n\nHồ Chí Minh không chỉ là nhà cách mạng vĩ đại mà còn là nhà báo xuất sắc. Cả cuộc đời hoạt động cách mạng của Người gắn liền với ngòi bút báo chí — vũ khí sắc bén trong đấu tranh.\n\nTừ những năm 20 của thế kỉ XX, khi hoạt động ở Pháp, Nguyễn Ái Quốc đã viết báo, làm báo. Người là chủ bút báo Người cùng khổ — tờ báo của Hội Liên hiệp thuộc địa, vạch trần tội ác của chủ nghĩa thực dân. Những bài báo của Người với lập luận sắc sảo, giọng văn châm biếm đã gây tiếng vang lớn.\n\nSau này, Người sáng lập và chỉ đạo nhiều tờ báo cách mạng: báo Thanh niên (1925) — cơ quan ngôn luận của Hội Việt Nam Cách mạng Thanh niên, báo Cứu quốc, báo Nhân dân... Qua báo chí, Người tuyên truyền đường lối cách mạng, cổ vũ tinh thần yêu nước, vạch trần kẻ thù.\n\nPhong cách báo chí của Hồ Chí Minh có những đặc điểm nổi bật: viết ngắn gọn, súc tích; ngôn ngữ trong sáng, dễ hiểu; luôn gắn với thực tiễn đời sống; vừa có tính chiến đấu cao vừa giàu tính thuyết phục. Người từng dạy: viết báo phải chân thật, phải vì lợi ích của nhân dân.\n\nNgày nay, báo chí cách mạng Việt Nam vẫn noi theo tấm gương và phong cách của Hồ Chí Minh: trung thực, khách quan, gần gũi với nhân dân, đấu tranh với cái xấu, bảo vệ cái tốt. Tấm gương nhà báo Hồ Chí Minh mãi là niềm tự hào và là bài học quý cho những người làm báo hôm nay.\n\nCâu 5. Qua văn bản, em hiểu thêm điều gì về vai trò của báo chí? (Trả lời ngắn gọn)", "answer": "Báo chí là vũ khí đấu tranh, tuyên truyền, cổ vũ cái tốt, chống cái xấu", "explain": "Chấp nhận các cách diễn đạt tương đương: báo chí phục vụ nhân dân; phải trung thực, khách quan...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của báo chí trong đời sống hiện nay.", "explain": "DÀN Ý:\n1. Mở đoạn: báo chí có vai trò quan trọng trong xã hội hiện đại.\n2. Thân đoạn: (a) Vai trò: cung cấp thông tin, định hướng dư luận, đấu tranh với cái xấu, bảo vệ cái tốt như truyền thống báo chí cách mạng; (b) Yêu cầu: trung thực, khách quan noi gương Bác Hồ; (c) Phê phán báo lá cải, tin giả.\n3. Kết đoạn: người đọc cần tỉnh táo.\n\nBÀI MẪU:\nBáo chí giữ vai trò vô cùng quan trọng trong đời sống xã hội hiện nay. Trước hết, báo chí là kênh cung cấp thông tin nhanh chóng, giúp người dân nắm bắt tình hình trong nước và thế giới. Hơn nữa, báo chí còn định hướng dư luận, cổ vũ những điều tốt đẹp, đấu tranh với cái xấu, cái ác — phát huy truyền thống của báo chí cách mạng mà Hồ Chí Minh đã đặt nền móng. Những phóng sự điều tra phanh phui tham nhũng, những bài viết ngợi ca tấm gương người tốt việc tốt đều góp phần làm cho xã hội tốt đẹp hơn. Tuy nhiên, bên cạnh những tờ báo chân chính, hiện nay cũng xuất hiện không ít báo lá cải chạy theo thị trường, giật tít câu khách, thậm chí đăng tin giả gây hoang mang dư luận — đi ngược lại đạo đức nghề báo mà Bác Hồ đã dạy: chân thật và vì lợi ích nhân dân. Vì vậy, người làm báo phải luôn rèn luyện bản lĩnh, giữ vững đạo đức nghề nghiệp; còn người đọc cũng cần tỉnh táo, biết chọn lọc thông tin, không tin và lan truyền tin chưa kiểm chứng. Một nền báo chí lành mạnh là nền tảng của một xã hội văn minh.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về văn hóa đọc báo và kĩ năng tiếp nhận thông tin của giới trẻ.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — bùng nổ thông tin đặt ra yêu cầu về văn hóa đọc báo.\nII. Thân bài:\n1. Thực trạng: giới trẻ đọc nhiều tin trên mạng xã hội nhưng ít đọc báo chính thống; đọc lướt, thiếu kiểm chứng.\n2. Hậu quả: dễ tin vào tin giả; nhận thức lệch lạc; bị lợi dụng.\n3. Nguyên nhân: thiếu kĩ năng; tâm lí thích tin giật gân; báo chí chính thống chưa hấp dẫn với giới trẻ.\n4. Giải pháp:\n   a. Rèn kĩ năng kiểm chứng thông tin (xem nguồn, đối chiếu nhiều nguồn).\n   b. Ưu tiên báo chí chính thống, có uy tín.\n   c. Báo chí đổi mới để gần gũi giới trẻ.\n   d. Nhà trường giáo dục kĩ năng số.\n5. Liên hệ tấm gương Hồ Chí Minh làm báo chân thật, vì nhân dân.\nIII. Kết bài: khẳng định; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nChưa bao giờ con người lại ngập tràn trong thông tin như hôm nay: mỗi ngày có hàng triệu tin tức được đăng tải trên internet. Trong bối cảnh ấy, văn hóa đọc báo và kĩ năng tiếp nhận thông tin, nhất là của giới trẻ, trở thành vấn đề cấp thiết. Đọc nhiều mà không biết chọn lọc, không biết kiểm chứng thì thông tin không những không ích lợi mà còn gây hại. Vì vậy, rèn luyện cho mình một văn hóa đọc báo lành mạnh và kĩ năng tiếp nhận thông tin thông minh là yêu cầu không thể thiếu với mỗi người trẻ trong thời đại số.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTÌNH YÊU THIÊN NHIÊN TRONG THƠ HỒ CHÍ MINH\n\nMột trong những nét đẹp trong thơ Hồ Chí Minh là tình yêu thiên nhiên sâu sắc. Dù ở hoàn cảnh nào — trong tù ngục hay giữa chiến khu — Người vẫn dành cho thiên nhiên một tình cảm thiết tha, tinh tế.\n\nTrong Nhật kí trong tù, có nhiều bài thơ viết về trăng, hoa, cảnh đẹp thiên nhiên. Giữa chốn ngục tù tăm tối, nhà thơ vẫn ngắm trăng, vẫn rung động trước vẻ đẹp của hoa. Thiên nhiên trở thành người bạn tâm tình, giúp Người vượt qua những tháng ngày gian khổ. Tình yêu thiên nhiên ở đây gắn liền với khát vọng tự do: ngắm trăng trong tù mà lòng hướng về ánh sáng của tự do.\n\nNhững bài thơ như Mộ (Chiều tối), Nguyên tiêu (Rằm tháng Giêng), Cảnh khuya, Vọng nguyệt (Ngắm trăng) đều cho thấy một tâm hồn thi sĩ nhạy cảm trước vẻ đẹp của tạo hóa. Cảnh chiều tối với cánh chim bay về tổ, với chòm mây trôi nhẹ; đêm rằm tháng Giêng với trăng ngân, khói sóng; đêm khuya với tiếng suối trong như tiếng hát — tất cả đều được cảm nhận bằng một tâm hồn tinh tế, giàu chất thơ.\n\nĐiều đặc biệt là tình yêu thiên nhiên trong thơ Hồ Chí Minh luôn gắn với tình yêu con người, yêu nước. Ngắm cảnh đẹp mà lòng không quên nhiệm vụ cách mạng; yêu thiên nhiên cũng là yêu đất nước, yêu cuộc sống. Đó là nét độc đáo: chất thi sĩ hòa quyện cùng chất chiến sĩ.\n\nTình yêu thiên nhiên trong thơ Bác không chỉ làm giàu thêm vẻ đẹp tâm hồn Người mà còn gửi gắm bài học: dù trong hoàn cảnh nào, con người cũng nên giữ cho mình một tâm hồn biết rung động trước cái đẹp — đó là nguồn sức mạnh tinh thần vô giá.\n\nCâu 1. Tình yêu thiên nhiên trong thơ Hồ Chí Minh được thể hiện qua những hình ảnh nào?", "options": ["A. Nhà cửa, xe cộ", "B. Trăng, hoa, cảnh chiều tối, đêm rằm, tiếng suối — vẻ đẹp thiên nhiên tinh tế", "C. Chiến trường, súng đạn", "D. Thành phố hiện đại"], "answer": "B", "explain": "Văn bản liệt kê: trăng, hoa trong Nhật kí trong tù; cánh chim, chòm mây trong Chiều tối; trăng rằm, khói sóng trong Nguyên tiêu; tiếng suối trong Cảnh khuya — những hình ảnh thiên nhiên đẹp, tinh tế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTÌNH YÊU THIÊN NHIÊN TRONG THƠ HỒ CHÍ MINH\n\nMột trong những nét đẹp trong thơ Hồ Chí Minh là tình yêu thiên nhiên sâu sắc. Dù ở hoàn cảnh nào — trong tù ngục hay giữa chiến khu — Người vẫn dành cho thiên nhiên một tình cảm thiết tha, tinh tế.\n\nTrong Nhật kí trong tù, có nhiều bài thơ viết về trăng, hoa, cảnh đẹp thiên nhiên. Giữa chốn ngục tù tăm tối, nhà thơ vẫn ngắm trăng, vẫn rung động trước vẻ đẹp của hoa. Thiên nhiên trở thành người bạn tâm tình, giúp Người vượt qua những tháng ngày gian khổ. Tình yêu thiên nhiên ở đây gắn liền với khát vọng tự do: ngắm trăng trong tù mà lòng hướng về ánh sáng của tự do.\n\nNhững bài thơ như Mộ (Chiều tối), Nguyên tiêu (Rằm tháng Giêng), Cảnh khuya, Vọng nguyệt (Ngắm trăng) đều cho thấy một tâm hồn thi sĩ nhạy cảm trước vẻ đẹp của tạo hóa. Cảnh chiều tối với cánh chim bay về tổ, với chòm mây trôi nhẹ; đêm rằm tháng Giêng với trăng ngân, khói sóng; đêm khuya với tiếng suối trong như tiếng hát — tất cả đều được cảm nhận bằng một tâm hồn tinh tế, giàu chất thơ.\n\nĐiều đặc biệt là tình yêu thiên nhiên trong thơ Hồ Chí Minh luôn gắn với tình yêu con người, yêu nước. Ngắm cảnh đẹp mà lòng không quên nhiệm vụ cách mạng; yêu thiên nhiên cũng là yêu đất nước, yêu cuộc sống. Đó là nét độc đáo: chất thi sĩ hòa quyện cùng chất chiến sĩ.\n\nTình yêu thiên nhiên trong thơ Bác không chỉ làm giàu thêm vẻ đẹp tâm hồn Người mà còn gửi gắm bài học: dù trong hoàn cảnh nào, con người cũng nên giữ cho mình một tâm hồn biết rung động trước cái đẹp — đó là nguồn sức mạnh tinh thần vô giá.\n\nCâu 2. Trong hoàn cảnh tù đày, thiên nhiên có ý nghĩa gì với nhà thơ?", "options": ["A. Không có ý nghĩa gì", "B. Là người bạn tâm tình, giúp vượt qua gian khổ; gắn với khát vọng tự do", "C. Chỉ để giải trí", "D. Làm nhà thơ thêm buồn"], "answer": "B", "explain": "Giữa ngục tù, thiên nhiên là bạn tâm tình ì?", "options": ["A. Nên đi du lịch nhiều", "B. Dù trong hoàn cảnh nào cũng nên giữ tâm hồn biết rung động trước cái đẹp — đó là nguồn sức mạnh tinh thần", "C. Chỉ cần yêu thiên nhiên là đủ", "D. Thiên nhiên quan trọng hơn con người"], "answer": "B", "explain": "Văn bản khái quát: giữ cho mình tâm hồn biết rung động trước cái đẹp là nguồn sức mạnh tinh thần vô giá — bài học về cách sống đẹp.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTÌNH YÊU THIÊN NHIÊN TRONG THƠ HỒ CHÍ MINH\n\nMột trong những nét đẹp trong thơ Hồ Chí Minh là tình yêu thiên nhiên sâu sắc. Dù ở hoàn cảnh nào — trong tù ngục hay giữa chiến khu — Người vẫn dành cho thiên nhiên một tình cảm thiết tha, tinh tế.\n\nTrong Nhật kí trong tù, có nhiều bài thơ viết về trăng, hoa, cảnh đẹp thiên nhiên. Giữa chốn ngục tù tăm tối, nhà thơ vẫn ngắm trăng, vẫn rung động trước vẻ đẹp của hoa. Thiên nhiên trở thành người bạn tâm tình, giúp Người vượt qua những tháng ngày gian khổ. Tình yêu thiên nhiên ở đây gắn liền với khát vọng tự do: ngắm trăng trong tù mà lòng hướng về ánh sáng của tự do.\n\nNhững bài thơ như Mộ (Chiều tối), Nguyên tiêu (Rằm tháng Giêng), Cảnh khuya, Vọng nguyệt (Ngắm trăng) đều cho thấy một tâm hồn thi sĩ nhạy cảm trước vẻ đẹp của tạo hóa. Cảnh chiều tối với cánh chim bay về tổ, với chòm mây trôi nhẹ; đêm rằm tháng Giêng với trăng ngân, khói sóng; đêm khuya với tiếng suối trong như tiếng hát — tất cả đều được cảm nhận bằng một tâm hồn tinh tế, giàu chất thơ.\n\nĐiều đặc biệt là tình yêu thiên nhiên trong thơ Hồ Chí Minh luôn gắn với tình yêu con người, yêu nước. Ngắm cảnh đẹp mà lòng không quên nhiệm vụ cách mạng; yêu thiên nhiên cũng là yêu đất nước, yêu cuộc sống. Đó là nét độc đáo: chất thi sĩ hòa quyện cùng chất chiến sĩ.\n\nTình yêu thiên nhiên trong thơ Bác không chỉ làm giàu thêm vẻ đẹp tâm hồn Người mà còn gửi gắm bài học: dù trong hoàn cảnh nào, con người cũng nên giữ cho mình một tâm hồn biết rung động trước cái đẹp — đó là nguồn sức mạnh tinh thần vô giá.\n\nCâu 5. Qua văn bản, em cảm nhận được vẻ đẹp tâm hồn nào của Hồ Chí Minh? (Trả lời ngắn gọn)", "answer": "Tâm hồn thi sĩ tinh tế, lạc quan, giàu tình yêu thiên nhiên, đất nước", "explain": "Chấp nhận các cách diễn đạt tương đương: nhạy cảm trước cái đẹp; kiên cường; thống nhất thi sĩ — chiến sĩ...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận văn học khoảng 200 chữ cảm nhận về tình yêu thiên nhiên trong thơ Hồ Chí Minh.", "explain": "DÀN Ý:\n1. Mở đoạn: giới thiệu nét đẹp tình yêu thiên nhiên trong thơ Bác.\n2. Thân đoạn: (a) Biểu hiện: yêu trăng, hoa, cảnh đẹp qua các bài thơ; (b) Trong tù vẫn rung động trước cái đẹp; (c) Gắn với tình yêu nước, khát vọng tự do; (d) Nghệ thuật: hình ảnh tinh tế, giàu chất thơ.\n3. Kết đoạn: khẳng định vẻ đẹp tâm hồn.\n\nBÀI MẪU:\nTình yêu thiên nhiên là một trong những nét đẹp tâm hồn trong thơ Hồ Chí Minh. Dù ở hoàn cảnh nào — trong chốn ngục tù tăm tối hay giữa chiến khu gian khổ — Người vẫn dành cho thiên nhiên một tình cảm thiết tha, tinh tế. Trong Nhật kí trong tù, giữa xiềng xích, nhà thơ vẫn ngắm trăng, vẫn rung động trước vẻ đẹp của đóa hoa; trong Chiều tối, Nguyên tiêu, Cảnh khuya, Vọng nguyệt, thiên nhiên hiện lên với vẻ đẹp vừa cổ điển vừa hiện đại: cánh chim bay về tổ trong chiều tà, trăng rằm vằng vặc trên sông nước, tiếng suối trong như tiếng hát xa. Điều đặc biệt là tình yêu thiên nhiên trong thơ Bác luôn gắn với tình yêu đất nước, với khát vọng tự do: ngắm trăng trong tù mà lòng hướng về ánh sáng; yêu cảnh đẹp cũng là yêu quê hương. Chất thi sĩ tinh tế hòa quyện cùng bản lĩnh chiến sĩ kiên cường tạo nên nét độc đáo trong thơ Hồ Chí Minh. Tình yêu thiên nhiên ấy không chỉ làm giàu tâm hồn Người mà còn gửi gắm bài học cho chúng ta: hãy giữ cho mình một tâm hồn biết rung động trước cái đẹp, bởi đó là nguồn sức mạnh tinh thần vô giá giúp con người vượt qua mọi gian khổ.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích vẻ đẹp tâm hồn Hồ Chí Minh qua tình yêu thiên nhiên trong thơ.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — tình yêu thiên nhiên là cửa sổ tâm hồn Hồ Chí Minh.\nII. Thân bài:\n1. Biểu hiện của tình yêu thiên nhiên:\n   a. Trong Nhật kí trong tù: trăng, hoa giữa ngục tù.\n   b. Trong các bài thơ chữ Hán: Chiều tối, Nguyên tiêu, Cảnh khuya, Vọng nguyệt.\n2. Đặc điểm:\n   a. Tinh tế, nhạy cảm trước vẻ đẹp.\n   b. Lạc quan: tìm thấy ánh sáng trong bóng tối.\n   c. Gắn với tình yêu nước, khát vọng tự do.\n3. Ý nghĩa:\n   a. Thể hiện tâm hồn thi sĩ lớn.\n   b. Thống nhất thi sĩ — chiến sĩ.\n   c. Nguồn sức mạnh tinh thần.\n4. Nghệ thuật: hình ảnh thơ giàu sức gợi; sự kết hợp cổ điển — hiện đại.\nIII. Kết bài: khẳng định; bài học.\n\nĐOẠN MẪU (mở bài):\nThơ ca là tấm gương phản chiếu tâm hồn nhà thơ, và qua tình yêu thiên nhiên trong thơ Hồ Chí Minh, ta thấy hiện lên một tâm hồn đẹp đến kì lạ: vừa tinh tế, nhạy cảm của thi sĩ vừa kiên cường, lạc quan của chiến sĩ. Từ những vần thơ viết trong ngục tù đến những bài thơ trăng rằm nơi chiến khu, thiên nhiên luôn là người bạn tâm tình, là nguồn cảm hứng bất tận của Người. Tìm hiểu tình yêu thiên nhiên trong thơ Bác là tìm hiểu một trong những nét đẹp nhất trong tâm hồn vĩ đại Hồ Chí Minh.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỌC TẬP VÀ LÀM THEO TƯ TƯỞNG, ĐẠO ĐỨC HỒ CHÍ MINH\n\nHọc tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh là nhiệm vụ quan trọng, thường xuyên của toàn Đảng, toàn dân, nhất là thế hệ trẻ. Đây không phải là khẩu hiệu suông mà phải thể hiện bằng những việc làm cụ thể mỗi ngày.\n\nTrước hết, học tập Bác là học tập tư tưởng yêu nước, thương dân của Người. Mỗi người, nhất là tuổi trẻ, cần nuôi dưỡng lòng yêu nước, có trách nhiệm với đất nước, sẵn sàng cống hiến sức mình cho sự nghiệp xây dựng và bảo vệ Tổ quốc.\n\nHọc tập Bác còn là học tập đạo đức cần, kiệm, liêm, chính, chí công vô tư. Trong cuộc sống, điều đó thể hiện qua việc sống trung thực, không tham lam, không vụ lợi; tiết kiệm, chống lãng phí; công bằng, khách quan trong công việc. Với học sinh, đó là trung thực trong thi cử, tiết kiệm trong sinh hoạt, giúp đỡ bạn bè.\n\nHọc tập phong cách của Bác là học tập lối sống giản dị, gần gũi với nhân dân; tác phong làm việc khoa học, nói đi đôi với làm; tinh thần học tập suốt đời. Bác Hồ là tấm gương sáng về tự học: biết nhiều ngoại ngữ, am hiểu nhiều lĩnh vực nhờ tinh thần học tập không ngừng.\n\nTuy nhiên, cần tránh bệnh hình thức trong học tập và làm theo Bác: học thuộc lòng những lời dạy mà không thực hiện, làm theo phong trào qua loa. Học Bác phải từ trái tim, bằng hành động cụ thể, thiết thực.\n\nMỗi chúng ta hãy bắt đầu từ những việc nhỏ nhất: chăm chỉ học tập, sống trung thực, tiết kiệm, giúp đỡ mọi người, yêu quê hương đất nước. Khi mỗi người đều làm theo Bác bằng việc làm cụ thể, xã hội sẽ tốt đẹp hơn và đất nước sẽ phát triển bền vững.\n\nCâu 1. Học tập và làm theo Bác là nhiệm vụ của ai?", "options": ["A. Chỉ của đảng viên", "B. Của toàn Đảng, toàn dân, nhất là thế hệ trẻ", "C. Chỉ của học sinh", "D. Chỉ của cán bộ"], "answer": "B", "explain": "Văn bản khẳng định: đây là nhiệm vụ quan trọng, thường xuyên của toàn Đảng, toàn dân, nhất là thế hệ trẻ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỌC TẬP VÀ LÀM THEO TƯ TƯỞNG, ĐẠO ĐỨC HỒ CHÍ MINH\n\nHọc tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh là nhiệm vụ quan trọng, thường xuyên của toàn Đảng, toàn dân, nhất là thế hệ trẻ. Đây không phải là khẩu hiệu suông mà phải thể hiện bằng những việc làm cụ thể mỗi ngày.\n\nTrước hết, học tập Bác là học tập tư tưởng yêu nước, thương dân của Người. Mỗi người, nhất là tuổi trẻ, cần nuôi dưỡng lòng yêu nước, có trách nhiệm với đất nước, sẵn sàng cống hiến sức mình cho sự nghiệp xây dựng và bảo vệ Tổ quốc.\n\nHọc tập Bác còn là học tập đạo đức cần, kiệm, liêm, chính, chí công vô tư. Trong cuộc sống, điều đó thể hiện qua việc sống trung thực, không tham lam, không vụ lợi; tiết kiệm, chống lãng phí; công bằng, khách quan trong công việc. Với học sinh, đó là trung thực trong thi cử, tiết kiệm trong sinh hoạt, giúp đỡ bạn bè.\n\nHọc tập phong cách của Bác là học tập lối sống giản dị, gần gũi với nhân dân; tác phong làm việc khoa học, nói đi đôi với làm; tinh thần học tập suốt đời. Bác Hồ là tấm gương sáng về tự học: biết nhiều ngoại ngữ, am hiểu nhiều lĩnh vực nhờ tinh thần học tập không ngừng.\n\nTuy nhiên, cần tránh bệnh hình thức trong học tập và làm theo Bác: học thuộc lòng những lời dạy mà không thực hiện, làm theo phong trào qua loa. Học Bác phải từ trái tim, bằng hành động cụ thể, thiết thực.\n\nMỗi chúng ta hãy bắt đầu từ những việc nhỏ nhất: chăm chỉ học tập, sống trung thực, tiết kiệm, giúp đỡ mọi người, yêu quê hương đất nước. Khi mỗi người đều làm theo Bác bằng việc làm cụ thể, xã hội sẽ tốt đẹp hơn và đất nước sẽ phát triển bền vững.\n\nCâu 2. Nội dung cần học tập theo Bác gồm những gì?", "options": ["A. Chỉ học tư tưởng", "B. Tư tưởng, đạo đức, phong cách Hồ Chí Minh", "C. Chỉ học phong cách", "D. Chỉ học đạo đức"], "answer": "B", "explain": "Học tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh — toàn diện cả ba mặt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHỌC TẬP VÀ LÀM THEO TƯ TƯỞNG, ĐẠO ĐỨC HỒ CHÍ MINH\n\nHọc tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh là nhiệm vụ quan trọng, thường xuyên của toàn Đảng, toàn dân, nhất là thế hệ trẻ. Đây không phải là khẩu hiệu suông mà phải thể hiện bằng những việc làm cụ thể mỗi ngày.\n\nTrước hết, học tập Bác là học tập tư tưởng yêu nước, thương dân của Người. Mỗi người, nhất là tuổi trẻ, cần nuôi dưỡng lòng yêu nước, có trách nhiệm với đất nước, sẵn sàng cống hiến sứ i đắp lí tưởng, đạo đức; có tấm gương để noi theo như phong cách giản dị, tinh thần học tập suốt đời của Bác; (b) Thể hiện bằng việc cụ thể: chăm học, trung thực, tiết kiệm, giúp người; (c) Phê phán bệnh hình thức, nói không đi đôi với làm.\n3. Kết đoạn: hãy bắt đầu từ việc nhỏ.\n\nBÀI MẪU:\nHọc tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh có ý nghĩa vô cùng to lớn đối với tuổi trẻ hôm nay. Giữa bao cám dỗ của cuộc sống hiện đại, tấm gương của Bác — với lòng yêu nước nồng nàn, đạo đức cần kiệm liêm chính, phong cách sống giản dị và tinh thần học tập suốt đời — là ngọn đuốc soi đường giúp người trẻ không lạc hướng. Học tập Bác giúp tuổi trẻ bồi đắp lí tưởng sống cao đẹp, rèn luyện đạo đức trong sáng và hình thành phong cách làm việc khoa học. Điều quan trọng là học Bác phải bằng những việc làm cụ thể mỗi ngày chứ không phải khẩu hiệu suông: chăm chỉ học tập, trung thực trong thi cử, tiết kiệm trong sinh hoạt, giúp đỡ bạn bè, yêu quê hương đất nước. Đáng phê phán là bệnh hình thức: thuộc lòng lời Bác dạy mà không thực hiện, làm theo phong trào qua loa cho có. Mỗi việc tốt nhỏ ta làm theo Bác hôm nay đều góp phần làm cho bản thân tốt hơn và xã hội đẹp hơn. Hãy bắt đầu từ những việc nhỏ nhất ngay từ hôm nay — để xứng đáng là thế hệ tiếp bước cha anh, là chủ nhân tương lai của đất nước mà Bác hằng mong mỏi.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về lí tưởng sống của tuổi trẻ hôm nay trong ánh sáng tư tưởng Hồ Chí Minh.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — lí tưởng sống của tuổi trẻ và ánh sáng tư tưởng Hồ Chí Minh.\nII. Thân bài:\n1. Lí tưởng sống theo tư tưởng Hồ Chí Minh: yêu nước, thương dân; sống có ích cho xã hội; không ngừng học tập, rèn luyện.\n2. Biểu hiện của tuổi trẻ có lí tưởng:\n   a. Chăm chỉ học tập, rèn đạo đức.\n   b. Tích cực tham gia các phong trào tình nguyện, xây dựng quê hương.\n   c. Sống trung thực, giản dị, tiết kiệm.\n   d. Sẵn sàng bảo vệ Tổ quốc.\n3. Phê phán: một bộ phận giới trẻ sống không lí tưởng, thực dụng, ích kỉ, sa vào tệ nạn.\n4. Cách nuôi dưỡng lí tưởng: học tập tấm gương Bác; xác định mục tiêu; hành động cụ thể mỗi ngày.\nIII. Kết bài: khẳng định; nhắn nhủ tuổi trẻ hãy sống xứng đáng.\n\nĐOẠN MẪU (mở bài):\nLí tưởng sống là ngọn đèn soi đường cho mỗi con người, nhất là tuổi trẻ. Trong hành trình tìm kiếm lí tưởng, tư tưởng Hồ Chí Minh mãi là ánh sáng dẫn đường với những giá trị trường tồn: lòng yêu nước nồng nàn, đạo đức trong sáng, phong cách sống giản dị và tinh thần học tập không ngừng. Soi mình trong ánh sáng ấy, tuổi trẻ hôm nay càng thấy rõ trách nhiệm và hướng đi của mình trong sự nghiệp xây dựng đất nước.", "points": 0}]}]}
