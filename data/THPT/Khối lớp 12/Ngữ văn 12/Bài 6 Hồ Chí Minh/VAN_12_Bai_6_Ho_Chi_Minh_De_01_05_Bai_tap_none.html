 của Lê-nin (7-1920), tìm thấy con đường cách mạng vô sản", "C. Làm phụ bếp trên tàu", "D. Tham gia phong trào công nhân"], "answer": "B", "explain": "Tháng 7-1920, khi đọc Sơ thảo luận cương của Lê-nin, Nguyễn Ái Quốc đã tìm thấy con đường cứu nước đúng đắn — đây là bước ngoặt quyết định của hành trình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHÀNH TRÌNH TÌM ĐƯỜNG CỨU NƯỚC CỦA NGUYỄN ÁI QUỐC\n\nNgày 5-6-1911, từ bến cảng Nhà Rồng (Sài Gòn), người thanh niên Nguyễn Tất Thành — sau này là Nguyễn Ái Quốc, Hồ Chí Minh — xuống tàu Amiran Latusơ Tơrêvin, bắt đầu hành trình tìm đường cứu nước. Khác với các bậc tiền bối, Người không đi sang phương Đông mà sang phương Tây, đến tận nước Pháp để tìm hiểu kẻ thù và tìm con đường giải phóng dân tộc.\n\nTrong gần mười năm bôn ba qua nhiều châu lục, Nguyễn Ái Quốc làm đủ nghề để sinh sống: phụ bếp trên tàu, cào tuyết, đốt lò, chụp ảnh, vẽ đồ gốm... Vừa lao động kiếm sống, Người vừa học tập, nghiên cứu, tham gia phong trào công nhân và các tổ chức cách mạng. Chính cuộc sống lăn lộn trong quần chúng lao động đã giúp Người hiểu sâu sắc nỗi khổ của người dân mất nước và bản chất của chủ nghĩa thực dân.\n\nBước ngoặt đến vào tháng 7-1920, khi Nguyễn Ái Quốc đọc được bản Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa của V.I. Lê-nin. Người đã tìm thấy con đường cứu nước đúng đắn: con đường cách mạng vô sản. Từ đó, Người đi theo chủ nghĩa Mác – Lê-nin, tham gia sáng lập Đảng Cộng sản Pháp (1920) và tích cực chuẩn bị cho sự ra đời của Đảng Cộng sản Việt Nam.\n\nHành trình tìm đường cứu nước của Nguyễn Ái Quốc thể hiện tầm nhìn xa trông rộng, ý chí kiên cường và tinh thần độc lập, sáng tạo. Người không dập khuôn theo lối mòn mà dám đi con đường mới, dám đến tận sào huyệt của kẻ thù để tìm hiểu và tìm ra chân lí. Đó là bài học quý giá về lòng yêu nước gắn với trí tuệ và bản lĩnh.\n\nCâu 4. Qua hành trình tìm đường cứu nước, phẩm chất nổi bật nào của Nguyễn Ái Quốc được thể hiện?", "options": ["A. Giàu có, quyền quý", "B. Tầm nhìn xa, ý chí kiên cường, tinh thần độc lập sáng tạo, dám đi con đường mới", "C. Thích phiêu lưu", "D. Ngại khó khăn"], "answer": "B", "explain": "Mười năm bôn ba, làm đủ nghề, dám đến tận sào huyệt kẻ thù để tìm chân lí — thể hiện tầm nhìn, ý chí và bản lĩnh phi thường của người thanh niên yêu nước.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nHÀNH TRÌNH TÌM ĐƯỜNG CỨU NƯỚC CỦA NGUYỄN ÁI QUỐC\n\nNgày 5-6-1911, từ bến cảng Nhà Rồng (Sài Gòn), người thanh niên Nguyễn Tất Thành — sau này là Nguyễn Ái Quốc, Hồ Chí Minh — xuống tàu Amiran Latusơ Tơrêvin, bắt đầu hành trình tìm đường cứu nước. Khác với các bậc tiền bối, Người không đi sang phương Đông mà sang phương Tây, đến tận nước Pháp để tìm hiểu kẻ thù và tìm con đường giải phóng dân tộc.\n\nTrong gần mười năm bôn ba qua nhiều châu lục, Nguyễn Ái Quốc làm đủ nghề để sinh sống: phụ bếp trên tàu, cào tuyết, đốt lò, chụp ảnh, vẽ đồ gốm... Vừa lao động kiếm sống, Người vừa học tập, nghiên cứu, tham gia phong trào công nhân và các tổ chức cách mạng. Chính cuộc sống lăn lộn trong quần chúng lao động đã giúp Người hiểu sâu sắc nỗi khổ của người dân mất nước và bản chất của chủ nghĩa thực dân.\n\nBước ngoặt đến vào tháng 7-1920, khi Nguyễn Ái Quốc đọc được bản Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa của V.I. Lê-nin. Người đã tìm thấy con đường cứu nước đúng đắn: con đường cách mạng vô sản. Từ đó, Người đi theo chủ nghĩa Mác – Lê-nin, tham gia sáng lập Đảng Cộng sản Pháp (1920) và tích cực chuẩn bị cho sự ra đời của Đảng Cộng sản Việt Nam.\n\nHành trình tìm đường cứu nước của Nguyễn Ái Quốc thể hiện tầm nhìn xa trông rộng, ý chí kiên cường và tinh thần độc lập, sáng tạo. Người không dập khuôn theo lối mòn mà dám đi con đường mới, dám đến tận sào huyệt của kẻ thù để tìm hiểu và tìm ra chân lí. Đó là bài học quý giá về lòng yêu nước gắn với trí tuệ và bản lĩnh.\n\nCâu 5. Qua văn bản, em rút ra bài học gì cho tuổi trẻ hôm nay? (Trả lời ngắn gọn)", "answer": "Có lí tưởng, dám đi con đường mới, kiên trì học hỏi và rèn luyện", "explain": "Chấp nhận các cách diễn đạt tương đương: lòng yêu nước phải gắn với trí tuệ; dám độc lập, sáng tạo; kiên cường vượt khó để thực hiện lí tưởng...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của lí tưởng sống đối với tuổi trẻ.", "explain": "DÀN Ý:\n1. Mở đoạn: lí tưởng là ngọn đèn soi đường cho tuổi trẻ.\n2. Thân đoạn: (a) Vai trò: cho mục tiêu, động lực, giúp vượt khó khăn như Nguyễn Ái Quốc với lí tưởng cứu nước; (b) Tuổi trẻ có lí tưởng sẽ sống có ích, không lãng phí tuổi xuân; (c) Phê phán lối sống không lí tưởng, thực dụng, ích kỉ.\n3. Kết đoạn: hãy nuôi dưỡng lí tưởng cao đẹp.\n\nBÀI MẪU:\nLí tưởng sống là ngọn đèn soi đường, là nguồn sức mạnh tinh thần to lớn đối với tuổi trẻ. Người trẻ có lí tưởng sẽ biết mình sống vì điều gì, phấn đấu vì mục tiêu nào — như Nguyễn Ái Quốc với lí tưởng giải phóng dân tộc đã vượt qua muôn vàn gian khổ trong hành trình tìm đường cứu nước, từ bến Nhà Rồng đến tận nước Pháp xa xôi. Lí tưởng giúp con người đứng vững trước khó khăn, không gục ngã trước thất bại, và biến những việc làm bình thường thành những đóng góp phi thường. Tuổi trẻ có lí tưởng sẽ sống có trách nhiệm với bản thân, gia đình và đất nước; ngược lại, những người trẻ sống không lí tưởng dễ rơi vào lối sống thực dụng, ích kỉ, hưởng thụ, lãng phí tuổi xuân vào những điều vô bổ. Trong thời đại hôm nay, lí tưởng của tuổi trẻ có thể là học tập tốt để xây dựng đất nước, là cống hiến cho cộng đồng, là vươn tới những đỉnh cao tri thức. Dù lí tưởng ấy là gì, điều quan trọng là nó phải cao đẹp và được nuôi dưỡng bằng hành động cụ thể mỗi ngày. Hãy để lí tưởng soi sáng con đường ta đi, như ngọn đèn đã soi sáng hành trình của Nguyễn Ái Quốc năm xưa.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ trình bày suy nghĩ về quan điểm sáng tác Văn hóa phải soi đường cho quốc dân đi của Hồ Chí Minh.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu quan điểm nổi tiếng và ý nghĩa của nó.\nII. Thân bài:\n1. Giải thích: văn hóa, văn nghệ phải đi trước, dẫn đường cho dân tộc; nhà văn là chiến sĩ trên mặt trận văn hóa.\n2. Chứng minh:\n   a. Trong sáng tác của Hồ Chí Minh: mỗi tác phẩm đều phục vụ nhiệm vụ cách mạng (Tuyên ngôn Độc lập, thơ, truyện trào phúng).\n   b. Ảnh hưởng đến văn nghệ cách mạng Việt Nam: định hướng cho nhiều thế hệ văn nghệ sĩ.\n3. Ý nghĩa trong thời đại hôm nay:\n   a. Văn hóa vẫn giữ vai trò dẫn đường trong xây dựng con người mới.\n   b. Đấu tranh với các biểu hiện văn hóa độc hại, lai căng.\n4. Liên hệ trách nhiệm của tuổi trẻ: tiếp nhận văn hóa lành mạnh, góp phần xây dựng nền văn hóa tiên tiến.\nIII. Kết bài: khẳng định giá trị trường tồn của quan điểm.\n\nĐOẠN MẪU (mở bài):\nTrong hệ thống tư tưởng Hồ Chí Minh, quan điểm về văn hóa giữ một vị trí đặc biệt quan trọng, được kết tinh trong câu nói nổi tiếng: Văn hóa phải soi đường cho quốc dân đi. Quan điểm này không chỉ định hướng cho toàn bộ sáng tác của Người mà còn trở thành kim chỉ nam cho nền văn nghệ cách mạng Việt Nam. Tìm hiểu sâu sắc quan điểm ấy giúp chúng ta hiểu hơn về tầm nhìn của Hồ Chí Minh và trách nhiệm của thế hệ hôm nay trong việc xây dựng nền văn hóa tiên tiến, đậm đà bản sắc dân tộc.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHONG CÁCH SỐNG GIẢN DỊ CỦA HỒ CHÍ MINH\n\nHồ Chí Minh — vị lãnh tụ vĩ đại của dân tộc — lại có một phong cách sống vô cùng giản dị, gần gũi, để lại ấn tượng sâu đậm trong lòng nhân dân Việt Nam và bạn bè quốc tế.\n\nNơi ở của Người sau ngày độc lập chỉ là ngôi nhà sàn nhỏ bé bằng gỗ giữa vườn cây ở Hà Nội, với vài vật dụng đơn sơ: chiếc giường, tủ quần áo, bàn làm việc. Bữa ăn của Người cũng đạm bạc: cơm, rau, cá — những món ăn bình dị của người dân Việt Nam. Người thường nói: Bác sống như mọi người dân bình thường thôi.\n\nTrang phục của Người cũng giản dị: bộ quần áo ka ki đã sờn, đôi dép lốp cao su đã thành huyền thoại. Trong những chuyến công tác, Người không ngại lội ruộng, tát nước cùng nông dân; không ngại ngồi bệt xuống đất trò chuyện với các cụ già, các cháu nhỏ.\n\nSự giản dị của Hồ Chí Minh không phải là sự thiếu thốn mà là một phong cách sống có ý thức, xuất phát từ triết lí: cán bộ là đầy tớ của nhân dân, phải sống gần dân, hiểu dân. Người từng phê phán thói quan liêu, xa hoa, lãng phí; Người dạy cán bộ phải cần, kiệm, liêm, chính.\n\nPhong cách giản dị ấy còn thể hiện trong cách nói, cách viết của Người: ngôn ngữ trong sáng, dễ hiểu, gần gũi với quần chúng. Những bài nói, bài viết của Người ai đọc cũng hiểu, ai nghe cũng thấm.\n\nNgày nay, phong cách sống giản dị của Hồ Chí Minh trở thành tấm gương sáng cho mọi thế hệ noi theo. Trong xã hội hiện đại với nhiều cám dỗ vật chất, lối sống giản dị, tiết kiệm, gần gũi với nhân dân của Người càng có ý nghĩa giáo dục sâu sắc.\n\nCâu 1. Nơi ở của Hồ Chí Minh sau ngày độc lập được miêu tả như thế nào?", "options": ["A. Dinh thự nguy nga", "B. Ngôi nhà sàn nhỏ bé bằng gỗ với vài vật dụng đơn sơ", "C. Biệt thự sang trọng", "D. Khách sạn cao cấp"], "answer": "B", "explain": "Văn bản miêu tả: ngôi nhà sàn nhỏ bé bằng gỗ giữa vườn cây, với chiếc giường, tủ quần áo, bàn làm việc đơn sơ — phong cách sống giản dị của vị lãnh tụ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHONG CÁCH SỐNG GIẢN DỊ CỦA HỒ CHÍ MINH\n\nHồ Chí Minh — vị lãnh tụ vĩ đại của dân tộc — lại có một phong cách sống vô cùng giản dị, gần gũi, để lại ấn tượng sâu đậm trong lòng nhân dân Việt Nam và bạn bè quốc tế.\n\nNơi ở của Người sau ngày độc lập chỉ là ngôi nhà sàn nhỏ bé bằng gỗ giữa vườn cây ở Hà Nội, với vài vật dụng đơn sơ: chiếc giường, tủ quần áo, bàn làm việc. Bữa ăn của Người cũng đạm bạc: cơm, rau, cá — những món ăn bình dị của người dân Việt Nam. Người thường nói: Bác sống như mọi người dân bình thường thôi.\n\nTrang phục của Người cũng giản dị: bộ quần áo ka ki đã sờn, đôi dép lốp cao su đã thành huyền thoại. Trong những chuyến công tác, Người không ngại lội ruộng, tát nước cùng nông dân; không ngại ngồi bệt xuống đất trò chuyện với các cụ già, các cháu nhỏ.\n\nSự giản dị của Hồ Chí Minh không phải là sự thiếu thốn mà là một phong cách sống có ý thức, xuất phát từ triết lí: cán bộ là đầy tớ của nhân dân, phải sống gần dân, hiểu dân. Người từng phê phán thói quan liêu, xa hoa, lãng phí; Người dạy cán bộ phải cần, kiệm, liêm, chính.\n\nPhong cách giản dị ấy còn thể hiện trong cách nói, cách viết của Người: ngôn ngữ trong sáng, dễ hiểu, gần gũi với quần chúng. Những bài nói, bài viết của Người ai đọc cũng hiểu, ai nghe cũng thấm.\n\nNgày nay, phong cách sống giản dị của Hồ Chí Minh trở thành tấm gương sáng cho mọi thế hệ noi theo. Trong xã hội hiện đại với nhiều cám dỗ vật chất, lối sống giản dị, tiết kiệm, gần gũi với nhân dân của Người càng có ý nghĩa giáo dục sâu sắc.\n\nCâu 2. Đôi dép nổi tiếng gắn với Hồ Chí Minh được làm bằng chất liệu gì?", "options": ["A. Da cá sấu", "B. Lốp cao su", "C. Vải bố", "D. Nhựa cao cấp"], "answer": "B", "explain": "Đôi dép lốp cao su của Bác đã thành huyền thoại — biểu tượng của phong cách sống giản dị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHONG CÁCH SỐNG GIẢN DỊ CỦA HỒ CHÍ MINH\n\nHồ Chí Minh — vị lãnh tụ vĩ đại của dân tộc — lại có một phong cách sống vô cùng giản dị, gần gũi, để lại ấn tượng sâu đậm trong lòng nhân dân Việt Nam và bạn bè quốc tế.\n\nNơi ở của Người sau ngày độc lập chỉ là ngôi nhà sàn nhỏ bé bằng gỗ giữa vườn cây ở Hà Nội, với vài vật dụng đơn sơ: chiếc giường, tủ quần áo, bàn làm việc. Bữa ăn của Người cũng đạm bạc: c c lập chỉ là ngôi nhà sàn nhỏ bé bằng gỗ giữa vườn cây ở Hà Nội, với vài vật dụng đơn sơ: chiếc giường, tủ quần áo, bàn làm việc. Bữa ăn của Người cũng đạm bạc: cơm, rau, cá — những món ăn bình dị của người dân Việt Nam. Người thường nói: Bác sống như mọi người dân bình thường thôi.\n\nTrang phục của Người cũng giản dị: bộ quần áo ka ki đã sờn, đôi dép lốp cao su đã thành huyền thoại. Trong những chuyến công tác, Người không ngại lội ruộng, tát nước cùng nông dân; không ngại ngồi bệt xuống đất trò chuyện với các cụ già, các cháu nhỏ.\n\nSự giản dị của Hồ Chí Minh không phải là sự thiếu thốn mà là một phong cách sống có ý thức, xuất phát từ triết lí: cán bộ là đầy tớ của nhân dân, phải sống gần dân, hiểu dân. Người từng phê phán thói quan liêu, xa hoa, lãng phí; Người dạy cán bộ phải cần, kiệm, liêm, chính.\n\nPhong cách giản dị ấy còn thể hiện trong cách nói, cách viết của Người: ngôn ngữ trong sáng, dễ hiểu, gần gũi với quần chúng. Những bài nói, bài viết của Người ai đọc cũng hiểu, ai nghe cũng thấm.\n\nNgày nay, phong cách sống giản dị của Hồ Chí Minh trở thành tấm gương sáng cho mọi thế hệ noi theo. Trong xã hội hiện đại với nhiều cám dỗ vật chất, lối sống giản dị, tiết kiệm, gần gũi với nhân dân của Người càng có ý nghĩa giáo dục sâu sắc.\n\nCâu 5. Qua văn bản, em rút ra bài học gì về lối sống? (Trả lời ngắn gọn)", "answer": "Sống giản dị, tiết kiệm, gần gũi với mọi người", "explain": "Chấp nhận các cách diễn đạt tương đương: không xa hoa, lãng phí; cần kiệm liêm chính; sống giản dị mà cao đẹp...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của lối sống giản dị.", "explain": "DÀN Ý:\n1. Mở đoạn: giản dị là nét đẹp trong phong cách sống.\n2. Thân đoạn: (a) Ý nghĩa: tiết kiệm, gần gũi mọi người, tâm hồn thanh thản như phong cách của Bác Hồ; (b) Giản dị không phải là xuề xòa, thiếu văn minh; (c) Phê phán thói xa hoa, lãng phí, sĩ diện hão.\n3. Kết đoạn: hãy sống giản dị.\n\nBÀI MẪU:\nSống giản dị là một nét đẹp trong phong cách sống, có ý nghĩa to lớn với mỗi con người. Giản dị không có nghĩa là xuề xòa, thiếu văn minh mà là sống phù hợp, không xa hoa lãng phí, không chạy theo hình thức — như phong cách sống của Hồ Chí Minh: nhà sàn đơn sơ, bữa cơm đạm bạc, đôi dép lốp cao su mà vẫn toát lên sự vĩ đại. Lối sống giản dị giúp ta tiết kiệm tiền của, thời gian; giúp ta gần gũi với mọi người, được mọi người yêu mến; và quan trọng nhất là giữ cho tâm hồn luôn thanh thản, không bị vật chất chi phối. Trong xã hội hiện đại với nhiều cám dỗ, không ít người, nhất là một bộ phận giới trẻ, chạy theo lối sống xa hoa, đua đòi hàng hiệu, sĩ diện hão vượt quá khả năng của gia đình — đó là điều đáng phê phán. Giản dị còn gắn với đức tính khiêm tốn: người thực sự có tài, có đức thường sống rất giản dị. Mỗi chúng ta hãy học tập phong cách sống của Bác: giản dị trong sinh hoạt, trong sáng trong lời nói, gần gũi với mọi người — để cuộc sống thêm ý nghĩa và tâm hồn thêm thanh thản.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về việc học tập phong cách sống giản dị của Hồ Chí Minh.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu phong cách sống giản dị của Bác và ý nghĩa noi theo.\nII. Thân bài:\n1. Biểu hiện của phong cách giản dị: nơi ở, ăn mặc, sinh hoạt, cách nói cách viết.\n2. Cội nguồn: triết lí cán bộ là đầy tớ nhân dân; đạo đức cần kiệm liêm chính.\n3. Ý nghĩa:\n   a. Với bản thân: tiết kiệm, thanh thản, gần gũi mọi người.\n   b. Với xã hội: tấm gương cho cán bộ, cho thế hệ trẻ; chống xa hoa, lãng phí.\n4. Thực trạng: một bộ phận cán bộ, giới trẻ còn xa hoa, lãng phí, sĩ diện — phê phán.\n5. Cách học tập: từ việc nhỏ (tiết kiệm, giản dị trong sinh hoạt); gần gũi, quan tâm mọi người; nói đi đôi với làm.\nIII. Kết bài: khẳng định giá trị tấm gương; quyết tâm noi theo.\n\nĐOẠN MẪU (mở bài):\nHồ Chí Minh vĩ đại không chỉ ở sự nghiệp cách mạng mà còn ở phong cách sống vô cùng giản dị, gần gũi — ngôi nhà sàn đơn sơ, bữa cơm đạm bạc, đôi dép lốp cao su đã trở thành huyền thoại. Trong xã hội hiện đại với bao cám dỗ vật chất, phong cách sống giản dị của Người càng tỏa sáng như một tấm gương để mọi thế hệ, nhất là tuổi trẻ, noi theo. Học tập phong cách sống của Bác không phải là điều gì xa vời mà bắt đầu từ những việc làm cụ thể mỗi ngày.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTUYÊN NGÔN ĐỘC LẬP — ÁNG VĂN CHÍNH LUẬN MẪU MỰC\n\nNgày 2-9-1945, tại Quảng trường Ba Đình (Hà Nội), Chủ tịch Hồ Chí Minh đọc bản Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa. Đây không chỉ là văn kiện lịch sử trọng đại mà còn là áng văn chính luận mẫu mực của dân tộc.\n\nVề bố cục, tác phẩm có kết cấu chặt chẽ gồm ba phần: mở đầu nêu cơ sở pháp lí (trích dẫn Tuyên ngôn Độc lập của Mỹ năm 1776 và Tuyên ngôn Nhân quyền và Dân quyền của Pháp năm 1791 về quyền con người); tiếp theo tố cáo tội ác của thực dân Pháp và khẳng định thực tế lịch sử (nhân dân Việt Nam đã giành được độc lập); cuối cùng tuyên bố độc lập và quyết tâm bảo vệ nền độc lập ấy.\n\nVề lập luận, tác phẩm sử dụng nghệ thuật gậy ông đập lưng ông đầy tài tình: lấy chính những lời lẽ tốt đẹp của kẻ thù để vạch trần tội ác của chúng. Khi thực dân Pháp nói về quyền bình đẳng, bác ái mà lại áp bức, bóc lột nhân dân Việt Nam, sự giả dối của chúng bị phơi bày một cách đanh thép.\n\nVề ngôn ngữ, Tuyên ngôn Độc lập có giọng điệu hùng hồn, đanh thép khi tố cáo kẻ thù; trang trọng, thiêng liêng khi tuyên bố độc lập. Các biện pháp tu từ như điệp ngữ, liệt kê được sử dụng hiệu quả, tăng tính khẳng định cho từng luận điểm. Câu văn ngắn gọn, súc tích mà giàu sức thuyết phục.\n\nVới những giá trị ấy, Tuyên ngôn Độc lập xứng đáng là áng văn chính luận mẫu mực: vừa là văn kiện lịch sử, vừa là tác phẩm nghệ thuật; vừa thể hiện trí tuệ sắc sảo vừa thể hiện tâm hồn lớn của Hồ Chí Minh.\n\nCâu 1. Tuyên ngôn Độc lập được đọc vào thời gian, địa điểm nào?", "options": ["A. Ngày 2-9-1945, tại Quảng trường Ba Đình (Hà Nội)", "B. Ngày 19-5-1890, tại Nghệ An", "C. Ngày 3-2-1930, tại Hương Cảng", "D. Ngày 2-9-1969, tại Hà Nội"], "answer": "A", "explain": "Văn bản cho biết rõ: ngày 2-9-1945, tại Quảng trường Ba Đình (Hà Nội), Chủ tịch Hồ Chí Minh đọc bản Tuyên ngôn Độc lập.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTUYÊN NGÔN ĐỘC LẬP — ÁNG VĂN CHÍNH LUẬN MẪU MỰC\n\nNgày 2-9-1945, tại Quảng trường Ba Đình (Hà Nội), Chủ tịch Hồ Chí Minh đọc bản Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa. Đây không chỉ là văn kiện lịch sử trọng đại mà còn là áng văn chính luận mẫu mực của dân tộc.\n\nVề bố cục, tác phẩm có kết cấu chặt chẽ gồm ba phần: mở đầu nêu cơ sở pháp lí (trích dẫn Tuyên ngôn Độc lập của Mỹ năm 1776 và Tuyên ngôn Nhân quyền và Dân quyền của Pháp năm 1791 về quyền con người); tiếp theo tố cáo tội ác của thực dân Pháp và khẳng định thực tế lịch sử (nhân dân Việt Nam đã giành được độc lập); cuối cùng tuyên bố độc lập và quyết tâm bảo vệ nền độc lập ấy.\n\nVề lập luận, tác phẩm sử dụng nghệ thuật gậy ông đập lưng ông đầy tài tình: lấy chính những lời lẽ tốt đẹp của kẻ thù để vạch trần tội ác của chúng. Khi thực dân Pháp nói về quyền bình đẳng, bác ái mà lại áp bức, bóc lột nhân dân Việt Nam, sự giả dối của chúng bị phơi bày một cách đanh thép.\n\nVề ngôn ngữ, Tuyên ngôn Độc lập có giọng điệu hùng hồn, đanh thép khi tố cáo kẻ thù; trang trọng, thiêng liêng khi tuyên bố độc lập. Các biện pháp tu từ như điệp ngữ, liệt kê được sử dụng hiệu quả, tăng tính khẳng định cho từng luận điểm. Câu văn ngắn gọn, súc tích mà giàu sức thuyết phục.\n\nVới những giá trị ấy, Tuyên ngôn Độc lập xứng đáng là áng văn chính luận mẫu mực: vừa là văn kiện lịch sử, vừa là tác phẩm nghệ thuật; vừa thể hiện trí tuệ sắc sảo vừa thể hiện tâm hồn lớn của Hồ Chí Minh.\n\nCâu 2. Bố cục của Tuyên ngôn Độc lập gồm mấy phần?", "options": ["A. Hai phần", "B. Ba phần: cơ sở pháp lí — tố cáo tội ác và khẳng định thực tế — tuyên bố độc lập", "C. Bốn phần", "D. Một phần"], "answer": "B", "explain": "Bố cục chặt chẽ ba phần: nêu cơ sở pháp lí, tố cáo tội ác của thực dân Pháp và khẳng định nhân dân ta đã giành độc lập, cuối cùng tuyên bố độc lập và quyết tâm bảo vệ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTUYÊN NGÔN ĐỘC LẬP — ÁNG VĂN CHÍNH LUẬN MẪU MỰC\n\nNgày 2-9-1945, tại Quảng trường Ba Đình (Hà Nội), Chủ tịch Hồ Chí Minh đọc bản Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa. Đây không chỉ là văn kiện lịch sử trọng đại mà còn là áng văn chính luận mẫu mực của dân tộc.\n\nVề bố cục, tác phẩm có kết cấu chặt chẽ gồm ba phần: mở đầu nêu cơ sở pháp lí (trích dẫn Tuyên ngôn Độc lập của Mỹ năm 1776 và Tuyên ngôn Nhân quyền và Dân quyền của Pháp năm 1791 về quyền con người); tiếp theo tố cáo tội ác của thực dân Pháp và khẳng định thực tế lịch sử (nhân dân Việt Nam đã giành được độc lập); cuối cùng tuyên bố độc lập và quyết tâm bảo vệ nền độc lập ấy.\n\nVề lập luận, tác phẩm sử dụng nghệ thuật gậy ông đập lưng ông đầy tài tình: lấy chính những lời lẽ tốt đẹp của kẻ thù để vạch trần tội ác của chúng. Khi thực dân Pháp nói về quyền bình đẳng, bác ái mà lại áp bức, bóc lột nhân dân Việt Nam, sự giả dối của chúng bị phơi bày một cách đanh thép.\n\nVề ngôn ngữ, Tuyên ngôn Độc lập có giọng điệu hùng hồn, đanh thép khi tố cáo kẻ thù; trang trọng, thiêng liêng khi tuyên bố độc lập. Các biện pháp tu từ như điệp ngữ, liệt kê được sử dụng hiệu quả, tăng tính khẳng định cho từng luận điểm. Câu văn ngắn gọn, súc tích mà giàu sức thuyết phục.\n\nVới những giá trị ấy, Tuyên ngôn Độc lập xứng đáng là áng văn chính luận mẫu mực: vừa là văn kiện lịch sử, vừa là tác phẩm nghệ thuật; vừa thể hiện trí tuệ sắc sảo vừa thể hiện tâm hồn lớn của Hồ Chí Minh.\n\nCâu 3. Nghệ thuật \"gậy ông đập lưng ông\" trong Tuyên ngôn Độc lập là gì?", "options": ["A. Dùng gậy đánh kẻ thù", "B. Lấy chính những lời lẽ tốt đẹp của kẻ thù (về quyền con người) để vạch trần tội ác của chúng — lập luận sắc sảo", "C. Mượn vũ khí của địch", "D. Đánh trả quân thù"], "answer": "B", "explain": "Hồ Chí Minh trích dẫn Tuyên ngôn của Mỹ và Pháp về quyền con người rồi đối chiếu với tội ác thực dân — dùng chính lí lẽ của kẻ thù để đánh bại chúng, nghệ thuật lập luận tài tình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTUYÊN NGÔN ĐỘC LẬP — ÁNG VĂN CHÍNH LUẬN MẪU MỰC\n\nNgày 2-9-1945, tại Quảng trường Ba Đình (Hà Nội), Chủ tịch Hồ Chí Minh đọc bản Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa. Đây không chỉ là văn kiện lịch sử trọng đại mà còn là áng văn chính luận mẫu mực của dân tộc.\n\nVề bố cục, tác phẩm có kết cấu chặt chẽ gồm ba phần: mở đầu nêu cơ sở pháp lí (trích dẫn Tuyên ngôn Độc lập của Mỹ năm 1776 và Tuyên ngôn Nhân quyền và Dân quyền của Pháp năm 1791 về quyền con người); tiếp theo tố cáo tội ác của thực dân Pháp và khẳng định thực tế lịch sử (nhân dân Việt Nam đã giành được độc lập); cuối cùng tuyên bố độc lập và quyết tâm bảo vệ nền độc lập ấy.\n\nVề lập luận, tác phẩm sử dụng nghệ thuật gậy ông đập lưng ông đầy tài tình: lấy chính những lời lẽ tốt đẹp của kẻ thù để vạch trần tội ác của chúng. Khi thực dân Pháp nói về quyền bình đẳng, bác ái mà lại áp bức, bóc lột nhân dân Việt Nam, sự giả dối của chúng bị phơi bày một cách đanh thép.\n\nVề ngôn ngữ, Tuyên ngôn Độc lập có giọng điệu hùng hồn, đanh thép khi tố cáo kẻ thù; trang trọng, thiêng liêng khi tuyên bố độc lập. Các biện pháp tu từ như điệp ngữ, liệt kê được sử dụng hiệu quả, tăng tính khẳng định cho từng luận điểm. Câu văn ngắn gọn, súc tích mà giàu sức thuyết phục.\n\nVới những giá trị ấy, Tuyên ngôn Độc lập xứng đáng là áng văn chính luận mẫu mực: vừa là văn kiện lịch sử, vừa là tác phẩm nghệ thuật; vừa thể hiện trí tuệ sắc sảo vừa thể hiện tâm hồn lớn của Hồ Chí Minh.\n\nCâu 4. Ngôn ngữ của Tuyên ngôn Độc lập có đặc điểm gì?", "options": ["A. Hoa mĩ, cầu kì", "B. Hùng hồn, đanh thép khi tố cáo; trang trọng, thiêng liêng khi tuyên bố; ngắn gọn, súc tích mà giàu sức thuyết phục", "C. Khô khan, khó hiểu", "D. Dí dỏm, hài hước"], "answer": "B", "explain": "Giọng điệu biến hóa phù hợp từng phần, kết hợp điệp ngữ, liệt kê tăng tính khẳng định — ngôn ngữ chính luận mẫu mực, vừa giàu tính chiến đấu vừa giàu tính nghệ thuật.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTUYÊN NGÔN ĐỘC LẬP — ÁNG VĂN CHÍNH LUẬN MẪU MỰC\n\nNgày 2-9-1945, tại Quảng trường Ba Đình (Hà Nội), Chủ tịch Hồ Chí Minh đọc bản Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa. Đây không chỉ là văn kiện lịch sử trọng đại mà còn là áng văn chính luận mẫu mực của dân tộc.\n\nVề bố cục, tác phẩm có kết cấu chặt chẽ gồm ba phần: mở đầu nêu cơ sở pháp lí (trích dẫn Tuyên ngôn Độc lập của Mỹ năm 1776 và Tuyên ngôn Nhân quyền và Dân quyền của Pháp năm 1791 về quyền con người); tiếp theo tố cáo tội ác của thực dân Pháp và khẳng định thực tế lịch sử (nhân dân Việt Nam đã giành được độc lập); cuối cùng tuyên bố độc lập và quyết tâm bảo vệ nền độc lập ấy.\n\nVề lập luận, tác phẩm sử dụng nghệ thuật gậy ông đập lưng ông đầy tài tình: lấy chính những lời lẽ tốt đẹp của kẻ thù để vạch trần tội ác của chúng. Khi thực dân Pháp nói về quyền bình đẳng, bác ái mà lại áp bức, bóc lột nhân dân Việt Nam, sự giả dối của chúng bị phơi bày một cách đanh thép.\n\nVề ngôn ngữ, Tuyên ngôn Độc lập có giọng điệu hùng hồn, đanh thép khi tố cáo kẻ thù; trang trọng, thiêng liêng khi tuyên bố độc lập. Các biện pháp tu từ như điệp ngữ, liệt kê được sử dụng hiệu quả, tăng tính khẳng định cho từng luận điểm. Câu văn ngắn gọn, súc tích mà giàu sức thuyết phục.\n\nVới những giá trị ấy, Tuyên ngôn Độc lập xứng đáng là áng văn chính luận mẫu mực: vừa là văn kiện lịch sử, vừa là tác phẩm nghệ thuật; vừa thể hiện trí tuệ sắc sảo vừa thể hiện tâm hồn lớn của Hồ Chí Minh.\n\nCâu 5. Theo em, vì sao Tuyên ngôn Độc lập được coi là áng văn chính luận mẫu mực? (Trả lời ngắn gọn)", "answer": "Vì có bố cục chặt chẽ, lập luận sắc sảo, ngôn ngữ hùng hồn, giàu giá trị lịch sử và nghệ thuật", "explain": "Chấp nhận các cách diễn đạt tương đương: kết hợp nhuần nhuyễn lí trí và tình cảm; vừa là văn kiện lịch sử vừa là tác phẩm nghệ thuật...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận văn học khoảng 200 chữ cảm nhận về giá trị của Tuyên ngôn Độc lập.", "explain": "DÀN Ý:\n1. Mở đoạn: giới thiệu vị trí của Tuyên ngôn Độc lập.\n2. Thân đoạn: (a) Giá trị lịch sử: khai sinh nước Việt Nam Dân chủ Cộng hòa; (b) Giá trị nghệ thuật: bố cục chặt chẽ, lập luận đanh thép, ngôn ngữ hùng hồn; (c) Thể hiện trí tuệ và tâm hồn Hồ Chí Minh.\n3. Kết đoạn: khẳng định giá trị trường tồn.\n\nBÀI MẪU:\nTuyên ngôn Độc lập của Chủ tịch Hồ Chí Minh là một áng văn chính luận mẫu mực, có giá trị trường tồn trong lịch sử dân tộc. Về giá trị lịch sử, đây là văn kiện trọng đại khai sinh nước Việt Nam Dân chủ Cộng hòa, khẳng định quyền độc lập thiêng liêng của dân tộc ta trước toàn thế giới. Về giá trị nghệ thuật, tác phẩm có bố cục chặt chẽ với ba phần logic; lập luận sắc sảo, đanh thép — đặc biệt là nghệ thuật gậy ông đập lưng ông khi lấy chính lời lẽ của kẻ thù để vạch trần tội ác của chúng; ngôn ngữ hùng hồn khi tố cáo, trang trọng thiêng liêng khi tuyên bố độc lập. Đọc Tuyên ngôn Độc lập, ta không chỉ cảm nhận được trí tuệ sắc sảo của một nhà chính trị kiệt xuất mà còn thấy được tâm hồn lớn, tình yêu nước nồng nàn của Hồ Chí Minh. Hơn bảy mươi năm đã trôi qua, những lời tuyên bố đanh thép về quyền độc lập, tự do vẫn còn nguyên giá trị, nhắc nhở mỗi thế hệ người Việt Nam về trách nhiệm giữ gìn nền độc lập mà cha ông đã giành được bằng xương máu.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích nghệ thuật lập luận trong Tuyên ngôn Độc lập.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu tác phẩm và đặc sắc nghệ thuật lập luận.\nII. Thân bài:\n1. Bố cục lập luận chặt chẽ: cơ sở pháp lí — cơ sở thực tiễn — lời tuyên bố (từ lí lẽ chung đến thực tế riêng đến kết luận).\n2. Các thủ pháp lập luận:\n   a. Trích dẫn uy tín (Tuyên ngôn Mỹ, Pháp) làm cơ sở pháp lí.\n   b. Gậy ông đập lưng ông: dùng lí lẽ kẻ thù để vạch trần chúng.\n   c. Liệt kê tội ác (tăng tính tố cáo).\n   d. Điệp ngữ, câu khẳng định đanh thép (tăng tính thuyết phục).\n3. Ngôn ngữ lập luận: hùng hồn, súc tích; kết hợp lí trí và tình cảm.\n4. Hiệu quả: vừa thuyết phục bạn bè quốc tế vừa khích lệ nhân dân; thể hiện trí tuệ Hồ Chí Minh.\nIII. Kết bài: khẳng định mẫu mực của văn chính luận; bài học về nghệ thuật lập luận.\n\nĐOẠN MẪU (mở bài):\nLập luận là linh hồn của văn chính luận, và Tuyên ngôn Độc lập của Hồ Chí Minh là minh chứng hùng hồn nhất cho một nghệ thuật lập luận bậc thầy. Với bố cục chặt chẽ, các thủ pháp sắc sảo và ngôn ngữ đanh thép, tác phẩm không chỉ là văn kiện lịch sử trọng đại mà còn là áng văn chính luận mẫu mực cho mọi thời đại. Phân tích nghệ thuật lập luận của tác phẩm giúp ta hiểu sâu hơn trí tuệ và tài năng của Hồ Chí Minh.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHẬT KÍ TRONG TÙ — TÂM HỒN THI SĨ SAU SONG SẮT\n\nNhật kí trong tù là tập thơ chữ Hán gồm hơn một trăm bài, được Hồ Chí Minh sáng tác trong thời gian bị chính quyền Tưởng Giới Thạch giam cầm (1942–1943). Trong hoàn cảnh tù đày khắc nghiệt, thơ ca đã trở thành người bạn tâm tình, thành vũ khí tinh thần của người chiến sĩ cách mạng.\n\nĐiều kì diệu là giữa chốn ngục tù tăm tối, thơ Hồ Chí Minh vẫn tràn đầy ánh sáng lạc quan. Nhà thơ không hề bi lụy, than vãn mà luôn hướng về phía trước với niềm tin mãnh liệt vào ngày mai tươi sáng. Những bài thơ về trăng, về hoa, về cảnh đẹp thiên nhiên cho thấy một tâm hồn thi sĩ tinh tế, biết tìm thấy vẻ đẹp ngay cả trong hoàn cảnh khốn cùng nhất.\n\nBên cạnh đó, tập thơ còn thể hiện bản lĩnh thép của người chiến sĩ. Dù bị xiềng xích, đói rét, bệnh tật, Hồ Chí Minh vẫn giữ vững khí tiết, vẫn quan sát, suy ngẫm về con người và cuộc đời. Những bài thơ châm biếm bọn quan lại, cai ngục cho thấy tinh thần đấu tranh kiên cường, không chịu khuất phục.\n\nNhật kí trong tù còn là bức tranh chân thực về xã hội Trung Quốc thời bấy giờ với bao cảnh đời bất công, đau khổ — thể hiện tấm lòng nhân đạo sâu sắc của nhà thơ đối với những người cùng khổ.\n\nVới những giá trị ấy, Nhật kí trong tù là minh chứng hùng hồn cho sự thống nhất tuyệt vời giữa chất chiến sĩ và chất thi sĩ trong con người Hồ Chí Minh: càng trong gian khổ, tâm hồn thi sĩ càng tỏa sáng; càng là thi sĩ, bản lĩnh chiến sĩ càng thêm kiên cường.\n\nCâu 1. Nhật kí trong tù được sáng tác trong hoàn cảnh nào?", "options": ["A. Khi đi thăm các nước", "B. Trong thời gian bị chính quyền Tưởng Giới Thạch giam cầm (1942–1943)", "C. Sau ngày độc lập", "D. Thời niên thiếu"], "answer": "B", "explain": "Văn bản cho biết: tập thơ được sáng tác trong thời gian Hồ Chí Minh bị chính quyền Tưởng Giới Thạch giam cầm (1942–1943).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHẬT KÍ TRONG TÙ — TÂM HỒN THI SĨ SAU SONG SẮT\n\nNhật kí trong tù là tập thơ chữ Hán gồm hơn một trăm bài, được Hồ Chí Minh sáng tác trong thời gian bị chính quyền Tưởng Giới Thạch giam cầm (1942–1943). Trong hoàn cảnh tù đày khắc nghiệt, thơ ca đã trở thành người bạn tâm tình, thành vũ khí tinh thần của người chiến sĩ cách mạng.\n\nĐiều kì diệu là giữa chốn ngục tù tăm tối, thơ Hồ Chí Minh vẫn tràn đầy ánh sáng lạc quan. Nhà thơ không hề bi lụy, than vãn mà luôn hướng về phía trước với niềm tin mãnh liệt vào ngày mai tươi sáng. Những bài thơ về trăng, về hoa, về cảnh đẹp thiên nhiên cho thấy một tâm hồn thi sĩ tinh tế, biết tìm thấy vẻ đẹp ngay cả trong hoàn cảnh khốn cùng nhất.\n\nBên cạnh đó, tập thơ còn thể hiện bản lĩnh thép của người chiến sĩ. Dù bị xiềng xích, đói rét, bệnh tật, Hồ Chí Minh vẫn giữ vững khí tiết, vẫn quan sát, suy ngẫm về con người và cuộc đời. Những bài thơ châm biếm bọn quan lại, cai ngục cho thấy tinh thần đấu tranh kiên cường, không chịu khuất phục.\n\nNhật kí trong tù còn là bức tranh chân thực về xã hội Trung Quốc thời bấy giờ với bao cảnh đời bất công, đau khổ — thể hiện tấm lòng nhân đạo sâu sắc của nhà thơ đối với những người cùng khổ.\n\nVới những giá trị ấy, Nhật kí trong tù là minh chứng hùng hồn cho sự thống nhất tuyệt vời giữa chất chiến sĩ và chất thi sĩ trong con người Hồ Chí Minh: càng trong gian khổ, tâm hồn thi sĩ càng tỏa sáng; càng là thi sĩ, bản lĩnh chiến sĩ càng thêm kiên cường.\n\nCâu 2. Tập thơ gồm bao nhiêu bài, viết bằng chữ gì?", "options": ["A. Hơn một trăm bài, viết bằng chữ Hán", "B. Mười bài, viết bằng chữ quốc ngữ", "C. Năm mươi bài, viết bằng tiếng Pháp", "D. Hai trăm bài, viết bằng chữ Nôm"], "answer": "A", "explain": "Nhật kí trong tù là tập thơ chữ Hán gồm hơn một trăm bài — di sản thơ ca quý giá của Hồ Chí Minh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHẬT KÍ TRONG TÙ — TÂM HỒN THI SĨ SAU SONG SẮT\n\nNhật kí trong tù là tập thơ chữ Hán gồm hơn một trăm bài, được Hồ Chí Minh sáng tác trong thời gian bị chính quyền Tưởng Giới Thạch giam cầm (1942–1943). Trong hoàn cảnh tù đày khắc nghiệt, thơ ca đã trở thành người bạn tâm tình, thành vũ khí tinh thần của người chiến sĩ cách mạng.\n\nĐiều kì diệu là giữa chốn ngục tù tăm tối, thơ Hồ Chí Minh vẫn tràn đầy ánh sáng lạc quan. Nhà thơ không hề bi lụy, than vãn mà luôn hướng về phía trước với niềm tin mãnh liệt vào ngày mai tươi sáng. Những bài thơ về trăng, về hoa, về cảnh đẹp thiên nhiên cho thấy một tâm hồn thi sĩ tinh tế, biết tìm thấy vẻ đẹp ngay cả trong hoàn cảnh khốn cùng nhất.\n\nBên cạnh đó, tập thơ còn thể hiện bản lĩnh thép của người chiến sĩ. Dù bị xiềng xích, đói rét, bệnh tật, Hồ Chí Minh vẫn giữ vững khí tiết, vẫn quan sát, suy ngẫm về con người và cuộc đời. Những bài thơ châm biếm bọn quan lại, cai ngục cho thấy tinh thần đấu tranh kiên cường, không chịu khuất phục.\n\nNhật kí trong tù còn là bức tranh chân thực về xã hội Trung Quốc thời bấy giờ với bao cảnh đời bất công, đau khổ — thể hiện tấm lòng nhân đạo sâu sắc của nhà thơ đối với những người cùng khổ.\n\nVới những giá trị ấy, Nhật kí trong tù là minh chứng hùng hồn cho sự thống nhất tuyệt vời giữa chất chiến sĩ và chất thi sĩ trong con người Hồ Chí Minh: càng trong gian khổ, tâm hồn thi sĩ càng tỏa sáng; càng là thi sĩ, bản lĩnh chiến sĩ càng thêm kiên cường.\n\nCâu 3. Điều kì diệu trong thơ Hồ Chí Minh khi ở tù là gì?", "options": ["A. Thơ rất dài", "B. Giữa chốn ngục tù tăm tối, thơ vẫn tràn đầy ánh sáng lạc quan, không bi lụy — thể hiện tâm hồn thi sĩ và niềm tin mãnh liệt", "C. Thơ được nhiều người biết đến", "D. Thơ viết rất nhanh"], "answer": "B", "explain": "Trong hoàn cảnh tù đày khắc nghiệt, thơ Người vẫn lạc quan, yêu đời, tìm thấy vẻ đẹp trong mọi hoàn cảnh — đó là điều kì diệu của tâm hồn thi sĩ Hồ Chí Minh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHẬT KÍ TRONG TÙ — TÂM HỒN THI SĨ SAU SONG SẮT\n\nNhật kí trong tù là tập thơ chữ Hán gồm hơn một trăm bài, được Hồ Chí Minh sáng tác trong thời gian bị chính quyền Tưởng Giới Thạch giam cầm (1942–1943). Trong hoàn cảnh tù đày khắc nghiệt, thơ ca đã trở thành người bạn tâm tình, thành vũ khí tinh thần của người chiến sĩ cách mạng.\n\nĐiều kì diệu là giữa chốn ngục tù tăm tối, thơ Hồ Chí Minh vẫn tràn đầy ánh sáng lạc quan. Nhà thơ không hề bi lụy, than vãn mà luôn hướng về phía trước với niềm tin mãnh liệt vào ngày mai tươi sáng. Những bài thơ về trăng, về hoa, về cảnh đẹp thiên nhiên cho thấy một tâm hồn thi sĩ tinh tế, biết tìm thấy vẻ đẹp ngay cả trong hoàn cảnh khốn cùng nhất.\n\nBên cạnh đó, tập thơ còn thể hiện bản lĩnh thép của người chiến sĩ. Dù bị xiềng xích, đói rét, bệnh tật, Hồ Chí Minh vẫn giữ vững khí tiết, vẫn quan sát, suy ngẫm về con người và cuộc đời. Những bài thơ châm biếm bọn quan lại, cai ngục cho thấy tinh thần đấu tranh kiên cường, không chịu khuất phục.\n\nNhật kí trong tù còn là bức tranh chân thực về xã hội Trung Quốc thời bấy giờ với bao cảnh đời bất công, đau khổ — thể hiện tấm lòng nhân đạo sâu sắc của nhà thơ đối với những người cùng khổ.\n\nVới những giá trị ấy, Nhật kí trong tù là minh chứng hùng hồn cho sự thống nhất tuyệt vời giữa chất chiến sĩ và chất thi sĩ trong con người Hồ Chí Minh: càng trong gian khổ, tâm hồn thi sĩ càng tỏa sáng; càng là thi sĩ, bản lĩnh chiến sĩ càng thêm kiên cường.\n\nCâu 4. Tập thơ thể hiện sự thống nhất giữa hai phẩm chất nào?", "options": ["A. Giàu và nghèo", "B. Chất chiến sĩ (bản lĩnh thép, kiên cường) và chất thi sĩ (tâm hồn tinh tế, lạc quan) — càng gian khổ càng tỏa sáng", "C. Cổ điển và hiện đại", "D. Việt Nam và Trung Quốc"], "answer": "B", "explain": "Văn bản khẳng định: Nhật kí trong tù là minh chứng cho sự thống nhất giữa chất chiến sĩ và chất thi sĩ — nét độc đáo trong con người và thơ văn Hồ Chí Minh.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHẬT KÍ TRONG TÙ — TÂM HỒN THI SĨ SAU SONG SẮT\n\nNhật kí trong tù là tập thơ chữ Hán gồm hơn một trăm bài, được Hồ Chí Minh sáng tác trong thời gian bị chính quyền Tưởng Giới Thạch giam cầm (1942–1943). Trong hoàn cảnh tù đày khắc nghiệt, thơ ca đã trở thành người bạn tâm tình, thành vũ khí tinh thần của người chiến sĩ cách mạng.\n\nĐiều kì diệu là giữa chốn ngục tù tăm tối, thơ Hồ Chí Minh vẫn tràn đầy ánh sáng lạc quan. Nhà thơ không hề bi lụy, than vãn mà luôn hướng về phía trước với niềm tin mãnh liệt vào ngày mai tươi sáng. Những bài thơ về trăng, về hoa, về cảnh đẹp thiên nhiên cho thấy một tâm hồn thi sĩ tinh tế, biết tìm thấy vẻ đẹp ngay cả trong hoàn cảnh khốn cùng nhất.\n\nBên cạnh đó, tập thơ còn thể hiện bản lĩnh thép của người chiến sĩ. Dù bị xiềng xích, đói rét, bệnh tật, Hồ Chí Minh vẫn giữ vững khí tiết, vẫn quan sát, suy ngẫm về con người và cuộc đời. Những bài thơ châm biếm bọn quan lại, cai ngục cho thấy tinh thần đấu tranh kiên cường, không chịu khuất phục.\n\nNhật kí trong tù còn là bức tranh chân thực về xã hội Trung Quốc thời bấy giờ với bao cảnh đời bất công, đau khổ — thể hiện tấm lòng nhân đạo sâu sắc của nhà thơ đối với những người cùng khổ.\n\nVới những giá trị ấy, Nhật kí trong tù là minh chứng hùng hồn cho sự thống nhất tuyệt vời giữa chất chiến sĩ và chất thi sĩ trong con người Hồ Chí Minh: càng trong gian khổ, tâm hồn thi sĩ càng tỏa sáng; càng là thi sĩ, bản lĩnh chiến sĩ càng thêm kiên cường.\n\nCâu 5. Qua văn bản, em học được điều gì về thái độ sống trước khó khăn? (Trả lời ngắn gọn)", "answer": "Lạc quan, kiên cường, không gục ngã trước nghịch cảnh", "explain": "Chấp nhận các cách diễn đạt tương đương: giữ vững niềm tin; biến khó khăn thành động lực; tâm hồn đẹp vượt lên hoàn cảnh...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về tinh thần lạc quan trước khó khăn.", "explain": "DÀN Ý:\n1. Mở đoạn: lạc quan là sức mạnh giúp con người vượt qua nghịch cảnh.\n2. Thân đoạn: (a) Biểu hiện: như Hồ Chí Minh làm thơ lạc quan trong tù; nhìn khó khăn bằng con mắt tích cực; (b) Ý nghĩa: tạo động lực, lan tỏa năng lượng tốt; (c) Phê phán thói bi quan, chán nản, buông xuôi.\n3. Kết đoạn: hãy rèn luyện tinh thần lạc quan.\n\nBÀI MẪU:\nTinh thần lạc quan là sức mạnh tinh thần to lớn giúp con người vượt qua mọi khó khăn, nghịch cảnh trong cuộc sống. Người lạc quan không phủ nhận khó khăn mà dám đối mặt với nó bằng niềm tin vào ngày mai tốt đẹp — như Hồ Chí Minh trong chốn ngục tù tăm tối vẫn sáng tác những vần thơ tràn đầy ánh sáng, vẫn tìm thấy vẻ đẹp của trăng, của hoa giữa cảnh đói rét, xiềng xích. Lạc quan giúp ta giữ vững ý chí, biến nghịch cảnh thành động lực vươn lên; đồng thời lan tỏa năng lượng tích cực đến những người xung quanh. Ngược lại, kẻ bi quan, chán nản sẽ tự giam mình trong bóng tối, bỏ cuộc trước khó khăn và làm cho cuộc sống thêm nặng nề. Trong cuộc sống, ai cũng có lúc gặp thất bại, vấp ngã — điều quan trọng là ta có đủ lạc quan để đứng dậy hay không. Hãy học tập tinh thần của Bác: dù trong hoàn cảnh nào cũng giữ vững niềm tin, cũng tìm thấy vẻ đẹp của cuộc sống. Lạc quan không phải là ảo tưởng mà là bản lĩnh — bản lĩnh của những con người làm chủ được cảm xúc và số phận của mình.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ cảm nhận về vẻ đẹp tâm hồn Hồ Chí Minh qua tập Nhật kí trong tù.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu tập thơ và vẻ đẹp tâm hồn tác giả.\nII. Thân bài:\n1. Tâm hồn thi sĩ tinh tế: yêu thiên nhiên (trăng, hoa), tìm thấy vẻ đẹp trong mọi hoàn cảnh.\n2. Bản lĩnh chiến sĩ kiên cường: không bi lụy trước gian khổ; giữ vững khí tiết; châm biếm kẻ thù.\n3. Tấm lòng nhân đạo: đồng cảm với những người cùng khổ; bức tranh xã hội chân thực.\n4. Niềm tin lạc quan vào tương lai: hướng về ánh sáng, về ngày mai.\n5. Sự thống nhất giữa thi sĩ và chiến sĩ — nét độc đáo.\nIII. Kết bài: khẳng định vẻ đẹp tâm hồn Hồ Chí Minh; bài học cho thế hệ trẻ.\n\nĐOẠN MẪU (mở bài):\nCó những tác phẩm ra đời trong bóng tối ngục tù mà lại tràn đầy ánh sáng — Nhật kí trong tù của Hồ Chí Minh là một tác phẩm như thế. Hơn một trăm bài thơ chữ Hán được sáng tác trong xiềng xích đã trở thành minh chứng hùng hồn cho vẻ đẹp tâm hồn của Người: một tâm hồn thi sĩ tinh tế hòa quyện cùng bản lĩnh thép của người chiến sĩ cách mạng. Tìm hiểu tập thơ, ta càng thêm kính yêu và cảm phục con người vĩ đại Hồ Chí Minh.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHỮNG TRÒ LỐ — TIẾNG CƯỜI TRÀO PHÚNG CỦA NGUYỄN ÁI QUỐC\n\nNhững trò lố hay là Va-ren và Phan Bội Châu là truyện ngắn trào phúng đặc sắc của Nguyễn Ái Quốc, viết bằng tiếng Pháp và đăng trên báo Người cùng khổ năm 1925. Tác phẩm vạch trần bộ mặt giả dối, lố bịch của toàn quyền Đông Dương Va-ren và chính sách mị dân của thực dân Pháp.\n\nTruyện kể về việc Va-ren sang Đông Dương với lời hứa sẽ ân xá cho Phan Bội Châu — nhà yêu nước đang bị giam cầm. Nhưng đó chỉ là trò mị dân: Va-ren hứa suông để xoa dịu dư luận, còn Phan Bội Châu vẫn bị giam. Tác giả dựng lên những tình huống trớ trêu: Va-ren diễn kịch ân xá, bọn tay sai tung hô, còn thực chất chẳng có gì thay đổi.\n\nNghệ thuật trào phúng của Nguyễn Ái Quốc thể hiện ở việc xây dựng nhân vật Va-ren như một diễn viên tồi trên sân khấu chính trị: lời nói hoa mỹ nhưng việc làm rỗng tuếch. Giọng văn châm biếm sâu cay, có lúc hài hước mà đau xót. Tác giả không chửi rủa trực tiếp mà để sự thật tự phơi bày qua những trò lố bịch — càng đọc càng thấy nực cười và khinh bỉ.\n\nTác phẩm còn thể hiện tình cảm kính yêu của Nguyễn Ái Quốc đối với Phan Bội Châu — bậc tiền bối yêu nước. Dù bất đồng về con đường cứu nước, Nguyễn Ái Quốc vẫn trân trọng tấm lòng yêu nước của cụ Phan.\n\nVới Những trò lố, Nguyễn Ái Quốc đã chứng tỏ tài năng của một nhà văn trào phúng sắc sảo, biến ngòi bút thành vũ khí đấu tranh hiệu quả. Tác phẩm là minh chứng cho quan điểm văn chương phục vụ cách mạng của Người từ rất sớm.\n\nCâu 1. Truyện Những trò lố được viết bằng tiếng gì, đăng ở đâu, năm nào?", "options": ["A. Tiếng Việt, báo Thanh niên, 1925", "B. Tiếng Pháp, báo Người cùng khổ, năm 1925", "C. Tiếng Hán, báo Cứu quốc, 1945", "D. Tiếng Anh, báo Nhân đạo, 1920"], "answer": "B", "explain": "Văn bản cho biết: truyện viết bằng tiếng Pháp, đăng trên báo Người cùng khổ năm 1925 — thời kì Nguyễn Ái Quốc hoạt động ở Pháp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu  1 đến Câu 5:\n\nNHỮNG TRÒ LỐ — TIẾNG CƯỜI TRÀO PHÚNG CỦA NGUYỄN ÁI QUỐC\n\nNhững trò lố hay là Va-ren và Phan Bội Châu là truyện ngắn trào phúng đặc sắc của Nguyễn Ái Quốc, viết bằng tiếng Pháp và đăng trên báo Người cùng khổ năm 1925. Tác phẩm vạch trần bộ mặt giả dối, lố bịch của toàn quyền Đông Dương Va-ren và chính sách mị dân của thực dân Pháp.\n\nTruyện kể về việc Va-ren sang Đông Dương với lời hứa sẽ ân xá cho Phan Bội Châu — nhà yêu nước đang bị giam cầm. Nhưng đó chỉ là trò mị dân: Va-ren hứa suông để xoa dịu dư luận, còn Phan Bội Châu vẫn bị giam. Tác giả dựng lên những tình huống trớ trêu: Va-ren diễn kịch ân xá, bọn tay sai tung hô, còn thực chất chẳng có gì thay đổi.\n\nNghệ thuật trào phúng của Nguyễn Ái Quốc thể hiện ở việc xây dựng nhân vật Va-ren như một diễn viên tồi trên sân khấu chính trị: lời nói hoa mỹ nhưng việc làm rỗng tuếch. Giọng văn châm biếm sâu cay, có lúc hài hước mà đau xót. Tác giả không chửi rủa trực tiếp mà để sự thật tự phơi bày qua những trò lố bịch — càng đọc càng thấy nực cười và khinh bỉ.\n\nTác phẩm còn thể hiện tình cảm kính yêu của Nguyễn Ái Quốc đối với Phan Bội Châu — bậc tiền bối yêu nước. Dù bất đồng về con đường cứu nước, Nguyễn Ái Quốc vẫn trân trọng tấm lòng yêu nước của cụ Phan.\n\nVới Những trò lố, Nguyễn Ái Quốc đã chứng tỏ tài năng của một nhà văn trào phúng sắc sảo, biến ngòi bút thành vũ khí đấu tranh hiệu quả. Tác phẩm là minh chứng cho quan điểm văn chương phục vụ cách mạng của Người từ rất sớm.\n\nCâu 4. Qua tác phẩm, tình cảm của Nguyễn Ái Quốc với Phan Bội Châu như thế nào?", "options": ["A. Khinh thường", "B. Kính yêu, trân trọng tấm lòng yêu nước của bậc tiền bối dù bất đồng về con đường", "C. Thờ ơ", "D. Ghen tị"], "answer": "B", "explain": "Dù bất đồng về con đường cứu nước, Nguyễn Ái Quốc vẫn trân trọng tấm lòng yêu nước của cụ Phan — thể hiện đạo lí tôn trọng tiền bối và sự đoàn kết trong sự nghiệp chung.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời ác phẩm.", "explain": "DÀN Ý:\n1. Mở đoạn: giới thiệu tài năng trào phúng qua Những trò lố.\n2. Thân đoạn: (a) Xây dựng nhân vật Va-ren như diễn viên tồi; (b) Tình huống trớ trêu (hứa ân xá nhưng chỉ là mị dân); (c) Giọng châm biếm sâu cay mà không chửi rủa; (d) Ý nghĩa: vạch trần thực dân, ngợi ca tinh thần yêu nước.\n3. Kết đoạn: khẳng định tài năng.\n\nBÀI MẪU:\nQua truyện ngắn Những trò lố hay là Va-ren và Phan Bội Châu, Nguyễn Ái Quốc đã chứng tỏ tài năng trào phúng sắc sảo của một nhà văn chiến sĩ. Tài năng ấy trước hết thể hiện ở nghệ thuật xây dựng nhân vật: Va-ren — viên toàn quyền Đông Dương — hiện lên như một diễn viên tồi trên sân khấu chính trị, với những lời hứa hoa mỹ về ân xá nhưng thực chất chỉ là trò mị dân. Tác giả không cần chửi rủa trực tiếp mà khéo léo dựng lên những tình huống trớ trêu để sự lố bịch tự phơi bày: càng đọc, người đọc càng thấy nực cười và khinh bỉ bộ mặt giả dối của kẻ thù. Giọng văn châm biếm sâu cay, có lúc hài hước mà đau xót, cho thấy ngòi bút của Nguyễn Ái Quốc vừa là vũ khí đấu tranh hiệu quả vừa giàu giá trị nghệ thuật. Đằng sau tiếng cười trào phúng là tình cảm kính yêu dành cho Phan Bội Châu — bậc tiền bối yêu nước — và lòng căm thù sâu sắc đối với thực dân xâm lược. Tác phẩm là minh chứng sinh động cho quan điểm văn chương phục vụ cách mạng của Hồ Chí Minh ngay từ những năm tháng hoạt động ở Pháp.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích giá trị trào phúng của truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu tác phẩm và giá trị trào phúng đặc sắc.\nII. Thân bài:\n1. Đối tượng trào phúng: Va-ren và chính sách mị dân của thực dân Pháp.\n2. Nghệ thuật trào phúng:\n   a. Xây dựng tình huống trớ trêu (hứa ân xá — thực chất mị dân).\n   b. Khắc họa nhân vật Va-ren như diễn viên tồi.\n   c. Giọng điệu châm biếm sâu cay, hài hước mà đau xót.\n   d. Để sự thật tự phơi bày thay vì chửi rủa trực tiếp.\n3. Ý nghĩa:\n   a. Vạch trần bộ mặt thật của thực dân.\n   b. Ngợi ca tinh thần yêu nước (Phan Bội Châu).\n   c. Vũ khí đấu tranh hiệu quả.\n4. Liên hệ với truyền thống trào phúng dân tộc và giá trị thời sự.\nIII. Kết bài: khẳng định tài năng Nguyễn Ái Quốc; ý nghĩa của văn chương chiến đấu.\n\nĐOẠN MẪU (mở bài):\nTiếng cười trào phúng là vũ khí lợi hại trong đấu tranh, và Nguyễn Ái Quốc là một trong những bậc thầy sử dụng vũ khí ấy. Truyện ngắn Những trò lố hay là Va-ren và Phan Bội Châu với nghệ thuật trào phúng sắc sảo đã vạch trần bộ mặt giả dối của thực dân Pháp, để lại tiếng cười vừa sảng khoái vừa sâu cay. Phân tích giá trị trào phúng của tác phẩm giúp ta hiểu hơn tài năng văn chương và tư tưởng cách mạng của Nguyễn Ái Quốc.", "points": 0}]}]}
