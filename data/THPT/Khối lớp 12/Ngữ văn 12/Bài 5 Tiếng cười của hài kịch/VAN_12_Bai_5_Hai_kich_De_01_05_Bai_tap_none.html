!\n\nCâu 3. Thủ pháp trào phúng chính được sử dụng trong trích đoạn là gì?", "options": ["A. Phóng đại ngoại hình", "B. Đối lập giữa lời tự xưng thanh liêm và hành động tham nhũng trắng trợn", "C. Nhại giọng nói", "D. Tình huống ngẫu nhiên"], "answer": "B", "explain": "Toàn bộ tiếng cười đến từ sự đối lập: miệng nói thanh liêm, tay nhận hối lộ; miệng nói công lí, xử theo tiền biếu — thủ pháp đối lập phơi bày bản chất đạo đức giả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÔNG QUAN THANH LIÊM\n(Trích vở hài kịch — cảnh tại công đường)\n\nQuan huyện (vỗ bàn, giọng sang sảng): Ta làm quan đã mười năm nay, nổi tiếng thanh liêm, chính trực! Ai dám nói ta tham nhũng, ta chém đầu!\n\nLính lệ (khúm núm): Dạ bẩm quan lớn, quan lớn thanh liêm như gương sáng, dân chúng ai cũng kính phục ạ!\n\nQuan huyện (gật gù): Khá! Ngươi biết điều đấy. À, vụ kiện đất của nhà bà Góa với nhà ông Phú thế nào rồi?\n\nLính lệ: Dạ, nhà bà Góa nghèo, không có gì biếu quan. Còn nhà ông Phú thì vừa gửi đến... một mâm lễ vật rất hậu hĩnh ạ.\n\nQuan huyện (sáng mắt): Ồ! Vậy thì rõ ràng nhà ông Phú có lí! Người có lòng thành như thế ắt là người ngay thẳng. Xử cho nhà ông Phú thắng kiện!\n\nLính lệ (ngập ngừng): Nhưng bẩm quan, giấy tờ đất đai đều đứng tên bà Góa...\n\nQuan huyện (quát): Giấy tờ thì làm lại được! Lòng thành mới là quan trọng! Ngươi không thấy nhà ông Phú có lòng thành với ta sao? Phải xử sao cho xứng với tấm lòng ấy!\n\nLính lệ: Dạ... quan lớn thật là... công minh ạ.\n\nQuan huyện (đắc ý): Tất nhiên! Ta xử án xưa nay chỉ theo một nguyên tắc: ai có lòng thành với ta hơn thì người ấy đúng! Đó gọi là công lí!\n\n(Đúng lúc đó, chánh tổng bước vào, tay xách một tráp to.)\n\nChánh tổng: Bẩm quan lớn, con có chút quà mọn biếu quan lớn gọi là... tỏ lòng thành ạ.\n\nQuan huyện (mắt sáng rực, vội đỡ lấy tráp): Tốt! Tốt lắm! Ngươi là người có lòng thành nhất vùng này! Từ nay có việc gì khó, cứ đến gặp ta!\n\nLính  vội đỡ lấy tráp): Tốt! Tốt lắm! Ngươi là người có lòng thành nhất vùng này! Từ nay có việc gì khó, cứ đến gặp ta!\n\nLính lệ (nói thầm với khán giả): Quan lớn nhà ta thanh liêm thật đấy — thanh liêm đến mức ai biếu nhiều thì người ấy... ngay thẳng!\n\nCâu 5. Qua trích đoạn, em rút ra bài học gì về sự trung thực, liêm chính? (Trả lời ngắn gọn)", "answer": "Phải liêm chính thật sự, không đạo đức giả; nói đi đôi với làm", "explain": "Chấp nhận các cách diễn đạt tương đương: phê phán tham nhũng, đạo đức giả; người có chức quyền càng phải liêm chính; đừng nói một đằng làm một nẻo...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của tính liêm chính đối với người cán bộ.", "explain": "DÀN Ý:\n1. Mở đoạn: liêm chính là phẩm chất hàng đầu của người cán bộ.\n2. Thân đoạn: (a) Vai trò: tạo niềm tin của nhân dân; cán bộ liêm chính được kính trọng như tấm gương; (b) Tác hại của tham nhũng, đạo đức giả như quan huyện trong trích đoạn; (c) Phê phán thói vơ vét, nói một đằng làm một nẻo.\n3. Kết đoạn: mỗi cán bộ phải rèn luyện liêm chính.\n\nBÀI MẪU:\nLiêm chính là phẩm chất hàng đầu, là thước đo đạo đức của người cán bộ. Người cán bộ liêm chính — không tham ô, không vụ lợi, đặt lợi ích của nhân dân lên trên — sẽ tạo được niềm tin yêu của quần chúng và là tấm gương sáng cho mọi người noi theo. Trong lịch sử và hiện tại, có biết bao cán bộ liêm khiết được nhân dân kính trọng, ghi nhớ. Ngược lại, thói tham nhũng, đạo đức giả như nhân vật quan huyện trong trích đoạn — miệng rao giảng thanh liêm mà tay vơ vét hối lộ, xử án theo tiền biếu — không chỉ làm mất niềm tin của nhân dân mà còn gây ra bao bất công, oan trái cho người dân lương thiện. Tham nhũng là quốc nạn, là giặc nội xâm gặm nhấm niềm tin xã hội. Vì vậy, mỗi người cán bộ, dù ở cương vị nào, đều phải thường xuyên rèn luyện đức tính liêm chính: nói đi đôi với làm, không vụ lợi cá nhân, dám đấu tranh với cái xấu. Chỉ khi đội ngũ cán bộ thực sự liêm chính thì bộ máy mới trong sạch và đất nước mới phát triển bền vững.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích tiếng cười trào phúng trong trích đoạn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu trích đoạn hài kịch và tiếng cười trào phúng đặc sắc.\nII. Thân bài:\n1. Tình huống gây cười: quan huyện tự xưng thanh liêm nhưng xử án theo tiền biếu — trớ trêu, lố bịch.\n2. Thủ pháp trào phúng:\n   a. Đối lập lời nói — việc làm (nói thanh liêm, làm tham nhũng).\n   b. Nói mỉa qua lời lính lệ (khen quan công minh khi quan xử bậy).\n   c. Phóng đại sự trắng trợn (tuyên bố nguyên tắc xử theo lòng thành).\n3. Nhân vật quan huyện: điển hình cho kẻ tham nhũng đạo đức giả.\n4. Ý nghĩa phê phán: vạch trần nạn tham nhũng; tiếng cười vừa hài hước vừa đau xót (cười ra nước mắt trước bất công).\nIII. Kết bài: khẳng định giá trị của tiếng cười trào phúng; liên hệ trách nhiệm đấu tranh với tham nhũng.\n\nĐOẠN MẪU (mở bài):\nTiếng cười trong hài kịch không phải là tiếng cười vô tư mà là tiếng cười có ý nghĩa phê phán — người ta gọi đó là tiếng cười trào phúng. Trích đoạn Ông quan thanh liêm là một minh chứng tiêu biểu: qua nhân vật quan huyện luôn miệng tự xưng liêm chính nhưng xử án theo tiền biếu, tác giả đã tạo nên những tràng cười sảng khoái mà sau đó là vị đắng của sự phê phán sâu cay đối với nạn tham nhũng, đạo đức giả.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHẦY BÓI BA HOA\n(Trích vở hài kịch — cảnh tại nhà thầy bói)\n\nThầy bói (đeo kính đen, gõ gậy, giọng bí hiểm): Ta đây trên thông thiên văn, dưới tường địa lí! Số mệnh con người ta nhìn qua là biết!\n\nKhách (rón rén): Dạ, thầy xem giúp con đường công danh ạ.\n\nThầy bói (sờ tay khách, gật gù): Ừm... đường công danh của anh... gập ghềnh lắm! Có kẻ tiểu nhân hãm hại! Nhưng đừng lo, ta có cách hóa giải — chỉ cần... một cái lễ thật to!\n\nKhách: Dạ, lễ bao nhiêu ạ?\n\nThầy bói: Càng to càng linh! Ít nhất... năm triệu!\n\n(Bỗng có tiếng trẻ con khóc ngoài sân. Thầy bói giật mình, vội tháo kính đen lau nước mắt.)\n\nThầy bói (nói thầm): Khổ quá, con mình ốm mà mình không biết chữa, lại đi... xem bói cho người ta!\n\nKhách (ngạc nhiên): Thầy vừa nói gì ạ? Mà sao thầy đeo kính đen giữa nhà thế?\n\nThầy bói (lúng túng): À... ta đeo kính để... nhìn thấu cõi âm cho rõ! Mắt thường làm sao thấy được ma quỷ!\n\nVợ thầy bói (từ trong nhà chạy ra): Ông ơi, ông có thấy chìa khóa tủ đâu không? Tiền lễ của khách hôm qua em cất đâu mất rồi!\n\nThầy bói (đỏ mặt): Bà... bà vào nhà đi! Đang có khách!\n\nVợ thầy bói: Khách khứa gì! Ông xem bói cho người ta mà chìa khóa nhà mình còn không tìm ra, tiền để đâu cũng quên! Thiên văn địa lí cái nỗi gì!\n\nKhách (đứng dậy, nói với khán giả): Hóa ra thầy bói trên thông thiên văn, dưới tường địa lí... mà trong nhà mình có cái chìa khóa cũng không tường! Thôi, tôi xin phép về tự... bói cho mình vậy!\n\nThầy bói (với theo): Ấy, anh đừng đi! Ta... ta xem miễn phí cho! Chỉ cần anh đừng kể chuyện này với ai!\n\nKhách: Thầy yên tâm, tôi sẽ kể... cho cả làng nghe để mọi người cùng... cảnh giác ạ!\n\nCâu 1. Tình huống gây cười trong trích đoạn là gì?", "options": ["A. Thầy bói xem bói rất giỏi", "B. Thầy bói tự xưng trên thông thiên văn nhưng đến chìa khóa, tiền bạc trong nhà mình cũng không tìm ra — bị vợ vạch trần", "C. Khách đến xem bói đông", "D. Vợ thầy bói nấu cơm ngon"], "answer": "B", "explain": "Tình huống trớ trêu: kẻ tự xưng biết hết mọi chuyện trên trời dưới đất lại không biết chuyện trong nhà mình, bị chính vợ vạch trần trước mặt khách — gây cười mà thâm thúy.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHẦY BÓI BA HOA\n(Trích vở hài kịch — cảnh tại nhà thầy bói)\n\nThầy bói (đeo kính đen, gõ gậy, giọng bí hiểm): Ta đây trên thông thiên văn, dưới tường địa lí! Số mệnh con người ta nhìn qua là biết!\n\nKhách (rón rén): Dạ, thầy xem giúp con đường công danh ạ.\n\nThầy bói (sờ tay khách, gật gù): Ừm... đường công danh của anh... gập ghềnh lắm! Có kẻ tiểu nhân hãm hại! Nhưng đừng lo, ta có cách hóa giải — chỉ cần... một cái lễ thật to!\n\nKhách: Dạ, lễ bao nhiêu ạ?\n\nThầy bói: Càng to càng linh! Ít nhất... năm triệu!\n\n(Bỗng có tiếng trẻ con khóc ngoài sân. Thầy bói giật mình, vội tháo kính đen lau nước mắt.)\n\nThầy bói (nói thầm): Khổ quá, con mình ốm mà mình không biết chữa, lại đi... xem bói cho người ta!\n\nKhách (ngạc nhiên): Thầy vừa nói gì ạ? Mà sao thầy đeo kính đen giữa nhà thế?\n\nThầy bói (lúng túng): À... ta đeo kính để... nhìn thấu cõi âm cho rõ! Mắt thường làm sao thấy được ma quỷ!\n\nVợ thầy bói (từ trong nhà chạy ra): Ông ơi, ông có thấy chìa khóa tủ đâu không? Tiền lễ của khách hôm qua em cất đâu mất rồi!\n\nThầy bói (đỏ mặt): Bà... bà vào nhà đi! Đang có khách!\n\nVợ thầy bói: Khách khứa gì! Ông xem bói cho người ta mà chìa khóa nhà mình còn không tìm ra, tiền để đâu cũng quên! Thiên văn địa lí cái nỗi gì!\n\nKhách (đứng dậy, nói với khán giả): Hóa ra thầy bói trên thông thiên văn, dưới tường địa lí... mà trong nhà mình có cái chìa khóa cũng không tường! Thôi, tôi xin phép về tự... bói cho mình vậy!\n\nThầy bói (với theo): Ấy, anh đừng đi! Ta... ta xem miễn phí cho! Chỉ cần anh đừng kể chuyện này với ai!\n\nKhách: Thầy yên tâm, tôi sẽ kể... cho cả làng nghe để mọi người cùng... cảnh giác ạ!\n\nCâu 2. Thầy bói đòi khách làm lễ bao nhiêu tiền để hóa giải vận hạn?", "options": ["A. Năm trăm nghìn", "B. Năm triệu — càng to càng linh", "C. Miễn phí", "D. Một triệu"], "answer": "B", "explain": "Thầy bói nói: \"chỉ cần... một cái lễ thật to! Càng to càng linh! Ít nhất... năm triệu!\" — bộc lộ bản chất lừa đảo, moi tiền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHẦY BÓI BA HOA\n(Trích vở hài kịch — cảnh tại nhà thầy bói)\n\nThầy bói (đeo kính xplain": "Qua nhân vật thầy bói ba hoa, tác giả phê phán nạn mê tín dị đoan và những kẻ hành nghề bói toán lừa đảo — đồng thời nhắc nhở mọi người hãy tỉnh táo, đừng nhẹ dạ.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHẦY BÓI BA HOA\n(Trích vở hài kịch — cảnh tại nhà thầy bói)\n\nThầy bói (đeo kính đen, gõ gậy, giọng bí hiểm): Ta đây trên thông thiên văn, dưới tường địa lí! Số mệnh con người ta nhìn qua là biết!\n\nKhách (rón rén): Dạ, thầy xem giúp con đường công danh ạ.\n\nThầy bói (sờ tay khách, gật gù): Ừm... đường công danh của anh... gập ghềnh lắm! Có kẻ tiểu nhân hãm hại! Nhưng đừng lo, ta có cách hóa giải — chỉ cần... một cái lễ thật to!\n\nKhách: Dạ, lễ bao nhiêu ạ?\n\nThầy bói: Càng to càng linh! Ít nhất... năm triệu!\n\n(Bỗng có tiếng trẻ con khóc ngoài sân. Thầy bói giật mình, vội tháo kính đen lau nước mắt.)\n\nThầy bói (nói thầm): Khổ quá, con mình ốm mà mình không biết chữa, lại đi... xem bói cho người ta!\n\nKhách (ngạc nhiên): Thầy vừa nói gì ạ? Mà sao thầy đeo kính đen giữa nhà thế?\n\nThầy bói (lúng túng): À... ta đeo kính để... nhìn thấu cõi âm cho rõ! Mắt thường làm sao thấy được ma quỷ!\n\nVợ thầy bói (từ trong nhà chạy ra): Ông ơi, ông có thấy chìa khóa tủ đâu không? Tiền lễ của khách hôm qua em cất đâu mất rồi!\n\nThầy bói (đỏ mặt): Bà... bà vào nhà đi! Đang có khách!\n\nVợ thầy bói: Khách khứa gì! Ông xem bói cho người ta mà chìa khóa nhà mình còn không tìm ra, tiền để đâu cũng quên! Thiên văn địa lí cái nỗi gì!\n\nKhách (đứng dậy, nói với khán giả): Hóa ra thầy bói trên thông thiên văn, dưới tường địa lí... mà trong nhà mình có cái chìa khóa cũng không tường! Thôi, tôi xin phép về tự... bói cho mình vậy!\n\nThầy bói (với theo): Ấy, anh đừng đi! Ta... ta xem miễn phí cho! Chỉ cần anh đừng kể chuyện này với ai!\n\nKhách: Thầy yên tâm, tôi sẽ kể... cho cả làng nghe để mọi người cùng... cảnh giác ạ!\n\nCâu 5. Qua trích đoạn, em rút ra bài học gì về cách ứng xử trước các hiện tượng mê tín? (Trả lời ngắn gọn)", "answer": "Tỉnh táo, không mê tín dị đoan, không tin kẻ lừa đảo", "explain": "Chấp nhận các cách diễn đạt tương đương: tin vào khoa học; đừng nhẹ dạ đưa tiền cho thầy bói; tự mình quyết định số phận...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về tác hại của mê tín dị đoan.", "explain": "DÀN Ý:\n1. Mở đoạn: mê tín dị đoan là tin vào những điều hoang đường, phản khoa học.\n2. Thân đoạn: (a) Tác hại: tốn tiền của (lễ lạt, xem bói); ảnh hưởng sức khỏe (chữa bệnh bằng cúng bái); bị kẻ xấu lừa đảo như thầy bói trong trích đoạn; (b) Làm trì trệ xã hội, cản trở tiến bộ; (c) Phê phán những kẻ lợi dụng mê tín trục lợi.\n3. Kết đoạn: hãy sống theo khoa học.\n\nBÀI MẪU:\nMê tín dị đoan là việc tin vào những điều hoang đường, phản khoa học như bói toán, cúng bái giải hạn, và nó gây ra nhiều tác hại nghiêm trọng. Trước hết, mê tín làm tốn kém tiền của: nhiều gia đình bỏ hàng chục, hàng trăm triệu đồng cho các lễ cúng giải hạn mà không mang lại kết quả gì. Nguy hiểm hơn, có người tin thầy cúng hơn thầy thuốc, chữa bệnh bằng bùa ngải thay vì đến bệnh viện, để rồi tiền mất tật mang, thậm chí mất mạng. Mê tín còn là mảnh đất màu mỡ cho những kẻ lừa đảo như thầy bói ba hoa trong trích đoạn — tự xưng trên thông thiên văn để moi tiền của người nhẹ dạ. Ở tầm vĩ mô, mê tín dị đoan làm trì trệ sự phát triển của xã hội, cản trở tiến bộ khoa học kĩ thuật. Đáng lên án là những kẻ cố tình tuyên truyền mê tín để trục lợi trên sự u mê của người khác. Trong thời đại khoa học phát triển, mỗi chúng ta, nhất là tuổi trẻ, cần tỉnh táo: tin vào khoa học, tin vào sự nỗ lực của bản thân thay vì trông chờ vào những điều hoang đường. Hãy là người tiêu dùng thông thái của thông tin và giữ cho tâm hồn mình sáng suốt.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích nhân vật thầy bói trong trích đoạn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu trích đoạn hài kịch và nhân vật thầy bói — điển hình cho kẻ lừa đảo đội lốt thần thánh.\nII. Thân bài:\n1. Chân dung: đeo kính đen, gõ gậy, giọng bí hiểm — tạo vẻ thần thánh giả tạo.\n2. Bản chất lừa đảo:\n   a. Tự xưng trên thông thiên văn, dưới tường địa lí.\n   b. Dọa khách có tiểu nhân hãm hại để moi tiền làm lễ (năm triệu, càng to càng linh).\n   c. Ngụy biện vụng về khi bị hỏi về kính đen.\n3. Bị vạch trần: vợ vào tìm chìa khóa, tiền bạc — sự thật phơi bày trước mặt khách; từ kẻ bề trên thành kẻ lúng túng van xin.\n4. Nghệ thuật xây dựng nhân vật hài: đối lập (tự xưng — thực tế); tình huống trớ trêu; ngôn ngữ đối thoại dí dỏm, bộc lộ bản chất.\n5. Ý nghĩa phê phán: lên án kẻ lợi dụng mê tín lừa đảo; nhắc nhở sự tỉnh táo.\nIII. Kết bài: khẳng định giá trị phê phán; liên hệ đấu tranh với mê tín.\n\nĐOẠN MẪU (mở bài):\nTrong các loại nhân vật hài, kẻ lừa đảo đội lốt thần thánh là một điển hình quen thuộc mà mỗi lần xuất hiện đều mang lại tiếng cười sảng khoái cùng bài học sâu cay. Trích đoạn Thầy bói ba hoa đã xây dựng thành công nhân vật thầy bói — kẻ tự xưng trên thông thiên văn, dưới tường địa lí nhưng đến chìa khóa trong nhà mình cũng không tìm ra. Qua nhân vật này, tác giả vừa tạo nên tiếng cười hài hước vừa gửi gắm lời phê phán thấm thía đối với nạn mê tín dị đoan và những kẻ lợi dụng nó để trục lợi.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÔNG KEO KIỆT\n(Trích vở hài kịch — cảnh tại nhà ông Phú Hộ)\n\nÔng Phú Hộ (ngồi đếm tiền, miệng lẩm bẩm): Một, hai, ba... chín mươi chín, một trăm! Trời ơi, tiền của ta, yêu dấu của ta!\n\nNgười làm (chạy vào): Dạ bẩm ông, bà nhà sai con mời ông ra ăn cơm ạ!\n\nÔng Phú Hộ (giật mình, vội cất tiền): Ăn cơm? Hôm nay nhà mình ăn gì?\n\nNgười làm: Dạ, bà nấu canh rau muống với cá kho ạ.\n\nÔng Phú Hộ (nhăn mặt): Cá kho? Tốn kém quá! Bảo bà từ mai chỉ nấu rau muống luộc thôi! Cá để... ngắm cho vui!\n\nNgười làm: Dạ... nhưng bẩm ông, nhà ta giàu nhất vùng mà...\n\nÔng Phú Hộ: Giàu thì giàu, nhưng phải tiết kiệm! Ngươi có biết không, mỗi bữa bớt một con cá, một năm ta tiết kiệm được... (lẩm bẩm tính) ...ba trăm sáu mươi lăm con cá! Bán đi được bao nhiêu tiền!\n\n(Khách đến chơi. Ông Phú Hộ vội vàng giấu ấm trà.)\n\nÔng Phú Hộ (niềm nở giả tạo): Quý hóa quá! Mời anh ngồi chơi! Nhà tôi... hết trà rồi, anh uống nước lã tạm nhé! Nước lã mát lắm, tốt cho sức khỏe!\n\nKhách (ngạc nhiên): Nhà anh giàu thế mà hết trà?\n\nÔng Phú Hộ: Trà đắt lắm anh ơi! Uống nước lã vừa mát vừa... tiết kiệm! Người xưa dạy: tiết kiệm là quốc sách mà!\n\n(Khách về. Ông Phú Hộ lôi ấm trà ra, tự rót cho mình một chén, nhấp một ngụm, lim dim.)\n\nÔng Phú Hộ (tự đắc): Trà ngon thế này mà cho khách uống thì phí! Mình ta thưởng thức là đủ!\n\nBà Phú Hộ (từ trong bước ra, lắc đầu nói với khán giả): Chồng tôi đấy — giàu nứt đố đổ vách mà đến chén trà cũng tiếc với khách! Keo kiệt đến mức... tiền nhiều để làm gì không biết!\n\nÔng Phú Hộ (nghe thấy, cãi): Bà thì biết gì! Ta tiết kiệm là để... để dành cho con cháu! Mai này chúng nó sẽ cảm ơn ta!\n\nBà Phú Hộ: Để dành? Ông giữ tiền như giữ... mạng sống! Sống keo kiệt thế này, con cháu nó cười cho!\n\nÔng Phú Hộ (ôm khư khư túi tiền): Cười thì cười, tiền vẫn là của ta! Của ta! Ha ha ha!\n\nCâu 1. Tính cách nổi bật của ông Phú Hộ là gì?", "options": ["A. Hào phóng, rộng rãi", "B. Keo kiệt đến mức lố bịch: giàu nứt đố đổ vách mà tiếc từng con cá, chén trà", "C. Thông minh, tài giỏi", "D. Hiền lành, chất phác"], "answer": "B", "explain": "Mọi hành động của ông đều bộc lộ sự keo kiệt: bớt cá trong bữa ăn, giấu trà không mời khách, ôm tiền như giữ mạng sống — keo kiệt đến mức trở thành lố bịch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÔNG KEO KIỆT\n(Trích vở hài kịch — cảnh tại nhà ông Phú Hộ)\n\nÔng Phú Hộ (ngồi đếm tiền, miệng lẩm bẩm): Một, hai, ba... chín mươi chín, một trăm! Trời ơi, tiền của ta, yêu dấu của ta!\n\nNgười làm (chạy vào): Dạ bẩm ông, bà nhà sai con mời ông ra ăn cơm ạ!\n\nÔng Phú Hộ (giật mình, vội cất tiền): Ăn cơm? Hôm nay nhà mình ăn gì?\n\nNgười làm: Dạ, bà nấu canh rau muống với cá kho ạ.\n\nÔng Phú Hộ (nhăn mặt): Cá kho? Tốn kém quá! Bảo bà từ mai chỉ nấu rau muống luộc thôi! Cá để... ngắm cho vui!\n\nNgười làm: Dạ... nhưng bẩm ông, nhà ta giàu nhất vùng mà...\n\nÔng Phú Hộ: Giàu thì giàu, nhưng phải tiết kiệm! Ngươi có biết không, mỗi bữa bớt một con cá, một năm ta tiết kiệm được... (lẩm bẩm tính) ...ba trăm sáu mươi lăm con cá! Bán đi được bao nhiêu tiền!\n\n(Khách đến chơi. Ông Phú Hộ vội vàng giấu ấm trà.)\n\nÔng Phú Hộ (niềm nở giả tạo): Quý hóa quá! Mời anh ngồi chơi! Nhà tôi... hết trà rồi, anh uống nước lã tạm nhé! Nước lã mát lắm, tốt cho sức khỏe!\n\nKhách (ngạc nhiên): Nhà anh giàu thế mà hết trà?\n\nÔng Phú Hộ: Trà đắt lắm anh ơi! Uống nước lã vừa mát vừa... tiết kiệm! Người xưa dạy: tiết kiệm là quốc sách mà!\n\n(Khách về. Ông Phú Hộ lôi ấm trà ra, tự rót cho mình một chén, nhấp một ngụm, lim dim.)\n\nÔng Phú Hộ (tự đắc): Trà ngon thế này mà cho khách uống thì phí! Mình ta thưởng thức là đủ!\n\nBà Phú Hộ (từ trong bước ra, lắc đầu nói với khán giả): Chồng tôi đấy — giàu nứt đố đổ vách mà đến chén trà cũng tiếc với khách! Keo kiệt đến mức... tiền nhiều để làm gì không biết!\n\nÔng Phú Hộ (nghe thấy, cãi): Bà thì biết gì! Ta tiết kiệm là để... để dành cho con cháu! Mai này chúng nó sẽ cảm ơn ta!\n\nBà Phú Hộ: Để dành? Ông giữ tiền như giữ... mạng sống! Sống keo kiệt thế này, con cháu nó cười cho!\n\nÔng Phú Hộ (ôm khư khư túi tiền): Cười thì cười, tiền vẫn là của ta! Của ta! Ha ha ha!\n\nCâu 2. Ông Phú Hộ đối xử với khách đến chơi như thế nào?", "options": ["A. Niềm nở mời trà ngon", "B. Giấu ấm trà, mời khách uống nước lã với lí do tốt cho sức khỏe", "C. Mời cơm thịnh soạn", "D. Tặng quà cho khách"], "answer": "B", "explain": "Chi tiết gây cười điển hình: ông vội giấu ấm trà khi khách đến, mời uống nước lã và ngụy biện \"tốt cho sức khỏe\" — sự keo kiệt được che đậy vụng về.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÔNG KEO KIỆT\n(Trích vở hài kịch — cảnh tại nhà ông Phú Hộ)\n\nÔng Phú Hộ (ngồi đếm tiền, miệng lẩm bẩm): Một, hai, ba... chín mươi chín, một trăm! Trời ơi, tiền của ta, yêu dấu của ta!\n\nNgười làm (chạy vào): Dạ bẩm ông, bà nhà sai con mời ông ra ăn cơm ạ!\n\nÔng Phú Hộ (giật mình, vội cất tiền): Ăn cơm? Hôm nay nhà mình ăn gì?\n\nNgười làm: Dạ, bà nấu canh rau muống với cá kho ạ.\n\nÔng Phú Hộ (nhăn mặt): Cá kho? Tốn kém quá! Bảo bà từ mai chỉ nấu rau muống luộc thôi! Cá để... ngắm cho vui!\n\nNgười làm: Dạ... nhưng bẩm ông, nhà ta giàu nhất vùng mà...\n\nÔng Phú Hộ: Giàu thì giàu, nhưng phải tiết kiệm! Ngươi có biết không, mỗi bữa bớt một con cá, một năm ta tiết kiệm được... (lẩm bẩm tính) ...ba trăm sáu mươi lăm con cá! Bán đi được bao nhiêu tiền!\n\n(Khách đến chơi. Ông Phú Hộ vội vàng giấu ấm trà.)\n\nÔng Phú Hộ (niềm nở giả tạo): Quý hóa quá! Mời anh ngồi chơi! Nhà tôi... hết trà rồi, anh uống nước lã tạm nhé! Nước lã mát lắm, tốt cho sức khỏe!\n\nKhách (ngạc nhiên): Nhà anh giàu thế mà hết trà?\n\nÔng Phú Hộ: Trà đắt lắm anh ơi! Uống nước lã vừa mát vừa... tiết kiệm! Người xưa dạy: tiết kiệm là quốc sách mà!\n\n(Khách về. Ông Phú Hộ lôi ấm trà ra, tự rót cho mình một chén, nhấp một ngụm, lim dim.)\n\nÔng Phú Hộ (tự đắc): Trà ngon thế này mà cho khách uống thì phí! Mình ta thưởng thức là đủ!\n\nBà Phú Hộ (từ trong bước ra, lắc đầu nói với khán giả): Chồng tôi đấy — giàu nứt đố đổ vách mà đến chén trà cũng tiếc với khách! Keo kiệt đến mức... tiền nhiều để làm gì không biết!\n\nÔng Phú Hộ (nghe thấy, cãi): Bà thì biết gì! Ta tiết kiệm là để... để dành cho con cháu! Mai này chúng nó sẽ cảm ơn ta!\n\nBà Phú Hộ: Để dành? Ông giữ tiền như giữ... mạng sống! Sống keo kiệt thế này, con cháu nó cười cho!\n\nÔng Phú Hộ (ôm khư khư túi tiền): Cười thì cười, tiền vẫn là của ta! Của ta! Ha ha ha!\n\nCâu 3. Lời ngụy biện tiết kiệm là quốc sách của ông Phú Hộ có tác dụng gì?", "options": ["A. Chứng tỏ ông yêu nước", "B. Phơi bày sự đạo đức giả: lấy danh nghĩa đạo lí để che đậy thói keo kiệt — gây cười châm biếm", "C. Khuyên mọi người tiết kiệm", "D. Không có tác dụng"], "answer": "B", "explain": "Ông mượn lời dạy tiết kiệm — một đạo lí tốt đẹp — để biện minh cho thói keo kiệt của mình; sự ngụy biện trơ trẽn này tạo nên tiếng cười châm biếm sâu cay.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÔNG KEO KIỆT\n(Trích vở hài kịch — cảnh tại nhà ông Phú Hộ)\n\nÔng Phú Hộ (ngồi đếm tiền, miệng lẩm bẩm): Một, hai, ba... chín mươi chín, một trăm! Trời ơi, tiền của ta, yêu dấu của ta!\n\nNgười làm (chạy vào): Dạ bẩm ông, bà nhà sai con mời ông ra ăn cơm ạ!\n\nÔng Phú Hộ (giật mình, vội cất tiền): Ăn cơm? Hôm nay nhà mình ăn gì?\n\nNgười làm: Dạ, bà nấu canh rau muống với cá kho ạ.\n\nÔng Phú Hộ (nhăn mặt): Cá kho? Tốn kém quá! Bảo bà từ mai chỉ nấu rau muống luộc thôi! Cá để... ngắm cho vui!\n\nNgười làm: Dạ... nhưng bẩm ông, nhà ta giàu nhất vùng mà...\n\nÔng Phú Hộ: Giàu thì giàu, nhưng phải tiết kiệm! Ngươi có biết không, mỗi bữa bớt một con cá, một năm ta tiết kiệm được... (lẩm bẩm tính) ...ba trăm sáu mươi lăm con cá! Bán đi được bao nhiêu tiền!\n\n(Khách đến chơi. Ông Phú Hộ vội vàng giấu ấm trà.)\n\nÔng Phú Hộ (niềm nở giả tạo): Quý hóa quá! Mời anh ngồi chơi! Nhà tôi... hết trà rồi, anh uống nước lã tạm nhé! Nước lã mát lắm, tốt cho sức khỏe!\n\nKhách (ngạc nhiên): Nhà anh giàu thế mà hết trà?\n\nÔng Phú Hộ: Trà đắt lắm anh ơi! Uống nước lã vừa mát vừa... tiết kiệm! Người xưa dạy: tiết kiệm là quốc sách mà!\n\n(Khách về. Ông Phú Hộ lôi ấm trà ra, tự rót cho mình một chén, nhấp một ngụm, lim dim.)\n\nÔng Phú Hộ (tự đắc): Trà ngon thế này mà cho khách uống thì phí! Mình ta thưởng thức là đủ!\n\nBà Phú Hộ (từ trong bước ra, lắc đầu nói với khán giả): Chồng tôi đấy — giàu nứt đố đổ vách mà đến chén trà cũng tiếc với khách! Keo kiệt đến mức... tiền nhiều để làm gì không biết!\n\nÔng Phú Hộ (nghe thấy, cãi): Bà thì biết gì! Ta tiết kiệm là để... để dành cho con cháu! Mai này chúng nó sẽ cảm ơn ta!\n\nBà Phú Hộ: Để dành? Ông giữ tiền như giữ... mạng sống! Sống keo kiệt thế này, con cháu nó cười cho!\n\nÔng Phú Hộ (ôm khư khư túi tiền): Cười thì cười, tiền vẫn là của ta! Của ta! Ha ha ha!\n\nCâu 4. Trích đoạn phê phán thói xấu nào?", "options": ["A. Thói lười biếng", "B. Thói keo kiệt, bủn xỉn: coi tiền hơn tình người, sống keo kiệt dù giàu có", "C. Thói khoe khoang", "D. Thói nóng nảy"], "answer": "B", "explain": "Qua nhân vật ông Phú Hộ, tác giả phê phán thói keo kiệt: giàu mà không dám sống, coi tiền hơn tình nghĩa — một thói xấu đáng chê cười trong đời sống.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÔNG KEO KIỆT\n(Trích vở hài kịch — cảnh tại nhà ông Phú Hộ)\n\nÔng Phú Hộ (ngồi đếm tiền, miệng lẩm bẩm): Một, hai, ba... chín mươi chín, một trăm! Trời ơi, tiền của ta, yêu dấu của ta!\n\nNgười làm (chạy vào): Dạ bẩm ông, bà nhà sai con mời ông ra ăn cơm ạ!\n\nÔng Phú Hộ (giật mình, vội cất tiền): Ăn cơm? Hôm nay nhà mình ăn gì?\n\nNgười làm: Dạ, bà nấu canh rau muống với cá kho ạ.\n\nÔng Phú Hộ (nhăn mặt): Cá kho? Tốn kém quá! Bảo bà từ mai chỉ nấu rau muống luộc thôi! Cá để... ngắm cho vui!\n\nNgười làm: Dạ... nhưng bẩm ông, nhà ta giàu nhất vùng mà...\n\nÔng Phú Hộ: Giàu thì giàu, nhưng phải tiết kiệm! Ngươi có biết không, mỗi bữa bớt một con cá, một năm ta tiết kiệm được... (lẩm bẩm tính) ...ba trăm sáu mươi lăm con cá! Bán đi được bao nhiêu tiền!\n\n(Khách đến chơi. Ông Phú Hộ vội vàng giấu ấm trà.)\n\nÔng Phú Hộ (niềm nở giả tạo): Quý hóa quá! Mời anh ngồi chơi! Nhà tôi... hết trà rồi, anh uống nước lã tạm nhé! Nước lã mát lắm, tốt cho sức khỏe!\n\nKhách (ngạc nhiên): Nhà anh giàu thế mà hết trà?\n\nÔng Phú Hộ: Trà đắt lắm anh ơi! Uống nước lã vừa mát vừa... tiết kiệm! Người xưa dạy: tiết kiệm là quốc sách mà!\n\n(Khách về. Ông Phú Hộ lôi ấm trà ra, tự rót cho mình một chén, nhấp một ngụm, lim dim.)\n\nÔng Phú Hộ (tự đắc): Trà ngon thế này mà cho khách uống thì phí! Mình ta thưởng thức là đủ!\n\nBà Phú Hộ (từ trong bước ra, lắc đầu nói với khán giả): Chồng tôi đấy — giàu nứt đố đổ vách mà đến chén trà cũng tiếc với khách! Keo kiệt đến mức... tiền nhiều để làm gì không biết!\n\nÔng Phú Hộ (nghe thấy, cãi): Bà thì biết gì! Ta tiết kiệm là để... để dành cho con cháu! Mai này chúng nó sẽ cảm ơn ta!\n\nBà Phú Hộ: Để dành? Ông giữ tiền như giữ... mạng sống! Sống keo kiệt thế này, con cháu nó cười cho!\n\nÔng Phú Hộ (ôm khư khư túi tiền): Cười thì cười, tiền vẫn là của ta! Của ta! Ha ha ha!\n\nCâu 5. Theo em, tiết kiệm đúng cách khác với keo kiệt như thế nào? (Trả lời ngắn gọn)", "answer": "Tiết kiệm là dùng hợp lí, còn keo kiệt là bủn xỉn quá mức, coi tiền hơn tình nghĩa", "explain": "Chấp nhận các cách diễn đạt tương đương: tiết kiệm đáng quý nhưng keo kiệt đáng chê; tiết kiệm là không lãng phí, keo kiệt là không dám chi tiêu cần thiết...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của việc tiết kiệm trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: tiết kiệm là đức tính quý báu.\n2. Thân đoạn: (a) Ý nghĩa: tránh lãng phí, tích lũy cho tương lai, bảo vệ tài nguyên; (b) Tiết kiệm đúng cách: chi tiêu hợp lí, không hoang phí nhưng cũng không bủn xỉn như ông Phú Hộ; (c) Phê phán thói hoang phí và cả thói keo kiệt.\n3. Kết đoạn: hãy tiết kiệm một cách thông minh.\n\nBÀI MẪU:\nTiết kiệm là một đức tính quý báu, có ý nghĩa to lớn trong cuộc sống mỗi người và của cả xã hội. Tiết kiệm giúp ta tránh lãng phí tiền của, thời gian và tài nguyên; tích lũy được nguồn lực dự phòng cho tương lai và những lúc khó khăn. Ở tầm vĩ mô, tiết kiệm tài nguyên, năng lượng còn góp phần bảo vệ môi trường, phát triển bền vững. Tuy nhiên, cần phân biệt tiết kiệm đúng cách với thói keo kiệt như ông Phú Hộ trong trích đoạn: tiết kiệm là chi tiêu hợp lí — không hoang phí vào những thứ vô bổ nhưng vẫn dám chi cho những điều cần thiết, vẫn rộng rãi với người thân, bạn bè; còn keo kiệt là bủn xỉn quá mức, coi tiền hơn tình nghĩa, giàu mà không dám sống. Đáng phê phán cả hai thái cực: kẻ hoang phí vung tay quá trán và kẻ keo kiệt ôm tiền mà khổ. Tiết kiệm thông minh là biết cân đối giữa hôm nay và ngày mai, giữa bản thân và mọi người. Mỗi chúng ta, nhất là tuổi trẻ, hãy rèn luyện thói quen tiết kiệm từ những việc nhỏ: tắt điện khi không dùng, không mua sắm lãng phí, quản lí tiền bạc hợp lí — để tiền bạc phục vụ cuộc sống tốt đẹp hơn.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích nhân vật ông Phú Hộ trong trích đoạn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu trích đoạn hài kịch và nhân vật ông Phú Hộ — điển hình của thói keo kiệt.\nII. Thân bài:\n1. Biểu hiện của thói keo kiệt:\n   a. Với bản thân và gia đình: bớt cá trong bữa ăn, tính toán từng con cá.\n   b. Với khách: giấu trà, mời nước lã.\n   c. Với tiền bạc: ôm khư khư, đếm đi đếm lại, coi như mạng sống.\n2. Sự ngụy biện: mượn danh tiết kiệm là quốc sách, để dành cho con cháu — đạo đức giả.\n3. Nghệ thuật xây dựng nhân vật hài:\n   a. Phóng đại thói keo kiệt đến mức lố bịch.\n   b. Đối thoại bộc lộ bản chất (tự đắc, cãi cùn).\n   c. Lời bình của bà Phú Hộ (người ngoài cuộc) tăng tính khách quan, gây cười.\n4. Ý nghĩa phê phán: lên án thói keo kiệt, coi tiền hơn tình người.\nIII. Kết bài: khẳng định giá trị; bài học về cách sống — đừng để tiền bạc làm chủ con người.\n\nĐOẠN MẪU (mở bài):\nTrong các thói hư tật xấu của con người, keo kiệt là một trong những đối tượng quen thuộc nhất của tiếng cười hài kịch — từ Harpagon của Mô-li-e đến bao nhân vật trong văn học dân gian. Trích đoạn Ông keo kiệt tiếp tục khai thác đề tài này qua nhân vật ông Phú Hộ: giàu nứt đố đổ vách mà tiếc từng con cá, chén trà. Bằng nghệ thuật phóng đại và đối thoại dí dỏm, tác giả đã tạo nên một nhân vật hài điển hình, mang lại tiếng cười sảng khoái cùng bài học sâu sắc về cách ứng xử với tiền bạc.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKẺ KHOÁC LÁC\n(Trích vở hài kịch — cảnh tại quán nước đầu làng)\n\nTèo (vỗ ngực, giọng oang oang): Các bác có biết không, hôm qua tôi một mình đánh nhau với... ba thằng cướp! Chúng nó dao kiếm sáng loáng mà tôi chỉ cần... lườm một cái là chúng nó chạy mất dép!\n\nBác Hai (tròn mắt): Thật không? Ghê vậy!\n\nTèo (càng hứng): Thật chứ! Tôi mà ra tay thì... thôi rồi! Hồi còn đi học, tôi là vô địch võ thuật của trường! Thầy dạy võ còn phải... học lại tôi!\n\nCô Ba (bán nước, cười mỉm): Ủa, hôm trước tôi thấy cậu bị con chó nhà ông Tư rượt chạy... té cả xuống ao mà?\n\nTèo (đỏ mặt, chữa thẹn): À... hôm đó tôi... tôi nhường nó! Chó cắn người ta chứ ai lại đi đánh chó! Người quân tử không chấp!\n\nBác Hai: Thế còn chuyện cậu bảo cậu bơi qua sông như... rái cá?\n\nTèo: Đúng! Tôi bơi giỏi lắm! Hôm nào các bác xem tôi biểu diễn!\n\n(Cô Ba hất hàm về phía con sông. Mọi người nhìn theo: có đứa trẻ đang chới với giữa dòng.)\n\nĐứa trẻ (kêu cứu): Cứu... cứu với!\n\nTèo (tái mặt, lùi lại): Ấy... hôm nay tôi... tôi bị chuột rút! Bác Hai bơi giỏi, bác cứu nó đi!\n\nBác Hai (nhảy xuống sông cứu đứa trẻ lên, quay lại nhìn Tèo): Vô địch bơi lội đâu rồi? Sao không trổ tài?\n\nTèo (lí nhí): Tôi... tôi hôm nay không được khỏe...\n\nCô Ba (nói với khán giả): Đấy, vô địch võ thuật thì sợ chó, kiện tướng bơi lội thì sợ nước! Kẻ khoác lác đến lúc cần thể hiện thì... lặn mất tăm!\n\nTèo (vẫn cố vớt vát): Các bác không tin tôi à? Thôi được, để hôm khác tôi... kể tiếp chuyện tôi đánh cướp cho nghe! Chuyện hôm qua tôi mới kể có một nửa!\n\nMọi người (đồng thanh): Thôi thôi, xin cậu! Kể nữa là... sông cạn mất!\n\nCâu 1. Tèo tự khoe những tài năng nào?", "options": ["A. Đánh nhau với ba tên cướp, vô địch võ thuật, bơi giỏi như rái cá", "B. Học giỏi, hát hay", "C. Nấu ăn ngon, may vá khéo", "D. Chạy nhanh, nhảy cao"], "answer": "A", "explain": "Tèo khoác lác đủ thứ: một mình đánh ba tên cướp, vô địch võ thuật trường, bơi như rái cá — càng khoe càng lố bịch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKẺ KHOÁC LÁC\n(Trích vở hài kịch — cảnh tại quán nước đầu làng)\n\nTèo (vỗ ngực, giọng oang oang): Các bác có biết không, hôm qua tôi một mình đánh nhau với... ba thằng cướp! Chúng nó dao kiếm sáng loáng mà tôi chỉ cần... lườm một cái là chúng nó chạy mất dép!\n\nBác Hai (tròn mắt): Thật không? Ghê vậy!\n\nTèo (càng hứng): Thật chứ! Tôi mà ra tay thì... thôi rồi! Hồi còn đi học, tôi là vô địch võ thuật của trường! Thầy dạy võ còn phải... học lại tôi!\n\nCô Ba (bán nước, cười mỉm): Ủa, hôm trước tôi thấy cậu bị con chó nhà ông Tư rượt chạy... té cả xuống ao mà?\n\nTèo (đỏ mặt, chữa thẹn): À... hôm đó tôi... tôi nhường nó! Chó cắn người ta chứ ai lại đi đánh chó! Người quân tử không chấp!\n\nBác Hai: Thế còn chuyện cậu bảo cậu bơi qua sông như... rái cá?\n\nTèo: Đúng! Tôi bơi giỏi lắm! Hôm nào các bác xem tôi biểu diễn!\n\n(Cô Ba hất hàm về phía con sông. Mọi người nhìn theo: có đứa trẻ đang chới với giữa dòng.)\n\nĐứa trẻ (kêu cứu): Cứu... cứu với!\n\nTèo (tái mặt, lùi lại): Ấy... hôm nay tôi... tôi bị chuột rút! Bác Hai bơi giỏi, bác cứu nó đi!\n\nBác Hai (nhảy xuống sông cứu đứa trẻ lên, quay lại nhìn Tèo): Vô địch bơi lội đâu rồi? Sao không trổ tài?\n\nTèo (lí nhí): Tôi... tôi hôm nay không được khỏe...\n\nCô Ba (nói với khán giả): Đấy, vô địch võ thuật thì sợ chó, kiện tướng bơi lội thì sợ nước! Kẻ khoác lác đến lúc cần thể hiện thì... lặn mất tăm!\n\nTèo (vẫn cố vớt vát): Các bác không tin tôi à? Thôi được, để hôm khác tôi... kể tiếp chuyện tôi đánh cướp cho nghe! Chuyện hôm qua tôi mới lúc cần thể hiện thì... lặn mất tăm!\n\nTèo (vẫn cố vớt vát): Các bác không tin tôi à? Thôi được, để hôm khác tôi... kể tiếp chuyện tôi đánh cướp cho nghe! Chuyện hôm qua tôi mới kể có một nửa!\n\nMọi người (đồng thanh): Thôi thôi, xin cậu! Kể nữa là... sông cạn mất!\n\nCâu 3. Thủ pháp gây cười chính trong trích đoạn là gì?", "options": ["A. Phóng đại lời khoe khoang rồi để sự thật phũ phàng vạch trần — đối lập giữa lời nói và thực tế", "B. Nhại giọng", "C. Chơi chữ", "D. Hóa trang"], "answer": "A", "explain": "Tác giả để Tèo phóng đại lời khoe đến mức lố bịch, rồi dùng sự thật (sợ chó, sợ nước) để vạch trần — đối lập giữa khoác lác và thực tế tạo nên tiếng cười sảng khoái.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKẺ KHOÁC LÁC\n(Trích vở hài kịch — cảnh tại quán nước đầu làng)\n\nTèo (vỗ ngực, giọng oang oang): Các bác có biết không, hôm qua tôi một mình đánh nhau với... ba thằng cướp! Chúng nó dao kiếm sáng loáng mà tôi chỉ cần... lườm một cái là chúng nó chạy mất dép!\n\nBác Hai (tròn mắt): Thật không? Ghê vậy!\n\nTèo (càng hứng): Thật chứ! Tôi mà ra tay thì... thôi rồi! Hồi còn đi học, tôi là vô địch võ thuật của trường! Thầy dạy võ còn phải... học lại tôi!\n\nCô Ba (bán nước, cười mỉm): Ủa, hôm trước tôi thấy cậu bị con chó nhà ông Tư rượt chạy... té cả xuống ao mà?\n\nTèo (đỏ mặt, chữa thẹn): À... hôm đó tôi... tôi nhường nó! Chó cắn người ta chứ ai lại đi đánh chó! Người quân tử không chấp!\n\nBác Hai: Thế còn chuyện cậu bảo cậu bơi qua sông như... rái cá?\n\nTèo: Đúng! Tôi bơi giỏi lắm! Hôm nào các bác xem tôi biểu diễn!\n\n(Cô Ba hất hàm về phía con sông. Mọi người nhìn theo: có đứa trẻ đang chới với giữa dòng.)\n\nĐứa trẻ (kêu cứu): Cứu... cứu với!\n\nTèo (tái mặt, lùi lại): Ấy... hôm nay tôi... tôi bị chuột rút! Bác Hai bơi giỏi, bác cứu nó đi!\n\nBác Hai (nhảy xuống sông cứu đứa trẻ lên, quay lại nhìn Tèo): Vô địch bơi lội đâu rồi? Sao không trổ tài?\n\nTèo (lí nhí): Tôi... tôi hôm nay không được khỏe...\n\nCô Ba (nói với khán giả): Đấy, vô địch võ thuật thì sợ chó, kiện tướng bơi lội thì sợ nước! Kẻ khoác lác đến lúc cần thể hiện thì... lặn mất tăm!\n\nTèo (vẫn cố vớt vát): Các bác không tin tôi à? Thôi được, để hôm khác tôi... kể tiếp chuyện tôi đánh cướp cho nghe! Chuyện hôm qua tôi mới kể có một nửa!\n\nMọi người (đồng thanh): Thôi thôi, xin cậu! Kể nữa là... sông cạn mất!\n\nCâu 4. Trích đoạn phê phán thói xấu nào?", "options": ["A. Thói lười biếng", "B. Thói khoác lác, khoe khoang, nói không đi đôi với làm", "C. Thói nhút nhát", "D. Thói ăn cắp"], "answer": "B", "explain": "Qua nhân vật Tèo, tác giả phê phán thói khoác lác: thích khoe khoang những điều mình không có, nói một đằng làm một nẻo — thói xấu đáng chê cười.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKẺ KHOÁC LÁC\n(Trích vở hài kịch — cảnh tại quán nước đầu làng)\n\nTèo (vỗ ngực, giọng oang oang): Các bác có biết không, hôm qua tôi một mình đánh nhau với... ba thằng cướp! Chúng nó dao kiếm sáng loáng mà tôi chỉ cần... lườm một cái là chúng nó chạy mất dép!\n\nBác Hai (tròn mắt): Thật không? Ghê vậy!\n\nTèo (càng hứng): Thật chứ! Tôi mà ra tay thì... thôi rồi! Hồi còn đi học, tôi là vô địch võ thuật của trường! Thầy dạy võ còn phải... học lại tôi!\n\nCô Ba (bán nước, cười mỉm): Ủa, hôm trước tôi thấy cậu bị con chó nhà ông Tư rượt chạy... té cả xuống ao mà?\n\nTèo (đỏ mặt, chữa thẹn): À... hôm đó tôi... tôi nhường nó! Chó cắn người ta chứ ai lại đi đánh chó! Người quân tử không chấp!\n\nBác Hai: Thế còn chuyện cậu bảo cậu bơi qua sông như... rái cá?\n\nTèo: Đúng! Tôi bơi giỏi lắm! Hôm nào các bác xem tôi biểu diễn!\n\n(Cô Ba hất hàm về phía con sông. Mọi người nhìn theo: có đứa trẻ đang chới với giữa dòng.)\n\nĐứa trẻ (kêu cứu): Cứu... cứu với!\n\nTèo (tái mặt, lùi lại): Ấy... hôm nay tôi... tôi bị chuột rút! Bác Hai bơi giỏi, bác cứu nó đi!\n\nBác Hai (nhảy xuống sông cứu đứa trẻ lên, quay lại nhìn Tèo): Vô địch bơi lội đâu rồi? Sao không trổ tài?\n\nTèo (lí nhí): Tôi... tôi hôm nay không được khỏe...\n\nCô Ba (nói với khán giả): Đấy, vô địch võ thuật thì sợ chó, kiện tướng bơi lội thì sợ nước! Kẻ khoác lác đến lúc cần thể hiện thì... lặn mất tăm!\n\nTèo (vẫn cố vớt vát): Các bác không tin tôi à? Thôi được, để hôm khác tôi... kể tiếp chuyện tôi đánh cướp cho nghe! Chuyện hôm qua tôi mới kể có một nửa!\n\nMọi người (đồng thanh): Thôi thôi, xin cậu! Kể nữa là... sông cạn mất!\n\nCâu 5. Qua trích đoạn, em rút ra bài học gì về cách thể hiện bản thân? (Trả lời ngắn gọn)", "answer": "Sống thật với mình, khiêm tốn, nói đi đôi với làm", "explain": "Chấp nhận các cách diễn đạt tương đương: đừng khoác lác, khoe khoang; hãy khiêm tốn; muốn được nể trọng phải bằng tài năng thật...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về đức tính khiêm tốn.", "explain": "DÀN Ý:\n1. Mở đoạn: khiêm tốn là đức tính quý báu.\n2. Thân đoạn: (a) Biểu hiện: không khoe khoang, biết mình biết người, ham học hỏi như trái với Tèo khoác lác; (b) Ý nghĩa: được mọi người yêu mến, tin tưởng; càng khiêm tốn càng tiến bộ; (c) Phê phán thói khoe khoang, tự cao tự đại.\n3. Kết đoạn: hãy rèn luyện khiêm tốn.\n\nBÀI MẪU:\nKhiêm tốn là một trong những đức tính quý báu nhất của con người. Người khiêm tốn không khoe khoang về tài năng của mình, luôn biết mình biết người, ham học hỏi và cầu tiến — trái ngược hoàn toàn với kẻ khoác lác như Tèo trong trích đoạn, khoe đủ thứ trên trời mà đến lúc cần thể hiện thì lặn mất tăm. Khiêm tốn mang lại nhiều giá trị: người khiêm tốn được mọi người yêu mến, tin tưởng; càng khiêm tốn càng dễ tiếp thu cái hay của người khác để tiến bộ không ngừng. Trong lịch sử, những bậc vĩ nhân đều rất khiêm tốn: Bác Hồ với lối sống giản dị, luôn học hỏi; các nhà khoa học lớn đều thừa nhận mình còn biết quá ít. Ngược lại, thói khoe khoang, tự cao tự đại chỉ khiến người ta trở thành trò cười cho thiên hạ như Tèo, và tự đóng cánh cửa tiến bộ của chính mình. Có câu: lúa chín cúi đầu — càng thành công càng phải khiêm tốn. Mỗi chúng ta hãy rèn luyện đức tính khiêm tốn từ những việc nhỏ: không khoe khoang, biết lắng nghe, dám nhận khuyết điểm. Khiêm tốn không phải là tự ti mà là sự tự tin một cách đúng mực, điềm đạm.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích nghệ thuật gây cười trong trích đoạn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu trích đoạn hài kịch và nghệ thuật gây cười đặc sắc.\nII. Thân bài:\n1. Xây dựng lời khoe phóng đại: đánh ba tên cướp, vô địch võ thuật, bơi như rái cá — càng khoe càng lố.\n2. Vạch trần bằng sự thật: sợ chó té xuống ao, sợ nước không dám cứu người — đối lập gây cười.\n3. Vai trò của các nhân vật phụ: cô Ba, bác Hai là người vạch trần, tăng tính khách quan và dí dỏm.\n4. Ngôn ngữ đối thoại: giọng khoác lác oang oang đối lập với giọng lí nhí khi bị vạch trần; lời bình của cô Ba dí dỏm, sâu cay.\n5. Ý nghĩa: tiếng cười vừa giải trí vừa phê phán thói khoác lác.\nIII. Kết bài: khẳng định tài năng của tác giả; bài học về sự khiêm tốn, trung thực.\n\nĐOẠN MẪU (mở bài):\nNghệ thuật gây cười trong hài kịch là cả một tài năng: làm sao để khán giả cười sảng khoái mà sau tiếng cười còn đọng lại suy ngẫm. Trích đoạn Kẻ khoác lác đã thành công trong việc này bằng một công thức kinh điển: để nhân vật phóng đại lời khoe đến mức lố bịch rồi dùng sự thật phũ phàng để vạch trần. Qua nhân vật Tèo, tác giả không chỉ mang lại tiếng cười mà còn gửi gắm lời phê phán sâu cay đối với thói khoác lác, khoe khoang.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBÀ MỐI MÁT TAY\n(Trích vở hài kịch — cảnh tại nhà bà mối)\n\nBà mối (phe phẩy quạt, giọng ngọt như mía lùi): Tôi làm mối đã ba mươi năm nay, mát tay nổi tiếng khắp vùng! Cặp nào qua tay tôi cũng... trăm năm hạnh phúc!\n\nAnh Tư (thật thà): Dạ, nghe danh bà đã lâu, nay con đến nhờ bà mối cho con một cô vợ ạ.\n\nBà mối: Được! Để ta xem... Anh muốn vợ thế nào?\n\nAnh Tư: Dạ, con chỉ cần cô nào hiền lành, chịu khó là được ạ.\n\nBà mối (vỗ đùi): Có ngay! Cô Út nhà ông Sáu — hiền như cục đất, đảm đang có tiếng! Mỗi tội... hơi nhiều tuổi một chút — mới có... bốn mươi lăm!\n\nAnh Tư (giật mình): Bốn mươi lăm? Con mới hai mươi lăm mà bà!\n\nBà mối (xua tay): Tuổi tác quan trọng gì! Vợ hơn tuổi, chồng càng... được nhờ! Người ta bảo: nhất gái hơn hai, nhì trai hơn một — đằng này hơn có... hai mươi tuổi, càng tốt!\n\nAnh Tư: Dạ thôi, bà mối cho con cô nào trẻ hơn một chút ạ.\n\nBà mối: Được! Cô Ba nhà ông Bảy — mới hai mươi, xinh như hoa! Mỗi tội... hơi đanh đá một chút, đã ba đời chồng!\n\nAnh Tư (hoảng): Ba đời chồng?!\n\nBà mối: Thì đã sao! Người ta bảo: tình cũ không rủ cũng đến — cô ấy có kinh nghiệm chăm chồng! Anh là trai tân, lấy vợ có kinh nghiệm là... nhất!\n\nAnh Tư (đứng dậy): Thôi, con xin phép về! Bà mối mát tay quá, con... sợ!\n\nBà mối (với theo): Ấy đừng về! Còn cô Năm nhà ông Chín — vừa trẻ, vừa chưa có chồng! Mỗi tội... hơi... khiếm thính một chút! Nhưng không sao, vợ điếc thì chồng nói gì cũng... gật đầu! Gia đình hòa thuận!\n\nAnh Tư (nói với khán giả): Bà mối mát tay thật đấy — mối nào cũng... mát lạnh cả người! Thôi, tôi ở giá cho lành!\n\nBà mối (lẩm bẩm một mình): Trai tân thời nay kén chọn quá! Ngày xưa ta mối cho bao cặp... (ngập ngừng) ...mà cặp nào cũng... quay lại cảm ơn ta — cảm ơn vì đã... cho họ bài học!\n\nCâu 1. Bà mối tự giới thiệu mình như thế nào?", "options": ["A. Mát tay nổi tiếng, cặp nào qua tay cũng trăm năm hạnh phúc", "B. Mới vào nghề", "C. Không có kinh nghiệm", "D. Chỉ mối cho người giàu"], "answer": "A", "explain": "Bà mối khoe: \"mát tay nổi tiếng khắp vùng! Cặp nào qua tay tôi cũng... trăm năm hạnh phúc!\" — lời tự quảng cáo đầy tự tin.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBÀ MỐI MÁT TAY\n(Trích vở hài kịch — cảnh tại nhà bà mối)\n\nBà mối (phe phẩy quạt, giọng ngọt như mía lùi): Tôi làm mối đã ba mươi năm nay, mát tay nổi tiếng khắp vùng! Cặp nào qua tay tôi cũng... trăm năm hạnh phúc!\n\nAnh Tư (thật thà): Dạ, nghe danh bà đã lâu, nay con đến nhờ bà mối cho con một cô vợ ạ.\n\nBà mối: Được! Để ta xem... Anh muốn vợ thế nào?\n\nAnh Tư: Dạ, con chỉ cần cô nào hiền lành, chịu khó là được ạ.\n\nBà mối (vỗ đùi): Có ngay! Cô Út nhà ông Sáu — hiền như cục đất, đảm đang có tiếng! Mỗi tội... hơi nhiều tuổi một chút — mới có... bốn mươi lăm!\n\nAnh Tư (giật mình): Bốn mươi lăm? Con mới hai mươi lăm mà bà!\n\nBà mối (xua tay): Tuổi tác quan trọng gì! Vợ hơn tuổi, chồng càng... được nhờ! Người ta bảo: nhất gái hơn hai, nhì trai hơn một — đằng này hơn có... hai mươi tuổi, càng tốt!\n\nAnh Tư: Dạ thôi, bà mối cho con cô nào trẻ hơn một chút ạ.\n\nBà mối: Được! Cô Ba nhà ông Bảy — mới hai mươi, xinh như hoa! Mỗi tội... hơi đanh đá một chút, đã ba đời chồng!\n\nAnh Tư (hoảng): Ba đời chồng?!\n\nBà mối: Thì đã sao! Người ta bảo: tình cũ không rủ cũng đến — cô ấy có kinh nghiệm chăm chồng! Anh là trai tân, lấy vợ có kinh nghiệm là... nhất!\n\nAnh Tư (đứng dậy): Thôi, con xin phép về! Bà mối mát tay quá, con... sợ!\n\nBà mối (với theo): Ấy đừng về! Còn cô Năm nhà ông Chín — vừa trẻ, vừa chưa có chồng! Mỗi tội... hơi... khiếm thính một chút! Nhưng không sao, vợ điếc thì chồng nói gì cũng... gật đầu! Gia đình hòa thuận!\n\nAnh Tư (nói với khán giả): Bà mối mát tay thật đấy — mối nào cũng... mát lạnh cả người! Thôi, tôi ở giá cho lành!\n\nBà mối (lẩm bẩm một mình): Trai tân thời nay kén chọn quá! Ngày xưa ta mối cho bao cặp... (ngập ngừng) ...mà cặp nào cũng... quay lại cảm ơn ta — cảm ơn vì đã... cho họ bài học!\n\nCâu 2. Những cô gái bà mối giới thiệu cho anh Tư có đặc điểm gì?", "options": ["A. Đều hoàn hảo", "B. Mỗi người đều có khuyết điểm lớn: cô Út 45 tuổi, cô Ba ba đời chồng, cô Năm khiếm thính", "C. Đều xinh đẹp, giỏi giang", "D. Đều là tiểu thư"], "answer": "B", "explain": "Ba ứng viên đều có vấn đề: cô Út hơn anh Tư 20 tuổi, cô Ba đã ba đời chồng, cô Năm khiếm thính — trái ngược với lời quảng cáo mát tay.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBÀ MỐI MÁT TAY\n(Trích vở hài kịch — cảnh tại nhà bà mối)\n\nBà mối (phe phẩy quạt, giọng ngọt như mía lùi): Tôi làm mối đã ba mươi năm nay, mát tay nổi tiếng khắp vùng! Cặp nào qua tay tôi cũng... trăm năm hạnh phúc!\n\nAnh Tư (thật thà): Dạ, nghe danh bà đã lâu, nay con đến nhờ bà mối cho con một cô vợ ạ.\n\nBà mối: Được! Để ta xem... Anh muốn vợ thế nào?\n\nAnh Tư: Dạ, con chỉ cần cô nào hiền lành, chịu khó là được ạ.\n\nBà mối (vỗ đùi): Có ngay! Cô Út nhà ông Sáu — hiền như cục đất, đảm đang có tiếng! Mỗi tội... hơi nhiều tuổi một chút — mới có... bốn mươi lăm!\n\nAnh Tư (giật mình): Bốn mươi lăm? Con mới hai mươi lăm mà bà!\n\nBà mối (xua tay): Tuổi tác quan trọng gì! Vợ hơn tuổi, chồng càng... được nhờ! Người ta bảo: nhất gái hơn hai, nhì trai hơn một — đằng này hơn có... hai mươi tuổi, càng tốt!\n\nAnh Tư: Dạ thôi, bà mối cho con cô nào trẻ hơn một chút ạ.\n\nBà mối: Được! Cô Ba nhà ông Bảy — mới hai mươi, xinh như hoa! Mỗi tội... hơi đanh đá một chút, đã ba đời chồng!\n\nAnh Tư (hoảng): Ba đời chồng?!\n\nBà mối: Thì đã sao! Người ta bảo: tình cũ không rủ cũng đến — cô ấy có kinh nghiệm chăm chồng! Anh là trai tân, lấy vợ có kinh nghiệm là... nhất!\n\nAnh Tư (đứng dậy): Thôi, con xin phép về! Bà mối mát tay quá, con... sợ!\n\nBà mối (với theo): Ấy đừng về! Còn cô Năm nhà ông Chín — vừa trẻ, vừa chưa có chồng! Mỗi tội... hơi... khiếm thính một chút! Nhưng không sao, vợ điếc thì chồng nói gì cũng... gật đầu! Gia đình hòa thuận!\n\nAnh Tư (nói với khán giả): Bà mối mát tay thật đấy — mối nào cũng... mát lạnh cả người! Thôi, tôi ở giá cho lành!\n\nBà mối (lẩm bẩm một mình): Trai tân thời nay kén chọn quá! Ngày xưa ta mối cho bao cặp... (ngập ngừng) ...mà cặp nào cũng... quay lại cảm ơn ta — cảm ơn vì đã... cho họ bài học!\n\nCâu 3. Thủ pháp gây cười chính trong trích đoạn là gì?", "options": ["A. Miêu tả ngoại hình", "B. Ngụy biện vụng về: biến khuyết điểm thành ưu điểm một cách trơ trẽn (vợ hơn 20 tuổi là được nhờ, vợ điếc thì gia đình hòa thuận)", "C. Chơi chữ", "D. Hát"], "answer": "B", "explain": "Bà mối ngụy biện một cách trơ trẽn: vợ hơn 20 tuổi thì chồng được nhờ, vợ có ba đời chồng là có kinh nghiệm, vợ điếc thì gia đình hòa thuận — sự ngụy biện vụng về tạo nên tiếng cười châm biếm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBÀ MỐI MÁT TAY\n(Trích vở hài kịch — cảnh tại nhà bà mối)\n\nBà mối (phe phẩy quạt, giọng ngọt như mía lùi): Tôi làm mối đã ba mươi năm nay, mát tay nổi tiếng khắp vùng! Cặp nào qua tay tôi cũng... trăm năm hạnh phúc!\n\nAnh Tư (thật thà): Dạ, nghe danh bà đã lâu, nay con đến nhờ bà mối cho con một cô vợ ạ.\n\nBà mối: Được! Để ta xem... Anh muốn vợ thế nào?\n\nAnh Tư: Dạ, con chỉ cần cô nào hiền lành, chịu khó là được ạ.\n\nBà mối (vỗ đùi): Có ngay! Cô Út nhà ông Sáu — hiền như cục đất, đảm đang có tiếng! Mỗi tội... hơi nhiều tuổi một chút — mới có... bốn mươi lăm!\n\nAnh Tư (giật mình): Bốn mươi lăm? Con mới hai mươi lăm mà bà!\n\nBà mối (xua tay): Tuổi tác quan trọng gì! Vợ hơn tuổi, chồng càng... được nhờ! Người ta bảo: nhất gái hơn hai, nhì trai hơn một — đằng này hơn có... hai mươi tuổi, càng tốt!\n\nAnh Tư: Dạ thôi, bà mối cho con cô nào trẻ hơn một chút ạ.\n\nBà mối: Được! Cô Ba nhà ông Bảy — mới hai mươi, xinh như hoa! Mỗi tội... hơi đanh đá một chút, đã ba đời chồng!\n\nAnh Tư (hoảng): Ba đời chồng?!\n\nBà mối: Thì đã sao! Người ta bảo: tình cũ không rủ cũng đến — cô ấy có kinh nghiệm chăm chồng! Anh là trai tân, lấy vợ có kinh nghiệm là... nhất!\n\nAnh Tư (đứng dậy): Thôi, con xin phép về! Bà mối mát tay quá, con... sợ!\n\nBà mối (với theo): Ấy đừng về! Còn cô Năm nhà ông Chín — vừa trẻ, vừa chưa có chồng! Mỗi tội... hơi... khiếm thính một chút! Nhưng không sao, vợ điếc thì chồng nói gì cũng... gật đầu! Gia đình hòa thuận!\n\nAnh Tư (nói với khán giả): Bà mối mát tay thật đấy — mối nào cũng... mát lạnh cả người! Thôi, tôi ở giá cho lành!\n\nBà mối (lẩm bẩm một mình): Trai tân thời nay kén chọn quá! Ngày xưa ta mối cho bao cặp... (ngập ngừng) ...mà cặp nào cũng... quay lại cảm ơn ta — cảm ơn vì đã... cho họ bài học!\n\nCâu 4. Câu nói cuối của bà mối hé lộ điều gì?", "options": ["A. Bà rất thành công", "B. Thực ra các cặp bà mối đều thất bại — họ quay lại cảm ơn vì đã cho bài học (ngụy biện chữa thẹn)", "C. Bà sắp nghỉ hưu", "D. Bà muốn mối cho anh Tư"], "answer": "B", "explain": "Lời thú nhận ngập ngừng: các cặp \"quay lại cảm ơn ta — cảm ơn vì đã... cho họ bài học\" — hé lộ sự thật bà mối mát tay chỉ là khoác lác, các cuộc hôn nhân đều thất bại; câu chữa thẹn càng gây cười.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBÀ MỐI MÁT TAY\n(Trích vở hài kịch — cảnh tại nhà bà mối)\n\nBà mối (phe phẩy quạt, giọng ngọt như mía lùi): Tôi làm mối đã ba mươi năm nay, mát tay nổi tiếng khắp vùng! Cặp nào qua tay tôi cũng... trăm năm hạnh phúc!\n\nAnh Tư (thật thà): Dạ, nghe danh bà đã lâu, nay con đến nhờ bà mối cho con một cô vợ ạ.\n\nBà mối: Được! Để ta xem... Anh muốn vợ thế nào?\n\nAnh Tư: Dạ, con chỉ cần cô nào hiền lành, chịu khó là được ạ.\n\nBà mối (vỗ đùi): Có ngay! Cô Út nhà ông Sáu — hiền như cục đất, đảm đang có tiếng! Mỗi tội... hơi nhiều tuổi một chút — mới có... bốn mươi lăm!\n\nAnh Tư (giật mình): Bốn mươi lăm? Con mới hai mươi lăm mà bà!\n\nBà mối (xua tay): Tuổi tác quan trọng gì! Vợ hơn tuổi, chồng càng... được nhờ! Người ta bảo: nhất gái hơn hai, nhì trai hơn một — đằng này hơn có... hai mươi tuổi, càng tốt!\n\nAnh Tư: Dạ thôi, bà mối cho con cô nào trẻ hơn một chút ạ.\n\nBà mối: Được! Cô Ba nhà ông Bảy — mới hai mươi, xinh như hoa! Mỗi tội... hơi đanh đá một chút, đã ba đời chồng!\n\nAnh Tư (hoảng): Ba đời chồng?!\n\nBà mối: Thì đã sao! Người ta bảo: tình cũ không rủ cũng đến — cô ấy có kinh nghiệm chăm chồng! Anh là trai tân, lấy vợ có kinh nghiệm là... nhất!\n\nAnh Tư (đứng dậy): Thôi, con xin phép về! Bà mối mát tay quá, con... sợ!\n\nBà mối (với theo): Ấy đừng về! Còn cô Năm nhà ông Chín — vừa trẻ, vừa chưa có chồng! Mỗi tội... hơi... khiếm thính một chút! Nhưng không sao, vợ điếc thì chồng nói gì cũng... gật đầu! Gia đình hòa thuận!\n\nAnh Tư (nói với khán giả): Bà mối mát tay thật đấy — mối nào cũng... mát lạnh cả người! Thôi, tôi ở giá cho lành!\n\nBà mối (lẩm bẩm một mình): Trai tân thời nay kén chọn quá! Ngày xưa ta mối cho bao cặp... (ngập ngừng) ...mà cặp nào cũng... quay lại cảm ơn ta — cảm ơn vì đã... cho họ bài học!\n\nCâu 5. Qua trích đoạn, em rút ra bài học gì? (Trả lời ngắn gọn)", "answer": "Đừng tin lời quảng cáo khoác lác; hãy trung thực, đừng ngụy biện", "explain": "Chấp nhận các cách diễn đạt tương đương: phê phán thói khoác lác, ngụy biện; làm nghề gì cũng cần có tâm, có tín...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về tác hại của thói khoác lác, thiếu trung thực trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: trung thực là nền tảng đạo đức; khoác lác gây hại.\n2. Thân đoạn: (a) Tác hại: mất niềm tin của mọi người như bà mối khoác lác; gây hậu quả cho người khác (mối lái sai lầm); (b) Kẻ khoác lác sớm bị vạch trần; (c) Phê phán thói quảng cáo sai sự thật, ngụy biện.\n3. Kết đoạn: hãy sống trung thực.\n\nBÀI MẪU:\nTrung thực là nền tảng đạo đức của con người, còn thói khoác lác, thiếu trung thực chỉ mang lại tác hại cho bản thân và mọi người. Kẻ khoác lác như bà mối trong trích đoạn — tự xưng mát tay nổi tiếng nhưng thực chất mối toàn những đám hỏng — sớm muộn cũng bị vạch trần và mất hết niềm tin của mọi người. Nguy hiểm hơn, sự thiếu trung thực còn gây hậu quả cho người khác: lời quảng cáo sai sự thật có thể khiến bao người tiền mất tật mang; sự ngụy biện trơ trẽn làm méo mó các giá trị đúng đắn. Trong kinh doanh, thói quảng cáo lố, treo đầu dê bán thịt chó không chỉ lừa dối khách hàng mà còn tự giết chết uy tín của chính mình. Trong cuộc sống, kẻ hay khoác lác, nói không đi đôi với làm sẽ bị mọi người xa lánh, khinh thường. Ngược lại, người trung thực, nói đúng làm đúng sẽ được tin yêu, quý trọng. Vì vậy, mỗi chúng ta hãy rèn luyện tính trung thực từ những việc nhỏ: không khoe khoang quá sự thật, không ngụy biện cho khuyết điểm, dám nhận sai để sửa chữa. Sống trung thực là cách để ta ngẩng cao đầu giữa cuộc đời.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích nghệ thuật ngụy biện gây cười trong trích đoạn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu trích đoạn hài kịch và nghệ thuật ngụy biện độc đáo tạo tiếng cười.\nII. Thân bài:\n1. Các màn ngụy biện của bà mối:\n   a. Cô Út 45 tuổi: vợ hơn tuổi thì chồng được nhờ.\n   b. Cô Ba ba đời chồng: có kinh nghiệm chăm chồng.\n   c. Cô Năm khiếm thính: vợ điếc thì gia đình hòa thuận.\n2. Nghệ thuật:\n   a. Biến khuyết điểm thành ưu điểm một cách trơ trẽn — càng ngụy biện càng lộ bản chất.\n   b. Ngôn ngữ đối thoại dí dỏm, giọng ngọt ngào đối lập với nội dung trơ trẽn.\n   c. Phản ứng của anh Tư (giật mình, hoảng, bỏ về) tăng hiệu quả gây cười.\n   d. Cái kết tự vạch trần (lời thú nhận ngập ngừng) — đỉnh cao của tiếng cười.\n3. Ý nghĩa phê phán: lên án thói khoác lác, làm ăn thiếu lương tâm; nhắc nhở sự tỉnh táo.\nIII. Kết bài: khẳng định tài năng của tác giả; bài học về sự trung thực.\n\nĐOẠN MẪU (mở bài):\nNgụy biện là một thủ pháp gây cười đặc sắc trong hài kịch: nhân vật càng cố biến cái sai thành đúng một cách trơ trẽn thì tiếng cười càng sảng khoái và sự phê phán càng sâu cay. Trích đoạn Bà mối mát tay là một minh chứng tiêu biểu: bà mối với tài ngụy biện thượng thừa đã biến mọi khuyết điểm của các cô gái thành ưu điểm, khiến khán giả
