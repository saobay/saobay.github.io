ế này ắt là của... nhà giàu! Vì nhà nghèo làm gì có cỏ ngon cho trâu ăn!\n\nAnh nông dân (kêu oan): Bẩm quan, trâu béo là vì con chăm sóc kĩ ạ! Con có nhân chứng!\n\nQuan tòa (phất tay): Nhân chứng? Nhân chứng của nhà nghèo thì... không đáng tin! Ta chỉ tin vào... lí lẽ khoa học!\n\nÔng Bá (mừng rỡ, dúi vào tay lính một thỏi bạc, lính chuyển cho quan): Quan lớn anh minh! Quan lớn xử chí công vô tư!\n\nQuan tòa (cất vội thỏi bạc, ho một tiếng): E hèm! Sau khi xem xét kĩ lưỡng, ta tuyên bố: con trâu thuộc về... ông Bá! Vì... vì trâu béo là của nhà giàu! Lí lẽ rõ ràng, không thể chối cãi!\n\nAnh nông dân (khóc): Oan quá! Quan lớn ơi, con nuôi trâu từ bé...\n\nQuan tòa (quát): Im! Kêu oan là... chống đối phán quyết! Phạt thêm mười roi vì tội... làm mất thời gian của quan!\n\nÔng Bá (cúi đầu): Đội ơn quan lớn! Quan lớn thật là... công minh chính trực!\n\nQuan tòa (đắc ý nói với khán giả): Đấy, xử án phải có... lí lẽ khoa học như ta! Trâu béo là của nhà giàu — đơn giản, dễ hiểu, lại... có lợi cho cả quan lẫn... người thắng kiện!\n\nAnh nông dân (lầm bầm): Công minh thật đấy — công minh đến mức... trâu của ai béo thì... mất!\n\nCâu 5. Qua trích đoạn, em nghĩ gì về vai trò của công lí trong xã hội? (Trả lời ngắn gọn)", "answer": "Công lí phải được thực thi nghiêm minh, bảo vệ người ngay thẳng", "explain": "Chấp nhận các cách diễn đạt tương đương: phê phán quan tham, xử bậy; công lí bị bẻ cong gây bất công; cần đấu tranh cho công bằng...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của sự công bằng trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: công bằng là nền tảng của xã hội văn minh.\n2. Thân đoạn: (a) Ý nghĩa: bảo vệ người ngay thẳng, trừng trị kẻ sai trái; tạo niềm tin; (b) Tác hại của bất công như vụ xử kiện trong trích đoạn: người nghèo bị oan, xã hội mất niềm tin; (c) Phê phán tham nhũng, xử bậy.\n3. Kết đoạn: mỗi người hãy đấu tranh cho công bằng.\n\nBÀI MẪU:\nCông bằng là một trong những giá trị nền tảng của xã hội văn minh, là thước đo đạo đức của con người và thể chế. Khi công bằng được thực thi nghiêm minh, người ngay thẳng được bảo vệ, kẻ sai trái bị trừng trị, mọi người đều yên tâm lao động, cống hiến — xã hội vì thế mà ổn định, phát triển. Ngược lại, như vụ xử kiện trong trích đoạn, khi kẻ cầm cân nảy mực bẻ cong công lí vì tiền, người nông dân nghèo mất trâu oan lại còn bị phạt roi — bất công ấy không chỉ gây đau khổ cho cá nhân mà còn làm xói mòn niềm tin của nhân dân vào pháp luật. Một xã hội mà công lí bị mua bán thì cái ác sẽ lộng hành, cái thiện bị vùi dập. Vì vậy, đấu tranh cho công bằng là trách nhiệm của mỗi công dân: dám lên tiếng trước bất công, không tiếp tay cho tham nhũng, sống và làm việc theo pháp luật. Mỗi chúng ta hãy bắt đầu từ những việc nhỏ: công bằng trong thi cử, trong đánh giá, trong đối xử với mọi người — để công bằng trở thành nếp sống, thành nền tảng vững chắc của xã hội.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích tiếng cười trào phúng trong trích đoạn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu trích đoạn và tiếng cười trào phúng vừa hài hước vừa đắng cay.\nII. Thân bài:\n1. Tình huống gây cười: vụ kiện trâu được xử bằng lí lẽ trâu béo là của nhà giàu — ngụy biện nực cười.\n2. Thủ pháp:\n   a. Ngụy biện trắng trợn dưới danh nghĩa khoa học, công minh.\n   b. Đối lập: miệng nói chí công vô tư, tay nhận hối lộ.\n   c. Phóng đại sự trơ trẽn (phạt người kêu oan thêm mười roi).\n3. Nhân vật quan tòa: điển hình cho kẻ cầm quyền thối nát, tham lam, trơ trẽn.\n4. Ý nghĩa: tiếng cười ở đây là cười ra nước mắt — vừa gây cười vừa phơi bày bất công, nỗi khổ của người nghèo; giá trị phê phán xã hội sâu sắc.\nIII. Kết bài: khẳng định giá trị của tiếng cười trào phúng; liên hệ đấu tranh chống tham nhũng, bảo vệ công lí.\n\nĐOẠN MẪU (mở bài):\nCó những tiếng cười khiến ta sảng khoái, lại có những tiếng cười khiến ta đắng lòng — đó là tiếng cười trào phúng khi nó phơi bày những bất công trong xã hội. Trích đoạn Quan tòa công minh thuộc loại thứ hai: ta cười trước sự ngụy biện trơ trẽn của quan tòa, nhưng sau tiếng cười là vị đắng khi nghĩ về số phận của anh nông dân nghèo mất trâu oan. Phân tích tiếng cười trào phúng trong trích đoạn giúp ta thấy rõ giá trị phê phán sâu sắc của hài kịch.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHẦY LANG VƯỜN\n(Trích vở hài kịch — cảnh tại nhà thầy lang)\n\nThầy lang (vuốt râu, giọng trịnh trọng): Ta đây là thần y tái thế! Bệnh gì ta cũng chữa được! Người chết ta còn... hỏi thăm được!\n\nBệnh nhân (ôm bụng): Dạ, con đau bụng quá thầy ơi!\n\nThầy lang (bắt mạch, gật gù): Ừm... mạch của anh... chạy lung tung! Đây là bệnh... đau bụng! Cần uống thuốc ngay!\n\nBệnh nhân: Dạ, thuốc gì ạ?\n\nThầy lang (lấy ra một gói lá): Đây là thần dược gia truyền! Lá... ổi! Đau bụng uống lá ổi là khỏi! Mỗi tội... hơi đắng!\n\nBệnh nhân (ngạc nhiên): Lá ổi? Đơn giản vậy thôi ạ?\n\nThầy lang: Đơn giản mới là... thần dược! Phức tạp thì ai chẳng làm được! (nói nhỏ) Mà lá ổi vườn nhà ta nhiều lắm, không bán thì phí!\n\n(Một bà cụ được dìu vào, ho sù sụ.)\n\nBà cụ: Thầy ơi, tôi ho quá!\n\nThầy lang (không cần bắt mạch): Ho à? Dễ ợt! Uống... lá ổi! Lá ổi chữa được bách bệnh!\n\nBệnh nhân (thắc mắc): Bệnh gì thầy cũng cho uống lá ổi thế ạ?\n\nThầy lang (đắc ý): Đó gọi là... chuyên môn hóa! Một vị thuốc mà chữa được trăm bệnh — ta là thiên tài!\n\nBà cụ (uống xong, ho dữ dội hơn): Khụ... khụ... sao tôi thấy... nặng hơn hả thầy?\n\nThầy lang (vội nói): À, đó là... công thuốc! Thuốc đang đánh nhau với bệnh trong người bà! Càng ho nhiều càng... mau khỏi!\n\nBệnh nhân (nói với khán giả): Thần y tái thế thật đấy — bệnh gì cũng lá ổi, khỏi hay không thì... hên xui! Mà lá ổi vườn nhà thầy thì... bao la! Khám bệnh kiểu này, thầy giàu to!\n\nThầy lang (nghe thấy, cười hề hề): Anh nói đúng đấy! Ta giàu là nhờ... lá ổi! Các anh cứ ốm đau nhiều vào, ta mừng lắm! À quên... ta mong các anh... mau khỏi bệnh!\n\nCâu 1. Thần dược gia truyền của thầy lang là gì?", "options": ["A. Nhân sâm quý hiếm", "B. Lá ổi vườn nhà — bệnh gì cũng kê", "C. Thuốc tây đắt tiền", "D. Mật gấu"], "answer": "B", "explain": "Thầy lang kê lá ổi cho mọi bệnh: đau bụng uống lá ổi, ho cũng uống lá ổi — vì lá ổi vườn nhà nhiều, không bán thì phí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHẦY LANG VƯỜN\n(Trích vở hài kịch — cảnh tại nhà thầy lang)\n\nThầy lang (vuốt râu, giọng trịnh trọng): Ta đây là thần y tái thế! Bệnh gì ta cũng chữa được! Người chết ta còn... hỏi thăm được!\n\nBệnh nhân (ôm bụng): Dạ, con đau bụng quá thầy ơi!\n\nThầy lang (bắt mạch, gật gù): Ừm... mạch của anh... chạy lung tung! Đây là bệnh... đau bụng! Cần uống thuốc ngay!\n\nBệnh nhân: Dạ, thuốc gì ạ?\n\nThầy lang (lấy ra một gói lá): Đây là thần dược gia truyền! Lá... ổi! Đau bụng uống lá ổi là khỏi! Mỗi tội... hơi đắng!\n\nBệnh nhân (ngạc nhiên): Lá ổi? Đơn giản vậy thôi ạ?\n\nThầy lang: Đơn giản mới là... thần dược! Phức tạp thì ai chẳng làm được! (nói nhỏ) Mà lá ổi vườn nhà ta nhiều lắm, không bán thì phí!\n\n(Một bà cụ được dìu vào, ho sù sụ.)\n\nBà cụ: Thầy ơi, tôi ho quá!\n\nThầy lang (không cần bắt mạch): Ho à? Dễ ợt! Uống... lá ổi! Lá ổi chữa được bách bệnh!\n\nBệnh nhân (thắc mắc): Bệnh gì thầy cũng cho uống lá ổi thế ạ?\n\nThầy lang (đắc ý): Đó gọi là... chuyên môn hóa! Một vị thuốc mà chữa được trăm bệnh — ta là thiên tài!\n\nBà cụ (uống xong, ho dữ dội hơn): Khụ... khụ... sao tôi thấy... nặng hơn hả thầy?\n\nThầy lang (vội nói): À, đó là... công thuốc! Thuốc đang đánh nhau với bệnh trong người bà! Càng ho nhiều càng... mau khỏi!\n\nBệnh nhân (nói với khán giả): Thần y tái thế thật đấy — bệnh gì cũng lá ổi, khỏi hay không thì... hên xui! Mà lá ổi vườn nhà thầy thì... bao la! Khám bệnh kiểu này, thầy giàu to!\n\nThầy lang (nghe thấy, cười hề hề): Anh nói đúng đấy! Ta giàu là nhờ... lá ổi! Các anh cứ ốm đau nhiều vào, ta mừng lắm! À quên... ta mong các anh... mau khỏi bệnh!\n\nCâu 2. Thầy lang tự xưng mình là ai?", "options": ["A. Bác sĩ tốt nghiệp đại học y", "B. Thần y tái thế — bệnh gì cũng chữa được, người chết còn hỏi thăm được", "C. Y tá", "D. Dược sĩ"], "answer": "B", "explain": "Thầy tự xưng: \"Ta đây là thần y tái thế! Bệnh gì ta cũng chữa được! Người chết ta còn... hỏi thăm được!\" — khoác lác đến mức lố bịch.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHẦY LANG VƯỜN\n(Trích vở hài kịch — cảnh tại nhà thầy lang)\n\nThầy lang (vuốt râu, giọng trịnh trọng): Ta đây là thần y tái thế! Bệnh gì ta cũng chữa được! Người chết ta còn... hỏi thăm được!\n\nBệnh nhân (ôm bụng): Dạ, con đau bụng quá thầy ơi!\n\nThầy lang (bắt mạch, gật gù): Ừm... mạch của anh... chạy lung tung! Đây là bệnh... đau bụng! Cần uống thuốc ngay!\n\nBệnh nhân: Dạ, thuốc gì ạ?\n\nThầy lang (lấy ra một gói lá): Đây là thần dược gia truyền! Lá... ổi! Đau bụng uống lá ổi là khỏi! Mỗi tội... hơi đắng!\n\nBệnh nhân (ngạc nhiên): Lá ổi? Đơn giản vậy thôi ạ?\n\nThầy lang: Đơn giản mới là... thần dược! Phức tạp thì ai chẳng làm được! (nói nhỏ) Mà lá ổi vườn nhà ta nhiều lắm, không bán thì phí!\n\n(Một bà cụ được dìu vào, ho sù sụ.)\n\nBà cụ: Thầy ơi, tôi ho quá!\n\nThầy lang (không cần bắt mạch): Ho à? Dễ ợt! Uống... lá ổi! Lá ổi chữa được bách bệnh!\n\nBệnh nhân (thắc mắc): Bệnh gì thầy cũng cho uống lá ổi thế ạ?\n\nThầy lang (đắc ý): Đó gọi là... chuyên môn hóa! Một vị thuốc mà chữa được trăm bệnh — ta là thiên tài!\n\nBà cụ (uống xong, ho dữ dội hơn): Khụ... khụ... sao tôi thấy... nặng hơn hả thầy?\n\nThầy lang (vội nói): À, đó là... công thuốc! Thuốc đang đánh nhau với bệnh trong người bà! Càng ho nhiều càng... mau khỏi!\n\nBệnh nhân (nói với khán giả): Thần y tái thế thật đấy — bệnh gì cũng lá ổi, khỏi hay không thì... hên xui! Mà lá ổi vườn nhà thầy thì... bao la! Khám bệnh kiểu này, thầy giàu to!\n\nThầy lang (nghe thấy, cười hề hề): Anh nói đúng đấy! Ta giàu là nhờ... lá ổi! Các anh cứ ốm đau nhiều vào, ta mừng lắm! À quên... ta mong các anh... mau khỏi bệnh!\n\nCâu 3. Khi bà cụ uống thuốc ho nặng hơn, thầy lang giải thích thế nào?", "options": ["A. Nhận sai và đổi thuốc", "B. Ngụy biện đó là công thuốc — thuốc đang đánh nhau với bệnh, càng ho càng mau khỏi", "C. Đổ lỗi cho bà cụ", "D. Im lặng"], "answer": "B", "explain": "Sự ngụy biện trơ trẽn: biến tác dụng phụ thành công thuốc — phơi bày sự vô trách nhiệm và dốt nát của thầy lang dỏm, gây cười châm biếm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHẦY LANG VƯỜN\n(Trích vở hài kịch — cảnh tại nhà thầy lang)\n\nThầy lang (vuốt râu, giọng trịnh trọng): Ta đây là thần y tái thế! Bệnh gì ta cũng chữa được! Người chết ta còn... hỏi thăm được!\n\nBệnh nhân (ôm bụng): Dạ, con đau bụng quá thầy ơi!\n\nThầy lang (bắt mạch, gật gù): Ừm... mạch của anh... chạy lung tung! Đây là bệnh... đau bụng! Cần uống thuốc ngay!\n\nBệnh nhân: Dạ, thuốc gì ạ?\n\nThầy lang (lấy ra một gói lá): Đây là thần dược gia truyền! Lá... ổi! Đau bụng uống lá ổi là khỏi! Mỗi tội... hơi đắng!\n\nBệnh nhân (ngạc nhiên): Lá ổi? Đơn giản vậy thôi ạ?\n\nThầy lang: Đơn giản mới là... thần dược! Phức tạp thì ai chẳng làm được! (nói nhỏ) Mà lá ổi vườn nhà ta nhiều lắm, không bán thì phí!\n\n(Một bà cụ được dìu vào, ho sù sụ.)\n\nBà cụ: Thầy ơi, tôi ho quá!\n\nThầy lang (không cần bắt mạch): Ho à? Dễ ợt! Uống... lá ổi! Lá ổi chữa được bách bệnh!\n\nBệnh nhân (thắc mắc): Bệnh gì thầy cũng cho uống lá ổi thế ạ?\n\nThầy lang (đắc ý): Đó gọi là... chuyên môn hóa! Một vị thuốc mà chữa được trăm bệnh — ta là thiên tài!\n\nBà cụ (uống xong, ho dữ dội hơn): Khụ... khụ... sao tôi thấy... nặng hơn hả thầy?\n\nThầy lang (vội nói): À, đó là... công thuốc! Thuốc đang đánh nhau với bệnh trong người bà! Càng ho nhiều càng... mau khỏi!\n\nBệnh nhân (nói với khán giả): Thần y tái thế thật đấy — bệnh gì cũng lá ổi, khỏi hay không thì... hên xui! Mà lá ổi vườn nhà thầy thì... bao la! Khám bệnh kiểu này, thầy giàu to!\n\nThầy lang (nghe thấy, cười hề hề): Anh nói đúng đấy! Ta giàu là nhờ... lá ổi! Các anh cứ ốm đau nhiều vào, ta mừng lắm! À quên... ta mong các anh... mau khỏi bệnh!\n\nCâu 4. Trích đoạn phê phán hiện tượng nào?", "options": ["A. Nghề thầy thuốc", "B. Những kẻ hành nghề chữa bệnh thiếu chuyên môn, lừa đảo vì tiền — coi thường sức khỏe, tính mạng người bệnh", "C. Lá ổi", "D. Bệnh nhân"], "answer": "B", "explain": "Qua nhân vật thầy lang dỏm, tác giả phê phán những kẻ hành nghề y thiếu lương tâm, chuyên môn: chữa bệnh qua loa vì tiền, coi thường sức khỏe người bệnh — vấn đề nhức nhối trong đời sống.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTHẦY LANG VƯỜN\n(Trích vở hài kịch — cảnh tại nhà thầy lang)\n\nThầy lang (vuốt râu, giọng trịnh trọng): Ta đây là thần y tái thế! Bệnh gì ta cũng chữa được! Người chết ta còn... hỏi thăm được!\n\nBệnh nhân (ôm bụng): Dạ, con đau bụng quá thầy ơi!\n\nThầy lang (bắt mạch, gật gù): Ừm... mạch của anh... chạy lung tung! Đây là bệnh... đau bụng! Cần uống thuốc ngay!\n\nBệnh nhân: Dạ, thuốc gì ạ?\n\nThầy lang (lấy ra một gói lá): Đây là thần dược gia truyền! Lá... ổi! Đau bụng uống lá ổi là khỏi! Mỗi tội... hơi đắng!\n\nBệnh nhân (ngạc nhiên): Lá ổi? Đơn giản vậy thôi ạ?\n\nThầy lang: Đơn giản mới là... thần dược! Phức tạp thì ai chẳng làm được! (nói nhỏ) Mà lá ổi vườn nhà ta nhiều lắm, không bán thì phí!\n\n(Một bà cụ được dìu vào, ho sù sụ.)\n\nBà cụ: Thầy ơi, tôi ho quá!\n\nThầy lang (không cần bắt mạch): Ho à? Dễ ợt! Uống... lá ổi! Lá ổi chữa được bách bệnh!\n\nBệnh nhân (thắc mắc): Bệnh gì thầy cũng cho uống lá ổi thế ạ?\n\nThầy lang (đắc ý): Đó gọi là... chuyên môn hóa! Một vị thuốc mà chữa được trăm bệnh — ta là thiên tài!\n\nBà cụ (uống xong, ho dữ dội hơn): Khụ... khụ... sao tôi thấy... nặng hơn hả thầy?\n\nThầy lang (vội nói): À, đó là... công thuốc! Thuốc đang đánh nhau với bệnh trong người bà! Càng ho nhiều càng... mau khỏi!\n\nBệnh nhân (nói với khán giả): Thần y tái thế thật đấy — bệnh gì cũng lá ổi, khỏi hay không thì... hên xui! Mà lá ổi vườn nhà thầy thì... bao la! Khám bệnh kiểu này, thầy giàu to!\n\nThầy lang (nghe thấy, cười hề hề): Anh nói đúng đấy! Ta giàu là nhờ... lá ổi! Các anh cứ ốm đau nhiều vào, ta mừng lắm! À quên... ta mong các anh... mau khỏi bệnh!\n\nCâu 5. Qua trích đoạn, em rút ra bài học gì khi đi khám chữa bệnh? (Trả lời ngắn gọn)", "answer": "Chọn cơ sở y tế uy tín, không tin thầy lang dỏm, lang băm", "explain": "Chấp nhận các cách diễn đạt tương đương: tìm hiểu kĩ trước khi chữa bệnh; tin vào y học khoa học; cảnh giác với những kẻ khoác lác...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về y đức của người thầy thuốc.", "explain": "DÀN Ý:\n1. Mở đoạn: y đức là phẩm chất cao quý nhất của người thầy thuốc.\n2. Thân đoạn: (a) Biểu hiện: hết lòng vì người bệnh, không vụ lợi; lương y như từ mẫu; (b) Phê phán những thầy thuốc thiếu y đức như thầy lang trong trích đoạn: chữa bệnh qua loa vì tiền; (c) Hậu quả của thiếu y đức: hại sức khỏe, tính mạng người bệnh.\n3. Kết đoạn: đề cao y đức.\n\nBÀI MẪU:\nY đức — đạo đức của người thầy thuốc — là phẩm chất cao quý nhất, quan trọng hơn cả tài năng chuyên môn. Người thầy thuốc có y đức luôn đặt sức khỏe, tính mạng của người bệnh lên trên hết: tận tâm chữa trị, không vụ lợi, không phân biệt giàu nghèo — đúng như lời dạy lương y như từ mẫu. Trong thực tế, có biết bao tấm gương thầy thuốc hy sinh thầm lặng vì người bệnh, được nhân dân kính trọng, biết ơn. Ngược lại, những kẻ hành nghề y thiếu y đức như thầy lang trong trích đoạn — dốt nát mà khoác lác, chữa bệnh qua loa bằng lá ổi vườn nhà chỉ vì tiền — không chỉ lừa dối người bệnh mà còn trực tiếp đe dọa sức khỏe, tính mạng của họ. Thiếu y đức còn thể hiện ở việc vòi vĩnh phong bì, phân biệt đối xử với bệnh nhân nghèo, tắc trách trong chuyên môn. Hậu quả của những hành vi ấy là khôn lường: tiền mất tật mang, thậm chí mất mạng oan. Vì vậy, xã hội cần tôn vinh những thầy thuốc giàu y đức, đồng thời kiên quyết đấu tranh, xử lí nghiêm những kẻ vi phạm y đức, để nghề y mãi là nghề cao quý, đáng tin cậy.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Báo cáo nghiên cứu (theo kiểu bài viết của Bài 5 trong SGK): Trình bày kết quả tìm hiểu về thực trạng khám chữa bệnh bằng thuốc nam không rõ nguồn gốc ở địa phương em.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở đầu: lí do chọn đề tài (nhiều người tin dùng thuốc nam trôi nổi); mục đích, phạm vi tìm hiểu.\nII. Nội dung:\n1. Phương pháp: phỏng vấn người dân, tìm hiểu qua báo chí, quan sát các điểm bán thuốc.\n2. Kết quả:\n   a. Thực trạng: nhiều người dùng thuốc nam không rõ nguồn gốc vì tin lời quảng cáo, giá rẻ.\n   b. Nguyên nhân: thiếu hiểu biết, tâm lí đám đông, quảng cáo thổi phồng.\n   c. Hậu quả: tiền mất tật mang, có trường hợp ngộ độc, suy gan thận.\n3. Đánh giá: mặt tích cực của thuốc nam khi dùng đúng; mặt tiêu cực của việc lạm dụng, thiếu kiểm chứng.\nIII. Kết luận: đề xuất giải pháp — tuyên truyền, quản lí chặt chẽ, người dân tỉnh táo chọn cơ sở uy tín.\n\nĐOẠN MẪU (mở đầu):\nTrong những năm gần đây, việc sử dụng thuốc nam, thuốc đông y không rõ nguồn gốc để chữa bệnh đang diễn ra khá phổ biến ở nhiều địa phương, trong đó có nơi em sinh sống. Bên cạnh những bài thuốc hay được lưu truyền, cũng có không ít trường hợp tiền mất tật mang vì tin dùng những thứ thuốc trôi nổi, thiếu kiểm chứng — như nhân vật thầy lang dỏm trong trích đoạn hài kịch với thần dược lá ổi chữa bách bệnh. Để hiểu rõ thực trạng này, em đã tiến hành tìm hiểu qua phỏng vấn người dân, quan sát thực tế và thu thập thông tin từ báo chí. Báo cáo dưới đây trình bày kết quả tìm hiểu của em.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI HÙNG RƠM\n(Trích vở hài kịch — cảnh tại đình làng)\n\nTrưởng thôn (giọng trang trọng): Hôm nay, làng ta tuyên dương anh Hùng — người đã dũng cảm... đuổi trộm trong đêm!\n\nMọi người (vỗ tay): Hoan hô! Hoan hô người hùng!\n\nHùng (ưỡn ngực, giọng oang oang): Chuyện nhỏ! Đêm đó tôi đang ngủ thì nghe tiếng động ngoài sân. Tôi vùng dậy, tay không tấc sắt, lao ra... quát một tiếng: Đứng lại! Tên trộm sợ quá, vứt cả bao tải mà chạy!\n\nBà Tư (trầm trồ): Giỏi quá! Một mình mà dám đối mặt với trộm!\n\nHùng (càng hứng): Chứ sao! Tôi là ai? Tôi là Hùng! Hồi nhỏ tôi đã từng... đuổi cả đàn trâu điên! Trộm cắp là cái gì!\n\n(Đúng lúc đó, anh công an xã bước vào, tay dắt theo một cậu bé.)\n\nCông an xã: Xin lỗi đã làm gián đoạn! Tôi đến để... làm rõ vụ trộm đêm qua. Cậu bé này là người đã bắt được tên trộm — cậu ấy nấp trong đống rơm, thấy trộm vào liền... hô hoán ầm lên khiến trộm hoảng sợ bỏ chạy.\n\nHùng (tái mặt): Hả?\n\nCông an xã (nhìn Hùng): Còn anh Hùng... theo lời cậu bé kể, lúc đó anh đang... trùm chăn kín đầu, run cầm cập trong buồng!\n\nMọi người (ồ lên): Hóa ra...\n\nHùng (lắp bắp): Tôi... tôi... tôi run là vì... vì lạnh! Đêm đó gió to! Với lại... tôi đang... nghĩ kế! Đúng, tôi đang nghĩ kế sách vẹn toàn!\n\nCậu bé (ngây thơ): Nhưng cháu thấy chú run từ đầu đến chân, còn... tè cả ra quần ạ!\n\nMọi người (cười ồ): Ha ha ha!\n\nTrưởng thôn (lắc đầu): Thôi, tuyên dương nhầm người rồi! Người hùng thật sự là cậu bé này! Còn anh Hùng... (cười) ...là người hùng rơm!\n\nHùng (nói với khán giả, gãi đầu): Người ta bảo... im lặng là vàng! Từ nay tôi... ngậm miệng cho lành! Khoe khoang một chút mà... mất mặt cả làng!\n\nCâu 1. Hùng tự kể về chiến công của mình như thế nào?", "options": ["A. Khiêm tốn, không kể", "B. Khoác lác: tay không tấc sắt quát một tiếng khiến trộm vứt bao tải bỏ chạy; từng đuổi cả đàn trâu điên", "C. Nhờ công an giúp", "D. Cùng cậu bé bắt trộm"], "answer": "B", "explain": "Hùng khoác lác đủ điều: tay không đuổi trộm, từng đuổi cả đàn trâu điên — càng kể càng oai, hoàn toàn trái với sự thật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI HÙNG RƠM\n(Trích vở hài kịch — cảnh tại đình làng)\n\nTrưởng thôn (giọng trang trọng): Hôm nay, làng ta tuyên dương anh Hùng — người đã dũng cảm... đuổi trộm trong đêm!\n\nMọi người (vỗ tay): Hoan hô! Hoan hô người hùng!\n\nHùng (ưỡn ngực, giọng oang oang): Chuyện nhỏ! Đêm đó tôi đang ngủ thì nghe tiếng động ngoài sân. Tôi vùng dậy, tay không tấc sắt, lao ra... quát một tiếng: Đứng lại! Tên trộm sợ quá, vứt cả bao tải mà chạy!\n\nBà Tư (trầm trồ): Giỏi quá! Một mình mà dám đối mặt với trộm!\n\nHùng (càng hứng): Chứ sao! Tôi là ai? Tôi là Hùng! Hồi nhỏ tôi đã từng... đuổi cả đàn trâu điên! Trộm cắp là cái gì!\n\n(Đúng lúc đó, anh công an xã bước vào, tay dắt theo một cậu bé.)\n\nCông an xã: Xin lỗi đã làm gián đoạn! Tôi đến để... làm rõ vụ trộm đêm qua. Cậu bé này là người đã bắt được tên trộm — cậu ấy nấp trong đống rơm, thấy trộm vào liền... hô hoán ầm lên khiến trộm hoảng sợ bỏ chạy.\n\nHùng (tái mặt): Hả?\n\nCông an xã (nhìn Hùng): Còn anh Hùng... theo lời cậu bé kể, lúc đó anh đang... trùm chăn kín đầu, run cầm cập trong buồng!\n\nMọi người (ồ lên): Hóa ra...\n\nHùng (lắp bắp): Tôi... tôi... tôi run là vì... vì lạnh! Đêm đó gió to! Với lại... tôi đang... nghĩ kế! Đúng, tôi đang nghĩ kế sách vẹn toàn!\n\nCậu bé (ngây thơ): Nhưng cháu thấy chú run từ đầu đến chân, còn... tè cả ra quần ạ!\n\nMọi người (cười ồ): Ha ha ha!\n\nTrưởng thôn (lắc đầu): Thôi, tuyên dương nhầm người rồi! Người hùng thật sự là cậu bé này! Còn anh Hùng... (cười) ...là người hùng rơm!\n\nHùng (nói với khán giả, gãi đầu): Người ta bảo... im lặng là vàng! Từ nay tôi... ngậm miệng cho lành! Khoe khoang một chút mà... mất mặt cả làng!\n\nCâu 2. Sự thật về đêm xảy ra vụ trộm là gì?", "options": ["A. Hùng dũng cảm bắt trộm", "B. Cậu bé nấp trong đống rơm hô hoán làm trộm sợ chạy; còn Hùng trùm chăn run cầm cập trong buồng", "C. Không có vụ trộm nào", "D. Công an bắt được trộm"], "answer": "B", "explain": "Theo lời công an và cậu bé: người hùng thật sự là cậu bé nấp trong đống rơm hô hoán; Hùng thì trùm chăn run cầm cập — sự thật phũ phàng, gây cười.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI HÙNG RƠM\n(Trích vở hài kịch — cảnh tại đình làng)\n\nTrưởng thôn (giọng trang trọng): Hôm nay, làng ta tuyên dương anh Hùng — người đã dũng cảm... đuổi trộm trong đêm!\n\nMọi người (vỗ tay): Hoan hô! Hoan hô người hùng!\n\nHùng (ưỡn ngực, giọng oang oang): Chuyện nhỏ! Đêm đó tôi đang ngủ thì nghe tiếng động ngoài sân. Tôi vùng dậy, tay không tấc sắt, lao ra... quát một tiếng: Đứng lại! Tên trộm sợ quá, vứt cả bao tải mà chạy!\n\nBà Tư (trầm trồ): Giỏi quá! Một mình mà dám đối mặt với trộm!\n\nHùng (càng hứng): Chứ sao! Tôi là ai? Tôi là Hùng! Hồi nhỏ tôi đã từng... đuổi cả đàn trâu điên! Trộm cắp là cái gì!\n\n(Đúng lúc đó, anh công an xã bước vào, tay dắt theo một cậu bé.)\n\nCông an xã: Xin lỗi đã làm gián đoạn! Tôi đến để... làm rõ vụ trộm đêm qua. Cậu bé này là người đã bắt được tên trộm — cậu ấy nấp trong đống rơm, thấy trộm vào liền... hô hoán ầm lên khiến trộm hoảng sợ bỏ chạy.\n\nHùng (tái mặt): Hả?\n\nCông an xã (nhìn Hùng): Còn anh Hùng... theo lời cậu bé kể, lúc đó anh đang... trùm chăn kín đầu, run cầm cập trong buồng!\n\nMọi người (ồ lên): Hóa ra...\n\nHùng (lắp bắp): Tôi... tôi... tôi run là vì... vì lạnh! Đêm đó gió to! Với lại... tôi đang... nghĩ kế! Đúng, tôi đang nghĩ kế sách vẹn toàn!\n\nCậu bé (ngây thơ): Nhưng cháu thấy chú run từ đầu đến chân, còn... tè cả ra quần ạ!\n\nMọi người (cười ồ): Ha ha ha!\n\nTrưởng thôn (lắc đầu): Thôi, tuyên dương nhầm người rồi! Người hùng thật sự là cậu bé này! Còn anh Hùng... (cười) ...là người hùng rơm!\n\nHùng (nói với khán giả, gãi đầu): Người ta bảo... im lặng là vàng! Từ nay tôi... ngậm miệng cho lành! Khoe khoang một chút mà... mất mặt cả làng!\n\nCâu 3. Biệt danh người hùng rơm mà trưởng thôn đặt cho Hùng có ý nghĩa gì?", "options": ["A. Khen Hùng dũng cảm", "B. Châm biếm kẻ khoác lác: oai phong chỉ là rơm rạ — bên ngoài hùng hổ, bên trong hèn nhát", "C. Vì Hùng làm nghề đan rơm", "D. Vì Hùng ở trong đống rơm"], "answer": "B", "explain": "Người hùng rơm là cách chơi chữ châm biếm sâu cay: \"người hùng\" chỉ là vỏ bọc, \"rơm\" mới là bản chất — hèn nhát, rỗng tuếch; biệt danh này là đỉnh cao của tiếng cười trào phúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI HÙNG RƠM\n(Trích vở hài kịch — cảnh tại đình làng)\n\nTrưởng thôn (giọng trang trọng): Hôm nay, làng ta tuyên dương anh Hùng — người đã dũng cảm... đuổi trộm trong đêm!\n\nMọi người (vỗ tay): Hoan hô! Hoan hô người hùng!\n\nHùng (ưỡn ngực, giọng oang oang): Chuyện nhỏ! Đêm đó tôi đang ngủ thì nghe tiếng động ngoài sân. Tôi vùng dậy, tay không tấc sắt, lao ra... quát một tiếng: Đứng lại! Tên trộm sợ quá, vứt cả bao tải mà chạy!\n\nBà Tư (trầm trồ): Giỏi quá! Một mình mà dám đối mặt với trộm!\n\nHùng (càng hứng): Chứ sao! Tôi là ai? Tôi là Hùng! Hồi nhỏ tôi đã từng... đuổi cả đàn trâu điên! Trộm cắp là cái gì!\n\n(Đúng lúc đó, anh công an xã bước vào, tay dắt theo một cậu bé.)\n\nCông an xã: Xin lỗi đã làm gián đoạn! Tôi đến để... làm rõ vụ trộm đêm qua. Cậu bé này là người đã bắt được tên trộm — cậu ấy nấp trong đống rơm, thấy trộm vào liền... hô hoán ầm lên khiến trộm hoảng sợ bỏ chạy.\n\nHùng (tái mặt): Hả?\n\nCông an xã (nhìn Hùng): Còn anh Hùng... theo lời cậu bé kể, lúc đó anh đang... trùm chăn kín đầu, run cầm cập trong buồng!\n\nMọi người (ồ lên): Hóa ra...\n\nHùng (lắp bắp): Tôi... tôi... tôi run là vì... vì lạnh! Đêm đó gió to! Với lại... tôi đang... nghĩ kế! Đúng, tôi đang nghĩ kế sách vẹn toàn!\n\nCậu bé (ngây thơ): Nhưng cháu thấy chú run từ đầu đến chân, còn... tè cả ra quần ạ!\n\nMọi người (cười ồ): Ha ha ha!\n\nTrưởng thôn (lắc đầu): Thôi, tuyên dương nhầm người rồi! Người hùng thật sự là cậu bé này! Còn anh Hùng... (cười) ...là người hùng rơm!\n\nHùng (nói với khán giả, gãi đầu): Người ta bảo... im lặng là vàng! Từ nay tôi... ngậm miệng cho lành! Khoe khoang một chút mà... mất mặt cả làng!\n\nCâu 4. Trích đoạn phê phán thói xấu nào?", "options": ["A. Thói nhút nhát", "B. Thói khoác lác, nhận vơ công lao của người khác, hèn nhát mà thích làm anh hùng", "C. Thói lười biếng", "D. Thói trộm cắp"], "answer": "B", "explain": "Hùng không chỉ khoác lác mà còn nhận vơ công lao của cậu bé — thói xấu đáng chê cười: hèn nhát thật mà thích làm anh hùng giả.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI HÙNG RƠM\n(Trích vở hài kịch — cảnh tại đình làng)\n\nTrưởng thôn (giọng trang trọng): Hôm nay, làng ta tuyên dương anh Hùng — người đã dũng cảm... đuổi trộm trong đêm!\n\nMọi người (vỗ tay): Hoan hô! Hoan hô người hùng!\n\nHùng (ưỡn ngực, giọng oang oang): Chuyện nhỏ! Đêm đó tôi đang ngủ thì nghe tiếng động ngoài sân. Tôi vùng dậy, tay không tấc sắt, lao ra... quát một tiếng: Đứng lại! Tên trộm sợ quá, vứt cả bao tải mà chạy!\n\nBà Tư (trầm trồ): Giỏi quá! Một mình mà dám đối mặt với trộm!\n\nHùng (càng hứng): Chứ sao! Tôi là ai? Tôi là Hùng! Hồi nhỏ tôi đã từng... đuổi cả đàn trâu điên! Trộm cắp là cái gì!\n\n(Đúng lúc đó, anh công an xã bước vào, tay dắt theo một cậu bé.)\n\nCông an xã: Xin lỗi đã làm gián đoạn! Tôi đến để... làm rõ vụ trộm đêm qua. Cậu bé này là người đã bắt được tên trộm — cậu ấy nấp trong đống rơm, thấy trộm vào liền... hô hoán ầm lên khiến trộm hoảng sợ bỏ chạy.\n\nHùng (tái mặt): Hả?\n\nCông an xã (nhìn Hùng): Còn anh Hùng... theo lời cậu bé kể, lúc đó anh đang... trùm chăn kín đầu, run cầm cập trong buồng!\n\nMọi người (ồ lên): Hóa ra...\n\nHùng (lắp bắp): Tôi... tôi... tôi run là vì... vì lạnh! Đêm đó gió to! Với lại... tôi đang... nghĩ kế! Đúng, tôi đang nghĩ kế sách vẹn toàn!\n\nCậu bé (ngây thơ): Nhưng cháu thấy chú run từ đầu đến chân, còn... tè cả ra quần ạ!\n\nMọi người (cười ồ): Ha ha ha!\n\nTrưởng thôn (lắc đầu): Thôi, tuyên dương nhầm người rồi! Người hùng thật sự là cậu bé này! Còn anh Hùng... (cười) ...là người hùng rơm!\n\nHùng (nói với khán giả, gãi đầu): Người ta bảo... im lặng là vàng! Từ nay tôi... ngậm miệng cho lành! Khoe khoang một chút mà... mất mặt cả làng!\n\nCâu 5. Qua trích đoạn, em rút ra bài học gì? (Trả lời ngắn gọn)", "answer": "Sống trung thực, khiêm tốn; đừng khoác lác, nhận vơ công người khác", "explain": "Chấp nhận các cách diễn đạt tương đương: sự thật sớm muộn cũng bị phơi bày; muốn được nể trọng phải bằng việc làm thật...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về giá trị của sự trung thực.", "explain": "DÀN Ý:\n1. Mở đoạn: trung thực là phẩm chất quý giá, là nền tảng của niềm tin.\n2. Thân đoạn: (a) Biểu hiện: dám nói thật, nhận đúng công lao, không nhận vơ như Hùng; (b) Ý nghĩa: được mọi người tin yêu, tâm hồn thanh thản; (c) Phê phán thói dối trá, khoác lác, nhận vơ — sớm bị vạch trần như Hùng.\n3. Kết đoạn: hãy sống trung thực.\n\nBÀI MẪU:\nTrung thực là một trong những phẩm chất quý giá nhất của con người, là nền tảng tạo dựng niềm tin trong mọi mối quan hệ. Người trung thực dám nói thật, làm thật, nhận đúng về mình — không phóng đại, không nhận vơ công lao của người khác. Trái lại, kẻ dối trá như Hùng trong trích đoạn — hèn nhát mà khoác lác thành anh hùng, nhận vơ công lao của cậu bé — sớm muộn cũng bị sự thật vạch trần và trở thành trò cười cho thiên hạ. Trung thực mang lại những giá trị to lớn: người trung thực được mọi người tin yêu, quý trọng; tâm hồn luôn thanh thản vì không phải che giấu, lo sợ bị phát hiện. Trong học tập, trung thực thể hiện ở việc không quay cóp, gian lận; trong công việc, thể hiện ở sự ngay thẳng, không tham lam. Đáng phê phán là những kẻ dối trá, khoác lác, sống hai mặt — họ có thể lừa được một vài người trong chốc lát nhưng không thể lừa được tất cả mọi người mãi mãi. Vì vậy, mỗi chúng ta hãy rèn luyện tính trung thực từ những việc nhỏ nhất, để trở thành người đáng tin cậy và sống một cuộc đời thanh thản, có ý nghĩa.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích nghệ thuật xây dựng tình huống gây cười trong trích đoạn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu trích đoạn và tình huống gây cười đặc sắc.\nII. Thân bài:\n1. Tình huống: lễ tuyên dương người hùng — trang trọng, oai phong.\n2. Sự đảo ngược bất ngờ: công an xuất hiện, sự thật phơi bày — từ đỉnh cao danh vọng rơi xuống vực thẳm bẽ bàng.\n3. Nghệ thuật:\n   a. Đối lập giữa lời khoe (oai phong) và sự thật (trùm chăn run cầm cập).\n   b. Lời ngụy biện vụng về của Hùng (run vì lạnh, đang nghĩ kế) càng chữa càng lộ.\n   c. Lời nói ngây thơ của cậu bé (tè cả ra quần) — đòn quyết định, gây cười bùng nổ.\n   d. Biệt danh người hùng rơm — cái kết châm biếm hoàn hảo.\n4. Ý nghĩa: tiếng cười phê phán thói khoác lác, nhận vơ; đề cao sự trung thực, dũng cảm thật sự (cậu bé).\nIII. Kết bài: khẳng định tài năng của tác giả; bài học.\n\nĐOẠN MẪU (mở bài):\nTình huống là linh hồn của hài kịch: một tình huống được xây dựng khéo léo có thể khiến khán giả cười nghiêng ngả mà vẫn thấm thía bài học. Trích đoạn Người hùng rơm đã xây dựng một tình huống như thế: lễ tuyên dương người hùng trang trọng bỗng biến thành màn vạch trần kẻ khoác lác khi sự thật được phơi bày. Nghệ thuật xây dựng tình huống đảo ngược bất ngờ này không chỉ tạo nên tiếng cười sảng khoái mà còn gửi gắm lời phê phán sâu cay đối với thói khoác lác, nhận vơ.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÔNG CHỦ HÀO PHÓNG\n(Trích vở hài kịch — cảnh tại công ty)\n\nÔng chủ (đứng trước toàn thể nhân viên, giọng đầy cảm xúc): Các bạn thân mến! Tôi luôn coi các bạn như... anh em ruột thịt! Thành công của công ty là nhờ... mồ hôi nước mắt của các bạn! Tôi vô cùng... biết ơn!\n\nNhân viên (vỗ tay nhiệt liệt): Hoan hô sếp! Sếp tuyệt vời!\n\nÔng chủ (tiếp tục): Vì vậy, nhân dịp cuối năm, tôi quyết định... thưởng Tết cho các bạn thật hậu hĩnh! Mỗi người sẽ được... một tháng lương thứ mười ba!\n\nNhân viên (reo hò): Sếp muôn năm!\n\nKế toán (rón rén đến bên ông chủ, nói nhỏ): Dạ thưa sếp... công ty mình đang thua lỗ, tiền đâu mà thưởng ạ?\n\nÔng chủ (nói nhỏ lại, nghiến răng): Thì... thưởng bằng... hiện vật! Mỗi người một... gói mì tôm! Mì tôm cũng là... lương thực mà! Ăn mì tôm là... tiết kiệm, là... yêu nước!\n\nKế toán (ngập ngừng): Dạ...\n\nÔng chủ (quay ra, giọng sang sảng): Các bạn thân mến! Ngoài tháng lương thứ mười ba, tôi còn tặng mỗi bạn một... phần quà đặc biệt trị giá... tình cảm vô giá! Đó là... một gói mì tôm hảo hạng!\n\nNhân viên (ngơ ngác): Mì tôm ạ?\n\nÔng chủ: Đúng! Mì tôm! Các bạn đừng coi thường! Mì tôm là món ăn... quốc dân! Ăn mì tôm là... đồng cam cộng khổ với công ty! Ai không ăn mì tôm là... không yêu công ty!\n\nNhân viên A (nói thầm với B): Sếp hào phóng thật đấy — thưởng Tết bằng... mì tôm! Còn sếp thì... vừa tậu xe hơi mới!\n\nNhân viên B (thì thầm): Suỵt! Nói nhỏ thôi! Sếp nghe thấy là... cắt luôn gói mì tôm đấy!\n\nÔng chủ (nghe loáng thoáng): Các bạn nói gì thế? Có phải đang... cảm động đến rơi nước mắt không? Tôi hiểu mà! Lòng hào phóng của tôi... ai cũng cảm động!\n\nNhân viên (đồng thanh, giọng méo xệch): Dạ... chúng em... cảm động lắm ạ!\n\nÔng chủ (đắc ý nói với khán giả): Đấy, làm sếp phải biết... động viên nhân viên! Một gói mì tôm mà mua được... bao nhiêu nước mắt cảm động! Hào phóng như tôi, tìm đâu ra!\n\nCâu 1. Ông chủ hứa thưởng Tết cho nhân viên những gì lúc đầu?", "options": ["A. Một gói mì tôm", "B. Một tháng lương thứ mười ba thật hậu hĩnh", "C. Một chuyến du lịch", "D. Một chiếc xe hơi"], "answer": "B", "explain": "Ông chủ tuyên bố đầy cảm xúc: thưởng \"thật hậu hĩnh\", mỗi người \"một tháng lương thứ mười ba\" — lời hứa hoành tráng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÔNG CHỦ HÀO PHÓNG\n(Trích vở hài kịch — cảnh tại công ty)\n\nÔng chủ (đứng trước toàn thể nhân viên, giọng đầy cảm xúc): Các bạn thân mến! Tôi luôn coi các bạn như... anh em ruột thịt! Thành công của công ty là nhờ... mồ hôi nước mắt của các bạn! Tôi vô cùng... biết ơn!\n\nNhân viên (vỗ tay nhiệt liệt): Hoan hô sếp! Sếp tuyệt vời!\n\nÔng chủ (tiếp tục): Vì vậy, nhân dịp cuối năm, tôi quyết định... thưởng Tết cho các bạn thật hậu hĩnh! Mỗi người sẽ được... một tháng lương thứ mười ba!\n\nNhân viên (reo hò): Sếp muôn năm!\n\nKế toán (rón rén đến bên ông chủ, nói nhỏ): Dạ thưa sếp... công ty mình đang thua lỗ, tiền đâu mà thưởng ạ?\n\nÔng chủ (nói nhỏ lại, nghiến răng): Thì... thưởng bằng... hiện vật! Mỗi người một... gói mì tôm! Mì tôm cũng là... lương thực mà! Ăn mì tôm là... tiết kiệm, là... yêu nước!\n\nKế toán (ngập ngừng): Dạ...\n\nÔng chủ (quay ra, giọng sang sảng): Các bạn thân mến! Ngoài tháng lương thứ mười ba, tôi còn tặng mỗi bạn một... phần quà đặc biệt trị giá... tình cảm vô giá! Đó là... một gói mì tôm hảo hạng!\n\nNhân viên (ngơ ngác): Mì tôm ạ?\n\nÔng chủ: Đúng! Mì tôm! Các bạn đừng coi thường! Mì tôm là món ăn... quốc dân! Ăn mì tôm là... đồng cam cộng khổ với công ty! Ai không ăn mì tôm là... không yêu công ty!\n\nNhân viên A (nói thầm với B): Sếp hào phóng thật đấy — thưởng Tết bằng... mì tôm! Còn sếp thì... vừa tậu xe hơi mới!\n\nNhân viên B (thì thầm): Suỵt! Nói nhỏ thôi! Sếp nghe thấy là... cắt luôn gói mì tôm đấy!\n\nÔng chủ (nghe loáng thoáng): Các bạn nói gì thế? Có phải đang... cảm động đến rơi nước mắt không? Tôi hiểu mà! Lòng hào phóng của tôi... ai cũng cảm động!\n\nNhân viên (đồng thanh, giọng méo xệch): Dạ... chúng em... cảm động lắm ạ!\n\nÔng chủ (đắc ý nói với khán giả): Đấy, làm sếp phải biết... động viên nhân viên! Một gói mì tôm mà mua được... bao nhiêu nước mắt cảm động! Hào phóng như tôi, tìm đâu ra!\n\nCâu 2. Thực tế phần thưởng là gì?", "options": ["A. Một tháng lương", "B. Một gói mì tôm hảo hạng — trị giá tình cảm vô giá", "C. Một thùng mì tôm", "D. Không có gì"], "answer": "B", "explain": "Vì công ty thua lỗ, phần thưởng thực tế chỉ là một gói mì tôm — được ông chủ gọi mĩ miều là quà trị giá tình cảm vô giá.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÔNG CHỦ HÀO PHÓNG\n(Trích vở hài kịch — cảnh tại công ty)\n\nÔng chủ (đứng trước toàn thể nhân viên, giọng đầy cảm xúc): Các bạn thân mến! Tôi luôn coi các bạn như... anh em ruột thịt! Thành công của công ty là nhờ... mồ hôi nước mắt của các bạn! Tôi vô cùng... biết ơn!\n\nNhân viên (vỗ tay nhiệt liệt): Hoan hô sếp! Sếp tuyệt vời!\n\nÔng chủ (tiếp tục): Vì vậy, nhân dịp cuối năm, tôi quyết định... thưởng Tết cho các bạn thật hậu hĩnh! Mỗi người sẽ được... một tháng lương thứ mười ba!\n\nNhân viên (reo hò): Sếp muôn năm!\n\nKế toán (rón rén đến bên ông chủ, nói nhỏ): Dạ thưa sếp... công ty mình đang thua lỗ, tiền đâu mà thưởng ạ?\n\nÔng chủ (nói nhỏ lại, nghiến răng): Thì... thưởng bằng... hiện vật! Mỗi người một... gói mì tôm! Mì tôm cũng là... lương thực mà! Ăn mì tôm là... tiết kiệm, là... yêu nước!\n\nKế toán (ngập ngừng): Dạ...\n\nÔng chủ (quay ra, giọng sang sảng): Các bạn thân mến! Ngoài tháng lương thứ mười ba, tôi còn tặng mỗi bạn một... phần quà đặc biệt trị giá... tình cảm vô giá! Đó là... một gói mì tôm hảo hạng!\n\nNhân viên (ngơ ngác): Mì tôm ạ?\n\nÔng chủ: Đúng! Mì tôm! Các bạn đừng coi thường! Mì tôm là món ăn... quốc dân! Ăn mì tôm là... đồng cam cộng khổ với công ty! Ai không ăn mì tôm là... không yêu công ty!\n\nNhân viên A (nói thầm với B): Sếp hào phóng thật đấy — thưởng Tết bằng... mì tôm! Còn sếp thì... vừa tậu xe hơi mới!\n\nNhân viên B (thì thầm): Suỵt! Nói nhỏ thôi! Sếp nghe thấy là... cắt luôn gói mì tôm đấy!\n\nÔng chủ (nghe loáng thoáng): Các bạn nói gì thế? Có phải đang... cảm động đến rơi nước mắt không? Tôi hiểu mà! Lòng hào phóng của tôi... ai cũng cảm động!\n\nNhân viên (đồng thanh, giọng méo xệch): Dạ... chúng em... cảm động lắm ạ!\n\nÔng chủ (đắc ý nói với khán giả): Đấy, làm sếp phải biết... động viên nhân viên! Một gói mì tôm mà mua được... bao nhiêu nước mắt cảm động! Hào phóng như tôi, tìm đâu ra!\n\nCâu 3. Thủ pháp trào phúng chính trong trích đoạn là gì?", "options": ["A. Miêu tả ngoại hình", "B. Đối lập giữa lời hứa hoành tráng, đầy tình cảm và phần thưởng thực tế rẻ mạt — cùng sự ngụy biện trơ trẽn", "C. Hát", "D. Múa"], "answer": "B", "explain": "Tiếng cười đến từ đối lập: miệng nói coi nhân viên như anh em ruột thịt, thưởng hậu hĩnh — thực tế cho mỗi người một gói mì tôm; rồi ngụy biện ăn mì tôm là yêu nước, đồng cam cộng khổ — sự trơ trẽn tạo nên tiếng cười trào phúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÔNG CHỦ HÀO PHÓNG\n(Trích vở hài kịch — cảnh tại công ty)\n\nÔng chủ (đứng trước toàn thể nhân viên, giọng đầy cảm xúc): Các bạn thân mến! Tôi luôn coi các bạn như... anh em ruột thịt! Thành công của công ty là nhờ... mồ hôi nước mắt của các bạn! Tôi vô cùng... biết ơn!\n\nNhân viên (vỗ tay nhiệt liệt): Hoan hô sếp! Sếp tuyệt vời!\n\nÔng chủ (tiếp tục): Vì vậy, nhân dịp cuối năm, tôi quyết định... thưởng Tết cho các bạn thật hậu hĩnh! Mỗi người sẽ được... một tháng lương thứ mười ba!\n\nNhân viên (reo hò): Sếp muôn năm!\n\nKế toán (rón rén đến bên ông chủ, nói nhỏ): Dạ thưa sếp... công ty mình đang thua lỗ, tiền đâu mà thưởng ạ?\n\nÔng chủ (nói nhỏ lại, nghiến răng): Thì... thưởng bằng... hiện vật! Mỗi người một... gói mì tôm! Mì tôm cũng là... lương thực mà! Ăn mì tôm là... tiết kiệm, là... yêu nước!\n\nKế toán (ngập ngừng): Dạ...\n\nÔng chủ (quay ra, giọng sang sảng): Các bạn thân mến! Ngoài tháng lương thứ mười ba, tôi còn tặng mỗi bạn một... phần quà đặc biệt trị giá... tình cảm vô giá! Đó là... một gói mì tôm hảo hạng!\n\nNhân viên (ngơ ngác): Mì tôm ạ?\n\nÔng chủ: Đúng! Mì tôm! Các bạn đừng coi thường! Mì tôm là món ăn... quốc dân! Ăn mì tôm là... đồng cam cộng khổ với công ty! Ai không ăn mì tôm là... không yêu công ty!\n\nNhân viên A (nói thầm với B): Sếp hào phóng thật đấy — thưởng Tết bằng... mì tôm! Còn sếp thì... vừa tậu xe hơi mới!\n\nNhân viên B (thì thầm): Suỵt! Nói nhỏ thôi! Sếp nghe thấy là... cắt luôn gói mì tôm đấy!\n\nÔng chủ (nghe loáng thoáng): Các bạn nói gì thế? Có phải đang... cảm động đến rơi nước mắt không? Tôi hiểu mà! Lòng hào phóng của tôi... ai cũng cảm động!\n\nNhân viên (đồng thanh, giọng méo xệch): Dạ... chúng em... cảm động lắm ạ!\n\nÔng chủ (đắc ý nói với khán giả): Đấy, làm sếp phải biết... động viên nhân viên! Một gói mì tôm mà mua được... bao nhiêu nước mắt cảm động! Hào phóng như tôi, tìm đâu ra!\n\nCâu 4. Chi tiết ông chủ vừa tậu xe hơi mới có tác dụng gì?", "options": ["A. Khoe sự giàu có", "B. Phơi bày sự đạo đức giả: bóc lột, keo kiệt với nhân viên nhưng xa hoa cho bản thân", "C. Không có tác dụng", "D. Quảng cáo xe hơi"], "answer": "B", "explain": "Chi tiết đắt giá: trong khi nhân viên chỉ được một gói mì tôm thì sếp tậu xe hơi mới — đối lập phơi bày bản chất bóc lột, đạo đức giả, làm cho tiếng cười thêm phần đắng cay.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÔNG CHỦ HÀO PHÓNG\n(Trích vở hài kịch — cảnh tại công ty)\n\nÔng chủ (đứng trước toàn thể nhân viên, giọng đầy cảm xúc): Các bạn thân mến! Tôi luôn coi các bạn như... anh em ruột thịt! Thành công của công ty là nhờ... mồ hôi nước mắt của các bạn! Tôi vô cùng... biết ơn!\n\nNhân viên (vỗ tay nhiệt liệt): Hoan hô sếp! Sếp tuyệt vời!\n\nÔng chủ (tiếp tục): Vì vậy, nhân dịp cuối năm, tôi quyết định... thưởng Tết cho các bạn thật hậu hĩnh! Mỗi người sẽ được... một tháng lương thứ mười ba!\n\nNhân viên (reo hò): Sếp muôn năm!\n\nKế toán (rón rén đến bên ông chủ, nói nhỏ): Dạ thưa sếp... công ty mình đang thua lỗ, tiền đâu mà thưởng ạ?\n\nÔng chủ (nói nhỏ lại, nghiến răng): Thì... thưởng bằng... hiện vật! Mỗi người một... gói mì tôm! Mì tôm cũng là... lương thực mà! Ăn mì tôm là... tiết kiệm, là... yêu nước!\n\nKế toán (ngập ngừng): Dạ...\n\nÔng chủ (quay ra, giọng sang sảng): Các bạn thân mến! Ngoài tháng lương thứ mười ba, tôi còn tặng mỗi bạn một... phần quà đặc biệt trị giá... tình cảm vô giá! Đó là... một gói mì tôm hảo hạng!\n\nNhân viên (ngơ ngác): Mì tôm ạ?\n\nÔng chủ: Đúng! Mì tôm! Các bạn đừng coi thường! Mì tôm là món ăn... quốc dân! Ăn mì tôm là... đồng cam cộng khổ với công ty! Ai không ăn mì tôm là... không yêu công ty!\n\nNhân viên A (nói thầm với B): Sếp hào phóng thật đấy — thưởng Tết bằng... mì tôm! Còn sếp thì... vừa tậu xe hơi mới!\n\nNhân viên B (thì thầm): Suỵt! Nói nhỏ thôi! Sếp nghe thấy là... cắt luôn gói mì tôm đấy!\n\nÔng chủ (nghe loáng thoáng): Các bạn nói gì thế? Có phải đang... cảm động đến rơi nước mắt không? Tôi hiểu mà! Lòng hào phóng của tôi... ai cũng cảm động!\n\nNhân viên (đồng thanh, giọng méo xệch): Dạ... chúng em... cảm động lắm ạ!\n\nÔng chủ (đắc ý nói với khán giả): Đấy, làm sếp phải biết... động viên nhân viên! Một gói mì tôm mà mua được... bao nhiêu nước mắt cảm động! Hào phóng như tôi, tìm đâu ra!\n\nCâu 5. Qua trích đoạn, em nghĩ người lãnh đạo tốt cần có phẩm chất gì? (Trả lời ngắn gọn)", "answer": "Chân thành, công bằng, quan tâm thật sự đến nhân viên; nói đi đôi với làm", "explain": "Chấp nhận các cách diễn đạt tương đương: không đạo đức giả; chia sẻ khó khăn; tôn trọng người lao động...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của sự chân thành trong các mối quan hệ.", "explain": "DÀN Ý:\n1. Mở đoạn: chân thành là nền tảng của mọi mối quan hệ bền vững.\n2. Thân đoạn: (a) Ý nghĩa: tạo niềm tin, sự gắn bó như người lãnh đạo chân thành được nhân viên quý mến; (b) Trái với đạo đức giả như ông chủ trong trích đoạn — miệng nói yêu thương, thực tế bóc lột; (c) Phê phán thói giả dối, nói một đằng làm một nẻo.\n3. Kết đoạn: hãy sống chân thành.\n\nBÀI MẪU:\nChân thành là nền tảng của mọi mối quan hệ bền vững — trong gia đình, tình bạn, công việc và cả quan hệ giữa lãnh đạo với nhân viên. Người chân thành nói đi đôi với làm, quan tâm đến người khác bằng tấm lòng thật sự chứ không phải bằng những lời hoa mỹ sáo rỗng. Một người sếp chân thành, dám chia sẻ khó khăn với nhân viên sẽ được mọi người hết lòng cống hiến; ngược lại, kẻ đạo đức giả như ông chủ trong trích đoạn — miệng rao giảng tình anh em, thưởng hậu hĩnh nhưng thực tế chỉ cho mỗi người một gói mì tôm trong khi mình tậu xe hơi — sớm muộn cũng bị mọi người nhìn thấu và mất hết niềm tin. Sự giả dối có thể lừa được người khác một lần, nhưng không thể lừa mãi mãi; khi bị phát hiện, cái giá phải trả là sự khinh thường và xa lánh của mọi người. Trong cuộc sống, chân thành còn thể hiện ở việc dám nhận khuyết điểm, dám nói lời xin lỗi, không ngụy biện cho sai lầm của mình. Vì vậy, mỗi chúng ta hãy rèn luyện sự chân thành từ những việc nhỏ: nói thật, làm thật, đối xử với mọi người bằng tấm lòng. Sống chân thành là cách để ta có được những mối quan hệ tốt đẹp và một cuộc đời thanh thản.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Báo cáo nghiên cứu (theo kiểu bài viết của Bài 5 trong SGK): Trình bày kết quả tìm hiểu về thực trạng đời sống của người lao động ở một doanh nghiệp địa phương.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở đầu: lí do chọn đề tài (quan tâm đến đời sống người lao động); mục đích, phạm vi, phương pháp (phỏng vấn, quan sát, thu thập số liệu).\nII. Nội dung:\n1. Thực trạng:\n   a. Thu nhập, chế độ lương thưởng.\n   b. Điều kiện làm việc, thời gian lao động.\n   c. Chế độ phúc lợi, bảo hiểm.\n2. Đánh giá: những điểm tốt và những bất cập.\n3. Nguyên nhân của bất cập.\nIII. Kết luận: đề xuất giải pháp (doanh nghiệp quan tâm hơn, người lao động nâng cao tay nghề, cơ quan chức năng tăng cường kiểm tra).\n\nĐOẠN MẪU (mở đầu):\nNgười lao động là lực lượng trực tiếp tạo ra của cải cho xã hội, vì vậy đời sống của họ luôn là vấn đề được quan tâm. Tuy nhiên, trên thực tế, ở không ít doanh nghiệp, quyền lợi của người lao động chưa được đảm bảo thỏa đáng — như hình ảnh ông chủ hào phóng bằng lời nói nhưng keo kiệt trong thực tế ở trích đoạn hài kịch trên. Để hiểu rõ hơn vấn đề này, em đã tiến hành tìm hiểu thực trạng đời sống người lao động tại một doanh nghiệp ở địa phương bằng phương pháp phỏng vấn, quan sát và thu thập số liệu. Báo cáo dưới đây trình bày kết quả tìm hiểu của em.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKẺ SĨ DIỆN\n(Trích vở hài kịch — cảnh tại nhà anh Sĩ)\n\nAnh Sĩ (soi gương, vuốt tóc): Mình phải luôn xuất hiện thật... sang chảnh! Người ta đánh giá nhau qua vẻ bề ngoài mà!\n\nVợ (bước vào): Anh ơi, tiền điện tháng này...\n\nAnh Sĩ (phất tay): Tiền nong là chuyện nhỏ! Quan trọng là... phong độ! Hôm nay anh phải đi họp lớp, phải mặc bộ vest đắt nhất!\n\nVợ: Nhưng bộ vest đó anh mua trả góp, còn nợ ba tháng chưa trả...\n\nAnh Sĩ: Nợ thì nợ, nhưng phải... oai! Bạn bè nó khinh cho!\n\n(Tại buổi họp lớp. Anh Sĩ bước vào với bộ vest bóng loáng, đồng hồ vàng chói.)\n\nAnh Sĩ (oang oang): Chào các bạn! Lâu quá không gặp! Tôi vừa... đầu tư một dự án lớn! Sắp thành đại gia rồi!\n\nBạn A: Ghê vậy? Dự án gì thế?\n\nAnh Sĩ: Bí mật kinh doanh! Nói ra... lộ hết! Nhưng các bạn cứ tin tôi — tôi sắp... lên hương!\n\n(Bồi bàn mang hóa đơn đến. Anh Sĩ tái mặt nhìn con số.)\n\nAnh Sĩ (nói nhỏ với bạn B): Cậu... cậu trả giúp tôi bữa này nhé! Cuối tháng tôi... gửi lại! Tôi quên ví ở nhà!\n\nBạn B (cười mỉm): Quên ví? Hay là... ví không có gì để quên?\n\nAnh Sĩ (đỏ mặt): Cậu... cậu đừng nói to! Mất mặt tôi!\n\n(Về nhà, vợ đưa hóa đơn tiền điện, tiền nước, tiền học của con.)\n\nVợ: Anh xem này, nhà mình nợ bao nhiêu thứ...\n\nAnh Sĩ (thở dài): Ừ... nhưng ra đường vẫn phải... oai! Người ta bảo: đói cho sạch, rách cho thơm!\n\nVợ (lắc đầu nói với khán giả): Chồng tôi đấy — trong nhà nợ nần chồng chất, ra đường thì... sang chảnh hết phần thiên hạ! Sĩ diện đến mức... ăn mì tôm mà cứ tưởng mình đang ăn... bào ngư!\n\nAnh Sĩ (nghe thấy, cãi): Bà thì biết gì! Sĩ diện là... thương hiệu cá nhân! Không có sĩ diện thì... ai nể mình!\n\nVợ: Người ta nể mình vì... tài đức, chứ ai nể vì... bộ vest trả góp!\n\nAnh Sĩ (gãi đầu, nói với khán giả): Vợ tôi nói... cũng có lí! Nhưng mà... bỏ sĩ diện thì... tôi còn gì để... oai nữa! Thôi, để tôi... sĩ nốt lần này!\n\nCâu 1. Anh Sĩ quan niệm như thế nào về vẻ bề ngoài?", "options": ["A. Không quan trọng", "B. Phải luôn sang chảnh vì người ta đánh giá nhau qua vẻ bề ngoài", "C. Giản dị là tốt nhất", "D. Không quan tâm"], "answer": "B", "explain": "Anh Sĩ tuyên bố: \"Mình phải luôn xuất hiện thật... sang chảnh! Người ta đánh giá nhau qua vẻ bề ngoài mà!\" — quan niệm sĩ diện, hình thức.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKẺ SĨ DIỆN\n(Trích vở hài kịch — cảnh tại nhà anh Sĩ)\n\nAnh Sĩ (soi gương, vuốt tóc): Mình phải luôn xuất hiện thật... sang chảnh! Người ta đánh giá nhau qua vẻ bề ngoài mà!\n\nVợ (bước vào): Anh ơi, tiền điện tháng này...\n\nAnh Sĩ (phất tay): Tiền nong là chuyện nhỏ! Quan trọng là... phong độ! Hôm nay anh phải đi họp lớp, phải mặc bộ vest đắt nhất!\n\nVợ: Nhưng bộ vest đó anh mua trả góp, còn nợ ba tháng chưa trả...\n\nAnh Sĩ: Nợ thì nợ, nhưng phải... oai! Bạn bè nó khinh cho!\n\n(Tại buổi họp lớp. Anh Sĩ bước vào với bộ vest bóng loáng, đồng hồ vàng chói.)\n\nAnh Sĩ (oang oang): Chào các bạn! Lâu quá không gặp! Tôi vừa... đầu tư một dự án lớn! Sắp thành đại gia rồi!\n\nBạn A: Ghê vậy? Dự án gì thế?\n\nAnh Sĩ: Bí mật kinh doanh! Nói ra... lộ hết! Nhưng các bạn cứ tin tôi — tôi sắp... lên hương!\n\n(Bồi bàn mang hóa đơn đến. Anh Sĩ tái mặt nhìn con số.)\n\nAnh Sĩ (nói nhỏ với bạn B): Cậu... cậu trả giúp tôi bữa này nhé! Cuối tháng tôi... gửi lại! Tôi quên ví ở nhà!\n\nBạn B (cười mỉm): Quên ví? Hay là... ví không có gì để quên?\n\nAnh Sĩ (đỏ mặt): Cậu... cậu đừng nói to! Mất mặt tôi!\n\n(Về nhà, vợ đưa hóa đơn tiền điện, tiền nước, tiền học của con.)\n\nVợ: Anh xem này, nhà mình nợ bao nhiêu thứ...\n\nAnh Sĩ (thở dài): Ừ... nhưng ra đường vẫn phải... oai! Người ta bảo: đói cho sạch, rách cho thơm!\n\nVợ (lắc đầu nói với khán giả): Chồng tôi đấy — trong nhà nợ nần chồng chất, ra đường thì... sang chảnh hết phần thiên hạ! Sĩ diện đến mức... ăn mì tôm mà cứ tưởng mình đang ăn... bào ngư!\n\nAnh Sĩ (nghe thấy, cãi): Bà thì biết gì! Sĩ diện là... thương hiệu cá nhân! Không có sĩ diện thì... ai nể mình!\n\nVợ: Người ta nể mình vì... tài đức, chứ ai nể vì... bộ vest trả góp!\n\nAnh Sĩ (gãi đầu, nói với khán giả): Vợ tôi nói... cũng có lí! Nhưng mà... bỏ sĩ diện thì... tôi còn gì để... oai nữa! Thôi, để tôi... sĩ nốt lần này!\n\nCâu 2. Thực tế tài chính của gia đình anh Sĩ ra sao?", "options": ["A. Rất giàu có", "B. Nợ nần chồng chất: vest mua trả góp còn nợ ba tháng, nợ tiền điện nước, tiền học của con", "C. Đủ sống thoải mái", "D. Không có thông tin"], "answer": "B", "explain": "Trái với vẻ sang chảnh bên ngoài, gia đình anh Sĩ nợ nần chồng chất: vest trả góp còn nợ, nợ tiền điện nước, tiền học của con — đối lập gây cười.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKẺ SĨ DIỆN\n(Trích vở hài kịch — cảnh tại nhà anh Sĩ)\n\nAnh Sĩ (soi gương, vuốt tóc): Mình phải luôn xuất hiện thật... sang chảnh! Người ta đánh giá nhau qua vẻ bề ngoài mà!\n\nVợ (bước vào): Anh ơi, tiền điện tháng này...\n\nAnh Sĩ (phất tay): Tiền nong là chuyện nhỏ! Quan trọng là... phong độ! Hôm nay anh phải đi họp lớp, phải mặc bộ vest đắt nhất!\n\nVợ: Nhưng bộ vest đó anh mua trả góp, còn nợ ba tháng chưa trả...\n\nAnh Sĩ: Nợ thì nợ, nhưng phải... oai! Bạn bè nó khinh cho!\n\n(Tại buổi họp lớp. Anh Sĩ bước vào với bộ vest bóng loáng, đồng hồ vàng chói.)\n\nAnh Sĩ (oang oang): Chào các bạn! Lâu quá không gặp! Tôi vừa... đầu tư một dự án lớn! Sắp thành đại gia rồi!\n\nBạn A: Ghê vậy? Dự án gì thế?\n\nAnh Sĩ: Bí mật kinh doanh! Nói ra... lộ hết! Nhưng các bạn cứ tin tôi — tôi sắp... lên hương!\n\n(Bồi bàn mang hóa đơn đến. Anh Sĩ tái mặt nhìn con số.)\n\nAnh Sĩ (nói nhỏ với bạn B): Cậu... cậu trả giúp tôi bữa này nhé! Cuối tháng tôi... gửi lại! Tôi quên ví ở nhà!\n\nBạn B (cười mỉm): Quên ví? Hay là... ví không có gì để quên?\n\nAnh Sĩ (đỏ mặt): Cậu... cậu đừng nói to! Mất mặt tôi!\n\n(Về nhà, vợ đưa hóa đơn tiền điện, tiền nước, tiền học của con.)\n\nVợ: Anh xem này, nhà mình nợ bao nhiêu thứ...\n\nAnh Sĩ (thở dài): Ừ... nhưng ra đường vẫn phải... oai! Người ta bảo: đói cho sạch, rách cho thơm!\n\nVợ (lắc đầu nói với khán giả): Chồng tôi đấy — trong nhà nợ nần chồng chất, ra đường thì... sang chảnh hết phần thiên hạ! Sĩ diện đến mức... ăn mì tôm mà cứ tưởng mình đang ăn... bào ngư!\n\nAnh Sĩ (nghe thấy, cãi): Bà thì biết gì! Sĩ diện là... thương hiệu cá nhân! Không có sĩ diện thì... ai nể mình!\n\nVợ: Người ta nể mình vì... tài đức, chứ ai nể vì... bộ vest trả góp!\n\nAnh Sĩ (gãi đầu, nói với khán giả): Vợ tôi nói... cũng có lí! Nhưng mà... bỏ sĩ diện thì... tôi còn gì để... oai nữa! Thôi, để tôi... sĩ nốt lần này!\n\nCâu 3. Chi tiết anh Sĩ quên ví ở buổi họp lớp có tác dụng gì?", "options": ["A. Chứng tỏ anh đãng trí", "B. Vạch trần sự sĩ diện rỗng tuếch: oai phong bên ngoài nhưng không có tiền trả bữa ăn", "C. Để bạn B trả tiền", "D. Không có tác dụng"], "answer": "B", "explain": "Tình huống trớ trêu: vừa khoe sắp thành đại gia đã phải nhờ bạn trả tiền vì quên ví — sự thật phũ phàng vạch trần thói sĩ diện hão, gây cười.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKẺ SĨ DIỆN\n(Trích vở hài kịch — cảnh tại nhà anh Sĩ)\n\nAnh Sĩ (soi gương, vuốt tóc): Mình phải luôn xuất hiện thật... sang chảnh! Người ta đánh giá nhau qua vẻ bề ngoài mà!\n\nVợ (bước vào): Anh ơi, tiền điện tháng này...\n\nAnh Sĩ (phất tay): Tiền nong là chuyện nhỏ! Quan trọng là... phong độ! Hôm nay anh phải đi họp lớp, phải mặc bộ vest đắt nhất!\n\nVợ: Nhưng bộ vest đó anh mua trả góp, còn nợ ba tháng chưa trả...\n\nAnh Sĩ: Nợ thì nợ, nhưng phải... oai! Bạn bè nó khinh cho!\n\n(Tại buổi họp lớp. Anh Sĩ bước vào với bộ vest bóng loáng, đồng hồ vàng chói.)\n\nAnh Sĩ (oang oang): Chào các bạn! Lâu quá không gặp! Tôi vừa... đầu tư một dự án lớn! Sắp thành đại gia rồi!\n\nBạn A: Ghê vậy? Dự án gì thế?\n\nAnh Sĩ: Bí mật kinh doanh! Nói ra... lộ hết! Nhưng các bạn cứ tin tôi — tôi sắp... lên hương!\n\n(Bồi bàn mang hóa đơn đến. Anh Sĩ tái mặt nhìn con số.)\n\nAnh Sĩ (nói nhỏ với bạn B): Cậu... cậu trả giúp tôi bữa này nhé! Cuối tháng tôi... gửi lại! Tôi quên ví ở nhà!\n\nBạn B (cười mỉm): Quên ví? Hay là... ví không có gì để quên?\n\nAnh Sĩ (đỏ mặt): Cậu... cậu đừng nói to! Mất mặt tôi!\n\n(Về nhà, vợ đưa hóa đơn tiền điện, tiền nước, tiền học của con.)\n\nVợ: Anh xem này, nhà mình nợ bao nhiêu thứ...\n\nAnh Sĩ (thở dài): Ừ... nhưng ra đường vẫn phải... oai! Người ta bảo: đói cho sạch, rách cho thơm!\n\nVợ (lắc đầu nói với khán giả): Chồng tôi đấy — trong nhà nợ nần chồng chất, ra đường thì... sang chảnh hết phần thiên hạ! Sĩ diện đến mức... ăn mì tôm mà cứ tưởng mình đang ăn... bào ngư!\n\nAnh Sĩ (nghe thấy, cãi): Bà thì biết gì! Sĩ diện là... thương hiệu cá nhân! Không có sĩ diện thì... ai nể mình!\n\nVợ: Người ta nể mình vì... tài đức, chứ ai nể vì... bộ vest trả góp!\n\nAnh Sĩ (gãi đầu, nói với khán giả): Vợ tôi nói... cũng có lí! Nhưng mà... bỏ sĩ diện thì... tôi còn gì để... oai nữa! Thôi, để tôi... sĩ nốt lần này!\n\nCâu 4. Lời bình của vợ anh Sĩ có tác dụng gì?", "options": ["A. Khen chồng", "B. Từ góc nhìn người trong cuộc, phơi bày sự thật và châm biếm thói sĩ diện một cách dí dỏm, sâu cay", "C. Bênh vực chồng", "D. Không có tác dụng"], "answer": "B", "explain": "Lời vợ: \"trong nhà nợ nần chồng chất, ra đường thì sang chảnh hết phần thiên hạ\" — vừa là sự thật vừa là lời châm biếm dí dỏm, tăng hiệu quả trào phúng.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKẺ SĨ DIỆN\n(Trích vở hài kịch — cảnh tại nhà anh Sĩ)\n\nAnh Sĩ (soi gương, vuốt tóc): Mình phải luôn xuất hiện thật... sang chảnh! Người ta đánh giá nhau qua vẻ bề ngoài mà!\n\nVợ (bước vào): Anh ơi, tiền điện tháng này...\n\nAnh Sĩ (phất tay): Tiền nong là chuyện nhỏ! Quan trọng là... phong độ! Hôm nay anh phải đi họp lớp, phải mặc bộ vest đắt nhất!\n\nVợ: Nhưng bộ vest đó anh mua trả góp, còn nợ ba tháng chưa trả...\n\nAnh Sĩ: Nợ thì nợ, nhưng phải... oai! Bạn bè nó khinh cho!\n\n(Tại buổi họp lớp. Anh Sĩ bước vào với bộ vest bóng loáng, đồng hồ vàng chói.)\n\nAnh Sĩ (oang oang): Chào các bạn! Lâu quá không gặp! Tôi vừa... đầu tư một dự án lớn! Sắp thành đại gia rồi!\n\nBạn A: Ghê vậy? Dự án gì thế?\n\nAnh Sĩ: Bí mật kinh doanh! Nói ra... lộ hết! Nhưng các bạn cứ tin tôi — tôi sắp... lên hương!\n\n(Bồi bàn mang hóa đơn đến. Anh Sĩ tái mặt nhìn con số.)\n\nAnh Sĩ (nói nhỏ với bạn B): Cậu... cậu trả giúp tôi bữa này nhé! Cuối tháng tôi... gửi lại! Tôi quên ví ở nhà!\n\nBạn B (cười mỉm): Quên ví? Hay là... ví không có gì để quên?\n\nAnh Sĩ (đỏ mặt): Cậu... cậu đừng nói to! Mất mặt tôi!\n\n(Về nhà, vợ đưa hóa đơn tiền điện, tiền nước, tiền học của con.)\n\nVợ: Anh xem này, nhà mình nợ bao nhiêu thứ...\n\nAnh Sĩ (thở dài): Ừ... nhưng ra đường vẫn phải... oai! Người ta bảo: đói cho sạch, rách cho thơm!\n\nVợ (lắc đầu nói với khán giả): Chồng tôi đấy — trong nhà nợ nần chồng chất, ra đường thì... sang chảnh hết phần thiên hạ! Sĩ diện đến mức... ăn mì tôm mà cứ tưởng mình đang ăn... bào ngư!\n\nAnh Sĩ (nghe thấy, cãi): Bà thì biết gì! Sĩ diện là... thương hiệu cá nhân! Không có sĩ diện thì... ai nể mình!\n\nVợ: Người ta nể mình vì... tài đức, chứ ai nể vì... bộ vest trả góp!\n\nAnh Sĩ (gãi đầu, nói với khán giả): Vợ tôi nói... cũng có lí! Nhưng mà... bỏ sĩ diện thì... tôi còn gì để... oai nữa! Thôi, để tôi... sĩ nốt lần này!\n\nCâu 5. Qua trích đoạn, em rút ra bài học gì? (Trả lời ngắn gọn)", "answer": "Sống thật với mình, không sĩ diện hão; coi trọng giá trị thật hơn vẻ bề ngoài", "explain": "Chấp nhận các cách diễn đạt tương đương: đừng chạy theo hình thức; hãy khiêm tốn, tiết kiệm; người ta nể vì tài đức chứ không vì vẻ ngoài...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về tác hại của thói sĩ diện hão.", "explain": "DÀN Ý:\n1. Mở đoạn: sĩ diện hão là chạy theo hình thức, sống không thật với mình.\n2. Thân đoạn: (a) Tác hại: tốn kém tiền của, nợ nần như anh Sĩ; đánh mất sự thanh thản; bị mọi người chê cười khi bị vạch trần; (b) Nguyên nhân: thích được khen, sợ bị khinh; (c) Phê phán lối sống hình thức trong giới trẻ (sống ảo, đua đòi).\n3. Kết đoạn: hãy sống thật, coi trọng giá trị bên trong.\n\nBÀI MẪU:\nSĩ diện hão — chạy theo hình thức, sống không thật với khả năng của mình — là thói xấu gây ra nhiều tác hại. Trước hết, nó khiến con người tốn kém tiền của vào những thứ phù phiếm: như anh Sĩ trong trích đoạn, nợ nần chồng chất mà vẫn phải mặc vest đắt tiền, khoe khoang dự án để giữ vẻ oai phong. Sĩ diện hão còn đánh mất sự thanh thản trong tâm hồn: lúc nào cũng phải gồng mình diễn, sợ bị người khác nhìn thấu. Và khi sự thật bị phơi bày — như cảnh anh Sĩ quên ví phải nhờ bạn trả tiền — kẻ sĩ diện trở thành trò cười cho thiên hạ, mất hết thể diện mà mình cố công xây dựng. Trong giới trẻ hôm nay, thói sĩ diện hão biểu hiện qua việc sống ảo, đua đòi hàng hiệu, khoe khoang trên mạng xã hội vượt quá điều kiện thực tế của gia đình. Đáng quý là những người sống giản dị, chân thành: họ được nể trọng vì tài đức thật sự chứ không phải vẻ bề ngoài hào nhoáng. Hãy nhớ lời vợ anh Sĩ: người ta nể mình vì tài đức chứ không vì bộ vest trả góp.
