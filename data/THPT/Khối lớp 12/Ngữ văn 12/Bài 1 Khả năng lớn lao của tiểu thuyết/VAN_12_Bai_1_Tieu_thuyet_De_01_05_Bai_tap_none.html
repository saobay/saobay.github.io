ôi nóng hổi. Ông cười, nụ cười làm những nếp nhăn nơi khóe mắt xô lại: Thằng nhỏ này khéo nịnh bác già.\n\nCuối năm học, Minh đạt học sinh giỏi. Nó chạy ngay đến tiệm ông Tám khoe giấy khen. Ông Tám đeo kính lão đọc đi đọc lại tờ giấy khen, mắt rưng rưng: Giỏi, giỏi lắm. Bác biết mà, thằng nhỏ có chí thì làm được hết.\n\nNgoài trời, nắng chiều vàng óng rải xuống con phố nhỏ. Trong tiệm sửa xe bé xíu, tình người ấm áp lan tỏa, bình dị mà thấm thía.\n\nCâu 3. Vì sao ông Tám sửa xe miễn phí cho Minh?", "options": ["A. Vì ông Tám muốn Minh phụ việc ở tiệm để trừ tiền công", "B. Vì ông thương cậu học trò nghèo, muốn giúp đỡ mà không đòi hỏi đền đáp", "C. Vì chiếc xe của Minh hỏng quá nhẹ, không đáng lấy tiền", "D. Vì ông Tám muốn khoe tay nghề sửa xe của mình"], "answer": "B", "explain": "Ông Tám thấy Minh tần ngần vì không có tiền nên chủ động giúp, còn dặn dò ân cần. Chi tiết ông từng là thợ máy về hưu, sống một mình cho thấy việc giúp đỡ xuất phát từ tấm lòng nhân hậu, không vụ lợi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI THỢ SỬA XE CUỐI PHỐ\n\nCuối con phố nhỏ có một tiệm sửa xe bé xíu, mái tôn đã rỉ, tấm biển viết tay phai màu: Sửa xe Văn Tám. Ông Tám năm nay ngoài sáu mươi, dáng người gầy gò, đôi tay lúc nào cũng lấm lem dầu mỡ.\n\nChiều nào tan học, Minh cũng dắt chiếc xe đạp cà tàng ngang qua tiệm ông Tám. Xe nó xịt lốp đã mấy hôm mà nhà nghèo, mẹ chưa có tiền sửa. Hôm ấy, nó đứng tần ngần nhìn vào tiệm rồi lại cúi đầu dắt xe đi.\n\nÔng Tám gọi giật lại: Ê nhỏ, xe bị gì mà dắt bộ hoài vậy?\n\nMinh lí nhí: Dạ, xe con xịt lốp... mà con chưa có tiền.\n\nÔng Tám cười khà, vẫy tay: Vô đây bác coi cho. Tiền nong tính sau.\n\nChưa đầy mười phút, chiếc xe đã được vá xong, bơm căng. Ông Tám còn chỉnh lại phanh, tra dầu vào xích, miệng lẩm bẩm: Xe của học trò là phải ngon lành, té một cái là khổ.\n\nMinh rụt rè: Hết bao nhiêu tiền hả bác?\n\nÔng Tám xua tay: Thôi, coi như bác cho. à dắt bộ hoài vậy?\n\nMinh lí nhí: Dạ, xe con xịt lốp... mà con chưa có tiền.\n\nÔng Tám cười khà, vẫy tay: Vô đây bác coi cho. Tiền nong tính sau.\n\nChưa đầy mười phút, chiếc xe đã được vá xong, bơm căng. Ông Tám còn chỉnh lại phanh, tra dầu vào xích, miệng lẩm bẩm: Xe của học trò là phải ngon lành, té một cái là khổ.\n\nMinh rụt rè: Hết bao nhiêu tiền hả bác?\n\nÔng Tám xua tay: Thôi, coi như bác cho. Mai mốt học giỏi thì nhớ ghé thăm bác là được.\n\nMinh đạp xe về, lòng rộn ràng. Từ hôm đó, chiều nào nó cũng ghé tiệm ông Tám, khi phụ quét dọn, khi ngồi nghe ông kể chuyện đời. Nó biết thêm rằng ông Tám từng là thợ máy giỏi của một xí nghiệp, về hưu sớm vì tai nạn lao động, vợ mất đã lâu, con cái đi làm ăn xa. Tiệm sửa xe nhỏ là cả gia tài, cũng là niềm vui tuổi già của ông.\n\nMột buổi chiều mưa, Minh mang đến biếu ông Tám gói xôi nóng hổi. Ông cười, nụ cười làm những nếp nhăn nơi khóe mắt xô lại: Thằng nhỏ này khéo nịnh bác già.\n\nCuối năm học, Minh đạt học sinh giỏi. Nó chạy ngay đến tiệm ông Tám khoe giấy khen. Ông Tám đeo kính lão đọc đi đọc lại tờ giấy khen, mắt rưng rưng: Giỏi, giỏi lắm. Bác biết mà, thằng nhỏ có chí thì làm được hết.\n\nNgoài trời, nắng chiều vàng óng rải xuống con phố nhỏ. Trong tiệm sửa xe bé xíu, tình người ấm áp lan tỏa, bình dị mà thấm thía.\n\nCâu 5. Qua văn bản, em rút ra được bài học gì về cách đối xử giữa con người với nhau? (Trả lời ngắn gọn)", "answer": "Sống nhân hậu, biết giúp đỡ người khác", "explain": "Chấp nhận các cách diễn đạt tương đương: hãy sống nhân ái, sẵn sàng giúp đỡ người khó khăn mà không vụ lợi; tình người trong cuộc sống bình dị là điều quý giá; cho đi là còn mãi.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lòng nhân ái trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: lòng nhân ái là tình yêu thương, sự sẵn lòng giúp đỡ người khác — phẩm chất quý giá của con người.\n2. Thân đoạn: (a) Biểu hiện: giúp đỡ người khó khăn, chia sẻ vật chất và tinh thần, không vụ lợi như ông Tám sửa xe miễn phí cho Minh; (b) Ý nghĩa: sưởi ấm lòng người, lan tỏa điều tốt đẹp, gắn kết cộng đồng; (c) Phê phán lối sống vô cảm, ích kỉ.\n3. Kết đoạn: mỗi người hãy nuôi dưỡng lòng nhân ái bằng hành động cụ thể hằng ngày.\n\nBÀI MẪU:\nLòng nhân ái là tình yêu thương và sự sẵn lòng giúp đỡ người khác khi họ gặp khó khăn — một phẩm chất làm nên vẻ đẹp của con người. Trong cuộc sống, lòng nhân ái hiện diện qua những việc làm bình dị: người thợ sửa xe vá lốp miễn phí cho cậu học trò nghèo, người qua đường dắt cụ già sang đường, những suất cơm từ thiện ấm nóng nghĩa tình. Những hành động ấy tuy nhỏ nhưng có sức lan tỏa lớn: chúng sưởi ấm trái tim người nhận, đồng thời gieo vào lòng người cho đi niềm hạnh phúc khó tả. Một xã hội mà con người biết yêu thương, đùm bọc lẫn nhau sẽ trở nên ấm áp, gắn kết hơn. Ngược lại, lối sống vô cảm, ích kỉ, quay lưng trước nỗi đau của đồng loại sẽ làm cho cuộc đời trở nên lạnh lẽo, nghèo nàn. Bởi vậy, mỗi chúng ta hãy nuôi dưỡng lòng nhân ái ngay từ hôm nay bằng những việc làm cụ thể: một lời động viên, một bàn tay chìa ra đúng lúc cũng đủ làm cho cuộc sống thêm ý nghĩa.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích nhân vật ông Tám trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và nhân vật ông Tám — người thợ sửa xe già nghèo mà giàu lòng nhân ái, để lại ấn tượng sâu đậm.\nII. Thân bài:\n1. Hoàn cảnh: ngoài sáu mươi, gầy gò, từng là thợ máy giỏi phải về hưu sớm vì tai nạn lao động; vợ mất, con xa; tiệm sửa xe bé xíu là cả gia tài và niềm vui tuổi già — hiện thân người lao động nghèo lam lũ mà tự trọng.\n2. Phẩm chất nổi bật:\n   a. Nhân hậu, hay giúp người: sửa xe miễn phí cho Minh, dặn dò ân cần, coi việc giúp đỡ là niềm vui; không đòi hỏi đền đáp.\n   b. Giản dị, chân thành: lời nói mộc mạc, nụ cười hiền; niềm vui bình dị khi nhận gói xôi, khi thấy Minh đạt học sinh giỏi.\n   c. Giàu tình cảm: coi Minh như con cháu, mắt rưng rưng trước giấy khen của cậu bé.\n3. Nghệ thuật xây dựng nhân vật: ngôi kể thứ ba khách quan; khắc họa qua ngoại hình, lời nói, hành động và việc làm cụ thể; chi tiết giàu sức gợi (đôi tay lấm lem dầu mỡ, nụ cười làm nếp nhăn xô lại); kết truyện ấm áp.\nIII. Kết bài: ông Tám là hình ảnh đẹp của người lao động Việt Nam — nghèo vật chất mà giàu tình người; gợi bài học sống nhân ái.\n\nĐOẠN MẪU (mở bài):\nTrong dòng văn học viết về những con người lao động bình dị, truyện ngắn Người thợ sửa xe cuối phố đã khắc họa thành công hình tượng ông Tám — người thợ già nghèo khó nhưng có tấm lòng nhân hậu bao la. Không phải bậc anh hùng phi thường, ông Tám đi vào lòng người đọc bằng chính sự bình dị, chân thành trong từng việc làm nhỏ bé hằng ngày, để lại dư vị ấm áp khó quên.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA GẶT\n\nTháng mười, lúa ngoài đồng đã chín vàng rực. Bà ngoại tôi thức dậy từ lúc trời còn chưa sáng, lặng lẽ chuẩn bị liềm, nón, chai nước rồi ra đồng.\n\nTôi theo bà ra ruộng. Sương sớm còn đọng trên những bông lúa trĩu hạt. Bà cúi xuống, tay thoăn thoắt cắt từng lượm lúa, động tác đều đặn như đã thành nhịp điệu của cả một đời người. Thỉnh thoảng bà ngừng tay, đưa mắt nhìn ra xa, nơi mặt trời đang nhô lên khỏi lũy tre làng.\n\nBà kể, ngày xưa cả làng đói kém, có năm mất mùa, nhà nào cũng phải ăn cháo loãng cầm hơi. Ông ngoại tôi đi phu xa, một mình bà gánh vác cả gia đình, vừa nuôi ba đứa con thơ vừa lo đồng áng. Có đêm bà thức trắng trông lúa ngoài đồng vì sợ trộm, sợ mưa.\n\nTôi hỏi: Cực vậy sao bà không bỏ ruộng đi làm việc khác cho nhàn?\n\nBà cười, nụ cười hiền làm mờ đi những nếp nhăn: Ruộng là máu thịt của người nông dân con ạ. Bỏ ruộng là bỏ gốc rễ của mình. Cực mấy bà cũng chịu được, miễn là nhìn thấy lúa chín vàng, thóc đầy bồ.\n\nTrưa, hai bà cháu ngồi nghỉ dưới gốc đa đầu làng. Bà mở gói cơm nắm muối vừng, chia cho tôi một nửa. Hạt cơm dẻo thơm mùi lúa mới. Bà bảo: Ăn đi con, hạt gạo này là mồ hôi của bao người đấy.\n\nChiều xuống, những bó lúa được gánh về sân phơi thành từng đống vàng óng. Bà ngoại đứng giữa sân, nhìn thành quả của một vụ mùa, ánh mắt ánh lên niềm vui bình dị. Tôi chợt hiểu ra vì sao bà gắn bó với đồng ruộng đến vậy: với bà, mỗi hạt thóc không chỉ là miếng ăn mà còn là niềm tin, là sự sống được vun trồng bằng cả tình yêu.\n\nTối đó, nằm nghe tiếng chày giã gạo thậm thịch ngoài sân, tôi thầm hứa sẽ học thật giỏi để không phụ công bà, để những giọt mồ hôi của bà không uổng phí.\n\nCâu 1. Người kể chuyện trong văn bản là ai?", "options": ["A. Bà ngoại", "B. Người cháu (xưng tôi)", "C. Ông ngoại", "D. Người kể giấu mình"], "answer": "B", "explain": "Người kể xưng tôi, trực tiếp tham gia vào câu chuyện (theo bà ra đồng, trò chuyện với bà) — đó là ngôi kể thứ nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA GẶT\n\nTháng mười, lúa ngoài đồng đã chín vàng rực. Bà ngoại tôi thức dậy từ lúc trời còn chưa sáng, lặng lẽ chuẩn bị liềm, nón, chai nước rồi ra đồng.\n\nTôi theo bà ra ruộng. Sương sớm còn đọng trên những bông lúa trĩu hạt. Bà cúi xuống, tay thoăn thoắt cắt từng lượm lúa, động tác đều đặn như đã thành nhịp điệu của cả một đời người. Thỉnh thoảng bà ngừng tay, đưa mắt nhìn ra xa, nơi mặt trời đang nhô lên khỏi lũy tre làng.\n\nBà kể, ngày xưa cả làng đói kém, có năm mất mùa, nhà nào cũng phải ăn cháo loãng cầm hơi. Ông ngoại tôi đi phu xa, một mình bà gánh vác cả gia đình, vừa nuôi ba đứa con thơ vừa lo đồng áng. Có đêm bà thức trắng trông lúa ngoài đồng vì sợ trộm, sợ mưa.\n\nTôi hỏi: Cực vậy sao bà không bỏ ruộng đi làm việc khác cho nhàn?\n\nBà cười, nụ cười hiền làm mờ đi những nếp nhăn: Ruộng là máu thịt của người nông dân con ạ. Bỏ ruộng là bỏ gốc rễ của mình. Cực mấy bà cũng chịu được, miễn là nhìn thấy lúa chín vàng, thóc đầy bồ.\n\nTrưa, hai bà cháu ngồi nghỉ dưới gốc đa đầu làng. Bà mở gói cơm nắm muối vừng, chia cho tôi một nửa. Hạt cơm dẻo thơm mùi lúa mới. Bà bảo: Ăn đi con, hạt gạo này là mồ hôi của bao người đấy.\n\nChiều xuống, những bó lúa được gánh về sân phơi thành từng đống vàng óng. Bà ngoại đứng giữa sân, nhìn thành quả của một vụ mùa, ánh mắt ánh lên niềm vui bình dị. Tôi chợt hiểu ra vì sao bà gắn bó với đồng ruộng đến vậy: với bà, mỗi hạt thóc không chỉ là miếng ăn mà còn là niềm tin, là sự sống được vun trồng bằng cả tình yêu.\n\nTối đó, nằm nghe tiếng chày giã gạo thậm thịch ngoài sân, tôi thầm hứa sẽ học thật giỏi để không phụ công bà, để những giọt mồ hôi của bà không uổng phí.\n\nCâu 2. Không gian chính của câu chuyện là ở đâu?", "options": ["A. Thành phố", "B. Cánh đồng làng quê vào mùa gặt", "C. Trường học", "D. Chợ quê"], "answer": "B", "explain": "Toàn bộ câu chuyện diễn ra trên cánh đồng lúa chín, từ sáng sớm đến chiều tối — không gian làng quê trong mùa gặt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA GẶT\n\nTháng mười, lúa ngoài đồng đã chín vàng rực. Bà ngoại tôi thức dậy từ lúc trời còn chưa sáng, lặng lẽ chuẩn bị liềm, nón, chai nước rồi ra đồng.\n\nTôi theo bà ra ruộng. Sương sớm còn đọng trên những bông lúa trĩu hạt. Bà cúi xuống, tay thoăn thoắt cắt từng lượm lúa, động tác đều đặn như đã thành nhịp điệu của cả một đời người. Thỉnh thoảng bà ngừng tay, đưa mắt nhìn ra xa, nơi mặt trời đang nhô lên khỏi lũy tre làng.\n\nBà kể, ngày xưa cả làng đói kém, có năm mất mùa, nhà nào cũng phải ăn cháo loãng cầm hơi. Ông ngoại tôi đi phu xa, một mình bà gánh vác cả gia đình, vừa nuôi ba đứa con thơ vừa lo đồng áng. Có đêm bà thức trắng trông lúa ngoài đồng vì sợ trộm, sợ mưa.\n\nTôi hỏi: Cực vậy sao bà không bỏ ruộng đi làm việc khác cho nhàn?\n\nBà cười, nụ cười hiền làm mờ đi những nếp nhăn: Ruộng là máu thịt của người nông dân con ạ. Bỏ ruộng là bỏ gốc rễ của mình. Cực mấy bà cũng chịu được, miễn là nhìn thấy lúa chín vàng, thóc đầy bồ.\n\nTrưa, hai bà cháu ngồi nghỉ dưới gốc đa đầu làng. Bà mở gói cơm nắm muối vừng, chia cho tôi một nửa. Hạt cơm dẻo thơm mùi lúa mới. Bà bảo: Ăn đi con, hạt gạo này là mồ hôi của bao người đấy.\n\nChiều xuống, những bó lúa được gánh về sân phơi thành từng đống vàng óng. Bà ngoại đứng giữa sân, nhìn thành quả của một vụ mùa, ánh mắt ánh lên niềm vui bình dị. Tôi chợt hiểu ra vì sao bà gắn bó với đồng ruộng đến vậy: với bà, mỗi hạt thóc không chỉ là miếng ăn mà còn là niềm tin, là sự sống được vun trồng bằng cả tình yêu.\n\nTối đó, nằm nghe tiếng chày giã gạo thậm thịch ngoài sân, tôi thầm hứa sẽ học thật giỏi để không phụ công bà, để những giọt mồ hôi của bà không uổng phí.\n\nCâu 3. Vì sao bà ngoại không bỏ ruộng dù làm nông vất vả?", "options": ["A. Vì bà không biết làm nghề nào khác", "B. Vì bà coi ruộng đất là máu thịt, là gốc rễ của người nông dân", "C. Vì con cháu bắt bà phải tiếp tục làm ruộng", "D. Vì làm ruộng cho thu nhập cao hơn các nghề khác"], "answer": "B", "explain": "Bà nói rõ: Ruộng là máu thịt của người nông dân, bỏ ruộng là bỏ gốc rễ của mình. Đó là tình yêu quê hương, sự gắn bó máu thịt với đồng đất — phẩm chất của người nông dân Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA GẶT\n\nTháng mười, lúa ngoài đồng đã chín vàng rực. Bà ngoại tôi thức dậy từ lúc trời còn chưa sáng, lặng lẽ chuẩn bị liềm, nón, chai nước rồi ra đồng.\n\nTôi theo bà ra ruộng. Sương sớm còn đọng trên những bông lúa trĩu hạt. Bà cúi xuống, tay thoăn thoắt cắt từng lượm lúa, động tác đều đặn như đã thành nhịp điệu của cả một đời người. Thỉnh thoảng bà ngừng tay, đưa mắt nhìn ra xa, nơi mặt trời đang nhô lên khỏi lũy tre làng.\n\nBà kể, ngày xưa cả làng đói kém, có năm mất mùa, nhà nào cũng phải ăn cháo loãng cầm hơi. Ông ngoại tôi đi phu xa, một mình bà gánh vác cả gia đình, vừa nuôi ba đứa con thơ vừa lo đồng áng. Có đêm bà thức trắng h thoảng bà ngừng tay, đưa mắt nhìn ra xa, nơi mặt trời đang nhô lên khỏi lũy tre làng.\n\nBà kể, ngày xưa cả làng đói kém, có năm mất mùa, nhà nào cũng phải ăn cháo loãng cầm hơi. Ông ngoại tôi đi phu xa, một mình bà gánh vác cả gia đình, vừa nuôi ba đứa con thơ vừa lo đồng áng. Có đêm bà thức trắng trông lúa ngoài đồng vì sợ trộm, sợ mưa.\n\nTôi hỏi: Cực vậy sao bà không bỏ ruộng đi làm việc khác cho nhàn?\n\nBà cười, nụ cười hiền làm mờ đi những nếp nhăn: Ruộng là máu thịt của người nông dân con ạ. Bỏ ruộng là bỏ gốc rễ của mình. Cực mấy bà cũng chịu được, miễn là nhìn thấy lúa chín vàng, thóc đầy bồ.\n\nTrưa, hai bà cháu ngồi nghỉ dưới gốc đa đầu làng. Bà mở gói cơm nắm muối vừng, chia cho tôi một nửa. Hạt cơm dẻo thơm mùi lúa mới. Bà bảo: Ăn đi con, hạt gạo này là mồ hôi của bao người đấy.\n\nChiều xuống, những bó lúa được gánh về sân phơi thành từng đống vàng óng. Bà ngoại đứng giữa sân, nhìn thành quả của một vụ mùa, ánh mắt ánh lên niềm vui bình dị. Tôi chợt hiểu ra vì sao bà gắn bó với đồng ruộng đến vậy: với bà, mỗi hạt thóc không chỉ là miếng ăn mà còn là niềm tin, là sự sống được vun trồng bằng cả tình yêu.\n\nTối đó, nằm nghe tiếng chày giã gạo thậm thịch ngoài sân, tôi thầm hứa sẽ học thật giỏi để không phụ công bà, để những giọt mồ hôi của bà không uổng phí.\n\nCâu 5. Qua văn bản, em học được điều gì về thái độ đối với lao động và người lao động? (Trả lời ngắn gọn)", "answer": "Trân trọng lao động và biết ơn người lao động", "explain": "Chấp nhận các cách diễn đạt tương đương: quý trọng thành quả lao động, biết ơn công sức của người nông dân; lao động là vinh quang, là nguồn gốc của mọi giá trị; phải sống có trách nhiệm, không phụ công người đi trước.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của lao động trong cuộc sống con người.", "explain": "DÀN Ý:\n1. Mở đoạn: lao động là hoạt động đặc trưng của con người, tạo ra của cải vật chất và giá trị tinh thần.\n2. Thân đoạn: (a) Ý nghĩa: nuôi sống bản thân và gia đình, góp phần xây dựng xã hội; lao động giúp con người trưởng thành, khẳng định giá trị bản thân như bà ngoại gắn bó với đồng ruộng; (b) Phê phán thói lười biếng, ỷ lại, coi thường lao động chân tay.\n3. Kết đoạn: mỗi người, nhất là học sinh, cần rèn luyện tinh thần lao động cần cù ngay từ hôm nay.\n\nBÀI MẪU:\nLao động là hoạt động đặc trưng và cao quý của con người, là nguồn gốc tạo ra mọi của cải vật chất và giá trị tinh thần cho xã hội. Nhờ lao động, con người nuôi sống bản thân, phụng dưỡng gia đình và góp phần dựng xây đất nước. Không chỉ vậy, lao động còn giúp con người trưởng thành, rèn luyện ý chí và khẳng định giá trị của chính mình — như hình ảnh bà ngoại trong truyện, cả đời gắn bó với đồng ruộng, tìm thấy niềm vui và ý nghĩa sống trong từng hạt thóc vàng. Ngược lại, thói lười biếng, ỷ lại, coi thường lao động chân tay sẽ khiến con người trở nên vô dụng, sống bám vào người khác. Đặc biệt với học sinh, học tập chính là hình thức lao động trí óc quan trọng nhất hôm nay. Bởi vậy, mỗi chúng ta cần nuôi dưỡng tinh thần cần cù, chịu khó, biết quý trọng thành quả lao động của mình và của người khác — đó cũng là cách để sống có ích và có ý nghĩa.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích hình tượng bà ngoại trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và hình tượng bà ngoại — người nông dân Việt Nam điển hình, hiện thân của vẻ đẹp lao động và tình yêu quê hương.\nII. Thân bài:\n1. Ngoại hình và công việc: dáng lom khom trên đồng, tay thoăn thoắt cắt lúa — chân dung người lao động cần cù, thạo việc.\n2. Phẩm chất:\n   a. Cần cù, chịu thương chịu khó: dậy từ tinh mơ, một mình gánh vác gia đình qua những năm đói kém.\n   b. Gắn bó máu thịt với đồng ruộng: coi ruộng là máu thịt, là gốc rễ — tình yêu quê hương sâu nặng.\n   c. Giàu tình thương: chia cơm nắm cho cháu, dạy cháu biết quý hạt gạo — người bà nhân hậu, tinh tế.\n   d. Lạc quan, giàu niềm tin: ánh mắt vui khi nhìn lúa chín vàng — niềm tin vào sự sống, vào tương lai.\n3. Nghệ thuật: ngôi kể thứ nhất tạo sự gần gũi, chân thực; khắc họa qua hành động, lời nói; chi tiết giàu sức gợi (gói cơm nắm muối vừng, tiếng chày giã gạo).\nIII. Kết bài: bà ngoại là biểu tượng đẹp của người nông dân Việt Nam; gợi bài học trân trọng lao động, yêu quê hương.\n\nĐOẠN MẪU (mở bài):\nTrong văn học Việt Nam, hình ảnh người nông dân một nắng hai sương đã trở thành biểu tượng quen thuộc mà mỗi lần nhắc đến đều gợi bao xúc động. Truyện ngắn Mùa gặt tiếp tục khắc họa vẻ đẹp ấy qua hình tượng bà ngoại — người phụ nữ cả đời gắn bó với đồng ruộng, hiện thân của đức tính cần cù, chịu thương chịu khó và tình yêu quê hương sâu nặng của người nông dân Việt Nam.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC VÉ SỐ\n\nAnh Ba chạy xe ôm ở góc chợ đã hơn mười năm. Ai cũng quý anh vì tính thật thà, vui vẻ. Chiều nào ế khách, anh lại ngồi lẩm bẩm tính toán: tiền nhà, tiền học cho hai đứa nhỏ, tiền thuốc cho mẹ già...\n\nHôm ấy trời nắng gắt. Anh Ba vừa chở khách xong thì thấy một tờ vé số nằm lăn lóc dưới gốc cây. Anh nhặt lên, phủi bụi, lẩm bẩm: Ai đánh rơi mà không hay.\n\nTối đó, anh Ba dò vé số như một thói quen — dù chẳng bao giờ mua. Bỗng tay anh run lên: tờ vé nhặt được trúng giải đặc biệt. Hai tỉ đồng. Anh ngồi sững, tim đập thình thịch. Hai tỉ — số tiền anh có chạy xe cả đời cũng không mơ tới. Nó đủ để trả hết nợ, mua căn nhà nhỏ, cho con ăn học đến nơi đến chốn, chữa bệnh cho mẹ.\n\nĐêm ấy anh Ba trằn trọc không ngủ. Một bên là cám dỗ: cứ im lặng mà hưởng, có ai biết đâu mà tìm. Một bên là lương tâm: đây là mồ hôi nước mắt của người khác, mình hưởng sao đành.\n\nSáng hôm sau, anh Ba đạp xe đến trụ sở công ty xổ số từ sớm, trình bày sự việc và nhờ họ tìm giúp chủ nhân tờ vé số qua camera ở khu vực anh nhặt được. Mấy ngày sau, một bà cụ bán rau tìm đến, nước mắt giàn giụa: Tờ vé đó là của tôi. Tôi dành dụm mãi mới dám mua một tờ cầu may...\n\nAnh Ba trao lại tờ vé số cho bà cụ, lòng nhẹ nhõm lạ thường. Bà cụ dúi vào tay anh một xấp tiền hậu tạ nhưng anh nhất quyết không nhận: Bà giữ lấy mà dưỡng già. Con giúp được bà là vui rồi.\n\nCâu chuyện lan ra, ai cũng khen anh Ba thật thà. Có người tiếc hộ: Giá mà anh giữ lại thì đời đã khác. Anh Ba chỉ cười hiền: Tiền không phải của mình, cầm cũng không yên. Nghèo mà thanh thản còn hơn giàu mà day dứt.\n\nTừ hôm đó, khách đi xe của anh Ba đông hơn hẳn. Người ta không chỉ đi xe mà còn muốn được chuyện trò với người đàn ông có tấm lòng vàng. Anh Ba vẫn chạy xe mỗi ngày, vẫn vui vẻ, thật thà như xưa — chỉ khác là nụ cười của anh rạng rỡ hơn, vì anh biết mình đã thắng được cám dỗ lớn nhất của lòng tham.\n\nCâu 1. Tình huống truyện trong văn bản là gì?", "options": ["A. Anh Ba chạy xe ôm ế khách ở góc chợ", "B. Anh Ba nhặt được tờ vé số trúng giải đặc biệt và đứng trước lựa chọn giữa lòng tham và lương tâm", "C. Bà cụ bán rau đánh rơi vé số", "D. Anh Ba được mọi người khen ngợi vì tính thật thà"], "answer": "B", "explain": "Tình huống truyện là hoàn cảnh đặc biệt: anh Ba nghèo khó nhặt được vé số trúng hai tỉ đồng, buộc phải lựa chọn giữa chiếm đoạt và trả lại — tình huống này bộc lộ rõ tính cách, phẩm chất của nhân vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC VÉ SỐ\n\nAnh Ba chạy xe ôm ở góc chợ đã hơn mười năm. Ai cũng quý anh vì tính thật thà, vui vẻ. Chiều nào ế khách, anh lại ngồi lẩm bẩm tính toán: tiền nhà, tiền học cho hai đứa nhỏ, tiền thuốc cho mẹ già...\n\nHôm ấy trời nắng gắt. Anh Ba vừa chở khách xong thì thấy một tờ vé số nằm lăn lóc dưới gốc cây. Anh nhặt lên, phủi bụi, lẩm bẩm: Ai đánh rơi mà không hay.\n\nTối đó, anh Ba dò vé số như một thói quen — dù chẳng bao giờ mua. Bỗng tay anh run lên: tờ vé nhặt được trúng giải đặc biệt. Hai tỉ đồng. Anh ngồi sững, tim đập thình thịch. Hai tỉ — số tiền anh có chạy xe cả đời cũng không mơ tới. Nó đủ để trả hết nợ, mua căn nhà nhỏ, cho con ăn học đến nơi đến chốn, chữa bệnh cho mẹ.\n\nĐêm ấy anh Ba trằn trọc không ngủ. Một bên là cám dỗ: cứ im lặng mà hưởng, có ai biết đâu mà tìm. Một bên là lương tâm: đây là mồ hôi nước mắt của người khác, mình hưởng sao đành.\n\nSáng hôm sau, anh Ba đạp xe đến trụ sở công ty xổ số từ sớm, trình bày sự việc và nhờ họ tìm giúp chủ nhân tờ vé số qua camera ở khu vực anh nhặt được. Mấy ngày sau, một bà cụ bán rau tìm đến, nước mắt giàn giụa: Tờ vé đó là của tôi. Tôi dành dụm mãi mới dám mua một tờ cầu may...\n\nAnh Ba trao lại tờ vé số cho bà cụ, lòng nhẹ nhõm lạ thường. Bà cụ dúi vào tay anh một xấp tiền hậu tạ nhưng anh nhất quyết không nhận: Bà giữ lấy mà dưỡng già. Con giúp được bà là vui rồi.\n\nCâu chuyện lan ra, ai cũng khen anh Ba thật thà. Có người tiếc hộ: Giá mà anh giữ lại thì đời đã khác. Anh Ba chỉ cười hiền: Tiền không phải của mình, cầm cũng không yên. Nghèo mà thanh thản còn hơn giàu mà day dứt.\n\nTừ hôm đó, khách đi xe của anh Ba đông hơn hẳn. Người ta không chỉ đi xe mà còn muốn được chuyện trò với người đàn ông có tấm lòng vàng. Anh Ba vẫn chạy xe mỗi ngày, vẫn vui vẻ, thật thà như xưa — chỉ khác là nụ cười của anh rạng rỡ hơn, vì anh biết mình đã thắng được cám dỗ lớn nhất của lòng tham.\n\nCâu 2. Nhân vật chính của truyện là ai?", "options": ["A. Bà cụ bán rau", "B. Người khách đi xe ôm", "C. Anh Ba xe ôm", "D. Nhân viên công ty xổ số"], "answer": "C", "explain": "Anh Ba là nhân vật trung tâm: mọi sự việc xoay quanh anh, tính cách và lựa chọn của anh là chủ đề tư tưởng của truyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC VÉ SỐ\n\nAnh Ba chạy xe ôm ở góc chợ đã hơn mười năm. Ai cũng quý anh vì tính thật thà, vui vẻ. Chiều nào ế khách, anh lại ngồi lẩm bẩm tính toán: tiền nhà, tiền học cho hai đứa nhỏ, tiền thuốc cho m ám mua một tờ cầu may...\n\nAnh Ba trao lại tờ vé số cho bà cụ, lòng nhẹ nhõm lạ thường. Bà cụ dúi vào tay anh một xấp tiền hậu tạ nhưng anh nhất quyết không nhận: Bà giữ lấy mà dưỡng già. Con giúp được bà là vui rồi.\n\nCâu chuyện lan ra, ai cũng khen anh Ba thật thà. Có người tiếc hộ: Giá mà anh giữ lại thì đời đã khác. Anh Ba chỉ cười hiền: Tiền không phải của mình, cầm cũng không yên. Nghèo mà thanh thản còn hơn giàu mà day dứt.\n\nTừ hôm đó, khách đi xe của anh Ba đông hơn hẳn. Người ta không chỉ đi xe mà còn muốn được chuyện trò với người đàn ông có tấm lòng vàng. Anh Ba vẫn chạy xe mỗi ngày, vẫn vui vẻ, thật thà như xưa — chỉ khác là nụ cười của anh rạng rỡ hơn, vì anh biết mình đã thắng được cám dỗ lớn nhất của lòng tham.\n\nCâu 5. Nếu là anh Ba, em có trả lại tờ vé số không? Vì sao? (Trả lời ngắn gọn)", "answer": "Có, vì đó là tài sản của người khác / tiền không chính đáng không mang lại hạnh phúc", "explain": "Chấp nhận câu trả lời thể hiện chính kiến rõ ràng, có lí lẽ: trả lại vì đó là việc đúng đắn, sống trung thực mới thanh thản; hoặc nếu chọn giữ lại phải có lí lẽ thuyết phục (ít khuyến khích). Cốt lõi: tôn trọng đạo đức, không tham của người khác.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lòng trung thực trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: trung thực là sống ngay thẳng, thật thà, không gian dối — nền tảng đạo đức của con người.\n2. Thân đoạn: (a) Biểu hiện: dám nhận lỗi, không tham của người khác, nói đúng sự thật như anh Ba trả lại vé số trúng thưởng; (b) Ý nghĩa: tạo niềm tin, được mọi người quý trọng, tâm hồn thanh thản; (c) Phê phán thói gian dối, lừa lọc.\n3. Kết đoạn: rèn luyện tính trung thực từ những việc nhỏ hằng ngày.\n\nBÀI MẪU:\nTrung thực là sống ngay thẳng, thật thà, không gian dối trong lời nói và việc làm — một phẩm chất đạo đức nền tảng của con người. Người trung thực dám nhìn thẳng vào sự thật, dám nhận lỗi khi sai và tuyệt đối không tham lam những thứ không thuộc về mình, như anh Ba xe ôm trong truyện đã trả lại tờ vé số trúng giải đặc biệt cho người đánh rơi dù bản thân đang rất nghèo khó. Lòng trung thực mang lại những giá trị to lớn: nó tạo dựng niềm tin giữa con người với nhau, giúp ta được mọi người quý trọng, và quan trọng nhất là giữ cho tâm hồn luôn thanh thản, không day dứt. Ngược lại, thói gian dối, lừa lọc có thể mang lại lợi ích trước mắt nhưng sớm muộn cũng sẽ bị phát hiện, đánh mất niềm tin và sống trong lo sợ. Trong học tập, trung thực thể hiện ở việc không quay cóp, không gian lận trong thi cử. Bởi vậy, mỗi chúng ta hãy rèn luyện tính trung thực từ những việc nhỏ nhất hằng ngày, để trở thành người đáng tin cậy và sống một cuộc đời thanh thản.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích tình huống truyện và ý nghĩa của nó trong việc thể hiện chủ đề tư tưởng của truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn, khái niệm tình huống truyện và vai trò của nó; tình huống anh Ba nhặt được vé số trúng thưởng là tình huống độc đáo, giàu ý nghĩa.\nII. Thân bài:\n1. Phân tích tình huống: anh Ba nghèo khó (chạy xe ôm, gánh nặng gia đình) nhặt được vé số trúng hai tỉ đồng — hoàn cảnh éo le, thử thách gay gắt đối với đạo đức con người.\n2. Diễn biến tâm lí nhân vật trong tình huống: từ sững sờ, rung động trước cám dỗ đến trằn trọc đấu tranh nội tâm, cuối cùng chọn trả lại — quá trình bộc lộ tính cách.\n3. Ý nghĩa của tình huống:\n   a. Bộc lộ phẩm chất nhân vật: thật thà, có lương tâm, thắng được lòng tham.\n   b. Thể hiện chủ đề tư tưởng: ca ngợi vẻ đẹp đạo đức của người lao động nghèo; khẳng định giá trị của sự trung thực, thanh thản lương tâm.\n   c. Tạo sức hấp dẫn: tình huống bất ngờ, kịch tính, lôi cuốn người đọc.\n4. Nghệ thuật: xây dựng tình huống éo le, miêu tả tâm lí tinh tế, đối thoại chân thực.\nIII. Kết bài: tình huống truyện là chìa khóa thể hiện tư tưởng tác phẩm; gợi bài học sống trung thực.\n\nĐOẠN MẪU (mở bài):\nTình huống truyện được coi là linh hồn của tác phẩm tự sự — nơi nhân vật bộc lộ tính cách và tư tưởng của nhà văn được thể hiện tập trung nhất. Truyện ngắn Chiếc vé số đã xây dựng một tình huống độc đáo và giàu sức thử thách: người xe ôm nghèo khó nhặt được tờ vé số trúng giải đặc biệt hai tỉ đồng. Chính trong tình huống éo le ấy, vẻ đẹp tâm hồn của nhân vật anh Ba được tỏa sáng, đồng thời chủ đề tư tưởng ca ngợi lòng trung thực của tác phẩm cũng được thể hiện một cách thấm thía.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÔ GIÁO VÙNG CAO\n\nCon đường lên bản Nậm Cắn quanh co giữa những dãy núi chập chùng. Mùa đông, sương mù giăng kín từ sáng đến chiều. Cô giáo Hoa đã gắn bó với điểm trường nơi đây được năm năm.\n\nHôm cô mới lên, điểm trường chỉ là căn nhà gỗ xiêu vẹo với hơn chục học sinh đủ lứa tuổi ngồi chung một lớp. Sách vở thiếu, bàn ghế cập kênh, mùa mưa dột tứ tung. Nhiều đêm, cô nằm nghe tiếng mưa rơi mà nước mắt ứa ra, nhớ nhà da diết.\n\nNhưng rồi cô ở lại. Cô vận động quyên góp được sách vở, quần áo ấm cho học sinh. Cô dạy các em đánh vần từng chữ, dạy cả những bài hát thiếu nhi mà lũ trẻ chưa từng được nghe. Cuối tuần, cô lại lặn lội xuống núi mua thêm đồ dùng học tập bằng đồng lương ít ỏi của mình.\n\nCó lần, em Sùng A Páo ốm nặng, nhà em ở tít trên đỉnh núi, đường đi khó khăn. Cô Hoa cõng em vượt mấy quả đồi trong đêm mưa để đưa xuống trạm xá. Sáng hôm sau, cô lại đứng lớp như không có chuyện gì xảy ra, chỉ có đôi mắt thâm quầng tố cáo một đêm thức trắng.\n\nMùa xuân năm ấy, điểm trường có thêm phòng học mới do các nhà hảo tâm tài trợ. Ngày khánh thành, bà con trong bản mang đến tặng cô những bắp ngô nếp, những tấm thổ cẩm dệt tay. Già làng nắm tay cô thật chặt: Cô là con của bản rồi.\n\nNăm năm trôi qua, lứa học trò đầu tiên của cô đã có em thi đỗ vào trường nội trú của huyện. Ngày tiễn em xuống núi nhập học, cô Hoa đứng nhìn theo mãi. Gió núi thổi tung mái tóc cô, nhưng ánh mắt cô rạng rỡ niềm vui.\n\nCó người hỏi cô vì sao không xin chuyển về xuôi cho gần nhà, cho đỡ vất vả. Cô chỉ cười: Ở đây, mỗi nụ cười của học trò là một mùa xuân. Tôi đã tìm thấy ý nghĩa cuộc đời mình trên những con đường mòn dẫn đến lớp học.\n\nCâu 1. Không gian chính của câu chuyện là ở đâu?", "options": ["A. Thành phố lớn", "B. Vùng cao, bản Nậm Cắn với điểm trường nghèo", "C. Đồng bằng sông Cửu Long", "D. Vùng biển đảo xa xôi"], "answer": "B", "explain": "Toàn bộ câu chuyện diễn ra ở bản Nậm Cắn vùng cao — nơi cô Hoa dạy học với điểm trường nghèo, đường núi quanh co, sương mù giăng kín.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÔ GIÁO VÙNG CAO\n\nCon đường lên bản Nậm Cắn quanh co giữa những dãy núi chập chùng. Mùa đông, sương mù giăng kín từ sáng đến chiều. Cô giáo Hoa đã gắn bó với điểm trường nơi đây được năm năm.\n\nHôm cô mới lên, điểm trường chỉ là căn nhà gỗ xiêu vẹo với hơn chục học sinh đủ lứa tuổi ngồi chung một lớp. Sách vở thiếu, bàn ghế cập kênh, mùa mưa dột tứ tung. Nhiều đêm, cô nằm nghe tiếng mưa rơi mà nước mắt ứa ra, nhớ nhà da diết.\n\nNhưng rồi cô ở lại. Cô vận động quyên góp được sách vở, quần áo ấm cho học sinh. Cô dạy các em đánh vần từng chữ, dạy cả những bài hát thiếu nhi mà lũ trẻ chưa từng được nghe. Cuối tuần, cô lại lặn lội xuống núi mua thêm đồ dùng học tập bằng đồng lương ít ỏi của mình.\n\nCó lần, em Sùng A Páo ốm nặng, nhà em ở tít trên đỉnh núi, đường đi khó khăn. Cô Hoa cõng em vượt mấy quả đồi trong đêm mưa để đưa xuống trạm xá. Sáng hôm sau, cô lại đứng lớp như không có chuyện gì xảy ra, chỉ có đôi mắt thâm quầng tố cáo một đêm thức trắng.\n\nMùa xuân năm ấy, điểm trường có thêm phòng học mới do các nhà hảo tâm tài trợ. Ngày khánh thành, bà con trong bản mang đến tặng cô những bắp ngô nếp, những tấm thổ cẩm dệt tay. Già làng nắm tay cô thật chặt: Cô là con của bản rồi.\n\nNăm năm trôi qua, lứa học trò đầu tiên của cô đã có em thi đỗ vào trường nội trú của huyện. Ngày tiễn em xuống núi nhập học, cô Hoa đứng nhìn theo mãi. Gió núi thổi tung mái tóc cô, nhưng ánh mắt cô rạng rỡ niềm vui.\n\nCó người hỏi cô vì sao không xin chuyển về xuôi cho gần nhà, cho đỡ vất vả. Cô chỉ cười: Ở đây, mỗi nụ cười của học trò là một mùa xuân. Tôi đã tìm thấy ý nghĩa cuộc đời mình trên những con đường mòn dẫn đến lớp học.\n\nCâu 2. Chi tiết \"cô cõng em Sùng A Páo vượt mấy quả đồi trong đêm mưa\" cho thấy phẩm chất gì của cô Hoa?", "options": ["A. Sức khỏe tốt, quen đi đường núi", "B. Tình thương học trò sâu sắc, sẵn sàng hy sinh vì các em", "C. Trách nhiệm công việc được giao", "D. Muốn được bà con trong bản khen ngợi"], "answer": "B", "explain": "Hành động cõng học trò ốm vượt núi trong đêm mưa, rồi sáng hôm sau vẫn đứng lớp, cho thấy tình thương trò vô bờ bến — cô coi học trò như con em ruột thịt của mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÔ GIÁO VÙNG CAO\n\nCon đường lên bản Nậm Cắn quanh co giữa những dãy núi chập chùng. Mùa đông, sương mù giăng kín từ sáng đến chiều. Cô giáo Hoa đã gắn bó với điểm trường nơi đây được năm năm.\n\nHôm cô mới lên, điểm trường chỉ là căn nhà gỗ xiêu vẹo với hơn chục học sinh đủ lứa tuổi ngồi chung một lớp. Sách vở thiếu, bàn ghế cập kênh, mùa mưa dột tứ tung. Nhiều đêm, cô nằm nghe tiếng mưa rơi mà nước mắt ứa ra, nhớ nhà da diết.\n\nNhưng rồi cô ở lại. Cô vận động quyên góp được sách vở, quần áo ấm cho học sinh. Cô dạy các em đánh vần từng chữ, dạy cả những bài hát thiếu nhi mà lũ trẻ chưa từng được nghe. Cuối tuần, cô lại lặn lội xuống núi mua thêm đồ dùng học tập bằng đồng lương ít ỏi của mình.\n\nCó lần, em Sùng A Páo ốm nặng, nhà em ở tít trên đỉnh núi, đường đi khó khăn. Cô Hoa cõng em vượt mấy quả đồi trong đêm mưa để đưa xuống trạm xá. Sáng hôm sau, cô lại đứng lớp như không có chuyện gì xảy ra, chỉ có đôi mắt thâm quầng tố cáo một đêm thức trắng.\n\nMùa xuân năm ấy, điểm trường có thêm phòng học mới do các nhà hảo tâm tài trợ. Ngày khánh thành, bà con trong bản mang đến tặng cô những bắp ngô nếp, những tấm thổ cẩm dệt tay. Già làng nắm tay cô thật chặt: Cô là con của bản rồi.\n\nNăm năm trôi qua, lứa học trò đầu tiên của cô đã có em thi đỗ vào trường nội trú của huyện. Ngày tiễn em xuống núi nhập học, cô Hoa đứng nhìn theo mãi. Gió núi thổi tung mái tóc cô, nhưng ánh mắt cô rạng rỡ niềm vui.\n\nCó người hỏi cô vì sao không xin chuyển về xuôi cho gần nhà, cho đỡ vất vả. Cô chỉ cười: Ở đây, mỗi nụ cười của học trò là một mùa xuân. Tôi đã tìm thấy ý nghĩa cuộc đời mình trên những con đường mòn dẫn đến lớp học.\n\nCâu 3. Vì sao cô Hoa quyết định ở lại bản dù nhiều đêm nhớ nhà da diết?", "options": ["A. Vì cô không xin được chuyển công tác về xuôi", "B. Vì đồng lương vùng cao cao hơn ở xuôi", "C. Vì cô tìm thấy ý nghĩa cuộc đời trong việc dạy dỗ, gắn bó với học trò và bà con nơi đây", "D. Vì cô đã quen với khí hậu lạnh giá của vùng núi"], "answer": "C", "explain": "Câu kết của truyện nói rõ: mỗi nụ cười của học trò là một mùa xuân, cô đã tìm thấy ý nghĩa cuộc đời mình trên những con đường mòn dẫn đến lớp học. Đó là lí tưởng sống cao đẹp của người giáo viên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCÔ GIÁO VÙNG CAO\n\nCon đường lên bản Nậm Cắn quanh co giữa những dãy núi chập chùng. Mùa đông, sương mù giăng kín từ sáng đến chiều. Cô giáo Hoa đã gắn bó với điểm trường nơi đây được năm năm.\n\nHôm cô mới lên, điểm trường chỉ là căn nhà gỗ xiêu vẹo với hơn chục học sinh đủ lứa tuổi ngồi chung một lớp. Sách vở thiếu, bàn ghế cập kênh, mùa mưa dột tứ tung. Nhiều đêm, cô nằm nghe tiếng mưa rơi mà nước mắt ứa ra, nhớ nhà da diết.\n\nNhưng rồi cô ở lại. Cô vận động quyên góp được sách vở, quần áo ấm cho học sinh. Cô dạy các em đánh vần từng chữ, dạy cả những bài hát thiếu nhi mà lũ trẻ chưa từng đ inh đủ lứa tuổi ngồi chung một lớp. Sách vở thiếu, bàn ghế cập kênh, mùa mưa dột tứ tung. Nhiều đêm, cô nằm nghe tiếng mưa rơi mà nước mắt ứa ra, nhớ nhà da diết.\n\nNhưng rồi cô ở lại. Cô vận động quyên góp được sách vở, quần áo ấm cho học sinh. Cô dạy các em đánh vần từng chữ, dạy cả những bài hát thiếu nhi mà lũ trẻ chưa từng được nghe. Cuối tuần, cô lại lặn lội xuống núi mua thêm đồ dùng học tập bằng đồng lương ít ỏi của mình.\n\nCó lần, em Sùng A Páo ốm nặng, nhà em ở tít trên đỉnh núi, đường đi khó khăn. Cô Hoa cõng em vượt mấy quả đồi trong đêm mưa để đưa xuống trạm xá. Sáng hôm sau, cô lại đứng lớp như không có chuyện gì xảy ra, chỉ có đôi mắt thâm quầng tố cáo một đêm thức trắng.\n\nMùa xuân năm ấy, điểm trường có thêm phòng học mới do các nhà hảo tâm tài trợ. Ngày khánh thành, bà con trong bản mang đến tặng cô những bắp ngô nếp, những tấm thổ cẩm dệt tay. Già làng nắm tay cô thật chặt: Cô là con của bản rồi.\n\nNăm năm trôi qua, lứa học trò đầu tiên của cô đã có em thi đỗ vào trường nội trú của huyện. Ngày tiễn em xuống núi nhập học, cô Hoa đứng nhìn theo mãi. Gió núi thổi tung mái tóc cô, nhưng ánh mắt cô rạng rỡ niềm vui.\n\nCó người hỏi cô vì sao không xin chuyển về xuôi cho gần nhà, cho đỡ vất vả. Cô chỉ cười: Ở đây, mỗi nụ cười của học trò là một mùa xuân. Tôi đã tìm thấy ý nghĩa cuộc đời mình trên những con đường mòn dẫn đến lớp học.\n\nCâu 5. Qua nhân vật cô Hoa, em rút ra bài học gì về lí tưởng sống của tuổi trẻ? (Trả lời ngắn gọn)", "answer": "Sống có lí tưởng, cống hiến cho cộng đồng, nơi khó khăn nhất", "explain": "Chấp nhận các cách diễn đạt tương đương: tuổi trẻ cần có lí tưởng cao đẹp, dám đến những nơi khó khăn để cống hiến; hạnh phúc đến từ việc sống có ích cho người khác; noi gương các thầy cô vùng cao.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của người thầy trong cuộc đời mỗi học sinh.", "explain": "DÀN Ý:\n1. Mở đoạn: người thầy có vai trò to lớn trong việc hình thành tri thức, nhân cách của học sinh.\n2. Thân đoạn: (a) Thầy cô truyền đạt kiến thức, dạy lẽ sống, là tấm gương đạo đức như cô Hoa tận tụy với học trò vùng cao; (b) Người thầy khơi dậy ước mơ, niềm tin, dìu dắt học trò vượt khó; (c) Phê phán thái độ vô ơn, thiếu tôn trọng thầy cô.\n3. Kết đoạn: biết ơn và kính trọng thầy cô bằng hành động thiết thực.\n\nBÀI MẪU:\nNgười thầy giữ vai trò vô cùng to lớn trong cuộc đời mỗi học sinh, không chỉ truyền đạt kiến thức mà còn góp phần hình thành nhân cách, khơi dậy ước mơ cho các em. Thầy cô là người thắp lên ngọn lửa tri thức, dạy ta biết phân biệt đúng sai, biết sống nhân ái và có trách nhiệm — như cô giáo Hoa trong truyện đã vượt bao gian khó để mang con chữ đến với học trò vùng cao, coi niềm vui của các em là ý nghĩa cuộc đời mình. Nhiều học sinh thành công hôm nay đều ghi nhớ công ơn của những người thầy đã tận tụy dìu dắt mình qua những năm tháng khó khăn nhất. Ngược lại, thái độ vô ơn, thiếu tôn trọng thầy cô là điều đáng phê phán, đi ngược với truyền thống tôn sư trọng đạo của dân tộc. Bởi vậy, mỗi học sinh hãy thể hiện lòng biết ơn thầy cô bằng những việc làm thiết thực: chăm ngoan, học giỏi, lễ phép và sống xứng đáng với công lao dạy dỗ của thầy cô.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích vẻ đẹp tâm hồn của nhân vật cô Hoa trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và nhân vật cô Hoa — hình ảnh đẹp của người giáo viên vùng cao, hiện thân của lí tưởng cống hiến.\nII. Thân bài:\n1. Hoàn cảnh: năm năm gắn bó với điểm trường nghèo ở bản Nậm Cắn; cơ sở vật chất thiếu thốn; nỗi nhớ nhà da diết — hoàn cảnh thử thách lòng kiên trì.\n2. Vẻ đẹp tâm hồn:\n   a. Tận tụy với nghề: vận động quyên góp sách vở, dùng lương mua đồ dùng học tập; cõng học trò ốm vượt núi trong đêm mưa rồi sáng vẫn đứng lớp.\n   b. Yêu thương học trò như con: dạy từng chữ, từng bài hát; niềm vui khi học trò đỗ trường nội trú.\n   c. Lí tưởng sống cao đẹp: từ chối về xuôi, tìm thấy ý nghĩa đời mình trong nụ cười học trò; được bà con coi là con của bản.\n3. Nghệ thuật: ngôi kể thứ ba; khắc họa qua hành động, việc làm cụ thể; chi tiết giàu sức gợi (đôi mắt thâm quầng, cái nắm tay của già làng); giọng văn trầm ấm, cảm động.\nIII. Kết bài: cô Hoa là biểu tượng của người thầy vùng cao; gợi bài học về lí tưởng sống cống hiến cho tuổi trẻ.\n\nĐOẠN MẪU (mở bài):\nTrong văn học viết về nghề giáo, hình ảnh người thầy vùng cao luôn để lại những rung cảm đặc biệt bởi sự hy sinh thầm lặng và lí tưởng sống cao đẹp. Truyện ngắn Cô giáo vùng cao đã khắc họa thành công nhân vật cô Hoa — cô giáo trẻ gắn bó năm năm với điểm trường nghèo ở bản Nậm Cắn, hiện thân của vẻ đẹp tâm hồn người chiến sĩ trên mặt trận văn hóa, để lại trong lòng người đọc niềm cảm phục và xúc động sâu sắc.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỮA CƠM ĐOÀN VIÊN\n\nĐã ba năm rồi, gia đình ông Tư mới có một bữa cơm đông đủ. Con trai lớn làm kỹ sư ở thành phố, con gái út đi xuất khẩu lao động, mỗi đứa một nơi, mỗi năm chỉ về được một, hai lần.\n\nChiều ba mươi Tết, bà Tư dậy từ sớm đi chợ. Bà chọn mớ rau tươi nhất, miếng thịt ngon nhất, con cá chép còn quẫy đạp. Ông Tư lụi cụi quét dọn nhà cửa, lau lại bộ bàn ghế gỗ đã cũ mà ông quý như vàng.\n\nGần trưa, tiếng xe máy vang lên ngoài ngõ. Thằng Hai về, ba lô nặng trĩu quà bánh. Chưa kịp buông ba lô, nó đã ôm chầm lấy mẹ: Con nhớ nhà quá mẹ ơi. Bà Tư rưng rưng, vỗ vỗ lưng con: Về là tốt rồi, về là tốt rồi.\n\nBuổi chiều, con gái út cũng về tới. Cô bé ngày nào giờ đã chững chạc hẳn, mang theo đủ thứ đặc sản nơi xứ người. Cả nhà quây quần bên nhau, tiếng cười nói rộn rã cả gian nhà nhỏ.\n\nBữa cơm tất niên được dọn ra: canh khổ qua, thịt kho tàu, cá chép chiên giòn, đĩa rau luộc chấm mắm — toàn những món quen thuộc mà ba năm nay hai đứa con chỉ được thấy trong mơ. Ông Tư gắp cho mỗi đứa một miếng thịt: Ăn đi con, ở xa chắc thèm cơm nhà lắm.\n\nThằng Hai kể chuyện công việc, chuyện bạn bè ở thành phố. Con Út kể về những ngày đầu bỡ ngỡ nơi đất khách, những đêm nhớ nhà khóc thầm. Bà Tư vừa nghe vừa gắp thức ăn cho con, mắt không giấu được niềm thương.\n\nĂn xong, cả nhà ngồi uống trà ngoài hiên. Ông Tư bỗng nói, giọng trầm ấm: Ba mẹ không cần các con giàu sang. Chỉ cần các con khỏe mạnh, sống tử tế, nhớ về nhau, nhớ về cái nhà này là ba mẹ vui rồi.\n\nĐêm giao thừa, pháo hoa nở rộ trên bầu trời. Trong căn nhà nhỏ, bữa cơm đoàn viên tuy đơn sơ mà ấm áp lạ thường. Hai đứa con thầm hứa: dù đi đâu, làm gì, mỗi năm cũng sẽ về sum họp, để ba mẹ không phải ngóng trông, để bữa cơm đoàn viên không còn phải chờ đợi ba năm nữa.\n\nCâu 1. Thời điểm diễn ra câu chuyện là khi nào?", "options": ["A. Ngày giỗ tổ", "B. Chiều ba mươi Tết và đêm giao thừa", "C. Ngày Quốc khánh", "D. Một ngày cuối tuần bình thường"], "answer": "B", "explain": "Các chi tiết cho thấy rõ: chiều ba mươi Tết đi chợ, bữa cơm tất niên, đêm giao thừa pháo hoa — câu chuyện diễn ra trong thời khắc thiêng liêng chuyển giao năm mới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỮA CƠM ĐOÀN VIÊN\n\nĐã ba năm rồi, gia đình ông Tư mới có một bữa cơm đông đủ. Con trai lớn làm kỹ sư ở thành phố, con gái út đi xuất khẩu lao động, mỗi đứa một nơi, mỗi năm chỉ về được một, hai lần.\n\nChiều ba mươi Tết, bà Tư dậy từ sớm đi chợ. Bà chọn mớ rau tươi nhất, miếng thịt ngon nhất, con cá chép còn quẫy đạp. Ông Tư lụi cụi quét dọn nhà cửa, lau lại bộ bàn ghế gỗ đã cũ mà ông quý như vàng.\n\nGần trưa, tiếng xe máy vang lên ngoài ngõ. Thằng Hai về, ba lô nặng trĩu quà bánh. Chưa kịp buông ba lô, nó đã ôm chầm lấy mẹ: Con nhớ nhà quá mẹ ơi. Bà Tư rưng rưng, vỗ vỗ lưng con: Về là tốt rồi, về là tốt rồi.\n\nBuổi chiều, con gái út cũng về tới. Cô bé ngày nào giờ đã chững chạc hẳn, mang theo đủ thứ đặc sản nơi xứ người. Cả nhà quây quần bên nhau, tiếng cười nói rộn rã cả gian nhà nhỏ.\n\nBữa cơm tất niên được dọn ra: canh khổ qua, thịt kho tàu, cá chép chiên giòn, đĩa rau luộc chấm mắm — toàn những món quen thuộc mà ba năm nay hai đứa con chỉ được thấy trong mơ. Ông Tư gắp cho mỗi đứa một miếng thịt: Ăn đi con, ở xa chắc thèm cơm nhà lắm.\n\nThằng Hai kể chuyện công việc, chuyện bạn bè ở thành phố. Con Út kể về những ngày đầu bỡ ngỡ nơi đất khách, những đêm nhớ nhà khóc thầm. Bà Tư vừa nghe vừa gắp thức ăn cho con, mắt không giấu được niềm thương.\n\nĂn xong, cả nhà ngồi uống trà ngoài hiên. Ông Tư bỗng nói, giọng trầm ấm: Ba mẹ không cần các con giàu sang. Chỉ cần các con khỏe mạnh, sống tử tế, nhớ về nhau, nhớ về cái nhà này là ba mẹ vui rồi.\n\nĐêm giao thừa, pháo hoa nở rộ trên bầu trời. Trong căn nhà nhỏ, bữa cơm đoàn viên tuy đơn sơ mà ấm áp lạ thường. Hai đứa con thầm hứa: dù đi đâu, làm gì, mỗi năm cũng sẽ về sum họp, để ba mẹ không phải ngóng trông, để bữa cơm đoàn viên không còn phải chờ đợi ba năm nữa.\n\nCâu 2. Món ăn nào KHÔNG được nhắc đến trong bữa cơm tất niên của gia đình ông Tư?", "options": ["A. Canh khổ qua", "B. Thịt kho tàu", "C. Bánh chưng", "D. Cá chép chiên giòn"], "answer": "C", "explain": "Văn bản liệt kê: canh khổ qua, thịt kho tàu, cá chép chiên giòn, đĩa rau luộc chấm mắm — không nhắc đến bánh chưng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỮA CƠM ĐOÀN VIÊN\n\nĐã ba năm rồi, gia đình ông Tư mới có một bữa cơm đông đủ. Con trai lớn làm kỹ sư ở thành phố, con gái út đi xuất khẩu lao động, mỗi đứa một nơi, mỗi năm chỉ về được một, hai lần.\n\nChiều ba mươi Tết, bà Tư dậy từ sớm đi chợ. Bà chọn mớ rau tươi nhất, miếng thịt ngon nhất, con cá chép còn quẫy đạp. Ông Tư lụi cụi quét dọn nhà cửa, lau lại bộ bàn ghế gỗ đã cũ mà ông quý như vàng.\n\nGần trưa, tiếng xe máy vang lên ngoài ngõ. Thằng Hai về, ba lô nặng trĩu quà bánh. Chưa kịp buông ba lô, nó đã ôm chầm lấy mẹ: Con nhớ nhà quá mẹ ơi. Bà Tư rưng rưng, vỗ vỗ lưng con: Về là tốt rồi, về là tốt rồi.\n\nBuổi chiều, con gái út cũng về tới. Cô bé ngày nào giờ đã chững chạc hẳn, mang theo đủ thứ đặc sản nơi xứ người. Cả nhà quây quần bên nhau, tiếng cười nói rộn rã cả gian nhà nhỏ.\n\nBữa cơm tất niên được dọn ra: canh khổ qua, thịt kho tàu, cá chép chiên giòn, đĩa rau luộc chấm mắm — toàn những món quen thuộc mà ba năm nay hai đứa con chỉ được thấy trong mơ. Ông Tư gắp cho mỗi đứa một miếng thịt: Ăn đi con, ở xa chắc thèm cơm nhà lắm.\n\nThằng Hai kể chuyện công việc, chuyện bạn bè ở thành phố. Con Út kể về những ngày đầu bỡ ngỡ nơi đất khách, những đêm nhớ nhà khóc thầm. Bà Tư vừa nghe vừa gắp thức ăn cho con, mắt không giấu được niềm thương.\n\nĂn xong, cả nhà ngồi uống trà ngoài hiên. Ông Tư bỗng nói, giọng trầm ấm: Ba mẹ không cần các con giàu sang. Chỉ cần các con khỏe mạnh, sống tử tế, nhớ về nhau, nhớ về cái nhà này là ba mẹ vui rồi.\n\nĐêm giao thừa, pháo hoa nở rộ trên bầu trời. Trong căn nhà nhỏ, bữa cơm đoàn viên tuy đơn sơ mà ấm áp lạ thường. Hai đứa con thầm hứa: dù đi đâu, làm gì, mỗi năm cũng sẽ về sum họp, để ba mẹ không phải ngóng trông, để bữa cơm đoàn viên không còn phải chờ đợi ba năm nữa.\n\nCâu 3. Vì sao bữa cơm đoàn viên này đặc biệt ý nghĩa với gia đình ông Tư?", "options": ["A. Vì mâm cơm có nhiều món ngon, đắt tiền", "B. Vì đã ba năm gia đình mới sum họp đông đủ sau những tháng ngày mỗi người một nơi", "C. Vì có khách quý đến chơi nhà", "D. Vì hai con mang về nhiều quà đắt tiền"], "answer": "B", "explain": "Giá trị của bữa cơm không nằm ở mâm cao cỗ đầy mà ở sự sum họp sau ba năm xa cách — đó là khát khao đoàn viên của cha mẹ già và tình cảm gia đình thiêng liêng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỮA CƠM ĐOÀN VIÊN\n\nĐã ba năm rồi, gia đình ông Tư mới có một bữa cơm đông đủ. Con trai lớn làm kỹ sư ở thành phố, con gái út đi xuất khẩu lao động, mỗi đứa một nơi, mỗi năm chỉ về được một, hai lần.\n\nChiều ba mươi Tết, bà Tư dậy từ sớm đi chợ. Bà chọn mớ rau tươi nhất, miếng thịt ngon nhất, con cá chép còn quẫy đạp. Ông Tư lụi cụi quét dọn nhà cửa, lau lại bộ bàn ghế gỗ đã cũ mà ông quý như vàng.\n\nGần trưa, tiếng xe máy vang lên ngoài ngõ. Thằng Hai về, ba lô nặng trĩu quà bánh. Chưa kịp buông ba lô, nó đã ôm chầm lấy mẹ: Con nhớ nhà quá mẹ ơi. Bà Tư rưng rưng, vỗ vỗ lưng con: Về là tốt rồi, về là tốt rồi.\n\nBuổi chiều, con gái út cũng về tới. Cô bé ngày nào giờ đã chững chạc hẳn, mang theo đủ thứ đặc sản nơi xứ người. Cả nhà quây quần bên nhau, tiếng cười nói rộn rã cả gian nhà nhỏ.\n\nBữa cơm tất niên được dọn ra: canh khổ qua, thịt kho tàu, cá chép chiên giòn, đĩa rau luộc chấm mắm — toàn những món quen thuộc mà ba năm nay hai đứa con chỉ được thấy trong mơ. Ông Tư gắp cho mỗi đứa một miếng thịt: Ăn đi con, ở xa chắc thèm cơm nhà lắm.\n\nThằng Hai kể chuyện công việc, chuyện bạn bè ở thành phố. Con Út kể về những ngày đầu bỡ ngỡ nơi đất khách, những đêm nhớ nhà khóc thầm. Bà Tư vừa nghe vừa gắp thức ăn cho con, mắt không giấu được niềm thương.\n\nĂn xong, cả nhà ngồi uống trà ngoài hiên. Ông Tư bỗng nói, giọng trầm ấm: Ba mẹ không cần các con giàu sang. Chỉ cần các con khỏe mạnh, sống tử tế, nhớ về nhau, nhớ về cái nhà này là ba mẹ vui rồi.\n\nĐêm giao thừa, pháo hoa nở rộ trên bầu trời. Trong căn nhà nhỏ, bữa cơm đoàn viên tuy đơn sơ mà ấm áp lạ thường. Hai đứa con thầm hứa: dù đi đâu, làm gì, mỗi năm cũng sẽ về sum họp, để ba mẹ không phải ngóng trông, để bữa cơm đoàn viên không còn phải chờ đợi ba năm nữa.\n\nCâu 4. Lời dặn của ông Tư \"Ba mẹ không cần các con giàu sang...\" thể hiện điều gì?", "options": ["A. Ông Tư thất vọng vì các con chưa thành đạt", "B. Tình thương vô điều kiện của cha mẹ: chỉ mong con khỏe mạnh, sống tử tế và nhớ về gia đình", "C. Ông Tư không quan tâm đến tương lai của các con", "D. Ông Tư muốn các con bỏ việc về quê sống cùng"], "answer": "B", "explain": "Lời dặn mộc mạc mà thấm thía, thể hiện tình cha mẹ bao la: không đòi hỏi vật chất, chỉ mong con sống tốt và giữ gìn tình cảm gia đình — triết lí sống giản dị mà sâu sắc.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBỮA CƠM ĐOÀN VIÊN\n\nĐã ba năm rồi, gia đình ông Tư mới có một bữa cơm đông đủ. Con trai lớn làm kỹ sư ở thành phố, con gái út đi xuất khẩu lao động, mỗi đứa một nơi, mỗi năm chỉ về được một, hai lần.\n\nChiều ba mươi Tết, bà Tư dậy từ sớm đi chợ. Bà chọn mớ rau tươi nhất, miếng thịt ngon nhất, con cá chép còn quẫy đạp. Ông Tư lụi cụi quét dọn nhà cửa, lau lại bộ bàn ghế gỗ đã cũ mà ông quý như vàng.\n\nGần trưa, tiếng xe máy vang lên ngoài ngõ. Thằng Hai về, ba lô nặng trĩu quà bánh. Chưa kịp buông ba lô, nó đã ôm chầm lấy mẹ: Con nhớ nhà quá mẹ ơi. Bà Tư rưng rưng, vỗ vỗ lưng con: Về là tốt rồi, về là tốt rồi.\n\nBuổi chiều, con gái út cũng về tới. Cô bé ngày nào giờ đã chững chạc hẳn, mang theo đủ thứ đặc sản nơi xứ người. Cả nhà quây quần bên nhau, tiếng cười nói rộn rã cả gian nhà nhỏ.\n\nBữa cơm tất niên được dọn ra: canh khổ qua, thịt kho tàu, cá chép chiên giòn, đĩa rau luộc chấm mắm — toàn những món quen thuộc mà ba năm nay hai đứa con chỉ được thấy trong mơ. Ông Tư gắp cho mỗi đứa một miếng thịt: Ăn đi con, ở xa chắc thèm cơm nhà lắm.\n\nThằng Hai kể chuyện công việc, chuyện bạn bè ở thành phố. Con Út kể về những ngày đầu bỡ ngỡ nơi đất khách, những đêm nhớ nhà khóc thầm. Bà Tư vừa nghe vừa gắp thức ăn cho con, mắt không giấu được niềm thương.\n\nĂn xong, cả nhà ngồi uống trà ngoài hiên. Ông Tư bỗng nói, giọng trầm ấm: Ba mẹ không cần các con giàu sang. Chỉ cần các con khỏe mạnh, sống tử tế, nhớ về nhau, nhớ về cái nhà này là ba mẹ vui rồi.\n\nĐêm giao thừa, pháo hoa nở rộ trên bầu trời. Trong căn nhà nhỏ, bữa cơm đoàn viên tuy đơn sơ mà ấm áp lạ thường. Hai đứa con thầm hứa: dù đi đâu, làm gì, mỗi năm cũng sẽ về sum họp, để ba mẹ không phải ngóng trông, để bữa cơm đoàn viên không còn phải chờ đợi ba năm nữa.\n\nCâu 5. Qua văn bản, em nghĩ mình cần làm gì để gìn giữ hạnh phúc gia đình? (Trả lời ngắn gọn)", "answer": "Dành thời gian cho gia đình, quan tâm và sum họp", "explain": "Chấp nhận các cách diễn đạt tương đương: thường xuyên quan tâm, hỏi han cha mẹ; dù bận rộn cũng dành thời gian sum họp; biết ơn công sinh thành dưỡng dục; sống tử tế để cha mẹ vui lòng.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của bữa cơm gia đình trong cuộc sống hiện đại.", "explain": "DÀN Ý:\n1. Mở đoạn: bữa cơm gia đình là nét đẹp văn hóa, là nơi gắn kết các thành viên.\n2. Thân đoạn: (a) Ý nghĩa: sum họp, chia sẻ buồn vui, cha mẹ con cái gần gũi nhau như bữa cơm tất niên của gia đình ông Tư sau ba năm xa cách; (b) Thực trạng: cuộc sống bận rộn khiến nhiều gia đình hiếm khi ăn cơm chung, mỗi người một màn hình; (c) Phê phán lối sống vô tâm với gia đình.\n3. Kết đoạn: hãy trân trọng từng bữa cơm bên gia đình.\n\nBÀI MẪU:\nBữa cơm gia đình là nét đẹp văn hóa quý giá, là khoảng thời gian thiêng liêng gắn kết các thành viên sau một ngày bận rộn. Quanh mâm cơm, cha mẹ và con cái được sum họp, chia sẻ những buồn vui trong cuộc sống, thấu hiểu nhau hơn — như bữa cơm tất niên của gia đình ông Tư trong truyện, sau ba năm xa cách, mâm cơm đơn sơ mà ấm áp lạ thường vì có đủ mặt mọi người. Thế nhưng, trong cuộc sống hiện đại hối hả, không ít gia đình hiếm khi có bữa cơm chung: cha mẹ bận việc, con cái dán mắt vào điện thoại, mỗi người ăn một nơi, một giờ. Dần dần, sợi dây gắn kết gia đình trở nên lỏng lẻo, con cái xa cách cha mẹ mà không hay. Đó là điều đáng báo động. Bởi vậy, dù bận rộn đến đâu, mỗi chúng ta hãy cố gắng dành thời gian cho những bữa cơm gia đình — bởi hạnh phúc đôi khi chỉ đơn giản là được ngồi ăn cùng những người thân yêu.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ cảm nhận về tình cảm gia đình được thể hiện trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và chủ đề tình cảm gia đình — tình phụ tử, mẫu tử thiêng liêng trong khoảnh khắc đoàn viên ngày Tết.\nII. Thân bài:\n1. Tình cha mẹ dành cho con: bà Tư dậy sớm đi chợ chọn món ngon nhất; ông Tư lụi cụi dọn nhà; gắp thức ăn cho con; lời dặn mộc mạc mà sâu sắc — tình thương vô điều kiện.\n2. Tình con dành cho cha mẹ: thằng Hai ôm chầm lấy mẹ; con Út mang quà về; cả hai lắng nghe, chia sẻ; lời hứa thầm sẽ về sum họp mỗi năm — lòng hiếu thảo.\n3. Ý nghĩa của sự đoàn viên: sau ba năm xa cách, bữa cơm đơn sơ trở nên thiêng liêng; gia đình là điểm tựa, là nơi bình yên nhất.\n4. Nghệ thuật: ngôi kể thứ ba; miêu tả sinh động (mâm cơm, không khí Tết); đối thoại chân thực, giàu cảm xúc; giọng văn ấm áp.\nIII. Kết bài: khẳng định giá trị của tình cảm gia đình; liên hệ bản thân — biết trân trọng, gìn giữ hạnh phúc gia đình.\n\nĐOẠN MẪU (mở bài):\nGia đình là điểm tựa thiêng liêng nhất của mỗi con người, là nơi ta tìm về sau những bon chen của cuộc đời. Truyện ngắn Bữa cơm đoàn viên đã khắc họa thật cảm động tình cảm gia đình trong khoảnh khắc sum họp ngày Tết — khi những người con xa quê trở về, khi mâm cơm đơn sơ trở thành biểu tượng của hạnh phúc đoàn viên, để lại trong lòng người đọc bao suy ngẫm về giá trị của tình thân.", "points": 0}]}]}
