n nguyên. Và tôi chợt nhận ra: thành công không chỉ có một định nghĩa. Được sống với đam mê, được mọi người yêu quý — đó cũng là một dạng thành công đáng trân trọng.\n\nCâu 3. Vì sao nhân vật tôi thoáng chạnh lòng khi gặp lại Hùng?", "options": ["A. Vì Hùng không còn nhận ra mình", "B. Vì thấy bạn thành đạt, giàu sang trong khi mình chỉ là giáo viên làng bình dị — sự so sánh về địa vị", "C. Vì Hùng khoe khoang, coi thường mình", "D. Vì quán cà phê quá đông đúc, ồn ào"], "answer": "B", "explain": "Sự chạnh lòng đến từ phép so sánh thầm lặng: Hùng vest lịch lãm, trưởng phòng công ty lớn; còn tôi chỉ là giáo viên trường làng. Đó là tâm lí rất thật của con người trước sự chênh lệch địa vị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI BẠN CŨ\n\nQuán cà phê cuối phố hôm nay đông hơn mọi ngày. Tôi ngồi chờ, lòng bồi hồi. Đã mười lăm năm rồi tôi mới gặp lại Hùng — thằng bạn thân thời cấp ba.\n\nHùng bước vào, dáng vẻ chững chạc trong bộ vest lịch lãm. Nó ôm chầm lấy tôi: Lâu quá rồi mày ơi! Ngày xưa hai đứa mình chuyên trốn học đi đá bóng, bị thầy chủ nhiệm phạt đứng cả buổi mà vẫn cười hềnh hệch.\n\nChúng tôi ôn lại bao kỉ niệm: những buổi chiều đạp xe dọc bờ sông, những lần cùng nhau thức khuya ôn thi, lần cả hai bị điểm kém môn Toán rồi cùng hứa sẽ cố gắng. Hùng kể, sau khi tốt nghiệp đại học, nó vào làm ở một công ty lớn, giờ đã là trưởng phòng. Còn tôi, vẫn là anh giáo viên dạy văn ở trường làng, cuộc sống bình dị.\n\nTôi thoáng chút chạnh lòng. Nhưng Hùng nắm tay tôi, giọng chân thành: Mày biết không, tao luôn ngưỡng mộ mày. Tao bon chen chốn thương trường, có tiền đấy nhưng lúc nào cũng căng thẳng, mệt mỏi. Còn mày, mỗi ngày được đứng trên bục giảng, được học trò yêu quý — đó mới là hạnh phúc thật sự.\n\nTôi sững người. Hóa ra, mỗi người đều có những trăn trở riêng, và hạnh phúc không đo bằng tiền bạc hay địa vị. Hùng tiếp: Hồi đó mày học văn giỏi nhất lớp, bài văn nào của mày thầy cũng đọc cho cả lớp nghe. Mày đã sống đúng với đam mê của mình, còn tao thì...\n\nChia tay, Hùng dúi vào tay tôi một phong bì: Cầm lấy, coi như tao góp chút quà cho thư viện trường mày. Tôi từ chối mãi không được, đành nhận với lời hứa sẽ mua thật nhiều sách cho học trò.\n\nTrên đường về, tôi mỉm cười. Mười lăm năm, mỗi đứa một ngã rẽ, nhưng tình bạn vẫn vẹn nguyên. Và tôi chợt nhận ra: thành công không chỉ có một định nghĩa. Được sống với đam mê, được mọi người yêu quý — đó cũng là một dạng thành công đáng trân trọng.\n\nCâu 4. Qua lời tâm sự của Hùng, tác phẩm muốn gửi gắm thông điệp gì?", "options": ["A. Làm giáo viên sướng hơn làm trưởng phòng", "B. Hạnh phúc không đo bằng tiền bạc, địa vị; được sống với đam mê và được yêu quý cũng là thành công", "C. Không nên bon chen chốn thương trường", "D. Tình bạn thời học trò là tình bạn đẹp nhất"], "answer": "B", "explain": "Hùng thành đạt nhưng căng thẳng, mệt mỏi; còn người bạn giáo viên nghèo mà được học trò yêu quý. Thông điệp: mỗi người có một định nghĩa thành công riêng, hạnh phúc thật sự đến từ việc sống đúng với đam mê và có ích.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI BẠN CŨ\n\nQuán cà phê cuối phố hôm nay đông hơn mọi ngày. Tôi ngồi chờ, lòng bồi hồi. Đã mười lăm năm rồi tôi mới gặp lại Hùng — thằng bạn thân thời cấp ba.\n\nHùng bước vào, dáng vẻ chững chạc trong bộ vest lịch lãm. Nó ôm chầm lấy tôi: Lâu quá rồi mày ơi! Ngày xưa hai đứa mình chuyên trốn học đi đá bóng, bị thầy chủ nhiệm phạt đứng cả buổi mà vẫn cười hềnh hệch.\n\nChúng tôi ôn lại bao kỉ niệm: những buổi chiều đạp xe dọc bờ sông, những lần cùng nhau thức khuya ôn thi, lần cả hai bị điểm kém môn Toán rồi cùng hứa sẽ cố gắng. Hùng kể, sau khi tốt nghiệp đại học, nó vào làm ở một công ty lớn, giờ đã là trưởng phòng. Còn tôi, vẫn là anh giáo viên dạy văn ở trường làng, cuộc sống bình dị.\n\nTôi thoáng chút chạnh lòng. Nhưng Hùng nắm tay tôi, giọng chân thành: Mày biết không, tao luôn ngưỡng mộ mày. Tao bon chen chốn thương trường, có tiền đấy nhưng lúc nào cũng căng thẳng, mệt mỏi. Còn mày, mỗi ngày được đứng trên bục giảng, được học trò yêu quý — đó mới là hạnh phúc thật sự.\n\nTôi sững người. Hóa ra, mỗi người đều có những trăn trở riêng, và hạnh phúc không đo bằng tiền bạc hay địa vị. Hùng tiếp: Hồi đó mày học văn giỏi nhất lớp, bài văn nào của mày thầy cũng đọc cho cả lớp nghe. Mày đã sống đúng với đam mê của mình, còn tao thì...\n\nChia tay, Hùng dúi vào tay tôi một phong bì: Cầm lấy, coi như tao góp chút quà cho thư viện trường mày. Tôi từ chối mãi không được, đành nhận với lời hứa sẽ mua thật nhiều sách cho học trò.\n\nTrên đường về, tôi mỉm cười. Mười lăm năm, mỗi đứa một ngã rẽ, nhưng tình bạn vẫn vẹn nguyên. Và tôi chợt nhận ra: thành công không chỉ có một định nghĩa. Được sống với đam mê, được mọi người yêu quý — đó cũng là một dạng thành công đáng trân trọng.\n\nCâu 5. Theo em, thế nào là một tình bạn đẹp? (Trả lời ngắn gọn)", "answer": "Chân thành, không vụ lợi, tôn trọng và chia sẻ cùng nhau", "explain": "Chấp nhận các cách diễn đạt tương đương: tình bạn đẹp là chân thành, không tính toán hơn thua về địa vị, tiền bạc; biết tôn trọng lựa chọn của nhau; luôn nhớ về nhau dù xa cách như tình bạn của hai nhân vật.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của tình bạn trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: tình bạn là tình cảm thiêng liêng, là món quà quý giá của cuộc đời.\n2. Thân đoạn: (a) Ý nghĩa: bạn bè chia sẻ buồn vui, giúp đỡ nhau lúc khó khăn, cùng nhau trưởng thành như tình bạn mười lăm năm của hai nhân vật; (b) Tình bạn đẹp phải chân thành, không vụ lợi, tôn trọng nhau; (c) Phê phán tình bạn giả dối, lợi dụng.\n3. Kết đoạn: hãy trân trọng và vun đắp tình bạn.\n\nBÀI MẪU:\nTình bạn là một trong những tình cảm thiêng liêng và quý giá nhất trong cuộc đời mỗi con người. Một người bạn tốt là người cùng ta chia sẻ những niềm vui, nỗi buồn, là chỗ dựa tinh thần vững chắc mỗi khi ta gặp khó khăn, thất bại — như tình bạn mười lăm năm của hai nhân vật trong truyện, dù mỗi người một ngã rẽ, dù chênh lệch địa vị, vẫn chân thành và vẹn nguyên. Tình bạn đẹp phải được xây dựng trên sự chân thành, tin tưởng và tôn trọng lẫn nhau, không vụ lợi, không tính toán hơn thua. Ngược lại, những mối quan hệ bạn bè giả dối, chỉ đến với nhau vì lợi ích sẽ nhanh chóng tan vỡ khi hết giá trị lợi dụng. Trong cuộc sống, ai cũng cần có bạn, nhưng quan trọng hơn là phải biết chọn bạn mà chơi và sống xứng đáng với tình bạn ấy. Bởi vậy, mỗi chúng ta hãy trân trọng những người bạn chân thành bên cạnh mình, cùng nhau vun đắp để tình bạn ngày càng bền chặt, trở thành hành trang quý giá suốt cuộc đời.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích diễn biến tâm trạng của nhân vật tôi trong cuộc gặp gỡ với Hùng.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và nhân vật tôi; cuộc gặp gỡ sau mười lăm năm là cơ hội để nhân vật nhìn lại mình và nhận ra chân giá trị cuộc sống.\nII. Thân bài:\n1. Bồi hồi, háo hức trước cuộc gặp: chờ đợi với bao kỉ niệm ùa về — tình bạn sâu nặng.\n2. Chạnh lòng khi so sánh: Hùng thành đạt, mình bình dị — tâm lí tự ti thoáng qua, rất thật của con người.\n3. Sững người rồi thấu hiểu trước lời tâm sự của Hùng: nhận ra hạnh phúc không đo bằng tiền bạc, địa vị; trân trọng cuộc sống của chính mình.\n4. Mỉm cười thanh thản trên đường về: đã tìm thấy câu trả lời — thành công có nhiều định nghĩa, được sống với đam mê là hạnh phúc.\n5. Nghệ thuật: ngôi kể thứ nhất bộc lộ trực tiếp nội tâm; độc thoại nội tâm tinh tế; đối thoại chân thực; giọng văn trầm lắng, suy tư.\nIII. Kết bài: diễn biến tâm trạng hợp lí, giàu ý nghĩa nhân sinh; gợi bài học về cách nhìn nhận thành công, hạnh phúc.\n\nĐOẠN MẪU (mở bài):\nCuộc gặp gỡ sau mười lăm năm xa cách trong truyện ngắn Người bạn cũ không chỉ là cuộc hội ngộ của tình bạn mà còn là hành trình nhận thức của nhân vật tôi về giá trị của thành công và hạnh phúc. Qua diễn biến tâm trạng tinh tế từ bồi hồi, chạnh lòng đến thấu hiểu và thanh thản, tác phẩm đã gửi gắm một thông điệp nhân sinh sâu sắc: mỗi người đều có quyền định nghĩa thành công theo cách của riêng mình.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC ĐÈN BÃO\n\nĐêm ấy, bão đổ bộ vào làng. Gió rít từng cơn, mưa quất vào mái nhà rào rào. Điện mất từ chập tối, cả làng chìm trong bóng tối mịt mùng.\n\nTrong căn nhà nhỏ cuối xóm, bà Năm thắp chiếc đèn bão cũ kĩ — kỉ vật của ông Năm để lại từ thời còn đi biển. Ánh đèn vàng vọt hắt lên khuôn mặt đầy nếp nhăn của bà, ấm áp lạ thường giữa đêm bão tố.\n\nBỗng có tiếng gõ cửa dồn dập. Thằng Tí, con nhà hàng xóm, hớt hải chạy vào, người ướt sũng: Bà Năm ơi, nhà con dột nát hết rồi, mẹ con đang che cho em bé, bà cho con mượn cái đèn với ạ!\n\nBà Năm không ngần ngại đưa ngay chiếc đèn bão cho Tí, còn dúi thêm cho nó cái áo mưa cũ: Về nhanh kẻo mẹ mong. Bà ở nhà tối một chút cũng không sao.\n\nTí đi rồi, bà Năm ngồi lần mò trong bóng tối. Bà nhớ ông Năm — người đàn ông cả đời gắn với biển cả, đã ra đi trong một cơn bão cách đây mười năm. Chiếc đèn bão này là thứ ông luôn mang theo mỗi chuyến ra khơi, ông bảo: Có ánh đèn là có niềm tin, là còn đường về.\n\nNửa đêm, bão càng mạnh. Bà Năm lo cho nhà thằng Tí, bèn khoác áo mưa, lần từng bước trong gió bão sang nhà hàng xóm. Đến nơi, bà thấy mẹ con Tí đang co ro bên chiếc đèn bão, ánh sáng nhỏ nhoi mà ấm áp vô cùng. Bà Năm ngồi xuống cạnh họ, kể chuyện ngày xưa cho đến khi bão tan.\n\nSáng hôm sau, bão đi qua, nắng lên rực rỡ. Thằng Tí mang đèn sang trả, lí nhí: Con cảm ơn bà. Đêm qua mà không có đèn của bà, nhà con không biết xoay xở ra sao.\n\nBà Năm xoa đầu nó, cười hiền: Chiếc đèn này đã soi đường cho ông của bà trở về bao chuyến biển. Giờ nó lại sưởi ấm cho nhà con trong đêm bão. Ánh sáng cho đi là ánh sáng còn mãi, con ạ.\n\nCâu 1. Chiếc đèn bão trong truyện là kỉ vật của ai?", "options": ["A. Của bà Năm mua ở chợ", "B. Của ông Năm để lại từ thời còn đi biển", "C. Của mẹ thằng Tí", "D. Của hội từ thiện tặng"], "answer": "B", "explain": "Văn bản cho biết rõ: chiếc đèn bão là kỉ vật của ông Năm để lại từ thời còn đi biển, là thứ ông luôn mang theo mỗi chuyến ra khơi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC ĐÈN BÃO\n\nĐêm ấy, bão đổ bộ vào làng. Gió rít từng cơn, mưa quất vào mái nhà rào rào. Điện mất từ chập tối, cả làng chìm trong bóng tối mịt mùng.\n\nTrong căn nhà nhỏ cuối xóm, bà Năm thắp chiếc đèn bão cũ kĩ — kỉ vật của ông Năm để lại từ thời còn đi biển. Ánh đèn vàng vọt hắt lên khuôn mặt đầy nếp nhăn của bà, ấm áp lạ thường giữa đêm bão tố.\n\nBỗng có tiếng gõ cửa dồn dập. Thằng Tí, con nhà hàng xóm, hớt hải chạy vào, người ướt sũng: Bà Năm ơi, nhà con dột nát hết rồi, mẹ con đang che cho em bé, bà cho con mượn cái đèn với ạ!\n\nBà Năm không ngần ngại đưa ngay chiếc đèn bão cho Tí, còn dúi thêm cho nó cái áo mưa cũ: Về nhanh kẻo mẹ mong. Bà ở nhà tối một chút cũng không sao.\n\nTí đi rồi, bà Năm ngồi lần mò trong bóng tối. Bà nhớ ông Năm — người đàn ông cả đời gắn với biển cả, đã ra đi trong một cơn bão cách đây mười năm. Chiếc đèn bão này là thứ ông luôn mang theo mỗi chuyến ra khơi, ông bảo: Có ánh đèn là có niềm tin, là còn đường về.\n\nNửa đêm, bão càng mạnh. Bà Năm lo cho nhà thằng Tí, bèn khoác áo mưa, lần từng bước trong gió bão sang nhà hàng xóm. Đến nơi, bà thấy mẹ con Tí đang co ro bên chiếc đèn bão, ánh sáng nhỏ nhoi mà ấm áp vô cùng. Bà Năm ngồi xuống cạnh họ, kể chuyện ngày xưa cho đến khi bão tan.\n\nSáng hôm sau, bão đi qua, nắng lên rực rỡ. Thằng Tí mang đèn sang trả, lí nhí: Con cảm ơn bà. Đêm qua mà không có đèn của bà, nhà con không biết xoay xở ra sao.\n\nBà Năm xoa đầu nó, cười hiền: Chiếc đèn này đã soi đường cho ông của bà trở về bao chuyến biển. Giờ nó lại sưởi ấm cho nhà con trong đêm bão. Ánh sáng cho đi là ánh sáng còn mãi, con ạ.\n\nCâu 2. Vì sao thằng Tí sang nhà bà Năm trong đêm bão?", "options": ["A. Để chơi trốn tìm", "B. Để mượn chiếc đèn bão vì nhà bị dột nát, mất điện", "C. Để xin cơm ăn", "D. Để rủ bà Năm đi xem bão"], "answer": "B", "explain": "Nhà Tí dột nát, mẹ phải che cho em bé trong bóng tối nên Tí sang mượn đèn — chi tiết mở đầu cho hành động nhân ái của bà Năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC ĐÈN BÃO\n\nĐêm ấy, bão đổ bộ vào làng. Gió rít từng cơn, mưa quất vào mái nhà rào rào. Điện mất từ chập tối, cả làng chìm trong bóng tối mịt mùng.\n\nTrong căn nhà nhỏ cuối xóm, bà Năm thắp chiếc đèn bão cũ kĩ — kỉ vật của ông Năm để lại từ thời còn đi biển. Ánh đèn vàng vọt hắt lên khuôn mặt đầy nếp nhăn của bà, ấm áp lạ thường giữa đêm bão tố.\n\nBỗng có tiếng gõ cửa dồn dập. Thằng Tí, con nhà hàng xóm, hớt hải chạy vào, người ướt sũng: Bà Năm ơi, nhà con dột nát hết rồi, mẹ con đang che cho em bé, bà cho con mượn cái đèn với ạ!\n\nBà Năm không ngần ngại đưa ngay chiếc đèn bão cho Tí, còn dúi thêm cho nó cái áo mưa cũ: Về nhanh kẻo mẹ mong. Bà ở nhà tối một chút cũng không sao.\n\nTí đi rồi, bà Năm ngồi lần mò trong bóng tối. Bà nhớ ông Năm — người đàn ông cả đời gắn với biển cả, đã ra đi trong một cơn bão cách đây mười năm. Chiếc đèn bão này là thứ ông luôn mang theo mỗi chuyến ra khơi, ông bảo: Có ánh đèn là có niềm tin, là còn đường về.\n\nNửa đêm, bão càng mạnh. Bà Năm lo cho nhà thằng Tí, bèn khoác áo mưa, lần từng bước trong gió bão sang nhà hàng xóm. Đến nơi, bà thấy mẹ con Tí đang co ro bên chiếc đèn bão, ánh sáng nhỏ nhoi mà ấm áp vô cùng. Bà Năm ngồi xuống cạnh họ, kể chuyện ngày xưa cho đến khi bão tan.\n\nSáng hôm sau, bão đi qua, nắng lên rực rỡ. Thằng Tí mang đèn sang trả, lí nhí: Con cảm ơn bà. Đêm qua mà không có đèn của bà, nhà con hoi mà ấm áp vô cùng. Bà Năm ngồi xuống cạnh họ, kể chuyện ngày xưa cho đến khi bão tan.\n\nSáng hôm sau, bão đi qua, nắng lên rực rỡ. Thằng Tí mang đèn sang trả, lí nhí: Con cảm ơn bà. Đêm qua mà không có đèn của bà, nhà con không biết xoay xở ra sao.\n\nBà Năm xoa đầu nó, cười hiền: Chiếc đèn này đã soi đường cho ông của bà trở về bao chuyến biển. Giờ nó lại sưởi ấm cho nhà con trong đêm bão. Ánh sáng cho đi là ánh sáng còn mãi, con ạ.\n\nCâu 4. Lời bà Năm dặn Tí \"Ánh sáng cho đi là ánh sáng còn mãi\" thể hiện triết lí sống nào?", "options": ["A. Nên tiết kiệm điện trong mùa bão", "B. Sự sẻ chia, giúp đỡ người khác làm cho giá trị tốt đẹp lan tỏa và còn mãi", "C. Đèn bão là tài sản phải giữ gìn cẩn thận", "D. Người già thường thích nói những lời khó hiểu"], "answer": "B", "explain": "Triết lí giản dị mà sâu sắc: những gì ta cho đi bằng tấm lòng sẽ không mất đi mà còn lan tỏa, sưởi ấm nhiều người — đó là vẻ đẹp của sự sẻ chia.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHIẾC ĐÈN BÃO\n\nĐêm ấy, bão đổ bộ vào làng. Gió rít từng cơn, mưa quất vào mái nhà rào rào. Điện mất từ chập tối, cả làng chìm trong bóng tối mịt mùng.\n\nTrong căn nhà nhỏ cuối xóm, bà Năm thắp chiếc đèn bão cũ kĩ — kỉ vật của ông Năm để lại từ thời còn đi biển. Ánh đèn vàng vọt hắt lên khuôn mặt đầy nếp nhăn của bà, ấm áp lạ thường giữa đêm bão tố.\n\nBỗng có tiếng gõ cửa dồn dập. Thằng Tí, con nhà hàng xóm, hớt hải chạy vào, người ướt sũng: Bà Năm ơi, nhà con dột nát hết rồi, mẹ con đang che cho em bé, bà cho con mượn cái đèn với ạ!\n\nBà Năm không ngần ngại đưa ngay chiếc đèn bão cho Tí, còn dúi thêm cho nó cái áo mưa cũ: Về nhanh kẻo mẹ mong. Bà ở nhà tối một chút cũng không sao.\n\nTí đi rồi, bà Năm ngồi lần mò trong bóng tối. Bà nhớ ông Năm — người đàn ông cả đời gắn với biển cả, đã ra đi trong một cơn bão cách đây mười năm. Chiếc đèn bão này là thứ ông luôn mang theo mỗi chuyến ra khơi, ông bảo: Có ánh đèn là có niềm tin, là còn đường về.\n\nNửa đêm, bão càng mạnh. Bà Năm lo cho nhà thằng Tí, bèn khoác áo mưa, lần từng bước trong gió bão sang nhà hàng xóm. Đến nơi, bà thấy mẹ con Tí đang co ro bên chiếc đèn bão, ánh sáng nhỏ nhoi mà ấm áp vô cùng. Bà Năm ngồi xuống cạnh họ, kể chuyện ngày xưa cho đến khi bão tan.\n\nSáng hôm sau, bão đi qua, nắng lên rực rỡ. Thằng Tí mang đèn sang trả, lí nhí: Con cảm ơn bà. Đêm qua mà không có đèn của bà, nhà con không biết xoay xở ra sao.\n\nBà Năm xoa đầu nó, cười hiền: Chiếc đèn này đã soi đường cho ông của bà trở về bao chuyến biển. Giờ nó lại sưởi ấm cho nhà con trong đêm bão. Ánh sáng cho đi là ánh sáng còn mãi, con ạ.\n\nCâu 5. Qua hình ảnh chiếc đèn bão, em rút ra bài học gì về sự sẻ chia trong cuộc sống? (Trả lời ngắn gọn)", "answer": "Biết sẻ chia, giúp đỡ người khác trong lúc khó khăn", "explain": "Chấp nhận các cách diễn đạt tương đương: hãy sẵn sàng chia sẻ những gì mình có, dù nhỏ bé, với người đang cần; sự sẻ chia làm cho cuộc sống ấm áp hơn; cho đi là còn mãi.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về tinh thần tương thân tương ái của dân tộc ta.", "explain": "DÀN Ý:\n1. Mở đoạn: tương thân tương ái là truyền thống quý báu của dân tộc Việt Nam.\n2. Thân đoạn: (a) Biểu hiện: lá lành đùm lá rách, giúp đỡ nhau trong thiên tai, hoạn nạn như bà Năm cho mượn đèn bão trong đêm bão; (b) Ý nghĩa: sức mạnh đoàn kết giúp dân tộc vượt qua mọi khó khăn; (c) Phê phán thói ích kỉ, vô cảm.\n3. Kết đoạn: mỗi người hãy phát huy truyền thống tốt đẹp ấy.\n\nBÀI MẪU:\nTương thân tương ái là truyền thống quý báu đã ăn sâu vào máu thịt của dân tộc Việt Nam qua hàng nghìn năm lịch sử. Truyền thống ấy thể hiện qua đạo lí lá lành đùm lá rách, qua những hành động giúp đỡ nhau trong lúc khó khăn, hoạn nạn — như bà Năm trong truyện đã không ngần ngại trao chiếc đèn bão quý giá cho nhà hàng xóm trong đêm bão tố, rồi còn sang tận nơi động viên mẹ con họ. Chính tinh thần đoàn kết, đùm bọc ấy đã tạo nên sức mạnh giúp dân tộc ta vượt qua biết bao thiên tai, địch họa. Trong cuộc sống hôm nay, truyền thống tương thân tương ái tiếp tục tỏa sáng qua những chuyến xe cứu trợ vùng lũ, những suất cơm từ thiện, những ngôi nhà tình nghĩa. Ngược lại, thói ích kỉ, vô cảm, quay lưng trước nỗi khổ của đồng bào là điều đáng lên án. Bởi vậy, mỗi chúng ta, nhất là thế hệ trẻ, hãy ra sức phát huy truyền thống tốt đẹp này bằng những việc làm cụ thể, để tình người Việt Nam mãi ấm áp, lan tỏa.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích ý nghĩa biểu tượng của hình ảnh chiếc đèn bão trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và hình ảnh chiếc đèn bão — chi tiết trung tâm, giàu ý nghĩa biểu tượng.\nII. Thân bài:\n1. Ý nghĩa tả thực: chiếc đèn cũ kĩ, kỉ vật của ông Năm — vật dụng thiết yếu trong đêm bão mất điện.\n2. Ý nghĩa biểu tượng:\n   a. Biểu tượng của niềm tin, hy vọng: lời ông Năm dặn — có ánh đèn là còn đường về; ánh đèn sưởi ấm mẹ con Tí trong đêm bão.\n   b. Biểu tượng của tình người, sự sẻ chia: bà Năm trao đèn cho hàng xóm; ánh sáng cho đi là ánh sáng còn mãi.\n   c. Biểu tượng của sự tiếp nối truyền thống: từ ông Năm đến bà Năm đến thằng Tí — ngọn lửa nhân ái được trao truyền.\n3. Nghệ thuật: xây dựng hình ảnh biểu tượng qua chi tiết cụ thể, giàu sức gợi; kết hợp miêu tả và triết lí; giọng văn trầm ấm.\nIII. Kết bài: khẳng định giá trị của hình ảnh biểu tượng; gợi bài học về niềm tin và sự sẻ chia.\n\nĐOẠN MẪU (mở bài):\nTrong truyện ngắn Chiếc đèn bão, bên cạnh cốt truyện giản dị, cảm động, hình ảnh chiếc đèn bão hiện lên như một biểu tượng nghệ thuật đặc sắc, chuyên chở những thông điệp sâu xa về niềm tin, hy vọng và tình người. Từ một vật dụng quen thuộc trong đời sống, chiếc đèn đã được nhà văn nâng lên thành biểu tượng giàu sức gợi, để lại ấn tượng khó phai trong lòng người đọc.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVƯỜN RAU CỦA MẸ\n\nSau nhà tôi có một mảnh vườn nhỏ, là cả gia tài tinh thần của mẹ. Mảnh vườn không lớn nhưng lúc nào cũng xanh tốt: rau muống, rau dền, mồng tơi, thêm giàn mướp hương và mấy gốc ớt chỉ thiên đỏ rực.\n\nMỗi sáng, mẹ ra vườn từ lúc trời còn tờ mờ. Mẹ cuốc đất, nhổ cỏ, bắt sâu bằng tay chứ nhất quyết không phun thuốc. Mẹ bảo: Rau nhà mình trồng cho cả nhà ăn, phải sạch thì mới yên tâm.\n\nTôi từng thắc mắc: Ngoài chợ rau rẻ lắm, mẹ trồng làm gì cho vất vả? Mẹ cười: Trồng rau không chỉ để ăn con ạ. Nhìn mầm xanh nhú lên mỗi sáng, mẹ thấy lòng nhẹ nhõm. Vả lại, rau nhà mình ăn ngọt hơn, thơm hơn rau chợ nhiều.\n\nCó đợt tôi ốm phải nghỉ học cả tuần. Mẹ nấu cháo, hái nắm rau dền nấu canh, ép nước rau má cho tôi uống. Mẹ thức trông tôi cả đêm, sáng ra mắt đỏ hoe mà vẫn ra vườn tưới rau đúng giờ. Tôi khỏi ốm, mẹ gầy rộc đi trông thấy.\n\nLên đại học, tôi đi học xa nhà. Mỗi lần về, mẹ lại hái đầy một túi rau sạch dúi vào ba lô: Mang lên mà ăn, rau chợ không sạch đâu con. Tôi mang rau đi chia cho bạn cùng phòng, đứa nào cũng khen rau ngon, hỏi mua ở đâu. Tôi tự hào: Rau mẹ tớ trồng đấy!\n\nHè vừa rồi, tôi đề nghị thuê người làm vườn để mẹ đỡ vất vả. Mẹ lắc đầu: Mẹ còn khỏe, còn làm được. Với lại, xa vườn một ngày là mẹ nhớ. Mảnh vườn này gắn với mẹ cả đời rồi, bỏ sao được.\n\nNhìn dáng mẹ lom khom bên luống rau xanh mướt, tôi chợt hiểu: với mẹ, vườn rau không chỉ là nơi trồng trọt mà còn là niềm vui, là tình yêu thương mẹ vun trồng mỗi ngày cho gia đình. Những luống rau xanh ấy chính là hình ảnh của mẹ — bình dị, cần mẫn và đầy ắp yêu thương.\n\nCâu 1. Vì sao mẹ nhất quyết không phun thuốc trừ sâu cho vườn rau?", "options": ["A. Vì thuốc trừ sâu đắt tiền", "B. Vì rau trồng cho cả nhà ăn nên phải sạch mới yên tâm", "C. Vì mẹ không biết cách phun thuốc", "D. Vì sâu trong vườn quá ít"], "answer": "B", "explain": "Mẹ nói rõ: rau nhà mình trồng cho cả nhà ăn, phải sạch thì mới yên tâm — thể hiện sự cẩn thận, tình thương và trách nhiệm của người mẹ với sức khỏe gia đình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVƯỜN RAU CỦA MẸ\n\nSau nhà tôi có một mảnh vườn nhỏ, là cả gia tài tinh thần của mẹ. Mảnh vườn không lớn nhưng lúc nào cũng xanh tốt: rau muống, rau dền, mồng tơi, thêm giàn mướp hương và mấy gốc ớt chỉ thiên đỏ rực.\n\nMỗi sáng, mẹ ra vườn từ lúc trời còn tờ mờ. Mẹ cuốc đất, nhổ cỏ, bắt sâu bằng tay chứ nhất quyết không phun thuốc. Mẹ bảo: Rau nhà mình trồng cho cả nhà ăn, phải sạch thì mới yên tâm.\n\nTôi từng thắc mắc: Ngoài chợ rau rẻ lắm, mẹ trồng làm gì cho vất vả? Mẹ cười: Trồng rau không chỉ để ăn con ạ. Nhìn mầm xanh nhú lên mỗi sáng, mẹ thấy lòng nhẹ nhõm. Vả lại, rau nhà mình ăn ngọt hơn, thơm hơn rau chợ nhiều.\n\nCó đợt tôi ốm phải nghỉ học cả tuần. Mẹ nấu cháo, hái nắm rau dền nấu canh, ép nước rau má cho tôi uống. Mẹ thức trông tôi cả đêm, sáng ra mắt đỏ hoe mà vẫn ra vườn tưới rau đúng giờ. Tôi khỏi ốm, mẹ gầy rộc đi trông thấy.\n\nLên đại học, tôi đi học xa nhà. Mỗi lần về, mẹ lại hái đầy một túi rau sạch dúi vào ba lô: Mang lên mà ăn, rau chợ không sạch đâu con. Tôi mang rau đi chia cho bạn cùng phòng, đứa nào cũng khen rau ngon, hỏi mua ở đâu. Tôi tự hào: Rau mẹ tớ trồng đấy!\n\nHè vừa rồi, tôi đề nghị thuê người làm vườn để mẹ đỡ vất vả. Mẹ lắc đầu: Mẹ còn khỏe, còn làm được. Với lại, xa vườn một ngày là mẹ nhớ. Mảnh vườn này gắn với mẹ cả đời rồi, bỏ sao được.\n\nNhìn dáng mẹ lom khom bên luống rau xanh mướt, tôi chợt hiểu: với mẹ, vườn rau không chỉ là nơi trồng trọt mà còn là niềm vui, là tình yêu thương mẹ vun trồng mỗi ngày cho gia đình. Những luống rau xanh ấy chính là hình ảnh của mẹ — bình dị, cần mẫn và đầy ắp yêu thương.\n\nCâu 2. Người kể chuyện trong văn bản là ai?", "options": ["A. Người mẹ", "B. Người con (xưng tôi)", "C. Người hàng xóm", "D. Người kể giấu mình"], "answer": "B", "explain": "Người kể xưng tôi, là người con trong gia đình, kể lại câu chuyện về mẹ và vườn rau bằng giọng điệu yêu thương, trân trọng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVƯỜN RAU CỦA MẸ\n\nSau nhà tôi có một mảnh vườn nhỏ, là cả gia tài tinh thần của mẹ. Mảnh vườn không lớn nhưng lúc nào cũng xanh tốt: rau muống, rau dền, mồng tơi, thêm giàn mướp hương và mấy gốc ớt chỉ thiên đỏ rực.\n\nMỗi sáng, mẹ ra vườn từ lúc trời còn tờ mờ. Mẹ cuốc đất, nhổ cỏ, bắt sâu bằng tay chứ nhất quyết không phun thuốc. Mẹ bảo: Rau nhà mình trồng cho cả nhà ăn, phải sạch thì mới yên tâm.\n\nTôi từng thắc mắc: Ngoài chợ rau rẻ lắm, mẹ trồng làm gì cho vất vả? Mẹ cười: Trồng rau không chỉ để ăn con ạ. Nhìn mầm xanh nhú lên mỗi sáng, mẹ thấy lòng nhẹ nhõm. Vả lại, rau nhà mình ăn ngọt hơn, thơm hơn rau chợ nhiều.\n\nCó đợt tôi ốm phải nghỉ học cả tuần. Mẹ nấu cháo, hái nắm rau dền nấu canh, ép nước rau má cho tôi uống. Mẹ thức trông tôi cả đêm, sáng ra mắt đỏ hoe mà vẫn ra vườn tưới rau đúng giờ. Tôi khỏi ốm, mẹ gầy rộc đi trông thấy.\n\nLên đại học, tôi đi học xa nhà. Mỗi lần về, mẹ lại hái đầy một túi rau sạch dúi vào ba lô: Mang lên mà ăn, rau chợ không sạch đâu con. Tôi mang rau đi chia cho bạn cùng phòng, đứa nào cũng khen rau ngon, hỏi mua ở đâu. Tôi tự hào: Rau mẹ tớ trồng đấy!\n\nHè vừa rồi, tôi đề nghị thuê người làm vườn để mẹ đỡ vất vả. Mẹ lắc đầu: Mẹ còn khỏe, còn làm được. Với lại, xa vườn một ngày là mẹ nhớ. Mảnh vườn này gắn với mẹ cả đời rồi, bỏ sao được.\n\nNhìn dáng mẹ lom khom bên luống rau xanh mướt, tôi chợt hiểu: với mẹ, vườn rau không chỉ là nơi trồng trọt mà còn là niềm vui, là tình yêu thương mẹ vun trồng mỗi ngày cho gia đình. Những luống rau xanh ấy chính là hình ảnh của mẹ — bình dị, cần mẫn và đầy ắp yêu thương.\n\nCâu 3. Chi tiết mẹ thức trông con ốm cả đêm mà sáng vẫn ra vườn tưới rau đúng giờ cho thấy điều gì?", "options": ["A. Mẹ là người máy móc, cứng nhắc trong sinh hoạt", "B. Mẹ quá coi trọng vườn rau hơn sức khỏe bản thân", "C. Đức tính cần mẫn, giàu đức hy sinh của người mẹ: lo cho con mà vẫn chu toàn công việc", "D. Mẹ không tin tưởng ai chăm sóc vườn rau"], "answer": "C", "explain": "Chi tiết cho thấy sự tần tảo, hy sinh của mẹ: dù thức trắng đêm chăm con ốm, mẹ vẫn không bỏ bê vườn rau — vừa thương con vừa có trách nhiệm với công việc, với gia đình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVƯỜN RAU CỦA MẸ\n\nSau nhà tôi có một mảnh vườn nhỏ, là cả gia tài tinh thần của mẹ. Mảnh vườn không lớn nhưng lúc nào cũng xanh tốt: rau muống, rau dền, mồng tơi, thêm giàn mướp hương và mấy gốc ớt chỉ thiên đỏ rực.\n\nMỗi sáng, mẹ ra vườn từ lúc trời còn tờ mờ. Mẹ cuốc đất, nhổ cỏ, bắt sâu bằng tay chứ nhất quyết không phun thuốc. Mẹ bảo: Rau nhà mình trồng cho cả nhà ăn, phải sạch thì mới yên tâm.\n\nTôi từng thắc mắc: Ngoài chợ rau rẻ lắm, mẹ trồng làm gì cho vất vả? Mẹ cười: Trồng rau không chỉ để ăn con ạ. Nhìn mầm xanh nhú lên mỗi sáng, mẹ thấy lòng nhẹ nhõm. Vả lại, rau nhà mình ăn ngọt hơn, thơm hơn rau chợ nhiều.\n\nCó đợt tôi ốm phải nghỉ học cả tuần. Mẹ nấu cháo, hái nắm rau dền nấu canh, ép nước rau má cho tôi uống. Mẹ thức trông tôi cả đêm, sáng ra mắt đỏ hoe mà vẫn ra vườn tưới rau đúng giờ. Tôi khỏi ốm, mẹ gầy rộc đi trông thấy.\n\nLên đại học, tôi đi học xa nhà. Mỗi lần về, mẹ lại hái đầy một túi rau sạch dúi vào ba lô: Mang lên mà ăn, rau chợ không sạch đâu con. Tôi mang rau đi chia cho bạn cùng phòng, đứa nào cũng khen rau ngon, hỏi mua ở đâu. Tôi tự hào: Rau mẹ tớ trồng đấy!\n\nHè vừa rồi, tôi đề nghị thuê người làm vườn để mẹ đỡ vất vả. Mẹ lắc đầu: Mẹ còn khỏe, còn làm được. Với lại, xa vườn một ngày là mẹ nhớ. Mảnh vườn này gắn với mẹ cả đời rồi, bỏ sao được.\n\nNhìn dáng mẹ lom khom bên luống rau xanh mướt, tôi chợt hiểu: với mẹ, vườn rau không chỉ là nơi trồng trọt mà còn là niềm vui, là tình yêu thương mẹ vun trồng mỗi ngày cho gia đình. Những luống rau xanh ấy chính là hình ảnh của mẹ — bình dị, cần mẫn và đầy ắp yêu thương.\n\nCâu 4. Câu văn \"Những luống rau xanh ấy chính là hình ảnh của mẹ — bình dị, cần mẫn và đầy ắp yêu thương\" sử dụng biện pháp tu từ nào?", "options": ["A. So sánh", "B. Nhân hóa", "C. Ẩn dụ — lấy luống rau xanh để chỉ phẩm chất của mẹ", "D. Nói quá"], "answer": "C", "explain": "Tác giả không so sánh trực tiếp bằng từ như mà đồng nhất luống rau xanh với hình ảnh người mẹ — đó là ẩn dụ, qua đó khắc họa phẩm chất bình dị, cần mẫn, giàu yêu thương của mẹ.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVƯỜN RAU CỦA MẸ\n\nSau nhà tôi có một mảnh vườn nhỏ, là cả gia tài tinh thần của mẹ. Mảnh vườn không lớn nhưng lúc nào cũng xanh tốt: rau muống, rau dền, mồng tơi, thêm giàn mướp hương và mấy gốc ớt chỉ thiên đỏ rực.\n\nMỗi sáng, mẹ ra vườn từ lúc trời còn tờ mờ. Mẹ cuốc đất, nhổ cỏ, bắt sâu bằng tay chứ nhất quyết không phun thuốc. Mẹ bảo: Rau nhà mình trồng cho cả nhà ăn, phải sạch thì mới yên tâm.\n\nTôi từng thắc mắc: Ngoài chợ rau rẻ lắm, mẹ trồng làm gì cho vất vả? Mẹ cười: Trồng rau không chỉ để ăn con ạ. Nhìn mầm xanh nhú lên mỗi sáng, mẹ thấy lòng nhẹ nhõm. Vả lại, rau nhà mình ăn ngọt hơn, thơm hơn rau chợ nhiều.\n\nCó đợt tôi ốm phải nghỉ học cả tuần. Mẹ nấu cháo, hái nắm rau dền nấu canh, ép nước rau má cho tôi uống. Mẹ thức trông tôi cả đêm, sáng ra mắt đỏ hoe mà vẫn ra vườn tưới rau đúng giờ. Tôi khỏi ốm, mẹ gầy rộc đi trông thấy.\n\nLên đại học, tôi đi học xa nhà. Mỗi lần về, mẹ lại hái đầy một túi rau sạch dúi vào ba lô: Mang lên mà ăn, rau chợ không sạch đâu con. Tôi mang rau đi chia cho bạn cùng phòng, đứa nào cũng khen rau ngon, hỏi mua ở đâu. Tôi tự hào: Rau mẹ tớ trồng đấy!\n\nHè vừa rồi, tôi đề nghị thuê người làm vườn để mẹ đỡ vất vả. Mẹ lắc đầu: Mẹ còn khỏe, còn làm được. Với lại, xa vườn một ngày là mẹ nhớ. Mảnh vườn này gắn với mẹ cả đời rồi, bỏ sao được.\n\nNhìn dáng mẹ lom khom bên luống rau xanh mướt, tôi chợt hiểu: với mẹ, vườn rau không chỉ là nơi trồng trọt mà còn là niềm vui, là tình yêu thương mẹ vun trồng mỗi ngày cho gia đình. Những luống rau xanh ấy chính là hình ảnh của mẹ — bình dị, cần mẫn và đầy ắp yêu thương.\n\nCâu 5. Qua văn bản, em cảm nhận được điều gì về tình mẫu tử? (Trả lời ngắn gọn)", "answer": "Tình mẹ bao la, hy sinh thầm lặng vì con", "explain": "Chấp nhận các cách diễn đạt tương đương: tình mẫu tử thiêng liêng, mẹ luôn hy sinh, chăm lo cho con bằng những việc làm bình dị nhất; con cái cần biết ơn và hiếu thảo với mẹ.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về công ơn của cha mẹ và bổn phận của con cái.", "explain": "DÀN Ý:\n1. Mở đoạn: công cha nghĩa mẹ là thiêng liêng, to lớn không gì sánh được.\n2. Thân đoạn: (a) Công ơn: cha mẹ sinh thành, nuôi dưỡng, hy sinh cả cuộc đời vì con như người mẹ tần tảo với vườn rau; (b) Bổn phận con cái: hiếu thảo, chăm ngoan, học giỏi, phụng dưỡng khi cha mẹ già yếu; (c) Phê phán thói vô ơn, bất hiếu.\n3. Kết đoạn: hãy báo hiếu ngay từ hôm nay bằng hành động cụ thể.\n\nBÀI MẪU:\nCông cha như núi Thái Sơn, nghĩa mẹ như nước trong nguồn chảy ra — công ơn sinh thành, dưỡng dục của cha mẹ là thiêng liêng và to lớn không gì có thể sánh được. Cha mẹ đã hy sinh cả tuổi xuân, sức khỏe để nuôi ta khôn lớn: người mẹ trong truyện tần tảo với vườn rau, thức trắng đêm chăm con ốm; người cha lặn lội mưu sinh vì tương lai của con. Tất cả những hy sinh thầm lặng ấy đều xuất phát từ tình thương vô bờ bến. Vì vậy, bổn phận của mỗi người con là phải biết hiếu thảo: chăm ngoan, học giỏi để cha mẹ vui lòng; biết đỡ đần việc nhà; và khi cha mẹ già yếu, phải hết lòng phụng dưỡng. Đáng phê phán là những kẻ vô ơn, bất hiếu, coi sự hy sinh của cha mẹ là điều hiển nhiên, thậm chí ngược đãi đấng sinh thành. Hiếu thảo không phải là điều gì to tát — đôi khi chỉ là một lời hỏi han, một việc làm đỡ đần, một sự cố gắng trong học tập. Hãy báo hiếu ngay từ hôm nay, đừng để đến khi cha mẹ không còn mới hối tiếc.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích hình tượng người mẹ trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và hình tượng người mẹ — hiện thân của vẻ đẹp người phụ nữ Việt Nam bình dị, tần tảo.\nII. Thân bài:\n1. Chân dung: dáng lom khom bên luống rau, dậy từ tờ mờ sáng — người phụ nữ lao động cần cù.\n2. Phẩm chất:\n   a. Cần mẫn, cẩn thận: tự tay chăm vườn rau, không phun thuốc vì sức khỏe cả nhà.\n   b. Giàu đức hy sinh: thức trắng đêm chăm con ốm, gầy rộc đi mà không một lời than vãn.\n   c. Yêu thương con vô bờ: hái rau dúi vào ba lô con đi học xa; coi vườn rau là niềm vui vun trồng cho gia đình.\n   d. Gắn bó với quê hương, với lao động: từ chối thuê người làm vườn — tình yêu lao động chân chính.\n3. Nghệ thuật: ngôi kể thứ nhất (người con) tạo sự chân thực, xúc động; khắc họa qua việc làm, lời nói; hình ảnh vườn rau là biểu tượng giàu sức gợi; giọng văn nhẹ nhàng, đầy yêu thương.\nIII. Kết bài: khẳng định vẻ đẹp của người mẹ Việt Nam; gợi bài học biết ơn, hiếu thảo.\n\nĐOẠN MẪU (mở bài):\nNếu phải tìm một hình ảnh đẹp nhất về người phụ nữ Việt Nam, có lẽ đó là hình ảnh người mẹ tần tảo, hy sinh thầm lặng vì chồng con. Truyện ngắn Vườn rau của mẹ đã khắc họa thành công hình tượng ấy qua người mẹ bình dị gắn bó với mảnh vườn xanh — nơi bà vun trồng không chỉ rau trái mà cả tình yêu thương dành cho gia đình, để lại trong lòng người đọc niềm xúc động và biết ơn sâu sắc.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTIẾNG ĐÀN\n\nCuối xóm có một cậu bé tên Khôi, bị mù từ nhỏ do một cơn bạo bệnh. Nhà nghèo, Khôi không được đến trường như bạn bè cùng trang lứa, suốt ngày chỉ quanh quẩn trong căn nhà nhỏ.\n\nMột hôm, có đoàn từ thiện về làng tặng quà. Trong đống quà, Khôi ôm khư khư một cây đàn ghi ta cũ — món quà mà chẳng ai ngờ tới. Từ hôm đó, cậu bé mù miệt mài tập đàn. Ban đầu, những ngón tay nhỏ bé lóng ngóng, tiếng đàn chói tai, đứt quãng. Hàng xóm ai cũng lắc đầu: Thằng bé mù mà đòi chơi đàn, thật là...\n\nNhưng Khôi không nản. Cậu nhờ anh thanh niên trong xóm dạy những hợp âm cơ bản, rồi tự mày mò hàng giờ mỗi ngày. Đôi tai tinh nhạy của người khiếm thị giúp Khôi cảm nhận âm thanh một cách đặc biệt. Dần dần, tiếng đàn của cậu trở nên mượt mà, có hồn.\n\nMột buổi chiều, cả xóm sững sờ khi nghe từ căn nhà nhỏ vang lên bản nhạc du dương, da diết. Tiếng đàn như kể về nỗi buồn của cậu bé không nhìn thấy ánh sáng, nhưng cũng đầy khát khao vươn tới những điều tốt đẹp. Mấy bà, mấy chị dừng việc đồng áng, đứng lặng nghe.\n\nTừ đó, mỗi tối, tiếng đàn của Khôi lại vang lên, xua tan mệt nhọc của cả xóm sau một ngày lao động. Người ta bảo nhau: Thằng Khôi mù mà tài thật. Còn Khôi thì cười hiền: Cháu không nhìn thấy mọi người, nhưng cháu nghe được tiếng vỗ tay, thế là vui rồi.\n\nNăm Khôi mười lăm tuổi, cậu được mời biểu diễn trong chương trình văn nghệ của huyện. Đêm ấy, dưới ánh đèn sân khấu, cậu bé mù ôm đàn, chơi một bản nhạc do chính mình sáng tác — bản nhạc về quê hương, về những người thân yêu. Cả hội trường lặng đi rồi vỡ òa trong tiếng vỗ tay không dứt.\n\nTrên đường về, Khôi nói với mẹ: Mẹ ơi, tuy con không nhìn thấy ánh sáng, nhưng âm nhạc đã cho con thấy cả thế giới. Người mẹ ôm chặt con vào lòng, nước mắt hạnh phúc lăn dài trên má.\n\nCâu 1. Khôi bị mù từ nhỏ vì nguyên nhân nào?", "options": ["A. Bị tai nạn giao thông", "B. Do một cơn bạo bệnh", "C. Bẩm sinh", "D. Do di chứng chiến tranh"], "answer": "B", "explain": "Văn bản cho biết rõ: Khôi bị mù từ nhỏ do một cơn bạo bệnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTIẾNG ĐÀN\n\nCuối xóm có một cậu bé tên Khôi, bị mù từ nhỏ do một cơn bạo bệnh. Nhà nghèo, Khôi không được đến trường như bạn bè cùng trang lứa, suốt ngày chỉ quanh quẩn trong căn nhà nhỏ.\n\nMột hôm, có đoàn từ thiện về làng tặng quà. Trong đống quà, Khôi ôm khư khư một cây đàn ghi ta cũ — món quà mà chẳng ai ngờ tới. Từ hôm đó, cậu bé mù miệt mài tập đàn. Ban đầu, những ngón tay nhỏ bé lóng ngóng, tiếng đàn chói tai, đứt quãng. Hàng xóm ai cũng lắc đầu: Thằng bé mù mà đòi chơi đàn, thật là...\n\nNhưng Khôi không nản. Cậu nhờ anh thanh niên trong xóm dạy những hợp âm cơ bản, rồi tự mày mò hàng giờ mỗi ngày. Đôi tai tinh nhạy của người khiếm thị giúp Khôi cảm nhận âm thanh một cách đặc biệt. Dần dần, tiếng đàn của cậu trở nên mượt mà, có hồn.\n\nMột buổi chiều, cả xóm sững sờ khi nghe từ căn nhà nhỏ vang lên bản nhạc du dương, da diết. Tiếng đàn như kể về nỗi buồn của cậu bé không nhìn thấy ánh sáng, nhưng cũng đầy khát khao vươn tới những điều tốt đẹp. Mấy bà, mấy chị dừng việc đồng áng, đứng lặng nghe.\n\nTừ đó, mỗi tối, tiếng đàn của Khôi lại vang lên, xua tan mệt nhọc của cả xóm sau một ngày lao động. Người ta bảo nhau: Thằng Khôi mù mà tài thật. Còn Khôi thì cười hiền: Cháu không nhìn thấy mọi người, nhưng cháu nghe được tiếng vỗ tay, thế là vui rồi.\n\nNăm Khôi mười lăm tuổi, cậu được mời biểu diễn trong chương trình văn nghệ của huyện. Đêm ấy, dưới ánh đèn sân khấu, cậu bé mù ôm đàn, chơi một bản nhạc do chính mình sáng tác — bản nhạc về quê hương, về những người thân yêu. Cả hội trường lặng đi rồi vỡ òa trong tiếng vỗ tay không dứt.\n\nTrên đường về, Khôi nói với mẹ: Mẹ ơi, tuy con không nhìn thấy ánh sáng, nhưng âm nhạc đã cho con thấy cả thế giới. Người mẹ ôm chặt con vào lòng, nước mắt hạnh phúc lăn dài trên má.\n\nCâu 2. Ai đã dạy Khôi những hợp âm ghi ta cơ bản?", "options": ["A. Thầy giáo dạy nhạc ở trường", "B. Một nghệ sĩ nổi tiếng", "C. Anh thanh niên trong xóm", "D. Mẹ của Khôi"], "answer": "C", "explain": "Văn bản viết: cậu nhờ anh thanh niên trong xóm dạy những hợp âm cơ bản, rồi tự mày mò hàng giờ mỗi ngày.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTIẾNG ĐÀN\n\nCuối xóm có một cậu bé tên Khôi, bị mù từ nhỏ do một cơn bạo bệnh. Nhà nghèo, Khôi không được đến trường như bạn bè cùng trang lứa, suốt ngày chỉ quanh quẩn trong căn nhà nhỏ.\n\nMột hôm, có đoàn từ thiện về làng tặng quà. Trong đống quà, Khôi ôm khư khư một cây đàn ghi ta cũ — món quà mà chẳng ai ngờ tới. Từ hôm đó, cậu bé mù miệt mài tập đàn. Ban đầu, những ngón tay nhỏ bé lóng ngóng, tiếng đàn chói tai, đứt quãng. Hàng xóm ai cũng lắc đầu: Thằng bé mù mà đòi chơi đàn, thật là...\n\nNhưng Khôi không nản. Cậu nhờ anh thanh niên trong xóm dạy những hợp âm cơ bản, rồi tự mày mò hàng giờ mỗi ngày. Đôi tai tinh nhạy của người khiếm thị giúp Khôi cảm nhận âm thanh một cách đặc biệt. Dần dần, tiếng đàn của cậu trở nên mượt mà, có hồn.\n\nMột buổi chiều, cả xóm sững sờ khi nghe từ căn nhà nhỏ vang lên bản nhạc du dương, da diết. Tiếng đàn như kể về nỗi buồn của cậu bé không nhìn thấy ánh sáng, nhưng cũng đầy khát khao vươn tới những điều tốt đẹp. Mấy bà, mấy chị dừng việc đồng áng, đứng lặng nghe.\n\nTừ đó, mỗi tối, tiếng đàn của Khôi lại vang lên, xua tan mệt nhọc của cả xóm sau một ngày lao động. Người ta bảo nhau: Thằng Khôi mù mà tài thật. Còn Khôi thì cười hiền: Cháu không nhìn thấy mọi người, nhưng cháu nghe được tiếng vỗ tay, thế là vui rồi.\n\nNăm Khôi mười lăm tuổi, cậu được mời biểu diễn trong chương trình văn nghệ của huyện. Đêm ấy, dưới ánh đèn sân khấu, cậu bé mù ôm đàn, chơi một bản nhạc do chính mình sáng tác — bản nhạc về quê hương, về những người thân yêu. Cả hội trường lặng đi rồi vỡ òa trong tiếng vỗ tay không dứt.\n\nTrên đường về, Khôi nói với mẹ: Mẹ ơi, tuy con không nhìn thấy ánh sáng, nhưng âm nhạc đã cho con thấy cả thế giới. Người mẹ ôm chặt con vào lòng, nước mắt hạnh phúc lăn dài trên má.\n\nCâu 3. Chi tiết ban đầu hàng xóm lắc đầu: Thằng bé mù mà đòi chơi đàn có tác dụng gì?", "options": ["A. Cho thấy hàng xóm là người xấu, hay chê bai", "B. Làm nổi bật sự nghi ngờ của mọi người, từ đó tôn lên nghị lực phi thường của Khôi khi cậu thành công", "C. Chứng tỏ chơi đàn là việc quá khó", "D. Gợi sự thương hại đối với Khôi"], "answer": "B", "explain": "Sự hoài nghi ban đầu tạo tương phản với thành công sau này, làm nổi bật nghị lực vượt lên số phận của Khôi — thủ pháp tương phản quen thuộc trong xây dựng nhân vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTIẾNG ĐÀN\n\nCuối xóm có một cậu bé tên Khôi, bị mù từ nhỏ do một cơn bạo bệnh. Nhà nghèo, Khôi không được đến trường như bạn bè cùng trang lứa, suốt ngày chỉ quanh quẩn trong căn nhà nhỏ.\n\nMột hôm, có đoàn từ thiện về làng tặng quà. Trong đống quà, Khôi ôm khư khư một cây đàn ghi ta cũ — món quà mà chẳng ai ngờ tới. Từ hôm đó, cậu bé mù miệt mài tập đàn. Ban đầu, những ngón tay nhỏ bé lóng ngóng, tiếng đàn chói tai, đứt quãng. Hàng xóm ai cũng lắc đầu: Thằng bé mù mà đòi chơi đàn, thật là...\n\nNhưng Khôi không nản. Cậu nhờ anh thanh niên trong xóm dạy những hợp âm cơ bản, rồi tự mày mò hàng giờ mỗi ngày. Đôi tai tinh nhạy của người khiếm thị giúp Khôi cảm nhận âm thanh một cách đặc biệt. Dần dần, tiếng đàn của cậu trở nên mượt mà, có hồn.\n\nMột buổi chiều, cả xóm sững sờ khi nghe từ căn nhà nhỏ vang lên bản nhạc du dương, da diết. Tiếng đàn như kể về nỗi buồn của cậu bé không nhìn thấy ánh sáng, nhưng cũng đầy khát khao vươn tới những điều tốt đẹp. Mấy bà, mấy chị dừng việc đồng áng, đứng lặng nghe.\n\nTừ đó, mỗi tối, tiếng đàn của Khôi lại vang lên, xua tan mệt nhọc của cả xóm sau một ngày lao động. Người ta bảo nhau: Thằng Khôi mù mà tài thật. Còn Khôi thì cười hiền: Cháu không nhìn thấy mọi người, nhưng cháu nghe được tiếng vỗ tay, thế là vui rồi.\n\nNăm Khôi mười lăm tuổi, cậu được mời biểu diễn trong chương trình văn nghệ của huyện. Đêm ấy, dưới ánh đèn sân khấu, cậu bé mù ôm đàn, chơi một bản nhạc do chính mình sáng tác — bản nhạc về quê hương, về những người thân yêu. Cả hội trường lặng đi rồi vỡ òa trong tiếng vỗ tay không dứt.\n\nTrên đường về, Khôi nói với mẹ: Mẹ ơi, tuy con không nhìn thấy ánh sáng, nhưng âm nhạc đã cho con thấy cả thế giới. Người mẹ ôm chặt con vào lòng, nước mắt hạnh phúc lăn dài trên má.\n\nCâu 4. Lời Khôi nói \"tuy con không nhìn thấy ánh sáng, nhưng âm nhạc đã cho con thấy cả thế giới\" thể hiện điều gì?", "options": ["A. Khôi đã chữa khỏi bệnh mù", "B. Âm nhạc đã mở ra cho Khôi một thế giới tinh thần phong phú, giúp cậu vượt lên khiếm khuyết của bản thân", "C. Khôi muốn trở thành ca sĩ nổi tiếng", "D. Khôi không còn buồn vì bị mù"], "answer": "B", "explain": "Câu nói giàu triết lí: khiếm khuyết thể chất không thể ngăn cản con người vươn tới vẻ đẹp tinh thần. Âm nhạc là ánh sáng soi đường cho tâm hồn Khôi.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTIẾNG ĐÀN\n\nCuối xóm có một cậu bé tên Khôi, bị mù từ nhỏ do một cơn bạo bệnh. Nhà nghèo, Khôi không được đến trường như bạn bè cùng trang lứa, suốt ngày chỉ quanh quẩn trong căn nhà nhỏ.\n\nMột hôm, có đoàn từ thiện về làng tặng quà. Trong đống quà, Khôi ôm khư khư một cây đàn ghi ta cũ — món quà mà chẳng ai ngờ tới. Từ hôm đó, cậu bé mù miệt mài tập đàn. Ban đầu, những ngón tay nhỏ bé lóng ngóng, tiếng đàn chói tai, đứt quãng. Hàng xóm ai cũng lắc đầu: Thằng bé mù mà đòi chơi đàn, thật là...\n\nNhưng Khôi không nản. Cậu nhờ anh thanh niên trong xóm dạy những hợp âm cơ bản, rồi tự mày mò hàng giờ mỗi ngày. Đôi tai tinh nhạy của người khiếm thị giúp Khôi cảm nhận âm thanh một cách đặc biệt. Dần dần, tiếng đàn của cậu trở nên mượt mà, có hồn.\n\nMột buổi chiều, cả xóm sững sờ khi nghe từ căn nhà nhỏ vang lên bản nhạc du dương, da diết. Tiếng đàn như kể về nỗi buồn của cậu bé không nhìn thấy ánh sáng, nhưng cũng đầy khát khao vươn tới những điều tốt đẹp. Mấy bà, mấy chị dừng việc đồng áng, đứng lặng nghe.\n\nTừ đó, mỗi tối, tiếng đàn của Khôi lại vang lên, xua tan mệt nhọc của cả xóm sau một ngày lao động. Người ta bảo nhau: Thằng Khôi mù mà tài thật. Còn Khôi thì cười hiền: Cháu không nhìn thấy mọi người, nhưng cháu nghe được tiếng vỗ tay, thế là vui rồi.\n\nNăm Khôi mười lăm tuổi, cậu được mời biểu diễn trong chương trình văn nghệ của huyện. Đêm ấy, dưới ánh đèn sân khấu, cậu bé mù ôm đàn, chơi một bản nhạc do chính mình sáng tác — bản nhạc về quê hương, về những người thân yêu. Cả hội trường lặng đi rồi vỡ òa trong tiếng vỗ tay không dứt.\n\nTrên đường về, Khôi nói với mẹ: Mẹ ơi, tuy con không nhìn thấy ánh sáng, nhưng âm nhạc đã cho con thấy cả thế giới. Người mẹ ôm chặt con vào lòng, nước mắt hạnh phúc lăn dài trên má.\n\nCâu 5. Qua nhân vật Khôi, em rút ra bài học gì về nghị lực sống? (Trả lời ngắn gọn)", "answer": "Có nghị lực, không đầu hàng số phận, khuyết tật không ngăn được ước mơ", "explain": "Chấp nhận các cách diễn đạt tương đương: dù khiếm khuyết, khó khăn vẫn phải vươn lên; nghị lực giúp con người chiến thắng số phận; không đổ lỗi cho hoàn cảnh.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về nghị lực vượt lên số phận của con người.", "explain": "DÀN Ý:\n1. Mở đoạn: cuộc đời không phải lúc nào cũng bằng phẳng; nghị lực giúp con người vượt qua nghịch cảnh.\n2. Thân đoạn: (a) Biểu hiện: như Khôi mù mà chơi đàn hay, như nhiều tấm gương khuyết tật thành công; (b) Ý nghĩa: nghị lực biến khó khăn thành động lực, khẳng định giá trị bản thân; (c) Phê phán thói nản chí, đầu hàng số phận, đổ lỗi cho hoàn cảnh.\n3. Kết đoạn: rèn luyện ý chí từ những khó khăn nhỏ hằng ngày.\n\nBÀI MẪU:\nTrong cuộc đời, không ai tránh khỏi những khó khăn, thử thách, thậm chí bất hạnh. Điều làm nên sự khác biệt giữa con người chính là nghị lực — sức mạnh tinh thần giúp ta đứng dậy sau mỗi lần vấp ngã. Cậu bé Khôi trong truyện bị mù từ nhỏ, bị mọi người hoài nghi, nhưng bằng nghị lực phi thường, cậu đã trở thành người chơi đàn được cả huyện mến mộ. Trong thực tế, cũng có biết bao tấm gương như thầy Nguyễn Ngọc Ký viết bằng chân, hay Nick Vujicic không tay không chân vẫn truyền cảm hứng cho hàng triệu người. Nghị lực giúp con người biến nghịch cảnh thành động lực, khẳng định giá trị của bản thân và sống một cuộc đời ý nghĩa. Ngược lại, kẻ thiếu ý chí sẽ dễ dàng đầu hàng số phận, đổ lỗi cho hoàn cảnh và sống một cuộc đời tầm thường, uổng phí. Bởi vậy, mỗi chúng ta, nhất là tuổi trẻ, cần rèn luyện ý chí từ những việc nhỏ: kiên trì học tập, không nản lòng trước thất bại. Hãy nhớ rằng: khi ta không từ bỏ, số phận cũng phải cúi đầu.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích nhân vật Khôi trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và nhân vật Khôi — cậu bé khiếm thị giàu nghị lực, hiện thân của khát vọng vươn lên.\nII. Thân bài:\n1. Hoàn cảnh đáng thương: mù từ nhỏ do bạo bệnh, nhà nghèo, không được đến trường — xuất phát điểm đầy bất hạnh.\n2. Nghị lực phi thường:\n   a. Không nản trước hoài nghi: bị hàng xóm lắc đầu vẫn miệt mài tập đàn hàng giờ mỗi ngày.\n   b. Biến khiếm khuyết thành lợi thế: đôi tai tinh nhạy giúp cảm nhận âm thanh đặc biệt.\n   c. Thành công: tiếng đàn xua tan mệt nhọc cả xóm; được mời biểu diễn ở huyện; sáng tác được bản nhạc của riêng mình.\n3. Vẻ đẹp tâm hồn: lạc quan, khiêm tốn, biết ơn (vui vì nghe được tiếng vỗ tay); giàu tình yêu quê hương.\n4. Nghệ thuật: ngôi kể thứ ba; xây dựng nhân vật qua hành động, quá trình trưởng thành; tương phản giữa hoài nghi và thành công; giọng văn cảm động, truyền cảm hứng.\nIII. Kết bài: Khôi là biểu tượng của nghị lực sống; gợi bài học cho tuổi trẻ — không đầu hàng số phận.\n\nĐOẠN MẪU (mở bài):\nTrong cuộc sống, có những con người dù chịu nhiều bất hạnh vẫn tỏa sáng bằng nghị lực phi thường, trở thành nguồn cảm hứng cho bao người. Truyện ngắn Tiếng đàn đã khắc họa thành công hình tượng cậu bé Khôi — khiếm thị từ nhỏ nhưng giàu khát vọng, dùng âm nhạc để vượt lên số phận và thắp sáng niềm tin cho những người xung quanh.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHUYẾN ĐÒ NGANG\n\nBến đò ngang sông quê tôi đã có từ bao đời nay. Người lái đò là bác Sáu — dáng người rắn rỏi, nước da sạm nắng, giọng nói sang sảng.\n\nMỗi ngày, từ tinh mơ đến tối mịt, bác Sáu chở khách qua sông. Học sinh đi học, người đi chợ, người đi làm đồng — ai cũng quen thuộc với bóng dáng bác trên con đò nhỏ. Tiền đò chỉ hai nghìn đồng một lượt, có hôm bác còn không lấy tiền của mấy đứa học trò nghèo.\n\nTôi hỏi bác: Sao bác không tăng giá vé, xăng dầu lên giá mãi? Bác cười, hàm răng trắng bóng: Tăng giá thì bà con đi lại khó khăn. Bác lái đò không phải để giàu, mà để bà con qua sông an toàn. Nghề này là nghề của cha ông để lại, bác phải giữ.\n\nMùa lũ năm ngoái, nước sông dâng cao, chảy xiết. Chính quyền đã cấm đò ngang hoạt động, nhưng có một sản phụ trở dạ cần qua sông gấp để đến bệnh viện. Giữa dòng nước cuồn cuộn, bác Sáu vẫn dong đò đưa mẹ con sản phụ sang bờ bên kia an toàn. Người nhà sản phụ dúi tiền cảm ơn, bác nhất quyết không nhận: Cứu người là việc phải làm, lấy tiền thì còn gì là tình làng nghĩa xóm.\n\nCó lần, cây cầu mới được khởi công xây dựng cách bến đò không xa. Người ta bảo: Cầu xong thì đò thất nghiệp. Bác Sáu vẫn thản nhiên: Cầu xong thì bà con đi lại thuận tiện hơn, bác mừng cho bà con. Còn bác, hết lái đò thì về trồng rau, nuôi gà, có sao đâu.\n\nNgày cầu khánh thành, cả làng vui như hội. Bác Sáu cũng đến dự, vỗ tay nhiệt tình nhất. Nhìn dòng người tấp nập qua cầu, bác cười hiền: Thế là bà con không còn phải chờ đò những hôm mưa gió nữa rồi.\n\nChiều ấy, bác dong đò chuyến cuối cùng. Hoàng hôn đỏ rực trải dài trên mặt sông. Bóng bác Sáu in trên sóng nước, bình dị mà cao đẹp — như biểu tượng của những con người lao động thầm lặng, suốt đời vì mọi người mà chẳng màng danh lợi.\n\nCâu 1. Nghề của bác Sáu là gì?", "options": ["A. Ngư dân đánh cá", "B. Người lái đò ngang qua sông", "C. Thợ xây cầu", "D. Người bán vé số"], "answer": "B", "explain": "Văn bản cho biết rõ: bác Sáu là người lái đò ở bến đò ngang, mỗi ngày chở khách qua sông từ tinh mơ đến tối mịt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHUYẾN ĐÒ NGANG\n\nBến đò ngang sông quê tôi đã có từ bao đời nay. Người lái đò là bác Sáu — dáng người rắn rỏi, nước da sạm nắng, giọng nói sang sảng.\n\nMỗi ngày, từ tinh mơ đến tối mịt, bác Sáu chở khách qua sông. Học sinh đi học, người đi chợ, người đi làm đồng — ai cũng quen thuộc với bóng dáng bác trên con đò nhỏ. Tiền đò chỉ hai nghìn đồng một lượt, có hôm bác còn không lấy tiền của mấy đứa học trò nghèo.\n\nTôi hỏi bác: Sao bác không tăng giá vé, xăng dầu lên giá mãi? Bác cười, hàm răng trắng bóng: Tăng giá thì bà con đi lại khó khăn. Bác lái đò không phải để giàu, mà để bà con qua sông an toàn. Nghề này là nghề của cha ông để lại, bác phải giữ.\n\nMùa lũ năm ngoái, nước sông dâng cao, chảy xiết. Chính quyền đã cấm đò ngang hoạt động, nhưng có một sản phụ trở dạ cần qua sông gấp để đến bệnh viện. Giữa dòng nước cuồn cuộn, bác Sáu vẫn dong đò đưa mẹ con sản phụ sang bờ bên kia an toàn. Người nhà sản phụ dúi tiền cảm ơn, bác nhất quyết không nhận: Cứu người là việc phải làm, lấy tiền thì còn gì là tình làng nghĩa xóm.\n\nCó lần, cây cầu mới được khởi công xây dựng cách bến đò không xa. Người ta bảo: Cầu xong thì đò thất nghiệp. Bác Sáu vẫn thản nhiên: Cầu xong thì bà con đi lại thuận tiện hơn, bác mừng cho bà con. Còn bác, hết lái đò thì về trồng rau, nuôi gà, có sao đâu.\n\nNgày cầu khánh thành, cả làng vui như hội. Bác Sáu cũng đến dự, vỗ tay nhiệt tình nhất. Nhìn dòng người tấp nập qua cầu, bác cười hiền: Thế là bà con không còn phải chờ đò những hôm mưa gió nữa rồi.\n\nChiều ấy, bác dong đò chuyến cuối cùng. Hoàng hôn đỏ rực trải dài trên mặt sông. Bóng bác Sáu in trên sóng nước, bình dị mà cao đẹp — như biểu tượng của những con người lao động thầm lặng, suốt đời vì mọi người mà chẳng màng danh lợi.\n\nCâu 2. Giá vé đò của bác Sáu là bao nhiêu?", "options": ["A. Miễn phí hoàn toàn", "B. Hai nghìn đồng một lượt", "C. Mười nghìn đồng một lượt", "D. Tùy tâm khách trả"], "answer": "B", "explain": "Văn bản viết: tiền đò chỉ hai nghìn đồng một lượt, có hôm bác còn không lấy tiền của mấy đứa học trò nghèo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHUYẾN ĐÒ NGANG\n\nBến đò ngang sông quê tôi đã có từ bao đời nay. Người lái đò là bác Sáu — dáng người rắn rỏi, nước da sạm nắng, giọng nói sang sảng.\n\nMỗi ngày, từ tinh mơ đến tối mịt, bác Sáu chở khách qua sông. Học sinh đi học, người đi chợ, người đi làm đồng — ai cũng quen thuộc với bóng dáng bác trên con đò nhỏ. Tiền đò chỉ hai nghìn đồng một lượt, có hôm bác còn không lấy tiền của mấy đứa học trò nghèo.\n\nTôi hỏi bác: Sao bác không tăng giá vé, xăng dầu lên giá mãi? Bác cười, hàm răng trắng bóng: Tăng giá thì bà con đi lại khó khăn. Bác lái đò không phải để giàu, mà để bà con qua sông an toàn. Nghề này là nghề của cha ông để lại, bác phải giữ.\n\nMùa lũ năm ngoái, nước sông dâng cao, chảy xiết. Chính quyền đã cấm đò ngang hoạt động, nhưng có một sản phụ trở dạ cần qua sông gấp để đến bệnh viện. Giữa dòng nước cuồn cuộn, bác Sáu vẫn dong đò đưa mẹ con sản phụ sang bờ bên kia an toàn. Người nhà sản phụ dúi tiền cảm ơn, bác nhất quyết không nhận: Cứu người là việc phải làm, lấy tiền thì còn gì là tình làng nghĩa xóm.\n\nCó lần, cây cầu mới được khởi công xây dựng cách bến đò không xa. Người ta bảo: Cầu xong thì đò thất nghiệp. Bác Sáu vẫn thản nhiên: Cầu xong thì bà con đi lại thuận tiện hơn, bác mừng cho bà con. Còn bác, hết lái đò thì về trồng rau, nuôi gà, có sao đâu.\n\nNgày cầu khánh thành, cả làng vui như hội. Bác Sáu cũng đến dự, vỗ tay nhiệt tình nhất. Nhìn dòng người tấp nập qua cầu, bác cười hiền: Thế là bà con không còn phải chờ đò những hôm mưa gió nữa rồi.\n\nChiều ấy, bác dong đò chuyến cuối cùng. Hoàng hôn đỏ rực trải dài trên mặt sông. Bóng bác Sáu in trên sóng nước, bình dị mà cao đẹp — như biểu tượng của những con người lao động thầm lặng, suốt đời vì mọi người mà chẳng màng danh lợi.\n\nCâu 3. Hành động dong đò đưa sản phụ qua sông trong mùa lũ cho thấy phẩm chất gì của bác Sáu?", "options": ["A. Liều lĩnh, coi thường quy định", "B. Dũng cảm, sẵn sàng hy sinh tính mạng để cứu người", "C. Muốn được khen thưởng", "D. Ham tiền công hậu hĩnh"], "answer": "B", "explain": "Giữa dòng nước cuồn cuộn nguy hiểm, bác vẫn dong đò cứu người và từ chối tiền cảm ơn — đó là lòng dũng cảm và tình người cao đẹp, đặt tính mạng người khác lên trên an toàn của bản thân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHUYẾN ĐÒ NGANG\n\nBến đò ngang sông quê tôi đã có từ bao đời nay. Người lái đò là bác Sáu — dáng người rắn rỏi, nước da sạm nắng, giọng nói sang sảng.\n\nMỗi ngày, từ tinh mơ đến tối mịt, bác Sáu chở khách qua sông. Học sinh đi học, người đi chợ, người đi làm đồng — ai cũng quen thuộc với bóng dáng bác trên con đò nhỏ. Tiền đò chỉ hai nghìn đồng một lượt, có hôm bác còn không lấy tiền của mấy đứa học trò nghèo.\n\nTôi hỏi bác: Sao bác không tăng giá vé, xăng dầu lên giá mãi? Bác cười, hàm răng trắng bóng: Tăng giá thì bà con đi lại khó khăn. Bác lái đò không phải để giàu, mà để bà con qua sông an toàn. Nghề này là nghề của cha ông để lại, bác phải giữ.\n\nMùa lũ năm ngoái, nước sông dâng cao, chảy xiết. Chính quyền đã cấm đò ngang hoạt động, nhưng có một sản phụ trở dạ cần qua sông gấp để đến bệnh viện. Giữa dòng nước cuồn cuộn, bác Sáu vẫn dong đò đưa mẹ con sản phụ sang bờ bên kia an toàn. Người nhà sản phụ dúi tiền cảm ơn, bác nhất quyết không nhận: Cứu người là việc phải làm, lấy tiền thì còn gì là tình làng nghĩa xóm.\n\nCó lần, cây cầu mới được khởi công xây dựng cách bến đò không xa. Người ta bảo: Cầu xong thì đò thất nghiệp. Bác Sáu vẫn thản nhiên: Cầu xong thì bà con đi lại thuận tiện hơn, bác mừng cho bà con. Còn bác, hết lái đò thì về trồng rau, nuôi gà, có sao đâu.\n\nNgày cầu khánh thành, cả làng vui như hội. Bác Sáu cũng đến dự, vỗ tay nhiệt tình nhất. Nhìn dòng người tấp nập qua cầu, bác cười hiền: Thế là bà con không còn phải chờ đò những hôm mưa gió nữa rồi.\n\nChiều ấy, bác dong đò chuyến cuối cùng. Hoàng hôn đỏ rực trải dài trên mặt sông. Bóng bác Sáu in trên sóng nước, bình dị mà cao đẹp — như biểu tượng của những con người lao động thầm lặng, suốt đời vì mọi người mà chẳng màng danh lợi.\n\nCâu 4. Thái độ của bác Sáu khi cây cầu mới được xây dựng cho thấy điều gì?", "options": ["A. Buồn bã vì sắp mất nghề", "B. Tức giận với chính quyền", "C. Vị tha, luôn nghĩ cho bà con: mừng vì mọi người đi lại thuận tiện, không màng lợi ích cá nhân", "D. Thờ ơ, không quan tâm"], "answer": "C", "explain": "Bác nói: cầu xong thì bà con đi lại thuận tiện hơn, bác mừng cho bà con. Thái độ vị tha, không ích kỉ, luôn đặt lợi ích cộng đồng lên trên — vẻ đẹp tâm hồn của người lao động.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHUYẾN ĐÒ NGANG\n\nBến đò ngang sông quê tôi đã có từ bao đời nay. Người lái đò là bác Sáu — dáng người rắn rỏi, nước da sạm nắng, giọng nói sang sảng.\n\nMỗi ngày, từ tinh mơ đến tối mịt, bác Sáu chở khách qua sông. Học sinh đi học, người đi chợ, người đi làm đồng — ai cũng quen thuộc với bóng dáng bác trên con đò nhỏ. Tiền đò chỉ hai nghìn đồng một lượt, có hôm bác còn không lấy tiền của mấy đứa học trò nghèo.\n\nTôi hỏi bác: Sao bác không tăng giá vé, xăng dầu lên giá mãi? Bác cười, hàm răng trắng bóng: Tăng giá thì bà con đi lại khó khăn. Bác lái đò không phải để giàu, mà để bà con qua sông an toàn. Nghề này là nghề của cha ông để lại, bác phải giữ.\n\nMùa lũ năm ngoái, nước sông dâng cao, chảy xiết. Chính quyền đã cấm đò ngang hoạt động, nhưng có một sản phụ trở dạ cần qua sông gấp để đến bệnh viện. Giữa dòng nước cuồn cuộn, bác Sáu vẫn dong đò đưa mẹ con sản phụ sang bờ bên kia an toàn. Người nhà sản phụ dúi tiền cảm ơn, bác nhất quyết không nhận: Cứu người là việc phải làm, lấy tiền thì còn gì là tình làng nghĩa xóm.\n\nCó lần, cây cầu mới được khởi công xây dựng cách bến đò không xa. Người ta bảo: Cầu xong thì đò thất nghiệp. Bác Sáu vẫn thản nhiên: Cầu xong thì bà con đi lại thuận tiện hơn, bác mừng cho bà con. Còn bác, hết lái đò thì về trồng rau, nuôi gà, có sao đâu.\n\nNgày cầu khánh thành, cả làng vui như hội. Bác Sáu cũng đến dự, vỗ tay nhiệt tình nhất. Nhìn dòng người tấp nập qua cầu, bác cười hiền: Thế là bà con không còn phải chờ đò những hôm mưa gió nữa rồi.\n\nChiều ấy, bác dong đò chuyến cuối cùng. Hoàng hôn đỏ rực trải dài trên mặt sông. Bóng bác Sáu in trên sóng nước, bình dị mà cao đẹp — như biểu tượng của những con người lao động thầm lặng, suốt đời vì mọi người mà chẳng màng danh lợi.\n\nCâu 5. Qua nhân vật bác Sáu, em rút ra bài học gì về cách sống? (Trả lời ngắn gọn)", "answer": "Sống vị tha, vì mọi người, không màng danh lợi", "explain": "Chấp nhận các cách diễn đạt tương đương: sống có trách nhiệm với cộng đồng; lao động thầm lặng mà cao đẹp; đặt lợi ích chung lên trên lợi ích cá nhân; giữ gìn nghề truyền thống của cha ông.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vẻ đẹp của những con người lao động thầm lặng trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: quanh ta có biết bao con người lao động thầm lặng, bình dị mà cao đẹp.\n2. Thân đoạn: (a) Biểu hiện: bác lái đò, cô lao công, người thợ sửa xe... ngày đêm cống hiến không màng danh lợi như bác Sáu; (b) Ý nghĩa: họ góp phần làm cho cuộc sống tốt đẹp hơn, là điểm tựa của cộng đồng; (c) Phê phán thói coi thường lao động chân tay, chỉ trọng danh lợi.\n3. Kết đoạn: biết trân trọng, biết ơn những con người thầm lặng.\n\nBÀI MẪU:\nTrong cuộc sống, bên cạnh những con người nổi tiếng, thành đạt, còn có biết bao con người lao động thầm lặng mà cao đẹp — như bác Sáu lái đò trong truyện, như cô lao công quét rác mỗi đêm, như người thợ sửa xe vá lốp miễn phí cho học trò nghèo. Họ không có địa vị cao sang, không được vinh danh trên báo đài, nhưng ngày ngày vẫn cần mẫn cống hiến, mang lại những giá trị thiết thực cho cộng đồng. Bác Sáu mấy chục năm đưa khách qua sông an toàn, dũng cảm cứu người trong mùa lũ, vui vẻ nhường bước khi cầu mới khánh thành — tất cả đều xuất phát từ tấm lòng vì mọi người. Chính những con người thầm lặng ấy là điểm tựa bình yên của xã hội, là minh chứng cho vẻ đẹp của lao động chân chính. Đáng phê phán là thói coi thường lao động chân tay, chỉ tôn vinh tiền bạc, địa vị. Mỗi chúng ta hãy học cách trân trọng, biết ơn những con người bình dị quanh mình — bởi chính họ đang làm cho cuộc đời này trở nên tốt đẹp hơn mỗi ngày.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích hình tượng bác Sáu trong truyện ngắn trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu truyện ngắn và hình tượng bác Sáu — người lái đò bình dị mà cao đẹp, biểu tượng của người lao động thầm lặng.\nII. Thân bài:\n1. Chân dung: dáng rắn rỏi, da sạm nắng, giọng sang sảng — người lao động khỏe khoắn, gắn bó với sông nước.\n2. Phẩm chất:\n   a. Tận tụy với nghề: mấy chục năm chở khách từ tinh mơ đến tối mịt; coi nghề lái đò là nghề cha ông để lại phải giữ gìn.\n   b. Dũng cảm, giàu tình người: dong đò cứu sản phụ giữa mùa lũ, từ chối tiền cảm ơn.\n   c. Vị tha, không màng danh lợi: giá vé rẻ, vui vẻ khi cầu mới xây dù mình mất nghề.\n   d. Giản dị, lạc quan: cười hiền, sống thanh thản.\n3. Nghệ thuật: ngôi kể thứ nhất (người cháu) tạo sự gần gũi; khắc họa qua hành động, lời nói; hình ảnh chuyến đò cuối trong hoàng hôn giàu chất thơ, mang ý nghĩa biểu tượng.\nIII. Kết bài: bác Sáu là biểu tượng đẹp của người lao động Việt Nam; gợi bài học sống có ích, vị tha.\n\nĐOẠN MẪU (mở bài):\nDọc dài đất nước, có biết bao con người lao động thầm lặng ngày đêm cống hiến mà không màng danh lợi, trở thành điểm tựa bình yên cho cộng đồng. Truyện ngắn Chuyến đò ngang đã khắc họa thành công một hình tượng như thế — bác Sáu lái đò, người đàn ông bình dị với tấm lòng cao đẹp, để lại trong lòng người đọc niềm cảm phục và suy ngẫm sâu sắc về ý nghĩa của lao động và cách sống vị tha.", "points": 0}]}]}
