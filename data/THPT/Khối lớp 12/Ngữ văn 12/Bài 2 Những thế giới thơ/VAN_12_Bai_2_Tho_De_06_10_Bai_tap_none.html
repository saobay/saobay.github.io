m trăng quê. Vẻ đẹp quê hương không chỉ ở cảnh sắc mà còn ở tình người: mẹ quạt mát hiên hè kể chuyện cổ tích, bà con đùm bọc nhau trong hoạn nạn. Quê hương là điểm tựa tinh thần, là nơi ta tìm về sau những bon chen, là nguồn cảm hứng bất tận của văn chương. Thế nhưng, quá trình đô thị hóa đang làm nhiều làng quê mất đi vẻ đẹp vốn có: ao hồ bị lấp, cây xanh bị chặt, ô nhiễm môi trường. Mỗi chúng ta cần chung tay giữ gìn vẻ đẹp quê hương: bảo vệ môi trường, giữ gìn bản sắc văn hóa làng quê, đồng thời xây dựng quê hương ngày càng giàu đẹp, văn minh. Dù đi bốn biển năm châu, hãy luôn khắc sâu quê hương trong tim như lời nhắn nhủ của bài thơ.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích vẻ đẹp của bức tranh quê trong bài thơ trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu bài thơ và bức tranh quê trong đêm trăng — vừa thực vừa thơ, thấm đẫm tình quê.\nII. Thân bài:\n1. Cảnh đêm trăng quê: trăng lên đầu đình, trải vàng sân đình; hương lúa, bóng tre — vẻ đẹp thanh bình, thơ mộng (khổ 1).\n2. Con người trong đêm trăng: mẹ quạt mát kể chuyện cổ tích — ấm áp tình mẫu tử, đậm đà bản sắc văn hóa dân gian (khổ 2).\n3. Đồng quê dưới trăng: lúa thì con gái tốt tươi — vẻ đẹp của sự sống, của lao động (khổ 3).\n4. Tình cảm của nhân vật trữ tình: thương mẹ, nhớ quê, khắc sâu quê hương trong tim dù đi xa (khổ 3, 4).\n5. Nghệ thuật: thể lục bát nhuần nhuyễn; so sánh (trải vàng), hình ảnh dân gian (chị Hằng, chú Cuội); giọng thơ êm đềm, thiết tha.\nIII. Kết bài: khẳng định giá trị; liên hệ tình yêu quê hương.\n\nĐOẠN MẪU (mở bài):\nQuê hương luôn là nguồn cảm hứng dạt dào của thơ ca, và những bài thơ hay nhất về quê hương thường được viết nên từ nỗi nhớ da diết của người con xa quê. Bài thơ Đêm trăng quê với thể lục bát ngọt ngào đã vẽ nên một bức tranh làng quê Việt Nam trong đêm trăng thật thanh bình, thơ mộng — nơi cảnh đẹp hòa quyện cùng tình người, để lại trong lòng người đọc niềm xúc động và tình yêu quê hương sâu nặng.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCON ĐƯỜNG LÀNG\n\nCon đường làng tôi đi về mỗi buổi,\nRợp bóng tre xanh, mát rượi trưa hè.\nMưa đầu mùa, đường lầy lội khó đi,\nNắng lên rồi, đường lại khô ráo thế.\n\nĐường đưa tôi đến trường từ thuở bé,\nĐường đưa cha đi cày từ tinh mơ.\nĐường in dấu chân bao người làng tôi,\nĐường ôm ấp những buồn vui, sướng khổ.\n\nCó những chiều, tôi cùng bạn ra đồng,\nThả diều bay cao, tiếng cười vang vọng.\nCó những đêm trăng, đường như dải lụa,\nDẫn lối tôi về trong giấc mơ êm.\n\nGiờ đi xa, tôi nhớ đường da diết,\nNhớ hàng tre, nhớ cả ổ gà mưa.\nĐường làng ơi, dẫu đời nhiều thay đổi,\nMãi trong tôi, đường vẫn đẹp như xưa.\n\nCâu 1. Bài thơ trên được viết theo thể thơ nào?", "options": ["A. Thơ lục bát", "B. Thơ tự do", "C. Thơ thất ngôn bát cú", "D. Thơ năm chữ"], "answer": "B", "explain": "Số chữ các dòng không đều nhau (từ bảy đến chín chữ), không theo niêm luật cố định — thơ tự do.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCON ĐƯỜNG LÀNG\n\nCon đường làng tôi đi về mỗi buổi,\nRợp bóng tre xanh, mát rượi trưa hè.\nMưa đầu mùa, đường lầy lội khó đi,\nNắng lên rồi, đường lại khô ráo thế.\n\nĐường đưa tôi đến trường từ thuở bé,\nĐường đưa cha đi cày từ tinh mơ.\nĐường in dấu chân bao người làng tôi,\nĐường ôm ấp những buồn vui, sướng khổ.\n\nCó những chiều, tôi cùng bạn ra đồng,\nThả diều bay cao, tiếng cười vang vọng.\nCó những đêm trăng, đường như dải lụa,\nDẫn lối tôi về trong giấc mơ êm.\n\nGiờ đi xa, tôi nhớ đường da diết,\nNhớ hàng tre, nhớ cả ổ gà mưa.\nĐường làng ơi, dẫu đời nhiều thay đổi,\nMãi trong tôi, đường vẫn đẹp như xưa.\n\nCâu 2. Hình ảnh trung tâm của bài thơ là gì?", "options": ["A. Cánh đồng lúa", "B. Con đường làng", "C. Dòng sông", "D. Ngôi trường"], "answer": "B", "explain": "Nhan đề và toàn bài thơ đều hướng về \"con đường làng\" — hình ảnh trung tâm, gắn với bao kỉ niệm của nhân vật trữ tình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCON ĐƯỜNG LÀNG\n\nCon đường làng tôi đi về mỗi buổi,\nRợp bóng tre xanh, mát rượi trưa hè.\nMưa đầu mùa, đường lầy lội khó đi,\nNắng lên rồi, đường lại khô ráo thế.\n\nĐường đưa tôi đến trường từ thuở bé,\nĐường đưa cha đi cày từ tinh mơ.\nĐường in dấu chân bao người làng tôi,\nĐường ôm ấp những buồn vui, sướng khổ.\n\nCó những chiều, tôi cùng bạn ra đồng,\nThả diều bay cao, tiếng cười vang vọng.\nCó những đêm trăng, đường như dải lụa,\nDẫn lối tôi về trong giấc mơ êm.\n\nGiờ đi xa, tôi nhớ đường da diết,\nNhớ hàng tre, nhớ cả ổ gà mưa.\nĐường làng ơi, dẫu đời nhiều thay đổi,\nMãi trong tôi, đường vẫn đẹp như xưa.\n\nCâu 3. Biện pháp tu từ nào được sử dụng trong câu thơ \"Có những đêm trăng, đường như dải lụa\"?", "options": ["A. Nhân hóa", "B. So sánh — ví con đường như dải lụa", "C. Ẩn dụ", "D. Điệp ngữ"], "answer": "B", "explain": "Từ \"như\" đối chiếu con đường dưới trăng với dải lụa mềm mại — phép so sánh làm nổi bật vẻ đẹp thơ mộng của con đường làng trong đêm trăng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCON ĐƯỜNG LÀNG\n\nCon đường làng tôi đi về mỗi buổi,\nRợp bóng tre xanh, mát rượi trưa hè.\nMưa đầu mùa, đường lầy lội khó đi,\nNắng lên rồi, đường lại khô ráo thế.\n\nĐường đưa tôi đến trường từ thuở bé,\nĐường đưa cha đi cày từ tinh mơ.\nĐường in dấu chân bao người làng tôi,\nĐường ôm ấp những buồn vui, sướng khổ.\n\nCó những chiều, tôi cùng bạn ra đồng,\nThả diều bay cao, tiếng cười vang vọng.\nCó những đêm trăng, đường như dải lụa,\nDẫn lối tôi về trong giấc mơ êm.\n\nGiờ đi xa, tôi nhớ đường da diết,\nNhớ hàng tre, nhớ cả ổ gà mưa.\nĐường làng ơi, dẫu đời nhiều thay đổi,\nMãi trong tôi, đường vẫn đẹp như xưa.\n\nCâu 4. Con đường làng trong bài thơ tượng trưng cho điều gì?", "options": ["A. Sự nghèo khó, lạc hậu của nông thôn", "B. Quê hương, cội nguồn với bao kỉ niệm tuổi thơ gắn bó máu thịt với con người", "C. Con đường giao thông nông thôn cần được nâng cấp", "D. Nỗi buồn của người xa quê"], "answer": "B", "explain": "Con đường gắn với tuổi thơ đến trường, với cha đi cày, với bạn bè thả diều — nó là biểu tượng của quê hương, của cội nguồn, nơi lưu giữ bao kỉ niệm thiêng liêng.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCON ĐƯỜNG LÀNG\n\nCon đường làng tôi đi về mỗi buổi,\nRợp bóng tre xanh, mát rượi trưa hè.\nMưa đầu mùa, đường lầy lội khó đi,\nNắng lên rồi, đường lại khô ráo thế.\n\nĐường đưa tôi đến trường từ thuở bé,\nĐường đưa cha đi cày từ tinh mơ.\nĐường in dấu chân bao người làng tôi,\nĐường ôm ấp những buồn vui, sướng khổ.\n\nCó những chiều, tôi cùng bạn ra đồng,\nThả diều bay cao, tiếng cười vang vọng.\nCó những đêm trăng, đường như dải lụa,\nDẫn lối tôi về trong giấc mơ êm.\n\nGiờ đi xa, tôi nhớ đường da diết,\nNhớ hàng tre, nhớ cả ổ gà mưa.\nĐường làng ơi, dẫu đời nhiều thay đổi,\nMãi trong tôi, đường vẫn đẹp như xưa.\n\nCâu 5. Qua bài thơ, em hiểu thêm điều gì về tình cảm với quê hương? (Trả lời ngắn gọn)", "answer": "Quê hương gắn với những điều bình dị nhất mà thiêng liêng nhất", "explain": "Chấp nhận các cách diễn đạt tương đương: yêu quê hương từ những điều giản dị như con đường làng; dù đi xa vẫn nhớ về cội nguồn; quê hương là nơi lưu giữ kỉ niệm tuổi thơ.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của kỉ niệm tuổi thơ đối với mỗi con người.", "explain": "DÀN Ý:\n1. Mở đoạn: kỉ niệm tuổi thơ là tài sản tinh thần vô giá của mỗi người.\n2. Thân đoạn: (a) Ý nghĩa: nuôi dưỡng tâm hồn, là điểm tựa khi gặp khó khăn như hình ảnh con đường làng trong thơ; (b) Kỉ niệm đẹp gắn ta với quê hương, gia đình; (c) Phê phán lối sống vô tâm, đánh mất tuổi thơ vào game, mạng xã hội.\n3. Kết đoạn: hãy trân trọng và tạo nên những kỉ niệm đẹp.\n\nBÀI MẪU:\nKỉ niệm tuổi thơ là tài sản tinh thần vô giá mà mỗi con người mang theo suốt cuộc đời. Đó có thể là con đường làng rợp bóng tre như trong bài thơ, là những buổi chiều thả diều cùng bạn bè, là mâm cơm đầm ấm bên gia đình — những điều bình dị mà thiêng liêng. Kỉ niệm tuổi thơ nuôi dưỡng tâm hồn ta, là điểm tựa tinh thần vững chắc mỗi khi ta gặp khó khăn, thất bại trên đường đời. Người đi xa quê, mỗi khi nhớ về kỉ niệm ấu thơ lại thấy lòng ấm lại, có thêm động lực để vươn lên. Kỉ niệm đẹp cũng gắn kết ta với quê hương, với cội nguồn, nhắc ta nhớ mình là ai, từ đâu đến. Đáng tiếc là nhiều bạn trẻ hôm nay đánh mất tuổi thơ vào game, mạng xã hội, để những năm tháng tươi đẹp trôi qua vô vị. Hãy sống trọn vẹn từng ngày, tạo nên những kỉ niệm đẹp bên gia đình, thầy cô, bạn bè — để mai này nhìn lại, tuổi thơ của mỗi chúng ta đều là những trang kí ức rực rỡ, đáng trân trọng.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ so sánh hình ảnh con đường làng trong bài thơ trên với hình ảnh quê hương trong một bài thơ em đã học.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu bài thơ Con đường làng và vấn đề so sánh — cùng viết về quê hương nhưng mỗi bài thơ có cách thể hiện riêng.\nII. Thân bài:\n1. Điểm tương đồng:\n   a. Cùng cảm hứng: tình yêu, nỗi nhớ quê hương tha thiết.\n   b. Cùng lấy những hình ảnh bình dị (con đường, hàng tre, cánh đồng) để nói về quê hương.\n2. Điểm khác biệt:\n   a. Bài thơ trên: tập trung vào một hình ảnh duy nhất là con đường làng, gắn với kỉ niệm cá nhân (đến trường, thả diều); thể thơ tự do phóng khoáng.\n   b. Bài thơ đã học (ví dụ Quê hương của Giang Nam hoặc Đoàn thuyền đánh cá): có thể bao quát hơn, hoặc gắn với lao động, hoặc dùng thể thơ khác.\n   c. Giọng điệu, cách biểu cảm có nét riêng.\n3. Đánh giá: mỗi bài thơ đều thành công trong việc thể hiện tình quê; sự khác biệt làm phong phú thêm thơ ca viết về quê hương.\nIII. Kết bài: khẳng định giá trị của cả hai; liên hệ tình yêu quê hương của bản thân.\n\nĐOẠN MẪU (mở bài):\nQuê hương là đề tài muôn thuở của thơ ca, và mỗi nhà thơ lại có một cách riêng để nói về quê hương mình. Nếu nhiều bài thơ ca ngợi quê hương qua những hình ảnh bao quát, lớn lao thì bài thơ Con đường làng lại chọn một hình ảnh rất đỗi bình dị — con đường làng quen thuộc — để gửi gắm tình yêu quê hương sâu nặng. So sánh bài thơ này với một bài thơ viết về quê hương đã học sẽ giúp ta thấy rõ hơn nét độc đáo của mỗi tác phẩm, đồng thời cảm nhận sâu sắc hơn vẻ đẹp của thơ ca viết về quê hương.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMƯA\n\nChiều nay mưa bay lất phất,\nƯớt con đường nhỏ, ướt nhành hoa cau.\nMưa rơi tí tách mái nhà,\nGợi bao nỗi nhớ thiết tha trong lòng.\n\nNhớ những chiều mưa năm xưa,\nMẹ đi chợ về, áo mưa ướt sũng.\nMẹ cười, dúi vào tay con,\nGói xôi nóng hổi vẫn còn thơm ngon.\n\nNhớ những đêm mưa dầm dề,\nCha ngồi vá lưới, mẹ khâu áo con.\nÁnh đèn dầu le lói hắt,\nSoi mái nhà tranh ấm áp tình người.\n\nMưa ơi, mưa của quê hương,\nTưới mát đồng ruộng, tưới vườn cây xanh.\nMưa nuôi ta lớn từng ngày,\nMưa là kỉ niệm đong đầy yêu thương.\n\nCâu 1. Bài thơ trên được viết theo thể thơ nào?", "options": ["A. Thơ lục bát", "B. Thơ thất ngôn bát cú", "C. Thơ tự do", "D. Thơ bốn chữ"], "answer": "A", "explain": "Các cặp câu 6 chữ và 8 chữ xen kẽ, gieo vần đúng luật — thể thơ lục bát.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMƯA\n\nChiều nay mưa bay lất phất,\nƯớt con đường nhỏ, ướt nhành hoa cau.\nMưa rơi tí tách mái nhà,\nGợi bao nỗi nhớ thiết tha trong lòng.\n\nNhớ những chiều mưa năm xưa,\nMẹ đi chợ về, áo mưa ướt sũng.\nMẹ cười, dúi vào tay con,\nGói xôi nóng hổi vẫn còn thơm ngon.\n\nNhớ những đêm mưa dầm dề,\nCha ngồi vá lưới, mẹ khâu áo con.\nÁnh đèn dầu le lói hắt,\nSoi mái nhà tranh ấm áp tình người.\n\nMưa ơi, mưa của quê hương,\nTưới mát đồng ruộng, tưới vườn cây xanh.\nMưa nuôi ta lớn từng ngày,\nMưa là kỉ niệm đong đầy yêu thương.\n\nCâu 2. Hình ảnh mưa trong bài thơ gắn với kỉ niệm nào?", "options": ["A. Kỉ niệm về thầy cô", "B. Kỉ niệm về gia đình: mẹ đi chợ về, cha vá lưới, mẹ khâu áo", "C. Kỉ niệm về bạn bè", "D. Kỉ niệm về trường lớp"], "answer": "B", "explain": "Mưa gợi nhớ những kỉ niệm gia đình ấm áp: mẹ đi chợ về trong mưa, cha vá lưới, mẹ khâu áo dưới ánh đèn dầu — mưa là chất xúc tác của nỗi nhớ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMƯA\n\nChiều nay mưa bay lất phất,\nƯớt con đường nhỏ, ướt nhành hoa cau.\nMưa rơi tí tách mái nhà,\nGợi bao nỗi nhớ thiết tha trong lòng.\n\nNhớ những chiều mưa năm xưa,\nMẹ đi chợ về, áo mưa ướt sũng.\nMẹ cười, dúi vào tay con,\nGói xôi nóng hổi vẫn còn thơm ngon.\n\nNhớ những đêm mưa dầm dề,\nCha ngồi vá lưới, mẹ khâu áo con.\nÁnh đèn dầu le lói hắt,\nSoi mái nhà tranh ấm áp tình người.\n\nMưa ơi, mưa của quê hương,\nTưới mát đồng ruộng, tưới vườn cây xanh.\nMưa nuôi ta lớn từng ngày,\nMưa là kỉ niệm đong đầy yêu thương.\n\nCâu 3. Biện pháp tu từ nào được sử dụng trong câu thơ \"Mưa là kỉ niệm đong đầy yêu thương\"?", "options": ["A. Nhân hóa", "B. So sánh — ví mưa như kỉ niệm", "C. Ẩn dụ", "D. Điệp ngữ"], "answer": "B", "explain": "Dùng từ \"là\" để đồng nhất mưa với kỉ niệm — phép so sánh tu từ, khẳng định mưa đã trở thành biểu tượng của những kỉ niệm đong đầy yêu thương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMƯA\n\nChiều nay mưa bay lất phất,\nƯớt con đường nhỏ, ướt nhành hoa cau.\nMưa rơi tí tách mái nhà,\nGợi bao nỗi nhớ thiết tha trong lòng.\n\nNhớ những chiều mưa năm xưa,\nMẹ đi chợ về, áo mưa ướt sũng.\nMẹ cười, dúi vào tay con,\nGói xôi nóng hổi vẫn còn thơm ngon.\n\nNhớ những đêm mưa dầm dề,\nCha ngồi vá lưới, mẹ khâu áo con.\nÁnh đèn dầu le lói hắt,\nSoi mái nhà tranh ấm áp tình người.\n\nMưa ơi, mưa của quê hương,\nTưới mát đồng ruộng, tưới vườn cây xanh.\nMưa nuôi ta lớn từng ngày,\nMưa là kỉ niệm đong đầy yêu thương.\n\nCâu 4. Cảm xúc chủ đạo của bài thơ là gì?", "options": ["A. Buồn bã, chán nản vì mưa dầm", "B. Nhớ nhung da diết về gia đình và quê hương qua hình ảnh mưa", "C. Sợ hãi trước thiên nhiên", "D. Vui sướng khi trời mưa"], "answer": "B", "explain": "Từ mưa thực tại, nhân vật trữ tình nhớ về những kỉ niệm gia đình ấm áp và quê hương — cảm xúc nhớ nhung, yêu thương thấm đẫm toàn bài.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMƯA\n\nChiều nay mưa bay lất phất,\nƯớt con đường nhỏ, ướt nhành hoa cau.\nMưa rơi tí tách mái nhà,\nGợi bao nỗi nhớ thiết tha trong lòng.\n\nNhớ những chiều mưa năm xưa,\nMẹ đi chợ về, áo mưa ướt sũng.\nMẹ cười, dúi vào tay con,\nGói xôi nóng hổi vẫn còn thơm ngon.\n\nNhớ những đêm mưa dầm dề,\nCha ngồi vá lưới, mẹ khâu áo con.\nÁnh đèn dầu le lói hắt,\nSoi mái nhà tranh ấm áp tình người.\n\nMưa ơi, mưa của quê hương,\nTưới mát đồng ruộng, tưới vườn cây xanh.\nMưa nuôi ta lớn từng ngày,\nMưa là kỉ niệm đong đầy yêu thương.\n\nCâu 5. Qua bài thơ, em cảm nhận được vai trò của gia đình như thế nào? (Trả lời ngắn gọn)", "answer": "Gia đình là điểm tựa, là nơi bình yên và đầy ắp yêu thương", "explain": "Chấp nhận các cách diễn đạt tương đương: gia đình là nơi ta tìm về; tình cảm gia đình thiêng liêng, sưởi ấm tâm hồn; kỉ niệm gia đình là hành trang quý giá.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của gia đình đối với sự trưởng thành của mỗi con người.", "explain": "DÀN Ý:\n1. Mở đoạn: gia đình là tế bào của xã hội, là cái nôi nuôi dưỡng con người.\n2. Thân đoạn: (a) Gia đình dạy ta những bài học đầu đời về đạo đức, cách sống; (b) Là điểm tựa tinh thần, nơi ta tìm về khi khó khăn như kỉ niệm về cha mẹ trong mưa; (c) Phê phán thói vô tâm với gia đình, chạy theo vật chất mà quên cội nguồn.\n3. Kết đoạn: trân trọng, vun đắp hạnh phúc gia đình.\n\nBÀI MẪU:\nGia đình là tế bào của xã hội, là cái nôi đầu tiên nuôi dưỡng và hình thành nhân cách mỗi con người. Từ những lời ru của mẹ, những dạy dỗ của cha, ta học được những bài học đầu đời về đạo đức, về cách sống làm người. Gia đình còn là điểm tựa tinh thần vững chắc: mỗi khi gặp khó khăn, thất bại, ta đều tìm về mái nhà thân thương để được an ủi, động viên — như nhân vật trữ tình trong bài thơ tìm về kỉ niệm ấm áp bên cha mẹ mỗi khi mưa về. Một gia đình hòa thuận, yêu thương sẽ tạo nên những con người nhân hậu, có trách nhiệm. Ngược lại, những đứa trẻ thiếu vắng tình thương gia đình dễ trở nên lệch lạc, khô cằn về tâm hồn. Đáng phê phán là những người vì mải mê vật chất, danh vọng mà quên đi gia đình, để cha mẹ già ngóng trông. Bởi vậy, dù bận rộn đến đâu, mỗi chúng ta hãy dành thời gian cho gia đình, vun đắp hạnh phúc từ những điều bình dị nhất — bởi gia đình mãi là bến đỗ bình yên nhất của cuộc đời.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích bài thơ trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu bài thơ lục bát và cảm hứng — nỗi nhớ gia đình, quê hương qua hình ảnh mưa.\nII. Thân bài:\n1. Mưa trong hiện tại: mưa bay lất phất, ướt đường, ướt hoa cau — không gian gợi buồn, gợi nhớ (khổ 1).\n2. Mưa trong kỉ niệm: mẹ đi chợ về, cha vá lưới mẹ khâu áo — những hình ảnh gia đình ấm áp, bình dị (khổ 2, 3).\n3. Mưa trong suy tưởng: mưa tưới mát đồng ruộng, mưa là kỉ niệm — từ cụ thể đến khái quát, từ nhớ thương đến tri ân (khổ 4).\n4. Nghệ thuật: thể lục bát ngọt ngào; so sánh (mưa là kỉ niệm); điệp từ (nhớ... nhớ...); hình ảnh bình dị mà giàu sức gợi; giọng thơ thiết tha.\nIII. Kết bài: khẳng định giá trị; liên hệ tình cảm gia đình.\n\nĐOẠN MẪU (mở bài):\nCó những hình ảnh thiên nhiên bình dị mà khi đi vào thơ ca lại trở thành biểu tượng của nỗi nhớ, của tình quê tha thiết. Bài thơ Mưa đã làm được điều đó: từ cơn mưa chiều lất phất, tác giả mở ra cả một thế giới kỉ niệm về gia đình ấm áp và quê hương yêu dấu. Bằng thể thơ lục bát ngọt ngào và những hình ảnh giàu sức gợi, bài thơ đã chạm đến những rung cảm sâu kín nhất trong lòng người đọc.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHA\n\nCha tôi không nói lời hoa mỹ,\nChỉ lặng thầm gánh nặng đường xa.\nĐôi vai cha chai sần nắng gió,\nChở che con qua những phong ba.\n\nNhớ những đêm con ốm sốt cao,\nCha thức trắng, quạt mát thâu đêm.\nBàn tay cha thô ráp, ấm áp,\nXoa đầu con, con ngủ êm đềm.\n\nCha dạy con biết sống ngay thẳng,\nBiết yêu thương, biết trọng nghĩa tình.\nCha bảo: Đời người như cây lúa,\nCúi đầu khi hạt đã nặng trĩu cành.\n\nGiờ con lớn, cha đã già yếu,\nTóc cha bạc như sương mùa thu.\nCon chỉ mong thời gian chậm lại,\nĐể bên cha thêm những tháng ngày.\n\nCâu 1. Bài thơ trên được viết theo thể thơ nào?", "options": ["A. Thơ lục bát", "B. Thơ thất ngôn tứ tuyệt", "C. Thơ tự do", "D. Thơ năm chữ"], "answer": "C", "explain": "Số chữ các dòng không đều nhau (từ sáu đến tám chữ), không theo niêm luật cố định — thơ tự do.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHA\n\nCha tôi không nói lời hoa mỹ,\nChỉ lặng thầm gánh nặng đường xa.\nĐôi vai cha chai sần nắng gió,\nChở che con qua những phong ba.\n\nNhớ những đêm con ốm sốt cao,\nCha thức trắng, quạt mát thâu đêm.\nBàn tay cha thô ráp, ấm áp,\nXoa đầu con, con ngủ êm đềm.\n\nCha dạy con biết sống ngay thẳng,\nBiết yêu thương, biết trọng nghĩa tình.\nCha bảo: Đời người như cây lúa,\nCúi đầu khi hạt đã nặng trĩu cành.\n\nGiờ con lớn, cha đã già yếu,\nTóc cha bạc như sương mùa thu.\nCon chỉ mong thời gian chậm lại,\nĐể bên cha thêm những tháng ngày.\n\nCâu 2. Hình ảnh người cha trong bài thơ hiện lên với đặc điểm nào?", "options": ["A. Hay nói lời hoa mỹ", "B. Lặng thầm, gánh vác, hy sinh vì con", "C. Nghiêm khắc, xa cách", "D. Giàu sang, quyền quý"], "answer": "B", "explain": "Ngay câu mở đầu đã khẳng định: \"Cha tôi không nói lời hoa mỹ, / Chỉ lặng thầm gánh nặng đường xa\" — người cha ít nói, hành động nhiều, hy sinh thầm lặng vì con.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHA\n\nCha tôi không nói lời hoa mỹ,\nChỉ lặng thầm gánh nặng đường xa.\nĐôi vai cha chai sần nắng gió,\nChở che con qua những phong ba.\n\nNhớ những đêm con ốm sốt cao,\nCha thức trắng, quạt mát thâu đêm.\nBàn tay cha thô ráp, ấm áp,\nXoa đầu con, con ngủ êm đềm.\n\nCha dạy con biết sống ngay thẳng,\nBiết yêu thương, biết trọng nghĩa tình.\nCha bảo: Đời người như cây lúa,\nCúi đầu khi hạt đã nặng trĩu cành.\n\nGiờ con lớn, cha đã già yếu,\nTóc cha bạc như sương mùa thu.\nCon chỉ mong thời gian chậm lại,\nĐể bên cha thêm những tháng ngày.\n\nCâu 3. Biện pháp tu từ nào được sử dụng trong câu thơ \"Đời người như cây lúa, / Cúi đầu khi hạt đã nặng trĩu cành\"?", "options": ["A. Nhân hóa", "B. So sánh — ví đời người như cây lúa", "C. Ẩn dụ", "D. Nói quá"], "answer": "B", "explain": "Từ \"như\" đối chiếu đời người với cây lúa cúi đầu khi trĩu hạt — phép so sánh gửi gắm bài học về sự khiêm tốn: càng thành công càng phải khiêm nhường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHA\n\nCha tôi không nói lời hoa mỹ,\nChỉ lặng thầm gánh nặng đường xa.\nĐôi vai cha chai sần nắng gió,\nChở che con qua những phong ba.\n\nNhớ những đêm con ốm sốt cao,\nCha thức trắng, quạt mát thâu đêm.\nBàn tay cha thô ráp, ấm áp,\nXoa đầu con, con ngủ êm đềm.\n\nCha dạy con biết sống ngay thẳng,\nBiết yêu thương, biết trọng nghĩa tình.\nCha bảo: Đời người như cây lúa,\nCúi đầu khi hạt đã nặng trĩu cành.\n\nGiờ con lớn, cha đã già yếu,\nTóc cha bạc như sương mùa thu.\nCon chỉ mong thời gian chậm lại,\nĐể bên cha thêm những tháng ngày.\n\nCâu 4. Lời dạy của cha \"Cúi đầu khi hạt đã nặng trĩu cành\" gửi gắm bài học gì?", "options": ["A. Phải biết cúi đầu trước kẻ mạnh", "B. Càng thành công, càng trưởng thành càng phải khiêm tốn, không kiêu ngạo", "C. Nên làm nghề nông như cây lúa", "D. Đừng bao giờ ngẩng cao đầu"], "answer": "B", "explain": "Hình ảnh cây lúa trĩu hạt cúi đầu là biểu tượng của sự khiêm tốn: người càng có tài, có thành tựu càng phải khiêm nhường — bài học đạo đức sâu sắc của cha.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nCHA\n\nCha tôi không nói lời hoa mỹ,\nChỉ lặng thầm gánh nặng đường xa.\nĐôi vai cha chai sần nắng gió,\nChở che con qua những phong ba.\n\nNhớ những đêm con ốm sốt cao,\nCha thức trắng, quạt mát thâu đêm.\nBàn tay cha thô ráp, ấm áp,\nXoa đầu con, con ngủ êm đềm.\n\nCha dạy con biết sống ngay thẳng,\nBiết yêu thương, biết trọng nghĩa tình.\nCha bảo: Đời người như cây lúa,\nCúi đầu khi hạt đã nặng trĩu cành.\n\nGiờ con lớn, cha đã già yếu,\nTóc cha bạc như sương mùa thu.\nCon chỉ mong thời gian chậm lại,\nĐể bên cha thêm những tháng ngày.\n\nCâu 5. Qua bài thơ, em cảm nhận được tình cảm gì của người con dành cho cha? (Trả lời ngắn gọn)", "answer": "Biết ơn, yêu thương và mong muốn báo hiếu cha", "explain": "Chấp nhận các cách diễn đạt tương đương: thấu hiểu sự hy sinh thầm lặng của cha; thương cha già yếu; ước mong thời gian chậm lại để được bên cha.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về tình cha con trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: tình cha con là tình cảm thiêng liêng, dù thường thầm lặng, ít lời.\n2. Thân đoạn: (a) Biểu hiện: cha hy sinh thầm lặng, gánh vác gia đình, dạy con nên người như người cha trong bài thơ; (b) Ý nghĩa: là điểm tựa, là tấm gương cho con; (c) Phê phán những người con vô tâm, không thấu hiểu tình cha.\n3. Kết đoạn: hãy trân trọng, báo hiếu cha khi còn có thể.\n\nBÀI MẪU:\nTình cha con là một trong những tình cảm thiêng liêng nhất của con người, dù thường được thể hiện một cách thầm lặng, ít lời. Khác với tình mẹ dịu dàng, tình cha thường ẩn sau những hành động: đôi vai gánh nặng đường xa, những đêm thức trắng quạt mát cho con ốm, những lời dạy mộc mạc mà thấm thía về cách sống ngay thẳng, khiêm tốn — như hình ảnh người cha trong bài thơ. Tình cha là điểm tựa vững chắc, là tấm gương sáng để con noi theo suốt cuộc đời. Thế nhưng, không ít người con vô tâm, chỉ quen nhận mà không biết cho, để đến khi cha già yếu mới hối hận vì những quan tâm chưa kịp thể hiện. Tình cha như núi Thái Sơn — lặng lẽ mà vững chãi, ít nói mà sâu nặng. Bởi vậy, mỗi chúng ta hãy biết trân trọng tình cha khi còn có thể: một lời hỏi han, một việc làm đỡ đần, một sự cố gắng nên người chính là món quà ý nghĩa nhất dành cho cha.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích hình tượng người cha trong bài thơ trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu bài thơ và hình tượng người cha — thầm lặng mà cao đẹp.\nII. Thân bài:\n1. Người cha thầm lặng hy sinh: không lời hoa mỹ, lặng thầm gánh nặng; vai chai sần nắng gió — hiện thân của sự tần tảo.\n2. Người cha giàu tình thương: thức trắng đêm quạt mát cho con ốm; bàn tay thô ráp mà ấm áp — tình cha sâu nặng sau vẻ ngoài khô khan.\n3. Người cha là tấm gương đạo đức: dạy con sống ngay thẳng, yêu thương, khiêm tốn qua hình ảnh cây lúa trĩu hạt — triết lí sống giản dị mà sâu sắc.\n4. Nỗi niềm của người con: thấu hiểu, biết ơn; xót xa khi cha già yếu; ước mong thời gian chậm lại — tình phụ tử thiêng liêng.\n5. Nghệ thuật: thể thơ tự do; so sánh (đời người như cây lúa); ngôn ngữ mộc mạc, chân thành; giọng thơ thiết tha, trầm lắng.\nIII. Kết bài: khẳng định vẻ đẹp của tình phụ tử; liên hệ trách nhiệm báo hiếu.\n\nĐOẠN MẪU (mở bài):\nNếu tình mẹ thường được ví như nước nguồn dịu dàng thì tình cha lại như núi Thái Sơn — lặng lẽ, vững chãi mà sâu nặng. Bài thơ Cha đã khắc họa thành công hình tượng người cha như thế: ít lời hoa mỹ, chỉ lặng thầm gánh vác, hy sinh vì con bằng những việc làm bình dị nhất. Qua hình tượng ấy, tác phẩm đã ngợi ca tình phụ tử thiêng liêng và gửi gắm bài học về lòng biết ơn, báo hiếu.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTỔ QUỐC TRONG TIM\n\nTôi yêu Tổ quốc tôi từ thuở bé,\nYêu cánh đồng vàng, yêu lũy tre xanh.\nYêu tiếng ru hời của mẹ mỗi tối,\nYêu mái trường xưa, yêu bạn, yêu anh.\n\nLớn lên rồi, tôi hiểu thêm đất nước,\nHiểu những hy sinh của bao thế hệ.\nMáu cha anh thấm đỏ từng tấc đất,\nĐể hôm nay ta có được hòa bình.\n\nTổ quốc ơi, hai tiếng thiêng liêng quá,\nGọi tên Người, lòng tôi thấy rưng rưng.\nDẫu đi đâu, về đâu trên đất khách,\nTôi vẫn là con của đất Việt Nam.\n\nTuổi trẻ ơi, hãy sống sao cho xứng,\nVới non sông gấm vóc của cha ông.\nHọc tập tốt, rèn luyện thêm đạo đức,\nDựng xây đời, đất nước mãi phồn vinh.\n\nCâu 1. Bài thơ trên được viết theo thể thơ nào?", "options": ["A. Thơ lục bát", "B. Thơ tám chữ", "C. Thơ tự do", "D. Thơ thất ngôn bát cú"], "answer": "B", "explain": "Mỗi dòng thơ đều có tám chữ, gieo vần chân đều đặn — thể thơ tám chữ, nhịp điệu trang trọng, phù hợp với đề tài Tổ quốc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTỔ QUỐC TRONG TIM\n\nTôi yêu Tổ quốc tôi từ thuở bé,\nYêu cánh đồng vàng, yêu lũy tre xanh.\nYêu tiếng ru hời của mẹ mỗi tối,\nYêu mái trường xưa, yêu bạn, yêu anh.\n\nLớn lên rồi, tôi hiểu thêm đất nước,\nHiểu những hy sinh của bao thế hệ.\nMáu cha anh thấm đỏ từng tấc đất,\nĐể hôm nay ta có được hòa bình.\n\nTổ quốc ơi, hai tiếng thiêng liêng quá,\nGọi tên Người, lòng tôi thấy rưng rưng.\nDẫu đi đâu, về đâu trên đất khách,\nTôi vẫn là con của đất Việt Nam.\n\nTuổi trẻ ơi, hãy sống sao cho xứng,\nVới non sông gấm vóc của cha ông.\nHọc tập tốt, rèn luyện thêm đạo đức,\nDựng xây đời, đất nước mãi phồn vinh.\n\nCâu 2. Cảm hứng chủ đạo của bài thơ là gì?", "options": ["A. Tình yêu đôi lứa", "B. Tình yêu Tổ quốc, niềm tự hào dân tộc và trách nhiệm của tuổi trẻ", "C. Nỗi buồn xa quê", "D. Tình bạn"], "answer": "B", "explain": "Bài thơ bộc lộ tình yêu Tổ quốc từ những điều bình dị đến sự hy sinh của cha anh, và kêu gọi tuổi trẻ sống xứng đáng — cảm hứng yêu nước, tự hào dân tộc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTỔ QUỐC TRONG TIM\n\nTôi yêu Tổ quốc tôi từ thuở bé,\nYêu cánh đồng vàng, yêu lũy tre xanh.\nYêu tiếng ru hời của mẹ mỗi tối,\nYêu mái trường xưa, yêu bạn, yêu anh.\n\nLớn lên rồi, tôi hiểu thêm đất nước,\nHiểu những hy sinh của bao thế hệ.\nMáu cha anh thấm đỏ từng tấc đất,\nĐể hôm nay ta có được hòa bình.\n\nTổ quốc ơi, hai tiếng thiêng liêng quá,\nGọi tên Người, lòng tôi thấy rưng rưng.\nDẫu đi đâu, về đâu trên đất khách,\nTôi vẫn là con của đất Việt Nam.\n\nTuổi trẻ ơi, hãy sống sao cho xứng,\nVới non sông gấm vóc của cha ông.\nHọc tập tốt, rèn luyện thêm đạo đức,\nDựng xây đời, đất nước mãi phồn vinh.\n\nCâu 3. Biện pháp tu từ nào được sử dụng trong câu thơ \"Máu cha anh thấm đỏ từng tấc đất\"?", "options": ["A. So sánh", "B. Nhân hóa", "C. Hoán dụ — lấy máu để chỉ sự hy sinh của cha anh", "D. Điệp ngữ"], "answer": "C", "explain": "\"Máu\" ở đây không chỉ là chất lỏng mà là hình ảnh hoán dụ chỉ sự hy sinh xương máu của các thế hệ cha anh cho độc lập dân tộc — cách diễn đạt cô đọng, giàu sức gợi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTỔ QUỐC TRONG TIM\n\nTôi yêu Tổ quốc tôi từ thuở bé,\nYêu cánh đồng vàng, yêu lũy tre xanh.\nYêu tiếng ru hời của mẹ mỗi tối,\nYêu mái trường xưa, yêu bạn, yêu anh.\n\nLớn lên rồi, tôi hiểu thêm đất nước,\nHiểu những hy sinh của bao thế hệ.\nMáu cha anh thấm đỏ từng tấc đất,\nĐể hôm nay ta có được hòa bình.\n\nTổ quốc ơi, hai tiếng thiêng liêng quá,\nGọi tên Người, lòng tôi thấy rưng rưng.\nDẫu đi đâu, về đâu trên đất khách,\nTôi vẫn là con của đất Việt Nam.\n\nTuổi trẻ ơi, hãy sống sao cho xứng,\nVới non sông gấm vóc của cha ông.\nHọc tập tốt, rèn luyện thêm đạo đức,\nDựng xây đời, đất nước mãi phồn vinh.\n\nCâu 4. Khổ thơ cuối của bài thơ có tác dụng gì?", "options": ["A. Kể lại kỉ niệm tuổi thơ", "B. Miêu tả cảnh đẹp đất nước", "C. Kêu gọi, nhắn nhủ tuổi trẻ sống xứng đáng, học tập và dựng xây đất nước", "D. Bày tỏ nỗi buồn"], "answer": "C", "explain": "Khổ cuối chuyển từ cảm xúc sang hành động với lời kêu gọi \"Tuổi trẻ ơi, hãy sống sao cho xứng\" — nhắn nhủ thế hệ trẻ biến tình yêu nước thành việc làm cụ thể.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTỔ QUỐC TRONG TIM\n\nTôi yêu Tổ quốc tôi từ thuở bé,\nYêu cánh đồng vàng, yêu lũy tre xanh.\nYêu tiếng ru hời của mẹ mỗi tối,\nYêu mái trường xưa, yêu bạn, yêu anh.\n\nLớn lên rồi, tôi hiểu thêm đất nước,\nHiểu những hy sinh của bao thế hệ.\nMáu cha anh thấm đỏ từng tấc đất,\nĐể hôm nay ta có được hòa bình.\n\nTổ quốc ơi, hai tiếng thiêng liêng quá,\nGọi tên Người, lòng tôi thấy rưng rưng.\nDẫu đi đâu, về đâu trên đất khách,\nTôi vẫn là con của đất Việt Nam.\n\nTuổi trẻ ơi, hãy sống sao cho xứng,\nVới non sông gấm vóc của cha ông.\nHọc tập tốt, rèn luyện thêm đạo đức,\nDựng xây đời, đất nước mãi phồn vinh.\n\nCâu 5. Theo em, tuổi trẻ hôm nay cần làm gì để thể hiện lòng yêu nước? (Trả lời ngắn gọn)", "answer": "Học tập tốt, rèn luyện đạo đức, góp sức xây dựng đất nước", "explain": "Chấp nhận các cách diễn đạt tương đương: chăm học, sống có trách nhiệm; giữ gìn bản sắc văn hóa; bảo vệ chủ quyền; sống xứng đáng với sự hy sinh của cha anh.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về trách nhiệm của tuổi trẻ đối với đất nước.", "explain": "DÀN Ý:\n1. Mở đoạn: tuổi trẻ là tương lai của đất nước, có trách nhiệm dựng xây Tổ quốc.\n2. Thân đoạn: (a) Trách nhiệm: học tập tốt, rèn luyện đạo đức, giữ gìn bản sắc, bảo vệ chủ quyền; (b) Noi gương cha anh đã hy sinh vì độc lập; (c) Phê phán lối sống ích kỉ, vô trách nhiệm, quay lưng với đất nước.\n3. Kết đoạn: mỗi người trẻ hãy sống xứng đáng.\n\nBÀI MẪU:\nTuổi trẻ là mùa xuân của xã hội, là tương lai của đất nước, vì vậy có trách nhiệm to lớn trong sự nghiệp dựng xây và bảo vệ Tổ quốc. Trách nhiệm ấy trước hết thể hiện ở việc chăm chỉ học tập, rèn luyện đạo đức để trở thành những công dân có ích — như lời nhắn nhủ trong bài thơ: học tập tốt, rèn luyện thêm đạo đức, dựng xây đời. Tuổi trẻ còn phải giữ gìn bản sắc văn hóa dân tộc, bảo vệ môi trường, tỉnh táo trước các âm mưu chống phá, và sẵn sàng bảo vệ chủ quyền thiêng liêng khi Tổ quốc cần. Chúng ta có được cuộc sống hòa bình hôm nay là nhờ sự hy sinh xương máu của bao thế hệ cha anh — sống xứng đáng với sự hy sinh ấy là đạo lí, là trách nhiệm không thể chối từ. Đáng phê phán là những người trẻ sống ích kỉ, chỉ biết hưởng thụ, vô cảm với vận mệnh đất nước. Mỗi người trẻ hãy tự hỏi mình đã làm được gì cho Tổ quốc, và hãy bắt đầu từ những việc nhỏ nhất ngay hôm nay.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ so sánh, đánh giá bài thơ trên với một bài thơ yêu nước em đã học.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu bài thơ Tổ quốc trong tim và vấn đề so sánh — cùng đề tài yêu nước nhưng cách thể hiện khác nhau.\nII. Thân bài:\n1. Điểm tương đồng:\n   a. Cùng cảm hứng yêu nước, tự hào dân tộc.\n   b. Cùng nhắc đến sự hy sinh của cha anh và trách nhiệm của thế hệ hôm nay.\n2. Điểm khác biệt:\n   a. Bài thơ trên: đi từ tình yêu những điều bình dị (cánh đồng, lũy tre, tiếng ru) đến nhận thức về đất nước; thể tám chữ trang trọng; giọng thơ thiết tha, kêu gọi trực tiếp.\n   b. Bài thơ đã học (ví dụ Đất Nước của Nguyễn Khoa Điềm): có thể đi sâu vào chiều dài lịch sử, văn hóa; hoặc dùng hình ảnh khác; giọng điệu khác.\n3. Đánh giá: mỗi bài thơ có vẻ đẹp riêng; cùng góp phần bồi đắp lòng yêu nước.\nIII. Kết bài: khẳng định giá trị; liên hệ trách nhiệm của bản thân.\n\nĐOẠN MẪU (mở bài):\nTình yêu Tổ quốc là mạch nguồn cảm hứng không bao giờ cạn của thơ ca Việt Nam. Mỗi thời đại, mỗi nhà thơ lại có cách riêng để nói về tình yêu đất nước. Bài thơ Tổ quốc trong tim với thể thơ tám chữ trang trọng đã thể hiện tình yêu nước từ những điều bình dị nhất đến nhận thức sâu sắc về trách nhiệm của tuổi trẻ. So sánh bài thơ này với một bài thơ yêu nước đã học sẽ giúp ta thấy rõ hơn nét độc đáo của mỗi tác phẩm và vẻ đẹp đa dạng của thơ ca yêu nước Việt Nam.", "points": 0}]}]}
