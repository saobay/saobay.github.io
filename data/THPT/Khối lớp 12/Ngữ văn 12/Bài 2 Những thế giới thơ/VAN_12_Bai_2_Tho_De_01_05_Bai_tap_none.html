(c) Cảm xúc: tình yêu, nỗi nhớ quê hương tha thiết.\n3. Kết đoạn: khẳng định sức hấp dẫn của bài thơ.\n\nBÀI MẪU:\nBài thơ Thu về trên phố nhỏ đã vẽ nên một bức tranh mùa thu phố cổ thật bình dị mà đắm say. Mùa thu hiện lên qua những hình ảnh quen thuộc: mái nhà rêu cũ, hàng sấu già nghiêng mình soi bóng nước, lá vàng rơi lả tả trước hiên thềm, mùi hoa sữa nồng nàn và gánh hàng rong thơm mùi cốm mới. Bằng phép nhân hóa tài tình và ngôn ngữ giàu sức gợi, tác giả đã thổi hồn vào cảnh vật, khiến mỗi hình ảnh đều như có tâm tình. Xen giữa bức tranh thiên nhiên là hình ảnh con người ấm áp: bà cụ hong tay bên bếp lửa kể chuyện xưa cho lũ trẻ, tiếng rao đêm vang vọng ngõ sâu. Tất cả hòa quyện thành một khúc ca về tình yêu quê hương tha thiết, về nỗi nhớ da diết của người con xa quê. Đọc bài thơ, ta như được sống lại những mùa thu êm đềm của phố cổ, để rồi thêm yêu, thêm gắn bó với mảnh đất quê hương mình.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích bài thơ trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu bài thơ (thơ tự do hiện đại) và cảm hứng chủ đạo — tình yêu quê hương qua vẻ đẹp mùa thu phố cổ.\nII. Thân bài:\n1. Thể thơ và bố cục: thơ tự do phóng khoáng; 4 khổ thơ — mỗi khổ một nét vẽ trong bức tranh thu.\n2. Hệ thống hình ảnh:\n   a. Thiên nhiên: mái nhà rêu cũ, hàng sấu già, lá vàng, hoa sữa, mưa bay — vừa thực vừa thơ.\n   b. Con người và sinh hoạt: tiếng rao đêm, bà cụ bên bếp lửa, gánh hàng rong — ấm áp tình người.\n3. Nghệ thuật: nhân hóa (hàng sấu nghiêng mình), điệp ngữ (yêu... yêu... yêu...), ngôn ngữ giàu sức gợi, nhịp điệu nhẹ nhàng, sâu lắng.\n4. Cảm xúc và tư tưởng: tình yêu, nỗi nhớ quê hương tha thiết; khát vọng giữ gìn những nét đẹp bình dị.\nIII. Kết bài: khẳng định giá trị nội dung và nghệ thuật; liên hệ tình yêu quê hương của bản thân.\n\nĐOẠN MẪU (mở bài):\nMỗi bài thơ hay là một thế giới riêng, nơi tâm hồn nhà thơ gặp gỡ tâm hồn người đọc. Bài thơ Thu về trên phố nhỏ đã mở ra một thế giới như thế — thế giới của mùa thu phố cổ với những nét đẹp bình dị mà đắm say, thấm đẫm tình yêu quê hương tha thiết của tác giả. Bằng thể thơ tự do phóng khoáng, hệ thống hình ảnh giàu sức gợi và những biện pháp tu từ tinh tế, bài thơ đã để lại trong lòng người đọc dư vị khó quên.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMẸ\n\nMẹ là ngọn gió đầu hè,\nRu con giấc ngủ trưa hè ấu thơ.\nMẹ là ánh nắng ban mai,\nSưởi ấm đời con những ngày đông sang.\n\nTay mẹ chai sạm nắng sương,\nTảo tần hôm sớm lo toan mọi bề.\nMẹ nhịn phần ngon cho con,\nMẹ dành giấc ngủ, mẹ còn thức khuya.\n\nCon đi muôn nẻo đường xa,\nNhớ cơm mẹ nấu, nhớ nhà mẹ trông.\nƯớc gì bé lại như xưa,\nĐể nghe mẹ hát ầu ơ trưa hè.\n\nCâu 1. Bài thơ trên được viết theo thể thơ nào?", "options": ["A. Thơ lục bát", "B. Thơ thất ngôn bát cú", "C. Thơ tự do", "D. Thơ song thất lục bát"], "answer": "A", "explain": "Bài thơ gồm các cặp câu 6 chữ và 8 chữ xen kẽ, gieo vần chân đúng luật — đó là thể thơ lục bát, thể thơ dân tộc ngọt ngào, dễ thuộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMẸ\n\nMẹ là ngọn gió đầu hè,\nRu con giấc ngủ trưa hè ấu thơ.\nMẹ là ánh nắng ban mai,\nSưởi ấm đời con những ngày đông sang.\n\nTay mẹ chai sạm nắng sương,\nTảo tần hôm sớm lo toan mọi bề.\nMẹ nhịn phần ngon cho con,\nMẹ dành giấc ngủ, mẹ còn thức khuya.\n\nCon đi muôn nẻo đường xa,\nNhớ cơm mẹ nấu, nhớ nhà mẹ trông.\nƯớc gì bé lại như xưa,\nĐể nghe mẹ hát ầu ơ trưa hè.\n\nCâu 2. Nhân vật trữ tình trong bài thơ bộc lộ tình cảm với ai?", "options": ["A. Người cha", "B. Người mẹ", "C. Cô giáo", "D. Quê hương"], "answer": "B", "explain": "Toàn bài thơ là lời tâm sự, ngợi ca về mẹ — người đã tảo tần nuôi con khôn lớn, nhân vật trữ tình bộc lộ lòng biết ơn sâu sắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMẸ\n\nMẹ là ngọn gió đầu hè,\nRu con giấc ngủ trưa hè ấu thơ.\nMẹ là ánh nắng ban mai,\nSưởi ấm đời con những ngày đông sang.\n\nTay mẹ chai sạm nắng sương,\nTảo tần hôm sớm lo toan mọi bề.\nMẹ nhịn phần ngon cho con,\nMẹ dành giấc ngủ, mẹ còn thức khuya.\n\nCon đi muôn nẻo đường xa,\nNhớ cơm mẹ nấu, nhớ nhà mẹ trông.\nƯớc gì bé lại như xưa,\nĐể nghe mẹ hát ầu ơ trưa hè.\n\nCâu 3. Biện pháp tu từ nào được sử dụng trong hai câu thơ \"Mẹ là ngọn gió đầu hè, / Ru con giấc ngủ trưa hè ấu thơ\"?", "options": ["A. So sánh", "B. Nhân hóa", "C. Ẩn dụ", "D. Nói quá"], "answer": "A", "explain": "Tác giả dùng từ \"là\" để đối chiếu mẹ với ngọn gió đầu hè — đó là phép so sánh, làm nổi bật sự dịu dàng, mát lành của tình mẹ dành cho con.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMẸ\n\nMẹ là ngọn gió đầu hè,\nRu con giấc ngủ trưa hè ấu thơ.\nMẹ là ánh nắng ban mai,\nSưởi ấm đời con những ngày đông sang.\n\nTay mẹ chai sạm nắng sương,\nTảo tần hôm sớm lo toan mọi bề.\nMẹ nhịn phần ngon cho con,\nMẹ dành giấc ngủ, mẹ còn thức khuya.\n\nCon đi muôn nẻo đường xa,\nNhớ cơm mẹ nấu, nhớ nhà mẹ trông.\nƯớc gì bé lại như xưa,\nĐể nghe mẹ hát ầu ơ trưa hè.\n\nCâu 4. Hình ảnh người mẹ trong bài thơ hiện lên với phẩm chất nổi bật nào?", "options": ["A. Giàu sang, quyền quý", "B. Tần tảo, hy sinh thầm lặng vì con", "C. Nghiêm khắc, khó tính", "D. Yếu đuối, cam chịu"], "answer": "B", "explain": "Qua các chi tiết: tay chai sạm nắng sương, tảo tần hôm sớm, nhịn phần ngon cho con, thức khuya — người mẹ hiện lên tần tảo, giàu đức hy sinh, tất cả vì con.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMẸ\n\nMẹ là ngọn gió đầu hè,\nRu con giấc ngủ trưa hè ấu thơ.\nMẹ là ánh nắng ban mai,\nSưởi ấm đời con những ngày đông sang.\n\nTay mẹ chai sạm nắng sương,\nTảo tần hôm sớm lo toan mọi bề.\nMẹ nhịn phần ngon cho con,\nMẹ dành giấc ngủ, mẹ còn thức khuya.\n\nCon đi muôn nẻo đường xa,\nNhớ cơm mẹ nấu, nhớ nhà mẹ trông.\nƯớc gì bé lại như xưa,\nĐể nghe mẹ hát ầu ơ trưa hè.\n\nCâu 5. Qua bài thơ, em cảm nhận được tình cảm gì của người con dành cho mẹ? (Trả lời ngắn gọn)", "answer": "Lòng biết ơn sâu sắc và tình yêu thương mẹ", "explain": "Chấp nhận các cách diễn đạt tương đương: biết ơn công lao trời biển của mẹ; yêu thương, nhớ nhung mẹ; ước muốn được báo hiếu, được trở về tuổi thơ bên mẹ.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lòng hiếu thảo của con cái đối với cha mẹ.", "explain": "DÀN Ý:\n1. Mở đoạn: hiếu thảo là đạo lí tốt đẹp, bổn phận thiêng liêng của con cái.\n2. Thân đoạn: (a) Biểu hiện: vâng lời, chăm ngoan, học giỏi, đỡ đần cha mẹ, phụng dưỡng khi cha mẹ già yếu; (b) Ý nghĩa: đền đáp công ơn sinh thành, làm cha mẹ vui lòng, giữ gìn truyền thống gia đình; (c) Phê phán thói bất hiếu, vô ơn.\n3. Kết đoạn: hãy hiếu thảo ngay từ hôm nay.\n\nBÀI MẪU:\nHiếu thảo là đạo lí tốt đẹp ngàn đời của dân tộc ta, là bổn phận thiêng liêng của mỗi người con đối với đấng sinh thành. Cha mẹ đã hy sinh cả cuộc đời để nuôi ta khôn lớn, nên lòng hiếu thảo trước hết thể hiện ở sự vâng lời, chăm ngoan, cố gắng học tập để cha mẹ vui lòng. Khi còn nhỏ, hiếu thảo là biết đỡ đần việc nhà, không làm cha mẹ phiền lòng; khi trưởng thành, hiếu thảo là phụng dưỡng cha mẹ già yếu bằng cả vật chất và tinh thần. Người con trong bài thơ Mẹ đã thể hiện lòng hiếu thảo qua nỗi nhớ da diết và ước muốn được bé lại để nghe mẹ hát ru — một tình cảm chân thành, cảm động. Ngược lại, những kẻ bất hiếu, ngược đãi cha mẹ là đi ngược đạo lí, đáng bị lên án. Hiếu thảo không cần những việc làm lớn lao, đôi khi chỉ là một lời hỏi han, một cử chỉ quan tâm mỗi ngày. Hãy yêu thương và hiếu thảo với cha mẹ ngay từ hôm nay, khi còn có thể.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích hình tượng người mẹ trong bài thơ trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu bài thơ lục bát và hình tượng người mẹ — biểu tượng của tình mẫu tử thiêng liêng.\nII. Thân bài:\n1. Thể thơ lục bát: ngọt ngào, sâu lắng, phù hợp với tình cảm mẹ con.\n2. Hình tượng người mẹ:\n   a. Qua so sánh: mẹ như ngọn gió đầu hè, như ánh nắng ban mai — dịu dàng, ấm áp, che chở.\n   b. Qua chi tiết thực: tay chai sạm nắng sương, tảo tần hôm sớm, nhịn phần ngon, thức khuya — tần tảo, hy sinh.\n   c. Qua cảm nhận của người con: nỗi nhớ cơm mẹ nấu, ước muốn bé lại — mẹ là cả thế giới tuổi thơ.\n3. Nghệ thuật: thể lục bát nhuần nhuyễn; so sánh giản dị mà thấm thía; điệp cấu trúc (Mẹ là... Mẹ nhịn... Mẹ dành...); giọng thơ thiết tha.\nIII. Kết bài: khẳng định vẻ đẹp của tình mẫu tử; liên hệ lòng biết ơn của bản thân.\n\nĐOẠN MẪU (mở bài):\nTrong kho tàng thơ ca Việt Nam, những bài thơ viết về mẹ luôn có sức lay động đặc biệt bởi tình mẫu tử là tình cảm thiêng liêng nhất của con người. Bài thơ Mẹ với thể lục bát ngọt ngào đã khắc họa thành công hình tượng người mẹ tần tảo, hy sinh — vừa bình dị, gần gũi vừa cao đẹp, để lại trong lòng người đọc niềm xúc động và biết ơn sâu sắc.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBIỂN HÁT\n\nĐêm nay biển hát ru tôi ngủ,\nSóng xô bờ cát trắng xóa một màu.\nGió mang vị mặn của quê hương yêu dấu,\nThổi vào lòng tôi bao nỗi nhớ thương sâu.\n\nBiển ơi, biển rộng đến bao la,\nChở những khát vọng của ta vươn ra khơi xa.\nNhững con tàu vượt qua sóng cả,\nMang theo ước mơ của bao người dân chài lam lũ.\n\nTôi nghe trong tiếng sóng reo vui,\nVang vọng tiếng cha, tiếng mái chèo khua nước.\nBiển nuôi ta khôn lớn từng ngày,\nBiển là máu thịt, là tình yêu không bao giờ cạn.\n\nMai này dù có đi xa muôn nẻo đường,\nTôi vẫn nhớ mãi biển quê hương tha thiết.\nBiển xanh, biển rộng và biển sâu,\nMãi là tình yêu lớn trong trái tim tôi.\n\nCâu 1. Bài thơ trên được viết theo thể thơ nào?", "options": ["A. Thơ lục bát", "B. Thơ thất ngôn bát cú", "C. Thơ tự do", "D. Thơ bốn chữ"], "answer": "C", "explain": "Số chữ trong các dòng thơ không đều nhau (từ sáu đến chín chữ), không theo niêm luật cố định — đó là thơ tự do.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBIỂN HÁT\n\nĐêm nay biển hát ru tôi ngủ,\nSóng xô bờ cát trắng xóa một màu.\nGió mang vị mặn của quê hương yêu dấu,\nThổi vào lòng tôi bao nỗi nhớ thương sâu.\n\nBiển ơi, biển rộng đến bao la,\nChở những khát vọng của ta vươn ra khơi xa.\nNhững con tàu vượt qua sóng cả,\nMang theo ước mơ của bao người dân chài lam lũ.\n\nTôi nghe trong tiếng sóng reo vui,\nVang vọng tiếng cha, tiếng mái chèo khua nước.\nBiển nuôi ta khôn lớn từng ngày,\nBiển là máu thịt, là tình yêu không bao giờ cạn.\n\nMai này dù có đi xa muôn nẻo đường,\nTôi vẫn nhớ mãi biển quê hương tha thiết.\nBiển xanh, biển rộng và biển sâu,\nMãi là tình yêu lớn trong trái tim tôi.\n\nCâu 2. Đối tượng trữ tình chính của bài thơ là gì?", "options": ["A. Người mẹ", "B. Biển quê hương", "C. Người lính", "D. Mùa thu"], "answer": "B", "explain": "Toàn bài thơ hướng về biển — từ tiếng sóng, gió mặn đến những con tàu và người dân chài; biển là đối tượng để nhân vật trữ tình gửi gắm tình cảm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBIỂN HÁT\n\nĐêm nay biển hát ru tôi ngủ,\nSóng xô bờ cát trắng xóa một màu.\nGió mang vị mặn của quê hương yêu dấu,\nThổi vào lòng tôi bao nỗi nhớ thương sâu.\n\nBiển ơi, biển rộng đến bao la,\nChở những khát vọng của ta vươn ra khơi xa.\nNhững con tàu vượt qua sóng cả,\nMang theo ước mơ của bao người dân chài lam lũ.\n\nTôi nghe trong tiếng sóng reo vui,\nVang vọng tiếng cha, tiếng mái chèo khua nước.\nBiển nuôi ta khôn lớn từng ngày,\nBiển là máu thịt, là tình yêu không bao giờ cạn.\n\nMai này dù có đi xa muôn nẻo đường,\nTôi vẫn nhớ mãi biển quê hương tha thiết.\nBiển xanh, biển rộng và biển sâu,\nMãi là tình yêu lớn trong trái tim tôi.\n\nCâu 3. Biện pháp tu từ nào được sử dụng trong câu thơ \"Đêm nay biển hát ru tôi ngủ\"?", "options": ["A. Nhân hóa", "B. So sánh", "C. Ẩn dụ", "D. Hoán dụ"], "answer": "A", "explain": "\"Hát ru\" là hành động của con người được gán cho biển — đó là phép nhân hóa, khiến biển trở nên gần gũi, có hồn như một người mẹ đang ru con ngủ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBIỂN HÁT\n\nĐêm nay biển hát ru tôi ngủ,\nSóng xô bờ cát trắng xóa một màu.\nGió mang vị mặn của quê hương yêu dấu,\nThổi vào lòng tôi bao nỗi nhớ thương sâu.\n\nBiển ơi, biển rộng đến bao la,\nChở những khát vọng của ta vươn ra khơi xa.\nNhững con tàu vượt qua sóng cả,\nMang theo ước mơ của bao người dân chài lam lũ.\n\nTôi nghe trong tiếng sóng reo vui,\nVang vọng tiếng cha, tiếng mái chèo khua nước.\nBiển nuôi ta khôn lớn từng ngày,\nBiển là máu thịt, là tình yêu không bao giờ cạn.\n\nMai này dù có đi xa muôn nẻo đường,\nTôi vẫn nhớ mãi biển quê hương tha thiết.\nBiển xanh, biển rộng và biển sâu,\nMãi là tình yêu lớn trong trái tim tôi.\n\nCâu 4. Hình ảnh \"Biển là máu thịt\" có ý nghĩa gì?", "options": ["A. Biển cung cấp hải sản cho con người", "B. Biển gắn bó máu thịt với con người, là nguồn sống, là quê hương không thể tách rời", "C. Biển có màu đỏ như máu", "D. Biển rất nguy hiểm với con người"], "answer": "B", "explain": "Bằng phép so sánh \"biển là máu thịt\", tác giả khẳng định sự gắn bó ruột thịt giữa con người và biển: biển nuôi ta khôn lớn, là quê hương, là một phần không thể thiếu của đời sống tâm hồn.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBIỂN HÁT\n\nĐêm nay biển hát ru tôi ngủ,\nSóng xô bờ cát trắng xóa một màu.\nGió mang vị mặn của quê hương yêu dấu,\nThổi vào lòng tôi bao nỗi nhớ thương sâu.\n\nBiển ơi, biển rộng đến bao la,\nChở những khát vọng của ta vươn ra khơi xa.\nNhững con tàu vượt qua sóng cả,\nMang theo ước mơ của bao người dân chài lam lũ.\n\nTôi nghe trong tiếng sóng reo vui,\nVang vọng tiếng cha, tiếng mái chèo khua nước.\nBiển nuôi ta khôn lớn từng ngày,\nBiển là máu thịt, là tình yêu không bao giờ cạn.\n\nMai này dù có đi xa muôn nẻo đường,\nTôi vẫn nhớ mãi biển quê hương tha thiết.\nBiển xanh, biển rộng và biển sâu,\nMãi là tình yêu lớn trong trái tim tôi.\n\nCâu 5. Cảm xúc chủ đạo của nhân vật trữ tình trong bài thơ là gì? (Trả lời ngắn gọn)", "answer": "Tình yêu tha thiết, niềm tự hào và nỗi nhớ với biển quê hương", "explain": "Chấp nhận các cách diễn đạt tương đương: yêu biển, gắn bó, nhớ nhung quê hương; tự hào về biển quê hương giàu đẹp.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về tình yêu quê hương của tuổi trẻ hôm nay.", "explain": "DÀN Ý:\n1. Mở đoạn: yêu quê hương là tình cảm thiêng liêng, là cội nguồn sức mạnh của mỗi con người.\n2. Thân đoạn: (a) Biểu hiện: tự hào về vẻ đẹp quê hương, gắn bó với mảnh đất chôn nhau cắt rốn như tình yêu với biển quê trong bài thơ; học tập, rèn luyện để xây dựng quê hương; (b) Phê phán thói vô cảm, quay lưng với quê hương, sính ngoại.\n3. Kết đoạn: biến tình yêu quê hương thành hành động cụ thể.\n\nBÀI MẪU:\nTình yêu quê hương là tình cảm thiêng liêng, là cội nguồn nuôi dưỡng tâm hồn và sức mạnh của mỗi con người. Quê hương có thể là biển xanh với những con tàu ra khơi như trong bài thơ, là cánh đồng lúa chín, là con đường làng rợp bóng tre — dù giản dị đến đâu cũng là nơi chôn nhau cắt rốn, nơi ta khôn lớn. Tình yêu quê hương của tuổi trẻ hôm nay không chỉ là niềm tự hào, nỗi nhớ nhung mà còn phải thể hiện bằng hành động cụ thể: chăm chỉ học tập, rèn luyện đạo đức để mai này góp sức xây dựng quê hương giàu đẹp; giữ gìn bản sắc văn hóa dân tộc; bảo vệ môi trường quê hương. Đáng phê phán là những người trẻ thờ ơ, vô cảm với quê hương, sính ngoại, quay lưng với cội nguồn. Yêu quê hương không phải là điều gì xa vời — nó bắt đầu từ những việc nhỏ nhất: yêu mái nhà, yêu con đường đến trường, yêu những con người bình dị quanh ta. Hãy để tình yêu quê hương trở thành động lực để mỗi người trẻ sống tốt hơn, có ích hơn.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích hình tượng biển trong bài thơ trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu bài thơ và hình tượng biển — vừa là cảnh đẹp thiên nhiên vừa là biểu tượng của quê hương.\nII. Thân bài:\n1. Biển trong vẻ đẹp thiên nhiên: đêm biển với sóng, gió, sao trời — hùng vĩ mà thơ mộng (khổ 1).\n2. Biển trong đời sống con người: chở khát vọng ra khơi, gắn với người dân chài lam lũ, với hình bóng người cha — biển là nguồn sống (khổ 2, 3).\n3. Biển trong tâm hồn: là máu thịt, là tình yêu không bao giờ cạn; nỗi nhớ da diết khi xa quê (khổ 4).\n4. Nghệ thuật: thể thơ tự do phóng khoáng; nhân hóa (biển hát ru), so sánh (biển là máu thịt); điệp ngữ, liệt kê (biển xanh, biển rộng, biển sâu); giọng thơ thiết tha, hào sảng.\nIII. Kết bài: khẳng định vẻ đẹp của hình tượng biển; liên hệ tình yêu quê hương.\n\nĐOẠN MẪU (mở bài):\nBiển luôn là nguồn cảm hứng bất tận của thơ ca — vừa hùng vĩ, bao la vừa gần gũi, thiết tha. Bài thơ Biển hát đã khắc họa một hình ảnh biển như thế: không chỉ là cảnh đẹp thiên nhiên mà còn là biểu tượng của quê hương, của nguồn cội nuôi dưỡng tâm hồn con người. Bằng thể thơ tự do phóng khoáng và những biện pháp tu từ tinh tế, tác giả đã gửi gắm vào hình tượng biển một tình yêu quê hương sâu nặng.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI LÍNH\n\nAnh đi giữa mùa xuân,\nBa lô nặng trên vai.\nQuê hương sau lưng anh,\nTổ quốc phía trước mặt.\n\nĐêm rừng lạnh căm căm,\nSao trời làm bạn anh.\nNhớ mẹ, nhớ em thơ,\nNén lòng, anh bước tiếp.\n\nSúng chắc trong tay anh,\nLòng son vì nước non.\nDẫu máu đào có đổ,\nAnh vẫn không sờn lòng.\n\nNgày về trong chiến thắng,\nCờ đỏ rợp trời xanh.\nAnh cười trong nắng mới,\nTổ quốc mãi thanh bình.\n\nCâu 1. Bài thơ trên được viết theo thể thơ nào?", "options": ["A. Thơ lục bát", "B. Thơ năm chữ", "C. Thơ tự do", "D. Thơ thất ngôn bát cú"], "answer": "B", "explain": "Mỗi dòng thơ đều có năm chữ, gieo vần chân đều đặn — đó là thể thơ năm chữ, gọn gàng, khỏe khoắn, phù hợp với đề tài người lính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI LÍNH\n\nAnh đi giữa mùa xuân,\nBa lô nặng trên vai.\nQuê hương sau lưng anh,\nTổ quốc phía trước mặt.\n\nĐêm rừng lạnh căm căm,\nSao trời làm bạn anh.\nNhớ mẹ, nhớ em thơ,\nNén lòng, anh bước tiếp.\n\nSúng chắc trong tay anh,\nLòng son vì nước non.\nDẫu máu đào có đổ,\nAnh vẫn không sờn lòng.\n\nNgày về trong chiến thắng,\nCờ đỏ rợp trời xanh.\nAnh cười trong nắng mới,\nTổ quốc mãi thanh bình.\n\nCâu 2. Đề tài của bài thơ là gì?", "options": ["A. Tình yêu đôi lứa", "B. Người lính và tình yêu Tổ quốc", "C. Cảnh đẹp thiên nhiên", "D. Tình bạn"], "answer": "B", "explain": "Bài thơ khắc họa hình ảnh người lính lên đường bảo vệ Tổ quốc với tình yêu quê hương, ý chí kiên cường — đề tài người lính cách mạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI LÍNH\n\nAnh đi giữa mùa xuân,\nBa lô nặng trên vai.\nQuê hương sau lưng anh,\nTổ quốc phía trước mặt.\n\nĐêm rừng lạnh căm căm,\nSao trời làm bạn anh.\nNhớ mẹ, nhớ em thơ,\nNén lòng, anh bước tiếp.\n\nSúng chắc trong tay anh,\nLòng son vì nước non.\nDẫu máu đào có đổ,\nAnh vẫn không sờn lòng.\n\nNgày về trong chiến thắng,\nCờ đỏ rợp trời xanh.\nAnh cười trong nắng mới,\nTổ quốc mãi thanh bình.\n\nCâu 3. Biện pháp tu từ nào được sử dụng trong câu thơ \"Sao trời làm bạn anh\"?", "options": ["A. Nhân hóa", "B. So sánh", "C. Ẩn dụ", "D. Nói quá"], "answer": "A", "explain": "\"Làm bạn\" là hành động của con người được gán cho sao trời — phép nhân hóa vừa làm vơi đi nỗi cô đơn của người lính đêm rừng, vừa thể hiện tâm hồn lạc quan, lãng mạn của anh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI LÍNH\n\nAnh đi giữa mùa xuân,\nBa lô nặng trên vai.\nQuê hương sau lưng anh,\nTổ quốc phía trước mặt.\n\nĐêm rừng lạnh căm căm,\nSao trời làm bạn anh.\nNhớ mẹ, nhớ em thơ,\nNén lòng, anh bước tiếp.\n\nSúng chắc trong tay anh,\nLòng son vì nước non.\nDẫu máu đào có đổ,\nAnh vẫn không sờn lòng.\n\nNgày về trong chiến thắng,\nCờ đỏ rợp trời xanh.\nAnh cười trong nắng mới,\nTổ quốc mãi thanh bình.\n\nCâu 4. Hai câu thơ \"Quê hương sau lưng anh, / Tổ quốc phía trước mặt\" thể hiện điều gì?", "options": ["A. Người lính bị lạc đường trong rừng", "B. Lí tưởng cao đẹp: ra đi vì quê hương, hướng tới Tổ quốc — tình yêu nước là động lực lên đường", "C. Người lính nhớ nhà muốn quay về", "D. Quê hương và Tổ quốc là hai khái niệm khác nhau"], "answer": "B", "explain": "Cặp câu đối nhau giữa sau lưng và trước mặt khắc họa tư thế lên đường của người lính: mang theo tình quê hương, hướng tới lí tưởng bảo vệ Tổ quốc — vẻ đẹp của chủ nghĩa anh hùng cách mạng.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNGƯỜI LÍNH\n\nAnh đi giữa mùa xuân,\nBa lô nặng trên vai.\nQuê hương sau lưng anh,\nTổ quốc phía trước mặt.\n\nĐêm rừng lạnh căm căm,\nSao trời làm bạn anh.\nNhớ mẹ, nhớ em thơ,\nNén lòng, anh bước tiếp.\n\nSúng chắc trong tay anh,\nLòng son vì nước non.\nDẫu máu đào có đổ,\nAnh vẫn không sờn lòng.\n\nNgày về trong chiến thắng,\nCờ đỏ rợp trời xanh.\nAnh cười trong nắng mới,\nTổ quốc mãi thanh bình.\n\nCâu 5. Qua bài thơ, em cảm nhận được vẻ đẹp nào của người lính? (Trả lời ngắn gọn)", "answer": "Dũng cảm, kiên cường, lạc quan và giàu tình yêu Tổ quốc", "explain": "Chấp nhận các cách diễn đạt tương đương: anh dũng, không sờn lòng trước gian khổ; lạc quan, yêu đời; sẵn sàng hy sinh vì Tổ quốc; tự hào về người lính.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lòng yêu nước của tuổi trẻ hôm nay.", "explain": "DÀN Ý:\n1. Mở đoạn: yêu nước là truyền thống quý báu, là trách nhiệm của mỗi công dân, nhất là tuổi trẻ.\n2. Thân đoạn: (a) Biểu hiện: học tập tốt, rèn luyện đạo đức, sẵn sàng bảo vệ Tổ quốc; noi gương các thế hệ cha anh như người lính trong bài thơ; (b) Trong thời bình: yêu nước là xây dựng đất nước, giữ gìn bản sắc, bảo vệ chủ quyền; (c) Phê phán thói vô cảm, sống ích kỉ, quay lưng với đất nước.\n3. Kết đoạn: biến lòng yêu nước thành hành động cụ thể mỗi ngày.\n\nBÀI MẪU:\nLòng yêu nước là truyền thống quý báu của dân tộc ta, được hun đúc qua hàng nghìn năm lịch sử dựng nước và giữ nước. Trong thời chiến, lòng yêu nước thể hiện qua sự hy sinh anh dũng của những người lính như trong bài thơ — sẵn sàng lên đường, không sờn lòng trước gian khổ vì Tổ quốc. Trong thời bình hôm nay, lòng yêu nước của tuổi trẻ thể hiện bằng những việc làm cụ thể: chăm chỉ học tập để mai này góp sức xây dựng đất nước; rèn luyện đạo đức, sống có trách nhiệm; giữ gìn bản sắc văn hóa dân tộc; tỉnh táo trước các âm mưu chia rẽ; sẵn sàng bảo vệ chủ quyền thiêng liêng của Tổ quốc khi cần. Yêu nước không phải là khẩu hiệu suông mà phải bắt đầu từ những việc nhỏ: yêu gia đình, yêu trường lớp, yêu đồng bào mình. Đáng phê phán là những người trẻ sống ích kỉ, vô cảm, quay lưng với đất nước, chạy theo lối sống ngoại lai mà quên cội nguồn. Mỗi người trẻ hãy nuôi dưỡng lòng yêu nước và biến nó thành hành động thiết thực mỗi ngày, để xứng đáng với sự hy sinh của các thế hệ cha anh.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích hình tượng người lính trong bài thơ trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu bài thơ (thể năm chữ) và hình tượng người lính — biểu tượng của chủ nghĩa anh hùng cách mạng.\nII. Thân bài:\n1. Hoàn cảnh lên đường: giữa mùa xuân, ba lô trên vai — tư thế hiên ngang, tràn đầy sức trẻ.\n2. Vẻ đẹp tâm hồn:\n   a. Tình cảm: nhớ mẹ, nhớ em nhưng nén lòng bước tiếp — tình riêng hòa trong nghĩa lớn.\n   b. Ý chí: súng chắc trong tay, không sờn lòng dù máu đào có đổ — dũng cảm, kiên cường.\n   c. Lạc quan: sao trời làm bạn, cười trong nắng mới ngày chiến thắng — tinh thần lạc quan cách mạng.\n3. Lí tưởng: quê hương sau lưng, Tổ quốc phía trước — ra đi vì nghĩa lớn.\n4. Nghệ thuật: thể thơ năm chữ gọn, khỏe; nhân hóa, đối; ngôn ngữ giản dị mà hào hùng; giọng thơ vừa trữ tình vừa tráng ca.\nIII. Kết bài: khẳng định vẻ đẹp của người lính; liên hệ lòng biết ơn và trách nhiệm của tuổi trẻ.\n\nĐOẠN MẪU (mở bài):\nHình tượng người lính đã trở thành biểu tượng cao đẹp trong thơ ca Việt Nam hiện đại — biểu tượng của lòng yêu nước, của chủ nghĩa anh hùng cách mạng. Bài thơ Người lính với thể thơ năm chữ gọn gàng, khỏe khoắn đã khắc họa thành công chân dung người chiến sĩ vừa dũng cảm, kiên cường vừa lạc quan, giàu tình cảm, để lại trong lòng người đọc niềm tự hào và biết ơn sâu sắc.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHƯỢNG ĐỎ\n\nTháng năm, phượng nở đỏ trời,\nSân trường rực rỡ như lời chia tay.\nVe ngân khúc hát vơi đầy,\nĐưa ta về lại những ngày ấu thơ.\n\nBảng đen, phấn trắng, thầy cô,\nBạn bè một thuở, bây giờ nơi đâu?\nGhế đá còn đó, hàng cau,\nMà người xưa đã xa nhau mất rồi.\n\nTôi nhặt cánh phượng ép khô,\nGửi vào trang vở học trò năm xưa.\nDẫu cho năm tháng phôi pha,\nTình thầy, nghĩa bạn vẫn là trong tim.\n\nMai này tung cánh bay xa,\nNhớ về trường cũ, nhớ nhà, nhớ quê.\nPhượng hồng thắp lửa đam mê,\nDẫn ta đi tới những miền ước mơ.\n\nCâu 1. Bài thơ trên được viết theo thể thơ nào?", "options": ["A. Thơ lục bát", "B. Thơ thất ngôn bát cú", "C. Thơ tự do", "D. Thơ tám chữ"], "answer": "A", "explain": "Bài thơ gồm các cặp câu 6 chữ và 8 chữ xen kẽ, gieo vần đúng luật — thể thơ lục bát.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHƯỢNG ĐỎ\n\nTháng năm, phượng nở đỏ trời,\nSân trường rực rỡ như lời chia tay.\nVe ngân khúc hát vơi đầy,\nĐưa ta về lại những ngày ấu thơ.\n\nBảng đen, phấn trắng, thầy cô,\nBạn bè một thuở, bây giờ nơi đâu?\nGhế đá còn đó, hàng cau,\nMà người xưa đã xa nhau mất rồi.\n\nTôi nhặt cánh phượng ép khô,\nGửi vào trang vở học trò năm xưa.\nDẫu cho năm tháng phôi pha,\nTình thầy, nghĩa bạn vẫn là trong tim.\n\nMai này tung cánh bay xa,\nNhớ về trường cũ, nhớ nhà, nhớ quê.\nPhượng hồng thắp lửa đam mê,\nDẫn ta đi tới những miền ước mơ.\n\nCâu 2. Thời điểm được nhắc đến trong bài thơ là khi nào?", "options": ["A. Tháng năm, mùa phượng nở, mùa chia tay mái trường", "B. Mùa thu tựu trường", "C. Đêm giao thừa", "D. Ngày khai giảng"], "answer": "A", "explain": "Câu mở đầu \"Tháng năm, phượng nở đỏ trời\" cùng hình ảnh ve ngân, cánh phượng ép khô cho thấy thời điểm cuối năm học — mùa chia tay mái trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHƯỢNG ĐỎ\n\nTháng năm, phượng nở đỏ trời,\nSân trường rực rỡ như lời chia tay.\nVe ngân khúc hát vơi đầy,\nĐưa ta về lại những ngày ấu thơ.\n\nBảng đen, phấn trắng, thầy cô,\nBạn bè một thuở, bây giờ nơi đâu?\nGhế đá còn đó, hàng cau,\nMà người xưa đã xa nhau mất rồi.\n\nTôi nhặt cánh phượng ép khô,\nGửi vào trang vở học trò năm xưa.\nDẫu cho năm tháng phôi pha,\nTình thầy, nghĩa bạn vẫn là trong tim.\n\nMai này tung cánh bay xa,\nNhớ về trường cũ, nhớ nhà, nhớ quê.\nPhượng hồng thắp lửa đam mê,\nDẫn ta đi tới những miền ước mơ.\n\nCâu 3. Biện pháp tu từ nào được sử dụng trong câu thơ \"Phượng hồng thắp lửa đam mê\"?", "options": ["A. So sánh", "B. Nhân hóa", "C. Ẩn dụ — lấy ngọn lửa để chỉ niềm đam mê, khát vọng", "D. Nói quá"], "answer": "C", "explain": "\"Thắp lửa đam mê\": ngọn lửa là hình ảnh ẩn dụ chỉ niềm đam mê, khát vọng tuổi trẻ được khơi dậy — cách diễn đạt hàm súc, giàu sức gợi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHƯỢNG ĐỎ\n\nTháng năm, phượng nở đỏ trời,\nSân trường rực rỡ như lời chia tay.\nVe ngân khúc hát vơi đầy,\nĐưa ta về lại những ngày ấu thơ.\n\nBảng đen, phấn trắng, thầy cô,\nBạn bè một thuở, bây giờ nơi đâu?\nGhế đá còn đó, hàng cau,\nMà người xưa đã xa nhau mất rồi.\n\nTôi nhặt cánh phượng ép khô,\nGửi vào trang vở học trò năm xưa.\nDẫu cho năm tháng phôi pha,\nTình thầy, nghĩa bạn vẫn là trong tim.\n\nMai này tung cánh bay xa,\nNhớ về trường cũ, nhớ nhà, nhớ quê.\nPhượng hồng thắp lửa đam mê,\nDẫn ta đi tới những miền ước mơ.\n\nCâu 4. Cảm xúc chủ đạo của nhân vật trữ tình trong bài thơ là gì?", "options": ["A. Vui sướng, hân hoan", "B. Bâng khuâng, lưu luyến mái trường và khát vọng vươn tới tương lai", "C. Giận hờn, trách móc", "D. Cô đơn, tuyệt vọng"], "answer": "B", "explain": "Bài thơ vừa bâng khuâng nhớ về thầy cô, bạn bè, mái trường xưa, vừa hướng tới tương lai với ngọn lửa đam mê — cảm xúc lưu luyến xen lẫn khát vọng, rất đặc trưng của tuổi học trò cuối cấp.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nPHƯỢNG ĐỎ\n\nTháng năm, phượng nở đỏ trời,\nSân trường rực rỡ như lời chia tay.\nVe ngân khúc hát vơi đầy,\nĐưa ta về lại những ngày ấu thơ.\n\nBảng đen, phấn trắng, thầy cô,\nBạn bè một thuở, bây giờ nơi đâu?\nGhế đá còn đó, hàng cau,\nMà người xưa đã xa nhau mất rồi.\n\nTôi nhặt cánh phượng ép khô,\nGửi vào trang vở học trò năm xưa.\nDẫu cho năm tháng phôi pha,\nTình thầy, nghĩa bạn vẫn là trong tim.\n\nMai này tung cánh bay xa,\nNhớ về trường cũ, nhớ nhà, nhớ quê.\nPhượng hồng thắp lửa đam mê,\nDẫn ta đi tới những miền ước mơ.\n\nCâu 5. Qua bài thơ, em cảm nhận được điều gì về tình cảm với mái trường? (Trả lời ngắn gọn)", "answer": "Lưu luyến, biết ơn thầy cô, bạn bè và mái trường", "explain": "Chấp nhận các cách diễn đạt tương đương: yêu quý, gắn bó với trường lớp; biết ơn thầy cô; trân trọng kỉ niệm tuổi học trò.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của những kỉ niệm tuổi học trò.", "explain": "DÀN Ý:\n1. Mở đoạn: tuổi học trò là quãng đời đẹp nhất, kỉ niệm học trò là hành trang quý giá.\n2. Thân đoạn: (a) Ý nghĩa: kỉ niệm về thầy cô, bạn bè, mái trường nuôi dưỡng tâm hồn, là điểm tựa tinh thần như cánh phượng ép khô trong trang vở; (b) Kỉ niệm đẹp tiếp thêm động lực vươn tới tương lai; (c) Phê phán thái độ vô tâm, không trân trọng quãng đời học sinh.\n3. Kết đoạn: hãy sống trọn vẹn để có những kỉ niệm đẹp.\n\nBÀI MẪU:\nTuổi học trò là quãng đời đẹp nhất của mỗi con người, và những kỉ niệm học trò là hành trang tinh thần quý giá theo ta suốt cuộc đời. Đó là kỉ niệm về thầy cô tận tụy, về bạn bè thân thiết, về mái trường với hàng phượng đỏ mỗi độ hè về — như cánh phượng ép khô được nhân vật trữ tình trong bài thơ cất giữ cẩn thận trong trang vở năm xưa. Những kỉ niệm đẹp ấy nuôi dưỡng tâm hồn ta, là điểm tựa tinh thần mỗi khi gặp khó khăn, và tiếp thêm động lực để ta vươn tới tương lai. Ai cũng chỉ có một thời học sinh, vì vậy hãy sống trọn vẹn từng ngày đến trường: chăm ngoan, học tốt, chân thành với bạn bè, kính trọng thầy cô để mai này nhìn lại không phải hối tiếc. Đáng phê phán là những học sinh vô tâm, coi thường kỉ luật, đánh mất những năm tháng tươi đẹp nhất đời mình vào những việc vô bổ. Hãy để tuổi học trò của mỗi chúng ta đều là những trang vở thơm tho, đáng nhớ.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận văn học khoảng 600 chữ phân tích bài thơ trên.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu bài thơ lục bát và cảm hứng chủ đạo — nỗi lưu luyến mái trường và khát vọng tuổi trẻ.\nII. Thân bài:\n1. Bức tranh mùa hè chia tay: phượng đỏ rực trời, ve ngân — không gian đậm chất học trò (khổ 1).\n2. Nỗi nhớ thầy cô, bạn bè, mái trường: bảng đen phấn trắng, ghế đá hàng cau — những hình ảnh bình dị mà thiêng liêng (khổ 2, 3).\n3. Khát vọng hướng tới tương lai: tung cánh bay xa, phượng hồng thắp lửa đam mê — từ lưu luyến đến vươn lên (khổ 4).\n4. Nghệ thuật: thể lục bát ngọt ngào; ẩn dụ (thắp lửa đam mê); điệp từ, liệt kê; giọng thơ bâng khuâng mà tràn đầy sức sống.\nIII. Kết bài: khẳng định giá trị; liên hệ tình cảm với mái trường của bản thân.\n\nĐOẠN MẪU (mở bài):\nMỗi độ hè về, sắc phượng đỏ lại gợi trong lòng bao thế hệ học trò nỗi bâng khuâng khó tả — vừa lưu luyến mái trường, vừa náo nức hướng tới chân trời mới. Bài thơ Phượng đỏ với thể lục bát ngọt ngào đã diễn tả thật tinh tế cảm xúc ấy của tuổi học trò cuối cấp: nỗi nhớ thầy cô, bạn bè hòa quyện cùng khát vọng vươn tới tương lai, để lại trong lòng người đọc bao xúc động.", "points": 0}]}]}
