<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỨC MẠNH CỦA THÓI QUEN TỐT\n\nCó một sự thật ít người để ý: thành công của con người không đến từ những hành động vĩ đại trong một ngày, mà đến từ những thói quen nhỏ được lặp lại mỗi ngày. Thói quen tốt chính là sức mạnh thầm lặng định hình cuộc đời mỗi chúng ta.\n\nTrước hết, thói quen tốt giúp ta tiến bộ từng ngày mà không tốn nhiều ý chí. Một học sinh mỗi ngày đọc thêm mười trang sách, sau một năm sẽ đọc được hơn ba nghìn trang — tương đương hàng chục cuốn sách. Một người mỗi ngày tập thể dục ba mươi phút sẽ có sức khỏe dẻo dai hơn hẳn người lười vận động. Sức mạnh của thói quen nằm ở sự tích lũy: mỗi ngày một chút, nhưng bền bỉ.\n\nBên cạnh đó, thói quen tốt còn rèn luyện tính kỉ luật và ý chí. Để duy trì việc dậy sớm học bài hay từ chối chiếc điện thoại khi cần tập trung, ta phải chiến thắng sự lười biếng của chính mình mỗi ngày. Mỗi lần chiến thắng như vậy, ý chí lại được tôi luyện thêm một phần.\n\nTuy nhiên, cần phân biệt thói quen tốt với thói quen xấu. Cũng là lặp lại mỗi ngày, nhưng lướt mạng xã hội hàng giờ hay thức khuya triền miên sẽ bào mòn sức khỏe và thời gian của ta một cách âm thầm mà ta không hay biết.\n\nVì vậy, mỗi người, nhất là các bạn trẻ, hãy chủ động xây dựng cho mình những thói quen tốt từ hôm nay: đọc sách, tập thể dục, quản lí thời gian. Đừng coi thường những việc nhỏ, bởi chính những việc nhỏ được lặp lại bền bỉ sẽ tạo nên sự khác biệt lớn trong tương lai.\n\nCâu 1. Luận đề của văn bản trên là gì?", "options": ["A. Thói quen xấu gây hại cho sức khỏe", "B. Thói quen tốt có sức mạnh định hình cuộc đời con người", "C. Học sinh cần đọc nhiều sách", "D. Nên tập thể dục mỗi ngày"], "answer": "B", "explain": "Câu mở đầu khẳng định: \"Thói quen tốt chính là sức mạnh thầm lặng định hình cuộc đời mỗi chúng ta\" — đó là luận đề, vấn đề trung tâm mà toàn bài triển khai.", "points": 0.25}, {"type": "  bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỨC MẠNH CỦA THÓI QUEN TỐT\n\nCó một sự thật ít người để ý: thành công của con người không đến từ những hành động vĩ đại trong một ngày, mà đến từ những thói quen nhỏ được lặp lại mỗi ngày. Thói quen tốt chính là sức mạnh thầm lặng định hình cuộc đời mỗi chúng ta.\n\nTrước hết, thói quen tốt giúp ta tiến bộ từng ngày mà không tốn nhiều ý chí. Một học sinh mỗi ngày đọc thêm mười trang sách, sau một năm sẽ đọc được hơn ba nghìn trang — tương đương hàng chục cuốn sách. Một người mỗi ngày tập thể dục ba mươi phút sẽ có sức khỏe dẻo dai hơn hẳn người lười vận động. Sức mạnh của thói quen nằm ở sự tích lũy: mỗi ngày một chút, nhưng bền bỉ.\n\nBên cạnh đó, thói quen tốt còn rèn luyện tính kỉ luật và ý chí. Để duy trì việc dậy sớm học bài hay từ chối chiếc điện thoại khi cần tập trung, ta phải chiến thắng sự lười biếng của chính mình mỗi ngày. Mỗi lần chiến thắng như vậy, ý chí lại được tôi luyện thêm một phần.\n\nTuy nhiên, cần phân biệt thói quen tốt với thói quen xấu. Cũng là lặp lại mỗi ngày, nhưng lướt mạng xã hội hàng giờ hay thức khuya triền miên sẽ bào mòn sức khỏe và thời gian của ta một cách âm thầm mà ta không hay biết.\n\nVì vậy, mỗi người, nhất là các bạn trẻ, hãy chủ động xây dựng cho mình những thói quen tốt từ hôm nay: đọc sách, tập thể dục, quản lí thời gian. Đừng coi thường những việc nhỏ, bởi chính những việc nhỏ được lặp lại bền bỉ sẽ tạo nên sự khác biệt lớn trong tương lai.\n\nCâu 4. Việc tác giả đề cập đến thói quen xấu trong văn bản có tác dụng gì?", "options": ["A. Để chứng tỏ tác giả hiểu biết rộng", "B. Đối chiếu, làm nổi bật giá trị của thói quen tốt bằng sự tương phản", "C. Để chuyển sang bàn về thói quen xấu", "D. Để kéo dài bài viết"], "answer": "B", "explain": "Bằng phép đối chiếu tương phản (thói quen tốt tích lũy điều hay, thói quen xấu bào mòn sức khỏe), tác giả làm nổi bật luận đề — đây cũng là thao tác so sánh trong lập luận.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỨC MẠNH CỦA THÓI QUEN TỐT\n\nCó một sự thật ít người để ý: thành công của con người không đến từ những hành động vĩ đại trong một ngày, mà đến từ những thói quen nhỏ được lặp lại mỗi ngày. Thói quen tốt chính là sức mạnh thầm lặng định hình cuộc đời mỗi chúng ta.\n\nTrước hết, thói quen tốt giúp ta tiến bộ từng ngày mà không tốn nhiều ý chí. Một học sinh mỗi ngày đọc thêm mười trang sách, sau một năm sẽ đọc được hơn ba nghìn trang — tương đương hàng chục cuốn sách. Một người mỗi ngày tập thể dục ba mươi phút sẽ có sức khỏe dẻo dai hơn hẳn người lười vận động. Sức mạnh của thói quen nằm ở sự tích lũy: mỗi ngày một chút, nhưng bền bỉ.\n\nBên cạnh đó, thói quen tốt còn rèn luyện tính kỉ luật và ý chí. Để duy trì việc dậy sớm học bài hay từ chối chiếc điện thoại khi cần tập trung, ta phải chiến thắng sự lười biếng của chính mình mỗi ngày. Mỗi lần chiến thắng như vậy, ý chí lại được tôi luyện thêm một phần.\n\nTuy nhiên, cần phân biệt thói quen tốt với thói quen xấu. Cũng là lặp lại mỗi ngày, nhưng lướt mạng xã hội hàng giờ hay thức khuya triền miên sẽ bào mòn sức khỏe và thời gian của ta một cách âm thầm mà ta không hay biết.\n\nVì vậy, mỗi người, nhất là các bạn trẻ, hãy chủ động xây dựng cho mình những thói quen tốt từ hôm nay: đọc sách, tập thể dục, quản lí thời gian. Đừng coi thường những việc nhỏ, bởi chính những việc nhỏ được lặp lại bền bỉ sẽ tạo nên sự khác biệt lớn trong tương lai.\n\nCâu 5. Qua văn bản, em sẽ xây dựng thói quen tốt nào cho bản thân? Vì sao? (Trả lời ngắn gọn)", "answer": "Một thói quen tốt cụ thể (đọc sách, dậy sớm, tập thể dục...) vì nó giúp tiến bộ bền vững", "explain": "Chấp nhận câu trả lời nêu được một thói quen tốt cụ thể và lí do hợp lí: giúp học tập tốt hơn, rèn sức khỏe, quản lí thời gian... Cốt lõi: nhận thức được sức mạnh của việc tích lũy mỗi ngày.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của thói quen tốt đối với sự thành công của tuổi trẻ.", "explain": "DÀN Ý:\n1. Mở đoạn: thói quen tốt là nền tảng của thành công.\n2. Thân đoạn: (a) Vai trò: giúp tiến bộ bền vững qua tích lũy mỗi ngày; rèn kỉ luật, ý chí; (b) Dẫn chứng: học sinh đọc sách mỗi ngày, vận động viên tập luyện đều đặn; (c) Phê phán thói quen xấu: lướt điện thoại, thức khuya.\n3. Kết đoạn: hãy xây dựng thói quen tốt từ hôm nay.\n\nBÀI MẪU:\nThói quen tốt là một trong những nền tảng quan trọng nhất dẫn đến thành công của tuổi trẻ. Thành công không phải là kết quả của một hành động vĩ đại trong ngày một ngày hai, mà là sự tích lũy bền bỉ của những việc làm nhỏ mỗi ngày. Một học sinh kiên trì đọc sách, ôn bài đều đặn sẽ tiến bộ vượt bậc sau một năm; một vận động viên tập luyện không ngừng sẽ chạm tới đỉnh cao. Bên cạnh đó, việc duy trì thói quen tốt còn rèn luyện cho ta tính kỉ luật và ý chí sắt đá — phẩm chất không thể thiếu của người thành công. Ngược lại, những thói quen xấu như lướt điện thoại hàng giờ, thức khuya triền miên sẽ âm thầm bào mòn thời gian, sức khỏe và tương lai của ta. Đáng tiếc là nhiều bạn trẻ nhận ra điều này quá muộn. Bởi vậy, ngay từ hôm nay, mỗi người trẻ hãy chủ động gieo trồng những thói quen tốt: đọc sách, tập thể dục, quản lí thời gian hiệu quả. Hãy nhớ rằng chúng ta gieo thói quen sẽ gặt tính cách, gieo tính cách sẽ gặt số phận.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về ý nghĩa của việc rèn luyện thói quen tốt trong cuộc sống.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — thói quen tốt có sức mạnh to lớn định hình cuộc đời con người.\nII. Thân bài:\n1. Giải thích: thói quen là hành vi được lặp lại thường xuyên thành nếp; thói quen tốt là những nếp sống có lợi.\n2. Ý nghĩa:\n   a. Giúp tiến bộ bền vững qua sự tích lũy mỗi ngày (dẫn chứng: đọc sách, học ngoại ngữ, tập thể dục).\n   b. Rèn luyện kỉ luật, ý chí, tính kiên trì.\n   c. Tạo nên tính cách tốt đẹp, được mọi người tin yêu.\n3. Phân biệt với thói quen xấu và tác hại của nó (đối chiếu).\n4. Cách xây dựng thói quen tốt: bắt đầu từ việc nhỏ, kiên trì 21 ngày, có kế hoạch, tự kiểm điểm.\n5. Phê phán: lối sống buông thả, viện cớ bận rộn để không rèn luyện.\nIII. Kết bài: khẳng định lại ý nghĩa; nhắn nhủ tuổi trẻ hành động ngay hôm nay.\n\nĐOẠN MẪU (mở bài):\nCó câu nói nổi tiếng: Gieo suy nghĩ gặt hành động, gieo hành động gặt thói quen, gieo thói quen gặt tính cách, gieo tính cách gặt số phận. Câu nói ấy đã chỉ ra một chân lí sâu sắc: thói quen — những việc làm nhỏ được lặp lại mỗi ngày — có sức mạnh thầm lặng mà to lớn trong việc định hình cuộc đời mỗi con người. Vì vậy, việc rèn luyện thói quen tốt, nhất là với tuổi trẻ, có ý nghĩa vô cùng quan trọng.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HÓA ĐỌC TRONG THỜI ĐẠI SỐ\n\nThời đại số mang đến cho con người vô vàn tiện ích, nhưng cũng đặt văn hóa đọc trước những thách thức chưa từng có. Khi chiếc điện thoại có thể cung cấp mọi thông tin trong vài giây, không ít người, nhất là giới trẻ, đã dần xa rời những trang sách.\n\nTrước hết, phải khẳng định: đọc sách có giá trị không gì thay thế được. Sách là kho tàng tri thức của nhân loại, là người thầy thầm lặng. Đọc sách giúp ta mở rộng hiểu biết, bồi đắp tâm hồn, rèn luyện tư duy sâu sắc. Một người ham đọc sách thường có vốn sống phong phú, khả năng diễn đạt tốt và nhân cách đẹp. Không phải ngẫu nhiên mà những vĩ nhân của mọi thời đại đều là những người đọc sách nhiều.\n\nTuy nhiên, thực trạng hiện nay đáng báo động. Nhiều bạn trẻ dành hàng giờ mỗi ngày để lướt mạng xã hội, xem video ngắn, nhưng lại không đọc nổi một cuốn sách trong cả năm. Thông tin trên mạng thì nhanh nhưng nông, nhiều mà loạn; nó cho ta cảm giác biết nhiều nhưng thực chất chỉ là những mảnh vụn tri thức, thiếu hệ thống, thiếu chiều sâu.\n\nCó ý kiến cho rằng thời đại số thì đọc trên mạng cũng là đọc. Quan điểm này chỉ đúng một phần. Đọc trên mạng tiện lợi, nhưng đọc sách — dù là sách giấy hay sách điện tử có chọn lọc — mới rèn cho ta sự tập trung, tư duy phản biện và khả năng đi sâu vào vấn đề. Vấn đề không phải là đọc ở đâu mà là đọc cái gì và đọc như thế nào.\n\nVì vậy, để giữ gìn văn hóa đọc, mỗi người cần chủ động: dành ít nhất ba mươi phút mỗi ngày cho việc đọc sách, chọn sách có giá trị, đọc có ghi chép và suy ngẫm. Nhà trường và gia đình cũng cần tạo môi trường khuyến khích đọc: thư viện phong phú, những buổi giới thiệu sách hay. Chỉ khi mỗi người đều coi đọc sách là nhu cầu thiết yếu như ăn cơm, uống nước thì văn hóa đọc mới thực sự hồi sinh.\n\nCâu 1. Vấn đề nghị luận của văn bản là gì?", "options": ["A. Tác hại của điện thoại", "B. Văn hóa đọc trong thời đại số: giá trị, thực trạng và giải pháp", "C. Cách sử dụng mạng xã hội", "D. Lịch sử của sách"], "answer": "B", "explain": "Toàn bài xoay quanh văn hóa đọc trước thách thức của thời đại số: khẳng định giá trị của sách, chỉ ra thực trạng đáng báo động và đề xuất giải pháp — đó là vấn đề nghị luận trung tâm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HÓA ĐỌC TRONG THỜI ĐẠI SỐ\n\nThời đại số mang đến cho con người vô vàn tiện ích, nhưng cũng đặt văn hóa đọc trước những thách thức chưa từng có. Khi chiếc điện thoại có thể cung cấp mọi thông tin trong vài giây, không ít người, nhất là giới trẻ, đã dần xa rời những trang sách.\n\nTrước hết, phải khẳng định: đọc sách có giá trị không gì thay thế được. Sách là kho tàng tri thức của nhân loại, là người thầy thầm lặng. Đọc sách giúp ta mở rộng hiểu biết, bồi đắp tâm hồn, rèn luyện tư duy sâu sắc. Một người ham đọc sách thường có vốn sống phong phú, khả năng diễn đạt tốt và nhân cách đẹp. Không phải ngẫu nhiên mà những vĩ nhân của mọi thời đại đều là những người đọc sách nhiều.\n\nTuy nhiên, thực trạng hiện nay đáng báo động. Nhiều bạn trẻ dành hàng giờ mỗi ngày để lướt mạng xã hội, xem video ngắn, nhưng lại không đọc nổi một cuốn sách trong cả năm. Thông tin trên mạng thì nhanh nhưng nông, nhiều mà loạn; nó cho ta cảm giác biết nhiều nhưng thực chất chỉ là những mảnh vụn tri thức, thiếu hệ thống, thiếu chiều sâu.\n\nCó ý kiến cho rằng thời đại số thì đọc trên mạng cũng là đọc. Quan điểm này chỉ đúng một phần. Đọc trên mạng tiện lợi, nhưng đọc sách — dù là sách giấy hay sách điện tử có chọn lọc — mới rèn cho ta sự tập trung, tư duy phản biện và khả năng đi sâu vào vấn đề. Vấn đề không phải là đọc ở đâu mà là đọc cái gì và đọc như thế nào.\n\nVì vậy, để giữ gìn văn hóa đọc, mỗi người cần chủ động: dành ít nhất ba mươi phút mỗi ngày cho việc đọc sách, chọn sách có giá trị, đọc có ghi chép và suy ngẫm. Nhà trường và gia đình cũng cần tạo môi trường khuyến khích đọc: thư viện phong phú, những buổi giới thiệu sách hay. Chỉ khi mỗi người đều coi đọc sách là nhu cầu thiết yếu như ăn cơm, uống nước thì văn hóa đọc mới thực sự hồi sinh.\n\nCâu 2. Luận điểm \"đọc sách có giá trị không gì thay thế được\" được chứng minh bằng luận cứ nào?", "options": ["A. Sách rẻ hơn điện thoại", "B. Sách giúp mở rộng hiểu biết, bồi đắp tâm hồn, rèn tư duy; các vĩ nhân đều ham đọc sách", "C. Sách có nhiều hình ảnh đẹp", "D. Đọc sách giúp mắt sáng"], "answer": "B", "explain": "Tác giả đưa ra lí lẽ (mở rộng hiểu biết, bồi đắp tâm hồn, rèn tư duy) và dẫn chứng (các vĩ nhân đều ham đọc sách) — luận cứ toàn diện, có sức thuyết phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HÓA ĐỌC TRONG THỜI ĐẠI SỐ\n\nThời đại số mang đến cho con người vô vàn tiện ích, nhưng cũng đặt văn hóa đọc trước những thách thức chưa từng có. Khi chiếc điện thoại có thể cung cấp mọi thông tin trong vài giây, không ít người, nhất là giới trẻ, đã dần xa rời những trang sách.\n\nTrước hết, phải khẳng định: đọc sách có giá trị không gì thay thế được. Sách là kho tàng tri thức của nhân loại, là người thầy thầm lặng. Đọc sách giúp ta mở rộng hiểu biết, bồi đắp tâm hồn, rèn luyện tư duy sâu sắc. Một người ham đọc sách thường có vốn sống phong phú, khả năng diễn đạt tốt và nhân cách đẹp. Không phải ngẫu nhiên mà những vĩ nhân của mọi thời đại đều là những người đọc sách nhiều.\n\nTuy nhiên, thực trạng hiện nay đáng báo động. Nhiều bạn trẻ dành hàng giờ mỗi ngày để lướt mạng xã hội, xem video ngắn, nhưng lại không đọc nổi một cuốn sách trong cả năm. Thông tin trên mạng thì nhanh nhưng nông, nhiều mà loạn; nó cho ta cảm giác biết nhiều nhưng thực chất chỉ là những mảnh vụn tri thức, thiếu hệ thống, thiếu chiều sâu.\n\nCó ý kiến cho rằng thời đại số thì đọc trên mạng cũng là đọc. Quan điểm này chỉ đúng một phần. Đọc trên mạng tiện lợi, nhưng đọc sách — dù là sách giấy hay sách điện tử có chọn lọc — mới rèn cho ta sự tập trung, tư duy phản biện và khả năng đi sâu vào vấn đề. Vấn đề không phải là đọc ở đâu mà là đọc cái gì và đọc như thế nào.\n\nVì vậy, để giữ gìn văn hóa đọc, mỗi người cần chủ động: dành ít nhất ba mươi phút mỗi ngày cho việc đọc sách, chọn sách có giá trị, đọc có ghi chép và suy ngẫm. Nhà trường và gia đình cũng cần tạo môi trường khuyến khích đọc: thư viện phong phú, những buổi giới thiệu sách hay. Chỉ khi mỗi người đều coi đọc sách là nhu cầu thiết yếu như ăn cơm, uống nước thì văn hóa đọc mới thực sự hồi sinh.\n\nCâu 3. Trong đoạn văn thứ tư, tác giả đã sử dụng thao tác lập luận nào?", "options": ["A. Chứng minh", "B. Giải thích", "C. Bác bỏ một phần quan điểm đọc trên mạng cũng là đọc", "D. So sánh"], "answer": "C", "explain": "Tác giả nêu ý kiến \"đọc trên mạng cũng là đọc\" rồi chỉ ra nó \"chỉ đúng một phần\", phân tích hạn chế — đó là thao tác bác bỏ (bác bỏ một phần) để bảo vệ quan điểm đúng đắn về văn hóa đọc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HÓA ĐỌC TRONG THỜI ĐẠI SỐ\n\nThời đại số mang đến cho con người vô vàn tiện ích, nhưng cũng đặt văn hóa đọc  thực trạng đáng báo động, bác bỏ quan điểm sai lầm, cuối cùng đề xuất giải pháp — trình tự logic, thuyết phục.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nVĂN HÓA ĐỌC TRONG THỜI ĐẠI SỐ\n\nThời đại số mang đến cho con người vô vàn tiện ích, nhưng cũng đặt văn hóa đọc trước những thách thức chưa từng có. Khi chiếc điện thoại có thể cung cấp mọi thông tin trong vài giây, không ít người, nhất là giới trẻ, đã dần xa rời những trang sách.\n\nTrước hết, phải khẳng định: đọc sách có giá trị không gì thay thế được. Sách là kho tàng tri thức của nhân loại, là người thầy thầm lặng. Đọc sách giúp ta mở rộng hiểu biết, bồi đắp tâm hồn, rèn luyện tư duy sâu sắc. Một người ham đọc sách thường có vốn sống phong phú, khả năng diễn đạt tốt và nhân cách đẹp. Không phải ngẫu nhiên mà những vĩ nhân của mọi thời đại đều là những người đọc sách nhiều.\n\nTuy nhiên, thực trạng hiện nay đáng báo động. Nhiều bạn trẻ dành hàng giờ mỗi ngày để lướt mạng xã hội, xem video ngắn, nhưng lại không đọc nổi một cuốn sách trong cả năm. Thông tin trên mạng thì nhanh nhưng nông, nhiều mà loạn; nó cho ta cảm giác biết nhiều nhưng thực chất chỉ là những mảnh vụn tri thức, thiếu hệ thống, thiếu chiều sâu.\n\nCó ý kiến cho rằng thời đại số thì đọc trên mạng cũng là đọc. Quan điểm này chỉ đúng một phần. Đọc trên mạng tiện lợi, nhưng đọc sách — dù là sách giấy hay sách điện tử có chọn lọc — mới rèn cho ta sự tập trung, tư duy phản biện và khả năng đi sâu vào vấn đề. Vấn đề không phải là đọc ở đâu mà là đọc cái gì và đọc như thế nào.\n\nVì vậy, để giữ gìn văn hóa đọc, mỗi người cần chủ động: dành ít nhất ba mươi phút mỗi ngày cho việc đọc sách, chọn sách có giá trị, đọc có ghi chép và suy ngẫm. Nhà trường và gia đình cũng cần tạo môi trường khuyến khích đọc: thư viện phong phú, những buổi giới thiệu sách hay. Chỉ khi mỗi người đều coi đọc sách là nhu cầu thiết yếu như ăn cơm, uống nước thì văn hóa đọc mới thực sự hồi sinh.\n\nCâu 5. Theo em, làm thế nào để lan tỏa văn hóa đọc trong giới trẻ? (Trả lời ngắn gọn)", "answer": "Tạo thói quen đọc mỗi ngày, chọn sách hay, tổ chức hoạt động khuyến đọc", "explain": "Chấp nhận các giải pháp cụ thể, khả thi: dành 30 phút đọc sách mỗi ngày; lập câu lạc bộ đọc sách; thầy cô, cha mẹ làm gương; thư viện phong phú; chia sẻ sách hay trên mạng xã hội...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của việc đọc sách đối với tuổi trẻ.", "explain": "DÀN Ý:\n1. Mở đoạn: sách là người bạn, người thầy vĩ đại của tuổi trẻ.\n2. Thân đoạn: (a) Ý nghĩa: mở rộng tri thức, bồi đắp tâm hồn, rèn tư duy, hoàn thiện nhân cách; (b) Dẫn chứng: các vĩ nhân ham đọc sách; (c) Phê phán thói lười đọc, chỉ lướt mạng nông cạn.\n3. Kết đoạn: hãy biến đọc sách thành nhu cầu hằng ngày.\n\nBÀI MẪU:\nĐọc sách có ý nghĩa vô cùng to lớn đối với sự trưởng thành của tuổi trẻ. Sách là kho tàng tri thức của nhân loại, là người thầy thầm lặng dẫn dắt ta đến những chân trời mới. Đọc sách giúp ta mở rộng hiểu biết về thế giới, bồi đắp tâm hồn thêm phong phú, rèn luyện tư duy sâu sắc và khả năng diễn đạt. Một người trẻ ham đọc sách thường có vốn sống phong phú, nhân cách đẹp và dễ thành công hơn trong cuộc sống — không phải ngẫu nhiên mà những vĩ nhân mọi thời đại đều là những người đọc rất nhiều sách. Thế nhưng, đáng buồn là nhiều bạn trẻ hôm nay dành hàng giờ lướt mạng xã hội mà không đọc nổi một cuốn sách trong năm, để tri thức của mình chỉ là những mảnh vụn nông cạn. Thông tin nhanh nhưng thiếu chiều sâu không thể thay thế những trang sách được nghiền ngẫm kĩ lưỡng. Bởi vậy, mỗi người trẻ hãy dành ít nhất ba mươi phút mỗi ngày cho việc đọc sách, chọn những cuốn sách có giá trị và đọc một cách nghiêm túc. Hãy để sách trở thành người bạn đồng hành không thể thiếu trên hành trình trưởng thành của mỗi chúng ta.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về thực trạng văn hóa đọc của giới trẻ hiện nay và giải pháp.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — văn hóa đọc của giới trẻ đang đứng trước nhiều thách thức trong thời đại số.\nII. Thân bài:\n1. Thực trạng: nhiều bạn trẻ lười đọc sách, dành thời gian cho mạng xã hội, video ngắn; đọc thì đọc lướt, thiếu chọn lọc.\n2. Nguyên nhân: sức hút của công nghệ giải trí; thiếu định hướng từ gia đình, nhà trường; sách hay chưa đến được với bạn đọc trẻ.\n3. Hậu quả: tri thức nông cạn, thiếu chiều sâu; tư duy hời hợt; tâm hồn nghèo nàn; nguy cơ lệ thuộc vào thông tin thiếu kiểm chứng.\n4. Giải pháp:\n   a. Cá nhân: xây dựng thói quen đọc mỗi ngày, chọn sách có giá trị, đọc có suy ngẫm.\n   b. Gia đình: cha mẹ làm gương, tạo tủ sách gia đình.\n   c. Nhà trường, xã hội: thư viện phong phú, hoạt động khuyến đọc, tôn vinh văn hóa đọc.\n5. Bác bỏ quan điểm sai: đọc lướt trên mạng không thể thay thế đọc sách sâu.\nIII. Kết bài: khẳng định lại ý nghĩa; kêu gọi hành động.\n\nĐOẠN MẪU (mở bài):\nCó người từng nói: Một quốc gia đọc sách là một quốc gia hùng mạnh. Thế nhưng, trong thời đại số với sức hút mãnh liệt của mạng xã hội và video ngắn, văn hóa đọc — nhất là trong giới trẻ — đang đứng trước những thách thức nghiêm trọng. Nhiều bạn trẻ có thể dành hàng giờ để lướt điện thoại nhưng lại không đọc nổi một cuốn sách trong cả năm. Thực trạng đáng báo động này đòi hỏi chúng ta phải nhìn nhận nghiêm túc và tìm ra giải pháp kịp thời.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÒNG BIẾT ƠN — ĐẠO LÍ CỦA DÂN TỘC\n\nUống nước nhớ nguồn, ăn quả nhớ kẻ trồng cây — từ ngàn xưa, lòng biết ơn đã là đạo lí tốt đẹp, là nền tảng đạo đức của dân tộc Việt Nam. Trong xã hội hiện đại, đạo lí ấy càng cần được giữ gìn và phát huy.\n\nTrước hết, biết ơn là thái độ đúng đắn trước những gì ta được nhận. Mỗi chúng ta sinh ra đã mang ơn cha mẹ sinh thành, dưỡng dục; lớn lên mang ơn thầy cô dạy dỗ; sống trong hòa bình hôm nay là nhờ sự hy sinh của bao thế hệ cha anh. Nhận thức được những ân nghĩa ấy để sống xứng đáng chính là biểu hiện của người có đạo đức.\n\nLòng biết ơn còn là động lực để con người sống tốt hơn. Người biết ơn cha mẹ sẽ cố gắng học tập, rèn luyện để cha mẹ vui lòng; người biết ơn thầy cô sẽ trân trọng từng bài học; người biết ơn đất nước sẽ ra sức góp phần dựng xây quê hương. Biết ơn không phải là lời nói suông mà phải thể hiện bằng hành động cụ thể.\n\nĐáng buồn là trong cuộc sống hiện đại, không ít người đã quên đi đạo lí này. Có những người con coi sự hy sinh của cha mẹ là điều hiển nhiên, thậm chí ngược đãi đấng sinh thành. Có những học sinh vô lễ với thầy cô. Có những người trẻ sống ích kỉ, chỉ biết nhận mà không biết cho, quên rằng mình đang thừa hưởng thành quả của bao người đi trước.\n\nCó ý kiến cho rằng thời nay thực dụng, nói đến biết ơn là sáo rỗng. Đây là quan điểm sai lầm. Càng trong xã hội hiện đại đầy bon chen, lòng biết ơn càng là liều thuốc cho tâm hồn, là sợi dây gắn kết con người với nhau, là thước đo nhân cách.\n\nVì vậy, mỗi chúng ta hãy nuôi dưỡng lòng biết ơn từ những việc nhỏ nhất: một lời cảm ơn chân thành, một việc làm đỡ đần cha mẹ, một sự cố gắng trong học tập để không phụ công thầy cô. Khi lòng biết ơn trở thành nếp sống, xã hội sẽ ấm áp và nhân văn hơn rất nhiều.\n\nCâu 1. Luận đề của văn bản là gì?", "options": ["A. Phê phán những kẻ vô ơn", "B. Lòng biết ơn là đạo lí tốt đẹp cần được giữ gìn và phát huy", "C. Công ơn của cha mẹ", "D. Sự hy sinh của cha anh"], "answer": "B", "explain": "Câu mở đầu khẳng định lòng biết ơn là đạo lí tốt đẹp, và câu kết luận nhấn mạnh \"càng cần được giữ gìn và phát huy\" — đó là luận đề xuyên suốt văn bản.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÒNG BIẾT ƠN — ĐẠO LÍ CỦA DÂN TỘC\n\nUống nước nhớ nguồn, ăn quả nhớ kẻ trồng cây — từ ngàn xưa, lòng biết ơn đã là đạo lí tốt đẹp, là nền tảng đạo đức của dân tộc Việt Nam. Trong xã hội hiện đại, đạo lí ấy càng cần được giữ gìn và phát huy.\n\nTrước hết, biết ơn là thái độ đúng đắn trước những gì ta được nhận. Mỗi chúng ta sinh ra đã mang ơn cha mẹ sinh thành, dưỡng dục; lớn lên mang ơn thầy cô dạy dỗ; sống trong hòa bình hôm nay là nhờ sự hy sinh của bao thế hệ cha anh. Nhận thức được những ân nghĩa ấy để sống xứng đáng chính là biểu hiện của người có đạo đức.\n\nLòng biết ơn còn là động lực để con người sống tốt hơn. Người biết ơn cha mẹ sẽ cố gắng học tập, rèn luyện để cha mẹ vui lòng; người biết ơn thầy cô sẽ trân trọng từng bài học; người biết ơn đất nước sẽ ra sức góp phần dựng xây quê hương. Biết ơn không phải là lời nói suông mà phải thể hiện bằng hành động cụ thể.\n\nĐáng buồn là trong cuộc sống hiện đại, không ít người đã quên đi đạo lí này. Có những người con coi sự hy sinh của cha mẹ là điều hiển nhiên, thậm chí ngược đãi đấng sinh thành. Có những học sinh vô lễ với thầy cô. Có những người trẻ sống ích kỉ, chỉ biết nhận mà không biết cho, quên rằng mình đang thừa hưởng thành quả của bao người đi trước.\n\nCó ý kiến cho rằng thời nay thực dụng, nói đến biết ơn là sáo rỗng. Đây là quan điểm sai lầm. Càng trong xã hội hiện đại đầy bon chen, lòng biết ơn càng là liều thuốc cho tâm hồn, là sợi dây gắn kết con người với nhau, là thước đo nhân cách.\n\nVì vậy, mỗi chúng ta hãy nuôi dưỡng lòng biết ơn từ những việc nhỏ nhất: một lời cảm ơn chân thành, một việc làm đỡ đần cha mẹ, một sự cố gắng trong học tập để không phụ công thầy cô. Khi lòng biết ơn trở thành nếp sống, xã hội sẽ ấm áp và nhân văn hơn rất nhiều.\n\nCâu 2. Tác giả đã sử dụng những câu tục ngữ nào để mở đầu văn bản?", "options": ["A. Có công mài sắt, có ngày nên kim", "B. Uống nước nhớ nguồn, ăn quả nhớ kẻ trồng cây", "C. Lá lành đùm lá rách", "D. Một cây làm chẳng nên non"], "answer": "B", "explain": "Văn bản mở đầu bằng hai câu tục ngữ Uống nước nhớ nguồn, ăn quả nhớ kẻ trồng cây — dẫn chứng dân gian giàu sức thuyết phục, làm cơ sở cho toàn bài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÒNG BIẾT ƠN — ĐẠO LÍ CỦA DÂN TỘC\n\nUống nước nhớ nguồn, ăn quả nhớ kẻ trồng cây — từ ngàn xưa, lòng biết ơn đã là đạo lí tốt đẹp, là nền tảng đạo đức của dân tộc Việt Nam. Trong xã hội hiện đại, đạo lí ấy càng cần được giữ gìn và phát huy.\n\nTrước hết, biết ơn là thái độ đúng đắn trước những gì ta được nhận. Mỗi chúng ta sinh ra đã mang ơn cha mẹ sinh thành, dưỡng dục; lớn lên mang ơn thầy cô dạy dỗ; sống trong hòa bình hôm nay là nhờ sự hy sinh của bao thế hệ cha anh. Nhận thức được những ân nghĩa ấy để sống xứng đáng chính là biểu hiện của người có đạo đức.\n\nLòng biết ơn còn là động lực để con người sống tốt hơn. Người biết ơn cha mẹ sẽ cố gắng học tập, rèn luyện để cha mẹ vui lòng; người biết ơn thầy cô sẽ trân trọng từng bài học; người biết ơn đất nước sẽ ra sức góp phần dựng xây quê hương. Biết ơn không phải là lời nói suông mà phải thể hiện bằng hành động cụ thể.\n\nĐáng buồn là trong cuộc sống hiện đại, không ít người đã quên đi đạo lí này. Có những người con coi sự hy sinh của cha mẹ là điều hiển nhiên, thậm chí ngược đãi đấng sinh thành. Có những học sinh vô lễ với thầy cô. Có những người trẻ sống ích kỉ, chỉ biết nhận mà không biết cho, quên rằng mình đang thừa hưởng thành quả của bao người đi trước.\n\nCó ý kiến cho rằng thời nay thực dụng, nói đến biết ơn là sáo rỗng. Đây là quan điểm sai lầm. Càng trong xã hội hiện đại đầy bon chen, lòng biết ơn càng là liều thuốc cho tâm hồn, là sợi dây gắn kết con người với nhau, là thước đo nhân cách.\n\nVì vậy, mỗi chúng ta hãy nuôi dưỡng lòng biết ơn từ những việc nhỏ nhất: một lời cảm ơn chân thành, một việc làm đỡ đần cha mẹ, một sự cố gắng trong học tập để không phụ công thầy cô. Khi lòng biết ơn trở thành nếp sống, xã hội sẽ ấm áp và nhân văn hơn rất nhiều.\n\nCâu 3. Luận điểm ở đoạn văn thứ ba (về động lực sống tốt) được triển khai bằng cách nào?", "options": ["A. Chỉ nêu lí lẽ chung chung", "B. Liệt kê các biểu hiện cụ thể của lòng biết ơn trong quan hệ với cha mẹ, thầy cô, đất nước", "C. Kể một câu chuyện", "D. Trích dẫn số liệu"], "answer": "B", "explain": "Tác giả liệt kê cụ thể: biết ơn cha mẹ thì cố gắng học tập; biết ơn thầy cô thì trân trọng bài học; biết ơn đất nước thì góp sức dựng xây — cách triển khai cụ thể, dễ hiểu, dễ thấm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÒNG BIẾT ƠN — ĐẠO LÍ CỦA DÂN TỘC\n\nUống nước nhớ nguồn, ăn quả nhớ kẻ trồng cây — từ ngàn xưa, lòng biết ơn đã là đạo lí tốt đẹp, là nền tảng đạo đức của dân tộc Việt Nam. Trong xã hội hiện đại, đạo lí ấy càng cần được giữ gìn và phát huy.\n\nTrước hết, biết ơn là thái độ đúng đắn trước những gì ta được nhận. Mỗi chúng ta sinh ra đã mang ơn cha mẹ sinh thành, dưỡng dục; lớn lên mang ơn thầy cô dạy dỗ; sống trong hòa bình hôm nay là nhờ sự hy sinh của bao thế hệ cha anh. Nhận thức được những ân nghĩa ấy để sống xứng đáng chính là biểu hiện của người có đạo đức.\n\nLòng biết ơn còn là động lực để con người sống tốt hơn. Người biết ơn cha mẹ sẽ cố gắng học tập, rèn luyện để cha mẹ vui lòng; người biết ơn thầy cô sẽ trân trọng từng bài học; người biết ơn đất nước sẽ ra sức góp phần dựng xây quê hương. Biết ơn không phải là lời nói suông mà phải thể hiện bằng hành động cụ thể.\n\nĐáng buồn là trong cuộc sống hiện đại, không ít người đã quên đi đạo lí này. Có những người con coi sự hy sinh của cha mẹ là điều hiển nhiên, thậm chí ngược đãi đấng sinh thành. Có những học sinh vô lễ với thầy cô. Có những người trẻ sống ích kỉ, chỉ biết nhận mà không biết cho, quên rằng mình đang thừa hưởng thành quả của bao người đi trước.\n\nCó ý kiến cho rằng thời nay thực dụng, nói đến biết ơn là sáo rỗng. Đây là quan điểm sai lầm. Càng trong xã hội hiện đại đầy bon chen, lòng biết ơn càng là liều thuốc cho tâm hồn, là sợi dây gắn kết con người với nhau, là thước đo nhân cách.\n\nVì vậy, mỗi chúng ta hãy nuôi dưỡng lòng biết ơn từ những việc nhỏ nhất: một lời cảm ơn chân thành, một việc làm đỡ đần cha mẹ, một sự cố gắng trong học tập để không phụ công thầy cô. Khi lòng biết ơn trở thành nếp sống, xã hội sẽ ấm áp và nhân văn hơn rất nhiều.\n\nCâu 4. Đoạn văn thứ năm (bác bỏ ý kiến thời nay thực dụng) sử dụng thao tác lập luận nào?", "options": ["A. Chứng minh", "B. Giải thích", "C. Bác bỏ quan điểm sai để bảo vệ đạo lí biết ơn", "D. So sánh"], "answer": "C", "explain": "Tác giả nêu ý kiến sai (\"nói đến biết ơn là sáo rỗng\") rồi khẳng định \"đây là quan điểm sai lầm\", đưa ra lí lẽ phản biện — thao tác bác bỏ điển hình.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÒNG BIẾT ƠN — ĐẠO LÍ CỦA DÂN TỘC\n\nUống nước nhớ nguồn, ăn quả nhớ kẻ trồng cây — từ ngàn xưa, lòng biết ơn đã là đạo lí tốt đẹp, là nền tảng đạo đức của dân tộc Việt Nam. Trong xã hội hiện đại, đạo lí ấy càng cần được giữ gìn và phát huy.\n\nTrước hết, biết ơn là thái độ đúng đắn trước những gì ta được nhận. Mỗi chúng ta sinh ra đã mang ơn cha mẹ sinh thành, dưỡng dục; lớn lên mang ơn thầy cô dạy dỗ; sống trong hòa bình hôm nay là nhờ sự hy sinh của bao thế hệ cha anh. Nhận thức được những ân nghĩa ấy để sống xứng đáng chính là biểu hiện của người có đạo đức.\n\nLòng biết ơn còn là động lực để con người sống tốt hơn. Người biết ơn cha mẹ sẽ cố gắng học tập, rèn luyện để cha mẹ vui lòng; người biết ơn thầy cô sẽ trân trọng từng bài học; người biết ơn đất nước sẽ ra sức góp phần dựng xây quê hương. Biết ơn không phải là lời nói suông mà phải thể hiện bằng hành động cụ thể.\n\nĐáng buồn là trong cuộc sống hiện đại, không ít người đã quên đi đạo lí này. Có những người con coi sự hy sinh của cha mẹ là điều hiển nhiên, thậm chí ngược đãi đấng sinh thành. Có những học sinh vô lễ với thầy cô. Có những người trẻ sống ích kỉ, chỉ biết nhận mà không biết cho, quên rằng mình đang thừa hưởng thành quả của bao người đi trước.\n\nCó ý kiến cho rằng thời nay thực dụng, nói đến biết ơn là sáo rỗng. Đây là quan điểm sai lầm. Càng trong xã hội hiện đại đầy bon chen, lòng biết ơn càng là liều thuốc cho tâm hồn, là sợi dây gắn kết con người với nhau, là thước đo nhân cách.\n\nVì vậy, mỗi chúng ta hãy nuôi dưỡng lòng biết ơn từ những việc nhỏ nhất: một lời cảm ơn chân thành, một việc làm đỡ đần cha mẹ, một sự cố gắng trong học tập để không phụ công thầy cô. Khi lòng biết ơn trở thành nếp sống, xã hội sẽ ấm áp và nhân văn hơn rất nhiều.\n\nCâu 5. Theo em, học sinh thể hiện lòng biết ơn với thầy cô bằng cách nào? (Trả lời ngắn gọn)", "answer": "Chăm ngoan, học giỏi, lễ phép, kính trọng thầy cô", "explain": "Chấp nhận các cách diễn đạt tương đương: vâng lời, cố gắng học tập; biết ơn bằng hành động cụ thể; thăm hỏi, tri ân thầy cô nhân ngày lễ...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lòng biết ơn cha mẹ của con cái.", "explain": "DÀN Ý:\n1. Mở đoạn: công cha nghĩa mẹ thiêng liêng, con cái phải biết ơn.\n2. Thân đoạn: (a) Công ơn: sinh thành, nuôi dưỡng, hy sinh cả đời vì con; (b) Biểu hiện biết ơn: hiếu thảo, chăm ngoan, học giỏi, phụng dưỡng; (c) Phê phán thói vô ơn, bất hiếu.\n3. Kết đoạn: báo hiếu ngay từ hôm nay.\n\nBÀI MẪU:\nCông cha như núi Thái Sơn, nghĩa mẹ như nước trong nguồn — công ơn sinh thành, dưỡng dục của cha mẹ là thiêng liêng và to lớn không gì sánh được, vì vậy lòng biết ơn cha mẹ là đạo lí, là bổn phận tự nhiên của mỗi người con. Cha mẹ đã hy sinh cả tuổi xuân, sức khỏe, thậm chí cả ước mơ của mình để nuôi ta khôn lớn nên người. Lòng biết ơn ấy phải được thể hiện bằng hành động cụ thể: khi còn nhỏ là chăm ngoan, vâng lời, cố gắng học tập để cha mẹ vui lòng; khi trưởng thành là biết đỡ đần, phụng dưỡng cha mẹ già yếu cả về vật chất lẫn tinh thần. Đáng lên án là những kẻ vô ơn, coi sự hy sinh của cha mẹ là điều hiển nhiên, thậm chí ngược đãi, bỏ rơi đấng sinh thành khi họ già yếu — đó là tội lỗi khó tha thứ, đi ngược với đạo lí làm người. Biết ơn cha mẹ không cần những việc làm lớn lao; đôi khi chỉ là một lời hỏi han mỗi ngày, một việc nhà đỡ đần, một kết quả học tập tốt cũng đủ làm cha mẹ ấm lòng. Hãy yêu thương và báo hiếu cha mẹ ngay từ hôm nay, đừng để đến khi không còn cơ hội mới hối tiếc.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về đạo lí uống nước nhớ nguồn của dân tộc ta.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu đạo lí uống nước nhớ nguồn — truyền thống quý báu của dân tộc.\nII. Thân bài:\n1. Giải thích: uống nước nhớ nguồn nghĩa là biết ơn những người đã mang lại cho ta cuộc sống hôm nay (cha mẹ, thầy cô, cha anh, quê hương).\n2. Chứng minh:\n   a. Trong gia đình: biết ơn cha mẹ (dẫn chứng: sự hy sinh thầm lặng).\n   b. Trong nhà trường: biết ơn thầy cô (ngày 20-11, truyền thống tôn sư trọng đạo).\n   c. Với đất nước: biết ơn các anh hùng liệt sĩ (đền ơn đáp nghĩa, ngày 27-7).\n3. Ý nghĩa: là nền tảng đạo đức, gắn kết cộng đồng, tạo sức mạnh dân tộc.\n4. Phê phán: thói vô ơn, thực dụng, quay lưng với cội nguồn.\n5. Bài học: nuôi dưỡng lòng biết ơn bằng hành động cụ thể.\nIII. Kết bài: khẳng định giá trị trường tồn của đạo lí; nhắn nhủ thế hệ trẻ.\n\nĐOẠN MẪU (mở bài):\nDân tộc Việt Nam có kho tàng đạo lí vô cùng phong phú, trong đó uống nước nhớ nguồn là một trong những truyền thống quý báu nhất, được hun đúc qua hàng nghìn năm lịch sử. Đạo lí ấy nhắc nhở mỗi con người phải biết ơn những người đã mang lại cho mình cuộc sống hôm nay — từ cha mẹ, thầy cô đến các thế hệ cha anh và quê hương đất nước. Trong xã hội hiện đại, khi lối sống thực dụng có xu hướng lấn át, việc giữ gìn và phát huy đạo lí uống nước nhớ nguồn càng trở nên cần thiết.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMẠNG XÃ HỘI: CON DAO HAI LƯỠI\n\nMạng xã hội đã trở thành một phần không thể thiếu trong đời sống hiện đại. Với hàng tỉ người dùng trên toàn cầu, nó vừa mang lại vô vàn lợi ích, vừa tiềm ẩn không ít nguy cơ — đúng như hình ảnh con dao hai lưỡi.\n\nVề mặt tích cực, mạng xã hội giúp con người kết nối, chia sẻ thông tin nhanh chóng. Nhờ nó, ta có thể trò chuyện với người thân ở xa, cập nhật tin tức thời sự, học hỏi kiến thức từ khắp nơi trên thế giới. Nhiều phong trào từ thiện, nhiều chiến dịch bảo vệ môi trường đã lan tỏa mạnh mẽ nhờ mạng xã hội. Với học sinh, mạng xã hội còn là kho tài liệu học tập phong phú nếu biết khai thác đúng cách.\n\nTuy nhiên, mặt trái của mạng xã hội cũng rất đáng lo ngại. Không ít bạn trẻ nghiện mạng xã hội, dành hàng giờ mỗi ngày để lướt tin vô bổ, sao nhãng học tập. Thông tin giả, tin xấu độc lan truyền chóng mặt, đầu độc nhận thức, nhất là với những người thiếu kĩ năng kiểm chứng. Nguy hiểm hơn, nhiều bạn trẻ sống ảo, so sánh mình với những hình ảnh hào nhoáng trên mạng rồi tự ti, trầm cảm; hoặc vô tình trở thành nạn nhân của lừa đảo, bắt nạt trực tuyến.\n\nCó ý kiến cho rằng nên cấm học sinh dùng mạng xã hội. Quan điểm này cực đoan và không khả thi. Trong thời đại số, cấm đoán chỉ khiến các em tìm cách lách luật; điều quan trọng là giáo dục kĩ năng sử dụng mạng an toàn, thông minh.\n\nVì vậy, thay vì xa lánh hay nghiện ngập, mỗi chúng ta hãy làm chủ mạng xã hội: dùng nó để học tập, kết nối và lan tỏa điều tốt đẹp; đồng thời tỉnh táo trước thông tin xấu, quản lí thời gian hợp lí. Gia đình và nhà trường cần đồng hành, hướng dẫn các em kĩ năng số thay vì chỉ cấm đoán. Chỉ khi con người làm chủ công nghệ chứ không bị công nghệ chi phối thì mạng xã hội mới thực sự phát huy mặt tốt đẹp của nó.\n\nCâu 1. Hình ảnh con dao hai lưỡi trong nhan đề có ý nghĩa gì?", "options": ["A. Mạng xã hội rất sắc bén", "B. Mạng xã hội vừa có lợi ích vừa có nguy cơ, tác hại", "C. Mạng xã hội nguy hiểm như dao", "D. Nên cấm dùng mạng xã hội"], "answer": "B", "explain": "Con dao hai lưỡi là hình ảnh ẩn dụ: mạng xã hội mang lại lợi ích to lớn nhưng cũng tiềm ẩn nguy cơ — vấn đề là ở cách con người sử dụng nó.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMẠNG XÃ HỘI: CON DAO HAI LƯỠI\n\nMạng xã hội đã trở thành một phần không thể thiếu trong đời sống hiện đại. Với hàng tỉ người dùng trên toàn cầu, nó vừa mang lại vô vàn lợi ích, vừa tiềm ẩn không ít nguy cơ — đúng như hình ảnh con dao hai lưỡi.\n\nVề mặt tích cực, mạng xã hội giúp con người kết nối, chia sẻ thông tin nhanh chóng. Nhờ nó, ta có thể trò chuyện với người thân ở xa, cập nhật tin tức thời sự, học hỏi kiến thức từ khắp nơi trên thế giới. Nhiều phong trào từ thiện, nhiều chiến dịch bảo vệ môi trường đã lan tỏa mạnh mẽ nhờ mạng xã hội. Với học sinh, mạng xã hội còn là kho tài liệu học tập phong phú nếu biết khai thác đúng cách.\n\nTuy nhiên, mặt trái của mạng xã hội cũng rất đáng lo ngại. Không ít bạn trẻ nghiện mạng xã hội, dành hàng giờ mỗi ngày để lướt tin vô bổ, sao nhãng học tập. Thông tin giả, tin xấu độc lan truyền chóng mặt, đầu độc nhận thức, nhất là với những người thiếu kĩ năng kiểm chứng. Nguy hiểm hơn, nhiều bạn trẻ sống ảo, so sánh mình với những hình ảnh hào nhoáng trên mạng rồi tự ti, trầm cảm; hoặc vô tình trở thành nạn nhân của lừa đảo, bắt nạt trực tuyến.\n\nCó ý kiến cho rằng nên cấm học sinh dùng mạng xã hội. Quan điểm này cực đoan và không khả thi. Trong thời đại số, cấm đoán chỉ khiến các em tìm cách lách luật; điều quan trọng là giáo dục kĩ năng sử dụng mạng an toàn, thông minh.\n\nVì vậy, thay vì xa lánh hay nghiện ngập, mỗi chúng ta hãy làm chủ mạng xã hội: dùng nó để học tập, kết nối và lan tỏa điều tốt đẹp; đồng thời tỉnh táo trước thông tin xấu, quản lí thời gian hợp lí. Gia đình và nhà trường cần đồng hành, hướng dẫn các em kĩ năng số thay vì chỉ cấm đoán. Chỉ khi con người làm chủ công nghệ chứ không bị công nghệ chi phối thì mạng xã hội mới thực sự phát huy mặt tốt đẹp của nó.\n\nCâu 2. Luận cứ nào KHÔNG được dùng để chứng minh mặt tích cực của mạng xã hội?", "options": ["A. Kết nối, chia sẻ thông tin nhanh chóng", "B. Lan tỏa các phong trào từ thiện, bảo vệ môi trường", "C. Là kho tài liệu học tập phong phú", "D. Giúp tăng chiều cao"], "answer": "D", "explain": "Văn bản liệt kê các lợi ích: kết nối, chia sẻ thông tin, lan tỏa phong trào tốt đẹp, kho tài liệu học tập — không hề nhắc đến việc tăng chiều cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMẠNG XÃ HỘI: CON DAO HAI LƯỠI\n\nMạng xã hội đã trở thành một phần không thể thiếu trong đời sống hiện đại. Với hàng tỉ người dùng trên toàn cầu, nó vừa mang lại vô vàn lợi ích, vừa tiềm ẩn không ít nguy cơ — đúng như hình ảnh con dao hai lưỡi.\n\nVề mặt tích cực, mạng xã hội giúp con người kết nối, chia sẻ thông tin nhanh chóng. Nhờ nó, ta có thể trò chuyện với người thân ở xa, cập nhật tin tức thời sự, học hỏi kiến thức từ khắp nơi trên thế giới. Nhiều phong trào từ thiện, nhiều chiến dịch bảo vệ môi trường đã lan tỏa mạnh mẽ nhờ mạng xã hội. Với học sinh, mạng xã hội còn là kho tài liệu học tập phong phú nếu biết khai thác đúng cách.\n\nTuy nhiên, mặt trái của mạng xã hội cũng rất đáng lo ngại. Không ít bạn trẻ nghiện mạng xã hội, dành hàng giờ mỗi ngày để lướt tin vô bổ, sao nhãng học tập. Thông tin giả, tin xấu độc lan truyền chóng mặt, đầu độc nhận thức, nhất là với những người thiếu kĩ năng kiểm chứng. Nguy hiểm hơn, nhiều bạn trẻ sống ảo, so sánh mình với những hình ảnh hào nhoáng trên mạng rồi tự ti, trầm cảm; hoặc vô tình trở thành nạn nhân của lừa đảo, bắt nạt trực tuyến.\n\nCó ý kiến cho rằng nên cấm học sinh dùng mạng xã hội. Quan điểm này cực đoan và không khả thi. Trong thời đại số, cấm đoán chỉ khiến các em tìm cách lách luật; điều quan trọng là giáo dục kĩ năng sử dụng mạng an toàn, thông minh.\n\nVì vậy, thay vì xa lánh hay nghiện ngập, mỗi chúng ta hãy làm chủ mạng xã hội: dùng nó để học tập, kết nối và lan tỏa điều tốt đẹp; đồng thời tỉnh táo trước thông tin xấu, quản lí thời gian hợp lí. Gia đình và nhà trường cần đồng hành, hướng dẫn các em kĩ năng số thay vì chỉ cấm đoán. Chỉ khi con người làm chủ công nghệ chứ không bị công nghệ chi phối thì mạng xã hội mới thực sự phát huy mặt tốt đẹp của nó.\n\nCâu 3. Bố cục của văn bản được sắp xếp theo trình tự nào?", "options": ["A. Chỉ nêu mặt tích cực", "B. Nêu mặt tích cực — chỉ ra mặt trái — bác bỏ quan điểm cực đoan — đề xuất giải pháp", "C. Kể chuyện rồi rút ra bài học", "D. So sánh mạng xã hội xưa và nay"], "answer": "B", "explain": "Văn bản có bố cục nghị luận điển hình: thừa nhận mặt tốt, phân tích mặt xấu, bác bỏ giải pháp cực đoan (cấm đoán), rồi đề xuất hướng sử dụng đúng đắn — lập luận toàn diện, khách quan.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMẠNG XÃ HỘI: CON DAO HAI LƯỠI\n\nMạng xã hội đã trở thành một phần không thể thiếu trong đời sống hiện đại. Với hàng tỉ người dùng trên toàn cầu, nó vừa mang lại vô vàn lợi ích, vừa tiềm ẩn không ít nguy cơ — đúng như hình ảnh con dao hai lưỡi.\n\nVề mặt tích cực, mạng xã hội giúp con người kết nối, chia sẻ thông tin nhanh chóng. Nhờ nó, ta có thể trò chuyện với người thân ở xa, cập nhật tin tức thời sự, học hỏi kiến thức từ khắp nơi trên thế giới. Nhiều phong trào từ thiện, nhiều chiến dịch bảo vệ môi trường đã lan tỏa mạnh mẽ nhờ mạng xã hội. Với học sinh, mạng xã hội còn là kho tài liệu học tập phong phú nếu biết khai thác đúng cách.\n\nTuy nhiên, mặt trái của mạng xã hội cũng rất đáng lo ngại. Không ít bạn trẻ nghiện mạng xã hội, dành hàng giờ mỗi ngày để lướt tin vô bổ, sao nhãng học tập. Thông tin giả, tin xấu độc lan truyền chóng mặt, đầu độc nhận thức, nhất là với những người thiếu kĩ năng kiểm chứng. Nguy hiểm hơn, nhiều bạn trẻ sống ảo, so sánh mình với những hình ảnh hào nhoáng trên mạng rồi tự ti, trầm cảm; hoặc vô tình trở thành nạn nhân của lừa đảo, bắt nạt trực tuyến.\n\nCó ý kiến cho rằng nên cấm học sinh dùng mạng xã hội. Quan điểm này cực đoan và không khả thi. Trong thời đại số, cấm đoán chỉ khiến các em tìm cách lách luật; điều quan trọng là giáo dục kĩ năng sử dụng mạng an toàn, thông minh.\n\nVì vậy, thay vì xa lánh hay nghiện ngập, mỗi chúng ta hãy làm chủ mạng xã hội: dùng nó để học tập, kết nối và lan tỏa điều tốt đẹp; đồng thời tỉnh táo trước thông tin xấu, quản lí thời gian hợp lí. Gia đình và nhà trường cần đồng hành, hướng dẫn các em kĩ năng số thay vì chỉ cấm đoán. Chỉ khi con người làm chủ công nghệ chứ không bị công nghệ chi phối thì mạng xã hội mới thực sự phát huy mặt tốt đẹp của nó.\n\nCâu 4. Quan điểm của tác giả về việc sử dụng mạng xã hội là gì?", "options": ["A. Nên cấm hoàn toàn", "B. Nên dùng thoải mái không giới hạn", "C. Làm chủ mạng xã hội: khai thác mặt tốt, tỉnh táo trước mặt xấu, quản lí thời gian", "D. Chỉ người lớn mới nên dùng"], "answer": "C", "explain": "Kết bài khẳng định: \"con người làm chủ công nghệ chứ không bị công nghệ chi phối\" — quan điểm cân bằng, thực tế: không xa lánh cũng không nghiện ngập.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMẠNG XÃ HỘI: CON DAO HAI LƯỠI\n\nMạng xã hội đã trở thành một phần không thể thiếu trong đời sống hiện đại. Với hàng tỉ người dùng trên toàn cầu, nó vừa mang lại vô vàn lợi ích, vừa tiềm ẩn không ít nguy cơ — đúng như hình ảnh con dao hai lưỡi.\n\nVề mặt tích cực, mạng xã hội giúp con người kết nối, chia sẻ thông tin nhanh chóng. Nhờ nó, ta có thể trò chuyện với người thân ở xa, cập nhật tin tức thời sự, học hỏi kiến thức từ khắp nơi trên thế giới. Nhiều phong trào từ thiện, nhiều chiến dịch bảo vệ môi trường đã lan tỏa mạnh mẽ nhờ mạng xã hội. Với học sinh, mạng xã hội còn là kho tài liệu học tập phong phú nếu biết khai thác đúng cách.\n\nTuy nhiên, mặt trái của mạng xã hội cũng rất đáng lo ngại. Không ít bạn trẻ nghiện mạng xã hội, dành hàng giờ mỗi ngày để lướt tin vô bổ, sao nhãng học tập. Thông tin giả, tin xấu độc lan truyền chóng mặt, đầu độc nhận thức, nhất là với những người thiếu kĩ năng kiểm chứng. Nguy hiểm hơn, nhiều bạn trẻ sống ảo, so sánh mình với những hình ảnh hào nhoáng trên mạng rồi tự ti, trầm cảm; hoặc vô tình trở thành nạn nhân của lừa đảo, bắt nạt trực tuyến.\n\nCó ý kiến cho rằng nên cấm học sinh dùng mạng xã hội. Quan điểm này cực đoan và không khả thi. Trong thời đại số, cấm đoán chỉ khiến các em tìm cách lách luật; điều quan trọng là giáo dục kĩ năng sử dụng mạng an toàn, thông minh.\n\nVì vậy, thay vì xa lánh hay nghiện ngập, mỗi chúng ta hãy làm chủ mạng xã hội: dùng nó để học tập, kết nối và lan tỏa điều tốt đẹp; đồng thời tỉnh táo trước thông tin xấu, quản lí thời gian hợp lí. Gia đình và nhà trường cần đồng hành, hướng dẫn các em kĩ năng số thay vì chỉ cấm đoán. Chỉ khi con người làm chủ công nghệ chứ không bị công nghệ chi phối thì mạng xã hội mới thực sự phát huy mặt tốt đẹp của nó.\n\nCâu 5. Theo em, học sinh nên sử dụng mạng xã hội như thế nào cho đúng cách? (Trả lời ngắn gọn)", "answer": "Dùng để học tập, kết nối lành mạnh; quản lí thời gian; tỉnh táo trước tin giả", "explain": "Chấp nhận các cách diễn đạt tương đương: khai thác tài liệu học tập; không nghiện, không lướt vô bổ; kiểm chứng thông tin; không so sánh, sống ảo; bảo vệ thông tin cá nhân...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về cách sử dụng mạng xã hội thông minh của tuổi trẻ.", "explain": "DÀN Ý:\n1. Mở đoạn: mạng xã hội là con dao hai lưỡi, tuổi trẻ cần sử dụng thông minh.\n2. Thân đoạn: (a) Dùng để học tập, cập nhật kiến thức, kết nối bạn bè, lan tỏa điều tốt; (b) Tỉnh táo: kiểm chứng tin tức, quản lí thời gian, không sống ảo, bảo vệ thông tin cá nhân; (c) Phê phán nghiện mạng, lướt vô bổ, tin và lan truyền tin giả.\n3. Kết đoạn: làm chủ công nghệ.\n\nBÀI MẪU:\nMạng xã hội là con dao hai lưỡi, vì vậy tuổi trẻ cần sử dụng nó một cách thông minh để phát huy mặt tốt và hạn chế mặt xấu. Sử dụng thông minh nghĩa là biết khai thác mạng xã hội phục vụ học tập: tìm tài liệu, tham gia các nhóm học tập, cập nhật kiến thức; dùng nó để kết nối bạn bè, người thân và lan tỏa những điều tốt đẹp trong cuộc sống. Đồng thời, người trẻ phải tỉnh táo trước mặt trái: kiểm chứng thông tin trước khi tin và chia sẻ để không tiếp tay cho tin giả; quản lí thời gian, không để việc lướt mạng vô bổ chiếm hết thời gian học tập; không sống ảo, không so sánh mình với những hình ảnh hào nhoáng trên mạng; bảo vệ thông tin cá nhân để tránh lừa đảo. Đáng phê phán là những bạn trẻ nghiện mạng xã hội, sao nhãng học hành, hoặc vô tư chia sẻ tin chưa kiểm chứng gây hoang mang dư luận. Công nghệ sinh ra để phục vụ con người — hãy làm chủ mạng xã hội chứ đừng để nó chi phối cuộc sống của mình.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về tác động của mạng xã hội đối với giới trẻ hiện nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — mạng xã hội tác động sâu sắc, hai mặt đến giới trẻ.\nII. Thân bài:\n1. Tác động tích cực:\n   a. Kết nối, chia sẻ thông tin nhanh chóng.\n   b. Kho tri thức, tài liệu học tập phong phú.\n   c. Lan tỏa các phong trào tốt đẹp (từ thiện, môi trường).\n2. Tác động tiêu cực:\n   a. Nghiện mạng, sao nhãng học tập, ảnh hưởng sức khỏe.\n   b. Tin giả, nội dung độc hại đầu độc nhận thức.\n   c. Sống ảo, tự ti, trầm cảm; nguy cơ lừa đảo, bắt nạt trực tuyến.\n3. Nguyên nhân: thiếu kĩ năng số, thiếu định hướng, sức hút của nội dung giải trí.\n4. Giải pháp: giáo dục kĩ năng sử dụng an toàn; gia đình, nhà trường đồng hành; bản thân tự quản lí.\n5. Bác bỏ: cấm đoán cực đoan không khả thi.\nIII. Kết bài: khẳng định cần làm chủ công nghệ; nhắn nhủ tuổi trẻ.\n\nĐOẠN MẪU (mở bài):\nChưa bao giờ trong lịch sử, một phương tiện lại gắn bó mật thiết với giới trẻ như mạng xã hội hôm nay. Với chiếc điện thoại trên tay, các bạn trẻ có thể kết nối với cả thế giới chỉ trong vài giây. Thế nhưng, bên cạnh những lợi ích to lớn, mạng xã hội cũng đang tác động tiêu cực đến không ít bạn trẻ: nghiện lướt mạng, tin vào tin giả, sống ảo và đánh mất mình trong thế giới ảo. Nhìn nhận đầy đủ hai mặt tác động này để có cách ứng xử đúng đắn là vấn đề cấp thiết đặt ra với tuổi trẻ hôm nay.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÝ CHÍ VÀ NGHỊ LỰC\n\nTrong cuộc đời, ai cũng phải đối mặt với khó khăn, thử thách. Điều phân biệt người thành công với kẻ thất bại không phải là hoàn cảnh, mà chính là ý chí và nghị lực — sức mạnh tinh thần giúp con người đứng dậy sau mỗi lần vấp ngã.\n\nTrước hết, ý chí giúp con người vượt qua nghịch cảnh. Thầy Nguyễn Ngọc Ký bị liệt cả hai tay từ nhỏ, nhưng bằng ý chí phi thường, thầy đã tập viết bằng chân, trở thành nhà giáo ưu tú và tấm gương sáng cho bao thế hệ. Nick Vujicic không tay không chân vẫn trở thành diễn giả truyền cảm hứng cho hàng triệu người trên thế giới. Những tấm gương ấy chứng minh: khi ý chí đủ lớn, không có khó khăn nào là không thể vượt qua.\n\nBên cạnh đó, nghị lực còn giúp con người kiên trì theo đuổi mục tiêu đến cùng. Thomas Edison đã thất bại hàng nghìn lần trước khi phát minh ra bóng đèn điện; mỗi thất bại với ông chỉ là một cách không thành công, chứ không phải là dấu chấm hết. Nếu thiếu nghị lực, ông đã bỏ cuộc từ lần thất bại đầu tiên và nhân loại đã không có ánh sáng điện hôm nay.\n\nTuy nhiên, ý chí không phải là sự liều lĩnh mù quáng. Có những người cố chấp theo đuổi những mục tiêu viển vông, bất chấp thực tế — đó không phải là ý chí mà là sự cứng đầu. Ý chí đích thực phải đi đôi với trí tuệ: biết đặt mục tiêu phù hợp, biết điều chỉnh phương pháp khi cần thiết.\n\nVì vậy, mỗi người trẻ hãy rèn luyện ý chí từ những việc nhỏ nhất: kiên trì học tập dù khó khăn, không nản lòng trước thất bại, dám đứng dậy sau mỗi lần vấp ngã. Hãy nhớ rằng thất bại chỉ là tạm thời, còn bỏ cuộc mới là thất bại vĩnh viễn.\n\nCâu 1. Luận đề của văn bản là gì?", "options": ["A. Kể về các tấm gương vượt khó", "B. Ý chí và nghị lực là sức mạnh giúp con người vượt qua khó khăn, đi đến thành công", "C. Phê phán những kẻ thiếu ý chí", "D. Bàn về sự liều lĩnh"], "answer": "B", "explain": "Câu mở đầu khẳng định: điều phân biệt người thành công với kẻ thất bại \"chính là ý chí và nghị lực\" — đó là luận đề của toàn bài.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÝ CHÍ VÀ NGHỊ LỰC\n\nTrong cuộc đời, ai cũng phải đối mặt với khó khăn, thử thách. Điều phân biệt người thành công với kẻ thất bại không phải là hoàn cảnh, mà chính là ý chí và nghị lực — sức mạnh tinh thần giúp con người đứng dậy sau mỗi lần vấp ngã.\n\nTrước hết, ý chí giúp con người vượt qua nghịch cảnh. Thầy Nguyễn Ngọc Ký bị liệt cả hai tay từ nhỏ, nhưng bằng ý chí phi thường, thầy đã tập viết bằng chân, trở thành nhà giáo ưu tú và tấm gương sáng cho bao thế hệ. Nick Vujicic không tay không chân vẫn trở thành diễn giả truyền cảm hứng cho hàng triệu người trên thế giới. Những tấm gương ấy chứng minh: khi ý chí đủ lớn, không có khó khăn nào là không thể vượt qua.\n\nBên cạnh đó, nghị lực còn giúp con người kiên trì theo đuổi mục tiêu đến cùng. Thomas Edison đã thất bại hàng nghìn lần trước khi phát minh ra bóng đèn điện; mỗi thất bại với ông chỉ là một cách không thành công, chứ không phải là dấu chấm hết. Nếu thiếu nghị lực, ông đã bỏ cuộc từ lần thất bại đầu tiên và nhân loại đã không có ánh sáng điện hôm nay.\n\nTuy nhiên, ý chí không phải là sự liều lĩnh mù quáng. Có những người cố chấp theo đuổi những mục tiêu viển vông, bất chấp thực tế — đó không phải là ý chí mà là sự cứng đầu. Ý chí đích thực phải đi đôi với trí tuệ: biết đặt mục tiêu phù hợp, biết điều chỉnh phương pháp khi cần thiết.\n\nVì vậy, mỗi người trẻ hãy rèn luyện ý chí từ những việc nhỏ nhất: kiên trì học tập dù khó khăn, không nản lòng trước thất bại, dám đứng dậy ết điều chỉnh phương pháp khi cần thiết.\n\nVì vậy, mỗi người trẻ hãy rèn luyện ý chí từ những việc nhỏ nhất: kiên trì học tập dù khó khăn, không nản lòng trước thất bại, dám đứng dậy sau mỗi lần vấp ngã. Hãy nhớ rằng thất bại chỉ là tạm thời, còn bỏ cuộc mới là thất bại vĩnh viễn.\n\nCâu 3. Đoạn văn về Thomas Edison sử dụng thao tác lập luận nào?", "options": ["A. Giải thích khái niệm", "B. Chứng minh bằng dẫn chứng cụ thể về sự kiên trì theo đuổi mục tiêu", "C. So sánh Edison với người khác", "D. Bác bỏ"], "answer": "B", "explain": "Câu chuyện Edison thất bại hàng nghìn lần vẫn kiên trì đến khi thành công là dẫn chứng chứng minh cho luận điểm nghị lực giúp kiên trì theo đuổi mục tiêu đến cùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÝ CHÍ VÀ NGHỊ LỰC\n\nTrong cuộc đời, ai cũng phải đối mặt với khó khăn, thử thách. Điều phân biệt người thành công với kẻ thất bại không phải là hoàn cảnh, mà chính là ý chí và nghị lực — sức mạnh tinh thần giúp con người đứng dậy sau mỗi lần vấp ngã.\n\nTrước hết, ý chí giúp con người vượt qua nghịch cảnh. Thầy Nguyễn Ngọc Ký bị liệt cả hai tay từ nhỏ, nhưng bằng ý chí phi thường, thầy đã tập viết bằng chân, trở thành nhà giáo ưu tú và tấm gương sáng cho bao thế hệ. Nick Vujicic không tay không chân vẫn trở thành diễn giả truyền cảm hứng cho hàng triệu người trên thế giới. Những tấm gương ấy chứng minh: khi ý chí đủ lớn, không có khó khăn nào là không thể vượt qua.\n\nBên cạnh đó, nghị lực còn giúp con người kiên trì theo đuổi mục tiêu đến cùng. Thomas Edison đã thất bại hàng nghìn lần trước khi phát minh ra bóng đèn điện; mỗi thất bại với ông chỉ là một cách không thành công, chứ không phải là dấu chấm hết. Nếu thiếu nghị lực, ông đã bỏ cuộc từ lần thất bại đầu tiên và nhân loại đã không có ánh sáng điện hôm nay.\n\nTuy nhiên, ý chí không phải là sự liều lĩnh mù quáng. Có những người cố chấp theo đuổi những mục tiêu viển vông, bất chấp thực tế — đó không phải là ý chí mà là sự cứng đầu. Ý chí đích thực phải đi đôi với trí tuệ: biết đặt mục tiêu phù hợp, biết điều chỉnh phương pháp khi cần thiết.\n\nVì vậy, mỗi người trẻ hãy rèn luyện ý chí từ những việc nhỏ nhất: kiên trì học tập dù khó khăn, không nản lòng trước thất bại, dám đứng dậy sau mỗi lần vấp ngã. Hãy nhớ rằng thất bại chỉ là tạm thời, còn bỏ cuộc mới là thất bại vĩnh viễn.\n\nCâu 4. Vì sao tác giả phân biệt ý chí đích thực với \"sự cứng đầu\"?", "options": ["A. Để chứng tỏ mình hiểu biết", "B. Để làm rõ bản chất của ý chí: phải đi đôi với trí tuệ, tránh hiểu sai thành liều lĩnh mù quáng", "C. Để phê phán Edison", "D. Để chuyển chủ đề"], "answer": "B", "explain": "Bằng thao tác phân tích – phân biệt, tác giả làm sâu sắc thêm luận đề: ý chí đích thực không phải cố chấp mù quáng mà phải gắn với trí tuệ, mục tiêu phù hợp — tránh cách hiểu phiến diện.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nÝ CHÍ VÀ NGHỊ LỰC\n\nTrong cuộc đời, ai cũng phải đối mặt với khó khăn, thử thách. Điều phân biệt người thành công với kẻ thất bại không phải là hoàn cảnh, mà chính là ý chí và nghị lực — sức mạnh tinh thần giúp con người đứng dậy sau mỗi lần vấp ngã.\n\nTrước hết, ý chí giúp con người vượt qua nghịch cảnh. Thầy Nguyễn Ngọc Ký bị liệt cả hai tay từ nhỏ, nhưng bằng ý chí phi thường, thầy đã tập viết bằng chân, trở thành nhà giáo ưu tú và tấm gương sáng cho bao thế hệ. Nick Vujicic không tay không chân vẫn trở thành diễn giả truyền cảm hứng cho hàng triệu người trên thế giới. Những tấm gương ấy chứng minh: khi ý chí đủ lớn, không có khó khăn nào là không thể vượt qua.\n\nBên cạnh đó, nghị lực còn giúp con người kiên trì theo đuổi mục tiêu đến cùng. Thomas Edison đã thất bại hàng nghìn lần trước khi phát minh ra bóng đèn điện; mỗi thất bại với ông chỉ là một cách không thành công, chứ không phải là dấu chấm hết. Nếu thiếu nghị lực, ông đã bỏ cuộc từ lần thất bại đầu tiên và nhân loại đã không có ánh sáng điện hôm nay.\n\nTuy nhiên, ý chí không phải là sự liều lĩnh mù quáng. Có những người cố chấp theo đuổi những mục tiêu viển vông, bất chấp thực tế — đó không phải là ý chí mà là sự cứng đầu. Ý chí đích thực phải đi đôi với trí tuệ: biết đặt mục tiêu phù hợp, biết điều chỉnh phương pháp khi cần thiết.\n\nVì vậy, mỗi người trẻ hãy rèn luyện ý chí từ những việc nhỏ nhất: kiên trì học tập dù khó khăn, không nản lòng trước thất bại, dám đứng dậy sau mỗi lần vấp ngã. Hãy nhớ rằng thất bại chỉ là tạm thời, còn bỏ cuộc mới là thất bại vĩnh viễn.\n\nCâu 5. Theo em, học sinh rèn luyện ý chí bằng cách nào? (Trả lời ngắn gọn)", "answer": "Kiên trì học tập, không nản trước khó khăn, dám đứng dậy sau thất bại", "explain": "Chấp nhận các cách diễn đạt tương đương: đặt mục tiêu và quyết tâm thực hiện; vượt qua sự lười biếng; học từ thất bại; rèn từ việc nhỏ hằng ngày...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của ý chí đối với tuổi trẻ.", "explain": "DÀN Ý:\n1. Mở đoạn: ý chí là sức mạnh tinh thần không thể thiếu của tuổi trẻ.\n2. Thân đoạn: (a) Vai trò: giúp vượt qua khó khăn, kiên trì theo đuổi ước mơ như thầy Nguyễn Ngọc Ký, Edison; (b) Tuổi trẻ nhiều ước mơ nhưng cũng nhiều cám dỗ, cần ý chí để không bỏ cuộc; (c) Phê phán thói nản chí, đầu hàng số phận.\n3. Kết đoạn: rèn ý chí từ việc nhỏ.\n\nBÀI MẪU:\nÝ chí là sức mạnh tinh thần vô cùng quan trọng đối với tuổi trẻ trên hành trình chinh phục ước mơ. Tuổi trẻ là lứa tuổi của hoài bão lớn lao, nhưng cũng là lúc phải đối mặt với không ít khó khăn: áp lực học tập, cám dỗ của game và mạng xã hội, những thất bại đầu đời. Chỉ có ý chí vững vàng mới giúp người trẻ vượt qua tất cả để kiên trì theo đuổi mục tiêu đến cùng — như thầy Nguyễn Ngọc Ký bị liệt hai tay vẫn quyết tâm viết bằng chân để trở thành nhà giáo, như Edison thất bại hàng nghìn lần vẫn không bỏ cuộc để mang ánh sáng đến cho nhân loại. Ngược lại, những bạn trẻ thiếu ý chí sẽ dễ dàng nản lòng trước khó khăn nhỏ, bỏ dở giữa chừng và sống một cuộc đời tầm thường, uổng phí tuổi xuân. Ý chí không phải bẩm sinh mà được rèn luyện từ những việc nhỏ nhất: dậy sớm học bài dù buồn ngủ, kiên trì giải một bài toán khó, đứng dậy sau mỗi lần vấp ngã. Hãy nhớ: thất bại chỉ là tạm thời, còn bỏ cuộc mới là thất bại vĩnh viễn.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về sức mạnh của nghị lực trong cuộc sống.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — nghị lực là sức mạnh giúp con người chiến thắng nghịch cảnh.\nII. Thân bài:\n1. Giải thích: nghị lực là sức mạnh tinh thần, ý chí kiên cường không chịu khuất phục trước khó khăn.\n2. Chứng minh vai trò:\n   a. Giúp vượt qua nghịch cảnh (Nguyễn Ngọc Ký, Nick Vujicic).\n   b. Giúp kiên trì theo đuổi mục tiêu đến thành công (Edison và bóng đèn điện).\n   c. Giúp hoàn thiện bản thân, khẳng định giá trị.\n3. Phân biệt: nghị lực đích thực gắn với trí tuệ, khác với cố chấp, liều lĩnh.\n4. Phê phán: thói nản chí, đầu hàng số phận, đổ lỗi cho hoàn cảnh.\n5. Bài học: rèn luyện nghị lực từ việc nhỏ; đặt mục tiêu phù hợp và kiên trì.\nIII. Kết bài: khẳng định lại; nhắn nhủ tuổi trẻ.\n\nĐOẠN MẪU (mở bài):\nCuộc đời là một hành trình dài với không ít chông gai, thử thách. Trên hành trình ấy, có người gục ngã, có người vươn lên — sự khác biệt nằm ở nghị lực, sức mạnh tinh thần giúp con người không chịu khuất phục trước số phận. Từ thầy Nguyễn Ngọc Ký viết bằng chân đến Nick Vujicic không tay chân vẫn truyền cảm hứng cho thế giới, lịch sử đã chứng minh: khi nghị lực đủ lớn, con người có thể biến điều không thể thành có thể.", "points": 0}]}]}
