inh", "B. Giải thích", "C. Bác bỏ quan điểm sai lầm, vô trách nhiệm", "D. So sánh"], "answer": "C", "explain": "Tác giả nêu ý kiến sai (\"cá nhân nhỏ bé không làm được gì\") rồi khẳng định \"đây là suy nghĩ sai lầm và vô trách nhiệm\", đưa ra lí lẽ phản biện — thao tác bác bỏ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nBẢO VỆ MÔI TRƯỜNG LÀ BẢO VỆ CHÍNH MÌNH\n\nMôi trường đang kêu cứu. Biến đổi khí hậu, ô nhiễm không khí, rác thải nhựa tràn lan — những vấn đề nhức nhối ấy không còn là chuyện của riêng ai. Bảo vệ môi trường chính là bảo vệ cuộc sống của chính chúng ta hôm nay và của các thế hệ mai sau.\n\nTrước hết, môi trường gắn bó mật thiết với sức khỏe con người. Không khí ô nhiễm gây ra các bệnh về đường hô hấp; nguồn nước bẩn là nguyên nhân của nhiều dịch bệnh; thực phẩm nhiễm độc đe dọa từng bữa ăn. Mỗi năm, ô nhiễm môi trường cướp đi sinh mạng của hàng triệu người trên thế giới. Phá hoại môi trường, xét cho cùng, chính là tự đầu độc mình.\n\nBên cạnh đó, bảo vệ môi trường còn là trách nhiệm với tương lai. Tài nguyên thiên nhiên không phải vô tận; rừng bị chặt phá, biển bị ô nhiễm, đất bị thoái hóa — tất cả đều để lại hậu quả cho con cháu chúng ta. Một đứa trẻ sinh ra hôm nay xứng đáng được hít thở bầu không khí trong lành, được uống nguồn nước sạch như cha ông ta đã từng.\n\nCó ý kiến cho rằng bảo vệ môi trường là việc của nhà nước, của các tổ chức lớn, cá nhân nhỏ bé không làm được gì. Đây là suy nghĩ sai lầm và vô trách nhiệm. Mỗi hành động nhỏ — tiết kiệm điện nước, phân loại rác, hạn chế túi ni lông, trồng một cây xanh — khi được hàng triệu người cùng làm sẽ tạo nên sức mạnh to lớn.\n\nVì vậy, bảo vệ môi trường phải bắt đầu từ ý thức của mỗi người, từ những việc làm cụ thể mỗi ngày. Đừng đợi đến khi không còn không khí sạch để thở, không còn nước sạch để uống mới hối hận. Hành động ngay hôm nay — vì chính chúng ta và vì tương lai.\n\nCâu 4. Câu văn \"Đừng đợi đến khi không  nước sạch để uống mới hối hận. Hành động ngay hôm nay — vì chính chúng ta và vì tương lai.\n\nCâu 5. Theo em, học sinh có thể làm gì để bảo vệ môi trường? (Trả lời ngắn gọn)", "answer": "Tiết kiệm điện nước, phân loại rác, hạn chế rác nhựa, trồng cây xanh", "explain": "Chấp nhận các hành động cụ thể, khả thi: không xả rác bừa bãi; dùng bình nước cá nhân; tham gia vệ sinh trường lớp, khu phố; tuyên truyền cho mọi người...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về trách nhiệm của tuổi trẻ trong việc bảo vệ môi trường.", "explain": "DÀN Ý:\n1. Mở đoạn: bảo vệ môi trường là trách nhiệm chung, tuổi trẻ phải tiên phong.\n2. Thân đoạn: (a) Vì sao: môi trường gắn với sức khỏe và tương lai; tuổi trẻ là chủ nhân tương lai; (b) Việc làm cụ thể: tiết kiệm, phân loại rác, trồng cây, tuyên truyền; (c) Phê phán thói vô ý thức: xả rác, phá hoại cây xanh.\n3. Kết đoạn: hành động ngay từ hôm nay.\n\nBÀI MẪU:\nBảo vệ môi trường là trách nhiệm của toàn xã hội, trong đó tuổi trẻ phải là lực lượng tiên phong. Bởi lẽ, môi trường gắn bó mật thiết với sức khỏe và tương lai của chính chúng ta: không khí ô nhiễm gây bệnh tật, nguồn nước bẩn đe dọa sự sống, và thế hệ trẻ hôm nay sẽ là những người phải gánh chịu hậu quả nặng nề nhất nếu môi trường tiếp tục bị tàn phá. Trách nhiệm ấy thể hiện qua những việc làm cụ thể mỗi ngày: tiết kiệm điện, nước; phân loại rác thải; hạn chế túi ni lông, đồ nhựa dùng một lần; tích cực trồng và bảo vệ cây xanh; tham gia các chiến dịch vệ sinh môi trường và tuyên truyền cho mọi người cùng thực hiện. Đáng phê phán là những bạn trẻ vô ý thức: xả rác bừa bãi, bẻ cây, phá hoại công viên, coi bảo vệ môi trường là việc của người khác. Mỗi hành động nhỏ khi được hàng triệu người trẻ cùng làm sẽ tạo nên sức mạnh to lớn. Hãy hành động ngay từ hôm nay — vì một Việt Nam xanh, sạch, đẹp và vì tương lai của chính chúng ta.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về vấn đề ô nhiễm môi trường hiện nay và trách nhiệm của con người.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — ô nhiễm môi trường đang ở mức báo động.\nII. Thân bài:\n1. Thực trạng: ô nhiễm không khí, nguồn nước, rác thải nhựa tràn lan; biến đổi khí hậu.\n2. Nguyên nhân: ý thức kém của một bộ phận người dân; sản xuất, kinh doanh thiếu trách nhiệm; quản lí chưa chặt chẽ.\n3. Hậu quả: ảnh hưởng sức khỏe (bệnh tật); thiệt hại kinh tế; đe dọa tương lai các thế hệ.\n4. Giải pháp:\n   a. Nâng cao ý thức mỗi người từ việc nhỏ.\n   b. Hoàn thiện pháp luật, xử lí nghiêm vi phạm.\n   c. Phát triển công nghệ xanh, kinh tế tuần hoàn.\n5. Bác bỏ: quan điểm bảo vệ môi trường chỉ là việc của nhà nước.\nIII. Kết bài: khẳng định bảo vệ môi trường là bảo vệ chính mình; kêu gọi hành động.\n\nĐOẠN MẪU (mở bài):\nTrái Đất — ngôi nhà chung của nhân loại — đang kêu cứu. Những cánh rừng bị chặt phá, những dòng sông đen ngòm vì ô nhiễm, bầu không khí đặc quánh khói bụi ở các đô thị lớn... tất cả đều là hồi chuông báo động về tình trạng môi trường hiện nay. Ô nhiễm môi trường không còn là vấn đề xa vời mà đã trực tiếp đe dọa sức khỏe, cuộc sống của mỗi chúng ta. Nhìn nhận đúng thực trạng, nguyên nhân, hậu quả và tìm ra giải pháp là trách nhiệm cấp thiết của toàn xã hội hôm nay.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIÁ TRỊ CỦA THỜI GIAN\n\nThời gian là tài sản quý giá nhất mà tạo hóa ban cho con người, bởi nó công bằng với tất cả mọi người mà không ai có thể mua thêm được. Một ngày của tỉ phú cũng chỉ có hai mươi tư giờ như một ngày của người nghèo khó. Khác biệt duy nhất nằm ở cách mỗi người sử dụng thời gian của mình.\n\nTrước hết, thời gian đã qua không bao giờ trở lại. Tiền bạc mất đi còn có thể kiếm lại, sức khỏe suy giảm còn có thể phục hồi phần nào, nhưng một phút đã trôi qua là mất vĩnh viễn. Vì vậy, lãng phí thời gian là sự lãng phí đáng tiếc nhất, bởi ta đang đánh mất đi phần đời không thể lấy lại của chính mình.\n\nBên cạnh đó, biết quý trọng thời gian là chìa khóa của thành công. Những người thành công đều là những người quản lí thời gian hiệu quả: họ lập kế hoạch, ưu tiên việc quan trọng, không để thời gian trôi qua vô ích. Ngược lại, những kẻ lười biếng, chây ì, để ngày tháng trôi qua trong vô vị thì khó có thể làm nên việc lớn.\n\nCó bạn trẻ cho rằng tuổi trẻ còn dài, cứ vui chơi đã, việc học để sau. Đây là suy nghĩ sai lầm. Tuổi trẻ là quãng thời gian vàng để học tập, rèn luyện; một khi đã qua đi, muốn quay lại cũng không được. Câu tục ngữ Thì giờ là vàng bạc thấm thía biết bao.\n\nVì vậy, mỗi chúng ta hãy học cách quý trọng từng phút giây: lập thời gian biểu hợp lí, tập trung khi làm việc, hạn chế những thú vui vô bổ ngốn thời gian. Hãy sống sao cho mỗi ngày trôi qua đều có ý nghĩa, để khi nhìn lại không phải hối tiếc vì những tháng năm đã lãng phí.\n\nCâu 1. Luận đề của văn bản là gì?", "options": ["A. Người giàu và người nghèo đều có 24 giờ", "B. Thời gian là tài sản quý giá nhất, cần được quý trọng và sử dụng hiệu quả", "C. Nên lập thời gian biểu", "D. Tuổi trẻ nên vui chơi"], "answer": "B", "explain": "Mở bài khẳng định thời gian là \"tài sản quý giá nhất\" và toàn bài triển khai lí do cùng cách quý trọng nó — đó là luận đề.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIÁ TRỊ CỦA THỜI GIAN\n\nThời gian là tài sản quý giá nhất mà tạo hóa ban cho con người, bởi nó công bằng với tất cả mọi người mà không ai có thể mua thêm được. Một ngày của tỉ phú cũng chỉ có hai mươi tư giờ như một ngày của người nghèo khó. Khác biệt duy nhất nằm ở cách mỗi người sử dụng thời gian của mình.\n\nTrước hết, thời gian đã qua không bao giờ trở lại. Tiền bạc mất đi còn có thể kiếm lại, sức khỏe suy giảm còn có thể phục hồi phần nào, nhưng một phút đã trôi qua là mất vĩnh viễn. Vì vậy, lãng phí thời gian là sự lãng phí đáng tiếc nhất, bởi ta đang đánh mất đi phần đời không thể lấy lại của chính mình.\n\nBên cạnh đó, biết quý trọng thời gian là chìa khóa của thành công. Những người thành công đều là những người quản lí thời gian hiệu quả: họ lập kế hoạch, ưu tiên việc quan trọng, không để thời gian trôi qua vô ích. Ngược lại, những kẻ lười biếng, chây ì, để ngày tháng trôi qua trong vô vị thì khó có thể làm nên việc lớn.\n\nCó bạn trẻ cho rằng tuổi trẻ còn dài, cứ vui chơi đã, việc học để sau. Đây là suy nghĩ sai lầm. Tuổi trẻ là quãng thời gian vàng để học tập, rèn luyện; một khi đã qua đi, muốn quay lại cũng không được. Câu tục ngữ Thì giờ là vàng bạc thấm thía biết bao.\n\nVì vậy, mỗi chúng ta hãy học cách quý trọng từng phút giây: lập thời gian biểu hợp lí, tập trung khi làm việc, hạn chế những thú vui vô bổ ngốn thời gian. Hãy sống sao cho mỗi ngày trôi qua đều có ý nghĩa, để khi nhìn lại không phải hối tiếc vì những tháng năm đã lãng phí.\n\nCâu 2. Lí lẽ nào chứng minh thời gian đã qua không bao giờ trở lại?", "options": ["A. Tiền mất có thể kiếm lại, sức khỏe có thể phục hồi phần nào, nhưng một phút trôi qua là mất vĩnh viễn", "B. Đồng hồ luôn chạy", "C. Ai cũng già đi", "D. Ngày nào cũng có 24 giờ"], "answer": "A", "explain": "Bằng phép so sánh đối chiếu (tiền, sức khỏe có thể lấy lại phần nào còn thời gian thì không), tác giả làm nổi bật tính một đi không trở lại của thời gian — lí lẽ sắc sảo, thuyết phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGIÁ TRỊ CỦA THỜI GIAN\n\nThời gian là tài sản quý giá nhất mà tạo hóa ban cho con người, bởi nó công bằng với tất cả mọi người mà không ai có thể mua thêm được. Một ngày của tỉ phú cũng chỉ có hai mươi tư giờ như một ngày của người nghèo khó. Khác biệt duy nhất nằm ở cách mỗi người sử dụng thời gian của mình.\n\nTrước hết, thời gian đã qua không bao giờ trở lại. Tiền bạc mất đi còn có thể kiếm lại, sức khỏe suy giảm còn có thể phục thời gian đã qua không bao giờ trở lại. Tiền bạc mất đi còn có thể kiếm lại, sức khỏe suy giảm còn có thể phục hồi phần nào, nhưng một phút đã trôi qua là mất vĩnh viễn. Vì vậy, lãng phí thời gian là sự lãng phí đáng tiếc nhất, bởi ta đang đánh mất đi phần đời không thể lấy lại của chính mình.\n\nBên cạnh đó, biết quý trọng thời gian là chìa khóa của thành công. Những người thành công đều là những người quản lí thời gian hiệu quả: họ lập kế hoạch, ưu tiên việc quan trọng, không để thời gian trôi qua vô ích. Ngược lại, những kẻ lười biếng, chây ì, để ngày tháng trôi qua trong vô vị thì khó có thể làm nên việc lớn.\n\nCó bạn trẻ cho rằng tuổi trẻ còn dài, cứ vui chơi đã, việc học để sau. Đây là suy nghĩ sai lầm. Tuổi trẻ là quãng thời gian vàng để học tập, rèn luyện; một khi đã qua đi, muốn quay lại cũng không được. Câu tục ngữ Thì giờ là vàng bạc thấm thía biết bao.\n\nVì vậy, mỗi chúng ta hãy học cách quý trọng từng phút giây: lập thời gian biểu hợp lí, tập trung khi làm việc, hạn chế những thú vui vô bổ ngốn thời gian. Hãy sống sao cho mỗi ngày trôi qua đều có ý nghĩa, để khi nhìn lại không phải hối tiếc vì những tháng năm đã lãng phí.\n\nCâu 5. Theo em, học sinh quản lí thời gian hiệu quả bằng cách nào? (Trả lời ngắn gọn)", "answer": "Lập kế hoạch, ưu tiên việc quan trọng, tập trung học tập, hạn chế việc vô bổ", "explain": "Chấp nhận các cách cụ thể: lập thời gian biểu; phân biệt việc quan trọng — khẩn cấp; không lướt điện thoại khi học; ngủ đủ giấc để học hiệu quả...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của việc quý trọng thời gian.", "explain": "DÀN Ý:\n1. Mở đoạn: thời gian là vốn quý nhất của đời người.\n2. Thân đoạn: (a) Ý nghĩa: thời gian qua không trở lại; quý thời gian giúp học tập, làm việc hiệu quả, tiến tới thành công; (b) Phê phán thói lãng phí thời gian: lười biếng, chây ì, đắm chìm vào thú vui vô bổ; (c) Tuổi trẻ là thời gian vàng.\n3. Kết đoạn: hãy sống sao cho mỗi ngày đều ý nghĩa.\n\nBÀI MẪU:\nThời gian là tài sản quý giá nhất mà mỗi con người được ban tặng, bởi nó công bằng với tất cả mọi người và một khi đã qua đi thì không bao giờ trở lại. Quý trọng thời gian có ý nghĩa vô cùng to lớn: nó giúp ta học tập, làm việc hiệu quả, từng bước tiến tới thành công. Những người biết quản lí thời gian — lập kế hoạch, ưu tiên việc quan trọng, tập trung cao độ — thường đạt được nhiều thành tựu trong cuộc sống. Ngược lại, lãng phí thời gian là sự lãng phí đáng tiếc nhất, bởi ta đang đánh mất đi phần đời không thể lấy lại của chính mình. Đáng phê phán là những bạn trẻ để ngày tháng trôi qua trong lười biếng, chây ì, đắm chìm vào game và mạng xã hội mà quên rằng tuổi trẻ là quãng thời gian vàng để học tập, rèn luyện. Tiền bạc mất đi còn kiếm lại được, nhưng thời gian đã mất là mất vĩnh viễn. Vì vậy, mỗi chúng ta hãy học cách quý trọng từng phút giây, sống sao cho mỗi ngày trôi qua đều có ý nghĩa, để khi nhìn lại không phải hối tiếc.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về vai trò của việc quản lí thời gian đối với học sinh.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — quản lí thời gian là kĩ năng quan trọng với học sinh.\nII. Thân bài:\n1. Giải thích: quản lí thời gian là sắp xếp, sử dụng thời gian hợp lí, hiệu quả.\n2. Vai trò:\n   a. Giúp học tập hiệu quả, cân bằng giữa học và nghỉ ngơi.\n   b. Rèn tính kỉ luật, chủ động, có trách nhiệm.\n   c. Giảm áp lực, tránh nước đến chân mới nhảy.\n   d. Tạo nền tảng cho thành công sau này.\n3. Thực trạng: nhiều học sinh chưa biết quản lí thời gian — lướt điện thoại, thức khuya, học dồn trước kì thi.\n4. Cách quản lí hiệu quả: lập thời gian biểu; phân loại việc quan trọng; tập trung khi học; nghỉ ngơi hợp lí.\n5. Phê phán: thói lãng phí thời gian, viện cớ bận rộn.\nIII. Kết bài: khẳng định ý nghĩa; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nCó một tài sản mà ai cũng được ban tặng công bằng, không thể mua thêm cũng không thể lấy lại một khi đã mất — đó là thời gian. Với học sinh, biết quản lí thời gian không chỉ giúp học tập hiệu quả mà còn rèn luyện những phẩm chất quan trọng cho tương lai. Thế nhưng, không ít bạn trẻ hôm nay vẫn để thời gian trôi qua vô ích mà không hay biết. Vì vậy, bàn về vai trò của việc quản lí thời gian đối với học sinh là vấn đề thiết thực và cần thiết.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÒNG TRUNG THỰC TRONG THI CỬ\n\nThi cử là thước đo năng lực, là khâu quan trọng của giáo dục. Thế nhưng, tình trạng gian lận trong thi cử vẫn diễn ra ở không ít nơi, làm méo mó ý nghĩa của việc học và thi. Giữ gìn lòng trung thực trong thi cử vì vậy là vấn đề cần được nhấn mạnh hơn bao giờ hết.\n\nTrước hết, trung thực trong thi cử là tôn trọng chính bản thân mình. Điểm số đạt được bằng gian lận chỉ là con số giả dối, che giấu sự yếu kém thật sự. Người quay cóp có thể qua được một kì thi, nhưng không thể qua được những thử thách của cuộc đời bằng kiến thức rỗng. Sớm muộn gì, sự giả dối cũng bị phơi bày, và cái giá phải trả thường rất đắt.\n\nBên cạnh đó, gian lận trong thi cử còn gây ra sự bất công. Khi kẻ gian lận được điểm cao, người học thật, thi thật bị đẩy xuống — đó là sự bất công không thể chấp nhận trong môi trường giáo dục, nơi công bằng phải được đề cao nhất. Một xã hội mà bằng cấp giả tràn lan sẽ là một xã hội thiếu niềm tin.\n\nCó ý kiến cho rằng gian lận chỉ là chuyện nhỏ, miễn sao có bằng cấp để xin việc. Đây là suy nghĩ thiển cận và nguy hiểm. Bằng cấp giả tạo ra những con người kém năng lực nhưng lại nắm giữ những vị trí quan trọng — hậu quả khôn lường: bác sĩ dốt gây chết người, kĩ sư dốt làm sập cầu, thầy giáo dốt làm hỏng cả thế hệ.\n\nVì vậy, mỗi học sinh hãy coi trung thực trong thi cử là danh dự của mình: học thật, thi thật, không quay cóp, không gian lận. Nhà trường cần giáo dục ý thức và xử lí nghiêm các hành vi gian lận. Chỉ khi mỗi người đều trung thực thì thi cử mới thực sự là thước đo công bằng và giáo dục mới thực hiện được sứ mệnh của mình.\n\nCâu 1. Vấn đề nghị luận của văn bản là gì?", "options": ["A. Cách học tốt để thi cử", "B. Lòng trung thực trong thi cử: ý nghĩa và cách giữ gìn", "C. Cải cách giáo dục", "D. Áp lực thi cử"], "answer": "B", "explain": "Toàn bài bàn về gian lận trong thi cử, phân tích tác hại và đề xuất giải pháp giữ gìn sự trung thực — đó là vấn đề nghị luận trung tâm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÒNG TRUNG THỰC TRONG THI CỬ\n\nThi cử là thước đo năng lực, là khâu quan trọng của giáo dục. Thế nhưng, tình trạng gian lận trong thi cử vẫn diễn ra ở không ít nơi, làm méo mó ý nghĩa của việc học và thi. Giữ gìn lòng trung thực trong thi cử vì vậy là vấn đề cần được nhấn mạnh hơn bao giờ hết.\n\nTrước hết, trung thực trong thi cử là tôn trọng chính bản thân mình. Điểm số đạt được bằng gian lận chỉ là con số giả dối, che giấu sự yếu kém thật sự. Người quay cóp có thể qua được một kì thi, nhưng không thể qua được những thử thách của cuộc đời bằng kiến thức rỗng. Sớm muộn gì, sự giả dối cũng bị phơi bày, và cái giá phải trả thường rất đắt.\n\nBên cạnh đó, gian lận trong thi cử còn gây ra sự bất công. Khi kẻ gian lận được điểm cao, người học thật, thi thật bị đẩy xuống — đó là sự bất công không thể chấp nhận trong môi trường giáo dục, nơi công bằng phải được đề cao nhất. Một xã hội mà bằng cấp giả tràn lan sẽ là một xã hội thiếu niềm tin.\n\nCó ý kiến cho rằng gian lận chỉ là chuyện nhỏ, miễn sao có bằng cấp để xin việc. Đây là suy nghĩ thiển cận và nguy hiểm. Bằng cấp giả tạo ra những con người kém năng lực nhưng lại nắm giữ những vị trí quan trọng — hậu quả khôn lường: bác sĩ dốt gây chết người, kĩ sư dốt làm sập cầu, thầy giáo dốt làm hỏng cả thế hệ.\n\nVì vậy, mỗi học sinh hãy coi trung thực trong thi cử là danh dự của mình: học thật, thi thật, không quay cóp, không gian lận. Nhà trường cần giáo dục ý thức và xử lí nghiêm các hành vi gian lận. Chỉ khi mỗi người đều trung thực thì thi cử mới thực sự là thước đo công bằng và giáo dục mới thực hiện được sứ mệnh của mình.\n\nCâu 2. Theo tác giả, vì sao gian lận trong thi cử gây ra sự bất công?", "options": ["A. Vì đề thi quá khó", "B. Vì kẻ gian lận được điểm cao đẩy người học thật xuống — bất công trong môi trường cần công bằng nhất", "C. Vì giám thị coi thi không nghiêm", "D. Vì phụ huynh gây áp lực"], "answer": "B", "explain": "Lí lẽ rõ ràng: trong giáo dục, công bằng phải được đề cao nhất; gian lận đảo lộn trật tự công bằng ấy, khiến người ngay thẳng bị thiệt thòi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÒNG TRUNG THỰC TRONG THI CỬ\n\nThi cử là thước đo năng lực, là khâu quan trọng của giáo dục. Thế nhưng, tình trạng gian lận trong thi cử vẫn diễn ra ở không ít nơi, làm méo mó ý nghĩa của việc học và thi. Giữ gìn lòng trung thực trong thi cử vì vậy là vấn đề cần được nhấn mạnh hơn bao giờ hết.\n\nTrước hết, trung thực trong thi cử là tôn trọng chính bản thân mình. Điểm số đạt được bằng gian lận chỉ là con số giả dối, che giấu sự yếu kém thật sự. Người quay cóp có thể qua được một kì thi, nhưng không thể qua được những thử thách của cuộc đời bằng kiến thức rỗng. Sớm muộn gì, sự giả dối cũng bị phơi bày, và cái giá phải trả thường rất đắt.\n\nBên cạnh đó, gian lận trong thi cử còn gây ra sự bất công. Khi kẻ gian lận được điểm cao, người học thật, thi thật bị đẩy xuống — đó là sự bất công không thể chấp nhận trong môi trường giáo dục, nơi công bằng phải được đề cao nhất. Một xã hội mà bằng cấp giả tràn lan sẽ là một xã hội thiếu niềm tin.\n\nCó ý kiến cho rằng gian lận chỉ là chuyện nhỏ, miễn sao có bằng cấp để xin việc. Đây là suy nghĩ thiển cận và nguy hiểm. Bằng cấp giả tạo ra những con người kém năng lực nhưng lại nắm giữ những vị trí quan trọng — hậu quả khôn lường: bác sĩ dốt gây chết người, kĩ sư dốt làm sập cầu, thầy giáo dốt làm hỏng cả thế hệ.\n\nVì vậy, mỗi học sinh hãy coi trung thực trong thi cử là danh dự của mình: học thật, thi thật, không quay cóp, không gian lận. Nhà trường cần giáo dục ý thức và xử lí nghiêm các hành vi gian lận. Chỉ khi mỗi người đều trung thực thì thi cử mới thực sự là thước đo công bằng và giáo dục mới thực hiện được sứ mệnh của mình.\n\nCâu 3. Đoạn văn về bác sĩ dốt, kĩ sư dốt sử dụng thủ pháp lập luận nào?", "options": ["A. Kể chuyện", "B. Giả định hậu quả để chứng minh tác hại khôn lường của bằng cấp giả", "C. So sánh", "D. Trích dẫn"], "answer": "B", "explain": "Tác giả giả định chuỗi hậu quả (bác sĩ dốt gây chết người, kĩ sư dốt làm sập cầu) để chứng minh bằng cấp giả gây nguy hại cho xã hội — thủ pháp suy luận về hậu quả, có sức cảnh tỉnh mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÒNG TRUNG THỰC TRONG THI CỬ\n\nThi cử là thước đo năng lực, là khâu quan trọng của giáo dục. Thế nhưng, tình trạng gian lận trong thi cử vẫn diễn ra ở không ít nơi, làm méo mó ý nghĩa của việc học và thi. Giữ gìn lòng trung thực trong thi cử vì vậy là vấn đề cần được nhấn mạnh hơn bao giờ hết.\n\nTrước hết, trung thực trong thi cử là tôn trọng chính bản thân mình. Điểm số đạt được bằng gian lận chỉ là con số giả dối, che giấu sự yếu kém thật sự. Người quay cóp có thể qua được một kì thi, nhưng không thể qua được những thử thách của cuộc đời bằng kiến thức rỗng. Sớm muộn gì, sự giả dối cũng bị phơi bày, và cái giá phải trả thường rất đắt.\n\nBên cạnh đó, gian lận trong thi cử còn gây ra sự bất công. Khi kẻ gian lận được điểm cao, người học thật, thi thật bị đẩy xuống — đó là sự bất công không thể chấp nhận trong môi trường giáo dục, nơi công bằng phải được đề cao nhất. Một xã hội mà bằng cấp giả tràn lan sẽ là một xã hội thiếu niềm tin.\n\nCó ý kiến cho rằng gian lận chỉ là chuyện nhỏ, miễn sao có bằng cấp để xin việc. Đây là suy nghĩ thiển cận và nguy hiểm. Bằng cấp giả tạo ra những con người kém năng lực nhưng lại nắm giữ những vị trí quan trọng — hậu quả khôn lường: bác sĩ dốt gây chết người, kĩ sư dốt làm sập cầu, thầy giáo dốt làm hỏng cả thế hệ.\n\nVì vậy, mỗi học sinh hãy coi trung thực trong thi cử là danh dự của mình: học thật, thi thật, không quay cóp, không gian lận. Nhà trường cần giáo dục ý thức và xử lí nghiêm các hành vi gian lận. Chỉ khi mỗi người đều trung thực thì thi cử mới thực sự là thước đo công bằng và giáo dục mới thực hiện được sứ mệnh của mình.\n\nCâu 4. Thái độ của tác giả đối với quan điểm gian lận chỉ là chuyện nhỏ là gì?", "options": ["A. Đồng tình", "B. Phê phán gay gắt: đó là suy nghĩ thiển cận và nguy hiểm", "C. Trung lập", "D. Không đề cập"], "answer": "B", "explain": "Tác giả khẳng định \"đây là suy nghĩ thiển cận và nguy hiểm\" rồi phân tích hậu quả — thao tác bác bỏ kết hợp phê phán, thể hiện thái độ kiên quyết.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nLÒNG TRUNG THỰC TRONG THI CỬ\n\nThi cử là thước đo năng lực, là khâu quan trọng của giáo dục. Thế nhưng, tình trạng gian lận trong thi cử vẫn diễn ra ở không ít nơi, làm méo mó ý nghĩa của việc học và thi. Giữ gìn lòng trung thực trong thi cử vì vậy là vấn đề cần được nhấn mạnh hơn bao giờ hết.\n\nTrước hết, trung thực trong thi cử là tôn trọng chính bản thân mình. Điểm số đạt được bằng gian lận chỉ là con số giả dối, che giấu sự yếu kém thật sự. Người quay cóp có thể qua được một kì thi, nhưng không thể qua được những thử thách của cuộc đời bằng kiến thức rỗng. Sớm muộn gì, sự giả dối cũng bị phơi bày, và cái giá phải trả thường rất đắt.\n\nBên cạnh đó, gian lận trong thi cử còn gây ra sự bất công. Khi kẻ gian lận được điểm cao, người học thật, thi thật bị đẩy xuống — đó là sự bất công không thể chấp nhận trong môi trường giáo dục, nơi công bằng phải được đề cao nhất. Một xã hội mà bằng cấp giả tràn lan sẽ là một xã hội thiếu niềm tin.\n\nCó ý kiến cho rằng gian lận chỉ là chuyện nhỏ, miễn sao có bằng cấp để xin việc. Đây là suy nghĩ thiển cận và nguy hiểm. Bằng cấp giả tạo ra những con người kém năng lực nhưng lại nắm giữ những vị trí quan trọng — hậu quả khôn lường: bác sĩ dốt gây chết người, kĩ sư dốt làm sập cầu, thầy giáo dốt làm hỏng cả thế hệ.\n\nVì vậy, mỗi học sinh hãy coi trung thực trong thi cử là danh dự của mình: học thật, thi thật, không quay cóp, không gian lận. Nhà trường cần giáo dục ý thức và xử lí nghiêm các hành vi gian lận. Chỉ khi mỗi người đều trung thực thì thi cử mới thực sự là thước đo công bằng và giáo dục mới thực hiện được sứ mệnh của mình.\n\nCâu 5. Theo em, học sinh cần làm gì để giữ gìn sự trung thực trong thi cử? (Trả lời ngắn gọn)", "answer": "Học thật, thi thật; không quay cóp, không gian lận", "explain": "Chấp nhận các cách diễn đạt tương đương: ôn bài nghiêm túc; tự làm bài bằng năng lực thật; tố giác hành vi gian lận; coi trung thực là danh dự...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lòng trung thực trong học tập.", "explain": "DÀN Ý:\n1. Mở đoạn: trung thực là phẩm chất quan trọng nhất trong học tập.\n2. Thân đoạn: (a) Biểu hiện: học thật, thi thật, không quay cóp; dám nhận khuyết điểm; (b) Ý nghĩa: kiến thức thật mới giúp thành công bền vững; tạo sự công bằng; (c) Phê phán gian lận thi cử và hậu quả.\n3. Kết đoạn: rèn trung thực từ ghế nhà trường.\n\nBÀI MẪU:\nTrung thực là phẩm chất đạo đức quan trọng hàng đầu trong học tập, là nền tảng để mỗi học sinh tiến bộ một cách bền vững. Học tập trung thực nghĩa là học thật, thi thật: tự mình ôn bài, tự mình làm bài bằng năng lực thật sự, không quay cóp, không gian lận dưới mọi hình thức. Chỉ có kiến thức thật mới giúp ta vững vàng trước những thử thách của cuộc đời; điểm số giả dối chỉ che giấu sự yếu kém tạm thời mà sớm muộn cũng bị phơi bày. Trung thực trong học tập còn góp phần tạo nên sự công bằng trong giáo dục — nơi người cố gắng thật sự được ghi nhận xứng đáng. Ngược lại, gian lận trong thi cử không chỉ là hành vi thiếu đạo đức mà còn gây ra bất công, làm méo mó ý nghĩa của giáo dục và tạo ra những con người kém năng lực nhưng có bằng cấp. Đáng buồn là vẫn còn không ít học sinh coi quay cóp là chuyện bình thường. Mỗi chúng ta hãy coi trung thực là danh dự của mình, rèn luyện từ hôm nay để trở thành những công dân đáng tin cậy trong tương lai.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về bệnh gian lận trong thi cử hiện nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — gian lận thi cử vẫn diễn biến phức tạp.\nII. Thân bài:\n1. Thực trạng: quay cóp, dùng tài liệu, mua bán đề thi... với nhiều thủ đoạn tinh vi.\n2. Nguyên nhân: áp lực điểm số, bệnh thành tích; ý thức kém của một bộ phận học sinh; buông lỏng quản lí.\n3. Hậu quả:\n   a. Với cá nhân: kiến thức rỗng, sớm bị đào thải.\n   b. Với giáo dục: mất công bằng, méo mó ý nghĩa thi cử.\n   c. Với xã hội: bằng cấp giả tạo ra những con người kém năng lực ở vị trí quan trọng.\n4. Giải pháp: giáo dục ý thức; đổi mới cách ra đề, coi thi; xử lí nghiêm; giảm áp lực thành tích.\n5. Bác bỏ: quan điểm gian lận là chuyện nhỏ.\nIII. Kết bài: khẳng định cần chung tay đẩy lùi; nhắn nhủ học sinh học thật, thi thật.\n\nĐOẠN MẪU (mở bài):\nThi cử vốn là thước đo công bằng để đánh giá năng lực người học, là khâu trọng yếu của nền giáo dục. Thế nhưng, đáng buồn là tình trạng gian lận trong thi cử vẫn diễn ra với nhiều hình thức tinh vi, từ quay cóp trong phòng thi đến mua bán đề thi, bằng cấp giả. Gian lận không chỉ làm méo mó ý nghĩa của việc học và thi mà còn gieo mầm cho sự giả dối trong xã hội. Đấu tranh đẩy lùi bệnh gian lận vì vậy là trách nhiệm của toàn xã hội, trong đó mỗi học sinh phải là người tiên phong.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTÌNH NGUYỆN VÌ CỘNG ĐỒNG — MÙA HÈ Ý NGHĨA CỦA TUỔI TRẺ\n\nMỗi độ hè về, khắp mọi miền đất nước lại rộn ràng màu áo xanh tình nguyện. Hàng vạn bạn trẻ lên đường đến với những vùng quê nghèo, những bản làng xa xôi, mang theo tri thức, sức trẻ và tình yêu thương. Phong trào tình nguyện đã trở thành nét đẹp, thành mùa hè ý nghĩa không thể thiếu của tuổi trẻ Việt Nam.\n\nTrước hết, tình nguyện là cơ hội để tuổi trẻ cống hiến cho cộng đồng. Những cây cầu, con đường được xây dựng, những lớp học tình thương được mở ra, những mái nhà được sửa sang — tất cả đều in dấu bàn tay, khối óc của các bạn trẻ tình nguyện. Trong những chiến dịch như Mùa hè xanh, các bạn sinh viên đã mang ánh sáng tri thức đến với trẻ em vùng cao, vùng sâu, góp phần thu hẹp khoảng cách giữa các vùng miền.\n\nBên cạnh đó, tình nguyện còn là trường học lớn giúp tuổi trẻ trưởng thành. Qua những ngày dầm mưa dãi nắng cùng bà con, các bạn trẻ học được cách sống tự lập, biết sẻ chia, biết trân trọng những gì mình đang có. Nhiều bạn sau chuyến tình nguyện đã thay đổi hẳn: sống có trách nhiệm hơn, biết yêu thương hơn, hiểu sâu sắc hơn giá trị của lao động.\n\nCó ý kiến cho rằng đi tình nguyện chỉ là phong trào, làm màu để đẹp hồ sơ. Nhận xét này thiếu công bằng. Bên cạnh một số ít trường hợp hình thức, đại đa số các bạn trẻ tình nguyện đều làm việc bằng cả tấm lòng, với những đóng góp thiết thực không thể phủ nhận. Không nên vì vài con sâu mà phủ nhận cả một phong trào tốt đẹp.\n\nVì vậy, mỗi bạn trẻ hãy một lần trong đời tham gia hoạt động tình nguyện. Đó không chỉ là sự cho đi mà còn là sự nhận lại vô giá: nhận lại sự trưởng thành, những kỉ niệm đẹp và niềm hạnh phúc khi được sống có ích. Tuổi trẻ chỉ đến một lần — hãy để nó rực rỡ bằng những việc làm ý nghĩa vì cộng đồng.\n\nCâu 1. Luận đề của văn bản là gì?", "options": ["A. Kể về các chiến dịch tình nguyện", "B. Tình nguyện vì cộng đồng là nét đẹp, là mùa hè ý nghĩa của tuổi trẻ", "C. Phê phán tình nguyện hình thức", "D. Giới thiệu Mùa hè xanh"], "answer": "B", "e hiết thực không thể phủ nhận. Không nên vì vài con sâu mà phủ nhận cả một phong trào tốt đẹp.\n\nVì vậy, mỗi bạn trẻ hãy một lần trong đời tham gia hoạt động tình nguyện. Đó không chỉ là sự cho đi mà còn là sự nhận lại vô giá: nhận lại sự trưởng thành, những kỉ niệm đẹp và niềm hạnh phúc khi được sống có ích. Tuổi trẻ chỉ đến một lần — hãy để nó rực rỡ bằng những việc làm ý nghĩa vì cộng đồng.\n\nCâu 3. Đoạn văn bác bỏ ý kiến tình nguyện chỉ là phong trào, làm màu sử dụng thao tác nào?", "options": ["A. Chứng minh", "B. Giải thích", "C. Bác bỏ: chỉ ra sự thiếu công bằng của nhận xét, khẳng định đóng góp thiết thực của đại đa số", "D. So sánh"], "answer": "C", "explain": "Tác giả nhận xét quan điểm ấy \"thiếu công bằng\", dùng thành ngữ \"không nên vì vài con sâu mà phủ nhận cả một phong trào\" — thao tác bác bỏ kết hợp lí lẽ sắc sảo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTÌNH NGUYỆN VÌ CỘNG ĐỒNG — MÙA HÈ Ý NGHĨA CỦA TUỔI TRẺ\n\nMỗi độ hè về, khắp mọi miền đất nước lại rộn ràng màu áo xanh tình nguyện. Hàng vạn bạn trẻ lên đường đến với những vùng quê nghèo, những bản làng xa xôi, mang theo tri thức, sức trẻ và tình yêu thương. Phong trào tình nguyện đã trở thành nét đẹp, thành mùa hè ý nghĩa không thể thiếu của tuổi trẻ Việt Nam.\n\nTrước hết, tình nguyện là cơ hội để tuổi trẻ cống hiến cho cộng đồng. Những cây cầu, con đường được xây dựng, những lớp học tình thương được mở ra, những mái nhà được sửa sang — tất cả đều in dấu bàn tay, khối óc của các bạn trẻ tình nguyện. Trong những chiến dịch như Mùa hè xanh, các bạn sinh viên đã mang ánh sáng tri thức đến với trẻ em vùng cao, vùng sâu, góp phần thu hẹp khoảng cách giữa các vùng miền.\n\nBên cạnh đó, tình nguyện còn là trường học lớn giúp tuổi trẻ trưởng thành. Qua những ngày dầm mưa dãi nắng cùng bà con, các bạn trẻ học được cách sống tự lập, biết sẻ chia, biết trân trọng những gì mình đang có. Nhiều bạn sau chuyến tình nguyện đã thay đổi hẳn: sống có trách nhiệm hơn, biết yêu thương hơn, hiểu sâu sắc hơn giá trị của lao động.\n\nCó ý kiến cho rằng đi tình nguyện chỉ là phong trào, làm màu để đẹp hồ sơ. Nhận xét này thiếu công bằng. Bên cạnh một số ít trường hợp hình thức, đại đa số các bạn trẻ tình nguyện đều làm việc bằng cả tấm lòng, với những đóng góp thiết thực không thể phủ nhận. Không nên vì vài con sâu mà phủ nhận cả một phong trào tốt đẹp.\n\nVì vậy, mỗi bạn trẻ hãy một lần trong đời tham gia hoạt động tình nguyện. Đó không chỉ là sự cho đi mà còn là sự nhận lại vô giá: nhận lại sự trưởng thành, những kỉ niệm đẹp và niềm hạnh phúc khi được sống có ích. Tuổi trẻ chỉ đến một lần — hãy để nó rực rỡ bằng những việc làm ý nghĩa vì cộng đồng.\n\nCâu 4. Câu kết \"Tuổi trẻ chỉ đến một lần — hãy để nó rực rỡ bằng những việc làm ý nghĩa\" có tác dụng gì?", "options": ["A. Thông báo lịch tình nguyện", "B. Kêu gọi, nhắn nhủ tha thiết, khơi dậy khát vọng cống hiến của tuổi trẻ", "C. Kể chuyện", "D. Miêu tả"], "answer": "B", "explain": "Câu văn giàu cảm xúc, dùng lối kêu gọi trực tiếp — có tác dụng nhắn nhủ, thôi thúc người trẻ hành động, để lại dư âm sâu sắc khi khép lại bài viết.", "points": 0.25}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTÌNH NGUYỆN VÌ CỘNG ĐỒNG — MÙA HÈ Ý NGHĨA CỦA TUỔI TRẺ\n\nMỗi độ hè về, khắp mọi miền đất nước lại rộn ràng màu áo xanh tình nguyện. Hàng vạn bạn trẻ lên đường đến với những vùng quê nghèo, những bản làng xa xôi, mang theo tri thức, sức trẻ và tình yêu thương. Phong trào tình nguyện đã trở thành nét đẹp, thành mùa hè ý nghĩa không thể thiếu của tuổi trẻ Việt Nam.\n\nTrước hết, tình nguyện là cơ hội để tuổi trẻ cống hiến cho cộng đồng. Những cây cầu, con đường được xây dựng, những lớp học tình thương được mở ra, những mái nhà được sửa sang — tất cả đều in dấu bàn tay, khối óc của các bạn trẻ tình nguyện. Trong những chiến dịch như Mùa hè xanh, các bạn sinh viên đã mang ánh sáng tri thức đến với trẻ em vùng cao, vùng sâu, góp phần thu hẹp khoảng cách giữa các vùng miền.\n\nBên cạnh đó, tình nguyện còn là trường học lớn giúp tuổi trẻ trưởng thành. Qua những ngày dầm mưa dãi nắng cùng bà con, các bạn trẻ học được cách sống tự lập, biết sẻ chia, biết trân trọng những gì mình đang có. Nhiều bạn sau chuyến tình nguyện đã thay đổi hẳn: sống có trách nhiệm hơn, biết yêu thương hơn, hiểu sâu sắc hơn giá trị của lao động.\n\nCó ý kiến cho rằng đi tình nguyện chỉ là phong trào, làm màu để đẹp hồ sơ. Nhận xét này thiếu công bằng. Bên cạnh một số ít trường hợp hình thức, đại đa số các bạn trẻ tình nguyện đều làm việc bằng cả tấm lòng, với những đóng góp thiết thực không thể phủ nhận. Không nên vì vài con sâu mà phủ nhận cả một phong trào tốt đẹp.\n\nVì vậy, mỗi bạn trẻ hãy một lần trong đời tham gia hoạt động tình nguyện. Đó không chỉ là sự cho đi mà còn là sự nhận lại vô giá: nhận lại sự trưởng thành, những kỉ niệm đẹp và niềm hạnh phúc khi được sống có ích. Tuổi trẻ chỉ đến một lần — hãy để nó rực rỡ bằng những việc làm ý nghĩa vì cộng đồng.\n\nCâu 5. Theo em, học sinh có thể tham gia hoạt động tình nguyện nào? (Trả lời ngắn gọn)", "answer": "Các hoạt động phù hợp: vệ sinh môi trường, giúp đỡ bạn nghèo, thăm người già neo đơn...", "explain": "Chấp nhận các hoạt động cụ thể, phù hợp lứa tuổi: dọn vệ sinh trường lớp, khu phố; quyên góp sách vở; dạy học cho em nhỏ; thăm hỏi gia đình chính sách...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của hoạt động tình nguyện đối với tuổi trẻ.", "explain": "DÀN Ý:\n1. Mở đoạn: tình nguyện là nét đẹp của tuổi trẻ, mang lại nhiều ý nghĩa.\n2. Thân đoạn: (a) Với cộng đồng: góp sức xây dựng quê hương, giúp đỡ người khó khăn; (b) Với bản thân: trưởng thành, học sống tự lập, biết sẻ chia, có thêm kỉ niệm đẹp; (c) Phê phán thái độ thờ ơ, ích kỉ, chỉ biết hưởng thụ.\n3. Kết đoạn: hãy tham gia tình nguyện để tuổi trẻ thêm ý nghĩa.\n\nBÀI MẪU:\nHoạt động tình nguyện mang ý nghĩa to lớn đối với tuổi trẻ, vừa là sự cống hiến cho cộng đồng vừa là cơ hội để bản thân trưởng thành. Với cộng đồng, bàn tay và khối óc của các bạn trẻ đã góp phần xây cầu, làm đường, mở lớp học tình thương, mang tri thức đến với trẻ em vùng khó khăn — những đóng góp thiết thực không thể phủ nhận. Với chính mình, những ngày dầm mưa dãi nắng cùng bà con là trường học lớn dạy ta sống tự lập, biết sẻ chia, biết trân trọng những gì mình đang có; nhiều bạn trẻ đã trưởng thành vượt bậc sau mỗi chuyến đi. Tình nguyện còn mang lại những kỉ niệm đẹp và niềm hạnh phúc khi được sống có ích — thứ hạnh phúc mà tiền bạc không mua được. Đáng phê phán là những bạn trẻ thờ ơ, ích kỉ, chỉ biết hưởng thụ mà quay lưng với cộng đồng. Tuổi trẻ chỉ đến một lần trong đời — đừng để nó trôi qua vô vị. Hãy một lần khoác lên mình màu áo xanh tình nguyện để thấy tuổi trẻ của mình rực rỡ và ý nghĩa biết bao.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về vai trò của tuổi trẻ trong việc xây dựng quê hương, đất nước.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — tuổi trẻ là lực lượng quan trọng trong sự nghiệp dựng xây đất nước.\nII. Thân bài:\n1. Vai trò của tuổi trẻ: là tương lai, là lực lượng xung kích với sức trẻ, tri thức, khát vọng.\n2. Những đóng góp cụ thể:\n   a. Trong học tập, nghiên cứu khoa học.\n   b. Trong phong trào tình nguyện vì cộng đồng.\n   c. Trong bảo vệ Tổ quốc, giữ gìn bản sắc văn hóa.\n   d. Trong khởi nghiệp, phát triển kinh tế.\n3. Điều kiện để phát huy: được giáo dục tốt, có môi trường rèn luyện, có lí tưởng.\n4. Phê phán: một bộ phận giới trẻ sống ích kỉ, thiếu lí tưởng, sa vào tệ nạn.\n5. Bài học: mỗi người trẻ cần xác định lí tưởng, ra sức học tập, rèn luyện.\nIII. Kết bài: khẳng định niềm tin vào tuổi trẻ; nhắn nhủ.\n\nĐOẠN MẪU (mở bài):\nBác Hồ từng nói: Thanh niên là người chủ tương lai của nước nhà. Thật vậy, trong mọi thời kì lịch sử, tuổi trẻ luôn là lực lượng xung kích, đi đầu trong sự nghiệp dựng xây và bảo vệ Tổ quốc. Ngày hôm nay, khi đất nước đang bước vào thời kì hội nhập và phát triển mạnh mẽ, vai trò của tuổi trẻ càng trở nên quan trọng hơn bao giờ hết. Nhận thức đúng vai trò ấy để có hành động xứng đáng là vấn đề có ý nghĩa thiết thực với mỗi người trẻ.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nƯỚC MƠ VÀ HOÀI BÃO — NGỌN ĐÈN SOI ĐƯỜNG CỦA TUỔI TRẺ\n\nMỗi người trẻ đều cần có ước mơ, hoài bão. Ước mơ là ngọn đèn soi đường, là động lực giúp ta vượt qua khó khăn để vươn tới tương lai tốt đẹp hơn. Một tuổi trẻ không có ước mơ chẳng khác nào con thuyền không bánh lái, lênh đênh vô định giữa dòng đời.\n\nTrước hết, ước mơ cho ta mục tiêu và động lực phấn đấu. Khi có ước mơ trở thành bác sĩ, kĩ sư, thầy giáo, ta sẽ biết mình cần học gì, rèn luyện ra sao. Ước mơ biến những cố gắng hằng ngày thành những bước đi có ý nghĩa, giúp ta không nản lòng trước thất bại. Biết bao tấm gương đã chứng minh điều này: từ cậu học trò nghèo nuôi ước mơ thành bác sĩ đến cô gái khuyết tật quyết tâm thành họa sĩ — ước mơ đã nâng đỡ họ vượt qua mọi nghịch cảnh.\n\nBên cạnh đó, ước mơ còn làm cho cuộc sống thêm ý nghĩa. Người có ước mơ sống tích cực, lạc quan, luôn hướng về phía trước; ngược lại, kẻ sống không ước mơ dễ rơi vào chán nản, buông xuôi, để thời gian trôi qua vô ích. Ước mơ cũng gắn kết con người: những người cùng chung hoài bão sẽ đồng hành, giúp đỡ nhau cùng tiến bước.\n\nTuy nhiên, cần phân biệt ước mơ với ảo tưởng. Ước mơ phải gắn với năng lực thực tế và sự nỗ lực không ngừng; còn những mong muốn viển vông, thiếu cơ sở mà không chịu hành động chỉ là ảo tưởng, sớm muộn cũng vỡ tan. Có ước mơ mà không hành động thì ước mơ mãi chỉ là giấc mơ.\n\nVì vậy, mỗi bạn trẻ hãy nuôi dưỡng cho mình một ước mơ đẹp, phù hợp với khả năng, và quyết tâm biến nó thành hiện thực bằng học tập, rèn luyện mỗi ngày. Đừng sợ ước mơ lớn, chỉ sợ ta không dám ước mơ và không dám hành động. Hãy để ước mơ là ngọn đèn soi sáng con đường ta đi.\n\nCâu 1. Hình ảnh con thuyền không bánh lái được dùng để chỉ điều gì?", "options": ["A. Người đi biển gặp bão", "B. Tuổi trẻ không có ước mơ sẽ lênh đênh, vô định giữa dòng đời", "C. Nghề đi biển vất vả", "D. Ước mơ khó thực hiện"], "answer": "B", "explain": "Phép so sánh: tuổi trẻ không ước mơ \"chẳng khác nào con thuyền không bánh lái, lênh đênh vô định\" — hình ảnh cụ thể, sinh động, nhấn mạnh vai trò định hướng của ước mơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nƯỚC MƠ VÀ HOÀI BÃO — NGỌN ĐÈN SOI ĐƯỜNG CỦA TUỔI TRẺ\n\nMỗi người trẻ đều cần có ước mơ, hoài bão. Ước mơ là ngọn đèn soi đường, là động lực giúp ta vượt qua khó khăn để vươn tới tương lai tốt đẹp hơn. Một tuổi trẻ không có ước mơ chẳng khác nào con thuyền không bánh lái, lênh đênh vô định giữa dòng đời.\n\nTrước hết, ước mơ cho ta mục tiêu và động lực phấn đấu. Khi có ước mơ trở thành bác sĩ, kĩ sư, thầy giáo, ta sẽ biết mình cần học gì, rèn luyện ra sao. Ước mơ biến những cố gắng hằng ngày thành những bước đi có ý nghĩa, giúp ta không nản lòng trước thất bại. Biết bao tấm gương đã chứng minh điều này: từ cậu học trò nghèo nuôi ước mơ thành bác sĩ đến cô gái khuyết tật quyết tâm thành họa sĩ — ước mơ đã nâng đỡ họ vượt qua mọi nghịch cảnh.\n\nBên cạnh đó, ước mơ còn làm cho cuộc sống thêm ý nghĩa. Người có ước mơ sống tích cực, lạc quan, luôn hướng về phía trước; ngược lại, kẻ sống không ước mơ dễ rơi vào chán nản, buông xuôi, để thời gian trôi qua vô ích. Ước mơ cũng gắn kết con người: những người cùng chung hoài bão sẽ đồng hành, giúp đỡ nhau cùng tiến bước.\n\nTuy nhiên, cần phân biệt ước mơ với ảo tưởng. Ước mơ phải gắn với năng lực thực tế và sự nỗ lực không ngừng; còn những mong muốn viển vông, thiếu cơ sở mà không chịu hành động chỉ là ảo tưởng, sớm muộn cũng vỡ tan. Có ước mơ mà không hành động thì ước mơ nghèo nuôi ước mơ thành bác sĩ đến cô gái khuyết tật quyết tâm thành họa sĩ — ước mơ đã nâng đỡ họ vượt qua mọi nghịch cảnh.\n\nBên cạnh đó, ước mơ còn làm cho cuộc sống thêm ý nghĩa. Người có ước mơ sống tích cực, lạc quan, luôn hướng về phía trước; ngược lại, kẻ sống không ước mơ dễ rơi vào chán nản, buông xuôi, để thời gian trôi qua vô ích. Ước mơ cũng gắn kết con người: những người cùng chung hoài bão sẽ đồng hành, giúp đỡ nhau cùng tiến bước.\n\nTuy nhiên, cần phân biệt ước mơ với ảo tưởng. Ước mơ phải gắn với năng lực thực tế và sự nỗ lực không ngừng; còn những mong muốn viển vông, thiếu cơ sở mà không chịu hành động chỉ là ảo tưởng, sớm muộn cũng vỡ tan. Có ước mơ mà không hành động thì ước mơ mãi chỉ là giấc mơ.\n\nVì vậy, mỗi bạn trẻ hãy nuôi dưỡng cho mình một ước mơ đẹp, phù hợp với khả năng, và quyết tâm biến nó thành hiện thực bằng học tập, rèn luyện mỗi ngày. Đừng sợ ước mơ lớn, chỉ sợ ta không dám ước mơ và không dám hành động. Hãy để ước mơ là ngọn đèn soi sáng con đường ta đi.\n\nCâu 5. Ước mơ của em là gì? Em sẽ làm gì để thực hiện nó? (Trả lời ngắn gọn)", "answer": "Một ước mơ cụ thể và kế hoạch hành động (học tập, rèn luyện)", "explain": "Chấp nhận câu trả lời thể hiện ước mơ chính đáng, phù hợp và có kế hoạch cụ thể: chăm học, rèn kĩ năng, kiên trì... Cốt lõi: có ước mơ và dám hành động vì nó.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "VIẾT\nCâu 6. Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của ước mơ đối với tuổi trẻ.", "explain": "DÀN Ý:\n1. Mở đoạn: ước mơ là ngọn đèn soi đường, động lực của tuổi trẻ.\n2. Thân đoạn: (a) Vai trò: cho mục tiêu, động lực; giúp vượt khó khăn; làm cuộc sống ý nghĩa; (b) Dẫn chứng tấm gương; (c) Phê phán: sống không ước mơ, hoặc ước mơ viển vông thiếu hành động.\n3. Kết đoạn: hãy nuôi dưỡng ước mơ và hành động.\n\nBÀI MẪU:\nƯớc mơ có vai trò vô cùng quan trọng đối với tuổi trẻ — nó như ngọn đèn soi đường, như động lực giúp ta vượt qua mọi khó khăn để vươn tới tương lai. Khi có ước mơ, ta sẽ biết mình cần học gì, rèn luyện ra sao; mỗi cố gắng hằng ngày đều trở thành bước đi có ý nghĩa hướng tới mục tiêu. Ước mơ cũng giúp ta không nản lòng trước thất bại, bởi ta hiểu thất bại chỉ là bước đệm tạm thời. Biết bao tấm gương đã chứng minh sức mạnh của ước mơ: cậu học trò nghèo quyết tâm thành bác sĩ, cô gái khuyết tật nỗ lực thành họa sĩ — chính ước mơ đã nâng đỡ họ vượt qua nghịch cảnh. Ngược lại, tuổi trẻ không có ước mơ chẳng khác nào con thuyền không bánh lái, lênh đênh vô định, dễ rơi vào chán nản, buông xuôi. Cũng cần tránh nhầm lẫn ước mơ với ảo tưởng viển vông thiếu hành động. Vì vậy, mỗi bạn trẻ hãy nuôi dưỡng một ước mơ đẹp, phù hợp với khả năng, và quyết tâm biến nó thành hiện thực bằng sự nỗ lực mỗi ngày. Đừng sợ ước mơ lớn — chỉ sợ ta không dám ước mơ và không dám hành động.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7. Viết bài văn nghị luận xã hội khoảng 600 chữ về hoài bão, ước mơ của tuổi trẻ hôm nay.", "explain": "DÀN Ý CHI TIẾT:\nI. Mở bài: giới thiệu vấn đề — ước mơ, hoài bão là hành trang không thể thiếu của tuổi trẻ.\nII. Thân bài:\n1. Giải thích: ước mơ, hoài bão là những mong muốn, khát vọng tốt đẹp về tương lai.\n2. Vai trò:\n   a. Cho mục tiêu, động lực phấn đấu.\n   b. Giúp vượt qua khó khăn, thất bại (dẫn chứng tấm gương).\n   c. Làm cuộc sống ý nghĩa, gắn kết con người.\n3. Phân biệt ước mơ với ảo tưởng; phê phán lối sống không ước mơ hoặc ước mơ viển vông.\n4. Làm thế nào để biến ước mơ thành hiện thực: xác định ước mơ phù hợp; lập kế hoạch; kiên trì học tập, rèn luyện; dám đối mặt thất bại.\n5. Liên hệ: ước mơ của bản thân và quyết tâm thực hiện.\nIII. Kết bài: khẳng định lại; nhắn nhủ tuổi trẻ hãy dám ước mơ và dám hành động.\n\nĐOẠN MẪU (mở bài):\nAi cũng chỉ sống một lần trong đời, và tuổi trẻ là quãng thời gian đẹp nhất để nuôi dưỡng những ước mơ, hoài bão. Ước mơ không chỉ là khát vọng về tương lai mà còn là ngọn đèn soi đường, là động lực giúp con người vượt qua mọi gian nan để vươn tới thành công. Thế nhưng, không phải bạn trẻ nào cũng hiểu đúng về ước mơ và biết cách biến nó thành hiện thực. Bàn về hoài bão, ước mơ của tuổi trẻ vì vậy là vấn đề có ý nghĩa thiết thực.", "points": 0}]}]}
