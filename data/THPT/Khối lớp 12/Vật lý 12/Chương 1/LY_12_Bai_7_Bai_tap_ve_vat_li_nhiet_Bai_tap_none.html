", "explain": "Công suất có đơn vị oát (W).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệu suất của bếp đun được tính bằng:", "options": ["A. $H = \\frac{Q_{có ích}}{Q_{toàn phần}} \\times 100\\%$", "B. $H = Q_{toàn phần} - Q_{có ích}$", "C. $H = Pt$", "D. $H = \\frac{P}{Q}$"], "answer": "A", "explain": "Hiệu suất $H$ là tỉ số giữa nhiệt lượng có ích và nhiệt lượng toàn phần bếp toả ra.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một ấm điện hiệu suất $80\\%$, nhiệt lượng có ích $320$ kJ thì nhiệt lượng toàn phần ấm toả ra là:", "options": ["A. $400$ kJ", "B. $256$ kJ", "C. $320$ kJ", "D. $480$ kJ"], "answer": "A", "explain": "$Q_{tp} = Q_{ci}/H = 320/0,8 = 400$ kJ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đun $0,5$ kg nước từ $20^{\\circ}$C đến $100^{\\circ}$C cần:", "options": ["A. $168$ kJ", "B. $336$ kJ", "C. $84$ kJ", "D. $1680$ kJ"], "answer": "A", "explain": "$Q = 0,5 \\times 4200 \\times 80 = 168\\,000$ J $= 168$ kJ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trộn $1$ kg nước ở $75^{\\circ}$C với $4$ kg nước ở $30^{\\circ}$C. Tính nhiệt độ cân bằng (theo đơn vị $^{\\circ}$C, bỏ qua hao phí).", "options": ["A. 44 $^{\\circ}$C", "B. 34 $^{\\circ}$C", "C. 39 $^{\\circ}$C", "D. 49 $^{\\circ}$C"], "answer": "C", "explain": "$Q_{toả} = Q_{thu} \\Rightarrow 1 \\times 4200 \\times (75 - t) = 4 \\times 4200 \\times (t - 30)$. Giải ra $t = \\frac{1 \\times 75 + 4 \\times 30}{1 + 4} = 39^{\\circ}$C.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một bếp điện công suất $800$ W đun $2$ kg nước từ $20^{\\circ}$C đến $100^{\\circ}$C. Tính thời gian đun theo đơn vị phút (bỏ qua hao phí).", "options": ["A. 840 phút", "B. 28 phút", "C. 14 phút", "D. 7 phút"], "answer": "C", "explain": "Nhiệt lượng nước cần: $Q = 2 \\times 4200 \\times 80 = 672000$ J. Từ $Q = Pt$ suy ra $t = Q/P = 672000/800 = 840$ s $= 14$ phút.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về bếp điện:", "statements": ["a) Nhiệt lượng bếp toả ra: $Q = Pt$.", "b) $P$ là công suất của bếp.", "c) Hiệu suất $H = Q_{có ích}/Q_{toàn phần}$.", "d) $Q = Pt$ với $t$ tính bằng phút."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $t$ phải tính bằng giây.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đun $2$ kg nước đá từ $-10^{\\circ}$C thành hơi ở $100^{\\circ}$C. Xét tính đúng, sai:", "statements": ["a) Gồm 4 giai đoạn.", "b) $Q_1 = 42\\,000$ J, $Q_2 = 668\\,000$ J.", "c) $Q_3 = 840\\,000$ J, $Q_4 = 4\\,520\\,000$ J.", "d) Tổng $Q = 6070$ kJ."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn phát biểu đều đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Trộn $4$ kg nước ở $80^{\\circ}$C với $1$ kg nước ở $30^{\\circ}$C. Tính nhiệt độ cân bằng (theo đơn vị $^{\\circ}$C, bỏ qua hao phí, chỉ ghi số).", "answer": "70", "explain": "$t = \\frac{4 \\times 80 + 1 \\times 30}{4 + 1} = 70^{\\circ}$C.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một bếp điện công suất $560$ W đun $1$ kg nước từ $20^{\\circ}$C đến $100^{\\circ}$C. Tính thời gian đun theo đơn vị phút (chỉ ghi số).", "answer": "10", "explain": "Nhiệt lượng nước cần: $Q = 1 \\times 4200 \\times 80 = 336000$ J. Từ $Q = Pt$ suy ra $t = Q/P = 336000/560 = 600$ s $= 10$ phút.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Khi giải bài toán đun nước đá thành hơi nước, cần chia thành các giai đoạn:", "options": ["A. đá nóng lên – đá nóng chảy – nước nóng lên – nước hoá hơi", "B. chỉ một giai đoạn", "C. đá nóng chảy – nước hoá hơi", "D. nước nóng lên – nước hoá hơi"], "answer": "A", "explain": "Đầy đủ 4 giai đoạn: đá nóng lên ($mc\\Delta t$), đá nóng chảy ($\\lambda m$), nước nóng lên ($mc\\Delta t$), nước hoá hơi ($Lm$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong bài toán cân bằng nhiệt, vật nào toả nhiệt?", "options": ["A. Vật có nhiệt độ ban đầu cao hơn", "B. Vật có nhiệt độ ban đầu thấp hơn", "C. Vật có khối lượng lớn hơn", "D. Vật có nhiệt dung riêng lớn hơn"], "answer": "A", "explain": "Vật nóng hơn (nhiệt độ ban đầu cao hơn) toả nhiệt cho vật lạnh hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thả một thỏi kim loại nóng vào nước lạnh, sau một thời gian:", "options": ["A. kim loại và nước có cùng nhiệt độ", "B. kim loại vẫn nóng hơn", "C. nước nóng hơn kim loại", "D. cả hai đều nguội về $0^{\\circ}$C"], "answer": "A", "explain": "Khi đạt cân bằng nhiệt, hai vật có cùng nhiệt độ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhiệt lượng cần để đun $2$ kg nước đá từ $-10^{\\circ}$C thành nước ở $0^{\\circ}$C là:", "options": ["A. $710$ kJ", "B. $668$ kJ", "C. $42$ kJ", "D. $840$ kJ"], "answer": "A", "explain": "$Q = 2 \\times 2100 \\times 10 + 2 \\times 3,34 \\times 10^5 = 42\\,000 + 668\\,000 = 710\\,000$ J $= 710$ kJ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trộn $3$ kg nước ở $50^{\\circ}$C với $3$ kg nước ở $40^{\\circ}$C. Tính nhiệt độ cân bằng (theo đơn vị $^{\\circ}$C, bỏ qua hao phí).", "options": ["A. 50 $^{\\circ}$C", "B. 40 $^{\\circ}$C", "C. 55 $^{\\circ}$C", "D. 45 $^{\\circ}$C"], "answer": "D", "explain": "$Q_{toả} = Q_{thu} \\Rightarrow 3 \\times 4200 \\times (50 - t) = 3 \\times 4200 \\times (t - 40)$. Giải ra $t = \\frac{3 \\times 50 + 3 \\times 40}{3 + 3} = 45^{\\circ}$C.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một bếp điện công suất $1120$ W đun $2$ kg nước từ $20^{\\circ}$C đến $100^{\\circ}$C. Tính thời gian đun theo đơn vị phút (bỏ qua hao phí).", "options": ["A. 600 phút", "B. 20 phút", "C. 5 phút", "D. 10 phút"], "answer": "D", "explain": "Nhiệt lượng nước cần: $Q = 2 \\times 4200 \\times 80 = 672000$ J. Từ $Q = Pt$ suy ra $t = Q/P = 672000/1120 = 600$ s $= 10$ phút.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Một bếp $800$ W đun $1$ kg nước từ $20^{\\circ}$C đến $100^{\\circ}$C (bỏ qua hao phí). Xét tính đúng, sai:", "statements": ["a) $Q = 1 \\times 4200 \\times 80 = 336\\,000$ J.", "b) $t = 336\\,000/800 = 420$ s.", "c) Thời gian đun là $7$ phút.", "d) Thời gian đun là $420$ phút."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: $420$ s $= 7$ phút. d) Sai: quên đổi giây ra phút.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai về lỗi thường gặp khi giải bài tập nhiệt:", "statements": ["a) Quên đổi gam ra kilôgam.", "b) Quên đổi kJ ra J (hoặc ngược lại).", "c) Dùng $Q = mc\\Delta t$ khi đang đổi thể.", "d) Các lỗi trên đều không ảnh hưởng kết quả."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: là các lỗi phổ biến. d) Sai: đều làm sai kết quả.", "points": 1}, {"type": "short", "level": "VD", "q": "Trộn $2$ kg nước ở $65^{\\circ}$C với $2$ kg nước ở $15^{\\circ}$C. Tính nhiệt độ cân bằng (theo đơn vị $^{\\circ}$C, bỏ qua hao phí, chỉ ghi số).", "answer": "40", "explain": "$t = \\frac{2 \\times 65 + 2 \\times 15}{2 + 2} = 40^{\\circ}$C.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một bếp điện công suất $700$ W đun $1$ kg nước từ $20^{\\circ}$C đến $100^{\\circ}$C. Tính thời gian đun theo đơn vị phút (chỉ ghi số).", "answer": "8", "explain": "Nhiệt lượng nước cần: $Q = 1 \\times 4200 \\times 80 = 336000$ J. Từ $Q = Pt$ suy ra $t = Q/P = 336000/700 = 480$ s $= 8$ phút.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khi trộn hai lượng nước cùng nhiệt độ, nhiệt độ cân bằng là:", "options": ["A. bằng nhiệt độ ban đầu", "B. trung bình cộng", "C. tổng hai nhiệt độ", "D. bằng không"], "answer": "A", "explain": "Hai vật cùng nhiệt độ thì không trao đổi nhiệt, nhiệt độ giữ nguyên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiệt độ cân bằng khi trộn nước nóng và nước lạnh luôn:", "options": ["A. nằm giữa hai nhiệt độ ban đầu", "B. bằng nhiệt độ nước nóng", "C. bằng nhiệt độ nước lạnh", "D. cao hơn cả hai"], "answer": "A", "explain": "Nhiệt độ cân bằng $t$ thoả mãn $t_2$ nhỏ hơn $t$ nhỏ hơn $t_1$ (nằm giữa hai nhiệt độ ban đầu).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bếp dầu hoả đun sôi $2$ kg nước từ $20^{\\circ}$C, hiệu suất $40\\%$. Nhiệt lượng bếp phải toả ra là:", "options": ["A. $1680$ kJ", "B. $672$ kJ", "C. $268,8$ kJ", "D. $6720$ kJ"], "answer": "A", "explain": "$Q_{ci} = 672$ kJ; $Q_{tp} = 672/0,4 = 1680$ kJ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trộn $3$ kg nước ở $90^{\\circ}$C với $7$ kg nước ở $20^{\\circ}$C, nhiệt độ cân bằng là:", "options": ["A. $41^{\\circ}$C", "B. $55^{\\circ}$C", "C. $45^{\\circ}$C", "D. $35^{\\circ}$C"], "answer": "A", "explain": "$t = (3 \\times 90 + 7 \\times 20)/10 = 410/10 = 41^{\\circ}$C.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trộn $4$ kg nước ở $55^{\\circ}$C với $1$ kg nước ở $40^{\\circ}$C. Tính nhiệt độ cân bằng (theo đơn vị $^{\\circ}$C, bỏ qua hao phí).", "options": ["A. 52 $^{\\circ}$C", "B. 57 $^{\\circ}$C", "C. 47 $^{\\circ}$C", "D. 62 $^{\\circ}$C"], "answer": "A", "explain": "$Q_{toả} = Q_{thu} \\Rightarrow 4 \\times 4200 \\times (55 - t) = 1 \\times 4200 \\times (t - 40)$. Giải ra $t = \\frac{4 \\times 55 + 1 \\times 40}{4 + 1} = 52^{\\circ}$C.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một bếp điện công suất $1400$ W đun $2$ kg nước từ $20^{\\circ}$C đến $100^{\\circ}$C. Tính thời gian đun theo đơn vị phút (bỏ qua hao phí).", "options": ["A. 8 phút", "B. 480 phút", "C. 16 phút", "D. 4 phút"], "answer": "A", "explain": "Nhiệt lượng nước cần: $Q = 2 \\times 4200 \\times 80 = 672000$ J. Từ $Q = Pt$ suy ra $t = Q/P = 672000/1400 = 480$ s $= 8$ phút.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về các giai đoạn đun nước đá thành hơi:", "statements": ["a) Đun nước đá thành hơi nước gồm 4 giai đoạn.", "b) Mỗi giai đoạn dùng công thức riêng ($mc\\Delta t$, $\\lambda m$, $Lm$).", "c) Nhiệt lượng tổng bằng tổng nhiệt lượng từng giai đoạn.", "d) Chỉ cần tính giai đoạn hoá hơi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Trộn $1$ kg nước ở $70^{\\circ}$C với $4$ kg nước ở $20^{\\circ}$C. Xét tính đúng, sai:", "statements": ["a) $t = (70 + 80)/5 = 30^{\\circ}$C.", "b) Nhiệt độ cân bằng gần nhiệt độ nước lạnh hơn.", "c) Nước nóng toả: $1 \\times 4200 \\times 40 = 168\\,000$ J.", "d) Nước lạnh thu: $4 \\times 4200 \\times 10 = 168\\,000$ J: khớp."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn phát biểu đều đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Trộn $4$ kg nước ở $70^{\\circ}$C với $1$ kg nước ở $30^{\\circ}$C. Tính nhiệt độ cân bằng (theo đơn vị $^{\\circ}$C, bỏ qua hao phí, chỉ ghi số).", "answer": "62", "explain": "$t = \\frac{4 \\times 70 + 1 \\times 30}{4 + 1} = 62^{\\circ}$C.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một bếp điện công suất $1400$ W đun $2$ kg nước từ $20^{\\circ}$C đến $100^{\\circ}$C. Tính thời gian đun theo đơn vị phút (chỉ ghi số).", "answer": "8", "explain": "Nhiệt lượng nước cần: $Q = 2 \\times 4200 \\times 80 = 672000$ J. Từ $Q = Pt$ suy ra $t = Q/P = 672000/1400 = 480$ s $= 8$ phút.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trộn $1$ kg nước ở $60^{\\circ}$C với $3$ kg nước ở $40^{\\circ}$C. Tính nhiệt độ cân bằng (theo đơn vị $^{\\circ}$C, bỏ qua hao phí).", "options": ["A. 45 $^{\\circ}$C", "B. 50 $^{\\circ}$C", "C. 40 $^{\\circ}$C", "D. 55 $^{\\circ}$C"], "answer": "A", "explain": "$Q_{toả} = Q_{thu} \\Rightarrow 1 \\times 4200 \\times (60 - t) = 3 \\times 4200 \\times (t - 40)$. Giải ra $t = \\frac{1 \\times 60 + 3 \\times 40}{1 + 3} = 45^{\\circ}$C.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trộn $2$ kg nước ở $55^{\\circ}$C với $3$ kg nước ở $15^{\\circ}$C. Tính nhiệt độ cân bằng (theo đơn vị $^{\\circ}$C, bỏ qua hao phí).", "options": ["A. 36 $^{\\circ}$C", "B. 31 $^{\\circ}$C", "C. 26 $^{\\circ}$C", "D. 41 $^{\\circ}$C"], "answe
