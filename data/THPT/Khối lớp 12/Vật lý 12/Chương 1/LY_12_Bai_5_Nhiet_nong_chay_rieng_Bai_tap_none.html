: 0.25}, {"type": "mcq", "level": "NB", "q": "Sự nóng chảy là quá trình chuyển từ:", "options": ["A. thể rắn sang thể lỏng", "B. thể lỏng sang thể rắn", "C. thể lỏng sang thể khí", "D. thể rắn sang thể khí"], "answer": "A", "explain": "Nóng chảy: rắn → lỏng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đun nóng chảy $0,5$ kg chì ở nhiệt độ nóng chảy cần nhiệt lượng (biết $\\lambda_{chì} = 0,25 \\times 10^5$ J/kg):", "options": ["A. $12,5$ kJ", "B. $125$ kJ", "C. $1,25$ kJ", "D. $1250$ kJ"], "answer": "A", "explain": "$Q = 0,25 \\times 10^5 \\times 0,5 = 12\\,500$ J $= 12,5$ kJ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhiệt nóng chảy riêng cho biết:", "options": ["A. mức độ khó nóng chảy của chất", "B. nhiệt độ nóng chảy", "C. khối lượng riêng", "D. nhiệt dung riêng"], "answer": "A", "explain": "$\\lambda$ càng lớn thì càng tốn nhiều nhiệt để nóng chảy: cho biết mức độ khó nóng chảy.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cần làm nóng chảy hoàn toàn bao nhiêu kilôgam sắt ở nhiệt độ nóng chảy để cần nhiệt lượng $540$ kJ? Biết $\\lambda_{sắt} = 2,7 \\times 10^5$ J/kg.", "options": ["A. 4", "B. 1", "C. 2", "D. 3"], "answer": "C", "explain": "Từ $Q = \\lambda m$ suy ra $m = Q/\\lambda = 540000/(2,7 \\times 10^5) = 2$ kg.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tính nhiệt lượng cần thiết (theo đơn vị kJ) để đun $3$ kg nước đá từ $-10^{\\circ}$C thành nước ở $10^{\\circ}$C. Biết $c_{đá} = 2100$ J/(kg.K), $\\lambda = 3,34 \\times 10^5$ J/kg, $c_{nước} = 4200$ J/(kg.K).", "options": ["A. 1291", "B. 1091", "C. 1191", "D. 1002"], "answer": "C", "explain": "Ba giai đoạn: đá nóng lên $Q_1 = 3 \\times 2100 \\times 10 = 63000$ J; đá nóng chảy $Q_2 = 3 \\times 3,34 \\times 10^5 = 1002000$ J; nước nóng lên $Q_3 = 3 \\times 4200 \\times 10 = 126000$ J. Tổng: $Q = 1191$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Làm nóng chảy hoàn toàn $2$ kg nước đá ở $0^{\\circ}$C. Xét tính đúng, sai:", "statements": ["a) $Q = 3,34 \\times 10^5 \\times 2$.", "b) $Q = 668\\,000$ J.", "c) Cần $668$ kJ.", "d) Cần $334$ kJ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $334$ kJ chỉ đủ cho $1$ kg.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Nhiệt lượng $195$ kJ làm nóng chảy hoàn toàn một khối nhôm ở nhiệt độ nóng chảy. Xét tính đúng, sai:", "statements": ["a) $Q = 195\\,000$ J.", "b) $m = 195\\,000/(3,9 \\times 10^5) = 0,5$ kg.", "c) Khối nhôm nặng $0,5$ kg.", "d) Khối nhôm nặng $5$ kg."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Làm nóng chảy hoàn toàn $1,5$ kg nước đá ở nhiệt độ nóng chảy cần bao nhiêu kJ (chỉ ghi số)? Biết $\\lambda = 3,34 \\times 10^5$ J/kg.", "answer": "501", "explain": "$Q = \\lambda m = 3,34 \\times 10^5 \\times 1,5 = 501$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhiệt lượng $250$ kJ làm nóng chảy hoàn toàn được bao nhiêu kg chì ở nhiệt độ nóng chảy (chỉ ghi số)? Biết $\\lambda = 0,25 \\times 10^5$ J/kg.", "answer": "10", "explain": "$m = Q/\\lambda = 250000/(0,25 \\times 10^5) = 10$ kg.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Nhiệt độ nóng chảy của nước đá là:", "options": ["A. $0^{\\circ}$C", "B. $100^{\\circ}$C", "C. $-273^{\\circ}$C", "D. $660^{\\circ}$C"], "answer": "A", "explain": "Nước đá nóng chảy ở $0^{\\circ}$C (ở áp suất thường).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi nóng chảy, chất:", "options": ["A. thu nhiệt", "B. toả nhiệt", "C. không trao đổi nhiệt", "D. vừa thu vừa toả"], "answer": "A", "explain": "Nóng chảy là quá trình đi lên (rắn → lỏng) nên thu nhiệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi đun một cục nước đá, nhiệt độ giữ ở $0^{\\circ}$C trong một thời gian vì:", "options": ["A. nhiệt cung cấp dùng để phá vỡ liên kết phân tử", "B. đã ngừng đun", "C. nước đá cách nhiệt", "D. nhiệt kế hỏng"], "answer": "A", "explain": "Trong lúc nóng chảy, nhiệt cung cấp dùng để phá vỡ liên kết giữa các phân tử nên nhiệt độ không đổi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để nóng chảy $3$ kg sắt ở nhiệt độ nóng chảy cần nhiệt lượng ($\\lambda_{sắt} = 2,7 \\times 10^5$ J/kg):", "options": ["A. $810$ kJ", "B. $81$ kJ", "C. $8100$ kJ", "D. $8,1$ kJ"], "answer": "A", "explain": "$Q = 2,7 \\times 10^5 \\times 3 = 810\\,000$ J $= 810$ kJ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cần làm nóng chảy hoàn toàn bao nhiêu kilôgam chì ở nhiệt độ nóng chảy để cần nhiệt lượng $50$ kJ? Biết $\\lambda_{chì} = 0,25 \\times 10^5$ J/kg.", "options": ["A. 4", "B. 1", "C. 3", "D. 2"], "answer": "D", "explain": "Từ $Q = \\lambda m$ suy ra $m = Q/\\lambda = 50000/(0,25 \\times 10^5) = 2$ kg.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tính nhiệt lượng cần thiết (theo đơn vị kJ) để đun $1$ kg nước đá từ $0^{\\circ}$C thành nước ở $100^{\\circ}$C. Biết $c_{đá} = 2100$ J/(kg.K), $\\lambda = 3,34 \\times 10^5$ J/kg, $c_{nước} = 4200$ J/(kg.K).", "options": ["A. 854", "B. 654", "C. 334", "D. 754"], "answer": "D", "explain": "Ba giai đoạn: đá nóng lên $Q_1 = 1 \\times 2100 \\times 0 = 0$ J; đá nóng chảy $Q_2 = 1 \\times 3,34 \\times 10^5 = 334000$ J; nước nóng lên $Q_3 = 1 \\times 4200 \\times 100 = 420000$ J. Tổng: $Q = 754$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về nhiệt độ nóng chảy của các chất:", "statements": ["a) Mỗi chất có nhiệt độ nóng chảy xác định.", "b) Mỗi chất có nhiệt nóng chảy riêng xác định.", "c) $\\lambda$ càng lớn thì càng khó nóng chảy.", "d) Mọi chất đều có $\\lambda$ bằng nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đun nóng chảy $4$ kg chì ở $327^{\\circ}$C ($\\lambda = 0,25 \\times 10^5$ J/kg). Xét tính đúng, sai:", "statements": ["a) $Q = 0,25 \\times 10^5 \\times 4 = 100\\,000$ J.", "b) Cần $100$ kJ.", "c) Chì có $\\lambda$ nhỏ nên dễ nóng chảy.", "d) Cần $1000$ kJ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Làm nóng chảy hoàn toàn $2$ kg sắt ở nhiệt độ nóng chảy cần bao nhiêu kJ (chỉ ghi số)? Biết $\\lambda = 2,7 \\times 10^5$ J/kg.", "answer": "540", "explain": "$Q = \\lambda m = 2,7 \\times 10^5 \\times 2 = 540$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhiệt lượng $540$ kJ làm nóng chảy hoàn toàn được bao nhiêu kg sắt ở nhiệt độ nóng chảy (chỉ ghi số)? Biết $\\lambda = 2,7 \\times 10^5$ J/kg.", "answer": "2", "explain": "$m = Q/\\lambda = 540000/(2,7 \\times 10^5) = 2$ kg.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Trong công thức $Q = \\lambda m$, $m$ là:", "options": ["A. khối lượng chất được nóng chảy", "B. khối lượng riêng", "C. nhiệt độ", "D. thể tích"], "answer": "A", "explain": "$m$ là khối lượng (kg) của chất được nóng chảy hoàn toàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quá trình ngược với sự nóng chảy là:", "options": ["A. sự đông đặc", "B. sự bay hơi", "C. sự ngưng tụ", "D. sự thăng hoa"], "answer": "A", "explain": "Ngược với nóng chảy (rắn → lỏng) là đông đặc (lỏng → rắn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh nhiệt lượng nóng chảy $1$ kg nhôm và $1$ kg đồng ở nhiệt độ nóng chảy:", "options": ["A. Nhôm cần nhiều hơn (vì $\\lambda_{nhôm}$ lớn hơn)", "B. Đồng cần nhiều hơn", "C. Bằng nhau", "D. Không so sánh được"], "answer": "A", "explain": "$\\lambda_{nhôm} = 3,9 \\times 10^5$ lớn hơn $\\lambda_{đồng} = 1,8 \\times 10^5$ nên nhôm cần nhiều nhiệt hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nung một thỏi chì đến $327^{\\circ}$C (nhiệt độ nóng chảy của chì) rồi tiếp tục đun, hiện tượng xảy ra là:", "options": ["A. chì nóng chảy, nhiệt độ giữ ở $327^{\\circ}$C cho đến khi chảy hết", "B. nhiệt độ tiếp tục tăng ngay", "C. chì bay hơi", "D. chì đông đặc"], "answer": "A", "explain": "Khi đạt nhiệt độ nóng chảy và tiếp tục đun, chì nóng chảy dần, nhiệt độ không đổi cho đến khi chảy hết.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Để làm nóng chảy hoàn toàn $3$ kg một kim loại ở nhiệt độ nóng chảy cần nhiệt lượng $540$ kJ. Nhiệt nóng chảy riêng của kim loại đó bằng bao nhiêu (theo đơn vị $10^5$ J/kg, chỉ ghi số)?", "options": ["A. 1,8", "B. 3,6", "C. 0,9", "D. 2,8"], "answer": "A", "explain": "$\\lambda = Q/m = 540000/3 = 180000$ J/kg $= 1,8 \\times 10^5$ J/kg.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tính nhiệt lượng cần thiết (theo đơn vị kJ) để đun $0,5$ kg nước đá từ $-20^{\\circ}$C thành nước ở $40^{\\circ}$C. Biết $c_{đá} = 2100$ J/(kg.K), $\\lambda = 3,34 \\times 10^5$ J/kg, $c_{nước} = 4200$ J/(kg.K).", "options": ["A. 272", "B. 372", "C. 172", "D. 167"], "answer": "A", "explain": "Ba giai đoạn: đá nóng lên $Q_1 = 0,5 \\times 2100 \\times 20 = 21000$ J; đá nóng chảy $Q_2 = 0,5 \\times 3,34 \\times 10^5 = 167000$ J; nước nóng lên $Q_3 = 0,5 \\times 4200 \\times 40 = 84000$ J. Tổng: $Q = 272$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về đồ thị nhiệt độ – thời gian khi đun nóng chảy:", "statements": ["a) Đoạn dốc lên đầu: chất rắn nóng dần lên.", "b) Đoạn nằm ngang: chất đang nóng chảy, nhiệt độ không đổi.", "c) Đoạn dốc lên cuối: chất lỏng nóng dần lên.", "d) Đoạn nằm ngang chứng tỏ đã ngừng đun."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vẫn đang đun, nhiệt dùng để phá vỡ liên kết.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một học sinh tính nhiệt lượng nóng chảy $2$ kg nước đá được $668\\,000$ kJ. Xét tính đúng, sai:", "statements": ["a) Kết quả đúng phải là $668\\,000$ J.", "b) $668\\,000$ J $= 668$ kJ.", "c) Học sinh quên đổi J ra kJ.", "d) Kết quả của học sinh là đúng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: lỗi quên đổi đơ  "q": "Cần làm nóng chảy hoàn toàn bao nhiêu kilôgam nước đá ở nhiệt độ nóng chảy để cần nhiệt lượng $167$ kJ? Biết $\\lambda_{nước đá} = 3,34 \\times 10^5$ J/kg.", "options": ["A. 1", "B. 0,25", "C. 1,5", "D. 0,5"], "answer": "D", "explain": "Từ $Q = \\lambda m$ suy ra $m = Q/\\lambda = 167000/(3,34 \\times 10^5) = 0,5$ kg.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tính nhiệt lượng cần thiết (theo đơn vị kJ) để đun $1,5$ kg nước đá từ $-20^{\\circ}$C thành nước ở $20^{\\circ}$C. Biết $c_{đá} = 2100$ J/(kg.K), $\\lambda = 3,34 \\times 10^5$ J/kg, $c_{nước} = 4200$ J/(kg.K).", "options": ["A. 790", "B. 590", "C. 501", "D. 690"], "answer": "D", "explain": "Ba giai đoạn: đá nóng lên $Q_1 = 1,5 \\times 2100 \\times 20 = 63000$ J; đá nóng chảy $Q_2 = 1,5 \\times 3,34 \\times 10^5 = 501000$ J; nước nóng lên $Q_3 = 1,5 \\times 4200 \\times 20 = 126000$ J. Tổng: $Q = 690$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Một cục nước đá ở $-5^{\\circ}$C được đun nóng. Xét tính đúng, sai:", "statements": ["a) Trước hết nước đá nóng lên đến $0^{\\circ}$C.", "b) Sau đó nước đá nóng chảy ở $0^{\\circ}$C.", "c) Nhiệt lượng tổng: $Q = mc\\Delta t + \\lambda m$.", "d) Nước đá nóng chảy ngay ở $-5^{\\circ}$C."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phải đạt $0^{\\circ}$C mới nóng chảy.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Để có $390$ kJ, cần nóng chảy bao nhiêu kilôgam nhôm? Xét tính đúng, sai:", "statements": ["a) $Q = 390\\,000$ J.", "b) $m = 390\\,000/(3,9 \\times 10^5) = 1$ kg.", "c) Cần $1$ kg nhôm.", "d) Cần $3,9$ kg nhôm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Làm nóng chảy hoàn toàn $5$ kg đồng ở nhiệt độ nóng chảy cần bao nhiêu kJ (chỉ ghi số)? Biết $\\lambda = 1,8 \\times 10^5$ J/kg.", "answer": "900", "explain": "$Q = \\lambda m = 1,8 \\times 10^5 \\times 5 = 900$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhiệt lượng $180$ kJ làm nóng chảy hoàn toàn được bao nhiêu kg đồng ở nhiệt độ nóng chảy (chỉ ghi số)? Biết $\\lambda = 1,8 \\times 10^5$ J/kg.", "answer": "1", "explain": "$m = Q/\\lambda = 180000/(1,8 \\times 10^5) = 1$ kg.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tính nhiệt lượng cần thiết để làm nóng chảy hoàn toàn $3$ kg sắt ở nhiệt độ nóng chảy (theo đơn vị kJ). Biết $\\lambda_{sắt} = 2,7 \\times 10^5$ J/kg.", "options": ["A. 1620", "B. 405", "C. 810", "D. 860"], "answer": "C", "explain": "$Q = \\lambda m = 2,7 \\times 10^5 \\times 3 = 810000$ J $= 810$ kJ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tính nhiệt lượng cần thiết để làm nóng chảy hoàn toàn $1$ kg đồng ở nhiệt độ nóng chảy (theo đơn vị kJ). Biết $\\lambda_{đồng} = 1,8 \\times 10^5$ J/kg.", "options": ["A. 360", "B. 90", "C. 230", "D. 180"], "answer": "D", "explain": "$Q = \\lambda m = 1,8 \\times 10^5 \\times 1 = 180000$ J $= 180$ kJ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tính nhiệt lượng cần thiết để làm nóng chảy hoàn toàn $1500$ g nước đá ở nhiệt độ nóng chảy (theo đơn vị kJ). Biết $\\lambda_{nước đá} = 3,34 \\times 10^5$ J/kg.", "options": ["A. 1002", "B. 250,5", "C. 501", "D. 551"], "answer": "C", "explain": "Đổi $1500$ g $= 1,5$ kg. $Q = \\lambda m = 3,34 \\times 10^5 \\times 1,5 = 501000$ J $= 501$ kJ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tính nhiệt lượng cần thiết để làm nóng chảy hoàn toàn $1000$ g nhôm ở nhiệt độ nóng chảy (theo đơn vị kJ). Biết $\\lambda_{nhôm} = 3,9 \\times 10^5$ J/kg.", "options": ["A. 780", "B. 195", "C. 440", "D. 390"], "answer": "D", "explain": "Đổi $1000$ g $= 1$ kg. $Q = \\lambda m = 3,9 \\times 10^5 \\times 1 = 390000$ J $= 390$ kJ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cần làm nóng chảy hoàn toàn bao nhiêu kilôgam nhôm ở nhiệt độ nóng chảy để cần nhiệt lượng $390$ kJ? Biết $\\lambda_{nhôm} = 3,9 \\times 10^5$ J/kg.", "options": ["A. 1", "B. 2", "C. 0,5", "D. 10"], "answer": "A", "explain": "Từ $Q = \\lambda m$ suy ra $m = Q/\\lambda = 390000/(3,9 \\times 10^5) = 1$ kg.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tính nhiệt lượng cần thiết (theo đơn vị kJ) để đun $1$ kg nước đá từ $-10^{\\circ}$C thành nước ở $20^{\\circ}$C. Biết $c_{đá} = 2100$ J/(kg.K), $\\lambda = 3,34 \\times 10^5$ J/kg, $c_{nước} = 4200$ J/(kg.K).", "options": ["A. 439", "B. 539", "C. 339", "D. 334"], "answer": "A", "explain": "Ba giai đoạn: đá nóng lên $Q_1 = 1 \\times 2100 \\times 10 = 21000$ J; đá nóng chảy $Q_2 = 1 \\times 3,34 \\times 10^5 = 334000$ J; nước nóng lên $Q_3 = 1 \\times 4200 \\times 20 = 84000$ J. Tổng: $Q = 439$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về nhiệt nóng chảy riêng của nhôm và chì:", "statements": ["a) $\\lambda_{nhôm} = 3,9 \\times 10^5$ J/kg.", "b) $\\lambda_{chì} = 0,25 \\times 10^5$ J/kg.", "c) Nóng chảy $1$ kg nhôm tốn nhiều nhiệt hơn $1$ kg chì.", "d) $\\lambda_{chì}$ lớn hơn $\\lambda_{nhôm}$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai về sự khác nhau giữa $c$ và $\\lambda$:", "statements": ["a) $c$ có đơn vị J/(kg.K), $\\lambda$ có đơn vị J/kg.", "b) $c$ dùng khi không đổi thể, $\\lambda$ dùng khi nóng chảy.", "c) $c_{nước} = 4200$ J/(kg.K), $\\lambda_{nước đá} = 3,34 \\times 10^5$ J/kg.", "d) $c$ và $\\lambda$ là một."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hai đại lượng khác nhau.", "points": 1}, {"type": "short", "level": "VD", "q": "Làm nóng chảy hoàn toàn $10$ kg chì ở nhiệt độ nóng chảy cần bao nhiêu kJ (chỉ ghi số)? Biết $\\lambda = 0,25 \\times 10^5$ J/kg.", "answer": "250", "explain": "$Q = \\lambda m = 0,25 \\times 10^5 \\times 10 = 250$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhiệt lượng $167$ kJ làm nóng chảy hoàn toàn được bao nhiêu kg nước đá ở nhiệt độ nóng chảy (chỉ ghi số)? Biết $\\lambda = 3,34 \\times 10^5$ J/kg.", "answer": "0,5", "explain": "$m = Q/\\lambda = 167000/(3,34 \\times 10^5) = 0,5$ kg.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tính nhiệt lượng cần thiết để làm nóng chảy hoàn toàn $1$ kg nước đá ở nhiệt độ nóng chảy (theo đơn vị kJ). Biết $\\lambda_{nước đá} = 3,34 \\times 10^5$ J/kg.", "options": ["A. 334", "B. 668", "C. 167", "D. 384"], "answer": "A", "explain": "$Q = \\lambda m = 3,34 \\times 10^5 \\times 1 = 334000$ J $= 334$ kJ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tính nhiệt lượng cần thiết để làm nóng chảy hoàn toàn $3$ kg nước đá ở nhiệt độ nóng chảy (theo đơn vị kJ). Biết $\\lambda_{nước đá} = 3,34 \\times 10^5$ J/kg.", "options": ["A. 2004", "B. 1002", "C. 501", "D. 1052"], "answer": "B", "explain": "$Q = \\lambda m = 3,34 \\times 10^5 \\times 3 = 1002000$ J $= 1002$ kJ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tính nhiệt lượng cần thiết để làm nóng chảy hoàn toàn $2000$ g chì ở nhiệt độ nóng chảy (theo đơn vị kJ). Biết $\\lambda_{chì} = 0,25 \\times 10^5$ J/kg.", "options": ["A. 50", "B. 100", "C. 25", "D. 500"], "answer": "A", "explain": "Đổi $2000$ g $= 2$ kg. $Q = \\lambda m = 0,25 \\times 10^5 \\times 2 = 50000$ J $= 50$ kJ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tính nhiệt lượng cần thiết để làm nóng chảy hoàn toàn $1000$ g nước đá ở nhiệt độ nóng chảy (theo đơn vị kJ). Biết $\\lambda_{nước đá} = 3,34 \\times 10^5$ J/kg.", "options": ["A. 668", "B. 334", "C. 167", "D. 384"], "answer": "B", "explain": "Đổi $1000$ g $= 1$ kg. $Q = \\lambda m = 3,34 \\times 10^5 \\times 1 = 334000$ J $= 334$ kJ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Để làm nóng chảy hoàn toàn $2$ kg một kim loại ở nhiệt độ nóng chảy cần nhiệt lượng $360$ kJ. Nhiệt nóng chảy riêng của kim loại đó bằng bao nhiêu (theo đơn vị $10^5$ J/kg, chỉ ghi số)?", "options": ["A. 3,6", "B. 1,8", "C. 0,9", "D. 2,8"], "answer": "B", "explain": "$\\lambda = Q/m = 360000/2 = 180000$ J/kg $= 1,8 \\times 10^5$ J/kg.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tính nhiệt lượng cần thiết (theo đơn vị kJ) để đun $2$ kg nước đá từ $-10^{\\circ}$C thành nước ở $20^{\\circ}$C. Biết $c_{đá} = 2100$ J/(kg.K), $\\lambda = 3,34 \\times 10^5$ J/kg, $c_{nước} = 4200$ J/(kg.K).", "options": ["A. 978", "B. 878", "C. 778", "D. 668"], "answer": "B", "explain": "Ba giai đoạn: đá nóng lên $Q_1 = 2 \\times 2100 \\times 10 = 42000$ J; đá nóng chảy $Q_2 = 2 \\times 3,34 \\times 10^5 = 668000$ J; nước nóng lên $Q_3 = 2 \\times 4200 \\times 20 = 168000$ J. Tổng: $Q = 878$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về ứng dụng:", "statements": ["a) Hàn thiếc dùng nhiệt làm thiếc nóng chảy rồi đông đặc lại.", "b) Đúc tượng đồng nung đồng nóng chảy rồi đổ vào khuôn.", "c) Làm đá trong tủ lạnh là sự nóng chảy.", "d) Cầu chì tự đứt khi dòng điện quá lớn nhờ chì nóng chảy."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: làm đá là sự đông đặc.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Nung $10$ kg chì ở $327^{\\circ}$C để nóng chảy hoàn toàn. Xét tính đúng, sai:", "statements": ["a) $Q = 0,25 \\times 10^5 \\times 10 = 250\\,000$ J.", "b) Cần $250$ kJ.", "c) Nếu chỉ nung $5$ kg thì cần $125$ kJ.", "d) Nhiệt độ của chì tăng lên $400^{\\circ}$C trong lúc nóng chảy."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: trong lúc nóng chảy nhiệt độ giữ ở $327^{\\circ}$C.", "points": 1}, {"type": "short", "level": "VD", "q": "Làm nóng chảy hoàn toàn $3$ kg sắt ở nhiệt độ nóng chảy cần bao nhiêu kJ (chỉ ghi số)? Biết $\\lambda = 2,7 \\times 10^5$ J/kg.", "answer": "810", "explain": "$Q = \\lambda m = 2,7 \\times 10^5 \\times 3 = 810$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhiệt lượng $810$ kJ làm nóng chảy hoàn toàn được bao nhiêu kg sắt ở nhiệt độ nóng chảy (chỉ ghi số)? Biết $\\lambda = 2,7 \\times 10^5$ J/kg.", "answer": "3", "explain": "$m = Q/\\lambda = 810000/(2,7 \\times 10^5) = 3$ kg.", "points": 0.5}]}]}
