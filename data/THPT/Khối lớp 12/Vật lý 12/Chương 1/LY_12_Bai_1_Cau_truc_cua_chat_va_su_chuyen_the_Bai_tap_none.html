ng thấp", "D. nước trên núi tinh khiết hơn"], "answer": "A", "explain": "Áp suất khí quyển càng thấp thì nhiệt độ sôi càng thấp; trên núi cao áp suất thấp nên nước sôi dưới 100°C.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về cấu trúc của chất:", "statements": ["a) Mọi chất đều được cấu tạo từ các phân tử.", "b) Các phân tử cấu tạo nên vật đứng yên không chuyển động.", "c) Giữa các phân tử có lực hút và lực đẩy.", "d) Nhiệt độ càng cao, chuyển động nhiệt của phân tử càng nhanh."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: các phân tử chuyển động nhiệt không ngừng. c) Đúng: lực tương tác phân tử gồm lực hút và lực đẩy. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một viên nước đá được lấy ra khỏi tủ lạnh để trên đĩa ở nhiệt độ phòng. Xét tính đúng, sai:", "statements": ["a) Nước đá tan dần là sự nóng chảy.", "b) Quá trình này thu nhiệt từ môi trường.", "c) Trong lúc đá đang tan, nhiệt độ của hỗn hợp nước đá giữ ở 0°C.", "d) Thành đĩa bị ướt là do nước đá thấm qua đĩa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: nóng chảy thu nhiệt, nhiệt độ không đổi trong lúc chuyển thể. d) Sai: thành đĩa ướt do hơi nước trong không khí ngưng tụ khi gặp đĩa lạnh.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Quá trình chuyển trực tiếp từ thể rắn sang thể khí gọi là sự ______.", "answer": "thăng hoa", "explain": "Rắn chuyển trực tiếp sang khí, không qua thể lỏng, gọi là sự thăng hoa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Trong lúc nước đang sôi mạnh ở áp suất thường, nhiệt độ của nước giữ nguyên ở 100°C vì nhiệt cung cấp được dùng để ______ nước thành hơi.", "answer": "chuyển thể", "explain": "Trong quá trình chuyển thể, nhiệt cung cấp dùng để phá vỡ liên kết phân tử nên nhiệt độ không đổi.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Nhiệt độ của vật càng cao thì các phân tử cấu tạo nên vật chuyển động nhiệt:", "options": ["A. càng nhanh", "B. càng chậm", "C. không đổi", "D. ngừng chuyển động"], "answer": "A", "explain": "Nhiệt độ càng cao, chuyển động nhiệt của các phân tử càng nhanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giữa các phân tử cấu tạo nên chất đồng thời tồn tại:", "options": ["A. lực hút và lực đẩy", "B. chỉ lực hút", "C. chỉ lực đẩy", "D. không có lực tương tác"], "answer": "A", "explain": "Giữa các phân tử đồng thời có lực hút và lực đẩy, gọi chung là lực tương tác phân tử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sắp xếp nào sau đây đúng theo chiều khoảng cách trung bình giữa các phân tử tăng dần?", "options": ["A. Chất rắn, chất lỏng, chất khí", "B. Chất khí, chất lỏng, chất rắn", "C. Chất lỏng, chất rắn, chất khí", "D. Chất rắn, chất khí, chất lỏng"], "answer": "A", "explain": "Khoảng cách phân tử: chất rắn nhỏ nhất, chất lỏng trung gian, chất khí lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chất khí dễ nén còn chất rắn và chất lỏng khó nén vì:", "options": ["A. khoảng cách giữa các phân tử khí lớn hơn nhiều", "B. phân tử khí nhẹ hơn", "C. chất khí không có lực tương tác phân tử", "D. phân tử khí chuyển động chậm hơn"], "answer": "A", "explain": "Khoảng cách phân tử khí lớn nên dễ giảm khi bị ép; ở chất rắn, lỏng các phân tử đã xếp gần nhau, ép thêm thì lực đẩy tăng mạnh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đổ mồ hôi giúp cơ thể mát hơn vì:", "options": ["A. mồ hôi bay hơi thu nhiệt từ cơ thể", "B. mồ hôi toả nhiệt", "C. mồ hôi làm tăng nhiệt độ da", "D. mồ hôi ngăn cản bay hơi"], "answer": "A", "explain": "Mồ hôi bay hơi (lỏng → khí) thu nhiệt từ cơ thể làm cơ thể mát đi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nồi áp suất nấu thức ăn nhanh chín hơn nồi thường vì:", "options": ["A. áp suất cao làm nước sôi ở nhiệt độ cao hơn 100°C", "B. nồi dày hơn", "C. áp suất cao làm nước sôi ở nhiệt độ thấp hơn", "D. hơi không thoát ra được"], "answer": "A", "explain": "Trong nồi áp suất, áp suất cao nên nước sôi ở nhiệt độ cao hơn 100°C, thức ăn chín nhanh hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về các thể của chất:", "statements": ["a) Chất rắn có hình dạng và thể tích xác định.", "b) Chất lỏng có thể tích xác định, hình dạng theo bình chứa.", "c) Chất khí có hình dạng và thể tích xác định.", "d) Trong chất rắn, các phân tử dao động quanh vị trí cân bằng xác định."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: chất khí không có hình dạng và thể tích xác định. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đun một ấm nước trên bếp. Xét tính đúng, sai:", "statements": ["a) Nước nóng dần lên là do nhận nhiệt từ bếp.", "b) Khi nước sôi, bọt khí nổi lên là do nước bay hơi trong lòng chất lỏng.", "c) Trong lúc nước sôi mạnh, nhiệt độ nước tiếp tục tăng.", "d) Nắp ấm bị ướt là do hơi nước ngưng tụ."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: trong lúc sôi, nhiệt độ nước không đổi (nhiệt dùng để chuyển thể).", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Quá trình chuyển trực tiếp từ thể khí sang thể rắn gọi là sự ______.", "answer": "ngưng kết", "explain": "Khí chuyển trực tiếp sang rắn gọi là sự ngưng kết (ví dụ: tuyết, sương giá).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Nước đá nổi trên mặt nước chứng tỏ khối lượng riêng của nước đá ______ hơn khối lượng riêng của nước lỏng.", "answer": "nhỏ", "explain": "Vật nổi khi khối lượng riêng nhỏ hơn chất lỏng; nước đá nổi nên khối lượng riêng nhỏ hơn nước lỏng.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Khi khoảng cách giữa các phân tử rất nhỏ thì lực nào trội hơn?", "options": ["A. Lực đẩy", "B. Lực hút", "C. Lực ma sát", "D. Trọng lực"], "answer": "A", "explain": "Khoảng cách rất nhỏ thì lực đẩy trội hơn lực hút; khoảng cách lớn thì lực hút trội hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất ở thể rắn có:", "options": ["A. hình dạng và thể tích xác định", "B. hình dạng không xác định, thể tích xác định", "C. hình dạng và thể tích đều không xác định", "D. hình dạng xác định, thể tích không xác định"], "answer": "A", "explain": "Chất rắn giữ được hình dạng và thể tích xác định vì các phân tử xếp chặt chẽ, có trật tự.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nắp vung nồi cơm đang sôi có những giọt nước đọng lại. Đó là hiện tượng:", "options": ["A. ngưng tụ", "B. bay hơi", "C. nóng chảy", "D. thăng hoa"], "answer": "A", "explain": "Hơi nước bốc lên gặp nắp vung lạnh hơn thì ngưng tụ thành giọt nước (khí → lỏng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tuyết rơi vào mùa đông là kết quả của quá trình:", "options": ["A. ngưng kết", "B. ngưng tụ", "C. thăng hoa", "D. đông đặc"], "answer": "A", "explain": "Hơi nước trong không khí chuyển trực tiếp thành tinh thể băng (tuyết) là sự ngưng kết (khí → rắn).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ngồi trước quạt ta thấy mát hơn là vì quạt làm:", "options": ["A. tăng tốc độ bay hơi của mồ hôi trên da", "B. giảm nhiệt độ không khí", "C. tăng nhiệt độ cơ thể", "D. ngưng tụ hơi nước"], "answer": "A", "explain": "Gió làm mồ hôi bay hơi nhanh hơn; bay hơi thu nhiệt từ cơ thể nên ta thấy mát.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao nước trong chum sành (chum đất nung không tráng men) luôn mát hơn nước trong bình nhựa?", "options": ["A. Nước thấm qua thành chum bay hơi, thu nhiệt làm mát", "B. Chum sành cách nhiệt tốt", "C. Nhựa dẫn nhiệt tốt", "D. Chum sành toả nhiệt"], "answer": "A", "explain": "Một phần nước thấm qua thành chum rồi bay hơi; bay hơi thu nhiệt từ chum làm nước trong chum mát hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về sự nóng chảy và đông đặc:", "statements": ["a) Nóng chảy là quá trình chuyển từ thể rắn sang thể lỏng.", "b) Đông đặc là quá trình chuyển từ thể lỏng sang thể rắn.", "c) Khi nóng chảy, vật thu nhiệt từ môi trường.", "d) Khi đông đặc, vật thu nhiệt từ môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: nóng chảy là quá trình đi lên nên thu nhiệt. d) Sai: đông đặc toả nhiệt.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Buổi sáng mùa đông, lá cây có sương đọng; nếu trời rất lạnh còn có tuyết. Xét tính đúng, sai:", "statements": ["a) Sương đọng là do hơi nước ngưng tụ.", "b) Quá trình tạo sương toả nhiệt.", "c) Tuyết là do hơi nước ngưng kết.", "d) Quá trình tạo tuyết thu nhiệt từ môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: ngưng kết (khí → rắn) là quá trình toả nhiệt.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Khi nóng chảy, vật ______ nhiệt từ môi trường.", "answer": "thu", "explain": "Nóng chảy là quá trình đi lên (rắn → lỏng) nên thu nhiệt.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một quá trình chuyển thể làm vật lạnh đi (thu nhiệt) nhưng thể cuối cùng vẫn là thể rắn. Đó là sự ______.", "answer": "thăng hoa", "explain": "Trong các quá trình thu nhiệt (nóng chảy, bay hơi, thăng hoa), chỉ thăng hoa có thể cuối là thể rắn (rắn → khí).", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Chất ở thể lỏng có:", "options": ["A. thể tích xác định, hình dạng theo bình chứa", "B. hình dạng và thể tích xác định", "C. hình dạng và thể tích đều không xác định", "D. không có thể tích"], "answer": "A", "explain": "Chất lỏng có thể tích xác định nhưng hình dạng theo hình dạng của bình chứa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất ở thể khí:", "options": ["A. không có hình dạng và thể tích xác định", "B. có hình dạng và thể tích xác định", "C. có thể tích xác định", "D. có hình dạng xác định"], "answer": "A", "explain": "Chất khí chiếm toàn bộ thể tích bình chứa: không có hình dạng và thể tích xác định.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Băng khô (CO2 ở thể rắn) để ngoài không khí bốc khói mà không để lại vũng nước vì:", "options": ["A. CO2 thăng hoa ở nhiệt độ thường", "B. CO2 bay hơi", "C. CO2 nóng chảy rất nhanh", "D. CO2 ngưng tụ"], "answer": "A", "explain": "Ở nhiệt độ và áp suất thường, CO2 rắn chuyển trực tiếp thành khí (thăng hoa) nên không tạo vũng nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nóng chảy, vật thu nhiệt; khi bay hơi, chất lỏng cũng thu nhiệt. Vậy nhóm quá trình nào sau đây đều thu nhiệt?", "options": ["A. Nóng chảy, bay hơi, thăng hoa", "B. Đông đặc, ngưng tụ, ngưng kết", "C. Nóng chảy, đông đặc, bay hơi", "D. Ngưng tụ, bay hơi, thăng hoa"], "answer": "A", "explain": "Các quá trình đi lên theo chiều rắn → lỏng → khí (nóng chảy, bay hơi, thăng hoa) đều thu nhiệt.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nước đá nổi trên mặt nước vì:", "options": ["A. khối lượng riêng của nước đá nhỏ hơn của nước lỏng", "B. nước đá nhẹ hơn không khí", "C. lực đẩy phân tử", "D. nước đá không thấm nước"], "answer": "A", "explain": "Nước đá có khối lượng riêng nhỏ hơn nước lỏng (điều bất thường của nước) nên nổi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Giải thích nào sau đây đúng về việc phơi quần áo ngoài nắng mau khô hơn trong bóng râm?", "options": ["A. Nhiệt độ cao làm phân tử nước chuyển động nhanh hơn, bay hơi mạnh hơn", "B. Nắng làm quần áo co lại", "C. Ánh sáng phân huỷ nước", "D. Gió trong bóng râm yếu hơn"], "answer": "A", "explain": "Nhiệt độ càng cao, chuyển động nhiệt của phân tử càng nhanh, càng nhiều phân tử đủ động năng thoát ra → bay hơi nhanh hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về sự bay hơi và ngưng tụ:", "statements": ["a) Bay hơi là quá trình chuyển từ thể lỏng sang thể khí.", "b) Ngưng tụ là quá trình chuyển từ thể khí sang thể lỏng.", "c) Khi bay hơi, chất lỏng toả nhiệt.", "d) Sương đọng trên lá là do hơi nước ngưng tụ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: bay hơi thu nhiệt. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một thỏi sô-cô-la để trong túi áo khoác vào ngày nóng bị mềm ra. Xét tính đúng, sai:", "statements": ["a) Sô-cô-la mềm ra là sự nóng chảy.", "b) Quá trình này thu nhiệt từ cơ thể và môi trường.", "c) Sô-cô-la ở thể rắn có hình dạng xác định.", "d) Khi đã chảy lỏng, sô-cô-la vẫn giữ nguyên hình dạng thỏi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: ở thể lỏng, sô-cô-la có hình dạng theo vật chứa, không giữ hình thỏi.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Khi đông đặc, vật ______ nhiệt ra môi trường.", "answer": "toả", "explain": "Đông đặc là quá trình đi xuống (lỏng → rắn) nên toả nhiệt.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một quá trình chuyển thể toả nhiệt ra môi trường nhưng thể đầu là thể khí, thể cuối là thể rắn. Đó là sự ______.", "answer": "ngưng kết", "explain": "Khí → rắn và toả nhiệt chính là sự ngưng kết.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Các phân tử trong chất rắn chuyển động:", "options": ["A. dao động quanh vị trí cân bằng xác định", "B. hỗn loạn mọi hướng", "C. thẳng đều", "D. đứng yên hoàn toàn"], "answer": "A", "explain": "Trong chất rắn, các phân tử chỉ dao động quanh vị trí cân bằng xác định, sắp xếp có trật tự.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quá trình chuyển từ thể rắn sang thể lỏng được gọi là sự:", "options": ["A. nóng chảy", "B. đông đặc", "C. bay hơi", "D. ngưng tụ"], "answer": "A", "explain": "Rắn chuyển sang lỏng gọi là sự nóng chảy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhóm quá trình nào sau đây đều toả nhiệt ra môi trường?", "options": ["A. Đông đặc, ngưng tụ, ngưng kết", "B. Nóng chảy, bay hơi, thăng hoa", "C. Đông đặc, nóng chảy, ngưng tụ", "D. Thăng hoa, ngưng kết, bay hơi"], "answer": "A", "explain": "Các quá trình đi xuống theo chiều khí → lỏng → rắn (đông đặc, ngưng tụ, ngưng kết) đều toả nhiệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quần áo ướt phơi ngoài nắng mau khô là nhờ quá trình:", "options": ["A. bay hơi", "B. ngưng tụ", "C. nóng chảy", "D. thăng hoa"], "answer": "A", "explain": "Nước trong quần áo bay hơi vào không khí; nắng nóng làm bay hơi nhanh hơn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hơi nước ở 100°C gây bỏng nặng hơn nước sôi ở 100°C vì khi chạm da, hơi nước còn:", "options": ["A. ngưng tụ và toả thêm nhiệt", "B. bay hơi tiếp", "C. nóng chảy", "D. thăng hoa"], "answer": "A", "explain": "Hơi nước ngưng tụ thành nước trên da và toả thêm nhiệt ngưng tụ nên gây bỏng nặng hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một cốc nước đá để trong phòng: đá tan dần và thành cốc ướt. Hai hiện tượng này lần lượt là:", "options": ["A. nóng chảy và ngưng tụ", "B. bay hơi và ngưng tụ", "C. nóng chảy và bay hơi", "D. thăng hoa và ngưng kết"], "answer": "A", "explain": "Đá tan (rắn → lỏng) là nóng chảy; thành cốc lạnh làm hơi nước trong không khí ngưng tụ (khí → lỏng) nên ướt.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về sự thăng hoa và ngưng kết:", "statements": ["a) Thăng hoa là quá trình chuyển trực tiếp từ thể rắn sang thể khí.", "b) Ngưng kết là quá trình chuyển trực tiếp từ thể khí sang thể rắn.", "c) Long não nhỏ dần trong tủ quần áo là do thăng hoa.", "d) Tuyết rơi là do hơi nước ngưng tụ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tuyết là do hơi nước ngưng kết (khí → rắn).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Mở nắp lọ cồn y tế một lúc rồi đậy lại, thấy mực cồn vơi đi. Xét tính đúng, sai:", "statements": ["a) Cồn vơi đi là do bay hơi.", "b) Bay hơi xảy ra ngay cả khi chưa đun nóng.", "c) Tay ta thấy mát khi bôi cồn vì cồn bay hơi thu nhiệt từ da.", "d) Đậy kín nắp lọ thì cồn không thể bay hơi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đậy kín chỉ làm chậm bay hơi (hơi cồn bão hoà trong lọ), không ngăn hoàn toàn.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Các phân tử cấu tạo nên vật chuyển động không ngừng, gọi là chuyển động ______.", "answer": "nhiệt", "explain": "Chuyển động không ngừng của phân tử gọi là chuyển động nhiệt.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Trên núi cao nước sôi ở nhiệt độ thấp hơn 100°C vì áp suất khí quyển ở đó ______ hơn ở đồng bằng.", "answer": "thấp", "explain": "Áp suất càng thấp thì nhiệt độ sôi càng thấp.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Quá trình chuyển từ thể lỏng sang thể rắn được gọi là sự:", "options": ["A. đông đặc", "B. nóng chảy", "C. ngưng tụ", "D. thăng hoa"], "answer": "A", "explain": "Lỏng chuyển sang rắn gọi là sự đông đặc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quá trình chuyển từ thể lỏng sang thể khí được gọi là sự:", "options": ["A. bay hơi", "B. ngưng tụ", "C. nóng chảy", "D. ngưng kết"], "answer": "A", "explain": "Lỏng chuyển sang khí gọi là sự bay hơi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sương mù buổi sáng hình thành là do:", "options": ["A. hơi nước trong không khí ngưng tụ", "B. nước bay hơi mạnh", "C. băng tan", "D. tuyết thăng hoa"], "answer": "A", "explain": "Ban đêm nhiệt độ thấp, hơi nước trong không khí ngưng tụ thành những giọt nước li ti lơ lửng (sương mù).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đá trong tủ lạnh để lâu ngày bị mòn dần dù nhiệt độ luôn dưới 0°C vì:", "options": ["A. nước đá thăng hoa", "B. nước đá nóng chảy", "C. nước đá bay hơi", "D. nước đá ngưng tụ"], "answer": "A", "explain": "Ở nhiệt độ thấp, nước đá vẫn chuyển dần thành hơi nước (thăng hoa) nên mòn dần.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi đun một ấm nước, nhiệt độ nước tăng dần rồi dừng ở 100°C (ở áp suất thường) trong lúc sôi vì:", "options": ["A. nhiệt cung cấp dùng để chuyển nước thành hơi", "B. ấm nhôm cách nhiệt", "C. nước không nhận thêm nhiệt", "D. nhiệt độ kế bị hỏng"], "answer": "A", "explain": "Trong lúc sôi (bay hơi trong lòng chất lỏng), nhiệt cung cấp dùng để chuyển thể nên nhiệt độ không đổi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi trời lạnh, ta hà hơi vào bàn tay để làm ấm vì hơi thở:", "options": ["A. ấm và khi ngưng tụ toả nhiệt ra tay", "B. làm bay hơi mồ hôi", "C. chứa nhiều oxygen", "D. làm tăng áp suất"], "answer": "A", "explain": "Hơi thở ấm; một phần hơi nước ngưng tụ trên da tay lạnh và toả nhiệt làm tay ấm lên.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về các ví dụ chuyển thể quen thuộc:", "statements": ["a) Băng tan thành nước là sự nóng chảy.", "b) Nước sôi thành hơi là sự bay hơi.", "c) Nước đóng thành băng là sự ngưng tụ.", "d) Hơi nước tạo thành giọt nước là sự ngưng tụ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: nước đóng thành băng là sự đông đặc. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho đồ thị nhiệt độ – thời gian khi đun nóng một chất: đoạn đầu dốc lên, đoạn giữa nằm ngang, đoạn cuối dốc lên. Xét tính đúng, sai:", "statements": ["a) Đoạn đầu dốc lên: chất rắn nóng dần lên.", "b) Đoạn nằm ngang: chất đang nóng chảy, nhiệt độ không đổi.", "c) Đoạn cuối dốc lên: chất lỏng nóng dần lên.", "d) Đoạn nằm ngang chứng tỏ đã ngừng đun."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vẫn đang đun, nhiệt cung cấp dùng để phá vỡ liên kết phân tử (chuyển thể) nên nhiệt độ không đổi.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Chất khí dễ nén vì khoảng cách giữa các phân tử khí rất ______.", "answer": "lớn", "explain": "Khoảng cách phân tử khí lớn hơn nhiều so với chất rắn, lỏng nên khí dễ nén.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Nồi áp suất nấu nhanh chín vì áp suất cao làm nước sôi ở nhiệt độ ______ hơn 100°C.", "answer": "cao", "explain": "Áp suất càng cao thì nhiệt độ sôi càng cao; thức ăn chín nhanh hơn ở nhiệt độ cao hơn.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Quá trình chuyển từ thể khí sang thể lỏng được gọi là sự:", "options": ["A. ngưng tụ", "B. bay hơi", "C. đông đặc", "D. thăng hoa"], "answer": "A", "explain": "Khí chuyển sang lỏng gọi là sự ngưng tụ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quá trình chuyển trực tiếp từ thể rắn sang thể khí được gọi là sự:", "options": ["A. thăng hoa", "B. ngưng kết", "C. bay hơi", "D. nóng chảy"], "answer": "A", "explain": "Rắn chuyển trực tiếp sang khí (không qua lỏng) gọi là sự thăng hoa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Các phân tử của nước đá, nước lỏng và hơi nước:", "options": ["A. đều là phân tử nước, chỉ khác cách sắp xếp và chuyển động", "B. là các loại phân tử khác nhau", "C. có khối lượng khác nhau", "D. nước đá không có phân tử"], "answer": "A", "explain": "Ba thể của nước đều cấu tạo từ phân tử H2O; khác nhau ở cách sắp xếp và chuyển động của phân tử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi đun nước sôi, bọt khí nổi lên từ đáy nồi là do:", "options": ["A. nước bay hơi cả trong lòng chất lỏng", "B. không khí lọt vào", "C. nước phân huỷ", "D. hơi nước ngưng tụ"], "answer": "A", "explain": "Sôi là sự bay hơi xảy ra trong lòng chất lỏng: bọt hơi nước hình thành và nổi lên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao chỉ bề mặt chất lỏng bị lạnh đi khi bay hơi?", "options": ["A. Phân tử có động năng lớn thoát ra, phân tử còn lại có động năng trung bình thấp hơn", "B. Không khí làm lạnh", "C. Chất lỏng toả nhiệt", "D. Ánh sáng làm lạnh"], "answer": "A", "explain": "Các phân tử nhanh (động năng lớn) ở bề mặt thoát ra thành hơi; các phân tử còn lại có động năng trung bình thấp hơn nên chất lỏng lạnh đi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao không nên chạm tay vào thành nồi áp suất đang xả hơi?", "options": ["A. Hơi nước nóng ngưng tụ trên da và toả nhiệt gây bỏng", "B. Nồi dẫn điện", "C. Hơi nước lạnh", "D. Áp suất làm đau tay"], "answer": "A", "explain": "Hơi nước ở nhiệt độ cao ngưng tụ trên da, vừa nóng vừa toả thêm nhiệt ngưng tụ nên gây bỏng nặng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về thu và toả nhiệt khi chuyển thể:", "statements": ["a) Nóng chảy, bay hơi, thăng hoa đều thu nhiệt.", "b) Đông đặc, ngưng tụ, ngưng kết đều toả nhiệt.", "c) Khi bay hơi, chất lỏng làm lạnh vật tiếp xúc với nó.", "d) Khi ngưng tụ, hơi nước làm nóng vật tiếp xúc."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn phát biểu đều đúng: quá trình đi lên thu nhiệt (làm lạnh), quá trình đi xuống toả nhiệt (làm nóng).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Nén khí trong xilanh bằng pittông, thấy xilanh nóng lên. Xét tính đúng, sai:", "statements": ["a) Khoảng cách giữa các phân tử khí giảm khi bị nén.", "b) Chất khí dễ bị nén vì khoảng cách phân tử lớn.", "c) Khi nén mạnh, lực đẩy phân tử xuất hiện chống lại.", "d) Chất khí không thể bị nén vì phân tử đứng yên."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phân tử khí chuyển động không ngừng và khoảng cách lớn nên khí dễ nén.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Trong chất rắn, các phân tử chỉ dao động quanh ______ cân bằng xác định.", "answer": "vị trí", "explain": "Phân tử chất rắn dao động quanh vị trí cân bằng xác định, sắp xếp có trật tự.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền cụm từ còn thiếu: Khi khoảng cách giữa các phân tử rất nhỏ, lực ______ trội hơn lực hút.", "answer": "đẩy", "explain": "Khoảng cách rất nhỏ thì lực đẩy trội hơn; đó là lí do chất rắn, lỏng khó nén.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Quá trình chuyển trực tiếp từ thể khí sang thể rắn được gọi là sự:", "options": ["A. ngưng kết", "B. thăng hoa", "C. ngưng tụ", "D. đông đặc"], "answer": "A", "explain": "Khí chuyển trực tiếp sang rắn gọi là sự ngưng kết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện tượng băng tan thành nước là quá trình:", "options": ["A. nóng chảy", "B. bay hơi", "C. ngưng tụ", "D. thăng hoa"], "answer": "A", "explain": "Băng (rắn) tan thành nước (lỏng) là sự nóng chảy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trời nồm, sàn nhà bị ướt dù không ai lau nước vì:", "options": ["A. hơi nước trong không khí gặp sàn lạnh thì ngưng tụ", "B. nước từ dưới đất thấm lên", "C. sàn nhà bay hơi", "D. mưa hắt vào"], "answer": "A", "explain": "Không khí ẩm gặp bề mặt sàn lạnh hơn thì hơi nước ngưng tụ thành giọt nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vào mùa đông, hơi thở của ta tạo thành làn khói trắng vì:", "options": ["A. hơi nước trong hơi thở gặp không khí lạnh thì ngưng tụ", "B. hơi thở bay hơi", "C. không khí thăng hoa", "D. hơi thở đóng băng"], "answer": "A", "explain": "Hơi nước ấm trong hơi thở gặp không khí lạnh ngưng tụ thành những giọt nước li ti trông như khói.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sắp xếp đúng thứ tự các quá trình khi đun nóng một cục nước đá từ -10°C đến khi thành hơi nước:", "options": ["A. Nóng lên – nóng chảy – nóng lên – bay hơi", "B. Nóng chảy – nóng lên – bay hơi – nóng lên", "C. Bay hơi – nóng chảy – nóng lên", "D. Nóng lên – bay hơi – nóng chảy"], "answer": "A", "explain": "Thứ tự đúng: đá nóng lên đến 0°C, nóng chảy thành nước 0°C, nước nóng lên đến 100°C, rồi bay hơi (sôi).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hiện tượng hơi nước đọng bên ngoài cốc nước đá KHÔNG xảy ra khi:", "options": ["A. không khí hoàn toàn khô (không có hơi nước)", "B. cốc làm bằng thuỷ tinh", "C. trời nóng", "D. cốc to"], "answer": "A", "explain": "Giọt nước ngoài thành cốc là do hơi nước trong không khí ngưng tụ; không khí khô thì không có hơi nước để ngưng tụ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về mô hình phân tử:", "statements": ["a) Khoảng cách giữa các phân tử chất khí lớn hơn nhiều so với chất rắn.", "b) Chất khí dễ nén vì khoảng cách phân tử lớn.", "c) Chất rắn khó nén vì các phân tử đã xếp gần nhau.", "d) Ép chất rắn lại thì lực hút phân tử tăng lên chống lại."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: khi ép, khoảng cách giảm nên lực đẩy (không phải lực hút) tăng mạnh chống lại.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "So sánh một viên bi sắt và một quả bóng bay cùng thể tích. Xét tính đúng, sai:", "statements": ["a) Bi sắt khó nén hơn bóng bay vì phân tử sắt xếp chặt hơn.", "b) Không khí trong bóng bay dễ nén vì khoảng cách phân tử lớn.", "c) Bi sắt ở thể rắn nên có hình dạng xác định.", "d) Không khí trong bóng bay ở thể lỏng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: không khí ở thể khí.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Sương đọng trên lá cây là do hơi nước trong không khí ______.", "answer": "ngưng tụ", "explain": "Hơi nước gặp lá lạnh thì ngưng tụ (khí → lỏng) thành giọt sương.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Sôi là sự bay hơi xảy ra trong ______ chất lỏng, tạo thành các bọt khí nổi lên.", "answer": "lòng", "explain": "Sôi khác bay hơi bề mặt ở chỗ nó xảy ra trong lòng chất lỏng.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hiện tượng sương đọng trên lá cây vào buổi sáng là quá trình:", "options": ["A. ngưng tụ", "B. bay hơi", "C. nóng chảy", "D. thăng hoa"], "answer": "A", "explain": "Hơi nước trong không khí gặp lạnh ngưng tụ thành giọt nước đọng trên lá.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi nóng chảy, vật:", "options": ["A. thu nhiệt từ môi trường", "B. toả nhiệt ra môi trường", "C. không trao đổi nhiệt", "D. vừa thu vừa toả nhiệt"], "answer": "A", "explain": "Các quá trình đi lên theo chiều rắn → lỏng → khí (nóng chảy, bay hơi, thăng hoa) đều thu nhiệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muối ăn để lâu ngày bị chảy nước, vón cục là do muối:", "options": ["A. hút hơi nước trong không khí (hút ẩm)", "B. bị nóng chảy", "C. bị thăng hoa", "D. bị bay hơi"], "answer": "A", "explain": "Muối ăn hút hơi nước trong không khí nên bị ướt, chảy nước và vón cục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi làm đá trong tủ lạnh, nước trong khay chuyển thành đá. Quá trình này:", "options": ["A. toả nhiệt ra môi trường trong tủ", "B. thu nhiệt từ môi trường", "C. không trao đổi nhiệt", "D. làm tủ lạnh nóng lên"], "answer": "A", "explain": "Đông đặc (lỏng → rắn) là quá trình toả nhiệt; tủ lạnh lấy nhiệt này thải ra ngoài.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Muốn làm lạnh nhanh một chai nước, người ta bọc khăn ướt quanh chai vì:", "options": ["A. nước trong khăn bay hơi thu nhiệt từ chai", "B. khăn cách nhiệt", "C. khăn làm tăng nhiệt độ", "D. nước thấm vào chai"], "answer": "A", "explain": "Nước trong khăn bay hơi thu nhiệt từ chai nước làm chai lạnh nhanh hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đun nóng một thanh sắt, thanh dài ra một chút vì:", "options": ["A. phân tử dao động nhiệt mạnh hơn, khoảng cách trung bình tăng", "B. số phân tử tăng thêm", "C. phân tử nở to ra", "D. sắt nóng chảy"], "answer": "A", "explain": "Nhiệt độ tăng → phân tử dao động nhiệt mạnh hơn → khoảng cách trung bình giữa các phân tử tăng → vật nở ra.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về sự bay hơi và sự sôi:", "statements": ["a) Sự bay hơi xảy ra ở mọi nhiệt độ.", "b) Sự sôi chỉ xảy ra ở nhiệt độ sôi.", "c) Trong lúc sôi, nhiệt độ của chất lỏng không đổi.", "d) Sôi là sự bay hơi chỉ xảy ra trên bề mặt chất lỏng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: sôi là sự bay hơi xảy ra trong lòng chất lỏng (tạo bọt khí), không chỉ trên bề mặt.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Nhỏ vài giọt nước lên chảo nóng, giọt nước lăn tròn rồi biến mất. Xét tính đúng, sai:", "statements": ["a) Giọt nước biến mất là do bay hơi rất nhanh.", "b) Quá trình này thu nhiệt từ chảo nóng.", "c) Giọt nước lăn tròn vì lớp hơi nước nâng giọt nước lên.", "d) Giọt nước biến mất là do ngưng tụ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng (hiệu ứng Leidenfrost ở mức định tính). d) Sai: đó là bay hơi, không phải ngưng tụ.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Tuyết rơi là do hơi nước trong không khí ______ thành tinh thể băng.", "answer": "ngưng kết", "explain": "Hơi nước chuyển trực tiếp thành tinh thể băng (khí → rắn) là sự ngưng kết.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Hơi nước ở 100°C gây bỏng nặng hơn nước sôi 100°C vì hơi nước còn ______ trên da và toả thêm nhiệt.", "answer": "ngưng tụ", "explain": "Hơi nước ngưng tụ (khí → lỏng) trên da và toả thêm nhiệt ngưng tụ.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Khi đông đặc, vật:", "options": ["A. toả nhiệt ra môi trường", "B. thu nhiệt từ môi trường", "C. không trao đổi nhiệt", "D. nhiệt độ luôn tăng"], "answer": "A", "explain": "Các quá trình đi xuống (đông đặc, ngưng tụ, ngưng kết) đều toả nhiệt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi bay hơi, chất lỏng:", "options": ["A. thu nhiệt", "B. toả nhiệt", "C. giữ nguyên nhiệt độ", "D. đông đặc lại"], "answer": "A", "explain": "Bay hơi là quá trình đi lên (lỏng → khí) nên thu nhiệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiện tượng nào sau đây KHÔNG phải là sự chuyển thể?", "options": ["A. Sắt bị gỉ", "B. Băng tan", "C. Nước sôi", "D. Sương đọng"], "answer": "A", "explain": "Sắt bị gỉ là phản ứng hoá học; ba hiện tượng còn lại đều là chuyển thể (nóng chảy, bay hơi, ngưng tụ).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nước đá đang tan ở 0°C, tiếp tục đun nhẹ thì nhiệt độ của hỗn hợp nước đá:", "options": ["A. vẫn giữ 0°C cho đến khi đá tan hết", "B. tăng dần lên", "C. giảm xuống", "D. tăng vọt lên 100°C"], "answer": "A", "explain": "Trong quá trình chuyển thể (nóng chảy), nhiệt cung cấp dùng để phá vỡ liên kết phân tử nên nhiệt độ không đổi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hiện tượng nào sau đây vừa là chuyển thể vừa làm môi trường xung quanh lạnh đi?", "options": ["A. Cồn y tế bôi lên da bay hơi", "B. Nước đóng băng", "C. Sương đọng", "D. Tuyết rơi"], "answer": "A", "explain": "Cồn bay hơi (lỏng → khí) thu nhiệt từ da làm da mát lạnh; ba hiện tượng còn lại đều toả nhiệt.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong các hiện tượng sau, hiện tượng nào thu nhiệt từ môi trường NHIỀU NHẤT theo nghĩa làm lạnh môi trường?", "options": ["A. Nước bay hơi", "B. Nước đông đặc", "C. Hơi nước ngưng tụ", "D. Nước đóng băng"], "answer": "A", "explain": "Bay hơi thu nhiệt từ môi trường (làm lạnh); ba hiện tượng còn lại đều toả nhiệt ra môi trường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về ví dụ chuyển thể:", "statements": ["a) Phơi quần áo ướt cho khô là nhờ sự bay hơi.", "b) Nồi cơm sôi bốc hơi là sự bay hơi.", "c) Băng khô bốc khói là sự nóng chảy.", "d) Sương mù buổi sáng là do hơi nước ngưng tụ."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: băng khô (CO2 rắn) bốc khói là sự thăng hoa.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Vào ngày nồm, sàn nhà ướt; dùng điều hoà một lúc sàn khô dần. Xét tính đúng, sai:", "statements": ["a) Sàn ướt lúc đầu do hơi nước trong không khí ngưng tụ.", "b) Ngưng tụ là quá trình toả nhiệt.", "c) Điều hoà làm giảm độ ẩm không khí nên sàn khô dần.", "d) Sàn khô là do nước bay hơi."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn phát biểu đều đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Khi bay hơi, chất lỏng thu nhiệt nên có tác dụng làm ______.", "answer": "lạnh", "explain": "Bay hơi thu nhiệt từ vật tiếp xúc nên làm lạnh (ví dụ: mồ hôi bay hơi làm mát cơ thể).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Muốn bảo quản thực phẩm lâu, người ta thường làm ______ thực phẩm để ức chế chuyển động nhiệt của phân tử.", "answer": "lạnh", "explain": "Nhiệt độ thấp làm chuyển động nhiệt của phân tử chậm lại, vi khuẩn khó phát triển (ứng dụng của chuyển động nhiệt).", "points": 0.5}]}]}
