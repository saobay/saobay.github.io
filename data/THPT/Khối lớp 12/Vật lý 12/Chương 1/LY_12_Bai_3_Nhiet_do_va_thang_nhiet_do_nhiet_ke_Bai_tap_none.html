s": ["a) Nên dùng cặp nhiệt điện để đo nhiệt độ này.", "b) Nhiệt kế thuỷ ngân thông thường không đo được.", "c) Nhiệt độ này theo Kelvin là $1473$ K.", "d) Nhiệt kế rượu đo được nhiệt độ này."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: $1200 + 273 = 1473$ K. d) Sai: vượt xa giới hạn nhiệt kế rượu.", "points": 1}, {"type": "short", "level": "VD", "q": "Đổi $260$ K ra độ C (chỉ ghi số, có dấu âm nếu cần).", "answer": "-13", "explain": "$t = 260 - 273 = -13^{\\circ}$C.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đổi $273$ K ra độ C (chỉ ghi số, có dấu âm nếu cần).", "answer": "0", "explain": "$t = 273 - 273 = 0^{\\circ}$C.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khi dùng nhiệt kế, cần:", "options": ["A. chọn nhiệt kế có giới hạn đo và độ chia nhỏ nhất phù hợp", "B. dùng nhiệt kế bất kì", "C. đọc kết quả ngay khi vừa nhúng", "D. lắc mạnh nhiệt kế trước khi đo"], "answer": "A", "explain": "Phải chọn nhiệt kế có giới hạn đo phù hợp, đặt bầu nhiệt kế tiếp xúc tốt và chờ ổn định rồi mới đọc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kí hiệu đúng của đơn vị nhiệt độ tuyệt đối là:", "options": ["A. K", "B. $^{\\circ}$K", "C. $^{\\circ}$C", "D. $^{\\circ}$F"], "answer": "A", "explain": "Đơn vị Kelvin kí hiệu là K, không viết $^{\\circ}$K.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các công thức vật lí về chất khí, nhiệt độ phải được tính theo thang:", "options": ["A. Kelvin", "B. Celsius", "C. Fahrenheit", "D. thang nào cũng được"], "answer": "A", "explain": "Các định luật chất khí (Charles, phương trình trạng thái...) yêu cầu nhiệt độ tuyệt đối (Kelvin).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhiệt độ tăng từ $20^{\\circ}$C lên $60^{\\circ}$C. Độ tăng nhiệt độ theo thang Kelvin là:", "options": ["A. $40$ K", "B. $293$ K", "C. $333$ K", "D. $313$ K"], "answer": "A", "explain": "$\\Delta t = 60 - 20 = 40^{\\circ}$C nên $\\Delta T = 40$ K (không cần đổi từng giá trị).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhiệt độ $-8^{\\circ}$C ứng với bao nhiêu Kelvin?", "options": ["A. 265 K", "B. 281 K", "C. 285 K", "D. 245 K"], "answer": "A", "explain": "$T = -8 + 273 = 265$ K.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhiệt độ tuyệt đối của một lượng khí tăng gấp đôi, từ $-50^{\\circ}$C lên đến bao nhiêu độ C?", "options": ["A. 173 $^{\\circ}$C", "B. -100 $^{\\circ}$C", "C. 273 $^{\\circ}$C", "D. 73 $^{\\circ}$C"], "answer": "A", "explain": "$T_1 = -50 + 273 = 223$ K. Nhiệt độ tuyệt đối tăng gấp đôi: $T_2 = 2T_1 = 446$ K. Đổi ra Celsius: $t_2 = 446 - 273 = 173^{\\circ}$C.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về nhiệt độ:", "statements": ["a) Nhiệt độ là số đo mức độ nóng, lạnh của vật.", "b) Nhiệt độ càng cao, phân tử chuyển động nhiệt càng nhanh.", "c) Hai vật có cùng nhiệt độ thì phân tử chuyển động nhanh như nhau.", "d) Nhiệt độ cho biết vật nặng hay nhẹ."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c) Sai: còn phụ thuộc loại phân tử. d) Sai: nhiệt độ không liên quan khối lượng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai vật A ($30^{\\circ}$C) và B ($86^{\\circ}$F, tức $30^{\\circ}$C). Xét tính đúng, sai:", "statements": ["a) Hai vật có nhiệt độ bằng nhau.", "b) Nhiệt độ hai vật theo Kelvin đều là $303$ K.", "c) Vật B nóng hơn vật A.", "d) Thang Fahrenheit cũng là một thang đo nhiệt độ."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng: $86^{\\circ}$F $= 30^{\\circ}$C. c) Sai: bằng nhau.", "points": 1}, {"type": "short", "level": "VD", "q": "Đổi $120$ K ra độ C (chỉ ghi số, có dấu âm nếu cần).", "answer": "-153", "explain": "$t = 120 - 273 = -153^{\\circ}$C.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đổi $290$ K ra độ C (chỉ ghi số, có dấu âm nếu cần).", "answer": "17", "explain": "$t = 290 - 273 = 17^{\\circ}$C.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Đổi $-273^{\\circ}$C ra thang Kelvin.", "options": ["A. 0 K", "B. 10 K", "C. -10 K", "D. 546 K"], "answer": "A", "explain": "$T(K) = t(^{\\circ}C) + 273 = -273 + 273 = 0$ K.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đổi $200^{\\circ}$C ra thang Kelvin.", "options": ["A. 483 K", "B. 473 K", "C. 463 K", "D. 73 K"], "answer": "B", "explain": "$T(K) = t(^{\\circ}C) + 273 = 200 + 273 = 473$ K.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đổi $50$ K ra thang Celsius.", "options": ["A. -223 $^{\\circ}$C", "B. -213 $^{\\circ}$C", "C. -233 $^{\\circ}$C", "D. -123 $^{\\circ}$C"], "answer": "A", "explain": "$t(^{\\circ}C) = T(K) - 273 = 50 - 273 = -223^{\\circ}$C.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đổi $200$ K ra thang Celsius.", "options": ["A. -63 $^{\\circ}$C", "B. -73 $^{\\circ}$C", "C. -83 $^{\\circ}$C", "D. 27 $^{\\circ}$C"], "answer": "B", "explain": "$t(^{\\circ}C) = T(K) - 273 = 200 - 273 = -73^{\\circ}$C.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhiệt độ của một vật tăng từ $15^{\\circ}$C lên $40^{\\circ}$C. Độ tăng nhiệt độ theo thang Kelvin bằng bao nhiêu?", "options": ["A. 298 K", "B. 25 K", "C. 288 K", "D. 313 K"], "answer": "B", "explain": "$\\Delta t = 40 - 15 = 25^{\\circ}$C. Vì mỗi độ chia hai thang bằng nhau nên $\\Delta T = 25$ K.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhiệt độ của một vật tăng từ $25^{\\circ}$C lên $45^{\\circ}$C. Độ tăng nhiệt độ theo thang Kelvin bằng bao nhiêu?", "options": ["A. 293 K", "B. 20 K", "C. 298 K", "D. 318 K"], "answer": "B", "explain": "$\\Delta t = 45 - 25 = 20^{\\circ}$C. Vì mỗi độ chia hai thang bằng nhau nên $\\Delta T = 20$ K.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Một nhiệt kế thuỷ ngân có giới hạn đo $-10^{\\circ}$C đến $110^{\\circ}$C. Xét tính đúng, sai:", "statements": ["a) Nhiệt kế này đo được nhiệt độ nước đá đang tan.", "b) Nhiệt kế này đo được nhiệt độ nước đang sôi.",
