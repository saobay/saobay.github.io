type": "short", "level": "VD", "q": "Đường sức từ của dòng điện thẳng dài có dạng gì?", "answer": "đường tròn", "explain": "Là các đường tròn đồng tâm trong mặt phẳng vuông góc với dây.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Quy tắc nào xác định chiều đường sức từ của dòng điện? (mức vận dụng cao)", "answer": "nắm tay phải", "explain": "Dùng quy tắc nắm tay phải.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Cực Bắc của kim nam châm luôn chỉ về hướng:", "options": ["A. Bắc địa lí (gần đúng)", "B. Nam địa lí", "C. Đông", "D. Tây"], "answer": "A", "explain": "Cực N của kim la bàn chỉ hướng Bắc địa lí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ trường tồn tại trong khoảng không gian:", "options": ["A. xung quanh nam châm và dòng điện", "B. chỉ trong nam châm", "C. chỉ trong dây dẫn", "D. chỉ ở hai cực từ"], "answer": "A", "explain": "Từ trường tồn tại trong không gian xung quanh nam châm và dòng điện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn làm tăng từ trường của ống dây, có thể:", "options": ["A. tăng cường độ dòng điện hoặc tăng số vòng dây", "B. giảm cường độ dòng điện", "C. giảm số vòng dây", "D. rút lõi sắt ra"], "answer": "A", "explain": "$B$ trong lòng ống dây tỉ lệ với $I$ và số vòng dây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim la bàn đặt gần dây dẫn thẳng có dòng điện bị lệch vì:", "options": ["A. từ trường của dòng điện tác dụng lực từ lên kim", "B. dòng điện hút kim", "C. dây dẫn nóng lên", "D. trọng lực"], "answer": "A", "explain": "Từ trường của dòng điện tác dụng lên kim nam châm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hình vẽ đường sức từ có hai vùng: điểm P (đường sức mau) và điểm Q (đường sức thưa). So sánh độ lớn cảm ứng từ tại hai vùng.", "options": ["A. cảm ứng từ tại điểm P nhỏ hơn tại điểm Q", "B. cảm ứng từ tại điểm P lớn hơn tại điểm Q", "C. cảm ứng từ tại hai vùng bằng nhau", "D. không so sánh được"], "answer": "B", "explain": "Nơi đường sức từ càng mau thì từ trường càng mạnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một ống dây có dòng điện, khi nhìn từ một đầu thấy dòng điện chạy cùng chiều kim đồng hồ. Đầu đó là cực: (vận dụng cao)", "options": ["A. Bắc (N)", "B. Nam (S)", "C. không xác định", "D. cả hai cực"], "answer": "B", "explain": "Nhìn từ một đầu thấy dòng điện ngược chiều kim đồng hồ thì đầu đó là cực N, cùng chiều kim đồng hồ là cực S. Đáp án: cực Nam (S).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về bản chất từ trường:", "statements": ["a) Từ trường là một dạng vật chất.", "b) Từ trường không tác dụng lực lên điện tích đứng yên.", "c) Từ trường tác dụng lực lên điện tích chuyển động.", "d) Từ trường tác dụng lực lên mọi vật."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đặt hai dây dẫn thẳng song song có dòng điện cùng chiều. Xét tính đúng, sai:", "statements": ["a) Chúng hút nhau.", "b) Lực tương tác là lực từ.", "c) Nếu một dòng đổi chiều thì chúng đẩy nhau.", "d) Hai dây không tương tác với nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Đơn vị của cảm ứng từ là gì?", "answer": "tesla", "explain": "Đơn vị cảm ứng từ là tesla (T).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhìn từ một đầu ống dây thấy dòng điện ngược chiều kim đồng hồ, đầu đó là cực gì? (mức vận dụng cao)", "answer": "cực Bắc", "explain": "Ngược chiều kim đồng hồ nhìn từ ngoài vào là cực N.", "points": 0.5}]}]}
