c từ", "B. mặt phẳng khung vuông góc với đường sức từ", "C. khung đặt trong từ trường mạnh", "D. khung có nhiều vòng dây"], "answer": "A", "explain": "$\\alpha = 90^{\\circ}$ thì $\\cos\\alpha = 0$: $\\Phi = 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ thông qua khung dây cực đại khi:", "options": ["A. mặt phẳng khung vuông góc với đường sức từ", "B. mặt phẳng khung song song với đường sức từ", "C. khung chuyển động nhanh", "D. từ trường yếu"], "answer": "A", "explain": "$\\alpha = 0^{\\circ}$ thì $\\cos\\alpha = 1$: $\\Phi$ cực đại.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đưa cực Bắc của một nam châm ra xa một vòng dây kín. Theo định luật Lenz, từ trường do dòng điện cảm ứng sinh ra có chiều như thế nào so với từ trường của nam châm?", "options": ["A. ngược chiều với từ trường của nam châm", "B. vuông góc với từ trường của nam châm", "C. bằng không", "D. cùng chiều với từ trường của nam châm"], "answer": "D", "explain": "Đưa cực Bắc ra xa làm từ thông giảm → từ trường cảm ứng cùng chiều để chống lại sự giảm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ biến thiên từ thông qua một khung dây tăng $6$ lần. Độ lớn suất điện động cảm ứng thay đổi thế nào? (vận dụng cao)", "options": ["A. giảm 6 lần", "B. không đổi", "C. tăng 36 lần", "D. tăng 6 lần"], "answer": "D", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t|$ tỉ lệ thuận với tốc độ biến thiên từ thông.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về định luật Lenz:", "statements": ["a) Dòng điện cảm ứng chống lại sự biến thiên từ thông.", "b) Từ thông tăng → từ trường cảm ứng ngược chiều từ trường ngoài.", "c) Từ thông giảm → từ trường cảm ứng cùng chiều từ trường ngoài.", "d) Dòng điện cảm ứng tăng cường sự biến thiên từ thông."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai về suất điện động cảm ứng:", "statements": ["a) $|e_c|$ càng lớn khi $\\Delta\\Phi$ càng lớn.", "b) $|e_c|$ càng lớn khi $\\Delta t$ càng nhỏ.", "c) $|e_c|$ không phụ thuộc vào số vòng dây.", "d) Tăng số vòng dây làm tăng $e_c$."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng ($\\Phi = NBS\\cos\\alpha$). c) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một khung dây có $40$ vòng, diện tích mỗi vòng $0,02$ m$^2$, đặt trong từ trường đều $B = 0,5$ T sao cho vectơ pháp tuyến của mặt phẳng khung hợp với vectơ cảm ứng từ góc $60^{\\circ}$. Tính từ thông qua khung (theo đơn vị Wb (chỉ ghi số)).", "answer": "0,2", "explain": "$\\Phi = NBS\\cos\\alpha = 40 \\times 0,5 \\times 0,02 \\times \\cos 60^{\\circ} = 0,2$ Wb.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Từ thông qua một khung dây biến thiên từ $0,5$ Wb đến $0,1$ Wb trong $0,2$ s. Tính độ lớn suất điện động cảm ứng (theo đơn vị V (chỉ ghi số)).", "answer": "2", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = |0,1 - 0,5|/0,2 = 2$ V.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Độ lớn suất điện động cảm ứng được tính bởi:", "options": ["A. $|e_c| = |\\Delta\\Phi/\\Delta t|$", "B. $e_c = \\Delta\\Phi \\times \\Delta t$", "C. $e_c = \\Phi/t$", "D. $e_c = NBS$"], "answer": "A", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t|$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ai là người phát hiện ra hiện tượng cảm ứng điện từ?", "options": ["A. Faraday", "B. Oersted", "C. Ampère", "D. Maxwell"], "answer": "A", "explain": "Faraday phát hiện năm 1831.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vòng dây diện tích $0,04$ m$^2$ đặt trong từ trường $B = 0,5$ T, mặt phẳng vòng dây vuông góc với đường sức từ. Từ thông qua vòng dây là:", "options": ["A. $0,02$ Wb", "B. $0,2$ Wb", "C. $0,002$ Wb", "D. $2$ Wb"], "answer": "A", "explain": "$\\Phi = 1 \\times 0,5 \\times 0,04 = 0,02$ Wb.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ thông qua khung tăng từ $0,2$ Wb lên $0,5$ Wb trong $0,25$ s. Suất điện động cảm ứng là:", "options": ["A. $1,2$ V", "B. $2$ V", "C. $0,3$ V", "D. $12$ V"], "answer": "A", "explain": "$|e_c| = 0,3/0,25 = 1,2$ V.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tốc độ biến thiên từ thông qua một khung dây tăng $4$ lần. Độ lớn suất điện động cảm ứng thay đổi thế nào?", "options": ["A. tăng 4 lần", "B. giảm 4 lần", "C. không đổi", "D. tăng 16 lần"], "answer": "A", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t|$ tỉ lệ thuận với tốc độ biến thiên từ thông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đưa cực Nam của một nam châm lại gần một vòng dây kín. Theo định luật Lenz, từ trường do dòng điện cảm ứng sinh ra có chiều như thế nào so với từ trường của nam châm? (vận dụng cao)", "options": ["A. ngược chiều với từ trường của nam châm", "B. cùng chiều với từ trường của nam châm", "C. vuông góc với từ trường của nam châm", "D. bằng không"], "answer": "A", "explain": "Đưa cực Nam lại gần làm từ thông tăng → từ trường cảm ứng ngược chiều để chống lại sự tăng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về định luật Faraday:", "statements": ["a) $|e_c| = |\\Delta\\Phi/\\Delta t|$.", "b) Suất điện động cảm ứng tỉ lệ với tốc độ biến thiên từ thông.", "c) Từ thông biến thiên càng nhanh, $e_c$ càng lớn.", "d) $e_c$ tỉ lệ nghịch với $\\Delta t$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $e_c$ tỉ lệ thuận với $\\Delta\\Phi$ và nghịch với $\\Delta t$, nhưng phát biểu thiếu $\\Delta\\Phi$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Khung $50$ vòng, $S = 0,02$ m$^2$, $B = 0,4$ T, góc $60^{\\circ}$. Xét tính đúng, sai:", "statements": ["a) $\\Phi = 50 \\times 0,4 \\times 0,02 \\times 0,5 = 0,2$ Wb.", "b) $\\cos 60^{\\circ} = 0,5$.", "c) Nếu góc $0^{\\circ}$ thì $\\Phi = 0,4$ Wb.", "d) $\\Phi = 0,4$ Wb."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một khung dây có $1$ vòng, diện tích mỗi vòng $0,04$ m$^2$, đặt trong từ trường đều $B = 0,5$ T sao cho vectơ pháp tuyến của mặt phẳng khung hợp với vectơ cảm ứng từ góc $0^{\\circ}$. Tính từ thông qua khung (theo đơn vị Wb (chỉ ghi số)).", "answer": "0,02", "explain": "$\\Phi = NBS\\cos\\alpha = 1 \\times 0,5 \\times 0,04 \\times \\cos 0^{\\circ} = 0,02$ Wb.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Từ thông qua một khung dây biến thiên từ $0,6$ Wb đến $0$ Wb trong $0,2$ s. Tính độ lớn suất điện động cảm ứng (theo đơn vị V (chỉ ghi số)).", "answer": "3", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = |0 - 0,6|/0,2 = 3$ V.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Một khung dây có $80$ vòng, diện tích mỗi vòng $0,02$ m$^2$, đặt trong từ trường đều $B = 0,25$ T sao cho vectơ pháp tuyến của mặt phẳng khung hợp với vectơ cảm ứng từ góc $0^{\\circ}$. Tính từ thông qua khung (theo đơn vị Wb).", "options": ["A. 0,4", "B. 0,8", "C. 0,2", "D. 0,5"], "answer": "A", "explain": "$\\Phi = NBS\\cos\\alpha = 80 \\times 0,25 \\times 0,02 \\times \\cos 0^{\\circ} = 0,4$ Wb.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một khung dây có $1$ vòng, diện tích mỗi vòng $0,04$ m$^2$, đặt trong từ trường đều $B = 0,5$ T sao cho vectơ pháp tuyến của mặt phẳng khung hợp với vectơ cảm ứng từ góc $0^{\\circ}$. Tính từ thông qua khung (theo đơn vị Wb).", "options": ["A. 0,04", "B. 0,02", "C. 0,12", "D. 0,22"], "answer": "B", "explain": "$\\Phi = NBS\\cos\\alpha = 1 \\times 0,5 \\times 0,04 \\times \\cos 0^{\\circ} = 0,02$ Wb.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ thông qua một khung dây biến thiên từ $0,5$ Wb đến $0,1$ Wb trong $0,2$ s. Tính độ lớn suất điện động cảm ứng (theo đơn vị V).", "options": ["A. 2", "B. 3", "C. 1", "D. 4"], "answer": "A", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = |0,1 - 0,5|/0,2 = 2$ V.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ thông qua một khung dây biến thiên từ $0,2$ Wb đến $0,5$ Wb trong $0,25$ s. Tính độ lớn suất điện động cảm ứng (theo đơn vị V).", "options": ["A. 2,2", "B. 1,2", "C. 0,2", "D. 2,4"], "answer": "B", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = |0,5 - 0,2|/0,25 = 1,2$ V.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đưa cực Nam của một nam châm lại gần một vòng dây kín. Theo định luật Lenz, từ trường do dòng điện cảm ứng sinh ra có chiều như thế nào so với từ trường của nam châm?", "options": ["A. cùng chiều với từ trường của nam châm", "B. ngược chiều với từ trường của nam châm", "C. vuông góc với từ trường của nam châm", "D. bằng không"], "answer": "B", "explain": "Đưa cực Nam lại gần làm từ thông tăng → từ trường cảm ứng ngược chiều để chống lại sự tăng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đưa cực Bắc của một nam châm ra xa một vòng dây kín. Theo định luật Lenz, từ trường do dòng điện cảm ứng sinh ra có chiều như thế nào so với từ trường của nam châm? (vận dụng cao)", "options": ["A. ngược chiều với từ trường của nam châm", "B. cùng chiều với từ trường của nam châm", "C. vuông góc với từ trường của nam châm", "D. bằng không"], "answer": "B", "explain": "Đưa cực Bắc ra xa làm từ thông giảm → từ trường cảm ứng cùng chiều để chống lại sự giảm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về nhà bác học Faraday:", "statements": ["a) Faraday phát hiện ra hiện tượng cảm ứng điện từ.", "b) Hiện tượng cảm ứng điện từ là cơ sở của máy phát điện.", "c) Dòng điện cảm ứng là dòng điện một chiều.", "d) Dòng điện cảm ứng có thể là dòng điện xoay chiều."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai về thí nghiệm Faraday:", "statements": ["a) Đưa nam châm vào cuộn dây: kim điện kế lệch.", "b) Rút nam châm ra: kim điện kế lệch theo chiều ngược lại.", "c) Giữ nam châm đứng yên: kim không lệch.", "d) Kim điện kế luôn lệch một chiều."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một khung dây có $200$ vòng, diện tích mỗi vòng $0,05$ m$^2$, đặt trong từ trường đều $B = 0,1$ T sao cho vectơ pháp tuyến của mặt phẳng khung hợp với vectơ cảm ứng từ góc $0^{\\circ}$. Tính từ thông qua khung (theo đơn vị Wb (chỉ ghi số)).", "answer": "1", "explain": "$\\Phi = NBS\\cos\\alpha = 200 \\times 0,1 \\times 0,05 \\times \\cos 0^{\\circ} = 1$ Wb.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Từ thông qua một khung dây biến thiên từ $0,9$ Wb đến $0,3$ Wb trong $0,2$ s. Tính độ lớn suất điện động cảm ứng (theo đơn vị V (chỉ ghi số)).", "answer": "3", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = |0,3 - 0,9|/0,2 = 3$ V.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Một khung dây có $200$ vòng, diện tích mỗi vòng $0,05$ m$^2$, đặt trong từ trường đều $B = 0,1$ T sao cho vectơ pháp tuyến của mặt phẳng khung hợp với vectơ cảm ứng từ góc $0^{\\circ}$. Tính từ thông qua khung (theo đơn vị Wb).", "options": ["A. 2", "B. 0,5", "C. 1", "D. 1,1"], "answer": "C", "explain": "$\\Phi = NBS\\cos\\alpha = 200 \\times 0,1 \\times 0,05 \\times \\cos 0^{\\circ} = 1$ Wb.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một khung dây có $120$ vòng, diện tích mỗi vòng $0,01$ m$^2$, đặt trong từ trường đều $B = 0,5$ T sao cho vectơ pháp tuyến của mặt phẳng khung hợp với vectơ cảm ứng từ góc $0^{\\circ}$. Tính từ thông qua khung (theo đơn vị Wb).", "options": ["A. 1,2", "B. 0,3", "C. 0,7", "D. 0,6"], "answer": "D", "explain": "$\\Phi = NBS\\cos\\alpha = 120 \\times 0,5 \\times 0,01 \\times \\cos 0^{\\circ} = 0,6$ Wb.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ thông qua một khung dây biến thiên từ $0,7$ Wb đến $0,2$ Wb trong $0,25$ s. Tính độ lớn suất điện động cảm ứng (theo đơn vị V).", "options": ["A. 3", "B. 1", "C. 2", "D. 4"], "answer": "C", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = |0,2 - 0,7|/0,25 = 2$ V.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ thông qua một khung dây biến thiên từ $0,4$ Wb đến $0$ Wb trong $0,2$ s. Tính độ lớn suất điện động cảm ứng (theo đơn vị V).", "options": ["A. 3", "B. 1", "C. 4", "D. 2"], "answer": "D", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = |0 - 0,4|/0,2 = 2$ V.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tốc độ biến thiên từ thông qua một khung dây tăng $6$ lần. Độ lớn suất điện động cảm ứng thay đổi thế nào?", "options": ["A. giảm 6 lần", "B. không đổi", "C. tăng 6 lần", "D. tăng 36 lần"], "answer": "C", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t|$ tỉ lệ thuận với tốc độ biến thiên từ thông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ biến thiên từ thông qua một khung dây tăng $5$ lần. Độ lớn suất điện động cảm ứng thay đổi thế nào? (vận dụng cao)", "options": ["A. giảm 5 lần", "B. không đổi", "C. tăng 5 lần", "D. tăng 25 lần"], "answer": "C", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t|$ tỉ lệ thuận với tốc độ biến thiên từ thông.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Một khung dây $100$ vòng, $S = 0,01$ m$^2$, $B = 0,2$ T, mặt phẳng khung vuông góc với đường sức từ. Xét tính đúng, sai:", "statements": ["a) $\\Phi = 100 \\times 0,2 \\times 0,01 = 0,2$ Wb.", "b) $\\alpha = 0^{\\circ}$.", "c) Nếu quay khung $90^{\\circ}$ thì $\\Phi = 0$.", "d) $\\Phi = 2$ Wb."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai về từ thông:", "statements": ["a) $\\Phi$ tỉ lệ thuận với $N$.", "b) $\\Phi$ tỉ lệ thuận với $B$.", "c) $\\Phi$ tỉ lệ thuận với $S$.", "d) $\\Phi$ tỉ lệ thuận với $\\alpha$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $\\Phi$ tỉ lệ với $\\cos\\alpha$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một khung dây có $150$ vòng, diện tích mỗi vòng $0,02$ m$^2$, đặt trong từ trường đều $B = 0,2$ T sao cho vectơ pháp tuyến của mặt phẳng khung hợp với vectơ cảm ứng từ góc $0^{\\circ}$. Tính từ thông qua khung (theo đơn vị Wb (chỉ ghi số)).", "answer": "0,6", "explain": "$\\Phi = NBS\\cos\\alpha = 150 \\times 0,2 \\times 0,02 \\times \\cos 0^{\\circ} = 0,6$ Wb.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Từ thông qua một khung dây biến thiên từ $0,8$ Wb đến $0,2$ Wb trong $0,3$ s. Tính độ lớn suất điện động cảm ứng (theo đơn vị V (chỉ ghi số)).", "answer": "2", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = |0,2 - 0,8|/0,3 = 2$ V.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Một khung dây có $40$ vòng, diện tích mỗi vòng $0,02$ m$^2$, đặt trong từ trường đều $B = 0,5$ T sao cho vectơ pháp tuyến của mặt phẳng khung hợp với vectơ cảm ứng từ góc $60^{\\circ}$. Tính từ thông qua khung (theo đơn vị Wb).", "options": ["A. 0,2", "B. 0,4", "C. 0,1", "D. 0,3"], "answer": "A", "explain": "$\\Phi = NBS\\cos\\alpha = 40 \\times 0,5 \\times 0,02 \\times \\cos 60^{\\circ} = 0,2$ Wb.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một khung dây có $100$ vòng, diện tích mỗi vòng $0,01$ m$^2$, đặt trong từ trường đều $B = 0,2$ T sao cho vectơ pháp tuyến của mặt phẳng khung hợp với vectơ cảm ứng từ góc $0^{\\circ}$. Tính từ thông qua khung (theo đơn vị Wb).", "options": ["A. 0,4", "B. 0,2", "C. 0,1", "D. 0,3"], "answer": "B", "explain": "$\\Phi = NBS\\cos\\alpha = 100 \\times 0,2 \\times 0,01 \\times \\cos 0^{\\circ} = 0,2$ Wb.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ thông qua một khung dây biến thiên từ $0,9$ Wb đến $0,3$ Wb trong $0,2$ s. Tính độ lớn suất điện động cảm ứng (theo đơn vị V).", "options": ["A. 3", "B. 4", "C. 2", "D. 6"], "answer": "A", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = |0,3 - 0,9|/0,2 = 3$ V.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ thông qua một khung dây biến thiên từ $1,2$ Wb đến $0,6$ Wb trong $0,3$ s. Tính độ lớn suất điện động cảm ứng (theo đơn vị V).", "options": ["A. 3", "B. 2", "C. 1", "D. 4"], "answer": "B", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = |0,6 - 1,2|/0,3 = 2$ V.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tốc độ biến thiên từ thông qua một khung dây tăng $2$ lần. Độ lớn suất điện động cảm ứng thay đổi thế nào?", "options": ["A. giảm 2 lần", "B. không đổi", "C. tăng 4 lần", "D. tăng 2 lần"], "answer": "D", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t|$ tỉ lệ thuận với tốc độ biến thiên từ thông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vòng dây kín đặt gần một ống dây. Khi dòng điện trong ống dây giảm dần, theo định luật Lenz, dòng điện cảm ứng trong vòng dây có tác dụng gì? (vận dụng cao)", "options": ["A. tăng cường sự giảm của từ thông", "B. không có tác dụng gì", "C. làm từ thông bằng không", "D. chống lại sự giảm của từ thông"], "answer": "D", "explain": "Định luật Lenz: dòng điện cảm ứng luôn chống lại sự biến thiên của từ thông.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về thí nghiệm với nam châm:", "statements": ["a) Đưa nam châm lại gần cuộn dây sinh ra dòng điện cảm ứng.", "b) Đưa nam châm ra xa cuộn dây sinh ra dòng điện cảm ứng.", "c) Giữ nam châm đứng yên trong cuộn dây không có dòng điện cảm ứng.", "d) Nam châm đứng yên vẫn sinh ra dòng điện cảm ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vòng dây $S = 0,04$ m$^2$, $B = 0,5$ T, mặt phẳng vuông góc với đường sức từ. Xét tính đúng, sai:", "statements": ["a) $\\Phi = 0,02$ Wb.", "b) Nếu $B$ tăng gấp đôi thì $\\Phi = 0,04$ Wb.", "c) Nếu quay vòng $90^{\\circ}$ thì $\\Phi = 0$.", "d) $\\Phi = 0,2$ Wb."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một khung dây có $120$ vòng,
