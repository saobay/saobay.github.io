, "explain": "Bảo toàn A: 20 = 16+A → A=4. Bảo toàn Z: 10 = 8+Z → Z=2: hạt alpha.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hoàn thành phản ứng hạt nhân: $^{2}_{1}$H + $^{3}_{1}$H → $^{4}_{2}$He + $^{A}_{Z}$X. Hạt X là gì? (vận dụng cao)", "options": ["A. $^{1}_{1}$H", "B. $^{1}_{0}$n", "C. $^{4}_{2}$He", "D. $^{0}_{1}$n"], "answer": "B", "explain": "Bảo toàn A: 5 = 4+A → A=1. Bảo toàn Z: 3 = 2+Z → Z=0: nơtron.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về Rutherford:", "statements": ["a) Rutherford thực hiện phản ứng hạt nhân nhân tạo đầu tiên.", "b) Phản ứng hạt nhân biến đổi nguyên tố này thành nguyên tố khác.", "c) Phản ứng hoá học không làm biến đổi hạt nhân.", "d) Phản ứng hoá học biến đổi hạt nhân."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai về ứng dụng:", "statements": ["a) Nhà máy điện hạt nhân dùng năng lượng phân hạch.", "b) Tàu ngầm hạt nhân dùng năng lượng phân hạch.", "c) Y tế dùng đồng vị phóng xạ để chẩn đoán.", "d) Năng lượng hạt nhân không có ứng dụng hoà bình."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một hạt nhân có độ hụt khối $1,5$ u. Tính năng lượng liên kết của hạt nhân (theo đơn vị MeV (chỉ ghi số)).", "answer": "1397,25", "explain": "$E_{lk} = \\Delta m \\times 931,5 = 1,5 \\times 931,5 = 1397,25$ MeV.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một hạt nhân có số khối $4$, năng lượng liên kết $931,5$ MeV. Tính năng lượng liên kết riêng (theo đơn vị MeV/nuclon, làm tròn đến 2 chữ số thập phân (chỉ ghi số)). (vận dụng cao)", "answer": "232,88", "explain": "$E_{lkr} = E_{lk}/A = 931,5/4 \\approx 232,88$ MeV/nuclon.", "points": 0.5}]}]}
