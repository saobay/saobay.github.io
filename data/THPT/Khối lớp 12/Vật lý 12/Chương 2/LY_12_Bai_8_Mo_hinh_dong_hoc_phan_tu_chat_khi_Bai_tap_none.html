 thể tích bình giảm", "D. khối lượng khí giảm"], "answer": "A", "explain": "Làm lạnh → phân tử chuyển động chậm lại → va chạm yếu và ít hơn → áp suất giảm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao quả bóng bàn bị móp có thể phồng lại khi nhúng vào nước nóng?", "options": ["A. Khí trong bóng nóng lên, áp suất tăng đẩy vỏ bóng phồng ra", "B. Vỏ bóng nở vì nhiệt", "C. Nước thấm vào bóng", "D. Không khí lọt vào"], "answer": "A", "explain": "Nhiệt độ tăng → áp suất khí trong bóng tăng → đẩy chỗ móp phồng ra.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai bình kín cùng thể tích, cùng nhiệt độ, bình A chứa $2$ mol khí, bình B chứa $1$ mol khí. Áp suất bình A so với bình B:", "options": ["A. gấp đôi", "B. bằng nhau", "C. một nửa", "D. gấp bốn"], "answer": "A", "explain": "Số phân tử bình A gấp đôi → mật độ phân tử gấp đôi → áp suất gấp đôi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai bình thông nhau chứa khí, một bình được đun nóng, bình kia giữ nguyên. Hiện tượng xảy ra là:", "options": ["A. khí từ bình nóng dồn sang bình lạnh đến khi áp suất cân bằng", "B. khí không di chuyển", "C. khí từ bình lạnh dồn sang bình nóng", "D. cả hai bình nổ"], "answer": "A", "explain": "Bình nóng áp suất có xu hướng tăng → khí dồn sang bình lạnh đến khi áp suất hai bình bằng nhau.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về áp suất chất khí:", "statements": ["a) Áp suất do va chạm của phân tử lên thành bình gây ra.", "b) Mật độ phân tử càng lớn thì áp suất càng lớn.", "c) Nhiệt độ càng cao thì áp suất càng lớn (thể tích không đổi).", "d) Áp suất chất khí do trọng lượng của khí gây ra."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai bình A, B cùng thể tích, cùng nhiệt độ; A chứa $2$ mol, B chứa $1$ mol khí. Xét tính đúng, sai:", "statements": ["a) Mật độ phân tử bình A gấp đôi bình B.", "b) Áp suất bình A gấp đôi bình B.", "c) Phân tử hai bình chuyển động nhanh như nhau.", "d) Áp suất hai bình bằng nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: cùng nhiệt độ nên tốc độ trung bình như nhau. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Va chạm của phân tử khí là va chạm ______.", "answer": "đàn hồi", "explain": "Va chạm phân tử khí được coi là va chạm đàn hồi.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một bình kín chứa khí ở $27^{\\circ}$C. Muốn áp suất tăng gấp đôi phải đun đến ______ $^{\\circ}$C (chỉ ghi số).", "answer": "327", "explain": "$T_1 = 300$ K; $T_2 = 2 \\times 300 = 600$ K $= 327^{\\circ}$C.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Áp suất của chất khí lên thành bình là do:", "options": ["A. va chạm của các phân tử khí lên thành bình", "B. trọng lượng của chất khí", "C. lực hút giữa các phân tử", "D. sự nở vì nhiệt của bình"], "answer": "A", "explain": "Áp suất chất khí do va chạm của phân tử khí lên thành bình gây ra.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiệt độ của chất khí càng cao thì các phân tử khí chuyển động:", "options": ["A. càng nhanh", "B. càng chậm", "C. ngừng chuyển động", "D. theo quỹ đạo tròn"], "answer": "A", "explain": "Nhiệt độ càng cao, chuyển động nhiệt của phân tử càng nhanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các điều kiện sau, điều kiện nào khí oxygen gần với khí lí tưởng nhất?", "options": ["A. Áp suất thấp, nhiệt độ cao", "B. Áp suất cao, nhiệt độ thấp", "C. Gần nhiệt độ hoá lỏng", "D. Áp suất khí quyển, nhiệt độ thấp"], "answer": "A", "explain": "Khí thực gần với khí lí tưởng nhất ở áp suất thấp và nhiệt độ cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nén một lượng khí (nhiệt độ không đổi) thì khoảng cách trung bình giữa các phân tử:", "options": ["A. giảm", "B. tăng", "C. không đổi", "D. bằng không"], "answer": "A", "explain": "Nén khí làm thể tích giảm → các phân tử ở gần nhau hơn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một lượng khí trong bình kín, nhiệt độ tuyệt đối tăng gấp đôi. Áp suất của khí:", "options": ["A. tăng gấp đôi", "B. giảm một nửa", "C. không đổi", "D. tăng gấp bốn"], "answer": "A", "explain": "Thể tích không đổi, nhiệt độ tuyệt đối tăng gấp đôi thì áp suất tăng gấp đôi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một quả bóng bay bơm căng ở mặt đất rồi thả lên cao. Bóng có thể bị vỡ vì:", "options": ["A. áp suất ngoài giảm, chênh lệch áp suất tăng làm bóng giãn quá mức", "B. nhiệt độ tăng", "C. tia tử ngoại", "D. chim mổ"], "answer": "A", "explain": "Lên cao áp suất khí quyển giảm → khí trong bóng giãn nở → bóng căng quá mức có thể vỡ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về đơn vị áp suất:", "statements": ["a) Đơn vị áp suất trong hệ SI là paxcan (Pa).", "b) $1$ Pa $= 1$ N/m$^2$.", "c) Áp suất khí quyển khoảng $10^5$ Pa.", "d) Đơn vị áp suất là jun."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: jun là đơn vị năng lượng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xì bớt một nửa khối lượng khí trong bình kín (nhiệt độ không đổi). Xét tính đúng, sai:", "statements": ["a) Số phân tử còn một nửa.", "b) Mật độ phân tử còn một nửa.", "c) Áp suất còn một nửa.", "d) Nhiệt độ của khí giảm một nửa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhiệt độ không đổi.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Khí lí tưởng là khí tuân theo ______ mô hình động học phân tử.", "answer": "đúng", "explain": "Khí lí tưởng tuân theo đúng mô hình động học phân tử và các định luật chất khí.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Hai bình cùng thể tích, cùng nhiệt độ; bình có số phân tử gấp đôi thì áp suất gấp ______ lần.", "answer": "2", "explain": "Áp suất tỉ lệ với mật độ phân tử nên gấp đôi.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Đơn vị của áp suất trong hệ SI là:", "options": ["A. paxcan (Pa)", "B. jun (J)", "C. oát (W)", "D. niutơn (N)"], "answer": "A", "explain": "Áp suất có đơn vị paxcan (Pa); $1$ Pa $= 1$ N/m$^2$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mật độ phân tử khí càng lớn thì áp suất của khí:", "options": ["A. càng lớn", "B. càng nhỏ", "C. không đổi", "D. bằng không"], "answer": "A", "explain": "Mật độ phân tử lớn → nhiều va chạm lên thành bình hơn → áp suất lớn hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thả một quả bóng bay lên cao, bóng nở to dần vì:", "options": ["A. áp suất khí quyển giảm, khí trong bóng giãn nở", "B. nhiệt độ tăng", "C. có thêm khí lọt vào", "D. cao su co lại"], "answer": "A", "explain": "Lên cao áp suất ngoài giảm, khí trong bóng giãn nở làm bóng to ra.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao khi đun nóng bình kín chứa khí, van an toàn có thể bật ra?", "options": ["A. Áp suất khí tăng vượt giới hạn", "B. Bình bị nóng chảy", "C. Khí thoát qua thành bình", "D. Van bị gỉ"], "answer": "A", "explain": "Đun nóng → áp suất tăng; van an toàn bật ra để xả bớt khí, tránh nổ bình.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Xì bớt một nửa số phân tử khí trong bình kín (nhiệt độ không đổi). Áp suất còn lại:", "options": ["A. một nửa", "B. gấp đôi", "C. không đổi", "D. bằng không"], "answer": "A", "explain": "Mật độ phân tử giảm một nửa → áp suất giảm một nửa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong xilanh có pittông, vừa đun nóng vừa nén khí. Áp suất của khí:", "options": ["A. tăng (cả hai tác động đều làm tăng áp suất)", "B. không đổi", "C. giảm", "D. không xác định được"], "answer": "A", "explain": "Đun nóng (va chạm mạnh hơn) và nén (mật độ tăng) đều làm tăng áp suất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về ví dụ thực tế:", "statements": ["a) Bơm xe nhiều lần làm lốp căng vì mật độ phân tử tăng.", "b) Để bình gas gần lửa nguy hiểm vì áp suất tăng cao.", "c) Bóng bay ngoài nắng căng hơn vì nhiệt độ tăng.", "d) Lốp xe trời nắng dễ nổ vì lốp giãn nở."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vì áp suất khí trong lốp tăng cao.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Quả bóng bàn bị móp được nhúng vào nước nóng và phồng lại. Xét tính đúng, sai:", "statements": ["a) Khí trong bóng nóng lên.", "b) Áp suất khí trong bóng tăng.", "c) Áp suất tăng đẩy chỗ móp phồng ra.", "d) Vỏ bóng nở vì nhiệt là nguyên nhân chính."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nguyên nhân chính là áp suất khí tăng.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Khí thực gần đúng là khí lí tưởng ở áp suất thấp và nhiệt độ ______.", "answer": "cao", "explain": "Ở áp suất thấp, nhiệt độ cao, khí thực gần đúng là khí lí tưởng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Xì bớt một nửa số phân tử khí (nhiệt độ không đổi) thì áp suất còn ______ ban đầu.", "answer": "một nửa", "explain": "Mật độ phân tử còn một nửa nên áp suất còn một nửa.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong mô hình động học phân tử, chất khí được cấu tạo từ:", "options": ["A. các phân tử", "B. các hạt nhân", "C. các electron tự do", "D. các ion"], "answer": "A", "explain": "Chất khí cấu tạo từ các phân tử (nguyên tử).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng về khí lí tưởng?", "options": ["A. Là mô hình lí thuyết, khí thực chỉ gần đúng ở điều kiện nhất định", "B. Là chất khí có thật trong tự nhiên", "C. Không tuân theo định luật Charles", "D. Phân tử khí lí tưởng có kích thước lớn"], "answer": "A", "explain": "Khí lí tưởng là mô hình lí thuyết; không có khí lí tưởng tuyệt đối trong thực tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một lượng khí được nén đẳng nhiệt đến thể tích bằng một nửa, mật độ phân tử:", "options": ["A. tăng gấp đôi", "B. giảm một nửa", "C. không đổi", "D. tăng gấp bốn"], "answer": "A", "explain": "Thể tích giảm một nửa mà số phân tử không đổi nên mật độ phân tử tăng gấp đôi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi xì bớt khí trong bình (nhiệt độ không đổi), áp suất khí trong bình:", "options": ["A. giảm", "B. tăng", "C. không đổi", "D. tăng gấp đôi"], "answer": "A", "explain": "Xì bớt khí → số phân tử giảm → mật độ phân tử giảm → áp suất giảm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đun nóng đẳng áp một lượng khí, thể tích khí tăng vì:", "options": ["A. phân tử chuyển động nhanh hơn, va chạm mạnh hơn đẩy pittông ra", "B. số phân tử tăng", "C. khối lượng khí tăng", "D. áp suất giảm"], "answer": "A", "explain": "Nhiệt độ tăng → va chạm mạnh hơn → để giữ áp suất không đổi, thể tích phải tăng (pittông dịch chuyển).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một bình kín chứa hỗn hợp hai khí A và B. Áp suất toàn phần của hỗn hợp:", "options": ["A. bằng tổng áp suất riêng phần của từng khí", "B. bằng áp suất của khí A", "C. bằng áp suất của khí B", "D. bằng không"], "answer": "A", "explain": "Theo định luật Dalton, áp suất toàn phần bằng tổng áp suất riêng phần của các khí thành phần.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về ảnh hưởng của nhiệt độ:", "statements": ["a) Nhiệt độ càng cao, phân tử khí chuyển động càng nhanh.", "b) Nén đẳng nhiệt làm áp suất khí tăng.", "c) Làm lạnh đẳng tích làm áp suất khí giảm.", "d) Xì bớt khí làm áp suất tăng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: xì bớt khí làm áp suất giảm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một xilanh có pittông tự do chứa khí, đun nóng khí. Xét tính đúng, sai:", "statements": ["a) Nhiệt độ khí tăng.", "b) Áp suất khí có xu hướng tăng.", "c) Pittông dịch chuyển để thể tích tăng, áp suất trở lại cân bằng.", "d) Thể tích khí giảm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: thể tích tăng.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Nén đẳng nhiệt làm ______ phân tử tăng nên áp suất tăng.", "answer": "mật độ", "explain": "Nén đẳng nhiệt: thể tích giảm → mật độ phân tử tăng → áp suất tăng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Theo định luật Dalton, áp suất toàn phần của hỗn hợp khí bằng ______ các áp suất riêng phần.", "answer": "tổng", "explain": "Áp suất toàn phần bằng tổng áp suất riêng phần của từng khí.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Khi nhiệt độ của chất khí tăng (thể tích không đổi), áp suất của khí:", "options": ["A. tăng", "B. giảm", "C. không đổi", "D. bằng không"], "answer": "A", "explain": "Nhiệt độ tăng → phân tử chuyển động nhanh hơn, va chạm mạnh hơn → áp suất tăng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi nén đẳng nhiệt một lượng khí, áp suất của khí:", "options": ["A. tăng", "B. giảm", "C. không đổi", "D. bằng không"], "answer": "A", "explain": "Nén đẳng nhiệt: thể tích giảm → mật độ phân tử tăng → va chạm nhiều hơn → áp suất tăng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nắp ấm nước đang sôi bị nhấc lên nhấc xuống?", "options": ["A. Hơi nước tạo áp suất đẩy nắp lên", "B. Nước sôi làm ấm nhẹ đi", "C. Gió thổi", "D. Ấm bị rung"], "answer": "A", "explain": "Hơi nước bốc lên tạo áp suất đẩy nắp ấm lên, rồi hơi thoát ra, nắp rơi xuống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đun nóng khí trong xilanh có pittông tự do, pittông dịch chuyển vì:", "options": ["A. áp suất khí tăng đẩy pittông", "B. pittông nở vì nhiệt", "C. khí thoát ra ngoài", "D. xilanh co lại"], "answer": "A", "explain": "Nhiệt độ tăng → áp suất khí có xu hướng tăng → đẩy pittông dịch chuyển để áp suất cân bằng với bên ngoài.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một bình kín chứa khí ở $27^{\\circ}$C. Muốn áp suất tăng gấp đôi thì phải đun đến:", "options": ["A. $327^{\\circ}$C", "B. $54^{\\circ}$C", "C. $127^{\\circ}$C", "D. $600^{\\circ}$C"], "answer": "A", "explain": "$T_1 = 300$ K; áp suất tăng gấp đôi thì $T_2 = 600$ K $= 327^{\\circ}$C.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nén khí trong xilanh rất nhanh (gần đoạn nhiệt), khí nóng lên. Giải thích đúng là:", "options": ["A. công thực hiện lên khí chuyển thành nội năng", "B. ma sát giữa pittông và xilanh", "C. khí nhận nhiệt từ ngoài", "D. số phân tử tăng"], "answer": "A", "explain": "Nén nhanh gần như không kịp trao đổi nhiệt: công nén chuyển thành nội năng làm khí nóng lên.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về lực tương tác phân tử:", "statements": ["a) Giữa các va chạm, lực tương tác phân tử không đáng kể.", "b) Phân tử khí chiếm phần lớn thể tích bình chứa.", "c) Tốc độ trung bình của phân tử tăng khi nhiệt độ tăng.", "d) Mọi phân tử khí đều chuyển động với cùng tốc độ."], "answer": ["T", "F", "T", "F"], "explain": "a), c) Đúng. b) Sai: thể tích phân tử rất nhỏ so với bình. d) Sai: tốc độ phân bố hỗn loạn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "So sánh không khí trong lốp xe lúc sáng sớm và lúc trưa nắng. Xét tính đúng, sai:", "statements": ["a) Trưa nắng nhiệt độ khí trong lốp cao hơn.", "b) Trưa nắng áp suất khí trong lốp cao hơn.", "c) Số phân tử khí trong lốp không đổi.", "d) Sáng sớm áp suất cao hơn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Đun nóng khí trong bình kín làm phân tử chuyển động ______ hơn nên áp suất tăng.", "answer": "nhanh", "explain": "Nhiệt độ tăng → phân tử chuyển động nhanh hơn → va chạm mạnh hơn → áp suất tăng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền số còn thiếu: Một lượng khí trong bình kín ở $27^{\\circ}$C có áp suất $2$ atm. Đun đến $177^{\\circ}$C, áp suất là ______ atm (chỉ ghi số).", "answer": "3", "explain": "$p_2 = 2 \\times 450/300 = 3$ atm.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hai bình chứa cùng một loại khí, bình nào có áp suất lớn hơn nếu các điều kiện khác như nhau?", "options": ["A. Bình có mật độ phân tử lớn hơn", "B. Bình có thể tích lớn hơn", "C. Bình có khối lượng vỏ lớn hơn", "D. Bình trong suốt"], "answer": "A", "explain": "Mật độ phân tử lớn hơn → nhiều va chạm hơn → áp suất lớn hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các khí sau, khí nào gần với khí lí tưởng nhất ở điều kiện thường?", "options": ["A. Helium", "B. Hơi nước bão hoà", "C. Khí ở áp suất rất cao", "D. Khí gần hoá lỏng"], "answer": "A", "explain": "Helium là khí nhẹ, khó hoá lỏng nên ở điều kiện thường gần với khí lí tưởng nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong mô hình động học phân tử, bỏ qua được đại lượng nào giữa các va chạm?", "options": ["A. Lực tương tác giữa các phân tử", "B. Động năng của phân tử", "C. Khối lượng phân tử", "D. Tốc độ phân tử"], "answer": "A", "explain": "Giữa các va chạm, lực tương tác phân tử không đáng kể nên bỏ qua được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khí trong hai bình A và B cùng nhiệt độ, bình A có thể tích gấp đôi bình B và số phân tử gấp đôi. Áp suất hai bình:", "options": ["A. bằng nhau", "B. bình A gấp đôi", "C. bình B gấp đôi", "D. không so sánh được"], "answer": "A", "explain": "Mật độ phân tử hai bình bằng nhau ($2N/2V = N/V$) nên áp suất bằng nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nén một lượng khí sao cho mật độ phân tử tăng gấp $4$ lần (nhiệt độ không đổi). Áp suất:", "options": ["A. tăng gấp $4$ lần", "B. tăng gấp $2$ lần", "C. không đổi", "D. giảm $4$ lần"], "answer": "A", "explain": "Áp suất tỉ lệ với mật độ phân tử (khi nhiệt độ không đổi) nên tăng gấp $4$ lần.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một lượng khí trong bình kín có áp suất $2$ atm ở $27^{\\circ}$C. Đun đến $177^{\\circ}$C, áp suất là:", "options": ["A. $3$ atm", "B. $4$ atm", "C. $2$ atm", "D. $13$ atm"], "answer": "A", "explain": "$T_1 = 300$ K, $T_2 = 450$ K. $p_2 = p_1 \\times T_2/T_1 = 2 \\times 450/300 = 3$ atm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Một bình kín chứa khí ở nhiệt độ phòng. Xét tính đúng, sai:", "statements": ["a) Các phân tử khí va chạm liên tục lên thành bình.", "b) Áp suất khí là như nhau tại mọi điểm trên thành bình.", "c) Đun nóng bình làm áp suất tăng.", "d) Làm lạnh bình làm số phân tử giảm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: số phân tử không đổi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai bình thông nhau chứa khí ở cùng nhiệt độ. Xét tính đúng, sai:", "statements": ["a) Áp suất hai bình bằng nhau.", "b) Mật độ phân tử hai bình bằng nhau.", "c) Đun nóng một bình, khí dồn sang bình kia.", "d) Đun nóng một bình, áp suất hai bình khác nhau mãi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: khí dồn đến khi áp suất cân bằng.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Xì bớt khí trong bình làm ______ phân tử giảm nên áp suất giảm.", "answer": "mật độ", "explain": "Xì bớt khí → số phân tử giảm → mật độ phân tử giảm → áp suất giảm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Nén đoạn nhiệt khí thì công nén chuyển thành ______, làm khí nóng lên.", "answer": "nội năng", "explain": "Nén đoạn nhiệt: công nhận được chuyển thành nội năng.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Số phân tử trong một đơn vị thể tích gọi là:", "options": ["A. mật độ phân tử", "B. khối lượng riêng", "C. áp suất", "D. nhiệt độ"], "answer": "A", "explain": "Mật độ phân tử là số phân tử trong một đơn vị thể tích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi mở nút chai nước ngọt có gas, bọt khí sủi lên vì:", "options": ["A. áp suất giảm đột ngột, khí CO2 thoát ra", "B. nhiệt độ tăng", "C. nước sôi", "D. chai bị rung"], "answer": "A", "explain": "Mở nút làm áp suất giảm đột ngột, khí CO2 hoà tan thoát ra tạo bọt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải bơm lốp xe đúng áp suất quy định?", "options": ["A. Áp suất quá cao dễ gây nổ lốp khi trời nóng", "B. Lốp càng căng càng tốt", "C. Áp suất không ảnh hưởng", "D. Để lốp nhẹ hơn"], "answer": "A", "explain": "Bơm quá căng, khi trời nóng áp suất tăng thêm có thể gây nổ lốp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi hít vào, không khí đi vào phổi vì:", "options": ["A. cơ hoành hạ xuống làm áp suất trong phổi giảm thấp hơn bên ngoài", "B. phổi hút không khí", "C. không khí bị nén", "D. áp suất trong phổi tăng"], "answer": "A", "explain": "Thể tích lồng ngực tăng → áp suất trong phổi giảm → không khí từ ngoài (áp suất cao hơn) đi vào.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai bình A, B cùng thể tích chứa cùng loại khí. Bình A ở $300$ K, bình B ở $600$ K, số phân tử bằng nhau. Áp suất bình B:", "options": ["A. gấp đôi bình A", "B. bằng bình A", "C. một nửa bình A", "D. gấp bốn bình A"], "answer": "A", "explain": "Nhiệt độ tuyệt đối gấp đôi → phân tử chuyển động nhanh hơn → áp suất gấp đôi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai bình kín A và B thông nhau qua van. Ban đầu van đóng, A chứa khí áp suất cao, B chân không. Mở van, áp suất cuối:", "options": ["A. nằm giữa $0$ và áp suất ban đầu của A", "B. bằng áp suất ban đầu của A", "C. bằng không", "D. gấp đôi áp suất ban đầu"], "answer": "A", "explain": "Khí từ A giãn nở sang B, mật độ phân tử giảm → áp suất cuối thấp hơn ban đầu nhưng lớn hơn $0$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về mật độ phân tử:", "statements": ["a) Mật độ phân tử là số phân tử trong một đơn vị thể tích.", "b) Áp suất tỉ lệ với mật độ phân tử (nhiệt độ không đổi).", "c) Nén khí làm mật độ phân tử tăng.", "d) Giãn khí làm mật độ phân tử tăng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: giãn khí làm mật độ giảm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một bình kín chứa khí ở $27^{\\circ}$C có áp suất $1$ atm. Đun đến $327^{\\circ}$C. Xét tính đúng, sai:", "statements": ["a) $T_1 = 300$ K, $T_2 = 600$ K.", "b) Áp suất tăng gấp đôi.", "c) Áp suất lúc sau là $2$ atm.", "d) Áp suất lúc sau là $12$ atm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Đơn vị áp suất trong hệ SI là ______.", "answer": "paxcan", "explain": "Đơn vị áp suất: paxcan (Pa).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Bình gas để gần lửa nguy hiểm vì nhiệt độ tăng làm ______ trong bình tăng cao.", "answer": "áp suất", "explain": "Nhiệt độ tăng → va chạm mạnh hơn → áp suất tăng cao có thể gây nổ.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Quả bóng bay để ngoài nắng bị căng hơn vì:", "options": ["A. nhiệt độ tăng làm áp suất khí trong bóng tăng", "B. cao su nở ra", "C. không khí lọt thêm vào", "D. bóng bay hơi"], "answer": "A", "explain": "Nhiệt độ tăng → phân tử chuyển động nhanh hơn → va chạm mạnh hơn → áp suất tăng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lốp xe để ngoài nắng nóng có thể bị nổ vì:", "options": ["A. áp suất khí trong lốp tăng cao", "B. lốp xe giãn nở", "C. săm xe bị thủng", "D. van xe hỏng"], "answer": "A", "explain": "Nhiệt độ tăng cao làm áp suất khí trong lốp tăng, vượt giới hạn chịu đựng gây nổ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bình xịt (bình sơn, bình xịt muỗi) hoạt động dựa trên nguyên tắc:", "options": ["A. khí nén trong bình có áp suất cao đẩy chất lỏng ra", "B. đun nóng", "C. phản ứng hoá học", "D. trọng lực"], "answer": "A", "explain": "Khí nén áp suất cao trong bình đẩy chất lỏng ra ngoài khi mở van.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao tàu lặn có giới hạn độ sâu?", "options": ["A. Áp suất nước tăng theo độ sâu, vượt giới hạn vỏ tàu sẽ bị ép vỡ", "B. Nước lạnh", "C. Thiếu ánh sáng", "D. Cá mập"], "answer": "A", "explain": "Áp suất tăng theo độ sâu; vỏ tàu chỉ chịu được áp suất giới hạn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một lượng khí được làm lạnh đẳng tích từ $400$ K xuống $200$ K. Áp suất:", "options": ["A. giảm một nửa", "B. tăng gấp đôi", "C. không đổi", "D. giảm $4$ lần"], "answer": "A", "explain": "Nhiệt độ tuyệt đối giảm một nửa → áp suất giảm một nửa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao khi lên núi cao, tai ta có cảm giác ù?", "options": ["A. Áp suất khí quyển giảm, chênh lệch áp suất hai bên màng nhĩ", "B. Nhiệt độ giảm", "C. Thiếu oxygen", "D. Gió mạnh"], "answer": "A", "explain": "Lên cao áp suất ngoài giảm nhanh, áp suất trong tai chưa kịp cân bằng gây cảm giác ù.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về an toàn:", "statements": ["a) Không đốt bình gas đã hết.", "b) Không để bình xịt gần lửa.", "c) Bơm lốp xe đúng áp suất quy định.", "d) Có thể đun nóng bình kín tuỳ ý."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đun nóng bình kín có thể gây nổ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai về ứng dụng và an toàn với chất khí:", "statements": ["a) Bình gas để nơi thoáng mát, tránh nguồn nhiệt.", "b) Van an toàn của nồi hơi xả bớt khí khi áp suất quá cao.", "c) Không bơm lốp xe quá căng.", "d) Có thể hàn xì gần bình gas đang mở."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: rất nguy hiểm.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Giữa các va chạm, lực tương tác giữa các phân tử khí được coi là không ______.", "answer": "đáng kể", "explain": "Lực tương tác phân tử giữa các va chạm không đáng kể, bỏ qua được.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Kích thước phân tử khí rất ______ so với khoảng cách giữa các phân tử.", "answer": "nhỏ", "explain": "Đây là một nội dung của mô hình động học phân tử.", "points": 0.5}]}]}
