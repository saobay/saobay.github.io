 RT/p = 8,31 \\times 273/101325 \\approx 0,0224$ m$^3 = 22,4$ lít.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một lượng khí ở $27^{\\circ}$C, áp suất $100$ kPa, thể tích $10$ lít. Nén đến $5$ lít, áp suất $200$ kPa, nhiệt độ lúc sau là:", "options": ["A. $27^{\\circ}$C", "B. $127^{\\circ}$C", "C. $327^{\\circ}$C", "D. $-23^{\\circ}$C"], "answer": "A", "explain": "$T_2 = 200 \\times 5 \\times 300/(100 \\times 10) = 300$ K $= 27^{\\circ}$C (quá trình đẳng nhiệt).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "$10$ mol khí ở $600$ K trong bình $60$ lít có áp suất:", "options": ["A. $831$ kPa", "B. $1662$ kPa", "C. $415,5$ kPa", "D. $83,1$ kPa"], "answer": "A", "explain": "$p = 10 \\times 8,31 \\times 600/60 = 831$ kPa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một bình kín thể tích $15$ lít chứa $5$ mol khí lí tưởng ở $300$ K. Tính áp suất của khí (theo đơn vị kPa).", "options": ["A. 831", "B. 931", "C. 731", "D. 1662"], "answer": "A", "explain": "$p = nRT/V = 5 \\times 8,31 \\times 300/15 = 831$ kPa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tính số mol của lượng khí lí tưởng có áp suất $831$ kPa, thể tích $30$ lít ở nhiệt độ $600$ K (đơn vị mol).", "options": ["A. 5", "B. 7", "C. 3", "D. 10"], "answer": "A", "explain": "$pV = nRT \\Rightarrow n = pV/(RT) = 831 \\times 30/(8,31 \\times 600) = 5$ mol.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các phát biểu sau về thể tích mol:", "statements": ["a) $22,4$ lít là thể tích $1$ mol khí ở $0^{\\circ}$C, $1$ atm.", "b) $n = pV/(RT)$.", "c) $T = pV/(nR)$.", "d) $R$ phụ thuộc vào loại khí."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $R$ là hằng số chung.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai về hằng số khí:", "statements": ["a) $R = 8,31$ J/(mol.K) dùng cho mọi khí lí tưởng.", "b) $k = R/N_A$ là hằng số Boltzmann.", "c) $R$ càng lớn với khí càng nặng.", "d) $R$ có đơn
