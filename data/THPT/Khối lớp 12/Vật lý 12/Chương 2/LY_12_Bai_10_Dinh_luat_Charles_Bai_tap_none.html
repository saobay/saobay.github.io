rc}$C. Tính thể tích lúc sau (theo đơn vị lít (chỉ ghi số)).", "answer": "20", "explain": "Đổi ra Kelvin: $T_1 = 300$ K, $T_2 = 600$ K. $V_1/T_1 = V_2/T_2 \\Rightarrow V_2 = V_1T_2/T_1 = 10 \\times 600/300 = 20$ lít.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một lượng khí đẳng áp có thể tích $10$ lít ở $-23^{\\circ}$C. Nung nóng đến thể tích $20$ lít, tính nhiệt độ lúc sau (theo đơn vị $^{\\circ}$C (chỉ ghi số)).", "answer": "227", "explain": "$T_1 = 250$ K. $T_2 = T_1V_2/V_1 = 250 \\times 20/10 = 500$ K. Đổi ra Celsius: $t_2 = 500 - 273 = 227^{\\circ}$C.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Trên cùng hệ trục $V$–$T$, đường đẳng áp ứng với áp suất lớn hơn thì:", "options": ["A. gần trục $T$ hơn (độ dốc nhỏ hơn)", "B. xa trục $T$ hơn", "C. trùng nhau", "D. cắt trục $V$"], "answer": "A", "explain": "Áp suất càng lớn, đường đẳng áp càng gần trục $T$ (độ dốc $V/T$ càng nhỏ).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiệt độ tuyệt đối tăng gấp đôi trong quá trình đẳng áp thì thể tích:", "options": ["A. tăng gấp đôi", "B. giảm một nửa", "C. không đổi", "D. tăng gấp bốn"], "answer": "A", "explain": "$V$ tỉ lệ thuận với $T$ nên tăng gấp đôi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong quá trình đẳng áp, khối lượng riêng của khí:", "options": ["A. tỉ lệ nghịch với nhiệt độ tuyệt đối", "B. tỉ lệ thuận với nhiệt độ", "C. không đổi", "D. tỉ lệ thuận với thể tích"], "answer": "A", "explain": "$D = m/V$, $V$ tỉ lệ thuận với $T$ nên $D$ tỉ lệ nghịch với $T$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một lượng khí ở $300$ K có thể tích $9$ lít. Muốn thể tích $12$ lít (đẳng áp) phải đun đến:", "options": ["A. $400$ K", "B. $225$ K", "C. $300$ K", "D. $600$ K"], "answer": "A", "explain": "$T_2 = T_1 \\times V_2/V_1 = 300 \\times 12/9 = 400$ K.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đun nóng đẳng áp một lượng khí đến nhiệt độ tuyệt đối gấp $4$ lần lúc đầu.
