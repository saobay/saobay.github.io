el": "NB", "q": "Nội dung của phép thử Turing là gì?", "options": ["A. Nếu máy tính được nhanh hơn con người thì máy có trí thông minh", "B. Nếu máy đối thoại khiến con người không phân biệt được đó là máy hay người thì có thể coi máy có trí thông minh", "C. Nếu máy có hình dáng giống con người thì máy có trí thông minh", "D. Nếu máy nhớ được nhiều dữ liệu thì máy có trí thông minh"], "answer": "B", "explain": "Phép thử Turing: cho người đối thoại với máy qua văn bản; nếu người đó không phân biệt được là máy hay người thì máy được coi là có trí thông minh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ thống hệ thống gợi ý phim dựa trên lịch sử xem thuộc loại AI nào?", "options": ["A. Siêu trí tuệ", "B. AI hẹp", "C. Không phải AI", "D. AI tổng quát"], "answer": "B", "explain": "Hệ thống gợi ý phim dựa trên lịch sử xem chỉ giỏi một nhiệm vụ cụ thể nên là AI hẹp. Mọi AI hiện nay đều là AI hẹp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ thống hệ thống nhận dạng khuôn mặt để mở khóa điện thoại thuộc loại AI nào?", "options": ["A. AI tổng quát", "B. Siêu trí tuệ", "C. AI hẹp", "D. Không phải AI"], "answer": "C", "explain": "Hệ thống nhận dạng khuôn mặt để mở khóa điện thoại chỉ giỏi một nhiệm vụ cụ thể nên là AI hẹp. Mọi AI hiện nay đều là AI hẹp.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trường học dùng AI chấm bài trắc nghiệm tự động. Đây là ví dụ của:", "options": ["A. AI tổng quát", "B. Siêu trí tuệ", "C. Trí tuệ con người", "D. AI hẹp"], "answer": "D", "explain": "Chấm bài trắc nghiệm tự động là một nhiệm vụ cụ thể → AI hẹp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho các ý: (a) AI hẹp chỉ làm tốt một nhiệm vụ; (b) Mọi AI hiện nay là AI hẹp; (c) AI tổng quát đã phổ biến. Khẳng định đúng:", "options": ["A. Chỉ (c)", "B. Chỉ (a)", "C. Cả (a), (b), (c)", "D. Chỉ (a) và (b)"], "answer": "D", "explain": "(a) đúng theo định nghĩa AI hẹp; (b) đúng — mọi AI hiện nay là AI hẹp; (c) sai — AI tổng quát chưa đạt được.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về điểm khác biệt của AI:", "statements": ["a) Máy tính truyền thống chỉ làm đúng chương trình viết sẵn.", "b) Hệ thống AI có khả năng học từ dữ liệu.", "c) Hệ thống AI ngày càng làm tốt hơn nhờ học.", "d) Máy tính truyền thống cũng tự học từ dữ liệu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: đó chính là điểm khác biệt — máy truyền thống không tự học.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về hệ chuyên gia:", "statements": ["a) Bùng nổ 1980 – 1987.", "b) Mô phỏng chuyên gia trong lĩnh vực hẹp.", "c) Hạn chế: khó cập nhật tri thức.", "d) Là AI tổng quát."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: hệ chuyên gia là AI hẹp.", "points": 1}, {"type": "short", "level": "VD", "q": "Chương trình mô phỏng khả năng ra quyết định của chuyên gia trong lĩnh vực hẹp gọi là ...?", "answer": "hệ chuyên gia", "explain": "Hệ chuyên gia mô phỏng chuyên gia trong lĩnh vực hẹp, bùng nổ 1980–1987.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phép thử Turing, máy vượt qua khi người đối thoại ... phân biệt được máy với người? (điền: không/không thể)", "answer": "không", "explain": "Trace: máy vượt qua phép thử Turing khi người đối thoại KHÔNG phân biệt được đó là máy hay người.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Mục tiêu của Trí tuệ nhân tạo là làm cho máy tính có khả năng gì?", "options": ["A. Thực hiện những công việc đòi hỏi trí thông minh của con người", "B. Kết nối tất cả máy tính trên thế giới", "C. Tự sửa chữa phần cứng khi hỏng", "D. Thực hiện mọi công việc thay con người"], "answer": "A", "explain": "AI nghiên cứu cách làm cho máy tính thực hiện những công việc đòi hỏi trí thông minh của con người như học, suy luận, nhận thức, ra quyết định.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhà khoa học nào lần đầu tiên sử dụng thuật ngữ Artificial Intelligence?", "options": ["A. Bill Gates", "B. John McCarthy", "C. Alan Turing", "D. Tim Berners-Lee"], "answer": "B", "explain": "John McCarthy là người đầu tiên dùng thuật ngữ Artificial Intelligence tại hội thảo Dartmouth năm 1956.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ thống trợ lý ảo trả lời câu hỏi về thời tiết thuộc loại AI nào?", "options": ["A. Không phải AI", "B. Siêu trí tuệ", "C. AI tổng quát", "D. AI hẹp"], "answer": "D", "explain": "Trợ lý ảo trả lời câu hỏi về thời tiết chỉ giỏi một nhiệm vụ cụ thể nên là AI hẹp. Mọi AI hiện nay đều là AI hẹp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ví dụ nào sau đây minh họa đúng nhất bản chất của AI hẹp?", "options": ["A. Phần mềm chơi cờ vua vô địch có cảm xúc", "B. Phần mềm chơi cờ vua vô địch tự nâng cấp phần cứng", "C. Phần mềm chơi cờ vua vô địch không biết trả lời câu hỏi thời tiết", "D. Phần mềm chơi cờ vua vô địch biết làm mọi việc"], "answer": "C", "explain": "AI hẹp chỉ giỏi một nhiệm vụ cụ thể: phần mềm chơi cờ vua vô địch không thể trả lời câu hỏi thời tiết.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Yếu tố nào khiến AI phát triển mạnh trở lại sau các mùa đông AI?", "options": ["A. Dữ liệu lớn và sức mạnh tính toán tăng mạnh", "B. Cấm nghiên cứu AI", "C. Máy tính đắt hơn", "D. Ít dữ liệu hơn"], "answer": "A", "explain": "Từ những năm 1990, dữ liệu lớn và sức mạnh tính toán giúp học máy (đặc biệt học sâu từ 2012) bùng nổ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một robot lau nhà tự tránh chướng ngại vật nhờ cảm biến và bản đồ học được. Nó có phải AI tổng quát không? Vì sao?", "options": ["A. Có, vì nó dùng điện", "B. Có, vì nó tự di chuyển", "C. Không, vì nó chỉ giỏi một nhiệm vụ cụ thể", "D. Không, vì nó không phải phần mềm"], "answer": "C", "explain": "Robot lau nhà chỉ giỏi nhiệm vụ lau nhà/tránh vật cản trong phạm vi huấn luyện → AI hẹp, không phải AI tổng quát.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về hướng tiếp cận AI:", "statements": ["a) Hệ chuyên gia thuộc hướng AI dựa trên tri thức và luật.", "b) Học máy giúp máy tự học từ dữ liệu.", "c) Học sâu bùng nổ từ khoảng 2012.", "d) Học máy không cần dữ liệu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: học máy cốt lõi là học TỪ dữ liệu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các mốc lịch sử AI:", "statements": ["a) 1950: phép thử Turing.", "b) 1956: thuật ngữ AI ra đời.", "c) 1974 – 1980: mùa đông AI lần 1.", "d) 1980 – 1987: bùng nổ học sâu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: 1980–1987 là bùng nổ hệ chuyên gia; học sâu bùng nổ từ khoảng 2012.", "points": 1}, {"type": "short", "level": "VD", "q": "AI vượt xa trí tuệ con người trong mọi lĩnh vực được gọi là ...?", "answer": "siêu trí tuệ", "explain": "Siêu trí tuệ (ASI) vượt xa con người — hiện mới chỉ là giả thuyết.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một phần mềm nhận dạng chữ viết tay đạt 99% nhưng không trả lời được câu hỏi đơn giản. Nó thuộc loại AI nào?", "answer": "AI hẹp", "explain": "Trace: giỏi một nhiệm vụ cụ thể (nhận dạng chữ) nhưng không làm việc khác → đúng định nghĩa AI hẹp.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Học máy (Machine Learning) là hướng tiếp cận trong đó:", "options": ["A. Máy có cảm xúc như con người", "B. Máy thay thế hoàn toàn con người", "C. Máy làm đúng chương trình viết sẵn", "D. Máy tự học từ dữ liệu"], "answer": "D", "explain": "Học máy là hướng tiếp cận để máy tự học từ dữ liệu, rút ra quy luật và ngày càng làm tốt hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chương trình mô phỏng khả năng ra quyết định của chuyên gia trong một lĩnh vực hẹp được gọi là gì?", "options": ["A. Hệ chuyên gia", "B. Hệ quản trị cơ sở dữ liệu", "C. Hệ điều hành", "D. Hệ thống nhúng"], "answer": "A", "explain": "Hệ chuyên gia mô phỏng khả năng ra quyết định của chuyên gia trong lĩnh vực hẹp, bùng nổ trong giai đoạn 1980–1987.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạn chế của máy tính truyền thống (không AI) so với hệ thống AI là gì?", "options": ["A. Máy chỉ làm đúng chương trình viết sẵn, không tự học từ dữ liệu", "B. Máy có khả năng học từ dữ liệu", "C. Máy thay thế hoàn toàn con người", "D. Máy luôn đúng trong mọi tình huống"], "answer": "A", "explain": "Máy tính truyền thống chỉ làm đúng những gì được lập trình sẵn từng bước, không có khả năng tự học từ dữ liệu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thành tựu nổi bật của AI trong giai đoạn 1980 – 1987 là gì?", "options": ["A. Học sâu", "B. Hệ chuyên gia", "C. Internet", "D. Robot hình người"], "answer": "B", "explain": "Giai đoạn 1980–1987 là thời kỳ bùng nổ của hệ chuyên gia.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sắp xếp đúng trình tự các mốc: (1) phép thử Turing, (2) thuật ngữ AI ra đời, (3) mùa đông AI lần 1, (4) bùng nổ học sâu.", "options": ["A. (2) – (1) – (4) – (3)", "B. (3) – (1) – (2) – (4)", "C. (1) – (2) – (3) – (4)", "D. (1) – (3) – (2) – (4)"], "answer": "C", "explain": "Trình tự đúng: 1950 phép thử Turing, 1956 thuật ngữ AI, 1974–1980 mùa đông AI lần 1, từ khoảng 2012 bùng nổ học sâu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một công ty quảng cáo sản phẩm là AI tổng quát trong khi thực chất chỉ là chatbot theo kịch bản. Đây là vấn đề gì?", "options": ["A. Thổi phồng, gây hiểu lầm về năng lực AI", "B. Bảo mật mạng", "C. Tiến bộ khoa học", "D. Tiết kiệm điện"], "answer": "A", "explain": "Chatbot theo kịch bản là AI hẹp (thậm chí chưa hẳn AI); quảng cáo là AI tổng quát là thổi phồng, gây hiểu lầm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về Trí tuệ nhân tạo:", "statements": ["a) AI là viết tắt của Artificial Intelligence.", "b) AI là một lĩnh vực của khoa học máy tính.", "c) AI nghiên cứu cách làm cho máy tính có trí thông minh như con người.", "d) Mọi thiết bị điện tử đều là AI."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng theo khái niệm AI. d) sai: chỉ hệ thống có khả năng học, suy luận... mới là AI; bàn phím, máy in... không phải AI.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về ứng dụng AI:", "statements": ["a) Chẩn đoán ảnh y khoa có thể dùng AI.", "b) Xe tự lái dùng AI nhận biết chướng ngại vật.", "c) Dịch máy là ứng dụng AI.", "d) Mọi phần mềm máy tính đều là AI."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: chỉ phần mềm có học/suy luận... mới là AI.", "points": 1}, {"type": "short", "level": "VD", "q": "Sự kiện được coi là khai sinh lĩnh vực AI là ...?", "answer": "hội thảo Dartmouth", "explain": "Hội thảo Dartmouth năm 1956 nơi thuật ngữ AI lần đầu được dùng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao nói trợ lý ảo trên điện thoại KHÔNG phải AI tổng quát?", "answer": "AI hẹp", "explain": "Trace: trợ lý ảo chỉ giỏi một số nhiệm vụ cụ thể (trả lời câu hỏi, đặt lịch...) → AI hẹp, chưa phải AI tổng quát.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trí tuệ nhân tạo là lĩnh vực của ngành khoa học nào?", "options": ["A. Lĩnh vực của toán học", "B. Lĩnh vực của vật lí", "C. Lĩnh vực của sinh học", "D. Lĩnh vực của khoa học máy tính"], "answer": "D", "explain": "AI là một lĩnh vực của khoa học máy tính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại AI vượt xa trí tuệ con người trong mọi lĩnh vực, hiện mới chỉ là giả thuyết, được gọi là gì?", "options": ["A. Hệ chuyên gia", "B. Siêu trí tuệ", "C. AI tổng quát", "D. AI hẹp"], "answer": "B", "explain": "Siêu trí tuệ (ASI) là AI vượt xa con người trong mọi lĩnh vực — hiện mới chỉ tồn tại ở dạng giả thuyết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phép thử Turing ra đời trước hay sau thuật ngữ AI? Mốc năm của phép thử Turing là:", "options": ["A. 1974", "B. 1950", "C. 1987", "D. 1956"], "answer": "B", "explain": "Phép thử Turing (1950) ra đời trước thuật ngữ AI (1956) — Turing đặt nền móng tư tưởng từ trước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ thống bộ lọc thư rác trong hộp thư điện tử thuộc loại AI nào?", "options": ["A. AI hẹp", "B. Siêu trí tuệ", "C. AI tổng quát", "D. Không phải AI"], "answer": "A", "explain": "Bộ lọc thư rác trong hộp thư điện tử chỉ giỏi một nhiệm vụ cụ thể nên là AI hẹp. Mọi AI hiện nay đều là AI hẹp.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một công ty muốn hệ thống tự phân loại thư rác dựa trên hàng nghìn email mẫu đã có. Hướng tiếp cận AI phù hợp nhất là gì?", "options": ["A. Nhập liệu thủ công", "B. Lập trình từng quy tắc cố định", "C. AI dựa trên luật viết tay", "D. Học máy"], "answer": "D", "explain": "Muốn máy tự rút ra quy luật từ hàng nghìn email mẫu thì phù hợp nhất là học máy — máy tự học từ dữ liệu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao hệ chuyên gia bùng nổ rồi lại dẫn tới mùa đông AI lần 2?", "options": ["A. Vì hệ chuyên gia bộc lộ hạn chế, khó mở rộng tri thức", "B. Vì hết điện", "C. Vì máy tính quá rẻ", "D. Vì không ai dùng máy tính nữa"], "answer": "A", "explain": "Hệ chuyên gia (1980–1987) bộc lộ hạn chế: khó thu thập và cập nhật tri thức, suy luận cứng nhắc → thất vọng → mùa đông AI lần 2 (1987–1993).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về phép thử Turing:", "statements": ["a) Phép thử Turing dùng đối thoại qua văn bản.", "b) Máy vượt qua phép thử khi người đối thoại không phân biệt được máy với người.", "c) Phép thử Turing do John McCarthy đề xuất.", "d) Phép thử Turing ra đời năm 1950."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai: phép thử Turing do Alan Turing đề xuất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về phép thử Turing:", "statements": ["a) Dùng đối thoại qua văn bản.", "b) Loại bỏ yếu tố ngoại hình, giọng nói.", "c) Máy qua được thì chắc chắn là AI tổng quát.", "d) Do Alan Turing đề xuất năm 1950."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai: vượt qua phép thử chỉ cho thấy máy đối thoại giống người, chưa chứng minh AI tổng quát.", "points": 1}, {"type": "short", "level": "VD", "q": "Hướng tiếp cận giúp máy tự học từ dữ liệu được gọi là ...?", "answer": "học máy", "explain": "Học máy (Machine Learning) là hướng tiếp cận để máy tự học từ dữ liệu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các mốc theo thời gian (ghi đáp án dạng a-b-c): a) mùa đông AI lần 1, b) thuật ngữ AI ra đời, c) phép thử Turing.", "answer": "c-b-a", "explain": "Trace: c) 1950 phép thử Turing → b) 1956 thuật ngữ AI → a) 1974–1980 mùa đông AI lần 1. Đáp án: c-b-a.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Ví dụ nào sau đây là ứng dụng của Trí tuệ nhân tạo?", "options": ["A. Nhận dạng khuôn mặt để mở khóa điện thoại", "B. Máy in in đúng nội dung được gửi tới", "C. Bàn phím gửi tín hiệu khi gõ phím", "D. Máy tính bỏ túi tính nhẩm theo phím bấm"], "answer": "A", "explain": "Nhận dạng khuôn mặt để mở khóa điện thoại là ứng dụng AI. Các ví dụ còn lại là hoạt động máy móc theo chương trình cố định, không có học hay suy luận.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cụm từ viết tắt AI là viết tắt của cụm từ tiếng Anh nào?", "options": ["A. Trí tuệ nhân tạo", "B. Trí tuệ đám đông", "C. Trí tuệ tập thể", "D. Trí tuệ cảm xúc"], "answer": "A", "explain": "AI là viết tắt của Artificial Intelligence, nghĩa là Trí tuệ nhân tạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hướng tiếp cận AI trong đó máy tự học từ dữ liệu để rút ra quy luật được gọi là gì?", "options": ["A. AI tổng quát", "B. Học máy", "C. Siêu trí tuệ", "D. AI dựa trên tri thức và luật"], "answer": "B", "explain": "Học máy: máy tự học từ dữ liệu để rút ra quy luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một hệ thống được gọi là có trí tuệ nhân tạo khi nó có khả năng nào sau đây?", "options": ["A. Máy tự thay linh kiện", "B. Máy chạy đúng chương trình cố định", "C. Máy không cần điện", "D. Máy học từ dữ liệu để tự cải thiện"], "answer": "D", "explain": "Dấu hiệu của AI là khả năng học từ dữ liệu, suy luận và ngày càng làm tốt hơn — chứ không chỉ chạy chương trình cố định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhóm nghiên cứu tuyên bố đã tạo ra AI tổng quát vì chatbot của họ trả lời trôi chảy. Đánh giá đúng nhất là gì?", "options": ["A. Mọi chatbot đều là siêu trí tuệ", "B. Trả lời trôi chảy chưa đủ chứng minh AI tổng quát", "C. Chatbot trôi chảy chính là AI tổng quát", "D. AI tổng quát đã phổ biến từ lâu"], "answer": "B", "explain": "AI tổng quát đòi hỏi trí tuệ ngang con người trong mọi việc trí tuệ, hiện chưa đạt được; chatbot trả lời trôi chảy vẫn là AI hẹp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điểm chung của hai mùa đông AI là gì?", "options": ["A. Cấm dùng điện", "B. AI đạt đỉnh cao", "C. Thất vọng về tiến bộ khiến tài trợ nghiên cứu bị cắt giảm", "D. Máy tính ngừng hoạt động"], "answer": "C", "explain": "Cả hai mùa đông AI (1974–1980, 1987–1993) đều do thất vọng về tiến bộ, dẫn tới cắt giảm tài trợ nghiên cứu.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về lịch sử AI:", "statements": ["a) Thuật ngữ AI được John McCarthy đề xuất năm 1956.", "b) Hội thảo Dartmouth được coi là sự kiện khai sinh AI.", "c) Phép thử Turing do Alan Turing đề xuất năm 1950.", "d) Thuật ngữ AI ra đời trước phép thử Turing."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: phép thử Turing (1950) ra đời trước thuật ngữ AI (1956).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một nhóm học sinh tranh luận về AI:", "statements": ["a) An nói mọi AI hiện nay là AI hẹp.", "b) Bình nói chatbot trả lời trôi chảy là AI tổng quát.", "c) Chi nói siêu trí tuệ đã phổ biến.", "d) Dũng nói AI hẹp chỉ giỏi một nhiệm vụ cụ thể."], "answer": ["T", "F", "F", "T"], "explain": "a) đúng; d) đúng theo định nghĩa AI hẹp. b) sai: chatbot vẫn là AI hẹp. c) sai: siêu trí tuệ mới là giả thuyết.", "points": 1}, {"type": "short", "level": "VD", "q": "Từ khoảng năm ..., học sâu tạo bước đột phá nhờ dữ liệu lớn và sức mạnh tính toán?", "answer": "2012", "explain": "Từ khoảng 2012, học sâu (deep learning) bùng nổ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hội thảo Dartmouth diễn ra cách năm đề xuất phép thử Turing bao nhiêu năm?", "answer": "6", "explain": "Trace: phép thử Turing 1950, hội thảo Dartmouth 1956 → 1956 − 1950 = 6 năm.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phép thử Turing được đề xuất vào năm nào?", "options": ["A. 1950", "B. 2012", "C. 1980", "D. 1956"], "answer": "A", "explain": "Alan Turing đề xuất phép thử Turing năm 1950, trước cả khi thuật ngữ AI ra đời.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện nay, AI tổng quát (AGI) đang ở tình trạng nào?", "options": ["A. Đã đạt được từ năm 1956", "B. Đã đạt được từ năm 2012", "C. Đã bị cấm nghiên cứu", "D. Chưa đạt được"], "answer": "D", "explain": "AI tổng quát hiện chưa đạt được; mọi AI hiện nay mới chỉ là AI hẹp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ thống phần mềm dịch văn bản từ tiếng Anh sang tiếng Việt thuộc loại AI nào?", "options": ["A. Siêu trí tuệ", "B. AI hẹp", "C. Không phải AI", "D. AI tổng quát"], "answer": "B", "explain": "Phần mềm dịch văn bản từ tiếng Anh sang tiếng Việt chỉ giỏi một nhiệm vụ cụ thể nên là AI hẹp. Mọi AI hiện nay đều là AI hẹp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Máy in in đúng nội dung nhận được có phải là hệ thống AI không? Vì sao?", "options": ["A. AI hẹp", "B. AI tổng quát", "C. Siêu trí tuệ", "D. Không phải AI"], "answer": "D", "explain": "Máy in in đúng nội dung nhận được chỉ hoạt động máy móc theo thiết kế cố định, không có khả năng học hay suy luận nên không phải AI.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong phép thử Turing, người đối thoại giao tiếp với máy thông qua hình thức nào?", "options": ["A. Gặp mặt trực tiếp", "B. Nghe giọng nói thật", "C. Văn bản (gõ chữ)", "D. Quan sát hình dáng"], "answer": "C", "explain": "Phép thử Turing dùng đối thoại qua văn bản để loại bỏ yếu tố ngoại hình, giọng nói — chỉ đánh giá nội dung trí tuệ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một hệ thống vừa dịch văn bản, vừa nhận dạng giọng nói, vừa gợi ý nhạc. Nó có phải AI tổng quát không?", "options": ["A. Không, mỗi chức năng là một AI hẹp riêng", "B. Có, vì dùng cùng một máy", "C. Không, vì chưa có cảm xúc", "D. Có, vì làm được nhiều việc"], "answer": "A", "explain": "Làm nhiều việc bằng cách gộp nhiều AI hẹp riêng lẻ vẫn chưa phải AI tổng quát — AGI đòi hỏi trí tuệ linh hoạt như con người trong mọi việc.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về ví dụ AI:", "statements": ["a) Nhận dạng khuôn mặt mở khóa điện thoại là ứng dụng AI.", "b) Bộ lọc thư rác là ứng dụng AI.", "c) Máy tính bỏ túi bấm phím tính toán là AI.", "d) Trợ lý ảo trả lời câu hỏi là ứng dụng AI."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai: máy tính bỏ túi chỉ tính theo phím bấm cố định, không học hay suy luận.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về AI tổng quát và siêu trí tuệ:", "statements": ["a) AI tổng quát có trí tuệ ngang con người.", "b) AI tổng quát hiện chưa đạt được.", "c) Siêu trí tuệ vượt xa con người.", "d) Siêu trí tuệ đã được tạo ra."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: siêu trí tuệ mới là giả thuyết.", "points": 1}, {"type": "short", "level": "VD", "q": "Nhà khoa học đề xuất phép thử Turing là ...?", "answer": "Alan Turing", "explain": "Alan Turing đề xuất phép thử Turing năm 1950.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mùa đông AI lần 1 (1974–1980) kéo dài bao nhiêu năm?", "answer": "6", "explain": "Trace: 1980 − 1974 = 6 năm.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Thuật ngữ Artificial Intelligence được đề xuất vào năm nào?", "options": ["A. 2012", "B. 1950", "C. 1956", "D. 1974"], "answer": "C", "explain": "Thuật ngữ AI được John McCarthy đề xuất năm 1956 tại hội thảo Dartmouth.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại AI có trí tuệ ngang con người, làm được mọi việc trí tuệ như con người được gọi là gì?", "options": ["A. AI tổng quát", "B. Học máy", "C. Siêu trí tuệ", "D. AI hẹp"], "answer": "A", "explain": "AI tổng quát (AGI, AI mạnh) là AI có trí tuệ ngang con người — đây là mục tiêu nghiên cứu, hiện chưa đạt được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ thống phần mềm chơi cờ vua thắng kiện tướng thế giới thuộc loại AI nào?", "options": ["A. Không phải AI", "B. AI hẹp", "C. Siêu trí tuệ", "D. AI tổng quát"], "answer": "B", "explain": "Phần mềm chơi cờ vua thắng kiện tướng thế giới chỉ giỏi một nhiệm vụ cụ thể nên là AI hẹp. Mọi AI hiện nay đều là AI hẹp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo SGK, học sâu bùng nổ từ khoảng 2012 chủ yếu nhờ yếu tố nào?", "options": ["A. Máy tính nhỏ gọn hơn", "B. Dữ liệu lớn và sức mạnh tính toán", "C. Số lượng lập trình viên giảm", "D. Giá điện giảm mạnh"], "answer": "B", "explain": "Học sâu bùng nổ nhờ dữ liệu lớn và sức mạnh tính toán tăng mạnh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao các nhà khoa học thận trọng khi nói về siêu trí tuệ?", "options": ["A. Vì nó chỉ là trò chơi điện tử", "B. Vì nó mới chỉ là giả thuyết, chưa có cơ sở khẳng định", "C. Vì nó đã xuất hiện từ 1956", "D. Vì nó đã bị cấm hoàn toàn"], "answer": "B", "explain": "Siêu trí tuệ (ASI) vượt xa con người trong mọi lĩnh vực hiện mới chỉ là giả thuyết.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các giai đoạn AI theo thời gian: (1) mùa đông AI lần 2, (2) bùng nổ hệ chuyên gia, (3) mùa đông AI lần 1, (4) thuật ngữ AI ra đời.", "options": ["A. (3) – (4) – (1) – (2)", "B. (4) – (3) – (2) – (1)", "C. (2) – (4) – (3) – (1)", "D. (4) – (2) – (3) – (1)"], "answer": "B", "explain": "Thứ tự: 1956 thuật ngữ AI (4), 1974–1980 mùa đông 1 (3), 1980–1987 hệ chuyên gia (2), 1987–1993 mùa đông 2 (1).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về hệ chuyên gia:", "statements": ["a) Hệ chuyên gia mô phỏng ra quyết định của chuyên gia trong lĩnh vực hẹp.", "b) Hệ chuyên gia bùng nổ giai đoạn 1980 – 1987.", "c) Hệ chuyên gia thuộc hướng AI dựa trên tri thức và luật.", "d) Hệ chuyên gia chính là AI tổng quát."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: hệ chuyên gia là AI hẹp trong lĩnh vực hẹp.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Phân biệt các hệ thống:", "statements": ["a) Phần mềm diệt virus quét theo mẫu có sẵn là AI.", "b) Phần mềm nhận dạng giọng nói học từ dữ liệu là AI.", "c) Máy tính bỏ túi là AI.", "d) Xe tự lái nhận biết chướng ngại vật là AI."], "answer": ["F", "T", "F", "T"], "explain": "b), d) đúng: có học/nhận thức. a) sai: quét theo mẫu cố định, không học. c) sai: tính toán cố định.", "points": 1}, {"type": "short", "level": "VD", "q": "Thuật ngữ Artificial Intelligence được John McCarthy đề xuất vào năm ...?", "answer": "1956", "explain": "Năm 1956 tại hội thảo Dartmouth, John McCarthy lần đầu dùng thuật ngữ Artificial Intelligence.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chatbot chỉ trả lời theo kịch bản viết sẵn có phải AI tổng quát không? (trả lời Có/Không)", "answer": "Không", "explain": "Trace: chatbot theo kịch bản là AI hẹp (thậm chí mức đơn giản); AI tổng quát đòi hỏi trí tuệ ngang con người trong mọi việc — chưa đạt được.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Sự kiện nào được coi là khai sinh lĩnh vực Trí tuệ nhân tạo?", "options": ["A. Hội thảo Geneva", "B. Hội thảo Dartmouth", "C. Hội thảo Tokyo", "D. Hội thảo Paris"], "answer": "B", "explain": "Hội thảo Dartmouth năm 1956, nơi thuật ngữ AI lần đầu được dùng, được coi là sự kiện khai sinh lĩnh vực AI.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhà khoa học nào đề xuất phép thử Turing?", "options": ["A. Marvin Minsky", "B. Geoffrey Hinton", "C. Alan Turing", "D. John McCarthy"], "answer": "C", "explain": "Alan Turing đề xuất phép thử Turing năm 1950.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mùa đông AI lần thứ nhất diễn ra trong khoảng thời gian nào?", "options": ["A. 1974 – 1980", "B. 1956 – 1974", "C. 2012 – nay", "D. 1980 – 1987"], "answer": "A", "explain": "Mùa đông AI lần thứ nhất: 1974–1980; lần thứ hai: 1987–1993.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đèn bàn bật sáng khi bấm công tắc có phải là hệ thống AI không? Vì sao?", "options": ["A. Không phải AI", "B. AI tổng quát", "C. AI hẹp", "D. Siêu trí tuệ"], "answer": "A", "explain": "Đèn bàn bật sáng khi bấm công tắc chỉ hoạt động máy móc theo thiết kế cố định, không có khả năng học hay suy luận nên không phải AI.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hệ thống AI được huấn luyện chỉ với ảnh mèo để nhận biết mèo. Khi đưa ảnh chó, nó báo là mèo. Điều này cho thấy:", "options": ["A. Hệ thống không phải AI", "B. Hệ thống là AI hẹp, chỉ biết đúng nhiệm vụ được huấn luyện", "C. Hệ thống là AI tổng quát", "D. Hệ thống đã hỏng phần cứng"], "answer": "B", "explain": "AI hẹp chỉ làm tốt đúng nhiệm vụ trong phạm vi dữ liệu được huấn luyện — minh họa rõ bản chất AI hẹp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong phép thử Turing, nếu người đối thoại đoán đúng đâu là máy thì kết luận là gì?", "options": ["A. Người đối thoại thua", "B. Máy chưa vượt qua phép thử", "C. Phép thử bị hủy", "D. Máy đã vượt qua phép thử"], "answer": "B", "explain": "Máy chỉ vượt qua phép thử khi người đối thoại KHÔNG phân biệt được máy với người.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về phân loại AI:", "statements": ["a) AI hẹp thực hiện tốt một nhiệm vụ cụ thể.", "b) Mọi AI hiện nay đều là AI hẹp.", "c) AI tổng quát đã được tạo ra từ năm 2012.", "d) Siêu trí tuệ hiện mới chỉ là giả thuyết."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai: AI tổng quát (AGI) hiện chưa đạt được.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về hai hướng tiếp cận AI:", "statements": ["a) AI dựa trên luật: tri thức do con người đưa vào.", "b) Học máy: máy tự học từ dữ liệu.", "c) Học máy là hướng chủ đạo hiện nay.", "d) AI dựa trên luật không cần con người đưa tri thức."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: hướng này cần con người đưa tri thức, luật vào máy.", "points": 1}, {"type": "short", "level": "VD", "q": "AI chỉ thực hiện tốt một nhiệm vụ cụ thể được gọi là ...?", "answer": "AI hẹp", "explain": "AI hẹp (AI yếu) là AI thực hiện tốt một nhiệm vụ cụ thể; mọi AI hiện nay đều là AI hẹp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Yếu tố nào giúp học máy vượt qua các mùa đông AI để trở thành hướng chủ đạo?", "answer": "dữ liệu lớn", "explain": "Trace: từ những năm 1990, dữ liệu lớn (big data) và sức mạnh tính toán tăng mạnh giúp học máy bùng nổ.", "points": 0.5}]}]}</script>
