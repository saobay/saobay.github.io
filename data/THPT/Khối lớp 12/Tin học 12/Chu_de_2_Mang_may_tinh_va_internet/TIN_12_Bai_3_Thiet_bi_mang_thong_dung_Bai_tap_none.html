 tuyến) hoạt động ở tầng nào của mô hình OSI?", "options": ["A. tầng 3 (tầng mạng)", "B. tầng 1 – 2", "C. tầng 1", "D. tầng 2"], "answer": "A", "explain": "Router (bộ định tuyến) hoạt động ở tầng 3 (tầng mạng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong sơ đồ mạng, thiết bị đặt giữa Internet và mạng nội bộ thường là:", "options": ["A. Modem/Router", "B. Máy in", "C. Màn hình", "D. Hub"], "answer": "A", "explain": "Modem/Router là cửa ngõ giữa mạng nội bộ và Internet.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn kết nối mạng LAN của trường với mạng Internet, thiết bị không thể thiếu là:", "options": ["A. Hub", "B. Loa", "C. Máy in", "D. Modem (qua nhà cung cấp dịch vụ)"], "answer": "D", "explain": "Modem kết nối mạng nội bộ với Internet qua nhà cung cấp dịch vụ (ISP).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thư viện muốn máy mượn sách (có dây) và bạn đọc (Wi-Fi) cùng dùng chung máy chủ. Cần:", "options": ["A. không cần thiết bị nào", "B. chỉ dùng Modem", "C. chỉ dùng Hub", "D. Switch cho máy có dây và Access Point cho Wi-Fi, cùng nối về Router"], "answer": "D", "explain": "Mạng hỗn hợp: Switch phục vụ máy có dây, Access Point phục vụ Wi-Fi, Router làm cửa ngõ và quản lí chung.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Modem và Router gia đình gộp chung một thiết bị. Khi mất Internet nhưng Wi-Fi vẫn thấy, lỗi có thể ở:", "options": ["A. đường truyền từ Modem ra ISP", "B. Access Point", "C. card mạng máy tính", "D. dây nguồn Wi-Fi"], "answer": "A", "explain": "Wi-Fi (Access Point) vẫn hoạt động nghĩa là mạng nội bộ ổn; mất Internet thường do đường Modem tới ISP.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về Repeater và card mạng:", "statements": ["a) Repeater khuếch đại tín hiệu.", "b) Repeater mở rộng phạm vi truyền dẫn.", "c) Mỗi thiết bị cần card mạng để vào mạng.", "d) Repeater định tuyến gói tin."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) n", "D. Access Point hoặc bộ kích sóng"], "answer": "D", "explain": "Mở rộng vùng phủ sóng không dây: thêm Access Point (hoặc thiết bị kích sóng).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Kỹ thuật viên muốn biết máy nào đang chiếm băng thông trong mạng Switch. Anh ta dựa vào:", "options": ["A. màu dây cáp", "B. hỏi từng người", "C. địa chỉ MAC/IP của từng máy qua công cụ quản trị", "D. đoán mò"], "answer": "C", "explain": "Mỗi thiết bị có MAC/IP riêng; công cụ quản trị mạng thống kê theo địa chỉ để biết máy nào chiếm băng thông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp Hub – Switch – Router theo thứ tự thông minh tăng dần.", "options": ["A. Hub, Switch, Router", "B. Switch, Hub, Router", "C. Hub, Router, Switch", "D. Router, Switch, Hub"], "answer": "A", "explain": "Hub (tầng 1, phát bừa) kém nhất; Switch (tầng 2, theo MAC) hơn; Router (tầng 3, định tuyến theo IP) thông minh nhất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về Router:", "statements": ["a) Router hoạt động ở tầng 3.", "b) Router định tuyến theo địa chỉ IP.", "c) Router kết nối các mạng khác nhau.", "d) Router phát sóng Wi-Fi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: phát Wi-Fi là Access Point.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về địa chỉ MAC:", "statements": ["a) MAC dài 48 bit.", "b) Switch dùng MAC để chuyển khung.", "c) MAC thay đổi khi đổi mạng.", "d) MAC là duy nhất toàn cầu."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai: MAC gắn với card mạng, không đổi theo mạng (IP mới đổi).", "points": 1}, {"type": "short", "level": "VD", "q": "Mỗi máy tính cần có ... để kết nối vào mạng? (2 từ)", "answer": "card mạng", "explain": "Card mạng (NIC) là phần cứng giúp thiết bị kết nối vào mạng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thiết bị tầng 1 chỉ biết tín hiệu, không đọc địa chỉ, ví dụ ...? (ghi 1 tên)", "answer": "Hub", "explain": "Trace: thiết bị tầng 1 (Hub, Repeater) chỉ xử lí tín hiệu vật lí, không đọc địa chỉ MAC/IP.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Đặc điểm của địa chỉ MAC là:", "options": ["A. do người dùng tự đặt tùy ý", "B. duy nhất trên toàn cầu", "C. thay đổi theo từng mạng", "D. dài 32 bit"], "answer": "B", "explain": "Địa chỉ MAC do nhà sản xuất gán, duy nhất trên toàn cầu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Repeater (bộ lặp) hoạt động ở tầng nào của mô hình OSI?", "options": ["A. tầng 1 (tầng vật lí)", "B. tầng 1 – 2", "C. tầng 2", "D. tầng 1"], "answer": "A", "explain": "Repeater (bộ lặp) hoạt động ở tầng 1 (tầng vật lí).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong gia đình, thiết bị vừa phát Wi-Fi vừa kết nối ra Internet thường là:", "options": ["A. chỉ là loa", "B. chỉ là Hub", "C. thiết bị tích hợp Modem, Router và Access Point", "D. chỉ là máy in"], "answer": "C", "explain": "Thiết bị Wi-Fi gia đình thường tích hợp Modem (ra Internet), Router (định tuyến) và Access Point (phát Wi-Fi).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Switch hiệu quả hơn Hub khi nhiều máy truyền dữ liệu cùng lúc?", "options": ["A. Vì Switch to hơn", "B. Vì mỗi cổng của Switch là một miền đụng độ riêng", "C. Vì Switch không cần điện", "D. Vì Switch đắt hơn"], "answer": "B", "explain": "Hub: mọi thiết bị chung một miền đụng độ nên dễ nghẽn. Switch: mỗi cổng một miền đụng độ riêng nên ít đụng độ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Quán cà phê muốn khách dùng Wi-Fi nhưng mạng nội bộ thu ngân phải tách biệt. Giải pháp:", "options": ["A. dùng chung Hub", "B. Router tách mạng khách và mạng nội bộ", "C. tắt mạng thu ngân", "D. không dùng mật khẩu"], "answer": "B", "explain": "Router có thể tách các mạng, vừa cho khách Wi-Fi vừa bảo vệ mạng thu ngân.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao địa chỉ MAC phải duy nhất toàn cầu?", "options": ["A. Để tốn pin", "B. Để khó nhớ", "C. Để đẹp", "D. Để Switch ở bất kì đâu cũng phân biệt chính xác từng thiết bị"], "answer": "D", "explain": "MAC duy nhất toàn cầu giúp thiết bị được nhận diện chính xác ở tầng liên kết dữ liệu trong mọi mạng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về thiết bị gia đình:", "statements": ["a) Thiết bị Wi-Fi gia đình thường tích hợp Modem, Router, Access Point.", "b) Điện thoại vào Wi-Fi qua Access Point.", "c) Máy bàn có thể dùng cáp nối tới Switch.", "d) Muốn ra Internet không cần Modem/ISP."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: ra Internet cần Modem qua ISP.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về an toàn mạng:", "statements": ["a) Hub khiến mọi máy đều nhận được dữ liệu.", "b) Dùng Hub dễ bị nghe lén.", "c) Switch an toàn hơn Hub.", "d) Hub bảo mật tốt nhất."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Thiết bị khuếch đại tín hiệu để mở rộng phạm vi là ...?", "answer": "Repeater", "explain": "Repeater (tầng 1) khuếch đại và tái tạo tín hiệu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Switch chuyển khung đúng đích nhờ ghi nhớ ... của mỗi cổng? (2 từ)", "answer": "địa chỉ MAC", "explain": "Trace: Switch học địa chỉ MAC nguồn theo từng cổng vào bảng MAC để chuyển đúng đích.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hub (bộ tập trung) hoạt động ở tầng nào của mô hình OSI?", "options": ["A. tầng 1", "B. tầng 1 (tầng vật lí)", "C. tầng 1 – 2", "D. tầng 2"], "answer": "B", "explain": "Hub (bộ tập trung) hoạt động ở tầng 1 (tầng vật lí).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thiết bị hoạt động ở tầng 3 của mô hình OSI là:", "options": ["A. Router (bộ định tuyến)", "B. Hub", "C. Repeater", "D. Switch"], "answer": "A", "explain": "Router hoạt động ở tầng 3 (tầng mạng), định tuyến theo địa chỉ IP.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Địa chỉ MAC và địa chỉ IP khác nhau ở điểm:", "options": ["A. MAC là địa chỉ vật lí không đổi, IP là địa chỉ logic có thể đổi theo mạng", "B. IP không đổi, MAC thay đổi", "C. MAC dài hơn IP luôn", "D. cả hai đều do người dùng tự đặt"], "answer": "A", "explain": "MAC (48 bit, tầng 2) gắn với card mạng, không đổi; IP (tầng 3) là địa chỉ logic, thay đổi theo mạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện thoại muốn vào mạng Wi-Fi của gia đình, thiết bị phát sóng là:", "options": ["A. Access Point", "B. Modem", "C. Repeater", "D. Card mạng"], "answer": "A", "explain": "Access Point phát sóng Wi-Fi, cầu nối mạng có dây với thiết bị không dây.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mạng công ty chậm vào giờ cao điểm, kiểm tra thấy đang dùng Hub cũ. Khắc phục hiệu quả nhất:", "options": ["A. thêm Hub nữa", "B. đổi mật khẩu", "C. thay Hub bằng Switch", "D. tắt bớt máy"], "answer": "C", "explain": "Hub gây đụng độ khi nhiều máy cùng truyền; thay bằng Switch để mỗi cổng một miền đụng độ riêng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Switch học địa chỉ MAC bằng cách nào?", "options": ["A. Hỏi người dùng", "B. Đoán mò", "C. Ghi nhớ địa chỉ MAC nguồn của khung đi qua mỗi cổng", "D. Đọc mật khẩu"], "answer": "C", "explain": "Switch quan sát địa chỉ MAC nguồn trong các khung đi qua và ghi nhớ cổng tương ứng vào bảng MAC.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về Access Point và Modem:", "statements": ["a) Access Point phát sóng Wi-Fi.", "b) Modem nối mạng nội bộ với Internet qua ISP.", "c) Modem chuyển đổi tín hiệu số và tương tự.", "d) Access Point định tuyến giữa các mạng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: định tuyến là Router.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về vai trò thiết bị:", "statements": ["a) Modem: ra Internet qua ISP.", "b) Router: nối các mạng.", "c) Access Point: Wi-Fi.", "d) Repeater: định tuyến."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: Repeater chỉ khuếch đại tín hiệu.", "points": 1}, {"type": "short", "level": "VD", "q": "Muốn nối 20 máy trong một phòng thành mạng LAN nên dùng ...?", "answer": "Switch", "explain": "Nối các máy trong cùng mạng: dùng Switch (hiệu quả, ít đụng độ).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trên Hub, mọi thiết bị chung một ... duy nhất? (3 từ)", "answer": "miền đụng độ", "explain": "Trace: Hub phát tới mọi cổng nên mọi thiết bị chung một miền đụng độ.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Switch (bộ chuyển mạch) hoạt động ở tầng nào của mô hình OSI?", "options": ["A. tầng 1", "B. tầng 1 – 2", "C. tầng 2", "D. tầng 2 (tầng liên kết dữ liệu)"], "answer": "D", "explain": "Switch (bộ chuyển mạch) hoạt động ở tầng 2 (tầng liên kết dữ liệu).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thiết bị nào có chức năng khuếch đại và tái tạo tín hiệu?", "options": ["A. Repeater (bộ lặp)", "B. Hub (bộ tập trung)", "C. Switch (bộ chuyển mạch)", "D. Router (bộ định tuyến)"], "answer": "A", "explain": "Repeater (bộ lặp): khuếch đại và tái tạo tín hiệu để mở rộng phạm vi truyền dẫn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tín hiệu mạng bị yếu ở cuối hành lang dài, giải pháp là dùng:", "options": ["A. Máy in để in", "B. Modem để gọi điện", "C. Repeater để khuếch đại tín hiệu", "D. Hub để phát tán"], "answer": "C", "explain": "Repeater khuếch đại và tái tạo tín hiệu, mở rộng phạm vi truyền dẫn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Access Point khác Router ở điểm chính nào?", "options": ["A. Router phát Wi-Fi", "B. cả hai giống nhau", "C. Access Point cầu nối không dây trong một mạng, Router kết nối các mạng khác nhau", "D. Access Point nhanh hơn Router"], "answer": "C", "explain": "Access Point phục vụ truy cập không dây trong mạng; Router nối các mạng khác nhau và định tuyến.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Gia đình lắp Internet cáp quang, nhà mạng cấp một thiết bị có 4 cổng LAN và Wi-Fi. Thiết bị đó tích hợp:", "options": ["A. Modem, Router và Access Point", "B. Repeater và loa", "C. Hub và máy in", "D. Switch và màn hình"], "answer": "A", "explain": "Thiết bị Wi-Fi gia đình của nhà mạng thường tích hợp Modem (quang), Router và Access Point.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một kẻ xấu giả mạo địa chỉ MAC để nghe lén. Biện pháp phòng ngừa ở tầng thiết bị là:", "options": ["A. dùng Hub", "B. tắt Switch", "C. bật tính năng bảo mật cổng (port security) trên Switch", "D. tháo card mạng"], "answer": "C", "explain": "Port security trên Switch giới hạn địa chỉ MAC được phép ở mỗi cổng, chống giả mạo MAC.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về tầng hoạt động:", "statements": ["a) Hub và Repeater hoạt động ở tầng 1.", "b) Switch hoạt động ở tầng 2.", "c) Router hoạt động ở tầng 3.", "d) Modem hoạt động ở tầng 3."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: Modem ở tầng 1.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về xử lí sự cố:", "statements": ["a) Mất Internet nhưng Wi-Fi còn: nghi đường Modem tới ISP.", "b) Một máy không vào mạng: kiểm tra card mạng, dây cáp.", "c) Mạng chậm do Hub cũ: thay bằng Switch.", "d) Mọi sự cố đều do virus."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Thiết bị kết nối các mạng khác nhau, định tuyến theo IP là ...?", "answer": "Router", "explain": "Router (tầng 3) kết nối các mạng khác nhau, định tuyến theo địa chỉ IP.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mất Internet nhưng Wi-Fi nội bộ vẫn dùng được, lỗi nhiều khả năng ở đoạn ... tới ISP? (1 từ)", "answer": "Modem", "explain": "Trace: Wi-Fi (nội bộ) còn nghĩa là Access Point ổn; mất Internet thì đường Modem ra ISP có vấn đề.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Modem hoạt động ở tầng nào của mô hình OSI?", "options": ["A. tầng 1", "B. tầng 3 (tầng mạng)", "C. tầng 1 – 2", "D. tầng 2"], "answer": "A", "explain": "Modem hoạt động ở tầng 1.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mỗi máy tính cần có gì để kết nối được vào mạng?", "options": ["A. Switch (bộ chuyển mạch)", "B. Hub (bộ tập trung)", "C. Router (bộ định tuyến)", "D. Card mạng (NIC)"], "answer": "D", "explain": "Card mạng (NIC): là phần cứng giúp từng thiết bị kết nối vào mạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Switch biết chuyển khung cho đúng máy đích nhờ vào:", "options": ["A. mật khẩu Wi-Fi", "B. địa chỉ IP", "C. địa chỉ MAC của card mạng", "D. tên người dùng"], "answer": "C", "explain": "Switch học và ghi nhớ địa chỉ MAC ở mỗi cổng để chuyển khung đúng đích.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi một máy gửi dữ liệu cho máy khác trong mạng dùng Hub, các máy còn lại:", "options": ["A. không nhận gì", "B. bị ngắt mạng", "C. tự tắt máy", "D. đều nhận được tín hiệu đó"], "answer": "D", "explain": "Hub phát tín hiệu tới mọi cổng nên mọi máy đều nhận được — gây lãng phí và đụng độ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một máy tính để bàn không có Wi-Fi muốn dùng mạng dây, cần kiểm tra trước tiên:", "options": ["A. máy có loa không", "B. máy có card mạng có dây và dây cáp tới Switch", "C. máy có đắt không", "D. máy có webcam không"], "answer": "B", "explain": "Máy bàn dùng mạng dây cần card mạng (NIC) có dây và cáp nối tới Switch.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi Switch chưa biết MAC đích ở cổng nào, nó xử lí thế nào?", "options": ["A. Gửi ra Internet", "B. Phát khung tới mọi cổng (trừ cổng nhận) như Hub", "C. Bỏ khung luôn", "D. Tắt nguồn"], "answer": "B", "explain": "Chưa biết MAC đích thì Switch phát khung ra mọi cổng; khi nhận phản hồi sẽ học và nhớ.", "points": 0.25}, {
