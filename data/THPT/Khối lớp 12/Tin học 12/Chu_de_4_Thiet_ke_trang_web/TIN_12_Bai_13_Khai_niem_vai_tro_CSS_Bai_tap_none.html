"q": "Sai tên thuộc tính CSS thì trình duyệt sẽ ... khai báo đó? (1 từ)", "answer": "bỏ qua", "explain": "Trace: thuộc tính sai tên bị bỏ qua, các khai báo đúng vẫn chạy. Đáp án: bỏ qua.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "File CSS ngoài thường có phần mở rộng:", "options": ["A. .js", "B. .css", "C. .png", "D. .html"], "answer": "B", "explain": "File CSS có phần mở rộng .css.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thẻ link tới file CSS đặt ở đâu?", "options": ["A. trong thẻ head", "B. ngoài thẻ html", "C. trong thẻ body", "D. trong thẻ p"], "answer": "A", "explain": "Thẻ link (rel stylesheet) đặt trong head.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thẻ link rel bằng stylesheet có tác dụng:", "options": ["A. chèn ảnh", "B. tạo liên kết văn bản", "C. liên kết file CSS ngoài vào trang", "D. tạo bảng"], "answer": "C", "explain": "link rel stylesheet href style.css: nạp file CSS ngoài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Học CSS giúp ích gì cho Bài 18 (thực hành tổng hợp)?", "options": ["A. không liên quan", "B. tự định dạng giao diện trang web của mình", "C. làm chậm web", "D. chỉ để thi"], "answer": "B", "explain": "CSS là công cụ định dạng giao diện cho trang web thực hành.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ba trang cùng dùng chung định dạng. Tổ chức:", "options": ["A. viết style mỗi trang", "B. không dùng CSS", "C. viết inline mọi thẻ", "D. một file style.css, mỗi trang thêm thẻ link"], "answer": "D", "explain": "Dùng chung → file CSS ngoài + thẻ link ở mỗi trang.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: viết toàn bộ CSS trong thuộc tính style của từng thẻ cho website 20 trang.", "options": ["A. Tốt nhất", "B. Không nên; khó bảo trì, lặp lại, không tái sử dụng", "C. Không sao", "D. Nên, đơn giản"], "answer": "B", "explain": "Inline cho cả website: ác mộng bảo trì — nên dùng file ngoài.", "points": 0.25}, {"type": "tru
