ng định nghĩa", "D. mỗi thẻ một màu"], "answer": "A", "explain": "Màu sắc nhất quán: định nghĩa tập trung trong file CSS ngoài.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thiết kế nút: bình thường nền xanh, di chuột nền đậm hơn. Viết:", "options": ["A. dùng ảnh", "B. nền xanh cho nút, nền xanh đậm cho trạng thái hover", "C. không CSS", "D. chỉ một màu"], "answer": "B", "explain": "Hai trạng thái: thường và hover (di chuột) với màu đậm hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đoạn mã: color: red rồi color: blue trong cùng quy tắc. Màu chữ là:", "options": ["A. đỏ", "B. báo lỗi", "C. xanh (blue) vì khai báo sau thắng", "D. tím"], "answer": "C", "explain": "Trace: cùng thuộc tính, cùng độ ưu tiên → khai báo sau thắng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về màu chữ/nền:", "statements": ["a) color là màu chữ.", "b) background-color là màu nền.", "c) color là màu nền.", "d) Có thể đặt cả hai cùng lúc."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về ảnh nền:", "statements": ["a) url() chỉ file ảnh.", "b) no-repeat không lặp.", "c) cover phủ kín.", "d) contain vừa khít."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Mã hex của màu đỏ là ...? (ghi cả dấu #)", "answer": "#ff0000", "explain": "#ff0000: đỏ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "rgb(0, 0, 0) là màu ...? (1 từ)", "answer": "đen", "explain": "Trace: không có thành phần nào → đen. Đáp án: đen.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Thuộc tính CSS đặt màu chữ là:", "options": ["A. font-size", "B. color", "C. background-color", "D. text-align"], "answer": "B", "explain": "color: màu chữ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tắc chọn màu chữ và nền là:", "options": ["A. cùng màu nhau", "B. tùy hứng", "C. tương phản đủ để dễ đọc", "D. càng lòe loẹt càng tốt"], "answer": "C", "explain": "Chữ tối/nền sáng hoặc ngược lại để dễ đọc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "rgb(0, 0, 0) là màu:", "options": ["A. xanh", "B. trắng", "C. đỏ", "D. đen"], "answer": "D", "explain": "rgb(0,0,0): không có thành phần nào → đen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đoạn mã: h1 với color white và background-color darkblue. Hiển thị:", "options": ["A. không hiện", "B. chữ xanh trên nền trắng", "C. chữ đen", "D. chữ trắng trên nền xanh đậm"], "answer": "D", "explain": "Trace: color là chữ, background-color là nền.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tìm lỗi: background-color: #gggggg. Kết quả:", "options": ["A. màu không hợp lệ, bị bỏ qua", "B. thành đen", "C. báo lỗi", "D. thành màu xám"], "answer": "A", "explain": "Trace: g không phải kí tự hexa → mã màu sai, bị bỏ qua.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao alpha hữu ích khi đặt chữ lên ảnh nền?", "options": ["A. Vì làm chữ/nền trong suốt vừa phải để vừa đọc được vừa thấy ảnh", "B. Vì đẹp", "C. Vì nhanh", "D. Không hữu ích"], "answer": "A", "explain": "rgba giúp cân bằng: chữ vẫn đọc được mà ảnh nền vẫn thấy.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về alpha:", "statements": ["a) alpha từ 0 đến 1.", "b) 0.5 là trong suốt một nửa.", "c) Chỉ có trong rgba.", "d) alpha là độ sáng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: là độ trong suốt.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về opacity và rgba:", "statements": ["a) opacity làm cả phần tử trong suốt.", "b) rgba chỉ màu đó trong suốt.", "c) Cả hai giống nhau.", "d) Chữ trên ảnh nên dùng rgba."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Màu chữ và màu nền cần ... để dễ đọc? (2 từ)", "answer": "tương phản", "explain": "Tương phản a) Tên màu: red.", "b) Hex: #ff0000.", "c) rgb(255,0,0) là đỏ.", "d) Hex không cần dấu #."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: hex bắt đầu bằng #.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về khai báo sau thắng:", "statements": ["a) Cùng thuộc tính, khai báo sau thắng.", "b) color: red rồi blue thì chữ xanh.", "c) Khai báo trước luôn thắng.", "d) Cùng độ ưu tiên mới xét thứ tự."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Giá trị làm ảnh nền không lặp lại là ...? (1 từ)", "answer": "no-repeat", "explain": "background-repeat: no-repeat.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chữ vàng trên nền trắng có dễ đọc không? (Có/Không)", "answer": "Không", "explain": "Trace: tương phản kém → khó đọc.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Mã hex của màu đỏ là:", "options": ["A. #ff0000", "B. #00ff00", "C. #0000ff", "D. #ffffff"], "answer": "A", "explain": "#ff0000: đỏ (cặp đầu ff, hai cặp sau 00).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cặp màu nào khó đọc?", "options": ["A. chữ đỏ trên nền trắng", "B. chữ trắng trên nền xanh đậm", "C. chữ vàng trên nền trắng", "D. chữ đen trên nền trắng"], "answer": "C", "explain": "Chữ vàng trên nền trắng tương phản kém, khó đọc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "#0000ff là màu gì?", "options": ["A. đen", "B. xanh dương", "C. xanh lá", "D. đỏ"], "answer": "B", "explain": "#0000ff: cặp cuối ff → xanh dương (blue).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "#00ff00 là màu gì?", "options": ["A. xanh lá", "B. trắng", "C. đỏ", "D. xanh dương"], "answer": "A", "explain": "#00ff00: cặp giữa ff → xanh lá (green).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chuyển rgb(255, 0, 0) sang hex:", "options": ["A. #ffffff", "B. #00ff00", "C. #0000ff", "D. #ff0000"], "answer": "D", "explain": "255 → ff: rgb(255,0,0) = #ff0000.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So sánh opacity và rgba về trong suốt:", "options": ["A. rgba làm cả phần tử", "B. opacity làm cả phần tử (kể cả chữ) trong suốt, rgba chỉ màu đó trong suốt", "C. giống nhau", "D. opacity chỉ màu"], "answer": "B", "explain": "opacity: cả khối trong suốt; rgba: chỉ màu được gán trong suốt.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về thực hành:", "statements": ["a) Nên định nghĩa màu trong file CSS ngoài.", "b) Website nên ít màu, hài hòa.", "c) Mỗi thẻ một màu là tốt.", "d) Màu thương hiệu nên dùng hex."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai: gây rối.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về alpha:", "statements": ["a) 0: trong suốt.", "b) 1: đục.", "c) 0.5: một nửa.", "d) 2: rất đục."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: alpha chỉ 0–1.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong rgba, alpha bằng 0 nghĩa là ...? (2 từ)", "answer": "trong suốt", "explain": "alpha 0: trong suốt hoàn toàn. Đáp án: trong suốt.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "alpha bằng 1 nghĩa là ...? (1 từ)", "answer": "đục", "explain": "Trace: alpha 1: đục hoàn toàn. Đáp án: đục.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "rgba(255, 0, 0, 0.5) là màu:", "options": ["A. đỏ trong suốt một nửa", "B. đen", "C. đỏ đục", "D. xanh trong suốt"], "answer": "A", "explain": "alpha 0.5: trong suốt một nửa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mã hex bắt đầu bằng kí tự:", "options": ["A. @", "B. %", "C. #", "D. $"], "answer": "C", "explain": "Mã hex bắt đầu bằng dấu #.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mã hex #abc tương đương:", "options": ["A. #abccba", "B. #aabbcc", "C. #aabb", "D. #abcabc"], "answer": "B", "explain": "Rút gọn: mỗi kí tự nhân đôi → #aabbcc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên dùng chữ xám nhạt trên nền trắng?", "options": ["A. Vì chậm", "B. Vì xấu", "C. Vì bị cấm", "D. Vì tương phản kém, khó đọc"], "answer": "D", "explain": "Tương phản kém gây khó đọc, mỏi mắt.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trang web chữ đen nền trắng muốn thêm khối nổi bật. Nên:", "options": ["A. không thêm", "B. khối nền xanh nhạt với chữ xanh đậm", "C. khối nền xám chữ xám nhạt", "D. khối nền vàng chữ trắng"], "answer": "B", "explain": "Khối nổi bật: nền xanh nhạt + chữ xanh đậm tương phản tốt, hài hòa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thiết kế dark mode cần lưu ý:", "options": ["A. giữ nguyên", "B. đảo tương phản: nền tối, chữ sáng, giảm chói", "C. chỉ đổi nền", "D. không cần"], "answer": "B", "explain": "Dark mode: nền tối + chữ sáng, tránh màu quá chói.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về ví dụ:", "statements": ["a) rgb(0,0,0) là đen.", "b) rgb(255,255,255) là trắng.", "c) #00ff00 là xanh lá.", "d) #ff0000 là xanh dương."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về chuyển đổi:", "statements": ["a) rgb(255,0,0) bằng #ff0000.", "b) #00ff00 bằng rgb(0,255,0).", "c) 255 trong thập phân bằng ff trong hexa.", "d) #ff0000 bằng rgb(0,255,0)."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Mã hex của màu trắng là ...? (ghi cả dấu #)", "answer": "#ffffff", "explain": "#ffffff: trắng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "#00ff00 là màu ...? (2 từ)", "answer": "xanh lá", "explain": "Trace: cặp giữa ff → green. Đáp án: xanh lá.", "points": 0.5}]}]}</script>
