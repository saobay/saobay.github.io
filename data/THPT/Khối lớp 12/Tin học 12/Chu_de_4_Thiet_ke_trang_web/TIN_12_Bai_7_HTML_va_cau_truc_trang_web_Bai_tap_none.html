 "body", "explain": "Thẻ body chứa nội dung hiển thị: tiêu đề, đoạn văn, ảnh...", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thẻ mở sau phải ... trước khi lồng nhau? (1 từ)", "answer": "đóng", "explain": "Trace: nguyên tắc ngăn xếp — thẻ mở sau phải đóng trước.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Phần tử gốc của trang web là:", "options": ["A. thẻ title", "B. thẻ body", "C. thẻ head", "D. thẻ html"], "answer": "D", "explain": "Thẻ html là phần tử gốc, bao toàn bộ trang web.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nội dung của thẻ title hiển thị ở đâu?", "options": ["A. cuối trang web", "B. trên thanh tab của trình duyệt", "C. trong địa chỉ web", "D. giữa trang web"], "answer": "B", "explain": "Nội dung thẻ title hiện trên thanh tab (thẻ) của trình duyệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao giá trị thuộc tính nên đặt trong dấu nháy kép?", "options": ["A. Để trình duyệt phân biệt rõ ranh giới giá trị, tránh lỗi khi có dấu cách", "B. Không cần thiết", "C. Để nhanh", "D. Để đẹp"], "answer": "A", "explain": "Dấu nháy giúp xác định rõ giá trị, tránh lỗi khi giá trị có dấu cách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thẻ title đặt trong phần nào của trang?", "options": ["A. thẻ html trực tiếp", "B. ngoài thẻ html", "C. thẻ head", "D. thẻ body"], "answer": "C", "explain": "Thẻ title nằm trong head; nội dung hiện trên thanh tab.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đoạn mã có hai thẻ h1 liên tiếp với chữ khác nhau. Hiển thị:", "options": ["A. không hiện", "B. báo lỗi trùng", "C. hai dòng tiêu đề lớn liên tiếp", "D. một dòng"], "answer": "C", "explain": "Trace: mỗi thẻ h1 tạo một tiêu đề cấp 1 trên dòng riêng; HTML cho phép nhiều h1 (dù nên hạn chế).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao không nên dùng nhiều thẻ br liên tiếp để tạo khoảng trống lớn?", "options": ["A. Vì br chỉ để ngắt dòng; khoảng cách trình eb thiếu thẻ đóng html thì:", "options": ["A. trình duyệt vẫn cố hiển thị nhưng mã không chuẩn", "B. tự đóng giúp nên không sao", "C. báo lỗi đỏ", "D. không hiển thị gì"], "answer": "A", "explain": "Trình duyệt thường cố hiển thị, nhưng mã thiếu thẻ đóng là không chuẩn, dễ lỗi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong thẻ mở html lang bằng vi, lang là gì, vi là gì?", "options": ["A. lang là thẻ, vi là thuộc tính", "B. cả hai đều là giá trị", "C. lang là thuộc tính, vi là giá trị", "D. cả hai đều là thẻ"], "answer": "C", "explain": "Trong html lang=\"vi\": lang là tên thuộc tính, vi là giá trị.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Muốn chèn chú thích Tác giả: An trong mã mà không hiện ra trang, viết:", "options": ["A. thẻ p chứa chữ", "B. xóa đi", "C. thẻ h1 chứa chữ", "D. ngoặc nhọn chấm than hai gạch ngang, chữ Tác giả: An, hai gạch ngang ngoặc nhọn"], "answer": "D", "explain": "Trace: chú thích Tác giả: An viết trong cặp dấu chú thích — trình duyệt bỏ qua khi hiển thị.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thuộc tính không có giá trị trong dấu nháy (ví dụ lang=vi không có nháy) thì:", "options": ["A. bỏ qua thuộc tính", "B. báo lỗi ngay", "C. trình duyệt thường vẫn hiểu, nhưng không chuẩn và dễ lỗi khi giá trị có dấu cách", "D. trang trắng"], "answer": "C", "explain": "Trace: HTML cho phép (với giá trị đơn giản) nhưng không chuẩn; giá trị có dấu cách sẽ bị cắt sai.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về thẻ:", "statements": ["a) Thẻ đóng có thêm dấu gạch chéo.", "b) Phần tử gồm thẻ mở, nội dung và thẻ đóng.", "c) Thẻ br là thẻ rỗng.", "d) Mọi thẻ đều có thẻ đóng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: thẻ rỗng (br, hr, img, input, meta) không có thẻ đóng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về thuộc tính:", "statements": ["a) lang bằng vi khai báo tiếng Việt.", "b) Giá trị nên trong dấu nháy kép.", "c) Thuộc g mã không chuẩn, dễ lỗi khi thêm nội dung"], "answer": "D", "explain": "Trace: trình duyệt cố đoán và hiển thị, nhưng mã không chuẩn, dễ phát sinh lỗi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một trang có doctype html nhưng không có thẻ html bao ngoài. Đánh giá:", "options": ["A. không hiển thị", "B. hoàn toàn đúng chuẩn", "C. bị cấm", "D. trình duyệt vẫn hiển thị, nhưng thiếu phần tử gốc là không chuẩn"], "answer": "D", "explain": "Trace: thiếu phần tử gốc html là sai cấu trúc chuẩn dù trình duyệt vẫn cố hiển thị.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về meta charset:", "statements": ["a) Đặt trong thẻ head.", "b) Giá trị UTF-8 hiển thị đúng tiếng Việt.", "c) Thiếu có thể gây lỗi font.", "d) Đặt trong thẻ body."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá đoạn mã: thẻ p mở, chữ Xin chào, thẻ p đóng:", "statements": ["a) Đây là một phần tử đầy đủ.", "b) Trình duyệt hiển thị một đoạn văn.", "c) Thiếu thẻ đóng.", "d) Bị lỗi."], "answer": ["T", "T", "F", "F"], "explain": "a), b) đúng. c), d) sai: đủ thẻ mở, nội dung, thẻ đóng.", "points": 1}, {"type": "short", "level": "VD", "q": "Thẻ ... tạo đường kẻ ngang? (1 từ)", "answer": "hr", "explain": "Thẻ hr (thẻ rỗng) tạo đường kẻ ngang phân cách nội dung.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Không nên dùng nhiều thẻ br liên tiếp để tạo khoảng trống vì đó là việc của ...? (3 từ)", "answer": "CSS", "explain": "Trace: br chỉ ngắt dòng; khoảng cách trình bày là việc của CSS. Đáp án: CSS.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Thẻ head chứa:", "options": ["A. hình ảnh", "B. video", "C. nội dung hiển thị", "D. thông tin về trang web (không hiển thị trực tiếp)"], "answer": "D", "explain": "Thẻ head chứa thông tin về trang: meta, title... (không hiển thị trực tiếp).", "points": 0.25}, {"type": "mcq", "level": "
