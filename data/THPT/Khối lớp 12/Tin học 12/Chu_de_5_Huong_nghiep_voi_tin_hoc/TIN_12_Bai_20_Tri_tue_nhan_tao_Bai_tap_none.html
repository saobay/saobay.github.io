ons": [{"type": "mcq", "level": "NB", "q": "Kĩ năng quan trọng cho nghề AI:", "options": ["A. hát hay", "B. toán và lập trình Python", "C. chạy nhanh", "D. vẽ tranh"], "answer": "B", "explain": "Nghề AI cần toán (đại số, xác suất) và Python.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Học sâu (deep learning) dùng:", "options": ["A. bảng tính", "B. mạng nơ-ron nhiều lớp", "C. giấy bút", "D. một quy tắc"], "answer": "B", "explain": "Học sâu: mạng nơ-ron nhiều lớp, mạnh trong nhận diện ảnh, giọng nói.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "AI chấm bài giúp giáo viên:", "options": ["A. tiết kiệm thời gian chấm trắc nghiệm", "B. thay giáo viên", "C. cho điểm bừa", "D. không giúp"], "answer": "A", "explain": "AI hỗ trợ, giáo viên vẫn quyết định cuối.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận diện giọng nói thuộc:", "options": ["A. không phải AI", "B. AI (học sâu)", "C. phần cứng", "D. mạng máy tính"], "answer": "B", "explain": "Nhận diện giọng nói: học sâu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "HS dùng AI tóm tắt sách rồi chỉ đọc tóm tắt. Đánh giá:", "options": ["A. nên làm", "B. hiệu quả", "C. mất cơ hội rèn tư duy đọc hiểu", "D. rất tốt"], "answer": "C", "explain": "Tóm tắt chỉ hỗ trợ; đọc gốc mới rèn tư duy.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "AI có thể thay giáo viên không?", "options": ["A. Sắp tới", "B. Có", "C. Không, AI chỉ hỗ trợ; giáo dục cần con người", "D. Một phần lớn"], "answer": "C", "explain": "Giáo dục cần tương tác, cảm xúc, định hướng con người.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về nghề:", "statements": ["a) Kĩ sư học máy.", "b) Xử lý ngôn ngữ tự nhiên.", "c) Thị giác máy tính.", "d) Thợ sửa xe."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về trách nhiệm:", "statements": ["a) Kiểm chứng output.", "b) Minh bạch khi dùng.", "c) Tôn trọng riêng tư.", "d) Dùng bừa cũng được."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai.", "points": 1}, {"type": "short", "level": "VD", "q": "AI tạo nội dung mới gọi là AI tạo ...? (1 từ)", "answer": "sinh", "explain": "AI tạo sinh. Đáp án: sinh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "AI có thể thay hoàn toàn giáo viên không? (Có/Không)", "answer": "Không", "explain": "Trace: giáo dục cần con người. Đáp án: Không.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Xe tự lái thuộc ứng dụng AI trong:", "options": ["A. giao thông", "B. giáo dục", "C. nông nghiệp", "D. y tế"], "answer": "A", "explain": "Xe tự lái: AI trong giao thông.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dịch máy là ứng dụng AI trong:", "options": ["A. y tế", "B. xây dựng", "C. giao thông", "D. ngôn ngữ"], "answer": "D", "explain": "Dịch máy, chatbot: AI xử lý ngôn ngữ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dữ liệu huấn luyện có định kiến giới tính thì AI sẽ:", "options": ["A. không ảnh hưởng", "B. tự sửa", "C. ra quyết định thiên kiến", "D. rất công bằng"], "answer": "C", "explain": "AI học theo dữ liệu → dữ liệu thiên kiến cho AI thiên kiến.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tóm tắt văn bản tự động thuộc:", "options": ["A. AI giao thông", "B. không phải AI", "C. AI xử lý ngôn ngữ", "D. AI y tế"], "answer": "C", "explain": "Tóm tắt văn bản: NLP.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tin nhắn lừa đảo dùng giọng AI giả người thân. Cách phòng:", "options": ["A. chuyển tiền", "B. tin ngay", "C. xác minh qua kênh khác trước khi chuyển tiền", "D. không nghe"], "answer": "C", "explain": "AI giả giọng → luôn xác minh độc lập.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "AI tạo sinh và bản quyền: tranh cãi về:", "options": ["A. AI miễn phí", "B. dùng tác phẩm có bản quyền để huấn luyện", "C. không tranh cãi", "D. AI không cần dữ liệu"], "answer": "B", "explain": "Huấn luyện trên tác phẩm có bản quyền gây tranh cãi pháp lý.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về kĩ năng:", "statements": ["a) Toán.", "b) Lập trình Python.", "c) Ngoại ngữ.", "d) Chỉ cần chơi game."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về kiểm chứng:", "statements": ["a) AI có thể sai.", "b) Luôn kiểm tra lại.", "c) Tin tuyệt đối.", "d) Nhất là thuật ngữ chuyên ngành."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Người đảm bảo AI công bằng, an toàn gọi là chuyên gia đạo đức ...? (1 từ)", "answer": "AI", "explain": "Chuyên gia đạo đức AI. Đáp án: AI.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Học sâu là nhánh của ...? (2 từ)", "answer": "học máy", "explain": "Trace: học sâu thuộc học máy. Đáp án: học máy.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Thị giác máy tính là AI giúp máy:", "options": ["A. hiểu hình ảnh, video", "B. vẽ tranh", "C. chụp ảnh", "D. nhìn bằng mắt"], "answer": "A", "explain": "Thị giác máy tính: máy hiểu ảnh/video.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vấn đề quyền riêng tư với AI:", "options": ["A. AI thu thập, dùng dữ liệu cá nhân", "B. AI bảo mật tuyệt đối", "C. không vấn đề", "D. AI không cần dữ liệu"], "answer": "A", "explain": "AI cần nhiều dữ liệu → nguy cơ lộ thông tin cá nhân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao công ty công nghệ đầu tư mạnh vào AI?", "options": ["A. Vì AI tạo giá trị lớn nhiều lĩnh vực", "B. Vì mốt", "C. Vì rẻ", "D. Vì dễ"], "answer": "A", "explain": "AI: năng suất, sản phẩm mới, lợi thế cạnh tranh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cách dùng AI đúng trong học tập:", "options": ["A. copy nguyên", "B. nhờ làm hết", "C. hỏi gợi ý, tự làm và hiểu", "D. không dùng"], "answer": "C", "explain": "AI là trợ lý học tập, không thay việc học.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "AI gợi ý nghề nghiệp dựa trên điểm số. Hạn chế:", "options": ["A. rất tốt", "B. có thể thiên kiến, bỏ qua đam mê", "C. luôn đúng", "D. không hạn chế"], "answer": "B", "explain": "Gợi ý chỉ tham khảo; cần cân nhắc đam mê, hoàn cảnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tương lai nghề AI:", "options": ["A. không cần", "B. giảm", "C. nhu cầu cao, cần học suốt đời", "D. biến mất"], "answer": "C", "explain": "AI phát triển nhanh → cần nhân lực và học liên tục.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về giáo dục:", "statements": ["a) AI chấm bài.", "b) Học liệu cá nhân hóa.", "c) Chatbot hỏi đáp.", "d) AI thay giáo viên."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: chỉ hỗ trợ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về y tế:", "statements": ["a) AI hỗ trợ chẩn đoán.", "b) Bác sĩ quyết định cuối.", "c) Tin AI tuyệt đối.", "d) Sai lầm y tế nguy hiểm."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Máy hiểu ngôn ngữ con người gọi là xử lý ngôn ngữ tự ...? (1 từ)", "answer": "nhiên", "explain": "Xử lý ngôn ngữ tự nhiên (NLP). Đáp án: nhiên.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "AI càng mạnh thì càng ít cần kiểm soát đạo đức? (Đúng/Sai)", "answer": "Sai", "explain": "Trace: càng mạnh càng cần kiểm soát. Đáp án: Sai.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Học sâu là:", "options": ["A. một nhánh của phần cứng", "B. một nhánh của học máy", "C. môn thể thao", "D. không liên quan AI"], "answer": "B", "explain": "Học sâu là nhánh của học máy; học máy là nhánh của AI.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chatbot dùng AI để:", "options": ["A. nghe nhạc", "B. trò chuyện, trả lời câu hỏi", "C. không làm gì", "D. chơi game"], "answer": "B", "explain": "Chatbot: AI xử lý ngôn ngữ để hội thoại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dùng AI làm bài tập rồi nộp như của mình thì:", "options": ["A. rất tốt", "B. thiếu trung thực", "C. sáng tạo", "D. không sao"], "answer": "B", "explain": "Dùng AI gian lận: thiếu trung thực học thuật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "AI có hiểu như con người không?", "options": ["A. Không, AI chỉ xử lý mẫu trong dữ liệu", "B. Không cần biết", "C. Có, hiểu hết", "D. Hơn người"], "answer": "A", "explain": "AI không có ý thức, chỉ tìm mẫu thống kê.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "AI chấm thi viết cho điểm khác nhau cùng một bài. Vấn đề:", "options": ["A. thiếu nhất quán, cần con người kiểm tra", "B. rất tốt", "C. không sao", "D. bình thường"], "answer": "A", "explain": "AI có thể thiếu nhất quán → cần giám sát con người.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "AI càng thông minh thì càng ít cần đạo đức?", "options": ["A. Tùy", "B. Sai, càng mạnh càng cần kiểm soát", "C. Không liên quan", "D. Đúng"], "answer": "B", "explain": "AI mạnh → ảnh hưởng lớn → càng cần đạo đức, kiểm soát.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về quan hệ:", "statements": ["a) AI chứa học máy.", "b) Học máy chứa học sâu.", "c) Học sâu chứa AI.", "d) Ba cấp lồng nhau."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về thiên kiến:", "statements": ["a) Dữ liệu thiên kiến cho AI thiên kiến.", "b) Cần dữ liệu đa dạng.", "c) AI tự loại thiên kiến.", "d) Cần kiểm tra công bằng."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Nội dung giả mạo do AI tạo gọi là tin ...? (1 từ)", "answer": "giả", "explain": "Tin giả. Đáp án: giả.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dữ liệu huấn luyện thiên kiến thì AI có công bằng không? (Có/Không)", "answer": "Không", "explain": "Trace: AI học theo dữ liệu. Đáp án: Không.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "AI ảnh hưởng việc làm vì:", "options": ["A. tự động hóa thay thế một số công việc", "B. AI nghỉ việc", "C. AI không ảnh hưởng", "D. AI tạo việc làm mới"], "answer": "A", "explain": "Tự động hóa thay thế việc lặp lại; đồng thời tạo nghề mới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Học máy (machine learning) là:", "options": ["A. máy tự học từ dữ liệu", "B. dạy máy tính", "C. máy học thuộc lòng", "D. học sinh học máy"], "answer": "A", "explain": "Học máy: máy tự học từ dữ liệu thay vì lập trình từng quy tắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Học sinh muốn theo nghề AI nên:", "options": ["A. học tốt Toán, Tin, tiếng Anh", "B. không cần học", "C. bỏ Toán", "D. chỉ chơi game"], "answer": "A", "explain": "Nền tảng: Toán + Tin + tiếng Anh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xử lý ngôn ngữ tự nhiên giúp máy:", "options": ["A. nói tiếng máy", "B. hiểu và tạo ngôn ngữ con người", "C. không hiểu", "D. chỉ dịch"], "answer": "B", "explain": "NLP: máy hiểu/tạo ngôn ngữ (dịch, chatbot, tóm tắt).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Doanh nghiệp dùng AI sàng lọc hồ sơ. Rủi ro:", "options": ["A. luôn công bằng", "B. nhanh hơn", "C. loại oan người tốt do thiên kiến dữ liệu cũ", "D. rẻ hơn"], "answer": "C", "explain": "Cần kiểm tra công bằng của AI tuyển dụng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "An nói AI hiểu như người, Bình nói AI chỉ xử lý mẫu. Ai đúng?", "options": ["A. Bình đúng", "B. An đúng", "C. Cả hai", "D. Tùy"], "answer": "A", "explain": "AI không có ý thức, chỉ tìm mẫu thống kê trong dữ liệu.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về AI:", "statements": ["a) AI giúp máy làm việc cần trí tuệ người.", "b) AI là Artificial Intelligence.", "c) AI là máy tính nhanh.", "d) Mở khóa khuôn mặt là AI."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về việc làm:", "statements": ["a) AI thay thế việc lặp lại.", "b) Tạo nghề mới.", "c) Con người cần học kĩ năng mới.", "d) AI thay hết mọi việc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Xe không người lái gọi là xe tự ...? (1 từ)", "answer": "lái", "explain": "Xe tự lái. Đáp án: lái.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dùng ảnh HS cho AI điểm danh cần sự ... của phụ huynh? (1 từ)", "answer": "đồng ý", "explain": "Trace: dữ liệu nhạy cảm cần đồng ý. Đáp án: đồng ý.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tin giả do AI tạo ra là:", "options": ["A. tin vui", "B. tin cũ", "C. tin thật", "D. nội dung giả mạo khó phân biệt"], "answer": "D", "explain": "AI tạo sinh có thể tạo tin giả, ảnh giả.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trí tuệ nhân tạo (AI) là:", "options": ["A. máy chơi game", "B. máy tính nhanh hơn", "C. robot biết đi", "D. máy thực hiện nhiệm vụ cần trí tuệ con người"], "answer": "D", "explain": "AI: máy làm việc cần trí tuệ người (nhận biết, hiểu, quyết định, học).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một số công việc bị AI thay thế, con người nên:", "options": ["A. không làm gì", "B. học kĩ năng mới, làm việc cùng AI", "C. chống AI", "D. bỏ học"], "answer": "B", "explain": "Thích ứng: học suốt đời, kĩ năng sáng tạo, làm việc với AI.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "AI dự báo tắc đường dùng dữ liệu:", "options": ["A. không cần", "B. cảm biến giao thông, GPS", "C. giá xăng", "D. thời tiết"], "answer": "B", "explain": "Dữ liệu giao thông thời gian thực → dự báo.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trường muốn chatbot t
