", "options": ["A. trực quan hóa", "B. phân tích", "C. thu thập", "D. tiền xử lý"], "answer": "D", "explain": "Chuẩn hóa đơn vị = làm sạch dữ liệu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trực quan hóa giúp người không chuyên:", "options": ["A. rối hơn", "B. không hiểu gì", "C. không cần", "D. hiểu nhanh kết quả phân tích"], "answer": "D", "explain": "Biểu đồ giúp mọi người hiểu nhanh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bảng lương có đơn vị triệu và nghìn lẫn lộn. Cần:", "options": ["A. bỏ qua", "B. xóa bảng", "C. chuẩn hóa đơn vị (tiền xử lý)", "D. phân tích ngay"], "answer": "C", "explain": "Đơn vị không nhất quán → chuẩn hóa trước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Quyền riêng tư trong KHDL yêu cầu:", "options": ["A. không cần", "B. bán dữ liệu", "C. ẩn danh, bảo mật dữ liệu cá nhân", "D. công khai hết"], "answer": "C", "explain": "Dữ liệu cá nhân phải được ẩn danh, bảo mật.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Các phát biểu sau về quy trình:", "statements": ["a) Bước 1 là thu thập.", "b) Bước 2 là tiền xử lý.", "c) Bước cuối là ra quyết định.", "d) Bước 1 là ra quyết định."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về quyết định:", "statements": ["a) Nên dựa trên dữ liệu.", "b) Khách quan hơn cảm tính.", "c) Cảm tính của sếp luôn đúng.", "d) Dữ liệu hỗ trợ quyết định tốt."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Ngôn ngữ lập trình phổ biến trong KHDL là ...? (1 từ)", "answer": "Python", "explain": "Python phổ biến nhất trong KHDL. Đáp án: Python.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mẫu chỉ gồm HS giỏi có đại diện cả trường không? (Có/Không)", "answer": "Không", "explain": "Trace: mẫu thiên lệch → kết luận sai. Đáp án: Không.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "
