{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Hội nghị nào (tháng 2/1945) đã nhất trí thành lập một tổ chức quốc tế mới thay thế Hội Quốc liên?", "options": ["A. Hội nghị I-an-ta", "B. Hội nghị Pốt-xđam", "C. Hội nghị Xan Phran-xi-xcô", "D. Hội nghị Giơ-ne-vơ"], "answer": "A", "explain": "Tại Hội nghị I-an-ta (2/1945), lãnh đạo Liên Xô, Mỹ, Anh nhất trí thành lập tổ chức quốc tế mới để duy trì hòa bình sau chiến tranh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiến chương Liên hợp quốc được thông qua tại hội nghị nào?", "options": ["A. Hội nghị I-an-ta", "B. Hội nghị Xan Phran-xi-xcô", "C. Hội nghị Pốt-xđam", "D. Hội nghị Tê-hê-ran"], "answer": "B", "explain": "Hội nghị Xan Phran-xi-xcô (25/4-26/6/1945) với sự tham dự của 50 nước đã thảo luận và thông qua Hiến chương Liên hợp quốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiến chương Liên hợp quốc được ký kết ngày 26/6/1945 và chính thức có hiệu lực vào ngày nào?", "options": ["A. 25/4/1945", "B. 24/10/1945", "C. 26/6/1945", "D. 24/10/1946"], "answer": "B", "explain": "Hiến chương được ký ngày 26/6/1945 và có hiệu lực ngày 24/10/1945; từ đó 24/10 hằng năm là Ngày Liên hợp quốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ngày 24/10 hằng năm được chọn làm Ngày Liên hợp quốc?", "options": ["A. Vì đó là ngày ký Hiến chương", "B. Vì đó là ngày Hiến chương có hiệu lực", "C. Vì đó là ngày họp Đại hội đồng đầu tiên", "D. Vì đó là ngày kết thúc Chiến tranh thế giới thứ hai"], "answer": "B", "explain": "Ngày 24/10/1945 Hiến chương Liên hợp quốc chính thức có hiệu lực nên được lấy làm Ngày Liên hợp quốc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tên gọi Liên hợp quốc (United Nations) do ai đề xuất?", "options": ["A. Tổng thống Ru-dơ-ven (Mỹ)", "B. Tổng Bí thư Xta-lin (Liên Xô)", "C. Thủ tướng Sớc-sin (Anh)", "D. Tổng thống Truman (Mỹ)"], "answer": "A", "explain": "Tên gọi Liên hợp quốc do Tổng thống Mỹ Ru-dơ-ven đề xuất trong thời gian Chiến tranh thế giới thứ hai.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hội nghị Xan Phran-xi-xcô (1945) có đại biểu của bao nhiêu nước tham dự?", "options": ["A. 44 nước", "B. 50 nước", "C. 26 nước", "D. 51 nước"], "answer": "B", "explain": "Hội nghị có đại biểu của 50 nước tham dự; Hiến chương sau đó được 51 nước ký (Ba Lan ký bổ sung).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về sự ra đời của Liên hợp quốc:", "statements": ["a) Liên hợp quốc ra đời trong bối cảnh Chiến tranh thế giới thứ hai sắp kết thúc.", "b) Hiến chương Liên hợp quốc được ký ngày 26/6/1945 tại Xan Phran-xi-xcô.", "c) Hiến chương có hiệu lực ngày 24/10/1945.", "d) Hội Quốc liên tiếp tục tồn tại song song với Liên hợp quốc sau năm 1945."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng theo SGK. d) sai: Hội Quốc liên chấm dứt hoạt động năm 1946, được Liên hợp quốc thay thế.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hội nghị I-an-ta có sự tham dự của lãnh đạo Liên Xô, Mỹ và Anh.", "b) Hội nghị Xan Phran-xi-xcô họp từ ngày 25/4 đến 26/6/1945.", "c) Trụ sở chính của Liên hợp quốc đặt tại Giơ-ne-vơ (Thụy Sĩ).", "d) Tên gọi Liên hợp quốc do Tổng thống Mỹ Ru-dơ-ven đề xuất."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai: trụ sở chính của Liên hợp quốc đặt tại Niu Oóc (Hoa Kỳ).", "points": 1}, {"type": "short", "level": "VD", "q": "Hiến chương Liên hợp quốc được thông qua vào tháng 6 năm nào?", "answer": "1945", "explain": "Hội nghị Xan Phran-xi-xcô thông qua Hiến chương ngày 26/6/1945.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiến chương Liên hợp quốc được ký kết tại thành phố nào của Hoa Kỳ?", "answer": "Xan Phran-xi-xcô", "explain": "Hiến chương được ký ngày 26/6/1945 tại thành phố Xan Phran-xi-xcô (San Francisco), Hoa Kỳ.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Mục đích hàng đầu của Liên hợp quốc được ghi trong Hiến chương là gì?", "options": ["A. Duy trì hòa bình và an ninh quốc tế", "B. Xóa bỏ hoàn toàn vũ khí hạt nhân", "C. Thống nhất tiền tệ thế giới", "D. Xây dựng quân đội chung toàn cầu"], "answer": "A", "explain": "Mục đích đầu tiên và quan trọng nhất của Liên hợp quốc là duy trì hòa bình và an ninh quốc tế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến chương, Liên hợp quốc có nhiệm vụ phát triển quan hệ hữu nghị giữa các dân tộc trên cơ sở nào?", "options": ["A. Tôn trọng nguyên tắc bình đẳng và quyền tự quyết của các dân tộc", "B. Sức mạnh quân sự của các cường quốc", "C. Sự viện trợ kinh tế lẫn nhau", "D. Cùng chung một chế độ chính trị"], "answer": "A", "explain": "Hiến chương nêu rõ phát triển quan hệ hữu nghị trên cơ sở tôn trọng nguyên tắc bình đẳng và quyền tự quyết của các dân tộc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Hiến chương, Liên hợp quốc thực hiện sự hợp tác quốc tế trong việc giải quyết các vấn đề thuộc lĩnh vực nào?", "options": ["A. Kinh tế, xã hội, văn hóa và nhân đạo", "B. Quân sự và tình báo", "C. Thương mại vũ khí", "D. Chinh phục vũ trụ"], "answer": "A", "explain": "Một mục đích của Liên hợp quốc là hợp tác quốc tế giải quyết các vấn đề kinh tế, xã hội, văn hóa, nhân đạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nội dung nào sau đây là một trong bốn mục đích của Liên hợp quốc?", "options": ["A. Làm trung tâm điều hòa các hành động của các quốc gia vì mục đích chung", "B. Xây dựng liên minh quân sự toàn cầu", "C. Áp đặt chế độ chính trị thống nhất", "D. Thu thuế toàn cầu"], "answer": "A", "explain": "Bốn mục đích của Liên hợp quốc gồm: duy trì hòa bình; phát triển quan hệ hữu nghị; hợp tác quốc tế; làm trung tâm điều hòa hành động của các quốc gia.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mục đích nào của Liên hợp quốc thể hiện trực tiếp sự ủng hộ đối với phong trào giải phóng dân tộc?", "options": ["A. Phát triển quan hệ hữu nghị trên cơ sở tôn trọng quyền tự quyết của các dân tộc", "B. Duy trì hòa bình và an ninh quốc tế", "C. Hợp tác giải quyết vấn đề kinh tế", "D. Làm trung tâm điều hòa hành động"], "answer": "A", "explain": "Nguyên tắc tôn trọng quyền tự quyết của các dân tộc là cơ sở pháp lý để Liên hợp quốc ủng hộ phong trào giải phóng dân tộc, chống chủ nghĩa thực dân.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Việc Liên hợp quốc triển khai các chương trình xóa đói, giảm nghèo và hỗ trợ y tế ở các nước đang phát triển thể hiện mục đích nào?", "options": ["A. Duy trì hòa bình và an ninh quốc tế", "B. Phát triển quan hệ hữu nghị giữa các dân tộc", "C. Thực hiện hợp tác quốc tế về kinh tế, xã hội, văn hóa, nhân đạo", "D. Làm trung tâm điều hòa hành động"], "answer": "C", "explain": "Các chương trình phát triển, xóa đói giảm nghèo, y tế thuộc mục đích hợp tác quốc tế về kinh tế, xã hội, văn hóa, nhân đạo.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về mục đích của Liên hợp quốc:", "statements": ["a) Duy trì hòa bình và an ninh quốc tế là mục đích của Liên hợp quốc.", "b) Phát triển quan hệ hữu nghị giữa các dân tộc là mục đích của Liên hợp quốc.", "c) Thực hiện hợp tác quốc tế về kinh tế, xã hội, văn hóa, nhân đạo là mục đích của Liên hợp quốc.", "d) Xây dựng một nhà nước toàn cầu thống nhất là mục đích của Liên hợp quốc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) là ba trong bốn mục đích ghi trong Hiến chương. d) sai: Liên hợp quốc tôn trọng chủ quyền các quốc gia, không xây dựng nhà nước toàn cầu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Làm trung tâm điều hòa các hành động của các quốc gia là một mục đích của Liên hợp quốc.", "b) Liên hợp quốc có mục đích áp đặt một chế độ chính trị chung cho mọi quốc gia.", "c) Tôn trọng quyền tự quyết của các dân tộc là cơ sở của mục đích phát triển quan hệ hữu nghị.", "d) Hợp tác quốc tế của Liên hợp quốc chỉ giới hạn trong lĩnh vực quân sự."], "answer": ["T", "F", "T", "F"], "explain": "a), c) đúng. b) sai: Liên hợp quốc tôn trọng sự lựa chọn chính trị của mỗi nước. d) sai: hợp tác trên các lĩnh vực kinh tế, xã hội, văn hóa, nhân đạo.", "points": 1}, {"type": "short", "level": "VD", "q": "Cơ quan nào của Liên hợp quốc chịu trách nhiệm chính về việc duy trì hòa bình và an ninh quốc tế?", "answer": "Hội đồng Bảo an", "explain": "Theo Hiến chương, Hội đồng Bảo an chịu trách nhiệm chính về duy trì hòa bình và an ninh quốc tế.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tuyên ngôn Quốc tế Nhân quyền được Đại hội đồng Liên hợp quốc thông qua vào năm nào?", "answer": "1948", "explain": "Ngày 10/12/1948, Đại hội đồng Liên hợp quốc thông qua Tuyên ngôn Quốc tế Nhân quyền.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Hiến chương Liên hợp quốc quy định bao nhiêu nguyên tắc cơ bản trong hoạt động?", "options": ["A. 5 nguyên tắc", "B. 6 nguyên tắc", "C. 7 nguyên tắc", "D. 8 nguyên tắc"], "answer": "C", "explain": "Hiến chương quy định 7 nguyên tắc cơ bản chi phối hoạt động của Liên hợp quốc và các nước thành viên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tắc bình đẳng về chủ quyền giữa các quốc gia thành viên có nghĩa là gì?", "options": ["A. Mọi quốc gia thành viên đều bình đẳng về chủ quyền, không phân biệt lớn nhỏ", "B. Nước lớn có nhiều quyền hơn nước nhỏ", "C. Mọi nước phải theo một mô hình chính trị", "D. Các nước phải thống nhất quân đội"], "answer": "A", "explain": "Nguyên tắc bình đẳng chủ quyền: mọi quốc gia thành viên, dù lớn hay nhỏ, đều bình đẳng về chủ quyền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Hiến chương, các nước thành viên phải giải quyết các tranh chấp quốc tế bằng biện pháp nào?", "options": ["A. Biện pháp hòa bình", "B. Biện pháp quân sự", "C. Biện pháp trừng phạt kinh tế đơn phương", "D. Biện pháp đe dọa vũ lực"], "answer": "A", "explain": "Nguyên tắc: các thành viên giải quyết tranh chấp quốc tế bằng biện pháp hòa bình, không đe dọa hoặc sử dụng vũ lực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tắc không can thiệp vào công việc nội bộ của mỗi nước có nghĩa là gì?", "options": ["A. Liên hợp quốc không được can thiệp vào những việc thuộc thẩm quyền nội bộ của quốc gia", "B. Các nước không được quan hệ ngoại giao với nhau", "C. Liên hợp quốc giải tán quân đội các nước", "D. Các nước phải mở cửa biên giới hoàn toàn"], "answer": "A", "explain": "Hiến chương quy định Liên hợp quốc không can thiệp vào các công việc thuộc thẩm quyền nội bộ của bất kỳ quốc gia nào.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nước thành viên đang bị Hội đồng Bảo an áp dụng biện pháp trừng phạt; theo Hiến chương, các nước thành viên khác phải làm gì?", "options": ["A. Không được giúp đỡ nước đó", "B. Tiếp tục viện trợ quân sự cho nước đó", "C. Rút khỏi Liên hợp quốc", "D. Trung lập tuyệt đối"], "answer": "A", "explain": "Nguyên tắc: các thành viên phải giúp đỡ Liên hợp quốc trong mọi hành động và không giúp đỡ nước đang bị Liên hợp quốc áp dụng biện pháp phòng ngừa hoặc cưỡng chế.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tắc nào của Hiến chương yêu cầu Liên hợp quốc bảo đảm cả những nước KHÔNG phải thành viên cũng hành động phù hợp?", "options": ["A. Nguyên tắc bình đẳng chủ quyền", "B. Nguyên tắc giải quyết hòa bình", "C. Nguyên tắc bảo đảm các nước ngoài Liên hợp quốc hành động theo các nguyên tắc của Hiến chương", "D. Nguyên tắc không can thiệp nội bộ"], "answer": "C", "explain": "Hiến chương quy định Liên hợp quốc bảo đảm các quốc gia không phải thành viên cũng hành động theo các nguyên tắc vì duy trì hòa bình.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về nguyên tắc hoạt động của Liên hợp quốc:", "statements": ["a) Các nước thành viên bình đẳng về chủ quyền.", "b) Các tranh chấp quốc tế phải được giải quyết bằng biện pháp hòa bình.", "c) Các nước thành viên không được đe dọa hoặc sử dụng vũ lực trong quan hệ quốc tế.", "d) Liên hợp quốc được can thiệp vào công việc nội bộ của mọi quốc gia."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) là các nguyên tắc trong Hiến chương. d) sai: Hiến chương cấm can thiệp vào công việc thuộc thẩm quyền nội bộ của quốc gia.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mọi nước thành viên phải làm tròn các nghĩa vụ mà Hiến chương quy định.", "b) Khi Hội đồng Bảo an hành động, các thành viên phải giúp đỡ Liên hợp quốc.", "c) Một nước có quyền dùng vũ lực để giải quyết tranh chấp biên giới.", "d) Các nước không phải thành viên Liên hợp quốc không cần tuân thủ nguyên tắc nào."], "answer": ["T", "T", "F", "F"], "explain": "a), b) đúng theo Hiến chương. c) sai: cấm đe dọa hoặc sử dụng vũ lực. d) sai: Liên hợp quốc bảo đảm cả các nước ngoài tổ chức hành động theo nguyên tắc.", "points": 1}, {"type": "short", "level": "VD", "q": "Năm nước ủy viên thường trực Hội đồng Bảo an có quyền đặc biệt nào khi biểu quyết?", "answer": "quyền phủ quyết", "explain": "Năm ủy viên thường trực (Mỹ, Anh, Pháp, Nga, Trung Quốc) có quyền phủ quyết đối với các quyết định quan trọng của Hội đồng Bảo an.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điều 1 của Hiến chương Liên hợp quốc quy định về nội dung gì?", "answer": "mục đích", "explain": "Điều 1 Hiến chương quy định các mục đích của Liên hợp quốc; Điều 2 quy định các nguyên tắc hoạt động.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Liên hợp quốc có bao nhiêu cơ quan chính theo Hiến chương?", "options": ["A. 4 cơ quan", "B. 5 cơ quan", "C. 6 cơ quan", "D. 7 cơ quan"], "answer": "C", "explain": "Liên hợp quốc có 6 cơ quan chính: Đại hội đồng, Hội đồng Bảo an, Hội đồng Kinh tế và Xã hội, Hội đồng Quản thác, Tòa án Quốc tế và Ban Thư ký.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tòa án Quốc tế của Liên hợp quốc đặt trụ sở ở đâu?", "options": ["A. Niu Oóc (Hoa Kỳ)", "B. La Hay (Hà Lan)", "C. Giơ-ne-vơ (Thụy Sĩ)", "D. Pa-ri (Pháp)"], "answer": "B", "explain": "Tòa án Quốc tế (ICJ) là cơ quan tư pháp chính của Liên hợp quốc, đặt trụ sở tại La Hay, Hà Lan.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hội đồng Bảo an Liên hợp quốc gồm bao nhiêu ủy viên?", "options": ["A. 10 ủy viên", "B. 15 ủy viên", "C. 20 ủy viên", "D. 5 ủy viên"], "answer": "B", "explain": "Hội đồng Bảo an gồm 15 ủy viên: 5 thường trực và 10 không thường trực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Năm nước ủy viên thường trực của Hội đồng Bảo an gồm những nước nào?", "options": ["A. Mỹ, Anh, Pháp, Nga, Trung Quốc", "B. Mỹ, Đức, Nhật, Nga, Trung Quốc", "C. Mỹ, Anh, Pháp, Đức, Nhật", "D. Mỹ, Ấn Độ, Nga, Trung Quốc, Bra-xin"], "answer": "A", "explain": "Năm ủy viên thường trực là Mỹ, Anh, Pháp, Nga (kế tục Liên Xô) và Trung Quốc, đều có quyền phủ quyết.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nghị quyết của Hội đồng Bảo an về vấn đề quan trọng được thông qua khi nào?", "options": ["A. Được ít nhất 9/15 phiếu thuận và không có phiếu phủ quyết của ủy viên thường trực", "B. Được quá nửa số phiếu của Đại hội đồng", "C. Được tất cả 15 phiếu thuận", "D. Được Tổng Thư ký phê chuẩn"], "answer": "A", "explain": "Quyết định về vấn đề quan trọng cần ít nhất 9 trên 15 phiếu thuận, trong đó không có phiếu chống (phủ quyết) của ủy viên thường trực nào.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng Thư ký đầu tiên của Liên hợp quốc là ai?", "options": ["A. Trygve Lie (Na Uy)", "B. Dag Hammarskjöld (Thụy Điển)", "C. U Thant (Mi-an-ma)", "D. Kofi Annan (Ga-na)"], "answer": "A", "explain": "Trygve Lie (Na Uy) là Tổng Thư ký đầu tiên của Liên hợp quốc (1946-1952).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về cơ quan của Liên hợp quốc:", "statements": ["a) Đại hội đồng gồm tất cả các nước thành viên, mỗi nước một phiếu.", "b) Hội đồng Bảo an có 5 ủy viên thường trực và 10 ủy viên không thường trực.", "c) Ban Thư ký do Tổng Thư ký đứng đầu.", "d) Hội đồng Quản thác hiện nay vẫn hoạt động mạnh mẽ như năm 1945."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: Hội đồng Quản thác đã hoàn thành sứ mệnh và ngừng hoạt động từ năm 1994.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về Hội đồng Bảo an:", "statements": ["a) Hội đồng Bảo an chịu trách nhiệm chính về duy trì hòa bình và an ninh quốc tế.", "b) Ủy viên không thường trực có nhiệm kỳ 2 năm.", "c) Ủy viên thường trực có quyền phủ quyết.", "d) Mọi quyết định của Hội đồng Bảo an đều cần đủ 15 phiếu thuận."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: quyết định quan trọng cần ít nhất 9/15 phiếu thuận và không bị phủ quyết.", "points": 1}, {"type": "short", "level": "VD", "q": "Trụ sở chính của Liên hợp quốc đặt tại thành phố nào của Hoa Kỳ?", "answer": "Niu Oóc", "explain": "Trụ sở chính của Liên hợp quốc đặt tại thành phố Niu Oóc (New York), Hoa Kỳ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ủy viên không thường trực của Hội đồng Bảo an có nhiệm kỳ mấy năm?", "answer": "2", "explain": "Mười ủy viên không thường trực của Hội đồng Bảo an được bầu với nhiệm kỳ 2 năm.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Lực lượng gìn giữ hòa bình của Liên hợp quốc thường được gọi với tên nào?", "options": ["A. Mũ nồi xanh", "B. Mũ sắt thép", "C. Áo choàng trắng", "D. Khiên vàng"], "answer": "A", "explain": "Lực lượng gìn giữ hòa bình của Liên hợp quốc được gọi là lực lượng mũ nồi xanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năm 1960, Đại hội đồng Liên hợp quốc đã thông qua văn kiện quan trọng nào?", "options": ["A. Tuyên ngôn về việc trao trả độc lập cho các nước và các dân tộc thuộc địa", "B. Hiến chương Liên hợp quốc", "C. Tuyên ngôn Quốc tế Nhân quyền", "D. Công ước về Luật Biển"], "answer": "A", "explain": "Năm 1960, Đại hội đồng thông qua Tuyên ngôn trao trả độc lập cho các nước thuộc địa, cổ vũ phong trào giải phóng dân tộc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong lĩnh vực giải trừ quân bị, Liên hợp quốc có vai trò gì?", "options": ["A. Thúc đẩy đàm phán và ký kết các hiệp ước hạn chế vũ khí", "B. Xây dựng quân đội chung của Liên hợp quốc", "C. Buôn bán vũ khí cho các nước", "D. Chế tạo vũ khí hạt nhân"], "answer": "A", "explain": "Liên hợp quốc thúc đẩy đàm phán, ký kết các hiệp ước về hạn chế, cấm vũ khí hủy diệt hàng loạt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tổ chức nào sau đây thuộc hệ thống Liên hợp quốc, chuyên chăm sóc trẻ em?", "options": ["A. UNICEF", "B. WHO", "C. FAO", "D. IMF"], "answer": "A", "explain": "UNICEF (Quỹ Nhi đồng Liên hợp quốc) là tổ chức chuyên về bảo vệ và chăm sóc trẻ em.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hạn chế lớn nhất trong hoạt động của Liên hợp quốc là gì?", "options": ["A. Bị các cường quốc, nhất là 5 ủy viên thường trực, chi phối", "B. Thiếu trụ sở làm việc", "C. Không có Hiến chương", "D. Không có nước thành viên"], "answer": "A", "explain": "Do cơ chế phủ quyết và tương quan lực lượng, hoạt động của Liên hợp quốc nhiều khi bị các cường quốc chi phối.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổ chức Y tế Thế giới (WHO) là cơ quan chuyên môn của Liên hợp quốc hoạt động trong lĩnh vực nào?", "options": ["A. Bảo vệ sức khỏe con người toàn cầu", "B. Giáo dục trẻ em", "C. Lương thực và nông nghiệp", "D. Bảo vệ di sản văn hóa"], "answer": "A", "explain": "WHO là tổ chức chuyên môn của Liên hợp quốc về y tế, bảo vệ và nâng cao sức khỏe con người.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của Liên hợp quốc:", "statements": ["a) Liên hợp quốc triển khai lực lượng gìn giữ hòa bình ở nhiều khu vực xung đột.", "b) Liên hợp quốc thúc đẩy quá trình phi thực dân hóa sau Chiến tranh thế giới thứ hai.", "c) Liên hợp quốc có các chương trình hỗ trợ phát triển kinh tế, xóa đói giảm nghèo.", "d) Liên hợp quốc đứng ngoài mọi vấn đề nhân quyền trên thế giới."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: bảo vệ và thúc đẩy nhân quyền là một vai trò quan trọng của Liên hợp quốc.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) UNESCO là tổ chức của Liên hợp quốc về giáo dục, khoa học và văn hóa.", "b) FAO là tổ chức của Liên hợp quốc về lương thực và nông nghiệp.", "c) Liên hợp quốc đã thông qua Tuyên ngôn Quốc tế Nhân quyền năm 1948.", "d) Mọi nghị quyết của Đại hội đồng đều có tính ràng buộc pháp lý bắt buộc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: nghị quyết của Đại hội đồng chủ yếu mang tính khuyến nghị, không bắt buộc như quyết định của Hội đồng Bảo an.", "points": 1}, {"type": "short", "level": "VD", "q": "Đại hội đồng Liên hợp quốc thông qua Tuyên ngôn trao trả độc lập cho các nước thuộc địa vào năm nào?", "answer": "1960", "explain": "Năm 1960, Đại hội đồng thông qua Tuyên ngôn về việc trao trả độc lập cho các nước và các dân tộc thuộc địa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tổ chức Y tế Thế giới thuộc hệ thống Liên hợp quốc có tên viết tắt là gì?", "answer": "WHO", "explain": "Tổ chức Y tế Thế giới (World Health Organization) viết tắt là WHO.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Việt Nam chính thức trở thành thành viên của Liên hợp quốc vào ngày nào?", "options": ["A. 2/9/1945", "B. 20/9/1977", "C. 24/10/1945", "D. 11/1/2007"], "answer": "B", "explain": "Ngày 20/9/1977, Việt Nam được kết nạp làm thành viên của Liên hợp quốc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việt Nam là thà ", "D. Các nước không gia nhập Liên hợp quốc"], "answer": "A", "explain": "Đối đầu Đông-Tây khiến các ủy viên thường trực nhiều lần dùng quyền phủ quyết, làm tê liệt hoạt động của Hội đồng Bảo an.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hiến chương Liên hợp quốc gồm 19 chương, 111 điều.", "b) Đại hội đồng gồm tất cả các nước thành viên.", "c) Mỗi nước thành viên có một phiếu biểu quyết tại Đại hội đồng.", "d) Tổng Thư ký do Hội đồng Quản thác bầu ra."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: Tổng Thư ký do Đại hội đồng bổ nhiệm theo giới thiệu của Hội đồng Bảo an.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mục đích và nguyên tắc là hai nội dung khác nhau của Hiến chương.", "b) Nguyên tắc bình đẳng chủ quyền áp dụng cho mọi nước thành viên.", "c) Liên hợp quốc được dùng vũ lực tùy tiện để trừng phạt nước thành viên.", "d) Quyền phủ quyết chỉ thuộc về 5 ủy viên thường trực Hội đồng Bảo an."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai: việc sử dụng biện pháp cưỡng chế phải tuân thủ Hiến chương và do Hội đồng Bảo an quyết định.", "points": 1}, {"type": "short", "level": "VD", "q": "Hiến chương Liên hợp quốc có bao nhiêu điều?", "answer": "111", "explain": "Hiến chương Liên hợp quốc gồm 19 chương với 111 điều.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đại hội đồng Liên hợp quốc họp phiên thường niên vào tháng mấy hằng năm?", "answer": "9", "explain": "Đại hội đồng họp phiên thường niên vào tháng 9 hằng năm tại Niu Oóc.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hội nghị I-an-ta họp vào tháng 2 năm nào?", "options": ["A. 1943", "B. 1944", "C. 1945", "D. 1946"], "answer": "C", "explain": "Hội nghị I-an-ta họp từ ngày 4 đến 11/2/1945.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiến chương Liên hợp quốc được ký vào ngày 26 tháng 6 năm nào?", "options": ["A. 1944", "B. 1945", "C. 1946", "D. 1947"], "answer": "B", "explain": "Hiến chương được ký ngày 26/6/1945 tại Xan Phran-xi-xcô.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sự kiện nào đánh dấu Liên hợp quốc chính thức đi vào hoạt động?", "options": ["A. Hiến chương có hiệu lực ngày 24/10/1945", "B. Hội nghị I-an-ta họp", "C. Chiến tranh thế giới thứ hai kết thúc", "D. Hội Quốc liên giải tán"], "answer": "A", "explain": "Ngày 24/10/1945 Hiến chương có hiệu lực, Liên hợp quốc chính thức được thành lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tuyên ngôn Quốc tế Nhân quyền ra đời sau khi Hiến chương Liên hợp quốc có hiệu lực bao nhiêu năm?", "options": ["A. 1 năm", "B. 2 năm", "C. 3 năm", "D. 5 năm"], "answer": "C", "explain": "Hiến chương có hiệu lực 1945, Tuyên ngôn Quốc tế Nhân quyền thông qua ngày 10/12/1948, sau 3 năm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sắp xếp đúng trình tự thời gian các sự kiện: 1. Hội nghị I-an-ta; 2. Ký Hiến chương; 3. Hiến chương có hiệu lực; 4. Việt Nam gia nhập Liên hợp quốc.", "options": ["A. 1-2-3-4", "B. 2-1-3-4", "C. 1-3-2-4", "D. 4-1-2-3"], "answer": "A", "explain": "Trình tự: I-an-ta (2/1945) - ký Hiến chương (26/6/1945) - Hiến chương có hiệu lực (24/10/1945) - Việt Nam gia nhập (20/9/1977).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khoảng cách thời gian từ khi Hiến chương được ký (26/6/1945) đến khi có hiệu lực (24/10/1945) là bao lâu?", "options": ["A. Khoảng 2 tháng", "B. Khoảng 4 tháng", "C. Khoảng 6 tháng", "D. Khoảng 1 năm"], "answer": "B", "explain": "Từ 26/6 đến 24/10/1945 là khoảng 4 tháng, thời gian các nước phê chuẩn Hiến chương.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về mốc thời gian:", "statements": ["a) Hội nghị I-an-ta họp tháng 2/1945.", "b) Hội nghị Xan Phran-xi-xcô họp từ 25/4 đến 26/6/1945.", "c) Hiến chương có hiệu lực ngày 24/10/1945.", "d) Việt Nam gia nhập Liên hợp quốc năm 1975."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: Việt Nam gia nhập ngày 20/9/1977.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tuyên ngôn Quốc tế Nhân quyền được thông qua năm 1948.", "b) Tuyên ngôn trao trả độc lập cho các nước thuộc địa được thông qua năm 1960.", "c) Hội đồng Quản thác ngừng hoạt động năm 1994.", "d) Liên hợp quốc hiện có 193 nước thành viên từ năm 1945."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: năm 1945 chỉ có 51 nước thành viên sáng lập; hiện nay Liên hợp quốc có 193 thành viên.", "points": 1}, {"type": "short", "level": "VD", "q": "Hội nghị I-an-ta, nơi nhất trí thành lập Liên hợp quốc, họp vào năm nào?", "answer": "1945", "explain": "Hội nghị I-an-ta họp từ ngày 4 đến 11/2/1945.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu nước ký Hiến chương Liên hợp quốc tại Xan Phran-xi-xcô năm 1945?", "answer": "51", "explain": "Có 50 nước tham dự hội nghị và 51 nước ký Hiến chương (Ba Lan ký bổ sung sau).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khi xảy ra xung đột vũ trang giữa hai quốc gia, Liên hợp quốc thường làm gì trước tiên?", "options": ["A. Kêu gọi ngừng bắn và trung gian hòa giải", "B. Cung cấp vũ khí cho một bên", "C. Rút toàn bộ nhân viên khỏi khu vực", "D. Tuyên bố ủng hộ bên mạnh hơn"], "answer": "A", "explain": "Phù hợp nguyên tắc giải quyết hòa bình, Liên hợp quốc kêu gọi ngừng bắn, hòa giải và có thể triển khai lực lượng gìn giữ hòa bình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc Liên hợp quốc áp đặt trừng phạt đối với một nước vi phạm hòa bình thể hiện nguyên tắc nào?", "options": ["A. Các thành viên giúp đỡ Liên hợp quốc và không giúp nước bị áp dụng biện pháp", "B. Bình đẳng chủ quyền", "C. Không can thiệp nội bộ", "D. Tự do thương mại"], "answer": "A", "explain": "Hiến chương quy định các thành viên phải giúp đỡ Liên hợp quốc và không giúp đỡ nước đang bị áp dụng biện pháp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nước thành viên bị xâm lược, Hội đồng Bảo an có thể áp dụng biện pháp nào?", "options": ["A. Biện pháp trừng phạt kinh tế hoặc can thiệp quân sự theo Hiến chương", "B. Buộc nước bị xâm lược đầu hàng", "C. Chia cắt lãnh thổ nước bị xâm lược", "D. Giải tán chính phủ nước bị xâm lược"], "answer": "A", "explain": "Theo Chương VII Hiến chương, Hội đồng Bảo an có thể áp dụng biện pháp trừng phạt, phong tỏa, thậm chí hành động quân sự.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các nước đang phát triển coi Liên hợp quốc là diễn đàn quan trọng?", "options": ["A. Vì mỗi nước đều có một phiếu biểu quyết tại Đại hội đồng", "B. Vì được viện trợ quân sự miễn phí", "C. Vì được miễn mọi nghĩa vụ tài chính", "D. Vì được quyền phủ quyết"], "answer": "A", "explain": "Tại Đại hội đồng, mỗi nước một phiếu nên các nước đang phát triển (đông đảo) có tiếng nói quan trọng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Năm 1960 được gọi là Năm châu Phi vì có 17 nước châu Phi giành độc lập. Vai trò của Liên hợp quốc thể hiện ở điểm nào?", "options": ["A. Tuyên ngôn 1960 cổ vũ và tạo cơ sở pháp lý cho phong trào giải phóng dân tộc", "B. Liên hợp quốc trực tiếp lãnh đạo các cuộc khởi nghĩa", "C. Liên hợp quốc cung cấp vũ khí cho các nước châu Phi", "D. Liên hợp quốc sáp nhập các thuộc địa"], "answer": "A", "explain": "Tuyên ngôn năm 1960 của Đại hội đồng đã cổ vũ mạnh mẽ và tạo cơ sở pháp lý cho phong trào giành độc lập.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong cuộc khủng hoảng tên lửa Cu-ba (1962), Liên hợp quốc đã đóng vai trò gì?", "options": ["A. Diễn đàn để các bên đối thoại, góp phần hạ nhiệt căng thẳng", "B. Trực tiếp điều quân can thiệp vào Cu-ba", "C. Ủng hộ Mỹ phong tỏa Cu-ba bằng vũ lực", "D. Giải tán Hội đồng Bảo an"], "answer": "A", "explain": "Liên hợp quốc là diễn đàn để Mỹ và Liên Xô đối thoại, góp phần giải quyết hòa bình cuộc khủng hoảng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên hợp quốc ưu tiên giải quyết xung đột bằng biện pháp hòa bình.", "b) Hội đồng Bảo an có thể áp dụng biện pháp trừng phạt kinh tế.", "c) Mọi nước thành viên đều có quyền phủ quyết tại Hội đồng Bảo an.", "d) Lực lượng mũ nồi xanh làm nhiệm vụ gìn giữ hòa bình."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai: chỉ 5 ủy viên thường trực có quyền phủ quyết.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quyết định trừng phạt của Hội đồng Bảo an có tính ràng buộc với các thành viên.", "b) Đại hội đồng có thể thảo luận mọi vấn đề thuộc phạm vi Hiến chương.", "c) Liên hợp quốc được phép can thiệp vũ trang tùy tiện vào bất kỳ nước nào.", "d) Tòa án Quốc tế giải quyết tranh chấp pháp lý giữa các quốc gia."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) đúng. c) sai: việc sử dụng biện pháp cưỡng chế phải do Hội đồng Bảo an quyết định theo Hiến chương.", "points": 1}, {"type": "short", "level": "VD", "q": "Lực lượng gìn giữ hòa bình của Liên hợp quốc thường được gọi là lực lượng gì?", "answer": "mũ nồi xanh", "explain": "Lực lượng gìn giữ hòa bình của Liên hợp quốc được gọi là lực lượng mũ nồi xanh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Hiến chương, biện pháp cưỡng chế (trừng phạt, hành động quân sự) do cơ quan nào của Liên hợp quốc quyết định?", "answer": "Hội đồng Bảo an", "explain": "Chỉ Hội đồng Bảo an mới có quyền quyết định các biện pháp cưỡng chế theo Chương VII của Hiến chương.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tổ chức quốc tế nào là tiền thân của Liên hợp quốc?", "options": ["A. Hội Quốc liên", "B. Khối NATO", "C. Khối Vác-sa-va", "D. Liên minh châu Âu"], "answer": "A", "explain": "Hội Quốc liên (thành lập 1920) là tổ chức quốc tế tiền thân, nhưng hoạt động kém hiệu quả nên được thay thế bằng Liên hợp quốc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện nay Liên hợp quốc có bao nhiêu nước thành viên?", "options": ["A. 51 nước", "B. 149 nước", "C. 193 nước", "D. 195 nước"], "answer": "C", "explain": "Từ 51 nước sáng lập năm 1945, đến nay Liên hợp quốc có 193 nước thành viên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác biệt cơ bản giữa Hội Quốc liên và Liên hợp quốc là gì?", "options": ["A. Liên hợp quốc có cơ chế bảo đảm thực thi hiệu quả hơn, nhất là vai trò của Hội đồng Bảo an", "B. Hội Quốc liên có nhiều thành viên hơn", "C. Hội Quốc liên có Hiến chương chi tiết hơn", "D. Liên hợp quốc không có cơ quan nào"], "answer": "A", "explain": "Hội Quốc liên thất bại vì thiếu cơ chế cưỡng chế hiệu quả; Liên hợp quốc khắc phục bằng vai trò của Hội đồng Bảo an.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói Liên hợp quốc là tổ chức quốc tế lớn nhất hành tinh?", "options": ["A. Vì hầu hết các quốc gia trên thế giới đều là thành viên (193 nước)", "B. Vì có quân đội đông nhất", "C. Vì có ngân sách lớn nhất", "D. Vì trụ sở ở nhiều nước nhất"], "answer": "A", "explain": "Với 193 nước thành viên, Liên hợp quốc là tổ chức quốc tế có tính phổ quát cao nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đánh giá nào sau đây đúng về vai trò của Liên hợp quốc từ 1945 đến nay?", "options": ["A. Có đóng góp to lớn cho hòa bình, phát triển nhưng còn hạn chế do bị cường quốc chi phối", "B. Hoàn toàn thất bại trong mọi hoạt động", "C. Chỉ phục vụ lợi ích của các nước lớn", "D. Không có vai trò gì trong quan hệ quốc tế"], "answer": "A", "explain": "Liên hợp quốc có nhiều đóng góp nhưng hiệu quả còn hạn chế vì phụ thuộc vào sự đồng thuận của các cường quốc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong xu thế toàn cầu hóa hiện nay, vai trò của Liên hợp quốc được thể hiện nổi bật nhất ở lĩnh vực nào?", "options": ["A. Điều phối hợp tác toàn cầu về hòa bình, phát triển bền vững, biến đổi khí hậu, y tế", "B. Xây dựng quân đội toàn cầu", "C. Thống nhất tiền tệ thế giới", "D. Xóa bỏ biên giới quốc gia"], "answer": "A", "explain": "Liên hợp quốc là diễn đàn và trung tâm điều phối hợp tác toàn cầu về các thách thức chung của nhân loại.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên hợp quốc thay thế Hội Quốc liên sau Chiến tranh thế giới thứ hai.", "b) Hiện nay Liên hợp quốc có 193 nước thành viên.", "c) Việt Nam là thành viên tích cực, có trách nhiệm của Liên hợp quốc.", "d) Liên hợp quốc chỉ gồm các nước xã hội chủ nghĩa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: Liên hợp quốc là tổ chức phổ quát, gồm các nước thuộc mọi chế độ chính trị.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mục đích cao nhất của Liên hợp quốc là duy trì hòa bình và an ninh quốc tế.", "b) Mọi hoạt động của Liên hợp quốc đều phải tuân thủ các nguyên tắc của Hiến chương.", "c) Hội đồng Bảo an là cơ quan duy nhất có quyền quyết định biện pháp cưỡng chế.", "d) Nghị quyết của Đại hội đồng luôn có giá trị bắt buộc với mọi nước."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng. d) sai: nghị quyết của Đại hội đồng chủ yếu mang tính khuyến nghị.", "points": 1}, {"type": "short", "level": "VD", "q": "Tổ chức quốc tế tiền thân của Liên hợp quốc có tên gọi là gì?", "answer": "Hội Quốc liên", "explain": "Hội Quốc liên (1920-1946) là tổ chức quốc tế tiền thân của Liên hợp quốc.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiện nay Liên hợp quốc có bao nhiêu nước thành viên?", "answer": "193", "explain": "Liên hợp quốc hiện có 193 nước thành viên, là tổ chức quốc tế lớn nhất hành tinh.", "points": 0.5}]}]}
