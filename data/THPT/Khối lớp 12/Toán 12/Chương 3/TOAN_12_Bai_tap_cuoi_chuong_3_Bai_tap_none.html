i dạng phân số tối giản).", "answer": "$\\frac{3}{8}$", "explain": "$\\frac{\\Delta_Q}{R} = \\frac{3}{8}$.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Khoảng tứ phân vị $\\Delta_Q$ cho biết:", "options": ["A. số lượng giá trị bất thường trong mẫu", "B. mức độ phân tán của $50\\%$ số liệu chính giữa của mẫu", "C. giá trị trung bình của mẫu", "D. mức độ phân tán của toàn bộ số liệu"], "answer": "B", "explain": "$\\Delta_Q = Q_3 - Q_1$ đo mức độ phân tán của $50\\%$ số liệu nằm giữa (từ $Q_1$ đến $Q_3$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điểm thi của lớp A có $\\bar{x}_A = 7.5$, $s_A = 1.2$; lớp B có $\\bar{x}_B = 7.5$, $s_B = 2.4$. Lớp nào học đồng đều hơn?", "options": ["A. Hai lớp đồng đều như nhau", "B. Lớp A", "C. Không so sánh được", "D. Lớp B"], "answer": "B", "explain": "Cùng điểm trung bình, lớp A có độ lệch chuẩn nhỏ hơn nên đồng đều hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm kiểm tra của học sinh được ghép nhóm: $[20; 30)$: 4, $[30; 40)$: 8, $[40; 50)$: 8, $[50; 60)$: 4. Tứ phân vị thứ nhất $Q_1$ thuộc nhóm:", "options": ["A. $[30; 40)$\\;?", "B. $[50; 60)$", "C. $[30; 40)$", "D. $[40; 50)$"], "answer": "C", "explain": "Nhóm chứa $Q_1$ là $[30; 40)$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ý nghĩa của khoảng biến thiên $R$ là:", "options": ["A. đo số lượng giá trị bất thường", "B. đo giá trị trung bình của mẫu số liệu", "C. xác định nhóm có tần số lớn nhất", "D. đo mức độ phân tán của mẫu số liệu: $R$ càng lớn thì số liệu càng phân tán"], "answer": "D", "explain": "$R$ càng lớn thì mức độ phân tán của số liệu càng lớn. Tuy nhiên $R$ dễ bị ảnh hưởng bởi giá trị bất thường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tuổi thọ (giờ) của một loại bóng đèn được ghép nhóm: $[20; 30)$: 4, $[30; 40)$: 8, $[40; 50)$: 8, $[50; 60)$: 4. Khoảng tứ phân vị của tuổi thọ là:", "options": ["A. $15$ giờ\\;?", "B. $15$ giờ", "C. $40$ giờ", "D. $10$ giờ"], "answer": "B", "explain": "Tính được $Q_1$ và $Q_3$ rồi lấy hiệu: $\\Delta_Q = Q_3-Q_1 = 15$ (giờ).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cho mẫu số liệu ghép nhóm có các nhóm đều có độ rộng bằng $5$. Biết $Q_1 = 16.25$ và $Q_3 = 23.75$. Khoảng tứ phân vị $\\Delta_Q$ bằng:", "options": ["A. $5$", "B. $8.5$", "C. $40$", "D. $7.5$"], "answer": "D", "explain": "$\\Delta_Q = Q_3 - Q_1 = 23.75 - 16.25 = 7.5$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cộng cùng một hằng số vào mọi số liệu thì số trung bình tăng đúng hằng số đó.", "Bình phương độ lệch chuẩn bằng phương sai.", "Nhân mọi số liệu với $2$ thì độ lệch chuẩn tăng gấp $2$ lần.", "Nhân mọi số liệu với $2$ thì phương sai tăng gấp $4$ lần."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: $s^2 = (\\sqrt{s^2})^2$. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Nếu thêm một giá trị bất thường rất lớn thì $R$ thay đổi nhiều hơn $\\Delta_Q$.", "Bỏ đi nhóm đầu và nhóm cuối thì phải tính lại các tứ phân vị.", "Giá trị nằm xa ngoài khoảng số liệu tập trung có thể là giá trị bất thường.", "$\\Delta_Q$ càng lớn thì số liệu càng phân tán."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: cỡ mẫu và phân bố thay đổi. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho mẫu số liệu ghép nhóm: $[20; 30)$: 2, $[30; 40)$: 4, $[40; 50)$: 4, $[50; 60)$: 2. Tính $s^2 + \\bar{x}$ (làm tròn đến hàng phần trăm).", "answer": "$131.67$", "explain": "$s^2 + \\bar{x} \\approx 91.67 + 40 = 131.67$.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Cho mẫu số liệu ghép nhóm: $[0; 5)$: 2, $[5; 10)$: 4, $[10; 15)$: 4, $[15; 20)$: 2. Viết công thức tính khoảng tứ phân vị (dạng $Q_3-Q_1$).", "answer": "$Q_3-Q_1$", "explain": "Khoảng tứ phân vị $\\Delta_Q = Q_3 - Q_1$.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "VD", "q": "Cho mẫu số liệu ghép nhóm: $[10; 15)$: 5, $[15; 20)$: 10, $[20; 25)$: 10, $[25; 30)$: 5. Nếu nhân mỗi số liệu với $2$ thì khoảng tứ phân vị mới bằng:", "options": ["A. $30$", "B. $7.5$", "C. $9.5$", "D. $15$"], "answer": "D", "explain": "Nhân mọi số liệu với $2$ thì độ phân tán tăng gấp $2$ lần: $\\Delta_Q' = 2\\Delta_Q = 15$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai mẫu số liệu ghép nhóm có cùng thang đo. Mẫu thứ nhất có khoảng tứ phân vị $\\Delta_Q = 15$, mẫu thứ hai có $\\Delta_Q = 30$. Mẫu nào phân tán hơn (theo khoảng tứ phân vị)?", "options": ["A. Mẫu thứ nhất", "B. Không so sánh được", "C. Hai mẫu phân tán như nhau", "D. Mẫu thứ hai"], "answer": "D", "explain": "$\\Delta_Q$ càng lớn thì mức độ phân tán càng lớn. Vì $30 \\gt 15$ nên mẫu thứ hai phân tán hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu ghép nhóm: $[10; 20)$: 5, $[20; 30)$: 10, $[30; 40)$: 10, $[40; 50)$: 5. Tứ phân vị thứ nhất $Q_1$ bằng:", "options": ["A. $30$", "B. $22.5$", "C. $17.5$", "D. $23.5$"], "answer": "B", "explain": "$n = 30$, vị trí $Q_1$: $\\frac{n}{4} = $7.5$$. Nhóm chứa $Q_1$ là $[20; 30)$ (tần số $10$, tần số tích lũy trước nhóm $5$). $Q_1 = 20 + \\frac{7.5 - 5}{10} \\times 10 = 22.5$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Doanh thu (triệu đồng) các ngày trong tháng của một cửa hàng được ghép nhóm: $[10; 15)$: 2, $[15; 20)$: 4, $[20; 25)$: 4, $[25; 30)$: 2. Khoảng biến thiên của doanh thu là:", "options": ["A. $12$ triệu đồng", "B. $20$ triệu đồng", "C. $15/2$ triệu đồng", "D. $25$ triệu đồng"], "answer": "B", "explain": "Khoảng biến thiên $R$ bằng đầu mút phải nhóm cuối trừ đầu mút trái nhóm đầu: $R = 20$ (triệu đồng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu ghép nhóm: $[0; 5)$: 2, $[5; 10)$: 4, $[10; 15)$: 4, $[15; 20)$: 2. Hiệu $Q_2 - Q_1$ bằng:", "options": ["A. $20$", "B. $3.75$", "C. $3.75$\\;?", "D. $7.5$"], "answer": "B", "explain": "$Q_2 - Q_1 = 10 - 6.25 = 3.75$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu điểm của khoảng tứ phân vị $\\Delta_Q$ so với khoảng biến thiên $R$ là:", "options": ["A. $\\Delta_Q$ dễ tính hơn $R$", "B. $\\Delta_Q$ luôn lớn hơn $R$", "C. $\\Delta_Q$ ít bị ảnh hưởng bởi các giá trị bất thường", "D. $\\Delta_Q$ bằng đúng một nửa $R$"], "answer": "C", "explain": "Vì $\\Delta_Q$ chỉ dựa vào $50\\%$ số liệu ở giữa nên ít bị ảnh hưởng bởi các giá trị quá lớn hoặc quá nhỏ (giá trị bất thường).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["$\\Delta_Q = 0$ khi mọi số liệu bằng nhau.", "Khoảng tứ phân vị đo mức độ phân tán của $50\\%$ số liệu chính giữa.", "Khoảng biến thiên $R$ của mẫu số liệu ghép nhóm bằng đầu mút phải của nhóm cuối trừ đầu mút trái của nhóm đầu.", "$R$ càng lớn thì mức độ phân tán của số liệu càng lớn."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: khi đó $Q_1 = Q_3$. b) Đúng. c) Đúng theo định nghĩa. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Trung vị luôn nằm giữa $Q_1$ và $Q_3$.", "$Q_1$ là phân vị thứ $25$: khoảng $75\\%$ số liệu lớn hơn $Q_1$.", "Khoảng $[Q_1; Q_3]$ chứa khoảng $50\\%$ số liệu chính giữa.", "Để so sánh độ phân tán của hai mẫu, nên dùng $\\Delta_Q$ hơn là $R$ khi có giá trị bất thường."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $Q_1 \\le Q_2 \\le Q_3$. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho mẫu số liệu ghép nhóm: $[0; 5)$: 2, $[5; 10)$: 4, $[10; 15)$: 4, $[15; 20)$: 2. Tính khoảng biến thiên $R$.", "answer": "$20$", "explain": "Khoảng biến thiên bằng đầu mút phải nhóm cuối trừ đầu mút trái nhóm đầu: $R = 20 - 0 = 20$.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Cho mẫu số liệu ghép nhóm: $[20; 30)$: 2, $[30; 40)$: 4, $[40; 50)$: 4, $[50; 60)$: 2. Tính khoảng biến thiên $R$.", "answer": "$40$", "explain": "Khoảng biến thiên bằng đầu mút phải nhóm cuối trừ đầu mút trái nhóm đầu: $R = 60 - 20 = 40$.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu ghép nhóm: $[0; 10)$: 2, $[10; 20)$: 4, $[20; 30)$: 4, $[30; 40)$: 2. Tứ phân vị thứ ba $Q_3$ bằng:", "options": ["A. $28.5$", "B. $20$", "C. $12.5$", "D. $27.5$"], "answer": "D", "explain": "Vị trí $Q_3$: $\\frac{3n}{4} = $9$$, nhóm chứa là $[20; 30)$. Áp dụng công thức được $Q_3 = 27.5$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khoảng biến thiên $R$ của mẫu số liệu ghép nhóm được tính bằng:", "options": ["A. đầu mút phải của nhóm cuối cùng trừ đầu mút trái của nhóm đầu tiên", "B. đầu mút trái của nhóm cuối cùng trừ đầu mút phải của nhóm đầu tiên", "C. giá trị lớn nhất trừ giá trị nhỏ nhất của mẫu gốc", "D. tổng các tần số của các nhóm"], "answer": "A", "explain": "Với mẫu số liệu ghép nhóm, $R = x_{\\max} - x_{\\min}$, trong đó $x_{\\max}$ là đầu mút phải của nhóm cuối cùng và $x_{\\min}$ là đầu mút trái của nhóm đầu tiên.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu ghép nhóm: $[0; 5)$: 5, $[5; 10)$: 10, $[10; 15)$: 10, $[15; 20)$: 5. Biết rằng $25\\%$ số liệu nhỏ nhất không vượt quá $Q_1 = 6.25$. Phát biểu nào đúng?", "options": ["A. Tất cả số liệu đều lớn hơn $6.25$", "B. Có khoảng $75\\%$ số liệu lớn hơn $6.25$", "C. $Q_1$ là giá trị nhỏ nhất của mẫu", "D. Có khoảng $25\\%$ số liệu lớn hơn $6.25$"], "answer": "B", "explain": "$Q_1$ là phân vị thứ $25$: khoảng $25\\%$ số liệu không vượt quá $Q_1$, khoảng $75\\%$ số liệu lớn hơn $Q_1$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu ghép nhóm: $[10; 20)$: 5, $[20; 30)$: 10, $[30; 40)$: 10, $[40; 50)$: 5. Giá trị $Q_1 + Q_3$ bằng:", "options": ["A. $60$\\;?", "B. $15$", "C. $60$", "D. $61$"], "answer": "C", "explain": "$Q_1 + Q_3 = 22.5 + 37.5 = 60$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số l .08$.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho mẫu số liệu ghép nhóm: $[20; 25)$: 5, $[25; 30)$: 10, $[30; 35)$: 10, $[35; 40)$: 5. Tính tứ phân vị thứ nhất $Q_1$.", "answer": "$26.25$", "explain": "$Q_1 = 26.25$ (nhóm chứa $[25; 30)$).", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "VD", "q": "Thời gian (phút) hoàn thành bài kiểm tra của học sinh được ghép nhóm: $[10; 20)$: 5, $[20; 30)$: 10, $[30; 40)$: 10, $[40; 50)$: 5. Tính khoảng tứ phân vị $\\Delta_Q$ (làm tròn đến hàng phần mười nếu cần).", "options": ["A. $20$", "B. $40$", "C. $15$", "D. $7.5$"], "answer": "C", "explain": "Tính được $Q_1 = 22.5$, $Q_3 = 37.5$, suy ra $\\Delta_Q = 15$ (phút).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu ghép nhóm: $[20; 30)$: 4, $[30; 40)$: 8, $[40; 50)$: 8, $[50; 60)$: 4. Tổng $Q_1 + Q_2 + Q_3$ bằng:", "options": ["A. $120$\\;?", "B. $40$", "C. $120$", "D. $122$"], "answer": "C", "explain": "$Q_1+Q_2+Q_3 = 32.5+40+47.5 = 120$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điểm thi của hai lớp được ghép nhóm. Lớp A có $\\Delta_Q = 7.5$, lớp B có $\\Delta_Q = 15$ (cùng thang điểm). Nhận xét đúng là:", "options": ["A. Lớp A có điểm trung bình cao hơn", "B. Điểm của lớp A phân tán hơn điểm của lớp B", "C. Hai lớp có độ phân tán như nhau", "D. Điểm của lớp B phân tán hơn điểm của lớp A"], "answer": "D", "explain": "$\\Delta_Q$ của lớp B lớn gấp đôi nên điểm lớp B phân tán hơn (không đồng đều bằng).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu ghép nhóm: $[10; 15)$: 5, $[15; 20)$: 10, $[20; 25)$: 10, $[25; 30)$: 5. Nếu thêm một giá trị bất thường rất lớn vào mẫu thì đại lượng nào tăng nhiều nhất?", "options": ["A. Cỡ mẫu $n$", "B. Độ lệch chuẩn $s$", "C. Số trung bình $\\bar{x}$", "D. Phương sai $s^2$"], "answer": "C", "explain": "Giá trị bất thường kéo số trung bình lệch mạnh; phương sai cũng tăng nhưng số trung bình là đại lượng 'trung tâm' bị ảnh hưởng trực tiếp n
