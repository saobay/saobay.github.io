<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Cho hàm số $y = f(x)$ có $f'(x) = (x - 1)(x + 2)$. Hàm số đồng biến trên khoảng nào sau đây?", "options": ["A. $(-2; 1)$", "B. $(1; +\\infty)$", "C. $(-\\infty; -2)$ và $(1; +\\infty)$", "D. $(-\\infty; 1)$"], "answer": "C", "explain": "$f'(x) \\gt 0 \\Leftrightarrow (x - 1)(x + 2) \\gt 0 \\Leftrightarrow x \\lt -2$ hoặc $x \\gt 1$. Vậy hàm số đồng biến trên $(-\\infty; -2)$ và $(1; +\\infty)$."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Đồ thị hàm số $y = \\frac{2x+1}{x-3}$ có tiệm cận đứng và tiệm cận ngang lần lượt là", "options": ["A. $x = 3$ và $y = 2$", "B. $x = -3$ và $y = 2$", "C. $x = 3$ và $y = \\frac{1}{3}$", "D. $x = 2$ và $y = 3$"], "answer": "A", "explain": "Mẫu số bằng $0$ tại $x = 3$ (tử số khác $0$) nên $x = 3$ là tiệm cận đứng. Bậc tử bằng bậc mẫu nên tiệm cận ngang là $y = \\frac{2}{1} = 2$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hàm số $y = x^3 - 3x^2 + 1$ đạt cực đại tại điểm nào?", "options": ["A. $x = 0$", "B. $x = 2$", "C. $x = 1$", "D. $x = -1$"], "answer": "A", "explain": "$y' = 3x^2 - 6x = 3x(x - 2)$; $y'' = 6x - 6$. $y' = 0 \\Leftrightarrow x = 0$ hoặc $x = 2$. $y''(0) = -6 \\lt 0$ nên hàm số đạt cực đại tại $x = 0$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Giá trị nhỏ nhất của hàm số $y = x^3 - 3x$ trên đoạn $[-1; 2]$ bằng", "options": ["A. $2$", "B. $-2$", "C. $0$", "D. $-1$"], "answer": "B", "explain": "$y' = 3x^2 - 3 = 0 \\Leftrightarrow x = \\pm 1$; chỉ $x = 1 \\in (-1; 2)$. $y(-1) = 2$, $y(1) = -2$, $y(2) = 2$. Vậy giá trị nhỏ nhất bằng $-2$."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tiệm cận xiên của đồ thị hàm số $y = \\frac{x^2+1}{x+1}$ là đường thẳng nào?", "options": ["A. $y = x + 1$", "B. $y = x - 1$", "C. $y = 2x - 1$", "D. $y = -x + 1$"], "answer": "B", "explain": "Chia đa thức: $x^2 + 1 = (x + 1)(x - 1) + 2$ nên $y = x - 1 + \\frac{2}{x+1}$. Vì $\\lim_{x \\to \\pm\\infty}\\frac{2}{x+1} = 0$ nên tiệm cận xiên là $y = x - 1$."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Tìm $m$ để phương trình $x^3 - 3x^2 + 2 = m$ có đúng hai nghiệm phân biệt.", "options": ["A. $m = 2$", "B. $m = -2$", "C. $m = 2$ hoặc $m = -2$", "D. $m = 0$"], "answer": "C", "explain": "Xét $f(x) = x^3 - 3x^2 + 2$: $f' = 3x^2 - 6x$, $f$ đạt cực đại tại $(0; 2)$ và cực tiểu tại $(2; -2)$. Đường thẳng $y = m$ cắt đồ thị tại đúng hai điểm phân biệt khi $m$ đi qua một trong hai điểm cực trị, tức $m = 2$ hoặc $m = -2$."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Cho hàm số $y = f(x)$ có đạo hàm trên $\\mathbb{R}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nếu $f'(x) \\ge 0$ với mọi $x$ và $f'(x) = 0$ chỉ tại một số hữu hạn điểm thì $f$ đồng biến trên $\\mathbb{R}$.", "b) Điểm cực tiểu là điểm mà tại đó $f'$ đổi dấu từ $-$ sang $+$.", "c) Nếu $f'(x_0) = 0$ thì $x_0$ chắc chắn là điểm cực trị của $f$.", "d) Mọi hàm số liên tục trên đoạn $[a; b]$ đều có giá trị lớn nhất và giá trị nhỏ nhất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng theo định lí về tính đơn điệu. b) Đúng theo quy tắc tìm cực trị. c) Sai: ví dụ $y = x^3$ có $y'(0) = 0$ nhưng $x = 0$ không phải điểm cực trị. d) Đúng theo định lí Weierstrass."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho hàm số $y = x^3 - 3x + 1$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $y' = 3x^2 - 3$.", "b) Hàm số nghịch biến trên khoảng $(-1; 1)$.", "c) Điểm cực tiểu của đồ thị là $(-1; 3)$.", "d) Đồ thị cắt trục $Oy$ tại điểm $(0; 1)$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng vì $y' = 3(x-1)(x+1) \\lt 0$ khi $-1 \\lt x \\lt 1$. c) Sai: $(-1; 3)$ là điểm cực đại, điểm cực tiểu là $(1; -1)$. d) Đúng vì $y(0) = 1$."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Số điểm cực trị của hàm số $y = x^4 - 2x^2 + 1$ là", "answer": "3", "explain": "$y' = 4x^3 - 4x = 4x(x - 1)(x + 1)$. $y' = 0$ tại $x = -1, 0, 1$ và $y'$ đổi dấu qua cả ba điểm nên hàm số có $3$ điểm cực trị."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một mảnh vườn hình chữ nhật có chu vi $40$ m. Diện tích lớn nhất của mảnh vườn bằng bao nhiêu mét vuông?", "answer": "100", "explain": "Gọi $x$ là một cạnh ($0 \\lt x \\lt 20$), cạnh còn lại là $20 - x$. Diện tích $S(x) = x(20 - x) = -x^2 + 20x$; $S'(x) = 20 - 2x = 0 \\Leftrightarrow x = 10$. $S_{\\max} = S(10) = 100$ m²."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hàm số $y = x^3 + 3x^2 + 3x + 1$ đồng biến trên", "options": ["A. $(-1; +\\infty)$", "B. $(-\\infty; -1)$", "C. $\\mathbb{R} \\setminus \\{-1\\}$", "D. $\\mathbb{R}$"], "answer": "D", "explain": "$y' = 3x^2 + 6x + 3 = 3(x + 1)^2 \\ge 0$ với mọi $x$ và $y' = 0$ chỉ tại $x = -1$ nên hàm số đồng biến trên $\\mathbb{R}$."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Điểm cực đại của đồ thị hàm số $y = -x^3 + 3x + 2$ là", "options": ["A. $(1; 4)$", "B. $(-1; 0)$", "C. $(1; 0)$", "D. $(-1; 4)$"], "answer": "A", "explain": "$y' = -3x^2 + 3 = 0 \\Leftrightarrow x = \\pm 1$. $y'' = -6x$; $y''(1) = -6 \\lt 0$ nên hàm số đạt cực đại tại $x = 1$, $y(1) = 4$. Điểm cực đại là $(1; 4)$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hàm số $y = \\frac{x-1}{x+2}$ đồng biến trên các khoảng nào?", "options": ["A. $(-\\infty; -2)$ và $(-2; +\\infty)$", "B. $\\mathbb{R}$", "C. $(-2; +\\infty)$", "D. $(-\\infty; -2)$"], "answer": "A", "explain": "$y' = \\frac{3}{(x+2)^2} \\gt 0$ với mọi $x \\ne -2$ nên hàm số đồng biến trên từng khoảng xác định $(-\\infty; -2)$ và $(-2; +\\infty)$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Số đường tiệm cận của đồ thị hàm số $y = \\frac{x}{x^2-4}$ là", "options": ["A. $1$", "B. $2$", "C. $3$", "D. $4$"], "answer": "C", "explain": "Mẫu số bằng $0$ tại $x = \\pm 2$ (tử số khác $0$) nên có hai tiệm cận đứng $x = 2$, $x = -2$. Bậc tử nhỏ hơn bậc mẫu nên tiệm cận ngang là $y = 0$. Tổng cộng $3$ đường tiệm cận."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Giá trị lớn nhất của hàm số $y = \\frac{x}{x^2+1}$ trên $\\mathbb{R}$ là", "options": ["A. $1$", "B. $\\frac{1}{2}$", "C. $\\frac{1}{4}$", "D. $2$"], "answer": "B", "explain": "$y' = \\frac{1 - x^2}{(x^2+1)^2} = 0 \\Leftrightarrow x = \\pm 1$. Bảng biến thiên cho thấy $y$ đạt cực đại tại $x = 1$ với $y(1) = \\frac{1}{2}$ và $\\lim_{x \\to \\pm\\infty} y = 0$. Vậy giá trị lớn nhất là $\\frac{1}{2}$."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Có bao nhiêu giá trị nguyên của $m$ thuộc $\\{-5; -4; \\dots; 5\\}$ để hàm số $y = x^3 - 3x^2 + mx - 1$ đồng biến trên $\\mathbb{R}$?", "options": ["A. $2$", "B. $3$", "C. $4$", "D. $5$"], "answer": "B", "explain": "$y' = 3x^2 - 6x + m \\ge 0$ với mọi $x \\Leftrightarrow \\Delta' = 9 - 3m \\le 0 \\Leftrightarrow m \\ge 3$. Trong $\\{-5; \\dots; 5\\}$ có $3$ giá trị $m \\in \\{3; 4; 5\\}$ thỏa mãn."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về tiệm cận:", "statements": ["a) Nếu $\\lim_{x \\to 1^{+}} f(x) = +\\infty$ thì đường thẳng $x = 1$ là tiệm cận đứng của đồ thị $f$.", "b) Nếu $\\lim_{x \\to +\\infty} f(x) = 2$ thì đường thẳng $y = 2$ là tiệm cận ngang của đồ thị $f$.", "c) Đồ thị hàm số $y = \\frac{x+1}{x-1}$ có tiệm cận đứng là đường thẳng $x = -1$.", "d) Đồ thị của mọi hàm đa thức bậc ba đều không có tiệm cận."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng theo định nghĩa tiệm cận đứng. b) Đúng theo định nghĩa tiệm cận ngang. c) Sai: tiệm cận đứng là $x = 1$. d) Đúng vì giới hạn của đa thức tại vô cực luôn là vô cực."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho hàm số $y = x^2 - 4x + 5$ trên đoạn $[0; 3]$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $y' = 2x - 4$.", "b) Hàm số đạt giá trị nhỏ nhất tại $x = 2$.", "c) Giá trị nhỏ nhất của hàm số bằng $1$.", "d) Giá trị lớn nhất của hàm số bằng $2$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: $y' = 0 \\Leftrightarrow x = 2$ và $y'' = 2 \\gt 0$. c) Đúng: $y(2) = 1$. d) Sai: $y(0) = 5$, $y(3) = 2$ nên giá trị lớn nhất bằng $5$."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tổng các giá trị cực trị của hàm số $y = x^3 - 3x^2 + 1$ bằng", "answer": "$-2$", "explain": "$y' = 3x^2 - 6x$; $y''(0) = -6 \\lt 0$ nên $y_{CĐ} = y(0) = 1$; $y''(2) = 6 \\gt 0$ nên $y_{CT} = y(2) = -3$. Tổng các giá trị cực trị là $1 + (-3) = -2$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một hình hộp chữ nhật không nắp có đáy là hình vuông. Tổng diện tích các mặt của hộp bằng $300$ cm². Thể tích lớn nhất của hộp bằng bao nhiêu cm³?", "answer": "500", "explain": "Gọi $x$ là cạnh đáy ($0 \\lt x \\lt \\sqrt{300}$), $h$ là chiều cao. $x^2 + 4xh = 300 \\Rightarrow h = \\frac{300 - x^2}{4x}$. Thể tích $V(x) = x^2h = \\frac{x(300 - x^2)}{4}$; $V'(x) = \\frac{300 - 3x^2}{4} = 0 \\Leftrightarrow x = 10$. $V_{\\max} = V(10) = 500$ cm³."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hàm số $y = x^2 - 2x + 3$ nghịch biến trên khoảng nào?", "options": ["A. $(1; +\\infty)$", "B. $(-\\infty; 1)$", "C. $(-1; 1)$", "D. $\\mathbb{R}$"], "answer": "B", "explain": "$y' = 2x - 2 \\lt 0 \\Leftrightarrow x \\lt 1$ nên hàm số nghịch biến trên $(-\\infty; 1)$."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Tiệm cận ngang của đồ thị hàm số $y = \\frac{2x-1}{x+2}$ là đường thẳng", "options": ["A. $y = 2$", "B. $y = -2$", "C. $y = \\frac{1}{2}$", "D. $x = -2$"], "answer": "A", "explain": "Bậc tử bằng bậc mẫu nên tiệm cận ngang là $y = \\frac{2}{1} = 2$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Số điểm cực trị của hàm số $y = -x^4 + 2x^2 + 3$ là", "options": ["A. $1$", "B. $2$", "C. $3$", "D. $0$"], "answer": "C", "explain": "$y' = -4x^3 + 4x = -4x(x - 1)(x + 1)$. $y' = 0$ tại $x = -1, 0, 1$ và $y'$ đổi dấu qua cả ba điểm nên hàm số có $3$ điểm cực trị."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hàm số nào sau đây đồng biến trên $\\mathbb{R}$?", "options": ["A. $y = x^3 - 3x$", "B. $y = x^3 + x$", "C. $y = -x^3 + x$", "D. $y = x^2 - 1$"], "answer": "B", "explain": "Với $y = x^3 + x$ ta có $y' = 3x^2 + 1 \\gt 0$ với mọi $x$ nên hàm số đồng biến trên $\\mathbb{R}$. Các hàm còn lại đều có $y'$ đổi dấu."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tiệm cận xiên của đồ thị hàm số $y = \\frac{2x^2-3x+1}{x-1}$ là đường thẳng nào?", "options": ["A. $y = 2x - 1$", "B. $y = 2x + 1$", "C. $y = x - 1$", "D. $y = x + 1$"], "answer": "A", "explain": "$2x^2 - 3x + 1 = (x - 1)(2x - 1)$ nên với $x \\ne 1$ ta có $y = 2x - 1$. Vậy tiệm cận xiên là đường thẳng $y = 2x - 1$."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hàm số $y = x^3 - 3mx + 1$ có hai điểm cực trị $x_1, x_2$ thỏa mãn $x_1^2 + x_2^2 = 8$. Giá trị của $m$ bằng", "options": ["A. $2$", "B. $-4$", "C. $4$", "D. $8$"], "answer": "C", "explain": "$y' = 3x^2 - 3m = 0 \\Leftrightarrow x^2 = m$ (cần $m \\gt 0$). Theo Viète: $x_1 + x_2 = 0$, $x_1x_2 = -m$. $x_1^2 + x_2^2 = (x_1+x_2)^2 - 2x_1x_2 = 2m = 8 \\Rightarrow m = 4$."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Cho hàm số $y = f(x)$ xác định trên $D$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $M$ là giá trị lớn nhất của $f$ trên $D$ nếu $f(x) \\le M$ với mọi $x \\in D$ và tồn tại $x_0 \\in D$ sao cho $f(x_0) = M$.", "b) $m$ là giá trị nhỏ nhất của $f$ trên $D$ nếu $f(x) \\ge m$ với mọi $x \\in D$ và tồn tại $x_1 \\in D$ sao cho $f(x_1) = m$.", "c) Mọi hàm số liên tục trên khoảng $(a; b)$ đều có giá trị lớn nhất.", "d) Nếu $f$ đồng biến trên $[a; b]$ thì giá trị lớn nhất của $f$ trên $[a; b]$ là $f(b)$."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng theo định nghĩa giá trị lớn nhất, giá trị nhỏ nhất. c) Sai: ví dụ $y = \\frac{1}{x}$ trên $(0; 1)$ không có giá trị lớn nhất. d) Đúng vì hàm đồng biến đạt giá trị lớn nhất tại đầu phải của đoạn."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho hàm số $y = -x^3 + 3x^2 - 2$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị cắt trục $Oy$ tại điểm $(0; -2)$.", "b) $y' = -3x^2 + 6x$.", "c) Hàm số đạt cực đại tại $x = 0$.", "d) Giá trị cực đại của hàm số bằng $2$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $y(0) = -2$. b) Đúng. c) Sai: $y' = -3x(x - 2)$; $y'$ đổi dấu từ $-$ sang $+$ qua $x = 0$ nên $x = 0$ là điểm cực tiểu. d) Đúng: cực đại tại $x = 2$, $y(2) = -8 + 12 - 2 = 2$."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Đồ thị hàm số $y = \\frac{x^2-4}{x^2+1}$ có tiệm cận ngang $y = a$. Giá trị của $a$ bằng", "answer": "1", "explain": "Bậc tử bằng bậc mẫu nên tiệm cận ngang là $y = \\frac{1}{1} = 1$. Vậy $a = 1$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Giá trị nhỏ nhất của hàm số $y = x + \\frac{4}{x}$ trên khoảng $(0; +\\infty)$ bằng", "answer": "4", "explain": "$y' = 1 - \\frac{4}{x^2} = 0 \\Leftrightarrow x = 2$ (loại $x = -2$). $y'' = \\frac{8}{x^3}$; $y''(2) \\gt 0$ nên $y$ đạt cực tiểu tại $x = 2$. $\\lim_{x \\to 0^{+}} y = +\\infty$, $\\lim_{x \\to +\\infty} y = +\\infty$ nên giá trị nhỏ nhất là $y(2) = 4$."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Điểm cực tiểu của đồ thị hàm số $y = x^2 - 4x + 1$ là", "options": ["A. $(2; -3)$", "B. $(-2; 13)$", "C. $(2; 3)$", "D. $(0; 1)$"], "answer": "A", "explain": "$y' = 2x - 4 = 0 \\Leftrightarrow x = 2$; $y'' = 2 \\gt 0$ nên $x = 2$ là điểm cực tiểu, $y(2) = -3$. Điểm cực tiểu là $(2; -3)$."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Giá trị nhỏ nhất của hàm số $y = x^2 + 2x + 5$ trên $\\mathbb{R}$ là", "options": ["A. $4$", "B. $5$", "C. $-1$", "D. $1$"], "answer": "A", "explain": "$y' = 2x + 2 = 0 \\Leftrightarrow x = -1$; $y'' = 2 \\gt 0$ nên $y$ đạt cực tiểu (cũng là giá trị nhỏ nhất trên $\\mathbb{R}$) tại $x = -1$, $y(-1) = 4$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Số đường tiệm cận của đồ thị hàm số $y = \\frac{x^2+1}{x}$ là", "options": ["A. $1$", "B. $2$", "C. $3$", "D. $0$"], "answer": "B", "explain": "$\\lim_{x \\to 0} \\frac{x^2+1}{x} = \\pm\\infty$ nên $x = 0$ là tiệm cận đứng. $y = x + \\frac{1}{x}$ nên $y = x$ là tiệm cận xiên. Tổng cộng $2$ đường tiệm cận."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho hàm số $y = f(x)$ có $f'(x) = x(x-2)^2$. Khẳng định nào sau đây đúng?", "options": ["A. Hàm số đạt cực đại tại $x = 2$.", "B. Hàm số đồng biến trên $\\mathbb{R}$.", "C. Hàm số nghịch biến trên khoảng $(-\\infty; 0)$.", "D. Hàm số có hai điểm cực trị."], "answer": "C", "explain": "$f'(x) = x(x-2)^2 \\lt 0 \\Leftrightarrow x \\lt 0$ nên $f$ nghịch biến trên $(-\\infty; 0)$. $f'$ chỉ đổi dấu qua $x = 0$ (qua $x = 2$ không đổi dấu) nên $f$ có đúng một điểm cực trị."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Số giao điểm của đồ thị $(C): y = \\frac{x+1}{x-1}$ với đường thẳng $d: y = 2x$ là", "options": ["A. $0$", "B. $1$", "C. $2$", "D. $3$"], "answer": "C", "explain": "Phương trình hoành độ giao điểm: $\\frac{x+1}{x-1} = 2x \\Leftrightarrow x + 1 = 2x(x-1) \\Leftrightarrow 2x^2 - 3x - 1 = 0$ ($x \\ne 1$). $\\Delta = 17 \\gt 0$ và không có nghiệm nào bằng $1$ nên có $2$ giao điểm."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Có bao nhiêu giá trị nguyên của $m$ để hàm số $y = \\frac{mx+1}{x+m}$ nghịch biến trên từng khoảng xác định?", "options": ["A. $0$", "B. $1$", "C. $2$", "D. $3$"], "answer": "B", "explain": "$y' = \\frac{m^2 - 1}{(x+m)^2}$. Hàm số nghịch biến trên từng khoảng xác định $\\Leftrightarrow m^2 - 1 \\lt 0 \\Leftrightarrow -1 \\lt m \\lt 1$. Giá trị nguyên duy nhất là $m = 0$."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nếu $f'(x) \\gt 0$ với mọi $x \\in (a; b)$ thì $f$ đồng biến trên $(a; b)$.", "b) Nếu $f'(x_0) = 0$ thì $x_0$ là điểm cực trị của $f$.", "c) Hàm số $y = x^3$ không có cực trị.", "d) Hàm số $y = -x^2$ đạt cực đại tại $x = 0$."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng theo định lí về tính đơn điệu. b) Sai: $y = x^3$ có $y'(0) = 0$ nhưng $x = 0$ không phải điểm cực trị. c) Đúng vì $y' = 3x^2 \\ge 0$ không đổi dấu. d) Đúng vì $y'' = -2 \\lt 0$."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho hàm số $y = \\frac{2x+3}{x-1}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị có tiệm cận đứng là đường thẳng $x = 1$.", "b) Đồ thị có tiệm cận ngang là đường thẳng $y = 2$.", "c) Giao điểm của hai đường tiệm cận là điểm $(1; 2)$.", "d) Đồ thị đi qua điểm $(2; 8)$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: mẫu bằng $0$ tại $x = 1$. b) Đúng: $y \\to 2$ khi $x \\to \\pm\\infty$. c) Đúng: tâm đối xứng là giao điểm hai tiệm cận. d) Sai: $y(2) = 7 \\ne 8$."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Cho hàm số $y = x^3 + ax^2 + bx + c$ đạt cực tiểu tại $x = 1$ với giá trị cực tiểu bằng $0$ và đạt cực đại tại $x = -1$. Giá trị của $c$ bằng", "answer": "2", "explain": "$y' = 3x^2 + 2ax + b$. $y'(1) = 0$ và $y'(-1) = 0$ cho hệ $3 + 2a + b = 0$, $3 - 2a + b = 0$, suy ra $a = 0$, $b = -3$. $y(1) = 1 + a + b + c = 0 \\Rightarrow 1 - 3 + c = 0 \\Rightarrow c = 2$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Người ta muốn xây một bể chứa nước hình hộp chữ nhật (có nắp) có thể tích $1000$ m³, đáy là hình vuông. Để diện tích toàn phần của bể nhỏ nhất thì chiều cao của bể bằng bao nhiêu mét?", "answer": "10", "explain": "Gọi $x$ là cạnh đáy ($x \\gt 0$), $h$ là chiều cao. $x^2h = 1000 \\Rightarrow h = \\frac{1000}{x^2}$. Diện tích toàn phần $S(x) = 2x^2 + 4xh = 2x^2 + \\frac{4000}{x}$; $S'(x) = 4x - \\frac{4000}{x^2} = 0 \\Leftrightarrow x^3 = 1000 \\Leftrightarrow x = 10$. Khi đó $h = \\frac{1000}{100} = 10$ m."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tiệm cận ngang của đồ thị hàm số $y = \\frac{x-2}{2x+1}$ là đường thẳng", "options": ["A. $y = \\frac{1}{2}$", "B. $y = -\\frac{1}{2}$", "C. $y = 2$", "D. $y = -2$"], "answer": "A", "explain": "Bậc tử bằng bậc mẫu nên tiệm cận ngang là $y = \\frac{1}{2}$."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Hàm số $y = -x^3 + 3x^2 - 3x + 1$ nghịch biến trên", "options": ["A. $\\mathbb{R}$", "B. $(-\\infty; 1)$", "C. $(1; +\\infty)$", "D. $\\mathbb{R} \\setminus \\{1\\}$"], "answer": "A", "explain": "$y' = -3x^2 + 6x - 3 = -3(x - 1)^2 \\le 0$ với mọi $x$ và $y' = 0$ chỉ tại $x = 1$ nên hàm số nghịch biến trên $\\mathbb{R}$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hàm số $y = x^4 - 4x^2 + 3$ đạt cực tiểu tại", "options": ["A. $x = 0$", "B. $x = \\pm\\sqrt{2}$", "C. $x = \\sqrt{2}$", "D. $x = -\\sqrt{2}$"], "answer": "B", "explain": "$y' = 4x^3 - 8x = 4x(x^2 - 2)$; $y'' = 12x^2 - 8$. $y''(\\pm\\sqrt{2}) = 16 \\gt 0$ nên hàm số đạt cực tiểu tại $x = \\sqrt{2}$ và $x = -\\sqrt{2}$ (tức $x = \\pm\\sqrt{2}$)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Giá trị lớn nhất của hàm số $y = -x^2 + 4x - 1$ trên đoạn $[0; 5]$ bằng", "options": ["A. $3$", "B. $-1$", "C. $-6$", "D. $7$"], "answer": "A", "explain": "$y' = -2x + 4 = 0 \\Leftrightarrow x = 2 \\in (0; 5)$. $y(0) = -1$, $y(2) = 3$, $y(5) = -6$. Vậy giá trị lớn nhất bằng $3$."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Đồ thị hàm số $y = \\frac{2x-1}{x-1}$ cắt đường thẳng $y = x$ tại bao nhiêu điểm?", "options": ["A. $0$", "B. $1$", "C. $2$", "D. $3$"], "answer": "C", "explain": "Phương trình hoành độ giao điểm: $\\frac{2x-1}{x-1} = x \\Leftrightarrow 2x - 1 = x(x-1) \\Leftrightarrow x^2 - 3x + 1 = 0$ ($x \\ne 1$). $\\Delta = 5 \\gt 0$ và không có nghiệm nào bằng $1$ nên có $2$ giao điểm."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Tìm $m$ để đồ thị hàm số $y = \\frac{x^2+mx+1}{x-1}$ có tiệm cận xiên đi qua điểm $(1; 3)$.", "options": ["A. $m = 1$", "B. $m = 2$", "C. $m = 0$", "D. $m = -1$"], "answer": "A", "explain": "$x^2 + mx + 1 = (x - 1)(x + m + 1) + (m + 2)$ nên tiệm cận xiên là $y = x + m + 1$ (với $m \\ne -2$). Đường này đi qua $(1; 3) \\Leftrightarrow 3 = 1 + m + 1 \\Leftrightarrow m = 1$ (thỏa $m \\ne -2$)."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về đồ thị hàm số:", "statements": ["a) Đồ thị hàm số bậc ba $y = ax^3 + bx^2 + cx + d$ ($a \\ne 0$) luôn có tâm đối xứng.", "b) Đồ thị hàm số $y = \\frac{ax+b}{cx+d}$ nhận giao điểm của hai đường tiệm cận làm tâm đối xứng.", "c) Đồ thị hàm số trùng phương $y = ax^4 + bx^2 + c$ nhận trục $Oy$ làm trục đối xứng.", "d) Mọi hàm số bậc ba đều có hai điểm cực trị."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: tâm đối xứng là điểm uốn. b) Đúng. c) Đúng vì đây là hàm chẵn. d) Sai: ví dụ $y = x^3$ không có cực trị."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho hàm số $f(x) = x^3 - 3x^2 + 3x - 1$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $f'(x) = 3(x-1)^2$.", "b) $f'(x) \\ge 0$ với mọi $x \\in \\mathbb{R}$.", "c) Hàm số $f$ đồng biến trên $\\mathbb{R}$.", "d) Hàm số $f$ có điểm cực trị."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng vì $f(x) = (x-1)^3$. b) Đúng. c) Đúng vì $f' = 0$ chỉ tại $x = 1$. d) Sai: $f'$ không đổi dấu nên $f$ không có cực trị."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Giá trị nhỏ nhất của hàm số $y = x^3 - 3x^2 + 5$ trên đoạn $[0; 3]$ bằng", "answer": "$-3$", "explain": "$y' = 3x^2 - 6x = 3x(x - 2)$; điểm tới hạn trong $(0; 3)$ là $x = 2$. $y(0) = 5$, $y(2) = -3$, $y(3) = 5$. Vậy giá trị nhỏ nhất bằng $-3$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một trang trại cần rào một mảnh đất hình chữ nhật có diện tích $200$ m², một cạnh của mảnh đất giáp con sông nên không cần rào. Chiều dài hàng rào ngắn nhất có thể bằng bao nhiêu mét?", "answer": "40", "explain": "Gọi $x$ là cạnh vuông góc với sông ($x \\gt 0$), cạnh song song với sông là $\\frac{200}{x}$. Chiều dài hàng rào $L(x) = 2x + \\frac{200}{x}$; $L'(x) = 2 - \\frac{200}{x^2} = 0 \\Leftrightarrow x = 10$. $L_{\\min} = L(10) = 40$ m."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hàm số $y = x^2 - 6x + 8$ đồng biến trên khoảng nào?", "options": ["A. $(3; +\\infty)$", "B. $(-\\infty; 3)$", "C. $(-3; 3)$", "D. $\\mathbb{R}$"], "answer": "A", "explain": "$y' = 2x - 6 \\gt 0 \\Leftrightarrow x \\gt 3$ nên hàm số đồng biến trên $(3; +\\infty)$."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Đồ thị hàm số $y = \\frac{3}{x-5}$ có tiệm cận đứng và tiệm cận ngang lần lượt là", "options": ["A. $x = 5$ và $y = 0$", "B. $x = -5$ và $y = 0$", "C. $x = 5$ và $y = 3$", "D. $x = 0$ và $y = 5$"], "answer": "A", "explain": "Mẫu số bằng $0$ tại $x = 5$ nên $x = 5$ là tiệm cận đứng. $\\lim_{x \\to \\pm\\infty} \\frac{3}{x-5} = 0$ nên $y = 0$ là tiệm cận ngang."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hàm số $y = \\frac{2x+1}{x-3}$ nghịch biến trên", "options": ["A. $(-\\infty; 3)$ và $(3; +\\infty)$", "B. $\\mathbb{R}$", "C. $(-\\infty; 3)$", "D. $(3; +\\infty)$"], "answer": "A", "explain": "$y' = \\frac{-7}{(x-3)^2} \\lt 0$ với mọi $x \\ne 3$ nên hàm số nghịch biến trên từng khoảng xác định $(-\\infty; 3)$ và $(3; +\\infty)$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Giá trị cực tiểu của hàm số $y = x^3 - 3x + 2$ bằng", "options": ["A. $0$", "B. $4$", "C. $2$", "D. $-2$"], "answer": "A", "explain": "$y' = 3x^2 - 3 = 0 \\Leftrightarrow x = \\pm 1$; $y'' = 6x$; $y''(1) = 6 \\gt 0$ nên hàm số đạt cực tiểu tại $x = 1$, $y_{CT} = y(1) = 0$."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Giá trị nhỏ nhất của hàm số $y = x^2 + \\frac{16}{x}$ trên khoảng $(0; +\\infty)$ bằng", "options": ["A. $8$", "B. $10$", "C. $12$", "D. $16$"], "answer": "C", "explain": "$y' = 2x - \\frac{16}{x^2} = 0 \\Leftrightarrow 2x^3 = 16 \\Leftrightarrow x = 2$. $y'' = 2 + \\frac{32}{x^3} \\gt 0$ trên $(0; +\\infty)$ nên $x = 2$ là điểm cực tiểu; $\\lim_{x \\to 0^{+}} y = \\lim_{x \\to +\\infty} y = +\\infty$ nên giá trị nhỏ nhất là $y(2) = 12$."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho hàm số $y = ax^3 + bx^2 + cx + d$ có đồ thị đi qua gốc tọa độ, có điểm cực đại $(-1; 2)$ và điểm cực tiểu $(1; -2)$. Giá trị của $a$ bằng", "options": ["A. $1$", "B. $-1$", "C. $2$", "D. $\\frac{1}{2}$"], "answer": "A", "explain": "Đi qua gốc tọa độ nên $d = 0$. $y' = 3ax^2 + 2bx + c$; $y'(-1) = y'(1) = 0$ cho $3a - 2b + c = 0$ và $3a + 2b + c = 0$, suy ra $b = 0$, $c = -3a$. $y(1) = a + c = -2a = -2 \\Rightarrow a = 1$ (thỏa $y(-1) = 2$)."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị hàm số $y = \\frac{1}{x^2+1}$ có tiệm cận ngang là đường thẳng $y = 0$.", "b) Đồ thị hàm số $y = \\frac{1}{x^2+1}$ có tiệm cận đứng.", "c) Hàm số $y = e^x$ có tiệm cận ngang là đường thẳng $y = 0$.", "d) Đồ thị hàm số $y = \\frac{x}{x+1}$ cắt đường tiệm cận ngang của nó."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng vì bậc tử nhỏ hơn bậc mẫu. b) Sai vì $x^2 + 1 \\ne 0$ với mọi $x$. c) Đúng vì $\\lim_{x \\to -\\infty} e^x = 0$. d) Sai: tiệm cận ngang là $y = 1$ mà $\\frac{x}{x+1} = 1$ vô nghiệm."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho hàm số $y = x^4 - 2x^2 - 3$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $y' = 4x^3 - 4x$.", "b) Hàm số có ba điểm cực trị.", "c) Giá trị cực đại của hàm số bằng $-4$.", "d) Hàm số đạt cực tiểu tại $x = 1$ và $x = -1$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: $y' = 4x(x-1)(x+1)$ đổi dấu qua cả ba nghiệm. c) Sai: cực đại tại $x = 0$, $y_{CĐ} = y(0) = -3$. d) Đúng: $y''(\\pm 1) = 8 \\gt 0$."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tâm đối xứng của đồ thị hàm số $y = \\frac{3x+2}{x-1}$ là điểm $I(a; b)$. Tính $a + b$.", "answer": "4", "explain": "Đồ thị có tiệm cận đứng $x = 1$ và tiệm cận ngang $y = 3$ nên tâm đối xứng là giao điểm $I(1; 3)$. Vậy $a + b = 1 + 3 = 4$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một vật chuyển động với quãng đường $s(t) = t^3 - 6t^2 + 9t$ (m), $t \\ge 0$ (giây). Vận tốc lớn nhất của vật trong khoảng thời gian $t \\in [0; 4]$ bằng bao nhiêu m/s?", "answer": "9", "explain": "Vận tốc $v(t) = s'(t) = 3t^2 - 12t + 9$. $v'(t) = 6t - 12 = 0 \\Leftrightarrow t = 2$. $v(0) = 9$, $v(2) = -3$, $v(4) = 9$. Vậy vận tốc lớn nhất là $9$ m/s."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Cho hàm số $f$ liên tục trên $[1; 3]$ có $f(1) = 2$, $f(3) = 5$ và không có điểm tới hạn nào trong khoảng $(1; 3)$. Giá trị lớn nhất của $f$ trên $[1; 3]$ bằng", "options": ["A. $2$", "B. $5$", "C. $7$", "D. $3$"], "answer": "B", "explain": "Vì không có điểm tới hạn trong $(1; 3)$ nên giá trị lớn nhất chỉ có thể đạt tại đầu mút. $\\max\\{f(1); f(3)\\} = \\max\\{2; 5\\} = 5$."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Hàm số $y = x^3 - 12x + 1$ có bao nhiêu điểm cực trị?", "options": ["A. $0$", "B. $1$", "C. $2$", "D. $3$"], "answer": "C", "explain": "$y' = 3x^2 - 12 = 3(x - 2)(x + 2)$ đổi dấu qua cả hai nghiệm $x = -2$ và $x = 2$ nên hàm số có $2$ điểm cực trị."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Các đường tiệm cận đứng của đồ thị hàm số $y = \\frac{x^2-1}{x^2-4}$ là", "options": ["A. $x = 2$ và $x = -2$", "B. $x = 1$ và $x = -1$", "C. $x = 4$", "D. $x = 0$"], "answer": "A", "explain": "Mẫu số bằng $0$ tại $x = \\pm 2$ mà tử số khác $0$ tại đó nên các tiệm cận đứng là $x = 2$ và $x = -2$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hàm số $y = x^3 - 6x^2 + 9x - 1$ nghịch biến trên khoảng nào?", "options": ["A. $(1; 3)$", "B. $(-\\infty; 1)$", "C. $(3; +\\infty)$", "D. $(-1; 1)$"], "answer": "A", "explain": "$y' = 3x^2 - 12x + 9 = 3(x - 1)(x - 3) \\lt 0 \\Leftrightarrow 1 \\lt x \\lt 3$ nên hàm số nghịch biến trên $(1; 3)$."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Có bao nhiêu giá trị của $m$ để hàm số $y = x^3 - 3x^2 + mx$ đạt cực trị tại $x = 1$?", "options": ["A. $0$", "B. $1$", "C. $2$", "D. Vô số"], "answer": "A", "explain": "$y' = 3x^2 - 6x + m$; $y'(1) = 0 \\Leftrightarrow m = 3$. Nhưng khi $m = 3$ thì $y' = 3(x-1)^2 \\ge 0$ không đổi dấu nên $x = 1$ không phải điểm cực trị. Vậy không có giá trị $m$ nào thỏa mãn."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho hàm số $y = f(x)$ có $f'(x) = (x-1)^2(x-2)$. Số điểm cực trị của hàm số $f$ là", "options": ["A. $0$", "B. $1$", "C. $2$", "D. $3$"], "answer": "B", "explain": "$f'(x) = 0$ tại $x = 1$ và $x = 2$. Qua $x = 1$, $f'$ không đổi dấu (do $(x-1)^2 \\ge 0$); qua $x = 2$, $f'$ đổi dấu từ $-$ sang $+$. Vậy $f$ có đúng $1$ điểm cực trị tại $x = 2$."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nếu $f$ đồng biến trên $[a; b]$ thì giá trị nhỏ nhất của $f$ trên $[a; b]$ là $f(a)$.", "b) Nếu $f$ nghịch biến trên $[a; b]$ thì giá trị lớn nhất của $f$ trên $[a; b]$ là $f(a)$.", "c) Điểm cực đại của hàm số luôn là giá trị lớn nhất của hàm số.", "d) Hàm số $y = \\frac{1}{x}$ có giá trị nhỏ nhất trên khoảng $(0; +\\infty)$."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng vì hàm đơn điệu đạt cực trị tại đầu mút đoạn. c) Sai: cực đại là giá trị lớn nhất cục bộ, chưa chắc là lớn nhất toàn cục. d) Sai: $\\lim_{x \\to +\\infty} \\frac{1}{x} = 0$ nhưng không đạt được giá trị $0$."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho hàm số $y = \\frac{x^2+2x}{x+1}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị có tiệm cận đứng là đường thẳng $x = -1$.", "b) $y = x + 1 - \\frac{1}{x+1}$ với mọi $x \\ne -1$.", "c) Đồ thị có tiệm cận xiên là đường thẳng $y = x + 1$.", "d) Đồ thị cắt đường tiệm cận đứng của nó tại một điểm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: mẫu bằng $0$ tại $x = -1$. b) Đúng vì $x^2 + 2x = (x+1)(x+1) - 1$. c) Đúng vì $\\frac{-1}{x+1} \\to 0$ khi $x \\to \\pm\\infty$. d) Sai: đồ thị không bao giờ cắt tiệm cận đứng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Hàm số $y = -2x^3 + 3x^2 + 12x - 5$ đồng biến trên khoảng $(a; b)$. Tính $b - a$.", "answer": "3", "explain": "$y' = -6x^2 + 6x + 12 = -6(x - 2)(x + 1) \\gt 0 \\Leftrightarrow -1 \\lt x \\lt 2$. Vậy $(a; b) = (-1; 2)$ và $b - a = 3$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Giá trị lớn nhất của hàm số $y = x^3 - 3x^2 - 9x + 2$ trên đoạn $[-2; 2]$ bằng", "answer": "7", "explain": "$y' = 3x^2 - 6x - 9 = 3(x - 3)(x + 1)$; điểm tới hạn trong $(-2; 2)$ là $x = -1$. $y(-2) = 0$, $y(-1) = 7$, $y(2) = -20$. Vậy giá trị lớn nhất bằng $7$."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tiệm cận ngang của đồ thị hàm số $y = \\frac{4x}{x+3}$ là đường thẳng", "options": ["A. $y = 4$", "B. $y = -4$", "C. $y = 3$", "D. $x = -3$"], "answer": "A", "explain": "Bậc tử bằng bậc mẫu nên tiệm cận ngang là $y = \\frac{4}{1} = 4$."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Hàm số $y = \\ln x$ đồng biến trên", "options": ["A. $(0; +\\infty)$", "B. $\\mathbb{R}$", "C. $(-\\infty; 0)$", "D. $[0; +\\infty)$"], "answer": "A", "explain": "Tập xác định là $(0; +\\infty)$ và $y' = \\frac{1}{x} \\gt 0$ với mọi $x \\gt 0$ nên hàm số đồng biến trên $(0; +\\infty)$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Điểm cực đại của đồ thị hàm số $y = -x^3 + 6x^2 - 9x + 1$ là", "options": ["A. $(3; 1)$", "B. $(1; -3)$", "C. $(3; -1)$", "D. $(1; 3)$"], "answer": "A", "explain": "$y' = -3x^2 + 12x - 9 = -3(x - 1)(x - 3)$. $y'$ đổi dấu từ $+$ sang $-$ qua $x = 3$ nên hàm số đạt cực đại tại $x = 3$, $y(3) = 1$. Điểm cực đại là $(3; 1)$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Giá trị nhỏ nhất của hàm số $y = x^4 - 2x^2 + 3$ trên đoạn $[-1; 2]$ bằng", "options": ["A. $2$", "B. $3$", "C. $11$", "D. $1$"], "answer": "A", "explain": "$y' = 4x^3 - 4x = 4x(x-1)(x+1)$; các điểm tới hạn trong $(-1; 2)$ là $x = 0, 1$. $y(-1) = 2$, $y(0) = 3$, $y(1) = 2$, $y(2) = 11$. Vậy giá trị nhỏ nhất bằng $2$."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Đồ thị hàm số $y = \\frac{3x^2+2}{x^2+1}$ có bao nhiêu đường tiệm cận?", "options": ["A. $0$", "B. $1$", "C. $2$", "D. $3$"], "answer": "B", "explain": "$x^2 + 1 \\ne 0$ với mọi $x$ nên không có tiệm cận đứng. Bậc tử bằng bậc mẫu nên có một tiệm cận ngang $y = 3$. Tổng cộng $1$ đường tiệm cận."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Giá trị lớn nhất của hàm số $y = x^3 - 3x + m$ trên đoạn $[0; 2]$ bằng $5$. Giá trị của $m$ bằng", "options": ["A. $1$", "B. $3$", "C. $5$", "D. $7$"], "answer": "B", "explain": "Đặt $g(x) = x^3 - 3x$; $g' = 3x^2 - 3 = 0 \\Leftrightarrow x = 1 \\in (0; 2)$. $g(0) = 0$, $g(1) = -2$, $g(2) = 2$ nên $\\max_{[0;2]} g = 2$. Giá trị lớn nhất của $y = g(x) + m$ là $m + 2 = 5 \\Rightarrow m = 3$."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hàm số $y = x^3$ đồng biến trên $\\mathbb{R}$.", "b) Hàm số $y = \\frac{1}{x}$ nghịch biến trên $\\mathbb{R}$.", "c) Hàm số $y = e^{-x}$ nghịch biến trên $\\mathbb{R}$.", "d) Hàm số $y = \\sqrt{x}$ nghịch biến trên khoảng $(0; +\\infty)$."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: $y' = 3x^2 \\ge 0$. b) Sai: $y = \\frac{1}{x}$ chỉ nghịch biến trên từng khoảng $(-\\infty; 0)$ và $(0; +\\infty)$, không xác định tại $x = 0$. c) Đúng: $y' = -e^{-x} \\lt 0$. d) Sai: $y' = \\frac{1}{2\\sqrt{x}} \\gt 0$ nên đồng biến."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho hàm số $y = \\frac{x^2}{x-1}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $y' = \\frac{x^2-2x}{(x-1)^2}$.", "b) $y' = 0$ khi $x = 0$ hoặc $x = 2$.", "c) Hàm số đạt cực đại tại $x = 2$.", "d) Giá trị cực tiểu của hàm số bằng $4$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng theo quy tắc đạo hàm thương. b) Đúng. c) Sai: $y'$ đổi dấu từ $+$ sang $-$ qua $x = 0$ nên cực đại tại $x = 0$; cực tiểu tại $x = 2$. d) Đúng: $y(2) = 4$."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Đồ thị hàm số $y = \\frac{2x^2-x+1}{x-2}$ có tiệm cận xiên $y = ax + b$. Tính $a + b$.", "answer": "5", "explain": "$2x^2 - x + 1 = (x - 2)(2x + 3) + 7$ nên tiệm cận xiên là $y = 2x + 3$, tức $a = 2$, $b = 3$. Vậy $a + b = 5$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một người nông dân có $100$ m hàng rào muốn rào một mảnh đất hình chữ nhật, trong đó một cạnh của mảnh đất giáp con đường nên không cần rào. Diện tích lớn nhất có thể rào được bằng bao nhiêu mét vuông?", "answer": "1250", "explain": "Gọi $x$ là cạnh vuông góc với đường ($0 \\lt x \\lt 50$), cạnh còn lại là $100 - 2x$. Diện tích $S(x) = x(100 - 2x)$; $S'(x) = 100 - 4x = 0 \\Leftrightarrow x = 25$. $S_{\\max} = S(25) = 1250$ m²."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Cho hàm số $y = x^3 + 1$ có $y' = 3x^2$. Khẳng định nào sau đây đúng?", "options": ["A. Hàm số có hai điểm cực trị.", "B. Hàm số đạt cực đại tại $x = 0$.", "C. Hàm số không có cực trị.", "D. Hàm số đạt cực tiểu tại $x = 0$."], "answer": "C", "explain": "$y' = 3x^2 \\ge 0$ với mọi $x$ và không đổi dấu qua $x = 0$ nên hàm số đồng biến trên $\\mathbb{R}$ và không có cực trị."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Tiệm cận đứng của đồ thị hàm số $y = \\frac{x+5}{x-2}$ là đường thẳng", "options": ["A. $x = 2$", "B. $x = -2$", "C. $x = 5$", "D. $y = 1$"], "answer": "A", "explain": "Mẫu số bằng $0$ tại $x = 2$ (tử số khác $0$) nên $x = 2$ là tiệm cận đứng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hàm số $y = x^3 - 3x^2$ đồng biến trên các khoảng nào?", "options": ["A. $(-\\infty; 0)$ và $(2; +\\infty)$", "B. $(0; 2)$", "C. $(-\\infty; 2)$", "D. $(0; +\\infty)$"], "answer": "A", "explain": "$y' = 3x^2 - 6x = 3x(x - 2) \\gt 0 \\Leftrightarrow x \\lt 0$ hoặc $x \\gt 2$ nên hàm số đồng biến trên $(-\\infty; 0)$ và $(2; +\\infty)$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Giá trị lớn nhất của hàm số $y = -2x^2 + 8x - 3$ trên $\\mathbb{R}$ bằng", "options": ["A. $5$", "B. $3$", "C. $2$", "D. $13$"], "answer": "A", "explain": "$y' = -4x + 8 = 0 \\Leftrightarrow x = 2$; $y'' = -4 \\lt 0$ nên $y$ đạt cực đại (cũng là giá trị lớn nhất trên $\\mathbb{R}$) tại $x = 2$, $y(2) = 5$."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Đồ thị hàm số $y = x^4 - 2x^2 + 1$ cắt trục hoành tại bao nhiêu điểm?", "options": ["A. $4$", "B. $3$", "C. $2$", "D. $1$"], "answer": "C", "explain": "$y = (x^2 - 1)^2 = 0 \\Leftrightarrow x = \\pm 1$. Đồ thị cắt trục hoành tại hai điểm $(-1; 0)$ và $(1; 0)$ (tiếp xúc tại mỗi điểm)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Có bao nhiêu giá trị nguyên của $m$ thuộc $[-5; 5]$ để hàm số $y = (m-1)x^3 + 2x^2 + 3x + 1$ đồng biến trên $\\mathbb{R}$?", "options": ["A. $3$", "B. $4$", "C. $5$", "D. $6$"], "answer": "B", "explain": "$y' = 3(m-1)x^2 + 4x + 3 \\ge 0$ với mọi $x \\Leftrightarrow 3(m-1) \\gt 0$ và $\\Delta = 16 - 36(m-1) \\le 0$, tức $m \\gt 1$ và $m \\ge \\frac{13}{9}$. Suy ra $m \\ge 2$. Trong $[-5; 5]$ có $4$ giá trị $m \\in \\{2; 3; 4; 5\\}$."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về khảo sát hàm số:", "statements": ["a) Để vẽ đồ thị hàm số, ta cần tìm tập xác định, tính đạo hàm và lập bảng biến thiên.", "b) Đồ thị của mọi hàm số đều cắt trục tung.", "c) Số giao điểm của đồ thị với trục hoành bằng số nghiệm của phương trình $f(x) = 0$.", "d) Đồ thị hàm số chẵn nhận gốc tọa độ làm tâm đối xứng."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: đó là các bước khảo sát cơ bản. b) Sai: ví dụ $y = \\frac{1}{x}$ không cắt trục tung. c) Đúng theo định nghĩa giao điểm. d) Sai: đồ thị hàm chẵn nhận trục $Oy$ làm trục đối xứng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho hàm số $y = x^3 - 3x$ trên đoạn $[-2; 2]$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $y' = 3x^2 - 3$.", "b) Các điểm tới hạn của hàm số trong khoảng $(-2; 2)$ là $x = 1$ và $x = -1$.", "c) Giá trị lớn nhất của hàm số bằng $2$.", "d) Giá trị nhỏ nhất của hàm số bằng $-1$."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng: $y(-2) = -2$, $y(-1) = 2$, $y(1) = -2$, $y(2) = 2$ nên giá trị lớn nhất bằng $2$. d) Sai: giá trị nhỏ nhất bằng $-2$."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Hàm số $y = \\frac{1}{3}x^3 - x^2 - 3x + 2$ đạt cực tiểu tại $x = a$. Giá trị của $a$ bằng", "answer": "3", "explain": "$y' = x^2 - 2x - 3 = (x - 3)(x + 1)$. $y'$ đổi dấu từ $-$ sang $+$ qua $x = 3$ nên hàm số đạt cực tiểu tại $x = 3$. Vậy $a = 3$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một chiếc hộp không nắp được làm từ một tấm bìa hình vuông cạnh $12$ cm bằng cách cắt bỏ bốn hình vuông bằng nhau ở bốn góc rồi gấp các mép lên. Thể tích lớn nhất của chiếc hộp bằng bao nhiêu cm³?", "answer": "128", "explain": "Gọi $x$ là cạnh hình vuông bị cắt ($0 \\lt x \\lt 6$). Thể tích $V(x) = x(12 - 2x)^2$; $V'(x) = (12-2x)(12-6x) = 0 \\Leftrightarrow x = 2$ (loại $x = 6$). $V_{\\max} = V(2) = 2 \\cdot 8^2 = 128$ cm³."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Cho hàm số $y = f(x)$ có $f'(x) = -x + 2$. Hàm số nghịch biến trên khoảng nào?", "options": ["A. $(2; +\\infty)$", "B. $(-\\infty; 2)$", "C. $(-2; 2)$", "D. $\\mathbb{R}$"], "answer": "A", "explain": "$f'(x) = -x + 2 \\lt 0 \\Leftrightarrow x \\gt 2$ nên hàm số nghịch biến trên $(2; +\\infty)$."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Giá trị lớn nhất của hàm số $y = -x^2 + 1$ trên $\\mathbb{R}$ bằng", "options": ["A. $1$", "B. $0$", "C. $-1$", "D. $2$"], "answer": "A", "explain": "$y' = -2x = 0 \\Leftrightarrow x = 0$; $y'' = -2 \\lt 0$ nên $y$ đạt cực đại (cũng là giá trị lớn nhất trên $\\mathbb{R}$) tại $x = 0$, $y(0) = 1$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Số đường tiệm cận đứng của đồ thị hàm số $y = \\frac{x+1}{x^2-5x+6}$ là", "options": ["A. $0$", "B. $1$", "C. $2$", "D. $3$"], "answer": "C", "explain": "$x^2 - 5x + 6 = (x-2)(x-3)$ bằng $0$ tại $x = 2$ và $x = 3$ mà tử số khác $0$ tại đó nên có hai tiệm cận đứng $x = 2$, $x = 3$."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Tổng giá trị cực đại và giá trị cực tiểu của hàm số $y = x^3 - 3x^2 + 4$ bằng", "options": ["A. $4$", "B. $0$", "C. $2$", "D. $8$"], "answer": "A", "explain": "$y' = 3x^2 - 6x = 3x(x-2)$; $y''(0) = -6 \\lt 0$ nên $y_{CĐ} = y(0) = 4$; $y''(2) = 6 \\gt 0$ nên $y_{CT} = y(2) = 0$. Tổng là $4 + 0 = 4$."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Giá trị nhỏ nhất của hàm số $y = \\frac{x^2+3}{x+1}$ trên đoạn $[0; 2]$ bằng", "options": ["A. $2$", "B. $3$", "C. $\\frac{7}{3}$", "D. $\\frac{5}{2}$"], "answer": "A", "explain": "$y' = \\frac{(x+3)(x-1)}{(x+1)^2} = 0 \\Leftrightarrow x = 1$ (loại $x = -3$). $y(0) = 3$, $y(1) = 2$, $y(2) = \\frac{7}{3}$. Vậy giá trị nhỏ nhất bằng $2$."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Biết đồ thị hàm số bậc ba $y = f(x)$ cắt trục tung tại điểm có tung độ $-1$, có điểm cực tiểu $(1; -2)$ và điểm cực đại $(-1; 0)$. Hệ số $a$ của $x^3$ trong $f(x)$ bằng", "options": ["A. $\\frac{1}{2}$", "B. $1$", "C. $-\\frac{1}{2}$", "D. $2$"], "answer": "A", "explain": "Đặt $f(x) = ax^3 + bx^2 + cx + d$. $f(0) = d = -1$. $f'(x) = 3ax^2 + 2bx + c$; $f'(-1) = f'(1) = 0$ cho $b = 0$, $c = -3a$. $f(1) = a + c + d = -2a - 1 = -2 \\Rightarrow a = \\frac{1}{2}$ (thỏa $f(-1) = 0$)."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị hàm số $y = \\frac{2x-3}{x+1}$ có tiệm cận ngang là đường thẳng $y = 2$.", "b) Hàm số $y = \\frac{2x-3}{x+1}$ đồng biến trên từng khoảng xác định của nó.", "c) Đồ thị hàm số $y = x^3 - x$ có tiệm cận xiên.", "d) $\\lim_{x \\to +\\infty} \\frac{x^2+1}{x^2-1} = 1$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: bậc tử bằng bậc mẫu, hệ số $\\frac{2}{1}$. b) Đúng: $y' = \\frac{5}{(x+1)^2} \\gt 0$. c) Sai: hàm đa thức không có tiệm cận. d) Đúng vì $\\frac{x^2+1}{x^2-1} \\to 1$ khi $x \\to +\\infty$."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho hàm số $f(x) = \\frac{x^2-3x+2}{x-2}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tập xác định của $f$ là $\\mathbb{R} \\setminus \\{2\\}$.", "b) $f'(x) = 1$ với mọi $x \\ne 2$.", "c) Hàm số $f$ đồng biến trên $(-\\infty; 2)$ và $(2; +\\infty)$.", "d) Đồ thị của $f$ có tiệm cận đứng là đường thẳng $x = 2$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng vì $f(x) = x - 1$ với $x \\ne 2$ nên $f'(x) = 1$. c) Đúng vì $f' \\gt 0$ trên từng khoảng. d) Sai: $\\lim_{x \\to 2} f(x) = 1$ hữu hạn nên $x = 2$ không phải tiệm cận đứng (đồ thị bị khuyết điểm $(2; 1)$)."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Số nghiệm thực của phương trình $x^4 - 2x^2 - 3 = 0$ bằng", "answer": "2", "explain": "Đặt $t = x^2 \\ge 0$: $t^2 - 2t - 3 = 0 \\Leftrightarrow t = 3$ hoặc $t = -1$ (loại). $x^2 = 3 \\Leftrightarrow x = \\pm\\sqrt{3}$ nên phương trình có $2$ nghiệm thực."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Chi phí sản xuất $x$ đơn vị sản phẩm là $C(x) = x^2 + 60x + 500$ (nghìn đồng). Giá bán mỗi đơn vị sản phẩm là $p = 200 - x$ (nghìn đồng). Lợi nhuận lớn nhất thu được bằng bao nhiêu nghìn đồng?", "answer": "1950", "explain": "Doanh thu $R(x) = x(200 - x)$. Lợi nhuận $P(x) = R(x) - C(x) = -2x^2 + 140x - 500$ ($x \\gt 0$). $P'(x) = -4x + 140 = 0 \\Leftrightarrow x = 35$; $P''(x) = -4 \\lt 0$ nên $P_{\\max} = P(35) = 1950$ nghìn đồng."}]}]}
