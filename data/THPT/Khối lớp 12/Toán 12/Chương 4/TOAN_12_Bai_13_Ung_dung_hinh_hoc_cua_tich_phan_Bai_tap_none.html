{"type": "mcq", "level": "TH", "q": "Tính thể tích khối tròn xoay khi quay hình phẳng giới hạn bởi $y = x^2$, trục hoành, $x = 0$, $x = 1$ quanh $Ox$.", "options": ["A. $\\frac{\\pi}{5}$", "B. $\\frac{\\pi}{4}$", "C. $\\frac{\\pi}{3}$", "D. $\\pi$"], "answer": "A", "explain": "$V = \\pi\\int_0^1 x^4dx = \\frac{\\pi}{5}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tính thể tích khối tròn xoay khi quay hình phẳng giới hạn bởi $y = x^2$, $y = 4$ quanh $Ox$.", "options": ["A. $\\frac{256\\pi}{5}$", "B. $32\\pi$", "C. $\\frac{128\\pi}{5}$", "D. $\\frac{64\\pi}{5}$"], "answer": "A", "explain": "Dùng phương pháp vành khăn: $V = \\pi\\int_{-2}^{2} (16 - x^4)dx = \\pi(64 - \\frac{64}{5}) = \\frac{256\\pi}{5}$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thể tích khối cầu bán kính $R$ tính bằng tích phân là:", "options": ["A. $\\frac{1}{3}\\pi R^3$", "B. $\\frac{2}{3}\\pi R^3$", "C. $\\frac{4}{3}\\pi R^3$", "D. $4\\pi R^3$"], "answer": "C", "explain": "$V = \\pi\\int_{-R}^{R}(R^2-x^2)dx = \\frac{4}{3}\\pi R^3$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hình phẳng giới hạn bởi $y = e^x$, trục hoành, $x = 0$, $x = 1$ có diện tích là:", "options": ["A. $S = \\int_0^1 x e^x \\, dx$", "B. $S = \\pi\\int_0^1 e^x \\, dx$", "C. $S = \\int_0^1 e^{2x} \\, dx$", "D. $S = \\int_0^1 e^x \\, dx$"], "answer": "D", "explain": "Vì $e^x \\gt 0$ nên $S = \\int_0^1 e^xdx = e - 1$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một bình chứa có thiết diện tạo bởi $y = \\sqrt{x}$ ($0 \\le x \\le 4$) quay quanh $Ox$. Thể tích bình là:", "options": ["A. $8\\pi$", "B. $16\\pi$", "C. $\\frac{8\\pi}{3}$", "D. $4\\pi$"], "answer": "A", "explain": "$V = \\pi\\int_0^4 xdx = 8\\pi$ (đơn vị thể tích).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tính diện tích hình phẳng giới hạn bởi $y = \\frac{1}{x}$, trục hoành, $x = 1$, $x = 2$.", "options": ["A. $2\\ln 2$", "B. $\\frac{1}{2}$", "C. $1$", "D. $\\ln 2$"], "answer": "D", "explain": "$S = \\int_1^2 \\frac{1}{x}dx = \\ln 2$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["$S$ giới hạn bởi $y = \\cos x$, $Ox$, $0\\le x\\le\\pi$ bằng $2$.", "$S$ giới hạn bởi $y = x^2-1$, $Ox$, $0\\le x\\le2$ bằng $2$.", "$\\int_{-1}^1 (x^3-x)dx = 0$ nên diện tích tương ứng bằng $0$.", "Nửa hình tròn $y = \\sqrt{4-x^2}$ ($y\\ge0$) với $Ox$ có diện tích $2\\pi$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: diện tích $= \\frac{1}{2} \\ne 0$. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["$S$ giới hạn bởi $y = \\sin x$, $Ox$, $0\\le x\\le\\pi$ bằng $2$.", "$S$ giới hạn bởi $y = e^x$, $Ox$, $0\\le x\\le1$ bằng $e-1$.", "$S$ giới hạn bởi $y = x$ và $y = x^2$ ($0\\le x\\le1$) bằng $\\frac{1}{6}$.", "$V$ khi quay $y = 2$ ($0\\le x\\le1$) quanh $Ox$ bằng $4\\pi$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "TH", "q": "Tính diện tích hình phẳng giới hạn bởi $y = \\cos x$, trục hoành, $x = 0$, $x = \\frac{\\pi}{2}$.", "answer": "$1$", "explain": "$S = \\int_0^{\\pi/2}\\cos xdx = 1$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Tính thể tích khối tròn xoay khi quay $y = \\sqrt{3x}$ ($0 \\le x \\le 3$) quanh $Ox$.", "answer": "$\\frac{27\\pi}{2}$", "explain": "$V = \\pi\\int_0^3 3xdx = \\frac{27\\pi}{2}$.", "points": 0.5}]}]}
