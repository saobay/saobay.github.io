: "VDC", "q": "Cho $(S): x^2+y^2+z^2 = 9$. Mặt phẳng $(P)$ cắt $(S)$ theo đường tròn có bán kính bằng $\\sqrt{5}$ thì $d(O,(P))$ bằng:", "options": ["A. $4$", "B. $\\sqrt{7}$", "C. $1$", "D. $2$"], "answer": "D", "explain": "$d = \\sqrt{R^2-r^2} = \\sqrt{9-5} = 2$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Mặt cầu tâm $I(1;-1;2)$ tiếp xúc $(Oxy)$ có $R = 2$.", "$x^2+y^2+z^2+2x-4y+6 = 0$ là phương trình mặt cầu.", "Tiếp diện tại $M$ nhận $\\overrightarrow{IM}$ làm VTPT.", "$(S): (x-1)^2+y^2+z^2 = 4$ tiếp xúc $(P): x = 3$."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: $a^2+b^2+c^2-d = -1 \\lt 0$. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Mặt cầu tâm $O$ bán kính $R$: $x^2+y^2+z^2 = R^2$.", "$x^2+y^2+z^2+6 = 0$ là phương trình mặt cầu.", "$M$ thuộc mặt cầu tâm $I$ bán kính $R$ khi $IM = R$.", "Mặt cầu đường kính $AB$ có tâm là trung điểm của $AB$."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: vô nghiệm. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "TH", "q": "Tìm $m$ để điểm $M(2; 0; 0)$ nằm trên mặt cầu $(S): x^2+y^2+z^2 = 4$.", "answer": "$m = 2$ hoặc $m = -2$", "explain": "Thay vào: $2^2 = 4$ đúng; $-2$ cũng thỏa vì bình phương.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Giao của mặt cầu với một mặt phẳng (nếu cắt nhau) là hình gì?", "answer": "Đường tròn", "explain": "Mặt phẳng cắt mặt cầu theo một đường tròn.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Mặt phẳng $(P)$ tiếp xúc với mặt cầu $(S)$ tâm $I$ bán kính $R$ khi:", "options": ["A. $d(I, (P)) = R$", "B. $d(I, (P)) \\gt R$", "C. $I \\in (P)$", "D. $d(I, (P)) \\lt R$"], "answer": "A", "explain": "Điều kiện tiếp xúc: khoảng cách từ tâm đến mặt phẳng bằng bán kính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mặt cầu đư  $\\sqrt{17}$", "D. $3$"], "answer": "B", "explain": "$R = \\sqrt{1+9+0-(-6)} = 4$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Độ dài tiếp tuyến từ $M$ ngoài $(S)$ bằng $\\sqrt{MO^2-R^2}$ (với $O$ là tâm).", "Mặt cầu qua $O$ tâm $I(2;-1;2)$ có $R = 9$.", "$(S): x^2+y^2+z^2-4x+2y-4z+5 = 0$ có $I(2;-1;2)$, $R = 2$.", "Mặt cầu tâm $I(1;2;-1)$ cắt $Ox$ với $AB = 6$ thì $R^2 = 14$."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: $R = 3$. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["$x^2+y^2+z^2+2x-4y+6 = 0$ là phương trình mặt cầu.", "Mặt cầu tâm $I(1;-1;2)$ tiếp xúc $(Oxy)$ có $R = 2$.", "$(S): (x-1)^2+y^2+z^2 = 4$ tiếp xúc $(P): x = 3$.", "$M(1;2;2)$ thuộc $(S): x^2+y^2+z^2 = 9$."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: $a^2+b^2+c^2-d = -1 \\lt 0$. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "NB", "q": "Viết phương trình mặt cầu tâm $I(1; 2; 3)$ bán kính $R = 2$.", "answer": "$(x-1)^2 + (y-2)^2 + (z-3)^2 = 4$", "explain": "Thay $I(1;2;3)$ và $R = 2$ vào $(x-1)^2+(y-2)^2+(z-3)^2 = R^2$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mặt cầu $(S)$ có tâm $I(1; 2; 3)$ và cắt trục $Ox$ tại hai điểm $A, B$ với $AB = 6$. Viết phương trình $(S)$.", "answer": "$(x-1)^2+(y-2)^2+(z-3)^2 = 22$", "explain": "$d(I,Ox) = \\sqrt{2^2+3^2} = \\sqrt{13}$; $R^2 = 13 + 3^2 = 22$.", "points": 0.5}]}]}
