B} + \\frac{1}{2}(\\vec{AC} + \\vec{AD})\\right) = \\frac{1}{4}(\\vec{AB} + \\vec{AC} + \\vec{AD})$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho hình hộp chữ nhật $ABCD.A'B'C'D'$ có $AB = a, AD = b, AA' = c$. Độ dài đường chéo $AC'$ bằng:", "options": ["A. $\\sqrt{a^2 + b^2} + c$", "B. $\\sqrt{a^2 + b^2 + c^2}$", "C. $\\frac{1}{2}\\sqrt{a^2+b^2+c^2}$", "D. $a + b + c$"], "answer": "B", "explain": "$\\vec{AC'} = \\vec{AB} + \\vec{AD} + \\vec{AA'}$ với ba vectơ đôi một vuông góc nên $AC'^2 = a^2 + b^2 + c^2$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Với $\\vec{a} \\ne \\vec{0}$, vectơ $2\\vec{a}$ cùng hướng với $\\vec{a}$.", "$\\vec{AB} + \\vec{BC} = \\vec{AC}$ với mọi ba điểm $A, B, C$.", "Hai vectơ bằng nhau thì có cùng độ dài.", "Vectơ-không có độ dài bằng $1$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $2  \\gt 0$ nên $2\\vec{a}$ cùng hướng với $\\vec{a}$. b) Đúng: quy tắc ba điểm. c) Đúng theo định nghĩa hai vectơ bằng nhau. d) Sai: $|\\vec{0}| = 0$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho hình lăng trụ $ABC.A'B'C'$: $\\vec{AB} + \\vec{BC} + \\vec{CA} = \\vec{0}$.", "Cho $M$ là trung điểm của $AB$: $\\vec{OM} = \\frac{1}{2}(\\vec{OA} + \\vec{OB})$ với mọi điểm $O$.", "Cho hình hộp $ABCD.A'B'C'D'$: $\\vec{AB} + \\vec{B'C'} + \\vec{DD'} = \\vec{AC}$.", "Cho tam giác $ABC$, $M$ là trung điểm của $BC$: $\\vec{AM} = \\frac{1}{2}(\\vec{AB} + \\vec{AC})$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: tam giác vectơ khép kín. b) Đúng: công thức trung điểm. c) Sai: tổng bằng $\\vec{AC'}$ (quy tắc hình hộp). d) Đúng: quy tắc trung tuyến.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho điểm $M(4; 2; 3)$. Viết cao độ của điểm $M$.", "answer": "$3$", "explain": "Điểm $M(4; 2; 3)$ có hoành độ $4$, tung độ $2$, cao độ $3$.", "points": 0.5}, {"type": "short", "level" \\vec{GC} = \\vec{0}$.", "Vectơ-không ngược hướng với mọi vectơ.", "$\\vec{AB} + \\vec{BC} = \\vec{AC}$ với mọi ba điểm $A, B, C$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: quy tắc hình bình hành. b) Đúng: tính chất trọng tâm. c) Sai: vectơ-không cùng hướng với mọi vectơ. d) Đúng: quy tắc ba điểm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho $A(1; 2; 3)$, $B(4; 5; 6)$: điểm đối xứng với $A$ qua $B$ là $(7; 8; 9)$.", "Cho $M(2; -3; 5)$: hình chiếu của $M$ lên mặt phẳng $Oxz$ là $(2; 0; 5)$.", "Cho $A(1; 2; 3)$, $B(4; 5; 6)$: trung điểm của $AB$ là $(2.5; 3.5; 4.5)$.", "Cho $A(1; 1; 1)$, $B(2; 2; 2)$: $\\vec{AB} = \\vec{BA}$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $M = 2B - A$. b) Đúng: cho $y = 0$. c) Đúng: trung bình cộng tọa độ. d) Sai: $\\vec{BA} = -\\vec{AB}$.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho $A$(3; 0; 4)$$. Khoảng cách từ $A$ đến mặt phẳng $Oxy$ bằng bao nhiêu?", "answer": "$4$", "explain": "Khoảng cách bằng trị tuyệt đối của cao độ: $4$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho tứ diện $ABCD$. Gọi $M, N$ lần lượt là trung điểm của $AC$ và $BD$. Biết $\\\\vec{MN} = a(\\\\vec{AD} + \\\\vec{CB})$. Tìm $a$ (viết dưới dạng phân số).", "answer": "$\\\\frac{1}{2}$", "explain": "Cộng $\\\\vec{MN} = \\\\vec{MA} + \\\\vec{AD} + \\\\vec{DN}$ và $\\\\vec{MN} = \\\\vec{MC} + \\\\vec{CB} + \\\\vec{BN}$ được $2\\\\vec{MN} = \\\\vec{AD} + \\\\vec{CB}$, suy ra $a = \\\\frac{1}{2}$.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "VDC", "q": "Cho tứ diện $ABCD$ có $G$ là trọng tâm. Điểm $M$ thỏa $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = 2\\vec{MG}$. Khẳng định nào đúng?", "options": ["A. mọi điểm $M$ đều thỏa mãn", "B. chỉ có $M \\equiv G$ thỏa mãn", "C. mọi điểm $M$ trên mặt $(BCD)$ đều thỏa mãn", "D. không có điểm $M$ nào thỏa mãn"], "answer": "B", "explain": "Với mọi $M$: $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = 4\\vec{MG}$ (vì $\\vec{GA} + \\vec{GB} + \\vec{GC} + \\vec{GD} = \\vec{0}$). Đẳng thức đã cho tương đương $4\\vec{MG} = 2\\vec{MG}$, tức $\\vec{MG} = \\vec{0}$, nên $M \\equiv G$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho ba điểm $A(2; 0; 0)$, $B(0; 3; 0)$, $C(0; 0; 4)$. Phương trình mặt phẳng $(ABC)$ là:", "options": ["A. $x + y + z = 9$", "B. $2x + 3y + 4z = 1$", "C. $\\frac{x}{2} + \\frac{y}{3} + \\frac{z}{4} = 0$", "D. $\\frac{x}{2} + \\frac{y}{3} + \\frac{z}{4} = 1$"], "answer": "D", "explain": "Mặt phẳng cắt ba trục tại $(2;0;0)$, $(0;3;0)$, $(0;0;4)$ có phương trình đoạn chắn $\\frac{x}{2} + \\frac{y}{3} + \\frac{z}{4} = 1$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho tứ diện $ABCD$, $G$ là trọng tâm của tam giác $BCD$. Vectơ $\\vec{AG}$ bằng:", "options": ["A. $\\frac{1}{2}(\\vec{AB} + \\vec{AC} + \\vec{AD})$", "B. $\\frac{1}{3}(\\vec{AB} + \\vec{AC} + \\vec{AD})$", "C. $\\frac{1}{3}(\\vec{AB} + \\vec{AC} - \\vec{AD})$", "D. $\\vec{AB} + \\vec{AC} + \\vec{AD}$"], "answer": "B", "explain": "Chèn $A$: $\\vec{AG} = \\vec{AB} + \\vec{BG}$. Vì $G$ là trọng tâm $\\triangle BCD$: $\\vec{BG} = \\frac{1}{3}(\\vec{BC} + \\vec{BD})$. Suy ra $\\vec{AG} = \\vec{AB} + \\frac{1}{3}(\\vec{AC} - \\vec{AB} + \\vec{AD} - \\vec{AB}) = \\frac{1}{3}(\\vec{AB} + \\vec{AC} + \\vec{AD})$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $\\vec{a} = 2\\vec{u} - 3\\vec{v}$ và $\\vec{b} = -\\vec{u} + \\vec{v}$. Vectơ $\\vec{a} + 2\\vec{b}$ bằng:", "options": ["A. $\\vec{u} - \\vec{v}$", "B. $-\\vec{v}$", "C. $\\vec{v}$", "D. $-\\vec{u}$"], "answer": "B", "explain": "$\\vec{a} + 2\\vec{b} = (2\\vec{u} - 3\\vec{v}) + 2(-\\vec{u} + \\vec{v}) = -\\vec{v}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai vectơ cùng hướng thì chúng:", "options": ["A. vuông góc", "B. ngược hướng", "C. cùng phương", "D. bằng nhau"], "answer": "C", "explain": "Cùng hướng suy ra cùng phương (giá song song hoặc trùng nhau). Ngược lại không đúng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho ba vectơ $\\vec{a}, \\vec{b}, \\vec{c}$ không đồng phẳng. Vectơ $\\vec{x} = 2\\vec{a} - \\vec{b} + 3\\vec{c}$ và $\\vec{y} = -4\\vec{a} + 2\\vec{b} - 6\\vec{c}$. Khẳng định nào đúng?", "options": ["A. $\\vec{x} = \\vec{y}$", "B. $\\vec{x}$ và $\\vec{y}$ cùng phương", "C. $\\vec{x}$ và $\\vec{y}$ không cùng phương", "D. $\\vec{x} \\perp \\vec{y}$"], "answer": "B", "explain": "$\\vec{y} = -2(2\\vec{a} - \\vec{b} + 3\\vec{c}) = -2\\vec{x}$ nên hai vectơ cùng phương (tỉ lệ $-2$).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho hình hộp $ABCD.A'B'C'D'$, $M$ là trung điểm của $AA'$: $\\vec{BM} = \\frac{1}{2}\\vec{AA'} - \\vec{AB}$.", "Cho hình hộp $ABCD.A'B'C'D'$, $I$ là tâm của hình hộp: $\\vec{AI} = \\frac{1}{2}(\\vec{AB} + \\vec{AD} + \\vec{AA'})$.", "Cho hình hộp chữ nhật có ba kích thước $a, b, c$: độ dài đường chéo bằng $a + b + c$.", "Trong tứ diện đều, hai cạnh đối bất kì vuông góc với nhau."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $\\vec{BM} = \\vec{BA} + \\vec{AM}$. b) Đúng: $I$ là trung điểm của $AC'$. c) Sai: đường chéo bằng $\\sqrt{a^2+b^2+c^2}$. d) Đúng: tính chất của tứ diện đều.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Điểm $M(3; 1; 2)$ có hoành độ là $3$, tung độ là $1$, cao độ là $2$.", "Hình chiếu của $M(3; 1; 2)$ lên mặt phẳng $Oxy$ là $(3; 1; 0)$.", "Hình chiếu của $M(3; 1; 2)$ lên trục $Oz$ là $(0; 0; 2)$.", "Điểm đối xứng của $M(3; 1; 2)$ qua gốc $O$ là $(-3; -1; -2)$."], "answer": ["T", "T", "T", "T"], "explain": "Tất cả đều đúng theo định nghĩa tọa độ điểm, hình chiếu và phép đối xứng qua gốc tọa độ.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho hình lập phương $ABCD.A'B'C'D'$ có cạnh bằng $3$. Tính độ dài của vectơ $\\vec{AC'}$.", "answer": "$3\\sqrt{3}$", "explain": "$AC' = \\sqrt{3^2+3^2+3^2} = 3\\sqrt{3}$.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Cho $\\vec{a} = $(0; 0; 3)$$, $\\vec{b} = $(3; 0; 3)$$. Viết hoành độ của $\\vec{a} + \\vec{b}$.", "answer": "$3$", "explain": "Hoành độ của tổng bằng $0 + 3 = 3$.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Với ba điểm $M, N, P$ bất kì, $\\vec{MN} - \\vec{MP}$ bằng:", "options": ["A. $\\vec{0}$", "B. $\\vec{PN}$", "C. $\\vec{NP}$", "D. $\\vec{MN}$"], "answer": "B", "explain": "$\\vec{MN} - \\vec{MP} = \\vec{PM} + \\vec{MN} = \\vec{PN}$ (quy tắc trừ: chung điểm đầu $M$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong không gian, cho điểm $O$ và vectơ $\\vec{a}$ cho trước. Có bao nhiêu điểm $M$ sao cho $\\vec{OM} = \\vec{a}$?", "options": ["A. không có điểm nào", "B. hai điểm", "C. duy nhất một điểm", "D. vô số điểm"], "answer": "C", "explain": "Tính chất: với mỗi điểm $O$ và vectơ $\\vec{a}$ cho trước, có duy nhất điểm $M$ sao cho $\\vec{OM} = \\vec{a}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $\\vec{a}, \\vec{b}, \\vec{c}$ đôi một không cùng phương và $\\vec{d} = x\\vec{a} + y\\vec{b} + z\\vec{c}$. Nếu $\\vec{d} = \\vec{0}$ thì:", "options": ["A. chỉ cần một trong ba số bằng $0$", "B. $x + y + z = 0$", "C. $x = y = z = 1$", "D. $x = y = z = 0$"], "answer": "D", "explain": "Ba vectơ không đồng phẳng là độc lập tuyến tính: tổ hợp tuyến tính bằng $\\vec{0}$ khi mọi hệ số đều bằng $0$ (biểu thị duy nhất).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cho ba vectơ $\\vec{a}, \\vec{b}, \\vec{c}$ đôi một không cùng phương. Ba vectơ đó đồng phẳng khi:", "options": ["A. chúng đôi một vuông góc", "B. tổng của chúng bằng $\\vec{0}$", "C. chúng có cùng độ dài", "D. một trong ba vectơ biểu thị được qua hai vectơ còn lại"], "answer": "D", "explain": "Điều kiện: ba vectơ đồng phẳng khi một vectơ là tổ hợp tuyến tính của hai vectơ kia (ví dụ $\\vec{c} = x\\vec{a} + y\\vec{b}$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $4$ điểm phân biệt trong không gian. Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu và điểm cuối là các điểm đã cho?", "options": ["A. $8$", "B. $6$", "C. $16$", "D. $12$"], "answer": "D", "explain": "Chọn điểm đầu có $4$ cách, điểm cuối có $3$ cách (khác điểm đầu): $4 \\times 3 = 12$ vectơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đường thẳng đi qua điểm đầu và điểm cuối của một vectơ được gọi là:", "options": ["A. phương của vectơ đó", "B. hướng của vectơ đó", "C. giá của vectơ đó", "D. trục của vectơ đó"], "answer": "C", "explain": "Theo định nghĩa, đường thẳng đi qua điểm đầu và điểm cuối của một vectơ được gọi là giá của vectơ đó.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Hai vectơ được gọi là cùng phương nếu chúng có giá song song hoặc trùng nhau.", "Với $G$ là trọng tâm của tam giác $ABC$: $\\vec{GA} + \\vec{GB} + \\vec{GC} = \\vec{0}$.", "$\\vec{AB} + \\vec{BC} = \\vec{AC}$ với mọi ba điểm $A, B, C$.", "Phép cộng hai vectơ có tính chất giao hoán."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng theo định nghĩa. b) Đúng: tính chất trọng tâm. c) Đúng: quy tắc ba điểm. d) Đúng: $\\vec{a} + \\vec{b} = \\vec{b} + \\vec{a}$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Ba vectơ không đồng phẳng là độc lập tuyến tính.", "Cho hình chóp tứ giác đều $S.ABCD$, $M$ là trung điểm của $SC$: $\\vec{AM} = \\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\frac{1}{2}\\vec{AS}$.", "Cho hình hộp chữ nhật có ba kích thước $a, b, c$: độ dài đường chéo bằng $a + b + c$.", "Trong tứ diện đều, hai cạnh đối bất kì vuông góc với nhau."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: tổ hợp bằng $\\vec{0}$ khi mọi hệ số bằng $0$. b) Đúng (đã chứng minh). c) Sai: đường chéo bằng $\\sqrt{a^2+b^2+c^2}$. d) Đúng: tính chất của tứ diện đều.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho tứ diện đều $ABCD$ có cạnh bằng $4$. Tính tích vô hướng $\\vec{AB} \\cdot \\vec{AC}$.", "answer": "$8$", "explain": "$\\vec{AB} \\cdot \\vec{AC} = AB \\cdot AC \\cdot \\cos 60^\\circ = 4 \\times 4 \\times \\frac{1}{2} = 8$.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Cho $\\vec{a} \\ne \\vec{0}$. Tìm số thực dương $k$ để vectơ $k\\vec{a}$ cùng hướng với $\\vec{a}$ và có độ dài gấp $2$ lần $|\\vec{a}|$.", "answer": "$2$", "explain": "Để cùng hướng thì $k \\gt 0$; độ dài $|k\\vec{a}| = k|\\vec{a}| = 2|\\vec{a}|$ cho $k = 2$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "Cho tứ diện $ABCD$, $M$ là trung điểm $AB$, $N$ là trung điểm $CD$. Vectơ $\\vec{MN}$ bằng:", "options": ["A. $\\frac{1}{2}(\\vec{AD} + \\vec{BC})$", "B. $\\frac{1}{4}(\\vec{AD} + \\vec{BC})$", "C. $\\frac{1}{2}(\\vec{AB} + \\vec{CD})$", "D. $\\vec{AD} + \\vec{BC}$"], "answer": "A", "explain": "$\\vec{MN} = \\vec{MA} + \\vec{AD} + \\vec{DN} = \\vec{MB} + \\vec{BC} + \\vec{CN}$. Cộng hai vế: $2\\vec{MN} = \\vec{AD} + \\vec{BC}$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $A(1; 2; 0)$, $B(-1; 0; 2)$. Điểm $M$ trên mặt phẳng $Oxy$ sao cho $MA + MB$ nhỏ nhất có tọa độ:", "options": ["A. $(1; 1; 0)$", "B. $(-1; 1; 0)$", "C. $(0; 1; 0)$", "D. $(0; 0; 0)$"], "answer": "C", "explain": "Lấy $A'$ đối xứng với $A$ qua mặt phẳng $Oxy$: $A'(1; 2; 0) = A$ (vì $A$ đã nằm trên $Oxy$)... Đổi: $A(1; 2; 1)$, $B(-1; 0; 3)$. $A'$ đối xứng $A$ qua $Oxy$: $A'(1; 2; -1)$. Đường thẳng $A'B$ cắt $Oxy$ tại $M$. $\\vec{A'B} = (-2; -2; 4)$, tham số: $M = A' + t\\vec{A'B}$, $z = -1 + 4t = 0$ suy ra $t = \\frac{1}{4}$, $M(\\frac{1}{2}; \\frac{3}{2}; 0)$. Đáp án đúng: $(\\frac{1}{2}; \\frac{3}{2}; 0)$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nếu $k\\vec{a} = \\vec{0}$ với $\\vec{a} \\ne \\vec{0}$ thì:", "options": ["A. $k = 0$", "B. $k = -1$", "C. $k = 1$", "D. $|k| = 1$"], "answer": "A", "explain": "Vì $\\vec{a} \\ne \\vec{0}$ nên $|k\\vec{a}| = |k||\\vec{a}| = 0$ suy ra $|k| = 0$, tức $k = 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $A$(-5; 5; -3)$$, $B$(-2; -4; 1)$$. Độ dài đoạn thẳng $AB$ bằng:", "options": ["A. $\\sqrt{107}$", "B. $\\sqrt{106}$", "C. $\\sqrt{16}$", "D. $16$"], "answer": "B", "explain": "$AB = \\sqrt{(3)^2 + (-9)^2 + (4)^2} = \\sqrt{106} = $\\sqrt{106}$$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai vectơ $\\vec{a}$ và $\\vec{b}$ được gọi là bằng nhau nếu:", "options": ["A. chúng có giá trùng nhau", "B. chúng cùng hướng và có cùng độ dài", "C. chúng cùng phương và có cùng độ dài", "D. chúng ngược hướng và có cùng độ dài"], "answer": "B", "explain": "Kí hiệu $\\vec{a} = \\vec{b}$ khi hai vectơ cùng hướng và $|\\vec{a}| = |\\vec{b}|$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho tứ diện $ABCD$. Gọi $M, N$ lần lượt là trung điểm của $AC$ và $BD$. Vectơ $\\vec{MN}$ bằng:", "options": ["A. $\\vec{AB} + \\vec{CD}$", "B. $\\frac{1}{4}(\\vec{AB} + \\vec{CD})$", "C. $\\frac{1}{2}(\\vec{AC} + \\vec{BD})$", "D. $\\frac{1}{2}(\\vec{AB} + \\vec{CD})$"], "answer": "D", "explain": "$\\vec{MN} = \\vec{MA} + \\vec{AB} + \\vec{BN}$ và $\\vec{MN} = \\vec{MC} + \\vec{CD} + \\vec{DN}$. Cộng vế: $2\\vec{MN} = \\vec{AB} + \\vec{CD}$ (vì $\\vec{MA} + \\vec{MC} = \\vec{0}$, $\\vec{BN} + \\vec{DN} = \\vec{0}$).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho $\\vec{a} = 2\\vec{u} - 3\\vec{v}}$, $\\vec{b} = -\\vec{u} + \\vec{v}$: $\\vec{a} + 2\\vec{b} = -\\vec{v}$.", "Cho ba điểm $A, B, C$ thẳng hàng theo thứ tự đó và $AB = 2BC$: $\\vec{AC} = 3\\vec{BC}$.", "Cho hình chóp $S.ABCD$ có đáy là hình bình hành: $\\vec{SA} + \\vec{SC} = \\vec{SB} + \\vec{SD}$.", "Cho $M$ là trung điểm của $AB$: $\\vec{OM} = \\frac{1}{2}(\\vec{OA} + \\vec{OB})$ với mọi điểm $O$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: khai triển được $-\\vec{v}$. b) Đúng: $AC = 3BC$ và cùng hướng. c) Đúng: cùng bằng $2\\vec{SO}$ với $O$ là tâm đáy. d) Đúng: công thức trung điểm.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho tứ diện $ABCD$: tồn tại duy nhất điểm $G$ thỏa $\\vec{GA} + \\vec{GB} + \\vec{GC} + \\vec{GD} = \\vec{0}$.", "Cho hình hộp $ABCD.A'B'C'D'$; $M, N$ là trung điểm của $AB, A'D'$: $\\vec{MN} = -\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AA'}$.", "Điểm $M$ thỏa mãn $\\vec{MA} + 2\\vec{MB} + 3\\vec{MC} = \\vec{0}$ là duy nhất.", "Cho tứ diện $ABCD$; $M, N, P$ lần lượt là trung điểm của $AB, CD, MN$: $\\vec{AP} = \\frac{1}{4}(\\vec{AB} + \\vec{AC} + \\vec{AD})$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: đó chính là trọng tâm của tứ diện. b) Đúng (đã chứng minh). c) Đúng: $\\vec{OM} = \\frac{1}{6}(\\vec{OA} + 2\\vec{OB} + 3\\vec{OC})$. d) Đúng (đã chứng minh).", "points": 1}, {"type": "short", "level": "TH", "q": "Cho $M$(2; 2; 4)$$. Viết tọa độ hình chiếu của $M$ lên mặt phẳng $Oxz$.", "answer": "$(2; 0; 4)$", "explain": "Hình chiếu lên $Oxz$ cho tung độ bằng $0$: $(2; 0; 4)$.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Cho điểm $M(3; 5; 2)$. Viết cao độ của điểm $M$.", "answer": "$2$", "explain": "Điểm $M(3; 5; 2)$ có hoành độ $3$, tung độ $5$, cao độ $2$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VDC", "q": "Trong không gian $Oxyz$, tập hợp các điểm $M$ thỏa $MA^2 + MB^2 = 10$ với $A(1; 0; 0)$, $B(-1; 0; 0)$ là:", "options": ["A. mặt phẳng", "B. đường thẳng", "C. mặt cầu tâm $O$ bán kính $2$", "D. mặt cầu tâm $O$ bán kính $\\sqrt{10}$"], "answer": "C", "explain": "Gọi $M(x; y; z)$: $(x-1)^2 + y^2 + z^2 + (x+1)^2 + y^2 + z^2 = 10$, rút gọn: $2x^2 + 2y^2 + 2z^2 + 2 = 10$, tức $x^2 + y^2 + z^2 = 4$: mặt cầu tâm $O$ bán kính $2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho hình hộp $ABCD.A'B'C'D'$, $O$ là tâm của mặt $ABCD$. Vectơ $\\vec{AO}$ bằng:", "options": ["A. $2(\\vec{AB} + \\vec{AD})$", "B. $\\frac{1}{2}(\\vec{AB} - \\vec{AD})$", "C. $\\vec{AB} + \\vec{AD}$", "D. $\\frac{1}{2}(\\vec{AB} + \\vec{AD})$"], "answer": "D", "explain": "$O$ là trung điểm của $AC$ nên $\\vec{AO} = \\frac{1}{2}\\vec{AC} = \\frac{1}{2}(\\vec{AB} + \\vec{AD})$ (quy tắc hình bình hành).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho tứ diện đều $ABCD$ cạnh $a$. Tích vô hướng $\\vec{AB} \\cdot \\vec{CD}$ bằng:", "options": ["A. $0$", "B. $-\\frac{a^2}{2}$", "C. $\\frac{a^2}{2}$", "D. $a^2$"], "answer": "A", "explain": "Trong tứ diện đều, các cặp cạnh đối vuông góc với nhau nên $\\vec{AB} \\cdot \\vec{CD} = 0$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vectơ đối của vectơ $\\vec{a} \\ne \\vec{0}$ là vectơ:", "options": ["A. vuông góc với $\\vec{a}$", "B. có độ dài gấp đôi $\\vec{a}$", "C. có cùng độ dài và cùng hướng với $\\vec{a}$", "D. có cùng độ dài và ngược hướng với $\\vec{a}$"], "answer": "D", "explain": "Vectơ đối của $\\vec{a}$ kí hiệu $-\\vec{a}$, có cùng độ dài và ngược hướng với $\\vec{a}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cho hình bình hành $ABCD$. Đẳng thức vectơ nào sau đây đúng?", "options": ["A. $\\vec{AB} + \\vec{AD} = \\vec{CA}$", "B. $\\vec{AB} - \\vec{AD} = \\vec{AC}$", "C. $\\vec{AB} + \\vec{AD} = \\vec{AC}$", "D. $\\vec{AB} + \\vec{AC} = \\vec{AD}$"], "answer": "C", "explain": "Quy tắc hình bình hành: trong hình bình hành $ABCD$, $\\vec{AB} + \\vec{AD} = \\vec{AC}$ (đường chéo xuất phát từ $A$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho tứ diện $ABCD$ có $AB = CD = a$, $AC = BD = b$, $AD = BC = c$. Gọi $M, N$ lần lượt là trung điểm của $AB$ và $CD$. Độ dài $MN$ bằng:", "options": ["A. $\\sqrt{2b^2 + 2c^2 - 2a^2}$", "B. $\\frac{\\sqrt{2b^2 + 2c^2 - 2a^2}}{2}$", "C. $\\frac{\\sqrt{2b^2 + 2c^2 - 2a^2}}{4}$", "D. $\\frac{\\sqrt{b^2 + c^2 - a^2}}{2}$"], "answer": "B", "explain": "$\\vec{MN} = \\frac{1}{2}(\\vec{AC} + \\vec{BD})$ nên $4MN^2 = AC^2 + BD^2 + 2\\vec{AC}\\cdot\\vec{BD}$. Tính $\\vec{AC}\\cdot\\vec{BD} = \\vec{AC}\\cdot(\\vec{AD} - \\vec{AB}) = \\frac{b^2+c^2-a^2}{2} - \\frac{b^2+a^2-c^2}{2} = c^2 - a^2$. Vậy $4MN^2 = 2b^2 + 2c^2 - 2a^2$, suy ra $MN = \\frac{\\sqrt{2b^2+2c^2-2a^2}}{2}$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Hai vectơ cùng phương thì cùng hướng.", "Đường thẳng đi qua điểm đầu và điểm cuối của một vectơ được gọi là giá của vectơ đó.", "$\\vec{AB} + \\vec{BC} = \\vec{AC}$ với mọi ba điểm $A, B, C$.", "Nếu $k\\vec{a} = \\vec{0}$ và $k \\ne 0$ thì $\\vec{a} = \\vec{0}$."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: cùng phương thì cùng hướng hoặc ngược hướng. b) Đúng theo định nghĩa giá của vectơ. c) Đúng: quy tắc ba điểm. d) Đúng: $|k||\\vec{a}| = 0$ với $k \\ne 0$ cho $|\\vec{a}| = 0$.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Đường thẳng đi qua điểm đầu và điểm cuối của một vectơ được gọi là giá của vectơ đó.", "$\\vec{AB} = \\vec{BA}$ với mọi $A, B$.", "Vectơ-không ngược hướng với mọi vectơ.", "Phép cộng hai vectơ có tính chất giao hoán."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng theo định nghĩa giá của vectơ. b) Sai: $\\vec{BA} = -\\vec{AB}$. c) Sai: vectơ-không cùng hướng với mọi vectơ. d) Đúng: $\\vec{a} + \\vec{b} = \\vec{b} + \\vec{a}$.", "points": 1}, {"type": "short", "level": "VDC", "q": "Cho hình chóp $S.ABC$, $M$ thuộc cạnh $SB$ sao cho $SM = 3MB$. Biết $\\\\vec{AM} = a\\\\vec{AB} + b\\\\vec{AS}$. Tính $2a + b$.", "answer": "$\\\\frac{7}{4}$", "explain": "$\\\\vec{AM} = \\\\vec{AB} + \\\\vec{BM} = \\\\vec{AB} + \\\\frac{1}{4}\\\\vec{BS} = \\\\frac{3}{4}\\\\vec{AB} + \\\\frac{1}{4}\\\\vec{AS}$, suy ra $2a + b = \\\\frac{3}{2} + \\\\frac{1}{4} = \\\\frac{7}{4}$.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Cho hình hộp $ABCD.A'B'C'D'$ (điểm đầu $A$). Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu là đỉnh đã nêu
