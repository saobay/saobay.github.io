\vec{AB} + \\vec{AD})$.", "Cho tứ diện $ABCD$: có $12$ vectơ khác $\\vec{0}$ có điểm đầu, điểm cuối là các đỉnh của tứ diện.", "Nếu $x\\vec{a} + y\\vec{b} = \\vec{0}$ với $\\vec{a}, \\vec{b}$ không cùng phương thì $x = y = 0$.", "Cho $\\vec{a}, \\vec{b}$ không cùng phương và $\\vec{c} = 2\\vec{a} - \\vec{b}$: ba vectơ $\\vec{a}, \\vec{b}, \\vec{c}$ đồng phẳng."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $O$ là trung điểm $AC$. b) Đúng: $4 \\times 3 = 12$. c) Đúng: độc lập tuyến tính. d) Đúng: $\\vec{c}$ là tổ hợp tuyến tính của $\\vec{a}, \\vec{b}$.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho hình lập phương $ABCD.A'B'C'D'$ có cạnh bằng $2$. Tính độ dài của vectơ $\\vec{AC'}$.", "answer": "$2\\sqrt{3}$", "explain": "$AC' = \\sqrt{2^2+2^2+2^2} = 2\\sqrt{3}$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cho hình lập phương $ABCD.A'B'C'D'$ có cạnh bằng $1$. Tính độ dài của vectơ $\\vec{AC'}$.", "answer": "$1\\sqrt{3}$", "explain": "$AC' = \\sqrt{1^2+1^2+1^2} = 1\\sqrt{3}$.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "VD", "q": "Cho hình lăng trụ $ABC.A'B'C'$, $M$ là trung điểm $BC$. $\\vec{A'M}$ theo $\\vec{AB}, \\vec{AC}, \\vec{AA'}$ bằng:", "options": ["A. $\\frac{1}{2}\\vec{AB} + \\vec{AC} + \\vec{AA'}$", "B. $\\vec{AB} + \\vec{AC} - \\frac{1}{2}\\vec{AA'}$", "C. $-\\frac{1}{2}\\vec{AB} - \\frac{1}{2}\\vec{AC} + \\vec{AA'}$", "D. $\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AC} - \\vec{AA'}$"], "answer": "D", "explain": "$\\vec{A'M} = \\vec{A'A} + \\vec{AM} = -\\vec{AA'} + \\frac{1}{2}(\\vec{AB} + \\vec{AC})$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho tứ diện $ABCD$, $G$ là trọng tâm của tam giác $BCD$. Vectơ $\\vec{AG}$ bằng:", "options": ["A. $\\frac{1}{3}(\\vec{AB} + \\vec{AC} - \\vec{AD})$", "B. $\\frac{1}{2}(\\vec{AB} + \\vec{AC} + \\vec{AD})$", "C. $\\frac{1}{3}(\\vec{AB} + \\vec{AC} + \\vec{AD})$", "D. $\\vec{AB} + \\vec{AC} + \\vec{AD}$"], "answer": "C", "explain": "Chèn $A$: $\\vec{AG} = \\vec{AB} + \\vec{BG}$. Vì $G$ là trọng tâm $\\triangle BCD$: $\\vec{BG} = \\frac{1}{3}(\\vec{BC} + \\vec{BD})$. Suy ra $\\vec{AG} = \\vec{AB} + \\frac{1}{3}(\\vec{AC} - \\vec{AB} + \\vec{AD} - \\vec{AB}) = \\frac{1}{3}(\\vec{AB} + \\vec{AC} + \\vec{AD})$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hình chóp $S.ABCD$ có đáy là hình bình hành tâm $O$. Điểm $M$ thỏa $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = \\vec{0}$ là điểm nào?", "options": ["A. trùng với tâm $O$ của đáy", "B. trọng tâm của tam giác $SAC$", "C. trùng với đỉnh $S$", "D. trung điểm của $SO$"], "answer": "A", "explain": "Chèn $O$: $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = 4\\vec{MO} + (\\vec{OA} + \\vec{OB} + \\vec{OC} + \\vec{OD}) = 4\\vec{MO} = \\vec{0}$ (vì $\\vec{OA} + \\vec{OC} = \\vec{OB} + \\vec{OD} = \\vec{0}$). Vậy $\\vec{MO} = \\vec{0}$, tức $M \\equiv O$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho tứ diện $ABCD$ có $G$ là trọng tâm. Điểm $M$ thỏa $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = 2\\vec{MG}$. Khẳng định nào đúng?", "options": ["A. chỉ có $M \\equiv G$ thỏa mãn", "B. không có điểm $M$ nào thỏa mãn", "C. mọi điểm $M$ đều thỏa mãn", "D. mọi điểm $M$ trên mặt $(BCD)$ đều thỏa mãn"], "answer": "A", "explain": "Với mọi $M$: $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = 4\\vec{MG}$ (vì $\\vec{GA} + \\vec{GB} + \\vec{GC} + \\vec{GD} = \\vec{0}$). Đẳng thức đã cho tương đương $4\\vec{MG} = 2\\vec{MG}$, tức $\\vec{MG} = \\vec{0}$, nên $M \\equiv G$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $\\vec{a} = 2\\vec{u} - 3\\vec{v}$ và $\\vec{b} = -\\vec{u} + \\vec{v}$. Vectơ $\\vec{a} + 2\\vec{b}$ bằng:", "options": ["A. $\\vec{u} - \\vec{v}$", "B. $\\vec{v}$", "C. $-\\vec{u}$", "D. $-\\vec{v}$"], "answer": "D", "explain": "$\\vec{a} + 2\\vec{b} = (2\\vec{u} - 3\\vec{v}) + 2(-\\vec{u} + \\vec{v}) = -\\vec{v}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho tứ diện $ABCD$, $G$ là trọng tâm tứ diện. Đẳng thức nào đúng?", "options": ["A. $\\vec{GA} + \\vec{GB} = \\vec{GC} + \\vec{GD}$", "B. $\\vec{AG} + \\vec{BG} + \\vec{CG} + \\vec{DG} = \\vec{0}$", "C. $\\vec{GA} + \\vec{GB} + \\vec{GC} + \\vec{GD} = \\vec{AB}$", "D. $\\vec{GA} + \\vec{GB} + \\vec{GC} + \\vec{GD} = \\vec{0}$"], "answer": "D", "explain": "Trọng tâm tứ diện $G$ thỏa $\\vec{GA} + \\vec{GB} + \\vec{GC} + \\vec{GD} = \\vec{0}$ (giao của các đoạn nối đỉnh với trọng tâm mặt đối diện).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Trong hình bình hành $ABCD$, $\\vec{AB} + \\vec{AD} = \\vec{AC}$.", "Với $I$ là trung điểm $AB$: $\\vec{IA} + \\vec{IB} = \\vec{0}$.", "Với $G$ là trọng tâm $\\triangle ABC$: $\\vec{GA} + \\vec{GB} + \\vec{GC} = \\vec{AB}$.", "Nếu $\\vec{a}$ và $\\vec{b}$ cùng phương thì chúng cùng hướng."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: quy tắc hình bình hành. b) Đúng: $I$ trung điểm thì $\\vec{IA}, \\vec{IB}$ đối nhau. c) Sai: tổng bằng $\\vec{0}$. d) Sai: cùng phương thì cùng hướng hoặc ngược hướng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho tứ diện $ABCD$, $G$ là trọng tâm $\\triangle BCD$: $\\vec{AG} = \\frac{1}{3}(\\vec{AB} + \\vec{AC} + \\vec{AD})$.", "Cho hình hộp $ABCD.A'B'C'D'$, $I$ là tâm hình hộp: $\\vec{AI} = \\frac{1}{2}(\\vec{AB} + \\vec{AD} + \\vec{AA'}$).", "Trong tứ diện đều, hai cạnh đối bất kì vuông góc với nhau.", "Cho $\\vec{x} = 2\\vec{a} - \\vec{b}$, $\\vec{y} = -4\\vec{a} + 2\\vec{b}$ ($\\vec{a}, \\vec{b}$ không cùng phương): $\\vec{x}$ và $\\vec{y}$ không cùng phương."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng (đã chứng minh). b) Đúng: $I$ là trung điểm $AC'$. c) Đúng: tính chất tứ diện đều. d) Sai: $\\vec{y} = -2\\vec{x}$ nên cùng phương.", "points": 1}, {"type": "short", "level": "VDC", "q": "Cho tứ diện $ABCD$; $M, N, P$ lần lượt là trung điểm của $AB, CD, MN$. Biết $\\vec{AP} = k(\\vec{AB} + \\vec{AC} + \\vec{AD})$. Tìm $k$ (viết dưới dạng phân số).", "answer": "$\\frac{1}{4}$", "explain": "$\\vec{AP} = \\frac{1}{4}(\\vec{AB} + \\vec{AC} + \\vec{AD})$ nên $k = \\frac{1}{4}$.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho hình chóp có đáy là đa giác $5$ đỉnh (tổng cộng $6$ đỉnh). Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu, điểm cuối là các đỉnh của hình chóp?", "answer": "$20$", "explain": "Số đỉnh là $6$, số vectơ khác $\\vec{0}$ là $(6) \\times 5 = 20$.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Cho ba vectơ $\\vec{a}, \\vec{b}, \\vec{c}$ đôi một không cùng phương. Ba vectơ đó đồng phẳng khi:", "options": ["A. một trong ba vectơ biểu thị được qua hai vectơ còn lại", "B. chúng đôi một vuông góc", "C. chúng có cùng độ dài", "D. tổng của chúng bằng $\\vec{0}$"], "answer": "A", "explain": "Điều kiện: ba vectơ đồng phẳng khi một vectơ là tổ hợp tuyến tính của hai vectơ kia (ví dụ $\\vec{c} = x\\vec{a} + y\\vec{b}$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho hình hộp $ABCD.A'B'C'D'$, $M$ là trung điểm của $AA'$. Vectơ $\\vec{BM}$ biểu thị theo $\\vec{AB}, \\vec{AD}, \\vec{AA'}$ là:", "options": ["A. $\\frac{1}{2}\\vec{AA'} + \\vec{AB}$", "B. $\\vec{AA'} - \\frac{1}{2}\\vec{AB}$", "C. $\\frac{1}{2}\\vec{AA'} - \\vec{AB}$", "D. $-\\frac{1}{2}\\vec{AA'} - \\vec{AB}$"], "answer": "C", "explain": "$\\vec{BM} = \\vec{BA} + \\vec{AM} = -\\vec{AB} + \\frac{1}{2}\\vec{AA'}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho hình hộp $ABCD.A'B'C'D'$, $O$ là tâm của mặt $ABCD$. Vectơ $\\vec{AO}$ bằng:", "options": ["A. $\\frac{1}{2}(\\vec{AB} - \\vec{AD})$", "B. $2(\\vec{AB} + \\vec{AD})$", "C. $\\vec{AB} + \\vec{AD}$", "D. $\\frac{1}{2}(\\vec{AB} + \\vec{AD})$"], "answer": "D", "explain": "$O$ là trung điểm của $AC$ nên $\\vec{AO} = \\frac{1}{2}\\vec{AC} = \\frac{1}{2}(\\vec{AB} + \\vec{AD})$ (quy tắc hình bình hành).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho hình hộp $ABCD.A'B'C'D'$, $I$ là tâm hình hộp. Vectơ $\\vec{AI}$ bằng:", "options": ["A. $\\vec{AB} + \\vec{AD} + \\vec{AA'}$", "B. $\\frac{1}{2}(\\vec{AB} + \\vec{AD} - \\vec{AA'})$", "C. $\\frac{1}{2}(\\vec{AB} + \\vec{AD} + \\vec{AA'})$", "D. $\\frac{1}{4}(\\vec{AB} + \\vec{AD} + \\vec{AA'})$"], "answer": "C", "explain": "$I$ là trung điểm $AC'$ nên $\\vec{AI} = \\frac{1}{2}\\vec{AC'} = \\frac{1}{2}(\\vec{AB} + \\vec{AD} + \\vec{AA'})$ (quy tắc hình hộp).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho tứ diện $ABCD$, $M$ là điểm thỏa $\\vec{MA} + 2\\vec{MB} + 3\\vec{MC} = \\vec{0}$ ($D$ bất kì). Điểm $M$ được xác định:", "options": ["A. là trọng tâm tứ diện $ABCD$", "B. duy nhất, không phụ thuộc điểm $D$", "C. không tồn tại", "D. phụ thuộc vào điểm $D$"], "answer": "B", "explain": "Chèn gốc $O$: $(1+2+3)\\vec{OM} = \\vec{OA} + 2\\vec{OB} + 3\\vec{OC}$, suy ra $\\vec{OM} = \\frac{1}{6}(\\vec{OA} + 2\\vec{OB} + 3\\vec{OC})$ duy nhất, không liên quan $D$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$, $M$ là trung điểm $BC$. Vectơ $\\vec{AM}$ bằng:", "options": ["A. $\\frac{1}{2}(\\vec{AB} + \\vec{AC})$", "B. $2(\\vec{AB} + \\vec{AC})$", "C. $\\frac{1}{2}(\\vec{AB} - \\vec{AC})$", "D. $\\vec{AB} + \\vec{AC}$"], "answer": "A", "explain": "Quy tắc trung tuyến: $\\vec{AM} = \\frac{1}{2}(\\vec{AB} + \\vec{AC})$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Với $I$ là trung điểm của $AB$: $\\vec{IA} + \\vec{IB} = \\vec{0}$.", "Hai vectơ cùng phương thì cùng hướng.", "Vectơ-không có độ dài bằng $0$.", "Nếu $k\\vec{a} = \\vec{0}$ và $k \\ne 0$ thì $\\vec{a} = \\vec{0}$."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: hai vectơ đối nhau. b) Sai: cùng phương thì cùng hướng hoặc ngược hướng. c) Đúng theo quy ước. d) Đúng: $|k||\\vec{a}| = 0$ với $k \\ne 0$ cho $|\\vec{a}| = 0$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho tứ diện $ABCD$; $M, N, P$ lần lượt là trung điểm của $AB, CD, MN$: $\\vec{AP} = \\frac{1}{4}(\\vec{AB} + \\vec{AC} + \\vec{AD})$.", "Cho hình chóp $S.ABCD$ có đáy là hình bình hành tâm $O$: điểm $M$ thỏa $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = \\vec{0}$ trùng với $O$.", "Cho tứ diện $ABCD$ có $G$ là trọng tâm: $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = 4\\vec{MG}$ với mọi điểm $M$.", "Cho tứ diện $ABCD$: tồn tại duy nhất điểm $G$ thỏa $\\vec{GA} + \\vec{GB} + \\vec{GC} + \\vec{GD} = \\vec{0}$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng (đã chứng minh). b) Đúng: $4\\vec{MO} = \\vec{0}$. c) Đúng: chèn $G$, dùng tổng các $\\vec{GA}$ bằng $\\vec{0}$. d) Đúng: đó chính là trọng tâm của tứ diện.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho $G$ là trọng tâm của tam giác $BCD$ trong tứ diện $ABCD$. Biết $\\vec{AB} + \\vec{AC} + \\vec{AD} = k\\vec{AG}$. Tìm $k$.", "answer": "$3$", "explain": "Đã chứng minh $\\vec{AG} = \\frac{1}{3}(\\vec{AB} + \\vec{AC} + \\vec{AD})$, suy ra $\\vec{AB} + \\vec{AC} + \\vec{AD} = 3\\vec{AG}$, vậy $k = 3$.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho $\\vec{a} \\ne \\vec{0}$. Tìm số thực $k$ để vectơ $3\\vec{a}$ ngược hướng với $\\vec{a}$ và có độ dài gấp $3$ lần $|\\vec{a}|$ (biết $k$ nguyên âm có $|k|=3$).", "answer": "$-3$", "explain": "Ngược hướng nên $k$ âm; độ dài $|k||\\vec{a}| = 3|\\vec{a}|$ nên $|k| = 3$, suy ra $k = -3$.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Cho hình lăng trụ tam giác $ABC.A'B'C'$. Đẳng thức nào đúng?", "options": ["A. $\\vec{AA'} + \\vec{BB'} + \\vec{CC'} = \\vec{0}$", "B. $\\vec{AB} + \\vec{B'C'} = \\vec{0}$", "C. $\\vec{AB} + \\vec{BC} + \\vec{CA} = \\vec{0}$", "D. $\\vec{AC'} = \\vec{AB}$"], "answer": "C", "explain": "Tổng ba vectơ tạo thành tam giác khép kín $ABC$ bằng $\\vec{0}$ (quy tắc ba điểm liên tiếp).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cho hình bình hành $ABCD$. Đẳng thức vectơ nào sau đây đúng?", "options": ["A. $\\vec{AB} + \\vec{AD} = \\vec{CA}$", "B. $\\vec{AB} - \\vec{AD} = \\vec{AC}$", "C. $\\vec{AB} + \\vec{AC} = \\vec{AD}$", "D. $\\vec{AB} + \\vec{AD} = \\vec{AC}$"], "answer": "D", "explain": "Quy tắc hình bình hành: trong hình bình hành $ABCD$, $\\vec{AB} + \\vec{AD} = \\vec{AC}$ (đường chéo xuất phát từ $A$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho tứ diện $ABCD$ có $AB = CD = a$, $AC = BD = b$, $AD = BC = c$. Gọi $M, N$ lần lượt là trung điểm của $AB$ và $CD$. Độ dài $MN$ bằng:", "options": ["A. $\\sqrt{2b^2 + 2c^2 - 2a^2}$", "B. $\\frac{\\sqrt{2b^2 + 2c^2 - 2a^2}}{2}$", "C. $\\frac{\\sqrt{b^2 + c^2 - a^2}}{2}$", "D. $\\frac{\\sqrt{2b^2 + 2c^2 - 2a^2}}{4}$"], "answer": "B", "explain": "$\\vec{MN} = \\frac{1}{2}(\\vec{AC} + \\vec{BD})$ nên $4MN^2 = AC^2 + BD^2 + 2\\vec{AC}\\cdot\\vec{BD}$. Tính $\\vec{AC}\\cdot\\vec{BD} = \\vec{AC}\\cdot(\\vec{AD} - \\vec{AB}) = \\frac{b^2+c^2-a^2}{2} - \\frac{b^2+a^2-c^2}{2} = c^2 - a^2$. Vậy $4MN^2 = 2b^2 + 2c^2 - 2a^2$, suy ra $MN = \\frac{\\sqrt{2b^2+2c^2-2a^2}}{2}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vectơ đối của vectơ $\\vec{a} \\ne \\vec{0}$ là vectơ:", "options": ["A. có cùng độ dài và ngược hướng với $\\vec{a}$", "B. có cùng độ dài và cùng hướng với $\\vec{a}$", "C. có độ dài gấp đôi $\\vec{a}$", "D. vuông góc với $\\vec{a}$"], "answer": "A", "explain": "Vectơ đối của $\\vec{a}$ kí hiệu $-\\vec{a}$, có cùng độ dài và ngược hướng với $\\vec{a}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $5$ điểm phân biệt trong không gian. Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu và điểm cuối là các điểm đã cho?", "options": ["A. $25$", "B. $20$", "C. $10$", "D. $20$\\;?"], "answer": "B", "explain": "Chọn điểm đầu có $5$ cách, điểm cuối có $4$ cách (khác điểm đầu): $5 \\times 4 = 20$ vectơ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hình chóp $S.ABC$, $M$ là điểm trên cạnh $SA$ sao cho $SM = 2MA$. Vectơ $\\vec{BM}$ theo $\\vec{BA}, \\vec{BS}$ bằng:", "options": ["A. $\\frac{1}{3}\\vec{BS} - \\frac{2}{3}\\vec{BA}$", "B. $\\frac{1}{3}\\vec{BS} + \\frac{2}{3}\\vec{BA}$", "C. $\\vec{BS} + \\vec{BA}$", "D. $\\frac{2}{3}\\vec{BS} + \\frac{1}{3}\\vec{BA}$"], "answer": "B", "explain": "$\\vec{BM} = \\vec{BS} + \\vec{SM} = \\vec{BS} + \\frac{2}{3}\\vec{SA} = \\vec{BS} + \\frac{2}{3}(\\vec{SB} + \\vec{BA}) = \\vec{BS} - \\frac{2}{3}\\vec{BS} + \\frac{2}{3}\\vec{BA} = \\frac{1}{3}\\vec{BS} + \\frac{2}{3}\\vec{BA}$.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho tứ diện $ABCD$ có $G$ là trọng tâm: $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = 4\\vec{MG}$ với mọi điểm $M$.", "Điểm $M$ thỏa mãn $\\vec{MA} + 2\\vec{MB} + 3\\vec{MC} = \\vec{0}$ là duy nhất.", "Cho tứ diện $ABCD$: tồn tại duy nhất điểm $G$ thỏa $\\vec{GA} + \\vec{GB} + \\vec{GC} + \\vec{GD} = \\vec{0}$.", "Cho hình hộp $ABCD.A'B'C'D'$; $M, N$ là trung điểm của $AB, A'D'$: $\\vec{MN} = -\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AA'}$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: chèn $G$, dùng tổng các $\\vec{GA}$ bằng $\\vec{0}$. b) Đúng: $\\vec{OM} = \\frac{1}{6}(\\vec{OA} + 2\\vec{OB} + 3\\vec{OC})$. c) Đúng: đó chính là trọng tâm của tứ diện. d) Đúng (đã chứng minh).", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho ba vectơ $\\vec{a}, \\vec{b}, \\vec{c}$ không đồng phẳng: mọi vectơ $\\vec{d}$ đều biểu thị được duy nhất dưới dạng $x\\vec{a} + y\\vec{b} + z\\vec{c}$.", "Cho hình chóp $S.ABCD$ có đáy là hình bình hành tâm $O$: điểm $M$ thỏa $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = \\vec{0}$ trùng với $O$.", "Cho hình hộp $ABCD.A'B'C'D'$; $M, N$ là trung điểm của $AB, A'D'$: $\\vec{MN} = -\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AA'}$.", "Cho tứ diện $ABCD$: tồn tại duy nhất điểm $G$ thỏa $\\vec{GA} + \\vec{GB} + \\vec{GC} + \\vec{GD} = \\vec{0}$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: hệ ba vectơ không đồng phẳng là một cơ sở. b) Đúng: $4\\vec{MO} = \\vec{0}$. c) Đúng (đã chứng minh). d) Đúng: đó chính là trọng tâm của tứ diện.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho $5$ điểm phân biệt trong không gian. Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu và điểm cuối là các điểm đã cho?", "answer": "$20$", "explain": "Chọn điểm đầu: $5$ cách; điểm cuối: $4$ cách. Tổng $5 \\times 4 = 20$ vectơ.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Cho hình hộp $ABCD.A'B'C'D'$. Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu và điểm cuối là các đỉnh của hình hộp?", "answer": "$56$", "explain": "Hình hộp có $8$ đỉnh; số vectơ khác $\\vec{0}$ là $8 \\times 7 = 56$.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "VDC", "q": "Cho tứ diện $ABCD$, $M$ là điểm thỏa $\\vec{MA} + 2\\vec{MB} + 3\\vec{MC} = \\vec{0}$ ($D$ bất kì). Điểm $M$ được xác định:", "options": ["A. không tồn tại", "B. phụ thuộc vào điểm $D$", "C. duy nhất, không phụ thuộc điểm $D$", "D. là trọng tâm tứ diện $ABCD$"], "answer": "C", "explain": "Chèn gốc $O$: $(1+2+3)\\vec{OM} = \\vec{OA} + 2\\vec{OB} + 3\\vec{OC}$, suy ra $\\vec{OM} = \\frac{1}{6}(\\vec{OA} + 2\\vec{OB} + 3\\vec{OC})$ duy nhất, không liên quan $D$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai vectơ được gọi là cùng phương nếu:", "options": ["A. chúng có giá song song hoặc trùng nhau", "B. chúng có điểm đầu trùng nhau", "C. chúng có cùng hướng", "D. chúng có cùng độ dài"], "answer": "A", "explain": "Định nghĩa: hai vectơ cùng phương khi giá của chúng song song hoặc trùng nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho ba vectơ $\\vec{a}, \\vec{b}, \\vec{c}$ không đồng phẳng. Vectơ $\\vec{x} = 2\\vec{a} - \\vec{b} + 3\\vec{c}$ và $\\vec{y} = -4\\vec{a} + 2\\vec{b} - 6\\vec{c}$. Khẳng định nào đúng?", "options": ["A. $\\vec{x} = \\vec{y}$", "B. $\\vec{x}$ và $\\vec{y}$ không cùng phương", "C. $\\vec{x} \\perp \\vec{y}$", "D. $\\vec{x}$ và $\\vec{y}$ cùng phương"], "answer": "D", "explain": "$\\vec{y} = -2(2\\vec{a} - \\vec{b} + 3\\vec{c}) = -2\\vec{x}$ nên hai vectơ cùng phương (tỉ lệ $-2$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai vectơ cùng hướng thì chúng:", "options": ["A. bằng nhau", "B. ngược hướng", "C. vuông góc", "D. cùng phương"], "answer": "D", "explain": "Cùng hướng suy ra cùng phương (giá song song hoặc trùng nhau). Ngược lại không đúng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho tứ diện $ABCD$. Gọi $M, N, P$ lần lượt là trung điểm của $AB, CD, MN$. Vectơ $\\vec{AP}$ bằng:", "options": ["A. $\\frac{1}{4}(\\vec{AB} + \\vec{AC} + \\vec{AD})$", "B. $\\frac{1}{3}(\\vec{AB} + \\vec{AC} + \\vec{AD})$", "C. $\\frac{1}{2}(\\vec{AB} + \\vec{AC} + \\vec{AD})$", "D. $\\frac{1}{4}(\\vec{AB} + \\vec{AC} - \\vec{AD})$"], "answer": "A", "explain": "$\\vec{AP} = \\frac{1}{2}(\\vec{AM} + \\vec{AN}) = \\frac{1}{2}\\left(\\frac{1}{2}\\vec{AB} + \\frac{1}{2}(\\vec{AC} + \\vec{AD})\\right) = \\frac{1}{4}(\\vec{AB} + \\vec{AC} + \\vec{AD})$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $\\vec{a}, \\vec{b}$ không cùng phương. Nếu $x\\vec{a} + y\\vec{b} = \\vec{0}$ thì:", "options": ["A. $x = y = 1$", "B. $x = y = 0$", "C. $x + y = 0$", "D. $x = y$"], "answer": "B", "explain": "Hai vectơ không cùng phương là độc lập tuyến tính: tổ hợp bằng $\\vec{0}$ khi mọi hệ số bằng $0$.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho tứ diện $ABCD$, $M, N, P$ lần lượt là trung điểm của $AB, CD, MN$: $\\vec{AP} = \\frac{1}{4}(\\vec{AB} + \\vec{AC} + \\vec{AD})$.", "Cho hình hộp $ABCD.A'B'C'D'$, $M, N$ là trung điểm của $AB, A'D'$: $\\vec{MN} = -\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AA'}$.", "Điểm $M$ thỏa $\\vec{MA} + 2\\vec{MB} + 3\\vec{MC} = \\vec{0}$ là duy nhất.", "Cho tứ diện $ABCD$ có $G$ là trọng tâm: đẳng thức $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = 4\\vec{MG}$ đúng với mọi điểm $M$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng (đã chứng minh). b) Đúng (đã chứng minh). c) Đúng: $\\vec{OM} = \\frac{1}{6}(\\vec{OA} + 2\\vec{OB} + 3\\vec{OC})$ xác định duy nhất. d) Đúng: chèn $G$ vào mỗi vectơ, dùng $\\vec{GA}+\\vec{GB}+\\vec{GC}+\\vec{GD}=\\vec{0}$.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Đường thẳng đi qua điểm đầu và điểm cuối của một vectơ được gọi là giá của vectơ đó.", "Với $I$ là trung điểm của $AB$: $\\vec{IA} + \\vec{IB} = \\vec{0}$.", "Vectơ đối của $\\vec{a}$ là $-\\vec{a}$.", "$\\vec{AB} = \\vec{BA}$ với mọi $A, B$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng theo định nghĩa giá của vectơ. b) Đúng: hai vectơ đối nhau. c) Đúng: $-\\vec{a}$ cùng độ dài, ngược hướng với $\\vec{a}$. d) Sai: $\\vec{BA} = -\\vec{AB}$.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho tứ diện $ABCD$, $M$ là trung điểm của $AB$. Biết $\\vec{CM} = a\\vec{CA} + b\\vec{CB}$. Tính $a + b$.", "answer": "$1$", "explain": "$\\vec{CM} = \\frac{1}{2}(\\vec{CA} + \\vec{CB})$ nên $a = b = \\frac{1}{2}$, suy ra $a + b = 1$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho tứ diện $ABCD$. Gọi $M, N$ lần lượt là trung điểm của $AB$ và $CD$. Biết $\\vec{MN} = a(\\vec{AC} + \\vec{BD})$. Tìm $a$ (viết dưới dạng phân số).", "answer": "$\\frac{1}{2}$", "explain": "Chứng minh $2\\vec{MN} = \\vec{AC} + \\vec{BD}$ (cộng $\\vec{MN} = \\vec{MA} + \\vec{AC} + \\vec{CN}$ và $\\vec{MN} = \\vec{MB} + \\vec{BD} + \\vec{DN}$), suy ra $a = \\frac{1}{2}$.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "VD", "q": "Cho tứ diện đều $ABCD$ cạnh $a$. Tích vô hướng $\\vec{AB} \\cdot \\vec{CD}$ bằng:", "options": ["A. $a^2$", "B. $-\\frac{a^2}{2}$", "C. $\\frac{a^2}{2}$", "D. $0$"], "answer": "D", "explain": "Trong tứ diện đều, các cặp cạnh đối vuông góc với nhau nên $\\vec{AB} \\cdot \\vec{CD} = 0$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đường thẳng đi qua điểm đầu và điểm cuối của một vectơ được gọi là:", "options": ["A. hướng của vectơ đó", "B. trục của vectơ đó", "C. giá của vectơ đó", "D. phương của vectơ đó"], "answer": "C", "explain": "Theo định nghĩa, đường thẳng đi qua điểm đầu và điểm cuối của một vectơ được gọi là giá của vectơ đó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho hình chóp $S.ABCD$ có đáy là hình bình hành tâm $O$. Đẳng thức nào đúng?", "options": ["A. $\\vec{SA} - \\vec{SC} = \\vec{SB} - \\vec{SD}$", "B. $\\vec{SA} + \\vec{SC} = \\vec{SB} + \\vec{SD}$", "C. $\\vec{SA} + \\vec{SB} = \\vec{SC} + \\vec{SD}$", "D. $\\vec{SA} + \\vec{SC} = \\vec{AC}$"], "answer": "B", "explain": "Vì $O$ là trung điểm $AC$ và $BD$ nên $\\vec{SA} + \\vec{SC} = 2\\vec{SO} = \\vec{SB} + \\vec{SD}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Với ba điểm $A, B, C$ bất kì trong không gian, $\\vec{AB} + \\vec{BC}$ bằng:", "options": ["A. $\\vec{AC}$", "B. $\\vec{0}$", "C. $\\vec{BB}$", "D. $\\vec{CA}$"], "answer": "A", "explain": "Quy tắc ba điểm: $\\vec{AB} + \\vec{BC} = \\vec{AC}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Với ba điểm $M, N, P$ bất kì, $\\vec{MN} - \\vec{MP}$ bằng:", "options": ["A. $\\vec{PN}$", "B. $\\vec{MN}$", "C. $\\vec{0}$", "D. $\\vec{NP}$"], "answer": "A", "explain": "$\\vec{MN} - \\vec{MP} = \\vec{PM} + \\vec{MN} = \\vec{PN}$ (quy tắc trừ: chung điểm đầu $M$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $\\vec{a}, \\vec{b}, \\vec{c}$ đôi một không cùng phương và $\\vec{d} = x\\vec{a} + y\\vec{b} + z\\vec{c}$. Nếu $\\vec{d} = \\vec{0}$ thì:", "options": ["A. chỉ cần một trong ba số bằng $0$", "B. $x = y = z = 0$", "C. $x = y = z = 1$", "D. $x + y + z = 0$"], "answer": "B", "explain": "Ba vectơ không đồng phẳng là độc lập tuyến tính: tổ hợp tuyến tính bằng $\\v ec{b} + \\vec{a}$. b) Sai: vectơ-không cùng hướng với mọi vectơ. c) Đúng theo định nghĩa giá của vectơ. d) Đúng theo định nghĩa hai vectơ bằng nhau.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho hình hộp $ABCD.A'B'C'D'$. Gọi $I$ là tâm hình hộp. Biết $\\vec{AC'} = k\\vec{AI}$. Tìm $k$.", "answer": "$2$", "explain": "$I$ là trung điểm của đường chéo $AC'$ nên $\\vec{AC'} = 2\\vec{AI}$, suy ra $k = 2$.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho $\\vec{a} \\ne \\vec{0}$. Tìm số thực $k$ để vectơ $2\\vec{a}$ ngược hướng với $\\vec{a}$ và có độ dài gấp $2$ lần $|\\vec{a}|$ (biết $k$ nguyên âm có $|k|=2$).", "answer": "$-2$", "explain": "Ngược hướng nên $k$ âm; độ dài $|k||\\vec{a}| = 2|\\vec{a}|$ nên $|k| = 2$, suy ra $k = -2$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VD", "q": "Cho hình hộp chữ nhật $ABCD.A'B'C'D'$ có $AB = a, AD = b, AA' = c$. Độ dài đường chéo $AC'$ bằng:", "options": ["A. $\\frac{1}{2}\\sqrt{a^2+b^2+c^2}$", "B. $a + b + c$", "C. $\\sqrt{a^2 + b^2} + c$", "D. $\\sqrt{a^2 + b^2 + c^2}$"], "answer": "D", "explain": "$\\vec{AC'} = \\vec{AB} + \\vec{AD} + \\vec{AA'}$ với ba vectơ đôi một vuông góc nên $AC'^2 = a^2 + b^2 + c^2$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vectơ trong không gian là:", "options": ["A. một tia", "B. một đoạn thẳng", "C. một đoạn thẳng có hướng", "D. một đường thẳng có hướng"], "answer": "C", "explain": "Theo định nghĩa: vectơ trong không gian là một đoạn thẳng có hướng. Điểm đầu và điểm cuối phân biệt (trừ vectơ-không) xác định hướng của nó.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hình chóp $S.ABC$, $M$ là điểm trên cạnh $SA$ sao cho $SM = 2MA$. Vectơ $\\vec{BM}$ theo $\\vec{BA}, \\vec{BS}$ bằng:", "options": ["A. $\\vec{BS} + \\vec{BA}$", "B. $\\frac{1}{3}\\vec{BS} + \\frac{2}{3}\\vec{BA}$", "C. $\\frac{2}{3}\\vec{BS} + \\frac{1}{3}\\vec{BA}$", "D. $\\frac{1}{3}\\vec{BS} - \\frac{2}{3}\\vec{BA}$"], "answer": "B", "explain": "$\\vec{BM} = \\vec{BS} + \\vec{SM} = \\vec{BS} + \\frac{2}{3}\\vec{SA} = \\vec{BS} + \\frac{2}{3}(\\vec{SB} + \\vec{BA}) = \\vec{BS} - \\frac{2}{3}\\vec{BS} + \\frac{2}{3}\\vec{BA} = \\frac{1}{3}\\vec{BS} + \\frac{2}{3}\\vec{BA}$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hình hộp $ABCD.A'B'C'D'$. Gọi $M, N$ lần lượt là trung điểm của $AB$ và $A'D'$. Vectơ $\\vec{MN}$ theo $\\vec{AB}, \\vec{AD}, \\vec{AA'}$ là:", "options": ["A. $-\\frac{1}{2}\\vec{AB} - \\frac{1}{2}\\vec{AD} + \\vec{AA'}$", "B. $\\frac{1}{2}\\vec{AB} + \\vec{AD} + \\frac{1}{2}\\vec{AA'}$", "C. $\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AA'}$", "D. $-\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AA'}$"], "answer": "D", "explain": "$\\vec{MN} = \\vec{MA} + \\vec{AA'} + \\vec{A'N} = -\\frac{1}{2}\\vec{AB} + \\vec{AA'} + \\frac{1}{2}\\vec{A'D'} = -\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AA'}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho ba điểm $A, B, C$ thẳng hàng theo thứ tự đó, $AB = 2BC$. Vectơ $\\vec{AC}$ bằng:", "options": ["A. $\\frac{3}{2}\\vec{BC}$", "B. $3\\vec{BC}$", "C. $2\\vec{BC}$", "D. $-3\\vec{BC}$"], "answer": "B", "explain": "$AC = AB + BC = 3BC$ và $\\vec{AC}$ cùng hướng $\\vec{BC}$ nên $\\vec{AC} = 3\\vec{BC}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $M$ là trung điểm của $AB$ và $O$ là điểm bất kì. Đẳng thức nào đúng?", "options": ["A. $\\vec{OM} = \\vec{OA} + \\vec{OB}$", "B. $\\vec{OM} = \\frac{1}{2}(\\vec{OA} + \\vec{OB})$", "C. $\\vec{OM} = \\frac{1}{2}(\\vec{OA} - \\vec{OB})$", "D. $\\vec{OM} = 2(\\vec{OA} + \\vec{OB})$"], "answer": "B", "explain": "Vì $M$ là trung điểm $AB$ nên $\\vec{MA} + \\vec{MB} = \\vec{0}$, suy ra $\\vec{OM} = \\frac{1}{2}(\\vec{OA} + \\vec{OB})$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho $\\vec{a} = 2\\vec{u} - 3\\vec{v}}$, $\\vec{b} = -\\vec{u} + \\vec{v}$: $\\vec{a} + 2\\vec{b} = -\\vec{v}$.", "Cho hình lập phương $ABCD.A'B'C'D'$: $\\vec{AB} = \\vec{CD}$.", "Cho hình chóp $S.ABCD$ có đáy là hình bình hành: $\\vec{SA} + \\vec{SC} = \\vec{SB} + \\vec{SD}$.", "Cho $\\vec{a}, \\vec{b}$ không cùng phương và $\\vec{c} = 2\\vec{a} - \\vec{b}$: ba vectơ $\\vec{a}, \\vec{b}, \\vec{c}$ đồng phẳng."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: khai triển được $-\\vec{v}$. b) Sai: $\\vec{CD} = -\\vec{AB}$ (ngược hướng). c) Đúng: cùng bằng $2\\vec{SO}$ với $O$ là tâm đáy. d) Đúng: $\\vec{c}$ là tổ hợp tuyến tính của $\\vec{a}, \\vec{b}$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho tứ diện $ABCD$, $M$ là trung điểm $AB$: $\\vec{CM} = \\frac{1}{2}(\\vec{CA} + \\vec{CB})$.", "Cho hình hộp $ABCD.A'B'C'D'$: $\\vec{AC'} = \\vec{AB} + \\vec{AD} + \\vec{AA'}$.", "Cho $G$ là trọng tâm tứ diện $ABCD$: $\\vec{GA} + \\vec{GB} + \\vec{GC} + \\vec{GD} = \\vec{0}$.", "Với ba vectơ không đồng phẳng $\\vec{a}, \\vec{b}, \\vec{c}$: $2\\vec{a} - \\vec{b} + \\vec{c} = \\vec{0}$ khi và chỉ khi các hệ số đều bằng $0$, vô lí nên đẳng thức này không thể đúng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: quy tắc trung tuyến trong $\\triangle CAB$. b) Đúng: quy tắc hình hộp. c) Đúng: tính chất trọng tâm tứ diện. d) Sai: đẳng thức $2\\vec{a} - \\vec{b} + \\vec{c} = \\vec{0}$ với hệ số không đồng thời bằng $0$ mâu thuẫn tính độc lập tuyến tính, nên khẳng định 'khi và chỉ khi' là sai cách diễn đạt — thực tế đẳng thức này không xảy ra.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho hình lập phương $ABCD.A'B'C'D'$. Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu là $A$ và điểm cuối là một trong các đỉnh còn lại của hình lập phương?", "answer": "$7$", "explain": "Hình lập phương có $8$ đỉnh; trừ $A$ còn $7$ đỉnh, mỗi đỉnh cho một vectơ có điểm đầu $A$: $7$ vectơ.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cho tứ diện đều $ABCD$ có cạnh bằng $2$. Tính tích vô hướng $\\vec{AB} \\cdot \\vec{AC}$.", "answer": "$2$", "explain": "$\\vec{AB} \\cdot \\vec{AC} = AB \\cdot AC \\cdot \\cos 60^\\circ = 2 \\times 2 \\times \\frac{1}{2} = 2$.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Cho tứ diện $ABCD$, $M$ là trung điểm $AB$, $N$ là trung điểm $CD$. Vectơ $\\vec{MN}$ bằng:", "options": ["A. $\\frac{1}{4}(\\vec{AD} + \\vec{BC})$", "B. $\\frac{1}{2}(\\vec{AD} + \\vec{BC})$", "C. $\\vec{AD} + \\vec{BC}$", "D. $\\frac{1}{2}(\\vec{AB} + \\vec{CD})$"], "answer": "B", "explain": "$\\vec{MN} = \\vec{MA} + \\vec{AD} + \\vec{DN} = \\vec{MB} + \\vec{BC} + \\vec{CN}$. Cộng hai vế: $2\\vec{MN} = \\vec{AD} + \\vec{BC}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nếu $k\\vec{a} = \\vec{0}$ với $\\vec{a} \\ne \\vec{0}$ thì:", "options": ["A. $k = 1$", "B. $|k| = 1$", "C. $k = -1$", "D. $k = 0$"], "answer": "D", "explain": "Vì $\\vec{a} \\ne \\vec{0}$ nên $|k\\vec{a}| = |k||\\vec{a}| = 0$ suy ra $|k| = 0$, tức $k = 0$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hình hộp $ABCD.A'B'C'D'$. Gọi $M, N$ lần lượt là trung điểm của $AB$ và $A'D'$. Vectơ $\\vec{MN}$ theo $\\vec{AB}, \\vec{AD}, \\vec{AA'}$ là:", "options": ["A. $-\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AA'}$", "B. $\\frac{1}{2}\\vec{AB} + \\vec{AD} + \\frac{1}{2}\\vec{AA'}$", "C. $\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AA'}$", "D. $-\\frac{1}{2}\\vec{AB} - \\frac{1}{2}\\vec{AD} + \\vec{AA'}$"], "answer": "A", "explain": "$\\vec{MN} = \\vec{MA} + \\vec{AA'} + \\vec{A'N} = -\\frac{1}{2}\\vec{AB} + \\vec{AA'} + \\frac{1}{2}\\vec{A'D'} = -\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AA'}$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho tứ diện $ABCD$. Gọi $M, N, P$ lần lượt là trung điểm của $AB, CD, MN$. Vectơ $\\vec{AP}$ bằng:", "options": ["A. $\\frac{1}{4}(\\vec{AB} + \\vec{AC} + \\vec{AD})$", "B. $\\frac{1}{2}(\\vec{AB} + \\vec{AC} + \\vec{AD})$", "C. $\\frac{1}{3}(\\vec{AB} + \\vec{AC} + \\vec{AD})$", "D. $\\frac{1}{4}(\\vec{AB} + \\vec{AC} - \\vec{AD})$"], "answer": "A", "explain": "$\\vec{AP} = \\frac{1}{2}(\\vec{AM} + \\vec{AN}) = \\frac{1}{2}\\left(\\frac{1}{2}\\vec{AB} + \\frac{1}{2}(\\vec{AC} + \\vec{AD})\\right) = \\frac{1}{4}(\\vec{AB} + \\vec{AC} + \\vec{AD})$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho hình chóp tứ giác đều $S.ABCD$ có tất cả các cạnh bằng $a$. Gọi $M$ là trung điểm $SC$. $\\vec{AM}$ biểu thị theo $\\vec{AB}, \\vec{AD}, \\vec{AS}$ là:", "options": ["A. $\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\frac{1}{2}\\vec{AS}$", "B. $\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AS}$", "C. $\\vec{AB} + \\vec{AD} + \\vec{AS}$", "D. $\\vec{AB} + \\vec{AD} + \\frac{1}{2}\\vec{AS}$"], "answer": "A", "explain": "$\\vec{AM} = \\vec{AS} + \\vec{SM} = \\vec{AS} + \\frac{1}{2}\\vec{SC} = \\vec{AS} + \\frac{1}{2}(\\vec{SA} + \\vec{AC}) = \\frac{1}{2}\\vec{AS} + \\frac{1}{2}(\\vec{AB} + \\vec{AD})$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hình chóp $S.ABCD$ có đáy là hình bình hành tâm $O$. Điểm $M$ thỏa $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = \\vec{0}$ là điểm nào?", "options": ["A. trọng tâm của tam giác $SAC$", "B. trùng với tâm $O$ của đáy", "C. trùng với đỉnh $S$", "D. trung điểm của $SO$"], "answer": "B", "explain": "Chèn $O$: $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = 4\\vec{MO} + (\\vec{OA} + \\vec{OB} + \\vec{OC} + \\vec{OD}) = 4\\vec{MO} = \\vec{0}$ (vì $\\vec{OA} + \\vec{OC} = \\vec{OB} + \\vec{OD} = \\vec{0}$). Vậy $\\vec{MO} = \\vec{0}$, tức $M \\equiv O$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho hình hộp $ABCD.A'B'C'D'$: $\\vec{AC'} = \\vec{AB} + \\vec{AD} + \\vec{AA'}$.", "Cho $\\vec{a} = 2\\vec{u} - 3\\vec{v}}$, $\\vec{b} = -\\vec{u} + \\vec{v}$: $\\vec{a} + 2\\vec{b} = -\\vec{v}$.", "Cho $G$ là trọng tâm của tứ diện $ABCD$: $\\vec{GA} + \\vec{GB} + \\vec{GC} + \\vec{GD} = \\vec{AB}$.", "Cho hình lập phương $ABCD.A'B'C'D'$: $\\vec{AB} = \\vec{CD}$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: quy tắc hình hộp. b) Đúng: khai triển được $-\\vec{v}$. c) Sai: tổng bằng $\\vec{0}$. d) Sai: $\\vec{CD} = -\\vec{AB}$ (ngược hướng).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Cho hình chóp tứ giác đều $S.ABCD$, $M$ là trung điểm của $SC$: $\\vec{AM} = \\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\frac{1}{2}\\vec{AS}$.", "Cho hình hộp chữ nhật có ba kích thước $a, b, c$: độ dài đường chéo bằng $a + b + c$.", "Trong tứ diện đều, hai cạnh đối bất kì vuông góc với nhau.", "Ba vectơ không đồng phẳng là độc lập tuyến tính."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng (đã chứng minh). b) Sai: đường chéo bằng $\\sqrt{a^2+b^2+c^2}$. c) Đúng: tính chất của tứ diện đều. d) Đúng: tổ hợp bằng $\\vec{0}$ khi mọi hệ số bằng $0$.", "points": 1}, {"type": "short", "level": "VDC", "q": "Cho hình hộp $ABCD.A'B'C'D'$, $M$ là trung điểm của $AB$, $N$ là trung điểm của $A'D'$. Biết $\\vec{MN} = a\\vec{AB} + b\\vec{AD} + c\\vec{AA'}$. Tính $a + b + c$.", "answer": "$1$", "explain": "$\\vec{MN} = -\\frac{1}{2}\\vec{AB} + \\frac{1}{2}\\vec{AD} + \\vec{AA'}$ nên $a + b + c = -\\frac{1}{2} + \\frac{1}{2} + 1 = 1$.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Cho hình chóp tứ giác $S.ABCD$ (điểm đầu $S$). Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu là đỉnh đã nêu và điểm cuối là một trong các đỉnh còn lại?", "answer": "$4$", "explain": "Trừ đỉnh đầu còn $4$ đỉnh, mỗi đỉnh cho một vectơ: $4$ vectơ.", "points": 0.5}]}]}
