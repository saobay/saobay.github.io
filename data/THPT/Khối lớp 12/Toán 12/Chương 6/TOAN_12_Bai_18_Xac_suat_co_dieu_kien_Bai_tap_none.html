ây: nhánh 1 xác suất $0{,}6$ rồi nhánh 2 xác suất $0{,}5$ cho $P = 0{,}3$.", "$P(A|B) + P(\\bar{A}|B) = 1$ với mọi $A, B$ ($P(B) \\gt 0$)."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $\\frac{4}{5}\\cdot\\frac{3}{4} = \\frac{3}{5}$. b) Đúng: $0{,}5 \\times 0{,}4$. c) Đúng: nhân dọc theo nhánh $0{,}6 \\times 0{,}5 = 0{,}3$. d) Đúng: quy tắc bù.", "points": 1}, {"type": "short", "level": "NB", "q": "$P(\\bar{A}|B)$ bằng bao nhiêu theo $P(A|B)$?", "answer": "$1 - P(A|B)$", "explain": "Với $B$ cố định, $A$ và $\\bar{A}$ là đối nhau.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Sơ đồ cây: nhánh 1 xác suất $1/2$, nhánh 2 xác suất $1/2$. Tính xác suất đường đi.", "answer": "$\\frac{1}{4}$", "explain": "Nhân dọc nhánh: $1/2\\times1/2 = $\\frac{1}{4}$$.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Gieo một con xúc xắc cân đối. Biết đã xuất hiện mặt chẵn, xác suất xuất hiện mặt $8$ là:", "options": ["A. $\\frac{1}{2}$", "B. $\\frac{1}{6}$", "C. $\\frac{2}{3}$", "D. $\\frac{1}{3}$"], "answer": "D", "explain": "Không gian mẫu mới là $\\{2; 4; 6\\}$ nên $P = 1/3$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cho $A, B$ là hai biến cố với $P(B) \\gt 0$. Xác suất có điều kiện $P(A|B)$ được định nghĩa là:", "options": ["A. $P(A|B) = P(A) \\cdot P(B)$", "B. $P(A|B) = \\frac{P(AB)}{P(B)}$", "C. $P(A|B) = P(A) + P(B)$", "D. $P(A|B) = \\frac{P(B)}{P(AB)}$"], "answer": "B", "explain": "Định nghĩa: $P(A|B) = \\frac{P(AB)}{P(B)}$ ($P(B) \\gt 0$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức nhân xác suất phát biểu rằng:", "options": ["A. $P(AB) = P(B) \\cdot P(A|B)$", "B. $P(AB) = P(A) + P(B)$", "C. $P(AB) = P(A|B) - P(B)$", "D. $P(AB) = \\frac{P(A)}{P(B)}$"], "answer": "A", "explain": "Công thức nhân: $P(AB) = P(B) \\cdot P(A|B) = P(A) \\cdot P(B|A)$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $P(A|B) = $\\frac{4}{5}$$, $P(A|\\bar{B}) = $\\frac{1}{2}$$, $P(B) = \\frac{1}{2}$. Tính $P(A)$.", "options": ["A. $\\frac{13}{20}$", "B. $\\frac{1}{2}$", "C. $\\frac{13}{20}$\\;?", "D. $\\frac{4}{5}$"], "answer": "A", "explain": "$P(A) = \\frac{1}{2}\\cdot$\\frac{4}{5}$ + \\frac{1}{2}\\cdot$\\frac{1}{2}$ = $\\frac{13}{20}$$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lớp có $2$ học sinh giỏi trong tổng số $10$ học sinh. Chọn ngẫu nhiên $1$ học sinh. Xác suất chọn được học sinh giỏi là:", "options": ["A. $\\frac{1}{4}$", "B. $\\frac{1}{5}$", "C. $\\frac{1}{2}$", "D. $\\frac{4}{5}$"], "answer": "B", "explain": "$P = \\frac{2}{10} = $\\frac{1}{5}$$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nếu hai biến cố $A, B$ độc lập thì:", "options": ["A. $P(A|B) = P(A)$", "B. $P(A|B) = 1$", "C. $P(A|B) = P(B)$", "D. $P(A|B) = 0$"], "answer": "A", "explain": "Độc lập: $B$ xảy ra hay không cũng không ảnh hưởng $P(A)$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["Nếu $P(A|B) = 1$ thì $B$ xảy ra kéo theo $A$ xảy ra.", "Tung 2 đồng xu, biết có ít nhất 1 ngửa thì $P(2 \\text{ ngửa}) = \\frac{1}{3}$.", "Gieo xúc xắc 2 lần độc lập thì $P(\\text{lần 2 ra 6} | \\text{lần 1 ra 6}) = \\frac{1}{6}$.", "$P(A|B) = 0$ khi và chỉ khi $A, B$ xung khắc."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng theo định nghĩa. b) Đúng: mẫu mới $\\{NN,NS,SN\\}$. c) Đúng: độc lập nên $P = 1/6$. d) Đúng: $P(AB) = 0$.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["$P(A|B) = \\frac{P(AB)}{P(B)}$ với $P(B) \\gt 0$.", "Nếu $A, B$ độc lập thì $P(A|B) = P(A)$.", "$P(A|B) = P(B|A)$ luôn đúng.", "Nếu $P(B) = 0$ thì $P(A|B) = 0$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: định nghĩa xác suất có điều kiện. b) Đúng: $B$ xảy ra không ảnh hưởng $A$. c) Sai: nói chung $P(A|B) \\ne P(B|A)$. d) Sai: $P(A|B)$ không xác định khi $P(B) = 0$.", "points": 1}, {"type": "short", "level": "NB", "q": "Viết công thức nhân xác suất.", "answer": "$P(AB) = P(A) \\cdot P(B|A) = P(B) \\cdot P(A|B)$", "explain": "Công thức nhân suy ra từ định nghĩa xác suất có điều kiện.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hộp I: $4$ đỏ $3$ xanh; hộp II: $5$ đỏ $1$ xanh. Chọn ngẫu nhiên 1 hộp rồi bốc 1 bi. Tính xác suất được bi đỏ.", "answer": "$\\frac{59}{84}$", "explain": "$P = \\frac{1}{2}\\cdot\\frac{4}{7}+\\frac{1}{2}\\cdot\\frac{5}{6} = $\\frac{59}{84}$$.", "points": 0.5}]}]}
