{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Nội năng của một vật là", "options": ["A. tổng động năng và thế năng của các phân tử cấu tạo nên vật.", "B. tổng động năng chuyển động nhiệt của các phân tử cấu tạo nên vật.", "C. nhiệt lượng mà vật nhận được từ bên ngoài.", "D. tổng cơ năng của vật so với mặt đất."], "answer": "A", "explain": "Nội năng bằng tổng động năng (do chuyển động nhiệt) và thế năng tương tác của các phân tử cấu tạo nên vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong dao động điều hòa, đại lượng nào sau đây biến thiên điều hòa theo thời gian?", "options": ["A. Chu kì dao động.", "B. Tần số góc.", "C. Li độ của vật.", "D. Biên độ dao động."], "answer": "C", "explain": "Li độ $x = A\\cos(\\omega t + \\varphi)$ biến thiên điều hòa theo thời gian; biên độ $A$, tần số góc $\\omega$ và chu kì $T$ không đổi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng dọc là sóng có phương dao động của các phần tử môi trường", "options": ["A. vuông góc với phương truyền sóng.", "B. trùng với phương truyền sóng.", "C. hợp với phương truyền sóng một góc $45^\\circ$.", "D. luôn hướng lên trên."], "answer": "B", "explain": "Định nghĩa: sóng dọc có phương dao động trùng với phương truyền sóng (ví dụ sóng âm trong không khí).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đặt điện áp xoay chiều vào hai đầu đoạn mạch chỉ có tụ điện. Phát biểu nào sau đây đúng?", "options": ["A. Điện áp sớm pha $\\pi/2$ so với cường độ dòng điện.", "B. Điện áp và cường độ dòng điện cùng pha.", "C. Điện áp ngược pha với cường độ dòng điện.", "D. Cường độ dòng điện sớm pha $\\pi/2$ so với điện áp."], "answer": "D", "explain": "Trong mạch chỉ có tụ điện, cường độ dòng điện sớm pha $\\pi/2$ so với điện áp (hay điện áp trễ pha $\\pi/2$ so với dòng điện).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một đoạn dây dẫn thẳng mang dòng điện $I$ đặt trong từ trường đều có cảm ứng từ $B$. Lực từ tác dụng lên đoạn dây dài $l$ có độ lớn", "options": ["A. $F = BIl\\sin\u0007lpha$, trong đó $\u0007lpha$ là góc hợp bởi vectơ cảm ứng từ và đoạn dây.", "B. $F = BIl\\cos\u0007lpha$, trong đó $\u0007lpha$ là góc hợp bởi vectơ cảm ứng từ và đoạn dây.", "C. $F = BI/l$, không phụ thuộc góc đặt dây.", "D. $F = Bl/I$, tỉ lệ nghịch với cường độ dòng điện."], "answer": "A", "explain": "Công thức lực từ: $F = BIl\\sin\\alpha$ với $\\alpha$ là góc giữa $\\vec{B}$ và chiều dòng điện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện tượng tán sắc ánh sáng khi chiếu chùm sáng trắng qua lăng kính chứng tỏ", "options": ["A. chiết suất của lăng kính không phụ thuộc bước sóng ánh sáng.", "B. ánh sáng trắng bị lăng kính hấp thụ một phần.", "C. ánh sáng trắng là hỗn hợp của nhiều ánh sáng đơn sắc có màu khác nhau.", "D. lăng kính làm thay đổi tần số của ánh sáng."], "answer": "C", "explain": "Tán sắc chứng tỏ ánh sáng trắng gồm nhiều ánh sáng đơn sắc (đỏ, cam, vàng, lục, lam, chàm, tím) bị lệch khác nhau do chiết suất phụ thuộc bước sóng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giới hạn quang điện $\\lambda_0$ của một kim loại là", "options": ["A. bước sóng ngắn nhất của ánh sáng kích thích có thể gây ra hiện tượng quang điện.", "B. bước sóng lớn nhất của ánh sáng kích thích có thể gây ra hiện tượng quang điện.", "C. tần số lớn nhất của ánh sáng kích thích có thể gây ra hiện tượng quang điện.", "D. cường độ lớn nhất của chùm sáng kích thích."], "answer": "B", "explain": "Hiện tượng quang điện chỉ xảy ra khi $\\lambda \\le \\lambda_0$; $\\lambda_0$ là bước sóng lớn nhất còn gây được hiện tượng quang điện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hạt nhân $^{A}_{Z}X$ có số neutron là", "options": ["A. $Z$.", "B. $A + Z$.", "C. $A$.", "D. $A - Z$."], "answer": "D", "explain": "Số khối $A = Z + N$ nên số neutron $N = A - Z$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Con lắc lò xo gồm vật nặng $m = 0,5$ kg gắn vào lò xo có độ cứng $k = 50$ N/m, dao động điều hòa. Chu kì dao động của con lắc là", "options": ["A. $0,4\\pi$ s.", "B. $0,2\\pi$ s.", "C. $2\\pi$ s.", "D. $\\pi$ s."], "answer": "B", "explain": "$T = 2\\pi\\sqrt{m/k} = 2\\pi\\sqrt{0,5/50} = 2\\pi \\times 0,1 = 0,2\\pi$ s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sóng cơ lan truyền trong một môi trường với tốc độ $200$ m/s, tần số $50$ Hz. Bước sóng của sóng này là", "options": ["A. $0,25$ m.", "B. $10000$ m.", "C. $2,5$ m.", "D. $4$ m."], "answer": "D", "explain": "$\\lambda = v/f = 200/50 = 4$ m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặt điện áp $u = 100\\sqrt{2}\\cos(100\\pi t)$ (V) vào hai đầu điện trở $R = 20\\ \\Omega$. Biểu thức cường độ dòng điện qua điện trở là", "options": ["A. $i = 5\\sqrt{2}\\cos(100\\pi t)$ (A).", "B. $i = 5\\cos(100\\pi t)$ (A).", "C. $i = 5\\sqrt{2}\\cos(100\\pi t + \\pi/2)$ (A).", "D. $i = 10\\cos(100\\pi t)$ (A)."], "answer": "A", "explain": "Mạch chỉ có $R$ nên $i$ cùng pha với $u$; $I = U/R = 100/20 = 5$ A, vậy $i = 5\\sqrt{2}\\cos(100\\pi t)$ (A).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một đoạn dây dẫn dài $0,4$ m mang dòng điện $2$ A đặt trong từ trường đều có cảm ứng từ $0,5$ T; dây dẫn hợp với vectơ cảm ứng từ một góc $30^\\circ$. Lực từ tác dụng lên đoạn dây có độ lớn", "options": ["A. $0,4$ N.", "B. $0,1$ N.", "C. $0,2$ N.", "D. $0,8$ N."], "answer": "C", "explain": "$F = BIl\\sin\\alpha = 0,5 \\times 2 \\times 0,4 \\times \\sin30^\\circ = 0,4 \\times 0,5 = 0,2$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một lượng khí lí tưởng biến đổi đẳng nhiệt: lúc đầu áp suất $2$ atm, thể tích $3$ L. Khi thể tích tăng lên $6$ L thì áp suất của khí là", "options": ["A. $4$ atm.", "B. $1$ atm.", "C. $3$ atm.", "D. $1,5$ atm."], "answer": "B", "explain": "Đẳng nhiệt: $p_1V_1 = p_2V_2$, suy ra $p_2 = 2 \\times 3/6 = 1$ atm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạt nhân $^{238}_{92}U$ phóng xạ $\\alpha$ biến thành hạt nhân", "options": ["A. $^{234}_{92}U$.", "B. $^{238}_{90}Th$.", "C. $^{234}_{91}Pa$.", "D. $^{234}_{90}Th$."], "answer": "D", "explain": "Phóng xạ $\\alpha$ ($^{4}_{2}He$): $A$ giảm $4$, $Z$ giảm $2$, được $^{234}_{90}Th$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vật dao động điều hòa theo phương trình $x = 4\\cos(2\\pi t + \\pi/3)$ (cm). Tại thời điểm $t = 0,25$ s, li độ của vật là", "options": ["A. $-2\\sqrt{3}$ cm.", "B. $2\\sqrt{3}$ cm.", "C. $-2$ cm.", "D. $2$ cm."], "answer": "A", "explain": "Pha dao động tại $t = 0,25$ s là $2\\pi \\times 0,25 + \\pi/3 = 5\\pi/6$; $x = 4\\cos(5\\pi/6) = 4 \\times (-\\sqrt{3}/2) = -2\\sqrt{3}$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đoạn mạch RLC nối tiếp có $R = 30\\ \\Omega$, cảm kháng $Z_L = 50\\ \\Omega$, dung kháng $Z_C = 10\\ \\Omega$, điện áp hiệu dụng hai đầu mạch $U = 100$ V. Công suất tiêu thụ của mạch là", "options": ["A. $200$ W.", "B. $333$ W.", "C. $120$ W.", "D. $60$ W."], "answer": "C", "explain": "$Z = \\sqrt{R^2 + (Z_L - Z_C)^2} = \\sqrt{30^2 + 40^2} = 50\\ \\Omega$; $I = U/Z = 2$ A; $P = I^2R = 4 \\times 30 = 120$ W.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "$2$ mol khí lí tưởng giãn nở đẳng áp làm nhiệt độ tăng thêm $50$ K. Công mà khối khí sinh ra là bao nhiêu? (Cho $R = 8,31$ J/(mol.K))", "options": ["A. $415,5$ J.", "B. $831$ J.", "C. $1662$ J.", "D. $207,75$ J."], "answer": "B", "explain": "Đẳng áp: công khí sinh ra $A' = p\\Delta V = nR\\Delta T = 2 \\times 8,31 \\times 50 = 831$ J.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong thí nghiệm giao thoa sóng trên mặt nước, hai nguồn kết hợp cùng pha, bước sóng $2$ cm. Điểm $M$ cách hai nguồn lần lượt $7$ cm và $10$ cm. Điểm $M$ dao động với biên độ", "options": ["A. cực đại.", "B. cực tiểu thứ nhất.", "C. cực đại thứ hai.", "D. cực tiểu thứ hai."], "answer": "D", "explain": "$d_2 - d_1 = 3$ cm $= 1,5\\lambda = (1 + 0,5)\\lambda$ nên $M$ là cực tiểu giao thoa thứ hai ($k = 1$).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một khối khí lí tưởng đựng trong bình kín.", "statements": ["a) Nội năng của khí lí tưởng chỉ phụ thuộc vào nhiệt độ của khí.", "b) Nén khối khí (thực hiện công lên khí) làm tăng nội năng của khí.", "c) Hơ nóng khối khí (truyền nhiệt cho khí) không làm thay đổi nội năng của khí.", "d) Khi nhiệt độ của khí không đổi thì nội năng của khí không đổi."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $U$ của khí lí tưởng chỉ phụ thuộc $T$. b) Đúng: nhận công $A \\gt 0$ nên $\\Delta U = A + Q$ tăng. c) Sai: truyền nhiệt $Q \\gt 0$ làm $\\Delta U$ tăng. d) Đúng: $T$ không đổi thì $U$ không đổi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một con lắc đơn có chiều dài $1$ m, dao động nhỏ tại nơi có gia tốc trọng trường $g = 10$ m/s$^2$.", "statements": ["a) Chu kì dao động của con lắc xấp xỉ $2$ s.", "b) Tần số dao động của con lắc là $0,5$ Hz.", "c) Nếu tăng chiều dài con lắc lên $4$ lần thì chu kì tăng $2$ lần.", "d) Chu kì dao động phụ thuộc vào khối lượng của vật nặng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $T = 2\\pi\\sqrt{l/g} = 2\\pi\\sqrt{0,1} \\approx 1,99$ s. b) Đúng: $f = 1/T \\approx 0,5$ Hz. c) Đúng: $T \\propto \\sqrt{l}$. d) Sai: $T$ không phụ thuộc $m$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét đoạn mạch điện xoay chiều RLC nối tiếp đang xảy ra hiện tượng cộng hưởng điện.", "statements": ["a) Cảm kháng của cuộn cảm bằng dung kháng của tụ điện.", "b) Cường độ dòng điện hiệu dụng trong mạch đạt cực đại.", "c) Điện áp hai đầu mạch cùng pha với cường độ dòng điện.", "d) Công suất tiêu thụ của mạch đạt cực tiểu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cộng hưởng khi $Z_L = Z_C$. b) Đúng: $Z_{\\min} = R$ nên $I_{\\max} = U/R$. c) Đúng: $\\varphi = 0$. d) Sai: $P_{\\max} = U^2/R$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một khung dây dẫn phẳng có $N$ vòng, diện tích mỗi vòng $S$, đặt trong từ trường đều có cảm ứng từ $B$. Từ thông qua khung được tính bởi $\\Phi = NBS\\cos\\alpha$.", "statements": ["a) $\u0007lpha$ là góc hợp bởi vectơ cảm ứng từ và vectơ pháp tuyến của mặt phẳng khung.", "b) Từ thông đạt cực đại khi mặt phẳng khung song song với các đường sức từ.", "c) Khi từ thông qua khung biến thiên, trong khung xuất hiện suất điện động cảm ứng $e_c = -\\Delta\\Phi/\\Delta t$.", "d) Từ thông bằng không khi mặt phẳng khung vuông góc với các đường sức từ."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng theo định nghĩa. b) Sai: $\\Phi_{\\max}$ khi $\\cos\\alpha = 1$, tức mặt khung vuông góc đường sức. c) Đúng: định luật Faraday. d) Sai: khi đó $\\alpha = 0$, $\\Phi = NBS$ cực đại.", "points": 1}, {"type": "short", "level": "TH", "q": "Trong thí nghiệm Young về giao thoa ánh sáng, khoảng cách giữa hai khe $a = 1$ mm, khoảng cách từ hai khe đến màn $D = 2$ m, ánh sáng dùng có bước sóng $\\lambda = 0,6\\ \\mu$m. Khoảng vân $i$ trên màn bằng bao nhiêu mm?", "answer": "1,2", "explain": "$i = \\lambda D/a = 0,6 \\times 10^{-6} \\times 2 / 10^{-3} = 1,2 \\times 10^{-3}$ m $= 1,2$ mm.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Đun nóng $2$ kg nước từ $30^\\circ$C lên $60^\\circ$C. Biết nhiệt dung riêng của nước $c = 4200$ J/(kg.K). Nhiệt lượng cần cung cấp bằng bao nhiêu kJ?", "answer": "252", "explain": "$Q = mc\\Delta t = 2 \\times 4200 \\times 30 = 252000$ J $= 252$ kJ.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một máy biến áp lí tưởng có số vòng dây cuộn sơ cấp $500$ vòng, cuộn thứ cấp $1000$ vòng. Đặt vào cuộn sơ cấp điện áp hiệu dụng $220$ V (cuộn thứ cấp để hở). Điện áp hiệu dụng ở hai đầu cuộn thứ cấp bằng bao nhiêu V?", "answer": "440", "explain": "$U_2/U_1 = N_2/N_1$, suy ra $U_2 = 220 \\times 1000/500 = 440$ V.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Chiếu ánh sáng có bước sóng $0,3\\ \\mu$m vào một kim loại có giới hạn quang điện $0,5\\ \\mu$m. Động năng ban đầu cực đại của các electron quang điện bằng bao nhiêu eV? (Cho $h = 6,625 \\times 10^{-34}$ J.s, $c = 3 \\times 10^8$ m/s, $1$ eV $= 1,6 \\times 10^{-19}$ J; làm tròn đến 2 chữ số thập phân)", "answer": "1,66", "explain": "$W_{đ\\max} = hc(1/\\lambda - 1/\\lambda_0) = 1,9875 \\times 10^{-25} \\times (1/0,3 - 1/0,5) \\times 10^6 = 2,65 \\times 10^{-19}$ J $= 1,656$ eV $\\approx 1,66$ eV.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một con lắc lò xo dao động điều hòa với cơ năng $0,08$ J; vật nặng có khối lượng $0,2$ kg, biên độ dao động $4$ cm. Tần số góc của dao động bằng bao nhiêu rad/s? (làm tròn đến 2 chữ số thập phân)", "answer": "22,36", "explain": "$W = \\frac{1}{2}m\\omega^2A^2$, suy ra $\\omega = \\sqrt{2W/(mA^2)} = \\sqrt{0,16/(0,2 \\times 0,0016)} = \\sqrt{500} \\approx 22,36$ rad/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ban đầu có $10$ g chất phóng xạ có chu kì bán rã $5$ ngày. Sau $15$ ngày, khối lượng chất phóng xạ còn lại bằng bao nhiêu g?", "answer": "1,25", "explain": "$m = m_0 \\times 2^{-t/T} = 10 \\times 2^{-3} = 10/8 = 1,25$ g.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Theo nguyên lí I của nhiệt động lực học, độ biến thiên nội năng $\\Delta U$ của hệ được xác định bởi", "options": ["A. $\\Delta U = A - Q$.", "B. $\\Delta U = A + Q$.", "C. $\\Delta U = Q - A$.", "D. $\\Delta U = A \times Q$."], "answer": "B", "explain": "Nguyên lí I: $\\Delta U = A + Q$, trong đó $A$ là công mà hệ nhận được, $Q$ là nhiệt lượng mà hệ nhận được.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Con lắc lò xo dao động điều hòa với tần số góc $\\omega$. Công thức nào sau đây đúng? ($k$ là độ cứng lò xo, $m$ là khối lượng vật)", "options": ["A. $\\omega = \\sqrt{m/k}$.", "B. $\\omega = 2\\pi\\sqrt{k/m}$.", "C. $\\omega = 2\\pi\\sqrt{m/k}$.", "D. $\\omega = \\sqrt{k/m}$."], "answer": "D", "explain": "Tần số góc của con lắc lò xo: $\\omega = \\sqrt{k/m}$; chu kì $T = 2\\pi\\sqrt{m/k}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng cơ lan truyền với tốc độ $v$, tần số $f$. Bước sóng $\\lambda$ được tính bởi công thức", "options": ["A. $\\lambda = v/f$.", "B. $\\lambda = vf$.", "C. $\\lambda = f/v$.", "D. $\\lambda = vT^2$."], "answer": "A", "explain": "$\\lambda = v/f = vT$: quãng đường sóng truyền được trong một chu kì.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dung kháng $Z_C$ của tụ điện có điện dung $C$ đối với dòng điện xoay chiều có tần số góc $\\omega$ là", "options": ["A. $Z_C = \\omega C$.", "B. $Z_C = \\omega/C$.", "C. $Z_C = 1/(\\omega C)$.", "D. $Z_C = C/\\omega$."], "answer": "C", "explain": "$Z_C = 1/(\\omega C) = 1/(2\\pi fC)$: tần số càng lớn, dung kháng càng nhỏ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ống dây dài có $n$ vòng dây trên mỗi mét chiều dài, dòng điện chạy qua có cường độ $I$. Cảm ứng từ bên trong lòng ống dây có độ lớn", "options": ["A. $B = 2\\pi \times 10^{-7}nI$.", "B. $B = 4\\pi \times 10^{-7}nI$.", "C. $B = 2 \times 10^{-7}I/r$.", "D. $B = 4\\pi \times 10^{-7}I/n$."], "answer": "B", "explain": "Cảm ứng từ trong lòng ống dây dài: $B = 4\\pi \\times 10^{-7}nI$ (đều và tỉ lệ với $n$, $I$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ánh sáng đơn sắc là ánh sáng", "options": ["A. luôn có màu đỏ.", "B. là hỗn hợp của bảy màu cầu vồng.", "C. có bước sóng thay đổi khi đi qua lăng kính.", "D. không bị tán sắc khi đi qua lăng kính."], "answer": "D", "explain": "Ánh sáng đơn sắc có một màu nhất định ứng với một bước sóng xác định, không bị tán sắc khi qua lăng kính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năng lượng $\\varepsilon$ của một photon ứng với bức xạ điện từ có tần số $f$ là", "options": ["A. $\u000barepsilon = hf$.", "B. $\u000barepsilon = h/f$.", "C. $\u000barepsilon = fc$.", "D. $\u000barepsilon = h\\lambda$."], "answer": "A", "explain": "Thuyết lượng tử: $\\varepsilon = hf = hc/\\lambda$ ($h$ là hằng số Planck).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các hạt nhân đồng vị là các hạt nhân có cùng", "options": ["A. số khối $A$.", "B. số neutron $N$.", "C. số proton $Z$ (cùng số hiệu nguyên tử).", "D. tổng số nuclon."], "answer": "C", "explain": "Đồng vị: cùng $Z$ (cùng nguyên tố hóa học), khác $A$ (khác số neutron).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vật dao động điều hòa với biên độ $5$ cm, tần số góc $4\\pi$ rad/s. Tốc độ cực đại của vật là", "options": ["A. $20$ cm/s.", "B. $20\\pi^2$ cm/s.", "C. $5\\pi$ cm/s.", "D. $20\\pi$ cm/s."], "answer": "D", "explain": "$v_{\\max} = A\\omega = 5 \\times 4\\pi = 20\\pi$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên sợi dây dài $60$ cm, hai đầu cố định, đang có sóng dừng với $3$ bó sóng. Bước sóng lan truyền trên dây là", "options": ["A. $20$ cm.", "B. $40$ cm.", "C. $30$ cm.", "D. $90$ cm."], "answer": "B", "explain": "Hai đầu cố định: $l = k\\lambda/2$ với $k = 3$, suy ra $\\lambda = 2l/3 = 40$ cm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cuộn cảm thuần có độ tự cảm $L = 0,5$ H. Đối với dòng điện xoay chiều có tần số $50$ Hz, cảm kháng của cuộn cảm là", "options": ["A. $Z_L = 50\\pi\\ \\Omega$ (xấp xỉ $157\\ \\Omega$).", "B. $Z_L = 25\\pi\\ \\Omega$.", "C. $Z_L = 100\\pi\\ \\Omega$.", "D. $Z_L = 0,5\\pi\\ \\Omega$."], "answer": "A", "explain": "$Z_L = \\omega L = 2\\pi fL = 100\\pi \\times 0,5 = 50\\pi\\ \\Omega$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dòng điện có cường độ $5$ A chạy trong dây dẫn thẳng dài. Cảm ứng từ tại điểm cách dây $10$ cm có độ lớn", "options": ["A. $2 \times 10^{-5}$ T.", "B. $5 \times 10^{-6}$ T.", "C. $10^{-5}$ T.", "D. $10^{-6}$ T."], "answer": "C", "explain": "$B = 2 \\times 10^{-7}I/r = 2 \\times 10^{-7} \\times 5/0,1 = 10^{-5}$ T.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một mol khí lí tưởng đựng trong bình kín có áp suất $2 \\times 10^5$ Pa, thể tích $0,01$ m$^3$. Nhiệt độ của khối khí bằng bao nhiêu? (Cho $R = 8,31$ J/(mol.K))", "options": ["A. $120$ K.", "B. $481$ K.", "C. $60$ K.", "D. $241$ K."], "answer": "D", "explain": "$pV = nRT$, suy ra $T = pV/(nR) = 2 \\times 10^5 \\times 0,01/8,31 \\approx 240,7$ K.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Độ hụt khối của một hạt nhân là $0,02$ u. Năng lượng liên kết của hạt nhân đó bằng bao nhiêu? (Cho $1$ u $= 931,5$ MeV/$c^2$)", "options": ["A. $46,575$ MeV.", "B. $18,63$ MeV.", "C. $1863$ MeV.", "D. $1,863$ MeV."], "answer": "B", "explain": "$W_{lk} = \\Delta m \\times c^2 = 0,02 \\times 931,5 = 18,63$ MeV.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đoạn mạch điện xoay chiều RLC nối tiếp có cuộn cảm $L = 1/\\pi$ H, dòng điện có tần số $50$ Hz. Để trong mạch xảy ra cộng hưởng điện, điện dung $C$ của tụ điện phải bằng", "options": ["A. $C = 100/\\pi\\ \\mu$F (xấp xỉ $31,8\\ \\mu$F).", "B. $C = 10/\\pi\\ \\mu$F.", "C. $C = 1/\\pi$ mF.", "D. $C = \\pi/100\\ \\mu$F."], "answer": "A", "explain": "Cộng hưởng: $Z_L = Z_C$; $Z_L = \\omega L = 100\\pi \\times (1/\\pi) = 100\\ \\Omega$; $C = 1/(\\omega Z_L) = 1/(100\\pi \\times 100) = 10^{-4}/\\pi$ F $= 100/\\pi\\ \\mu$F.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vật dao động điều hòa theo phương trình $x = 6\\cos(4\\pi t)$ (cm). Độ lớn vận tốc của vật khi vật có li độ $x = 3$ cm là", "options": ["A. $6\\pi\\sqrt{3}$ cm/s.", "B. $12\\pi$ cm/s.", "C. $12\\pi\\sqrt{3}$ cm/s.", "D. $24\\pi$ cm/s."], "answer": "C", "explain": "$|v| = \\omega\\sqrt{A^2 - x^2} = 4\\pi\\sqrt{36 - 9} = 4\\pi \\times 3\\sqrt{3} = 12\\pi\\sqrt{3}$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một lượng khí lí tưởng biến đổi đẳng tích: lúc đầu nhiệt độ $300$ K, áp suất $1,5$ atm. Khi nhiệt độ tăng lên $450$ K thì áp suất của khí là", "options": ["A. $1$ atm.", "B. $2,25$ atm.", "C. $3$ atm.", "D. $1,25$ atm."], "answer": "B", "explain": "Đẳng tích: $p_1/T_1 = p_2/T_2$, suy ra $p_2 = 1,5 \\times 450/300 = 2,25$ atm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong thí nghiệm giao thoa sóng trên mặt nước, hai nguồn kết hợp cùng pha đặt cách nhau $10$ cm, sóng có bước sóng $2$ cm. Số điểm dao động với biên độ cực đại trên đoạn thẳng nối hai nguồn là", "options": ["A. $11$ điểm.", "B. $10$ điểm.", "C. $8$ điểm.", "D. $9$ điểm."], "answer": "D", "explain": "Cực đại: $|d_2 - d_1| = k\\lambda \\lt 10$ cm, suy ra $|k| \\lt 5$; $k = -4, -3, \\dots, 4$: có $9$ điểm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một mạch dao động LC lí tưởng đang hoạt động.", "statements": ["a) Chu kì dao động riêng của mạch là $T = 2\\pi\\sqrt{LC}$.", "b) Tần số dao động riêng của mạch chỉ phụ thuộc vào $L$ và $C$.", "c) Năng lượng điện từ trong mạch được bảo toàn (không đổi) theo thời gian.", "d) Điện tích trên tụ biến thiên điều hòa với tần số gấp đôi tần số của dòng điện trong mạch."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: công thức Thomson. b) Đúng: $f = 1/(2\\pi\\sqrt{LC})$. c) Đúng: mạch lí tưởng không tỏa nhiệt. d) Sai: $q$ và $i$ biến thiên cùng tần số (vuông pha nhau).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét sóng âm truyền trong không khí ở điều kiện thường.", "statements": ["a) Sóng âm truyền trong không khí là sóng dọc.", "b) Tai người có thể nghe được âm có tần số từ $16$ Hz đến $20000$ Hz.", "c) Âm có tần số lớn hơn $20000$ Hz được gọi là hạ âm.", "d) Tốc độ truyền âm trong không khí lớn hơn tốc độ truyền âm trong thép."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: sóng âm trong chất khí là sóng dọc. b) Đúng: ngưỡng nghe của tai người. c) Sai: đó là siêu âm; hạ âm có $f \\lt 16$ Hz. d) Sai: âm truyền nhanh hơn trong chất rắn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Đoạn mạch điện xoay chiều RLC nối tiếp có $R = 40\\ \\Omega$, điện áp hiệu dụng hai đầu mạch $U = 200$ V, cường độ dòng điện hiệu dụng $I = 4$ A.", "statements": ["a) Công suất tiêu thụ của mạch là $640$ W.", "b) Hệ số công suất của mạch bằng $0,8$.", "c) Điện áp hiệu dụng giữa hai đầu điện trở là $160$ V.", "d) Tổng trở của mạch bằng $40\\ \\Omega$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $P = I^2R = 16 \\times 40 = 640$ W. b) Đúng: $\\cos\\varphi = P/(UI) = 640/800 = 0,8$. c) Đúng: $U_R = IR = 160$ V. d) Sai: $Z = U/I = 50\\ \\Omega$.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Trong thí nghiệm Young về giao thoa ánh sáng đơn sắc.", "statements": ["a) Khoảng vân được tính bởi công thức $i = \\lambda D/a$.", "b) Vân sáng là những vị trí hai sóng tới cùng pha, tăng cường lẫn nhau.", "c) Tại vị trí vân sáng bậc một, hiệu đường đi của hai sóng tới bằng $\\lambda/2$.", "d) Nếu dùng ánh sáng có bước sóng lớn hơn thì khoảng vân quan sát được lớn hơn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: giao thoa tăng cường. c) Sai: hiệu đường đi bằng $k\\lambda$, vân sáng bậc một ứng với hiệu đường đi bằng $\\lambda$. d) Đúng: $i \\propto \\lambda$.", "points": 1}, {"type": "short", "level": "TH", "q": "Mạch dao động LC có độ tự cảm $L = 1$ mH, điện dung $C = 4\\ \\mu$F. Tần số dao động riêng của mạch bằng bao nhiêu Hz? (làm tròn đến hàng đơn vị; lấy $\\pi = 3,14$)", "answer": "2516", "explain": "$f = 1/(2\\pi\\sqrt{LC}) = 1/(2\\pi\\sqrt{4 \\times 10^{-9}}) = 1/(2\\pi \\times 6,32 \\times 10^{-5}) \\approx 2516$ Hz.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Một khung dây phẳng có diện tích $0,05$ m$^2$ đặt trong từ trường đều $B = 0,2$ T sao cho vectơ pháp tuyến của mặt khung cùng hướng với vectơ cảm ứng từ. Từ thông qua khung dây bằng bao nhiêu Wb?", "answer": "0,01", "explain": "$\\Phi = BS\\cos0^\\circ = 0,2 \\times 0,05 = 0,01$ Wb.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một động cơ nhiệt nhận nhiệt lượng $500$ J từ nguồn nóng và sinh công $120$ J trong một chu trình. Hiệu suất của động cơ bằng bao nhiêu %?", "answer": "24", "explain": "$H = A/Q_1 = 120/500 = 0,24 = 24\\%$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Electron trong nguyên tử hydro đang ở mức năng lượng $E_2 = -3,4$ eV chuyển về mức $E_1 = -13,6$ eV và phát ra một photon. Bước sóng của photon này bằng bao nhiêu $\\mu$m? (Cho $hc = 1240$ eV.nm; làm tròn đến 3 chữ số thập phân)", "answer": "0,122", "explain": "$\\Delta E = 10,2$ eV; $\\lambda = hc/\\Delta E = 1240/10,2 = 121,57$ nm $= 0,1216\\ \\mu$m $\\approx 0,122\\ \\mu$m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Truyền tải điện năng với công suất $100$ kW; điện áp hiệu dụng nơi phát là $10$ kV, hệ số công suất bằng $1$, điện trở của đường dây tải điện là $10\\ \\Omega$. Công suất hao phí trên đường dây bằng bao nhiêu W?", "answer": "1000", "explain": "$\\Delta P = R \\times P^2/(U^2\\cos^2\\varphi) = 10 \\times (10^5)^2/(10^4)^2 = 1000$ W.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = 3\\cos(\\omega t)$ (cm), $x_2 = 4\\cos(\\omega t + \\pi/2)$ (cm). Biên độ của dao động tổng hợp bằng bao nhiêu cm?", "answer": "5", "explain": "Hai dao động vuông pha nhau nên $A = \\sqrt{A_1^2 + A_2^2} = \\sqrt{9 + 16} = 5$ cm.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Chu kì dao động $T$ của một vật dao động điều hòa là", "options": ["A. số dao động mà vật thực hiện được trong một giây.", "B. thời gian để vật đi từ vị trí biên này đến vị trí biên kia.", "C. khoảng thời gian ngắn nhất để vật lặp lại trạng thái dao động như cũ.", "D. quãng đường mà vật đi được trong một giây."], "answer": "C", "explain": "Chu kì là khoảng thời gian ngắn nhất để vật lặp lại một trạng thái dao động (vị trí và chiều chuyển động như cũ).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng ngang là sóng có phương dao động của các phần tử môi trường", "options": ["A. vuông góc với phương truyền sóng.", "B. trùng với phương truyền sóng.", "C. hợp với phương truyền sóng một góc $30^\\circ$.", "D. luôn nằm ngang."], "answer": "A", "explain": "Định nghĩa: sóng ngang có phương dao động vuông góc với phương truyền sóng (ví dụ sóng trên mặt nước).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Máy biến áp là thiết bị dùng để", "options": ["A. biến đổi tần số của dòng điện xoay chiều.", "B. biến đổi điện áp của dòng điện một chiều.", "C. biến đổi công suất của dòng điện xoay chiều.", "D. biến đổi điện áp hiệu dụng của dòng điện xoay chiều."], "answer": "D", "explain": "Máy biến áp dùng để tăng hoặc giảm điện áp hiệu dụng của dòng điện xoay chiều (không làm thay đổi tần số).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong chân không, sóng điện từ có tần số $f$ thì bước sóng $\\lambda$ được tính bởi", "options": ["A. $\\lambda = f/c$.", "B. $\\lambda = c/f$.", "C. $\\lambda = cf$.", "D. $\\lambda = c/f^2$."], "answer": "B", "explain": "$\\lambda = c/f$ với $c = 3 \\times 10^8$ m/s là tốc độ ánh sáng trong chân không.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong thí nghiệm Young về giao thoa ánh sáng, khoảng vân $i$ được tính bởi công thức", "options": ["A. $i = aD/\\lambda$.", "B. $i = \\lambda a/D$.", "C. $i = \\lambda D/a$.", "D. $i = D/(a\\lambda)$."], "answer": "C", "explain": "$i = \\lambda D/a$: $a$ là khoảng cách hai khe, $D$ là khoảng cách từ hai khe đến màn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện tượng quang điện ngoài là hiện tượng", "options": ["A. các electron bật ra khỏi bề mặt kim loại khi được chiếu sáng có bước sóng thích hợp.", "B. các electron bật ra khỏi kim loại khi bị nung nóng đến nhiệt độ cao.", "C. các electron chuyển động nhanh dần trong điện trường mạnh.", "D. kim loại phát sáng khi có dòng điện chạy qua."], "answer": "A", "explain": "Quang điện ngoài: ánh sáng thích hợp ($\\lambda \\le \\lambda_0$) làm bật electron khỏi bề mặt kim loại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tia $\\alpha$ là dòng các hạt nhân", "options": ["A. $^{1}_{1}H$.", "B. $^{2}_{1}H$.", "C. neutron.", "D. $^{4}_{2}He$."], "answer": "D", "explain": "Tia $\\alpha$ là dòng hạt nhân $^{4}_{2}He$ (2 proton + 2 neutron), có khả năng đâm xuyên yếu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một lượng khí lí tưởng thực hiện quá trình đẳng nhiệt. Đại lượng nào sau đây không đổi trong quá trình đó?", "options": ["A. Áp suất của khí.", "B. Tích $pV$.", "C. Thể tích của khí.", "D. Mật độ phân tử khí."], "answer": "B", "explain": "Đẳng nhiệt: $T$ không đổi nên theo định luật Boyle, $pV =$ hằng số.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đoạn dây dẫn thẳng dài mang dòng điện $4$ A đặt vuông góc với các đường sức của từ trường đều $B = 0,3$ T. Lực từ tác dụng lên mỗi mét chiều dài dây là", "options": ["A. $0,3$ N/m.", "B. $0,6$ N/m.", "C. $1,2$ N/m.", "D. $2,4$ N/m."], "answer": "C", "explain": "Dây vuông góc với $\\vec{B}$ ($\\sin\\alpha = 1$): $F/l = BI = 0,3 \\times 4 = 1,2$ N/m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Con lắc đơn có chiều dài $0,25$ m, dao động nhỏ tại nơi có gia tốc trọng trường $g = 10$ m/s$^2$. Chu kì dao động của con lắc là", "options": ["A. xấp xỉ $1$ s.", "B. xấp xỉ $2$ s.", "C. xấp xỉ $0,5$ s.", "D. $\\pi$ s."], "answer": "A", "explain": "$T = 2\\pi\\sqrt{l/g} = 2\\pi\\sqrt{0,025} = 2\\pi \\times 0,158 \\approx 0,99$ s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sóng cơ có phương trình $u = 5\\cos(20\\pi t - 2\\pi x)$ ($u$ tính bằng cm, $x$ tính bằng m). Tại thời điểm $t = 0$, phần tử môi trường tại vị trí $x = 0,25$ m có li độ", "options": ["A. $5$ cm.", "B. $-5$ cm.", "C. $2,5\\sqrt{2}$ cm.", "D. $0$ cm."], "answer": "D", "explain": "Tại $t = 0$, $x = 0,25$ m: pha $= -2\\pi \\times 0,25 = -\\pi/2$, $u = 5\\cos(-\\pi/2) = 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặt điện áp xoay chiều vào hai đầu một cuộn cảm thuần. Phát biểu nào sau đây đúng?", "options": ["A. Điện áp trễ pha $\\pi/2$ so với cường độ dòng điện.", "B. Điện áp sớm pha $\\pi/2$ so với cường độ dòng điện.", "C. Điện áp cùng pha với cường độ dòng điện.", "D. Điện áp ngược pha với cường độ dòng điện."], "answer": "B", "explain": "Trong mạch chỉ có cuộn cảm thuần, điện áp sớm pha $\\pi/2$ so với cường độ dòng điện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một hệ nhiệt động nhận nhiệt lượng $200$ J từ bên ngoài và sinh công $50$ J ra bên ngoài. Độ biến thiên nội năng của hệ là", "options": ["A. $250$ J.", "B. $-150$ J.", "C. $150$ J.", "D. $-250$ J."], "answer": "C", "explain": "Quy ước: hệ nhận công $A$, nhận nhiệt $Q$. Hệ sinh công nên $A = -50$ J; $Q = 200$ J; $\\Delta U = A + Q = 150$ J.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạt nhân $^{27}_{13}Al$ có số proton là", "options": ["A. $13$.", "B. $27$.", "C. $14$.", "D. $40$."], "answer": "A", "explain": "Số hiệu nguyên tử $Z = 13$ chính là số proton trong hạt nhân.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vật nặng $0,1$ kg dao động điều hòa với biên độ $5$ cm, tần số góc $10$ rad/s. Cơ năng dao động của vật là", "options": ["A. $0,125$ J.", "B. $0,025$ J.", "C. $0,05$ J.", "D. $0,0125$ J."], "answer": "D", "explain": "$W = \\frac{1}{2}m\\omega^2A^2 = 0,5 \\times 0,1 \\times 100 \\times 0,0025 = 0,0125$ J.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đoạn mạch RLC nối tiếp đang hoạt động: điện áp hiệu dụng giữa hai đầu điện trở $U_R = 30$ V, giữa hai đầu cuộn cảm $U_L = 80$ V, giữa hai đầu tụ điện $U_C = 40$ V. Điện áp hiệu dụng giữa hai đầu đoạn mạch là", "options": ["A. $150$ V.", "B. $50$ V.", "C. $90$ V.", "D. $70$ V."], "answer": "B", "explain": "$U = \\sqrt{U_R^2 + (U_L - U_C)^2} = \\sqrt{30^2 + 40^2} = 50$ V.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cường độ âm tại một điểm là $10^{-6}$ W/m$^2$. Mức cường độ âm tại điểm đó bằng bao nhiêu? (Cho cường độ âm chuẩn $I_0 = 10^{-12}$ W/m$^2$)", "options": ["A. $6$ B.", "B. $60$ B.", "C. $60$ dB.", "D. $6$ dB."], "answer": "C", "explain": "$L = 10\\log(I/I_0) = 10\\log(10^{-6}/10^{-12}) = 10 \\times 6 = 60$ dB.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Con lắc lò xo treo thẳng đứng: khi treo vật ở vị trí cân bằng, lò xo giãn $4$ cm. Kích thích cho vật dao động điều hòa theo phương thẳng đứng. Tần số dao động của con lắc bằng bao nhiêu? (Cho $g = 10$ m/s$^2$)", "options": ["A. xấp xỉ $2,5$ Hz.", "B. xấp xỉ $5$ Hz.", "C. xấp xỉ $1,25$ Hz.", "D. xấp xỉ $0,4$ Hz."], "answer": "A", "explain": "$\\omega = \\sqrt{g/\\Delta l_0} = \\sqrt{10/0,04} = \\sqrt{250} \\approx 15,81$ rad/s; $f = \\omega/(2\\pi) \\approx 2,52$ Hz.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét mẫu nguyên tử Bohr của nguyên tử hydro.", "statements": ["a) Electron chuyển động trên các quỹ đạo dừng có bán kính tỉ lệ với $n^2$.", "b) Khi electron chuyển từ quỹ đạo dừng có năng lượng cao về quỹ đạo có năng lượng thấp hơn, nguyên tử phát ra một photon.", "c) Bán kính quỹ đạo dừng thứ hai gấp $2$ lần bán kính quỹ đạo dừng thứ nhất.", "d) Năng lượng của electron trên quỹ đạo dừng tỉ lệ nghịch với $n^2$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $r_n = n^2r_0$. b) Đúng: $E_{cao} - E_{thấp} = hf$. c) Sai: $r_2 = 4r_0 = 4r_1$. d) Đúng: $E_n = -13,6/n^2$ eV.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một lượng khí lí tưởng biến đổi trạng thái.", "statements": ["a) Phương trình trạng thái của khí lí tưởng là $pV = nRT$.", "b) Trong quá trình đẳng áp, thể tích của khí tỉ lệ thuận với nhiệt độ tuyệt đối.", "c) Trong quá trình đẳng tích, áp suất của khí tỉ lệ nghịch với nhiệt độ tuyệt đối.", "d) Trong quá trình đẳng nhiệt, nhiệt độ của khối khí không đổi."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: định luật Charles $V/T =$ hằng số. c) Sai: đẳng tích thì $p \\propto T$ (tỉ lệ thuận). d) Đúng theo định nghĩa.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một vật dao động tắt dần trong môi trường có lực cản.", "statements": ["a) Biên độ dao động của vật giảm dần theo thời gian.", "b) Cơ năng của dao động được bảo toàn trong quá trình tắt dần.", "c) Nguyên nhân gây tắt dần là ma sát và lực cản của môi trường.", "d) Nếu cung cấp năng lượng bù đắp sau mỗi chu kì, vật có thể thực hiện dao động duy trì với biên độ không đổi."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: một phần cơ năng chuyển thành nhiệt do ma sát. c) Đúng. d) Đúng: đó là nguyên tắc của dao động duy trì.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét dòng điện xoay chiều có biểu thức $i = I_0\\cos(\\omega t + \\varphi)$.", "statements": ["a) $I_0$ là cường độ dòng điện cực đại.", "b) Giá trị hiệu dụng của dòng điện là $I = I_0/\\sqrt{2}$.", "c) $\\omega$ là tần số góc của dòng điện, đơn vị là rad/s.", "d) $\u000barphi$ là pha ban đầu của dòng điện, đơn vị là Hz."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo định nghĩa. d) Sai: pha ban đầu $\\varphi$ có đơn vị là rad.", "points": 1}, {"type": "short", "level": "TH", "q": "Sóng âm truyền trong không khí với tốc độ $340$ m/s, tần số $440$ Hz. Bước sóng của sóng âm này bằng bao nhiêu m? (làm tròn đến 2 chữ số thập phân)", "answer": "0,77", "explain": "$\\lambda = v/f = 340/440 \\approx 0,7727$ m $\\approx 0,77$ m.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trong thí nghiệm Young về giao thoa ánh sáng, khoảng vân đo được là $1,2$ mm. Vị trí vân sáng bậc $2$ cách vân sáng trung tâm bao nhiêu mm?", "answer": "2,4", "explain": "$x_{s2} = 2i = 2 \\times 1,2 = 2,4$ mm.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Mạch dao động LC lí tưởng có độ tự cảm $L = 0,2$ H, cường độ dòng điện cực đại trong mạch $I_0 = 0,5$ A. Năng lượng điện từ của mạch bằng bao nhiêu J?", "answer": "0,025", "explain": "$W = \\frac{1}{2}LI_0^2 = 0,5 \\times 0,2 \\times 0,25 = 0,025$ J.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Từ thông qua một khung dây dẫn biến thiên từ $0,06$ Wb xuống còn $0,02$ Wb trong thời gian $0,02$ s. Độ lớn suất điện động cảm ứng xuất hiện trong khung bằng bao nhiêu V?", "answer": "2", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = 0,04/0,02 = 2$ V.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đun $1,5$ kg nước từ $20^\\circ$C đến sôi ($100^\\circ$C). Biết nhiệt dung riêng của nước là $4200$ J/(kg.K) và bỏ qua mọi hao phí. Nhiệt lượng cần cung cấp bằng bao nhiêu J?", "answer": "504000", "explain": "$Q = mc\\Delta t = 1,5 \\times 4200 \\times 80 = 504000$ J.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đoạn mạch điện xoay chiều RLC nối tiếp có điện trở $R = 40\\ \\Omega$, cường độ dòng điện hiệu dụng trong mạch $I = 4$ A. Công suất tiêu thụ của mạch bằng bao nhiêu W?", "answer": "640", "explain": "Công suất chỉ tiêu thụ trên $R$: $P = I^2R = 16 \\times 40 = 640$ W.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Đại lượng đặc trưng cho sự nhanh, chậm của dao động, được tính bằng số dao động toàn phần mà vật thực hiện được trong một giây là", "options": ["A. biên độ dao động.", "B. chu kì dao động.", "C. pha dao động.", "D. tần số dao động."], "answer": "D", "explain": "Tần số $f$ là số dao động toàn phần thực hiện trong một giây, đơn vị Hz; $f = 1/T$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điện áp xoay chiều có biểu thức $u = U_0\\cos(\\omega t)$. Giá trị hiệu dụng của điện áp này là", "options": ["A. $U_0$.", "B. $U = U_0/\\sqrt{2}$.", "C. $U_0/2$.", "D. $2U_0$."], "answer": "B", "explain": "Giá trị hiệu dụng bằng giá trị cực đại chia $\\sqrt{2}$: $U = U_0/\\sqrt{2}$, $I = I_0/\\sqrt{2}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điện từ trường là", "options": ["A. điện trường tĩnh bao quanh điện tích đứng yên.", "B. từ trường tĩnh bao quanh nam châm vĩnh cửu.", "C. trường có điện trường biến thiên và từ trường biến thiên liên hệ mật thiết với nhau.", "D. trường hấp dẫn giữa các vật có khối lượng."], "answer": "C", "explain": "Điện từ trường gồm điện trường biến thiên và từ trường biến thiên luôn liên hệ với nhau, lan truyền trong không gian thành sóng điện từ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quang phổ liên tục là", "options": ["A. một dải sáng có màu biến thiên liên tục từ đỏ đến tím.", "B. hệ thống các vạch màu riêng lẻ trên nền tối.", "C. các vạch tối trên nền của quang phổ liên tục.", "D. một vạch sáng trắng duy nhất."], "answer": "A", "explain": "Quang phổ liên tục do các vật rắn, lỏng, khí ở áp suất lớn bị nung nóng phát ra; là dải màu biến thiên liên tục.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quang phổ vạch phát xạ là", "options": ["A. một dải sáng có màu biến thiên liên tục.", "B. các vạch tối trên nền của quang phổ liên tục.", "C. một vạch sáng trắng duy nhất.", "D. hệ thống các vạch màu riêng lẻ trên một nền tối."], "answer": "D", "explain": "Quang phổ vạch phát xạ do chất khí ở áp suất thấp bị nung nóng (hoặc phóng điện) phát ra; mỗi nguyên tố có quang phổ vạch đặc trưng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng hạt nhân là", "options": ["A. quá trình biến đổi hóa học của các chất.", "B. quá trình tương tác giữa các hạt nhân dẫn đến sự biến đổi hạt nhân thành các hạt nhân khác.", "C. quá trình phóng xạ tự phát của hạt nhân.", "D. quá trình nguyên tử mất hoặc nhận thêm electron."], "answer": "B", "explain": "Phản ứng hạt nhân là mọi quá trình dẫn đến sự biến đổi hạt nhân (kể cả phóng xạ), tuân theo các định luật bảo toàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiệt lượng là", "options": ["A. tổng động năng của các phân tử cấu tạo nên vật.", "B. cơ năng của vật so với mặt đất.", "C. số đo độ biến thiên nội năng của vật trong quá trình truyền nhiệt.", "D. nhiệt độ của vật đo bằng nhiệt kế."], "answer": "C", "explain": "Nhiệt lượng $Q$ là số đo độ biến thiên nội năng trong quá trình truyền nhiệt; đơn vị là jun (J).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dao động tắt dần là dao động có", "options": ["A. biên độ giảm dần theo thời gian.", "B. biên độ tăng dần theo thời gian.", "C. tần số giảm dần theo thời gian.", "D. chu kì tăng dần theo thời gian."], "answer": "A", "explain": "Dao động tắt dần: biên độ (và cơ năng) giảm dần theo thời gian do ma sát, lực cản môi trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sóng cơ lan truyền trên một phương; hai điểm $M$, $N$ trên phương truyền sóng cách nguồn lần lượt $5$ cm và $11$ cm. Biết bước sóng là $3$ cm. Hai điểm $M$ và $N$ dao động", "options": ["A. ngược pha nhau.", "B. vuông pha nhau.", "C. lệch pha nhau $\\pi/3$.", "D. cùng pha nhau."], "answer": "D", "explain": "Hiệu khoảng cách đến nguồn: $11 - 5 = 6$ cm $= 2\\lambda$ nên $M$, $N$ dao động cùng pha.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đoạn mạch điện xoay chiều RLC nối tiếp có $R = 30\\ \\Omega$, $Z_L - Z_C = 40\\ \\Omega$. Tổng trở của đoạn mạch là", "options": ["A. $70\\ \\Omega$.", "B. $50\\ \\Omega$.", "C. $10\\ \\Omega$.", "D. $20\\ \\Omega$."], "answer": "B", "explain": "$Z = \\sqrt{R^2 + (Z_L - Z_C)^2} = \\sqrt{30^2 + 40^2} = 50\\ \\Omega$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sóng điện từ có tần số $100$ MHz truyền trong chân không có bước sóng là", "options": ["A. $300$ m.", "B. $30$ m.", "C. $3$ m.", "D. $0,3$ m."], "answer": "C", "explain": "$\\lambda = c/f = 3 \\times 10^8/10^8 = 3$ m (sóng cực ngắn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vòng dây tròn bán kính $5$ cm có dòng điện $2$ A chạy qua. Cảm ứng từ tại tâm của vòng dây có độ lớn", "options": ["A. $8\\pi \times 10^{-6}$ T (xấp xỉ $2,5 \times 10^{-5}$ T).", "B. $4\\pi \times 10^{-6}$ T.", "C. $2\\pi \times 10^{-6}$ T.", "D. $\\pi \times 10^{-6}$ T."], "answer": "A", "explain": "$B = 2\\pi \\times 10^{-7}I/R = 2\\pi \\times 10^{-7} \\times 2/0,05 = 8\\pi \\times 10^{-6}$ T.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhiệt độ $27^\\circ$C ứng với nhiệt độ bao nhiêu kelvin?", "options": ["A. $27$ K.", "B. $273$ K.", "C. $300$ K.", "D. $250$ K."], "answer": "C", "explain": "$T(K) = t(^\\circ C) + 273 = 27 + 273 = 300$ K.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Con lắc đơn có chiều dài $1$ m, dao động nhỏ tại nơi có gia tốc trọng trường $g = \\pi^2$ m/s$^2$. Tần số dao động của con lắc là", "options": ["A. $1$ Hz.", "B. $0,5$ Hz.", "C. $2$ Hz.", "D. $\\pi$ Hz."], "answer": "B", "explain": "$T = 2\\pi\\sqrt{l/g} = 2\\pi\\sqrt{1/\\pi^2} = 2$ s; $f = 1/T = 0,5$ Hz.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trên sợi dây dài $75$ cm, một đầu cố định, một đầu tự do, đang có sóng dừng với $2$ bó sóng nguyên. Bước sóng lan truyền trên dây là", "options": ["A. $30$ cm.", "B. $50$ cm.", "C. $60$ cm.", "D. $75$ cm."], "answer": "C", "explain": "Một đầu cố định, một đầu tự do: $l = (2k+1)\\lambda/4$ với $k = 2$, suy ra $\\lambda = 4l/5 = 60$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đoạn mạch điện xoay chiều chỉ có điện trở $R = 25\\ \\Omega$, cường độ dòng điện hiệu dụng $I = 2$ A. Công suất tiêu thụ của đoạn mạch là", "options": ["A. $100$ W.", "B. $50$ W.", "C. $200$ W.", "D. $25$ W."], "answer": "A", "explain": "$P = I^2R = 4 \\times 25 = 100$ W (toàn bộ công suất tiêu thụ trên điện trở).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vật dao động điều hòa với biên độ $6$ cm, tần số góc $2\\pi$ rad/s. Độ lớn gia tốc của vật khi vật có li độ $3$ cm là", "options": ["A. $6\\pi^2$ cm/s$^2$.", "B. $12\\pi^2$ cm/s$^2$.", "C. $24\\pi^2$ cm/s$^2$.", "D. $3\\pi^2$ cm/s$^2$."], "answer": "B", "explain": "$|a| = \\omega^2|x| = (2\\pi)^2 \\times 3 = 12\\pi^2$ cm/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biết khối lượng của proton $m_p = 1,0073$ u, của neutron $m_n = 1,0087$ u, của hạt nhân $^{4}_{2}He$ là $m_{He} = 4,0015$ u. Độ hụt khối của hạt nhân $^{4}_{2}He$ là", "options": ["A. $0,0030$ u.", "B. $0,305$ u.", "C. $0,0082$ u.", "D. $0,0305$ u."], "answer": "D", "explain": "$\\Delta m = Zm_p + (A-Z)m_n - m_{He} = 2 \\times 1,0073 + 2 \\times 1,0087 - 4,0015 = 0,0305$ u.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật dao động điều hòa (bỏ qua mọi ma sát).", "statements": ["a) Cơ năng của vật tỉ lệ với bình phương của biên độ dao động.", "b) Động năng của vật đạt cực đại tại vị trí biên.", "c) Thế năng của vật đạt cực đại tại vị trí cân bằng.", "d) Cơ năng của vật được bảo toàn trong quá trình dao động."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: $W = \\frac{1}{2}m\\omega^2A^2$. b) Sai: $W_đ$ cực đại tại vị trí cân bằng. c) Sai: $W_t$ cực đại tại vị trí biên. d) Đúng: không có ma sát nên $W$ bảo toàn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một đoạn dây dẫn mang dòng điện đặt trong từ trường đều.", "statements": ["a) Lực từ tác dụng lên đoạn dây có phương vuông góc với cả đoạn dây và vectơ cảm ứng từ.", "b) Lực từ đạt cực đại khi đoạn dây song song với các đường sức từ.", "c) Chiều của lực từ được xác định bằng quy tắc bàn tay trái.", "d) Độ lớn của lực từ không phụ thuộc vào cường độ dòng điện qua dây."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: $F_{\\max}$ khi dây vuông góc đường sức ($\\sin\\alpha = 1$). c) Đúng. d) Sai: $F = BIl\\sin\\alpha \\propto I$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một khối khí lí tưởng thực hiện quá trình đẳng áp: thể tích tăng từ $2$ L lên $5$ L, áp suất của khí là $10^5$ Pa.", "statements": ["a) Công mà khối khí sinh ra là $300$ J.", "b) Trong quá trình này, khối khí nhận nhiệt lượng từ bên ngoài.", "c) Nội năng của khối khí giảm vì khí đã sinh công.", "d) Nhiệt độ của khối khí tăng lên trong quá trình này."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $A' = p\\Delta V = 10^5 \\times 3 \\times 10^{-3} = 300$ J. b) Đúng: giãn đẳng áp thì $Q \\gt 0$. c) Sai: $V$ tăng, $T$ tăng nên $\\Delta U \\gt 0$. d) Đúng: đẳng áp $V \\propto T$.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét hiện tượng phóng xạ của một chất phóng xạ.", "statements": ["a) Phóng xạ là quá trình tự phát, không phụ thuộc vào các tác động bên ngoài.", "b) Chu kì bán rã là thời gian để một nửa số hạt nhân ban đầu bị phân rã.", "c) Sau mỗi chu kì bán rã, khối lượng chất phóng xạ còn lại giảm đi một nửa.", "d) Tia $\\gamma$ là dòng các hạt có khối lượng và mang điện tích."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo định nghĩa. d) Sai: tia $\\gamma$ là sóng điện từ (photon năng lượng cao), không mang điện.", "points": 1}, {"type": "short", "level": "TH", "q": "Đặt điện áp hiệu dụng $U = 100$ V vào hai đầu đoạn mạch điện xoay chiều có tổng trở $Z = 50\\ \\Omega$. Cường độ dòng điện hiệu dụng trong mạch bằng bao nhiêu A?", "answer": "2", "explain": "$I = U/Z = 100/50 = 2$ A.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Vật có khối lượng $0,2$ kg đang chuyển động với tốc độ $3$ m/s. Động năng của vật bằng bao nhiêu J?", "answer": "0,9", "explain": "$W_đ = \\frac{1}{2}mv^2 = 0,5 \\times 0,2 \\times 9 = 0,9$ J.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong thí nghiệm giao thoa sóng trên mặt nước, hai nguồn kết hợp cùng pha đặt cách nhau $20$ cm, sóng có bước sóng $4$ cm. Số điểm dao động với biên độ cực tiểu trên đoạn thẳng nối hai nguồn bằng bao nhiêu?", "answer": "10", "explain": "Cực tiểu: $|d_2 - d_1| = (k + 0,5)\\lambda \\lt 20$ cm, suy ra $|k + 0,5| \\lt 5$; $k = -5, -4, \\dots, 4$: có $10$ điểm.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong thí nghiệm Young về giao thoa ánh sáng: khoảng cách hai khe $a = 1$ mm, khoảng cách từ hai khe đến màn $D = 1,5$ m, bước sóng $\\lambda = 0,5\\ \\mu$m. Khoảng vân trên màn bằng bao nhiêu mm?", "answer": "0,75", "explain": "$i = \\lambda D/a = 0,5 \\times 10^{-6} \\times 1,5/10^{-3} = 0,75 \\times 10^{-3}$ m $= 0,75$ mm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Các electron quang điện có động năng ban đầu cực đại là $2$ eV. Hiệu điện thế hãm cần đặt vào để triệt tiêu hoàn toàn dòng quang điện bằng bao nhiêu V?", "answer": "2", "explain": "$eU_h = W_{đ\\max}$, suy ra $U_h = 2$ V.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cần cung cấp nhiệt lượng $1,67 \\times 10^5$ J để làm nóng chảy hoàn toàn một khối nước đá đang ở $0^\\circ$C. Biết nhiệt nóng chảy riêng của nước đá là $3,34 \\times 10^5$ J/kg. Khối lượng của khối nước đá bằng bao nhiêu kg?", "answer": "0,5", "explain": "$Q = \\lambda m$, suy ra $m = Q/\\lambda = 1,67 \\times 10^5/(3,34 \\times 10^5) = 0,5$ kg.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Hiện tượng cộng hưởng điện xảy ra trong đoạn mạch RLC nối tiếp khi", "options": ["A. cảm kháng của cuộn cảm bằng dung kháng của tụ điện.", "B. cảm kháng lớn hơn dung kháng của tụ điện.", "C. điện trở thuần của mạch bằng không.", "D. tần số của dòng điện bằng không."], "answer": "A", "explain": "Cộng hưởng điện xảy ra khi $Z_L = Z_C$ (hay $\\omega L = 1/(\\omega C)$): tổng trở cực tiểu, dòng điện cực đại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng điện từ", "options": ["A. không truyền được trong chân không.", "B. là sóng dọc.", "C. không mang năng lượng.", "D. là sóng ngang và truyền được trong chân không."], "answer": "D", "explain": "Sóng điện từ là sóng ngang ($\\vec{E}$, $\\vec{B}$ vuông góc phương truyền), truyền được trong chân không với tốc độ $c$ và mang năng lượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tia hồng ngoại là", "options": ["A. ánh sáng có màu đỏ.", "B. bức xạ không nhìn thấy được, có bước sóng lớn hơn bước sóng của ánh sáng đỏ.", "C. bức xạ có bước sóng nhỏ hơn bước sóng của tia tử ngoại.", "D. chùm hạt mang điện tích dương."], "answer": "B", "explain": "Tia hồng ngoại: bức xạ không nhìn thấy, $\\lambda$ từ $0,76\\ \\mu$m đến khoảng $1$ mm (lớn hơn ánh sáng đỏ, nhỏ hơn sóng vô tuyến).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tia X (tia Rơn-ghen) có bản chất là", "options": ["A. dòng các electron chuyển động nhanh.", "B. dòng các proton chuyển động nhanh.", "C. sóng điện từ có bước sóng rất ngắn.", "D. dòng các neutron."], "answer": "C", "explain": "Tia X là sóng điện từ có bước sóng từ $10^{-11}$ m đến $10^{-8}$ m, có khả năng đâm xuyên mạnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năng lượng liên kết của một hạt nhân là", "options": ["A. năng lượng tối thiểu cần thiết để tách hạt nhân thành các nuclon riêng lẻ.", "B. tổng động năng của các nuclon trong hạt nhân.", "C. năng lượng của photon do hạt nhân phát ra.", "D. nhiệt lượng tỏa ra khi hạt nhân phân rã."], "answer": "A", "explain": "$W_{lk} = \\Delta m \\times c^2$: năng lượng liên kết càng lớn, hạt nhân càng bền vững.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sự nóng chảy là quá trình", "options": ["A. chất lỏng chuyển thành hơi.", "B. hơi ngưng tụ thành chất lỏng.", "C. chất lỏng chuyển thành chất rắn.", "D. chất rắn chuyển thành chất lỏng khi được cung cấp nhiệt."], "answer": "D", "explain": "Nóng chảy: chất rắn nhận nhiệt để chuyển thành chất lỏng (xảy ra ở nhiệt độ nóng chảy xác định với chất rắn kết tinh).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện tượng cảm ứng điện từ là hiện tượng", "options": ["A. dòng điện sinh ra từ trường xung quanh nó.", "B. xuất hiện dòng điện cảm ứng trong mạch kín khi từ thông qua mạch biến thiên.", "C. nam châm hút các vật bằng sắt.", "D. dây dẫn nóng lên khi có dòng điện chạy qua."], "answer": "B", "explain": "Cảm ứng điện từ: từ thông qua mạch kín biến thiên làm xuất hiện suất điện động (và dòng điện) cảm ứng trong mạch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biên độ dao động của một vật dao động điều hòa là", "options": ["A. quãng đường mà vật đi được trong một chu kì.", "B. tần số dao động của vật.", "C. độ lớn cực đại của li độ của vật.", "D. thời gian để vật thực hiện một dao động toàn phần."], "answer": "C", "explain": "Biên độ $A = |x|_{\\max }$: li độ cực đại của vật (luôn dương, đơn vị độ dài).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một máy biến áp lí tưởng có số vòng dây cuộn sơ cấp $1000$ vòng, cuộn thứ cấp $200$ vòng. Đặt vào cuộn sơ cấp điện áp hiệu dụng $220$ V (cuộn thứ cấp để hở). Điện áp hiệu dụng ở hai đầu cuộn thứ cấp là", "options": ["A. $44$ V.", "B. $1100$ V.", "C. $110$ V.", "D. $22$ V."], "answer": "A", "explain": "$U_2/U_1 = N_2/N_1$, suy ra $U_2 = 220 \\times 200/1000 = 44$ V (máy hạ áp).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mạch dao động LC lí tưởng có độ tự cảm $L = 4$ mH, điện dung $C = 1\\ \\mu$F. Chu kì dao động riêng của mạch là", "options": ["A. $4\\pi \times 10^{-4}$ s.", "B. $2\\pi \times 10^{-4}$ s.", "C. $10^{-4}$ s.", "D. xấp xỉ $3,97 \times 10^{-4}$ s."], "answer": "D", "explain": "$T = 2\\pi\\sqrt{LC} = 2\\pi\\sqrt{4 \\times 10^{-9}} = 2\\pi \\times 6,32 \\times 10^{-5} \\approx 3,97 \\times 10^{-4}$ s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong thí nghiệm Young về giao thoa ánh sáng, khoảng vân đo được là $i = 1$ mm. Vị trí vân sáng bậc $3$ cách vân sáng trung tâm", "options": ["A. $1$ mm.", "B. $3$ mm.", "C. $1,5$ mm.", "D. $4$ mm."], "answer": "B", "explain": "$x_{s3} = 3i = 3$ mm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết hằng số Planck $h = 6,625 \\times 10^{-34}$ J.s, tốc độ ánh sáng $c = 3 \\times 10^8$ m/s. Photon ứng với bức xạ có bước sóng $0,4\\ \\mu$m có năng lượng", "options": ["A. $3,1 \times 10^{-19}$ J.", "B. $4,97 \times 10^{-19}$ J.", "C. xấp xỉ $3,1$ eV.", "D. $1,55$ eV."], "answer": "C", "explain": "$\\varepsilon = hc/\\lambda = 1,9875 \\times 10^{-25}/(0,4 \\times 10^{-6}) = 4,97 \\times 10^{-19}$ J $= 3,1$ eV.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một lượng khí lí tưởng biến đổi đẳng áp: lúc đầu thể tích $2$ L, nhiệt độ $300$ K. Khi nhiệt độ tăng lên $600$ K thì thể tích của khí là", "options": ["A. $4$ L.", "B. $1$ L.", "C. $3$ L.", "D. $6$ L."], "answer": "A", "explain": "Đẳng áp: $V_1/T_1 = V_2/T_2$, suy ra $V_2 = 2 \\times 600/300 = 4$ L.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vật dao động điều hòa với biên độ $4$ cm, chu kì $2$ s. Tốc độ cực đại của vật là", "options": ["A. $8$ cm/s.", "B. $2\\pi$ cm/s.", "C. $8\\pi$ cm/s.", "D. $4\\pi$ cm/s."], "answer": "D", "explain": "$\\omega = 2\\pi/T = \\pi$ rad/s; $v_{\\max} = A\\omega = 4\\pi$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đoạn mạch điện xoay chiều RLC nối tiếp có $R = 40\\ \\Omega$, $Z_L = 70\\ \\Omega$, $Z_C = 40\\ \\Omega$. Hệ số công suất của đoạn mạch là", "options": ["A. $1$.", "B. $0,8$.", "C. $0,6$.", "D. $0,5$."], "answer": "B", "explain": "$Z = \\sqrt{40^2 + (70-40)^2} = 50\\ \\Omega$; $\\cos\\varphi = R/Z = 40/50 = 0,8$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mạch dao động LC lí tưởng có điện dung $C = 2\\ \\mu$F, điện áp cực đại giữa hai bản tụ $U_0 = 100$ V. Năng lượng điện từ của mạch là", "options": ["A. $0,02$ J.", "B. $0,005$ J.", "C. $0,01$ J.", "D. $0,04$ J."], "answer": "C", "explain": "$W = \\frac{1}{2}CU_0^2 = 0,5 \\times 2 \\times 10^{-6} \\times 10^4 = 0,01$ J.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Con lắc lò xo treo thẳng đứng gồm lò xo có độ cứng $k = 100$ N/m, vật nặng $m = 1$ kg. Kích thích cho vật dao động điều hòa với biên độ $15$ cm. Lực đàn hồi cực đại tác dụng lên vật là", "options": ["A. $25$ N.", "B. $15$ N.", "C. $10$ N.", "D. $20$ N."], "answer": "A", "explain": "Độ giãn ở VTCB: $\\Delta l_0 = mg/k = 0,1$ m; $F_{đh\\max} = k(\\Delta l_0 + A) = 100 \\times 0,25 = 25$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tại điểm cách nguồn âm $10$ m, mức cường độ âm đo được là $80$ dB. Bỏ qua sự hấp thụ âm của môi trường. Tại điểm cách nguồn âm $100$ m, mức cường độ âm là", "options": ["A. $70$ dB.", "B. $40$ dB.", "C. $20$ dB.", "D. $60$ dB."], "answer": "D", "explain": "Khoảng cách tăng $10$ lần nên cường độ âm giảm $100$ lần; $L$ giảm $10\\log100 = 20$ dB, còn $60$ dB.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét sóng cơ lan truyền trong một môi trường đàn hồi.", "statements": ["a) Sóng cơ truyền được trong chân không.", "b) Tốc độ truyền sóng phụ thuộc vào bản chất của môi trường.", "c) Khi sóng truyền đi, các phần tử của môi trường chỉ dao động tại chỗ quanh vị trí cân bằng.", "d) Bước sóng là khoảng cách giữa hai điểm gần nhau nhất trên phương truyền sóng dao động cùng pha."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: sóng cơ cần môi trường vật chất, không truyền trong chân không. b), c), d) Đúng theo định nghĩa.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Mạch dao động LC lí tưởng có độ tự cảm $L = 1$ mH, điện dung $C = 4\\ \\mu$F.", "statements": ["a) Tần số dao động riêng của mạch xấp xỉ $2516$ Hz.", "b) Chu kì dao động riêng của mạch tỉ lệ thuận với $\\sqrt{L}$.", "c) Nếu tăng điện dung lên $4$ lần thì tần số dao động tăng $2$ lần.", "d) Năng lượng từ trường cực đại trong mạch bằng năng lượng điện trường cực đại."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $f = 1/(2\\pi\\sqrt{LC}) \\approx 2516$ Hz. b) Đúng: $T = 2\\pi\\sqrt{LC}$. c) Sai: $f \\propto 1/\\sqrt{C}$ nên $f$ giảm $2$ lần. d) Đúng: năng lượng chuyển hóa qua lại, hai cực đại bằng nhau.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Chiếu một chùm sáng trắng qua một lăng kính, thu được dải màu trên màn chắn.", "statements": ["a) Hiện tượng này được gọi là hiện tượng tán sắc ánh sáng.", "b) Trong dải màu thu được, tia đỏ bị lệch nhiều nhất, tia tím bị lệch ít nhất.", "c) Nguyên nhân gây ra hiện tượng là chiết suất của lăng kính phụ thuộc vào bước sóng ánh sáng.", "d) Mỗi ánh sáng đơn sắc trong chùm sáng trắng không bị tán sắc khi qua lăng kính."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: tia tím bị lệch nhiều nhất (chiết suất lớn nhất), tia đỏ lệch ít nhất. c) Đúng. d) Đúng: ánh sáng đơn sắc giữ nguyên màu khi qua lăng kính.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét từ trường của dòng điện chạy trong các dây dẫn có hình dạng khác nhau.", "statements": ["a) Đường sức từ của dòng điện thẳng dài là những đường tròn đồng tâm nằm trong mặt phẳng vuông góc với dây.", "b) Chiều của đường sức từ được xác định bằng quy tắc nắm tay phải.", "c) Bên trong lòng ống dây dài, từ trường là từ trường đều.", "d) Cảm ứng từ tại tâm của vòng dây tròn tỉ lệ nghịch với cường độ dòng điện qua vòng dây."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $B = 2\\pi \\times 10^{-7}I/R$ tỉ lệ thuận với $I$.", "points": 1}, {"type": "short", "level": "TH", "q": "Mạch dao động LC lí tưởng có độ tự cảm $L = 2,5$ mH, điện dung $C = 10\\ \\mu$F. Tần số dao động riêng của mạch bằng bao nhiêu Hz? (làm tròn đến hàng đơn vị; lấy $\\pi = 3,14$)", "answer": "1007", "explain": "$f = 1/(2\\pi\\sqrt{LC}) = 1/(2\\pi\\sqrt{2,5 \\times 10^{-8}}) \\approx 1006,6$ Hz $\\approx 1007$ Hz.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Công thoát của electron khỏi một kim loại là $3,2 \\times 10^{-19}$ J. Giới hạn quang điện của kim loại này bằng bao nhiêu $\\mu$m? (Cho $h = 6,625 \\times 10^{-34}$ J.s, $c = 3 \\times 10^8$ m/s; làm tròn đến 3 chữ số thập phân)", "answer": "0,621", "explain": "$\\lambda_0 = hc/A = 1,9875 \\times 10^{-25}/(3,2 \\times 10^{-19}) = 6,21 \\times 10^{-7}$ m $= 0,621\\ \\mu$m.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ban đầu có $8 \\times 10^{20}$ hạt nhân của một chất phóng xạ có chu kì bán rã $8$ ngày. Sau $24$ ngày, số hạt nhân còn lại chưa bị phân rã bằng bao nhiêu? (viết đáp án dưới dạng $a \\times 10^b$, ví dụ $2 \\times 10^{20}$ viết là 2e20)", "answer": "1e20", "explain": "$N = N_0 \\times 2^{-t/T} = 8 \\times 10^{20} \\times 2^{-3} = 10^{20}$ hạt nhân.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Con lắc lò xo gồm vật nặng $0,4$ kg gắn vào lò xo có độ cứng $40$ N/m, dao động điều hòa. Chu kì dao động của con lắc bằng bao nhiêu s? (làm tròn đến 3 chữ số thập phân; lấy $\\pi = 3,14$)", "answer": "0,628", "explain": "$T = 2\\pi\\sqrt{m/k} = 2\\pi\\sqrt{0,4/40} = 2\\pi \\times 0,1 = 0,628$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Truyền tải điện năng với công suất $50$ kW; điện áp hiệu dụng nơi phát là $5$ kV, hệ số công suất bằng $1$, điện trở của đường dây tải điện là $20\\ \\Omega$. Công suất hao phí trên đường dây bằng bao nhiêu W?", "answer": "2000", "explain": "$\\Delta P = R \\times P^2/(U^2\\cos^2\\varphi) = 20 \\times (5 \\times 10^4)^2/(5 \\times 10^3)^2 = 2000$ W.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhiệt nóng chảy riêng của nước đá là $3,34 \\times 10^5$ J/kg. Nhiệt lượng cần cung cấp để làm nóng chảy hoàn toàn $0,5$ kg nước đá đang ở $0^\\circ$C bằng bao nhiêu J?", "answer": "167000", "explain": "$Q = \\lambda m = 3,34 \\times 10^5 \\times 0,5 = 167000$ J.", "points": 0.5}]}]}
