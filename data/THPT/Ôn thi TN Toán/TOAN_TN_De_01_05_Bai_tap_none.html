<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Tập xác định của hàm số $y = \\frac{2x+1}{x-3}$ là","options":["A. $D = \\mathbb{R} \\setminus \\{3\\}$","B. $D = \\mathbb{R} \\setminus \\{-3\\}$","C. $D = \\mathbb{R}$","D. $D = (3; +\\infty)$"],"answer":"A","explain":"Hàm phân thức xác định khi mẫu số khác 0: $x - 3 \\neq 0 \\Leftrightarrow x \\neq 3$. Vậy tập xác định là $D = \\mathbb{R} \\setminus \\{3\\}$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của hàm số $y = x^4 - 3x^2 + 2$ là","options":["A. $y' = 4x^3 - 6x$","B. $y' = 4x^3 - 6x + 2$","C. $y' = x^3 - 6x$","D. $y' = 4x^4 - 6x^2$"],"answer":"A","explain":"Áp dụng $(x^n)' = n x^{n-1}$ và đạo hàm của hằng số bằng 0: $y' = 4x^3 - 3 \\cdot 2x + 0 = 4x^3 - 6x$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hàm số $y = f(x)$ có đạo hàm $f'(x) = (x-1)(x+2)$. Hàm số $f(x)$ đồng biến trên khoảng nào sau đây?","options":["A. $(1; +\\infty)$","B. $(-2; 1)$","C. $(-\\infty; -2)$","D. $(-2; +\\infty)$"],"answer":"A","explain":"$f'(x) \\gt 0 \\Leftrightarrow (x-1)(x+2) \\gt 0 \\Leftrightarrow x \\lt -2$ hoặc $x \\gt 1$. Vậy hàm số đồng biến trên $(-\\infty; -2)$ và $(1; +\\infty)$. Trong các phương án, $(1; +\\infty)$ đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm cực tiểu của đồ thị hàm số $y = x^3 - 3x$ là","options":["A. $(1; -2)$","B. $(-1; 2)$","C. $(1; 2)$","D. $(-1; -2)$"],"answer":"A","explain":"$y' = 3x^2 - 3 = 0 \\Leftrightarrow x = \\pm 1$. Ta có $y'' = 6x$: tại $x = 1$, $y''(1) = 6 \\gt 0$ nên $x = 1$ là điểm cực tiểu, $y(1) = 1 - 3 = -2$. Tại $x = -1$, $y''(-1) = -6 \\lt 0$ nên là điểm cực đại. Vậy điểm cực tiểu là $(1; -2)$.","points":0.25},{"type":"mcq","level":"NB","q":"Tiệm cận đứng của đồ thị hàm số $y = \\frac{2x-1}{x+2}$ là đường thẳng","options":["A. $x = -2$","B. $x = 2$","C. $y = 2$","D. $y = -2$"],"answer":"A","explain":"Tiệm cận đứng là nghiệm của mẫu số: $x + 2 = 0 \\Leftrightarrow x = -2$ (tử số tại $x = -2$ bằng $-5 \\neq 0$). Tiệm cận ngang $y = 2$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị nhỏ nhất của hàm số $y = x^2 - 4x + 5$ trên đoạn $[0; 3]$ bằng","options":["A. $1$","B. $2$","C. $5$","D. $0$"],"answer":"A","explain":"$y' = 2x - 4 = 0 \\Leftrightarrow x = 2 \\in [0; 3]$. Tính $y(0) = 5$, $y(2) = 4 - 8 + 5 = 1$, $y(3) = 9 - 12 + 5 = 2$. So sánh ba giá trị: giá trị nhỏ nhất trên $[0; 3]$ là $y(2) = 1$.","points":0.25},{"type":"mcq","level":"NB","q":"Họ nguyên hàm của hàm số $f(x) = 3x^2 + 2x$ là","options":["A. $x^3 + x^2 + C$","B. $6x + 2 + C$","C. $x^3 + 2x^2 + C$","D. $\\frac{x^4}{4} + x^2 + C$"],"answer":"A","explain":"$\\int (3x^2 + 2x) dx = 3 \\cdot \\frac{x^3}{3} + 2 \\cdot \\frac{x^2}{2} + C = x^3 + x^2 + C$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\int_0^2 (2x + 1) dx$ bằng","options":["A. $4$","B. $5$","C. $6$","D. $8$"],"answer":"C","explain":"$\\int_0^2 (2x+1) dx = \\left. (x^2 + x) \\right|_0^2 = (4 + 2) - 0 = 6$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $A(1; 2; -3)$ và $B(4; -1; 2)$. Tọa độ vectơ $\\overrightarrow{AB}$ là","options":["A. $(3; -5; 5)$","B. $(-3; 3; -5)$","C. $(5; 1; -1)$","D. $(3; 3; -1)$"],"answer":"A","explain":"$\\overrightarrow{AB} = (x_B - x_A; y_B - y_A; z_B - z_A) = (4-1; -1-2; 2-(-3)) = (3; -5; 5)$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong không gian $Oxyz$, mặt phẳng đi qua điểm $M(1; -2; 3)$ và có vectơ pháp tuyến $\\vec{n} = (2; 1; -1)$ có phương trình là","options":["A. $2x + y - z + 3 = 0$","B. $2x + y - z - 3 = 0$","C. $x - 2y + 3z - 1 = 0$","D. $2x - y + z + 3 = 0$"],"answer":"A","explain":"Phương trình: $2(x-1) + 1(y+2) - 1(z-3) = 0 \\Leftrightarrow 2x - 2 + y + 2 - z + 3 = 0 \\Leftrightarrow 2x + y - z + 3 = 0$.","points":0.25},{"type":"mcq","level":"TH","q":"Một lớp học có 40 học sinh gồm 22 nam và 18 nữ, trong đó có 10 nam và 8 nữ thích học Toán. Chọn ngẫu nhiên một học sinh thích học Toán. Xác suất để học sinh được chọn là nam bằng","options":["A. $\\frac{5}{9}$","B. $\\frac{1}{4}$","C. $\\frac{11}{20}$","D. $\\frac{5}{11}$"],"answer":"A","explain":"Gọi $A$ là biến cố học sinh được chọn là nam, $B$ là biến cố học sinh được chọn thích Toán. Cần tính $P(A \\mid B) = \\frac{P(A \\cap B)}{P(B)}$. Có 18 học sinh thích Toán, trong đó 10 nam nên $P(A \\mid B) = \\frac{10}{18} = \\frac{5}{9}$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 3$ và công sai $d = 4$. Số hạng $u_5$ bằng","options":["A. $19$","B. $15$","C. $23$","D. $12$"],"answer":"A","explain":"$u_n = u_1 + (n-1)d$ nên $u_5 = 3 + 4 \\cdot 4 = 3 + 16 = 19$.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho hàm số $y = x^3 - 3x^2 + 2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tập xác định của hàm số là $\\mathbb{R}$.","b) Đạo hàm của hàm số là $y' = 3x^2 - 6x$.","c) Hàm số đồng biến trên khoảng $(0; 2)$.","d) Đồ thị hàm số cắt trục hoành tại ba điểm phân biệt."],"answer":["T","T","F","T"],"explain":"a) Đúng: hàm đa thức xác định trên $\\mathbb{R}$. b) Đúng: $y' = 3x^2 - 6x$. c) Sai: $y' = 3x(x-2) \\lt 0$ trên $(0; 2)$ nên hàm nghịch biến trên $(0; 2)$. d) Đúng: $y' = 0$ tại $x = 0$ (cực đại, $y(0) = 2 \\gt 0$) và $x = 2$ (cực tiểu, $y(2) = -2 \\lt 0$); giá trị cực đại và cực tiểu trái dấu nên đồ thị cắt $Ox$ tại 3 điểm phân biệt.","points":1},{"type":"truefalse","level":"TH","q":"Cho $\\int_0^1 f(x) dx = 3$ và $\\int_0^1 g(x) dx = -2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\int_0^1 [f(x) + g(x)] dx = 1$.","b) $\\int_0^1 2f(x) dx = 6$.","c) $\\int_1^0 f(x) dx = 3$.","d) $\\int_0^1 [f(x) - g(x)] dx = 5$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $3 + (-2) = 1$. b) Đúng: $2 \\cdot 3 = 6$. c) Sai: đổi cận thì đổi dấu, $\\int_1^0 f(x) dx = -\\int_0^1 f(x) dx = -3$. d) Đúng: $3 - (-2) = 5$.","points":1},{"type":"truefalse","level":"TH","q":"Trong không gian $Oxyz$, cho $A(1; 0; 2)$ và $B(-1; 2; 0)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trung điểm $I$ của đoạn thẳng $AB$ là $(0; 1; 1)$.","b) $\\left|\\overrightarrow{AB}\\right| = 2\\sqrt{3}$.","c) Mặt cầu đường kính $AB$ có phương trình $x^2 + (y-1)^2 + (z-1)^2 = 3$.","d) Điểm $M(0; 1; 2)$ thuộc mặt cầu đường kính $AB$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $I = \\left(\\frac{1-1}{2}; \\frac{0+2}{2}; \\frac{2+0}{2}\\right) = (0; 1; 1)$. b) Đúng: $\\overrightarrow{AB} = (-2; 2; -2)$, $\\left|\\overrightarrow{AB}\\right| = \\sqrt{4+4+4} = 2\\sqrt{3}$. c) Đúng: tâm $I(0;1;1)$, bán kính $R = \\frac{AB}{2} = \\sqrt{3}$, phương trình $x^2 + (y-1)^2 + (z-1)^2 = 3$. d) Sai: thay $M(0;1;2)$ vào vế trái được $0 + 0 + 1 = 1 \\neq 3$.","points":1},{"type":"truefalse","level":"VD","q":"Một hộp có 5 bi đỏ và 3 bi xanh. Lấy ngẫu nhiên lần lượt 2 bi, mỗi lần 1 bi và không hoàn lại. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xác suất để bi lấy ra lần thứ nhất màu đỏ bằng $\\frac{5}{8}$.","b) Biết bi lấy ra lần thứ nhất màu đỏ, xác suất để bi lấy ra lần thứ hai màu đỏ bằng $\\frac{4}{7}$.","c) Xác suất để cả hai bi lấy ra đều màu đỏ bằng $\\frac{5}{14}$.","d) Xác suất để hai bi lấy ra khác màu bằng $\\frac{13}{28}$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $5/8$. b) Đúng: còn 4 đỏ trong 7 bi nên $4/7$. c) Đúng: $\\frac{5}{8} \\cdot \\frac{4}{7} = \\frac{20}{56} = \\frac{5}{14}$. d) Sai: $P(\\text{khác màu}) = 1 - P(\\text{cùng đỏ}) - P(\\text{cùng xanh}) = 1 - \\frac{5}{14} - \\frac{3}{8}\\cdot\\frac{2}{7} = 1 - \\frac{5}{14} - \\frac{3}{28} = \\frac{15}{28} \\neq \\frac{13}{28}$.","points":1},{"type":"short","level":"VD","q":"Một mảnh vườn hình chữ nhật có chu vi $60$ m. Diện tích lớn nhất của mảnh vườn bằng bao nhiêu mét vuông?","answer":"225","explain":"Gọi chiều dài $a$, chiều rộng $b$ (m). $2(a+b) = 60 \\Rightarrow a + b = 30$. Diện tích $S = ab \\le \\left(\\frac{a+b}{2}\\right)^2 = 15^2 = 225$ (bất đẳng thức AM-GM), dấu bằng khi $a = b = 15$. Vậy $S_{\\max} = 225$ m².","points":0.5},{"type":"short","level":"VD","q":"Diện tích hình phẳng giới hạn bởi đồ thị hàm số $y = x^2$, đường thẳng $y = 2x$ và hai đường thẳng $x = 0$, $x = 2$ bằng $\\frac{a}{b}$ với $a, b$ nguyên dương và $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"7","explain":"Phương trình hoành độ giao điểm: $x^2 = 2x \\Leftrightarrow x = 0$ hoặc $x = 2$. Trên $[0; 2]$ có $2x \\ge x^2$ nên $S = \\int_0^2 (2x - x^2) dx = \\left. \\left(x^2 - \\frac{x^3}{3}\\right) \\right|_0^2 = 4 - \\frac{8}{3} = \\frac{4}{3}$. Vậy $a = 4$, $b = 3$, $a + b = 7$.","points":0.5},{"type":"short","level":"TH","q":"Trong không gian $Oxyz$, khoảng cách từ điểm $M(1; 2; 0)$ đến mặt phẳng $(P): 2x - y + 2z - 6 = 0$ bằng","answer":"2","explain":"$d(M, (P)) = \\frac{|2 \\cdot 1 - 2 + 2 \\cdot 0 - 6|}{\\sqrt{2^2 + (-1)^2 + 2^2}} = \\frac{|-6|}{3} = 2$.","points":0.5},{"type":"short","level":"VD","q":"Có hai hộp bi. Hộp I có 3 bi đỏ và 2 bi xanh; hộp II có 2 bi đỏ và 4 bi xanh. Chọn ngẫu nhiên một hộp rồi từ hộp đó lấy ngẫu nhiên một bi. Xác suất để lấy được bi đỏ bằng $\\frac{a}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"22","explain":"Gọi $H_1, H_2$ là biến cố chọn hộp I, hộp II. Theo công thức xác suất toàn phần: $P(\\text{đỏ}) = P(H_1)P(\\text{đỏ} \\mid H_1) + P(H_2)P(\\text{đỏ} \\mid H_2) = \\frac{1}{2} \\cdot \\frac{3}{5} + \\frac{1}{2} \\cdot \\frac{2}{6} = \\frac{3}{10} + \\frac{1}{6} = \\frac{9+5}{30} = \\frac{14}{30} = \\frac{7}{15}$. Vậy $a + b = 7 + 15 = 22$.","points":0.5},{"type":"short","level":"TH","q":"Cho mẫu số liệu ghép nhóm có các giá trị đại diện lần lượt là $5$, $15$, $25$ với tần số tương ứng là $4$, $6$, $10$. Số trung bình của mẫu số liệu trên bằng","answer":"18","explain":"Số trung bình $\\bar{x} = \\frac{5 \\cdot 4 + 15 \\cdot 6 + 25 \\cdot 10}{4 + 6 + 10} = \\frac{20 + 90 + 250}{20} = \\frac{360}{20} = 18$.","points":0.5},{"type":"short","level":"VDC","q":"Một vật chuyển động với vận tốc $v(t) = 3t^2 - 12t + 9$ (m/s), $t$ tính bằng giây. Quãng đường vật đi được từ thời điểm $t = 0$ đến $t = 4$ bằng bao nhiêu mét?","answer":"12","explain":"$v(t) = 3(t^2 - 4t + 3) = 3(t-1)(t-3)$. Trên $[0; 4]$, $v(t) \\ge 0$ khi $t \\in [0;1] \\cup [3;4]$ và $v(t) \\le 0$ khi $t \\in [1;3]$. Quãng đường $s = \\int_0^4 |v(t)| dt = \\int_0^1 v(t)dt - \\int_1^3 v(t)dt + \\int_3^4 v(t)dt$. Nguyên hàm $F(t) = t^3 - 6t^2 + 9t$; $F(0) = 0$, $F(1) = 4$, $F(3) = 0$, $F(4) = 4$. Vậy $s = (4-0) - (0-4) + (4-0) = 12$ m.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Tập xác định của hàm số $y = \\sqrt{x - 2}$ là","options":["A. $[2; +\\infty)$","B. $(2; +\\infty)$","C. $\\mathbb{R} \\setminus \\{2\\}$","D. $(-\\infty; 2]$"],"answer":"A","explain":"Căn thức bậc hai xác định khi biểu thức dưới dấu căn không âm: $x - 2 \\ge 0 \\Leftrightarrow x \\ge 2$. Vậy $D = [2; +\\infty)$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của hàm số $y = e^{2x}$ là","options":["A. $y' = 2e^{2x}$","B. $y' = e^{2x}$","C. $y' = 2xe^{2x}$","D. $y' = \\frac{e^{2x}}{2}$"],"answer":"A","explain":"Áp dụng $(e^u)' = u' e^u$ với $u = 2x$: $y' = (2x)' e^{2x} = 2e^{2x}$.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm số nào sau đây đồng biến trên $\\mathbb{R}$?","options":["A. $y = x^3 + x$","B. $y = x^3 - 3x$","C. $y = -x^3 + 2x$","D. $y = x^2 + 1$"],"answer":"A","explain":"Với $y = x^3 + x$: $y' = 3x^2 + 1 \\gt 0$ với mọi $x \\in \\mathbb{R}$ nên hàm số đồng biến trên $\\mathbb{R}$. Các hàm còn lại đều có $y'$ đổi dấu (hoặc $y' = 2x$ đổi dấu tại $x = 0$).","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị cực đại của hàm số $y = 2x^3 - 3x^2$ bằng","options":["A. $0$","B. $1$","C. $-4$","D. $2$"],"answer":"A","explain":"$y' = 6x^2 - 6x = 6x(x - 1) = 0 \\Leftrightarrow x = 0$ hoặc $x = 1$. Bảng xét dấu cho thấy $y'$ đổi dấu từ dương sang âm khi qua $x = 0$ nên $x = 0$ là điểm cực đại, giá trị cực đại $y(0) = 0$. (Tại $x = 1$ là điểm cực tiểu, $y(1) = -1$.)","points":0.25},{"type":"mcq","level":"NB","q":"Tiệm cận ngang của đồ thị hàm số $y = \\frac{3x + 1}{2x - 5}$ là đường thẳng","options":["A. $y = \\frac{3}{2}$","B. $y = \\frac{1}{2}$","C. $x = \\frac{5}{2}$","D. $y = 3$"],"answer":"A","explain":"Với hàm phân thức bậc nhất trên bậc nhất $y = \\frac{ax+b}{cx+d}$, tiệm cận ngang là $y = \\frac{a}{c} = \\frac{3}{2}$. (Tiệm cận đứng $x = \\frac{5}{2}$.)","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị lớn nhất của hàm số $y = -x^2 + 6x - 5$ trên đoạn $[1; 4]$ bằng","options":["A. $0$","B. $3$","C. $4$","D. $5$"],"answer":"C","explain":"$y' = -2x + 6 = 0 \\Leftrightarrow x = 3 \\in [1; 4]$. Tính $y(1) = -1 + 6 - 5 = 0$, $y(3) = -9 + 18 - 5 = 4$, $y(4) = -16 + 24 - 5 = 3$. Vậy $\\max_{[1;4]} y = 4$.","points":0.25},{"type":"mcq","level":"NB","q":"Họ nguyên hàm của hàm số $f(x) = 2^x$ là","options":["A. $\\frac{2^x}{\\ln 2} + C$","B. $2^x \\ln 2 + C$","C. $x \\cdot 2^{x-1} + C$","D. $\\frac{2^{x+1}}{x+1} + C$"],"answer":"A","explain":"$\\int a^x dx = \\frac{a^x}{\\ln a} + C$ với $a \\gt 0, a \\neq 1$. Vậy $\\int 2^x dx = \\frac{2^x}{\\ln 2} + C$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\int_1^2 \\frac{1}{x} dx$ bằng","options":["A. $\\ln 2$","B. $1$","C. $\\ln 3$","D. $2\\ln 2$"],"answer":"A","explain":"$\\int_1^2 \\frac{1}{x} dx = \\left. \\ln|x| \\right|_1^2 = \\ln 2 - \\ln 1 = \\ln 2$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $A(2; -1; 4)$ và $B(0; 3; -2)$. Tọa độ trung điểm $I$ của đoạn thẳng $AB$ là","options":["A. $(1; 1; 1)$","B. $(2; 2; 2)$","C. $(1; -2; 3)$","D. $(-1; 2; -3)$"],"answer":"A","explain":"$I = \\left(\\frac{2+0}{2}; \\frac{-1+3}{2}; \\frac{4-2}{2}\\right) = (1; 1; 1)$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong không gian $Oxyz$, mặt cầu tâm $I(1; -2; 3)$ và bán kính $R = 4$ có phương trình là","options":["A. $(x-1)^2 + (y+2)^2 + (z-3)^2 = 16$","B. $(x+1)^2 + (y-2)^2 + (z+3)^2 = 16$","C. $(x-1)^2 + (y+2)^2 + (z-3)^2 = 4$","D. $(x-1)^2 + (y-2)^2 + (z-3)^2 = 16$"],"answer":"A","explain":"Phương trình mặt cầu tâm $I(a; b; c)$ bán kính $R$: $(x-a)^2 + (y-b)^2 + (z-c)^2 = R^2$. Thay $I(1; -2; 3)$, $R = 4$ được $(x-1)^2 + (y+2)^2 + (z-3)^2 = 16$.","points":0.25},{"type":"mcq","level":"TH","q":"Gieo một con xúc xắc cân đối. Biết rằng mặt xuất hiện là mặt chẵn, xác suất để mặt xuất hiện là mặt 6 chấm bằng","options":["A. $\\frac{1}{3}$","B. $\\frac{1}{6}$","C. $\\frac{1}{2}$","D. $\\frac{2}{3}$"],"answer":"A","explain":"Gọi $A$ là biến cố mặt 6 chấm, $B$ là biến cố mặt chẵn. $P(A \\mid B) = \\frac{P(A \\cap B)}{P(B)} = \\frac{1/6}{3/6} = \\frac{1}{3}$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 2$ và công bội $q = 3$. Số hạng $u_4$ bằng","options":["A. $54$","B. $18$","C. $24$","D. $162$"],"answer":"A","explain":"$u_n = u_1 q^{n-1}$ nên $u_4 = 2 \\cdot 3^3 = 2 \\cdot 27 = 54$.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho hàm số $y = \\frac{x+1}{x-1}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tập xác định của hàm số là $D = \\mathbb{R} \\setminus \\{1\\}$.","b) Đạo hàm của hàm số là $y' = \\frac{-2}{(x-1)^2}$.","c) Hàm số nghịch biến trên $\\mathbb{R}$.","d) Đồ thị hàm số cắt trục tung tại điểm $(0; -1)$."],"answer":["T","T","F","T"],"explain":"a) Đúng: mẫu $x - 1 \\neq 0$. b) Đúng: $y' = \\frac{1 \\cdot (x-1) - (x+1) \\cdot 1}{(x-1)^2} = \\frac{-2}{(x-1)^2}$. c) Sai: $y' \\lt 0$ nên hàm nghịch biến trên từng khoảng xác định $(-\\infty; 1)$ và $(1; +\\infty)$, không được nói nghịch biến trên $\\mathbb{R}$ (hàm gián đoạn tại $x = 1$). d) Đúng: $x = 0 \\Rightarrow y = -1$.","points":1},{"type":"truefalse","level":"TH","q":"Gọi $F(x)$ là một nguyên hàm của hàm số $f(x) = 2x + 1$ thỏa mãn $F(1) = 3$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $F(x) = x^2 + x + C$ với $C$ là hằng số.","b) Hằng số $C = 1$.","c) $F(x) = x^2 + x + 1$.","d) $F(0) = 2$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $\\int (2x+1) dx = x^2 + x + C$. b) Đúng: $F(1) = 1 + 1 + C = 3 \\Rightarrow C = 1$. c) Đúng: thay $C = 1$. d) Sai: $F(0) = 0 + 0 + 1 = 1 \\neq 2$.","points":1},{"type":"truefalse","level":"TH","q":"Trong không gian $Oxyz$, cho đường thẳng $d$ đi qua $A(1; 2; 3)$ và có vectơ chỉ phương $\\vec{u} = (2; -1; 1)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phương trình tham số của $d$ là $\\begin{cases} x = 1 + 2t \\\\ y = 2 - t \\\\ z = 3 + t \\end{cases} (t \\in \\mathbb{R})$.","b) Điểm $B(3; 1; 4)$ thuộc đường thẳng $d$.","c) Điểm $C(1; 2; 5)$ thuộc đường thẳng $d$.","d) Đường thẳng $d$ đi qua gốc tọa độ $O$."],"answer":["T","T","F","F"],"explain":"a) Đúng theo công thức phương trình tham số. b) Đúng: với $t = 1$ được $(3; 1; 4)$. c) Sai: $z = 3 + t = 5 \\Rightarrow t = 2$, khi đó $x = 1 + 4 = 5 \\neq 1$. d) Sai: hệ $1 + 2t = 0, 2 - t = 0, 3 + t = 0$ vô nghiệm (từ phương trình thứ hai $t = 2$ nhưng không thỏa phương trình thứ nhất).","points":1},{"type":"truefalse","level":"VD","q":"Một xạ thủ bắn hai phát đạn độc lập vào bia. Xác suất bắn trúng của phát thứ nhất là $0,7$ và của phát thứ hai là $0,8$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xác suất để cả hai phát đều trúng bia bằng $0,56$.","b) Xác suất để trúng bia ít nhất một phát bằng $0,9$.","c) Xác suất để chỉ trúng đúng phát thứ hai bằng $0,24$.","d) Biết rằng đã trúng bia ít nhất một phát, xác suất để cả hai phát đều trúng bằng $\\frac{28}{47}$."],"answer":["T","F","T","T"],"explain":"a) Đúng: $0,7 \\cdot 0,8 = 0,56$ (độc lập). b) Sai: $P(\\text{ít nhất 1}) = 1 - 0,3 \\cdot 0,2 = 1 - 0,06 = 0,94 \\neq 0,9$. c) Đúng: $0,3 \\cdot 0,8 = 0,24$. d) Đúng: $P(\\text{cả 2} \\mid \\text{ít nhất 1}) = \\frac{0,56}{0,94} = \\frac{56}{94} = \\frac{28}{47}$.","points":1},{"type":"short","level":"VD","q":"Người ta làm một chiếc hộp không nắp từ một tấm bìa hình vuông cạnh $12$ cm bằng cách cắt ở bốn góc bốn hình vuông cạnh $x$ (cm) rồi gấp lên. Thể tích lớn nhất của chiếc hộp bằng bao nhiêu $cm^3$?","answer":"128","explain":"Điều kiện $0 \\lt x \\lt 6$. Thể tích $V(x) = x(12-2x)^2$. $V'(x) = (12-2x)^2 - 4x(12-2x) = (12-2x)(12-6x)$. $V'(x) = 0 \\Leftrightarrow x = 2$ (nhận) hoặc $x = 6$ (loại). $V$ đạt cực đại tại $x = 2$: $V_{\\max} = 2 \\cdot (12-4)^2 = 2 \\cdot 64 = 128$ cm³.","points":0.5},{"type":"short","level":"VD","q":"Cho hình phẳng giới hạn bởi đồ thị hàm số $y = x^2$, trục hoành và hai đường thẳng $x = 0$, $x = 1$. Thể tích của khối tròn xoay tạo thành khi quay hình phẳng đó quanh trục hoành bằng $\\frac{a\\pi}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"6","explain":"$V = \\pi \\int_0^1 (x^2)^2 dx = \\pi \\int_0^1 x^4 dx = \\pi \\left. \\frac{x^5}{5} \\right|_0^1 = \\frac{\\pi}{5}$. Vậy $a = 1$, $b = 5$, $a + b = 6$.","points":0.5},{"type":"short","level":"TH","q":"Trong không gian $Oxyz$, cho vectơ $\\vec{a} = (2; -1; 2)$. Độ dài của vectơ $\\vec{a}$ bằng","answer":"3","explain":"$|\\vec{a}| = \\sqrt{2^2 + (-1)^2 + 2^2} = \\sqrt{9} = 3$.","points":0.5},{"type":"short","level":"VD","q":"Giải phương trình $\\log_2 (x - 1) + \\log_2 (x + 1) = 3$. Tổng các nghiệm của phương trình bằng","answer":"3","explain":"Điều kiện: $x - 1 \\gt 0$ và $x + 1 \\gt 0 \\Rightarrow x \\gt 1$. Phương trình $\\Leftrightarrow \\log_2[(x-1)(x+1)] = 3 \\Leftrightarrow x^2 - 1 = 2^3 = 8 \\Leftrightarrow x^2 = 9 \\Leftrightarrow x = 3$ (nhận, $x = -3$ loại). Tổng các nghiệm bằng $3$.","points":0.5},{"type":"short","level":"TH","q":"Cho mẫu số liệu ghép nhóm: nhóm $[0; 10)$ có tần số $5$, nhóm $[10; 20)$ có tần số $8$, nhóm $[20; 30)$ có tần số $7$. Trung vị của mẫu số liệu trên bằng","answer":"16.25","explain":"Cỡ mẫu $n = 20$, vị trí trung vị là $\\frac{n}{2} = 10$ rơi vào nhóm $[10; 20)$ (tần số tích lũy trước nhóm này là $5$). Trung vị $M_e = 10 + \\frac{10 - 5}{8} \\cdot 10 = 10 + 6,25 = 16,25$.","points":0.5},{"type":"short","level":"VDC","q":"Một người gửi $100$ triệu đồng vào ngân hàng với lãi suất $6\\%$ một năm, tiền lãi được nhập vào vốn sau mỗi năm. Sau ít nhất bao nhiêu năm thì số tiền người đó nhận được (cả vốn lẫn lãi) không ít hơn $150$ triệu đồng?","answer":"7","explain":"Sau $n$ năm số tiền là $100 \\cdot (1,06)^n$ triệu đồng. Cần $100 \\cdot 1,06^n \\ge 150 \\Leftrightarrow 1,06^n \\ge 1,5 \\Leftrightarrow n \\ge \\log_{1,06} 1,5 = \\frac{\\ln 1,5}{\\ln 1,06} \\approx \\frac{0,4055}{0,0583} \\approx 6,96$. Vậy $n$ nguyên nhỏ nhất là $7$ năm.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Tập xác định của hàm số $y = \\log_3 (x + 1)$ là","options":["A. $(-1; +\\infty)$","B. $[-1; +\\infty)$","C. $(1; +\\infty)$","D. $\\mathbb{R} \\setminus \\{-1\\}$"],"answer":"A","explain":"Hàm logarit xác định khi biểu thức trong log dương: $x + 1 \\gt 0 \\Leftrightarrow x \\gt -1$. Vậy $D = (-1; +\\infty)$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của hàm số $y = \\ln x$ $(x \\gt 0)$ là","options":["A. $y' = \\frac{1}{x}$","B. $y' = \\frac{1}{x^2}$","C. $y' = \\ln x$","D. $y' = x$"],"answer":"A","explain":"Công thức: $(\\ln x)' = \\frac{1}{x}$ với $x \\gt 0$.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm số nào sau đây nghịch biến trên $\\mathbb{R}$?","options":["A. $y = -x^3 - x$","B. $y = x^3 + 2x$","C. $y = -x^2 + 1$","D. $y = \\frac{x+1}{x-1}$"],"answer":"A","explain":"Với $y = -x^3 - x$: $y' = -3x^2 - 1 \\lt 0$ với mọi $x \\in \\mathbb{R}$ nên hàm số nghịch biến trên $\\mathbb{R}$. Phương án B có $y' = 3x^2 + 2 \\gt 0$ (đồng biến); C là parabol; D gián đoạn tại $x = 1$.","points":0.25},{"type":"mcq","level":"NB","q":"Đồ thị hàm số $y = \\frac{x - 2}{2x + 1}$ có tiệm cận ngang là đường thẳng","options":["A. $y = \\frac{1}{2}$","B. $y = 2$","C. $x = -\\frac{1}{2}$","D. $y = -2$"],"answer":"A","explain":"Tiệm cận ngang $y = \\frac{a}{c} = \\frac{1}{2}$ (tỉ số hệ số của $x$ ở tử và mẫu).","points":0.25},{"type":"mcq","level":"NB","q":"Họ nguyên hàm của hàm số $f(x) = \\cos x$ là","options":["A. $\\sin x + C$","B. $-\\sin x + C$","C. $\\tan x + C$","D. $-\\cos x + C$"],"answer":"A","explain":"$\\int \\cos x dx = \\sin x + C$ vì $(\\sin x)' = \\cos x$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\int_{-1}^{1} x^3 dx$ bằng","options":["A. $0$","B. $1$","C. $\\frac{1}{2}$","D. $2$"],"answer":"A","explain":"Hàm $f(x) = x^3$ là hàm lẻ, tích phân trên đoạn đối xứng $[-1; 1]$ bằng 0. (Tính trực tiếp: $\\left. \\frac{x^4}{4} \\right|_{-1}^{1} = \\frac{1}{4} - \\frac{1}{4} = 0$.)","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $\\vec{a} = (1; -2; 3)$ và $\\vec{b} = (2; 0; -1)$. Tọa độ của vectơ $\\vec{a} + \\vec{b}$ là","options":["A. $(3; -2; 2)$","B. $(-1; -2; 4)$","C. $(3; 2; -2)$","D. $(1; 2; -4)$"],"answer":"A","explain":"$\\vec{a} + \\vec{b} = (1+2; -2+0; 3-1) = (3; -2; 2)$.","points":0.25},{"type":"mcq","level":"TH","q":"Số điểm cực trị của hàm số $y = x^4 - 2x^2 + 1$ là","options":["A. $3$","B. $1$","C. $2$","D. $0$"],"answer":"A","explain":"$y' = 4x^3 - 4x = 4x(x^2 - 1) = 0 \\Leftrightarrow x = 0$ hoặc $x = \\pm 1$. $y'$ đổi dấu qua cả ba nghiệm đơn nên hàm số có 3 điểm cực trị (cực tiểu tại $x = \\pm 1$, cực đại tại $x = 0$).","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị lớn nhất của hàm số $y = x + \\frac{4}{x}$ trên đoạn $[1; 4]$ bằng","options":["A. $5$","B. $4$","C. $\\frac{17}{4}$","D. $6$"],"answer":"A","explain":"$y' = 1 - \\frac{4}{x^2} = 0 \\Leftrightarrow x^2 = 4 \\Leftrightarrow x = 2$ (nhận, $x = -2$ loại). Tính $y(1) = 5$, $y(2) = 4$, $y(4) = 5$. Vậy $\\max_{[1;4]} y = 5$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\int_0^{\\frac{\\pi}{2}} \\sin x dx$ bằng","options":["A. $1$","B. $0$","C. $2$","D. $-1$"],"answer":"A","explain":"$\\int_0^{\\pi/2} \\sin x dx = \\left. (-\\cos x) \\right|_0^{\\pi/2} = -\\cos\\frac{\\pi}{2} + \\cos 0 = 0 + 1 = 1$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong không gian $Oxyz$, cho $A(1; 2; 3)$ và $B(3; 0; 1)$. Phương trình mặt phẳng trung trực của đoạn thẳng $AB$ là","options":["A. $x - y - z + 1 = 0$","B. $x + y + z - 3 = 0$","C. $2x - 2y - 2z = 0$","D. $x - y + z - 1 = 0$"],"answer":"A","explain":"Trung điểm $I(2; 1; 2)$; vectơ pháp tuyến $\\overrightarrow{AB} = (2; -2; -2)$ cùng phương với $(1; -1; -1)$. Phương trình: $1(x-2) - 1(y-1) - 1(z-2) = 0 \\Leftrightarrow x - y - z + 1 = 0$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\log_2 32$ bằng","options":["A. $5$","B. $4$","C. $16$","D. $6$"],"answer":"A","explain":"$32 = 2^5$ nên $\\log_2 32 = 5$.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho mẫu số liệu ghép nhóm với các giá trị đại diện $10$, $20$, $30$ có tần số tương ứng là $2$, $5$, $3$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cỡ mẫu của mẫu số liệu là $n = 10$.","b) Số trung bình của mẫu số liệu bằng $21$.","c) Nhóm chứa mốt của mẫu số liệu là nhóm có giá trị đại diện $20$.","d) Tổng các tần số của mẫu số liệu bằng $12$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $n = 2 + 5 + 3 = 10$. b) Đúng: $\\bar{x} = \\frac{10 \\cdot 2 + 20 \\cdot 5 + 30 \\cdot 3}{10} = \\frac{210}{10} = 21$. c) Đúng: tần số lớn nhất là $5$ ứng với giá trị đại diện $20$. d) Sai: tổng tần số $= 10 \\neq 12$.","points":1},{"type":"truefalse","level":"TH","q":"Cho hàm số $y = x^4 - 2x^2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tập xác định của hàm số là $\\mathbb{R}$.","b) Đạo hàm của hàm số là $y' = 4x^3 - 2x$.","c) Hàm số có ba điểm cực trị.","d) Đồ thị hàm số đối xứng qua trục tung."],"answer":["T","F","T","T"],"explain":"a) Đúng: hàm đa thức. b) Sai: $y' = 4x^3 - 4x$ (đạo hàm của $-2x^2$ là $-4x$). c) Đúng: $y' = 4x(x^2-1) = 0$ có ba nghiệm đơn $0, \\pm 1$, đổi dấu qua mỗi nghiệm. d) Đúng: $y(-x) = y(x)$ nên đồ thị đối xứng qua $Oy$.","points":1},{"type":"truefalse","level":"TH","q":"Trong không gian $Oxyz$, cho mặt phẳng $(P): x + 2y - z + 1 = 0$ và điểm $A(1; 1; 1)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điểm $A$ thuộc mặt phẳng $(P)$.","b) Vectơ $\\vec{n} = (1; 2; -1)$ là một vectơ pháp tuyến của $(P)$.","c) Khoảng cách từ gốc tọa độ $O$ đến $(P)$ bằng $\\frac{1}{\\sqrt{6}}$.","d) Điểm $B(0; 0; -1)$ thuộc mặt phẳng $(P)$."],"answer":["F","T","T","F"],"explain":"a) Sai: $1 + 2 - 1 + 1 = 3 \\neq 0$. b) Đúng theo phương trình tổng quát. c) Đúng: $d(O,(P)) = \\frac{|1|}{\\sqrt{1+4+1}} = \\frac{1}{\\sqrt{6}}$. d) Sai: $0 + 0 + 1 + 1 = 2 \\neq 0$.","points":1},{"type":"truefalse","level":"VD","q":"Trong một vùng dân cư, tỉ lệ người mắc bệnh X là $10\\%$. Một xét nghiệm cho kết quả dương tính đúng $95\\%$ với người mắc bệnh và dương tính nhầm $10\\%$ với người không mắc bệnh. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xác suất một người ngẫu nhiên mắc bệnh X bằng $0,1$.","b) Xác suất xét nghiệm dương tính với người mắc bệnh bằng $0,95$.","c) Xác suất để một người ngẫu nhiên có kết quả xét nghiệm dương tính bằng $0,175$.","d) Biết một người có kết quả dương tính, xác suất người đó mắc bệnh X bằng $\\frac{19}{37}$."],"answer":["T","T","F","T"],"explain":"a), b) Đúng theo giả thiết. c) Sai: theo công thức xác suất toàn phần, $P(\\text{dương}) = 0,1 \\cdot 0,95 + 0,9 \\cdot 0,1 = 0,095 + 0,09 = 0,185 \\neq 0,175$. d) Đúng: theo công thức Bayes, $P(\\text{bệnh} \\mid \\text{dương}) = \\frac{0,095}{0,185} = \\frac{95}{185} = \\frac{19}{37}$.","points":1},{"type":"short","level":"VD","q":"Một hình hộp chữ nhật có tổng độ dài ba kích thước bằng $12$ cm. Thể tích lớn nhất của hình hộp đó bằng bao nhiêu $cm^3$?","answer":"64","explain":"Gọi ba kích thước là $a, b, c$ ($a+b+c = 12$). Theo bất đẳng thức AM-GM: $V = abc \\le \\left(\\frac{a+b+c}{3}\\right)^3 = 4^3 = 64$, dấu bằng khi $a = b = c = 4$. Vậy $V_{\\max} = 64$ cm³.","points":0.5},{"type":"short","level":"VD","q":"Diện tích hình phẳng giới hạn bởi parabol $y = -x^2 + 4$ và trục hoành bằng $\\frac{a}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"35","explain":"Phương trình hoành độ giao điểm: $-x^2 + 4 = 0 \\Leftrightarrow x = \\pm 2$. $S = \\int_{-2}^{2} (4 - x^2) dx = \\left. \\left(4x - \\frac{x^3}{3}\\right) \\right|_{-2}^{2} = 2\\left(8 - \\frac{8}{3}\\right) = \\frac{32}{3}$. Vậy $a + b = 32 + 3 = 35$.","points":0.5},{"type":"short","level":"TH","q":"Trong không gian $Oxyz$, cho $A(1; 0; -1)$, $B(2; 1; 0)$, $C(0; -1; 2)$. Độ dài của vectơ $\\overrightarrow{AB} + \\overrightarrow{AC}$ bằng","answer":"4","explain":"$\\overrightarrow{AB} = (1; 1; 1)$, $\\overrightarrow{AC} = (-1; -1; 3)$. Tổng $\\overrightarrow{AB} + \\overrightarrow{AC} = (0; 0; 4)$, độ dài bằng $4$.","points":0.5},{"type":"short","level":"VD","q":"Giải phương trình $4^x - 3 \\cdot 2^x + 2 = 0$. Tích các nghiệm của phương trình bằng","answer":"0","explain":"Đặt $t = 2^x$ ($t \\gt 0$), phương trình trở thành $t^2 - 3t + 2 = 0 \\Leftrightarrow t = 1$ hoặc $t = 2$. Với $t = 1$: $2^x = 1 \\Rightarrow x = 0$; với $t = 2$: $2^x = 2 \\Rightarrow x = 1$. Tích các nghiệm $= 0 \\cdot 1 = 0$.","points":0.5},{"type":"short","level":"VDC","q":"Gọi $S$ là tập hợp các giá trị nguyên của tham số $m$ để phương trình $x^3 - 3x + m = 0$ có ba nghiệm phân biệt. Số phần tử của tập $S$ bằng","answer":"3","explain":"Xét $f(x) = x^3 - 3x$, $f'(x) = 3x^2 - 3 = 0 \\Leftrightarrow x = \\pm 1$. $f$ đạt cực đại $f(-1) = 2$ tại $x = -1$ và cực tiểu $f(1) = -2$ tại $x = 1$. Phương trình $f(x) = -m$ có 3 nghiệm phân biệt $\\Leftrightarrow -2 \\lt -m \\lt 2 \\Leftrightarrow -2 \\lt m \\lt 2$. Các giá trị nguyên: $m \\in \\{-1; 0; 1\\}$, vậy $S$ có 3 phần tử.","points":0.5},{"type":"short","level":"VDC","q":"Biết $\\int_0^a x e^x dx = 1$ với $a \\gt 0$. Giá trị của $a$ bằng","answer":"1","explain":"Đặt $u = x$, $dv = e^x dx$ $\\Rightarrow du = dx$, $v = e^x$. $\\int_0^a x e^x dx = \\left. x e^x \\right|_0^a - \\int_0^a e^x dx = a e^a - (e^a - 1) = (a-1)e^a + 1$. Cho bằng $1$: $(a-1)e^a = 0 \\Leftrightarrow a = 1$ (vì $e^a \\gt 0$ và $a \\gt 0$).","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Tập xác định của hàm số $y = \\sqrt{3 - x}$ là","options":["A. $(-\\infty; 3]$","B. $(-\\infty; 3)$","C. $[3; +\\infty)$","D. $\\mathbb{R}$"],"answer":"A","explain":"$3 - x \\ge 0 \\Leftrightarrow x \\le 3$. Vậy $D = (-\\infty; 3]$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của hàm số $y = \\sin x + \\cos x$ là","options":["A. $y' = \\cos x - \\sin x$","B. $y' = \\cos x + \\sin x$","C. $y' = -\\cos x + \\sin x$","D. $y' = -\\sin x - \\cos x$"],"answer":"A","explain":"$(\\sin x)' = \\cos x$, $(\\cos x)' = -\\sin x$ nên $y' = \\cos x - \\sin x$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hàm số $y = x^3 - 3x^2$. Khẳng định nào sau đây đúng?","options":["A. Hàm số nghịch biến trên khoảng $(0; 2)$","B. Hàm số đồng biến trên khoảng $(0; 2)$","C. Hàm số nghịch biến trên $\\mathbb{R}$","D. Hàm số đồng biến trên $\\mathbb{R}$"],"answer":"A","explain":"$y' = 3x^2 - 6x = 3x(x - 2)$. $y' \\lt 0 \\Leftrightarrow 0 \\lt x \\lt 2$ nên hàm số nghịch biến trên $(0; 2)$ (và đồng biến trên $(-\\infty; 0)$, $(2; +\\infty)$).","points":0.25},{"type":"mcq","level":"NB","q":"Đồ thị hàm số $y = \\frac{2x + 3}{x - 1}$ có tiệm cận đứng là đường thẳng","options":["A. $x = 1$","B. $x = -1$","C. $y = 2$","D. $y = 1$"],"answer":"A","explain":"Tiệm cận đứng là nghiệm của mẫu: $x - 1 = 0 \\Leftrightarrow x = 1$ (tử tại $x = 1$ bằng $5 \\neq 0$).","points":0.25},{"type":"mcq","level":"NB","q":"Họ nguyên hàm của hàm số $f(x) = e^x + 2$ là","options":["A. $e^x + 2x + C$","B. $e^x + C$","C. $xe^x + 2x + C$","D. $e^x + 2 + C$"],"answer":"A","explain":"$\\int (e^x + 2) dx = e^x + 2x + C$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $\\int_1^3 f(x) dx = 5$ và $\\int_1^3 g(x) dx = 2$. Khi đó $\\int_1^3 [f(x) - g(x)] dx$ bằng","options":["A. $3$","B. $7$","C. $10$","D. $\\frac{5}{2}$"],"answer":"A","explain":"$\\int_1^3 [f(x) - g(x)] dx = \\int_1^3 f(x) dx - \\int_1^3 g(x) dx = 5 - 2 = 3$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $\\vec{a} = 2\\vec{i} - 3\\vec{j} + \\vec{k}$. Tọa độ của vectơ $\\vec{a}$ là","options":["A. $(2; -3; 1)$","B. $(2; 3; 1)$","C. $(-2; 3; -1)$","D. $(1; -3; 2)$"],"answer":"A","explain":"$\\vec{a} = 2\\vec{i} - 3\\vec{j} + \\vec{k} = (2; -3; 1)$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hàm số $y = f(x)$ có đạo hàm $f'(x) = x^2 (x + 1)$. Số điểm cực trị của hàm số $f(x)$ là","options":["A. $1$","B. $2$","C. $3$","D. $0$"],"answer":"A","explain":"$f'(x) = 0 \\Leftrightarrow x = 0$ (nghiệm bội 2, $f'$ không đổi dấu) hoặc $x = -1$ (nghiệm đơn, $f'$ đổi dấu). Vậy $f$ chỉ có một điểm cực trị tại $x = -1$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị nhỏ nhất của hàm số $y = 2x^3 - 3x^2 - 12x + 1$ trên đoạn $[0; 3]$ bằng","options":["A. $-19$","B. $-8$","C. $1$","D. $-10$"],"answer":"A","explain":"$y' = 6x^2 - 6x - 12 = 6(x^2 - x - 2) = 6(x-2)(x+1) = 0 \\Leftrightarrow x = 2$ (nhận) hoặc $x = -1$ (loại). Tính $y(0) = 1$, $y(2) = 16 - 12 - 24 + 1 = -19$, $y(3) = 54 - 27 - 36 + 1 = -8$. Vậy $\\min_{[0;3]} y = -19$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\int_0^1 e^{2x} dx$ bằng","options":["A. $\\frac{e^2 - 1}{2}$","B. $e^2 - 1$","C. $\\frac{e^2 + 1}{2}$","D. $2e^2$"],"answer":"A","explain":"$\\int_0^1 e^{2x} dx = \\left. \\frac{e^{2x}}{2} \\right|_0^1 = \\frac{e^2 - 1}{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong không gian $Oxyz$, góc giữa hai vectơ $\\vec{a} = (1; 0; 0)$ và $\\vec{b} = (1; 1; 0)$ bằng","options":["A. $45^\\circ$","B. $30^\\circ$","C. $60^\\circ$","D. $90^\\circ$"],"answer":"A","explain":"$\\cos(\\vec{a}, \\vec{b}) = \\frac{\\vec{a} \\cdot \\vec{b}}{|\\vec{a}| \\cdot |\\vec{b}|} = \\frac{1}{1 \\cdot \\sqrt{2}} = \\frac{\\sqrt{2}}{2}$. Vậy góc bằng $45^\\circ$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\lim_{x \\to 2} \\frac{x^2 - 4}{x - 2}$ bằng","options":["A. $4$","B. $2$","C. $0$","D. $8$"],"answer":"A","explain":"Với $x \\neq 2$: $\\frac{x^2-4}{x-2} = \\frac{(x-2)(x+2)}{x-2} = x + 2$. Vậy giới hạn bằng $2 + 2 = 4$.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho hàm số $y = x^3 - 3x + 1$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đạo hàm của hàm số là $y' = 3x^2 - 3$.","b) Hàm số đạt cực đại tại $x = -1$ với giá trị cực đại bằng $3$.","c) Hàm số đồng biến trên khoảng $(-1; 1)$.","d) Đồ thị hàm số cắt trục tung tại điểm $(0; 1)$."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: $y' = 3(x^2-1) = 0 \\Leftrightarrow x = \\pm 1$; $y'$ đổi dấu từ dương sang âm qua $x = -1$ nên cực đại tại $x = -1$, $y(-1) = -1 + 3 + 1 = 3$. c) Sai: $y' \\lt 0$ trên $(-1; 1)$ nên hàm nghịch biến trên $(-1; 1)$. d) Đúng: $x = 0 \\Rightarrow y = 1$.","points":1},{"type":"truefalse","level":"TH","q":"Cho hàm số $f(x)$ liên tục trên $\\mathbb{R}$ và $F(x)$ là một nguyên hàm của $f(x)$ thỏa mãn $F(0) = 1$, $F(2) = 5$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\int_0^2 f(x) dx = 4$.","b) $\\int_0^2 2f(x) dx = 8$.","c) $\\int_2^0 f(x) dx = 4$.","d) $\\int_0^2 [f(x) + 1] dx = 6$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $\\int_0^2 f(x) dx = F(2) - F(0) = 5 - 1 = 4$. b) Đúng: $2 \\cdot 4 = 8$. c) Sai: $\\int_2^0 f(x) dx = -\\int_0^2 f(x) dx = -4$. d) Đúng: $4 + \\int_0^2 1 dx = 4 + 2 = 6$.","points":1},{"type":"truefalse","level":"TH","q":"Trong không gian $Oxyz$, cho mặt cầu $(S): x^2 + y^2 + z^2 - 2x + 4y - 6z + 5 = 0$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tâm của mặt cầu $(S)$ là $I(1; -2; 3)$.","b) Bán kính của mặt cầu $(S)$ bằng $3$.","c) Điểm $O(0; 0; 0)$ nằm trong mặt cầu $(S)$.","d) Điểm $A(1; -2; 6)$ thuộc mặt cầu $(S)$."],"answer":["T","T","F","T"],"explain":"a) Đúng: tâm $I\\left(-\\frac{-2}{2}; -\\frac{4}{2}; -\\frac{-6}{2}\\right) = (1; -2; 3)$. b) Đúng: $R^2 = 1 + 4 + 9 - 5 = 9 \\Rightarrow R = 3$. c) Sai: thay $O$ vào vế trái được $5 \\gt 0$, mà mặt cầu là tập hợp điểm làm vế trái bằng 0; $OI = \\sqrt{14} \\approx 3,74 \\gt 3$ nên $O$ nằm ngoài mặt cầu. d) Đúng: $1 + 4 + 36 - 2 - 8 - 36 + 5 = 0$.","points":1},{"type":"truefalse","level":"VD","q":"Một túi có 6 bi trắng và 4 bi đen. Lấy ngẫu nhiên 3 bi từ túi. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số phần tử của không gian mẫu bằng $120$.","b) Xác suất để lấy được 3 bi trắng bằng $\\frac{1}{5}$.","c) Xác suất để lấy được 2 bi trắng và 1 bi đen bằng $\\frac{1}{2}$.","d) Xác suất để lấy được ít nhất 1 bi đen bằng $\\frac{5}{6}$."],"answer":["T","F","T","T"],"explain":"a) Đúng: $n(\\Omega) = C_{10}^3 = 120$. b) Sai: $P(\\text{3 trắng}) = \\frac{C_6^3}{120} = \\frac{20}{120} = \\frac{1}{6} \\neq \\frac{1}{5}$. c) Đúng: $\\frac{C_6^2 \\cdot C_4^1}{120} = \\frac{15 \\cdot 4}{120} = \\frac{1}{2}$. d) Đúng: $1 - \\frac{1}{6} = \\frac{5}{6}$.","points":1},{"type":"short","level":"VD","q":"Người ta dùng $100$ m hàng rào để rào một mảnh đất hình chữ nhật, trong đó một cạnh của mảnh đất giáp với bờ sông nên không cần rào. Diện tích lớn nhất của mảnh đất rào được bằng bao nhiêu $m^2$?","answer":"1250","explain":"Gọi $a$ là độ dài cạnh vuông góc với bờ sông, $b$ là cạnh song song với bờ sông. Ta có $2a + b = 100 \\Rightarrow b = 100 - 2a$ ($0 \\lt a \\lt 50$). Diện tích $S(a) = ab = a(100-2a) = 100a - 2a^2$. $S'(a) = 100 - 4a = 0 \\Leftrightarrow a = 25$. $S_{\\max} = 25 \\cdot 50 = 1250$ m².","points":0.5},{"type":"short","level":"VD","q":"$\\int_1^e \\frac{\\ln x}{x} dx = \\frac{a}{b}$ với $\\frac{a}{b}$ là phân số tối giản. Tính $a + b$.","answer":"3","explain":"Đặt $t = \\ln x \\Rightarrow dt = \\frac{dx}{x}$; $x = 1 \\Rightarrow t = 0$, $x = e \\Rightarrow t = 1$. Tích phân trở thành $\\int_0^1 t dt = \\left. \\frac{t^2}{2} \\right|_0^1 = \\frac{1}{2}$. Vậy $a + b = 1 + 2 = 3$.","points":0.5},{"type":"short","level":"TH","q":"Trong không gian $Oxyz$, cho $A(1; 2; 3)$ và $B(-1; 0; 1)$. Bình phương bán kính của mặt cầu đường kính $AB$ bằng","answer":"3","explain":"$\\overrightarrow{AB} = (-2; -2; -2)$, $AB = \\sqrt{4+4+4} = 2\\sqrt{3}$. Bán kính $R = \\frac{AB}{2} = \\sqrt{3}$ nên $R^2 = 3$.","points":0.5},{"type":"short","level":"VD","q":"Bất phương trình $\\log_{0,5} (x - 2) \\gt -1$ có tập nghiệm là khoảng $(a; b)$. Tính $a + b$, biết tổng các số nguyên thuộc tập nghiệm bằng $3$.","answer":"6","explain":"Điều kiện $x - 2 \\gt 0 \\Leftrightarrow x \\gt 2$. Vì cơ số $0,5 \\lt 1$ nên $\\log_{0,5}(x-2) \\gt -1 = \\log_{0,5} 2 \\Leftrightarrow x - 2 \\lt 2 \\Leftrightarrow x \\lt 4$. Tập nghiệm $(2; 4)$: số nguyên duy nhất là $x = 3$ (tổng bằng $3$ khớp giả thiết). Vậy $a + b = 2 + 4 = 6$.","points":0.5},{"type":"short","level":"VDC","q":"Một chất điểm chuyển động thẳng có quãng đường đi được tính theo công thức $s(t) = t^3 - 6t^2 + 9t$ (m), với $t$ tính bằng giây ($t \\ge 0$). Tốc độ tức thời của chất điểm tại thời điểm gia tốc bị triệt tiêu bằng bao nhiêu m/s?","answer":"3","explain":"Vận tốc $v(t) = s'(t) = 3t^2 - 12t + 9$; gia tốc $a(t) = v'(t) = 6t - 12$. Gia tốc triệt tiêu khi $6t - 12 = 0 \\Leftrightarrow t = 2$. Tốc độ tại $t = 2$: $|v(2)| = |12 - 24 + 9| = |-3| = 3$ m/s.","points":0.5},{"type":"short","level":"VDC","q":"Gieo ba con xúc xắc cân đối. Xác suất để tổng số chấm xuất hiện bằng $10$ là $\\frac{a}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"9","explain":"Không gian mẫu có $6^3 = 216$ phần tử. Số bộ $(x; y; z)$ nguyên dương có tổng $10$ là $C_9^2 = 36$; trong đó các bộ có một thành phần $\\ge 7$: $(7;2;1)$ và các hoán vị ($6$ bộ), $(7;1;2)$ đã tính, $(8;1;1)$ và hoán vị ($3$ bộ): tổng $9$ bộ không thỏa ($\\le 6$). Số trường hợp thuận lợi $= 36 - 9 = 27$. Xác suất $= \\frac{27}{216} = \\frac{1}{8}$. Vậy $a + b = 9$.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Tập xác định của hàm số $y = \\frac{x + 2}{x^2 - 4}$ là","options":["A. $D = \\mathbb{R} \\setminus \\{-2; 2\\}$","B. $D = \\mathbb{R} \\setminus \\{2\\}$","C. $D = \\mathbb{R}$","D. $D = (-2; 2)$"],"answer":"A","explain":"Mẫu số $x^2 - 4 \\neq 0 \\Leftrightarrow x \\neq \\pm 2$. Vậy $D = \\mathbb{R} \\setminus \\{-2; 2\\}$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của hàm số $y = \\frac{1}{x}$ $(x \\neq 0)$ là","options":["A. $y' = -\\frac{1}{x^2}$","B. $y' = \\frac{1}{x^2}$","C. $y' = -\\frac{1}{x}$","D. $y' = \\ln x$"],"answer":"A","explain":"$y = x^{-1}$ nên $y' = -1 \\cdot x^{-2} = -\\frac{1}{x^2}$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hàm số $y = f(x)$ có đạo hàm $f'(x) = (x - 1)^2 (x + 1)$. Hàm số $f(x)$ nghịch biến trên khoảng nào sau đây?","options":["A. $(-\\infty; -1)$","B. $(-1; 1)$","C. $(1; +\\infty)$","D. $(-1; +\\infty)$"],"answer":"A","explain":"$f'(x) \\lt 0 \\Leftrightarrow (x-1)^2 (x+1) \\lt 0 \\Leftrightarrow x + 1 \\lt 0$ (vì $(x-1)^2 \\ge 0$, bằng 0 tại $x = 1$) $\\Leftrightarrow x \\lt -1$. Vậy hàm nghịch biến trên $(-\\infty; -1)$.","points":0.25},{"type":"mcq","level":"NB","q":"Đồ thị hàm số nào sau đây có tiệm cận đứng là đường thẳng $x = 2$?","options":["A. $y = \\frac{x + 1}{x - 2}$","B. $y = \\frac{x + 1}{x + 2}$","C. $y = \\frac{x}{x^2 + 1}$","D. $y = 2x + 1$"],"answer":"A","explain":"Tiệm cận đứng là nghiệm của mẫu số: $x - 2 = 0 \\Leftrightarrow x = 2$ (tử tại $x = 2$ bằng $3 \\neq 0$). Các phương án còn lại không có tiệm cận đứng $x = 2$.","points":0.25},{"type":"mcq","level":"NB","q":"Họ nguyên hàm của hàm số $f(x) = \\frac{1}{x^2}$ $(x \\neq 0)$ là","options":["A. $-\\frac{1}{x} + C$","B. $\\frac{1}{x} + C$","C. $-\\frac{2}{x^3} + C$","D. $\\ln|x| + C$"],"answer":"A","explain":"$\\int x^{-2} dx = \\frac{x^{-1}}{-1} + C = -\\frac{1}{x} + C$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $\\int_0^2 f(x) dx = 7$. Khi đó $\\int_0^2 [f(x) + 3] dx$ bằng","options":["A. $13$","B. $10$","C. $7$","D. $21$"],"answer":"A","explain":"$\\int_0^2 [f(x) + 3] dx = \\int_0^2 f(x) dx + \\int_0^2 3 dx = 7 + 3 \\cdot 2 = 13$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, hình chiếu của điểm $M(2; -1; 3)$ lên mặt phẳng $(Oxy)$ là điểm","options":["A. $(2; -1; 0)$","B. $(2; 0; 3)$","C. $(0; -1; 3)$","D. $(0; 0; 3)$"],"answer":"A","explain":"Hình chiếu lên $(Oxy)$ giữ nguyên hoành độ, tung độ và cho cao độ bằng 0: $(2; -1; 0)$.","points":0.25},{"type":"mcq","level":"NB","q":"Phương trình $\\sin x = \\frac{\\sqrt{3}}{2}$ có bao nhiêu nghiệm trong đoạn $[0; \\pi]$?","options":["A. $2$","B. $1$","C. $3$","D. $0$"],"answer":"A","explain":"Trên $[0; \\pi]$, $\\sin x = \\frac{\\sqrt{3}}{2} \\Leftrightarrow x = \\frac{\\pi}{3}$ hoặc $x = \\pi - \\frac{\\pi}{3} = \\frac{2\\pi}{3}$. Vậy có 2 nghiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị cực tiểu của hàm số $y = -x^3 + 3x$ bằng","options":["A. $-2$","B. $2$","C. $0$","D. $-4$"],"answer":"A","explain":"$y' = -3x^2 + 3 = 0 \\Leftrightarrow x = \\pm 1$. $y'$ đổi dấu từ âm sang dương qua $x = -1$ nên $x = -1$ là điểm cực tiểu, giá trị cực tiểu $y(-1) = 1 - 3 = -2$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị lớn nhất của hàm số $y = x^3 - 3x$ trên đoạn $[-2; 2]$ bằng","options":["A. $2$","B. $-2$","C. $18$","D. $0$"],"answer":"A","explain":"$y' = 3x^2 - 3 = 0 \\Leftrightarrow x = \\pm 1 \\in [-2; 2]$. Tính $y(-2) = -8 + 6 = -2$, $y(-1) = -1 + 3 = 2$, $y(1) = 1 - 3 = -2$, $y(2) = 8 - 6 = 2$. Vậy $\\max_{[-2;2]} y = 2$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\int_0^1 (2x + 3) dx$ bằng","options":["A. $4$","B. $5$","C. $3$","D. $6$"],"answer":"A","explain":"$\\int_0^1 (2x+3) dx = \\left. (x^2 + 3x) \\right|_0^1 = 1 + 3 = 4$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong không gian $Oxyz$, cho $\\vec{u} = (1; 2; -1)$ và $\\vec{v} = (2; -1; 0)$. Khẳng định nào sau đây đúng?","options":["A. $\\vec{u}$ vuông góc với $\\vec{v}$","B. $\\vec{u}$ cùng phương với $\\vec{v}$","C. $|\\vec{u}| = |\\vec{v}|$","D. $\\vec{u} + \\vec{v} = \\vec{0}$"],"answer":"A","explain":"$\\vec{u} \\cdot \\vec{v} = 1 \\cdot 2 + 2 \\cdot (-1) + (-1) \\cdot 0 = 0$ nên $\\vec{u} \\perp \\vec{v}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Cho hàm số $f(x) = x^2 - 4x + 3$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đạo hàm của hàm số là $f'(x) = 2x - 4$.","b) Hàm số nghịch biến trên khoảng $(-\\infty; 2)$.","c) Hàm số đồng biến trên khoảng $(2; +\\infty)$.","d) Giá trị nhỏ nhất của hàm số trên $\\mathbb{R}$ bằng $-2$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $f'(x) \\lt 0 \\Leftrightarrow x \\lt 2$. c) Đúng: $f'(x) \\gt 0 \\Leftrightarrow x \\gt 2$. d) Sai: $f$ đạt cực tiểu tại $x = 2$, $f(2) = 4 - 8 + 3 = -1 \\neq -2$.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về logarit (với các biểu thức có nghĩa):","statements":["a) $\\log_2 8 = 3$.","b) $\\log_3 27 = 2$.","c) $2^{\\log_2 5} = 5$.","d) $\\ln(e^2) = 2$."],"answer":["T","F","T","T"],"explain":"a) Đúng: $8 = 2^3$. b) Sai: $27 = 3^3$ nên $\\log_3 27 = 3 \\neq 2$. c) Đúng theo định nghĩa logarit. d) Đúng: $\\ln(e^2) = 2\\ln e = 2$.","points":1},{"type":"truefalse","level":"TH","q":"Trong không gian $Oxyz$, cho $A(0; 1; 2)$ và $B(2; -1; 0)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $AB = 2\\sqrt{3}$.","b) Trung điểm của $AB$ là $(1; 0; 1)$.","c) Mặt cầu tâm $A$ bán kính $AB$ có phương trình $x^2 + (y-1)^2 + (z-2)^2 = 12$.","d) Điểm $B$ nằm trong mặt cầu tâm $A$ bán kính $2$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $\\overrightarrow{AB} = (2; -2; -2)$, $AB = \\sqrt{4+4+4} = 2\\sqrt{3}$. b) Đúng. c) Đúng: $R^2 = AB^2 = 12$. d) Sai: $AB = 2\\sqrt{3} \\approx 3,46 \\gt 2$ nên $B$ nằm ngoài mặt cầu bán kính 2.","points":1},{"type":"truefalse","level":"VD","q":"Một lớp học có 30 học sinh gồm 18 nữ và 12 nam, trong đó có 10 nữ và 6 nam đạt danh hiệu học sinh giỏi. Chọn ngẫu nhiên một học sinh đạt danh hiệu học sinh giỏi. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số học sinh đạt danh hiệu học sinh giỏi là $16$.","b) Xác suất để học sinh được chọn là nam bằng $\\frac{3}{8}$.","c) Xác suất để học sinh được chọn là nữ bằng $\\frac{5}{8}$.","d) Biết học sinh được chọn là nam, xác suất để học sinh đó đạt danh hiệu học sinh giỏi bằng $\\frac{1}{3}$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $10 + 6 = 16$. b) Đúng: $\\frac{6}{16} = \\frac{3}{8}$. c) Đúng: $\\frac{10}{16} = \\frac{5}{8}$. d) Sai: trong 12 nam có 6 giỏi nên xác suất $= \\frac{6}{12} = \\frac{1}{2} \\neq \\frac{1}{3}$.","points":1},{"type":"short","level":"VD","q":"Một mảnh đất hình chữ nhật có diện tích $100$ $m^2$. Chu vi nhỏ nhất của mảnh đất bằng bao nhiêu mét?","answer":"40","explain":"Gọi chiều dài $a$, chiều rộng $b$ ($ab = 100$). Chu vi $P = 2(a+b) \\ge 2 \\cdot 2\\sqrt{ab} = 4\\sqrt{100} = 40$ (AM-GM), dấu bằng khi $a = b = 10$. Vậy $P_{\\min} = 40$ m.","points":0.5},{"type":"short","level":"VD","q":"Diện tích hình phẳng giới hạn bởi parabol $y = x^2 - 1$ và trục hoành bằng $\\frac{a}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"7","explain":"Hoành độ giao điểm: $x^2 - 1 = 0 \\Leftrightarrow x = \\pm 1$. Trên $[-1; 1]$, $x^2 - 1 \\le 0$ nên $S = \\int_{-1}^{1} (1 - x^2) dx = \\left. \\left(x - \\frac{x^3}{3}\\right) \\right|_{-1}^{1} = 2\\left(1 - \\frac{1}{3}\\right) = \\frac{4}{3}$. Vậy $a + b = 4 + 3 = 7$.","points":0.5},{"type":"short","level":"TH","q":"Trong không gian $Oxyz$, cho đường thẳng $d: \\frac{x-1}{2} = \\frac{y+1}{-1} = \\frac{z}{3}$. Tung độ của giao điểm của $d$ với mặt phẳng $(Oxy)$ bằng","answer":"-1","explain":"Giao điểm với $(Oxy)$ có $z = 0 \\Rightarrow \\frac{z}{3} = 0$. Đặt $\\frac{x-1}{2} = \\frac{y+1}{-1} = \\frac{z}{3} = t$, với $z = 0$ thì $t = 0$, suy ra $y + 1 = 0 \\Rightarrow y = -1$.","points":0.5},{"type":"short","level":"VD","q":"Bất phương trình $3^{x^2} \\lt 3^{2x}$ có bao nhiêu nghiệm nguyên?","answer":"1","explain":"Vì cơ số $3 \\gt 1$ nên $3^{x^2} \\lt 3^{2x} \\Leftrightarrow x^2 \\lt 2x \\Leftrightarrow x^2 - 2x \\lt 0 \\Leftrightarrow 0 \\lt x \\lt 2$. Số nguyên duy nhất thỏa mãn là $x = 1$. Vậy có 1 nghiệm nguyên.","points":0.5},{"type":"short","level":"VDC","q":"Cho hàm số $f(x) = x^4 - 4x^3 + 2$. Số giao điểm của đồ thị hàm số với đường thẳng $y = -2$ là","answer":"2","explain":"$f'(x) = 4x^3 - 12x^2 = 4x^2(x - 3)$. $f'$ đổi dấu từ âm sang dương duy nhất khi qua $x = 3$ (tại $x = 0$ là nghiệm bội chẵn, không đổi dấu). Vậy $f$ có một điểm cực tiểu tại $x = 3$, $f(3) = 81 - 108 + 2 = -25$. $\\lim_{x \\to \\pm\\infty} f(x) = +\\infty$. Vì $-2 \\gt -25$ nên đường thẳng $y = -2$ cắt đồ thị tại 2 điểm phân biệt.","points":0.5},{"type":"short","level":"VDC","q":"Có bao nhiêu giá trị nguyên của tham số $m$ thuộc đoạn $[-10; 10]$ để hàm số $y = x^3 - 3mx^2 + 3(m^2 - 1)x$ đồng biến trên $\\mathbb{R}$?","answer":"0","explain":"$y' = 3x^2 - 6mx + 3(m^2 - 1)$. Hàm số đồng biến trên $\\mathbb{R}$ $\\Leftrightarrow y' \\ge 0$ với mọi $x$ và $y' = 0$ chỉ tại hữu hạn điểm $\\Leftrightarrow \\Delta' \\le 0$. Tính $\\Delta' = 9m^2 - 9(m^2 - 1) = 9 \\gt 0$ với mọi $m$. Vậy không có giá trị $m$ nào thỏa mãn. Đáp số $0$.","points":0.5}]}]}
