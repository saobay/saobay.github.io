<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Tập xác định của hàm số $y = \\log (x - 3)$ là","options":["A. $(3; +\\infty)$","B. $[3; +\\infty)$","C. $(0; +\\infty)$","D. $\\mathbb{R} \\setminus \\{3\\}$"],"answer":"A","explain":"$x - 3 \\gt 0 \\Leftrightarrow x \\gt 3$. Vậy $D = (3; +\\infty)$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của hàm số $y = 3^x$ là","options":["A. $y' = 3^x \\ln 3$","B. $y' = x \\cdot 3^{x-1}$","C. $y' = \\frac{3^x}{\\ln 3}$","D. $y' = 3^x$"],"answer":"A","explain":"$(a^x)' = a^x \\ln a$ nên $(3^x)' = 3^x \\ln 3$.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm số $y = x^3 - 3x^2 + 2$ có mấy điểm cực trị?","options":["A. $2$","B. $1$","C. $3$","D. $0$"],"answer":"A","explain":"$y' = 3x^2 - 6x = 3x(x - 2) = 0 \\Leftrightarrow x = 0$ hoặc $x = 2$. $y'$ đổi dấu qua cả hai nghiệm đơn nên hàm số có 2 điểm cực trị.","points":0.25},{"type":"mcq","level":"NB","q":"Đồ thị hàm số nào sau đây có tiệm cận ngang là đường thẳng $y = 1$?","options":["A. $y = \\frac{x + 1}{x - 2}$","B. $y = \\frac{2x + 1}{x - 2}$","C. $y = \\frac{x^2 + 1}{x - 2}$","D. $y = x + 1$"],"answer":"A","explain":"Tiệm cận ngang $y = \\frac{a}{c}$: phương án A cho $y = 1$; B cho $y = 2$; C bậc tử lớn hơn bậc mẫu nên không có tiệm cận ngang; D là đường thẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Họ nguyên hàm của hàm số $f(x) = 2\\cos x$ là","options":["A. $2\\sin x + C$","B. $-2\\sin x + C$","C. $2\\tan x + C$","D. $-2\\cos x + C$"],"answer":"A","explain":"$\\int 2\\cos x dx = 2\\sin x + C$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $\\int_0^1 f(x) dx = 4$ và $\\int_0^1 g(x) dx = 1$. Khi đó $\\int_0^1 [f(x) + 2g(x)] dx$ bằng","options":["A. $6$","B. $5$","C. $8$","D. $4$"],"answer":"A","explain":"$\\int_0^1 [f(x) + 2g(x)] dx = 4 + 2 \\cdot 1 = 6$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $A(-1; 2; 5)$ và $B(3; 0; 1)$. Tọa độ trung điểm $I$ của đoạn thẳng $AB$ là","options":["A. $(1; 1; 3)$","B. $(2; -1; -2)$","C. $(1; 2; 3)$","D. $(-2; 1; 2)$"],"answer":"A","explain":"$I = \\left(\\frac{-1+3}{2}; \\frac{2+0}{2}; \\frac{5+1}{2}\\right) = (1; 1; 3)$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $\\vec{a} = (1; -1; 2)$ và $\\vec{b} = (3; 1; 1)$. Tích vô hướng $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $4$","B. $2$","C. $6$","D. $0$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = 1 \\cdot 3 + (-1) \\cdot 1 + 2 \\cdot 1 = 3 - 1 + 2 = 4$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 5$ và $u_2 = 9$. Số hạng $u_3$ bằng","options":["A. $13$","B. $14$","C. $12$","D. $17$"],"answer":"A","explain":"Công sai $d = u_2 - u_1 = 4$ nên $u_3 = u_2 + d = 9 + 4 = 13$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị cực đại của hàm số $y = x^3 - 3x^2 - 9x + 1$ bằng","options":["A. $6$","B. $-26$","C. $1$","D. $-4$"],"answer":"A","explain":"$y' = 3x^2 - 6x - 9 = 3(x^2 - 2x - 3) = 3(x-3)(x+1) = 0 \\Leftrightarrow x = 3$ hoặc $x = -1$. $y'$ đổi dấu từ dương sang âm qua $x = -1$ nên $x = -1$ là điểm cực đại, giá trị cực đại $y(-1) = -1 - 3 + 9 + 1 = 6$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị nhỏ nhất của hàm số $y = x^2 - 2x + 3$ trên đoạn $[0; 3]$ bằng","options":["A. $2$","B. $3$","C. $6$","D. $1$"],"answer":"A","explain":"$y' = 2x - 2 = 0 \\Leftrightarrow x = 1 \\in [0; 3]$. Tính $y(0) = 3$, $y(1) = 1 - 2 + 3 = 2$, $y(3) = 9 - 6 + 3 = 6$. Vậy $\\min_{[0;3]} y = 2$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong không gian $Oxyz$, cho $A(1; 0; -2)$ và $B(3; 2; 0)$. Mặt phẳng đi qua gốc tọa độ $O$ và vuông góc với đường thẳng $AB$ có phương trình là","options":["A. $x + y + z = 0$","B. $x - y - z = 0$","C. $2x + y + z = 0$","D. $x + y - z = 0$"],"answer":"A","explain":"Vectơ pháp tuyến của mặt phẳng là $\\overrightarrow{AB} = (2; 2; 2)$, cùng phương với $(1; 1; 1)$. Mặt phẳng đi qua $O(0; 0; 0)$ có phương trình $1(x-0) + 1(y-0) + 1(z-0) = 0 \\Leftrightarrow x + y + z = 0$.","points":0.25},{"type":"truefalse","level":"NB","q":"Cho tam thức bậc hai $f(x) = x^2 - 5x + 6$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $f(1) = 2$.","b) Phương trình $f(x) = 0$ có hai nghiệm phân biệt.","c) $f(x) \\gt 0$ khi $x \\lt 2$ hoặc $x \\gt 3$.","d) $f(x) \\ge 0$ với mọi $x \\in \\mathbb{R}$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $1 - 5 + 6 = 2$. b) Đúng: $\\Delta = 25 - 24 = 1 \\gt 0$. c) Đúng: $f(x) = (x-2)(x-3) \\gt 0$ khi $x$ nằm ngoài khoảng hai nghiệm. d) Sai: ví dụ $f(2,5) = -0,25 \\lt 0$.","points":1},{"type":"truefalse","level":"TH","q":"Gọi $F(x)$ là một nguyên hàm của $f(x) = 3x^2 + 1$ thỏa mãn $F(0) = 2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $F(x) = x^3 + x + C$ với $C$ là hằng số.","b) Hằng số $C = 2$.","c) $F(1) = 4$.","d) $F(-1) = 2$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $F(0) = C = 2$. c) Đúng: $F(1) = 1 + 1 + 2 = 4$. d) Sai: $F(-1) = -1 - 1 + 2 = 0 \\neq 2$.","points":1},{"type":"truefalse","level":"TH","q":"Trong không gian $Oxyz$, cho đường thẳng $d$ đi qua $M(1; -1; 2)$ và vuông góc với mặt phẳng $(P): x + 2y - 3z + 1 = 0$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vectơ $\\vec{u} = (1; 2; -3)$ là một vectơ chỉ phương của $d$.","b) Phương trình tham số của $d$ là $\\begin{cases} x = 1 + t \\\\ y = -1 + 2t \\\\ z = 2 - 3t \\end{cases} (t \\in \\mathbb{R})$.","c) Điểm $N(2; 1; -1)$ thuộc đường thẳng $d$.","d) Đường thẳng $d$ song song với trục $Oz$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $d \\perp (P)$ nên vectơ pháp tuyến của $(P)$ là vectơ chỉ phương của $d$. b) Đúng. c) Đúng: với $t = 1$ được $(2; 1; -1)$. d) Sai: vectơ chỉ phương $(1; 2; -3)$ không cùng phương với $(0; 0; 1)$.","points":1},{"type":"truefalse","level":"VD","q":"Tung hai con xúc xắc cân đối. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số phần tử của không gian mẫu bằng $36$.","b) Xác suất để tổng số chấm bằng $7$ là $\\frac{1}{6}$.","c) Xác suất để tổng số chấm lớn hơn $10$ là $\\frac{1}{9}$.","d) Xác suất để tích số chấm bằng $12$ là $\\frac{1}{9}$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $6 \\cdot 6 = 36$. b) Đúng: các cặp $(1;6), (2;5), (3;4), (4;3), (5;2), (6;1)$: $6/36 = 1/6$. c) Sai: tổng $\\gt 10$ gồm $(5;6), (6;5), (6;6)$: $3/36 = 1/12 \\neq 1/9$. d) Đúng: tích $= 12$ gồm $(2;6), (6;2), (3;4), (4;3)$: $4/36 = 1/9$.","points":1},{"type":"short","level":"VD","q":"Một bể cá hình hộp chữ nhật không nắp có đáy là hình vuông cạnh $x$ (m), chiều cao $h$ (m) và thể tích $32$ $m^3$. Diện tích vật liệu (tính cả đáy) nhỏ nhất để làm bể bằng bao nhiêu $m^2$?","answer":"48","explain":"Thể tích $x^2 h = 32 \\Rightarrow h = \\frac{32}{x^2}$. Diện tích vật liệu $S(x) = x^2 + 4xh = x^2 + \\frac{128}{x}$ ($x \\gt 0$). $S'(x) = 2x - \\frac{128}{x^2} = 0 \\Leftrightarrow x^3 = 64 \\Leftrightarrow x = 4$. $S_{\\min} = 16 + 32 = 48$ m².","points":0.5},{"type":"short","level":"VD","q":"Diện tích hình phẳng giới hạn bởi đồ thị hàm số $y = \\ln x$, trục hoành và hai đường thẳng $x = 1$, $x = e$ bằng","answer":"1","explain":"$S = \\int_1^e |\\ln x| dx = \\int_1^e \\ln x dx$ (vì $\\ln x \\ge 0$ trên $[1; e]$). $\\int \\ln x dx = x\\ln x - x + C$ nên $S = \\left. (x\\ln x - x) \\right|_1^e = (e - e) - (0 - 1) = 1$.","points":0.5},{"type":"short","level":"VD","q":"Tích các nghiệm của phương trình $\\log_2 (x^2 - 1) = 3$ bằng","answer":"-9","explain":"Điều kiện $x^2 - 1 \\gt 0 \\Leftrightarrow |x| \\gt 1$. Phương trình $\\Leftrightarrow x^2 - 1 = 2^3 = 8 \\Leftrightarrow x^2 = 9 \\Leftrightarrow x = \\pm 3$ (cả hai đều thỏa điều kiện). Tích các nghiệm $= 3 \\cdot (-3) = -9$.","points":0.5},{"type":"short","level":"VDC","q":"Cho hàm số $y = \\frac{2x + 1}{x - 1}$ có đồ thị $(C)$. Có bao nhiêu điểm $M$ thuộc $(C)$ có tọa độ nguyên?","answer":"4","explain":"Với $x \\neq 1$: $y = \\frac{2x+1}{x-1} = 2 + \\frac{3}{x-1}$. $M$ có tọa độ nguyên $\\Leftrightarrow x - 1$ là ước nguyên của $3$, tức $x - 1 \\in \\{\\pm 1; \\pm 3\\}$. Có 4 giá trị $x$ tương ứng, mỗi giá trị cho một điểm $M$. Vậy có 4 điểm.","points":0.5},{"type":"short","level":"VDC","q":"Có bao nhiêu số tự nhiên có 4 chữ số khác nhau chia hết cho $5$?","answer":"952","explain":"Số có dạng $\\overline{abcd}$, $a \\neq 0$, các chữ số khác nhau, $d \\in \\{0; 5\\}$. Trường hợp $d = 0$: $a$ có 9 cách, $b$ có 8 cách, $c$ có 7 cách $\\Rightarrow 9 \\cdot 8 \\cdot 7 = 504$ số. Trường hợp $d = 5$: $a$ có 8 cách (khác 0 và 5), $b$ có 8 cách, $c$ có 7 cách $\\Rightarrow 8 \\cdot 8 \\cdot 7 = 448$ số. Tổng $504 + 448 = 952$ số.","points":0.5},{"type":"short","level":"VDC","q":"Cho cấp số nhân $(u_n)$ có công bội dương thỏa mãn $u_2 = 6$ và $u_4 = 54$. Tổng của 5 số hạng đầu tiên của cấp số nhân đó bằng","answer":"242","explain":"$u_4 = u_2 q^2 \\Rightarrow q^2 = 9$, $q \\gt 0$ nên $q = 3$. Suy ra $u_1 = \\frac{u_2}{q} = 2$. Tổng $S_5 = u_1 \\cdot \\frac{q^5 - 1}{q - 1} = 2 \\cdot \\frac{243 - 1}{2} = 242$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Tập xác định của hàm số $y = \\frac{3x}{x^2 - 9}$ là","options":["A. $D = \\mathbb{R} \\setminus \\{-3; 3\\}$","B. $D = \\mathbb{R} \\setminus \\{3\\}$","C. $D = \\mathbb{R}$","D. $D = (-3; 3)$"],"answer":"A","explain":"$x^2 - 9 \\neq 0 \\Leftrightarrow x \\neq \\pm 3$. Vậy $D = \\mathbb{R} \\setminus \\{-3; 3\\}$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của hàm số $y = \\cos 2x$ là","options":["A. $y' = -2\\sin 2x$","B. $y' = 2\\sin 2x$","C. $y' = -\\sin 2x$","D. $y' = -2\\cos 2x$"],"answer":"A","explain":"$(\\cos u)' = -u' \\sin u$ với $u = 2x$: $y' = -2\\sin 2x$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hàm số $y = x^4 + 1$. Khẳng định nào sau đây đúng?","options":["A. Hàm số đồng biến trên khoảng $(0; +\\infty)$","B. Hàm số nghịch biến trên khoảng $(0; +\\infty)$","C. Hàm số đồng biến trên $\\mathbb{R}$","D. Hàm số nghịch biến trên $\\mathbb{R}$"],"answer":"A","explain":"$y' = 4x^3$. $y' \\gt 0 \\Leftrightarrow x \\gt 0$ nên hàm số đồng biến trên $(0; +\\infty)$ (và nghịch biến trên $(-\\infty; 0)$).","points":0.25},{"type":"mcq","level":"NB","q":"Tiệm cận ngang của đồ thị hàm số $y = \\frac{1}{x + 5}$ là đường thẳng","options":["A. $y = 0$","B. $y = 1$","C. $x = -5$","D. $y = 5$"],"answer":"A","explain":"$\\lim_{x \\to \\pm\\infty} \\frac{1}{x+5} = 0$ nên tiệm cận ngang là $y = 0$ (trục hoành).","points":0.25},{"type":"mcq","level":"NB","q":"Họ nguyên hàm của hàm số $f(x) = e^{3x}$ là","options":["A. $\\frac{e^{3x}}{3} + C$","B. $3e^{3x} + C$","C. $e^{3x} + C$","D. $\\frac{e^{x}}{3} + C$"],"answer":"A","explain":"$\\int e^{3x} dx = \\frac{e^{3x}}{3} + C$ (đặt $u = 3x$).","points":0.25},{"type":"mcq","level":"NB","q":"Cho $\\int_2^5 f(x) dx = 10$. Khi đó $\\int_2^5 \\frac{1}{2} f(x) dx$ bằng","options":["A. $5$","B. $20$","C. $10$","D. $\\frac{5}{2}$"],"answer":"A","explain":"$\\int_2^5 \\frac{1}{2} f(x) dx = \\frac{1}{2} \\cdot 10 = 5$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $A(3; -1; 2)$ và $B(1; 2; 0)$. Tọa độ vectơ $\\overrightarrow{AB}$ là","options":["A. $(-2; 3; -2)$","B. $(2; -3; 2)$","C. $(4; 1; 2)$","D. $(-2; -3; -2)$"],"answer":"A","explain":"$\\overrightarrow{AB} = (1-3; 2-(-1); 0-2) = (-2; 3; -2)$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, điểm đối xứng của $M(1; -2; 3)$ qua mặt phẳng $(Oxy)$ là điểm","options":["A. $(1; -2; -3)$","B. $(-1; 2; 3)$","C. $(1; -2; 3)$","D. $(1; 2; -3)$"],"answer":"A","explain":"Đối xứng qua $(Oxy)$ thì đổi dấu cao độ: $(1; -2; -3)$.","points":0.25},{"type":"mcq","level":"NB","q":"Nghiệm dương nhỏ nhất của phương trình $2\\cos x - \\sqrt{3} = 0$ là","options":["A. $\\frac{\\pi}{6}$","B. $\\frac{\\pi}{3}$","C. $\\frac{5\\pi}{6}$","D. $\\frac{\\pi}{2}$"],"answer":"A","explain":"$\\cos x = \\frac{\\sqrt{3}}{2} \\Leftrightarrow x = \\pm \\frac{\\pi}{6} + k2\\pi$. Nghiệm dương nhỏ nhất là $x = \\frac{\\pi}{6}$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị cực tiểu của hàm số $y = x^4 - 4x^2 + 3$ bằng","options":["A. $-1$","B. $3$","C. $0$","D. $-5$"],"answer":"A","explain":"$y' = 4x^3 - 8x = 4x(x^2 - 2) = 0 \\Leftrightarrow x = 0$ hoặc $x = \\pm\\sqrt{2}$. $y'$ đổi dấu từ âm sang dương qua $x = \\pm\\sqrt{2}$ nên đó là hai điểm cực tiểu, giá trị cực tiểu $y(\\pm\\sqrt{2}) = 4 - 8 + 3 = -1$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị lớn nhất của hàm số $y = -x^2 + 4x - 1$ trên $\\mathbb{R}$ bằng","options":["A. $3$","B. $5$","C. $-1$","D. $4$"],"answer":"A","explain":"Parabol bề lõm quay xuống, đạt cực đại tại $x = -\\frac{b}{2a} = 2$: $y(2) = -4 + 8 - 1 = 3$. Vậy $\\max_{\\mathbb{R}} y = 3$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong không gian $Oxyz$, khoảng cách giữa hai mặt phẳng song song $(P): x + y + z - 1 = 0$ và $(Q): x + y + z - 4 = 0$ bằng","options":["A. $\\sqrt{3}$","B. $3$","C. $\\frac{3}{\\sqrt{2}}$","D. $1$"],"answer":"A","explain":"Lấy $M(1; 0; 0) \\in (P)$. $d((P), (Q)) = d(M, (Q)) = \\frac{|1 + 0 + 0 - 4|}{\\sqrt{1+1+1}} = \\frac{3}{\\sqrt{3}} = \\sqrt{3}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Cho hàm số $y = x^3 - 2x^2 + x - 1$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đạo hàm của hàm số là $y' = 3x^2 - 4x + 1$.","b) $y'(0) = 1$.","c) $y'(1) = 0$.","d) $y'(2) = 4$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $y'(0) = 1$. c) Đúng: $3 - 4 + 1 = 0$. d) Sai: $y'(2) = 12 - 8 + 1 = 5 \\neq 4$.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\int_0^1 e^x dx = e - 1$.","b) $\\int_0^1 x dx = \\frac{1}{2}$.","c) $\\int_0^1 (e^x + x) dx = e$.","d) $\\int_0^1 (e^x - x) dx = e - \\frac{3}{2}$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $\\left. e^x \\right|_0^1 = e - 1$. b) Đúng: $\\left. \\frac{x^2}{2} \\right|_0^1 = \\frac{1}{2}$. c) Sai: tổng $= (e-1) + \\frac{1}{2} = e - \\frac{1}{2} \\neq e$. d) Đúng: $(e-1) - \\frac{1}{2} = e - \\frac{3}{2}$.","points":1},{"type":"truefalse","level":"TH","q":"Trong không gian $Oxyz$, cho mặt cầu $(S): (x-2)^2 + (y+1)^2 + z^2 = 9$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tâm của mặt cầu $(S)$ là $I(2; -1; 0)$.","b) Bán kính của mặt cầu $(S)$ bằng $3$.","c) Điểm $M(2; -1; 3)$ thuộc mặt cầu $(S)$.","d) Điểm $N(5; -1; 0)$ nằm trong mặt cầu $(S)$."],"answer":["T","T","T","F"],"explain":"a), b) Đúng theo phương trình chính tắc. c) Đúng: $(2-2)^2 + 0 + 3^2 = 9$. d) Sai: $IN = 3 = R$ nên $N$ nằm trên mặt cầu, không nằm trong.","points":1},{"type":"truefalse","level":"VD","q":"Một hộp có 8 chính phẩm và 2 phế phẩm. Lấy ngẫu nhiên 2 sản phẩm từ hộp (không hoàn lại). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số phần tử của không gian mẫu bằng $45$.","b) Xác suất để lấy được 2 chính phẩm bằng $\\frac{14}{45}$.","c) Xác suất để lấy được 1 chính phẩm và 1 phế phẩm bằng $\\frac{16}{45}$.","d) Xác suất để lấy được ít nhất 1 phế phẩm bằng $\\frac{17}{45}$."],"answer":["T","F","T","T"],"explain":"a) Đúng: $C_{10}^2 = 45$. b) Sai: $\\frac{C_8^2}{45} = \\frac{28}{45} \\neq \\frac{14}{45}$. c) Đúng: $\\frac{8 \\cdot 2}{45} = \\frac{16}{45}$. d) Đúng: $1 - \\frac{28}{45} = \\frac{17}{45}$.","points":1},{"type":"short","level":"VD","q":"Người ta cần xây một bể chứa hình hộp chữ nhật không nắp, đáy là hình vuông, thể tích $500$ $m^3$. Chiều cao của bể bằng bao nhiêu mét để diện tích vật liệu làm bể là nhỏ nhất?","answer":"5","explain":"Gọi cạnh đáy $x$ (m), chiều cao $h$ (m). $x^2 h = 500 \\Rightarrow h = \\frac{500}{x^2}$. Diện tích vật liệu $S = x^2 + 4xh = x^2 + \\frac{2000}{x}$. $S'(x) = 2x - \\frac{2000}{x^2} = 0 \\Leftrightarrow x^3 = 1000 \\Leftrightarrow x = 10$. Khi đó $h = \\frac{500}{100} = 5$ m.","points":0.5},{"type":"short","level":"VD","q":"Diện tích hình phẳng giới hạn bởi đồ thị hàm số $y = x^3$, trục hoành và hai đường thẳng $x = -1$, $x = 1$ bằng $\\frac{a}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"3","explain":"Do tính đối xứng, $S = \\int_{-1}^{1} |x^3| dx = 2\\int_0^1 x^3 dx = 2 \\cdot \\left. \\frac{x^4}{4} \\right|_0^1 = \\frac{1}{2}$. Vậy $a + b = 1 + 2 = 3$.","points":0.5},{"type":"short","level":"VD","q":"Trong không gian $Oxyz$, cho $A(1; 1; 1)$, $B(2; 3; 4)$, $C(0; 1; 2)$. Bình phương diện tích tam giác $ABC$ bằng","answer":"6","explain":"$\\overrightarrow{AB} = (1; 2; 3)$, $\\overrightarrow{AC} = (-1; 0; 1)$. $\\overrightarrow{AB} \\times \\overrightarrow{AC} = (2 \\cdot 1 - 3 \\cdot 0; 3 \\cdot (-1) - 1 \\cdot 1; 1 \\cdot 0 - 2 \\cdot (-1)) = (2; -4; 2)$. $S_{ABC} = \\frac{1}{2}|\\overrightarrow{AB} \\times \\overrightarrow{AC}| = \\frac{1}{2}\\sqrt{4+16+4} = \\frac{\\sqrt{24}}{2} = \\sqrt{6}$. Vậy $S^2 = 6$.","points":0.5},{"type":"short","level":"VDC","q":"Có bao nhiêu giá trị nguyên của tham số $m$ thuộc đoạn $[-5; 5]$ để hàm số $y = x^3 - 3mx^2 + 3(m^2 - 1)x$ có hai điểm cực trị?","answer":"11","explain":"$y' = 3x^2 - 6mx + 3(m^2-1)$. Hàm số có hai điểm cực trị $\\Leftrightarrow y' = 0$ có hai nghiệm phân biệt $\\Leftrightarrow \\Delta' \\gt 0$. Tính $\\Delta' = 9m^2 - 9(m^2-1) = 9 \\gt 0$ với mọi $m$. Vậy mọi giá trị $m$ đều thỏa mãn; trong đoạn $[-5; 5]$ có $11$ số nguyên. Đáp số $11$.","points":0.5},{"type":"short","level":"VDC","q":"Có bao nhiêu giá trị nguyên của tham số $m$ thuộc đoạn $[-5; 5]$ để bất phương trình $x^2 - 2x + m \\gt 0$ nghiệm đúng với mọi $x \\in \\mathbb{R}$?","answer":"4","explain":"Tam thức $x^2 - 2x + m \\gt 0$ với mọi $x$ $\\Leftrightarrow \\Delta' = 1 - m \\lt 0 \\Leftrightarrow m \\gt 1$. Các giá trị nguyên trong $[-5; 5]$: $m \\in \\{2; 3; 4; 5\\}$, có 4 giá trị.","points":0.5},{"type":"short","level":"VDC","q":"Từ các chữ số $1, 2, 3, 4, 5$ lập được bao nhiêu số tự nhiên có 3 chữ số khác nhau và chia hết cho $3$?","answer":"24","explain":"Số chia hết cho 3 $\\Leftrightarrow$ tổng 3 chữ số chia hết cho 3. Các bộ 3 chữ số khác nhau từ $\\{1;2;3;4;5\\}$ có tổng chia hết cho 3: $\\{1;2;3\\}$ (tổng 6), $\\{1;3;5\\}$ (tổng 9), $\\{2;3;4\\}$ (tổng 9), $\\{3;4;5\\}$ (tổng 12). Mỗi bộ cho $3! = 6$ số. Tổng $4 \\cdot 6 = 24$ số.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Tập xác định của hàm số $y = \\sqrt{2x + 6}$ là","options":["A. $[-3; +\\infty)$","B. $(-3; +\\infty)$","C. $(-\\infty; -3]$","D. $\\mathbb{R}$"],"answer":"A","explain":"$2x + 6 \\ge 0 \\Leftrightarrow x \\ge -3$. Vậy $D = [-3; +\\infty)$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của hàm số $y = \\tan x$ $\\left(x \\neq \\frac{\\pi}{2} + k\\pi\\right)$ là","options":["A. $y' = \\frac{1}{\\cos^2 x}$","B. $y' = -\\frac{1}{\\cos^2 x}$","C. $y' = \\frac{1}{\\sin^2 x}$","D. $y' = \\cot x$"],"answer":"A","explain":"$(\\tan x)' = 1 + \\tan^2 x = \\frac{1}{\\cos^2 x}$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hàm số $y = f(x)$ có đạo hàm $f'(x) = (2 - x)(x + 3)$. Hàm số $f(x)$ đồng biến trên khoảng nào sau đây?","options":["A. $(-3; 2)$","B. $(2; +\\infty)$","C. $(-\\infty; -3)$","D. $(-3; +\\infty)$"],"answer":"A","explain":"$f'(x) \\gt 0 \\Leftrightarrow (2-x)(x+3) \\gt 0 \\Leftrightarrow -3 \\lt x \\lt 2$. Vậy hàm số đồng biến trên $(-3; 2)$.","points":0.25},{"type":"mcq","level":"NB","q":"Đồ thị hàm số $y = \\frac{2x - 1}{x + 3}$ có tổng số đường tiệm cận đứng và tiệm cận ngang bằng","options":["A. $2$","B. $1$","C. $3$","D. $0$"],"answer":"A","explain":"Tiệm cận đứng $x = -3$, tiệm cận ngang $y = 2$. Tổng số là $2$.","points":0.25},{"type":"mcq","level":"NB","q":"Họ nguyên hàm của hàm số $f(x) = \\sin 2x$ là","options":["A. $-\\frac{\\cos 2x}{2} + C$","B. $\\frac{\\cos 2x}{2} + C$","C. $-2\\cos 2x + C$","D. $\\cos 2x + C$"],"answer":"A","explain":"$\\int \\sin 2x dx = -\\frac{\\cos 2x}{2} + C$ (đặt $u = 2x$).","points":0.25},{"type":"mcq","level":"NB","q":"Cho $\\int_{-2}^{0} f(x) dx = 3$ và $\\int_{0}^{2} f(x) dx = 5$. Khi đó $\\int_{-2}^{2} f(x) dx$ bằng","options":["A. $8$","B. $2$","C. $15$","D. $-2$"],"answer":"A","explain":"$\\int_{-2}^{2} f(x) dx = \\int_{-2}^{0} f(x) dx + \\int_{0}^{2} f(x) dx = 3 + 5 = 8$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $\\vec{a} = (2; 1; -3)$. Tọa độ của vectơ $2\\vec{a}$ là","options":["A. $(4; 2; -6)$","B. $(1; \\frac{1}{2}; -\\frac{3}{2})$","C. $(4; 1; -3)$","D. $(2; 2; -6)$"],"answer":"A","explain":"$2\\vec{a} = (2 \\cdot 2; 2 \\cdot 1; 2 \\cdot (-3)) = (4; 2; -6)$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, mặt cầu tâm $O(0; 0; 0)$ bán kính $R = 5$ có phương trình là","options":["A. $x^2 + y^2 + z^2 = 25$","B. $x^2 + y^2 + z^2 = 5$","C. $(x-5)^2 + (y-5)^2 + (z-5)^2 = 25$","D. $x + y + z = 5$"],"answer":"A","explain":"Phương trình mặt cầu tâm $O$ bán kính $R$: $x^2 + y^2 + z^2 = R^2 = 25$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$ và công sai $d = 3$. Tổng của 4 số hạng đầu tiên bằng","options":["A. $26$","B. $20$","C. $29$","D. $14$"],"answer":"A","explain":"$S_4 = \\frac{4}{2}[2u_1 + 3d] = 2(4 + 9) = 26$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị cực đại của hàm số $y = \\frac{x^2 + 1}{x}$ $(x \\neq 0)$ bằng","options":["A. $-2$","B. $2$","C. $0$","D. $1$"],"answer":"A","explain":"$y' = \\frac{2x \\cdot x - (x^2+1)}{x^2} = \\frac{x^2 - 1}{x^2} = 0 \\Leftrightarrow x = \\pm 1$. $y'$ đổi dấu từ dương sang âm qua $x = -1$ nên $x = -1$ là điểm cực đại, giá trị cực đại $y(-1) = \\frac{2}{-1} = -2$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị lớn nhất của hàm số $y = x + \\sqrt{4 - x^2}$ bằng","options":["A. $2\\sqrt{2}$","B. $2$","C. $4$","D. $\\sqrt{2}$"],"answer":"A","explain":"Điều kiện $-2 \\le x \\le 2$. $y' = 1 - \\frac{x}{\\sqrt{4-x^2}} = 0 \\Leftrightarrow \\sqrt{4-x^2} = x \\Leftrightarrow x = \\sqrt{2}$ (với $x \\ge 0$). Tính $y(-2) = -2$, $y(\\sqrt{2}) = 2\\sqrt{2}$, $y(2) = 2$. Vậy $\\max y = 2\\sqrt{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong không gian $Oxyz$, cho $A(1; -2; 1)$ và vectơ $\\vec{n} = (3; 1; -2)$. Phương trình mặt phẳng đi qua $A$ và nhận $\\vec{n}$ làm vectơ pháp tuyến là","options":["A. $3x + y - 2z + 1 = 0$","B. $3x + y - 2z - 1 = 0$","C. $x - 2y + z + 1 = 0$","D. $3x - y + 2z + 1 = 0$"],"answer":"A","explain":"$3(x-1) + 1(y+2) - 2(z-1) = 0 \\Leftrightarrow 3x - 3 + y + 2 - 2z + 2 = 0 \\Leftrightarrow 3x + y - 2z + 1 = 0$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $2^3 = 8$.","b) $3^{-1} = \\frac{1}{3}$.","c) $\\sqrt[3]{27} = 3$.","d) $5^0 = 0$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $2^3 = 8$. b) Đúng: $3^{-1} = \\frac{1}{3}$. c) Đúng: $3^3 = 27$. d) Sai: $5^0 = 1 \\neq 0$ (mọi số khác 0 mũ 0 đều bằng 1).","points":1},{"type":"truefalse","level":"TH","q":"Cho hàm số $y = \\frac{2x - 1}{x + 1}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tập xác định của hàm số là $D = \\mathbb{R} \\setminus \\{-1\\}$.","b) Đạo hàm của hàm số là $y' = \\frac{1}{(x+1)^2}$.","c) Hàm số đồng biến trên từng khoảng xác định.","d) Đồ thị hàm số có tâm đối xứng là điểm $(-1; 2)$."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: $y' = \\frac{2(x+1) - (2x-1)}{(x+1)^2} = \\frac{3}{(x+1)^2}$. c) Đúng: $y' = \\frac{3}{(x+1)^2} \\gt 0$ trên từng khoảng xác định. d) Đúng: giao điểm hai tiệm cận $(-1; 2)$ là tâm đối xứng.","points":1},{"type":"truefalse","level":"TH","q":"Trong không gian $Oxyz$, cho mặt phẳng $(P): x - 2y + 2z - 6 = 0$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vectơ $\\vec{n} = (1; -2; 2)$ là một vectơ pháp tuyến của $(P)$.","b) Khoảng cách từ gốc tọa độ $O$ đến $(P)$ bằng $2$.","c) Điểm $A(2; 0; 2)$ thuộc mặt phẳng $(P)$.","d) Điểm $B(0; 1; 1)$ thuộc mặt phẳng $(P)$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $d(O,(P)) = \\frac{|-6|}{\\sqrt{1+4+4}} = \\frac{6}{3} = 2$. c) Đúng: $2 - 0 + 4 - 6 = 0$. d) Sai: $0 - 2 + 2 - 6 = -6 \\neq 0$.","points":1},{"type":"truefalse","level":"VD","q":"Một hộp có 5 thẻ đỏ và 3 thẻ xanh. Rút ngẫu nhiên 2 thẻ từ hộp (không hoàn lại). Gọi $A$ là biến cố cả 2 thẻ đều đỏ, $B$ là biến cố có ít nhất 1 thẻ xanh. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $P(A) = \\frac{5}{16}$.","b) $P(B) = \\frac{9}{14}$.","c) Hai biến cố $A$ và $B$ xung khắc.","d) $P(A \\cup B) = 1$."],"answer":["F","T","T","T"],"explain":"a) Sai: $P(A) = \\frac{C_5^2}{C_8^2} = \\frac{10}{28} = \\frac{5}{14} \\neq \\frac{5}{16}$. b) Đúng: $P(B) = 1 - P(A) = \\frac{9}{14}$. c) Đúng: $A$ và $B$ không thể đồng thời xảy ra. d) Đúng: $A \\cup B$ là biến cố chắc chắn (rút 2 thẻ thì hoặc cả 2 đỏ, hoặc có ít nhất 1 xanh).","points":1},{"type":"short","level":"VD","q":"Một mảnh đất hình chữ nhật có chu vi $20$ m. Bình phương độ dài đường chéo nhỏ nhất của mảnh đất bằng bao nhiêu $m^2$?","answer":"50","explain":"Gọi chiều dài $a$, chiều rộng $b$: $a + b = 10$. Đường chéo $d = \\sqrt{a^2 + b^2} \\ge \\frac{a+b}{\\sqrt{2}} = \\frac{10}{\\sqrt{2}} = 5\\sqrt{2}$ (vì $a^2 + b^2 \\ge \\frac{(a+b)^2}{2}$), dấu bằng khi $a = b = 5$. Vậy $d^2_{\\min} = 50$.","points":0.5},{"type":"short","level":"VD","q":"$\\int_0^1 x e^{x^2} dx = \\frac{e - a}{b}$ với $a, b$ là các số nguyên dương. Tính $a + b$.","answer":"3","explain":"Đặt $t = x^2 \\Rightarrow dt = 2x dx$; $x = 0 \\Rightarrow t = 0$, $x = 1 \\Rightarrow t = 1$. Tích phân $= \\frac{1}{2}\\int_0^1 e^t dt = \\frac{1}{2}(e - 1) = \\frac{e-1}{2}$. Vậy $a = 1$, $b = 2$, $a + b = 3$.","points":0.5},{"type":"short","level":"VD","q":"Tổng các nghiệm của phương trình $\\log_3 (x - 2) + \\log_3 (x - 4) = 1$ bằng","answer":"5","explain":"Điều kiện $x \\gt 4$. Phương trình $\\Leftrightarrow \\log_3[(x-2)(x-4)] = 1 \\Leftrightarrow x^2 - 6x + 8 = 3 \\Leftrightarrow x^2 - 6x + 5 = 0 \\Leftrightarrow x = 1$ (loại) hoặc $x = 5$ (nhận). Tổng các nghiệm $= 5$.","points":0.5},{"type":"short","level":"VDC","q":"Cho hàm số $y = -x^3 + 3x^2 - 2$. Số giao điểm của đồ thị hàm số với trục hoành là","answer":"3","explain":"$y' = -3x^2 + 6x = -3x(x - 2) = 0 \\Leftrightarrow x = 0$ hoặc $x = 2$. Hàm số đạt cực tiểu tại $x = 0$ ($y(0) = -2 \\lt 0$) và cực đại tại $x = 2$ ($y(2) = -8 + 12 - 2 = 2 \\gt 0$). Giá trị cực đại và cực tiểu trái dấu nên đồ thị cắt trục hoành tại 3 điểm phân biệt.","points":0.5},{"type":"short","level":"VDC","q":"Có bao nhiêu số nguyên $m$ thuộc đoạn $[0; 20]$ để phương trình $4^x - m \\cdot 2^x + m + 2 = 0$ có hai nghiệm phân biệt?","answer":"15","explain":"Đặt $t = 2^x$ ($t \\gt 0$): $t^2 - mt + m + 2 = 0$. Phương trình có hai nghiệm $x$ phân biệt $\\Leftrightarrow$ phương trình ẩn $t$ có hai nghiệm dương phân biệt $\\Leftrightarrow \\begin{cases} \\Delta = m^2 - 4m - 8 \\gt 0 \\\\ S = m \\gt 0 \\\\ P = m + 2 \\gt 0 \\end{cases} \\Leftrightarrow m \\gt 2 + 2\\sqrt{3} \\approx 5,46$. Các số nguyên $m \\in [0; 20]$ thỏa mãn: $6, 7, \\dots, 20$, có $15$ giá trị.","points":0.5},{"type":"short","level":"VDC","q":"Trong không gian $Oxyz$, cho điểm $A(2; 3; 1)$ và đường thẳng $d: \\frac{x}{1} = \\frac{y}{1} = \\frac{z - 1}{2}$. Gọi $H$ là hình chiếu của $A$ lên $d$. Tổng các tọa độ của điểm $H$ bằng $\\frac{a}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"16","explain":"$H \\in d$ nên $H(t; t; 1 + 2t)$. $\\overrightarrow{AH} = (t-2; t-3; 2t)$. $AH \\perp d$ với vectơ chỉ phương $\\vec{u} = (1; 1; 2)$: $(t-2) + (t-3) + 2(2t) = 0 \\Leftrightarrow 6t - 5 = 0 \\Leftrightarrow t = \\frac{5}{6}$. Suy ra $H\\left(\\frac{5}{6}; \\frac{5}{6}; \\frac{8}{3}\\right)$. Tổng các tọa độ $= \\frac{5}{6} + \\frac{5}{6} + \\frac{8}{3} = \\frac{13}{3}$. Vậy $a + b = 13 + 3 = 16$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tập xác định của hàm số $y = \\frac{2}{\\sqrt{x - 1}}$ là","options":["A. $(1; +\\infty)$","B. $[1; +\\infty)$","C. $(0; +\\infty)$","D. $\\mathbb{R} \\setminus \\{1\\}$"],"answer":"A","explain":"Cần $x - 1 \\gt 0$ (vừa để căn thức xác định vừa để mẫu khác 0) $\\Leftrightarrow x \\gt 1$. Vậy $D = (1; +\\infty)$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của hàm số $y = x^2 e^x$ là","options":["A. $y' = e^x (x^2 + 2x)$","B. $y' = 2xe^x$","C. $y' = x^2 e^x$","D. $y' = e^x (2x + 1)$"],"answer":"A","explain":"$y' = (x^2)' e^x + x^2 (e^x)' = 2x e^x + x^2 e^x = e^x (x^2 + 2x)$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hàm số $y = -x^4 + 2x^2$. Hàm số nghịch biến trên khoảng nào sau đây?","options":["A. $(1; +\\infty)$","B. $(-1; 0)$","C. $(-\\infty; -1)$","D. $(0; 1)$"],"answer":"A","explain":"$y' = -4x^3 + 4x = -4x(x^2 - 1)$. Xét dấu: $y' \\lt 0$ khi $x \\in (-1; 0) \\cup (1; +\\infty)$. Trong các phương án, $(1; +\\infty)$ đúng.","points":0.25},{"type":"mcq","level":"NB","q":"Tiệm cận đứng của đồ thị hàm số $y = \\frac{3x^2 + 1}{x}$ là đường thẳng","options":["A. $x = 0$","B. $y = 0$","C. $x = 3$","D. $y = 3x$"],"answer":"A","explain":"Mẫu số bằng 0 tại $x = 0$ (tử tại $x = 0$ bằng $1 \\neq 0$) nên tiệm cận đứng là $x = 0$ (trục tung).","points":0.25},{"type":"mcq","level":"NB","q":"Họ nguyên hàm của hàm số $f(x) = x^3 + \\frac{1}{x}$ $(x \\neq 0)$ là","options":["A. $\\frac{x^4}{4} + \\ln|x| + C$","B. $3x^2 - \\frac{1}{x^2} + C$","C. $\\frac{x^4}{4} + \\ln x + C$","D. $x^4 + \\frac{1}{x^2} + C$"],"answer":"A","explain":"$\\int x^3 dx = \\frac{x^4}{4} + C_1$, $\\int \\frac{1}{x} dx = \\ln|x| + C_2$. Cộng lại được $\\frac{x^4}{4} + \\ln|x| + C$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $\\int_0^2 f(x) dx = 6$. Khi đó $\\int_0^2 [f(x) - x] dx$ bằng","options":["A. $4$","B. $8$","C. $6$","D. $2$"],"answer":"A","explain":"$\\int_0^2 [f(x) - x] dx = 6 - \\int_0^2 x dx = 6 - \\left. \\frac{x^2}{2} \\right|_0^2 = 6 - 2 = 4$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $\\vec{a} = (1; 2; 3)$. Độ dài của vectơ $\\vec{a}$ bằng","options":["A. $\\sqrt{14}$","B. $6$","C. $\\sqrt{6}$","D. $14$"],"answer":"A","explain":"$|\\vec{a}| = \\sqrt{1^2 + 2^2 + 3^2} = \\sqrt{14}$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $A(2; -1; 0)$ và $B(0; 1; 2)$. Tọa độ trung điểm $I$ của đoạn thẳng $AB$ là","options":["A. $(1; 0; 1)$","B. $(2; 0; 2)$","C. $(1; -1; 1)$","D. $(-1; 1; 1)$"],"answer":"A","explain":"$I = \\left(\\frac{2+0}{2}; \\frac{-1+1}{2}; \\frac{0+2}{2}\\right) = (1; 0; 1)$.","points":0.25},{"type":"mcq","level":"NB","q":"Gieo một con xúc xắc cân đối. Xác suất để mặt xuất hiện có số chấm lẻ bằng","options":["A. $\\frac{1}{2}$","B. $\\frac{1}{3}$","C. $\\frac{1}{6}$","D. $\\frac{2}{3}$"],"answer":"A","explain":"Các mặt lẻ: $1, 3, 5$ (3 mặt trên tổng 6 mặt). Xác suất $= \\frac{3}{6} = \\frac{1}{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hàm số $y = f(x)$ có đạo hàm $f'(x) = (x - 2)(x^2 - 1)$. Số điểm cực đại của hàm số $f(x)$ là","options":["A. $1$","B. $2$","C. $3$","D. $0$"],"answer":"A","explain":"$f'(x) = (x-2)(x-1)(x+1)$. Bảng xét dấu: $f' \\lt 0$ trên $(-\\infty; -1)$, $f' \\gt 0$ trên $(-1; 1)$, $f' \\lt 0$ trên $(1; 2)$, $f' \\gt 0$ trên $(2; +\\infty)$. $f'$ đổi dấu từ dương sang âm duy nhất khi qua $x = 1$ nên hàm số có đúng 1 điểm cực đại.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị nhỏ nhất của hàm số $y = x^3 - 3x^2 + 1$ trên đoạn $[0; 3]$ bằng","options":["A. $-3$","B. $1$","C. $-1$","D. $0$"],"answer":"A","explain":"$y' = 3x^2 - 6x = 3x(x-2) = 0 \\Leftrightarrow x = 0$ hoặc $x = 2$. Tính $y(0) = 1$, $y(2) = 8 - 12 + 1 = -3$, $y(3) = 27 - 27 + 1 = 1$. Vậy $\\min_{[0;3]} y = -3$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong không gian $Oxyz$, cho đường thẳng $d$ đi qua $A(1; 1; -1)$ và có vectơ chỉ phương $\\vec{u} = (2; -1; 3)$. Điểm nào sau đây thuộc đường thẳng $d$?","options":["A. $(3; 0; 2)$","B. $(1; 1; 1)$","C. $(0; 0; 0)$","D. $(2; 1; 3)$"],"answer":"A","explain":"Phương trình tham số: $x = 1 + 2t$, $y = 1 - t$, $z = -1 + 3t$. Với $t = 1$ được điểm $(3; 0; 2)$. Kiểm tra các điểm còn lại không thỏa hệ.","points":0.25},{"type":"truefalse","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 1$ và công sai $d = 2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_2 = 3$.","b) $u_{10} = 19$.","c) Tổng của 5 số hạng đầu tiên bằng $25$.","d) Số hạng tổng quát $u_n = 2n$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $1 + 2 = 3$. b) Đúng: $u_{10} = 1 + 9 \\cdot 2 = 19$. c) Đúng: $S_5 = \\frac{5}{2}(2 \\cdot 1 + 4 \\cdot 2) = \\frac{5}{2} \\cdot 10 = 25$. d) Sai: $u_n = 1 + (n-1) \\cdot 2 = 2n - 1 \\neq 2n$.","points":1},{"type":"truefalse","level":"TH","q":"Một trường THPT đo chiều cao của 20 học sinh và được mẫu số liệu ghép nhóm: nhóm $[150; 155)$ có tần số $5$, nhóm $[155; 160)$ có tần số $10$, nhóm $[160; 165)$ có tần số $5$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cỡ mẫu của mẫu số liệu là $n = 20$.","b) Số trung bình của mẫu số liệu bằng $157,5$ cm.","c) Nhóm chứa mốt của mẫu số liệu là nhóm $[155; 160)$.","d) Cỡ mẫu của mẫu số liệu là $n = 25$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $5 + 10 + 5 = 20$. b) Đúng: $\\bar{x} = \\frac{152,5 \\cdot 5 + 157,5 \\cdot 10 + 162,5 \\cdot 5}{20} = \\frac{3150}{20} = 157,5$. c) Đúng: tần số lớn nhất $10$ thuộc nhóm $[155; 160)$. d) Sai: cỡ mẫu là $20$, không phải $25$.","points":1},{"type":"truefalse","level":"TH","q":"Trong không gian $Oxyz$, cho $A(1; 2; -1)$, $B(3; 0; 2)$ và $C(1; 1; 1)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} = (2; -2; 3)$.","b) Trung điểm của đoạn thẳng $AB$ là $(2; 1; \\frac{1}{2})$.","c) $|\\overrightarrow{AB}| = \\sqrt{17}$.","d) Điểm $C$ là trung điểm của đoạn thẳng $AB$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $(3-1; 0-2; 2-(-1)) = (2; -2; 3)$. b) Đúng: $\\left(\\frac{1+3}{2}; \\frac{2+0}{2}; \\frac{-1+2}{2}\\right) = (2; 1; \\frac{1}{2})$. c) Đúng: $\\sqrt{4+4+9} = \\sqrt{17}$. d) Sai: $C(1; 1; 1) \\neq (2; 1; \\frac{1}{2})$.","points":1},{"type":"truefalse","level":"VD","q":"Một hộp có 4 bi đỏ và 6 bi xanh. Lấy lần lượt 2 bi từ hộp, mỗi lần 1 bi và không hoàn lại. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xác suất để bi lấy ra lần thứ hai màu xanh bằng $\\frac{3}{5}$.","b) Biết bi lấy ra lần thứ hai màu xanh, xác suất để bi lấy ra lần thứ nhất màu đỏ bằng $\\frac{4}{9}$.","c) Biết bi lấy ra lần thứ hai màu xanh, xác suất để bi lấy ra lần thứ nhất màu xanh bằng $\\frac{5}{9}$.","d) Hai lần lấy bi là hai biến cố độc lập."],"answer":["T","T","T","F"],"explain":"a) Đúng: theo tính đối xứng, $P(\\text{xanh}_2) = \\frac{6}{10} = \\frac{3}{5}$ (hoặc tính toàn phần: $\\frac{4}{10}\\cdot\\frac{6}{9} + \\frac{6}{10}\\cdot\\frac{5}{9} = \\frac{54}{90} = \\frac{3}{5}$). b) Đúng: $P(\\text{đỏ}_1 \\mid \\text{xanh}_2) = \\frac{(4/10)(6/9)}{3/5} = \\frac{4/15}{3/5} = \\frac{4}{9}$. c) Đúng: $1 - \\frac{4}{9} = \\frac{5}{9}$. d) Sai: lấy không hoàn lại nên kết quả lần thứ hai phụ thuộc lần thứ nhất.","points":1},{"type":"short","level":"VD","q":"Một trang sách hình chữ nhật có diện tích $600$ $cm^2$. Khi in, người ta chừa lề trên và lề dưới mỗi bên $2$ cm, lề trái và lề phải mỗi bên $3$ cm. Diện tích phần in chữ lớn nhất bằng bao nhiêu $cm^2$?","answer":"384","explain":"Gọi chiều rộng $x$ (cm), chiều cao $y$ (cm): $xy = 600$. Diện tích in $S = (x-6)(y-4) = xy - 4x - 6y + 24 = 624 - (4x + 6y)$. Theo AM-GM: $4x + 6y \\ge 2\\sqrt{24xy} = 2\\sqrt{14400} = 240$, dấu bằng khi $4x = 6y$ và $xy = 600$ ($x = 30$, $y = 20$). Vậy $S_{\\max} = 624 - 240 = 384$ cm².","points":0.5},{"type":"short","level":"VD","q":"$\\int_0^{\\frac{\\pi}{2}} \\sin^2 x dx = \\frac{a\\pi}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"5","explain":"$\\sin^2 x = \\frac{1 - \\cos 2x}{2}$ nên $\\int_0^{\\pi/2} \\sin^2 x dx = \\left. \\left(\\frac{x}{2} - \\frac{\\sin 2x}{4}\\right) \\right|_0^{\\pi/2} = \\frac{\\pi}{4}$. Vậy $a = 1$, $b = 4$, $a + b = 5$.","points":0.5},{"type":"short","level":"VD","q":"Tổng bình phương các nghiệm của phương trình $9^x - 4 \\cdot 3^x + 3 = 0$ bằng","answer":"1","explain":"Đặt $t = 3^x$ ($t \\gt 0$): $t^2 - 4t + 3 = 0 \\Leftrightarrow t = 1$ hoặc $t = 3$. Với $t = 1$: $x = 0$; với $t = 3$: $x = 1$. Tổng bình phương các nghiệm $= 0^2 + 1^2 = 1$.","points":0.5},{"type":"short","level":"VDC","q":"Cho hàm số $f(x) = x^3 - 3x + 1$. Phương trình $f(f(x)) = 0$ có bao nhiêu nghiệm thực?","answer":"7","explain":"$f'(x) = 3x^2 - 3 = 0 \\Leftrightarrow x = \\pm 1$; $f$ đạt cực đại $f(-1) = 3$ và cực tiểu $f(1) = -1$. Phương trình $f(x) = 0$ có 3 nghiệm $x_1 \\in (-2; -1)$, $x_2 \\in (0; 1)$, $x_3 \\in (1; 2)$. $f(f(x)) = 0 \\Leftrightarrow f(x) \\in \\{x_1; x_2; x_3\\}$. Với $f(x) = x_1 \\lt -1$ (nhỏ hơn giá trị cực tiểu): 1 nghiệm. Với $f(x) = x_2 \\in (0; 1) \\subset (-1; 3)$: 3 nghiệm. Với $f(x) = x_3 \\in (1; 2) \\subset (-1; 3)$: 3 nghiệm. Tổng $1 + 3 + 3 = 7$ nghiệm.","points":0.5},{"type":"short","level":"VDC","q":"Cho tứ diện đều $ABCD$ có cạnh bằng $a$. Gọi $d$ là khoảng cách giữa hai đường thẳng $AB$ và $CD$. Tính $\\frac{2d^2}{a^2}$. ","answer":"1","explain":"Gọi $M, N$ lần lượt là trung điểm của $CD, AB$. Tam giác $NCD$ cân tại $N$ ($NC = ND = \\frac{a\\sqrt{3}}{2}$) nên $MN \\perp CD$; tương tự $MN \\perp AB$. Vậy $MN$ là đoạn vuông góc chung, $d = MN$. $MN^2 = NC^2 - CM^2 = \\frac{3a^2}{4} - \\frac{a^2}{4} = \\frac{a^2}{2}$. Suy ra $\\frac{2d^2}{a^2} = 1$.","points":0.5},{"type":"short","level":"VDC","q":"Trong một kỳ thi, $60\\%$ thí sinh đỗ. Trong số thí sinh đỗ, $70\\%$ là nam; trong số thí sinh trượt, $40\\%$ là nam. Chọn ngẫu nhiên một thí sinh nam. Xác suất để thí sinh đó đỗ là $\\frac{a}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"50","explain":"Gọi $D$ là biến cố đỗ, $N$ là biến cố là nam. $P(N) = P(N \\mid D)P(D) + P(N \\mid \\bar{D})P(\\bar{D}) = 0,7 \\cdot 0,6 + 0,4 \\cdot 0,4 = 0,42 + 0,16 = 0,58$. Theo Bayes: $P(D \\mid N) = \\frac{0,42}{0,58} = \\frac{42}{58} = \\frac{21}{29}$. Vậy $a + b = 21 + 29 = 50$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tập xác định của hàm số $y = \\log_2 (4 - x^2)$ là","options":["A. $(-2; 2)$","B. $[-2; 2]$","C. $(-\\infty; -2) \\cup (2; +\\infty)$","D. $\\mathbb{R}$"],"answer":"A","explain":"$4 - x^2 \\gt 0 \\Leftrightarrow x^2 \\lt 4 \\Leftrightarrow -2 \\lt x \\lt 2$. Vậy $D = (-2; 2)$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của hàm số $y = \\ln (2x + 1)$ $\\left(x \\gt -\\frac{1}{2}\\right)$ là","options":["A. $y' = \\frac{2}{2x + 1}$","B. $y' = \\frac{1}{2x + 1}$","C. $y' = \\frac{1}{x}$","D. $y' = 2\\ln(2x+1)$"],"answer":"A","explain":"$[\\ln u]' = \\frac{u'}{u}$ với $u = 2x + 1$: $y' = \\frac{2}{2x+1}$.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm số $y = e^x + x$ đồng biến trên khoảng nào sau đây?","options":["A. $\\mathbb{R}$","B. $(0; +\\infty)$","C. $(-\\infty; 0)$","D. Không có khoảng nào"],"answer":"A","explain":"$y' = e^x + 1 \\gt 0$ với mọi $x \\in \\mathbb{R}$ nên hàm số đồng biến trên $\\mathbb{R}$.","points":0.25},{"type":"mcq","level":"NB","q":"Tiệm cận ngang của đồ thị hàm số $y = \\frac{x + 2}{x^2 - 1}$ là đường thẳng","options":["A. $y = 0$","B. $y = 1$","C. $x = 1$","D. $x = -1$"],"answer":"A","explain":"Bậc tử nhỏ hơn bậc mẫu nên $\\lim_{x \\to \\pm\\infty} y = 0$, tiệm cận ngang là $y = 0$.","points":0.25},{"type":"mcq","level":"NB","q":"Họ nguyên hàm của hàm số $f(x) = 4x^3 + 2^x$ là","options":["A. $x^4 + \\frac{2^x}{\\ln 2} + C$","B. $12x^2 + 2^x\\ln 2 + C$","C. $x^4 + 2^x + C$","D. $\\frac{x^5}{5} + \\frac{2^x}{\\ln 2} + C$"],"answer":"A","explain":"$\\int 4x^3 dx = x^4 + C_1$, $\\int 2^x dx = \\frac{2^x}{\\ln 2} + C_2$. Cộng lại được đáp án A.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $\\int_1^2 f(x) dx = 3$ và $\\int_2^3 f(x) dx = 4$. Khi đó $\\int_1^3 f(x) dx$ bằng","options":["A. $7$","B. $1$","C. $12$","D. $-1$"],"answer":"A","explain":"$\\int_1^3 f(x) dx = \\int_1^2 f(x) dx + \\int_2^3 f(x) dx = 3 + 4 = 7$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $\\vec{u} = (3; -2; 1)$ và $\\vec{v} = (-1; 1; 2)$. Tọa độ của vectơ $\\vec{u} + \\vec{v}$ là","options":["A. $(2; -1; 3)$","B. $(4; -3; -1)$","C. $(2; 1; 3)$","D. $(-2; 1; -3)$"],"answer":"A","explain":"$\\vec{u} + \\vec{v} = (3-1; -2+1; 1+2) = (2; -1; 3)$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong không gian $Oxyz$, cho $A(1; 1; 2)$ và $B(3; -1; 0)$. Độ dài đoạn thẳng $AB$ bằng","options":["A. $2\\sqrt{3}$","B. $2\\sqrt{2}$","C. $4$","D. $\\sqrt{6}$"],"answer":"A","explain":"$\\overrightarrow{AB} = (2; -2; -2)$, $AB = \\sqrt{4 + 4 + 4} = \\sqrt{12} = 2\\sqrt{3}$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\lim_{x \\to 0} \\frac{\\sin x}{x}$ bằng","options":["A. $1$","B. $0$","C. $+\\infty$","D. Không tồn tại"],"answer":"A","explain":"Giới hạn đặc biệt: $\\lim_{x \\to 0} \\frac{\\sin x}{x} = 1$.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm cực đại của đồ thị hàm số $y = x^3 + 3x^2 - 2$ là","options":["A. $(-2; 2)$","B. $(0; -2)$","C. $(-2; -2)$","D. $(0; 2)$"],"answer":"A","explain":"$y' = 3x^2 + 6x = 3x(x + 2) = 0 \\Leftrightarrow x = 0$ hoặc $x = -2$. $y'$ đổi dấu từ dương sang âm qua $x = -2$ nên $x = -2$ là điểm cực đại, $y(-2) = -8 + 12 - 2 = 2$. Vậy điểm cực đại là $(-2; 2)$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị lớn nhất của hàm số $y = \\frac{x}{x^2 + 1}$ trên $\\mathbb{R}$ bằng","options":["A. $\\frac{1}{2}$","B. $1$","C. $2$","D. $\\frac{1}{4}$"],"answer":"A","explain":"$y' = \\frac{(x^2+1) - x \\cdot 2x}{(x^2+1)^2} = \\frac{1-x^2}{(x^2+1)^2} = 0 \\Leftrightarrow x = \\pm 1$. $y'$ đổi dấu từ dương sang âm qua $x = 1$ nên $\\max y = y(1) = \\frac{1}{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\int_{-1}^{1} (x^2 + 1) dx$ bằng","options":["A. $\\frac{8}{3}$","B. $2$","C. $\\frac{4}{3}$","D. $4$"],"answer":"A","explain":"$\\int_{-1}^{1} (x^2+1) dx = \\left. \\left(\\frac{x^3}{3} + x\\right) \\right|_{-1}^{1} = \\left(\\frac{1}{3} + 1\\right) - \\left(-\\frac{1}{3} - 1\\right) = \\frac{8}{3}$.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho hàm số $y = 2^x$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tập xác định của hàm số là $\\mathbb{R}$.","b) Đạo hàm của hàm số là $y' = 2^x \\ln 2$.","c) Hàm số đồng biến trên $\\mathbb{R}$.","d) Đồ thị hàm số cắt trục hoành."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $(a^x)' = a^x \\ln a$. c) Đúng: $y' = 2^x \\ln 2 \\gt 0$ với mọi $x$. d) Sai: $2^x \\gt 0$ với mọi $x$ nên đồ thị nằm hoàn toàn phía trên trục hoành.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đặt $u = x$, $dv = e^x dx$ thì $du = dx$, $v = e^x$.","b) $\\int_0^1 x e^x dx = \\left. x e^x \\right|_0^1 - \\int_0^1 e^x dx$.","c) $\\int_0^1 x e^x dx = 1$.","d) $\\int_0^1 x e^{-x} dx = 1$."],"answer":["T","T","T","F"],"explain":"a) Đúng theo công thức tích phân từng phần. b) Đúng: $\\int u dv = uv - \\int v du$. c) Đúng: $\\left. x e^x \\right|_0^1 - \\left. e^x \\right|_0^1 = e - (e - 1) = 1$. d) Sai: $\\int_0^1 x e^{-x} dx = \\left. (-x e^{-x}) \\right|_0^1 + \\int_0^1 e^{-x} dx = -\\frac{1}{e} + \\left(1 - \\frac{1}{e}\\right) = 1 - \\frac{2}{e} \\neq 1$.","points":1},{"type":"truefalse","level":"VD","q":"Trong không gian $Oxyz$, cho mặt phẳng $(P): 2x + y - z + 2 = 0$ và đường thẳng $d: \\frac{x-1}{1} = \\frac{y+1}{2} = \\frac{z}{-1}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đường thẳng $d$ cắt mặt phẳng $(P)$.","b) Đường thẳng $d$ vuông góc với mặt phẳng $(P)$.","c) Giao điểm của $d$ và $(P)$ có hoành độ bằng $\\frac{2}{5}$.","d) Đường thẳng $d$ song song với mặt phẳng $(P)$."],"answer":["T","F","T","F"],"explain":"Vectơ chỉ phương $\\vec{u} = (1; 2; -1)$, vectơ pháp tuyến $\\vec{n} = (2; 1; -1)$. a) Đúng: $\\vec{u} \\cdot \\vec{n} = 2 + 2 + 1 = 5 \\neq 0$ nên $d$ không song song $(P)$, do đó cắt $(P)$. b) Sai: $\\vec{u}$ không cùng phương $\\vec{n}$. c) Đúng: đặt $x = 1+t$, $y = -1+2t$, $z = -t$ thay vào $(P)$: $2(1+t) + (-1+2t) - (-t) + 2 = 0 \\Leftrightarrow 5t + 3 = 0 \\Leftrightarrow t = -\\frac{3}{5}$, hoành độ $x = 1 - \\frac{3}{5} = \\frac{2}{5}$. d) Sai (theo câu a).","points":1},{"type":"truefalse","level":"VD","q":"Một tổ có 5 học sinh nam và 5 học sinh nữ. Chọn ngẫu nhiên 2 học sinh từ tổ. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số phần tử của không gian mẫu bằng $45$.","b) Xác suất để chọn được 2 học sinh nam bằng $\\frac{2}{9}$.","c) Xác suất để chọn được 1 nam và 1 nữ bằng $\\frac{4}{9}$.","d) Biết rằng đã chọn được ít nhất 1 nữ, xác suất để chọn được 2 nữ bằng $\\frac{2}{7}$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $C_{10}^2 = 45$. b) Đúng: $\\frac{C_5^2}{45} = \\frac{10}{45} = \\frac{2}{9}$. c) Sai: $\\frac{5 \\cdot 5}{45} = \\frac{25}{45} = \\frac{5}{9} \\neq \\frac{4}{9}$. d) Đúng: $P(\\text{2 nữ} \\mid \\text{ít nhất 1 nữ}) = \\frac{10/45}{1 - 10/45} = \\frac{10}{35} = \\frac{2}{7}$.","points":1},{"type":"short","level":"VD","q":"Một hình chữ nhật nội tiếp trong một đường tròn bán kính $5$ cm. Diện tích lớn nhất của hình chữ nhật bằng bao nhiêu $cm^2$?","answer":"50","explain":"Đường chéo hình chữ nhật là đường kính $d = 10$ cm. Gọi hai cạnh $a, b$: $a^2 + b^2 = 100$. Diện tích $S = ab \\le \\frac{a^2+b^2}{2} = 50$ (AM-GM), dấu bằng khi $a = b = 5\\sqrt{2}$. Vậy $S_{\\max} = 50$ cm².","points":0.5},{"type":"short","level":"VD","q":"Diện tích hình phẳng giới hạn bởi parabol $y = 2x - x^2$ và trục hoành bằng $\\frac{a}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"7","explain":"Hoành độ giao điểm: $2x - x^2 = 0 \\Leftrightarrow x = 0$ hoặc $x = 2$. Trên $[0; 2]$, $2x - x^2 \\ge 0$ nên $S = \\int_0^2 (2x - x^2) dx = \\left. \\left(x^2 - \\frac{x^3}{3}\\right) \\right|_0^2 = 4 - \\frac{8}{3} = \\frac{4}{3}$. Vậy $a + b = 4 + 3 = 7$.","points":0.5},{"type":"short","level":"VD","q":"Trong không gian $Oxyz$, cho $A(1; 0; 0)$, $B(0; 1; 0)$, $C(0; 0; 1)$. Khoảng cách từ gốc tọa độ $O$ đến mặt phẳng $(ABC)$ bằng $d$. Biết $d^2 = \\frac{a}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"4","explain":"Phương trình mặt phẳng $(ABC)$ theo đoạn chắn: $\\frac{x}{1} + \\frac{y}{1} + \\frac{z}{1} = 1 \\Leftrightarrow x + y + z - 1 = 0$. $d(O, (ABC)) = \\frac{|-1|}{\\sqrt{3}} = \\frac{1}{\\sqrt{3}}$. Vậy $d^2 = \\frac{1}{3}$, $a + b = 1 + 3 = 4$.","points":0.5},{"type":"short","level":"VD","q":"Nghiệm của phương trình $5^{x-1} = 25^{2-x}$ bằng $\\frac{a}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"8","explain":"$25^{2-x} = 5^{2(2-x)} = 5^{4-2x}$. Phương trình $\\Leftrightarrow x - 1 = 4 - 2x \\Leftrightarrow 3x = 5 \\Leftrightarrow x = \\frac{5}{3}$. Vậy $a + b = 5 + 3 = 8$.","points":0.5},{"type":"short","level":"VDC","q":"Có bao nhiêu giá trị nguyên của tham số $m$ để đồ thị hàm số $y = x^4 - 2x^2 + 2m - 1$ cắt trục hoành tại 4 điểm phân biệt?","answer":"0","explain":"Đặt $t = x^2$ ($t \\ge 0$): phương trình $t^2 - 2t + 2m - 1 = 0$ phải có hai nghiệm dương phân biệt $\\Leftrightarrow \\begin{cases} \\Delta' = 1 - (2m-1) \\gt 0 \\\\ S = 2 \\gt 0 \\\\ P = 2m - 1 \\gt 0 \\end{cases} \\Leftrightarrow \\begin{cases} m \\lt 1 \\\\ m \\gt \\frac{1}{2} \\end{cases} \\Leftrightarrow \\frac{1}{2} \\lt m \\lt 1$. Không có số nguyên nào trong khoảng này. Đáp số $0$.","points":0.5},{"type":"short","level":"VDC","q":"Một hộp có 5 bi đỏ và 7 bi xanh. Lấy ngẫu nhiên 3 bi từ hộp. Xác suất để lấy được ít nhất 2 bi đỏ bằng $\\frac{a}{b}$ với $\\frac{a}{b}$ tối giản. Tính $a + b$.","answer":"15","explain":"$n(\\Omega) = C_{12}^3 = 220$. Số trường hợp thuận lợi: $C_5^2 \\cdot C_7^1 + C_5^3 = 10 \\cdot 7 + 10 = 80$. Xác suất $= \\frac{80}{220} = \\frac{4}{11}$. Vậy $a + b = 4 + 11 = 15$.","points":0.5}]}]}
