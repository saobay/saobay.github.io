{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Điểm cực Bắc trên đất liền của nước ta thuộc tỉnh nào sau đây?","options":["A. Hà Giang","B. Lào Cai","C. Cao Bằng","D. Lạng Sơn"],"answer":"A","explain":"Cực Bắc là Lũng Cú, tỉnh Hà Giang (23°23'B).","points":0.25},{"type":"mcq","level":"NB","q":"Vùng biển rộng 12 hải lí tính từ đường cơ sở, trong đó Nhà nước ta thực hiện chủ quyền hoàn toàn là","options":["A. nội thủy.","B. lãnh hải.","C. vùng tiếp giáp lãnh hải.","D. vùng đặc quyền kinh tế."],"answer":"B","explain":"Lãnh hải rộng 12 hải lí, Nhà nước thực hiện chủ quyền đầy đủ như trên đất liền.","points":0.25},{"type":"mcq","level":"NB","q":"Dãy núi nào sau đây là ranh giới tự nhiên giữa vùng núi Tây Bắc và vùng núi Đông Bắc?","options":["A. Trường Sơn Bắc","B. Con Voi","C. Hoàng Liên Sơn","D. Ngân Sơn"],"answer":"C","explain":"Dãy Hoàng Liên Sơn nằm giữa sông Hồng và sông Đà, là ranh giới Tây Bắc – Đông Bắc.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc điểm nổi bật của địa hình nước ta là","options":["A. địa hình đồng bằng chiếm phần lớn diện tích.","B. đồi núi thấp chiếm ưu thế tuyệt đối.","C. địa hình cao nguyên chiếm phần lớn diện tích.","D. 3/4 diện tích là đồi núi, 1/4 là đồng bằng."],"answer":"D","explain":"Đồi núi chiếm 3/4 diện tích lãnh thổ, đồng bằng chỉ chiếm 1/4.","points":0.25},{"type":"mcq","level":"NB","q":"Gió mùa mùa đông ở miền Bắc nước ta thổi theo hướng chủ yếu nào sau đây?","options":["A. Đông bắc","B. Tây nam","C. Đông nam","D. Tây bắc"],"answer":"A","explain":"Mùa đông (tháng 11 – 4) miền Bắc chịu ảnh hưởng của gió mùa Đông Bắc.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân chủ yếu làm cho thiên nhiên miền Bắc có một mùa đông lạnh là","options":["A. ảnh hưởng của gió Tín phong.","B. hoạt động của gió mùa Đông Bắc.","C. vị trí nằm trong vùng nội chí tuyến.","D. ảnh hưởng của địa hình núi cao."],"answer":"B","explain":"Gió mùa Đông Bắc tràn về theo từng đợt làm nhiệt độ miền Bắc hạ thấp, có 2–3 tháng lạnh.","points":0.25},{"type":"mcq","level":"NB","q":"Hệ thống sông có diện tích lưu vực lớn nhất nước ta là","options":["A. sông Hồng.","B. sông Đồng Nai.","C. sông Mê Kông.","D. sông Cả."],"answer":"C","explain":"Sông Mê Kông có lưu vực khoảng 795 nghìn km², lớn nhất nước ta.","points":0.25},{"type":"mcq","level":"TH","q":"Tài nguyên khoáng sản có trữ lượng lớn và giá trị nhất ở vùng biển nước ta là","options":["A. muối.","B. titan.","C. cát thủy tinh.","D. dầu khí."],"answer":"D","explain":"Dầu khí ở thềm lục địa phía Nam trữ lượng lớn, khai thác mạnh ở Bà Rịa – Vũng Tàu.","points":0.25},{"type":"mcq","level":"NB","q":"Biện pháp quan trọng hàng đầu trong phòng chống bão ở nước ta là","options":["A. trồng và bảo vệ rừng phòng hộ ven biển.","B. xây dựng các hồ chứa nước.","C. trồng rừng đầu nguồn.","D. làm đê bao chống lũ."],"answer":"A","explain":"Rừng phòng hộ ven biển chắn sóng, chắn gió bão; kết hợp dự báo sớm và sơ tán dân.","points":0.25},{"type":"mcq","level":"NB","q":"Năm 2023, dân số nước ta đạt khoảng","options":["A. 90,3 triệu người.","B. 100,3 triệu người.","C. 96,2 triệu người.","D. 108,5 triệu người."],"answer":"B","explain":"Dân số Việt Nam năm 2023 khoảng 100,3 triệu người, đứng thứ 3 Đông Nam Á.","points":0.25},{"type":"mcq","level":"TH","q":"Cơ cấu dân số theo tuổi của nước ta hiện nay được đánh giá là","options":["A. cơ cấu dân số già.","B. cơ cấu dân số trẻ hoàn toàn.","C. cơ cấu dân số vàng.","D. cơ cấu ổn định không biến động."],"answer":"C","explain":"Tỉ lệ dân số trong độ tuổi lao động cao (trên 60%), tạo cơ hội cho phát triển kinh tế.","points":0.25},{"type":"mcq","level":"TH","q":"Quá trình đô thị hóa ở nước ta hiện nay có đặc điểm nào sau đây?","options":["A. Tỉ lệ dân thành thị đã vượt 70%.","B. Mạng lưới đô thị phân bố đều khắp cả nước.","C. Đô thị hóa diễn ra nhanh nhất ở miền núi.","D. Tỉ lệ dân thành thị còn thấp, khoảng 42–43%."],"answer":"D","explain":"Đô thị hóa năm 2023 khoảng 42,7%, còn thấp; đô thị tập trung ở đồng bằng, ven biển.","points":0.25},{"type":"mcq","level":"NB","q":"Vùng có diện tích trồng cây công nghiệp lâu năm lớn nhất nước ta là","options":["A. Tây Nguyên.","B. Đông Nam Bộ.","C. Trung du và miền núi Bắc Bộ.","D. Đồng bằng sông Cửu Long."],"answer":"A","explain":"Tây Nguyên chiếm tỉ trọng lớn nhất về diện tích cà phê, cao su, hồ tiêu, điều của cả nước.","points":0.25},{"type":"mcq","level":"TH","q":"Vụ lúa có diện tích và sản lượng lớn nhất ở Đồng bằng sông Cửu Long là","options":["A. vụ hè thu.","B. vụ đông xuân.","C. vụ mùa.","D. vụ thu đông."],"answer":"B","explain":"Vụ đông xuân cho năng suất, sản lượng cao nhất nhờ thời tiết thuận lợi, ít sâu bệnh.","points":0.25},{"type":"mcq","level":"NB","q":"Trung tâm công nghiệp có quy mô lớn nhất nước ta hiện nay là","options":["A. Hà Nội.","B. Hải Phòng.","C. Thành phố Hồ Chí Minh.","D. Đà Nẵng."],"answer":"C","explain":"TP. Hồ Chí Minh là trung tâm công nghiệp lớn nhất cả nước.","points":0.25},{"type":"mcq","level":"TH","q":"Ngành công nghiệp trọng điểm nào sau đây thu hút nhiều lao động nhất ở nước ta?","options":["A. Khai thác than.","B. Luyện kim.","C. Hóa chất.","D. Dệt – may."],"answer":"D","explain":"Dệt – may là ngành sử dụng nhiều lao động, tập trung ở Đông Nam Bộ và Đồng bằng sông Hồng.","points":0.25},{"type":"mcq","level":"NB","q":"Loại hình giao thông vận tải có khối lượng hàng hóa luân chuyển lớn nhất ở nước ta là","options":["A. đường biển.","B. đường bộ.","C. đường sông.","D. đường sắt."],"answer":"A","explain":"Đường biển luân chuyển lớn nhất nhờ chở hàng xuất nhập khẩu đường dài.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa): Dân số Việt Nam năm 2010 là 86,9 triệu người, năm 2023 là 100,3 triệu người. Tốc độ tăng dân số bình quân giai đoạn 2010 – 2023 khoảng","options":["A. 0,9%/năm.","B. 1,1%/năm.","C. 1,5%/năm.","D. 1,9%/năm."],"answer":"B","explain":"Dân số tăng 13,4 triệu sau 13 năm, bình quân khoảng 1,1%/năm.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho đoạn tư liệu: Miền Bắc nước ta từ dãy Bạch Mã trở ra có mùa đông lạnh, nhiệt độ trung bình tháng 1 dưới 18°C, có 2–3 tháng nhiệt độ dưới 18°C; miền Nam nóng quanh năm với nhiệt độ trung bình năm trên 25°C. Xét tính đúng, sai của các nhận định sau:","statements":["a) Ranh giới khí hậu giữa miền Bắc và miền Nam là dãy Bạch Mã.","b) Miền Bắc có mùa đông lạnh do ảnh hưởng của gió mùa Đông Bắc.","c) Nhiệt độ trung bình năm tăng dần từ Bắc vào Nam.","d) Miền Nam có một mùa đông lạnh kéo dài 3 tháng."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: miền Nam nóng quanh năm.","points":1},{"type":"truefalse","level":"VD","q":"Cho bảng số liệu (minh họa) về sản lượng lúa năm 2023: Đồng bằng sông Cửu Long 24,8 triệu tấn; Đồng bằng sông Hồng 6,1 triệu tấn; cả nước 43,6 triệu tấn. Xét tính đúng, sai của các nhận định sau:","statements":["a) Đồng bằng sông Cửu Long chiếm trên 50% sản lượng lúa cả nước.","b) Đồng bằng sông Hồng là vựa lúa lớn thứ hai của cả nước.","c) Vụ đông xuân cho sản lượng lúa cao nhất ở Đồng bằng sông Cửu Long.","d) Nghề trồng lúa ở Đồng bằng sông Cửu Long chủ yếu phục vụ xuất khẩu, ít phục vụ tiêu dùng trong nước."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: lúa ĐBSCL vừa xuất khẩu vừa đảm bảo an ninh lương thực.","points":1},{"type":"truefalse","level":"TH","q":"Về công nghiệp năng lượng ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Than antraxit tập trung chủ yếu ở Quảng Ninh.","b) Các nhà máy thủy điện lớn nhất tập trung trên hệ thống sông Đà.","c) Dầu khí được khai thác chủ yếu ở thềm lục địa phía Nam.","d) Nhiệt điện chạy bằng than phân bố chủ yếu ở Đồng bằng sông Cửu Long."],"answer":["T","T","T","F"],"explain":"a,b,c đúng: than Quảng Ninh; thủy điện sông Đà; dầu khí thềm lục địa phía Nam. d sai: nhiệt điện than ở ĐBSH.","points":1},{"type":"truefalse","level":"VD","q":"Về vùng kinh tế trọng điểm phía Nam, xét tính đúng, sai của các nhận định sau:","statements":["a) Gồm TP. Hồ Chí Minh, Đồng Nai, Bình Dương, Bà Rịa – Vũng Tàu và các tỉnh lân cận.","b) Là vùng kinh tế trọng điểm có quy mô GDP lớn nhất cả nước.","c) Thế mạnh nổi bật là công nghiệp, dịch vụ và kinh tế biển.","d) Vùng này dẫn đầu cả nước về sản lượng lúa gạo."],"answer":["T","T","T","F"],"explain":"a,b,c đúng: vùng KTTĐ phía Nam là đầu tàu kinh tế. d sai: vựa lúa lớn nhất là ĐBSCL.","points":1},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Dân số Việt Nam năm 2010 là 86,9 triệu người, năm 2023 là 100,3 triệu người. Tốc độ tăng dân số của Việt Nam giai đoạn 2010 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"15,4","explain":"Tốc độ tăng = (100,3 − 86,9) ÷ 86,9 × 100 = 13,4 ÷ 86,9 × 100 ≈ 15,4%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Sản lượng lúa năm 2023 (triệu tấn): Đồng bằng sông Cửu Long 24,8; Đồng bằng sông Hồng 6,1; cả nước 43,6. Tỉ trọng sản lượng lúa của Đồng bằng sông Cửu Long chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"56,9","explain":"Tỉ trọng = 24,8 ÷ 43,6 × 100 ≈ 56,9%.","points":0.5},{"type":"short","level":"TH","q":"Năm 2023, dân số Việt Nam khoảng 100,3 triệu người, diện tích đất liền là 331.212 km². Mật độ dân số trung bình cả nước năm 2023 là bao nhiêu người/km² (làm tròn đến 1 chữ số thập phân)?","answer":"302,8","explain":"Mật độ = 100.300.000 ÷ 331.212 ≈ 302,8 người/km².","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Giá trị xuất khẩu của Việt Nam (tỉ USD): năm 2015 là 162,1; năm 2023 là 354,7. Tốc độ tăng trưởng giá trị xuất khẩu giai đoạn 2015 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"118,8","explain":"Tốc độ tăng = (354,7 − 162,1) ÷ 162,1 × 100 = 192,6 ÷ 162,1 × 100 ≈ 118,8%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Tỉ lệ dân thành thị của Việt Nam: năm 2010 là 30,5%; năm 2023 là 42,7%. Tỉ lệ dân thành thị đã tăng thêm bao nhiêu điểm phần trăm?","answer":"12,2","explain":"42,7 − 30,5 = 12,2 điểm phần trăm.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Sản lượng điện của Việt Nam (tỉ kWh): năm 2010 là 91,7; năm 2023 là 280,6. Sản lượng điện năm 2023 gấp khoảng bao nhiêu lần năm 2010 (làm tròn đến 1 chữ số thập phân)?","answer":"3,1","explain":"280,6 ÷ 91,7 ≈ 3,06, làm tròn thành 3,1 lần.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Đường biên giới trên đất liền của nước ta dài khoảng","options":["A. 3.260 km.","B. 4.550 km.","C. 1.650 km.","D. 2.340 km."],"answer":"B","explain":"Biên giới đất liền dài khoảng 4.550 km; 3.260 km là chiều dài đường bờ biển.","points":0.25},{"type":"mcq","level":"TH","q":"Vùng đặc quyền về kinh tế của nước ta rộng 200 hải lí được tính từ","options":["A. đường bờ biển lúc thủy triều xuống.","B. mép ngoài của lãnh hải.","C. đường cơ sở.","D. mép ngoài của vùng tiếp giáp."],"answer":"C","explain":"Vùng đặc quyền kinh tế rộng 200 hải lí tính từ đường cơ sở.","points":0.25},{"type":"mcq","level":"NB","q":"Đỉnh núi cao nhất nước ta là","options":["A. Pu Si Lung.","B. Pu Đen Đinh.","C. Ngọc Linh.","D. Phan Xi Păng."],"answer":"D","explain":"Phan Xi Păng (3.143 m) trên dãy Hoàng Liên Sơn là đỉnh cao nhất Việt Nam và Đông Dương.","points":0.25},{"type":"mcq","level":"TH","q":"Đồng bằng sông Hồng có đặc điểm nào sau đây?","options":["A. Được bồi đắp phù sa của hệ thống sông Hồng và sông Thái Bình.","B. Có diện tích lớn nhất trong các đồng bằng nước ta.","C. Địa hình bị chia cắt mạnh bởi đồi núi.","D. Đất phèn, đất mặn chiếm diện tích lớn."],"answer":"A","explain":"ĐBSH do sông Hồng và sông Thái Bình bồi đắp; đất phèn mặn là đặc trưng của ĐBSCL.","points":0.25},{"type":"mcq","level":"NB","q":"Loại gió nào sau đây hoạt động quanh năm ở nước ta và gây mưa cho vùng ven biển Trung Bộ vào thu đông?","options":["A. Gió mùa Tây Nam","B. Tín phong bán cầu Bắc","C. Gió mùa Đông Bắc","D. Gió Tây khô nóng"],"answer":"B","explain":"Tín phong Bắc bán cầu thổi quanh năm, gây mưa thu đông ở ven biển Trung Bộ.","points":0.25},{"type":"mcq","level":"TH","q":"Vào mùa hạ, hiện tượng gió Tây khô nóng (gió Lào) xuất hiện chủ yếu ở","options":["A. Đồng bằng sông Cửu Long.","B. Tây Nguyên.","C. Bắc Trung Bộ và phần nam của Tây Bắc.","D. Đông Nam Bộ."],"answer":"C","explain":"Gió Tây Nam vượt Trường Sơn gây hiệu ứng phơn, tạo gió Lào ở Bắc Trung Bộ.","points":0.25},{"type":"mcq","level":"NB","q":"Sông ngòi nước ta có đặc điểm nào sau đây?","options":["A. Sông ngòi ít, lưu lượng nước nhỏ.","B. Chế độ nước điều hòa quanh năm.","C. Hàm lượng phù sa trong sông rất thấp.","D. Mạng lưới sông ngòi dày đặc, nhiều nước, giàu phù sa."],"answer":"D","explain":"Khí hậu nhiệt đới ẩm mưa nhiều tạo mạng lưới sông dày đặc; chế độ nước theo mùa, giàu phù sa.","points":0.25},{"type":"mcq","level":"TH","q":"Đất feralit ở nước ta được hình thành chủ yếu trong điều kiện","options":["A. khí hậu nhiệt đới ẩm gió mùa trên địa hình đồi núi.","B. ngập nước quanh năm ở đồng bằng.","C. khô hạn kéo dài ở ven biển.","D. lạnh giá trên núi cao."],"answer":"A","explain":"Khí hậu nhiệt ẩm trên đồi núi tạo quá trình feralit, hình thành đất đỏ vàng.","points":0.25},{"type":"mcq","level":"NB","q":"Vườn quốc gia nào sau đây được UNESCO công nhận là Di sản thiên nhiên thế giới?","options":["A. Cúc Phương","B. Phong Nha – Kẻ Bàng","C. Ba Vì","D. Cát Tiên"],"answer":"B","explain":"Vườn quốc gia Phong Nha – Kẻ Bàng (Quảng Bình) là Di sản thiên nhiên thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Tỉ suất sinh thô của nước ta hiện nay có xu hướng","options":["A. tăng nhanh.","B. ổn định tuyệt đối.","C. giảm dần.","D. tăng chậm."],"answer":"C","explain":"Nhờ chính sách dân số, tỉ suất sinh thô giảm dần, quy mô gia đình ít con trở nên phổ biến.","points":0.25},{"type":"mcq","level":"TH","q":"Dân cư nước ta phân bố không đều, tập trung đông nhất ở","options":["A. vùng núi cao, biên giới.","B. các cao nguyên đất đỏ.","C. vùng sâu, vùng xa.","D. các đồng bằng, ven biển và đô thị."],"answer":"D","explain":"Đồng bằng sông Hồng có mật độ trên 1.000 người/km²; miền núi thưa dân.","points":0.25},{"type":"mcq","level":"TH","q":"Nguồn lao động nước ta hiện nay có đặc điểm nào sau đây?","options":["A. Dồi dào, chất lượng ngày càng được nâng cao.","B. Thiếu hụt nghiêm trọng về số lượng.","C. Trình độ chuyên môn đã đồng đều ở mọi vùng.","D. Chủ yếu làm việc trong khu vực nhà nước."],"answer":"A","explain":"Mỗi năm có thêm khoảng 1 triệu lao động; tỉ lệ lao động qua đào tạo tăng dần.","points":0.25},{"type":"mcq","level":"NB","q":"Cây công nghiệp lâu năm quan trọng nhất ở Đông Nam Bộ là","options":["A. cà phê.","B. cao su.","C. chè.","D. hồ tiêu."],"answer":"B","explain":"Đông Nam Bộ là vùng trồng cao su lớn nhất cả nước (Bình Phước dẫn đầu).","points":0.25},{"type":"mcq","level":"TH","q":"Điều kiện thuận lợi nhất để Đồng bằng sông Cửu Long trở thành vùng chuyên canh cây ăn quả lớn nhất cả nước là","options":["A. địa hình đồi núi thấp.","B. có mùa đông lạnh.","C. khí hậu cận xích đạo nóng ẩm, đất phù sa màu mỡ.","D. đất feralit phát triển rộng."],"answer":"C","explain":"Khí hậu nóng ẩm quanh năm và đất phù sa thích hợp cho cây ăn quả nhiệt đới.","points":0.25},{"type":"mcq","level":"NB","q":"Ngành công nghiệp nào sau đây thuộc nhóm công nghiệp chế biến lương thực, thực phẩm?","options":["A. Khai thác than.","B. Luyện kim đen.","C. Sản xuất xi măng.","D. Sản xuất đường mía."],"answer":"D","explain":"Chế biến thực phẩm: xay xát, đường, sữa, đồ hộp; các đáp án khác thuộc khai khoáng.","points":0.25},{"type":"mcq","level":"TH","q":"Các khu công nghiệp tập trung nhiều nhất ở vùng nào sau đây?","options":["A. Đông Nam Bộ","B. Tây Nguyên","C. Bắc Trung Bộ","D. Trung du và miền núi Bắc Bộ"],"answer":"A","explain":"Đông Nam Bộ dẫn đầu về số lượng khu công nghiệp nhờ vị trí, lao động và hạ tầng.","points":0.25},{"type":"mcq","level":"NB","q":"Tuyến đường sắt Thống Nhất nối hai thành phố nào sau đây?","options":["A. Hà Nội – Hải Phòng","B. Hà Nội – Thành phố Hồ Chí Minh","C. Hà Nội – Lào Cai","D. Hà Nội – Đồng Đăng"],"answer":"B","explain":"Đường sắt Bắc – Nam (Thống Nhất) dài 1.726 km nối Hà Nội với TP. Hồ Chí Minh.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa) về tỉ lệ dân thành thị của Việt Nam: năm 2010 là 30,5%, năm 2023 là 42,7%. Nhận xét nào sau đây đúng?","options":["A. Tỉ lệ dân thành thị giảm dần.","B. Năm 2023, dân nông thôn chỉ còn dưới 40%.","C. Tỉ lệ dân thành thị tăng thêm 12,2 điểm phần trăm sau 13 năm.","D. Tốc độ đô thị hóa của nước ta đã chững lại hoàn toàn."],"answer":"C","explain":"42,7 – 30,5 = 12,2 điểm phần trăm; xu hướng đô thị hóa vẫn tiếp diễn, dân nông thôn còn khoảng 57%.","points":0.25},{"type":"truefalse","level":"TH","q":"Về địa hình vùng núi Đông Bắc, xét tính đúng, sai của các nhận định sau:","statements":["a) Nằm ở tả ngạn sông Hồng, gồm các cánh cung lớn.","b) Địa hình núi thấp chiếm phần lớn diện tích.","c) Có đỉnh Phan Xi Păng cao 3.143 m.","d) Hướng núi chủ yếu là vòng cung."],"answer":["T","T","F","T"],"explain":"a,b,d đúng: Đông Bắc có 4 cánh cung, núi thấp, hướng vòng cung. c sai: Phan Xi Păng thuộc Tây Bắc.","points":1},{"type":"truefalse","level":"VD","q":"Cho bảng số liệu (minh họa) về diện tích cây công nghiệp lâu năm năm 2023 (nghìn ha): Tây Nguyên 950, Đông Nam Bộ 720, cả nước 2.280. Xét tính đúng, sai của các nhận định sau:","statements":["a) Tây Nguyên chiếm khoảng 41,7% diện tích cây công nghiệp lâu năm cả nước.","b) Đông Nam Bộ đứng thứ hai cả nước về diện tích cây công nghiệp lâu năm.","c) Cà phê là cây công nghiệp lâu năm chủ lực của Tây Nguyên.","d) Chè là cây công nghiệp lâu năm chủ lực của Đông Nam Bộ."],"answer":["T","T","T","F"],"explain":"a,b,c đúng: Tây Nguyên chiếm khoảng 41,7% diện tích; cà phê là cây chủ lực. d sai: chè là cây chủ lực của TDMNBB.","points":1},{"type":"truefalse","level":"TH","q":"Về ngành thủy sản ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Đồng bằng sông Cửu Long dẫn đầu cả nước về sản lượng thủy sản.","b) Nuôi trồng thủy sản phát triển mạnh hơn khai thác về tốc độ tăng sản lượng.","c) Cá tra, tôm là hai đối tượng nuôi trồng xuất khẩu chủ lực.","d) Khai thác hải sản xa bờ còn hạn chế do thiếu tàu thuyền công suất lớn."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: đội tàu xa bờ ngày càng hiện đại.","points":1},{"type":"truefalse","level":"VD","q":"Về phát triển tổng hợp kinh tế biển ở Duyên hải Nam Trung Bộ, xét tính đúng, sai của các nhận định sau:","statements":["a) Nghề làm muối phát triển nhất ở Ninh Thuận, Bình Thuận.","b) Du lịch biển đảo là thế mạnh với nhiều bãi biển đẹp.","c) Khai thác dầu khí là ngành kinh tế mũi nhọn của vùng.","d) Vùng có nhiều vũng, vịnh thuận lợi xây dựng cảng nước sâu."],"answer":["T","T","F","T"],"explain":"Đúng a,b,d; sai c: dầu khí là thế mạnh của Đông Nam Bộ.","points":1},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Diện tích cây công nghiệp lâu năm năm 2023 (nghìn ha): Tây Nguyên 950; Đông Nam Bộ 720; cả nước 2.280. Tỉ trọng diện tích cây công nghiệp lâu năm của Tây Nguyên chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"41,7","explain":"Tỉ trọng = 950 ÷ 2.280 × 100 ≈ 41,7%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Sản lượng thủy sản năm 2023 (nghìn tấn): khai thác 3.860; nuôi trồng 5.490; tổng số 9.350. Tỉ trọng sản lượng nuôi trồng thủy sản chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"58,7","explain":"Tỉ trọng = 5.490 ÷ 9.350 × 100 ≈ 58,7%.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): GDP bình quân đầu người của Việt Nam (USD): năm 2015 là 2.109; năm 2023 là 4.284. Năm 2023, GDP bình quân đầu người gấp khoảng bao nhiêu lần năm 2015 (làm tròn đến 1 chữ số thập phân)?","answer":"2,0","explain":"4.284 ÷ 2.109 ≈ 2,03, làm tròn thành 2,0 lần.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Nhiệt độ trung bình tháng 1 và tháng 7 của Hà Nội lần lượt là 16,4°C và 29,2°C. Biên độ nhiệt độ năm của Hà Nội là bao nhiêu °C?","answer":"12,8","explain":"Biên độ nhiệt năm = 29,2 − 16,4 = 12,8°C.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Sản lượng điện của Việt Nam (tỉ kWh): năm 2010 là 91,7; năm 2023 là 280,6. Tốc độ tăng sản lượng điện giai đoạn 2010 – 2023 là bao nhiêu % (làm tròn đến hàng đơn vị)?","answer":"206","explain":"Tốc độ tăng = (280,6 − 91,7) ÷ 91,7 × 100 = 188,9 ÷ 91,7 × 100 ≈ 206%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Tỉ lệ lao động qua đào tạo của Việt Nam: năm 2010 là 14,6%; năm 2023 là 27,0%. Tỉ lệ lao động qua đào tạo đã tăng thêm bao nhiêu điểm phần trăm?","answer":"12,4","explain":"27,0 − 14,6 = 12,4 điểm phần trăm.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Nước ta tiếp giáp với biển Đông ở phía nào sau đây?","options":["A. Phía tây và phía bắc","B. Phía đông và phía tây","C. Phía đông và phía nam","D. Phía nam và phía tây"],"answer":"C","explain":"Lãnh thổ Việt Nam tiếp giáp biển Đông ở phía đông và phía nam với đường bờ biển dài 3.260 km.","points":0.25},{"type":"mcq","level":"TH","q":"Vị trí địa lí nước ta có ý nghĩa quan trọng nhất về mặt kinh tế là","options":["A. nằm hoàn toàn trong vùng nhiệt đới.","B. tiếp giáp với nhiều nước láng giềng.","C. có đường bờ biển dài.","D. nằm trên ngã tư đường hàng hải và hàng không quốc tế."],"answer":"D","explain":"Vị trí ngã tư quốc tế tạo điều kiện giao lưu kinh tế, thu hút đầu tư và phát triển dịch vụ.","points":0.25},{"type":"mcq","level":"NB","q":"Vùng núi Tây Bắc có đặc điểm địa hình nào sau đây?","options":["A. Núi cao và đồ sộ nhất nước ta, hướng tây bắc – đông nam.","B. Núi thấp với các cánh cung lớn.","C. Cao nguyên badan xếp tầng.","D. Địa hình cacxtơ phổ biến."],"answer":"A","explain":"Tây Bắc có dãy Hoàng Liên Sơn hùng vĩ, địa hình cao nhất nước, hướng tây bắc – đông nam.","points":0.25},{"type":"mcq","level":"TH","q":"Đồng bằng sông Cửu Long có đặc điểm tự nhiên nào sau đây?","options":["A. Hẹp ngang, bị chia cắt bởi các dãy núi.","B. Rộng khoảng 40 nghìn km², thấp và bằng phẳng, bị nhiễm phèn, mặn.","C. Cao trung bình 5 – 10 m so với mực nước biển.","D. Đất feralit chiếm diện tích lớn."],"answer":"B","explain":"ĐBSCL là đồng bằng lớn nhất, thấp trũng, chịu ảnh hưởng của phèn (Đồng Tháp Mười, Tứ giác Long Xuyên) và mặn.","points":0.25},{"type":"mcq","level":"NB","q":"Mùa mưa ở Tây Nguyên và Nam Bộ kéo dài từ tháng 5 đến tháng 10 hằng năm chủ yếu do ảnh hưởng của","options":["A. gió mùa Đông Bắc.","B. Tín phong bán cầu Bắc.","C. gió mùa Tây Nam.","D. gió Tây khô nóng."],"answer":"C","explain":"Gió mùa Tây Nam mang ẩm từ biển vào gây mưa lớn cho Tây Nguyên và Nam Bộ từ tháng 5 đến tháng 10.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân chủ yếu làm cho Duyên hải Nam Trung Bộ mưa nhiều vào thu đông là","options":["A. ảnh hưởng của gió mùa Tây Nam.","B. hoạt động của gió Tây khô nóng.","C. ảnh hưởng của frông lạnh cực mạnh.","D. gió Tín phong kết hợp với địa hình đón gió và bão."],"answer":"D","explain":"Thu đông, Tín phong đông bắc gặp dãy Trường Sơn gây mưa lớn; cộng thêm bão từ biển Đông.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu (minh họa) về nhiệt độ trung bình tháng 1 và tháng 7 (°C): Hà Nội (16,4; 29,2), Đà Nẵng (21,3; 29,2), TP. Hồ Chí Minh (25,8; 27,1). Nhận định nào sau đây đúng?","options":["A. Biên độ nhiệt năm giảm dần từ Bắc vào Nam.","B. Nhiệt độ tháng 7 tăng dần từ Bắc vào Nam.","C. Hà Nội có nhiệt độ tháng 1 cao nhất.","D. Đà Nẵng có biên độ nhiệt năm lớn nhất."],"answer":"A","explain":"Biên độ: Hà Nội 12,8°C; Đà Nẵng 7,9°C; TP.HCM 1,3°C — giảm dần từ Bắc vào Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Loại đất chiếm diện tích lớn nhất ở vùng đồi núi nước ta là","options":["A. đất phù sa.","B. đất feralit.","C. đất mặn.","D. đất phèn."],"answer":"B","explain":"Đất feralit (đỏ vàng, đỏ nâu...) hình thành trên đá mẹ nhiệt đới, chiếm phần lớn diện tích đồi núi.","points":0.25},{"type":"mcq","level":"TH","q":"Rừng ngập mặn ở nước ta phân bố tập trung nhất ở","options":["A. Đồng bằng sông Hồng.","B. Duyên hải Nam Trung Bộ.","C. Đồng bằng sông Cửu Long.","D. Bắc Trung Bộ."],"answer":"C","explain":"Rừng ngập mặn (đước, mắm) tập trung ở ven biển ĐBSCL, lớn nhất là ở Cà Mau.","points":0.25},{"type":"mcq","level":"NB","q":"Thiên tai nào sau đây gây thiệt hại nặng nề nhất về người và tài sản ở vùng núi nước ta?","options":["A. Hạn hán","B. Xâm nhập mặn","C. Triều cường","D. Lũ quét, sạt lở đất"],"answer":"D","explain":"Mưa lớn trên địa hình dốc gây lũ quét, sạt lở ở miền núi.","points":0.25},{"type":"mcq","level":"NB","q":"Dân tộc có số dân đông nhất ở nước ta là","options":["A. Kinh.","B. Tày.","C. Thái.","D. Mường."],"answer":"A","explain":"Dân tộc Kinh chiếm khoảng 85% dân số; 53 dân tộc thiểu số còn lại chiếm khoảng 15%.","points":0.25},{"type":"mcq","level":"TH","q":"Mật độ dân số cao nhất nước ta tập trung ở vùng nào sau đây?","options":["A. Tây Nguyên","B. Đồng bằng sông Hồng","C. Trung du và miền núi Bắc Bộ","D. Bắc Trung Bộ"],"answer":"B","explain":"ĐBSH có mật độ trên 1.000 người/km², cao nhất cả nước do đất chật người đông.","points":0.25},{"type":"mcq","level":"TH","q":"Xu hướng chuyển dịch cơ cấu lao động theo ngành kinh tế ở nước ta hiện nay là","options":["A. tăng tỉ trọng lao động nông nghiệp.","B. giảm tỉ trọng lao động công nghiệp.","C. giảm tỉ trọng lao động nông nghiệp, tăng tỉ trọng công nghiệp và dịch vụ.","D. lao động dịch vụ giảm nhanh."],"answer":"C","explain":"Cùng với chuyển dịch cơ cấu kinh tế, lao động chuyển dần từ nông nghiệp sang công nghiệp – dịch vụ.","points":0.25},{"type":"mcq","level":"NB","q":"Cây lương thực quan trọng nhất ở nước ta là","options":["A. ngô.","B. khoai.","C. sắn.","D. lúa gạo."],"answer":"D","explain":"Lúa gạo là cây lương thực chính, Việt Nam là một trong những nước xuất khẩu gạo hàng đầu thế giới.","points":0.25},{"type":"mcq","level":"TH","q":"Điều kiện sinh thái nông nghiệp nào sau đây là khó khăn lớn nhất đối với sản xuất nông nghiệp ở Trung du và miền núi Bắc Bộ?","options":["A. Địa hình dốc, đất dễ bị xói mòn, rửa trôi.","B. Thiếu nước tưới vào mùa khô.","C. Đất phèn, đất mặn lan rộng.","D. Thường xuyên chịu ảnh hưởng của bão."],"answer":"A","explain":"Địa hình dốc kết hợp mưa lớn gây xói mòn, rửa trôi đất; cần trồng rừng, làm ruộng bậc thang.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà máy thủy điện có công suất lớn nhất nước ta là","options":["A. Hòa Bình.","B. Sơn La.","C. Trị An.","D. Yaly."],"answer":"B","explain":"Thủy điện Sơn La (2.400 MW) trên sông Đà là nhà máy thủy điện lớn nhất Việt Nam và Đông Nam Á.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghiệp chế biến lương thực, thực phẩm ở nước ta phân bố chủ yếu ở","options":["A. vùng núi cao.","B. các đảo xa bờ.","C. các vùng nguyên liệu nông sản dồi dào.","D. vùng biên giới."],"answer":"C","explain":"Ngành này gắn với vùng nguyên liệu: xay xát ở ĐBSCL, ĐBSH; đường mía, sữa ở ĐNB...","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa) về sản lượng điện của Việt Nam: năm 2010 là 91,7 tỉ kWh, năm 2023 là 280,6 tỉ kWh. Nhận xét nào sau đây đúng?","options":["A. Sản lượng điện giảm dần.","B. Năm 2023 sản lượng điện chưa đạt 200 tỉ kWh.","C. Tốc độ tăng sản lượng điện chậm lại do thiếu nguồn.","D. Sản lượng điện tăng hơn 3 lần sau 13 năm."],"answer":"D","explain":"280,6/91,7 đạt khoảng 3,06 lần; điện tăng nhanh đáp ứng công nghiệp hóa.","points":0.25},{"type":"truefalse","level":"TH","q":"Về vị trí địa lí và phạm vi lãnh thổ Việt Nam, xét tính đúng, sai của các nhận định sau:","statements":["a) Việt Nam nằm hoàn toàn trong vùng nội chí tuyến bán cầu Bắc.","b) Diện tích đất liền khoảng 331.212 km².","c) Đường bờ biển dài 3.260 km.","d) Việt Nam có chung đường biên giới trên đất liền với 4 quốc gia."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: Việt Nam giáp 3 nước (Trung Quốc, Lào, Campuchia).","points":1},{"type":"truefalse","level":"VD","q":"Về khí hậu Tây Nguyên, xét tính đúng, sai của các nhận định sau:","statements":["a) Có hai mùa mưa – khô rõ rệt trong năm.","b) Mùa mưa kéo dài từ tháng 5 đến tháng 10 do gió mùa Tây Nam.","c) Nhiệt độ trung bình năm thấp hơn so với đồng bằng nhờ độ cao địa hình.","d) Mùa khô ở Tây Nguyên thường gây thiếu nước nghiêm trọng cho sản xuất."],"answer":["T","T","T","T"],"explain":"Cả 4 ý đều đúng: Tây Nguyên khí hậu cận xích đạo, phân 2 mùa rõ rệt, mát mẻ hơn đồng bằng, mùa khô thiếu nước.","points":1},{"type":"truefalse","level":"TH","q":"Về ngành chăn nuôi ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Chăn nuôi lợn phát triển mạnh nhất ở Đồng bằng sông Hồng.","b) Trâu được nuôi nhiều ở Trung du và miền núi Bắc Bộ.","c) Bò sữa phát triển ở ven các thành phố lớn.","d) Chăn nuôi gia cầm phân bố đều khắp, ít mang tính hàng hóa."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: gia cầm chăn nuôi theo hướng công nghiệp.","points":1},{"type":"truefalse","level":"VDC","q":"Cho bảng số liệu (minh họa) về cơ cấu GDP theo ngành năm 2023 (%): Nông, lâm nghiệp và thủy sản 11,9; Công nghiệp và xây dựng 37,1; Dịch vụ 42,9; Thuế sản phẩm 8,1. Xét tính đúng, sai của các nhận định sau:","statements":["a) Dịch vụ là ngành có tỉ trọng lớn nhất trong GDP.","b) Nông, lâm nghiệp và thủy sản chỉ còn chiếm dưới 12%.","c) Cơ cấu kinh tế chuyển dịch theo hướng công nghiệp hóa, hiện đại hóa.","d) Tỉ trọng công nghiệp và xây dựng đã vượt 50% GDP."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: công nghiệp-xây dựng mới đạt 37,1%.","points":1},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Cơ cấu GDP theo ngành năm 2023 (%): nông, lâm nghiệp và thủy sản 11,9; công nghiệp và xây dựng 37,1; dịch vụ 42,9; thuế sản phẩm 8,1. Tổng tỉ trọng của công nghiệp, xây dựng và dịch vụ trong GDP là bao nhiêu %?","answer":"80","explain":"37,1 + 42,9 = 80,0%.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Diện tích rừng của Việt Nam (triệu ha): năm 2010 là 13,4; năm 2023 là 14,9. Tốc độ tăng diện tích rừng giai đoạn 2010 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"11,2","explain":"Tốc độ tăng = (14,9 − 13,4) ÷ 13,4 × 100 = 1,5 ÷ 13,4 × 100 ≈ 11,2%.","points":0.5},{"type":"short","level":"TH","q":"Năm 2023, diện tích rừng của Việt Nam là 14,9 triệu ha, diện tích đất liền tự nhiên là 33,1 triệu ha. Độ che phủ rừng năm 2023 đạt khoảng bao nhiêu % (làm tròn đến hàng đơn vị)?","answer":"45","explain":"Độ che phủ = 14,9 ÷ 33,1 × 100 ≈ 45%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Nhiệt độ trung bình tháng 1 (°C): Hà Nội 16,4; TP. Hồ Chí Minh 25,8. Nhiệt độ tháng 1 của TP. Hồ Chí Minh cao hơn Hà Nội bao nhiêu °C?","answer":"9,4","explain":"25,8 − 16,4 = 9,4°C.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Năm 2023, Đồng bằng sông Cửu Long đạt sản lượng lúa 24,8 triệu tấn trên diện tích gieo trồng 4,1 triệu ha. Năng suất lúa bình quân của vùng là bao nhiêu tấn/ha (làm tròn đến 1 chữ số thập phân)?","answer":"6,0","explain":"Năng suất = 24,8 ÷ 4,1 ≈ 6,0 tấn/ha.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Năm 2023, giá trị xuất khẩu của Việt Nam sang Hoa Kỳ là 96,3 tỉ USD, tổng giá trị xuất khẩu cả nước là 354,7 tỉ USD. Tỉ trọng xuất khẩu sang Hoa Kỳ chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"27,1","explain":"Tỉ trọng = 96,3 ÷ 354,7 × 100 ≈ 27,1%.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Quốc gia nào sau đây có chung đường biên giới trên đất liền với Việt Nam?","options":["A. Thái Lan","B. Myanmar","C. Malaysia","D. Lào"],"answer":"D","explain":"Việt Nam giáp Trung Quốc, Lào và Campuchia trên đất liền.","points":0.25},{"type":"mcq","level":"TH","q":"Đường cơ sở của nước ta được dùng để","options":["A. tính chiều rộng các vùng biển thuộc chủ quyền và quyền chủ quyền.","B. phân định ranh giới các tỉnh ven biển.","C. xác định ngư trường khai thác hải sản.","D. quy hoạch các khu du lịch biển."],"answer":"A","explain":"Từ đường cơ sở tính chiều rộng lãnh hải (12 hải lí), vùng tiếp giáp (12 hải lí), đặc quyền kinh tế (200 hải lí).","points":0.25},{"type":"mcq","level":"NB","q":"Cao nguyên nào sau đây nằm ở vùng Tây Bắc?","options":["A. Di Linh","B. Mộc Châu","C. Mơ Nông","D. Đắk Lắk"],"answer":"B","explain":"Cao nguyên Mộc Châu (Sơn La) thuộc vùng núi Tây Bắc; các cao nguyên còn lại thuộc Tây Nguyên.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc điểm nào sau đây đúng với địa hình vùng núi Trường Sơn Bắc?","options":["A. Cao và đồ sộ nhất nước ta.","B. Có các cánh cung lớn chụm lại ở Tam Đảo.","C. Thấp và hẹp ngang, nâng cao ở hai đầu.","D. Gồm các cao nguyên badan xếp tầng."],"answer":"C","explain":"Trường Sơn Bắc từ sông Cả tới dãy Bạch Mã: thấp, hẹp ngang, cao ở hai đầu (Tây Nghệ An, Tây Thừa Thiên Huế).","points":0.25},{"type":"mcq","level":"NB","q":"Nơi nào sau đây có lượng mưa trung bình năm lớn nhất nước ta?","options":["A. Phan Rang","B. Móng Cái","C. Cà Mau","D. Bạch Mã – Huế"],"answer":"D","explain":"Sườn đón gió của dãy Bạch Mã – khu vực Huế có lượng mưa trên 3.000 mm/năm, lớn nhất cả nước.","points":0.25},{"type":"mcq","level":"TH","q":"Gió mùa Đông Bắc khi di chuyển xuống phía nam có đặc điểm nào sau đây?","options":["A. Càng vào nam càng suy yếu và bị chặn lại ở dãy Bạch Mã.","B. Càng vào nam càng mạnh lên.","C. Gây mưa lớn cho toàn bộ lãnh thổ.","D. Hoạt động mạnh nhất vào giữa mùa hạ."],"answer":"A","explain":"Khối khí lạnh suy yếu dần khi di chuyển xuống phía nam, dãy Bạch Mã là bức chắn cuối cùng.","points":0.25},{"type":"mcq","level":"NB","q":"Sông nào sau đây chảy theo hướng tây bắc – đông nam và đổ ra biển Đông qua Đồng bằng sông Hồng?","options":["A. Sông Đà","B. Sông Hồng","C. Sông Lô","D. Sông Gâm"],"answer":"B","explain":"Sông Hồng (sông Thao) chảy hướng tây bắc – đông nam, hợp lưu sông Đà, sông Lô rồi đổ ra biển ở cửa Ba Lạt.","points":0.25},{"type":"mcq","level":"TH","q":"Chế độ nước sông ngòi nước ta có đặc điểm nào sau đây?","options":["A. Điều hòa đều đặn quanh năm.","B. Mùa lũ vào mùa xuân.","C. Phân thành mùa lũ và mùa cạn rõ rệt.","D. Lưu lượng nước lớn nhất vào mùa đông."],"answer":"C","explain":"Mùa lũ trùng với mùa mưa (hạ – thu), mùa cạn trùng mùa khô; sông ngòi theo chế độ mưa.","points":0.25},{"type":"mcq","level":"NB","q":"Hoạt động kinh tế biển nào sau đây được coi là mũi nhọn, mang lại hiệu quả cao nhất?","options":["A. Đánh bắt hải sản ven bờ","B. Làm muối thủ công","C. Nuôi trồng rong biển","D. Khai thác dầu khí"],"answer":"D","explain":"Dầu khí là ngành kinh tế biển mũi nhọn, đóng góp lớn vào GDP và ngân sách.","points":0.25},{"type":"mcq","level":"TH","q":"Vấn đề cần đặc biệt quan tâm trong bảo vệ môi trường biển đảo nước ta hiện nay là","options":["A. ô nhiễm môi trường biển và suy giảm nguồn lợi hải sản.","B. thiếu nước ngọt cho sinh hoạt.","C. xói lở bờ biển do gió mùa.","D. thiếu lao động cho nghề biển."],"answer":"A","explain":"Khai thác quá mức và ô nhiễm làm suy giảm đa dạng sinh học biển; cần khai thác đi đôi với bảo vệ.","points":0.25},{"type":"mcq","level":"NB","q":"Tỉ lệ gia tăng tự nhiên dân số nước ta hiện nay khoảng","options":["A. 1,5%/năm.","B. dưới 1%/năm.","C. 2,0%/năm.","D. trên 2,5%/năm."],"answer":"B","explain":"Tỉ suất gia tăng tự nhiên giảm còn khoảng 0,84%/năm (2023), dân số tăng chậm lại.","points":0.25},{"type":"mcq","level":"TH","q":"Cơ cấu dân số theo dân tộc của nước ta có đặc điểm nào sau đây?","options":["A. Chỉ có duy nhất dân tộc Kinh.","B. Các dân tộc thiểu số sống tập trung ở đồng bằng.","C. Có 54 dân tộc, dân tộc Kinh chiếm đa số.","D. Không có sự phân bố theo vùng rõ rệt."],"answer":"C","explain":"54 dân tộc anh em; đồng bào thiểu số chủ yếu sống ở trung du, miền núi.","points":0.25},{"type":"mcq","level":"TH","q":"Thị trường xuất khẩu lớn nhất của Việt Nam hiện nay là","options":["A. Lào.","B. Campuchia.","C. Myanmar.","D. Hoa Kỳ."],"answer":"D","explain":"Hoa Kỳ là thị trường xuất khẩu lớn nhất của Việt Nam nhiều năm liền.","points":0.25},{"type":"mcq","level":"NB","q":"Cây công nghiệp hàng năm quan trọng nhất ở Đồng bằng sông Cửu Long là","options":["A. mía.","B. cà phê.","C. cao su.","D. chè."],"answer":"A","explain":"Mía là cây công nghiệp hàng năm quan trọng của ĐBSCL, phục vụ công nghiệp đường.","points":0.25},{"type":"mcq","level":"TH","q":"Khó khăn lớn nhất trong phát triển cây công nghiệp lâu năm ở Tây Nguyên là","options":["A. đất đai bạc màu.","B. mùa khô kéo dài gây thiếu nước.","C. thiếu lao động.","D. địa hình quá dốc."],"answer":"B","explain":"Mùa khô 4–5 tháng gây thiếu nước tưới; cần đầu tư thủy lợi.","points":0.25},{"type":"mcq","level":"NB","q":"Trung tâm công nghiệp lớn thứ hai của nước ta là","options":["A. Đà Nẵng.","B. Cần Thơ.","C. Hà Nội.","D. Hải Phòng."],"answer":"C","explain":"Hà Nội là trung tâm công nghiệp lớn thứ hai sau TP. Hồ Chí Minh.","points":0.25},{"type":"mcq","level":"TH","q":"Ngành công nghiệp nào sau đây có vai trò chủ đạo, cung cấp năng lượng cho các ngành kinh tế?","options":["A. Công nghiệp dệt – may","B. Công nghiệp thực phẩm","C. Công nghiệp giấy","D. Công nghiệp năng lượng"],"answer":"D","explain":"Năng lượng (điện, than, dầu khí) là ngành cơ sở hạ tầng, đi trước một bước.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa) về sản lượng thủy sản năm 2023 (nghìn tấn): Khai thác 3.860, Nuôi trồng 5.490, Tổng số 9.350. Nhận xét nào sau đây đúng?","options":["A. Nuôi trồng chiếm khoảng 58,7% tổng sản lượng thủy sản.","B. Khai thác vẫn chiếm trên 60% sản lượng.","C. Tổng sản lượng thủy sản chưa đạt 8 triệu tấn.","D. Nuôi trồng có sản lượng thấp hơn khai thác."],"answer":"A","explain":"5.490/9.350 đạt khoảng 58,7%; nuôi trồng vượt khai thác và tăng nhanh hơn.","points":0.25},{"type":"truefalse","level":"TH","q":"Về sông ngòi Việt Nam, xét tính đúng, sai của các nhận định sau:","statements":["a) Sông Mê Kông đổ ra biển qua 9 cửa ở Đồng bằng sông Cửu Long.","b) Sông Hồng bắt nguồn từ Trung Quốc.","c) Sông Đồng Nai là sông lớn nhất chảy hoàn toàn trong lãnh thổ Việt Nam.","d) Tất cả các sông ở nước ta đều đổ ra biển Đông."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: có sông chảy sang Lào, Campuchia.","points":1},{"type":"truefalse","level":"VD","q":"Về phát triển nông nghiệp hàng hóa ở Đông Nam Bộ, xét tính đúng, sai của các nhận định sau:","statements":["a) Là vùng chuyên canh cây công nghiệp lâu năm lớn thứ hai cả nước.","b) Chăn nuôi theo hướng công nghiệp phát triển mạnh ven đô thị.","c) Cây cao su chiếm diện tích lớn nhất trong các cây công nghiệp của vùng.","d) Vùng dẫn đầu cả nước về sản lượng lương thực."],"answer":["T","T","T","F"],"explain":"a, b, c đúng: ĐNB chuyên canh cao su, điều, hồ tiêu; chăn nuôi công nghiệp ven TP.HCM. d sai: vựa lương thực là ĐBSCL.","points":1},{"type":"truefalse","level":"TH","q":"Về giao thông vận tải ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Đường bộ đảm nhận tỉ trọng lớn nhất về khối lượng vận chuyển hàng hóa.","b) Đường biển đảm nhận khối lượng hàng hóa luân chuyển lớn nhất.","c) Đường sắt Bắc – Nam dài 1.726 km.","d) Hàng không chủ yếu phục vụ vận chuyển hàng hóa khối lượng lớn."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: hàng không chủ yếu chở khách, hàng nhẹ.","points":1},{"type":"truefalse","level":"VDC","q":"Cho bảng số liệu (minh họa): GDP bình quân đầu người Việt Nam năm 2015 là 2.109 USD, năm 2023 là 4.284 USD. Xét tính đúng, sai của các nhận định sau:","statements":["a) GDP bình quân đầu người năm 2023 gấp hơn 2 lần năm 2015.","b) Thu nhập bình quân đầu người tăng nhanh thể hiện kinh tế phát triển.","c) Năm 2023, Việt Nam đã thuộc nhóm nước thu nhập cao.","d) Tăng trưởng GDP bình quân đầu người gắn với chuyển dịch cơ cấu kinh tế."],"answer":["T","T","F","T"],"explain":"a đúng: 4.284/2.109 đạt khoảng 2,03 lần. b, d đúng. c sai: Việt Nam vẫn thuộc nhóm thu nhập trung bình.","points":1},{"type":"short","level":"TH","q":"Nhà máy thủy điện Sơn La có công suất 2.400 MW, thủy điện Hòa Bình có công suất 1.920 MW. Công suất của Sơn La gấp bao nhiêu lần Hòa Bình?","answer":"1,25","explain":"2.400 ÷ 1.920 = 1,25 lần.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Diện tích cây công nghiệp lâu năm của Đông Nam Bộ (nghìn ha): năm 2010 là 640; năm 2023 là 720. Tốc độ tăng diện tích giai đoạn 2010 – 2023 là bao nhiêu %?","answer":"12,5","explain":"Tốc độ tăng = (720 − 640) ÷ 640 × 100 = 80 ÷ 640 × 100 = 12,5%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Sản lượng lúa năm 2023 (triệu tấn): Đồng bằng sông Cửu Long 24,8; Đồng bằng sông Hồng 6,1. Sản lượng lúa của Đồng bằng sông Cửu Long cao hơn Đồng bằng sông Hồng bao nhiêu triệu tấn?","answer":"18,7","explain":"24,8 − 6,1 = 18,7 triệu tấn.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Sản lượng than năm 2023 (triệu tấn): Quảng Ninh 44; cả nước 48. Tỉ trọng sản lượng than của Quảng Ninh chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"91,7","explain":"Tỉ trọng = 44 ÷ 48 × 100 ≈ 91,7%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Dân số thành thị của Việt Nam (triệu người): năm 2010 là 26,5; năm 2023 là 42,8. Tốc độ tăng dân số thành thị giai đoạn 2010 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"61,5","explain":"Tốc độ tăng = (42,8 − 26,5) ÷ 26,5 × 100 = 16,3 ÷ 26,5 × 100 ≈ 61,5%.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): GDP bình quân đầu người của Việt Nam (USD): năm 2015 là 2.109; năm 2023 là 4.284. Tốc độ tăng GDP bình quân đầu người giai đoạn 2015 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"103,1","explain":"Tốc độ tăng = (4.284 − 2.109) ÷ 2.109 × 100 = 2.175 ÷ 2.109 × 100 ≈ 103,1%.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Vùng biển mà Nhà nước ta có chủ quyền hoàn toàn như trên đất liền gồm","options":["A. nội thủy và lãnh hải.","B. vùng tiếp giáp lãnh hải.","C. vùng đặc quyền kinh tế.","D. thềm lục địa."],"answer":"A","explain":"Nội thủy và lãnh hải (12 hải lí) thuộc chủ quyền hoàn toàn; các vùng còn lại là quyền chủ quyền.","points":0.25},{"type":"mcq","level":"TH","q":"Ý nghĩa lớn nhất của đường bờ biển dài 3.260 km đối với phát triển kinh tế nước ta là","options":["A. chỉ thuận lợi cho đánh bắt hải sản.","B. phát triển tổng hợp kinh tế biển (dầu khí, hải sản, du lịch, giao thông biển).","C. chỉ thuận lợi cho du lịch.","D. hạn chế giao lưu với nước ngoài."],"answer":"B","explain":"Bờ biển dài tạo điều kiện phát triển tổng hợp các ngành kinh tế biển.","points":0.25},{"type":"mcq","level":"NB","q":"Dạng địa hình nào sau đây chiếm ưu thế ở vùng núi Đông Bắc?","options":["A. Núi cao đồ sộ","B. Cao nguyên badan","C. Núi thấp với các cánh cung","D. Đồng bằng rộng lớn"],"answer":"C","explain":"Đông Bắc chủ yếu là núi thấp (dưới 1.000 m) với 4 cánh cung lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Địa hình cacxtơ đá vôi phân bố tập trung nhất ở vùng nào sau đây?","options":["A. Tây Nguyên","B. Đồng bằng sông Cửu Long","C. Đông Nam Bộ","D. Đông Bắc và Bắc Trung Bộ"],"answer":"D","explain":"Đá vôi tạo địa hình cacxtơ với hang động đẹp ở Đông Bắc (Hạ Long, Tràng An) và Bắc Trung Bộ (Phong Nha).","points":0.25},{"type":"mcq","level":"NB","q":"Khu vực nào sau đây thường chịu ảnh hưởng nặng nề nhất của bão ở nước ta?","options":["A. Ven biển miền Trung","B. Đồng bằng sông Cửu Long","C. Tây Nguyên","D. Đông Nam Bộ"],"answer":"A","explain":"Bão đổ bộ nhiều nhất vào miền Trung (Bắc Trung Bộ, Duyên hải Nam Trung Bộ), gây mưa lớn, lũ lụt.","points":0.25},{"type":"mcq","level":"TH","q":"Mùa bão ở nước ta thường kéo dài trong khoảng thời gian nào sau đây?","options":["A. Từ tháng 12 đến tháng 5","B. Từ tháng 6 đến tháng 11","C. Quanh năm","D. Chỉ trong tháng 8"],"answer":"B","explain":"Mùa bão từ tháng 6 đến tháng 11, cao điểm tháng 9, chậm dần từ Bắc vào Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Nhóm đất chính ở các đồng bằng nước ta là","options":["A. đất feralit.","B. đất xám.","C. đất phù sa.","D. đất mùn núi cao."],"answer":"C","explain":"Đồng bằng được bồi đắp phù sa sông và biển, thích hợp trồng lúa và cây ngắn ngày.","points":0.25},{"type":"mcq","level":"TH","q":"Rừng nhiệt đới ẩm ở nước ta có đặc điểm nào sau đây?","options":["A. Cây rụng lá vào mùa khô.","B. Chỉ có một tầng cây duy nhất.","C. Nghèo về thành phần loài.","D. Nhiều tầng, nhiều loài cây, quanh năm xanh tốt."],"answer":"D","explain":"Khí hậu nhiệt đới ẩm tạo rừng rậm nhiều tầng, đa dạng sinh học cao.","points":0.25},{"type":"mcq","level":"NB","q":"Biện pháp hiệu quả nhất để hạn chế xói mòn đất ở vùng đồi núi là","options":["A. trồng rừng và canh tác theo đường đồng mức.","B. đốt nương làm rẫy.","C. canh tác theo sườn dốc.","D. bỏ hoang đất dốc."],"answer":"A","explain":"Trồng rừng phòng hộ và làm ruộng bậc thang, trồng cây theo đường đồng mức chống xói mòn.","points":0.25},{"type":"mcq","level":"NB","q":"Đô thị được xếp loại đặc biệt ở nước ta hiện nay gồm","options":["A. Hải Phòng và Đà Nẵng.","B. Hà Nội và Thành phố Hồ Chí Minh.","C. Cần Thơ và Huế.","D. Đà Nẵng và Cần Thơ."],"answer":"B","explain":"Hà Nội và TP. Hồ Chí Minh là hai đô thị loại đặc biệt, trung tâm kinh tế – chính trị lớn nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Lao động nước ta tập trung đông nhất trong ngành nào sau đây?","options":["A. Công nghiệp chế biến","B. Dịch vụ tài chính","C. Nông, lâm nghiệp và thủy sản","D. Giáo dục"],"answer":"C","explain":"Dù giảm dần, nông – lâm – thủy sản vẫn thu hút tỉ trọng lao động lớn nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa) về tỉ lệ lao động qua đào tạo: năm 2010 là 14,6%, năm 2023 là 27,0%. Nhận xét nào sau đây đúng?","options":["A. Tỉ lệ lao động qua đào tạo giảm dần.","B. Lao động nước ta đã hoàn toàn qua đào tạo.","C. Chất lượng lao động không thay đổi.","D. Chất lượng lao động ngày càng được nâng cao."],"answer":"D","explain":"Tỉ lệ lao động qua đào tạo tăng gần gấp đôi sau 13 năm, phản ánh chất lượng nguồn nhân lực cải thiện.","points":0.25},{"type":"mcq","level":"NB","q":"Vùng nuôi trồng thủy sản lớn nhất nước ta là","options":["A. Đồng bằng sông Cửu Long.","B. Đồng bằng sông Hồng.","C. Duyên hải Nam Trung Bộ.","D. Đông Nam Bộ."],"answer":"A","explain":"ĐBSCL dẫn đầu về diện tích và sản lượng nuôi trồng (cá tra, tôm sú, tôm thẻ).","points":0.25},{"type":"mcq","level":"TH","q":"Nghề nuôi tôm ở Đồng bằng sông Cửu Long phát triển mạnh chủ yếu nhờ","options":["A. địa hình đồi núi.","B. diện tích mặt nước lớn, khí hậu thuận lợi, thị trường tiêu thụ rộng.","C. khí hậu lạnh.","D. nguồn vốn đầu tư duy nhất từ nhà nước."],"answer":"B","explain":"ĐBSCL có bãi triều, rừng ngập mặn, khí hậu nóng ẩm thuận lợi nuôi tôm xuất khẩu.","points":0.25},{"type":"mcq","level":"NB","q":"Khoáng sản có trữ lượng lớn nhất ở Trung du và miền núi Bắc Bộ là","options":["A. dầu mỏ.","B. bô xít.","C. than.","D. titan."],"answer":"C","explain":"Bể than Quảng Ninh (antraxit) có trữ lượng hàng tỉ tấn, lớn nhất Đông Nam Á.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghiệp khai thác dầu khí ở nước ta phát triển mạnh nhất ở vùng nào sau đây?","options":["A. Đồng bằng sông Hồng","B. Tây Nguyên","C. Bắc Trung Bộ","D. Đông Nam Bộ"],"answer":"D","explain":"Dầu khí khai thác ở thềm lục địa phía Nam, trung tâm điều hành đặt tại Vũng Tàu (Đông Nam Bộ).","points":0.25},{"type":"mcq","level":"NB","q":"Sân bay quốc tế lớn nhất nước ta hiện nay là","options":["A. Tân Sơn Nhất.","B. Nội Bài.","C. Đà Nẵng.","D. Cam Ranh."],"answer":"A","explain":"Tân Sơn Nhất (TP. Hồ Chí Minh) có lượng hành khách và hàng hóa thông qua lớn nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa) về giá trị xuất khẩu (tỉ USD): năm 2015 là 162,1; năm 2023 là 354,7. Nhận xét nào sau đây đúng?","options":["A. Giá trị xuất khẩu giảm dần.","B. Giá trị xuất khẩu tăng hơn 2 lần sau 8 năm.","C. Năm 2023 xuất khẩu chưa đạt 300 tỉ USD.","D. Xuất khẩu tăng chậm do thiếu thị trường."],"answer":"B","explain":"354,7/162,1 đạt khoảng 2,19 lần; xuất khẩu tăng nhanh nhờ hội nhập.","points":0.25},{"type":"truefalse","level":"TH","q":"Về thiên nhiên nhiệt đới ẩm gió mùa của nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Tính chất nhiệt đới thể hiện ở tổng bức xạ lớn, cân bằng bức xạ dương quanh năm.","b) Lượng mưa lớn, trung bình năm từ 1.500 đến 2.000 mm.","c) Gió mùa tạo nên sự phân mùa khí hậu sâu sắc.","d) Thiên nhiên nước ta hoàn toàn đồng nhất từ Bắc vào Nam."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: thiên nhiên phân hóa theo Bắc-Nam, Đông-Tây, độ cao.","points":1},{"type":"truefalse","level":"VD","q":"Về sản xuất lúa gạo ở Đồng bằng sông Cửu Long, xét tính đúng, sai của các nhận định sau:","statements":["a) Là vùng sản xuất lúa lớn nhất cả nước.","b) Bình quân lương thực đầu người cao nhất cả nước.","c) Lúa gạo của vùng đóng vai trò chủ lực trong xuất khẩu gạo quốc gia.","d) Diện tích trồng lúa của vùng đang mở rộng nhanh do phá rừng."],"answer":["T","T","T","F"],"explain":"a,b,c đúng: ĐBSCL là vựa lúa số một. d sai: không phá rừng mở rộng; một phần chuyển sang cây ăn quả, thủy sản.","points":1},{"type":"truefalse","level":"TH","q":"Về du lịch ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Tài nguyên du lịch tự nhiên đa dạng: biển đảo, núi, hang động.","b) Tài nguyên du lịch nhân văn phong phú: di tích, lễ hội, làng nghề.","c) Duyên hải Nam Trung Bộ có nhiều bãi biển đẹp thu hút khách quốc tế.","d) Du lịch chỉ phát triển ở các thành phố lớn."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: du lịch phát triển khắp cả nước, nhiều điểm đến ở miền núi, hải đảo.","points":1},{"type":"truefalse","level":"VDC","q":"Cho bảng số liệu (minh họa) về diện tích rừng (triệu ha): năm 2010 là 13,4; năm 2023 là 14,9. Độ che phủ rừng năm 2023 đạt trên 42%. Xét tính đúng, sai của các nhận định sau:","statements":["a) Diện tích rừng tăng thêm 1,5 triệu ha sau 13 năm.","b) Độ che phủ rừng của nước ta thuộc loại cao trong khu vực.","c) Rừng trồng đóng góp quan trọng vào việc tăng diện tích rừng.","d) Diện tích rừng tự nhiên không còn bị suy giảm."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c (rừng tăng 1,5 triệu ha); sai d: rừng tự nhiên vẫn chịu áp lực.","points":1},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Diện tích rừng năm 2023 (triệu ha): rừng trồng 4,6; tổng diện tích rừng 14,9. Tỉ trọng diện tích rừng trồng chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"30,9","explain":"Tỉ trọng = 4,6 ÷ 14,9 × 100 ≈ 30,9%.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Giá trị xuất khẩu thủy sản của Việt Nam (tỉ USD): năm 2015 là 6,6; năm 2023 là 10,0. Tốc độ tăng trưởng giai đoạn 2015 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"51,5","explain":"Tốc độ tăng = (10,0 − 6,6) ÷ 6,6 × 100 = 3,4 ÷ 6,6 × 100 ≈ 51,5%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Diện tích nuôi trồng thủy sản năm 2023 (triệu ha): nuôi tôm 0,75; tổng diện tích 1,3. Tỉ trọng diện tích nuôi tôm chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"57,7","explain":"Tỉ trọng = 0,75 ÷ 1,3 × 100 ≈ 57,7%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Độ che phủ rừng của Việt Nam: năm 2010 là 39,5%; năm 2023 là 42,1%. Độ che phủ rừng đã tăng thêm bao nhiêu điểm phần trăm?","answer":"2,6","explain":"42,1 − 39,5 = 2,6 điểm phần trăm.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Năm 2023, cả nước gieo trồng 7,1 triệu ha lúa, sản lượng đạt 43,6 triệu tấn. Năng suất lúa bình quân cả nước là bao nhiêu tấn/ha (làm tròn đến 1 chữ số thập phân)?","answer":"6,1","explain":"Năng suất = 43,6 ÷ 7,1 ≈ 6,1 tấn/ha.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Kim ngạch xuất nhập khẩu của Việt Nam năm 2023 (tỉ USD): xuất khẩu 354,7; nhập khẩu 326,4. Cán cân thương mại năm 2023 xuất siêu bao nhiêu tỉ USD?","answer":"28,3","explain":"354,7 − 326,4 = 28,3 tỉ USD.","points":0.5}]}]}
