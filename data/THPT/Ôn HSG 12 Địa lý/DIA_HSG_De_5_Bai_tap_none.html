<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 5", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Tây Nguyên đang đứng trước mâu thuẫn gay gắt giữa phát triển kinh tế (mở rộng cây công nghiệp, xây dựng thuỷ điện, khai thác bô-xít) và bảo vệ môi trường (rừng đầu nguồn của các hệ thống sông Sê San, Srêpôk, Đồng Nai). Định hướng phát triển bền vững đúng đắn nhất cho vùng là gì?", "options": ["A. Ngừng mọi hoạt động khai thác tài nguyên để bảo vệ tuyệt đối rừng đầu nguồn.", "B. Phát triển nông, lâm kết hợp, trồng rừng và bảo vệ nghiêm ngặt rừng đầu nguồn; khai thác bô-xít gắn với hoàn thổ và bảo vệ môi trường; phát triển thuỷ điện hợp lí kết hợp du lịch sinh thái, văn hoá cồng chiêng.", "C. Chuyển toàn bộ diện tích sang trồng lúa nước để đảm bảo lương thực.", "D. Khuyến khích di dân tự do vào rừng để mở rộng diện tích sản xuất."], "answer": "B", "explain": "Tây Nguyên là mái nhà của Nam Bộ, rừng đầu nguồn điều tiết nước cho các sông lớn và các nhà máy thuỷ điện, chống xói mòn, bảo tồn đa dạng sinh học. Phát triển bền vững phải hài hoà: nông lâm kết hợp (cà phê xen cây che bóng, trồng rừng), khai thác bô-xít (Đắk Nông) phải hoàn thổ, xử lí bùn đỏ; thuỷ điện vừa phải, tránh chặt phá rừng làm hồ chứa tràn lan; phát huy du lịch sinh thái và văn hoá (Không gian văn hoá cồng chiêng là di sản UNESCO). Phương án A cực đoan, bỏ phí tiềm năng; C phi thực tế (địa hình cao nguyên, thiếu nước mùa khô); D gây phá rừng, xung đột đất đai."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Đông Nam Bộ là vùng kinh tế phát triển nhất cả nước nhưng quỹ đất nông nghiệp ngày càng thu hẹp do công nghiệp hoá, đô thị hoá. Hướng phát triển đúng đắn, có tính chiến lược nhất của vùng trong giai đoạn tới là gì?", "options": ["A. Mở rộng diện tích trồng cây công nghiệp bằng mọi giá để giữ vị trí số một.", "B. Khai thác lãnh thổ theo chiều sâu: phát triển công nghiệp công nghệ cao, dịch vụ cao cấp (tài chính, logistics), cảng biển nước sâu Cái Mép, Thị Vải, dầu khí; nâng cao hiệu quả sử dụng đất đai, lao động và vốn thay vì mở rộng diện tích.", "C. Chuyển nền kinh tế vùng trở lại thuần nông nghiệp.", "D. Hạn chế thu hút đầu tư nước ngoài để giảm sức ép lên đất đai."], "answer": "B", "explain": "Khi quỹ đất có hạn và giá đất cao, con đường duy nhất là khai thác theo chiều sâu: tăng năng suất, chất lượng, giá trị gia tăng trên mỗi đơn vị đất, lao động, vốn. Thực tế ĐNB đang làm: chuyển sang công nghiệp công nghệ cao (khu công nghệ cao TP. Hồ Chí Minh), dịch vụ tài chính, logistics (cảng Cái Mép đón tàu mẹ trọng tải lớn), dầu khí (Bà Rịa Vũng Tàu). Nông nghiệp chuyển sang nông nghiệp đô thị, công nghệ cao. Phương án A, C đi ngược quy luật phát triển; D sai vì FDI là động lực chính của vùng."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu diện tích gieo trồng lúa của Đồng bằng sông Cửu Long (đơn vị: triệu ha, nguồn: Tổng cục Thống kê): năm 2015: 4,3; năm 2020: 4,0; năm 2023: 3,9. Xu hướng giảm diện tích lúa này phản ánh quá trình gì?", "options": ["A. Năng suất lúa giảm sút nên nông dân bỏ ruộng hoang.", "B. Chuyển đổi cơ cấu sản xuất thích ứng với biến đổi khí hậu: từ độc canh lúa sang đa dạng hoá (mô hình lúa, tôm, cây ăn trái, thuỷ sản) do xâm nhập mặn, sụt lún, thiếu nước ngọt ngày càng gay gắt.", "C. Đất đai ở Đồng bằng sông Cửu Long đã bị sa mạc hoá hoàn toàn.", "D. Nhà nước cấm trồng lúa ở Đồng bằng sông Cửu Long."], "answer": "B", "explain": "Đây là chủ trương lớn (Nghị quyết 120 về phát triển bền vững ĐBSCL thích ứng biến đổi khí hậu): không cố giữ diện tích lúa bằng mọi giá mà chuyển đổi linh hoạt theo điều kiện nước (ngọt, lợ, mặn). Vùng ven biển chuyển sang lúa, tôm, nuôi thuỷ sản; vùng ngọt hoá trồng cây ăn trái, rau màu giá trị cao. Nguyên nhân: xâm nhập mặn lấn sâu (có năm vào sâu 100 km), sụt lún do khai thác nước ngầm, nước thượng nguồn Mê Công giảm do đập thuỷ điện. Phương án A sai (năng suất vẫn trên 60 tạ/ha); C, D phi thực tế."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Việt Nam có hơn 2.700 đảo ven bờ, bờ biển dài 3.260 km, vùng biển rộng khoảng 1 triệu km2 với hai quần đảo xa bờ là Hoàng Sa và Trường Sa. Trong chiến lược phát triển bền vững kinh tế biển, nhiệm vụ nào có ý nghĩa quyết định, bao trùm nhất?", "options": ["A. Khai thác tối đa tài nguyên biển để tăng trưởng GDP nhanh nhất.", "B. Phát triển tổng hợp các ngành kinh tế biển gắn chặt với bảo vệ môi trường biển và bảo vệ vững chắc chủ quyền, quyền chủ quyền biển đảo thiêng liêng của Tổ quốc.", "C. Chỉ tập trung phát triển du lịch biển đảo.", "D. Đóng cửa toàn bộ các ngư trường để bảo vệ nguồn lợi thuỷ sản."], "answer": "B", "explain": "Chiến lược biển Việt Nam xác định: phát triển kinh tế biển (đánh bắt, nuôi trồng, du lịch, cảng biển, dầu khí, điện gió ngoài khơi) phải đi đôi với bảo vệ môi trường (chống ô nhiễm, bảo tồn đa dạng sinh học, ứng phó sự cố tràn dầu) và bảo vệ chủ quyền (Hoàng Sa thuộc Đà Nẵng, Trường Sa thuộc Khánh Hoà; Việt Nam phê chuẩn Công ước Luật Biển 1982 năm 1994). Ba nhiệm vụ này thống nhất: ngư dân bám biển vừa sản xuất vừa góp phần khẳng định chủ quyền; kinh tế biển mạnh là cơ sở vật chất cho quốc phòng. Phương án A, D cực đoan; C phiến diện."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hành lang kinh tế Lào Cai, Hà Nội, Hải Phòng, Quảng Ninh được xác định là một trong những hành lang kinh tế quan trọng nhất của vùng Trung du và miền núi Bắc Bộ. Ý nghĩa tổng hợp, sâu sắc nhất của hành lang này là gì?", "options": ["A. Chỉ phục vụ phát triển du lịch Sa Pa, Lào Cai.", "B. Kết nối vùng giàu tài nguyên (Trung du và miền núi Bắc Bộ) với trung tâm chính trị, kinh tế (Hà Nội) và cửa ngõ ra biển (Hải Phòng, Quảng Ninh), thúc đẩy giao thương với Trung Quốc và hội nhập quốc tế, tạo sức lan toả phát triển cho cả vùng Tây Bắc và Đông Bắc.", "C. Chỉ để vận chuyển than từ Quảng Ninh lên Lào Cai.", "D. Tạo ranh giới ngăn cách các vùng kinh tế với nhau."], "answer": "B", "explain": "Hành lang kinh tế là trục kết nối đa chiều: Lào Cai (cửa khẩu quốc tế, khoáng sản apatit, du lịch Sa Pa) với Hà Nội (thủ đô, trung tâm công nghiệp, dịch vụ) và Hải Phòng, Quảng Ninh (cảng biển, công nghiệp). Tuyến đường sắt, cao tốc Hà Nội, Lào Cai và cao tốc Hà Nội, Hải Phòng rút ngắn thời gian vận chuyển, giảm chi phí logistics, thu hút đầu tư vào vùng còn khó khăn, đồng thời là một phần của hành lang kinh tế Côn Minh, Lào Cai, Hà Nội, Hải Phòng trong hợp tác tiểu vùng Mê Công mở rộng. Phương án A, C nhìn nhận phiến diện một chức năng; D sai bản chất (hành lang để kết nối, không phải ngăn cách)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Đồng bằng sông Cửu Long được đánh giá là một trong những đồng bằng chịu ảnh hưởng nặng nề nhất của biến đổi khí hậu trên thế giới. Cách phân tích nào sau đây đầy đủ nhất về tính dễ bị tổn thương của vùng?", "options": ["A. Do vùng nằm xa xích đạo nên khí hậu thất thường.", "B. Do địa hình thấp (nhiều nơi dưới 1 m so với mực nước biển) nên chịu tác động tổng hợp của nước biển dâng, xâm nhập mặn, lũ và sụt lún đất do khai thác nước ngầm quá mức; đồng thời đây là vựa lúa, thuỷ sản, trái cây lớn nhất nước nên thiệt hại kinh tế, xã hội và an ninh lương thực sẽ rất nghiêm trọng.", "C. Do vùng không có hệ thống đê điều bảo vệ.", "D. Do dân số vùng quá đông gây sức ép lên tài nguyên."], "answer": "B", "explain": "Tính dễ bị tổn thương là tích của mức độ phơi nhiễm và mức độ nhạy cảm. Phơi nhiễm: địa hình thấp trũng, 3 mặt giáp biển, nước biển dâng 1 m sẽ nhấn chìm khoảng 40% diện tích; xâm nhập mặn, lũ đầu nguồn, sụt lún (có nơi 2 đến 3 cm/năm do bơm nước ngầm). Nhạy cảm: là vựa lúa (trên 50% sản lượng), thuỷ sản (trên 60%), trái cây lớn nhất nước, sinh kế của 17,4 triệu dân phụ thuộc vào nước ngọt. Vì vậy BĐKH đe doạ cả an ninh lương thực quốc gia và xuất khẩu. Phương án A sai (vùng gần xích đạo); C sai (có đê bao, nhưng đê bao triệt để lại gây hệ luỵ); D không phải nguyên nhân chính."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các nhận định sau về Tây Nguyên và Đông Nam Bộ:", "statements": ["a) Tây Nguyên là vùng trồng cà phê lớn nhất cả nước, chiếm khoảng 90% diện tích và sản lượng cà phê.", "b) Việt Nam đứng đầu thế giới về sản lượng và xuất khẩu hồ tiêu, cây hồ tiêu trồng nhiều ở Tây Nguyên và Đông Nam Bộ.", "c) Đông Nam Bộ dẫn đầu cả nước về giá trị sản xuất công nghiệp và thu hút vốn đầu tư trực tiếp nước ngoài (FDI).", "d) Đông Nam Bộ là vùng có diện tích rừng tự nhiên lớn nhất cả nước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Tây Nguyên (Đắk Lắk, Lâm Đồng, Gia Lai, Đắk Nông) chiếm khoảng 90% diện tích (khoảng 640 nghìn ha trên 710 nghìn ha) và sản lượng cà phê cả nước, chủ yếu cà phê vối (Robusta). b) Đúng: Việt Nam chiếm khoảng 40% sản lượng hồ tiêu thế giới, đứng đầu về xuất khẩu; vùng trồng chính là Tây Nguyên và Đông Nam Bộ (Bình Phước). c) Đúng: ĐNB chiếm khoảng 1/3 giá trị sản xuất công nghiệp và khoảng 40% vốn FDI cả nước. d) Sai: rừng tự nhiên lớn nhất tập trung ở Trung du và miền núi Bắc Bộ và Tây Nguyên; ĐNB công nghiệp hoá, đô thị hoá mạnh nên diện tích rừng còn ít."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các nhận định sau về Đồng bằng sông Cửu Long và biển đảo Việt Nam:", "statements": ["a) Đồng bằng sông Cửu Long là vùng sản xuất lương thực, thực phẩm và thuỷ sản lớn nhất cả nước.", "b) Xâm nhập mặn ở Đồng bằng sông Cửu Long ngày càng lấn sâu vào nội đồng do nước biển dâng, lưu lượng sông Mê Công mùa khô suy giảm và khai thác nước ngầm quá mức gây sụt lún đất.", "c) Quần đảo Hoàng Sa thuộc thành phố Đà Nẵng, quần đảo Trường Sa thuộc tỉnh Khánh Hoà.", "d) Cảng Cái Mép, Thị Vải là cảng nước sâu lớn nhất của Đồng bằng sông Cửu Long."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: ĐBSCL chiếm trên 50% sản lượng lúa, khoảng 70% sản lượng thuỷ sản nuôi trồng và phần lớn trái cây xuất khẩu của cả nước. b) Đúng: ba nguyên nhân cộng hưởng, có năm mặn xâm nhập sâu trên 100 km (sông Vàm Cỏ, sông Tiền, sông Hậu), hàng trăm nghìn ha lúa, cây ăn trái bị ảnh hưởng. c) Đúng: huyện đảo Hoàng Sa trực thuộc Đà Nẵng, huyện đảo Trường Sa trực thuộc Khánh Hoà, khẳng định chủ quyền hành chính của Việt Nam. d) Sai: cảng Cái Mép, Thị Vải thuộc tỉnh Bà Rịa Vũng Tàu, tức vùng Đông Nam Bộ, là cảng nước sâu đón được tàu mẹ trọng tải lớn; ĐBSCL có cảng Cần Thơ nhưng là cảng sông, cỡ nhỏ hơn."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cả nước có khoảng 710 nghìn ha cà phê, trong đó Tây Nguyên chiếm khoảng 90% (nguồn: Tổng cục Thống kê, số liệu khoảng). Tính diện tích trồng cà phê của Tây Nguyên (đơn vị: nghìn ha).", "answer": "639", "explain": "Diện tích cà phê Tây Nguyên bằng tổng diện tích cả nước nhân với tỉ trọng: 710 nhân 90% bằng 639 nghìn ha. Với diện tích này, Tây Nguyên là thủ phủ cà phê của Việt Nam (chủ yếu cà phê vối Robusta ở Đắk Lắk, Lâm Đồng, Gia Lai, Đắk Nông), đưa Việt Nam thành nước xuất khẩu cà phê lớn thứ hai thế giới (sau Brazil) và số một về cà phê Robusta."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Kim ngạch xuất khẩu thuỷ sản của nước ta (nguồn: Tổng cục Thống kê): năm 2022 đạt 11 tỉ USD, năm 2023 đạt 9,2 tỉ USD. Tính tỉ lệ phần trăm giá trị xuất khẩu năm 2023 so với năm 2022 (đơn vị: %, làm tròn đến hàng đơn vị).", "answer": "84", "explain": "Tỉ lệ phần trăm bằng giá trị năm 2023 chia cho giá trị năm 2022 rồi nhân 100: 9,2 chia 11 nhân 100 bằng 83,6%, làm tròn thành 84%. Xuất khẩu thuỷ sản giảm do nhu cầu thị trường thế giới (Mỹ, EU, Trung Quốc) suy yếu vì lạm phát, tồn kho cao sau đại dịch. Dù vậy thuỷ sản vẫn là mặt hàng xuất khẩu chủ lực với các thị trường lớn và vùng nuôi trồng trọng điểm ở Đồng bằng sông Cửu Long (cá tra) và Duyên hải Nam Trung Bộ (tôm)."}]}]}
