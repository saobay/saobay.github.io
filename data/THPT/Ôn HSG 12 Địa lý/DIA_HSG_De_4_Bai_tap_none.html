<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 4", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trung du và miền núi Bắc Bộ là vùng giàu tài nguyên khoáng sản nhất cả nước (than, sắt, đồng, apatit, thiếc, chì, kẽm), có tiềm năng thuỷ điện lớn nhất và nhiều cảnh quan du lịch nổi tiếng (Hạ Long, Sa Pa, Ba Bể), nhưng kinh tế vẫn chậm phát triển. Nguyên nhân chủ yếu, mang tính tổng hợp nhất là gì?", "options": ["A. Vùng thiếu tài nguyên thiên nhiên nên không có cơ sở phát triển.", "B. Địa hình hiểm trở, giao thông khó khăn; trình độ dân trí thấp, thiếu lao động kĩ thuật; vốn đầu tư hạn chế; khai thác tài nguyên phải gắn chặt với bảo vệ môi trường sinh thái nhạy cảm và quốc phòng an ninh biên giới.", "C. Khí hậu quá lạnh giá nên không thể sản xuất nông, công nghiệp.", "D. Vùng không có cửa khẩu quốc tế nên bị cô lập với bên ngoài."], "answer": "B", "explain": "Nghịch lí giàu tài nguyên nhưng nghèo khó được giải thích bằng tổ hợp: địa hình núi cao hiểm trở (Hoàng Liên Sơn, các cao nguyên đá vôi) khiến chi phí xây dựng hạ tầng, vận chuyển rất cao; dân cư là đồng bào dân tộc thiểu số, trình độ dân trí thấp, thiếu lao động qua đào tạo; tích luỹ vốn thấp, khó thu hút đầu tư; khai thác khoáng sản, thuỷ điện phải đánh đổi môi trường (ô nhiễm, sạt lở) và đây là vùng biên giới chiến lược. Phương án A sai (vùng giàu tài nguyên nhất); C sai (chỉ một số nơi rét đậm, vùng vẫn trồng chè, cây ăn quả ôn đới tốt); D sai (có các cửa khẩu lớn: Lào Cai, Lạng Sơn, Móng Cái)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Mâu thuẫn lớn nhất trong phát triển kinh tế, xã hội của Đồng bằng sông Hồng là dân số đông, mật độ cao nhất cả nước trong khi bình quân đất canh tác đầu người thấp nhất. Giải pháp căn bản, lâu dài để giải quyết mâu thuẫn này là gì?", "options": ["A. Mở rộng diện tích đất nông nghiệp bằng cách lấn biển quy mô lớn.", "B. Chuyển dịch mạnh cơ cấu kinh tế theo hướng công nghiệp hoá, hiện đại hoá: phát triển công nghiệp, dịch vụ và đô thị để tạo việc làm phi nông nghiệp; trong nông nghiệp đẩy mạnh thâm canh, tăng vụ và chuyển sang sản xuất hàng hoá giá trị cao.", "C. Hạn chế phát triển công nghiệp để giữ đất cho nông nghiệp.", "D. Tổ chức di dân ồ ạt ra các vùng khác trong cả nước."], "answer": "B", "explain": "Với mật độ trên 1.100 người/km2, không thể giải quyết việc làm bằng nông nghiệp thuần tuý. Hướng đi đúng là chuyển dịch cơ cấu: phát triển công nghiệp (vùng KTTĐ Bắc Bộ), dịch vụ, đô thị để thu hút lao động; nông nghiệp chuyển sang thâm canh, sản xuất rau, hoa, quả, chăn nuôi hàng hoá phục vụ đô thị. Thực tế ĐBSH đã làm tốt: tỉ trọng nông nghiệp trong GRDP vùng chỉ còn khoảng 6 đến 7%. Phương án A tốn kém, ảnh hưởng môi trường; C đi ngược quy luật; D không khả thi và gây xáo trộn xã hội."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu diện tích cây công nghiệp lâu năm năm 2023 (đơn vị: nghìn ha, khoảng): Bắc Trung Bộ 245 (chè, cà phê, cao su, hồ tiêu); Duyên hải Nam Trung Bộ 180 (điều, nho, thanh long, dừa). Vì sao Bắc Trung Bộ trồng được chè, cà phê (cây có nguồn gốc cận nhiệt) còn Duyên hải Nam Trung Bộ lại mạnh về nho, thanh long, điều (cây chịu hạn)?", "options": ["A. Vì Bắc Trung Bộ có đất phù sa màu mỡ hơn Duyên hải Nam Trung Bộ.", "B. Vì Bắc Trung Bộ chịu ảnh hưởng của gió mùa Đông Bắc nên mùa đông lạnh, lại có địa hình đồi núi phía Tây (Tây Nghệ An, Tây Thanh Hoá, Tây Quảng Bình) thích hợp cây cận nhiệt; còn Duyên hải Nam Trung Bộ có khí hậu khô nóng, ít mưa, nhiều nắng, đất cát pha, rất hợp với cây chịu hạn.", "C. Vì Duyên hải Nam Trung Bộ nằm gần xích đạo hơn Bắc Trung Bộ.", "D. Vì Bắc Trung Bộ có hệ thống sông ngòi dày đặc hơn."], "answer": "B", "explain": "Đây là biểu hiện của sự phân hoá khí hậu theo vĩ độ kết hợp địa hình. Bắc Trung Bộ (từ Thanh Hoá đến Thừa Thiên Huế) vào mùa đông chịu ảnh hưởng của gió mùa Đông Bắc (dù đã suy yếu) nên có mùa đông lạnh, cộng với địa hình núi phía Tây tạo tiểu khí hậu mát, thích hợp chè (Tây Nghệ An), cà phê (Tây Quảng Trị). Duyên hải Nam Trung Bộ (Đà Nẵng đến Bình Thuận) nằm trong vùng khô hạn nhất nước (Ninh Thuận, Bình Thuận mưa 700 đến 800 mm/năm), nắng nhiều, đất cát ven biển, lí tưởng cho nho, thanh long, điều, dừa. Phương án A sai (đất badan, feralit chứ không phải phù sa); C sai (chênh lệch vĩ độ nhỏ, nguyên nhân chính là hoàn lưu và địa hình)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Duyên hải Nam Trung Bộ có tiềm năng kinh tế biển tổng hợp rất lớn: đánh bắt và nuôi trồng thuỷ sản, du lịch biển đảo, cảng biển nước sâu, điện gió, điện mặt trời, làm muối. Trong phát triển kinh tế biển của vùng, vấn đề có ý nghĩa chiến lược nhất là gì?", "options": ["A. Chỉ tập trung phát triển đánh bắt xa bờ để tăng sản lượng thuỷ sản.", "B. Phát triển tổng hợp các ngành kinh tế biển gắn với bảo vệ môi trường biển và tăng cường quốc phòng, an ninh, bảo vệ vững chắc chủ quyền biển đảo (quần đảo Hoàng Sa, Trường Sa).", "C. Chỉ tập trung phát triển du lịch biển đảo.", "D. Khai thác tài nguyên biển bằng mọi giá để tăng trưởng GDP."], "answer": "B", "explain": "Duyên hải Nam Trung Bộ án ngữ Biển Đông, là cửa ngõ ra biển của Tây Nguyên và Nam Lào, Đông Bắc Campuchia, đồng thời là vùng biển có quần đảo Hoàng Sa (Đà Nẵng) và Trường Sa (Khánh Hoà). Phát triển kinh tế biển ở đây không thể tách rời quốc phòng an ninh: ngư dân bám biển vừa sản xuất vừa góp phần bảo vệ chủ quyền; các cảng (Dung Quất, Quy Nhơn, Nha Trang) vừa kinh tế vừa chiến lược. Phương án A, C phiến diện (một ngành); D phản phát triển bền vững, gây cạn kiệt nguồn lợi và xung đột."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Dựa vào Atlat Địa lí Việt Nam và kiến thức tổng hợp, hãy xác định vùng kinh tế được mô tả: địa hình cao nguyên xếp tầng, đất badan màu mỡ; khí hậu cận xích đạo phân mùa mưa, khô sâu sắc; là vùng trồng cà phê, cao su, hồ tiêu lớn nhất cả nước; có các nhà máy thuỷ điện Yaly, Sê San; trữ lượng bô-xít hàng tỉ tấn.", "options": ["A. Trung du và miền núi Bắc Bộ.", "B. Tây Nguyên.", "C. Đông Nam Bộ.", "D. Bắc Trung Bộ."], "answer": "B", "explain": "Tổ hợp các dấu hiệu chỉ duy nhất về Tây Nguyên: cao nguyên xếp tầng (Kon Tum, Pleiku, Đắk Lắk, Lâm Đồng...); đất badan; khí hậu cận xích đạo với mùa khô sâu sắc (tháng 11 đến tháng 4); cà phê chiếm khoảng 90% diện tích cả nước; thuỷ điện Yaly (720 MW) trên sông Sê San; bô-xít tập trung ở Đắk Nông với trữ lượng hàng tỉ tấn, lớn nhất cả nước. TDMN Bắc Bộ (A) có than, apatit, thuỷ điện Hoà Bình, Sơn La chứ không có cà phê, bô-xít; ĐNB (C) có cao su, điều, dầu khí; Bắc Trung Bộ (D) có chè, cà phê quy mô nhỏ, không có bô-xít."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cả nước hiện có 4 vùng kinh tế trọng điểm: Bắc Bộ, Trung Bộ, phía Nam và Đồng bằng sông Cửu Long. Vai trò chủ yếu của các vùng kinh tế trọng điểm đối với sự phát triển chung của đất nước là gì?", "options": ["A. Là nơi tập trung đông dân cư nhất để giải quyết việc làm.", "B. Là động lực, đầu tàu phát triển, có sức lan toả mạnh mẽ về vốn, công nghệ, lao động có trình độ và thị trường ra các vùng xung quanh và cả nước, đi đầu trong hội nhập kinh tế quốc tế.", "C. Là nơi sản xuất lương thực, thực phẩm chính cho cả nước.", "D. Là vùng có diện tích tự nhiên lớn nhất để mở rộng sản xuất."], "answer": "B", "explain": "Vùng KTTĐ được xác định dựa trên hội tụ các điều kiện phát triển (vị trí, hạ tầng, lao động, vốn), đóng góp tỉ trọng lớn vào GDP (4 vùng KTTĐ đóng góp khoảng 70% GDP cả nước), thu hút phần lớn FDI, đi đầu về công nghiệp hoá, hiện đại hoá và hội nhập. Vai trò lan toả thể hiện qua chuyển giao công nghệ, đào tạo lao động, mở rộng thị trường cho các vùng khác (ví dụ KTTĐ phía Nam lan toả ra ĐBSCL, Tây Nguyên). Phương án A sai (mục tiêu là tăng trưởng chứ không phải tập trung dân); C là vai trò của ĐBSCL; D sai (KTTĐ diện tích không lớn)."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các nhận định sau về Trung du và miền núi Bắc Bộ và Đồng bằng sông Hồng:", "statements": ["a) Trung du và miền núi Bắc Bộ là vùng có diện tích tự nhiên lớn nhất cả nước, khoảng 95 nghìn km2.", "b) Than Quảng Ninh có trữ lượng lớn vào loại hàng đầu Đông Nam Á, là cơ sở quan trọng cho công nghiệp năng lượng và luyện kim của vùng và cả nước.", "c) Đồng bằng sông Hồng có bình quân lương thực có hạt đầu người cao nhất cả nước.", "d) Vùng kinh tế trọng điểm Bắc Bộ với hạt nhân là Hà Nội, Hải Phòng, Quảng Ninh là trung tâm công nghiệp, dịch vụ lớn thứ hai cả nước."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: 95,2 nghìn km2, chiếm gần 29% diện tích cả nước. b) Đúng: trữ lượng than Quảng Ninh hàng tỉ tấn, khai thác khoảng 49 triệu tấn than sạch năm 2023, cung cấp cho nhiệt điện (Phả Lại, Uông Bí) và xuất khẩu. c) Sai: do dân số đông (23,8 triệu người) nên bình quân lương thực đầu người của ĐBSH thấp (khoảng 350 đến 380 kg/người/năm), thấp nhất trong các vùng đồng bằng; cao nhất là ĐBSCL (trên 1.000 kg/người/năm). d) Đúng: KTTĐ Bắc Bộ gồm Hà Nội, Hải Phòng, Quảng Ninh, Hải Dương, Hưng Yên, Bắc Ninh, Vĩnh Phúc, là trung tâm công nghiệp, dịch vụ lớn thứ hai sau KTTĐ phía Nam."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các nhận định sau về Bắc Trung Bộ và Duyên hải Nam Trung Bộ:", "statements": ["a) Bắc Trung Bộ là một trong những vùng chịu nhiều thiên tai nhất cả nước (bão, lũ lụt, hạn hán, gió Lào).", "b) Duyên hải Nam Trung Bộ có nhiều vụng biển kín, thuận lợi xây dựng các cảng biển (Dung Quất, Quy Nhơn, Nha Trang).", "c) Nghề làm muối phát triển mạnh ở Bắc Trung Bộ nhờ khí hậu nắng nhiều, ít mưa.", "d) Dãy Trường Sơn Bắc ăn ra sát biển ở đèo Hải Vân tạo nên ranh giới phân hoá khí hậu Bắc, Nam rõ rệt."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: vị trí đón bão, địa hình hẹp ngang, gió phơn Tây Nam (gió Lào) gây khô nóng; lũ lụt lịch sử (năm 2020) gây thiệt hại nặng. b) Đúng: bờ biển khúc khuỷu với các vụng, vịnh kín (Dung Quất, Quy Nhơn, Vân Phong, Cam Ranh) là điều kiện xây cảng nước sâu. c) Sai: làm muối phát triển mạnh ở Duyên hải Nam Trung Bộ (Sa Huỳnh, Cà Ná, Ninh Thuận) nhờ nắng nhiều, ít mưa; Bắc Trung Bộ mưa nhiều, ít nắng nên không thuận lợi. d) Đúng: đèo Hải Vân (khoảng vĩ tuyến 16 độ B) là ranh giới khí hậu giữa miền Bắc và miền Nam, chắn gió mùa Đông Bắc."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "GDP của cả nước năm 2023 đạt khoảng 430 tỉ USD, trong đó Đông Nam Bộ đóng góp khoảng 32% (nguồn: Tổng cục Thống kê, số liệu khoảng). Tính quy mô GDP của Đông Nam Bộ năm 2023 (đơn vị: tỉ USD, làm tròn đến hàng đơn vị).", "answer": "138", "explain": "GDP vùng bằng GDP cả nước nhân với tỉ trọng đóng góp: 430 nhân 32% bằng 137,6 tỉ USD, làm tròn thành 138 tỉ USD. Con số này lớn hơn GDP của nhiều quốc gia trong khu vực, cho thấy vai trò đầu tàu kinh tế của Đông Nam Bộ, với các trung tâm công nghiệp, dịch vụ, cảng biển và dầu khí (TP. Hồ Chí Minh, Bình Dương, Đồng Nai, Bà Rịa Vũng Tàu)."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Sản lượng lương thực có hạt bình quân đầu người (khoảng): Đồng bằng sông Hồng đạt 380 kg/người/năm, Đồng bằng sông Cửu Long đạt 1.050 kg/người/năm. Hỏi bình quân đầu người của Đồng bằng sông Cửu Long gấp bao nhiêu lần Đồng bằng sông Hồng (làm tròn đến 1 chữ số thập phân)?", "answer": "2,8", "explain": "Lấy 1.050 chia cho 380 bằng 2,76, làm tròn thành 2,8 lần. Chênh lệch này phản ánh mâu thuẫn đất chật người đông ở ĐBSH (23,8 triệu dân trên 21,3 nghìn km2) so với ĐBSCL đất rộng, chuyên canh lúa quy mô lớn. Vì vậy ĐBSCL là vựa lúa đảm bảo an ninh lương thực quốc gia và xuất khẩu (Việt Nam thường đứng trong top 3 nước xuất khẩu gạo thế giới), còn ĐBSH phải chuyển mạnh sang công nghiệp, dịch vụ."}]}]}
