<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu nhiệt độ trung bình và lượng mưa của ba trạm khí tượng ở nước ta (khoảng, nguồn: Trung tâm Khí tượng Thủy văn quốc gia): Trạm I: tháng 1 là 16,4 độ C, tháng 7 là 29,2 độ C, mưa năm 1.676 mm, mưa tập trung tháng 5 đến tháng 9. Trạm II: tháng 1 là 20,0 độ C, tháng 7 là 29,4 độ C, mưa năm 2.868 mm, mưa tập trung tháng 9 đến tháng 12. Trạm III: tháng 1 là 25,8 độ C, tháng 7 là 27,1 độ C, mưa năm 1.931 mm, mưa tập trung tháng 5 đến tháng 10. Trạm nào nằm trong miền khí hậu phía Nam?", "options": ["A. Trạm I, vì có mùa đông lạnh, nhiệt độ tháng 1 dưới 18 độ C.", "B. Trạm II, vì có lượng mưa năm lớn nhất trong ba trạm.", "C. Trạm III, vì nhiệt độ cao quanh năm, biên độ nhiệt năm rất nhỏ và mưa phân mùa rõ rệt theo gió mùa Tây Nam.", "D. Trạm I và trạm II, vì đều có biên độ nhiệt năm lớn."], "answer": "C", "explain": "Trạm III là TP. Hồ Chí Minh, nằm trong miền khí hậu phía Nam (từ dãy Bạch Mã trở vào): nhiệt độ tháng 1 vẫn đạt 25,8 độ C, biên độ nhiệt năm chỉ khoảng 1,3 độ C (27,1 trừ 25,8), mưa phân thành hai mùa rõ rệt, mùa mưa tháng 5 đến tháng 10 trùng với thời gian hoạt động của gió mùa Tây Nam. Trạm I là Hà Nội (miền khí hậu phía Bắc, mùa đông lạnh do gió mùa Đông Bắc, tháng 1 chỉ 16,4 độ C). Trạm II là Huế (miền khí hậu Trung Bộ, mưa lớn vào thu đông tháng 9 đến tháng 12 do địa hình Trường Sơn chắn gió mùa Đông Bắc kết hợp với bão)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Vì sao Tây Nguyên có mùa khô kéo dài và sâu sắc (tháng 11 đến tháng 4 năm sau) trong khi sườn đông Trường Sơn (Huế, Đà Nẵng) lại mưa rất lớn vào đúng thời kì này?", "options": ["A. Vào mùa đông, gió mùa Đông Bắc mang ẩm từ biển vào bị dãy Trường Sơn chắn lại, gây mưa lớn ở sườn đông; khi vượt sang sườn tây (Tây Nguyên), gió đã mất ẩm và còn chịu hiệu ứng phơn nên khô nóng.", "B. Vì Tây Nguyên nằm xa biển nên ít mưa quanh năm, còn sườn đông gần biển nên mưa nhiều.", "C. Vì bão chỉ đổ bộ vào sườn đông Trường Sơn nên nơi đây mưa lớn, Tây Nguyên không có bão nên khô.", "D. Vì Tây Nguyên có độ cao lớn nên nhiệt độ thấp, hơi nước khó bốc lên gây mưa."], "answer": "A", "explain": "Đây là biểu hiện kinh điển của quy luật phân hoá theo độ cao kết hợp hoàn lưu gió mùa. Mùa đông, khối khí cực đới (gió mùa Đông Bắc) di chuyển qua biển Đông được tăng ẩm; khi gặp dãy Trường Sơn chạy gần song song với hướng gió, sườn đông đón gió gây mưa địa hình lớn (Huế khoảng 2.868 mm/năm, mưa tập trung thu đông). Sang sườn tây, không khí đã mất phần lớn hơi ẩm, lại bị nén đoạn nhiệt khi xuống thấp (hiệu ứng phơn) nên Tây Nguyên khô nóng sâu sắc. Mùa hạ thì ngược lại: gió mùa Tây Nam gây mưa cho Tây Nguyên. Các phương án B, C, D đều sai vì Tây Nguyên mưa rất lớn vào mùa hạ (không ít mưa quanh năm), bão không giải thích được mùa khô, và khô hạn do cơ chế gió chứ không phải do nhiệt độ thấp."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu lưu lượng dòng chảy trung bình tháng của sông A (đơn vị: m3/s, nguồn: SGK Địa lí 12): tháng 1: 1.318; tháng 2: 1.100; tháng 3: 914; tháng 4: 1.071; tháng 5: 1.893; tháng 6: 4.692; tháng 7: 7.986; tháng 8: 9.246; tháng 9: 6.690; tháng 10: 4.122; tháng 11: 2.813; tháng 12: 1.746. Sông A là sông nào và vì sao chế độ nước của nó thất thường, lũ tập trung cao độ?", "options": ["A. Sông Mê Công, vì có diện tích lưu vực rất lớn nên lưu lượng dồi dào.", "B. Sông Hồng, vì lưu vực nằm trong miền khí hậu phía Bắc với mưa tập trung vào mùa hạ, địa hình dốc nên lũ lên nhanh, xuống nhanh.", "C. Sông Đồng Nai, vì chế độ nước được điều tiết bởi hồ Trị An.", "D. Sông Cả, vì chịu ảnh hưởng trực tiếp của bão nhiệt đới."], "answer": "B", "explain": "Sông A là sông Hồng (số liệu tại trạm Hà Nội). Lưu lượng tháng lớn nhất (tháng 8: 9.246 m3/s) gấp hơn 10 lần tháng nhỏ nhất (tháng 3: 914 m3/s), cho thấy chế độ nước phân mùa sâu sắc và thất thường. Mùa lũ từ tháng 6 đến tháng 10 trùng hoàn toàn với mùa mưa (gió mùa mùa hạ) ở miền Bắc. Nguyên nhân lũ tập trung: mưa lớn, tập trung trong thời gian ngắn; địa hình đồi núi chiếm 3/4 diện tích lưu vực, độ dốc lớn, lớp phủ thực vật bị suy giảm nên nước tập trung nhanh về sông. Sông Mê Công có tổng lượng nước lớn gấp nhiều lần và mùa lũ muộn hơn (tháng 8 đến tháng 10, đỉnh tháng 9)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nước ta nằm ở rìa phía đông bán đảo Đông Dương, lãnh thổ kéo dài trên 15 vĩ độ (từ 8 độ 34 phút B đến 23 độ 23 phút B), vừa gắn với lục địa vừa tiếp giáp Biển Đông. Hệ quả tổng hợp quan trọng nhất của vị trí này đối với khí hậu là gì?", "options": ["A. Lãnh thổ hẹp ngang nên gió biển thổi sâu vào nội địa, khí hậu điều hoà khắp cả nước.", "B. Cả nước nằm hoàn toàn trong đới khí hậu xích đạo nên nóng ẩm quanh năm.", "C. Miền Bắc chịu tác động mạnh của gió mùa Đông Bắc vào mùa đông gây mùa đông lạnh, miền Nam quanh năm nóng dưới tác động của Tín phong và gió mùa Tây Nam; các dãy núi (Hoàng Liên Sơn, Trường Sơn) và đèo Hải Vân càng làm sâu sắc sự phân hoá Bắc - Nam.", "D. Do tiếp giáp Biển Đông nên khí hậu chỉ chịu ảnh hưởng của gió biển, ít phân hoá."], "answer": "C", "explain": "Vị trí kéo dài trên 15 vĩ độ là nhân tố gốc rễ: miền Bắc (trên khoảng vĩ tuyến 16 độ B) nằm gần chí tuyến, vào mùa đông chịu ảnh hưởng trực tiếp của khối khí cực đới tràn xuống theo gió mùa Đông Bắc nên có mùa đông lạnh (Hà Nội tháng 1 chỉ 16,4 độ C); miền Nam quanh năm chịu ảnh hưởng của dải hội tụ nhiệt đới, Tín phong bán cầu Bắc và gió mùa Tây Nam nên nóng quanh năm. Địa hình (dãy Hoàng Liên Sơn cao đồ sộ chắn gió ở phía Bắc, dãy Trường Sơn, đèo Hải Vân) đóng vai trò thứ cấp làm tăng cường phân hoá. Phương án A sai vì lãnh thổ hẹp ngang không xoá được phân hoá vĩ độ; B sai vì miền Bắc có mùa đông lạnh; D sai vì bỏ qua hoàn lưu gió mùa lục địa."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ở Việt Nam, đai ôn đới gió mùa trên núi (với các loài thực vật ôn đới như đỗ quyên, lãnh sam, thiết sam) chỉ xuất hiện ở dãy Hoàng Liên Sơn từ độ cao khoảng 2.600 m trở lên. Vì sao các khối núi cao khác ở phía Nam (ví dụ Ngọc Linh cao 2.598 m) lại không có đai này?", "options": ["A. Vì Hoàng Liên Sơn là dãy núi cao nhất, lại nằm ở vĩ độ cao nhất nước ta nên nền nhiệt độ thấp, đủ lạnh để hình thành đai khí hậu ôn đới trên núi.", "B. Vì Hoàng Liên Sơn gần biển hơn nên ẩm ướt quanh năm.", "C. Vì các khối núi phía Nam đều thấp hơn 2.000 m.", "D. Vì Hoàng Liên Sơn nằm trong miền khí hậu phía Nam nên mát mẻ."], "answer": "A", "explain": "Sự phân hoá đai cao phụ thuộc đồng thời vào độ cao tuyệt đối và vĩ độ (nền nhiệt độ ban đầu). Hoàng Liên Sơn vừa rất cao (Fansipan 3.143 m, cao nhất Đông Dương) vừa nằm ở vĩ độ cao nhất nước ta (khoảng 22 đến 23 độ B, lại chịu ảnh hưởng của mùa đông lạnh), nên từ khoảng 2.600 m trở lên nhiệt độ đủ thấp để hình thành đai ôn đới gió mùa trên núi. Ngọc Linh tuy cao 2.598 m nhưng nằm ở vĩ độ thấp hơn nhiều (khoảng 15 độ B, tỉnh Kon Tum), nền nhiệt cao hơn nên chưa đủ lạnh để xuất hiện đai ôn đới. Phương án C sai vì Ngọc Linh cao 2.598 m; D sai vì Hoàng Liên Sơn thuộc miền khí hậu phía Bắc."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Thềm lục địa nước ta có đặc điểm: từ Đà Nẵng trở vào phía Nam rộng và nông; ở Bắc Bộ và Trung Bộ hẹp và sâu. Kết hợp với Atlat Địa lí Việt Nam, đặc điểm này giải thích vì sao tiềm năng dầu khí lớn lại tập trung ở thềm lục địa phía Nam?", "options": ["A. Vì dầu khí chỉ hình thành ở vùng biển phía Bắc.", "B. Vì thềm lục địa phía Nam rộng, nông, có các bể trầm tích dày (bể Cửu Long, bể Nam Côn Sơn, bể Malay - Thổ Chu) là nơi tích tụ dầu khí, với các mỏ lớn như Bạch Hổ, Đại Hùng, Lan Tây; đồng thời đây cũng là ngư trường đánh bắt lớn (Ninh Thuận - Bình Thuận - Cà Mau).", "C. Vì nghề làm muối phát triển mạnh ở phía Nam tạo điều kiện thăm dò dầu khí.", "D. Vì các cảng nước sâu tập trung ở phía Bắc nên phải khai thác dầu khí ở phía Nam để cân đối."], "answer": "B", "explain": "Dầu khí tích tụ trong các bể trầm tích Kainozoi dày trên thềm lục địa. Thềm lục địa phía Nam rộng hàng trăm km, nông, có các bể trầm tích rất dày (Cửu Long, Nam Côn Sơn, Malay - Thổ Chu) nên tập trung các mỏ dầu khí lớn: Bạch Hổ, Rồng, Đại Hùng (dầu); Lan Tây, Lan Đỏ, Hải Thạch - Mộc Tinh (khí). Vùng biển này cũng trùng với ngư trường trọng điểm Ninh Thuận - Bình Thuận - Bà Rịa Vũng Tàu - Cà Mau. Phương án A sai vì dầu khí chủ yếu ở phía Nam; C nhầm lẫn (làm muối liên quan đến khí hậu khô nóng của Duyên hải Nam Trung Bộ, không liên quan đến thềm lục địa); D phi logic."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các nhận định sau về sử dụng hợp lí tài nguyên thiên nhiên và bảo vệ môi trường ở nước ta:", "statements": ["a) Ở vùng đồi núi, biện pháp quan trọng hàng đầu để bảo vệ đất là trồng và bảo vệ rừng, vì rừng vừa chống xói mòn, rửa trôi vừa điều hoà nguồn nước.", "b) Khai thác khoáng sản ở Trung du và miền núi Bắc Bộ không gây ô nhiễm môi trường vì khoáng sản nằm sâu trong lòng đất.", "c) Phát triển thuỷ điện ở Tây Nguyên vừa cung cấp năng lượng vừa góp phần điều tiết lũ cho vùng hạ lưu, nhưng phải gắn với bảo vệ rừng đầu nguồn.", "d) Ở Đồng bằng sông Cửu Long, đắp đê bao triệt để ngăn lũ là giải pháp tốt nhất để bảo vệ sản xuất nông nghiệp."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: rừng là biện pháp sinh học bền vững nhất chống xói mòn ở đồi núi (tán rừng giảm động năng hạt mưa, rễ giữ đất, thảm mục tăng thấm). b) Sai: khai thác khoáng sản (than Quảng Ninh, apatit Lào Cai...) gây ô nhiễm nặng: bụi, nước thải axit mỏ, sạt lở bãi thải, suy thoái đất. c) Đúng: các hồ chứa (Yaly, Sê San...) cắt lũ, phát điện, nhưng tích nước phải đi kèm giữ rừng đầu nguồn nếu không hồ nhanh bồi lấp. d) Sai: đê bao triệt để ngăn phù sa bồi đắp đồng ruộng, gây sụt lún, ô nhiễm nguồn nước, mất nguồn lợi thuỷ sản mùa lũ; hướng đúng là sống chung với lũ, chuyển đổi cơ cấu sản xuất thích ứng."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các nhận định sau về thiên tai và biến đổi khí hậu ở nước ta:", "statements": ["a) Bão ở nước ta tập trung nhiều nhất vào các tháng 8, 9, 10 và ảnh hưởng nặng nề nhất đến dải ven biển miền Trung.", "b) Lũ quét thường xảy ra ở vùng đồng bằng vì địa hình bằng phẳng khiến nước thoát chậm.", "c) Hạn hán gay gắt nhất thường xảy ra ở Tây Nguyên và Duyên hải Nam Trung Bộ vào mùa khô do lượng mưa thấp, nắng nhiều, bốc hơi mạnh.", "d) Xâm nhập mặn ở Đồng bằng sông Cửu Long chỉ xảy ra vào mùa lũ khi nước biển dâng cao."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: mùa bão từ tháng 6 đến tháng 11, cao điểm tháng 8 đến tháng 10; miền Trung chịu nhiều bão nhất do vị trí đón bão từ Biển Đông. b) Sai: lũ quét xảy ra ở miền núi (địa hình dốc, mưa lớn tập trung trong thời gian ngắn, mất rừng đầu nguồn), không phải đồng bằng. c) Đúng: Tây Nguyên và Duyên hải Nam Trung Bộ có mùa khô kéo dài 5 đến 6 tháng, lượng mưa mùa khô rất thấp trong khi bốc hơi lớn nên hạn hán gay gắt, ảnh hưởng cà phê, hồ tiêu. d) Sai: xâm nhập mặn xảy ra vào mùa khô (tháng 1 đến tháng 5) khi lưu lượng sông Mê Công xuống thấp, nước biển lấn sâu vào nội đồng; mùa lũ nước ngọt dồi dào đẩy mặn ra."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cho bảng số liệu: nhiệt độ trung bình tháng 1 của Hà Nội là 16,4 độ C, tháng 7 là 29,2 độ C. Tính biên độ nhiệt độ năm của Hà Nội (đơn vị: độ C).", "answer": "12,8", "explain": "Biên độ nhiệt độ năm bằng nhiệt độ tháng cao nhất trừ nhiệt độ tháng thấp nhất: 29,2 trừ 16,4 bằng 12,8 độ C. Biên độ lớn (trên 10 độ C) là đặc trưng của miền khí hậu phía Bắc có mùa đông lạnh do ảnh hưởng của gió mùa Đông Bắc; ở miền Nam biên độ chỉ khoảng 2 đến 3 độ C."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Từ bảng lưu lượng sông Hồng ở câu trắc nghiệm số 3 (tổng lưu lượng cả năm là 43.591 m3/s; tổng lưu lượng các tháng mùa lũ từ tháng 6 đến tháng 10 là 32.736 m3/s), tính tỉ trọng dòng chảy mùa lũ so với cả năm (đơn vị: %, làm tròn đến 1 chữ số thập phân).", "answer": "75,1", "explain": "Tỉ trọng dòng chảy mùa lũ bằng tổng lưu lượng 5 tháng mùa lũ chia cho tổng lưu lượng cả năm rồi nhân 100: 32.736 chia 43.591 nhân 100 bằng 75,1%. Con số này cho thấy chế độ nước sông Hồng phân mùa cực kì sâu sắc: 3/4 lượng nước cả năm dồn vào 5 tháng mùa lũ, gây lũ lụt lớn, trong khi 7 tháng còn lại chỉ chiếm khoảng 1/4, gây thiếu nước mùa kiệt. Đây là cơ sở để xây dựng các hồ chứa điều tiết (Hoà Bình, Sơn La, Tuyên Quang)."}]}]}
