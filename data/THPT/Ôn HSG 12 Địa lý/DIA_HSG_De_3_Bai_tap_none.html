<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 3", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu cơ cấu GDP theo giá hiện hành của nước ta (đơn vị: %, nguồn: Tổng cục Thống kê, số liệu khoảng): Năm 2015: nông, lâm nghiệp và thuỷ sản 15,4; công nghiệp và xây dựng 32,7; dịch vụ 41,3; thuế sản phẩm trừ trợ cấp 10,6. Năm 2023: 12,0; 37,1; 42,5; 8,4. Để thể hiện sự chuyển dịch cơ cấu GDP giai đoạn 2015 đến 2023, biểu đồ thích hợp nhất là biểu đồ nào và nhận xét nào sau đây đúng nhất?", "options": ["A. Biểu đồ cột; tỉ trọng nông nghiệp tăng do xuất khẩu nông sản tăng mạnh.", "B. Biểu đồ miền; cơ cấu kinh tế chuyển dịch theo hướng công nghiệp hoá, hiện đại hoá: tỉ trọng nông, lâm nghiệp và thuỷ sản giảm, tỉ trọng công nghiệp và xây dựng tăng, dịch vụ chiếm tỉ trọng cao nhất và khá ổn định.", "C. Biểu đồ đường; công nghiệp và xây dựng đã vượt dịch vụ về tỉ trọng.", "D. Biểu đồ tròn; thuế sản phẩm chiếm tỉ trọng ngày càng tăng."], "answer": "B", "explain": "Để thể hiện sự chuyển dịch cơ cấu (tỉ trọng %) qua nhiều năm, biểu đồ miền là thích hợp nhất vì thấy rõ cả quy mô tổng thể và sự thay đổi tỉ trọng từng thành phần. Nhận xét: giai đoạn 2015 đến 2023, tỉ trọng nông, lâm nghiệp và thuỷ sản giảm từ 15,4% xuống 12,0%; công nghiệp và xây dựng tăng từ 32,7% lên 37,1%; dịch vụ giữ tỉ trọng cao nhất (41,3% lên 42,5%). Đây là chuyển dịch đúng hướng công nghiệp hoá, hiện đại hoá. Phương án A sai (tỉ trọng nông nghiệp giảm); C sai (dịch vụ 42,5% vẫn cao hơn công nghiệp 37,1%); D sai (thuế giảm từ 10,6% xuống 8,4%)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Tây Nguyên và Đông Nam Bộ là hai vùng trồng cây công nghiệp lâu năm lớn nhất cả nước (cà phê, cao su, hồ tiêu, điều). Sự phân bố tập trung này được giải thích đầy đủ nhất bằng tổ hợp nhân tố nào?", "options": ["A. Đất badan màu mỡ, khí hậu cận xích đạo nóng quanh năm phân mùa mưa, khô rõ rệt, địa hình cao nguyên tương đối bằng phẳng thuận lợi thành lập các nông trường quy mô lớn, cùng truyền thống trồng cây công nghiệp từ thời Pháp thuộc.", "B. Hai vùng có lượng mưa lớn nhất cả nước nên cây công nghiệp phát triển tốt.", "C. Hai vùng gần các cảng biển lớn nên thuận lợi xuất khẩu.", "D. Hai vùng có mật độ dân số cao, nguồn lao động dồi dào."], "answer": "A", "explain": "Đây là kết quả tác động tổng hợp của nhiều nhân tố: đất badan (đá bazan phong hoá) màu mỡ, tầng dày, tập trung trên các cao nguyên xếp tầng ở Tây Nguyên và Đông Nam Bộ; khí hậu cận xích đạo với mùa khô rõ rệt rất hợp với cà phê, cao su, hồ tiêu, điều (cây ưa nóng, cần mùa khô để phân hoá mầm hoa); địa hình cao nguyên bằng phẳng thuận lợi cơ giới hoá, trồng tập trung quy mô lớn; lịch sử đồn điền cao su, cà phê từ thời Pháp để lại kinh nghiệm và cơ sở hạ tầng. Phương án B sai (mưa lớn nhất là Bắc Trung Bộ); C là nhân tố thứ yếu; D sai (Tây Nguyên mật độ thấp nhất cả nước)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu diện tích và sản lượng lúa năm 2023 (khoảng, nguồn: Tổng cục Thống kê): Đồng bằng sông Hồng: diện tích 1,02 triệu ha, sản lượng 6,5 triệu tấn. Đồng bằng sông Cửu Long: diện tích 3,90 triệu ha, sản lượng 23,8 triệu tấn. Cả nước sản lượng đạt 43,5 triệu tấn. Nhận định nào sau đây đúng nhất?", "options": ["A. Đồng bằng sông Hồng có sản lượng lúa lớn hơn Đồng bằng sông Cửu Long.", "B. Đồng bằng sông Cửu Long chiếm 54,7% sản lượng lúa cả nước nhờ quy mô diện tích gieo trồng lớn; Đồng bằng sông Hồng đạt năng suất cao hơn (63,7 tạ/ha so với 61,0 tạ/ha) nhờ thâm canh cao và áp dụng tiến bộ kĩ thuật.", "C. Năng suất lúa hai vùng tương đương nhau nên điều kiện sản xuất không có gì khác biệt.", "D. Đồng bằng sông Hồng có diện tích trồng lúa lớn hơn Đồng bằng sông Cửu Long."], "answer": "B", "explain": "Tính toán: tỉ trọng sản lượng của ĐBSCL là 23,8 chia 43,5 nhân 100 bằng 54,7%, khẳng định vai trò vựa lúa số một nhờ diện tích lớn gấp gần 4 lần ĐBSH. Năng suất: ĐBSH là 6,5 chia 1,02 bằng 63,7 tạ/ha; ĐBSCL là 23,8 chia 3,90 bằng 61,0 tạ/ha. ĐBSH năng suất cao hơn vì đất chật người đông buộc phải thâm canh tăng vụ, áp dụng giống mới, thuỷ lợi và cơ giới hoá đồng bộ; ĐBSCL sản xuất quy mô lớn nhưng còn quảng canh ở nhiều nơi, lại chịu xâm nhập mặn, phèn. Phương án A, D sai về số liệu; C sai vì năng suất chênh lệch và điều kiện khác nhau căn bản."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Công nghiệp chế biến lương thực, thực phẩm và công nghiệp sản xuất hàng tiêu dùng tập trung chủ yếu ở Đông Nam Bộ và Đồng bằng sông Hồng. Nguyên nhân mang tính tổng hợp, quyết định nhất là gì?", "options": ["A. Hai vùng có nguồn nguyên liệu nông sản dồi dào nhất cả nước.", "B. Hai vùng hội tụ đồng bộ các nhân tố kinh tế, xã hội thuận lợi: nguồn lao động dồi dào và có trình độ, thị trường tiêu thụ rộng lớn, cơ sở hạ tầng và cảng biển phát triển, thu hút vốn đầu tư trong và ngoài nước mạnh mẽ.", "C. Hai vùng có trữ lượng khoáng sản lớn nhất cả nước.", "D. Hai vùng được hưởng chính sách ưu đãi thuế cao nhất."], "answer": "B", "explain": "Công nghiệp chế biến và hàng tiêu dùng là ngành cần đồng thời nhiều nhân tố: lao động (đông, rẻ tương đối, có tay nghề), thị trường (hai vùng có gần 42 triệu dân với sức mua cao nhất), hạ tầng (cảng Cát Lái, Cái Mép, Hải Phòng; đường cao tốc), vốn FDI. Sự hội tụ này chỉ có ở ĐNB và ĐBSH, tạo hiệu ứng cụm ngành. Phương án A chỉ đúng một phần (nguyên liệu quan trọng nhưng nhiều ngành như dệt may, da giày, điện tử dùng nguyên liệu nhập khẩu); C sai (khoáng sản mạnh nhất ở TDMN Bắc Bộ); D không phải nhân tố quyết định."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu sản lượng điện theo nguồn của nước ta năm 2023 (đơn vị: tỉ kWh, khoảng, nguồn: Tập đoàn Điện lực Việt Nam): thuỷ điện 88; nhiệt điện than 118; tua-bin khí 27; năng lượng tái tạo (gió, mặt trời, sinh khối) 38; nhập khẩu 4. Vì sao Duyên hải Nam Trung Bộ được xác định là vùng trọng điểm phát triển điện gió và điện mặt trời của cả nước?", "options": ["A. Vì vùng có nhiều sông lớn, thuận lợi xây dựng các nhà máy thuỷ điện.", "B. Vì vùng có số giờ nắng cao, nắng gay gắt, gió mạnh quanh năm (đặc biệt Ninh Thuận, Bình Thuận), bờ biển dài, lại nằm gần trung tâm phụ tải điện lớn phía Nam, trong khi các nguồn truyền thống (than, khí, thuỷ điện lớn) lại hạn chế.", "C. Vì vùng có trữ lượng than đá lớn nhất cả nước.", "D. Vì vùng có mật độ dân số thấp nên dễ giải phóng mặt bằng."], "answer": "B", "explain": "Ninh Thuận, Bình Thuận là vùng khô nóng nhất cả nước (lượng mưa 700 đến 800 mm/năm, số giờ nắng 2.600 đến 2.800 giờ/năm, gió mạnh cấp 6 đến 7), điều kiện lí tưởng cho điện mặt trời và điện gió; bờ biển dài thuận lợi điện gió ngoài khơi. Vùng lại kề Đông Nam Bộ là phụ tải điện lớn nhất nước, giảm tổn thất truyền tải. Trong khi đó vùng hầu như không có than, không có sông lớn làm thuỷ điện, khí đốt chưa phát triển. Đây là ví dụ điển hình của phát triển kinh tế dựa trên lợi thế so sánh về điều kiện tự nhiên. Phương án A, C sai về điều kiện tự nhiên; D là nhân tố thứ yếu."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu lượng khách quốc tế đến Việt Nam (đơn vị: triệu lượt, nguồn: Tổng cục Thống kê): năm 2019: 18,0; năm 2021: 0,16; năm 2022: 3,7; năm 2023: 12,6; năm 2024: 17,6. Nhận định nào sau đây đúng nhất?", "options": ["A. Năm 2024 lượng khách đã vượt mức kỉ lục trước đại dịch.", "B. Du lịch quốc tế phục hồi mạnh mẽ sau đại dịch: từ đáy 0,16 triệu lượt (2021) lên 17,6 triệu lượt (2024), tiệm cận mức kỉ lục 18,0 triệu lượt năm 2019, nhờ mở cửa du lịch (tháng 3/2022), chính sách thị thực thông thoáng và đẩy mạnh xúc tiến quảng bá.", "C. Lượng khách quốc tế tăng đều đặn qua tất cả các năm.", "D. Năm 2023 lượng khách đã vượt năm 2019."], "answer": "B", "explain": "Đại dịch Covid-19 khiến du lịch quốc tế đóng băng (2021 chỉ 0,16 triệu lượt). Từ khi mở cửa hoàn toàn tháng 3/2022, lượng khách tăng vọt: 3,7 (2022) lên 12,6 (2023) rồi 17,6 triệu lượt (2024), bằng 97,8% mức kỉ lục 2019. Động lực: chính sách visa điện tử, miễn thị thực mở rộng, khôi phục đường bay quốc tế, chiến dịch quảng bá. Phương án A, D sai vì 17,6 và 12,6 đều nhỏ hơn 18,0; C sai vì 2019 đến 2021 giảm sâu."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các nhận định sau về tổ chức lãnh thổ nông nghiệp ở nước ta:", "statements": ["a) Cả nước có 7 vùng nông nghiệp, trong đó Đồng bằng sông Cửu Long là vùng trọng điểm sản xuất lương thực lớn nhất.", "b) Tây Nguyên là vùng chuyên canh cây công nghiệp lâu năm lớn nhất cả nước với cà phê, cao su, hồ tiêu.", "c) Trung du và miền núi Bắc Bộ là vùng trồng cây lương thực lớn nhất cả nước.", "d) Đông Nam Bộ là vùng chăn nuôi bò sữa, bò thịt phát triển nhờ gần thị trường tiêu thụ lớn là TP. Hồ Chí Minh."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: 7 vùng nông nghiệp (TDMN Bắc Bộ, ĐBSH, Bắc Trung Bộ, DHNTB, Tây Nguyên, ĐNB, ĐBSCL); ĐBSCL chiếm trên 50% sản lượng lúa và trên 60% sản lượng thuỷ sản cả nước. b) Đúng: Tây Nguyên chiếm khoảng 90% diện tích cà phê, là vùng cao su, hồ tiêu lớn nhất nước. c) Sai: vùng trồng cây lương thực lớn nhất là ĐBSCL; TDMN Bắc Bộ mạnh về cây công nghiệp (chè), cây ăn quả ôn đới, chăn nuôi gia súc lớn. d) Đúng: chăn nuôi theo hướng hàng hoá, tập trung gần thị trường lớn để giảm chi phí vận chuyển, bảo quản (sữa, thịt)."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các nhận định sau về công nghiệp và dịch vụ ở nước ta:", "statements": ["a) Công nghiệp năng lượng là ngành công nghiệp trọng điểm, đi trước một bước, dựa trên than ở Quảng Ninh, dầu khí ở thềm lục địa phía Nam và thuỷ điện trên các sông lớn ở miền núi.", "b) Các khu công nghiệp, khu chế xuất tập trung chủ yếu ở vùng núi vì đất đai rộng và giá thuê rẻ.", "c) Giao thông vận tải đường bộ giữ vai trò chủ đạo trong vận chuyển hành khách và hàng hoá ở nước ta.", "d) Cán cân thương mại của nước ta những năm gần đây luôn trong tình trạng nhập siêu do phải nhập khẩu máy móc, nguyên liệu."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: năng lượng là cơ sở hạ tầng của công nghiệp hoá; than Quảng Ninh (khoảng 49 triệu tấn than sạch năm 2023), dầu thô khoảng 9 triệu tấn, thuỷ điện khoảng 88 tỉ kWh. b) Sai: khu công nghiệp tập trung ở Đông Nam Bộ, Đồng bằng sông Hồng và ven biển miền Trung nơi có lao động, thị trường, cảng biển, hạ tầng; vùng núi giao thông khó khăn, thiếu lao động kĩ thuật. c) Đúng: đường bộ đảm nhận trên 90% vận chuyển hành khách và khoảng 75% hàng hoá nhờ tính cơ động, mạng lưới phủ khắp. d) Sai: từ năm 2016 đến nay Việt Nam liên tục xuất siêu (năm 2023 xuất siêu 28 tỉ USD) nhờ Samsung, điện tử, dệt may, nông thuỷ sản."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Giá trị sản xuất công nghiệp của nước ta (giá so sánh 2010, khoảng): năm 2020 đạt 3.200 nghìn tỉ đồng, năm 2023 đạt 3.650 nghìn tỉ đồng. Tính tốc độ tăng trưởng giá trị sản xuất công nghiệp giai đoạn 2020 đến 2023 (đơn vị: %, làm tròn đến 1 chữ số thập phân).", "answer": "14,1", "explain": "Tốc độ tăng trưởng bằng (giá trị năm 2023 trừ giá trị năm 2020) chia cho giá trị năm 2020 rồi nhân 100: (3.650 trừ 3.200) chia 3.200 nhân 100 bằng 14,1%. Mức tăng này phản ánh sự phục hồi mạnh mẽ của công nghiệp sau đại dịch, dẫn dắt bởi công nghiệp chế biến, chế tạo (điện tử, dệt may, da giày) và sự chuyển dịch chuỗi cung ứng toàn cầu về Việt Nam."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Năm 2023, kim ngạch xuất khẩu của nước ta đạt 355,5 tỉ USD, kim ngạch nhập khẩu đạt 327,5 tỉ USD (nguồn: Tổng cục Thống kê). Tính cán cân thương mại của nước ta năm 2023 (đơn vị: tỉ USD).", "answer": "28", "explain": "Cán cân thương mại bằng xuất khẩu trừ nhập khẩu: 355,5 trừ 327,5 bằng 28 tỉ USD. Vì xuất khẩu lớn hơn nhập khẩu nên gọi là xuất siêu 28 tỉ USD. Đây là năm thứ 8 liên tiếp Việt Nam xuất siêu, cho thấy năng lực cạnh tranh của hàng hoá Việt Nam (điện tử, điện thoại, dệt may, nông thuỷ sản) trên thị trường thế giới ngày càng được nâng cao."}]}]}
