<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 4", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trong bối cảnh kinh tế suy giảm, tổng cầu yếu, Chính phủ quyết định tăng chi tiêu công cho đầu tư hạ tầng đồng thời giảm thuế thu nhập doanh nghiệp. Tác động kỳ vọng của gói chính sách này là gì?", "options": ["A. Tổng cầu tiếp tục giảm vì ngân sách nhà nước bị thâm hụt.", "B. Tổng cầu tăng lên thông qua hiệu ứng số nhân của chi tiêu công và kích thích đầu tư tư nhân, góp phần phục hồi tăng trưởng kinh tế.", "C. Lạm phát chắc chắn vượt khỏi tầm kiểm soát ngay lập tức.", "D. Tỉ lệ thất nghiệp tăng vì doanh nghiệp được giảm thuế."], "answer": "B", "explain": "Đây là chính sách tài khóa mở rộng điển hình: tăng chi tiêu chính phủ (G) trực tiếp làm tăng tổng cầu, đồng thời tạo hiệu ứng số nhân lan tỏa sang tiêu dùng và đầu tư; giảm thuế thu nhập doanh nghiệp làm tăng lợi nhuận sau thuế, khuyến khích doanh nghiệp mở rộng đầu tư (I tăng). Tổng cầu AD = C + I + G + (X - M) tăng lên sẽ kích thích sản xuất, tạo việc làm, giảm thất nghiệp và phục hồi tăng trưởng. Thâm hụt ngân sách là chi phí đánh đổi có thể chấp nhận trong ngắn hạn, không đồng nghĩa tổng cầu giảm."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phát hiện chủ tịch xã chỉ đạo cấp dưới lập hồ sơ khống để chiếm đoạt tiền hỗ trợ thiên tai, anh Q làm đơn gửi cơ quan có thẩm quyền đề nghị xử lý. Cùng thời điểm, anh Q bị UBND xã ra quyết định xử phạt vi phạm hành chính mà anh cho là trái pháp luật. Anh Q cần thực hiện các quyền nào?", "options": ["A. Cả hai việc đều thực hiện bằng quyền khiếu nại.", "B. Việc phát hiện hành vi chiếm đoạt tiền hỗ trợ: thực hiện quyền tố cáo; việc không đồng ý với quyết định xử phạt: thực hiện quyền khiếu nại.", "C. Cả hai việc đều thực hiện bằng quyền tố cáo.", "D. Anh Q chỉ được lựa chọn thực hiện một trong hai quyền."], "answer": "B", "explain": "Hai tình huống thuộc hai quyền khác nhau. Quyền tố cáo (Luật Tố cáo 2018): cá nhân báo cho cơ quan có thẩm quyền biết về hành vi vi phạm pháp luật gây thiệt hại hoặc đe dọa gây thiệt hại đến lợi ích của Nhà nước, quyền và lợi ích hợp pháp của tổ chức, cá nhân — áp dụng cho việc phát hiện hành vi lập hồ sơ khống chiếm đoạt tiền hỗ trợ. Quyền khiếu nại (Luật Khiếu nại 2011): công dân đề nghị cơ quan có thẩm quyền xem xét lại quyết định hành chính, hành vi hành chính khi có căn cứ cho rằng trái pháp luật, xâm phạm quyền, lợi ích hợp pháp của mình — áp dụng cho việc không đồng ý quyết định xử phạt. Hai quyền này độc lập, có thể thực hiện song song."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một cơ sở sản xuất gạch thuê em L (13 tuổi) làm công việc khuân vác vật liệu nặng 10 giờ mỗi ngày với lý do gia đình em khó khăn và em tự nguyện làm việc. Pháp luật đánh giá hành vi của chủ cơ sở như thế nào?", "options": ["A. Được phép vì em L tự nguyện và gia đình đã đồng ý.", "B. Vi phạm nghiêm trọng pháp luật: bóc lột sức lao động trẻ em bị nghiêm cấm; việc sử dụng lao động chưa đủ 15 tuổi bị hạn chế nghiêm ngặt, không được giao công việc nặng nhọc, nguy hiểm và làm việc quá giờ.", "C. Chỉ vi phạm pháp luật nếu em L bị tai nạn lao động.", "D. Được phép nếu chủ cơ sở trả lương cao hơn mức trả cho người lao động thành niên."], "answer": "B", "explain": "Luật Trẻ em 2016 nghiêm cấm hành vi bóc lột sức lao động trẻ em. Bộ luật Lao động 2019 quy định nguyên tắc sử dụng lao động chưa thành niên: người sử dụng lao động chỉ được sử dụng người chưa đủ 15 tuổi làm một số công việc nhẹ theo danh mục quy định, phải bảo đảm điều kiện lao động, không được sử dụng làm công việc nặng nhọc, độc hại, nguy hiểm, không được bố trí làm thêm giờ. Việc bắt trẻ 13 tuổi khuân vác nặng 10 giờ/ngày vi phạm nghiêm trọng cả hai đạo luật; sự tự nguyện của trẻ em và gia đình không thể hợp thức hóa hành vi vi phạm."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nam (19 tuổi) và nữ (17 tuổi) tổ chức lễ cưới, về chung sống như vợ chồng nhưng không đăng ký kết hôn tại cơ quan nhà nước có thẩm quyền. Theo Luật Hôn nhân và gia đình 2014, quan hệ của hai người được đánh giá như thế nào?", "options": ["A. Đây là hôn nhân hợp pháp vì hai bên hoàn toàn tự nguyện và gia đình hai bên đồng ý.", "B. Chưa đủ điều kiện kết hôn và chưa đăng ký kết hôn nên không được công nhận là vợ chồng; đây là trường hợp chung sống như vợ chồng trái pháp luật, không làm phát sinh quyền, nghĩa vụ giữa vợ và chồng.", "C. Được pháp luật công nhận là vợ chồng vì đã tổ chức lễ cưới công khai.", "D. Chỉ cần nam đủ tuổi kết hôn là quan hệ được công nhận."], "answer": "B", "explain": "Điều 8 Luật Hôn nhân và gia đình 2014 quy định điều kiện kết hôn: nam từ đủ 20 tuổi trở lên, nữ từ đủ 18 tuổi trở lên; việc kết hôn phải được đăng ký tại cơ quan nhà nước có thẩm quyền. Trường hợp này nữ mới 17 tuổi nên chưa đủ điều kiện kết hôn, đồng thời hai người không đăng ký kết hôn nên không được công nhận là vợ chồng. Đây là chung sống như vợ chồng trái pháp luật, không làm phát sinh quyền, nghĩa vụ vợ chồng; quyền lợi về con chung và tài sản (nếu có) được giải quyết theo quy định của pháp luật."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ông D là chủ sở hữu công ty trách nhiệm hữu hạn một thành viên V với vốn điều lệ 2 tỉ đồng và đã góp đủ. Do kinh doanh thua lỗ, công ty còn nợ các chủ nợ tổng cộng 5 tỉ đồng. Theo Luật Doanh nghiệp 2020, trách nhiệm của ông D như thế nào?", "options": ["A. Ông D phải dùng toàn bộ tài sản cá nhân để trả hết 5 tỉ đồng nợ của công ty.", "B. Ông D chỉ chịu trách nhiệm về các khoản nợ và nghĩa vụ tài sản khác của công ty trong phạm vi số vốn điều lệ đã góp.", "C. Nhà nước sẽ xóa nợ cho công ty vì đây là doanh nghiệp nhỏ.", "D. Các chủ nợ mất trắng và không có quyền khởi kiện."], "answer": "B", "explain": "Điều 74 Luật Doanh nghiệp 2020 quy định chủ sở hữu công ty trách nhiệm hữu hạn một thành viên chịu trách nhiệm về các khoản nợ và nghĩa vụ tài sản khác của công ty trong phạm vi số vốn điều lệ của công ty. Đây chính là đặc trưng của chế độ trách nhiệm hữu hạn: tách bạch tài sản công ty và tài sản cá nhân của chủ sở hữu, khác với doanh nghiệp tư nhân mà chủ doanh nghiệp chịu trách nhiệm vô hạn bằng toàn bộ tài sản. Các chủ nợ vẫn có quyền khởi kiện để thu hồi nợ trong phạm vi tài sản của công ty."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Gia đình anh T có thu nhập 30 triệu đồng/tháng, chi tiêu 28 triệu đồng/tháng, chưa có quỹ dự phòng cho tình huống khẩn cấp, toàn bộ khoản tiết kiệm ít ỏi gửi tiết kiệm không kỳ hạn. Đánh giá nào sau đây đúng nhất theo nguyên tắc quản lý thu, chi trong gia đình?", "options": ["A. Tình hình tài chính của gia đình tốt vì chi tiêu ít hơn thu nhập.", "B. Tiềm ẩn rủi ro cao: tỉ lệ tiết kiệm quá thấp, thiếu quỹ dự phòng cho tình huống khẩn cấp; cần lập ngân sách chi tiêu, cắt giảm khoản chi chưa cần thiết, xây dựng quỹ khẩn cấp tương đương 3 đến 6 tháng chi tiêu và phân bổ tiết kiệm, đầu tư hợp lý.", "C. Gia đình nên vay thêm tiền để đầu tư sinh lời.", "D. Không cần quỹ dự phòng vì thu nhập của gia đình ổn định."], "answer": "B", "explain": "Quản lý thu, chi trong gia đình đòi hỏi: lập ngân sách theo dõi thu nhập và các khoản chi; duy trì tỉ lệ tiết kiệm hợp lý (tham khảo quy tắc 50/30/20); xây dựng quỹ dự phòng khẩn cấp tương đương 3 đến 6 tháng chi tiêu để ứng phó với rủi ro như mất việc, ốm đau; phân bổ tiết kiệm và đầu tư phù hợp mục tiêu. Gia đình anh T tiết kiệm chỉ khoảng 6,7% thu nhập, không có quỹ dự phòng nên rất dễ tổn thương trước biến cố; thu nhập ổn định hiện tại không bảo đảm cho tương lai."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Trong giờ thảo luận về quyền tự do kinh doanh, các bạn học sinh đưa ra các nhận định sau. Đánh giá tính đúng, sai của từng nhận định:", "statements": ["a) Mọi người có quyền tự do kinh doanh trong những ngành nghề mà pháp luật không cấm.", "b) Kinh doanh một số ngành nghề có điều kiện như dịch vụ karaoke, dịch vụ bảo vệ phải đáp ứng đủ điều kiện và được cơ quan nhà nước có thẩm quyền cấp phép.", "c) Cá nhân kinh doanh ma túy, mại dâm là đang thực hiện quyền tự do kinh doanh của mình.", "d) Quyền sở hữu tư nhân và quyền thừa kế hợp pháp của công dân được pháp luật bảo hộ trong hoạt động kinh doanh."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. Điều 33 Hiến pháp 2013 ghi nhận quyền tự do kinh doanh trong những ngành nghề mà pháp luật không cấm. b) Đúng. Pháp luật quy định danh mục ngành nghề kinh doanh có điều kiện; tổ chức, cá nhân muốn kinh doanh phải đáp ứng điều kiện về vốn, nhân sự, cơ sở vật chất, an ninh trật tự và được cấp giấy phép. c) Sai. Ma túy, mại dâm là những ngành nghề pháp luật nghiêm cấm; kinh doanh các lĩnh vực này là vi phạm pháp luật, thậm chí cấu thành tội phạm hình sự. d) Đúng. Điều 32 Hiến pháp 2013 quy định quyền sở hữu tư nhân và quyền thừa kế được pháp luật bảo hộ, tạo nền tảng pháp lý cho hoạt động kinh doanh."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Trong buổi tuyên truyền pháp luật về nghĩa vụ quân sự, báo cáo viên nêu các nội dung sau. Đánh giá tính đúng, sai của từng nội dung:", "statements": ["a) Công dân đủ 18 tuổi được gọi nhập ngũ; độ tuổi gọi nhập ngũ từ đủ 18 tuổi đến hết 25 tuổi.", "b) Sinh viên đang được đào tạo trình độ đại học hệ chính quy được tạm hoãn gọi nhập ngũ trong thời gian một khóa đào tạo.", "c) Hằng năm, việc gọi công dân nhập ngũ được thực hiện một lần vào tháng hai hoặc tháng ba.", "d) Công dân trốn tránh nghĩa vụ quân sự chỉ bị nhắc nhở, không bị xử phạt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. Điều 30 Luật Nghĩa vụ quân sự 2015 quy định độ tuổi gọi nhập ngũ từ đủ 18 tuổi đến hết 25 tuổi; riêng công dân được đào tạo trình độ cao đẳng, đại học đã được tạm hoãn thì đến hết 27 tuổi. b) Đúng. Điểm g khoản 1 Điều 41 Luật Nghĩa vụ quân sự 2015 quy định tạm hoãn gọi nhập ngũ đối với công dân đang được đào tạo trình độ đại học hệ chính quy trong thời gian một khóa đào tạo. c) Đúng. Điều 33 Luật Nghĩa vụ quân sự 2015: hằng năm gọi công dân nhập ngũ một lần vào tháng hai hoặc tháng ba. d) Sai. Hành vi trốn tránh nghĩa vụ quân sự bị xử phạt vi phạm hành chính với mức phạt tiền nghiêm khắc, thậm chí có thể bị truy cứu trách nhiệm hình sự về tội trốn tránh nghĩa vụ quân sự (Điều 332 Bộ luật Hình sự 2015)."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Theo Bộ luật Lao động 2019, thời gian thử việc đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên tối đa là bao nhiêu ngày?", "answer": "60 ngày", "explain": "Điều 25 Bộ luật Lao động 2019 quy định thời gian thử việc: không quá 180 ngày đối với công việc của người quản lý doanh nghiệp; không quá 60 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên; không quá 30 ngày đối với công việc có chức danh nghề nghiệp cần trình độ trung cấp, công nhân kỹ thuật; không quá 06 ngày làm việc đối với công việc khác. Quy định này bảo vệ người lao động khỏi bị kéo dài thử việc tùy tiện."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một hộ kinh doanh có định phí 200 triệu đồng/năm, giá bán 100.000 đồng/sản phẩm, biến phí bình quân 60.000 đồng/sản phẩm. Sản lượng hòa vốn của hộ kinh doanh là bao nhiêu sản phẩm?", "answer": "5.000 sản phẩm", "explain": "Sản lượng hòa vốn bằng định phí chia cho lãi gộp trên mỗi sản phẩm (giá bán trừ biến phí). Áp dụng: 200.000.000 / (100.000 - 60.000) = 200.000.000 / 40.000 = 5.000 sản phẩm. Tại mức sản lượng này tổng doanh thu vừa đủ bù đắp tổng chi phí; vượt qua mức này hộ kinh doanh bắt đầu có lãi."}]}]}
