<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 2", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Khi lạm phát tăng cao, Ngân hàng Nhà nước quyết định tăng lãi suất điều hành. Chuỗi tác động nào sau đây phản ánh đúng nhất cơ chế truyền dẫn của chính sách này?", "options": ["A. Lãi suất tăng làm chi phí vay vốn tăng, đầu tư và tiêu dùng giảm, tổng cầu giảm, qua đó kiềm chế lạm phát.", "B. Lãi suất tăng khiến người dân gửi tiết kiệm ít hơn, tổng cầu tăng, lạm phát càng tăng.", "C. Lãi suất tăng khiến doanh nghiệp vay nhiều hơn để mở rộng sản xuất, nguồn cung tăng, giá giảm ngay lập tức.", "D. Lãi suất tăng làm đồng nội tệ mất giá, xuất khẩu giảm, nhập khẩu tăng."], "answer": "A", "explain": "Đây là cơ chế truyền dẫn của chính sách tiền tệ thắt chặt: lãi suất điều hành tăng kéo mặt bằng lãi suất thị trường tăng lên, chi phí sử dụng vốn đắt đỏ hơn nên doanh nghiệp thu hẹp đầu tư, hộ gia đình giảm tiêu dùng dùng tín dụng; tổng cầu (C + I) giảm gây sức ép giảm giá, kiềm chế lạm phát. Phương án D sai vì lãi suất tăng thường thu hút vốn vào, làm đồng nội tệ lên giá chứ không mất giá."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Doanh nghiệp dệt may V xuất khẩu sang thị trường EU và muốn được hưởng thuế suất ưu đãi 0% theo Hiệp định EVFTA. Điều kiện then chốt doanh nghiệp phải đáp ứng là gì?", "options": ["A. Doanh nghiệp phải có vốn đầu tư nước ngoài.", "B. Hàng hóa phải đáp ứng quy tắc xuất xứ của hiệp định và có chứng nhận xuất xứ hợp lệ.", "C. Chỉ cần hàng hóa được sản xuất tại Việt Nam là tự động được hưởng ưu đãi.", "D. Doanh nghiệp phải niêm yết cổ phiếu trên sàn chứng khoán."], "answer": "B", "explain": "Ưu đãi thuế quan trong các hiệp định thương mại tự do không áp dụng tự động theo nơi sản xuất mà gắn với quy tắc xuất xứ (rules of origin): hàng hóa phải có hàm lượng giá trị gia tăng hoặc trải qua công đoạn gia công, chế biến đủ mức trong lãnh thổ các nước thành viên, đồng thời phải có chứng nhận xuất xứ (C/O) hợp lệ. Đây là rào cản kỹ thuật quan trọng mà doanh nghiệp xuất khẩu phải vượt qua khi hội nhập kinh tế quốc tế."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Anh T sinh năm 2000, tốt nghiệp đại học năm 2022 và đã được tạm hoãn gọi nhập ngũ trong suốt thời gian học. Năm 2026, khi 26 tuổi, anh T nhận được lệnh gọi nhập ngũ nhưng cho rằng người đã tốt nghiệp đại học thì không phải thực hiện nghĩa vụ quân sự. Theo Luật Nghĩa vụ quân sự 2015, nhận định nào sau đây đúng?", "options": ["A. Anh T nói đúng vì đã tốt nghiệp đại học.", "B. Anh T vẫn trong độ tuổi gọi nhập ngũ vì công dân được đào tạo trình độ cao đẳng, đại học đã được tạm hoãn gọi nhập ngũ thì độ tuổi gọi nhập ngũ đến hết 27 tuổi.", "C. Anh T chỉ phải nhập ngũ nếu tự nguyện đăng ký.", "D. Độ tuổi gọi nhập ngũ tối đa là 25 tuổi nên anh T đã hết tuổi."], "answer": "B", "explain": "Điều 30 Luật Nghĩa vụ quân sự 2015 quy định: công dân đủ 18 tuổi được gọi nhập ngũ; độ tuổi gọi nhập ngũ từ đủ 18 tuổi đến hết 25 tuổi; công dân được đào tạo trình độ cao đẳng, đại học đã được tạm hoãn gọi nhập ngũ thì độ tuổi gọi nhập ngũ đến hết 27 tuổi. Tốt nghiệp đại học chỉ chấm dứt thời gian tạm hoãn (khoản 1 Điều 41), không phải căn cứ miễn gọi nhập ngũ. Vì vậy ở tuổi 26, anh T vẫn thuộc diện gọi nhập ngũ nếu đủ các tiêu chuẩn khác."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "K tự ý lấy ảnh chân dung của H đăng lên mạng xã hội để quảng cáo sản phẩm của mình mà không được H đồng ý. H yêu cầu K gỡ bỏ và bồi thường. Pháp luật bảo vệ H như thế nào?", "options": ["A. K không vi phạm vì bức ảnh H đã từng đăng công khai trên trang cá nhân.", "B. Cá nhân có quyền đối với hình ảnh của mình; việc sử dụng hình ảnh của cá nhân phải được người đó đồng ý; H có quyền yêu cầu chấm dứt hành vi vi phạm, gỡ bỏ và bồi thường thiệt hại.", "C. Chỉ người nổi tiếng mới được pháp luật bảo vệ hình ảnh.", "D. K chỉ vi phạm nếu thu lợi bất chính trên 100 triệu đồng."], "answer": "B", "explain": "Điều 32 Bộ luật Dân sự 2015 quy định cá nhân có quyền đối với hình ảnh của mình; việc sử dụng hình ảnh của cá nhân phải được người đó đồng ý, trừ một số trường hợp luật định (vì lợi ích quốc gia, công cộng). Việc H từng đăng ảnh công khai không đồng nghĩa với việc đồng ý cho K dùng ảnh vào mục đích quảng cáo thương mại. H có quyền yêu cầu K chấm dứt hành vi, gỡ bỏ hình ảnh, xin lỗi, cải chính và bồi thường thiệt hại theo quy định của pháp luật dân sự."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một hộ kinh doanh dự định sản xuất một loại sản phẩm với định phí 120 triệu đồng/năm, biến phí bình quân 30.000 đồng/sản phẩm, giá bán dự kiến 50.000 đồng/sản phẩm. Sản lượng hòa vốn của hộ kinh doanh là bao nhiêu?", "options": ["A. 4.000 sản phẩm.", "B. 6.000 sản phẩm.", "C. 2.400 sản phẩm.", "D. 3.000 sản phẩm."], "answer": "B", "explain": "Điểm hòa vốn là mức sản lượng mà tại đó tổng doanh thu bằng tổng chi phí. Công thức: sản lượng hòa vốn bằng định phí chia cho lãi gộp trên mỗi sản phẩm (giá bán trừ biến phí). Áp dụng: 120.000.000 / (50.000 - 30.000) = 120.000.000 / 20.000 = 6.000 sản phẩm. Dưới mức này hộ kinh doanh lỗ, trên mức này bắt đầu có lãi. Đây là công cụ phân tích không thể thiếu khi lập kế hoạch kinh doanh."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nghi ngờ anh D trộm cắp tài sản, trưởng công an xã ra lệnh bắt giữ anh D đưa về trụ sở mà không có quyết định phê chuẩn của Viện kiểm sát, cũng không thuộc trường hợp phạm tội quả tang hay trường hợp khẩn cấp. Hành vi này được đánh giá như thế nào?", "options": ["A. Đúng thẩm quyền vì công an xã được bắt người khi có nghi ngờ.", "B. Vi phạm quyền bất khả xâm phạm về thân thể của công dân; việc bắt, giam giữ người phải tuân theo trình tự do luật định.", "C. Chỉ vi phạm nội quy nội bộ của ngành công an.", "D. Được coi là hợp pháp nếu sau đó chứng minh được anh D có tội."], "answer": "B", "explain": "Điều 20 Hiến pháp 2013 quy định mọi người có quyền bất khả xâm phạm về thân thể, không ai bị bắt nếu không có quyết định của Tòa án nhân dân, quyết định hoặc phê chuẩn của Viện kiểm sát nhân dân, trừ trường hợp phạm tội quả tang. Việc bắt người khi chỉ dựa trên nghi ngờ, không có phê chuẩn và không thuộc trường hợp luật cho phép là trái pháp luật, xâm phạm quyền con người, quyền công dân; người thực hiện có thể bị xử lý kỷ luật, xử phạt hành chính hoặc truy cứu trách nhiệm hình sự tùy mức độ."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Chị N tham gia bảo hiểm xã hội bắt buộc, đã đóng được 8 tháng trong thời gian 12 tháng trước khi sinh con; chị sinh đôi hai cháu khỏe mạnh. Đánh giá các nhận định sau:", "statements": ["a) Chị N đủ điều kiện hưởng chế độ thai sản vì đã đóng bảo hiểm xã hội từ đủ 06 tháng trở lên trong 12 tháng trước khi sinh.", "b) Tổng thời gian chị N được nghỉ việc hưởng chế độ thai sản là 07 tháng.", "c) Mức hưởng chế độ thai sản mỗi tháng của chị N bằng 100% mức bình quân tiền lương tháng đóng bảo hiểm xã hội của 06 tháng trước khi nghỉ việc.", "d) Chồng chị N đang đóng bảo hiểm xã hội thì không được nghỉ việc khi vợ sinh con."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. Điều 31 Luật Bảo hiểm xã hội 2014: điều kiện hưởng chế độ thai sản là phải đóng bảo hiểm xã hội từ đủ 06 tháng trở lên trong thời gian 12 tháng trước khi sinh con; chị N đóng 8 tháng nên đủ điều kiện. b) Đúng. Điều 34 Luật Bảo hiểm xã hội 2014: lao động nữ sinh con được nghỉ 06 tháng; sinh đôi trở lên thì tính từ con thứ 02 trở đi, cứ mỗi con người mẹ được nghỉ thêm 01 tháng, vậy chị N được nghỉ 07 tháng. c) Đúng. Điều 39 Luật Bảo hiểm xã hội 2014: mức hưởng một tháng bằng 100% mức bình quân tiền lương tháng đóng bảo hiểm xã hội của 06 tháng trước khi nghỉ việc hưởng chế độ thai sản. d) Sai. Lao động nam đang đóng bảo hiểm xã hội khi vợ sinh con được nghỉ việc hưởng chế độ thai sản 05 ngày làm việc (07 ngày nếu vợ sinh con phải phẫu thuật hoặc sinh con dưới 32 tuần tuổi)."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Trước tình trạng một cơ sở sản xuất gây ô nhiễm nguồn nước, người dân địa phương tìm hiểu quy định pháp luật về bảo vệ môi trường. Đánh giá các nhận định sau:", "statements": ["a) Mọi người có quyền được sống trong môi trường trong lành và có nghĩa vụ bảo vệ môi trường.", "b) Tổ chức, cá nhân gây ô nhiễm môi trường phải khắc phục ô nhiễm, phục hồi môi trường và bồi thường thiệt hại theo quy định của pháp luật.", "c) Bảo vệ môi trường là trách nhiệm riêng của Nhà nước; doanh nghiệp chỉ cần nộp thuế đầy đủ là đã hoàn thành trách nhiệm.", "d) Người dân phát hiện cơ sở gây ô nhiễm môi trường có quyền tố cáo hành vi vi phạm pháp luật về bảo vệ môi trường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. Điều 43 Hiến pháp 2013 ghi nhận quyền được sống trong môi trường trong lành đi đôi với nghĩa vụ bảo vệ môi trường của mọi người. b) Đúng. Đây là nguyên tắc người gây ô nhiễm phải chịu trách nhiệm: Luật Bảo vệ môi trường 2020 buộc tổ chức, cá nhân gây ô nhiễm phải khắc phục, phục hồi và bồi thường thiệt hại. c) Sai. Bảo vệ môi trường là trách nhiệm chung của toàn xã hội; doanh nghiệp ngoài nghĩa vụ thuế còn phải tuân thủ pháp luật môi trường và chịu trách nhiệm xã hội với cộng đồng. d) Đúng. Theo Luật Tố cáo 2018, cá nhân có quyền tố cáo hành vi vi phạm pháp luật về bảo vệ môi trường gây thiệt hại hoặc đe dọa gây thiệt hại đến lợi ích của Nhà nước, quyền và lợi ích hợp pháp của tổ chức, cá nhân."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Áp dụng quy tắc quản lý tài chính cá nhân 50/30/20 (50% thu nhập cho nhu cầu thiết yếu, 30% cho mong muốn cá nhân, 20% cho tiết kiệm và đầu tư), một người có thu nhập 20 triệu đồng/tháng thì số tiền dành cho tiết kiệm và đầu tư mỗi tháng là bao nhiêu?", "answer": "4 triệu đồng", "explain": "Theo quy tắc 50/30/20 trong quản lý thu, chi: nhóm tiết kiệm và đầu tư chiếm 20% thu nhập. Vậy số tiền là 20% x 20 triệu đồng = 4 triệu đồng/tháng. Việc duy trì tỉ lệ tiết kiệm ổn định, xây dựng quỹ dự phòng tương đương 3 đến 6 tháng chi tiêu và phân bổ đầu tư hợp lý là nền tảng của an toàn tài chính cá nhân và gia đình."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phát hiện chủ tịch xã chỉ đạo lập hồ sơ khống để chiếm đoạt tiền hỗ trợ thiên tai của người dân, anh Q làm đơn gửi cơ quan có thẩm quyền đề nghị xử lý. Trong trường hợp này, anh Q đang thực hiện quyền khiếu nại hay quyền tố cáo?", "answer": "Tố cáo", "explain": "Đây là quyền tố cáo theo Luật Tố cáo 2018: cá nhân báo cho cơ quan có thẩm quyền biết về hành vi vi phạm pháp luật của bất kỳ tổ chức, cá nhân nào gây thiệt hại hoặc đe dọa gây thiệt hại đến lợi ích của Nhà nước, quyền và lợi ích hợp pháp của tổ chức, cá nhân. Khác với khiếu nại là việc công dân đề nghị xem xét lại quyết định hành chính, hành vi hành chính khi cho rằng xâm phạm quyền, lợi ích hợp pháp của chính mình (Luật Khiếu nại 2011)."}]}]}
