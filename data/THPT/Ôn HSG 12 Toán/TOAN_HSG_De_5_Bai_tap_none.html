<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 5","questions": [{"type": "mcq","level": "VDC","q": "Cho $a, b, c$ là các số thực dương thỏa mãn $a + b + c = 3$. Giá trị nhỏ nhất của $P = a^2 + b^2 + c^2 + abc$ bằng","options": ["A. $3$","B. $4$","C. $5$","D. $6$"],"answer": "B","explain": "Hướng tư duy: với điều kiện đối xứng $a+b+c = 3$, dùng phương pháp $pqr$ kết hợp bất đẳng thức Schur để đánh giá $P$ từ dưới. Đặt $p = a+b+c = 3$, $q = ab+bc+ca$, $r = abc$. Ta có $a^2+b^2+c^2 = p^2-2q = 9-2q$, nên $P = 9-2q+r$. Bất đẳng thức Schur bậc một: $p^3+9r \\ge 4pq$, tức $27+9r \\ge 12q$, suy ra $r \\ge \\frac{4q-9}{3}$. Do đó $P \\ge 9-2q+\\frac{4q-9}{3} = 6-\\frac{2q}{3}$. Vì $q \\le \\frac{p^2}{3} = 3$ nên $P \\ge 6-2 = 4$. Dấu bằng xảy ra khi $a = b = c = 1$. Vậy giá trị nhỏ nhất là $4$.","points": 0.25},{"type": "mcq","level": "VDC","q": "Hệ phương trình $\\begin{cases} x^2 + xy + y^2 = 7 \\\\ x^4 + x^2y^2 + y^4 = 21 \\end{cases}$ có bao nhiêu nghiệm thực $(x; y)$?","options": ["A. $2$","B. $4$","C. $0$","D. $8$"],"answer": "B","explain": "Hướng tư duy: nhận ra $x^4+x^2y^2+y^4 = (x^2+y^2)^2-(xy)^2$ là hiệu hai bình phương, phân tích thành nhân tử rồi kết hợp với phương trình đầu để tách thành hệ đối xứng cơ bản. Đặt $a = x^2+y^2$, $b = xy$. Phương trình đầu: $a+b = 7$. Phương trình hai: $a^2-b^2 = 21$, tức $(a-b)(a+b) = 21$, suy ra $a-b = 3$. Giải được $a = 5$, $b = 2$. Khi đó $(x+y)^2 = a+2b = 9$, nên $x+y = 3$ hoặc $x+y = -3$. Với $x+y = 3$, $xy = 2$: $(x; y) = (1; 2), (2; 1)$. Với $x+y = -3$, $xy = 2$: $(x; y) = (-1; -2), (-2; -1)$. Tổng cộng $4$ nghiệm thực.","points": 0.25},{"type": "mcq","level": "VDC","q": "Trong không gian $Oxyz$, cho mặt cầu $(S): x^2 + y^2 + z^2 - 2x - 4y - 6z + 8 = 0$ và điểm $A(1; 2; 3)$. Có bao nhiêu mặt phẳng đi qua $A$ cắt $(S)$ theo giao tuyến là đường tròn có bán kính bằng $2$?","options": ["A. $0$","B. $1$","C. $2$","D. Vô số"],"answer": "A","explain": "Hướng tư duy: trước khi lập phương trình mặt phẳng, hãy xác định vị trí tương đối của $A$ với mặt cầu — nếu $A$ trùng tâm thì mọi thiết diện qua $A$ đều là đường tròn lớn. Viết lại $(S)$: $(x-1)^2+(y-2)^2+(z-3)^2 = 6$, tâm $I(1; 2; 3)$, bán kính $R = \\sqrt{6}$. Điểm $A(1; 2; 3)$ trùng với tâm $I$. Mọi mặt phẳng đi qua tâm cắt mặt cầu theo đường tròn lớn có bán kính $R = \\sqrt{6} \\ne 2$. Vậy không có mặt phẳng nào thỏa mãn.","points": 0.25},{"type": "mcq","level": "VDC","q": "Trong không gian $Oxyz$, cho $A(1; 2; -1)$, $B(3; 0; 1)$. Điểm $M$ thuộc mặt phẳng $(Oxy)$ sao cho $MA + MB$ nhỏ nhất. Độ dài $OM$ bằng","options": ["A. $\\sqrt{5}$","B. $\\sqrt{3}$","C. $2$","D. $3$"],"answer": "A","explain": "Hướng tư duy: tổng hai khoảng cách trên một mặt phẳng là hàm lồi nên điểm cực tiểu là duy nhất; khai thác tính đối xứng của hình ($A, B$ đối xứng qua mặt phẳng trung trực) để đoán điểm dừng rồi kiểm tra bằng đạo hàm. Xét $f(x, y) = \\sqrt{(x-1)^2+(y-2)^2+1}+\\sqrt{(x-3)^2+y^2+1}$ với $M(x; y; 0)$. Do tính đối xứng (đổi vai trò $A \\leftrightarrow B$ đồng thời với phép đối xứng tâm $(2; 1)$ trên mặt phẳng), điểm dừng phải là $M(2; 1; 0)$: kiểm tra $\\nabla f(2,1) = \\left(\\frac{1}{\\sqrt{3}}-\\frac{1}{\\sqrt{3}},\\, \\frac{-1}{\\sqrt{3}}+\\frac{1}{\\sqrt{3}}\\right) = (0; 0)$. Vì $f$ là tổng các hàm lồi (chuẩn Euclid) nên điểm dừng là điểm cực tiểu toàn cục. Vậy $M(2; 1; 0)$, $OM = \\sqrt{5}$.","points": 0.25},{"type": "mcq","level": "VDC","q": "Phương trình $\\sqrt{x^2 + 1} + \\sqrt{x^2 - 2x + 2} = 3$ có bao nhiêu nghiệm thực?","options": ["A. $0$","B. $1$","C. $2$","D. $3$"],"answer": "C","explain": "Hướng tư duy: mỗi căn thức là khoảng cách từ điểm $P(x; 0)$ trên trục hoành đến một điểm cố định — phương trình trở thành \"tổng hai khoảng cách bằng hằng số\" (elip); giải đại số bằng cách cô lập rồi bình phương hai lần (hoặc một lần khéo léo). Ta có $\\sqrt{x^2+1} = d(P, A)$ và $\\sqrt{(x-1)^2+1} = d(P, B)$ với $P(x; 0)$, $A(0; 1)$, $B(1; 1)$. Giải đại số: đặt $u = \\sqrt{x^2+1}$, $v = \\sqrt{(x-1)^2+1}$, $u+v = 3$; $u^2-v^2 = 2x-1$ nên $(u-v)(u+v) = 2x-1$, suy ra $u-v = \\frac{2x-1}{3}$. Cộng với $u+v = 3$ được $u = \\frac{x+4}{3}$. Bình phương: $x^2+1 = \\frac{(x+4)^2}{9}$, tức $8x^2-8x-7 = 0$, cho $x = \\frac{2\\pm 3\\sqrt{2}}{4}$. Cả hai đều thỏa $u = \\frac{x+4}{3} \\ge 0$ (và $v = 3-u \\gt 0$). Vậy phương trình có $2$ nghiệm thực.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho $x, y \\ge 0$ thỏa mãn $x + y = 2$. Giá trị lớn nhất của $P = x\\sqrt{1+y} + y\\sqrt{1+x}$ bằng","options": ["A. $2\\sqrt{2}$","B. $3$","C. $2$","D. $\\sqrt{10}$"],"answer": "A","explain": "Hướng tư duy: tổng có dạng $\\sum a_i b_i$ gợi ý bất đẳng thức Cauchy-Schwarz; sau khi tách được $P^2 \\le (x+y)(\\cdots)$, phần còn lại là đánh giá $xy$. Theo Cauchy-Schwarz: $P^2 = \\left(x\\sqrt{1+y}+y\\sqrt{1+x}\\right)^2 \\le (x+y)\\left[x(1+y)+y(1+x)\\right] = 2(x+y+2xy) = 4(1+xy)$. Vì $xy \\le \\left(\\frac{x+y}{2}\\right)^2 = 1$ nên $P^2 \\le 8$, tức $P \\le 2\\sqrt{2}$. Dấu bằng xảy ra khi $\\frac{x}{x(1+y)} = \\frac{y}{y(1+x)}$ (tức $x = y$) và $xy$ lớn nhất, tức $x = y = 1$. Vậy giá trị lớn nhất là $2\\sqrt{2}$.","points": 0.25},{"type": "truefalse","level": "VDC","q": "Trong không gian $Oxyz$, cho mặt cầu $(S): (x-1)^2+(y-2)^2+(z-3)^2 = 9$ và đường thẳng $d: \\frac{x-1}{1} = \\frac{y-2}{2} = \\frac{z-3}{2}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Đường thẳng $d$ cắt $(S)$ tại hai điểm phân biệt.","b) Hai giao điểm của $d$ với $(S)$ là $(2; 4; 5)$ và $(0; 0; 1)$.","c) Mặt phẳng vuông góc với $d$ tại tâm của $(S)$ cắt $(S)$ theo giao tuyến là đường tròn có bán kính bằng $3$.","d) Khoảng cách từ gốc tọa độ $O$ đến đường thẳng $d$ bằng $\\frac{\\sqrt{14}}{3}$."],"answer": ["T","T","T","F"],"explain": "Mặt cầu tâm $I(1; 2; 3)$, bán kính $R = 3$; $d$ đi qua $I$ với vectơ chỉ phương $\\vec{u} = (1; 2; 2)$, $|\\vec{u}| = 3$. a) Đúng: $d$ đi qua tâm nên cắt mặt cầu tại hai điểm. b) Đúng: giao điểm $= I \\pm R\\cdot\\frac{\\vec{u}}{|\\vec{u}|} = (1;2;3)\\pm(1;2;2)$, tức $(2;4;5)$ và $(0;0;1)$. c) Đúng: mặt phẳng qua tâm vuông góc với $d$ cắt mặt cầu theo đường tròn lớn bán kính $R = 3$. d) Sai: $d(O, d) = \\frac{|\\overrightarrow{OI}\\times\\vec{u}|}{|\\vec{u}|} = \\frac{|(-2; 1; 0)|}{3} = \\frac{\\sqrt{5}}{3} \\ne \\frac{\\sqrt{14}}{3}$.","points": 1},{"type": "truefalse","level": "VDC","q": "Cho $a, b$ là các số thực dương thỏa mãn $a + b = 1$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $ab \\le \\frac{1}{4}$.","b) $\\frac{1}{a} + \\frac{1}{b} \\ge 4$.","c) $a^2 + b^2 \\ge \\frac{1}{2}$.","d) Giá trị lớn nhất của $a^3 + b^3$ bằng $\\frac{1}{4}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng theo AM-GM: $ab \\le \\left(\\frac{a+b}{2}\\right)^2 = \\frac{1}{4}$. b) Đúng: $\\frac{1}{a}+\\frac{1}{b} = \\frac{a+b}{ab} = \\frac{1}{ab} \\ge 4$. c) Đúng: $a^2+b^2 = (a+b)^2-2ab = 1-2ab \\ge 1-\\frac{1}{2} = \\frac{1}{2}$. d) Sai: $a^3+b^3 = (a+b)^3-3ab(a+b) = 1-3ab$; vì $ab$ có thể nhỏ tùy ý (tiến về $0$ khi một trong hai số tiến về $0$) nên $a^3+b^3$ tiến về $1$ và không có giá trị lớn nhất (cận trên $1$ không đạt được). Giá trị $\\frac{1}{4}$ thực ra là giá trị nhỏ nhất (đạt tại $a = b = 1/2$).","points": 1},{"type": "short","level": "VDC","q": "Gọi $S$ là tập hợp tất cả các giá trị của tham số $m$ để hệ phương trình $\\begin{cases} x + y = m \\\\ x^2 + y^2 = 6 \\end{cases}$ có nghiệm thực $(x; y)$. Tính tổng các phần tử nguyên của $S$.","answer": "0","explain": "Hướng tư duy: hệ có nghiệm thực khi $(x+y)^2 \\le 2(x^2+y^2)$ (bất đẳng thức Cauchy) — điều này cho ngay miền giá trị của $m$ mà không cần giải hệ. Ta có $(x+y)^2 \\le 2(x^2+y^2) = 12$, nên $|m| \\le 2\\sqrt{3}$ (và mọi $m$ trong đoạn này đều cho nghiệm thực: với $m$ cố định, $x, y$ là nghiệm của $t^2-mt+\\frac{m^2-6}{2} = 0$ có $\\Delta = 12-m^2 \\ge 0$). Vậy $S = [-2\\sqrt{3}; 2\\sqrt{3}]$. Các số nguyên trong $S$: $-3, -2, -1, 0, 1, 2, 3$ (vì $2\\sqrt{3} \\approx 3{,}46$), tổng bằng $0$.","points": 0.5},{"type": "short","level": "VDC","q": "Trong không gian $Oxyz$, cho hai điểm $A(2; 0; 0)$, $B(0; 2; 0)$. Tập hợp các điểm $M$ thỏa mãn $MA^2 + MB^2 = 12$ là một mặt cầu. Tính bán kính của mặt cầu đó.","answer": "2","explain": "Hướng tư duy: với tổng bình phương khoảng cách đến hai điểm cố định, gọi $I$ là trung điểm của $AB$ và dùng đẳng thức vectơ để đưa về khoảng cách $MI$ không đổi (mặt cầu Apollonius). Gọi $I(1; 1; 0)$ là trung điểm của $AB$. Ta có $MA^2+MB^2 = (\\overrightarrow{MI}+\\overrightarrow{IA})^2+(\\overrightarrow{MI}+\\overrightarrow{IB})^2 = 2MI^2+IA^2+IB^2+2\\overrightarrow{MI}\\cdot(\\overrightarrow{IA}+\\overrightarrow{IB})$. Vì $\\overrightarrow{IA}+\\overrightarrow{IB} = \\vec{0}$ và $IA = IB = \\frac{AB}{2} = \\sqrt{2}$ nên $MA^2+MB^2 = 2MI^2+4$. Điều kiện $MA^2+MB^2 = 12$ cho $2MI^2 = 8$, tức $MI = 2$. Vậy quỹ tích là mặt cầu tâm $I$ bán kính $2$.","points": 0.5}]}]}
</script>
