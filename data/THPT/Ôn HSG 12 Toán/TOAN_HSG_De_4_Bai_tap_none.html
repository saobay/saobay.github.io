<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 4","questions": [{"type": "mcq","level": "VDC","q": "Trong mặt phẳng $Oxy$, cho đường tròn $(C): x^2 + y^2 - 4x + 2y - 4 = 0$ và điểm $A(5; 1)$. Có bao nhiêu đường thẳng đi qua $A$ cắt $(C)$ tại hai điểm phân biệt $M, N$ sao cho $AM \\cdot AN = 8$?","options": ["A. $0$","B. $1$","C. $2$","D. Vô số"],"answer": "A","explain": "Hướng tư duy: tích $AM \\cdot AN$ (độ dài) dọc theo một cát tuyến qua điểm cố định ngoài đường tròn là hằng số — chính là phương tích của điểm đối với đường tròn; tính nó ra rồi so sánh với $8$. Đường tròn $(C)$ có tâm $I(2; -1)$, bán kính $R = \\sqrt{4+1+4} = 3$. Điểm $A(5;1)$ nằm ngoài $(C)$ vì $AI = \\sqrt{13} \\gt 3$. Phương tích của $A$ đối với $(C)$ là $AI^2-R^2 = 13-9 = 4$. Với mọi đường thẳng qua $A$ cắt $(C)$ tại $M, N$ ta luôn có $AM \\cdot AN = 4$ (giá trị tuyệt đối của phương tích). Vì $4 \\ne 8$ nên không có đường thẳng nào thỏa mãn.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho elip $(E): \\frac{x^2}{9} + \\frac{y^2}{4} = 1$ với hai tiêu điểm $F_1, F_2$. Có bao nhiêu điểm $M$ thuộc $(E)$ sao cho tam giác $MF_1F_2$ vuông tại $M$?","options": ["A. $2$","B. $3$","C. $4$","D. $0$"],"answer": "C","explain": "Hướng tư duy: từ định lí Pythagore và định nghĩa elip ($MF_1+MF_2 = 2a$) lập hệ tìm được bộ $\\{MF_1, MF_2\\}$, rồi giải giao của đường tròn tâm tiêu điểm với elip — chú ý tính đối xứng cho số điểm gấp đôi. Ta có $a = 3$, $b = 2$, $c = \\sqrt{5}$, $F_1F_2 = 2\\sqrt{5}$. Điều kiện vuông tại $M$: $MF_1^2+MF_2^2 = 20$ và $MF_1+MF_2 = 6$. Suy ra $2MF_1\\cdot MF_2 = 36-20 = 16$, tức $MF_1\\cdot MF_2 = 8$; vậy $\\{MF_1, MF_2\\} = \\{2, 4\\}$ (nghiệm của $t^2-6t+8 = 0$, đều nằm trong $[a-c; a+c]$). Trường hợp $MF_1 = 2$: giao của đường tròn $(x+\\sqrt{5})^2+y^2 = 4$ với $(E)$ cho $x = -\\frac{3\\sqrt{5}}{5}$, $y = \\pm\\frac{4}{\\sqrt{5}}$ ($2$ điểm). Trường hợp $MF_1 = 4$: tương tự cho $x = \\frac{3\\sqrt{5}}{5}$, $y = \\pm\\frac{4}{\\sqrt{5}}$ ($2$ điểm). Tổng cộng $4$ điểm.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho hình chóp $S.ABC$ có $SA = SB = SC = a$, $\\widehat{ASB} = 60^\\circ$, $\\widehat{BSC} = 90^\\circ$, $\\widehat{CSA} = 120^\\circ$. Thể tích khối chóp $S.ABC$ bằng","options": ["A. $\\frac{a^3\\sqrt{2}}{12}$","B. $\\frac{a^3\\sqrt{2}}{6}$","C. $\\frac{a^3}{6}$","D. $\\frac{a^3\\sqrt{3}}{12}$"],"answer": "A","explain": "Hướng tư duy: khi biết ba cạnh bên và ba góc ở đỉnh, dựng hệ trục tọa độ với một cạnh bên làm trục để các tọa độ còn lại đơn giản, rồi dùng công thức thể tích qua định thức. Đặt $S$ tại gốc tọa độ, $B = (a; 0; 0)$. Vì $\\widehat{ASB} = 60^\\circ$ nên $A = (a\\cos 60^\\circ; a\\sin 60^\\circ; 0) = (a/2; a\\sqrt{3}/2; 0)$. Vì $\\widehat{BSC} = 90^\\circ$ nên $C$ vuông góc với $SB$: $C = (0; c_y; c_z)$ với $c_y^2+c_z^2 = a^2$. Từ $\\overrightarrow{SA}\\cdot\\overrightarrow{SC} = a^2\\cos 120^\\circ = -a^2/2$ được $\\frac{a\\sqrt{3}}{2}c_y = -\\frac{a^2}{2}$, suy ra $c_y = -a/\\sqrt{3}$, $c_z = a\\sqrt{2/3}$. Thể tích $V = \\frac{1}{6}|\\det(\\overrightarrow{SA},\\overrightarrow{SB},\\overrightarrow{SC})| = \\frac{1}{6}\\cdot\\frac{a^3\\sqrt{2}}{2} = \\frac{a^3\\sqrt{2}}{12}$.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Khoảng cách giữa hai đường thẳng chéo nhau $A'B$ và $B'C$ bằng","options": ["A. $\\frac{a\\sqrt{3}}{3}$","B. $\\frac{a}{2}$","C. $\\frac{a\\sqrt{2}}{2}$","D. $a$"],"answer": "A","explain": "Hướng tư duy: gắn hệ trục tọa độ vào hình lập phương để mọi vectơ đều tường minh, rồi áp dụng công thức khoảng cách hai đường thẳng chéo nhau qua tích có hướng. Đặt $A(0;0;0)$, $B(a;0;0)$, $C(a;a;0)$, $A'(0;0;a)$, $B'(a;0;a)$, $C'(a;a;a)$. Đường $A'B$ có vectơ chỉ phương $\\vec{u_1} = (1; 0; -1)$, đường $B'C$ có $\\vec{u_2} = (0; 1; -1)$. Tích có hướng $\\vec{u_1}\\times\\vec{u_2} = (1; 1; 1)$. Với $M_1 = A'$, $M_2 = B'$: $\\overrightarrow{M_1M_2} = (a; 0; 0)$. Khoảng cách $d = \\frac{|\\overrightarrow{M_1M_2}\\cdot(\\vec{u_1}\\times\\vec{u_2})|}{|\\vec{u_1}\\times\\vec{u_2}|} = \\frac{a}{\\sqrt{3}} = \\frac{a\\sqrt{3}}{3}$.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho hình phẳng $(H)$ giới hạn bởi đồ thị hàm số $y = \\sin x$, trục hoành và hai đường thẳng $x = 0$, $x = \\pi$. Thể tích khối tròn xoay tạo thành khi quay $(H)$ quanh đường thẳng $y = 2$ bằng","options": ["A. $8\\pi - \\frac{\\pi^2}{2}$","B. $8\\pi$","C. $\\frac{\\pi^2}{2}$","D. $4\\pi$"],"answer": "A","explain": "Hướng tư duy: trục quay không phải $Ox$ mà là đường thẳng $y = 2$ nằm phía trên miền $(H)$ — dùng phương pháp vành khăn với bán kính ngoài và bán kính trong đo từ trục quay. Miền $(H)$: $0 \\le y \\le \\sin x$ ($x \\in [0; \\pi]$), nằm dưới đường thẳng $y = 2$. Khi quay quanh $y = 2$, tại mỗi $x$ thiết diện là vành khăn có bán kính ngoài $R = 2 - 0 = 2$ và bán kính trong $r = 2 - \\sin x$. Thể tích $V = \\pi\\int_0^{\\pi} \\left[4 - (2 - \\sin x)^2\\right]dx = \\pi\\int_0^{\\pi} (4\\sin x - \\sin^2 x)\\,dx$. Ta có $\\int_0^{\\pi} \\sin x\\,dx = 2$ và $\\int_0^{\\pi} \\sin^2 x\\,dx = \\frac{\\pi}{2}$, nên $V = \\pi\\left(8 - \\frac{\\pi}{2}\\right) = 8\\pi - \\frac{\\pi^2}{2}$.","points": 0.25},{"type": "mcq","level": "VDC","q": "Xét các hình trụ nội tiếp trong một hình nón có chiều cao $12$ và bán kính đáy $4$ (trục của hình trụ trùng với trục của hình nón, một đáy của hình trụ nằm trên đáy của hình nón). Bán kính đáy của hình trụ có thể tích lớn nhất bằng","options": ["A. $\\frac{8}{3}$","B. $2$","C. $3$","D. $\\frac{4}{3}$"],"answer": "A","explain": "Hướng tư duy: dùng tam giác đồng dạng trong thiết diện qua trục để biểu diễn chiều cao hình trụ theo bán kính đáy, rồi tối ưu hàm một biến. Gọi $r, h$ là bán kính đáy và chiều cao hình trụ ($0 \\lt r \\lt 4$). Thiết diện qua trục cho tam giác đồng dạng: $\\frac{r}{4} = \\frac{12-h}{12}$, suy ra $h = 12-3r$. Thể tích $V = \\pi r^2 h = \\pi(12r^2-3r^3)$. Xét $f(r) = 12r^2-3r^3$: $f'(r) = 24r-9r^2 = 3r(8-3r)$; $f' = 0$ cho $r = \\frac{8}{3}$ (loại $r = 0$). Vì $f$ tăng rồi giảm nên $r = \\frac{8}{3}$ cho thể tích lớn nhất.","points": 0.25},{"type": "truefalse","level": "VDC","q": "Cho hình chóp $S.ABCD$ có đáy $ABCD$ là hình vuông cạnh $a$, $SA$ vuông góc với mặt phẳng $(ABCD)$, $SA = a\\sqrt{2}$. Gọi $M$ là trung điểm của $SC$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Thể tích khối chóp $S.ABCD$ bằng $\\frac{a^3\\sqrt{2}}{3}$.","b) Khoảng cách từ $A$ đến mặt phẳng $(SBC)$ bằng $\\frac{a\\sqrt{6}}{3}$.","c) Góc giữa đường thẳng $AM$ và mặt phẳng $(ABCD)$ bằng $45^\\circ$.","d) Khoảng cách từ $M$ đến mặt phẳng $(ABCD)$ bằng $a\\sqrt{2}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $V = \\frac{1}{3}\\cdot a^2\\cdot a\\sqrt{2} = \\frac{a^3\\sqrt{2}}{3}$. b) Đúng: $BC \\perp AB$ và $BC \\perp SA$ nên $BC \\perp (SAB)$, suy ra $(SBC) \\perp (SAB)$; khoảng cách từ $A$ đến $(SBC)$ là đường cao $AH$ của tam giác vuông $SAB$ xuống $SB$: $AH = \\frac{SA\\cdot AB}{SB} = \\frac{a\\sqrt{2}\\cdot a}{a\\sqrt{3}} = \\frac{a\\sqrt{6}}{3}$. c) Đúng: gắn hệ trục $A(0;0;0)$, $S(0;0;a\\sqrt{2})$, $C(a;a;0)$ thì $M(a/2;a/2;a\\sqrt{2}/2)$; $\\sin\\varphi = \\frac{|\\overrightarrow{AM}\\cdot\\vec{k}|}{|\\overrightarrow{AM}|} = \\frac{a\\sqrt{2}/2}{a} = \\frac{\\sqrt{2}}{2}$ nên $\\varphi = 45^\\circ$. d) Sai: $M$ là trung điểm của $SC$ nên khoảng cách từ $M$ đến $(ABCD)$ bằng một nửa khoảng cách từ $S$, tức $\\frac{a\\sqrt{2}}{2}$, không phải $a\\sqrt{2}$.","points": 1},{"type": "truefalse","level": "VDC","q": "Cho elip $(E): \\frac{x^2}{16} + \\frac{y^2}{9} = 1$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tiêu cự của $(E)$ bằng $2\\sqrt{7}$.","b) Điểm $M(0; 3)$ thuộc $(E)$ và $MF_1 = MF_2$.","c) Đường thẳng đi qua tiêu điểm $F_1(-\\sqrt{7}; 0)$ và vuông góc với trục lớn cắt $(E)$ tại hai điểm có tổng hoành độ bằng $-2\\sqrt{7}$.","d) Tâm sai của $(E)$ bằng $\\frac{\\sqrt{7}}{3}$."],"answer": ["T","T","T","F"],"explain": "Ta có $a = 4$, $b = 3$, $c = \\sqrt{a^2-b^2} = \\sqrt{7}$. a) Đúng: tiêu cự $2c = 2\\sqrt{7}$. b) Đúng: $M(0;3)$ thỏa phương trình $(E)$; $M$ nằm trên trục nhỏ nên cách đều hai tiêu điểm ($MF_1 = MF_2 = a = 4$). c) Đúng: đường thẳng $x = -\\sqrt{7}$ cắt $(E)$ tại hai điểm cùng hoành độ $-\\sqrt{7}$, tổng hoành độ bằng $-2\\sqrt{7}$. d) Sai: tâm sai $e = c/a = \\sqrt{7}/4$, không phải $\\sqrt{7}/3$.","points": 1},{"type": "short","level": "VDC","q": "Cho hình chóp tứ giác đều $S.ABCD$ có cạnh đáy bằng $2$ và cạnh bên bằng $3$. Thể tích khối chóp bằng $\\frac{a\\sqrt{b}}{c}$ với $a, b, c$ là các số nguyên dương và phân số tối giản. Tính $a + b + c$.","answer": "14","explain": "Hướng tư duy: với chóp tứ giác đều, đường cao hạ từ $S$ xuống tâm $O$ của đáy; tính $SO$ bằng Pythagore trong tam giác $SOC$. Đáy là hình vuông cạnh $2$ nên $OC = \\frac{2\\sqrt{2}}{2} = \\sqrt{2}$. Cạnh bên $SC = 3$ nên $SO = \\sqrt{SC^2-OC^2} = \\sqrt{9-2} = \\sqrt{7}$. Thể tích $V = \\frac{1}{3}\\cdot 2^2\\cdot\\sqrt{7} = \\frac{4\\sqrt{7}}{3}$, tức $a = 4$, $b = 7$, $c = 3$ (phân số đã tối giản). Vậy $a+b+c = 14$.","points": 0.5},{"type": "short","level": "VDC","q": "Cho hình chóp $S.ABC$ có $SA$ vuông góc với mặt phẳng $(ABC)$, tam giác $ABC$ vuông tại $B$ với $AB = 6$, $BC = 8$, $SA = 8$. Bán kính mặt cầu ngoại tiếp hình chóp $S.ABC$ bằng $\\sqrt{a}$. Tính $a$.","answer": "41","explain": "Hướng tư duy: tìm một đoạn thẳng mà nhiều đỉnh cùng \"nhìn\" dưới góc vuông — đó chính là đường kính mặt cầu ngoại tiếp. Ta có $BC \\perp AB$ (giả thiết) và $BC \\perp SA$ (do $SA \\perp (ABC)$), nên $BC \\perp (SAB)$, suy ra $BC \\perp SB$, tức $\\widehat{SBC} = 90^\\circ$. Lại có $\\widehat{SAC} = 90^\\circ$ (do $SA \\perp AC$). Vậy hai đỉnh $B$ và $A$ cùng nhìn đoạn $SC$ dưới góc vuông, nên $SC$ là đường kính của mặt cầu ngoại tiếp hình chóp. $AC = \\sqrt{6^2+8^2} = 10$; $SC = \\sqrt{SA^2+AC^2} = \\sqrt{64+100} = \\sqrt{164} = 2\\sqrt{41}$. Bán kính $R = \\sqrt{41}$, tức $a = 41$.","points": 0.5}]}]}
