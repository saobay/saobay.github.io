<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "VDC","q": "Cho hàm số $f(x) = x^3 - 3x^2 + 2$. Hàm số $g(x) = |f(x)|$ có bao nhiêu điểm cực trị?","options": ["A. $3$","B. $4$","C. $5$","D. $6$"],"answer": "C","explain": "Hướng tư duy: đồ thị của $|f|$ gồm phần đồ thị của $f$ nằm trên trục hoành giữ nguyên và phần nằm dưới lật lên trên; mỗi nghiệm đơn của $f(x) = 0$ trở thành một điểm \"gãy\" (cực tiểu bằng $0$), còn cực trị của $f$ nằm hẳn trên/dưới trục hoành thì giữ nguyên tính chất. Ta có $f'(x) = 3x^2 - 6x = 3x(x - 2)$, $f$ đạt cực đại tại $x = 0$ với $f(0) = 2 \\gt 0$ và cực tiểu tại $x = 2$ với $f(2) = -2 \\lt 0$. Vì $f(0) \\gt 0$ nên lân cận $x = 0$ đồ thị không bị lật, $x = 0$ vẫn là điểm cực đại của $|f|$. Vì $f(2) \\lt 0$ nên lân cận $x = 2$ đồ thị bị lật lên, $x = 2$ trở thành điểm cực đại của $|f|$ (giá trị $2$). Mặt khác $f(x) = (x - 1)(x^2 - 2x - 2)$ có ba nghiệm đơn $x = 1$, $x = 1 \\pm \\sqrt{3}$, tại mỗi nghiệm đồ thị cắt trục hoành nên $|f|$ có điểm gãy là cực tiểu bằng $0$. Vậy $|f|$ có $2$ điểm cực đại và $3$ điểm cực tiểu, tổng cộng $5$ điểm cực trị.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho hàm số $y = x^3 - 3x + 1$ có đồ thị $(C)$. Có bao nhiêu giá trị nguyên của tham số $m$ để đường thẳng $d: y = m(x - 1) + 2$ cắt $(C)$ tại ba điểm phân biệt $A, B, C$ sao cho $B$ nằm giữa $A$ và $C$ đồng thời $AB = BC$?","options": ["A. $0$","B. $1$","C. $2$","D. $3$"],"answer": "B","explain": "Hướng tư duy: $B$ nằm giữa $A, C$ và $AB = BC$ nghĩa là $B$ là trung điểm của $AC$; trên một đường thẳng không đứng thì trung điểm tương ứng với trung bình cộng hoành độ. Kết hợp với định lí Viète cho phương trình hoành độ giao điểm của đường thẳng với đồ thị bậc ba (tổng ba nghiệm bằng hệ số của $x^2$). Phương trình hoành độ giao điểm: $x^3 - 3x + 1 = m(x - 1) + 2$, tức $x^3 - (m + 3)x + (m - 1) = 0$. Gọi ba hoành độ là $x_1 \\lt x_2 \\lt x_3$; theo Viète $x_1 + x_2 + x_3 = 0$. Do $B$ là trung điểm của $AC$ nên $x_2 = (x_1 + x_3)/2$, suy ra $3x_2 = 0$, tức $x_2 = 0$. Thay $x = 0$ vào phương trình: $m - 1 = 0$, được $m = 1$. Thử lại với $m = 1$: phương trình thành $x^3 - 4x = x(x - 2)(x + 2) = 0$, ba giao điểm $(-2, -1)$, $(0, 1)$, $(2, 3)$ phân biệt và điểm giữa $(0, 1)$ đúng là trung điểm. Vậy chỉ có đúng $1$ giá trị nguyên $m = 1$.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho hàm số $y = f(x)$ có đạo hàm thỏa mãn $f'(x) \\gt 0$ trên $(-\\infty; -1) \\cup (2; +\\infty)$, $f'(x) \\lt 0$ trên $(-1; 2)$ và $f'(-1) = f'(2) = 0$. Hàm số $g(x) = f(x^2 - 3x + 1)$ nghịch biến trên khoảng nào sau đây?","options": ["A. $(1; \\frac{3}{2})$","B. $(0; 2)$","C. $(\\frac{3}{2}; \\frac{5}{2})$","D. $(-1; 0)$"],"answer": "A","explain": "Hướng tư duy: với hàm hợp, dấu của $g'$ là tích dấu của đạo hàm hàm trong và $f'$ tại giá trị trung gian; đặt $t = x^2 - 3x + 1$ rồi xét dấu trên từng miền. Ta có $g'(x) = (2x - 3)\\, f'(x^2 - 3x + 1)$. Đặt $t = x^2 - 3x + 1 = (x - 3/2)^2 - 5/4 \\ge -5/4$. Trên khoảng $(1; 3/2)$: $2x - 3 \\lt 0$; còn $t$ giảm từ $t(1) = -1$ xuống $t(3/2) = -5/4$, nên $t \\in (-5/4; -1)$, tại đó $f'(t) \\gt 0$ (vì $t \\lt -1$). Do đó $g'(x) = (2x-3)f'(t) \\lt 0$ trên toàn khoảng $(1; 3/2)$, hàm nghịch biến. Kiểm tra các phương án còn lại: trên $(0; 2)$, $g'$ đổi dấu tại $x = 1$ (từ dương sang âm); trên $(3/2; 5/2)$, $g'$ đổi dấu tại $x = 2$; trên $(-1; 0)$, $t$ đi qua $-1$ nên $f'(t)$ đổi dấu. Vậy chỉ có $(1; 3/2)$ là khoảng đơn điệu đúng.","points": 0.25},{"type": "mcq","level": "VDC","q": "Gọi $M$ là giá trị lớn nhất của hàm số $y = |x^3 - 3x^2 + m|$ trên đoạn $[0; 3]$. Có bao nhiêu giá trị nguyên của $m$ để $M \\le 10$?","options": ["A. $16$","B. $17$","C. $18$","D. $15$"],"answer": "B","explain": "Hướng tư duy: đừng vội đạo hàm hàm trị tuyệt đối; hãy tìm miền giá trị của biểu thức bên trong trước, rồi giá trị lớn nhất của $|u + m|$ trên một đoạn chính là giá trị lớn hơn trong hai đầu mút (vì $|u+m|$ lồi theo $u$). Đặt $f(x) = x^3 - 3x^2$; $f'(x) = 3x(x - 2)$ nên trên $[0; 3]$, $f$ giảm trên $(0; 2)$ và tăng trên $(2; 3)$; $f(0) = 0$, $f(2) = -4$, $f(3) = 0$. Vậy miền giá trị của $f$ là $[-4; 0]$. Khi đó $M = \\max_{u \\in [-4; 0]} |u + m| = \\max(|m|, |m - 4|)$. Điều kiện $M \\le 10$ tương đương $|m| \\le 10$ và $|m - 4| \\le 10$, tức $-10 \\le m \\le 10$ và $-6 \\le m \\le 14$, giao lại được $-6 \\le m \\le 10$. Số giá trị nguyên là $10 - (-6) + 1 = 17$.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho hàm số $y = \\frac{2x + 1}{x - 1}$ có đồ thị $(C)$. Có bao nhiêu tiếp tuyến của $(C)$ cắt hai trục tọa độ $Ox, Oy$ lần lượt tại $A, B$ (khác gốc tọa độ $O$) sao cho diện tích tam giác $OAB$ bằng $2$?","options": ["A. $1$","B. $2$","C. $3$","D. $4$"],"answer": "B","explain": "Hướng tư duy: viết tiếp tuyến tại điểm tổng quát, tìm giao điểm với hai trục, lập phương trình diện tích; chú ý loại nghiệm làm cho giao điểm trùng gốc tọa độ. Ta có $y' = -3/(x - 1)^2$. Tiếp tuyến tại $x_0 \\ne 1$: $y = \\frac{-3}{(x_0-1)^2}(x - x_0) + \\frac{2x_0+1}{x_0-1}$. Cho $y = 0$ được $x_A = \\frac{2x_0^2 + 2x_0 - 1}{3}$; cho $x = 0$ được $y_B = \\frac{2x_0^2 + 2x_0 - 1}{(x_0-1)^2}$. Diện tích $S = \\frac{1}{2}|x_A y_B| = \\frac{(2x_0^2+2x_0-1)^2}{6(x_0-1)^2} = 2$, suy ra $(2x_0^2+2x_0-1)^2 = 12(x_0-1)^2$, tức $|2x_0^2+2x_0-1| = 2\\sqrt{3}\\,|x_0-1|$. Trường hợp $2x_0^2+2x_0-1 = 2\\sqrt{3}(x_0-1)$ cho $\\Delta = 24 - 24\\sqrt{3} \\lt 0$, vô nghiệm. Trường hợp $2x_0^2+2x_0-1 = -2\\sqrt{3}(x_0-1)$ cho $\\Delta = 24 + 24\\sqrt{3} \\gt 0$, có hai nghiệm phân biệt. Kiểm tra điều kiện $A, B$ khác $O$: $x_A = 0$ tương đương $2x_0^2+2x_0-1 = 0$, kết hợp với phương trình trường hợp hai sẽ cho $x_0 = 1$ (loại vì $x_0 \\ne 1$), nên hai nghiệm đều hợp lệ. Vậy có $2$ tiếp tuyến thỏa mãn.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho hàm số $f(x) = x^3 - 3x^2 + 1$. Phương trình $f(f(x)) = 0$ có bao nhiêu nghiệm thực phân biệt?","options": ["A. $5$","B. $6$","C. $7$","D. $9$"],"answer": "C","explain": "Hướng tư duy: với phương trình hàm hợp, giải lớp ngoài trước để thu được các \"mốc\" $t_i$, rồi với mỗi mốc đếm số nghiệm của $f(x) = t_i$ bằng cách so sánh $t_i$ với các giá trị cực trị của $f$. Đặt $t = f(x)$, giải $f(t) = t^3 - 3t^2 + 1 = 0$. Xét $g(t) = t^3 - 3t^2 + 1$: $g'(t) = 3t(t-2)$, $g$ đạt cực đại $g(0) = 1 \\gt 0$ và cực tiểu $g(2) = -3 \\lt 0$, $\\lim_{t \\to -\\infty} g(t) = -\\infty$ nên $g(t) = 0$ có ba nghiệm phân biệt $t_1 \\in (-1; 0)$, $t_2 \\in (0; 1)$, $t_3 \\in (2; 3)$. Với $f$, $f'(x) = 3x(x-2)$: cực đại $f(0) = 1$, cực tiểu $f(2) = -3$. Phương trình $f(x) = c$ có $3$ nghiệm phân biệt khi $-3 \\lt c \\lt 1$, $1$ nghiệm khi $c \\gt 1$. Vì $-3 \\lt t_1, t_2 \\lt 1$ nên $f(x) = t_1$ và $f(x) = t_2$ mỗi phương trình cho $3$ nghiệm phân biệt; $t_3 \\gt 1$ nên $f(x) = t_3$ cho $1$ nghiệm. Các họ nghiệm rời nhau (ứng với $t$ khác nhau). Tổng cộng $3 + 3 + 1 = 7$ nghiệm thực phân biệt.","points": 0.25},{"type": "truefalse","level": "VDC","q": "Cho hàm số $y = \\frac{x^2 + 2x + 3}{x + 1}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Đồ thị hàm số có tiệm cận xiên là đường thẳng $y = x + 1$.","b) Hàm số đạt cực đại tại $x = -1 + \\sqrt{2}$.","c) Giá trị cực tiểu của hàm số bằng $2\\sqrt{2}$.","d) Đồ thị hàm số cắt trục hoành tại đúng một điểm."],"answer": ["T","F","T","F"],"explain": "a) Đúng: chia đa thức được $y = x + 1 + \\frac{2}{x+1}$, và $\\frac{2}{x+1} \\to 0$ khi $x \\to \\pm\\infty$ nên $y = x + 1$ là tiệm cận xiên. b) Sai: $y' = 1 - \\frac{2}{(x+1)^2} = \\frac{(x+1)^2-2}{(x+1)^2}$; $y' = 0$ tại $x = -1 \\pm \\sqrt{2}$. Với $x$ hơi nhỏ hơn $-1+\\sqrt{2}$ (ví dụ $x = 0$) thì $y' = -1 \\lt 0$, với $x$ hơi lớn hơn thì $y' \\gt 0$, nên $x = -1+\\sqrt{2}$ là điểm cực tiểu (cực đại tại $x = -1-\\sqrt{2}$). c) Đúng: tại $x = -1+\\sqrt{2}$ thì $x + 1 = \\sqrt{2}$, $y = \\sqrt{2} + \\frac{2}{\\sqrt{2}} = 2\\sqrt{2}$. d) Sai: tử số $x^2+2x+3 = (x+1)^2+2 \\gt 0$ với mọi $x$ nên $y$ không bao giờ bằng $0$, đồ thị không cắt trục hoành.","points": 1},{"type": "truefalse","level": "VDC","q": "Cho $x, y$ là các số thực dương thỏa mãn $x + y = 1$. Đặt $P = x^3 + y^3 + 2xy$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Giá trị nhỏ nhất của $P$ bằng $\\frac{3}{4}$.","b) $P$ không có giá trị lớn nhất.","c) $P$ đạt giá trị nhỏ nhất khi $x = y$.","d) Với mọi $x, y$ thỏa mãn điều kiện thì $P \\ge 1$."],"answer": ["T","T","T","F"],"explain": "Hướng tư duy: rút gọn $P$ về một biến $t = xy$ rồi khảo sát trên miền giá trị của $t$, đặc biệt chú ý đầu mút có đạt được hay không. Ta có $x^3+y^3 = (x+y)^3-3xy(x+y) = 1-3xy$, nên $P = 1-xy$. Với $x+y = 1$, $x, y \\gt 0$ thì $0 \\lt xy \\le \\frac{1}{4}$ (bất đẳng thức AM-GM, dấu bằng khi $x = y = 1/2$). Do đó $\\frac{3}{4} \\le P \\lt 1$: giá trị nhỏ nhất $3/4$ đạt được tại $x = y = 1/2$ (a, c đúng); cận trên $1$ không bao giờ đạt được vì $xy \\gt 0$ (b đúng); khẳng định d sai vì $P \\lt 1$ (ví dụ $x = y = 1/2$ cho $P = 3/4$).","points": 1},{"type": "short","level": "VDC","q": "Có bao nhiêu giá trị nguyên của tham số $m$ để đồ thị hàm số $y = x^4 - 2mx^2 + m^2 - 1$ cắt trục hoành tại đúng $3$ điểm phân biệt?","answer": "1","explain": "Hướng tư duy: đặt ẩn phụ $t = x^2$ để đưa về phương trình bậc hai, rồi đếm số hoành độ $x$ tương ứng với mỗi $t$ (mỗi $t \\gt 0$ cho hai $x$ đối nhau, $t = 0$ cho một $x$). Viết lại $y = (x^2-m)^2-1$. Phương trình $(x^2-m)^2 = 1$ tương đương $x^2 = m+1$ hoặc $x^2 = m-1$. Để có đúng $3$ hoành độ phân biệt, một trong hai vế phải bằng $0$ (cho $x = 0$) và vế còn lại dương (cho hai $x$ đối nhau). Nếu $m + 1 = 0$ thì $m = -1$, khi đó $x^2 = -2$ vô nghiệm, chỉ còn $x = 0$ (1 điểm, loại). Nếu $m - 1 = 0$ thì $m = 1$, khi đó $x^2 = 2$ cho $x = \\pm\\sqrt{2}$ và $x^2 = 0$ cho $x = 0$, tổng $3$ điểm phân biệt (nhận). Hai vế không thể bằng nhau. Vậy chỉ có $m = 1$, tức $1$ giá trị.","points": 0.5},{"type": "short","level": "VDC","q": "Cho hàm số $y = x^3 - 3x + 1$. Có bao nhiêu giá trị nguyên của $m$ để phương trình $|x^3 - 3x + 1| = m$ có đúng $4$ nghiệm thực phân biệt?","answer": "1","explain": "Hướng tư duy: vẽ (trong đầu) đồ thị của $|f|$ từ đồ thị $f$: các cực trị nằm dưới trục hoành bị lật thành cực đại, các nghiệm đơn thành điểm gãy cực tiểu bằng $0$; sau đó cho đường thẳng $y = m$ quét từ dưới lên và đếm số giao điểm trên từng nhánh đơn điệu. Đặt $f(x) = x^3-3x+1$, $f'(x) = 3x^2-3$: $f$ đạt cực đại $f(-1) = 3$ và cực tiểu $f(1) = -1$; $f$ có ba nghiệm đơn $r_1 \\in (-2;-1)$, $r_2 \\in (0;1)$, $r_3 \\in (1;2)$. Đồ thị $|f|$ gồm các nhánh đơn điệu: $(-\\infty; r_1)$ giảm từ $+\\infty$ về $0$; $(r_1; -1)$ tăng từ $0$ lên $3$; $(-1; r_2)$ giảm từ $3$ về $0$; $(r_2; 1)$ tăng từ $0$ lên $1$; $(1; r_3)$ giảm từ $1$ về $0$; $(r_3; +\\infty)$ tăng từ $0$ lên $+\\infty$. Đếm giao điểm với $y = m$: với $1 \\lt m \\lt 3$ có đúng $4$ giao điểm (mỗi nhánh $(-\\infty;r_1)$, $(r_1;-1)$, $(-1;r_2)$, $(r_3;+\\infty)$ cho một nghiệm); với $m = 1$ có $5$ nghiệm (thêm điểm tiếp xúc $x = 1$); với $0 \\lt m \\lt 1$ có $6$ nghiệm; $m = 3$ có $3$ nghiệm; $m \\gt 3$ có $2$ nghiệm. Vậy đúng $4$ nghiệm khi $1 \\lt m \\lt 3$, số nguyên duy nhất là $m = 2$, tức $1$ giá trị.","points": 0.5}]}]}
</script>
