<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"answer":"Giọng điệu trầm lắng, suy tư, triết lí; phương thức biểu đạt chính là biểu cảm.","explain":"Giọng điệu chủ đạo: trầm lắng, suy tư — người viết chiêm nghiệm về đá để rút ra triết lí sống (không sôi nổi, không bi lụy). Phương thức biểu đạt chính: biểu cảm (bộc lộ cảm xúc, suy nghĩ của tác giả); có kết hợp tự sự (câu chuyện cụ già đẽo đá ở Non Nước) và miêu tả (hình ảnh hòn đá ven đường, pho tượng Phật) làm chất liệu. Chấp nhận cách diễn đạt tương đương.","level":"VDC","points":0.5,"q":"PHẦN I. ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi:\n\nĐÁ\n\nCó những buổi chiều, tôi ngồi nhìn những hòn đá ven đường và tự hỏi chúng đã ở đó bao lâu. Đá không kể chuyện. Đá chỉ im lặng, để mặc nắng mưa bào mòn từng mi-li-mét kiêu hãnh của mình, để mặc rêu phong phủ lên như một thứ áo choàng khiêm nhường.\n\nNgười ta bảo đá vô tri. Nhưng có lẽ, đá là bậc thầy của sự kiên nhẫn. Một dòng sông phải mất hàng nghìn năm mới mài được một hòn cuội tròn nhẵn; một cơn gió phải thổi suốt cả đời người mới khoét được một hang động. Đá không vội. Đá hiểu rằng mọi sự vội vàng đều thuộc về kẻ yếu bóng vía, còn thời gian — thứ vũ khí duy nhất của đá — thì vô hạn.\n\nTôi từng gặp một cụ già làm nghề đẽo đá ở làng Non Nước. Bàn tay cụ chai sần, mỗi nhát búa đều đặn như nhịp thở. Cụ bảo: “Đá cứng, nhưng lòng người bền hơn. Đẽo đá không phải để thắng đá, mà để học cách chờ đợi.” Mười năm, cụ mới tạc xong một pho tượng Phật. Khi pho tượng hoàn thành, cụ không reo mừng, chỉ lặng lẽ chắp tay vái ba vái rồi đi pha ấm trà.\n\nCó lẽ mỗi con người đều cần một “hòn đá” trong tâm hồn: một chỗ đứng vững chãi giữa dòng đời xô bồ, một sự im lặng đủ sâu để nghe được tiếng thời gian trôi. Đá không tranh giành ánh sáng với hoa, không ganh đua tốc độ với gió. Đá chỉ ở đó — hiện hữu một cách trọn vẹn, như một lời nhắc nhở rằng: cái gì vội vàng rồi cũng qua, chỉ có sự bền bỉ mới ở lại.\n\n(Người biên soạn)\n\nXác định giọng điệu chủ đạo của văn bản và cho biết phương thức biểu đạt chính được sử dụng.","type":"short"},{"answer":"Nhân hóa khiến đá mang phẩm chất của con người, làm nổi bật vẻ đẹp khiêm nhường, an nhiên của đá, qua đó gửi gắm triết lí sống không bon chen, biết đủ.","explain":"Tác dụng: (1) Nhân hóa (“không tranh giành”, “không ganh đua”)gán cho đá những hành động, phẩm chất của con người, khiến hình ảnh đá trở nên sinh động, có hồn. (2) Kết hợp liệt kê và đối lập cân xứng (“ánh sáng với hoa” — vẻ đẹp rực rỡ; “tốc độ với gió” — sự vội vã) tạo nhịp văn trầm đều, giàu nhạc tính. (3) Ý nghĩa triết lí: ca ngợi lối sống khiêm nhường, an nhiên, không bon chen hơn thua — một lựa chọn sống khôn ngoan giữa đời xô bồ. Chấp nhận cách diễn đạt tương đương.","level":"VDC","points":1.0,"q":"Phân tích tác dụng của biện pháp tu từ nhân hóa trong câu văn: “Đá không tranh giành ánh sáng với hoa, không ganh đua tốc độ với gió.”","type":"short"},{"explain":"GỢI Ý TRẢ LỜI — THANG ĐIỂM (1,0 điểm — giáo viên chấm tay). 1. Giải thích quan niệm (0,25 điểm): “thắng đá” là chinh phục, khuất phục tự nhiên bằng sức mạnh; “học cách chờ đợi” là tu dưỡng sự kiên nhẫn, tôn trọng quy luật, làm việc bền bỉ đều đặn. 2. Bày tỏ quan điểm cá nhân rõ ràng (0,25 điểm): đồng tình / không đồng tình / đồng tình có điều kiện — phải nhất quán. 3. Lí lẽ và dẫn chứng (0,5 điểm): nếu đồng tình — mọi thành tựu lớn (tạc tượng mười năm của cụ già, công trình khoa học, rèn một nghề) đều cần thời gian; vội vàng dễ cẩu thả, bỏ cuộc giữa chừng; liên hệ học tập, khởi nghiệp của người trẻ. Nếu phản biện — chờ đợi phải đi kèm hành động tích cực, không phải trì hoãn thụ động. Bài viết mạch lạc, có cảm xúc được cộng điểm trình bày.","level":"VDC","points":0,"q":"Anh/Chị có đồng tình với quan niệm của cụ già đẽo đá: “Đẽo đá không phải để thắng đá, mà để học cách chờ đợi” không? Vì sao? (Trình bày trong một đoạn văn ngắn.)","type":"essay"},{"explain":"GỢI Ý TRẢ LỜI — THANG ĐIỂM (1,5 điểm — giáo viên chấm tay). 1. Nêu bài học cốt lõi rút ra (0,5 điểm): sống chậm lại, rèn sự kiên nhẫn và bền bỉ; đừng đánh đổi chiều sâu lấy tốc độ; học cách “hiện hữu trọn vẹn” như đá. 2. Gắn với văn bản (0,5 điểm): hình ảnh đá im lặng chịu nắng mưa, cụ già mười năm tạc một pho tượng, triết lí “cái gì vội vàng rồi cũng qua, chỉ có sự bền bỉ mới ở lại”. 3. Liên hệ thời đại “sống nhanh” (0,5 điểm): văn hóa “mì ăn liền” — lướt nhanh tri thức, nóng vội thành công, hội chứng sợ bị bỏ lỡ; người trẻ cần dũng cảm đi chậm để đi xa. Đoạn văn khoảng 150 chữ, mạch lạc, có giọng văn riêng được cộng điểm trình bày.","level":"VDC","points":0,"q":"Từ văn bản “Đá”, anh/chị rút ra bài học gì cho lối sống của người trẻ trong thời đại “sống nhanh”? (Viết đoạn văn khoảng 150 chữ.)","type":"essay"},{"explain":"DÀN Ý CHI TIẾT (6,0 điểm — giáo viên chấm tay). I. Mở bài (0,5 điểm): giới thiệu nghịch lí thời đại — mọi thứ đều nhanh hơn, nhưng con người lại dễ nản lòng hơn; dẫn dắt đến vấn đề: sự kiên nhẫn đang trở nên hiếm. II. Thân bài (4,5 điểm): 1. Giải thích (0,75 điểm): kiên nhẫn là bền bỉ theo đuổi mục tiêu, chấp nhận chờ đợi; “thời đại tốc độ” là thời đại công nghệ rút ngắn mọi khoảng chờ. 2. Biểu hiện của sự thiếu kiên nhẫn (0,75 điểm): học tủ, lướt thay vì đọc sâu; muốn thành công sau một đêm; dễ bỏ cuộc khi gặp khó. 3. Nguyên nhân (0,75 điểm): công nghệ nuông chiều sự tức thì; văn hóa so sánh trên mạng xã hội; giáo dục nặng thành tích nhanh. 4. Hậu quả (0,75 điểm): tri thức hời hợt, dễ gãy đổ trước thất bại, đánh mất niềm vui của quá trình. 5. Phản đề (0,75 điểm): tốc độ cũng có giá trị; kiên nhẫn không đồng nghĩa trì trệ — cần phân biệt kiên nhẫn với cố chấp, nhanh với vội. 6. Bài học và liên hệ bản thân (0,75 điểm): rèn kiên nhẫn từ việc nhỏ (đọc hết một cuốn sách, theo đuổi một kỹ năng). III. Kết bài (1,0 điểm): khẳng định lại vấn đề, thông điệp. BÀI MẪU (đoạn thân bài mẫu): “Hãy nhìn cách một hạt mầm nảy mầm: nó không bao giờ vội. Nó chờ mưa, chờ nắng, âm thầm đâm rễ trong bóng tối rất lâu trước khi vươn lên khỏi mặt đất. Con người hiện đại thì ngược lại — chúng ta muốn thấy mầm xanh ngay sau khi gieo hạt, muốn thành thạo một ngoại ngữ sau ba tháng, muốn nổi tiếng sau một video. Sự thiếu kiên nhẫn ấy khiến tri thức của nhiều người trẻ giống như cây non thiếu rễ: xanh tốt bề ngoài nhưng đổ gãy trước cơn gió đầu tiên của đời. Kiên nhẫn, suy cho cùng, không phải là chậm chạp; đó là dũng cảm tin vào quá trình khi kết quả còn chưa hiện hình.” THANG ĐIỂM GỢI Ý: bố cục rõ 3 phần (1,0); luận điểm đầy đủ, có phản đề (2,5); lí lẽ + dẫn chứng thuyết phục, không sáo mòn (1,5); văn viết mạch lạc, có giọng riêng (1,0).","level":"VDC","points":0,"q":"PHẦN II. LÀM VĂN (16,0 điểm)\nNghị luận xã hội (6,0 điểm). Anh/Chị hãy viết bài văn nghị luận (khoảng 600 chữ) trình bày suy nghĩ về ý kiến: “Kiên nhẫn là phẩm chất đang dần trở nên hiếm trong thời đại tốc độ.”","type":"essay"},{"explain":"DÀN Ý CHI TIẾT (10,0 điểm — giáo viên chấm tay). I. Mở bài (1,0 điểm): giới thiệu ý kiến và tác phẩm “Chiếc thuyền ngoài xa” (Nguyễn Minh Châu) — truyện ngắn tiêu biểu cho hành trình nhận thức lại hiện thực và con người sau chiến tranh. II. Thân bài (7,0 điểm): 1. Giải thích ý kiến (1,0 điểm): “tô hồng hiện thực” là che giấu, lý tưởng hóa cái xấu, cái khổ; “tuyệt vọng về con người” là mất niềm tin vào điều thiện; văn học chân chính là dũng cảm nhìn thẳng sự thật mà vẫn giữ niềm tin. 2. “Không tô hồng hiện thực” trong tác phẩm (2,0 điểm): bức tranh cuộc sống hàng chài — cái đói, cái nghèo, bạo lực gia đình triền miên; nghệ thuật Phùng từng “vỡ mộng” khi phát hiện đằng sau vẻ đẹp toàn bích của chiếc thuyền là bi kịch; nhà văn không né tránh mảng tối. 3. “Không tuyệt vọng về con người” (2,0 điểm): vẻ đẹp khuất lấp của người đàn bà hàng chài — tình mẫu tử, đức hy sinh, sự thấu hiểu lẽ đời; tấm lòng của Phùng, Đẩu day dứt, trăn trở; niềm tin vào khả năng hướng thiện. 4. Nghệ thuật làm nên giá trị tư tưởng (1,0 điểm): tình huống nhận thức, điểm nhìn trần thuật, giọng văn trăn trở. 5. Đánh giá, mở rộng (1,0 điểm): ý kiến đúng với quy luật văn học chân chính; liên hệ sứ mệnh của người cầm bút hôm nay. III. Kết bài (1,0 điểm): khẳng định giá trị ý kiến và tác phẩm. BÀI MẪU (mở bài mẫu): “Có những tác phẩm khiến ta ngỡ ngàng vì vẻ đẹp, lại có những tác phẩm khiến ta day dứt vì sự thật. “Chiếc thuyền ngoài xa” thuộc về loại thứ hai — nó đẹp không phải vì che giấu hiện thực, mà vì dám nhìn thẳng vào hiện thực để rồi tìm thấy, giữa bùn lầy của cái khổ, những hạt ngọc lấp lánh của tình người. Đọc truyện, ta thấm thía chân lí mà ý kiến đã nêu: văn học chân chính không tô hồng hiện thực, nhưng cũng không bao giờ tuyệt vọng về con người.” THANG ĐIỂM GỢI Ý: bố cục 3 phần (1,0); giải thích đúng ý kiến (1,0); phân tích “không tô hồng” sâu, có dẫn chứng (2,5); phân tích “không tuyệt vọng” sâu, có dẫn chứng (2,5); đánh giá nghệ thuật + mở rộng (2,0); văn viết giàu cảm xúc, có chính kiến (1,0).","level":"VDC","points":0,"q":"Nghị luận văn học (10,0 điểm). Có ý kiến cho rằng: “Văn học chân chính không bao giờ tô hồng hiện thực, nhưng cũng không bao giờ tuyệt vọng về con người.” Bằng trải nghiệm đọc truyện ngắn “Chiếc thuyền ngoài xa” (Nguyễn Minh Châu), anh/chị hãy bình luận ý kiến trên.","type":"essay"}]}]}
