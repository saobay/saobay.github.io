<script type="applicatio<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 5", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một chi tiết dạng trục bậc có rãnh then dọc trên đoạn trục lớn. Để thể hiện rõ hình dạng và kích thước của rãnh then mà không làm rối bản vẽ, nên dùng:", "options": ["A. Mặt cắt chập -- vẽ trực tiếp trên hình chiếu của trục tại vị trí rãnh then.", "B. Hình cắt toàn bộ dọc theo trục của chi tiết.", "C. Hình chiếu thứ ba (hình chiếu cạnh) vẽ đầy đủ mọi đường nét.", "D. Mặt cắt rời đặt xa hình chiếu chính."], "answer": "A", "explain": "Rãnh then là chi tiết cục bộ trên trục; mặt cắt chập vẽ ngay tại vị trí cắt trên hình chiếu bằng nét liền mảnh, vừa thể hiện đúng hình dạng rãnh vừa gọn, không cần thêm hình biểu diễn riêng. Hình cắt toàn bộ dọc trục là thừa và gây rối; mặt cắt rời thường dùng khi cần ghi nhiều kích thước hoặc hình dạng mặt cắt phức tạp."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Vẽ hình chiếu trục đo xiên góc cân của một chi tiết hình hộp có kích thước $60 \\times 80 \\times 40mm$, trong đó cạnh $80mm$ đặt dọc theo trục $y$. Độ dài đoạn thẳng biểu diễn cạnh $80mm$ trên bản vẽ là:", "options": ["A. $40mm$.", "B. $80mm$.", "C. $60mm$.", "D. $20mm$."], "answer": "A", "explain": "Hình chiếu trục đo xiên góc cân có hệ số biến dạng $p = r = 1$, $q = 0.5$ (theo trục $y$). Cạnh đặt dọc trục $y$ dài $80mm$ được vẽ với độ dài $80 \\times 0.5 = 40mm$."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cần gia công một tấm đế hình hộp có rãnh chữ T trên mặt phẳng, sản lượng loạt vừa. Phương pháp gia công hợp lý nhất là:", "options": ["A. Phay -- dùng dao phay rãnh chữ T chuyên dụng, phù hợp mặt phẳng và rãnh trên chi tiết dạng hộp.", "B. Tiện -- vì tiện cho độ chính xác cao nhất.", "C. Khoan -- vì rãnh chữ T có thể tạo bằng nhiều lỗ khoan liền nhau.", "D. Mài -- vì mài cho độ bóng bề mặt tốt nhất."], "answer": "A", "explain": "Phay là phương pháp chủ yếu để gia công mặt phẳng, rãnh, bậc trên chi tiết dạng hộp; dao phay rãnh chữ T chuyên dụng tạo đúng biên dạng trong một lần gá. Tiện chỉ gia công được mặt tròn xoay; khoan không tạo được rãnh chữ T đúng hình dạng; mài là phương pháp gia công tinh, không dùng để bóc lượng dư lớn."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trong quy trình công nghệ gia công chi tiết máy, nguyên công nhiệt luyện (tôi, ram...) thường được bố trí sau gia công thô và trước gia công tinh. Lí do kĩ thuật là:", "options": ["A. Nhiệt luyện làm thay đổi cơ tính và gây biến dạng nhẹ; đặt trước gia công tinh để lượng dư gia công tinh khử được biến dạng đó.", "B. Nhiệt luyện giúp phoi dễ gãy hơn trong gia công thô.", "C. Nhiệt luyện làm chi tiết đẹp hơn trước khi kiểm tra.", "D. Đặt nhiệt luyện ở giữa để công nhân có thời gian nghỉ."], "answer": "A", "explain": "Tôi, ram làm tăng độ cứng, độ bền nhưng kèm theo biến dạng nhiệt và ứng suất dư. Nếu nhiệt luyện sau gia công tinh, biến dạng sẽ phá hỏng độ chính xác đã đạt được. Bố trí sau gia công thô: chi tiết còn lượng dư, nguyên công gia công tinh sau đó sẽ cắt bỏ lớp biến dạng, vừa đạt cơ tính yêu cầu vừa đạt độ chính xác kích thước."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cần chọn vật liệu chế tạo thân máy công cụ (yêu cầu: dễ đúc thành hình phức tạp, giảm chấn tốt khi máy rung, chịu nén tốt, giá thành thấp). Lựa chọn hợp lý nhất là:", "options": ["A. Gang xám -- tính đúc tốt, graphit dạng tấm có tác dụng giảm chấn, chịu nén tốt, giá rẻ.", "B. Thép cacbon cao -- vì cứng nhất trong các loại vật liệu.", "C. Hợp kim nhôm -- vì nhẹ nhất.", "D. Đồng thanh -- vì chống ăn mòn tốt nhất."], "answer": "A", "explain": "Thân máy cần đúc được hình dạng phức tạp: gang xám có tính đúc tốt nhất trong các phương án. Các tấm graphit trong gang xám hấp thụ rung động (giảm chấn) rất tốt -- đặc tính quý giá cho thân máy công cụ. Gang chịu nén tốt và giá thành rẻ. Thép khó đúc hình phức tạp, hợp kim nhôm đắt và kém cứng vững cho thân máy lớn, đồng thanh đắt và không cần thiết."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Khi vận hành máy tiện, quy tắc an toàn nào sau đây là quan trọng nhất và vì sao nhiều tai nạn nghiêm trọng liên quan đến nó?", "options": ["A. Không đeo găng tay khi vận hành -- găng tay có thể bị cuốn vào chi tiết đang quay, kéo tay người vào máy.", "B. Đứng về phía bên trái máy để quan sát tốt hơn.", "C. Mở nắp che chắn để dễ quan sát vùng cắt.", "D. Dùng tay không để gạt phoi đang quấn trên chi tiết."], "answer": "A", "explain": "Chi tiết quay với tốc độ cao; găng tay vải bị cuốn vào chi tiết hoặc mâm cặp sẽ siết chặt và kéo cả bàn tay vào vùng nguy hiểm trong tích tắc -- đây là nguyên nhân của nhiều vụ tai nạn cụt ngón, gãy tay trong xưởng cơ khí. Các phương án B, C, D đều là hành vi vi phạm quy tắc an toàn (phải đứng đúng vị trí quy định, đóng nắp che chắn, dùng móc chuyên dụng để gạt phoi)."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về bản vẽ kĩ thuật:", "statements": ["a) Hình chiếu đứng của vật thể thể hiện chiều dài và chiều cao của vật thể.", "b) Đường bao khuất của vật thể được vẽ bằng nét đứt mảnh.", "c) Mặt cắt chập được vẽ tách rời khỏi hình chiếu, đặt ở vị trí khác trên bản vẽ.", "d) Tỉ lệ $2:1$ là tỉ lệ phóng to (hình biểu diễn lớn gấp đôi vật thật)."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng theo quy định về các loại nét vẽ trong TCVN. c) Sai: mặt cắt chập vẽ ngay trên hình chiếu tại vị trí mặt cắt bằng nét liền mảnh; vẽ tách rời khỏi hình chiếu là mặt cắt rời. d) Đúng."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về gia công cơ khí và vật liệu:", "statements": ["a) Tiện là phương pháp chủ yếu để gia công các mặt tròn xoay ngoài, tròn xoay trong và mặt đầu.", "b) Phay không thể gia công được rãnh then trên trục.", "c) Gang có tính đúc tốt hơn thép nên thường dùng để đúc các chi tiết có hình dạng phức tạp.", "d) Nhiệt luyện làm thay đổi đáng kể hình dạng và kích thước của chi tiết."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: phay rãnh then bằng dao phay ngón hoặc dao phay đĩa là phương pháp phổ biến. c) Đúng: gang có nhiệt độ nóng chảy thấp hơn và độ chảy loãng tốt hơn thép. d) Sai: nhiệt luyện chủ yếu thay đổi cơ tính (độ cứng, độ bền, tính dẻo); biến dạng hình dạng nếu có là điều không mong muốn và phải hạn chế."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một chi tiết được vẽ với tỉ lệ $2:1$; trên bản vẽ đo được một đoạn thẳng dài $60mm$. Kích thước thật của đoạn thẳng đó trên chi tiết là bao nhiêu milimét?", "answer": "30", "explain": "Tỉ lệ $2:1$ là tỉ lệ phóng to gấp đôi, nên kích thước thật $= 60/2 = 30mm$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một mối ghép có độ hở gồm lỗ $\\varnothing 30H7$ ($ES = +21\\mu m$, $EI = 0$) và trục $\\varnothing 30g6$ ($es = -7\\mu m$, $ei = -20\\mu m$). Độ hở lớn nhất của mối ghép bằng bao nhiêu micrômét?", "answer": "41", "explain": "Độ hở lớn nhất $S_{max} = ES - ei = 21 - (-20) = 41\\mu m$ (trường hợp lỗ lớn nhất lắp với trục nhỏ nhất)."}]}]}
