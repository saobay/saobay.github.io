", "points": 0.5, "q": "Một động cơ 4 kỳ có 4 xi lanh, tốc độ quay $2400$ vòng/phút. Trong một phút, tổng số kỳ nổ của động cơ là bao nhiêu?", "answer": "4800", "explain": "Mỗi xi lanh thực hiện $2400/2 = 1200$ kỳ nổ mỗi phút (1 kỳ nổ sau 2 vòng quay). Với 4 xi lanh: $4 \\times 1200 = 4800$ kỳ nổ/phút."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một xi lanh có thể tích công tác $V_s = 400cm^3$, thể tích buồng cháy $V_c = 50cm^3$. Tỉ số nén của động cơ bằng bao nhiêu?", "answer": "9", "explain": "Tỉ số nén $\\varepsilon = (V_s + V_c)/V_c = (400 + 50)/50 = 450/50 = 9$."}]}]}
