<script type="applicatio<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một bóng LED trắng có điện áp định mức $3.2V$, dòng định mức $20mA$. Người ta mắc nối tiếp 3 LED như vậy vào nguồn một chiều $12V$ qua một điện trở hạn dòng $R$. Giá trị $R$ và công suất tỏa nhiệt trên $R$ gần đúng là:", "options": ["A. $R = 120\\Omega$, $P \\approx 0.05W$.", "B. $R = 240\\Omega$, $P \\approx 0.10W$.", "C. $R = 600\\Omega$, $P \\approx 0.24W$.", "D. $R = 120\\Omega$, $P \\approx 0.48W$."], "answer": "A", "explain": "Điện áp trên 3 LED: $3 \\times 3.2 = 9.6V$. Điện áp rơi trên $R$: $12 - 9.6 = 2.4V$. Suy ra $R = 2.4/0.02 = 120\\Omega$. Công suất tỏa nhiệt: $P = I^2R = 0.02^2 \\times 120 = 0.048W \\approx 0.05W$. Thực tế nên chọn điện trở có công suất danh định $0.25W$ để có hệ số an toàn."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cần thay một điện trở bị cháy ghi $1k\\Omega$ -- $1W$, nhưng trong hộp linh kiện chỉ còn các điện trở $2k\\Omega$ -- $0.5W$. Phương án thay thế đúng kĩ thuật là:", "options": ["A. Mắc nối tiếp hai điện trở $2k\\Omega$ -- $0.5W$.", "B. Mắc song song hai điện trở $2k\\Omega$ -- $0.5W$.", "C. Dùng một điện trở $2k\\Omega$ -- $0.5W$ duy nhất.", "D. Mắc song song bốn điện trở $2k\\Omega$ -- $0.5W$."], "answer": "B", "explain": "Hai điện trở $2k\\Omega$ mắc song song cho điện trở tương đương $1k\\Omega$ đúng trị số; dòng điện chia đều nên mỗi chiếc chỉ chịu một nửa công suất, tổng công suất chịu được $0.5 + 0.5 = 1W$ đáp ứng yêu cầu. Mắc nối tiếp cho $4k\\Omega$ là sai trị số; dùng một chiếc vừa sai trị số ($2k\\Omega$) vừa thiếu công suất ($0.5W$)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một bộ nguồn dùng mạch chỉnh lưu cầu, điện lưới $50Hz$, dòng tải $100mA$. Muốn điện áp gợn đỉnh-đỉnh sau tụ lọc không vượt quá $1V$ thì tụ lọc phải có điện dung tối thiểu khoảng:", "options": ["A. $100\\mu F$.", "B. $470\\mu F$.", "C. $1000\\mu F$.", "D. $2200\\mu F$."], "answer": "C", "explain": "Với chỉnh lưu toàn sóng, tần số gợn là $2 \\times 50 = 100Hz$. Gần đúng: $\\Delta V \\approx I/(2fC)$, suy ra $C \\ge I/(2f\\Delta V) = 0.1/(2 \\times 50 \\times 1) = 0.001F = 1000\\mu F$. Nếu dùng $470\\mu F$ thì gợn khoảng $2.1V$, vượt yêu cầu; $100\\mu F$ cho gợn khoảng $10V$."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cùng dùng một biến áp nguồn có điện áp hiệu dụng thứ cấp $12V$, so sánh điện áp ngược cực đại (PIV) đặt lên mỗi điôt giữa mạch chỉnh lưu cầu và mạch chỉnh lưu hai nửa chu kỳ dùng biến áp có điểm giữa (2 điôt). Kết luận đúng là:", "options": ["A. Mạch cầu: PIV $\\approx 17V$; mạch 2 điôt: PIV $\\approx 34V$, nên mạch cầu cho phép dùng điôt chịu áp thấp hơn.", "B. Mạch cầu: PIV $\\approx 34V$; mạch 2 điôt: PIV $\\approx 17V$, nên mạch 2 điôt dùng điôt chịu áp thấp hơn.", "C. Cả hai mạch đều có PIV $\\approx 17V$, không khác nhau.", "D. Mạch cầu: PIV $\\approx 12V$; mạch 2 điôt: PIV $\\approx 24V$."], "answer": "A", "explain": "Điện áp đỉnh thứ cấp $V_m = 12\\sqrt{2} \\approx 17V$. Mạch cầu: mỗi điôt chịu PIV $= V_m \\approx 17V$. Mạch 2 điôt (trung điểm): điôt không dẫn phải chịu toàn bộ điện áp đỉnh-đỉnh của cả cuộn thứ cấp, PIV $= 2V_m \\approx 34V$. Vì vậy với cùng một biến áp, mạch cầu dùng được điôt có điện áp ngược cho phép thấp hơn."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Thiết kế mạch tranzito NPN làm công tắc đóng cắt rơle: $V_{CC} = 9V$, hệ số khuếch đại dòng tối thiểu $\\beta_{min} = 100$, dòng colector cần đạt $I_C = 20mA$. Điện trở định thiên bazơ $R_B$ nên chọn giá trị chuẩn nào sau đây?", "options": ["A. $39k\\Omega$.", "B. $4.7k\\Omega$.", "C. $470k\\Omega$.", "D. $1M\\Omega$."], "answer": "A", "explain": "Dòng bazơ tối thiểu để bão hòa: $I_B = I_C/\\beta_{min} = 20/100 = 0.2mA$. Suy ra $R_B = (V_{CC} - V_{BE})/I_B = (9 - 0.7)/0.0002 = 41.5k\\Omega$. Chọn giá trị chuẩn $39k\\Omega$ (nhỏ hơn giá trị tính toán) để dòng bazơ thực tế $\\approx 0.21mA$ luôn đủ lớn, đảm bảo tranzito bão hòa, rơle hút chắc. $4.7k\\Omega$ cho $I_B \\approx 1.8mA$ quá lớn, lãng phí và có thể quá tải mạch điều khiển; $470k\\Omega$ và $1M\\Omega$ cho dòng bazơ quá nhỏ, tranzito không bão hòa được."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nguồn ổn áp dùng IC 7812 (điện áp rơi tối thiểu trên IC khoảng $2V$). Biến áp cho điện áp hiệu dụng thứ cấp $15V$, qua chỉnh lưu cầu và tụ lọc được điện áp một chiều khi không tải khoảng $19.8V$. Khi tải nặng, điện áp sau tụ lọc sụt xuống. Để 7812 vẫn giữ được $12V$ ổn định ở ngõ ra, điện áp gợn đỉnh-đỉnh cho phép tối đa khoảng:", "options": ["A. $2V$.", "B. $5.8V$.", "C. $7.8V$.", "D. $12V$."], "answer": "B", "explain": "Điện áp vào tối thiểu để 7812 còn ổn áp: $12 + 2 = 14V$. Điện áp trung bình sau lọc khi không tải $\\approx 15\\sqrt{2} - 1.4 \\approx 19.8V$ (trừ sụt áp trên 2 điôt dẫn). Khi có tải, đáy của điện áp gợn không được thấp hơn $14V$, nên gợn đỉnh-đỉnh tối đa $\\approx 19.8 - 14 = 5.8V$. Vượt quá ngưỡng này, IC thoát khỏi vùng ổn áp và điện áp ra sụt theo điện áp vào."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về bộ nguồn một chiều:", "statements": ["a) Tụ lọc mắc song song với tải có tác dụng san phẳng điện áp sau chỉnh lưu.", "b) Trong mạch chỉnh lưu cầu, mỗi nửa chu kỳ luôn có hai điôt đồng thời dẫn điện.", "c) IC ổn áp 7805 cho điện áp ra $5V$ ổn định với mọi giá trị điện áp một chiều đặt vào ngõ vào.", "d) Có thể dùng điôt Zener mắc song song với tải (qua điện trở hạn dòng) để tạo mạch ổn áp đơn giản."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: tụ nạp khi điện áp chỉnh lưu cao và phóng điện khi điện áp thấp, làm phẳng dạng sóng. b) Đúng: mỗi nửa chu kỳ một cặp điôt chéo nhau dẫn điện. c) Sai: 7805 cần điện áp vào tối thiểu khoảng $7V$ (điện áp rơi trên IC $\\approx 2V$); vào thấp hơn thì ngõ ra sụt theo. d) Đúng: Zener phân cực ngược giữ điện áp trên tải ổn định bằng điện áp đánh thủng của Zener."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về tranzito lưỡng cực:", "statements": ["a) Tranzito NPN bắt đầu dẫn khi tiếp giáp B--E được phân cực thuận (khoảng $0.7V$).", "b) Trong mạch khuếch đại tuyến tính, tranzito làm việc ở chế độ bão hòa.", "c) Hệ số khuếch đại dòng một chiều $\\beta = I_C/I_B$.", "d) Mạch colector chung có hệ số khuếch đại điện áp xấp xỉ $1$, chủ yếu dùng để khuếch đại dòng điện và phối hợp trở kháng."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: mạch khuếch đại tuyến tính cần tranzito làm việc ở chế độ khuếch đại (tích cực); chế độ bão hòa chỉ dùng cho mạch đóng cắt (switch). c) Đúng theo định nghĩa. d) Đúng: colector chung có $A_v \\approx 1$, trở kháng vào lớn, trở kháng ra nhỏ."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một tụ điện có điện dung $100\\mu F$ được nạp đến điện áp $50V$. Năng lượng điện trường tích trữ trong tụ bằng bao nhiêu jun (ghi số thập phân)?", "answer": "0.125", "explain": "Năng lượng tụ điện: $W = \\frac{1}{2}CU^2 = 0.5 \\times 100 \\times 10^{-6} \\times 50^2 = 0.5 \\times 10^{-4} \\times 2500 = 0.125J$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một điện trở 5 vạch màu có các vạch lần lượt: xanh lá, xanh dương, đen, nâu, nâu. Trị số danh định của điện trở là bao nhiêu kilôôm (ghi số thập phân)?", "answer": "5.6", "explain": "Ba chữ số đầu: xanh lá $= 5$, xanh dương $= 6$, đen $= 0$ thành $560$; hệ số nhân nâu $= 10^1$; sai số nâu $= \\pm 1\\%$. Trị số $= 560 \\times 10 = 5600\\Omega = 5.6k\\Omega$."}]}]}
