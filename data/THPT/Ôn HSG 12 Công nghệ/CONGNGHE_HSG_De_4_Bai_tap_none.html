9V$."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cần thiết kế mạch đa hài tự dao động đối xứng tạo xung vuông tần số khoảng $1kHz$, đã chọn tụ $C = 10nF$. Điện trở $R$ nên chọn giá trị chuẩn nào?", "options": ["A. $68k\\Omega$.", "B. $6.8k\\Omega$.", "C. $680k\\Omega$.", "D. $10k\\Omega$."], "answer": "A", "explain": "Chu kỳ xung đa hài đối xứng: $T \\approx 1.4RC$, suy ra $R = 1/(1.4fC) = 1/(1.4 \\times 1000 \\times 10 \\times 10^{-9}) \\approx 71.4k\\Omega$. Giá trị chuẩn gần nhất là $68k\\Omega$, cho tần số thực tế $f \\approx 1.05kHz$, sai số chấp nhận được."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một hệ thống báo cháy tự động gồm: cảm biến khói, mạch so sánh ngưỡng, mạch khuếch đại công suất, chuông báo. Khi cần thay đổi độ nhạy báo cháy (báo sớm hơn hoặc muộn hơn), khối chức năng nào cần được hiệu chỉnh?", "options": ["A. Mạch so sánh ngưỡng (điện áp chuẩn so sánh).", "B. Mạch khuếch đại công suất của chuông.", "C. Nguồn nuôi của toàn hệ thống.", "D. Vỏ hộp của cảm biến khói."], "answer": "A", "explain": "Độ nhạy báo cháy do ngưỡng so sánh quyết định: khi tín hiệu cảm biến vượt ngưỡng, mạch so sánh lật trạng thái và kích chuông báo. Hiệu chỉnh điện áp chuẩn (ngưỡng) sẽ thay đổi mức khói cần thiết để báo động. Các khối còn lại không quyết định thời điểm báo động."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hệ thống điều hòa nhiệt độ trong phòng dùng cảm biến nhiệt độ đưa tín hiệu về bộ điều khiển để so sánh với nhiệt độ đặt trước, rồi điều chỉnh máy nén. Hệ thống này thuộc loại điều khiển nào và ưu điểm nổi bật của nó là:", "options": ["A. Điều khiển vòng kín (có phản hồi) -- tự động bù sai lệch, giữ nhiệt độ ổn định dù điều kiện bên ngoài thay đổi.", "B. Điều khiển vòng hở -- cấu tạo đơn giản, giá thành rẻ.", "C. Điều khiển bằng tay -- người dùng chủ động hoàn toàn.", "D. Điều khiển vòng kín -- không cần cảm biến nên ít hỏng hóc."], "answer": "A", "explain": "Có tín hiệu phản hồi từ cảm biến về bộ điều khiển để so sánh với giá trị đặt là đặc trưng của điều khiển vòng kín. Ưu điểm: hệ thống tự hiệu chỉnh khi có nhiễu tác động (mở cửa, trời nóng lên...), độ chính xác cao hơn hẳn điều khiển vòng hở. Phương án D mâu thuẫn: vòng kín bắt buộc phải có cảm biến tạo tín hiệu phản hồi."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về khuếch đại thuật toán:", "statements": ["a) Khuếch đại thuật toán có hệ số khuếch đại vòng hở rất lớn (hàng chục nghìn đến hàng triệu lần).", "b) Trong mạch khuếch đại đảo, tín hiệu ra ngược pha với tín hiệu vào.", "c) Mạch lặp điện áp (voltage follower) có hệ số khuếch đại xấp xỉ $1$, thường dùng để phối hợp trở kháng giữa các tầng.", "d) Khuếch đại thuật toán chỉ khuếch đại được tín hiệu một chiều."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: $A_v = -R_{ht}/R_1$ mang dấu âm. c) Đúng: trở kháng vào lớn, trở kháng ra nhỏ, cách ly tốt giữa các tầng. d) Sai: khuếch đại thuật toán khuếch đại cả tín hiệu xoay chiều trong dải tần làm việc của nó."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về mạch tạo xung và mạch điều khiển:", "statements": ["a) Mạch đa hài tự dao động tạo ra xung vuông liên tục mà không cần tín hiệu kích từ bên ngoài.", "b) Chu kỳ của xung đa hài đối xứng tính gần đúng bằng $T \\approx 1.4RC$.", "c) Trigơ Schmitt có hai ngưỡng lật khác nhau nên chống được nhiễu khi tín hiệu vào thay đổi chậm.", "d) Hệ thống điều khiển vòng kín không sử dụng tín hiệu phản hồi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: mạch tự dao động qua lại giữa hai trạng thái không ổn định. b) Đúng theo công thức trong chương trình. c) Đúng: khoảng trễ giữa hai ngưỡng (hiện tượng trễ) loại bỏ việc lật trạng thái lung tung do nhiễu. d) Sai: tín hiệu phản hồi chính là đặc trưng phân biệt điều khiển vòng kín với vòng hở."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Mạch khuếch đại đảo dùng khuếch đại thuật toán có $R_1 =
