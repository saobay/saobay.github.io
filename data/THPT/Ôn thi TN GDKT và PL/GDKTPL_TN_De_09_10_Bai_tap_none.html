<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Việc làm được hiểu như thế nào?", "options": ["A. Là mọi hoạt động của con người trong cuộc sống.", "B. Là hoạt động lao động tạo ra thu nhập mà pháp luật không cấm.", "C. Là hoạt động từ thiện không nhận thù lao.", "D. Chỉ là công việc trong cơ quan nhà nước."], "answer": "B", "explain": "Theo Luật Việc làm 2013, việc làm là hoạt động lao động tạo ra thu nhập mà pháp luật không cấm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thất nghiệp được hiểu như thế nào?", "options": ["A. Là tình trạng người lao động nghỉ hưu.", "B. Là tình trạng học sinh chưa đi làm.", "C. Là tình trạng mọi người dân đều không có việc làm.", "D. Là tình trạng người trong độ tuổi lao động, có khả năng lao động nhưng không có việc làm."], "answer": "D", "explain": "Theo chương trình GDPT 2018, thất nghiệp là tình trạng người trong độ tuổi lao động, có khả năng lao động, có nhu cầu việc làm nhưng không có việc làm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giáo dục nghề nghiệp đào tạo các trình độ nào?", "options": ["A. Không đào tạo trình độ nào, chỉ dạy nghề truyền thống.", "B. Chỉ đào tạo trình độ đại học.", "C. Chỉ đào tạo trình độ thạc sĩ, tiến sĩ.", "D. Trình độ sơ cấp, trình độ trung cấp và trình độ cao đẳng."], "answer": "D", "explain": "Theo Luật Giáo dục nghề nghiệp 2014, giáo dục nghề nghiệp đào tạo trình độ sơ cấp, trình độ trung cấp và trình độ cao đẳng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng phải đáp ứng điều kiện nào?", "options": ["A. Chỉ cần có hộ chiếu là đi được, không cần hợp đồng.", "B. Không cần điều kiện gì.", "C. Đi qua doanh nghiệp, tổ chức được cấp phép; ký hợp đồng với doanh nghiệp dịch vụ; có đủ sức khỏe, năng lực hành vi theo quy định.", "D. Tự ý đi theo đường dây không phép cũng được."], "answer": "C", "explain": "Theo Luật Người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng 2020, người lao động phải đi qua doanh nghiệp, đơn vị sự nghiệp được cấp phép, ký hợp đồng và đáp ứng các điều kiện về sức khỏe, năng lực theo quy định.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, Quốc hội quyết định trưng cầu ý dân về vấn đề nào?", "options": ["A. Về những vấn đề quan trọng của đất nước theo quy định của Luật Trưng cầu ý dân.", "B. Chỉ trưng cầu ý dân về giá cả hàng hóa.", "C. Quốc hội không có quyền quyết định trưng cầu ý dân.", "D. Về mọi vấn đề trong cuộc sống hằng ngày."], "answer": "A", "explain": "Điều 29 Hiến pháp 2013 và Luật Trưng cầu ý dân 2015: Quốc hội quyết định trưng cầu ý dân về những vấn đề quan trọng của đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Trưng cầu ý dân năm 2015, công dân từ đủ bao nhiêu tuổi trở lên có quyền bỏ phiếu quyết định khi Nhà nước tổ chức trưng cầu ý dân?", "options": ["A. Từ đủ 21 tuổi trở lên.", "B. Từ đủ 18 tuổi trở lên.", "C. Từ đủ 16 tuổi trở lên.", "D. Từ đủ 20 tuổi trở lên."], "answer": "B", "explain": "Luật Trưng cầu ý dân 2015: công dân nước Cộng hòa xã hội chủ nghĩa Việt Nam đủ 18 tuổi trở lên có quyền bỏ phiếu khi Nhà nước tổ chức trưng cầu ý dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đại biểu Quốc hội, đại biểu Hội đồng nhân dân có trách nhiệm gì đối với cử tri?", "options": ["A. Liên hệ chặt chẽ với cử tri, chịu sự giám sát của cử tri; thu thập và phản ánh trung thực ý kiến, nguyện vọng của cử tri.", "B. Không cần liên hệ với cử tri sau khi trúng cử.", "C. Chỉ liên hệ với cử tri khi vận động bầu cử.", "D. Có quyền phớt lờ ý kiến của cử tri."], "answer": "A", "explain": "Theo Luật Tổ chức Quốc hội 2014 và Luật Tổ chức chính quyền địa phương 2015, đại biểu dân cử phải liên hệ chặt chẽ với cử tri, chịu sự giám sát của cử tri, thu thập và phản ánh trung thực ý kiến, nguyện vọng của cử tri.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân dân thực hiện quyền giám sát đối với hoạt động của cơ quan nhà nước thông qua hình thức nào?", "options": ["A. Thông qua Mặt trận Tổ quốc, các tổ chức chính trị xã hội, khiếu nại, tố cáo, kiến nghị và giám sát trực tiếp.", "B. Chỉ giám sát khi được cơ quan nhà nước cho phép.", "C. Nhân dân không có quyền giám sát.", "D. Chỉ giám sát qua báo chí nước ngoài."], "answer": "A", "explain": "Hiến pháp 2013 và các luật liên quan quy định nhân dân thực hiện quyền giám sát đối với cơ quan nhà nước thông qua Mặt trận Tổ quốc, các tổ chức chính trị xã hội, quyền khiếu nại, tố cáo, kiến nghị và các hình thức giám sát trực tiếp khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Trật tự, an toàn giao thông đường bộ năm 2024, người điều khiển xe cơ giới tham gia giao thông phải có gì?", "options": ["A. Không cần giấy tờ gì.", "B. Chỉ cần biết lái xe là đủ.", "C. Giấy phép lái xe phù hợp với loại xe đang điều khiển.", "D. Chỉ cần chứng minh nhân dân."], "answer": "C", "explain": "Luật Trật tự, an toàn giao thông đường bộ 2024: người điều khiển xe cơ giới tham gia giao thông đường bộ phải có giấy phép lái xe phù hợp với loại xe đang điều khiển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Trật tự, an toàn giao thông đường bộ năm 2024, quy định về nồng độ cồn đối với người điều khiển phương tiện tham gia giao thông như thế nào?", "options": ["A. Chỉ cấm vào ban đêm.", "B. Được phép uống rượu bia khi lái xe nếu thấy tỉnh táo.", "C. Nghiêm cấm điều khiển phương tiện tham gia giao thông mà trong máu hoặc hơi thở có nồng độ cồn.", "D. Chỉ cấm uống rượu khi lái xe ô tô, xe máy được uống."], "answer": "C", "explain": "Luật Trật tự, an toàn giao thông đường bộ 2024 quy định nghiêm cấm điều khiển phương tiện tham gia giao thông đường bộ mà trong máu hoặc hơi thở có nồng độ cồn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bảo hiểm trách nhiệm dân sự bắt buộc của chủ xe cơ giới có ý nghĩa gì?", "options": ["A. Là khoản thuế của chủ xe.", "B. Bảo đảm chi trả bồi thường cho người bị tai nạn do xe cơ giới gây ra, bảo vệ quyền lợi của người bị thiệt hại.", "C. Không có ý nghĩa gì.", "D. Bảo hiểm cho xe bị hỏng hóc do sử dụng lâu ngày."], "answer": "B", "explain": "Theo quy định của pháp luật về kinh doanh bảo hiểm, chủ xe cơ giới phải mua bảo hiểm trách nhiệm dân sự bắt buộc nhằm bảo đảm khả năng chi trả bồi thường cho người bị thiệt hại do xe cơ giới gây ra.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trợ cấp thôi việc được chi trả trong trường hợp nào?", "options": ["A. Khi người lao động đơn phương chấm dứt hợp đồng trái pháp luật.", "B. Khi người lao động bị sa thải do vi phạm kỷ luật.", "C. Khi người lao động đã làm việc thường xuyên cho người sử dụng lao động từ đủ 12 tháng trở lên mà chấm dứt hợp đồng lao động theo quy định.", "D. Khi người lao động mới làm việc 1 tháng."], "answer": "C", "explain": "Điều 46 Bộ luật Lao động 2019: khi hợp đồng lao động chấm dứt theo quy định và người lao động đã làm việc thường xuyên từ đủ 12 tháng trở lên thì người sử dụng lao động có trách nhiệm chi trả trợ cấp thôi việc, trừ trường hợp đủ điều kiện hưởng lương hưu và trường hợp bị sa thải.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Anh T đăng ký đi làm việc tại Nhật Bản theo hợp đồng qua doanh nghiệp được cấp phép đưa người lao động đi làm việc ở nước ngoài. Theo quy định của pháp luật, doanh nghiệp dịch vụ phải đáp ứng điều kiện gì?", "options": ["A. Chỉ cần có trụ sở là hoạt động được.", "B. Chỉ cần quen biết với đối tác nước ngoài.", "C. Không cần giấy phép gì.", "D. Được cơ quan nhà nước có thẩm quyền cấp giấy phép hoạt động dịch vụ đưa người lao động đi làm việc ở nước ngoài."], "answer": "D", "explain": "Luật Người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng 2020: doanh nghiệp hoạt động dịch vụ đưa người lao động đi làm việc ở nước ngoài phải được cấp giấy phép và đáp ứng các điều kiện theo quy định.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Anh T đăng ký đi làm việc tại Nhật Bản theo hợp đồng thông qua một doanh nghiệp được cấp phép. Một công ty môi giới khác yêu cầu anh T nộp 100 triệu đồng tiền phí rồi bỏ trốn. Hành vi của công ty môi giới này như thế nào?", "options": ["A. Chỉ vi phạm đạo đức kinh doanh.", "B. Là hoạt động môi giới bình thường.", "C. Có dấu hiệu tội lừa đảo chiếm đoạt tài sản; người bị hại cần trình báo cơ quan công an.", "D. Người lao động tự chịu, không được trình báo."], "answer": "C", "explain": "Hành vi dùng thủ đoạn gian dối để chiếm đoạt tiền của người lao động có dấu hiệu tội lừa đảo chiếm đoạt tài sản (Điều 174 Bộ luật Hình sự 2015). Người bị hại cần trình báo cơ quan công an để được bảo vệ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn H tốt nghiệp trung học phổ thông nhưng không đỗ đại học. Bạn quyết định học nghề sửa chữa ô tô tại một trường cao đẳng nghề. Lựa chọn của bạn H được đánh giá như thế nào?", "options": ["A. Chỉ có học đại học mới có tương lai.", "B. Học nghề là vi phạm pháp luật.", "C. Là lựa chọn thất bại vì không vào được đại học.", "D. Là lựa chọn phù hợp: học nghề giúp có tay nghề, sớm có việc làm và thu nhập ổn định; Nhà nước khuyến khích phân luồng học sinh sau trung học."], "answer": "D", "explain": "Giáo dục nghề nghiệp là một hướng đi phù hợp sau trung học phổ thông, giúp người học có tay nghề, sớm tham gia thị trường lao động. Nhà nước có chính sách phân luồng, khuyến khích học sinh học nghề.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Đại biểu Hội đồng nhân dân tỉnh tổ chức tiếp xúc cử tri tại xã để lắng nghe ý kiến người dân. Việc tiếp xúc cử tri thể hiện nội dung nào?", "options": ["A. Là hoạt động vận động tranh cử.", "B. Thực hiện quyền dân chủ của nhân dân và trách nhiệm của đại biểu dân cử trước cử tri.", "C. Không có ý nghĩa gì.", "D. Là hình thức để đại biểu ra lệnh cho cử tri."], "answer": "B", "explain": "Tiếp xúc cử tri là hình thức thực hiện quyền dân chủ trực tiếp của nhân dân và là trách nhiệm của đại biểu dân cử: lắng nghe, thu thập ý kiến, nguyện vọng của cử tri để phản ánh với cơ quan có thẩm quyền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Đại biểu Hội đồng nhân dân tỉnh tổ chức tiếp xúc cử tri tại xã để lắng nghe ý kiến người dân. Tại buổi tiếp xúc, cử tri có quyền gì?", "options": ["A. Không có quyền gì, chỉ đến nghe.", "B. Quyền bãi nhiệm đại biểu ngay tại buổi tiếp xúc.", "C. Quyền kiến nghị, phản ánh ý kiến, nguyện vọng của mình và yêu cầu đại biểu trả lời, giải quyết.", "D. Quyền ra lệnh cho đại biểu."], "answer": "C", "explain": "Cử tri có quyền kiến nghị với đại biểu về những vấn đề mình quan tâm; đại biểu có trách nhiệm thu thập, phản ánh trung thực ý kiến của cử tri với cơ quan có thẩm quyền và báo cáo kết quả giải quyết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Anh D điều khiển xe ô tô sau khi đã uống rượu bia và gây tai nạn làm một người bị thương nặng. Theo quy định của pháp luật, anh D bị xử lý như thế nào?", "options": ["A. Không bị xử lý vì đã uống ít.", "B. Chỉ bị nhắc nhở.", "C. Bị xử phạt vi phạm hành chính nặng về nồng độ cồn; nếu gây hậu quả nghiêm trọng thì bị truy cứu trách nhiệm hình sự.", "D. Được miễn trách nhiệm vì không cố ý."], "answer": "C", "explain": "Điều khiển phương tiện khi có nồng độ cồn bị xử phạt vi phạm hành chính rất nặng (tước giấy phép lái xe, phạt tiền cao theo Nghị định 168/2024/NĐ-CP); gây tai nạn nghiêm trọng thì bị truy cứu trách nhiệm hình sự về tội vi phạm quy định về tham gia giao thông đường bộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chủ xe mô tô không mua bảo hiểm trách nhiệm dân sự bắt buộc của chủ xe cơ giới thì bị xử lý như thế nào?", "options": ["A. Bị xử phạt vi phạm hành chính theo quy định về trật tự, an toàn giao thông đường bộ.", "B. Được miễn vì xe có giá trị thấp.", "C. Chỉ bị xử lý khi gây tai nạn.", "D. Không bị xử lý vì bảo hiểm là tự nguyện."], "answer": "A", "explain": "Bảo hiểm trách nhiệm dân sự của chủ xe cơ giới là bảo hiểm bắt buộc. Chủ xe không mua bảo hiểm bắt buộc bị xử phạt vi phạm hành chính theo Nghị định 168/2024/NĐ-CP.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chị M làm việc tại công ty 5 năm thì công ty chấm dứt hợp đồng lao động do thu hẹp sản xuất, có báo trước đúng quy định và chốt sổ bảo hiểm đầy đủ. Theo Bộ luật Lao động năm 2019, chị M được hưởng quyền lợi nào?", "options": ["A. Được hưởng trợ cấp thôi việc: mỗi năm làm việc được trợ cấp một nửa tháng tiền lương.", "B. Chỉ được nhận lương tháng cuối cùng.", "C. Được hưởng lương hưu ngay.", "D. Không được hưởng gì."], "answer": "A", "explain": "Điều 46 Bộ luật Lao động 2019: người lao động đã làm việc thường xuyên từ đủ 12 tháng trở lên khi chấm dứt hợp đồng lao động được hưởng trợ cấp thôi việc, mỗi năm làm việc được trợ cấp một nửa tháng tiền lương.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh K đi làm việc tại Hàn Quốc theo hợp đồng nhưng bị chủ sử dụng lao động ngược đãi, thu giữ hộ chiếu và không trả lương. Theo quy định của pháp luật, anh K được bảo vệ như thế nào?", "options": ["A. Chỉ có thể bỏ trốn về nước.", "B. Phải tự chịu đựng vì đã ký hợp đồng.", "C. Không ai bảo vệ được vì ở nước ngoài.", "D. Được cơ quan đại diện Việt Nam ở nước ngoài bảo hộ; được yêu cầu doanh nghiệp dịch vụ và cơ quan chức năng can thiệp, bảo vệ quyền lợi."], "answer": "D", "explain": "Luật Người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng 2020: người lao động được cơ quan đại diện Việt Nam ở nước ngoài bảo hộ; doanh nghiệp dịch vụ có trách nhiệm bảo vệ quyền, lợi ích hợp pháp của người lao động trong thời gian làm việc ở nước ngoài.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Công ty Y sa thải hàng loạt 30 công nhân không báo trước, không trả trợ cấp thôi việc với lý do khó khăn. Theo Bộ luật Lao động năm 2019, nhận định nào sau đây là đúng?", "options": ["A. Chỉ vi phạm khi công nhân biểu tình.", "B. Công ty vi phạm vì phải báo trước, phải trả trợ cấp thôi việc cho người lao động đủ điều kiện; người lao động có quyền khiếu nại, khởi kiện.", "C. Công ty làm đúng vì khó khăn thì được sa thải tùy ý.", "D. Người lao động không có quyền gì."], "answer": "B", "explain": "Bộ luật Lao động 2019 quy định chặt chẽ về trình tự chấm dứt hợp đồng lao động, nghĩa vụ báo trước và chi trả trợ cấp thôi việc. Vi phạm thì người lao động có quyền khiếu nại, khởi kiện để bảo vệ quyền lợi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nhóm thanh niên tổ chức đua xe mô tô trái phép trên quốc lộ vào ban đêm, có hàng trăm người tụ tập cổ vũ, gây mất an toàn giao thông. Theo Bộ luật Hình sự năm 2015, hành vi này bị xử lý như thế nào?", "options": ["A. Người cổ vũ không vi phạm pháp luật.", "B. Chỉ là trò vui của tuổi trẻ, không vi phạm.", "C. Chỉ bị xử phạt vi phạm hành chính trong mọi trường hợp.", "D. Người tổ chức đua xe trái phép có thể bị truy cứu trách nhiệm hình sự về tội tổ chức đua xe trái phép; người đua xe có thể phạm tội đua xe trái phép."], "answer": "D", "explain": "Điều 265 và Điều 266 Bộ luật Hình sự 2015 quy định tội đua xe trái phép và tội tổ chức đua xe trái phép. Người cổ vũ, gây rối trật tự công cộng cũng bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự tùy mức độ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Công ty X khi tuyển dụng yêu cầu người lao động phải nộp 10 triệu đồng tiền cọc chống bỏ việc và nộp bản chính bằng tốt nghiệp để công ty giữ. Theo Bộ luật Lao động năm 2019, nhận định nào sau đây là đúng?", "options": ["A. Công ty làm đúng để đảm bảo người lao động gắn bó.", "B. Người lao động tự nguyện thì công ty được phép.", "C. Công ty vi phạm vì người sử dụng lao động không được yêu cầu người lao động nộp tiền, giữ bản chính giấy tờ tùy thân, văn bằng, chứng chỉ khi giao kết, thực hiện hợp đồng lao động.", "D. Chỉ vi phạm khi thu tiền cọc trên 50 triệu đồng."], "answer": "C", "explain": "Điều 17 Bộ luật Lao động 2019 nghiêm cấm người sử dụng lao động yêu cầu người lao động phải thực hiện biện pháp bảo đảm bằng tiền hoặc tài sản khác cho việc thực hiện hợp đồng lao động; giữ bản chính giấy tờ tùy thân, văn bằng, chứng chỉ của người lao động khi giao kết, thực hiện hợp đồng lao động.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Anh P đăng ký đi làm việc tại Đài Loan (Trung Quốc) theo hợp đồng thông qua doanh nghiệp được cấp phép. Trước khi đi, anh P được tập huấn về pháp luật, phong tục nước đến. Xét tính đúng, sai của các nhận định:", "statements": ["a) Người lao động đi làm việc ở nước ngoài phải ký hợp đồng và đi qua doanh nghiệp, tổ chức được cấp phép.", "b) Doanh nghiệp dịch vụ phải được cơ quan nhà nước có thẩm quyền cấp giấy phép hoạt động.", "c) Doanh nghiệp được thu tiền cọc chống trốn của người lao động với mức tùy ý.", "d) Người lao động ở nước ngoài được cơ quan đại diện Việt Nam bảo hộ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: phải đi theo hợp đồng qua doanh nghiệp, tổ chức được cấp phép. b) Đúng: doanh nghiệp dịch vụ phải được cấp giấy phép hoạt động. c) Sai: pháp luật quy định chặt chẽ về các khoản phí, nghiêm cấm lạm thu; không được thu tiền cọc tùy ý. d) Đúng: cơ quan đại diện Việt Nam ở nước ngoài có trách nhiệm bảo hộ công dân.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Trên đường đi học về, H chứng kiến một vụ tai nạn do người lái xe ô tô uống rượu bia gây ra. H muốn tìm hiểu quy định của pháp luật về vấn đề này. Xét tính đúng, sai của các nhận định:", "statements": ["a) Pháp luật nghiêm cấm điều khiển phương tiện tham gia giao thông mà trong máu hoặc hơi thở có nồng độ cồn.", "b) Người điều khiển xe cơ giới phải có giấy phép lái xe phù hợp với loại xe đang điều khiển.", "c) Uống một hai ly bia vẫn được lái xe nếu cảm thấy tỉnh táo.", "d) Chủ xe cơ giới phải mua bảo hiểm trách nhiệm dân sự bắt buộc."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Luật Trật tự, an toàn giao thông đường bộ 2024 nghiêm cấm tuyệt đối. b) Đúng: phải có giấy phép lái xe phù hợp. c) Sai: chỉ cần có nồng độ cồn là vi phạm, không phụ thuộc cảm giác tỉnh táo. d) Đúng: bảo hiểm trách nhiệm dân sự của chủ xe cơ giới là bắt buộc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Tình huống: Chị S làm việc tại công ty được 4 năm thì bị công ty đơn phương chấm dứt hợp đồng lao động không đúng quy định, không trả trợ cấp thôi việc. Chị S khiếu nại nhưng công ty không giải quyết. Xét tính đúng, sai của các nhận định:", "statements": ["a) Người lao động làm việc thường xuyên từ đủ 12 tháng trở lên khi chấm dứt hợp đồng lao động theo quy định được hưởng trợ cấp thôi việc.", "b) Mức trợ cấp thôi việc là mỗi năm làm việc được trợ cấp một nửa tháng tiền lương.", "c) Người lao động bị sa thải do vi phạm kỷ luật lao động vẫn được hưởng trợ cấp thôi việc.", "d) Khi quyền lợi bị xâm phạm, người lao động có quyền khiếu nại, khởi kiện ra Tòa án để được bảo vệ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Điều 46 Bộ luật Lao động 2019. b) Đúng: mức trợ cấp thôi việc mỗi năm làm việc bằng một nửa tháng tiền lương. c) Sai: trường hợp người lao động bị sa thải thì không được hưởng trợ cấp thôi việc. d) Đúng: người lao động có quyền khiếu nại, khởi kiện khi quyền, lợi ích hợp pháp bị xâm phạm.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: Cuối tuần, một nhóm thanh niên tụ tập đua xe mô tô trái phép trên tuyến đường mới mở, có nhiều người dân đứng hai bên đường cổ vũ, hò reo. Lực lượng công an đã kịp thời ngăn chặn. Xét tính đúng, sai của các nhận định:", "statements": ["a) Hành vi đua xe mô tô trái phép là vi phạm pháp luật.", "b) Người cổ vũ, tụ tập xem đua xe trái phép không vi phạm pháp luật.", "c) Người tổ chức đua xe trái phép có thể bị truy cứu trách nhiệm hình sự.", "d) Nếu đua xe trái phép gây chết người thì người đua xe có thể bị truy cứu trách nhiệm hình sự với khung hình phạt nghiêm khắc hơn."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: đua xe trái phép là hành vi bị pháp luật nghiêm cấm. b) Sai: người cổ vũ đua xe trái phép, gây rối trật tự công cộng bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự. c) Đúng: Điều 266 Bộ luật Hình sự 2015 quy định tội tổ chức đua xe trái phép. d) Đúng: đua xe trái phép gây hậu quả chết người bị truy cứu trách nhiệm hình sự với khung hình phạt tăng nặng (Điều 265).", "points": 1}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Hiến pháp được hiểu như thế nào trong hệ thống pháp luật Việt Nam?", "options": ["A. Là nội quy của một cơ quan nhà nước.", "B. Là đạo luật cơ bản của Nhà nước, có hiệu lực pháp lý cao nhất; mọi văn bản pháp luật khác phải phù hợp với Hiến pháp.", "C. Là văn bản dưới luật do Chính phủ ban hành.", "D. Có giá trị pháp lý ngang với các luật khác."], "answer": "B", "explain": "Theo chương trình GDPT 2018, Hiến pháp là đạo luật cơ bản của Nhà nước, có hiệu lực pháp lý cao nhất trong hệ thống pháp luật Việt Nam; mọi văn bản pháp luật khác đều phải phù hợp với Hiến pháp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, trong nền kinh tế quốc dân, kinh tế nhà nước giữ vai trò gì?", "options": ["A. Giữ vai trò duy nhất.", "B. Giữ vai trò chủ đạo.", "C. Không có vai trò gì.", "D. Chỉ hoạt động trong lĩnh vực dịch vụ."], "answer": "B", "explain": "Điều 51 Hiến pháp 2013: kinh tế nhà nước giữ vai trò chủ đạo trong nền kinh tế quốc dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo quan điểm của Đảng và Nhà nước ta hiện nay, kinh tế tư nhân có vị trí như thế nào?", "options": ["A. Chỉ được hoạt động trong lĩnh vực nông nghiệp.", "B. Cần từng bước xóa bỏ.", "C. Là một động lực quan trọng của nền kinh tế.", "D. Không được khuyến khích phát triển."], "answer": "C", "explain": "Nghị quyết 10-NQ/TW của Đảng xác định kinh tế tư nhân là một động lực quan trọng của nền kinh tế thị trường định hướng xã hội chủ nghĩa; Nhà nước khuyến khích, tạo điều kiện cho kinh tế tư nhân phát triển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hợp tác xã là tổ chức như thế nào?", "options": ["A. Là doanh nghiệp do Nhà nước làm chủ.", "B. Là cơ quan quản lý nhà nước về kinh tế.", "C. Là tổ chức từ thiện không vì mục đích kinh tế.", "D. Là tổ chức kinh tế tập thể do các thành viên tự nguyện góp vốn, góp sức, cùng hưởng lợi và cùng chịu trách nhiệm."], "answer": "D", "explain": "Theo Luật Hợp tác xã 2023, hợp tác xã là tổ chức kinh tế tập thể do các thành viên tự nguyện góp vốn, góp sức, cùng hưởng lợi, cùng chịu trách nhiệm trong hoạt động sản xuất, kinh doanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, phát triển giáo dục được xác định như thế nào?", "options": ["A. Là nhiệm vụ của riêng ngành giáo dục.", "B. Chỉ quan trọng ở bậc đại học.", "C. Là quốc sách hàng đầu.", "D. Không phải là ưu tiên của Nhà nước."], "answer": "C", "explain": "Điều 61 Hiến pháp 2013: phát triển giáo dục là quốc sách hàng đầu nhằm nâng cao dân trí, phát triển nguồn nhân lực, bồi dưỡng nhân tài.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, phát triển khoa học và công nghệ được xác định như thế nào?", "options": ["A. Chỉ do tư nhân đầu tư.", "B. Không được Nhà nước quan tâm.", "C. Là quốc sách hàng đầu, giữ vai trò then chốt trong sự nghiệp phát triển kinh tế xã hội của đất nước.", "D. Chỉ quan trọng trong lĩnh vực quân sự."], "answer": "C", "explain": "Điều 62 Hiến pháp 2013: phát triển khoa học và công nghệ là quốc sách hàng đầu, giữ vai trò then chốt trong sự nghiệp phát triển kinh tế xã hội của đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, Chủ tịch nước là ai?", "options": ["A. Là người đứng đầu Tòa án nhân dân tối cao.", "B. Là người đứng đầu Chính phủ.", "C. Là người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.", "D. Là người đứng đầu Quốc hội."], "answer": "C", "explain": "Điều 86 Hiến pháp 2013: Chủ tịch nước là người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, Hội đồng nhân dân là cơ quan nào?", "options": ["A. Là cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân địa phương.", "B. Là tổ chức chính trị xã hội.", "C. Là cơ quan hành chính nhà nước ở địa phương.", "D. Là cơ quan xét xử ở địa phương."], "answer": "A", "explain": "Điều 113 Hiến pháp 2013: Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân, do Nhân dân địa phương bầu ra.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, Ủy ban nhân dân là cơ quan nào?", "options": ["A. Là cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương.", "B. Là cơ quan xét xử ở địa phương.", "C. Là tổ chức đoàn thể.", "D. Là cơ quan quyền lực nhà nước ở địa phương."], "answer": "A", "explain": "Điều 114 Hiến pháp 2013: Ủy ban nhân dân là cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương, chịu trách nhiệm trước Hội đồng nhân dân và cơ quan hành chính nhà nước cấp trên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, Mặt trận Tổ quốc Việt Nam là tổ chức nào?", "options": ["A. Là cơ quan hành chính nhà nước.", "B. Là cơ quan quyền lực nhà nước cao nhất.", "C. Là tổ chức liên minh chính trị, liên hiệp tự nguyện của tổ chức chính trị, các tổ chức chính trị xã hội, tổ chức xã hội và các cá nhân tiêu biểu.", "D. Là tổ chức kinh tế."], "answer": "C", "explain": "Điều 9 Hiến pháp 2013: Mặt trận Tổ quốc Việt Nam là tổ chức liên minh chính trị, liên hiệp tự nguyện của tổ chức chính trị, các tổ chức chính trị xã hội, tổ chức xã hội và các cá nhân tiêu biểu trong các giai cấp, tầng lớp xã hội, dân tộc, tôn giáo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, Công đoàn Việt Nam là tổ chức nào?", "options": ["A. Là tổ chức chính trị xã hội của giai cấp công nhân và của người lao động, đại diện, chăm lo và bảo vệ quyền, lợi ích hợp pháp, chính đáng của người lao động.", "B. Là doanh nghiệp nhà nước.", "C. Là tổ chức của người sử dụng lao động.", "D. Là cơ quan quản lý nhà nước về lao động."], "answer": "A", "explain": "Điều 10 Hiến pháp 2013: Công đoàn Việt Nam là tổ chức chính trị xã hội của giai cấp công nhân và của người lao động, được thành lập trên cơ sở tự nguyện, đại diện cho người lao động, chăm lo và bảo vệ quyền, lợi ích hợp pháp, chính đáng của người lao động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chính sách an sinh xã hội của Nhà nước ta thể hiện ở nội dung nào?", "options": ["A. Chỉ chăm lo cho cán bộ, công chức.", "B. Chỉ thực hiện ở thành phố lớn.", "C. Không có chính sách an sinh xã hội.", "D. Chăm lo đời sống vật chất, tinh thần của người có công, người nghèo, người gặp khó khăn; thực hiện bảo hiểm xã hội, bảo hiểm y tế, trợ giúp xã hội."], "answer": "D", "explain": "Hiến pháp 2013 và các luật liên quan quy định Nhà nước thực hiện chính sách an sinh xã hội: chăm lo người có công với cách mạng, người nghèo, người gặp khó khăn; phát triển hệ thống bảo hiểm xã hội, bảo hiểm y tế và trợ giúp xã hội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Xã A phát động xây dựng nông thôn mới, người dân tự nguyện đóng góp ngày công, tiền của làm đường giao thông. Việc người dân tham gia đóng góp, bàn bạc công việc của xã thể hiện nguyên tắc nào?", "options": ["A. Không thể hiện nguyên tắc nào.", "B. Nguyên tắc dân biết, dân bàn, dân làm, dân kiểm tra: phát huy quyền làm chủ của nhân dân ở cơ sở.", "C. Nguyên tắc Nhà nước làm thay cho dân.", "D. Nguyên tắc người dân chỉ có nghĩa vụ đóng góp, không có quyền bàn bạc."], "answer": "B", "explain": "Pháp lệnh Thực hiện dân chủ ở xã, phường, thị trấn và Luật Thực hiện dân chủ ở cơ sở 2022 thể hiện phương châm dân biết, dân bàn, dân làm, dân kiểm tra, dân giám sát, dân thụ hưởng trong các công việc của địa phương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Xã A phát động xây dựng nông thôn mới, người dân tự nguyện đóng góp ngày công, tiền của làm đường giao thông. Các khoản đóng góp của người dân phải được quản lý như thế nào?", "options": ["A. Không cần ghi chép, theo dõi.", "B. Phải được công khai, minh bạch; người dân có quyền giám sát việc thu, chi.", "C. Cán bộ xã tự quyết định, không cần công khai.", "D. Cán bộ xã được sử dụng tùy ý."], "answer": "B", "explain": "Luật Thực hiện dân chủ ở cơ sở 2022: các khoản đóng góp của nhân dân phải được công khai, minh bạch; nhân dân có quyền giám sát việc thu, chi, quản lý, sử dụng các khoản đóng góp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn L là học sinh nghèo vượt khó, học giỏi. Bạn được nhà trường miễn, giảm học phí và nhận học bổng từ quỹ khuyến học của địa phương. Chính sách này thể hiện nội dung nào của Nhà nước ta?", "options": ["A. Là sự ưu ái riêng cho bạn L.", "B. Chính sách an sinh xã hội và phát triển giáo dục là quốc sách hàng đầu: không để ai bị bỏ lại phía sau trong học tập.", "C. Không phải là chính sách của Nhà nước.", "D. Chỉ áp dụng ở thành phố."], "answer": "B", "explain": "Nhà nước thực hiện chính sách miễn, giảm học phí, hỗ trợ chi phí học tập, học bổng cho học sinh nghèo, học sinh có hoàn cảnh khó khăn, thể hiện chính sách an sinh xã hội và quan điểm phát triển giáo dục là quốc sách hàng đầu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gia đình ông V là gia đình có công với cách mạng, được Nhà nước tặng nhà tình nghĩa và hằng tháng được hưởng trợ cấp ưu đãi. Chính sách này thể hiện truyền thống nào của dân tộc ta?", "options": ["A. Không thể hiện truyền thống nào.", "B. Là sự ban ơn của Nhà nước.", "C. Chỉ là chính sách kinh tế.", "D. Truyền thống uống nước nhớ nguồn, đền ơn đáp nghĩa đối với người có công với cách mạng."], "answer": "D", "explain": "Pháp lệnh Ưu đãi người có công với cách mạng thể hiện truyền thống uống nước nhớ nguồn, đền ơn đáp nghĩa của dân tộc; Nhà nước chăm lo đời sống vật chất, tinh thần của người có công với cách mạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Doanh nghiệp tư nhân X đầu tư hàng chục tỉ đồng vào nông nghiệp công nghệ cao, tạo việc làm cho hàng trăm lao động. Theo chủ trương của Đảng và Nhà nước, kinh tế tư nhân có vị trí như thế nào?", "options": ["A. Cần hạn chế phát triển.", "B. Không được đầu tư vào nông nghiệp.", "C. Là một động lực quan trọng của nền kinh tế, được khuyến khích phát triển lâu dài.", "D. Chỉ được hoạt động nhỏ lẻ."], "answer": "C", "explain": "Nghị quyết 10-NQ/TW xác định kinh tế tư nhân là một động lực quan trọng của nền kinh tế thị trường định hướng xã hội chủ nghĩa; Nhà nước khuyến khích, tạo điều kiện cho kinh tế tư nhân phát triển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Doanh nghiệp tư nhân X đầu tư hàng chục tỉ đồng vào nông nghiệp công nghệ cao, tạo việc làm cho hàng trăm lao động. Doanh nghiệp X có quyền bình đẳng với doanh nghiệp nhà nước trong hoạt động kinh tế không?", "options": ["A. Không, doanh nghiệp tư nhân không được đầu tư lớn.", "B. Không, doanh nghiệp nhà nước luôn được ưu tiên hơn.", "C. Chỉ bình đẳng trong lĩnh vực thương mại.", "D. Có, các thành phần kinh tế bình đẳng trước pháp luật trong hoạt động kinh tế."], "answer": "D", "explain": "Điều 51 Hiến pháp 2013: các thành phần kinh tế đều là bộ phận cấu thành quan trọng của nền kinh tế quốc dân, cùng phát triển lâu dài, hợp tác và cạnh tranh lành mạnh, bình đẳng trước pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hợp tác xã nông nghiệp S giúp các hộ nông dân liên kết sản xuất, bao tiêu sản phẩm với giá ổn định, cao hơn giá thị trường tự do. Vai trò của kinh tế tập thể, hợp tác xã được thể hiện như thế nào?", "options": ["A. Cản trở sự phát triển của kinh tế tư nhân.", "B. Chỉ làm tăng chi phí của nông dân.", "C. Giúp các hộ sản xuất nhỏ liên kết, hỗ trợ nhau, nâng cao sức cạnh tranh và thu nhập.", "D. Không có vai trò gì trong nền kinh tế."], "answer": "C", "explain": "Kinh tế tập thể với nòng cốt là hợp tác xã giúp các hộ sản xuất nhỏ liên kết, hỗ trợ nhau trong sản xuất, tiêu thụ sản phẩm, nâng cao sức cạnh tranh và thu nhập, là bộ phận cấu thành quan trọng của nền kinh tế quốc dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhóm sinh viên trường đại học nghiên cứu thành công quy trình xử lý rác thải nhựa thành vật liệu xây dựng và được Nhà nước hỗ trợ kinh phí tiếp tục nghiên cứu. Điều này thể hiện chính sách nào?", "options": ["A. Nghiên cứu khoa học là việc riêng của sinh viên.", "B. Nhà nước không hỗ trợ nghiên cứu khoa học.", "C. Chính sách phát triển khoa học và công nghệ là quốc sách hàng đầu; Nhà nước khuyến khích, hỗ trợ nghiên cứu, ứng dụng khoa học công nghệ vào đời sống.", "D. Chỉ viện nghiên cứu mới được nghiên cứu khoa học."], "answer": "C", "explain": "Điều 62 Hiến pháp 2013: phát triển khoa học và công nghệ là quốc sách hàng đầu; Nhà nước ưu tiên đầu tư, khuyến khích tổ chức, cá nhân nghiên cứu khoa học, phát triển công nghệ, ứng dụng vào sản xuất và đời sống.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ủy ban nhân dân xã B thu tiền đóng góp làm đường của người dân nhưng không công khai số thu, số chi; một phần tiền bị cán bộ xã sử dụng sai mục đích. Theo quy định của pháp luật, người dân có quyền gì?", "options": ["A. Quyền giám sát, yêu cầu công khai tài chính; quyền khiếu nại, tố cáo hành vi vi phạm của cán bộ.", "B. Chỉ có quyền đóng góp thêm.", "C. Phải im lặng để giữ đoàn kết.", "D. Không có quyền gì vì đã tự nguyện đóng góp."], "answer": "A", "explain": "Luật Thực hiện dân chủ ở cơ sở 2022: nhân dân có quyền giám sát, yêu cầu công khai các khoản thu, chi. Hành vi sử dụng sai mục đích tiền đóng góp của dân là vi phạm pháp luật; người dân có quyền khiếu nại, tố cáo và cán bộ vi phạm bị xử lý theo quy định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một dự án đầu tư công về xây dựng cầu được tổ chức đấu thầu rộng rãi. Cả doanh nghiệp nhà nước và doanh nghiệp tư nhân có đủ năng lực đều được tham gia và trúng thầu theo đúng quy định. Điều này thể hiện nguyên tắc nào?", "options": ["A. Nguyên tắc cạnh tranh bình đẳng giữa các thành phần kinh tế trước pháp luật.", "B. Nguyên tắc loại trừ doanh nghiệp tư nhân.", "C. Không thể hiện nguyên tắc nào.", "D. Nguyên tắc ưu tiên doanh nghiệp nhà nước."], "answer": "A", "explain": "Điều 51 Hiến pháp 2013 và Luật Đấu thầu: các nhà thầu thuộc mọi thành phần kinh tế bình đẳng trong việc tham gia đấu thầu, cạnh tranh lành mạnh; việc lựa chọn nhà thầu căn cứ vào năng lực, kinh nghiệm và hiệu quả, không phân biệt thành phần kinh tế.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồng bào dân tộc thiểu số ở vùng đặc biệt khó khăn được Nhà nước hỗ trợ vay vốn ưu đãi để phát triển sản xuất, được miễn, giảm học phí cho con em đi học. Chính sách này thể hiện nội dung nào?", "options": ["A. Là sự ưu ái bất công với các dân tộc khác.", "B. Chính sách dân tộc và chính sách an sinh xã hội của Nhà nước: chăm lo, hỗ trợ đồng bào dân tộc thiểu số phát triển kinh tế, văn hóa, giáo dục.", "C. Chỉ thực hiện trong thời gian ngắn.", "D. Không phải là chính sách của Nhà nước."], "answer": "B", "explain": "Hiến pháp 2013 Điều 5 và các chính sách của Đảng, Nhà nước: thực hiện chính sách dân tộc bình đẳng, đoàn kết, tương trợ; ưu tiên phát triển kinh tế xã hội vùng đồng bào dân tộc thiểu số, vùng đặc biệt khó khăn; chăm lo giáo dục, y tế, an sinh xã hội cho đồng bào.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hộ kinh doanh của bà K bán hàng qua mạng xã hội: bán mỹ phẩm giả nhãn hiệu nổi tiếng, không kê khai nộp thuế, sản phẩm không đảm bảo an toàn khiến nhiều khách hàng bị dị ứng. Nhận định nào sau đây là đúng nhất về trách nhiệm pháp lý của bà K?", "options": ["A. Chỉ phải nộp thuế bổ sung là xong.", "B. Bán hàng qua mạng thì không phải chịu trách nhiệm pháp lý.", "C. Bà K chỉ phải xin lỗi khách hàng là xong.", "D. Bà K có thể đồng thời phải chịu nhiều loại trách nhiệm: hành chính về buôn bán hàng giả, trốn thuế, vi phạm an toàn sản phẩm; dân sự bồi thường cho khách hàng; hình sự nếu đủ dấu hiệu tội phạm."], "answer": "D", "explain": "Mỗi hành vi vi phạm làm phát sinh trách nhiệm pháp lý tương ứng: buôn bán hàng giả bị xử phạt vi phạm hành chính (có thể bị truy cứu trách nhiệm hình sự); trốn thuế bị xử phạt về thuế; gây thiệt hại cho khách hàng phải bồi thường dân sự. Một chủ thể có thể đồng thời chịu nhiều loại trách nhiệm pháp lý.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Trong buổi học về các thành phần kinh tế, cô giáo yêu cầu học sinh thảo luận về vai trò của kinh tế nhà nước, kinh tế tập thể và kinh tế tư nhân. Xét tính đúng, sai của các nhận định:", "statements": ["a) Kinh tế nhà nước giữ vai trò chủ đạo trong nền kinh tế quốc dân.", "b) Kinh tế tư nhân là một động lực quan trọng của nền kinh tế, được khuyến khích phát triển.", "c) Chỉ kinh tế nhà nước mới được pháp luật bảo vệ, các thành phần kinh tế khác không được bảo vệ.", "d) Các thành phần kinh tế bình đẳng trước pháp luật trong hoạt động kinh tế."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Điều 51 Hiến pháp 2013. b) Đúng: theo chủ trương của Đảng, kinh tế tư nhân là động lực quan trọng. c) Sai: mọi thành phần kinh tế đều được pháp luật bảo vệ quyền, lợi ích hợp pháp. d) Đúng: các thành phần kinh tế bình đẳng trước pháp luật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Xã C thực hiện chính sách hỗ trợ học sinh nghèo: miễn, giảm học phí, tặng học bổng, hỗ trợ sách vở. Nhiều học sinh có hoàn cảnh khó khăn đã được tiếp tục đến trường. Xét tính đúng, sai của các nhận định:", "statements": ["a) Nhà nước thực hiện chính sách an sinh xã hội, chăm lo người nghèo, người gặp khó khăn.", "b) Việc hỗ trợ học sinh nghèo thể hiện quan điểm phát triển giáo dục là quốc sách hàng đầu.", "c) Chính sách an sinh xã hội chỉ dành cho cán bộ, công chức nhà nước.", "d) Mọi người dân đều có quyền được chăm sóc sức khỏe, học tập theo quy định."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Nhà nước thực hiện chính sách an sinh xã hội toàn dân. b) Đúng: Điều 61 Hiến pháp 2013, phát triển giáo dục là quốc sách hàng đầu; không để ai bị bỏ lại phía sau. c) Sai: an sinh xã hội hướng tới mọi người dân, ưu tiên người nghèo, người yếu thế. d) Đúng: Hiến pháp 2013 ghi nhận quyền được bảo vệ, chăm sóc sức khỏe (Điều 38) và quyền học tập (Điều 39) của mọi người.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Tình huống: Người dân xã D phát hiện cán bộ xã thu tiền đóng góp làm đường của dân nhưng không công khai thu chi, có dấu hiệu sử dụng sai mục đích. Người dân đã gửi đơn kiến nghị và tố cáo. Xét tính đúng, sai của các nhận định:", "statements": ["a) Người dân có quyền giám sát hoạt động thu, chi các khoản đóng góp của mình.", "b) Các khoản thu, chi ngân sách, đóng góp của dân ở xã phải được công khai, minh bạch.", "c) Cán bộ sử dụng tiền đóng góp của dân sai mục đích là vi phạm pháp luật và bị xử lý.", "d) Người dân không có quyền chất vấn, kiến nghị với cán bộ xã về các khoản thu chi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Luật Thực hiện dân chủ ở cơ sở 2022, nhân dân có quyền giám sát. b) Đúng: các khoản thu, chi phải được công khai, minh bạch. c) Đúng: sử dụng sai mục đích tiền của dân là vi phạm, bị xử lý kỷ luật, xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự tùy mức độ. d) Sai: người dân có quyền chất vấn, kiến nghị, khiếu nại, tố cáo.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: Trong buổi sinh hoạt ngoại khóa về Hiến pháp, học sinh thảo luận về quyền và nghĩa vụ cơ bản của công dân. Xét tính đúng, sai của các nhận định:", "statements": ["a) Mọi người đều bình đẳng trước pháp luật; không ai bị phân biệt đối xử.", "b) Công dân có nghĩa vụ nộp thuế và các khoản thu khác theo quy định của pháp luật.", "c) Công dân có quyền bất khả xâm phạm về đời sống riêng tư, bí mật cá nhân và bí mật gia đình.", "d) Công dân chỉ có quyền mà không có nghĩa vụ đối với Nhà nước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Điều 16 Hiến pháp 2013. b) Đúng: Điều 47 Hiến pháp 2013, mọi người có nghĩa vụ nộp thuế, phí, lệ phí và các khoản thu khác theo quy định của pháp luật. c) Đúng: Điều 21 Hiến pháp 2013. d) Sai: công dân vừa có quyền vừa có nghĩa vụ; quyền công dân không tách rời nghĩa vụ công dân.", "points": 1}]}]}</script>
