<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Bộ luật Lao động năm 2019, hợp đồng lao động là gì?", "options": ["A. Là bản cam kết từ thiện của người lao động.", "B. Là sự thỏa thuận giữa người lao động và người sử dụng lao động về việc làm có trả công, tiền lương, điều kiện lao động, quyền và nghĩa vụ của mỗi bên.", "C. Là quyết định tuyển dụng của cơ quan nhà nước.", "D. Là giấy phép kinh doanh của doanh nghiệp."], "answer": "B", "explain": "Điều 13 Bộ luật Lao động 2019: hợp đồng lao động là sự thỏa thuận giữa người lao động và người sử dụng lao động về việc làm có trả công, tiền lương, điều kiện lao động, quyền và nghĩa vụ của mỗi bên trong quan hệ lao động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Bộ luật Lao động năm 2019, thời giờ làm việc bình thường của người lao động không quá bao nhiêu giờ trong một ngày?", "options": ["A. Không quá 06 giờ trong 01 ngày.", "B. Không quá 08 giờ trong 01 ngày.", "C. Không quá 12 giờ trong 01 ngày.", "D. Không quá 10 giờ trong 01 ngày."], "answer": "B", "explain": "Điều 105 Bộ luật Lao động 2019: thời giờ làm việc bình thường không quá 08 giờ trong 01 ngày và không quá 48 giờ trong 01 tuần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Việc làm năm 2013, người lao động được hưởng trợ cấp thất nghiệp khi đáp ứng điều kiện nào?", "options": ["A. Đã đóng bảo hiểm thất nghiệp từ đủ 12 tháng trở lên trong thời gian 24 tháng trước khi chấm dứt hợp đồng lao động.", "B. Chỉ cần nghỉ việc là được hưởng trợ cấp thất nghiệp.", "C. Phải đủ 60 tuổi mới được hưởng trợ cấp thất nghiệp.", "D. Phải có thời gian đóng bảo hiểm xã hội từ đủ 20 năm trở lên."], "answer": "A", "explain": "Điều 49 Luật Việc làm 2013: người lao động được hưởng trợ cấp thất nghiệp khi đã đóng bảo hiểm thất nghiệp từ đủ 12 tháng trở lên trong thời gian 24 tháng trước khi chấm dứt hợp đồng lao động hoặc hợp đồng làm việc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Hôn nhân và gia đình năm 2014, hành vi nào sau đây bị nghiêm cấm?", "options": ["A. Vợ chồng cùng nhau nuôi dạy con cái.", "B. Tảo hôn, cưỡng ép kết hôn, lừa dối kết hôn.", "C. Đăng ký kết hôn tại Ủy ban nhân dân cấp xã.", "D. Tổ chức lễ cưới theo phong tục truyền thống."], "answer": "B", "explain": "Điều 5 Luật Hôn nhân và gia đình 2014 nghiêm cấm các hành vi: tảo hôn, cưỡng ép kết hôn, lừa dối kết hôn, cản trở kết hôn; người đang có vợ, có chồng mà kết hôn với người khác; chung sống như vợ chồng với người khác khi đang có vợ, có chồng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Hôn nhân và gia đình năm 2014, tài sản chung của vợ chồng bao gồm những tài sản nào?", "options": ["A. Tài sản được tặng cho riêng cho vợ hoặc chồng trong thời kỳ hôn nhân.", "B. Tài sản do vợ, chồng tạo ra, thu nhập do lao động, hoạt động sản xuất, kinh doanh và những thu nhập hợp pháp khác trong thời kỳ hôn nhân.", "C. Chỉ bao gồm nhà ở của vợ chồng.", "D. Tài sản riêng của mỗi bên vợ, chồng có trước khi kết hôn."], "answer": "B", "explain": "Điều 33 Luật Hôn nhân và gia đình 2014: tài sản chung của vợ chồng gồm tài sản do vợ, chồng tạo ra, thu nhập do lao động, hoạt động sản xuất, kinh doanh, hoa lợi, lợi tức phát sinh từ tài sản riêng và thu nhập hợp pháp khác trong thời kỳ hôn nhân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, công dân có nghĩa vụ nào sau đây?", "options": ["A. Trung thành với Tổ quốc, bảo vệ Tổ quốc, thực hiện nghĩa vụ quân sự và tham gia xây dựng nền quốc phòng toàn dân.", "B. Được miễn mọi nghĩa vụ đối với Nhà nước.", "C. Chỉ thực hiện nghĩa vụ khi tự nguyện.", "D. Chỉ có quyền mà không có nghĩa vụ."], "answer": "A", "explain": "Điều 44 và Điều 45 Hiến pháp 2013: công dân có nghĩa vụ trung thành với Tổ quốc; bảo vệ Tổ quốc là nghĩa vụ thiêng liêng và quyền cao quý của công dân; công dân phải thực hiện nghĩa vụ quân sự và tham gia xây dựng nền quốc phòng toàn dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Trật tự, an toàn giao thông đường bộ năm 2024, người điều khiển xe mô tô, xe gắn máy phải đội mũ bảo hiểm và cài quai đúng quy cách khi nào?", "options": ["A. Chỉ khi đi vào ban đêm.", "B. Chỉ khi có cảnh sát giao thông.", "C. Chỉ khi đi trên đường cao tốc.", "D. Khi tham gia giao thông đường bộ."], "answer": "D", "explain": "Luật Trật tự, an toàn giao thông đường bộ 2024 quy định người điều khiển, người ngồi trên xe mô tô, xe gắn máy phải đội mũ bảo hiểm và cài quai đúng quy cách khi tham gia giao thông đường bộ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Văn hóa tiêu dùng là gì?", "options": ["A. Là việc mua sắm càng nhiều hàng hóa càng tốt.", "B. Là việc chỉ mua hàng hóa nhập khẩu đắt tiền.", "C. Là thói quen tiêu dùng hoang phí, chạy theo mốt.", "D. Là cách ứng xử, thói quen, lối sống của người tiêu dùng trong việc mua sắm, sử dụng hàng hóa, dịch vụ một cách văn minh, có trách nhiệm."], "answer": "D", "explain": "Theo chương trình GDPT 2018, văn hóa tiêu dùng là cách ứng xử, thói quen, lối sống văn minh, có trách nhiệm của người tiêu dùng trong việc lựa chọn, mua sắm và sử dụng hàng hóa, dịch vụ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trách nhiệm xã hội của doanh nghiệp được hiểu là gì?", "options": ["A. Là cam kết của doanh nghiệp đóng góp cho sự phát triển bền vững, quan tâm đến lợi ích của người lao động, cộng đồng và môi trường bên cạnh mục tiêu lợi nhuận.", "B. Là hoạt động từ thiện bắt buộc hằng năm của doanh nghiệp.", "C. Là việc doanh nghiệp chỉ quan tâm đến lợi nhuận của cổ đông.", "D. Là nghĩa vụ nộp thuế duy nhất của doanh nghiệp."], "answer": "A", "explain": "Theo chương trình GDPT 2018, trách nhiệm xã hội của doanh nghiệp là sự cam kết của doanh nghiệp đóng góp cho sự phát triển bền vững, bảo đảm lợi ích của người lao động, cộng đồng và bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Phòng, chống bạo lực gia đình, bạo lực gia đình là hành vi nào?", "options": ["A. Là hành vi cố ý của thành viên gia đình gây tổn hại hoặc có khả năng gây tổn hại về thể chất, tinh thần, tình dục, kinh tế đối với thành viên khác trong gia đình.", "B. Là việc vợ chồng bàn bạc công việc gia đình.", "C. Là mâu thuẫn nhỏ trong sinh hoạt gia đình hằng ngày.", "D. Là việc cha mẹ dạy dỗ con cái nên người."], "answer": "A", "explain": "Theo Luật Phòng, chống bạo lực gia đình 2022, bạo lực gia đình là hành vi cố ý của thành viên gia đình gây tổn hại hoặc có khả năng gây tổn hại về thể chất, tinh thần, tình dục, kinh tế đối với thành viên khác trong gia đình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Bộ luật Lao động năm 2019, người lao động có quyền nào sau đây?", "options": ["A. Được tự ý nghỉ việc không cần báo trước trong mọi trường hợp.", "B. Được trả lương đầy đủ, đúng hạn; được bảo đảm điều kiện làm việc an toàn, vệ sinh lao động.", "C. Được miễn trừ mọi kỷ luật lao động.", "D. Được yêu cầu tăng lương bất cứ lúc nào."], "answer": "B", "explain": "Điều 5 Bộ luật Lao động 2019: người lao động có quyền được trả lương đầy đủ, đúng hạn; được bảo đảm điều kiện làm việc an toàn, vệ sinh lao động; được nghỉ hằng năm và nghỉ lễ, tết hưởng nguyên lương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Trẻ em năm 2016, trẻ em là người dưới bao nhiêu tuổi?", "options": ["A. Dưới 12 tuổi.", "B. Dưới 14 tuổi.", "C. Dưới 18 tuổi.", "D. Dưới 16 tuổi."], "answer": "D", "explain": "Điều 1 Luật Trẻ em 2016: trẻ em là người dưới 16 tuổi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Anh B ký hợp đồng lao động 12 tháng với một công ty, lương 8 triệu đồng một tháng; hai tháng gần đây công ty trả lương chậm và thiếu. Theo Bộ luật Lao động năm 2019, hợp đồng lao động thời hạn 12 tháng phải được giao kết bằng hình thức nào?", "options": ["A. Chỉ cần thỏa thuận bằng lời nói.", "B. Bằng văn bản, được làm thành 02 bản, mỗi bên giữ 01 bản.", "C. Không cần hình thức nào, cứ đi làm là có hợp đồng.", "D. Chỉ cần tin nhắn điện thoại."], "answer": "B", "explain": "Điều 14 Bộ luật Lao động 2019: hợp đồng lao động phải được giao kết bằng văn bản và được làm thành 02 bản, người lao động giữ 01 bản, người sử dụng lao động giữ 01 bản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Anh B ký hợp đồng lao động 12 tháng với một công ty, lương 8 triệu đồng một tháng; hai tháng gần đây công ty trả lương chậm và thiếu. Việc công ty trả lương chậm, thiếu cho anh B là vi phạm nghĩa vụ nào?", "options": ["A. Nghĩa vụ trả lương đầy đủ, đúng hạn cho người lao động.", "B. Nghĩa vụ tổ chức sinh nhật cho người lao động.", "C. Nghĩa vụ tặng quà tết cho người lao động.", "D. Không vi phạm nghĩa vụ nào."], "answer": "A", "explain": "Điều 94 Bộ luật Lao động 2019: người sử dụng lao động phải trả lương trực tiếp, đầy đủ, đúng hạn cho người lao động. Trả lương chậm, thiếu là vi phạm nghĩa vụ này.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chị C 19 tuổi bị cha mẹ ép gả cho một người đàn ông 40 tuổi mà chị không yêu thương để gia đình nhận tiền sính lễ lớn. Theo Luật Hôn nhân và gia đình năm 2014, hành vi của cha mẹ chị C là gì?", "options": ["A. Là phong tục tốt đẹp cần được phát huy.", "B. Không vi phạm pháp luật vì cha mẹ có quyền quyết định.", "C. Cưỡng ép kết hôn, là hành vi bị pháp luật nghiêm cấm; chị C có quyền từ chối và tố cáo.", "D. Là quyền của cha mẹ trong việc dựng vợ gả chồng cho con."], "answer": "C", "explain": "Điều 5 Luật Hôn nhân và gia đình 2014 nghiêm cấm hành vi cưỡng ép kết hôn. Việc kết hôn phải do nam nữ tự nguyện quyết định, không bên nào được cưỡng ép bên nào.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vợ chồng anh D ly hôn, hai người tranh chấp quyền nuôi con chung 5 tuổi. Theo Luật Hôn nhân và gia đình năm 2014, Tòa án quyết định giao con cho ai nuôi dựa trên căn cứ nào?", "options": ["A. Luôn giao con cho người mẹ nuôi.", "B. Luôn giao con cho người cha nuôi.", "C. Căn cứ vào quyền lợi về mọi mặt của con, giao cho một bên trực tiếp nuôi dưỡng, chăm sóc.", "D. Giao con cho ông bà nội nuôi."], "answer": "C", "explain": "Điều 81 Luật Hôn nhân và gia đình 2014: sau khi ly hôn, cha mẹ vẫn có quyền, nghĩa vụ trông nom, chăm sóc, nuôi dưỡng con; vợ chồng thỏa thuận về người trực tiếp nuôi con, nếu không thỏa thuận được thì Tòa án quyết định giao con cho một bên trực tiếp nuôi căn cứ vào quyền lợi về mọi mặt của con.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Nhiều học sinh lớp 12 đi xe máy điện đến trường không đội mũ bảo hiểm. Theo quy định của pháp luật, hành vi không đội mũ bảo hiểm khi đi xe máy điện bị xử lý như thế nào?", "options": ["A. Bị xử phạt vi phạm hành chính theo quy định về trật tự, an toàn giao thông đường bộ.", "B. Chỉ bị thầy cô nhắc nhở, không bị xử phạt.", "C. Không vi phạm vì xe máy điện không phải xe cơ giới.", "D. Chỉ bị xử phạt khi gây tai nạn."], "answer": "A", "explain": "Luật Trật tự, an toàn giao thông đường bộ 2024 và Nghị định 168/2024/NĐ-CP quy định người điều khiển, người ngồi trên xe mô tô, xe gắn máy, xe máy điện phải đội mũ bảo hiểm; vi phạm bị xử phạt vi phạm hành chính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Nhiều học sinh lớp 12 đi xe máy điện đến trường không đội mũ bảo hiểm. Nếu người không đội mũ bảo hiểm gây tai nạn giao thông nghiêm trọng làm người khác tử vong thì có thể bị xử lý như thế nào?", "options": ["A. Không bị xử lý vì là học sinh.", "B. Có thể bị truy cứu trách nhiệm hình sự về tội vi phạm quy định về tham gia giao thông đường bộ.", "C. Chỉ bị xử phạt vi phạm hành chính.", "D. Chỉ phải xin lỗi gia đình nạn nhân."], "answer": "B", "explain": "Điều 260 Bộ luật Hình sự 2015 quy định tội vi phạm quy định về tham gia giao thông đường bộ: người vi phạm gây hậu quả nghiêm trọng như làm chết người thì bị truy cứu trách nhiệm hình sự.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cửa hàng của ông T bị phát hiện bày bán nhiều loại thực phẩm đã hết hạn sử dụng, không rõ nguồn gốc xuất xứ. Hành vi này xâm phạm quyền lợi của ai và vi phạm quy định nào?", "options": ["A. Chỉ vi phạm đạo đức kinh doanh.", "B. Xâm phạm quyền lợi người tiêu dùng; vi phạm pháp luật về an toàn thực phẩm và bảo vệ quyền lợi người tiêu dùng.", "C. Chỉ vi phạm khi có người bị ngộ độc.", "D. Không xâm phạm ai vì khách hàng tự chọn mua."], "answer": "B", "explain": "Kinh doanh thực phẩm hết hạn sử dụng, không rõ nguồn gốc vi phạm pháp luật về an toàn thực phẩm và xâm phạm quyền được bảo đảm an toàn của người tiêu dùng (Luật Bảo vệ quyền lợi người tiêu dùng 2023).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ông S thường xuyên uống rượu say rồi đánh đập vợ con gây thương tích. Theo quy định của pháp luật, hành vi của ông S là gì?", "options": ["A. Là quyền dạy dỗ vợ con của người chồng.", "B. Là hành vi bạo lực gia đình, bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự tùy mức độ.", "C. Chỉ vi phạm khi hàng xóm tố cáo.", "D. Là việc riêng của gia đình, pháp luật không can thiệp."], "answer": "B", "explain": "Theo Luật Phòng, chống bạo lực gia đình 2022, hành vi cố ý gây tổn hại về thể chất, tinh thần đối với thành viên gia đình là bạo lực gia đình, bị xử phạt vi phạm hành chính (Nghị định 144/2021/NĐ-CP) và có thể bị truy cứu trách nhiệm hình sự khi gây hậu quả nghiêm trọng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chị E đang nuôi con nhỏ dưới 12 tháng tuổi thì công ty đơn phương chấm dứt hợp đồng lao động với lý do tinh giản biên chế, không báo trước. Theo Bộ luật Lao động năm 2019, nhận định nào sau đây là đúng?", "options": ["A. Chỉ vi phạm khi chị E đang mang thai.", "B. Chị E phải chấp nhận vì công ty đã báo miệng.", "C. Công ty làm đúng vì có quyền tinh giản biên chế.", "D. Công ty vi phạm vì không được đơn phương chấm dứt hợp đồng lao động với lao động nữ đang nuôi con dưới 12 tháng tuổi; phải nhận chị E trở lại làm việc và bồi thường."], "answer": "D", "explain": "Điều 37 Bộ luật Lao động 2019: người sử dụng lao động không được đơn phương chấm dứt hợp đồng lao động đối với người lao động nữ đang mang thai, đang nghỉ thai sản hoặc nuôi con dưới 12 tháng tuổi. Trường hợp đơn phương chấm dứt trái pháp luật phải nhận người lao động trở lại làm việc và bồi thường theo quy định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh F 19 tuổi và chị G 17 tuổi yêu nhau. Hai gia đình tổ chức đám cưới linh đình cho hai người nhưng không đăng ký kết hôn. Theo Luật Hôn nhân và gia đình năm 2014, trường hợp này được xác định như thế nào?", "options": ["A. Là hôn nhân hợp pháp vì đã tổ chức đám cưới.", "B. Chỉ vi phạm khi có người tố cáo.", "C. Không vi phạm vì hai người tự nguyện.", "D. Là tảo hôn vì chị G chưa đủ tuổi kết hôn; người tổ chức tảo hôn bị xử phạt vi phạm hành chính, tái phạm có thể bị truy cứu trách nhiệm hình sự."], "answer": "D", "explain": "Tảo hôn là việc lấy vợ, lấy chồng khi một bên hoặc cả hai bên chưa đủ tuổi kết hôn (nam chưa đủ 20, nữ chưa đủ 18). Hành vi tổ chức tảo hôn bị xử phạt vi phạm hành chính và có thể bị truy cứu trách nhiệm hình sự về tội tổ chức tảo hôn (Điều 183 Bộ luật Hình sự 2015).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh Q mua điện thoại mới tại cửa hàng, được bảo hành 12 tháng. Sau 2 tháng sử dụng bình thường, máy bị lỗi màn hình nhưng cửa hàng từ chối bảo hành với lý do đã bán là xong. Theo Luật Bảo vệ quyền lợi người tiêu dùng năm 2023, anh Q có quyền gì?", "options": ["A. Không có quyền gì vì hàng đã bán thì cửa hàng hết trách nhiệm.", "B. Chỉ có quyền đăng bài chê cửa hàng trên mạng xã hội.", "C. Chỉ có quyền mua máy mới với giá ưu đãi.", "D. Quyền được bảo hành, đổi, trả hàng hóa theo cam kết; có quyền khiếu nại, khởi kiện hoặc phản ánh đến cơ quan bảo vệ quyền lợi người tiêu dùng."], "answer": "D", "explain": "Luật Bảo vệ quyền lợi người tiêu dùng 2023 quy định người tiêu dùng có quyền được bảo đảm chất lượng hàng hóa, được bảo hành theo cam kết và có quyền khiếu nại, tố cáo, khởi kiện khi quyền lợi bị xâm phạm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ông H nghiện rượu, thường xuyên đánh đập vợ con gây thương tích, đập phá tài sản trong nhà và đe dọa giết cả gia đình. Nhận định nào sau đây là đúng nhất về vụ việc?", "options": ["A. Hành vi của ông H là bạo lực gia đình; tùy mức độ có thể bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự; nạn nhân được pháp luật bảo vệ, có quyền yêu cầu áp dụng biện pháp cấm tiếp xúc.", "B. Chỉ xử lý được khi ông H tỉnh rượu và tự thú.", "C. Đây là việc nội bộ gia đình, pháp luật không can thiệp.", "D. Vợ con ông H phải cam chịu vì ông H là chủ gia đình."], "answer": "A", "explain": "Luật Phòng, chống bạo lực gia đình 2022 xác định đây là hành vi bạo lực gia đình; người có hành vi bạo lực gia đình bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự (ví dụ tội cố ý gây thương tích, Điều 134 Bộ luật Hình sự 2015); người bị bạo lực được bảo vệ, hỗ trợ và có quyền yêu cầu áp dụng biện pháp cấm tiếp xúc.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Chị N ký hợp đồng lao động 24 tháng với công ty may, lương 7 triệu đồng một tháng. Ba tháng nay công ty trả lương chậm. Chị N muốn đơn phương chấm dứt hợp đồng. Xét tính đúng, sai của các nhận định:", "statements": ["a) Hợp đồng lao động là sự thỏa thuận giữa người lao động và người sử dụng lao động về việc làm có trả công.", "b) Công ty phải trả lương đầy đủ, đúng hạn cho chị N theo hợp đồng.", "c) Công ty được tự ý cắt giảm lương của chị N khi gặp khó khăn mà không cần thỏa thuận.", "d) Chị N có quyền đơn phương chấm dứt hợp đồng lao động khi công ty không trả lương đúng hạn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Điều 13 Bộ luật Lao động 2019. b) Đúng: Điều 94, người sử dụng lao động phải trả lương đầy đủ, đúng hạn. c) Sai: việc thay đổi tiền lương phải do hai bên thỏa thuận. d) Đúng: Điều 35, người lao động có quyền đơn phương chấm dứt hợp đồng khi người sử dụng lao động không trả đủ lương hoặc trả lương không đúng thời hạn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Nam 19 tuổi và nữ 17 tuổi được hai gia đình tổ chức đám cưới nhưng không đăng ký kết hôn. Xét tính đúng, sai của các nhận định:", "statements": ["a) Hai người chưa đủ tuổi kết hôn theo quy định vì nữ chưa đủ 18 tuổi.", "b) Việc cha mẹ ép buộc hoặc tổ chức cưới khi chưa đủ tuổi là hành vi bị pháp luật nghiêm cấm.", "c) Chỉ cần tổ chức đám cưới là hôn nhân được pháp luật công nhận.", "d) Hành vi tổ chức tảo hôn có thể bị xử phạt vi phạm hành chính."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: nữ từ đủ 18 tuổi mới được kết hôn (Điều 8 Luật Hôn nhân và gia đình 2014). b) Đúng: tảo hôn, cưỡng ép kết hôn bị nghiêm cấm (Điều 5). c) Sai: kết hôn phải được đăng ký tại cơ quan nhà nước có thẩm quyền mới được pháp luật công nhận. d) Đúng: tổ chức tảo hôn bị xử phạt vi phạm hành chính, tái phạm có thể bị truy cứu trách nhiệm hình sự.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Tình huống: H là học sinh lớp 11, 16 tuổi, điều khiển xe mô tô 110 phân khối đến trường không đội mũ bảo hiểm và không có giấy phép lái xe. Cha mẹ H biết nhưng vẫn giao xe cho H đi. Xét tính đúng, sai của các nhận định:", "statements": ["a) H vi phạm quy định về đội mũ bảo hiểm khi tham gia giao thông.", "b) H chưa đủ điều kiện điều khiển xe mô tô vì chưa đủ 18 tuổi để được cấp giấy phép lái xe.", "c) Cha mẹ giao xe cho người không đủ điều kiện điều khiển cũng bị xử phạt vi phạm hành chính.", "d) H chỉ bị nhắc nhở vì còn là học sinh nên không bị xử phạt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: người điều khiển xe mô tô phải đội mũ bảo hiểm. b) Đúng: người đủ 18 tuổi trở lên mới được cấp giấy phép lái xe hạng A1 điều khiển xe mô tô. c) Đúng: hành vi giao xe cho người không đủ điều kiện điều khiển bị xử phạt vi phạm hành chính (Nghị định 168/2024/NĐ-CP). d) Sai: người từ đủ 16 tuổi trở lên điều khiển xe mô tô vi phạm vẫn bị xử phạt vi phạm hành chính.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: Vợ chồng anh K ly hôn, có con chung 8 tuổi. Hai người không thỏa thuận được ai là người trực tiếp nuôi con. Xét tính đúng, sai của các nhận định:", "statements": ["a) Khi ly hôn, vợ chồng có thể thỏa thuận về người trực tiếp nuôi con.", "b) Nếu không thỏa thuận được, Tòa án quyết định giao con cho một bên căn cứ vào quyền lợi về mọi mặt của con.", "c) Con từ đủ 07 tuổi trở lên thì khi giải quyết ly hôn phải xem xét nguyện vọng của con.", "d) Người không trực tiếp nuôi con thì không phải cấp dưỡng nuôi con."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Điều 81 Luật Hôn nhân và gia đình 2014. b) Đúng: Tòa án quyết định căn cứ vào quyền lợi về mọi mặt của con. c) Đúng: Điều 81, con từ đủ 07 tuổi trở lên phải xem xét nguyện vọng của con. d) Sai: cha, mẹ không trực tiếp nuôi con có nghĩa vụ cấp dưỡng cho con (Điều 82).", "points": 1}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Luật Doanh nghiệp năm 2020, công ty cổ phần có đặc điểm nào?", "options": ["A. Các thành viên hợp danh chịu trách nhiệm vô hạn.", "B. Chỉ có duy nhất 01 chủ sở hữu là cá nhân.", "C. Vốn điều lệ được chia thành nhiều phần bằng nhau gọi là cổ phần; có tối thiểu 03 cổ đông.", "D. Có từ 02 đến 50 thành viên."], "answer": "C", "explain": "Điều 111 Luật Doanh nghiệp 2020: công ty cổ phần là doanh nghiệp có vốn điều lệ được chia thành nhiều phần bằng nhau gọi là cổ phần; cổ đông có thể là tổ chức, cá nhân; số lượng cổ đông tối thiểu là 03 và không hạn chế số lượng tối đa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Doanh nghiệp năm 2020, công ty hợp danh phải có ít nhất bao nhiêu thành viên hợp danh là cá nhân?", "options": ["A. Ít nhất 01 thành viên hợp danh.", "B. Ít nhất 03 thành viên hợp danh.", "C. Ít nhất 02 thành viên hợp danh là cá nhân.", "D. Không quy định số lượng tối thiểu."], "answer": "C", "explain": "Điều 177 Luật Doanh nghiệp 2020: công ty hợp danh phải có ít nhất 02 thành viên là chủ sở hữu chung của công ty, cùng nhau kinh doanh dưới một tên chung, gọi là thành viên hợp danh; ngoài các thành viên hợp danh, công ty có thể có thêm thành viên góp vốn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vốn điều lệ của doanh nghiệp được hiểu là gì?", "options": ["A. Là tổng giá trị tài sản do các thành viên, chủ sở hữu đã góp hoặc cam kết góp khi thành lập doanh nghiệp.", "B. Là số tiền doanh nghiệp vay của ngân hàng.", "C. Là tổng doanh thu hằng năm của doanh nghiệp.", "D. Là lợi nhuận sau thuế của doanh nghiệp."], "answer": "A", "explain": "Theo Luật Doanh nghiệp 2020, vốn điều lệ là tổng giá trị tài sản do các thành viên công ty, chủ sở hữu công ty đã góp hoặc cam kết góp khi thành lập công ty.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, quyền tự do kinh doanh của công dân được quy định như thế nào?", "options": ["A. Mọi người được kinh doanh mọi ngành nghề không cần điều kiện gì.", "B. Chỉ cán bộ nhà nước mới được kinh doanh.", "C. Người dân không có quyền tự do kinh doanh.", "D. Mọi người có quyền tự do kinh doanh trong những ngành nghề mà luật không cấm."], "answer": "D", "explain": "Điều 33 Hiến pháp 2013: mọi người có quyền tự do kinh doanh trong những ngành nghề mà luật không cấm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Khiếu nại năm 2011, khiếu nại là gì?", "options": ["A. Là việc người dân biểu tình phản đối chính sách.", "B. Là việc công dân đề nghị cơ quan có thẩm quyền xem xét lại quyết định hành chính, hành vi hành chính khi có căn cứ cho rằng quyết định, hành vi đó trái pháp luật, xâm phạm quyền, lợi ích hợp pháp của mình.", "C. Là việc công dân báo tin về tội phạm cho cơ quan công an.", "D. Là việc doanh nghiệp kiện nhau ra Tòa án."], "answer": "B", "explain": "Điều 2 Luật Khiếu nại 2011: khiếu nại là việc công dân, cơ quan, tổ chức đề nghị cơ quan, tổ chức, cá nhân có thẩm quyền xem xét lại quyết định hành chính, hành vi hành chính khi có căn cứ cho rằng quyết định, hành vi đó là trái pháp luật, xâm phạm quyền, lợi ích hợp pháp của mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Tố cáo năm 2018, tố cáo là gì?", "options": ["A. Là việc người dân gửi đơn xin việc.", "B. Là việc cá nhân báo cho cơ quan, tổ chức, cá nhân có thẩm quyền biết về hành vi vi phạm pháp luật của cơ quan, tổ chức, cá nhân.", "C. Là việc bị can khai báo hành vi phạm tội của mình.", "D. Là việc công dân đề nghị xem xét lại quyết định hành chính."], "answer": "B", "explain": "Điều 2 Luật Tố cáo 2018: tố cáo là việc cá nhân báo cho cơ quan, tổ chức, cá nhân có thẩm quyền biết về hành vi vi phạm pháp luật của cán bộ, công chức, viên chức trong việc thực hiện nhiệm vụ, công vụ hoặc của cơ quan, tổ chức, cá nhân khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, Quốc hội là cơ quan nào?", "options": ["A. Là cơ quan hành chính nhà nước cao nhất.", "B. Là cơ quan xét xử cao nhất.", "C. Là cơ quan kiểm sát hoạt động tư pháp.", "D. Là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam."], "answer": "D", "explain": "Điều 69 Hiến pháp 2013: Quốc hội là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, Chính phủ là cơ quan nào?", "options": ["A. Là cơ quan lập pháp duy nhất.", "B. Là cơ quan quyền lực nhà nước cao nhất.", "C. Là cơ quan hành chính nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền hành pháp.", "D. Là cơ quan xét xử của Nhà nước."], "answer": "C", "explain": "Điều 94 Hiến pháp 2013: Chính phủ là cơ quan hành chính nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền hành pháp, là cơ quan chấp hành của Quốc hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, Tòa án nhân dân là cơ quan nào?", "options": ["A. Là cơ quan lập pháp.", "B. Là cơ quan hành chính nhà nước cao nhất.", "C. Là cơ quan xét xử của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp.", "D. Là cơ quan thực hành quyền công tố."], "answer": "C", "explain": "Điều 102 Hiến pháp 2013: Tòa án nhân dân là cơ quan xét xử của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, Viện kiểm sát nhân dân có chức năng nào?", "options": ["A. Thực hành quyền công tố, kiểm sát hoạt động tư pháp.", "B. Điều hành hoạt động của Chính phủ.", "C. Ban hành các văn bản quy phạm pháp luật.", "D. Xét xử các vụ án hình sự, dân sự."], "answer": "A", "explain": "Điều 107 Hiến pháp 2013: Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đạo đức được hiểu là gì?", "options": ["A. Là hệ thống các quy tắc, chuẩn mực xã hội mà nhờ đó con người tự giác điều chỉnh hành vi của mình cho phù hợp với lợi ích của cộng đồng, xã hội.", "B. Là nội quy của một cơ quan, tổ chức cụ thể.", "C. Là hệ thống quy tắc do Nhà nước ban hành và cưỡng chế thực hiện.", "D. Là phong tục tập quán của một địa phương."], "answer": "A", "explain": "Theo chương trình GDPT 2018, đạo đức là hệ thống các quy tắc, chuẩn mực xã hội mà nhờ đó con người tự giác điều chỉnh hành vi của mình cho phù hợp với lợi ích của cộng đồng, của xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mối quan hệ giữa pháp luật và đạo đức được thể hiện như thế nào?", "options": ["A. Pháp luật và đạo đức đều là những quy tắc điều chỉnh hành vi con người, hỗ trợ, bổ sung cho nhau trong việc giữ gìn trật tự xã hội.", "B. Pháp luật không liên quan gì đến đạo đức.", "C. Đạo đức thay thế hoàn toàn pháp luật trong xã hội hiện đại.", "D. Pháp luật và đạo đức hoàn toàn đối lập, loại trừ nhau."], "answer": "A", "explain": "Theo chương trình GDPT 2018, pháp luật và đạo đức đều điều chỉnh hành vi con người, có mối quan hệ hỗ trợ, bổ sung cho nhau: pháp luật là cơ sở để hình thành đạo đức, đạo đức là nền tảng tinh thần của pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Ba người bạn góp vốn thành lập công ty trách nhiệm hữu hạn kinh doanh dịch vụ du lịch, đã được cấp giấy chứng nhận đăng ký doanh nghiệp. Theo Luật Doanh nghiệp năm 2020, công ty trách nhiệm hữu hạn có tư cách pháp nhân không?", "options": ["A. Không, chỉ công ty cổ phần mới có tư cách pháp nhân.", "B. Có, nhưng chỉ sau 5 năm hoạt động.", "C. Không, mọi công ty trách nhiệm hữu hạn đều không có tư cách pháp nhân.", "D. Có, công ty trách nhiệm hữu hạn có tư cách pháp nhân kể từ ngày được cấp giấy chứng nhận đăng ký doanh nghiệp."], "answer": "D", "explain": "Theo Luật Doanh nghiệp 2020, công ty trách nhiệm hữu hạn có tư cách pháp nhân kể từ ngày được cấp giấy chứng nhận đăng ký doanh nghiệp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Ba người bạn góp vốn thành lập công ty trách nhiệm hữu hạn kinh doanh dịch vụ du lịch, đã được cấp giấy chứng nhận đăng ký doanh nghiệp. Nếu công ty làm ăn thua lỗ, các thành viên phải chịu trách nhiệm về các khoản nợ của công ty như thế nào?", "options": ["A. Chỉ người đại diện theo pháp luật phải chịu trách nhiệm.", "B. Chịu trách nhiệm vô hạn bằng toàn bộ tài sản của mình.", "C. Không phải chịu trách nhiệm gì.", "D. Chịu trách nhiệm hữu hạn trong phạm vi số vốn đã góp vào công ty."], "answer": "D", "explain": "Ưu điểm của công ty trách nhiệm hữu hạn là thành viên chỉ chịu trách nhiệm về các khoản nợ và nghĩa vụ tài sản khác của công ty trong phạm vi số vốn đã góp vào công ty.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ông V mở cửa hàng kinh doanh gas mà không có giấy phép kinh doanh và không đáp ứng điều kiện về phòng cháy chữa cháy. Hành vi này vi phạm quy định nào?", "options": ["A. Chỉ vi phạm đạo đức kinh doanh.", "B. Chỉ vi phạm khi xảy ra cháy nổ.", "C. Vi phạm quy định về điều kiện kinh doanh đối với ngành nghề kinh doanh có điều kiện.", "D. Không vi phạm vì kinh doanh là quyền tự do của công dân."], "answer": "C", "explain": "Kinh doanh gas là ngành nghề kinh doanh có điều kiện. Hiến pháp 2013 quy định mọi người có quyền tự do kinh doanh trong những ngành nghề mà luật không cấm, nhưng đối với ngành nghề có điều kiện phải đáp ứng đủ điều kiện mới được kinh doanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cơ sở sản xuất của bà T bị phát hiện sản xuất hàng nghìn chai nước mắm giả nhãn hiệu nổi tiếng để bán ra thị trường. Hành vi này bị xử lý như thế nào?", "options": ["A. Được khuyến khích vì tạo việc làm cho người lao động.", "B. Bị xử phạt vi phạm hành chính, tịch thu hàng giả và có thể bị truy cứu trách nhiệm hình sự về tội sản xuất, buôn bán hàng giả.", "C. Chỉ bị nhắc nhở và cho tiếp tục sản xuất.", "D. Không bị xử lý vì chưa ai bị ngộ độc."], "answer": "B", "explain": "Hành vi sản xuất, buôn bán hàng giả vi phạm pháp luật, bị xử phạt vi phạm hành chính, tịch thu tang vật và có thể bị truy cứu trách nhiệm hình sự về tội sản xuất, buôn bán hàng giả (Điều 192 Bộ luật Hình sự 2015).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Gia đình ông B có đất bị thu hồi để làm đường; ông B không đồng ý với phương án bồi thường. Theo quy định của pháp luật, ông B có quyền gì?", "options": ["A. Quyền tự ý tăng mức bồi thường theo ý mình.", "B. Không có quyền gì vì đất thuộc sở hữu toàn dân.", "C. Quyền từ chối giao đất trong mọi trường hợp.", "D. Quyền khiếu nại quyết định hành chính về bồi thường, hỗ trợ, tái định cư khi thu hồi đất."], "answer": "D", "explain": "Luật Đất đai 2024 và Luật Khiếu nại 2011 quy định người có đất bị thu hồi có quyền khiếu nại quyết định hành chính về bồi thường, hỗ trợ, tái định cư khi có căn cứ cho rằng quyết định đó trái pháp luật, xâm phạm quyền, lợi ích hợp pháp của mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Gia đình ông B có đất bị thu hồi để làm đường. Ông B không đồng ý với phương án bồi thường và đã khiếu nại lần đầu nhưng không được giải quyết thỏa đáng. Ông B có thể làm gì tiếp theo?", "options": ["A. Tự ý ngăn cản việc thi công công trình.", "B. Kêu gọi người dân tụ tập đông người gây rối.", "C. Không thể làm gì thêm vì khiếu nại lần đầu là quyết định cuối cùng.", "D. Khiếu nại lần hai đến cấp trên trực tiếp của người đã giải quyết lần đầu hoặc khởi kiện vụ án hành chính tại Tòa án."], "answer": "D", "explain": "Luật Khiếu nại 2011 và Luật Tố tụng hành chính quy định: người khiếu nại không đồng ý với quyết định giải quyết khiếu nại lần đầu thì có quyền khiếu nại lần hai hoặc khởi kiện vụ án hành chính tại Tòa án.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chị P phát hiện cán bộ địa chính xã vòi vĩnh tiền khi làm thủ tục cấp giấy chứng nhận quyền sử dụng đất cho gia đình chị. Chị P muốn phản ánh hành vi này. Theo Luật Tố cáo năm 2018, chị P được bảo đảm quyền nào?", "options": ["A. Phải công khai danh tính trên các phương tiện thông tin đại chúng.", "B. Chỉ được tố cáo nặc danh.", "C. Được bảo vệ bí mật thông tin cá nhân và được bảo vệ khi bị đe dọa, trả thù vì đã tố cáo.", "D. Không được bảo vệ vì tố cáo là việc tự nguyện."], "answer": "C", "explain": "Luật Tố cáo 2018 quy định người tố cáo được bảo vệ bí mật thông tin cá nhân, được bảo vệ tính mạng, sức khỏe, danh dự, nhân phẩm, tài sản khi bị đe dọa, trả thù vì việc tố cáo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Doanh nghiệp D hằng năm trích một phần lợi nhuận để xây trường học cho trẻ em nghèo, trồng cây xanh bảo vệ môi trường và thực hiện đầy đủ chế độ cho người lao động. Việc làm của doanh nghiệp D thể hiện nội dung nào?", "options": ["A. Hoạt động quảng cáo của doanh nghiệp.", "B. Nghĩa vụ nộp thuế của doanh nghiệp.", "C. Chiến lược trốn thuế của doanh nghiệp.", "D. Trách nhiệm xã hội của doanh nghiệp đối với cộng đồng, người lao động và môi trường."], "answer": "D", "explain": "Trách nhiệm xã hội của doanh nghiệp thể hiện ở việc quan tâm đến lợi ích của người lao động, cộng đồng, bảo vệ môi trường bên cạnh mục tiêu lợi nhuận.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Công ty cổ phần E huy động vốn bằng cách phát hành cổ phiếu ra công chúng. Anh Q mua 1000 cổ phiếu của công ty E và trở thành cổ đông. Theo Luật Doanh nghiệp năm 2020, anh Q có quyền nào?", "options": ["A. Trực tiếp điều hành mọi hoạt động hằng ngày của công ty.", "B. Rút vốn khỏi công ty bất cứ lúc nào dưới mọi hình thức.", "C. Tham dự, phát biểu và biểu quyết tại Đại hội đồng cổ đông; nhận cổ tức tương ứng với số cổ phần sở hữu.", "D. Quyết định mọi vấn đề của công ty một mình."], "answer": "C", "explain": "Điều 115 Luật Doanh nghiệp 2020: cổ đông phổ thông có quyền tham dự, phát biểu tại cuộc họp Đại hội đồng cổ đông và thực hiện quyền biểu quyết; được nhận cổ tức với mức theo quyết định của Đại hội đồng cổ đông.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh H đến trụ sở công an xã để trình báo vụ việc thì bị một cán bộ công an đánh gây thương tích vì cho rằng anh H báo tin giả. Theo quy định của pháp luật, hành vi của cán bộ công an này như thế nào?", "options": ["A. Là việc làm bình thường trong hoạt động công vụ.", "B. Là hành vi trái pháp luật; người bị hại có quyền khiếu nại, tố cáo; người vi phạm có thể bị xử lý kỷ luật, xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự về tội dùng nhục hình.", "C. Chỉ bị nhắc nhở nội bộ.", "D. Người dân không có quyền khiếu nại, tố cáo cán bộ công an."], "answer": "B", "explain": "Pháp luật nghiêm cấm hành vi dùng nhục hình, đối xử tàn bạo với người khác. Điều 373 Bộ luật Hình sự 2015 quy định tội dùng nhục hình. Người bị xâm phạm có quyền khiếu nại, tố cáo để bảo vệ quyền lợi của mình.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Doanh nghiệp F quảng cáo sản phẩm thực phẩm chức năng của mình có tác dụng chữa khỏi hoàn toàn bệnh ung thư trong 7 ngày, dù không có căn cứ khoa học. Nhiều người bệnh đã mua với giá cao. Hành vi này vi phạm những quy định nào?", "options": ["A. Chỉ vi phạm khi có người tử vong.", "B. Là hoạt động kinh doanh bình thường.", "C. Không vi phạm vì quảng cáo là quyền của doanh nghiệp.", "D. Vi phạm pháp luật về quảng cáo; cạnh tranh không lành mạnh bằng thông tin gian dối; xâm phạm quyền được cung cấp thông tin chính xác của người tiêu dùng."], "answer": "D", "explain": "Luật Quảng cáo 2012 cấm quảng cáo sai sự thật; Luật Cạnh tranh 2018 cấm đưa thông tin gian dối; Luật Bảo vệ quyền lợi người tiêu dùng 2023 bảo vệ quyền được cung cấp thông tin chính xác của người tiêu dùng. Hành vi quảng cáo thổi phồng công dụng thuốc vi phạm cả ba nhóm quy định này.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một nhóm người tổ chức hội thảo, lôi kéo hàng trăm người dân nộp tiền tham gia vào hệ thống kinh doanh đa cấp, hứa hẹn lợi nhuận cao bất thường và hoa hồng khi lôi kéo được người mới, nhưng thực chất không có hàng hóa thật. Nhận định nào sau đây là đúng?", "options": ["A. Đây là mô hình kinh doanh hiện đại được pháp luật khuyến khích.", "B. Chỉ vi phạm khi số tiền huy động trên 10 tỉ đồng.", "C. Người tham gia bị mất tiền thì tự chịu, pháp luật không bảo vệ.", "D. Đây là dấu hiệu của kinh doanh đa cấp bất chính bị pháp luật cấm; người dân cần tố cáo đến cơ quan chức năng; hành vi có dấu hiệu lừa đảo chiếm đoạt tài sản có thể bị truy cứu trách nhiệm hình sự."], "answer": "D", "explain": "Nghị định 40/2018/NĐ-CP cấm các hành vi kinh doanh đa cấp bất chính như yêu cầu nộp tiền để tham gia, hứa hẹn lợi nhuận bất thường. Hành vi huy động tiền bằng thủ đoạn gian dối có dấu hiệu tội lừa đảo chiếm đoạt tài sản (Điều 174 Bộ luật Hình sự 2015). Người dân cần cảnh giác và tố cáo đến cơ quan chức năng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Anh K và hai người bạn góp vốn thành lập công ty trách nhiệm hữu hạn hai thành viên trở lên để kinh doanh dịch vụ ăn uống. Công ty đã được cấp giấy chứng nhận đăng ký doanh nghiệp. Xét tính đúng, sai của các nhận định:", "statements": ["a) Công ty của anh K có tư cách pháp nhân kể từ ngày được cấp giấy chứng nhận đăng ký doanh nghiệp.", "b) Các thành viên phải chịu trách nhiệm vô hạn bằng toàn bộ tài sản của mình về các khoản nợ của công ty.", "c) Công ty phải đăng ký kinh doanh trước khi tiến hành hoạt động kinh doanh.", "d) Mọi ngành nghề đều được tự do kinh doanh mà không cần đáp ứng điều kiện gì."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: công ty trách nhiệm hữu hạn có tư cách pháp nhân từ ngày được cấp giấy chứng nhận đăng ký doanh nghiệp. b) Sai: thành viên chỉ chịu trách nhiệm hữu hạn trong phạm vi vốn đã góp. c) Đúng: doanh nghiệp phải đăng ký kinh doanh theo quy định trước khi hoạt động. d) Sai: ngành nghề kinh doanh có điều kiện phải đáp ứng đủ điều kiện mới được kinh doanh.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Gia đình bà S có đất bị thu hồi để xây dựng trường học. Bà S không đồng ý với mức giá bồi thường và đã làm đơn khiếu nại. Xét tính đúng, sai của các nhận định:", "statements": ["a) Bà S có quyền khiếu nại quyết định hành chính về bồi thường khi thu hồi đất.", "b) Thời hiệu khiếu nại quyết định hành chính là 90 ngày kể từ ngày nhận được quyết định.", "c) Bà S có quyền khởi kiện vụ án hành chính tại Tòa án nếu không đồng ý với việc giải quyết khiếu nại.", "d) Khiếu nại lần hai do chính người đã giải quyết khiếu nại lần đầu tiếp tục giải quyết."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Điều 2 Luật Khiếu nại 2011. b) Đúng: thời hiệu khiếu nại là 90 ngày (Điều 9). c) Đúng: người khiếu nại có quyền khởi kiện vụ án hành chính tại Tòa án. d) Sai: khiếu nại lần hai do thủ trưởng cấp trên trực tiếp của người đã giải quyết khiếu nại lần đầu giải quyết.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Tình huống: Anh T phát hiện giám đốc công ty nơi mình làm việc lập chứng từ giả để chiếm đoạt tiền của công ty. Anh T làm đơn tố cáo gửi cơ quan công an. Sau đó, anh T bị giám đốc đe dọa sẽ cho nghỉ việc. Xét tính đúng, sai của các nhận định:", "statements": ["a) Mọi cá nhân đều có quyền tố cáo hành vi vi phạm pháp luật đến cơ quan có thẩm quyền.", "b) Anh T được pháp luật bảo vệ bí mật thông tin cá nhân và bảo vệ khi bị đe dọa, trả thù vì đã tố cáo.", "c) Tố cáo chỉ được thực hiện bằng đơn, không được trình bày trực tiếp.", "d) Người tố cáo sai sự thật, vu khống thì phải chịu trách nhiệm trước pháp luật."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Luật Tố cáo 2018, mọi cá nhân có quyền tố cáo. b) Đúng: người tố cáo được bảo vệ bí mật thông tin và được bảo vệ khi bị đe dọa, trả thù. c) Sai: tố cáo được thực hiện bằng đơn hoặc trình bày trực tiếp với cơ quan có thẩm quyền. d) Đúng: người cố ý tố cáo sai sự thật thì tùy mức độ bị xử lý kỷ luật, xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: Một nhóm người về địa phương tổ chức hội thảo, lôi kéo người dân nộp 5 triệu đồng một người để tham gia hệ thống bán hàng đa cấp, hứa hẹn mỗi tháng được hưởng lợi nhuận 30 phần trăm và hoa hồng cao khi lôi kéo thêm người mới, nhưng không có hàng hóa thật được giao dịch. Nhiều người dân đã nộp tiền. Xét tính đúng, sai của các nhận định:", "statements": ["a) Kinh doanh đa cấp bất chính với thủ đoạn yêu cầu nộp tiền, hứa hẹn lợi nhuận bất thường là hành vi bị pháp luật cấm.", "b) Hứa hẹn lợi nhuận cao bất thường và lôi kéo nộp tiền là dấu hiệu của đa cấp biến tướng, lừa đảo.", "c) Người dân bị mất tiền trong vụ việc này thì không được pháp luật bảo vệ.", "d) Hành vi huy động tiền bằng thủ đoạn gian dối có thể bị truy cứu trách nhiệm hình sự về tội lừa đảo chiếm đoạt tài sản."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Nghị định 40/2018/NĐ-CP cấm kinh doanh đa cấp bất chính. b) Đúng: đây là những dấu hiệu điển hình của đa cấp biến tướng. c) Sai: người bị hại được pháp luật bảo vệ, có quyền tố cáo, khởi kiện yêu cầu bồi thường. d) Đúng: hành vi dùng thủ đoạn gian dối chiếm đoạt tài sản có dấu hiệu tội lừa đảo chiếm đoạt tài sản (Điều 174 Bộ luật Hình sự 2015).", "points": 1}]}]}</script>
