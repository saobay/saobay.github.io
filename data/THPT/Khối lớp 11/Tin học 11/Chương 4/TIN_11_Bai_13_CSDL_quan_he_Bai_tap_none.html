<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Mô hình dữ liệu quan hệ tổ chức dữ liệu thành gì?","options":["A. Các bảng","B. Các cây phân cấp","C. Các đồ thị","D. Các tệp văn bản"],"answer":"A","explain":"Mô hình dữ liệu quan hệ tổ chức dữ liệu thành các bảng (quan hệ) gồm hàng và cột.","points":0.25},{"type":"mcq","level":"NB","q":"Mỗi hàng trong bảng của cơ sở dữ liệu quan hệ được gọi là gì?","options":["A. Thuộc tính","B. Bản ghi (bộ dữ liệu)","C. Khóa chính","D. Miền giá trị"],"answer":"B","explain":"Mỗi hàng là một bản ghi (bộ dữ liệu), mô tả một đối tượng cụ thể.","points":0.25},{"type":"mcq","level":"NB","q":"Mỗi cột trong bảng của cơ sở dữ liệu quan hệ được gọi là gì?","options":["A. Bản ghi","B. Thuộc tính (trường)","C. Khóa ngoài","D. Bảng"],"answer":"B","explain":"Mỗi cột là một thuộc tính (trường), mô tả một đặc trưng của đối tượng.","points":0.25},{"type":"mcq","level":"TH","q":"Khóa chính của một bảng là gì?","options":["A. Cột có giá trị phân biệt duy nhất mỗi hàng, dùng để nhận diện bản ghi","B. Cột có nhiều giá trị trùng lặp nhất","C. Hàng đầu tiên của bảng","D. Tên của bảng"],"answer":"A","explain":"Khóa chính là cột (hoặc tập hợp cột) có giá trị duy nhất cho mỗi hàng, dùng để nhận diện bản ghi.","points":0.25},{"type":"mcq","level":"TH","q":"Trong bảng HOCSINH (MaHS, Hoten, Ngaysinh, Lop), cột nào phù hợp nhất làm khóa chính?","options":["A. Hoten","B. Ngaysinh","C. MaHS","D. Lop"],"answer":"C","explain":"MaHS có giá trị khác nhau cho mỗi học sinh nên phù hợp làm khóa chính.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao cột Hoten không nên được chọn làm khóa chính của bảng HOCSINH?","options":["A. Vì họ tên quá dài","B. Vì có thể có hai học sinh trùng họ tên","C. Vì họ tên không phải chữ cái","D. Vì họ tên thay đổi theo thời gian"],"answer":"B","explain":"Khóa chính yêu cầu giá trị duy nhất; hai học sinh có thể trùng họ tên nên Hoten không đảm bảo tính duy nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về bảng trong mô hình quan hệ:","statements":["a) Bảng còn được gọi là quan hệ.","b) Hàng trong bảng được gọi là thuộc tính.","c) Cột trong bảng được gọi là thuộc tính.","d) Ô trong bảng chứa một giá trị cụ thể."],"answer":["T","F","T","T"],"explain":"a) Đúng: bảng = quan hệ. b) Sai: hàng là bản ghi, cột mới là thuộc tính. c) Đúng: cột = thuộc tính (trường). d) Đúng: ô là giao của hàng và cột, chứa một giá trị.","points":1},{"type":"truefalse","level":"VD","q":"Cho bảng HOCSINH (khóa chính MaHS) và bảng DIEM (MaHS, Mon, Diem). Xét tính đúng, sai của các khẳng định sau:","statements":["a) MaHS là khóa chính của bảng HOCSINH.","b) MaHS trong bảng DIEM là khóa ngoài.","c) Cột Hoten có thể làm khóa chính của HOCSINH.","d) Giá trị khóa chính được phép để trống."],"answer":["T","T","F","F"],"explain":"a) Đúng: MaHS phân biệt mỗi học sinh. b) Đúng: MaHS trong DIEM tham chiếu tới HOCSINH. c) Sai: họ tên có thể trùng. d) Sai: khóa chính không được để trống.","points":1},{"type":"short","level":"TH","q":"Trong bảng DIEM (MaHS, Mon, Diem), cột MaHS tham chiếu tới bảng HOCSINH. Cột MaHS trong bảng DIEM được gọi là khóa gì?","answer":"khóa ngoài","explain":"Cột tham chiếu tới khóa chính của bảng khác được gọi là khóa ngoài.","points":0.5},{"type":"short","level":"VDC","q":"Một lớp có 40 học sinh, mỗi học sinh có điểm của 5 môn. Bảng DIEM (MaHS, Mon, Diem) sẽ có bao nhiêu hàng?","answer":"200","explain":"Mỗi học sinh có 5 hàng điểm nên tổng là 40 * 5 = 200 hàng.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Khóa ngoài là gì?","options":["A. Cột tham chiếu tới khóa chính của bảng khác","B. Cột có giá trị duy nhất trong bảng","C. Hàng đầu tiên của bảng","D. Tên của cơ sở dữ liệu"],"answer":"A","explain":"Khóa ngoài là cột trong bảng này tham chiếu tới khóa chính của bảng khác.","points":0.25},{"type":"mcq","level":"NB","q":"Tác dụng chính của khóa ngoài là gì?","options":["A. Liên kết dữ liệu giữa các bảng","B. Sắp xếp các hàng","C. Đếm số hàng","D. Mã hóa dữ liệu"],"answer":"A","explain":"Khóa ngoài tạo liên kết giữa các bảng, giúp kết nối dữ liệu liên quan mà không trùng lặp.","points":0.25},{"type":"mcq","level":"TH","q":"Ràng buộc đối với giá trị khóa chính là gì?","options":["A. Không được trùng lặp và không được để trống","B. Được trùng lặp thoải mái","C. Được để trống","D. Phải là số nguyên"],"answer":"A","explain":"Khóa chính dùng để nhận diện duy nhất mỗi bản ghi nên không được trùng và không được trống.","points":0.25},{"type":"mcq","level":"TH","q":"Bảng HOCSINH chưa có học sinh mã HS99. Thêm hàng (HS99, Toán, 8.0) vào bảng DIEM thì hệ quản trị sẽ làm gì?","options":["A. Từ chối vì vi phạm ràng buộc khóa ngoài","B. Chấp nhận bình thường","C. Tự tạo học sinh HS99","D. Xóa bảng DIEM"],"answer":"A","explain":"Giá trị khóa ngoài HS99 không tồn tại trong khóa chính của HOCSINH nên vi phạm toàn vẹn tham chiếu, bị từ chối.","points":0.25},{"type":"mcq","level":"VD","q":"Liên kết một-nhiều có nghĩa là gì? Cho ví dụ đúng.","options":["A. Một bản ghi bảng này ứng với nhiều bản ghi bảng kia, ví dụ một lớp có nhiều học sinh","B. Mọi bản ghi đều độc lập","C. Một bản ghi ứng với đúng một bản ghi","D. Nhiều bản ghi ứng với nhiều bản ghi"],"answer":"A","explain":"Một-nhiều: một bản ghi ở bảng một ứng với nhiều bản ghi ở bảng nhiều, ví dụ một lớp có nhiều học sinh.","points":0.25},{"type":"mcq","level":"VDC","q":"Mối liên kết nhiều-nhiều giữa học sinh và môn học được thể hiện như thế nào trong CSDL quan hệ?","options":["A. Dùng một bảng trung gian chứa khóa ngoài tham chiếu tới cả hai bảng","B. Gộp tất cả vào một bảng","C. Không thể thể hiện được","D. Dùng khóa chính chung"],"answer":"A","explain":"Liên kết nhiều-nhiều cần bảng trung gian (ví dụ bảng DIEM) chứa khóa ngoài tham chiếu tới cả hai bảng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về khóa ngoài:","statements":["a) Khóa ngoài tham chiếu tới khóa chính của bảng khác.","b) Giá trị khóa ngoài phải là duy nhất trong bảng.","c) Giá trị khóa ngoài được phép trùng lặp.","d) Xóa hàng đang được khóa ngoài tham chiếu không gây vấn đề gì."],"answer":["T","F","T","F"],"explain":"a) Đúng: định nghĩa khóa ngoài. b) Sai: nhiều hàng có thể cùng tham chiếu một giá trị (ví dụ nhiều điểm của cùng một HS). c) Đúng: ví dụ MaHS lặp lại trong bảng DIEM. d) Sai: vi phạm toàn vẹn tham chiếu, hệ quản trị sẽ từ chối hoặc cảnh báo.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về các kiểu liên kết:","statements":["a) Một học sinh có nhiều điểm thi là liên kết một-nhiều.","b) Một môn học có nhiều học sinh theo học là liên kết một-nhiều.","c) Học sinh và môn học có liên kết nhiều-nhiều.","d) Một học sinh và hồ sơ sức khỏe của em đó là liên kết một-một."],"answer":["T","T","T","T"],"explain":"a) Đúng: 1 HS - n điểm. b) Đúng: 1 môn - n HS. c) Đúng: n HS - m môn. d) Đúng: mỗi HS có một hồ sơ.","points":1},{"type":"short","level":"NB","q":"Bảng HOCSINH mẫu có 3 hàng và 4 cột. Bảng này có bao nhiêu ô dữ liệu?","answer":"12","explain":"Số ô bằng số hàng nhân số cột: 3 * 4 = 12.","points":0.5},{"type":"short","level":"VDC","q":"Ràng buộc nào bị vi phạm khi thêm điểm cho một mã học sinh không tồn tại trong bảng HOCSINH? (Trả lời: ràng buộc ...)","answer":"ràng buộc khóa ngoài","explain":"Giá trị khóa ngoài phải tồn tại trong khóa chính của bảng được tham chiếu; vi phạm gọi là vi phạm ràng buộc khóa ngoài (toàn vẹn tham chiếu).","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Ô trong bảng của cơ sở dữ liệu quan hệ chứa gì?","options":["A. Một giá trị cụ thể tại giao của một hàng và một cột","B. Toàn bộ một hàng","C. Toàn bộ một cột","D. Tên của bảng"],"answer":"A","explain":"Ô là giao của một hàng và một cột, chứa một giá trị dữ liệu cụ thể.","points":0.25},{"type":"mcq","level":"NB","q":"Ràng buộc toàn vẹn trong cơ sở dữ liệu quan hệ là gì?","options":["A. Các quy tắc giữ cho dữ liệu luôn đúng đắn và nhất quán","B. Mật khẩu bảo vệ cơ sở dữ liệu","C. Số lượng bảng tối đa","D. Tốc độ truy vấn"],"answer":"A","explain":"Ràng buộc toàn vẹn là các quy tắc (miền giá trị, khóa chính, khóa ngoài) đảm bảo dữ liệu đúng đắn và nhất quán.","points":0.25},{"type":"mcq","level":"TH","q":"Ví dụ nào sau đây về ràng buộc miền giá trị là đúng?","options":["A. Điểm số phải từ 0 đến 10","B. Họ tên phải là số","C. Ngày sinh phải trong tương lai","D. Mã số được để trống"],"answer":"A","explain":"Ràng buộc miền giá trị yêu cầu giá trị thuộc miền cho phép, ví dụ điểm số từ 0 đến 10.","points":0.25},{"type":"mcq","level":"NB","q":"Vì sao người ta tách dữ liệu thành hai bảng HOCSINH và DIEM thay vì gộp chung một bảng?","options":["A. Để tránh lưu trùng lặp họ tên, lớp của học sinh","B. Để bảng trông đẹp hơn","C. Vì một bảng chỉ chứa được 3 cột","D. Để tăng số lượng bảng"],"answer":"A","explain":"Tách bảng giúp mỗi thông tin chỉ lưu một lần; nếu gộp chung, họ tên và lớp sẽ lặp lại ở mỗi hàng điểm gây trùng lặp.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn biết họ tên của học sinh có điểm Toán bằng 9, ta cần làm gì?","options":["A. Kết nối bảng DIEM với bảng HOCSINH qua cột MaHS","B. Chỉ cần nhìn bảng DIEM","C. Chỉ cần nhìn bảng HOCSINH","D. Không thể biết được"],"answer":"A","explain":"Bảng DIEM chỉ có MaHS; muốn biết họ tên phải kết nối với HOCSINH qua khóa ngoài MaHS.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng LOP (MaLop, TenLop) và bảng HOCSINH có cột MaLop là khóa ngoài tham chiếu tới LOP. Đây là liên kết loại gì?","options":["A. Một-nhiều (một lớp có nhiều học sinh)","B. Một-một","C. Nhiều-nhiều","D. Không liên kết"],"answer":"A","explain":"Một lớp có nhiều học sinh nhưng mỗi học sinh thuộc một lớp nên là liên kết một-nhiều.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cơ sở dữ liệu quan hệ gồm nhiều bảng liên kết với nhau.","b) Mỗi bảng trong cơ sở dữ liệu hoàn toàn độc lập.","c) Khóa ngoài tạo ra liên kết giữa các bảng.","d) Lưu trùng lặp dữ liệu là điều nên làm."],"answer":["T","F","T","F"],"explain":"a) Đúng: các bảng liên kết thành thể thống nhất. b) Sai: các bảng liên kết qua khóa ngoài. c) Đúng: đó là vai trò của khóa ngoài. d) Sai: trùng lặp gây tốn bộ nhớ và sai lệch khi cập nhật.","points":1},{"type":"truefalse","level":"VD","q":"Cho bảng DIEM mẫu (HS01-Toán-9.0, HS01-Văn-8.0, HS02-Toán-7.5). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cột MaHS có giá trị trùng lặp.","b) Cột MaHS là khóa chính của bảng DIEM.","c) Cặp (MaHS, Mon) phân biệt được mỗi hàng.","d) Cột Diem là khóa ngoài."],"answer":["T","F","T","F"],"explain":"a) Đúng: HS01 xuất hiện 2 lần. b) Sai: MaHS trùng nên không làm khóa chính được. c) Đúng: mỗi học sinh mỗi môn chỉ có một điểm. d) Sai: Diem chỉ là thuộc tính thông thường.","points":1},{"type":"short","level":"VD","q":"Trong bảng DIEM mẫu trên, cặp cột nào có thể được chọn làm khóa chính? (Trả lời dạng: cột1, cột2)","answer":"MaHS, Mon","explain":"Mỗi học sinh mỗi môn chỉ có một điểm nên cặp (MaHS, Mon) phân biệt duy nhất mỗi hàng.","points":0.5},{"type":"short","level":"VDC","q":"Một trường có 3 khối lớp 11, mỗi khối có 40 học sinh. Bảng HOCSINH của trường có bao nhiêu hàng?","answer":"120","explain":"Tổng số học sinh là 3 * 40 = 120, mỗi học sinh một hàng.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Mô hình dữ liệu quan hệ được đề xuất bởi ai?","options":["A. E. F. Codd","B. Bill Gates","C. Alan Turing","D. Tim Berners-Lee"],"answer":"A","explain":"Nhà khoa học E. F. Codd đề xuất mô hình dữ liệu quan hệ vào năm 1970.","points":0.25},{"type":"mcq","level":"NB","q":"Thuộc tính trong mô hình quan hệ chính là gì?","options":["A. Cột của bảng","B. Hàng của bảng","C. Tên cơ sở dữ liệu","D. Khóa chính"],"answer":"A","explain":"Thuộc tính (trường) chính là cột của bảng.","points":0.25},{"type":"mcq","level":"TH","q":"Bộ dữ liệu trong mô hình quan hệ chính là gì?","options":["A. Hàng của bảng","B. Cột của bảng","C. Toàn bộ bảng","D. Một ô"],"answer":"A","explain":"Bộ dữ liệu (bản ghi) chính là hàng của bảng.","points":0.25},{"type":"mcq","level":"TH","q":"Khóa chính gồm nhiều cột (ví dụ cặp MaHS, Mon) được gọi là gì?","options":["A. Khóa chính phức hợp","B. Khóa ngoài","C. Khóa đơn","D. Khóa phụ"],"answer":"A","explain":"Khóa chính tạo từ nhiều cột được gọi là khóa chính phức hợp.","points":0.25},{"type":"mcq","level":"VD","q":"Một bảng có 1000 hàng. Số giá trị trùng lặp tối đa cho phép ở cột khóa chính là bao nhiêu?","options":["A. 0","B. 1","C. 500","D. 1000"],"answer":"A","explain":"Khóa chính không được trùng lặp nên số giá trị trùng cho phép là 0.","points":0.25},{"type":"mcq","level":"VDC","q":"Bảng DIEM còn lưu điểm của học sinh HS01. Nếu xóa hàng HS01 khỏi bảng HOCSINH thì điều gì xảy ra?","options":["A. Vi phạm toàn vẹn tham chiếu, hệ quản trị từ chối hoặc cảnh báo","B. Không có vấn đề gì","C. Bảng DIEM tự động bị xóa","D. Điểm của HS01 tự chuyển cho học sinh khác"],"answer":"A","explain":"Xóa hàng đang được khóa ngoài tham chiếu sẽ làm khóa ngoài trỏ tới giá trị không tồn tại, vi phạm toàn vẹn tham chiếu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về thuật ngữ:","statements":["a) E. F. Codd là người đề xuất mô hình dữ liệu quan hệ.","b) Bảng trong cơ sở dữ liệu còn được gọi là quan hệ.","c) Hàng trong bảng được gọi là thuộc tính.","d) Cột trong bảng còn được gọi là trường."],"answer":["T","T","F","T"],"explain":"a) Đúng: ông đề xuất năm 1970. b) Đúng: bảng = quan hệ. c) Sai: hàng là bản ghi, cột mới là thuộc tính. d) Đúng: cột = trường.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về khóa:","statements":["a) Khóa chính phức hợp gồm nhiều cột.","b) Khóa ngoài tham chiếu tới khóa chính của bảng khác.","c) Một bảng được phép có nhiều khóa ngoài.","d) Hai bảng khác nhau không được đặt tên cột trùng nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng: ví dụ cặp (MaHS, Mon). b) Đúng: định nghĩa khóa ngoài. c) Đúng: ví dụ bảng MUON có 2 khóa ngoài. d) Sai: các bảng khác nhau hoàn toàn được đặt tên cột trùng nhau.","points":1},{"type":"short","level":"NB","q":"Trong bảng HOCSINH mẫu của bài (MaHS, Hoten, Ngaysinh, Lop), khóa chính là cột nào?","answer":"MaHS","explain":"Cột MaHS có giá trị duy nhất cho mỗi học sinh nên là khóa chính.","points":0.5},{"type":"short","level":"VDC","q":"Một bảng có 5 cột và 20 hàng. Bảng này có bao nhiêu ô dữ liệu?","answer":"100","explain":"Số ô bằng 5 * 20 = 100.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Ví dụ nào sau đây về liên kết một-một là đúng?","options":["A. Một học sinh và hồ sơ sức khỏe của em đó","B. Một lớp và các học sinh của lớp","C. Một học sinh và các môn học","D. Một giáo viên và các lớp dạy"],"answer":"A","explain":"Mỗi học sinh có đúng một hồ sơ sức khỏe và ngược lại nên là liên kết một-một.","points":0.25},{"type":"mcq","level":"NB","q":"Ví dụ nào sau đây về liên kết một-nhiều là đúng?","options":["A. Một học sinh và một hồ sơ sức khỏe","B. Một lớp và các học sinh của lớp đó","C. Một học sinh và một môn học duy nhất","D. Một điểm số và một học sinh"],"answer":"B","explain":"Một lớp có nhiều học sinh nhưng mỗi học sinh thuộc một lớp nên là một-nhiều.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cần ràng buộc toàn vẹn tham chiếu đối với khóa ngoài?","options":["A. Để đảm bảo giá trị khóa ngoài luôn tồn tại ở bảng được tham chiếu","B. Để tăng tốc độ máy tính","C. Để giảm số lượng bảng","D. Để mã hóa dữ liệu"],"answer":"A","explain":"Ràng buộc này đảm bảo mọi giá trị khóa ngoài đều trỏ tới một bản ghi có thật, giữ liên kết đúng đắn.","points":0.25},{"type":"mcq","level":"TH","q":"Nếu quy định điểm số từ 0 đến 10, việc nhập điểm 15 có vi phạm ràng buộc nào không?","options":["A. Có, vi phạm ràng buộc miền giá trị","B. Không vi phạm gì","C. Vi phạm ràng buộc khóa chính","D. Vi phạm ràng buộc khóa ngoài"],"answer":"A","explain":"Điểm 15 nằm ngoài miền cho phép từ 0 đến 10 nên vi phạm ràng buộc miền giá trị.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng MONHOC (MaMon, TenMon) và bảng DIEM (MaHS, MaMon, Diem). Cột MaMon trong bảng DIEM là gì?","options":["A. Khóa ngoài tham chiếu tới bảng MONHOC","B. Khóa chính của bảng DIEM","C. Thuộc tính thông thường","D. Khóa chính của bảng MONHOC"],"answer":"A","explain":"MaMon trong DIEM tham chiếu tới khóa chính MaMon của MONHOC nên là khóa ngoài.","points":0.25},{"type":"mcq","level":"VDC","q":"Muốn lưu trữ thông tin: mỗi học sinh học nhiều môn, mỗi môn có nhiều học sinh theo học. Cần tối thiểu bao nhiêu bảng?","options":["A. 1","B. 2","C. 3","D. 4"],"answer":"C","explain":"Cần 3 bảng: HOCSINH, MONHOC và bảng trung gian (ví dụ DIEM) thể hiện liên kết nhiều-nhiều.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về trùng lặp:","statements":["a) Dữ liệu trong mô hình quan hệ được tổ chức thành các bảng.","b) Mỗi hàng mô tả một đối tượng cụ thể.","c) Mỗi cột mô tả một đặc trưng của đối tượng.","d) Một ô có thể chứa nhiều giá trị."],"answer":["T","T","T","F"],"explain":"a) Đúng: bảng là đơn vị tổ chức. b) Đúng: hàng = bản ghi về một đối tượng. c) Đúng: cột = thuộc tính. d) Sai: mỗi ô chỉ chứa một giá trị duy nhất.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về vai trò của MaHS:","statements":["a) Bảng DIEM cần cột MaHS để biết điểm của học sinh nào.","b) Không có MaHS vẫn biết được điểm của ai.","c) Cột MaHS trong bảng DIEM được phép có giá trị trùng lặp.","d) Cột MaHS trong bảng HOCSINH được phép có giá trị trùng lặp."],"answer":["T","F","T","F"],"explain":"a) Đúng: MaHS là cầu nối tới HOCSINH. b) Sai: không có MaHS thì không biết điểm của ai. c) Đúng: một HS có nhiều điểm. d) Sai: MaHS là khóa chính nên không được trùng.","points":1},{"type":"short","level":"VD","q":"Liên kết một lớp có nhiều học sinh thuộc loại liên kết nào? (Trả lời: một-...)","answer":"một-nhiều","explain":"Một lớp ứng với nhiều học sinh nên là liên kết một-nhiều.","points":0.5},{"type":"short","level":"VDC","q":"Cột MaHS trong bảng DIEM tham chiếu tới khóa chính của bảng nào?","answer":"HOCSINH","explain":"MaHS là khóa ngoài tham chiếu tới khóa chính MaHS của bảng HOCSINH.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Thuật ngữ tiếng Anh của khóa chính là gì?","options":["A. Primary Key","B. Foreign Key","C. Candidate Key","D. Main Key"],"answer":"A","explain":"Khóa chính trong tiếng Anh là Primary Key.","points":0.25},{"type":"mcq","level":"NB","q":"Thuật ngữ tiếng Anh của khóa ngoài là gì?","options":["A. Primary Key","B. Foreign Key","C. Outside Key","D. Second Key"],"answer":"B","explain":"Khóa ngoài trong tiếng Anh là Foreign Key.","points":0.25},{"type":"mcq","level":"TH","q":"Cột Diem trong bảng DIEM có thể được chọn làm khóa chính không? Vì sao?","options":["A. Không, vì nhiều học sinh có thể trùng điểm số","B. Có, vì điểm số là duy nhất","C. Có, vì điểm số không bao giờ trống","D. Không, vì điểm số là số thập phân"],"answer":"A","explain":"Nhiều học sinh có thể cùng điểm số nên cột Diem không đảm bảo tính duy nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Trong bảng DIEM mẫu (HS01-Toán, HS01-Văn, HS02-Toán), cặp giá trị (MaHS, Mon) có bị trùng lặp không?","options":["A. Không, mỗi học sinh mỗi môn chỉ có một điểm","B. Có, HS01 lặp lại","C. Có, môn Toán lặp lại","D. Không xác định được"],"answer":"A","explain":"Mỗi cặp (học sinh, môn học) chỉ xuất hiện một lần nên không trùng lặp.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn thêm cột Diem2 vào bảng DIEM đã có, ta dùng câu lệnh SQL nào?","options":["A. ALTER TABLE","B. INSERT","C. UPDATE","D. CREATE TABLE"],"answer":"A","explain":"ALTER TABLE dùng để sửa cấu trúc bảng như thêm cột mới.","points":0.25},{"type":"mcq","level":"VDC","q":"Bảng HOCSINH có 500 hàng, mỗi học sinh có điểm của 8 môn. Bảng DIEM (MaHS, MaMon, Diem) có bao nhiêu hàng?","options":["A. 500","B. 4000","C. 508","D. 4500"],"answer":"B","explain":"Mỗi học sinh có 8 hàng điểm nên tổng là 500 * 8 = 4000 hàng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về thuật ngữ tiếng Anh:","statements":["a) Primary key là thuật ngữ tiếng Anh của khóa chính.","b) Foreign key là thuật ngữ tiếng Anh của khóa ngoài.","c) Giá trị khóa chính được phép trùng lặp.","d) Khóa ngoài tham chiếu tới khóa chính của bảng khác."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: khóa chính không được trùng. d) Đúng: định nghĩa khóa ngoài.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về liên kết hai bảng HOCSINH và DIEM:","statements":["a) Hai bảng liên kết với nhau qua cột MaHS.","b) Có thể liên kết mà không cần cột chung.","c) Liên kết giúp tránh lưu trùng lặp họ tên, lớp.","d) Muốn biết điểm của ai phải kết nối hai bảng."],"answer":["T","F","T","T"],"explain":"a) Đúng: MaHS là cầu nối. b) Sai: cần cột chung (khóa ngoài). c) Đúng: không phải lặp lại họ tên ở mỗi hàng điểm. d) Đúng: DIEM chỉ có mã, muốn biết tên phải nối với HOCSINH.","points":1},{"type":"short","level":"NB","q":"Hàng trong bảng còn được gọi là gì?","answer":"bản ghi","explain":"Hàng trong bảng còn được gọi là bản ghi (bộ dữ liệu).","points":0.5},{"type":"short","level":"VDC","q":"Cột trong bảng còn được gọi là gì?","answer":"thuộc tính","explain":"Cột trong bảng còn được gọi là thuộc tính (trường).","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Ràng buộc miền giá trị kiểm tra điều gì?","options":["A. Giá trị của cột phải thuộc kiểu dữ liệu và miền cho phép","B. Số lượng hàng của bảng","C. Tên của bảng","D. Quyền truy cập"],"answer":"A","explain":"Ràng buộc miền giá trị yêu cầu mỗi giá trị phải thuộc kiểu dữ liệu và miền giá trị đã quy định cho cột.","points":0.25},{"type":"mcq","level":"NB","q":"Ví dụ nào sau đây vi phạm ràng buộc miền giá trị (điểm từ 0 đến 10)?","options":["A. Điểm 8.5","B. Điểm 15","C. Điểm 0","D. Điểm 10"],"answer":"B","explain":"Điểm 15 nằm ngoài miền từ 0 đến 10 nên vi phạm ràng buộc miền giá trị.","points":0.25},{"type":"mcq","level":"TH","q":"Có nên chọn cột Hoten làm khóa chính của bảng HOCSINH không? Vì sao?","options":["A. Không nên, vì có thể có hai học sinh trùng họ tên","B. Nên, vì họ tên luôn duy nhất","C. Nên, vì họ tên ngắn gọn","D. Không nên, vì họ tên khó viết"],"answer":"A","explain":"Họ tên có thể trùng nhau nên không đảm bảo tính duy nhất của khóa chính.","points":0.25},{"type":"mcq","level":"NB","q":"Số căn cước công dân có thể làm khóa chính được không? Vì sao?","options":["A. Được, vì mỗi người có một số duy nhất","B. Không, vì số quá dài","C. Không, vì ai cũng nhớ","D. Được, vì là số chẵn"],"answer":"A","explain":"Số căn cước có giá trị duy nhất cho mỗi người và không trống nên phù hợp làm khóa chính.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng SACH (MaSach, TenSach) và bảng MUON (MaHS, MaSach, NgayMuon). Bảng MUON có mấy khóa ngoài?","options":["A. 0","B. 1","C. 2","D. 3"],"answer":"C","explain":"Bảng MUON có 2 khóa ngoài: MaHS tham chiếu HOCSINH và MaSach tham chiếu SACH.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao không nên gộp bảng DIEM vào bảng HOCSINH (mỗi hàng gồm MaHS, Hoten, Lop, Mon, Diem)?","options":["A. Vì họ tên và lớp sẽ lặp lại ở mỗi môn học, gây trùng lặp","B. Vì bảng sẽ quá ít cột","C. Vì không thể lưu điểm số","D. Vì vi phạm cú pháp SQL"],"answer":"A","explain":"Mỗi học sinh học nhiều môn nên họ tên, lớp sẽ lặp lại nhiều lần gây trùng lặp và khó cập nhật.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về việc chọn khóa chính:","statements":["a) Số căn cước công dân duy nhất nên làm khóa chính được.","b) Họ tên là lựa chọn tốt cho khóa chính.","c) Ngày sinh có thể làm khóa chính.","d) Mã số định danh duy nhất là khóa chính tốt."],"answer":["T","F","F","T"],"explain":"a) Đúng: duy nhất và không trống. b) Sai: họ tên có thể trùng. c) Sai: nhiều người trùng ngày sinh. d) Đúng: mã định danh đảm bảo tính duy nhất.","points":1},{"type":"truefalse","level":"VD","q":"Cho bảng SACH (MaSach, TenSach) và bảng MUON (MaHS, MaSach, NgayMuon). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bảng MUON có 2 khóa ngoài.","b) MaSach trong MUON tham chiếu tới bảng SACH.","c) MaHS trong MUON tham chiếu tới bảng HOCSINH.","d) Bảng MUON không cần khóa chính."],"answer":["T","T","T","F"],"explain":"a) Đúng: MaHS và MaSach. b) Đúng: tham chiếu khóa chính của SACH. c) Đúng: tham chiếu khóa chính của HOCSINH. d) Sai: vẫn cần khóa chính để phân biệt các lượt mượn, ví dụ cặp (MaHS, MaSach, NgayMuon).","points":1},{"type":"short","level":"VD","q":"Giá trị khóa chính không được phép làm gì? (Trả lời: không được ...)","answer":"để trống","explain":"Khóa chính dùng để nhận diện bản ghi nên không được để trống (cũng không được trùng lặp).","points":0.5},{"type":"short","level":"VDC","q":"Mỗi học sinh có đúng một hồ sơ sức khỏe. Liên kết giữa học sinh và hồ sơ sức khỏe thuộc loại nào? (Trả lời: một-...)","answer":"một-một","explain":"Mỗi học sinh ứng với đúng một hồ sơ và ngược lại nên là liên kết một-một.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Toàn vẹn tham chiếu có nghĩa là gì?","options":["A. Giá trị khóa ngoài phải tồn tại trong khóa chính của bảng được tham chiếu","B. Mọi bảng phải có cùng số hàng","C. Không được xóa bất kỳ hàng nào","D. Mọi cột phải có cùng kiểu dữ liệu"],"answer":"A","explain":"Toàn vẹn tham chiếu yêu cầu giá trị khóa ngoài phải trỏ tới một bản ghi có thật ở bảng được tham chiếu.","points":0.25},{"type":"mcq","level":"NB","q":"Khi nào thì vi phạm toàn vẹn tham chiếu?","options":["A. Khi thêm hoặc sửa khóa ngoài thành giá trị không tồn tại ở bảng tham chiếu","B. Khi truy vấn dữ liệu","C. Khi sắp xếp kết quả","D. Khi tạo bảng mới"],"answer":"A","explain":"Khóa ngoài trỏ tới giá trị không tồn tại sẽ làm mất liên kết, vi phạm toàn vẹn tham chiếu.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn xóa một hàng đang được khóa ngoài của bảng khác tham chiếu tới, hệ quản trị sẽ làm gì?","options":["A. Từ chối hoặc cảnh báo vi phạm toàn vẹn tham chiếu","B. Xóa luôn không hỏi","C. Tự động tạo hàng mới","D. Bỏ qua"],"answer":"A","explain":"Xóa hàng được tham chiếu sẽ làm khóa ngoài trỏ tới giá trị không tồn tại nên hệ quản trị từ chối hoặc cảnh báo.","points":0.25},{"type":"mcq","level":"TH","q":"Bảng trung gian được dùng trong trường hợp nào?","options":["A. Liên kết nhiều-nhiều","B. Liên kết một-một","C. Bảng chỉ có một hàng","D. Không bao giờ dùng"],"answer":"A","explain":"Liên kết nhiều-nhiều cần bảng trung gian chứa khóa ngoài tham chiếu tới cả hai bảng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng LOP (MaLop, TenLop) và bảng HOCSINH có thêm cột MaLop. Cột MaLop trong HOCSINH là gì?","options":["A. Khóa ngoài tham chiếu tới bảng LOP","B. Khóa chính của HOCSINH","C. Khóa chính của LOP","D. Thuộc tính thông thường"],"answer":"A","explain":"MaLop trong HOCSINH tham chiếu tới khóa chính MaLop của LOP nên là khóa ngoài.","points":0.25},{"type":"mcq","level":"VDC","q":"Cần quản lý: học sinh, lớp, môn học và điểm số. Số bảng tối thiểu cần thiết kế là bao nhiêu?","options":["A. 2","B. 3","C. 4","D. 6"],"answer":"C","explain":"Cần 4 bảng: LOP, HOCSINH, MONHOC và DIEM (bảng trung gian lưu điểm của từng học sinh từng môn).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về toàn vẹn tham chiếu:","statements":["a) Toàn vẹn tham chiếu bảo vệ sự đúng đắn của liên kết.","b) Được phép thêm điểm cho mã học sinh không tồn tại.","c) Được phép xóa học sinh còn điểm mà không cần cảnh báo.","d) Khóa ngoài sai làm mất liên kết giữa các bảng."],"answer":["T","F","F","T"],"explain":"a) Đúng: đó là mục đích của ràng buộc. b) Sai: bị từ chối. c) Sai: hệ quản trị từ chối hoặc cảnh báo. d) Đúng: khóa ngoài phải trỏ tới bản ghi có thật.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về bảng trung gian:","statements":["a) Bảng trung gian của liên kết nhiều-nhiều có 2 khóa ngoài.","b) Liên kết nhiều-nhiều cần bảng trung gian.","c) Liên kết một-nhiều không cần khóa ngoài.","d) Liên kết một-một có thể gộp chung vào một bảng."],"answer":["T","T","F","T"],"explain":"a) Đúng: tham chiếu tới cả hai bảng. b) Đúng: ví dụ bảng DIEM. c) Sai: một-nhiều vẫn cần khóa ngoài ở bảng nhiều. d) Đúng: vì mỗi bản ghi ứng với đúng một bản ghi.","points":1},{"type":"short","level":"NB","q":"Khóa ngoài tham chiếu tới cái gì của bảng khác?","answer":"khóa chính","explain":"Khóa ngoài tham chiếu tới khóa chính của bảng khác.","points":0.5},{"type":"short","level":"VDC","q":"Một trường có 10 lớp, mỗi lớp 40 học sinh, mỗi học sinh có điểm 6 môn. Bảng DIEM (MaHS, MaMon, Diem) có bao nhiêu hàng?","answer":"2400","explain":"Tổng số học sinh là 10 * 40 = 400; mỗi em 6 hàng điểm nên tổng là 400 * 6 = 2400 hàng.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Lưu trùng lặp dữ liệu gây ra hậu quả gì?","options":["A. Tốn bộ nhớ, khó cập nhật và dễ sai lệch","B. Làm máy chạy nhanh hơn","C. Không gây hậu quả gì","D. Giúp dữ liệu an toàn hơn"],"answer":"A","explain":"Trùng lặp gây tốn bộ nhớ lưu trữ, khi cập nhật phải sửa nhiều nơi nên dễ sai lệch, thiếu nhất quán.","points":0.25},{"type":"mcq","level":"NB","q":"Mục đích của việc tách dữ liệu thành nhiều bảng liên kết là gì?","options":["A. Giảm trùng lặp dữ liệu","B. Tăng số lượng bảng cho đẹp","C. Làm khó người dùng","D. Tăng dung lượng lưu trữ"],"answer":"A","explain":"Tách bảng giúp mỗi thông tin chỉ lưu một lần, giảm trùng lặp và dễ cập nhật, nhất quán.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đã tách thành hai bảng HOCSINH và DIEM, muốn sửa họ tên của một học sinh thì chỉ cần sửa ở đâu?","options":["A. Chỉ cần sửa một hàng trong bảng HOCSINH","B. Phải sửa mọi hàng điểm của học sinh đó","C. Phải tạo bảng mới","D. Không thể sửa được"],"answer":"A","explain":"Họ tên chỉ lưu một lần ở bảng HOCSINH nên chỉ cần sửa một hàng duy nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Nếu không tách bảng (gộp chung họ tên vào bảng điểm), muốn sửa họ tên của một học sinh phải sửa bao nhiêu nơi?","options":["A. Mọi hàng điểm của học sinh đó","B. Chỉ một nơi","C. Không cần sửa","D. Sửa tên bảng"],"answer":"A","explain":"Họ tên lặp lại ở mỗi hàng điểm nên phải sửa tất cả các hàng, dễ sót và sai lệch.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng KHACHHANG (MaKH, TenKH) và bảng DONHANG (MaDon, MaKH, NgayDat). Đây là liên kết loại gì?","options":["A. Một-nhiều (một khách hàng có nhiều đơn hàng)","B. Một-một","C. Nhiều-nhiều","D. Không liên kết"],"answer":"A","explain":"Một khách hàng có thể đặt nhiều đơn hàng, mỗi đơn thuộc một khách hàng nên là một-nhiều.","points":0.25},{"type":"mcq","level":"VDC","q":"Mỗi khách hàng có ít nhất 2 đơn hàng, tổng số đơn hàng là 1000. Số khách hàng tối đa là bao nhiêu?","options":["A. 1000","B. 500","C. 2000","D. 100"],"answer":"B","explain":"Mỗi khách hàng ít nhất 2 đơn nên số khách hàng nhiều nhất là 1000 / 2 = 500.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về trùng lặp dữ liệu:","statements":["a) Trùng lặp dữ liệu gây tốn bộ nhớ lưu trữ.","b) Trùng lặp dữ liệu dễ gây sai lệch khi cập nhật.","c) Tách bảng giúp giảm trùng lặp dữ liệu.","d) Nên lưu mọi thông tin vào chung một bảng."],"answer":["T","T","T","F"],"explain":"a) Đúng: cùng thông tin lưu nhiều lần. b) Đúng: sửa sót một nơi gây thiếu nhất quán. c) Đúng: mỗi thông tin chỉ lưu một lần. d) Sai: nên tách thành nhiều bảng liên kết.","points":1},{"type":"truefalse","level":"VD","q":"Cho bảng KHACHHANG (MaKH, TenKH) và bảng DONHANG (MaDon, MaKH, NgayDat). Xét tính đúng, sai của các khẳng định sau:","statements":["a) MaKH trong DONHANG là khóa ngoài.","b) Một khách hàng có thể có nhiều đơn hàng.","c) Một đơn hàng thuộc về nhiều khách hàng.","d) Xóa khách hàng còn đơn hàng vi phạm toàn vẹn tham chiếu."],"answer":["T","T","F","T"],"explain":"a) Đúng: tham chiếu tới KHACHHANG. b) Đúng: liên kết một-nhiều. c) Sai: mỗi đơn chỉ thuộc một khách hàng. d) Đúng: đơn hàng sẽ trỏ tới khách hàng không tồn tại.","points":1},{"type":"short","level":"VD","q":"Khi đã tách bảng, muốn sửa họ tên của một học sinh thì chỉ cần sửa ở bảng nào?","answer":"HOCSINH","explain":"Họ tên chỉ lưu ở bảng HOCSINH nên chỉ cần sửa một hàng duy nhất tại đó.","points":0.5},{"type":"short","level":"VDC","q":"Mỗi đơn hàng thuộc về đúng một khách hàng, một khách hàng có nhiều đơn hàng. Đây là liên kết loại gì? (Trả lời: một-...)","answer":"một-nhiều","explain":"Một khách hàng ứng với nhiều đơn hàng nên là liên kết một-nhiều.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Bảng trong cơ sở dữ liệu quan hệ còn được gọi là gì?","options":["A. Quan hệ","B. Cây","C. Đồ thị","D. Tệp"],"answer":"A","explain":"Bảng còn được gọi là quan hệ (relation), do đó mô hình có tên là mô hình dữ liệu quan hệ.","points":0.25},{"type":"mcq","level":"NB","q":"Mỗi hàng trong bảng của cơ sở dữ liệu quan hệ mô tả điều gì?","options":["A. Một đối tượng cụ thể","B. Một đặc trưng của đối tượng","C. Toàn bộ cơ sở dữ liệu","D. Một câu lệnh SQL"],"answer":"A","explain":"Mỗi hàng là một bản ghi mô tả một đối tượng cụ thể, ví dụ một học sinh.","points":0.25},{"type":"mcq","level":"TH","q":"Mỗi cột trong bảng của cơ sở dữ liệu quan hệ mô tả điều gì?","options":["A. Một đối tượng cụ thể","B. Một đặc trưng (thuộc tính) của đối tượng","C. Toàn bộ bảng","D. Một giá trị duy nhất"],"answer":"B","explain":"Mỗi cột là một thuộc tính, mô tả một đặc trưng của đối tượng, ví dụ họ tên, lớp.","points":0.25},{"type":"mcq","level":"TH","q":"Mỗi học sinh có một mã số duy nhất. Cột MaHS trong bảng HOCSINH là gì?","options":["A. Khóa chính","B. Khóa ngoài","C. Thuộc tính thông thường","D. Bảng"],"answer":"A","explain":"Mã số duy nhất cho mỗi học sinh, dùng để nhận diện bản ghi nên là khóa chính.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn thiết kế bảng lưu điểm thi, các cột cần thiết là gì?","options":["A. MaHS (khóa ngoài), MaMon, Diem","B. Hoten, Ngaysinh, Lop","C. Chỉ cần cột Diem","D. TenMon, TenHS, Diem"],"answer":"A","explain":"Bảng điểm cần khóa ngoài MaHS để biết của ai, mã môn và điểm số; họ tên tra cứu qua liên kết.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao cột MaHS đơn lẻ không đủ làm khóa chính của bảng DIEM?","options":["A. Vì mỗi học sinh có nhiều điểm nên MaHS bị trùng lặp","B. Vì MaHS quá ngắn","C. Vì MaHS là chữ","D. Vì DIEM không cần khóa chính"],"answer":"A","explain":"Một học sinh có nhiều hàng điểm nên MaHS lặp lại, không đảm bảo tính duy nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tên gọi:","statements":["a) Bảng trong cơ sở dữ liệu quan hệ còn gọi là quan hệ.","b) Hàng trong bảng còn gọi là bản ghi.","c) Cột trong bảng còn gọi là thuộc tính.","d) Khóa chính có thể là thuộc tính bất kỳ."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: khóa chính phải đảm bảo tính duy nhất và không trống.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về khóa chính của bảng DIEM:","statements":["a) Cặp (MaHS, Mon) phân biệt được mỗi hàng.","b) Cột MaHS đơn lẻ phân biệt được mỗi hàng.","c) Cột Mon đơn lẻ phân biệt được mỗi hàng.","d) Nên chọn cặp (MaHS, Mon) làm khóa chính."],"answer":["T","F","F","T"],"explain":"a) Đúng: mỗi HS mỗi môn một điểm. b) Sai: MaHS trùng. c) Sai: Mon trùng. d) Đúng: cặp này đảm bảo tính duy nhất.","points":1},{"type":"short","level":"NB","q":"Khóa chính của bảng HOCSINH trong bài là cột nào?","answer":"MaHS","explain":"Cột MaHS có giá trị duy nhất cho mỗi học sinh nên là khóa chính.","points":0.5},{"type":"short","level":"VDC","q":"Mỗi học sinh có điểm của 5 môn học. Bảng DIEM của 40 học sinh có bao nhiêu hàng?","answer":"200","explain":"Mỗi học sinh có 5 hàng điểm nên tổng là 40 * 5 = 200 hàng.","points":0.5}]}]}
