L","D. Bỏ quản lí"],"points":0.25,"q":"Bài học lớn của bài là gì?","type":"mcq"},{"answer":"A","explain":"CSDL cần hệ quản trị CSDL để vận hành.","level":"NB","options":["A. Hệ quản trị CSDL","B. Không cần gì thêm","C. Sổ sách","D. Giấy tờ"],"points":0.25,"q":"Để vận hành CSDL cần thêm thành phần nào?","type":"mcq"},{"answer":"A","explain":"CSDL phục vụ nhiều người dùng.","level":"TH","options":["A. Nhiều người dùng","B. Một người","C. Không ai","D. Chỉ máy móc"],"points":0.25,"q":"Ai sử dụng CSDL?","type":"mcq"},{"answer":"A","explain":"CSDL giúp khai thác thông tin nhanh và chính xác.","level":"TH","options":["A. Nhanh và chính xác","B. Chậm","C. Sai nhiều","D. Khó khăn"],"points":0.25,"q":"CSDL giúp khai thác thông tin thế nào?","type":"mcq"},{"answer":"A","explain":"CSDL là bước phát triển từ lưu trữ file đơn lẻ.","level":"VD","options":["A. Là bước phát triển từ file đơn lẻ","B. Không liên quan","C. Là bước thụt lùi","D. Như nhau"],"points":0.25,"q":"So với Bài 10, CSDL có quan hệ gì với file đơn lẻ?","type":"mcq"},{"answer":"A","explain":"Thư viện, ngân hàng, trường học đều dùng CSDL.","level":"VDC","options":["A. Nhận ra CSDL quanh ta như thư viện, ngân hàng","B. Không vận dụng được","C. Quên hết kiến thức","D. Không cần vận dụng"],"points":0.25,"q":"Vận dụng: kể tên nơi sử dụng CSDL quanh ta?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: rất cần.","level":"NB","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về bài học lớn:","statements":["a) CSDL tốt hơn file đơn lẻ.","b) CSDL cần hệ quản trị.","c) Nhiều người cùng dùng CSDL.","d) Không cần CSDL."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a,b,c) Đúng: vận dụng. d) Sai: nhiều nơi dùng.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về vận dụng:","statements":["a) Thư viện dùng CSDL quản lí sách.","b) Ngân hàng dùng CSDL quản lí tài khoản.","c) Trường học dùng CSDL quản lí học sinh.","d) Không nơi nào dùng CSDL."],"type":"truefal
