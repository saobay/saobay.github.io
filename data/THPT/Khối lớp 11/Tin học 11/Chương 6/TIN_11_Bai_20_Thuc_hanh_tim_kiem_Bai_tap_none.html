ắp xếp.","d) Không tìm thấy x thì trả về -1."],"type":"truefalse"},{"answer":["T","T","F","T"],"explain":"a) Đúng: so sánh a[0], a[1], a[2]. b) Đúng: chỉ 1 lần so sánh. c) Sai: chỉ cần 4 lần so sánh. d) Đúng: x không có thì duyệt hết mảng.","level":"VDC","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về số lần so sánh khi tìm kiếm tuần tự trên a = [4, 7, 2, 9]:","statements":["a) Tìm x = 2 cần 3 lần so sánh.","b) Tìm x = 4 cần 1 lần so sánh.","c) Tìm x = 9 cần 5 lần so sánh.","d) Trường hợp xấu nhất phải duyệt hết mảng."],"type":"truefalse"},{"answer":"2","explain":"a[0]=5, a[1]=1, a[2]=8 bằng 8 nên trả về 2.","level":"NB","points":0.5,"q":"Cho a = [5, 1, 8, 3]. Hàm tim_tuan_tu(a, 8) trả về kết quả nào?","type":"short"},{"answer":"1","explain":"Số 4 xuất hiện 1 lần trong mảng nên dem = 1.","level":"TH","points":0.5,"q":"Đoạn lệnh: a = [2, 4, 6, 8]; dem = 0; for v in a: if v == 4: dem = dem + 1; print(dem). Kết quả là?","type":"short"}]},{"name":"Đề 2","questions":[{"answer":"A","explain":"Tìm kiếm nhị phân chỉ đúng khi mảng đã được sắp xếp tăng dần.","level":"NB","options":["A. Đã được sắp xếp tăng dần","B. Chưa được sắp xếp","C. Chỉ gồm số 0","D. Có đúng 10 phần tử"],"points":0.25,"q":"Muốn dùng tìm kiếm nhị phân, mảng phải thỏa điều kiện gì?","type":"mcq"},{"answer":"A","explain":"Mỗi bước so sánh x với phần tử giữa, rồi loại bỏ một nửa khoảng tìm kiếm.","level":"NB","options":["A. So sánh x với phần tử giữa rồi loại bỏ một nửa","B. Duyệt từng phần tử một","C. Sắp xếp lại mảng","D. Đảo ngược mảng"],"points":0.25,"q":"Mỗi bước của tìm kiếm nhị phân thực hiện việc gì?","type":"mcq"},{"answer":"A","explain":"Mỗi bước loại một nửa nên số bước khoảng log2(n), độ phức tạp O(log n).","level":"NB","options":["A. O(log n)","B. O(n)","C. O(n^2)","D. O(1)"],"points":0.25,"q":"Độ phức tạp thời gian của tìm kiếm nhị phân là gì?","type":"mcq"},{"answer":"A","explain":"Bước 1: giua=2, a[2]=8 nhỏ hơn 12 nên trai=3. Bước 2: giua=4, a[4]=16 lớn hơn 12 nên phai=3. Bước 3: giua=3, a[3]=12 nên trả về 3.","level":"TH","options":["A. 3","B. 2","C. 4","D. -1"],"points":0.25,"q":"Cho a = [2, 5, 8, 12, 16, 23] đã sắp xếp. Hàm tim_nhi_phan(a, 12) trả về kết quả nào?","type":"mcq"},{"answer":"A","explain":"Bước 1: giua=2, a[2]=8 lớn hơn 2 nên phai=1. Bước 2: giua=0, a[0]=2 nên trả về 0.","level":"TH","options":["A. 0","B. 1","C. 2","D. -1"],"points":0.25,"q":"Cho a = [2, 5, 8, 12, 16, 23] đã sắp xếp. Hàm tim_nhi_phan(a, 2) trả về kết quả nào?","type":"mcq"},{"answer":"A","explain":"Bước 1: giua=3, a[3]=7 nhỏ hơn 13 nên trai=4. Bước 2: giua=5, a[5]=11 nhỏ hơn 13 nên trai=6. Bước 3: giua=6, a[6]=13 nên trả về 6.","level":"VD","options":["A. 6","B. 5","C. 3","D. -1"],"points":0.25,"q":"Cho a = [1, 3, 5, 7, 9, 11, 13] đã sắp xếp. Hàm tim_nhi_phan(a, 13) trả về kết quả nào?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a) Đúng: điều kiện bắt buộc. b) Đúng: đó là ý tưởng cốt lõi. c) Đúng: O(log n) tốt hơn O(n) khi n lớn. d) Sai: mảng chưa sắp xếp cho kết quả sai.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về tìm kiếm nhị phân:","statements":["a) Thuật toán chỉ cho kết quả đúng trên mảng đã sắp xếp.","b) Mỗi bước loại bỏ một nửa khoảng tìm kiếm.","c) Với n lớn, nhị phân nhanh hơn tuần tự.","d) Có thể dùng nhị phân cho mảng chưa sắp xếp."],"type":"truefalse"},{"answer":["T","T","F","T"],"explain":"a) Đúng: công thức chuẩn. b) Đúng: tìm thấy thì trả về ngay. c) Sai: a[giua] lớn hơn x thì bỏ nửa phải, tức phai = giua - 1. d) Đúng: a[giua] nhỏ hơn x thì bỏ nửa trái.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về chỉ số giữa trong tìm kiếm nhị phân:","statements":["a) Chỉ số giữa tính bằng giua = (trai + phai) // 2.","b) Nếu a[giua] == x thì trả về giua.","c) Nếu a[giua] lớn hơn x thì bỏ nửa trái của khoảng tìm kiếm.","d) Nếu a[giua] nhỏ hơn x thì gán trai = giua + 1."],"type":"truefalse"},{"answer":"2","explain":"trai=0, phai=5 nên giua = (0 + 5) // 2 = 2.","level":"TH","points":0.5,"q":"Cho a = [1, 4, 7, 10, 13, 16] đã sắp xếp, x = 10. Ở bước đầu tiên, chỉ số giua bằng bao nhiêu?","type":"short"},{"answer":"5","explain":"Bước 1: giua=2 (a=8 nhỏ hơn 23, trai=3). Bước 2: giua=4 (a=16 nhỏ hơn 23, trai=5). Bước 3: giua=5, a[5]=23 nên trả về 5.","level":"VDC","points":0.5,"q":"Cho a = [2, 5, 8, 12, 16, 23] đã sắp xếp. Hàm tim_nhi_phan(a, 23) trả về kết quả nào?","type":"short"}]},{"name":"Đề 3","questions":[{"answer":"A","explain":"Xấu nhất phải duyệt cả n phần tử nên độ phức tạp O(n).","level":"NB","options":["A. O(n)","B. O(log n)","C. O(1)","D. O(n^2)"],"points":0.25,"q":"Độ phức tạp của tìm kiếm tuần tự trong trường hợp xấu nhất là gì?","type":"mcq"},{"answer":"A","explain":"Tốt nhất là x ở ngay vị trí đầu, chỉ 1 lần so sánh, O(1).","level":"NB","options":["A. x ở vị trí đầu tiên","B. x ở vị trí cuối cùng","C. x không có trong mảng","D. Mảng rỗng"],"points":0.25,"q":"Trường hợp tốt nhất của tìm kiếm tuần tự là khi nào?","type":"mcq"},{"answer":"A","explain":"So sánh lần lượt a[0]=5, a[1]=3, a[2]=8, a[3]=1 bằng 1 nên cần 4 lần.","level":"TH","options":["A. 4","B. 3","C. 5","D. 1"],"points":0.25,"q":"Cho a = [5, 3, 8, 1, 9]. Tìm x = 1 bằng tìm kiếm tuần tự cần bao nhiêu lần so sánh?","type":"mcq"},{"answer":"A","explain":"x = 6 không có nên phải so sánh cả 5 phần tử.","level":"TH","options":["A. 5","B. 4","C. 6","D. 0"],"points":0.25,"q":"Cho a = [5, 3, 8, 1, 9]. Tìm x = 6 (không có trong mảng) cần bao nhiêu lần so sánh?","type":"mcq"},{"answer":"A","explain":"log2(1000) xấp xỉ 10 nên nhị phân cần tối đa khoảng 10 bước.","level":"VD","options":["A. 10","B. 1000","C. 500","D. 100"],"points":0.25,"q":"Mảng 1000 phần tử đã sắp xếp. Tìm kiếm nhị phân cần tối đa khoảng bao nhiêu bước?","type":"mcq"},{"answer":"A","explain":"Mỗi bước loại một nửa nên khoảng tìm kiếm giảm dần: 1024, 512, ..., 1; cần đúng 10 lần lặp.","level":"VDC","options":["A. 10","B. 9","C. 11","D. 512"],"points":0.25,"q":"Mảng a = [1, 2, ..., 1024] (1024 phần tử tăng dần). Tìm x = 1 bằng nhị phân cần bao nhiêu lần lặp?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: n rất nhỏ thì chênh lệch không đáng kể. d) Đúng: tốt nhất chỉ 1 lần so sánh.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về độ phức tạp của hai thuật toán tìm kiếm:","statements":["a) Tìm kiếm tuần tự trong trường hợp xấu nhất có độ phức tạp O(n).","b) Tìm kiếm nhị phân có độ phức tạp O(log n).","c) Nhị phân luôn nhanh hơn tuần tự với mọi kích thước n.","d) Tìm kiếm tuần tự trong trường hợp tốt nhất có độ phức tạp O(1)."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a) Đúng: 2^3 = 8. b) Đúng: 2^4 = 16. c) Đúng: trung bình duyệt một nửa mảng. d) Sai: chỉ cần khoảng 10 bước.","level":"VDC","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về số lần so sánh tối đa:","statements":["a) Với n = 8, nhị phân cần tối đa 3 lần so sánh.","b) Với n = 16, nhị phân cần tối đa 4 lần so sánh.","c) Tuần tự trung bình cần khoảng n/2 lần so sánh.","d) Với n = 1000, nhị phân cần tới 1000 lần so sánh."],"type":"truefalse"},{"answer":"O(n)","explain":"Xấu nhất duyệt hết n phần tử nên độ phức tạp O(n).","level":"NB","points":0.5,"q":"Độ phức tạp của tìm kiếm tuần tự trong trường hợp xấu nhất là gì? (viết dạng O(n))","type":"short"},{"answer":"3","explain":"So sánh a[0]=10, a[1]=20, a[2]=30 bằng 30 nên cần 3 lần.","level":"TH","points":0.5,"q":"Cho a = [10, 20, 30]. Tìm x = 30 bằng tìm kiếm tuần tự cần bao nhiêu lần so sánh?","type":"short"}]},{"name":"Đề 4","questions":[{"answer":"A","explain":"Đếm số lần xuất hiện phải duyệt hết mảng, không được dừng sớm.","level":"NB","options":["A. Duyệt hết mảng","B. Dừng khi gặp lần đầu","C. Chỉ duyệt nửa đầu","D. Duyệt ngược từ cuối"],"points":0.25,"q":"Để đếm số lần x xuất hiện trong mảng, vòng lặp phải làm gì?","type":"mcq"},{"answer":"A","explain":"Hàm co_mat kiểm tra sự tồn tại nên trả về True hoặc False.","level":"NB","options":["A. True/False","B. Chỉ số của x","C. Một mảng mới","D. Một số thực"],"points":0.25,"q":"Hàm co_mat(a, x) kiểm tra x có trong mảng không sẽ trả về kiểu dữ liệu gì?","type":"mcq"},{"answer":"A","explain":"Số 2 xuất hiện 3 lần nên dem = 3.","level":"TH","options":["A. 3","B. 2","C. 5","D. 1"],"points":0.25,"q":"Cho a = [2, 5, 2, 8, 2]. Hàm dem(a, 2) đếm số lần xuất hiện của 2 trả về bao nhiêu?","type":"mcq"},{"answer":"A","explain":"7 không có trong mảng nên trả về False.","level":"TH","options":["A. False","B. True","C. -1","D. 0"],"points":0.25,"q":"Cho a = [2, 5, 2, 8, 2]. Hàm co_mat(a, 7) trả về kết quả nào?","type":"mcq"},{"answer":"A","explain":"Duyệt từ cuối: i=4 (9 khác), i=3 (2 bằng) nên trả về 3.","level":"VD","options":["A. 3","B. 1","C. 4","D. -1"],"points":0.25,"q":"Cho a = [4, 2, 7, 2, 9]. Muốn tìm vị trí CUỐI CÙNG của số 2, duyệt từ cuối mảng về đầu thì trả về chỉ số nào?","type":"mcq"},{"answer":"A","explain":"Ghi nhớ mỗi lần gặp 3: vt lần lượt là 1, 3, 5; cuối cùng vt = 5.","level":"VDC","options":["A. 5","B. 1","C. 3","D. 6"],"points":0.25,"q":"Đoạn lệnh: a = [1, 3, 5, 3, 7, 3, 9]; vt = -1; for i in range(len(a)): if a[i] == 3: vt = i; print(vt). Kết quả là?","type":"mcq"},{"answer":["T","T","T","T"],"explain":"a) Đúng: không được return sớm. b) Đúng: cách đơn giản nhất. c) Đúng: đó là mục đích của hàm. d) Đúng: return ngay khi gặp lần đầu.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về các biến thể của bài toán tìm kiếm:","statements":["a) Đếm số lần xuất hiện của x phải duyệt hết mảng.","b) Tìm vị trí cuối cùng của x có thể duyệt từ cuối mảng về đầu.","c) Kiểm tra sự tồn tại của x trả về True hoặc False.","d) Tìm kiếm tuần tự cơ bản dừng lại ở lần gặp x đầu tiên."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a) Đúng: đó là cách tìm vị trí đầu tiên. b) Đúng: ghi nhớ vt mỗi lần gặp. c) Đúng: phải duyệt hết. d) Sai: co_mat trả về True/False, không trả về chỉ số.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về cài đặt các biến thể tìm kiếm:","statements":["a) Muốn vị trí đầu tiên của x thì return ngay khi gặp x.","b) Muốn vị trí cuối cùng của x thì ghi nhớ vị trí mỗi lần gặp, không return sớm.","c) Muốn đếm số lần xuất hiện thì không được return sớm.","d) Hàm kiểm tra tồn tại co_mat nên trả về chỉ số của x."],"type":"truefalse"},{"answer":"3","explain":"Số 7 xuất hiện 3 lần nên dem = 3.","level":"TH","points":0.5,"q":"Cho a = [7, 3, 7, 1, 7] và hàm dem đếm số lần xuất hiện. Lệnh print(dem(a, 7)) in ra gì?","type":"short"},{"answer":"5","explain":"Ghi nhớ vị trí mỗi lần gặp 2: vt lần lượt là 1, 3, 5; cuối cùng là 5.","level":"VDC","points":0.5,"q":"Đoạn lệnh: a = [4, 2, 7, 2, 9, 2]; vt = -1; for i in range(len(a)): if a[i] == 2: vt = i; print(vt). Kết quả là?","type":"short"}]},{"name":"Đề 5","questions":[{"answer":"A","explain":"Nhị phân trên mảng chưa sắp xếp loại bỏ nhầm nửa chứa x nên kết quả sai.","level":"NB","options":["A. Cho kết quả sai","B. Báo lỗi cú pháp","C. Làm máy bị treo","D. Không có lỗi gì"],"points":0.25,"q":"Lỗi thường gặp nào xảy ra khi dùng tìm kiếm nhị phân trên mảng chưa sắp xếp?","type":"mcq"},{"answer":"A","explain":"Chỉ số giữa phải là số nguyên nên dùng phép chia nguyên //.","level":"NB","options":["A. (trai + phai) // 2","B. (trai + phai) / 2","C. trai + phai","D. (phai - trai) // 2"],"points":0.25,"q":"Công thức tính chỉ số giữa đúng trong tìm kiếm nhị phân là gì?","type":"mcq"},{"answer":"A","explain":"Mảng [5, 1, 4, 2, 3] chưa sắp xếp nên không được dùng nhị phân.","level":"TH","options":["A. Mảng chưa được sắp xếp","B. Mảng quá ngắn","C. Mảng thiếu phần tử","D. Giá trị x quá lớn"],"points":0.25,"q":"Cho a = [5, 1, 4, 2, 3]. Vì sao không nên dùng tìm kiếm nhị phân để tìm x = 4?","type":"mcq"},{"answer":"A","explain":"a[giua] lớn hơn x nghĩa là x nằm ở nửa trái nên phai = giua - 1.","level":"TH","options":["A. phai = giua - 1","B. trai = giua + 1","C. return giua","D. break"],"points":0.25,"q":"Trong tìm kiếm nhị phân, khi a[giua] lớn hơn x thì cập nhật thế nào?","type":"mcq"},{"answer":"A","explain":"Bước 1: giua = 3, a[3] = 12 bằng x nên trả về 3 ngay.","level":"VD","options":["A. 3","B. 0","C. 6","D. -1"],"points":0.25,"q":"Cho a = [3, 6, 9, 12, 15, 18, 21] đã sắp xếp. Hàm tim_nhi_phan(a, 12) trả về kết quả nào?","type":"mcq"},{"answer":"A","explain":"a[giua] == max(a[giua], x) nghĩa là a[giua] lớn hơn hoặc bằng x; thêm điều kiện khác x để được lớn hơn hẳn.","level":"VDC","options":["A. a[giua] == max(a[giua], x) and a[giua] != x","B. a[giua] == min(a[giua], x)","C. a[giua] != x","D. a[giua] == x"],"points":0.25,"q":"Muốn viết lại điều kiện a[giua] lớn hơn x mà không dùng dấu lớn hơn, cách nào đúng?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a) Đúng: điều kiện bắt buộc. b) Đúng: chia nguyên cho chỉ số nguyên. c) Sai: thiếu return -1 thì hàm trả về None gây nhầm lẫn. d) Đúng: return giúp thoát sớm.","level":"NB","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về điều kiện đúng của tìm kiếm nhị phân:","statements":["a) Mảng phải được sắp xếp tăng dần trước khi tìm kiếm.","b) Chỉ số giữa tính bằng (trai + phai) // 2.","c) Quên lệnh return -1 cuối hàm vẫn cho kết quả đúng với mọi test.","d) Lệnh return trong vòng lặp giúp dừng sớm khi đã tìm thấy."],"type":"truefalse"},{"answer":["T","T","T","T"],"explain":"a) Đúng: loại nhầm nửa chứa x. b) Đúng: khoảng tìm kiếm có thể không thu hẹp. c) Đúng: max cho giá trị lớn hơn hoặc bằng. d) Đúng: tuần tự chỉ so sánh bằng nên luôn đúng.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về các lỗi thường gặp:","statements":["a) Dùng nhị phân trên mảng chưa sắp xếp cho kết quả sai.","b) Tính chỉ số giua sai có thể gây lặp vô hạn hoặc kết quả sai.","c) Biểu thức a[giua] == max(a[giua], x) tương đương với a[giua] lớn hơn hoặc bằng x.","d) Tìm kiếm tuần tự không bao giờ cho kết quả sai."],"type":"truefalse"},{"answer":"2","explain":"a[0]=9, a[1]=4, a[2]=7 bằng 7 nên trả về 2.","level":"NB","points":0.5,"q":"Cho a = [9, 4, 7, 1], x = 7. Tìm kiếm tuần tự trả về chỉ số nào?","type":"short"},{"answer":"7","explain":"Bước 1: giua=3 (a=4 nhỏ hơn 8, trai=4). Bước 2: giua=5 (a=6 nhỏ hơn 8, trai=6). Bước 3: giua=6 (a=7 nhỏ hơn 8, trai=7). Bước 4: giua=7, a[7]=8 nên trả về 7.","level":"VDC","points":0.5,"q":"Cho a = [1, 2, 3, 4, 5, 6, 7, 8] đã sắp xếp. Hàm tim_nhi_phan(a, 8) trả về kết quả nào?","type":"short"}]},{"name":"Đề 6","questions":[{"answer":"A","explain":"Hiểu đề và chọn thuật toán phù hợp trước khi viết code.","level":"NB","options":["A. Hiểu đề và chọn thuật toán phù hợp","B. Viết code ngay lập tức","C. Xóa các bài cũ","D. Tắt máy tính"],"points":0.25,"q":"Trong thực hành, trước khi viết chương trình tìm kiếm nên làm gì?","type":"mcq"},{"answer":"A","explain":"Trace là ghi lại giá trị các biến qua từng bước chạy.","level":"NB","options":["A. Ghi lại giá trị các biến qua từng bước chạy","B. Xóa các biến không dùng","C. Chạy chương trình thật nhanh","D. Dịch code sang ngôn ngữ khác"],"points":0.25,"q":"Trace (vết) chương trình nghĩa là gì?","type":"mcq"},{"answer":"A","explain":"i=0: 10 khác 20; i=1: 30 khác 20; i=2: 20 bằng 20 nên trả về 2.","level":"TH","options":["A. 2","B. 1","C. 3","D. -1"],"points":0.25,"q":"Cho a = [10, 30, 20, 40], x = 20. Trace tìm kiếm tuần tự cho kết quả nào?","type":"mcq"},{"answer":"A","explain":"a[0] = 5 bằng x nên dừng ngay và trả về 0.","level":"TH","options":["A. 0","B. 3","C. -1","D. 4"],"points":0.25,"q":"Cho a = [5, 5, 5, 5], x = 5. Tìm kiếm tuần tự trả về kết quả nào?","type":"mcq"},{"answer":"A","explain":"giua = (0 + 5) // 2 = 2, a[2] = 6 bằng x nên trả về 2.","level":"VD","options":["A. 2","B. 0","C. 5","D. -1"],"points":0.25,"q":"Cho a = [2, 4, 6, 8, 10, 12] đã sắp xếp. Hàm tim_nhi_phan(a, 6) trả về kết quả nào?","type":"mcq"},{"answer":"A","explain":"Lần 1: giua=3 (a=4 nhỏ hơn 7, trai=4). Lần 2: giua=5 (a=6 nhỏ hơn 7, trai=6). Lần 3: giua=6, a[6]=7 nên dừng. Tổng 3 lần lặp.","level":"VDC","options":["A. 3","B. 2","C. 4","D. 1"],"points":0.25,"q":"Cho a = [1, 2, 3, 4, 5, 6, 7] đã sắp xếp, x = 7. Vòng lặp while trong nhị phân thực hiện bao nhiêu lần?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a) Đúng: trace lộ rõ lỗi logic. b) Đúng: dữ liệu nhỏ dễ theo dõi. c) Sai: trace dùng cho mọi thuật toán. d) Đúng: đó là các biến trạng thái của nhị phân.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về chạy thử và trace chương trình:","statements":["a) Trace từng bước giúp phát hiện lỗi logic của chương trình.","b) Nên trace với dữ liệu nhỏ để dễ theo dõi.","c) Trace chỉ áp dụng cho thuật toán tìm kiếm nhị phân.","d) Khi trace nhị phân cần ghi lại trai, phai, giua ở mỗi bước."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a) Đúng: nhị phân O(log n). b) Đúng: n nhỏ thì chênh lệch không đáng kể. c) Đúng: nhị phân cần quản lí khoảng tìm kiếm. d) Sai: chỉ sắp xếp khi cần dùng nhị phân.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về lựa chọn thuật toán tìm kiếm:","statements":["a) Mảng đã sắp xếp nên ưu tiên dùng tìm kiếm nhị phân.","b) Với n nhỏ, dùng tìm kiếm tuần tự vẫn ổn.","c) Cài đặt nhị phân phức tạp hơn tuần tự.","d) Muốn tìm kiếm thì luôn phải sắp xếp mảng trước."],"type":"truefalse"},{"answer":"1","explain":"a[0]=3 khác 1, a[1]=1 bằng 1 nên trả về 1.","level":"TH","points":0.5,"q":"Cho a = [3, 1, 4, 1, 5], x = 1. Tìm kiếm tuần tự trả về chỉ số nào?","type":"short"},{"answer":"3","explain":"Lần 1: giua=2 (a=6 nhỏ hơn 10, trai=3). Lần 2: giua=3 (a=8 nhỏ hơn 10, trai=4). Lần 3: giua=4, a[4]=10. Tổng 3 lần tính giua.","level":"VDC","points":0.5,"q":"Cho a = [2, 4, 6, 8, 10] đã sắp xếp, x = 10. Có bao nhiêu lần tính chỉ số giua trong quá trình tìm kiếm nhị phân?","type":"short"}]},{"name":"Đề 7","questions":[{"answer":"A","explain":"Module bisect của Python hỗ trợ tìm kiếm nhị phân trên mảng đã sắp xếp.","level":"NB","options":["A. bisect","B. search","C. find","D. lookup"],"points":0.25,"q":"Python có module chuẩn nào hỗ trợ tìm kiếm nhị phân?","type":"mcq"},{"answer":" :"truefalse"},{"answer":["T","T","F","T"],"explain":"a) Đúng: tránh lỗi IndexError. b) Đúng: vị trí chèn trùng vị trí của x. c) Sai: đó chỉ là vị trí chèn, x có thể không tồn tại. d) Đúng: x lớn hơn mọi phần tử thì chèn ở cuối.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về kiểm tra sự tồn tại bằng bisect:","statements":["a) Cần kiểm tra vt != len(a) trước khi truy cập a[vt].","b) Nếu a[vt] == x thì chắc chắn x có trong mảng.","c) bisect_left(a, x) luôn bằng chỉ số của x trong mảng.","d) Nếu x lớn hơn mọi phần tử thì vt == len(a)."],"type":"truefalse"},{"answer":"bisect","explain":"Module chuẩn của Python hỗ trợ tìm kiếm nhị phân là bisect.","level":"NB","points":0.5,"q":"Viết tên module chuẩn của Python hỗ trợ tìm kiếm nhị phân:","type":"short"},{"answer":"3","explain":"Chèn 6 vào giữa 5 (chỉ số 2) và 7 (chỉ số 3) nên vị trí là 3.","level":"VDC","points":0.5,"q":"Cho a = [1, 3, 5, 7, 9]. Lệnh print(bisect.bisect_left(a, 6)) in ra gì? (đã import bisect)","type":"short"}]},{"name":"Đề 8","questions":[{"answer":"A","explain":"Tìm kiếm giúp tra cứu nhanh học sinh đạt mức điểm x.","level":"NB","options":["A. Tìm học sinh đạt mức điểm x","B. Sắp xếp điểm tăng dần","C. Tính điểm trung bình","D. Xóa điểm thấp"],"points":0.25,"q":"Tìm kiếm trên danh sách điểm của lớp thường dùng để làm gì?","type":"mcq"},{"answer":"A","explain":"Điểm là số thực, nhập một dòng các số cách nhau bởi dấu cách.","level":"NB","options":["A. list(map(float, input().split()))","B. int(input())","C. input()","D. float(input())"],"points":0.25,"q":"Để nhập danh sách điểm (số thực) trên một dòng, dùng lệnh nào?","type":"mcq"},{"answer":"A","explain":"9.0 ở chỉ số 2 nên trả về 2.","level":"TH","options":["A. 2","B. 1","C. 3","D. -1"],"points":0.25,"q":"Cho diem = [8.5, 7.0, 9.0, 6.5]. Hàm tim_tuan_tu(diem, 9.0) trả về kết quả nào?","type":"mcq"},{"answer":"A","explain":"10.0 không có trong danh sách nên trả về -1.","level":"TH","options":["A. -1","B. 3","C. 0","D. 4"],"points":0.25,"q":"Cho diem = [8.5, 7.0, 9.0, 6.5]. Hàm tim_tuan_tu(diem, 10.0) trả về kết quả nào?","type":"mcq"},{"answer":"A","explain":"vt = 2 (điểm 9.0 ở chỉ số 2), ten[2] là Chi.","level":"VD","options":["A. Chi","B. An","C. Bình","D. Dũng"],"points":0.25,"q":"Cho ten = [An, Bình, Chi, Dũng] và diem = [8.5, 7.0, 9.0, 6.5]. Tìm học sinh đạt 9.0 điểm thì được tên nào? (không dấu)","type":"mcq"},{"answer":"A","explain":"Ghi nhớ mỗi lần gặp 9.0: i=2 rồi i=4 nên vt = [2, 4].","level":"VDC","options":["A. [2, 4]","B. [2]","C. [4]","D. []"],"points":0.25,"q":"Đoạn lệnh: diem = [7.0, 8.5, 9.0, 6.5, 9.0]; vt = []; for i in range(len(diem)): if diem[i] == 9.0: vt.append(i); print(vt). Kết quả là?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a) Đúng: đó là ứng dụng điển hình. b) Đúng: điểm thường có phần thập phân. c) Đúng: cùng thứ tự để tra cứu chéo. d) Sai: tìm kiếm so sánh bằng nên dùng được.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về ứng dụng tìm kiếm trong quản lí điểm:","statements":["a) Tìm kiếm giúp tra cứu nhanh học sinh theo điểm số.","b) Điểm số nên lưu dưới dạng số thực.","c) Tên và điểm nên lưu ở hai mảng song song, cùng thứ tự.","d) Không thể tìm kiếm trên mảng số thực."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a) Đúng: đó là quy ước mảng song song. b) Đúng: tra cứu chéo qua chỉ số. c) Đúng: nếu không sẽ lệch tương ứng. d) Sai: trộn chung gây khó xử lí.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về lưu trữ song song tên và điểm:","statements":["a) ten[i] là tên của học sinh có điểm diem[i].","b) Tìm được vt trong mảng điểm thì tên là ten[vt].","c) Hai mảng song song phải có cùng độ dài.","d) Nên lưu tên và điểm chung trong một mảng số."],"type":"truefalse"},{"answer":"1","explain":"6.5 ở chỉ số 1 nên trả về 1.","level":"TH","points":0.5,"q":"Cho diem = [5.0, 6.5, 7.0], x = 6.5. Tìm kiếm tuần tự trả về chỉ số nào?","type":"short"},{"answer":"Bình","explain":"vt = 1 (điểm 8.0 ở chỉ số 1), ten[1] là Bình.","level":"VDC","points":0.5,"q":"Cho ten = [An, Bình], diem = [9.0, 8.0]. Đoạn lệnh: vt = tim_tuan_tu(diem, 8.0); print(ten[vt]). Kết quả là? (không dấu)","type":"short"}]},{"name":"Đề 9","questions":[{"answer":"A","explain":"Nhị phân O(log n) vượt trội so với tuần tự O(n) khi n lớn.","level":"NB","options":["A. Tìm kiếm nhị phân","B. Tìm kiếm tuần tự","C. Hai thuật toán như nhau","D. Không so sánh được"],"points":0.25,"q":"Với n = 1 000 000 và mảng đã sắp xếp, thuật toán nào nhanh hơn?","type":"mcq"},{"answer":"A","explain":"Mỗi bước loại một nửa nên số bước tăng rất chậm theo n.","level":"NB","options":["A. Mỗi bước loại bỏ một nửa dữ liệu","B. Duyệt từng phần tử nhanh hơn","C. Dùng ít biến hơn","D. Code ngắn hơn"],"points":0.25,"q":"Vì sao tìm kiếm nhị phân nhanh hơn tìm kiếm tuần tự?","type":"mcq"},{"answer":"A","explain":"2^10 = 1024 nên cần tối đa 10 bước.","level":"TH","options":["A. 10","B. 1024","C. 512","D. 32"],"points":0.25,"q":"Với n = 1024, tìm kiếm nhị phân cần tối đa bao nhiêu bước?","type":"mcq"},{"answer":"A","explain":"Xấu nhất phải duyệt cả 1024 phần tử.","level":"TH","options":["A. 1024","B. 10","C. 512","D. 32"],"points":0.25,"q":"Với n = 1024, tìm kiếm tuần tự trong trường hợp xấu nhất cần bao nhiêu bước?","type":"mcq"},{"answer":"A","explain":"Nhị phân thêm đúng 1 bước khi n tăng gấp đôi (tính chất logarit).","level":"VD","options":["A. Tăng thêm khoảng 1 bước","B. Tăng gấp đôi","C. Không đổi","D. Tăng thêm n bước"],"points":0.25,"q":"Khi n tăng gấp đôi, số bước của tìm kiếm nhị phân thay đổi thế nào?","type":"mcq"},{"answer":"A","explain":"Tuần tự xấu nhất duyệt hết mảng nên số bước cũng tăng gấp đôi.","level":"VDC","options":["A. Tăng gấp đôi","B. Tăng thêm 1 bước","C. Không đổi","D. Giảm một nửa"],"points":0.25,"q":"Khi n tăng gấp đôi, số bước của tìm kiếm tuần tự (xấu nhất) thay đổi thế nào?","type":"mcq"},{"answer":["T","T","T","T"],"explain":"a) Đúng: O(log n) vượt trội O(n). b) Đúng: chênh lệch vài bước không đáng kể. c) Đúng: đó là điều kiện bắt buộc. d) Đúng: đó là ưu điểm của tuần tự.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau khi so sánh hai thuật toán:","statements":["a) Với n lớn, nhị phân nhanh hơn tuần tự rất nhiều.","b) Với n nhỏ, chênh lệch tốc độ không đáng kể.","c) Nhược điểm của nhị phân là yêu cầu mảng đã sắp xếp.","d) Ưu điểm của tuần tự là không cần sắp xếp mảng trước."],"type":"truefalse"},{"answer":["T","T","T","T"],"explain":"a) Đúng: 2^10 = 1024. b) Đúng: tính chất của logarit cơ số 2. c) Đúng: log tăng chậm hơn tuyến tính. d) Đúng: log2(10^6) xấp xỉ 20.","level":"VDC","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về logarit trong tìm kiếm nhị phân:","statements":["a) log2(1024) = 10.","b) Mỗi lần tăng gấp đôi n, nhị phân cần thêm khoảng 1 bước.","c) O(log n) tăng chậm hơn O(n) khi n lớn.","d) Với n = 10^6, nhị phân cần khoảng 20 bước."],"type":"truefalse"},{"answer":"đã sắp xếp","explain":"Nhị phân chỉ phát huy khi mảng đã được sắp xếp.","level":"NB","points":0.5,"q":"Muốn dùng tìm kiếm nhị phân, mảng phải ở trạng thái nào?","type":"short"},{"answer":"20","explain":"2^20 xấp xỉ 1 000 000 nên cần tối đa 20 bước.","level":"VDC","points":0.5,"q":"Với n = 2^20 (khoảng 1 triệu phần tử), tìm kiếm nhị phân cần tối đa bao nhiêu bước?","type":"short"}]},{"name":"Đề 10","questions":[{"answer":"A","explain":"Chạy thử với dữ liệu mẫu giúp phát hiện lỗi trước khi nộp bài.","level":"NB","options":["A. Chạy thử với dữ liệu mẫu","B. Nộp bài ngay","C. Xóa code cũ","D. Viết lại từ đầu"],"points":0.25,"q":"Trong thực hành, sau khi viết xong chương trình tìm kiếm nên làm gì?","type":"mcq"},{"answer":"A","explain":"Dữ liệu test cần bao phủ cả hai nhánh tìm thấy và không tìm thấy.","level":"NB","options":["A. Cả trường hợp tìm thấy và không tìm thấy","B. Chỉ trường hợp tìm thấy","C. Chỉ mảng rỗng","D. Không cần dữ liệu test"],"points":0.25,"q":"Dữ liệu kiểm thử chương trình tìm kiếm nên bao gồm những gì?","type":"mcq"},{"answer":"A","explain":"x không có trong mảng sẽ đi hết vòng lặp và trả về -1.","level":"TH","options":["A. x không có trong mảng","B. x ở đầu mảng","C. x ở giữa mảng","D. Mảng có 1 phần tử"],"points":0.25,"q":"Test nào kiểm tra được nhánh không tìm thấy của chương trình?","type":"mcq"},{"answer":"A","explain":"Vòng lặp không chạy lần nào nên trả về -1.","level":"TH","options":["A. -1","B. 0","C. Báo lỗi","D. 5"],"points":0.25,"q":"Cho a = [] (mảng rỗng). Hàm tim_tuan_tu(a, 5) trả về kết quả nào?","type":"mcq"},{"answer":"A","explain":"trai=0, phai=0, giua=0, a[0] = 4 bằng x nên trả về 0.","level":"VD","options":["A. 0","B. -1","C. 1","D. Báo lỗi"],"points":0.25,"q":"Cho a = [4]. Hàm tim_nhi_phan(a, 4) trả về kết quả nào?","type":"mcq"},{"answer":"A","explain":"giua=0, a[0]=4 khác 5 nên trai=1; trai == phai + 1 nên dừng và trả về -1.","level":"VDC","options":["A. -1","B. 0","C. 1","D. Lặp vô hạn"],"points":0.25,"q":"Cho a = [4]. Hàm tim_nhi_phan(a, 5) trả về kết quả nào?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a) Đúng: bao phủ cả hai nhánh. b) Đúng: vòng lặp không chạy. c) Đúng: khoảng tìm kiếm suy biến. d) Sai: một test không đủ.","level":"NB","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về kiểm thử chương trình tìm kiếm:","statements":["a) Nên test cả trường hợp tìm thấy và không tìm thấy x.","b) Mảng rỗng là trường hợp biên cần kiểm thử.","c) Mảng một phần tử là trường hợp biên cần kiểm thử.","d) Chỉ cần kiểm thử một trường hợp duy nhất."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a) Đúng: vòng lặp không chạy lần nào. b) Đúng: giua=0 và a[0] bằng x. c) Đúng: trai vượt phai nên dừng. d) Sai: trai == phai + 1 ngay từ đầu nên dừng ngay.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về các trường hợp biên:","statements":["a) Với a = [], tìm kiếm tuần tự trả về -1.","b) Với a = [4], x = 4, nhị phân trả về 0.","c) Với a = [4], x = 5, nhị phân trả về -1.","d) Nhị phân với mảng rỗng gây lặp vô hạn."],"type":"truefalse"},{"answer":"-1","explain":"Mảng một phần tử, 1 khác 2 nên duyệt xong trả về -1.","level":"TH","points":0.5,"q":"Cho a = [1], x = 2. Tìm kiếm tuần tự trả về kết quả nào?","type":"short"},{"answer":"3","explain":"So sánh 3==2, 1==2, 2==2: tổng 3 lần so sánh bằng.","level":"VDC","points":0.5,"q":"Cho a = [3, 1, 2], x = 2. Có bao nhiêu lần thực hiện phép so sánh bằng trong tìm kiếm tuần tự?","type":"short"}]}]}
