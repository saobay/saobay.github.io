{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Kiểm thử chương trình là gì?","options":["A. Chạy chương trình với các bộ dữ liệu test để phát hiện lỗi","B. Viết code thật nhanh","C. Xóa chương trình cũ","D. Cài đặt phần mềm"],"answer":"A","explain":"Kiểm thử là quá trình chạy chương trình với các bộ dữ liệu test nhằm phát hiện lỗi.","points":0.25},{"type":"mcq","level":"NB","q":"Lỗi cú pháp là gì?","options":["A. Vi phạm quy tắc của ngôn ngữ, chương trình không chạy được","B. Chương trình chạy nhưng cho kết quả sai","C. Chương trình chạy quá chậm","D. Máy tính bị hỏng"],"answer":"A","explain":"Lỗi cú pháp vi phạm quy tắc ngôn ngữ (thiếu dấu, sai thụt lề...) nên chương trình không chạy được, máy báo lỗi ngay.","points":0.25},{"type":"mcq","level":"NB","q":"Lỗi logic là gì?","options":["A. Chương trình không chạy được","B. Chương trình chạy xong nhưng cho kết quả sai","C. Máy tính hết pin","D. Màn hình bị nhiễu"],"answer":"B","explain":"Lỗi logic: chương trình vẫn chạy xong nhưng cho kết quả sai do thuật toán hoặc công thức sai.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn code thiếu dấu hai chấm sau câu lệnh if thuộc loại lỗi nào?","options":["A. Lỗi cú pháp","B. Lỗi logic","C. Lỗi runtime","D. Không phải lỗi"],"answer":"A","explain":"Thiếu dấu hai chấm vi phạm quy tắc cú pháp của Python, máy báo lỗi ngay.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn code tính tổng các phần tử nhưng khởi tạo s = 1 thuộc loại lỗi nào?","options":["A. Lỗi cú pháp","B. Lỗi logic","C. Lỗi runtime","D. Không phải lỗi"],"answer":"B","explain":"Chương trình vẫn chạy xong nhưng tổng bị thừa 1, tức kết quả sai — đó là lỗi logic.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn kiểm thử hàm tìm giá trị lớn nhất của mảng, bộ test nào sau đây là đầy đủ nhất?","options":["A. Chỉ test mảng [1, 2, 3]","B. Mảng thường, mảng một phần tử, mảng rỗng, mảng toàn số âm","C. Chỉ test mảng rỗng","D. Không cần test"],"answer":"B","explain":"Bộ test tốt bao phủ trường hợp thông thường, biên (một phần tử, rỗng) và đặc biệt (toàn số âm).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về kiểm thử:","statements":["a) Kiểm thử giúp phát hiện lỗi của chương trình.","b) Kiểm thử chứng minh được chương trình không còn lỗi nào.","c) Lỗi cú pháp được máy phát hiện ngay.","d) Lỗi logic được máy tự động phát hiện."],"answer":["T","F","T","F"],"explain":"a) Đúng: đó là mục đích của kiểm thử. b) Sai: chỉ chứng minh lỗi đã tìm thấy, không đảm bảo hết lỗi. c) Đúng: máy báo lỗi cú pháp ngay. d) Sai: lỗi logic cho kết quả sai mà máy không biết, phải nhờ kiểm thử.","points":1},{"type":"truefalse","level":"VD","q":"Kiểm thử hàm tính giai thừa với các ca test sau. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Với n = 0, kết quả mong đợi là 1.","b) Với n = 5, kết quả mong đợi là 120.","c) Cần có ca test với n là số âm.","d) Chỉ cần test với n = 5 là đủ."],"answer":["T","T","T","F"],"explain":"a) Đúng: 0! = 1. b) Đúng: 5! = 120. c) Đúng: trường hợp đặc biệt cần xử lý riêng. d) Sai: cần nhiều ca bao phủ các trường hợp.","points":1},{"type":"short","level":"TH","q":"Đoạn chương trình thực hiện phép chia cho 0 khi chạy thuộc loại lỗi nào? (Trả lời: lỗi ...)","answer":"lỗi runtime","explain":"Chia cho 0 xảy ra trong khi chạy, làm chương trình dừng đột ngột — đó là lỗi runtime.","points":0.5},{"type":"short","level":"VDC","q":"Cho hàm: def f(a): return sum(a) / len(a). Khi gọi f([]) thì xảy ra loại lỗi nào? (Trả lời: lỗi ...)","answer":"lỗi runtime","explain":"Mảng rỗng có len bằng 0 nên phép chia cho 0 xảy ra khi chạy — lỗi runtime.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Bộ dữ liệu test là gì?","options":["A. Dữ liệu đầu vào dùng để kiểm thử chương trình","B. Kết quả thi của học sinh","C. Dữ liệu rác cần xóa","D. Mật khẩu đăng nhập"],"answer":"A","explain":"Bộ dữ liệu test là các dữ liệu đầu vào được chuẩn bị để chạy kiểm thử chương trình.","points":0.25},{"type":"mcq","level":"NB","q":"Ca kiểm thử biên là gì?","options":["A. Test với giá trị ở biên của miền dữ liệu như 0, 1, giá trị lớn nhất","B. Test với dữ liệu ngẫu nhiên","C. Test khi máy sắp hết pin","D. Không test gì cả"],"answer":"A","explain":"Ca biên dùng các giá trị ở biên miền dữ liệu (0, 1, rỗng, max...) vì lỗi hay xuất hiện ở biên.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn code: a = [1, 2, 3]; print(a[5]) thuộc loại lỗi nào?","options":["A. Lỗi cú pháp","B. Lỗi logic","C. Lỗi runtime","D. Không phải lỗi"],"answer":"C","explain":"Truy cập chỉ số 5 vượt quá phạm vi mảng gây lỗi IndexError khi chạy — lỗi runtime.","points":0.25},{"type":"mcq","level":"TH","q":"Ví dụ nào sau đây về lỗi runtime là đúng?","options":["A. Chia cho 0, truy cập chỉ số không tồn tại","B. Thiếu dấu hai chấm","C. Tính tổng sai công thức","D. Đặt tên biến xấu"],"answer":"A","explain":"Chia cho 0 hay truy cập chỉ số không tồn tại đều làm chương trình dừng đột ngột khi chạy.","points":0.25},{"type":"mcq","level":"VD","q":"Chương trình được đánh giá dựa trên các tiêu chí nào?","options":["A. Đúng đắn, hiệu quả, dễ đọc và dễ bảo trì","B. Code dài hay ngắn","C. Màu sắc giao diện","D. Số lượng file"],"answer":"A","explain":"Ba tiêu chí đánh giá: tính đúng đắn (quan trọng nhất), tính hiệu quả và tính dễ đọc, dễ bảo trì.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai chương trình cùng cho kết quả đúng, một chương trình chạy 1 giây, một chạy 1 giờ với cùng dữ liệu lớn. Nên chọn chương trình nào?","options":["A. Chương trình chạy 1 giây vì hiệu quả hơn","B. Chương trình chạy 1 giờ","C. Chương trình nào cũng được","D. Không chọn chương trình nào"],"answer":"A","explain":"Khi cùng đúng đắn, tiêu chí hiệu quả quyết định: chọn chương trình chạy nhanh hơn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ca kiểm thử:","statements":["a) Ca kiểm thử biên rất quan trọng vì lỗi hay xuất hiện ở biên.","b) Chỉ cần test trường hợp thông thường là đủ.","c) Lỗi runtime xảy ra trong khi chương trình đang chạy.","d) Lỗi cú pháp làm chương trình cho kết quả sai."],"answer":["T","F","T","F"],"explain":"a) Đúng: biên là nơi dễ sai. b) Sai: cần cả ca biên và đặc biệt. c) Đúng: định nghĩa lỗi runtime. d) Sai: lỗi cú pháp làm chương trình không chạy được.","points":1},{"type":"truefalse","level":"VD","q":"Kiểm thử hàm tìm kiếm x trong mảng [1, 2, 3] (trả về chỉ số hoặc -1). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Với x = 2, kết quả mong đợi là 1.","b) Với x = 5, kết quả mong đợi là -1.","c) Với mảng rỗng, kết quả mong đợi là -1.","d) Không cần test trường hợp mảng rỗng."],"answer":["T","T","T","F"],"explain":"a) Đúng: a[1] = 2. b) Đúng: không tìm thấy. c) Đúng: mảng rỗng không có phần tử nào. d) Sai: mảng rỗng là ca biên quan trọng.","points":1},{"type":"short","level":"NB","q":"Đoạn code thiếu dấu ngoặc đơn thuộc loại lỗi nào? (Trả lời: lỗi ...)","answer":"lỗi cú pháp","explain":"Thiếu dấu ngoặc vi phạm quy tắc cú pháp, máy báo lỗi ngay.","points":0.5},{"type":"short","level":"VDC","q":"Chương trình bị treo do vòng lặp không bao giờ kết thúc thuộc loại lỗi nào? (Trả lời: lỗi ...)","answer":"lỗi logic","explain":"Vòng lặp vô hạn do điều kiện dừng sai là lỗi trong thuật toán — lỗi logic.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Gỡ lỗi (debug) là gì?","options":["A. Tìm và sửa các lỗi của chương trình","B. Xóa chương trình","C. Viết thêm code mới","D. Tắt máy tính"],"answer":"A","explain":"Gỡ lỗi là quá trình tìm ra nguyên nhân lỗi và sửa chữa chương trình.","points":0.25},{"type":"mcq","level":"NB","q":"Chương trình được gọi là đúng khi nào?","options":["A. Cho kết quả đúng với mọi đầu vào hợp lệ","B. Chạy không báo lỗi","C. Code ngắn gọn","D. Chạy nhanh"],"answer":"A","explain":"Tính đúng đắn yêu cầu kết quả đúng với mọi đầu vào hợp lệ, không chỉ vài test case.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn code in thiếu dấu ngoặc kép thuộc loại lỗi nào?","options":["A. Lỗi cú pháp","B. Lỗi logic","C. Lỗi runtime","D. Không phải lỗi"],"answer":"A","explain":"Thiếu dấu ngoặc kép vi phạm cú pháp, máy báo lỗi ngay khi chạy.","points":0.25},{"type":"mcq","level":"NB","q":"Gán nhầm s = '0' (chuỗi kí tự) thay vì s = 0 rồi thực hiện s + 5 thuộc loại lỗi nào?","options":["A. Lỗi cú pháp","B. Lỗi logic","C. Lỗi runtime","D. Không phải lỗi"],"answer":"C","explain":"Cộng chuỗi với số gây lỗi TypeError khi chạy — đó là lỗi runtime.","points":0.25},{"type":"mcq","level":"VD","q":"Kiểm thử hàm tính điểm trung bình, cần chú ý trường hợp đặc biệt nào?","options":["A. Điểm số âm hoặc vượt quá thang điểm","B. Tên học sinh quá dài","C. Máy tính hết pin","D. Màn hình quá sáng"],"answer":"A","explain":"Điểm âm hoặc vượt thang là đầu vào không hợp lệ, chương trình cần kiểm tra và xử lý.","points":0.25},{"type":"mcq","level":"VDC","q":"Đánh giá tính hiệu quả của chương trình dựa trên yếu tố nào?","options":["A. Độ phức tạp thời gian và không gian","B. Số lượng dòng code","C. Màu sắc giao diện","D. Tên chương trình"],"answer":"A","explain":"Tính hiệu quả đánh giá qua độ phức tạp thời gian (chạy nhanh) và không gian (tốn ít bộ nhớ).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về gỡ lỗi:","statements":["a) Gỡ lỗi là tìm và sửa lỗi của chương trình.","b) Lỗi cú pháp thường dễ phát hiện vì máy báo ngay.","c) Lỗi logic khó phát hiện hơn lỗi cú pháp.","d) Viết code cẩn thận thì không cần kiểm thử."],"answer":["T","T","T","F"],"explain":"a) Đúng: định nghĩa gỡ lỗi. b) Đúng: máy chỉ rõ vị trí lỗi cú pháp. c) Đúng: lỗi logic cho kết quả sai âm thầm. d) Sai: dù cẩn thận vẫn cần kiểm thử.","points":1},{"type":"truefalse","level":"VD","q":"Kiểm thử hàm tìm giá trị lớn nhất của mảng. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Với [1, 2, 3], kết quả mong đợi là 3.","b) Với [-5, -1, -3], kết quả mong đợi là -1.","c) Với [7], kết quả mong đợi là 7.","d) Với mảng rỗng, kết quả mong đợi là 0."],"answer":["T","T","T","F"],"explain":"a) Đúng: max là 3. b) Đúng: max là -1. c) Đúng: một phần tử. d) Sai: mảng rỗng không có giá trị lớn nhất, cần xử lý riêng chứ không phải 0.","points":1},{"type":"short","level":"VD","q":"Cho a = [1, 2]; thực hiện a[1] = a[1] / 0. Đây thuộc loại lỗi nào? (Trả lời: lỗi ...)","answer":"lỗi runtime","explain":"Chia cho 0 xảy ra khi chạy, làm chương trình dừng đột ngột.","points":0.5},{"type":"short","level":"VDC","q":"Chương trình cho kết quả đúng với dữ liệu nhỏ nhưng chạy quá chậm với dữ liệu lớn. Vấn đề nằm ở tiêu chí nào? (Trả lời: tính ...)","answer":"tính hiệu quả","explain":"Chạy chậm với dữ liệu lớn là vấn đề về tính hiệu quả (độ phức tạp cao).","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Kiểm thử hộp đen là gì?","options":["A. Kiểm thử theo chức năng mà không cần biết code bên trong","B. Kiểm thử dựa trên cấu trúc code","C. Kiểm thử trong bóng tối","D. Kiểm thử phần cứng"],"answer":"A","explain":"Kiểm thử hộp đen chỉ quan tâm đầu vào và đầu ra theo chức năng, không cần biết code bên trong.","points":0.25},{"type":"mcq","level":"NB","q":"Kiểm thử hộp trắng là gì?","options":["A. Kiểm thử dựa trên cấu trúc bên trong của code","B. Kiểm thử theo chức năng","C. Kiểm thử giao diện","D. Kiểm thử bàn phím"],"answer":"A","explain":"Kiểm thử hộp trắng dựa vào cấu trúc code bên trong để thiết kế ca test bao phủ các nhánh lệnh.","points":0.25},{"type":"mcq","level":"TH","q":"Nhập chữ vào lệnh int(input()) khi chạy sẽ gây ra lỗi nào?","options":["A. Lỗi cú pháp","B. Lỗi logic","C. Lỗi runtime","D. Không lỗi"],"answer":"C","explain":"Đổi chữ thành số gây lỗi ValueError khi chạy — lỗi runtime.","points":0.25},{"type":"mcq","level":"TH","q":"Hàm quên lệnh return nên luôn trả về None thuộc loại lỗi nào?","options":["A. Lỗi cú pháp","B. Lỗi logic","C. Lỗi runtime","D. Không phải lỗi"],"answer":"B","explain":"Chương trình vẫn chạy xong nhưng kết quả sai ý định (thiếu giá trị trả về) — lỗi logic.","points":0.25},{"type":"mcq","level":"VD","q":"Kiểm thử chức năng đăng nhập cần các ca test nào?","options":["A. Đúng tài khoản, sai mật khẩu, bỏ trống ô nhập","B. Chỉ test đúng tài khoản","C. Chỉ test sai mật khẩu","D. Không cần test"],"answer":"A","explain":"Cần bao phủ cả trường hợp đúng, sai và biên (bỏ trống) để kiểm tra đầy đủ.","points":0.25},{"type":"mcq","level":"VDC","q":"Muốn đảm bảo mọi nhánh của câu lệnh if/else đều được chạy qua khi test, ta dùng phương pháp nào?","options":["A. Kiểm thử hộp trắng","B. Kiểm thử hộp đen","C. Không test","D. Đoán mò"],"answer":"A","explain":"Kiểm thử hộp trắng dựa vào cấu trúc code nên thiết kế được ca test bao phủ mọi nhánh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về hai phương pháp kiểm thử:","statements":["a) Kiểm thử hộp đen không cần biết code bên trong.","b) Kiểm thử hộp trắng cần biết cấu trúc code.","c) Kiểm thử hộp đen kiểm tra cấu trúc code.","d) Nên kết hợp cả hai phương pháp."],"answer":["T","T","F","T"],"explain":"a) Đúng: chỉ cần đặc tả chức năng. b) Đúng: dựa vào code để thiết kế test. c) Sai: hộp đen kiểm tra chức năng. d) Đúng: kết hợp cho độ bao phủ tốt nhất.","points":1},{"type":"truefalse","level":"VD","q":"Kiểm thử hàm kiểm tra số chẵn. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Với 4, kết quả mong đợi là chẵn.","b) Với 7, kết quả mong đợi là lẻ.","c) Với 0, kết quả mong đợi là chẵn.","d) Với -3, kết quả mong đợi là chẵn."],"answer":["T","T","T","F"],"explain":"a) Đúng: 4 chia hết cho 2. b) Đúng: 7 là số lẻ. c) Đúng: 0 chia hết cho 2. d) Sai: -3 là số lẻ.","points":1},{"type":"short","level":"NB","q":"Sử dụng một biến chưa được gán giá trị trong Python gây ra loại lỗi nào? (Trả lời: lỗi ...)","answer":"lỗi runtime","explain":"Biến chưa gán gây lỗi NameError khi chạy — lỗi runtime.","points":0.5},{"type":"short","level":"VDC","q":"Hai chương trình cùng đúng đắn, để chọn chương trình tốt hơn ta so sánh tiêu chí nào? (Trả lời: tính ...)","answer":"tính hiệu quả","explain":"Khi cùng đúng, chương trình hiệu quả hơn (chạy nhanh, ít tốn bộ nhớ) là tốt hơn.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Một ca kiểm thử (test case) gồm những thành phần nào?","options":["A. Dữ liệu đầu vào và kết quả mong đợi","B. Chỉ có dữ liệu đầu vào","C. Chỉ có kết quả mong đợi","D. Tên người kiểm thử"],"answer":"A","explain":"Mỗi ca test gồm dữ liệu đầu vào và kết quả mong đợi để so sánh với kết quả thực tế.","points":0.25},{"type":"mcq","level":"NB","q":"Kết quả mong đợi trong kiểm thử là gì?","options":["A. Đáp án đúng đã biết trước của ca test","B. Kết quả do chương trình tính ra","C. Thời gian chạy chương trình","D. Số lỗi tìm được"],"answer":"A","explain":"Kết quả mong đợi là đáp án đúng đã biết trước, dùng để đối chiếu với kết quả chương trình cho ra.","points":0.25},{"type":"mcq","level":"TH","q":"Khi nào một ca kiểm thử được xem là đạt (pass)?","options":["A. Khi kết quả thực tế khớp với kết quả mong đợi","B. Khi chương trình chạy xong","C. Khi không có lỗi cú pháp","D. Khi code ngắn gọn"],"answer":"A","explain":"Ca test đạt khi kết quả chương trình cho ra khớp với kết quả mong đợi đã định trước.","points":0.25},{"type":"mcq","level":"TH","q":"Viết sai chính tả tên biến đã khai báo (ví dụ pritn thay vì print) thuộc loại lỗi nào?","options":["A. Lỗi cú pháp","B. Lỗi logic","C. Lỗi runtime","D. Không phải lỗi"],"answer":"C","explain":"Tên sai gây lỗi NameError khi chạy đến dòng đó — lỗi runtime.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn đánh giá tốc độ của thuật toán sắp xếp với dữ liệu lớn, ta cần làm gì?","options":["A. Kiểm thử hiệu năng với n lớn và đo thời gian chạy","B. Chỉ nhìn vào số dòng code","C. Đoán mò","D. Không cần làm gì"],"answer":"A","explain":"Đánh giá hiệu quả bằng cách chạy với dữ liệu lớn và đo thời gian, so sánh với độ phức tạp lý thuyết.","points":0.25},{"type":"mcq","level":"VDC","q":"Chương trình vượt qua mọi ca test đã có nhưng vẫn cho kết quả sai trong thực tế. Nguyên nhân có thể là gì?","options":["A. Bộ test còn thiếu các trường hợp quan trọng","B. Máy tính bị hỏng","C. Người dùng nhập sai","D. Không có nguyên nhân"],"answer":"A","explain":"Kiểm thử chỉ phát hiện lỗi trong phạm vi các ca đã có; thiếu ca quan trọng thì lỗi vẫn lọt.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về thành phần ca kiểm thử:","statements":["a) Mỗi ca test có dữ liệu đầu vào.","b) Mỗi ca test có kết quả mong đợi.","c) Không cần biết kết quả mong đợi khi kiểm thử.","d) Ca test đạt khi kết quả thực tế khớp mong đợi."],"answer":["T","T","F","T"],"explain":"a) Đúng: đầu vào để chạy. b) Đúng: để đối chiếu. c) Sai: không có mong đợi thì không đánh giá được. d) Đúng: định nghĩa đạt.","points":1},{"type":"truefalse","level":"VD","q":"Kiểm thử hàm sắp xếp tăng dần. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Với [2, 1], kết quả mong đợi là [1, 2].","b) Với [], kết quả mong đợi là [].","c) Với [1], kết quả mong đợi là [1].","d) Với [3, 3, 1], kết quả mong đợi là [1, 3, 3]."],"answer":["T","T","T","T"],"explain":"a) Đúng: sắp xếp 2 phần tử. b) Đúng: mảng rỗng. c) Đúng: một phần tử. d) Đúng: có phần tử trùng.","points":1},{"type":"short","level":"VD","q":"Người dùng nhập số âm vào chương trình tính căn bậc hai. Chương trình cần làm gì trước khi tính? (Trả lời: kiểm tra ...)","answer":"kiểm tra tính hợp lệ","explain":"Cần kiểm tra tính hợp lệ của đầu vào (số không âm) trước khi tính toán.","points":0.5},{"type":"short","level":"VDC","q":"Chương trình bị treo khi n rất lớn nhưng chạy đúng với n nhỏ. Vấn đề thuộc về tiêu chí nào? (Trả lời: tính ...)","answer":"tính hiệu quả","explain":"Chạy quá chậm hoặc treo với dữ liệu lớn là vấn đề về tính hiệu quả.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Câu lệnh assert trong Python dùng để làm gì?","options":["A. Kiểm tra một điều kiện, báo lỗi ngay nếu điều kiện sai","B. In dữ liệu ra màn hình","C. Nhập dữ liệu","D. Thoát chương trình"],"answer":"A","explain":"assert kiểm tra điều kiện đi kèm; nếu sai, Python báo lỗi AssertionError ngay.","points":0.25},{"type":"mcq","level":"NB","q":"Ví dụ nào sau đây về assert là đúng?","options":["A. assert n != 0","B. assert = 5","C. assert print","D. assert if"],"answer":"A","explain":"assert n != 0 kiểm tra n khác 0 trước khi thực hiện phép chia.","points":0.25},{"type":"mcq","level":"TH","q":"Thực hiện assert x == 5 khi x = 3 thì điều gì xảy ra?","options":["A. Python báo lỗi AssertionError","B. Không có gì xảy ra","C. x tự thành 5","D. Chương trình chạy tiếp bình thường"],"answer":"A","explain":"Điều kiện 3 == 5 là sai nên assert báo lỗi AssertionError.","points":0.25},{"type":"mcq","level":"TH","q":"Viết ca test cho hàm cộng hai số: đầu vào 2 và 3, kết quả mong đợi là gì?","options":["A. 5","B. 6","C. 23","D. 1"],"answer":"A","explain":"Kết quả mong đợi của 2 + 3 là 5.","points":0.25},{"type":"mcq","level":"VD","q":"Kiểm thử tự động là gì?","options":["A. Viết code để chạy hàng loạt ca test và tự so sánh kết quả","B. Ngồi xem code bằng mắt","C. Đoán kết quả","D. Không kiểm thử"],"answer":"A","explain":"Kiểm thử tự động dùng code (ví dụ các lệnh assert) để chạy nhiều ca test và tự đánh giá đạt/không đạt.","points":0.25},{"type":"mcq","level":"VDC","q":"Khi nào thì có thể dừng việc kiểm thử?","options":["A. Khi hết thời gian/ngân sách hoặc đạt độ bao phủ yêu cầu","B. Khi test được 1 ca","C. Khi code không còn lỗi cú pháp","D. Không bao giờ dừng"],"answer":"A","explain":"Trong thực tế, kiểm thử dừng khi hết nguồn lực hoặc đạt độ bao phủ đã định; không thể đảm bảo hết mọi lỗi.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về assert:","statements":["a) assert dùng để kiểm tra một điều kiện.","b) Nếu điều kiện sai, assert báo lỗi.","c) assert có thể thay thế hoàn toàn mọi kiểm thử.","d) Nên dùng assert để kiểm tra điều kiện đầu vào."],"answer":["T","T","F","T"],"explain":"a) Đúng: đó là chức năng của assert. b) Đúng: báo AssertionError. c) Sai: assert chỉ là công cụ hỗ trợ. d) Đúng: ví dụ assert n != 0 trước khi chia.","points":1},{"type":"truefalse","level":"VD","q":"Kiểm thử hàm chia hai số a / b. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Với a = 6, b = 3, kết quả mong đợi là 2.","b) Cần ca test với b = 0.","c) Với a = 0, b = 5, kết quả mong đợi là 0.","d) Không cần test trường hợp b = 0."],"answer":["T","T","T","F"],"explain":"a) Đúng: 6/3 = 2. b) Đúng: chia cho 0 là ca biên nguy hiểm. c) Đúng: 0/5 = 0. d) Sai: b = 0 gây lỗi nên bắt buộc phải test.","points":1},{"type":"short","level":"NB","q":"Câu lệnh nào trong Python dùng để kiểm tra nhanh một điều kiện khi kiểm thử?","answer":"assert","explain":"Câu lệnh assert kiểm tra điều kiện và báo lỗi ngay nếu sai.","points":0.5},{"type":"short","level":"VDC","q":"Chạy 100 ca kiểm thử, có 98 ca đạt. Hỏi có bao nhiêu ca không đạt?","answer":"2","explain":"Số ca không đạt là 100 - 98 = 2.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Lỗi biên dịch là gì?","options":["A. Lỗi cú pháp được phát hiện khi dịch chương trình","B. Lỗi cho kết quả sai","C. Lỗi khi đang chạy","D. Lỗi của máy in"],"answer":"A","explain":"Lỗi biên dịch là lỗi cú pháp được phát hiện ở giai đoạn dịch, trước khi chương trình chạy.","points":0.25},{"type":"mcq","level":"NB","q":"Python là ngôn ngữ thông dịch nên lỗi cú pháp được phát hiện khi nào?","options":["A. Khi chạy đến dòng lệnh có lỗi","B. Trước khi chạy toàn bộ","C. Sau khi chạy xong","D. Không bao giờ"],"answer":"A","explain":"Python thông dịch từng dòng nên lỗi cú pháp chỉ lộ ra khi chạy đến dòng đó.","points":0.25},{"type":"mcq","level":"TH","q":"Lỗi thụt lề sai trong Python (IndentationError) thuộc loại lỗi nào?","options":["A. Lỗi cú pháp","B. Lỗi logic","C. Lỗi runtime","D. Không phải lỗi"],"answer":"A","explain":"Thụt lề là quy tắc cú pháp của Python nên sai thụt lề là lỗi cú pháp.","points":0.25},{"type":"mcq","level":"NB","q":"Quên import module trước khi dùng thuộc loại lỗi nào?","options":["A. Lỗi cú pháp","B. Lỗi logic","C. Lỗi runtime","D. Không phải lỗi"],"answer":"C","explain":"Dùng tên module chưa import gây lỗi NameError khi chạy — lỗi runtime.","points":0.25},{"type":"mcq","level":"VD","q":"Kiểm thử hàm tính tổng từ 1 đến n, các ca biên nên chọn là gì?","options":["A. n = 0, n = 1 và n rất lớn","B. Chỉ n = 10","C. Chỉ n = 100","D. Không cần ca biên"],"answer":"A","explain":"Ca biên gồm giá trị nhỏ nhất (0, 1) và giá trị lớn để kiểm tra cả đúng đắn và hiệu quả.","points":0.25},{"type":"mcq","level":"VDC","q":"Kiểm thử với dữ liệu ngẫu nhiên hàng loạt để tìm lỗi tiềm ẩn được gọi là gì?","options":["A. Fuzzing","B. Gỡ lỗi","C. Biên dịch","D. Cài đặt"],"answer":"A","explain":"Fuzzing là kĩ thuật kiểm thử với dữ liệu ngẫu nhiên để phát hiện các lỗi tiềm ẩn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về lỗi trong Python:","statements":["a) Python báo lỗi cú pháp khi chạy đến dòng có lỗi.","b) Thụt lề sai là lỗi cú pháp.","c) Quên import module là lỗi logic.","d) Lỗi cú pháp làm chương trình không chạy tiếp được."],"answer":["T","T","F","T"],"explain":"a) Đúng: Python thông dịch từng dòng. b) Đúng: IndentationError. c) Sai: là lỗi runtime (NameError). d) Đúng: phải sửa mới chạy được.","points":1},{"type":"truefalse","level":"VD","q":"Kiểm thử hàm kiểm tra số nguyên tố. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Với 2, kết quả mong đợi là True.","b) Với 1, kết quả mong đợi là False.","c) Với 9, kết quả mong đợi là False.","d) Với 0, kết quả mong đợi là True."],"answer":["T","T","T","F"],"explain":"a) Đúng: 2 là số nguyên tố. b) Đúng: 1 không phải số nguyên tố. c) Đúng: 9 = 3 * 3. d) Sai: 0 không phải số nguyên tố.","points":1},{"type":"short","level":"VD","q":"Lỗi do thụt lề sai trong Python thuộc loại lỗi nào? (Trả lời: lỗi ...)","answer":"lỗi cú pháp","explain":"Thụt lề sai vi phạm quy tắc cú pháp của Python.","points":0.5},{"type":"short","level":"VDC","q":"Kĩ thuật kiểm thử chương trình với dữ liệu ngẫu nhiên hàng loạt được gọi là gì?","answer":"fuzzing","explain":"Fuzzing là kiểm thử với dữ liệu ngẫu nhiên để tìm lỗi tiềm ẩn.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Kiểm thử hồi quy là gì?","options":["A. Chạy lại toàn bộ bộ test sau khi sửa code để đảm bảo không hỏng phần đang đúng","B. Test lần đầu tiên","C. Xóa hết các test cũ","D. Viết code mới"],"answer":"A","explain":"Kiểm thử hồi quy chạy lại các test cũ sau mỗi lần sửa để phát hiện lỗi mới do chỗ sửa gây ra.","points":0.25},{"type":"mcq","level":"NB","q":"Vì sao cần kiểm thử hồi quy sau khi sửa lỗi?","options":["A. Vì chỗ sửa có thể vô tình gây ra lỗi mới","B. Vì máy tính bị chậm","C. Vì người dùng yêu cầu","D. Không cần thiết"],"answer":"A","explain":"Sửa một chỗ có thể ảnh hưởng chỗ khác nên phải test lại để đảm bảo không phát sinh lỗi mới.","points":0.25},{"type":"mcq","level":"TH","q":"Sửa hàm A làm hỏng hàm B đang chạy đúng. Cách phát hiện tốt nhất là gì?","options":["A. Chạy kiểm thử hồi quy","B. Đoán mò","C. Xóa hàm B","D. Không làm gì"],"answer":"A","explain":"Chạy lại bộ test cũ (hồi quy) sẽ phát hiện ngay hàm B bị hỏng.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của kiểm thử tự động so với kiểm thử thủ công là gì?","options":["A. Chạy nhanh và lặp lại được nhiều lần","B. Không cần viết code","C. Luôn tìm ra mọi lỗi","D. Không cần máy tính"],"answer":"A","explain":"Test tự động chạy nhanh, có thể chạy lại nhiều lần sau mỗi lần sửa code.","points":0.25},{"type":"mcq","level":"VD","q":"Hệ thống tự động chạy toàn bộ test mỗi khi lập trình viên đẩy code mới lên nhằm mục đích gì?","options":["A. Phát hiện sớm lỗi do thay đổi code gây ra","B. Làm chậm tiến độ","C. Trang trí","D. Tốn điện"],"answer":"A","explain":"Đây là kiểm thử hồi quy tự động, giúp phát hiện sớm lỗi mới sau mỗi thay đổi.","points":0.25},{"type":"mcq","level":"VDC","q":"Khi chỉnh sửa lại cấu trúc code mà không đổi chức năng (refactor), cần làm gì?","options":["A. Chạy lại toàn bộ bộ kiểm thử","B. Xóa hết test cũ","C. Không cần làm gì","D. Viết lại từ đầu"],"answer":"A","explain":"Refactor dễ gây lỗi mới nên phải chạy lại toàn bộ test để đảm bảo chức năng không đổi.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về kiểm thử hồi quy:","statements":["a) Kiểm thử hồi quy là chạy lại test sau khi sửa code.","b) Sửa code không bao giờ gây ra lỗi mới.","c) Test tự động giúp chạy hồi quy nhanh chóng.","d) Chỉ cần kiểm thử một lần duy nhất."],"answer":["T","F","T","F"],"explain":"a) Đúng: định nghĩa hồi quy. b) Sai: sửa code có thể gây lỗi mới. c) Đúng: tự động hóa giúp chạy lại dễ dàng. d) Sai: phải test lại sau mỗi lần sửa.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về bảo trì code:","statements":["a) Sau khi refactor cần chạy lại toàn bộ test.","b) Kiểm thử hồi quy giúp phát hiện lỗi mới.","c) Code cũ không bao giờ cần kiểm thử lại.","d) Tự động hóa giúp kiểm thử được thường xuyên."],"answer":["T","T","F","T"],"explain":"a) Đúng: refactor có rủi ro. b) Đúng: mục đích của hồi quy. c) Sai: code cũ vẫn cần test lại sau thay đổi. d) Đúng: test tự động chạy nhanh, chạy được nhiều.","points":1},{"type":"short","level":"NB","q":"Việc chạy lại toàn bộ bộ test sau khi sửa code được gọi là kiểm thử gì?","answer":"kiểm thử hồi quy","explain":"Kiểm thử hồi quy là chạy lại các test cũ sau mỗi lần sửa code.","points":0.5},{"type":"short","level":"VDC","q":"Lỗi mới xuất hiện do việc sửa một lỗi khác gây ra được gọi là lỗi gì?","answer":"lỗi hồi quy","explain":"Lỗi hồi quy là lỗi mới phát sinh từ việc sửa đổi code.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tài liệu kiểm thử thường ghi lại những gì?","options":["A. Các ca test và kết quả thực hiện","B. Sở thích của lập trình viên","C. Giá máy tính","D. Thời tiết"],"answer":"A","explain":"Tài liệu kiểm thử ghi các ca test, cách thực hiện và kết quả để theo dõi và tái hiện.","points":0.25},{"type":"mcq","level":"NB","q":"Ai thường thực hiện công việc kiểm thử phần mềm?","options":["A. Lập trình viên và kiểm thử viên (tester)","B. Chỉ giám đốc","C. Chỉ khách hàng","D. Không ai"],"answer":"A","explain":"Cả lập trình viên (test code của mình) và tester chuyên nghiệp đều tham gia kiểm thử.","points":0.25},{"type":"mcq","level":"TH","q":"Khi người dùng phát hiện lỗi trong sản phẩm đã phát hành, điều đó cho thấy gì?","options":["A. Quá trình kiểm thử trước đó chưa đủ bao phủ","B. Người dùng dùng sai","C. Máy tính bị hỏng","D. Không cho thấy gì"],"answer":"A","explain":"Lỗi lọt đến tay người dùng nghĩa là bộ test còn thiếu các trường hợp quan trọng.","points":0.25},{"type":"mcq","level":"NB","q":"Vì sao khi báo lỗi cần mô tả cách tái hiện lỗi?","options":["A. Để lập trình viên tái hiện và sửa được lỗi","B. Để khoe lỗi","C. Để xóa lỗi","D. Không cần thiết"],"answer":"A","explain":"Mô tả cách tái hiện giúp lập trình viên thấy lại lỗi và xác minh sau khi sửa.","points":0.25},{"type":"mcq","level":"VD","q":"Các mức độ nghiêm trọng của lỗi thường được phân loại như thế nào?","options":["A. Chặn, cao, trung bình, thấp","B. Chỉ có một mức","C. Theo màu sắc","D. Theo tên người tìm ra"],"answer":"A","explain":"Lỗi được phân loại mức độ: chặn (không dùng được), cao, trung bình, thấp để ưu tiên sửa.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong các lỗi sau, lỗi nào cần được ưu tiên sửa trước nhất?","options":["A. Lỗi làm chương trình không khởi động được","B. Lỗi chính tả trong thông báo","C. Lỗi màu nút chưa đẹp","D. Lỗi căn lề văn bản"],"answer":"A","explain":"Lỗi chặn (làm chương trình không chạy được) có mức ưu tiên cao nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tổ chức kiểm thử:","statements":["a) Cần ghi lại các ca kiểm thử đã thực hiện.","b) Có nghề kiểm thử viên chuyên kiểm thử phần mềm.","c) Lập trình viên không cần tự kiểm thử code của mình.","d) Khi báo lỗi cần mô tả cách tái hiện."],"answer":["T","T","F","T"],"explain":"a) Đúng: để theo dõi và tái hiện. b) Đúng: tester là nghề chuyên nghiệp. c) Sai: lập trình viên phải test code của mình trước. d) Đúng: giúp sửa lỗi hiệu quả.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về mức độ lỗi:","statements":["a) Lỗi chặn được ưu tiên sửa cao nhất.","b) Lỗi giao diện nhỏ thường có mức ưu tiên thấp.","c) Mọi lỗi đều có mức ưu tiên như nhau.","d) Cần phân loại mức độ để sắp xếp thứ tự sửa."],"answer":["T","T","F","T"],"explain":"a) Đúng: lỗi chặn làm sản phẩm không dùng được. b) Đúng: ảnh hưởng nhỏ. c) Sai: mức độ khác nhau. d) Đúng: ưu tiên lỗi nghiêm trọng trước.","points":1},{"type":"short","level":"VD","q":"Người chuyên thực hiện công việc kiểm thử phần mềm được gọi là gì?","answer":"tester","explain":"Tester (kiểm thử viên) là người chuyên kiểm thử phần mềm.","points":0.5},{"type":"short","level":"VDC","q":"Lỗi làm cho chương trình hoàn toàn không chạy được thuộc mức độ nào?","answer":"chặn","explain":"Lỗi chặn (blocker) làm sản phẩm không thể sử dụng, ưu tiên sửa cao nhất.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Một chương trình tốt cần đáp ứng những tiêu chí nào?","options":["A. Đúng đắn, hiệu quả, dễ đọc và dễ bảo trì","B. Code thật dài","C. Nhiều màu sắc","D. Chạy được là đủ"],"answer":"A","explain":"Chương trình tốt cần đúng đắn, hiệu quả và dễ đọc, dễ bảo trì.","points":0.25},{"type":"mcq","level":"NB","q":"Dễ bảo trì nghĩa là gì?","options":["A. Code dễ hiểu, dễ sửa lỗi và nâng cấp","B. Không bao giờ sửa code","C. Xóa code cũ","D. Viết code thật nhanh"],"answer":"A","explain":"Dễ bảo trì nghĩa là code rõ ràng, dễ hiểu để sửa lỗi và nâng cấp sau này.","points":0.25},{"type":"mcq","level":"TH","q":"Việc đặt tên biến rõ ràng, có ý nghĩa giúp ích gì?","options":["A. Code dễ đọc, dễ hiểu","B. Chương trình chạy nhanh hơn","C. Ít tốn bộ nhớ hơn","D. Không có ích gì"],"answer":"A","explain":"Tên biến rõ ràng giúp người đọc hiểu nhanh ý nghĩa, code dễ bảo trì hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Viết chú thích (comment) trong code có tác dụng gì?","options":["A. Giúp người đọc hiểu ý tưởng của đoạn code","B. Làm chương trình chạy nhanh","C. Giảm lỗi cú pháp","D. Tăng dung lượng RAM"],"answer":"A","explain":"Chú thích giải thích ý tưởng giúp người khác (và chính mình sau này) hiểu code nhanh.","points":0.25},{"type":"mcq","level":"VD","q":"Có hai cách giải cùng cho kết quả đúng cho một bài toán. Nên chọn cách nào?","options":["A. Cách hiệu quả hơn (chạy nhanh, ít tốn bộ nhớ)","B. Cách code dài hơn","C. Cách viết khó hiểu hơn","D. Cách nào cũng được"],"answer":"A","explain":"Khi cùng đúng đắn, tiêu chí hiệu quả quyết định: chọn cách chạy nhanh và ít tốn bộ nhớ.","points":0.25},{"type":"mcq","level":"VDC","q":"Để đánh giá toàn diện một chương trình, ta nên kết hợp những gì?","options":["A. Kiểm thử, đo hiệu năng và xem lại code","B. Chỉ nhìn số dòng code","C. Chỉ chạy một lần","D. Đoán mò"],"answer":"A","explain":"Đánh giá toàn diện cần kiểm thử (đúng đắn), đo hiệu năng (hiệu quả) và review code (dễ đọc).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về chất lượng code:","statements":["a) Đặt tên biến rõ ràng giúp code dễ đọc.","b) Viết chú thích giúp người khác hiểu code.","c) Code càng dài càng tốt.","d) Chia thành các hàm ngắn gọn giúp dễ bảo trì."],"answer":["T","T","F","T"],"explain":"a) Đúng: tên rõ nghĩa dễ hiểu. b) Đúng: chú thích giải thích ý tưởng. c) Sai: ngắn gọn, rõ ràng mới tốt. d) Đúng: hàm nhỏ dễ kiểm thử và sửa.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về đánh giá chương trình:","statements":["a) Tính đúng đắn là yêu cầu quan trọng nhất.","b) Tính hiệu quả quan trọng khi dữ liệu lớn.","c) Tính dễ đọc không quan trọng.","d) Cần cân bằng cả ba tiêu chí."],"answer":["T","T","F","T"],"explain":"a) Đúng: sai kết quả thì mọi thứ vô nghĩa. b) Đúng: dữ liệu lớn cần thuật toán hiệu quả. c) Sai: dễ đọc giúp bảo trì lâu dài. d) Đúng: chương trình tốt cân bằng cả ba.","points":1},{"type":"short","level":"NB","q":"Code dễ hiểu, dễ sửa lỗi và nâng cấp được gọi là dễ gì?","answer":"dễ bảo trì","explain":"Tính dễ bảo trì là code dễ hiểu, dễ sửa và nâng cấp.","points":0.5},{"type":"short","level":"VDC","q":"Hoạt động xem lại code của người khác để tìm lỗi và góp ý cải tiến được gọi là gì?","answer":"review code","explain":"Review code là hoạt động xem xét, đánh giá code để tìm lỗi và cải tiến chất lượng.","points":0.5}]}]}
