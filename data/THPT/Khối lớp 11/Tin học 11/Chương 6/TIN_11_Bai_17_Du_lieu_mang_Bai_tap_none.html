<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Mảng một chiều là gì?","options":["A. Dãy hữu hạn các phần tử có cùng kiểu dữ liệu, truy cập qua chỉ số","B. Dãy vô hạn các phần tử có kiểu dữ liệu khác nhau","C. Tập hợp các phần tử không có thứ tự","D. Một giá trị đơn không thể chia nhỏ"],"answer":"A","explain":"Mảng một chiều là dãy hữu hạn các phần tử có cùng kiểu dữ liệu, được sắp xếp liên tiếp và truy cập thông qua chỉ số.","points":0.25},{"type":"mcq","level":"NB","q":"Trong Python, kiểu dữ liệu nào thường được dùng để biểu diễn mảng?","options":["A. tuple","B. list","C. dict","D. set"],"answer":"B","explain":"Python không có kiểu mảng riêng như một số ngôn ngữ khác; kiểu list được dùng để biểu diễn mảng.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [10, 20, 30, 40]. Giá trị của a[0] là bao nhiêu?","options":["A. 10","B. 20","C. 30","D. 40"],"answer":"A","explain":"Chỉ số trong Python bắt đầu từ 0 nên a[0] là phần tử đầu tiên, bằng 10.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [10, 20, 30, 40]. Giá trị của a[-1] là bao nhiêu?","options":["A. 10","B. 20","C. 30","D. 40"],"answer":"D","explain":"Chỉ số âm đếm từ cuối mảng lên: a[-1] là phần tử cuối cùng, bằng 40.","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [5, 2, 8, 1]. Sau khi thực hiện lệnh a.append(9) thì list a là gì?","options":["A. [9, 5, 2, 8, 1]","B. [5, 2, 8, 1, 9]","C. [5, 2, 8, 9, 1]","D. [5, 2, 8, 1]"],"answer":"B","explain":"Phương thức append(x) thêm x vào cuối list, nên a trở thành [5, 2, 8, 1, 9].","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: s = 0; for x in [1, 2, 3, 4]: s = s + x; print(s). Kết quả in ra là gì?","options":["A. 4","B. 9","C. 10","D. 24"],"answer":"C","explain":"Vòng lặp cộng dồn từng phần tử: s = 0 + 1 + 2 + 3 + 4 = 10.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = [4, 7, 2, 9]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) len(a) bằng 4.","b) a[4] là phần tử cuối cùng của mảng.","c) Biểu thức 7 in a cho kết quả True.","d) a.count(4) bằng 2."],"answer":["T","F","T","F"],"explain":"a) Đúng: mảng có 4 phần tử. b) Sai: chỉ số hợp lệ từ 0 đến 3, phần tử cuối là a[3]; truy cập a[4] gây lỗi IndexError. c) Đúng: 7 là phần tử của mảng. d) Sai: số 4 chỉ xuất hiện 1 lần nên count bằng 1.","points":1},{"type":"truefalse","level":"VD","q":"Cho b = [[1, 2], [3, 4], [5, 6]]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) b là mảng hai chiều có 3 hàng và 2 cột.","b) b[1][1] bằng 4.","c) b[0] là [1, 2].","d) len(b[2]) bằng 3."],"answer":["T","T","T","F"],"explain":"a) Đúng: list ngoài có 3 phần tử (3 hàng), mỗi hàng có 2 phần tử (2 cột). b) Đúng: hàng 1 là [3, 4], cột 1 là 4. c) Đúng: b[0] là hàng đầu tiên [1, 2]. d) Sai: hàng 2 là [5, 6] nên len bằng 2.","points":1},{"type":"short","level":"VD","q":"Cho a = [3, 1, 4, 1, 5, 9, 2, 6]. Tính giá trị của biểu thức a[2] + a[5].","answer":"13","explain":"a[2] = 4 (phần tử thứ ba), a[5] = 9 (phần tử thứ sáu). Tổng là 4 + 9 = 13.","points":0.5},{"type":"short","level":"VDC","q":"Cho đoạn chương trình: a = [2, 4, 6, 8]; t = 0; for i in range(len(a)): t = t + a[i] * (i + 1); print(t). Kết quả in ra là gì?","answer":"60","explain":"Trace từng vòng lặp: i = 0 thì t = 0 + 2*1 = 2; i = 1 thì t = 2 + 4*2 = 10; i = 2 thì t = 10 + 6*3 = 28; i = 3 thì t = 28 + 8*4 = 60. Kết quả in ra 60.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Chỉ số của phần tử đầu tiên trong list của Python là bao nhiêu?","options":["A. 0","B. 1","C. -1","D. Tùy người lập trình quy định"],"answer":"A","explain":"Trong Python, chỉ số của phần tử đầu tiên luôn là 0.","points":0.25},{"type":"mcq","level":"NB","q":"Mảng hai chiều có thể hình dung là gì?","options":["A. Một đường thẳng các số","B. Một cây phân cấp","C. Một bảng gồm các hàng và các cột","D. Một tập hợp không thứ tự"],"answer":"C","explain":"Mảng hai chiều gồm m hàng và n cột, giống như một bảng; mỗi phần tử xác định bởi chỉ số hàng và chỉ số cột.","points":0.25},{"type":"mcq","level":"NB","q":"Cho b = [[1, 2, 3], [4, 5, 6]]. Giá trị của b[1][0] là bao nhiêu?","options":["A. 4","B. 1","C. 5","D. 6"],"answer":"A","explain":"b[1] là hàng thứ hai [4, 5, 6]; b[1][0] là phần tử đầu của hàng này, bằng 4.","points":0.25},{"type":"mcq","level":"TH","q":"Câu lệnh nào tạo ra list gồm 5 số 0?","options":["A. [0, 5]","B. list(0, 5)","C. [0] * 5","D. [5] * 0"],"answer":"C","explain":"[0] * 5 lặp lại phần tử 0 năm lần, được [0, 0, 0, 0, 0].","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: a = [1, 2, 3]; a[1] = 9; print(a). Kết quả in ra là gì?","options":["A. [1, 2, 3]","B. [9, 2, 3]","C. [1, 9, 3]","D. [1, 2, 9]"],"answer":"C","explain":"Gán a[1] = 9 thay phần tử ở chỉ số 1 (số 2) thành 9, mảng thành [1, 9, 3].","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [5, 3, 8, 3, 9]; print(a.count(3)). Kết quả in ra là gì?","options":["A. 1","B. 2","C. 3","D. 5"],"answer":"B","explain":"Phương thức count(3) đếm số lần số 3 xuất hiện trong mảng: ở chỉ số 1 và 3, tổng 2 lần.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về mảng trong Python:","statements":["a) Một list có thể chứa các phần tử khác kiểu nhau.","b) Mảng trong Python bắt buộc mọi phần tử phải cùng kiểu như trong ngôn ngữ C.","c) Có thể thay đổi giá trị của phần tử thông qua chỉ số.","d) Không thể thêm phần tử mới vào một list đã tạo."],"answer":["T","F","T","F"],"explain":"a) Đúng: list Python cho phép chứa phần tử khác kiểu nhau. b) Sai: Python không bắt buộc các phần tử cùng kiểu. c) Đúng: gán a[i] = ... thay đổi được phần tử. d) Sai: append cho phép thêm phần tử mới.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [[0] * 3 for _ in range(2)] (mảng 2 hàng 3 cột toàn số 0). Xét tính đúng, sai của các khẳng định sau:","statements":["a) a có 2 hàng và 3 cột.","b) Lệnh a[0][0] = 7 làm cho hàng thứ hai cũng bị đổi theo.","c) len(a) bằng 2.","d) a[1] là [0, 0, 0]."],"answer":["T","F","T","T"],"explain":"a) Đúng: 2 hàng, mỗi hàng 3 cột. b) Sai: dùng list comprehension nên mỗi hàng là list độc lập, sửa hàng 0 không ảnh hưởng hàng 1. c) Đúng: len(a) đếm số hàng, bằng 2. d) Đúng: hàng 1 là [0, 0, 0].","points":1},{"type":"short","level":"NB","q":"Cho a = [10, 20, 30]; a = a + [40]; print(len(a)). Kết quả in ra là gì?","answer":"4","explain":"Phép cộng hai list nối chúng lại: [10, 20, 30] + [40] = [10, 20, 30, 40] có 4 phần tử.","points":0.5},{"type":"short","level":"VDC","q":"Cho a = [1, 2, 3, 4, 5]; b = a[1:4]; print(b[0] + b[2]). Kết quả in ra là gì?","answer":"6","explain":"Cắt lát a[1:4] lấy các phần tử từ chỉ số 1 đến 3: b = [2, 3, 4]. Khi đó b[0] + b[2] = 2 + 4 = 6.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng về mảng một chiều?","options":["A. Các phần tử cùng kiểu, xếp liên tiếp, truy cập qua chỉ số nguyên","B. Các phần tử khác kiểu nhau, không có thứ tự","C. Số phần tử của mảng là vô hạn","D. Không thể truy cập trực tiếp từng phần tử"],"answer":"A","explain":"Mảng một chiều gồm các phần tử cùng kiểu dữ liệu, xếp liên tiếp nhau và được truy cập qua chỉ số nguyên.","points":0.25},{"type":"mcq","level":"NB","q":"Giá trị của len([7, 3, 9]) là bao nhiêu?","options":["A. 7","B. 19","C. 3","D. 9"],"answer":"C","explain":"Hàm len trả về số phần tử của list; [7, 3, 9] có 3 phần tử.","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [2, 4]; b = a * 3. Giá trị của b[4] là bao nhiêu?","options":["A. 2","B. 4","C. 6","D. 8"],"answer":"A","explain":"a * 3 lặp lại list 3 lần: b = [2, 4, 2, 4, 2, 4]. Phần tử ở chỉ số 4 là 2.","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: n = 3; a = []; for i in range(n): a.append(i * i); print(a). Kết quả in ra là gì?","options":["A. [1, 2, 3]","B. [0, 1, 4]","C. [0, 1, 2]","D. [1, 4, 9]"],"answer":"B","explain":"Vòng lặp với i = 0, 1, 2 thêm i*i vào cuối mảng: 0, 1, 4. Kết quả [0, 1, 4].","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [6, 1, 5, 2]; a.sort(); print(a[0]). Kết quả in ra là gì?","options":["A. 6","B. 1","C. 2","D. 5"],"answer":"B","explain":"a.sort() sắp xếp tăng dần ngay trên mảng: [1, 2, 5, 6]. Phần tử đầu a[0] bằng 1.","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [6, 1, 5, 2]; a.reverse(); print(a). Kết quả in ra là gì?","options":["A. [1, 2, 5, 6]","B. [6, 1, 5, 2]","C. [2, 5, 1, 6]","D. [6, 5, 1, 2]"],"answer":"C","explain":"Phương thức reverse() đảo ngược thứ tự các phần tử ngay trên mảng: [2, 5, 1, 6].","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = [10, 20, 30]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) a[0] bằng 10.","b) a[-2] bằng 20.","c) Truy cập a[3] là hợp lệ.","d) len(a) bằng 3."],"answer":["T","T","F","T"],"explain":"a) Đúng: phần tử đầu bằng 10. b) Đúng: a[-2] đếm từ cuối lên, là phần tử thứ hai từ cuối, bằng 20. c) Sai: chỉ số hợp lệ từ 0 đến 2, a[3] gây lỗi IndexError. d) Đúng: mảng có 3 phần tử.","points":1},{"type":"truefalse","level":"VDC","q":"Cho b = [[1, 2, 3], [4, 5, 6]] và đoạn chương trình: t = 0; for i in range(2): for j in range(3): t = t + b[i][j]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vòng lặp ngoài thực hiện đúng 2 lần.","b) Sau khi chạy xong, t bằng 21.","c) b[0][2] + b[1][0] bằng 7.","d) len(b[0]) bằng 2."],"answer":["T","T","T","F"],"explain":"a) Đúng: range(2) cho i = 0, 1. b) Đúng: t cộng dồn mọi phần tử 1+2+3+4+5+6 = 21. c) Đúng: b[0][2] = 3, b[1][0] = 4, tổng bằng 7. d) Sai: hàng 0 là [1, 2, 3] nên len bằng 3.","points":1},{"type":"short","level":"TH","q":"Cho a = [4, 8, 15, 16, 23, 42]; print(a.index(15)). Kết quả in ra là gì?","answer":"2","explain":"Phương thức index(15) trả về chỉ số đầu tiên của giá trị 15 trong mảng, là chỉ số 2.","points":0.5},{"type":"short","level":"VDC","q":"Cho a = [1, 2, 3]; a.insert(1, 9); print(a[1] + a[2]). Kết quả in ra là gì?","answer":"11","explain":"insert(1, 9) chèn số 9 vào vị trí chỉ số 1: a = [1, 9, 2, 3]. Khi đó a[1] + a[2] = 9 + 2 = 11.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Phần tử của mảng hai chiều được xác định bởi yếu tố nào?","options":["A. Chỉ số hàng","B. Chỉ số cột","C. Chỉ số hàng và chỉ số cột","D. Tên của mảng"],"answer":"C","explain":"Mỗi phần tử của mảng hai chiều được xác định bởi cặp chỉ số (hàng, cột), kí hiệu b[i][j].","points":0.25},{"type":"mcq","level":"NB","q":"Cho b = [[7]]. Giá trị của b[0][0] là bao nhiêu?","options":["A. 0","B. 1","C. 7","D. Lỗi truy cập"],"answer":"C","explain":"Mảng có 1 hàng 1 cột, phần tử duy nhất b[0][0] bằng 7.","points":0.25},{"type":"mcq","level":"TH","q":"Câu lệnh nào tạo đúng mảng hai chiều 2 hàng 3 cột toàn số 0, trong đó mỗi hàng là một list độc lập?","options":["A. [[0] * 3] * 2","B. [[0] * 3 for _ in range(2)]","C. [0] * 6","D. [[0, 0, 0], [0, 0]]"],"answer":"B","explain":"List comprehension [[0] * 3 for _ in range(2)] tạo 2 hàng, mỗi hàng là một list [0, 0, 0] độc lập. Cách A làm các hàng cùng trỏ tới một list.","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: a = [3, 1, 2]; print(min(a) + max(a)). Kết quả in ra là gì?","options":["A. 3","B. 4","C. 5","D. 6"],"answer":"B","explain":"min(a) = 1, max(a) = 3, tổng bằng 4.","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [1, 2, 3, 4, 5, 6]; print(sum(a) // len(a)). Kết quả in ra là gì?","options":["A. 3","B. 3.5","C. 4","D. 21"],"answer":"A","explain":"sum(a) = 21, len(a) = 6, phép chia nguyên 21 // 6 = 3.","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [4, 2, 7, 1, 5]; k = 0; for i in range(len(a)): if a[i] != a[0]: k = k + 1; print(k). Kết quả in ra là gì?","options":["A. 1","B. 4","C. 5","D. 0"],"answer":"B","explain":"a[0] = 4. Vòng lặp đếm các phần tử khác 4: 2, 7, 1, 5 là 4 phần tử, nên k = 4.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về cách duyệt mảng:","statements":["a) Câu lệnh for x in a duyệt từng phần tử của mảng a.","b) Câu lệnh for i in range(len(a)) cho phép biết chỉ số của từng phần tử.","c) Không thể dùng while True kết hợp break để duyệt mảng.","d) Không thể duyệt mảng hai chiều bằng hai vòng lặp for lồng nhau."],"answer":["T","T","F","F"],"explain":"a) Đúng: for x in a lấy lần lượt từng phần tử. b) Đúng: i chạy qua mọi chỉ số hợp lệ. c) Sai: while True với break hoàn toàn dùng được để duyệt mảng. d) Sai: hai vòng for lồng nhau là cách chuẩn để duyệt mảng hai chiều.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [2, 4, 2, 8, 2]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) a.count(2) bằng 3.","b) Lệnh a.remove(2) xóa mọi số 2 khỏi mảng.","c) Sau lệnh a.pop() thì len(a) bằng 4.","d) Biểu thức 8 in a cho kết quả True."],"answer":["T","F","T","T"],"explain":"a) Đúng: số 2 xuất hiện 3 lần. b) Sai: remove chỉ xóa phần tử đầu tiên tìm thấy. c) Đúng: pop() loại phần tử cuối, còn 4 phần tử. d) Đúng: 8 là phần tử của mảng.","points":1},{"type":"short","level":"NB","q":"Cho a = [1, 2] + [3, 4]; print(a[3]). Kết quả in ra là gì?","answer":"4","explain":"Nối hai list được [1, 2, 3, 4]; phần tử ở chỉ số 3 là 4.","points":0.5},{"type":"short","level":"VDC","q":"Cho b = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]; s = 0; for i in range(3): s = s + b[i][i]; print(s). Kết quả in ra là gì?","answer":"15","explain":"Vòng lặp cộng các phần tử trên đường chéo chính: b[0][0] + b[1][1] + b[2][2] = 1 + 5 + 9 = 15.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Trong Python, kiểu list được dùng để làm gì?","options":["A. Lưu trữ một dãy các phần tử có thứ tự, truy cập qua chỉ số","B. Lưu trữ duy nhất một số nguyên","C. Định nghĩa một hàm mới","D. Kết nối tới cơ sở dữ liệu"],"answer":"A","explain":"List lưu trữ dãy các phần tử có thứ tự, mỗi phần tử được truy cập qua chỉ số của nó.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = []; a.append(5); a.append(7). List a lúc này là gì?","options":["A. [5]","B. [7, 5]","C. [5, 7]","D. []"],"answer":"C","explain":"append thêm lần lượt 5 rồi 7 vào cuối list rỗng, được [5, 7].","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [9, 4, 7]. Giá trị của a[-3] là bao nhiêu?","options":["A. 7","B. 4","C. 9","D. Lỗi truy cập"],"answer":"C","explain":"a[-3] đếm từ cuối lên 3 vị trí, chính là phần tử đầu tiên, bằng 9.","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: a = [1, 2, 3, 4, 5]; print(a[1:4]). Kết quả in ra là gì?","options":["A. [1, 2, 3]","B. [2, 3, 4]","C. [2, 3, 4, 5]","D. [1, 2, 3, 4]"],"answer":"B","explain":"Cắt lát a[1:4] lấy các phần tử từ chỉ số 1 đến chỉ số 3: [2, 3, 4].","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [3, 6, 9]; b = []; for x in a: b.append(x * 2); print(b). Kết quả in ra là gì?","options":["A. [3, 6, 9]","B. [6, 12, 18]","C. [6, 6, 6]","D. [9, 12, 15]"],"answer":"B","explain":"Mỗi phần tử x được nhân đôi rồi thêm vào b: [3*2, 6*2, 9*2] = [6, 12, 18].","points":0.25},{"type":"mcq","level":"VDC","q":"Cho đoạn chương trình: a = [5, 1, 4, 2, 3]; c = 0; for i in range(len(a)): for j in range(len(a)): if a[i] == a[j]: c = c + 1; print(c). Kết quả in ra là gì?","options":["A. 0","B. 5","C. 10","D. 25"],"answer":"B","explain":"Mọi phần tử đều khác nhau nên a[i] == a[j] chỉ đúng khi i và j trùng nhau, có đúng 5 cặp như vậy. Kết quả c = 5.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về khái niệm mảng:","statements":["a) Mảng là dãy hữu hạn các phần tử.","b) Các phần tử của mảng phải có kiểu dữ liệu khác nhau.","c) Chỉ số mảng trong Python bắt đầu từ 1.","d) Có thể dùng a[-1] để lấy phần tử cuối cùng của mảng."],"answer":["T","F","F","T"],"explain":"a) Đúng: mảng là dãy hữu hạn phần tử. b) Sai: các phần tử mảng có cùng kiểu dữ liệu. c) Sai: chỉ số trong Python bắt đầu từ 0. d) Đúng: chỉ số âm -1 trỏ tới phần tử cuối.","points":1},{"type":"truefalse","level":"VD","q":"Cho b = [[2, 4], [6, 8]]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) b[0][1] bằng 4.","b) Tổng các phần tử của hàng 0 bằng 6.","c) b[1] là [6, 8].","d) b có 4 phần tử nên len(b) bằng 4."],"answer":["T","T","T","F"],"explain":"a) Đúng: hàng 0 là [2, 4], cột 1 là 4. b) Đúng: 2 + 4 = 6. c) Đúng: hàng 1 là [6, 8]. d) Sai: len(b) đếm số hàng, bằng 2.","points":1},{"type":"short","level":"TH","q":"Cho a = [10, 20, 30, 40, 50]; print(a[0] + a[-1]). Kết quả in ra là gì?","answer":"60","explain":"a[0] = 10 là phần tử đầu, a[-1] = 50 là phần tử cuối. Tổng bằng 60.","points":0.5},{"type":"short","level":"VDC","q":"Cho đoạn chương trình: a = [1, 2, 3, 4]; s = \"\"; for x in a: s = s + str(x); print(s). Kết quả in ra là gì?","answer":"1234","explain":"Mỗi số được đổi thành chuỗi rồi nối dồn: \"\" + \"1\" + \"2\" + \"3\" + \"4\" = \"1234\".","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Câu lệnh nào cho biết số phần tử của list a?","options":["A. size(a)","B. len(a)","C. count(a)","D. length.a"],"answer":"B","explain":"Hàm len(a) trả về số phần tử của list a.","points":0.25},{"type":"mcq","level":"NB","q":"Mảng hai chiều trong Python thường được tạo bằng cách nào?","options":["A. Một số nguyên duy nhất","B. Một chuỗi kí tự","C. Danh sách các danh sách (list lồng nhau)","D. Một từ điển"],"answer":"C","explain":"Mảng hai chiều được biểu diễn bằng list lồng nhau: mỗi phần tử của list ngoài là một list con tương ứng với một hàng.","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: a = [8, 3, 5]; a[0], a[1] = a[1], a[0]; print(a). Kết quả in ra là gì?","options":["A. [8, 3, 5]","B. [3, 8, 5]","C. [5, 3, 8]","D. [3, 5, 8]"],"answer":"B","explain":"Lệnh gán đồng thời hoán đổi giá trị hai phần tử đầu: a thành [3, 8, 5].","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: s = 0; a = [2, 4, 6]; for i in range(len(a)): s = s + a[i]; print(s). Kết quả in ra là gì?","options":["A. 6","B. 12","C. 10","D. 3"],"answer":"B","explain":"Vòng lặp theo chỉ số cộng dồn: s = 2 + 4 + 6 = 12.","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [7, 2, 9, 4]; print(sorted(a)[1]). Kết quả in ra là gì?","options":["A. 7","B. 2","C. 9","D. 4"],"answer":"D","explain":"sorted(a) tạo list mới đã sắp xếp tăng dần [2, 4, 7, 9]; phần tử ở chỉ số 1 là 4. Chú ý mảng a gốc không bị thay đổi.","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [1, 2, 3]; b = a; b[0] = 9; print(a[0]). Kết quả in ra là gì?","options":["A. 1","B. 9","C. 3","D. Lỗi"],"answer":"B","explain":"Lệnh b = a làm b và a cùng trỏ tới một list; sửa b[0] cũng làm a[0] thành 9.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = [5, 10, 15, 20]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) a[2] bằng 15.","b) a[-1] bằng 15.","c) a[1:3] là [10, 15].","d) sum(a) bằng 50."],"answer":["T","F","T","T"],"explain":"a) Đúng: phần tử ở chỉ số 2 là 15. b) Sai: a[-1] là phần tử cuối, bằng 20. c) Đúng: cắt lát từ chỉ số 1 đến 2 được [10, 15]. d) Đúng: 5 + 10 + 15 + 20 = 50.","points":1},{"type":"truefalse","level":"VDC","q":"Xét hai cách tạo mảng 2 hàng 3 cột toàn số 0: (1) b = [[0] * 3] * 2 và (2) c = [[0] * 3 for _ in range(2)]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cách (1) tạo ra bảng 2 hàng 3 cột toàn số 0.","b) Trong cách (1), hai hàng là hai list độc lập nhau.","c) Với cách (1), sau lệnh b[0][0] = 1 thì b[1][0] cũng thành 1.","d) Nên dùng cách (2) để mỗi hàng là một list độc lập."],"answer":["T","F","T","T"],"explain":"a) Đúng: hiển thị ban đầu là bảng 2x3 toàn số 0. b) Sai: cách (1) làm hai hàng cùng trỏ tới một list. c) Đúng: vì cùng trỏ tới một list nên sửa một hàng làm hàng kia đổi theo. d) Đúng: list comprehension tạo các hàng độc lập, tránh lỗi trên.","points":1},{"type":"short","level":"NB","q":"Cho a = [4, 5, 6]; a.extend([7, 8]); print(len(a)). Kết quả in ra là gì?","answer":"5","explain":"extend nối thêm các phần tử [7, 8] vào cuối: a = [4, 5, 6, 7, 8] có 5 phần tử.","points":0.5},{"type":"short","level":"VDC","q":"Cho đoạn chương trình: a = [3, 1, 2]; n = len(a); s = 0; i = 0; while True: s = s + a[i]; i = i + 1; if i == n: break; print(s). Kết quả in ra là gì?","answer":"6","explain":"Vòng lặp while True cộng dồn từng phần tử rồi tăng i, dừng khi i == 3: s = 3 + 1 + 2 = 6.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Đặc điểm nào sau đây mô tả đúng mảng một chiều?","options":["A. Các phần tử cùng kiểu, xếp liên tiếp, truy cập qua chỉ số nguyên","B. Các phần tử khác kiểu, truy cập bằng tên","C. Chỉ chứa duy nhất một phần tử","D. Các phần tử không có thứ tự"],"answer":"A","explain":"Mảng một chiều gồm các phần tử cùng kiểu dữ liệu, xếp liên tiếp nhau và được truy cập qua chỉ số nguyên.","points":0.25},{"type":"mcq","level":"NB","q":"Cho b = [[1, 2], [3, 4]]. Số hàng của b là bao nhiêu?","options":["A. 1","B. 2","C. 4","D. 0"],"answer":"B","explain":"List ngoài có 2 phần tử là 2 list con, tương ứng với 2 hàng; len(b) = 2.","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: a = [10, 20, 30, 40]; del a[1]; print(a). Kết quả in ra là gì?","options":["A. [10, 30, 40]","B. [20, 30, 40]","C. [10, 20, 30]","D. [10, 20, 40]"],"answer":"A","explain":"del a[1] xóa phần tử ở chỉ số 1 (số 20), mảng còn [10, 30, 40].","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: a = []; for i in range(1, 4): a.append(2 * i); print(a). Kết quả in ra là gì?","options":["A. [2, 4, 6]","B. [1, 2, 3]","C. [2, 4, 6, 8]","D. [0, 2, 4]"],"answer":"A","explain":"i chạy 1, 2, 3; thêm 2*i vào cuối mảng được [2, 4, 6].","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [5, 2, 8, 1, 9]; print(max(a) - min(a)). Kết quả in ra là gì?","options":["A. 4","B. 7","C. 8","D. 9"],"answer":"C","explain":"max(a) = 9, min(a) = 1, hiệu bằng 8.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho đoạn chương trình: a = [1, 2, 3, 4, 5]; b = [x * x for x in a if x != 3]; print(b). Kết quả in ra là gì?","options":["A. [1, 4, 9, 16, 25]","B. [1, 4, 16, 25]","C. [2, 4, 8, 10]","D. [1, 4, 16]"],"answer":"B","explain":"List comprehension bình phương mỗi x khác 3: 1, 2, 4, 5 cho [1, 4, 16, 25].","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nhập dữ liệu mảng từ bàn phím:","statements":["a) Hàm input() đọc vào một dòng dưới dạng chuỗi.","b) int(input()) đổi dữ liệu vừa nhập thành số nguyên.","c) Câu lệnh list(map(int, input().split())) tạo list các số nguyên từ một dòng nhập.","d) Python không thể nhập mảng từ bàn phím."],"answer":["T","T","T","F"],"explain":"a) Đúng: input() luôn trả về chuỗi. b) Đúng: int() chuyển chuỗi thành số nguyên. c) Đúng: tách dòng thành các từ rồi đổi từng từ thành số nguyên. d) Sai: Python nhập mảng từ bàn phím rất dễ dàng.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [1, 3, 5, 7, 9]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi phần tử của a đều là số lẻ.","b) a[2] + a[3] bằng 12.","c) Biểu thức 4 in a cho kết quả True.","d) a.count(1) bằng 1."],"answer":["T","T","F","T"],"explain":"a) Đúng: 1, 3, 5, 7, 9 đều là số lẻ. b) Đúng: 5 + 7 = 12. c) Sai: 4 không phải phần tử của mảng nên kết quả False. d) Đúng: số 1 xuất hiện đúng 1 lần.","points":1},{"type":"short","level":"VD","q":"Cho a = [2, 4, 6, 8]; print(a[1] * a[3]). Kết quả in ra là gì?","answer":"32","explain":"a[1] = 4, a[3] = 8, tích bằng 32.","points":0.5},{"type":"short","level":"VDC","q":"Cho đoạn chương trình: a = [7, 3, 9, 1]; i = 0; m = a[0]; while True: i = i + 1; if i == len(a): break; m = max(m, a[i]); print(m). Kết quả in ra là gì?","answer":"9","explain":"Trace: m khởi đầu 7; i=1 thì m = max(7,3) = 7; i=2 thì m = max(7,9) = 9; i=3 thì m = max(9,1) = 9; i=4 bằng len(a) nên dừng. Kết quả 9.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Với list có n phần tử, các chỉ số hợp lệ là khoảng nào?","options":["A. Từ 0 đến n - 1","B. Từ 1 đến n","C. Từ 0 đến n","D. Từ -n đến n"],"answer":"A","explain":"Chỉ số bắt đầu từ 0 nên với n phần tử, chỉ số hợp lệ chạy từ 0 đến n - 1.","points":0.25},{"type":"mcq","level":"NB","q":"Kí hiệu b[i][j] trong mảng hai chiều có nghĩa là gì?","options":["A. Phần tử thứ i của mảng một chiều","B. Phần tử ở hàng i, cột j","C. Tích của b[i] và b[j]","D. Hàng i nhân với cột j"],"answer":"B","explain":"b[i][j] là phần tử nằm ở hàng i và cột j của mảng hai chiều.","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [1, 2, 3, 4]; print(a[::2]). Kết quả in ra là gì?","options":["A. [1, 2]","B. [1, 3]","C. [2, 4]","D. [1, 2, 3, 4]"],"answer":"B","explain":"Cắt lát với bước nhảy 2 lấy các phần tử ở chỉ số 0, 2: [1, 3].","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: a = [3, 1, 4]; b = sorted(a, reverse=True); print(b[0]). Kết quả in ra là gì?","options":["A. 1","B. 3","C. 4","D. 5"],"answer":"C","explain":"sorted với reverse=True sắp xếp giảm dần: [4, 3, 1]; phần tử đầu bằng 4.","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [2, 5, 1, 4, 3]; k = 0; for x in a: if x == 3: continue; k = k + 1; print(k). Kết quả in ra là gì?","options":["A. 3","B. 4","C. 5","D. 15"],"answer":"B","explain":"Lệnh continue bỏ qua số 3, các phần tử còn lại đều làm k tăng 1: có 4 phần tử khác 3 nên k = 4.","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [[1, 2], [3, 4]]; s = 0; for hang in a: s = s + hang[0]; print(s). Kết quả in ra là gì?","options":["A. 3","B. 4","C. 6","D. 10"],"answer":"B","explain":"Vòng lặp duyệt từng hàng, cộng phần tử đầu của mỗi hàng: 1 + 3 = 4.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = [6, 12, 18]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) a[0] * 2 bằng 12.","b) a[1] bằng 12.","c) a[-1] bằng 6.","d) len(a) bằng 3."],"answer":["T","T","F","T"],"explain":"a) Đúng: 6 * 2 = 12. b) Đúng: phần tử ở chỉ số 1 là 12. c) Sai: a[-1] là phần tử cuối, bằng 18. d) Đúng: mảng có 3 phần tử.","points":1},{"type":"truefalse","level":"VD","q":"Cho b = [[5] * 3 for _ in range(2)] (bảng 2 hàng 3 cột toàn số 5). Xét tính đúng, sai của các khẳng định sau:","statements":["a) b[0][2] bằng 5.","b) Tổng mọi phần tử của b bằng 30.","c) len(b[1]) bằng 2.","d) b[1][1] bằng 5."],"answer":["T","T","F","T"],"explain":"a) Đúng: mọi phần tử đều bằng 5. b) Đúng: 6 phần tử nhân 5 bằng 30. c) Sai: mỗi hàng có 3 phần tử nên len bằng 3. d) Đúng: mọi phần tử đều bằng 5.","points":1},{"type":"short","level":"NB","q":"Cho a = [11, 22, 33]; a[2] = a[0] + a[1]; print(a[2]). Kết quả in ra là gì?","answer":"33","explain":"a[2] được gán bằng 11 + 22 = 33.","points":0.5},{"type":"short","level":"VDC","q":"Cho đoạn chương trình: a = [5, 4, 3, 2, 1]; n = len(a); s = 0; for i in range(n): s = s + a[n - 1 - i]; print(s). Kết quả in ra là gì?","answer":"15","explain":"Chỉ số n - 1 - i chạy ngược từ 4 về 0 nên vòng lặp cộng các phần tử từ cuối lên đầu: 1 + 2 + 3 + 4 + 5 = 15.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Điều nào sau đây đúng khi nói về list trong Python?","options":["A. Số phần tử của list là cố định, không thể thay đổi","B. List có thể thay đổi số phần tử trong quá trình chạy chương trình","C. List chỉ chứa được số nguyên","D. Không thể truy cập phần tử của list"],"answer":"B","explain":"List trong Python có kích thước động: có thể thêm, xóa phần tử trong khi chương trình chạy.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [1, 2, 3]. Biểu thức a + [4] cho kết quả gì?","options":["A. [1, 2, 3, 4]","B. [5, 2, 3]","C. [1, 2, 3, [4]]","D. Lỗi"],"answer":"A","explain":"Phép cộng hai list nối chúng lại thành [1, 2, 3, 4].","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: a = [10, 20, 30]; x = a.pop(1); print(x, a). Kết quả in ra là gì?","options":["A. 20 [10, 30]","B. 10 [20, 30]","C. 30 [10, 20]","D. 20 [10, 20, 30]"],"answer":"A","explain":"pop(1) loại và trả về phần tử ở chỉ số 1 (số 20); mảng còn [10, 30].","points":0.25},{"type":"mcq","level":"NB","q":"Cho đoạn chương trình: n = int(\"5\"); a = [0] * n; print(len(a)). Kết quả in ra là gì?","options":["A. 0","B. 5","C. \"5\"","D. Lỗi"],"answer":"B","explain":"int(\"5\") được 5; [0] * 5 tạo list 5 số 0 nên len bằng 5.","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [4, 1, 6, 3]; a.sort(reverse=True); print(a[1]). Kết quả in ra là gì?","options":["A. 6","B. 4","C. 3","D. 1"],"answer":"B","explain":"sort(reverse=True) sắp xếp giảm dần: [6, 4, 3, 1]; phần tử ở chỉ số 1 là 4.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho đoạn chương trình: a = [2, 7, 1, 8, 2, 8]; print(a.index(8)). Kết quả in ra là gì?","options":["A. 3","B. 4","C. 5","D. 6"],"answer":"A","explain":"index(8) trả về chỉ số đầu tiên của số 8 trong mảng, là chỉ số 3.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = [9, 8, 7, 6]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) a[::-1] là [6, 7, 8, 9].","b) a[1:2] là [8].","c) Truy cập a[4] là hợp lệ.","d) Biểu thức 7 in a cho kết quả True."],"answer":["T","T","F","T"],"explain":"a) Đúng: bước nhảy -1 đảo ngược mảng. b) Đúng: cắt lát từ chỉ số 1 đến 1 được [8]. c) Sai: chỉ số hợp lệ từ 0 đến 3. d) Đúng: 7 là phần tử của mảng.","points":1},{"type":"truefalse","level":"VDC","q":"Cho b = [[i + j for j in range(3)] for i in range(2)]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) b có 2 hàng.","b) b[1] là [1, 2, 3].","c) b[0][0] bằng 0.","d) b[1][2] bằng 4."],"answer":["T","T","T","F"],"explain":"Với i = 0 được hàng [0, 1, 2]; với i = 1 được hàng [1, 2, 3]. a) Đúng: 2 hàng. b) Đúng. c) Đúng: 0 + 0 = 0. d) Sai: b[1][2] = 1 + 2 = 3.","points":1},{"type":"short","level":"VD","q":"Cho a = [3, 6, 9, 12]; print(sum(a) - a[0]). Kết quả in ra là gì?","answer":"27","explain":"sum(a) = 30, a[0] = 3, hiệu bằng 27.","points":0.5},{"type":"short","level":"VDC","q":"Cho a = [10, 20]; b = [30, 40]; c = a + b; print(c[1] + c[2]). Kết quả in ra là gì?","answer":"50","explain":"c = [10, 20, 30, 40]; c[1] + c[2] = 20 + 30 = 50.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Mảng hai chiều gồm m hàng và n cột có bao nhiêu phần tử?","options":["A. m + n","B. m * n","C. m - n","D. 2 * (m + n)"],"answer":"B","explain":"Mỗi hàng có n phần tử, có m hàng nên tổng số phần tử là m * n.","points":0.25},{"type":"mcq","level":"NB","q":"Lệnh nào thêm phần tử 100 vào cuối list a?","options":["A. a.add(100)","B. a.append(100)","C. a.insert(100)","D. a + 100"],"answer":"B","explain":"Phương thức append(100) thêm 100 vào cuối list a.","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: a = [5, 10, 15]; print(a[len(a) - 1]). Kết quả in ra là gì?","options":["A. 5","B. 10","C. 15","D. 3"],"answer":"C","explain":"len(a) - 1 = 2 là chỉ số của phần tử cuối, a[2] = 15.","points":0.25},{"type":"mcq","level":"TH","q":"Cho đoạn chương trình: a = [1, 2, 3, 4, 5, 6]; print(len(a[2:5])). Kết quả in ra là gì?","options":["A. 2","B. 3","C. 4","D. 6"],"answer":"B","explain":"a[2:5] = [3, 4, 5] có 3 phần tử.","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [8, 6, 7, 5, 3]; s = 0; for i in range(0, len(a), 2): s = s + a[i]; print(s). Kết quả in ra là gì?","options":["A. 15","B. 18","C. 21","D. 29"],"answer":"B","explain":"i chạy 0, 2, 4; s = a[0] + a[2] + a[4] = 8 + 7 + 3 = 18.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho đoạn chương trình: a = [1, 2, 3]; b = [4, 5]; c = []; for x in a: for y in b: c.append(x + y); print(len(c)). Kết quả in ra là gì?","options":["A. 5","B. 6","C. 15","D. 30"],"answer":"B","explain":"Hai vòng lặp lồng nhau tạo mọi cặp (x, y): 3 * 2 = 6 cặp nên len(c) = 6.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về khởi tạo mảng:","statements":["a) Lệnh a = [0] * 4 tạo ra [0, 0, 0, 0].","b) Lệnh a = list(range(3)) tạo ra [0, 1, 2].","c) Lệnh a = [1] * [2] là hợp lệ.","d) Có thể tạo list rỗng rồi dùng append để thêm dần phần tử."],"answer":["T","T","F","T"],"explain":"a) Đúng: lặp phần tử 0 bốn lần. b) Đúng: range(3) cho 0, 1, 2. c) Sai: không thể nhân list với list. d) Đúng: cách phổ biến để nhập mảng.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [12, 7, 19, 3, 25]. Xét tính đúng, sai của các khẳng định sau:","statements":["a) max(a) bằng 25.","b) min(a) bằng 3.","c) a.index(7) bằng 1.","d) sorted(a)[0] bằng 3."],"answer":["T","T","T","T"],"explain":"a) Đúng: phần tử lớn nhất là 25. b) Đúng: phần tử nhỏ nhất là 3. c) Đúng: số 7 ở chỉ số 1. d) Đúng: sorted sắp xếp tăng dần [3, 7, 12, 19, 25], phần tử đầu là 3.","points":1},{"type":"short","level":"NB","q":"Cho a = [2, 3, 5, 7, 11]; print(a[4] - a[0]). Kết quả in ra là gì?","answer":"9","explain":"a[4] = 11, a[0] = 2, hiệu bằng 9.","points":0.5},{"type":"short","level":"VDC","q":"Cho đoạn chương trình: a = [4, 9, 2, 7, 5]; s = 0; for i in range(len(a)): if a[i] != max(a): s = s + 1; print(s). Kết quả in ra là gì?","answer":"4","explain":"max(a) = 9. Vòng lặp đếm các phần tử khác 9: 4, 2, 7, 5 là 4 phần tử nên s = 4.","points":0.5}]}]}
