ó là mô tả chuẩn của nổi bọt. d) Sai: cần nhiều lượt.","level":"NB","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về sắp xếp nổi bọt:","statements":["a) Thuật toán so sánh từng cặp phần tử kề nhau.","b) Đổi chỗ hai phần tử khi chúng sai thứ tự tăng dần.","c) Sau mỗi lượt, phần tử lớn nhất về đúng vị trí cuối.","d) Chỉ cần một lượt duy nhất là mảng sắp xếp xong."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a) Đúng: 5 lớn hơn 3. b) Đúng: 5 nhỏ hơn 8. c) Đúng: 8 lớn hơn 1. d) Sai: sau lượt 1 mảng là [3, 5, 1, 8].","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về trace lượt đầu của nổi bọt với a = [5, 3, 8, 1]:","statements":["a) Ở j = 0, đổi chỗ 5 và 3.","b) Ở j = 1, không đổi chỗ 5 và 8.","c) Ở j = 2, đổi chỗ 8 và 1.","d) Sau lượt 1, mảng trở thành [1, 3, 5, 8]."],"type":"truefalse"},{"answer":"1","explain":"Sắp xếp tăng dần [3, 1, 2] thành [1, 2, 3] nên a[0] = 1.","level":"NB","points":0.5,"q":"Cho a = [3, 1, 2]. Sau khi sắp xếp tăng dần, giá trị a[0] bằng bao nhiêu?","type":"short"},{"answer":"4","explain":"Lượt 1: 2 lần đổi. Lượt 2: [3,5,1,8] thành [3,1,5,8], 1 lần. Lượt 3: [1,3,5,8], 1 lần. Tổng 4.","level":"VDC","points":0.5,"q":"Hàm bubble_sort_dem([5, 3, 8, 1]) đếm tổng số lần đổi chỗ của nổi bọt. Kết quả là?","type":"short"}]},{"name":"Đề 2","questions":[{"answer":"A","explain":"Sắp xếp chèn: duyệt từng phần tử và chèn vào đúng vị trí trong phần đã sắp xếp.","level":"NB","options":["A. Chèn từng phần tử vào đúng vị trí trong phần đã sắp xếp","B. So sánh từng cặp kề nhau","C. Chọn phần tử nhỏ nhất mỗi lượt","D. Chia đôi mảng"],"points":0.25,"q":"Ý tưởng của thuật toán sắp xếp chèn là gì?","type":"mcq"},{"answer":"A","explain":"Cả ba thuật toán đơn giản đều có hai vòng lặp lồng nhau nên O(n^2).","level":"NB","options":["A. O(n^2)","B. O(n)","C. O(log n)","D. O(n log n)"],"points":0.25,"q":"Độ phức tạp trong trường hợp xấu nhất của ba thuật toán sắp xếp đơn giản là gì?","type":"mcq"},{"answer":"A","explain":"Vòng trong chạy j từ 0 đến n-2-i, tức range(n - 1 - i).","level":"NB","options":["A. range(n - 1 - i)","B. range(n)","C. range(i)","D. range(1)"],"points":0.25,"q":"Trong sắp xếp nổi bọt, vòng lặp trong (theo j) chạy trong phạm vi nào?","type":"mcq"},{"answer":"A","explain":"Nhỏ nhất trong [5,3,8,1] là 1 ở chỉ số 3; đổi a[0] và a[3] được [1,3,8,5].","level":"TH","options":["A. [1, 3, 8, 5]","B. [3, 5, 8, 1]","C. [1, 3, 5, 8]","D. [5, 3, 8, 1]"],"points":0.25,"q":"Cho a = [5, 3, 8, 1]. Sau lượt i = 0 của sắp xếp chọn (tăng dần), mảng trở thành gì?","type":"mcq"},{"answer":"A","explain":"Nhỏ nhất là 11 ở chỉ số 4; đổi với a[0] được [11, 25, 12, 22, 64].","level":"TH","options":["A. [11, 25, 12, 22, 64]","B. [11, 12, 25, 22, 64]","C. [64, 25, 12, 22, 11]","D. [11, 64, 25, 12, 22]"],"points":0.25,"q":"Cho a = [64, 25, 12, 22, 11]. Sau lượt đầu của sắp xếp chọn, mảng trở thành gì?","type":"mcq"},{"answer":"A","explain":"Sắp xếp chọn tăng dần đầy đủ cho [1, 3, 5, 8].","level":"VD","options":["A. [1, 3, 5, 8]","B. [8, 5, 3, 1]","C. [1, 3, 8, 5]","D. [5, 3, 8, 1]"],"points":0.25,"q":"Hàm selection_sort([5, 3, 8, 1]) sắp xếp tăng dần trả về mảng nào?","type":"mcq"},{"answer":["T","T","T","T"],"explain":"a,b) Đúng: đó là hai bước của mỗi lượt. c) Đúng: i phần tử đầu đã đúng vị trí. d) Đúng: lượt cuối không cần thiết.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về sắp xếp chọn:","statements":["a) Mỗi lượt tìm phần tử nhỏ nhất trong phần chưa sắp xếp.","b) Đổi chỗ phần tử nhỏ nhất với phần tử đầu của phần chưa sắp xếp.","c) Sau lượt i, i phần tử đầu đã đúng vị trí cuối cùng.","d) Với mảng n phần tử, cần n - 1 lượt."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a) Đúng: 3+2+1=6. b) Đúng: 4+3+2+1=10. c) Đúng: công thức chuẩn. d) Sai: đổi chỗ ít hơn hoặc bằng số lần so sánh.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về số lần so sánh của các thuật toán sắp xếp đơn giản:","statements":["a) Với n = 4, nổi bọt thực hiện 6 lần so sánh.","b) Với n = 5, nổi bọt thực hiện 10 lần so sánh.","c) Công thức tổng quát là n(n-1)/2 lần so sánh.","d) Số lần đổi chỗ luôn bằng số lần so sánh."],"type":"truefalse"},{"answer":"15","explain":"Số lần so sánh là 5+4+3+2+1 = 15.","level":"VDC","points":0.5,"q":"Với mảng 6 phần tử, sắp xếp nổi bọt thực hiện bao nhiêu lần so sánh?","type":"short"},{"answer":"1","explain":"j=0: 2 và 1 đổi chỗ thành [1,2]; các lượt sau không đổi. Tổng 1 lần.","level":"VD","points":0.5,"q":"Hàm bubble_sort_dem([2, 1]) đếm số lần đổi chỗ của nổi bọt. Kết quả là?","type":"short"}]},{"name":"Đề 3","questions":[{"answer":"A","explain":"Giảm dần nghĩa là phần tử trước phải lớn hơn hoặc bằng phần tử sau, nên đổi khi a[j] nhỏ hơn a[j+1].","level":"NB","options":["A. a[j] nhỏ hơn a[j+1]","B. a[j] lớn hơn a[j+1]","C. a[j] bằng a[j+1]","D. Luôn đổi chỗ"],"points":0.25,"q":"Để sắp xếp giảm dần bằng nổi bọt, đổi chỗ hai phần tử kề khi nào?","type":"mcq"},{"answer":"A","explain":"max cho giá trị lớn hơn; thêm điều kiện khác nhau để loại trường hợp bằng nhau.","level":"NB","options":["A. a[j] == max(a[j], a[j+1]) and a[j] != a[j+1]","B. a[j] == min(a[j], a[j+1])","C. a[j] != a[j+1]","D. a[j] == a[j+1]"],"points":0.25,"q":"Muốn viết lại điều kiện a[j] lớn hơn a[j+1] mà không dùng dấu lớn hơn, cách nào đúng?","type":"mcq"},{"answer":"A","explain":"Sắp xếp giảm dần đầy đủ cho [8, 5, 3, 1].","level":"TH","options":["A. [8, 5, 3, 1]","B. [1, 3, 5, 8]","C. [8, 3, 5, 1]","D. [5, 3, 8, 1]"],"points":0.25,"q":"Hàm bubble_sort_giam([5, 3, 8, 1]) sắp xếp giảm dần trả về mảng nào?","type":"mcq"},{"answer":"A","explain":"j=0: 5 và 3 không đổi; j=1: đổi 3 và 8 thành [5,8,3,1]; j=2: 3 và 1 không đổi.","level":"TH","options":["A. [5, 8, 3, 1]","B. [8, 5, 3, 1]","C. [5, 3, 8, 1]","D. [3, 5, 8, 1]"],"points":0.25,"q":"Cho a = [5, 3, 8, 1]. Sau lượt đầu của nổi bọt sắp xếp GIẢM dần, mảng trở thành gì?","type":"mcq"},{"answer":"A","explain":"Sắp xếp tăng dần [3,1,4,1,5] được [1,1,3,4,5].","level":"VD 1, 3, 2]","D. [3, 2, 1]"],"points":0.25,"q":"Cho a = [2, 1, 3]. Sau lượt đầu của nổi bọt (tăng dần), mảng trở thành gì?","type":"mcq"},{"answer":"A","explain":"Chỉ có 1 lần đổi chỗ ở lượt 1.","level":"TH","options":["A. 1","B. 2","C. 0","D. 3"],"points":0.25,"q":"Cho a = [2, 1, 3]. Tổng số lần đổi chỗ của nổi bọt (tăng dần) là bao nhiêu?","type":"mcq"},{"answer":"A","explain":"Lượt 1: 3 lần đổi. Lượt 2: 1 lần đổi. Lượt 3: 0. Tổng 4.","level":"VD","options":["A. 4","B. 3","C. 5","D. 6"],"points":0.25,"q":"Cho a = [4, 1, 3, 2]. Tổng số lần đổi chỗ của nổi bọt (tăng dần) là bao nhiêu?","type":"mcq"},{"answer":"A","explain":"Số lần so sánh là 3+2+1 = 6.","level":"VDC","options":["A. 6","B. 12","C. 4","D. 3"],"points":0.25,"q":"Cho a = [4, 1, 3, 2]. Tổng số lần so sánh của nổi bọt là bao nhiêu?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a) Đúng: ghi rõ từng lượt. b) Đúng: theo yêu cầu đề. c) Sai: cần thể hiện quá trình. d) Đúng: bảng giúp tránh nhầm lẫn.","level":"NB","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về trình bày bài thi:","statements":["a) Nên ghi rõ trạng thái mảng sau mỗi lượt.","b) Ghi số lần đổi chỗ khi đề yêu cầu.","c) Chỉ ghi đáp số cuối cùng là đủ điểm tối đa.","d) Vẽ bảng trace giúp tránh nhầm lẫn."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a) Đúng: mảng càng xáo trộn càng nhiều đổi chỗ. b) Đúng: mọi cặp đều phải đổi. c) Đúng: với nổi bọt cơ bản, số so sánh cố định. d) Sai: đổi chỗ phụ thuộc thứ tự ban đầu.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về phân tích số lần đổi chỗ và so sánh:","statements":["a) Đếm đổi chỗ phản ánh mức độ xáo trộn ban đầu của mảng.","b) Mảng sắp xếp ngược có số lần đổi chỗ lớn nhất.","c) Số lần so sánh của nổi bọt cơ bản không phụ thuộc thứ tự ban đầu.","d) Số lần đổi chỗ không phụ thuộc thứ tự ban đầu của mảng."],"type":"truefalse"},{"answer":"2","explain":"Lượt 1: 1 lần đổi. Lượt 2: 1 lần đổi. Tổng 2.","level":"TH","points":0.5,"q":"Cho a = [2, 3, 1]. Đếm tổng số lần đổi chỗ khi sắp xếp nổi bọt tăng dần, kết quả là bao nhiêu?","type":"short"},{"answer":"45","explain":"Số lần so sánh là 9+8+...+1 = 45.","level":"VDC","points":0.5,"q":"Với mảng 10 phần tử, sắp xếp nổi bọt thực hiện bao nhiêu lần so sánh?","type":"short"}]}]}
