{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Bài toán sắp xếp được phát biểu như thế nào?","options":["A. Sắp xếp lại các phần tử của dãy theo thứ tự tăng dần hoặc giảm dần","B. Tìm vị trí của một giá trị x trong dãy","C. Tính tổng các phần tử của dãy","D. Đếm số phần tử của dãy"],"answer":"A","explain":"Bài toán sắp xếp: cho dãy a gồm n phần tử, sắp xếp lại các phần tử theo thứ tự tăng dần (hoặc giảm dần).","points":0.25},{"type":"mcq","level":"NB","q":"Ý tưởng của thuật toán sắp xếp nổi bọt là gì?","options":["A. Chọn phần tử nhỏ nhất đưa về đầu dãy","B. So sánh từng cặp phần tử kề nhau, sai thứ tự thì đổi chỗ, lặp lại nhiều lượt","C. Chèn từng phần tử vào đúng vị trí trong phần đầu đã sắp xếp","D. Chia dãy thành hai nửa rồi gộp lại"],"answer":"B","explain":"Nổi bọt lặp đi lặp lại việc so sánh từng cặp phần tử kề nhau; nếu sai thứ tự thì đổi chỗ hai phần tử.","points":0.25},{"type":"mcq","level":"NB","q":"Khi sắp xếp tăng dần bằng thuật toán nổi bọt, sau lượt duyệt đầu tiên thì phần tử nào về đúng vị trí?","options":["A. Phần tử nhỏ nhất về đầu dãy","B. Phần tử ở giữa về đúng chỗ","C. Phần tử lớn nhất về cuối dãy","D. Mọi phần tử đều về đúng vị trí"],"answer":"C","explain":"Sau mỗi lượt, phần tử lớn nhất trong phần chưa sắp xếp sẽ nổi lên cuối dãy như bọt nước.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [3, 1, 2]. Sau lượt đầu tiên của thuật toán nổi bọt (sắp xếp tăng dần), dãy a là gì?","options":["A. [1, 3, 2]","B. [1, 2, 3]","C. [3, 1, 2]","D. [2, 1, 3]"],"answer":"B","explain":"Lượt 1: so sánh (3,1) đổi chỗ được [1,3,2]; so sánh (3,2) đổi chỗ được [1,2,3].","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [3, 1, 2]. Sau lượt đầu tiên của thuật toán sắp xếp chọn (sắp xếp tăng dần), dãy a là gì?","options":["A. [1, 3, 2]","B. [1, 2, 3]","C. [2, 1, 3]","D. [3, 1, 2]"],"answer":"A","explain":"Lượt 1 (i = 0): phần tử nhỏ nhất trong [3,1,2] là 1 ở chỉ số 1, đổi chỗ với a[0] được [1,3,2].","points":0.25},{"type":"mcq","level":"VD","q":"Thuật toán nổi bọt với dãy có n phần tử cần tối đa bao nhiêu lượt duyệt?","options":["A. n lượt","B. n - 1 lượt","C. n + 1 lượt","D. 2n lượt"],"answer":"B","explain":"Sau n - 1 lượt, n - 1 phần tử lớn nhất đã về cuối, phần tử còn lại tự đúng vị trí nên cần tối đa n - 1 lượt.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về thuật toán nổi bọt:","statements":["a) Mỗi bước so sánh một cặp phần tử kề nhau.","b) Nếu hai phần tử kề nhau sai thứ tự thì đổi chỗ chúng.","c) Sau lượt đầu tiên, phần tử nhỏ nhất về đầu dãy.","d) Với dãy n phần tử, cần tối đa n - 1 lượt duyệt."],"answer":["T","T","F","T"],"explain":"a) Đúng: so sánh cặp kề a[j] và a[j+1]. b) Đúng: đó là thao tác cốt lõi. c) Sai: phần tử lớn nhất về cuối dãy. d) Đúng: sau n - 1 lượt dãy đã sắp xếp xong.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [5, 2, 8, 1]. Xét quá trình sắp xếp chọn (tăng dần). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1, dãy là [1, 2, 8, 5].","b) Sau lượt 2, dãy là [1, 2, 8, 5].","c) Sau lượt 3, dãy là [1, 2, 5, 8].","d) Lượt 4 làm dãy thay đổi."],"answer":["T","T","T","F"],"explain":"a) Đúng: min là 1 ở chỉ số 3, đổi với a[0]. b) Đúng: min trong [2,8,5] là 2 đã đúng chỗ. c) Đúng: min trong [8,5] là 5 ở chỉ số 3, đổi với a[2]. d) Sai: lượt 4 không đổi dãy.","points":1},{"type":"short","level":"TH","q":"Cho a = [2, 5, 1, 8]. Sau lượt thứ hai của thuật toán nổi bọt (tăng dần), dãy a là gì? (Viết dưới dạng [1, 2, 3, 4])","answer":"[1, 2, 5, 8]","explain":"Lượt 1: (2,5) giữ nguyên, (5,1) đổi, (5,8) giữ nguyên được [2,1,5,8]. Lượt 2: (2,1) đổi được [1,2,5,8].","points":0.5},{"type":"short","level":"VDC","q":"Cho đoạn chương trình: a = [3, 1, 2]; sap_xep_noi_bot(a); print(a[0] + a[2]). (Hàm sap_xep_noi_bot sắp xếp tăng dần.) Kết quả in ra là gì?","answer":"4","explain":"Sau khi sắp xếp, a = [1, 2, 3]. Khi đó a[0] + a[2] = 1 + 3 = 4.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Ý tưởng của thuật toán sắp xếp chọn là gì?","options":["A. So sánh cặp kề rồi đổi chỗ","B. Mỗi lượt chọn phần tử nhỏ nhất trong phần chưa sắp xếp đưa về đầu phần đó","C. Chèn từng phần tử vào phần đầu đã sắp xếp","D. Đảo ngược dãy nhiều lần"],"answer":"B","explain":"Sắp xếp chọn: mỗi lượt chọn phần tử nhỏ nhất trong phần chưa sắp xếp rồi đổi chỗ với phần tử đầu của phần chưa sắp xếp.","points":0.25},{"type":"mcq","level":"NB","q":"Ý tưởng của thuật toán sắp xếp chèn là gì?","options":["A. So sánh cặp kề rồi đổi chỗ","B. Chọn phần tử nhỏ nhất đưa về đầu","C. Lần lượt chèn từng phần tử vào đúng vị trí trong phần đầu đã sắp xếp","D. Chia dãy thành hai nửa bằng nhau"],"answer":"C","explain":"Sắp xếp chèn xem phần đầu là dãy con đã sắp xếp, lần lượt chèn từng phần tử vào đúng vị trí của nó.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [5, 2, 8, 1]. Sau lượt đầu tiên (i = 1) của thuật toán sắp xếp chèn, dãy a là gì?","options":["A. [2, 5, 8, 1]","B. [5, 2, 8, 1]","C. [1, 5, 8, 2]","D. [2, 5, 1, 8]"],"answer":"A","explain":"i = 1, key = 2: dời 5 sang phải một vị trí rồi chèn 2 vào đầu, được [2,5,8,1].","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [5, 2, 8, 1]. Sau lượt thứ ba (i = 3) của thuật toán sắp xếp chèn, dãy a là gì?","options":["A. [2, 5, 8, 1]","B. [1, 2, 5, 8]","C. [1, 5, 8, 2]","D. [2, 1, 5, 8]"],"answer":"B","explain":"i = 3, key = 1: dời 8, 5, 2 sang phải rồi chèn 1 vào đầu, được [1,2,5,8].","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [4, 1, 5, 3, 2]. Sau lượt thứ hai của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [1, 4, 5, 3, 2]","B. [1, 2, 5, 3, 4]","C. [1, 2, 3, 5, 4]","D. [1, 2, 3, 4, 5]"],"answer":"B","explain":"Lượt 1: min là 1 ở chỉ số 1, đổi với a[0] được [1,4,5,3,2]. Lượt 2: min trong [4,5,3,2] là 2 ở chỉ số 4, đổi với a[1] được [1,2,5,3,4].","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [4, 1, 5, 3, 2]. Sau lượt thứ tư (i = 4) của thuật toán sắp xếp chèn, dãy a là gì?","options":["A. [1, 3, 4, 5, 2]","B. [1, 2, 3, 4, 5]","C. [1, 4, 5, 3, 2]","D. [1, 2, 4, 5, 3]"],"answer":"B","explain":"Lượt 1: [1,4,5,3,2]. Lượt 2: [1,4,5,3,2]. Lượt 3: chèn 3 được [1,3,4,5,2]. Lượt 4: chèn 2 được [1,2,3,4,5].","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về thuật toán sắp xếp chọn:","statements":["a) Mỗi lượt tìm phần tử nhỏ nhất trong phần chưa sắp xếp.","b) Đổi chỗ phần tử nhỏ nhất với phần tử đầu của phần chưa sắp xếp.","c) Sau lượt thứ k, k phần tử đầu đã đúng vị trí.","d) Số lần đổi chỗ tối đa là n(n - 1)/2."],"answer":["T","T","T","F"],"explain":"a) Đúng: đó là bước chọn. b) Đúng: đưa min về đầu phần chưa sắp. c) Đúng: mỗi lượt cố định một vị trí đầu. d) Sai: mỗi lượt đổi chỗ tối đa 1 lần nên tối đa n - 1 lần.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [4, 3, 2, 1]. Xét quá trình nổi bọt (tăng dần). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1, dãy là [3, 2, 1, 4].","b) Sau lượt 2, dãy là [2, 1, 3, 4].","c) Sau lượt 3, dãy là [1, 2, 3, 4].","d) Lượt 4 làm dãy thay đổi."],"answer":["T","T","T","F"],"explain":"a) Đúng: 4 nổi lên cuối. b) Đúng: 3 về vị trí thứ 3. c) Đúng: dãy đã sắp xếp xong. d) Sai: lượt 4 không còn cặp nào để xét nên dãy không đổi.","points":1},{"type":"short","level":"NB","q":"Cho a = [3, 1, 2]; sap_xep_chon(a); print(a). (Hàm sap_xep_chon sắp xếp tăng dần.) Kết quả in ra là gì? (Viết dưới dạng [1, 2, 3])","answer":"[1, 2, 3]","explain":"Sắp xếp chọn đưa dãy về [1, 2, 3].","points":0.5},{"type":"short","level":"VDC","q":"Cho a = [4, 3, 2, 1]. Đếm tổng số lần đổi chỗ của hai phần tử kề nhau trong toàn bộ quá trình nổi bọt (tăng dần).","answer":"6","explain":"Lượt 1 có 3 lần đổi chỗ, lượt 2 có 2 lần, lượt 3 có 1 lần, lượt 4 không có. Tổng là 6 lần.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Độ phức tạp thời gian trong trường hợp xấu nhất của ba thuật toán nổi bọt, chọn, chèn là gì?","options":["A. O(n)","B. O(n^2)","C. O(log n)","D. O(n log n)"],"answer":"B","explain":"Cả ba thuật toán đơn giản đều có độ phức tạp O(n^2) trong trường hợp xấu nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Thuật toán nào có số lần đổi chỗ ít nhất (tối đa n - 1 lần)?","options":["A. Nổi bọt","B. Chọn","C. Chèn","D. Cả ba như nhau"],"answer":"B","explain":"Sắp xếp chọn mỗi lượt đổi chỗ tối đa 1 lần nên cả quá trình tối đa n - 1 lần đổi chỗ.","points":0.25},{"type":"mcq","level":"NB","q":"Cho dãy đã sắp xếp a = [1, 2, 3, 4]. Sau lượt đầu tiên của thuật toán nổi bọt, dãy a là gì?","options":["A. [1, 2, 3, 4]","B. [2, 1, 3, 4]","C. [4, 3, 2, 1]","D. [2, 3, 4, 1]"],"answer":"A","explain":"Dãy đã đúng thứ tự nên không có cặp kề nào sai thứ tự, không đổi chỗ lần nào.","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [9, 7, 5, 3, 1]. Sau lượt đầu tiên của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [1, 7, 5, 3, 9]","B. [1, 3, 5, 7, 9]","C. [9, 7, 5, 3, 1]","D. [7, 9, 5, 3, 1]"],"answer":"A","explain":"Phần tử nhỏ nhất là 1 ở chỉ số 4, đổi chỗ với a[0] được [1,7,5,3,9].","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [9, 7, 5, 3, 1]. Sau lượt thứ hai của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [1, 7, 5, 3, 9]","B. [1, 3, 5, 7, 9]","C. [1, 5, 7, 3, 9]","D. [1, 3, 7, 5, 9]"],"answer":"B","explain":"Lượt 1: [1,7,5,3,9]. Lượt 2: nhỏ nhất trong [7,5,3,9] là 3 ở chỉ số 3, đổi với a[1] được [1,3,5,7,9].","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [3, 1, 4, 1, 5]. Sau lượt thứ ba (i = 3) của thuật toán sắp xếp chèn, dãy a là gì?","options":["A. [1, 3, 4, 1, 5]","B. [1, 1, 3, 4, 5]","C. [1, 3, 4, 5, 1]","D. [1, 1, 4, 3, 5]"],"answer":"B","explain":"Lượt 1 (i=1): [1,3,4,1,5]. Lượt 2 (i=2): [1,3,4,1,5]. Lượt 3 (i=3): chèn 1 vào đầu được [1,1,3,4,5].","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về thuật toán sắp xếp chèn:","statements":["a) Phần đầu của dãy luôn là dãy con đã sắp xếp.","b) Mỗi lượt chèn phần tử đang xét vào đúng vị trí của nó.","c) Các phần tử lớn hơn key được dời sang phải một vị trí.","d) Trường hợp tốt nhất của thuật toán có độ phức tạp O(n^2)."],"answer":["T","T","T","F"],"explain":"a) Đúng: bất biến của thuật toán. b) Đúng: đó là thao tác chèn. c) Đúng: dời chỗ để lấy vị trí chèn. d) Sai: tốt nhất (dãy đã sắp xếp) chỉ cần O(n).","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [6, 1, 4, 3, 5, 2]. Xét quá trình nổi bọt (tăng dần). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1, dãy là [1, 4, 3, 5, 2, 6].","b) Sau lượt 2, dãy là [1, 3, 4, 2, 5, 6].","c) Sau lượt 3, dãy là [1, 3, 2, 4, 5, 6].","d) Sau lượt 3, dãy đã sắp xếp xong."],"answer":["T","T","T","F"],"explain":"a) Đúng: số 6 nổi lên cuối. b) Đúng: số 5 về vị trí thứ 5. c) Đúng: số 4 về vị trí thứ 4. d) Sai: cần lượt 4 để đưa 1, 2, 3 về đúng chỗ, được [1,2,3,4,5,6].","points":1},{"type":"short","level":"TH","q":"Cho a = [4, 1, 5, 3, 2]; sap_xep_chon(a); print(a[3]). (Hàm sap_xep_chon sắp xếp tăng dần.) Kết quả in ra là gì?","answer":"4","explain":"Sau khi sắp xếp, a = [1, 2, 3, 4, 5]. Phần tử ở chỉ số 3 là 4.","points":0.5},{"type":"short","level":"VDC","q":"Cho a = [5, 2, 8, 1]. Đếm tổng số lần đổi chỗ của hai phần tử kề nhau trong toàn bộ quá trình nổi bọt (tăng dần).","answer":"4","explain":"Lượt 1: đổi chỗ (5,2) và (8,1), tức 2 lần. Lượt 2: đổi chỗ (5,1), tức 1 lần. Lượt 3: đổi chỗ (2,1), tức 1 lần. Tổng là 4 lần.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Vì sao thuật toán có tên gọi là sắp xếp nổi bọt?","options":["A. Vì dùng nước để sắp xếp","B. Vì phần tử lớn nhất nổi lên cuối dãy sau mỗi lượt như bọt nước","C. Vì thuật toán rất nhanh","D. Vì code có hình bọt nước"],"answer":"B","explain":"Sau mỗi lượt duyệt, phần tử lớn nhất nổi dần lên cuối dãy giống như bọt nước nổi lên mặt nước.","points":0.25},{"type":"mcq","level":"NB","q":"Thuật toán sắp xếp chèn được ví như thao tác nào trong đời sống?","options":["A. Xếp bài trên tay khi chơi bài","B. Đổ nước vào chai","C. Gấp quần áo","D. Chạy bộ"],"answer":"A","explain":"Giống như khi chơi bài: tay trái giữ các lá bài đã xếp theo thứ tự, tay phải lấy từng lá mới chèn vào đúng vị trí.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [2, 1]. Sau lượt đầu tiên của thuật toán nổi bọt (tăng dần), dãy a là gì?","options":["A. [2, 1]","B. [1, 2]","C. [1, 1]","D. [2, 2]"],"answer":"B","explain":"So sánh cặp duy nhất (2,1) sai thứ tự nên đổi chỗ được [1,2].","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [2, 1]. Sau lượt đầu tiên (i = 0) của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [2, 1]","B. [1, 2]","C. [1, 1]","D. [2, 2]"],"answer":"B","explain":"Phần tử nhỏ nhất là 1 ở chỉ số 1, đổi chỗ với a[0] được [1,2].","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn chương trình: a = [3, 2, 1]; sap_xep_chen(a); print(a[1]). (Hàm sap_xep_chen sắp xếp tăng dần.) Kết quả in ra là gì?","options":["A. 1","B. 2","C. 3","D. 4"],"answer":"B","explain":"Sau khi sắp xếp, a = [1, 2, 3]. Phần tử ở chỉ số 1 là 2.","points":0.25},{"type":"mcq","level":"VDC","q":"Dãy có 100 phần tử. Trong trường hợp xấu nhất, thuật toán nổi bọt thực hiện xấp xỉ bao nhiêu phép so sánh cặp kề?","options":["A. 100","B. 1000","C. 4950","D. 10000"],"answer":"C","explain":"Số cặp so sánh là 99 + 98 + ... + 1 = 99*100/2 = 4950.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau khi so sánh ba thuật toán:","statements":["a) Cả ba thuật toán đều có độ phức tạp O(n^2) trong trường hợp xấu nhất.","b) Nổi bọt so sánh các cặp phần tử kề nhau.","c) Sắp xếp chọn luôn thực hiện đúng n - 1 lần đổi chỗ.","d) Sắp xếp chèn trong trường hợp tốt nhất có độ phức tạp O(n)."],"answer":["T","T","F","T"],"explain":"a) Đúng: cả ba đều O(n^2) khi xấu nhất. b) Đúng: đặc trưng của nổi bọt. c) Sai: tối đa n - 1 lần, có thể ít hơn nếu phần tử đã đúng chỗ. d) Đúng: dãy đã sắp xếp thì mỗi lượt không phải dời phần tử nào.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [3, 1, 2]. Xét quá trình sắp xếp chèn. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1 (i = 1), dãy là [1, 3, 2].","b) Sau lượt 2 (i = 2), dãy là [1, 2, 3].","c) Thuật toán thực hiện đúng 2 lượt.","d) Lượt 1 không làm dãy thay đổi."],"answer":["T","T","T","F"],"explain":"a) Đúng: chèn 1 vào đầu. b) Đúng: chèn 2 vào giữa 1 và 3. c) Đúng: i chạy từ 1 đến n - 1 = 2. d) Sai: lượt 1 đã đổi dãy thành [1,3,2].","points":1},{"type":"short","level":"NB","q":"Cho a = [4, 3, 2, 1]; sap_xep_noi_bot(a); print(a). (Hàm sap_xep_noi_bot sắp xếp tăng dần.) Kết quả in ra là gì? (Viết dưới dạng [1, 2, 3, 4])","answer":"[1, 2, 3, 4]","explain":"Sắp xếp nổi bọt đưa dãy về [1, 2, 3, 4].","points":0.5},{"type":"short","level":"VDC","q":"Cho a = [2, 3, 1]. Dùng thuật toán sắp xếp chọn (tăng dần). Hỏi có tất cả bao nhiêu lần đổi chỗ hai phần tử?","answer":"2","explain":"Lượt 1: min là 1 ở chỉ số 2, đổi với a[0] được [1,3,2] (1 lần). Lượt 2: min trong [3,2] là 2 ở chỉ số 2, đổi với a[1] được [1,2,3] (1 lần). Tổng 2 lần.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Trong thuật toán sắp xếp chèn, dãy con đã sắp xếp ban đầu gồm phần tử nào?","options":["A. Phần tử đầu tiên của dãy","B. Phần tử cuối cùng của dãy","C. Tất cả các phần tử","D. Không có phần tử nào"],"answer":"A","explain":"Ban đầu coi phần tử đầu tiên là dãy con đã sắp xếp (một phần tử luôn có thứ tự), rồi chèn dần các phần tử tiếp theo.","points":0.25},{"type":"mcq","level":"NB","q":"Trong thuật toán sắp xếp chọn, sau lượt thứ k thì phần chưa sắp xếp bắt đầu từ chỉ số nào?","options":["A. 0","B. k - 1","C. k","D. n - 1"],"answer":"C","explain":"Sau lượt thứ k, k phần tử đầu đã đúng vị trí nên phần chưa sắp xếp bắt đầu từ chỉ số k.","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [5, 4, 3, 2, 1]. Sau lượt đầu tiên của thuật toán nổi bọt (tăng dần), dãy a là gì?","options":["A. [4, 3, 2, 1, 5]","B. [1, 2, 3, 4, 5]","C. [4, 5, 3, 2, 1]","D. [5, 4, 3, 2, 1]"],"answer":"A","explain":"Lượt 1 đổi chỗ liên tiếp các cặp (5,4), (5,3), (5,2), (5,1); số 5 nổi lên cuối được [4,3,2,1,5].","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [5, 4, 3, 2, 1]. Sau lượt đầu tiên của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [1, 4, 3, 2, 5]","B. [1, 2, 3, 4, 5]","C. [4, 5, 3, 2, 1]","D. [5, 4, 3, 2, 1]"],"answer":"A","explain":"Phần tử nhỏ nhất là 1 ở chỉ số 4, đổi chỗ với a[0] được [1,4,3,2,5].","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [5, 4, 3, 2, 1]. Sau lượt thứ hai (i = 2) của thuật toán sắp xếp chèn, dãy a là gì?","options":["A. [4, 5, 3, 2, 1]","B. [3, 4, 5, 2, 1]","C. [3, 4, 5, 1, 2]","D. [1, 2, 3, 4, 5]"],"answer":"B","explain":"Lượt 1 (i=1): chèn 4 được [4,5,3,2,1]. Lượt 2 (i=2): chèn 3 vào đầu được [3,4,5,2,1].","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [1, 3, 2, 4]. Trong lượt đầu tiên của thuật toán nổi bọt (tăng dần), có bao nhiêu lần đổi chỗ?","options":["A. 0","B. 1","C. 2","D. 3"],"answer":"B","explain":"Lượt 1: cặp (1,3) giữ nguyên, cặp (3,2) đổi chỗ, cặp (3,4) giữ nguyên. Chỉ có 1 lần đổi chỗ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vòng lặp của thuật toán nổi bọt:","statements":["a) Vòng lặp trong xét n - 1 - i cặp phần tử kề nhau.","b) Biến i đếm số lượt đã thực hiện.","c) Sau lượt thứ i, i phần tử cuối đã đúng vị trí.","d) Lượt cuối cùng (i = n - 1) vẫn thực hiện so sánh."],"answer":["T","T","T","F"],"explain":"a) Đúng: phần cuối đã sắp xếp nên không cần xét lại. b) Đúng: i là chỉ số lượt. c) Đúng: mỗi lượt cố định một phần tử cuối. d) Sai: khi i = n - 1 thì range(0) nên vòng trong không chạy.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [2, 5, 1, 8]. Xét quá trình sắp xếp chọn (tăng dần). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1, dãy là [1, 5, 2, 8].","b) Sau lượt 2, dãy là [1, 2, 5, 8].","c) Sau lượt 3, dãy là [1, 2, 5, 8].","d) Cần 4 lượt để dãy sắp xếp xong."],"answer":["T","T","T","F"],"explain":"a) Đúng: min là 1 ở chỉ số 2, đổi với a[0]. b) Đúng: min trong [5,2,8] là 2 ở chỉ số 2, đổi với a[1]. c) Đúng: min trong [5,8] là 5 đã đúng chỗ. d) Sai: sau 3 lượt dãy đã xong, lượt 4 không đổi gì.","points":1},{"type":"short","level":"TH","q":"Cho a = [7, 3, 9, 1]; sap_xep_chen(a); print(a[0]). (Hàm sap_xep_chen sắp xếp tăng dần.) Kết quả in ra là gì?","answer":"1","explain":"Sau khi sắp xếp, a = [1, 3, 7, 9]. Phần tử ở chỉ số 0 là 1.","points":0.5},{"type":"short","level":"VDC","q":"Dãy có 6 phần tử. Trong toàn bộ quá trình nổi bọt, tổng số cặp phần tử kề nhau được so sánh là bao nhiêu? (Kể cả các lượt không đổi chỗ)","answer":"15","explain":"Số cặp mỗi lượt là 5, 4, 3, 2, 1 rồi 0. Tổng là 15.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Ba thuật toán sắp xếp đơn giản (nổi bọt, chọn, chèn) phù hợp nhất khi nào?","options":["A. Dãy có kích thước n nhỏ","B. Dãy có hàng triệu phần tử","C. Mọi kích thước dãy","D. Chỉ khi dãy đã sắp xếp"],"answer":"A","explain":"Vì độ phức tạp O(n^2) nên ba thuật toán này chỉ phù hợp với n nhỏ; n lớn cần thuật toán nhanh hơn.","points":0.25},{"type":"mcq","level":"NB","q":"Python có sẵn công cụ nào để sắp xếp list?","options":["A. sorted() và phương thức list.sort()","B. arrange() và order()","C. Không có, phải tự viết","D. Chỉ có hàm max()"],"answer":"A","explain":"Python cung cấp hàm sorted() (trả về list mới) và phương thức list.sort() (sắp xếp ngay trên list).","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [8, 3]. Sau lượt đầu tiên (i = 1) của thuật toán sắp xếp chèn, dãy a là gì?","options":["A. [8, 3]","B. [3, 8]","C. [3, 3]","D. [8, 8]"],"answer":"B","explain":"key = 3 nhỏ hơn 8 nên dời 8 sang phải rồi chèn 3 vào đầu, được [3,8].","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [1, 3, 2]. Sau lượt đầu tiên của thuật toán nổi bọt (tăng dần), dãy a là gì?","options":["A. [1, 3, 2]","B. [1, 2, 3]","C. [3, 1, 2]","D. [2, 1, 3]"],"answer":"B","explain":"Lượt 1: cặp (1,3) giữ nguyên, cặp (3,2) đổi chỗ được [1,2,3].","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [10, 5, 8, 3]. Sau lượt đầu tiên của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [3, 5, 8, 10]","B. [5, 10, 8, 3]","C. [3, 10, 8, 5]","D. [10, 5, 8, 3]"],"answer":"A","explain":"Phần tử nhỏ nhất là 3 ở chỉ số 3, đổi chỗ với a[0] được [3,5,8,10].","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [10, 5, 8, 3]. Sau lượt thứ hai của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [3, 5, 8, 10]","B. [3, 5, 10, 8]","C. [3, 8, 5, 10]","D. [5, 3, 8, 10]"],"answer":"A","explain":"Lượt 1: [3,5,8,10]. Lượt 2: nhỏ nhất trong [5,8,10] là 5 đã đúng chỗ nên dãy không đổi.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = [3, 1, 2]. Xét quá trình nổi bọt (tăng dần). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1, dãy là [1, 2, 3].","b) Lượt 2 không làm dãy thay đổi.","c) Thuật toán thực hiện 3 lượt.","d) Sau lượt 1, dãy đã sắp xếp xong."],"answer":["T","T","T","T"],"explain":"a) Đúng: đổi chỗ (3,1) rồi (3,2). b) Đúng: không còn cặp sai thứ tự. c) Đúng: vòng ngoài chạy n = 3 lượt. d) Đúng: [1,2,3] đã đúng thứ tự.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về độ phức tạp thời gian:","statements":["a) Nổi bọt trong trường hợp xấu nhất có độ phức tạp O(n^2).","b) Sắp xếp chọn trong trường hợp xấu nhất có độ phức tạp O(n^2).","c) Sắp xếp chèn trong trường hợp xấu nhất có độ phức tạp O(n^2).","d) Sắp xếp chèn trong trường hợp tốt nhất có độ phức tạp O(n^2)."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: cả ba đều O(n^2) khi xấu nhất. d) Sai: tốt nhất (dãy đã sắp xếp) chèn chỉ cần O(n).","points":1},{"type":"short","level":"NB","q":"Cho a = [6, 2]; sap_xep_chen(a); print(a). (Hàm sap_xep_chen sắp xếp tăng dần.) Kết quả in ra là gì? (Viết dưới dạng [1, 2])","answer":"[2, 6]","explain":"Chèn 2 vào trước 6 được [2, 6].","points":0.5},{"type":"short","level":"VDC","q":"Dãy có 5 phần tử. Trong toàn bộ quá trình nổi bọt, tổng số cặp phần tử kề nhau được so sánh là bao nhiêu? (Kể cả các lượt không đổi chỗ)","answer":"10","explain":"Số cặp mỗi lượt là 4, 3, 2, 1 rồi 0. Tổng là 10.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trong code mẫu của bài, biểu thức a[j] != min(a[j], a[j+1]) có nghĩa là gì?","options":["A. a[j] lớn hơn a[j+1]","B. a[j] bằng a[j+1]","C. a[j] nhỏ hơn a[j+1]","D. a[j] khác 0"],"answer":"A","explain":"Nếu a[j] khác giá trị nhỏ nhất trong hai số thì a[j] chính là số lớn hơn.","points":0.25},{"type":"mcq","level":"NB","q":"Trong code sắp xếp chọn mẫu, lệnh k = a.index(min(a[i:]), i) dùng để làm gì?","options":["A. Tìm vị trí của phần tử nhỏ nhất từ chỉ số i trở về sau","B. Đếm số phần tử của dãy","C. Xóa phần tử ở chỉ số i","D. Thêm phần tử vào cuối dãy"],"answer":"A","explain":"min(a[i:]) là giá trị nhỏ nhất từ i trở đi, a.index(..., i) tìm vị trí đầu tiên của giá trị đó từ i trở đi.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [4, 1]. Sau lượt đầu tiên của thuật toán nổi bọt (tăng dần), dãy a là gì?","options":["A. [4, 1]","B. [1, 4]","C. [1, 1]","D. [4, 4]"],"answer":"B","explain":"Cặp (4,1) sai thứ tự nên đổi chỗ được [1,4].","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [2, 4, 1]. Sau lượt thứ hai (i = 2) của thuật toán sắp xếp chèn, dãy a là gì?","options":["A. [2, 4, 1]","B. [1, 2, 4]","C. [1, 4, 2]","D. [2, 1, 4]"],"answer":"B","explain":"Lượt 1 (i=1): [2,4,1]. Lượt 2 (i=2): chèn 1 vào đầu được [1,2,4].","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [2, 4, 1]. Sau lượt đầu tiên của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [1, 4, 2]","B. [2, 4, 1]","C. [1, 2, 4]","D. [4, 2, 1]"],"answer":"A","explain":"Phần tử nhỏ nhất là 1 ở chỉ số 2, đổi chỗ với a[0] được [1,4,2].","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [3, 3, 1]. Sau lượt đầu tiên của thuật toán nổi bọt (tăng dần), dãy a là gì?","options":["A. [3, 3, 1]","B. [3, 1, 3]","C. [1, 3, 3]","D. [3, 1, 1]"],"answer":"B","explain":"Cặp (3,3) bằng nhau nên không đổi chỗ; cặp (3,1) sai thứ tự nên đổi chỗ được [3,1,3].","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = [2, 4, 1]. Xét quá trình nổi bọt (tăng dần). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1, dãy là [2, 1, 4].","b) Lượt 1 có đúng 1 lần đổi chỗ.","c) Sau lượt 2, dãy là [1, 2, 4].","d) Lượt 3 làm dãy thay đổi."],"answer":["T","T","T","F"],"explain":"a) Đúng: (2,4) giữ nguyên, (4,1) đổi chỗ. b) Đúng: chỉ đổi chỗ cặp (4,1). c) Đúng: (2,1) đổi chỗ. d) Sai: lượt 3 vòng trong không chạy nên dãy không đổi.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về chi tiết thuật toán sắp xếp chèn:","statements":["a) Biến key lưu giá trị của phần tử đang xét.","b) Các phần tử lớn hơn key được dời sang phải một vị trí.","c) Vòng lặp dời dừng khi j == 0 hoặc a[j-1] không lớn hơn key.","d) Thuật toán thực hiện n lượt với n là số phần tử."],"answer":["T","T","T","F"],"explain":"a) Đúng: key = a[i]. b) Đúng: tạo chỗ trống để chèn key. c) Đúng: đó là điều kiện dừng của while. d) Sai: i chạy từ 1 đến n - 1 nên có n - 1 lượt.","points":1},{"type":"short","level":"TH","q":"Cho a = [9, 4]; sap_xep_chon(a); print(a[0] * 10 + a[1]). (Hàm sap_xep_chon sắp xếp tăng dần.) Kết quả in ra là gì?","answer":"49","explain":"Sau khi sắp xếp, a = [4, 9]. Biểu thức 4 * 10 + 9 = 49.","points":0.5},{"type":"short","level":"VDC","q":"Cho dãy đã tăng dần a = [1, 2, 3, 4, 5]. Khi chạy thuật toán sắp xếp chèn, tổng số lần dời phần tử (lệnh a[j] = a[j-1]) là bao nhiêu?","answer":"0","explain":"Dãy đã đúng thứ tự nên mỗi lượt key đều đã ở đúng vị trí, không phải dời phần tử nào.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Muốn sắp xếp giảm dần bằng thuật toán nổi bọt thì đổi chỗ hai phần tử kề nhau khi nào?","options":["A. Khi phần tử trước nhỏ hơn phần tử sau","B. Khi phần tử trước lớn hơn phần tử sau","C. Khi hai phần tử bằng nhau","D. Không bao giờ đổi chỗ"],"answer":"A","explain":"Sắp xếp giảm dần yêu cầu phần tử trước không nhỏ hơn phần tử sau, nên đổi chỗ khi phần tử trước nhỏ hơn phần tử sau.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [5] (dãy một phần tử). Cả ba thuật toán cho kết quả là gì?","options":["A. [5]","B. []","C. [0]","D. Báo lỗi"],"answer":"A","explain":"Dãy một phần tử đã có thứ tự nên kết quả vẫn là [5].","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [3, 2, 1]. Sau lượt đầu tiên của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [1, 2, 3]","B. [2, 3, 1]","C. [3, 2, 1]","D. [1, 3, 2]"],"answer":"A","explain":"Phần tử nhỏ nhất là 1 ở chỉ số 2, đổi chỗ với a[0] được [1,2,3].","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [3, 2, 1]. Sau lượt đầu tiên (i = 1) của thuật toán sắp xếp chèn, dãy a là gì?","options":["A. [3, 2, 1]","B. [2, 3, 1]","C. [1, 2, 3]","D. [2, 1, 3]"],"answer":"B","explain":"key = 2 nhỏ hơn 3 nên dời 3 sang phải rồi chèn 2 vào đầu, được [2,3,1].","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [3, 2, 1]. Sau lượt thứ hai của thuật toán nổi bọt (tăng dần), dãy a là gì?","options":["A. [2, 1, 3]","B. [1, 2, 3]","C. [1, 3, 2]","D. [3, 2, 1]"],"answer":"B","explain":"Lượt 1: [2,1,3]. Lượt 2: so sánh (2,1) đổi chỗ được [1,2,3].","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [4, 1, 3, 2]. Khi chạy thuật toán sắp xếp chèn, tổng số lần dời phần tử (lệnh a[j] = a[j-1]) là bao nhiêu?","options":["A. 2","B. 3","C. 4","D. 5"],"answer":"C","explain":"Lượt 1 (key=1): dời 1 lần. Lượt 2 (key=3): dời 1 lần. Lượt 3 (key=2): dời 2 lần. Tổng là 4 lần.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = [4, 1, 3, 2]. Xét quá trình sắp xếp chọn (tăng dần). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1, dãy là [1, 4, 3, 2].","b) Sau lượt 2, dãy là [1, 2, 3, 4].","c) Lượt 3 không làm dãy thay đổi.","d) Tổng số lần đổi chỗ là 2."],"answer":["T","T","T","T"],"explain":"a) Đúng: min là 1 ở chỉ số 1. b) Đúng: min trong [4,3,2] là 2 ở chỉ số 3, đổi với a[1]. c) Đúng: min trong [3,4] là 3 đã đúng chỗ. d) Đúng: chỉ đổi chỗ ở lượt 1 và lượt 2.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [2, 1, 4, 3]. Xét quá trình nổi bọt (tăng dần). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1, dãy là [1, 2, 3, 4].","b) Lượt 1 có đúng 2 lần đổi chỗ.","c) Lượt 2 không làm dãy thay đổi.","d) Sau lượt 1, dãy đã sắp xếp xong."],"answer":["T","T","T","T"],"explain":"a) Đúng: đổi chỗ (2,1) và (4,3). b) Đúng: 2 lần đổi chỗ. c) Đúng: không còn cặp sai thứ tự. d) Đúng: [1,2,3,4] đã đúng thứ tự.","points":1},{"type":"short","level":"NB","q":"Cho a = [7, 2, 5]; sap_xep_noi_bot(a); print(a[2]). (Hàm sap_xep_noi_bot sắp xếp tăng dần.) Kết quả in ra là gì?","answer":"7","explain":"Sau khi sắp xếp, a = [2, 5, 7]. Phần tử ở chỉ số 2 là 7.","points":0.5},{"type":"short","level":"VDC","q":"Cho a = [6, 3, 8, 1]; sap_xep_chon(a); print(a[1] + a[3]). (Hàm sap_xep_chon sắp xếp tăng dần.) Kết quả in ra là gì?","answer":"11","explain":"Sau khi sắp xếp, a = [1, 3, 6, 8]. Tổng a[1] + a[3] = 3 + 8 = 11.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Thuật toán nào mỗi lượt chọn phần tử nhỏ nhất trong phần chưa sắp xếp?","options":["A. Nổi bọt","B. Chèn","C. Chọn","D. Nhị phân"],"answer":"C","explain":"Sắp xếp chọn: mỗi lượt chọn phần tử nhỏ nhất trong phần chưa sắp xếp đưa về đầu phần đó.","points":0.25},{"type":"mcq","level":"NB","q":"Thuật toán nào so sánh các cặp phần tử kề nhau?","options":["A. Chọn","B. Chèn","C. Nổi bọt","D. Tuyến tính"],"answer":"C","explain":"Nổi bọt so sánh từng cặp phần tử kề nhau và đổi chỗ khi sai thứ tự.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [5, 3]. Sau lượt đầu tiên của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [5, 3]","B. [3, 5]","C. [3, 3]","D. [5, 5]"],"answer":"B","explain":"Phần tử nhỏ nhất là 3 ở chỉ số 1, đổi chỗ với a[0] được [3,5].","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [4, 6, 1]. Sau lượt đầu tiên của thuật toán nổi bọt (tăng dần), dãy a là gì?","options":["A. [4, 6, 1]","B. [4, 1, 6]","C. [1, 4, 6]","D. [6, 4, 1]"],"answer":"B","explain":"Lượt 1: cặp (4,6) giữ nguyên, cặp (6,1) đổi chỗ được [4,1,6].","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [4, 6, 1]. Sau lượt thứ hai của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [1, 6, 4]","B. [1, 4, 6]","C. [4, 1, 6]","D. [4, 6, 1]"],"answer":"B","explain":"Lượt 1: [1,6,4]. Lượt 2: nhỏ nhất trong [6,4] là 4 ở chỉ số 2, đổi với a[1] được [1,4,6].","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [2, 2, 1]. Sau lượt thứ hai (i = 2) của thuật toán sắp xếp chèn, dãy a là gì?","options":["A. [2, 2, 1]","B. [1, 2, 2]","C. [2, 1, 2]","D. [1, 2, 1]"],"answer":"B","explain":"Lượt 1 (i=1): key = 2 không nhỏ hơn 2 nên giữ nguyên [2,2,1]. Lượt 2 (i=2): chèn 1 vào đầu được [1,2,2].","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vòng lặp ngoài của thuật toán nổi bọt:","statements":["a) Vòng lặp trong xét n - 1 - i cặp phần tử kề nhau.","b) Biến i đếm số lượt đã thực hiện.","c) Sau lượt thứ i, i phần tử cuối đã đúng vị trí.","d) Lượt cuối cùng (i = n - 1) vẫn thực hiện so sánh cặp kề."],"answer":["T","T","T","F"],"explain":"a) Đúng: phần cuối đã sắp xếp nên thu hẹp dần. b) Đúng: i là chỉ số lượt. c) Đúng: mỗi lượt cố định một phần tử cuối. d) Sai: khi i = n - 1 thì range(0) nên vòng trong không chạy.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [1, 4, 2, 3]. Xét quá trình sắp xếp chèn. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1 (i = 1), dãy là [1, 4, 2, 3].","b) Sau lượt 2 (i = 2), dãy là [1, 2, 4, 3].","c) Sau lượt 3 (i = 3), dãy là [1, 2, 3, 4].","d) Tổng số lần dời phần tử là 3."],"answer":["T","T","T","F"],"explain":"a) Đúng: key = 4 không phải dời. b) Đúng: chèn 2 vào giữa 1 và 4, dời 1 lần. c) Đúng: chèn 3 vào giữa 2 và 4, dời 1 lần. d) Sai: tổng số lần dời là 0 + 1 + 1 = 2.","points":1},{"type":"short","level":"TH","q":"Cho a = [8, 5, 2]; sap_xep_chon(a); print(a). (Hàm sap_xep_chon sắp xếp tăng dần.) Kết quả in ra là gì? (Viết dưới dạng [1, 2, 3])","answer":"[2, 5, 8]","explain":"Sắp xếp chọn đưa dãy về [2, 5, 8].","points":0.5},{"type":"short","level":"VDC","q":"Dãy có 50 phần tử. Trong trường hợp xấu nhất, thuật toán nổi bọt thực hiện bao nhiêu phép so sánh cặp kề?","answer":"1225","explain":"Số cặp là 49 + 48 + ... + 1 = 49*50/2 = 1225.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cả ba thuật toán nổi bọt, chọn, chèn đều có độ phức tạp thời gian nào trong trường hợp xấu nhất?","options":["A. O(n)","B. O(n^2)","C. O(log n)","D. O(1)"],"answer":"B","explain":"Cả ba thuật toán đơn giản đều có độ phức tạp O(n^2) trong trường hợp xấu nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Muốn sắp xếp giảm dần bằng thuật toán sắp xếp chọn thì mỗi lượt cần chọn phần tử nào?","options":["A. Phần tử nhỏ nhất","B. Phần tử lớn nhất","C. Phần tử ở giữa","D. Phần tử đầu tiên"],"answer":"B","explain":"Sắp xếp giảm dần: mỗi lượt chọn phần tử lớn nhất trong phần chưa sắp xếp đưa về đầu phần đó.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [1, 5, 3]. Sau lượt thứ hai (i = 2) của thuật toán sắp xếp chèn, dãy a là gì?","options":["A. [1, 5, 3]","B. [1, 3, 5]","C. [3, 1, 5]","D. [5, 1, 3]"],"answer":"B","explain":"Lượt 1 (i=1): [1,5,3]. Lượt 2 (i=2): chèn 3 vào giữa 1 và 5 được [1,3,5].","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [6, 1, 5]. Sau lượt đầu tiên của thuật toán nổi bọt (tăng dần), dãy a là gì?","options":["A. [1, 6, 5]","B. [1, 5, 6]","C. [6, 1, 5]","D. [5, 1, 6]"],"answer":"B","explain":"Lượt 1: cặp (6,1) đổi chỗ được [1,6,5]; cặp (6,5) đổi chỗ được [1,5,6].","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [6, 1, 5]. Sau lượt thứ hai của thuật toán nổi bọt (tăng dần), dãy a là gì?","options":["A. [1, 5, 6]","B. [1, 6, 5]","C. [5, 1, 6]","D. [6, 1, 5]"],"answer":"A","explain":"Lượt 1: [1,5,6]. Lượt 2: so sánh cặp (1,5) giữ nguyên, dãy không đổi.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [3, 1, 2, 5, 4]. Sau lượt thứ hai của thuật toán sắp xếp chọn (tăng dần), dãy a là gì?","options":["A. [1, 3, 2, 5, 4]","B. [1, 2, 3, 5, 4]","C. [1, 2, 3, 4, 5]","D. [1, 3, 2, 4, 5]"],"answer":"B","explain":"Lượt 1: min là 1 ở chỉ số 1, đổi với a[0] được [1,3,2,5,4]. Lượt 2: min trong [3,2,5,4] là 2 ở chỉ số 2, đổi với a[1] được [1,2,3,5,4].","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = [6, 1, 5]. Xét quá trình sắp xếp chọn (tăng dần). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1, dãy là [1, 6, 5].","b) Sau lượt 2, dãy là [1, 5, 6].","c) Thuật toán thực hiện 3 lượt.","d) Lượt 3 làm dãy thay đổi."],"answer":["T","T","T","F"],"explain":"a) Đúng: min là 1 ở chỉ số 1. b) Đúng: min trong [6,5] là 5 ở chỉ số 2, đổi với a[1]. c) Đúng: vòng ngoài chạy n = 3 lượt. d) Sai: lượt 3 min đã đúng chỗ nên dãy không đổi.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [2, 3, 1]. Xét quá trình nổi bọt (tăng dần). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sau lượt 1, dãy là [2, 1, 3].","b) Lượt 1 có đúng 1 lần đổi chỗ.","c) Sau lượt 2, dãy là [1, 2, 3].","d) Lượt 3 không làm dãy thay đổi."],"answer":["T","T","T","T"],"explain":"a) Đúng: (2,3) giữ nguyên, (3,1) đổi chỗ. b) Đúng: chỉ đổi chỗ cặp (3,1). c) Đúng: (2,1) đổi chỗ. d) Đúng: lượt 3 vòng trong không chạy.","points":1},{"type":"short","level":"TH","q":"Cho a = [4, 1]; sap_xep_noi_bot(a); print(a[0]). (Hàm sap_xep_noi_bot sắp xếp tăng dần.) Kết quả in ra là gì?","answer":"1","explain":"Sau khi sắp xếp, a = [1, 4]. Phần tử ở chỉ số 0 là 1.","points":0.5},{"type":"short","level":"VDC","q":"Cho đoạn chương trình: a = [5, 4, 3, 2, 1]; c = 0; for i in range(5): for j in range(4 - i): c = c + 1; print(c). Kết quả in ra là gì?","answer":"10","explain":"Vòng trong chạy 4, 3, 2, 1, 0 lần theo từng giá trị i. Tổng là 4 + 3 + 2 + 1 + 0 = 10, đúng bằng số cặp so sánh của nổi bọt với n = 5.","points":0.5}]}]}
