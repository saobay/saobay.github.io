, "options": ["A. $v = -\\omega A\\sin(\\omega t + \\varphi)$.", "B. $v = \\omega A\\sin(\\omega t + \\varphi)$.", "C. $v = -\\omega^2 A\\cos(\\omega t + \\varphi)$.", "D. $v = \\omega A\\cos(\\omega t + \\varphi)$."], "answer": "A", "explain": "$v = x' = -\\omega A\\sin(\\omega t + \\varphi)$ (dấu trừ không được bỏ).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biểu thức nào sau đây là biểu thức gia tốc trong dao động điều hòa?", "options": ["A. $a = -\\omega A\\sin(\\omega t + \\varphi)$.", "B. $a = -\\omega^2 A\\cos(\\omega t + \\varphi)$.", "C. $a = \\omega^2 A\\cos(\\omega t + \\varphi)$.", "D. $a = -\\omega^2 x^2$."], "answer": "B", "explain": "$a = v' = -\\omega^2 A\\cos(\\omega t + \\varphi) = -\\omega^2 x$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 10\\cos(4t)$ (cm). Độ lớn cực đại của vận tốc và gia tốc lần lượt là", "options": ["A. $40$ cm/s; $160$ cm/s².", "B. $10$ cm/s; $40$ cm/s².", "C. $4$ cm/s; $16$ cm/s².", "D. $40$ cm/s; $40$ cm/s²."], "answer": "A", "explain": "$v_{\\max} = 4 \\cdot 10 = 40$ cm/s; $a_{\\max} = 4^2 \\cdot 10 = 160$ cm/s².", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa $x = A\\cos(\\omega t + \\varphi)$. Khi vật qua vị trí cân bằng theo chiều dương, pha dao động bằng", "options": ["A. $0$.", "B. $\\pi$.", "C. $-\\frac{\\pi}{2}$ (hoặc $\\frac{3\\pi}{2}$).", "D. $\\frac{\\pi}{2}$."], "answer": "C", "explain": "$x = 0 \\Rightarrow \\cos = 0$; $v \\gt 0 \\Rightarrow -\\sin \\gt 0 \\Rightarrow \\sin \\lt 0$. Pha thỏa mãn là $-\\pi/2$ (mod $2\\pi$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với biên độ $A = 6$ cm, chu kì $T = 1$ s. Độ lớn cực đại của vận tốc là", "options": ["A. $12\\pi$ cm/s.", "B. $6\\pi$ cm/s.", "C. $2\\pi$ cm/s.", "D. $36$ cm/s."], "answer": "A", "explain": "$\\omega = 2\\pi/T = 2\\pi$ rad/s; $v_{\\max} = 2\\pi \\cdot 6 = 12\\pi$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồ thị vận tốc – thời gian của một dao động điều hòa: tại $t = 0$, $v = v_{\\max}/2$ và vận tốc đang tăng. Pha ban đầu của vận tốc (trong $[-\\pi, \\pi]$) bằng", "options": ["A. $\\frac{\\pi}{3}$.", "B. $-\\frac{\\pi}{3}$.", "C. $\\frac{\\pi}{6}$.", "D. $\\frac{2\\pi}{3}$."], "answer": "B", "explain": "$v = v_{\\max}\\cos(\\omega t + \\varphi_v)$; $v(0) = v_{\\max}/2 \\Rightarrow \\cos\\varphi_v = 1/2$; $v$ đang tăng $\\Rightarrow -\\sin\\varphi_v \\gt 0 \\Rightarrow \\sin\\varphi_v \\lt 0$. Vậy $\\varphi_v = -\\pi/3$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị vận tốc – thời gian cũng là một đường hình sin.", "b) Đồ thị gia tốc – thời gian là đường hình sin ngược pha với đồ thị li độ – thời gian.", "c) $v_{\\max}$ tỉ lệ thuận với biên độ $A$.", "d) $a_{\\max}$ tỉ lệ thuận với $A^2$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: $a = -\\omega^2 x$. c) Đúng: $v_{\\max} = \\omega A$. d) Sai: $a_{\\max} = \\omega^2 A$ tỉ lệ với $A$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 2\\cos(5t)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v = -10\\sin(5t)$ (cm/s).", "b) $a = -50\\cos(5t)$ (cm/s²).", "c) Khi $x = 1$ cm thì $a = -25$ cm/s².", "d) Vận tốc sớm pha $\\pi$ so với gia tốc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: $a = -25 \\cdot 1 = -25$ cm/s². d) Sai: $v$ trễ pha $\\pi/2$ so với $a$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 3\\cos\\left(2\\pi t + \\frac{\\pi}{6}\\right)$ (cm). Tính độ lớn cực đại của gia tốc theo cm/s² (lấy $\\pi^2 = 9{,}87$; làm tròn $2$ chữ số thập phân).", "answer": "118.44", "explain": "$a_{\\max} = \\omega^2 A = (2\\pi)^2 \\cdot 3 = 12\\pi^2 \\approx 12 \\cdot 9{,}87 = 118{,}44$ cm/s².", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa có $v_{\\max} = 40$ cm/s. Khi li độ $x = 3$ cm thì độ lớn vận tốc là $32$ cm/s. Biên độ $A$ của dao động bằng bao nhiêu cm?", "answer": "5", "explain": "$\\left(\\frac{3}{A}\\right)^2 + \\left(\\frac{32}{40}\\right)^2 = 1 \\Rightarrow \\frac{9}{A^2} = 1 - 0{,}64 = 0{,}36 \\Rightarrow A^2 = 25 \\Rightarrow A = 5$ cm.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Vận tốc trong dao động điều hòa", "options": ["A. biến thiên điều hòa cùng tần số với li độ.", "B. không đổi theo thời gian.", "C. tỉ lệ thuận với thời gian.", "D. luôn bằng $0$."], "answer": "A", "explain": "$v = -\\omega A\\sin(\\omega t + \\varphi)$ cũng là hàm điều hòa cùng tần số $\\omega$ với li độ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Gia tốc trong dao động điều hòa", "options": ["A. không đổi theo thời gian.", "B. biến thiên điều hòa cùng tần số với li độ.", "C. luôn bằng $0$.", "D. tỉ lệ với bình phương vận tốc."], "answer": "B", "explain": "$a = -\\omega^2 A\\cos(\\omega t + \\varphi)$ biến thiên điều hòa cùng tần số với li độ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 6\\cos(3\\pi t)$ (cm). Độ lớn cực đại của gia tốc là", "options": ["A. $54\\pi^2$ cm/s².", "B. $18\\pi$ cm/s².", "C. $6$ cm/s².", "D. $9\\pi^2$ cm/s²."], "answer": "A", "explain": "$a_{\\max} = \\omega^2 A = (3\\pi)^2 \\cdot 6 = 54\\pi^2$ cm/s².", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi gia tốc của vật dao động điều hòa bằng $0$, vật đang ở đâu và vận tốc thế nào?", "options": ["A. Ở biên, $v = 0$.", "B. Ở vị trí cân bằng, $|v| = v_{\\max}$.", "C. Ở biên, $|v| = v_{\\max}$.", "D. Ở $x = A/2$."], "answer": "B", "explain": "$a = -\\omega^2 x = 0 \\Rightarrow x = 0$ (VTCB); tại VTCB $|v| = \\omega A = v_{\\max}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với biên độ $A = 8$ cm, tần số góc $\\omega = \\pi$ rad/s. Khi li độ $x = -4$ cm, gia tốc của vật là", "options": ["A. $4\\pi^2$ cm/s².", "B. $-4\\pi^2$ cm/s².", "C. $8\\pi^2$ cm/s².", "D. $0$."], "answer": "A", "explain": "$a = -\\omega^2 x = -\\pi^2 \\cdot (-4) = 4\\pi^2$ cm/s² (hướng về VTCB).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biết hệ thức độc lập $\\left(\\frac{x}{A}\\right)^2 + \\left(\\frac{v}{\\omega A}\\right)^2 = 1$. Khi $x = \\frac{A\\sqrt{3}}{2}$ thì tỉ số $\\frac{|v|}{v_{\\max}}}$ bằng", "options": ["A. $\\frac{1}{2}$.", "B. $\\frac{\\sqrt{3}}{2}$.", "C. $1$.", "D. $\\frac{\\sqrt{2}}{2}$."], "answer": "A", "explain": "$\\left(\\frac{v}{v_{\\max}}\\right)^2 = 1 - \\left(\\frac{\\sqrt{3}}{2}\\right)^2 = 1 - \\frac{3}{4} = \\frac{1}{4} \\Rightarrow \\frac{|v|}{v_{\\max}}} = \\frac{1}{2}$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $a = -\\omega^2 x$ nên gia tốc tỉ lệ với li độ và luôn ngược dấu với li độ.", "b) Tại vị trí biên, độ lớn gia tốc đạt cực đại.", "c) Tại vị trí cân bằng, gia tốc bằng $0$.", "d) Khi vật ở biên âm ($x = -A$) thì gia tốc $a = -\\omega^2 A$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $a = -\\omega^2(-A) = +\\omega^2 A$ (hướng về VTCB).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos\\left(2\\pi t + \\frac{\\pi}{3}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v_{\\max} = 8\\pi$ cm/s.", "b) $a_{\\max} = 16\\pi^2$ cm/s².", "c) Vận tốc sớm pha $\\frac{\\pi}{2}$ so với li độ.", "d) Gia tốc cùng pha với vận tốc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $v_{\\max} = 2\\pi \\cdot 4$. b) Đúng: $a_{\\max} = (2\\pi)^2 \\cdot 4$. c) Đúng. d) Sai: $a$ sớm pha $\\pi/2$ so với $v$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với biên độ $A = 10$ cm, tần số $f = 2$ Hz. Tính $a_{\\max}$ theo cm/s² (lấy $\\pi^2 = 9{,}87$; làm tròn $1$ chữ số thập phân).", "answer": "1579.2", "explain": "$\\omega = 2\\pi f = 4\\pi$ rad/s; $a_{\\max} = \\omega^2 A = 16\\pi^2 \\cdot 10 = 160\\pi^2 \\approx 1579{,}2$ cm/s².", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với tần số góc $\\omega = 5$ rad/s. Khi độ lớn vận tốc là $30$ cm/s thì độ lớn gia tốc là $200$ cm/s². Biên độ $A$ của dao động bằng bao nhiêu cm?", "answer": "10", "explain": "$|a| = \\omega^2|x| \\Rightarrow |x| = 200/25 = 8$ cm. $\\left(\\frac{8}{A}\\right)^2 + \\left(\\frac{30}{5A}\\right)^2 = 1 \\Rightarrow \\frac{64 + 36}{A^2} = 1 \\Rightarrow A = 10$ cm.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Độ lớn vận tốc cực đại $v_{\\max}$ đạt được khi vật", "options": ["A. ở vị trí biên.", "B. đi qua vị trí cân bằng.", "C. ở $x = A/2$.", "D. có gia tốc cực đại."], "answer": "B", "explain": "Tại VTCB ($x = 0$), $|v| = \\omega A = v_{\\max}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Gia tốc của vật dao động điều hòa bằng $0$ khi vật", "options": ["A. ở vị trí biên.", "B. đi qua vị trí cân bằng.", "C. ở $x = A/2$.", "D. có vận tốc bằng $0$."], "answer": "B", "explain": "$a = -\\omega^2 x = 0 \\Leftrightarrow x = 0$ (VTCB).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 5\\cos\\left(10t + \\frac{\\pi}{4}\\right)$ (cm). Độ lớn cực đại của vận tốc là", "options": ["A. $50$ cm/s.", "B. $5$ cm/s.", "C. $500$ cm/s.", "D. $10$ cm/s."], "answer": "A", "explain": "$v_{\\max} = \\omega A = 10 \\cdot 5 = 50$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biểu thức $v = -\\omega A\\sin(\\omega t + \\varphi)$. Khi $\\sin(\\omega t + \\varphi) = -1$ thì", "options": ["A. $v = v_{\\max}$.", "B. $v = -v_{\\max}$.", "C. $v = 0$.", "D. $a = 0$."], "answer": "A", "explain": "$v = -\\omega A \\cdot (-1) = \\omega A = v_{\\max}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với biên độ $A = 5$ cm, tần số góc $\\omega = 4$ rad/s. Khi độ lớn vận tốc $|v| = 16$ cm/s thì độ lớn li độ $|x|$ bằng", "options": ["A. $3$ cm.", "B. $4$ cm.", "C. $5$ cm.", "D. $1$ cm."], "answer": "A", "explain": "$v_{\\max} = 20$ cm/s; $\\left(\\frac{x}{5}\\right)^2 + \\left(\\frac{16}{20}\\right)^2 = 1 \\Rightarrow \\frac{x^2}{25} = 0{,}36 \\Rightarrow |x| = 3$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa $x = A\\cos(\\omega t + \\varphi)$. Biết tại $t = 0$: $x = A/2$ và $v \\lt 0$. Pha ban đầu $\\varphi$ (trong $[-\\pi, \\pi]$) bằng", "options": ["A. $\\frac{\\pi}{3}$.", "B. $-\\frac{\\pi}{3}$.", "C. $\\frac{2\\pi}{3}$.", "D. $\\frac{\\pi}{6}$."], "answer": "A", "explain": "$\\cos\\varphi = 1/2$; $v(0) = -\\omega A\\sin\\varphi \\lt 0 \\Rightarrow \\sin\\varphi \\gt 0$. Vậy $\\varphi = \\pi/3$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vận tốc sớm pha $\\frac{\\pi}{2}$ so với li độ.", "b) Gia tốc sớm pha $\\pi$ so với li độ (ngược pha).", "c) Gia tốc sớm pha $\\frac{\\pi}{2}$ so với vận tốc.", "d) Li độ, vận tốc, gia tốc biến thiên với cùng tần số."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: $a = -\\omega^2 x$. c) Đúng. d) Đúng: cùng $\\omega$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $A = 6$ cm, chu kì $T = 0{,}5$ s. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tần số góc $\\omega = 4\\pi$ rad/s.", "b) $v_{\\max} = 24\\pi$ cm/s.", "c) $a_{\\max} = 96\\pi^2$ cm/s².", "d) Khi $x = 3$ cm thì $v = 0$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\omega = 2\\pi/0{,}5 = 4\\pi$ rad/s. b) Đúng: $v_{\\max} = 4\\pi \\cdot 6$. c) Đúng: $a_{\\max} = (4\\pi)^2 \\cdot 6 = 96\\pi^2$ cm/s². d) Sai: $v = 0$ chỉ khi $|x| = A$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 7\\cos(5t)$ (cm). Tính độ lớn cực đại của vận tốc theo cm/s.", "answer": "35", "explain": "$v_{\\max} = \\omega A = 5 \\cdot 7 = 35$ cm/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với tần số góc $\\omega = 10$ rad/s. Tại li độ $x = 3$ cm, độ lớn vận tốc là $40$ cm/s. Khi li độ $x = 4$ cm thì độ lớn vận tốc bằng bao nhiêu cm/s?", "answer": "30", "explain": "$\\left(\\frac{3}{A}\\right)^2 + \\left(\\frac{40}{10A}\\right)^2 = 1 \\Rightarrow \\frac{9 + 16}{A^2} = 1 \\Rightarrow A = 5$ cm. Khi $x = 4$ cm: $|v| = 10\\sqrt{25 - 16} = 30$ cm/s.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức độc lập với thời gian liên hệ giữa li độ $x$ và vận tốc $v$ là", "options": ["A. $\\left(\\frac{x}{A}\\right)^2 + \\left(\\frac{v}{\\omega A}\\right)^2 = 1$.", "B. $x^2 + v^2 = A^2$.", "C. $x + v = A$.", "D. $xv = \\omega A^2$."], "answer": "A", "explain": "Từ $x = A\\cos$ và $v = -\\omega A\\sin$, dùng $\\sin^2 + \\cos^2 = 1$ được hệ thức A.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi vật đi từ vị trí cân bằng ra biên, độ lớn vận tốc và độ lớn gia tốc biến đổi thế nào?", "options": ["A. $|v|$ tăng, $|a|$ tăng.", "B. $|v|$ giảm, $|a|$ tăng.", "C. $|v|$ tăng, $|a|$ giảm.", "D. Cả hai đều giảm."], "answer": "B", "explain": "Ra biên: $|x|$ tăng nên $|v| = \\omega\\sqrt{A^2 - x^2}$ giảm, $|a| = \\omega^2|x|$ tăng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 2\\cos(\\pi t)$ (cm). Tại thời điểm $t = 0{,}5$ s, vận tốc của vật là", "options": ["A. $-2\\pi$ cm/s.", "B. $2\\pi$ cm/s.", "C. $0$ cm/s.", "D. $-2$ cm/s."], "answer": "A", "explain": "$v = -2\\pi\\sin(\\pi t)$; tại $t = 0{,}5$: $v = -2\\pi\\sin(\\pi/2) = -2\\pi$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết biểu thức gia tốc $a = -36\\cos(6t)$ (cm/s²). Tần số góc và biên độ của dao động là", "options": ["A. $\\omega = 6$ rad/s, $A = 1$ cm.", "B. $\\omega = 36$ r \max} = 2\\pi \\cdot 9$. b) Đúng. c) Đúng: $a_{\\max} = (2\\pi)^2 \\cdot 9 = 36\\pi^2$ cm/s². d) Sai: $a$ sớm pha $\\pi/2$ so với $v$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với biên độ $A = 4$ cm, tần số góc $\\omega = 2\\pi$ rad/s. Khi li độ $x = 2$ cm, tính độ lớn gia tốc theo cm/s² (lấy $\\pi^2 = 9{,}87$; làm tròn $1$ chữ số thập phân).", "answer": "79.0", "explain": "$|a| = \\omega^2|x| = (2\\pi)^2 \\cdot 2 = 8\\pi^2 \\approx 8 \\cdot 9{,}87 = 78{,}96 \\approx 79{,}0$ cm/s².", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đồ thị vận tốc – thời gian của một dao động điều hòa cho $v_{\\max} = 50$ cm/s, chu kì $T = 0{,}4$ s. Biên độ $A$ của dao động bằng bao nhiêu cm? (Lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân.)", "answer": "3.18", "explain": "$\\omega = 2\\pi/T = 5\\pi$ rad/s; $A = v_{\\max}/\\omega = 50/(5\\pi) = 10/\\pi \\approx 3{,}18$ cm.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Khi vật đi từ vị trí biên về vị trí cân bằng, độ lớn vận tốc và độ lớn gia tốc biến đổi thế nào?", "options": ["A. $|v|$ giảm, $|a|$ giảm.", "B. $|v|$ tăng, $|a|$ giảm.", "C. $|v|$ giảm, $|a|$ tăng.", "D. Cả hai đều tăng."], "answer": "B", "explain": "Về VTCB: $|x|$ giảm nên $|v| = \\omega\\sqrt{A^2 - x^2}$ tăng, $|a| = \\omega^2|x|$ giảm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lực kéo về tác dụng lên vật dao động điều hòa có độ lớn cực đại khi vật", "options": ["A. qua vị trí cân bằng.", "B. ở vị trí biên.", "C. ở $x = A/2$.", "D. có vận tốc cực đại."], "answer": "B", "explain": "$|F| = m|a| = m\\omega^2|x|$ cực đại khi $|x| = A$ (vị trí biên).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos\\left(5t - \\frac{\\pi}{3}\\right)$ (cm). Biểu thức vận tốc của vật là", "options": ["A. $v = -20\\sin\\left(5t - \\frac{\\pi}{3}\\right)$ (cm/s).", "B. $v = 20\\cos\\left(5t - \\frac{\\pi}{3}\\right)$ (cm/s).", "C. $v = -4\\sin\\left(5t - \\frac{\\pi}{3}\\right)$ (cm/s).", "D. $v = 20\\sin\\left(5t - \\frac{\\pi}{3}\\right)$ (cm/s)."], "answer": "A", "explain": "$v = x' = -4 \\cdot 5\\sin\\left(5t - \\frac{\\pi}{3}\\right) = -20\\sin\\left(5t - \\frac{\\pi}{3}\\right)$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa có $a_{\\max} = 80$ cm/s², biên độ $A = 5$ cm. Tần số góc của dao động là", "options": ["A. $4$ rad/s.", "B. $16$ rad/s.", "C. $400$ rad/s.", "D. $2$ rad/s."], "answer": "A", "explain": "$a_{\\max} = \\omega^2 A \\Rightarrow \\omega = \\sqrt{80/5} = 4$ rad/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 3\\cos\\left(4t + \\frac{\\pi}{2}\\right)$ (cm). Tại $t = 0$, vận tốc của vật là", "options": ["A. $-12$ cm/s.", "B. $12$ cm/s.", "C. $0$ cm/s.", "D. $-3$ cm/s."], "answer": "A", "explain": "$v = -12\\sin\\left(4t + \\frac{\\pi}{2}\\right)$; $v(0) = -12\\sin\\left(\\frac{\\pi}{2}\\right) = -12$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa: khi $|x| = A/2$ thì tỉ số $\\frac{|a|}{a_{\\max}}}$ bằng", "options": ["A. $\\frac{1}{2}$.", "B. $\\frac{\\sqrt{3}}{2}$.", "C. $1$.", "D. $\\frac{\\sqrt{2}}{2}$."], "answer": "A", "explain": "$\\frac{|a|}{a_{\\max}}} = \\frac{\\omega^2|x|}{\\omega^2 A} = \\frac{|x|}{A} = \\frac{1}{2}$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v = 0$ tại biên; $|v| = v_{\\max}$ tại vị trí cân bằng.", "b) $a = 0$ tại vị trí cân bằng; $|a| = a_{\\max}$ tại biên.", "c) Vận tốc $v$ và li độ $x$ luôn cùng dấu.", "d) Gia tốc $a$ luôn ngược dấu với li độ $x$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: $v = -\\omega A\\sin$, $x = A\\cos$ không cùng dấu cố định. d) Đúng: $a = -\\omega^2 x$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa có $v_{\\max} = 60$ cm/s, $a_{\\max} = 360$ cm/s². Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tần số góc $\\omega = \\frac{a_{\\max}}{v_{\\max}}} = 6$ rad/s.", "b) Biên độ $A = \\frac{v_{\\max}}{\\omega} = 10$ cm.", "c) Chu kì $T = \\frac{2\\pi}{\\omega} = \\frac{\\pi}{3}$ s.", "d) Tần số $f = \\frac{3}{\\pi}$ Hz."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $\\omega = 360/60 = 6$ rad/s. b) Đúng: $A = 60/6 = 10$ cm. c) Đúng: $T = 2\\pi/6 = \\pi/3$ s. d) Đúng: $f = 1/T = 3/\\pi$ Hz.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 5\\cos(3\\pi t)$ (cm). Tính $v_{\\max}$ theo cm/s (lấy $\\pi = 3{,}14$; làm tròn $1$ chữ số thập phân).", "answer": "47.1", "explain": "$v_{\\max} = \\omega A = 3\\pi \\cdot 5 = 15\\pi \\approx 47{,}1$ cm/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với biên độ $A = 12$ cm. Khi độ lớn vận tốc bằng $\\frac{\\sqrt{3}}{2}$ giá trị cực đại thì độ lớn li độ $|x|$ bằng bao nhiêu cm?", "answer": "6", "explain": "$\\left(\\frac{x}{A}\\right)^2 + \\left(\\frac{\\sqrt{3}}{2}\\right)^2 = 1 \\Rightarrow \\frac{x^2}{A^2} = \\frac{1}{4} \\Rightarrow |x| = A/2 = 6$ cm.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đồ thị gia tốc – thời gian của dao động điều hòa có dạng", "options": ["A. đường thẳng.", "B. đường hình sin.", "C. đường parabol.", "D. đường hypebol."], "answer": "B", "explain": "$a = -\\omega^2 A\\cos(\\omega t + \\varphi)$ nên đồ thị $a$–$t$ là đường hình sin.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Gia tốc ngược pha với li độ nghĩa là", "options": ["A. $a = -\\omega^2 x$.", "B. $a = \\omega^2 x$.", "C. $a = v^2$.", "D. $a = x^2$."], "answer": "A", "explain": "$a = -\\omega^2 x$: $a$ tỉ lệ với $x$ nhưng ngược dấu, tức ngược pha.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = A\\cos(\\omega t)$. Biểu thức vận tốc của vật là", "options": ["A. $v = -A\\omega\\sin(\\omega t)$.", "B. $v = A\\omega\\cos(\\omega t)$.", "C. $v = -A\\omega^2\\cos(\\omega t)$.", "D. $v = A\\omega\\sin(\\omega t)$."], "answer": "A", "explain": "$v = x' = -A\\omega\\sin(\\omega t)$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $A \\gt 0$. Khi $x = A/2$ thì gia tốc $a$ bằng", "options": ["A. $-\\frac{\\omega^2 A}{2}$.", "B. $\\frac{\\omega^2 A}{2}$.", "C. $0$.", "D. $-\\omega^2 A$."], "answer": "A", "explain": "$a = -\\omega^2 x = -\\omega^2 \\cdot \\frac{A}{2}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với biên độ $A = 10$ cm, tần số $f = 1$ Hz. Độ lớn cực đại của vận tốc là", "options": ["A. $20\\pi$ cm/s.", "B. $10\\pi$ cm/s.", "C. $2\\pi$ cm/s.", "D. $10$ cm/s."], "answer": "A", "explain": "$\\omega = 2\\pi f = 2\\pi$ rad/s; $v_{\\max} = 2\\pi \\cdot 10 = 20\\pi$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 6\\cos\\left(2\\pi t + \\frac{\\pi}{4}\\right)$ (cm). Vận tốc của vật tại thời điểm $t = 0{,}125$ s là", "options": ["A. $-12\\pi$ cm/s.", "B. $12\\pi$ cm/s.", "C. $0$ cm/s.", "D. $-6\\pi$ cm/s."], "answer": "A", "explain": "Pha tại $t = 0{,}125$: $2\\pi \\cdot 0{,}125 + \\frac{\\pi}{4} = \\frac{\\pi}{2}$. $v = -6 \\cdot 2\\pi\\sin\\left(\\frac{\\pi}{2}\\right) = -12\\pi$ cm/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tần số biến thiên của $v$ và $a$ bằng tần số của $x$.", "b) $v_{\\max} = \\omega A$; $a_{\\max} = \\omega^2 A$.", "c) Tại cùng một thời điểm, $v$ và $a$ có thể cùng đạt giá trị cực đại.", "d) Khi $x = 0$ thì $a = 0$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: cùng $\\omega$. b) Đúng. c) Sai: $v$ cực đại tại VTCB, $a$ cực đại tại biên. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 6\\cos(4t)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v = -24\\sin(4t)$ (cm/s).", "b) $a = -96\\cos(4t)$ (cm/s²).", "c) $v_{\\max} = 24$ cm/s, $a_{\\max} = 96$ cm/s².", "d) Tại $t = \\frac{\\pi}{8}$ s, vận tốc $v = -24$ cm/s."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: $x = 6\\cos(\\pi/2) = 0$, $v = -24\\sin(\\pi/2) = -24$ cm/s.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với tần số góc $\\omega = \\pi$ rad/s, biên độ $A = 20$ cm. Tính $a_{\\max}$ theo cm/s² (lấy $\\pi^2 = 9{,}87$; làm tròn $1$ chữ số thập phân).", "answer": "197.4", "explain": "$a_{\\max} = \\omega^2 A = \\pi^2 \\cdot 20 \\approx 19{,}7 \\cdot 10$... $= 20 \\cdot 9{,}87 = 197{,}4$ cm/s².", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa: khi li độ $x = 6$ cm thì vận tốc $v = 80$ cm/s; khi li độ $x = 8$ cm thì vận tốc $v = 60$ cm/s. Tần số góc $\\omega$ của dao động bằng bao nhiêu rad/s?", "answer": "10", "explain": "$\\left(\\frac{6}{A}\\right)^2 + \\left(\\frac{80}{\\omega A}\\right)^2 = 1$ và $\\left(\\frac{8}{A}\\right)^2 + \\left(\\frac{60}{\\omega A}\\right)^2 = 1$. Trừ hai phương trình: $\\frac{28}{A^2} = \\frac{2800}{\\omega^2 A^2} \\Rightarrow \\omega^2 = 100 \\Rightarrow \\omega = 10$ rad/s.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trong dao động điều hòa, đại lượng nào sau đây KHÔNG đổi theo thời gian?", "options": ["A. Li độ $x$.", "B. Vận tốc $v$.", "C. Gia tốc $a$.", "D. Biên độ $A$, chu kì $T$, tần số $f$, tần số góc $\\omega$."], "answer": "D", "explain": "$x, v, a$ đều biến thiên điều hòa; $A, T, f, \\omega$ là các hằng số đặc trưng của dao động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vận tốc sớm pha $\\frac{\\pi}{2}$ so với li độ; vậy li độ so với vận tốc thì", "options": ["A. sớm pha $\\frac{\\pi}{2}$.", "B. trễ pha $\\frac{\\pi}{2}$.", "C. cùng pha.", "D. ngược pha."], "answer": "B", "explain": "Quan hệ sớm/trễ có tính tương đối: $v$ sớm pha $\\pi/2$ so với $x$ thì $x$ trễ pha $\\pi/2$ so với $v$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 8\\cos\\left(2\\pi t + \\frac{\\pi}{6}\\right)$ (cm). Biểu thức gia tốc của vật là", "options": ["A. $a = -32\\pi^2\\cos\\left(2\\pi t + \\frac{\\pi}{6}\\right)$ (cm/s²).", "B. $a = 32\\pi^2\\cos\\left(2\\pi t + \\frac{\\pi}{6}\\right)$ (cm/s²).", "C. $a = -16\\pi\\sin\\left(2\\pi t + \\frac{\\pi}{6}\\right)$ (cm/s²).", "D. $a = 16\\pi\\cos\\left(2\\pi t + \\frac{\\pi}{6}\\right)$ (cm/s²)."], "answer": "A", "explain": "$a = -\\omega^2 A\\cos(\\omega t + \\varphi) = -(2\\pi)^2 \\cdot 8\\cos\\left(2\\pi t + \\frac{\\pi}{6}\\right) = -32\\pi^2\\cos\\left(2\\pi t + \\frac{\\pi}{6}\\right)$ cm/s².", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $A = 4$ cm. Khi độ lớn vận tốc bằng một nửa giá trị cực đại ($|v| = v_{\\max}/2$) thì độ lớn li độ bằng", "options": ["A. $2\\sqrt{3}$ cm.", "B. $2$ cm.", "C. $4$ cm.", "D. $\\sqrt{3}$ cm."], "answer": "A", "explain": "$\\left(\\frac{x}{4}\\right)^2 + \\left(\\frac{1}{2}\\right)^2 = 1 \\Rightarrow |x| = 4 \\cdot \\frac{\\sqrt{3}}{2} = 2\\sqrt{3}$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với chu kì $T = 0{,}5$ s, $a_{\\max} = 32\\pi^2$ cm/s². Biên độ dao động là", "options": ["A. $2$ cm.", "B. $8$ cm.", "C. $0{,}5$ cm.", "D. $32$ cm."], "answer": "A", "explain": "$\\omega = 2\\pi/0{,}5 = 4\\pi$ rad/s; $A = a_{\\max}/\\omega^2 = 32\\pi^2/(16\\pi^2) = 2$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "$x_1 = A\\cos(\\omega t)$ là li độ của dao động (1); $x_2 = A\\cos\\left(\\omega t + \\frac{\\pi}{2}\\right)$ là li độ của dao động (2) cùng $A$, $\\omega$. Gọi $v_1$ là vận tốc của dao động (1). So sánh pha giữa $v_1$ và $x_2$:", "options": ["A. $v_1$ cùng pha với $x_2$.", "B. $v_1$ ngược pha với $x_2$.", "C.
