: "$\\omega = 3\\pi$ rad/s nên $f = \\frac{\\omega}{2\\pi} = \\frac{3\\pi}{2\\pi} = 1{,}5$ Hz.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với biên độ $6$ cm. Trong một chu kì, tổng thời gian mà $|x| \\gt 3$ cm chiếm bao nhiêu phần của chu kì? (Ghi dưới dạng phân số tối giản.)", "answer": "2/3", "explain": "$|x| \\gt 3 = A/2 \\Leftrightarrow |\\cos(\\omega t + \\varphi)| \\gt 1/2$. Trong một vòng tròn lượng giác, bất đẳng thức này đúng trong $2/3$ chu kì.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Đơn vị của chu kì dao động $T$ là", "options": ["A. héc (Hz).", "B. radian trên giây (rad/s).", "C. giây (s).", "D. mét (m)."], "answer": "C", "explain": "Chu kì $T$ là một khoảng thời gian nên có đơn vị là giây (s).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức liên hệ giữa tần số góc $\\omega$ và chu kì $T$ là", "options": ["A. $\\omega = 2\\pi T$.", "B. $\\omega = \\frac{2\\pi}{T}$.", "C. $\\omega = \\frac{T}{2\\pi}$.", "D. $\\omega = \\frac{\\pi}{T}$."], "answer": "B", "explain": "$\\omega = \\frac{2\\pi}{T} = 2\\pi f$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 10\\cos\\left(2t - \\frac{\\pi}{3}\\right)$ (cm, s). Pha ban đầu của dao động là", "options": ["A. $2$ rad.", "B. $-\\frac{\\pi}{3}$ rad.", "C. $\\frac{\\pi}{3}$ rad.", "D. $10$ rad."], "answer": "B", "explain": "Đối chiếu $x = A\\cos(\\omega t + \\varphi)$ được $\\varphi = -\\pi/3$ rad.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $5$ cm, chu kì $2$ s. Tần số góc của dao động là", "options": ["A. $\\pi$ rad/s.", "B. $2\\pi$ rad/s.", "C. $5$ rad/s.", "D. $10\\pi$ rad/s."], "answer": "A", "explain": "$\\omega = \\frac{2\\pi}{T} = \\frac{2\\pi}{2} = \\pi$ rad/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con lắc lò xo có vật nặng $m = 0{,}5$ kg, lò xo độ cứng $k = 200$ N/m. Tần số góc dao động của con lắc là", "options": ["A. $20$ rad/s.", "B. $10$ rad/s.", "C. $400$ rad/s.", "D. $0{,}05$ rad/s."], "answer": "A", "explain": "$\\omega = \\sqrt{\\frac{k}{m}} = \\sqrt{\\frac{200}{0{,}5}} = \\sqrt{400} = 20$ rad/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai vật dao động điều hòa cùng biên độ, cùng tần số: $x_1 = A\\cos(\\omega t)$, $x_2 = A\\cos(\\omega t + \\pi)$. Nhận xét nào sau đây đúng?", "options": ["A. Hai dao động ngược pha; khi một vật ở biên dương thì vật kia ở biên âm.", "B. Hai dao động cùng pha.", "C. Hai dao động vuông pha.", "D. Hai dao động lệch pha $\\pi/2$."], "answer": "A", "explain": "Độ lệch pha $\\Delta\\varphi = \\pi$ nên hai dao động ngược pha: $x_2 = -x_1$. Khi $x_1 = A$ thì $x_2 = -A$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dao động của con lắc đồng hồ là một dao động tuần hoàn.", "b) Mọi dao động tuần hoàn đều là dao động điều hòa.", "c) Li độ $x$ có thể nhận giá trị âm.", "d) Biên độ $A$ phụ thuộc vào cách kích thích dao động ban đầu."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: DĐĐH là trường hợp riêng đơn giản nhất của dao động tuần hoàn. c) Đúng: $-A \\le x \\le A$. d) Đúng: kích thích mạnh thì biên độ lớn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 5\\cos\\left(\\pi t + \\frac{\\pi}{6}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Biên độ $A = 5$ cm, tần số góc $\\omega = \\pi$ rad/s.", "b) Chu kì $T = 2$ s, tần số $f = 0{,}5$ Hz.", "c) Pha dao động tại $t = 1$ s là $\\frac{7\\pi}{6}$ rad.", "d) Li độ tại $t = 1$ s là $x = 4{,}33$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: $T = 2\\pi/\\pi = 2$ s. c) Đúng: $\\pi \\cdot 1 + \\pi/6 = 7\\pi/6$. d) Sai: $x = 5\\cos(7\\pi/6) = -5\\sqrt{3}/2 \\approx -4{,}33$ cm.", "points": 1}, {"type": "short", "level": "VD", "q": "Một con lắc đơn dao động điều hòa với chu kì $T = 2$ s tại nơi có $g = 9{,}8$ m/s². Tính chiều dài $l$ của con lắc theo mét (lấy $\\pi^2 = 9{,}87$; làm tròn đến $2$ chữ số thập phân).", "answer": "0.99", "explain": "$T = 2\\pi\\sqrt{l/g} \\Rightarrow l = \\frac{gT^2}{4\\pi^2} = \\frac{9{,}8 \\cdot 4}{4 \\cdot 9{,}87} = \\frac{9{,}8}{9{,}87} \\approx 0{,}99$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = A\\cos\\left(\\frac{2\\pi}{T}t\\right)$, $T = 1{,}2$ s. Kể từ $t = 0$, thời gian ngắn nhất để vật đến vị trí $x = -A$ lần đầu tiên bằng bao nhiêu giây?", "answer": "0.6", "explain": "Tại $t = 0$, $x = A$ (biên dương). Vật đến $x = -A$ (biên âm) lần đầu sau nửa chu kì: $t = T/2 = 0{,}6$ s.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Trong dao động điều hòa, li độ cực đại của vật bằng", "options": ["A. $2A$.", "B. $A$.", "C. $A/2$.", "D. $0$."], "answer": "B", "explain": "Li độ cực đại chính là biên độ $A$ (đạt được tại vị trí biên).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật dao động với tần số $f = 50$ Hz. Chu kì dao động của vật là", "options": ["A. $50$ s.", "B. $0{,}02$ s.", "C. $2$ s.", "D. $100$ s."], "answer": "B", "explain": "$T = 1/f = 1/50 = 0{,}02$ s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 6\\cos\\left(4\\pi t + \\frac{\\pi}{2}\\right)$ (cm). Tại $t = 0$, li độ của vật là", "options": ["A. $6$ cm.", "B. $0$ cm.", "C. $-6$ cm.", "D. $3$ cm."], "answer": "B", "explain": "$x(0) = 6\\cos(\\pi/2) = 6 \\cdot 0 = 0$ cm (vật đang ở vị trí cân bằng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một con lắc lò xo có vật nặng $m = 0{,}1$ kg, lò xo độ cứng $k = 90$ N/m. Chu kì dao động của con lắc xấp xỉ", "options": ["A. $0{,}21$ s.", "B. $0{,}42$ s.", "C. $2{,}1$ s.", "D. $0{,}1$ s."], "answer": "A", "explain": "$\\omega = \\sqrt{90/0{,}1} = 30$ rad/s; $T = 2\\pi/30 = \\pi/15 \\approx 0{,}209 \\approx 0{,}21$ s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con lắc đơn có chiều dài $l$ dao động với chu kì $T$. Nếu tăng chiều dài lên $9$ lần, chu kì mới tăng bao nhiêu lần?", "options": ["A. $9$ lần.", "B. $3$ lần.", "C. $81$ lần.", "D. Giảm $3$ lần."], "answer": "B", "explain": "$T$ tỉ lệ với $\\sqrt{l}$ nên khi $l$ tăng $9$ lần, $T$ tăng $\\sqrt{9} = 3$ lần.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai vật dao động điều hòa cùng phương, cùng tần số: $x_1 = 3\\cos(2\\pi t)$ (cm), $x_2 = 3\\cos\\left(2\\pi t + \\frac{2\\pi}{3}\\right)$ (cm). Độ lệch pha của $x_2$ so với $x_1$ là", "options": ["A. $x_2$ sớm pha hơn $x_1$ một góc $\\frac{2\\pi}{3}$.", "B. $x_1$ sớm pha hơn $x_2$ một góc $\\frac{2\\pi}{3}$.", "C. Hai dao động ngược pha.", "D. Hai dao động cùng pha."], "answer": "A", "explain": "$\\Delta\\varphi = \\varphi_2 - \\varphi_1 = 2\\pi/3 - 0 = 2\\pi/3 \\gt 0$ nên $x_2$ sớm pha hơn $x_1$ một góc $2\\pi/3$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phương trình $x = A\\sin(\\omega t + \\varphi)$ cũng mô tả một dao động điều hòa.", "b) Chu kì dao động của con lắc đơn (góc nhỏ) phụ thuộc vào biên độ.", "c) Tần số góc $\\omega$ càng lớn thì dao động diễn ra càng nhanh.", "d) Pha ban đầu $\\varphi$ luôn bằng $0$."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: $\\sin\\alpha = \\cos(\\alpha - \\pi/2)$. b) Sai: $T = 2\\pi\\sqrt{l/g}$ không phụ thuộc biên độ (góc nhỏ). c) Đúng. d) Sai: $\\varphi$ phụ thuộc cách chọn gốc thời gian.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $A = 4$ cm, tần số $f = 5$ Hz. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chu kì $T = 0{,}2$ s.", "b) Tần số góc $\\omega = 10\\pi$ rad/s.", "c) Trong $1$ s, vật thực hiện $5$ dao động toàn phần.", "d) Quãng đường vật đi được trong một chu kì là $8$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $T = 1/5 = 0{,}2$ s. b) Đúng: $\\omega = 2\\pi f = 10\\pi$ rad/s. c) Đúng: $f = 5$ Hz nghĩa là $5$ dao động trong $1$ s. d) Sai: quãng đường trong một chu kì là $4A = 16$ cm.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 10\\cos(5\\pi t)$ (mm). Tính tần số $f$ của dao động theo Hz.", "answer": "2.5", "explain": "$\\omega = 5\\pi$ rad/s nên $f = \\omega/(2\\pi) = 5\\pi/(2\\pi) = 2{,}5$ Hz.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Treo vật nặng vào lò xo thì lò xo dãn $2{,}5$ cm ở vị trí cân bằng. Kích thích cho con lắc lò xo thẳng đứng này dao động điều hòa. Tính chu kì dao động theo giây (lấy $g = 10$ m/s², $\\pi = 3{,}14$; làm tròn $3$ chữ số thập phân).", "answer": "0.314", "explain": "$T = 2\\pi\\sqrt{\\frac{\\Delta l}{g}} = 2\\pi\\sqrt{\\frac{0{,}025}{10}} = 2\\pi \\cdot 0{,}05 = 0{,}1\\pi \\approx 0{,}314$ s.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Dao động cơ là chuyển động", "options": ["A. thẳng đều.", "B. qua lại quanh vị trí cân bằng.", "C. tròn đều.", "D. rơi tự do."], "answer": "B", "explain": "Dao động cơ của một vật là chuyển động qua lại quanh vị trí cân bằng của vật đó.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong phương trình $x = A\\cos(\\omega t + \\varphi)$, kí hiệu $\\varphi$ là", "options": ["A. pha dao động.", "B. tần số.", "C. pha ban đầu.", "D. li độ."], "answer": "C", "explain": "$\\varphi$ là pha ban đầu, xác định trạng thái dao động tại thời điểm $t = 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với chu kì $T = 0{,}25$ s. Tần số của dao động là", "options": ["A. $4$ Hz.", "B. $0{,}25$ Hz.", "C. $25$ Hz.", "D. $2{,}5$ Hz."], "answer": "A", "explain": "$f = 1/T = 1/0{,}25 = 4$ Hz.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 2\\cos(100\\pi t)$ (cm). Số dao động toàn phần vật thực hiện trong $1$ s là", "options": ["A. $100$.", "B. $50$.", "C. $200$.", "D. $314$."], "answer": "B", "explain": "$\\omega = 100\\pi$ rad/s nên $f = \\omega/(2\\pi) = 50$ Hz, tức $50$ dao động toàn phần trong $1$ s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con lắc đơn dài $l = 2{,}5$ m dao động điều hòa tại nơi có $g = 10$ m/s². Chu kì dao động của con lắc là", "options": ["A. $3{,}14$ s.", "B. $6{,}28$ s.", "C. $1$ s.", "D. $1{,}57$ s."], "answer": "A", "explain": "$T = 2\\pi\\sqrt{l/g} = 2\\pi\\sqrt{2{,}5/10} = 2\\pi \\cdot 0{,}5 = \\pi \\approx 3{,}14$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = A\\cos(\\omega t + \\varphi)$. Biết tại $t = 0$ vật đang ở vị trí biên dương ($x = A$). Pha ban đầu $\\varphi$ bằng", "options": ["A. $0$.", "B. $\\pi$.", "C. $\\pi/2$.", "D. $-\\pi/2$."], "answer": "A", "explain": "$x(0) = A\\cos\\varphi = A \\Rightarrow \\cos\\varphi = 1 \\Rightarrow \\varphi = 0$ (trong khoảng $[-\\pi, \\pi]$).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Biên độ dao động cho biết độ lệch cực đại của vật khỏi vị trí cân bằng.", "b) Dao động điều hòa là trường hợp riêng đơn giản nhất của dao động tuần hoàn.", "c) Li độ $x$ và biên độ $A$ đều có thể nhận giá trị âm.", "d) Pha dao động có đơn vị là radian."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: $A \\gt 0$ luôn dương, chỉ $x$ mới có thể âm. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một con lắc lò xo có lò xo độ cứng $k = 100$ N/m, vật nặng $m = 400$ g. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tần số góc $\\omega = \\sqrt{k/m} = 5\\sqrt{10}$ rad/s.", "b) Chu kì $T = \\frac{2\\pi}{\\omega} \\approx 0{,}4$ s.", "c) Nếu độ cứng $k$ tăng gấp đôi thì chu kì tăng $\\sqrt{2}$ lần.", "d) Tần số $f = 1/T \\approx 2{,}5$ Hz."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $\\omega = \\sqrt{100/0{,}4} = \\sqrt{250} = 5\\sqrt{10}$ rad/s. b) Đúng: $T = 2\\pi/(5\\sqrt{10}) \\approx 0{,}397 \\approx 0{,}4$ s. c) Sai: $T$ tỉ lệ $1/\\sqrt{k}$ nên $T$ giảm. d) Đúng: $f \\approx 1/0{,}397 \\approx 2{,}52$ Hz.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với tần số góc $\\omega = 2\\pi$ rad/s. Thời gian ngắn nhất để pha dao động tăng thêm $\\pi$ rad bằng bao nhiêu giây?", "answer": "0.5", "explain": "Pha dao động tăng đều với tốc độ $\\omega$ nên $\\Delta t = \\frac{\\Delta\\varphi}{\\omega} = \\frac{\\pi}{2\\pi} = 0{,}5$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 6\\cos\\left(4t + \\frac{\\pi}{3}\\right)$ (cm, s). Tính li độ của vật tại thời điểm $t = \\frac{\\pi}{12}$ s theo cm.", "answer": "-3", "explain": "Pha tại $t = \\pi/12$: $4 \\cdot \\frac{\\pi}{12} + \\frac{\\pi}{3} = \\frac{\\pi}{3} + \\frac{\\pi}{3} = \\frac{2\\pi}{3}$. $x = 6\\cos\\left(\\frac{2\\pi}{3}\\right) = 6 \\cdot \\left(-\\frac{1}{2}\\right) = -3$ cm.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Đồ thị biểu diễn li độ $x$ theo thời gian $t$ của dao động điều hòa có dạng", "options": ["A. đường thẳng.", "B. đường parabol.", "C. đường hình sin.", "D. đường hypebol."], "answer": "C", "explain": "Vì $x = A\\cos(\\omega t + \\varphi)$ nên đồ thị $x$–$t$ là đường hình sin.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi vật dao động điều hòa đi qua vị trí cân bằng, li độ của vật bằng", "options": ["A. cực đại.", "B. $0$.", "C. $A$.", "D. $-A$."], "answer": "B", "explain": "Vị trí cân bằng là vị trí có li độ $x = 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos\\left(2\\pi t - \\frac{\\pi}{4}\\right)$ (cm). Pha dao động tại thời điểm $t = 0$ là", "options": ["A. $\\frac{\\pi}{4}$ rad.", "B. $-\\frac{\\pi}{4}$ rad.", "C. $2\\pi$ rad.", "D. $4$ rad."], "answer": "B", "explain": "Pha dao động là $2\\pi t - \\pi/4$; tại $t = 0$ pha bằng $-\\pi/4$ rad (chính là pha ban đầu).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với tần số $f = 0{,}5$ Hz, biên độ $10$ cm. Tần số góc của dao động là", "options": ["A. $\\pi$ rad/s.", "B. $2\\pi$ rad/s.", "C. $0{,}5$ rad/s.", "D. $10$ rad/s."], "answer": "A", "explain": "$\\omega = 2\\pi f = 2\\pi \\cdot 0{,}5 = \\pi$ rad/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con lắc lò xo có vật nặng $m = 1$ kg dao động với chu kì $T = 0{,}5$ s. Độ cứng của lò xo là", "options": ["A. $160$ N/m.", "B. $16$ N/m.", "C. $40$ N/m.", "D. $64$ N/m."], "answer": "A", "explain": "$T = 2\\pi\\sqrt{m/k} \\Rightarrow k = m\\left(\\frac{2\\pi}{T}\\right)^2 = 1 \\cdot (4\\pi)^2 = 16\\pi^2 \\approx 160$ N/m (lấy $\\pi^2 \\approx 10$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = A\\cos(\\omega t)$. Thời điểm đầu tiên (kể từ $t = 0$) vật đi qua vị trí cân bằng là", "options": ["A. $T/4$.", "B. $T/2$.", "C. $3T/4$.", "D. $T$."], "answer": "A", "explain": "$x = 0 \\Leftrightarrow \\cos(\\omega t) = 0 \\Leftrightarrow \\omega t = \\pi/2$ (lần đầu) $\\Rightarrow t = \\frac{\\pi/2}{\\omega} = \\frac{\\pi/2}{2\\pi/T} = \\frac{T}{4}$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chu kì $T$ của dao động điều hòa không phụ thuộc vào biên độ $A$.", "b) Tần số $f$ cho biết số dao động toàn phần vật thực hiện trong một chu kì.", "c) Phương trình $x = A\\cos(\\omega t + \\varphi)$ luôn có $A \\gt 0$, $\\omega \\gt 0$.", "d) Dao động của dây đàn ghi-ta khi gảy là dao động điều hòa."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: tính đẳng thời. b) Sai: $f$ là số dao động trong $1$ giây. c) Đúng: quy ước $A, \\omega$ dương. d) Sai: đó là dao động tắt dần phức tạp, không phải DĐĐH.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một con lắc đơn dài $l = 1$ m dao động tại nơi có $g = \\pi^2$ m/s². Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chu kì $T = 2\\pi\\sqrt{l/g} = 2$ s.", "b) Tần số $f = 0{,}5$ Hz.", "c) Nếu đưa con lắc lên Mặt Trăng (gia tốc trọng trường nhỏ hơn) thì chu kì giảm.", "d) Tần số góc $\\omega = \\pi$ rad/s."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $T = 2\\pi\\sqrt{1/\\pi^2} = 2$ s. b) Đúng: $f = 1/2 = 0{,}5$ Hz. c) Sai: $T$ tỉ lệ $1/\\sqrt{g}$ nên $g$ giảm thì $T$ tăng. d) Đúng: $\\omega = 2\\pi/T = \\pi$ rad/s.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa: trong $20$ s thực hiện được $40$ dao động toàn phần. Chu kì $T$ của dao động bằng bao nhiêu giây?", "answer": "0.5", "explain": "$T = \\frac{\\text{tổng thời gian}}{\\text{số dao động}} = \\frac{20}{40} = 0{,}5$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = A\\cos\\left(\\omega t + \\frac{\\pi}{6}\\right)$, $x_2 = A\\cos\\left(\\omega t - \\frac{\\pi}{3}\\right)$. Độ lệch pha giữa hai dao động (lấy giá trị dương) bằng bao nhiêu rad? (Lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân.)", "answer": "1.57", "explain": "$\\Delta\\varphi = |\\varphi_1 - \\varphi_2| = |\\pi/6 - (-\\pi/3)| = \\pi/2 \\approx 1{,}57$ rad.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Đại lượng nào sau đây đặc trưng cho mức độ nhanh hay chậm của dao động điều hòa?", "options": ["A. Biên độ.", "B. Pha ban đầu.", "C. Tần số.", "D. Li độ."], "answer": "C", "explain": "Tần số (hoặc chu kì, tần số góc) đặc trưng cho mức độ nhanh chậm của dao động; biên độ đặc trưng cho độ mạnh yếu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật dao động điều hòa với phương trình $x = A\\cos(\\omega t + \\varphi)$. Nếu pha ban đầu $\\varphi = \\pi$ thì tại $t = 0$, li độ $x$ bằng", "options": ["A. $A$.", "B. $0$.", "C. $-A$.", "D. $A/2$."], "answer": "C", "explain": "$x(0) = A\\cos(\\pi) = -A$ (vật ở biên âm).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $3$ cm, tần số góc $2$ rad/s. Li độ cực đại của vật là", "options": ["A. $6$ cm.", "B. $3$ cm.", "C. $2$ cm.", "D. $5$ cm."], "answer": "B", "explain": "Li độ cực đại bằng biên độ $A = 3$ cm, không phụ thuộc $\\omega$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với chu kì $T = 4$ s. Trong $8$ s, vật thực hiện được bao nhiêu dao động toàn phần?", "options": ["A. $4$.", "B. $2$.", "C. $8$.", "D. $32$."], "answer": "B", "explain": "Số dao động $= \\frac{8}{T} = \\frac{8}{4} = 2$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con lắc đơn dao động với chu kì $2$ s tại nơi có gia tốc trọng trường $g_1$. Khi đưa con lắc đến nơi có $g_2 = g_1/4$ thì chu kì mới là", "options": ["A. $1$ s.", "B. $2$ s.", "C. $4$ s.", "D. $8$ s."], "answer": "C", "explain": "$T$ tỉ lệ với $1/\\sqrt{g}$; $g$ giảm $4$ lần thì $T$ tăng $\\sqrt{4} = 2$ lần: $T' = 4$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với chu kì $T = 1$ s, tại $t = 0$ vật đang ở vị trí biên dương ($x = A$). Kể từ $t = 0$, vật đi qua vị trí cân bằng lần thứ $3$ sau khoảng thời gian", "options": ["A. $1{,}25$ s.", "B. $0{,}75$ s.", "C. $1$ s.", "D. $1{,}5$ s."], "answer": "A", "explain": "Từ biên dương: qua VTCB lần 1 sau $T/4$, lần 2 sau $3T/4$, lần 3 sau $5T/4 = 5 \\cdot 1/4 = 1{,}25$ s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dao động điều hòa là dao động tuần hoàn đơn giản nhất.", "b) Li độ $x$ luôn cùng dấu với biên độ $A$.", "c) Khi thời gian tăng thêm một chu kì $T$, trạng thái dao động của vật lặp lại như cũ.", "d) Biên độ và li độ có cùng đơn vị đo."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: $A \\gt 0$ còn $x$ đổi dấu liên tục. c) Đúng: tính tuần hoàn. d) Đúng: cùng là độ dài (m, cm).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 2\\cos(10\\pi t + \\pi/4)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tần số $f = 5$ Hz.", "b) Chu kì $T = 0{,}2$ s.", "c) Tại $t = 0$, li độ $x \\approx 1{,}41$ cm.", "d) Pha ban đầu $\\varphi = 10\\pi$ rad."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $f = 10\\pi/(2\\pi) = 5$ Hz. b) Đúng: $T = 1/5 = 0{,}2$ s. c) Đúng: $x(0) = 2\\cos(\\pi/4) = \\sqrt{2} \\approx 1{,}41$ cm. d) Sai: $\\varphi = \\pi/4$ rad.", "points": 1}, {"type": "short", "level": "VD", "q": "Một con lắc lò xo có độ cứng $k = 20$ N/m, vật nặng $m = 200$ g. Tính chu kì $T$ theo giây (lấy $\\pi = 3{,}14$; làm tròn $3$ chữ số thập phân).", "answer": "0.628", "explain": "$\\omega = \\sqrt{20/0{,}2} = \\sqrt{100} = 10$ rad/s; $T = 2\\pi/10 = 0{,}2\\pi \\approx 0{,}628$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai con lắc đơn dao động điều hòa tại cùng một nơi, có chiều dài $l_1 \\gt l_2$ với chu kì lần lượt $T_1 = 3$ s, $T_2 = 2$ s. Tỉ số $l_1/l_2$ bằng bao nhiêu?", "answer": "2.25", "explain": "$T$ tỉ lệ $\\sqrt{l}$ nên $\\frac{l_1}{l_2} = \\left(\\frac{T_1}{T_2}\\right)^2 = \\left(\\frac{3}{2}\\right)^2 = \\frac{9}{4} = 2{,}25$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các chuyển động sau, chuyển động nào là dao động điều hòa?", "options": ["A. Quả lắc đồng hồ đung đưa.", "B. Xe chạy thẳng đều.", "C. Hòn đá rơi tự do.", "D. Trái Đất quay quanh Mặt Trời."], "answer": "A", "explain": "Quả lắc đồng hồ chuyển động qua lại quanh vị trí cân bằng với li độ biến thiên điều hòa theo thời gian.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Pha ban đầu $\\varphi$ của dao động điều hòa thường được lấy trong khoảng", "options": ["A. $[0, 2\\pi]$.", "B. $[-\\pi, \\pi]$.", "C. $[0, \\pi]$.", "D. $[-2\\pi, 0]$."], "answer": "B", "explain": "Theo quy ước, pha ban đầu $\\varphi$ lấy trong khoảng $-\\pi \\le \\varphi \\le \\pi$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 7\\cos(3t)$ (cm). Tần số góc và tần số của dao động là", "options": ["A. $\\omega = 3$ rad/s, $f = \\frac{3}{2\\pi}$ Hz.", "B. $\\omega = 7$ rad/s, $f = \\frac{7}{2\\pi}$ Hz.", "C. $\\omega = 3$ rad/s, $f = 3$ Hz.", "D. $\\omega = 7$ rad/s, $f = 7$ Hz."], "answer": "A", "explain": "$\\omega = 3$ rad/s; $f = \\omega/(2\\pi) = 3/(2\\pi)$ Hz.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos(\\pi t)$ (cm). Li độ của vật tại thời điểm $t = 2$ s là", "options": ["A. $4$ cm.", "B. $-4$ cm.", "C. $0$ cm.", "D. $2$ cm."], "answer": "A", "explain": "$x = 4\\cos(2\\pi) = 4 \\cdot 1 = 4$ cm (sau đúng $1$ chu kì $T = 2$ s, vật trở lại biên dương).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con lắc lò xo đang dao động điều hòa. Nếu tăng khối lượng vật nặng lên $9$ lần (giữ nguyên lò xo) thì tần số dao động giảm đi bao nhiêu lần?", "options": ["A. $9$ lần.", "B. $3$ lần.", "C. $81$ lần.", "D. Không đổi."], "answer": "B", "explain": "$f = \\frac{1}{2\\pi}\\sqrt{k/m}$ tỉ lệ với $1/\\sqrt{m}$; $m$ tăng $9$ lần thì $f$ giảm $\\sqrt{9} = 3$ lần.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồ thị li độ – thời gian của một dao động điều hòa $x = A\\cos(\\omega t + \\varphi)$ là đường côsin bắt đầu từ giá trị cực đại tại $t = 0$. Pha ban đầu $\\varphi$ bằng", "options": ["A. $0$.", "B. $\\pi/2$.", "C. $\\pi$.", "D. $-\\pi/2$."], "answer": "A", "explain": "Tại $t = 0$: $x = A\\cos\\varphi = A \\Rightarrow \\cos\\varphi = 1 \\Rightarrow \\varphi = 0$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Con lắc đơn chỉ dao động điều hòa khi góc lệch nhỏ.", "b) Chu kì của con lắc lò xo phụ thuộc vào biên độ dao động.", "c) Tần số góc $\\omega$ có đơn vị là rad/s.", "d) Li độ là
