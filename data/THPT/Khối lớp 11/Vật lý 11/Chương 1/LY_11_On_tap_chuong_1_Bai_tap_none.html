hòa: tại thời điểm $t_1$, $x = 3$ cm, $v = 40$ cm/s. Biết $\\omega = 10$ rad/s, khi $x = 4$ cm thì độ lớn vận tốc là", "options": ["A. $30$ cm/s.", "B. $40$ cm/s.", "C. $50$ cm/s.", "D. $20$ cm/s."], "answer": "A", "explain": "$\\left(\\frac{3}{A}\\right)^2 + \\left(\\frac{40}{10A}\\right)^2 = 1 \\Rightarrow A = 5$ cm. Khi $x = 4$ cm: $|v| = 10\\sqrt{25 - 16} = 30$ cm/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gia tốc luôn hướng về vị trí cân bằng.", "b) Vận tốc đổi chiều tại vị trí biên.", "c) Gia tốc đổi dấu tại vị trí biên.", "d) Tốc độ lớn nhất tại vị trí cân bằng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $a = -\\omega^2 x$. b) Đúng. c) Sai: $a$ đổi dấu tại VTCB ($x = 0$). d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với $A = 5$ cm, $f = 4$ Hz. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\omega = 8\\pi$ rad/s.", "b) $v_{\\max} = 40\\pi$ cm/s.", "c) $a_{\\max} = 320\\pi^2$ cm/s².", "d) Khi $x = 2{,}5$ cm: $|a| = 160\\pi^2$ cm/s²."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: $v_{\\max} = 8\\pi \\cdot 5$. c) Đúng: $a_{\\max} = (8\\pi)^2 \\cdot 5 = 320\\pi^2$ cm/s². d) Đúng: $|a| = \\omega^2|x| = 64\\pi^2 \\cdot 2{,}5 = 160\\pi^2$ cm/s².", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 10\\cos\\left(2t + \\frac{\\pi}{3}\\right)$ (cm). Tính độ lớn cực đại của gia tốc theo cm/s².", "answer": "40", "explain": "$a_{\\max} = \\omega^2 A = 4 \\cdot 10 = 40$ cm/s².", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một con lắc đơn dài $l = 0{,}64$ m dao động tại nơi có $g = 10$ m/s². Tính chu kì theo giây (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "1.59", "explain": "$T = 2\\pi\\sqrt{0{,}064} = 2\\pi \\cdot 0{,}253 \\approx 1{,}59$ s.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", " iảm dần.", "b) Dao động duy trì được bù năng lượng để giữ biên độ.", "c) Dao động cưỡng bức ổn định có tần số bằng tần số ngoại lực.", "d) Cộng hưởng xảy ra khi $f = 2f_0$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cộng hưởng khi $f = f_0$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một hệ dao động cưỡng bức có tần số riêng $f_0 = 6$ Hz, chịu ngoại lực tuần hoàn có tần số $f = 6$ Hz. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hệ xảy ra cộng hưởng.", "b) Biên độ dao động đạt cực đại.", "c) Tần số dao động của hệ là $6$ Hz.", "d) Nếu tăng $f$ lên $9$ Hz thì biên độ giảm."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: ra xa tần số cộng hưởng, biên độ giảm.", "points": 1}, {"type": "short", "level": "VD", "q": "Một con lắc lò xo: $k = 150$ N/m dao động với $A = 4$ cm. Tính cơ năng theo Jun (làm tròn $4$ chữ số thập phân).", "answer": "0.12", "explain": "$W = \\frac{1}{2} \\cdot 150 \\cdot 0{,}04^2 = 0{,}12$ J.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos\\left(\\pi t + \\frac{\\pi}{2}\\right)$ (cm). Kể từ $t = 0$ đến $t = 1{,}5$ s, quãng đường vật đi được bằng bao nhiêu cm?", "answer": "12", "explain": "$T = 2$ s. Tại $t = 0$: $x = 0$, $v \\lt 0$. $1{,}5$ s $= 0{,}75T$: đường đi $0 \\to -4$ ($4$ cm), $-4 \\to 0$ ($4$ cm), $0 \\to 4$ ($4$ cm) $= 12$ cm.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Pha ban đầu $\\varphi$ của dao động điều hòa thường được lấy trong khoảng", "options": ["A. $[-\\pi;\\,\\pi]$.", "B. $[0;\\,2\\pi]$.", "C. $[0;\\,\\pi]$.", "D. $[-2\\pi;\\,0]$."], "answer": "A", "explain": "Quy ước $\\varphi \\in [-\\pi;\\,\\pi]$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đồ thị li độ theo thời gian của dao động điều hòa có dạng", "options": ["A. đường hình sin.", "B. đường thẳng.", "C. đường parabol.", "D. đường hypebol."], "answer": "A", "explain": "$x = A\\cos(\\omega t + \\varphi)$ là hàm điều hòa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 7\\cos\\left(2\\pi t - \\frac{\\pi}{2}\\right)$ (cm). Tại $t = 0$, li độ của vật là", "options": ["A. $0$.", "B. $7$ cm.", "C. $-7$ cm.", "D. $3{,}5$ cm."], "answer": "A", "explain": "$x(0) = 7\\cos(-\\pi/2) = 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với $A = 3$ cm, $T = 0{,}5$ s. Tốc độ trung bình của vật trong một chu kì là", "options": ["A. $24$ cm/s.", "B. $6$ cm/s.", "C. $12$ cm/s.", "D. $0$."], "answer": "A", "explain": "$v_{tb} = 4A/T = 12/0{,}5 = 24$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con lắc lò xo: $k = 25$ N/m, $m = 100$ g. Chu kì dao động xấp xỉ", "options": ["A. $0{,}4$ s.", "B. $4$ s.", "C. $0{,}04$ s.", "D. $2{,}5$ s."], "answer": "A", "explain": "$\\omega = \\sqrt{25/0{,}1} = \\sqrt{250} \\approx 15{,}81$ rad/s; $T = 2\\pi/\\omega \\approx 0{,}397 \\approx 0{,}4$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số, cùng biên độ $A$: $x_1 = A\\cos\\left(\\omega t + \\frac{\\pi}{4}\\right)$, $x_2 = A\\cos\\left(\\omega t - \\frac{\\pi}{4}\\right)$. Khi $x_1 = x_2 \\gt 0$ thì giá trị chung này bằng", "options": ["A. $\\frac{A\\sqrt{2}}{2}$.", "B. $-\\frac{A\\sqrt{2}}{2}$.", "C. $0$.", "D. $A$."], "answer": "A", "explain": "$\\cos(\\omega t + \\pi/4) = \\cos(\\omega t - \\pi/4) \\Rightarrow \\omega t = k\\pi$; với $x_1 = x_2 \\gt 0$ chọn $k$ chẵn $\\Rightarrow x = A\\cos(\\pi/4) = \\frac{A\\sqrt{2}}{2}$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $x = A\\cos(\\omega t + \\varphi)$ mô tả dao động điều hòa.", "b) $T = 2\\pi/\\omega$.", "c) $v_{\\max} = \\omega A$ đạt tại vị trí cân bằng.", "d) $a_{\\max} = \\omega A$ đạt tại vị trí biên."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $a_{\\max} = \\omega^2 A$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 2\\cos\\left(10t - \\frac{\\pi}{6}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\omega = 10$ rad/s, $f = 5/\\pi$ Hz.", "b) $v_{\\max} = 20$ cm/s.", "c) $a_{\\max} = 200$ cm/s².", "d) Tại $t = 0$: $x = \\sqrt{3}$ cm."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng: $a_{\\max} = 100 \\cdot 2$. d) Đúng: $x(0) = 2\\cos(-\\pi/6) = \\sqrt{3}$ cm.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với $f = 5$ Hz, $A = 2$ cm. Quãng đường vật đi được trong $1$ s bằng bao nhiêu cm?", "answer": "40", "explain": "$1$ s $= 5T$ nên $S = 5 \\cdot 4A = 40$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa có cơ năng $W = 0{,}08$ J. Khi $|x| = A/2$ thì động năng bằng bao nhiêu Jun? (Làm tròn $4$ chữ số thập phân.)", "answer": "0.06", "explain": "$W_t = W/4$ nên $W_đ = 3W/4 = 0{,}06$ J.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong dao động điều hòa, khi li độ tăng từ $0$ đến $A$ (theo chiều dương) thì", "options": ["A. tốc độ giảm, độ lớn gia tốc tăng.", "B. tốc độ tăng, độ lớn gia tốc giảm.", "C. cả tốc độ và độ lớn gia tốc đều tăng.", "D. cả tốc độ và độ lớn gia tốc đều giảm."], "answer": "A", "explain": "Vật ra biên: tốc độ giảm, $|a| = \\omega^2|x|$ tăng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lực kéo về trong dao động điều hòa", "options": ["A. $F = -kx$, luôn hướng về vị trí cân bằng.", "B. $F = kx$, luôn hướng ra vị trí biên.", "C. có độ lớn không đổi.", "D. bằng $0$ mọi lúc."], "answer": "A", "explain": "Lực kéo về $F = -kx$ luôn hướng về vị trí cân bằng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 6\\cos\\left(\\frac{\\pi t}{3}\\right)$ (cm). Tốc độ cực đại của vật là", "options": ["A. $2\\pi$ cm/s.", "B. $6\\pi$ cm/s.", "C. $\\pi/3$ cm/s.", "D. $18$ cm/s."], "answer": "A", "explain": "$v_{\\max} = \\omega A = \\frac{\\pi}{3} \\cdot 6 = 2\\pi$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với $A = 10$ cm. Khi $W_đ = W_t$ thì $|x|$ bằng", "options": ["A. $5\\sqrt{2}$ cm.", "B. $5$ cm.", "C. $10$ cm.", "D. $2{,}5$ cm."], "answer": "A", "explain": "$W_đ = W_t = W/2 \\Rightarrow \\frac{1}{2}kx^2 = \\frac{W}{2} \\Rightarrow |x| = \\frac{A}{\\sqrt{2}} = 5\\sqrt{2}$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai dao động điều hòa cùng pha, cùng biên độ $3$ cm: $x_1 = x_2 = 3\\cos(\\omega t)$ (cm). Khi $x_1 = 1{,}5$ cm thì $x_2$ bằng", "options": ["A. $1{,}5$ cm.", "B. $-1{,}5$ cm.", "C. $3$ cm.", "D. $0$."], "answer": "A", "explain": "Cùng pha, cùng phương trình nên $x_2 = x_1 = 1{,}5$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 8\\cos\\left(2\\pi t + \\frac{2\\pi}{3}\\right)$ (cm). Kể từ $t = 0$, thời gian ngắn nhất để vật đến $x = 4$ cm lần đầu là", "options": ["A. $0{,}5$ s.", "B. $1/6$ s.", "C. $1/3$ s.", "D. $1$ s."], "answer": "A", "explain": "Tại $t = 0$: pha $2\\pi/3$ ($x = -4$ cm). Đến $x = 4$ cm: pha $= 5\\pi/3$; $\\Delta\\varphi = \\pi$; $\\Delta t = \\frac{\\pi}{2\\pi} = 0{,}5$ s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lực kéo về $F = -kx$ luôn hướng về vị trí cân bằng.", "b) Độ lớn lực kéo về cực đại tại vị trí biên.", "c) Lực kéo về bằng $0$ tại vị trí cân bằng.", "d) Lực kéo về luôn cùng chiều với vận tốc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $F$ ngược chiều $v$ khi vật đi ra biên.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một con lắc đơn dài $l = 1{,}6$ m dao động tại nơi có $g = 10$ m/s². Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $T = 0{,}8\\pi$ s $\\approx 2{,}51$ s.", "b) $f \\approx 0{,}4$ Hz.", "c) $\\omega = 2{,}5$ rad/s.", "d) Với $\\alpha_0 = 0{,}1$ rad: biên độ dài $s_0 = 16$ cm."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $T = 2\\pi\\sqrt{1{,}6/10} = 0{,}8\\pi$ s. b) Đúng. c) Đúng: $\\omega = 2\\pi/T = 2{,}5$ rad/s. d) Đúng: $s_0 = l\\alpha_0 = 160 \\cdot 0{,}1 = 16$ cm.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với $A = 12$ cm, $f = 1$ Hz. Tính độ lớn cực đại của gia tốc theo cm/s² (lấy $\\pi^2 = 9{,}87$; làm tròn $1$ chữ số thập phân).", "answer": "473.8", "explain": "$a_{\\max} = (2\\pi)^2 \\cdot 12 = 48\\pi^2 \\approx 473{,}8$ cm/s².", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa: tại một thời điểm, $v = 20$ cm/s khi $x = 6$ cm; $v_{\\max} = 40$ cm/s. Tính biên độ $A$ theo cm (làm tròn $2$ chữ số thập phân).", "answer": "6.93", "explain": "$\\left(\\frac{6}{A}\\right)^2 + \\left(\\frac{20}{40}\\right)^2 = 1 \\Rightarrow \\frac{36}{A^2} = 0{,}75 \\Rightarrow A = \\sqrt{48} \\approx 6{,}93$ cm.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Dao động điều hòa là dao động", "options": ["A. có li độ biến thiên theo hàm cosin (hoặc sin) của thời gian.", "B. có biên độ tăng dần theo thời gian.", "C. có tần số tăng dần theo thời gian.", "D. dừng lại sau một thời gian."], "answer": "A", "explain": "Định nghĩa dao động điều hòa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chu kì $T$ của dao động là", "options": ["A. thời gian thực hiện một dao động toàn phần.", "B. số dao động thực hiện trong $1$ s.", "C. thời gian vật đi từ biên đến vị trí cân bằng.", "D. nghịch đảo của tần số góc."], "answer": "A", "explain": "Định nghĩa chu kì.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với $f = 25$ Hz. Chu kì của dao động là", "options": ["A. $0{,}04$ s.", "B. $25$ s.", "C. $2{,}5$ s.", "D. $0{,}4$ s."], "answer": "A", "explain": "$T = 1/f = 1/25 = 0{,}04$ s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos(8\\pi t)$ (cm). Số dao động toàn phần vật thực hiện trong $1$ s là", "options": ["A. $4$.", "B. $8$.", "C. $2$.", "D. $1$."], "answer": "A", "explain": "$f = \\omega/(2\\pi) = 4$ Hz nên trong $1$ s có $4$ dao động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con lắc lò xo: $k = 50$ N/m, $m = 200$ g dao động với $A = 10$ cm. Cơ năng của con lắc là", "options": ["A. $0{,}25$ J.", "B. $2{,}5$ J.", "C. $0{,}025$ J.", "D. $25$ J."], "answer": "A", "explain": "$W = \\frac{1}{2} \\cdot 50 \\cdot 0{,}1^2 = 0{,}25$ J.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 3\\cos\\left(4\\pi t + \\frac{\\pi}{6}\\right)$ (cm). Kể từ $t = 0$, thời gian ngắn nhất để vật qua vị trí $x = 1{,}5\\sqrt{3}$ cm theo chiều dương lần đầu là", "options": ["A. $5/12$ s.", "B. $1/12$ s.", "C. $1/6$ s.", "D. $1/3$ s."], "answer": "A", "explain": "Tại $t = 0$: pha $\\pi/6$ ($x = 1{,}5\\sqrt{3}$ cm, $v \\lt 0$). Qua $x = 1{,}5\\sqrt{3}$ cm theo chiều dương: pha $= 11\\pi/6$; $\\Delta\\varphi = 5\\pi/3$; $\\Delta t = \\frac{5\\pi/3}{4\\pi} = \\frac{5}{12}$ s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mọi dao động điều hòa đều là dao động tuần hoàn.", "b) Mọi dao động tuần hoàn đều là dao động điều hòa.", "c) Dao động tắt dần không phải là dao động điều hòa.", "d) Dao động cưỡng bức ở trạng thái ổn định là dao động điều hòa."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: ví dụ dao động của con lắc đơn với góc lớn là tuần hoàn nhưng không điều hòa. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 5\\cos\\left(3\\pi t - \\frac{\\pi}{4}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $T = 2/3$ s.", "b) $f = 1{,}5$ Hz.", "c) Tại $t = 0$: $x = \\frac{5\\sqrt{2}}{2} \\approx 3{,}54$ cm.", "d) $v_{\\max} = 15\\pi$ cm/s."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng: $x(0) = 5\\cos(-\\pi/4)$. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một con lắc lò xo: $m = 0{,}5$ kg, $T = 0{,}5$ s. Tính độ cứng $k$ theo N/m (lấy $\\pi^2 = 9{,}87$; làm tròn $1$ chữ số thập phân).", "answer": "79.0", "explain": "$k = m\\left(\\frac{2\\pi}{T}\\right)^2 = 0{,}5 \\cdot (4\\pi)^2 = 8\\pi^2 \\approx 79{,}0$ N/m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số, cùng biên độ $A = 6$ cm, ngược pha nhau: $x_1 = 6\\cos(\\omega t)$, $x_2 = 6\\cos(\\omega t + \\pi)$. Khi $x_1 = 4$ cm thì $x_2$ bằng bao nhiêu cm?", "answer": "-4", "explain": "Ngược pha: $x_2 = -x_1 = -4$ cm.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Biết $\\omega = 2\\pi f$. Khi $f = 2$ Hz thì tần số góc bằng", "options": ["A. $4\\pi$ rad/s.", "B. $2\\pi$ rad/s.", "C. $\\pi$ rad/s.", "D. $2$ rad/s."], "answer": "A", "explain": "$\\omega = 2\\pi \\cdot 2 = 4\\pi$ rad/s.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi vật dao động điều hòa ở vị trí biên ($x = \\pm A$) thì", "options": ["A. $v = 0$, $|a|$ cực đại.", "B. $v$ cực đại, $a = 0$.", "C. $v = 0$, $a = 0$.", "D. $v$ cực đại, $a$ cực đại."], "answer": "A", "explain": "Tại biên: $v = 0$, $|a| = \\omega^2 A$ cực đại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 9\\cos(\\pi t + \\pi/2)$ (cm). Độ lớn cực đại của gia tốc là", "options": ["A. $9\\pi^2$ cm/s².", "B. $9\\pi$ cm/s².", "C. $\\pi^2$ cm/s².", "D. $81\\pi^2$ cm/s²."], "answer": "A", "explain": "$a_{\\max} = \\omega^2 A = \\pi^2 \\cdot 9 = 9\\pi^2$ cm/s².", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với $A = 8$ cm. Khi $a = -a_{\\max}/2$ thì li độ $x$ bằng", "options": ["A. $4$ cm.", "B. $-4$ cm.", "C. $8$ cm.", "D. $0$."], "answer": "A", "explain": "$a = -\\omega^2 x = -a_{\\max}/2 \\Rightarrow x = A/2 = 4$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với $A = 4$ cm, $T = 1$ s. Thời gian ngắn nhất để vật đi từ $x = 0$ đến $x = -2\\sqrt{3}$ cm là", "options": ["A. $1/6$ s.", "B. $1/3$ s.", "C. $1/12$ s.", "D. $1/2$ s."], "answer": "A", "explain": "Từ pha $\\pi/2$ ($x = 0$) đến pha $5\\pi/6$ ($x = -A\\sqrt{3}/2$): $\\Delta\\varphi = \\pi/3$; $\\Delta t = T/6 = 1/6$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật khối lượng $m = 100$ g dao động điều hòa với phương trình $x = 5\\cos(10t)$ (cm). Cơ năng của vật là", "options": ["A. $0{,}0125$ J.", "B. $0{,}125$ J.", "C. $1{,}25$ J.", "D. $0{,}00125$ J."], "answer": "A", "explain": "$W = \\frac{1}{2} \\cdot 0{,}1 \\cdot 10^2 \\cdot 0{,}05^2 = 0{,}0125$ J.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v_{\\max} = \\omega A$.", "b) $a_{\\max} = \\omega^2 A$.", "c) $W = \\frac{1}{2}m\\omega^2 A^2$.", "d) Chu kì con lắc lò xo là $T = 2\\pi\\sqrt{\\frac{k}{m}}$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $T = 2\\pi\\sqrt{m/k}$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một con lắc lò xo: $k = 20$ N/m, $m = 0{,}2$ kg, $A = 6$ cm. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\omega = 10$ rad/s.", "b) $W = 0{,}036$ J.", "c) Khi $x = 3$ cm: $W_t = 0{,}009$ J.", "d) Khi $x = 3$ cm: $W_đ = 0{,}027$ J."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $\\omega = \\sqrt{20/0{,}2} = 10$ rad/s. b) Đúng: $W = 0{,}5 \\cdot 20 \\cdot 0{,}0036 = 0{,}036$ J. c) Đúng: $W_t = 0{,}5 \\cdot 20 \\cdot 0{,}0009 = 0{,}009$ J. d) Đúng: $W_đ = W - W_t = 0{,}027$ J.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = A\\cos\\left(\\omega t + \\frac{\\pi}{3}\\right)$, $x_2 = A\\cos\\left(\\omega t + \\frac{\\pi}{3}\\right)$. Độ lệch pha $\\Delta\\varphi = \\varphi_2 - \\varphi_1$ bằng bao nhiêu rad?", "answer": "0", "explain": "Hai dao động cùng phương trình nên $\\Delta\\varphi = 0$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một dao động tắt dần: sau $5$ chu kì, biên độ còn $80\\%$ so với ban đầu. Sau $10$ chu kì, biên độ còn bao nhiêu phần trăm so với ban đầu? (Ghi số, không ghi kí hiệu $\\%$; làm tròn $1$ chữ số thập phân.)", "answer": "64", "explain": "Tỉ lệ sau mỗi chu kì là $r$ với $r^5 = 0{,}8$; sau $10$ chu kì: $r^{10} = 0{,}64$, tức $64\\%$.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Cơ năng của vật dao động điều hòa được tính bằng", "options": ["A. $W = W_đ + W_t$.", "B. $W = W_đ - W_t$.", "C. $W = W_đ \\cdot W_t$.", "D. $W = W_t - W_đ$."], "answer": "A", "explain": "Cơ năng bằng tổng động năng và thế năng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi có ma sát, dao động của con lắc sẽ", "options": ["A. tắt dần.", "B. duy trì.", "C. cộng hưởng.", "D. tăng biên độ."], "answer": "A", "explain": "Ma sát tiêu hao cơ năng nên dao động tắt dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 2\\cos\\left(6\\pi t + \\frac{\\pi}{3}\\right)$ (cm). Tần số của dao động là", "options": ["A. $3$ Hz.", "B. $6$ Hz.", "C. $\\pi$ Hz.", "D. $12$ Hz."], "answer": "A", "explain": "$f = \\omega/(2\\pi) = 6\\pi/(2\\pi) = 3$ Hz.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với $A = 10$ cm, $\\omega = \\pi$ rad/s. Khi $x = 6$ cm, độ lớn vận tốc là", "options": ["A. $8\\pi$ cm/s.", "B. $6\\pi$ cm/s.", "C. $10\\pi$ cm/s.", "D. $4\\pi$ cm/s."], "answer": "A", "explain": "$|v| = \\omega\\sqrt{A^2 - x^2} = \\pi\\sqrt{100 - 36} = 8\\pi$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con lắc đơn có chu kì $T_1 = 2$ s với chiều dài $l_1$. Nếu tăng chiều dài lên $l_2 = 4l_1$ thì chu kì mới là", "options": ["A. $4$ s.", "B. $8$ s.", "C. $2$ s.", "D. $1$ s."], "answer": "A", "explain": "$T \\sim \\sqrt{l}$ nên $T_2 = 2T_1 = 4$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 7\\cos\\left(5\\pi t - \\frac{\\pi}{3}\\right)$ (cm). Kể từ $t = 0$, vật qua vị trí cân bằng lần thứ $2$ sau", "options": ["A. $11/30$ s.", "B. $1/6$ s.", "C. $4/15$ s.", "D. $1/3$ s."], "answer": "A", "explain": "Tại $t = 0$: pha $-\\pi/3$ ($x = 3{,}5$ cm, $v \\gt 0$). VTCB lần 1: pha $\\pi/2$ ($\\Delta\\varphi = 5\\pi/6$); lần 2: pha $3\\pi/2$ ($\\Delta\\varphi = 11\\pi/6$); $\\Delta t = \\frac{11\\pi/6}{5\\pi} = \\frac{11}{30}$ s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $W_đ = \\frac{1}{2}mv^2$.", "b) $W_t = \\frac{1}{2}kx^2$.", "c) $W = \\frac{1}{2}kA^2$ không đổi (không ma sát).", "d) Tần số dao động cưỡng bức bằng tần số riêng $f_0$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bằng tần số ngoại lực.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với $A = 8$ cm, $T = 0{,}4$ s. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường vật đi được trong $1$ s là $80$ cm.", "b) Tốc độ trung bình trong một chu kì là $80$ cm/s.", "c) Thời gian ngắn nhất từ biên dương đến vị trí cân bằng là $0{,}1$ s.", "d) Sau $0{,}6$ s kể từ biên dương, vật ở biên âm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $1$ s $= 2{,}5T \\Rightarrow S = 10A = 80$ cm. b) Đúng: $4A/T = 32/0{,}4 = 80$ cm/s. c) Đúng: $T/4 = 0{,}1$ s. d) Sai: $0{,}6$ s $= 1{,}5T$, vật trở về biên dương.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = 4\\cos(\\omega t)$, $x_2 = 4\\cos\\left(\\omega t + \\frac{\\pi}{2}\\right)$. Khi $x_1 = 4$ cm thì $|x_2|$ bằng bao nhiêu cm?", "answer": "0", "explain": "Vuông pha: $\\left(\\frac{4}{4}\\right)^2 + \\left(\\frac{x_2}{4}\\right)^2 = 1 \\Rightarrow |x_2| = 0$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa có biên độ $A$. Khi $W_đ = W_t$ thì $|x|$ bằng bao nhiêu lần $A$? (Làm tròn $3$ chữ số thập phân.)", "answer": "0.707", "explain": "$W_t = W/2 \\Rightarrow \\frac{1}{2}kx^2 = \\frac{1}{4}kA^2 \\Rightarrow \\frac{|x|}{A} = \\frac{1}{\\sqrt{2}} \\approx 0{,}707$.", "points": 0.5}]}]}
