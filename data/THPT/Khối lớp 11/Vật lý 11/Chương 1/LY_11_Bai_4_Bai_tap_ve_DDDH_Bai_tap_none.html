 kì nguyên ($n$ nguyên) là $4nA$.", "d) Vận tốc trung bình trong nửa chu kì luôn bằng $0$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: trong $T/2$ độ dời có thể bằng $\\pm 2A$ nên vận tốc trung bình có thể khác $0$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 2\\cos\\left(2\\pi t + \\frac{\\pi}{2}\\right)$ (cm) ($T = 1$ s). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chu kì $T = 1$ s.", "b) Từ $t = 0$ đến $t = 2{,}5$ s, quãng đường vật đi được là $20$ cm.", "c) Thời gian ngắn nhất từ $t = 0$ ($x = 0$) đến $x = -2$ cm lần đầu là $0{,}25$ s.", "d) Tốc độ trung bình trong một chu kì là $8$ cm/s."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: $2{,}5T \\Rightarrow S = 10A = 20$ cm. c) Đúng: tại $t = 0$ pha $\\pi/2$ ($v \\lt 0$); đến $x = -2$ (pha $\\pi$): $\\Delta\\varphi = \\pi/2 \\Rightarrow \\Delta t = 0{,}25$ s. d) Đúng: $4A/T = 8$ cm/s.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos\\left(5\\pi t - \\frac{\\pi}{6}\\right)$ (cm). Quãng đường vật đi được từ $t = 0$ đến $t = 0{,}4$ s bằng bao nhiêu cm?", "answer": "16", "explain": "$T = 2\\pi/(5\\pi) = 0{,}4$ s; $\\Delta t = 0{,}4$ s $= T$ nên $S = 4A = 16$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với biên độ $A = 6$ cm, chu kì $T = 1{,}2$ s. Thời gian ngắn nhất để vật đi từ $x = -3$ cm đến $x = 3\\sqrt{3}$ cm (theo chiều dương) bằng bao nhiêu giây? (Làm tròn $3$ chữ số thập phân.)", "answer": "0.3", "explain": "Theo chiều dương: $x = -3$ cm ứng pha $-2\\pi/3$; $x = 3\\sqrt{3}$ cm ứng pha $-\\pi/6$. $\\Delta\\varphi = \\pi/2$; $\\Delta t = \\frac{\\pi/2}{2\\pi/1{,}2} = 0{,}3$ s.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Trong một chu kì, vận tốc trung bình của vật dao động điều hòa bằng", "options": ["A. $4A/T$.", "B. $0$.", "C. $2A/T$.", "D. $\\omega A$."], "answer": "B", "explain": "Trong một chu kì độ dời bằng $0$ nên vận tốc trung bình bằng $0$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong một chu kì, tốc độ trung bình của vật dao động điều hòa bằng", "options": ["A. $0$.", "B. $4A/T$.", "C. $2A/T$.", "D. $\\omega A/2$."], "answer": "B", "explain": "Tốc độ trung bình $= $ quãng đường$/$thời gian $= 4A/T$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 3\\cos(2t)$ (cm). Quãng đường vật đi được trong $2$ chu kì là", "options": ["A. $24$ cm.", "B. $12$ cm.", "C. $6$ cm.", "D. $3$ cm."], "answer": "A", "explain": "$S = 2 \\cdot 4A = 8 \\cdot 3 = 24$ cm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $A = 2$ cm, chu kì $T = 4$ s. Thời gian ngắn nhất để vật đi từ $x = -2$ cm đến $x = 0$ là", "options": ["A. $1$ s.", "B. $2$ s.", "C. $4$ s.", "D. $0{,}5$ s."], "answer": "A", "explain": "Từ $x = -A$ đến $x = 0$: góc quét $\\pi/2$, $\\Delta t = T/4 = 1$ s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 5\\cos\\left(2\\pi t - \\frac{\\pi}{6}\\right)$ (cm). Kể từ $t = 0$, vật qua vị trí cân bằng lần đầu sau khoảng thời gian", "options": ["A. $\\frac{1}{3}$ s.", "B. $\\frac{1}{6}$ s.", "C. $\\frac{1}{2}$ s.", "D. $\\frac{1}{12}$ s."], "answer": "A", "explain": "Tại $t = 0$: pha $-\\pi/6$ ($v \\gt 0$). Qua VTCB lần đầu khi pha $= \\pi/2$: $\\Delta\\varphi = 2\\pi/3$; $\\Delta t = \\frac{2\\pi/3}{2\\pi} = \\frac{1}{3}$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 8\\cos(\\pi t + \\pi/4)$ (cm). Từ $t = 0$ đến $t = 3$ s, quãng đường vật đi được là", "options": ["A. $48$ cm.", "B. $32$ cm.", "C. $40$ cm.", "D. $24$ cm."], "answer": "A", "explain": "$T = 2$ s; $3$ s $= 1{,}5T$ nên $S = 1{,}5 \\cdot 4A = 1{,}5 \\cdot 32 = 48$ cm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường vật đi được trong một chu kì là $4A$.", "b) Độ dời của vật trong một chu kì bằng $0$.", "c) Thời gian ngắn nhất vật đi từ $x = 0$ đến $x = A$ là $T/2$.", "d) Thời gian ngắn nhất vật đi từ $x = -A/2$ đến $x = A/2$ là $T/3$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng. c) Sai: là $T/4$. d) Sai: đi qua VTCB từ $-A/2$ đến $A/2$ theo chiều dương quét góc $\\pi/3$ nên $\\Delta t = T/6$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một con lắc lò xo dao động điều hòa với biên độ $A = 4$ cm, tần số $f = 2$ Hz ($T = 0{,}5$ s). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường vật đi được trong $1$ s là $32$ cm.", "b) Thời gian ngắn nhất vật đi từ biên dương đến vị trí cân bằng là $0{,}125$ s.", "c) Tốc độ trung bình trong một chu kì là $32$ cm/s.", "d) Sau $0{,}75$ s kể từ lúc ở biên dương, vật đang ở biên âm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $1$ s $= 2T \\Rightarrow S = 8A = 32$ cm. b) Đúng: $T/4 = 0{,}125$ s. c) Đúng: $4A/T = 16/0{,}5 = 32$ cm/s. d) Sai: $0{,}75$ s $= 1{,}5T$ nên vật trở lại biên dương.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với biên độ $A = 5$ cm, chu kì $T = 0{,}8$ s. Quãng đường vật đi được trong $2$ s bằng bao nhiêu cm?", "answer": "50", "explain": "$2$ s $= 2{,}5T$ nên $S = 2{,}5 \\cdot 4A = 2{,}5 \\cdot 20 = 50$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos\\left(4\\pi t + \\frac{\\pi}{3}\\right)$ (cm). Kể từ $t = 0$, thời gian ngắn nhất để vật đến vị trí $x = -2$ cm lần đầu tiên bằng bao nhiêu giây? (Làm tròn $3$ chữ số thập phân.)", "answer": "0.083", "explain": "Tại $t = 0$: pha $\\pi/3$ ($x = 2$ cm). Đến $x = -2$ cm (pha $2\\pi/3$): $\\Delta\\varphi = \\pi/3$; $\\Delta t = \\frac{\\pi/3}{4\\pi} = \\frac{1}{12} \\approx 0{,}083$ s.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Để tìm thời gian ngắn nhất vật đi từ $x_1$ đến $x_2$, ta thường dùng công cụ nào?", "options": ["A. Đường tròn lượng giác.", "B. Thước đo độ dài.", "C. Đồng hồ bấm giờ.", "D. Cân đồng hồ."], "answer": "A", "explain": "Đường tròn lượng giác cho biết góc quét $\\Delta\\varphi$, từ đó $\\Delta t = \\Delta\\varphi/\\omega$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sau mỗi chu kì dao động, vật dao động điều hòa", "options": ["A. trở lại đúng trạng thái ban đầu.", "B. dừng lại.", "C. đổi chiều chuyển động tròn.", "D. tăng biên độ."], "answer": "A", "explain": "Tính tuần hoàn: sau thời gian $T$, trạng thái dao động ($x, v, a$) lặp lại như cũ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 6\\cos\\left(\\frac{\\pi}{2}t\\right)$ (cm). Quãng đường vật đi được trong $6$ s là", "options": ["A. $36$ cm.", "B. $24$ cm.", "C. $12$ cm.", "D. $18$ cm."], "answer": "A", "explain": "$T = 4$ s; $6$ s $= 1{,}5T$ nên $S = 1{,}5 \\cdot 4A = 1{,}5 \\cdot 24 = 36$ cm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 8\\cos(2\\pi t)$ (cm). Thời gian ngắn nhất để vật đi từ $x = 4\\sqrt{2}$ cm đến $x = 8$ cm (theo chiều dương) là", "options": ["A. $0{,}125$ s.", "B. $0{,}25$ s.", "C. $0{,}5$ s.", "D. $1$ s."], "answer": "A", "explain": "Theo chiều dương: $x = 4\\sqrt{2}$ cm ứng pha $-\\pi/4$; $x = 8$ cm ứng pha $0$. $\\Delta\\varphi = \\pi/4$; $\\Delta t = \\frac{\\pi/4}{2\\pi} = \\frac{1}{8} = 0{,}125$ s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 10\\cos\\left(4\\pi t - \\frac{2\\pi}{3}\\right)$ (cm). Từ $t = 0$ đến $t = 0{,}125$ s, quãng đường vật đi được là", "options": ["A. $5 + 5\\sqrt{3}$ cm ($\\approx 13{,}66$ cm).", "B. $10$ cm.", "C. $5$ cm.", "D. $15$ cm."], "answer": "A", "explain": "Tại $t = 0$: pha $-2\\pi/3$, $x = -5$ cm, $v \\gt 0$. Tại $t = 0{,}125$ s: pha $= -2\\pi/3 + \\pi/2 = -\\pi/6$, $x = 5\\sqrt{3}$ cm. Vật đi $-5 \\to 0$ ($5$ cm) rồi $0 \\to 5\\sqrt{3}$ ($5\\sqrt{3}$ cm). Tổng $5 + 5\\sqrt{3}$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 5\\cos\\left(2\\pi t + \\frac{\\pi}{2}\\right)$ (cm). Trong $3{,}25$ s đầu tiên, số lần vật qua vị trí $x = 2{,}5$ cm là", "options": ["A. $6$.", "B. $5$.", "C. $7$.", "D. $4$."], "answer": "A", "explain": "$T = 1$ s; pha $= 2\\pi t + \\pi/2 \\in [\\pi/2, 7\\pi]$. $x = 2{,}5$ cm $\\Leftrightarrow$ pha $= \\pm\\pi/3 + 2k\\pi$. Các giá trị trong khoảng: $7\\pi/3, 13\\pi/3, 19\\pi/3$ và $5\\pi/3, 11\\pi/3, 17\\pi/3$: tổng $6$ lần.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vận tốc trung bình trong một chu kì bằng $0$ vì độ dời bằng $0$.", "b) Tốc độ trung bình trong một chu kì bằng $4A/T$.", "c) Quãng đường vật đi được trong $2$ chu kì là $8A$.", "d) Thời gian ngắn nhất vật đi từ $x = A/2$ đến $x = A$ là $T/12$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: góc quét $\\pi/3$ nên $\\Delta t = T/6$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 6\\cos\\left(2\\pi t - \\frac{\\pi}{4}\\right)$ (cm) ($T = 1$ s). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường vật đi được từ $t = 0$ đến $t = 2$ s là $48$ cm.", "b) Thời gian ngắn nhất từ $t = 0$ đến $x = 6$ cm lần đầu là $1/8$ s.", "c) Thời gian ngắn nhất từ $t = 0$ đến $x = -6$ cm lần đầu là $5/8$ s.", "d) Sau $0{,}5$ s, vật trở lại vị trí ban đầu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $2$ s $= 2T \\Rightarrow S = 8A = 48$ cm. b) Đúng: tại $t = 0$ pha $-\\pi/4$; đến pha $0$: $\\Delta\\varphi = \\pi/4 \\Rightarrow \\Delta t = 1/8$ s. c) Đúng: đến pha $\\pi$: $\\Delta\\varphi = 5\\pi/4 \\Rightarrow \\Delta t = 5/8$ s. d) Sai: $0{,}5$ s $= T/2$, vật đến vị trí đối xứng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với biên độ $A = 3$ cm, tần số $f = 4$ Hz. Quãng đường vật đi được trong $1{,}25$ s bằng bao nhiêu cm?", "answer": "60", "explain": "$T = 0{,}25$ s; $1{,}25$ s $= 5T$ nên $S = 5 \\cdot 4A = 20 \\cdot 3 = 60$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 2\\cos\\left(10t + \\frac{\\pi}{6}\\right)$ (cm). Kể từ $t = 0$, thời gian ngắn nhất để $v = -v_{\\max}$ lần đầu tiên bằng bao nhiêu giây? (Lấy $\\pi = 3{,}14$; làm tròn $3$ chữ số thập phân.)", "answer": "0.105", "explain": "$v = -v_{\\max} \\Leftrightarrow \\sin\\left(10t + \\frac{\\pi}{6}\\right) = 1 \\Leftrightarrow$ pha $= \\pi/2$. Từ pha $\\pi/6$ đến $\\pi/2$: $\\Delta\\varphi = \\pi/3$; $\\Delta t = \\frac{\\pi/3}{10} = \\frac{\\pi}{30} \\approx 0{,}105$ s.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Quãng đường vật dao động điều hòa đi được trong $n$ chu kì nguyên ($n$ nguyên dương) là", "options": ["A. $nA$.", "B. $2nA$.", "C. $4nA$.", "D. $nA/2$."], "answer": "C", "explain": "Mỗi chu kì đi được $4A$ nên $n$ chu kì đi được $4nA$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thời gian để pha dao động tăng thêm $2\\pi$ là", "options": ["A. $T$.", "B. $T/2$.", "C. $2T$.", "D. $T/4$."], "answer": "A", "explain": "Pha tăng $2\\pi$ ứng với một dao động toàn phần, mất thời gian một chu kì $T$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos\\left(\\frac{2\\pi}{3}t\\right)$ (cm). Quãng đường vật đi được trong $4{,}5$ s là", "options": ["A. $24$ cm.", "B. $16$ cm.", "C. $12$ cm.", "D. $8$ cm."], "answer": "A", "explain": "$T = 3$ s; $4{,}5$ s $= 1{,}5T$ nên $S = 1{,}5 \\cdot 4A = 1{,}5 \\cdot 16 = 24$ cm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $A = 5$ cm, chu kì $T = 2$ s. Thời gian ngắn nhất để vật đi từ $x = -5$ cm đến $x = 2{,}5$ cm là", "options": ["A. $\\frac{2}{3}$ s.", "B. $\\frac{1}{3}$ s.", "C. $1$ s.", "D. $\\frac{4}{3}$ s."], "answer": "A", "explain": "Từ $x = -A$ (pha $\\pi$) đến $x = A/2$ theo chiều dương (pha $5\\pi/3$): $\\Delta\\varphi = 2\\pi/3$; $\\Delta t = \\frac{2\\pi/3}{\\pi} = \\frac{2}{3}$ s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 3\\cos\\left(5\\pi t + \\frac{\\pi}{4}\\right)$ (cm). Tốc độ trung bình của vật trong một chu kì là", "options": ["A. $30$ cm/s.", "B. $12$ cm/s.", "C. $7{,}5$ cm/s.", "D. $60$ cm/s."], "answer": "A", "explain": "$T = 0{,}4$ s; $\\bar{v} = 4A/T = 12/0{,}4 = 30$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos(\\pi t - \\pi/3)$ (cm). Kể từ $t = 0$, thời gian để vật đi được quãng đường $14$ cm lần đầu tiên là", "options": ["A. $\\frac{11}{6}$ s.", "B. $\\frac{3}{2}$ s.", "C. $2$ s.", "D. $\\frac{5}{3}$ s."], "answer": "A", "explain": "$T = 2$ s; tại $t = 0$: pha $-\\pi/3$, $x = 2$ cm, $v \\gt 0$. Đi $2 \\to 4$ ($2$ cm), $4 \\to 0$ ($4$ cm), $0 \\to -4$ ($4$ cm), $-4 \\to 0$ ($4$ cm): tổng $14$ cm, pha quét từ $-\\pi/3$ đến $3\\pi/2$: $\\Delta\\varphi = 11\\pi/6$; $\\Delta t = \\frac{11\\pi/6}{\\pi} = \\frac{11}{6}$ s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sau thời gian $T$, vật trở lại đúng vị trí và chiều chuyển động ban đầu.", "b) Sau thời gian $T/2$, vật đến vị trí đối xứng với vị trí ban đầu qua vị trí cân bằng.", "c) Quãng đường vật đi được trong $T/2$ luôn bằng $2A$.", "d) Quãng đường vật đi được trong $T/4$ luôn bằng $A$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: tính tuần hoàn. b) Đúng. c) Đúng. d) Sai: phụ thuộc vị trí xuất phát.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 10\\cos(\\pi t)$ (cm) ($T = 2$ s). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường vật đi được trong $5$ s là $100$ cm.", "b) Thời gian ngắn nhất vật đi từ $x = 10$ cm đến $x = 0$ là $0{,}5$ s.", "c) Thời gian ngắn nhất vật đi từ $x = -5$ cm đến $x = 5$ cm (qua vị trí cân bằng) là $1/3$ s.", "d) Tốc độ trung bình trong một chu kì là $20$ cm/s."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $5$ s $= 2{,}5T \\Rightarrow S = 10A = 100$ cm. b) Đúng: $T/4$. c) Đúng: theo chiều dương từ pha $-2\\pi/3$ đến $-\\pi/3$: $\\Delta\\varphi = \\pi/3 \\Rightarrow \\Delta t = 1/3$ s. d) Đúng: $4A/T = 40/2 = 20$ cm/s.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 7\\cos\\left(2\\pi t + \\frac{\\pi}{3}\\right)$ (cm). Quãng đường vật đi được trong $3{,}5$ s bằng bao nhiêu cm?", "answer": "98", "explain": "$T = 1$ s; $3{,}5$ s $= 3{,}5T$ nên $S = 3{,}5 \\cdot 4A = 3{,}5 \\cdot 28 = 98$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với biên độ $A = 8$ cm, chu kì $T = 0{,}6$ s. Thời gian ngắn nhất để vật đi từ $x = 4$ cm đến $x = -4\\sqrt{3}$ cm (theo chiều âm) bằng bao nhiêu giây? (Làm tròn $3$ chữ số thập phân.)", "answer": "0.15", "explain": "Theo chiều âm: $x = 4$ cm ứng pha $\\pi/3$; $x = -4\\sqrt{3}$ cm ứng pha $5\\pi/6$. $\\Delta\\varphi = \\pi/2$; $\\Delta t = \\frac{\\pi/2}{2\\pi/0{,}6} = 0{,}15$ s.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trên đường tròn lượng giác, mỗi giá trị li độ $x$ (với $|x| \\lt A$) ứng với", "options": ["A. một điểm $M$ duy nhất.", "B. hai điểm $M$ (một ứng với $v \\gt 0$, một ứng với $v \\lt 0$).", "C. bốn điểm $M$.", "D. vô số điểm $M$."], "answer": "B", "explain": "Mỗi $x$ (không phải biên) có hai vị trí trên đường tròn: nửa trên ($v \\lt 0$) và nửa dưới ($v \\gt 0$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thời gian ngắn nhất để vật đi từ $x_1$ đến $x_2$ ứng với góc quét", "options": ["A. lớn nhất.", "B. nhỏ nhất.", "C. bằng $\\pi$.", "D. bằng $2\\pi$."], "answer": "B", "explain": "$\\Delta t = \\Delta\\varphi/\\omega$ nhỏ nhất khi $\\Delta\\varphi$ nhỏ nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 5\\cos(4\\pi t)$ (cm). Số dao động toàn phần vật thực hiện trong $2$ s là", "options": ["A. $4$.", "B. $2$.", "C. $8$.", "D. $10$."], "answer": "A", "explain": "$f = 2$ Hz nên trong $2$ s vật thực hiện $4$ dao động toàn phần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $A = 6$ cm, tần số góc $\\omega = \\pi$ rad/s. Thời gian ngắn nhất để vật đi từ $x = 0$ đến $x = -6$ cm là", "options": ["A. $0{,}5$ s.", "B. $1$ s.", "C. $2$ s.", "D. $0{,}25$ s."], "answer": "A", "explain": "Từ $x = 0$ đến $x = -A$: góc quét $\\pi/2$, $\\Delta t = T/4 = 0{,}5$ s ($T = 2$ s).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 2\\cos(4\\pi t)$ (cm). Quãng đường vật đi được từ $t = 0$ đến $t = \\frac{5}{8}$ s là", "options": ["A. $10$ cm.", "B. $8$ cm.", "C. $6$ cm.", "D. $4$ cm."], "answer": "A", "explain": "$T = 0{,}5$ s; $\\frac{5}{8}$ s $= 1{,}25T$ nên $S = 1{,}25 \\cdot 4A = 1{,}25 \\cdot 8 = 10$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa $x = A\\cos(\\omega t + \\varphi)$. Trong khoảng thời gian $T/6$, quãng đường lớn nhất vật có thể đi được là", "options": ["A. $A$.", "B. $A/2$.", "C. $2A$.", "D. $A\\sqrt{3}$."], "answer": "A", "explain": "Quãng đường lớn nhất khi chuyển động đối xứng qua VTCB: $S_{\\max} = 2A\\sin\\left(\\frac{\\omega\\Delta t}{2}\\right) = 2A\\sin\\left(\\frac{\\pi}{6}\\right) = A$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mỗi giá trị $x$ (với $|x| \\lt A$) ứng với hai thời điểm trong một chu kì.", "b) Góc quét nhỏ nhất cho thời gian ngắn nhất.", "c) Quãng đường lớn nhất trong $\\Delta t \\lt T/2$ đạt được khi vật chuyển động đối xứng qua vị trí cân bằng.", "d) Quãng đường trong $\\Delta t$ luôn tính được bằng $v \\cdot \\Delta t$ với $v$ không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $v$ biến thiên điều hòa, không dùng công thức chuyển động đều.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos\\left(\\pi t + \\frac{\\pi}{2}\\right)$ (cm) ($T = 2$ s). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường vật đi được trong $3$ s là $24$ cm.", "b) Thời gian ngắn nhất từ $t = 0$ ($x = 0$) đến $x = -4$ cm là $0{,}5$ s.", "c) Thời gian ngắn nhất từ $t = 0$ đến $x = 4$ cm là $1{,}5$ s.", "d) Tốc độ trung bình trong một chu kì là $8$ cm/s."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $3$ s $= 1{,}5T \\Rightarrow S = 6A = 24$ cm. b) Đúng: tại $t = 0$ pha $\\pi/2$ ($v \\lt 0$); đến pha $\\pi$: $\\Delta\\varphi = \\pi/2 \\Rightarrow \\Delta t = 0{,}5$ s. c) Đúng: đến pha $2\\pi$: $\\Delta\\varphi = 3\\pi/2 \\Rightarrow \\Delta t = 1{,}5$ s. d) Đúng: $4A/T = 16/2 = 8$ cm/s.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với biên độ $A = 9$ cm, chu kì $T = 1{,}5$ s. Quãng đường vật đi được trong $6$ s bằng bao nhiêu cm?", "answer": "144", "explain": "$6$ s $= 4T$ nên $S = 4 \\cdot 4A = 16 \\cdot 9 = 144$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 6\\cos\\left(5\\pi t - \\frac{\\pi}{4}\\right)$ (cm). Kể từ $t = 0$, thời gian ngắn nhất để vật qua vị trí $x = 3\\sqrt{2}$ cm lần thứ $2$ bằng bao nhiêu giây? (Làm tròn $3$ chữ số thập phân.)", "answer": "0.1", "explain": "Tại $t = 0$: pha $-\\pi/4$, $x = 3\\sqrt{2}$ cm (lần thứ nhất). Lần thứ hai khi pha $= \\pi/4$: $\\Delta\\varphi = \\pi/2$; $\\Delta t = \\frac{\\pi/2}{5\\pi} = 0{,}1$ s.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Quãng đường lớn nhất vật có thể đi được trong một khoảng thời gian ngắn $\\Delta t$ đạt được khi vật chuyển động", "options": ["A. quanh vị trí cân bằng (nơi tốc độ lớn nhất).", "B. quanh vị trí biên.", "C. đứng yên.", "D. với vận tốc không đổi."], "answer": "A", "explain": "Gần VTCB tốc độ lớn nhất nên quãng đường đi được trong cùng $\\Delta t$ là lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong dao động điều hòa, sau thời gian $T/2$ kể từ thời điểm ban đầu, vận tốc của vật", "options": ["A. giữ nguyên.", "B. đổi dấu (vật đến vị trí đối xứng).", "C. bằng $0$.", "D. tăng gấp đôi."], "answer": "B", "explain": "$v(t + T/2) = -v(t)$: sau nửa chu kì, vật đến vị trí đối xứng qua VTCB với vận tốc ngược dấu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 3\\cos\\left(\\frac{\\pi}{2}t + \\frac{\\pi}{3}\\right)$ (cm). Kể từ $t = 0$, thời gian ngắn nhất để vật đến vị trí cân bằng lần đầu là", "options": ["A. $\\frac{1}{3}$ s.", "B. $\\frac{2}{3}$ s.", "C. $1$ s.", "D. $\\frac{4}{3}$ s."], "answer": "A", "explain": "$T = 4$ s. Tại $t = 0$: pha $\\pi/3$ ($v \\lt 0$). Đến VTCB (pha $\\pi/2$): $\\Delta\\varphi = \\pi/6$; $\\Delta t = \\frac{\\pi/6}{\\pi/2} = \\frac{1}{3}$ s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $A = 4$ cm, tần số $f = 5$ Hz. Quãng đường vật đi được trong $0{,}1$ s là", "options": ["A. $8$ cm.", "B. $4$ cm.", "C. $16$ cm.", "D. $2$ cm."], "answer": "A", "explain": "$T = 0{,}2$ s; $0{,}1$ s $= T/2$ nên $S = 2A = 8$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 8\\cos\\left(2\\pi t + \\frac{5\\pi}{6}\\right)$ (cm). Kể từ $t = 0$, thời gian ngắn nhất để vật đến vị trí $x = 4\\sqrt{3}$ cm lần đầu là", "options": ["A. $0{,}5$ s.", "B. $\\frac{1}{6}$ s.", "C. $\\frac{1}{3}$ s.", "D. $1$ s."], "answer": "A", "explain": "Tại $t = 0$: pha $5\\pi/6$, $x = -4\\sqrt{3}$ cm. Đến $x = 4\\sqrt{3}$ cm (pha $11\\pi/6$): $\\Delta\\varphi = \\pi$; $\\Delta t = \\pi/(2\\pi) = 0{,}5$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 10\\cos(2\\pi t)$ (cm). Từ $t = 0$ đến $t = \\frac{11}{6}$ s, vật qua vị trí $x = 5$ cm bao nhiêu lần?", "options": ["A. $4$.", "B. $3$.", "C. $5$.", "D. $2$."], "answer": "A", "explain": "$T = 1$ s; pha $= 2\\pi t \\in [0, 11\\pi/3]$. $x = 5$ cm $\\Leftrightarrow$ pha $= \\pm\\pi/3 + 2k\\pi$. Các giá trị: $\\pi/3, 5\\pi/3, 7\\pi/3, 11\\pi/3$: $4$ lần.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường nhỏ nhất trong $\\Delta t$ đạt được khi vật chuyển động quanh vị trí biên.", "b) Sau thời gian $T/4$, vận tốc của vật đổi dấu so với ban đầu.", "c) Trong một chu kì, vật qua mỗi vị trí $x$ (không phải biên) $2$ lần.", "d) Thời gian giữa hai lần liên tiếp vật qua vị trí cân bằng là $T/2$."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: gần biên tốc độ nhỏ nhất. b) Sai: ví dụ $v(t + T/4) = -A\\omega\\sin(\\omega t + \\pi/2 + \\varphi) = -A\\omega\\cos(\\omega t + \\varphi)$, không hẳn đổi dấu. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 5\\cos\\left(2\\pi t - \\frac{2\\pi}{3}\\right)$ (cm) ($T = 1$ s). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường vật đi được trong $2{,}5$ s là $50$ cm.", "b) Thời gian ngắn nhất từ $t = 0$ đến $x = 5$ cm lần đầu là $1/3$ s.", "c) Thời gian ngắn nhất từ $t = 0$ đến $x = -5$ cm lần đầu là $5/6$ s.", "d) Sau $1$ s, vật trở lại trạng thái ban đầu."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $2{,}5T \\Rightarrow S = 10A = 50$ cm. b) Đúng: tại $t = 0$ pha $-2\\pi/3$; đến pha $0$: $\\Delta\\varphi = 2\\pi/3 \\Rightarrow \\Delta t = 1/3$ s. c) Đúng: đến pha $\\pi$: $\\Delta\\varphi = 5\\pi/3 \\Rightarrow \\Delta t = 5/6$ s. d) Đúng: sau một chu kì.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với biên độ $A = 4$ cm, chu kì $T = 0{,}4$ s. Tốc độ trung bình của vật trong một chu kì bằng bao nhiêu cm/s?", "answer": "40", "explain": "$\\bar{v} = 4A/T = 16/0{,}4 = 40$ cm/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 3\\cos\\left(2\\pi t - \\frac{\\pi}{6}\\right)$ (cm). Kể từ $t = 0$, thời gian ngắn nhất để $|v| = \\frac{\\sqrt{3}}{2}v_{\\max}$ lần đầu tiên bằng bao nhiêu giây? (Làm tròn $3$ chữ số thập phân.)", "answer": "0.25", "explain": "$|v| = \\frac{\\sqrt{3}}{2}v_{\\max} \\Leftrightarrow |\\sin| = \\frac{\\sqrt{3}}{2} \\Leftrightarrow$ pha $= \\pm\\pi/3, \\pm 2\\pi/3$. Tại $t = 0$ pha $= -\\pi/6$; lần đầu đạt khi pha $= \\pi/3$: $\\Delta\\varphi = \\pi/2$; $\\Delta t = \\frac{\\pi/2}{2\\pi} = 0{,}25$ s.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức tính quãng đường vật đi được trong thời gian $\\Delta t = nT$ ($n$ nguyên dương) là", "options": ["A. $S = 4nA$.", "B. $S = nA$.", "C. $S = 2nA$.", "D. $S = nA/2$."], "answer": "A", "explain": "Mỗi chu kì $S = 4A$ nên $n$ chu kì $S = 4nA$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thời gian ngắn nhất để vật dao động điều hòa đi từ $x = -A$ đến $x = 0$ là", "options": ["A. $T/4$.", "B. $T/2$.", "C. $T/8$.", "D. $T$."], "answer": "A", "explain": "Góc quét $\\pi/2$ nên $\\Delta t = T/4$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 6\\cos(2t + \\pi/4)$ (cm). Quãng đường vật đi được trong một chu kì là", "options": ["A. $24$ cm.", "B. $12$ cm.", "C. $6$ cm.", "D. $48$ cm."], "answer": "A", "explain": "$S = 4A = 24$ cm (không phụ thuộc $\\omega$, $\\varphi$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $A = 3$ cm, chu kì $T = 1$ s. Thời gian ngắn nhất để vật đi từ $x = 1{,}5$ cm đến $x = 3$ cm (theo chiều dương) là", "options": ["A. $\\frac{1}{6}$ s.", "B. $\\frac{1}{3}$ s.", "C. $\\frac{1}{2}$ s.", "D. $\\frac{1}{12}$ s."], "answer": "A", "explain": "Theo chiều dương: $x = 1{,}5$ cm ứng pha $-\\pi/3$; $x = 3$ cm ứng pha $0$. $\\Delta\\varphi = \\pi/3$; $\\Delta t = \\frac{\\pi/3}{2\\pi} = \\frac{1}{6}$ s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos\\left(4\\pi t - \\frac{\\pi}{2}\\right)$ (cm). Từ $t = 0$ đến $t = 0{,}375$ s, quãng đường vật đi được là", "options": ["A. $12$ cm.", "B. $8$ cm.", "C. $16$ cm.", "D. $4$ cm."], "answer": "A", "explain": "$T = 0{,}5$ s. Tại $t = 0$: pha $-\\pi/2$, $x = 0$, $v \\gt 0$. Sau $0{,}375$ s $= 3T/4$: vật đi $0 \\to 4$ ($4$ cm) $\\to 0$ ($4$ cm) $\\to -4$ ($4$ cm). Tổng $12$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 2\\cos(\\pi t + \\pi/3)$ (cm). Trong $4$ s đầu tiên, số lần vật qua vị trí $x = -1$ cm là", "options": ["A. $4$.", "B. $3$.", "C. $5$.", "D. $6$."], "answer": "A", "explain": "$T = 2$ s; pha $= \\pi t + \\pi/3 \\in [\\pi/3, 13\\pi/3]$. $x = -1$ cm $\\Leftrightarrow$ pha $= \\pm 2\\pi/3 + 2k\\pi$: các giá trị $2\\pi/3, 4\\pi/3, 8\\pi/3, 10\\pi/3$: $4$ lần.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường vật đi được trong thời gian $nT$ ($n$ nguyên) là $4nA$.", "b) Thời gian ngắn nhất vật đi từ $x = -A$ đến $x = 0$ là $T/4$.", "c) Thời gian ngắn nhất vật đi từ $x = 0$ đến $x = -A$ là $T/4$.", "d) Quãng đường vật đi được trong $T/3$ luôn bằng $4A/3$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: quãng đường trong $T/3$ phụ thuộc vị trí xuất phát.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật dao động điều hòa với biên độ $A = 2$ cm, chu kì $T = 0{,}2$ s. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường vật đi được trong $1$ s là $40$ cm.", "b) Tốc độ trung bình trong một chu kì là $40$ cm/s.", "c) Thời gian ngắn nhất vật đi từ biên dương đến biên âm là $0{,}1$ s.", "d) Sau $0{,}3$ s kể từ biên dương, vật đang ở vị trí cân bằng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $1$ s $= 5T \\Rightarrow S = 20A = 40$ cm. b) Đúng: $4A/T = 8/0{,}2 = 40$ cm/s. c) Đúng: $T/2 = 0{,}1$ s. d) Sai: $0{,}3$ s $= 1{,}5T$ nên vật ở biên dương.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 5\\cos\\left(\\pi t - \\frac{\\pi}{4}\\right)$ (cm). Quãng đường vật đi được từ $t = 0$ đến $t = 4$ s bằng bao nhiêu cm?", "answer": "40", "explain": "$T = 2$ s; $4$ s $= 2T$ nên $S = 8A = 40$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với biên độ $A = 10$ cm, chu kì $T = 2$ s. Thời gian ngắn nhất để vật đi từ $x = 5\\sqrt{3}$ cm đến $x = -5$ cm (theo chiều âm) bằng bao nhiêu giây? (Làm tròn $3$ chữ số thập phân.)", "answer": "0.5", "explain": "Theo chiều âm: $x = 5\\sqrt{3}$ cm ứng pha $\\pi/6$; $x = -5$ cm ứng pha $2\\pi/3$. $\\Delta\\varphi = \\pi/2$; $\\Delta t = \\frac{\\pi/2}{\\pi} = 0{,}5$ s.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bài toán tìm thời gian trong dao động điều hòa thường được quy về bài toán", "options": ["A. tìm góc quét $\\Delta\\varphi$ trên đường tròn lượng giác.", "B. đo trực tiếp bằng thước.", "C. ước lượng bằng mắt.", "D. tính vận tốc trung bình."], "answer": "A", "explain": "Thời gian $\\Delta t = \\Delta\\varphi/\\omega$ nên mấu chốt là xác định góc quét $\\Delta\\varphi$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quãng đường mà vật dao động điều hòa đi được", "options": ["A. không bao giờ âm.", "B. luôn âm.", "C. luôn bằng $4A$.", "D. luôn bằng $0$."], "answer": "A", "explain": "Quãng đường là độ dài quỹ đạo đã đi, luôn k
