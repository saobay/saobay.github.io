).", "d) Trên đường tròn lượng giác, bán kính đường tròn bằng biên độ $A$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: $\\varphi$ khác nhau làm dịch pha. c) Sai: $\\Delta\\varphi \\gt 0$ nghĩa là (2) sớm pha hơn (1). d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 5\\cos\\left(4t + \\frac{\\pi}{4}\\right)$ (cm), $x_2 = 5\\cos\\left(4t - \\frac{3\\pi}{4}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ lệch pha $\\Delta\\varphi = -\\pi$ nên hai dao động ngược pha.", "b) $x_2 = -x_1$ tại mọi thời điểm.", "c) Khi $x_1 = 5$ cm thì $x_2 = 5$ cm.", "d) Hai dao động có cùng chu kì $T = \\frac{\\pi}{2}$ s."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $|\\Delta\\varphi| = \\pi$. b) Đúng: $\\cos(\\alpha - \\pi) = -\\cos\\alpha$. c) Sai: $x_2 = -5$ cm. d) Đúng: $T = 2\\pi/4 = \\pi/2$ s.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 8\\cos\\left(2\\pi t + \\frac{2\\pi}{3}\\right)$ (cm). Li độ của vật tại $t = 0$ bằng bao nhiêu cm?", "answer": "-4", "explain": "$x(0) = 8\\cos\\left(\\frac{2\\pi}{3}\\right) = 8 \\cdot \\left(-\\frac{1}{2}\\right) = -4$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số, cùng biên độ $A$: $x_1 = 4\\cos\\left(\\omega t + \\frac{\\pi}{2}\\right)$ (cm), $x_2 = 4\\cos\\left(\\omega t - \\frac{\\pi}{2}\\right)$ (cm). Tại thời điểm $x_1 = 2\\sqrt{2}$ cm (lần đầu kể từ $t = 0$) thì $x_2$ bằng bao nhiêu cm? (Làm tròn $2$ chữ số thập phân.)", "answer": "-2.83", "explain": "$\\Delta\\varphi = -\\pi$ nên hai dao động ngược pha: $x_2 = -x_1$ tại mọi thời điểm. Vậy $x_2 = -2\\sqrt{2} \\approx -2{,}83$ cm.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Để mô tả đầy đủ một dao động điều hòa, ta cần biết", "options": ["A. chỉ biên độ $A$.", "B. biên độ $A$, chu kì $T$ (hoặc tần số) và pha ban đầu ộng (2) so với dao động (1) là", "options": ["A. trễ pha $\\frac{\\pi}{2}$.", "B. sớm pha $\\frac{\\pi}{2}$.", "C. ngược pha.", "D. cùng pha."], "answer": "A", "explain": "Đường (2) đạt cực đại trễ hơn đường (1) một khoảng $T/4$, ứng với độ trễ pha $\\omega \\cdot \\frac{T}{4} = \\frac{2\\pi}{T} \\cdot \\frac{T}{4} = \\frac{\\pi}{2}$. Vậy (2) trễ pha hơn (1) một góc $\\pi/2$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hai dao động cùng pha thì luôn có cùng li độ tại mọi thời điểm.", "b) Hai dao động ngược pha và cùng biên độ thì $x_2 = -x_1$ tại mọi thời điểm.", "c) Độ lệch pha cho biết dao động nào sớm pha hơn, dao động nào trễ pha hơn.", "d) Pha ban đầu $\\varphi$ được lấy trong khoảng $[-\\pi, \\pi]$."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: cùng pha nhưng biên độ khác nhau thì li độ khác nhau (chỉ cùng trạng thái). b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 6\\cos\\left(\\pi t + \\frac{\\pi}{3}\\right)$ (cm), $x_2 = 6\\cos\\left(\\pi t + \\frac{5\\pi}{6}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ lệch pha $\\Delta\\varphi = \\frac{\\pi}{2}$ nên hai dao động vuông pha.", "b) Dao động $x_2$ sớm pha hơn dao động $x_1$ một góc $\\frac{\\pi}{2}$.", "c) Khi $x_1 = 6$ cm thì $x_2 = 0$.", "d) Khi $x_2 = -6$ cm thì $x_1 = 0$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $5\\pi/6 - \\pi/3 = \\pi/2$. b) Đúng: $\\Delta\\varphi \\gt 0$. c) Đúng: $x_1$ cực đại thì $x_2$ qua VTCB. d) Đúng: $x_2$ cực tiểu thì $x_1$ qua VTCB.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = 5\\cos(\\omega t)$, $x_2 = 5\\cos\\left(\\omega t + \\frac{2\\pi}{3}\\right)$. Tính giá trị dương nhỏ nhất của $|\\Delta\\varphi|$ theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "2.09", "explain": "$|\\Delta\\varphi| = 2\\pi/3 \\approx 2 \\cdot 3{,}14/3 \\approx 2{,}09$ rad.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = A\\cos(5t + \\varphi)$ (cm), $A = 10$ cm. Biết tại $t = 0$, $x = -5\\sqrt{3}$ cm và $\\varphi$ thuộc khoảng $(\\pi/2, \\pi)$. Tìm $\\varphi$ theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "2.62", "explain": "$\\cos\\varphi = -\\frac{5\\sqrt{3}}{10} = -\\frac{\\sqrt{3}}{2} \\Rightarrow \\varphi = \\pm\\frac{5\\pi}{6}$; trong khoảng $(\\pi/2, \\pi)$ lấy $\\varphi = \\frac{5\\pi}{6} \\approx 2{,}62$ rad.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Hai dao động điều hòa cùng tần số có $\\Delta\\varphi = \\varphi_2 - \\varphi_1 \\gt 0$. Kết luận nào sau đây đúng?", "options": ["A. Dao động (2) sớm pha hơn dao động (1).", "B. Dao động (2) trễ pha hơn dao động (1).", "C. Hai dao động cùng pha.", "D. Hai dao động ngược pha."], "answer": "A", "explain": "$\\Delta\\varphi \\gt 0$ nghĩa là pha của (2) lớn hơn pha của (1): dao động (2) sớm pha hơn dao động (1).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trên đường tròn lượng giác biểu diễn dao động điều hòa, hình chiếu của điểm $M$ lên trục $Ox$ chính là", "options": ["A. vận tốc của vật.", "B. li độ $x$ của vật.", "C. gia tốc của vật.", "D. biên độ $A$."], "answer": "B", "explain": "Hình chiếu của $M$ lên trục $Ox$ là li độ $x = A\\cos(\\omega t + \\varphi)$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 4\\cos\\left(3t + \\frac{\\pi}{2}\\right)$ (cm), $x_2 = 4\\cos\\left(3t - \\frac{\\pi}{2}\\right)$ (cm). Độ lệch pha giữa hai dao động (lấy giá trị tuyệt đối) là", "options": ["A. $0$.", "B. $\\pi$ (hai dao động ngược pha).", "C. $\\frac{\\pi}{2}$.", "D. $2\\pi$."], "answer": "B", "explain": "$\\Delta\\varphi = -\\frac{\\pi}{2} - \\frac{\\pi}{2} = -\\pi$; $|\\Delta\\varphi| = \\pi$ nên hai dao động ngược pha.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = A\\cos\\left(\\omega t + \\frac{\\pi}{4}\\right)$. Tại thời điểm $t = 0$, li độ của vật bằng", "options": ["A. $A$.", "B. $-A$.", "C. $\\frac{A\\sqrt{2}}{2}$.", "D. $0$."], "answer": "C", "explain": "$x(0) = A\\cos\\left(\\frac{\\pi}{4}\\right) = \\frac{A\\sqrt{2}}{2}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = 3\\cos\\left(\\omega t + \\frac{\\pi}{3}\\right)$ (cm), $x_2 = 3\\cos\\left(\\omega t + \\frac{\\pi}{3} + \\pi\\right)$ (cm). Khi $x_1 = 1{,}5$ cm thì $x_2$ bằng", "options": ["A. $1{,}5$ cm.", "B. $-1{,}5$ cm.", "C. $3$ cm.", "D. $0$ cm."], "answer": "B", "explain": "$\\Delta\\varphi = \\pi$ nên ngược pha: $x_2 = -x_1 = -1{,}5$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = A\\cos(\\omega t)$, $x_2 = A\\cos\\left(\\omega t - \\frac{\\pi}{3}\\right)$. Tại thời điểm $x_1$ đạt cực đại lần đầu tiên ($t = 0$), $x_2$ bằng bao nhiêu? (Biết $A = 6$ cm.)", "options": ["A. $3$ cm.", "B. $6$ cm.", "C. $0$ cm.", "D. $-3$ cm."], "answer": "A", "explain": "Tại $t = 0$: $x_2 = A\\cos\\left(-\\frac{\\pi}{3}\\right) = 6 \\cdot \\frac{1}{2} = 3$ cm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\Delta\\varphi = 2k\\pi$: hai dao động cùng pha.", "b) $\\Delta\\varphi = (2k+1)\\pi$: hai dao động ngược pha.", "c) $\\Delta\\varphi = \\frac{\\pi}{2}$: hai dao động cùng pha.", "d) Độ lệch pha có đơn vị là radian."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: $\\Delta\\varphi = \\pi/2$ là vuông pha. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 2\\cos\\left(2\\pi t + \\frac{\\pi}{4}\\right)$ (cm), $x_2 = 2\\cos\\left(2\\pi t - \\frac{\\pi}{4}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ lệch pha $\\Delta\\varphi = -\\frac{\\pi}{2}$ nên hai dao động vuông pha.", "b) Dao động $x_1$ sớm pha hơn dao động $x_2$ một góc $\\frac{\\pi}{2}$.", "c) Khi $x_1 = 2$ cm thì $x_2 = 0$.", "d) Biên độ của hai dao động khác nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $|\\Delta\\varphi| = \\pi/2$. b) Đúng: $\\varphi_1 \\gt \\varphi_2$. c) Đúng: $x_1$ cực đại thì $x_2$ qua VTCB. d) Sai: cùng biên độ $2$ cm.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 10\\cos\\left(4\\pi t - \\frac{\\pi}{6}\\right)$ (cm). Tính pha dao động tại thời điểm $t = 0{,}25$ s theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "2.62", "explain": "Pha $= 4\\pi \\cdot 0{,}25 - \\frac{\\pi}{6} = \\pi - \\frac{\\pi}{6} = \\frac{5\\pi}{6} \\approx 2{,}62$ rad.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số, cùng biên độ $A = 5$ cm: $x_1 = 5\\cos\\left(\\omega t + \\frac{\\pi}{6}\\right)$ (cm), $x_2 = 5\\cos\\left(\\omega t - \\frac{\\pi}{6}\\right)$ (cm). Tại thời điểm $x_1 = 0$ thì $|x_2|$ bằng bao nhiêu cm? (Làm tròn $2$ chữ số thập phân.)", "answer": "4.33", "explain": "$x_1 = 0 \\Rightarrow \\omega t + \\frac{\\pi}{6} = \\frac{\\pi}{2} \\Rightarrow \\omega t = \\frac{\\pi}{3}$ (lấy nghiệm này). Khi đó $x_2 = 5\\cos\\left(\\frac{\\pi}{3} - \\frac{\\pi}{6}\\right) = 5\\cos\\left(\\frac{\\pi}{6}\\right) = \\frac{5\\sqrt{3}}{2} \\approx 4{,}33$ cm.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Độ lệch pha $\\Delta\\varphi$ giữa hai dao động điều hòa cùng chu kì", "options": ["A. thay đổi theo thời gian.", "B. không đổi theo thời gian.", "C. luôn bằng $0$.", "D. luôn bằng $\\pi$."], "answer": "B", "explain": "Vì hai dao động cùng $\\omega$ nên hiệu pha $(\\omega t + \\varphi_2) - (\\omega t + \\varphi_1) = \\varphi_2 - \\varphi_1$ không đổi theo thời gian.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai dao động điều hòa được gọi là vuông pha khi", "options": ["A. $\\Delta\\varphi = 2k\\pi$.", "B. $\\Delta\\varphi = (2k+1)\\pi$.", "C. $\\Delta\\varphi = \\pm\\frac{\\pi}{2} + 2k\\pi$.", "D. $\\Delta\\varphi = k\\pi$."], "answer": "C", "explain": "Vuông pha $\\Leftrightarrow \\Delta\\varphi = \\pm\\pi/2 + 2k\\pi$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = A\\cos\\left(\\omega t + \\frac{\\pi}{2}\\right)$, $x_2 = A\\cos(\\omega t)$. Dao động $x_1$ so với dao động $x_2$", "options": ["A. sớm pha $\\frac{\\pi}{2}$.", "B. trễ pha $\\frac{\\pi}{2}$.", "C. ngược pha.", "D. cùng pha."], "answer": "A", "explain": "$\\Delta\\varphi = \\pi/2 - 0 = \\pi/2 \\gt 0$ nên $x_1$ sớm pha hơn $x_2$ một góc $\\pi/2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên đường tròn lượng giác, tại $t = 0$ điểm $M$ ở vị trí ứng với góc $\\varphi = \\pi$ (trên trục $Ox$ âm). Biết biên độ $A = 5$ cm, li độ ban đầu $x_0$ là", "options": ["A. $5$ cm.", "B. $-5$ cm.", "C. $0$ cm.", "D. $2{,}5$ cm."], "answer": "B", "explain": "$x_0 = A\\cos(\\pi) = 5 \\cdot (-1) = -5$ cm (vật ở biên âm).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = 4\\cos\\left(2\\pi t + \\frac{\\pi}{3}\\right)$ (cm), $x_2 = 4\\cos\\left(2\\pi t + \\frac{\\pi}{3}\\right)$ (cm). Tại thời điểm $x_1 = 2$ cm thì $x_2$ bằng", "options": ["A. $2$ cm.", "B. $-2$ cm.", "C. $4$ cm.", "D. $0$ cm."], "answer": "A", "explain": "Hai dao động cùng pha ($\\Delta\\varphi = 0$) và cùng biên độ nên $x_1 = x_2$ tại mọi thời điểm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồ thị li độ – thời gian của hai dao động điều hòa cùng biên độ, cùng chu kì: đường (2) đạt cực đại trễ hơn đường (1) đúng nửa chu kì. Hai dao động này", "options": ["A. cùng pha.", "B. ngược pha.", "C. vuông pha.", "D. lệch pha $\\frac{\\pi}{4}$."], "answer": "B", "explain": "Trễ nửa chu kì ứng với độ trễ pha $\\omega \\cdot \\frac{T}{2} = \\pi$ nên hai dao động ngược pha.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Pha ban đầu $\\varphi$ cho biết dao động bắt đầu từ đâu.", "b) Hai dao động cùng tần số luôn cùng pha.", "c) Khi $\\Delta\\varphi = \\pi$: vật này ở biên dương thì vật kia ở biên âm (hai dao động cùng biên độ).", "d) Trên đường tròn lượng giác, góc $\\varphi$ là góc giữa $OM$ và trục $Ox$ tại $t = 0$."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: cùng tần số nhưng $\\varphi$ khác nhau thì lệch pha. c) Đúng: ngược pha. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 3\\cos(5\\pi t)$ (cm), $x_2 = 3\\cos(5\\pi t + \\pi)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hai dao động ngược pha.", "b) $x_1 + x_2 = 0$ tại mọi thời điểm.", "c) Khi $x_1 = 3$ cm thì $x_2 = 3$ cm.", "d) Chu kì của hai dao động đều bằng $0{,}4$ s."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $\\Delta\\varphi = \\pi$. b) Đúng: $x_2 = -x_1$. c) Sai: $x_2 = -3$ cm. d) Đúng: $T = 2\\pi/(5\\pi) = 0{,}4$ s.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = 6\\cos\\left(\\omega t + \\frac{\\pi}{4}\\right)$, $x_2 = 6\\cos\\left(\\omega t - \\frac{\\pi}{4}\\right)$. Tính giá trị dương nhỏ nhất của $|\\Delta\\varphi|$ theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "1.57", "explain": "$\\Delta\\varphi = -\\frac{\\pi}{4} - \\frac{\\pi}{4} = -\\frac{\\pi}{2}$ nên $|\\Delta\\varphi| = \\frac{\\pi}{2} \\approx 1{,}57$ rad.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = A\\cos\\left(\\frac{2\\pi}{T}t + \\varphi\\right)$, $T = 2$ s, pha ban đầu $\\varphi = \\frac{\\pi}{3}$. Kể từ $t = 0$, thời gian ngắn nhất để pha dao động bằng $\\pi$ là bao nhiêu giây? (Làm tròn $3$ chữ số thập phân.)", "answer": "0.667", "explain": "Độ tăng pha cần thiết: $\\Delta\\varphi = \\pi - \\frac{\\pi}{3} = \\frac{2\\pi}{3}$. $\\Delta t = \\frac{\\Delta\\varphi}{\\omega} = \\frac{2\\pi/3}{2\\pi/2} = \\frac{2}{3} \\approx 0{,}667$ s.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các cặp dao động điều hòa cùng tần số sau, cặp nào là hai dao động cùng pha?", "options": ["A. $x_1 = A\\cos(\\omega t)$, $x_2 = A\\cos(\\omega t + \\pi)$.", "B. $x_1 = A\\cos(\\omega t)$, $x_2 = A\\cos(\\omega t + 2\\pi)$.", "C. $x_1 = A\\cos(\\omega t)$, $x_2 = A\\cos\\left(\\omega t + \\frac{\\pi}{2}\\right)$.", "D. $x_1 = A\\cos(\\omega t)$, $x_2 = A\\cos\\left(\\omega t - \\frac{\\pi}{2}\\right)$."], "answer": "B", "explain": "$\\Delta\\varphi = 2\\pi = 2 \\cdot 1 \\cdot \\pi$ nên cùng pha; các cặp còn lại lệch pha $\\pi$ hoặc $\\pi/2$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai dao động điều hòa ngược pha, cùng biên độ $A$. Biên độ của hiệu li độ $x_1 - x_2$ bằng", "options": ["A. $0$.", "B. $A$.", "C. $2A$.", "D. $A/2$."], "answer": "C", "explain": "Ngược pha và cùng $A$ nên $x_2 = -x_1$, do đó $x_1 - x_2 = 2x_1$ có biên độ $2A$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 5\\cos\\left(\\omega t - \\frac{\\pi}{3}\\right)$ (cm), $x_2 = 5\\cos\\left(\\omega t + \\frac{\\pi}{3}\\right)$ (cm). Độ lệch pha của $x_2$ so với $x_1$ là", "options": ["A. $\\frac{2\\pi}{3}$ ($x_2$ sớm pha hơn).", "B. $\\frac{\\pi}{3}$.", "C. $\\pi$.", "D. $0$."], "answer": "A", "explain": "$\\Delta\\varphi = \\frac{\\pi}{3} - \\left(-\\frac{\\pi}{3}\\right) = \\frac{2\\pi}{3} \\gt 0$ nên $x_2$ sớm pha hơn $x_1$ một góc $2\\pi/3$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = A\\cos\\left(\\omega t + \\frac{2\\pi}{3}\\right)$. Tại $t = 0$, li độ của vật là (biết $A = 10$ cm)", "options": ["A. $5$ cm.", "B. $-5$ cm.", "C. $0$ cm.", "D. $10$ cm."], "answer": "B", "explain": "$x(0) = 10\\cos\\left(\\frac{2\\pi}{3}\\right) = 10 \\cdot \\left(-\\frac{1}{2}\\right) = -5$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai dao động điều hòa vuông pha, cùng biên độ $A = 4$ cm: $x_1 = 4\\cos(\\omega t)$ (cm), $x_2 = 4\\cos\\left(\\omega t - \\frac{\\pi}{2}\\right)$ (cm). Khi $|x_1| = 2$ cm thì $|x_2|$ bằng", "options": ["A. $2$ cm.", "B. $2\\sqrt{3}$ cm.", "C. $4$ cm.", "D. $0$ cm."], "answer": "B", "explain": "Vuông pha nên $\\left(\\frac{x_1}{A}\\right)^2 + \\left(\\frac{x_2}{A}\\right)^2 = 1$. Suy ra $|x_2| = \\sqrt{A^2 - x_1^2} = \\sqrt{16 - 4} = 2\\sqrt{3}$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = 6\\cos\\left(2\\pi t + \\frac{\\pi}{6}\\right)$ (cm), $x_2 = 6\\cos\\left(2\\pi t + \\frac{7\\pi}{6}\\right)$ (cm). Rút gọn độ lệch pha về khoảng $(-\\pi, \\pi]$, hai dao động này", "options": ["A. ngược pha.", "B. cùng pha.", "C. vuông pha.", "D. lệch pha $-\\frac{\\pi}{2}$."], "answer": "A", "explain": "$\\Delta\\varphi = \\frac{7\\pi}{6} - \\frac{\\pi}{6} = \\pi$ (đã nằm trong $(-\\pi, \\pi]$) nên hai dao động ngược pha.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Để mô tả một dao động điều hòa cần biết $A$, $\\omega$ (hoặc $T$, $f$) và $\\varphi$.", "b) Pha dao động tại $t = 0$ chính là pha ban đầu.", "c) Hai dao động có $\\Delta\\varphi = \\frac{\\pi}{2}$ thì khi một vật ở biên, vật kia ở vị trí cân bằng.", "d) Đường tròn lượng giác chỉ dùng được để biểu diễn dao động điều hòa."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng: vuông pha. d) Đúng (trong phạm vi chương trình).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 4\\cos\\left(2t + \\frac{\\pi}{6}\\right)$ (cm), $x_2 = 4\\cos\\left(2t + \\frac{2\\pi}{3}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ lệch pha $\\Delta\\varphi = \\frac{\\pi}{2}$ nên hai dao động vuông pha.", "b) Dao động $x_2$ sớm pha hơn dao động $x_1$.", "c) Khi $x_1 = 0$ thì $x_2 = \\pm 4$ cm.", "d) Khi $x_1 = 4$ cm thì $x_2 = 4$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $2\\pi/3 - \\pi/6 = \\pi/2$. b) Đúng. c) Đúng: vuông pha. d) Sai: $x_1$ cực đại thì $x_2 = 0$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa: pha dao động tại $t_1 = 1$ s là $\\frac{\\pi}{4}$, tại $t_2 = 3$ s là $\\frac{5\\pi}{4}$. Tính tần số góc $\\omega$ theo rad/s (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "1.57", "explain": "$\\Delta\\varphi = \\frac{5\\pi}{4} - \\frac{\\pi}{4} = \\pi$; $\\Delta t = 2$ s. $\\omega = \\frac{\\Delta\\varphi}{\\Delta t} = \\frac{\\pi}{2} \\approx 1{,}57$ rad/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = 8\\cos\\left(\\omega t + \\frac{\\pi}{3}\\right)$ (cm), $x_2 = 8\\cos\\left(\\omega t - \\frac{2\\pi}{3}\\right)$ (cm). Tính giá trị dương nhỏ nhất của $|\\Delta\\varphi|$ theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "3.14", "explain": "$\\Delta\\varphi = -\\frac{2\\pi}{3} - \\frac{\\pi}{3} = -\\pi$ nên $|\\Delta\\varphi| = \\pi \\approx 3{,}14$ rad (hai dao động ngược pha).", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Đại lượng nào sau đây đặc trưng cho trạng thái ban đầu của dao động điều hòa?", "options": ["A. Biên độ $A$.", "B. Tần số góc $\\omega$.", "C. Pha ban đầu $\\varphi$.", "D. Chu kì $T$."], "answer": "C", "explain": "Pha ban đầu $\\varphi$ xác định trạng thái dao động tại thời điểm $t = 0$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai dao động điều hòa có độ lệch pha $\\Delta\\varphi = \\frac{\\pi}{3}$ thì hai dao động", "options": ["A. cùng pha.", "B. ngược pha.", "C. lệch pha $\\frac{\\pi}{3}$.", "D. vuông pha."], "answer": "C", "explain": "$\\Delta\\varphi = \\pi/3$ không thuộc các trường hợp đặc biệt nên chỉ nói hai dao động lệch pha $\\pi/3$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 2\\cos\\left(3\\pi t + \\frac{5\\pi}{6}\\right)$ (cm). Pha ban đầu của dao động là", "options": ["A. $\\frac{5\\pi}{6}$ rad.", "B. $3\\pi$ rad.", "C. $2$ rad.", "D. $\\frac{\\pi}{6}$ rad."], "answer": "A", "explain": "Đối chiếu $x = A\\cos(\\omega t + \\varphi)$ được $\\varphi = 5\\pi/6$ rad.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = A\\cos\\left(\\omega t - \\frac{\\pi}{4}\\right)$, $x_2 = A\\cos\\left(\\omega t - \\frac{\\pi}{4} + \\pi\\right)$. Hai dao động này", "options": ["A. cùng pha.", "B. ngược pha.", "C. vuông pha.", "D. lệch pha $\\frac{\\pi}{4}$."], "answer": "B", "explain": "$\\Delta\\varphi = \\pi$ nên hai dao động ngược pha.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trên đường tròn lượng giác, tại $t = 0$ điểm $M$ ở vị trí ứng với góc $\\frac{5\\pi}{6}$. Biết biên độ $A = 6$ cm, li độ ban đầu $x_0$ là", "options": ["A. $-3\\sqrt{3}$ cm.", "B. $3\\sqrt{3}$ cm.", "C. $-3$ cm.", "D. $3$ cm."], "answer": "A", "explain": "$x_0 = 6\\cos\\left(\\frac{5\\pi}{6}\\right) = 6 \\cdot \\left(-\\frac{\\sqrt{3}}{2}\\right) = -3\\sqrt{3}$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số, cùng biên độ: $x_1 = 5\\cos\\left(\\omega t + \\frac{\\pi}{4}\\right)$ (cm), $x_2 = 5\\cos\\left(\\omega t - \\frac{\\pi}{4}\\right)$ (cm). Tại thời điểm $x_1 = 5$ cm thì $x_2$ bằng", "options": ["A. $5$ cm.", "B. $0$ cm.", "C. $-5$ cm.", "D. $2{,}5$ cm."], "answer": "B", "explain": "$\\Delta\\varphi = -\\pi/2$ nên hai dao động vuông pha: khi $|x_1| = A$ thì $x_2 = 0$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Với $x = A\\cos(\\omega t + \\varphi)$: khi $\\varphi = 0$, tại $t = 0$ vật ở biên dương.", "b) Khi $\\varphi = \\pi$, tại $t = 0$ vật ở biên âm.", "c) Khi $\\varphi = \\frac{\\pi}{2}$, tại $t = 0$ vật ở vị trí cân bằng.", "d) Pha ban đầu $\\varphi$ càng lớn thì dao động diễn ra càng nhanh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $x(0) = A$. b) Đúng: $x(0) = -A$. c) Đúng: $x(0) = 0$. d) Sai: mức độ nhanh chậm do $\\omega$ ($T$, $f$) quyết định.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 7\\cos\\left(4\\pi t + \\frac{\\pi}{2}\\right)$ (cm), $x_2 = 7\\cos\\left(4\\pi t - \\frac{\\pi}{2}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ lệch pha $\\Delta\\varphi = -\\pi$ nên hai dao động ngược pha.", "b) $x_2 = -x_1$ tại mọi thời điểm.", "c) Khi $x_1 = 7$ cm thì $x_2 = -7$ cm.", "d) Tần số của hai dao động đều bằng $2$ Hz."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: $f = 4\\pi/(2\\pi) = 2$ Hz.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 4\\cos(\\pi t + \\pi/3)$ (cm). Tính pha dao động tại thời điểm $t = 2$ s theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "7.33", "explain": "Pha $= \\pi \\cdot 2 + \\frac{\\pi}{3} = \\frac{7\\pi}{3} \\approx \\frac{7 \\cdot 3{,}14}{3} \\approx 7{,}33$ rad.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số, cùng biên độ $A$: $x_1 = A\\cos(\\omega t)$, $x_2 = A\\cos(\\omega t + \\Delta\\varphi)$. Biết khi $x_1 = A/2$ thì $x_2 = 0$ (xét trường hợp $\\Delta\\varphi$ thuộc khoảng $(0, \\pi/2)$). Tìm $\\Delta\\varphi$ theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "0.52", "explain": "$x_1 = A/2 \\Rightarrow \\omega t = \\pm\\pi/3$. $x_2 = 0 \\Rightarrow \\pm\\pi/3 + \\Delta\\varphi = \\pi/2 \\Rightarrow \\Delta\\varphi = \\pi/6$ hoặc $5\\pi/6$; trong khoảng $(0, \\pi/2)$ lấy $\\Delta\\varphi = \\pi/6 \\approx 0{,}52$ rad.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Pha dao động $(\\omega t + \\varphi)$ của dao động điều hòa", "options": ["A. xác định biên độ $A$.", "B. xác định trạng thái dao động tại thời điểm $t$.", "C. xác định chu kì $T$.", "D. xác định tần số $f$."], "answer": "B", "explain": "Pha dao động xác định trạng thái (li độ và chiều chuyển động) của vật tại thời điểm $t$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai dao động điều hòa cùng chu kì luôn có độ lệch pha không đổi theo thời gian vì", "options": ["A. chúng có cùng biên độ.", "B. chúng có cùng tần số góc.", "C. chúng có cùng pha ban đầu.", "D. chúng bắt đầu cùng lúc."], "answer": "B", "explain": "Cùng $\\omega$ nên hiệu pha $(\\omega t + \\varphi_2) - (\\omega t + \\varphi_1) = \\varphi_2 - \\varphi_1$ không đổi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai dao động điều hòa cùng tần số: $x_1 = 3\\cos\\left(2t + \\frac{\\pi}{3}\\right)$ (cm), $x_2 = 6\\cos\\left(2t + \\frac{\\pi}{3}\\right)$ (cm). Hai dao động này", "options": ["A. cùng pha.", "B. ngược pha.", "C. vuông pha.", "D. không so sánh được vì biên độ khác nhau."], "answer": "A", "explain": "$\\Delta\\varphi = 0$ nên hai dao động cùng pha (biên độ khác nhau không ảnh hưởng độ lệch pha).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = A\\cos\\left(\\omega t - \\frac{2\\pi}{3}\\right)$. Tại $t = 0$, li độ của vật là (biết $A = 8$ cm)", "options": ["A. $4$ cm.", "B. $-4$ cm.", "C. $0$ cm.", "D. $8$ cm."], "answer": "B", "explain": "$x(0) = 8\\cos\\left(-\\frac{2\\pi}{3}\\right) = 8 \\cdot \\left(-\\frac{1}{2}\\right) = -4$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai dao động điều hòa vuông pha, cùng biên độ: $x_1 = 4\\cos\\left(\\pi t + \\frac{\\pi}{6}\\right)$ (cm), $x_2 = 4\\cos\\left(\\pi t + \\frac{\\pi}{6} + \\frac{\\pi}{2}\\right)$ (cm). Khi $x_1 = 0$ thì $|x_2|$ bằng", "options": ["A. $4$ cm.", "B. $0$ cm.", "C. $2$ cm.", "D. $2\\sqrt{3}$ cm."], "answer": "A", "explain": "Vuông pha: khi một dao động ở VTCB ($x = 0$) thì dao động kia ở biên ($|x| = A = 4$ cm).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồ thị li độ – thời gian của hai dao động điều hòa cùng biên độ, cùng chu kì: đường (1) là đường côsin bắt đầu từ cực đại tại $t = 0$, đường (2) là đường côsin bắt đầu từ cực tiểu tại $t = 0$. Độ lệch pha của dao động (2) so với dao động (1) là", "options": ["A. $0$.", "B. $\\pi$.", "C. $\\frac{\\pi}{2}$.", "D. $-\\frac{\\pi}{2}$."], "answer": "B", "explain": "Đường (1): $x_1 = A\\cos(\\omega t)$; đường (2): $x_2 = -A\\cos(\\omega t) = A\\cos(\\omega t + \\pi)$. Độ lệch pha $\\Delta\\varphi = \\pi$: hai dao động ngược pha.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hai dao động cùng pha thì hai vật cùng đi qua vị trí cân bằng tại một thời điểm.", "b) Hai dao động ngược pha và cùng biên độ thì $x_1 = -x_2$ tại mọi thời điểm.", "c) Hai dao động vuông pha có $\\Delta\\varphi = \\frac{\\pi}{2} + 2k\\pi$ hoặc $\\Delta\\varphi = -\\frac{\\pi}{2} + 2k\\pi$.", "d) $\\Delta\\varphi = \\frac{\\pi}{6}$ là một trường hợp riêng của cùng pha."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng (cùng $\\omega$). b) Đúng. c) Đúng. d) Sai: $\\pi/6$ không có dạng $2k\\pi$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 5\\cos\\left(3t - \\frac{\\pi}{6}\\right)$ (cm), $x_2 = 5\\cos\\left(3t + \\frac{\\pi}{6}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ lệch pha $\\Delta\\varphi = \\frac{\\pi}{3}$.", "b) Dao động $x_2$ sớm pha hơn dao động $x_1$ một góc $\\frac{\\pi}{3}$.", "c) Hai dao động vuông pha.", "d) Khi $x_1 = 5$ cm thì $x_2 = 2{,}5$ cm."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $\\pi/6 - (-\\pi/6) = \\pi/3$. b) Đúng. c) Sai: $\\pi/3 \\ne \\pi/2$. d) Đúng: $x_1 = 5 \\Rightarrow 3t - \\pi/6 = 0 \\Rightarrow x_2 = 5\\cos(\\pi/3) = 2{,}5$ cm.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = A\\cos\\left(10t + \\frac{\\pi}{2}\\right)$, $x_2 = A\\cos\\left(10t - \\frac{\\pi}{2}\\right)$. Tính giá trị dương nhỏ nhất của $|\\Delta\\varphi|$ theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "3.14", "explain": "$\\Delta\\varphi = -\\frac{\\pi}{2} - \\frac{\\pi}{2} = -\\pi$ nên $|\\Delta\\varphi| = \\pi \\approx 3{,}14$ rad (ngược pha).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = 6\\cos(4\\pi t + \\varphi)$ (cm). Biết tại $t = 0$, $x = -3$ cm và $\\varphi$ thuộc khoảng $(\\pi/2, \\pi)$. Tìm $\\varphi$ theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "2.09", "explain": "$\\cos\\varphi = -\\frac{3}{6} = -\\frac{1}{2} \\Rightarrow \\varphi = \\pm\\frac{2\\pi}{3}$; trong khoảng $(\\pi/2, \\pi)$ lấy $\\varphi = \\frac{2\\pi}{3} \\approx 2{,}09$ rad.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trên đường tròn lượng giác biểu diễn dao động điều hòa, bán kính của đường tròn bằng", "options": ["A. tần số góc $\\omega$.", "B. biên độ $A$.", "C. chu kì $T$.", "D. pha ban đầu $\\varphi$."], "answer": "B", "explain": "Đường tròn có bán kính bằng biên độ $A$ của dao động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai dao động điều hòa có độ lệch pha $\\Delta\\varphi = 0$ thì hai dao động", "options": ["A. cùng pha.", "B. ngược pha.", "C. vuông pha.", "D. lệch pha $\\frac{\\pi}{2}$."], "answer": "A", "explain": "$\\Delta\\varphi = 0 = 2 \\cdot 0 \\cdot \\pi$ nên cùng pha.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 2\\cos(\\omega t + 0{,}5)$ (cm), $x_2 = 2\\cos(\\omega t + 0{,}5 + \\pi)$ (cm). Hai dao động này", "options": ["A. cùng pha.", "B. ngược pha.", "C. vuông pha.", "D. lệch pha $0{,}5$ rad."], "answer": "B", "explain": "$\\Delta\\varphi = \\pi$ nên hai dao động ngược pha.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật dao động điều hòa với phương trình $x = 5\\cos\\left(2\\pi t - \\frac{\\pi}{2}\\right)$ (cm). Tại $t = 0$, li độ của vật là", "options": ["A. $5$ cm.", "B. $-5$ cm.", "C. $0$ cm.", "D. $2{,}5$ cm."], "answer": "C", "explain": "$x(0) = 5\\cos\\left(-\\frac{\\pi}{2}\\right) = 0$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = 3\\cos(4t + \\pi/4)$ (cm), $x_2 = 3\\cos(4t + \\pi/4)$ (cm). Khi $x_1 = -3$ cm thì $x_2$ bằng", "options": ["A. $3$ cm.", "B. $-3$ cm.", "C. $0$ cm.", "D. $1{,}5$ cm."], "answer": "B", "explain": "Cùng pha và cùng biên độ nên $x_1 = x_2$ tại mọi thời điểm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = A\\cos\\left(\\omega t + \\frac{\\pi}{3}\\right)$, $x_2 = A\\cos\\left(\\omega t + \\frac{4\\pi}{3}\\right)$. Rút gọn độ lệch pha về khoảng $(-\\pi, \\pi]$, hai dao động này", "options": ["A. ngược pha.", "B. lệch pha $-\\frac{\\pi}{3}$.", "C. lệch pha $\\frac{\\pi}{3}$.", "D. cùng pha."], "answer": "A", "explain": "$\\Delta\\varphi = \\frac{4\\pi}{3} - \\frac{\\pi}{3} = \\pi$ (nằm trong $(-\\pi, \\pi]$) nên ngược pha.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Với $x = A\\cos(\\omega t + \\varphi)$: khi $\\varphi = -\\frac{\\pi}{2}$, tại $t = 0$ vật ở vị trí cân bằng.", "b) Khi $\\varphi = -\\frac{\\pi}{3}$, tại $t = 0$ li độ $x = \\frac{A}{2}$.", "c) Khi $\\varphi = \\frac{\\pi}{6}$, tại $t = 0$ li độ $x = \\frac{A\\sqrt{3}}{2}$.", "d) $\\varphi = \\frac{3\\pi}{4}$ nằm ngoài khoảng quy ước của pha ban đầu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $x(0) = A\\cos(-\\pi/2) = 0$. b) Đúng: $A\\cos(-\\pi/3) = A/2$. c) Đúng: $A\\cos(\\pi/6) = A\\sqrt{3}/2$. d) Sai: $3\\pi/4$ nằm trong $[-\\pi, \\pi]$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 6\\cos\\left(2\\pi t + \\frac{\\pi}{4}\\right)$ (cm), $x_2 = 6\\cos\\left(2\\pi t + \\frac{5\\pi}{4}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ lệch pha $\\Delta\\varphi = \\pi$ nên hai dao động ngược pha.", "b) Khi $x_1 = 0$ thì $x_2 = 0$.", "c) Khi $x_1 = 6$ cm thì $x_2 = -6$ cm.", "d) Hai dao động có cùng tần số $f = 1$ Hz."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: $x_2 = -x_1$. c) Đúng. d) Đúng: $f = 2\\pi/(2\\pi) = 1$ Hz.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai dao động điều hòa cùng phương, cùng tần số: $x_1 = 4\\cos\\left(5t + \\frac{\\pi}{3}\\right)$, $x_2 = 4\\cos\\left(5t - \\frac{\\pi}{6}\\right)$. Tính giá trị dương nhỏ nhất của $|\\Delta\\varphi|$ theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "1.57", "explain": "$\\Delta\\varphi = -\\frac{\\pi}{6} - \\frac{\\pi}{3} = -\\frac{\\pi}{2}$ nên $|\\Delta\\varphi| = \\frac{\\pi}{2} \\approx 1{,}57$ rad.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = A\\cos(\\omega t + \\varphi)$. Tại $t = 0$, $x_0 = \\frac{A\\sqrt{2}}{2} \\gt 0$. Biết $\\varphi$ thuộc khoảng $(0, \\pi/2)$. Tìm $\\varphi$ theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "0.79", "explain": "$\\cos\\varphi = \\frac{\\sqrt{2}}{2} \\Rightarrow \\varphi = \\pm\\frac{\\pi}{4}$; trong khoảng $(0, \\pi/2)$ lấy $\\varphi = \\frac{\\pi}{4} \\approx 0{,}79$ rad.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trên cùng một hệ trục tọa độ, đồ thị li độ – thời gian của hai dao động điều hòa cùng pha, cùng biên độ sẽ", "options": ["A. là hai đường chồng khít lên nhau.", "B. đối xứng nhau qua trục thời gian.", "C. vuông góc với nhau.", "D. là hai đường thẳng song song."], "answer": "A", "explain": "Cùng pha và cùng biên độ thì $x_1 = x_ ["A. Dao động (1) và (2).", "B. Dao động (1) và (3).", "C. Dao động (2) và (3).", "D. Không có cặp nào."], "answer": "B", "explain": "$|\\varphi_3 - \\varphi_1| = \\pi$ nên (1) và (3) ngược pha; (1)–(2) và (2)–(3) đều vuông pha.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ lệch pha cho biết dao động nào sớm pha hơn, dao động nào trễ pha hơn.", "b) $\\Delta\\varphi = \\frac{\\pi}{6}$: hai dao động lệch pha $\\frac{\\pi}{6}$.", "c) $\\Delta\\varphi = \\frac{7\\pi}{6}$ có thể rút gọn thành $-\\frac{5\\pi}{6}$.", "d) Hai dao động khác tần số vẫn có độ lệch pha không đổi theo thời gian."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: $7\\pi/6 - 2\\pi = -5\\pi/6$. d) Sai: khác $\\omega$ thì hiệu pha thay đổi theo $t$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai dao động điều hòa: $x_1 = 8\\cos(\\pi t)$ (cm), $x_2 = 8\\cos\\left(\\pi t + \\frac{\\pi}{3}\\right)$ (cm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ lệch pha $\\Delta\\varphi = \\frac{\\pi}{3}$.", "b) Dao động $x_2$ sớm pha hơn dao động $x_1$.", "c) Khi $x_1 = 8$ cm thì $x_2 = 4$ cm.", "d) Khi $x_2 = 8$ cm thì $x_1 = 8$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: $x_1 = 8 \\Rightarrow \\pi t = 0 \\Rightarrow x_2 = 8\\cos(\\pi/3) = 4$ cm. d) Sai: $x_2 = 8 \\Rightarrow \\pi t = -\\pi/3 \\Rightarrow x_1 = 8\\cos(-\\pi/3) = 4$ cm.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật dao động điều hòa với phương trình $x = 12\\cos\\left(2t - \\frac{\\pi}{3}\\right)$ (cm). Tính pha dao động tại thời điểm $t = \\pi$ s theo rad (lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân).", "answer": "5.23", "explain": "Pha $= 2\\pi - \\frac{\\pi}{3} = \\frac{5\\pi}{3} \\approx \\frac{5 \\cdot 3{,}14}{3} \\approx 5{,}23$ rad.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động điều hòa với phương trình $x = A\\co
