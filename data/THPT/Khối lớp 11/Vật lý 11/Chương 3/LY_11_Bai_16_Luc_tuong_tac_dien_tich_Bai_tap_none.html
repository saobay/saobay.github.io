hông là", "options": ["A. $1$.", "B. $0$.", "C. vô cùng.", "D. $9 \\cdot 10^9$."], "answer": "A", "explain": "Chân không: $\\varepsilon = 1$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai điện tích đặt trong dầu có $\\varepsilon = 2$ thì lực tương tác", "options": ["A. giảm $2$ lần so với trong chân không.", "B. tăng $2$ lần so với trong chân không.", "C. không đổi.", "D. giảm $4$ lần."], "answer": "A", "explain": "$F$ giảm $\\varepsilon = 2$ lần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai điện tích $q_1 = -5 \\cdot 10^{-9}$ C, $q_2 = 5 \\cdot 10^{-9}$ C đặt cách nhau $r = 5$ cm trong chân không. Lực tương tác là", "options": ["A. $9 \\cdot 10^{-5}$ N.", "B. $9 \\cdot 10^{-3}$ N.", "C. $1{,}8 \\cdot 10^{-4}$ N.", "D. $4{,}5 \\cdot 10^{-5}$ N."], "answer": "A", "explain": "$F = \\frac{9 \\cdot 10^9 \\cdot 25 \\cdot 10^{-18}}{25 \\cdot 10^{-4}} = 9 \\cdot 10^{-5}$ N (hút).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai điện tích đặt cách nhau $6$ cm thì đẩy nhau với lực $F = 4 \\cdot 10^{-4}$ N. Nếu giữ nguyên điện tích, tăng khoảng cách lên $12$ cm thì lực tương tác là", "options": ["A. $10^{-4}$ N.", "B. $16 \\cdot 10^{-4}$ N.", "C. $2 \\cdot 10^{-4}$ N.", "D. $8 \\cdot 10^{-4}$ N."], "answer": "A", "explain": "$r$ tăng $2$ lần ⇒ $F$ giảm $4$ lần: $F' = 10^{-4}$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện tích $q_1 = 2 \\cdot 10^{-8}$ C tại $A$, $q_2 = -8 \\cdot 10^{-8}$ C tại $B$, $AB = 12$ cm. Điểm $N$ trên đường thẳng $AB$ mà cường độ điện trường tổng hợp bằng $0$ cách $A$", "options": ["A. $12$ cm.", "B. $6$ cm.", "C. $24$ cm.", "D. $4$ cm."], "answer": "A", "explain": "$|q_2| = 4|q_1| \\Rightarrow r_2 = 2r_1$; $N$ nằm ngoài đoạn $AB$ về phía $A$: $r_2 - r_1 = 12$ cm $\\Rightarrow r_1 = 12$ cm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hằng số điện môi của chân không bằng $1$.", "b) Hằng số điện môi của không khí xấp xỉ $1$.", "c) Trong môi trường điện môi, lực Cu-lông yếu đi.", "d) $\\varepsilon$ càng lớn thì $F$ càng lớn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $F$ tỉ lệ nghịch với $\\varepsilon$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai điện tích $q_1 = q_2 = 6 \\cdot 10^{-7}$ C đặt cách nhau $r = 30$ cm trong chân không. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $F = 3{,}6 \\cdot 10^{-2}$ N.", "b) Đây là lực đẩy.", "c) Nếu $r = 15$ cm thì $F = 0{,}144$ N.", "d) Nếu đặt trong nước ($\\varepsilon = 81$) thì $F$ giảm $81$ lần."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $F = \\frac{9 \\cdot 10^9 \\cdot 36 \\cdot 10^{-14}}{9 \\cdot 10^{-2}} = 3{,}6 \\cdot 10^{-2}$ N. b) Đúng. c) Đúng: $F$ tăng $4$ lần. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai điện tích $q_1 = q_2 = 6 \\cdot 10^{-7}$ C đặt cách nhau $r = 30$ cm trong chân không thì đẩy nhau với lực $F = 3{,}6 \\cdot 10^{-2}$ N. Lực này bằng bao nhiêu mN?", "answer": "36", "explain": "$3{,}6 \\cdot 10^{-2}$ N $= 36$ mN.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai điện tích $q_1 = 9 \\cdot 10^{-9}$ C, $q_2 = 4 \\cdot 10^{-9}$ C đặt cách nhau $r = 5$ cm trong chân không. Lực tương tác bằng bao nhiêu lần $10^{-4}$ N? (Làm tròn $3$ chữ số thập phân.)", "answer": "1.296", "explain": "$F = \\frac{9 \\cdot 10^9 \\cdot 36 \\cdot 10^{-18}}{25 \\cdot 10^{-4}} = 1{,}296 \\cdot 10^{-4}$ N, tức $1{,}296$ lần $10^{-4}$ N.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Lực tương tác giữa hai điện tích điểm có phương", "options": ["A. là đường thẳng nối hai điện tích.", "B. vuông góc với đường nối hai điện tích.", "C. có hướng bất kì.", "D. là tiếp tuyến với đường nối."], "answer": "A", "explain": "Lực Cu-lông có phương trùng với đường thẳng nối hai điện tích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cặp lực tương tác giữa hai điện tích điểm là cặp lực", "options": ["A. trực đối.", "B. cùng chiều.", "C. vuông góc.", "D. song song."], "answer": "A", "explain": "Theo định luật 3 Newton: cùng phương, ngược chiều, cùng độ lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai điện tích $q_1 = 10^{-7}$ C, $q_2 = -10^{-7}$ C đặt cách nhau $r = 1$ cm trong chân không. Lực tương tác là", "options": ["A. $0{,}9$ N.", "B. $9$ N.", "C. $0{,}09$ N.", "D. $90$ N."], "answer": "A", "explain": "$F = \\frac{9 \\cdot 10^9 \\cdot 10^{-14}}{10^{-4}} = 0{,}9$ N (hút).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nếu tăng cả $|q_1|$, $|q_2|$ lên gấp đôi và tăng $r$ gấp đôi thì lực Cu-lông", "options": ["A. không đổi.", "B. tăng $4$ lần.", "C. giảm $4$ lần.", "D. tăng $2$ lần."], "answer": "A", "explain": "$F' = \\frac{4}{4}F = F$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai điện tích đặt cách nhau $r = 4$ cm trong chân không tương tác với lực $F = 9 \\cdot 10^{-5}$ N. Nếu đặt chúng trong điện môi có $\\varepsilon = 3$ (giữ nguyên $r$) thì lực tương tác là", "options": ["A. $3 \\cdot 10^{-5}$ N.", "B. $27 \\cdot 10^{-5}$ N.", "C. $9 \\cdot 10^{-5}$ N.", "D. $10^{-5}$ N."], "answer": "A", "explain": "$F' = F/3 = 3 \\cdot 10^{-5}$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện tích $q_1 = 4\\,\\mu$C đặt tại gốc tọa độ $O$, $q_2 = 1\\,\\mu$C đặt tại $x = 3$ cm trên trục $Ox$. Lực do $q_1$ tác dụng lên $q_2$ là", "options": ["A. $40$ N, hướng theo chiều $+Ox$.", "B. $40$ N, hướng theo chiều $-Ox$.", "C. $10$ N, hướng theo chiều $+Ox$.", "D. $160$ N, hướng theo chiều $+Ox$."], "answer": "A", "explain": "$F = \\frac{9 \\cdot 10^9 \\cdot 4 \\cdot 10^{-12}}{9 \\cdot 10^{-4}} = 40$ N; cùng dấu nên đẩy nhau, hướng $+Ox$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lực Cu-lông có phương trùng với đường thẳng nối hai điện tích.", "b) Hai lực tương tác giữa hai điện tích trực đối nhau.", "c) Độ lớn hai lực tương tác bằng nhau.", "d) Lực Cu-lông là lực hấp dẫn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: lực Cu-lông là lực điện.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai điện tích $q_1 = 2 \\cdot 10^{-6}$ C, $q_2 = 3 \\cdot 10^{-6}$ C đặt cách nhau $r = 3$ cm trong chân không. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $F = 60$ N.", "b) Lực do $q_1$ tác dụng lên $q_2$ bằng lực do $q_2$ tác dụng lên $q_1$ (về độ lớn).", "c) Nếu $q_2 = -3 \\cdot 10^{-6}$ C: hai điện tích hút nhau.", "d) Trong điện môi $\\varepsilon = 6$: $F = 10$ N."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $F = \\frac{9 \\cdot 10^9 \\cdot 6 \\cdot 10^{-12}}{9 \\cdot 10^{-4}} = 60$ N. b) Đúng. c) Đúng. d) Đúng: $F/6 = 10$ N.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai điện tích $q_1 = 8 \\cdot 10^{-9}$ C, $q_2 = 2 \\cdot 10^{-9}$ C đặt cách nhau $r = 4$ cm trong chân không. Lực tương tác bằng bao nhiêu lần $10^{-4}$ N? (Làm tròn $2$ chữ số thập phân.)", "answer": "0.9", "explain": "$F = \\frac{9 \\cdot 10^9 \\cdot 16 \\cdot 10^{-18}}{16 \\cdot 10^{-4}} = 9 \\cdot 10^{-5} = 0{,}9 \\cdot 10^{-4}$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai điện tích điểm giống nhau $q$, đặt cách nhau $r = 2$ cm trong chân không thì đẩy nhau với lực $F = 3{,}6 \\cdot 10^{-3}$ N. Điện tích $q$ bằng bao nhiêu $\\mu$C? (Làm tròn $4$ chữ số thập phân.)", "answer": "0.0126", "explain": "$q^2 = Fr^2/k = \\frac{3{,}6 \\cdot 10^{-3} \\cdot 4 \\cdot 10^{-4}}{9 \\cdot 10^9} = 1{,}6 \\cdot 10^{-16} \\Rightarrow q \\approx 1{,}265 \\cdot 10^{-8}$ C $\\approx 0{,}0126\\,\\mu$C.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Điện tích điểm là", "options": ["A. vật mang điện có kích thước rất nhỏ so với khoảng cách tới điểm đang xét.", "B. điện tích có độ lớn rất nhỏ.", "C. điện tích bằng $0$.", "D. electron."], "answer": "A", "explain": "Định nghĩa điện tích điểm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi hai vật nhiễm điện cho tiếp xúc rồi tách ra, điện tích của chúng", "options": ["A. phân bố lại cho hai vật.", "B. biến mất hoàn toàn.", "C. tăng gấp đôi.", "D. mỗi vật giữ nguyên."], "answer": "A", "explain": "Điện tích được phân bố lại (bảo toàn tổng điện tích).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai quả cầu nhỏ trung hòa về điện; cọ xát làm quả cầu $A$ mất $10^{10}$ electron. Điện tích của quả cầu $A$ là", "options": ["A. $+1{,}6 \\cdot 10^{-9}$ C.", "B. $-1{,}6 \\cdot 10^{-9}$ C.", "C. $+1{,}6 \\cdot 10^{-10}$ C.", "D. $0$."], "answer": "A", "explain": "$q_A = 10^{10} \\cdot 1{,}6 \\cdot 10^{-19} = +1{,}6 \\cdot 10^{-9}$ C.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quả cầu $B$ nhận $10^{10}$ electron từ quả cầu $A$ ở câu trên. Điện tích của quả cầu $B$ là", "options": ["A. $-1{,}6 \\cdot 10^{-9}$ C.", "B. $+1{,}6 \\cdot 10^{-9}$ C.", "C. $-1{,}6 \\cdot 10^{-10}$ C.", "D. $0$."], "answer": "A", "explain": "Thừa electron nên nhiễm điện âm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai điện tích $q_1 = 3\\,\\mu$C, $q_2 = -6\\,\\mu$C đặt cách nhau $r = 9$ cm trong chân không. Lực tương tác là", "options": ["A. $20$ N.", "B. $2$ N.", "C. $200$ N.", "D. $0{,}2$ N."], "answer": "A", "explain": "$F = \\frac{9 \\cdot 10^9 \\cdot 18 \\cdot 10^{-12}}{81 \\cdot 10^{-4}} = 20$ N (hút).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ba điện tích $q_1 = q_2 = q_3 = 10^{-8}$ C đặt tại ba đỉnh của tam giác đều cạnh $3$ cm trong chân không. Lực điện tổng hợp tác dụng lên $q_1$ xấp xỉ", "options": ["A. $1{,}73 \\cdot 10^{-3}$ N.", "B. $10^{-3}$ N.", "C. $2 \\cdot 10^{-3}$ N.", "D. $3 \\cdot 10^{-3}$ N."], "answer": "A", "explain": "$F_{21} = F_{31} = \\frac{9 \\cdot 10^9 \\cdot 10^{-16}}{9 \\cdot 10^{-4}} = 10^{-3}$ N; $F_1 = \\sqrt{3} \\cdot 10^{-3} \\approx 1{,}73 \\cdot 10^{-3}$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các k ch.", "B. hấp dẫn giữa các vật.", "C. đàn hồi của lò xo.", "D. ma sát."], "answer": "A", "explain": "Lực Cu-lông là lực tương tác điện giữa các điện tích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ lớn của lực Cu-lông tỉ lệ thuận với", "options": ["A. tích độ lớn của hai điện tích.", "B. tổng độ lớn của hai điện tích.", "C. hiệu độ lớn của hai điện tích.", "D. khoảng cách giữa hai điện tích."], "answer": "A", "explain": "$F \\sim |q_1 q_2|$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết $|q_1| = 2|q_2|$. Lực do $q_1$ tác dụng lên $q_2$ so với lực do $q_2$ tác dụng lên $q_1$ thì", "options": ["A. bằng nhau.", "B. gấp đôi.", "C. bằng một nửa.", "D. gấp $4$ lần."], "answer": "A", "explain": "Theo định luật 3 Newton, hai lực trực đối, cùng độ lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khoảng cách giữa hai điện tích tăng $3$ lần (giữ nguyên điện tích) thì lực Cu-lông", "options": ["A. giảm $9$ lần.", "B. tăng $9$ lần.", "C. giảm $3$ lần.", "D. không đổi."], "answer": "A", "explain": "$F \\sim 1/r^2$ nên giảm $9$ lần.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai điện tích $q_1 = -2\\,\\mu$C, $q_2 = -8\\,\\mu$C đặt cách nhau $r = 6$ cm trong chân không. Lực tương tác là", "options": ["A. $40$ N (đẩy).", "B. $40$ N (hút).", "C. $10$ N (đẩy).", "D. $160$ N (đẩy)."], "answer": "A", "explain": "$F = \\frac{9 \\cdot 10^9 \\cdot 16 \\cdot 10^{-12}}{36 \\cdot 10^{-4}} = 40$ N; cùng dấu nên đẩy nhau.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ba điện tích điểm thẳng hàng: $q_1 = 6 \\cdot 10^{-8}$ C tại $x = 0$, $q_2 = 6 \\cdot 10^{-8}$ C tại $x = 4$ cm, $q_3 = -6 \\cdot 10^{-8}$ C tại $x = 8$ cm. Lực điện tổng hợp tác dụng lên $q_2$ là", "options": ["A. $4{,}05 \\cdot 10^{-2}$ N, hướng về phía $q_3$.", "B. $0$.", "C. $2{,}025 \\cdot 10^{-2}$ N, hướng về phía $q_1$.", "D. $8{,}1 \\cdot 10^{-2}$ N, hướng về phía $q_3$."], "answer": "A", "explain": "$F_{12} = F_{32} = \\frac{9 \\cdot 10^9 \\cdot 36 \\cdot 1
