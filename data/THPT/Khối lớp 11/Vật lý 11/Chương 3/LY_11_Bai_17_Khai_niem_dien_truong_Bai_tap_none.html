 $Q = -2 \\cdot 10^{-8}$ C đặt trong chân không. Cường độ điện trường tại điểm cách $Q$ $r = 10$ cm là", "options": ["A. $1{,}8 \\cdot 10^4$ V/m, hướng về $Q$.", "B. $1{,}8 \\cdot 10^4$ V/m, hướng ra xa $Q$.", "C. $1{,}8 \\cdot 10^5$ V/m.", "D. $3{,}6 \\cdot 10^4$ V/m."], "answer": "A", "explain": "$E = \\frac{9 \\cdot 10^9 \\cdot 2 \\cdot 10^{-8}}{10^{-2}} = 1{,}8 \\cdot 10^4$ V/m; $Q \\lt 0$ nên hướng về $Q$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tại một điểm, $\\vec{E}_1 = 3 \\cdot 10^4$ V/m hướng theo chiều $+x$, $\\vec{E}_2 = 4 \\cdot 10^4$ V/m hướng theo chiều $+y$. Cường độ điện trường tổng hợp là", "options": ["A. $5 \\cdot 10^4$ V/m.", "B. $7 \\cdot 10^4$ V/m.", "C. $10^4$ V/m.", "D. $12 \\cdot 10^4$ V/m."], "answer": "A", "explain": "$E = \\sqrt{3^2 + 4^2} \\cdot 10^4 = 5 \\cdot 10^4$ V/m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tại một điểm, $\\vec{E}_1 = 6 \\cdot 10^3$ V/m (hướng sang phải), $\\vec{E}_2 = 8 \\cdot 10^3$ V/m (hướng sang trái). Cường độ điện trường tổng hợp là", "options": ["A. $2 \\cdot 10^3$ V/m, ngược chiều $\\vec{E}_1$.", "B. $14 \\cdot 10^3$ V/m.", "C. $10 \\cdot 10^3$ V/m.", "D. $0$."], "answer": "A", "explain": "$E = |6 - 8| \\cdot 10^3 = 2 \\cdot 10^3$ V/m, cùng chiều $\\vec{E}_2$ (ngược chiều $\\vec{E}_1$).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Điện trường là một dạng vật chất.", "b) Điện trường tác dụng lực điện lên điện tích đặt trong nó.", "c) Cường độ điện trường đặc trưng cho tác dụng lực của điện trường.", "d) Đường sức điện là quỹ đạo chuyển động của điện tích dương."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đường sức chỉ cho biết phương chiều của $\\vec{E}$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Điện tích $Q = 5 \\cdot 10^{-9}$ C đặt trong chân không. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tại $r = 1$ cm: $E = 4{,}5 \\cdot 10^5$ V/m.", "b) Tại $r = 3$ cm: $E = 5 \\cdot 10^4$ V/m.", "c) $E$ tỉ lệ nghịch với $r^2$.", "d) Đổi $Q$ thành $-5 \\cdot 10^{-9}$ C thì $\\vec{E}$ đổi chiều."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $E = \\frac{9 \\cdot 10^9 \\cdot 5 \\cdot 10^{-9}}{10^{-4}} = 4{,}5 \\cdot 10^5$ V/m. b) Đúng: $E/9$. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Điện tích $q = 10^{-6}$ C chịu lực điện $F = 0{,}02$ N. Cường độ điện trường tại điểm đặt $q$ bằng bao nhiêu V/m?", "answer": "20000", "explain": "$E = \\frac{0{,}02}{10^{-6}} = 2 \\cdot 10^4$ V/m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tại một điểm, $\\vec{E}_1$ và $\\vec{E}_2$ có cùng độ lớn $E_0$, hợp với nhau góc $60°$. Cường độ điện trường tổng hợp bằng bao nhiêu lần $E_0$? (Làm tròn $2$ chữ số thập phân.)", "answer": "1.73", "explain": "$E = 2E_0\\cos(30°) = E_0\\sqrt{3} \\approx 1{,}73E_0$.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "V/m là đơn vị của đại lượng nào sau đây?", "options": ["A. Cường độ điện trường.", "B. Điện thế.", "C. Lực điện.", "D. Công của lực điện."], "answer": "A", "explain": "Đơn vị của cường độ điện trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "N/C tương đương với đơn vị", "options": ["A. V/m.", "B. V.", "C. J.", "D. C."], "answer": "A", "explain": "$E = F/q$: $1$ N/C $= 1$ V/m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tại điểm có $E = 10^3$ V/m, lực điện tác dụng lên điện tích $q = 2\\,\\mu$C là", "options": ["A. $2 \\cdot 10^{-3}$ N.", "B. $500$ N.", "C. $2 \\cdot 10^9$ N.", "D. $5 \\cdot 10^{-10}$ N."], "answer": "A", "explain": "$F = qE = 2 \\cdot 10^{-6} \\cdot 10^3 = 2 \\cdot 10^{-3}$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tại điểm có $E = 10^3$ V/m, lực điện tác dụng lên electron ($|e| = 1{,}6 \\cdot 10^{-19}$ C) là", "options": ["A. $1{,}6 \\cdot 10^{-16}$ N.", "B. $1{,}6 \\cdot 10^{-22}$ N.", "C. $6{,}25 \\cdot 10^{21}$ N.", "D. $10^3$ N."], "answer": "A", "explain": "$F = eE = 1{,}6 \\cdot 10^{-19} \\cdot 10^3 = 1{,}6 \\cdot 10^{-16}$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai điện tích $Q_1 = Q_2 = -5 \\cdot 10^{-9}$ C đặt tại $A$, $B$ cách nhau $8$ cm trong chân không. Cường độ điện trường tại trung điểm $M$ của $AB$ là", "options": ["A. $0$.", "B. $5{,}6 \\cdot 10^4$ V/m.", "C. $2{,}8 \\cdot 10^4$ V/m.", "D. $1{,}4 \\cdot 10^4$ V/m."], "answer": "A", "explain": "Hai vectơ $\\vec{E}$ ngược chiều, cùng độ lớn ⇒ triệt tiêu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện tích $Q_1 = 2 \\cdot 10^{-9}$ C tại $A$, $Q_2 = -2 \\cdot 10^{-9}$ C tại $B$, $AB = 6$ cm, $M$ là trung điểm của $AB$. Cường độ điện trường tại $M$ là", "options": ["A. $4 \\cdot 10^4$ V/m.", "B. $0$.", "C. $2 \\cdot 10^4$ V/m.", "D. $8 \\cdot 10^4$ V/m."], "answer": "A", "explain": "$E_1 = E_2 = \\frac{9 \\cdot 10^9 \\cdot 2 \\cdot 10^{-9}}{9 \\cdot 10^{-4}} = 2 \\cdot 10^4$ V/m; cùng chiều từ $A$ đến $B$ ⇒ $E_M = 4 \\cdot 10^4$ V/m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $1$ V/m $= 1$ N/C.", "b) Cường độ điện trường là đại lượng vectơ.", "c) $\\vec{E}$ tại một điểm không phụ thuộc vào điện tích thử.", "d) Điện tích thử càng lớn thì $E$ càng lớn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Điện tích $Q = -10^{-8}$ C đặt tại $O$, $M$ cách $O$ $5$ cm, $N$ cách $O$ $10$ cm. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $E_M = 3{,}6 \\cdot 10^4$ V/m.", "b) $E_N = 9 \\cdot 10^3$ V/m.", "c) $\\vec{E}_M$ hướng về $O$.", "d) $\\vec{E}_N$ hướng ra xa $O$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $E = \\frac{9 \\cdot 10^9 \\cdot 10^{-8}}{25 \\cdot 10^{-4}} = 3{,}6 \\cdot 10^4$ V/m. b) Đúng: $E/4$. c) Đúng: $Q \\lt 0$. d) Sai: hướng về $O$.", "points": 1}, {"type": "short", "level": "VD", "q": "Tại điểm có $E = 8 \\cdot 10^4$ V/m, đặt điện tích $q = -3 \\cdot 10^{-9}$ C. Độ lớn của lực điện tác dụng lên $q$ bằng bao nhiêu lần $10^{-4}$ N? (Làm tròn $1$ chữ số thập phân.)", "answer": "2.4", "explain": "$F = |q|E = 3 \\cdot 10^{-9} \\cdot 8 \\cdot 10^4 = 2{,}4 \\cdot 10^{-4}$ N, tức $2{,}4$ lần $10^{-4}$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện tích $Q$ gây ra $E = 2 \\cdot 10^5$ V/m tại điểm cách $Q$ $r = 3$ cm trong chân không. Điện tích $Q$ bằng bao nhiêu nC? (Làm tròn $1$ chữ số thập phân.)", "answer": "20", "explain": "$|Q| = Er^2/k = \\frac{2 \\cdot 10^5 \\cdot 9 \\cdot 10^{-4}}{9 \\cdot 10^9} = 2 \\cdot 10^{-8}$ C $= 20$ nC.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Điện trường tồn tại", "options": ["A. xung quanh điện tích.", "B. chỉ trong dây dẫn kim loại.", "C. chỉ trong chân không.", "D. chỉ khi có dòng điện."], "answer": "A", "explain": "Điện trường tồn tại xung quanh điện tích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để phát hiện điện trường tại một điểm, người ta dùng", "options": ["A. điện tích thử.", "B. nam châm thử.", "C. nhiệt kế.", "D. vôn kế."], "answer": "A", "explain": "Dùng điện tích thử để phát hiện và đo điện trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện tích thử là", "options": ["A. điện tích nhỏ, dương.", "B. điện tích có độ lớn lớn.", "C. điện tích âm.", "D. vật trung hòa về điện."], "answer": "A", "explain": "Điện tích thử thường có độ lớn nhỏ và mang điện dương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện tích $Q = 10^{-9}$ C đặt trong chân không. Cường độ điện trường tại điểm cách $Q$ $r = 3$ cm là", "options": ["A. $10^4$ V/m.", "B. $3 \\cdot 10^4$ V/m.", "C. $10^5$ V/m.", "D. $9 \\cdot 10^4$ V/m."], "answer": "A", "explain": "$E = \\frac{9 \\cdot 10^9 \\cdot 10^{-9}}{9 \\cdot 10^{-4}} = 10^4$ V/m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tại điểm có $\\vec{E} = 6 \\cdot in": "$|Q| = Er^2/k = \\frac{2{,}5 \\cdot 10^5 \\cdot 4 \\cdot 10^{-4}}{9 \\cdot 10^9} \\approx 1{,}11 \\cdot 10^{-8}$ C $= 0{,}0111\\,\\mu$C.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện tích $q_1 = 10^{-8}$ C đặt tại một điểm chịu lực điện $F_1 = 3 \\cdot 10^{-4}$ N. Điện tích $q_2 = 2 \\cdot 10^{-8}$ C đặt tại đúng điểm đó chịu lực điện bằng bao nhiêu lần $10^{-4}$ N?", "answer": "6", "explain": "$E = F_1/q_1 = 3 \\cdot 10^4$ V/m; $F_2 = q_2E = 6 \\cdot 10^{-4}$ N, tức $6$ lần $10^{-4}$ N.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Cường độ điện trường tại một điểm đặc trưng cho", "options": ["A. tác dụng lực của điện trường tại điểm đó.", "B. điện tích đặt tại điểm đó.", "C. năng lượng tại điểm đó.", "D. từ trường tại điểm đó."], "answer": "A", "explain": "Định nghĩa cường độ điện trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức $E = k|Q|/r^2$ áp dụng cho", "options": ["A. điện trường do điện tích điểm $Q$ gây ra.", "B. mọi vật mang điện.", "C. tụ điện phẳng.", "D. dây dẫn mang dòng điện."], "answer": "A", "explain": "Công thức của điện trường do điện tích điểm gây ra.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện tích $Q = 3 \\cdot 10^{-9}$ C đặt trong chân không. Cường độ điện trường tại điểm cách $Q$ $r = 30$ cm là", "options": ["A. $300$ V/m.", "B. $2700$ V/m.", "C. $3 \\cdot 10^4$ V/m.", "D. $33{,}3$ V/m."], "answer": "A", "explain": "$E = \\frac{9 \\cdot 10^9 \\cdot 3 \\cdot 10^{-9}}{0{,}09} = 300$ V/m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tại điểm có $E = 500$ V/m, lực điện tác dụng lên điện tích $q = 4\\,\\mu$C là", "options": ["A. $2 \\cdot 10^{-3}$ N.", "B. $125$ N.", "C. $2 \\cdot 10^3$ N.", "D. $8 \\cdot 10^{-9}$ N."], "answer": "A", "explain": "$F = 4 \\cdot 10^{-6} \\cdot 500 = 2 \\cdot 10^{-3}$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai bản kim loại phẳng song song cách nhau $2$ cm, hiệu điện thế giữa hai bả
