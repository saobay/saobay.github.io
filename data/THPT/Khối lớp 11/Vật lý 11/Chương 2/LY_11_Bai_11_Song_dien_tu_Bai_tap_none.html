^8}{3 \\cdot 10^9} = 0{,}1$ m $= 10$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một radar phát sóng điện từ có $\\lambda = 3$ cm. Tần số của sóng là", "options": ["A. $10$ GHz.", "B. $9 \\cdot 10^6$ Hz.", "C. $0{,}1$ Hz.", "D. $10^6$ Hz."], "answer": "A", "explain": "$f = \\frac{3 \\cdot 10^8}{0{,}03} = 10^{10}$ Hz $= 10$ GHz.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai sóng điện từ có $\\lambda_1 = 400$ nm, $\\lambda_2 = 800$ nm. Tỉ số năng lượng $W_1/W_2$ bằng", "options": ["A. $16$.", "B. $4$.", "C. $2$.", "D. $1/16$."], "answer": "A", "explain": "$W \\sim f^4 \\sim 1/\\lambda^4$ nên $W_1/W_2 = (800/400)^4 = 16$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sóng điện từ truyền trong chân không với tốc độ $c$.", "b) Trong môi trường vật chất, tốc độ sóng điện từ nhỏ hơn $c$.", "c) $\\lambda = c/f$ trong chân không.", "d) Sóng điện từ là sóng dọc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: sóng điện từ là sóng ngang.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Sóng điện từ truyền từ chân không vào thủy tinh (chiết suất $n \\gt 1$). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tần số không đổi.", "b) Tốc độ truyền sóng giảm.", "c) Bước sóng giảm.", "d) Năng lượng sóng tăng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: năng lượng không tăng (một phần bị phản xạ, hấp thụ).", "points": 1}, {"type": "short", "level": "VD", "q": "Sóng vi ba trong lò vi sóng có $f = 2{,}45$ GHz. Bước sóng bằng bao nhiêu cm? (Làm tròn $1$ chữ số thập phân.)", "answer": "12.2", "explain": "$\\lambda = \\frac{3 \\cdot 10^8}{2{,}45 \\cdot 10^9} \\approx 0{,}1224$ m $\\approx 12{,}2$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai sóng điện từ có $f_1 = f_2/2$. Tỉ số năng lượng $W_1/W_2$ bằng bao nhiêu? (Làm tròn $4$ chữ số thập phân.)", "answer": "0.0625", "explain": "$W_1/W_2 = (1/2)^4 = 1/16 = 0{,}0625$.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tia tử ngoại có tác dụng", "options": ["A. diệt khuẩn.", "B. chụp X-quang.", "C. sưởi ấm.", "D. thông tin vô tuyến."], "answer": "A", "explain": "Tia tử ngoại có tác dụng diệt khuẩn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tia X có bước sóng cỡ", "options": ["A. $0{,}01$–$10$ nm.", "B. $380$–$760$ nm.", "C. lớn hơn $1$ mm.", "D. $10$–$380$ nm."], "answer": "A", "explain": "Tia X: $0{,}01$–$10$ nm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sắp xếp theo năng lượng tăng dần: tia hồng ngoại, tia tử ngoại, tia X.", "options": ["A. Hồng ngoại $\\lt$ tử ngoại $\\lt$ tia X.", "B. Tia X $\\lt$ tử ngoại $\\lt$ hồng ngoại.", "C. Tử ngoại $\\lt$ hồng ngoại $\\lt$ tia X.", "D. Cả ba có năng lượng bằng nhau."], "answer": "A", "explain": "$\\lambda$ giảm dần ⇒ $f$ tăng dần ⇒ năng lượng tăng dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sóng điện từ có $\\lambda = 500$ nm thuộc loại", "options": ["A. ánh sáng nhìn thấy.", "B. tia X.", "C. sóng vô tuyến.", "D. tia gamma."], "answer": "A", "explain": "$500$ nm nằm trong khoảng $380$–$760$ nm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sóng vô tuyến có $f = 90$ MHz. Bước sóng xấp xỉ", "options": ["A. $3{,}3$ m.", "B. $2{,}7 \\cdot 10^{16}$ m.", "C. $0{,}3$ m.", "D. $33$ m."], "answer": "A", "explain": "$\\lambda = \\frac{3 \\cdot 10^8}{9 \\cdot 10^7} \\approx 3{,}33$ m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một sóng điện từ truyền trong chân không: tại một điểm, $E = E_0/2$ và đang tăng. Khi đó $B$", "options": ["A. $B = B_0/2$ và đang tăng.", "B. $B = -B_0/2$.", "C. $B = B_0$.", "D. $B = 0$."], "answer": "A", "explain": "$\\vec{E}$ và $\\vec{B}$ luôn cùng pha nên biến thiên giống hệt nhau.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tia X có khả năng đâm xuyên mạnh.", "b) Tia gamma đâm xuyên mạnh hơn tia X.", "c) Tia hồng ngoại gây tác dụng nhiệt.", "d) Tia tử ngoại có bước sóng dài hơn ánh sáng nhìn thấy."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tia tử ngoại có $\\lambda$ ngắn hơn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Ba tia: hồng ngoại ($\\lambda = 1\\,\\mu$m), nhìn thấy ($\\lambda = 600$ nm), tử ngoại ($\\lambda = 300$ nm). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bước sóng giảm dần.", "b) Tần số tăng dần.", "c) Năng lượng tăng dần.", "d) Tốc độ trong chân không bằng nhau (đều bằng $c$)."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sóng vô tuyến có $f = 200$ MHz. Bước sóng bằng bao nhiêu mét? (Làm tròn $2$ chữ số thập phân.)", "answer": "1.5", "explain": "$\\lambda = \\frac{3 \\cdot 10^8}{2 \\cdot 10^8} = 1{,}5$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ánh sáng đỏ có $\\lambda = 700$ nm, tia tử ngoại có $\\lambda = 350$ nm. Tỉ số năng lượng $W_{tử\\ ngoại}/W_{đỏ}$ bằng bao nhiêu?", "answer": "16", "explain": "$W \\sim 1/\\lambda^4$ nên tỉ số $= (700/350)^4 = 16$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong sóng điện từ, vectơ $\\vec{E}$ và vectơ $\\vec{B}$", "options": ["A. dao động cùng pha.", "B. dao động ngược pha.", "C. dao động vuông pha.", "D. một trong hai luôn bằng $0$."], "answer": "A", "explain": "$\\vec{E}$ và $\\vec{B}$ luôn cùng pha.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng điện từ là sóng ngang vì", "options": ["A. $\\vec{E}$, $\\vec{B}$ vuông góc với phương truyền sóng.", "B. $\\vec{E}$, $\\vec{B}$ cùng phương với phương truyền sóng.", "C. sóng không có $\\vec{E}$, $\\vec{B}$.", "D. sóng truyền được trong chân không."], "answer": "A", "explain": "Sóng ngang là sóng có phương dao động vuông góc với phương truyền sóng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sóng điện từ có $\\lambda = 2$ m trong chân không. Tần số của sóng là", "options": ["A. $150$ MHz.", "B. $6 \\cdot 10^8$ Hz.", "C. $0{,}67$ Hz.", "D. $1{,}5$ Hz."], "answer": "A", "explain": "$f = \\frac{3 \\cdot 10^8}{2} = 1{,}5 \\cdot 10^8$ Hz $= 150$ MHz.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sóng điện từ có chu kì $T = 10^{-6}$ s. Bước sóng trong chân không là", "options": ["A. $300$ m.", "B. $3 \\cdot 10^{14}$ m.", "C. $3 \\cdot 10^{-14}$ m.", "D. $0{,}3$ m."], "answer": "A", "explain": "$\\lambda = cT = 3 \\cdot 10^8 \\cdot 10^{-6} = 300$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một đài phát thanh FM phát sóng có $f = 100$ MHz. Chu kì của sóng là", "options": ["A. $10^{-8}$ s.", "B. $10^8$ s.", "C. $3$ s.", "D. $10^{-2}$ s."], "answer": "A", "explain": "$T = 1/f = 10^{-8}$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một sóng điện từ truyền trong chân không có $E = E_0\\cos(\\omega t - kx)$. Tại những điểm có $kx = \\pi/2 + 2k\\pi$ (ở thời điểm $t = 0$), cảm ứng từ $B$ bằng", "options": ["A. $0$.", "B. $B_0$.", "C. $B_0/2$.", "D. $-B_0$."], "answer": "A", "explain": "Tại $t = 0$: $E = E_0\\cos(-\\pi/2 - 2k\\pi) = 0$; $B$ cùng pha với $E$ nên $B = 0$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\vec{E}$ và $\\vec{B}$ luôn dao động cùng pha.", "b) $\\vec{E}$, $\\vec{B}$ vuông góc với phương truyền sóng.", "c) Sóng điện từ mang năng lượng.", "d) Sóng điện từ truyền vật chất từ nguồn ra xa."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sóng điện từ có $E = E_0\\cos(\\omega t - kx)$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $B = B_0\\cos(\\omega t - kx)$.", "b) Khi $E$ cực đại thì $B$ cũng cực đại.", "c) Khi $E = 0$ thì $B = 0$.", "d) Đây là sóng dọc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đây là sóng ngang.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sóng điện từ có $\\lambda = 0{,}25$ m. Tần số của sóng bằng bao nhiêu MHz?", "answer": "1200", "explain": "$f = \\frac{3 \\cdot 10^8}{0{,}25} = 1{,}2 \\cdot 10^9$ Hz $= 1200$ MHz.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai sóng điện từ có $W_1 = 81W_2$. Tỉ số tần số $f_1/f_2$ bằng bao nhiêu?", "answer": "3", "explain": "$W \\sim f^4$ nên $f_1/f_2 = \\sqrt[4]{81} = 3$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Thang sóng điện từ được sắp xếp theo", "options": ["A. bước sóng (hoặc tần số).", "B. biên độ.", "C. tốc độ truyền sóng.", "D. năng lượng."], "answer": "A", "explain": "Thang sóng điện từ sắp xếp các loại sóng theo $\\lambda$ (hoặc $f$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng điện từ có bước sóng càng ngắn thì", "options": ["A. năng lượng càng lớn.", "B. năng lượng càng nhỏ.", "C. tốc độ truyền càng lớn.", "D. tốc độ truyền càng nhỏ."], "answer": "A", "explain": "$\\lambda$ ngắn ⇒ $f$ cao ⇒ năng lượng lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các tia: sóng vô tuyến, tia X, tia gamma, tia tử ngoại — tia có tần số nhỏ nhất là", "options": ["A. sóng vô tuyến.", "B. tia X.", "C. tia gamma.", "D. tia tử ngoại."], "answer": "A", "explain": "Sóng vô tuyến có $\\lambda$ dài nhất nên $f$ nhỏ nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các tia: sóng vô tuyến, tia hồng ngoại, ánh sáng nhìn thấy, tia gamma — tia có bước sóng nhỏ nhất là", "options": ["A. tia gamma.", "B. sóng vô tuyến.", "C. tia hồng ngoại.", "D. ánh sáng nhìn thấy."], "answer": "A", "explain": "Tia gamma có $\\lambda$ nhỏ nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tia hồng ngoại xa có $\\lambda = 1$ mm. Tần số của tia này là", "options": ["A. $300$ GHz.", "B. $3 \\cdot 10^5$ Hz.", "C. $3 \\cdot 10^{-3}$ Hz.", "D. $3 \\cdot 10^{17}$ Hz."], "answer": "A", "explain": "$f = \\frac{3 \\cdot 10^8}{10^{-3}} = 3 \\cdot 10^{11}$ Hz $= 300$ GHz.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một sóng điện từ có $E_0 = 6$ V/m, $B_0 = 2 \\cdot 10^{-8}$ T. Tỉ số $E_0/B_0$ bằng", "options": ["A. $3 \\cdot 10^8$ m/s.", "B. $340$ m/s.", "C. $12$ V·T/m.", "D. $3 \\cdot 10^{-8}$ m/s."], "answer": "A", "explain": "$E_0/B_0 = c = 3 \\cdot 10^8$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bước sóng càng ngắn thì năng lượng sóng điện từ càng lớn.", "b) Mọi sóng điện từ đều có tốc độ $c$ trong chân không.", "c) Sóng vô tuyến có bước sóng dài nhất trong thang sóng điện từ.", "d) Tia gamma có bước sóng dài nhất trong thang sóng điện từ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tia gamma có $\\lambda$ ngắn nhất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai sóng điện từ: $\\lambda_1 = 300$ nm, $\\lambda_2 = 600$ nm. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $f_1 = 2f_2$.", "b) $W_1 = 16W_2$.", "c) Cả hai đều là ánh sáng nhìn thấy.", "d) Cả hai đều truyền trong chân không với tốc độ $c$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: $(2)^4 = 16$. c) Sai: $300$ nm là tia tử ngoại. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sóng điện từ có $f = 6 \\cdot 10^{14}$ Hz. Chu kì của sóng bằng bao nhiêu lần $10^{-15}$ s? (Làm tròn $2$ chữ số thập phân.)", "answer": "1.67", "explain": "$T = 1/f \\approx 1{,}67 \\cdot 10^{-15}$ s, tức $1{,}67$ lần $10^{-15}$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Bước sóng của một sóng điện từ tăng gấp đôi thì năng lượng của nó giảm bao nhiêu lần?", "answer": "16", "explain": "$W \\sim 1/\\lambda^4$ nên giảm $2^4 = 16$ lần.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Sóng điện từ được ứng dụng trong", "options": ["A. thông tin liên lạc.", "B. truyền âm thanh trong nước.", "C. nâng vật nặng.", "D. đun nước bằng củi."], "answer": "A", "explain": "Sóng vô tuyến dùng trong thông tin liên lạc (radio, TV, điện thoại).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lò vi sóng dùng sóng", "options": ["A. vi ba (sóng điện từ).", "B. sóng âm.", "C. sóng cơ.", "D. tia gamma."], "answer": "A", "explain": "Lò vi sóng dùng sóng vi ba làm nóng thức ăn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điều khiển tivi từ xa dùng", "options": ["A. tia hồng ngoại.", "B. tia X.", "C. tia gamma.", "D. sóng âm."], "answer": "A", "explain": "Remote tivi dùng tia hồng ngoại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chụp X-quang y tế dùng", "options": ["A. tia X.", "B. tia hồng ngoại.", "C. sóng vô tuyến.", "D. ánh sáng nhìn thấy."], "answer": "A", "explain": "Tia X có khả năng đâm xuyên qua mô mềm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sóng điện từ có $\\lambda = 1$ mm. Sóng này thuộc loại", "options": ["A. ranh giới giữa hồng ngoại và vi ba (sóng vô tuyến).", "B. tia X.", "C. tia gamma.", "D. ánh sáng nhìn thấy."], "answer": "A", "explain": "$1$ mm là ranh giới giữa tia hồng ngoại và sóng vô tuyến (vi ba).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một anten thu sóng vô tuyến: để thu sóng tốt, chiều dài anten thường có cỡ", "options": ["A. $\\lambda/2$ (cỡ bước sóng).", "B. $\\lambda/100$.", "C. $100\\lambda$.", "D. không liên quan đến bước sóng."], "answer": "A", "explain": "Anten cộng hưởng tốt khi kích thước có cỡ bước sóng (thường $\\lambda/2$ hoặc $\\lambda/4$).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sóng vô tuyến dùng trong thông tin liên lạc.", "b) Tia hồng ngoại dùng trong điều khiển từ xa.", "c) Tia X dùng trong y tế.", "d) Tia gamma có năng lượng rất lớn."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sóng điện từ có $f = 10^{15}$ Hz. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\lambda = 300$ nm.", "b) Đây là tia tử ngoại.", "c) Năng lượng của nó lớn hơn năng lượng của ánh sáng nhìn thấy.", "d) Nó không truyền được trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\lambda = \\frac{3 \\cdot 10^8}{10^{15}} = 3 \\cdot 10^{-7}$ m $= 300$ nm. b) Đúng. c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sóng vô tuyến có $\\lambda = 10$ m. Tần số của sóng bằng bao nhiêu MHz? (Làm tròn $1$ chữ số thập phân.)", "answer": "30", "explain": "$f = \\frac{3 \\cdot 10^8}{10} = 3 \\cdot 10^7$ Hz $= 30$ MHz.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một sóng điện từ có bước sóng trong chân không là $0{,}5$ m; khi truyền vào môi trường có chiết suất $n = 1{,}5$ thì bước sóng bằng bao nhiêu mét? (Làm tròn $3$ chữ số thập phân.)", "answer": "0.333", "explain": "$\\lambda' = \\lambda/n = 0{,}5/1{,}5 \\approx 0{,}333$ m.", "points": 0.5}]}]}
