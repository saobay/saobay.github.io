ng của nguồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nguồn sóng dao động $100$ lần trong $20$ s. Tần số của sóng là", "options": ["A. $5$ Hz.", "B. $2000$ Hz.", "C. $0{,}2$ Hz.", "D. $120$ Hz."], "answer": "A", "explain": "$f = 100/20 = 5$ Hz.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sóng có $\\lambda = 3$ m, $v = 12$ m/s. Tần số của sóng là", "options": ["A. $4$ Hz.", "B. $36$ Hz.", "C. $0{,}25$ Hz.", "D. $9$ Hz."], "answer": "A", "explain": "$f = v/\\lambda = 12/3 = 4$ Hz.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm $M$ cách nguồn $d = 5\\lambda/6$ trên phương truyền sóng. $M$ trễ pha hơn nguồn một góc", "options": ["A. $5\\pi/3$ rad.", "B. $5\\pi/6$ rad.", "C. $2\\pi/3$ rad.", "D. $\\pi/3$ rad."], "answer": "A", "explain": "$\\Delta\\varphi = 2\\pi \\cdot \\frac{5}{6} = 5\\pi/3$ rad.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguồn $O$ có $u_O = 10\\cos\\left(2\\pi t + \\frac{\\pi}{4}\\right)$ (mm), sóng truyền với $v = 20$ m/s, $f = 50$ Hz. Phương trình sóng tại điểm $M$ cách $O$ $30$ cm là", "options": ["A. $u_M = 10\\cos\\left(2\\pi t + \\frac{3\\pi}{4}\\right)$ (mm).", "B. $u_M = 10\\cos\\left(2\\pi t + \\frac{\\pi}{4}\\right)$ (mm).", "C. $u_M = 10\\cos\\left(2\\pi t - \\frac{5\\pi}{4}\\right)$ (mm).", "D. $u_M = 10\\cos\\left(2\\pi t - \\frac{\\pi}{4}\\right)$ (mm)."], "answer": "A", "explain": "$\\lambda = v/f = 20/50 = 0{,}4$ m $= 40$ cm; $\\frac{2\\pi \\cdot 30}{40} = \\frac{3\\pi}{2}$; $u_M = 10\\cos(2\\pi t + \\pi/4 - 3\\pi/2) = 10\\cos(2\\pi t - 5\\pi/4) = 10\\cos(2\\pi t + 3\\pi/4)$ mm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tần số sóng bằng tần số của nguồn.", "b) $\\lambda = v/f$.", "c) $d = k\\lambda$: hai điểm dao động cùng pha.", "d) $d = (2k+1)\\lambda/2$: hai điểm dao động vuông pha."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ngược pha.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sóng có $v = 10$ m/s, $\\lambda = 2$ m. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $f = 5$ Hz.", "b) $T = 0{,}2$ s.", "c) Hai điểm cách nhau $5$ m dao động cùng pha.", "d) Hai điểm cách nhau $5$ m dao động ngược pha."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: $5$ m $= 2{,}5\\lambda$. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sóng âm có $T = 0{,}02$ s, $v = 340$ m/s. Bước sóng bằng bao nhiêu mét? (Làm tròn $2$ chữ số thập phân.)", "answer": "6.8", "explain": "$\\lambda = 340 \\cdot 0{,}02 = 6{,}8$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Quan sát thấy $11$ đỉnh sóng liên tiếp trong $2$ s; khoảng cách từ đỉnh đầu đến đỉnh cuối là $5$ m. Tốc độ truyền sóng bằng bao nhiêu m/s? (Làm tròn $2$ chữ số thập phân.)", "answer": "2.5", "explain": "$11$ đỉnh $= 10\\lambda = 5$ m $\\Rightarrow \\lambda = 0{,}5$ m; $10T = 2$ s $\\Rightarrow T = 0{,}2$ s; $v = 0{,}5/0{,}2 = 2{,}5$ m/s.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Khi sóng truyền đi, mỗi phần tử của môi trường", "options": ["A. dao động tại chỗ quanh vị trí cân bằng.", "B. chuyển động theo phương truyền sóng.", "C. đứng yên hoàn toàn.", "D. chuyển động tròn đều."], "answer": "A", "explain": "Phần tử môi trường chỉ dao động tại chỗ, sóng truyền pha dao động và năng lượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năng lượng của sóng", "options": ["A. được truyền đi theo sóng.", "B. không được truyền đi.", "C. bằng $0$.", "D. tăng dần theo khoảng cách."], "answer": "A", "explain": "Quá trình truyền sóng là quá trình truyền năng lượng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sóng truyền từ $O$ đến $M$ mất $0{,}5$ s, $OM = 2$ m. Tốc độ truyền sóng là", "options": ["A. $4$ m/s.", "B. $1$ m/s.", "C. $2{,}5$ m/s.", "D. $0{,}25$ m/s."], "answer": "A", "explain": "$v = 2/0{,}5 = 4$ m/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên phương truyền sóng, hai điểm cách nhau $d = 7\\lambda/4$ có độ lệch pha", "options": ["A. $7\\pi/2$ rad.", "B. $7\\pi/4$ rad.", "C. $\\pi/2$ rad.", "D. $3\\pi/2$ rad."], "answer": "A", "explain": "$\\Delta\\varphi = 2\\pi \\cdot \\frac{7}{4} = 7\\pi/2$ rad.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sóng có $\\lambda = 80$ cm. Khoảng cách gần nhất giữa hai điểm dao động cùng pha là", "options": ["A. $80$ cm.", "B. $40$ cm.", "C. $20$ cm.", "D. $160$ cm."], "answer": "A", "explain": "Hai điểm cùng pha gần nhất cách nhau $\\lambda = 80$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguồn $O$ có $u_O = 6\\cos(8\\pi t)$ (cm), sóng truyền với $v = 4$ m/s. Ở thời điểm $t = 0{,}25$ s, li độ tại điểm $M$ cách $O$ $1{,}5$ m là", "options": ["A. $-6$ cm.", "B. $6$ cm.", "C. $0$.", "D. $3$ cm."], "answer": "A", "explain": "$\\lambda = vT = 4 \\cdot 0{,}25 = 1$ m; $\\frac{2\\pi \\cdot 1{,}5}{1} = 3\\pi$; $u_M = 6\\cos(8\\pi \\cdot 0{,}25 - 3\\pi) = 6\\cos(-\\pi) = -6$ cm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sóng truyền pha dao động từ nguồn ra xa.", "b) Sóng truyền năng lượng từ nguồn ra xa.", "c) Mỗi phần tử môi trường dao động tại chỗ.", "d) Phần tử môi trường bị sóng cuốn đi xa khỏi nguồn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: sóng không truyền vật chất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một nguồn sóng: $u_O = 5\\cos(10\\pi t)$ (cm), $v = 2$ m/s. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\lambda = 0{,}4$ m.", "b) $f = 5$ Hz.", "c) Tại $M$ cách $O$ $60$ cm: $u_M = 5\\cos(10\\pi t - 3\\pi)$ (cm).", "d) $M$ dao động ngược pha với $O$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $\\lambda = 2 \\cdot 0{,}2 = 0{,}4$ m. b) Đúng. c) Đúng: $\\frac{2\\pi \\cdot 60}{40} = 3\\pi$. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong $10$ s, một chiếc phao trên mặt biển nhô lên $25$ lần. Chu kì của sóng biển bằng bao nhiêu giây? (Làm tròn $3$ chữ số thập phân.)", "answer": "0.417", "explain": "$25$ lần nhô lên $= 24T = 10$ s $\\Rightarrow T = 10/24 \\approx 0{,}417$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguồn $O$ có $u_O = 4\\cos(\\pi t)$ (cm), sóng truyền với $v = 2$ m/s. Khoảng cách gần nhất từ $O$ đến điểm dao động ngược pha với $O$ bằng bao nhiêu mét?", "answer": "2", "explain": "$\\lambda = vT = 2 \\cdot 2 = 4$ m; điểm ngược pha gần nhất cách $O$ $\\lambda/2 = 2$ m.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Bước sóng còn được định nghĩa là", "options": ["A. khoảng cách giữa hai điểm gần nhau nhất dao động cùng pha.", "B. khoảng cách giữa đỉnh sóng và hõm sóng.", "C. quãng đường sóng truyền được trong một giây.", "D. khoảng cách từ nguồn đến điểm xa nhất mà sóng tới được."], "answer": "A", "explain": "Định nghĩa tương đương của bước sóng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn vị của bước sóng là", "options": ["A. mét (m).", "B. héc (Hz).", "C. giây (s).", "D. mét trên giây (m/s)."], "answer": "A", "explain": "Bước sóng là độ dài nên đơn vị là mét.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sóng âm có $v = 340$ m/s, $T = 0{,}01$ s. Bước sóng là", "options": ["A. $3{,}4$ m.", "B. $34$ m.", "C. $0{,}34$ m.", "D. $3400$ m."], "answer": "A", "explain": "$\\lambda = 340 \\cdot 0{,}01 = 3{,}4$ m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai điểm dao động ngược pha gần nhau nhất cách nhau $15$ cm. Bước sóng là", "options": ["A. $30$ cm.", "B. $15$ cm.", "C. $60$ cm.", "D. $7{,}5$ cm."], "answer": "A", "explain": "Hai điểm ngược pha gần nhất cách nhau $\\lambda/2 = 15$ cm $\\Rightarrow \\lambda = 30$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một âm thoa phát ra âm có tần số $f = 440$ Hz, tốc độ truyền âm trong không khí là $340$ m/s. Bước sóng của âm này xấp xỉ", "options": ["A. $0{,}77$ m.", "B. $1{,}29$ m.", "C. $149600$ m.", "D. $7{,}7$ m."], "answer": "A", "explain": "$\\lambda = 340/440 \\approx 0{,}77$ m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguồn $O$ có $u_O = 7\\cos\\left(6\\pi t - \\frac{\\pi}{2}\\right)$ (mm), sóng truyền với $v = 3$ m/s. Phương trình sóng tại điểm $M$ cách $O$ $1{,}25$ m là", "options": ["A. $u_M = -7\\cos(6\\pi t)$ (mm).", "B. $u_M = 7\\cos\\left(6\\pi t - \\frac{\\pi}{2}\\right)$ (mm).", "C. $u_M = 7\\cos(6\\pi t + \\pi)$ (mm).", "D. $u_M = 7\\cos(6\\pi t - 3\\pi)$ (mm)."], "answer": "A", "explain": "$\\lambda = vT = 3 \\cdot \\frac{1}{3} = 1$ m; $\\frac{2\\pi \\cdot 1{,}25}{1} = 2{,}5\\pi$; $u_M = 7\\cos(6\\pi t - \\pi/2 - 5\\pi/2) = 7\\cos(6\\pi t - 3\\pi) = -7\\cos(6\\pi t)$ mm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bước sóng có đơn vị là mét.", "b) Chu kì có đơn vị là giây.", "c) Tần số có đơn vị là héc.", "d) Tốc độ truyền sóng có đơn vị là m/s²."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đơn vị là m/s.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Sóng âm trong không khí: $v = 340$ m/s, $f = 170$ Hz. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\lambda = 2$ m.", "b) $T \\approx 0{,}0059$ s.", "c) Hai điểm cách nhau $1$ m dao động ngược pha.", "d) Hai điểm cách nhau $3$ m dao động cùng pha."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\lambda = 340/170 = 2$ m. b) Đúng. c) Đúng: $1$ m $= \\lambda/2$. d) Sai: $3$ m $= 1{,}5\\lambda$ ⇒ ngược pha.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sóng có $\\lambda = 1{,}2$ m, $f = 250$ Hz. Tốc độ truyền sóng bằng bao nhiêu m/s?", "answer": "300", "explain": "$v = 1{,}2 \\cdot 250 = 300$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điểm $M$ trên phương truyền sóng trễ pha hơn nguồn một góc $5\\pi/3$. Khoảng cách $OM$ bằng bao nhiêu lần bước sóng $\\lambda$? (Làm tròn $3$ chữ số thập phân.)", "answer": "0.833", "explain": "$\\frac{2\\pi \\cdot OM}{\\lambda} = \\frac{5\\pi}{3} \\Rightarrow \\frac{OM}{\\lambda} = \\frac{5}{6} \\approx 0{,}833$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Sóng truyền trên mặt nước là", "options": ["A. sóng ngang.", "B. sóng dọc.", "C. sóng điện từ.", "D. không phải sóng cơ."], "answer": "A", "explain": "Sóng mặt nước là sóng ngang (phần tử dao động lên xuống, sóng truyền ngang).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng âm truyền trong không khí là", "options": ["A. sóng dọc.", "B. sóng ngang.", "C. sóng điện từ.", "D. sóng dừng."], "answer": "A", "explain": "Sóng âm là sóng dọc (nén–dãn theo phương truyền).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sóng có $\\lambda = 4$ m, trong $1$ phút truyền được $600$ m. Tần số của sóng là", "options": ["A. $2{,}5$ Hz.", "B. $150$ Hz.", "C. $2400$ Hz.", "D. $0{,}4$ Hz."], "answer": "A", "explain": "$v = 600/60 = 10$ m/s; $f = v/\\lambda = 10/4 = 2{,}5$ Hz.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên phương truyền sóng, hai điểm cách nhau $d = 9\\lambda/2$ dao động", "options": ["A. ngược pha.", "B. cùng pha.", "C. vuông pha.", "D. lệch pha $\\pi/4$."], "answer": "A", "explain": "$d = 9\\frac{\\lambda}{2}$: dạng $(2k+1)\\frac{\\lambda}{2}$ với $k = 4$ ⇒ ngược pha.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguồn $O$ dao động với $f = 20$ Hz, sóng truyền với $v = 4$ m/s. Điểm $M$ cách $O$ $15$ cm dao động", "options": ["A. vuông pha và trễ pha hơn $O$.", "B. cùng pha với $O$.", "C. ngược pha với $O$.", "D. cùng pha và sớm pha hơn $O$."], "answer": "A", "explain": "$\\lambda = 4/20 = 0{,}2$ m $= 20$ cm; $d = 15$ cm $= 3\\lambda/4$ ⇒ vuông pha, $M$ trễ pha hơn $O$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguồn $O$ có $u_O = 9\\cos(2\\pi t)$ (cm), sóng truyền với $v = 6$ m/s. Khoảng cách từ $O$ đến điểm $N$ gần nhất (khác $O$) dao động cùng pha với $O$ là", "options": ["A. $3$ m.", "B. $1{,}5$ m.", "C. $6$ m.", "D. $0{,}75$ m."], "answer": "C", "explain": "$T = 1$ s; $\\lambda = vT = 6 \\cdot 1 = 6$ m; điểm cùng pha gần nhất cách $O$ $\\lambda = 6$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sóng mặt nước là sóng ngang.", "b) Sóng âm là sóng dọc.", "c) Sóng trên dây đàn là sóng ngang.", "d) Sóng dọc truyền được trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: sóng dọc là sóng cơ, không truyền được trong chân không.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sóng cơ: $v = 8$ m/s, $f = 40$ Hz. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\lambda = 0{,}2$ m.", "b) Hai điểm cách nhau $5$ cm dao động vuông pha.", "c) Hai điểm cách nhau $30$ cm dao động ngược pha.", "d) Điểm cách nguồn $40$ cm dao động cùng pha với nguồn."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $\\lambda = 8/40 = 0{,}2$ m. b) Đúng: $5$ cm $= \\lambda/4$. c) Đúng: $30$ cm $= 1{,}5\\lambda$. d) Đúng: $40$ cm $= 2\\lambda$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sóng điện từ (ánh sáng) có tần số $f = 6 \\cdot 10^{14}$ Hz. Bước sóng bằng bao nhiêu nm? ($c = 3 \\cdot 10^8$ m/s.)", "answer": "500", "explain": "$\\lambda = c/f = \\frac{3 \\cdot 10^8}{6 \\cdot 10^{14}} = 5 \\cdot 10^{-7}$ m $= 500$ nm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguồn $O$ có $u_O = 3\\cos\\left(4\\pi t + \\frac{\\pi}{6}\\right)$ (cm), sóng truyền với $v = 2$ m/s. Li độ tại điểm $M$ cách $O$ $75$ cm ở thời điểm $t = 1$ s bằng bao nhiêu cm? (Làm tròn $2$ chữ số thập phân.)", "answer": "-1.5", "explain": "$\\lambda = vT = 2 \\cdot 0{,}5 = 1$ m; $\\frac{2\\pi \\cdot 0{,}75}{1} = 1{,}5\\pi$; $u_M = 3\\cos(4\\pi + \\pi/6 - 3\\pi/2) = 3\\cos(8\\pi/3) = 3 \\cdot (-0{,}5) = -1{,}5$ cm.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Phương trình sóng tại điểm $M$ cách nguồn $O$ một khoảng $x$ (sóng truyền từ $O$ đến $M$) là", "options": ["A. $u_M = A\\cos\\left(\\omega t - \\frac{2\\pi x}{\\lambda}\\right)$.", "B. $u_M = A\\cos\\left(\\omega t + \\frac{2\\pi x}{\\lambda}\\right)$.", "C. $u_M = A\\cos(\\omega t) - \\frac{2\\pi x}{\\lambda}$.", "D. $u_M = A\\cos(\\omega t) \\cdot x$."], "answer": "A", "explain": "Điểm $M$ trễ pha hơn $O$ một góc $2\\pi x/\\lambda$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu $-$ trong biểu thức $\\left(\\omega t - \\frac{2\\pi x}{\\lambda}\\right)$ thể hiện", "options": ["A. $M$ trễ pha hơn $O$.", "B. $M$ sớm pha hơn $O$.", "C. $M$ cùng pha với $O$.", "D. $M$ ngược pha với $O$."], "answer": "A", "explain": "Sóng truyền từ $O$ đến $M$ nên $M$ dao động trễ pha hơn $O$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sóng có $A = 5$ cm, $\\lambda = 100$ cm. Biên độ dao động tại điểm $M$ cách nguồn $25$ cm là", "options": ["A. $5$ cm.", "B. $2{,}5$ cm.", "C. $0$.", "D. $10$ cm."], "answer": "A", "explain": "Trong môi trường lý tưởng, biên độ sóng không đổi theo khoảng cách: vẫn là $5$ cm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên phương truyền sóng, hai điểm cách nhau $d = \\lambda/6$ có độ lệch pha", "options": ["A. $\\pi/3$ rad.", "B. $\\pi/6$ rad.", "C. $2\\pi/3$ rad.", "D. $\\pi/2$ rad."], "answer": "A", "explain": "$\\Delta\\varphi = 2\\pi \\cdot \\frac{1}{6} = \\pi/3$ rad.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sóng truyền với $v = 5$ m/s; mỗi giây có $10$ đỉnh sóng đi qua một điểm cố định. Bước sóng là", "options": ["A. $0{,}5$ m.", "B. $50$ m.", "C. $2$ m.", "D. $0{,}05$ m."], "answer": "A", "explain": "$f = 10$ Hz; $\\lambda = v/f = 5/10 = 0{,}5$ m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguồn $O$ có $u_O = 12\\cos(\\pi t)$ (mm), sóng truyền với $v = 4$ m/s. Điểm $M$ cách $O$ $6$ m trễ pha hơn $O$ một góc", "options": ["A. $3\\pi/2$ rad.", "B. $3\\pi/4$ rad.", "C. $\\pi/2$ rad.", "D. $2\\pi$ rad."], "answer": "A", "explain": "$T = 2$ s; $\\lambda = vT = 4 \\cdot 2 = 8$ m; $\\Delta\\varphi = \\frac{2\\pi \\cdot 6}{8} = \\frac{3\\pi}{2}$ rad.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $u_M = A\\cos\\left(\\omega t - \\frac{2\\pi x}{\\lambda}\\right)$ khi sóng truyền từ $O$ đến $M$.", "b) Càng xa nguồn, pha dao động càng trễ.", "c) Trong môi trường lý tưởng, biên độ sóng không đổi theo khoảng cách.", "d) Tần số sóng thay đổi khi sóng truyền từ môi trường này sang môi trường khác."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tần số không đổi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Nguồn $O$ có $u_O = 6\\cos\\left(2\\pi t + \\frac{\\pi}{3}\\right)$ (cm), sóng truyền với $v = 12$ m/s, $f = 6$ Hz. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\lambda = 2$ m.", "b) Tại $M$ cách $O$ $50$ cm: $u_M = 6\\cos\\left(2\\pi t + \\frac{\\pi}{3} - \\frac{\\pi}{2}\\right)$ (cm).", "c) $M$ trễ pha $\\pi/2$ so với $O$.", "d) Tại $N$ cách $O$ $1$ m: $N$ dao động ngược pha với $O$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $\\lambda = 12/6 = 2$ m. b) Đúng: $\\frac{2\\pi \\cdot 0{,}5}{2} = \\pi/2$. c) Đúng. d) Đúng: $1$ m $= \\lambda/2$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sóng có $\\lambda = 25$ cm. Khoảng cách giữa $5$ đỉnh sóng liên tiếp bằng bao nhiêu cm?", "answer": "100", "explain": "$5$ đỉnh liên tiếp $= 4\\lambda = 100$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một sóng truyền từ $A$ đến $B$ mất $0{,}2$ s, $AB = 50$ cm, $f = 10$ Hz. Bước sóng bằng bao nhiêu cm?", "answer": "25", "explain": "$v = 50/0{,}2 = 250$ cm/s; $\\lambda = v/f = 250/10 = 25$ cm.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Khi sóng t 0 \\cdot 0{,}2 = 2$ m; $\\frac{2\\pi \\cdot 1{,}75}{2} = \\frac{7\\pi}{4}$; $u_M = 5\\cos(10\\pi t + \\pi/4 - 7\\pi/4) = 5\\cos(10\\pi t - 3\\pi/2) = 5\\cos(10\\pi t + \\pi/2)$ cm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sóng cơ không truyền được trong chân không.", "b) Sóng điện từ truyền được trong chân không.", "c) Tốc độ truyền sóng chỉ phụ thuộc vào môi trường.", "d) Bước sóng không đổi khi sóng truyền từ môi trường này sang môi trường khác."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $\\lambda = v/f$ thay đổi theo $v$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sóng âm trong không khí: $f = 25$ Hz, $\\lambda = 13{,}6$ m. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v = 340$ m/s.", "b) $T = 0{,}04$ s.", "c) Hai điểm cách nhau $6{,}8$ m dao động ngược pha.", "d) Hai điểm cách nhau $20{,}4$ m dao động cùng pha."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $v = 13{,}6 \\cdot 25 = 340$ m/s. b) Đúng. c) Đúng: $6{,}8$ m $= \\lambda/2$. d) Sai: $20{,}4$ m $= 1{,}5\\lambda$ ⇒ ngược pha.", "points": 1}, {"type": "short", "level": "VD", "q": "Một người quan sát thấy $6$ gợn sóng liên tiếp cách nhau $10$ m (khoảng cách từ gợn đầu đến gợn cuối); thời gian giữa hai lần liên tiếp một gợn sóng đi qua chiếc phao là $2$ s. Tốc độ truyền sóng bằng bao nhiêu m/s?", "answer": "1", "explain": "$6$ gợn $= 5\\lambda = 10$ m $\\Rightarrow \\lambda = 2$ m; $T = 2$ s; $v = 1$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguồn $O$ có $u_O = A\\cos(20\\pi t)$ (cm), sóng truyền với $v = 40$ m/s. Điểm $M$ cách $O$ $3$ m dao động trễ pha hơn $O$ bao nhiêu rad? (Lấy $\\pi = 3{,}14$; làm tròn $2$ chữ số thập phân.)", "answer": "4.71", "explain": "$T = 0{,}1$ s; $\\lambda = 40 \\cdot 0{,}1 = 4$ m; $\\Delta\\varphi = \\frac{2\\pi \\cdot 3}{4} = 1{,}5\\pi \\approx 4{,}71$ rad.", "points": 0.5}]}]}
