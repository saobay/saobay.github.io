k+1)\\lambda/2$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai nguồn cùng pha, $\\lambda = 3$ cm, $S_1S_2 = 20$ cm. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số điểm cực đại trên đoạn $S_1S_2$ là $13$.", "b) Số điểm cực tiểu trên đoạn $S_1S_2$ là $14$.", "c) Trung điểm của $S_1S_2$ là cực đại.", "d) Điểm trên đoạn $S_1S_2$ cách $S_1$ $4$ cm là cực đại."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $-6{,}67 \\lt k \\lt 6{,}67$ ⇒ $13$ điểm. b) Đúng: $-7{,}17 \\lt k \\lt 6{,}17 \\Rightarrow k = -7, \\dots, 6$ ⇒ $14$ điểm. c) Đúng. d) Đúng: $d_2 - d_1 = 12 = 4\\lambda$.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai nguồn cùng pha, $\\lambda = 8$ cm. Điểm $M$ có $d_2 - d_1 = 20$ cm. $M$ là cực tiểu thứ mấy (tính từ đường trung trực)?", "answer": "3", "explain": "$20 = (2k+1) \\cdot 4 \\Rightarrow 2k + 1 = 5 \\Rightarrow k = 2$ ⇒ cực tiểu thứ $3$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai nguồn cùng pha, $S_1S_2 = 28$ cm, $\\lambda = 5$ cm. Số điểm cực đại trên đoạn $S_1S_2$ bằng bao nhiêu?", "answer": "11", "explain": "$-5{,}6 \\lt k \\lt 5{,}6$: $k = -5, \\dots, 5$ ⇒ $11$ điểm.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Sóng dừng được tạo thành do", "options": ["A. sự giao thoa của sóng tới và sóng phản xạ.", "B. hai nguồn sóng kết hợp.", "C. sự tắt dần của sóng.", "D. sự khúc xạ của sóng."], "answer": "A", "explain": "Định nghĩa sóng dừng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nút sóng là", "options": ["A. điểm luôn đứng yên.", "B. điểm dao động với biên độ cực đại.", "C. điểm có biên độ cực đại.", "D. điểm đặt nguồn sóng."], "answer": "A", "explain": "Nút sóng luôn đứng yên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điều kiện có sóng dừng trên dây hai đầu cố định là", "options": ["A. $l = k\\frac{\\lambda}{2}$.", "B. $l = (2k+1)\\frac{\\lambda}{4}$.", "C. $l = k\\lambda$.", "D. $l = (2k+1)\\frac{\\lambda}{2}$."], "answer": "A", "explain": "Hai đầu cố định đều là nút.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sợi dây hai đầu cố định, $l = 100$ cm, có sóng dừng với $5$ bụng sóng. Bước sóng là", "options": ["A. $40$ cm.", "B. $20$ cm.", "C. $100$ cm.", "D. $50$ cm."], "answer": "A", "explain": "$100 = 5 \\cdot \\frac{\\lambda}{2} \\Rightarrow \\lambda = 40$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sợi dây một đầu cố định, một đầu tự do, $l = 60$ cm, có sóng dừng với $3$ bụng sóng. Bước sóng là", "options": ["A. $48$ cm.", "B. $40$ cm.", "C. $30$ cm.", "D. $80$ cm."], "answer": "A", "explain": "Số bụng $= k + 1 = 3 \\Rightarrow k = 2$; $l = \\frac{5\\lambda}{4} = 60 \\Rightarrow \\lambda = 48$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một sợi dây hai đầu cố định, $l = 2$ m, $v = 40$ m/s, $f = 50$ Hz. Số bụng sóng trên dây là", "options": ["A. $5$.", "B. $2{,}5$.", "C. $10$.", "D. $4$."], "answer": "A", "explain": "$\\lambda = 40/50 = 0{,}8$ m; $k = \\frac{2 \\cdot 2}{0{,}8} = 5$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đầu cố định của dây là nút sóng.", "b) Đầu tự do của dây là bụng sóng.", "c) Hai nút sóng liên tiếp cách nhau $\\lambda/2$.", "d) Hai bụng sóng liên tiếp cách nhau $\\lambda/4$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: là $\\lambda/2$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sợi dây hai đầu cố định, $l = 90$ cm, $\\lambda = 30$ cm. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số bụng sóng là $6$.", "b) Số nút sóng là $7$.", "c) Mỗi bó sóng dài $15$ cm.", "d) Một nút và một bụng liên tiếp cách nhau $7{,}5$ cm."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $90 = k \\cdot 15 \\Rightarrow k = 6$. b) Đúng. c) Đúng: $\\lambda/2 = 15$ cm. d) Đúng: $\\lambda/4 = 7{,}5$ cm.", "points": 1}, {"type": "short", "level": "VD", "q": "Trên một sợi dây có sóng dừng, khoảng cách giữa $6$ nút sóng liên tiếp là $50$ cm. Bước sóng bằng bao nhiêu cm?", "answer": "20", "explain": "$6$ nút $= 5$ khoảng $\\lambda/2 = 50$ cm $\\Rightarrow \\lambda = 20$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một sợi dây hai đầu cố định, $l = 1{,}5$ m, $v = 30$ m/s. Tần số âm cơ bản bằng bao nhiêu Hz?", "answer": "10", "explain": "$f_1 = \\frac{30}{2 \\cdot 1{,}5} = 10$ Hz.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Đại lượng nào sau đây của sóng không đổi khi sóng truyền từ môi trường này sang môi trường khác?", "options": ["A. Tần số.", "B. Bước sóng.", "C. Tốc độ truyền sóng.", "D. Biên độ."], "answer": "A", "explain": "Tần số của sóng bằng tần số nguồn nên không đổi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng cơ không truyền được trong", "options": ["A. chân không.", "B. chất rắn.", "C. chất lỏng.", "D. chất khí."], "answer": "A", "explain": "Sóng cơ cần môi trường vật chất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sóng truyền với $v = 12$ m/s; trong $5$ s, sóng truyền được quãng đường", "options": ["A. $60$ m.", "B. $2{,}4$ m.", "C. $17$ m.", "D. $7$ m."], "answer": "A", "explain": "$s = 12 \\cdot 5 = 60$ m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sóng có $\\lambda = 2{,}5$ m, $f = 4$ Hz. Tốc độ truyền sóng là", "options": ["A. $10$ m/s.", "B. $0{,}625$ m/s.", "C. $6{,}5$ m/s.", "D. $1{,}6$ m/s."], "answer": "A", "explain": "$v = 2{,}5 \\cdot 4 = 10$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai nguồn cùng pha, $\\lambda = 7$ cm. Điểm $M$ có $d_2 - d_1 = 17{,}5$ cm. Điểm $M$ là", "options": ["A. cực tiểu.", "B. cực đại.", "C. cực đại bậc $2$.", "D. cực tiểu bậc $2$."], "answer": "A", "explain": "$17{,}5 = 2{,}5\\lambda$ ⇒ cực tiểu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một sợi dây một đầu cố định, một đầu tự do, $l = 75$ cm, $v = 15$ m/s. Tần số nhỏ nhất để có sóng dừng trên dây là", "options": ["A. $5$ Hz.", "B. $10$ Hz.", "C. $15$ Hz.", "D. $2{,}5$ Hz."], "answer": "A", "explain": "$f_{\\min} = \\frac{v}{4l} = \\frac{15}{3} = 5$ Hz.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sóng điện từ truyền được trong chân không.", "b) Sóng cơ cần môi trường vật chất để truyền.", "c) Sóng âm là sóng dọc.", "d) Sóng ánh sáng là sóng cơ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ánh sáng là sóng điện từ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sóng điện từ có $f = 2 \\cdot 10^{14}$ Hz. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\lambda = 1{,}5\\,\\mu$m.", "b) Đây là tia hồng ngoại.", "c) Năng lượng sóng tỉ lệ với $f^4$.", "d) $\\vec{E}$ và $\\vec{B}$ dao động ngược pha."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\lambda = \\frac{3 \\cdot 10^8}{2 \\cdot 10^{14}} = 1{,}5 \\cdot 10^{-6}$ m. b) Đúng. c) Đúng. d) Sai: cùng pha.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sóng có $\\lambda = 4$ m, $v = 20$ m/s. Tần số của sóng bằng bao nhiêu Hz?", "answer": "5", "explain": "$f = 20/4 = 5$ Hz.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai nguồn cùng pha, $S_1S_2 = 35$ cm, $\\lambda = 8$ cm. Số điểm cực tiểu trên đoạn $S_1S_2$ bằng bao nhiêu?", "answer": "8", "explain": "$-35/8 - 0{,}5 \\lt k \\lt 35/8 - 0{,}5 \\Rightarrow -4{,}875 \\lt k \\lt 3{,}875$: $k = -4, \\dots, 3$ ⇒ $8$ điểm.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Bước sóng là", "options": ["A. quãng đường sóng truyền được trong một chu kì.", "B. khoảng cách giữa đỉnh sóng và hõm sóng.", "C. quãng đường sóng truyền được trong một giây.", "D. khoảng cách từ nguồn đến điểm xa nhất."], "answer": "A", "explain": "$\\lambda = vT$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng dọc truyền được trong", "options": ["A. chất rắn, chất lỏng và chất khí.", "B. chân không.", "C. chỉ chất rắn.", "D. chỉ chất khí."], "answer": "A", "explain": "Sóng dọc truyền được trong cả ba môi trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sóng âm có $f = 60$ Hz, $\\lambda = 5{,}5$ m. Tốc độ truyền âm là", "options": ["A. $330$ m/s.", "B. $0{,}09$ m/s.", "C. $65{,}5$ m/s.", "D. $10{,}9$ m/s."], "answer": "A", "explain": "$v = 60 \\cdot 5{,}5 = 330$ m/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên phương truyền sóng, hai điểm cách nhau $d = 5\\lambda/6$ có độ lệch pha", "options": ["A. $5\\pi/3$ rad.", "B. $5\\pi/6$ rad.", "C. $2\\pi/3$ rad.", "D. $\\pi/3$ rad."], "answer": "A", "explain": "$\\Delta\\varphi = 2\\pi \\cdot \\frac{5}{6} = 5\\pi/3$ rad.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sóng điện từ có $\\lambda = 600$ nm. Tần số của sóng là", "options": ["A. $5 \\cdot 10^{14}$ Hz.", "B. $1{,}8 \\cdot 10^{17}$ Hz.", "C. $2 \\cdot 10^{-6}$ Hz.", "D. $5 \\cdot 10^{11}$ Hz."], "answer": "A", "explain": "$f = \\frac{3 \\cdot 10^8}{6 \\cdot 10^{-7}} = 5 \\cdot 10^{14}$ Hz.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguồn $O$ có $u_O = 6\\cos\\left(4\\pi t + \\frac{\\pi}{6}\\right)$ (cm), sóng truyền với $v = 8$ m/s. Phương trình sóng tại điểm $M$ cách $O$ $3$ m là", "options": ["A. $u_M = 6\\cos\\left(4\\pi t + \\frac{2\\pi}{3}\\right)$ (cm).", "B. $u_M = 6\\cos\\left(4\\pi t + \\frac{\\pi}{6}\\right)$ (cm).", "C. $u_M = 6\\cos\\left(4\\pi t - \\frac{4\\pi}{3}\\right)$ (cm).", "D. $u_M = 6\\cos\\left(4\\pi t - \\frac{\\pi}{3}\\right)$ (cm)."], "answer": "A", "explain": "$T = 0{,}5$ s; $\\lambda = 4$ m; $\\frac{2\\pi \\cdot 3}{4} = 1{,}5\\pi$; $u_M = 6\\cos(4\\pi t + \\pi/6 - 3\\pi/2) = 6\\cos(4\\pi t - 4\\pi/3) = 6\\cos(4\\pi t + 2\\pi/3)$ cm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\lambda = v/f$.", "b) $\\Delta\\varphi = 2\\pi d/\\lambda$.", "c) $d = k\\lambda$: hai điểm dao động cùng pha.", "d) $d = (2k+1)\\lambda/2$: hai điểm dao động cùng pha."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ngược pha.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sợi dây hai đầu cố định, $l = 120$ cm, có sóng dừng với $6$ bụng. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\lambda = 40$ cm.", "b) Số nút sóng là $7$.", "c) Với $v = 20$ m/s: $f = 50$ Hz.", "d) Khoảng cách giữa một nút và một bụng liên tiếp là $10$ cm."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $120 = 6 \\cdot \\lambda/2$. b) Đúng. c) Đúng: $f = 20/0{,}4 = 50$ Hz. d) Đúng: $\\lambda/4 = 10$ cm.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai nguồn cùng pha, $\\lambda = 6$ cm, $S_1S_2 = 30$ cm. Số điểm cực đại trên đoạn $S_1S_2$ bằng bao nhiêu?", "answer": "9", "explain": "$-5 \\lt k \\lt 5$: $k = -4, \\dots, 4$ ⇒ $9$ điểm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sóng dừng trên dây hai đầu cố định: $l = 90$ cm, $f = 60$ Hz, $v = 36$ m/s. Số bụng sóng bằng bao nhiêu?", "answer": "3", "explain": "$\\lambda = 36/60 = 0{,}6$ m $= 60$ cm; $k = 90/30 = 3$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phương trình sóng tại điểm $M$ cách nguồn $O$ một khoảng $x$ (sóng truyền từ $O$ đến $M$) là", "options": ["A. $u_M = A\\cos\\left(\\omega t - \\frac{2\\pi x}{\\lambda}\\right)$.", "B. $u_M = A\\cos\\left(\\omega t + \\frac{2\\pi x}{\\lambda}\\right)$.", "C. $u_M = A\\cos(\\omega t) - \\frac{2\\pi x}{\\lambda}$.", "D. $u_M = A\\cos(\\omega t) \\cdot x$."], "answer": "A", "explain": "$M$ trễ pha hơn $O$ một góc $2\\pi x/\\lambda$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng âm là", "options": ["A. sóng cơ.", "B. sóng điện từ.", "C. sóng ngang.", "D. sóng dừng."], "answer": "A", "explain": "Sóng âm là sóng cơ (sóng dọc).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguồn $O$ có $u_O = 3\\cos(\\pi t)$ (cm), sóng truyền với $v = 6$ m/s. Bước sóng là", "options": ["A. $12$ m.", "B. $18{,}8$ m.", "C. $2$ m.", "D. $0{,}52$ m."], "answer": "A", "explain": "$T = 2$ s; $\\lambda = 6 \\cdot 2 = 12$ m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Với sóng ở câu trên, điểm $M$ cách $O$ $9$ m trễ pha hơn $O$ một góc", "options": ["A. $3\\pi/2$ rad.", "B. $3\\pi/4$ rad.", "C. $\\pi/2$ rad.", "D. $2\\pi$ rad."], "answer": "A", "explain": "$\\Delta\\varphi = \\frac{2\\pi \\cdot 9}{12} = \\frac{3\\pi}{2}$ rad.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai nguồn ngược pha, $\\lambda = 8$ cm. Điểm $M$ có $d_2 - d_1 = 20$ cm. Điểm $M$ là", "options": ["A. cực đại.", "B. cực tiểu.", "C. cực đại bậc $2$.", "D. không dao động."], "answer": "A", "explain": "$20 = 2{,}5\\lambda$ (cùng pha thì cực tiểu) ⇒ với hai nguồn ngược pha là cực đại.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sợi dây $AB$ hai đầu cố định, $l = 1{,}2$ m, $v = 24$ m/s, $f = 70$ Hz. Số bụng sóng trên dây là", "options": ["A. $7$.", "B. $3{,}5$.", "C. $14$.", "D. Không có sóng dừng."], "answer": "A", "explain": "$\\lambda = 24/70 \\approx 0{,}3429$ m; $k = \\frac{1{,}2}{0{,}1714} = 7$: có sóng dừng với $7$ bụng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sóng tại $M$ trễ pha hơn sóng tại nguồn $O$.", "b) Sóng âm cần môi trường vật chất để truyền.", "c) Sóng điện từ không cần môi trường vật chất để truyền.", "d) Mọi sóng đều là sóng cơ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: sóng điện từ không phải sóng cơ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai nguồn ngược pha, $\\lambda = 5$ cm, $S_1S_2 = 22$ cm. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số điểm cực đại trên đoạn $S_1S_2$ là $8$.", "b) Số điểm cực tiểu trên đoạn $S_1S_2$ là $9$.", "c) Đường trung trực của $S_1S_2$ là đường cực tiểu.", "d) Điểm $M$ có n số của sóng là", "options": ["A. $1$ GHz.", "B. $9 \\cdot 10^7$ Hz.", "C. $10^{-9}$ Hz.", "D. $0{,}1$ GHz."], "answer": "A", "explain": "$f = \\frac{3 \\cdot 10^8}{0{,}3} = 10^9$ Hz $= 1$ GHz.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sợi dây hai đầu cố định, $l = 75$ cm, có sóng dừng với $5$ nút sóng. Bước sóng là", "options": ["A. $37{,}5$ cm.", "B. $30$ cm.", "C. $15$ cm.", "D. $75$ cm."], "answer": "A", "explain": "$5$ nút ⇒ $4$ bụng; $l = 4\\frac{\\lambda}{2} = 2\\lambda = 75$ cm $\\Rightarrow \\lambda = 37{,}5$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai nguồn cùng pha, $f = 60$ Hz, $v = 1{,}8$ m/s, $S_1S_2 = 21$ cm. Số điểm cực đại trên đoạn $S_1S_2$ là", "options": ["A. $13$.", "B. $14$.", "C. $12$.", "D. $15$."], "answer": "A", "explain": "$\\lambda = 1{,}8/60 = 0{,}03$ m $= 3$ cm; $-7 \\lt k \\lt 7$ ⇒ $13$ điểm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giao thoa cần hai sóng kết hợp.", "b) Sóng dừng do sóng tới và sóng phản xạ giao thoa.", "c) Sóng điện từ: $\\vec{E}$ và $\\vec{B}$ cùng pha.", "d) Sóng cơ truyền được trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sóng có $v = 4$ m/s, $\\lambda = 0{,}5$ m. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $f = 8$ Hz.", "b) $T = 0{,}125$ s.", "c) Hai điểm cách nhau $75$ cm dao động ngược pha.", "d) Hai điểm cách nhau $1$ m dao động cùng pha."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng: $75$ cm $= 1{,}5\\lambda$. d) Đúng: $1$ m $= 2\\lambda$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sóng âm có $f = 250$ Hz truyền trong không khí ($v = 340$ m/s). Bước sóng bằng bao nhiêu mét? (Làm tròn $2$ chữ số thập phân.)", "answer": "1.36", "explain": "$\\lambda = 340/250 = 1{,}36$ m.", "points": 0.5}, {"type": "short", "leve
