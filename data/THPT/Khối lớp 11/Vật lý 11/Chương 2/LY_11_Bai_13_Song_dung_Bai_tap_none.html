. $6$.", "B. $3$.", "C. $12$.", "D. $9$."], "answer": "A", "explain": "$\\lambda/2 = 15$ cm $\\Rightarrow \\lambda = 30$ cm; $l = k\\frac{\\lambda}{2} \\Rightarrow k = 90/15 = 6$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một sợi dây hai đầu cố định, $v = 20$ m/s, $f = 50$ Hz, $l = 80$ cm. Số bụng sóng là", "options": ["A. $4$.", "B. $2$.", "C. $8$.", "D. $5$."], "answer": "A", "explain": "$\\lambda = 20/50 = 0{,}4$ m $= 40$ cm; $l = k\\frac{\\lambda}{2} \\Rightarrow k = 80/20 = 4$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nút sóng đứng yên, bụng sóng dao động với biên độ cực đại.", "b) Hai bụng sóng liên tiếp cách nhau $\\lambda/2$.", "c) Một nút và một bụng liên tiếp cách nhau $\\lambda/4$.", "d) Mọi điểm trên dây có sóng dừng đều dao động với cùng biên độ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: biên độ phụ thuộc vị trí (nút: $0$, bụng: cực đại).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sợi dây hai đầu cố định, $l = 100$ cm, có sóng dừng với $5$ bụng. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\lambda = 40$ cm.", "b) Số nút sóng là $6$.", "c) Khoảng cách giữa hai bụng liên tiếp là $20$ cm.", "d) Chiều dài mỗi bó sóng là $20$ cm."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $100 = 5 \\cdot \\lambda/2$. b) Đúng. c) Đúng: $\\lambda/2 = 20$ cm. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Trên một sợi dây có sóng dừng, khoảng cách giữa $4$ bụng sóng liên tiếp là $45$ cm. Bước sóng bằng bao nhiêu cm?", "answer": "30", "explain": "$4$ bụng $= 3$ khoảng $\\lambda/2 = 45$ cm $\\Rightarrow \\lambda = 30$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một sợi dây một đầu cố định, một đầu tự do, $l = 50$ cm, $v = 10$ m/s. Tần số nhỏ nhất để có sóng dừng bằng bao nhiêu Hz?", "answer": "5", "explain": "$f_{\\min} = \\frac{v}{4l} = \\frac{10}{2} = 5$ Hz.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Điều kiện có sóng dừng trên dây hai đầu cố định là", "options": ["A. $l = k\\frac{\\lambda}{2}$.", "B. $l = (2k+1)\\frac{\\lambda}{4}$.", "C. $l = k\\lambda$.", "D. $l = (2k+1)\\frac{\\lambda}{2}$."], "answer": "A", "explain": "Hai đầu cố định đều là nút: $l = k\\lambda/2$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điều kiện có sóng dừng trên dây một đầu cố định, một đầu tự do là", "options": ["A. $l = (2k+1)\\frac{\\lambda}{4}$.", "B. $l = k\\frac{\\lambda}{2}$.", "C. $l = k\\lambda$.", "D. $l = 2k\\lambda$."], "answer": "A", "explain": "Đầu cố định là nút, đầu tự do là bụng: $l = (2k+1)\\lambda/4$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sợi dây hai đầu cố định, $l = 75$ cm, $\\lambda = 50$ cm. Kết luận nào sau đây đúng?", "options": ["A. Có sóng dừng với $3$ bụng.", "B. Không có sóng dừng.", "C. Có sóng dừng với $6$ bụng.", "D. Có sóng dừng với $1{,}5$ bụng."], "answer": "A", "explain": "$75 = k \\cdot 25 \\Rightarrow k = 3$: có sóng dừng với $3$ bụng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sợi dây một đầu cố định, một đầu tự do, $l = 75$ cm, $\\lambda = 50$ cm. Kết luận nào sau đây đúng?", "options": ["A. Không có sóng dừng.", "B. Có sóng dừng với $3$ bụng.", "C. Có sóng dừng với $6$ bụng.", "D. Có sóng dừng với $2$ bụng."], "answer": "A", "explain": "$75 = (2k+1) \\cdot 12{,}5 \\Rightarrow 2k + 1 = 6$ (không nguyên lẻ) ⇒ không có sóng dừng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sợi dây hai đầu cố định, $l = 1$ m, trên dây có sóng dừng với $8$ nút sóng. Bước sóng xấp xỉ", "options": ["A. $28{,}6$ cm.", "B. $25$ cm.", "C. $14{,}3$ cm.", "D. $12{,}5$ cm."], "answer": "A", "explain": "$8$ nút ⇒ $7$ bụng; $l = 7\\frac{\\lambda}{2} \\Rightarrow \\lambda = \\frac{2}{7} \\approx 0{,}2857$ m $\\approx 28{,}6$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một dây đàn ghi-ta dài $65$ cm, hai đầu cố định, tốc độ truyền sóng trên dây là $260$ m/s. Tần số âm cơ bản mà dây phát ra là", "options": ["A. $200$ Hz.", "B. $400$ Hz.", "C. $100$ Hz.", "D. $130$ Hz."], "answer": "A", "explain": "$f_1 = \\frac{v}{2l} = \\frac{260}{1{,}3} = 200$ Hz.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $l = k\\lambda/2$: sóng dừng trên dây hai đầu cố định.", "b) $l = (2k+1)\\lambda/4$: sóng dừng trên dây một đầu cố định, một đầu tự do.", "c) $k$ là số bụng sóng.", "d) Tần số càng cao thì số bụng sóng càng nhiều."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: $f = kv/(2l)$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sợi dây hai đầu cố định, $l = 60$ cm, $v = 30$ m/s. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $f = 25$ Hz: có sóng dừng với $1$ bụng.", "b) $f = 50$ Hz: có sóng dừng với $2$ bụng.", "c) $f = 75$ Hz: có sóng dừng với $3$ bụng.", "d) $f = 100$ Hz: có sóng dừng với $4$ bụng."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $\\lambda = 120$ cm, $60 = 1 \\cdot 60$. b) Đúng: $\\lambda = 60$ cm, $k = 2$. c) Đúng: $\\lambda = 40$ cm, $k = 3$. d) Đúng: $\\lambda = 30$ cm, $k = 4$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sợi dây hai đầu cố định, $l = 90$ cm, $\\lambda = 30$ cm. Số nút sóng bằng bao nhiêu?", "answer": "7", "explain": "$90 = k \\cdot 15 \\Rightarrow k = 6$ bụng; số nút $= 7$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một sợi dây một đầu cố định, một đầu tự do, $l = 60$ cm, có sóng dừng với $2$ bụng sóng. Bước sóng bằng bao nhiêu cm?", "answer": "80", "explain": "Số bụng $= k + 1 = 2 \\Rightarrow k = 1$; $l = \\frac{3\\lambda}{4} = 60 \\Rightarrow \\lambda = 80$ cm.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Trên dây có sóng dừng, điểm dao động với biên độ cực đại gọi là", "options": ["A. bụng sóng.", "B. nút sóng.", "C. đỉnh sóng.", "D. hõm sóng."], "answer": "A", "explain": "Định nghĩa bụng sóng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trên dây có sóng dừng, điểm luôn đứng yên gọi là", "options": ["A. nút sóng.", "B. bụng sóng.", "C. đỉnh sóng.", "D. nguồn sóng."], "answer": "A", "explain": "Định nghĩa nút sóng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khoảng cách giữa $5$ nút sóng liên tiếp là $40$ cm. Bước sóng là", "options": ["A. $20$ cm.", "B. $10$ cm.", "C. $40$ cm.", "D. $80$ cm."], "answer": "A", "explain": "$5$ nút $= 4$ khoảng $\\lambda/2 = 40$ cm $\\Rightarrow \\lambda = 20$ cm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên một sợi dây có sóng dừng: khoảng cách từ một nút sóng đến bụng sóng thứ hai (kể từ nút đó) là $30$ cm. Bước sóng là", "options": ["A. $40$ cm.", "B. $20$ cm.", "C. $60$ cm.", "D. $120$ cm."], "answer": "A", "explain": "Nút → bụng 1: $\\lambda/4$; bụng 1 → bụng 2: $\\lambda/2$; tổng $= 3\\lambda/4 = 30$ cm $\\Rightarrow \\lambda = 40$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sợi dây hai đầu cố định, $l = 48$ cm, có sóng dừng với $3$ bó sóng. Bước sóng là", "options": ["A. $32$ cm.", "B. $16$ cm.", "C. $48$ cm.", "D. $96$ cm."], "answer": "A", "explain": "$l = 3 \\cdot \\frac{\\lambda}{2} = 48 \\Rightarrow \\lambda = 32$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sóng dừng trên dây hai đầu cố định: tần số tăng từ $f_1$ (ứng với $1$ bụng) lên $f_2$ (ứng với $3$ bụng). Tỉ số $f_2/f_1$ bằng", "options": ["A. $3$.", "B. $9$.", "C. $1{,}5$.", "D. $6$."], "answer": "A", "explain": "$f = \\frac{kv}{2l}$ nên $f_2/f_1 = 3/1 = 3$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bụng sóng: biên độ cực đại.", "b) Nút sóng: luôn đứng yên.", "c) Một nút và một bụng liên tiếp cách nhau $\\lambda/4$.", "d) Hai nút sóng liên tiếp cách nhau $\\lambda/4$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: là $\\lambda/2$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sợi dây một đầu cố định, một đầu tự do, $l = 45$ cm, có sóng dừng với $2$ bụng. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $k = 1$.", "b) $\\lambda = 60$ cm.", "c) Số nút sóng là $2$.", "d) Khoảng cách từ nút ở đầu cố định đến bụng ở đầu tự do là $45$ cm."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: số bụng $= k + 1 = 2$. b) Đúng: $45 = \\frac{3\\lambda}{4}$. c) Đúng. d) Đúng: bằng cả chiều dài dây.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sợi dây hai đầu cố định, $l = 70$ cm, có sóng dừng với $7$ bụng. Bước sóng bằng bao nhiêu cm?", "answer": "20", "explain": "$70 = 7 \\cdot \\frac{\\lambda}{2} \\Rightarrow \\lambda = 20$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một sợi dây hai đầu cố định, $v = 40$ m/s, $l = 2$ m. Tần số của họa âm bậc $2$ ($k = 3$) bằng bao nhiêu Hz?", "answer": "30", "explain": "$f = \\frac{3 \\cdot 40}{2 \\cdot 2} = 30$ Hz.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Sóng dừng là trường hợp đặc biệt của", "options": ["A. giao thoa sóng.", "B. sóng dọc.", "C. sóng ngang.", "D. sóng âm."], "answer": "A", "explain": "Sóng dừng do sóng tới và sóng phản xạ giao thoa với nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong sóng dừng, năng lượng sóng", "options": ["A. không truyền đi mà dao động tại chỗ giữa các nút.", "B. truyền đi xa khỏi nguồn.", "C. bằng $0$.", "D. tăng dần theo thời gian."], "answer": "A", "explain": "Sóng dừng không truyền năng lượng đi xa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sợi dây hai đầu cố định, $l = 50$ cm, $\\lambda = 25$ cm. Số bụng sóng là", "options": ["A. $4$.", "B. $2$.", "C. $8$.", "D. $5$."], "answer": "A", "explain": "$50 = k \\cdot 12{,}5 \\Rightarrow k = 4$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sợi dây hai đầu cố định, $l = 50$ cm, $\\lambda = 25$ cm. Số nút sóng là", "options": ["A. $5$.", "B. $4$.", "C. $6$.", "D. $10$."], "answer": "A", "explain": "Số nút $= k + 1 = 5$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sợi dây một đầu cố định, một đầu tự do, $l = 100$ cm, $\\lambda = 80$ cm. Số bụng sóng là", "options": ["A. $3$.", "B. $5$.", "C. $2$.", "D. $4$."], "answer": "A", "explain": "$100 = (2k+1) \\cdot 20 \\Rightarrow 2k + 1 = 5 \\Rightarrow k = 2$; số bụng $= k + 1 = 3$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một sợi dây hai đầu cố định, $l = 3$ m, $v = 60$ m/s. Các tần số có thể tạo sóng dừng trên dây là", "options": ["A. $f = 10k$ (Hz) với $k = 1, 2, 3, \\dots$.", "B. $f = 20k$ (Hz) với $k = 1, 2, 3, \\dots$.", "C. $f = 5k$ (Hz) với $k = 1, 2, 3, \\dots$.", "D. $f = 30k$ (Hz) với $k = 1, 2, 3, \\dots$."], "answer": "A", "explain": "$f = \\frac{kv}{2l} = \\frac{60k}{6} = 10k$ Hz.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sóng dừng do sóng tới và sóng phản xạ giao thoa với nhau.", "b) Năng lượng của sóng dừng không truyền đi xa.", "c) Nút sóng có biên độ bằng $0$.", "d) Bụng sóng có biên độ bằng biên độ của sóng tới."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: biên độ tại bụng $= 2$ lần biên độ sóng tới.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sợi dây hai đầu cố định, $l = 120$ cm, $v = 48$ m/s. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $f = 20$ Hz: có sóng dừng với $1$ bụng.", "b) $f = 40$ Hz: có sóng dừng với $2$ bụng.", "c) $f = 60$ Hz: có sóng dừng với $3$ bụng.", "d) $f = 80$ Hz: có sóng dừng với $4$ bụng."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $\\lambda = 240$ cm, $120 = 1 \\cdot 120$. b) Đúng: $\\lambda = 120$ cm, $k = 2$. c) Đúng: $\\lambda = 80$ cm, $k = 3$. d) Đúng: $\\lambda = 60$ cm, $k = 4$.", "points": 1}, {"type": "short", "level": "VD", "q": "Khoảng cách giữa hai bụng sóng liên tiếp là $25$ cm. Bước sóng bằng bao nhiêu cm?", "answer": "50", "explain": "Hai bụng liên tiếp cách nhau $\\lambda/2 = 25$ cm $\\Rightarrow \\lambda = 50$ cm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một sợi dây một đầu cố định, một đầu tự do, $l = 30$ cm, $v = 12$ m/s. Tần số thứ hai ($k = 1$) có sóng dừng bằng bao nhiêu Hz?", "answer": "30", "explain": "$f = \\frac{3v}{4l} = \\frac{3 \\cdot 12}{1{,}2} = 30$ Hz.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Số bó sóng trên dây hai đầu cố định bằng", "options": ["A. số bụng sóng.", "B. số nút sóng.", "C. số nút sóng trừ $1$.", "D. cả A và C đều đúng."], "answer": "D", "explain": "Số bó $=$ số bụng $= k =$ số nút $- 1$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trên dây một đầu cố định, một đầu tự do có sóng dừng: số nút sóng bằng", "options": ["A. số bụng sóng.", "B. số bụng sóng cộng $1$.", "C. số bụng sóng trừ $1$.", "D. hai lần số bụng sóng."], "answer": "A", "explain": "Một đầu tự do: số nút $=$ số bụng $= k + 1$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sợi dây hai đầu cố định có sóng dừng với $10$ bụng sóng. Số nút sóng là", "options": ["A. $11$.", "B. $10$.", "C. $9$.", "D. $20$."], "answer": "A", "explain": "Số nút $=$ số bụng $+ 1 = 11$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sợi dây một đầu cố định, một đầu tự do có sóng dừng với $5$ bụng sóng. Số nút sóng là", "options": ["A. $5$.", "B. $6$.", "C. $4$.", "D. $10$."], "answer": "A", "explain": "Số nút $=$ số bụng $= 5$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sợi dây dài $150$ cm, hai đầu cố định, có sóng dừng với khoảng cách giữa hai nút sóng liên tiếp là $25$ cm. Số bụng sóng là", "options": ["A. $6$.", "B. $3$.", "C. $12$.", "D. $5$."], "answer": "A", "explain": "$\\lambda/2 = 25$ cm; $l = k \\cdot 25 \\Rightarrow k = 150/25 = 6$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sợi dây  "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: các bụng ở hai bó liên tiếp ngược pha nhau. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một sợi dây hai đầu cố định, $l = 150$ cm, $\\lambda = 50$ cm. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số bụng sóng là $6$.", "b) Số nút sóng là $7$.", "c) Khoảng cách giữa một nút và một bụng liên tiếp là $12{,}5$ cm.", "d) Chiều dài mỗi bó sóng là $25$ cm."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $150 = k \\cdot 25 \\Rightarrow k = 6$. b) Đúng. c) Đúng: $\\lambda/4 = 12{,}5$ cm. d) Đúng: $\\lambda/2 = 25$ cm.", "points": 1}, {"type": "short", "level": "VD", "q": "Một sợi dây một đầu cố định, một đầu tự do, $l = 105$ cm, $\\lambda = 60$ cm. Số bụng sóng bằng bao nhiêu?", "answer": "4", "explain": "$105 = (2k+1) \\cdot 15 \\Rightarrow 2k + 1 = 7 \\Rightarrow k = 3$; số bụng $= k + 1 = 4$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một sợi dây hai đầu cố định có sóng dừng: $f_1 = 100$ Hz ứng với $2$ bụng sóng. Tần số $f_2$ ứng với $5$ bụng sóng bằng bao nhiêu Hz? (Tốc độ truyền sóng không đổi.)", "answer": "250", "explain": "$f \\sim k$ nên $f_2 = 100 \\cdot \\frac{5}{2} = 250$ Hz.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Một ứng dụng của sóng dừng trên dây là", "options": ["A. xác định tốc độ truyền sóng trên dây.", "B. đo khối lượng vật.", "C. đo nhiệt độ.", "D. đo điện trở."], "answer": "A", "explain": "Đo $f$ và $\\lambda$ (qua số bụng) để tính $v = \\lambda f$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đàn ghi-ta phát ra âm thanh nhờ", "options": ["A. sóng dừng trên dây đàn.", "B. sóng chạy trên dây đàn.", "C. sự giao thoa của âm thanh.", "D. sự cộng hưởng của không khí."], "answer": "A", "explain": "Dây đàn dao động với sóng dừng tạo ra âm thanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một dây đàn dài $60$ cm, hai đầu cố định, $v = 240$ m/s. Tần số âm cơ bản mà dây phát ra
