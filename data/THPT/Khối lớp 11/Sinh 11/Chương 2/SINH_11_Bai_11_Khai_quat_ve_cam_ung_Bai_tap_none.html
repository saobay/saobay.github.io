{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","q":"Cảm ứng là khả năng của sinh vật","options":["A. phản ứng lại với các kích thích từ môi trường","B. quang hợp","C. hô hấp","D. sinh sản"],"answer":"A","explain":"Cảm ứng: nhận biết kích thích (sáng, nhiệt, va chạm...) và phản ứng trả lời.","level":"NB","points":0.25},{"type":"mcq","q":"Hướng động là hình thức vận động","options":["A. định hướng theo tác nhân kích thích","B. không định hướng","C. phản xạ","D. sinh trưởng"],"answer":"A","explain":"Hướng động: vận động định hướng — về phía hoặc tránh xa kích thích.","level":"NB","points":0.25},{"type":"mcq","q":"Thân cây hướng về phía có ánh sáng là","options":["A. hướng sáng dương","B. hướng sáng âm","C. ứng động","D. phản xạ"],"answer":"A","explain":"Thân hướng về phía sáng: hướng sáng dương.","level":"TH","points":0.25},{"type":"mcq","q":"Rễ cây hướng xuống đất là","options":["A. hướng trọng lực dương (hướng đất dương)","B. hướng sáng","C. ứng động","D. hướng nước"],"answer":"A","explain":"Rễ hướng theo trọng lực xuống đất: hướng đất dương.","level":"TH","points":0.25},{"type":"mcq","q":"Đặt chậu cây nằm ngang, sau vài ngày ngọn cây cong lên vì","options":["A. thân có hướng đất âm","B. thân hướng sáng","C. gió thổi","D. tưới nước"],"answer":"A","explain":"Thân hướng đất âm: mọc ngược chiều trọng lực, cong lên trên.","level":"VD","points":0.25},{"type":"mcq","q":"Auxin làm thân cong về phía có ánh sáng vì","options":["A. phía tối nhiều auxin hơn nên sinh trưởng nhanh hơn","B. phía sáng nhiều auxin hơn","C. auxin có độc","D. hoàn toàn ngẫu nhiên"],"answer":"A","explain":"Auxin tập trung phía tối → phía tối sinh trưởng nhanh → thân cong về phía sáng.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về cảm ứng.","statements":["a) Là khả năng phản ứng với kích thích","b) Giúp sinh vật thích nghi","c) Có ở mọi sinh vật","d) Chỉ có ở động vật"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: thực vật cũng có cảm ứng (hướng động, ứng động).","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về hướng động.","statements":["a) Là vận động định hướng","b) Thân hướng về phía sáng","c) Rễ hướng xuống đất","d) Không định hướng theo kích thích"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: hướng động định hướng theo kích thích.","level":"TH","points":1},{"type":"short","q":"Hormone nào phân bố không đều gây ra hiện tượng hướng động ở thực vật?","answer":"Auxin","explain":"Auxin phân bố không đều hai phía cơ quan gây sinh trưởng không đều → cong.","level":"VD","points":0.5},{"type":"short","q":"Rễ mọc hướng về phía có nước gọi là hướng gì?","answer":"Hướng nước","explain":"Hướng nước: rễ hướng về phía có nước (hướng nước dương).","level":"VDC","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","q":"Ứng động là hình thức vận động","options":["A. không định hướng theo tác nhân kích thích","B. định hướng theo kích thích","C. phản xạ","D. hướng động"],"answer":"A","explain":"Ứng động: vận động cảm ứng nhưng không định hướng theo kích thích.","level":"NB","points":0.25},{"type":"mcq","q":"Lá cây trinh nữ cụp lại khi chạm vào là","options":["A. ứng động không sinh trưởng","B. hướng động","C. phản xạ","D. hướng tiếp xúc"],"answer":"A","explain":"Cụp lá do thay đổi độ trương tế bào gốc lá — ứng động không sinh trưởng.","level":"NB","points":0.25},{"type":"mcq","q":"Ứng động sinh trưởng khác ứng động không sinh trưởng ở","options":["A. do sinh trưởng không đều hai phía hay do thay đổi độ trương","B. tốc độ nhanh hay chậm","C. có định hướng hay không","D. không có điểm khác"],"answer":"A","explain":"Sinh trưởng: tốc độ sinh trưởng không đều; không sinh trưởng: thay đổi độ trương tế bào.","level":"TH","points":0.25},{"type":"mcq","q":"Đóng mở khí khổng thuộc loại","options":["A. ứng động không sinh trưởng","B. hướng động","C. phản xạ","D. hướng sáng"],"answer":"A","explain":"Đóng mở khí khổng do tế bào khí khổng trương/mất nước — ứng động không sinh trưởng.","level":"TH","points":0.25},{"type":"mcq","q":"Hoa quỳnh nở về đêm là","options":["A. ứng động sinh trưởng theo nhiệt độ, ánh sáng","B. hướng động","C. phản xạ","D. hoàn toàn ngẫu nhiên"],"answer":"A","explain":"Hoa nở/cụp do tốc độ sinh trưởng không đều hai mặt cánh hoa theo nhiệt, sáng.","level":"VD","points":0.25},{"type":"mcq","q":"Cây gọng vó bắt mồi nhờ","options":["A. ứng động không sinh trưởng","B. hướng động","C. phản xạ","D. hormone auxin"],"answer":"A","explain":"Lá gọng vó gập lại do thay đổi độ trương khi côn trùng chạm vào.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về ứng động.","statements":["a) Là vận động không định hướng","b) Gồm ứng động sinh trưởng và không sinh trưởng","c) Cụp lá trinh nữ là ứng động","d) Ứng động là phản xạ"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: phản xạ là của động vật có hệ thần kinh.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về vai trò của vận động cảm ứng.","statements":["a) Hướng động giúp cây lấy sáng, nước","b) Ứng động giúp bảo vệ, bắt mồi","c) Giúp thực vật thích nghi","d) Không có vai trò gì"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: vận động cảm ứng giúp thực vật thích nghi, tồn tại.","level":"TH","points":1},{"type":"short","q":"Tua cuốn của cây quấn quanh giá thể là kiểu hướng động nào?","answer":"Hướng tiếp xúc","explain":"Hướng tiếp xúc: tua cuốn quấn quanh vật tiếp xúc.","level":"VD","points":0.5},{"type":"short","q":"Hoa nở, cụp theo nhiệt độ thuộc loại ứng động nào?","answer":"Ứng động sinh trưởng","explain":"Do tốc độ sinh trưởng không đều hai phía cơ quan.","level":"VDC","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","q":"Phản xạ là","options":["A. phản ứng trả lời kích thích thông qua hệ thần kinh","B. vận động của cây","C. hướng động","D. ứng động"],"answer":"A","explain":"Phản xạ: phản ứng của cơ thể trả lời kích thích qua hệ thần kinh.","level":"NB","points":0.25},{"type":"mcq","q":"Một cung phản xạ gồm mấy khâu?","options":["A. 5 khâu","B. 3 khâu","C. 4 khâu","D. 2 khâu"],"answer":"A","explain":"5 khâu: thụ quan, dây hướng tâm, trung ương, dây li tâm, cơ quan trả lời.","level":"NB","points":0.25},{"type":"mcq","q":"Thứ tự đúng của cung phản xạ là","options":["A. thụ quan, dây hướng tâm, trung ương, dây li tâm, cơ quan trả lời","B. thứ tự ngược lại","C. thứ tự ngẫu nhiên","D. chỉ có 3 khâu"],"answer":"A","explain":"Xung: thụ quan nhận → hướng tâm về trung ương → li tâm ra cơ quan trả lời.","level":"TH","points":0.25},{"type":"mcq","q":"Phản xạ rụt tay khi chạm vật nóng đi qua","options":["A. tuỷ sống","B. não","C. tim","D. gan"],"answer":"A","explain":"Phản xạ đơn giản qua tuỷ sống, không cần qua não nên rất nhanh.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao phản xạ rụt tay khi chạm vật nóng rất nhanh?","options":["A. xung chỉ qua tuỷ sống, không qua não","B. tay rất khoẻ","C. vật quá nóng","D. do sợ hãi"],"answer":"A","explain":"Cung phản xạ ngắn qua tuỷ sống → trả lời nhanh, kịp thời.","level":"VD","points":0.25},{"type":"mcq","q":"Người bị tổn thương tuỷ sống thì","options":["A. mất phản xạ ở phần cơ thể dưới chỗ tổn thương","B. không ảnh hưởng gì","C. tăng phản xạ","D. bị liệt não"],"answer":"A","explain":"Tuỷ sống đứt: xung không qua được → mất phản xạ dưới chỗ tổn thương.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về phản xạ.","statements":["a) Là phản ứng qua hệ thần kinh","b) Trả lời kích thích của môi trường","c) Có cung phản xạ","d) Là vận động của cây"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: vận động của cây là hướng động, ứng động.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về cung phản xạ.","statements":["a) Gồm 5 khâu","b) Có dây thần kinh hướng tâm và li tâm","c) Trung ương xử lí thông tin","d) Không có thụ quan"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: thụ quan là khâu đầu tiên nhận kích thích.","level":"TH","points":1},{"type":"short","q":"Khâu đầu tiên của cung phản xạ có tên là gì?","answer":"Thụ quan","explain":"Thụ quan (cơ quan thụ cảm) nhận kích thích từ môi trường.","level":"VD","points":0.5},{"type":"short","q":"Khâu cuối cùng của cung phản xạ có tên là gì?","answer":"Cơ quan trả lời","explain":"Cơ quan trả lời (cơ, tuyến) thực hiện phản ứng.","level":"VDC","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","q":"Hệ thần kinh dạng lưới có ở","options":["A. ruột khoang (thuỷ tức, sứa)","B. giun đất","C. cá","D. người"],"answer":"A","explain":"Ruột khoang: tế bào thần kinh nối thành lưới khắp cơ thể.","level":"NB","points":0.25},{"type":"mcq","q":"Hệ thần kinh dạng chuỗi hạch có ở","options":["A. giun, côn trùng","B. cá","C. người","D. sứa"],"answer":"A","explain":"Giun đốt, chân khớp: các hạch thần kinh nối thành chuỗi.","level":"NB","points":0.25},{"type":"mcq","q":"Hệ thần kinh dạng ống có ở","options":["A. động vật có xương sống","B. giun đất","C. côn trùng","D. thuỷ tức"],"answer":"A","explain":"Có xương sống: não và tuỷ sống tạo thành ống thần kinh.","level":"TH","points":0.25},{"type":"mcq","q":"Phản ứng của động vật có hệ thần kinh dạng lưới","options":["A. toàn thân, chậm, kém chính xác","B. rất nhanh","C. rất chính xác","D. định khu"],"answer":"A","explain":"Dạng lưới: xung lan toả, phản ứng toàn thân, chậm, kém chính xác.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao côn trùng phản ứng nhanh và chính xác hơn thuỷ tức?","options":["A. hệ thần kinh chuỗi hạch tiến hoá hơn dạng lưới","B. côn trùng to hơn","C. côn trùng khoẻ hơn","D. côn trùng nhiều chân"],"answer":"A","explain":"Chuỗi hạch: phản ứng định khu, nhanh, chính xác hơn dạng lưới.","level":"VD","points":0.25},{"type":"mcq","q":"Não phát triển nhất ở","options":["A. người","B. cá","C. ếch","D. chim"],"answer":"A","explain":"Người có vỏ não phát triển nhất, tư duy, ý thức phức tạp.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về các dạng hệ thần kinh.","statements":["a) Dạng lưới có ở ruột khoang","b) Dạng chuỗi hạch có ở giun, côn trùng","c) Dạng ống có ở động vật có xương sống","d) Người có hệ thần kinh dạng lưới"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: người có hệ thần kinh dạng ống.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về tiến hoá hệ thần kinh.","statements":["a) Từ đơn giản đến phức tạp","b) Phản ứng nhanh và chính xác dần","c) Dạng ống phức tạp nhất","d) Dạng lưới phức tạp nhất"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: dạng lưới đơn giản nhất.","level":"TH","points":1},{"type":"short","q":"Hệ thần kinh của châu chấu thuộc dạng nào?","answer":"Chuỗi hạch","explain":"Châu chấu (côn trùng): hệ thần kinh dạng chuỗi hạch.","level":"VD","points":0.5},{"type":"short","q":"Trung ương thần kinh của người gồm những bộ phận nào?","answer":"Não và tuỷ sống","explain":"Trung ương thần kinh: não và tuỷ sống (hệ thần kinh dạng ống).","level":"VDC","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","q":"Cảm ứng ở thực vật được thực hiện nhờ","options":["A. hormone (thực vật không có hệ thần kinh)","B. hệ thần kinh","C. não","D. tuỷ sống"],"answer":"A","explain":"Thực vật không có hệ thần kinh, cảm ứng nhờ hormone (auxin...).","level":"NB","points":0.25},{"type":"mcq","q":"Cảm ứng ở động vật được thực hiện nhờ","options":["A. hệ thần kinh","B. hormone","C. rễ","D. lá"],"answer":"A","explain":"Động vật cảm ứng bằng phản xạ qua hệ thần kinh.","level":"NB","points":0.25},{"type":"mcq","q":"Tốc độ cảm ứng ở thực vật so với động vật thì","options":["A. chậm hơn","B. nhanh hơn","C. bằng nhau","D. không so sánh được"],"answer":"A","explain":"Thực vật: hormone vận chuyển chậm → phản ứng chậm hơn động vật.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao thực vật phản ứng chậm với kích thích?","options":["A. không có hệ thần kinh, nhờ hormone vận chuyển chậm","B. thực vật lười","C. thực vật quá to","D. thiếu năng lượng"],"answer":"A","explain":"Không có hệ thần kinh dẫn xung nhanh; hormone khuếch tán, vận chuyển chậm.","level":"TH","points":0.25},{"type":"mcq","q":"Chạm vào lá trinh nữ, lá cụp lại nhưng không cong về phía tay vì","options":["A. đó là ứng động, không định hướng","B. đó là hướng động","C. đó là phản xạ","D. lá sợ tay"],"answer":"A","explain":"Ứng động không định hướng theo kích thích — khác hướng động.","level":"VD","points":0.25},{"type":"mcq","q":"Động vật có hệ thần kinh càng phức tạp thì phản ứng","options":["A. càng nhanh, chính xác và phức tạp","B. càng chậm","C. càng đơn giản","D. không đổi"],"answer":"A","explain":"Tiến hoá hệ thần kinh: phản ứng nhanh, chính xác, phức tạp dần.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét so sánh cảm ứng ở thực vật và động vật.","statements":["a) Thực vật: hướng động và ứng động","b) Động vật: phản xạ qua hệ thần kinh","c) Thực vật phản ứng chậm hơn động vật","d) Thực vật có hệ thần kinh"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: thực vật không có hệ thần kinh.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về ý nghĩa của cảm ứng.","statements":["a) Giúp sinh vật thích nghi với môi trường","b) Giúp sinh vật tồn tại","c) Là đặc trưng cơ bản của sự sống","d) Không có ý nghĩa gì"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cảm ứng rất quan trọng cho sự tồn tại.","level":"TH","points":1},{"type":"short","q":"Vận động định hướng theo kích thích ở thực vật gọi là gì?","answer":"Hướng động","explain":"Hướng động: vận động định hướng theo tác nhân kích thích.","level":"VD","points":0.5},{"type":"short","q":"Phản ứng trả lời kích thích thông qua hệ thần kinh gọi là gì?","answer":"Phản xạ","explain":"Phản xạ: phản ứng của cơ thể trả lời kích thích qua hệ thần kinh.","level":"VDC","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","q":"Hướng hoá là hiện tượng","options":["A. rễ hướng về phía có chất dinh dưỡng","B. thân hướng về phía sáng","C. rễ hướng về phía có nước","D. rễ hướng xuống đất"],"answer":"A","explain":"Hướng hoá: rễ hướng về phía có hoá chất (dinh dưỡng) — hướng hoá dương.","level":"NB","points":0.25},{"type":"mcq","q":"Hướng nước là hiện tượng","options":["A. rễ hướng về phía có nước","B. thân hướng về phía sáng","C. rễ hướng xuống đất","D. rễ hướng về phân bón"],"answer":"A","explain":"Hướng nước: rễ hướng về phía ẩm, có nước.","level":"NB","points":0.25},{"type":"mcq","q":"Rễ cây mọc về phía có phân bón là","options":["A. hướng hoá dương","B. hướng sáng","C. ứng động","D. phản xạ"],"answer":"A","explain":"Rễ hướng về chất dinh dưỡng: hướng hoá dương.","level":"TH","points":0.25},{"type":"mcq","q":"Thân cây mọc ngược chiều trọng lực là","options":["A. hướng đất âm","B. hướng đất dương","C. hướng nước","D. hướng hoá"],"answer":"A","explain":"Thân hướng đất âm: mọc ngược trọng lực, vươn lên trên.","level":"TH","points":0.25},{"type":"mcq","q":"Tưới nước chỉ một bên chậu, rễ mọc về phía được tưới vì","options":["A. rễ có hướng nước dương","B. rễ hướng sáng","C. hoàn toàn ngẫu nhiên","D. gió thổi"],"answer":"A","explain":"Rễ hướng về phía có nước — hướng nước dương.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao rễ cây thường tránh ánh sáng?","options":["A. ánh sáng ức chế sinh trưởng của rễ","B. rễ sợ ánh sáng","C. ánh sáng làm nóng","D. ánh sáng làm khô"],"answer":"A","explain":"Rễ hướng sáng âm: ánh sáng ức chế sinh trưởng rễ, rễ cần vào đất tối.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về các kiểu hướng động.","statements":["a) Có hướng sáng","b) Có hướng đất (trọng lực)","c) Có hướng hoá, hướng nước","d) Chỉ có hướng sáng"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: có nhiều kiểu hướng động.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về hướng của rễ và thân.","statements":["a) Rễ hướng đất dương","b) Thân hướng đất âm","c) Rễ hướng sáng âm","d) Thân hướng sáng âm"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: thân hướng sáng dương.","level":"TH","points":1},{"type":"short","q":"Rễ hướng xuống đất được gọi là hướng đất gì?","answer":"Dương","explain":"Rễ: hướng đất dương (cùng chiều trọng lực).","level":"VD","points":0.5},{"type":"short","q":"Thân hướng lên trên được gọi là hướng đất gì?","answer":"Âm","explain":"Thân: hướng đất âm (ngược chiều trọng lực).","level":"VDC","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","q":"Thụ quan trong cung phản xạ có vai trò","options":["A. nhận kích thích từ môi trường","B. trả lời kích thích","C. dẫn truyền","D. xử lí thông tin"],"answer":"A","explain":"Thụ quan (da, mắt, tai...) nhận kích thích, phát xung thần kinh.","level":"NB","points":0.25},{"type":"mcq","q":"Dây thần kinh hướng tâm dẫn xung thần kinh","options":["A. từ thụ quan về trung ương","B. từ trung ương ra cơ quan","C. máu","D. chất dinh dưỡng"],"answer":"A","explain":"Hướng tâm: vào trung ương (hướng về trung ương thần kinh).","level":"NB","points":0.25},{"type":"mcq","q":"Dây thần kinh li tâm dẫn xung thần kinh","options":["A. từ trung ương đến cơ quan trả lời","B. về trung ương","C. máu","D. khí"],"answer":"A","explain":"Li tâm: ra khỏi trung ương đến cơ, tuyến trả lời.","level":"TH","points":0.25},{"type":"mcq","q":"Trung ương thần kinh gồm","options":["A. não và tuỷ sống","B. tim","C. dây thần kinh","D. cơ"],"answer":"A","explain":"Trung ương: não và tuỷ sống — xử lí thông tin, phát lệnh.","level":"TH","points":0.25},{"type":"mcq","q":"Nhắm mắt vẫn rụt tay khi chạm vật nóng vì","options":["A. phản xạ qua tuỷ sống, không cần nhìn","B. đoán được","C. do may mắn","D. vì sợ"],"answer":"A","explain":"Phản xạ tuỷ không cần vỏ não (nhìn) vẫn thực hiện được.","level":"VD","points":0.25},{"type":"mcq","q":"Phản xạ có điều kiện khác phản xạ không điều kiện ở điểm","options":["A. được hình thành qua học tập, cần vỏ não","B. bẩm sinh","C. nhanh hơn","D. chậm hơn"],"answer":"A","explain":"Có điều kiện: học được (chó tiết nước bọt khi nghe chuông), cần vỏ não.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về các khâu của cung phản xạ.","statements":["a) Thụ quan nhận kích thích","b) Dây hướng tâm về trung ương","c) Dây li tâm ra cơ quan trả lời","d) Cơ quan trả lời nhận kích thích đầu tiên"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: thụ quan nhận kích thích đầu tiên.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về phản xạ không điều kiện.","statements":["a) Có tính bẩm sinh","b) Không cần học tập","c) Qua tuỷ sống, hành não","d) Cần vỏ não"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: không điều kiện không cần vỏ não.","level":"TH","points":1},{"type":"short","q":"Dây thần kinh nào đưa xung từ thụ quan về trung ương?","answer":"Hướng tâm","explain":"Dây hướng tâm (cảm giác) đưa xung về não, tuỷ.","level":"VD","points":0.5},{"type":"short","q":"Kể tên một phản xạ không điều kiện ở người.","answer":"Rụt tay","explain":"Rụt tay khi chạm vật nóng là phản xạ không điều kiện bẩm sinh.","level":"VDC","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Cây xấu hổ còn có tên gọi là","options":["A. cây trinh nữ","B. cây gọng vó","C. cây nắp ấm","D. hoa quỳnh"],"answer":"A","explain":"Cây xấu hổ = cây trinh nữ (Mimosa) cụp lá khi chạm.","level":"NB","points":0.25},{"type":"mcq","q":"Cây nào sau đây bắt mồi?","options":["A. cây gọng vó, cây nắp ấm","B. cây trinh nữ","C. cây lúa","D. cây ngô"],"answer":"A","explain":"Gọng vó, nắp ấm là cây bắt côn trùng bổ sung dinh dưỡng.","level":"NB","points":0.25},{"type":"mcq","q":"Cây nắp ấm bắt mồi để","options":["A. bổ sung nitơ","B. ăn cho no","C. trang trí","D. chống sâu"],"answer":"A","explain":"Đất nghèo nitơ: cây bắt mồi phân giải côn trùng lấy nitơ.","level":"TH","points":0.25},{"type":"mcq","q":"Lá trinh nữ cụp lại do","options":["A. thay đổi độ trương của tế bào ở gốc lá","B. sinh trưởng nhanh","C. gió thổi","D. bị héo"],"answer":"A","explain":"Chạm: nước di chuyển khỏi tế bào gốc lá → mất độ trương → lá cụp.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao cây bắt mồi thường sống ở đất nghèo dinh dưỡng?","options":["A. bắt mồi để bổ sung nitơ","B. thích đất nghèo","C. đất tốt không sống được","D. hoàn toàn ngẫu nhiên"],"answer":"A","explain":"Đất nghèo N: bắt côn trùng là nguồn nitơ bổ sung.","level":"VD","points":0.25},{"type":"mcq","q":"Cụp lá khi bị chạm giúp cây trinh nữ","options":["A. giảm thoát hơi nước và tránh bị động vật ăn","B. để đẹp","C. để ngủ","D. để thở"],"answer":"A","explain":"Cụp lá: giảm diện tích bị gặm, giảm mất nước — thích nghi bảo vệ.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về cây trinh nữ.","statements":["a) Cụp lá khi bị chạm","b) Là ứng động","c) Do thay đổi độ trương tế bào","d) Là hướng động"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cụp lá không định hướng nên là ứng động.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về cây bắt mồi.","statements":["a) Bắt côn trùng làm mồi","b) Bổ sung nitơ cho cây","c) Sống ở đất nghèo dinh dưỡng","d) Không quang hợp"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cây bắt mồi vẫn quang hợp bình thường.","level":"TH","points":1},{"type":"short","q":"Cây nào cụp lá lại khi bị chạm vào?","answer":"Trinh nữ","explain":"Cây trinh nữ (xấu hổ) cụp lá khi chạm — ứng động.","level":"VD","points":0.5},{"type":"short","q":"Cây nắp ấm bắt mồi thuộc loại ứng động nào?","answer":"Ứng động không sinh trưởng","explain":"Nắp ấm đóng lại do thay đổi độ trương, không do sinh trưởng.","level":"VDC","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","q":"Não người nổi bật với","options":["A. bán cầu đại não phát triển","B. không có não","C. não rất nhỏ","D. não đơn giản"],"answer":"A","explain":"Vỏ não người phát triển nhất — tư duy, ý thức, học tập.","level":"NB","points":0.25},{"type":"mcq","q":"Tuỷ sống nằm trong","options":["A. cột sống","B. hộp sọ","C. lồng ngực","D. ổ bụng"],"answer":"A","explain":"Tuỷ sống nằm trong ống sống của cột sống.","level":"NB","points":0.25},{"type":"mcq","q":"Vỏ đại não có vai trò","options":["A. tư duy, học tập, điều khiển có ý thức","B. phản xạ đơn giản","C. bơm máu","D. thở"],"answer":"A","explain":"Vỏ não: trung khu cao cấp — tư duy, trí nhớ, vận động có ý thức.","level":"TH","points":0.25},{"type":"mcq","q":"Hành não điều khiển","options":["A. hô hấp và tuần hoàn","B. tư duy","C. vận động có ý thức","D. nhìn"],"answer":"A","explain":"Hành não: trung khu hô hấp, tim mạch (không điều kiện).","level":"TH","points":0.25},{"type":"mcq","q":"Người say rượu đi loạng choạng vì","options":["A. tiểu não bị ức chế","B. mệt mỏi","C. chóng mặt","D. đói"],"answer":"A","explain":"Rượu ức chế tiểu não — mất thăng bằng, đi loạng choạng.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao luyện tập thường xuyên giúp phản xạ nhanh hơn?","options":["A. đường dẫn truyền thần kinh được củng cố","B. cơ to ra","C. não to ra","D. do may mắn"],"answer":"A","explain":"Luyện tập củng cố synapse, đường phản xạ — phản ứng nhanh, chính xác.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về não.","statements":["a) Là trung ương thần kinh cao cấp","b) Điều khiển hoạt động có ý thức","c) Gồm nhiều vùng chức năng","d) Không có vai trò gì"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: não điều khiển mọi hoạt động cao cấp.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về tuỷ sống.","statements":["a) Nằm trong cột sống","b) Dẫn truyền xung thần kinh","c) Là trung khu phản xạ đơn giản","d) Điều khiển tư duy"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: tư duy do vỏ não đảm nhiệm.","level":"TH","points":1},{"type":"short","q":"Bộ phận nào điều khiển hoạt động hô hấp và tuần hoàn?","answer":"Hành não","explain":"Hành não chứa trung khu hô hấp và tim mạch.","level":"VD","points":0.5},{"type":"short","q":"Bộ phận nào của não điều khiển giữ thăng bằng cơ thể?","answer":"Tiểu não","explain":"Tiểu não điều khiển thăng bằng và phối hợp vận động.","level":"VDC","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","q":"Cảm ứng giúp sinh vật","options":["A. thích nghi với môi trường sống","B. quang hợp tốt hơn","C. hô hấp mạnh hơn","D. sinh sản nhiều"],"answer":"A","explain":"Cảm ứng giúp nhận biết thay đổi, phản ứng kịp thời để thích nghi, tồn tại.","level":"NB","points":0.25},{"type":"mcq","q":"Kích thích là","options":["A. tác nhân từ môi trường gây ra phản ứng","B. chính phản ứng","C. hormone","D. enzyme"],"answer":"A","explain":"Kích thích: ánh sáng, nhiệt, va chạm, hoá chất... gây phản ứng.","level":"NB","points":0.25},{"type":"mcq","q":"Mọi sinh vật đều có khả năng cảm ứng?","options":["A. có","B. không","C. chỉ động vật","D. chỉ thực vật"],"answer":"A","explain":"Cảm ứng là đặc trưng của sự sống, có ở mọi sinh vật.","level":"TH","points":0.25},{"type":"mcq","q":"Cảm ứng là đặc trưng của","options":["A. sự sống","B. vật vô sinh","C. đá","D. nước"],"answer":"A","explain":"Cảm ứng cùng trao đổi chất, sinh trưởng, sinh sản là đặc trưng sự sống.","level":"TH","points":0.25},{"type":"mcq","q":"Cá bơi về phía có thức ăn là biểu hiện của","options":["A. cảm ứng (hướng hoá)","B. hoàn toàn ngẫu nhiên","C. bị đuổi","D. tập tính di cư"],"answer":"A","explain":"Cá nhận biết chất hoá học từ thức ăn và bơi đến — cảm ứng hướng hoá.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao sinh vật cần cảm ứng để tồn tại?","options":["A. nhận biết thay đổi môi trường để phản ứng kịp thời","B. để cho vui","C. để tốn năng lượng","D. không cần thiết"],"answer":"A","explain":"Không cảm ứng: không tránh được nguy hiểm, không tìm được thức ăn → khó tồn tại.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét tổng quát về cảm ứng.","statements":["a) Là đặc trưng của sự sống","b) Gồm nhận kích thích và phản ứng","c) Giúp sinh vật thích nghi","d) Chỉ có ở người"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: mọi sinh vật đều có cảm ứng.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về vai trò của cảm ứng.","statements":["a) Giúp tránh nguy hiểm","b) Giúp tìm thức ăn","c) Giúp sinh sản hiệu quả","d) Không có vai trò gì"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cảm ứng rất quan trọng cho sự tồn tại.","level":"TH","points":1},{"type":"short","q":"Tác nhân từ môi trường gây ra phản ứng của sinh vật gọi là gì?","answer":"Kích thích","explain":"Kích thích: ánh sáng, nhiệt độ, va chạm, hoá chất...","level":"VD","points":0.5},{"type":"short","q":"Khả năng phản ứng lại kích thích của sinh vật gọi là gì?","answer":"Cảm ứng","explain":"Cảm ứng là đặc trưng cơ bản của sự sống.","level":"VDC","points":0.5}]}]}
