ùng biện pháp sinh học","c) Bảo vệ thiên địch","d) Phun thuốc càng nhiều càng tốt"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: lạm dụng thuốc hại môi trường.","level":"TH","points":1},{"type":"short","q":"Sâu bọ bị thu hút bởi ánh đèn thể hiện tính gì?","answer":"Hướng sáng","explain":"Sâu bọ hướng sáng dương — bị đèn thu hút.","level":"VD","points":0.5},{"type":"short","q":"Biện pháp dùng thiên địch, bẫy sinh học diệt sâu gọi là biện pháp gì?","answer":"Sinh học","explain":"Biện pháp sinh học thân thiện môi trường.","level":"VDC","points":0.5}]}]}
