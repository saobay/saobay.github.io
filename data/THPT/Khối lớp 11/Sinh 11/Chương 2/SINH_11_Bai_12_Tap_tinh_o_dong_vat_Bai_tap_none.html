ẹp","D. dễ làm"],"answer":"A","explain":"Bẫy sinh học đặc hiệu, không gây ô nhiễm như thuốc trừ sâu.","level":"TH","points":0.25},{"type":"mcq","q":"Bảo tồn rùa biển cần chú trọng","options":["A. bảo vệ bãi đẻ trứng (tập tính sinh sản)","B. cấm đánh bắt hoàn toàn","C. nuôi nhốt hết","D. di dời đi nơi khác"],"answer":"A","explain":"Rùa về đúng bãi cũ đẻ trứng — bảo vệ bãi đẻ là then chốt.","level":"TH","points":0.25},{"type":"mcq","q":"Người ta làm giá cho chim yến làm tổ để","options":["A. thu hoạch tổ yến (tập tính làm tổ sinh sản)","B. nuôi chim cảnh","C. làm đẹp nhà","D. giữ nhà"],"answer":"A","explain":"Yến làm tổ bằng nước bọt để sinh sản — con người thu hoạch tổ.","level":"VD","points":0.25},{"type":"mcq","q":"Hiểu tập tính di cư của động vật giúp","options":["A. bảo vệ hành lang di cư của chúng","B. săn bắt dễ hơn","C. nuôi nhốt","D. xua đuổi"],"answer":"A","explain":"Bảo vệ đường di cư, điểm dừng chân — bảo tồn loài di cư.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về ứng dụng tập tính.","statements":["a) Huấn luyện vật nuôi","b) Bảo tồn động vật hoang dã","c) Bẫy sinh học trừ sâu hại","d) Không ứng dụng được gì"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: tập tính ứng dụng rộng rãi.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về bẫy pheromone.","statements":["a) Dẫn dụ côn trùng đến bẫy","b) Ít độc hại môi trường","c) Dựa vào tập tính sinh sản","d) Là một loại thuốc trừ sâu"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: bẫy sinh học, không phải thuốc hoá học.","level":"TH","points":1},{"type":"short","q":"Dùng bẫy dẫn dụ thay thuốc trừ sâu gọi là biện pháp gì?","answer":"Sinh học","explain":"Biện pháp sinh học: dùng thiên địch, bẫy pheromone...","level":"VD","points":0.5},{"type":"short","q":"Chất hoá học do côn trùng tiết ra để dẫn dụ bạn tình gọi là gì?","answer":"Pheromone","explain":"Pheromone giới tính dẫn dụ bạn tình — dùng làm bẫy.","level":"VDC","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Sói săn mồi theo bầy là tập tính","options":["A. kiếm ăn có tính xã hội","B. di cư","C. bảo vệ lãnh thổ","D. sinh sản"],"answer":"A","explain":"Săn theo bầy: phối hợp, hiệu quả hơn săn đơn lẻ.","level":"NB","points":0.25},{"type":"mcq","q":"Hươu đực húc nhau vào mùa sinh sản để","options":["A. tranh giành bạn tình","B. chơi đùa","C. tập thể dục","D. đánh nhau thật"],"answer":"A","explain":"Con đực khoẻ thắng được quyền giao phối — chọn lọc giới tính.","level":"NB","points":0.25},{"type":"mcq","q":"Con đầu đàn trong bầy có vai trò","options":["A. dẫn dắt và bảo vệ bầy","B. ăn trước","C. ngủ nhiều","D. làm đẹp"],"answer":"A","explain":"Đầu đàn dẫn đường, cảnh báo nguy hiểm, bảo vệ bầy.","level":"TH","points":0.25},{"type":"mcq","q":"Khỉ bắt chấy cho nhau là","options":["A. tập tính xã hội gắn kết bầy","B. vệ sinh","C. kiếm ăn","D. chơi đùa"],"answer":"A","explain":"Grooming củng cố quan hệ xã hội trong bầy khỉ.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao trâu rừng tụ thành bầy khi có thú dữ?","options":["A. bảo vệ lẫn nhau","B. vì sợ","C. để chạy nhanh","D. cho đông vui"],"answer":"A","explain":"Sống bầy: phát hiện sớm, chống trả chung — tăng sống sót.","level":"VD","points":0.25},{"type":"mcq","q":"Ong thợ đốt kẻ thù rồi chết vì","options":["A. bảo vệ tổ (tập tính vị tha)","B. để tự vệ","C. do tai nạn","D. vì đã già"],"answer":"A","explain":"Hi sinh cá thể vì cả đàn — tập tính xã hội vị tha.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về săn mồi theo bầy.","statements":["a) Hiệu quả hơn săn đơn lẻ","b) Là tập tính xã hội","c) Có sự phối hợp, phân công","d) Không có lợi ích gì"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: săn bầy hạ được mồi lớn, ít rủi ro.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về con đầu đàn.","statements":["a) Dẫn dắt bầy đàn","b) Được ưu tiên sinh sản","c) Bảo vệ bầy","d) Không có vai trò gì"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: đầu đàn quan trọng với bầy.","level":"TH","points":1},{"type":"short","q":"Sói săn mồi theo bầy thuộc loại tập tính nào?","answer":"Xã hội","explain":"Săn theo bầy có phối hợp — tập tính xã hội.","level":"VD","points":0.5},{"type":"short","q":"Ong thợ hi sinh thân mình bảo vệ tổ thể hiện tính gì?","answer":"Vị tha","explain":"Hi sinh vì lợi ích cả đàn — tính vị tha của xã hội côn trùng.","level":"VDC","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","q":"Ếch đực kêu vào mùa sinh sản để","options":["A. thu hút bạn tình","B. vui đùa","C. báo mưa","D. xua muỗi"],"answer":"A","explain":"Tiếng kêu gọi bạn tình — tập tính sinh sản.","level":"NB","points":0.25},{"type":"mcq","q":"Ve sầu kêu râm ran mùa hè để","options":["A. thu hút bạn tình","B. kêu cho vui","C. báo trời nóng","D. gọi bầy"],"answer":"A","explain":"Ve đực kêu gọi ve cái giao phối.","level":"NB","points":0.25},{"type":"mcq","q":"Tiếng kêu của ếch đực là tập tính","options":["A. sinh sản","B. kiếm ăn","C. bảo vệ lãnh thổ","D. di cư"],"answer":"A","explain":"Kêu gọi bạn tình — tập tính sinh sản.","level":"TH","points":0.25},{"type":"mcq","q":"Đom đóm phát sáng để","options":["A. thu hút bạn tình","B. soi đường","C. làm đẹp","D. xua thú dữ"],"answer":"A","explain":"Ánh sáng nhấp nháy là tín hiệu gọi bạn tình.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao thường chỉ con đực có màu sắc sặc sỡ?","options":["A. để thu hút con cái (chọn lọc giới tính)","B. để đẹp","C. để nguỵ trang","D. vì sợ"],"answer":"A","explain":"Con cái chọn con đực đẹp, khoẻ — chọn lọc giới tính.","level":"VD","points":0.25},{"type":"mcq","q":"Công đực xoè đuôi múa, công cái chọn con đẹp nhất — đây là","options":["A. chọn lọc giới tính","B. hoàn toàn ngẫu nhiên","C. do may mắn","D. bị ép buộc"],"answer":"A","explain":"Cái chọn đực có đặc điểm hấp dẫn — chọn lọc giới tính.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về tập tính sinh sản.","statements":["a) Thu hút bạn tình","b) Giao phối và đẻ trứng","c) Chăm sóc con non","d) Không cần thiết"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: sinh sản duy trì nòi giống.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về tín hiệu sinh sản.","statements":["a) Bằng tiếng kêu","b) Bằng màu sắc","c) Bằng vũ điệu","d) Bằng im lặng hoàn toàn"],"answer":["T","T","T","F"],"explain":"a, b, c đúng là tín hiệu thu hút bạn tình. d sai.","level":"TH","points":1},{"type":"short","q":"Ếch đực kêu vào mùa sinh sản để làm gì?","answer":"Thu hút bạn tình","explain":"Tiếng kêu gọi ếch cái đến giao phối.","level":"VD","points":0.5},{"type":"short","q":"Hiện tượng con cái chọn con đực có đặc điểm hấp dẫn gọi là gì?","answer":"Chọn lọc giới tính","explain":"Chọn lọc giới tính: cái chọn đực qua màu sắc, vũ điệu, tiếng kêu.","level":"VDC","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","q":"Tập tính giúp động vật","options":["A. thích nghi và tồn tại","B. biết bay","C. biết bơi","D. ngủ ngon"],"answer":"A","explain":"Tập tính giúp tìm thức ăn, tránh kẻ thù, sinh sản — thích nghi, tồn tại.","level":"NB","points":0.25},{"type":"mcq","q":"Nghiên cứu tập tính động vật thuộc lĩnh vực","options":["A. tập tính học","B. giải phẫu học","C. di truyền học","D. sinh thái học"],"answer":"A","explain":"Tập tính học (ethology) nghiên cứu hành vi động vật.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao cùng một loài, tập tính có thể khác nhau giữa các quần thể?","options":["A. tập tính học được khác nhau theo môi trường","B. gen khác nhau","C. hoàn toàn ngẫu nhiên","D. tuổi khác nhau"],"answer":"A","explain":"Môi trường khác nhau → kinh nghiệm học được khác nhau.","level":"TH","points":0.25},{"type":"mcq","q":"Tập tính bẩm sinh và học được trong một hành vi thường","options":["A. pha trộn với nhau","B. tách biệt hoàn toàn","C. đối kháng nhau","D. không liên quan"],"answer":"A","explain":"Nhiều hành vi vừa có nền bẩm sinh vừa được hoàn thiện qua học.","level":"TH","points":0.25},{"type":"mcq","q":"Chó vừa sủa người lạ vừa biết ngồi theo lệnh vì","options":["A. pha trộn tập tính bẩm sinh và học được","B. rất thông minh","C. được dạy tất cả","D. hoàn toàn ngẫu nhiên"],"answer":"A","explain":"Sủa người lạ: bản năng; ngồi theo lệnh: học được.","level":"VD","points":0.25},{"type":"mcq","q":"Bảo tồn động vật hoang dã cần hiểu tập tính vì","options":["A. bảo vệ đúng nơi cư trú, mùa sinh sản, đường di cư","B. để cho đẹp","C. để nuôi nhốt","D. để săn bắt"],"answer":"A","explain":"Hiểu tập tính mới bảo vệ đúng nơi ở, bãi đẻ, đường di cư.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét tổng quát về tập tính.","statements":["a) Là chuỗi các hành động","b) Phản ứng với kích thích","c) Gồm bẩm sinh và học được","d) Chỉ có ở người"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: mọi động vật đều có tập tính.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về nghiên cứu tập tính.","statements":["a) Giúp hiểu động vật","b) Giúp bảo tồn loài","c) Giúp huấn luyện vật nuôi","d) Là việc vô ích"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: nghiên cứu tập tính rất có ích.","level":"TH","points":1},{"type":"short","q":"Môn khoa học chuyên nghiên cứu tập tính động vật có tên là gì?","answer":"Tập tính học","explain":"Tập tính học (ethology) nghiên cứu hành vi động vật.","level":"VD","points":0.5},{"type":"short","q":"Nhà khoa học nào nổi tiếng với nghiên cứu tập tính của ngỗng trời?","answer":"Lorenz","explain":"Lorenz nghiên cứu hiện tượng in vết ở ngỗng trời.","level":"VDC","points":0.5}]}]}
