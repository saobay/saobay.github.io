. cây cao","C. cây ra hoa","D. chống đổ"],"answer":"A","explain":"Đốn ngọn: cây thấp, tán rộng, thuận tiện thu hái.","level":"VD","points":0.25},{"type":"mcq","q":"Ưu thế ngọn là hiện tượng","options":["A. chồi ngọn ức chế chồi bên","B. chồi bên phát triển mạnh","C. rễ phát triển mạnh","D. lá to"],"answer":"A","explain":"Auxin từ ngọn ức chế chồi bên — ưu thế ngọn.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về bấm ngọn.","statements":["a) Làm mất ưu thế ngọn","b) Chồi bên phát triển","c) Cây xum xuê hơn","d) Cây ngừng sinh trưởng"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cây vẫn sinh trưởng, theo hướng khác.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về ưu thế ngọn.","statements":["a) Do auxin từ ngọn","b) Ức chế chồi bên","c) Bấm ngọn phá ưu thế","d) Không có ý nghĩa thực tiễn"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: ứng dụng trong tỉa cành, đốn cây.","level":"TH","points":1},{"type":"short","q":"Bấm ngọn cây để làm gì? (trả lời ngắn)","answer":"Ra nhiều cành","explain":"Mất ưu thế ngọn → chồi bên phát triển, nhiều cành.","level":"VD","points":0.5},{"type":"short","q":"Chồi ngọn ức chế chồi bên gọi là hiện tượng gì?","answer":"Ưu thế ngọn","explain":"Ưu thế ngọn do auxin từ chồi ngọn.","level":"VDC","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","q":"Tầng sinh mạch tạo ra","options":["A. gỗ và libe thứ cấp","B. lá","C. hoa","D. rễ"],"answer":"A","explain":"Tầng sinh mạch: phía trong tạo gỗ, phía ngoài tạo libe thứ cấp.","level":"NB","points":0.25},{"type":"mcq","q":"Tầng sinh bần tạo ra","options":["A. lớp bần bảo vệ","B. gỗ","C. lá","D. hoa"],"answer":"A","explain":"Tầng sinh bần tạo bần (vỏ) bảo vệ thân cây gỗ.","level":"NB","points":0.25},{"type":"mcq","q":"Gỗ là sản phẩm của","options":["A. tầng sinh mạch","B. tầng sinh bần","C. mô phân sinh đỉnh","D. lá"],"answer":"A","explain":"Gỗ thứ cấp do tầng sinh mạch tạo ra phía trong.","level":"TH","point ne (auxin, gibberellin...) điều hoà sinh trưởng, phát triển.","level":"NB","points":0.25},{"type":"mcq","q":"Quang chu kì là","options":["A. thời gian chiếu sáng trong ngày ảnh hưởng ra hoa","B. cường độ sáng","C. màu sắc ánh sáng","D. quang hợp"],"answer":"A","explain":"Quang chu kì: độ dài ngày/đêm điều khiển ra hoa.","level":"NB","points":0.25},{"type":"mcq","q":"Cây ngày ngắn ra hoa khi","options":["A. ngày ngắn hơn giá trị tới hạn","B. ngày dài","C. bất kì","D. không bao giờ"],"answer":"A","explain":"Cây ngày ngắn (cúc, đậu): ra hoa khi ngày ngắn/đêm dài.","level":"TH","points":0.25},{"type":"mcq","q":"Cây ngày dài ra hoa khi","options":["A. ngày dài hơn giá trị tới hạn","B. ngày ngắn","C. bất kì","D. không bao giờ"],"answer":"A","explain":"Cây ngày dài (hành, cà rốt): ra hoa khi ngày dài.","level":"TH","points":0.25},{"type":"mcq","q":"Thắp đèn ban đêm cho cúc để","options":["A. kìm hãm ra hoa (cúc là cây ngày ngắn)","B. kích thích ra hoa","C. cho sáng","D. chống trộm"],"answer":"A","explain":"Đêm bị ngắt sáng → cúc (ngày ngắn) không ra hoa, kéo dài sinh trưởng.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao trồng hoa cúc Tết phải thắp đèn?","options":["A. điều khiển thời điểm ra hoa đúng Tết","B. cho đẹp","C. chống sâu","D. sưởi ấm"],"answer":"A","explain":"Thắp đèn điều khiển quang chu kì → cúc nở đúng dịp Tết.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về quang chu kì.","statements":["a) Là độ dài ngày đêm","b) Ảnh hưởng ra hoa","c) Có cây ngày ngắn, ngày dài","d) Không ảnh hưởng thực vật"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: quang chu kì điều khiển ra hoa.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về ứng dụng.","statements":["a) Thắp đèn điều khiển ra hoa","b) Trồng trái vụ","c) Dựa vào quang chu kì","d) Không ứng dụng được"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: ứng dụng rộng trong trồng trọt.","level":"TH","points":1},{"type":"short","q"
