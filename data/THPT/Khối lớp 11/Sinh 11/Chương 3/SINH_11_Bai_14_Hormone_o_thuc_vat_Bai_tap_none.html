s":["A. gibberellin","B. ABA","C. ethylene","D. nước lạnh"],"answer":"A","explain":"Gibberellin đối kháng ABA, kích thích nảy mầm.","level":"NB","points":0.25},{"type":"mcq","q":"ABA và gibberellin có quan hệ","options":["A. đối kháng nhau","B. hỗ trợ nhau","C. không liên quan","D. giống nhau"],"answer":"A","explain":"ABA gây ngủ, GA phá ngủ — đối kháng.","level":"TH","points":0.25},{"type":"mcq","q":"Bảo quản hạt giống lâu nhờ","options":["A. duy trì trạng thái ngủ (ABA)","B. phun GA","C. ngâm nước","D. phơi nắng"],"answer":"A","explain":"Giữ hạt ngủ (khô, lạnh) → bảo quản lâu không nảy mầm.","level":"TH","points":0.25},{"type":"mcq","q":"Hạt lúa nảy mầm trên bông khi mưa nhiều vì","options":["A. ABA bị rửa trôi, mất ngủ","B. thừa GA","C. thiếu nước","D. ngẫu nhiên"],"answer":"A","explain":"Mưa rửa trôi ABA → hạt mất ngủ, nảy mầm ngay trên bông.","level":"VD","points":0.25},{"type":"mcq","q":"Xử lí hạt giống bằng gibberellin trước khi gieo để","options":["A. nảy mầm nhanh, đều","B. diệt sâu","C. cho nặng","D. chống mốc"],"answer":"A","explain":"GA phá ngủ, kích nảy mầm đồng đều.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về ngủ hạt.","statements":["a) Do ABA","b) Giúp hạt vượt qua điều kiện xấu","c) GA phá ngủ","d) Ngủ là hạt chết"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: ngủ là trạng thái sinh lí, hạt còn sống.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về bảo quản hạt.","statements":["a) Giữ khô ráo","b) Giữ lạnh","c) Duy trì ngủ","d) Ngâm nước liên tục"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: ngâm nước kích nảy mầm, dễ mốc.","level":"TH","points":1},{"type":"short","q":"Hormone nào gây ngủ hạt?","answer":"ABA","explain":"Abscisic acid gây ngủ hạt, chồi.","level":"VD","points":0.5},{"type":"short","q":"Hormone nào phá ngủ hạt?","answer":"Gibberellin","explain":"Gibberellin đối kháng ABA, kích nảy mầm.","level":"VDC","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","q":"Lá vàng, rụng vào mùa thu do","options":["A. ABA và ethylene tăng","B. auxin tăng","C. GA tăng","D. cytokinin tăng"],"answer":"A","explain":"Mùa thu: ABA, ethylene tăng → tạo tầng rời, lá rụng.","level":"NB","points":0.25},{"type":"mcq","q":"Tầng rời ở cuống lá hình thành nhờ","options":["A. ethylene","B. auxin","C. GA","D. cytokinin"],"answer":"A","explain":"Ethylene kích thích tạo tầng rời → rụng lá, quả.","level":"NB","points":0.25},{"type":"mcq","q":"Giữ hoa quả tươi lâu bằng cách","options":["A. ức chế ethylene","B. tăng ethylene","C. tăng ABA","D. phơi nắng"],"answer":"A","explain":"Ức chế ethylene → chậm chín, chậm rụng → bảo quản lâu.","level":"TH","points":0.25},{"type":"mcq","q":"Bảo quản rau quả trong kho lạnh giúp","options":["A. giảm sinh ethylene, chậm chín","B. tăng ethylene","C. diệt sâu","D. cho đẹp"],"answer":"A","explain":"Lạnh: trao đổi chất chậm, ít ethylene → chậm chín, thối.","level":"TH","points":0.25},{"type":"mcq","q":"Quả cà chua xanh để cùng chuối chín sẽ chín nhanh vì","options":["A. ethylene từ chuối chín kích thích","B. hơi ấm","C. màu sắc","D. ngẫu nhiên"],"answer":"A","explain":"Quả chín sinh ethylene kích quả xanh lân cận chín theo.","level":"VD","points":0.25},{"type":"mcq","q":"Không nên để quả chín lẫn quả xanh khi bảo quản vì","options":["A. ethylene làm quả xanh chín nhanh, hỏng","B. nặng","C. mất chỗ","D. không đẹp"],"answer":"A","explain":"Ethylene từ quả chín thúc quả xanh chín nhanh, khó bảo quản.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về rụng lá.","statements":["a) Do ethylene","b) Do ABA","c) Có tầng rời","d) Do auxin tăng"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: auxin giảm, ethylene/ABA tăng gây rụng.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về bảo quản quả.","statements":["a) Lạnh làm chậm chín","b) Ức chế ethylene","c) Tách quả chín khỏi quả xanh","d) Ủ nóng cho lâu hỏng"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: nóng thúc chín, nhanh hỏng.","level":"TH","points":1},{"type":"short","q":"Khí nào thúc quả chín?","answer":"Ethylene","explain":"Ethylene là hormone khí thúc chín quả.","level":"VD","points":0.5},{"type":"short","q":"Muốn bảo quản quả lâu cần ức chế hormone nào?","answer":"Ethylene","explain":"Ức chế ethylene → chậm chín, chậm rụng.","level":"VDC","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","q":"Auxin vận chuyển trong cây theo hướng","options":["A. từ ngọn xuống gốc (hướng gốc)","B. từ gốc lên ngọn","C. ngẫu nhiên","D. không vận chuyển"],"answer":"A","explain":"Auxin vận chuyển hướng gốc (từ đỉnh xuống) — vận chuyển phân cực.","level":"NB","points":0.25},{"type":"mcq","q":"Cytokinin vận chuyển trong cây theo hướng","options":["A. từ rễ lên ngọn","B. từ ngọn xuống rễ","C. ngẫu nhiên","D. không vận chuyển"],"answer":"A","explain":"Cytokinin từ rễ theo mạch gỗ lên trên.","level":"NB","points":0.25},{"type":"mcq","q":"Hướng động của thân do","options":["A. auxin phân bố không đều hai phía","B. GA","C. cytokinin","D. ABA"],"answer":"A","explain":"Auxin nhiều phía tối → sinh trưởng nhanh → cong về sáng.","level":"TH","points":0.25},{"type":"mcq","q":"Phía tối của thân có nhiều auxin hơn phía sáng vì","options":["A. auxin di chuyển tránh sáng","B. sáng tạo auxin","C. ngẫu nhiên","D. gió"],"answer":"A","explain":"Ánh sáng làm auxin di chuyển sang phía tối.","level":"TH","points":0.25},{"type":"mcq","q":"Rễ cong xuống đất vì","options":["A. auxin tập trung mặt dưới ức chế sinh trưởng","B. auxin kích thích mặt dưới","C. GA","D. ngẫu nhiên"],"answer":"A","explain":"Rễ nhạy auxin: nồng độ cao mặt dưới ức chế → mặt trên dài nhanh → cong xuống.","level":"VD","points":0.25},{"type":"mcq","q":"Nồng độ auxin cao ức chế rễ nhưng kích thích thân chứng tỏ","options":["A. các cơ quan nhạy cảm khác nhau với auxin","B. auxin vô dụng","C. rễ không cần auxin","D. ngẫu nhiên"],"answer":"A","explain":"Độ nhạy giảm dần: rễ, chồi rồi thân; cùng nồng độ tác dụng khác nhau.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về vận chuyển hormone.","statements":["a) Auxin đi từ ngọn xuống","b) Cytokinin đi từ rễ lên","c) Vận chuyển có hướng","d) Không vận chuyển"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: hormone vận chuyển trong cây.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về hướng động.","statements":["a) Do auxin phân bố không đều","b) Phía tối nhiều auxin hơn","c) Thân cong về phía sáng","d) Không liên quan hormone"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: hướng động do auxin.","level":"TH","points":1},{"type":"short","q":"Auxin vận chuyển theo hướng nào?","answer":"Từ ngọn xuống gốc","explain":"Vận chuyển phân cực hướng gốc.","level":"VD","points":0.5},{"type":"short","q":"Phía nào của thân có nhiều auxin hơn khi chiếu sáng một bên?","answer":"Phía tối","explain":"Auxin di chuyển tránh sáng → phía tối nhiều hơn.","level":"VDC","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Chất độc da cam chứa auxin nhân tạo gây","options":["A. rối loạn sinh trưởng, cây chết","B. cây tốt","C. quả to","D. không ảnh hưởng"],"answer":"A","explain":"Auxin nhân tạo liều cao: rối loạn sinh trưởng → diệt cỏ, cây chết.","level":"NB","points":0.25},{"type":"mcq","q":"Thuốc diệt cỏ 2,4-D là","options":["A. auxin nhân tạo","B. GA nhân tạo","C. cytokinin","D. ABA"],"answer":"A","explain":"2,4-D: auxin tổng hợp, liều cao diệt cỏ dại.","level":"NB","points":0.25},{"type":"mcq","q":"Liều lượng hormone quyết định","options":["A. tác dụng kích thích hay ức chế","B. không gì","C. màu sắc","D. mùi"],"answer":"A","explain":"Liều thấp kích thích, liều cao ức chế — tác dụng phụ thuộc nồng độ.","level":"TH","points":0.25},{"type":"mcq","q":"Sử dụng hormone trong nông nghiệp cần","options":["A. đúng liều, đúng lúc, đúng cách","B. càng nhiều càng tốt","C. tuỳ ý","D. không cần"],"answer":"A","explain":"Sai liều/lúc gây hại cây, tồn dư — phải đúng quy trình.","level":"TH","points":0.25},{"type":"mcq","q":"Phun thuốc kích thích ra hoa sai thời điểm có thể","options":["A. làm cây ra hoa kém, mất mùa","B. không sao","C. cây tốt hơn","D. quả to"],"answer":"A","explain":"Sai thời điểm: rối loạn sinh lí, ra hoa kém.","level":"VD","points":0.25},{"type":"mcq","q":"Tồn dư hormone trong nông sản gây","options":["A. lo ngại cho sức khoẻ người dùng","B. không sao","C. ngon hơn","D. bổ hơn"],"answer":"A","explain":"Lạm dụng hormone: tồn dư ảnh hưởng sức khoẻ — cần tuân thủ quy định.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về liều lượng.","statements":["a) Liều thấp kích thích","b) Liều cao ức chế","c) Cần đúng liều","d) Càng nhiều càng tốt"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: liều cao gây hại.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về an toàn.","statements":["a) Đúng liều, đúng lúc","b) Tuân thủ thời gian cách li","c) Lạm dụng gây tồn dư","d) Dùng tuỳ ý"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: phải theo quy định.","level":"TH","points":1},{"type":"short","q":"Thuốc diệt cỏ 2,4-D thuộc nhóm hormone nào?","answer":"Auxin","explain":"2,4-D là auxin tổng hợp.","level":"VD","points":0.5},{"type":"short","q":"Dùng hormone trong nông nghiệp cần tuân thủ nguyên tắc gì? (ngắn)","answer":"Đúng liều","explain":"Đúng liều, đúng lúc, đúng cách.","level":"VDC","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","q":"Số lượng hormone thực vật đã biết là","options":["A. 5 nhóm chính","B. 1","C. 2","D. 100"],"answer":"A","explain":"5 nhóm: auxin, gibberellin, cytokinin, ABA, ethylene.","level":"NB","points":0.25},{"type":"mcq","q":"Hormone thực vật khác hormone động vật ở","options":["A. không có tuyến nội tiết chuyên biệt","B. phức tạp hơn","C. đơn giản hơn","D. không khác"],"answer":"A","explain":"TV không có tuyến nội tiết; hormone tạo ở nhiều cơ quan.","level":"NB","points":0.25},{"type":"mcq","q":"Mỗi hormone thực vật","options":["A. có nhiều tác dụng khác nhau","B. chỉ một tác dụng","C. không tác dụng","D. chỉ ở một cơ quan"],"answer":"A","explain":"Một hormone nhiều tác dụng; một quá trình chịu nhiều hormone.","level":"TH","points":0.25},{"type":"mcq","q":"Một quá trình sinh lí ở cây thường chịu","options":["A. nhiều hormone phối hợp","B. một hormone","C. không hormone nào","D. ngẫu nhiên"],"answer":"A","explain":"Các hormone tương tác, cân bằng điều hoà quá trình.","level":"TH","points":0.25},{"type":"mcq","q":"Nghiên cứu hormone thực vật bắt đầu từ","options":["A. thí nghiệm hướng sáng của Darwin","B. Mendel","C. Pavlov","D. Morgan"],"answer":"A","explain":"Darwin (cha con): thí nghiệm bao che ngọn mầm → phát hiện chất gây cong (auxin).","level":"VD","points":0.25},{"type":"mcq","q":"Darwin phát hiện ra","options":["A. ngọn mầm cảm nhận ánh sáng, truyền tín hiệu xuống","B. gene","C. quang hợp","D. hô hấp"],"answer":"A","explain":"Che ngọn → không cong; che thân → vẫn cong → ngọn cảm nhận, truyền tín hiệu.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu tổng kết.","statements":["a) Có 5 nhóm hormone","b) 3 nhóm kích thích","c) 2 nhóm ức chế","d) Chỉ có 1 hormone"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về đặc điểm.","statements":["a) Mỗi hormone nhiều tác dụng","b) Các hormone tương tác","c) Không có tuyến nội tiết","d) Lượng lớn mới tác dụng"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: lượng rất nhỏ đã hiệu quả.","level":"TH","points":1},{"type":"short","q":"Có mấy nhóm hormone thực vật chính?","answer":"5","explain":"Auxin, gibberellin, cytokinin, ABA, ethylene.","level":"VD","points":0.5},{"type":"short","q":"Ai phát hiện ra chất gây hướng sáng (auxin)?","answer":"Darwin","explain":"Cha con Darwin với thí nghiệm mầm yến mạch.","level":"VDC","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","q":"Bài 14 nghiên cứu về","options":["A. hormone ở thực vật","B. hormone ở động vật","C. enzyme","D. vitamin"],"answer":"A","explain":"Bài 14: Hormone ở thực vật — 5 nhóm chính.","level":"NB","points":0.25},{"type":"mcq","q":"Vai trò chung của hormone thực vật là","options":["A. điều tiết sinh trưởng, phát triển","B. quang hợp","C. hô hấp","D. hút nước"],"answer":"A","explain":"Hormone điều hoà mọi hoạt động sống của cây.","level":"NB","points":0.25},{"type":"mcq","q":"Ứng dụng hormone trong nhân giống","options":["A. auxin giâm cành, cytokinin nuôi cấy mô","B. chỉ tưới nước","C. chỉ bón phân","D. không ứng dụng"],"answer":"A","explain":"Auxin ra rễ giâm/chiết; tỉ lệ auxin/cytokinin trong nuôi cấy mô.","level":"TH","points":0.25},{"type":"mcq","q":"Ứng dụng hormone trong điều khiển ra hoa, quả","options":["A. GA tạo quả không hạt, ethylene thúc chín","B. chỉ để tự nhiên","C. không điều khiển được","D. chỉ cắt tỉa"],"answer":"A","explain":"GA: quả không hạt; ethylene: thúc chín; thắp đèn: quang chu kì.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao nông dân ủ chuối bằng hương?","options":["A. hương cháy sinh ethylene thúc chín","B. cho thơm","C. chống ruồi","D. cho đẹp"],"answer":"A","explain":"Khói hương có ethylene → chuối chín đều, nhanh.","level":"VD","points":0.25},{"type":"mcq","q":"Muốn hoa nở đúng Tết, người trồng","options":["A. điều khiển ánh sáng, nhiệt độ, hormone","B. để tự nhiên","C. tưới nhiều","D. bón nhiều phân"],"answer":"A","explain":"Điều khiển quang chu kì, nhiệt, hormone → hoa nở đúng dịp.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét tổng kết về ứng dụng hormone.","statements":["a) Auxin kích ra rễ","b) GA tạo quả không hạt","c) Ethylene thúc chín","d) Không ứng dụng được"],"answer":["T","T","T","F"],"explain":"a, b, c đúng là ứng dụng phổ biến. d sai.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về sử dụng an toàn.","statements":["a) Đúng liều lượng","b) Đúng thời điểm","c) Có thời gian cách li","d) Dùng càng nhiều càng tốt"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: lạm dụng gây hại, tồn dư.","level":"TH","points":1},{"type":"short","q":"Hormone nào dùng để giâm cành ra rễ?","answer":"Auxin","explain":"Auxin kích thích ra rễ ở cành giâm, chiết.","level":"VD","points":0.5},{"type":"short","q":"Ủ chín quả dùng hormone nào?","answer":"Ethylene","explain":"Ethylene thúc quả chín.","level":"VDC","points":0.5}]}]}
