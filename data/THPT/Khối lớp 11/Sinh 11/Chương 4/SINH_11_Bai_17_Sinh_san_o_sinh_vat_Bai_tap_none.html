ngọn) gắn vào gốc ghép.","level":"TH","points":0.25},{"type":"mcq","q":"Cây ăn quả ghép gồm","options":["A. gốc ghép và cành ghép","B. chỉ gốc","C. chỉ cành","D. hạt"],"answer":"A","explain":"Gốc ghép (rễ khoẻ) + cành ghép (giống tốt).","level":"TH","points":0.25},{"type":"mcq","q":"Ưu điểm của ghép là","options":["A. kết hợp ưu điểm gốc khoẻ và giống tốt","B. nhanh","C. rẻ","D. tất cả các ý trên"],"answer":"D","explain":"Ghép: gốc khoẻ + quả ngon, nhanh cho quả — cả 3 ý.","level":"VD","points":0.25},{"type":"mcq","q":"Xoài, nhãn, bưởi thường nhân giống bằng","options":["A. ghép, chiết","B. gieo hạt","C. phân đôi","D. nảy chồi"],"answer":"A","explain":"Cây ăn quả: ghép, chiết giữ nguyên giống tốt, nhanh cho quả.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về nhân giống vô tính.","statements":["a) Giâm cành từ đoạn cành","b) Chiết cành khoanh vỏ","c) Ghép kết hợp 2 cây","d) Đều từ hạt"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: vô tính không từ hạt.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về ưu điểm.","statements":["a) Giữ giống tốt","b) Nhanh cho thu hoạch","c) Rẻ","d) Tạo giống mới"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: vô tính không tạo giống mới.","level":"TH","points":1},{"type":"short","q":"Kĩ thuật gắn cành tốt lên gốc khoẻ gọi là gì?","answer":"Ghép cành","explain":"Ghép: cành ghép + gốc ghép.","level":"VD","points":0.5},{"type":"short","q":"Khoanh vỏ bó bầu cho ra rễ gọi là gì?","answer":"Chiết cành","explain":"Chiết cành dựa vào khoanh vỏ.","level":"VDC","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","q":"Nuôi cấy mô là","options":["A. nuôi mô tế bào trong ống nghiệm tạo cây mới","B. gieo hạt","C. giâm cành","D. ghép"],"answer":"A","explain":"Mô phân sinh nuôi trong môi trường nhân tạo → cây con.","level":"NB","points":0.25},{"type":"mcq","q":"Ưu điểm của nuôi cấy mô","options":["A. nhân nhanh số lượng lớn, sạch bệnh","B. rẻ","C. đơn giản","D. không cần kĩ thuật"],"answer":"A","explain":"Nhân hàng nghìn cây từ một mô, sạch virus.","level":"NB","points":0.25},{"type":"mcq","q":"Nuôi cấy mô cần","options":["A. vô trùng tuyệt đối","B. không cần gì","C. đất","D. phân"],"answer":"A","explain":"Nhiễm khuẩn → mô chết — cần vô trùng.","level":"TH","points":0.25},{"type":"mcq","q":"Cây con từ nuôi cấy mô","options":["A. giống hệt cây mẹ","B. khác cây mẹ","C. đa dạng","D. nửa giống"],"answer":"A","explain":"Vô tính: nguyên phân → giống hệt mẹ.","level":"TH","points":0.25},{"type":"mcq","q":"Nhân giống lan quý thường dùng","options":["A. nuôi cấy mô","B. gieo hạt","C. phân đôi","D. ngẫu nhiên"],"answer":"A","explain":"Lan hạt nhỏ khó gieo → nuôi cấy mô nhân nhanh.","level":"VD","points":0.25},{"type":"mcq","q":"Sản xuất khoai tây giống sạch bệnh dùng","options":["A. nuôi cấy mô","B. củ thường","C. hạt","D. lá"],"answer":"A","explain":"Nuôi cấy mô tạo giống sạch virus.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về nuôi cấy mô.","statements":["a) Từ mô tế bào","b) Nhân nhanh số lượng lớn","c) Sạch bệnh","d) Tạo giống mới"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: giống hệt mẹ, không mới.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về điều kiện.","statements":["a) Cần vô trùng","b) Môi trường dinh dưỡng","c) Điều khiển hormone","d) Làm ngoài đồng ruộng"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: làm trong phòng thí nghiệm.","level":"TH","points":1},{"type":"short","q":"Nhân giống trong ống nghiệm gọi là gì?","answer":"Nuôi cấy mô","explain":"Nuôi cấy mô tế bào thực vật.","level":"VD","points":0.5},{"type":"short","q":"Nuôi cấy mô cần điều kiện gì quan trọng nhất?","answer":"Vô trùng","explain":"Vô trùng tuyệt đối tránh nhiễm khuẩn.","level":"VDC","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Sinh sản hữu tính ở sinh vật gồm các giai đoạn","options":["A. tạo giao tử, thụ tinh, phát triển hợp tử","B. phân đôi","C. nảy chồi","D. phân mảnh"],"answer":"A","explain":"Hữu tính: giảm phân tạo giao tử → thụ tinh → hợp tử phát triển.","level":"NB","points":0.25},{"type":"mcq","q":"Giao tử được tạo ra bằng","options":["A. giảm phân","B. nguyên phân","C. phân đôi","D. nảy chồi"],"answer":"A","explain":"Giảm phân tạo giao tử đơn bội.","level":"NB","points":0.25},{"type":"mcq","q":"Thụ tinh là","options":["A. giao tử đực kết hợp giao tử cái tạo hợp tử","B. phân đôi","C. nảy chồi","D. trinh sản"],"answer":"A","explain":"Thụ tinh: n + n → 2n (hợp tử).","level":"TH","points":0.25},{"type":"mcq","q":"Hợp tử phát triển thành","options":["A. cơ thể mới","B. giao tử","C. mô","D. không gì"],"answer":"A","explain":"Hợp tử nguyên phân, phân hoá → cơ thể mới.","level":"TH","points":0.25},{"type":"mcq","q":"Giảm phân có ý nghĩa trong sinh sản hữu tính","options":["A. tạo giao tử đơn bội, tăng biến dị","B. không ý nghĩa","C. tạo hợp tử","D. ngẫu nhiên"],"answer":"A","explain":"Giảm phân: giảm nhiễm sắc thể, tạo biến dị tổ hợp.","level":"VD","points":0.25},{"type":"mcq","q":"Thụ tinh khôi phục","options":["A. bộ nhiễm sắc thể lưỡng bội","B. đơn bội","C. tam bội","D. không gì"],"answer":"A","explain":"n + n = 2n: khôi phục lưỡng bội của loài.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hữu tính.","statements":["a) Tạo giao tử bằng giảm phân","b) Thụ tinh tạo hợp tử","c) Hợp tử phát triển thành cơ thể","d) Không qua thụ tinh"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: hữu tính qua thụ tinh.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về giảm phân.","statements":["a) Tạo giao tử đơn bội","b) Tăng biến dị","c) Giảm nhiễm sắc thể","d) Tạo hợp tử"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: thụ tinh tạo hợp tử.","level":"TH","points":1},{"type":"short","q":"Giao tử được tạo bằng quá trình nào?","answer":"Giảm phân","explain":"Giảm phân tạo giao tử đơn bội.","level":"VD","points":0.5},{"type":"shor oints":1},{"type":"short","q":"Muốn giữ nguyên giống tốt dùng hình thức nào?","answer":"Vô tính","explain":"Vô tính: con giống hệt mẹ.","level":"VD","points":0.5},{"type":"short","q":"Muốn tạo giống mới dùng hình thức nào?","answer":"Hữu tính","explain":"Lai hữu tính tạo biến dị tổ hợp.","level":"VDC","points":0.5}]}]}
