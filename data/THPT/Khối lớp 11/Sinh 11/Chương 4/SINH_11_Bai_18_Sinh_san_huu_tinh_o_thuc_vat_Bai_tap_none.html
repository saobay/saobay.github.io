uả","c) Hạt có phôi","d) Bầu nhuỵ thành hạt"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: noãn thành hạt.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về quả.","statements":["a) Bảo vệ hạt","b) Giúp phát tán","c) Có quả không hạt","d) Quả từ noãn"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: quả từ bầu nhuỵ.","level":"TH","points":1},{"type":"short","q":"Noãn sau thụ tinh thành gì?","answer":"Hạt","explain":"Noãn → hạt.","level":"VD","points":0.5},{"type":"short","q":"Bầu nhuỵ sau thụ tinh thành gì?","answer":"Quả","explain":"Bầu nhuỵ → quả.","level":"VDC","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","q":"Hoa đơn tính là hoa","options":["A. chỉ có nhị hoặc nhuỵ","B. có cả nhị nhuỵ","C. không có gì","D. chỉ có đài"],"answer":"A","explain":"Đơn tính: hoa đực (nhị) hoặc hoa cái (nhuỵ) — bầu, bí.","level":"NB","points":0.25},{"type":"mcq","q":"Cây đơn tính có","options":["A. hoa đực và hoa cái riêng","B. hoa lưỡng tính","C. không hoa","D. một hoa"],"answer":"A","explain":"Bầu, bí: hoa đực, hoa cái riêng trên cùng cây.","level":"NB","points":0.25},{"type":"mcq","q":"Ý nghĩa của hoa đơn tính","options":["A. tăng thụ phấn chéo","B. tự thụ phấn","C. không ý nghĩa","D. đẹp"],"answer":"A","explain":"Đơn tính: bắt buộc thụ phấn chéo → tăng biến dị.","level":"TH","points":0.25},{"type":"mcq","q":"Thụ phấn bổ sung cho ngô để","options":["A. tăng tỉ lệ đậu hạt","B. cho vui","C. tốn công","D. không cần"],"answer":"A","explain":"Ngày lặng gió: rung cờ tung phấn → đậu hạt đều.","level":"TH","points":0.25},{"type":"mcq","q":"Nuôi ong trong vườn cây ăn quả để","options":["A. tăng thụ phấn, đậu quả","B. lấy mật","C. cho vui","D. cả A và B"],"answer":"D","explain":"Ong thụ phấn → đậu quả nhiều; đồng thời lấy mật.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao không phun thuốc trừ sâu khi cây đang ra hoa?","options":["A. diệt côn trùng thụ phấn","B. tốn thuốc","C. hoa rụng","D. không sao"],"answer":"A","expla 5},{"type":"mcq","q":"Sau thụ tinh kép, hợp tử thành","options":["A. phôi","B. nội nhũ","C. vỏ hạt","D. quả"],"answer":"A","explain":"Hợp tử (2n) nguyên phân → phôi.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về quá trình.","statements":["a) Phấn nảy mầm ở đầu nhuỵ","b) Ống phấn đến túi phôi","c) Tạo 2 tinh tử","d) Thụ tinh ở bao phấn"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: thụ tinh ở túi phôi.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về túi phôi.","statements":["a) Chứa trứng","b) Chứa nhân cực","c) Nơi thụ tinh kép","d) Chứa tinh tử"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: tinh tử từ ống phấn đến.","level":"TH","points":1},{"type":"short","q":"Hạt phấn nảy mầm ở đâu?","answer":"Đầu nhuỵ","explain":"Trên đầu nhuỵ ẩm, có chất dinh dưỡng.","level":"VD","points":0.5},{"type":"short","q":"Thụ tinh kép diễn ra ở đâu?","answer":"Túi phôi","explain":"Trong túi phôi của noãn.","level":"VDC","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","q":"Phát tán hạt nhờ gió có đặc điểm","options":["A. hạt nhẹ, có cánh","B. hạt nặng","C. quả mọng","D. có gai"],"answer":"A","explain":"Bồ công anh, chò: hạt nhẹ, có cánh/lông bay xa.","level":"NB","points":0.25},{"type":"mcq","q":"Phát tán nhờ động vật có đặc điểm","options":["A. quả mọng hoặc có gai móc","B. hạt nhẹ","C. có cánh","D. tự nứt"],"answer":"A","explain":"Quả mọng chim ăn; gai móc bám lông thú.","level":"NB","points":0.25},{"type":"mcq","q":"Quả tự phát tán","options":["A. tự nứt bắn hạt (đậu)","B. nhờ gió","C. nhờ chim","D. nhờ người"],"answer":"A","explain":"Đậu, cải: quả khô tự nứt bắn hạt.","level":"TH","points":0.25},{"type":"mcq","q":"Hạt sen, dừa phát tán nhờ","options":["A. nước","B. gió","C. chim","D. tự nứt"],"answer":"A","explain":"Nổi trên nước trôi xa — phát tán nhờ nước.","level":"TH","points":0.25},{"type":"mcq","q":"Ý nghĩa của phát tán hạt","options":["A. mở rộng nơi sống, giảm cạnh tranh","B. không ý nghĩa","C. làm đẹp","D. ngẫu nhiên"],"answer":"A","explain":"Phát tán: tránh cạnh tranh với cây mẹ, mở rộng phân bố.","level":"VD","points":0.25},{"type":"mcq","q":"Con người phát tán hạt bằng","options":["A. gieo trồng, vận chuyển","B. không","C. gió","D. nước"],"answer":"A","explain":"Con người gieo trồng, mang hạt đi xa.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về phát tán.","statements":["a) Nhờ gió: hạt nhẹ","b) Nhờ động vật: quả mọng","c) Tự nứt: đậu","d) Không cần phát tán"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: phát tán quan trọng.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về ý nghĩa.","statements":["a) Mở rộng phân bố","b) Giảm cạnh tranh","c) Thích nghi","d) Không ý nghĩa"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai.","level":"TH","points":1},{"type":"short","q":"Hạt bồ công anh phát tán nhờ gì?","answer":"Gió","explain":"Hạt nhẹ có lông bay theo gió.","level":"VD","points":0.5},{"type":"short","q":"Quả có gai móc phát tán nhờ gì?","answer":"Động vật","explain":"Bám vào lông thú.","level":"VDC","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Điều kiện để hạt nảy mầm","options":["A. đủ nước, nhiệt độ, oxygen","B. chỉ cần nước","C. chỉ cần sáng","D. không cần gì"],"answer":"A","explain":"Nảy mầm: nước, nhiệt thích hợp, oxygen hô hấp.","level":"NB","points":0.25},{"type":"mcq","q":"Hạt nảy mầm nhờ năng lượng từ","options":["A. nội nhũ (chất dự trữ)","B. quang hợp","C. đất","D. nước"],"answer":"A","explain":"Trước khi có lá xanh, phôi dùng nội nhũ.","level":"NB","points":0.25},{"type":"mcq","q":"Phôi trong hạt gồm","options":["A. rễ mầm, thân mầm, lá mầm, chồi mầm","B. vỏ hạt","C. nội nhũ","D. vỏ quả"],"answer":"A","explain":"Phôi: cơ thể thu nhỏ — rễ mầm, thân mầm, lá mầm, chồi mầm.","level":"TH","points":0.25},{"type":"mcq","q":"Rễ mầm phát triển thành","options":["A. rễ cây","B. thân","C. lá","D. hoa"],"answer":"A","explain":"Rễ mầm → rễ; chồi mầm → thân, lá.","level":"TH","points":0.25},{"type":"mcq","q":"Lá mầm có chức năng","options":["A. cung cấp dinh dưỡng cho phôi","B. quang hợp","C. hút nước","D. hô hấp"],"answer":"A","explain":"Lá mầm (đậu) chứa chất dự trữ nuôi phôi.","level":"VD","points":0.25},{"type":"mcq","q":"Ngâm ủ hạt giống trước khi gieo để","options":["A. nảy mầm nhanh, đều","B. diệt sâu","C. cho nặng","D. không tác dụng"],"answer":"A","explain":"Ngâm nước ấm: hạt hút nước, nứt nanh → gieo nảy đều.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về nảy mầm.","statements":["a) Cần nước","b) Cần nhiệt thích hợp","c) Cần oxygen","d) Cần ánh sáng mạnh"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: nhiều hạt nảy mầm trong tối.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về phôi.","statements":["a) Có rễ mầm","b) Có chồi mầm","c) Dùng nội nhũ","d) Quang hợp ngay"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: chưa có lá xanh, dùng dự trữ.","level":"TH","points":1},{"type":"short","q":"Phôi dùng chất dinh dưỡng từ đâu?","answer":"Nội nhũ","explain":"Nội nhũ (hoặc lá mầm) dự trữ nuôi phôi.","level":"VD","points":0.5},{"type":"short","q":"Rễ mầm phát triển thành gì?","answer":"Rễ","explain":"Rễ mầm → hệ rễ cây con.","level":"VDC","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","q":"Cây hạt trần khác hạt kín ở","options":["A. không có hoa, quả; hạt nằm trên lá noãn","B. có hoa","C. có quả","D. thụ tinh kép"],"answer":"A","explain":"Hạt trần (thông): noãn lộ, không hoa, không quả, không thụ tinh kép.","level":"NB","points":0.25},{"type":"mcq","q":"Cây thông sinh sản bằng","options":["A. nón (không có hoa)","B. hoa","C. quả","D. củ"],"answer":"A","explain":"Thông: nón đực, nón cái; hạt nằm trên vảy nón.","level":"NB","points":0.25},{"type":"mcq","q":"Ưu thế của cây hạt kín","options":["A. có hoa, quả bảo vệ hạt, thụ tinh kép","B. không ưu thế","C. chậm tiến hoá","D. ít loài"],"answer":"A","explain":"Hoa, quả, thụ tinh kép → hạt kín đa dạng, chiếm ưu thế.","level":"TH","points":0.25},{"type":"mcq","q":"Số loài cây hạt kín","options":["A. nhiều nhất trong giới thực vật","B. ít nhất","C. bằng hạt trần","D. không đáng kể"],"answer":"A","explain":"Hạt kín: đa dạng nhất, phân bố rộng nhất.","level":"TH","points":0.25},{"type":"mcq","q":"Thụ tinh ở cây hạt trần","options":["A. đơn (không kép)","B. kép","C. không thụ tinh","D. trinh sản"],"answer":"A","explain":"Hạt trần: chỉ 1 tinh tử + trứng, không tạo nội nhũ 3n.","level":"VD","points":0.25},{"type":"mcq","q":"Nội nhũ ở cây hạt trần","options":["A. có trước thụ tinh (đơn bội)","B. 3n sau thụ tinh","C. không có","D. 2n"],"answer":"A","explain":"Hạt trần: nội nhũ đơn bội có sẵn trước thụ tinh.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét so sánh hạt kín và hạt trần.","statements":["a) Hạt kín có hoa","b) Hạt kín có quả","c) Hạt kín thụ tinh kép","d) Hạt trần có quả"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: hạt trần không có quả.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về ưu thế.","statements":["a) Hạt kín đa dạng nhất","b) Quả bảo vệ, phát tán hạt","c) Thụ tinh kép hiệu quả","d) Hạt trần đa dạng hơn"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: hạt kín đa dạng hơn.","level":"TH","points":1},{"type":"short","q":"Cây thông thuộc nhóm nào?","answer":"Hạt trần","explain":"Thông: noãn lộ trên nón, không hoa quả.","level":"VD","points":0.5},{"type":"short","q":"Nhóm thực vật nào thụ tinh kép?","answer":"Hạt kín","explain":"Thụ tinh kép đặc trưng cây hạt kín.","level":"VDC","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","q":"Bài 18 nghiên cứu về","options":["A. sinh sản hữu tính ở thực vật","B. sinh sản ở động vật","C. sinh trưởng","D. cảm ứng"],"answer":"A","explain":"Bài 18: Sinh sản hữu tính ở thực vật.","level":"NB","points":0.25},{"type":"mcq","q":"Trình tự sinh sản hữu tính ở cây hạt kín","options":["A. ra hoa, thụ phấn, thụ tinh, tạo hạt quả","B. thụ tinh rồi ra hoa","C. tạo quả rồi thụ phấn","D. ngẫu nhiên"],"answer":"A","explain":"Hoa → thụ phấn → thụ tinh kép → hạt, quả.","level":"NB","points":0.25},{"type":"mcq","q":"Để tăng năng suất cây trồng cần","options":["A. đảm bảo thụ phấn, thụ tinh tốt","B. để tự nhiên","C. không cần","D. ngẫu nhiên"],"answer":"A","explain":"Thụ phấn tốt → đậu quả nhiều → năng suất cao.","level":"TH","points":0.25},{"type":"mcq","q":"Bón phân đầy đủ giúp cây","options":["A. ra hoa, đậu quả tốt","B. không ảnh hưởng","C. rụng hoa","D. chết"],"answer":"A","explain":"Dinh dưỡng đủ → hoa khoẻ, đậu quả nhiều.","level":"TH","points":0.25},{"type":"mcq","q":"Tưới nước lúc cây ra hoa cần","options":["A. vừa đủ, tránh úng","B. càng nhiều càng tốt","C. không tưới","D. ngập"],"answer":"A","explain":"Úng lúc ra hoa → rụng hoa, thối nhuỵ.","level":"VD","points":0.25},{"type":"mcq","q":"Bảo vệ côn trùng thụ phấn bằng","options":["A. hạn chế thuốc trừ sâu lúc ra hoa","B. phun nhiều thuốc","C. đuổi ong","D. không cần"],"answer":"A","explain":"Bảo vệ ong, bướm → thụ phấn tốt.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét tổng kết bài 18.","statements":["a) Hoa là cơ quan sinh sản","b) Thụ tinh kép ở hạt kín","c) Noãn thành hạt, bầu thành quả","d) Hạt trần thụ tinh kép"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: hạt trần thụ tinh đơn.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về sản xuất.","statements":["a) Đảm bảo thụ phấn","b) Bón phân đầy đủ","c) Bảo vệ côn trùng","d) Không cần chăm sóc"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cần chăm sóc.","level":"TH","points":1},{"type":"short","q":"Trình tự: hoa → thụ phấn → thụ tinh → tạo gì?","answer":"Hạt, quả","explain":"Noãn → hạt, bầu nhuỵ → quả.","level":"VD","points":0.5},{"type":"short","q":"Muốn đậu quả nhiều cần đảm bảo gì?","answer":"Thụ phấn tốt","explain":"Thụ phấn, thụ tinh tốt → đậu quả.","level":"VDC","points":0.5}]}
