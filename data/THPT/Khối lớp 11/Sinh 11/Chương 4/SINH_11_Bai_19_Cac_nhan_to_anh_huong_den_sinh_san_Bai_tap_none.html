 về phát triển bền vững.","statements":["a) Hiệu quả kinh tế","b) Bảo vệ môi trường","c) Giữ đa dạng sinh học","d) Chỉ cần lợi nhuận"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cần hài hoà.","level":"TH","points":1},{"type":"short","q":"Muốn chủ động sản xuất cần làm gì?","answer":"Điều khiển nhân tố","explain":"Điều khiển nhiệt, sáng, hormone, dinh dưỡng.","level":"VD","points":0.5},{"type":"short","q":"Phát triển bền vững là gì? (ngắn)","answer":"Kinh tế gắn môi trường","explain":"Hiệu quả kinh tế + bảo vệ môi trường.","level":"VDC","points":0.5}]}]}
