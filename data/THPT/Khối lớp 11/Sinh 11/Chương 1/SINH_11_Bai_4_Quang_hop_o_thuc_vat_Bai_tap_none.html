{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","q":"Quang hợp là quá trình","options":["A. dùng năng lượng ánh sáng tổng hợp chất hữu cơ từ CO2 và nước","B. phân giải chất hữu cơ giải phóng năng lượng","C. thoát hơi nước qua lá","D. rễ hút nước từ đất"],"answer":"A","explain":"Quang hợp: thực vật dùng năng lượng ánh sáng tổng hợp chất hữu cơ từ CO2 và nước, thải O2.","level":"NB","points":0.25},{"type":"mcq","q":"Phương trình tổng quát của quang hợp là","options":["A. 6CO2 + 6H2O thành C6H12O6 + 6O2 (ánh sáng, diệp lục)","B. C6H12O6 + 6O2 thành 6CO2 + 6H2O","C. CO2 + H2O thành O2","D. 6O2 + glucose thành CO2 + nước"],"answer":"A","explain":"Phương trình: 6CO2 + 6H2O (ánh sáng, diệp lục) tạo C6H12O6 + 6O2.","level":"NB","points":0.25},{"type":"mcq","q":"Khí O2 thải ra trong quang hợp có nguồn gốc từ","options":["A. nước, do quang phân li nước","B. khí CO2","C. không khí","D. phân tử diệp lục"],"answer":"A","explain":"O2 thải ra có nguồn gốc từ nước bị quang phân li ở pha sáng (2H2O tạo O2).","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao pha tối phụ thuộc vào pha sáng?","options":["A. pha tối cần ATP và NADPH do pha sáng tạo ra","B. pha tối cần ánh sáng trực tiếp","C. pha tối xảy ra trên màng thylakoid","D. hai pha không phụ thuộc nhau"],"answer":"A","explain":"Pha tối cố định CO2 cần ATP và NADPH từ pha sáng; hết sản phẩm pha sáng thì pha tối ngừng.","level":"TH","points":0.25},{"type":"mcq","q":"Trồng cây trong nhà kính được bổ sung CO2 làm tăng năng suất vì","options":["A. CO2 là nguyên liệu của pha tối","B. CO2 làm ấm nhà kính","C. CO2 diệt sâu bệnh","D. CO2 thay thế ánh sáng"],"answer":"A","explain":"CO2 là nguyên liệu cố định ở pha tối (chu trình Calvin); tăng CO2 đến ngưỡng giúp tăng quang hợp.","level":"VD","points":0.25},{"type":"mcq","q":"Cây bị che khuất hoàn toàn ánh sáng lâu ngày sẽ chết vì","options":["A. không quang hợp được, chất dự trữ bị hô hấp tiêu hao hết","B. thiếu nước","C. thiếu CO2","D. bị lạnh"],"answer":"A","explain":"Không có ánh sáng: pha sáng ngừng, không tạo chất hữu cơ; hô hấp vẫn tiêu hao chất dự trữ → cây chết.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về vai trò của quang hợp.","statements":["a) Tạo chất hữu cơ nuôi sống sinh giới","b) Thải O2 cho hô hấp của sinh vật","c) Góp phần cân bằng CO2 trong khí quyển","d) Tiêu thụ O2 của khí quyển"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: quang hợp thải O2, hấp thụ CO2.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về hai pha của quang hợp.","statements":["a) Pha sáng diễn ra trên màng thylakoid","b) Pha tối diễn ra ở chất nền (stroma)","c) Pha tối cần ánh sáng trực tiếp","d) Sản phẩm của pha sáng được dùng cho pha tối"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: pha tối không cần ánh sáng trực tiếp, nhưng phụ thuộc sản phẩm pha sáng.","level":"TH","points":1},{"type":"short","q":"Bào quan nào là nơi diễn ra quang hợp ở tế bào thực vật?","answer":"Lục lạp","explain":"Lục lạp là bào quan quang hợp: pha sáng trên màng thylakoid, pha tối ở chất nền.","level":"VD","points":0.5},{"type":"short","q":"Chu trình cố định CO2 ở pha tối của quang hợp có tên là gì?","answer":"Calvin","explain":"Pha tối diễn ra theo chu trình Calvin: CO2 được cố định nhờ ATP và NADPH tạo đường.","level":"VDC","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","q":"Nguyên liệu của quang hợp gồm","options":["A. CO2 và nước","B. O2 và đường","C. ATP","D. phân đạm"],"answer":"A","explain":"Nguyên liệu: CO2 (từ không khí qua khí khổng) và nước (từ đất qua rễ).","level":"NB","points":0.25},{"type":"mcq","q":"Sản phẩm của pha sáng gồm","options":["A. ATP, NADPH và O2","B. đường glucose","C. CO2","D. nước"],"answer":"A","explain":"Pha sáng: quang phân li nước tạo ATP, NADPH; O2 thải ra ngoài.","level":"NB","points":0.25},{"type":"mcq","q":"Diệp lục a khác carotenoid ở điểm","options":["A. trực tiếp biến đổi năng lượng ánh sáng; carotenoid chỉ thu nhận và bảo vệ","B. màu sắc","C. vị trí trong lục lạp","D. không có điểm khác"],"answer":"A","explain":"Diệp lục a là trung tâm phản ứng, trực tiếp biến đổi quang năng; carotenoid hấp thụ năng lượng truyền cho diệp lục và bảo vệ diệp lục.","level":"TH","points":0.25},{"type":"mcq","q":"Lá cây có màu xanh lục vì","options":["A. diệp lục ít hấp thụ ánh sáng xanh lục","B. lá phản xạ hết ánh sáng","C. lá không có sắc tố","D. do carotenoid"],"answer":"A","explain":"Diệp lục hấp thụ mạnh đỏ và xanh tím, ít hấp thụ xanh lục nên lá có màu xanh lục.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao trồng cây với mật độ quá dày làm giảm năng suất?","options":["A. cây che lẫn nhau, thiếu sáng nên quang hợp giảm","B. thiếu phân bón","C. thiếu nước","D. sâu bệnh nhiều"],"answer":"A","explain":"Mật độ dày: cây che sáng lẫn nhau, diện tích lá hứng sáng hiệu quả giảm → quang hợp giảm.","level":"VD","points":0.25},{"type":"mcq","q":"Đốt nến trong chuông thuỷ tinh úp cây xanh đặt ngoài nắng, nến cháy lâu hơn bình thường vì","options":["A. cây quang hợp thải O2 bù đắp cho sự cháy","B. cây hút hết CO2","C. chuông giữ nhiệt","D. nến tốt hơn"],"answer":"A","explain":"Cây quang hợp thải O2, bù lượng O2 nến tiêu thụ nên nến cháy lâu hơn.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hệ sắc tố quang hợp.","statements":["a) Diệp lục a là trung tâm của phản ứng quang hợp","b) Carotenoid bảo vệ diệp lục khỏi ánh sáng mạnh","c) Cây hấp thụ mạnh ánh sáng đỏ và xanh tím","d) Cây hấp thụ mạnh ánh sáng xanh lục"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cây ít hấp thụ ánh sáng xanh lục.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về yếu tố ảnh hưởng đến quang hợp.","statements":["a) Thiếu nước làm giảm quang hợp","b) Tăng CO2 đến ngưỡng làm tăng quang hợp","c) Nhiệt độ quá cao làm giảm quang hợp","d) Ánh sáng không ảnh hưởng đến quang hợp"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: ánh sáng là yếu tố ảnh hưởng trực tiếp nhất.","level":"TH","points":1},{"type":"short","q":"Khí nào được thải ra ở pha sáng của quang hợp?","answer":"Oxygen","explain":"Pha sáng quang phân li nước thải ra khí oxygen (O2).","level":"VD","points":0.5},{"type":"short","q":"Tại điểm nào thì cường độ quang hợp bằng cường độ hô hấp, cây không tích luỹ chất hữu cơ?","answer":"Điểm bù","explain":"Điểm bù (ánh sáng/CO2): quang hợp = hô hấp, cây không tích luỹ được chất hữu cơ.","level":"VDC","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","q":"Pha sáng của quang hợp diễn ra ở","options":["A. màng thylakoid","B. chất nền (stroma)","C. bào tương","D. ti thể"],"answer":"A","explain":"Pha sáng diễn ra trên màng thylakoid của grana, nơi có hệ sắc tố và chuỗi truyền electron.","level":"NB","points":0.25},{"type":"mcq","q":"Pha tối của quang hợp diễn ra ở","options":["A. chất nền (stroma) của lục lạp","B. màng thylakoid","C. nhân tế bào","D. không bào"],"answer":"A","explain":"Pha tối (chu trình Calvin) diễn ra ở chất nền stroma, nơi có enzyme cố định CO2.","level":"NB","points":0.25},{"type":"mcq","q":"Quang phân li nước tạo ra","options":["A. H+, electron và O2","B. CO2","C. ATP","D. đường glucose"],"answer":"A","explain":"Quang phân li nước: 2H2O tạo 4H+ + 4 electron + O2 dưới tác dụng năng lượng ánh sáng.","level":"TH","points":0.25},{"type":"mcq","q":"Trong quang hợp, năng lượng ánh sáng được chuyển thành","options":["A. hoá năng dự trữ trong chất hữu cơ","B. nhiệt năng","C. cơ năng","D. điện năng"],"answer":"A","explain":"Quang hợp chuyển quang năng thành hoá năng dự trữ trong chất hữu cơ (đồng hoá).","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao lá cây thường xếp hướng ra phía có sáng?","options":["A. để hứng được nhiều ánh sáng nhất","B. để tránh mưa","C. để lá đẹp","D. để giảm thoát hơi nước"],"answer":"A","explain":"Lá hướng sáng (khảm lá) giúp hứng tối đa ánh sáng cho quang hợp.","level":"VD","points":0.25},{"type":"mcq","q":"Cây ưa bóng sống dưới tán rừng có điểm bù ánh sáng thấp, điều này có ý nghĩa","options":["A. quang hợp được ngay cả khi ánh sáng yếu","B. không cần ánh sáng","C. hô hấp rất yếu","D. tiết kiệm nước"],"answer":"A","explain":"Điểm bù thấp: chỉ cần ánh sáng yếu đã quang hợp bù được hô hấp, thích nghi sống dưới tán.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về lá thích nghi với quang hợp.","statements":["a) Phiến lá rộng, mỏng giúp hứng sáng","b) Nhiều khí khổng giúp trao đổi CO2","c) Tế bào thịt lá chứa nhiều lục lạp","d) Lá không liên quan đến quang hợp"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: lá là cơ quan quang hợp chủ yếu.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về mối quan hệ giữa hai pha.","statements":["a) Pha sáng cung cấp ATP, NADPH cho pha tối","b) Không có pha sáng thì pha tối ngừng","c) Hai pha độc lập hoàn toàn với nhau","d) O2 được thải ra ở pha sáng"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: hai pha liên quan mật thiết, pha tối phụ thuộc pha sáng.","level":"TH","points":1},{"type":"short","q":"Chất hữu cơ chủ yếu được tạo ra ở pha tối của quang hợp là đường gì?","answer":"Glucose","explain":"Pha tối (chu trình Calvin) cố định CO2 tạo đường glucose.","level":"VD","points":0.5},{"type":"short","q":"Năng lượng của than đá, dầu mỏ có nguồn gốc từ quá trình nào của thực vật cổ đại?","answer":"Quang hợp","explain":"Than đá, dầu mỏ hình thành từ xác thực vật cổ đại — năng lượng bắt nguồn từ quang hợp.","level":"VDC","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","q":"Quang hợp thuộc kiểu chuyển hoá nào?","options":["A. đồng hoá","B. dị hoá","C. hô hấp","D. lên men"],"answer":"A","explain":"Quang hợp tổng hợp chất phức tạp từ chất đơn giản, cần năng lượng → đồng hoá.","level":"NB","points":0.25},{"type":"mcq","q":"Chất nào sau đây là sản phẩm của quang hợp?","options":["A. glucose và oxygen","B. CO2 và nước","C. ATP","D. phân đạm"],"answer":"A","explain":"Sản phẩm: chất hữu cơ (glucose) và khí oxygen.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao ban đêm cây không quang hợp được?","options":["A. không có ánh sáng cho pha sáng","B. thiếu CO2","C. thiếu nước","D. khí khổng đóng hoàn toàn"],"answer":"A","explain":"Pha sáng cần ánh sáng trực tiếp; ban đêm không có pha sáng nên quang hợp ngừng.","level":"TH","points":0.25},{"type":"mcq","q":"Tăng nồng độ CO2 trong nhà kính giúp tăng quang hợp vì","options":["A. CO2 là nguyên liệu của pha tối","B. CO2 tạo nhiệt","C. CO2 thay thế nước","D. CO2 diệt nấm"],"answer":"A","explain":"CO2 được cố định ở pha tối; tăng CO2 đến điểm bão hoà giúp tăng quang hợp.","level":"TH","points":0.25},{"type":"mcq","q":"Rau trồng dưới đèn LED ánh sáng đỏ và xanh tím phát triển tốt vì","options":["A. cây hấp thụ mạnh hai loại ánh sáng này","B. đèn có màu đẹp","C. đèn rẻ tiền","D. cây cần mọi màu như nhau"],"answer":"A","explain":"Diệp lục hấp thụ mạnh nhất ánh sáng đỏ và xanh tím nên đèn hai màu này hiệu quả.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao cây tầng thấp trong rừng rậm thường có lá to, mỏng, màu xanh đậm?","options":["A. thích nghi hứng sáng yếu: tăng diện tích, nhiều diệp lục","B. do thiếu nước","C. do thừa phân","D. hoàn toàn ngẫu nhiên"],"answer":"A","explain":"Lá to, mỏng, xanh đậm (nhiều diệp lục) giúp hứng và tận dụng ánh sáng yếu dưới tán rừng.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về phương trình quang hợp.","statements":["a) Nguyên liệu là CO2 và H2O","b) Cần năng lượng ánh sáng và diệp lục","c) Sản phẩm là chất hữu cơ và O2","d) Đây là quá trình dị hoá"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: quang hợp là quá trình đồng hoá.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về biện pháp tăng năng suất cây trồng.","statements":["a) Tăng diện tích lá bằng mật độ trồng hợp lí","b) Tăng thời gian chiếu sáng","c) Bón phân đầy đủ, tưới đủ nước","d) Che kín cây cả ngày"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: che kín làm cây thiếu sáng, quang hợp giảm.","level":"TH","points":1},{"type":"short","q":"Sắc tố nào làm cho lá, quả có màu vàng, da cam?","answer":"Carotenoid","explain":"Carotenoid (vàng, da cam, đỏ) hấp thụ năng lượng truyền cho diệp lục và bảo vệ diệp lục.","level":"VD","points":0.5},{"type":"short","q":"Khi tăng CO2 đến một ngưỡng thì quang hợp không tăng nữa, ngưỡng đó gọi là gì?","answer":"Điểm bão hoà","explain":"Điểm bão hoà CO2 (hoặc ánh sáng): vượt ngưỡng, quang hợp không tăng thêm.","level":"VDC","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","q":"Bào quan thực hiện quang hợp là","options":["A. lục lạp","B. ti thể","C. nhân","D. ribosome"],"answer":"A","explain":"Lục lạp là bào quan quang hợp của tế bào thực vật.","level":"NB","points":0.25},{"type":"mcq","q":"Grana trong lục lạp được cấu tạo từ","options":["A. các túi dẹt thylakoid xếp chồng lên nhau","B. màng kép","C. chất nền","D. phân tử DNA"],"answer":"A","explain":"Grana là chồng túi dẹt thylakoid; màng thylakoid là nơi diễn ra pha sáng.","level":"NB","points":0.25},{"type":"mcq","q":"Vai trò của nước trong quang hợp là","options":["A. nguyên liệu, cung cấp H và electron, thải O2","B. chỉ là dung môi","C. chỉ để làm mát","D. chỉ để vận chuyển"],"answer":"A","explain":"Nước bị quang phân li cung cấp H+, electron (tạo NADPH) và thải O2.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao quang hợp góp phần làm giảm hiệu ứng nhà kính?","options":["A. hấp thụ CO2 từ khí quyển","B. thải ra O2","C. tạo bóng râm","D. hút nhiệt"],"answer":"A","explain":"Quang hợp hấp thụ CO2 — khí gây hiệu ứng nhà kính — nên giúp giảm hiệu ứng nhà kính.","level":"TH","points":0.25},{"type":"mcq","q":"Trồng xen cây ưa bóng dưới tán cây ưa sáng nhằm mục đích","options":["A. tận dụng ánh sáng các tầng, tăng năng suất chung","B. tiết kiệm đất","C. chống xói mòn","D. làm đẹp ruộng"],"answer":"A","explain":"Trồng xen tận dụng ánh sáng ở các tầng khác nhau, tăng hiệu quả quang hợp chung.","level":"VD","points":0.25},{"type":"mcq","q":"Lá cây bị vàng do thiếu magie thì quang hợp giảm vì","options":["A. thiếu diệp lục để hấp thụ năng lượng ánh sáng","B. thiếu nước","C. khí khổng đóng","D. thiếu CO2"],"answer":"A","explain":"Mg là nhân của diệp lục; thiếu Mg → ít diệp lục → hấp thụ ít năng lượng ánh sáng.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về vai trò của nước trong quang hợp.","statements":["a) Nước là nguyên liệu của quang hợp","b) Nước cung cấp H cho pha tối (qua NADPH)","c) O2 thải ra có nguồn gốc từ nước","d) Nước không tham gia vào quang hợp"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: nước là nguyên liệu quan trọng của quang hợp.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về cây ưa sáng và cây ưa bóng.","statements":["a) Cây ưa sáng cần cường độ sáng cao","b) Cây ưa bóng quang hợp tốt dưới tán","c) Mọi loài cây cần ánh sáng như nhau","d) Điểm bù ánh sáng của cây ưa bóng thấp"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: nhu cầu ánh sáng khác nhau giữa cây ưa sáng và ưa bóng.","level":"TH","points":1},{"type":"short","q":"Cây hấp thụ mạnh nhất thành phần quang phổ nào của ánh sáng?","answer":"Đỏ và xanh tím","explain":"Diệp lục hấp thụ mạnh nhất ánh sáng đỏ và xanh tím, ít hấp thụ xanh lục.","level":"VD","points":0.5},{"type":"short","q":"Chất nào trong pha sáng nhận electron và H+ để mang sang pha tối?","answer":"NADP+","explain":"NADP+ nhận electron và H+ thành NADPH, mang năng lượng sang pha tối cố định CO2.","level":"VDC","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","q":"Quang hợp ở cây xanh diễn ra chủ yếu ở","options":["A. lá","B. rễ","C. thân","D. hoa"],"answer":"A","explain":"Lá là cơ quan quang hợp chủ yếu nhờ diện tích rộng, nhiều lục lạp.","level":"NB","points":0.25},{"type":"mcq","q":"Diệp lục b có vai trò","options":["A. hấp thụ năng lượng rồi truyền cho diệp lục a","B. là trung tâm phản ứng","C. tạo ra O2","D. cố định CO2"],"answer":"A","explain":"Diệp lục b hấp thụ năng lượng ánh sáng rồi truyền cho diệp lục a ở trung tâm phản ứng.","level":"NB","points":0.25},{"type":"mcq","q":"Carotenoid bảo vệ diệp lục khỏi bị phá huỷ khi","options":["A. ánh sáng quá mạnh","B. bị nước cuốn trôi","C. bị sâu ăn","D. trời quá lạnh"],"answer":"A","explain":"Carotenoid hấp thụ năng lượng dư thừa, bảo vệ diệp lục khi nắng gắt.","level":"TH","points":0.25},{"type":"mcq","q":"Pha tối của quang hợp còn được gọi là","options":["A. pha cố định CO2","B. pha sáng","C. quá trình hô hấp","D. quá trình lên men"],"answer":"A","explain":"Pha tối cố định CO2 thành chất hữu cơ theo chu trình Calvin.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao khi chuyển chậu cây từ trong nhà ra nắng gắt, lá dễ bị cháy?","options":["A. diệp lục chưa kịp thích nghi, carotenoid chưa đủ bảo vệ","B. cây thiếu nước","C. cây bị sốc nhiệt","D. cây thiếu phân"],"answer":"A","explain":"Cây trong nhà quen sáng yếu; ra nắng gắt đột ngột, hệ sắc tố chưa thích nghi → diệp lục bị phá huỷ, lá cháy.","level":"VD","points":0.25},{"type":"mcq","q":"Thí nghiệm: úp chuông thuỷ tinh lên cây, đặt ngoài nắng, que đóm đang cháy dở bùng cháy lại vì","options":["A. O2 do cây quang hợp thải ra","B. CO2 do cây thải ra","C. nhiệt trong chuông","D. hơi nước"],"answer":"A","explain":"Cây quang hợp thải O2 làm không khí trong chuông giàu O2 → đóm bùng cháy.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về lục lạp.","statements":["a) Lục lạp có màng kép","b) Lục lạp chứa chất nền stroma","c) Lục lạp có grana chứa thylakoid","d) Lục lạp là bào quan hô hấp"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: lục lạp là bào quan quang hợp; ti thể mới là bào quan hô hấp.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về quang phân li nước.","statements":["a) Xảy ra ở pha sáng","b) Tạo O2 thải ra ngoài","c) Cung cấp electron cho chuỗi truyền","d) Xảy ra ở pha tối"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: quang phân li nước xảy ra ở pha sáng trên màng thylakoid.","level":"TH","points":1},{"type":"short","q":"Tên gọi khác của pha tối thể hiện chức năng cố định khí carbon dioxide là gì?","answer":"Pha cố định CO2","explain":"Pha tối = pha cố định CO2 (chu trình Calvin).","level":"VD","points":0.5},{"type":"short","q":"Sản phẩm nào của pha sáng được dùng để khử CO2 ở pha tối?","answer":"NADPH","explain":"NADPH mang H và năng lượng từ pha sáng sang pha tối để khử CO2 thành đường.","level":"VDC","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","q":"Nguồn năng lượng cho quang hợp là","options":["A. ánh sáng mặt trời","B. ATP","C. chất hữu cơ","D. nhiệt trong đất"],"answer":"A","explain":"Quang hợp sử dụng năng lượng ánh sáng (chủ yếu từ Mặt Trời).","level":"NB","points":0.25},{"type":"mcq","q":"Sản phẩm cuối cùng của pha tối là","options":["A. đường glucose","B. ATP","C. O2","D. NADPH"],"answer":"A","explain":"Pha tối cố định CO2 tạo đường glucose (chất hữu cơ).","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao diện tích lá ảnh hưởng đến hiệu quả quang hợp?","options":["A. diện tích lớn hứng được nhiều sáng, trao đổi nhiều CO2","B. lá to thì đẹp","C. lá to hút nhiều nước","D. diện tích không ảnh hưởng"],"answer":"A","explain":"Diện tích lá lớn → hứng nhiều sáng, nhiều khí khổng trao đổi CO2 → quang hợp mạnh.","level":"TH","points":0.25},{"type":"mcq","q":"Thiếu CO2 thì quang hợp sẽ","options":["A. giảm","B. tăng","C. không đổi","D. làm ngừng hô hấp"],"answer":"A","explain":"CO2 là nguyên liệu pha tối; thiếu CO2 → pha tối chậm → quang hợp giảm.","level":"TH","points":0.25},{"type":"mcq","q":"Nhà kính trồng dưa thường thắp đèn vào ban đêm để","options":["A. tăng thời gian quang hợp, tăng năng suất","B. sưởi ấm","C. đuổi sâu bệnh","D. trang trí"],"answer":"A","explain":"Thắp đèn tăng thời gian chiếu sáng → tăng thời gian quang hợp → tăng năng suất.","level":"VD","points":0.25},{"type":"mcq","q":"Cây mía (nhóm C4) cho năng suất cao hơn lúa (nhóm C3) trong điều kiện nóng vì","options":["A. có cơ chế tập trung CO2, giảm hô hấp sáng","B. lá to hơn","C. rễ sâu hơn","D. cần ít nước hơn"],"answer":"A","explain":"Cây C4 tập trung CO2 tại tế bào bao bó mạch, hạn chế hô hấp sáng → hiệu quả quang hợp cao khi nóng.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về nguyên liệu và sản phẩm quang hợp.","statements":["a) CO2 được lấy từ không khí qua khí khổng","b) Nước được lấy từ đất qua rễ","c) O2 được thải ra qua khí khổng","d) Đường tạo ra được vận chuyển qua mạch gỗ"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: đường được vận chuyển qua mạch rây.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về hô hấp sáng.","statements":["a) Xảy ra mạnh ở cây C3 khi nóng, khô","b) Làm giảm hiệu quả quang hợp","c) Cây C4 hạn chế được hô hấp sáng","d) Hô hấp sáng tạo ra đường"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: hô hấp sáng tiêu tốn chất hữu cơ, không tạo đường.","level":"TH","points":1},{"type":"short","q":"Cây lấy khí nào từ không khí làm nguyên liệu quang hợp?","answer":"Carbon dioxide","explain":"CO2 từ không khí qua khí khổng vào lá làm nguyên liệu pha tối.","level":"VD","points":0.5},{"type":"short","q":"Nhóm cây nào có năng suất quang hợp cao nhất trong điều kiện nóng, sáng mạnh?","answer":"C4","explain":"Cây C4 (mía, ngô) hạn chế hô hấp sáng nên năng suất cao khi nóng, sáng mạnh.","level":"VDC","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Quang hợp tạo ra khí","options":["A. oxygen","B. carbon dioxide","C. nitơ","D. hydrogen"],"answer":"A","explain":"Quang hợp thải ra khí oxygen (O2) từ quang phân li nước.","level":"NB","points":0.25},{"type":"mcq","q":"Diệp lục trong lục lạp nằm ở","options":["A. màng thylakoid","B. chất nền stroma","C. màng ngoài","D. nhân"],"answer":"A","explain":"Hệ sắc tố (diệp lục, carotenoid) nằm trên màng thylakoid — nơi diễn ra pha sáng.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao lá cây có hệ gân lá?","options":["A. dẫn nước đến lá, đưa chất hữu cơ đi","B. để trang trí","C. để tăng diện tích","D. để chống rách"],"answer":"A","explain":"Gân lá chứa mạch gỗ (đưa nước đến) và mạch rây (đưa chất hữu cơ đi).","level":"TH","points":0.25},{"type":"mcq","q":"Nhiệt độ quá cao làm giảm quang hợp vì","options":["A. enzyme bị biến tính, khí khổng đóng","B. thiếu ánh sáng","C. thiếu CO2 hoàn toàn","D. thừa nước"],"answer":"A","explain":"Nhiệt quá cao: enzyme quang hợp biến tính; cây đóng khí khổng giữ nước → thiếu CO2.","level":"TH","points":0.25},{"type":"mcq","q":"Bón phân hữu cơ cho đất giúp tăng quang hợp một cách gián tiếp vì","options":["A. vi sinh vật phân giải tạo CO2 cho cây","B. làm đất tơi xốp","C. diệt cỏ dại","D. giữ ẩm"],"answer":"A","explain":"Phân hữu cơ được vi sinh vật phân giải thải CO2, tăng CO2 quanh cây → tăng quang hợp.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao rừng được gọi là lá phổi xanh của Trái Đất?","options":["A. quang hợp thải O2, hấp thụ CO2 với quy mô lớn","B. rừng có màu đẹp","C. rừng mát mẻ","D. rừng giữ nước"],"answer":"A","explain":"Rừng quang hợp quy mô lớn: thải O2, hấp thụ CO2 — như lá phổi điều hoà khí quyển.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về ý nghĩa của quang hợp.","statements":["a) Là nguồn thức ăn của sinh giới","b) Là nguồn O2 cho hô hấp","c) Là nguồn gốc năng lượng hoá thạch","d) Làm tăng CO2 trong khí quyển"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: quang hợp làm giảm CO2 khí quyển.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về thực vật C4.","statements":["a) Có cơ chế tập trung CO2 hiệu quả","b) Hạn chế được hô hấp sáng","c) Năng suất cao khi nóng, sáng mạnh","d) Không cần nước để quang hợp"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cây C4 vẫn cần nước như mọi cây.","level":"TH","points":1},{"type":"short","q":"Viết công thức hoá học của khí carbon dioxide.","answer":"CO2","explain":"Khí carbon dioxide: CO2 — nguyên liệu của pha tối.","level":"VD","points":0.5},{"type":"short","q":"Quá trình nào phân giải chất hữu cơ tạo năng lượng, ngược với quang hợp?","answer":"Hô hấp","explain":"Hô hấp tế bào phân giải chất hữu cơ (glucose) giải phóng năng lượng — ngược với quang hợp.","level":"VDC","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","q":"Pha sáng của quang hợp cần","options":["A. ánh sáng","B. bóng tối","C. CO2","D. đất"],"answer":"A","explain":"Pha sáng cần năng lượng ánh sáng trực tiếp để quang phân li nước, tạo ATP, NADPH.","level":"NB","points":0.25},{"type":"mcq","q":"Pha tối của quang hợp cần","options":["A. CO2, ATP và NADPH","B. ánh sáng trực tiếp","C. khí O2","D. nước"],"answer":"A","explain":"Pha tối dùng CO2 cùng ATP, NADPH từ pha sáng để tổng hợp đường.","level":"NB","points":0.25},{"type":"mcq","q":"ATP trong quang hợp được tạo ra ở","options":["A. pha sáng","B. pha tối","C. quá trình hô hấp","D. rễ cây"],"answer":"A","explain":"Pha sáng tạo ATP (quang phosphoryl hoá); pha tối tiêu thụ ATP.","level":"TH","points":0.25},{"type":"mcq","q":"NADPH trong quang hợp có vai trò","options":["A. cung cấp H và năng lượng cho pha tối","B. thải O2 ra ngoài","C. hấp thụ ánh sáng","D. cố định CO2 trực tiếp"],"answer":"A","explain":"NADPH mang H và năng lượng từ pha sáng sang pha tối để khử CO2.","level":"TH","points":0.25},{"type":"mcq","q":"Che lưới đen cho rau vào mùa hè có tác dụng","options":["A. giảm cường độ sáng quá mạnh, tránh cháy lá","B. tăng quang hợp","C. giữ ấm","D. chống mưa"],"answer":"A","explain":"Hè nắng gắt vượt điểm bão hoà, che lưới giảm sáng tránh phá huỷ diệp lục.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao cây trồng trong phòng kín thiếu CO2 thì sinh trưởng kém?","options":["A. thiếu nguyên liệu pha tối nên ít tạo chất hữu cơ","B. thiếu O2 để thở","C. thiếu ánh sáng","D. không khí ngột ngạt"],"answer":"A","explain":"Thiếu CO2 → pha tối chậm → ít chất hữu cơ → cây sinh trưởng kém.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về sự chuyển hoá năng lượng trong quang hợp.","statements":["a) Quang năng được chuyển thành hoá năng","b) Quang hợp là quá trình đồng hoá","c) Quang hợp cần cung cấp ATP từ bên ngoài","d) Năng lượng được dự trữ trong chất hữu cơ"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: quang hợp tự tạo ATP ở pha sáng, không cần ATP từ ngoài.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về điều kiện quang hợp.","statements":["a) Cần được cung cấp đủ nước","b) Cần nhiệt độ thích hợp","c) Cần có CO2","d) Cần bóng tối hoàn toàn"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: quang hợp cần ánh sáng.","level":"TH","points":1},{"type":"short","q":"Năng lượng ánh sáng được diệp lục hấp thụ rồi chuyển thành dạng năng lượng nào?","answer":"Hoá năng","explain":"Quang năng → hoá năng dự trữ trong chất hữu cơ.","level":"VD","points":0.5},{"type":"short","q":"Tên gọi quá trình O2 cạnh tranh với CO2 ở cây C3 khi trời nóng làm giảm hiệu quả quang hợp?","answer":"Hô hấp sáng","explain":"Hô hấp sáng: O2 cạnh tranh CO2 tại enzyme Rubisco khi nóng, làm giảm quang hợp ở cây C3.","level":"VDC","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","q":"Thực vật nào sau đây có khả năng quang hợp?","options":["A. cây xanh có diệp lục","B. nấm","C. vi khuẩn hoại sinh","D. động vật"],"answer":"A","explain":"Chỉ sinh vật có sắc tố quang hợp (cây xanh, tảo, một số vi khuẩn) mới quang hợp được.","level":"NB","points":0.25},{"type":"mcq","q":"Tảo quang hợp được nhờ","options":["A. sắc tố quang hợp","B. rễ","C. lá","D. hoa"],"answer":"A","explain":"Tảo có sắc tố quang hợp (diệp lục và sắc tố phụ) nên quang hợp được dù không có lá, rễ thật.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao quang hợp chỉ diễn ra ở phần xanh của cây?","options":["A. chỉ nơi đó có diệp lục (lục lạp)","B. nơi khác bị tối","C. nơi khác không có nước","D. hoàn toàn ngẫu nhiên"],"answer":"A","explain":"Quang hợp cần diệp lục; chỉ phần xanh của cây có lục lạp.","level":"TH","points":0.25},{"type":"mcq","q":"Mối quan hệ giữa quang hợp và hô hấp ở thực vật là","options":["A. nguyên liệu của quá trình này là sản phẩm của quá trình kia","B. hai quá trình độc lập","C. hai quá trình đối kháng triệt tiêu nhau","D. không liên quan"],"answer":"A","explain":"Quang hợp tạo chất hữu cơ + O2 cho hô hấp; hô hấp tạo CO2 + nước + ATP cho quang hợp.","level":"TH","points":0.25},{"type":"mcq","q":"Trồng cây xanh trong nhà giúp","options":["A. thải O2, hấp thụ CO2, làm sạch không khí","B. tăng CO2 trong nhà","C. hút hết O2","D. gây ẩm mốc"],"answer":"A","explain":"Cây xanh quang hợp thải O2, hấp thụ CO2 và một số khí độc, làm sạch không khí.","level":"VD","points":0.25},{"type":"mcq","q":"Nếu Trái Đất không còn thực vật quang hợp, điều gì sẽ xảy ra?","options":["A. cạn kiệt O2 và thức ăn, sinh giới sụp đổ","B. không có gì thay đổi","C. động vật tự quang hợp","D. CO2 giảm mạnh"],"answer":"A","explain":"Mất quang hợp: hết nguồn thức ăn và O2, CO2 tăng — sinh giới sụp đổ.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét chung về quang hợp.","statements":["a) Là quá trình đồng hoá tiêu biểu","b) Xảy ra ở thực vật và tảo","c) Cần ánh sáng, CO2 và nước","d) Thải ra khí CO2"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: quang hợp thải ra O2, hấp thụ CO2.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về tăng năng suất cây trồng.","statements":["a) Chọn giống cây trồng tốt","b) Mật độ trồng hợp lí","c) Tưới tiêu, bón phân đầy đủ","d) Trồng càng dày càng tốt"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: trồng quá dày cây che sáng lẫn nhau, năng suất giảm.","level":"TH","points":1},{"type":"short","q":"Chất diệp lục có màu gì?","answer":"Xanh lá","explain":"Diệp lục có màu xanh lá cây (diệp lục a xanh lá, b xanh vàng).","level":"VD","points":0.5},{"type":"short","q":"Viết công thức hoá học của đường glucose.","answer":"C6H12O6","explain":"Đường glucose: C6H12O6 — sản phẩm của pha tối.","level":"VDC","points":0.5}]}]}
