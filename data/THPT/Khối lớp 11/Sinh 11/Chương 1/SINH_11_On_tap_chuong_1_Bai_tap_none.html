ân theo định luật bảo toàn khối lượng"], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai vì O₂ có nguồn gốc từ nước.", "points": 1}, {"type": "short", "level": "VD", "q": "Rừng được ví như gì của Trái Đất", "answer": "Lá phổi xanh", "explain": "Rừng quang hợp hấp thụ CO₂, thải O₂ như lá phổi.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiện tượng tảo phát triển mạnh do thừa dinh dưỡng trong nước gọi là gì", "answer": "Phú dưỡng", "explain": "Phú dưỡng gây tảo nở hoa, cạn kiệt O₂ làm cá chết.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Phương trình chữ của quang hợp là", "options": ["A. carbon dioxide và nước tạo thành chất hữu cơ và oxygen nhờ ánh sáng, diệp lục", "B. chất hữu cơ và oxygen tạo thành carbon dioxide và nước", "C. glucose tạo thành carbon dioxide và năng lượng", "D. nước tạo thành oxygen và hydrogen"], "answer": "A", "explain": "Quang hợp: CO₂ + H₂O tạo chất hữu cơ + O₂ nhờ ánh sáng và diệp lục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chất hữu cơ do quang hợp tạo ra được cây sử dụng để", "options": ["A. hô hấp tạo năng lượng và xây dựng cơ thể", "B. thải ra ngoài hoàn toàn", "C. dự trữ không dùng", "D. biến thành nước"], "answer": "A", "explain": "Chất hữu cơ dùng cho hô hấp tạo ATP và xây dựng cơ thể.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vòng tuần hoàn carbon trong tự nhiên thể hiện qua", "options": ["A. quang hợp lấy carbon dioxide, hô hấp thải carbon dioxide", "B. cây chỉ thải oxygen", "C. động vật chỉ thải carbon dioxide", "D. carbon biến mất khỏi khí quyển"], "answer": "A", "explain": "Quang hợp lấy CO₂, hô hấp thải CO₂ tạo vòng tuần hoàn carbon.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Năng lượng cho mọi hoạt động sống cuối cùng đều từ", "options": ["A. Mặt Trời qua quang hợp", "B. lòng đất", "C. gió", "D. thuỷ triều"], "answer": "A", "explain": "Mọi năng lượng sự sống cuối cùng đều từ Mặt Trời qua quang hợp.", "points": 0. g tăng CO₂, giảm O₂ và phá huỷ nơi quang hợp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hiện tượng tảo nở hoa do thừa dinh dưỡng gây hậu quả", "options": ["A. tảo chết phân huỷ làm cạn kiệt oxygen khiến cá chết", "B. nước giàu oxygen lâu dài", "C. cá sinh sản mạnh", "D. nước trong hơn"], "answer": "A", "explain": "Tảo chết bị vi sinh vật phân giải dùng hết O₂ khiến cá chết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khí khổng giúp cây trao đổi khí nằm chủ yếu ở", "options": ["A. lá", "B. rễ", "C. thân gỗ", "D. hoa"], "answer": "A", "explain": "Khí khổng phân bố chủ yếu ở biểu bì lá.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Diệp lục hấp thụ mạnh nhất ánh sáng ở vùng", "options": ["A. đỏ và xanh tím", "B. xanh lục", "C. vàng", "D. hồng ngoại"], "answer": "A", "explain": "Diệp lục hấp thụ mạnh ánh sáng đỏ và xanh tím.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Ôn tập dị hoá. Nhận xét các phát biểu:", "statements": ["a) Hô hấp tế bào là quá trình dị hoá", "b) Tiêu hoá thức ăn là quá trình dị hoá", "c) Dị hoá giải phóng năng lượng tích vào ATP", "d) Dị hoá tổng hợp chất phức tạp"], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng; d sai vì dị hoá phân giải chất phức tạp.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Nhận xét các phát biểu về cơ quan thực hiện quang hợp:", "statements": ["a) Khí khổng là nơi trao đổi CO₂ và O₂ ở lá", "b) Rễ hút nước cung cấp cho quang hợp", "c) Thân cây ở mọi loài đều không tham gia quang hợp", "d) Lá là cơ quan quang hợp chính"], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai vì thân xương rồng có diệp lục vẫn quang hợp.", "points": 1}, {"type": "short", "level": "NB", "q": "Chất lỏng cây hút từ đất làm nguyên liệu quang hợp là gì", "answer": "Nước", "explain": "Nước được rễ hút và vận chuyển lên lá qua mạch gỗ.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Quá trình nào tạo ra O₂ cho sinh vật hô hấp", "answer": "Quang hợp", "explain": "Quang hợp thải O₂ cung cấp cho sinh vật hô hấp.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Bón phân đạm giúp lá cây xanh tốt vì đạm là nguyên liệu để", "options": ["A. tổng hợp protein và diệp lục trong đồng hoá", "B. tăng hô hấp thải carbon dioxide", "C. làm lá to ra về cơ học", "D. diệt vi sinh vật trong đất"], "answer": "A", "explain": "Đạm là nguyên liệu tổng hợp protein và diệp lục của quá trình đồng hoá.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Bảo vệ cây xanh chính là bảo vệ", "options": ["A. nguồn năng lượng và oxygen của sự sống", "B. cảnh quan đẹp", "C. bóng mát", "D. nguồn gỗ"], "answer": "A", "explain": "Cây xanh là nguồn năng lượng và oxygen của sự sống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chức năng chính của rễ cây là", "options": ["A. hút nước và muối khoáng", "B. quang hợp tạo chất hữu cơ", "C. thoát hơi nước", "D. nâng đỡ tán lá"], "answer": "A", "explain": "Rễ hút nước và muối khoáng cung cấp cho quang hợp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tổng hợp tinh bột từ glucose ở cây thuộc quá trình", "options": ["A. đồng hoá", "B. dị hoá", "C. hô hấp", "D. tiêu hoá"], "answer": "A", "explain": "Tổng hợp tinh bột là tổng hợp chất phức tạp nên thuộc đồng hoá.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trồng cây quá dày, thiếu ánh sáng làm cây còi cọc vì", "options": ["A. quang hợp yếu, thiếu chất hữu cơ nuôi cây", "B. cây không hô hấp được", "C. rễ không hút nước", "D. cây bị lạnh"], "answer": "A", "explain": "Thiếu ánh sáng làm quang hợp yếu, cây thiếu chất hữu cơ nên còi cọc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vận động viên cần ăn đủ protein vì protein giúp", "options": ["A. đồng hoá xây dựng và phục hồi cơ bắp", "B. thay thế nước", "C. cung cấp oxygen", "D. làm xương dài ra ngay"], "answer": "A", "explain": "Protein là nguyên liệu cho đồng hoá xây dựng, phục hồi cơ bắp.", "points": 0.25}, {"type": "truefalse", ns": ["A. quá trình dị hoá phân giải chất", "B. ánh sáng Mặt Trời trong mọi trường hợp", "C. nhiệt năng của môi trường", "D. không cần năng lượng"], "answer": "A", "explain": "Dị hoá giải phóng năng lượng cung cấp cho đồng hoá.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lá cây có màu xanh lục vì", "options": ["A. diệp lục phản xạ ánh sáng xanh lục", "B. lá hấp thụ hết ánh sáng xanh lục", "C. lá phát sáng xanh", "D. gân lá màu xanh"], "answer": "A", "explain": "Diệp lục ít hấp thụ ánh sáng xanh lục mà phản xạ lại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kí hiệu hoá học của nước là", "options": ["A. H₂O", "B. CO₂", "C. O₂", "D. H₂O₂"], "answer": "A", "explain": "Nước có công thức hoá học là H₂O.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoạt động nào sau đây của tế bào KHÔNG cần năng lượng ATP", "options": ["A. khuếch tán các chất qua màng", "B. vận chuyển chủ động", "C. co cơ", "D. tổng hợp protein"], "answer": "A", "explain": "Khuếch tán là vận chuyển thụ động, không cần ATP.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Ôn tập quang hợp. Nhận xét các phát biểu:", "statements": ["a) Nguyên liệu quang hợp là CO₂, H₂O; điều kiện là ánh sáng và diệp lục", "b) Sản phẩm quang hợp là chất hữu cơ và O₂", "c) Quang hợp diễn ra ở lục lạp", "d) Quang hợp chỉ diễn ra vào ban đêm"], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng; d sai vì quang hợp cần ánh sáng, diễn ra ban ngày.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Nhận xét các phát biểu về dòng năng lượng:", "statements": ["a) Năng lượng ánh sáng chuyển thành năng lượng hoá học trong glucose", "b) Năng lượng hoá học chuyển thành cơ năng và nhiệt năng khi vận động", "c) Nhiệt năng toả ra được tái sử dụng hoàn toàn", "d) Mọi chuyển hoá năng lượng tuân theo định luật bảo toàn năng lượng"], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai vì nhiệt năng là năng lượng thất thoát.", "points": 1}, {"type": "short", "level": "NB",
