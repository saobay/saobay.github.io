oints":1},{"type":"truefalse","q":"Nhận xét các phát biểu về huyết áp và vận tốc máu.","statements":["a) Huyết áp cao nhất ở động mạch","b) Huyết áp thấp nhất ở tĩnh mạch","c) Vận tốc máu chậm nhất ở mao mạch","d) Huyết áp như nhau ở khắp hệ mạch"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: huyết áp giảm dần từ động mạch đến tĩnh mạch.","level":"TH","points":1},{"type":"short","q":"Nơi diễn ra trao đổi chất giữa máu và tế bào là đâu?","answer":"Mao mạch","explain":"Mao mạch thành mỏng là nơi trao đổi O2, CO2, dinh dưỡng với tế bào.","level":"VD","points":0.5},{"type":"short","q":"Huyết áp thường được đo ở mạch máu nào?","answer":"Động mạch","explain":"Đo huyết áp ở động mạch cánh tay (huyết áp động mạch).","level":"VDC","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","q":"Máu gồm","options":["A. huyết tương và các huyết cầu","B. chỉ huyết tương","C. chỉ hồng cầu","D. chỉ nước"],"answer":"A","explain":"Máu: huyết tương (dịch) + huyết cầu (hồng cầu, bạch cầu, tiểu cầu).","level":"NB","points":0.25},{"type":"mcq","q":"Hồng cầu có vai trò","options":["A. vận chuyển O2","B. bảo vệ cơ thể","C. đông máu","D. vận chuyển dinh dưỡng"],"answer":"A","explain":"Hồng cầu chứa hemoglobin vận chuyển O2 từ phổi đến tế bào.","level":"NB","points":0.25},{"type":"mcq","q":"Bạch cầu có vai trò","options":["A. bảo vệ cơ thể chống nhiễm trùng","B. vận chuyển O2","C. đông máu","D. tạo nhiệt"],"answer":"A","explain":"Bạch cầu thực bào, tạo kháng thể chống vi khuẩn, virus.","level":"TH","points":0.25},{"type":"mcq","q":"Tiểu cầu có vai trò","options":["A. giúp đông máu","B. vận chuyển O2","C. bảo vệ","D. dinh dưỡng"],"answer":"A","explain":"Tiểu cầu tham gia cơ chế đông máu khi mạch bị tổn thương.","level":"TH","points":0.25},{"type":"mcq","q":"Người bị thiếu máu thường","options":["A. mệt mỏi, chóng mặt do thiếu O2","B. béo phì","C. khoẻ mạnh","D. tăng cân"],"answer":"A","explain":"Thiếu hồng cầu/hemoglobin → thiếu O2 đến tế bào → mệt, chóng mặt.","level":"VD","poi ệt"],"answer":"A","explain":"Xúc động: adrenaline tăng → tim đập nhanh, mạnh.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao khi bị sốt, nhịp tim tăng?","options":["A. trao đổi chất tăng, cần nhiều O2","B. vì nóng","C. vì mệt","D. vì khát"],"answer":"A","explain":"Sốt: trao đổi chất tăng → cần nhiều O2 → tim đập nhanh để vận chuyển.","level":"TH","points":0.25},{"type":"mcq","q":"Huyết áp 120/80 mmHg nghĩa là","options":["A. huyết áp bình thường","B. huyết áp cao","C. huyết áp thấp","D. bị bệnh tim"],"answer":"A","explain":"120/80 mmHg là huyết áp bình thường (tâm thu/tâm trương).","level":"VD","points":0.25},{"type":"mcq","q":"Người bị hở van tim thì","options":["A. máu chảy ngược, tim phải làm việc nhiều hơn","B. không ảnh hưởng gì","C. tim khoẻ hơn","D. huyết áp ổn định"],"answer":"A","explain":"Hở van: máu phụt ngược → tim phải bơm bù → lâu ngày suy tim.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về điều hoà hoạt động tim.","statements":["a) Nút xoang phát xung điện","b) Hệ thần kinh điều chỉnh nhịp tim","c) Adrenaline làm tăng nhịp tim","d) Tim đập theo ý muốn của con người"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: tim đập tự động, không theo ý muốn.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về huyết áp.","statements":["a) 120/80 mmHg là bình thường","b) Huyết áp quá cao dễ gây tai biến","c) Huyết áp quá thấp gây choáng","d) Huyết áp không quan trọng"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: huyết áp phản ánh sức khoẻ tim mạch.","level":"TH","points":1},{"type":"short","q":"Nhịp tim bình thường của người khoảng bao nhiêu lần mỗi phút?","answer":"75","explain":"Nhịp tim bình thường khoảng 70–80 lần/phút.","level":"VD","points":0.5},{"type":"short","q":"Van ngăn giữa tâm nhĩ trái và tâm thất trái có tên là gì?","answer":"Van hai lá","explain":"Van hai lá (van nhĩ thất trái) ngăn máu chảy ngược từ thất lên nhĩ.","level":"VDC","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","q":"Máu giàu O2 có màu","options":["A. đỏ tươi","B. đỏ thẫm","C. vàng","D. xanh"],"answer":"A","explain":"Máu động mạch giàu O2 có màu đỏ tươi.","level":"NB","points":0.25},{"type":"mcq","q":"Động mạch chủ đưa máu","options":["A. giàu O2 đi nuôi cơ thể","B. giàu CO2","C. về tim","D. lên phổi"],"answer":"A","explain":"Động mạch chủ từ thất trái đưa máu giàu O2 đi khắp cơ thể.","level":"NB","points":0.25},{"type":"mcq","q":"Tĩnh mạch chủ đưa máu","options":["A. giàu CO2 về tim","B. giàu O2","C. đi nuôi cơ thể","D. lên phổi"],"answer":"A","explain":"Tĩnh mạch chủ trên, dưới đưa máu giàu CO2 về nhĩ phải.","level":"TH","points":0.25},{"type":"mcq","q":"Tĩnh mạch phổi mang máu","options":["A. giàu O2 về tim","B. giàu CO2","C. pha","D. không có máu"],"answer":"A","explain":"Tĩnh mạch phổi mang máu giàu O2 từ phổi về nhĩ trái (ngoại lệ).","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao máu trong động mạch bị đứt chảy thành tia mạnh?","options":["A. áp lực máu trong động mạch cao","B. máu quá nhiều","C. mạch to","D. tim ở gần"],"answer":"A","explain":"Động mạch áp lực cao nên máu phụt thành tia; tĩnh mạch chảy rỉ.","level":"VD","points":0.25},{"type":"mcq","q":"Khi bị đứt động mạch, băng ép ở phía nào của vết thương?","options":["A. phía trên vết thương (gần tim)","B. phía dưới vết thương","C. hai bên","D. không cần băng"],"answer":"A","explain":"Ép phía trên (gần tim) để chặn dòng máu động mạch đến vết thương.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về chiều di chuyển của máu.","statements":["a) Động mạch dẫn máu từ tim đi","b) Tĩnh mạch dẫn máu về tim","c) Động mạch phổi mang máu giàu CO2","d) Tĩnh mạch phổi mang máu giàu CO2"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: tĩnh mạch phổi mang máu giàu O2.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về van.","statements":["a) Van tim ngăn máu chảy ngược","b) Van tĩnh mạch ngăn máu chảy ngược","c) Không cần van cũng được","d) Van chỉ cho máu đi một chiều"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: van rất cần để máu đi một chiều.","level":"TH","points":1},{"type":"short","q":"Mạch máu nào đưa máu giàu O2 từ tim đi nuôi cơ thể?","answer":"Động mạch chủ","explain":"Động mạch chủ: mạch lớn nhất, từ thất trái đi nuôi cơ thể.","level":"VD","points":0.5},{"type":"short","q":"Tên gọi chung của động mạch, mao mạch và tĩnh mạch là gì?","answer":"Hệ mạch","explain":"Hệ mạch gồm động mạch, mao mạch, tĩnh mạch.","level":"VDC","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Động vật có hệ tuần hoàn kín gồm","options":["A. giun đốt, cá, người","B. côn trùng","C. thân mềm","D. sứa"],"answer":"A","explain":"Giun đốt và động vật có xương sống có hệ tuần hoàn kín.","level":"NB","points":0.25},{"type":"mcq","q":"Hệ tuần hoàn đơn có ở","options":["A. cá","B. chim","C. người","D. ếch"],"answer":"A","explain":"Cá: một vòng tuần hoàn, tim 2 ngăn — hệ tuần hoàn đơn.","level":"NB","points":0.25},{"type":"mcq","q":"Tim cá có cấu tạo","options":["A. 2 ngăn (1 tâm nhĩ, 1 tâm thất)","B. 4 ngăn","C. 3 ngăn","D. 1 ngăn"],"answer":"A","explain":"Tim cá 2 ngăn, máu đi một vòng qua tim, bị pha.","level":"TH","points":0.25},{"type":"mcq","q":"Máu của cá bị pha vì","options":["A. tim 2 ngăn, máu đi một vòng duy nhất","B. tim quá nhỏ","C. có mang","D. sống trong nước"],"answer":"A","explain":"Tim 2 ngăn không tách được máu giàu O2 và giàu CO2 → máu pha.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao cá hoạt động kém linh hoạt hơn thú?","options":["A. máu pha, ít O2 nên trao đổi chất yếu","B. cá nhỏ con","C. nước lạnh","D. cá ít ăn"],"answer":"A","explain":"Máu pha ít O2 → hô hấp tế bào yếu → ít năng lượng cho hoạt động.","level":"VD","points":0.25},{"type":"mcq","q":"Lưỡng cư tim 3 ngăn nhưng vẫn sống tốt vì","options":["A. da hỗ trợ hô hấp, nhu cầu O2 thấp","B. tim rất to","C. máu rất nhiều","D. do may mắn"],"answer":"A","explain":"Ếch hô hấp hỗ trợ qua da, trao đổi chất thấp nên máu pha một phần vẫn đủ.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hệ tuần hoàn của các động vật.","statements":["a) Côn trùng có hệ tuần hoàn hở","b) Cá có hệ tuần hoàn kín đơn","c) Chim có hệ tuần hoàn kín kép","d) Người có hệ tuần hoàn hở"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: người có hệ tuần hoàn kín kép.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về máu pha.","statements":["a) Máu cá bị pha","b) Máu ếch pha một phần","c) Máu chim không pha","d) Máu người bị pha"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: máu người không pha (tim 4 ngăn).","level":"TH","points":1},{"type":"short","q":"Hệ tuần hoàn của châu chấu là hở hay kín?","answer":"Hở","explain":"Châu chấu (côn trùng) có hệ tuần hoàn hở.","level":"VD","points":0.5},{"type":"short","q":"Hệ tuần hoàn kín tiến hoá hơn hở ở điểm nào? (trả lời bằng một tính từ)","answer":"Nhanh","explain":"Kín: máu chảy trong mạch, áp lực cao → vận chuyển nhanh, hiệu quả.","level":"VDC","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","q":"Huyết tương chứa","options":["A. nước, protein và chất dinh dưỡng","B. chỉ nước","C. chỉ hồng cầu","D. chỉ khí"],"answer":"A","explain":"Huyết tương: nước, protein huyết tương, chất dinh dưỡng, hormone, muối khoáng.","level":"NB","points":0.25},{"type":"mcq","q":"Hồng cầu của thú không có","options":["A. nhân","B. hemoglobin","C. màng tế bào","D. hình đĩa lõm"],"answer":"A","explain":"Hồng cầu thú trưởng thành không có nhân để chứa được nhiều hemoglobin.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao hồng cầu lõm hai mặt?","options":["A. tăng diện tích trao đổi khí","B. để đẹp","C. để nhẹ","D. hoàn toàn ngẫu nhiên"],"answer":"A","explain":"Lõm hai mặt tăng diện tích tiếp xúc, trao đổi O2 nhanh hơn.","level":"TH","points":0.25},{"type":"mcq","q":"Người thiếu sắt dễ bị","options":["A. thiếu máu","B. béo phì","C. cao lớn","D. khoẻ mạnh"],"answer":"A","explain":"Sắt tạo hemoglobin; thiếu sắt → ít hemoglobin → thiếu máu.","level":"TH","points":0.25},{"type":"mcq","q":"Hiến máu nhân đạo giúp","options":["A. cứu sống người bệnh cần máu","B. giảm cân","C. tăng sức khoẻ","D. đẹp da"],"answer":"A","explain":"Máu hiến cứu người mất máu, phẫu thuật; cơ thể nhanh tái tạo máu mới.","level":"VD","points":0.25},{"type":"mcq","q":"Truyền máu phải đảm bảo","options":["A. đúng nhóm máu tương thích","B. tuỳ ý nhóm nào","C. càng nhiều càng tốt","D. không cần xét nghiệm"],"answer":"A","explain":"Truyền sai nhóm gây ngưng kết, tan máu — nguy hiểm tính mạng.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hồng cầu.","statements":["a) Vận chuyển O2","b) Chứa hemoglobin","c) Không có nhân ở thú","d) Bảo vệ cơ thể khỏi vi khuẩn"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: bảo vệ là vai trò của bạch cầu.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về đông máu.","statements":["a) Tiểu cầu tham gia đông máu","b) Giúp cầm máu khi bị thương","c) Xảy ra khi mạch máu bị tổn thương","d) Máu không bao giờ đông"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: máu đông khi mạch tổn thương (bệnh khó đông là ngoại lệ).","level":"TH","points":1},{"type":"short","q":"Protein nào trong huyết tương tham gia tạo cục máu đông?","answer":"Fibrinogen","explain":"Fibrinogen chuyển thành fibrin tạo lưới giữ huyết cầu thành cục máu đông.","level":"VD","points":0.5},{"type":"short","q":"Người nhóm máu O chỉ nhận được máu của nhóm nào?","answer":"O","explain":"Nhóm O có cả kháng thể chống A và B nên chỉ nhận được máu nhóm O.","level":"VDC","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","q":"Vai trò nào KHÔNG phải của máu?","options":["A. quang hợp","B. vận chuyển O2","C. bảo vệ cơ thể","D. điều hoà thân nhiệt"],"answer":"A","explain":"Quang hợp là vai trò của lá, không phải của máu.","level":"NB","points":0.25},{"type":"mcq","q":"Tim nằm ở","options":["A. lồng ngực, giữa hai lá phổi","B. ổ bụng","C. cổ","D. đầu"],"answer":"A","explain":"Tim nằm trong lồng ngực, giữa hai phổi, lệch trái.","level":"NB","points":0.25},{"type":"mcq","q":"Nghe nhịp tim bằng dụng cụ nào?","options":["A. ống nghe","B. mắt thường","C. tay","D. mũi"],"answer":"A","explain":"Bác sĩ dùng ống nghe để nghe nhịp tim, tiếng van tim.","level":"TH","points":0.25},{"type":"mcq","q":"Mạch đập ở cổ tay là mạch","options":["A. động mạch","B. tĩnh mạch","C. mao mạch","D. tim"],"answer":"A","explain":"Mạch cổ tay là động mạch quay; bắt mạch để đếm nhịp tim.","level":"TH","points":0.25},{"type":"mcq","q":"Bắt mạch ở cổ tay để","options":["A. đếm nhịp tim","B. đo huyết áp","C. xem bói","D. làm ấm tay"],"answer":"A","explain":"Mỗi nhịp đập của động mạch ứng với một nhịp tim.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao người già dễ bị tăng huyết áp?","options":["A. thành mạch kém đàn hồi","B. tim yếu","C. ít vận động","D. ăn mặn"],"answer":"A","explain":"Tuổi cao: thành mạch xơ cứng, kém đàn hồi → huyết áp tăng.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét tổng quát về hệ tuần hoàn.","statements":["a) Gồm tim, hệ mạch và máu","b) Vận chuyển các chất","c) Điều hoà và bảo vệ cơ thể","d) Tiêu hoá thức ăn"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: tiêu hoá là vai trò của hệ tiêu hoá.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về tiến hoá của hệ tuần hoàn.","statements":["a) Từ hở đến kín","b) Từ đơn đến kép","c) Càng tiến hoá càng hiệu quả","d) Hệ hở hiệu quả nhất"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: hệ kín kép hiệu quả nhất.","level":"TH","points":1},{"type":"short","q":"Kể tên ba loại mạch máu trong hệ mạch.","answer":"Động mạch, mao mạch, tĩnh mạch","explain":"Hệ mạch: động mạch (đi), mao mạch (trao đổi), tĩnh mạch (về).","level":"VD","points":0.5},{"type":"short","q":"Cơ quan nào bơm máu đi khắp cơ thể?","answer":"Tim","explain":"Tim co bóp tạo áp lực đẩy máu đi khắp
