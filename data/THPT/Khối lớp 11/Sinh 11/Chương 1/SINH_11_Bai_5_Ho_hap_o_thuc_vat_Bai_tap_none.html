{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","q":"Hô hấp ở thực vật là quá trình","options":["A. phân giải chất hữu cơ với O2 tạo CO2, nước và ATP","B. tổng hợp chất hữu cơ từ CO2","C. thoát hơi nước qua lá","D. rễ hút nước từ đất"],"answer":"A","explain":"Hô hấp tế bào: phân giải chất hữu cơ (glucose) với O2 tạo CO2, nước, giải phóng năng lượng ATP.","level":"NB","points":0.25},{"type":"mcq","q":"Phương trình tổng quát của hô hấp hiếu khí là","options":["A. C6H12O6 + 6O2 thành 6CO2 + 6H2O + năng lượng (ATP)","B. 6CO2 + 6H2O thành C6H12O6 + 6O2","C. glucose thành rượu + CO2","D. CO2 thành O2"],"answer":"A","explain":"Hô hấp hiếu khí: C6H12O6 + 6O2 tạo 6CO2 + 6H2O + năng lượng (ATP).","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao nói hô hấp là quá trình dị hoá?","options":["A. phân giải chất phức tạp thành chất đơn giản, giải phóng năng lượng","B. tổng hợp chất phức tạp","C. cần ánh sáng","D. thải ra O2"],"answer":"A","explain":"Dị hoá: phân giải chất phức tạp thành đơn giản, giải phóng năng lượng tích vào ATP.","level":"TH","points":0.25},{"type":"mcq","q":"Giai đoạn đường phân diễn ra ở đâu?","options":["A. bào tương","B. ti thể","C. lục lạp","D. nhân tế bào"],"answer":"A","explain":"Đường phân diễn ra ở bào tương (tế bào chất), phân giải glucose thành acid pyruvic.","level":"TH","points":0.25},{"type":"mcq","q":"Hạt đậu đang nảy mầm hô hấp mạnh hơn hạt khô vì","options":["A. cần nhiều ATP cho sinh trưởng, enzyme hoạt động mạnh khi đủ nước","B. hạt nảy mầm to hơn","C. vỏ hạt mỏng hơn","D. đã có lá quang hợp"],"answer":"A","explain":"Nảy mầm cần nhiều ATP; đủ nước enzyme hoạt động mạnh → hô hấp mạnh.","level":"VD","points":0.25},{"type":"mcq","q":"Rễ cây ngập úng lâu ngày bị thối có liên quan đến hô hấp vì","options":["A. thiếu O2 nên hô hấp yếm khí, ít ATP, tích luỹ chất độc","B. thừa nước làm loãng tế bào","C. thiếu phân bón","D. đất bị lạnh"],"answer":"A","explain":"Ngập úng thiếu O2 → rễ hô hấp yếm khí: ít ATP, tích chất độc → tế bào chết, rễ thối.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về vai trò của hô hấp.","statements":["a) Cung cấp ATP cho mọi hoạt động sống","b) Cung cấp sản phẩm trung gian cho tổng hợp chất","c) Toả nhiệt giúp duy trì nhiệt độ cơ thể","d) Tổng hợp chất hữu cơ từ CO2"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: tổng hợp chất hữu cơ từ CO2 là vai trò của quang hợp.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về các giai đoạn hô hấp hiếu khí.","statements":["a) Đường phân diễn ra ở bào tương","b) Chu trình Krebs diễn ra ở chất nền ti thể","c) Chuỗi truyền electron ở màng trong ti thể","d) Cả ba giai đoạn đều diễn ra ở bào tương"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: chỉ đường phân ở bào tương, hai giai đoạn sau ở ti thể.","level":"TH","points":1},{"type":"short","q":"Bào quan nào là nơi diễn ra chu trình Krebs và chuỗi truyền electron?","answer":"Ti thể","explain":"Ti thể: chu trình Krebs ở chất nền, chuỗi truyền electron ở màng trong.","level":"VD","points":0.5},{"type":"short","q":"Chất nào được tạo ra ở đường phân rồi đi vào ti thể để tiếp tục hô hấp?","answer":"Acid pyruvic","explain":"Đường phân tạo acid pyruvic; acid pyruvic vào ti thể tham gia chu trình Krebs.","level":"VDC","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","q":"Nguyên liệu của hô hấp hiếu khí gồm","options":["A. glucose và O2","B. CO2 và nước","C. ánh sáng","D. phân đạm"],"answer":"A","explain":"Nguyên liệu: chất hữu cơ (glucose) và khí oxygen.","level":"NB","points":0.25},{"type":"mcq","q":"Sản phẩm của hô hấp hiếu khí gồm","options":["A. CO2, nước và ATP","B. glucose và O2","C. rượu ethanol","D. acid lactic"],"answer":"A","explain":"Sản phẩm: CO2, nước và năng lượng (ATP + nhiệt).","level":"NB","points":0.25},{"type":"mcq","q":"Chu trình Krebs tạo ra","options":["A. CO2, NADH và FADH2","B. ATP là chủ yếu","C. khí O2","D. đường glucose"],"answer":"A","explain":"Krebs: phân giải hoàn toàn tạo CO2; NADH, FADH2 mang electron vào chuỗi truyền.","level":"TH","points":0.25},{"type":"mcq","q":"Giai đoạn tạo ra nhiều ATP nhất trong hô hấp là","options":["A. chuỗi truyền electron","B. đường phân","C. chu trình Krebs","D. lên men"],"answer":"A","explain":"Chuỗi truyền electron tạo phần lớn ATP của hô hấp hiếu khí.","level":"TH","points":0.25},{"type":"mcq","q":"Bảo quản rau trong kho lạnh giúp rau tươi lâu vì","options":["A. nhiệt thấp làm giảm hô hấp, chậm tiêu hao chất hữu cơ","B. lạnh diệt hết vi khuẩn","C. lạnh làm rau ngủ đông","D. lạnh tăng quang hợp"],"answer":"A","explain":"Lạnh: enzyme hô hấp hoạt động yếu → hô hấp giảm → chậm tiêu hao chất dự trữ.","level":"VD","points":0.25},{"type":"mcq","q":"Hạt thóc phơi khô bảo quản được lâu vì","options":["A. ít nước nên hô hấp rất yếu, ít tiêu hao chất dự trữ","B. khô diệt được mọt","C. hạt khô nhẹ dễ cất","D. hạt khô thơm hơn"],"answer":"A","explain":"Hạt khô: thiếu nước, enzyme không hoạt động → hô hấp rất yếu → giữ được chất dự trữ lâu.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hô hấp yếm khí.","statements":["a) Xảy ra khi thiếu O2","b) Chỉ tạo rất ít ATP","c) Làm tích luỹ chất độc","d) Tạo nhiều ATP hơn hô hấp hiếu khí"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: yếm khí chỉ tạo 2 ATP, ít hơn nhiều so với hiếu khí.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về yếu tố ảnh hưởng đến hô hấp.","statements":["a) Nhiệt độ thích hợp làm tăng hô hấp","b) Nồng độ CO2 cao ức chế hô hấp","c) Thiếu O2 làm giảm hô hấp hiếu khí","d) Nước không ảnh hưởng đến hô hấp"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: nước ảnh hưởng lớn (hạt khô hô hấp yếu, hạt ướt nảy mầm hô hấp mạnh).","level":"TH","points":1},{"type":"short","q":"Cây lấy khí nào từ môi trường làm nguyên liệu cho hô hấp?","answer":"Oxygen","explain":"Hô hấp hiếu khí cần khí oxygen (O2) để phân giải hoàn toàn glucose.","level":"VD","points":0.5},{"type":"short","q":"Muốn hạt nảy mầm nhanh cần tạo điều kiện nào để rễ đủ khí hô hấp?","answer":"Thoáng khí","explain":"Đất thoáng khí cung cấp đủ O2 cho hạt hô hấp mạnh, nảy mầm nhanh.","level":"VDC","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","q":"Hô hấp ở thực vật diễn ra ở","options":["A. mọi cơ quan của cây, suốt ngày đêm","B. chỉ ở lá","C. chỉ vào ban đêm","D. chỉ ở rễ"],"answer":"A","explain":"Mọi tế bào sống (rễ, thân, lá, hoa, quả, hạt) đều hô hấp suốt ngày đêm.","level":"NB","points":0.25},{"type":"mcq","q":"Hô hấp yếm khí còn được gọi là","options":["A. lên men","B. quang hợp","C. đường phân","D. chu trình Krebs"],"answer":"A","explain":"Hô hấp yếm khí = lên men (lên men rượu, lên men lactic).","level":"NB","points":0.25},{"type":"mcq","q":"Lên men rượu tạo ra","options":["A. ethanol và CO2, rất ít ATP","B. nhiều ATP","C. khí O2","D. đường glucose"],"answer":"A","explain":"Lên men rượu: glucose thành ethanol + CO2, chỉ tạo 2 ATP.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao hô hấp hiếu khí tạo nhiều ATP hơn hô hấp yếm khí?","options":["A. phân giải hoàn toàn glucose qua 3 giai đoạn","B. cần ít enzyme hơn","C. diễn ra nhanh hơn","D. không cần O2"],"answer":"A","explain":"Hiếu khí phân giải hoàn toàn glucose qua đường phân, Krebs, chuỗi truyền electron → nhiều ATP.","level":"TH","points":0.25},{"type":"mcq","q":"Ủ chua rau (làm dưa muối) là ứng dụng của quá trình nào?","options":["A. lên men lactic của vi khuẩn","B. hô hấp hiếu khí","C. quang hợp","D. thoát hơi nước"],"answer":"A","explain":"Muối dưa: vi khuẩn lactic lên men yếm khí tạo acid lactic làm chua rau.","level":"VD","points":0.25},{"type":"mcq","q":"Đống rơm ủ thành đống to bị nóng lên vì","options":["A. vi sinh vật hô hấp toả nhiệt","B. ánh nắng chiếu vào","C. rơm tự cháy","D. ma sát giữa các cọng rơm"],"answer":"A","explain":"Vi sinh vật phân giải rơm hô hấp mạnh, một phần năng lượng toả thành nhiệt.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về phương trình hô hấp.","statements":["a) Nguyên liệu là glucose và O2","b) Sản phẩm là CO2 và nước","c) Giải phóng năng lượng dưới dạng ATP","d) Quá trình này cần ánh sáng"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: hô hấp không cần ánh sáng, diễn ra cả ngày đêm.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về bảo quản nông sản.","statements":["a) Bảo quản lạnh làm giảm hô hấp","b) Giảm O2 làm giảm hô hấp","c) Tăng CO2 ức chế hô hấp","d) Để nơi nóng ẩm bảo quản tốt nhất"],"answer":["T","T","T","F"],"explain":"a, b, c đúng là biện pháp giảm hô hấp. d sai: nóng ẩm làm tăng hô hấp, nhanh hỏng.","level":"TH","points":1},{"type":"short","q":"Chất khí nào được cây thải ra khi hô hấp?","answer":"Carbon dioxide","explain":"Hô hấp thải ra khí carbon dioxide (CO2) — ngược với quang hợp.","level":"VD","points":0.5},{"type":"short","q":"Trong làm bánh mì, men rượu lên men tạo khí nào làm bánh nở xốp?","answer":"Carbon dioxide","explain":"Men rượu lên men tạo CO2 làm bánh nở; rượu bay hơi khi nướng.","level":"VDC","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","q":"Hô hấp là quá trình ngược với","options":["A. quang hợp","B. thoát hơi nước","C. hút nước","D. vận chuyển"],"answer":"A","explain":"Quang hợp tổng hợp chất hữu cơ; hô hấp phân giải chất hữu cơ — hai quá trình ngược nhau.","level":"NB","points":0.25},{"type":"mcq","q":"ATP được tạo ra nhiều nhất ở giai đoạn nào?","options":["A. chuỗi truyền electron","B. đường phân","C. chu trình Krebs","D. lên men lactic"],"answer":"A","explain":"Chuỗi truyền electron tạo phần lớn ATP trong hô hấp hiếu khí.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao cây cần hô hấp cả vào ban ngày?","options":["A. mọi hoạt động sống cần ATP liên tục","B. ban ngày trời nóng","C. quang hợp cần ATP của hô hấp","D. để thải CO2"],"answer":"A","explain":"Hút khoáng, tổng hợp chất, sinh trưởng... cần ATP liên tục nên hô hấp diễn ra cả ngày đêm.","level":"TH","points":0.25},{"type":"mcq","q":"Hô hấp sáng xảy ra mạnh ở","options":["A. cây C3 khi trời nóng, khô","B. mọi cây mọi lúc","C. cây C4","D. vào ban đêm"],"answer":"A","explain":"Hô hấp sáng xảy ra ở cây C3 khi nóng, khô: O2 cạnh tranh CO2 làm giảm hiệu quả quang hợp.","level":"TH","points":0.25},{"type":"mcq","q":"Làm đất tơi xốp giúp rễ hô hấp tốt vì","options":["A. đất thoáng, đủ O2 cho rễ hô hấp","B. đất mềm rễ dễ đâm","C. diệt cỏ dại","D. giữ phân bón"],"answer":"A","explain":"Đất tơi xốp nhiều khe hở chứa O2 → rễ hô hấp hiếu khí tạo đủ ATP hút khoáng.","level":"VD","points":0.25},{"type":"mcq","q":"Quả chuối xanh để chung với quả chín thì nhanh chín vì","options":["A. quả chín thải ethylene kích thích hô hấp làm quả xanh chín nhanh","B. quả chín lây màu","C. quả chín toả nhiệt","D. do va chạm"],"answer":"A","explain":"Ethylene từ quả chín kích thích hô hấp và quá trình chín của quả xanh.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về nơi diễn ra hô hấp.","statements":["a) Đường phân diễn ra ở bào tương","b) Chu trình Krebs diễn ra ở ti thể","c) Quang hợp cũng diễn ra ở ti thể","d) Mọi tế bào sống đều hô hấp"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: quang hợp diễn ra ở lục lạp.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về mối quan hệ giữa quang hợp và hô hấp.","statements":["a) Quang hợp tạo chất hữu cơ cho hô hấp","b) Hô hấp tạo CO2 cho quang hợp","c) Hai quá trình hoàn toàn độc lập","d) Hô hấp tạo ATP cho quang hợp (pha tối)"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: hai quá trình liên quan mật thiết, bổ sung cho nhau.","level":"TH","points":1},{"type":"short","q":"Năng lượng ATP ở rễ được dùng trực tiếp cho hoạt động nào?","answer":"Hút khoáng","explain":"Rễ dùng ATP cho hút khoáng chủ động (ngược chiều gradient nồng độ).","level":"VD","points":0.5},{"type":"short","q":"Chất khí nào được tăng lên trong kho bảo quản để ức chế hô hấp của rau quả?","answer":"Carbon dioxide","explain":"CO2 nồng độ cao ức chế hô hấp → rau quả tươi lâu (kho khí quyển điều chỉnh).","level":"VDC","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","q":"Ở cây non, cơ quan nào hô hấp mạnh nhất?","options":["A. rễ và chồi đang sinh trưởng","B. lá già","C. vỏ thân","D. hoa"],"answer":"A","explain":"Cơ quan đang sinh trưởng mạnh (rễ non, chồi) cần nhiều ATP nên hô hấp mạnh.","level":"NB","points":0.25},{"type":"mcq","q":"Hô hấp yếm khí tạo ra","options":["A. rất ít ATP","B. nhiều ATP","C. khí O2","D. đường glucose"],"answer":"A","explain":"Yếm khí (lên men) chỉ tạo 2 ATP, ít hơn nhiều so với hiếu khí.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao hạt nảy mầm cần được cung cấp đủ nước?","options":["A. nước hoạt hoá enzyme, hô hấp mạnh tạo ATP","B. nước làm mềm vỏ hạt","C. nước thay thế O2","D. nước tạo nhiệt"],"answer":"A","explain":"Đủ nước: enzyme hoạt động, hô hấp mạnh → đủ ATP cho nảy mầm.","level":"TH","points":0.25},{"type":"mcq","q":"CO2 nồng độ cao ức chế hô hấp nên được ứng dụng để","options":["A. bảo quản rau quả tươi lâu","B. tăng quang hợp","C. ủ phân hữu cơ","D. làm bánh mì"],"answer":"A","explain":"Tăng CO2, giảm O2 trong kho bảo quản → ức chế hô hấp → rau quả tươi lâu.","level":"TH","points":0.25},{"type":"mcq","q":"Ngâm hạt giống trong nước quá lâu trước khi gieo làm hạt bị thối vì","options":["A. thiếu O2, hô hấp yếm khí tạo chất độc","B. hạt bị no nước","C. nước quá lạnh","D. vỏ hạt bị nứt"],"answer":"A","explain":"Ngâm lâu thiếu O2 → hạt hô hấp yếm khí, tích chất độc → thối hạt.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao khi muối dưa, người ta nén chặt rau và đậy kín?","options":["A. tạo điều kiện yếm khí cho vi khuẩn lactic lên men","B. để dưa đẹp mắt","C. để tránh ruồi","D. để giữ nhiệt"],"answer":"A","explain":"Nén chặt, đậy kín tạo môi trường yếm khí cho vi khuẩn lactic lên men tạo acid.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hô hấp ở thực vật.","statements":["a) Hô hấp xảy ra suốt ngày đêm","b) Hô hấp hiếu khí cần O2","c) Hô hấp chỉ xảy ra ở lá","d) Hô hấp tạo năng lượng cho hoạt động sống"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: mọi cơ quan của cây đều hô hấp.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về lên men.","statements":["a) Lên men là hô hấp yếm khí","b) Gồm đường phân rồi lên men tạo sản phẩm","c) Lên men tạo nhiều ATP","d) Được ứng dụng làm rượu, muối dưa"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: lên men chỉ tạo rất ít ATP (2 ATP).","level":"TH","points":1},{"type":"short","q":"Viết tên quá trình phân giải glucose không cần O2.","answer":"Lên men","explain":"Lên men = hô hấp yếm khí: phân giải glucose không cần O2.","level":"VD","points":0.5},{"type":"short","q":"Trong chu trình Krebs, carbon của glucose được thải ra dưới dạng khí nào?","answer":"Carbon dioxide","explain":"Chu trình Krebs phân giải hoàn toàn, thải carbon dưới dạng CO2.","level":"VDC","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","q":"Hô hấp tế bào có sử dụng O2 còn được gọi là","options":["A. hô hấp hiếu khí","B. quang hợp","C. lên men","D. đường phân"],"answer":"A","explain":"Hô hấp hiếu khí: phân giải glucose với sự tham gia của O2.","level":"NB","points":0.25},{"type":"mcq","q":"Đường phân phân giải glucose thành","options":["A. acid pyruvic","B. CO2","C. ATP","D. O2"],"answer":"A","explain":"Đường phân: glucose thành 2 acid pyruvic, tạo ít ATP.","level":"NB","points":0.25},{"type":"mcq","q":"NADH và FADH2 trong hô hấp có vai trò","options":["A. mang electron vào chuỗi truyền để tạo ATP","B. cố định CO2","C. thải O2","D. tạo glucose"],"answer":"A","explain":"NADH, FADH2 mang electron và H+ vào chuỗi truyền electron tạo nhiều ATP.","level":"TH","points":0.25},{"type":"mcq","q":"Nước được tạo ra ở giai đoạn nào của hô hấp?","options":["A. chuỗi truyền electron","B. đường phân","C. chu trình Krebs","D. lên men"],"answer":"A","explain":"Cuối chuỗi truyền electron, O2 nhận electron và H+ tạo nước.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao rau để trong túi nilon buộc kín nhanh bị úng?","options":["A. thiếu O2 nên hô hấp yếm khí tạo chất độc, hơi nước đọng","B. túi nilon nóng","C. thiếu ánh sáng","D. rau đã già"],"answer":"A","explain":"Túi kín: hết O2 → hô hấp yếm khí tạo chất độc; hơi nước đọng → rau úng.","level":"VD","points":0.25},{"type":"mcq","q":"Cây trồng thuỷ canh cần được sục khí vào dung dịch vì","options":["A. rễ cần O2 để hô hấp tạo ATP hút khoáng","B. để cho vui mắt","C. để chống rêu","D. để làm mát dung dịch"],"answer":"A","explain":"Rễ hô hấp hiếu khí tạo ATP cho hút khoáng chủ động; thiếu O2 rễ suy yếu.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về sản phẩm các giai đoạn hô hấp.","statements":["a) Đường phân tạo acid pyruvic","b) Chu trình Krebs thải CO2","c) Chuỗi truyền electron tạo nhiều ATP","d) Lên men tạo nhiều ATP"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: lên men chỉ tạo rất ít ATP.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về nhiệt độ với hô hấp.","statements":["a) Nhiệt tăng đến ngưỡng tối ưu thì hô hấp tăng","b) Nhiệt quá cao làm giảm hô hấp","c) Nhiệt độ không ảnh hưởng đến hô hấp","d) Hạt khô, lạnh thì hô hấp yếu"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: nhiệt độ ảnh hưởng lớn đến hoạt tính enzyme hô hấp.","level":"TH","points":1},{"type":"short","q":"Khí O2 trong hô hấp được sử dụng ở giai đoạn nào?","answer":"Chuỗi truyền electron","explain":"O2 là chất nhận electron cuối cùng ở chuỗi truyền electron, tạo nước.","level":"VD","points":0.5},{"type":"short","q":"Chất nhận electron cuối cùng trong chuỗi truyền electron là gì?","answer":"Oxygen","explain":"Oxygen nhận electron và H+ ở cuối chuỗi truyền tạo thành nước.","level":"VDC","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","q":"Hô hấp giải phóng năng lượng dưới dạng","options":["A. ATP và nhiệt năng","B. ánh sáng","C. cơ năng","D. điện năng"],"answer":"A","explain":"Một phần năng lượng thành ATP, một phần toả ra dưới dạng nhiệt.","level":"NB","points":0.25},{"type":"mcq","q":"Ti thể được mệnh danh là","options":["A. nhà máy năng lượng của tế bào","B. nhà máy đường","C. kho chứa chất","D. bếp của tế bào"],"answer":"A","explain":"Ti thể tạo phần lớn ATP nên được gọi là nhà máy năng lượng (trạm năng lượng).","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao nói hô hấp và quang hợp là hai quá trình ngược nhau?","options":["A. nguyên liệu của quá trình này là sản phẩm của quá trình kia","B. xảy ra ở cùng một bào quan","C. cùng cần ánh sáng","D. hai quá trình không ngược nhau"],"answer":"A","explain":"Quang hợp: CO2 + H2O thành chất hữu cơ + O2; hô hấp: chất hữu cơ + O2 thành CO2 + H2O.","level":"TH","points":0.25},{"type":"mcq","q":"Hạt đang nảy mầm thải ra nhiều khí nào?","options":["A. CO2","B. O2","C. nitơ","D. hydrogen"],"answer":"A","explain":"Hạt nảy mầm hô hấp mạnh, thải nhiều CO2.","level":"TH","points":0.25},{"type":"mcq","q":"Bảo quản hạt giống cần điều kiện","options":["A. khô, lạnh, thoáng","B. ẩm, nóng","C. ngâm trong nước","D. phơi nắng gắt"],"answer":"A","explain":"Khô, lạnh: hô hấp rất yếu, giữ được sức nảy mầm lâu.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao không nên để nhiều cây xanh trong phòng ngủ đóng kín vào ban đêm?","options":["A. cây hô hấp thải CO2, cạnh tranh O2","B. cây thải chất độc","C. cây hút hết hơi ẩm","D. cây gây ồn"],"answer":"A","explain":"Ban đêm cây không quang hợp mà hô hấp thải CO2, làm giảm O2 trong phòng kín.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hô hấp hiếu khí.","statements":["a) Cần khí O2","b) Phân giải hoàn toàn glucose","c) Tạo nhiều ATP","d) Xảy ra khi thiếu O2"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: thiếu O2 thì xảy ra hô hấp yếm khí (lên men).","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về ứng dụng điều tiết hô hấp.","statements":["a) Kho lạnh để bảo quản rau quả","b) Bao gói khí quyển điều chỉnh","c) Phơi khô hạt để bảo quản","d) Ủ đống rơm ướt để bảo quản rơm"],"answer":["T","T","T","F"],"explain":"a, b, c đúng là biện pháp giảm hô hấp. d sai: rơm ướt hô hấp mạnh, nóng lên, nhanh mục.","level":"TH","points":1},{"type":"short","q":"Quá trình nào tạo ra phần lớn ATP cho tế bào?","answer":"Hô hấp hiếu khí","explain":"Hô hấp hiếu khí tạo phần lớn ATP cho mọi hoạt động sống của tế bào.","level":"VD","points":0.5},{"type":"short","q":"Ngoài ATP, hô hấp còn cung cấp gì cho quá trình tổng hợp chất hữu cơ?","answer":"Sản phẩm trung gian","explain":"Các sản phẩm trung gian của hô hấp là nguyên liệu tổng hợp nhiều chất hữu cơ khác.","level":"VDC","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Nguyên liệu hô hấp chủ yếu của tế bào là","options":["A. glucose","B. protein","C. lipid","D. vitamin"],"answer":"A","explain":"Glucose (carbohydrate) là nguyên liệu hô hấp chủ yếu.","level":"NB","points":0.25},{"type":"mcq","q":"Hô hấp thải ra khí","options":["A. CO2","B. O2","C. nitơ","D. hydrogen"],"answer":"A","explain":"Hô hấp thải ra khí carbon dioxide (CO2).","level":"NB","points":0.25},{"type":"mcq","q":"Khi nào tế bào thực vật chuyển sang hô hấp yếm khí?","options":["A. khi thiếu O2","B. khi thừa O2","C. vào ban đêm","D. khi đang quang hợp"],"answer":"A","explain":"Thiếu O2 (ngập úng): tế bào chuyển sang lên men yếm khí.","level":"TH","points":0.25},{"type":"mcq","q":"Lên men lactic tạo ra","options":["A. acid lactic và rất ít ATP","B. rượu ethanol","C. khí O2","D. đường glucose"],"answer":"A","explain":"Lên men lactic: acid pyruvic thành acid lactic, chỉ tạo 2 ATP.","level":"TH","points":0.25},{"type":"mcq","q":"Làm sữa chua là ứng dụng của quá trình","options":["A. lên men lactic","B. hô hấp hiếu khí","C. quang hợp","D. đường phân"],"answer":"A","explain":"Vi khuẩn lactic lên men đường trong sữa tạo acid lactic làm đông tụ sữa.","level":"VD","points":0.25},{"type":"mcq","q":"Cơ bắp hoạt động mạnh thiếu O2 cũng lên men lactic gây ra","options":["A. mỏi cơ","B. tăng sức mạnh","C. mát cơ","D. không có gì"],"answer":"A","explain":"Thiếu O2, cơ lên men lactic; acid lactic tích luỹ gây mỏi cơ.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hô hấp và quang hợp.","statements":["a) Quang hợp tạo O2 cho hô hấp","b) Hô hấp tạo CO2 cho quang hợp","c) Cả hai quá trình đều cần ánh sáng","d) Cả hai quá trình đều tạo ATP"],"answer":["T","T","F","T"],"explain":"a, b, d đúng (pha sáng tạo ATP). c sai: hô hấp không cần ánh sáng.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về giữ nông sản tươi lâu.","statements":["a) Giảm hô hấp giúp giữ nông sản lâu","b) Tăng hô hấp giúp giữ nông sản lâu","c) Hạt khô thì hô hấp yếu","d) Rau héo thì hô hấp mạnh"],"answer":["T","F","T","T"],"explain":"a, c, d đúng. b sai: tăng hô hấp làm nhanh tiêu hao chất dự trữ, nhanh hỏng.","level":"TH","points":1},{"type":"short","q":"Chất nào được phân giải đầu tiên trong quá trình hô hấp?","answer":"Glucose","explain":"Glucose được phân giải đầu tiên ở giai đoạn đường phân.","level":"VD","points":0.5},{"type":"short","q":"Vì sao hô hấp yếm khí kéo dài gây ngộ độc tế bào?","answer":"Tích luỹ chất độc","explain":"Lên men tích luỹ rượu ethanol hoặc acid lactic gây độc cho tế bào.","level":"VDC","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","q":"Hô hấp ở rễ lấy O2 từ","options":["A. các khe hở trong đất","B. lá chuyển xuống","C. nước tưới","D. phân bón"],"answer":"A","explain":"Rễ lấy O2 từ các khe hở trong đất; đất nén chặt hoặc ngập úng gây thiếu O2.","level":"NB","points":0.25},{"type":"mcq","q":"Hô hấp ở lá lấy O2 qua","options":["A. khí khổng","B. lớp cutin","C. mạch gỗ","D. lông hút"],"answer":"A","explain":"Lá trao đổi khí (lấy O2, thải CO2) qua khí khổng.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao đất nén chặt làm cây chậm lớn?","options":["A. thiếu O2 cho rễ hô hấp nên thiếu ATP để hút khoáng","B. đất cứng rễ không đâm xuyên","C. thiếu nước","D. thiếu phân"],"answer":"A","explain":"Đất nén chặt ít O2 → rễ hô hấp yếu → thiếu ATP cho hút khoáng chủ động → cây chậm lớn.","level":"TH","points":0.25},{"type":"mcq","q":"Hô hấp ở cây diễn ra mạnh nhất khi","options":["A. cây sinh trưởng mạnh, nhiệt độ thích hợp, đủ O2","B. cây đang ngủ đông","C. hạt khô","D. mùa đông lạnh"],"answer":"A","explain":"Sinh trưởng mạnh cần nhiều ATP; nhiệt thích hợp, đủ O2 → hô hấp mạnh.","level":"TH","points":0.25},{"type":"mcq","q":"Xới đất quanh gốc cây giúp","options":["A. đất thoáng khí, rễ hô hấp tốt","B. diệt cỏ dại","C. bón phân","D. giữ ẩm"],"answer":"A","explain":"Xới đất làm đất tơi xốp, thoáng khí → rễ đủ O2 hô hấp.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao quả để trong tủ lạnh thì chín chậm?","options":["A. lạnh làm giảm hô hấp nên chậm chín","B. trong tủ tối","C. trong tủ khô","D. thiếu khí ethylene"],"answer":"A","explain":"Lạnh ức chế enzyme hô hấp → quá trình chín (cần năng lượng hô hấp) chậm lại.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hô hấp ở các cơ quan.","statements":["a) Rễ hô hấp lấy O2 từ đất","b) Lá hô hấp trao đổi khí qua khí khổng","c) Hạt khô hô hấp rất yếu","d) Chỉ có lá mới hô hấp"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: mọi cơ quan đều hô hấp.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về năng lượng của hô hấp.","statements":["a) Một phần năng lượng thành ATP","b) Một phần năng lượng toả thành nhiệt","c) Toàn bộ năng lượng thành ATP","d) ATP được dùng cho hoạt động sống"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: chỉ một phần thành ATP, phần còn lại toả nhiệt.","level":"TH","points":1},{"type":"short","q":"Giai đoạn đường phân diễn ra ở đâu trong tế bào?","answer":"Bào tương","explain":"Đường phân diễn ra ở bào tương (tế bào chất).","level":"VD","points":0.5},{"type":"short","q":"Vì sao ti thể được gọi là trạm năng lượng của tế bào? (trả lời bằng cụm từ chỉ sản phẩm)","answer":"Tạo ATP","explain":"Ti thể tạo ra phần lớn ATP cho tế bào nên gọi là trạm năng lượng.","level":"VDC","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","q":"Xét về chuyển hoá vật chất, hô hấp ở thực vật là quá trình","options":["A. dị hoá","B. đồng hoá","C. quang hợp","D. vận chuyển"],"answer":"A","explain":"Hô hấp phân giải chất hữu cơ, giải phóng năng lượng → dị hoá.","level":"NB","points":0.25},{"type":"mcq","q":"Chất hữu cơ bị phân giải trong hô hấp chủ yếu là","options":["A. carbohydrate (glucose)","B. nước","C. chất khoáng","D. vitamin"],"answer":"A","explain":"Carbohydrate (glucose) là nguyên liệu hô hấp chủ yếu.","level":"NB","points":0.25},{"type":"mcq","q":"Hô hấp cung cấp nguyên liệu cho quang hợp là","options":["A. CO2 và nước","B. O2","C. ATP","D. đường"],"answer":"A","explain":"Hô hấp thải CO2 và nước — là nguyên liệu cho quang hợp.","level":"TH","points":0.25},{"type":"mcq","q":"Quang hợp cung cấp cho hô hấp","options":["A. chất hữu cơ và O2","B. CO2","C. nước","D. ATP"],"answer":"A","explain":"Quang hợp tạo chất hữu cơ và O2 — là nguyên liệu cho hô hấp.","level":"TH","points":0.25},{"type":"mcq","q":"Trồng cây trong nhà kính cần thông gió để","options":["A. cung cấp O2 cho hô hấp ban đêm và CO2 cho quang hợp","B. làm mát","C. đuổi sâu bệnh","D. tăng độ ẩm"],"answer":"A","explain":"Thông gió: ban ngày đưa CO2 vào cho quang hợp, ban đêm đưa O2 cho hô hấp.","level":"VD","points":0.25},{"type":"mcq","q":"Cây bị ngập úng lâu ngày thì lá vàng, rụng vì","options":["A. rễ thối không hút được nước, khoáng; thiếu ATP","B. cây thừa nước","C. thiếu ánh sáng","D. trời lạnh"],"answer":"A","explain":"Ngập úng: rễ thiếu O2, hô hấp yếm khí → rễ thối → không hút nước, khoáng → lá vàng rụng.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét tổng quát về hô hấp ở thực vật.","statements":["a) Là quá trình dị hoá","b) Xảy ra ở mọi tế bào sống","c) Cần ánh sáng mới diễn ra","d) Tạo năng lượng ATP"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: hô hấp không cần ánh sáng.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về điều tiết hô hấp.","statements":["a) Con người giảm hô hấp để bảo quản nông sản","b) Tăng hô hấp khi cần hạt nảy mầm","c) Không thể điều tiết hô hấp","d) Nhiệt độ ảnh hưởng đến hô hấp"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: điều tiết được qua nhiệt độ, O2, CO2, nước.","level":"TH","points":1},{"type":"short","q":"Viết tên giai đoạn đầu tiên của hô hấp hiếu khí.","answer":"Đường phân","explain":"Đường phân là giai đoạn đầu tiên, diễn ra ở bào tương.","level":"VD","points":0.5},{"type":"short","q":"Vì sao hô hấp hiếu khí hiệu quả hơn lên men? (trả lời bằng cụm từ chỉ mức độ phân giải)","answer":"Phân giải hoàn toàn","explain":"Hiếu khí phân giải hoàn toàn glucose nên tạo nhiều ATP hơn lên men.","level":"VDC","points":0.5}]}]}
