<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","q":"Thoát hơi nước là quá trình","options":["A. nước từ lá thoát ra không khí ở dạng hơi nước","B. rễ hút nước từ đất","C. nước chảy trong mạch gỗ","D. lá hấp thụ nước mưa"],"answer":"A","explain":"Thoát hơi nước là sự mất nước từ lá (chủ yếu) ra không khí ở dạng hơi nước.","level":"NB","points":0.25},{"type":"mcq","q":"Thoát hơi nước ở lá diễn ra chủ yếu qua","options":["A. khí khổng","B. lớp cutin","C. lông hút","D. mạch gỗ"],"answer":"A","explain":"Con đường qua khí khổng là chủ yếu; qua cutin chỉ chiếm một phần rất nhỏ.","level":"NB","points":0.25},{"type":"mcq","q":"Khi tế bào khí khổng trương nước thì","options":["A. thành mỏng cong ra, lỗ khí mở rộng","B. lỗ khí khép lại","C. tế bào bị chết","D. lớp cutin dày lên"],"answer":"A","explain":"Tế bào trương nước: thành ngoài mỏng cong ra nhiều hơn thành trong dày → lỗ khí mở.","level":"TH","points":0.25},{"type":"mcq","q":"Vai trò nào sau đây KHÔNG phải của thoát hơi nước?","options":["A. tổng hợp chất hữu cơ","B. tạo lực hút cho dòng mạch gỗ","C. làm mát lá","D. giúp CO2 khuếch tán vào lá"],"answer":"A","explain":"Tổng hợp chất hữu cơ là vai trò của quang hợp. B, C, D là vai trò của thoát hơi nước.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao cây trồng trong bóng râm thoát hơi nước yếu hơn cây ngoài nắng?","options":["A. ánh sáng yếu làm khí khổng khép lại, nhiệt độ lá thấp","B. cây trong bóng râm không có khí khổng","C. bóng râm hút hết nước","D. cây trong bóng râm không cần nước"],"answer":"A","explain":"Ánh sáng yếu → khí khổng khép, nhiệt độ thấp → nước bay hơi chậm → thoát hơi nước yếu.","level":"VD","points":0.25},{"type":"mcq","q":"Buổi trưa nắng gắt, một số cây khép khí khổng lại. Tác dụng của việc này là","options":["A. giảm mất nước nhưng cũng làm giảm CO2 vào nên quang hợp giảm","B. chỉ có lợi, không có hại","C. chỉ có hại, không có lợi","D. không ảnh hưởng gì đến cây"],"answer":"A","explain":"Khép khí khổng: giảm mất nước (lợi) nhưng CO2 vào ít → quang hợp giảm (hại) — gọi là hiện tượng ngủ trưa.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về con đường thoát hơi nước.","statements":["a) Thoát hơi nước chủ yếu qua khí khổng","b) Một phần nhỏ nước thoát qua lớp cutin","c) Nước thoát chủ yếu qua lông hút ở rễ","d) Khí khổng phân bố nhiều ở mặt dưới lá"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: lông hút là nơi hút nước, không phải nơi thoát hơi nước.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về vai trò của thoát hơi nước.","statements":["a) Tạo động lực hút nước từ rễ lên lá","b) Làm mát lá dưới nắng gắt","c) Giúp CO2 khuếch tán vào lá","d) Làm tăng nhiệt độ của lá"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: thoát hơi nước làm mát (giảm nhiệt độ) lá.","level":"TH","points":1},{"type":"short","q":"Ion nào đi vào tế bào khí khổng làm tế bào trương nước, mở lỗ khí?","answer":"Kali","explain":"Ion K+ đi vào tế bào khí khổng, nước đi vào theo làm tế bào trương nước → lỗ khí mở.","level":"VD","points":0.5},{"type":"short","q":"Cây héo không phục hồi được dù đã được tưới đủ nước gọi là héo gì?","answer":"Héo vĩnh viễn","explain":"Héo vĩnh viễn: thiếu nước kéo dài làm tế bào chết, cây không phục hồi được.","level":"VDC","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","q":"Lớp cutin trên bề mặt lá có vai trò","options":["A. hạn chế thoát hơi nước qua bề mặt lá","B. là con đường thoát hơi nước chủ yếu","C. hút nước từ không khí","D. thực hiện quang hợp"],"answer":"A","explain":"Cutin là lớp sáp chống thấm, hạn chế nước thấm qua bề mặt lá.","level":"NB","points":0.25},{"type":"mcq","q":"Yếu tố nào làm tăng cường độ thoát hơi nước?","options":["A. nhiệt độ cao, gió mạnh, không khí khô","B. độ ẩm không khí cao","C. trời đang mưa","D. ban đêm"],"answer":"A","explain":"Nóng, gió, khô hanh đều làm nước bay hơi nhanh → thoát hơi nước mạnh.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao gió làm tăng thoát hơi nước?","options":["A. gió thổi bay lớp hơi nước quanh lá, tăng chênh lệch thế nước","B. gió làm lá rung mạnh","C. gió mang CO2 đến","D. gió làm mát lá"],"answer":"A","explain":"Gió thổi bay lớp không khí ẩm quanh lá → chênh lệch thế nước giữa lá và không khí tăng → thoát mạnh.","level":"TH","points":0.25},{"type":"mcq","q":"Khí khổng khép lại khi","options":["A. tế bào khí khổng mất nước, thành duỗi thẳng","B. trời đang mưa to","C. vào ban ngày","D. cây được tưới đủ nước"],"answer":"A","explain":"Thiếu nước: K+ và nước đi ra khỏi tế bào khí khổng → tế bào mất độ trương → lỗ khí khép.","level":"TH","points":0.25},{"type":"mcq","q":"Phủ rơm rạ quanh gốc cây có tác dụng","options":["A. giữ ẩm cho đất, giảm bốc hơi nước","B. tăng thoát hơi nước ở lá","C. diệt cỏ dại hoàn toàn","D. bón phân cho cây"],"answer":"A","explain":"Phủ rơm rạ che mặt đất, giảm bốc hơi nước, giữ ẩm cho đất.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao lá cây vùng khô hạn thường nhỏ, dày và có lông?","options":["A. giảm diện tích và tốc độ thoát hơi nước","B. để tăng cường quang hợp","C. để chống rét","D. để lá đẹp hơn"],"answer":"A","explain":"Lá nhỏ, dày, có lông, cutin dày là thích nghi giảm thoát hơi nước ở vùng khô hạn.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về khí khổng.","statements":["a) Mỗi khí khổng gồm 2 tế bào hình hạt đậu","b) Tế bào khí khổng có thành trong dày, thành ngoài mỏng","c) Khí khổng phân bố rải rác, nhiều ở mặt dưới lá","d) Khí khổng hút nước từ đất lên"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: khí khổng là nơi thoát hơi nước và trao đổi khí, không hút nước.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về yếu tố ảnh hưởng đến thoát hơi nước.","statements":["a) Ánh sáng mạnh làm khí khổng mở","b) Độ ẩm không khí cao làm giảm thoát hơi nước","c) Gió mạnh làm tăng thoát hơi nước","d) Đất khô làm tăng thoát hơi nước"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: đất khô → cây thiếu nước → khí khổng khép → thoát hơi nước giảm.","level":"TH","points":1},{"type":"short","q":"Ngoài khí khổng, nước còn thoát một phần rất nhỏ qua lớp nào trên bề mặt lá?","answer":"Cutin","explain":"Lớp cutin (sáp chống thấm) trên bề mặt lá: nước thấm qua rất ít.","level":"VD","points":0.5},{"type":"short","q":"Cây héo vào trưa nắng nhưng đến chiều mát lại tươi trở lại, gọi là héo gì?","answer":"Héo tạm thời","explain":"Héo tạm thời: mất cân bằng nước nhất thời, cây phục hồi khi điều kiện thuận lợi; khác héo vĩnh viễn không phục hồi được.","level":"VDC","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","q":"Thoát hơi nước diễn ra mạnh nhất vào thời điểm nào?","options":["A. giữa trưa nắng, khô hanh, có gió","B. ban đêm","C. khi trời mưa","D. sáng sớm nhiều sương"],"answer":"A","explain":"Trưa nắng, khô, có gió là điều kiện thuận lợi nhất cho nước bay hơi.","level":"NB","points":0.25},{"type":"mcq","q":"Lỗ khí được tạo thành bởi","options":["A. 2 tế bào khí khổng","B. 1 tế bào biểu bì","C. lớp cutin","D. mạch gỗ"],"answer":"A","explain":"Mỗi lỗ khí (khí khổng) do 2 tế bào khí khổng hình hạt đậu tạo thành.","level":"NB","points":0.25},{"type":"mcq","q":"Ánh sáng ảnh hưởng đến thoát hơi nước vì","options":["A. ánh sáng làm khí khổng mở và tăng nhiệt độ lá","B. ánh sáng phá huỷ phân tử nước","C. ánh sáng hút nước từ lá","D. ánh sáng không ảnh hưởng"],"answer":"A","explain":"Có ánh sáng: khí khổng mở (để lấy CO2), nhiệt độ lá tăng → thoát hơi nước mạnh.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao tưới nước vào giữa trưa nắng gắt không hiệu quả?","options":["A. nước bốc hơi nhanh, cây đang héo tạm thời khó hấp thụ","B. cây không cần nước vào buổi trưa","C. nước làm cháy lá","D. rễ ngừng hoạt động buổi trưa"],"answer":"A","explain":"Trưa nắng nước bốc hơi nhanh, cây héo tạm thời; nên tưới sáng sớm hoặc chiều mát.","level":"TH","points":0.25},{"type":"mcq","q":"Nhà kính trồng rau thường phải mở cửa thông gió vì","options":["A. giảm độ ẩm, tăng thoát hơi nước và cung cấp CO2 cho quang hợp","B. để cho mát","C. để đuổi sâu bệnh","D. để tăng nhiệt độ"],"answer":"A","explain":"Thông gió giảm ẩm (tăng thoát hơi nước), đưa CO2 vào cho quang hợp, điều hoà nhiệt.","level":"VD","points":0.25},{"type":"mcq","q":"So sánh cây ngô (lá rộng) và xương rồng: cường độ thoát hơi nước khác nhau chủ yếu do","options":["A. diện tích lá và cấu tạo thích nghi (cutin dày, khí khổng ít)","B. bộ rễ","C. màu sắc lá","D. chiều cao cây"],"answer":"A","explain":"Ngô lá rộng, khí khổng nhiều → thoát mạnh; xương rồng lá tiêu giảm, cutin dày → thoát rất yếu.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về cường độ thoát hơi nước.","statements":["a) Thoát hơi nước mạnh vào ban ngày","b) Thoát hơi nước yếu vào ban đêm","c) Thoát hơi nước mạnh khi trời mưa","d) Thoát hơi nước mạnh khi khô, nóng, có gió"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: trời mưa độ ẩm cao, thoát hơi nước rất yếu.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về cân bằng nước của cây.","statements":["a) Cây cân bằng nước khi hút đủ bù cho thoát","b) Héo tạm thời có thể phục hồi được","c) Héo vĩnh viễn không phục hồi được","d) Cây trồng không bao giờ bị héo"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cây có thể héo tạm thời hoặc vĩnh viễn khi mất cân bằng nước.","level":"TH","points":1},{"type":"short","q":"Khí khổng mở vào ban ngày chủ yếu để lấy khí nào cho quang hợp?","answer":"Carbon dioxide","explain":"Khí khổng mở vừa thoát hơi nước vừa cho khí carbon dioxide (CO2) khuếch tán vào lá.","level":"VD","points":0.5},{"type":"short","q":"Bào quan nào trong tế bào khí khổng giúp tế bào nhận biết ánh sáng để đóng mở?","answer":"Lục lạp","explain":"Tế bào khí khổng có lục lạp (khác tế bào biểu bì), quang hợp tạo đường làm thay đổi độ trương.","level":"VDC","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","q":"Thoát hơi nước có vai trò tạo ra","options":["A. lực hút kéo nước từ rễ lên lá","B. áp suất rễ","C. mạch gỗ","D. lông hút"],"answer":"A","explain":"Lực hút do thoát hơi nước là động lực chủ yếu kéo cột nước trong mạch gỗ từ rễ lên lá.","level":"NB","points":0.25},{"type":"mcq","q":"Khi độ ẩm không khí tăng thì thoát hơi nước sẽ","options":["A. giảm","B. tăng","C. không đổi","D. ngừng hẳn"],"answer":"A","explain":"Ẩm cao → chênh lệch thế nước giữa lá và không khí nhỏ → thoát hơi nước giảm.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao lá cây thường có lớp cutin?","options":["A. hạn chế mất nước qua bề mặt lá","B. tăng cường thoát hơi nước","C. hút nước mưa","D. chống sâu bệnh là chính"],"answer":"A","explain":"Cutin là lớp sáp chống thấm, hạn chế nước thấm qua bề mặt lá.","level":"TH","points":0.25},{"type":"mcq","q":"Tế bào khí khổng khác tế bào biểu bì ở điểm","options":["A. có lục lạp, thành dày không đều","B. không có nhân","C. là tế bào chết","D. to hơn rất nhiều"],"answer":"A","explain":"Tế bào khí khổng có lục lạp, thành trong dày thành ngoài mỏng; tế bào biểu bì không có lục lạp.","level":"TH","points":0.25},{"type":"mcq","q":"Trồng cây che bóng cho cây con mới trồng nhằm mục đích","options":["A. giảm thoát hơi nước khi rễ chưa phục hồi","B. tăng cường quang hợp","C. chống mưa","D. làm đẹp vườn"],"answer":"A","explain":"Cây mới trồng rễ bị tổn thương, hút nước kém; che nắng giảm thoát hơi nước, tránh héo.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao một số cây sa mạc chỉ mở khí khổng vào ban đêm?","options":["A. ban đêm mát, ẩm nên giảm mất nước mà vẫn lấy được CO2 dự trữ","B. cây thích bóng tối","C. để tránh sâu ăn lá","D. để tiết kiệm năng lượng"],"answer":"A","explain":"Thực vật CAM mở khí khổng ban đêm lấy CO2 dự trữ dạng acid hữu cơ, ban ngày đóng khí khổng giảm mất nước.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về ý nghĩa của thoát hơi nước.","statements":["a) Là động lực chủ yếu của dòng mạch gỗ","b) Giúp lá không bị đốt nóng","c) Tạo điều kiện cho CO2 vào lá","d) Trực tiếp tổng hợp chất hữu cơ"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: tổng hợp chất hữu cơ là vai trò của quang hợp.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về điều tiết thoát hơi nước.","statements":["a) Cây điều tiết qua đóng mở khí khổng","b) Rụng lá mùa khô giúp giảm thoát hơi nước","c) Con người điều tiết bằng tưới tiêu, che phủ","d) Không có cách nào điều tiết thoát hơi nước"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cây và con người đều có biện pháp điều tiết thoát hơi nước.","level":"TH","points":1},{"type":"short","q":"Đại lượng nào đặc trưng cho khả năng thoát hơi nước của lá?","answer":"Cường độ","explain":"Cường độ thoát hơi nước: lượng nước thoát trên một đơn vị diện tích lá trong một đơn vị thời gian.","level":"VD","points":0.5},{"type":"short","q":"Nhóm thực vật mở khí khổng ban đêm, dự trữ CO2 dạng acid hữu cơ có tên là gì?","answer":"CAM","explain":"Thực vật CAM (xương rồng, dứa, thanh long) thích nghi khô hạn bằng cách mở khí khổng ban đêm.","level":"VDC","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","q":"Nước thoát ra từ lá chủ yếu ở dạng","options":["A. hơi nước","B. giọt nước","C. nước đá","D. sương mù"],"answer":"A","explain":"Nước bay hơi từ tế bào lá ra không khí ở dạng hơi nước.","level":"NB","points":0.25},{"type":"mcq","q":"Khí khổng phân bố nhiều nhất ở","options":["A. mặt dưới của lá","B. mặt trên của lá","C. thân cây","D. rễ cây"],"answer":"A","explain":"Khí khổng tập trung nhiều ở mặt dưới lá — ít nắng chiếu trực tiếp, giảm mất nước.","level":"NB","points":0.25},{"type":"mcq","q":"Nhiệt độ tăng làm thoát hơi nước tăng vì","options":["A. nước bay hơi nhanh, chênh lệch thế nước lớn","B. khí khổng đóng lại","C. lớp cutin dày lên","D. rễ hút nước mạnh hơn"],"answer":"A","explain":"Nhiệt cao: nước bay hơi nhanh, chênh lệch thế nước lá — không khí lớn → thoát mạnh.","level":"TH","points":0.25},{"type":"mcq","q":"Độ ẩm đất thấp ảnh hưởng đến thoát hơi nước như thế nào?","options":["A. cây thiếu nước nên khí khổng khép, thoát hơi nước giảm","B. làm tăng thoát hơi nước","C. không ảnh hưởng gì","D. cây chết ngay lập tức"],"answer":"A","explain":"Đất khô → cây thiếu nước → khí khổng khép để giữ nước → thoát hơi nước giảm.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao người ta tưới phun sương cho rau trong nhà kính?","options":["A. tăng độ ẩm, giảm thoát hơi nước, làm mát","B. để rửa sạch lá","C. để bón phân","D. để diệt nấm"],"answer":"A","explain":"Phun sương tăng ẩm, giảm thoát hơi nước, làm mát — rau tươi tốt trong nhà kính nóng.","level":"VD","points":0.25},{"type":"mcq","q":"Cây đước ở rừng ngập mặn có hệ rễ thở (rễ chống) nhô lên khỏi bùn để","options":["A. vừa giảm mất nước vừa lấy oxygen khi rễ ngập trong bùn","B. tăng thoát hơi nước","C. hút muối từ bùn","D. chống sóng đánh"],"answer":"A","explain":"Rễ thở giúp cây đước lấy oxygen khi rễ ngập bùn thiếu khí, đồng thời cây có cơ chế chống mất nước, thải muối.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về thoát hơi nước ở các cây khác nhau.","statements":["a) Cây lá rộng thoát hơi nước nhiều hơn cây lá kim","b) Cây sa mạc có cấu tạo giảm thoát hơi nước","c) Mọi loài cây thoát hơi nước như nhau","d) Lá càng to, khí khổng càng nhiều thì thoát càng mạnh"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: cường độ thoát hơi nước khác nhau tuỳ loài và điều kiện.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về mối quan hệ giữa thoát hơi nước và hút nước.","statements":["a) Hai quá trình liên quan chặt chẽ với nhau","b) Thoát hơi nước mạnh kích thích rễ hút nước","c) Hút nước không ảnh hưởng đến thoát hơi nước","d) Cân bằng hai quá trình giúp cây tươi tốt"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: hút đủ nước giúp tế bào trương, khí khổng mở → thoát hơi nước diễn ra.","level":"TH","points":1},{"type":"short","q":"Khi tế bào khí khổng mất nước, lỗ khí sẽ như thế nào?","answer":"Đóng lại","explain":"Tế bào khí khổng mất nước → mất độ trương, thành duỗi thẳng → lỗ khí khép (đóng) lại.","level":"VD","points":0.5},{"type":"short","q":"Chất nào được tế bào khí khổng tạo ra khi có ánh sáng, làm tăng độ trương của tế bào?","answer":"Đường","explain":"Có ánh sáng, lục lạp trong tế bào khí khổng quang hợp tạo đường, tăng nồng độ chất tan → nước đi vào → trương nước.","level":"VDC","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","q":"Thoát hơi nước là một phần của quá trình","options":["A. trao đổi nước của cây","B. quang hợp","C. hô hấp","D. thụ phấn"],"answer":"A","explain":"Thoát hơi nước cùng với hút nước ở rễ tạo nên quá trình trao đổi nước của cây.","level":"NB","points":0.25},{"type":"mcq","q":"Phần lớn lượng nước cây hút được dùng để","options":["A. thoát hơi nước qua lá","B. quang hợp","C. dự trữ trong thân","D. tạo gỗ"],"answer":"A","explain":"Khoảng 98% lượng nước cây hút được thoát ra qua lá, chỉ một phần rất nhỏ dùng cho quang hợp.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao ban đêm thoát hơi nước rất yếu?","options":["A. không có ánh sáng, khí khổng khép, nhiệt độ thấp","B. rễ ngừng hút nước","C. lá ngừng hoạt động","D. không khí luôn bão hoà hơi nước"],"answer":"A","explain":"Ban đêm: không có ánh sáng → khí khổng khép, nhiệt độ thấp → thoát hơi nước rất yếu.","level":"TH","points":0.25},{"type":"mcq","q":"Lớp cutin dày thường có ở cây nào?","options":["A. cây vùng khô hạn","B. cây thuỷ sinh","C. cây ưa bóng","D. cây rong"],"answer":"A","explain":"Cây khô hạn có cutin dày để hạn chế tối đa mất nước qua bề mặt lá.","level":"TH","points":0.25},{"type":"mcq","q":"Bón phân qua lá (phun lên lá) nên tiến hành lúc nào?","options":["A. sáng sớm hoặc chiều mát, khi khí khổng mở","B. giữa trưa nắng gắt","C. lúc trời mưa","D. nửa đêm"],"answer":"A","explain":"Sáng sớm/chiều mát: khí khổng mở, phân dễ thấm qua lá, tránh nắng gắt làm cháy lá.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao cây trồng trong chậu nhỏ nhanh héo hơn cây trồng ngoài đất?","options":["A. đất ít, dự trữ nước ít, bộ rễ bị hạn chế","B. chậu luôn nóng","C. thiếu phân bón","D. thiếu ánh sáng"],"answer":"A","explain":"Chậu nhỏ chứa ít đất → ít nước dự trữ, rễ phát triển hạn chế → cây nhanh mất cân bằng nước.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về khí khổng và cutin.","statements":["a) Khí khổng là con đường thoát hơi nước chính","b) Cutin hạn chế thoát hơi nước qua bề mặt","c) Cutin là nơi thoát hơi nước chủ yếu","d) Lá non có cutin mỏng nên thoát hơi nước mạnh hơn lá già"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: qua cutin chỉ là con đường phụ, rất ít.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về ứng dụng trong trồng trọt.","statements":["a) Che phủ đất giúp giảm bốc hơi nước","b) Tưới nhỏ giọt giúp tiết kiệm nước","c) Trồng cây chắn gió giúp giảm thoát hơi nước","d) Nên tưới đẫm nước vào giữa trưa nắng gắt"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: nên tưới sáng sớm hoặc chiều mát.","level":"TH","points":1},{"type":"short","q":"Tốc độ thoát hơi nước của lá phụ thuộc chủ yếu vào yếu tố nào của lá?","answer":"Diện tích","explain":"Lá càng rộng (diện tích lớn), khí khổng càng nhiều thì thoát hơi nước càng mạnh.","level":"VD","points":0.5},{"type":"short","q":"Lá cây rủ xuống khi thiếu nước là do tế bào mất cái gì?","answer":"Mất độ trương","explain":"Thiếu nước → tế bào mất độ trương (sức căng trương nước) → lá rủ xuống, cây héo.","level":"VDC","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","q":"Cơ quan thoát hơi nước chủ yếu của cây là","options":["A. lá","B. rễ","C. thân","D. hoa"],"answer":"A","explain":"Lá có diện tích lớn và nhiều khí khổng nên là cơ quan thoát hơi nước chủ yếu.","level":"NB","points":0.25},{"type":"mcq","q":"Thoát hơi nước giúp lá","options":["A. được làm mát","B. nóng lên","C. tăng nhiệt độ","D. giữ nguyên nhiệt độ"],"answer":"A","explain":"Thoát hơi nước lấy đi một lượng nhiệt lớn, giúp lá không bị đốt nóng.","level":"NB","points":0.25},{"type":"mcq","q":"Khi trời mưa, thoát hơi nước của cây","options":["A. giảm mạnh","B. tăng mạnh","C. không đổi","D. đảo ngược chiều"],"answer":"A","explain":"Trời mưa độ ẩm không khí rất cao → chênh lệch thế nước nhỏ → thoát hơi nước giảm mạnh.","level":"TH","points":0.25},{"type":"mcq","q":"Cây trồng trong phòng điều hoà thoát hơi nước","options":["A. mạnh do không khí khô","B. rất yếu","C. ngừng hẳn","D. như ngoài trời"],"answer":"A","explain":"Điều hoà làm không khí khô → chênh lệch thế nước lớn → thoát hơi nước mạnh, cần tưới thường xuyên.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao rau trồng trong nhà lưới ít bị héo?","options":["A. giảm nắng, giảm gió nên giảm thoát hơi nước","B. được bón nhiều phân","C. ít sâu bệnh","D. đất tốt hơn"],"answer":"A","explain":"Nhà lưới che bớt nắng, chắn gió → thoát hơi nước giảm → rau ít héo.","level":"VD","points":0.25},{"type":"mcq","q":"Lá cây thuỷ sinh như sen, súng có khí khổng ở mặt trên vì","options":["A. mặt dưới tiếp xúc với nước nên khí khổng phải ở mặt trên để trao đổi khí","B. để lá đẹp hơn","C. để tăng thoát hơi nước","D. hoàn toàn ngẫu nhiên"],"answer":"A","explain":"Lá nổi trên mặt nước: mặt dưới ngập nước không trao đổi khí được nên khí khổng nằm ở mặt trên.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về thời gian thoát hơi nước.","statements":["a) Thoát hơi nước mạnh nhất vào buổi trưa","b) Thoát hơi nước yếu vào ban đêm","c) Thoát hơi nước mạnh khi trời mưa","d) Cường độ thoát hơi nước phụ thuộc thời tiết"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: trời mưa ẩm cao, thoát hơi nước rất yếu.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về thích nghi giảm thoát hơi nước.","statements":["a) Lá kim giúp giảm thoát hơi nước","b) Rụng lá mùa khô giúp giảm mất nước","c) Lông lá dày giúp giảm thoát hơi nước","d) Cây sa mạc thoát hơi nước rất mạnh"],"answer":["T","T","T","F"],"explain":"a, b, c đúng là các thích nghi giảm thoát hơi nước. d sai: cây sa mạc thoát hơi nước rất yếu.","level":"TH","points":1},{"type":"short","q":"Khí khổng mở ra khi tế bào khí khổng ở trạng thái nào?","answer":"Trương nước","explain":"Tế bào khí khổng trương nước (nước đi vào) → thành mỏng cong ra → lỗ khí mở.","level":"VD","points":0.5},{"type":"short","q":"Ngoài tạo lực hút cho dòng mạch gỗ, thoát hơi nước còn tạo ra lực gì giúp khoáng di chuyển lên lá?","answer":"Lực hút","explain":"Lực hút do thoát hơi nước kéo cả dòng nước và muối khoáng hoà tan từ rễ lên lá.","level":"VDC","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Thoát hơi nước qua cutin chiếm","options":["A. một phần rất nhỏ","B. phần lớn","C. toàn bộ","D. một nửa"],"answer":"A","explain":"Qua cutin nước thấm rất ít; con đường chủ yếu là qua khí khổng.","level":"NB","points":0.25},{"type":"mcq","q":"Tế bào khí khổng có hình dạng","options":["A. hạt đậu","B. tròn","C. vuông","D. dài như sợi"],"answer":"A","explain":"Mỗi khí khổng gồm 2 tế bào khí khổng hình hạt đậu úp vào nhau tạo lỗ khí.","level":"NB","points":0.25},{"type":"mcq","q":"Thành tế bào khí khổng có đặc điểm","options":["A. thành trong dày, thành ngoài mỏng","B. dày đều nhau","C. không có thành tế bào","D. thấm cutin hoàn toàn"],"answer":"A","explain":"Thành trong (phía lỗ khí) dày, thành ngoài mỏng → khi trương nước thành ngoài cong ra nhiều hơn, lỗ khí mở.","level":"TH","points":0.25},{"type":"mcq","q":"Khi cây được tưới đủ nước vào ban ngày, khí khổng thường","options":["A. mở","B. đóng","C. rụng đi","D. teo lại"],"answer":"A","explain":"Đủ nước + có ánh sáng: tế bào khí khổng trương nước → lỗ khí mở để thoát hơi nước và lấy CO2.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao sau khi tưới nước, cây đang héo tạm thời tươi trở lại?","options":["A. rễ hút đủ nước bù lại lượng nước đã thoát","B. nước làm mát cây","C. phân trong nước tan ra","D. đất mềm ra"],"answer":"A","explain":"Được tưới: rễ hút nước bù đủ lượng đã thoát → tế bào trương trở lại → cây tươi.","level":"VD","points":0.25},{"type":"mcq","q":"Nếu bôi một lớp dầu kín lên mặt dưới lá, cây sẽ","options":["A. giảm thoát hơi nước nhưng cũng giảm CO2 vào nên quang hợp giảm","B. chết ngay lập tức","C. không bị ảnh hưởng gì","D. tăng thoát hơi nước"],"answer":"A","explain":"Dầu bít khí khổng: giảm mất nước nhưng CO2 không vào được → quang hợp giảm.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về con đường qua cutin.","statements":["a) Cutin là lớp sáp chống thấm trên bề mặt lá","b) Nước thấm qua cutin rất ít","c) Lá già có cutin dày hơn lá non","d) Qua cutin là con đường thoát hơi nước chính"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: con đường chính là qua khí khổng.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về vai trò làm mát của thoát hơi nước.","statements":["a) Thoát hơi nước lấy đi một lượng nhiệt","b) Giúp lá không bị nóng cháy dưới nắng","c) Cây không cần được làm mát","d) Lá héo mất khả năng làm mát hiệu quả"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: làm mát là vai trò quan trọng của thoát hơi nước.","level":"TH","points":1},{"type":"short","q":"Mỗi khí khổng gồm mấy tế bào khí khổng?","answer":"2","explain":"Lỗ khí được tạo bởi 2 tế bào khí khổng hình hạt đậu.","level":"VD","points":0.5},{"type":"short","q":"Hiện tượng khí khổng khép lại vào giữa trưa nắng gắt để giảm mất nước gọi là hiện tượng gì?","answer":"Ngủ trưa","explain":"Hiện tượng ngủ trưa: giữa trưa nắng gắt khí khổng khép, quang hợp giảm để giảm mất nước.","level":"VDC","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","q":"Nước trong lá thoát ra ngoài qua","options":["A. khí khổng và lớp cutin","B. lông hút","C. mạch gỗ","D. rễ"],"answer":"A","explain":"Hai con đường thoát hơi nước: chủ yếu qua khí khổng, một phần nhỏ qua cutin.","level":"NB","points":0.25},{"type":"mcq","q":"Khí khổng mở tạo điều kiện cho","options":["A. CO2 khuếch tán vào lá","B. O2 thoát ra ngoài là chính","C. nước đi vào rễ","D. phân tan trong đất"],"answer":"A","explain":"Khí khổng mở vừa thoát hơi nước vừa là cửa cho CO2 khuếch tán vào phục vụ quang hợp.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao cây mới trồng cần được che nắng?","options":["A. rễ chưa hồi phục, hút nước kém mà thoát hơi nước mạnh gây héo","B. cây con sợ ánh sáng","C. để chống mưa","D. để giữ ấm"],"answer":"A","explain":"Mới trồng rễ bị tổn thương hút nước kém; che nắng giảm thoát hơi nước, tránh héo.","level":"TH","points":0.25},{"type":"mcq","q":"Đất được phủ một lớp nilon thì","options":["A. giảm bốc hơi nước từ mặt đất","B. tăng thoát hơi nước ở lá","C. cây bị chết","D. đất nóng lên gây hại"],"answer":"A","explain":"Phủ nilon che mặt đất, giảm bốc hơi nước, giữ ẩm cho đất.","level":"TH","points":0.25},{"type":"mcq","q":"Trong thí nghiệm, cành có lá thoát hơi nước mạnh hơn cành không có lá vì","options":["A. lá là cơ quan thoát hơi nước chủ yếu","B. cành hút nước mạnh","C. lá nặng hơn","D. hoàn toàn ngẫu nhiên"],"answer":"A","explain":"Lá có diện tích lớn và nhiều khí khổng nên là cơ quan thoát hơi nước chủ yếu.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao cây ở vùng gió mạnh ven biển thường thấp, lá dày?","options":["A. thích nghi giảm thoát hơi nước do gió mạnh","B. thiếu chất dinh dưỡng","C. đất bị nhiễm mặn","D. bị sóng đánh gãy"],"answer":"A","explain":"Gió mạnh làm tăng thoát hơi nước; cây thấp, lá dày, cutin dày là thích nghi giảm mất nước.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về sự phân bố khí khổng.","statements":["a) Khí khổng nhiều ở mặt dưới lá cây trên cạn","b) Lá thuỷ sinh có khí khổng ở mặt trên","c) Rễ cây có nhiều khí khổng","d) Số lượng khí khổng ảnh hưởng đến cường độ thoát hơi nước"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: rễ không có khí khổng.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về biện pháp giảm thoát hơi nước.","statements":["a) Che nắng cho cây con mới trồng","b) Phủ gốc để giữ ẩm","c) Tỉa bớt lá khi đánh cây đi trồng xa","d) Tưới thật nhiều nước vào giữa trưa nắng"],"answer":["T","T","T","F"],"explain":"a, b, c đúng là biện pháp giảm thoát hơi nước. d sai: nên tưới sáng sớm hoặc chiều mát.","level":"TH","points":1},{"type":"short","q":"Cây héo nhưng khi được tưới nước thì tươi lại ngay gọi là héo gì?","answer":"Héo tạm thời","explain":"Héo tạm thời: mất cân bằng nước nhất thời, phục hồi được khi được tưới nước.","level":"VD","points":0.5},{"type":"short","q":"Đóng mở khí khổng nhờ thay đổi độ trương của tế bào thuộc kiểu vận động cảm ứng nào ở thực vật?","answer":"Ứng động","explain":"Đóng mở khí khổng là ứng động — vận động cảm ứng không định hướng theo tác nhân kích thích.","level":"VDC","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","q":"Thoát hơi nước thuộc loại quá trình nào của cây?","options":["A. sinh lí của cây","B. hoá học đơn thuần","C. vật lí thuần tuý","D. bệnh lí của cây"],"answer":"A","explain":"Thoát hơi nước là quá trình sinh lí, được cây điều tiết qua đóng mở khí khổng.","level":"NB","points":0.25},{"type":"mcq","q":"Trong lượng nước cây hút vào, phần lớn được","options":["A. thoát hơi qua lá","B. dùng cho quang hợp","C. dự trữ trong thân","D. thải qua rễ"],"answer":"A","explain":"Khoảng 98% lượng nước hút vào thoát ra qua lá, chỉ một phần rất nhỏ dùng cho quang hợp.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao lá non thoát hơi nước mạnh hơn lá già?","options":["A. cutin mỏng, khí khổng hoạt động mạnh","B. lá non to hơn lá già","C. lá non chứa nhiều nước hơn","D. lá non gần rễ hơn"],"answer":"A","explain":"Lá non cutin mỏng, khí khổng hoạt động mạnh → thoát hơi nước mạnh hơn lá già.","level":"TH","points":0.25},{"type":"mcq","q":"Sương mù dày đặc làm","options":["A. giảm thoát hơi nước","B. tăng thoát hơi nước","C. không ảnh hưởng","D. làm lá hút nước"],"answer":"A","explain":"Sương mù: độ ẩm không khí rất cao → chênh lệch thế nước nhỏ → thoát hơi nước giảm.","level":"TH","points":0.25},{"type":"mcq","q":"Trồng nhiều cây xanh quanh nhà giúp","options":["A. làm mát nhờ thoát hơi nước và bóng râm","B. tăng nhiệt độ","C. hút hết nước trong đất","D. gây ẩm mốc"],"answer":"A","explain":"Cây xanh thoát hơi nước làm mát không khí, tán lá che nắng — giúp nhà mát mẻ.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao vào những ngày hanh khô, người ta hay phun sương cho hoa lan?","options":["A. tăng độ ẩm, giảm thoát hơi nước, tránh héo","B. để rửa sạch lá","C. để bón phân","D. để diệt nấm"],"answer":"A","explain":"Phun sương tăng độ ẩm không khí → giảm thoát hơi nước → lan không bị héo ngày hanh khô.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét tổng quát về thoát hơi nước.","statements":["a) Là quá trình sinh lí quan trọng của cây","b) Gắn liền với hút nước ở rễ","c) Chỉ gây hại cho cây, không có lợi","d) Cây điều tiết được qua đóng mở khí khổng"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: thoát hơi nước có nhiều vai trò quan trọng (lực hút, làm mát, lấy CO2).","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về cân bằng nước ở cây.","statements":["a) Hút đủ bù thoát thì cây tươi tốt","b) Thoát quá mạnh gây héo cây","c) Con người giúp cân bằng bằng tưới tiêu hợp lí","d) Cây không cần cân bằng nước"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cân bằng nước là điều kiện để cây sinh trưởng tốt.","level":"TH","points":1},{"type":"short","q":"Viết tên quá trình nước từ lá thoát ra không khí ở dạng hơi.","answer":"Thoát hơi nước","explain":"Quá trình nước từ lá thoát ra không khí ở dạng hơi gọi là thoát hơi nước.","level":"VD","points":0.5},{"type":"short","q":"Qua khí khổng, lá trao đổi những khí nào với môi trường?","answer":"CO2 và O2","explain":"Khí khổng là nơi trao đổi khí: CO2 đi vào cho quang hợp; O2 và hơi nước đi ra.","level":"VDC","points":0.5}]}]}
