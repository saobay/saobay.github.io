{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","q":"Hô hấp ở động vật gồm hai quá trình là","options":["A. trao đổi khí và hô hấp tế bào","B. chỉ lấy O2","C. chỉ thải CO2","D. chỉ hô hấp tế bào"],"answer":"A","explain":"Hô hấp ở động vật: trao đổi khí (lấy O2, thải CO2) và hô hấp tế bào (tạo ATP).","level":"NB","points":0.25},{"type":"mcq","q":"Trao đổi khí ở động vật diễn ra theo cơ chế","options":["A. khuếch tán","B. thẩm thấu","C. ẩm bào","D. vận chuyển chủ động"],"answer":"A","explain":"O2 khuếch tán từ nơi nồng độ cao đến nơi nồng độ thấp; CO2 đi chiều ngược lại.","level":"NB","points":0.25},{"type":"mcq","q":"Giun đất hô hấp bằng","options":["A. bề mặt cơ thể (da ẩm)","B. mang","C. phổi","D. ống khí"],"answer":"A","explain":"Giun đất trao đổi khí qua da ẩm, mỏng, nhiều mao mạch.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao da giun đất phải luôn ẩm ướt?","options":["A. O2 hoà tan trong lớp ẩm mới khuếch tán qua da được","B. giun thích nước","C. để chống nắng","D. để trơn dễ chui"],"answer":"A","explain":"Khí phải hoà tan trong lớp ẩm trên da mới khuếch tán vào mao mạch được.","level":"TH","points":0.25},{"type":"mcq","q":"Khi ao thiếu O2, cá ngoi lên mặt nước đớp khí vì","options":["A. mang không lấy đủ O2 từ nước","B. cá bị đói","C. cá đùa nghịch","D. nước quá nóng"],"answer":"A","explain":"Thiếu O2: mang không đáp ứng đủ, cá phải ngoi lên đớp không khí hỗ trợ.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao cá đưa lên cạn nhanh bị chết?","options":["A. mang xẹp dính vào nhau, diện tích trao đổi khí giảm mạnh","B. cá sợ không khí","C. thiếu thức ăn","D. bị lạnh"],"answer":"A","explain":"Trên cạn phiến mang xẹp dính, không có dòng nước chảy qua → không lấy được O2.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hình thức hô hấp.","statements":["a) Giun đất hô hấp qua da","b) Cá hô hấp bằng mang","c) Người hô hấp bằng phổi","d) Côn trùng hô hấp bằng phổi"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: côn trùng hô hấp bằng hệ ống khí.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về bề mặt trao đổi khí.","statements":["a) Bề mặt mỏng","b) Luôn ẩm ướt","c) Diện tích lớn","d) Ít mao mạch máu"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: bề mặt trao đổi khí có mạng mao mạch dày đặc.","level":"TH","points":1},{"type":"short","q":"Cơ quan hô hấp của cá là gì?","answer":"Mang","explain":"Cá trao đổi khí bằng mang: phiến mang mỏng, nhiều mao mạch.","level":"VD","points":0.5},{"type":"short","q":"Côn trùng hô hấp bằng cơ quan nào?","answer":"Ống khí","explain":"Côn trùng có hệ ống khí đưa O2 trực tiếp đến từng tế bào.","level":"VDC","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","q":"Phế nang có đặc điểm","options":["A. thành rất mỏng, bao quanh bởi mao mạch dày đặc","B. thành dày","C. khô ráo","D. ít mao mạch"],"answer":"A","explain":"Phế nang thành mỏng, mao mạch dày đặc — thuận lợi cho khuếch tán khí.","level":"NB","points":0.25},{"type":"mcq","q":"Đường dẫn khí ở người theo đúng thứ tự là","options":["A. mũi, họng, thanh quản, khí quản, phế quản, phổi","B. phổi, phế quản, khí quản, mũi","C. miệng, dạ dày, phổi","D. thứ tự ngẫu nhiên"],"answer":"A","explain":"Không khí: mũi → họng → thanh quản → khí quản → phế quản → phổi.","level":"NB","points":0.25},{"type":"mcq","q":"Khi hít vào","options":["A. cơ hoành hạ xuống, lồng ngực nở ra","B. cơ hoành nâng lên","C. lồng ngực xẹp xuống","D. phổi xẹp lại"],"answer":"A","explain":"Hít vào: cơ hoành hạ, cơ liên sườn co → lồng ngực nở, phổi giãn, khí vào.","level":"TH","points":0.25},{"type":"mcq","q":"Khi thở ra","options":["A. cơ hoành nâng lên, lồng ngực thu lại","B. cơ hoành hạ xuống","C. lồng ngực nở ra","D. hít thêm O2"],"answer":"A","explain":"Thở ra: cơ hoành nâng, cơ liên sườn dãn → lồng ngực thu, phổi xẹp, khí ra.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao khi chạy nhanh, nhịp thở tăng lên?","options":["A. cơ cần nhiều O2 và thải nhiều CO2","B. vì mệt","C. vì nóng","D. vì khát nước"],"answer":"A","explain":"Vận động mạnh: cơ hô hấp tế bào mạnh, cần nhiều O2, thải nhiều CO2 → thở nhanh, sâu.","level":"VD","points":0.25},{"type":"mcq","q":"Người bị hen suyễn khó thở vì","options":["A. đường dẫn khí bị co hẹp, sưng viêm","B. phổi quá nhỏ","C. thiếu máu","D. tim yếu"],"answer":"A","explain":"Hen: phế quản co thắt, sưng viêm → khí khó lưu thông → khó thở.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về đường dẫn khí.","statements":["a) Mũi lọc, làm ấm và làm ẩm không khí","b) Khí quản có vòng sụn","c) Phế quản dẫn khí vào phổi","d) Thực quản dẫn khí vào phổi"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: thực quản dẫn thức ăn xuống dạ dày.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về cơ chế hô hấp.","statements":["a) Hít vào: lồng ngực nở ra","b) Thở ra: lồng ngực thu lại","c) Nhờ hoạt động của cơ hoành và cơ liên sườn","d) Phổi tự co bóp để thở"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: phổi không có cơ, phồng xẹp thụ động theo lồng ngực.","level":"TH","points":1},{"type":"short","q":"Đơn vị cấu tạo của phổi, nơi diễn ra trao đổi khí là gì?","answer":"Phế nang","explain":"Phế nang: túi khí nhỏ, thành mỏng, là nơi trao đổi O2 và CO2.","level":"VD","points":0.5},{"type":"short","q":"Thể tích khí lưu thông trong một lần hít vào và thở ra bình thường gọi là gì?","answer":"Khí lưu thông","explain":"Khí lưu thông: lượng khí hít vào, thở ra trong một nhịp thở bình thường.","level":"VDC","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","q":"O2 từ phế nang đi vào máu theo cơ chế","options":["A. khuếch tán từ nơi nồng độ cao đến nơi nồng độ thấp","B. thẩm thấu","C. vận chuyển chủ động","D. ẩm bào"],"answer":"A","explain":"O2 trong phế nang cao hơn trong máu → khuếch tán vào máu.","level":"NB","points":0.25},{"type":"mcq","q":"CO2 từ tế bào đi vào máu theo cơ chế","options":["A. khuếch tán","B. thẩm thấu","C. vận chuyển chủ động","D. xuất bào"],"answer":"A","explain":"CO2 trong tế bào cao hơn trong máu → khuếch tán vào máu.","level":"NB","points":0.25},{"type":"mcq","q":"Máu giàu O2 có màu","options":["A. đỏ tươi","B. đỏ thẫm","C. vàng","D. trắng"],"answer":"A","explain":"Máu động mạch giàu O2 có màu đỏ tươi.","level":"TH","points":0.25},{"type":"mcq","q":"Máu giàu CO2 có màu","options":["A. đỏ thẫm","B. đỏ tươi","C. xanh","D. tím"],"answer":"A","explain":"Máu tĩnh mạch giàu CO2 có màu đỏ thẫm.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao người leo núi cao dễ bị khó thở?","options":["A. không khí loãng, O2 ít","B. trời lạnh","C. leo mệt","D. sợ độ cao"],"answer":"A","explain":"Càng lên cao không khí càng loãng, O2 ít → khó thở, cần thích nghi dần.","level":"VD","points":0.25},{"type":"mcq","q":"Trẻ sơ sinh khóc to ngay khi chào đời giúp","options":["A. phổi nở ra, bắt đầu hô hấp","B. cho vui","C. gọi mẹ","D. tập nói"],"answer":"A","explain":"Khóc to: hít mạnh làm phổi nở, bắt đầu hô hấp độc lập.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về trao đổi khí ở phổi.","statements":["a) O2 từ phế nang khuếch tán vào máu","b) CO2 từ máu khuếch tán ra phế nang","c) Diễn ra theo cơ chế khuếch tán","d) O2 từ máu khuếch tán ra phế nang"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: O2 đi từ phế nang vào máu.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về trao đổi khí ở tế bào.","statements":["a) O2 từ máu vào tế bào","b) CO2 từ tế bào vào máu","c) Diễn ra theo cơ chế khuếch tán","d) Tế bào thải O2 ra ngoài"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: tế bào lấy O2, thải CO2.","level":"TH","points":1},{"type":"short","q":"Máu vận chuyển khí nào từ phổi đến tế bào?","answer":"Oxygen","explain":"Máu (hồng cầu) vận chuyển O2 từ phổi đến tế bào.","level":"VD","points":0.5},{"type":"short","q":"Chất nào trong hồng cầu giúp vận chuyển O2?","answer":"Hemoglobin","explain":"Hemoglobin trong hồng cầu kết hợp và vận chuyển O2.","level":"VDC","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","q":"Côn trùng hô hấp bằng","options":["A. hệ ống khí","B. phổi","C. mang","D. da"],"answer":"A","explain":"Côn trùng: hệ ống khí phân nhánh đưa O2 trực tiếp đến tế bào.","level":"NB","points":0.25},{"type":"mcq","q":"Ếch trưởng thành hô hấp bằng","options":["A. da và phổi","B. mang","C. ống khí","D. vây"],"answer":"A","explain":"Ếch: phổi đơn giản + da ẩm hỗ trợ trao đổi khí.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao phổi có diện tích trao đổi khí rất lớn?","options":["A. có hàng triệu phế nang","B. phổi rất to","C. chứa nhiều máu","D. thở rất nhanh"],"answer":"A","explain":"Hàng triệu phế nang tạo diện tích trao đổi khí lên tới hàng trăm m2.","level":"TH","points":0.25},{"type":"mcq","q":"Lông mũi có vai trò","options":["A. lọc bụi trong không khí","B. làm đẹp","C. ngửi mùi","D. thở"],"answer":"A","explain":"Lông mũi cùng chất nhầy giữ bụi, làm sạch không khí đi vào.","level":"TH","points":0.25},{"type":"mcq","q":"Đeo khẩu trang khi ra đường giúp","options":["A. lọc bụi, bảo vệ đường hô hấp","B. làm đẹp","C. giữ ấm","D. chống nắng"],"answer":"A","explain":"Khẩu trang lọc bụi mịn, bảo vệ đường hô hấp khỏi ô nhiễm.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao hút thuốc lá làm tăng nguy cơ ung thư phổi?","options":["A. chất độc trong khói thuốc phá huỷ tế bào phổi","B. khói làm nóng phổi","C. thiếu O2","D. ho nhiều"],"answer":"A","explain":"Khói thuốc chứa nhiều chất gây ung thư phá huỷ tế bào phổi, phế nang.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hô hấp ở các động vật.","statements":["a) Cá hô hấp bằng mang","b) Chim hô hấp bằng phổi","c) Giun đất hô hấp qua da","d) Ếch trưởng thành hô hấp bằng mang"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: ếch trưởng thành hô hấp bằng phổi và da.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về bảo vệ hệ hô hấp.","stateme ợ.","level":"NB","points":0.25},{"type":"mcq","q":"Phổi chim có thêm","options":["A. hệ túi khí","B. phế nang như người","C. mang","D. vây"],"answer":"A","explain":"Túi khí giúp chim trao đổi khí hiệu quả cả khi hít vào và thở ra.","level":"NB","points":0.25},{"type":"mcq","q":"Túi khí ở chim có vai trò","options":["A. tăng hiệu quả trao đổi khí, giảm khối lượng cơ thể","B. giúp bay","C. để kêu","D. giữ ấm"],"answer":"A","explain":"Túi khí: dự trữ khí, tăng trao đổi khí; chứa khí làm nhẹ cơ thể.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao chim bay cần hô hấp rất hiệu quả?","options":["A. bay tốn rất nhiều năng lượng","B. chim to","C. trời lạnh","D. chim sợ"],"answer":"A","explain":"Bay cần năng lượng lớn → cần nhiều O2 cho hô hấp tế bào.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao khi nín thở lâu, cơ thể thúc giục phải thở?","options":["A. CO2 tích tụ kích thích trung khu hô hấp","B. thiếu O2","C. mệt","D. chóng mặt"],"answer":"A","explain":"CO2 trong máu tăng kích thích trung khu hô hấp ở hành não, buộc phải thở.","level":"VD","points":0.25},{"type":"mcq","q":"Người bị đuối nước cần được hô hấp nhân tạo vì","options":["A. phổi ngập nước không trao đổi khí được","B. bị lạnh","C. bị sợ","D. bị mệt"],"answer":"A","explain":"Phổi ngập nước: O2 không khuếch tán được → ngạt; cần thổi ngạt, ép tim.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về hô hấp ở chim.","statements":["a) Hô hấp bằng phổi","b) Có hệ túi khí","c) Trao đổi khí hiệu quả cao","d) Hô hấp bằng mang"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: chim hô hấp bằng phổi.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về điều hoà hô hấp.","statements":["a) CO2 tăng kích thích thở nhanh, sâu","b) Vận động làm nhịp thở tăng","c) Nhịp thở không đổi trong mọi lúc","d) Trung khu hô hấp nằm ở hành não"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: nhịp thở thay đổi theo nhu cầu cơ thể.","level":"TH","points":1},{"type":"short","q":"Trung khu điều khiển nhịp thở nằm ở đâu?","answer":"Hành não","explain":"Trung khu hô hấp ở hành não điều khiển nhịp thở tự động.","level":"VD","points":0.5},{"type":"short","q":"Khí nào tăng trong máu sẽ kích thích thở nhanh và sâu?","answer":"Carbon dioxide","explain":"CO2 tăng trong máu kích thích trung khu hô hấp làm thở nhanh, sâu.","level":"VDC","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Hô hấp ở động vật là quá trình lấy","options":["A. O2 và thải CO2","B. CO2 và thải O2","C. nitơ","D. hydrogen"],"answer":"A","explain":"Động vật lấy O2 cho hô hấp tế bào, thải CO2 ra ngoài.","level":"NB","points":0.25},{"type":"mcq","q":"Bề mặt trao đổi khí hiệu quả cần","options":["A. mỏng, ẩm, diện tích lớn, nhiều mao mạch","B. dày và khô","C. diện tích nhỏ","D. ít mạch máu"],"answer":"A","explain":"Mỏng, ẩm, rộng, nhiều mao mạch giúp khuếch tán khí nhanh.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao phế nang có thành rất mỏng?","options":["A. để O2, CO2 dễ khuếch tán qua","B. để tiết kiệm vật liệu","C. để nhẹ","D. để đẹp"],"answer":"A","explain":"Thành mỏng (một lớp tế bào) giúp khí khuếch tán nhanh qua.","level":"TH","points":0.25},{"type":"mcq","q":"Mạng mao mạch dày đặc quanh phế nang có vai trò","options":["A. vận chuyển O2 đi và CO2 đến","B. nuôi phổi","C. làm ấm phổi","D. lọc khí"],"answer":"A","explain":"Mao mạch nhận O2 từ phế nang đưa đi, mang CO2 đến thải ra.","level":"TH","points":0.25},{"type":"mcq","q":"Hít thở sâu nơi nhiều cây xanh tốt cho sức khoẻ vì","options":["A. không khí giàu O2, ít bụi","B. không khí mát","C. có mùi thơm","D. yên tĩnh"],"answer":"A","explain":"Nơi nhiều cây: O2 dồi dào, ít bụi — tốt cho đường hô hấp.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao bệnh nhân khó thở được cho thở khí O2?","options":["A. tăng lượng O2 vào máu","B. cho mát","C. diệt khuẩn","D. an thần"],"answer":"A","explain":"Thở O2 tăng nồng độ O2 ở phế nang → tăng khuếch tán O2 vào máu.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về phế nang.","statements":["a) Là những túi khí nhỏ","b) Thành rất mỏng","c) Xung quanh có mao mạch dày đặc","d) Là nơi tiêu hoá thức ăn"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: phế nang là nơi trao đổi khí.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về vận chuyển khí trong máu.","statements":["a) O2 do hồng cầu vận chuyển","b) CO2 vận chuyển trong huyết tương và hồng cầu","c) Một phần khí hoà tan trong huyết tương","d) Khí tự đi không cần máu"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: khí được máu vận chuyển.","level":"TH","points":1},{"type":"short","q":"Tế bào máu nào làm nhiệm vụ vận chuyển O2?","answer":"Hồng cầu","explain":"Hồng cầu chứa hemoglobin vận chuyển O2 từ phổi đến tế bào.","level":"VD","points":0.5},{"type":"short","q":"Ngoài kết hợp với hemoglobin, O2 còn được vận chuyển dưới dạng nào?","answer":"Hoà tan","explain":"Một phần nhỏ O2 hoà tan trong huyết tương.","level":"VDC","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","q":"Thanh quản chứa","options":["A. dây thanh âm tạo tiếng nói","B. phế nang","C. mật","D. enzyme"],"answer":"A","explain":"Thanh quản có dây thanh âm rung tạo tiếng nói.","level":"NB","points":0.25},{"type":"mcq","q":"Khí quản phân thành","options":["A. hai phế quản vào hai phổi","B. phế nang","C. hai lá phổi","D. họng"],"answer":"A","explain":"Khí quản phân thành 2 phế quản đi vào 2 phổi.","level":"NB","points":0.25},{"type":"mcq","q":"Vì sao khi nuốt, thức ăn không lọt vào khí quản?","options":["A. nắp thanh quản đậy đường thở lại","B. khí quản quá hẹp","C. thực quản quá to","D. do may mắn"],"answer":"A","explain":"Khi nuốt, nắp thanh quản đậy lại, thức ăn chỉ đi vào thực quản.","level":"TH","points":0.25},{"type":"mcq","q":"Sặc thức ăn vào đường thở gây ra","options":["A. ho sặc sụa, khó thở","B. cảm giác ngon","C. no nhanh","D. không có gì"],"answer":"A","explain":"Dị vật vào đường thở gây ho sặc, khó thở, nguy hiểm.","level":"TH","points":0.25},{"type":"mcq","q":"Trẻ em bị hóc dị vật đường thở cần","options":["A. sơ cứu đẩy dị vật ra ngay","B. chờ tự khỏi","C. cho ăn tiếp","D. cho uống sữa"],"answer":"A","explain":"Hóc dị vật gây ngạt — phải sơ cứu kịp thời (vỗ lưng, ép bụng).","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao người bị viêm phổi thường khó thở?","options":["A. phế nang bị viêm, giảm trao đổi khí","B. phổi quá to","C. ho nhiều","D. bị sốt"],"answer":"A","explain":"Viêm phổi: phế nang chứa dịch viêm, thành dày lên → giảm trao đổi khí.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét các phát biểu về các bộ phận của đường thở.","statements":["a) Mũi lọc sạch không khí","b) Thanh quản có dây thanh âm","c) Khí quản có vòng sụn","d) Dạ dày dẫn khí vào phổi"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: dạ dày thuộc hệ tiêu hoá.","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về nắp thanh quản.","statements":["a) Đậy đường thở khi nuốt","b) Ngăn thức ăn vào khí quản","c) Luôn đóng kín","d) Mở ra khi thở"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: nắp mở khi thở, chỉ đậy khi nuốt.","level":"TH","points":1},{"type":"short","q":"Bộ phận nào đậy đường thở lại khi nuốt thức ăn?","answer":"Nắp thanh quản","explain":"Nắp thanh quản đậy khí quản khi nuốt, ngăn sặc.","level":"VD","points":0.5},{"type":"short","q":"Âm thanh tiếng nói được tạo ra ở đâu?","answer":"Thanh quản","explain":"Luồng khí qua dây thanh âm ở thanh quản rung tạo tiếng nói.","level":"VDC","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","q":"Hô hấp ở động vật gồm","options":["A. trao đổi khí và hô hấp tế bào","B. chỉ hít vào","C. chỉ thở ra","D. chỉ trao đổi khí"],"answer":"A","explain":"Hô hấp ở động vật gồm trao đổi khí với môi trường và hô hấp tế bào tạo ATP.","level":"NB","points":0.25},{"type":"mcq","q":"Hô hấp tế bào ở động vật diễn ra ở","options":["A. ti thể","B. phổi","C. mang","D. da"],"answer":"A","explain":"Hô hấp tế bào diễn ra ở ti thể, tạo ATP.","level":"NB","points":0.25},{"type":"mcq","q":"Trao đổi khí và hô hấp tế bào có liên quan vì","options":["A. trao đổi khí cung cấp O2 cho hô hấp tế bào","B. hai quá trình độc lập","C. hai quá trình đối kháng","D. không liên quan"],"answer":"A","explain":"Trao đổi khí lấy O2 cung cấp cho hô hấp tế bào, mang CO2 thải ra.","level":"TH","points":0.25},{"type":"mcq","q":"Vì sao động vật càng lớn thì cơ quan hô hấp càng phức tạp?","options":["A. nhu cầu O2 lớn, bề mặt cơ thể không đáp ứng đủ","B. vì thích thế","C. để cho đẹp","D. hoàn toàn ngẫu nhiên"],"answer":"A","explain":"Cơ thể lớn: tỉ lệ diện tích/thể tích nhỏ, cần cơ quan chuyên hoá (mang, phổi) diện tích lớn.","level":"TH","points":0.25},{"type":"mcq","q":"Tập thể dục đều đặn tốt cho hệ hô hấp vì","options":["A. tăng dung tích phổi, cơ hô hấp khoẻ","B. giảm cân","C. tăng chiều cao","D. vui vẻ"],"answer":"A","explain":"Tập luyện: dung tích sống tăng, cơ hoành, liên sườn khoẻ, trao đổi khí hiệu quả.","level":"VD","points":0.25},{"type":"mcq","q":"Vì sao khi lên núi cao một thời gian, cơ thể tăng sản xuất hồng cầu?","options":["A. để bù đắp thiếu O2","B. vì trời lạnh","C. vì mệt","D. vì ăn nhiều"],"answer":"A","explain":"Không khí loãng thiếu O2 → cơ thể tăng hồng cầu để vận chuyển đủ O2.","level":"VDC","points":0.25},{"type":"truefalse","q":"Nhận xét tổng quát về hô hấp ở động vật.","statements":["a) Lấy O2, thải CO2","b) Trao đổi khí theo khuếch tán","c) Tạo ATP ở tế bào","d) Lấy CO2, thải O2"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: động vật lấy O2, thải CO2 (ngược với quang hợp).","level":"NB","points":1},{"type":"truefalse","q":"Nhận xét các phát biểu về tiến hoá cơ quan hô hấp.","statements":["a) Từ đơn giản đến phức tạp","b) Phù hợp với môi trường sống","c) Cá lên cạn vẫn dùng mang tốt","d) Phổi hiệu quả trong môi trường trên cạn"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: mang chỉ hiệu quả trong nước.","level":"TH","points":1},{"type":"short","q":"Kể tên hai quá trình của hô hấp ở động vật.","answer":"Trao đổi khí và hô hấp tế bào","explain":"Hô hấp ở động vật: trao đổi khí với môi trường + hô hấp tế bào tạo ATP.","level":"VD","points":0.5},{"type":"short","q":"Động vật nào vừa hô hấp bằng da vừa hô hấp bằng phổi?","answer":"Ếch","explain":"Ếch trưởng thành hô hấp bằng phổi đơn giản và qua da ẩm.","level":"VDC","points":0.5}]}]}
