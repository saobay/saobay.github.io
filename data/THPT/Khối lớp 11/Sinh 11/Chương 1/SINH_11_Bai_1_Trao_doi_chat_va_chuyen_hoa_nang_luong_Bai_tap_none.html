i chất gồm hai quá trình đồng hoá và dị hoá", "d) Cơ thể ngừng trao đổi chất vẫn sống bình thường"], "answer": ["T", "F", "T", "F"], "explain": "a đúng theo định nghĩa; b sai vì mọi sinh vật đều trao đổi chất; c đúng; d sai vì ngừng trao đổi chất thì chết.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Nhận xét các phát biểu về sử dụng ATP.", "statements": ["a) Phản ứng tạo ATP từ ADP cần được cung cấp năng lượng", "b) Mọi hoạt động sống đều dùng trực tiếp năng lượng ánh sáng", "c) Co cơ sử dụng năng lượng từ ATP", "d) Tế bào dự trữ ATP với số lượng lớn trong thời gian dài"], "answer": ["T", "F", "T", "F"], "explain": "a, c đúng; b sai vì hoạt động sống dùng ATP; d sai vì ATP kém bền, tái tạo liên tục.", "points": 1}, {"type": "short", "level": "NB", "q": "Quá trình tổng hợp chất phức tạp từ chất đơn giản, cần năng lượng gọi là gì", "answer": "Đồng hoá", "explain": "Quang hợp và tổng hợp protein là các quá trình đồng hoá.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hô hấp tế bào thuộc quá trình đồng hoá hay dị hoá", "answer": "Dị hoá", "explain": "Hô hấp phân giải chất phức tạp, giải phóng năng lượng nên là dị hoá.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "VD", "q": "Vì sao khi nín thở lâu em cảm thấy mệt mỏi, chóng mặt", "options": ["A. vì thiếu oxygen cho hô hấp tế bào tạo ATP cung cấp cho hoạt động", "B. vì phổi bị xẹp hoàn toàn", "C. vì tim ngừng đập", "D. vì máu đông lại"], "answer": "A", "explain": "Thiếu oxygen làm hô hấp giảm, thiếu ATP nên cơ thể mệt mỏi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Bệnh tiểu đường liên quan đến rối loạn", "options": ["A. chuyển hoá glucose trong cơ thể", "B. quang hợp ở tế bào người", "C. hô hấp ở phổi", "D. hấp thụ nước ở ruột"], "answer": "A", "explain": "Tiểu đường là rối loạn chuyển hoá glucose trong cơ thể.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đồng hoá là quá trình", "options": ["A. tổng hợp chất phức tạp từ chất đơn giản, cần năng lượng", "B. phân giải chất phức tạp thành chất đơn giản", "C. giải phóng năng lượng tích vào ATP", "D. thải chất cặn bã ra môi trường"], "answer": "A", "explain": "Đồng hoá tổng hợp chất phức tạp từ chất đơn giản và cần được cung cấp năng lượng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi em chạy nhanh, năng lượng hoá học trong glucose chuyển thành", "options": ["A. cơ năng giúp vận động và một phần thành nhiệt năng", "B. hoàn toàn thành năng lượng ánh sáng", "C. hoàn toàn thành ATP dự trữ", "D. năng lượng hoá học trong mỡ"], "answer": "A", "explain": "Năng lượng hoá học chuyển thành cơ năng, một phần thất thoát thành nhiệt năng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mối quan hệ giữa quang hợp và hô hấp ở thực vật thể hiện ở", "options": ["A. quang hợp tạo chất hữu cơ và oxygen cho hô hấp, hô hấp tạo carbon dioxide, nước và ATP cho quang hợp", "B. hai quá trình triệt tiêu lẫn nhau", "C. quang hợp ngăn cản hô hấp", "D. hô hấp thay thế hoàn toàn quang hợp"], "answer": "A", "explain": "Hai quá trình cung cấp nguyên liệu cho nhau, bổ sung nhau ở thực vật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nếu trên Trái Đất không còn cây xanh, điều gì sẽ xảy ra", "options": ["A. oxygen cạn dần, carbon dioxide tăng, sinh vật dị dưỡng thiếu thức ăn", "B. không có gì thay đổi", "C. động vật sẽ tự quang hợp", "D. khí quyển chỉ còn nitrogen"], "answer": "A", "explain": "Mất cây xanh thì mất nguồn oxygen, thức ăn và khả năng hấp thụ CO₂.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "So sánh quang hợp và hô hấp tế bào:", "statements": ["a) Hai quá trình có nguyên liệu và sản phẩm ngược nhau", "b) Quang hợp cần ánh sáng, hô hấp diễn ra cả ngày lẫn đêm", "c) Quang hợp chỉ tạo chất hữu cơ, không liên quan đến năng lượng", "d) Ở thực vật, hai quá trình bổ sung cho nhau"], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai vì quang hợp chuyển hoá năng lượng ánh sáng thành hoá năng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Thí nghiệm đặt cây xanh cùng nến đang cháy trong chuông kín. Nhận xét:", "statements": ["a) Nến cháy lâu hơn nhờ oxygen do cây quang hợp thải ra", "b) Chuột sống lâu hơn trong chuông có cây vì được cung cấp oxygen", "c) Thí nghiệm chứng tỏ quang hợp thải ra oxygen", "d) Thí nghiệm chứng tỏ cây xanh chỉ hô hấp"], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng; d sai vì thí nghiệm chứng tỏ cây quang hợp thải O₂.", "points": 1}, {"type": "short", "level": "VD", "q": "Vì sao không nên để nhiều cây trong phòng ngủ đóng kín ban đêm", "answer": "Cây thải CO₂", "explain": "Ban đêm cây chỉ hô hấp thải khí carbon dioxide, cạnh tranh oxygen.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vận động viên marathon nạp nhiều carbohydrate trước thi đấu để dự trữ chất nào trong cơ", "answer": "Glycogen", "explain": "Glycogen dự trữ được dị hoá dần tạo ATP cho vận động dài.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Quang hợp là quá trình", "options": ["A. chuyển hoá năng lượng ánh sáng thành năng lượng hoá học trong chất hữu cơ", "B. phân giải chất hữu cơ để giải phóng năng lượng", "C. tổng hợp ATP từ ADP không cần năng lượng", "D. thải khí carbon dioxide ra môi trường"], "answer": "A", "explain": "Quang hợp dùng năng lượng ánh sáng tổng hợp chất hữu cơ từ chất vô cơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao khi vận động mạnh, nhịp thở của em nhanh và sâu hơn", "options": ["A. vì cơ thể cần nhiều oxygen cho hô hấp tạo ATP", "B. vì cơ thể cần thải hết oxygen ra ngoài", "C. vì tim đập nhanh đẩy máu lên phổi gây khó thở", "D. vì cơ thể cần lấy thêm khí nitrogen"], "answer": "A", "explain": "Vận động mạnh cần nhiều ATP nên hô hấp tăng cường, cần nhiều oxygen hơn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dòng chuyển hoá năng lượng trong cơ thể sinh vật diễn ra theo trật tự", "options": ["A. năng lượng ánh sáng thành hoá năng rồi thành ATP và các dạng năng lượng khác", "B. nhiệt năng thành quang năng rồi thành hoá năng", "C. cơ năng thành hoá năng rồi thành quang năng", "D. điện năng thành nhiệt năng rồi thành hoá năng"], "answer": "A", "explain": "Ánh sáng thành hoá năng trong chất hữu cơ, rồi thành ATP và các dạng khác.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trồng cây trong nhà kính vào mùa đông có thắp đèn chiếu sáng ban đêm nhằm", "options": ["A. kéo dài thời gian quang hợp giúp cây tăng trưởng", "B. sưởi ấm cho cây ngủ", "C. xua đuổi côn trùng", "D. làm cây ra hoa ngay lập tức"], "answer": "A", "explain": "Thắp đèn kéo dài thời gian quang hợp, giúp cây tăng trưởng mùa đông.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi ATP bị phân giải thành ADP và nhóm phosphate vô cơ, năng lượng sẽ", "options": ["A. được giải phóng để cung cấp cho hoạt động sống", "B. được tích trữ thêm vào ADP", "C. biến mất hoàn toàn", "D. chuyển thành năng lượng ánh sáng"], "answer": "A", "explain": "Phân giải liên kết phosphate giàu năng lượng sẽ giải phóng năng lượng cho hoạt động sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bào quan thực hiện quang hợp ở tế bào thực vật và bào quan thực hiện hô hấp tế bào lần lượt là", "options": ["A. lục lạp và ti thể", "B. ti thể và lục lạp", "C. nhân và ribosome", "D. lục lạp và không bào"], "answer": "A", "explain": "Quang hợp diễn ra ở lục lạp, hô hấp tế bào chủ yếu ở ti thể.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Nhận xét các phát biểu về đồng hoá.", "statements": ["a) Đồng hoá là quá trình tổng hợp chất phức tạp từ chất đơn giản", "b) Đồng hoá cần được cung cấp năng lượng", "c) Quang hợp là một quá trình đồng hoá", "d) Hô hấp tế bào là một quá trình đồng hoá"], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng; d sai vì hô hấp tế bào là dị hoá.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Nhận xét các phát biểu về quang hợp và hô hấp ở cây xanh.", "statements": ["a) Cây xanh vừa quang hợp vừa hô hấp", "b) Ban đêm cây xanh chỉ hô hấp", "c) Lục lạp là nơi diễn ra quang hợp", "d) Ti thể là nơi diễn ra hô hấp tế bào"], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 phát biểu đều đúng.", "points": 1}, {"type": "short", "level": "NB", "q": "Quá trình cơ thể lấy chất từ môi trường, biến đổi trong cơ thể rồi thải chất thừa ra môi trường gọi là gì", "answer": "Trao đổi chất", "explain": "Trao đổi chất là quá trình sống cơ bản của mọi sinh vật.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Quang hợp thuộc quá trình đồng hoá hay dị hoá", "answer": "Đồng hoá", "explain": "Quang hợp tổng hợp chất phức tạp, cần năng lượng nên là đồng hoá.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "VD", "q": "Cây để lâu trong bóng tối bị vàng úa, héo dần vì", "options": ["A. không quang hợp bù đắp, hô hấp tiêu thụ dần chất hữu cơ dự trữ", "B. cây không hô hấp trong bóng tối", "C. cây bị thiếu nước hoàn toàn", "D. diệp lục tự biến thành chất độc"], "answer": "A", "explain": "Trong tối cây chỉ hô hấp tiêu thụ chất hữu cơ mà không quang hợp bù đắp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Người ta ướp lạnh thực phẩm để bảo quản vì nhiệt độ thấp làm", "options": ["A. chậm quá trình dị hoá phân giải của vi sinh vật và enzyme", "B. tăng quang hợp của thực phẩm", "C. thực phẩm đông cứng vĩnh viễn", "D. vi sinh vật sinh sản nhanh hơn"], "answer": "A", "explain": "Nhiệt độ thấp làm chậm dị hoá của vi sinh vật và enzyme phân giải.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quá trình nào sau đây thuộc đồng hoá", "options": ["A. tổng hợp protein từ amino acid", "B. phân giải glucose trong hô hấp", "C. tiêu hoá thức ăn trong ruột", "D. phân giải glycogen thành glucose"], "answer": "A", "explain": "Tổng hợp protein từ amino acid là tổng hợp chất phức tạp nên thuộc đồng hoá.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Oxygen được tạo ra trong quang hợp thoát ra ngoài chủ yếu qua", "options": ["A. khí khổng ở lá", "B. rễ cây", "C. mạch gỗ", "D. vỏ thân"], "answer": "A", "explain": "Khí khổng ở lá là nơi trao đổi khí của cây với môi trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao ăn no xong không nên vận động mạnh ngay", "options": ["A. vì máu tập trung cho cơ bắp làm tiêu hoá bị ảnh hưởng, dễ đau bụng", "B. vì thức ăn sẽ biến thành mỡ ngay", "C. vì dạ dày ngừng hoạt động khi chạy", "D. vì cơ thể không cần năng lượng lúc đó"], "answer": "A", "explain": "Vận động mạnh ngay sau khi ăn làm máu dồn cho cơ, ảnh hưởng tiêu hoá.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Người suy thận phải lọc máu định kì vì", "options": ["A. chất thải của trao đổi chất tích tụ trong máu gây độc", "B. thận ngừng quang hợp", "C. máu thiếu diệp lục", "D. cơ thể thừa oxygen"], "answer": "A", "explain": "Suy thận làm chất thải trao đổi chất tích tụ trong máu nên phải lọc máu.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Giải thích các hiện tượng sau:", "statements": ["a) Cây để lâu trong tối bị vàng úa vì chỉ hô hấp tiêu thụ chất hữu cơ", "b) Người sốt cao kéo dài bị sụt cân vì dị hoá tăng mạnh", "c) Nín thở lâu thấy mệt vì thiếu oxygen cho hô hấp tạo ATP", "d) Ăn no vận động mạnh ngay giúp tiêu hoá tốt hơn"], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng; d sai vì vận động mạnh ngay sau khi ăn gây đau bụng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Nhận xét về ứng dụng trong trồng trọt:", "statements": ["a) Thắp đèn ban đêm trong nhà kính để tăng thời gian quang hợp", "b) Bón phân cung cấp nguyên tố khoáng cho đồng hoá tạo chất", "c) Tỉa cành tạo tán giúp lá nhận nhiều ánh sáng hơn", "d) Tưới nước lúc trưa nắng gắt giúp quang hợp mạnh nhất"], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng; d sai vì nên tưới sáng sớm hoặc chiều mát.", "points": 1}, {"type": "short", "level": "VD", "q": "Vì sao người sốt cao kéo dài thường bị sụt cân", "answer": "Dị hoá tăng", "explain": "Sốt cao làm dị hoá tăng, cơ thể phân giải chất dự trữ.",
