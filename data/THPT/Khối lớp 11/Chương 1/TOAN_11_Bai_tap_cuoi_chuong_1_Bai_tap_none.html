ne \\frac{\\pi}{2} + k\\pi$ ($k \\in \\mathbb{Z}$)."}, {"type": "mcq", "level": "NB", "q": "Hệ thức nào sau đây đúng với mọi góc $\\alpha$?", "options": ["A. $\\sin^2\\alpha - \\cos^2\\alpha = 1$", "B. $\\sin^2\\alpha + \\cos^2\\alpha = 1$", "C. $\\sin\\alpha + \\cos\\alpha = 1$", "D. $\\tan\\alpha\\cot\\alpha = 2$"], "answer": "B", "explain": "Hệ thức lượng giác cơ bản: $\\sin^2\\alpha + \\cos^2\\alpha = 1$ với mọi $\\alpha$."}, {"type": "mcq", "level": "TH", "q": "Với mọi góc $\\alpha$, $\\sin\\left(\\frac{\\pi}{2} - \\alpha\\right)$ bằng:", "options": ["A. $\\cos\\alpha$", "B. $-\\cos\\alpha$", "C. $\\sin\\alpha$", "D. $-\\sin\\alpha$"], "answer": "A", "explain": "Hai góc $\\alpha$ và $\\frac{\\pi}{2} - \\alpha$ phụ nhau nên sin góc này bằng cos góc kia: $\\sin\\left(\\frac{\\pi}{2} - \\alpha\\right) = \\cos\\alpha$ (mẹo nhớ: phụ chéo)."}, {"type": "mcq", "level": "TH", "q": "Cho $\\pi \\lt \\alpha \\lt \\frac{3\\pi}{2}$. Khẳng định nào sau đây đúng?", "options": ["A. $\\tan\\alpha \\lt 0$", "B. $\\cot\\alpha \\lt 0$", "C. $\\sin\\alpha \\lt 0$", "D. $\\cos\\alpha \\gt 0$"], "answer": "C", "explain": "Góc $\\alpha$ thuộc góc phần tư III nên điểm biểu diễn có cả hoành độ và tung độ âm. Do đó $\\sin\\alpha \\lt 0$, $\\cos\\alpha \\lt 0$, còn $\\tan\\alpha \\gt 0$, $\\cot\\alpha \\gt 0$."}, {"type": "mcq", "level": "VD", "q": "Giá trị $\\tan 75^\\circ$ bằng:", "options": ["A. $2+\\sqrt{3}$", "B. $2-\\sqrt{3}$", "C. $1+\\sqrt{3}$", "D. $\\frac{\\sqrt{3}}{2}$"], "answer": "A", "explain": "Dùng công thức cộng của tan: $\\tan 75^\\circ = \\tan(45^\\circ + 30^\\circ) = \\frac{\\tan 45^\\circ + \\tan 30^\\circ}{1 - \\tan 45^\\circ\\tan 30^\\circ} = \\frac{1 + \\frac{\\sqrt{3}}{3}}{1 - \\frac{\\sqrt{3}}{3}} = \\frac{3+\\sqrt{3}}{3-\\sqrt{3}} = 2 + \\sqrt{3}$."}, {"type": "mcq", "level": "VDC", "q": "Số nghiệm của phương trình $\\sin x = \\frac{1}{2}$ trên đoạn $[-\\pi; \\pi]$ là:", "options": ["A. $2$", "B. $3$", "C. $4$", "D. $1$"], "answer": "B", "explain": "Ta có $\\sin x = \\sin\\frac{\\pi}{6}$ nên $x = \\frac{\\pi}{6} + k2\\pi$ hoặc $x = \\frac{5\\pi}{6} + k2\\pi$. Trên $[-\\pi; \\pi]$: họ thứ nhất cho $x = \\frac{\\pi}{6}$; họ thứ hai cho $x = \\frac{5\\pi}{6}$ và $x = \\frac{5\\pi}{6} - 2\\pi = -\\frac{7\\pi}{6}$. Vậy có $3$ nghiệm."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\sin 2a = 2\\sin a\\cos a$.", "b) $\\cos 2a = \\cos^2 a - \\sin^2 a$.", "c) $\\tan(a-b) = \\frac{\\tan a - \\tan b}{1 - \\tan a\\tan b}$.", "d) $\\sin a + \\sin b = 2\\cos\\frac{a+b}{2}\\sin\\frac{a-b}{2}$."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng: công thức nhân đôi. c) Đúng: công thức cộng của tan. d) Sai: công thức đúng là $\\sin a + \\sin b = 2\\sin\\frac{a+b}{2}\\cos\\frac{a-b}{2}$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hàm số $y = \\cos x$ là hàm số chẵn.", "b) Tập xác định của hàm số $y = \\cot x$ là $\\mathbb{R} \\setminus \\{k\\pi \\mid k \\in \\mathbb{Z}\\}$.", "c) Hàm số $y = \\tan x$ đồng biến trên khoảng $\\left(0; \\frac{\\pi}{2}\\right)$.", "d) Đồ thị hàm số $y = \\sin x$ nhận trục $Oy$ làm trục đối xứng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\cos(-x) = \\cos x$. b) Đúng: $\\cot x = \\frac{\\cos x}{\\sin x}$ xác định khi $\\sin x \\ne 0$. c) Đúng: $y = \\tan x$ đồng biến trên mỗi khoảng $\\left(-\\frac{\\pi}{2} + k\\pi; \\frac{\\pi}{2} + k\\pi\\right)$. d) Sai: $y = \\sin x$ là hàm lẻ nên đồ thị đối xứng qua gốc $O$, không đối xứng qua trục $Oy$."}, {"type": "short", "level": "VD", "q": "Cho $\\cos\\alpha = -\\frac{4}{5}$ với $\\frac{\\pi}{2} \\lt \\alpha \\lt \\pi$. Tính $\\sin\\alpha$.", "answer": "$\\frac{3}{5}$", "explain": "Từ hệ thức cơ bản: $\\sin^2\\alpha = 1 - \\cos^2\\alpha = 1 - \\frac{16}{25} = \\frac{9}{25}$ nên $\\sin\\alpha = \\pm\\frac{3}{5}$. Vì $\\frac{\\pi}{2} \\lt \\alpha \\lt \\pi$ (góc phần tư II) nên $\\sin\\alpha \\gt 0$. Vậy $\\sin\\alpha = \\frac{3}{5}$."}, {"type": "short", "level": "VDC", "q": "Tìm giá trị nhỏ nhất của hàm số $y = \\sin^2 x + \\sin x - 2$.", "answer": "$-\\frac{9}{4}$", "explain": "Đặt $t = \\sin x$ với $-1 \\le t \\le 1$. Khi đó $y = t^2 + t - 2 = \\left(t + \\frac{1}{2}\\right)^2 - \\frac{9}{4} \\ge -\\frac{9}{4}$. Dấu bằng xảy ra khi $t = -\\frac{1}{2}$, tức $\\sin x = -\\frac{1}{2}$ (có nghiệm). Vậy giá trị nhỏ nhất là $-\\frac{9}{4}$."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Giá trị $\\cot\\frac{\\pi}{3}$ bằng:", "options": ["A. $\\sqrt{3}$", "B. $\\frac{\\sqrt{3}}{3}$", "C. $1$", "D. $\\frac{\\sqrt{3}}{2}$"], "answer": "B", "explain": "Theo bảng giá trị lượng giác: $\\cot\\frac{\\pi}{3} = \\cot 60^\\circ = \\frac{\\cos 60^\\circ}{\\sin 60^\\circ} = \\frac{1/2}{\\sqrt{3}/2} = \\frac{\\sqrt{3}}{3}$."}, {"type": "mcq", "level": "NB", "q": "Chu kì của hàm số $y = \\tan x$ là:", "options": ["A. $2\\pi$", "B. $\\pi$", "C. $\\frac{\\pi}{2}$", "D. $\\pi^2$"], "answer": "B", "explain": "Ta có $\\tan(x + \\pi) = \\tan x$ với mọi $x$ thuộc tập xác định, và $\\pi$ là số dương nhỏ nhất có tính chất này, nên chu kì của $y = \\tan x$ là $\\pi$."}, {"type": "mcq", "level": "TH", "q": "Với mọi góc $\\alpha$, rút gọn $\\cos(2\\pi - \\alpha)$ được:", "options": ["A. $\\cos\\alpha$", "B. $-\\cos\\alpha$", "C. $\\sin\\alpha$", "D. $-\\sin\\alpha$"], "answer": "A", "explain": "Vì $\\cos$ là hàm tuần hoàn chu kì $2\\pi$ và là hàm chẵn: $\\cos(2\\pi - \\alpha) = \\cos(-\\alpha) = \\cos\\alpha$."}, {"type": "mcq", "level": "TH", "q": "Nghiệm của phương trình $\\sin x = 1$ là:", "options": ["A. $x = \\frac{\\pi}{2} + k2\\pi$", "B. $x = \\frac{\\pi}{2} + k\\pi$", "C. $x = k2\\pi$", "D. $x = \\frac{\\pi}{4} + k\\pi$"], "answer": "A", "explain": "Đây là trường hợp đặc biệt: $\\sin x = 1 \\Leftrightarrow x = \\frac{\\pi}{2} + k2\\pi$ ($k \\in \\mathbb{Z}$)."}, {"type": "mcq", "level": "VD", "q": "Biến đổi $2\\sin a\\cos b$ thành tổng được:", "options": ["A. $\\sin(a+b) + \\sin(a-b)$", "B. $\\sin(a+b) - \\sin(a-b)$", "C. $\\cos(a+b) + \\cos(a-b)$", "D. $\\sin(a-b) - \\sin(a+b)$"], "answer": "A", "explain": "Ta có $\\sin(a+b) = \\sin a\\cos b + \\cos a\\sin b$ và $\\sin(a-b) = \\sin a\\cos b - \\cos a\\sin b$. Cộng hai đẳng thức: $\\sin(a+b) + \\sin(a-b) = 2\\sin a\\cos b$."}, {"type": "mcq", "level": "VDC", "q": "Tập nghiệm của phương trình $\\sin x = \\sin\\frac{2\\pi}{3}$ là:", "options": ["A. $x = \\frac{2\\pi}{3} + k2\\pi$", "B. $x = \\frac{\\pi}{3} + k2\\pi$ hoặc $x = \\frac{2\\pi}{3} + k2\\pi$ ($k \\in \\mathbb{Z}$)", "C. $x = \\pm\\frac{2\\pi}{3} + k2\\pi$", "D. $x = \\frac{\\pi}{6} + k\\pi$"], "answer": "B", "explain": "Áp dụng công thức: $\\sin x = \\sin\\alpha \\Leftrightarrow x = \\alpha + k2\\pi$ hoặc $x = \\pi - \\alpha + k2\\pi$. Với $\\alpha = \\frac{2\\pi}{3}$ ta được $x = \\frac{2\\pi}{3} + k2\\pi$ hoặc $x = \\frac{\\pi}{3} + k2\\pi$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\sin\\frac{\\pi}{6} = \\frac{1}{2}$.", "b) $\\cos\\frac{\\pi}{3} = \\frac{1}{2}$.", "c) $30^\\circ = \\frac{\\pi}{6}$ rađian.", "d) $\\sin(-30^\\circ) = \\frac{1}{2}$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\sin 30^\\circ = \\frac{1}{2}$. b) Đúng: $\\cos 60^\\circ = \\frac{1}{2}$. c) Đúng: $30\\cdot\\frac{\\pi}{180} = \\frac{\\pi}{6}$. d) Sai: $\\sin(-30^\\circ) = -\\sin 30^\\circ = -\\frac{1}{2}$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\cos(a+b) = \\cos a\\cos b - \\sin a\\sin b$.", "b) $\\sin^2\\frac{x}{2} = \\frac{1-\\cos x}{2}$.", "c) $\\tan 2a = \\frac{2\\tan a}{1-\\tan^2 a}$.", "d) $\\cos a - \\cos b = 2\\sin\\frac{a+b}{2}\\sin\\frac{a-b}{2}$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: công thức cộng của cos. b) Đúng: công thức hạ bậc $\\sin^2\\frac{x}{2} = \\frac{1-\\cos x}{2}$. c) Đúng: công thức nhân đôi của tan. d) Sai: thiếu dấu trừ, công thức đúng là $\\cos a - \\cos b = -2\\sin\\frac{a+b}{2}\\sin\\frac{a-b}{2}$."}, {"type": "short", "level": "VD", "q": "Viết nghiệm tổng quát của phương trình $\\tan x = \\sqrt{3}$.", "answer": "$x = \\frac{\\pi}{3} + k\\pi$ ($k \\in \\mathbb{Z}$)", "explain": "Ta có $\\tan x = \\sqrt{3} = \\tan\\frac{\\pi}{3}$. Áp dụng công thức $\\tan x = \\tan\\alpha \\Leftrightarrow x = \\alpha + k\\pi$, suy ra $x = \\frac{\\pi}{3} + k\\pi$ ($k \\in \\mathbb{Z}$)."}, {"type": "short", "level": "VDC", "q": "Tìm giá trị lớn nhất của hàm số $y = 1 - 2\\cos^2 x + \\sin x$.", "answer": "$2$", "explain": "Biến đổi: $y = 1 - 2(1 - \\sin^2 x) + \\sin x = 2\\sin^2 x + \\sin x - 1$. Đặt $t = \\sin x$ ($-1 \\le t \\le 1$), xét $f(t) = 2t^2 + t - 1$ có đỉnh tại $t = -\\frac{1}{4}$ với $f\\left(-\\frac{1}{4}\\right) = -\\frac{9}{8}$; $f(1) = 2$, $f(-1) = 0$. Vậy giá trị lớn nhất là $2$, đạt được khi $\\sin x = 1$."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Giá trị $\\sin\\pi$ bằng:", "options": ["A. $0$", "B. $1$", "C. $-1$", "D. $\\frac{\\sqrt{2}}{2}$"], "answer": "A", "explain": "Trên đường tròn lượng giác, góc $\\pi$ ứng với điểm $(-1; 0)$ nên $\\sin\\pi = y_M = 0$."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. $\\cos(-x) = -\\cos x$", "B. $\\cos(-x) = \\cos x$", "C. $\\sin(-x) = \\sin x$", "D. $\\tan(-x) = \\tan x$"], "answer": "B", "explain": "Hàm số $y = \\cos x$ là hàm số chẵn nên $\\cos(-x) = \\cos x$ với mọi $x$; còn $\\sin$ và $\\tan$ là hàm lẻ nên C, D sai."}, {"type": "mcq", "level": "TH", "q": "Số đo theo rađian của góc $135^\\circ$ là:", "options": ["A. $\\frac{3\\pi}{4}$", "B. $\\frac{2\\pi}{3}$", "C. $\\frac{5\\pi}{6}$", "D. $\\frac{\\pi}{4}$"], "answer": "A", "explain": "Ta có $135^\\circ = 135\\cdot\\frac{\\pi}{180} = \\frac{3\\pi}{4}$ rađian."}, {"type": "mcq", "level": "TH", "q": "Với $\\cos\\alpha \\ne 0$, $1 + \\tan^2\\alpha$ bằng:", "options": ["A. $\\frac{1}{\\cos^2\\alpha}$", "B. $\\frac{1}{\\sin^2\\alpha}$", "C. $\\cos^2\\alpha$", "D. $2$"], "answer": "A", "explain": "Ta có $1 + \\tan^2\\alpha = 1 + \\frac{\\sin^2\\alpha}{\\cos^2\\alpha} = \\frac{\\cos^2\\alpha + \\sin^2\\alpha}{\\cos^2\\alpha} = \\frac{1}{\\cos^2\\alpha}$."}, {"type": "mcq", "level": "VD", "q": "Cho $\\tan a = 2$. Giá trị $\\sin 2a$ bằng:", "options": ["A. $\\frac{4}{5}$", "B. $-\\frac{4}{5}$", "C. $\\frac{3}{5}$", "D. $\\frac{2}{5}$"], "answer": "A", "explain": "Dùng công thức $\\sin 2a = \\frac{2\\tan a}{1 + \\tan^2 a}$ (chia cả tử và mẫu của $2\\sin a\\cos a$ cho $\\cos^2 a$): $\\sin 2a = \\frac{2\\cdot 2}{1 + 4} = \\frac{4}{5}$."}, {"type": "mcq", "level": "VDC", "q": "Hàm số $y = \\cos x$ nghịch biến trên khoảng nào sau đây?", "options": ["A. $(0; \\pi)$", "B. $(-\\pi; 0)$", "C. $\\left(\\frac{\\pi}{2}; \\frac{3\\pi}{2}\\right)$", "D. $\\left(-\\frac{\\pi}{2}; \\frac{\\pi}{2}\\right)$"], "answer": "A", "explain": "Hàm số $y = \\cos x$ nghịch biến trên mỗi khoảng $(k2\\pi; \\pi + k2\\pi)$ ($k \\in \\mathbb{Z}$). Với $k = 0$ ta được khoảng $(0; \\pi)$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\tan 45^\\circ = 1$.", "b) $\\cot 60^\\circ = \\frac{\\sqrt{3}}{3}$.", "c) $\\cos\\frac{3\\pi}{2} = 0$.", "d) $\\sin\\frac{3\\pi}{2} = 1$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\tan 45^\\circ = 1$. b) Đúng: $\\cot 60^\\circ = \\frac{\\sqrt{3}}{3}$. c) Đúng: góc $\\frac{3\\pi}{2}$ ứng với điểm $(0; -1)$ nên $\\cos = 0$. d) Sai: $\\sin\\frac{3\\pi}{2} = -1$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phương trình $\\cot x = m$ luôn có nghiệm với mọi $m \\in \\mathbb{R}$.", "b) Phương trình $\\cos x = -2$ vô nghiệm.", "c) Nếu $\\sin x = \\sin\\alpha$ thì $x = \\alpha + k2\\pi$ hoặc $x = \\pi - \\alpha + k2\\pi$ ($k \\in \\mathbb{Z}$).", "d) Phương trình $\\tan x = 1$ có nghiệm $x = \\frac{\\pi}{4} + k2\\pi$ ($k \\in \\mathbb{Z}$)."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\cot x$ nhận mọi giá trị thực. b) Đúng: $|\\cos x| \\le 1$ nên $\\cos x = -2$ vô nghiệm. c) Đúng: công thức nghiệm của $\\sin x = \\sin\\alpha$. d) Sai: họ nghiệm đúng là $x = \\frac{\\pi}{4} + k\\pi$ (chu kì của tan là $\\pi$, không phải $2\\pi$)."}, {"type": "short", "level": "VD", "q": "Rút gọn biểu thức $B = \\cos^4 x - \\sin^4 x$.", "answer": "$\\cos 2x$", "explain": "Dùng hằng đẳng thức: $\\cos^4 x - \\sin^4 x = (\\cos^2 x - \\sin^2 x)(\\cos^2 x + \\sin^2 x)$. Vì $\\cos^2 x + \\sin^2 x = 1$ và $\\cos^2 x - \\sin^2 x = \\cos 2x$ nên $B = \\cos 2x$."}, {"type": "short", "level": "VDC", "q": "Tìm tất cả giá trị của tham số $m$ để phương trình $\\cos x = m^2 - 1$ có nghiệm.", "answer": "$-\\sqrt{2} \\le m \\le \\sqrt{2}$", "explain": "Phương trình $\\cos x = m^2 - 1$ có nghiệm khi và chỉ khi $|m^2 - 1| \\le 1$, tức $-1 \\le m^2 - 1 \\le 1$. Suy ra $0 \\le m^2 \\le 2$, hay $|m| \\le \\sqrt{2}$. Vậy $-\\sqrt{2} \\le m \\le \\sqrt{2}$."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Tập xác định của hàm số $y = \\cot x$ là:", "options": ["A. $\\mathbb{R} \\setminus \\{k\\pi \\mid k \\in \\mathbb{Z}\\}$", "B. $\\mathbb{R}$", "C. $\\mathbb{R} \\setminus \\left\\{\\frac{\\pi}{2} + k\\pi \\mid k \\in \\mathbb{Z}\\right\\}$", "D. $(0; \\pi)$"], "answer": "A", "explain": "Vì $\\cot x = \\frac{\\cos x}{\\sin x}$ nên $\\cot x$ xác định khi $\\sin x \\ne 0$, tức $x \\ne k\\pi$ ($k \\in \\mathbb{Z}$)."}, {"type": "mcq", "level": "NB", "q": "Hàm số nào sau đây là hàm số lẻ?", "options": ["A. $y = \\cos x$", "B. $y = \\sin x$", "C. $y = \\cos^2 x$", "D. $y = 2$"], "answer": "B", "explain": "Ta có $\\sin(-x) = -\\sin x$ nên $y = \\sin x$ là hàm lẻ; $\\cos(-x) = \\cos x$ nên $y = \\cos x$ và $y = \\cos^2 x$ là hàm chẵn; $y = 2$ là hàm hằng (vừa chẵn vừa lẻ theo nghĩa rộng, nhưng không phải đáp án cần chọn)."}, {"type": "mcq", "level": "TH", "q": "Với mọi góc $\\alpha$, $\\sin(\\pi + \\alpha)$ bằng:", "options": ["A. $-\\sin\\alpha$", "B. $\\sin\\alpha$", "C. $\\cos\\alpha$", "D. $-\\cos\\alpha$"], "answer": "A", "explain": "Hai góc $\\alpha$ và $\\pi + \\alpha$ hơn kém nhau $\\pi$ nên sin, cos đều đổi dấu: $\\sin(\\pi + \\alpha) = -\\sin\\alpha$."}, {"type": "mcq", "level": "TH", "q": "Nghiệm của phương trình $\\cos x = -1$ là:", "options": ["A. $x = \\pi + k2\\pi$", "B. $x = \\frac{\\pi}{2} + k\\pi$", "C. $x = k\\pi$", "D. $x = k2\\pi$"], "answer": "A", "explain": "Đây là trường hợp đặc biệt: $\\cos x = -1 \\Leftrightarrow x = \\pi + k2\\pi$ ($k \\in \\mathbb{Z}$)."}, {"type": "mcq", "level": "VD", "q": "Cho $\\cos a = -\\frac{1}{3}$ với $\\pi \\lt a \\lt \\frac{3\\pi}{2}$. Tính $\\sin 2a$.", "options": ["A. $\\frac{4\\sqrt{2}}{9}$", "B. $-\\frac{4\\sqrt{2}}{9}$", "C. $\\frac{2\\sqrt{2}}{9}$", "D. $-\\frac{8}{9}$"], "answer": "A", "explain": "Ta có $\\sin^2 a = 1 - \\cos^2 a = 1 - \\frac{1}{9} = \\frac{8}{9}$ nên $\\sin a = \\pm\\frac{2\\sqrt{2}}{3}$. Vì $\\pi \\lt a \\lt \\frac{3\\pi}{2}$ (góc phần tư III) nên $\\sin a \\lt 0$, suy ra $\\sin a = -\\frac{2\\sqrt{2}}{3}$. Do đó $\\sin 2a = 2\\sin a\\cos a = 2\\cdot\\left(-\\frac{2\\sqrt{2}}{3}\\right)\\cdot\\left(-\\frac{1}{3}\\right) = \\frac{4\\sqrt{2}}{9}$."}, {"type": "mcq", "level": "VDC", "q": "Tổng các nghiệm của phương trình $\\cos x = 0$ trên đoạn $[-\\pi; \\pi]$ là:", "options": ["A. $0$", "B. $\\pi$", "C. $-\\pi$", "D. $\\frac{\\pi}{2}$"], "answer": "A", "explain": "Ta có $\\cos x = 0 \\Leftrightarrow x = \\frac{\\pi}{2} + k\\pi$. Trên đoạn $[-\\pi; \\pi]$: với $k = 0$ được $x = \\frac{\\pi}{2}$; với $k = -1$ được $x = -\\frac{\\pi}{2}$. Tổng các nghiệm là $\\frac{\\pi}{2} + \\left(-\\frac{\\pi}{2}\\right) = 0$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hàm số $y = \\sin x$ xác định trên $\\mathbb{R}$.", "b) Hàm số $y = \\tan x$ là hàm số lẻ.", "c) Chu kì của hàm số $y = \\cos x$ là $2\\pi$.", "d) Giá trị lớn nhất của $y = \\sin x$ là $2$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $y = \\sin x$ xác định với mọi $x$. b) Đúng: $\\tan(-x) = -\\tan x$. c) Đúng: $\\cos(x + 2\\pi) = \\cos x$. d) Sai: giá trị lớn nhất của $y = \\sin x$ là $1$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\cos^2 a = \\frac{1+\\cos 2a}{2}$.", "b) $\\sin a\\cos b = \\frac{\\sin(a+b) + \\sin(a-b)}{2}$.", "c) $\\tan a + \\tan b = \\frac{\\sin(a+b)}{\\cos a\\cos b}$.", "d) $\\sin(a+b) = \\sin a + \\sin b$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: công thức hạ bậc. b) Đúng: công thức biến đổi tích thành tổng. c) Đúng: $\\tan a + \\tan b = \\frac{\\sin a}{\\cos a} + \\frac{\\sin b}{\\cos b} = \\frac{\\sin(a+b)}{\\cos a\\cos b}$. d) Sai: $\\sin(a+b) = \\sin a\\cos b + \\cos a\\sin b$."}, {"type": "short", "level": "VD", "q": "Cho $\\sin x + \\cos x = \\frac{\\sqrt{2}}{2}$. Tính $\\sin 2x$.", "answer": "$-\\frac{1}{2}$", "explain": "Bình phương hai vế: $(\\sin x + \\cos x)^2 = \\sin^2 x + \\cos^2 x + 2\\sin x\\cos x = 1 + \\sin 2x$. Mà $\\left(\\frac{\\sqrt{2}}{2}\\right)^2 = \\frac{1}{2}$ nên $1 + \\sin 2x = \\frac{1}{2}$, suy ra $\\sin 2x = -\\frac{1}{2}$."}, {"type": "short", "level": "VDC", "q": "Tìm giá trị lớn nhất của hàm số $y = \\sin x + \\cos x$.", "answer": "$\\sqrt{2}$", "explain": "Ta có $y = \\sin x + \\cos x = \\sqrt{2}\\left(\\frac{\\sqrt{2}}{2}\\sin x + \\frac{\\sqrt{2}}{2}\\cos x\\right) = \\sqrt{2}\\sin\\left(x + \\frac{\\pi}{4}\\right)$. Vì $\\sin\\left(x + \\frac{\\pi}{4}\\right) \\le 1$ nên $y \\le \\sqrt{2}$. Dấu bằng xảy ra khi $x + \\frac{\\pi}{4} = \\frac{\\pi}{2} + k2\\pi$. Vậy giá trị lớn nhất là $\\sqrt{2}$."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Với $\\alpha$ thỏa mãn điều kiện xác định, $\\tan\\left(\\frac{\\pi}{2} - \\alpha\\right)$ bằng:", "options": ["A. $\\cot\\alpha$", "B. $-\\cot\\alpha$", "C. $\\tan\\alpha$", "D. $-\\tan\\alpha$"], "answer": "A", "explain": "Hai góc $\\alpha$ và $\\frac{\\pi}{2} - \\alpha$ phụ nhau nên tan góc này bằng cot góc kia: $\\tan\\left(\\frac{\\pi}{2} - \\alpha\\right) = \\cot\\alpha$ (mẹo nhớ: phụ chéo)."}, {"type": "mcq", "level": "NB", "q": "Phương trình $\\sin x = m$ có nghiệm khi và chỉ khi:", "options": ["A. $|m| \\le 1$", "B. $|m| \\ge 1$", "C. $m \\gt 0$", "D. $m \\ne 0$"], "answer": "A", "explain": "Vì $|\\sin x| \\le 1$ với mọi $x$ nên $\\sin x = m$ có nghiệm khi và chỉ khi $|m| \\le 1$."}, {"type": "mcq", "level": "TH", "q": "Cho $\\frac{\\pi}{2} \\lt \\alpha \\lt \\pi$. Khẳng định nào sau đây đúng?", "options": ["A. $\\tan\\alpha \\gt 0$", "B. $\\cot\\alpha \\gt 0$", "C. $\\tan\\alpha \\lt 0$", "D. $\\sin\\alpha \\lt 0$"], "answer": "C", "explain": "Góc $\\alpha$ thuộc góc phần tư II nên $\\sin\\alpha \\gt 0$, $\\cos\\alpha \\lt 0$. Do $\\tan\\alpha = \\frac{\\sin\\alpha}{\\cos\\alpha}$ nên $\\tan\\alpha \\lt 0$; tương tự $\\cot\\alpha \\lt 0$."}, {"type": "mcq", "level": "TH", "q": "Biến đổi $\\cos a + \\cos b$ thành tích được:", "options": ["A. $2\\cos\\frac{a+b}{2}\\cos\\frac{a-b}{2}$", "B. $-2\\sin\\frac{a+b}{2}\\sin\\frac{a-b}{2}$", "C. $2\\sin\\frac{a+b}{2}\\cos\\frac{a-b}{2}$", "D. $2\\cos\\frac{a+b}{2}\\sin\\frac{a-b}{2}$"], "answer": "A", "explain": "Công thức biến đổi tổng thành tích: $\\cos a + \\cos b = 2\\cos\\frac{a+b}{2}\\cos\\frac{a-b}{2}$."}, {"type": "mcq", "level": "VD", "q": "Giá trị $\\sin 105^\\circ$ bằng:", "options": ["A. $\\frac{\\sqrt{6}+\\sqrt{2}}{4}$", "B. $\\frac{\\sqrt{6}-\\sqrt{2}}{4}$", "C. $\\frac{2+\\sqrt{3}}{4}$", "D. $\\frac{\\sqrt{3}-1}{2\\sqrt{2}}$"], "answer": "A", "explain": "Dùng công thức cộng: $\\sin 105^\\circ = \\sin(60^\\circ + 45^\\circ) = \\sin 60^\\circ\\cos 45^\\circ + \\cos 60^\\circ\\sin 45^\\circ = \\frac{\\sqrt{3}}{2}\\cdot\\frac{\\sqrt{2}}{2} + \\frac{1}{2}\\cdot\\frac{\\sqrt{2}}{2} = \\frac{\\sqrt{6}+\\sqrt{2}}{4}$."}, {"type": "mcq", "level": "VDC", "q": "Phương trình $\\sin 2x = 1$ có nghiệm là:", "options": ["A. $x = \\frac{\\pi}{4} + k\\pi$", "B. $x = \\frac{\\pi}{2} + k\\pi$", "C. $x = \\frac{\\pi}{4} + k2\\pi$", "D. $x = \\frac{\\pi}{8} + k\\pi$"], "answer": "A", "explain": "Đặt $t = 2x$, phương trình trở thành $\\sin t = 1$ nên $t = \\frac{\\pi}{2} + k2\\pi$. Suy ra $2x = \\frac{\\pi}{2} + k2\\pi$, tức $x = \\frac{\\pi}{4} + k\\pi$ ($k \\in \\mathbb{Z}$)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\sin\\frac{\\pi}{3} = \\frac{\\sqrt{3}}{2}$.", "b) $\\cos\\frac{\\pi}{4} = \\frac{\\sqrt{2}}{2}$.", "c) $90^\\circ = \\frac{\\pi}{2}$ rađian.", "d) $\\tan\\pi = 0$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $\\sin 60^\\circ = \\frac{\\sqrt{3}}{2}$. b) Đúng: $\\cos 45^\\circ = \\frac{\\sqrt{2}}{2}$. c) Đúng: $90\\cdot\\frac{\\pi}{180} = \\frac{\\pi}{2}$. d) Đúng: $\\tan\\pi = \\frac{\\sin\\pi}{\\cos\\pi} = \\frac{0}{-1} = 0$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hàm số $y = \\sin x$ đồng biến trên khoảng $\\left(-\\frac{\\pi}{2}; \\frac{\\pi}{2}\\right)$.", "b) Hàm số $y = \\cot x$ nghịch biến trên khoảng $(0; \\pi)$.", "c) Đồ thị hàm số $y = \\tan x$ nhận gốc tọa độ $O$ làm tâm đối xứng.", "d) Hàm số $y = \\cos x$ đồng biến trên khoảng $(0; \\pi)$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $y = \\sin x$ đồng biến trên $\\left(-\\frac{\\pi}{2} + k2\\pi; \\frac{\\pi}{2} + k2\\pi\\right)$. b) Đúng: $y = \\cot x$ nghịch biến trên mỗi khoảng $(k\\pi; \\pi + k\\pi)$. c) Đúng: $y = \\tan x$ là hàm lẻ nên đồ thị đối xứng qua gốc $O$. d) Sai: $y = \\cos x$ nghịch biến (không phải đồng biến) trên $(0; \\pi)$."}, {"type": "short", "level": "VD", "q": "Rút gọn biểu thức $C = (1 + \\cos 2x)\\tan x$ (với $\\cos x \\ne 0$).", "answer": "$\\sin 2x$", "explain": "Dùng công thức nhân đôi: $1 + \\cos 2x = 2\\cos^2 x$. Khi đó $C = 2\\cos^2 x \\cdot \\tan x = 2\\cos^2 x \\cdot \\frac{\\sin x}{\\cos x} = 2\\sin x\\cos x = \\sin 2x$."}, {"type": "short", "level": "VDC", "q": "Tìm số nghiệm của phương trình $\\tan x = \\tan\\frac{\\pi}{7}$ trên khoảng $(0; 2\\pi)$.", "answer": "$2$", "explain": "Ta có $\\tan x = \\tan\\frac{\\pi}{7} \\Leftrightarrow x = \\frac{\\pi}{7} + k\\pi$ ($k \\in \\mathbb{Z}$). Trên khoảng $(0; 2\\pi)$: với $k = 0$ được $x = \\frac{\\pi}{7}$; với $k = 1$ được $x = \\frac{8\\pi}{7}$; với $k = 2$ thì $x$ vượt quá $2\\pi$. Vậy có $2$ nghiệm."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "$\\sin\\left(-\\frac{\\pi}{6}\\right)$ bằng:", "options": ["A. $-\\frac{1}{2}$", "B. $\\frac{1}{2}$", "C. $-\\frac{\\sqrt{3}}{2}$", "D. $\\frac{\\sqrt{3}}{2}$"], "answer": "A", "explain": "Vì $y = \\sin x$ là hàm lẻ: $\\sin\\left(-\\frac{\\pi}{6}\\right) = -\\sin\\frac{\\pi}{6} = -\\frac{1}{2}$."}, {"type": "mcq", "level": "NB", "q": "Hàm số nào sau đây có tập xác định là $\\mathbb{R}$?", "options": ["A. $y = \\tan x$", "B. $y = \\cot x$", "C. $y = \\sin x$", "D. $y = \\frac{1}{\\cos x}$"], "answer": "C", "explain": "Hàm số $y = \\sin x$ xác định với mọi $x \\in \\mathbb{R}$; $y = \\tan x$ không xác định tại $\\frac{\\pi}{2} + k\\pi$, $y = \\cot x$ không xác định tại $k\\pi$, $y = \\frac{1}{\\cos x}$ không xác định tại $\\frac{\\pi}{2} + k\\pi$."}, {"type": "mcq", "level": "TH", "q": "Số đo theo độ của góc $\\frac{5\\pi}{6}$ rađian là:", "options": ["A. $150^\\circ$", "B. $120^\\circ$", "C. $135^\\circ$", "D. $160^\\circ$"], "answer": "A", "explain": "Ta có $\\frac{5\\pi}{6}$ rađian $= \\frac{5\\pi}{6}\\cdot\\frac{180}{\\pi} = 150^\\circ$."}, {"type": "mcq", "level": "TH", "q": "Nghiệm của phương trình $\\tan x = 0$ là:", "options": ["A. $x = k\\pi$", "B. $x = \\frac{\\pi}{2} + k\\pi$", "C. $x = k2\\pi$", "D. $x = \\frac{\\pi}{4} + k\\pi$"], "answer": "A", "explain": "Ta có $\\tan x = 0 = \\tan 0$ nên $x = 0 + k\\pi = k\\pi$ ($k \\in \\mathbb{Z}$)."}, {"type": "mcq", "level": "VD", "q": "Cho $\\tan a = \\frac{4}{3}$ với $0 \\lt a \\lt \\frac{\\pi}{2}$. Giá trị $\\tan 2a$ bằng:", "options": ["A. $-\\frac{24}{7}$", "B. $\\frac{24}{7}$", "C. $-\\frac{24}{25}$", "D. $\\frac{12}{7}$"], "answer": "A", "explain": "Dùng công thức nhân đôi của tan: $\\tan 2a = \\frac{2\\tan a}{1 - \\tan^2 a} = \\frac{2\\cdot\\frac{4}{3}}{1 - \\frac{16}{9}} = \\frac{8/3}{-7/9} = -\\frac{24}{7}$."}, {"type": "mcq", "level": "VDC", "q": "Số nghiệm của phương trình $\\sin x = \\frac{\\sqrt{2}}{2}$ trên đoạn $[0; 2\\pi]$ là:", "options": ["A. $1$", "B. $2$", "C. $3$", "D. $4$"], "answer": "B", "explain": "Ta có $\\sin x = \\sin\\frac{\\pi}{4}$ nên $x = \\frac{\\pi}{4} + k2\\pi$ hoặc $x = \\frac{3\\pi}{4} + k2\\pi$. Trên $[0; 2\\pi]$, với $k = 0$ được $x = \\frac{\\pi}{4}$ và $x = \\frac{3\\pi}{4}$; các giá trị $k$ khác cho nghiệm nằm ngoài đoạn. Vậy có $2$ nghiệm."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phương trình $\\tan x = \\sqrt{3}$ có nghiệm $x = \\frac{\\pi}{3}$.", "b) Phương trình $\\cos x = 1$ có nghiệm $x = k2\\pi$ ($k \\in \\mathbb{Z}$).", "c) Phương trình $\\cot x = 1$ có nghiệm $x = \\frac{\\pi}{4} + k\\pi$ ($k \\in \\mathbb{Z}$).", "d) Phương trình $\\sin x = -2$ có nghiệm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\tan\\frac{\\pi}{3} = \\sqrt{3}$. b) Đúng: trường hợp đặc biệt $\\cos x = 1$. c) Đúng: $\\cot x = \\cot\\frac{\\pi}{4} \\Leftrightarrow x = \\frac{\\pi}{4} + k\\pi$. d) Sai: $|\\sin x| \\le 1$ nên $\\sin x = -2$ vô nghiệm."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Điểm $M$ biểu diễn góc $\\frac{\\pi}{2}$ trên đường tròn lượng giác nằm trên trục $Oy$.", "b) $\\cos\\frac{2\\pi}{3} = -\\frac{1}{2}$.", "c) $\\sin^2 x + \\cos^2 x = 1$ với mọi $x$.", "d) $\\tan x = \\frac{\\sin x}{\\cos x}$ với mọi $x \\in \\mathbb{R}$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: góc $\\frac{\\pi}{2}$ ứng với điểm $(0; 1)$ trên trục $Oy$. b) Đúng: $\\cos\\frac{2\\pi}{3} = \\cos 120^\\circ = -\\frac{1}{2}$. c) Đúng: hệ thức cơ bản. d) Sai: đẳng thức chỉ đúng khi $\\cos x \\ne 0$ (tại $x = \\frac{\\pi}{2} + k\\pi$ thì $\\tan x$ không xác định)."}, {"type": "short", "level": "VD", "q": "Cho $\\sin a = \\frac{1}{3}$ với $0 \\lt a \\lt \\frac{\\pi}{2}$. Tính $\\cos 2a$.", "answer": "$\\frac{7}{9}$", "explain": "Dùng công thức nhân đôi: $\\cos 2a = 1 - 2\\sin^2 a = 1 - 2\\cdot\\left(\\frac{1}{3}\\right)^2 = 1 - \\frac{2}{9} = \\frac{7}{9}$."}, {"type": "short", "level": "VDC", "q": "Tìm giá trị nhỏ nhất của hàm số $y = 3 - 4\\sin^2 x$.", "answer": "$-1$", "explain": "Vì $0 \\le \\sin^2 x \\le 1$ với mọi $x$ nên $0 \\le 4\\sin^2 x \\le 4$, suy ra $-1 \\le 3 - 4\\sin^2 x \\le 3$. Vậy giá trị nhỏ nhất là $-1$, đạt được khi $\\sin^2 x = 1$, tức $x = \\frac{\\pi}{2} + k\\pi$."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Giá trị $\\cos\\frac{\\pi}{2}$ bằng:", "options": ["A. $0$", "B. $1$", "C. $-1$", "D. $\\frac{1}{2}$"], "answer": "A", "explain": "Trên đường tròn lượng giác, góc $\\frac{\\pi}{2}$ ứng với điểm $(0; 1)$ nên $\\cos\\frac{\\pi}{2} = x_M = 0$."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. Hàm số $y = \\sin x$ là hàm số chẵn", "B. Hàm số $y = \\cos x$ là hàm số lẻ", "C. Hàm số $y = \\tan x$ là hàm số lẻ", "D. Hàm số $y = \\cot x$ là hàm số chẵn"], "answer": "C", "explain": "Ta có $\\tan(-x) = -\\tan x$ nên $y = \\tan x$ là hàm số lẻ. Ngược lại $y = \\sin x$ là hàm lẻ (không phải chẵn), $y = \\cos x$ và $y = \\cot x$ lần lượt là hàm chẵn và hàm lẻ."}, {"type": "mcq", "level": "TH", "q": "Với mọi góc $\\alpha$, $\\sin\\left(\\frac{\\pi}{2} + \\alpha\\right)$ bằng:", "options": ["A. $\\cos\\alpha$", "B. $-\\cos\\alpha$", "C. $\\sin\\alpha$", "D. $-\\sin\\alpha$"], "answer": "A", "explain": "Ta có $\\sin\\left(\\frac{\\pi}{2} + \\alpha\\right) = \\sin\\left[\\pi - \\left(\\frac{\\pi}{2} - \\alpha\\right)\\right] = \\sin\\left(\\frac{\\pi}{2} - \\alpha\\right) = \\cos\\alpha$ (dùng công thức góc bù rồi góc phụ)."}, {"type": "mcq", "level": "TH", "q": "Phương trình $\\cos x = \\frac{3}{2}$:", "options": ["A. Vô nghiệm", "B. Có đúng một nghiệm", "C. Có hai nghiệm", "D. Có vô số nghiệm"], "answer": "A", "explain": "Vì $|\\cos x| \\le 1$ với mọi $x$ mà $\\frac{3}{2}$ lớn hơn $1$ nên phương trình $\\cos x = \\frac{3}{2}$ vô nghiệm."}, {"type": "mcq", "level": "VD", "q": "Rút gọn $\\frac{1-\\cos 2x}{\\sin 2x}$ (với $\\sin 2x \\ne 0$) được:", "options": ["A. $\\tan x$", "B. $\\cot x$", "C. $2\\tan x$", "D. $\\sin x$"], "answer": "A", "explain": "Dùng công thức nhân đôi: $1 - \\cos 2x = 2\\sin^2 x$ và $\\sin 2x = 2\\sin x\\cos x$. Suy ra $\\frac{1-\\cos 2x}{\\sin 2x} = \\frac{2\\sin^2 x}{2\\sin x\\cos x} = \\frac{\\sin x}{\\cos x} = \\tan x$."}, {"type": "mcq", "level": "VDC", "q": "Họ nghiệm của phương trình $\\cot x = \\sqrt{3}$ là:", "options": ["A. $x = \\frac{\\pi}{6} + k\\pi$", "B. $x = \\frac{\\pi}{3} + k\\pi$", "C. $x = \\frac{\\pi}{6} + k2\\pi$", "D. $x = \\pm\\frac{\\pi}{6} + k\\pi$"], "answer": "A", "explain": "Ta có $\\cot x = \\sqrt{3} = \\cot\\frac{\\pi}{6}$. Áp dụng công thức $\\cot x = \\cot\\alpha \\Leftrightarrow x = \\alpha + k\\pi$, suy ra $x = \\frac{\\pi}{6} + k\\pi$ ($k \\in \\mathbb{Z}$)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\sin 0 = 0$.", "b) $\\cos\\pi = -1$.", "c) $\\tan\\frac{\\pi}{4} = 1$.", "d) $\\cot\\frac{\\pi}{2} = 1$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\sin 0 = 0$. b) Đúng: góc $\\pi$ ứng với điểm $(-1; 0)$. c) Đúng: $\\tan 45^\\circ = 1$. d) Sai: $\\cot\\frac{\\pi}{2} = \\frac{\\cos(\\pi/2)}{\\sin(\\pi/2)} = \\frac{0}{1} = 0$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hàm số $y = \\sin x$ có giá trị lớn nhất bằng $1$.", "b) Hàm số $y = \\cos x$ có giá trị nhỏ nhất bằng $-1$.", "c) Phương trình $\\sin x = \\frac{1}{2}$ có nghiệm $x = \\frac{\\pi}{6} + k2\\pi$ hoặc $x = \\frac{5\\pi}{6} + k2\\pi$ ($k \\in \\mathbb{Z}$).", "d) Phương trình $\\cos 2x = 0$ có nghiệm $x = \\frac{\\pi}{4} + k\\frac{\\pi}{2}$ ($k \\in \\mathbb{Z}$)."], "answer": ["T", "T", "T", "T"], "explain": "a), b) Đúng: $|\\sin x| \\le 1$, $|\\cos x| \\le 1$. c) Đúng: $\\sin x = \\sin\\frac{\\pi}{6}$ cho hai họ nghiệm trên. d) Đúng: đặt $t = 2x$, $\\cos t = 0 \\Leftrightarrow t = \\frac{\\pi}{2} + k\\pi$ nên $x = \\frac{\\pi}{4} + k\\frac{\\pi}{2}$."}, {"type": "short", "level": "VD", "q": "Tính giá trị biểu thức $D = \\cos\\frac{\\pi}{12}\\cos\\frac{\\pi}{4} - \\sin\\frac{\\pi}{12}\\sin\\frac{\\pi}{4}$.", "answer": "$\\frac{1}{2}$", "explain": "Áp dụng công thức cộng của cos: $D = \\cos\\left(\\frac{\\pi}{12} + \\frac{\\pi}{4}\\right) = \\cos\\frac{\\pi}{3} = \\frac{1}{2}$."}, {"type": "short", "level": "VDC", "q": "Tìm tất cả giá trị của tham số $m$ để phương trình $2\\sin x + 1 = m$ có nghiệm.", "answer": "$-1 \\le m \\le 3$", "explain": "Phương trình tương đương $\\sin x = \\frac{m-1}{2}$. Phương trình có nghiệm khi và chỉ khi $\\left|\\frac{m-1}{2}\\right| \\le 1$, tức $-2 \\le m - 1 \\le 2$, hay $-1 \\le m \\le 3$."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Chu kì của hàm số $y = \\sin x$ là:", "options": ["A. $2\\pi$", "B. $\\pi$", "C. $\\frac{\\pi}{2}$", "D. $1$"], "answer": "A", "explain": "Ta có $\\sin(x + 2\\pi) = \\sin x$ với mọi $x$, và $2\\pi$ là số dương nhỏ nhất có tính chất này, nên chu kì của $y = \\sin x$ là $2\\pi$."}, {"type": "mcq", "level": "NB", "q": "$\\tan\\left(\\pi + \\frac{\\pi}{6}\\right)$ bằng:", "options": ["A. $\\frac{\\sqrt{3}}{3}$", "B. $-\\frac{\\sqrt{3}}{3}$", "C. $\\sqrt{3}$", "D. $-\\sqrt{3}$"], "answer": "A", "explain": "Vì $\\tan$ tuần hoàn chu kì $\\pi$: $\\tan\\left(\\pi + \\frac{\\pi}{6}\\right) = \\tan\\frac{\\pi}{6} = \\frac{\\sqrt{3}}{3}$."}, {"type": "mcq", "level": "TH", "q": "$\\cos\\left(-\\frac{\\pi}{3}\\right)$ bằng:", "options": ["A. $\\frac{1}{2}$", "B. $-\\frac{1}{2}$", "C. $\\frac{\\sqrt{3}}{2}$", "D. $-\\frac{\\sqrt{3}}{2}$"], "answer": "A", "explain": "Vì $y = \\cos x$ là hàm chẵn: $\\cos\\left(-\\frac{\\pi}{3}\\right) = \\cos\\frac{\\pi}{3} = \\frac{1}{2}$."}, {"type": "mcq", "level": "TH", "q": "Với $\\sin\\alpha \\ne 0$, $1 + \\cot^2\\alpha$ bằng:", "options": ["A. $\\frac{1}{\\sin^2\\alpha}$", "B. $\\frac{1}{\\cos^2\\alpha}$", "C. $\\sin^2\\alpha$", "D. $2$"], "answer": "A", "explain": "Ta có $1 + \\cot^2\\alpha = 1 + \\frac{\\cos^2\\alpha}{\\sin^2\\alpha} = \\frac{\\sin^2\\alpha + \\cos^2\\alpha}{\\sin^2\\alpha} = \\frac{1}{\\sin^2\\alpha}$."}, {"type": "mcq", "level": "VD", "q": "Cho $\\sin a = \\frac{3}{5}$ với $0 \\lt a \\lt \\frac{\\pi}{2}$. Giá trị $\\sin 2a$ bằng:", "options": ["A. $\\frac{24}{25}$", "B. $-\\frac{24}{25}$", "C. $\\frac{7}{25}$", "D. $\\frac{12}{25}$"], "answer": "A", "explain": "Từ hệ thức cơ bản: $\\cos^2 a = 1 - \\frac{9}{25} = \\frac{16}{25}$. Vì $0 \\lt a \\lt \\frac{\\pi}{2}$ nên $\\cos a \\gt 0$, suy ra $\\cos a = \\frac{4}{5}$. Do đó $\\sin 2a = 2\\sin a\\cos a = 2\\cdot\\frac{3}{5}\\cdot\\frac{4}{5} = \\frac{24}{25}$."}, {"type": "mcq", "level": "VDC", "q": "Nghiệm dương nhỏ nhất của phương trình $\\cos x = -\\frac{\\sqrt{2}}{2}$ là:", "options": ["A. $\\frac{3\\pi}{4}$", "B. $\\frac{5\\pi}{4}$", "C. $\\frac{\\pi}{4}$", "D. $\\frac{7\\pi}{4}$"], "answer": "A", "explain": "Ta có $\\cos x = -\\frac{\\sqrt{2}}{2} = \\cos\\frac{3\\pi}{4}$ nên $x = \\pm\\frac{3\\pi}{4} + k2\\pi$. Các nghiệm dương là $\\frac{3\\pi}{4}$, $\\frac{5\\pi}{4}$, $\\frac{11\\pi}{4}$, $\\dots$; nhỏ nhất là $\\frac{3\\pi}{4}$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\sin 2x = 2\\sin x\\cos x$ với mọi $x$.", "b) $\\cos(\\pi - x) = -\\cos x$ với mọi $x$.", "c) $\\tan x\\cot x = 1$ với mọi $x$.", "d) $\\sin\\left(\\frac{\\pi}{2} - x\\right) = \\cos x$ với mọi $x$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: công thức nhân đôi. b) Đúng: góc bù (cos đổi dấu). c) Sai: đẳng thức chỉ đúng khi $\\sin x$ và $\\cos x$ đều khác $0$ (tại $x = \\frac{k\\pi}{2}$ thì một trong hai không xác định). d) Đúng: góc phụ (phụ chéo)."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hàm số $y = \\tan x$ có chu kì $\\pi$.", "b) Hàm số $y = \\cot x$ xác định khi $x \\ne k\\pi$ ($k \\in \\mathbb{Z}$).", "c) Hàm số $y = \\sin x$ nghịch biến trên khoảng $\\left(\\frac{\\pi}{2}; \\frac{3\\pi}{2}\\right)$.", "d) Giá trị nhỏ nhất của hàm số $y = \\cos x$ là $0$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\tan(x + \\pi) = \\tan x$. b) Đúng: $\\cot x$ xác định khi $\\sin x \\ne 0$. c) Đúng: $y = \\sin x$ nghịch biến trên $\\left(\\frac{\\pi}{2} + k2\\pi; \\frac{3\\pi}{2} + k2\\pi\\right)$. d) Sai: giá trị nhỏ nhất của $y = \\cos x$ là $-1$."}, {"type": "short", "level": "VD", "q": "Rút gọn biểu thức $E = \\sin x\\cos x(1 + \\tan x)(1 + \\cot x)$ (với $\\sin x\\cos x \\ne 0$).", "answer": "$1 + \\sin 2x$", "explain": "Ta có $(1 + \\tan x)(1 + \\cot x) = 1 + \\tan x + \\cot x + 1 = 2 + \\frac{\\sin x}{\\cos x} + \\frac{\\cos x}{\\sin x} = 2 + \\frac{\\sin^2 x + \\cos^2 x}{\\sin x\\cos x} = 2 + \\frac{1}{\\sin x\\cos x}$. Nhân với $\\sin x\\cos x$ được $E = 2\\sin x\\cos x + 1 = \\sin 2x + 1$."}, {"type": "short", "level": "VDC", "q": "Tìm tổng các nghiệm của phương trình $\\sin x = \\cos x$ trên đoạn $[0; 2\\pi]$.", "answer": "$\\frac{3\\pi}{2}$", "explain": "Với $\\cos x = 0$ thì $\\sin x = \\pm 1 \\ne 0$ nên không thỏa mãn; chia hai vế cho $\\cos x$ được $\\tan x = 1$, suy ra $x = \\frac{\\pi}{4} + k\\pi$. Trên $[0; 2\\pi]$: với $k = 0$ được $x = \\frac{\\pi}{4}$; với $k = 1$ được $x = \\frac{5\\pi}{4}$; với $k = 2$ thì $x$ vượt quá $2\\pi$. Tổng các nghiệm là $\\frac{\\pi}{4} + \\frac{5\\pi}{4} = \\frac{3\\pi}{2}$."}]}]}
