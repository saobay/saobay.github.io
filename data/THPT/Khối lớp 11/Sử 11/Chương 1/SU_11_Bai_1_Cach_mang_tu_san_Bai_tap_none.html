n": "a, b đúng theo tiền đề chính trị - xã hội. c, d sai: giai cấp tư sản mâu thuẫn với chế độ phong kiến vì bị chèn ép, kìm hãm.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Giai cấp tư sản vừa là giai cấp bóc lột mới, vừa là lực lượng lãnh đạo cách mạng chống phong kiến.", "b) Trong cách mạng tư sản, quần chúng nhân dân là động lực quyết định đưa cách mạng đi đến thắng lợi.", "c) Mâu thuẫn giữa lực lượng sản xuất mới với quan hệ sản xuất phong kiến lỗi thời là nguyên nhân sâu xa của cách mạng tư sản.", "d) Giai cấp tư sản lãnh đạo cách mạng vì mục tiêu giải phóng hoàn toàn quần chúng nhân dân khỏi mọi áp bức."], "answer": ["T", "T", "T", "F"], "explain": "d sai: giai cấp tư sản lãnh đạo cách mạng trước hết vì lợi ích của chính mình, quần chúng vẫn bị bóc lột dưới hình thức mới.", "points": 1}, {"type": "short", "level": "VD", "q": "Lực lượng lãnh đạo cách mạng tư sản là lực lượng nào?", "answer": "Giai cấp tư sản", "explain": "Giai cấp tư sản là lực lượng lãnh đạo cách mạng tư sản.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mâu thuẫn cơ bản trong xã hội phong kiến dẫn tới cách mạng tư sản là mâu thuẫn giữa giai cấp tư sản và quần chúng nhân dân với chế độ nào?", "answer": "Phong kiến", "explain": "Đó là mâu thuẫn giữa giai cấp tư sản và quần chúng nhân dân với chế độ phong kiến.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Phong trào tư tưởng tạo tiền đề cho cách mạng tư sản ở thế kỉ XVIII là:", "options": ["A. Phong trào Cải cách tôn giáo", "B. Chủ nghĩa Mác", "C. Phong trào Khai sáng", "D. Phong trào Phục hưng"], "answer": "C", "explain": "Phong trào Khai sáng thế kỉ XVIII đã chuẩn bị về mặt tư tưởng cho cách mạng tư sản.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả của tác phẩm “Tinh thần pháp luật” là:", "options": ["A. Voltaire", "B. Rousseau", "C. Montesquieu", "D. Diderot"], "answer": "C", "explain": "Montesquieu là tác giả tác phẩm “Tinh thần pháp luật”, đề xướng tư tưởng phân quyền.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả của tác phẩm “Khế ước xã hội” là:", "options": ["A. Locke", "B. Rousseau", "C. Voltaire", "D. Montesquieu"], "answer": "B", "explain": "Rousseau là tác giả tác phẩm “Khế ước xã hội”, đề cao quyền tự do, bình đẳng của con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nội dung cơ bản của phong trào Khai sáng là:", "options": ["A. Phản đối sự phát triển của khoa học", "B. Đề cao lí trí, phê phán chế độ phong kiến chuyên chế, đòi tự do, bình đẳng", "C. Đề cao thần quyền của Giáo hội", "D. Ủng hộ chế độ quân chủ chuyên chế"], "answer": "B", "explain": "Phong trào Khai sáng đề cao lí trí, phê phán chế độ phong kiến chuyên chế, đòi tự do, bình đẳng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tư tưởng của các nhà Khai sáng đã:", "options": ["A. Không ảnh hưởng gì đến cách mạng", "B. Củng cố chế độ phong kiến", "C. Ngăn cản cách mạng tư sản nổ ra", "D. Chuẩn bị về mặt tư tưởng cho cách mạng tư sản"], "answer": "D", "explain": "Tư tưởng Khai sáng trở thành vũ khí tư tưởng của giai cấp tư sản, chuẩn bị về mặt tư tưởng cho cách mạng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tuyên ngôn Nhân quyền và Dân quyền năm 1789 của cách mạng Pháp chịu ảnh hưởng trực tiếp của:", "options": ["A. Tư tưởng Khai sáng về quyền tự do, bình đẳng của con người", "B. Luật La Mã cổ đại", "C. Tư tưởng phong kiến", "D. Kinh thánh"], "answer": "A", "explain": "Tuyên ngôn Nhân quyền và Dân quyền thể hiện tư tưởng Khai sáng về quyền tự do, bình đẳng của con người.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Phong trào Khai sáng diễn ra mạnh mẽ ở thế kỉ XVIII.", "b) Montesquieu là tác giả tác phẩm “Tinh thần pháp luật”.", "c) Rousseau là tác giả tác phẩm “Khế ước xã hội”.", "d) Phong trào Khai sáng ủng hộ chế độ phong kiến chuyên chế."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phong trào Khai sáng phê phán chế độ phong kiến chuyên chế.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Voltaire là một trong những nhà tư tưởng tiêu biểu của phong trào Khai sáng.", "b) Tư tưởng Khai sáng đề cao lí trí và phê phán sự chuyên chế của chế độ phong kiến.", "c) Phong trào Khai sáng chỉ diễn ra ở nước Pháp.", "d) Mọi nhà tư tưởng Khai sáng đều xuất thân từ giai cấp tư sản."], "answer": ["T", "T", "F", "F"], "explain": "c sai: Khai sáng lan rộng ở nhiều nước châu Âu. d sai: nhiều nhà Khai sáng xuất thân từ quý tộc hoặc tầng lớp khác.", "points": 1}, {"type": "short", "level": "VD", "q": "Tác phẩm “Tinh thần pháp luật” là của nhà tư tưởng nào?", "answer": "Montesquieu", "explain": "“Tinh thần pháp luật” là tác phẩm của Montesquieu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhà tư tưởng Khai sáng nào đã đả kích mạnh mẽ chế độ phong kiến chuyên chế và Giáo hội qua các tác phẩm văn học, triết học?", "answer": "Voltaire", "explain": "Voltaire là nhà tư tưởng Khai sáng nổi tiếng với việc đả kích chế độ chuyên chế và Giáo hội.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Tính chất của cách mạng tư sản là:", "options": ["A. Cuộc cách mạng lật đổ chế độ phong kiến, mở đường cho chủ nghĩa tư bản phát triển", "B. Cuộc cải cách tôn giáo", "C. Cuộc cách mạng vô sản", "D. Cuộc khởi nghĩa nông dân"], "answer": "A", "explain": "Cách mạng tư sản có tính chất là cuộc cách mạng lật đổ chế độ phong kiến, mở đường cho chủ nghĩa tư bản phát triển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ý nghĩa lớn nhất của cách mạng tư sản là:", "options": ["A. Mở đường cho chủ nghĩa tư bản phát triển, thúc đẩy lực lượng sản xuất", "B. Khôi phục chế độ phong kiến", "C. Thiết lập chế độ xã hội chủ nghĩa", "D. Xóa bỏ mọi giai cấp trong xã hội"], "answer": "A", "explain": "Ý nghĩa lớn nhất của cách mạng tư sản là mở đường cho chủ nghĩa tư bản phát triển, thúc đẩy lực lượng sản xuất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thắng lợi của cách mạng tư sản đã thúc đẩy yếu tố nào phát triển mạnh mẽ?", "options": ["A. Lực lượng sản xuất", "B. Sự trở lại của chế độ nô lệ", "C. Sự suy thoái kinh tế", "D. Chế độ phong kiến"], "answer": "A", "explain": "Cách mạng tư sản mở đường cho chủ nghĩa tư bản, thúc đẩy lực lượng sản xuất phát triển mạnh mẽ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cách mạng tư sản được đánh giá là có ý nghĩa tiến bộ?", "options": ["A. Vì nó thiết lập xã hội không còn giai cấp", "B. Vì nó do quần chúng nhân dân lãnh đạo", "C. Vì nó thay thế quan hệ sản xuất phong kiến lỗi thời bằng quan hệ sản xuất tư bản chủ nghĩa tiến bộ hơn, thúc đẩy lực lượng sản xuất", "D. Vì nó xóa bỏ hoàn toàn mọi áp bức giai cấp"], "answer": "C", "explain": "Cách mạng tư sản tiến bộ vì thay thế quan hệ sản xuất phong kiến lỗi thời bằng quan hệ sản xuất tư bản chủ nghĩa tiến bộ hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạn chế cơ bản của cách mạng tư sản là:", "options": ["A. Không phát triển được kinh tế", "B. Không có giai cấp lãnh đạo", "C. Chỉ thay thế hình thức bóc lột phong kiến bằng hình thức bóc lột tư bản chủ nghĩa, quần chúng vẫn bị áp bức", "D. Không lật đổ được chế độ phong kiến"], "answer": "C", "explain": "Hạn chế của cách mạng tư sản là chỉ thay thế bóc lột phong kiến bằng bóc lột tư bản chủ nghĩa, quần chúng vẫn bị áp bức.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "So với chế độ phong kiến, chế độ tư bản sau cách mạng tư sản tiến bộ hơn ở điểm nào?", "options": ["A. Không còn phân chia giai cấp", "B. Mọi người đều trở nên giàu có", "C. Xóa bỏ hoàn toàn bóc lột", "D. Giải phóng sức sản xuất, tạo điều kiện cho kinh tế hàng hóa phát triển"], "answer": "D", "explain": "Chế độ tư bản tiến bộ hơn vì giải phóng sức sản xuất, tạo điều kiện cho kinh tế hàng hóa phát triển.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cách mạng tư sản có tính chất là cuộc cách mạng lật đổ chế độ phong kiến.", "b) Cách mạng tư sản mở đường cho chủ nghĩa tư bản phát triển.", "c) Cách mạng tư sản thúc đẩy lực lượng sản xuất phát triển.", "d) Cách mạng tư sản xóa bỏ triệt để mọi hình thức bóc lột trong xã hội."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng theo tính chất và ý nghĩa. d sai: đó chính là hạn chế của cách mạng tư sản.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cách mạng tư sản mang tính chất tiến bộ so với chế độ phong kiến.", "b) Cách mạng tư sản đã giải phóng hoàn toàn quần chúng nhân dân khỏi mọi áp bức, bóc lột.", "c) Thắng lợi của cách mạng tư sản tạo điều kiện cho kinh tế hàng hóa phát triển.", "d) Các cuộc cách mạng tư sản ở mỗi nước có đặc điểm riêng nhưng đều chung mục tiêu lật đổ phong kiến."], "answer": ["T", "F", "T", "T"], "explain": "b sai: quần chúng vẫn bị bóc lột dưới hình thức tư bản chủ nghĩa, đây là hạn chế của cách mạng tư sản.", "points": 1}, {"type": "short", "level": "VD", "q": "Yếu tố nào được thúc đẩy phát triển mạnh mẽ sau thắng lợi của cách mạng tư sản?", "answer": "Lực lượng sản xuất", "explain": "Cách mạng tư sản thúc đẩy lực lượng sản xuất phát triển mạnh mẽ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hạn chế cơ bản của cách mạng tư sản là chỉ thay thế bóc lột phong kiến bằng bóc lột mang tính chất nào?", "answer": "Tư bản chủ nghĩa", "explain": "Cách mạng tư sản chỉ thay thế bóc lột phong kiến bằng bóc lột tư bản chủ nghĩa.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Cuộc cách mạng tư sản Hà Lan diễn ra trong khoảng thời gian:", "options": ["A. 1789 - 1799", "B. 1775 - 1783", "C. 1566 - 1648", "D. 1640 - 1688"], "answer": "C", "explain": "Cách mạng tư sản ống ách thống trị của Tây Ban Nha", "C. Không có giai cấp tư sản tham gia", "D. Không lật đổ được tàn dư phong kiến"], "answer": "B", "explain": "Nét đặc thù của cách mạng Hà Lan là gắn với đấu tranh giành độc lập dân tộc, còn cách mạng Anh, Pháp lật đổ quân chủ chuyên chế trong nước.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cách mạng tư sản Hà Lan diễn ra từ năm 1566 đến năm 1648.", "b) Hà Lan đấu tranh giành độc lập khỏi ách thống trị của Tây Ban Nha.", "c) Cách mạng tư sản Hà Lan do giai cấp công nhân lãnh đạo.", "d) Thắng lợi của cách mạng giúp Hà Lan mở đường cho chủ nghĩa tư bản phát triển."], "answer": ["T", "T", "F", "T"], "explain": "c sai: cách mạng tư sản Hà Lan do giai cấp tư sản lãnh đạo.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cách mạng Hà Lan là một trong những cuộc cách mạng tư sản diễn ra sớm nhất, có ý nghĩa lịch sử quan trọng.", "b) Sau cách mạng, Hà Lan trở thành một trong những trung tâm kinh tế tư bản chủ nghĩa ở châu Âu.", "c) Cách mạng Hà Lan hoàn toàn không có sự tham gia của quần chúng nhân dân.", "d) Tính chất dân tộc là nét đặc thù của cách mạng tư sản Hà Lan."], "answer": ["T", "T", "F", "T"], "explain": "c sai: quần chúng nhân dân là động lực quan trọng của cách mạng Hà Lan.", "points": 1}, {"type": "short", "level": "VD", "q": "Cách mạng tư sản Hà Lan giành độc lập khỏi ách thống trị của nước nào?", "answer": "Tây Ban Nha", "explain": "Hà Lan giành độc lập khỏi ách thống trị của Tây Ban Nha.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cách mạng tư sản Hà Lan bắt đầu vào năm nào?", "answer": "1566", "explain": "Cách mạng tư sản Hà Lan bắt đầu năm 1566.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Cách mạng tư sản Anh diễn ra trong khoảng thời gian:", "options": ["A. 1789 - 1799", "B. 1775 - 1783", "C. 1 ) Năm 1799, Napoléon đảo chính, chấm dứt thời kì cách mạng Pháp.", "d) Cách mạng tư sản Pháp không có ảnh hưởng gì đến châu Âu và thế giới."], "answer": ["T", "T", "T", "F"], "explain": "d sai: cách mạng Pháp có ảnh hưởng sâu rộng, cổ vũ phong trào chống phong kiến ở châu Âu và thế giới.", "points": 1}, {"type": "short", "level": "VD", "q": "Ngục Bastille bị nhân dân Paris phá vào ngày tháng năm nào?", "answer": "14/7/1789", "explain": "Ngày 14/7/1789, nhân dân Paris phá ngục Bastille.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Người đứng đầu thời kì chuyên chính Giacôbanh ở Pháp là ai?", "answer": "Robespierre", "explain": "Robespierre đứng đầu thời kì chuyên chính Giacôbanh (1793 - 1794).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các cuộc cách mạng tư sản tiêu biểu, cuộc nào có thời gian diễn ra dài nhất?", "options": ["A. Anh (1640 - 1688)", "B. Bắc Mỹ (1775 - 1783)", "C. Hà Lan (1566 - 1648)", "D. Pháp (1789 - 1799)"], "answer": "C", "explain": "Cách mạng Hà Lan kéo dài 82 năm (1566 - 1648), dài nhất trong 4 cuộc tiêu biểu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc cách mạng tư sản nào được gọi là “Cách mạng Vinh quang”?", "options": ["A. Hà Lan năm 1648", "B. Bắc Mỹ năm 1776", "C. Pháp năm 1789", "D. Anh năm 1688"], "answer": "D", "explain": "“Cách mạng Vinh quang” là tên gọi sự kiện năm 1688 ở Anh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác phẩm “Khế ước xã hội” gắn với tên tuổi của nhà tư tưởng nào?", "options": ["A. Diderot", "B. Voltaire", "C. Montesquieu", "D. Rousseau"], "answer": "D", "explain": "Rousseau là tác giả tác phẩm “Khế ước xã hội”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của 4 cuộc cách mạng tư sản tiêu biểu (Hà Lan, Anh, Bắc Mỹ, Pháp) là:", "options": ["A. Đều diễn ra ở châu Á", "B. Đều thất bại", "C. Đều do giai cấp công nhân lãnh đạo", "D. Đều do giai cấp tư sản lãnh đạo, lật đổ chế độ phong kiến hoặc ách thống trị thực dân, mở đường cho chủ nghĩa tư bản"], "answer": "D", "explain": "Điểm chung: đều do giai cấp tư sản lãnh đạo, lật đổ phong kiến hoặc ách thống trị, mở đường cho chủ nghĩa tư bản phát triển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiền đề tư tưởng của các cuộc cách mạng tư sản thế kỉ XVII - XVIII là:", "options": ["A. Phong trào Khai sáng", "B. Thần học trung cổ", "C. Chủ nghĩa xã hội", "D. Tư tưởng phong kiến"], "answer": "A", "explain": "Phong trào Khai sáng là tiền đề tư tưởng của các cuộc cách mạng tư sản.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sắp xếp các sự kiện sau theo đúng trình tự thời gian: (1) Phá ngục Bastille; (2) Tuyên ngôn Độc lập của Mỹ; (3) “Cách mạng Vinh quang” ở Anh; (4) Hà Lan giành độc lập.", "options": ["A. (3) - (4) - (1) - (2)", "B. (2) - (1) - (4) - (3)", "C. (4) - (3) - (2) - (1)", "D. (1) - (2) - (3) - (4)"], "answer": "C", "explain": "Thứ tự đúng: Hà Lan (1648), “Cách mạng Vinh quang” (1688), Tuyên ngôn Độc lập Mỹ (1776), phá ngục Bastille (1789).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cách mạng tư sản Hà Lan (1566 - 1648) là cuộc cách mạng tư sản diễn ra sớm nhất trong 4 cuộc tiêu biểu.", "b) Cách mạng tư sản Anh kết thúc với “Cách mạng Vinh quang” năm 1688.", "c) Cách mạng Bắc Mỹ (1775 - 1783) gắn với cuộc chiến tranh giành độc lập khỏi thực dân Anh.", "d) Cách mạng Pháp (1789 - 1799) là cuộc cách mạng tư sản triệt để nhất."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 nhận định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cả 4 cuộc cách mạng tư sản tiêu biểu đều mở đường cho chủ nghĩa tư bản phát triển ở nước mình.", "b) Cách mạng Hà Lan và Bắc Mỹ đều gắn với đấu tranh giành độc lập dân tộc.", "c) Cách mạng Anh và Pháp đều trải qua giai đoạn tồn tại nền cộng hòa.", "d) Tất cả các cuộc cách mạng tư sản đều xóa bỏ triệt để mọi áp bức giai cấp."], "answer": ["T", "T", "T", "F"], "explain": "d sai: quần chúng vẫn bị bóc lột dưới hình thức tư bản chủ nghĩa, đây là hạn chế chung.", "points": 1}, {"type": "short", "level": "VD", "q": "Cuộc cách mạng tư sản diễn ra trong khoảng 1640 - 1688 là cuộc cách mạng của nước nào?", "answer": "Anh", "explain": "Cách mạng tư sản Anh diễn ra từ năm 1640 đến năm 1688.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong 4 cuộc cách mạng tư sản tiêu biểu, cuộc nào được đánh giá là triệt để nhất?", "answer": "Pháp", "explain": "Cách mạng tư sản Pháp được đánh giá là cuộc cách mạng tư sản triệt để nhất.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nhà tư tưởng nào là tác giả của tác phẩm “Tinh thần pháp luật”?", "options": ["A. Locke", "B. Montesquieu", "C. Voltaire", "D. Rousseau"], "answer": "B", "explain": "Montesquieu là tác giả tác phẩm “Tinh thần pháp luật”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năm 1792 ở Pháp diễn ra sự kiện:", "options": ["A. Nền cộng hòa được thành lập", "B. Phá ngục Bastille", "C. Tuyên ngôn Nhân quyền và Dân quyền được công bố", "D. Napoléon đảo chính"], "answer": "A", "explain": "Năm 1792, nền cộng hòa được thành lập ở Pháp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năm 1799 ở Pháp diễn ra sự kiện:", "options": ["A. Nền cộng hòa được thành lập", "B. Napoléon đảo chính", "C. Thời kì chuyên chính Giacôbanh", "D. Phá ngục Bastille"], "answer": "B", "explain": "Năm 1799, Napoléon đảo chính, lên nắm quyền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa quốc tế của cách mạng tư sản Pháp là:", "options": ["A. Không có ảnh hưởng gì đến thế giới", "B. Cổ vũ phong trào đấu tranh chống chế độ phong kiến ở châu Âu và thế giới", "C. Củng cố chế độ phong kiến ở châu Âu", "D. Ngăn cản cách mạng ở các nước khác"], "answer": "B", "explain": "Cách mạng Pháp cổ vũ phong trào đấu tranh chống phong kiến ở châu Âu và thế giới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giai cấp lãnh đạo cách mạng tư sản Pháp là:", "options": ["A. Tầng lớp tăng lữ", "B. Giai cấp nông dân", "C. Giai cấp công nhân", "D. Giai cấp tư sản"], "answer": "D", "explain": "Cách mạng tư sản Pháp do giai cấp tư sản lãnh đạo.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhận định nào sau đây đúng về tính chất của cách mạng tư sản?", "options": ["A. Là cuộc cải cách tôn giáo", "B. Là cuộc cách mạng lật đổ chế độ phong kiến, xác lập và mở đường cho chủ nghĩa tư bản phát triển", "C. Là cuộc khởi nghĩa nông dân thuần túy", "D. Là cuộc cách mạng vô sản"], "answer": "B", "explain": "Tính chất của cách mạng tư sản là lật đổ chế độ phong kiến, mở đường cho chủ nghĩa tư bản phát triển.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Phong trào Khai sáng thế kỉ XVIII đã chuẩn bị về mặt tư tưởng cho cách mạng tư sản.", "b) Voltaire là nhà tư tưởng tiêu biểu của phong trào Khai sáng.", "c) Tư tưởng Khai sáng đề cao lí trí, phê phán chế độ phong kiến chuyên chế.", "d) Montesquieu là tác giả của tác phẩm “Khế ước xã hội”."], "answer": ["T", "T", "T", "F"], "explain": "d sai: “Khế ước xã hội” là tác phẩm của Rousseau, còn Montesquieu là tác giả “Tinh thần pháp luật”.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cách mạng tư sản có ý nghĩa tiến bộ vì đã thay thế quan hệ sản xuất phong kiến lỗi thời.", "b) Hạn chế của cách mạng tư sản là quần chúng nhân dân vẫn bị bóc lột dưới hình thức mới.", "c) Mọi cuộc cách mạng tư sản trong lịch sử đều giành thắng lợi hoàn toàn.", "d) Nghiên cứu cách mạng tư sản giúp hiểu rõ quá trình ra đời và phát triển của chủ nghĩa tư bản."], "answer": ["T", "T", "F", "T"], "explain": "c sai: không phải mọi cuộc cách mạng tư sản đều thắng lợi hoàn toàn.", "points": 1}, {"type": "short", "level": "VD", "q": "Thời kì chuyên chính Giacôbanh ở Pháp diễn ra trong khoảng thời gian nào?", "answer": "1793-1794", "explain": "Thời kì chuyên chính Giacôbanh diễn ra từ năm 1793 đến năm 1794.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cuộc đảo chính của Napoléon năm 1799 đã chấm dứt cách mạng tư sản ở nước nào?", "answer": "Pháp", "explain": "Năm 1799, Napoléon đảo chính, chấm dứt cách mạng tư sản Pháp.", "points": 0.5}]}]}
