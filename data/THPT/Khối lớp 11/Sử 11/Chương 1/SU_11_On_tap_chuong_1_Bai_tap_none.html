s": 0.5}, {"type": "short", "level": "VDC", "q": "Tác phẩm “Khế ước xã hội” đề cao quyền tự do, bình đẳng của con người là của nhà tư tưởng nào?", "answer": "Rousseau", "explain": "“Khế ước xã hội” là tác phẩm của Rousseau.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Tính chất tiến bộ của cách mạng tư sản thể hiện ở việc:", "options": ["A. Thiết lập xã hội không còn bóc lột", "B. Xóa bỏ mọi giai cấp", "C. Thay thế quan hệ sản xuất phong kiến lỗi thời bằng quan hệ sản xuất tư bản chủ nghĩa tiến bộ hơn", "D. Khôi phục chế độ phong kiến"], "answer": "C", "explain": "Tính chất tiến bộ: thay quan hệ sản xuất phong kiến lỗi thời bằng quan hệ sản xuất tư bản chủ nghĩa tiến bộ hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ý nghĩa về kinh tế của cách mạng tư sản là:", "options": ["A. Thúc đẩy lực lượng sản xuất phát triển", "B. Kìm hãm lực lượng sản xuất", "C. Xóa bỏ thương nghiệp", "D. Quay lại kinh tế tự cấp"], "answer": "A", "explain": "Cách mạng tư sản thúc đẩy lực lượng sản xuất phát triển mạnh mẽ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hạn chế lớn nhất của cách mạng tư sản là:", "options": ["A. Không lật đổ được phong kiến", "B. Không phát triển kinh tế", "C. Không có giai cấp lãnh đạo", "D. Quần chúng nhân dân vẫn bị áp bức, bóc lột dưới hình thức tư bản chủ nghĩa"], "answer": "D", "explain": "Hạn chế: chỉ thay bóc lột phong kiến bằng bóc lột tư bản chủ nghĩa, quần chúng vẫn bị áp bức.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói cách mạng tư sản là bước tiến lớn trong lịch sử nhân loại dù còn hạn chế?", "options": ["A. Vì nó đập tan xiềng xích phong kiến, giải phóng sức sản xuất, mở ra thời đại mới cho nhân loại", "B. Vì nó xóa bỏ hoàn toàn áp bức", "C. Vì nó thiết lập xã hội công bằng tuyệt đối", "D. Vì nó do nhân dân lãnh đạo"], "answer": "A", "explain": "Cách mạng tư sản đập tan xiềng xích phong kiến, giải phóng sức sản xuất, mở ra thời đại mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài học rút ra từ hạn chế của cách mạng tư sản là:", "options": ["A. Muốn giải phóng triệt để quần chúng cần cuộc cách mạng triệt để hơn do giai cấp tiên tiến lãnh đạo", "B. Không nên làm cách mạng", "C. Chỉ giai cấp tư sản mới làm cách mạng được", "D. Phong kiến là chế độ tốt nhất"], "answer": "A", "explain": "Hạn chế của cách mạng tư sản cho thấy cần cuộc cách mạng triệt để hơn để giải phóng quần chúng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "So sánh ý nghĩa của cách mạng tư sản với các cuộc khởi nghĩa nông dân chống phong kiến, điểm khác biệt cơ bản là:", "options": ["A. Khởi nghĩa nông dân cũng mở đường cho chủ nghĩa tư bản", "B. Cách mạng tư sản do tư sản lãnh đạo nên thắng lợi dẫn tới thay đổi phương thức sản xuất, mở đường cho chủ nghĩa tư bản", "C. Không có điểm khác biệt", "D. Khởi nghĩa nông dân triệt để hơn"], "answer": "B", "explain": "Khác biệt cơ bản: cách mạng tư sản thay đổi phương thức sản xuất, mở đường cho chủ nghĩa tư bản phát triển.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cách mạng tư sản có ý nghĩa tiến bộ trong lịch sử.", "b) Cách mạng tư sản thúc đẩy lực lượng sản xuất phát triển.", "c) Cách mạng tư sản cổ vũ phong trào chống phong kiến ở nhiều nước.", "d) Cách mạng tư sản đã xóa bỏ triệt để mọi áp bức, bóc lột."], "answer": ["T", "T", "T", "F"], "explain": "d sai: đó là hạn chế của cách mạng tư sản, quần chúng vẫn bị bóc lột.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Tính hai mặt của cách mạng tư sản: tiến bộ so với phong kiến nhưng còn hạn chế với quần chúng.", "b) Ý nghĩa lớn nhất của cách mạng tư sản là mở đường cho chủ nghĩa tư bản phát triển.", "c) Mọi cuộc cách mạng tư sản đều mang lại ruộng đất cho nông dân.", "d) Đánh giá cách mạng tư sản cần đặt trong bối cảnh lịch sử cụ thể."], "answer": ["T", "T", "F", "T"], "explain": "c sai: không phải cuộc cách mạng tư sản nào cũng giải quyết vấn đề ruộng đất cho nông dân.", "points": 1}, {"type": "short", "level": "VD", "q": "Ý nghĩa lớn nhất của cách mạng tư sản là mở đường cho chế độ nào phát triển?", "answer": "Chủ nghĩa tư bản", "explain": "Cách mạng tư sản mở đường cho chủ nghĩa tư bản phát triển.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "So với chế độ phong kiến, cách mạng tư sản tiến bộ nhưng vẫn còn hạn chế vì chỉ thay thế hình thức bóc lột cũ bằng hình thức bóc lột mới của giai cấp nào?", "answer": "Tư sản", "explain": "Cách mạng tư sản chỉ thay bóc lột phong kiến bằng bóc lột của giai cấp tư sản.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Cách mạng tư sản Hà Lan gắn với cuộc chiến tranh giành độc lập khỏi:", "options": ["A. Tây Ban Nha", "B. Bồ Đào Nha", "C. Pháp", "D. Anh"], "answer": "A", "explain": "Hà Lan giành độc lập khỏi ách thống trị của Tây Ban Nha.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Cách mạng Vinh quang” (1688) là sự kiện của cách mạng tư sản nước nào?", "options": ["A. Pháp", "B. Anh", "C. Bắc Mỹ", "D. Hà Lan"], "answer": "B", "explain": "“Cách mạng Vinh quang” năm 1688 là sự kiện của cách mạng tư sản Anh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân vật Cromwell gắn với cách mạng tư sản nước nào?", "options": ["A. Hà Lan", "B. Anh", "C. Bắc Mỹ", "D. Pháp"], "answer": "B", "explain": "Cromwell là nhân vật tiêu biểu của cách mạng tư sản Anh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm giống nhau giữa cách mạng tư sản Hà Lan và cách mạng tư sản Anh là:", "options": ["A. Đều gắn với chiến tranh giành độc lập dân tộc", "B. Đều do giai cấp tư sản lãnh đạo, lật đổ chế độ phong kiến, mở đường cho chủ nghĩa tư bản", "C. Đều do giai cấp công nhân lãnh đạo", "D. Đều diễn ra ở thế kỉ XVI"], "answer": "B", "explain": "Điểm chung: đều do giai cấp tư sản lãnh đạo, lật đổ phong kiến, mở đường cho chủ nghĩa tư bản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa cách mạng Hà Lan và cách mạng Anh là:", "options": ["A. Hà Lan thất bại, Anh thắng lợi", "B. Hà Lan do tư sản lãnh đạo, Anh do công nhân lãnh đạo", "C. Hà Lan gắn với đấu tranh giành độc lập dân tộc khỏi Tây Ban Nha, còn Anh lật đổ chế độ quân chủ chuyên chế trong nước", "D. Hà Lan ở châu Á, Anh ở châu Âu"], "answer": "C", "explain": "Hà Lan gắn với giành độc lập dân tộc, Anh lật đổ quân chủ chuyên chế trong nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao nói “Cách mạng Vinh quang” năm 1688 là sự thỏa hiệp giữa giai cấp tư sản với quý tộc phong kiến?", "options": ["A. Vì Quốc hội phế truất James II rồi mời William xứ Orange lên ngôi, chế độ quân chủ được giữ lại dưới hình thức quân chủ lập hiến", "B. Vì vua bị xử tử", "C. Vì nền cộng hòa được thành lập", "D. Vì nhân dân không tham gia"], "answer": "A", "explain": "Quân chủ được giữ lại dưới hình thức quân chủ lập hiến, thể hiện sự thỏa hiệp giữa tư sản và quý tộc.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cách mạng Hà Lan (1566 - 1648) diễn ra sớm hơn cách mạng Anh (1640 - 1688).", "b) Cách mạng Anh trải qua các bước: nội chiến, cộng hòa, phục hưng quân chủ, quân chủ lập hiến.", "c) Cromwell là nhân vật tiêu biểu của cách mạng tư sản Anh.", "d) Sau “Cách mạng Vinh quang”, Anh xác lập chế độ cộng hòa."], "answer": ["T", "T", "T", "F"], "explain": "d sai: sau “Cách mạng Vinh quang”, Anh xác lập chế độ quân chủ lập hiến.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cả cách mạng Hà Lan và Anh đều mở đường cho chủ nghĩa tư bản phát triển.", "b) Cách mạng Anh triệt để hơn cách mạng Hà Lan vì đã xử tử vua Charles I.", "c) “Cách mạng Vinh quang” cho thấy giai cấp tư sản Anh có sự thỏa hiệp với quý tộc phong kiến.", "d) Cách mạng Hà Lan và Anh đều không có sự tham gia của quần chúng nhân dân."], "answer": ["T", "T", "T", "F"], "explain": "d sai: quần chúng là động lực quan trọng của cả hai cuộc cách mạng.", "points": 1}, {"type": "short", "level": "VD", "q": "Chế độ chính trị được xác lập ở Anh sau “Cách mạng Vinh quang” năm 1688 là chế độ nào?", "answer": "Quân chủ lập hiến", "explain": "Sau “Cách mạng Vinh quang”, Anh xác lập chế độ quân chủ lập hiến.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vua Anh bị Quốc hội xử tử năm 1649 là vua nào?", "answer": "Charles I", "explain": "Vua Charles I bị xử tử năm 1649.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Ngày 4/7/1776 gắn với sự kiện nào của cách mạng Bắc Mỹ?", "options": ["A. Chiến tranh kết thúc", "B. Hiến pháp được ban hành", "C. Tuyên ngôn Độc lập được công bố", "D. Washington lên làm tổng thống"], "answer": "C", "explain": "Ngày 4/7/1776, Tuyên ngôn Độc lập của Mỹ được công bố.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày 14/7/1789 gắn với sự kiện nào của cách mạng Pháp?", "options": ["A. Tuyên ngôn Nhân quyền và Dân quyền", "B. Nền cộng hòa thành lập", "C. Napoléon đảo chính", "D. Nhân dân Paris phá ngục Bastille"], "answer": "D", "explain": "Ngày 14/7/1789, nhân dân Paris phá ngục Bastille.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân vật Washington gắn với cách mạng tư sản nào?", "options": ["A. Pháp", "B. Bắc Mỹ", "C. Hà Lan", "D. Anh"], "answer": "B", "explain": "Washington là nhân vật tiêu biểu của cách mạng Bắc Mỹ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm giống nhau giữa cách mạng Bắc Mỹ và cách mạng Pháp là:", "options": ["A. Đều thất bại", "B. Đều do giai cấp công nhân lãnh đạo", "C. Đều lật đổ quân chủ chuyên chế trong nước", "D. Đều do giai cấp tư sản lãnh đạo, có bản tuyên ngôn khẳng định quyền con người, mở đường cho chủ nghĩa tư bản"], "answer": "D", "explain": "Điểm chung: do tư sản lãnh đạo, có tuyên ngôn về quyền con người, mở đường cho chủ nghĩa tư bản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cách mạng Pháp được đánh giá triệt để hơn cách mạng Bắc Mỹ?", "options": ["A. Vì Pháp thắng nhanh hơn", "B. Vì Mỹ không có tuyên ngôn", "C. Vì Pháp không có lãnh đạo", "D. Vì cách mạng Pháp lật đổ triệt để chế độ phong kiến, giải quyết ruộng đất cho nông dân, còn cách mạng Mỹ vẫn duy trì chế độ nô lệ"], "answer": "D", "explain": "Cách mạng Pháp triệt để hơn vì lật đổ triệt để phong kiến và giải quyết ruộng đất, còn Mỹ vẫn duy trì nô lệ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai bản Tuyên ngôn Độc lập của Mỹ (1776) và Tuyên ngôn Nhân quyền và Dân quyền của Pháp (1789) đều:", "options": ["A. Phản đối cách mạng", "B. Do cùng một người soạn thảo", "C. Chỉ áp dụng cho giai cấp tư sản", "D. Khẳng định các quyền tự do, bình đẳng của con người, chịu ảnh hưởng của tư tưởng Khai sáng"], "answer": "D", "explain": "Cả hai bản tuyên ngôn đều khẳng định quyền con người, thấm nhuần tư tưởng Khai sáng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cách mạng Bắc Mỹ (1775 - 1783) gắn với chiến tranh giành độc lập khỏi thực dân Anh.", "b) Cách mạng Pháp (1789 - 1799) lật đổ chế độ quân chủ chuyên chế.", "c) Washington là nhân vật tiêu biểu của cách mạng Bắc Mỹ.", "d) Robespierre là người đứng đầu thời kì chuyên chính Giacôbanh ở Pháp."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 nhận định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Cách mạng Pháp triệt để hơn cách mạng Bắc Mỹ vì đã giải quyết vấn đề ruộng đất cho nông dân.", "b) Hạn chế chung của cách mạng Bắc Mỹ và Pháp là quần chúng vẫn bị bóc lột.", "c) Cách mạng Bắc Mỹ và Pháp đều có ảnh hưởng quốc tế sâu rộng.", "d) Cách mạng Bắc Mỹ do giai cấp phong kiến lãnh đạo."], "answer": ["T", "T", "T", "F"], "explain": "d sai: cách mạng Bắc Mỹ do giai cấp tư sản lãnh đạo.", "points": 1}, {"type": "short", "level": "VD", "q": "Bản tuyên ngôn khẳng định quyền sống, quyền tự do và quyền mưu cầu hạnh phúc, công bố ngày 4/7/1776 là tuyên ngôn nào?", "answer": "Tuyên ngôn Độc lập", "explain": "Đó là Tuyên ngôn Độc lập của Mỹ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Bản tuyên ngôn công bố ngày 26/8/1789, khẳng định quyền tự do, bình đẳng của con người trong cách mạng Pháp là tuyên ngôn nào?", "answer": "Tuyên ngôn Nhân quyền và Dân quyền", "explain": "Đó là Tuyên ngôn Nhân quyền và Dân quyền.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong 4 cuộc cách mạng tư sản tiêu biểu, cuộc diễn ra muộn nhất là:", "options": ["A. Bắc Mỹ", "B. Hà Lan", "C. Pháp", "D. Anh"], "answer": "C", "explain": "Cách mạng Pháp (1789 - 1799) diễn ra muộn nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc cách mạng tư sản nào gắn với tên tuổi của Napoléon?", "options": ["A. Bắc Mỹ", "B. Hà Lan", "C. Pháp", "D. Anh"], "answer": "C", "explain": "Năm 1799, Napoléon đảo chính, chấm dứt cách mạng tư sản Pháp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc cách mạng tư sản nào thành lập Hợp chúng quốc Mỹ?", "options": ["A. Bắc Mỹ", "B. Pháp", "C. Anh", "D. Hà Lan"], "answer": "A", "explain": "Cách mạng Bắc Mỹ thành lập Hợp chúng quốc Mỹ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiêu chí nào sau đây KHÔNG dùng để so sánh các cuộc cách mạng tư sản?", "options": ["A. Lực lượng lãnh đạo", "B. Màu sắc quốc kì của các nước", "C. Kết quả và ý nghĩa", "D. Thời gian"], "answer": "B", "explain": "So sánh các cuộc cách mạng dựa trên thời gian, lãnh đạo, kết quả, ý nghĩa; màu cờ không phải tiêu chí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung về lực lượng lãnh đạo của 4 cuộc cách mạng tư sản tiêu biểu là:", "options": ["A. Đều do nông dân lãnh đạo", "B. Đều do giai cấp tư sản lãnh đạo", "C. Đều do vua chúa tiến bộ lãnh đạo", "D  sản xuất phong kiến lỗi thời.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Động lực chủ yếu của cách mạng tư sản là:", "options": ["A. Quần chúng nhân dân", "B. Tầng lớp tăng lữ", "C. Vua chúa tiến bộ", "D. Giai cấp địa chủ"], "answer": "A", "explain": "Quần chúng nhân dân là động lực chủ yếu của cách mạng tư sản.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lực lượng lãnh đạo cách mạng tư sản là:", "options": ["A. Tầng lớp trí thức", "B. Giai cấp tư sản", "C. Giai cấp công nhân", "D. Giai cấp nông dân"], "answer": "B", "explain": "Giai cấp tư sản là lực lượng lãnh đạo cách mạng tư sản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao quần chúng nhân dân hăng hái tham gia cách mạng tư sản dù do tư sản lãnh đạo?", "options": ["A. Vì họ cũng bị chế độ phong kiến áp bức, bóc lột và mong muốn lật đổ ách áp bức", "B. Vì bị ép buộc", "C. Vì muốn bảo vệ phong kiến", "D. Vì được trả tiền"], "answer": "A", "explain": "Quần chúng cũng bị phong kiến áp bức nên hăng hái tham gia lật đổ ách áp bức.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kết quả chung của các cuộc cách mạng tư sản thắng lợi là:", "options": ["A. Kinh tế suy thoái", "B. Chế độ phong kiến bị lật đổ, mở đường cho chủ nghĩa tư bản phát triển", "C. Xã hội quay lại chế độ nô lệ", "D. Chế độ phong kiến được củng cố"], "answer": "B", "explain": "Kết quả chung: lật đổ phong kiến, mở đường cho chủ nghĩa tư bản phát triển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Từ các cuộc cách mạng tư sản, em rút ra bài học nào cho công cuộc xây dựng đất nước hiện nay?", "options": ["A. Không cần quan tâm đến quần chúng", "B. Phải phát triển lực lượng sản xuất, quan hệ sản xuất phải phù hợp với trình độ của lực lượng sản xuất", "C. Nên duy trì quan hệ sản xuất lỗi thời", "D. Không cần phát triển lực lượng sản xuất"], "answer": "B", "explain": "Bài học: quan hệ sản xuất phải phù hợp với trình độ phát triển của lực lượng sản xuất.", "points": 0.25}, {"type": "truefalse", q", "level": "NB", "q": "Có bao nhiêu cuộc cách mạng tư sản tiêu biểu được học trong chương 1?", "options": ["A. 5", "B. 3", "C. 4", "D. 2"], "answer": "C", "explain": "4 cuộc tiêu biểu: Hà Lan, Anh, Bắc Mỹ, Pháp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc cách mạng tư sản đầu tiên trong 4 cuộc tiêu biểu là:", "options": ["A. Bắc Mỹ", "B. Pháp", "C. Anh", "D. Hà Lan"], "answer": "D", "explain": "Cách mạng Hà Lan (1566 - 1648) diễn ra sớm nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nội dung nào sau đây KHÔNG thuộc chương 1?", "options": ["A. Các tiền đề của cách mạng tư sản", "B. Khái niệm cách mạng tư sản", "C. Cách mạng xã hội chủ nghĩa Tháng Mười Nga", "D. Các cuộc cách mạng tư sản tiêu biểu"], "answer": "C", "explain": "Cách mạng Tháng Mười Nga không thuộc chương 1 về cách mạng tư sản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sợi chỉ đỏ xuyên suốt chương 1 là:", "options": ["A. Niên biểu các trận đánh", "B. Quá trình ra đời, tiền đề, tính chất, ý nghĩa và các cuộc cách mạng tư sản tiêu biểu mở đường cho chủ nghĩa tư bản", "C. Tiểu sử các nhân vật", "D. Lịch sử các triều đại phong kiến"], "answer": "B", "explain": "Chương 1 trình bày khái niệm, tiền đề, tính chất, ý nghĩa và các cuộc cách mạng tư sản tiêu biểu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Em hãy chọn nhận định đúng nhất về chương 1:", "options": ["A. Chương 1 không có ý nghĩa thực tiễn", "B. Chương 1 giúp hiểu vì sao chủ nghĩa tư bản ra đời và thay thế chế độ phong kiến, qua đó hiểu sâu hơn về tiến trình lịch sử nhân loại", "C. Các cuộc cách mạng tư sản không liên quan đến nhau", "D. Chương 1 chỉ nói về cách mạng Pháp"], "answer": "B", "explain": "Chương 1 giúp hiểu quá trình chủ nghĩa tư bản ra đời, thay thế phong kiến.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Chương 1 gồm bài về những vấn đề chung của cách mạng tư sản và bài ôn tập.", "b) 4 cuộc cách mạng tư sản tiêu biểu là: Hà Lan, Anh, Bắc Mỹ, Pháp.", "c) Phong trào Khai sáng là tiền đề tư tưởng của cách mạng tư sản.", "d) Cách mạng tư sản mở đường cho chủ nghĩa tư bản phát triển."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 nhận định đều đúng, bao quát nội dung chương 1.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xác định các nhận định sau Đúng (T) hay Sai (F):", "statements": ["a) Học chương 1 giúp nhận thức đúng về vai trò của giai cấp tư sản trong lịch sử.", "b) Học chương 1 giúp thấy rõ quần chúng nhân dân là động lực của cách mạng.", "c) Kiến thức chương 1 là cơ sở để học các chương tiếp theo về chủ nghĩa tư bản.", "d) Chương 1 chứng minh chế độ phong kiến là chế độ tiến bộ nhất trong lịch sử."], "answer": ["T", "T", "T", "F"], "explain": "d sai: chương 1 chứng minh chế độ phong kiến là lỗi thời, cần được thay thế.", "points": 1}, {"type": "short", "level": "VD", "q": "Kể tên một cuộc cách mạng tư sản gắn với đấu tranh giành độc lập dân tộc.", "answer": "Hà Lan", "explain": "Hà Lan (hoặc Bắc Mỹ) gắn với đấu tranh giành độc lập dân tộc.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cuộc cách mạng tư sản nào được đánh giá là triệt để nhất thời cận đại?", "answer": "Pháp", "explain": "Cách mạng tư sản Pháp là cuộc cách mạng tư sản triệt để nhất.", "points": 0.5}]}]}
