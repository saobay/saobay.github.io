Đề 9","questions":[{"type":"mcq","level":"NB","q":"Nước nào ở Đông Nam Á có cuộc kháng chiến chống Mỹ lâu nhất?","options":["A. Việt Nam","B. Lào","C. Cam-pu-chia","D. Thái Lan"],"answer":"A","explain":"Việt Nam kháng chiến chống Mỹ 21 năm (1954 - 1975).","points":0.25},{"type":"mcq","level":"NB","q":"Chế độ diệt chủng ở Cam-pu-chia có tên là gì?","options":["A. Khmer Đỏ","B. Khmer Xanh","C. Khmer Vàng","D. Khmer Trắng"],"answer":"A","explain":"Chế độ diệt chủng Khmer Đỏ (1975 - 1979).","points":0.25},{"type":"mcq","level":"NB","q":"Ngày 7/1/1979 là ngày gì của Cam-pu-chia?","options":["A. Ngày lật đổ Khmer Đỏ, hồi sinh đất nước","B. Ngày độc lập","C. Ngày gia nhập ASEAN","D. Ngày quốc khánh"],"answer":"A","explain":"7/1/1979: lật đổ chế độ diệt chủng.","points":0.25},{"type":"mcq","level":"TH","q":"Vai trò của Việt Nam với Cam-pu-chia năm 1979 là gì?","options":["A. Giúp nhân dân Cam-pu-chia lật đổ diệt chủng","B. Xâm lược","C. Không giúp","D. Ủng hộ Khmer Đỏ"],"answer":"A","explain":"Quân tình nguyện Việt Nam giúp Cam-pu-chia - hành động chính nghĩa.","points":0.25},{"type":"mcq","level":"TH","q":"Bài học về đoàn kết quốc tế từ sự kiện 1979 là gì?","options":["A. Giúp bạn là giúp mình, chính nghĩa thắng phi nghĩa","B. Không nên giúp ai","C. Chỉ lo mình","D. Thờ ơ"],"answer":"A","explain":"Giúp bạn là giúp mình; chính nghĩa tất thắng.","points":0.25},{"type":"mcq","level":"TH","q":"Tội ác của Khmer Đỏ cho thấy điều gì?","options":["A. Chủ nghĩa cực đoan gây thảm họa cho dân tộc","B. Không có gì","C. Là chính nghĩa","D. Nên học tập"],"answer":"A","explain":"Chủ nghĩa cực đoan, diệt chủng là thảm họa - bài học cảnh giác.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Việt Nam kháng chiến chống Mỹ 21 năm.","b) Khmer Đỏ thi hành diệt chủng.","c) 7/1/1979 lật đổ Khmer Đỏ.","d) Việt Nam xâm lược Cam-pu-chia."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: Việt Nam giúp đỡ chính nghĩa.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Giúp bạn là truyền thống của Việt Nam.","b) Diệt chủng là tội ác chống nhân loại.","c) Mọi sự giúp đỡ đều bị lên án.","d) Chính nghĩa được lịch sử ghi nhận."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: giúp đỡ chính nghĩa được ủng hộ.","points":1},{"type":"short","level":"VD","q":"Chế độ nào ở Cam-pu-chia bị lật đổ ngày 7/1/1979?","answer":"Khmer Đỏ","explain":"Chế độ diệt chủng Khmer Đỏ.","points":0.5},{"type":"short","level":"VDC","q":"Ai đã giúp nhân dân Cam-pu-chia lật đổ Khmer Đỏ?","answer":"Quân tình nguyện Việt Nam","explain":"Quân tình nguyện Việt Nam.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Chương 3 gồm những nội dung chính nào?","options":["A. Xâm lược - đấu tranh - giành độc lập","B. Kinh tế - văn hóa","C. Chiến tranh thế giới","D. Liên minh khu vực"],"answer":"A","explain":"Chương 3: xâm lược và cai trị - phong trào đấu tranh - hành trình giành độc lập.","points":0.25},{"type":"mcq","level":"NB","q":"Giá trị lớn nhất của chương 3 với học sinh là gì?","options":["A. Hiểu giá trị của độc lập, bài học lịch sử","B. Thuộc lòng sự kiện","C. Không có giá trị","D. Chỉ để thi"],"answer":"A","explain":"Hiểu giá trị thiêng liêng của độc lập và rút bài học lịch sử.","points":0.25},{"type":"mcq","level":"NB","q":"Truyền thống chung của các dân tộc Đông Nam Á là gì?","options":["A. Yêu nước, đoàn kết, bất khuất","B. Chia rẽ","C. Đầu hàng","D. Thờ ơ"],"answer":"A","explain":"Yêu nước, đoàn kết, bất khuất.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa quá khứ - hiện tại - tương lai của Đông Nam Á là gì?","options":["A. Quá khứ là nền tảng, hiện tại tiếp nối, tương lai phát triển","B. Không liên quan","C. Đối lập","D. Ngẫu nhiên"],"answer":"A","explain":"Quá khứ đấu tranh là nền tảng cho hiện tại phát triển và tương lai.","points":0.25},{"type":"mcq","level":"TH","q":"Thông điệp của chương 3 gửi đến thế hệ trẻ là gì?","options":["A. Trân trọng độc lập, xây dựng đất nước giàu mạnh","B. Quên lịch sử","C. Sống hưởng thụ","D. Không cần học"],"answer":"A","explain":"Trân trọng thành quả, ra sức học tập, xây dựng đất nước.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Đông Nam Á từ 'thuộc địa' thành khu vực phát triển năng động?","options":["A. Nhờ đấu tranh giành độc lập và nỗ lực xây dựng","B. Nhờ may mắn","C. Nhờ viện trợ duy nhất","D. Ngẫu nhiên"],"answer":"A","explain":"Nhờ đấu tranh giành độc lập và nỗ lực xây dựng của các dân tộc.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Chương 3 có 3 nội dung chính.","b) Truyền thống là yêu nước, đoàn kết.","c) Quá khứ là nền tảng hiện tại.","d) Chương 3 không có giá trị giáo dục."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: có giá trị giáo dục to lớn.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Độc lập dân tộc là khát vọng thiêng liêng.","b) Phát triển là mục tiêu sau độc lập.","c) Thế hệ trẻ gánh vác tương lai.","d) Lịch sử chỉ là chuyện quá khứ."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: lịch sử là bài học cho tương lai.","points":1},{"type":"short","level":"VD","q":"Nêu ba nội dung chính của chương 3.","answer":"Xâm lược, đấu tranh, giành độc lập","explain":"Xâm lược - đấu tranh - giành độc lập.","points":0.5},{"type":"short","level":"VDC","q":"Thông điệp lớn nhất của chương 3 là gì?","answer":"Trân trọng độc lập","explain":"Trân trọng độc lập, xây dựng đất nước.","points":0.5}]}]}
