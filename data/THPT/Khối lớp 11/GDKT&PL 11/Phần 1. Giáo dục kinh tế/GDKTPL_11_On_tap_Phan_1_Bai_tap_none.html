, sai:","statements":["a) Ý tưởng từ lợi thế sẵn có kết hợp công nghệ.","b) Anh Ba có năng lực nắm bắt cơ hội, chuyên môn.","c) Giữ đúng chất lượng là đạo đức kinh doanh.","d) Thành công chỉ nhờ may mắn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Trên thị trường lao động, người lao động là bên ... sức lao động. (1 từ)","answer":"cung","explain":"Bài 5.","points":0.5},{"type":"short","level":"VDC","q":"Bước đầu tiên thực hiện ý tưởng kinh doanh là nhận biết ... (2 từ)","answer":"cơ hội","explain":"Bài 6.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Đạo đức kinh doanh là","options":["A. chuẩn mực đạo đức vận dụng vào kinh doanh.","B. mánh khoé kiếm tiền.","C. chiến thuật quảng cáo.","D. bí quyết trốn thuế."],"answer":"A","explain":"Định nghĩa Bài 7.","points":0.25},{"type":"mcq","level":"NB","q":"Văn hoá tiêu dùng là","options":["A. nét đẹp trong thói quen, hành vi tiêu dùng.","B. số tiền chi tiêu.","C. sở thích mua sắm.","D. thu nhập."],"answer":"A","explain":"Định nghĩa Bài 8.","points":0.25},{"type":"mcq","level":"NB","q":"Bốn nội dung của văn hoá tiêu dùng là","options":["A. thông minh, tiết kiệm, văn minh, trách nhiệm.","B. giàu, sang, đẹp, sành.","C. nhanh, nhiều, rẻ, đẹp.","D. mua, bán, đổi, trả."],"answer":"A","explain":"Bài 8.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao đạo đức kinh doanh tạo uy tín?","options":["A. Vì trung thực, giữ chữ tín khiến khách hàng tin tưởng, gắn bó lâu dài.","B. Vì giúp trốn thuế.","C. Vì giảm giá thành.","D. Vì không cần quảng cáo."],"answer":"A","explain":"Bài 7.","points":0.25},{"type":"mcq","level":"TH","q":"Mang túi vải đi chợ, phân loại rác thể hiện","options":["A. sự keo kiệt.","B. văn hoá tiêu dùng: tiết kiệm và bảo vệ môi trường.","C. thiếu tiền.","D. lạc hậu."],"answer":"B","explain":"Bài 8.","points":0.25},{"type":"mcq","level":"VD","q":"Công ty thực phẩm dùng hoá chất cấm ướp thịt, bị tẩy chay, phá sản. Bài h hất nghiệp có tác dụng","options":["A. trợ cấp người mất việc khi tìm việc mới.","B. tăng lương.","C. phạt người thất nghiệp.","D. cấm sa thải."],"answer":"A","explain":"Bài 4.","points":0.25},{"type":"mcq","level":"TH","q":"Cạnh tranh giữa các hãng mì ăn liền với nhau là cạnh tranh","options":["A. giữa các ngành.","B. trong nội bộ ngành.","C. quốc tế.","D. không lành mạnh."],"answer":"B","explain":"Cùng loại hàng hoá (Bài 1).","points":0.25},{"type":"mcq","level":"TH","q":"Nghe tin xăng sắp tăng, tiểu thương vội tăng giá hàng dù hàng cũ nhập giá thấp. Đây là lạm phát do","options":["A. cầu kéo.","B. chi phí đẩy.","C. kì vọng lạm phát.","D. tiền tệ."],"answer":"C","explain":"Bài 3.","points":0.25},{"type":"mcq","level":"VD","q":"Tỉnh Y thanh niên thất nghiệp 8%, nhiều cử nhân 2 năm chưa xin được việc. Nguyên nhân sâu xa có thể là","options":["A. đào tạo chưa gắn với nhu cầu thị trường lao động.","B. thanh niên lười.","C. không có doanh nghiệp.","D. may rủi."],"answer":"A","explain":"Mất cân đối đào tạo – nhu cầu (Bài 4, 5).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cạnh tranh có tính hai mặt.","b) Lạm phát làm đồng tiền mất giá.","c) Thất nghiệp tự nhiên là bình thường.","d) Mọi mức lạm phát đều tốt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chỉ vừa phải mới có mặt tích cực.","points":1},{"type":"truefalse","level":"VDC","q":"Để kiềm chế lạm phát cao, Ngân hàng Nhà nước tăng lãi suất, Chính phủ cắt giảm chi thường xuyên. Xét tính đúng, sai:","statements":["a) Tăng lãi suất giúp giảm tiền lưu thông.","b) Cắt giảm chi ngân sách giúp giảm tổng cầu.","c) Đây là phối hợp chính sách tiền tệ và tài khoá.","d) Lúc này nên hạ lãi suất, tăng chi ngân sách."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đó là nới lỏng, dùng khi suy thoái.","points":1},{"type":"short","level":"VD","q":"Luật điều chỉnh cạnh tranh ở Việt Nam hiện nay ban hành năm nào? (Điền số)","answer":"2018","explain":"Luật Cạnh tranh 2018.","points":0.5},{"type":"short","level":"VDC","q":"Lực lượng lao động 50000 người, 2000 người thất nghiệp. Tỉ lệ thất nghiệp là bao nhiêu phần trăm? (Điền số)","answer":"4","explain":"2000/50000 x 100% = 4%.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Khi cung bằng cầu, giá cả","options":["A. tăng.","B. giảm.","C. ổn định.","D. bằng không."],"answer":"C","explain":"Bài 2.","points":0.25},{"type":"mcq","level":"NB","q":"Thất nghiệp tạm thời là do","options":["A. chuyển việc.","B. suy thoái.","C. kĩ năng lạc hậu.","D. lười biếng."],"answer":"A","explain":"Bài 4.","points":0.25},{"type":"mcq","level":"NB","q":"Năng lực nào sau đây của người kinh doanh thuộc về đạo đức?","options":["A. Trung thực, giữ chữ tín.","B. Tính toán nhanh.","C. Nói nhiều.","D. Liều lĩnh."],"answer":"A","explain":"Bài 6, 7.","points":0.25},{"type":"mcq","level":"TH","q":"Thấy giá cà phê tăng, nông dân mở rộng diện tích. Điều này cho thấy","options":["A. giá tăng làm cung tăng.","B. giá tăng làm cung giảm.","C. giá không ảnh hưởng cung.","D. nông dân sai lầm."],"answer":"A","explain":"Bài 2: giá tác động trở lại cung.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao thất nghiệp lâu làm khó xin việc?","options":["A. Vì giàu lên.","B. Vì kĩ năng mai một, nhà tuyển dụng e ngại.","C. Vì không muốn làm.","D. Vì pháp luật cấm."],"answer":"B","explain":"Bài 4.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Thu mở tiệm nail gần khu công nghiệp: khảo sát nhu cầu, giá bằng 70% thành phố, phục vụ tận tình. Tiệm đông khách. Chị Thu đã","options":["A. gặp may.","B. nhận biết đúng cơ hội và thực thi tốt.","C. đầu cơ.","D. vi phạm."],"answer":"B","explain":"Bài 6.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cầu tăng, cung không đổi thì giá tăng.","b) Thất nghiệp cần người lao động đang tìm việc.","c) Ý tưởng kinh doanh cần sáng tạo.","d) Kinh doanh không cần đạo đức."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Hợp tác xã rau sạch kí hợp đồng bao tiêu với siêu thị, giá ổn định; khi giá chợ tăng gấp đôi vẫn giao đủ hàng đúng giá. Xét tính đúng, sai:","statements":["a) Bao tiêu giúp tránh rủi ro biến động giá.","b) Giữ cam kết khi giá tăng là uy tín.","c) Nên phá hợp đồng để bán giá cao.","d) Liên kết chuỗi là hướng đi bền vững."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: phá hợp đồng mất uy tín, vi phạm pháp luật.","points":1},{"type":"short","level":"VD","q":"Điền từ: Lạm phát do ... là khi tổng cầu vượt tổng cung. (2 từ)","answer":"cầu kéo","explain":"Bài 3.","points":0.5},{"type":"short","level":"VDC","q":"Người kinh doanh cần dám chấp nhận ... có tính toán. (1 từ)","answer":"rủi ro","explain":"Bài 6.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Hành vi đầu cơ, găm hàng là","options":["A. cạnh tranh lành mạnh.","B. cạnh tranh không lành mạnh.","C. hợp tác.","D. có đạo đức."],"answer":"B","explain":"Bài 1.","points":0.25},{"type":"mcq","level":"NB","q":"Trách nhiệm xã hội của doanh nghiệp là","options":["A. chỉ thu lợi nhuận.","B. đóng góp cho cộng đồng, môi trường bên cạnh lợi nhuận.","C. trốn thuế.","D. mặc kệ xã hội."],"answer":"B","explain":"Bài 7.","points":0.25},{"type":"mcq","level":"NB","q":"Tiêu dùng xanh là","options":["A. chỉ mua đồ màu xanh.","B. thân thiện môi trường: hạn chế nilon, tiết kiệm tài nguyên.","C. mua rau xanh.","D. không tiêu dùng."],"answer":"B","explain":"Bài 8.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà nước can thiệp vào cạnh tranh để","options":["A. xóa bỏ cạnh tranh.","B. phát huy mặt tích cực, hạn chế tiêu cực, bảo vệ người tiêu dùng.","C. bảo hộ độc quyền.","D. tăng thuế."],"answer":"B","explain":"Bài 1.","points":0.25},{"type":"mcq","level":"TH","q":"Một doanh nghiệp xả thải gây ô nhiễm nhưng tạo việc làm. Đánh giá đúng là","options":["A. chấp nhận được.","B. không chấp nhận được, phải xử lí đạt chuẩn.","C. nên bao che.","D. không quan tâm."],"answer":"B","explain":"Bài 7.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn An được 200000 đồng tiền ăn sáng một tuần. Cách chi tiêu có văn hoá là","options":["A. tiêu hết 2 ngày đầu.","B. lập kế hoạch đều các ngày, để dành một phần.","C. cho vay hết.","D. mua quà vặt hết."],"answer":"B","explain":"Bài 8.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cạnh tranh không lành mạnh cần bị xử lí.","b) Doanh nghiệp có trách nhiệm bảo vệ môi trường.","c) Tiết kiệm là chi tiêu hợp lí, tránh lãng phí.","d) Xả rác bừa bãi là văn hoá."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Nhà máy Z xả thải chưa xử lí ra sông, cá chết hàng loạt. Xét tính đúng, sai:","statements":["a) Z thiếu đạo đức với cộng đồng, môi trường.","b) Z vi phạm pháp luật môi trường.","c) Người dân có quyền tố cáo, yêu cầu bồi thường.","d) Vì tạo việc làm nên được phép gây ô nhiễm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ: ... quý hơn vàng trong kinh doanh. (2 từ)","answer":"Chữ tín","explain":"Bài 7.","points":0.5},{"type":"short","level":"VDC","q":"Khi mua phải hàng giả, người tiêu dùng nên ... đến cơ quan chức năng. (Điền 2 từ)","answer":"tố cáo","explain":"Bài 7, 8.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Giá cả thị trường là","options":["A. giá bán thực tế trên thị trường.","B. giá Nhà nước ấn định.","C. chi phí sản xuất.","D. giá người mua mong muốn."],"answer":"A","explain":"Bài 2.","points":0.25},{"type":"mcq","level":"NB","q":"Giảm phát là","options":["A. mức giá chung tăng.","B. mức giá chung giảm liên tục.","C. giá ổn định.","D. tiền tăng giá mãi."],"answer":"B","explain":"Bài 3.","points":0.25},{"type":"mcq","level":"NB","q":"Lực lượng lao động gồm","options":["A. mọi công dân.","B. người có việc làm cộng người thất nghiệp.","C. chỉ người đi làm.","D. chỉ người thất nghiệp."],"answer":"B","explain":"Bài 4.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa giá cả và cung cầu là","options":["A. một chiều.","B. tác động qua lại hai chiều.","C. không liên quan.","D. do Nhà nước quyết."],"answer":"B","explain":"Bài 2.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao giảm phát cũng gây hại?","options":["A. Vì người dân hoãn chi tiêu chờ giá rẻ, doanh nghiệp khó bán hàng.","B. Vì mọi người giàu lên.","C. Vì không ảnh hưởng.","D. Vì tăng lương."],"answer":"A","explain":"Bài 3.","points":0.25},{"type":"mcq","level":"VD","q":"Dịch COVID-19 làm hàng loạt nhà hàng đóng cửa, nhân viên mất việc. Đây là thất nghiệp","options":["A. tạm thời.","B. cơ cấu.","C. chu kì.","D. tự nguyện."],"answer":"C","explain":"Bài 4.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giá cả là tín hiệu của thị trường.","b) Giảm phát kéo dài gây hại.","c) Lực lượng lao động = có việc làm + thất nghiệp.","d) Thất nghiệp không có nguyên nhân."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Tỉnh X: khi giá thịt lợn tăng quá 30% một tháng, Sở Công thương xuất kho dự trữ, chống đầu cơ. Xét tính đúng, sai:","statements":["a) Đây là biện pháp bình ổn giá.","b) Xuất kho dự trữ giúp tăng cung, kéo giá xuống.","c) Chống đầu cơ ngăn giá tăng ảo.","d) Biện pháp này vi phạm quy luật cung cầu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: vận dụng đúng quy luật.","points":1},{"type":"short","level":"VD","q":"Điền từ: ... là nhu cầu có khả năng thanh toán. (1 từ)","answer":"Cầu","explain":"Bài 2.","points":0.5},{"type":"short","level":"VDC","q":"Hiện tượng mức giá chung giảm liên tục gọi là ... (2 từ)","answer":"giảm phát","explain":"Bài 3.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Trên thị trường lao động, tiền lương là","options":["A. giá cả của sức lao động.","B. giá vàng.","C. lãi suất.","D. tỉ giá."],"answer":"A","explain":"Bài 5.","points":0.25},{"type":"mcq","level":"NB","q":"Bước đầu tiên thực hiện ý tưởng kinh doanh là","options":["A. vay vốn.","B. nhận biết cơ hội.","C. thuê mặt bằng.","D. tuyển người."],"answer":"B","explain":"Bài 6.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện đạo đức với đối thủ là","options":["A. tung tin xấu.","B. cạnh tranh lành mạnh.","C. phá hoại.","D. bán phá giá triệt hạ."],"answer":"B","explain":"Bài 7.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao hội nhập vừa tạo cơ hội vừa tạo thách thức cho lao động Việt Nam?","options":["A. Mở ra việc làm FDI nhưng đòi hỏi tiêu chuẩn cao hơn.","B. Không ảnh hưởng.","C. Chỉ có hại.","D. Cấm lao động Việt Nam."],"answer":"A","explain":"Bài 5.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn trẻ sợ thất bại nên không dám khởi nghiệp. Bạn thiếu năng lực","options":["A. chuyên môn.","B. chịu rủi ro, kiên trì.","C. giao tiếp.","D. tổ chức."],"answer":"B","explain":"Bài 6.","points":0.25},{"type":"mcq","level":"VD","q":"Siêu thị của anh Tuấn phát hiện lô hàng gần hết hạn, anh giảm giá sâu, ghi rõ hạn sử dụng. Cách làm này","options":["A. gây lỗ.","B. thể hiện trung thực với khách hàng.","C. vi phạm pháp luật.","D. thiếu năng lực."],"answer":"B","explain":"Bài 7.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lao động chất lượng cao được trả lương xứng đáng.","b) Ý tưởng kinh doanh cần sáng tạo.","c) Trung thực là cốt lõi đạo đức kinh doanh.","d) Học sinh không thể khởi nghiệp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: có thể khởi nghiệp nhỏ.","points":1},{"type":"truefalse","level":"VDC","q":"Anh Tâm mở xưởng mộc: tính kĩ vốn, thuê thợ lành nghề, cam kết giao đúng hẹn, bảo hành 2 năm. Xét tính đúng, sai:","statements":["a) Anh Tâm có năng lực tổ chức tốt.","b) Giữ cam kết, bảo hành là đạo đức.","c) Uy tín mang lại khách hàng bền vững.","d) Chỉ cần quảng cáo rầm rộ là đủ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ: Người sử dụng lao động là bên ... sức lao động. (1 từ)","answer":"cầu","explain":"Bài 5.","points":0.5},{"type":"short","level":"VDC","q":"Tài sản vô hình quý nhất của người kinh doanh gọi là ... (Điền 2 từ)","answer":"chữ tín","explain":"Bài 6, 7.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tóm lại Phần 1, để thành công trong kinh tế thị trường cần","options":["A. hiểu quy luật kinh tế và làm ăn có đạo đức.","B. chỉ cần vốn lớn.","C. chỉ cần may mắn.","D. bất chấp thủ đoạn."],"answer":"A","explain":"Tổng kết Phần 1.","points":0.25},{"type":"mcq","level":"NB","q":"Học sinh vận dụng kiến thức Phần 1 để","options":["A. chi tiêu hợp lí, định hướng nghề nghiệp đúng.","B. bỏ học kinh doanh.","C. đua đòi mua sắm.","D. không cần học nữa."],"answer":"A","explain":"Vận dụng thực tế.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà nước có vai trò trong kinh tế thị trường là","options":["A. ban hành pháp luật, điều tiết, bảo vệ người dân.","B. cấm kinh doanh.","C. để mặc tự phát.","D. kinh doanh thay dân."],"answer":"A","explain":"Xuyên suốt các bài.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa các bài trong Phần 1 là","options":["A. rời rạc, không liên quan.","B. gắn bó: cạnh tranh, cung cầu, lạm phát, thất nghiệp, lao động, kinh doanh, đạo đức, tiêu dùng tạo nên bức tranh kinh tế thị trường.","C. mâu thuẫn nhau.","D. trùng lặp."],"answer":"B","explain":"Tổng hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Một người vừa hiểu quy luật thị trường vừa kinh doanh tử tế, tiêu dùng văn minh sẽ","options":["A. thành công bền vững và được xã hội tôn trọng.","B. thất bại.","C. bị thiệt thòi.","D. không ai quan tâm."],"answer":"A","explain":"Tổng kết.","points":0.25},{"type":"mcq","level":"VD","q":"Trong buổi ngoại khoá, em sẽ tuyên truyền với các bạn điều gì?","options":["A. Kiếm tiền bằng mọi giá.","B. Hiểu kinh tế, kinh doanh có đạo đức, tiêu dùng văn minh.","C. Đạo đức không quan trọng.","D. Chỉ cần giàu nhanh."],"answer":"B","explain":"Thông điệp Phần 1.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hiểu quy luật kinh tế giúp sống tốt hơn.","b) Đạo đức kinh doanh tạo phát triển bền vững.","c) Văn hoá tiêu dùng xây dựng xã hội văn minh.","d) Kiến thức kinh tế chỉ dành cho doanh nhân."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ai cũng cần.","points":1},{"type":"truefalse","level":"VDC","q":"Sau khi học xong Phần 1, bạn An: lập sổ chi tiêu, tìm hiểu nghề nghiệp tương lai, tẩy chay hàng giả, mang túi vải đi chợ. Xét tính đúng, sai:","statements":["a) An đã vận dụng kiến thức vào đời sống.","b) Lập sổ chi tiêu là quản lí tài chính cá nhân tốt.","c) Tẩy chay hàng giả, mang túi vải là văn hoá tiêu dùng.","d) Học sinh chưa cần vận dụng, lớn mới cần."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: vận dụng ngay từ bây giờ.","points":1},{"type":"short","level":"VD","q":"Hoàn thành công thức: Cung = Cầu thì giá cả ... (1 từ)","answer":"ổn định","explain":"Bài 2.","points":0.5},{"type":"short","level":"VDC","q":"Câu khẩu hiệu: Hiểu kinh tế để sống tốt, kinh doanh có đạo đức, tiêu dùng ... (Điền 2 từ)","answer":"văn minh","explain":"Tổng kết Phần 1.","points":0.5}]}]}</script>
