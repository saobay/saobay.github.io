<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Thị trường lao động được hiểu là","options":["A. nơi mua bán hàng hoá tiêu dùng.","B. nơi gặp gỡ giữa người lao động và người sử dụng lao động để thoả thuận về tiền lương, điều kiện làm việc.","C. nơi Nhà nước phân phối việc làm.","D. nơi mua bán máy móc, thiết bị."],"answer":"B","explain":"Đúng định nghĩa SGK: thị trường lao động là nơi gặp gỡ của bên cung (người lao động) và bên cầu (người sử dụng lao động).","points":0.25},{"type":"mcq","level":"NB","q":"Việc làm được hiểu là","options":["A. mọi hoạt động của con người.","B. hoạt động lao động tạo ra thu nhập mà không bị pháp luật cấm.","C. hoạt động tạo ra thu nhập bằng mọi cách.","D. chỉ công việc trong cơ quan nhà nước."],"answer":"B","explain":"Việc làm = lao động tạo thu nhập + không bị pháp luật cấm.","points":0.25},{"type":"mcq","level":"NB","q":"Trên thị trường lao động, bên cung sức lao động là","options":["A. người sử dụng lao động.","B. người lao động.","C. Nhà nước.","D. doanh nghiệp nước ngoài."],"answer":"B","explain":"Người lao động cung ứng sức lao động; người sử dụng lao động là bên cầu.","points":0.25},{"type":"mcq","level":"TH","q":"Hành vi trộm cắp tài sản dù tạo ra thu nhập nhưng","options":["A. vẫn được coi là việc làm.","B. không được coi là việc làm vì bị pháp luật cấm.","C. được pháp luật bảo vệ.","D. được khuyến khích."],"answer":"B","explain":"Việc làm phải không bị pháp luật cấm; trộm cắp là vi phạm pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Bạn An bán hàng online, thu nhập 12 triệu đồng một tháng. Công việc của An","options":["A. không phải việc làm vì không đến công ty.","B. là việc làm vì tạo ra thu nhập hợp pháp.","C. là thất nghiệp.","D. vi phạm pháp luật."],"answer":"B","explain":"Tự tạo việc làm qua bán hàng online hợp pháp vẫn là việc làm.","points":0.25},{"type":"mcq","level":"VD","q":"Công ty X tuyển nhân viên marketing yêu cầu: đại học, tiếng Anh giao tiếp, biết chạy quảng cáo số, làm việc nhóm tốt. Yêu cầu này phản ánh xu hướng tuyển dụng","options":["A. chỉ cần sức khoẻ.","B. lao động chất lượng cao, đa kĩ năng.","C. không cần bằng cấp.","D. tuyển người nhà."],"answer":"B","explain":"Xu hướng hiện nay: ưu tiên lao động chất lượng cao, đa kĩ năng (chuyên môn, ngoại ngữ, số, mềm).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thị trường lao động là nơi gặp gỡ của người lao động và người sử dụng lao động.","b) Trên thị trường lao động, tiền lương là giá cả của sức lao động.","c) Việc làm phải là hoạt động không bị pháp luật cấm.","d) Buôn lậu tạo ra thu nhập nên được coi là việc làm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: buôn lậu bị pháp luật cấm nên không phải việc làm.","points":1},{"type":"truefalse","level":"VDC","q":"Anh Tuấn kí hợp đồng lao động với công ty Y: lương 10 triệu đồng một tháng, làm 8 giờ một ngày, được đóng bảo hiểm xã hội. Sau 3 tháng, công ty trả lương chậm 2 tháng, bắt làm thêm giờ không trả lương tăng ca, không đóng bảo hiểm. Xét tính đúng, sai:","statements":["a) Công ty Y đã vi phạm Bộ luật Lao động.","b) Anh Tuấn có quyền yêu cầu công ty trả lương đầy đủ, đúng hạn.","c) Anh Tuấn có quyền khiếu nại đến cơ quan quản lí lao động.","d) Người sử dụng lao động được quyền tuỳ ý đối xử với người lao động."],"answer":["T","T","T","F"],"explain":"a) Đúng: nợ lương, không đóng BHXH, bắt làm thêm không trả lương đều vi phạm. b), c) Đúng: quyền của người lao động. d) Sai: phải tuân thủ pháp luật lao động.","points":1},{"type":"short","level":"VD","q":"Trên thị trường lao động, người lao động là bên ... sức lao động. (Điền 1 từ)","answer":"cung","explain":"Người lao động cung ứng sức lao động; người sử dụng lao động là bên cầu.","points":0.5},{"type":"short","level":"VDC","q":"Văn bản pháp luật quan trọng nhất điều chỉnh quan hệ lao động ở Việt Nam hiện nay là Bộ luật ... năm 2019. (Điền 2 từ)","answer":"Lao động","explain":"Bộ luật Lao động năm 2019 quy định quyền, nghĩa vụ của người lao động và người sử dụng lao động.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Trên thị trường lao động, bên cầu sức lao động là","options":["A. người lao động.","B. người sử dụng lao động.","C. học sinh.","D. người về hưu."],"answer":"B","explain":"Người sử dụng lao động có nhu cầu tuyển lao động — bên cầu.","points":0.25},{"type":"mcq","level":"NB","q":"Giá cả của sức lao động trên thị trường lao động là","options":["A. tiền lương, tiền công.","B. giá vàng.","C. lãi suất.","D. tỉ giá."],"answer":"A","explain":"Tiền lương, tiền công là giá cả của sức lao động.","points":0.25},{"type":"mcq","level":"NB","q":"Nhân tố nào sau đây ảnh hưởng đến thị trường lao động?","options":["A. Màu sắc quần áo.","B. Kinh tế, pháp luật, dân số, giáo dục – đào tạo, khoa học – công nghệ.","C. Thời tiết hôm nay.","D. Sở thích ăn uống."],"answer":"B","explain":"Các nhân tố: kinh tế, pháp luật, dân số, giáo dục – đào tạo, khoa học – công nghệ, hội nhập quốc tế.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao kinh tế suy thoái làm thị trường lao động khó khăn?","options":["A. Vì doanh nghiệp thu hẹp sản xuất, sa thải lao động, ít tuyển mới.","B. Vì người lao động không muốn làm việc.","C. Vì Nhà nước cấm tuyển dụng.","D. Vì dân số giảm."],"answer":"A","explain":"Suy thoái → tổng cầu giảm → doanh nghiệp cắt giảm lao động → cầu lao động giảm.","points":0.25},{"type":"mcq","level":"TH","q":"Tự động hoá, AI ảnh hưởng đến thị trường lao động theo hướng","options":["A. không thay đổi gì.","B. làm thay đổi cơ cấu việc làm, đòi hỏi người lao động có kĩ năng mới.","C. xóa bỏ mọi việc làm.","D. chỉ tạo việc làm giản đơn."],"answer":"B","explain":"Công nghệ thay thế lao động giản đơn, tạo ra việc làm mới đòi hỏi kĩ năng cao hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Sau khi tốt nghiệp, bạn Hoa xin vào làm nhân viên văn phòng nhưng công ty yêu cầu thêm kĩ năng tin học văn phòng thành thạo và giao tiếp tiếng Anh cơ bản. Điều này cho thấy người lao động hiện nay cần","options":["A. chỉ cần bằng cấp là đủ.","B. trang bị đa kĩ năng để đáp ứng yêu cầu tuyển dụng.","C. không cần học thêm gì.","D. chỉ cần quen biết."],"answer":"B","explain":"Xu hướng tuyển dụng đòi hỏi lao động đa kĩ năng: chuyên môn + ngoại ngữ + tin học + kĩ năng mềm.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nhân tố ảnh hưởng:","statements":["a) Kinh tế phát triển tạo nhiều việc làm hơn.","b) Dân số tăng nhanh gây áp lực lên thị trường lao động.","c) Chất lượng đào tạo quyết định chất lượng nguồn nhân lực.","d) Khoa học – công nghệ không ảnh hưởng đến việc làm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: công nghệ làm thay đổi mạnh cơ cấu việc làm.","points":1},{"type":"truefalse","level":"VDC","q":"Chị Mai làm công nhân may 10 năm, nay nhà máy lắp dây chuyền tự động, chị được đề nghị chuyển sang vận hành máy nhưng phải đi học 3 tháng. Chị phân vân vì sợ học không nổi. Xét tính đúng, sai:","statements":["a) Chị Mai đang đối mặt với nguy cơ thất nghiệp cơ cấu.","b) Đi học vận hành máy là cách thích ứng đúng đắn.","c) Doanh nghiệp có trách nhiệm đào tạo lại cho người lao động.","d) Chị Mai nên từ chối học và chờ bị sa thải."],"answer":["T","T","T","F"],"explain":"a) Đúng: công nghệ thay thế. b) Đúng: học kĩ năng mới. c) Đúng: trách nhiệm của người sử dụng lao động. d) Sai: thụ động sẽ mất việc.","points":1},{"type":"short","level":"VD","q":"Trên thị trường lao động, người sử dụng lao động là bên ... sức lao động. (Điền 1 từ)","answer":"cầu","explain":"Người sử dụng lao động có nhu cầu tuyển dụng — bên cầu.","points":0.5},{"type":"short","level":"VDC","q":"Hình thức làm việc từ xa qua mạng internet, không cần đến văn phòng, được gọi là làm việc ... (Điền 1 từ tiếng Anh đã Việt hoá quen thuộc)","answer":"remote","explain":"Làm việc từ xa (remote) là xu hướng việc làm linh hoạt hiện nay.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Xu hướng tuyển dụng lao động hiện nay KHÔNG bao gồm","options":["A. ưu tiên lao động chất lượng cao.","B. đề cao kĩ năng mềm.","C. chỉ tuyển lao động phổ thông, không cần kĩ năng.","D. phát triển việc làm linh hoạt."],"answer":"C","explain":"Xu hướng là ưu tiên chất lượng cao, đa kĩ năng; không phải chỉ tuyển lao động phổ thông.","points":0.25},{"type":"mcq","level":"NB","q":"Vai trò của thị trường lao động đối với người lao động là","options":["A. giúp tìm việc làm phù hợp, có thu nhập.","B. giúp trốn thuế.","C. giúp không phải làm việc.","D. không có vai trò."],"answer":"A","explain":"Thị trường lao động giúp người lao động tìm việc, có thu nhập, phát triển bản thân.","points":0.25},{"type":"mcq","level":"NB","q":"Trách nhiệm của người sử dụng lao động KHÔNG bao gồm","options":["A. trả lương đầy đủ, đúng hạn.","B. đóng bảo hiểm xã hội cho người lao động.","C. đảm bảo điều kiện làm việc an toàn.","D. bóc lột sức lao động tối đa, trốn đóng bảo hiểm."],"answer":"D","explain":"Bóc lột, trốn bảo hiểm là vi phạm pháp luật, không phải trách nhiệm đúng đắn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao hội nhập quốc tế vừa tạo cơ hội vừa tạo thách thức cho thị trường lao động Việt Nam?","options":["A. Vì mở ra việc làm ở doanh nghiệp FDI, xuất khẩu lao động nhưng đòi hỏi lao động phải cạnh tranh với tiêu chuẩn cao hơn.","B. Vì hội nhập không ảnh hưởng gì.","C. Vì hội nhập chỉ có hại.","D. Vì hội nhập cấm lao động Việt Nam làm việc."],"answer":"A","explain":"Cơ hội: việc làm FDI, xuất khẩu lao động; thách thức: yêu cầu kĩ năng, ngoại ngữ cao hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Trách nhiệm của người lao động trên thị trường lao động là","options":["A. không ngừng học tập, nâng cao kĩ năng; chấp hành pháp luật và kỉ luật lao động.","B. đòi tăng lương liên tục.","C. đình công thường xuyên.","D. làm việc cầm chừng."],"answer":"A","explain":"Người lao động phải học tập suốt đời, chấp hành luật và kỉ luật lao động.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn trẻ làm freelancer thiết kế đồ hoạ tại nhà, nhận việc qua mạng, thu nhập 15 triệu đồng một tháng. Công việc này","options":["A. không phải việc làm vì không đến công ty.","B. là việc làm linh hoạt, phù hợp xu hướng hiện nay.","C. vi phạm pháp luật.","D. là thất nghiệp."],"answer":"B","explain":"Freelancer, làm từ xa là việc làm linh hoạt — xu hướng mới của thị trường lao động.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xu hướng hiện nay ưu tiên lao động chất lượng cao, đa kĩ năng.","b) Việc làm linh hoạt như freelancer, làm từ xa ngày càng phổ biến.","c) Kĩ năng mềm ngày càng được đề cao khi tuyển dụng.","d) Người lao động không cần học thêm gì sau khi đi làm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần học tập suốt đời.","points":1},{"type":"truefalse","level":"VDC","q":"Công ty Z tuyển dụng công khai, trả lương theo thoả thuận, đóng đầy đủ bảo hiểm, có chế độ đào tạo nâng cao tay nghề hằng năm. Xét tính đúng, sai:","statements":["a) Công ty Z thực hiện tốt trách nhiệm của người sử dụng lao động.","b) Đào tạo nâng cao tay nghề giúp người lao động và công ty cùng phát triển.","c) Người lao động ở Z được pháp luật bảo vệ quyền lợi.","d) Doanh nghiệp không cần quan tâm đến quyền lợi người lao động."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: mẫu doanh nghiệp thực hiện tốt trách nhiệm. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: ... là hoạt động lao động tạo ra thu nhập mà không bị pháp luật cấm. (2 từ)","answer":"Việc làm","explain":"Định nghĩa việc làm.","points":0.5},{"type":"short","level":"VDC","q":"Người làm việc tự do, nhận việc qua mạng, không ràng buộc với một công ty cố định được gọi là ... (Điền 1 từ tiếng Anh)","answer":"freelancer","explain":"Freelancer — người làm việc tự do, xu hướng việc làm linh hoạt.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Vai trò của thị trường lao động đối với Nhà nước là","options":["A. điều tiết quan hệ lao động, đảm bảo an sinh, thúc đẩy kinh tế.","B. trực tiếp trả lương cho mọi người.","C. cấm người dân tìm việc.","D. không có vai trò."],"answer":"A","explain":"Nhà nước điều tiết, đảm bảo an sinh xã hội qua thị trường lao động.","points":0.25},{"type":"mcq","level":"NB","q":"Trách nhiệm của Nhà nước trên thị trường lao động KHÔNG bao gồm","options":["A. xây dựng pháp luật lao động.","B. có chính sách việc làm, dạy nghề.","C. kiểm tra, xử lí vi phạm pháp luật lao động.","D. tuyển dụng thay cho doanh nghiệp."],"answer":"D","explain":"Nhà nước tạo khung pháp luật và chính sách, không tuyển dụng thay doanh nghiệp.","points":0.25},{"type":"mcq","level":"NB","q":"Kĩ năng mềm được nhà tuyển dụng đề cao bao gồm","options":["A. giao tiếp, làm việc nhóm, giải quyết vấn đề.","B. sức khoẻ tốt.","C. chiều cao.","D. ngoại hình."],"answer":"A","explain":"Kĩ năng mềm: giao tiếp, làm việc nhóm, thích ứng, giải quyết vấn đề.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chất lượng giáo dục – đào tạo ảnh hưởng lớn đến thị trường lao động?","options":["A. Vì đào tạo tốt tạo ra nguồn nhân lực chất lượng cao, đáp ứng nhu cầu tuyển dụng.","B. Vì đào tạo không liên quan đến việc làm.","C. Vì ai cũng có bằng cấp như nhau.","D. Vì doanh nghiệp không cần lao động có trình độ."],"answer":"A","explain":"Chất lượng đào tạo quyết định chất lượng nguồn nhân lực.","points":0.25},{"type":"mcq","level":"TH","q":"Một doanh nghiệp trả lương thấp hơn mức tối thiểu vùng, không đóng bảo hiểm cho công nhân. Hành vi này","options":["A. là quyền của doanh nghiệp.","B. vi phạm pháp luật lao động, cần bị xử lí.","C. giúp doanh nghiệp phát triển.","D. được người lao động ủng hộ."],"answer":"B","explain":"Vi phạm quy định về lương tối thiểu và bảo hiểm — bị xử phạt.","points":0.25},{"type":"mcq","level":"VD","q":"Tỉnh A có nhiều thanh niên nhưng thiếu công nhân kĩ thuật; doanh nghiệp phải tuyển người tỉnh khác. Giải pháp lâu dài của tỉnh là","options":["A. để mặc thị trường.","B. đầu tư đào tạo nghề gắn với nhu cầu doanh nghiệp.","C. cấm doanh nghiệp tuyển người ngoài tỉnh.","D. giảm dân số."],"answer":"B","explain":"Đào tạo nghề theo nhu cầu thực tế giải quyết mất cân đối cung – cầu lao động.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về trách nhiệm các bên:","statements":["a) Người lao động phải chấp hành pháp luật và kỉ luật lao động.","b) Người sử dụng lao động phải trả lương đầy đủ, đúng hạn.","c) Người sử dụng lao động phải đóng bảo hiểm xã hội cho người lao động.","d) Nhà nước không cần xây dựng pháp luật lao động."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Nhà nước xây dựng Bộ luật Lao động, chính sách việc làm.","points":1},{"type":"truefalse","level":"VDC","q":"Bạn Linh 17 tuổi, học hết lớp 11 thì nghỉ học đi làm phụ hồ, chủ thầu trả lương thấp, bắt làm 12 giờ một ngày, không kí hợp đồng. Xét tính đúng, sai:","statements":["a) Sử dụng lao động chưa thành niên phải tuân thủ quy định riêng của pháp luật.","b) Bắt làm 12 giờ một ngày, không kí hợp đồng là vi phạm pháp luật lao động.","c) Linh nên quay lại học tập hoặc học nghề để có tương lai tốt hơn.","d) Chủ thầu được quyền tuỳ ý đối xử vì Linh tự nguyện đi làm."],"answer":["T","T","T","F"],"explain":"a), b) Đúng: vi phạm quy định về lao động chưa thành niên, hợp đồng, giờ làm. c) Đúng: lời khuyên đúng đắn. d) Sai: tự nguyện không có nghĩa được vi phạm luật.","points":1},{"type":"short","level":"VD","q":"Trên thị trường lao động, tiền lương, tiền công chính là ... của sức lao động. (Điền 1 từ)","answer":"giá cả","explain":"Tiền lương là giá cả của sức lao động.","points":0.5},{"type":"short","level":"VDC","q":"Để có việc làm tốt trong thời đại số, học sinh cần học tốt chuyên môn đồng thời rèn ngoại ngữ, tin học và kĩ năng ... (Điền 1 từ)","answer":"mềm","explain":"Kĩ năng mềm (giao tiếp, làm việc nhóm...) ngày càng được đề cao. Đáp án: mềm.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Sàn giao dịch việc làm là","options":["A. nơi mua bán hàng hoá.","B. nơi người lao động và người sử dụng lao động gặp gỡ, kết nối trên thị trường lao động.","C. nơi Nhà nước phát tiền.","D. nơi thi tuyển công chức duy nhất."],"answer":"B","explain":"Sàn giao dịch việc làm kết nối cung – cầu lao động.","points":0.25},{"type":"mcq","level":"NB","q":"Hợp đồng lao động là","options":["A. sự thoả thuận giữa người lao động và người sử dụng lao động về việc làm, tiền lương, điều kiện làm việc.","B. giấy phép kinh doanh.","C. quyết định tuyển dụng của Nhà nước.","D. đơn xin việc."],"answer":"A","explain":"Hợp đồng lao động ghi nhận thoả thuận hai bên, được pháp luật bảo vệ.","points":0.25},{"type":"mcq","level":"NB","q":"Ngành nghề mới xuất hiện do hội nhập và công nghệ KHÔNG bao gồm","options":["A. thương mại điện tử.","B. marketing số.","C. nghề nông thủ công lạc hậu không đổi mới.","D. chăm sóc sức khoẻ."],"answer":"C","explain":"Ngành nghề mới gắn với công nghệ, số hoá, dịch vụ hiện đại.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao doanh nghiệp FDI (vốn đầu tư nước ngoài) vào Việt Nam tạo thêm nhiều việc làm?","options":["A. Vì họ mang vốn, công nghệ, mở nhà máy cần tuyển lao động địa phương.","B. Vì họ cho tiền người dân.","C. Vì họ không cần lao động.","D. Vì pháp luật bắt buộc."],"answer":"A","explain":"Đầu tư nước ngoài mở rộng sản xuất → tăng cầu lao động.","points":0.25},{"type":"mcq","level":"TH","q":"Một lao động có tay nghề cao, ngoại ngữ tốt thường","options":["A. khó xin việc.","B. được nhiều doanh nghiệp săn đón, lương cao.","C. bị phân biệt.","D. phải làm việc chân tay."],"answer":"B","explain":"Lao động chất lượng cao được trả lương xứng đáng — quy luật cung cầu lao động.","points":0.25},{"type":"mcq","level":"VD","q":"Anh Hải làm lái xe công nghệ, thu nhập theo số chuyến, thời gian linh hoạt. Đây là","options":["A. thất nghiệp.","B. việc làm linh hoạt trong nền kinh tế chia sẻ.","C. vi phạm pháp luật.","D. không phải việc làm."],"answer":"B","explain":"Kinh tế chia sẻ tạo việc làm linh hoạt, thu nhập hợp pháp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thị trường lao động giúp người lao động tìm việc làm.","b) Thị trường lao động giúp doanh nghiệp tuyển được người phù hợp.","c) Nhà nước điều tiết thị trường lao động bằng pháp luật và chính sách.","d) Thị trường lao động không có vai trò gì với xã hội."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: ba vai trò. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Công ty thực phẩm sạch tuyển 20 nhân viên bán hàng, yêu cầu trung thực, giao tiếp tốt; trả lương cơ bản cộng hoa hồng, đóng bảo hiểm đầy đủ. Xét tính đúng, sai:","statements":["a) Yêu cầu trung thực, giao tiếp tốt là yêu cầu về đạo đức và kĩ năng mềm.","b) Lương cơ bản cộng hoa hồng là hình thức trả lương khuyến khích.","c) Đóng bảo hiểm đầy đủ là trách nhiệm của công ty.","d) Người lao động không cần quan tâm đến hợp đồng lao động."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hợp đồng bảo vệ quyền lợi, cần đọc kĩ trước khi kí.","points":1},{"type":"short","level":"VD","q":"Sự thoả thuận giữa người lao động và người sử dụng lao động về việc làm, lương, điều kiện làm việc được ghi nhận bằng văn bản gọi là hợp đồng ... (2 từ)","answer":"lao động","explain":"Hợp đồng lao động.","points":0.5},{"type":"short","level":"VDC","q":"Mô hình kinh tế mà người dân chia sẻ tài sản, dịch vụ qua nền tảng số (xe công nghệ, cho thuê nhà...) gọi là kinh tế ... (Điền 2 từ)","answer":"chia sẻ","explain":"Kinh tế chia sẻ tạo nhiều việc làm linh hoạt.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Để tìm việc làm, người lao động có thể","options":["A. đến sàn giao dịch việc làm, nộp hồ sơ trực tuyến, nhờ người giới thiệu.","B. ngồi nhà chờ việc đến.","C. mua việc làm.","D. không cần làm gì."],"answer":"A","explain":"Chủ động tìm việc qua nhiều kênh.","points":0.25},{"type":"mcq","level":"NB","q":"Khi kí hợp đồng lao động, người lao động cần","options":["A. đọc kĩ các điều khoản về lương, thời giờ làm việc, bảo hiểm.","B. kí ngay không cần đọc.","C. đưa cho người khác kí hộ.","D. không cần giữ bản hợp đồng."],"answer":"A","explain":"Đọc kĩ hợp đồng để bảo vệ quyền lợi của mình.","points":0.25},{"type":"mcq","level":"NB","q":"Mức lương tối thiểu vùng là","options":["A. mức lương thấp nhất mà người sử dụng lao động phải trả cho người lao động.","B. mức lương cao nhất.","C. mức lương trung bình.","D. tiền thưởng."],"answer":"A","explain":"Lương tối thiểu vùng là sàn bảo vệ người lao động.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Nhà nước quy định mức lương tối thiểu vùng?","options":["A. Để tăng thuế.","B. Để bảo vệ người lao động, đảm bảo mức sống tối thiểu.","C. Để doanh nghiệp khó khăn.","D. Để giảm việc làm."],"answer":"B","explain":"Lương tối thiểu bảo vệ người lao động khỏi bị trả lương quá thấp.","points":0.25},{"type":"mcq","level":"TH","q":"Doanh nghiệp trả lương thấp hơn mức tối thiểu vùng sẽ","options":["A. được khen thưởng.","B. bị xử phạt vi phạm hành chính.","C. được giảm thuế.","D. không sao cả."],"answer":"B","explain":"Vi phạm quy định về tiền lương — bị xử phạt.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn An được nhận vào làm với lời hứa miệng lương 8 triệu, không kí hợp đồng. 2 tháng sau công ty chỉ trả 5 triệu. Bài học là","options":["A. tin tưởng hoàn toàn vào lời hứa.","B. phải kí hợp đồng lao động bằng văn bản để bảo vệ quyền lợi.","C. nghỉ việc ngay.","D. chấp nhận."],"answer":"B","explain":"Hợp đồng văn bản là căn cứ pháp lí bảo vệ người lao động.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hợp đồng lao động bảo vệ quyền lợi cả hai bên.","b) Người lao động nên đọc kĩ hợp đồng trước khi kí.","c) Lương tối thiểu vùng là mức sàn bảo vệ người lao động.","d) Doanh nghiệp được trả lương thấp hơn mức tối thiểu nếu khó khăn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: không được trả thấp hơn mức tối thiểu.","points":1},{"type":"truefalse","level":"VDC","q":"Chị Lan làm giúp việc theo giờ qua ứng dụng, thu nhập 9 triệu đồng một tháng, chủ động sắp xếp thời gian, được khách hàng đánh giá tốt. Xét tính đúng, sai:","statements":["a) Đây là việc làm hợp pháp, tạo thu nhập chính đáng.","b) Công việc này thể hiện xu hướng việc làm linh hoạt.","c) Chị Lan cần trang bị kĩ năng giao tiếp, uy tín để giữ khách.","d) Chỉ công việc văn phòng mới được coi là việc làm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mọi công việc hợp pháp tạo thu nhập đều là việc làm.","points":1},{"type":"short","level":"VD","q":"Mức lương thấp nhất mà người sử dụng lao động phải trả cho người lao động gọi là lương tối thiểu ... (1 từ)","answer":"vùng","explain":"Lương tối thiểu vùng.","points":0.5},{"type":"short","level":"VDC","q":"Khi quyền lợi bị xâm phạm, người lao động có quyền ... đến cơ quan chức năng để được bảo vệ. (Điền 2 từ)","answer":"khiếu nại","explain":"Người lao động có quyền khiếu nại, tố cáo hành vi vi phạm pháp luật lao động.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Thị trường lao động có vai trò gì đối với người sử dụng lao động?","options":["A. Giúp tuyển được lao động phù hợp, nâng cao hiệu quả sản xuất.","B. Giúp trốn thuế.","C. Giúp không phải trả lương.","D. Không có vai trò."],"answer":"A","explain":"Tuyển đúng người, đúng việc nâng cao hiệu quả.","points":0.25},{"type":"mcq","level":"NB","q":"Để nâng cao chất lượng nguồn nhân lực, Nhà nước cần","options":["A. đầu tư cho giáo dục, đào tạo nghề.","B. đóng cửa trường học.","C. cấm học nghề.","D. giảm đầu tư giáo dục."],"answer":"A","explain":"Đầu tư giáo dục – đào tạo là then chốt.","points":0.25},{"type":"mcq","level":"NB","q":"Người lao động có quyền","options":["A. được trả lương đầy đủ, làm việc trong điều kiện an toàn.","B. đình công bừa bãi.","C. phá hoại tài sản công ty.","D. nghỉ việc không báo trước."],"answer":"A","explain":"Quyền cơ bản: lương đủ, an toàn lao động, bảo hiểm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao lao động có trình độ, kĩ năng tốt thường có thu nhập cao?","options":["A. Vì cung lao động chất lượng cao khan hiếm hơn so với cầu.","B. Vì họ quen biết rộng.","C. Vì Nhà nước quy định.","D. Vì may mắn."],"answer":"A","explain":"Quy luật cung cầu lao động: khan hiếm thì giá (lương) cao.","points":0.25},{"type":"mcq","level":"TH","q":"Một sinh viên mới ra trường nên làm gì để nhanh có việc làm?","options":["A. Ngồi chờ việc tốt đến.","B. Chủ động nộp hồ sơ nhiều nơi, trau dồi kĩ năng, sẵn sàng thử việc.","C. Kén chọn, từ chối mọi công việc.","D. Bỏ cuộc."],"answer":"B","explain":"Chủ động, linh hoạt, tích lũy kinh nghiệm.","points":0.25},{"type":"mcq","level":"VD","q":"Công ty của bạn Minh áp dụng làm việc 4 ngày một tuần, 1 ngày làm từ xa, năng suất vẫn đảm bảo. Đây là","options":["A. vi phạm pháp luật.","B. mô hình việc làm linh hoạt, hiện đại.","C. bóc lột lao động.","D. thất nghiệp."],"answer":"B","explain":"Việc làm linh hoạt là xu hướng mới, nếu đảm bảo quyền lợi người lao động.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lao động chất lượng cao được trả lương xứng đáng.","b) Người lao động cần học tập suốt đời.","c) Doanh nghiệp phải đảm bảo an toàn lao động.","d) Thị trường lao động chỉ có lợi cho doanh nghiệp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: có lợi cho cả người lao động và xã hội.","points":1},{"type":"truefalse","level":"VDC","q":"Hợp tác xã nông nghiệp X liên kết với trường cao đẳng nghề đào tạo 50 thanh niên địa phương thành thợ vận hành máy nông nghiệp, sau đó tuyển vào làm việc với lương 10 triệu đồng một tháng. Xét tính đúng, sai:","statements":["a) Đây là mô hình đào tạo gắn với nhu cầu tuyển dụng.","b) Mô hình này giải quyết việc làm tại chỗ cho thanh niên.","c) Người lao động được đào tạo bài bản, thu nhập ổn định.","d) Đào tạo nghề không cần thiết trong nông nghiệp hiện đại."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: mô hình hiệu quả. d) Sai: nông nghiệp hiện đại rất cần lao động có kĩ thuật.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Người lao động cần không ngừng ... để nâng cao trình độ, đáp ứng yêu cầu tuyển dụng. (Điền 2 từ)","answer":"học tập","explain":"Không ngừng học tập, nâng cao trình độ, kĩ năng.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại, trên thị trường lao động, tiền lương được hình thành qua sự ... giữa người lao động và người sử dụng lao động. (Điền 2 từ)","answer":"thoả thuận","explain":"Tiền lương, điều kiện làm việc được hình thành qua thoả thuận hai bên.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Câu nào sau đây đúng về thị trường lao động?","options":["A. Là nơi gặp gỡ của người lao động và người sử dụng lao động.","B. Là nơi mua bán lương thực.","C. Là nơi Nhà nước phân công lao động.","D. Là chợ đầu mối."],"answer":"A","explain":"Đúng định nghĩa SGK.","points":0.25},{"type":"mcq","level":"NB","q":"Câu nào sau đây đúng về việc làm?","options":["A. Là hoạt động lao động tạo ra thu nhập, không bị pháp luật cấm.","B. Là mọi hoạt động kiếm tiền.","C. Chỉ là công việc nhà nước.","D. Là hoạt động tình nguyện."],"answer":"A","explain":"Đúng định nghĩa SGK.","points":0.25},{"type":"mcq","level":"NB","q":"Hoạt động nào sau đây KHÔNG phải là việc làm?","options":["A. Bán hàng online.","B. Làm công nhân.","C. Buôn bán ma tuý.","D. Dạy học."],"answer":"C","explain":"Buôn ma tuý bị pháp luật cấm nên không phải việc làm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói việc làm có vai trò quan trọng với mỗi người?","options":["A. Vì việc làm mang lại thu nhập, giúp phát triển bản thân và khẳng định giá trị.","B. Vì không làm vẫn có ăn.","C. Vì việc làm chỉ để giết thời gian.","D. Vì việc làm không quan trọng."],"answer":"A","explain":"Việc làm: thu nhập, phát triển bản thân, đóng góp xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Để có việc làm tốt, học sinh THPT cần","options":["A. học tập tốt, rèn kĩ năng, định hướng nghề nghiệp đúng.","B. bỏ học đi làm sớm.","C. chỉ chơi game.","D. chờ may mắn."],"answer":"A","explain":"Hành trang việc làm: kiến thức, kĩ năng, định hướng đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Một doanh nghiệp muốn tuyển lao động gắn bó lâu dài. Biện pháp tốt nhất là","options":["A. trả lương thấp.","B. trả lương xứng đáng, đảm bảo quyền lợi, tạo môi trường làm việc tốt.","C. đe dọa sa thải.","D. không kí hợp đồng."],"answer":"B","explain":"Đãi ngộ tốt giữ chân lao động giỏi.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Việc làm phải tạo ra thu nhập hợp pháp.","b) Mọi công việc có thu nhập đều là việc làm.","c) Thị trường lao động kết nối người cần việc và người cần tuyển.","d) Hợp đồng lao động bảo vệ quyền lợi các bên."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: phải không bị pháp luật cấm. c), d) Đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Bạn Nam học nghề đầu bếp 2 năm, ra trường được nhà hàng tuyển với lương 9 triệu đồng một tháng, sau 3 năm lên bếp trưởng lương 18 triệu. Xét tính đúng, sai:","statements":["a) Học nghề là con đường lập nghiệp chính đáng.","b) Tay nghề cao, kinh nghiệm giúp tăng thu nhập.","c) Chỉ có bằng đại học mới có thu nhập cao.","d) Kiên trì theo nghề, nâng cao tay nghề là hướng đi đúng."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: nghề nào giỏi cũng có thu nhập tốt.","points":1},{"type":"short","level":"VD","q":"Hoàn thành: Thị trường lao động là nơi gặp gỡ giữa bên cung (người lao động) và bên ... (người sử dụng lao động). (1 từ)","answer":"cầu","explain":"Cung – cầu sức lao động.","points":0.5},{"type":"short","level":"VDC","q":"Để bảo vệ mình, trước khi đi làm người lao động nên yêu cầu kí hợp đồng lao động bằng ... (Điền 1 từ)","answer":"văn bản","explain":"Hợp đồng bằng văn bản là căn cứ pháp lí.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Nhân tố nào sau đây KHÔNG ảnh hưởng đến thị trường lao động?","options":["A. Kinh tế.","B. Pháp luật.","C. Màu mắt của người lao động.","D. Khoa học – công nghệ."],"answer":"C","explain":"Các nhân tố: kinh tế, pháp luật, dân số, đào tạo, công nghệ, hội nhập.","points":0.25},{"type":"mcq","level":"NB","q":"Xu hướng nào sau đây đúng về tuyển dụng hiện nay?","options":["A. Ưu tiên lao động chất lượng cao, đa kĩ năng.","B. Chỉ cần lao động phổ thông.","C. Không cần kĩ năng mềm.","D. Tuyển bừa bãi."],"answer":"A","explain":"Xu hướng: chất lượng cao, đa kĩ năng.","points":0.25},{"type":"mcq","level":"NB","q":"Người sử dụng lao động có nghĩa vụ","options":["A. trả lương đầy đủ, đóng bảo hiểm, đảm bảo an toàn lao động.","B. bóc lột tối đa.","C. phân biệt đối xử.","D. sa thải tuỳ tiện."],"answer":"A","explain":"Nghĩa vụ theo Bộ luật Lao động.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao kĩ năng mềm quan trọng không kém chuyên môn?","options":["A. Vì công việc hiện đại đòi hỏi phối hợp, giao tiếp, thích ứng.","B. Vì chuyên môn không cần thiết.","C. Vì kĩ năng mềm thay thế chuyên môn.","D. Vì nhà tuyển dụng thích vậy."],"answer":"A","explain":"Làm việc nhóm, giao tiếp, thích ứng là yêu cầu thực tế.","points":0.25},{"type":"mcq","level":"TH","q":"Một người lao động bị tai nạn lao động khi làm việc. Theo pháp luật, người sử dụng lao động phải","options":["A. mặc kệ.","B. chịu trách nhiệm, bồi thường, đảm bảo chế độ theo quy định.","C. sa thải ngay.","D. đổ lỗi cho người lao động."],"answer":"B","explain":"Trách nhiệm đảm bảo an toàn lao động và chế độ tai nạn lao động.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Hoa 35 tuổi, làm kế toán 10 năm, nay muốn chuyển sang nghề nhân sự. Lời khuyên phù hợp là","options":["A. không thể chuyển nghề ở tuổi này.","B. học thêm chứng chỉ nhân sự, tận dụng kinh nghiệm kế toán để chuyển đổi.","C. nghỉ việc ở nhà.","D. chờ công ty điều chuyển."],"answer":"B","explain":"Học tập suốt đời, chuyển đổi linh hoạt theo nhu cầu thị trường.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giáo dục – đào tạo tốt nâng cao chất lượng nguồn nhân lực.","b) Công nghệ làm thay đổi cơ cấu việc làm.","c) Hội nhập tạo thêm cơ hội việc làm.","d) Dân số không ảnh hưởng đến thị trường lao động."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: dân số ảnh hưởng đến cung lao động.","points":1},{"type":"truefalse","level":"VDC","q":"Tỉnh B tổ chức sàn giao dịch việc làm trực tuyến mỗi quý, kết nối 200 doanh nghiệp với 5000 lao động; đồng thời hỗ trợ 1000 lao động học nghề miễn phí. Xét tính đúng, sai:","statements":["a) Đây là cách Nhà nước hỗ trợ thị trường lao động.","b) Sàn giao dịch giúp giảm thời gian tìm việc của người lao động.","c) Đào tạo nghề miễn phí giúp nâng chất lượng nguồn nhân lực.","d) Người lao động không cần chủ động, cứ chờ sàn giao dịch."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: vẫn cần chủ động học tập, tìm việc.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Lao động ... là lao động có trình độ, kĩ năng tốt, được thị trường săn đón. (2 từ: ... chất lượng cao)","answer":"chất lượng cao","explain":"Lao động chất lượng cao.","points":0.5},{"type":"short","level":"VDC","q":"Trong thời đại 4.0, bên cạnh chuyên môn, người lao động cần thành thạo công nghệ số, hay còn gọi là kĩ năng ... (Điền 1 từ)","answer":"số","explain":"Kĩ năng số là yêu cầu tất yếu.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tóm lại, để thành công trên thị trường lao động, người lao động cần","options":["A. trình độ, kĩ năng, thái độ tốt và không ngừng học hỏi.","B. quen biết rộng.","C. may mắn.","D. ngoại hình đẹp."],"answer":"A","explain":"Năng lực + thái độ + học tập suốt đời là chìa khoá.","points":0.25},{"type":"mcq","level":"NB","q":"Để thị trường lao động phát triển lành mạnh, Nhà nước cần","options":["A. hoàn thiện pháp luật lao động, có chính sách việc làm, dạy nghề.","B. cấm người dân tìm việc.","C. để mặc tự phát.","D. tăng thuế lao động."],"answer":"A","explain":"Khung pháp luật + chính sách việc làm.","points":0.25},{"type":"mcq","level":"NB","q":"Để thu hút và giữ chân lao động giỏi, doanh nghiệp nên","options":["A. trả lương xứng đáng, đảm bảo quyền lợi, môi trường tốt.","B. trả lương thấp.","C. bóc lột.","D. đe dọa."],"answer":"A","explain":"Đãi ngộ tốt giữ chân nhân tài.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa thị trường lao động và vấn đề thất nghiệp là","options":["A. thị trường lao động vận hành tốt giúp giảm thất nghiệp.","B. không liên quan.","C. thị trường lao động gây thất nghiệp.","D. thất nghiệp giúp thị trường phát triển."],"answer":"A","explain":"Kết nối cung cầu lao động hiệu quả giúp giảm thất nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao học sinh cần tìm hiểu về thị trường lao động từ khi còn ngồi trên ghế nhà trường?","options":["A. Để định hướng nghề nghiệp đúng, chuẩn bị hành trang việc làm.","B. Để bỏ học sớm.","C. Không cần thiết.","D. Để chơi nhiều hơn."],"answer":"A","explain":"Định hướng sớm giúp chọn nghề phù hợp, tránh thất nghiệp.","points":0.25},{"type":"mcq","level":"VD","q":"Trong buổi tư vấn hướng nghiệp, em sẽ khuyên bạn chọn nghề dựa trên","options":["A. sở thích, năng lực bản thân và nhu cầu của thị trường lao động.","B. phong trào, bạn bè chọn gì mình chọn nấy.","C. nghề nào lương cao nhất hiện tại.","D. ý muốn của người khác."],"answer":"A","explain":"Ba yếu tố: sở thích, năng lực, nhu cầu thị trường.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Người lao động là bên cung sức lao động.","b) Người sử dụng lao động là bên cầu sức lao động.","c) Tiền lương là giá cả của sức lao động.","d) Việc làm bao gồm cả hoạt động bị pháp luật cấm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: việc làm không bao gồm hoạt động bị cấm.","points":1},{"type":"truefalse","level":"VDC","q":"Bạn An đang học lớp 11, muốn sau này làm kĩ sư phần mềm. An học giỏi toán, tin, đang tự học lập trình và tiếng Anh. Xét tính đúng, sai:","statements":["a) An đã có định hướng nghề nghiệp rõ ràng, phù hợp năng lực.","b) Tự học lập trình, tiếng Anh là chuẩn bị tốt cho nghề đã chọn.","c) Ngành phần mềm đang có nhu cầu tuyển dụng lớn.","d) An không cần học thêm gì nữa vì đã giỏi toán, tin."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: công nghệ thay đổi nhanh, cần học tập suốt đời.","points":1},{"type":"short","level":"VD","q":"Hoàn thành: Muốn có việc làm tốt, người lao động phải có trình độ, kĩ năng và không ngừng ... (Điền 2 từ)","answer":"học hỏi","explain":"Không ngừng học hỏi, học tập suốt đời.","points":0.5},{"type":"short","level":"VDC","q":"Thị trường lao động vận hành tốt, kết nối hiệu quả cung – cầu sẽ góp phần giảm tỉ lệ ... (Điền 2 từ)","answer":"thất nghiệp","explain":"Giảm thất nghiệp nhờ kết nối cung cầu lao động tốt.","points":0.5}]}]}</script>
