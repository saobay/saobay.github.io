{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Thất nghiệp được hiểu là tình trạng","options":["A. mọi người không có việc làm.","B. người trong độ tuổi lao động, có khả năng lao động, không có việc làm nhưng đang tích cực tìm kiếm việc làm.","C. người già đã nghỉ hưu không đi làm.","D. học sinh đang đi học không đi làm."],"answer":"B","explain":"Đúng định nghĩa SGK: đủ 4 điều kiện — trong độ tuổi, có khả năng, không có việc, đang tìm việc.","points":0.25},{"type":"mcq","level":"NB","q":"Người nào sau đây được tính là thất nghiệp?","options":["A. Bà nội trợ ở nhà chăm con, không tìm việc.","B. Sinh viên đi học toàn thời gian.","C. Anh Nam 25 tuổi, bị cho nghỉ việc và đang nộp hồ sơ xin việc khắp nơi.","D. Cụ già 75 tuổi đã nghỉ hưu."],"answer":"C","explain":"Anh Nam đủ 4 điều kiện. Các trường hợp còn lại thiếu điều kiện đang tìm việc hoặc ngoài độ tuổi.","points":0.25},{"type":"mcq","level":"NB","q":"Thất nghiệp tạm thời là","options":["A. thất nghiệp do chuyển từ việc này sang việc khác, cần thời gian tìm việc mới.","B. thất nghiệp do suy thoái kinh tế.","C. thất nghiệp do kĩ năng lạc hậu.","D. thất nghiệp vĩnh viễn."],"answer":"A","explain":"Thất nghiệp tạm thời: trong thời gian chuyển việc, tìm việc mới.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao người nội trợ tự nguyện ở nhà chăm con không được tính là thất nghiệp?","options":["A. Vì họ ngoài độ tuổi lao động.","B. Vì họ không tích cực tìm kiếm việc làm.","C. Vì họ không có khả năng lao động.","D. Vì họ có thu nhập cao."],"answer":"B","explain":"Thiếu điều kiện đang tìm việc nên không phải thất nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Công nhân dệt may bị máy tự động thay thế, không biết vận hành máy mới nên mất việc. Đây là thất nghiệp","options":["A. tạm thời.","B. cơ cấu.","C. chu kì.","D. tự nguyện."],"answer":"B","explain":"Kĩ năng lạc hậu, không đáp ứng yêu cầu mới của cơ cấu kinh tế — thất nghiệp cơ cấu.","points":0.25},{"type":"mcq","level":"VD","q":"Dịch  phần trăm? (Điền số)","answer":"4","explain":"2000 / 50000 x 100% = 4%.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Thất nghiệp cơ cấu là","options":["A. thất nghiệp do chuyển việc.","B. thất nghiệp do cơ cấu kinh tế thay đổi, kĩ năng người lao động lạc hậu.","C. thất nghiệp do suy thoái kinh tế.","D. thất nghiệp do lười biếng."],"answer":"B","explain":"Thất nghiệp cơ cấu: cơ cấu kinh tế thay đổi, kĩ năng lạc hậu không đáp ứng yêu cầu mới.","points":0.25},{"type":"mcq","level":"NB","q":"Thất nghiệp chu kì là","options":["A. thất nghiệp do suy thoái kinh tế, tổng cầu giảm.","B. thất nghiệp do chuyển việc.","C. thất nghiệp do kĩ năng lạc hậu.","D. thất nghiệp do nghỉ hè."],"answer":"A","explain":"Thất nghiệp chu kì: suy thoái kinh tế → doanh nghiệp thu hẹp → sa thải lao động.","points":0.25},{"type":"mcq","level":"NB","q":"Tỉ lệ thất nghiệp tự nhiên gồm","options":["A. thất nghiệp tạm thời và thất nghiệp cơ cấu.","B. thất nghiệp chu kì.","C. mọi loại thất nghiệp.","D. chỉ thất nghiệp tạm thời."],"answer":"A","explain":"Thất nghiệp tự nhiên = tạm thời + cơ cấu, khi nền kinh tế hoạt động bình thường.","points":0.25},{"type":"mcq","level":"TH","q":"Anh Nam nghỉ công ty cũ, mất 2 tháng tìm việc mới. Trong 2 tháng đó, anh Nam thuộc loại thất nghiệp","options":["A. cơ cấu.","B. chu kì.","C. tạm thời.","D. không phải thất nghiệp."],"answer":"C","explain":"Chuyển việc, cần thời gian tìm việc mới — thất nghiệp tạm thời.","points":0.25},{"type":"mcq","level":"TH","q":"Ảnh hưởng của thất nghiệp đối với người lao động KHÔNG bao gồm","options":["A. mất thu nhập, đời sống khó khăn.","B. tâm lí bi quan, kĩ năng mai một.","C. có thêm thời gian học kĩ năng mới nếu chủ động.","D. được tăng lương."],"answer":"D","explain":"Thất nghiệp thì mất thu nhập, không có chuyện tăng lương; C là hướng ứng phó tích cực.","points":0.25},{"type":"mcq","level":"VD","q":"Nhiều nhà máy lắp robot thay công nhân khâu lắp ráp đơn giản. Để không rơi vào thất nghiệp cơ cấu, ":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Lực lượng lao động bao gồm","options":["A. mọi công dân trong nước.","B. số người có việc làm cộng số người thất nghiệp.","C. chỉ người đang đi làm.","D. chỉ người thất nghiệp."],"answer":"B","explain":"Lực lượng lao động = có việc làm + thất nghiệp.","points":0.25},{"type":"mcq","level":"NB","q":"Nguyên nhân nào sau đây gây ra thất nghiệp chu kì?","options":["A. Người lao động chuyển việc.","B. Suy thoái kinh tế, tổng cầu giảm.","C. Kĩ năng lạc hậu.","D. Nghỉ phép năm."],"answer":"B","explain":"Thất nghiệp chu kì do suy thoái kinh tế.","points":0.25},{"type":"mcq","level":"NB","q":"Bảo hiểm thất nghiệp có tác dụng","options":["A. trợ cấp cho người mất việc trong thời gian tìm việc mới.","B. tăng lương cho người đang đi làm.","C. phạt người thất nghiệp.","D. cấm sa thải lao động."],"answer":"A","explain":"Bảo hiểm thất nghiệp trợ cấp, hỗ trợ học nghề cho người mất việc.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao thất nghiệp gây lãng phí nguồn nhân lực của xã hội?","options":["A. Vì người thất nghiệp không tạo ra của cải dù đang trong độ tuổi lao động.","B. Vì người thất nghiệp được nghỉ ngơi.","C. Vì Nhà nước phải tăng lương.","D. Vì doanh nghiệp có lợi."],"answer":"A","explain":"Bao nhiêu người trong độ tuổi lao động mà không làm việc = lãng phí nguồn lực xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Thất nghiệp kéo dài có thể dẫn đến hậu quả xã hội nào?","options":["A. Tăng tệ nạn xã hội, bất ổn.","B. Kinh tế phát triển nhanh.","C. Mọi người hạnh phúc hơn.","D. Giảm chi ngân sách."],"answer":"A","explain":"Một bộ phận người thất nghiệp sa vào tệ nạn; ngân sách phải chi trợ cấp; xã hội bất ổn.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Lan là công nhân may bị máy tự động thay thế. Chị đăng kí học nghề pha chế miễn phí rồi mở quán cà phê, còn tạo việc làm cho 2 người. Việc làm của chị Lan là","options":["A. đầu hàng trước thất nghiệp.","B. tấm gương chủ động học nghề mới, khởi nghiệp để vượt qua thất nghiệp cơ cấu.","C. vi phạm pháp luật.","D. trốn tránh trách nhiệm."],"answer":"B","explain":"Học nghề mới, khởi nghiệp, tự tạo việc làm — cách ứng phó tích cực, đúng đắn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ảnh hưởng của thất nghiệp:","statements":["a) Người thất nghiệp bị mất thu nhập, đời sống khó khăn.","b) Thất nghiệp kéo dài làm kĩ năng người lao động mai một.","c) Thất nghiệp gây lãng phí nguồn nhân lực xã hội.","d) Thất nghiệp không ảnh hưởng gì đến ngân sách nhà nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ngân sách phải chi trợ cấp thất nghiệp, an sinh.","points":1},{"type":"truefalse","level":"VDC","q":"Sau khi tốt nghiệp THPT, bạn Hùng không thi đại học mà học nghề sửa chữa điện lạnh 1 năm, rồi xin vào làm cho một công ty với thu nhập ổn định; bạn thân của Hùng học đại học 4 năm ra trường vẫn chưa xin được việc. Xét tính đúng, sai:","statements":["a) Học nghề là con đường lập nghiệp chính đáng, phù hợp nhu cầu thị trường.","b) Bằng cấp cao luôn đảm bảo có việc làm tốt.","c) Chọn nghề cần căn cứ nhu cầu thị trường lao động và năng lực bản thân.","d) Thất nghiệp sau tốt nghiệp một phần do chọn ngành không phù hợp nhu cầu xã hội."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: bằng cấp không đảm bảo việc làm nếu thiếu kĩ năng, chọn sai ngành. c), d) Đúng: định hướng nghề nghiệp theo nhu cầu thị trường.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Thất nghiệp ... do suy thoái kinh tế, tổng cầu giảm. (2 từ)","answer":"chu kì","explain":"Thất nghiệp chu kì do suy thoái kinh tế.","points":0.5},{"type":"short","level":"VDC","q":"Tỉ lệ thất nghiệp tự nhiên gồm thất nghiệp tạm thời và thất nghiệp ... (Điền 2 từ)","answer":"cơ cấu","explain":"Thất nghiệp tự nhiên = tạm thời + cơ cấu.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Biện pháp nào sau đây của Nhà nước giúp giải quyết thất nghiệp?","options":["A. Thu hút đầu tư, hỗ trợ doanh nghiệp mở rộng sản xuất để tạo việc làm.","B. Cấm doanh nghiệp tuyển lao động.","C. Tăng thuế với người thất nghiệp.","D. Đóng cửa các trung tâm dạy nghề."],"answer":"A","explain":"Tạo việc làm bằng thu hút đầu tư, phát triển doanh nghiệp là biện pháp căn cơ.","points":0.25},{"type":"mcq","level":"NB","q":"Để không bị thất nghiệp cơ cấu trong thời đại công nghệ, người lao động cần","options":["A. học tập suốt đời, nâng cao kĩ năng.","B. giữ nguyên kĩ năng cũ.","C. phản đối công nghệ.","D. nghỉ việc sớm."],"answer":"A","explain":"Học tập suốt đời, cập nhật kĩ năng mới để thích ứng.","points":0.25},{"type":"mcq","level":"NB","q":"Xuất khẩu lao động có tác dụng","options":["A. giảm áp lực việc làm trong nước, tăng thu nhập cho người lao động.","B. tăng thất nghiệp trong nước.","C. làm giảm ngoại tệ.","D. không có tác dụng gì."],"answer":"A","explain":"Đưa lao động đi làm việc ở nước ngoài theo hợp đồng giúp giải quyết việc làm, tăng thu nhập.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao càng thất nghiệp lâu, người lao động càng khó xin được việc?","options":["A. Vì họ giàu lên.","B. Vì kĩ năng mai một, nhà tuyển dụng e ngại.","C. Vì họ không muốn đi làm.","D. Vì pháp luật cấm."],"answer":"B","explain":"Lâu không làm việc, tay nghề giảm sút, mất tự tin — vòng luẩn quẩn của thất nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Sàn giao dịch việc làm, ngày hội việc làm có tác dụng","options":["A. kết nối người lao động với doanh nghiệp, giảm thất nghiệp tạm thời.","B. tăng thất nghiệp.","C. phạt doanh nghiệp.","D. không có tác dụng."],"answer":"A","explain":"Thông tin thị trường lao động giúp người tìm việc và doanh nghiệp gặp nhau nhanh hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Một sinh viên tốt nghiệp loại giỏi nhưng 1 năm không xin được việc vì chỉ nộp đơn vào 2 cơ quan nhà nước và từ chối mọi công việc khác. Nguyên nhân chính là","options":["A. nền kinh tế suy thoái.","B. kén chọn quá mức, thiếu chủ động thích ứng với thị trường lao động.","C. không có bằng cấp.","D. bị phân biệt đối xử."],"answer":"B","explain":"Kén chọn, thụ động là nguyên nhân chủ quan phổ biến; cần linh hoạt, sẵn sàng thử việc ở lĩnh vực khác.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về biện pháp giải quyết thất nghiệp:","statements":["a) Nhà nước tạo việc làm bằng cách thu hút đầu tư, hỗ trợ doanh nghiệp.","b) Đào tạo nghề giúp người lao động nâng cao kĩ năng, dễ xin việc.","c) Bảo hiểm thất nghiệp trợ cấp cho người mất việc khi tìm việc mới.","d) Người lao động không cần làm gì, chờ Nhà nước lo việc làm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bản thân người lao động phải chủ động học tập, tìm việc.","points":1},{"type":"truefalse","level":"VDC","q":"Xã A có 200 thanh niên trong độ tuổi lao động nhưng chỉ có 120 việc làm tại địa phương; nhiều bạn đi làm ăn xa, số còn lại ở nhà chơi. Chính quyền xã mở lớp dạy nghề đan lát, may mặc miễn phí và mời doanh nghiệp về đặt xưởng. Xét tính đúng, sai:","statements":["a) Thiếu việc làm tại chỗ là nguyên nhân gây thất nghiệp ở xã A.","b) Dạy nghề miễn phí giúp thanh niên có kĩ năng, dễ xin việc.","c) Mời doanh nghiệp về đặt xưởng là cách tạo việc làm tại chỗ.","d) Thanh niên ở nhà chơi, không tìm việc thì không phải thất nghiệp."],"answer":["T","T","T","T"],"explain":"a), b), c) Đúng: đúng nguyên nhân và giải pháp. d) Đúng: không tìm việc thì không đủ điều kiện là thất nghiệp.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Thất nghiệp ... do cơ cấu kinh tế thay đổi, kĩ năng lạc hậu. (2 từ)","answer":"cơ cấu","explain":"Thất nghiệp cơ cấu.","points":0.5},{"type":"short","level":"VDC","q":"Người lao động cần làm gì để thích ứng với sự thay đổi của thị trường lao động trong thời đại số? (Trả lời 3 từ: học tập ...)","answer":"học tập suốt đời","explain":"Học tập suốt đời, liên tục cập nhật kĩ năng mới là cách tốt nhất để không bị đào thải.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Điều kiện nào sau đây KHÔNG cần thiết để một người được tính là thất nghiệp?","options":["A. Trong độ tuổi lao động.","B. Có khả năng lao động.","C. Đang tích cực tìm kiếm việc làm.","D. Có bằng đại học."],"answer":"D","explain":"Bằng cấp không phải điều kiện; 4 điều kiện là: độ tuổi, khả năng, không có việc, đang tìm việc.","points":0.25},{"type":"mcq","level":"NB","q":"Thất nghiệp tự nhiên là","options":["A. tỉ lệ thất nghiệp khi kinh tế hoạt động bình thường, gồm thất nghiệp tạm thời và cơ cấu.","B. tỉ lệ thất nghiệp khi suy thoái.","C. tỉ lệ thất nghiệp bằng 0%.","D. tỉ lệ thất nghiệp của nông dân."],"answer":"A","explain":"Thất nghiệp tự nhiên = tạm thời + cơ cấu khi kinh tế bình thường.","points":0.25},{"type":"mcq","level":"NB","q":"Nguyên nhân nào sau đây KHÔNG gây ra thất nghiệp?","options":["A. Suy thoái kinh tế.","B. Dân số tăng nhanh.","C. Người lao động không ngừng học tập, nâng cao kĩ năng.","D. Tự động hoá thay thế lao động."],"answer":"C","explain":"Học tập nâng cao kĩ năng giúp tránh thất nghiệp, không gây ra thất nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao thất nghiệp tạm thời được coi là bình thường, khó tránh?","options":["A. Vì ai cũng phải mất thời gian chuyển việc, tìm việc phù hợp.","B. Vì Nhà nước muốn vậy.","C. Vì doanh nghiệp thích sa thải.","D. Vì người lao động lười biếng."],"answer":"A","explain":"Chuyển việc cần thời gian tìm kiếm, thương lượng — là hiện tượng bình thường của thị trường lao động.","points":0.25},{"type":"mcq","level":"TH","q":"Thất nghiệp ảnh hưởng đến ngân sách nhà nước như thế nào?","options":["A. Làm tăng thu ngân sách.","B. Phải chi trợ cấp thất nghiệp, an sinh xã hội trong khi thu thuế giảm.","C. Không ảnh hưởng.","D. Giúp tiết kiệm chi tiêu."],"answer":"B","explain":"Thất nghiệp cao: chi trợ cấp tăng, thu thuế thu nhập giảm — gánh nặng ngân sách.","points":0.25},{"type":"mcq","level":"VD","q":"Một tập đoàn công nghệ sa thải 10000 nhân viên vì dùng AI thay thế nhiều khâu. Đây là biểu hiện của","options":["A. thất nghiệp cơ cấu do tiến bộ công nghệ.","B. thất nghiệp chu kì.","C. thất nghiệp tạm thời.","D. không phải thất nghiệp."],"answer":"A","explain":"Công nghệ mới làm kĩ năng cũ lạc hậu, cơ cấu việc làm thay đổi — thất nghiệp cơ cấu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thất nghiệp cần đủ 4 điều kiện: độ tuổi, khả năng, không có việc, đang tìm việc.","b) Thất nghiệp tự nhiên gồm thất nghiệp tạm thời và cơ cấu.","c) Thất nghiệp chu kì do suy thoái kinh tế.","d) Mọi người không có việc làm đều là thất nghiệp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: phải đủ 4 điều kiện.","points":1},{"type":"truefalse","level":"VDC","q":"Bạn Minh tốt nghiệp THPT, gia đình khó khăn. Minh đăng kí học nghề điện công nghiệp miễn phí 6 tháng, vừa học vừa làm thêm; ra nghề được công ty nhận ngay với lương khởi điểm 8 triệu đồng. Xét tính đúng, sai:","statements":["a) Học nghề là lựa chọn đúng đắn, phù hợp với hoàn cảnh và nhu cầu thị trường.","b) Vừa học vừa làm giúp Minh có thêm kinh nghiệm, thu nhập.","c) Chỉ có con đường đại học mới thành công.","d) Chủ động học nghề, tìm việc giúp tránh thất nghiệp sau tốt nghiệp."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: học nghề cũng là con đường thành công chính đáng.","points":1},{"type":"short","level":"VD","q":"Tỉ lệ thất nghiệp = (số người thất nghiệp / lực lượng lao động) x ... (Điền kí hiệu)","answer":"100%","explain":"Tỉ lệ thất nghiệp tính bằng phần trăm: nhân với 100%.","points":0.5},{"type":"short","level":"VDC","q":"Khi nền kinh tế suy thoái, doanh nghiệp thu hẹp sản xuất và sa thải lao động, gây ra thất nghiệp ... (Điền 2 từ)","answer":"chu kì","explain":"Thất nghiệp chu kì do suy thoái kinh tế.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Người lao động bị mất việc do công ty phá sản vì suy thoái kinh tế thuộc loại thất nghiệp","options":["A. tạm thời.","B. cơ cấu.","C. chu kì.","D. tự nguyện."],"answer":"C","explain":"Suy thoái kinh tế → thất nghiệp chu kì.","points":0.25},{"type":"mcq","level":"NB","q":"Để giải quyết thất nghiệp, bản thân người lao động nên","options":["A. ngồi chờ việc làm đến.","B. chủ động học tập, nâng cao kĩ năng và tìm việc.","C. kén chọn, chỉ chờ việc nhẹ lương cao.","D. đổ lỗi cho xã hội."],"answer":"B","explain":"Chủ động học tập, tìm việc là trách nhiệm của bản thân người lao động.","points":0.25},{"type":"mcq","level":"NB","q":"Khởi nghiệp có ý nghĩa gì trong giải quyết thất nghiệp?","options":["A. Tự tạo việc làm cho mình và cho người khác.","B. Làm tăng thất nghiệp.","C. Không có ý nghĩa.","D. Chỉ dành cho người giàu."],"answer":"A","explain":"Khởi nghiệp tạo việc làm cho bản thân và xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao đào tạo nghề lại giúp giảm thất nghiệp cơ cấu?","options":["A. Vì đào tạo nghề giúp người lao động có kĩ năng mới, đáp ứng yêu cầu thay đổi của thị trường.","B. Vì đào tạo nghề cấp bằng đại học.","C. Vì đào tạo nghề miễn phí hoàn toàn.","D. Vì đào tạo nghề cấm sa thải."],"answer":"A","explain":"Thất nghiệp cơ cấu do kĩ năng lạc hậu; đào tạo lại giúp thích ứng.","points":0.25},{"type":"mcq","level":"TH","q":"Trong dịch COVID-19, nhiều lao động ngành du lịch, nhà hàng mất việc. Biện pháp hỗ trợ phù hợp nhất của Nhà nước là","options":["A. trợ cấp thất nghiệp, đào tạo chuyển đổi nghề, hỗ trợ doanh nghiệp phục hồi.","B. cấm họ tìm việc khác.","C. tăng thuế.","D. không làm gì."],"answer":"A","explain":"An sinh + đào tạo chuyển đổi + hỗ trợ doanh nghiệp là gói giải pháp đồng bộ.","points":0.25},{"type":"mcq","level":"VD","q":"Một cử nhân công nghệ thông tin thất nghiệp 2 năm vì chỉ muốn làm đúng chuyên ngành với mức lương cao, từ chối mọi công việc khác. Lời khuyên hợp lí nhất là","options":["A. tiếp tục chờ đợi.","B. linh hoạt chấp nhận công việc phù hợp để tích lũy kinh nghiệm, vừa làm vừa tìm cơ hội tốt hơn.","C. bỏ nghề.","D. đổ lỗi cho nhà trường."],"answer":"B","explain":"Linh hoạt, tích lũy kinh nghiệm từng bước là cách vượt qua thất nghiệp hiệu quả.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Suy thoái kinh tế là nguyên nhân của thất nghiệp chu kì.","b) Kĩ năng lạc hậu là nguyên nhân của thất nghiệp cơ cấu.","c) Chuyển việc là nguyên nhân của thất nghiệp tạm thời.","d) Thất nghiệp không có nguyên nhân nào cả."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: tương ứng từng loại. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Công ty may X ở quê bạn An sa thải 200 công nhân vì chuyển nhà máy sang nước khác có chi phí rẻ hơn. Xét tính đúng, sai:","statements":["a) Đây là biểu hiện của chuyển dịch cơ cấu kinh tế gây thất nghiệp.","b) Công nhân bị sa thải cần được hưởng trợ cấp thôi việc, bảo hiểm thất nghiệp.","c) Chính quyền địa phương nên hỗ trợ đào tạo nghề mới, thu hút đầu tư tạo việc làm.","d) Công nhân chỉ có cách duy nhất là đi làm thuê ở tỉnh khác."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: còn nhiều hướng — học nghề mới, khởi nghiệp, chờ việc làm mới tại chỗ.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Người trong độ tuổi lao động, có khả năng lao động, không có việc làm nhưng đang tìm việc là người ... (2 từ)","answer":"thất nghiệp","explain":"Đó là định nghĩa người thất nghiệp.","points":0.5},{"type":"short","level":"VDC","q":"Để không bị robot thay thế, công nhân cần thường xuyên ... kĩ năng mới. (Điền 2 từ: ... kĩ năng)","answer":"học tập","explain":"Học tập suốt đời, cập nhật kĩ năng mới để thích ứng với tự động hoá.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Tác động của thất nghiệp đối với xã hội KHÔNG bao gồm","options":["A. lãng phí nguồn nhân lực.","B. tăng tệ nạn xã hội.","C. ngân sách phải chi trợ cấp.","D. tăng trưởng kinh tế nhanh."],"answer":"D","explain":"Thất nghiệp kìm hãm tăng trưởng, không thúc đẩy.","points":0.25},{"type":"mcq","level":"NB","q":"Tác động của thất nghiệp đối với người lao động KHÔNG bao gồm","options":["A. mất thu nhập.","B. kĩ năng mai một.","C. tâm lí bi quan.","D. được nghỉ ngơi thoải mái, sung sướng."],"answer":"D","explain":"Thất nghiệp gây khó khăn, stress chứ không phải nghỉ ngơi sung sướng.","points":0.25},{"type":"mcq","level":"NB","q":"Ngày hội việc làm giúp","options":["A. người lao động và doanh nghiệp gặp nhau, giảm thời gian tìm việc.","B. tăng thất nghiệp.","C. giảm lương.","D. đóng cửa doanh nghiệp."],"answer":"A","explain":"Kết nối cung – cầu lao động.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao dân số tăng nhanh có thể gây thất nghiệp?","options":["A. Vì số người đến tuổi lao động vượt số việc làm mới được tạo ra.","B. Vì dân số tăng làm tăng việc làm.","C. Vì người đông thì ai cũng có việc.","D. Vì dân số không liên quan đến việc làm."],"answer":"A","explain":"Cung lao động vượt cầu lao động → thất nghiệp tăng.","points":0.25},{"type":"mcq","level":"TH","q":"Một người thất nghiệp lâu năm, mất tự tin, ngại giao tiếp. Đây là ảnh hưởng về mặt","options":["A. kinh tế.","B. tâm lí.","C. thể chất.","D. pháp luật."],"answer":"B","explain":"Thất nghiệp gây bi quan, mặc cảm, stress — ảnh hưởng tâm lí.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình bạn Hoa có bố bị mất việc do công ty thu hẹp. Cả nhà đã cùng nhau cắt giảm chi tiêu, bố đi học nghề sửa xe máy, mẹ bán hàng online thêm. Cách ứng phó này","options":["A. tiêu cực, buông xuôi.","B. tích cực, chủ động vượt qua khó khăn.","C. vi phạm pháp luật.","D. không có tác dụng."],"answer":"B","explain":"Cả gia đình đồng lòng, chủ động học nghề, tăng thu nhập — ứng phó tích cực.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thất nghiệp làm người lao động mất thu nhập.","b) Thất nghiệp kéo dài làm kĩ năng mai một.","c) Thất nghiệp gây lãng phí nguồn nhân lực xã hội.","d) Thất nghiệp giúp ngân sách nhà nước tăng thu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thất nghiệp làm giảm thu thuế, tăng chi trợ cấp.","points":1},{"type":"truefalse","level":"VDC","q":"Trường THPT của bạn tổ chức ngày hội tư vấn hướng nghiệp, mời doanh nghiệp và trường nghề về giới thiệu. Xét tính đúng, sai:","statements":["a) Đây là hoạt động giúp học sinh định hướng nghề nghiệp đúng đắn.","b) Chọn nghề theo nhu cầu thị trường lao động giúp tránh thất nghiệp sau này.","c) Học sinh chỉ nên chọn nghề theo sở thích, không cần quan tâm thị trường.","d) Hiểu biết về thị trường lao động là hành trang quan trọng của học sinh."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần kết hợp sở thích, năng lực và nhu cầu thị trường.","points":1},{"type":"short","level":"VD","q":"Chính sách trợ cấp cho người mất việc trong thời gian tìm việc mới gọi là bảo hiểm ... (2 từ)","answer":"thất nghiệp","explain":"Bảo hiểm thất nghiệp.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại, để giải quyết thất nghiệp cần sự phối hợp của Nhà nước, doanh nghiệp và bản thân người ... (Điền 2 từ)","answer":"lao động","explain":"Người lao động phải chủ động học tập, tìm việc; Nhà nước và doanh nghiệp tạo điều kiện.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Câu nào sau đây đúng về thất nghiệp?","options":["A. Thất nghiệp là người trong độ tuổi, có khả năng, không có việc nhưng đang tìm việc.","B. Mọi người không đi làm đều thất nghiệp.","C. Người nghỉ hưu là thất nghiệp.","D. Học sinh là thất nghiệp."],"answer":"A","explain":"Đúng định nghĩa SGK.","points":0.25},{"type":"mcq","level":"NB","q":"Thất nghiệp do chuyển việc thuộc loại","options":["A. tạm thời.","B. cơ cấu.","C. chu kì.","D. tự nhiên."],"answer":"A","explain":"Chuyển việc cần thời gian tìm việc mới — tạm thời.","points":0.25},{"type":"mcq","level":"NB","q":"Thất nghiệp do suy thoái kinh tế thuộc loại","options":["A. tạm thời.","B. cơ cấu.","C. chu kì.","D. theo mùa."],"answer":"C","explain":"Suy thoái → chu kì.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói thất nghiệp tự nhiên là bình thường, khó tránh?","options":["A. Vì lúc nào cũng có người chuyển việc và có ngành nghề thay đổi, đó là quy luật của thị trường.","B. Vì Nhà nước muốn duy trì.","C. Vì người lao động thích thất nghiệp.","D. Vì không ai muốn đi làm."],"answer":"A","explain":"Chuyển việc và thay đổi cơ cấu là tất yếu của kinh tế thị trường.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp nào sau đây KHÔNG giúp giảm thất nghiệp?","options":["A. Đào tạo nghề cho lao động.","B. Thu hút đầu tư tạo việc làm.","C. Cấm doanh nghiệp tuyển dụng.","D. Tổ chức sàn giao dịch việc làm."],"answer":"C","explain":"Cấm tuyển dụng làm tăng thất nghiệp.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty khởi nghiệp công nghệ tuyển 50 lập trình viên với lương cao trong khi nhiều cử nhân sư phạm thất nghiệp. Điều này cho thấy thị trường lao động","options":["A. luôn cân bằng.","B. có sự mất cân đối về cơ cấu ngành nghề: thừa nơi này, thiếu nơi kia.","C. không cần lao động.","D. chỉ cần bằng cấp."],"answer":"B","explain":"Mất cân đối cơ cấu: ngành thiếu người, ngành thừa người — cần định hướng đào tạo theo nhu cầu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Người đang tìm việc nhưng chưa có việc là thất nghiệp.","b) Người không tìm việc thì không phải thất nghiệp.","c) Thất nghiệp gây hại cho cả cá nhân và xã hội.","d) Học tập suốt đời giúp tránh thất nghiệp cơ cấu."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng theo nội dung bài học.","points":1},{"type":"truefalse","level":"VDC","q":"Anh Kĩ sư nông nghiệp về quê mở trang trại trồng rau sạch theo tiêu chuẩn VietGAP, thuê 10 lao động địa phương, thu nhập ổn định. Xét tính đúng, sai:","statements":["a) Anh đã tự tạo việc làm cho mình thay vì chờ việc.","b) Mô hình này còn tạo việc làm cho người khác.","c) Khởi nghiệp nông nghiệp công nghệ cao là hướng đi phù hợp xu thế.","d) Chỉ làm công ăn lương mới là việc làm ổn định."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: khởi nghiệp tạo việc làm, phù hợp xu thế. d) Sai: tự kinh doanh thành công cũng ổn định.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Thất nghiệp ... = thất nghiệp tạm thời + thất nghiệp cơ cấu. (2 từ)","answer":"tự nhiên","explain":"Tỉ lệ thất nghiệp tự nhiên.","points":0.5},{"type":"short","level":"VDC","q":"Một trong những nguyên nhân hiện đại gây thất nghiệp cơ cấu là robot và ... thay thế lao động giản đơn. (Điền 2 từ viết tắt)","answer":"AI","explain":"Trí tuệ nhân tạo (AI) và tự động hoá đang thay thế nhiều công việc.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây SAI về thất nghiệp?","options":["A. Thất nghiệp cần người lao động đang tìm việc.","B. Người nghỉ hưu là thất nghiệp.","C. Thất nghiệp gây lãng phí nguồn nhân lực.","D. Thất nghiệp chu kì do suy thoái kinh tế."],"answer":"B","explain":"Người nghỉ hưu ngoài độ tuổi lao động, không phải thất nghiệp.","points":0.25},{"type":"mcq","level":"NB","q":"Khi nền kinh tế phát triển bình thường, loại thất nghiệp nào vẫn tồn tại?","options":["A. Thất nghiệp chu kì.","B. Thất nghiệp tạm thời và cơ cấu (thất nghiệp tự nhiên).","C. Không còn thất nghiệp.","D. Thất nghiệp vĩnh viễn."],"answer":"B","explain":"Thất nghiệp tự nhiên tồn tại ngay cả khi kinh tế bình thường.","points":0.25},{"type":"mcq","level":"NB","q":"Để được hưởng bảo hiểm thất nghiệp, người lao động phải","options":["A. đang đi làm.","B. đã đóng bảo hiểm thất nghiệp và bị mất việc, đang tìm việc.","C. tự nghỉ việc không lí do.","D. ngoài độ tuổi lao động."],"answer":"B","explain":"Điều kiện hưởng: đã đóng bảo hiểm, mất việc không do lỗi, đang tìm việc.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Nhà nước khuyến khích xuất khẩu lao động?","options":["A. Vì muốn giảm dân số.","B. Vì giúp giải quyết việc làm, tăng thu nhập, học hỏi kĩ năng từ nước ngoài.","C. Vì trong nước thừa việc làm.","D. Vì không cần lao động trong nước."],"answer":"B","explain":"Xuất khẩu lao động: giảm áp lực việc làm, tăng thu nhập, nâng cao kĩ năng.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn trẻ thất nghiệp, suốt ngày chơi game, không chịu học nghề hay tìm việc. Thái độ này","options":["A. đáng khuyến khích.","B. tiêu cực, làm tình trạng thất nghiệp kéo dài, kĩ năng mai một.","C. giúp nhanh có việc.","D. không ảnh hưởng gì."],"answer":"B","explain":"Thụ động, buông xuôi làm thất nghiệp kéo dài — cần chủ động thay đổi.","points":0.25},{"type":"mcq","level":"VD","q":"Chính quyền một huyện miền núi mở lớp dạy nghề thêu thổ cẩm, kết nối bán sản phẩm online cho 500 phụ nữ dân tộc. Đây là","options":["A. biện pháp tạo việc làm tại chỗ, phù hợp với điều kiện địa phương.","B. việc làm vô ích.","C. gây thất nghiệp.","D. vi phạm pháp luật."],"answer":"A","explain":"Dạy nghề gắn với thế mạnh địa phương + kết nối tiêu thụ = tạo việc làm bền vững.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lực lượng lao động = có việc làm + thất nghiệp.","b) Tỉ lệ thất nghiệp = thất nghiệp / lực lượng lao động x 100%.","c) Thất nghiệp tự nhiên là bình thường, khó tránh.","d) Mọi loại thất nghiệp đều do lỗi của người lao động."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhiều nguyên nhân khách quan (suy thoái, công nghệ, dịch bệnh).","points":1},{"type":"truefalse","level":"VDC","q":"Sau đại dịch, nhiều lao động tự do (xe ôm công nghệ, bán hàng rong) mất việc nhưng không được hưởng bảo hiểm thất nghiệp vì không đóng bảo hiểm. Xét tính đúng, sai:","statements":["a) Lao động tự do cũng chịu tác động nặng nề của thất nghiệp chu kì.","b) Không đóng bảo hiểm thất nghiệp nên họ khó được trợ cấp chính thức.","c) Nhà nước cần có chính sách an sinh bao phủ cả lao động phi chính thức.","d) Lao động tự do không cần quan tâm đến bảo hiểm xã hội."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: vấn đề an sinh cho lao động phi chính thức. d) Sai: ai cũng cần an sinh, bảo hiểm.","points":1},{"type":"short","level":"VD","q":"Người lao động trong độ tuổi, có khả năng, không có việc nhưng ... tìm việc thì được tính là thất nghiệp. (Điền 2 từ)","answer":"đang tích cực","explain":"Đang tích cực tìm kiếm việc làm — điều kiện bắt buộc.","points":0.5},{"type":"short","level":"VDC","q":"Trong thời đại số, ngoài chuyên môn, người lao động cần thêm kĩ năng số, ngoại ngữ và khả năng ... để không bị đào thải. (Điền 2 từ: ... thích ứng)","answer":"thích ứng","explain":"Khả năng thích ứng với thay đổi là kĩ năng sống còn của người lao động hiện đại.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tóm lại, thất nghiệp là vấn đề","options":["A. chỉ của cá nhân người lao động.","B. của cả cá nhân, gia đình và toàn xã hội.","C. không ai quan tâm.","D. chỉ của Nhà nước."],"answer":"B","explain":"Thất nghiệp ảnh hưởng cá nhân, gia đình và xã hội.","points":0.25},{"type":"mcq","level":"NB","q":"Biện pháp căn cơ nhất để giải quyết thất nghiệp là","options":["A. phát triển kinh tế, tạo nhiều việc làm.","B. cấm sa thải.","C. trợ cấp mãi mãi.","D. giảm dân số."],"answer":"A","explain":"Phát triển kinh tế tạo việc làm là giải pháp căn cơ.","points":0.25},{"type":"mcq","level":"NB","q":"Học sinh THPT cần chuẩn bị gì để tránh thất nghiệp trong tương lai?","options":["A. Học tập tốt, rèn kĩ năng, định hướng nghề theo nhu cầu xã hội.","B. Chỉ chơi, không học.","C. Chờ may mắn.","D. Không cần chuẩn bị."],"answer":"A","explain":"Hành trang: kiến thức, kĩ năng, định hướng nghề đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao khởi nghiệp được khuyến khích trong giải quyết thất nghiệp?","options":["A. Vì khởi nghiệp luôn thành công.","B. Vì khởi nghiệp tự tạo việc làm cho mình và có thể tạo việc làm cho người khác.","C. Vì khởi nghiệp không cần vốn.","D. Vì Nhà nước cho tiền."],"answer":"B","explain":"Khởi nghiệp tạo việc làm cho bản thân và xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Một địa phương có nhiều lao động phổ thông thất nghiệp, doanh nghiệp lại thiếu công nhân kĩ thuật. Giải pháp phù hợp là","options":["A. để mặc thị trường.","B. tổ chức đào tạo nghề, kết nối cung – cầu lao động.","C. cấm doanh nghiệp tuyển người.","D. đưa lao động đi nơi khác hết."],"answer":"B","explain":"Đào tạo nghề + kết nối cung cầu lao động giải quyết mất cân đối cơ cấu.","points":0.25},{"type":"mcq","level":"VD","q":"Trong buổi hướng nghiệp, chuyên gia khuyên: chọn nghề cần dựa vào 3 yếu tố: sở thích, năng lực và nhu cầu thị trường lao động. Lời khuyên này giúp học sinh","options":["A. chắc chắn giàu có.","B. tránh thất nghiệp do chọn ngành không phù hợp nhu cầu xã hội.","C. không cần học.","D. đỗ đại học dễ dàng."],"answer":"B","explain":"Chọn nghề phù hợp nhu cầu thị trường giúp dễ xin việc, tránh thất nghiệp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phát triển kinh tế, tạo việc làm là giải pháp căn cơ chống thất nghiệp.","b) Đào tạo nghề giúp người lao động thích ứng với thay đổi.","c) Người lao động cần chủ động học tập, tìm việc.","d) Thất nghiệp là vấn đề không thể giải quyết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: có thể giảm thiểu bằng nhiều giải pháp đồng bộ.","points":1},{"type":"truefalse","level":"VDC","q":"Bạn An đang học lớp 11, băn khoăn chọn nghề. An thích vẽ, học khá môn mĩ thuật, thấy ngành thiết kế đồ hoạ đang hot nhưng cũng lo AI sẽ thay thế. Xét tính đúng, sai:","statements":["a) An nên tìm hiểu kĩ nhu cầu thị trường và xu hướng công nghệ trước khi chọn.","b) Dù chọn nghề nào, An cũng cần học tập suốt đời để thích ứng.","c) Lo ngại về AI là có cơ sở, An nên học cách dùng AI như công cụ.","d) An nên chọn nghề theo phong trào, không cần quan tâm năng lực bản thân."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: định hướng nghề nghiệp khoa học. d) Sai: phải kết hợp sở thích, năng lực và nhu cầu thị trường.","points":1},{"type":"short","level":"VD","q":"Hoàn thành câu: Muốn không bị thất nghiệp cơ cấu, người lao động phải ... suốt đời. (Điền 2 từ)","answer":"học tập","explain":"Học tập suốt đời để cập nhật kĩ năng.","points":0.5},{"type":"short","level":"VDC","q":"Giải pháp căn cơ nhất để giảm thất nghiệp là phát triển kinh tế để ... việc làm. (Điền 2 từ)","answer":"tạo nhiều","explain":"Phát triển kinh tế tạo nhiều việc làm — giải pháp căn cơ.","points":0.5}]}]}</script>
