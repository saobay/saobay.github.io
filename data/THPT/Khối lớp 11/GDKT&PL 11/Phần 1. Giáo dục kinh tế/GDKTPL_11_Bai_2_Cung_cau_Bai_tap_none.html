<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Cầu về một loại hàng hoá được hiểu là","options":["A. mọi mong muốn của người tiêu dùng về hàng hoá đó.","B. nhu cầu có khả năng thanh toán về hàng hoá đó trên thị trường trong một thời kì nhất định.","C. số lượng hàng hoá đang bày bán trên thị trường.","D. khả năng cung ứng hàng hoá của doanh nghiệp."],"answer":"B","explain":"Định nghĩa SGK: cầu là nhu cầu có khả năng thanh toán về một loại hàng hoá, dịch vụ trên thị trường trong một thời kì nhất định. Muốn mua nhưng không có tiền thì chưa phải cầu.","points":0.25},{"type":"mcq","level":"NB","q":"Cung về một loại hàng hoá được hiểu là","options":["A. nhu cầu của người mua về hàng hoá đó.","B. khối lượng hàng hoá hiện có trên thị trường và chuẩn bị đưa ra thị trường trong một thời kì nhất định.","C. số tiền người mua sẵn sàng trả.","D. giá bán lẻ của hàng hoá đó."],"answer":"B","explain":"Định nghĩa SGK: cung là khối lượng hàng hoá, dịch vụ hiện có trên thị trường và chuẩn bị đưa ra thị trường, thể hiện khả năng cung ứng.","points":0.25},{"type":"mcq","level":"NB","q":"Khi cung bằng cầu trên thị trường thì giá cả có xu hướng","options":["A. tăng mạnh.","B. giảm mạnh.","C. ổn định.","D. bằng không."],"answer":"C","explain":"Cung = Cầu thì thị trường cân bằng, giá cả ổn định.","points":0.25},{"type":"mcq","level":"TH","q":"Bạn An rất thích một chiếc điện thoại mới nhưng không đủ tiền mua. Theo khái niệm trong bài, mong muốn của An","options":["A. đã tạo thành cầu trên thị trường.","B. chưa tạo thành cầu vì thiếu khả năng thanh toán.","C. làm tăng cung điện thoại.","D. làm giảm giá điện thoại."],"answer":"B","explain":"Cầu đòi hỏi nhu cầu phải đi kèm khả năng thanh toán; không đủ tiền mua thì chỉ là ước muốn, chưa phải cầu.","points":0.25},{"type":"mcq","level":"TH","q":"Vụ mùa bội thu, lượng xoài đưa ra chợ tăng gấp đôi trong khi sức mua không đổi. Giá xoài sẽ","options":["A. tăng mạnh vì xoài ngon.","B. có xu hướng giảm vì cung vượt cầu.","C. ổn định tuyệt đối.","D. không liên quan đến cung cầu."],"answer":"B","explain":"Cung tăng, cầu không đổi dẫn đến cung lớn hơn cầu (thừa hàng) nên giá có xu hướng giảm.","points":0.25},{"type":"mcq","level":"VD","q":"Dịp Tết Nguyên đán, nhu cầu thịt lợn của người dân tăng cao trong khi nguồn cung chưa kịp phục hồi sau dịch bệnh. Theo quan hệ cung – cầu, giá thịt lợn sẽ","options":["A. giảm vì Nhà nước cấm tăng giá.","B. tăng vì cung nhỏ hơn cầu.","C. ổn định vì Tết năm nào cũng vậy.","D. giảm vì người dân ăn ít đi."],"answer":"B","explain":"Cầu tăng, cung không theo kịp nên cung nhỏ hơn cầu (thiếu hàng) → giá có xu hướng tăng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về cung và cầu:","statements":["a) Cầu là nhu cầu có khả năng thanh toán về hàng hoá, dịch vụ trên thị trường.","b) Cung là khối lượng hàng hoá hiện có và chuẩn bị đưa ra thị trường.","c) Muốn mua nhưng không có tiền vẫn được tính là cầu.","d) Hàng hoá tồn kho trong kho của doanh nghiệp, chưa đưa ra thị trường thì không thuộc cung."],"answer":["T","T","F","F"],"explain":"a), b) Đúng: đúng định nghĩa SGK. c) Sai: thiếu khả năng thanh toán thì chưa phải cầu. d) Sai: hàng chuẩn bị đưa ra thị trường vẫn thuộc cung.","points":1},{"type":"truefalse","level":"VDC","q":"Đầu năm học, cửa hàng văn phòng phẩm của chị Lan nhập 5000 quyển vở. Nhu cầu của học sinh trong khu vực khoảng 8000 quyển, các cửa hàng khác chỉ đáp ứng được 2000 quyển. Xét tính đúng, sai:","statements":["a) Tổng cung vở trong khu vực là 7000 quyển, tổng cầu là 8000 quyển.","b) Cung nhỏ hơn cầu nên giá vở có xu hướng tăng.","c) Chị Lan nên tăng giá bán gấp đôi ngay lập tức để thu lợi tối đa.","d) Nếu chị Lan nhập thêm hàng kịp thời, cung tăng sẽ giúp giá ổn định trở lại."],"answer":["T","T","F","T"],"explain":"a) Đúng: cung 5000+2000=7000, cầu 8000. b) Đúng: cung nhỏ hơn cầu → giá tăng. c) Sai: tăng giá vô tội vạ là đầu cơ, vi phạm đạo đức và có thể vi phạm pháp luật; cách đúng là tăng cung. d) Đúng: tăng cung giúp cân bằng thị trường.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Khi cung lớn hơn cầu (thừa hàng, ế ẩm), giá cả có xu hướng ... (1 từ)","answer":"giảm","explain":"Cung lớn hơn cầu → thừa hàng → người bán phải hạ giá để bán được hàng, giá có xu hướng giảm.","points":0.5},{"type":"short","level":"VDC","q":"Năm 2019, dịch tả lợn châu Phi làm nguồn cung thịt lợn giảm mạnh trong khi nhu cầu dịp Tết tăng cao, giá thịt lợn tăng vọt. Hiện tượng này minh họa cho quan hệ cung – cầu nào? (Trả lời 3 từ: cung ... cầu)","answer":"cung nhỏ hơn cầu","explain":"Nguồn cung giảm, cầu tăng → cung nhỏ hơn cầu (thiếu hàng) → giá tăng vọt. Đúng quy luật cung – cầu.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Khi cung lớn hơn cầu trên thị trường thì giá cả hàng hoá có xu hướng","options":["A. tăng.","B. giảm.","C. ổn định.","D. không thay đổi bao giờ."],"answer":"B","explain":"Cung lớn hơn cầu nghĩa là thừa hàng, ế ẩm; người bán phải hạ giá để tiêu thụ nên giá có xu hướng giảm.","points":0.25},{"type":"mcq","level":"NB","q":"Khi cung nhỏ hơn cầu trên thị trường thì giá cả hàng hoá có xu hướng","options":["A. giảm.","B. ổn định.","C. tăng.","D. bằng chi phí sản xuất."],"answer":"C","explain":"Cung nhỏ hơn cầu nghĩa là thiếu hàng, khan hiếm; người mua tranh nhau mua nên giá có xu hướng tăng.","points":0.25},{"type":"mcq","level":"NB","q":"Giá cả thị trường được hiểu là","options":["A. giá do Nhà nước ấn định cho mọi hàng hoá.","B. giá bán thực tế của hàng hoá, dịch vụ trên thị trường.","C. chi phí sản xuất ra hàng hoá.","D. giá mà người mua mong muốn."],"answer":"B","explain":"Giá cả thị trường là giá bán thực tế hình thành trên thị trường, chịu tác động của quan hệ cung – cầu.","points":0.25},{"type":"mcq","level":"TH","q":"Khi giá thịt bò tăng cao, nhiều người dân chuyển sang mua thịt lợn, thịt gà. Hiện tượng này cho thấy giá cả đã tác động đến cầu theo hướng","options":["A. giá tăng làm cầu tăng.","B. giá tăng làm cầu giảm.","C. giá tăng làm cung giảm.","D. giá cả không ảnh hưởng đến cầu."],"answer":"B","explain":"Quy luật: giá tăng → người mua mua ít đi (cầu giảm), chuyển sang hàng hoá thay thế rẻ hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Thấy giá cà phê nhân tăng cao, nhiều nông dân mở rộng diện tích trồng cà phê. Hiện tượng này cho thấy giá cả đã tác động đến cung theo hướng","options":["A. giá tăng làm cung tăng.","B. giá tăng làm cung giảm.","C. giá tăng làm cầu tăng.","D. giá cả không ảnh hưởng đến cung."],"answer":"A","explain":"Quy luật: giá tăng → người sản xuất muốn bán nhiều hơn để thu lợi nên mở rộng sản xuất (cung tăng).","points":0.25},{"type":"mcq","level":"VD","q":"Giá khẩu trang y tế tăng gấp 5 lần trong đợt dịch vì nhu cầu tăng đột biến. Một số cơ sở đã đầu cơ, găm hàng để đẩy giá lên cao hơn nữa. Hành vi đầu cơ, găm hàng này","options":["A. là biểu hiện bình thường của quan hệ cung – cầu.","B. vi phạm pháp luật và đạo đức, cần bị xử lí.","C. giúp ổn định thị trường.","D. được Nhà nước khuyến khích."],"answer":"B","explain":"Đầu cơ, găm hàng tạo khan hiếm giả để trục lợi là hành vi phi pháp, phi đạo đức; Nhà nước xử lí để bảo vệ người tiêu dùng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tác động hai chiều giữa giá cả và cung – cầu:","statements":["a) Cầu tăng (cung không đổi) thì giá có xu hướng tăng.","b) Cung tăng (cầu không đổi) thì giá có xu hướng giảm.","c) Giá tăng thì người bán muốn bán nhiều hơn, tức cung tăng.","d) Giá giảm thì người mua mua ít đi, tức cầu giảm."],"answer":["T","T","T","F"],"explain":"a), b) Đúng: cung – cầu tác động đến giá. c) Đúng: giá tác động trở lại cung. d) Sai: giá giảm thì người mua mua nhiều hơn, tức cầu tăng.","points":1},{"type":"truefalse","level":"VDC","q":"Xã A trồng ớt chỉ thiên. Năm nay được mùa, sản lượng tăng gấp 3 nhưng thương lái chỉ thu mua cầm chừng, ớt ùn ứ, giá rớt từ 50000 đồng xuống 8000 đồng một ki-lô-gam. Xét tính đúng, sai:","statements":["a) Đây là trường hợp cung lớn hơn cầu nên giá giảm.","b) Nông dân ồ ạt mở rộng diện tích khi thấy giá ớt đang cao là quyết định đúng đắn.","c) Nông dân nên theo dõi tín hiệu thị trường, liên kết tiêu thụ, chế biến sâu để tránh ùn ứ.","d) Nhà nước không có vai trò gì trong việc hỗ trợ tiêu thụ nông sản."],"answer":["T","F","T","F"],"explain":"a) Đúng. b) Sai: đổ xô theo phong trào khi giá cao dễ dẫn đến cung vượt cầu, giá rớt — bài học 'được mùa mất giá'. c) Đúng: đó là cách vận dụng quan hệ cung – cầu. d) Sai: Nhà nước hỗ trợ xúc tiến thương mại, dự báo thị trường, bình ổn.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Khi cung nhỏ hơn cầu (thiếu hàng, khan hiếm), giá cả có xu hướng ... (1 từ)","answer":"tăng","explain":"Cung nhỏ hơn cầu → thiếu hàng → người mua tranh nhau mua → giá có xu hướng tăng.","points":0.5},{"type":"short","level":"VDC","q":"Chị Hoa thấy giá vàng tăng cao nên mang vàng đi bán; anh Minh thấy giá vàng giảm nên đi mua vào. Hành vi của chị Hoa và anh Minh minh họa cho quy luật: giá tăng thì cung ..., giá giảm thì cầu ... (Điền 2 từ cách nhau bằng dấu phẩy)","answer":"tăng, tăng","explain":"Giá tăng → người có hàng muốn bán nhiều hơn (cung tăng); giá giảm → người mua muốn mua nhiều hơn (cầu tăng).","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Mối quan hệ giữa cung, cầu và giá cả thị trường là quan hệ","options":["A. một chiều: chỉ cung cầu tác động đến giá.","B. tác động qua lại hai chiều.","C. không liên quan gì đến nhau.","D. do Nhà nước quyết định hoàn toàn."],"answer":"B","explain":"Cung – cầu tác động làm giá cả thay đổi; ngược lại, giá cả cũng tác động trở lại làm cung – cầu thay đổi.","points":0.25},{"type":"mcq","level":"NB","q":"Khi giá một loại hàng hoá giảm xuống, người tiêu dùng thường","options":["A. mua ít đi.","B. mua nhiều hơn.","C. ngừng mua hẳn.","D. không quan tâm."],"answer":"B","explain":"Giá giảm → sức mua tăng → người tiêu dùng mua nhiều hơn (cầu tăng).","points":0.25},{"type":"mcq","level":"NB","q":"Khi giá một loại hàng hoá tăng lên, người sản xuất thường","options":["A. thu hẹp sản xuất.","B. mở rộng sản xuất để bán nhiều hơn.","C. ngừng sản xuất.","D. bán đổ bán tháo."],"answer":"B","explain":"Giá tăng → lợi nhuận kì vọng cao → người sản xuất mở rộng sản xuất (cung tăng).","points":0.25},{"type":"mcq","level":"TH","q":"Vào mùa hè, nhu cầu nước giải khát tăng mạnh trong khi các nhà máy chưa kịp tăng công suất. Giá nước giải khát sẽ","options":["A. giảm vì trời nóng.","B. tăng vì cung chưa đáp ứng kịp cầu.","C. ổn định vì Nhà nước cấm tăng giá.","D. giảm vì cạnh tranh."],"answer":"B","explain":"Cầu tăng nhanh hơn cung → cung nhỏ hơn cầu → giá có xu hướng tăng.","points":0.25},{"type":"mcq","level":"TH","q":"Quan hệ cung – cầu có vai trò gì đối với người sản xuất?","options":["A. Giúp họ căn cứ vào tín hiệu giá cả để điều chỉnh quy mô, hướng sản xuất.","B. Giúp họ ấn định giá tuỳ ý.","C. Giúp họ trốn thuế dễ dàng.","D. Không có vai trò gì."],"answer":"A","explain":"Tín hiệu giá cả từ quan hệ cung – cầu giúp người sản xuất quyết định sản xuất cái gì, bao nhiêu, tránh thừa/thiếu.","points":0.25},{"type":"mcq","level":"VD","q":"Nghe tin giá đất ở khu vực X sắp tăng, nhiều người đổ xô vay tiền mua đất theo phong trào dù không có nhu cầu ở thật. Hành vi này","options":["A. là vận dụng đúng quan hệ cung – cầu.","B. là tâm lí đám đông, dễ mua phải giá ảo lúc đỉnh, cần tránh.","C. giúp thị trường đất ổn định.","D. được pháp luật khuyến khích."],"answer":"B","explain":"Mua theo phong trào lúc giá đỉnh là tâm lí đám đông; khi cung – cầu đảo chiều, giá rớt sẽ thua lỗ nặng. Cần mua theo nhu cầu thực tế.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cung và cầu tác động qua lại lẫn nhau trên thị trường.","b) Khi cung bằng cầu, giá cả thị trường ổn định.","c) Giá cả chỉ chịu tác động của cung, không chịu tác động của cầu.","d) Người sản xuất có thể dựa vào biến động giá cả để điều chỉnh sản xuất."],"answer":["T","T","F","T"],"explain":"a), b) Đúng. c) Sai: giá chịu tác động của cả cung và cầu. d) Đúng: đó là vai trò của quan hệ cung – cầu với người sản xuất.","points":1},{"type":"truefalse","level":"VDC","q":"Quỹ bình ổn giá xăng dầu được trích lập khi giá xăng thế giới thấp và chi ra khi giá thế giới tăng cao, giúp giá xăng trong nước không biến động sốc. Xét tính đúng, sai:","statements":["a) Đây là biện pháp Nhà nước điều tiết quan hệ cung – cầu về xăng dầu.","b) Quỹ bình ổn giúp bảo vệ người tiêu dùng trước biến động giá.","c) Khi giá thế giới tăng sốc mà không có quỹ bình ổn, giá trong nước sẽ tăng theo.","d) Người dân nên đổ xô tích trữ xăng khi nghe tin giá sắp tăng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: đúng bản chất và tác dụng của quỹ bình ổn giá. d) Sai: tích trữ theo tin đồn gây khan hiếm giả, mất an toàn; nên mua theo nhu cầu thực tế.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: ... là nhu cầu có khả năng thanh toán về hàng hoá, dịch vụ trên thị trường. (1 từ)","answer":"Cầu","explain":"Định nghĩa: cầu là nhu cầu có khả năng thanh toán về một loại hàng hoá, dịch vụ trên thị trường trong một thời kì nhất định.","points":0.5},{"type":"short","level":"VDC","q":"Một cửa hàng thấy giá thanh long tăng cao nên ồ ạt nhập hàng về bán; một tuần sau giá rớt mạnh vì nguồn cung dồi dào, cửa hàng lỗ nặng. Bài học rút ra là người kinh doanh phải theo dõi ... thị trường trước khi quyết định nhập hàng. (Điền 2 từ: tín hiệu ...)","answer":"tín hiệu giá cả","explain":"Giá cả là tín hiệu của quan hệ cung – cầu; theo dõi tín hiệu giá giúp người kinh doanh tránh nhập hàng lúc đỉnh giá.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Đối với người tiêu dùng, quan hệ cung – cầu giúp họ","options":["A. ấn định giá bán hàng hoá.","B. điều chỉnh nhu cầu, lựa chọn hàng hoá và chi tiêu hợp lí.","C. sản xuất được nhiều hàng hoá hơn.","D. trốn thuế thu nhập."],"answer":"B","explain":"Người tiêu dùng dựa vào biến động giá cả để điều chỉnh nhu cầu, chọn thời điểm mua hợp lí, tiết kiệm chi tiêu.","points":0.25},{"type":"mcq","level":"NB","q":"Đối với Nhà nước, quan hệ cung – cầu là cơ sở để","options":["A. cấm mọi hoạt động mua bán.","B. điều tiết thị trường, bình ổn giá, ổn định đời sống nhân dân.","C. tăng thuế với mọi hàng hoá.","D. phân phối hàng hoá theo tem phiếu."],"answer":"B","explain":"Nhà nước dùng các công cụ như dự trữ quốc gia, quỹ bình ổn giá để điều tiết, giữ thị trường ổn định.","points":0.25},{"type":"mcq","level":"NB","q":"Trường hợp nào sau đây làm cho giá cả hàng hoá tăng?","options":["A. Cung tăng, cầu không đổi.","B. Cầu tăng nhanh trong khi cung không theo kịp.","C. Cung vượt xa cầu.","D. Cung bằng cầu."],"answer":"B","explain":"Cầu tăng nhanh hơn cung → cung nhỏ hơn cầu (thiếu hàng) → giá tăng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao khi giá rau xanh tăng cao, nhiều hộ dân ở thành phố lại tận dụng ban công để trồng rau sạch?","options":["A. Vì họ muốn cạnh tranh với nông dân.","B. Vì giá tăng khiến họ điều chỉnh nhu cầu: tự cung tự cấp để tiết kiệm chi tiêu.","C. Vì Nhà nước bắt buộc.","D. Vì rau ngoài chợ hết sạch."],"answer":"B","explain":"Đó là vai trò của quan hệ cung – cầu với người tiêu dùng: giá tăng → điều chỉnh nhu cầu, tìm giải pháp thay thế hợp lí.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây SAI về mối quan hệ giữa giá cả và cung – cầu?","options":["A. Cung – cầu thay đổi làm giá cả thay đổi.","B. Giá cả thay đổi làm cung – cầu thay đổi.","C. Giá cả và cung – cầu tác động hai chiều vào nhau.","D. Giá cả hoàn toàn độc lập, không liên quan đến cung – cầu."],"answer":"D","explain":"Giá cả và cung – cầu có mối quan hệ tác động qua lại hai chiều, không độc lập với nhau.","points":0.25},{"type":"mcq","level":"VD","q":"Thấy giá hồ tiêu tăng cao liên tục 2 năm, nhiều hộ ở Tây Nguyên chặt cà phê để trồng tiêu. 3 năm sau tiêu rớt giá thảm hại vì cung vượt xa cầu. Đây là bài học về việc","options":["A. nông dân không nên trồng tiêu.","B. chạy theo phong trào, không theo dõi tín hiệu cung – cầu dài hạn sẽ dẫn đến thua lỗ.","C. Nhà nước phải cấm trồng tiêu.","D. giá cả không bao giờ thay đổi."],"answer":"B","explain":"Bài học kinh điển 'được giá mất mùa, được mùa mất giá': quyết định sản xuất phải dựa trên phân tích cung – cầu dài hạn, tránh đổ xô theo phong trào.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vai trò của quan hệ cung – cầu:","statements":["a) Giúp người sản xuất điều chỉnh quy mô và hướng sản xuất phù hợp nhu cầu thị trường.","b) Giúp người tiêu dùng chi tiêu hợp lí, tiết kiệm.","c) Là cơ sở để Nhà nước điều tiết, bình ổn thị trường.","d) Khiến mọi hàng hoá luôn giữ nguyên giá, không bao giờ biến động."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: ba vai trò của quan hệ cung – cầu. d) Sai: giá cả luôn biến động theo cung – cầu.","points":1},{"type":"truefalse","level":"VDC","q":"Trong đợt rét đậm, rau xanh khan hiếm, một số tiểu thương găm hàng không bán, chờ giá lên cao mới tung ra; trong khi đó hợp tác xã rau an toàn vẫn bán đúng giá niêm yết. Xét tính đúng, sai:","statements":["a) Găm hàng chờ giá lên là hành vi đầu cơ, vi phạm pháp luật.","b) Hành vi găm hàng làm trầm trọng thêm tình trạng cung nhỏ hơn cầu.","c) Cách làm của hợp tác xã rau an toàn là kinh doanh có đạo đức, đáng khuyến khích.","d) Người tiêu dùng nên đổ xô mua tích trữ thật nhiều rau khi giá đang tăng."],"answer":["T","T","T","F"],"explain":"a), b) Đúng: đầu cơ găm hàng là phi pháp và làm thiếu hàng trầm trọng hơn. c) Đúng. d) Sai: mua tích trữ theo phong trào gây khan hiếm giả; nên mua theo nhu cầu thực tế.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: ... là khối lượng hàng hoá hiện có trên thị trường và chuẩn bị đưa ra thị trường. (1 từ)","answer":"Cung","explain":"Định nghĩa: cung là khối lượng hàng hoá, dịch vụ hiện có trên thị trường và chuẩn bị đưa ra thị trường trong một thời kì nhất định.","points":0.5},{"type":"short","level":"VDC","q":"Khi giá thịt lợn tăng quá cao, Nhà nước chỉ đạo xuất kho dự trữ và tăng nhập khẩu thịt lợn để tăng nguồn cung, kéo giá xuống. Biện pháp này thể hiện vai trò gì của Nhà nước? (Trả lời 3 từ: ... giá cả)","answer":"bình ổn giá cả","explain":"Điều tiết nguồn cung để giữ giá ổn định là biện pháp bình ổn giá cả của Nhà nước.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Khi trên thị trường xuất hiện tình trạng khan hiếm hàng hoá, giá cả sẽ","options":["A. giảm xuống.","B. tăng lên.","C. giữ nguyên.","D. bằng không."],"answer":"B","explain":"Khan hiếm nghĩa là cung nhỏ hơn cầu → giá có xu hướng tăng.","points":0.25},{"type":"mcq","level":"NB","q":"Khi trên thị trường xuất hiện tình trạng thừa hàng, ế ẩm, giá cả sẽ","options":["A. tăng lên.","B. giữ nguyên.","C. giảm xuống.","D. tăng gấp đôi."],"answer":"C","explain":"Thừa hàng nghĩa là cung lớn hơn cầu → người bán phải hạ giá → giá có xu hướng giảm.","points":0.25},{"type":"mcq","level":"NB","q":"Yếu tố nào sau đây KHÔNG ảnh hưởng đến cầu về một loại hàng hoá?","options":["A. Thu nhập của người tiêu dùng.","B. Giá cả của hàng hoá đó.","C. Sở thích, thị hiếu của người tiêu dùng.","D. Màu sắc bao bì kho hàng của doanh nghiệp."],"answer":"D","explain":"Cầu chịu ảnh hưởng của thu nhập, giá cả, thị hiếu...; màu sắc bao bì kho hàng không phải yếu tố quyết định cầu.","points":0.25},{"type":"mcq","level":"TH","q":"Thu nhập của người dân tăng lên sẽ làm cho cầu về hàng hoá, dịch vụ","options":["A. giảm xuống.","B. tăng lên.","C. không thay đổi.","D. bằng không."],"answer":"B","explain":"Thu nhập tăng → khả năng thanh toán tăng → cầu tăng (với hàng hoá thông thường).","points":0.25},{"type":"mcq","level":"TH","q":"Giá vé xem phim giảm một nửa vào các ngày trong tuần. Lượng khán giả đến rạp tăng vọt. Điều này minh họa","options":["A. giá giảm làm cầu tăng.","B. giá giảm làm cầu giảm.","C. giá giảm làm cung tăng.","D. giá cả không ảnh hưởng đến cầu."],"answer":"A","explain":"Giá giảm → người tiêu dùng mua nhiều hơn → cầu tăng. Đúng quy luật giá cả tác động trở lại cầu.","points":0.25},{"type":"mcq","level":"VD","q":"Một doanh nghiệp sản xuất nước mắm thấy giá cá cơm nguyên liệu tăng cao, chi phí sản xuất đội lên. Doanh nghiệp quyết định giảm sản lượng, tập trung vào dòng sản phẩm cao cấp. Quyết định này cho thấy doanh nghiệp đã","options":["A. phớt lờ tín hiệu thị trường.","B. vận dụng quan hệ cung – cầu và giá cả để điều chỉnh hướng sản xuất.","C. vi phạm pháp luật cạnh tranh.","D. đầu cơ, găm hàng."],"answer":"B","explain":"Dựa vào biến động giá nguyên liệu (tín hiệu cung – cầu) để điều chỉnh quy mô, hướng sản xuất là vận dụng đúng vai trò của quan hệ cung – cầu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cầu tăng nhanh hơn cung sẽ đẩy giá cả tăng lên.","b) Cung tăng nhanh hơn cầu sẽ kéo giá cả giảm xuống.","c) Cung bằng cầu thì giá cả ổn định, thị trường cân bằng.","d) Giá cả biến động không bao giờ tác động trở lại cung và cầu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: ba trạng thái của quan hệ cung – cầu. d) Sai: giá cả tác động trở lại làm cung – cầu thay đổi.","points":1},{"type":"truefalse","level":"VDC","q":"Tỉnh B có 10000 hộ nuôi tôm. Thương lái Trung Quốc đột ngột ngừng thu mua, 7000 tấn tôm ùn ứ, giá rớt từ 120000 đồng xuống 30000 đồng một ki-lô-gam, nông dân lỗ nặng. Xét tính đúng, sai:","statements":["a) Đây là trường hợp cung vượt xa cầu nên giá giảm mạnh.","b) Phụ thuộc vào một thị trường tiêu thụ duy nhất là rủi ro lớn trong kinh doanh.","c) Giải pháp bền vững là đa dạng thị trường, chế biến sâu, liên kết chuỗi giá trị.","d) Nông dân nên bỏ nuôi tôm vì giá cả luôn bất ổn."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: phụ thuộc một đầu ra rất rủi ro. c) Đúng: đó là hướng đi bền vững. d) Sai: không phải bỏ nghề mà là đổi mới cách làm, theo dõi thị trường.","points":1},{"type":"short","level":"VD","q":"Hoàn thành quy luật: Giá tăng thì cung tăng, cầu ... (1 từ)","answer":"giảm","explain":"Giá tăng → người bán muốn bán nhiều hơn (cung tăng), người mua mua ít đi (cầu giảm).","points":0.5},{"type":"short","level":"VDC","q":"Dịp lễ, các hãng hàng không tăng giá vé gấp đôi vì nhu cầu đi lại tăng vọt trong khi số ghế có hạn. Đây là biểu hiện của quy luật cung – cầu: khi cầu tăng mà cung không đổi thì giá sẽ ... (1 từ)","answer":"tăng","explain":"Cầu tăng, cung không đổi → cung nhỏ hơn cầu → giá tăng. Đúng quy luật.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Khả năng thanh toán trong khái niệm cầu có nghĩa là","options":["A. người mua có đủ tiền để trả cho hàng hoá.","B. người mua thích hàng hoá đó.","C. người mua nhìn thấy hàng hoá đó.","D. người mua được tặng hàng hoá đó."],"answer":"A","explain":"Cầu là nhu cầu có khả năng thanh toán — tức người mua có đủ tiền để trả.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các yếu tố sau, yếu tố nào ảnh hưởng trực tiếp đến cung hàng hoá?","options":["A. Chi phí sản xuất, giá cả nguyên liệu.","B. Sở thích của người tiêu dùng.","C. Thu nhập của người tiêu dùng.","D. Thời tiết ở nước ngoài."],"answer":"A","explain":"Chi phí sản xuất, giá nguyên liệu, công nghệ ảnh hưởng trực tiếp đến khả năng cung ứng (cung).","points":0.25},{"type":"mcq","level":"NB","q":"Thị trường được coi là cân bằng khi","options":["A. cung lớn hơn cầu.","B. cung nhỏ hơn cầu.","C. cung bằng cầu.","D. không có người mua."],"answer":"C","explain":"Cung bằng cầu thì thị trường cân bằng, giá cả ổn định.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói giá cả là tín hiệu của thị trường?","options":["A. Vì giá cả cho biết quan hệ cung – cầu, giúp người sản xuất và tiêu dùng điều chỉnh hành vi.","B. Vì giá cả do Nhà nước quy định sẵn.","C. Vì giá cả không bao giờ thay đổi.","D. Vì giá cả chỉ có ý nghĩa với người giàu."],"answer":"A","explain":"Biến động giá cả phản ánh quan hệ cung – cầu; đó là tín hiệu để người sản xuất điều chỉnh sản xuất, người tiêu dùng điều chỉnh chi tiêu.","points":0.25},{"type":"mcq","level":"TH","q":"Khi giá xăng tăng cao, người dân có xu hướng đi xe buýt, xe điện nhiều hơn. Điều này thể hiện","options":["A. giá tăng làm cầu về xăng giảm, cầu về phương tiện thay thế tăng.","B. giá tăng làm cung xăng tăng.","C. người dân không cần đi lại nữa.","D. Nhà nước cấm dùng xăng."],"answer":"A","explain":"Giá xăng tăng → cầu về xăng giảm, người tiêu dùng chuyển sang hàng hoá thay thế (xe buýt, xe điện).","points":0.25},{"type":"mcq","level":"VD","q":"Một chủ vườn thấy giá bưởi da xanh tăng cao 3 năm liền nên vay vốn mở rộng gấp đôi diện tích. Theo quan hệ cung – cầu, rủi ro lớn nhất mà chủ vườn có thể gặp là","options":["A. bưởi càng trồng càng ngon.","B. khi vườn cho thu hoạch, nhiều người cũng ồ ạt trồng theo làm cung vượt cầu, giá rớt.","C. Nhà nước cấm bán bưởi.","D. không có rủi ro gì."],"answer":"B","explain":"Giá cao kích thích nhiều người cùng mở rộng → vài năm sau cung vượt xa cầu → giá rớt (bài học đổ xô theo phong trào).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhu cầu không có khả năng thanh toán không tạo thành cầu trên thị trường.","b) Hàng hoá chuẩn bị đưa ra thị trường được tính vào cung.","c) Giá cả và cung – cầu tác động qua lại hai chiều.","d) Nhà nước không thể can thiệp vào quan hệ cung – cầu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Nhà nước điều tiết bằng dự trữ, bình ổn giá, chống đầu cơ.","points":1},{"type":"truefalse","level":"VDC","q":"Siêu thị X áp dụng giá khác nhau cho cùng một loại rau: buổi sáng giá cao, buổi chiều giảm 30%, buổi tối giảm 50% để bán hết trong ngày. Xét tính đúng, sai:","statements":["a) Đây là cách vận dụng linh hoạt quan hệ cung – cầu và tâm lí người mua.","b) Giảm giá cuối ngày giúp siêu thị tránh lãng phí, người mua thu nhập thấp được mua rau rẻ.","c) Đây là hành vi lừa dối người tiêu dùng, vi phạm pháp luật.","d) Người tiêu dùng có thể căn thời điểm mua để tiết kiệm chi tiêu."],"answer":["T","T","F","T"],"explain":"a), b) Đúng: điều chỉnh giá theo thời điểm để cân bằng cung – cầu trong ngày, hai bên cùng có lợi. c) Sai: niêm yết công khai, không lừa dối. d) Đúng: đó là chi tiêu thông minh.","points":1},{"type":"short","level":"VD","q":"Hoàn thành quy luật: Giá giảm thì cầu tăng, cung ... (1 từ)","answer":"giảm","explain":"Giá giảm → người bán bán ít đi (cung giảm), người mua mua nhiều hơn (cầu tăng).","points":0.5},{"type":"short","level":"VDC","q":"Người dân đổ xô mua vàng khi giá đang ở đỉnh vì sợ giá còn tăng nữa, sau đó giá quay đầu giảm mạnh khiến nhiều người lỗ nặng. Đây là biểu hiện của tâm lí ... khi tham gia thị trường. (Điền 2 từ: tâm lí ...)","answer":"tâm lí đám đông","explain":"Mua bán theo phong trào, không dựa trên nhu cầu thực tế và phân tích cung – cầu là tâm lí đám đông, dễ thua lỗ.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Biện pháp nào sau đây của Nhà nước giúp bình ổn giá cả thị trường?","options":["A. Xuất kho dự trữ quốc gia khi hàng hoá khan hiếm.","B. Cấm người dân mua hàng hoá.","C. Ấn định giá cao cho mọi hàng hoá.","D. Để mặc đầu cơ, găm hàng."],"answer":"A","explain":"Xuất kho dự trữ khi khan hiếm làm tăng cung, kéo giá xuống — biện pháp bình ổn giá của Nhà nước.","points":0.25},{"type":"mcq","level":"NB","q":"Khi cầu về một hàng hoá giảm xuống (cung không đổi), giá cả sẽ","options":["A. tăng.","B. giảm.","C. ổn định.","D. không xác định."],"answer":"B","explain":"Cầu giảm, cung không đổi → cung lớn hơn cầu → giá giảm.","points":0.25},{"type":"mcq","level":"NB","q":"Khi cung về một hàng hoá giảm xuống (cầu không đổi), giá cả sẽ","options":["A. giảm.","B. ổn định.","C. tăng.","D. bằng không."],"answer":"C","explain":"Cung giảm, cầu không đổi → cung nhỏ hơn cầu → giá tăng.","points":0.25},{"type":"mcq","level":"TH","q":"Mùa đông, nhu cầu áo ấm tăng cao. Các cửa hàng thời trang đã chủ động nhập thêm hàng từ trước. Nhờ đó giá áo ấm chỉ tăng nhẹ. Trường hợp này cho thấy","options":["A. người bán đã dự báo cầu và tăng cung kịp thời, giúp giá ổn định.","B. quan hệ cung – cầu không còn đúng nữa.","C. Nhà nước đã cấm tăng giá.","D. người mua không còn nhu cầu."],"answer":"A","explain":"Dự báo cầu tăng và tăng cung tương ứng giúp cung – cầu cân bằng, giá ổn định — vận dụng đúng quy luật.","points":0.25},{"type":"mcq","level":"TH","q":"Hành vi nào sau đây là vận dụng SAI quan hệ cung – cầu của người tiêu dùng?","options":["A. Mua hàng theo nhu cầu thực tế.","B. So sánh giá cả trước khi mua.","C. Đổ xô mua tích trữ theo tin đồn khi giá đang sốt.","D. Chọn thời điểm giá hợp lí để mua."],"answer":"C","explain":"Mua tích trữ theo tin đồn lúc giá sốt là tâm lí đám đông, dễ mua phải giá ảo — vận dụng sai, gây thiệt hại.","points":0.25},{"type":"mcq","level":"VD","q":"Công ty sữa Y thấy nhu cầu sữa chua uống liền tăng mạnh nên đầu tư thêm 2 dây chuyền, đồng thời giữ giá ổn định để chiếm thị phần. Sau một năm, doanh thu tăng 40%. Thành công này nhờ","options":["A. may mắn ngẫu nhiên.","B. nắm bắt đúng tín hiệu cầu tăng của thị trường và tăng cung kịp thời.","C. Nhà nước bao cấp.","D. đối thủ phá sản."],"answer":"B","explain":"Nắm bắt tín hiệu cầu tăng, tăng cung kịp thời, giữ giá hợp lí — vận dụng đúng quan hệ cung – cầu nên thành công.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cầu giảm (cung không đổi) thì giá có xu hướng giảm.","b) Cung giảm (cầu không đổi) thì giá có xu hướng tăng.","c) Người sản xuất nên theo dõi biến động giá cả để điều chỉnh sản xuất.","d) Người tiêu dùng nên mua sắm theo nhu cầu thực tế, tránh chạy theo phong trào."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng: đúng quy luật cung – cầu và cách vận dụng hợp lí cho người sản xuất, tiêu dùng.","points":1},{"type":"truefalse","level":"VDC","q":"Anh K mở quán trà sữa gần trường học. Tháng đầu đông khách, anh tăng giá 20% mà lượng khách không giảm; tháng sau anh tăng tiếp 30% thì khách giảm một nửa, nhiều bạn chuyển sang quán khác rẻ hơn. Xét tính đúng, sai:","statements":["a) Lần tăng giá đầu tiên cho thấy cầu về trà sữa của quán đang lớn hơn cung.","b) Lần tăng giá thứ hai khiến cầu giảm vì giá vượt ngưỡng chấp nhận của khách.","c) Anh K nên giữ giá hợp lí, nâng cao chất lượng thay vì tăng giá liên tục.","d) Trong kinh doanh, tăng giá bao nhiêu cũng được vì khách hàng không có lựa chọn khác."],"answer":["T","T","T","F"],"explain":"a) Đúng: khách vẫn đông dù tăng giá → cầu lớn. b) Đúng: giá tăng quá mức → cầu giảm, khách chuyển sang hàng thay thế. c) Đúng: hướng đi bền vững. d) Sai: khách luôn có lựa chọn khác trong thị trường cạnh tranh.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Khi ... thì giá cả ổn định, thị trường cân bằng. (3 từ: cung ... cầu)","answer":"cung bằng cầu","explain":"Cung bằng cầu → thị trường cân bằng → giá cả ổn định.","points":0.5},{"type":"short","level":"VDC","q":"Bà Tư bán cá ở chợ. Sáng nay cá về ít mà người mua đông, bà tăng giá bán cao hơn mọi ngày và bán hết veo. Chiều nay cá về nhiều, bà hạ giá để bán hết, tránh ươn thối. Cách làm của bà Tư thể hiện việc vận dụng linh hoạt quan hệ ... để định giá. (Điền 2 từ)","answer":"cung cầu","explain":"Điều chỉnh giá theo lượng hàng (cung) và lượng khách (cầu) từng thời điểm là vận dụng linh hoạt quan hệ cung – cầu.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng về cầu?","options":["A. Cầu là mọi ước muốn của con người.","B. Cầu là nhu cầu có khả năng thanh toán trên thị trường.","C. Cầu là lượng hàng hoá doanh nghiệp sản xuất ra.","D. Cầu là giá bán của hàng hoá."],"answer":"B","explain":"Đúng định nghĩa SGK: cầu là nhu cầu có khả năng thanh toán về hàng hoá, dịch vụ trên thị trường trong một thời kì nhất định.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng về cung?","options":["A. Cung là nhu cầu của người mua.","B. Cung là số tiền người mua có.","C. Cung là khối lượng hàng hoá hiện có và chuẩn bị đưa ra thị trường.","D. Cung là giá mà người bán mong muốn."],"answer":"C","explain":"Đúng định nghĩa SGK về cung.","points":0.25},{"type":"mcq","level":"NB","q":"Khi giá cả tăng lên, cầu về hàng hoá đó thường","options":["A. tăng lên.","B. giảm xuống.","C. không đổi.","D. bằng không."],"answer":"B","explain":"Giá tăng → người mua mua ít đi → cầu giảm.","points":0.25},{"type":"mcq","level":"TH","q":"Dịch bệnh khiến nhiều nhà máy phải đóng cửa, nguồn cung linh kiện điện tử khan hiếm, giá linh kiện tăng vọt. Chuỗi sự kiện này minh họa","options":["A. cung giảm làm giá tăng.","B. cầu giảm làm giá tăng.","C. cung tăng làm giá tăng.","D. giá cả không liên quan đến cung."],"answer":"A","explain":"Nguồn cung giảm (cầu không đổi) → cung nhỏ hơn cầu → giá tăng.","points":0.25},{"type":"mcq","level":"TH","q":"Để tránh tình trạng được mùa mất giá, nông dân nên","options":["A. ồ ạt mở rộng diện tích khi thấy giá cao.","B. theo dõi tín hiệu thị trường, liên kết sản xuất – tiêu thụ, chế biến sâu.","C. ngừng sản xuất nông nghiệp.","D. bán đổ bán tháo khi giá giảm."],"answer":"B","explain":"Theo dõi cung – cầu, liên kết chuỗi, chế biến sâu giúp tránh ùn ứ khi cung vượt cầu.","points":0.25},{"type":"mcq","level":"VD","q":"Nhà nước quy định giá trần đối với một số mặt hàng thiết yếu trong thiên tai, dịch bệnh. Biện pháp này nhằm","options":["A. xóa bỏ quan hệ cung – cầu.","B. bảo vệ người tiêu dùng, ngăn đầu cơ nâng giá trong lúc khan hiếm.","C. giúp tiểu thương thu lợi tối đa.","D. khuyến khích găm hàng."],"answer":"B","explain":"Giá trần trong thiên tai, dịch bệnh ngăn đầu cơ trục lợi lúc cung khan hiếm — bảo vệ người tiêu dùng, ổn định đời sống.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thu nhập tăng thường làm cầu về hàng hoá tăng.","b) Giá nguyên liệu tăng làm chi phí sản xuất tăng, có thể làm cung giảm.","c) Cung – cầu và giá cả tác động qua lại hai chiều.","d) Người tiêu dùng không cần quan tâm đến biến động giá cả."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: người tiêu dùng cần theo dõi giá để chi tiêu hợp lí.","points":1},{"type":"truefalse","level":"VDC","q":"Chợ đầu mối X mỗi sáng có 50 tấn rau đổ về. Hôm nay mưa lớn, chỉ có 20 tấn rau về chợ trong khi lượng người mua vẫn như mọi ngày, giá rau tăng gấp đôi; một số tiểu thương còn găm hàng chờ giá lên nữa. Xét tính đúng, sai:","statements":["a) Mưa lớn làm cung rau giảm, cầu không đổi nên giá tăng.","b) Găm hàng chờ giá lên là hành vi đầu cơ, vi phạm pháp luật.","c) Người mua nên đổ xô mua tích trữ thật nhiều rau lúc này.","d) Ban quản lí chợ cần phối hợp kiểm tra, xử lí hành vi găm hàng, đầu cơ."],"answer":["T","T","F","T"],"explain":"a) Đúng: cung giảm → giá tăng. b) Đúng: đầu cơ găm hàng là phi pháp. c) Sai: tích trữ theo phong trào gây khan hiếm giả. d) Đúng: cần quản lí, xử lí để ổn định chợ.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Giá cả ... là giá bán thực tế của hàng hoá, dịch vụ trên thị trường. (1 từ)","answer":"thị trường","explain":"Giá cả thị trường là giá bán thực tế hình thành trên thị trường dưới tác động của cung – cầu.","points":0.5},{"type":"short","level":"VDC","q":"Khi giá xăng thế giới tăng sốc, Nhà nước chi Quỹ bình ổn để giá xăng trong nước chỉ tăng nhẹ. Đây là vai trò ... thị trường của Nhà nước. (Điền 2 từ: ... thị trường)","answer":"điều tiết thị trường","explain":"Dùng quỹ bình ổn giá để giữ giá ổn định là Nhà nước điều tiết thị trường, bảo vệ người dân và doanh nghiệp.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Trong ba trạng thái của quan hệ cung – cầu, trạng thái nào làm giá cả ổn định?","options":["A. Cung lớn hơn cầu.","B. Cung nhỏ hơn cầu.","C. Cung bằng cầu.","D. Không có trạng thái nào."],"answer":"C","explain":"Cung bằng cầu → thị trường cân bằng → giá cả ổn định.","points":0.25},{"type":"mcq","level":"NB","q":"Trạng thái nào sau đây làm giá cả có xu hướng giảm?","options":["A. Cung lớn hơn cầu.","B. Cung nhỏ hơn cầu.","C. Cung bằng cầu.","D. Cầu bằng không."],"answer":"A","explain":"Cung lớn hơn cầu (thừa hàng) → giá giảm.","points":0.25},{"type":"mcq","level":"NB","q":"Trạng thái nào sau đây làm giá cả có xu hướng tăng?","options":["A. Cung lớn hơn cầu.","B. Cung bằng cầu.","C. Cung nhỏ hơn cầu.","D. Cung và cầu đều bằng không."],"answer":"C","explain":"Cung nhỏ hơn cầu (thiếu hàng) → giá tăng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các siêu thị thường giảm giá mạnh rau củ, thực phẩm tươi vào cuối ngày?","options":["A. Vì muốn lỗ để cạnh tranh.","B. Vì cuối ngày cung còn tồn mà cầu giảm, giảm giá để cân bằng cung – cầu, tránh hư hỏng.","C. Vì pháp luật bắt buộc.","D. Vì hàng hoá hết hạn từ sáng."],"answer":"B","explain":"Cuối ngày hàng tồn (cung dư) mà khách vắng (cầu giảm) → giảm giá để bán hết, tránh lãng phí — vận dụng linh hoạt cung – cầu.","points":0.25},{"type":"mcq","level":"TH","q":"Khi thu nhập của người dân giảm sút do suy thoái kinh tế, cầu về hàng hoá xa xỉ sẽ","options":["A. tăng mạnh.","B. giảm xuống.","C. không thay đổi.","D. tăng gấp đôi."],"answer":"B","explain":"Thu nhập giảm → khả năng thanh toán giảm → cầu giảm, nhất là với hàng xa xỉ.","points":0.25},{"type":"mcq","level":"VD","q":"Một hãng thời trang ra mẫu áo mới, ban đầu khan hàng nên giá cao; sau khi tăng công suất, hàng dồi dào, giá giảm dần về mức hợp lí. Diễn biến này phù hợp với quy luật","options":["A. cung tăng đáp ứng cầu làm giá giảm dần về mức cân bằng.","B. giá cả không liên quan đến cung cầu.","C. cầu tăng làm giá giảm.","D. cung giảm làm giá giảm."],"answer":"A","explain":"Ban đầu cung nhỏ hơn cầu → giá cao; tăng cung → cung – cầu cân bằng → giá giảm về mức hợp lí.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cung lớn hơn cầu thì giá có xu hướng giảm.","b) Cung nhỏ hơn cầu thì giá có xu hướng tăng.","c) Cung bằng cầu thì giá cả ổn định.","d) Ba trạng thái trên không bao giờ thay đổi, giá cả luôn cố định."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: ba trạng thái của quan hệ cung – cầu. d) Sai: cung – cầu luôn biến động nên giá cả cũng biến động theo.","points":1},{"type":"truefalse","level":"VDC","q":"Gia đình bạn Minh có thói quen đi chợ đầu mối vào cuối buổi để mua thực phẩm giảm giá, so sánh giá giữa các sạp và chỉ mua đúng nhu cầu trong ngày. Xét tính đúng, sai:","statements":["a) Đây là cách chi tiêu thông minh, vận dụng tốt quan hệ cung – cầu.","b) Mua đúng nhu cầu giúp tránh lãng phí thực phẩm.","c) So sánh giá giữa các sạp giúp mua được giá hợp lí.","d) Nên mua tích trữ thật nhiều khi thấy giá rẻ dù không dùng hết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: chi tiêu thông minh, tiết kiệm, tránh lãng phí. d) Sai: mua quá nhu cầu gây lãng phí, hư hỏng.","points":1},{"type":"short","level":"VD","q":"Hoàn thành câu: Thừa hàng, ế ẩm thì giá ...; khan hiếm, thiếu hàng thì giá ... (Điền 2 từ cách nhau bằng dấu phẩy)","answer":"giảm, tăng","explain":"Cung lớn hơn cầu (thừa) → giá giảm; cung nhỏ hơn cầu (thiếu) → giá tăng.","points":0.5},{"type":"short","level":"VDC","q":"Học sinh cần hiểu quan hệ cung – cầu để chi tiêu hợp lí, tránh mua sắm theo phong trào và định hướng nghề nghiệp theo nhu cầu của thị trường ... (Điền 2 từ: thị trường ...)","answer":"thị trường lao động","explain":"Hiểu cung – cầu giúp định hướng nghề nghiệp theo nhu cầu của thị trường lao động, tránh thất nghiệp sau khi ra trường.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Nội dung nào sau đây thể hiện đúng mối quan hệ hai chiều giữa giá cả và cung – cầu?","options":["A. Chỉ cung – cầu tác động đến giá, giá không tác động trở lại.","B. Cung – cầu làm giá thay đổi và giá cả cũng làm cung – cầu thay đổi.","C. Giá cả do Nhà nước quyết định, không liên quan cung – cầu.","D. Cung – cầu và giá cả độc lập với nhau."],"answer":"B","explain":"Mối quan hệ hai chiều: cung – cầu tác động đến giá cả; giá cả tác động trở lại cung – cầu.","points":0.25},{"type":"mcq","level":"NB","q":"Khi giá hàng hoá giảm, điều gì thường xảy ra?","options":["A. Người bán muốn bán nhiều hơn, người mua mua ít đi.","B. Người bán bán ít đi, người mua mua nhiều hơn.","C. Cả người bán và người mua đều ngừng giao dịch.","D. Không có gì thay đổi."],"answer":"B","explain":"Giá giảm → cung giảm (người bán bán ít đi), cầu tăng (người mua mua nhiều hơn).","points":0.25},{"type":"mcq","level":"NB","q":"Khi giá hàng hoá tăng, điều gì thường xảy ra?","options":["A. Người bán bán ít đi, người mua mua nhiều hơn.","B. Người bán muốn bán nhiều hơn, người mua mua ít đi.","C. Cả hai đều tăng mua bán.","D. Thị trường ngừng hoạt động."],"answer":"B","explain":"Giá tăng → cung tăng (người bán bán nhiều hơn), cầu giảm (người mua mua ít đi).","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Nhà nước cần dự trữ quốc gia về lương thực, xăng dầu?","options":["A. Để bán giá cao khi khan hiếm.","B. Để can thiệp tăng cung khi thị trường thiếu hàng, bình ổn giá cả.","C. Để cấm người dân mua hàng.","D. Để tăng thuế."],"answer":"B","explain":"Dự trữ quốc gia giúp Nhà nước tăng cung kịp thời khi khan hiếm, bình ổn giá, ổn định đời sống.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn học sinh muốn mua giày thể thao nhưng chỉ có 200000 đồng trong khi đôi giày giá 800000 đồng. Theo bài học, nhu cầu của bạn","options":["A. đã tạo thành cầu vì rất muốn mua.","B. chưa tạo thành cầu vì chưa có khả năng thanh toán.","C. làm tăng cung giày.","D. làm giảm giá giày."],"answer":"B","explain":"Thiếu khả năng thanh toán thì chưa phải cầu, dù mong muốn rất lớn.","points":0.25},{"type":"mcq","level":"VD","q":"Trong đợt nắng nóng kéo dài, nhu cầu điều hòa tăng đột biến, nhiều cửa hàng hết hàng, giá tăng 20%. Một số cửa hàng đã nhập thêm hàng từ miền Nam về bán với giá hợp lí và thu lợi lớn. Điều này cho thấy","options":["A. người kinh doanh nhạy bén với tín hiệu cung – cầu sẽ nắm bắt được cơ hội.","B. tăng giá là hành vi phi pháp.","C. người mua nên ngừng mua điều hòa.","D. Nhà nước phải cấm bán điều hòa."],"answer":"A","explain":"Nắm bắt tín hiệu cầu tăng, tăng cung kịp thời với giá hợp lí là kinh doanh nhạy bén, đúng quy luật.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giá cả là tín hiệu giúp người sản xuất điều chỉnh sản xuất.","b) Người tiêu dùng nên theo dõi giá cả để chi tiêu hợp lí.","c) Nhà nước dùng dự trữ quốc gia, quỹ bình ổn để điều tiết thị trường.","d) Hiểu biết về cung – cầu không có ý nghĩa gì với học sinh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: học sinh cần hiểu để chi tiêu hợp lí và định hướng nghề nghiệp.","points":1},{"type":"truefalse","level":"VDC","q":"Hợp tác xã rau sạch X kí hợp đồng bao tiêu với siêu thị, giá ổn định quanh năm; khi thị trường khan rau, X vẫn giao đủ hàng đúng giá hợp đồng dù giá chợ tăng gấp đôi. Xét tính đúng, sai:","statements":["a) Hợp đồng bao tiêu giúp X tránh rủi ro biến động giá cả.","b) Giữ đúng cam kết khi giá thị trường tăng là kinh doanh có uy tín.","c) X nên phá hợp đồng để bán giá cao kiếm lời nhiều hơn.","d) Liên kết chuỗi sản xuất – tiêu thụ là hướng đi bền vững cho nông dân."],"answer":["T","T","F","T"],"explain":"a) Đúng: bao tiêu ổn định đầu ra. b) Đúng: uy tín là tài sản lâu dài. c) Sai: phá hợp đồng mất uy tín, vi phạm pháp luật. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Biến động ... phản ánh quan hệ cung – cầu, là tín hiệu để người sản xuất và tiêu dùng điều chỉnh hành vi. (1 từ)","answer":"giá cả","explain":"Giá cả là tín hiệu của thị trường, phản ánh quan hệ cung – cầu.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại toàn bài, mối quan hệ giữa cung, cầu và giá cả thị trường là mối quan hệ tác động qua lại ... (Điền 2 từ)","answer":"hai chiều","explain":"Cung – cầu tác động đến giá cả và giá cả tác động trở lại cung – cầu: quan hệ hai chiều.","points":0.5}]}]}</script>
