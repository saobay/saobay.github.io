{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Văn hoá tiêu dùng được hiểu là","options":["A. những nét đẹp trong thói quen, hành vi tiêu dùng, thể hiện lối sống văn minh, có trách nhiệm.","B. số tiền chi tiêu hằng tháng.","C. sở thích mua sắm.","D. thu nhập của gia đình."],"answer":"A","explain":"Đúng định nghĩa SGK: nét đẹp trong thói quen, hành vi tiêu dùng.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện nào sau đây là có văn hoá tiêu dùng?","options":["A. Mua sắm hoang phí theo phong trào.","B. Mang túi vải đi chợ, mua đúng nhu cầu, so sánh giá.","C. Xả rác bừa bãi.","D. Chen lấn khi mua hàng."],"answer":"B","explain":"Mua sắm có kế hoạch, bảo vệ môi trường là văn hoá tiêu dùng.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện nào sau đây thiếu văn hoá tiêu dùng?","options":["A. Tiết kiệm điện nước.","B. Phân loại rác.","C. Sính hàng ngoại, chê bai hàng nội chất lượng.","D. Tôn trọng người bán."],"answer":"C","explain":"Sính ngoại, chê hàng nội là thiếu văn hoá, thiếu trách nhiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao người tiêu dùng nên ưu tiên hàng hoá có nguồn gốc rõ ràng?","options":["A. Vì đảm bảo chất lượng, an toàn sức khoẻ, bảo vệ quyền lợi của mình.","B. Vì hàng có nguồn gốc thường rẻ.","C. Vì pháp luật bắt buộc.","D. Vì mọi người đều làm vậy."],"answer":"A","explain":"Hàng rõ nguồn gốc đảm bảo chất lượng, an toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Bạn An đi siêu thị mang theo túi vải, chỉ mua đúng thứ cần. Việc làm của An thể hiện","options":["A. sự keo kiệt.","B. văn hoá tiêu dùng: tiết kiệm và bảo vệ môi trường.","C. thiếu tiền.","D. không biết mua sắm."],"answer":"B","explain":"Tiết kiệm + bảo vệ môi trường = văn hoá tiêu dùng.","points":0.25},{"type":"mcq","level":"VD","q":"Phong trào Người Việt Nam ưu tiên dùng hàng Việt Nam có ý nghĩa","options":["A. khuyến khích tiêu dùng hàng nội chất lượng, ủng hộ doanh nghiệp trong nước.","B. cấm hàng ngoại.","C. tăng giá hàng nội.","D. phân biệt đối xử."],"answer":"A","explain":"Ưu tiên hàng Việt chất lượng vừa văn hoá vừa yêu nước, vừa trách nhiệm.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn hoá tiêu dùng là tiêu dùng văn minh, có trách nhiệm.","b) Mua sắm có kế hoạch, tránh lãng phí là văn hoá tiêu dùng.","c) Bảo vệ môi trường trong tiêu dùng là trách nhiệm của mỗi người.","d) Mua sắm hoang phí theo phong trào là văn hoá tiêu dùng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hoang phí là thiếu văn hoá.","points":1},{"type":"truefalse","level":"VDC","q":"Gia đình chị Hoa thực hiện: đi chợ mang túi vải, phân loại rác, tắt điện khi ra khỏi phòng, chỉ mua thực phẩm có nguồn gốc rõ ràng, dạy con so sánh giá trước khi mua. Xét tính đúng, sai:","statements":["a) Gia đình chị Hoa là tấm gương văn hoá tiêu dùng.","b) Mang túi vải, phân loại rác là bảo vệ môi trường.","c) Dạy con so sánh giá là giáo dục tiêu dùng thông minh.","d) Những việc này nhỏ nhặt, không có ý nghĩa gì."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: việc nhỏ tạo nên văn hoá lớn.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Văn hoá tiêu dùng là ... một cách văn minh. (3 từ: tiêu dùng ...)","answer":"tiêu dùng văn minh","explain":"Tiêu dùng một cách văn minh.","points":0.5},{"type":"short","level":"VDC","q":"Phong trào khuyến khích người dân ưu tiên hàng hoá sản xuất trong nước chất lượng có tên là: Người Việt Nam ưu tiên dùng hàng ... (Điền 2 từ)","answer":"Việt Nam","explain":"Người Việt Nam ưu tiên dùng hàng Việt Nam.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Người tiêu dùng văn minh khi mua sắm cần","options":["A. mua theo nhu cầu thực tế, có kế hoạch.","B. mua bừa theo cảm hứng.","C. mua càng nhiều càng tốt.","D. không cần quan tâm giá cả."],"answer":"A","explain":"Mua theo nhu cầu, có kế hoạch tránh lãng phí.","points":0.25},{"type":"mcq","level":"NB","q":"Tiêu dùng xanh là","options":["A. chỉ mua đồ màu xanh.","B. tiêu dùng thân thiện với môi trường: hạn chế nilon, tiết kiệm tài nguyên.","C. mua rau xanh.","D. không tiêu dùng."],"answer":"B","explain":"Tiêu dùng xanh = bảo vệ môi trường.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi nào sau đây thể hiện trách nhiệm với môi trường?","options":["A. Xả rác bừa bãi.","B. Mang bình nước cá nhân, hạn chế chai nhựa dùng một lần.","C. Lãng phí nước.","D. Đốt rác thải."],"answer":"B","explain":"Giảm rác thải nhựa là bảo vệ môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao văn hoá tiêu dùng thúc đẩy sản xuất phát triển lành mạnh?","options":["A. Vì người tiêu dùng thông minh buộc doanh nghiệp nâng cao chất lượng, loại bỏ hàng giả.","B. Vì người tiêu dùng mua nhiều.","C. Vì Nhà nước yêu cầu.","D. Vì không liên quan."],"answer":"A","explain":"Cầu chất lượng cao kéo cung chất lượng cao.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn trẻ mang bình nước cá nhân đi học thay vì mua chai nhựa mỗi ngày. Việc làm này","options":["A. keo kiệt.","B. tiêu dùng xanh, bảo vệ môi trường.","C. không cần thiết.","D. tốn kém."],"answer":"B","explain":"Giảm rác thải nhựa dùng một lần.","points":0.25},{"type":"mcq","level":"VD","q":"Thấy quảng cáo thực phẩm chức năng chữa bách bệnh, nhiều người cao tuổi mua với giá đắt. Lời khuyên đúng là","options":["A. tin theo quảng cáo.","B. tìm hiểu kĩ thông tin, hỏi ý kiến bác sĩ, không tin lời quảng cáo thổi phồng.","C. mua càng nhiều càng tốt.","D. giới thiệu cho người khác."],"answer":"B","explain":"Tiêu dùng thông minh: kiểm chứng thông tin trước khi mua.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tiêu dùng xanh là thân thiện với môi trường.","b) Mua theo nhu cầu thực tế giúp tránh lãng phí.","c) Người tiêu dùng thông minh buộc doanh nghiệp nâng cao chất lượng.","d) Ham rẻ mua hàng không rõ nguồn gốc là thông minh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hại sức khoẻ, tiếp tay hàng giả.","points":1},{"type":"truefalse","level":"VDC","q":"Chợ X phát động tiểu thương không dùng túi nilon, tặng túi vải cho khách; khách mang túi vải được giảm giá. Xét tính đúng, sai:","statements":["a) Đây là mô hình tiêu dùng xanh đáng nhân rộng.","b) Giảm giá cho khách mang túi vải khuyến khích bảo vệ môi trường.","c) Tiểu thương và khách hàng cùng có trách nhiệm với môi trường.","d) Túi nilon không ảnh hưởng gì đến môi trường."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nilon gây ô nhiễm nghiêm trọng.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Hạn chế túi nilon, phân loại rác là tiêu dùng ... (1 từ)","answer":"xanh","explain":"Tiêu dùng xanh — thân thiện môi trường.","points":0.5},{"type":"short","level":"VDC","q":"Người tiêu dùng cần tìm hiểu kĩ thông tin hàng hoá trước khi mua để trở thành người tiêu dùng ... (Điền 2 từ)","answer":"thông minh","explain":"Người tiêu dùng thông minh.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Ứng xử văn minh khi mua sắm thể hiện ở","options":["A. xếp hàng, tôn trọng người bán và người mua khác.","B. chen lấn, xô đẩy.","C. cãi vã với người bán.","D. khinh thường người bán hàng."],"answer":"A","explain":"Văn minh nơi công cộng.","points":0.25},{"type":"mcq","level":"NB","q":"Vai trò của văn hoá tiêu dùng KHÔNG bao gồm","options":["A. bảo vệ sức khoẻ người tiêu dùng.","B. bảo vệ môi trường.","C. khuyến khích mua hàng giả.","D. xây dựng xã hội văn minh."],"answer":"C","explain":"Văn hoá tiêu dùng tẩy chay hàng giả.","points":0.25},{"type":"mcq","level":"NB","q":"Thói quen xấu trong tiêu dùng cần phê phán là","options":["A. mua sắm hoang phí, chạy theo mốt.","B. tiết kiệm.","C. so sánh giá.","D. mua hàng rõ nguồn gốc."],"answer":"A","explain":"Hoang phí, chạy theo mốt là thiếu văn hoá.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không nên mua hàng theo phong trào, chạy theo mốt?","options":["A. Vì dễ mua phải thứ không cần thiết, lãng phí tiền bạc.","B. Vì mốt luôn đẹp.","C. Vì mọi người đều mua.","D. Vì hàng mốt rẻ."],"answer":"A","explain":"Mua theo nhu cầu thực tế, không theo phong trào.","points":0.25},{"type":"mcq","level":"TH","q":"Một gia đình luôn tắt điện khi ra khỏi phòng, dùng nước tiết kiệm. Đây là","options":["A. keo kiệt.","B. văn hoá tiêu dùng tiết kiệm tài nguyên.","C. nghèo khó.","D. không cần thiết."],"answer":"B","explain":"Tiết kiệm tài nguyên là văn hoá.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn Minh thích một đôi giày hiệu nhưng giá quá cao so với thu nhập gia đình. Quyết định có văn hoá là","options":["A. đòi bố mẹ mua bằng được.","B. vay tiền mua.","C. chọn đôi giày phù hợp khả năng, để dành tiền sau này.","D. trộm tiền mua."],"answer":"C","explain":"Tiêu dùng phù hợp khả năng, không đua đòi.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xếp hàng, tôn trọng người bán là văn minh.","b) Tiết kiệm điện nước là văn hoá tiêu dùng.","c) Mua sắm phù hợp khả năng tài chính là thông minh.","d) Đua đòi mua hàng hiệu vượt khả năng là văn hoá."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đua đòi là thiếu văn hoá.","points":1},{"type":"truefalse","level":"VDC","q":"Lớp 11A phát động tuần lễ không rác thải nhựa: mỗi bạn mang bình nước, hộp cơm cá nhân; cuối tuần tổng kết, lớp giảm 90% rác nhựa. Xét tính đúng, sai:","statements":["a) Đây là hoạt động giáo dục văn hoá tiêu dùng thiết thực.","b) Hành động nhỏ của nhiều người tạo thay đổi lớn cho môi trường.","c) Học sinh hoàn toàn có thể thực hiện tiêu dùng xanh.","d) Bảo vệ môi trường là việc của người lớn, học sinh không cần làm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ai cũng có trách nhiệm.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Mua sắm theo nhu cầu thực tế, có ... tránh lãng phí. (2 từ)","answer":"kế hoạch","explain":"Mua sắm có kế hoạch.","points":0.5},{"type":"short","level":"VDC","q":"Bốn chữ tóm tắt văn hoá tiêu dùng: Thông minh, Tiết kiệm, Văn minh và ... (Điền 2 từ)","answer":"Trách nhiệm","explain":"Thông minh – Tiết kiệm – Văn minh – Trách nhiệm.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Trách nhiệm của người tiêu dùng KHÔNG bao gồm","options":["A. tìm hiểu kĩ thông tin hàng hoá trước khi mua.","B. tẩy chay hàng giả.","C. mua hàng lậu, hàng giả vì rẻ.","D. ứng xử văn minh khi mua sắm."],"answer":"C","explain":"Mua hàng lậu, hàng giả là thiếu trách nhiệm.","points":0.25},{"type":"mcq","level":"NB","q":"Khi mua phải hàng kém chất lượng, người tiêu dùng nên","options":["A. im lặng chịu thiệt.","B. yêu cầu đổi trả, tố cáo đến cơ quan chức năng.","C. đánh người bán.","D. mua tiếp."],"answer":"B","explain":"Bảo vệ quyền lợi hợp pháp của mình.","points":0.25},{"type":"mcq","level":"NB","q":"Tiết kiệm trong tiêu dùng có nghĩa là","options":["A. không dám chi tiêu gì.","B. chi tiêu hợp lí, tránh lãng phí.","C. mua đồ rẻ nhất.","D. nhịn ăn."],"answer":"B","explain":"Tiết kiệm = hợp lí, không lãng phí; không phải keo kiệt.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao tiết kiệm khác với keo kiệt?","options":["A. Tiết kiệm là chi tiêu hợp lí, keo kiệt là không dám chi cả khi cần thiết.","B. Không khác nhau.","C. Keo kiệt tốt hơn.","D. Tiết kiệm là xấu."],"answer":"A","explain":"Phân biệt đúng: tiết kiệm hợp lí, keo kiệt cực đoan.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn học sinh được 200000 đồng tiền ăn sáng một tuần. Cách chi tiêu có văn hoá là","options":["A. tiêu hết trong 2 ngày đầu.","B. lập kế hoạch chi tiêu đều các ngày, để dành một phần.","C. cho bạn vay hết.","D. mua quà vặt hết."],"answer":"B","explain":"Chi tiêu có kế hoạch, tiết kiệm.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình bạn An thu nhập trung bình nhưng hay mua sắm hàng hiệu trả góp, nợ nần chồng chất. Lời khuyên là","options":["A. tiếp tục mua.","B. chi tiêu phù hợp thu nhập, tránh nợ nần vì đua đòi.","C. vay thêm.","D. bán nhà mua hàng hiệu."],"answer":"B","explain":"Sống phù hợp khả năng, tránh bẫy tiêu dùng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tiết kiệm là chi tiêu hợp lí, tránh lãng phí.","b) Keo kiệt là không dám chi cả khi cần thiết.","c) Chi tiêu phù hợp thu nhập là thông minh.","d) Vay nợ để đua đòi mua sắm là văn hoá."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Bạn Linh lập sổ chi tiêu: ghi mọi khoản thu chi, cuối tháng tổng kết, cắt giảm khoản không cần thiết, mỗi tháng để dành 200000 đồng. Xét tính đúng, sai:","statements":["a) Ghi chép chi tiêu giúp quản lí tiền hiệu quả.","b) Tổng kết, cắt giảm khoản không cần thiết là tiết kiệm.","c) Để dành tiền hằng tháng là thói quen tốt.","d) Học sinh không cần quản lí chi tiêu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: quản lí tài chính cá nhân. d) Sai: nên tập từ sớm.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Người tiêu dùng có quyền yêu cầu đổi trả và ... khi mua phải hàng giả. (2 từ)","answer":"tố cáo","explain":"Tố cáo hành vi vi phạm.","points":0.5},{"type":"short","level":"VDC","q":"Phân biệt: ... là chi tiêu hợp lí, còn keo kiệt là không dám chi cả khi cần thiết. (Điền 2 từ)","answer":"Tiết kiệm","explain":"Tiết kiệm khác keo kiệt.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Hành vi nào sau đây là tiêu dùng thông minh?","options":["A. So sánh giá, chất lượng trước khi mua.","B. Mua theo quảng cáo mà không tìm hiểu.","C. Mua vì bạn bè rủ.","D. Mua càng đắt càng tốt."],"answer":"A","explain":"Tìm hiểu, so sánh trước khi mua.","points":0.25},{"type":"mcq","level":"NB","q":"Để bảo vệ sức khoẻ, khi mua thực phẩm cần","options":["A. chọn hàng có nguồn gốc rõ ràng, còn hạn sử dụng.","B. chọn hàng rẻ nhất.","C. không cần quan tâm.","D. mua hàng không nhãn mác."],"answer":"A","explain":"An toàn thực phẩm là ưu tiên.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi xả rác bừa bãi khi đi mua sắm thể hiện","options":["A. thiếu văn hoá tiêu dùng.","B. sự thoải mái.","C. quyền tự do.","D. văn minh."],"answer":"A","explain":"Xả rác bừa bãi thiếu văn hoá, gây ô nhiễm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nên hạn chế mua hàng online từ nguồn không uy tín?","options":["A. Vì dễ mua phải hàng giả, hàng kém chất lượng, khó đổi trả.","B. Vì hàng online luôn đắt.","C. Vì không được giảm giá.","D. Vì pháp luật cấm mua online."],"answer":"A","explain":"Mua online cần chọn nguồn uy tín.","points":0.25},{"type":"mcq","level":"TH","q":"Một người luôn đọc kĩ nhãn mác, hạn sử dụng trước khi mua. Đây là","options":["A. người tiêu dùng thông minh, có trách nhiệm với sức khoẻ.","B. người kĩ tính quá mức.","C. người lãng phí thời gian.","D. người thiếu tiền."],"answer":"A","explain":"Tìm hiểu kĩ là thông minh.","points":0.25},{"type":"mcq","level":"VD","q":"Trên mạng xã hội, nhiều người nổi tiếng quảng cáo sản phẩm không rõ nguồn gốc với lời hứa viển vông. Người tiêu dùng thông minh sẽ","options":["A. tin ngay và mua theo.","B. kiểm chứng thông tin, không tin lời quảng cáo thổi phồng.","C. mua thật nhiều để ủng hộ.","D. chia sẻ cho người khác mua."],"answer":"B","explain":"Cảnh giác với quảng cáo của người nổi tiếng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nên đọc kĩ nhãn mác, hạn sử dụng trước khi mua.","b) Nên so sánh giá, chất lượng trước khi mua.","c) Không nên tin tuyệt đối vào quảng cáo.","d) Cứ hàng đắt tiền là hàng tốt, không cần tìm hiểu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đắt chưa chắc tốt, cần tìm hiểu.","points":1},{"type":"truefalse","level":"VDC","q":"Bà Sáu bán rau ở chợ, khách quen vì rau tươi, cân đúng, giá phải chăng; bà còn tặng thêm rau thơm cho khách. Xét tính đúng, sai:","statements":["a) Bà Sáu là người bán hàng có đạo đức.","b) Khách hàng tin tưởng là nhờ uy tín của bà.","c) Mối quan hệ mua bán văn minh, tôn trọng lẫn nhau.","d) Người bán không cần quan tâm đến khách hàng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Trước khi mua, cần đọc kĩ nhãn mác và ... sử dụng. (2 từ: ... sử dụng)","answer":"hạn","explain":"Hạn sử dụng.","points":0.5},{"type":"short","level":"VDC","q":"Khi mua hàng online, nên chọn nguồn uy tín và kiểm tra kĩ ... trước khi nhận hàng. (Điền 2 từ)","answer":"hàng hoá","explain":"Kiểm tra hàng hoá trước khi nhận.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Văn hoá tiêu dùng góp phần","options":["A. xây dựng xã hội văn minh.","B. tăng rác thải.","C. khuyến khích hoang phí.","D. làm hại sức khoẻ."],"answer":"A","explain":"Tiêu dùng văn minh xây dựng xã hội văn minh.","points":0.25},{"type":"mcq","level":"NB","q":"Để giảm rác thải nhựa, mỗi người nên","options":["A. mang túi vải, bình nước cá nhân.","B. dùng thật nhiều túi nilon.","C. vứt rác bừa bãi.","D. đốt rác nhựa."],"answer":"A","explain":"Giảm nhựa dùng một lần.","points":0.25},{"type":"mcq","level":"NB","q":"Mua hàng Việt chất lượng thể hiện","options":["A. văn hoá tiêu dùng và lòng yêu nước.","B. sự lạc hậu.","C. thiếu tiền.","D. không có lựa chọn."],"answer":"A","explain":"Ưu tiên hàng Việt chất lượng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao học sinh cần được giáo dục văn hoá tiêu dùng từ sớm?","options":["A. Vì hình thành thói quen chi tiêu tốt, sống có trách nhiệm từ nhỏ.","B. Vì học sinh có nhiều tiền.","C. Vì không cần thiết.","D. Vì để thi cử."],"answer":"A","explain":"Giáo dục sớm hình thành thói quen tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn học sinh thường xuyên mua đồ ăn vặt không rõ nguồn gốc ở cổng trường. Điều này","options":["A. không sao cả.","B. nguy hại sức khoẻ, thiếu văn hoá tiêu dùng.","C. tiết kiệm.","D. đáng khuyến khích."],"answer":"B","explain":"Hàng rong không rõ nguồn gốc nguy hại.","points":0.25},{"type":"mcq","level":"VD","q":"Trường em tổ chức phiên chợ quê, học sinh bán nông sản sạch của gia đình, không dùng túi nilon. Hoạt động này","options":["A. vô bổ.","B. giáo dục văn hoá tiêu dùng, tiêu dùng xanh thiết thực.","C. lãng phí thời gian.","D. chỉ để vui."],"answer":"B","explain":"Trải nghiệm thực tế về tiêu dùng văn minh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn hoá tiêu dùng góp phần xây dựng xã hội văn minh.","b) Giảm rác thải nhựa là trách nhiệm của mỗi người.","c) Ưu tiên hàng Việt chất lượng là văn hoá.","d) Học sinh không cần quan tâm đến văn hoá tiêu dùng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần giáo dục từ sớm.","points":1},{"type":"truefalse","level":"VDC","q":"Siêu thị Y triển khai: khách mang túi vải được tích điểm, khu hàng Việt được trưng bày nổi bật, thùng rác phân loại khắp siêu thị. Xét tính đúng, sai:","statements":["a) Đây là mô hình kinh doanh gắn với văn hoá tiêu dùng.","b) Khuyến khích khách mang túi vải là bảo vệ môi trường.","c) Ưu tiên hàng Việt là trách nhiệm xã hội của siêu thị.","d) Doanh nghiệp không cần quan tâm đến văn hoá tiêu dùng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Ưu tiên dùng hàng ... chất lượng là nét đẹp văn hoá tiêu dùng. (1 từ)","answer":"Việt","explain":"Hàng Việt chất lượng.","points":0.5},{"type":"short","level":"VDC","q":"Thay túi nilon bằng túi vải, bình nhựa bằng bình cá nhân là thực hiện tiêu dùng ... (1 từ)","answer":"xanh","explain":"Tiêu dùng xanh.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Câu nào sau đây đúng về văn hoá tiêu dùng?","options":["A. Là nét đẹp trong thói quen, hành vi tiêu dùng.","B. Là số tiền tiêu dùng.","C. Là thu nhập.","D. Là sở thích cá nhân."],"answer":"A","explain":"Đúng định nghĩa SGK.","points":0.25},{"type":"mcq","level":"NB","q":"Người tiêu dùng có văn hoá sẽ","options":["A. tôn trọng người bán, văn minh nơi công cộng.","B. chen lấn, xô đẩy.","C. khinh thường người bán.","D. cãi vã."],"answer":"A","explain":"Ứng xử văn minh.","points":0.25},{"type":"mcq","level":"NB","q":"Tiết kiệm điện, nước trong sinh hoạt là","options":["A. văn hoá tiêu dùng.","B. keo kiệt.","C. nghèo khó.","D. không cần thiết."],"answer":"A","explain":"Tiết kiệm tài nguyên là văn hoá.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chen lấn khi mua hàng là thiếu văn hoá?","options":["A. Vì xâm phạm quyền lợi người khác, gây mất trật tự.","B. Vì mua được nhanh.","C. Vì ai cũng làm vậy.","D. Vì không sao."],"answer":"A","explain":"Tôn trọng người xung quanh.","points":0.25},{"type":"mcq","level":"TH","q":"Một khách hàng luôn cảm ơn người bán dù mua ít. Điều này thể hiện","options":["A. sự tôn trọng, văn hoá ứng xử đẹp.","B. sự giả tạo.","C. không cần thiết.","D. lãng phí thời gian."],"answer":"A","explain":"Lời cảm ơn thể hiện văn hoá.","points":0.25},{"type":"mcq","level":"VD","q":"Trong dịp lễ, nhiều người đổ xô mua sắm, chen lấn, xả rác. Để thay đổi, cần","options":["A. cấm mua sắm.","B. giáo dục ý thức, mỗi người tự giác văn minh.","C. mặc kệ.","D. tăng giá."],"answer":"B","explain":"Giáo dục và tự giác.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tôn trọng người bán là văn hoá.","b) Tiết kiệm tài nguyên là văn hoá.","c) Chen lấn khi mua hàng là thiếu văn hoá.","d) Văn hoá tiêu dùng không liên quan đến ứng xử."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ứng xử là một nội dung.","points":1},{"type":"truefalse","level":"VDC","q":"Phố đi bộ của thành phố quy định: không xả rác, xếp hàng khi mua hàng, ưu tiên thanh toán không tiền mặt. Xét tính đúng, sai:","statements":["a) Đây là xây dựng văn hoá tiêu dùng nơi công cộng.","b) Quy định giúp không gian mua sắm văn minh, sạch đẹp.","c) Mỗi người cần tự giác chấp hành.","d) Quy định này là không cần thiết, gây phiền hà."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần thiết để văn minh.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Xếp hàng, tôn trọng người bán là ứng xử ... khi mua sắm. (2 từ)","answer":"văn minh","explain":"Ứng xử văn minh.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại 4 chữ: Thông minh, Tiết kiệm, Văn minh và ... (Điền 2 từ)","answer":"Trách nhiệm","explain":"Trách nhiệm với bản thân, cộng đồng, môi trường.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Bốn nội dung của văn hoá tiêu dùng là","options":["A. thông minh, tiết kiệm, văn minh, trách nhiệm.","B. giàu có, sang trọng, đẳng cấp, thời thượng.","C. nhanh, nhiều, rẻ, đẹp.","D. mua, bán, đổi, trả."],"answer":"A","explain":"Thông minh – Tiết kiệm – Văn minh – Trách nhiệm.","points":0.25},{"type":"mcq","level":"NB","q":"Tiêu dùng thông minh là","options":["A. mua theo nhu cầu, tìm hiểu kĩ, so sánh trước khi mua.","B. mua theo cảm hứng.","C. mua càng nhiều càng tốt.","D. không cần suy nghĩ."],"answer":"A","explain":"Thông minh = hiểu biết, cân nhắc.","points":0.25},{"type":"mcq","level":"NB","q":"Tiêu dùng có trách nhiệm là","options":["A. quan tâm đến cộng đồng, môi trường khi mua sắm.","B. chỉ lo cho bản thân.","C. mặc kệ xã hội.","D. gây ô nhiễm."],"answer":"A","explain":"Trách nhiệm với cộng đồng, môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao mua hàng không rõ nguồn gốc là thiếu trách nhiệm?","options":["A. Vì hại sức khoẻ bản thân, tiếp tay cho hàng giả, làm hại doanh nghiệp chân chính.","B. Vì hàng không rõ nguồn gốc rẻ.","C. Vì không ai biết.","D. Vì pháp luật cho phép."],"answer":"A","explain":"Trách nhiệm với bản thân và xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Một gia đình dùng nước vo gạo tưới cây, thức ăn thừa cho gà. Đây là","options":["A. lạc hậu.","B. tiết kiệm, tận dụng, bảo vệ môi trường.","C. keo kiệt.","D. không văn minh."],"answer":"B","explain":"Tận dụng, tránh lãng phí.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn An được mẹ cho tiền mua sách tham khảo. An so sánh giá 3 nhà sách, chọn nơi rẻ nhất mà đảm bảo sách thật. Cách làm của An","options":["A. keo kiệt.","B. tiêu dùng thông minh.","C. lãng phí thời gian.","D. không cần thiết."],"answer":"B","explain":"So sánh, lựa chọn hợp lí.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tiêu dùng thông minh là tìm hiểu, so sánh trước khi mua.","b) Tiêu dùng có trách nhiệm là quan tâm đến cộng đồng, môi trường.","c) Tận dụng, tránh lãng phí là văn hoá.","d) Văn hoá tiêu dùng chỉ dành cho người giàu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: dành cho mọi người.","points":1},{"type":"truefalse","level":"VDC","q":"Trường THPT X tổ chức ngày hội tiêu dùng xanh: gian hàng đổi giấy vụn lấy cây xanh, thi thiết kế túi vải, tọa đàm chống rác thải nhựa. Xét tính đúng, sai:","statements":["a) Đây là giáo dục văn hoá tiêu dùng cho học sinh.","b) Đổi giấy vụn lấy cây xanh khuyến khích tái chế.","c) Học sinh là lực lượng quan trọng lan toả lối sống xanh.","d) Hoạt động này không liên quan đến bài học."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: rất liên quan.","points":1},{"type":"short","level":"VD","q":"Hoàn thành: Tiêu dùng ... là mua theo nhu cầu, tìm hiểu kĩ trước khi mua. (2 từ)","answer":"thông minh","explain":"Tiêu dùng thông minh.","points":0.5},{"type":"short","level":"VDC","q":"Đổi giấy vụn lấy cây xanh, dùng túi vải thay túi nilon là những hành động bảo vệ ... (Điền 2 từ)","answer":"môi trường","explain":"Bảo vệ môi trường.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Phê phán thói quen nào sau đây trong tiêu dùng?","options":["A. Mua sắm hoang phí, chạy theo mốt.","B. Tiết kiệm.","C. Mua hàng rõ nguồn gốc.","D. Bảo vệ môi trường."],"answer":"A","explain":"Hoang phí, chạy theo mốt cần phê phán.","points":0.25},{"type":"mcq","level":"NB","q":"Để trở thành người tiêu dùng văn minh, cần","options":["A. học hỏi kiến thức tiêu dùng, rèn thói quen tốt.","B. có thật nhiều tiền.","C. mua sắm thật nhiều.","D. không cần học."],"answer":"A","explain":"Rèn luyện thói quen tốt.","points":0.25},{"type":"mcq","level":"NB","q":"Khi thấy người khác xả rác bừa bãi nơi công cộng, em nên","options":["A. nhắc nhở nhẹ nhàng, gương mẫu không xả rác.","B. mặc kệ.","C. xả rác theo.","D. cãi nhau."],"answer":"A","explain":"Nhắc nhở văn minh, gương mẫu.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao văn hoá tiêu dùng quan trọng trong thời đại hiện nay?","options":["A. Vì tiêu dùng ảnh hưởng đến sức khoẻ, môi trường và sự phát triển bền vững.","B. Vì mọi người giàu lên.","C. Vì hàng hoá khan hiếm.","D. Vì không có việc gì khác."],"answer":"A","explain":"Tiêu dùng gắn với phát triển bền vững.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn trẻ thường khoe mua hàng hiệu đắt tiền để thể hiện đẳng cấp. Đây là","options":["A. văn hoá tiêu dùng.","B. thói quen đua đòi, thiếu văn hoá.","C. đáng ngưỡng mộ.","D. thông minh."],"answer":"B","explain":"Đua đòi, khoe khoang là thiếu văn hoá.","points":0.25},{"type":"mcq","level":"VD","q":"Trong giờ sinh hoạt lớp, em sẽ đề xuất phong trào nào để xây dựng văn hoá tiêu dùng?","options":["A. thi ăn vặt nhiều nhất.","B. tuần lễ tiết kiệm, chống lãng phí, bảo vệ môi trường.","C. thi mua sắm nhiều nhất.","D. không đề xuất gì."],"answer":"B","explain":"Phong trào thiết thực.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cần phê phán thói quen mua sắm hoang phí.","b) Đua đòi, khoe khoang là thiếu văn hoá.","c) Rèn thói quen tốt từ nhỏ rất quan trọng.","d) Văn hoá tiêu dùng không cần giáo dục."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần giáo dục.","points":1},{"type":"truefalse","level":"VDC","q":"Khu dân cư của em phát động: mỗi hộ mang túi vải đi chợ, phân loại rác tại nguồn, ưu tiên hàng Việt. Sau 6 tháng, khu phố sạch đẹp hẳn. Xét tính đúng, sai:","statements":["a) Đây là xây dựng văn hoá tiêu dùng cộng đồng.","b) Mỗi hộ gia đình đều có vai trò.","c) Thói quen tốt lan toả tạo thay đổi tích cực.","d) Chỉ cần một vài người làm là đủ, không cần cả cộng đồng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần sự chung tay.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Cần phê phán thói quen mua sắm ..., chạy theo mốt. (2 từ)","answer":"hoang phí","explain":"Hoang phí.","points":0.5},{"type":"short","level":"VDC","q":"Để xây dựng văn hoá tiêu dùng, mỗi người cần rèn thói quen tốt từ khi còn ... (Điền 1 từ)","answer":"nhỏ","explain":"Giáo dục từ nhỏ.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tóm lại, văn hoá tiêu dùng là","options":["A. tiêu dùng văn minh: thông minh, tiết kiệm, văn minh, trách nhiệm.","B. tiêu dùng thật nhiều.","C. tiêu dùng hàng đắt tiền.","D. không tiêu dùng."],"answer":"A","explain":"Tổng kết bài học.","points":0.25},{"type":"mcq","level":"NB","q":"Người tiêu dùng văn minh góp phần","options":["A. làm thị trường sạch hơn, xã hội đẹp hơn.","B. tăng hàng giả.","C. gây ô nhiễm.","D. lãng phí."],"answer":"A","explain":"Tác động tích cực.","points":0.25},{"type":"mcq","level":"NB","q":"Học sinh thể hiện văn hoá tiêu dùng bằng cách","options":["A. chi tiêu hợp lí, bảo vệ môi trường, ứng xử văn minh.","B. đua đòi mua sắm.","C. xả rác bừa bãi.","D. ham rẻ mua hàng giả."],"answer":"A","explain":"Thực hành hằng ngày.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa văn hoá tiêu dùng và đạo đức kinh doanh là","options":["A. không liên quan.","B. bổ trợ nhau: người bán tử tế gặp người mua văn minh tạo thị trường lành mạnh.","C. mâu thuẫn.","D. đối lập."],"answer":"B","explain":"Hai mặt của thị trường văn minh.","points":0.25},{"type":"mcq","level":"TH","q":"Một xã hội có văn hoá tiêu dùng cao sẽ","options":["A. văn minh, phát triển bền vững.","B. lạc hậu.","C. nghèo nàn.","D. bất ổn."],"answer":"A","explain":"Văn hoá tiêu dùng góp phần phát triển bền vững.","points":0.25},{"type":"mcq","level":"VD","q":"Em sẽ vận dụng bài học văn hoá tiêu dùng vào đời sống bằng cách","options":["A. lập kế hoạch chi tiêu, tiết kiệm, bảo vệ môi trường, ứng xử văn minh.","B. mua sắm thoải mái không cần nghĩ.","C. đua đòi theo bạn bè.","D. không quan tâm."],"answer":"A","explain":"Vận dụng thực tế.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn hoá tiêu dùng là tiêu dùng văn minh, có trách nhiệm.","b) Mỗi người đều có thể thực hành văn hoá tiêu dùng hằng ngày.","c) Văn hoá tiêu dùng góp phần phát triển bền vững.","d) Chỉ người giàu mới cần văn hoá tiêu dùng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: dành cho mọi người.","points":1},{"type":"truefalse","level":"VDC","q":"Sau khi học xong Phần 1, bạn An rút ra: làm kinh tế phải hiểu cạnh tranh, cung cầu, lạm phát, thất nghiệp; làm người phải có đạo đức, văn hoá. Xét tính đúng, sai:","statements":["a) Hiểu biết kinh tế giúp An chi tiêu, định hướng nghề nghiệp tốt hơn.","b) Đạo đức kinh doanh và văn hoá tiêu dùng là hành trang làm người.","c) Kiến thức kinh tế chỉ dành cho người làm kinh doanh.","d) Học sinh cũng cần hiểu biết kinh tế để sống tốt hơn."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: ai cũng cần.","points":1},{"type":"short","level":"VD","q":"Hoàn thành: Tiêu dùng văn minh là sống có ... (Điền 2 từ)","answer":"trách nhiệm","explain":"Sống có trách nhiệm.","points":0.5},{"type":"short","level":"VDC","q":"Bài học cuối: Hãy là người tiêu dùng ..., người kinh doanh tử tế. (Điền 2 từ)","answer":"văn minh","explain":"Người tiêu dùng văn minh.","points":0.5}]}]}</script>
