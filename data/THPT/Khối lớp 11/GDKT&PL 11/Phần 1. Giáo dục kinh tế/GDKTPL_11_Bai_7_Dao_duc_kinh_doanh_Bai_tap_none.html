<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Đạo đức kinh doanh được hiểu là","options":["A. những chuẩn mực đạo đức được vận dụng vào hoạt động kinh doanh.","B. số tiền lãi thu được.","C. chiến lược quảng cáo.","D. quy mô doanh nghiệp."],"answer":"A","explain":"Đúng định nghĩa SGK: chuẩn mực đạo đức (tốt – xấu, đúng – sai) vận dụng vào kinh doanh.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện nào sau đây là có đạo đức kinh doanh với khách hàng?","options":["A. Bán hàng giả, hàng kém chất lượng.","B. Quảng cáo sai sự thật.","C. Hàng đảm bảo chất lượng, giá hợp lí, bảo hành đầy đủ.","D. Cân thiếu, đong non."],"answer":"C","explain":"Trung thực về chất lượng, giá cả, bảo hành là đạo đức với khách hàng.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi nào sau đây thiếu đạo đức kinh doanh?","options":["A. Nộp thuế đầy đủ.","B. Bảo vệ môi trường.","C. Sản xuất hàng giả, thực phẩm bẩn.","D. Trả lương xứng đáng."],"answer":"C","explain":"Hàng giả, thực phẩm bẩn vừa vi phạm pháp luật vừa thiếu đạo đức.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao đạo đức kinh doanh tạo ra lợi thế cạnh tranh bền vững?","options":["A. Vì tạo uy tín, niềm tin khiến khách hàng gắn bó lâu dài, khó bị sao chép.","B. Vì giúp trốn thuế.","C. Vì giúp giảm giá thành.","D. Vì không cần quảng cáo."],"answer":"A","explain":"Uy tín từ đạo đức là lợi thế bền vững nhất: khách hàng trung thành, tiếng lành đồn xa.","points":0.25},{"type":"mcq","level":"TH","q":"Quán phở của bà Tư luôn dùng nguyên liệu tươi, không dùng hàn the, cân đúng. Việc làm của bà Tư thể hiện","options":["A. đạo đức kinh doanh tốt với khách hàng.","B. sự lãng phí.","C. thiếu năng lực.","D. không biết kinh doanh."],"answer":"A","explain":"Trung thực về chất lượng, đảm bảo sức khoẻ khách hàng là đạo đức kinh doanh.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty thực phẩm bị phát hiện dùng hoá chất cấm để ướp thịt, dù giá rẻ nhưng người tiêu dùng tẩy chay, công ty phá sản. Bài học là","options":["A. nên giấu kĩ hơn.","B. thiếu đạo đức kinh doanh thì mất uy tín, mất tất cả.","C. giá rẻ luôn thắng.","D. người tiêu dùng khó tính."],"answer":"B","explain":"Mất đạo đức → mất niềm tin → mất khách hàng → phá sản.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đạo đức kinh doanh là làm giàu một cách tử tế.","b) Bán hàng đảm bảo chất lượng là biểu hiện đạo đức với khách hàng.","c) Cạnh tranh lành mạnh là biểu hiện đạo đức với đối thủ.","d) Trốn thuế là biểu hiện đạo đức với xã hội."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: trốn thuế là thiếu đạo đức, vi phạm pháp luật.","points":1},{"type":"truefalse","level":"VDC","q":"Công ty sữa X công bố đúng thành phần dinh dưỡng, giá niêm yết rõ ràng, có chương trình tặng sữa cho trẻ em nghèo vùng cao. Đối thủ Y thì quảng cáo sai sự thật, bị phát hiện và bị phạt. Xét tính đúng, sai:","statements":["a) Công ty X thực hiện tốt đạo đức kinh doanh.","b) Tặng sữa cho trẻ em nghèo là trách nhiệm xã hội của doanh nghiệp.","c) Quảng cáo sai sự thật của Y vừa thiếu đạo đức vừa vi phạm pháp luật.","d) Đạo đức kinh doanh không ảnh hưởng đến sự tồn tại của doanh nghiệp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đạo đức quyết định uy tín và sự tồn tại bền vững.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Đạo đức kinh doanh là làm giàu một cách ... (2 từ)","answer":"tử tế","explain":"Làm giàu một cách tử tế — kiếm lợi nhuận bằng con đường trung thực.","points":0.5},{"type":"short","level":"VDC","q":"Doanh nghiệp cam kết đóng góp cho cộng đồng, bảo vệ môi trường bên cạnh mục tiêu lợi nhuận thể hiện trách nhiệm ... của doanh nghiệp. (Điền 2 từ)","answer":"xã hội","explain":"Trách nhiệm xã hội của doanh nghiệp.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Biểu hiện đạo đức kinh doanh với người lao động là","options":["A. trả lương xứng đáng, đảm bảo an toàn, đóng bảo hiểm đầy đủ.","B. bóc lột sức lao động.","C. nợ lương kéo dài.","D. phân biệt đối xử."],"answer":"A","explain":"Đảm bảo quyền lợi người lao động là đạo đức.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện đạo đức kinh doanh với xã hội, môi trường là","options":["A. trốn thuế.","B. xả thải gây ô nhiễm.","C. nộp thuế đầy đủ, bảo vệ môi trường, làm từ thiện.","D. thờ ơ với cộng đồng."],"answer":"C","explain":"Nộp thuế, bảo vệ môi trường, từ thiện là trách nhiệm xã hội.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện đạo đức kinh doanh với đối thủ cạnh tranh là","options":["A. tung tin xấu hạ uy tín đối thủ.","B. cạnh tranh lành mạnh bằng chất lượng, không chơi xấu.","C. phá hoại cơ sở đối thủ.","D. bán phá giá triệt hạ đối thủ."],"answer":"B","explain":"Cạnh tranh lành mạnh, không chơi xấu.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói uy tín là tài sản quý nhất của doanh nghiệp?","options":["A. Vì uy tín mang lại khách hàng trung thành, khó bị đối thủ sao chép.","B. Vì uy tín thay thế được vốn.","C. Vì uy tín miễn thuế.","D. Vì uy tín không cần giữ gìn."],"answer":"A","explain":"Uy tín tạo niềm tin, khách hàng gắn bó — lợi thế bền vững.","points":0.25},{"type":"mcq","level":"TH","q":"Người tiêu dùng góp phần đấu tranh với hành vi thiếu đạo đức kinh doanh bằng cách","options":["A. tẩy chay hàng giả, tố cáo vi phạm đến cơ quan chức năng.","B. tiếp tục mua hàng giả vì rẻ.","C. im lặng.","D. bao che cho người vi phạm."],"answer":"A","explain":"Tẩy chay và tố cáo là quyền và trách nhiệm của người tiêu dùng.","points":0.25},{"type":"mcq","level":"VD","q":"Một thương hiệu nước mắm truyền thống giữ đúng chất lượng hàng chục năm, dù giá cao hơn vẫn được tin dùng. Điều này chứng tỏ","options":["A. giá cao luôn thắng.","B. đạo đức kinh doanh tạo uy tín bền vững, thắng lợi lâu dài.","C. quảng cáo là tất cả.","D. người tiêu dùng dễ dãi."],"answer":"B","explain":"Uy tín từ chất lượng thật là thương hiệu quý nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trả lương xứng đáng là đạo đức với người lao động.","b) Nộp thuế đầy đủ là đạo đức với xã hội.","c) Bảo vệ môi trường là trách nhiệm của doanh nghiệp.","d) Doanh nghiệp chỉ cần lo lợi nhuận, không cần quan tâm xã hội."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: doanh nghiệp có trách nhiệm xã hội.","points":1},{"type":"truefalse","level":"VDC","q":"Nhà máy Z xả thải chưa qua xử lí ra sông, cá chết hàng loạt, người dân quanh vùng bức xúc. Xét tính đúng, sai:","statements":["a) Hành vi của Z thiếu đạo đức kinh doanh với cộng đồng, môi trường.","b) Z vi phạm pháp luật về bảo vệ môi trường.","c) Người dân có quyền tố cáo, yêu cầu bồi thường thiệt hại.","d) Vì tạo việc làm nên Z được phép gây ô nhiễm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: không lí do nào biện minh cho gây ô nhiễm.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Bán hàng đảm bảo chất lượng, quảng cáo trung thực là đạo đức với ... (2 từ)","answer":"khách hàng","explain":"Đạo đức với khách hàng.","points":0.5},{"type":"short","level":"VDC","q":"Công thức thành công bền vững: Đạo đức tạo ra ..., ... tạo ra khách hàng trung thành. (Điền 1 từ)","answer":"uy tín","explain":"Đạo đức → Uy tín → Khách hàng trung thành → Phát triển bền vững.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Vai trò của đạo đức kinh doanh KHÔNG bao gồm","options":["A. tạo uy tín, niềm tin với khách hàng.","B. nâng cao sức cạnh tranh bền vững.","C. giúp trốn thuế dễ dàng.","D. góp phần phát triển xã hội."],"answer":"C","explain":"Trốn thuế là thiếu đạo đức, vi phạm pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Trách nhiệm xã hội của doanh nghiệp là","options":["A. chỉ cần thu lợi nhuận tối đa.","B. cam kết đóng góp cho phát triển bền vững của xã hội bên cạnh lợi nhuận.","C. không cần nộp thuế.","D. mặc kệ môi trường."],"answer":"B","explain":"Trách nhiệm xã hội: đóng góp cho cộng đồng, môi trường.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi nào sau đây cần bị lên án?","options":["A. Làm từ thiện.","B. Quảng cáo sai sự thật, lừa dối người tiêu dùng.","C. Bảo hành đầy đủ.","D. Nộp thuế đầy đủ."],"answer":"B","explain":"Lừa dối người tiêu dùng thiếu đạo đức, vi phạm pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao doanh nghiệp có đạo đức thường vượt qua khủng hoảng dễ hơn?","options":["A. Vì được khách hàng tin tưởng, ủng hộ ngay cả lúc khó khăn.","B. Vì được miễn thuế.","C. Vì không bao giờ gặp khó khăn.","D. Vì Nhà nước bao cấp."],"answer":"A","explain":"Uy tín tạo niềm tin; khách hàng gắn bó giúp vượt khó.","points":0.25},{"type":"mcq","level":"TH","q":"Một cửa hàng treo biển hàng Thái Lan nhưng bán hàng Trung Quốc kém chất lượng. Đây là","options":["A. chiến lược kinh doanh thông minh.","B. hành vi gian dối, thiếu đạo đức, vi phạm pháp luật.","C. quyền tự do kinh doanh.","D. quảng cáo sáng tạo."],"answer":"B","explain":"Treo đầu dê bán thịt chó — gian dối, vi phạm.","points":0.25},{"type":"mcq","level":"VD","q":"Trong đợt lũ lụt, công ty X ủng hộ 500 triệu đồng và 10 tấn gạo cho đồng bào vùng lũ. Việc làm này thể hiện","options":["A. trách nhiệm xã hội của doanh nghiệp.","B. quảng cáo.","C. trốn thuế.","D. lãng phí."],"answer":"A","explain":"Chia sẻ với cộng đồng lúc khó khăn là trách nhiệm xã hội.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đạo đức kinh doanh giúp tạo uy tín.","b) Uy tín giúp doanh nghiệp phát triển bền vững.","c) Trách nhiệm xã hội là đóng góp cho cộng đồng.","d) Thiếu đạo đức không ảnh hưởng gì đến doanh nghiệp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mất đạo đức thì mất uy tín, mất khách hàng.","points":1},{"type":"truefalse","level":"VDC","q":"Chủ cơ sở sản xuất giò chả dùng hàn the để giò dai, bắt mắt dù biết hại sức khoẻ; khi bị phát hiện thì đổ lỗi cho nhân viên. Xét tính đúng, sai:","statements":["a) Dùng hàn the là thiếu đạo đức, vi phạm pháp luật an toàn thực phẩm.","b) Đổ lỗi cho nhân viên thể hiện thiếu trách nhiệm.","c) Người tiêu dùng có quyền tẩy chay, tố cáo cơ sở này.","d) Vì giá rẻ nên hành vi này chấp nhận được."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: không lí do nào biện minh cho thực phẩm bẩn.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Cạnh tranh ... bằng chất lượng là biểu hiện đạo đức với đối thủ. (2 từ)","answer":"lành mạnh","explain":"Cạnh tranh lành mạnh, không chơi xấu.","points":0.5},{"type":"short","level":"VDC","q":"Khi phát hiện hàng giả, người tiêu dùng nên ... đến cơ quan chức năng. (Điền 2 từ)","answer":"tố cáo","explain":"Tố cáo hành vi vi phạm để bảo vệ mình và cộng đồng.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Doanh nghiệp thực hiện trách nhiệm xã hội bằng cách","options":["A. xây trường học, làm đường cho vùng khó khăn.","B. xả thải bừa bãi.","C. trốn thuế.","D. bóc lột lao động."],"answer":"A","explain":"Đóng góp cho cộng đồng là trách nhiệm xã hội.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo đức kinh doanh được thể hiện trước hết ở","options":["A. thái độ, hành vi trung thực trong mọi giao dịch.","B. số tiền từ thiện.","C. quy mô công ty.","D. số lượng quảng cáo."],"answer":"A","explain":"Trung thực trong mọi giao dịch là cốt lõi.","points":0.25},{"type":"mcq","level":"NB","q":"Câu nói nào sau đây thể hiện đạo đức kinh doanh?","options":["A. Buôn có bạn, bán có phường.","B. Chữ tín quý hơn vàng.","C. Được giá thì bán.","D. Lời nhiều là tốt."],"answer":"B","explain":"Chữ tín là cốt lõi của đạo đức kinh doanh.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao bóc lột người lao động là thiếu đạo đức kinh doanh?","options":["A. Vì xâm phạm quyền lợi, phẩm giá của người lao động.","B. Vì làm tăng chi phí.","C. Vì pháp luật cấm quảng cáo.","D. Vì không liên quan."],"answer":"A","explain":"Người lao động xứng đáng được đối xử công bằng, tôn trọng.","points":0.25},{"type":"mcq","level":"TH","q":"Một doanh nghiệp đầu tư hệ thống xử lí nước thải đạt chuẩn trước khi xả ra môi trường. Đây là","options":["A. lãng phí tiền bạc.","B. trách nhiệm với môi trường, biểu hiện đạo đức kinh doanh.","C. việc của Nhà nước.","D. không cần thiết."],"answer":"B","explain":"Bảo vệ môi trường là trách nhiệm xã hội của doanh nghiệp.","points":0.25},{"type":"mcq","level":"VD","q":"Siêu thị của anh Tuấn phát hiện lô hàng gần hết hạn. Anh quyết định giảm giá sâu, ghi rõ hạn sử dụng để khách lựa chọn thay vì trà trộn bán giá thường. Cách làm này","options":["A. gây lỗ, không nên.","B. thể hiện sự trung thực với khách hàng — đạo đức kinh doanh tốt.","C. vi phạm pháp luật.","D. thiếu năng lực."],"answer":"B","explain":"Trung thực về hạn sử dụng, để khách tự lựa chọn là đạo đức.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trung thực trong giao dịch là cốt lõi của đạo đức kinh doanh.","b) Bảo vệ môi trường là trách nhiệm của doanh nghiệp.","c) Chữ tín tạo niềm tin với khách hàng.","d) Đạo đức kinh doanh chỉ là hình thức, không cần thiết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đạo đức là nền tảng phát triển bền vững.","points":1},{"type":"truefalse","level":"VDC","q":"Tiệm vàng B mua vàng của khách luôn cân đúng, thử tuổi vàng công khai, giá niêm yết rõ ràng nên rất đông khách dù có nhiều tiệm khác. Xét tính đúng, sai:","statements":["a) Tiệm B thực hiện tốt đạo đức kinh doanh.","b) Trung thực tạo niềm tin, thu hút khách hàng.","c) Trong kinh doanh vàng, chữ tín đặc biệt quan trọng.","d) Gian dối một lần không ảnh hưởng gì đến uy tín."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: một lần gian dối có thể mất hết uy tín.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: ... quý hơn vàng trong kinh doanh. (2 từ)","answer":"Chữ tín","explain":"Chữ tín quý hơn vàng.","points":0.5},{"type":"short","level":"VDC","q":"Doanh nghiệp nộp thuế đầy đủ, không xả thải bừa bãi, chăm lo đời sống công nhân thể hiện đầy đủ trách nhiệm với xã hội và ... (Điền 2 từ)","answer":"môi trường","explain":"Trách nhiệm với xã hội và môi trường.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Hành vi nào sau đây là có đạo đức kinh doanh?","options":["A. Niêm yết giá rõ ràng, bán đúng giá.","B. Nâng giá khi khách không để ý.","C. Trộn hàng kém chất lượng.","D. Ép khách mua hàng."],"answer":"A","explain":"Minh bạch giá cả là trung thực.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi nào sau đây thiếu đạo đức kinh doanh?","options":["A. Bảo hành đầy đủ.","B. Tư vấn trung thực.","C. Dùng cân non, cân thiếu.","D. Đổi trả hàng lỗi."],"answer":"C","explain":"Cân non là gian dối.","points":0.25},{"type":"mcq","level":"NB","q":"Môi trường kinh doanh lành mạnh là môi trường mà","options":["A. các doanh nghiệp cạnh tranh tử tế, tuân thủ pháp luật.","B. mạnh ai nấy gian lận.","C. hàng giả tràn lan.","D. không ai nộp thuế."],"answer":"A","explain":"Nhiều doanh nghiệp tử tế tạo thị trường văn minh.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao quảng cáo sai sự thật vừa thiếu đạo đức vừa vi phạm pháp luật?","options":["A. Vì lừa dối người tiêu dùng, xâm phạm quyền được thông tin trung thực.","B. Vì quảng cáo tốn tiền.","C. Vì không ai xem quảng cáo.","D. Vì pháp luật cấm quảng cáo."],"answer":"A","explain":"Người tiêu dùng có quyền được thông tin trung thực.","points":0.25},{"type":"mcq","level":"TH","q":"Một công ty bị tố bán hàng nhái thương hiệu nổi tiếng. Để khôi phục uy tín, công ty nên","options":["A. tiếp tục làm hàng nhái tinh vi hơn.","B. dừng ngay, xin lỗi, bồi thường và cam kết làm ăn chân chính.","C. đổ lỗi cho khách hàng.","D. đóng cửa trốn tránh."],"answer":"B","explain":"Nhận lỗi, khắc phục, làm lại tử tế là cách khôi phục uy tín.","points":0.25},{"type":"mcq","level":"VD","q":"Quán cà phê của chị Mai ghi rõ nguồn gốc cà phê nguyên chất, không độn bắp rang. Dù giá cao hơn quán bên cạnh, quán chị vẫn đông khách. Điều này cho thấy","options":["A. khách hàng chỉ quan tâm giá rẻ.","B. trung thực tạo niềm tin, khách hàng sẵn sàng trả giá xứng đáng.","C. quảng cáo là tất cả.","D. may mắn."],"answer":"B","explain":"Uy tín từ sự trung thực thắng giá rẻ gian dối.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Minh bạch giá cả là đạo đức kinh doanh.","b) Cân non, cân thiếu là gian dối.","c) Quảng cáo trung thực tôn trọng khách hàng.","d) Lừa dối khách hàng giúp kinh doanh bền vững."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lừa dối phá huỷ uy tín.","points":1},{"type":"truefalse","level":"VDC","q":"Công ty dược P quảng cáo thuốc chữa bách bệnh dù chưa được kiểm chứng, nhiều người bệnh tin mua, bệnh nặng thêm. Xét tính đúng, sai:","statements":["a) Quảng cáo sai sự thật về thuốc là thiếu đạo đức nghiêm trọng.","b) Hành vi này đe doạ sức khoẻ, tính mạng người bệnh.","c) Công ty P phải chịu trách nhiệm pháp lí, bồi thường.","d) Vì mục đích lợi nhuận nên hành vi này chấp nhận được."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: vi phạm nghiêm trọng đạo đức và pháp luật. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Treo đầu dê, bán thịt ... là hành vi gian dối với khách hàng. (1 từ)","answer":"chó","explain":"Treo đầu dê bán thịt chó — quảng cáo một đằng, bán một nẻo.","points":0.5},{"type":"short","level":"VDC","q":"Để xây dựng thương hiệu bền vững, doanh nghiệp cần đặt ... lên hàng đầu trong mọi giao dịch. (Điền 2 từ)","answer":"chữ tín","explain":"Chữ tín là nền tảng thương hiệu.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Trốn thuế là hành vi","options":["A. thông minh.","B. thiếu đạo đức và vi phạm pháp luật.","C. được khuyến khích.","D. bình thường."],"answer":"B","explain":"Trốn thuế vừa thiếu đạo đức vừa vi phạm pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Bảo vệ môi trường trong sản xuất thể hiện","options":["A. trách nhiệm xã hội của doanh nghiệp.","B. sự lãng phí.","C. việc của Nhà nước.","D. không cần thiết."],"answer":"A","explain":"Trách nhiệm với môi trường, cộng đồng.","points":0.25},{"type":"mcq","level":"NB","q":"Người tiêu dùng thông minh là người","options":["A. mua hàng có nguồn gốc rõ ràng, tẩy chay hàng giả.","B. ham rẻ mua hàng không rõ nguồn gốc.","C. không quan tâm chất lượng.","D. tin mọi quảng cáo."],"answer":"A","explain":"Lựa chọn thông minh góp phần đẩy lùi hàng giả.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao doanh nghiệp nên làm từ thiện, đóng góp cộng đồng?","options":["A. Vì đó là trách nhiệm xã hội, tạo hình ảnh đẹp, được xã hội ủng hộ.","B. Vì để trốn thuế.","C. Vì bắt buộc.","D. Vì lãng phí tiền."],"answer":"A","explain":"Trách nhiệm xã hội mang lại uy tín và sự ủng hộ.","points":0.25},{"type":"mcq","level":"TH","q":"Một doanh nghiệp xả thải gây ô nhiễm nhưng tạo nhiều việc làm. Đánh giá đúng là","options":["A. chấp nhận được vì tạo việc làm.","B. không chấp nhận được, phải xử lí chất thải đạt chuẩn.","C. nên bao che.","D. không ai quan tâm."],"answer":"B","explain":"Không lí do nào biện minh cho gây ô nhiễm.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Lan phát hiện cửa hàng gần nhà bán sữa hết hạn, xóa hạn cũ in hạn mới. Chị nên","options":["A. im lặng.","B. không mua nữa và tố cáo đến cơ quan quản lí thị trường.","C. mua vì rẻ.","D. giới thiệu cho người khác mua."],"answer":"B","explain":"Tố cáo bảo vệ mình và cộng đồng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trốn thuế vừa thiếu đạo đức vừa vi phạm pháp luật.","b) Gây ô nhiễm môi trường là thiếu trách nhiệm xã hội.","c) Người tiêu dùng nên tẩy chay hàng giả.","d) Doanh nghiệp không cần quan tâm đến cộng đồng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Làng X có nghề ướp thịt truyền thống. Một hộ dùng hoá chất cấm để thịt bắt mắt, bán rẻ hơn, khiến các hộ làm sạch bị mất khách. Xét tính đúng, sai:","statements":["a) Hộ dùng hoá chất cấm thiếu đạo đức, vi phạm pháp luật.","b) Hành vi này là cạnh tranh không lành mạnh.","c) Các hộ làm sạch nên kiên trì chất lượng và tố cáo vi phạm.","d) Người mua nên chọn hàng rẻ bất chấp chất lượng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: sức khoẻ quan trọng hơn giá rẻ.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Nộp thuế đầy đủ là đạo đức với ... (2 từ: ... nước)","answer":"Nhà nước","explain":"Đạo đức với Nhà nước, xã hội.","points":0.5},{"type":"short","level":"VDC","q":"Hành vi sản xuất, buôn bán hàng giả, hàng kém chất lượng cần bị lên án và ... theo pháp luật. (Điền 2 từ)","answer":"xử lí","explain":"Xử lí nghiêm theo pháp luật.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Đạo đức kinh doanh trước hết đòi hỏi người kinh doanh phải","options":["A. trung thực.","B. giàu có.","C. quảng cáo nhiều.","D. có quan hệ rộng."],"answer":"A","explain":"Trung thực là cốt lõi.","points":0.25},{"type":"mcq","level":"NB","q":"Khi mua phải hàng giả, người tiêu dùng có quyền","options":["A. yêu cầu đổi trả, bồi thường và tố cáo.","B. im lặng chịu thiệt.","C. đánh người bán.","D. không làm gì."],"answer":"A","explain":"Quyền được bảo vệ theo Luật Bảo vệ quyền lợi người tiêu dùng.","points":0.25},{"type":"mcq","level":"NB","q":"Doanh nghiệp có đạo đức với người lao động sẽ","options":["A. được người lao động gắn bó, yên tâm cống hiến.","B. bị thiệt hại.","C. tốn kém vô ích.","D. mất cạnh tranh."],"answer":"A","explain":"Đãi ngộ tốt giữ chân nhân tài.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói đạo đức kinh doanh và pháp luật có mối quan hệ mật thiết?","options":["A. Vì nhiều chuẩn mực đạo đức được pháp luật hoá thành quy định bắt buộc.","B. Vì không liên quan.","C. Vì đạo đức thay thế pháp luật.","D. Vì pháp luật cấm đạo đức."],"answer":"A","explain":"Hàng giả, trốn thuế, ô nhiễm vừa thiếu đạo đức vừa vi phạm pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Một chủ doanh nghiệp nói: Lợi nhuận là trên hết, đạo đức là thứ yếu. Quan điểm này","options":["A. đúng đắn.","B. sai lầm, vì thiếu đạo đức thì không bền vững.","C. hiện đại.","D. đáng học tập."],"answer":"B","explain":"Lợi nhuận bằng mọi giá dẫn đến mất uy tín, sụp đổ.","points":0.25},{"type":"mcq","level":"VD","q":"Trong khủng hoảng truyền thông vì sản phẩm lỗi, doanh nghiệp xử lí đúng đắn nhất là","options":["A. chối bỏ, đổ lỗi.","B. thừa nhận, xin lỗi, thu hồi, bồi thường và khắc phục.","C. im lặng.","D. đe dọa người tố cáo."],"answer":"B","explain":"Trung thực nhận lỗi, khắc phục là cách giữ uy tín.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trung thực là cốt lõi của đạo đức kinh doanh.","b) Người tiêu dùng có quyền được bồi thường khi mua phải hàng giả.","c) Đãi ngộ tốt giúp giữ chân người lao động.","d) Lợi nhuận bằng mọi giá là quan điểm đúng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Công ty thời trang Y dùng vải kém chất lượng nhưng gắn mác hàng hiệu, bán giá cao. Khi bị phát hiện, Y bị phạt nặng, khách hàng tẩy chay, nhiều đại lí huỷ hợp đồng. Xét tính đúng, sai:","statements":["a) Y đã gian dối, thiếu đạo đức kinh doanh.","b) Hậu quả cho thấy mất uy tín thì mất tất cả.","c) Đại lí huỷ hợp đồng là phản ứng chính đáng.","d) Chỉ cần nộp phạt là xong, không cần thay đổi."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: phải thay đổi thực chất mới tồn tại.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Đạo đức kinh doanh là những ... đạo đức vận dụng vào kinh doanh. (2 từ)","answer":"chuẩn mực","explain":"Chuẩn mực đạo đức.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Muốn phát triển bền vững, doanh nghiệp phải kinh doanh có ... (Điền 2 từ)","answer":"đạo đức","explain":"Kinh doanh có đạo đức.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Câu nào sau đây đúng về đạo đức kinh doanh?","options":["A. Là chuẩn mực đạo đức vận dụng vào kinh doanh.","B. Là số vốn kinh doanh.","C. Là chiến lược giá.","D. Là quy mô thị trường."],"answer":"A","explain":"Đúng định nghĩa SGK.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện nào là thiếu đạo đức với khách hàng?","options":["A. Bảo hành đầy đủ.","B. Tư vấn trung thực.","C. Ép khách mua hàng kém chất lượng.","D. Niêm yết giá rõ ràng."],"answer":"C","explain":"Ép mua hàng kém chất lượng là gian dối.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện nào là có đạo đức với môi trường?","options":["A. Xả thải bừa bãi.","B. Đầu tư xử lí chất thải đạt chuẩn.","C. Chặt phá rừng.","D. Gây ô nhiễm."],"answer":"B","explain":"Xử lí chất thải đạt chuẩn là trách nhiệm môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao người tiêu dùng nên nói không với hàng giả?","options":["A. Vì hàng giả hại sức khoẻ, tiếp tay cho vi phạm, làm hại doanh nghiệp chân chính.","B. Vì hàng giả rẻ.","C. Vì không ai kiểm tra.","D. Vì thích hàng giả."],"answer":"A","explain":"Tẩy chay hàng giả bảo vệ mình và thị trường.","points":0.25},{"type":"mcq","level":"TH","q":"Một doanh nghiệp luôn công khai minh bạch tài chính, nộp thuế đầy đủ. Đây là","options":["A. đạo đức với Nhà nước và xã hội.","B. lãng phí.","C. không cần thiết.","D. khoe khoang."],"answer":"A","explain":"Minh bạch, nộp thuế đầy đủ là trách nhiệm.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn An mở shop bán đồ ăn vặt online. An luôn ghi rõ hạn sử dụng, nguồn gốc, đổi trả nếu hàng lỗi. Cách làm này","options":["A. làm giảm lợi nhuận.","B. xây dựng uy tín, khách hàng tin tưởng quay lại.","C. không cần thiết.","D. tốn thời gian."],"answer":"B","explain":"Trung thực tạo uy tín, .","B. có trách nhiệm.","C. đáng khuyến khích.","D. bình thường."],"answer":"A","explain":"Vừa thiếu đạo đức vừa vi phạm pháp luật môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các thương hiệu lớn thường đầu tư cho trách nhiệm xã hội?","options":["A. Vì tạo hình ảnh đẹp, được xã hội tin yêu, phát triển bền vững.","B. Vì thừa tiền.","C. Vì bắt buộc.","D. Vì không có việc gì làm."],"answer":"A","explain":"Trách nhiệm xã hội mang lại uy tín và sự ủng hộ.","points":0.25},{"type":"mcq","level":"TH","q":"Một công ty thực phẩm bị phát hiện dùng nguyên liệu hết hạn. Người tiêu dùng nên","options":["A. tiếp tục mua vì rẻ.","B. ngừng mua, tố cáo để bảo vệ sức khoẻ cộng đồng.","C. im lặng.","D. mua nhiều hơn."],"answer":"B","explain":"Tẩy chay và tố cáo.","points":0.25},{"type":"mcq","level":"VD","q":"Trong bài thuyết trình về khởi nghiệp, em sẽ nhấn mạnh với các bạn điều gì?","options":["A. Kiếm tiền bằng mọi giá.","B. Kinh doanh phải có đạo đức: trung thực, có trách nhiệm mới bền vững.","C. Đạo đức không quan trọng.","D. Chỉ cần giàu nhanh."],"answer":"B","explain":"Thông điệp cốt lõi của bài học.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bóc lột lao động là thiếu đạo đức.","b) Gây ô nhiễm là thiếu trách nhiệm xã hội.","c) Trách nhiệm xã hội tạo hình ảnh đẹp cho doanh nghiệp.","d) Đạo đức kinh doanh không liên quan đến pháp luật."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhiều chuẩn mực đạo đức được pháp luật hoá.","points":1},{"type":"truefalse","level":"VDC","q":"Sau khi học bài đạo đức kinh doanh, nhóm bạn quyết định mở gian hàng hội chợ với cam kết: hàng rõ nguồn gốc, giá niêm yết, không nói thách, trích 10% lãi ủng hộ bạn nghèo. Xét tính đúng, sai:","statements":["a) Nhóm đã vận dụng đạo đức kinh doanh vào thực tế.","b) Minh bạch giá cả thể hiện sự trung thực.","c) Trích lãi từ thiện là trách nhiệm xã hội.","d) Học sinh làm kinh doanh nhỏ không cần đạo đức."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ai kinh doanh cũng cần đạo đức.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Kinh doanh phải đặt chữ ... lên hàng đầu. (1 từ)","answer":"tín","explain":"Chữ tín.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại toàn bài: Đạo đức kinh doanh tạo ra uy tín, uy tín tạo ra sự phát triển ... (Điền 2 từ)","answer":"bền vững","explain":"Phát triển bền vững.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tóm lại, đạo đức kinh doanh là","options":["A. chuẩn mực đạo đức trong kinh doanh: trung thực, có trách nhiệm.","B. mánh khoé kiếm tiền.","C. chiến thuật quảng cáo.","D. bí quyết trốn thuế."],"answer":"A","explain":"Tổng kết bài học.","points":0.25},{"type":"mcq","level":"NB","q":"Để trở thành người kinh doanh có đạo đức, cần","options":["A. trung thực, giữ chữ tín, tôn trọng pháp luật.","B. gian dối khéo léo.","C. chèn ép đối thủ.","D. bóc lột lao động."],"answer":"A","explain":"Trung thực, chữ tín, tuân thủ pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Xã hội cần làm gì với hành vi thiếu đạo đức kinh doanh?","options":["A. Lên án, tẩy chay, tố cáo và xử lí theo pháp luật.","B. Bao che.","C. Im lặng.","D. Học theo."],"answer":"A","explain":"Đấu tranh với vi phạm.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa đạo đức kinh doanh và lợi nhuận là","options":["A. mâu thuẫn hoàn toàn.","B. đạo đức tạo uy tín, uy tín mang lại lợi nhuận bền vững.","C. không liên quan.","D. đạo đức làm giảm lợi nhuận."],"answer":"B","explain":"Đạo đức và lợi nhuận bền vững song hành.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn trẻ nói: Muốn giàu nhanh thì phải liều, kể cả gian dối. Em sẽ phản biện","options":["A. đồng tình.","B. gian dối có thể giàu nhất thời nhưng mất uy tín, bị pháp luật xử lí, không bền vững.","C. im lặng.","D. học theo."],"answer":"B","explain":"Phản biện đúng đắn.","points":0.25},{"type":"mcq","level":"VD","q":"Trong vai trò người tiêu dùng tương lai, em sẽ","options":["A. chọn hàng rõ nguồn gốc, tẩy chay hàng giả, tố cáo vi phạm.","B. ham rẻ mua hàng không rõ nguồn gốc.","C. không quan tâm.","D. tin mọi lời quảng cáo."],"answer":"A","explain":"Tiêu dùng có trách nhiệm.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đạo đức kinh doanh là làm giàu tử tế.","b) Uy tín giúp phát triển bền vững.","c) Cần lên án hành vi thiếu đạo đức.","d) Học sinh không liên quan đến đạo đức kinh doanh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: học sinh là người tiêu dùng và chủ kinh doanh tương lai.","points":1},{"type":"truefalse","level":"VDC","q":"Khu phố của em phát động phong trào Người Việt dùng hàng Việt, ưu tiên hàng hoá đảm bảo chất lượng, tẩy chay hàng giả. Xét tính đúng, sai:","statements":["a) Đây là cách cộng đồng ủng hộ doanh nghiệp chân chính.","b) Tẩy chay hàng giả góp phần làm sạch thị trường.","c) Mỗi người tiêu dùng đều có vai trò trong đấu tranh với gian lận.","d) Chỉ cơ quan nhà nước mới có trách nhiệm, người dân không cần làm gì."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần sự chung tay của toàn xã hội.","points":1},{"type":"short","level":"VD","q":"Hoàn thành câu: Có đạo đức thì có ..., có uy tín thì có tất cả. (Điền 2 từ)","answer":"uy tín","explain":"Đạo đức tạo uy tín.","points":0.5},{"type":"short","level":"VDC","q":"Bài học lớn nhất của bài 7: Muốn thành công lâu dài, người kinh doanh phải làm giàu một cách ... (Điền 2 từ)","answer":"tử tế","explain":"Làm giàu tử tế.","points":0.5}]}]}</script>
