<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Lạm phát được hiểu là","options":["A. sự tăng mức giá chung của nền kinh tế một cách liên tục trong một thời gian nhất định, làm đồng tiền mất giá.","B. sự tăng giá của một vài mặt hàng riêng lẻ trong thời gian ngắn.","C. sự giảm mức giá chung của nền kinh tế.","D. sự ổn định giá cả trên thị trường."],"answer":"A","explain":"Đúng định nghĩa SGK: lạm phát là mức giá chung tăng liên tục trong một thời gian nhất định, làm đồng tiền mất giá.","points":0.25},{"type":"mcq","level":"NB","q":"Hiện tượng nào sau đây KHÔNG phải là lạm phát?","options":["A. Mức giá chung tăng liên tục trong nhiều tháng.","B. Đồng tiền mất giá dần theo thời gian.","C. Giá rau tăng cao trong vài ngày mưa lũ rồi giảm lại.","D. Giá cả hầu hết hàng hoá, dịch vụ đều tăng kéo dài."],"answer":"C","explain":"Tăng giá nhất thời một mặt hàng rồi giảm lại không phải lạm phát; lạm phát đòi hỏi mức giá chung tăng liên tục, kéo dài.","points":0.25},{"type":"mcq","level":"NB","q":"Lạm phát vừa phải là lạm phát có tỉ lệ","options":["A. dưới 10% một năm.","B. từ 10% đến dưới 1000% một năm.","C. từ 1000% một năm trở lên.","D. bằng 0%."],"answer":"A","explain":"Lạm phát vừa phải: dưới 10%/năm (1 con số).","points":0.25},{"type":"mcq","level":"TH","q":"Năm 2020, với 20000 đồng mua được một tô phở; năm 2025, cũng 20000 đồng chỉ mua được nửa tô phở. Hiện tượng này phản ánh","options":["A. đồng tiền mất giá do lạm phát.","B. phở ngày càng dở đi.","C. giảm phát.","D. cung phở tăng mạnh."],"answer":"A","explain":"Cùng một số tiền mua được ít hàng hoá hơn theo thời gian là biểu hiện đồng tiền mất giá do lạm phát.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao tăng giá một vài mặt hàng riêng lẻ trong thời gian ngắn chưa phải là lạm phát?","options":["A. Vì lạm phát chỉ xảy ra ở nước ngoài.","B. Vì lạm phát đòi hỏi mức giá chung tăng liên tục, kéo dài chứ không phải giá riêng lẻ, nhất thời.","C. Vì Nhà nước cấm gọi đó là lạm phát.","D. Vì người dân không quan tâm."],"answer":"B","explain":"Lạm phát có 3 từ khoá: giá chung, tăng liên tục, tiền mất giá. Giá riêng lẻ, nhất thời chưa đủ điều kiện.","points":0.25},{"type":"mcq","level":"VD","q":"Một quốc gia có tỉ lệ lạm phát 250% một năm, giá cả tăng vùn vụt từng tháng, đời sống nhân dân vô cùng khó khăn. Đây là loại lạm phát nào?","options":["A. Lạm phát vừa phải.","B. Lạm phát phi mã.","C. Giảm phát.","D. Ổn định giá."],"answer":"B","explain":"Từ 10% đến dưới 1000%/năm là lạm phát phi mã — giống Việt Nam giai đoạn 1986–1988.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về khái niệm lạm phát:","statements":["a) Lạm phát là mức giá chung tăng liên tục trong một thời gian nhất định.","b) Lạm phát làm đồng tiền bị mất giá.","c) Giá một mặt hàng tăng trong vài ngày đã là lạm phát.","d) Giảm phát là hiện tượng ngược lại với lạm phát."],"answer":["T","T","F","T"],"explain":"a), b) Đúng: đúng định nghĩa. c) Sai: phải là giá chung, tăng liên tục. d) Đúng: giảm phát là mức giá chung giảm liên tục.","points":1},{"type":"truefalse","level":"VDC","q":"Bà Lan gửi tiết kiệm 100 triệu đồng với lãi suất 6% một năm. Năm đó tỉ lệ lạm phát là 8%. Xét tính đúng, sai:","statements":["a) Lãi suất thực mà bà Lan nhận được là âm 2%.","b) Dù có lãi danh nghĩa, sức mua thực tế của số tiền gửi bị giảm.","c) Trong trường hợp này, người gửi tiết kiệm bị thiệt thòi do lạm phát.","d) Lạm phát cao luôn có lợi cho người gửi tiết kiệm."],"answer":["T","T","T","F"],"explain":"a) Đúng: lãi suất thực = 6% - 8% = âm 2%. b), c) Đúng: tiền mất giá nhanh hơn lãi. d) Sai: lạm phát cao làm người gửi tiết kiệm thiệt.","points":1},{"type":"short","level":"VD","q":"Lạm phát được đo bằng chỉ số giá tiêu dùng, viết tắt là 3 chữ cái nào?","answer":"CPI","explain":"CPI (Consumer Price Index) — chỉ số giá tiêu dùng, đo mức tăng bình quân giá của giỏ hàng hoá người dân thường mua.","points":0.5},{"type":"short","level":"VDC","q":"Ở Zimbabwe năm 2008, giá cả tăng gấp đôi mỗi ngày, tờ tiền mệnh giá hàng nghìn tỉ không mua nổi một ổ bánh mì. Đây là loại lạm phát nào? (Trả lời 3 từ: ... lạm phát)","answer":"siêu lạm phát","explain":"Giá tăng theo ngày, tiền gần như mất hết giá trị là siêu lạm phát (từ 1000%/năm trở lên).","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Lạm phát phi mã là lạm phát có tỉ lệ","options":["A. dưới 10% một năm.","B. từ 10% đến dưới 1000% một năm.","C. từ 1000% một năm trở lên.","D. âm."],"answer":"B","explain":"Lạm phát phi mã: từ 10% đến dưới 1000%/năm (2–3 con số).","points":0.25},{"type":"mcq","level":"NB","q":"Siêu lạm phát là lạm phát có tỉ lệ","options":["A. dưới 10% một năm.","B. từ 10% đến dưới 1000% một năm.","C. từ 1000% một năm trở lên, giá tăng theo ngày.","D. bằng 0%."],"answer":"C","explain":"Siêu lạm phát: từ 1000%/năm trở lên, giá tăng theo ngày thậm chí theo giờ.","points":0.25},{"type":"mcq","level":"NB","q":"Nguyên nhân nào sau đây gây ra lạm phát do cầu kéo?","options":["A. Tổng cầu vượt quá tổng cung.","B. Chi phí sản xuất giảm.","C. Phát hành tiền quá ít.","D. Giá nguyên liệu giảm."],"answer":"A","explain":"Lạm phát do cầu kéo: tổng cầu vượt tổng cung — quá nhiều tiền đuổi theo quá ít hàng.","points":0.25},{"type":"mcq","level":"TH","q":"Giá xăng dầu thế giới tăng cao làm chi phí vận chuyển tăng, kéo theo giá nhiều mặt hàng tăng. Đây là lạm phát do","options":["A. cầu kéo.","B. chi phí đẩy.","C. tiền tệ.","D. kì vọng."],"answer":"B","explain":"Chi phí đầu vào (xăng dầu) tăng đẩy giá thành và giá bán lên — lạm phát do chi phí đẩy.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt tích cực của lạm phát vừa phải là","options":["A. kích thích sản xuất, tiêu dùng, góp phần tăng trưởng kinh tế.","B. làm đồng tiền mất giá nghiêm trọng.","C. làm đời sống người thu nhập cố định khốn khó.","D. gây bất ổn kinh tế vĩ mô."],"answer":"A","explain":"Lạm phát vừa phải (dưới 10%) kích thích sản xuất, tiêu dùng, tăng trưởng — các phương án còn lại là mặt tiêu cực của lạm phát cao.","points":0.25},{"type":"mcq","level":"VD","q":"Nghe tin giá xăng sắp tăng, nhiều tiểu thương vội tăng giá hàng hoá ngay dù hàng cũ nhập giá thấp. Hành vi này góp phần gây ra lạm phát do","options":["A. cầu kéo.","B. chi phí đẩy.","C. kì vọng lạm phát.","D. tiền tệ."],"answer":"C","explain":"Tin giá sẽ tăng nên tăng giá trước — kì vọng lạm phát tự biến thành lạm phát thật.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về phân loại lạm phát:","statements":["a) Lạm phát vừa phải có tỉ lệ dưới 10% một năm.","b) Lạm phát phi mã có tỉ lệ từ 10% đến dưới 1000% một năm.","c) Siêu lạm phát có tỉ lệ từ 1000% một năm trở lên.","d) Lạm phát càng cao càng tốt cho nền kinh tế."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: ba mức phân loại. d) Sai: lạm phát cao gây hại nghiêm trọng; chỉ lạm phát vừa phải mới có mặt tích cực.","points":1},{"type":"truefalse","level":"VDC","q":"Việt Nam giai đoạn 1986–1988 có năm lạm phát trên 300%, giá cả tăng vùn vụt. Xét tính đúng, sai:","statements":["a) Đây là lạm phát phi mã.","b) Lạm phát phi mã làm đời sống nhân dân vô cùng khó khăn.","c) Hiện nay Việt Nam kiểm soát lạm phát dưới 1 con số, thuộc loại vừa phải.","d) Nhà nước không cần kiểm soát lạm phát vì nó tự điều chỉnh."],"answer":["T","T","T","F"],"explain":"a) Đúng: 300% thuộc khoảng 10%–1000%. b) Đúng. c) Đúng: mục tiêu khoảng 4%/năm. d) Sai: Nhà nước phải kiểm soát bằng chính sách tiền tệ, tài khoá.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Lạm phát là mức giá ... tăng liên tục làm đồng tiền mất giá. (1 từ)","answer":"chung","explain":"Lạm phát là sự tăng mức giá chung (không phải giá riêng lẻ) của nền kinh tế.","points":0.5},{"type":"short","level":"VDC","q":"Khi tổng cầu vượt quá tổng cung, quá nhiều tiền đuổi theo quá ít hàng, giá cả bị đẩy lên. Đây là lạm phát do ... (Điền 2 từ)","answer":"cầu kéo","explain":"Tổng cầu vượt tổng cung gây lạm phát do cầu kéo.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Nguyên nhân gây lạm phát do chi phí đẩy là","options":["A. chi phí sản xuất tăng đẩy giá thành và giá bán lên.","B. tổng cầu vượt tổng cung.","C. phát hành tiền quá mức.","D. người dân kì vọng giá giảm."],"answer":"A","explain":"Chi phí đẩy: giá nguyên liệu, lương, xăng dầu tăng → chi phí sản xuất tăng → giá bán tăng.","points":0.25},{"type":"mcq","level":"NB","q":"Phát hành tiền quá mức so với nhu cầu lưu thông sẽ gây ra","options":["A. giảm phát.","B. lạm phát do tiền tệ.","C. ổn định giá cả.","D. tăng giá trị đồng tiền."],"answer":"B","explain":"In tiền ồ ạt, tín dụng tăng nóng làm lượng tiền vượt nhu cầu → tiền mất giá → lạm phát do tiền tệ.","points":0.25},{"type":"mcq","level":"NB","q":"Mục tiêu kiểm soát lạm phát của Việt Nam hiện nay khoảng","options":["A. 0% một năm.","B. 4% một năm.","C. 50% một năm.","D. 1000% một năm."],"answer":"B","explain":"Việt Nam kiểm soát lạm phát dưới 1 con số, mục tiêu khoảng 4%/năm — thuộc loại vừa phải.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao lạm phát cao gây khó khăn cho người có thu nhập cố định như công nhân, người về hưu?","options":["A. Vì họ bị giảm lương.","B. Vì giá cả tăng nhanh trong khi thu nhập không theo kịp, sức mua giảm sút.","C. Vì họ không được mua hàng.","D. Vì Nhà nước cấm họ chi tiêu."],"answer":"B","explain":"Thu nhập cố định không tăng kịp giá cả → sức mua giảm → đời sống khó khăn.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp nào sau đây của Nhà nước giúp kiểm soát lạm phát?","options":["A. In thêm thật nhiều tiền để chi tiêu.","B. Tăng lãi suất, kiểm soát tín dụng để giảm lượng tiền lưu thông quá mức.","C. Khuyến khích đầu cơ, găm hàng.","D. Bỏ mặc thị trường tự điều tiết."],"answer":"B","explain":"Chính sách tiền tệ thắt chặt (tăng lãi suất, dự trữ bắt buộc) giảm lượng tiền lưu thông → kiềm chế lạm phát.","points":0.25},{"type":"mcq","level":"VD","q":"Ông Ba có 500 triệu đồng tiền mặt để trong két. Sau 3 năm lạm phát trung bình 8% một năm, sức mua thực tế của số tiền này","options":["A. tăng lên.","B. giảm đi đáng kể vì đồng tiền mất giá.","C. không thay đổi.","D. tăng gấp đôi."],"answer":"B","explain":"Lạm phát làm đồng tiền mất giá; giữ tiền mặt không sinh lời thì sức mua giảm dần theo thời gian.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nguyên nhân lạm phát:","statements":["a) Tổng cầu vượt tổng cung gây lạm phát do cầu kéo.","b) Chi phí sản xuất tăng gây lạm phát do chi phí đẩy.","c) Phát hành tiền quá mức gây lạm phát do tiền tệ.","d) Kì vọng giá tăng không ảnh hưởng gì đến lạm phát."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: kì vọng lạm phát khiến người bán tăng giá trước, người lao động đòi tăng lương → lạm phát thật.","points":1},{"type":"truefalse","level":"VDC","q":"Công ty X vay ngân hàng lãi suất 10% một năm để mở rộng sản xuất, trong khi lạm phát năm đó là 12%. Xét tính đúng, sai:","statements":["a) Lãi suất thực mà công ty X phải trả là âm 2%.","b) Lạm phát cao làm giảm gánh nặng nợ thực tế của người đi vay.","c) Ngân hàng cho vay bị thiệt thòi khi lạm phát vượt lãi suất cho vay.","d) Lạm phát cao khuyến khích người dân gửi tiết kiệm."],"answer":["T","T","T","F"],"explain":"a) Đúng: 10% - 12% = âm 2%. b) Đúng: trả nợ bằng đồng tiền mất giá. c) Đúng: thu về sức mua thấp hơn. d) Sai: lạm phát cao làm người dân ngại gửi tiết kiệm.","points":1},{"type":"short","level":"VD","q":"Hiện tượng mức giá chung giảm liên tục, ngược lại với lạm phát, được gọi là gì? (2 từ)","answer":"giảm phát","explain":"Giảm phát là mức giá chung giảm liên tục — ngược với lạm phát, cũng gây hại cho nền kinh tế.","points":0.5},{"type":"short","level":"VDC","q":"Khi giá nguyên liệu, tiền lương, xăng dầu tăng làm chi phí sản xuất đội lên, đẩy giá bán tăng theo. Đây là lạm phát do ... (Điền 2 từ)","answer":"chi phí đẩy","explain":"Chi phí đầu vào tăng đẩy giá thành lên — lạm phát do chi phí đẩy.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Tác động tiêu cực của lạm phát cao KHÔNG bao gồm","options":["A. đồng tiền mất giá.","B. đời sống người thu nhập cố định khó khăn.","C. kích thích sản xuất, tiêu dùng ở mức vừa phải.","D. kinh tế vĩ mô bất ổn."],"answer":"C","explain":"Kích thích sản xuất, tiêu dùng là mặt tích cực của lạm phát vừa phải; các nội dung còn lại là tiêu cực của lạm phát cao.","points":0.25},{"type":"mcq","level":"NB","q":"Lạm phát cao làm phân hoá giàu nghèo vì","options":["A. mọi người đều nghèo đi như nhau.","B. người có tài sản như đất, vàng được lợi còn người làm công ăn lương bị thiệt.","C. Nhà nước tịch thu tài sản.","D. không ai bị ảnh hưởng."],"answer":"B","explain":"Lạm phát làm tài sản thực (đất, vàng) tăng giá, còn tiền lương mất giá → khoảng cách giàu nghèo nới rộng.","points":0.25},{"type":"mcq","level":"NB","q":"Để đo lường lạm phát, người ta dùng chỉ số","options":["A. GDP.","B. CPI (chỉ số giá tiêu dùng).","C. dân số.","D. diện tích."],"answer":"B","explain":"CPI đo mức tăng bình quân giá của giỏ hàng hoá người dân thường mua; tỉ lệ lạm phát = tỉ lệ tăng CPI.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao khi lạm phát cao, người dân có xu hướng mua vàng, đất thay vì gửi tiết kiệm?","options":["A. Vì vàng, đất đẹp hơn tiền.","B. Vì lãi suất thực có thể âm, tiền mất giá; vàng, đất giữ được giá trị tốt hơn.","C. Vì ngân hàng cấm gửi tiền.","D. Vì pháp luật bắt buộc."],"answer":"B","explain":"Lạm phát cao ăn mòn sức mua của tiền gửi; tài sản thực như vàng, đất thường tăng giá theo lạm phát nên được ưa chuộng.","points":0.25},{"type":"mcq","level":"TH","q":"Chính sách tài khoá để kiềm chế lạm phát là","options":["A. tăng chi ngân sách, giảm thuế.","B. giảm chi ngân sách, tăng thu để giảm tổng cầu.","C. in thêm tiền.","D. hạ lãi suất."],"answer":"B","explain":"Thắt chặt tài khoá (giảm chi, tăng thu) làm giảm tổng cầu → kiềm chế lạm phát do cầu kéo.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình chị Hoa thu nhập 15 triệu đồng một tháng không đổi trong 3 năm, trong khi giá cả tăng trung bình 7% một năm. Điều gia đình chị nên làm là","options":["A. chi tiêu hoang phí như trước.","B. lập kế hoạch chi tiêu hợp lí, tăng thu nhập, đầu tư chống mất giá.","C. vay nợ nhiều để chi tiêu.","D. ngừng làm việc."],"answer":"B","explain":"Thu nhập cố định trước lạm phát: cần chi tiêu hợp lí, tìm cách tăng thu nhập và bảo toàn sức mua.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ảnh hưởng của lạm phát:","statements":["a) Lạm phát vừa phải kích thích sản xuất, tiêu dùng.","b) Lạm phát cao làm đồng tiền mất giá.","c) Lạm phát cao gây khó khăn cho người có thu nhập cố định.","d) Lạm phát cao giúp kinh tế vĩ mô ổn định."],"answer":["T","T","T","F"],"explain":"a) Đúng: mặt tích cực của lạm phát vừa phải. b), c) Đúng: mặt tiêu cực. d) Sai: lạm phát cao gây bất ổn vĩ mô.","points":1},{"type":"truefalse","level":"VDC","q":"Năm 2022, giá xăng dầu thế giới tăng mạnh do xung đột địa chính trị, chi phí vận chuyển và sản xuất trong nước đội lên, CPI tăng cao. Chính phủ đã giảm thuế bảo vệ môi trường với xăng dầu và tăng cường kiểm tra chống đầu cơ. Xét tính đúng, sai:","statements":["a) Đây là lạm phát do chi phí đẩy từ giá năng lượng thế giới.","b) Giảm thuế xăng dầu giúp hạ chi phí đầu vào, kiềm chế lạm phát.","c) Chống đầu cơ, găm hàng là biện pháp bình ổn giá cần thiết.","d) Trong trường hợp này Nhà nước nên in thêm tiền để trợ cấp cho dân."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: in thêm tiền sẽ làm lạm phát trầm trọng hơn (lạm phát do tiền tệ).","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Lạm phát ... có tỉ lệ dưới 10% một năm và có thể kích thích tăng trưởng kinh tế. (2 từ)","answer":"vừa phải","explain":"Lạm phát vừa phải (dưới 10%/năm) có mặt tích cực là kích thích sản xuất, tiêu dùng.","points":0.5},{"type":"short","level":"VDC","q":"Khi mọi người tin rằng giá cả sẽ tăng nên đồng loạt tăng giá bán, đòi tăng lương, khiến giá cả tăng thật. Đây là lạm phát do ... (Điền 2 từ: ... lạm phát)","answer":"kì vọng","explain":"Kì vọng lạm phát: tin giá tăng → hành động như giá đã tăng → giá tăng thật.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Khi lạm phát xảy ra, đồng tiền sẽ","options":["A. tăng giá trị.","B. mất giá.","C. giữ nguyên giá trị.","D. biến mất."],"answer":"B","explain":"Lạm phát = mức giá chung tăng → cùng số tiền mua được ít hàng hơn → đồng tiền mất giá.","points":0.25},{"type":"mcq","level":"NB","q":"Tỉ lệ lạm phát 5% một năm thuộc loại","options":["A. lạm phát vừa phải.","B. lạm phát phi mã.","C. siêu lạm phát.","D. giảm phát."],"answer":"A","explain":"Dưới 10%/năm là lạm phát vừa phải.","points":0.25},{"type":"mcq","level":"NB","q":"Tỉ lệ lạm phát 150% một năm thuộc loại","options":["A. lạm phát vừa phải.","B. lạm phát phi mã.","C. siêu lạm phát.","D. giảm phát."],"answer":"B","explain":"Từ 10% đến dưới 1000%/năm là lạm phát phi mã.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao lạm phát vừa phải lại có thể kích thích sản xuất?","options":["A. Vì giá tăng nhẹ khuyến khích doanh nghiệp mở rộng sản xuất, người dân không trì hoãn chi tiêu.","B. Vì tiền mất giá nghiêm trọng.","C. Vì lãi suất thực âm.","D. Vì Nhà nước in thêm tiền."],"answer":"A","explain":"Giá tăng nhẹ tạo kì vọng lợi nhuận, thúc đẩy đầu tư, sản xuất và tiêu dùng.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các đối tượng sau, ai bị thiệt hại nhiều nhất khi lạm phát cao?","options":["A. Người sở hữu nhiều đất đai.","B. Người có thu nhập cố định như công nhân, người về hưu.","C. Người kinh doanh vàng.","D. Người cho vay nặng lãi."],"answer":"B","explain":"Thu nhập cố định không theo kịp giá cả → sức mua giảm mạnh nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Một người vay ngân hàng 1 tỉ đồng với lãi suất 9% một năm để mua nhà. Năm đó lạm phát là 11%. Về thực chất, người này","options":["A. phải trả lãi thực dương 2%.","B. được lợi vì lãi suất thực âm 2%, gánh nặng nợ giảm.","C. không ảnh hưởng gì.","D. phải trả gấp đôi."],"answer":"B","explain":"Lãi suất thực = 9% - 11% = âm 2%: người vay trả nợ bằng đồng tiền mất giá nên được lợi.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lạm phát làm đồng tiền mất giá.","b) Lạm phát vừa phải có thể kích thích tăng trưởng kinh tế.","c) Lạm phát cao gây bất ổn kinh tế vĩ mô.","d) Mọi mức lạm phát đều có hại, cần đưa về 0%."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lạm phát vừa phải (khoảng 4%) có mặt tích cực; mục tiêu là kiểm soát chứ không phải triệt tiêu.","points":1},{"type":"truefalse","level":"VDC","q":"Để kiềm chế lạm phát đang tăng cao, Ngân hàng Nhà nước tăng lãi suất điều hành và tỉ lệ dự trữ bắt buộc; Chính phủ cắt giảm chi thường xuyên, tăng cường kiểm tra giá. Xét tính đúng, sai:","statements":["a) Tăng lãi suất giúp giảm lượng tiền lưu thông, kiềm chế lạm phát.","b) Cắt giảm chi ngân sách giúp giảm tổng cầu.","c) Đây là sự phối hợp chính sách tiền tệ và tài khoá.","d) Biện pháp đúng lúc này là hạ lãi suất và tăng chi ngân sách."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: thắt chặt tiền tệ + tài khoá để kiềm chế lạm phát. d) Sai: đó là chính sách nới lỏng, chỉ dùng khi suy thoái, giảm phát.","points":1},{"type":"short","level":"VD","q":"Tỉ lệ lạm phát 1200% một năm, giá tăng theo ngày, thuộc loại lạm phát nào? (Trả lời 3 từ: ... lạm phát)","answer":"siêu lạm phát","explain":"Từ 1000%/năm trở lên là siêu lạm phát.","points":0.5},{"type":"short","level":"VDC","q":"Nhà nước in tiền ồ ạt để chi tiêu, lượng tiền lưu thông vượt xa nhu cầu, đồng tiền mất giá nhanh. Đây là lạm phát do ... (Điền 2 từ)","answer":"tiền tệ","explain":"Phát hành tiền quá mức gây lạm phát do tiền tệ.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Giảm phát là hiện tượng","options":["A. mức giá chung tăng liên tục.","B. mức giá chung giảm liên tục.","C. đồng tiền tăng giá trị mãi mãi.","D. giá cả ổn định."],"answer":"B","explain":"Giảm phát ngược với lạm phát: mức giá chung giảm liên tục.","points":0.25},{"type":"mcq","level":"NB","q":"Lãi suất thực được tính bằng","options":["A. lãi suất danh nghĩa cộng tỉ lệ lạm phát.","B. lãi suất danh nghĩa trừ tỉ lệ lạm phát.","C. tỉ lệ lạm phát nhân đôi.","D. lãi suất danh nghĩa chia đôi."],"answer":"B","explain":"Lãi suất thực = lãi suất danh nghĩa - tỉ lệ lạm phát; phản ánh sức mua thực tế.","points":0.25},{"type":"mcq","level":"NB","q":"Khi lạm phát cao hơn lãi suất tiền gửi tiết kiệm thì người gửi tiền sẽ","options":["A. được lợi lớn.","B. bị thiệt vì sức mua của tiền gửi giảm.","C. không ảnh hưởng.","D. được nhân đôi tiền."],"answer":"B","explain":"Lãi suất thực âm: tiền lãi không bù nổi mất giá → người gửi thiệt.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao giảm phát cũng gây hại cho nền kinh tế?","options":["A. Vì giá giảm làm người dân hoãn chi tiêu chờ giá rẻ hơn, doanh nghiệp khó bán hàng.","B. Vì giá giảm làm mọi người giàu lên.","C. Vì giảm phát không ảnh hưởng gì.","D. Vì giảm phát làm tăng lương."],"answer":"A","explain":"Giảm phát kéo dài gây tâm lí chờ giá rẻ, sức cầu yếu, doanh nghiệp thua lỗ, kinh tế trì trệ.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp bình ổn giá nào sau đây giúp kiềm chế lạm phát?","options":["A. Kiểm soát giá các mặt hàng thiết yếu, chống đầu cơ găm hàng.","B. Để mặc giá cả tăng tự do.","C. Khuyến khích tích trữ hàng hoá.","D. Tăng giá điện, xăng dầu."],"answer":"A","explain":"Kiểm soát giá thiết yếu, chống đầu cơ giúp giữ mặt bằng giá ổn định, kiềm chế lạm phát.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Mai định mua nhà chung cư. Nghe tin lạm phát có thể tăng cao, chị quyết định vay ngân hàng mua ngay thay vì chờ 2 năm nữa. Quyết định này dựa trên lập luận","options":["A. lạm phát cao làm tiền vay mất giá, mua sớm có lợi hơn.","B. giá nhà sẽ giảm khi lạm phát tăng.","C. ngân hàng sẽ cho vay miễn phí.","D. lạm phát không ảnh hưởng đến bất động sản."],"answer":"A","explain":"Lạm phát cao làm đồng tiền vay mất giá (lãi suất thực thấp), tài sản thực như nhà đất thường tăng giá theo — mua sớm có lợi.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) CPI là chỉ số dùng để đo lường lạm phát.","b) Tỉ lệ lạm phát là tỉ lệ tăng của CPI so với cùng kì năm trước.","c) Nhà nước kiểm soát lạm phát bằng chính sách tiền tệ và tài khoá.","d) Mục tiêu lạm phát của Việt Nam hiện nay là khoảng 4% một năm."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng theo nội dung bài học.","points":1},{"type":"truefalse","level":"VDC","q":"Anh Tuấn có 2 tỉ đồng. Phương án 1: gửi tiết kiệm lãi 6%/năm khi lạm phát 8%. Phương án 2: mua đất. Sau một năm, đất tăng giá 10%. Xét tính đúng, sai:","statements":["a) Gửi tiết kiệm cho lãi suất thực âm 2%.","b) Mua đất cho lợi nhuận thực khoảng 2% sau khi trừ lạm phát.","c) Trong bối cảnh lạm phát cao, mua tài sản thực tốt hơn gửi tiết kiệm.","d) Giữ tiền mặt là cách bảo toàn giá trị tốt nhất khi lạm phát cao."],"answer":["T","T","T","F"],"explain":"a) Đúng: 6%-8% = âm 2%. b) Đúng: 10%-8% = 2%. c) Đúng. d) Sai: giữ tiền mặt mất giá nhanh nhất.","points":1},{"type":"short","level":"VD","q":"Công thức: Lãi suất thực = Lãi suất danh nghĩa ... tỉ lệ lạm phát. (Điền 1 từ: cộng hay trừ)","answer":"trừ","explain":"Lãi suất thực = lãi suất danh nghĩa - tỉ lệ lạm phát.","points":0.5},{"type":"short","level":"VDC","q":"Khi giá cả thế giới tăng (xăng dầu, nguyên liệu) lan sang làm giá trong nước tăng theo, người ta gọi là lạm phát ... (Điền 2 từ: ... khẩu)","answer":"nhập khẩu","explain":"Lạm phát nhập khẩu: giá thế giới tăng lan truyền vào trong nước qua hàng nhập khẩu.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trong các nguyên nhân sau, nguyên nhân nào gây lạm phát do cầu kéo?","options":["A. Chi phí sản xuất tăng.","B. Tổng cầu vượt quá tổng cung.","C. In tiền quá mức.","D. Kì vọng giá giảm."],"answer":"B","explain":"Cầu kéo = tổng cầu vượt tổng cung.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các nguyên nhân sau, nguyên nhân nào gây lạm phát do chi phí đẩy?","options":["A. Tổng cầu vượt tổng cung.","B. Giá nguyên liệu, tiền lương tăng đẩy chi phí sản xuất lên.","C. Người dân kì vọng giá ổn định.","D. Cung vượt cầu."],"answer":"B","explain":"Chi phí đẩy = chi phí đầu vào tăng đẩy giá thành lên.","points":0.25},{"type":"mcq","level":"NB","q":"Ai có nhiệm vụ kiểm soát lạm phát ở Việt Nam?","options":["A. Mọi công dân.","B. Nhà nước (Chính phủ, Ngân hàng Nhà nước).","C. Doanh nghiệp nước ngoài.","D. Không ai."],"answer":"B","explain":"Nhà nước kiểm soát lạm phát bằng chính sách tiền tệ, tài khoá và bình ổn giá.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao khi lạm phát cao, Nhà nước tăng lãi suất?","options":["A. Để khuyến khích vay tiền.","B. Để giảm lượng tiền lưu thông, kiềm chế tổng cầu và lạm phát.","C. Để ngân hàng lỗ.","D. Để tăng lạm phát."],"answer":"B","explain":"Lãi suất cao → vay ít hơn, gửi nhiều hơn → lượng tiền lưu thông giảm → kiềm chế lạm phát.","points":0.25},{"type":"mcq","level":"TH","q":"Học sinh cần làm gì để ứng phó với lạm phát trong chi tiêu hằng ngày?","options":["A. Chi tiêu hoang phí, mua sắm theo phong trào.","B. Lập kế hoạch chi tiêu hợp lí, tiết kiệm, tránh lãng phí.","C. Vay nợ nhiều để chi tiêu.","D. Ngừng học để đi làm."],"answer":"B","explain":"Khi giá cả tăng, cần chi tiêu hợp lí, tiết kiệm, ưu tiên nhu cầu thiết yếu.","points":0.25},{"type":"mcq","level":"VD","q":"Một doanh nghiệp xuất khẩu kí hợp đồng bán hàng giá cố định bằng đồng nội tệ trong 2 năm. Nếu lạm phát tăng cao trong thời gian này, doanh nghiệp sẽ","options":["A. được lợi lớn.","B. bị thiệt vì chi phí tăng mà giá bán không đổi.","C. không ảnh hưởng.","D. phá sản ngay."],"answer":"B","explain":"Giá bán cố định trong khi chi phí đầu vào tăng theo lạm phát → lợi nhuận bị ăn mòn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lạm phát vừa phải dưới 10% một năm.","b) Lạm phát phi mã từ 10% đến dưới 1000% một năm.","c) Siêu lạm phát từ 1000% một năm trở lên.","d) Việt Nam từng trải qua lạm phát phi mã giai đoạn 1986–1988."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng theo nội dung bài học.","points":1},{"type":"truefalse","level":"VDC","q":"Bà Hai bán phở với giá 30000 đồng một tô suốt 5 năm không đổi, dù giá nguyên liệu tăng 50%. Xét tính đúng, sai:","statements":["a) Bà Hai đang gánh chịu tác động của lạm phát vào chi phí.","b) Giữ giá không đổi giúp bà giữ khách nhưng lợi nhuận bị bào mòn.","c) Bà Hai nên tăng giá hợp lí theo chi phí để duy trì kinh doanh.","d) Lạm phát chỉ ảnh hưởng đến doanh nghiệp lớn, không ảnh hưởng hộ kinh doanh nhỏ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lạm phát ảnh hưởng đến mọi chủ thể, kể cả hộ kinh doanh nhỏ.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Lạm phát do ... là khi tổng cầu vượt quá tổng cung. (2 từ)","answer":"cầu kéo","explain":"Tổng cầu vượt tổng cung → lạm phát do cầu kéo.","points":0.5},{"type":"short","level":"VDC","q":"Để kiềm chế lạm phát, Ngân hàng Nhà nước có thể tăng lãi suất và tỉ lệ ... bắt buộc của các ngân hàng thương mại. (Điền 2 từ: ... bắt buộc)","answer":"dự trữ","explain":"Tăng tỉ lệ dự trữ bắt buộc làm giảm lượng tiền cho vay → giảm tiền lưu thông → kiềm chế lạm phát.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Câu nào sau đây đúng về lạm phát?","options":["A. Lạm phát là mức giá chung tăng liên tục làm đồng tiền mất giá.","B. Lạm phát là giá một mặt hàng tăng trong vài ngày.","C. Lạm phát làm đồng tiền tăng giá trị.","D. Lạm phát không ảnh hưởng đến đời sống."],"answer":"A","explain":"Đúng định nghĩa SGK.","points":0.25},{"type":"mcq","level":"NB","q":"Khi lạm phát ở mức vừa phải, doanh nghiệp nên","options":["A. thu hẹp sản xuất.","B. tận dụng cơ hội mở rộng sản xuất, đầu tư.","C. ngừng kinh doanh.","D. sa thải hết lao động."],"answer":"B","explain":"Lạm phát vừa phải kích thích sản xuất, tiêu dùng — cơ hội để mở rộng.","points":0.25},{"type":"mcq","level":"NB","q":"Đồng tiền mất giá có nghĩa là","options":["A. cùng một số tiền mua được ít hàng hoá hơn trước.","B. cùng một số tiền mua được nhiều hàng hoá hơn.","C. tiền bị rách.","D. tiền không còn lưu hành."],"answer":"A","explain":"Mất giá = sức mua giảm: cùng số tiền mua được ít hàng hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao người về hưu sống bằng lương hưu cố định thường lo lắng khi lạm phát tăng cao?","options":["A. Vì lương hưu tăng theo lạm phát.","B. Vì lương hưu không tăng kịp giá cả, sức mua giảm sút.","C. Vì họ không được mua hàng.","D. Vì Nhà nước cắt lương hưu."],"answer":"B","explain":"Thu nhập cố định + giá tăng = sức mua giảm → đời sống khó khăn.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp nào sau đây KHÔNG giúp kiềm chế lạm phát?","options":["A. Tăng lãi suất.","B. Giảm chi ngân sách.","C. In thêm thật nhiều tiền để chi tiêu.","D. Chống đầu cơ, bình ổn giá."],"answer":"C","explain":"In thêm tiền làm lượng tiền vượt nhu cầu → lạm phát trầm trọng hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty cho nhân viên vay mua nhà với lãi suất cố định 8% một năm trong 10 năm. Nếu lạm phát trung bình 10% một năm trong thời gian đó, về thực chất","options":["A. công ty được lợi lớn.","B. nhân viên được lợi vì lãi suất thực âm, gánh nặng nợ giảm.","C. hai bên không ảnh hưởng.","D. hợp đồng vô hiệu."],"answer":"B","explain":"Lãi suất thực = 8% - 10% = âm 2%: người vay trả bằng đồng tiền mất giá nên được lợi.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lạm phát là mức giá chung tăng liên tục, tiền mất giá.","b) Chỉ lạm phát vừa phải mới có mặt tích cực.","c) Lạm phát cao gây khó khăn cho người thu nhập cố định.","d) Nhà nước có thể kiểm soát lạm phát bằng chính sách tiền tệ, tài khoá."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng theo nội dung bài học.","points":1},{"type":"truefalse","level":"VDC","q":"Gia đình bạn An thu nhập 20 triệu đồng một tháng. Năm nay lạm phát 9%, giá cả tăng khắp nơi. Bố mẹ An quyết định: cắt giảm chi tiêu không cần thiết, mẹ An học thêm nghề tay trái tăng thu nhập, gửi tiết kiệm một phần và mua một ít vàng. Xét tính đúng, sai:","statements":["a) Cắt giảm chi tiêu không cần thiết là ứng phó đúng với lạm phát.","b) Tăng thu nhập giúp bù đắp sức mua bị lạm phát ăn mòn.","c) Mua vàng là cách bảo toàn giá trị khi lạm phát cao.","d) Cách tốt nhất là vay nợ nhiều để chi tiêu thoải mái."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: chi tiêu hợp lí, tăng thu nhập, bảo toàn giá trị. d) Sai: vay nợ nhiều khi lạm phát cao rất rủi ro.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Lạm phát ... có tỉ lệ từ 10% đến dưới 1000% một năm. (2 từ)","answer":"phi mã","explain":"Lạm phát phi mã: từ 10% đến dưới 1000%/năm.","points":0.5},{"type":"short","level":"VDC","q":"Tóm tắt: Lạm phát là mức giá chung tăng ... làm đồng tiền mất giá. (Điền 1 từ)","answer":"liên tục","explain":"Từ khoá: mức giá chung tăng liên tục trong một thời gian nhất định.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hiện tượng giá cả tăng theo ngày, đồng tiền gần như mất hết giá trị là","options":["A. lạm phát vừa phải.","B. lạm phát phi mã.","C. siêu lạm phát.","D. giảm phát."],"answer":"C","explain":"Siêu lạm phát: từ 1000%/năm trở lên, giá tăng theo ngày.","points":0.25},{"type":"mcq","level":"NB","q":"Nguyên nhân sâu xa của lạm phát do tiền tệ là","options":["A. lượng tiền lưu thông vượt quá nhu cầu của nền kinh tế.","B. hàng hoá quá nhiều.","C. người dân tiết kiệm quá mức.","D. xuất khẩu tăng."],"answer":"A","explain":"Phát hành tiền quá mức, tín dụng tăng nóng → tiền mất giá.","points":0.25},{"type":"mcq","level":"NB","q":"Khi lạm phát tăng cao, người dân có xu hướng","options":["A. gửi tiết kiệm nhiều hơn.","B. giữ tiền mặt nhiều hơn.","C. mua tài sản thực như vàng, đất để bảo toàn giá trị.","D. ngừng chi tiêu hoàn toàn."],"answer":"C","explain":"Tài sản thực giữ giá tốt hơn tiền mặt khi lạm phát cao.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao lạm phát cao làm cho hoạt động đầu tư, sản xuất bị ảnh hưởng?","options":["A. Vì giá cả biến động mạnh, khó dự báo chi phí và lợi nhuận, rủi ro tăng cao.","B. Vì Nhà nước cấm đầu tư.","C. Vì không còn lao động.","D. Vì lạm phát làm tăng năng suất."],"answer":"A","explain":"Bất ổn giá cả làm tăng rủi ro, doanh nghiệp ngại đầu tư dài hạn.","points":0.25},{"type":"mcq","level":"TH","q":"Để bảo vệ người tiêu dùng khi lạm phát cao, Nhà nước cần","options":["A. kiểm soát giá hàng thiết yếu, chống đầu cơ, hỗ trợ người thu nhập thấp.","B. để mặc giá tăng tự do.","C. tăng thuế hàng thiết yếu.","D. cấm người dân mua hàng."],"answer":"A","explain":"Bình ổn giá, chống đầu cơ, an sinh xã hội là trách nhiệm của Nhà nước khi lạm phát cao.","points":0.25},{"type":"mcq","level":"VD","q":"Năm 2008, Zimbabwe rơi vào siêu lạm phát, người dân phải mang cả bao tải tiền đi chợ. Bài học cho các quốc gia là","options":["A. nên in thật nhiều tiền.","B. phải kiểm soát chặt chẽ lượng tiền lưu thông, không để lạm phát vượt tầm kiểm soát.","C. siêu lạm phát có lợi cho dân nghèo.","D. không cần quan tâm đến lạm phát."],"answer":"B","explain":"Siêu lạm phát phá huỷ nền kinh tế; phải kiểm soát tiền tệ chặt chẽ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vai trò của Nhà nước:","statements":["a) Nhà nước đo lường lạm phát bằng chỉ số CPI.","b) Nhà nước dùng chính sách tiền tệ để kiểm soát lượng tiền lưu thông.","c) Nhà nước dùng chính sách tài khoá để điều tiết tổng cầu.","d) Nhà nước không có công cụ nào để chống lạm phát."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: có nhiều công cụ (lãi suất, dự trữ bắt buộc, thu chi ngân sách, bình ổn giá).","points":1},{"type":"truefalse","level":"VDC","q":"Tỉnh X ban hành quy định: khi giá thịt lợn tăng quá 30% trong một tháng, Sở Công thương phải xuất kho dự trữ, tăng cường kiểm tra chống đầu cơ và hỗ trợ người chăn nuôi. Xét tính đúng, sai:","statements":["a) Đây là biện pháp bình ổn giá của chính quyền địa phương.","b) Xuất kho dự trữ giúp tăng cung, kéo giá xuống.","c) Chống đầu cơ giúp ngăn giá tăng ảo.","d) Biện pháp này vi phạm quy luật cung – cầu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: đúng vai trò điều tiết của Nhà nước. d) Sai: đây là vận dụng đúng quy luật để ổn định thị trường, không vi phạm.","points":1},{"type":"short","level":"VD","q":"Chỉ số dùng để đo lường lạm phát, phản ánh mức tăng bình quân giá của giỏ hàng hoá, viết tắt là gì?","answer":"CPI","explain":"CPI — chỉ số giá tiêu dùng.","points":0.5},{"type":"short","level":"VDC","q":"Mục tiêu kiểm soát lạm phát của Việt Nam hiện nay khoảng 4% một năm, thuộc loại lạm phát ... (Điền 2 từ)","answer":"vừa phải","explain":"Dưới 10%/năm là lạm phát vừa phải.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây SAI về lạm phát?","options":["A. Lạm phát là mức giá chung tăng liên tục.","B. Lạm phát làm đồng tiền mất giá.","C. Giá một mặt hàng tăng vài ngày cũng gọi là lạm phát.","D. Lạm phát cao gây bất ổn kinh tế."],"answer":"C","explain":"Phải là mức giá chung tăng liên tục, kéo dài mới là lạm phát.","points":0.25},{"type":"mcq","level":"NB","q":"Lạm phát có tính hai mặt, nghĩa là","options":["A. vừa có mặt tích cực (khi vừa phải) vừa có mặt tiêu cực (khi cao).","B. vừa tăng giá vừa giảm giá cùng lúc.","C. vừa tốt cho người giàu vừa tốt cho người nghèo.","D. vừa do trong nước vừa do ngoài nước."],"answer":"A","explain":"Vừa phải thì kích thích tăng trưởng; cao thì gây hại nghiêm trọng.","points":0.25},{"type":"mcq","level":"NB","q":"Để kiềm chế lạm phát do cầu kéo, Nhà nước nên","options":["A. tăng chi tiêu công.","B. thắt chặt tiền tệ, giảm chi ngân sách để giảm tổng cầu.","C. in thêm tiền.","D. hạ lãi suất."],"answer":"B","explain":"Giảm tổng cầu bằng thắt chặt tiền tệ và tài khoá.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao khi lạm phát cao, khoảng cách giàu nghèo thường nới rộng?","options":["A. Vì người nghèo được tăng lương nhiều.","B. Vì người giàu có tài sản thực tăng giá theo lạm phát, còn người nghèo thu nhập cố định bị mất giá.","C. Vì Nhà nước chia đều tài sản.","D. Vì lạm phát làm mọi người giàu lên."],"answer":"B","explain":"Tài sản thực (đất, vàng) tăng giá theo lạm phát; tiền lương mất giá → phân hoá.","points":0.25},{"type":"mcq","level":"TH","q":"Một hộ kinh doanh ăn sáng thấy giá nguyên liệu tăng 30% trong một năm. Để duy trì, hộ nên","options":["A. giữ nguyên giá và chất lượng, chịu lỗ.","B. điều chỉnh giá hợp lí theo chi phí, đồng thời nâng cao chất lượng, tiết kiệm chi phí.","C. dùng nguyên liệu kém chất lượng để giữ giá.","D. đóng cửa ngay."],"answer":"B","explain":"Điều chỉnh giá hợp lí + nâng chất lượng + tiết kiệm chi phí là ứng phó đúng với lạm phát chi phí đẩy.","points":0.25},{"type":"mcq","level":"VD","q":"Trong thời kì lạm phát cao, lời khuyên tài chính nào sau đây là hợp lí nhất với người dân?","options":["A. Giữ toàn bộ tiền mặt ở nhà.","B. Chi tiêu hợp lí, đa dạng hoá tài sản, tránh vay nợ lãi suất cao.","C. Vay nợ tối đa để chi tiêu.","D. Đổ hết tiền vào một kênh duy nhất theo tin đồn."],"answer":"B","explain":"Chi tiêu hợp lí, đa dạng hoá để bảo toàn giá trị, tránh đòn bẩy rủi ro.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lạm phát vừa phải kích thích sản xuất, tiêu dùng.","b) Lạm phát cao làm tiền mất giá, đời sống khó khăn.","c) Giảm phát kéo dài cũng gây hại cho nền kinh tế.","d) Kiểm soát lạm phát là nhiệm vụ của Nhà nước."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng theo nội dung bài học.","points":1},{"type":"truefalse","level":"VDC","q":"Bạn Linh được mẹ cho 5 triệu đồng tiền mừng tuổi. Lạm phát hiện khoảng 4% một năm. Linh đang phân vân: tiêu hết ngay, gửi tiết kiệm lãi 5% một năm, hay mua vàng. Xét tính đúng, sai:","statements":["a) Tiêu hết ngay vào thứ không cần thiết là lãng phí.","b) Gửi tiết kiệm lãi 5% cho lãi suất thực dương khoảng 1%.","c) Mua vàng có thể bảo toàn giá trị khi lạm phát cao.","d) Linh nên học cách quản lí tiền, chi tiêu hợp lí thay vì tiêu xài hoang phí."],"answer":["T","T","T","T"],"explain":"a) Đúng. b) Đúng: 5% - 4% = 1%. c) Đúng. d) Đúng: giáo dục tài chính cho học sinh.","points":1},{"type":"short","level":"VD","q":"Hoàn thành định nghĩa: Lạm phát là sự tăng mức giá ... của nền kinh tế một cách liên tục. (1 từ)","answer":"chung","explain":"Mức giá chung — không phải giá riêng lẻ.","points":0.5},{"type":"short","level":"VDC","q":"Khi chi phí sản xuất tăng đẩy giá bán lên, người ta gọi là lạm phát do chi phí ... (Điền 1 từ)","answer":"đẩy","explain":"Lạm phát do chi phí đẩy.","points":0.5}]}]}</script>
