<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Cạnh tranh trong nền kinh tế thị trường được hiểu là","options":["A. sự ganh đua, đấu tranh gay gắt giữa các chủ thể kinh tế nhằm giành điều kiện thuận lợi và lợi nhuận cao nhất.","B. sự hợp tác, giúp đỡ lẫn nhau giữa các doanh nghiệp cùng ngành.","C. sự chia sẻ thị trường một cách hòa bình giữa các chủ thể kinh tế.","D. sự độc quyền của một doanh nghiệp lớn trên thị trường."],"answer":"A","explain":"Theo định nghĩa SGK: cạnh tranh là sự ganh đua, đấu tranh gay gắt giữa các chủ thể kinh tế trong sản xuất và lưu thông hàng hoá, dịch vụ nhằm giành điều kiện thuận lợi trong sản xuất, tiêu thụ, thị trường để thu lợi nhuận cao nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Mục đích cuối cùng mà các chủ thể kinh tế hướng tới khi tham gia cạnh tranh là","options":["A. giúp đỡ đối thủ cùng phát triển.","B. thu được lợi nhuận cao nhất.","C. chia đều thị trường cho mọi người.","D. giảm chất lượng để hạ giá thành."],"answer":"B","explain":"Mục đích của cạnh tranh là giành những điều kiện thuận lợi trong sản xuất, tiêu thụ và thị trường để thu được lợi nhuận cao nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Cạnh tranh diễn ra trong các lĩnh vực nào sau đây?","options":["A. Chỉ trong sản xuất nông nghiệp.","B. Chỉ trong lĩnh vực dịch vụ.","C. Trong sản xuất và lưu thông hàng hoá, dịch vụ.","D. Chỉ trong thương mại quốc tế."],"answer":"C","explain":"Cạnh tranh diễn ra trong sản xuất và lưu thông hàng hoá, dịch vụ — mọi khâu của hoạt động kinh tế thị trường.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân khách quan nào sau đây dẫn đến cạnh tranh trong nền kinh tế thị trường?","options":["A. Các chủ thể có điều kiện sản xuất, kinh doanh khác nhau.","B. Nhà nước cấm mọi hoạt động kinh doanh.","C. Mọi chủ thể đều có vốn và công nghệ như nhau.","D. Thị trường không có người mua."],"answer":"A","explain":"Nguyên nhân của cạnh tranh: điều kiện sản xuất, lưu thông khác nhau (vốn, công nghệ, tay nghề...), lợi ích kinh tế đối lập nhau và quyền tự do kinh doanh.","points":0.25},{"type":"mcq","level":"TH","q":"Hai cửa hàng điện thoại trên cùng một con phố cùng giảm giá, tặng quà, nâng cao chất lượng phục vụ để thu hút khách hàng. Hiện tượng này phản ánh","options":["A. sự độc quyền.","B. sự cạnh tranh.","C. sự hợp tác kinh doanh.","D. sự bao cấp của Nhà nước."],"answer":"B","explain":"Hai cửa hàng ganh đua giành khách hàng bằng giá cả và dịch vụ — đó chính là biểu hiện của cạnh tranh trong kinh tế thị trường.","points":0.25},{"type":"mcq","level":"VD","q":"Công ty A đầu tư dây chuyền công nghệ mới làm giá thành sản phẩm giảm 20%, nhờ đó bán giá thấp hơn đối thủ mà vẫn có lãi và dần chiếm lĩnh thị trường. Trường hợp này thể hiện mặt nào của cạnh tranh?","options":["A. Mặt tiêu cực, vì làm đối thủ mất khách.","B. Mặt tích cực, vì thúc đẩy cải tiến kĩ thuật, hạ giá thành, có lợi cho người tiêu dùng.","C. Không phải cạnh tranh vì không dùng thủ đoạn.","D. Mặt trung gian của cạnh tranh."],"answer":"B","explain":"Đây là cạnh tranh lành mạnh: thắng bằng cải tiến công nghệ, hạ giá thành. Mặt tích cực của cạnh tranh là thúc đẩy lực lượng sản xuất phát triển, nâng cao chất lượng, hạ giá thành, người tiêu dùng được hưởng lợi.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về cạnh tranh:","statements":["a) Cạnh tranh chỉ diễn ra giữa các doanh nghiệp lớn, không liên quan đến hộ kinh doanh nhỏ.","b) Mục đích của cạnh tranh là giành điều kiện thuận lợi để thu lợi nhuận cao nhất.","c) Cạnh tranh là quy luật vốn có, khách quan của kinh tế thị trường.","d) Cạnh tranh lành mạnh là cạnh tranh tuân thủ pháp luật và chuẩn mực đạo đức."],"answer":["F","T","T","T"],"explain":"a) Sai: mọi chủ thể kinh tế, từ hộ kinh doanh nhỏ đến tập đoàn lớn, đều tham gia cạnh tranh. b) Đúng: đúng mục đích của cạnh tranh. c) Đúng: cạnh tranh nảy sinh khách quan từ cơ chế thị trường. d) Đúng: đó là đặc trưng của cạnh tranh lành mạnh.","points":1},{"type":"truefalse","level":"VDC","q":"Công ty X thuê người tung tin thất thiệt rằng sữa của công ty Y chứa chất cấm (không có bằng chứng), đồng thời bán phá giá dưới giá thành để ép Y phá sản. Xét tính đúng, sai:","statements":["a) Hành vi của công ty X là cạnh tranh lành mạnh.","b) Tung tin thất thiệt về đối thủ là hành vi cạnh tranh không lành mạnh.","c) Bán phá giá dưới giá thành nhằm loại bỏ đối thủ là hành vi bị pháp luật cạnh tranh cấm.","d) Nhà nước không được can thiệp vì đây là quyền tự do kinh doanh của X."],"answer":["F","T","T","F"],"explain":"a) Sai: dùng thủ đoạn gian lận là cạnh tranh không lành mạnh. b) Đúng: tung tin xấu hạ uy tín đối thủ là thủ đoạn phi pháp điển hình. c) Đúng: bán phá giá nhằm loại đối thủ thuộc hành vi bị cấm theo Luật Cạnh tranh 2018. d) Sai: Nhà nước phải can thiệp, xử lí để bảo vệ cạnh tranh lành mạnh.","points":1},{"type":"short","level":"VD","q":"Luật Cạnh tranh hiện hành của Việt Nam được Quốc hội ban hành năm nào? (Điền số năm)","answer":"2018","explain":"Luật Cạnh tranh năm 2018 là văn bản pháp luật điều chỉnh các hành vi hạn chế cạnh tranh, cạnh tranh không lành mạnh ở Việt Nam hiện nay.","points":0.5},{"type":"short","level":"VDC","q":"Bà H bán rau ở chợ, thấy quầy bên cạnh đông khách hơn nên lén đổ nước bẩn vào rau của đối thủ để khách chê không mua. Hành vi của bà H thuộc loại cạnh tranh nào? (Trả lời 3 từ)","answer":"không lành mạnh","explain":"Dùng thủ đoạn gian lận, phi đạo đức để hạ uy tín đối thủ là cạnh tranh không lành mạnh — hành vi này vi phạm pháp luật và đạo đức kinh doanh.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Chủ thể nào sau đây KHÔNG tham gia quan hệ cạnh tranh trong nền kinh tế thị trường?","options":["A. Hộ sản xuất kinh doanh cá thể.","B. Doanh nghiệp tư nhân.","C. Công ty có vốn đầu tư nước ngoài.","D. Cơ quan nhà nước thực hiện chức năng quản lí."],"answer":"D","explain":"Cơ quan nhà nước làm nhiệm vụ quản lí, tạo môi trường cạnh tranh bình đẳng chứ không trực tiếp ganh đua giành lợi nhuận như các chủ thể kinh tế.","points":0.25},{"type":"mcq","level":"NB","q":"Cạnh tranh được coi là","options":["A. hiện tượng ngẫu nhiên, lúc có lúc không.","B. quy luật vốn có, khách quan của kinh tế thị trường.","C. chính sách do Nhà nước áp đặt.","D. thỏa thuận giữa các doanh nghiệp."],"answer":"B","explain":"Cạnh tranh nảy sinh khách quan từ cơ chế thị trường (điều kiện sản xuất khác nhau, lợi ích đối lập), không do ai tạo ra hay áp đặt.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện nào sau đây là cạnh tranh lành mạnh?","options":["A. Sản xuất hàng giả, hàng nhái thương hiệu nổi tiếng.","B. Nâng cao chất lượng sản phẩm, cải tiến dịch vụ chăm sóc khách hàng.","C. Trốn thuế để có vốn hạ giá bán.","D. Thuê người đe dọa, phá hoại cửa hàng đối thủ."],"answer":"B","explain":"Cạnh tranh lành mạnh là thắng bằng chất lượng, giá cả hợp lí, dịch vụ tốt trong khuôn khổ pháp luật. Các phương án còn lại đều là thủ đoạn phi pháp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao trong nền kinh tế thị trường, các chủ thể có điều kiện sản xuất khác nhau lại dẫn đến cạnh tranh?","options":["A. Vì ai có chi phí sản xuất thấp hơn thì có lợi thế hơn trong giành giật khách hàng và lợi nhuận.","B. Vì Nhà nước bắt buộc họ phải cạnh tranh.","C. Vì người tiêu dùng không quan tâm đến giá cả.","D. Vì mọi hàng hoá đều khan hiếm như nhau."],"answer":"A","explain":"Điều kiện sản xuất khác nhau dẫn đến chi phí, giá thành khác nhau; chủ thể nào hiệu quả hơn sẽ có lợi thế cạnh tranh, từ đó nảy sinh ganh đua giành thị trường.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt tích cực của cạnh tranh KHÔNG bao gồm nội dung nào sau đây?","options":["A. Thúc đẩy lực lượng sản xuất phát triển.","B. Nâng cao chất lượng, hạ giá thành sản phẩm.","C. Kích thích tính năng động, sáng tạo của chủ thể kinh tế.","D. Làm phá sản hàng loạt doanh nghiệp làm ăn chân chính."],"answer":"D","explain":"Làm phá sản doanh nghiệp chân chính bằng thủ đoạn phi pháp là mặt tiêu cực của cạnh tranh. Ba nội dung còn lại đều là mặt tích cực.","points":0.25},{"type":"mcq","level":"VD","q":"Sau khi hãng xe công nghệ B vào thị trường với giá cước rẻ hơn 30%, hãng A buộc phải nâng cấp ứng dụng, đào tạo tài xế lịch sự hơn và tung gói khuyến mãi cho khách hàng thân thiết. Trường hợp này cho thấy cạnh tranh đã","options":["A. gây hại cho người tiêu dùng.","B. buộc doanh nghiệp đổi mới, nâng cao chất lượng dịch vụ, người tiêu dùng được hưởng lợi.","C. làm cho thị trường mất ổn định nghiêm trọng.","D. vi phạm pháp luật cạnh tranh."],"answer":"B","explain":"Đây là mặt tích cực của cạnh tranh: áp lực từ đối thủ buộc doanh nghiệp đổi mới, nâng cao chất lượng; người tiêu dùng được dùng dịch vụ tốt hơn, giá rẻ hơn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mặt tích cực của cạnh tranh là thúc đẩy lực lượng sản xuất phát triển, nâng cao năng suất lao động.","b) Cạnh tranh giúp người tiêu dùng được mua hàng hoá tốt hơn với giá cả hợp lí hơn.","c) Cạnh tranh luôn mang lại kết quả tốt đẹp cho mọi chủ thể tham gia.","d) Nhờ cạnh tranh, các doanh nghiệp buộc phải không ngừng đổi mới, sáng tạo."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: đó là lợi ích trực tiếp cho người tiêu dùng. c) Sai: cạnh tranh có tính hai mặt, kẻ thua có thể phá sản. d) Đúng: áp lực cạnh tranh kích thích đổi mới.","points":1},{"type":"truefalse","level":"VDC","q":"Một làng nghề làm bánh kẹo truyền thống có 20 hộ sản xuất. Hộ ông T lén mua đường hoá học giá rẻ pha vào bánh, dán nhãn giống hệt hộ bên cạnh rồi bán giá thấp hơn, khiến 3 hộ làm ăn chân chính phải đóng cửa. Xét tính đúng, sai:","statements":["a) Hành vi của hộ ông T là cạnh tranh lành mạnh vì giúp người mua được giá rẻ.","b) Hành vi của hộ ông T vừa vi phạm pháp luật vừa vi phạm đạo đức kinh doanh.","c) Đây là biểu hiện mặt tiêu cực của cạnh tranh.","d) Các hộ bị hại không được pháp luật bảo vệ vì đó là quy luật thị trường."],"answer":["F","T","T","F"],"explain":"a) Sai: dùng hoá chất độc hại, nhái nhãn là thủ đoạn phi pháp. b) Đúng: vi phạm pháp luật (hàng giả, gian lận) và đạo đức. c) Đúng: mặt tiêu cực — dùng thủ đoạn phi pháp triệt hạ đối thủ. d) Sai: Nhà nước xử lí hành vi cạnh tranh không lành mạnh, bảo vệ người làm ăn chân chính.","points":1},{"type":"short","level":"VD","q":"Cạnh tranh giữa các doanh nghiệp cùng sản xuất một loại hàng hoá (ví dụ: các hãng mì ăn liền với nhau) được gọi là cạnh tranh trong nội bộ gì? (Điền 1 từ)","answer":"ngành","explain":"Theo phạm vi, cạnh tranh gồm: cạnh tranh trong nội bộ ngành (cùng sản xuất một loại hàng hoá) và cạnh tranh giữa các ngành (thu hút vốn đầu tư).","points":0.5},{"type":"short","level":"VDC","q":"Doanh nghiệp D đầu cơ, găm hàng khẩu trang trong dịch bệnh rồi nâng giá gấp 5 lần. Hành vi này thể hiện mặt nào của cạnh tranh? (Trả lời 2 từ: mặt ...)","answer":"mặt tiêu cực","explain":"Đầu cơ, găm hàng, nâng giá trục lợi là thủ đoạn phi pháp — biểu hiện mặt tiêu cực của cạnh tranh, cần bị pháp luật xử lí.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Hành vi nào sau đây là biểu hiện của cạnh tranh không lành mạnh?","options":["A. Cải tiến mẫu mã, nâng cao chất lượng sản phẩm.","B. Quảng cáo trung thực về tính năng sản phẩm.","C. Sản xuất hàng giả, hàng kém chất lượng để bán giá rẻ.","D. Hạ giá thành nhờ áp dụng công nghệ mới."],"answer":"C","explain":"Sản xuất hàng giả là thủ đoạn gian lận, vi phạm pháp luật — điển hình của cạnh tranh không lành mạnh.","points":0.25},{"type":"mcq","level":"NB","q":"Theo tính chất, cạnh tranh được chia thành","options":["A. cạnh tranh trong nước và cạnh tranh quốc tế.","B. cạnh tranh lành mạnh và cạnh tranh không lành mạnh.","C. cạnh tranh về giá và cạnh tranh về số lượng.","D. cạnh tranh công khai và cạnh tranh bí mật."],"answer":"B","explain":"Theo tính chất, cạnh tranh gồm cạnh tranh lành mạnh (tuân thủ pháp luật, đạo đức) và cạnh tranh không lành mạnh (dùng thủ đoạn phi pháp).","points":0.25},{"type":"mcq","level":"NB","q":"Để hạn chế mặt tiêu cực của cạnh tranh, Nhà nước cần","options":["A. cấm mọi hoạt động cạnh tranh.","B. ban hành pháp luật về cạnh tranh và xử lí nghiêm hành vi vi phạm.","C. để mặc thị trường tự điều tiết hoàn toàn.","D. chỉ bảo vệ doanh nghiệp nhà nước."],"answer":"B","explain":"Nhà nước ban hành Luật Cạnh tranh, xử lí hành vi cạnh tranh không lành mạnh, bảo vệ người tiêu dùng và tạo môi trường cạnh tranh bình đẳng.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây thể hiện vai trò của Nhà nước đối với cạnh tranh?","options":["A. Trực tiếp định giá mọi hàng hoá trên thị trường.","B. Bảo hộ độc quyền cho một số doanh nghiệp.","C. Tạo môi trường cạnh tranh bình đẳng cho mọi thành phần kinh tế.","D. Cấm người dân tự do kinh doanh."],"answer":"C","explain":"Nhà nước tạo môi trường cạnh tranh bình đẳng, mọi thành phần kinh tế được đối xử công bằng trước pháp luật; không định giá hộ hay bảo hộ độc quyền.","points":0.25},{"type":"mcq","level":"TH","q":"Cạnh tranh giữa các ngành kinh tế khác nhau chủ yếu nhằm mục đích","options":["A. hạ giá bán lẻ cho người tiêu dùng.","B. thu hút vốn đầu tư về ngành có lợi nhuận cao hơn.","C. tăng số lượng doanh nghiệp trong cùng một ngành.","D. giảm thuế cho doanh nghiệp."],"answer":"B","explain":"Cạnh tranh giữa các ngành là cuộc ganh đua thu hút vốn đầu tư chảy về ngành có tỉ suất lợi nhuận cao hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Chị K mở quán cà phê, đầu tư máy pha hiện đại, đào tạo nhân viên phục vụ chu đáo, giữ giá ổn định nên quán ngày càng đông khách trong khi quán đối diện vắng dần. Cách làm của chị K là","options":["A. cạnh tranh không lành mạnh vì làm đối thủ mất khách.","B. cạnh tranh lành mạnh vì thắng bằng chất lượng và dịch vụ.","C. hành vi độc quyền cần bị xử phạt.","D. không phải cạnh tranh vì không giảm giá."],"answer":"B","explain":"Thắng bằng chất lượng sản phẩm, dịch vụ tốt trong khuôn khổ pháp luật là cạnh tranh lành mạnh — được khuyến khích.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về các loại cạnh tranh:","statements":["a) Theo phạm vi, cạnh tranh gồm cạnh tranh trong nội bộ ngành và cạnh tranh giữa các ngành.","b) Cạnh tranh trong nội bộ ngành là cạnh tranh giữa các doanh nghiệp cùng sản xuất một loại hàng hoá.","c) Cạnh tranh lành mạnh là cạnh tranh bằng mọi thủ đoạn để giành thắng lợi.","d) Dùng hàng giả để đánh bật đối thủ là cạnh tranh không lành mạnh."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: lành mạnh là tuân thủ pháp luật và đạo đức, không phải mọi thủ đoạn. d) Đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Tập đoàn M có vị trí thống lĩnh thị trường sữa (chiếm 70% thị phần). M ép các đại lí chỉ được bán sữa của M, đồng thời bán phá giá ở địa phương có đối thủ nhỏ mới vào để ép đối thủ rút lui. Xét tính đúng, sai:","statements":["a) Ép đại lí chỉ bán hàng của mình là hành vi lạm dụng vị trí thống lĩnh thị trường.","b) Bán phá giá để loại đối thủ là hành vi bị Luật Cạnh tranh cấm.","c) Vì M chiếm thị phần lớn nên mọi hành vi của M đều hợp pháp.","d) Cơ quan quản lí cạnh tranh có quyền điều tra, xử phạt M."],"answer":["T","T","F","T"],"explain":"a) Đúng: áp đặt điều kiện bất lợi cho đối tác là lạm dụng vị trí thống lĩnh. b) Đúng: bán dưới giá thành nhằm loại đối thủ bị cấm. c) Sai: thị phần lớn không có nghĩa được vi phạm. d) Đúng: đó là chức năng của cơ quan quản lí cạnh tranh.","points":1},{"type":"short","level":"VD","q":"Mặt nào của cạnh tranh được thể hiện khi doanh nghiệp buộc phải đầu tư công nghệ, nâng cao năng suất để không bị đào thải? (Trả lời 2 từ: mặt ...)","answer":"mặt tích cực","explain":"Thúc đẩy lực lượng sản xuất phát triển, buộc doanh nghiệp đổi mới là mặt tích cực của cạnh tranh.","points":0.5},{"type":"short","level":"VDC","q":"Anh P phát hiện đối thủ bán hàng nhái thương hiệu của mình nên đã làm đơn gửi cơ quan quản lí thị trường. Việc làm của anh P thể hiện quyền được pháp luật bảo vệ trong môi trường cạnh tranh như thế nào? (Trả lời 2 từ: cạnh tranh ...)","answer":"lành mạnh","explain":"Nhờ pháp luật bảo vệ, người làm ăn chân chính được bảo vệ khỏi hành vi cạnh tranh không lành mạnh — góp phần giữ môi trường cạnh tranh lành mạnh.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Nguyên nhân sâu xa dẫn đến cạnh tranh KHÔNG bao gồm","options":["A. điều kiện sản xuất của các chủ thể khác nhau.","B. lợi ích kinh tế của các chủ thể đối lập nhau.","C. quyền tự do kinh doanh được pháp luật bảo đảm.","D. sự chỉ đạo trực tiếp của Nhà nước bắt doanh nghiệp phải ganh đua."],"answer":"D","explain":"Cạnh tranh nảy sinh khách quan từ cơ chế thị trường, không phải do Nhà nước chỉ đạo, áp đặt.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các hành vi sau, hành vi nào bị Luật Cạnh tranh cấm?","options":["A. Nâng cao chất lượng sản phẩm.","B. Quảng cáo đúng sự thật.","C. Thỏa thuận ấn định giá giữa các doanh nghiệp để bóp nghẹt đối thủ nhỏ.","D. Khuyến mãi giảm giá trong khuôn khổ pháp luật."],"answer":"C","explain":"Thỏa thuận hạn chế cạnh tranh (ấn định giá, phân chia thị trường...) là hành vi bị Luật Cạnh tranh 2018 cấm.","points":0.25},{"type":"mcq","level":"NB","q":"Người tiêu dùng được hưởng lợi từ cạnh tranh lành mạnh ở điểm nào?","options":["A. Được mua hàng hoá chất lượng tốt hơn với giá cả hợp lí hơn.","B. Được mua hàng giả với giá rẻ.","C. Bị ép mua hàng độc quyền giá cao.","D. Không có sự lựa chọn nào khác."],"answer":"A","explain":"Nhờ cạnh tranh, doanh nghiệp phải nâng chất lượng, hạ giá thành nên người tiêu dùng được mua hàng tốt hơn, rẻ hơn và có nhiều lựa chọn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói cạnh tranh có tính hai mặt?","options":["A. Vì vừa diễn ra trong nước vừa diễn ra ngoài nước.","B. Vì vừa có tác động tích cực (thúc đẩy phát triển) vừa có tác động tiêu cực (thủ đoạn phi pháp, phân hoá giàu nghèo).","C. Vì vừa do doanh nghiệp vừa do Nhà nước tạo ra.","D. Vì vừa hợp pháp vừa bất hợp pháp."],"answer":"B","explain":"Tính hai mặt: mặt tích cực thúc đẩy lực lượng sản xuất, nâng cao chất lượng, hạ giá thành; mặt tiêu cực gây phân hoá giàu nghèo và nảy sinh thủ đoạn phi pháp.","points":0.25},{"type":"mcq","level":"TH","q":"Hành vi trốn thuế để có thêm vốn hạ giá bán, đánh bật đối thủ là biểu hiện của","options":["A. cạnh tranh lành mạnh.","B. cạnh tranh không lành mạnh.","C. hợp tác kinh doanh.","D. ưu đãi của Nhà nước."],"answer":"B","explain":"Trốn thuế là hành vi vi phạm pháp luật nhằm tạo lợi thế gian lận — điển hình của cạnh tranh không lành mạnh.","points":0.25},{"type":"mcq","level":"VD","q":"Ở một khu chợ, 5 sạp bán trái cây cùng nhập một loại cam. Sạp của bà Lan phân loại kĩ, bán đúng giá niêm yết, cân đủ và tươi cười với khách nên ngày càng đông người mua. Đây là ví dụ về","options":["A. độc quyền buôn bán.","B. cạnh tranh lành mạnh bằng chất lượng và thái độ phục vụ.","C. hành vi lũng đoạn thị trường.","D. sự can thiệp của chính quyền."],"answer":"B","explain":"Bà Lan thắng bằng chất lượng hàng hoá trung thực và dịch vụ tốt — đó là cạnh tranh lành mạnh, được pháp luật và đạo đức ủng hộ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vai trò của Nhà nước:","statements":["a) Nhà nước ban hành Luật Cạnh tranh để điều chỉnh hành vi cạnh tranh trên thị trường.","b) Nhà nước xử lí nghiêm các hành vi cạnh tranh không lành mạnh.","c) Nhà nước bảo vệ quyền lợi của người tiêu dùng khi mua phải hàng giả, hàng kém chất lượng.","d) Nhà nước cấm mọi hình thức cạnh tranh để giữ ổn định thị trường."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: đó là các vai trò của Nhà nước (pháp luật, xử lí vi phạm, bảo vệ người tiêu dùng). d) Sai: Nhà nước khuyến khích cạnh tranh lành mạnh, chỉ xử lí hành vi vi phạm.","points":1},{"type":"truefalse","level":"VDC","q":"Công ty dược P tung quảng cáo rằng thuốc của mình chữa khỏi hoàn toàn bệnh tiểu đường trong 7 ngày (không có căn cứ khoa học), đồng thời thuê người viết bài bôi nhọ thuốc của đối thủ Q. Xét tính đúng, sai:","statements":["a) Quảng cáo sai sự thật của P là hành vi cạnh tranh không lành mạnh.","b) Bôi nhọ đối thủ để giành khách hàng là vi phạm pháp luật cạnh tranh.","c) Người tiêu dùng mua thuốc của P không được pháp luật bảo vệ.","d) P có thể bị xử phạt hành chính và buộc cải chính thông tin."],"answer":["T","T","F","T"],"explain":"a) Đúng: quảng cáo gian dối là cạnh tranh không lành mạnh. b) Đúng. c) Sai: người tiêu dùng được Luật Bảo vệ quyền lợi người tiêu dùng bảo vệ, được bồi thường. d) Đúng: chế tài xử phạt và buộc cải chính.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Cạnh tranh là sự ganh đua gay gắt giữa các chủ thể kinh tế nhằm giành điều kiện thuận lợi và thu được ... cao nhất. (1 từ)","answer":"lợi nhuận","explain":"Mục đích cuối cùng của cạnh tranh là thu được lợi nhuận cao nhất.","points":0.5},{"type":"short","level":"VDC","q":"Ba doanh nghiệp kinh doanh gas thỏa thuận ngầm cùng tăng giá gas lên 30% để bóc lột người tiêu dùng. Thỏa thuận này thuộc nhóm hành vi nào bị Luật Cạnh tranh cấm? (Trả lời 6 từ, bắt đầu bằng: thỏa thuận ...)","answer":"thỏa thuận hạn chế cạnh tranh","explain":"Ấn định giá, phân chia thị trường giữa các đối thủ là thỏa thuận hạn chế cạnh tranh — hành vi bị Luật Cạnh tranh 2018 cấm.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Cạnh tranh trong nội bộ ngành là","options":["A. cạnh tranh giữa các doanh nghiệp cùng sản xuất, kinh doanh một loại hàng hoá, dịch vụ.","B. cạnh tranh giữa các ngành kinh tế khác nhau.","C. cạnh tranh giữa doanh nghiệp trong nước và nước ngoài.","D. cạnh tranh giữa người mua với nhau."],"answer":"A","explain":"Cạnh tranh trong nội bộ ngành diễn ra giữa các chủ thể cùng sản xuất, kinh doanh một loại hàng hoá, dịch vụ (ví dụ: các hãng xe máy với nhau).","points":0.25},{"type":"mcq","level":"NB","q":"Thủ đoạn nào sau đây KHÔNG phải là cạnh tranh không lành mạnh?","options":["A. Đầu cơ, găm hàng, nâng giá.","B. Sản xuất, buôn bán hàng giả.","C. Nâng cao tay nghề, cải tiến quy trình sản xuất.","D. Tung tin xấu làm mất uy tín đối thủ."],"answer":"C","explain":"Nâng cao tay nghề, cải tiến quy trình là cách cạnh tranh lành mạnh bằng năng lực thật; các thủ đoạn còn lại đều phi pháp.","points":0.25},{"type":"mcq","level":"NB","q":"Khi tham gia cạnh tranh lành mạnh, doanh nghiệp thường","options":["A. tìm mọi cách triệt hạ đối thủ kể cả phi pháp.","B. nâng cao chất lượng, hạ giá thành, phục vụ khách hàng tốt hơn.","C. thỏa thuận ngầm ấn định giá cao.","D. trốn thuế để giảm chi phí."],"answer":"B","explain":"Cạnh tranh lành mạnh là thắng bằng chất lượng, giá cả hợp lí và dịch vụ tốt trong khuôn khổ pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao quyền tự do kinh doanh được coi là một nguyên nhân dẫn đến cạnh tranh?","options":["A. Vì ai cũng được tự do kinh doanh ngành nghề pháp luật không cấm nên nhiều chủ thể cùng tham gia một thị trường.","B. Vì Nhà nước ép mọi người phải kinh doanh.","C. Vì tự do kinh doanh làm giá cả tăng cao.","D. Vì tự do kinh doanh xóa bỏ mọi quy luật thị trường."],"answer":"A","explain":"Tự do kinh doanh khiến nhiều chủ thể cùng tham gia cung ứng một loại hàng hoá, dịch vụ; nguồn khách hàng có hạn nên nảy sinh ganh đua.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt tiêu cực của cạnh tranh thể hiện ở điểm nào sau đây?","options":["A. Thúc đẩy khoa học, kĩ thuật phát triển.","B. Người tiêu dùng có nhiều lựa chọn hơn.","C. Gây phân hoá giàu nghèo và nảy sinh thủ đoạn kinh doanh phi pháp.","D. Nâng cao năng suất lao động xã hội."],"answer":"C","explain":"Mặt tiêu cực: kẻ thắng vươn lên, kẻ thua phá sản (phân hoá giàu nghèo); một số chủ thể dùng thủ đoạn phi pháp như hàng giả, trốn thuế, tung tin xấu.","points":0.25},{"type":"mcq","level":"VD","q":"Siêu thị mini của anh Tuấn nhập rau sạch có chứng nhận, niêm yết giá rõ ràng, cân đúng và đổi trả nếu hàng kém. Sau 6 tháng, siêu thị của anh đông khách gấp đôi cửa hàng bên cạnh bán rau không rõ nguồn gốc. Thành công của anh Tuấn chứng tỏ","options":["A. chỉ có gian lận mới thắng trong cạnh tranh.","B. cạnh tranh lành mạnh bằng chất lượng và uy tín mang lại thắng lợi bền vững.","C. Nhà nước đã cấm cửa hàng bên cạnh.","D. người tiêu dùng chỉ quan tâm giá rẻ."],"answer":"B","explain":"Anh Tuấn thắng bằng chất lượng thật và uy tín — đó là cạnh tranh lành mạnh, mang lại thắng lợi bền vững, được pháp luật bảo vệ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cạnh tranh lành mạnh góp phần thúc đẩy kinh tế phát triển.","b) Cạnh tranh không lành mạnh cần bị pháp luật xử lí.","c) Mọi hành vi cạnh tranh đều mang lại lợi ích cho xã hội.","d) Người tiêu dùng là đối tượng được hưởng lợi trực tiếp từ cạnh tranh lành mạnh."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: Luật Cạnh tranh xử lí hành vi vi phạm. c) Sai: cạnh tranh không lành mạnh gây hại. d) Đúng: được mua hàng tốt hơn, rẻ hơn.","points":1},{"type":"truefalse","level":"VDC","q":"Hãng mỹ phẩm S nhập kem trộn không rõ nguồn gốc, dán nhãn ngoại nhập rồi thuê người nổi tiếng quảng cáo sai sự thật; đồng thời tố cáo gian dối khiến cơ quan chức năng kiểm tra oan đối thủ L nhiều lần. Xét tính đúng, sai:","statements":["a) S đang thực hiện cạnh tranh lành mạnh vì biết tận dụng quảng cáo.","b) Kinh doanh kem trộn không rõ nguồn gốc đe dọa sức khỏe người tiêu dùng.","c) Tố cáo gian dối nhằm quấy rối đối thủ là hành vi cạnh tranh không lành mạnh.","d) Đối thủ L không có cách nào tự bảo vệ mình trước pháp luật."],"answer":["F","T","T","F"],"explain":"a) Sai: quảng cáo sai sự thật, hàng không rõ nguồn gốc là phi pháp. b) Đúng. c) Đúng: dùng thủ đoạn quấy rối đối thủ. d) Sai: L có quyền khiếu nại, tố cáo hành vi vu khống và được pháp luật bảo vệ.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo tính chất, cạnh tranh được chia thành cạnh tranh lành mạnh và cạnh tranh ... (2 từ)","answer":"không lành mạnh","explain":"Theo tính chất có hai loại: cạnh tranh lành mạnh (tuân thủ pháp luật, đạo đức) và cạnh tranh không lành mạnh (dùng thủ đoạn phi pháp).","points":0.5},{"type":"short","level":"VDC","q":"Chủ cơ sở may M cho công nhân làm việc 14 giờ mỗi ngày, trả lương thấp hơn mức tối thiểu để hạ giá thành, đánh bật các cơ sở làm ăn đúng luật. Ngoài vi phạm pháp luật lao động, hành vi hạ giá bằng cách bóc lột người lao động của M còn bị lên án về mặt nào? (Trả lời 2 từ: ... kinh doanh)","answer":"đạo đức","explain":"Bóc lột người lao động để tạo lợi thế cạnh tranh vừa vi phạm pháp luật vừa vi phạm đạo đức kinh doanh — bị xã hội lên án.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Đâu là nguyên nhân khách quan dẫn đến cạnh tranh?","options":["A. Lợi ích kinh tế của các chủ thể đối lập nhau trên thị trường.","B. Mọi chủ thể đều thống nhất lợi ích với nhau.","C. Thị trường không có sự trao đổi hàng hoá.","D. Nhà nước phân chia sẵn thị trường cho từng doanh nghiệp."],"answer":"A","explain":"Lợi ích kinh tế đối lập nhau (người này giành được khách thì người kia mất khách) là nguyên nhân khách quan dẫn đến cạnh tranh.","points":0.25},{"type":"mcq","level":"NB","q":"Cạnh tranh giữa các ngành kinh tế diễn ra nhằm","options":["A. giành giật khách hàng lẻ.","B. thu hút vốn đầu tư về ngành có lợi nhuận cao hơn.","C. giảm giá bán lẻ.","D. tăng số lượng cửa hàng."],"answer":"B","explain":"Cạnh tranh giữa các ngành là cuộc ganh đua thu hút nguồn vốn đầu tư chảy về ngành có tỉ suất lợi nhuận cao hơn.","points":0.25},{"type":"mcq","level":"NB","q":"Luật điều chỉnh các hành vi cạnh tranh ở Việt Nam hiện nay là","options":["A. Luật Doanh nghiệp năm 2020.","B. Luật Cạnh tranh năm 2018.","C. Luật Thương mại năm 2005.","D. Luật Đầu tư năm 2020."],"answer":"B","explain":"Luật Cạnh tranh năm 2018 là văn bản chuyên điều chỉnh các hành vi hạn chế cạnh tranh và cạnh tranh không lành mạnh.","points":0.25},{"type":"mcq","level":"TH","q":"Trong nền kinh tế thị trường, vì sao doanh nghiệp buộc phải không ngừng đổi mới?","options":["A. Vì pháp luật cấm doanh nghiệp giữ nguyên công nghệ cũ.","B. Vì áp lực cạnh tranh sẽ đào thải doanh nghiệp lạc hậu, kém hiệu quả.","C. Vì người tiêu dùng không bao giờ thay đổi sở thích.","D. Vì Nhà nước tài trợ mọi chi phí đổi mới."],"answer":"B","explain":"Đó là mặt tích cực của cạnh tranh: áp lực ganh đua buộc doanh nghiệp đổi mới công nghệ, nâng cao năng suất nếu không muốn bị đào thải.","points":0.25},{"type":"mcq","level":"TH","q":"Hành vi nào sau đây vừa vi phạm pháp luật cạnh tranh vừa gây hại cho người tiêu dùng?","options":["A. Cải tiến bao bì sản phẩm.","B. Sản xuất hàng giả, hàng kém chất lượng.","C. Mở thêm chi nhánh mới.","D. Đào tạo nhân viên bán hàng."],"answer":"B","explain":"Hàng giả, hàng kém chất lượng vừa là thủ đoạn cạnh tranh không lành mạnh vừa trực tiếp gây hại sức khoẻ, tài sản người tiêu dùng.","points":0.25},{"type":"mcq","level":"VD","q":"Tại hội chợ nông sản, gian hàng của hợp tác xã A trưng bày giấy chứng nhận VietGAP, cho khách ăn thử thoải mái và bán đúng giá niêm yết nên luôn đông khách nhất. Cách làm này là","options":["A. hành vi lũng đoạn hội chợ.","B. cạnh tranh lành mạnh bằng chất lượng thật và sự trung thực.","C. cạnh tranh không lành mạnh vì thu hút hết khách.","D. vi phạm quy định hội chợ."],"answer":"B","explain":"Thắng bằng chất lượng thật, minh bạch và trung thực là cạnh tranh lành mạnh — mô hình đáng khuyến khích.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nguyên nhân của cạnh tranh:","statements":["a) Điều kiện sản xuất khác nhau giữa các chủ thể là nguyên nhân dẫn đến cạnh tranh.","b) Lợi ích kinh tế đối lập nhau giữa người bán là nguyên nhân dẫn đến cạnh tranh.","c) Quyền tự do kinh doanh khiến nhiều chủ thể cùng tham gia một thị trường, gây ra cạnh tranh.","d) Cạnh tranh do Nhà nước tạo ra bằng mệnh lệnh hành chính."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: ba nguyên nhân khách quan của cạnh tranh. d) Sai: cạnh tranh nảy sinh khách quan từ cơ chế thị trường, không do mệnh lệnh hành chính.","points":1},{"type":"truefalse","level":"VDC","q":"Doanh nghiệp N có dấu hiệu độc quyền trong lĩnh vực cung cấp nước sạch cho một thành phố. N tự ý tăng giá nước gấp đôi, cắt nước của các hộ dám khiếu nại và từ chối cho doanh nghiệp khác đấu nối mạng lưới. Xét tính đúng, sai:","statements":["a) N đang lạm dụng vị trí độc quyền, thống lĩnh thị trường.","b) Tự ý tăng giá, cắt nước trả đũa người khiếu nại là hành vi bị cấm.","c) Người dân không có quyền khiếu nại vì N là doanh nghiệp duy nhất.","d) Nhà nước có trách nhiệm kiểm soát giá và hành vi của doanh nghiệp độc quyền."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: lạm dụng vị trí thống lĩnh/độc quyền bị Luật Cạnh tranh cấm. c) Sai: công dân có quyền khiếu nại, được pháp luật bảo vệ. d) Đúng: Nhà nước kiểm soát độc quyền để bảo vệ người tiêu dùng.","points":1},{"type":"short","level":"VD","q":"Hoàn thành khái niệm: Cạnh tranh là sự ganh đua, đấu tranh ... giữa các chủ thể kinh tế. (Điền 1 từ chỉ mức độ)","answer":"gay gắt","explain":"Định nghĩa đầy đủ: cạnh tranh là sự ganh đua, đấu tranh gay gắt giữa các chủ thể kinh tế trong sản xuất và lưu thông hàng hoá, dịch vụ.","points":0.5},{"type":"short","level":"VDC","q":"Một nhóm tiểu thương trong chợ thỏa thuận ngầm cùng giữ giá thịt lợn ở mức cao gấp đôi giá nhập để ép người mua, ai bán rẻ hơn sẽ bị tẩy chay. Đây là hành vi thỏa thuận gì bị pháp luật cấm? (Trả lời 6 từ, bắt đầu bằng: thỏa thuận ...)","answer":"thỏa thuận hạn chế cạnh tranh","explain":"Thỏa thuận ấn định giá, phân chia thị trường giữa các đối thủ là thỏa thuận hạn chế cạnh tranh — bị Luật Cạnh tranh 2018 cấm.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Biểu hiện nào sau đây thuộc mặt tích cực của cạnh tranh?","options":["A. Doanh nghiệp đầu tư công nghệ mới làm năng suất tăng, giá thành giảm.","B. Doanh nghiệp làm hàng giả để bán giá rẻ.","C. Doanh nghiệp trốn thuế để có vốn cạnh tranh.","D. Doanh nghiệp thuê người phá hoại đối thủ."],"answer":"A","explain":"Đầu tư công nghệ, tăng năng suất, giảm giá thành là mặt tích cực: thúc đẩy lực lượng sản xuất phát triển, người tiêu dùng hưởng lợi.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện nào sau đây thuộc mặt tiêu cực của cạnh tranh?","options":["A. Nâng cao chất lượng phục vụ khách hàng.","B. Hạ giá thành nhờ cải tiến kĩ thuật.","C. Dùng thủ đoạn gian lận như hàng giả, trốn thuế để triệt hạ đối thủ.","D. Đầu tư nghiên cứu sản phẩm mới."],"answer":"C","explain":"Dùng thủ đoạn gian lận, phi pháp là mặt tiêu cực của cạnh tranh, cần bị pháp luật xử lí.","points":0.25},{"type":"mcq","level":"NB","q":"Chủ thể kinh tế tham gia cạnh tranh bao gồm","options":["A. chỉ doanh nghiệp nhà nước.","B. mọi tổ chức, cá nhân sản xuất, kinh doanh hàng hoá, dịch vụ.","C. chỉ doanh nghiệp có vốn đầu tư nước ngoài.","D. chỉ các tập đoàn đa quốc gia."],"answer":"B","explain":"Mọi chủ thể sản xuất, kinh doanh — từ hộ cá thể đến tập đoàn — đều tham gia quan hệ cạnh tranh trên thị trường.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cạnh tranh được xem là động lực thúc đẩy kinh tế phát triển?","options":["A. Vì nó giúp doanh nghiệp yếu được Nhà nước bao cấp.","B. Vì nó buộc các chủ thể phải nâng cao năng suất, chất lượng, hạ giá thành để tồn tại.","C. Vì nó xóa bỏ mọi rủi ro trong kinh doanh.","D. Vì nó đảm bảo mọi doanh nghiệp đều có lãi."],"answer":"B","explain":"Áp lực cạnh tranh buộc doanh nghiệp đổi mới, nâng cao hiệu quả — đó chính là động lực phát triển của nền kinh tế thị trường.","points":0.25},{"type":"mcq","level":"TH","q":"Pháp luật Việt Nam xử lí hành vi cạnh tranh không lành mạnh bằng các biện pháp nào?","options":["A. Khen thưởng doanh nghiệp vi phạm.","B. Phạt tiền, đình chỉ kinh doanh, buộc tiêu huỷ hàng giả.","C. Bảo hộ độc quyền cho doanh nghiệp vi phạm.","D. Miễn thuế cho doanh nghiệp vi phạm."],"answer":"B","explain":"Các chế tài: phạt tiền, đình chỉ hoạt động, buộc tiêu huỷ hàng giả, cải chính thông tin... nhằm răn đe và bảo vệ thị trường.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Mai bán bánh mì, thấy quán đối diện dùng thịt ôi nhưng bán rẻ hơn nên cũng định làm theo để giữ khách. Theo em, chị Mai nên làm gì?","options":["A. Làm theo đối thủ để không mất khách.","B. Kiên trì làm bánh sạch, nâng cao chất lượng và tố cáo hành vi của đối thủ với cơ quan chức năng.","C. Đóng cửa quán vì không cạnh tranh nổi.","D. Thuê người phá quán đối thủ."],"answer":"B","explain":"Làm theo là vi phạm pháp luật và đạo đức; cách đúng là kiên trì cạnh tranh lành mạnh bằng chất lượng và tố cáo hành vi vi phạm để pháp luật xử lí.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cạnh tranh lành mạnh và cạnh tranh không lành mạnh là hai loại xét theo tính chất.","b) Thắng bằng chất lượng, giá cả hợp lí là cạnh tranh lành mạnh.","c) Thắng bằng gian lận, thủ đoạn phi pháp là cạnh tranh không lành mạnh.","d) Pháp luật khuyến khích mọi thủ đoạn cạnh tranh miễn là doanh nghiệp có lãi."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: pháp luật chỉ khuyến khích cạnh tranh lành mạnh, nghiêm cấm thủ đoạn phi pháp.","points":1},{"type":"truefalse","level":"VDC","q":"Trang trại gà của ông S đạt chuẩn VietGAP nhưng bị trang trại bên cạnh tung tin đồn thất thiệt rằng gà của ông S nhiễm bệnh, đồng thời bán trứng gà công nghiệp giả danh trứng gà ta với giá rẻ hơn. Xét tính đúng, sai:","statements":["a) Tung tin đồn thất thiệt là hành vi cạnh tranh không lành mạnh.","b) Bán hàng giả danh là vi phạm pháp luật.","c) Ông S nên dùng tin đồn ngược lại để trả đũa.","d) Ông S có quyền yêu cầu cơ quan chức năng xử lí và đòi bồi thường thiệt hại."],"answer":["T","T","F","T"],"explain":"a), b) Đúng: đều là thủ đoạn phi pháp. c) Sai: trả đũa bằng tin đồn cũng là vi phạm; phải dùng pháp luật. d) Đúng: người bị hại được pháp luật bảo vệ, đòi bồi thường.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Cạnh tranh giữa các doanh nghiệp cùng sản xuất một loại hàng hoá gọi là cạnh tranh trong nội bộ ... (1 từ)","answer":"ngành","explain":"Theo phạm vi: cạnh tranh trong nội bộ ngành (cùng loại hàng hoá) và cạnh tranh giữa các ngành.","points":0.5},{"type":"short","level":"VDC","q":"Hiệu thuốc T bán thuốc hết hạn sử dụng, xóa hạn cũ in hạn mới để cạnh tranh giá rẻ với hiệu thuốc bên cạnh. Hành vi này ngoài vi phạm pháp luật còn thể hiện sự thiếu ... trong kinh doanh. (Điền cụm từ còn thiếu: đạo đức ...)","answer":"đạo đức kinh doanh","explain":"Bán thuốc hết hạn, gian dối về chất lượng vừa vi phạm pháp luật vừa vi phạm đạo đức kinh doanh, đe dọa sức khỏe cộng đồng.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Trong nền kinh tế thị trường, cạnh tranh giúp người tiêu dùng","options":["A. có nhiều lựa chọn hàng hoá, dịch vụ tốt hơn với giá hợp lí hơn.","B. bị ép mua hàng hoá duy nhất với giá cao.","C. không được khiếu nại khi mua phải hàng giả.","D. phải mua hàng theo sự phân phối của Nhà nước."],"answer":"A","explain":"Nhờ cạnh tranh, hàng hoá phong phú, chất lượng cao, giá hợp lí — người tiêu dùng có nhiều lựa chọn và được hưởng lợi.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi đầu cơ, găm hàng, nâng giá trục lợi là biểu hiện của","options":["A. cạnh tranh lành mạnh.","B. cạnh tranh không lành mạnh.","C. hợp tác xã.","D. kinh doanh có đạo đức."],"answer":"B","explain":"Đầu cơ, găm hàng, nâng giá là thủ đoạn phi pháp trục lợi — thuộc cạnh tranh không lành mạnh.","points":0.25},{"type":"mcq","level":"NB","q":"Để bảo vệ mình trước hành vi cạnh tranh không lành mạnh, doanh nghiệp làm ăn chân chính có thể","options":["A. dùng thủ đoạn phi pháp trả đũa.","B. tố cáo, khiếu nại đến cơ quan quản lí nhà nước.","C. im lặng chịu thiệt.","D. rút khỏi thị trường."],"answer":"B","explain":"Doanh nghiệp bị hại có quyền tố cáo, khiếu nại; cơ quan quản lí cạnh tranh, quản lí thị trường sẽ điều tra, xử lí và bảo vệ quyền lợi hợp pháp.","points":0.25},{"type":"mcq","level":"TH","q":"Câu nói nào sau đây phản ánh đúng bản chất của cạnh tranh lành mạnh?","options":["A. Thắng bằng mọi giá, kể cả thủ đoạn.","B. Thắng bằng chất lượng, uy tín và sự trung thực.","C. Thắng bằng cách triệt hạ đối thủ.","D. Thắng bằng cách trốn thuế."],"answer":"B","explain":"Cạnh tranh lành mạnh là thắng bằng năng lực thật: chất lượng, giá cả hợp lí, uy tín, trong khuôn khổ pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Nhà nước phải can thiệp vào quan hệ cạnh tranh?","options":["A. Vì muốn xóa bỏ hoàn toàn cạnh tranh.","B. Vì cần phát huy mặt tích cực, hạn chế mặt tiêu cực, bảo vệ người tiêu dùng và doanh nghiệp chân chính.","C. Vì muốn bảo hộ độc quyền cho doanh nghiệp nhà nước.","D. Vì muốn tăng thuế của doanh nghiệp."],"answer":"B","explain":"Nhà nước can thiệp bằng pháp luật để phát huy mặt tích cực, ngăn chặn thủ đoạn phi pháp, giữ môi trường cạnh tranh bình đẳng.","points":0.25},{"type":"mcq","level":"VD","q":"Hai hãng nước giải khát A và B cùng tài trợ các giải bóng đá, cải tiến hương vị và tung chai dung tích mới. Doanh số cả hai cùng tăng, người tiêu dùng có thêm lựa chọn. Đây là ví dụ về","options":["A. cạnh tranh lành mạnh mang lại lợi ích cho cả doanh nghiệp và người tiêu dùng.","B. thỏa thuận hạn chế cạnh tranh.","C. hành vi độc quyền.","D. cạnh tranh không lành mạnh."],"answer":"A","explain":"Cả hai thắng bằng đổi mới sản phẩm và marketing hợp pháp; người tiêu dùng hưởng lợi — điển hình cạnh tranh lành mạnh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cạnh tranh diễn ra trong cả sản xuất và lưu thông hàng hoá, dịch vụ.","b) Mọi chủ thể kinh tế, từ hộ cá thể đến tập đoàn, đều tham gia cạnh tranh.","c) Cạnh tranh lành mạnh cần được khuyến khích, bảo vệ.","d) Cạnh tranh không lành mạnh không gây hại gì cho xã hội."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cạnh tranh không lành mạnh gây hại cho đối thủ, người tiêu dùng và trật tự thị trường.","points":1},{"type":"truefalse","level":"VDC","q":"Trong đợt sốt đất, nhóm C rủ nhau tung tin thất thiệt rằng khu vực X sắp có dự án lớn, đồng loạt gom đất rồi bán sang tay đẩy giá lên gấp 3 lần, khiến nhiều người dân vay nợ mua đất giá ảo. Xét tính đúng, sai:","statements":["a) Tung tin thất thiệt để đẩy giá đất là hành vi gian lận, phi pháp.","b) Hành vi của nhóm C là biểu hiện mặt tiêu cực của cạnh tranh trên thị trường bất động sản.","c) Người dân mua đất giá ảo không được pháp luật bảo vệ vì tự nguyện mua.","d) Cơ quan chức năng có thể xử lí hành vi tung tin sai sự thật, thao túng thị trường."],"answer":["T","T","F","T"],"explain":"a), b) Đúng: tung tin ảo, thổi giá là thủ đoạn phi pháp. c) Sai: người bị lừa được pháp luật bảo vệ, có quyền tố cáo. d) Đúng: hành vi tung tin sai sự thật, thao túng thị trường bị xử lí.","points":1},{"type":"short","level":"VD","q":"Văn bản pháp luật chuyên điều chỉnh hành vi cạnh tranh ở Việt Nam hiện nay là Luật ... năm 2018. (Điền 1 từ)","answer":"Cạnh tranh","explain":"Luật Cạnh tranh năm 2018 điều chỉnh các hành vi hạn chế cạnh tranh và cạnh tranh không lành mạnh.","points":0.5},{"type":"short","level":"VDC","q":"Công ty V bị đối thủ làm hàng nhái. Thay vì trả đũa phi pháp, V đã đăng kí bảo hộ nhãn hiệu, nâng cao chất lượng và gửi đơn tố cáo đến cơ quan quản lí thị trường. Cách ứng xử của V thể hiện phương châm cạnh tranh nào? (Trả lời 2 từ: cạnh tranh ...)","answer":"lành mạnh","explain":"Dùng pháp luật bảo vệ mình và thắng bằng chất lượng là cạnh tranh lành mạnh — cách ứng xử đúng đắn, bền vững.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Nội dung nào sau đây KHÔNG phải là mặt tích cực của cạnh tranh?","options":["A. Thúc đẩy lực lượng sản xuất phát triển.","B. Kích thích tính năng động, sáng tạo.","C. Nâng cao chất lượng, hạ giá thành sản phẩm.","D. Gây phân hoá giàu nghèo trong xã hội."],"answer":"D","explain":"Phân hoá giàu nghèo là mặt tiêu cực của cạnh tranh; ba nội dung còn lại là mặt tích cực.","points":0.25},{"type":"mcq","level":"NB","q":"Nội dung nào sau đây là mặt tiêu cực của cạnh tranh?","options":["A. Đáp ứng tốt hơn nhu cầu của xã hội.","B. Buộc doanh nghiệp đổi mới công nghệ.","C. Nảy sinh các thủ đoạn kinh doanh phi pháp như hàng giả, trốn thuế.","D. Hạ giá thành sản phẩm."],"answer":"C","explain":"Thủ đoạn phi pháp (hàng giả, trốn thuế, đầu cơ, tung tin xấu...) là mặt tiêu cực của cạnh tranh.","points":0.25},{"type":"mcq","level":"NB","q":"Cạnh tranh không lành mạnh là cạnh tranh","options":["A. tuân thủ pháp luật và chuẩn mực đạo đức.","B. bằng mọi thủ đoạn gian lận, phi pháp để giành thắng lợi.","C. bằng chất lượng và dịch vụ tốt.","D. được Nhà nước khuyến khích."],"answer":"B","explain":"Cạnh tranh không lành mạnh là dùng thủ đoạn gian lận, vi phạm pháp luật và đạo đức để triệt hạ đối thủ.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các biện pháp sau, biện pháp nào của Nhà nước trực tiếp bảo vệ doanh nghiệp làm ăn chân chính?","options":["A. Tăng thuế với mọi doanh nghiệp.","B. Xử phạt nghiêm hành vi sản xuất hàng giả, tung tin xấu về đối thủ.","C. Cấm quảng cáo mọi sản phẩm.","D. Ấn định giá bán cho từng doanh nghiệp."],"answer":"B","explain":"Xử phạt hành vi cạnh tranh không lành mạnh chính là bảo vệ doanh nghiệp chân chính và giữ môi trường cạnh tranh bình đẳng.","points":0.25},{"type":"mcq","level":"TH","q":"Một doanh nghiệp thua lỗ, phá sản vì không đổi mới kịp trước đối thủ mạnh hơn. Đây là biểu hiện của","options":["A. sự can thiệp sai lầm của Nhà nước.","B. quy luật đào thải khắc nghiệt của cạnh tranh (mặt tiêu cực đối với kẻ thua).","C. hành vi cạnh tranh không lành mạnh của đối thủ.","D. sự may rủi ngẫu nhiên."],"answer":"B","explain":"Cạnh tranh có tính hai mặt: kẻ thắng vươn lên, kẻ thua, lạc hậu bị đào thải — đó là mặt khốc liệt, tiêu cực đối với bên thua cuộc.","points":0.25},{"type":"mcq","level":"VD","q":"Chợ đêm có 10 quầy bán đồ nướng. Quầy của anh Dũng niêm yết giá rõ ràng, cân đúng, tặng kèm rau sống miễn phí nên lúc nào cũng đông khách nhất. Các quầy khác bắt đầu học theo cách làm của anh. Hiện tượng này cho thấy","options":["A. cạnh tranh lành mạnh lan tỏa thói quen kinh doanh tốt trong cộng đồng.","B. anh Dũng đang độc quyền chợ đêm.","C. các quầy khác vi phạm pháp luật khi học theo.","D. cạnh tranh chỉ có hại."],"answer":"A","explain":"Áp lực cạnh tranh lành mạnh buộc các quầy khác cũng phải nâng cao chất lượng, phục vụ tốt hơn — lan tỏa thói quen kinh doanh tốt, người mua hưởng lợi.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cạnh tranh là quy luật khách quan, không do ý muốn chủ quan tạo ra.","b) Mục đích của cạnh tranh là thu lợi nhuận cao nhất.","c) Cạnh tranh chỉ có mặt tích cực, không có mặt tiêu cực.","d) Nhà nước có vai trò điều tiết để cạnh tranh diễn ra lành mạnh."],"answer":["T","T","F","T"],"explain":"a), b) Đúng. c) Sai: cạnh tranh có tính hai mặt. d) Đúng: Nhà nước ban hành luật, xử lí vi phạm.","points":1},{"type":"truefalse","level":"VDC","q":"Công ty thực phẩm E bị phát hiện dùng nguyên liệu hết hạn để sản xuất, đồng thời in nhãn mác giả mạo thương hiệu nổi tiếng F để bán giá cao. Khi bị kiểm tra, E khai rằng làm vậy là để cạnh tranh với F. Xét tính đúng, sai:","statements":["a) Hành vi của E là cạnh tranh lành mạnh vì giúp giảm giá thành.","b) E đã vi phạm pháp luật về an toàn thực phẩm và sở hữu trí tuệ.","c) Người tiêu dùng mua phải sản phẩm của E có quyền được bồi thường.","d) Lí do cạnh tranh có thể miễn trừ trách nhiệm cho E."],"answer":["F","T","T","F"],"explain":"a) Sai: đây là thủ đoạn phi pháp nghiêm trọng. b) Đúng: vi phạm an toàn thực phẩm và nhái thương hiệu. c) Đúng: người tiêu dùng được bảo vệ, đòi bồi thường. d) Sai: không lí do nào miễn trừ vi phạm pháp luật.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Lợi ích kinh tế ... nhau giữa các chủ thể là một nguyên nhân khách quan dẫn đến cạnh tranh. (1 từ)","answer":"đối lập","explain":"Lợi ích kinh tế đối lập nhau (người này được thì người kia mất) là nguyên nhân khách quan dẫn đến cạnh tranh.","points":0.5},{"type":"short","level":"VDC","q":"Bà con nông dân xã X liên kết thành hợp tác xã, đầu tư kho lạnh, đăng kí nhãn hiệu rau an toàn để cạnh tranh với rau không rõ nguồn gốc trên thị trường. Cách làm này thể hiện tinh thần cạnh tranh nào? (Trả lời 2 từ: cạnh tranh ...)","answer":"lành mạnh","explain":"Liên kết nâng cao chất lượng, xây dựng thương hiệu bằng con đường hợp pháp là cạnh tranh lành mạnh — mô hình phát triển bền vững.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng về cạnh tranh?","options":["A. Cạnh tranh là sự ganh đua gay gắt giữa các chủ thể kinh tế nhằm thu lợi nhuận cao nhất.","B. Cạnh tranh là sự giúp đỡ lẫn nhau giữa các doanh nghiệp.","C. Cạnh tranh chỉ tồn tại ở nước ngoài, không có ở Việt Nam.","D. Cạnh tranh là chính sách do Chính phủ ban hành hằng năm."],"answer":"A","explain":"Đúng định nghĩa SGK: cạnh tranh là sự ganh đua, đấu tranh gay gắt giữa các chủ thể kinh tế nhằm giành điều kiện thuận lợi và lợi nhuận cao nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Theo tính chất, hành vi tung tin xấu hạ uy tín đối thủ thuộc loại","options":["A. cạnh tranh lành mạnh.","B. cạnh tranh không lành mạnh.","C. hợp tác kinh doanh.","D. quảng cáo trung thực."],"answer":"B","explain":"Tung tin xấu, bôi nhọ đối thủ là thủ đoạn gian lận — thuộc cạnh tranh không lành mạnh, bị pháp luật cấm.","points":0.25},{"type":"mcq","level":"NB","q":"Ai là người được hưởng lợi trực tiếp từ cạnh tranh lành mạnh?","options":["A. Chỉ doanh nghiệp thắng cuộc.","B. Người tiêu dùng và toàn xã hội.","C. Chỉ cơ quan nhà nước.","D. Không ai được hưởng lợi."],"answer":"B","explain":"Người tiêu dùng được mua hàng tốt hơn, rẻ hơn; xã hội được thúc đẩy phát triển — đó là lợi ích của cạnh tranh lành mạnh.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác nhau cơ bản giữa cạnh tranh lành mạnh và cạnh tranh không lành mạnh là","options":["A. quy mô doanh nghiệp lớn hay nhỏ.","B. có tuân thủ pháp luật và chuẩn mực đạo đức hay dùng thủ đoạn phi pháp.","C. kinh doanh trong nước hay nước ngoài.","D. có quảng cáo hay không quảng cáo."],"answer":"B","explain":"Tiêu chí phân biệt theo tính chất: lành mạnh tuân thủ pháp luật, đạo đức; không lành mạnh dùng thủ đoạn gian lận, phi pháp.","points":0.25},{"type":"mcq","level":"TH","q":"Luật Cạnh tranh năm 2018 nghiêm cấm các hành vi nào sau đây?","options":["A. Nâng cao chất lượng sản phẩm.","B. Thỏa thuận hạn chế cạnh tranh, lạm dụng vị trí thống lĩnh thị trường, cạnh tranh không lành mạnh.","C. Mở rộng quy mô sản xuất.","D. Tuyển thêm lao động."],"answer":"B","explain":"Luật Cạnh tranh 2018 cấm ba nhóm hành vi: thỏa thuận hạn chế cạnh tranh, lạm dụng vị trí thống lĩnh/vị trí độc quyền, và cạnh tranh không lành mạnh.","points":0.25},{"type":"mcq","level":"VD","q":"Một start-up công nghệ Việt Nam tạo ra ứng dụng giao đồ ăn với phí ship rẻ, giao nhanh nhờ tối ưu thuật toán, dần chiếm được thị phần từ các ông lớn ngoại. Thành công này cho thấy","options":["A. chỉ doanh nghiệp ngoại mới cạnh tranh được.","B. đổi mới sáng tạo là vũ khí cạnh tranh lành mạnh hiệu quả của doanh nghiệp Việt.","C. cạnh tranh luôn cần thủ đoạn phi pháp.","D. Nhà nước đã cấm các ông lớn ngoại."],"answer":"B","explain":"Thắng bằng đổi mới công nghệ, tối ưu chi phí là cạnh tranh lành mạnh; cho thấy doanh nghiệp Việt hoàn toàn có thể thắng bằng sáng tạo.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cạnh tranh thúc đẩy lực lượng sản xuất phát triển là mặt tích cực.","b) Cạnh tranh gây phân hoá giàu nghèo là mặt tiêu cực.","c) Thủ đoạn phi pháp trong cạnh tranh cần bị lên án và xử lí.","d) Để thắng trong cạnh tranh, doanh nghiệp nên dùng mọi thủ đoạn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: đúng tính hai mặt và thái độ cần có với thủ đoạn phi pháp. d) Sai: chỉ được cạnh tranh bằng con đường hợp pháp, lành mạnh.","points":1},{"type":"truefalse","level":"VDC","q":"Xã Y có nghề làm mắm truyền thống. Một hộ đầu tư máy móc hiện đại, đăng kí nhãn hiệu, bán hàng online nên phát triển mạnh; 5 hộ khác vẫn làm thủ công, chất lượng thấp dần mất khách. Một số hộ cho rằng hộ kia cạnh tranh không lành mạnh. Xét tính đúng, sai:","statements":["a) Đầu tư công nghệ, xây dựng thương hiệu là cạnh tranh lành mạnh.","b) Các hộ làm thủ công bị mất khách là do quy luật đào thải của cạnh tranh.","c) Kết luận hộ kia cạnh tranh không lành mạnh là đúng.","d) Các hộ thủ công nên liên kết, đổi mới để nâng sức cạnh tranh thay vì đổ lỗi."],"answer":["T","T","F","T"],"explain":"a) Đúng: thắng bằng đầu tư thật là lành mạnh. b) Đúng: kẻ lạc hậu bị đào thải là mặt khốc liệt của cạnh tranh. c) Sai: không có thủ đoạn phi pháp nào ở đây. d) Đúng: hướng đi đúng là đổi mới, liên kết.","points":1},{"type":"short","level":"VD","q":"Hoàn thành câu: Thắng bằng chất lượng, giá cả hợp lí và sự trung thực là cạnh tranh ... (2 từ)","answer":"lành mạnh","explain":"Cạnh tranh lành mạnh là cạnh tranh tuân thủ pháp luật và chuẩn mực đạo đức, thắng bằng năng lực thật.","points":0.5},{"type":"short","level":"VDC","q":"Trong nền kinh tế thị trường, Nhà nước ban hành Luật Cạnh tranh, xử lí hành vi gian lận và bảo vệ người tiêu dùng. Vai trò này của Nhà nước nhằm phát huy mặt ... và hạn chế mặt ... của cạnh tranh. (Điền 2 cụm, cách nhau bằng dấu phẩy)","answer":"tích cực, tiêu cực","explain":"Nhà nước điều tiết để phát huy mặt tích cực (thúc đẩy phát triển) và hạn chế mặt tiêu cực (thủ đoạn phi pháp, phân hoá) của cạnh tranh.","points":0.5}]}]}</script>
