{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Theo Luật Hôn nhân và Gia đình, vợ và chồng","options":["A. bình đẳng với nhau về quyền và nghĩa vụ.","B. chồng quyết định mọi việc.","C. vợ phải phục tùng chồng.","D. không có quyền gì."],"answer":"A","explain":"Vợ chồng bình đẳng về quyền, nghĩa vụ; cùng bàn bạc, quyết định việc gia đình.","points":0.25},{"type":"mcq","level":"NB","q":"Bình đẳng trong lao động có nghĩa là","options":["A. không phân biệt giới tính trong tuyển dụng, tiền lương, điều kiện làm việc.","B. chỉ tuyển nam giới.","C. nữ lương thấp hơn nam.","D. phân biệt đối xử."],"answer":"A","explain":"Bộ luật Lao động 2019: bình đẳng, không phân biệt giới tính.","points":0.25},{"type":"mcq","level":"NB","q":"Bình đẳng trong kinh doanh có nghĩa là","options":["A. mọi thành phần kinh tế bình đẳng trước pháp luật.","B. chỉ doanh nghiệp nhà nước được ưu đãi.","C. tư nhân bị hạn chế.","D. phân biệt đối xử."],"answer":"A","explain":"Mọi thành phần kinh tế bình đẳng về quyền, nghĩa vụ, cơ hội.","points":0.25},{"type":"mcq","level":"TH","q":"Công ty tuyển kế toán chỉ nhận nam dù nữ cũng đủ tiêu chuẩn. Đây là","options":["A. quyền của công ty.","B. phân biệt giới tính, vi phạm bình đẳng trong lao động.","C. việc bình thường.","D. đáng khuyến khích."],"answer":"B","explain":"Phân biệt giới tính trong tuyển dụng vi phạm pháp luật lao động.","points":0.25},{"type":"mcq","level":"TH","q":"Vợ chồng anh Tuấn cùng bàn bạc quyết định cho con học trường nào. Đây là","options":["A. bình đẳng trong hôn nhân, gia đình.","B. vợ lấn quyền chồng.","C. thiếu quyết đoán.","D. vi phạm."],"answer":"A","explain":"Cùng bàn bạc, quyết định việc gia đình là bình đẳng.","points":0.25},{"type":"mcq","level":"VD","q":"Người chồng độc đoán, đánh đập vợ con. Hành vi này","options":["A. là quyền của người chồng.","B. là bạo lực gia đình, vi phạm pháp luật.","C. là việc riêng gia đình.","D. được pháp luật cho phép."],"answer":"B","explain":"Bạo lực gia đình bị pháp luật nghiêm cấm, xử lí.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vợ chồng bình đẳng về quyền và nghĩa vụ.","b) Lao động nam nữ cùng công việc thì hưởng lương như nhau.","c) Mọi thành phần kinh tế bình đẳng trước pháp luật.","d) Được phân biệt giới tính khi tuyển dụng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nghiêm cấm phân biệt giới tính.","points":1},{"type":"truefalse","level":"VDC","q":"Chị Hoa mang thai, công ty doạ sa thải vì sợ ảnh hưởng công việc; trong khi đó anh Nam cùng công ty được tăng lương dù năng suất thấp hơn chị Hoa. Xét tính đúng, sai:","statements":["a) Doạ sa thải vì mang thai vi phạm quy định bảo vệ lao động nữ.","b) Trả lương không theo năng suất mà theo giới tính là phân biệt đối xử.","c) Chị Hoa được nghỉ thai sản 6 tháng theo pháp luật.","d) Công ty có quyền tuỳ ý đối xử với lao động nữ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: bảo vệ lao động nữ, bình đẳng tiền lương. d) Sai.","points":1},{"type":"short","level":"VD","q":"Luật quy định vợ chồng bình đẳng trong gia đình là Luật Hôn nhân và Gia đình năm nào? (Điền số năm)","answer":"2014","explain":"Luật Hôn nhân và Gia đình năm 2014.","points":0.5},{"type":"short","level":"VDC","q":"Hành vi chồng đánh đập vợ con trong gia đình gọi là bạo lực ... (Điền 2 từ)","answer":"gia đình","explain":"Bạo lực gia đình — vi phạm pháp luật.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Trong gia đình, con cái","options":["A. được cha mẹ yêu thương, chăm sóc như nhau, không phân biệt trai gái.","B. con trai được ưu tiên hơn.","C. con gái không cần đi học.","D. phân biệt đối xử."],"answer":"A","explain":"Không phân biệt đối xử giữa con trai, con gái.","points":0.25},{"type":"mcq","level":"NB","q":"Tài sản chung của vợ chồng","options":["A. do vợ chồng cùng quản lí, sử dụng.","B. chỉ chồng quản lí.","C. chỉ vợ quản lí.","D. ai làm ra người đó giữ."],"answer":"A","explain":"Tài sản chung do vợ chồng cùng quản lí.","points":0.25},{"type":"mcq","level":"NB","q":"Lao động nữ được pháp luật bảo vệ riêng về","options":["A. nghỉ thai sản, không bị sa thải vì mang thai.","B. làm việc nặng nhọc.","C. lương thấp hơn nam.","D. không được thăng tiến."],"answer":"A","explain":"Bảo vệ lao động nữ: thai sản, việc làm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao pháp luật có quy định riêng bảo vệ lao động nữ?","options":["A. Vì thiên vị nữ giới.","B. Vì đặc điểm sinh học, thiên chức làm mẹ cần được bảo vệ để bình đẳng thực chất.","C. Vì nữ yếu đuối.","D. Vì nam giới không cần bảo vệ."],"answer":"B","explain":"Bảo vệ đặc thù để đạt bình đẳng thực chất.","points":0.25},{"type":"mcq","level":"TH","q":"Doanh nghiệp tư nhân và doanh nghiệp nhà nước khi đấu thầu dự án","options":["A. được đối xử bình đẳng, không phân biệt.","B. nhà nước luôn thắng.","C. tư nhân bị loại.","D. ai quen biết thì thắng."],"answer":"A","explain":"Bình đẳng trong kinh doanh, đấu thầu công bằng.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình ông Ba chỉ cho con trai đi học đại học, bắt con gái nghỉ học đi làm. Việc làm này","options":["A. là quyền của gia đình.","B. phân biệt đối xử với con gái, vi phạm bình đẳng.","C. tiết kiệm chi phí.","D. đáng khuyến khích."],"answer":"B","explain":"Mọi trẻ em đều có quyền đi học, không phân biệt trai gái.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Con trai, con gái đều có quyền đi học như nhau.","b) Tài sản chung do vợ chồng cùng quản lí.","c) Lao động nữ được nghỉ thai sản theo pháp luật.","d) Doanh nghiệp tư nhân bị phân biệt khi đấu thầu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bình đẳng, không phân biệt.","points":1},{"type":"truefalse","level":"VDC","q":"Khi ly hôn, tài sản chung của vợ chồng được chia theo nguyên tắc bình đẳng, có tính đến công sức đóng góp; con chung được cả hai cùng chăm sóc. Xét tính đúng, sai:","statements":["a) Chia tài sản theo nguyên tắc bình đẳng là đúng pháp luật.","b) Công sức đóng góp được tính đến khi chia tài sản.","c) Cả cha và mẹ đều có nghĩa vụ chăm sóc con.","d) Khi ly hôn, tài sản thuộc về người chồng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: Luật Hôn nhân và Gia đình 2014. d) Sai.","points":1},{"type":"short","level":"VD","q":"Bộ luật quy định bình đẳng trong lao động là Bộ luật ... năm 2019. (Điền 2 từ)","answer":"Lao động","explain":"Bộ luật Lao động năm 2019.","points":0.5},{"type":"short","level":"VDC","q":"Theo pháp luật, lao động nữ được nghỉ thai sản mấy tháng? (Điền số)","answer":"6","explain":"Nghỉ thai sản 6 tháng.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Bình đẳng trong hôn nhân thể hiện ở việc","options":["A. vợ chồng cùng quyết định việc gia đình.","B. chồng độc đoán.","C. vợ phục tùng.","D. không cần bàn bạc."],"answer":"A","explain":"Cùng bàn bạc, quyết định.","points":0.25},{"type":"mcq","level":"NB","q":"Bình đẳng trong kinh doanh KHÔNG bao gồm","options":["A. bình đẳng về quyền tự do kinh doanh.","B. bình đẳng về cơ hội tiếp cận vốn, thị trường.","C. ưu đãi riêng cho một thành phần.","D. bình đẳng về nghĩa vụ nộp thuế."],"answer":"C","explain":"Không phân biệt, ưu đãi riêng trái bình đẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Nghiêm cấm trong gia đình là","options":["A. bạo lực gia đình.","B. yêu thương nhau.","C. bàn bạc dân chủ.","D. chăm sóc con cái."],"answer":"A","explain":"Bạo lực gia đình bị nghiêm cấm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cùng công việc thì nam nữ phải hưởng lương như nhau?","options":["A. Vì giá trị sức lao động như nhau, phân biệt là bất công.","B. Vì nữ cần tiền hơn.","C. Vì nam không cần tiền.","D. Vì pháp luật thích vậy."],"answer":"A","explain":"Bình đẳng tiền lương theo năng suất, không theo giới tính.","points":0.25},{"type":"mcq","level":"TH","q":"Một hộ kinh doanh cá thể và một công ty lớn cùng nộp thuế","options":["A. theo quy định pháp luật, bình đẳng về nghĩa vụ.","B. hộ nhỏ được miễn.","C. công ty lớn được miễn.","D. ai quen thì miễn."],"answer":"A","explain":"Bình đẳng về nghĩa vụ thuế.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Lan bị chồng ngăn cản đi làm, bắt ở nhà nội trợ. Chị nên","options":["A. chấp nhận.","B. đấu tranh, nhờ pháp luật bảo vệ quyền bình đẳng.","C. bỏ nhà đi.","D. im lặng."],"answer":"B","explain":"Phụ nữ có quyền lao động, được pháp luật bảo vệ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vợ chồng cùng quyết định việc gia đình.","b) Bạo lực gia đình bị nghiêm cấm.","c) Nam nữ cùng việc thì lương bằng nhau.","d) Được phân biệt thành phần kinh tế."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Anh Minh và chị Hoa cùng là nhân viên kinh doanh, doanh số như nhau nhưng chị Hoa lương thấp hơn 20% vì là nữ. Xét tính đúng, sai:","statements":["a) Đây là phân biệt giới tính trong tiền lương.","b) Chị Hoa có quyền yêu cầu trả lương bình đẳng.","c) Chị Hoa có thể khiếu nại đến cơ quan lao động.","d) Công ty được quyền trả lương nữ thấp hơn nam."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: vi phạm bình đẳng.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Vợ chồng ... nhau về quyền và nghĩa vụ. (2 từ)","answer":"bình đẳng","explain":"Vợ chồng bình đẳng.","points":0.5},{"type":"short","level":"VDC","q":"Trong tuyển dụng, nghiêm cấm phân biệt đối xử về ... tính. (Điền 1 từ)","answer":"giới","explain":"Phân biệt giới tính.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Gia đình văn minh là gia đình","options":["A. ấm no, bình đẳng, tiến bộ, hạnh phúc.","B. giàu có.","C. đông con.","D. có địa vị."],"answer":"A","explain":"Mục tiêu xây dựng gia đình.","points":0.25},{"type":"mcq","level":"NB","q":"Trách nhiệm của công dân trong bình đẳng các lĩnh vực là","options":["A. tôn trọng, không phân biệt đối xử.","B. phân biệt người khác.","C. bao che vi phạm.","D. thờ ơ."],"answer":"A","explain":"Tôn trọng, không phân biệt.","points":0.25},{"type":"mcq","level":"NB","q":"Khi thấy bạo lực gia đình, em nên","options":["A. báo cho người lớn, chính quyền, tổ chức bảo vệ.","B. im lặng.","C. cổ vũ.","D. quay video đăng mạng."],"answer":"A","explain":"Tố giác, bảo vệ nạn nhân.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao bình đẳng trong gia đình giúp gia đình hạnh phúc?","options":["A. Vì mọi người được tôn trọng, cùng chia sẻ, yêu thương nhau.","B. Vì không ai phải làm việc.","C. Vì có nhiều tiền.","D. Vì không cần pháp luật."],"answer":"A","explain":"Tôn trọng, chia sẻ tạo hạnh phúc.","points":0.25},{"type":"mcq","level":"TH","q":"Bình đẳng trong kinh doanh giúp","options":["A. mọi thành phần phát huy năng lực, kinh tế phát triển.","B. chỉ nhà nước phát triển.","C. tư nhân bị kìm hãm.","D. không có tác dụng."],"answer":"A","explain":"Cạnh tranh bình đẳng thúc đẩy phát triển.","points":0.25},{"type":"mcq","level":"VD","q":"Trong buổi họp phụ huynh, cô giáo đối xử công bằng với mọi phụ huynh, không phân biệt giàu nghèo. Điều này","options":["A. thể hiện bình đẳng trong giáo dục.","B. làm mất thời gian.","C. không cần thiết.","D. gây khó chịu."],"answer":"A","explain":"Bình đẳng, không phân biệt.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Gia đình cần ấm no, bình đẳng, hạnh phúc.","b) Thấy bạo lực gia đình nên báo chính quyền.","c) Bình đẳng trong kinh doanh thúc đẩy phát triển.","d) Phân biệt đối xử là việc riêng, không cần quan tâm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Sau khi học bài 10, lớp em thảo luận: bạn nam và bạn nữ đều có thể làm lớp trưởng; phân công trực nhật công bằng; không trêu chọc bạn vì giới tính. Xét tính đúng, sai:","statements":["a) Đây là thực hành bình đẳng giới trong lớp học.","b) Bạn nữ hoàn toàn có thể làm lớp trưởng.","c) Phân công công bằng thể hiện tôn trọng.","d) Trêu chọc vì giới tính là bình thường, không sao."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đó là phân biệt, cần tránh.","points":1},{"type":"short","level":"VD","q":"Hoàn thành: Gia đình ấm no, bình đẳng, tiến bộ và ... (1 từ)","answer":"hạnh phúc","explain":"Mục tiêu gia đình Việt Nam.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại 3 lĩnh vực: hôn nhân gia đình, lao động và ... (2 từ)","answer":"kinh doanh","explain":"Ba lĩnh vực của bài 10.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Vợ chồng có nghĩa vụ","options":["A. yêu thương, tôn trọng, chăm sóc nhau và cùng nuôi dạy con.","B. ai lo việc người đó.","C. không cần quan tâm nhau.","D. chỉ cần kiếm tiền."],"answer":"A","explain":"Nghĩa vụ vợ chồng theo Luật Hôn nhân và Gia đình.","points":0.25},{"type":"mcq","level":"NB","q":"Trong lao động, thăng tiến phải dựa trên","options":["A. năng lực, phẩm chất.","B. giới tính.","C. quan hệ.","D. ngoại hình."],"answer":"A","explain":"Bình đẳng cơ hội thăng tiến theo năng lực.","points":0.25},{"type":"mcq","level":"NB","q":"Thành phần kinh tế nào được ưu tiên đặc biệt trái bình đẳng?","options":["A. Không thành phần nào, mọi thành phần đều bình đẳng.","B. Kinh tế nhà nước.","C. Kinh tế tư nhân.","D. Kinh tế có vốn nước ngoài."],"answer":"A","explain":"Bình đẳng, không phân biệt.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải nghiêm cấm bạo lực gia đình?","options":["A. Vì xâm phạm quyền con người, phá vỡ hạnh phúc gia đình.","B. Vì là chuyện riêng.","C. Vì không ai quan tâm.","D. Vì pháp luật không quy định."],"answer":"A","explain":"Bạo lực gia đình vi phạm pháp luật, bị xử lí.","points":0.25},{"type":"mcq","level":"TH","q":"Một doanh nghiệp tư nhân làm ăn tốt, đóng thuế đầy đủ. Doanh nghiệp này","options":["A. được đối xử bình đẳng như mọi thành phần kinh tế khác.","B. bị phân biệt vì là tư nhân.","C. phải đóng cửa.","D. không được kinh doanh."],"answer":"A","explain":"Bình đẳng trong kinh doanh.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Mai là kĩ sư giỏi nhưng 5 năm không được thăng chức vì là nữ, trong khi đồng nghiệp nam kém hơn được thăng. Chị nên","options":["A. chấp nhận.","B. khiếu nại vì bị phân biệt giới tính trong thăng tiến.","C. nghỉ việc.","D. im lặng."],"answer":"B","explain":"Bình đẳng cơ hội thăng tiến; có quyền khiếu nại.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vợ chồng có nghĩa vụ yêu thương, chăm sóc nhau.","b) Thăng tiến dựa trên năng lực, không phân biệt giới.","c) Mọi thành phần kinh tế đều bình đẳng.","d) Bạo lực gia đình là việc riêng, pháp luật không can thiệp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: pháp luật nghiêm cấm, xử lí.","points":1},{"type":"truefalse","level":"VDC","q":"Ông Tuấn thường xuyên say rượu đánh vợ con; vợ ông cam chịu vì sợ điều tiếng. Xét tính đúng, sai:","statements":["a) Ông Tuấn đã vi phạm pháp luật về bạo lực gia đình.","b) Vợ ông Tuấn có quyền tố cáo, yêu cầu bảo vệ.","c) Cam chịu bạo lực là không đúng, cần lên tiếng.","d) Bạo lực gia đình là chuyện riêng, người ngoài không nên can thiệp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cộng đồng, chính quyền có trách nhiệm can thiệp, bảo vệ nạn nhân.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Thăng tiến trong công việc phải dựa trên năng lực và ... (2 từ)","answer":"phẩm chất","explain":"Năng lực, phẩm chất.","points":0.5},{"type":"short","level":"VDC","q":"Khi bị phân biệt đối xử trong lao động, người lao động có quyền ... đến cơ quan có thẩm quyền. (Điền 2 từ)","answer":"khiếu nại","explain":"Khiếu nại bảo vệ quyền lợi.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Bình đẳng giới trong gia đình thể hiện ở","options":["A. vợ chồng cùng chia sẻ việc nhà, nuôi dạy con.","B. vợ làm hết việc nhà.","C. chồng không cần làm gì.","D. phân công theo giới tính cứng nhắc."],"answer":"A","explain":"Chia sẻ, bình đẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Trong kinh doanh, cạnh tranh giữa các thành phần kinh tế phải","options":["A. bình đẳng, lành mạnh.","B. triệt hạ nhau.","C. gian lận.","D. phân biệt."],"answer":"A","explain":"Bình đẳng, lành mạnh.","points":0.25},{"type":"mcq","level":"NB","q":"Quyền của trẻ em trong gia đình là","options":["A. được yêu thương, chăm sóc, giáo dục.","B. phải đi làm sớm.","C. không được đi học.","D. bị phân biệt."],"answer":"A","explain":"Quyền trẻ em.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chia sẻ việc nhà giữa vợ chồng là biểu hiện bình đẳng?","options":["A. Vì cả hai đều có trách nhiệm với gia đình, không phân biệt.","B. Vì vợ yếu hơn.","C. Vì chồng bận.","D. Vì pháp luật bắt buộc chi tiết."],"answer":"A","explain":"Trách nhiệm chung.","points":0.25},{"type":"mcq","level":"TH","q":"Một công ty có chính sách ưu tiên đào tạo cho cả nam và nữ như nhau. Đây là","options":["A. bình đẳng về cơ hội đào tạo.","B. lãng phí.","C. thiên vị nữ.","D. không cần thiết."],"answer":"A","explain":"Bình đẳng đào tạo.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn An thấy bố mẹ luôn cùng nhau quyết định mọi việc lớn trong nhà, tôn trọng ý kiến nhau. An học được","options":["A. bài học về bình đẳng, tôn trọng trong gia đình.","B. không học được gì.","C. bố mẹ thiếu quyết đoán.","D. gia đình lộn xộn."],"answer":"A","explain":"Tấm gương bình đẳng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vợ chồng nên cùng chia sẻ việc nhà.","b) Đào tạo bình đẳng cho nam và nữ.","c) Trẻ em có quyền được chăm sóc, giáo dục.","d) Chỉ con trai mới cần được đi học."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Doanh nghiệp X có 50% lãnh đạo là nữ, chính sách lương, đào tạo bình đẳng; doanh nghiệp phát triển tốt. Xét tính đúng, sai:","statements":["a) X là mô hình bình đẳng giới trong lao động.","b) Bình đẳng giúp phát huy năng lực mọi người.","c) Doanh nghiệp bình đẳng thường phát triển bền vững.","d) Nữ giới không nên làm lãnh đạo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: phân biệt.","points":1},{"type":"short","level":"VD","q":"Hoàn thành: Vợ chồng cùng ... việc nhà, nuôi dạy con cái. (Điền 2 từ)","answer":"chia sẻ","explain":"Cùng chia sẻ.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Bình đẳng trong các lĩnh vực là cụ thể hoá quyền bình đẳng trước ... (2 từ)","answer":"pháp luật","explain":"Cụ thể hoá bình đẳng trước pháp luật.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Luật Hôn nhân và Gia đình năm 2014 quy định về","options":["A. bình đẳng giữa vợ và chồng.","B. quyền nuôi con của cha.","C. tài sản riêng của chồng.","D. ly hôn bắt buộc."],"answer":"A","explain":"Bình đẳng vợ chồng.","points":0.25},{"type":"mcq","level":"NB","q":"Bộ luật Lao động năm 2019 nghiêm cấm","options":["A. phân biệt đối xử trong lao động.","B. trả lương.","C. tuyển dụng.","D. đào tạo."],"answer":"A","explain":"Nghiêm cấm phân biệt đối xử.","points":0.25},{"type":"mcq","level":"NB","q":"Kinh tế tư nhân ở Việt Nam","options":["A. được đối xử bình đẳng như các thành phần khác.","B. bị cấm.","C. bị phân biệt.","D. không được kinh doanh."],"answer":"A","explain":"Bình đẳng mọi thành phần.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao bình đẳng trong kinh doanh thúc đẩy kinh tế phát triển?","options":["A. Vì mọi thành phần đều phát huy được năng lực, cạnh tranh lành mạnh.","B. Vì chỉ một thành phần phát triển.","C. Vì không cần cạnh tranh.","D. Vì Nhà nước bao cấp."],"answer":"A","explain":"Cạnh tranh bình đẳng thúc đẩy phát triển.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn nữ muốn học nghề sửa xe máy nhưng bị nói con gái không hợp. Em sẽ","options":["A. đồng tình.","B. động viên bạn theo đuổi đam mê, nghề không phân biệt giới.","C. cười nhạo.","D. ngăn cản."],"answer":"B","explain":"Bình đẳng trong chọn nghề.","points":0.25},{"type":"mcq","level":"VD","q":"Trong gia đình, quyết định cho con đi du học cần","options":["A. vợ chồng cùng bàn bạc, thống nhất.","B. chồng quyết định.","C. vợ quyết định.","D. con tự quyết."],"answer":"A","explain":"Cùng bàn bạc việc lớn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nghề nghiệp không phân biệt giới tính.","b) Việc lớn trong nhà cần vợ chồng cùng quyết.","c) Kinh tế tư nhân được đối xử bình đẳng.","d) Nữ giới không nên học nghề kĩ thuật."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Chị Lan là nữ thợ điện giỏi, được khách hàng tin tưởng; một số người nói phụ nữ không hợp nghề điện. Xét tính đúng, sai:","statements":["a) Suy nghĩ đó là định kiến giới cần xoá bỏ.","b) Chị Lan có quyền theo đuổi nghề mình giỏi.","c) Năng lực quyết định, không phải giới tính.","d) Phụ nữ chỉ nên làm nghề nhẹ nhàng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: định kiến.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Nghề nghiệp không phân biệt ... tính. (1 từ)","answer":"giới","explain":"Bình đẳng giới trong nghề nghiệp.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Mọi thành phần kinh tế đều bình đẳng, không bị ... đối xử. (Điền 2 từ)","answer":"phân biệt","explain":"Không phân biệt đối xử.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Bình đẳng trong gia đình KHÔNG bao gồm","options":["A. vợ chồng cùng quyết định.","B. tôn trọng nhau.","C. chồng độc đoán, áp đặt.","D. cùng nuôi dạy con."],"answer":"C","explain":"Độc đoán, áp đặt vi phạm bình đẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Bình đẳng trong lao động KHÔNG bao gồm","options":["A. tuyển dụng công bằng.","B. lương theo năng suất.","C. phân biệt nam nữ.","D. cơ hội thăng tiến bình đẳng."],"answer":"C","explain":"Phân biệt nam nữ vi phạm.","points":0.25},{"type":"mcq","level":"NB","q":"Để xây dựng gia đình hạnh phúc, vợ chồng cần","options":["A. yêu thương, tôn trọng, chia sẻ.","B. độc đoán.","C. bạo lực.","D. phân biệt."],"answer":"A","explain":"Yêu thương, tôn trọng, chia sẻ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cần xoá bỏ định kiến giới trong nghề nghiệp?","options":["A. Vì mọi người đều có quyền chọn nghề theo năng lực, đam mê.","B. Vì định kiến là đúng.","C. Vì không ai quan tâm.","D. Vì pháp luật không quy định."],"answer":"A","explain":"Bình đẳng cơ hội nghề nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Một công ty niêm yết công khai thang bảng lương cho mọi vị trí. Đây là","options":["A. minh bạch, bình đẳng về tiền lương.","B. tiết lộ bí mật.","C. không cần thiết.","D. vi phạm."],"answer":"A","explain":"Minh bạch lương đảm bảo bình đẳng.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn Hoa muốn sau này làm kĩ sư xây dựng nhưng lo nghề này chỉ dành cho nam. Lời khuyên đúng là","options":["A. từ bỏ.","B. nghề không phân biệt giới, hãy theo đuổi nếu có năng lực, đam mê.","C. chọn nghề khác.","D. chỉ nam mới làm được."],"answer":"B","explain":"Bình đẳng trong chọn nghề.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Độc đoán trong gia đình vi phạm bình đẳng.","b) Minh bạch lương đảm bảo bình đẳng.","c) Nghề nghiệp không phân biệt giới.","d) Phân biệt nam nữ trong lương là đúng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Gia đình bạn An: bố mẹ cùng đi làm, cùng chia sẻ việc nhà, cùng quyết định việc lớn; An và em trai đều được đi học đầy đủ. Xét tính đúng, sai:","statements":["a) Đây là gia đình bình đẳng, tiến bộ.","b) Chia sẻ việc nhà thể hiện tôn trọng nhau.","c) Con cái được đi học đầy đủ là thực hiện quyền trẻ em.","d) Trong gia đình, chỉ cần một người quyết định mọi việc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần cùng bàn bạc.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Độc đoán, áp đặt trong gia đình là vi phạm quyền ... (2 từ)","answer":"bình đẳng","explain":"Vi phạm bình đẳng trong gia đình.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Bình đẳng trong các lĩnh vực góp phần xây dựng xã hội công bằng, dân chủ và ... (Điền 2 từ)","answer":"văn minh","explain":"Xã hội công bằng, dân chủ, văn minh.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Quyền bình đẳng trong hôn nhân được pháp luật","options":["A. bảo vệ.","B. bỏ qua.","C. hạn chế.","D. cấm."],"answer":"A","explain":"Pháp luật bảo vệ.","points":0.25},{"type":"mcq","level":"NB","q":"Người lao động bị phân biệt đối xử có quyền","options":["A. khiếu nại, tố cáo.","B. im lặng.","C. bỏ việc.","D. trả thù."],"answer":"A","explain":"Khiếu nại, tố cáo.","points":0.25},{"type":"mcq","level":"NB","q":"Doanh nghiệp bị phân biệt trong đấu thầu có quyền","options":["A. khiếu nại theo pháp luật.","B. hối lộ.","C. bỏ cuộc.","D. đe dọa."],"answer":"A","explain":"Khiếu nại theo pháp luật đấu thầu.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao pháp luật bảo vệ quyền bình đẳng trong các lĩnh vực?","options":["A. Vì đảm bảo công bằng, phát huy năng lực mọi người.","B. Vì hình thức.","C. Vì không cần thiết.","D. Vì chỉ để đẹp."],"answer":"A","explain":"Công bằng, phát huy năng lực.","points":0.25},{"type":"mcq","level":"TH","q":"Một xã thực hiện tốt bình đẳng giới sẽ","options":["A. phát triển hài hoà, bền vững.","B. lạc hậu.","C. mất đoàn kết.","D. không thay đổi."],"answer":"A","explain":"Bình đẳng giới thúc đẩy phát triển.","points":0.25},{"type":"mcq","level":"VD","q":"Trong giờ giáo dục công dân, em sẽ thuyết trình về","options":["A. bình đẳng trong gia đình, lao động, kinh doanh.","B. phân biệt giới tính.","C. độc đoán gia đình.","D. bất bình đẳng."],"answer":"A","explain":"Tuyên truyền bình đẳng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Pháp luật bảo vệ quyền bình đẳng.","b) Bị phân biệt có quyền khiếu nại.","c) Bình đẳng giới giúp phát triển bền vững.","d) Phân biệt đối xử là đúng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Sau bài học, chi đoàn phát động: nam nữ bình đẳng trong mọi hoạt động, không trêu chọc phân biệt, giúp nhau tiến bộ. Xét tính đúng, sai:","statements":["a) Đây là thực hành bình đẳng giới.","b) Không trêu chọc phân biệt thể hiện tôn trọng.","c) Giúp nhau tiến bộ là đoàn kết.","d) Trong chi đoàn nên phân biệt nam nữ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Pháp luật ... quyền bình đẳng của công dân. (2 từ)","answer":"bảo vệ","explain":"Pháp luật bảo vệ.","points":0.5},{"type":"short","level":"VDC","q":"Khi bị phân biệt đối xử, công dân có quyền khiếu nại và ... (Điền 2 từ)","answer":"tố cáo","explain":"Khiếu nại, tố cáo.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tóm lại, bình đẳng trong các lĩnh vực là","options":["A. cụ thể hoá bình đẳng trước pháp luật vào gia đình, lao động, kinh doanh.","B. chỉ trong gia đình.","C. chỉ trong lao động.","D. không quan trọng."],"answer":"A","explain":"Tổng kết bài 10.","points":0.25},{"type":"mcq","level":"NB","q":"Mục tiêu của bình đẳng trong các lĩnh vực là","options":["A. công bằng, phát huy năng lực mọi người.","B. tạo ra đặc quyền.","C. phân biệt đối xử.","D. không có mục tiêu."],"answer":"A","explain":"Công bằng, phát huy năng lực.","points":0.25},{"type":"mcq","level":"NB","q":"Học sinh góp phần thực hiện bình đẳng bằng cách","options":["A. tôn trọng bạn bè, không phân biệt, đấu tranh với bất công.","B. kì thị bạn.","C. phân biệt giàu nghèo.","D. im lặng."],"answer":"A","explain":"Thực hành hằng ngày.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa bài 9 và bài 10 là","options":["A. bài 10 cụ thể hoá bài 9 vào từng lĩnh vực.","B. không liên quan.","C. mâu thuẫn.","D. trùng lặp."],"answer":"A","explain":"Bài 10 cụ thể hoá nguyên tắc bài 9.","points":0.25},{"type":"mcq","level":"TH","q":"Xã hội thực hiện tốt bình đẳng trong các lĩnh vực sẽ","options":["A. công bằng, văn minh, phát triển.","B. bất ổn.","C. lạc hậu.","D. chia rẽ."],"answer":"A","explain":"Ý nghĩa xã hội.","points":0.25},{"type":"mcq","level":"VD","q":"Em sẽ vận dụng bài học vào","options":["A. gia đình, lớp học, cộng đồng: tôn trọng, bình đẳng, không phân biệt.","B. chỉ để thi.","C. không vận dụng.","D. phân biệt bạn bè."],"answer":"A","explain":"Vận dụng thực tế.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bài 10 cụ thể hoá bài 9.","b) Bình đẳng mang lại công bằng, văn minh.","c) Học sinh có thể thực hành bình đẳng hằng ngày.","d) Bình đẳng là việc của người lớn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mọi người đều có trách nhiệm.","points":1},{"type":"truefalse","level":"VDC","q":"Hiến pháp 2013 ghi nhận quyền bình đẳng; các luật cụ thể hoá: Hôn nhân và Gia đình 2014, Lao động 2019, Doanh nghiệp. Xét tính đúng, sai:","statements":["a) Hệ thống pháp luật Việt Nam bảo đảm quyền bình đẳng.","b) Các luật cụ thể hoá nguyên tắc Hiến pháp.","c) Công dân được pháp luật bảo vệ quyền bình đẳng.","d) Pháp luật Việt Nam không quy định về bình đẳng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Hoàn thành: Bình đẳng trong các lĩnh vực là ... hoá quyền bình đẳng trước pháp luật. (Điền 2 từ)","answer":"cụ thể","explain":"Cụ thể hoá.","points":0.5},{"type":"short","level":"VDC","q":"Khẩu hiệu: Bình đẳng, ... , tiến bộ trong mọi lĩnh vực đời sống. (Điền 2 từ)","answer":"văn minh","explain":"Bình đẳng, văn minh, tiến bộ.","points":0.5}]}]}</script>
