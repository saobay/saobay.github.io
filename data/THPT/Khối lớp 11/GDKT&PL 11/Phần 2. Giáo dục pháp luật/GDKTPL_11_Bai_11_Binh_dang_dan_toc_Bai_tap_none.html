<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Quyền bình đẳng giữa các dân tộc có nghĩa là","options":["A. các dân tộc bình đẳng, đoàn kết, tôn trọng và giúp nhau cùng phát triển.","B. dân tộc đông người hơn có nhiều quyền hơn.","C. chỉ dân tộc Kinh mới có quyền.","D. các dân tộc tách biệt nhau."],"answer":"A","explain":"Điều 5 Hiến pháp 2013.","points":0.25},{"type":"mcq","level":"NB","q":"Quyền bình đẳng giữa các dân tộc được quy định tại điều nào của Hiến pháp 2013?","options":["A. Điều 5.","B. Điều 16.","C. Điều 25.","D. Điều 33."],"answer":"A","explain":"Điều 5 Hiến pháp 2013.","points":0.25},{"type":"mcq","level":"NB","q":"Việt Nam có bao nhiêu dân tộc anh em cùng chung sống?","options":["A. 54.","B. 50.","C. 60.","D. 45."],"answer":"A","explain":"54 dân tộc anh em.","points":0.25},{"type":"mcq","level":"TH","q":"Hành vi nào sau đây vi phạm quyền bình đẳng giữa các dân tộc?","options":["A. Miệt thị, kì thị người dân tộc thiểu số.","B. Học tiếng dân tộc mình.","C. Giữ gìn lễ hội truyền thống.","D. Giúp đỡ đồng bào vùng cao."],"answer":"A","explain":"Kì thị, miệt thị bị nghiêm cấm.","points":0.25},{"type":"mcq","level":"TH","q":"Chính sách nào sau đây của Nhà nước thể hiện quan tâm đến đồng bào dân tộc thiểu số?","options":["A. Xây trường nội trú, cấp học bổng cho học sinh vùng cao.","B. Cấm đồng bào đi học.","C. Thu thuế cao hơn.","D. Hạn chế đầu tư."],"answer":"A","explain":"Chính sách ưu tiên vùng dân tộc thiểu số.","points":0.25},{"type":"mcq","level":"VD","q":"Thấy bạn cùng lớp bị trêu chọc vì là người dân tộc thiểu số, em nên","options":["A. trêu theo.","B. bênh vực bạn, giải thích mọi dân tộc đều bình đẳng.","C. im lặng.","D. tránh xa bạn."],"answer":"B","explain":"Đấu tranh với kì thị, bảo vệ bạn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Các dân tộc bình đẳng, đoàn kết, giúp nhau cùng phát triển.","b) Nghiêm cấm mọi hành vi kì thị, chia rẽ dân tộc.","c) Đồng bào dân tộc thiểu số được hưởng chính sách ưu tiên của Nhà nước.","d) Dân tộc đông người hơn thì có nhiều quyền hơn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: Điều 5 Hiến pháp. d) Sai: mọi dân tộc đều bình đẳng.","points":1},{"type":"truefalse","level":"VDC","q":"Một đối tượng xấu tung tin bịa đặt rằng chính sách dân tộc bất công để kích động đồng bào thiểu số biểu tình, gây mất ổn định. Xét tính đúng, sai:","statements":["a) Đây là hành vi chia rẽ dân tộc, vi phạm pháp luật nghiêm trọng.","b) Đồng bào cần cảnh giác, không nghe theo kẻ xấu.","c) Hành vi này cần bị xử lí nghiêm theo pháp luật.","d) Tự do ngôn luận cho phép tung tin bịa đặt chia rẽ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lợi dụng tự do để chia rẽ là vi phạm.","points":1},{"type":"short","level":"VD","q":"Điền số: Quyền bình đẳng giữa các dân tộc được quy định tại Điều ... Hiến pháp 2013.","answer":"5","explain":"Điều 5.","points":0.5},{"type":"short","level":"VDC","q":"Bốn chữ tóm tắt quan hệ giữa các dân tộc: bình đẳng, đoàn kết, tôn trọng và ... (Điền 2 từ)","answer":"giúp đỡ","explain":"Giúp nhau cùng phát triển.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hành vi nào sau đây bị nghiêm cấm?","options":["A. Kì thị, chia rẽ dân tộc.","B. Giữ gìn bản sắc văn hoá.","C. Dùng tiếng dân tộc mình.","D. Đoàn kết các dân tộc."],"answer":"A","explain":"Nghiêm cấm kì thị, chia rẽ dân tộc.","points":0.25},{"type":"mcq","level":"NB","q":"Đồng bào dân tộc thiểu số có quyền","options":["A. dùng tiếng nói, chữ viết của dân tộc mình.","B. bị cấm dùng tiếng mẹ đẻ.","C. không được đi học.","D. bị phân biệt."],"answer":"A","explain":"Quyền giữ gìn bản sắc văn hoá, tiếng nói.","points":0.25},{"type":"mcq","level":"NB","q":"Đoàn kết dân tộc là","options":["A. truyền thống quý báu, sức mạnh của dân tộc Việt Nam.","B. việc không cần thiết.","C. gây chia rẽ.","D. chỉ là khẩu hiệu."],"answer":"A","explain":"Truyền thống dựng nước, giữ nước.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Nhà nước có chính sách ưu tiên vùng đồng bào dân tộc thiểu số?","options":["A. Vì vùng này còn khó khăn, cần hỗ trợ để cùng phát triển, không ai bị bỏ lại phía sau.","B. Vì thiên vị.","C. Vì vùng này giàu có.","D. Vì không cần thiết."],"answer":"A","explain":"Chính sách phát triển hài hoà.","points":0.25},{"type":"mcq","level":"TH","q":"Trách nhiệm của công dân trong quan hệ dân tộc là","options":["A. tôn trọng văn hoá các dân tộc, không kì thị, đoàn kết giúp đỡ.","B. kì thị dân tộc khác.","C. chia rẽ.","D. thờ ơ."],"answer":"A","explain":"Tôn trọng, đoàn kết, giúp đỡ.","points":0.25},{"type":"mcq","level":"VD","q":"Lớp em có bạn người dân tộc thiểu số mới chuyển đến, nói tiếng Kinh chưa sõi. Cả lớp nên","options":["A. trêu chọc.","B. giúp đỡ, động viên bạn hoà nhập.","C. xa lánh.","D. bắt bạn chuyển lớp."],"answer":"B","explain":"Đoàn kết, giúp đỡ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi dân tộc đều bình đẳng về chính trị, kinh tế, văn hoá.","b) Được giữ gìn bản sắc văn hoá dân tộc mình.","c) Nhà nước đầu tư cho vùng dân tộc thiểu số.","d) Kì thị dân tộc là việc riêng, không vi phạm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: vi phạm pháp luật.","points":1},{"type":"truefalse","level":"VDC","q":"Xã A có 3 dân tộc cùng sinh sống; chính quyền tổ chức ngày hội văn hoá các dân tộc, hỗ trợ vốn cho hộ nghèo không phân biệt dân tộc. Xét tính đúng, sai:","statements":["a) Đây là thực hiện tốt chính sách dân tộc.","b) Ngày hội văn hoá tăng cường đoàn kết.","c) Hỗ trợ không phân biệt dân tộc là bình đẳng.","d) Nên ưu tiên một dân tộc, bỏ qua các dân tộc khác."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Cộng đồng các dân tộc Việt Nam có bao nhiêu dân tộc? (Điền số)","answer":"54","explain":"54 dân tộc anh em.","points":0.5},{"type":"short","level":"VDC","q":"Hành vi miệt thị, ... rẽ dân tộc bị pháp luật nghiêm cấm. (Điền 2 từ: ... rẽ dân tộc)","answer":"chia rẽ","explain":"Nghiêm cấm kì thị, chia rẽ dân tộc.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Các dân tộc bình đẳng về","options":["A. mọi mặt: chính trị, kinh tế, văn hoá, xã hội.","B. chỉ về kinh tế.","C. chỉ về văn hoá.","D. không mặt nào."],"answer":"A","explain":"Bình đẳng toàn diện.","points":0.25},{"type":"mcq","level":"NB","q":"Để bảo tồn văn hoá các dân tộc, Nhà nước","options":["A. hỗ trợ giữ gìn lễ hội, tiếng nói, chữ viết.","B. cấm mọi lễ hội.","C. đồng hoá văn hoá.","D. không quan tâm."],"answer":"A","explain":"Bảo tồn bản sắc văn hoá.","points":0.25},{"type":"mcq","level":"NB","q":"Học sinh dân tộc thiểu số được","options":["A. miễn, giảm học phí, hỗ trợ học bổng.","B. cấm đi học.","C. học phí cao hơn.","D. phân biệt."],"answer":"A","explain":"Chính sách giáo dục ưu tiên.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao đoàn kết dân tộc là sức mạnh?","options":["A. Vì đã giúp dân tộc ta chiến thắng trong dựng nước, giữ nước.","B. Vì chỉ là khẩu hiệu.","C. Vì không cần thiết.","D. Vì gây chia rẽ."],"answer":"A","explain":"Truyền thống lịch sử.","points":0.25},{"type":"mcq","level":"TH","q":"Tôn trọng phong tục tập quán của dân tộc khác thể hiện","options":["A. sự tôn trọng, đoàn kết dân tộc.","B. sự yếu đuối.","C. không cần thiết.","D. mất bản sắc."],"answer":"A","explain":"Tôn trọng văn hoá các dân tộc.","points":0.25},{"type":"mcq","level":"VD","q":"Khi đi du lịch vùng cao, em nên","options":["A. tôn trọng phong tục địa phương, ứng xử văn minh.","B. chê bai phong tục.","C. xả rác bừa bãi.","D. kì thị người dân."],"answer":"A","explain":"Tôn trọng văn hoá bản địa.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đoàn kết dân tộc là truyền thống quý báu.","b) Nên tôn trọng phong tục các dân tộc.","c) Học sinh dân tộc thiểu số được hỗ trợ học tập.","d) Chỉ dân tộc Kinh mới có văn hoá."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mọi dân tộc đều có bản sắc văn hoá.","points":1},{"type":"truefalse","level":"VDC","q":"Trường nội trú vùng cao nuôi dạy 500 học sinh dân tộc thiểu số miễn phí; nhiều em đỗ đại học, về quê công tác. Xét tính đúng, sai:","statements":["a) Đây là chính sách giáo dục ưu tiên đúng đắn.","b) Đào tạo cán bộ người dân tộc thiểu số rất cần thiết.","c) Các em về quê công tác góp phần phát triển quê hương.","d) Đầu tư giáo dục vùng cao là lãng phí."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Các dân tộc bình đẳng, đoàn kết, ... trọng và giúp nhau cùng phát triển. (1 từ)","answer":"tôn","explain":"Tôn trọng.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: ... kết dân tộc là sức mạnh to lớn của dân tộc Việt Nam. (Điền 2 từ)","answer":"Đoàn kết","explain":"Đoàn kết dân tộc.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Mọi hành vi kì thị dân tộc đều","options":["A. bị pháp luật nghiêm cấm, xử lí.","B. được cho phép.","C. là việc riêng.","D. đáng khuyến khích."],"answer":"A","explain":"Nghiêm cấm theo Hiến pháp.","points":0.25},{"type":"mcq","level":"NB","q":"Để tìm hiểu văn hoá các dân tộc, em có thể","options":["A. đọc sách, tham gia lễ hội, giao lưu.","B. kì thị.","C. chê bai.","D. không quan tâm."],"answer":"A","explain":"Tìm hiểu để thêm yêu đất nước.","points":0.25},{"type":"mcq","level":"NB","q":"Chính sách dân tộc của Nhà nước nhằm","options":["A. các dân tộc cùng phát triển, không ai bị bỏ lại phía sau.","B. ưu tiên một dân tộc.","C. chia rẽ.","D. đồng hoá."],"answer":"A","explain":"Phát triển hài hoà.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải bảo tồn văn hoá các dân tộc thiểu số?","options":["A. Vì đó là di sản quý, làm phong phú văn hoá Việt Nam.","B. Vì không cần thiết.","C. Vì tốn kém.","D. Vì chỉ dân tộc Kinh cần văn hoá."],"answer":"A","explain":"Đa dạng văn hoá là tài sản.","points":0.25},{"type":"mcq","level":"TH","q":"Một người nói xấu dân tộc khác trên mạng xã hội. Đây là","options":["A. tự do ngôn luận.","B. hành vi kì thị, vi phạm pháp luật.","C. việc bình thường.","D. đáng khen."],"answer":"B","explain":"Kì thị trên mạng cũng vi phạm.","points":0.25},{"type":"mcq","level":"VD","q":"Trong ngày hội đại đoàn kết, khu phố tổ chức giao lưu văn hoá các dân tộc. Ý nghĩa là","options":["A. tăng cường hiểu biết, đoàn kết.","B. hình thức.","C. lãng phí.","D. không cần thiết."],"answer":"A","explain":"Giao lưu tăng đoàn kết.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kì thị dân tộc trên mạng cũng vi phạm pháp luật.","b) Bảo tồn văn hoá các dân tộc là cần thiết.","c) Giao lưu văn hoá tăng cường đoàn kết.","d) Chỉ cần quan tâm dân tộc mình."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần quan tâm, đoàn kết mọi dân tộc.","points":1},{"type":"truefalse","level":"VDC","q":"Sau bài học, lớp em kết nghĩa với lớp ở trường vùng cao: tặng sách, giao lưu trực tuyến, tìm hiểu văn hoá nhau. Xét tính đúng, sai:","statements":["a) Đây là hoạt động đoàn kết dân tộc thiết thực.","b) Giúp đỡ bạn vùng cao là trách nhiệm.","c) Tìm hiểu văn hoá nhau tăng hiểu biết.","d) Học sinh thành phố không cần quan tâm bạn vùng cao."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Hoàn thành: Nghiêm cấm mọi hành vi kì thị, ... rẽ dân tộc. (2 từ)","answer":"chia rẽ","explain":"Điều 5 Hiến pháp 2013.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại toàn bài: Các dân tộc Việt Nam bình đẳng, đoàn kết như anh em ... (Điền 2 từ)","answer":"một nhà","explain":"54 dân tộc anh em một nhà.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Quyền bầu cử, ứng cử của công dân","options":["A. không phân biệt dân tộc.","B. chỉ dân tộc Kinh.","C. chỉ dân tộc thiểu số.","D. phân biệt dân tộc."],"answer":"A","explain":"Bình đẳng về chính trị.","points":0.25},{"type":"mcq","level":"NB","q":"Cán bộ là người dân tộc thiểu số được Nhà nước","options":["A. ưu tiên đào tạo, tuyển dụng.","B. cấm làm cán bộ.","C. phân biệt.","D. không quan tâm."],"answer":"A","explain":"Chính sách cán bộ dân tộc.","points":0.25},{"type":"mcq","level":"NB","q":"Tiếng nói, chữ viết của các dân tộc","options":["A. được giữ gìn, sử dụng.","B. bị cấm.","C. bị xoá bỏ.","D. không quan trọng."],"answer":"A","explain":"Quyền văn hoá.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cần ưu tiên đào tạo cán bộ người dân tộc thiểu số?","options":["A. Vì họ hiểu địa phương, gần dân, làm tốt công tác dân tộc.","B. Vì thiên vị.","C. Vì không có người Kinh.","D. Vì hình thức."],"answer":"A","explain":"Cán bộ bản địa hiệu quả.","points":0.25},{"type":"mcq","level":"TH","q":"Một học sinh dân tộc thiểu số đỗ thủ khoa đại học. Điều này cho thấy","options":["A. chính sách giáo dục ưu tiên phát huy hiệu quả.","B. may mắn.","C. không liên quan chính sách.","D. bất công."],"answer":"A","explain":"Bình đẳng cơ hội giáo dục.","points":0.25},{"type":"mcq","level":"VD","q":"Em nghe người lớn nói xấu dân tộc khác. Em nên","options":["A. nghe theo.","B. không đồng tình, giải thích mọi dân tộc đều bình đẳng.","C. nói xấu theo.","D. im lặng đồng tình."],"answer":"B","explain":"Đấu tranh với định kiến.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Quyền bầu cử không phân biệt dân tộc.","b) Cán bộ dân tộc thiểu số được ưu tiên đào tạo.","c) Được giữ gìn tiếng nói dân tộc mình.","d) Nghe người lớn nói xấu dân tộc khác là đúng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần phản đối định kiến.","points":1},{"type":"truefalse","level":"VDC","q":"Anh Lò Văn Pá là người dân tộc Thái, được cử đi học rồi về làm cán bộ xã, giúp dân phát triển kinh tế, giữ gìn văn hoá Thái. Xét tính đúng, sai:","statements":["a) Đây là kết quả chính sách cán bộ dân tộc.","b) Cán bộ người địa phương gần dân, hiểu dân.","c) Vừa phát triển kinh tế vừa giữ văn hoá là đúng hướng.","d) Người dân tộc thiểu số không thể làm cán bộ tốt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: định kiến.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Mọi công dân không phân biệt dân tộc đều có quyền bầu cử và ... (Điền 2 từ)","answer":"ứng cử","explain":"Quyền bầu cử, ứng cử.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Nhà nước thực hiện chính sách ... đẳng giữa các dân tộc. (Điền 2 từ)","answer":"bình đẳng","explain":"Chính sách bình đẳng dân tộc.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Lễ hội truyền thống của các dân tộc","options":["A. được bảo tồn, phát huy.","B. bị cấm.","C. bị lãng quên là tốt.","D. không cần thiết."],"answer":"A","explain":"Bảo tồn văn hoá.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi chia rẽ dân tộc sẽ","options":["A. bị xử lí nghiêm theo pháp luật.","B. được khen thưởng.","C. không ai xử lí.","D. là việc riêng."],"answer":"A","explain":"Xử lí nghiêm.","points":0.25},{"type":"mcq","level":"NB","q":"Vùng đồng bào dân tộc thiểu số được Nhà nước","options":["A. đầu tư xây dựng hạ tầng, phát triển kinh tế.","B. bỏ mặc.","C. cấm đầu tư.","D. thu thuế cao."],"answer":"A","explain":"Đầu tư vùng khó khăn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao đầu tư hạ tầng vùng dân tộc thiểu số là thực hiện bình đẳng?","options":["A. Vì tạo điều kiện để đồng bào cùng phát triển như mọi miền.","B. Vì lãng phí.","C. Vì hình thức.","D. Vì không cần thiết."],"answer":"A","explain":"Bình đẳng thực chất.","points":0.25},{"type":"mcq","level":"TH","q":"Một bài báo ca ngợi tấm gương người dân tộc thiểu số vươn lên làm giàu. Bài báo","options":["A. tôn vinh, tăng cường đoàn kết.","B. kì thị.","C. chia rẽ.","D. không nên đăng."],"answer":"A","explain":"Tôn vinh gương tốt.","points":0.25},{"type":"mcq","level":"VD","q":"Trên đường đi học, em thấy khẩu hiệu 'Các dân tộc đoàn kết'. Em hiểu","options":["A. đó là chủ trương lớn của Đảng, Nhà nước.","B. chỉ là trang trí.","C. không liên quan.","D. gây chia rẽ."],"answer":"A","explain":"Đại đoàn kết dân tộc.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lễ hội các dân tộc được bảo tồn.","b) Chia rẽ dân tộc bị xử lí nghiêm.","c) Vùng dân tộc thiểu số được đầu tư hạ tầng.","d) Khẩu hiệu đoàn kết chỉ là trang trí."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: là chủ trương lớn.","points":1},{"type":"truefalse","level":"VDC","q":"Chương trình 'mỗi xã một sản phẩm' giúp đồng bào dân tộc thiểu số bán đặc sản, tăng thu nhập, giữ nghề truyền thống. Xét tính đúng, sai:","statements":["a) Đây là hỗ trợ phát triển kinh tế vùng dân tộc.","b) Giữ nghề truyền thống là bảo tồn văn hoá.","c) Tăng thu nhập giúp giảm nghèo bền vững.","d) Đồng bào dân tộc thiểu số không cần phát triển kinh tế."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Đại ... kết toàn dân tộc. (1 từ)","answer":"đoàn","explain":"Đại đoàn kết toàn dân tộc.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Bình đẳng dân tộc góp phần giữ vững ... định chính trị, phát triển đất nước. (Điền 2 từ)","answer":"ổn định","explain":"Ổn định chính trị.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Điều 5 Hiến pháp 2013 nghiêm cấm","options":["A. mọi hành vi kì thị, chia rẽ dân tộc.","B. giữ gìn văn hoá.","C. đoàn kết.","D. giúp đỡ nhau."],"answer":"A","explain":"Điều 5.","points":0.25},{"type":"mcq","level":"NB","q":"Người có hành vi kích động hận thù dân tộc","options":["A. bị xử lí theo pháp luật.","B. được bảo vệ.","C. không ai xử lí.","D. được khen."],"answer":"A","explain":"Xử lí nghiêm.","points":0.25},{"type":"mcq","level":"NB","q":"Học sinh có thể góp phần đoàn kết dân tộc bằng","options":["A. tôn trọng, giúp đỡ bạn dân tộc khác.","B. kì thị bạn.","C. trêu chọc bạn.","D. xa lánh bạn."],"answer":"A","explain":"Thực hành hằng ngày.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao học sinh cần tìm hiểu văn hoá các dân tộc?","options":["A. Vì thêm hiểu biết, yêu đất nước, tăng đoàn kết.","B. Vì để thi.","C. Vì không cần thiết.","D. Vì ép buộc."],"answer":"A","explain":"Hiểu biết tăng đoàn kết.","points":0.25},{"type":"mcq","level":"TH","q":"Một trường học có học sinh 5 dân tộc cùng học tập vui vẻ. Đây là","options":["A. môi trường đoàn kết, bình đẳng.","B. điều bất thường.","C. gây mâu thuẫn.","D. không nên."],"answer":"A","explain":"Đoàn kết trong trường học.","points":0.25},{"type":"mcq","level":"VD","q":"Khi viết bài về quê hương, em sẽ","options":["A. ca ngợi tình đoàn kết các dân tộc.","B. kì thị dân tộc khác.","C. chia rẽ.","D. không viết."],"answer":"A","explain":"Tuyên truyền đoàn kết.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kích động hận thù dân tộc bị xử lí.","b) Học sinh góp phần đoàn kết bằng tôn trọng bạn.","c) Trường nhiều dân tộc cùng học là tốt.","d) Nên viết bài kì thị dân tộc khác."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Bạn Minh làm video giới thiệu văn hoá dân tộc mình, được nhiều bạn dân tộc khác yêu thích, bình luận tích cực. Xét tính đúng, sai:","statements":["a) Đây là lan toả văn hoá, tăng đoàn kết.","b) Tôn trọng văn hoá nhau là biểu hiện bình đẳng.","c) Mạng xã hội có thể dùng để gắn kết dân tộc.","d) Chỉ nên giới thiệu văn hoá dân tộc mình cho người cùng dân tộc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chia sẻ rộng rãi càng tốt.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Tôn trọng, giúp đỡ bạn dân tộc khác là góp phần ... kết dân tộc. (Điền 2 từ)","answer":"đoàn kết","explain":"Đoàn kết dân tộc.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Mọi dân tộc đều là ... em trong đại gia đình Việt Nam. (Điền 2 từ)","answer":"anh em","explain":"54 dân tộc anh em.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Bình đẳng giữa các dân tộc là nguyên tắc","options":["A. cơ bản trong chính sách dân tộc của Việt Nam.","B. không quan trọng.","C. gây chia rẽ.","D. chỉ trên giấy."],"answer":"A","explain":"Nguyên tắc cơ bản.","points":0.25},{"type":"mcq","level":"NB","q":"Khi thấy hành vi kì thị dân tộc, công dân nên","options":["A. tố cáo với cơ quan chức năng.","B. im lặng.","C. hùa theo.","D. bỏ đi."],"answer":"A","explain":"Tố cáo vi phạm.","points":0.25},{"type":"mcq","level":"NB","q":"Chương trình xoá đói giảm nghèo ở vùng dân tộc thiểu số nhằm","options":["A. nâng cao đời sống đồng bào.","B. làm giàu cho cán bộ.","C. hình thức.","D. không cần thiết."],"answer":"A","explain":"Nâng cao đời sống.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao tố cáo hành vi kì thị dân tộc là trách nhiệm công dân?","options":["A. Vì bảo vệ đoàn kết, bình đẳng, ai cũng có trách nhiệm.","B. Vì để được thưởng.","C. Vì rảnh rỗi.","D. Vì không cần thiết."],"answer":"A","explain":"Trách nhiệm chung.","points":0.25},{"type":"mcq","level":"TH","q":"Một doanh nghiệp tuyển lao động là người dân tộc thiểu số với điều kiện như nhau. Đây là","options":["A. bình đẳng trong lao động, không phân biệt dân tộc.","B. thiên vị.","C. vi phạm.","D. không nên."],"answer":"A","explain":"Bình đẳng lao động.","points":0.25},{"type":"mcq","level":"VD","q":"Em sẽ giới thiệu với bạn bè về","options":["A. nét đẹp văn hoá các dân tộc Việt Nam.","B. định kiến dân tộc.","C. sự chia rẽ.","D. kì thị."],"answer":"A","explain":"Lan toả văn hoá.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bình đẳng dân tộc là nguyên tắc cơ bản.","b) Thấy kì thị nên tố cáo.","c) Tuyển dụng không phân biệt dân tộc.","d) Xoá đói giảm nghèo vùng dân tộc là không cần thiết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: rất cần thiết.","points":1},{"type":"truefalse","level":"VDC","q":"Huyện miền núi xây cầu, đường, trường học, trạm y tế; tỉ lệ hộ nghèo giảm một nửa sau 5 năm. Xét tính đúng, sai:","statements":["a) Đầu tư hạ tầng là thực hiện chính sách dân tộc.","b) Giảm nghèo thể hiện bình đẳng thực chất.","c) Cần tiếp tục đầu tư vùng khó khăn.","d) Vùng dân tộc thiểu số tự lo, không cần đầu tư."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Thấy hành vi kì thị dân tộc, công dân nên ... cáo. (Điền 2 từ)","answer":"tố cáo","explain":"Tố cáo vi phạm.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Chính sách dân tộc đúng đắn tạo nên sức mạnh ... đoàn kết toàn dân. (Điền 2 từ)","answer":"đại đoàn","explain":"Đại đoàn kết toàn dân tộc.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Cộng đồng các dân tộc Việt Nam","options":["A. đoàn kết như anh em một nhà.","B. tách biệt.","C. mâu thuẫn.","D. không liên quan."],"answer":"A","explain":"Anh em một nhà.","points":0.25},{"type":"mcq","level":"NB","q":"Để các dân tộc cùng phát triển, cần","options":["A. chính sách ưu tiên vùng khó khăn và sự nỗ lực của đồng bào.","B. chỉ chờ hỗ trợ.","C. bỏ mặc.","D. chia rẽ."],"answer":"A","explain":"Cả chính sách và nỗ lực.","points":0.25},{"type":"mcq","level":"NB","q":"Tôn trọng sự khác biệt văn hoá giữa các dân tộc là","options":["A. biểu hiện văn minh, đoàn kết.","B. yếu đuối.","C. mất bản sắc.","D. không cần thiết."],"answer":"A","explain":"Văn minh, đoàn kết.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa bình đẳng và đoàn kết dân tộc là","options":["A. bình đẳng là cơ sở, đoàn kết là sức mạnh.","B. mâu thuẫn.","C. không liên quan.","D. đối lập."],"answer":"A","explain":"Bình đẳng tạo đoàn kết.","points":0.25},{"type":"mcq","level":"TH","q":"Một lễ hội văn hoá có sự tham gia của nhiều dân tộc. Điều này","options":["A. làm phong phú văn hoá, gắn kết cộng đồng.","B. gây rối.","C. lãng phí.","D. không nên."],"answer":"A","explain":"Giao lưu văn hoá.","points":0.25},{"type":"mcq","level":"VD","q":"Trong bài thi, em viết về chính sách dân tộc với thái độ","options":["A. tự hào, trân trọng.","B. chê bai.","C. thờ ơ.","D. phản đối."],"answer":"A","explain":"Tự hào chính sách đúng đắn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Các dân tộc như anh em một nhà.","b) Bình đẳng là cơ sở của đoàn kết.","c) Lễ hội nhiều dân tộc gắn kết cộng đồng.","d) Chỉ cần phát triển, không cần đoàn kết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Tổng kết bài 11: Hiến pháp 2013 (Điều 5) ghi nhận; pháp luật nghiêm cấm kì thị, chia rẽ; Nhà nước có chính sách ưu tiên; công dân tôn trọng, đoàn kết. Xét tính đúng, sai:","statements":["a) Hệ thống pháp luật bảo đảm bình đẳng dân tộc.","b) Chính sách ưu tiên thể hiện quan tâm của Nhà nước.","c) Công dân có trách nhiệm giữ gìn đoàn kết.","d) Bình đẳng dân tộc chỉ là khẩu hiệu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Bình đẳng là cơ sở, đoàn kết là ... mạnh. (1 từ)","answer":"sức","explain":"Sức mạnh.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: 54 dân tộc anh em chung sống ... bình, cùng phát triển. (Điền 2 từ)","answer":"hoà bình","explain":"Chung sống hoà bình.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tóm lại, nội dung bài 11 gồm","options":["A. khái niệm, nội dung quyền, ý nghĩa, trách nhiệm công dân.","B. chỉ khái niệm.","C. chỉ ý nghĩa.","D. không có nội dung."],"answer":"A","explain":"Tổng kết bài.","points":0.25},{"type":"mcq","level":"NB","q":"Ý nghĩa lớn nhất của bình đẳng dân tộc là","options":["A. giữ vững đoàn kết, ổn định để phát triển đất nước.","B. tạo đặc quyền.","C. gây chia rẽ.","D. không có ý nghĩa."],"answer":"A","explain":"Đoàn kết, ổn định, phát triển.","points":0.25},{"type":"mcq","level":"NB","q":"Học xong bài 11, em sẽ","options":["A. tôn trọng, đoàn kết, giúp đỡ bạn các dân tộc.","B. kì thị bạn.","C. chia rẽ.","D. thờ ơ."],"answer":"A","explain":"Vận dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Bài 11 cụ thể hoá nguyên tắc nào của bài 9?","options":["A. Bình đẳng trước pháp luật vào quan hệ giữa các dân tộc.","B. Không liên quan.","C. Mâu thuẫn.","D. Trùng lặp."],"answer":"A","explain":"Cụ thể hoá.","points":0.25},{"type":"mcq","level":"TH","q":"Việt Nam được bạn bè quốc tế đánh giá cao về","options":["A. chính sách đoàn kết, bình đẳng dân tộc.","B. chia rẽ.","C. kì thị.","D. bất ổn."],"answer":"A","explain":"Uy tín quốc tế.","points":0.25},{"type":"mcq","level":"VD","q":"Em tự hào nhất về","options":["A. truyền thống đoàn kết 54 dân tộc anh em.","B. sự chia rẽ.","C. định kiến.","D. bất bình đẳng."],"answer":"A","explain":"Tự hào dân tộc.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bài 11 cụ thể hoá bài 9.","b) Chính sách dân tộc được quốc tế đánh giá cao.","c) Học sinh thực hành đoàn kết hằng ngày.","d) Đoàn kết dân tộc là việc của người lớn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mọi người.","points":1},{"type":"truefalse","level":"VDC","q":"Từ bài 9 đến bài 11, em thấy: bình đẳng là nguyên tắc chung; được cụ thể vào từng lĩnh vực, từng quan hệ xã hội. Xét tính đúng, sai:","statements":["a) Pháp luật Việt Nam là hệ thống thống nhất, nhất quán.","b) Nguyên tắc Hiến pháp được cụ thể bằng các luật.","c) Công dân thực hiện quyền trong đời sống hằng ngày.","d) Các bài học không liên quan nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Hoàn thành: Bài 11 cụ thể hoá quyền bình đẳng trước pháp luật vào quan hệ giữa các ... (Điền 2 từ)","answer":"dân tộc","explain":"Bình đẳng dân tộc.","points":0.5},{"type":"short","level":"VDC","q":"Khẩu hiệu: Các dân tộc bình đẳng, đoàn kết, ... trọng, giúp nhau cùng phát triển. (Điền 2 từ)","answer":"tôn trọng","explain":"Điều 5 Hiến pháp 2013.","points":0.5}]}]}</script>
