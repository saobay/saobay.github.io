<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Quyền bình đẳng giữa các tôn giáo có nghĩa là","options":["A. các tôn giáo bình đẳng trước pháp luật.","B. một tôn giáo được ưu tiên.","C. cấm mọi tôn giáo.","D. chỉ một tôn giáo được hoạt động."],"answer":"A","explain":"Bình đẳng trước pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Quyền tự do tín ngưỡng, tôn giáo được quy định tại điều nào của Hiến pháp 2013?","options":["A. Điều 24.","B. Điều 5.","C. Điều 16.","D. Điều 33."],"answer":"A","explain":"Điều 24 Hiến pháp 2013.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Hiến pháp, mọi người có quyền","options":["A. theo hoặc không theo một tôn giáo nào.","B. bắt buộc theo một tôn giáo.","C. cấm không theo tôn giáo.","D. bị ép theo đạo."],"answer":"A","explain":"Tự do theo hoặc không theo.","points":0.25},{"type":"mcq","level":"TH","q":"Hành vi nào sau đây vi phạm quyền tự do tín ngưỡng, tôn giáo?","options":["A. Ép buộc người khác phải theo đạo của mình.","B. Đi lễ chùa ngày rằm.","C. Đọc kinh tại nhà.","D. Tham gia lễ nhà thờ."],"answer":"A","explain":"Ép buộc vi phạm tự do tín ngưỡng.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà nước đối với hoạt động tôn giáo hợp pháp","options":["A. tôn trọng, bảo hộ và tạo điều kiện.","B. cấm đoán.","C. phân biệt.","D. không quan tâm."],"answer":"A","explain":"Tôn trọng, bảo hộ, tạo điều kiện.","points":0.25},{"type":"mcq","level":"VD","q":"Một người tung tin 'tận thế' để lôi kéo người dân nộp tiền 'giải hạn'. Đây là","options":["A. tự do tín ngưỡng.","B. mê tín dị đoan, lợi dụng tín ngưỡng để trục lợi — bị xử lí.","C. việc làm tốt.","D. đáng khuyến khích."],"answer":"B","explain":"Mê tín dị đoan bị xử lí.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Các tôn giáo bình đẳng trước pháp luật.","b) Mọi người có quyền theo hoặc không theo tôn giáo.","c) Nhà nước bảo hộ hoạt động tôn giáo hợp pháp.","d) Được ép buộc người khác theo đạo của mình."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ép buộc vi phạm.","points":1},{"type":"truefalse","level":"VDC","q":"Một nhóm tự xưng 'đạo lạ', tuyên truyền bỏ bàn thờ tổ tiên, nộp tiền để 'lên thiên đàng', gây mất đoàn kết thôn xóm. Xét tính đúng, sai:","statements":["a) Đây là lợi dụng tín ngưỡng, cần xử lí.","b) Người dân cần cảnh giác, không tham gia.","c) Chính quyền có trách nhiệm ngăn chặn.","d) Tự do tín ngưỡng cho phép mọi hoạt động như vậy."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lợi dụng, vi phạm pháp luật.","points":1},{"type":"short","level":"VD","q":"Điền số: Quyền tự do tín ngưỡng, tôn giáo được quy định tại Điều ... Hiến pháp 2013.","answer":"24","explain":"Điều 24.","points":0.5},{"type":"short","level":"VDC","q":"Luật quy định về tín ngưỡng, tôn giáo ở Việt Nam ban hành năm 2016 là Luật Tín ngưỡng, ... (Điền 2 từ)","answer":"tôn giáo","explain":"Luật Tín ngưỡng, tôn giáo năm 2016.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hành vi nào sau đây bị nghiêm cấm?","options":["A. Lợi dụng tôn giáo để vi phạm pháp luật.","B. Đi lễ theo tôn giáo của mình.","C. Giữ gìn tín ngưỡng dân gian.","D. Tôn trọng tôn giáo khác."],"answer":"A","explain":"Nghiêm cấm lợi dụng tôn giáo.","points":0.25},{"type":"mcq","level":"NB","q":"Phân biệt đối xử vì lí do tín ngưỡng, tôn giáo","options":["A. bị nghiêm cấm.","B. được cho phép.","C. là việc riêng.","D. đáng khuyến khích."],"answer":"A","explain":"Nghiêm cấm phân biệt.","points":0.25},{"type":"mcq","level":"NB","q":"Các tôn giáo ở Việt Nam","options":["A. chung sống hoà hợp, đồng hành cùng dân tộc.","B. mâu thuẫn.","C. bị cấm.","D. tách biệt."],"answer":"A","explain":"Hoà hợp, đồng hành.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Nhà nước bảo hộ hoạt động tôn giáo hợp pháp?","options":["A. Vì tôn trọng quyền con người, tạo đoàn kết, ổn định xã hội.","B. Vì thiên vị.","C. Vì ép buộc.","D. Vì hình thức."],"answer":"A","explain":"Quyền con người, đoàn kết.","points":0.25},{"type":"mcq","level":"TH","q":"Trách nhiệm của công dân về tín ngưỡng, tôn giáo là","options":["A. tôn trọng tín ngưỡng người khác, thực hiện đúng pháp luật.","B. kì thị tôn giáo khác.","C. lợi dụng tôn giáo.","D. mê tín dị đoan."],"answer":"A","explain":"Tôn trọng, đúng pháp luật.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn cùng lớp theo tôn giáo khác em. Em nên","options":["A. kì thị bạn.","B. tôn trọng, không trêu chọc niềm tin của bạn.","C. ép bạn bỏ đạo.","D. xa lánh bạn."],"answer":"B","explain":"Tôn trọng tín ngưỡng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lợi dụng tôn giáo để vi phạm pháp luật bị nghiêm cấm.","b) Phân biệt vì lí do tôn giáo bị nghiêm cấm.","c) Công dân tôn trọng tín ngưỡng người khác.","d) Mê tín dị đoan là việc riêng, không ai xử lí."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bị xử lí.","points":1},{"type":"truefalse","level":"VDC","q":"Xã B có chùa, nhà thờ cùng hoạt động; bà con các tôn giáo giúp nhau khi khó khăn, cùng tham gia từ thiện. Xét tính đúng, sai:","statements":["a) Đây là đoàn kết tôn giáo tốt đẹp.","b) Các tôn giáo đồng hành cùng cộng đồng.","c) Tôn trọng lẫn nhau tạo ổn định.","d) Các tôn giáo nên cạnh tranh, mâu thuẫn nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Mọi người có quyền tự do tín ngưỡng, tôn giáo, theo hoặc ... theo một tôn giáo nào. (2 từ)","answer":"không theo","explain":"Theo hoặc không theo.","points":0.5},{"type":"short","level":"VDC","q":"Hành vi bói toán lừa đảo, cúng bái trục lợi gọi là mê tín ... (Điền 2 từ)","answer":"dị đoan","explain":"Mê tín dị đoan — bị xử lí.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Không ai được","options":["A. ép buộc người khác theo hay từ bỏ tôn giáo.","B. theo tôn giáo mình thích.","C. không theo tôn giáo nào.","D. tôn trọng tôn giáo khác."],"answer":"A","explain":"Ép buộc vi phạm.","points":0.25},{"type":"mcq","level":"NB","q":"Luật Tín ngưỡng, tôn giáo ban hành năm","options":["A. 2016.","B. 2014.","C. 2019.","D. 2013."],"answer":"A","explain":"Năm 2016.","points":0.25},{"type":"mcq","level":"NB","q":"Cơ sở thờ tự của các tôn giáo được xây dựng","options":["A. theo quy định của pháp luật.","B. tuỳ ý, không cần phép.","C. bị cấm xây.","D. chỉ một tôn giáo được xây."],"answer":"A","explain":"Theo quy định pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải nghiêm cấm lợi dụng tôn giáo?","options":["A. Vì xâm phạm lợi ích Nhà nước, quyền người khác, gây mất ổn định.","B. Vì tôn giáo xấu.","C. Vì không cần thiết.","D. Vì cấm tôn giáo."],"answer":"A","explain":"Bảo vệ lợi ích chung.","points":0.25},{"type":"mcq","level":"TH","q":"Một người theo đạo và một người không theo đạo cùng ứng tuyển việc làm. Nhà tuyển dụng","options":["A. xét theo năng lực, không phân biệt tôn giáo.","B. chỉ nhận người theo đạo.","C. chỉ nhận người không theo đạo.","D. loại cả hai."],"answer":"A","explain":"Không phân biệt tôn giáo.","points":0.25},{"type":"mcq","level":"VD","q":"Thấy người lạ rủ tham gia 'đạo' mới với lời hứa chữa bách bệnh, em nên","options":["A. tham gia ngay.","B. cảnh giác, không tin, báo người lớn.","C. nộp tiền.","D. rủ bạn cùng tham gia."],"answer":"B","explain":"Cảnh giác 'đạo lạ', mê tín.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Không được ép buộc người khác theo hay bỏ đạo.","b) Tuyển dụng không phân biệt tôn giáo.","c) Cơ sở thờ tự xây theo quy định pháp luật.","d) 'Đạo lạ' chữa bách bệnh là đáng tin."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lừa đảo.","points":1},{"type":"truefalse","level":"VDC","q":"Ông Ba tổ chức 'lễ giải hạn' thu mỗi người 5 triệu đồng, ai không nộp thì doạ 'tai hoạ'. Xét tính đúng, sai:","statements":["a) Đây là mê tín dị đoan, trục lợi.","b) Doạ dẫm để thu tiền là vi phạm pháp luật.","c) Người dân nên tố cáo hành vi này.","d) Nộp tiền 'giải hạn' là thực hiện tín ngưỡng đúng đắn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mê tín, bị lợi dụng.","points":1},{"type":"short","level":"VD","q":"Điền số: Luật Tín ngưỡng, tôn giáo ban hành năm ...","answer":"2016","explain":"Năm 2016.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Nghiêm cấm ... dụng tín ngưỡng, tôn giáo để vi phạm pháp luật. (Điền 2 từ)","answer":"lợi dụng","explain":"Nghiêm cấm lợi dụng.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Ý nghĩa của bình đẳng tôn giáo là","options":["A. đoàn kết tôn giáo, ổn định xã hội.","B. gây mâu thuẫn.","C. chia rẽ.","D. không có ý nghĩa."],"answer":"A","explain":"Đoàn kết, ổn định.","points":0.25},{"type":"mcq","level":"NB","q":"Các tôn giáo ở Việt Nam","options":["A. đồng hành cùng dân tộc.","B. chống đối.","C. tách biệt.","D. bị cấm."],"answer":"A","explain":"Đồng hành cùng dân tộc.","points":0.25},{"type":"mcq","level":"NB","q":"Khi thực hiện tín ngưỡng, công dân phải","options":["A. đúng pháp luật, phù hợp thuần phong mĩ tục.","B. tuỳ ý.","C. vi phạm pháp luật.","D. mê tín."],"answer":"A","explain":"Đúng pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các tôn giáo cần đồng hành cùng dân tộc?","options":["A. Vì cùng chung lợi ích xây dựng, bảo vệ đất nước.","B. Vì ép buộc.","C. Vì không cần thiết.","D. Vì mâu thuẫn."],"answer":"A","explain":"Đồng hành vì lợi ích chung.","points":0.25},{"type":"mcq","level":"TH","q":"Một chức sắc tôn giáo vận động tín đồ làm từ thiện, giúp người nghèo. Đây là","options":["A. hoạt động tốt đẹp, đáng khuyến khích.","B. lợi dụng.","C. vi phạm.","D. mê tín."],"answer":"A","explain":"Từ thiện là tốt đẹp.","points":0.25},{"type":"mcq","level":"VD","q":"Trong dịp lễ của tôn giáo bạn, em","options":["A. chúc mừng, tôn trọng.","B. chê bai.","C. phá rối.","D. kì thị."],"answer":"A","explain":"Tôn trọng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bình đẳng tôn giáo tạo đoàn kết, ổn định.","b) Tôn giáo đồng hành cùng dân tộc.","c) Từ thiện của tôn giáo đáng khuyến khích.","d) Nên chê bai lễ của tôn giáo khác."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Lớp em có bạn theo đạo Phật, bạn theo Công giáo, bạn không theo đạo nào; mọi người vẫn chơi thân, tôn trọng nhau. Xét tính đúng, sai:","statements":["a) Đây là bình đẳng, đoàn kết tôn giáo trong lớp học.","b) Khác nhau về tín ngưỡng vẫn có thể là bạn tốt.","c) Tôn trọng niềm tin của bạn là văn minh.","d) Nên chia bè theo tôn giáo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Thực hiện tín ngưỡng phải đúng pháp luật, phù hợp thuần phong ... tục. (Điền 2 từ)","answer":"mĩ tục","explain":"Thuần phong mĩ tục.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Các tôn giáo ở Việt Nam chung sống hoà hợp, ... hành cùng dân tộc. (Điền 2 từ)","answer":"đồng hành","explain":"Đồng hành cùng dân tộc.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Tín ngưỡng dân gian của Việt Nam như thờ cúng tổ tiên","options":["A. được tôn trọng, giữ gìn.","B. bị cấm.","C. bị coi là mê tín.","D. không được thực hiện."],"answer":"A","explain":"Tôn trọng tín ngưỡng dân gian.","points":0.25},{"type":"mcq","level":"NB","q":"Thờ cúng tổ tiên thể hiện","options":["A. đạo lí uống nước nhớ nguồn.","B. mê tín dị đoan.","C. vi phạm.","D. lạc hậu."],"answer":"A","explain":"Truyền thống tốt đẹp.","points":0.25},{"type":"mcq","level":"NB","q":"Người có hành vi xúc phạm cơ sở thờ tự","options":["A. bị xử lí theo pháp luật.","B. được khen.","C. không ai xử lí.","D. là việc riêng."],"answer":"A","explain":"Xúc phạm bị xử lí.","points":0.25},{"type":"mcq","level":"TH","q":"Phân biệt thờ cúng tổ tiên với mê tín dị đoan ở điểm","options":["A. thờ cúng là truyền thống tốt đẹp; mê tín là lợi dụng để lừa đảo, trục lợi.","B. giống nhau.","C. đều bị cấm.","D. đều là mê tín."],"answer":"A","explain":"Phân biệt rõ.","points":0.25},{"type":"mcq","level":"TH","q":"Một người không theo tôn giáo nào nhưng sống tốt, giúp đỡ mọi người. Người này","options":["A. vẫn được tôn trọng như mọi công dân.","B. bị khinh thường.","C. vi phạm.","D. phải theo một đạo."],"answer":"A","explain":"Quyền không theo tôn giáo.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình em thờ cúng tổ tiên trang nghiêm, không đốt vàng mã lãng phí. Đây là","options":["A. giữ gìn truyền thống một cách văn minh.","B. mê tín.","C. vi phạm.","D. lạc hậu."],"answer":"A","explain":"Truyền thống văn minh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thờ cúng tổ tiên được tôn trọng.","b) Không theo tôn giáo nào vẫn được tôn trọng.","c) Xúc phạm cơ sở thờ tự bị xử lí.","d) Thờ cúng tổ tiên là mê tín dị đoan."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: là truyền thống tốt đẹp.","points":1},{"type":"truefalse","level":"VDC","q":"Dịp lễ Vu Lan, chùa tổ chức tặng quà người nghèo; nhà thờ tổ chức hiến máu nhân đạo. Xét tính đúng, sai:","statements":["a) Đây là hoạt động nhân đạo tốt đẹp.","b) Tôn giáo đóng góp tích cực cho xã hội.","c) Các tôn giáo cùng hướng đến điều thiện.","d) Hoạt động từ thiện của tôn giáo nên bị cấm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Thờ cúng tổ tiên thể hiện đạo lí uống nước nhớ ... (1 từ)","answer":"nguồn","explain":"Uống nước nhớ nguồn.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Mọi người có quyền tự do tín ngưỡng, ... giáo. (Điền 2 từ)","answer":"tôn giáo","explain":"Tự do tín ngưỡng, tôn giáo.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Chức sắc, tín đồ các tôn giáo","options":["A. bình đẳng về quyền và nghĩa vụ công dân.","B. được miễn nghĩa vụ.","C. có đặc quyền.","D. bị hạn chế quyền."],"answer":"A","explain":"Bình đẳng quyền, nghĩa vụ.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức tôn giáo hoạt động","options":["A. theo Hiến pháp và pháp luật.","B. ngoài pháp luật.","C. tuỳ ý.","D. chống pháp luật."],"answer":"A","explain":"Theo pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Khi thấy hành vi lợi dụng tôn giáo để lừa đảo, em nên","options":["A. tố cáo với chính quyền.","B. im lặng.","C. tham gia.","D. rủ bạn tham gia."],"answer":"A","explain":"Tố cáo.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao tín đồ tôn giáo vẫn phải thực hiện nghĩa vụ công dân?","options":["A. Vì mọi công dân đều bình đẳng về quyền và nghĩa vụ.","B. Vì bị ép.","C. Vì không cần thiết.","D. Vì tôn giáo yêu cầu."],"answer":"A","explain":"Bình đẳng quyền, nghĩa vụ.","points":0.25},{"type":"mcq","level":"TH","q":"Một linh mục vận động giáo dân chấp hành pháp luật, bảo vệ môi trường. Đây là","options":["A. gương tốt, đáng khen.","B. lợi dụng.","C. vi phạm.","D. không nên."],"answer":"A","explain":"Đồng hành cùng dân tộc.","points":0.25},{"type":"mcq","level":"VD","q":"Em sẽ tuyên truyền về","options":["A. sống tốt đời, đẹp đạo; tôn trọng các tôn giáo.","B. kì thị tôn giáo.","C. mê tín.","D. chia rẽ."],"answer":"A","explain":"Tuyên truyền đúng đắn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tín đồ các tôn giáo bình đẳng về quyền, nghĩa vụ.","b) Tổ chức tôn giáo hoạt động theo pháp luật.","c) Thấy lừa đảo lợi dụng tôn giáo nên tố cáo.","d) Tín đồ được miễn mọi nghĩa vụ công dân."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Cụm từ 'sống tốt đời, đẹp đạo' được nhiều tôn giáo hưởng ứng; tín đồ vừa tu hành vừa tham gia xây dựng quê hương. Xét tính đúng, sai:","statements":["a) Đây là tinh thần đồng hành cùng dân tộc.","b) Tôn giáo và đời sống xã hội hài hoà.","c) Tín đồ góp phần xây dựng quê hương.","d) Tôn giáo nên tách khỏi đời sống xã hội."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Tín đồ các tôn giáo bình đẳng về quyền và ... vụ công dân. (Điền 2 từ)","answer":"nghĩa vụ","explain":"Quyền và nghĩa vụ.","points":0.5},{"type":"short","level":"VDC","q":"Khẩu hiệu: Sống tốt đời, đẹp ... (1 từ)","answer":"đạo","explain":"Sống tốt đời, đẹp đạo.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Điều 24 Hiến pháp 2013 khẳng định","options":["A. quyền tự do tín ngưỡng, tôn giáo.","B. cấm tôn giáo.","C. một quốc đạo.","D. ép theo đạo."],"answer":"A","explain":"Điều 24.","points":0.25},{"type":"mcq","level":"NB","q":"Việt Nam KHÔNG có","options":["A. quốc đạo.","B. Phật giáo.","C. Công giáo.","D. tín ngưỡng dân gian."],"answer":"A","explain":"Không có quốc đạo; các tôn giáo bình đẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Học sinh thực hiện quyền tự do tín ngưỡng bằng cách","options":["A. tôn trọng niềm tin của bạn bè.","B. ép bạn theo đạo.","C. kì thị bạn.","D. mê tín."],"answer":"A","explain":"Tôn trọng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Việt Nam không quy định quốc đạo?","options":["A. Vì các tôn giáo bình đẳng, không tôn giáo nào được ưu tiên.","B. Vì cấm tôn giáo.","C. Vì không có tôn giáo.","D. Vì không quan tâm."],"answer":"A","explain":"Bình đẳng tôn giáo.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn bị ép phải theo đạo của gia đình dù không muốn. Bạn nên","options":["A. chấp nhận.","B. trao đổi với gia đình, nhờ pháp luật bảo vệ quyền tự do.","C. bỏ nhà đi.","D. im lặng chịu đựng."],"answer":"B","explain":"Bảo vệ quyền tự do tín ngưỡng.","points":0.25},{"type":"mcq","level":"VD","q":"Trên mạng xã hội, em thấy người xúc phạm tôn giáo của bạn. Em","options":["A. hùa theo.","B. không đồng tình, báo cáo nội dung xúc phạm.","C. chia sẻ.","D. im lặng."],"answer":"B","explain":"Bảo vệ, tôn trọng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Việt Nam không có quốc đạo.","b) Bị ép theo đạo có thể nhờ pháp luật bảo vệ.","c) Xúc phạm tôn giáo trên mạng là sai.","d) Phải ép mọi người theo một đạo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Chị Hoa theo đạo Phật, anh Minh theo Công giáo; hai người tôn trọng nhau, cùng làm từ thiện, gia đình hạnh phúc. Xét tính đúng, sai:","statements":["a) Khác tôn giáo vẫn có thể hạnh phúc.","b) Tôn trọng niềm tin của nhau là quan trọng.","c) Cùng làm việc thiện gắn kết tình cảm.","d) Khác tôn giáo thì không thể chung sống."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: định kiến.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Việt Nam không quy định ... đạo. (1 từ)","answer":"quốc","explain":"Không có quốc đạo.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Không ai được ... buộc người khác theo hay từ bỏ tôn giáo. (Điền 2 từ)","answer":"ép buộc","explain":"Nghiêm cấm ép buộc.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Tôn giáo nào sau đây có ở Việt Nam?","options":["A. Phật giáo.","B. Không có tôn giáo nào.","C. Chỉ một tôn giáo.","D. Tôn giáo bị cấm hết."],"answer":"A","explain":"Nhiều tôn giáo cùng tồn tại.","points":0.25},{"type":"mcq","level":"NB","q":"Để hoạt động tôn giáo lành mạnh, cần","options":["A. tuân thủ pháp luật.","B. vi phạm pháp luật.","C. mê tín.","D. lợi dụng."],"answer":"A","explain":"Theo pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Đấu tranh với mê tín dị đoan là trách nhiệm của","options":["A. mọi công dân.","B. chỉ nhà chùa.","C. chỉ nhà thờ.","D. không ai."],"answer":"A","explain":"Trách nhiệm chung.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao mê tín dị đoan gây hại?","options":["A. Vì lừa đảo tiền bạc, gây hoang mang, mất ổn định.","B. Vì mang lại may mắn.","C. Vì tốt đẹp.","D. Vì không ảnh hưởng."],"answer":"A","explain":"Tác hại mê tín.","points":0.25},{"type":"mcq","level":"TH","q":"Một người đi xem bói, thầy bói phán phải nộp 10 triệu 'cúng sao'. Người này nên","options":["A. nộp ngay.","B. không tin, đó là lừa đảo.","C. vay tiền nộp.","D. rủ cả nhà nộp."],"answer":"B","explain":"Cảnh giác lừa đảo.","points":0.25},{"type":"mcq","level":"VD","q":"Em sẽ khuyên người thân","options":["A. tin vào bói toán.","B. sống lành mạnh, không mê tín dị đoan.","C. nộp tiền giải hạn.","D. sợ hãi ma quỷ."],"answer":"B","explain":"Bài trừ mê tín.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hoạt động tôn giáo phải tuân thủ pháp luật.","b) Mê tín dị đoan gây hại cho xã hội.","c) Mọi công dân đấu tranh với mê tín.","d) Xem bói nộp tiền 'cúng sao' là nên làm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lừa đảo.","points":1},{"type":"truefalse","level":"VDC","q":"Bà Tư nghe lời 'thầy' bán hết tài sản để 'dâng cúng', gia đình tan nát. Xét tính đúng, sai:","statements":["a) Đây là hậu quả của mê tín dị đoan.","b) Kẻ lợi dụng cần bị xử lí.","c) Gia đình, xã hội cần tuyên truyền bài trừ mê tín.","d) Mê tín dị đoan không gây hại gì."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Bài trừ mê tín ... đoan là trách nhiệm mọi công dân. (Điền 2 từ)","answer":"dị đoan","explain":"Mê tín dị đoan.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Tín ngưỡng lành mạnh khác mê tín ở chỗ không ... đảo, trục lợi. (Điền 2 từ)","answer":"lừa đảo","explain":"Không lừa đảo, trục lợi.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Chính sách tôn giáo của Việt Nam được quốc tế","options":["A. ghi nhận, đánh giá tích cực.","B. phản đối.","C. không quan tâm.","D. lên án."],"answer":"A","explain":"Uy tín quốc tế.","points":0.25},{"type":"mcq","level":"NB","q":"Đoàn kết tôn giáo góp phần","options":["A. ổn định, phát triển đất nước.","B. gây rối.","C. chia rẽ.","D. bất ổn."],"answer":"A","explain":"Ổn định, phát triển.","points":0.25},{"type":"mcq","level":"NB","q":"Tóm lại, quyền bình đẳng giữa các tôn giáo là","options":["A. cụ thể hoá bình đẳng trước pháp luật.","B. đặc quyền.","C. phân biệt.","D. không quan trọng."],"answer":"A","explain":"Cụ thể hoá bài 9.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa bài 9 và bài 12 là","options":["A. bài 12 cụ thể hoá bài 9 vào lĩnh vực tôn giáo.","B. không liên quan.","C. mâu thuẫn.","D. trùng lặp."],"answer":"A","explain":"Cụ thể hoá.","points":0.25},{"type":"mcq","level":"TH","q":"Một đất nước thực hiện tốt bình đẳng tôn giáo sẽ","options":["A. hoà hợp, ổn định.","B. xung đột.","C. chia rẽ.","D. bất ổn."],"answer":"A","explain":"Hoà hợp.","points":0.25},{"type":"mcq","level":"VD","q":"Em tự hào về","options":["A. chính sách tôn giáo đúng đắn của Việt Nam.","B. mê tín.","C. chia rẽ.","D. kì thị."],"answer":"A","explain":"Tự hào.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chính sách tôn giáo được quốc tế ghi nhận.","b) Bài 12 cụ thể hoá bài 9.","c) Đoàn kết tôn giáo tạo ổn định.","d) Bình đẳng tôn giáo gây xung đột."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Tổng kết: Hiến pháp 2013 (Điều 24), Luật Tín ngưỡng, tôn giáo 2016 bảo đảm quyền; Nhà nước tôn trọng, bảo hộ; công dân thực hiện đúng pháp luật. Xét tính đúng, sai:","statements":["a) Hệ thống pháp luật đầy đủ về tôn giáo.","b) Nhà nước tạo điều kiện cho tôn giáo hợp pháp.","c) Công dân có trách nhiệm thực hiện đúng pháp luật.","d) Pháp luật Việt Nam cấm tự do tôn giáo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Đoàn kết tôn giáo góp phần ổn ... đất nước. (1 từ)","answer":"định","explain":"Ổn định.","points":0.5},{"type":"short","level":"VDC","q":"Tóm lại: Bình đẳng tôn giáo là chính sách ... đắn của Nhà nước ta. (Điền 2 từ)","answer":"đúng đắn","explain":"Chính sách đúng đắn.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Học xong bài 12, em sẽ","options":["A. tôn trọng các tôn giáo, bài trừ mê tín.","B. kì thị tôn giáo.","C. mê tín.","D. lợi dụng tôn giáo."],"answer":"A","explain":"Vận dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Nội dung bài 12 gồm","options":["A. khái niệm, nội dung quyền, ý nghĩa, trách nhiệm.","B. chỉ khái niệm.","C. chỉ ý nghĩa.","D. không có nội dung."],"answer":"A","explain":"Tổng kết.","points":0.25},{"type":"mcq","level":"NB","q":"Quyền tự do tín ngưỡng, tôn giáo là quyền","options":["A. cơ bản của công dân.","B. đặc quyền.","C. không quan trọng.","D. bị hạn chế."],"answer":"A","explain":"Quyền cơ bản.","points":0.25},{"type":"mcq","level":"TH","q":"Từ bài 9 đến bài 12, điểm chung là","options":["A. cụ thể hoá bình đẳng trước pháp luật vào từng lĩnh vực.","B. không liên quan.","C. mâu thuẫn.","D. trùng lặp."],"answer":"A","explain":"Cụ thể hoá.","points":0.25},{"type":"mcq","level":"TH","q":"Xã hội thực hiện tốt bình đẳng các lĩnh vực sẽ","options":["A. công bằng, văn minh.","B. bất công.","C. lạc hậu.","D. chia rẽ."],"answer":"A","explain":"Công bằng, văn minh.","points":0.25},{"type":"mcq","level":"VD","q":"Em sẽ vận dụng bài học vào","options":["A. đời sống: tôn trọng, đoàn kết, đúng pháp luật.","B. chỉ để thi.","C. không vận dụng.","D. kì thị."],"answer":"A","explain":"Vận dụng thực tế.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tự do tín ngưỡng là quyền cơ bản.","b) Các bài 9–12 cùng cụ thể hoá bình đẳng.","c) Học sinh vận dụng vào đời sống.","d) Tôn giáo là việc của người lớn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mọi người tôn trọng.","points":1},{"type":"truefalse","level":"VDC","q":"Từ bài 9 đến bài 12, em rút ra: pháp luật là hệ thống thống nhất; quyền bình đẳng được cụ thể vào mọi lĩnh vực đời sống. Xét tính đúng, sai:","statements":["a) Pháp luật Việt Nam nhất quán, thống nhất.","b) Hiến pháp là cơ sở, các luật cụ thể hoá.","c) Công dân thực hiện quyền hằng ngày.","d) Các bài học rời rạc, không hệ thống."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Hoàn thành: Tự do tín ngưỡng, tôn giáo là quyền ... bản của công dân. (Điền 2 từ)","answer":"cơ bản","explain":"Quyền cơ bản.","points":0.5},{"type":"short","level":"VDC","q":"Khẩu hiệu: Các tôn giáo bình đẳng, ... kết, đồng hành cùng dân tộc. (Điền 2 từ)","answer":"đoàn kết","explain":"Đoàn kết tôn giáo.","points":0.5}]}]}</script>
