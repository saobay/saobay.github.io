 finished ___ at 9 p.m.","answer":"studying","explain":"Sau finish dùng V-ing: studying."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Viet Nam's ___ in ASEAN is important. (contribute)","answer":"contribution","explain":"Sau sở hữu cần danh từ: contribution (sự đóng góp)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). The ASEAN Youth Volunteer Programme lets young people help communities across Southeast Asia. Volunteers teach English, plant trees and care for the elderly. They also learn about different cultures. Many volunteers say the programme changes their lives.","statements":["The programme is for young people.","Volunteers teach and plant trees.","Volunteers learn about cultures.","The programme never changes lives."],"answer":["T","T","T","F"],"explain":"Nhiều tình nguyện viên nói chương trình đã thay đổi cuộc đời họ."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"Hello, everyone. I am Minh from Viet Nam. I am attending the ASEAN student forum in Singapore. There are 50 students from ten countries here. We are discussing how to protect the environment together.","sub_questions":[{"q":"Where is Minh?","options":["A. In Viet Nam.","B. In Singapore.","C. In Thailand.","D. In Japan."],"answer":"B"},{"q":"What are they discussing?","options":["A. Sports.","B. Protecting the environment.","C. Music.","D. Food."],"answer":"B"}],"explain":"Minh dự diễn đàn học sinh ASEAN ở Singapore, bàn về bảo vệ môi trường."}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. propose","B. dominate","C. motto","D. bloc"],"answer":"A","explain":"Chữ 'o' trong propose đọc là /əʊ/, còn trong dominate, motto, bloc đọc là /ɒ/."},{"type":"mcq","level":"TH","points":0.25,"q" the word in brackets: She is an active ___ in the club. (participate)","answer":"participant","explain":"Sau active cần danh từ chỉ người: participant (thành viên tham gia)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Viet Nam has hosted many ASEAN summits. In 2020, Viet Nam was the ASEAN Chair and organised online meetings during the pandemic. Vietnamese leaders proposed ideas for regional cooperation. These efforts raised Viet Nam's position in ASEAN.","statements":["Viet Nam has hosted ASEAN summits.","Viet Nam was ASEAN Chair in 2020.","Meetings were online during the pandemic.","Viet Nam proposed cooperation ideas."],"answer":["T","T","T","T"],"explain":"Tất cả các ý đều đúng theo đoạn văn."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"A: What does your ASEAN project do, Hoa? B: We collect old books for poor students in Laos. A: How can I join? B: You can donate books or become a volunteer. A: I will donate ten books tomorrow.","sub_questions":[{"q":"What does Hoa's project do?","options":["A. Builds schools.","B. Collects old books for poor students.","C. Plants trees.","D. Teaches English."],"answer":"B"},{"q":"How many books will the boy donate?","options":["A. Five.","B. Ten.","C. Twenty.","D. Fifty."],"answer":"B"}],"explain":"Dự án thu gom sách cũ cho học sinh nghèo Lào; bạn nam sẽ tặng 10 cuốn."}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'u' is pronounced differently from the others.","options":["A. summit","B. study","C. must","D. future"],"answer":"D","explain":"Chữ 'u' trong future đọc là /uː/, còn trong summit, study, must đọc là /ʌ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'ch' are pronounced differently from the others.","options":["A. change","B. charter","C. school","D. teach"],"answer sed everyone. (propose)","answer":"proposal","explain":"Sau the cần danh từ: proposal (đề xuất)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). ASEAN scholarships help students study in other member states. Each year, hundreds of Vietnamese students receive scholarships to study in Singapore, Thailand and Malaysia. They learn new skills and make international friends. After graduating, many return home to work.","statements":["ASEAN scholarships help students study abroad.","Vietnamese students study in Singapore and Thailand.","Students make international friends.","Graduates never return home."],"answer":["T","T","T","F"],"explain":"Nhiều sinh viên trở về nước làm việc sau khi tốt nghiệp."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"Good afternoon. Our ASEAN food festival starts at 9 a.m. tomorrow. There will be dishes from ten countries. Vietnamese pho and Thai tom yum are the most popular. Entrance tickets are free for students.","sub_questions":[{"q":"When does the food festival start?","options":["A. At 9 a.m. tomorrow.","B. At 9 p.m. today.","C. Next week.","D. Yesterday."],"answer":"A"},{"q":"Which dishes are most popular?","options":["A. Sushi and kimchi.","B. Pho and tom yum.","C. Pizza and pasta.","D. Bread and cheese."],"answer":"B"}],"explain":"Lễ hội ẩm thực bắt đầu 9 giờ sáng mai; phở và tom yum được yêu thích nhất."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'e' is pronounced differently from the others.","options":["A. me","B. represent","C. get","D. member"],"answer":"A","explain":"Chữ 'e' trong me đọc là /iː/, còn trong represent, get, member đọc là /e/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. bloc","B. motto","C. propose","D.
