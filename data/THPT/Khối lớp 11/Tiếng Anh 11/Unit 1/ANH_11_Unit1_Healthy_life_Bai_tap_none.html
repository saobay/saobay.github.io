n thoại khuya."}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. habit","B. balance","C. active","D. stay"],"answer":"D","explain":"Chữ 'a' trong stay đọc là /eɪ/, còn trong habit, balance, active đọc là /æ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'ea' are pronounced differently from the others.","options":["A. healthy","B. headache","C. spread","D. treatment"],"answer":"D","explain":"'ea' trong treatment đọc là /iː/, còn trong healthy, headache, spread đọc là /e/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. vitamin","B. infection","C. habit","D. diet"],"answer":"B","explain":"infection nhấn âm 2 /ɪnˈfekʃn/, còn vitamin, habit, diet nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"She goes jogging every morning to stay ___.","options":["A. fit","B. ill","C. tired","D. sick"],"answer":"A","explain":"stay fit là giữ dáng, khỏe mạnh."},{"type":"mcq","level":"TH","points":0.25,"q":"He ___ ill yesterday, so he stayed at home.","options":["A. is","B. was","C. has been","D. will be"],"answer":"B","explain":"Có yesterday nên dùng quá khứ đơn của be: was."},{"type":"mcq","level":"TH","points":0.25,"q":"Doctors advise us to ___ down on sugar to avoid obesity.","options":["A. cut","B. take","C. put","D. turn"],"answer":"A","explain":"cut down on là cắt giảm — cụm từ đúng."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["diet","chế độ ăn"],["habit","thói quen"],["take up","bắt đầu"],["regular","đều đặn"],["disease","bệnh tật"]],"explain":"diet: chế độ ăn; habit: thói quen; take up: bắt đầu; regular: đều đặn; disease: bệnh tật."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["We","just ame":"Đề 5","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letters 'oo' are pronounced differently from the others.","options":["A. food","B. good","C. pool","D. school"],"answer":"B","explain":"'oo' trong good đọc là /ʊ/, còn trong food, pool, school đọc là /uː/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. diet","B. illness","C. fit","D. habit"],"answer":"A","explain":"Chữ 'i' trong diet đọc là /aɪ/, còn trong illness, fit, habit đọc là /ɪ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. antibiotic","B. healthy","C. energy","D. muscle"],"answer":"A","explain":"antibiotic nhấn âm 3 /ˌæntibaɪˈɒtɪk/, còn healthy, energy, muscle nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"A strong ___ system helps us fight diseases.","options":["A. immune","B. nervous","C. solar","D. rich"],"answer":"A","explain":"immune system là hệ miễn dịch, giúp chống lại bệnh tật."},{"type":"mcq","level":"TH","points":0.25,"q":"My mother ___ to the gym every day when she was young.","options":["A. goes","B. went","C. has gone","D. is going"],"answer":"B","explain":"Hành động lặp lại trong quá khứ đã kết thúc (when she was young) → quá khứ đơn."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Would you like to join our football team? B: ___","options":["A. Yes, I'd love to.","B. I hate football.","C. No, I am busy every day.","D. Football is boring."],"answer":"A","explain":"Được mời tham gia, đáp lại lịch sự và tích cực nhất là Yes, I'd love to."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["energy","năng lượng"],["muscle","cơ bắp"],["boost","tăng cường"],["routine","thói quen hằng ngày"],["headache","đau đầu"]],"explain":"energy: năng lượng; muscle: cơ bắp; boost: tăng cường; routine: thói quen hằng ngày; headache: đau đầu."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["Have","you","ever","tried","yoga","?"],"answer":"Have you ever tried yoga?","explain":"Câu đúng: Have you ever tried yoga? (câu hỏi kinh nghiệm → hiện tại hoàn thành)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: She has ___ finished her lunch.","answer":"already","explain":"already (đã) dùng trong câu khẳng định hiện tại hoàn thành."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: He (work) ___ out every morning since 2022.","answer":"has worked","explain":"Có since 2022 nên dùng hiện tại hoàn thành: has worked."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Walking is the simplest way to stay healthy. Doctors recommend walking at least 30 minutes a day. Walking improves blood circulation and helps control weight. It is suitable for people of all ages, from children to the elderly.","statements":["Walking is a simple healthy habit.","Doctors recommend walking 3 hours a day.","Walking helps control weight.","Only young people should walk."],"answer":["T","F","T","F"],"explain":"Bác sĩ khuyên đi bộ 30 phút mỗi ngày, phù hợp mọi lứa tuổi."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Doctor, I often feel tired. B: How many hours do you sleep? A: About five. B: That is not enough. You need at least seven hours. Also, eat more vegetables. A: Thank you, doctor.","sub_questions":[{"q":"How long does the patient sleep?","options":["A. 5 hours.","B. 7 hours.","C. 8 hours.","D. 6 hours."],"answer":"A"},{"q":"What does the doctor advise?","options":["A. Sleep less.","B. Sleep at least 7 hours and eat vegetables.","C. Take medicine.","D. Stop working."],"answer":"B"}],"explain":"Bệnh nhân ngủ 5 tiếng; bác sĩ khuyên ngủ ít nhất 7 tiếng và ăn nhiều rau."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'e' is pronounced differently from the others.","options":["A. healthy","B. sleep","C. regular","D. energy"],"answer":"B","explain":"Chữ 'e' trong sleep đọc là /iː/, còn trong healthy, regular, energy đọc là /e/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'ch' are pronounced differently from the others.","options":["A. headache","B. active","C. school","D. change"],"answer":"C","explain":"'ch' trong school đọc là /k/, còn trong headache, active, change đọc là /tʃ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. obesity","B. healthy","C. diet","D. habit"],"answer":"A","explain":"obesity nhấn âm 2 /əʊˈbiːsəti/, còn healthy, diet, habit nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Too much sugar can lead to ___.","options":["A. obesity","B. energy","C. health","D. fitness"],"answer":"A","explain":"Ăn quá nhiều đường có thể dẫn đến béo phì (obesity)."},{"type":"mcq","level":"TH","points":0.25,"q":"___ you ever ___ abroad?","options":["A. Have / been","B. Did / go","C. Are / going","D. Do / be"],"answer":"A","explain":"Câu hỏi kinh nghiệm dùng hiện tại hoàn thành: Have you ever been...?"},{"type":"mcq","level":"TH","points":0.25,"q":"He ___ smoking last year to protect his lungs.","options":["A. gave up","B. took up","C. cut off","D. put on"],"answer":"A","explain":"give up là từ bỏ — phù hợp với bỏ thuốc lá."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["fit","khỏe mạnh"],["sleep","giấc ngủ"],["infection","sự nhiễm bệnh"],["reduce","giảm bớt"],["active","năng động"]],"explain":"fit: khỏe mạnh; sleep: giấc ngủ; infection: sự nhiễm bệnh; reduce: giảm bớt; active: năng động."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["She","has","already","eaten","breakfast"],"answer":"She has already eaten breakfast.","explain":"Câu đúng: She has already eaten breakfast. (already đứng giữa have và V3)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: I have lived here ___ I was ten.","answer":"since","explain":"Mốc thời gian I was ten dùng với since."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The doctor (examine) ___ the patient this morning.","answer":"examined","explain":"this morning đã qua nên dùng quá khứ đơn: examined."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Smoking is one of the main causes of lung disease. It also harms people around the smoker. In Viet Nam, smoking is banned in public places such as schools and hospitals. Giving up smoking is the best way to protect your lungs.","statements":["Smoking causes lung disease.","Second-hand smoke is harmless.","Smoking is banned in Vietnamese schools.","Giving up smoking protects your lungs."],"answer":["T","F","T","T"],"explain":"Khói thuốc cũng hại người xung quanh; cấm hút thuốc ở nơi công cộng như trường học."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Hello, class. Today we will learn about a balanced diet. A balanced diet includes rice, meat, fish, vegetables and fruit. You should drink two litres of water a day. Avoid too much fast food and sweet drinks.","sub_questions":[{"q":"What does a balanced diet include?","options":["A. Only rice and meat.","B. Rice, meat, fish, vegetables and fruit.","C. Fast food.","D. Sweet drinks."],"answer":"B"},{"q":"How much water should you drink a day?","options":["A. One litre.","B. Two litres.","C. Three litres.","D. Half a litre."],"answer":"B"}],"explain":"Chế độ ăn cân bằng gồm cơm, thịt, cá, rau, quả; nên uống 2 lít nước mỗi ngày."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. balance","B. active","C. salad","D. regular"],"answer":"D","explain":"Chữ 'a' trong regular đọc là /ə/, còn trong balance, active, salad đọc là /æ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'th' are pronounced differently from the others.","options":["A. healthy","B. tooth","C. three","D. this"],"answer":"D","explain":"'th' trong this đọc là /ð/, còn trong healthy, tooth, three đọc là /θ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. energy","B. muscle","C. disease","D. habit"],"answer":"C","explain":"disease nhấn âm 2 /dɪˈziːz/, còn energy, muscle, habit nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Fresh fruit is ___ of vitamins.","options":["A. full","B. empty","C. short","D. free"],"answer":"A","explain":"full of là đầy, chứa nhiều — trái cây tươi giàu vitamin."},{"type":"mcq","level":"TH","points":0.25,"q":"I ___ my keys. I cannot open the door now.","options":["A. lost","B. have lost","C. lose","D. am losing"],"answer":"B","explain":"Kết quả còn ở hiện tại (không mở được cửa) → hiện tại hoàn thành."},{"type":"mcq","level":"TH","points":0.25,"q":"A: How often do you work out? B: ___","options":["A. Three times a week.","B. I like football.","C. In the morning.","D. Very much."],"answer":"A","explain":"Hỏi tần suất (how often) thì trả lời bằng số lần trong tuần."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["antibiotic","thuốc kháng sinh"],["treatment","sự điều trị"],["avoid","tránh"],["lunch","bữa trưa"],["study","học tập"]],"explain":"antibiotic: thuốc kháng sinh; treatment: sự điều trị; avoid: tránh; lunch: bữa trưa; study: học tập."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["They","have","never","eaten","sushi"],"answer":"They have never eaten sushi.","explain":"Câu đúng: They have never eaten sushi. (never đứng giữa have và V3)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: We have known each other ___ childhood.","answer":"since","explain":"Mốc thời gian childhood dùng với since."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the words in brackets: She (not, smoke) ___ for three years.","answer":"has not smoked","explain":"Có for three years nên dùng hiện tại hoàn thành phủ định: has not smoked."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Dr Minh Anh is a famous nutritionist. She advises people to eat less salt and sugar. According to her, breakfast should include protein and fruit. She also says drinking enough water is as important as eating well.","statements":["Dr Minh Anh is a nutritionist.","She advises eating more salt.","Breakfast should have protein and fruit.","Water is as important as food."],"answer":["T","F","T","T"],"explain":"Bà khuyên ăn ÍT muối và đường, không phải nhiều hơn."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: What sport do you play, Hoa? B: I play badminton twice a week. A: Is it good for health? B: Yes. It helps me stay fit and make new friends. A: Maybe I will join you next week.","sub_questions":[{"q":"How often does Hoa play badminton?","options":["A. Every day.","B. Twice a week.","C. Once a month.","D. Never."],"answer":"B"},{"q":"What will the boy do next week?","options":["A. Play football.","B. Join Hoa.","C. Stay at home.","D. See a doctor."],"answer":"B"}],"explain":"Hoa chơi cầu lông 2 lần mỗi tuần; bạn nam sẽ tham gia cùng tuần tới."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. fit","B. vitamin","C. active","D. lifestyle"],"answer":"D","explain":"Chữ 'i' trong lifestyle đọc là /aɪ/, còn trong fit, vitamin, active đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'g' is pronounced differently from the others.","options":["A. energy","B. longevity","C. change","D. strong"],"answer":"D","explain":"Chữ 'g' trong strong đọc là /ŋ/, còn trong energy, longevity, change đọc là /dʒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. healthy","B. immune","C. treatment","D. muscle"],"answer":"B","explain":"immune nhấn âm 2 /ɪˈmjuːn/, còn healthy, treatment, muscle nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"He does star ___ to build leg muscles.","options":["A. jumps","B. runs","C. walks","D. sleeps"],"answer":"A","explain":"star jumps là động tác nhảy dang tay chân, giúp phát triển cơ chân."},{"type":"mcq","level":"TH","points":0.25,"q":"She ___ in Ha Noi for ten years, then moved to Da Nang.","options":["A. has lived","B. lived","C. lives","D. is living"],"answer":"B","explain":"Giai đoạn đã kết thúc hẳn (then moved) → quá khứ đơn."},{"type":"mcq","level":"TH","points":0.25,"q":"A ___ lifestyle includes regular exercise and healthy food.","options":["A. healthy","B. lazy","C. busy","D. poor"],"answer":"A","explain":"healthy lifestyle là lối sống lành mạnh."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["diet","chế độ ăn"],["nutrient","chất dinh dưỡng"],["obesity","bệnh béo phì"],["boost","tăng cường"],["work out","tập thể dục"]],"explain":"diet: chế độ ăn; nutrient: chất dinh dưỡng; obesity: bệnh béo phì; boost: tăng cường; work out: tập thể dục."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["He","started","his","diet","two","months","ago"],"answer":"He started his diet two months ago.","explain":"Câu đúng: He started his diet two months ago. (ago → quá khứ đơn)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: I have not finished my homework ___.","answer":"yet","explain":"yet (chưa) dùng cuối câu phủ định hiện tại hoàn thành."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: They (build) ___ a new gym last month.","answer":"built","explain":"Có last month nên dùng quá khứ đơn: built (V2 của build)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Fast food is convenient but not healthy. It contains a lot of fat, salt and sugar. Eating too much fast food can cause obesity and heart disease. Teenagers should eat fast food only occasionally.","statements":["Fast food is convenient.","Fast food is very healthy.","Too much fast food causes obesity.","Teenagers should never eat fast food."],"answer":["T","F","T","F"],"explain":"Đồ ăn nhanh tiện nhưng không lành mạnh; nên ăn thỉnh thoảng chứ không phải không bao giờ."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Attention, please. Our school will hold a sports day next Friday. There will be running, swimming and football matches. Students who want to join should register with Mr Tuan before Wednesday. Winners will get medals and gifts.","sub_questions":[{"q":"When is the sports day?","options":["A. Next Monday.","B. Next Friday.","C. Next Wednesday.","D. Tomorrow."],"answer":"B"},{"q":"Who should students register with?","options":["A. Mr Tuan.","B. The principal.","C. Their parents.","D. The doctor."],"answer":"A"}],"explain":"Ngày hội thể thao vào thứ Sáu tuần tới; đăng ký với thầy Tuấn."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'u' is pronounced differently from the others.","options":["A. study","B. sugar","C. cut","D. lunch"],"answer":"B","explain":"Chữ 'u' trong sugar đọc là /ʊ/, còn trong study, cut, lunch đọc là /ʌ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. doctors","B. long","C. obese","D. strong"],"answer":"C","explain":"Chữ 'o' trong obese đọc là /əʊ/, còn trong doctors, long, strong đọc là /ɒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. treatment","B. reduce","C. healthy","D. diet"],"answer":"B","explain":"reduce nhấn âm 2 /rɪˈdjuːs/, còn treatment, healthy, diet nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Getting enough ___ helps you stay alert during lessons.","options":["A. sleep","B. food","C. water","D. money"],"answer":"A","explain":"Ngủ đủ giấc giúp tỉnh táo trong giờ học."},{"type":"mcq","level":"TH","points":0.25,"q":"Look! The team ___ the match.","options":["A. won","B. has won","C. wins","D. is winning"],"answer":"B","explain":"Kết quả còn ở hiện tại (Look!) → hiện tại hoàn thành."},{"type":"mcq","level":"TH","points":0.25,"q":"A: I feel stressed these days. B: ___","options":["A. You should relax and sleep well.","B. Stress is good.","C. I like stress.","D. Work harder."],"answer":"A","explain":"Khi bạn căng thẳng, lời khuyên hợp lý là thư giãn và ngủ đủ."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["balanced","cân bằng"],["habit","thói quen"],["cut down","cắt giảm"],["longevity","tuổi thọ"],["disease","bệnh tật"]],"explain":"balanced: cân bằng; habit: thói quen; cut down: cắt giảm; longevity: tuổi thọ; disease: bệnh tật."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["My","father","gave","up","smoking","last","year"],"answer":"My father gave up smoking last year.","explain":"Câu đúng: My father gave up smoking last year. (last year → quá khứ đơn)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: They have played football ___ 3 p.m.","answer":"since","explain":"Mốc thời gian 3 p.m. dùng với since."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the words in brackets: I (just, finish) ___ my exercise.","answer":"have just finished","explain":"just đi với hiện tại hoàn thành: have just finished."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Mental health is as important as physical health. Students under pressure should talk to friends, teachers or parents. Doing exercise and listening to music also help reduce stress. Schools should organise more outdoor activities for students.","statements":["Mental health matters as much as physical health.","Stressed students should keep silent.","Exercise helps reduce stress.","Schools should have more outdoor activities."],"answer":["T","F","T","T"],"explain":"Học sinh căng thẳng nên chia sẻ, không nên giữ im lặng."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Grandma, you are 95 but still strong. What is your secret? B: I eat simple food and walk every day. A: Do you take any medicine? B: No. Good habits are my best medicine.","sub_questions":[{"q":"How old is Grandma?","options":["A. 85.","B. 90.","C. 95.","D. 100."],"answer":"C"},{"q":"What is her secret?","options":["A. Expensive medicine.","B. Simple food and daily walks.","C. Sleeping all day.","D. Eating fast food."],"answer":"B"}],"explain":"Bà 95 tuổi; bí quyết là ăn đơn giản và đi bộ mỗi ngày."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. active","B. balance","C. salad","D. stay"],"answer":"D","explain":"Chữ 'a' trong stay đọc là /eɪ/, còn trong active, balance, salad đọc là /æ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 's' is pronounced differently from the others.","options":["A. lose","B. disease","C. sleep","D. muscle"],"answer":"C","explain":"Chữ 's' trong sleep đọc là /s/, còn trong lose, disease, muscle đọc là /z/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. headache","B. diet","C. infection","D. habit"],"answer":"C","explain":"infection nhấn âm 2 /ɪnˈfekʃn/, còn headache, diet, habit nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Wash your hands to avoid ___.","options":["A. infection","B. energy","C. diet","D. treatment"],"answer":"A","explain":"Rửa tay để tránh nhiễm bệnh (infection)."},{"type":"mcq","level":"TH","points":0.25,"q":"We ___ to Phu Quoc last summer.","options":["A. have gone","B. went","C. go","D. are going"],"answer":"B","explain":"Có last summer nên dùng quá khứ đơn: went."},{"type":"mcq","level":"TH","points":0.25,"q":"He ___ up jogging to lose weight.","options":["A. took","B. gave","C. put","D. cut"],"answer":"A","explain":"take up là bắt đầu (thói quen mới) — phù hợp ngữ cảnh."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["vitamin","vitamin"],["immune system","hệ miễn dịch"],["take up","bắt đầu"],["regular","đều đặn"],["energy","năng lượng"]],"explain":"vitamin: vitamin; immune system: hệ miễn dịch; take up: bắt đầu; regular: đều đặn; energy: năng lượng."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["I","visited","my","grandparents","last","weekend"],"answer":"I visited my grandparents last weekend.","explain":"Câu đúng: I visited my grandparents last weekend. (last weekend → quá khứ đơn)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: She has worked here ___ five years.","answer":"for","explain":"Khoảng thời gian five years dùng với for."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the words in brackets: He (not, eat) ___ breakfast yet.","answer":"has not eaten","explain":"yet cuối câu phủ định → hiện tại hoàn thành: has not eaten."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). In 2023, a survey showed that Vietnamese teenagers spend about 6 hours a day on phones. Too much screen time can harm their eyes and sleep. Experts advise teenagers to limit screen time to 2 hours a day and spend more time outdoors.","statements":["Teenagers spend 6 hours a day on phones.","Screen time is good for eyes.","Experts advise 2 hours of screen time a day.","Teenagers should spend more time outdoors."],"answer":["T","F","T","T"],"explain":"Dùng điện thoại quá nhiều hại mắt và giấc ngủ; chuyên gia khuyên giới hạn 2 tiếng mỗi ngày."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Hi, I am Anna. I am 16 and I live in London. Every morning I run for 20 minutes before school. I eat a lot of fruit and never drink sweet drinks. My friends say I have a healthy lifestyle, and I feel great.","sub_questions":[{"q":"How long does Anna run every morning?","options":["A. 10 minutes.","B. 20 minutes.","C. 30 minutes.","D. 1 hour."],"answer":"B"},{"q":"What does Anna never drink?","options":["A. Water.","B. Milk.","C. Sweet drinks.","D. Juice."],"answer":"C"}],"explain":"Anna chạy 20 phút mỗi sáng và không bao giờ uống đồ uống ngọt."}]}]}
