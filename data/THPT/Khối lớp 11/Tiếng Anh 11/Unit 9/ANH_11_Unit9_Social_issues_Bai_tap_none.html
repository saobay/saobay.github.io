 They said I was a coward. A: That's peer pressure. Be strong and say no! B: You're right. I will say no next time. A: Good! Real friends respect your choice.","sub_questions":[{"q":"Why did Tom smoke?","options":["A. He likes it.","B. Peer pressure.","C. His parents allow it.","D. He is ill."],"answer":"B"},{"q":"What is the advice?","options":["A. Keep smoking.","B. Say no and be strong.","C. Change friends now.","D. Tell the police."],"answer":"B"}],"explain":"Tom hút thuốc vì áp lực bạn bè; nên mạnh mẽ từ chối."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'e' is pronounced differently from the others.","options":["A. depression","B. get","C. self","D. me"],"answer":"D","explain":"Chữ 'e' trong me đọc là /iː/, còn trong depression, get, self đọc là /e/ hoặc /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. obey","B. involve","C. job","D. problem"],"answer":"A","explain":"Chữ 'o' trong obey đọc là /əʊ/, còn trong involve, job, problem đọc là /ɒ/ hoặc /ə/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. get","B. self","C. admit","D. issue"],"answer":"C","explain":"admit nhấn âm 2 /ədˈmɪt/, còn get, self, issue nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"We need to raise ___ of this issue.","options":["A. awareness","B. hands","C. flags","D. voices only"],"answer":"A","explain":"raise awareness là nâng cao nhận thức."},{"type":"mcq","level":"TH","points":0.25,"q":"Air is polluted. ___, water is dirty too.","options":["A. Moreover","B. However","C. Although","D. Despite"],"answer":"A","explain":"Moreover bổ sung ý: hơn nữa."},{"type":"mcq","level":"TH","points":0.25,"q":"___ pressure is hard to resist.","options":["A. Peer","B. Air","C. Water","D. Blood"],"answer":"A","explain":"Peer pressure là áp lực đồng trang lứa."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["peer pressure","áp lực đồng trang lứa"],["body shaming","chế nhạo ngoại hình"],["cyberbullying","bắt nạt qua mạng"],["poverty","sự nghèo đói"],["anxiety","sự lo âu"]],"explain":"peer pressure: áp lực đồng trang lứa; body shaming: chế nhạo ngoại hình; cyberbullying: bắt nạt qua mạng; poverty: sự nghèo đói; anxiety: sự lo âu."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["Air","is","polluted","moreover","water","is","dirty"],"answer":"Air is polluted; moreover, water is dirty.","explain":"Câu đúng: Air is polluted; moreover, water is dirty."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: Air is polluted. ___, water is dirty.","answer":"Moreover","explain":"Moreover bổ sung ý."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: ___ is a serious crime. (violent)","answer":"Violence","explain":"Đầu câu cần danh từ: Violence (bạo lực)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Depression is a serious mental health issue. Teens with depression feel sad for a long time. They may lose interest in hobbies. Talking to trusted people can help.","statements":["Depression is serious.","Depressed teens feel sad long.","They keep all hobbies.","Talking to others helps."],"answer":["T","T","F","T"],"explain":"Trầm cảm có thể làm mất hứng thú với sở thích."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Hi, I'm Mai. Last month I was a victim of body shaming. My classmates laughed at my weight. I felt ashamed and cried. Then I told my teacher. She punished them and helped me feel confident again.","sub_questions":[{"q":"What happened to Mai?","options":["A. She failed a test.","B. Body shaming by classmates.","C. She lost her bag.","D. She is ill."],"answer":"B"},{"q":"How did the teacher help?","options":["A. She ignored it.","B. She punished them and helped Mai.","C. She laughed too.","D. She moved Mai's class."],"answer":"B"}],"explain":"Mai bị chế nhạo cân nặng; cô giáo đã xử lý và giúp cô tự tin lại."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. admit","B. live","C. skill","D. victim"],"answer":"A","explain":"Chữ 'i' trong admit đọc là /ə/, còn trong live, skill, victim đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'ch' are pronounced differently from the others.","options":["A. change","B. teach","C. school","D. each"],"answer":"C","explain":"'ch' trong school đọc là /k/, còn trong change, teach, each đọc là /tʃ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. admit","B. live","C. skill","D. issue"],"answer":"A","explain":"admit nhấn âm 2 /ədˈmɪt/, còn live, skill, issue nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"___ is a pressing problem in big cities.","options":["A. Overpopulation","B. Happiness","C. Silence","D. Fresh air"],"answer":"A","explain":"Overpopulation là sự quá tải dân số."},{"type":"mcq","level":"TH","points":0.25,"q":"She studied hard. As a ___, she passed.","options":["A. result","B. way","C. day","D. time"],"answer":"A","explain":"As a result là do đó."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Why is he crying? B: ___","options":["A. Someone bullied him.","B. He is happy.","C. He won a prize.","D. He likes crying."],"answer":"A","explain":"Cậu ấy khóc vì bị bắt nạt."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["pressing","cấp bách"],["issue","vấn đề"],["crime","tội phạm"],["affect","ảnh hưởng"],["violent","bạo lực"]],"explain":"pressing: cấp bách; issue: vấn đề; crime: tội phạm; affect: ảnh hưởng; violent: bạo lực."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["She","studied","hard","as","a","result","she","passed"],"answer":"She studied hard; as a result, she passed.","explain":"Câu đúng: She studied hard; as a result, she passed."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: She studied hard. As a ___, she passed.","answer":"result","explain":"As a result là do đó."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The problem needs ___ action. (urgency)","answer":"urgent","explain":"Trước danh từ action cần tính từ: urgent (khẩn cấp)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Self-confidence helps teens face problems. Confident teens speak up when bullied. They ask teachers for help. Building confidence takes time and practice.","statements":["Confidence helps face problems.","Confident teens speak up.","They never ask for help.","Confidence needs practice."],"answer":["T","T","F","T"],"explain":"Thanh thiếu niên tự tin nhờ thầy cô giúp đỡ."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Have you joined the awareness campaign, Hoa? B: Yes! We made posters about bullying. A: Where did you put them? B: Around the school. Many students stopped to read them. A: Great work!","sub_questions":[{"q":"What did Hoa's group do?","options":["A. Made posters.","B. Played games.","C. Sang songs.","D. Cooked food."],"answer":"A"},{"q":"Where are the posters?","options":["A. At home.","B. Around the school.","C. In the park.","D. Online."],"answer":"B"}],"explain":"Nhóm Hoa làm áp phích về bắt nạt và dán quanh trường."}]},{"name":"Đề 8","questions":[{"type":"mcq", ancelled because of the storm.","explain":"Câu đúng: The match was cancelled because of the storm. (because of + N)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: The match was cancelled ___ the storm.","answer":"because of","explain":"because of + danh từ."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: They showed great ___. (brave)","answer":"bravery","explain":"Sau great cần danh từ: bravery (lòng dũng cảm)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Alcohol harms teens' health badly. It affects the brain and body. Teens should never try alcohol. Schools teach students about its dangers.","statements":["Alcohol harms teens.","It affects brain and body.","Teens should try it once.","Schools teach its dangers."],"answer":["T","T","F","T"],"explain":"Thanh thiếu niên không bao giờ nên thử rượu."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Welcome to our workshop on teen issues. First, we talk about peer pressure. Next, we discuss cyberbullying. Finally, we practise saying no politely. Please take a seat and enjoy!","sub_questions":[{"q":"What is the first topic?","options":["A. Cyberbullying.","B. Peer pressure.","C. Saying no.","D. Exams."],"answer":"B"},{"q":"What do they practise last?","options":["A. Singing.","B. Dancing.","C. Saying no politely.","D. Cooking."],"answer":"C"}],"explain":"Chủ đề đầu là áp lực đồng trang lứa; cuối là luyện nói không một cách lịch sự."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. awareness","B. affect","C. plan","D. campaign"],"answer":"B","explain":"Chữ 'a' trong affect đọc là /ə/, còn trong awareness, plan, campaign đọc là /eə/, /æ/ hoặc /eɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'oo' are pronounced differently from the others.","options":["A. school","B. foot","C. good","D. cool"],"answer":"C","explain":"'oo' trong good đọc là /ʊ/, còn trong school, foot, cool đọc là /uː/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. awareness","B. affect","C. plan","D. campaign"],"answer":"C","explain":"plan nhấn âm 1 /plæn/, còn awareness, affect, campaign nhấn âm 2."},{"type":"mcq","level":"NB","points":0.25,"q":"Many children live in ___.","options":["A. poverty","B. luxury","C. cities","D. schools"],"answer":"A","explain":"poverty là sự nghèo đói."},{"type":"mcq","level":"TH","points":0.25,"q":"___ being tired, she kept working.","options":["A. Despite","B. Although","C. However","D. Therefore"],"answer":"A","explain":"Despite + V-ing: Despite being tired."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Do you think bullying is serious? B: ___","options":["A. Yes, very serious.","B. No, it's fun.","C. I don't care.","D. Bullying is good."],"answer":"A","explain":"Đồng ý rằng bắt nạt là nghiêm trọng."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["bully","bắt nạt"],["cyberbullying","bắt nạt qua mạng"],["issue","vấn đề"],["crime","tội phạm"],["anxiety","sự lo âu"]],"explain":"bully: bắt nạt; cyberbullying: bắt nạt qua mạng; issue: vấn đề; crime: tội phạm; anxiety: sự lo âu."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["Despite","being","tired","she","kept","working"],"answer":"Despite being tired, she kept working.","explain":"Câu đúng: Despite being tired, she kept working. (Despite + V-ing)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: ___ being tired, she kept working.","answer":"Despite","explain":"Despite + V-ing."},{"type":"short","level":"VD","points":0.5,"q":" nt stress pattern from the others.","options":["A. result","B. bully","C. study","D. admit"],"answer":"D","explain":"admit nhấn âm 2 /ədˈmɪt/, còn result, bully, study nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"He felt ___ about his mistake.","options":["A. ashamed","B. proud","C. happy","D. excited"],"answer":"A","explain":"ashamed là xấu hổ về lỗi lầm."},{"type":"mcq","level":"TH","points":0.25,"q":"He was ill; ___, he went to school.","options":["A. nevertheless","B. therefore","C. because","D. since"],"answer":"A","explain":"nevertheless chỉ tương phản: tuy nhiên."},{"type":"mcq","level":"TH","points":0.25,"q":"We must ___ victims of bullying.","options":["A. help","B. ignore","C. laugh at","D. punish"],"answer":"A","explain":"Chúng ta phải giúp đỡ nạn nhân bị bắt nạt."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["self-confidence","sự tự tin"],["admit","thừa nhận"],["offensive","gây xúc phạm"],["overpopulation","sự quá tải dân số"],["depression","trầm cảm"]],"explain":"self-confidence: sự tự tin; admit: thừa nhận; offensive: gây xúc phạm; overpopulation: sự quá tải dân số; depression: trầm cảm."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["He","was","ill","nevertheless","he","went","to","school"],"answer":"He was ill; nevertheless, he went to school.","explain":"Câu đúng: He was ill; nevertheless, he went to school."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: He was ill; ___, he went to school.","answer":"nevertheless","explain":"nevertheless chỉ tương phản."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The ___ of the poor moved us. (suffer)","answer":"suffering","explain":"Sau the cần danh từ: suffering (sự đau khổ)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Awareness campaigns help teens understand social issues. Posters and talks teach students to respect others. Many schools now have anti-bullying clubs. Together, teens can stop bullying.","statements":["Campaigns raise awareness.","Posters teach respect.","No school has clubs.","Teens can stop bullying together."],"answer":["T","T","F","T"],"explain":"Nhiều trường có câu lạc bộ chống bắt nạt."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Good evening, parents. Teen depression is rising. Watch for signs: long sadness, lost interest, poor sleep. Talk to your children gently. Our school counsellor is ready to help.","sub_questions":[{"q":"What issue is rising?","options":["A. Teen depression.","B. Crime.","C. Poverty.","D. Accidents."],"answer":"A"},{"q":"Who can help at school?","options":["A. The cook.","B. The counsellor.","C. The driver.","D. The guard."],"answer":"B"}],"explain":"Trầm cảm tuổi teen gia tăng; cố vấn trường sẵn sàng giúp đỡ."}]}]}
