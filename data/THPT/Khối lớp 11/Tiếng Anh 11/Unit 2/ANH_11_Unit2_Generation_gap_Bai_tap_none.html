{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. family","B. gap","C. parents","D. behave"],"answer":"D","explain":"Chữ 'a' trong behave đọc là /eɪ/, còn trong family, gap, parents đọc là /æ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. follow","B. conflict","C. problem","D. obey"],"answer":"D","explain":"Chữ 'o' trong obey đọc là /əʊ/, còn trong follow, conflict, problem đọc là /ɒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. family","B. parents","C. behave","D. value"],"answer":"C","explain":"behave nhấn âm 2 /bɪˈheɪv/, còn family, parents, value nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"The ___ between parents and children is getting wider nowadays.","options":["A. generation gap","B. nuclear family","C. viewpoint","D. privacy"],"answer":"A","explain":"generation gap là khoảng cách thế hệ."},{"type":"mcq","level":"TH","points":0.25,"q":"You ___ finish your homework before dinner.","options":["A. must","B. might","C. could","D. would"],"answer":"A","explain":"Quy định bắt buộc → dùng must."},{"type":"mcq","level":"TH","points":0.25,"q":"A: My son never listens to me. B: ___","options":["A. You should talk to him calmly.","B. He is a bad boy.","C. Let him do anything.","D. Shout at him."],"answer":"A","explain":"Lời khuyên hợp lý là nói chuyện với con một cách bình tĩnh."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["generation gap","khoảng cách thế hệ"],["nuclear family","gia đình hạt nhân"],["viewpoint","quan điểm"],["conflict","mâu thuẫn"],["privacy","sự riêng tư"]],"explain":"generation gap: khoảng cách thế hệ; nuclear family: gia đình hạt nhân; viewpoint: quan điểm; conflict: mâu thuẫn; privacy: sự riêng tư."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["You","must","wear","a","uniform"],"answer":"You must wear a uniform.","explain":"Câu đúng: You must wear a uniform. (must + V nguyên thể)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: You ___ wear a seatbelt in the car.","answer":"must","explain":"Quy định bắt buộc → must."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Parents should respect their children's ___ (private).","answer":"privacy","explain":"Sau tính từ sở hữu cần danh từ: privacy (sự riêng tư)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Mr Hung lives with his parents, his wife and two children. It is an extended family with three generations. Sometimes they argue about small things, but they always solve problems together. Mr Hung says living with grandparents helps his children learn respect.","statements":["Mr Hung lives in a nuclear family.","Three generations live together.","They never argue.","Grandparents teach children respect."],"answer":["F","T","F","T"],"explain":"Đây là gia đình nhiều thế hệ (extended); họ thỉnh thoảng vẫn tranh cãi."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe hội thoại và trả lời câu hỏi.","audio_text":"A: Mum, can I go to Mai's birthday party tonight? B: What time does it finish? A: About 9 p.m. B: All right, but you must be home by 9.30. A: Thanks, Mum! I promise.","sub_questions":[{"q":"What does the boy ask for?","options":["A. Money.","B. Permission to go to a party.","C. A new phone.","D. A bike."],"answer":"B"},{"q":"When must he be home?","options":["A. By 9 p.m.","B. By 9.30 p.m.","C. By 10 p.m.","D. By 8 p.m."],"answer":"B"}],"explain":"Cậu xin phép đi dự tiệc sinh nhật và phải về trước 9 giờ 30."}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. limit","B. privacy","C. give","D. time"],"answer":"D","explain":"Chữ 'i' trong time đọc là /aɪ/, còn trong limit, privacy, give đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'ea' are pronounced differently from the others.","options":["A. teach","B. clean","C. great","D. mean"],"answer":"C","explain":"'ea' trong great đọc là /eɪ/, còn trong teach, clean, mean đọc là /iː/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. limit","B. value","C. obey","D. argue"],"answer":"C","explain":"obey nhấn âm 2 /əˈbeɪ/, còn limit, value, argue nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"A ___ family includes parents, children and grandparents living together.","options":["A. nuclear","B. extended","C. small","D. rich"],"answer":"B","explain":"extended family là gia đình nhiều thế hệ cùng sống."},{"type":"mcq","level":"TH","points":0.25,"q":"She is ill, so she ___ stay in bed.","options":["A. should","B. must","C. could","D. would"],"answer":"A","explain":"Lời khuyên khi bị ốm → should."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Can I go out tonight, Mum? B: ___","options":["A. Yes, but be home by 9.","B. No, never ask me.","C. Go wherever you like.","D. I do not care."],"answer":"A","explain":"Cho phép có điều kiện (về trước 9 giờ) là cách đáp hợp lý."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["behaviour","hành vi"],["attitude","thái độ"],["respect","tôn trọng"],["obey","vâng lời"],["curfew","giờ giới nghiêm"]],"explain":"behaviour: hành vi; attitude: thái độ; respect: tôn trọng; obey: vâng lời; curfew: giờ giới nghiêm."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["should","listen","to","You","your","parents"],"answer":"You should listen to your parents.","explain":"Câu đúng: You should listen to your parents. (should + V)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: She ___ to finish her report today.","answer":"has","explain":"Chủ ngữ she → has to (phải)."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Good ___ is the key to a happy family. (communicate)","answer":"communication","explain":"Sau tính từ good cần danh từ: communication (sự giao tiếp)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Teenagers often want more freedom than their parents allow. They like modern music and clothes, while parents prefer traditional values. This difference can cause arguments at home. Experts advise both sides to listen and respect each other to bridge the generation gap.","statements":["Teenagers want more freedom than parents allow.","Parents and teens always share the same tastes.","Arguments can happen because of different values.","Listening helps bridge the generation gap."],"answer":["T","F","T","T"],"explain":"Khác biệt về sở thích và giá trị có thể gây tranh cãi; lắng nghe giúp thu hẹp khoảng cách."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"In many Vietnamese families, grandparents live with their children and grandchildren. The old generation often wants children to follow traditional values. The young generation prefers modern lifestyles. Although they sometimes disagree, love keeps the family together.","sub_questions":[{"q":"Who lives together in many Vietnamese families?","options":["A. Only parents and children.","B. Grandparents, parents and children.","C. Only grandparents.","D. Friends."],"answer":"B"},{"q":"What keeps the family together?","options":["A. Money.","B. Rules.","C. Love.","D. Tradition."],"answer":"C"}],"explain":"Nhiều gia đình Việt có 3 thế hệ cùng sống; tình yêu thương gắn kết gia đình."}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'e' is pronounced differently from the others.","options":["A. respect","B. spend","C. she","D. get"],"answer":"C","explain":"Chữ 'e' trong she đọc là /iː/, còn trong respect, spend, get đọc là /e/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 's' is pronounced differently from the others.","options":["A. values","B. respects","C. stops","D. talks"],"answer":"A","explain":"Chữ 's' trong values đọc là /z/, còn trong respects, stops, talks đọc là /s/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. follow","B. conflict","C. forbid","D. problem"],"answer":"C","explain":"forbid nhấn âm 2 /fəˈbɪd/, còn follow, conflict, problem nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Teenagers need more ___ in their rooms.","options":["A. privacy","B. conflict","C. argument","D. control"],"answer":"A","explain":"privacy (sự riêng tư) là điều thanh thiếu niên cần."},{"type":"mcq","level":"TH","points":0.25,"q":"You ___ smoke here. It is forbidden.","options":["A. mustn't","B. don't have to","C. shouldn't","D. couldn't"],"answer":"A","explain":"Bị cấm (forbidden) → mustn't."},{"type":"mcq","level":"TH","points":0.25,"q":"Parents should ___ their children's privacy.","options":["A. respect","B. control","C. limit","D. forbid"],"answer":"A","explain":"respect (tôn trọng) sự riêng tư của con."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["value","giá trị"],["belief","niềm tin"],["argument","cuộc tranh cãi"],["allow","cho phép"],["forbid","cấm"]],"explain":"value: giá trị; belief: niềm tin; argument: cuộc tranh cãi; allow: cho phép; forbid: cấm."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["must","We","hurry","or","will","late","be","we"],"answer":"We must hurry or we will be late.","explain":"Câu đúng: We must hurry or we will be late."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: You ___ eat more vegetables.","answer":"should","explain":"Lời khuyên → should."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: His ___ surprised everyone. (behave)","answer":"behaviour","explain":"Sau tính từ sở hữu his cần danh từ: behaviour (hành vi)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Lan is 16. Her parents do not allow her to dye her hair or stay out late. Lan thinks these rules are too strict, but her mother says they protect her. Last week they had a long talk and agreed on new rules together. Now Lan feels happier at home.","statements":["Lan's parents allow her to dye her hair.","Lan thinks the rules are too strict.","They never talk about the rules.","They agreed on new rules together."],"answer":["F","T","F","T"],"explain":"Bố mẹ không cho nhuộm tóc; họ đã nói chuyện và thống nhất quy định mới."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Dad, all my friends have motorbikes. Can I have one? B: You are only 16. You must wait until you are 18. A: But I need it to go to school. B: The school is only 2 kilometres away. You can ride a bike.","sub_questions":[{"q":"What does the boy want?","options":["A. A bike.","B. A motorbike.","C. A car.","D. Money."],"answer":"B"},{"q":"Why does Dad refuse?","options":["A. He has no money.","B. The boy is only 16.","C. The school is far.","D. Motorbikes are slow."],"answer":"B"}],"explain":"Cậu bé muốn xe máy nhưng mới 16 tuổi nên bố chưa cho."}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. limit","B. blind","C. opinion","D. give"],"answer":"B","explain":"Chữ 'i' trong blind đọc là /aɪ/, còn trong limit, opinion, give đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'th' are pronounced differently from the others.","options":["A. think","B. three","C. those","D. thing"],"answer":"C","explain":"'th' trong those đọc là /ð/, còn trong think, three, thing đọc là /θ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. teach","B. clean","C. respect","D. great"],"answer":"C","explain":"respect nhấn âm 2 /rɪˈspekt/, còn teach, clean, great nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"My parents set a ___: I must be home before 10 p.m.","options":["A. curfew","B. value","C. belief","D. limit"],"answer":"A","explain":"curfew là giờ giới nghiêm (giờ phải về nhà)."},{"type":"mcq","level":"TH","points":0.25,"q":"Drivers ___ stop at red lights.","options":["A. must","B. should","C. could","D. might"],"answer":"A","explain":"Luật giao thông bắt buộc → must."},{"type":"mcq","level":"TH","points":0.25,"q":"A: I argued with my dad. B: ___","options":["A. You should apologise to him.","B. Good job.","C. Ignore him.","D. Argue more."],"answer":"A","explain":"Sau khi cãi nhau với bố, nên xin lỗi ông."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["control","kiểm soát"],["permission","sự cho phép"],["limit","giới hạn"],["follow in sb's footsteps","noi gương ai"],["nuclear family","gia đình hạt nhân"]],"explain":"control: kiểm soát; permission: sự cho phép; limit: giới hạn; follow in sb's footsteps: noi gương ai; nuclear family: gia đình hạt nhân."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["She","has","early","to","get","up"],"answer":"She has to get up early.","explain":"Câu đúng: She has to get up early. (has to + V)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: We ___ not talk during the test.","answer":"must","explain":"Cấm nói chuyện trong giờ kiểm tra → must not."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: We must follow the school ___ (regulate).","answer":"regulations","explain":"Sau the cần danh từ số nhiều: regulations (nội quy)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). In the past, Vietnamese children had to obey their parents without questions. Nowadays, parents listen more to their children. However, respect for elders is still an important value in Vietnamese families. Young people should keep this tradition.","statements":["Children in the past had to obey parents completely.","Modern parents never listen to children.","Respect for elders is still valued.","Young people should keep the tradition of respect."],"answer":["T","F","T","T"],"explain":"Ngày nay bố mẹ lắng nghe con hơn, nhưng tôn trọng người lớn vẫn là giá trị quan trọng."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Good evening, parents. Our school will organise a family day next Sunday. Parents and children will cook and play games together. The aim is to help families understand each other better. Please register with your child's teacher before Friday.","sub_questions":[{"q":"When is the family day?","options":["A. Next Saturday.","B. Next Sunday.","C. Next Friday.","D. Tomorrow."],"answer":"B"},{"q":"What is the aim of the family day?","options":["A. To raise money.","B. To help families understand each other.","C. To have exams.","D. To clean the school."],"answer":"B"}],"explain":"Ngày hội gia đình vào Chủ nhật tới nhằm giúp các gia đình hiểu nhau hơn."}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letters 'oo' are pronounced differently from the others.","options":["A. look","B. foot","C. good","D. room"],"answer":"D","explain":"'oo' trong room đọc là /uː/, còn trong look, foot, good đọc là /ʊ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. limit","B. privacy","C. opinion","D. blind"],"answer":"D","explain":"Chữ 'i' trong blind đọc là /aɪ/, còn trong limit, privacy, opinion đọc là /ɪ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. nuclear","B. allow","C. study","D. value"],"answer":"B","explain":"allow nhấn âm 2 /əˈlaʊ/, còn nuclear, study, value nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"We should respect our parents' ___.","options":["A. viewpoints","B. conflicts","C. arguments","D. controls"],"answer":"A","explain":"viewpoints là quan điểm — nên tôn trọng quan điểm của bố mẹ."},{"type":"mcq","level":"TH","points":0.25,"q":"I ___ go now. It is getting late.","options":["A. have to","B. should","C. could","D. might"],"answer":"A","explain":"Hoàn cảnh (đã muộn) bắt buộc phải đi → have to."},{"type":"mcq","level":"TH","points":0.25,"q":"It is rude to ___ at your parents.","options":["A. shout","B. talk","C. smile","D. look"],"answer":"A","explain":"shout at là quát mắng — hành vi bất lịch sự với bố mẹ."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["generation gap","khoảng cách thế hệ"],["extended family","gia đình nhiều thế hệ"],["behaviour","hành vi"],["attitude","thái độ"],["value","giá trị"]],"explain":"generation gap: khoảng cách thế hệ; extended family: gia đình nhiều thế hệ; behaviour: hành vi; attitude: thái độ; value: giá trị."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["You","talk","mustn't","in","the","exam"],"answer":"You mustn't talk in the exam.","explain":"Câu đúng: You mustn't talk in the exam. (mustn't = cấm)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: He ___ stay in bed because he is ill.","answer":"has","explain":"Chủ ngữ he → has to (phải)."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Teenagers need more ___ (free).","answer":"freedom","explain":"Sau more cần danh từ: freedom (sự tự do)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Many parents worry when their children spend too much time on phones. They fear children will neglect studies and health. However, banning phones completely often causes more conflicts. Experts suggest parents set reasonable limits and talk openly with their children instead.","statements":["Parents worry about children's phone use.","Parents fear phones harm studies and health.","Banning phones solves all problems.","Experts suggest reasonable limits and open talks."],"answer":["T","T","F","T"],"explain":"Cấm hẳn điện thoại thường gây thêm mâu thuẫn; nên đặt giới hạn hợp lý."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Why are you sad, Tom? B: My dad doesn't let me join the school trip. A: Did you ask him why? B: He says I must focus on my exams next month. A: Maybe you should study hard and show him your result first.","sub_questions":[{"q":"Why is Tom sad?","options":["A. He failed an exam.","B. His dad doesn't let him join the trip.","C. He lost money.","D. He is ill."],"answer":"B"},{"q":"What does his friend advise?","options":["A. Argue with Dad.","B. Study hard and show the result.","C. Go on the trip secretly.","D. Skip exams."],"answer":"B"}],"explain":"Bố không cho Tom đi dã ngoại vì kỳ thi; bạn khuyên cậu học chăm và cho bố thấy kết quả."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. limit","B. give","C. blind","D. opinion"],"answer":"C","explain":"Chữ 'i' trong blind đọc là /aɪ/, còn trong limit, give, opinion đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'ch' are pronounced differently from the others.","options":["A. children","B. change","C. school","D. teach"],"answer":"C","explain":"'ch' trong school đọc là /k/, còn trong children, change, teach đọc là /tʃ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. limit","B. behave","C. value","D. study"],"answer":"B","explain":"behave nhấn âm 2 /bɪˈheɪv/, còn limit, value, study nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"His rude ___ made his parents angry.","options":["A. behaviour","B. value","C. belief","D. privacy"],"answer":"A","explain":"behaviour (hành vi) thô lỗ làm bố mẹ giận."},{"type":"mcq","level":"TH","points":0.25,"q":"You look tired. You ___ take a rest.","options":["A. should","B. must","C. have to","D. could"],"answer":"A","explain":"Lời khuyên → should."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Should I tell my parents the truth? B: ___","options":["A. Yes, honesty is the best policy.","B. No, keep lying.","C. It does not matter.","D. Hide everything."],"answer":"A","explain":"Nên thành thật với bố mẹ — honesty is the best policy."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["conflict","mâu thuẫn"],["respect","tôn trọng"],["obey","vâng lời"],["curfew","giờ giới nghiêm"],["permission","sự cho phép"]],"explain":"conflict: mâu thuẫn; respect: tôn trọng; obey: vâng lời; curfew: giờ giới nghiêm; permission: sự cho phép."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["don't","to","You","come","have","early"],"answer":"You don't have to come early.","explain":"Câu đúng: You don't have to come early. (không cần thiết)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: They ___ listen to their teacher.","answer":"should","explain":"Lời khuyên → should."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Honesty is an important family ___ (valuable).","answer":"value","explain":"Sau tính từ important cần danh từ: value (giá trị)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). An's grandmother always tells stories about the past. She wants An to follow in her footsteps and become a teacher. An loves her grandmother but dreams of being a designer. After many talks, her grandmother agreed to support An's choice.","statements":["An's grandmother tells stories about the past.","She wants An to become a teacher.","An dreams of being a designer.","Her grandmother refused to support her."],"answer":["T","T","T","F"],"explain":"Bà muốn An làm giáo viên nhưng cuối cùng đồng ý ủng hộ ước mơ làm thiết kế của An."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Mrs Mai has two teenage children. She sets three house rules: be home by 9 p.m., finish homework before playing games, and no phones at dinner. Her children sometimes complain, but they understand these rules show love and care.","sub_questions":[{"q":"How many house rules does Mrs Mai set?","options":["A. Two.","B. Three.","C. Four.","D. Five."],"answer":"B"},{"q":"What do the children think about the rules?","options":["A. They hate them.","B. They understand the rules show love.","C. They never follow them.","D. They want more rules."],"answer":"B"}],"explain":"Bà Mai đặt 3 quy định; các con hiểu đó là tình yêu thương."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letters 'th' are pronounced differently from the others.","options":["A. thank","B. those","C. think","D. three"],"answer":"B","explain":"'th' trong those đọc là /ð/, còn trong thank, think, three đọc là /θ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. behave","B. gap","C. plan","D. value"],"answer":"A","explain":"Chữ 'a' trong behave đọc là /eɪ/, còn trong gap, plan, value đọc là /æ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. advise","B. family","C. parents","D. value"],"answer":"A","explain":"advise nhấn âm 2 /ədˈvaɪz/, còn family, parents, value nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"They had an ___ about money last night.","options":["A. argument","B. value","C. belief","D. privacy"],"answer":"A","explain":"argument là cuộc tranh cãi."},{"type":"mcq","level":"TH","points":0.25,"q":"Students ___ wear uniforms on Mondays. It is a school rule.","options":["A. have to","B. should","C. could","D. might"],"answer":"A","explain":"Nội quy trường bắt buộc → have to."},{"type":"mcq","level":"TH","points":0.25,"q":"We must learn to ___ our anger.","options":["A. control","B. lose","C. show","D. forget"],"answer":"A","explain":"control anger là kiểm soát cơn giận."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["allow","cho phép"],["forbid","cấm"],["limit","giới hạn"],["control","kiểm soát"],["belief","niềm tin"]],"explain":"allow: cho phép; forbid: cấm; limit: giới hạn; control: kiểm soát; belief: niềm tin."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["should","more","sleep","You","get"],"answer":"You should get more sleep.","explain":"Câu đúng: You should get more sleep. (should + V)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: I ___ go now. It is late.","answer":"have","explain":"Hoàn cảnh bắt buộc → have to."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: They had a serious ___ about money. (argue)","answer":"argument","explain":"Sau tính từ serious cần danh từ: argument (cuộc tranh cãi)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Binh's parents are very strict. He must do homework before dinner and cannot play games on weekdays. At first Binh felt unhappy, but now he understands his parents want him to study well. He plans to talk to them about relaxing the rules on weekends.","statements":["Binh's parents are strict.","Binh can play games on weekdays.","Binh understands his parents' wish.","He wants to discuss weekend rules."],"answer":["T","F","T","T"],"explain":"Bình không được chơi game ngày thường; cậu muốn bàn về việc nới lỏng quy định cuối tuần."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Grandma, why did you get married so young? B: In my time, girls often married at 18. A: Did your parents choose your husband? B: Yes, but I was happy. We respected each other. A: Times have changed a lot, Grandma.","sub_questions":[{"q":"When did Grandma get married?","options":["A. At 16.","B. At 18.","C. At 20.","D. At 25."],"answer":"B"},{"q":"Who chose her husband?","options":["A. She herself.","B. Her parents.","C. Her friends.","D. Nobody."],"answer":"B"}],"explain":"Bà kết hôn năm 18 tuổi; bố mẹ bà đã chọn chồng cho bà."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. gap","B. plan","C. family","D. behave"],"answer":"D","explain":"Chữ 'a' trong behave đọc là /eɪ/, còn trong gap, plan, family đọc là /æ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'u' is pronounced differently from the others.","options":["A. study","B. trust","C. must","D. curious"],"answer":"D","explain":"Chữ 'u' trong curious đọc là /jʊə/, còn trong study, trust, must đọc là /ʌ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. control","B. follow","C. value","D. study"],"answer":"A","explain":"control nhấn âm 2 /kənˈtrəʊl/, còn follow, value, study nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Family ___ are passed down from generation to generation.","options":["A. values","B. conflicts","C. arguments","D. controls"],"answer":"A","explain":"values là các giá trị được truyền từ thế hệ này sang thế hệ khác."},{"type":"mcq","level":"TH","points":0.25,"q":"You ___ eat so much fast food. It is bad for you.","options":["A. shouldn't","B. mustn't","C. don't have to","D. couldn't"],"answer":"A","explain":"Lời khuyên không nên → shouldn't."},{"type":"mcq","level":"TH","points":0.25,"q":"A: My mum doesn't allow me to use my phone. B: ___","options":["A. Try to understand her viewpoint.","B. Use it secretly.","C. Argue with her.","D. Buy a new one."],"answer":"A","explain":"Nên cố hiểu quan điểm của mẹ thay vì cãi lại."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["viewpoint","quan điểm"],["argument","cuộc tranh cãi"],["privacy","sự riêng tư"],["curfew","giờ giới nghiêm"],["generation gap","khoảng cách thế hệ"]],"explain":"viewpoint: quan điểm; argument: cuộc tranh cãi; privacy: sự riêng tư; curfew: giờ giới nghiêm; generation gap: khoảng cách thế hệ."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["They","apologise","should","to","their","parents"],"answer":"They should apologise to their parents.","explain":"Câu đúng: They should apologise to their parents."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: You ___ smoke in this area.","answer":"mustn't","explain":"Bị cấm → mustn't."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Parents' ___ helps children grow. (encourage)","answer":"encouragement","explain":"Sau sở hữu cần danh từ: encouragement (sự động viên)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). The Nguyen family has dinner together every evening. During dinner, no one uses phones. They share stories about their day and discuss problems. Mr Nguyen believes family meals keep everyone close and reduce the generation gap.","statements":["The Nguyen family eats dinner together daily.","Phones are allowed at dinner.","They share stories and discuss problems.","Family meals help reduce the generation gap."],"answer":["T","F","T","T"],"explain":"Bữa tối không ai dùng điện thoại; cùng chia sẻ giúp thu hẹp khoảng cách thế hệ."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Hello, everyone. Today I want to talk about family rules. Good rules protect children, but too many rules can cause stress. Parents should explain the reasons for rules and listen to children's opinions. Children should also respect their parents' decisions.","sub_questions":[{"q":"What can too many rules cause?","options":["A. Happiness.","B. Stress.","C. Freedom.","D. Money."],"answer":"B"},{"q":"What should parents do?","options":["A. Make more rules.","B. Explain reasons and listen to children.","C. Punish children.","D. Ignore children."],"answer":"B"}],"explain":"Quá nhiều quy định gây căng thẳng; bố mẹ nên giải thích lý do và lắng nghe con."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letters 'oo' are pronounced differently from the others.","options":["A. room","B. look","C. foot","D. good"],"answer":"A","explain":"'oo' trong room đọc là /uː/, còn trong look, foot, good đọc là /ʊ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. parents","B. behave","C. gap","D. plan"],"answer":"B","explain":"Chữ 'a' trong behave đọc là /eɪ/, còn trong parents, gap, plan đọc là /æ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. follow","B. decide","C. study","D. limit"],"answer":"B","explain":"decide nhấn âm 2 /dɪˈsaɪd/, còn follow, study, limit nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Children should ___ their parents.","options":["A. obey","B. control","C. limit","D. forbid"],"answer":"A","explain":"obey là vâng lời bố mẹ."},{"type":"mcq","level":"TH","points":0.25,"q":"We ___ hurry or we will miss the bus.","options":["A. must","B. should","C. could","D. might"],"answer":"A","explain":"Cần thiết gấp (kẻo lỡ xe) → must."},{"type":"mcq","level":"TH","points":0.25,"q":"Good ___ helps avoid family conflicts.","options":["A. communication","B. control","C. limit","D. permission"],"answer":"A","explain":"communication (giao tiếp tốt) giúp tránh mâu thuẫn gia đình."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["nuclear family","gia đình hạt nhân"],["extended family","gia đình nhiều thế hệ"],["behaviour","hành vi"],["attitude","thái độ"],["value","giá trị"]],"explain":"nuclear family: gia đình hạt nhân; extended family: gia đình nhiều thế hệ; behaviour: hành vi; attitude: thái độ; value: giá trị."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["Drivers","stop","must","at","lights","red"],"answer":"Drivers must stop at red lights.","explain":"Câu đúng: Drivers must stop at red lights."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: Students ___ bring phones to the exam room.","answer":"mustn't","explain":"Bị cấm mang điện thoại vào phòng thi → mustn't."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: She always shows ___ to her elders. (respectful)","answer":"respect","explain":"Sau shows cần danh từ: respect (sự tôn trọng)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). In many Asian countries, children are taught to respect and care for elderly parents. It is common for three generations to live under one roof. Young people help with housework while grandparents look after small children. This tradition strengthens family bonds.","statements":["Asian children learn to respect elderly parents.","Three generations often live together.","Grandparents never help with children.","The tradition strengthens family bonds."],"answer":["T","T","F","T"],"explain":"Ông bà trông cháu nhỏ; truyền thống này gắn kết gia đình."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Mum, why can't I have my own room? B: Because we don't have a spare room, dear. A: But I need privacy to study. B: You can study in the living room after dinner. It is quiet then. A: OK, I will try.","sub_questions":[{"q":"What does the child want?","options":["A. A new phone.","B. His own room.","C. More money.","D. A bike."],"answer":"B"},{"q":"What does Mum suggest?","options":["A. Study in the living room after dinner.","B. Share a room.","C. Study at school.","D. Buy a house."],"answer":"A"}],"explain":"Đứa trẻ muốn phòng riêng; mẹ gợi ý học ở phòng khách sau bữa tối."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'u' is pronounced differently from the others.","options":["A. curious","B. study","C. trust","D. must"],"answer":"A","explain":"Chữ 'u' trong curious đọc là /jʊə/, còn trong study, trust, must đọc là /ʌ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'g' is pronounced differently from the others.","options":["A. generation","B. age","C. change","D. argue"],"answer":"D","explain":"Chữ 'g' trong argue đọc là /ɡ/, còn trong generation, age, change đọc là /dʒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. study","B. trust","C. behave","D. must"],"answer":"C","explain":"behave nhấn âm 2 /bɪˈheɪv/, còn study, trust, must nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Parents should not ___ everything their children do.","options":["A. control","B. respect","C. love","D. support"],"answer":"A","explain":"control là kiểm soát mọi thứ — điều bố mẹ không nên làm."},{"type":"mcq","level":"TH","points":0.25,"q":"He ___ apologise for his rude behaviour.","options":["A. should","B. must","C. has to","D. could"],"answer":"A","explain":"Lời khuyên nên xin lỗi → should."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Let's talk about our problems openly. B: ___","options":["A. Good idea.","B. No way.","C. I am busy.","D. Never."],"answer":"A","explain":"Đề xuất nói chuyện thẳng thắn → đồng ý: Good idea."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["permission","sự cho phép"],["limit","giới hạn"],["control","kiểm soát"],["allow","cho phép"],["forbid","cấm"]],"explain":"permission: sự cho phép; limit: giới hạn; control: kiểm soát; allow: cho phép; forbid: cấm."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["He","his","respect","should","elders"],"answer":"He should respect his elders.","explain":"Câu đúng: He should respect his elders."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: We ___ hurry. The bus is coming.","answer":"must","explain":"Cần thiết gấp → must."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: We should avoid family ___ (conflicting).","answer":"conflicts","explain":"Sau avoid cần danh từ số nhiều: conflicts (mâu thuẫn)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Duy is the eldest son, so his parents expect him to follow in his father's footsteps and become an engineer. Duy, however, wants to be a chef. He respects his parents but believes he should choose his own career. His parents are thinking about his viewpoint now.","statements":["Duy is the eldest son.","His parents want him to be a chef.","Duy wants to choose his own career.","His parents ignore his viewpoint."],"answer":["T","F","T","F"],"explain":"Bố mẹ muốn Duy làm kỹ sư; Duy muốn làm đầu bếp và bố mẹ đang suy nghĩ về quan điểm của cậu."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"A survey shows 70 percent of teenagers argue with parents about phones and study time. Most arguments last less than 10 minutes. After arguing, 80 percent of teens say they feel sorry. Experts say short arguments are normal in families.","sub_questions":[{"q":"What do most teens argue about?","options":["A. Money.","B. Phones and study time.","C. Food.","D. Clothes."],"answer":"B"},{"q":"How do most teens feel after arguing?","options":["A. Happy.","B. Angry.","C. Sorry.","D. Proud."],"answer":"C"}],"explain":"70% thanh thiếu niên cãi nhau về điện thoại và giờ học; 80% cảm thấy hối hận sau đó."}]}]}
