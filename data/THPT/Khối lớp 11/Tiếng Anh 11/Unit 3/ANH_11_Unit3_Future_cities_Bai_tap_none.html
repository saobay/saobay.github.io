{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. city","B. live","C. build","D. driver"],"answer":"D","explain":"Chữ 'i' trong driver đọc là /aɪ/, còn trong city, live, build đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. modern","B. operate","C. problem","D. robot"],"answer":"D","explain":"Chữ 'o' trong robot đọc là /əʊ/, còn trong modern, operate, problem đọc là /ɒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. city","B. sensor","C. modern","D. detect"],"answer":"D","explain":"detect nhấn âm 2 /dɪˈtekt/, còn city, sensor, modern nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Future cities will be smart and ___.","options":["A. sustainable","B. old","C. small","D. dirty"],"answer":"A","explain":"sustainable là bền vững — tính chất của thành phố tương lai."},{"type":"mcq","level":"TH","points":0.25,"q":"This soup ___ delicious.","options":["A. tastes","B. is tasting","C. taste","D. tasting"],"answer":"A","explain":"taste là động từ nối, sau nó dùng tính từ: tastes delicious."},{"type":"mcq","level":"TH","points":0.25,"q":"A: What will future cities be like? B: ___","options":["A. They will be smart and green.","B. I don't know.","C. Cities are big.","D. I live in a city."],"answer":"A","explain":"Trả lời đúng câu hỏi về thành phố tương lai: thông minh và xanh."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["sustainable","bền vững"],["sensor","cảm biến"],["detect","phát hiện"],["upgrade","nâng cấp"],["livable","đáng sống"]],"explain":"sustainable: bền vững; sensor: cảm biến; detect: phát hiện; upgrade: nâng cấp; livable: đáng sống."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["will","cities","smart","Future","be"],"answer":"Future cities will be smart.","explain":"Câu đúng: Future cities will be smart."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: This soup tastes ___.","answer":"delicious","explain":"Sau động từ nối taste dùng tính từ: delicious."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: We need ___ development for the future. (sustain)","answer":"sustainable","explain":"Trước danh từ development cần tính từ: sustainable."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). In smart cities, sensors detect traffic congestion and control street lights automatically. People use mobile apps to find parking spaces and pay for buses. These technologies save time and reduce pollution. Experts believe smart cities will be more livable in the future.","statements":["Sensors detect traffic in smart cities.","People use apps to find parking.","Technology increases pollution.","Smart cities will be more livable."],"answer":["T","T","F","T"],"explain":"Công nghệ giúp tiết kiệm thời gian và giảm ô nhiễm, không làm tăng ô nhiễm."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe bài nói và trả lời câu hỏi.","audio_text":"Welcome to our smart city tour. On your left are solar panels providing clean energy. Ahead is the pedestrian zone with no cars allowed. Sensors under the road detect traffic and guide drivers to free parking spaces.","sub_questions":[{"q":"What provides clean energy?","options":["A. Wind fans.","B. Solar panels.","C. Batteries.","D. Rivers."],"answer":"B"},{"q":"What do road sensors do?","options":["A. Count people.","B. Detect traffic and guide drivers.","C. Clean streets.","D. Water trees."],"answer":"B"}],"explain":"Tấm pin mặt trời cung cấp năng lượng sạch; cảm biến phát hiện giao thông và hướng dẫn chỗ đỗ xe."}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'e' is pronounced differently from the others.","options":["A. pedestrian","B. efficient","C. detect","D. green"],"answer":"D","explain":"Chữ 'e' trong green đọc là /iː/, còn trong pedestrian, efficient, detect đọc là /e/ hoặc /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 's' is pronounced differently from the others.","options":["A. stops","B. costs","C. sensors","D. operates"],"answer":"C","explain":"Chữ 's' trong sensors đọc là /z/, còn trong stops, costs, operates đọc là /s/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. modern","B. sensor","C. efficient","D. city"],"answer":"C","explain":"efficient nhấn âm 2 /ɪˈfɪʃnt/, còn modern, sensor, city nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"___ will detect traffic and control lights.","options":["A. Sensors","B. Drivers","C. Trees","D. Houses"],"answer":"A","explain":"Sensors (cảm biến) phát hiện giao thông và điều khiển đèn."},{"type":"mcq","level":"TH","points":0.25,"q":"I ___ what you mean.","options":["A. understand","B. am understanding","C. understands","D. understanding"],"answer":"A","explain":"understand là động từ trạng thái, không dùng thì tiếp diễn."},{"type":"mcq","level":"TH","points":0.25,"q":"We need to reduce our ___ to protect the planet.","options":["A. carbon footprint","B. traffic light","C. sensor","D. building"],"answer":"A","explain":"carbon footprint là lượng khí thải carbon cần giảm."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["operate","vận hành"],["efficient","hiệu quả"],["renewable","có thể tái tạo"],["pedestrian zone","khu vực dành cho người đi bộ"],["infrastructure","cơ sở hạ tầng"]],"explain":"operate: vận hành; efficient: hiệu quả; renewable: có thể tái tạo; pedestrian zone: khu vực dành cho người đi bộ; infrastructure: cơ sở hạ tầng."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["detect","Sensors","traffic","will"],"answer":"Sensors will detect traffic.","explain":"Câu đúng: Sensors will detect traffic."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: She feels ___ after work.","answer":"tired","explain":"Sau động từ nối feel dùng tính từ: tired."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The new system is very ___. (efficiency)","answer":"efficient","explain":"Sau very cần tính từ: efficient (hiệu quả)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Copenhagen is one of the most livable cities in the world. The city has wide pedestrian zones and safe bicycle lanes. People prefer riding bikes to driving cars. As a result, the air is clean and traffic congestion is rare.","statements":["Copenhagen is a livable city.","There are wide pedestrian zones.","People prefer cars to bikes.","Traffic congestion is common."],"answer":["T","T","F","F"],"explain":"Người dân thích đi xe đạp hơn ô tô; tắc đường hiếm khi xảy ra."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"A: How will people travel in future cities? B: They will use electric buses and driverless cars. A: Will there be traffic jams? B: Sensors will control traffic lights, so congestion will be rare. A: That sounds great!","sub_questions":[{"q":"How will people travel?","options":["A. By horse.","B. By electric buses and driverless cars.","C. By plane.","D. On foot only."],"answer":"B"},{"q":"Why will congestion be rare?","options":["A. No one travels.","B. Sensors control traffic lights.","C. Cars are banned.","D. Roads are wider."],"answer":"B"}],"explain":"Người dân dùng xe buýt điện và xe tự lái; cảm biến điều khiển đèn giao thông nên ít tắc đường."}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letters 'oo' are pronounced differently from the others.","options":["A. school","B. foot","C. food","D. room"],"answer":"D","explain":"'oo' trong room đọc là /uː/, còn trong school, foot, food đọc là /ʊ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. smart","B. traffic","C. travel","D. plan"],"answer":"A","explain":"Chữ 'a' trong smart đọc là /ɑː/, còn trong traffic, travel, plan đọc là /æ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. future","B. public","C. sustain","D. city"],"answer":"C","explain":"sustain nhấn âm 2 /səˈsteɪn/, còn future, public, city nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"We should use ___ energy like solar power.","options":["A. renewable","B. old","C. dirty","D. nuclear"],"answer":"A","explain":"renewable energy là năng lượng tái tạo như điện mặt trời."},{"type":"mcq","level":"TH","points":0.25,"q":"She ___ a new apartment in the city centre.","options":["A. owns","B. is owning","C. own","D. owning"],"answer":"A","explain":"own là động từ trạng thái (sở hữu), không dùng tiếp diễn."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Do you like living in the city? B: ___","options":["A. Yes, it is convenient and modern.","B. No, I hate cities.","C. Cities are dirty.","D. I live far away."],"answer":"A","explain":"Trả lời tích cực và đúng trọng tâm câu hỏi."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["sustain","duy trì"],["spacious","rộng rãi"],["eco-friendly","thân thiện với môi trường"],["carbon footprint","dấu chân carbon"],["traffic congestion","tắc nghẽn giao thông"]],"explain":"sustain: duy trì; spacious: rộng rãi; eco-friendly: thân thiện với môi trường; carbon footprint: dấu chân carbon; traffic congestion: tắc nghẽn giao thông."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["should","We","energy","renewable","use"],"answer":"We should use renewable energy.","explain":"Câu đúng: We should use renewable energy."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: I ___ what you mean.","answer":"understand","explain":"understand là động từ trạng thái, chia thì hiện tại đơn."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Solar power is ___ energy. (renew)","answer":"renewable","explain":"Trước danh từ energy cần tính từ: renewable."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Singapore is famous for its green buildings. Many skyscrapers have gardens on their roofs. The city uses technology to save water and energy. People are encouraged to use public transport instead of private cars.","statements":["Singapore is famous for green buildings.","Skyscrapers have roof gardens.","Technology wastes water.","People should use public transport."],"answer":["T","T","F","T"],"explain":"Công nghệ giúp tiết kiệm nước và năng lượng, không lãng phí."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"Good morning. Today we visit a smart home. Lights turn on automatically when you enter. The fridge orders food when it is empty. The air conditioner keeps the perfect temperature. All devices save energy.","sub_questions":[{"q":"What happens when you enter the smart home?","options":["A. Music plays.","B. Lights turn on automatically.","C. Doors lock.","D. TV turns on."],"answer":"B"},{"q":"What does the fridge do?","options":["A. Cooks food.","B. Orders food when empty.","C. Cleans itself.","D. Makes  đại; smart: thông minh."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["is","This","livable","city","very"],"answer":"This city is very livable.","explain":"Câu đúng: This city is very livable. (be + tính từ)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: Future cities will ___ smart.","answer":"be","explain":"will + be (động từ nối)."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The city is more ___ now. (live)","answer":"livable","explain":"Sau more cần tính từ: livable (đáng sống)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). In the future, driverless cars will carry passengers safely. These cars use sensors and cameras to detect obstacles. They can reduce accidents caused by human errors. However, they are still expensive today.","statements":["Driverless cars will carry passengers.","They use sensors to detect obstacles.","They may reduce human-error accidents.","They are cheap today."],"answer":["T","T","T","F"],"explain":"Xe tự lái hiện vẫn còn đắt, chưa rẻ."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"A: Mum, our city will build a new metro line. B: That's good news. When will it open? A: In 2028. It will reduce traffic congestion a lot. B: I hope the tickets are cheap. A: Students will get discount tickets.","sub_questions":[{"q":"When will the new metro line open?","options":["A. In 2026.","B. In 2028.","C. In 2030.","D. Next year."],"answer":"B"},{"q":"Who will get discount tickets?","options":["A. Workers.","B. Tourists.","C. Students.","D. Drivers."],"answer":"C"}],"explain":"Tuyến metro mới mở năm 2028; học sinh được vé giảm giá."}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'e' is pronounced differently from the others.","options":["A. green","B. sensor","C. modern","D. detect"],"answer":"A","explain":"Chữ 'e' trong green đọc là /iː/, còn trong sensor, modern, detect đọc là /e/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'oo' are pronounced differently from the others.","options":["A. foot","B. food","C. school","D. good"],"answer":"D","explain":"'oo' trong good đọc là /ʊ/, còn trong foot, food, school đọc là /uː/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. future","B. public","C. detect","D. city"],"answer":"C","explain":"detect nhấn âm 2 /dɪˈtekt/, còn future, public, city nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Modern ___ helps cities run smoothly.","options":["A. infrastructure","B. traffic","C. pollution","D. noise"],"answer":"A","explain":"infrastructure là cơ sở hạ tầng hiện đại giúp thành phố vận hành tốt."},{"type":"mcq","level":"TH","points":0.25,"q":"This music ___ familiar to me.","options":["A. sounds","B. is sounding","C. sound","D. sounding"],"answer":"A","explain":"sound là động từ nối: sounds familiar."},{"type":"mcq","level":"TH","points":0.25,"q":"A: How can we make cities cleaner? B: ___","options":["A. By using public transport.","B. By driving more cars.","C. By building factories.","D. By cutting trees."],"answer":"A","explain":"Dùng phương tiện công cộng giúp thành phố sạch hơn."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["sustainable","bền vững"],["operate","vận hành"],["efficient","hiệu quả"],["renewable","có thể tái tạo"],["sensor","cảm biến"]],"explain":"sustainable: bền vững; operate: vận hành; efficient: hiệu quả; renewable: có thể tái tạo; sensor: cảm biến."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["tastes","soup","delicious","This"],"answer":"This soup tastes delicious.","explain":"Câu đúng: This soup tastes delicious. (động từ nối + tính từ)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: Sensors ___ detect traffic.","answer":"can","explain":"can + V nguyên thể diễn tả khả năng."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Modern ___ is important. (infrastructural)","answer":"infrastructure","explain":"Sau tính từ modern cần danh từ: infrastructure (cơ sở hạ tầng)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Urban dwellers often suffer from air pollution and noise. Future cities plan to plant more trees and build parks on rooftops. Green spaces cool the air and give people places to relax. Experts say every city needs more green areas.","statements":["City dwellers suffer from pollution and noise.","Future cities will plant more trees.","Green spaces cool the air.","Cities need fewer green areas."],"answer":["T","T","T","F"],"explain":"Chuyên gia cho rằng mọi thành phố cần NHIỀU không gian xanh hơn."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"Excuse me, how can I get to the pedestrian zone? Go straight and turn left at the traffic lights. It is about 500 metres from here. Cars are not allowed there, so you must walk. You will see many shops and cafes.","sub_questions":[{"q":"How far is the pedestrian zone?","options":["A. 50 metres.","B. 500 metres.","C. 5 kilometres.","D. 15 metres."],"answer":"B"},{"q":"Why must visitors walk?","options":["A. Cars are not allowed.","B. It is raining.","C. Roads are broken.","D. Buses are full."],"answer":"A"}],"explain":"Khu đi bộ cách 500m; ô tô không được vào nên phải đi bộ."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. modern","B. operate","C. problem","D. sensor"],"answer":"D","explain":"Chữ 'o' trong sensor đọc là /ə/, còn trong modern, operate, problem đọc là /ɒ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. city","B. live","C. driver","D. build"],"answer":"C","explain":"Chữ 'i' trong driver đọc là /aɪ/, còn trong city, live, build đọc là /ɪ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. sensor","B. modern","C. pedestrian","D. problem"],"answer":"C","explain":"pedestrian nhấn âm 2 /pəˈdestriən/, còn sensor, modern, problem nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"This building is very ___, with large rooms.","options":["A. spacious","B. small","C. dark","D. old"],"answer":"A","explain":"spacious là rộng rãi, phù hợp với phòng lớn."},{"type":"mcq","level":"TH","points":0.25,"q":"He ___ tired after the long journey.","options":["A. feels","B. is feeling","C. feel","D. feeling"],"answer":"A","explain":"feel là động từ nối: feels tired."},{"type":"mcq","level":"TH","points":0.25,"q":"The new metro line will ___ travel time.","options":["A. reduce","B. increase","C. waste","D. stop"],"answer":"A","explain":"reduce travel time là rút ngắn thời gian đi lại."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["detect","phát hiện"],["upgrade","nâng cấp"],["sustain","duy trì"],["spacious","rộng rãi"],["eco-friendly","thân thiện với môi trường"]],"explain":"detect: phát hiện; upgrade: nâng cấp; sustain: duy trì; spacious: rộng rãi; eco-friendly: thân thiện với môi trường."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["will","government","The","system","upgrade","the"],"answer":"The government will upgrade the system.","explain":"Câu đúng: The government will upgrade the system."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: The flowers smell ___.","answer":"sweet","explain":"Sau động từ nối smell dùng tính từ: sweet."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The streets are ___ and clean. (space)","answer":"spacious","explain":"Sau are cần tính từ: spacious (rộng rãi)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Electric buses are becoming popular in many cities. They do not produce smoke and are quieter than diesel buses. Although electric buses cost more at first, they save money over time. Many cities plan to replace all old buses by 2030.","statements":["Electric buses are popular.","They produce a lot of smoke.","They save money over time.","Cities will replace old buses by 2030."],"answer":["T","F","T","T"],"explain":"Xe buýt điện không thải khói và tiết kiệm tiền về lâu dài."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Hello, class. Our project is about future transport. We think flying taxis will appear in big cities by 2040. They will carry two passengers and avoid traffic congestion. They will use clean energy and be very quiet.","sub_questions":[{"q":"When will flying taxis appear?","options":["A. By 2030.","B. By 2040.","C. By 2050.","D. Next year."],"answer":"B"},{"q":"How many passengers will they carry?","options":["A. One.","B. Two.","C. Four.","D. Ten."],"answer":"B"}],"explain":"Taxi bay xuất hiện vào năm 2040, chở 2 hành khách."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letters 'th' are pronounced differently from the others.","options":["A. think","B. that","C. three","D. thing"],"answer":"B","explain":"'th' trong that đọc là /ð/, còn trong think, three, thing đọc là /θ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 's' is pronounced differently from the others.","options":["A. cities","B. stops","C. costs","D. operates"],"answer":"A","explain":"Chữ 's' trong cities đọc là /z/, còn trong stops, costs, operates đọc là /s/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. think","B. that","C. renewable","D. city"],"answer":"C","explain":"renewable nhấn âm 2 /rɪˈnjuːəbl/, còn think, that, city nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Electric buses are ___ transport.","options":["A. eco-friendly","B. noisy","C. dirty","D. slow"],"answer":"A","explain":"eco-friendly là thân thiện với môi trường."},{"type":"mcq","level":"TH","points":0.25,"q":"I ___ this bag is yours.","options":["A. think","B. am thinking","C. thinks","D. thinking"],"answer":"A","explain":"think nghĩa là nghĩ rằng (trạng thái) → không dùng tiếp diễn."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Will robots do housework in the future? B: ___","options":["A. Probably yes.","B. I hate robots.","C. Robots are expensive.","D. Never ask me."],"answer":"A","explain":"Trả lời đúng câu hỏi Yes/No về tương lai."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["carbon footprint","dấu chân carbon"],["traffic congestion","tắc nghẽn giao thông"],["urban","thuộc đô thị"],["dweller","cư dân"],["skyscraper","tòa nhà chọc trời"]],"explain":"carbon footprint: dấu chân carbon; traffic congestion: tắc nghẽn giao thông; urban: thuộc đô thị; dweller: cư dân; skyscraper: tòa nhà chọc trời."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["flowers","sweet","The","smell"],"answer":"The flowers smell sweet.","explain":"Câu đúng: The flowers smell sweet. (động từ nối + tính từ)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: They ___ to live here.","answer":"want","explain":"want là động từ trạng thái, chia hiện tại đơn."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: We should protect the ___. (environmental)","answer":"environment","explain":"Sau the cần danh từ: environment (môi trường)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Rooftop gardens are popular in crowded cities. People grow vegetables and flowers on top of buildings. These gardens clean the air and reduce heat. They also give city dwellers fresh food and relaxing spaces.","statements":["Rooftop gardens are popular in crowded cities.","People grow food on rooftops.","Gardens make cities hotter.","Gardens give fresh food."],"answer":["T","T","F","T"],"explain":"Vườn trên mái giúp làm sạch không khí và giảm nhiệt, không làm nóng hơn."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Dad, what is a smart city? B: It is a city that uses technology to improve life. A: Like what? B: Like sensors that save water and apps that show bus times. A: Will our city become smart? B: Yes, the government is upgrading the infrastructure now.","sub_questions":[{"q":"What is a smart city?","options":["A. A big city.","B. A city using technology to improve life.","C. An old city.","D. A rich city."],"answer":"B"},{"q":"What is the government doing now?","options":["A. Building houses.","B. Upgrading infrastructure.","C. Planting trees.","D. Closing roads."],"answer":"B"}],"explain":"Thành phố thông minh dùng công nghệ cải thiện cuộc sống; chính phủ đang nâng cấp hạ tầng."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letters 'ea' are pronounced differently from the others.","options":["A. clean","B. mean","C. great","D. speak"],"answer":"C","explain":"'ea' trong great đọc là /eɪ/, còn trong clean, mean, speak đọc là /iː/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'g' is pronounced differently from the others.","options":["A. energy","B. change","C. age","D. green"],"answer":"D","explain":"Chữ 'g' trong green đọc là /ɡ/, còn trong energy, change, age đọc là /dʒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. clean","B. great","C. healthy","D. sustain"],"answer":"D","explain":"sustain nhấn âm 2 /səˈsteɪn/, còn clean, great, healthy nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"The government will ___ the old metro system.","options":["A. upgrade","B. destroy","C. close","D. forget"],"answer":"A","explain":"upgrade là nâng cấp hệ thống metro cũ."},{"type":"mcq","level":"TH","points":0.25,"q":"The sky ___ dark. It is going to rain.","options":["A. looks","B. is looking","C. look","D. looking"],"answer":"A","explain":"look là động từ nối: looks dark."},{"type":"mcq","level":"TH","points":0.25,"q":"City ___ enjoy modern services.","options":["A. dwellers","B. drivers","C. farmers","D. visitors"],"answer":"A","explain":"dwellers là cư dân thành phố."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["modern","hiện đại"],["smart","thông minh"],["city","thành phố"],["future","tương lai"],["build","xây dựng"]],"explain":"modern: hiện đại; smart: thông minh; city: thành phố; future: tương lai; build: xây dựng."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["She","tired","feels","today"],"answer":"She feels tired today.","explain":"Câu đúng: She feels tired today. (feel + tính từ)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: This music sounds ___.","answer":"familiar","explain":"Sau động từ nối sound dùng tính từ: familiar."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The ___ of the city is improving. (develop)","answer":"development","explain":"Sau the cần danh từ: development (sự phát triển)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Many young people move from rural areas to big cities for jobs and education. This causes overcrowding and housing problems. Future cities must plan better to welcome newcomers. Building satellite towns is one good solution.","statements":["Young people move to cities for jobs.","Migration causes overcrowding.","Future cities need better planning.","Satellite towns are a bad solution."],"answer":["T","T","T","F"],"explain":"Xây thị trấn vệ tinh là một giải pháp TỐT."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Attention, passengers. The smart bus number 12 is arriving. It runs on clean energy and has free wifi. Please use the app to pay for your ticket. The next stop is the central pedestrian zone.","sub_questions":[{"q":"What is special about bus 12?","options":["A. It is very fast.","B. It runs on clean energy with free wifi.","C. It is free.","D. It has no driver."],"answer":"B"},{"q":"How do passengers pay?","options":["A. By cash.","B. By card only.","C. By app.","D. They don't pay."],"answer":"C"}],"explain":"Xe buýt 12 chạy bằng năng lượng sạch, có wifi miễn phí; trả vé qua app."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. modern","B. operate","C. problem","D. obey"],"answer":"D","explain":"Chữ 'o' trong obey đọc là /əʊ/, còn trong modern, operate, problem đọc là /ɒ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. traffic","B. travel","C. smart","D. plan"],"answer":"C","explain":"Chữ 'a' trong smart đọc là /ɑː/, còn trong traffic, travel, plan đọc là /æ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. live","B. build","C. city","D. efficient"],"answer":"D","explain":"efficient nhấn âm 2 /ɪˈfɪʃnt/, còn live, build, city nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Sensors can ___ accidents quickly.","options":["A. detect","B. hide","C. cause","D. ignore"],"answer":"A","explain":"detect là phát hiện tai nạn nhanh chóng."},{"type":"mcq","level":"TH","points":0.25,"q":"She ___ happy with her new job.","options":["A. seems","B. is seeming","C. seem","D. seeming"],"answer":"A","explain":"seem là động từ nối/trạng thái: seems happy."},{"type":"mcq","level":"TH","points":0.25,"q":"A: What is a smart city? B: ___","options":["A. A city using technology to improve life.","B. A very old city.","C. A small village.","D. A dirty city."],"answer":"A","explain":"Smart city là thành phố dùng công nghệ để cải thiện cuộc sống."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["sustainable","bền vững"],["sensor","cảm biến"],["detect","phát hiện"],["upgrade","nâng cấp"],["efficient","hiệu quả"]],"explain":"sustainable: bền vững; sensor: cảm biến; detect: phát hiện; upgrade: nâng cấp; efficient: hiệu quả."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["understand","I","mean","you","what"],"answer":"I understand what you mean.","explain":"Câu đúng: I understand what you mean."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: She ___ a new car.","answer":"owns","explain":"own là động từ trạng thái: she owns."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Electric cars are ___. (eco-friend)","answer":"eco-friendly","explain":"Sau are cần tính từ: eco-friendly."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). By 2050, two out of three people will live in cities. Future cities must provide enough homes, jobs and clean air. Technology will help manage energy and transport. However, technology alone cannot solve every problem; people's habits matter too.","statements":["Most people will live in cities by 2050.","Cities need homes, jobs and clean air.","Technology manages energy and transport.","Technology solves every problem alone."],"answer":["T","T","T","F"],"explain":"Công nghệ không thể tự giải quyết mọi vấn đề; thói quen con người cũng quan trọng."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Excuse me, is this the pedestrian zone? B: Yes. No cars are allowed here. A: Where can I park my car? B: There is a smart car park 200 metres ahead. The app will guide you to a free space. A: Thank you very much.","sub_questions":[{"q":"Are cars allowed in the pedestrian zone?","options":["A. Yes.","B. No.","C. Sometimes.","D. Only at night."],"answer":"B"},{"q":"How will the driver find a free space?","options":["A. Ask people.","B. Use the app.","C. Drive around.","D. Call the police."],"answer":"B"}],"explain":"Ô tô không được vào khu đi bộ; app hướng dẫn chỗ đỗ xe trống."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. live","B. build","C. city","D. driver"],"answer":"D","explain":"Chữ 'i' trong driver đọc là /aɪ/, còn trong live, build, city đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'e' is pronounced differently from the others.","options":["A. pedestrian","B. efficient","C. green","D. detect"],"answer":"C","explain":"Chữ 'e' trong green đọc là /iː/, còn trong pedestrian, efficient, detect đọc là /e/ hoặc /ɪ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. smart","B. traffic","C. travel","D. upgrade"],"answer":"D","explain":"upgrade (động từ) nhấn âm 2 /ˌʌpˈɡreɪd/, còn smart, traffic, travel nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"A ___ city is comfortable to live in.","options":["A. livable","B. noisy","C. crowded","D. polluted"],"answer":"A","explain":"livable là đáng sống, thoải mái để sinh sống."},{"type":"mcq","level":"TH","points":0.25,"q":"They ___ to live in a smart city.","options":["A. want","B. are wanting","C. wants","D. wanting"],"answer":"A","explain":"want là động từ trạng thái, không dùng tiếp diễn."},{"type":"mcq","level":"TH","points":0.25,"q":"Skyscrapers make the city look ___.","options":["A. modern","B. old","C. ugly","D. small"],"answer":"A","explain":"look + tính từ: look modern (trông hiện đại)."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["operate","vận hành"],["renewable","có thể tái tạo"],["pedestrian zone","khu vực dành cho người đi bộ"],["infrastructure","cơ sở hạ tầng"],["spacious","rộng rãi"]],"explain":"operate: vận hành; renewable: có thể tái tạo; pedestrian zone: khu vực dành cho người đi bộ; infrastructure: cơ sở hạ tầng; spacious: rộng rãi."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["seem","They","happy","today"],"answer":"They seem happy today.","explain":"Câu đúng: They seem happy today. (seem + tính từ)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: The sky looks ___.","answer":"dark","explain":"Sau động từ nối look dùng tính từ: dark."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Good ___ makes life easier. (transport)","answer":"transportation","explain":"Sau tính từ good cần danh từ: transportation (giao thông vận tải)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Da Nang is developing into a smart city. Free wifi covers the beaches and parks. Cameras and sensors help manage traffic. The city also builds more parks to keep the air fresh. Tourists love its clean streets.","statements":["Da Nang is becoming a smart city.","Free wifi covers beaches and parks.","Sensors help manage traffic.","Tourists dislike Da Nang."],"answer":["T","T","T","F"],"explain":"Du khách yêu thích đường phố sạch đẹp của Đà Nẵng."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Hi, I am Lan. I live in a new eco-friendly building. Solar panels on the roof give us electricity. Rain water is collected for the garden. We sort rubbish every day. Living here saves money and protects the planet.","sub_questions":[{"q":"Where does Lan live?","options":["A. In an old house.","B. In an eco-friendly building.","C. In a village.","D. In a hotel."],"answer":"B"},{"q":"What is rain water used for?","options":["A. Drinking.","B. The garden.","C. Cleaning cars.","D. Cooking."],"answer":"B"}],"explain":"Lan sống trong tòa nhà thân thiện môi trường; nước mưa dùng tưới vườn."}]}]}
