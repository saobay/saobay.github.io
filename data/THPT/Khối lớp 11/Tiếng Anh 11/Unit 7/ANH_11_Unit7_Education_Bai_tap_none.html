,"Her parents oppose her dream.","She hopes for a scholarship."],"answer":["T","T","F","T"],"explain":"Bố mẹ ủng hộ ước mơ của Hoa."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Welcome to our career day! Today you will meet nurses, engineers and teachers. Ask them about their jobs. At 10 a.m., there is a talk on choosing the right career. Do not miss it!","sub_questions":[{"q":"What is today?","options":["A. Sports day.","B. Career day.","C. Art day.","D. Music day."],"answer":"B"},{"q":"When is the talk on careers?","options":["A. At 9 a.m.","B. At 10 a.m.","C. At 11 a.m.","D. At 2 p.m."],"answer":"B"}],"explain":"Hôm nay là ngày hội nghề nghiệp; buổi nói chuyện lúc 10 giờ sáng."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. time","B. live","C. skill","D. diploma"],"answer":"A","explain":"Chữ 'i' trong time đọc là /aɪ/, còn trong live, skill, diploma đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'ch' are pronounced differently from the others.","options":["A. change","B. teach","C. school","D. choice"],"answer":"C","explain":"'ch' trong school đọc là /k/, còn trong change, teach, choice đọc là /tʃ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. time","B. enrol","C. live","D. skill"],"answer":"B","explain":"enrol nhấn âm 2 /ɪnˈrəʊl/, còn time, live, skill nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"He applied ___ a scholarship last month.","options":["A. for","B. to","C. at","D. on"],"answer":"A","explain":"apply for là nộp đơn xin học bổng."},{"type":"mcq","level":"TH","points":0.25,"q":"Don't be late, she said. → She told me ___ be late.","options":["A. not to","B. not","C. don't","D. no"],"answer":"A","explai : Why do you want to be a teacher, Lan? B: I love children. A: Is the salary good? B: Not very high, but the job is meaningful. A: I think you will be a great teacher.","sub_questions":[{"q":"Why does Lan want to be a teacher?","options":["A. For money.","B. She loves children.","C. For fame.","D. Her parents force her."],"answer":"B"},{"q":"What does her friend think?","options":["A. She will be great.","B. She will fail.","C. Teaching is bad.","D. She should quit."],"answer":"A"}],"explain":"Lan yêu trẻ em; bạn tin cô sẽ là giáo viên tuyệt vời."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. diploma","B. option","C. doctor","D. job"],"answer":"A","explain":"Chữ 'o' trong diploma đọc là /əʊ/, còn trong option, doctor, job đọc là /ɒ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'g' is pronounced differently from the others.","options":["A. change","B. age","C. get","D. degree"],"answer":"C","explain":"Chữ 'g' trong get đọc là /ɡ/, còn trong change, age, degree đọc là /dʒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. diploma","B. apply","C. option","D. doctor"],"answer":"B","explain":"apply nhấn âm 2 /əˈplaɪ/, còn diploma, option, doctor nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Many students take a ___ year to travel.","options":["A. gap","B. school","C. work","D. long"],"answer":"A","explain":"gap year là năm nghỉ sau tốt nghiệp."},{"type":"mcq","level":"TH","points":0.25,"q":"Are you busy? he asked. → He asked if I ___ busy.","options":["A. was","B. am","C. are","D. were"],"answer":"A","explain":"Lùi thì: am → was."},{"type":"mcq","level":"TH","points":0.25,"q":"University ___ is expensive but useful.","options":["A. education","B. game","C. food","D. travel"],"answer":"A","explain":"educat ?","options":["A. He is a teacher.","B. He is an engineer.","C. He is a doctor.","D. He is a farmer."],"answer":"B"},{"q":"What is his advice?","options":["A. Choose what you love and work hard.","B. Only study maths.","C. Never work.","D. Change jobs often."],"answer":"A"}],"explain":"Diễn giả là kỹ sư; lời khuyên: chọn điều mình yêu và chăm chỉ."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. academic","B. apply","C. plan","D. graduate"],"answer":"B","explain":"Chữ 'a' trong apply đọc là /ə/, còn trong academic, plan, graduate đọc là /æ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'oo' are pronounced differently from the others.","options":["A. school","B. foot","C. good","D. cool"],"answer":"C","explain":"'oo' trong good đọc là /ʊ/, còn trong school, foot, cool đọc là /uː/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. academic","B. apply","C. plan","D. graduate"],"answer":"A","explain":"academic nhấn âm 3 /ˌækəˈdemɪk/, còn apply nhấn âm 2, plan và graduate nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Good ___ help you find a job.","options":["A. qualifications","B. games","C. foods","D. clothes"],"answer":"A","explain":"qualifications là trình độ chuyên môn giúp tìm việc."},{"type":"mcq","level":"TH","points":0.25,"q":"I can swim, she said. → She said she ___ swim.","options":["A. could","B. can","C. will","D. may"],"answer":"A","explain":"Lùi thì: can → could."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Would you like to study abroad? B: ___","options":["A. Yes, that is my dream.","B. No, I hate dreams.","C. Abroad is bad.","D. Never."],"answer":"A","explain":"Đồng ý với ước mơ du học."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pai
