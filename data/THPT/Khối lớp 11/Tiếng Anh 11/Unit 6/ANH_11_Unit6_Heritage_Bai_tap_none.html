ːv/, còn future, ruin, study nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"This ___ is 500 years old.","options":["A. monument","B. car","C. phone","D. book"],"answer":"A","explain":"monument là di tích 500 năm tuổi."},{"type":"mcq","level":"TH","points":0.25,"q":"They went to Hue ___ the citadel.","options":["A. to visit","B. visiting","C. visit","D. visited"],"answer":"A","explain":"to-V chỉ mục đích: to visit."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Do you like folk music? B: ___","options":["A. Yes, it is beautiful.","B. No, I hate music.","C. Folk music is bad.","D. Never."],"answer":"A","explain":"Trả lời tích cực về nhạc dân gian."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["heritage","di sản"],["preserve","bảo tồn"],["restore","trùng tu"],["propose","đề xuất"],["ruin","tàn tích"]],"explain":"heritage: di sản; preserve: bảo tồn; restore: trùng tu; propose: đề xuất; ruin: tàn tích."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["has","He","chance","a","to","study"],"answer":"He has a chance to study.","explain":"Câu đúng: He has a chance to study."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: We need money ___ the temple. (restore)","answer":"to restore","explain":"to-V chỉ mục đích: to restore."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: He is a famous ___. (history)","answer":"historian","explain":"Danh từ chỉ người: historian (nhà sử học)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Folk music is an important part of Vietnamese heritage. Quan Ho singing from Bac Ninh was recognised by UNESCO in 2009. Young people are learning these songs to keep the tradition alive. Schools organise folk music clubs for students.","statements":["Folk music is part of Vietnamese heritage.","Quan Ho was recognised in 2009.","Young people ignore folk songs.","Schools have folk music clubs."],"answer":["T","T","F","T"],"explain":"Người trẻ đang học các làn điệu để giữ truyền thống."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"Hello, class. Our history project is about ancient Ha Noi. We will visit the Old Quarter tomorrow. We will draw old houses and interview local people. Please bring your notebooks and cameras.","sub_questions":[{"q":"What is the project about?","options":["A. Modern Ha Noi.","B. Ancient Ha Noi.","C. Food.","D. Music."],"answer":"B"},{"q":"What should students bring?","options":["A. Books only.","B. Notebooks and cameras.","C. Food.","D. Money."],"answer":"B"}],"explain":"Dự án về Hà Nội xưa; học sinh mang vở và máy ảnh."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'e' is pronounced differently from the others.","options":["A. relic","B. get","C. preserve","D. he"],"answer":"D","explain":"Chữ 'e' trong he đọc là /iː/, còn trong relic, get, preserve đọc là /e/ hoặc /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. historic","B. live","C. build","D. kind"],"answer":"D","explain":"Chữ 'i' trong kind đọc là /aɪ/, còn trong historic, live, build đọc là /ɪ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. relic","B. study","C. preserve","D. folk"],"answer":"C","explain":"preserve nhấn âm 2 /prɪˈzɜːv/, còn relic, study, folk nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Folk songs are part of our ___ heritage.","options":["A. cultural","B. modern","C. new","D. foreign"],"answer":"A","explain":"cultural heritage là di sản văn hóa."},{"type":"mcq","level":"TH","points":0.25,"q":"We need money ___ the temple.","options":["A. to restore","B. restoring","C. restore","D. restored"],"answer":"A","explain":"to-V chỉ mục đích: to restore."},{"type":"mcq","level":"TH","points":0.25,"q":"They decided ___ the ancient wall.","options":["A. to protect","B. protecting","C. protect","D. protected"],"answer":"A","explain":"decide + to-V: to protect."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["monument","di tích"],["citadel","kinh thành"],["complex","quần thể"],["relic","di vật"],["folk","dân gian"]],"explain":"monument: di tích; citadel: kinh thành; complex: quần thể; relic: di vật; folk: dân gian."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["was","He","last","the","to","leave"],"answer":"He was the last to leave.","explain":"Câu đúng: He was the last to leave. (the last + to-V)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: It is interesting ___ folk songs. (learn)","answer":"to learn","explain":"It is + adj + to-V: to learn."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The site has great ___ value. (culture)","answer":"cultural","explain":"Trước danh từ value cần tính từ: cultural."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Many old buildings in Viet Nam are in bad condition. Rain and pollution damage them every year. Restoring them costs a lot of money. The government asks for donations to save these treasures.","statements":["Many old buildings are damaged.","Rain harms old buildings.","Restoration is cheap.","Donations help save heritage."],"answer":["T","T","F","T"],"explain":"Trùng tu tốn rất nhiều tiền, không rẻ."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"A: Mum, can we visit Hoi An this summer? B: Yes, we can. What do you want to see? A: The old houses and the Japanese bridge. B: Good. We will also try cao lau noodles. A: I can't wait!","sub_questions":[{"q":"Where will they go?","options":["A. To Hue.","B. To Hoi An.","C. To Ha Long.","D. To Da Nang."],"answer":"B"},{"q":"What food will they try?","options":["A. Pho.","B. Cao lau noodles.","C. Banh mi.","D. Spring rolls."],"answer":"B"}],"explain":"Gia đình sẽ đi Hội An hè này và thử món cao lầu."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. kind","B. live","C. build","D. historic"],"answer":"A","explain":"Chữ 'i' trong kind đọc là /aɪ/, còn trong live, build, historic đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'ch' are pronounced differently from the others.","options":["A. change","B. teach","C. school","D. rich"],"answer":"C","explain":"'ch' trong school đọc là /k/, còn trong change, teach, rich đọc là /tʃ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. kind","B. live","C. preserve","D. site"],"answer":"C","explain":"preserve nhấn âm 2 /prɪˈzɜːv/, còn kind, live, site nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"The museum keeps many ancient ___.","options":["A. relics","B. cars","C. phones","D. toys"],"answer":"A","explain":"relics là các di vật cổ."},{"type":"mcq","level":"TH","points":0.25,"q":"He was the last person ___ the room.","options":["A. to leave","B. leaving","C. leaves","D. left"],"answer":"A","explain":"Sau the last dùng to-V: to leave."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Let's visit the museum this weekend. B: ___","options":["A. Good idea.","B. No, museums are bad.","C. I hate museums.","D. Never."],"answer":"A","explain":"Đồng ý với đề xuất: Good idea."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["landscape","phong cảnh"],["cuisine","ẩm thực"],["heritage","di sản"],["preserve","bảo tồn"],["restore","trùng tu"]],"explain":"landscape: phong cảnh; cuisine: ẩm thực; heritage: di sản; preserve: bảo tồn; restore: trùng tu."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["need","We","money","to","restore"],"answer":"We need money to restore.","explain":"Câu đúng: We need money to restore. (to-V chỉ mục đích)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: He was the last person ___ the room. (leave)","answer":"to leave","explain":"Sau the last dùng to-V: to leave."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: ___ helps tourism grow. (promote)","answer":"Promotion","explain":"Đầu câu cần danh từ: Promotion (sự quảng bá)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Ao dai is a symbol of Vietnamese culture. It is worn on special occasions like Tet and weddings. Young designers are creating modern ao dai styles. Wearing ao dai makes Vietnamese people proud.","statements":["Ao dai is a cultural symbol.","It is worn on special days.","Designers ignore ao dai.","Ao dai makes people proud."],"answer":["T","T","F","T"],"explain":"Các nhà thiết kế trẻ đang sáng tạo kiểu áo dài hiện đại."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"Good afternoon. Today we visit an ancient village. The houses here are 200 years old. People still make pottery by hand. You can try making a small pot yourself.","sub_questions":[{"q":"How old are the houses?","options":["A. 100 years.","B. 200 years.","C. 300 years.","D. 50 years."],"answer":"B"},{"q":"What can visitors try?","options":["A. Cooking.","B. Making pottery.","C. Fishing.","D. Painting."],"answer":"B"}],"explain":"Nhà cổ 200 năm tuổi; du khách có thể thử làm gốm."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. restore","B. folk","C. monument","D. promote"],"answer":"A","explain":"Chữ 'o' trong restore đọc là /ɔː/, còn trong folk, monument, promote đọc là /əʊ/ hoặc /ɒ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'g' is pronounced differently from the others.","options":["A. change","B. age","C. get","D. heritage"],"answer":"C","explain":"Chữ 'g' trong get đọc là /ɡ/, còn trong change, age, heritage đọc là /dʒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. restore","B. folk","C. monument","D. promote"],"answer":"A","explain":"restore nhấn âm 2 /rɪˈstɔː/, còn folk, monument, promote nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Ha Long Bay is a natural ___ site.","options":["A. heritage","B. modern","C. new","D. small"],"answer":"A","explain":"heritage site là di sản (thiên nhiên)."},{"type":"mcq","level":"TH","points":0.25,"q":"She is the only student ___ full marks.","options":["A. to get","B. getting","C. gets","D. got"],"answer":"A","explain":"Sau the only dùng to-V: to get."},{"type":"mcq","level":"TH","points":0.25,"q":"She was the first woman ___ the award.","options":["A. to receive","B. receiving","C. receives","D. received"],"answer":"A","explain":"Sau the first dùng to-V: to receive."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["heritage","di sản"],["citadel","kinh thành"],["monument","di tích"],["ancient","cổ xưa"],["historic","mang tính lịch sử"]],"explain":"heritage: di sản; citadel: kinh thành; monument: di tích; ancient: cổ xưa; historic: mang tính lịch sử."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["is","It","to","interesting","learn"],"answer":"It is interesting to learn.","explain":"Câu đúng: It is interesting to learn. (It is + adj + to-V)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: This is the best way ___ the town. (explore)","answer":"to explore","explain":"Sau way dùng to-V: to explore."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The ___ of the citadel is urgent. (preserve)","answer":"preservation","explain":"Sau the cần danh từ: preservation (sự bảo tồn)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Vietnamese cuisine is famous around the world. Pho and banh mi are loved by many foreigners. Each region has its own special dishes. Food festivals help promote Vietnamese cuisine abroad.","statements":["Vietnamese cuisine is world-famous.","Foreigners love pho.","Regions share the same dishes.","Food festivals promote cuisine."],"answer":["T","T","F","T"],"explain":"Mỗi vùng miền có món ăn đặc trưng riêng."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"A: What is special about Hoi An, Ba? B: The old houses and lanterns. At night the town glows beautifully. A: Can we take a boat trip? B: Yes, on the Hoai River. It is very romantic.","sub_questions":[{"q":"What is special about Hoi An?","options":["A. Beaches.","B. Old houses and lanterns.","C. Mountains.","D. Markets."],"answer":"B"},{"q":"Where can they take a boat trip?","options":["A. On the Hoai River.","B. On the sea.","C. On a lake.","D. On a canal."],"answer":"A"}],"explain":"Hội An nổi tiếng nhà cổ và đèn lồng; đi thuyền trên sông Hoài."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. ancient","B. plan","C. appreciate","D. damage"],"answer":"A","explain":"Chữ 'a' trong ancient đọc là /eɪ/, còn trong plan, appreciate, damage đọc là /æ/ hoặc /ə/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'oo' are pronounced differently from the others.","options":["A. food","B. foot","C. good","D. cool"],"answer":"C","explain":"'oo' trong good đọc là /ʊ/, còn trong food, foot, cool đọc là /uː/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. heritage","B. damage","C. restore","D. plan"],"answer":"C","explain":"restore nhấn âm 2 /rɪˈstɔː/, còn heritage, damage, plan nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"They ___ to build a new museum.","options":["A. propose","B. refuse","C. forget","D. hate"],"answer":"A","explain":"propose là đề xuất xây bảo tàng mới."},{"type":"mcq","level":"TH","points":0.25,"q":"They decided ___ the monument.","options":["A. to protect","B. protecting","C. protect","D. protected"],"answer":"A","explain":"decide + to-V: to protect."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Why is heritage important? B: ___","options":["A. It connects us to our past.","B. It is not important.","C. Heritage is boring.","D. Forget the past."],"answer":"A","explain":"Di sản kết nối chúng ta với quá khứ."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["heritage","di sản"],["preserve","bảo tồn"],["ancient","cổ xưa"],["historic","mang tính lịch sử"],["recognise","công nhận"]],"explain":"heritage: di sản; preserve: bảo tồn; ancient: cổ xưa; historic: mang tính lịch sử; recognise: công nhận."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["decided","They","to","protect"],"answer":"They decided to protect.","explain":"Câu đúng: They decided to protect. (decide + to-V)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: She is the only student ___ full marks. (get)","answer":"to get","explain":"Sau the only dùng to-V: to get."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Old buildings need ___. (maintain)","answer":"maintenance","explain":"Sau need cần danh từ: maintenance (sự bảo dưỡng)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Don Ca Tai Tu is traditional music from southern Viet Nam. Artists play instruments and sing together. UNESCO recognised it in 2013. Many young people are learning it to preserve this art.","statements":["Don Ca Tai Tu is from southern Viet Nam.","UNESCO recognised it in 2013.","Young people ignore it.","It needs preserving."],"answer":["T","T","F","T"],"explain":"Nhiều bạn trẻ đang học để bảo tồn nghệ thuật này."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"Good morning. Our class will clean the old temple this Sunday. We will pick up rubbish and plant flowers. Bring gloves and hats. Let's protect our heritage together!","sub_questions":[{"q":"What will the class do?","options":["A. Visit a museum.","B. Clean the old temple.","C. Plant rice.","D. Build houses."],"answer":"B"},{"q":"What should students bring?","options":["A. Books.","B. Gloves and hats.","C. Food.","D. Money."],"answer":"B"}],"explain":"Lớp sẽ dọn đền cổ Chủ nhật này; mang găng tay và mũ."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. plan","B. damage","C. heritage","D. ancient"],"answer":"D","explain":"Chữ 'a' trong ancient đọc là /eɪ/, còn trong plan, damage, heritage đọc là /æ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. damage","B. plan","C. heritage","D. appreciate"],"answer":"D","explain":"Chữ 'a' trong appreciate đọc là /ə/, còn trong damage, plan, heritage đọc là /æ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. must","B. ruin","C. preserve","D. study"],"answer":"C","explain":"preserve nhấn âm 2 /prɪˈzɜːv/, còn must, ruin, study nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"We ___ the beauty of old streets.","options":["A. appreciate","B. destroy","C. ignore","D. forget"],"answer":"A","explain":"appreciate là trân trọng vẻ đẹp phố cổ."},{"type":"mcq","level":"TH","points":0.25,"q":"It is interesting ___ folk songs.","options":["A. to learn","B. learning","C. learns","D. learnt"],"answer":"A","explain":"It is + adj + to-V: to learn."},{"type":"mcq","level":"TH","points":0.25,"q":"We need money ___ the old bridge.","options":["A. to repair","B. repairing","C. repair","D. repaired"],"answer":"A","explain":"to-V chỉ mục đích: to repair."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["appreciate","trân trọng"],["promote","quảng bá"],["destroy","phá hủy"],["damage","làm hư hại"],["maintain","duy trì"]],"explain":"appreciate: trân trọng; promote: quảng bá; destroy: phá hủy; damage: làm hư hại; maintain: duy trì."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["She","was","the","only","student","to","pass"],"answer":"She was the only student to pass.","explain":"Câu đúng: She was the only student to pass. (the only + to-V)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: They decided ___ the monument. (protect)","answer":"to protect","explain":"decide + to-V: to protect."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The festival shows our ___ traditions. (nation)","answer":"national","explain":"Trước danh từ traditions cần tính từ: national."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Preserving heritage is everyone's duty. Tourists should not carve names on old walls. Local people can guide visitors and tell stories. Together we can keep our treasures for our children.","statements":["Preserving heritage is everyone's duty.","Tourists may carve names on walls.","Local people can guide visitors.","We keep treasures for children."],"answer":["T","F","T","T"],"explain":"Du khách KHÔNG nên khắc tên lên tường cổ."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Hi, I am Mai. Last month I visited My Son Sanctuary. The brick towers are hundreds of years old. Our guide told us stories about the Champa people. I took many photos of the ancient ruins.","sub_questions":[{"q":"When did Mai visit My Son?","options":["A. Last week.","B. Last month.","C. Last year.","D. Yesterday."],"answer":"B"},{"q":"What did the guide do?","options":["A. Sang songs.","B. Told stories about Champa people.","C. Sold tickets.","D. Cooked food."],"answer":"B"}],"explain":"Mai thăm Thánh địa Mỹ Sơn tháng trước; hướng dẫn viên kể chuyện người Chăm."}]}]}
