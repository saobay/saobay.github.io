the others.","options":["A. melt","B. get","C. heat","D. release"],"answer":"D","explain":"release nhấn âm 2 /rɪˈliːs/, còn melt, get, heat nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Ice is ___ at the poles.","options":["A. melting","B. freezing","C. growing","D. flying"],"answer":"A","explain":"melting là đang tan chảy ở hai cực."},{"type":"mcq","level":"TH","points":0.25,"q":"The homework ___ yesterday was difficult.","options":["A. given","B. giving","C. gives","D. give"],"answer":"A","explain":"Mệnh đề quan hệ bị động rút gọn → V3: given."},{"type":"mcq","level":"TH","points":0.25,"q":"We should ___ energy at home.","options":["A. save","B. waste","C. lose","D. burn"],"answer":"A","explain":"save energy là tiết kiệm năng lượng."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["flood","lũ lụt"],["sea level","mực nước biển"],["melt","tan chảy"],["absorb","hấp thụ"],["trap","giữ lại"]],"explain":"flood: lũ lụt; sea level: mực nước biển; melt: tan chảy; absorb: hấp thụ; trap: giữ lại."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["The","car","made","in","Japan","is","expensive"],"answer":"The car made in Japan is expensive.","explain":"Câu đúng: The car made in Japan is expensive. (V3 rút gọn)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: ___ tired, I went home. (Feel)","answer":"Feeling","explain":"Rút gọn mệnh đề trạng ngữ → V-ing."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The ___ of ice causes floods. (melt)","answer":"melting","explain":"Sau the cần danh từ: melting (sự tan chảy)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Polar bears live on ice in the Arctic. As ice melts, they lose their homes and hunting places. Many bears must swim long distances to find food. Scientists warn that polar bears may disappear if warming continues.","statements":["Polar bears live on Arctic ice.","Melting ice harms polar bears.","Bears swim to find food.","Warming does not affect bears."],"answer":["T","T","T","F"],"explain":"Nóng lên đe dọa gấu Bắc Cực; chúng có thể biến mất."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Hi, I am Tom. My family uses solar panels on our roof. They give us clean electricity. Our bill is much cheaper now. We also ride bikes instead of driving cars. Small actions help the planet.","sub_questions":[{"q":"What does Tom's family use?","options":["A. Coal.","B. Solar panels.","C. Wind fans.","D. Batteries."],"answer":"B"},{"q":"What do they do instead of driving?","options":["A. Walk only.","B. Ride bikes.","C. Take buses.","D. Stay home."],"answer":"B"}],"explain":"Gia đình Tom dùng tấm pin mặt trời và đi xe đạp thay vì ô tô."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. ice","B. live","C. climate","D. build"],"answer":"A","explain":"Chữ 'i' trong ice đọc là /aɪ/, còn trong live, climate, build đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'ch' are pronounced differently from the others.","options":["A. change","B. chilly","C. school","D. beach"],"answer":"C","explain":"'ch' trong school đọc là /k/, còn trong change, chilly, beach đọc là /tʃ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. ice","B. absorb","C. climate","D. build"],"answer":"B","explain":"absorb nhấn âm 2 /əbˈzɔːb/, còn ice, climate, build nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Trees ___ carbon dioxide.","options":["A. absorb","B. release","C. waste","D. lose"],"answer":"A","explain":"absorb là hấp thụ khí CO2."},{"type":"mcq","level":"TH","points":0.25,"q":"___ by the teacher, he studied harder.","options":["A. Encouraged","B. Encouraging","C. Encourage","D. To encourage"],"answer":"A","explain":"Rút gọn mệnh đề bị động → V3: Encouraged."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Why don't we go by bike? B: ___","options":["A. OK, let's go.","B. No, bikes are bad.","C. I hate bikes.","D. Never."],"answer":"A","explain":"Đồng ý với đề xuất đi xe đạp: OK, let's go."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["release","thải ra"],["atmosphere","khí quyển"],["climate change","biến đổi khí hậu"],["consequence","hậu quả"],["urgent","khẩn cấp"]],"explain":"release: thải ra; atmosphere: khí quyển; climate change: biến đổi khí hậu; consequence: hậu quả; urgent: khẩn cấp."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["tired","Feeling","went","she","bed","to"],"answer":"Feeling tired, she went to bed.","explain":"Câu đúng: Feeling tired, she went to bed. (V-ing rút gọn)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: The man ___ there is a doctor. (stand)","answer":"standing","explain":"Rút gọn mệnh đề quan hệ chủ động → V-ing."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: ___ energy is clean. (sun)","answer":"Solar","explain":"Trước danh từ energy cần tính từ: Solar (mặt trời)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Droughts are becoming more serious in many countries. Farmers cannot grow crops without water. Food prices rise and people go hungry. Saving water and planting trees can help reduce droughts.","statements":["Droughts are getting worse.","Farmers need water for crops.","Food prices fall during droughts.","Saving water helps."],"answer":["T","T","F","T"],"explain":"Hạn hán làm giá lương thực TĂNG, không giảm."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: What can students do about global warming, teacher? B: You can save paper and electricity. A: Anything else? B: Plant trees and ride bikes to school. Small actions make a big difference. A: We will start tomorrow!","sub_questions":[{"q":"What can students save?","options":["A. Money only.","B. Paper and electricity.","C. Time.","D. Food."],"answer":"B"},{"q":"What else can they do?","options":["A. Plant trees and ride bikes.","B. Drive cars.","C. Burn rubbish.","D. Cut trees."],"answer":"A"}],"explain":"Học sinh tiết kiệm giấy và điện, trồng cây, đi xe đạp đến trường."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. absorb","B. global","C. carbon","D. problem"],"answer":"A","explain":"Chữ 'o' trong absorb đọc là /ɔː/, còn trong global, carbon, problem đọc là /əʊ/ hoặc /ɒ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'g' is pronounced differently from the others.","options":["A. change","B. age","C. green","D. gas"],"answer":"D","explain":"Chữ 'g' trong gas đọc là /ɡ/, còn trong change, age, green đọc là /dʒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. absorb","B. global","C. carbon","D. problem"],"answer":"A","explain":"absorb nhấn âm 2 /əbˈzɔːb/, còn global, carbon, problem nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"We need ___ action to stop warming.","options":["A. urgent","B. slow","C. late","D. lazy"],"answer":"A","explain":"urgent action là hành động khẩn cấp."},{"type":"mcq","level":"TH","points":0.25,"q":"The girl ___ to music is my sister.","options":["A. listening","B. listens","C. listened","D. listen"],"answer":"A","explain":"Mệnh đề quan hệ chủ động rút gọn → V-ing: listening."},{"type":"mcq","level":"TH","points":0.25,"q":"Deforestation ___ the habitat of animals.","options":["A. destroys","B. builds","C. saves","D. cleans"],"answer":"A","explain":"destroys là phá hủy môi trường sống của động vật."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["balance","sự cân bằng"],["renewable energy","năng lượng tái tạo"],["carbon dioxide","khí CO2"],["global warming","sự nóng lên toàn cầu"],["greenhouse gas","khí nhà kính"]],"explain":"balance: sự cân bằng; renewable energy: năng lượng tái tạo; carbon dioxide: khí CO2; global warming: sự nóng lên toàn cầu; greenhouse gas: khí nhà kính."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["should","plant","We","trees","more"],"answer":"We should plant more trees.","explain":"Câu đúng: We should plant more trees."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: ___ by everyone, she was happy. (Love)","answer":"Loved","explain":"Rút gọn mệnh đề bị động → V3: Loved."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Air ___ is a big city problem. (pollute)","answer":"pollution","explain":"Sau air cần danh từ: pollution (ô nhiễm)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Many sea animals are in danger because of warming oceans. Coral reefs are dying as water gets hotter. Fish move to colder areas to survive. Protecting oceans is as important as protecting forests.","statements":["Warming oceans endanger sea animals.","Coral reefs are dying.","Fish stay in hot water.","Oceans need protection too."],"answer":["T","T","F","T"],"explain":"Cá di chuyển đến vùng nước lạnh hơn để sinh tồn."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Welcome to our nature club. This month we learn about saving energy. Turn off lights and fans when you leave. Use public transport or walk. Tell your family about these good habits too.","sub_questions":[{"q":"What is the topic this month?","options":["A. Saving energy.","B. Planting trees.","C. Saving water.","D. Recycling."],"answer":"A"},{"q":"What should members tell their families?","options":["A. Buy new cars.","B. About good energy habits.","C. Move house.","D. Travel more."],"answer":"B"}],"explain":"Chủ đề tháng này là tiết kiệm năng lượng; chia sẻ thói quen tốt với gia đình."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. warming","B. gas","C. trap","D. plan"],"answer":"A","explain":"Chữ 'a' trong warming đọc là /ɔː/, còn trong gas, trap, plan đọc là /æ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 's' is pronounced differently from the others.","options":["A. traps","B. releases","C. absorbs","D. emissions"],"answer":"A","explain":"Chữ 's' trong traps đọc là /s/, còn trong releases, absorbs, emissions đọc là /z/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. warming","B. gas","C. release","D. trap"],"answer":"C","explain":"release nhấn âm 2 /rɪˈliːs/, còn warming, gas, trap nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"The ___ lasted for a week last summer.","options":["A. heatwave","B. rain","C. snow","D. wind"],"answer":"A","explain":"heatwave là đợt nắng nóng kéo dài."},{"type":"mcq","level":"TH","points":0.25,"q":"___ the news, we were worried.","options":["A. Hearing","B. Hear","C. Heard","D. To hear"],"answer":"A","explain":"Rút gọn mệnh đề trạng ngữ chủ động → V-ing: Hearing."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Do you fancy joining the clean-up day? B: ___","options":["A. Sure, count me in.","B. No, I hate it.","C. Clean-up is bad.","D. Never."],"answer":"A","explain":"Nhận lời tham gia: Sure, count me in."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["emission","khí thải"],["deforestation","nạn phá rừng"],["fossil fuel","nhiên liệu hóa thạch"],["heatwave","đợt nắng nóng"],["drought","hạn hán"]],"explain":"emission: khí thải; deforestation: nạn phá rừng; fossil fuel: nhiên liệu hóa thạch; heatwave: đợt nắng nóng; drought: hạn hán."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["The","letter","written","yesterday","is","long"],"answer":"The letter written yesterday is long.","explain":"Câu đúng: The letter written yesterday is long. (V3 rút gọn)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: The door ___ yesterday is broken. (paint)","answer":"painted","explain":"Rút gọn mệnh đề quan hệ bị động → V3: painted."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: We should protect the ___. (environmental)","answer":"environment","explain":"Sau the cần danh từ: environment (môi trường)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Viet Nam is one of the countries most affected by climate change. The Mekong Delta faces rising sea levels and salt water. Farmers are learning to grow new crops. The government encourages everyone to use clean energy.","statements":["Viet Nam is badly affected by climate change.","The Mekong Delta faces sea rise.","Farmers learn new farming ways.","Clean energy is encouraged."],"answer":["T","T","T","T"],"explain":"Tất cả các ý đều đúng theo đoạn văn."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Dad, what is carbon dioxide? B: It is a gas we breathe out, but too much of it warms the Earth. A: Where does it come from? B: From cars, factories and burning coal. A: Can trees help? B: Yes, trees absorb CO2.","sub_questions":[{"q":"What is carbon dioxide?","options":["A. A gas that warms the Earth.","B. Clean water.","C. Fresh air.","D. A tree."],"answer":"A"},{"q":"How do trees help?","options":["A. They give shade.","B. They absorb CO2.","C. They make wind.","D. They grow fruit."],"answer":"B"}],"explain":"CO2 là khí làm Trái Đất nóng lên; cây xanh hấp thụ CO2."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'u' is pronounced differently from the others.","options":["A. fuel","B. flood","C. must","D. result"],"answer":"A","explain":"Chữ 'u' trong fuel đọc là /uː/, còn trong flood, must, result đọc là /ʌ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'e' is pronounced differently from the others.","options":["A. release","B. get","C. melt","D. heat"],"answer":"D","explain":"Chữ 'e' trong heat đọc là /iː/, còn trong release, get, melt đọc là /e/ hoặc /ɪ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. fuel","B. release","C. flood","D. must"],"answer":"B","explain":"release nhấn âm 2 /rɪˈliːs/, còn fuel, flood, must nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Sea ___ is rising every year.","options":["A. level","B. food","C. wave","D. salt"],"answer":"A","explain":"sea level là mực nước biển đang dâng."},{"type":"mcq","level":"TH","points":0.25,"q":"The trees ___ down yesterday were old.","options":["A. cut","B. cutting","C. cuts","D. to cut"],"answer":"A","explain":"Mệnh đề quan hệ bị động rút gọn → V3: cut (V3 của cut vẫn là cut)."},{"type":"mcq","level":"TH","points":0.25,"q":"Solar power is ___ energy.","options":["A. renewable","B. dirty","C. old","D. expensive"],"answer":"A","explain":"renewable energy là năng lượng tái tạo."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["global warming","sự nóng lên toàn cầu"],["greenhouse gas","khí nhà kính"],["carbon dioxide","khí CO2"],["urgent","khẩn cấp"],["balance","sự cân bằng"]],"explain":"global warming: sự nóng lên toàn cầu; greenhouse gas: khí nhà kính; carbon dioxide: khí CO2; urgent: khẩn cấp; balance: sự cân bằng."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["listening","girl","The","music","to"],"answer":"The girl listening to music.","explain":"Cụm đúng: The girl listening to music (V-ing rút gọn)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: ___ English daily helps a lot. (Practise)","answer":"Practising","explain":"Danh động từ Practising làm chủ ngữ."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Good ___ makes life easier. (transport)","answer":"transportation","explain":"Sau tính từ good cần danh từ: transportation (giao thông vận tải)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Small actions can slow global warming. Turning off lights saves electricity. Walking or cycling reduces car emissions. Sorting rubbish helps recycling. If everyone acts, the Earth will be cooler.","statements":["Small actions help slow warming.","Turning off lights saves energy.","Cycling reduces emissions.","Sorting rubbish is useless."],"answer":["T","T","T","F"],"explain":"Phân loại rác giúp tái chế, rất hữu ích."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Good evening. The weather forecast for tomorrow: the north will be cool with light rain. The central region will have heavy rain and possible floods. The south will be hot and sunny. Please stay safe during floods.","sub_questions":[{"q":"What
