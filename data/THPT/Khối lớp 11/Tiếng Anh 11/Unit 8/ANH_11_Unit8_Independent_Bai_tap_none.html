c."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["decisive","quyết đoán"],["determined","quyết tâm"],["reliable","đáng tin cậy"],["confident","tự tin"],["effort","nỗ lực"]],"explain":"decisive: quyết đoán; determined: quyết tâm; reliable: đáng tin cậy; confident: tự tin; effort: nỗ lực."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["It","was","his","honesty","that","impressed","me"],"answer":"It was his honesty that impressed me.","explain":"Câu đúng: It was his honesty that impressed me."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: It was yesterday ___ I met her.","answer":"that","explain":"Nhấn mạnh thời gian → that."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: We need more ___ in daily life. (independent)","answer":"independence","explain":"Sau more cần danh từ: independence (sự tự lập)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Self-motivated teens set goals and work hard without being told. They do homework on time and help at home. Teachers praise their attitude. Such teens often succeed in life.","statements":["Self-motivated teens set goals.","They work without being told.","Teachers praise them.","They often succeed."],"answer":["T","T","T","T"],"explain":"Tất cả các ý đều đúng theo đoạn văn."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Hi, I am David. Last year I couldn't cook at all. My mum taught me simple dishes. Now I cook dinner twice a week. I feel proud and independent.","sub_questions":[{"q":"What couldn't David do last year?","options":["A. Swim.","B. Cook.","C. Drive.","D. Study."],"answer":"B"},{"q":"How often does he cook now?","options":["A. Every day.","B. Twice a week.","C. Once a month.","D. Never."],"answer":"B"}],"explain":"David từng không biết nấu ăn; giờ nấu bữa tối 2 lần mỗi tuần."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. decide","B. live","C. skill","D. independent"],"answer":"A","explain":"Chữ 'i' trong decide đọc là /aɪ/, còn trong live, skill, independent đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'ch' are pronounced differently from the others.","options":["A. change","B. teach","C. school","D. achieve"],"answer":"C","explain":"'ch' trong school đọc là /k/, còn trong change, teach, achieve đọc là /tʃ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. decide","B. live","C. skill","D. convince"],"answer":"D","explain":"convince nhấn âm 2 /kənˈvɪns/, còn decide, live, skill nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"She keeps a ___ to plan her day.","options":["A. diary","B. book","C. phone","D. bag"],"answer":"A","explain":"diary là nhật ký dùng để lên kế hoạch."},{"type":"mcq","level":"TH","points":0.25,"q":"___ is Lan who sings best.","options":["A. It","B. That","C. She","D. There"],"answer":"A","explain":"Câu chẻ: It is... who..."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Let's make a study schedule. B: ___","options":["A. Good idea.","B. No way.","C. I hate schedules.","D. Never."],"answer":"A","explain":"Đồng ý với đề xuất: Good idea."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["schedule","lịch trình"],["manage","quản lý"],["deal with","xử lý"],["pressure","áp lực"],["task","nhiệm vụ"]],"explain":"schedule: lịch trình; manage: quản lý; deal with: xử lý; pressure: áp lực; task: nhiệm vụ."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["It","was","my","dad","who","fixed","the","bike"],"answer":"It was my dad who fixed the bike.","explain":"Câu đúng: It was my dad who fixed the bike."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: ___ is Lan who sings best.","answer":"It","explain":"Câu chẻ: It is..."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: ___ is the key to trust. (honest)","answer":"Honesty","explain":"Đầu câu cần danh từ: Honesty (sự trung thực)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Confident teens dare to speak up in class. They join clubs and make friends easily. Confidence grows when teens try new things. Parents can help by praising effort, not just results.","statements":["Confident teens speak up in class.","They make friends easily.","Trying new things builds confidence.","Parents should praise effort."],"answer":["T","T","T","T"],"explain":"Tất cả các ý đều đúng theo đoạn văn."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Why don't you join our cooking club, Hoa? B: I can't cook well. A: We will teach you. B: Really? Then I will join! A: Great! We meet every Saturday.","sub_questions":[{"q":"What club is it?","options":["A. A music club.","B. A cooking club.","C. A sports club.","D. An art club."],"answer":"B"},{"q":"When do they meet?","options":["A. Every Sunday.","B. Every Saturday.","C. Every Friday.","D. Every day."],"answer":"B"}],"explain":"Câu lạc bộ nấu ăn họp mỗi thứ Bảy."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. independent","B. decide","C. live","D. skill"],"answer":"B","explain":"Chữ 'i' trong decide đọc là /aɪ/, còn trong independent, live, skill đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'g' is pronounced differently from the others.","options":["A. change","B. age","C. get","D. manage"],"answer":"C","explain":"Chữ 'g' trong get đọc là /ɡ/, còn trong change, age, manage đọc là /dʒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. involve","B. confident","C. job","D. manage"],"answer":"A","explain":"involve nhấn âm 2 /ɪnˈvɒlv/, còn confident, job, manage nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Learning to ___ time is important.","options":["A. manage","B. waste","C. lose","D. forget"],"answer":"A","explain":"manage time là quản lý thời gian."},{"type":"mcq","level":"TH","points":0.25,"q":"It was the dog ___ barked all night.","options":["A. that","B. who","C. which","D. when"],"answer":"A","explain":"Nhấn mạnh vật → that."},{"type":"mcq","level":"TH","points":0.25,"q":"___ people believe in themselves.","options":["A. Confident","B. Lazy","C. Shy","D. Tired"],"answer":"A","explain":"Confident people là người tự tin tin vào bản thân."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["diary","nhật ký"],["characteristic","đặc điểm"],["influence","ảnh hưởng"],["achieve","đạt được"],["independent","tự lập"]],"explain":"diary: nhật ký; characteristic: đặc điểm; influence: ảnh hưởng; achieve: đạt được; independent: tự lập."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["It","was","yesterday","that","I","met","her"],"answer":"It was yesterday that I met her.","explain":"Câu đúng: It was yesterday that I met her."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: It was the dog ___ barked all night.","answer":"that","explain":"Nhấn mạnh vật → that."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: She made a ___ decision. (decide)","answer":"decisive","explain":"Trước danh từ decision cần tính từ: decisive (quyết đoán)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Peer pressure can push teens to do wrong things. Independent teens think carefully before acting. They say no to bad influences. Talking to trusted adults also helps.","statements":["Peer pressure can be harmful.","Independent teens think before acting.","They follow bad influences.","Trusted adults can help."],"answer":["T","T","F","T"],"explain":"Thanh thiếu niên tự lập từ chối ảnh hưởng xấu."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Welcome to our life skills class. Today we learn to deal with pressure. First, take deep breaths. Second, break big tasks into small steps. Third, ask for help when needed.","sub_questions":[{"q":"What is today's lesson?","options":["A. Cooking.","B. Dealing with pressure.","C. Cleaning.","D. Shopping."],"answer":"B"},{"q":"What is the first step?","options":["A. Take deep breaths.","B. Run fast.","C. Shout loudly.","D. Sleep."],"answer":"A"}],"explain":"Bài học về đối mặt áp lực; bước đầu là hít thở sâu."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. manage","B. achieve","C. plan","D. independent"],"answer":"B","explain":"Chữ 'a' trong achieve đọc là /ə/, còn trong manage, plan, independent đọc là /æ/ hoặc /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'oo' are pronounced differently from the others.","options":["A. school","B. foot","C. good","D. cool"],"answer":"C","explain":"'oo' trong good đọc là /ʊ/, còn trong school, foot, cool đọc là /uː/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. manage","B. achieve","C. plan","D. convince"],"answer":"D","explain":"convince nhấn âm 2 /kənˈvɪns/, còn manage, achieve, plan nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"He tried to ___ his parents to let him go.","options":["A. convince","B. force","C. ignore","D. cheat"],"answer":"A","explain":"convince là thuyết phục bố mẹ."},{"type":"mcq","level":"TH","points":0.25,"q":"It was his honesty ___ impressed me.","options":["A. that","B. who","C. which","D. when"],"answer":"A","explain":"Nhấn mạnh vật (sự trung thực) → that."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Why don't you join the club? B: ___","options":["A. OK, I will try.","B. No, clubs are bad.","C. I hate clubs.","D. Never."],"answer":"A","explain":"Nhận lời tham gia câu lạc bộ."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["trust","tin tưởng"],["convince","thuyết phục"],["responsible","có trách nhiệm"],["encourage","khuyến khích"],["decisive","quyết đoán"]],"explain":"trust: tin tưởng; convince: thuyết phục; responsible: có trách nhiệm; encourage: khuyến khích; decisive: quyết đoán."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["It","is","trust","that","matters","most"],"answer":"It is trust that matters most.","explain":"Câu đúng: It is trust that matters most."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: It was his honesty ___ impressed me.","answer":"that","explain":"Nhấn mạnh vật → that."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: He is a ___ worker. (rely)","answer":"reliable","explain":"Trước danh từ worker cần tính từ: reliable (đáng tin cậy)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Keeping a diary helps teens organise their thoughts. They write down goals and plans each evening. Reading old entries shows their progress. Many successful people keep diaries.","statements":["Diaries help organise thoughts.","Teens write goals nightly.","Old entries show progress.","Successful people never write diaries."],"answer":["T","T","T","F"],"explain":"Nhiều người thành công giữ thói quen viết nhật ký."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: How do you manage your time, Minh? B: I make a schedule every Sunday evening. A: Do you follow it strictly? B: Mostly. It helps me finish homework on time. A: I should try that too.","sub_questions":[{"q":"When does Minh make his schedule?","options":["A. Every Monday.","B. Every Sunday evening.","C. Every Friday.","D. Every day."],"answer":"B"},{"q":"What does the schedule help?","options":["A. Play games.","B. Finish homework on time.","C. Sleep late.","D. Watch TV."],"answer":"B"}],"explain":"Minh lập lịch mỗi tối Chủ nhật; giúp hoàn thành bài tập đúng hạn."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'u' is pronounced differently from the others.","options":["A. future","B. trust","C. study","D. must"],"answer":"A","explain":"Chữ 'u' trong future đọc là /uː/, còn trong trust, study, must đọc là /ʌ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'th' are pronounced differently from the others.","options":["A. thank","B. those","C. think","D. three"],"answer":"B","explain":"'th' trong those đọc là /ð/, còn trong thank, think, three đọc là /θ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. convince","B. future","C. trust","D. study"],"answer":"A","explain":"convince nhấn âm 2 /kənˈvɪns/, còn future, trust, study nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"She is ___ and believes in herself.","options":["A. confident","B. shy","C. afraid","D. sad"],"answer":"A","explain":"confident là tự tin vào bản thân."},{"type":"mcq","level":"TH","points":0.25,"q":"___ was my dad who fixed the bike.","options":["A. It","B. That","C. He","D. There"],"answer":"A","explain":"Câu chẻ: It was... who..."},{"type":"mcq","level":"TH","points":0.25,"q":"Hard work helps you ___ your goals.","options":["A. achieve","B. lose","C. forget","D. miss"],"answer":"A","explain":"achieve goals là đạt được mục tiêu."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["determined","quyết tâm"],["reliable","đáng tin cậy"],["self-motivated","tự tạo động lực"],["confident","tự tin"],["effort","nỗ lực"]],"explain":"determined: quyết tâm; reliable: đáng tin cậy; self-motivated: tự tạo động lực; confident: tự tin; effort: nỗ lực."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["It","was","the","dog","that","barked","all","night"],"answer":"It was the dog that barked all night.","explain":"Câu đúng: It was the dog that barked all night."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: ___ was my dad who fixed the bike.","answer":"It","explain":"Câu chẻ: It was..."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Their ___ surprised us. (achieve)","answer":"achievement","explain":"Sau tính từ sở hữu their cần danh từ: achievement (thành tựu)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Becoming independent does not mean living alone. It means making good decisions and taking responsibility. Teens can practise by doing small tasks daily. Step by step, they will grow confident.","statements":["Independence means living alone.","It means deciding and taking responsibility.","Small daily tasks help.","Confidence grows step by step."],"answer":["F","T","T","T"],"explain":"Tự lập không có nghĩa là sống một mình."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Good evening, parents. Our workshop on teen independence is this Friday. Experts will share tips on giving children responsibility. Please come at 7 p.m. to the school hall. Children are welcome too.","sub_questions":[{"q":"When is the workshop?","options":["A. This Monday.","B. This Friday.","C. Next week.","D. Tomorrow."],"answer":"B"},{"q":"What time should parents come?","options":["A. At 6 p.m.","B. At 7 p.m.","C. At 8 p.m.","D. At 5 p.m."],"answer":"B"}],"explain":"Hội thảo về tự lập tuổi teen thứ Sáu này lúc 7 giờ tối."}]}]}
