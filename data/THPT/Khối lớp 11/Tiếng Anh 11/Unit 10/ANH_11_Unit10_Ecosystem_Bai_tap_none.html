iversity? B: It means many kinds of plants and animals. A: Why is it important? B: Every species has a role. If we lose one, nature suffers. A: So we must protect them all! B: Exactly!","sub_questions":[{"q":"What is biodiversity?","options":["A. Many kinds of life.","B. A big forest.","C. Clean water.","D. A zoo."],"answer":"A"},{"q":"Why protect every species?","options":["A. They are cute.","B. Each has a role in nature.","C. They are cheap.","D. They are many."],"answer":"B"}],"explain":"Đa dạng sinh học là nhiều dạng sống; mỗi loài đều có vai trò."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'i' is pronounced differently from the others.","options":["A. species","B. live","C. skill","D. extinct"],"answer":"A","explain":"Chữ 'i' trong species đọc là /iː/, còn trong live, skill, extinct đọc là /ɪ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'o' is pronounced differently from the others.","options":["A. organism","B. involve","C. job","D. problem"],"answer":"A","explain":"Chữ 'o' trong organism đọc là /ɔː/, còn trong involve, job, problem đọc là /ɒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. extinct","B. species","C. habitat","D. coral"],"answer":"A","explain":"extinct nhấn âm 2 /ɪkˈstɪŋkt/, còn species, habitat, coral nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"___ means many kinds of life.","options":["A. Biodiversity","B. Pollution","C. Poverty","D. Traffic"],"answer":"A","explain":"Biodiversity là đa dạng sinh học."},{"type":"mcq","level":"TH","points":0.25,"q":"If he ___ harder, he would pass.","options":["A. studied","B. studies","C. will study","D. study"],"answer":"A","explain":"Câu điều kiện loại 2: If + quá khứ đơn."},{"type":"mcq","level":"TH","points":0.25,"q":"The ___ chain starts with plants.","options":["A. food","B. iron","C. gold","D. key"],"answer":"A","explain":"food chain là chuỗi thức ăn."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["flora","hệ thực vật"],["fauna","hệ động vật"],["habitat","môi trường sống"],["species","loài"],["organism","sinh vật"]],"explain":"flora: hệ thực vật; fauna: hệ động vật; habitat: môi trường sống; species: loài; organism: sinh vật."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["If","he","studied","harder","he","would","pass"],"answer":"If he studied harder, he would pass.","explain":"Câu đúng: If he studied harder, he would pass. (loại 2)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: If he ___ harder, he would pass.","answer":"studied","explain":"Câu điều kiện loại 2: If + quá khứ đơn."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Many ___ live in the sea. (organ)","answer":"organisms","explain":"Sau many cần danh từ số nhiều: organisms (sinh vật)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Wetlands are lands covered with water. They are home to birds and fish. Wetlands clean dirty water naturally. People should not drain them.","statements":["Wetlands have water.","Birds live in wetlands.","Wetlands clean water.","Draining wetlands is good."],"answer":["T","T","T","F"],"explain":"Không nên tháo cạn đất ngập nước."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Hi, I'm Nam. Our class adopted a mangrove area. Every month we clean trash there. Last month we planted 50 young trees. I feel proud to protect nature.","sub_questions":[{"q":"What did Nam's class adopt?","options":["A. A beach.","B. A mangrove area.","C. A park.","D. A zoo."],"answer":"B"},{"q":"How many trees did they plant?","options":["A. 30.","B. 40.","C. 50.","D. 60."],"answer":"C"}],"explain":"Lớp Nam nhận chăm sóc rừng ngập mặn; đã trồng 50 cây non."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'a' is pronounced differently from the others.","options":["A. maintain","B. plan","C. habitat","D. coral"],"answer":"A","explain":"Chữ 'a' trong maintain đọc là /eɪ/, còn trong plan, habitat, coral đọc là /æ/ hoặc /ə/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 's' is pronounced differently from the others.","options":["A. preserves","B. restores","C. faces","D. stops"],"answer":"D","explain":"Chữ 's' trong stops đọc là /s/, còn trong preserves, restores, faces đọc là /z/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. plan","B. habitat","C. species","D. maintain"],"answer":"D","explain":"maintain nhấn âm 2 /meɪnˈteɪn/, còn plan, habitat, species nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"We should ___ damaged forests.","options":["A. restore","B. cut","C. burn","D. sell"],"answer":"A","explain":"restore là phục hồi rừng bị hư hại."},{"type":"mcq","level":"TH","points":0.25,"q":"We will save water if we ___.","options":["A. try","B. tried","C. would try","D. tries"],"answer":"A","explain":"Câu điều kiện loại 1: If + hiện tại đơn, will."},{"type":"mcq","level":"TH","points":0.25,"q":"A: Do you like the coral reef? B: ___","options":["A. Yes, it's beautiful.","B. No, I hate nature.","C. Reefs are ugly.","D. I don't care."],"answer":"A","explain":"Trả lời tích cực về rạn san hô."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["restore","phục hồi"],["conservation","sự bảo tồn"],["extinct","tuyệt chủng"],["endangered","có nguy cơ tuyệt chủng"],["food chain","chuỗi thức ăn"]],"explain":"restore: phục hồi; conservation: sự bảo tồn; extinct: tuyệt chủng; endangered: có nguy cơ tuyệt chủng; food chain: chuỗi thức ăn."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["We","will","save","water","if","we","try"],"answer":"We will save water if we try.","explain":"Câu đúng: We will save water if we try. (loại 1)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: We will save water if we ___.","answer":"try","explain":"Câu điều kiện loại 1: If + hiện tại đơn."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The ___ of tigers shocked us. (extinct)","answer":"extinction","explain":"Sau the cần danh từ: extinction (sự tuyệt chủng)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage and decide whether the following statements are true (T) or false (F). Mangroves grow in salty coastal water. Their roots stop big waves. Fish lay eggs among the roots. Cutting mangroves causes floods.","statements":["Mangroves grow near coasts.","Roots stop waves.","Fish lay eggs there.","Cutting them is harmless."],"answer":["T","T","T","F"],"explain":"Chặt rừng ngập mặn gây lũ lụt."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe và trả lời câu hỏi.","audio_text":"A: Look at this photo of Cuc Phuong forest! B: Wow, so green! A: It has rare animals like langurs. B: Are they endangered? A: Yes. We must protect their habitat. B: I agree. Let's visit one day!","sub_questions":[{"q":"What animals are in Cuc Phuong?","options":["A. Tigers.","B. Langurs.","C. Pandas.","D. Elephants."],"answer":"B"},{"q":"What must we do?","options":["A. Hunt them.","B. Protect their habitat.","C. Feed them.","D. Take them home."],"answer":"B"}],"explain":"Rừng Cúc Phương có voọc quý hiếm; phải bảo vệ môi trường sống của chúng."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'e' is pronounced differently from the others.","options":["A. restore","B. get","C. self","D. me"],"answer":"D","explain":"Chữ 'e' trong me đọc là /iː/, còn trong restore, get, self đọc là /e/ hoặc /ɔː/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letter 'g' is pronounced differently from the others.","options":["A. change","B. age","C. get","D. endangered"],"answer":"C","explain":"Chữ 'g' trong get đọc là /ɡ/, còn trong change, age, endangered đọc là /dʒ/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word with a different stress pattern from the others.","options":["A. endangered","B. habitat","C. coral","D. species"],"answer":"A","explain":"endangered nhấn âm 2 /ɪnˈdeɪndʒəd/, còn habitat, coral, species nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"Tigers may become ___ soon.","options":["A. extinct","B. famous","C. rich","D. strong"],"answer":"A","explain":"extinct là tuyệt chủng."},{"type":"mcq","level":"TH","points":0.25,"q":"If I ___ rich, I would buy a forest.","options":["A. were","B. am","C. will be","D. be"],"answer":"A","explain":"Câu điều kiện loại 2: với be dùng were."},{"type":"mcq","level":"TH","points":0.25,"q":"Many species are ___.","options":["A. endangered","B. happy","C. rich","D. famous"],"answer":"A","explain":"Nhiều loài đang có nguy cơ tuyệt chủng."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["coral reef","rạn san hô"],["wetland","đất ngập nước"],["mangrove","rừng ngập mặn"],["tropical forest","rừng nhiệt đới"],["sustainable","bền vững"]],"explain":"coral reef: rạn san hô; wetland: đất ngập nước; mangrove: rừng ngập mặn; tropical forest: rừng nhiệt đới; sustainable: bền vững."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["If","I","were","rich","I","would","travel"],"answer":"If I were rich, I would travel.","explain":"Câu đúng: If I were rich, I would travel. (loại 2, be → were)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: If I ___ rich, I would buy a forest.","answer":"were","explain":"Câu điều kiện loại 2: be → were."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: Nature needs our ___. (conserve)","answer":"conservation","explain":"Sau our cần danh từ: conservation (sự bảo tồn)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Pollution harms ecosystems badly. Dirty water kills fish and plants. Factories must treat waste first. Clean rivers keep species alive.","statements":["Pollution harms ecosystems.","Dirty water kills fish.","Factories must treat waste.","Clean rivers help species."],"answer":["T","T","T","T"],"explain":"Tất cả các ý đều đúng theo đoạn văn."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Welcome to our nature club meeting. This month we learn about the food chain. Next week we visit the national park. Please bring notebooks. See you on Sunday at 8 a.m.!","sub_questions":[{"q":"What do they learn this month?","options":["A. The food chain.","B. Swimming.","C. Cooking.","D. Drawing."],"answer":"A"},{"q":"When do they meet?","options":["A. Saturday.","B. Sunday at 8 a.m.","C. Monday.","D. Friday."],"answer":"B"}],"explain":"Câu lạc bộ học về chuỗi thức ăn; gặp Chủ nhật lúc 8 giờ sáng."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose underlined letter 'u' is pronounced differently from the others.","options":["A. result","B. sustainable","C. study","D. must"],"answer":"B","explain":"Chữ 'u' trong sustainable đọc là /ə/, còn trong result, study, must đọc là /ʌ/."},{"type":"mcq","level":"TH","points":0.25,"q":"Choose the word whose underlined letters 'oo' are pronounced differently from the others.","options":["A. food","B. good","C. cool","D. foot"],"answer":"B","explain":"'oo' trong good đọc là /ʊ/, còn trong food, cool, foot đọc là /uː/."},{"type":"mcq","level":"NB","points":0.25,"q":"Choose the word whose main stress is placed differently from the others.","options":["A. organism","B. job","C. problem","D. involve"],"answer":"D","explain":"involve nhấn âm 2 /ɪnˈvɒlv/, còn organism, job, problem nhấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"___ animals need protection.","options":["A. Endangered","B. Happy","C. Rich","D. Strong"],"answer":"A","explain":"Endangered animals là động vật có nguy cơ tuyệt chủng."},{"type":"mcq","level":"TH","points":0.25,"q":"If they pollute the river, fish ___.","options":["A. will die","B. would die","C. die","D. died"],"answer":"A","explain":"Câu điều kiện loại 1: will + V."},{"type":"mcq","level":"TH","points":0.25,"q":"A: What can we do for nature? B: ___","options":["A. Save water and plant trees.","B. Pollute more.","C. Cut more trees.","D. Nothing."],"answer":"A","explain":"Tiết kiệm nước và trồng cây giúp thiên nhiên."},{"type":"matching","level":"NB","points":0.5,"q":"Nối từ với nghĩa tiếng Việt đúng.","pairs":[["maintain","duy trì"],["pollute","gây ô nhiễm"],["ecosystem","hệ sinh thái"],["habitat","môi trường sống"],["species","loài"]],"explain":"maintain: duy trì; pollute: gây ô nhiễm; ecosystem: hệ sinh thái; habitat: môi trường sống; species: loài."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ thành câu đúng.","words":["If","they","pollute","the","river","fish","will","die"],"answer":"If they pollute the river, fish will die.","explain":"Câu đúng: If they pollute the river, fish will die. (loại 1)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: If they pollute the river, fish ___.","answer":"will die","explain":"Câu điều kiện loại 1: will die."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: The air is ___. (pollution)","answer":"polluted","explain":"Sau is cần tính từ: polluted (bị ô nhiễm)."},{"type": hấn âm 1."},{"type":"mcq","level":"NB","points":0.25,"q":"A ___ reef is full of colourful fish.","options":["A. coral","B. stone","C. ice","D. sand"],"answer":"A","explain":"coral reef là rạn san hô."},{"type":"mcq","level":"TH","points":0.25,"q":"If we protected nature, the Earth ___ better.","options":["A. would be","B. will be","C. is","D. was"],"answer":"A","explain":"Câu điều kiện loại 2: would + V."},{"type":"mcq","level":"TH","points":0.25,"q":"___ forests are home to tigers.","options":["A. Tropical","B. Small","C. Young","D. Dry"],"answer":"A","explain":"Tropical forests là rừng nhiệt đới."},{"type":"matching","level":"NB","points":0.5,"q":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt phù hợp.","pairs":[["biodiversity","đa dạng sinh học"],["flora","hệ thực vật"],["fauna","hệ động vật"],["conservation","sự bảo tồn"],["restore","phục hồi"]],"explain":"biodiversity: đa dạng sinh học; flora: hệ thực vật; fauna: hệ động vật; conservation: sự bảo tồn; restore: phục hồi."},{"type":"ordering","level":"VD","points":0.5,"q":"Sắp xếp các từ cho sẵn thành câu hoàn chỉnh.","words":["If","we","protected","nature","Earth","would","be","better"],"answer":"If we protected nature, Earth would be better.","explain":"Câu đúng: If we protected nature, Earth would be better. (loại 2)."},{"type":"short","level":"TH","points":0.5,"q":"Fill in the blank with ONE word: If we protected nature, the Earth ___ better.","answer":"would be","explain":"Câu điều kiện loại 2: would be."},{"type":"short","level":"VD","points":0.5,"q":"Give the correct form of the word in brackets: They live in ___. (harmonious)","answer":"harmony","explain":"Sau in cần danh từ: harmony (sự hài hòa)."},{"type":"truefalse","level":"VDC","points":1,"q":"Read the passage. Decide if the statements are true (T) or false (F). Sustainable development meets today's needs safely. It does not harm future generations. Green energy helps protect ecosystems. Everyone should live sustainably.","statements":["Sustainable development is safe.","It harms the future.","Green energy helps nature.","Everyone should live sustainably."],"answer":["T","F","T","T"],"explain":"Phát triển bền vững không gây hại cho thế hệ tương lai."},{"type":"listening","level":"VDC","points":0.5,"q":"Nghe đoạn ghi âm rồi trả lời các câu hỏi.","audio_text":"Good evening. Our documentary on endangered species airs tonight at 9 p.m. You will see tigers, pandas and rhinos. Learn how we can save them. Don't miss it!","sub_questions":[{"q":"What is on TV tonight?","options":["A. A football match.","B. A documentary on endangered species.","C. A cooking show.","D. A music concert."],"answer":"B"},{"q":"What time does it air?","options":["A. At 8 p.m.","B. At 9 p.m.","C. At 10 p.m.","D. At 7 p.m."],"answer":"B"}],"explain":"Phim tài liệu về loài có nguy cơ tuyệt chủng chiếu tối nay lúc 9 giờ."}]}]}
