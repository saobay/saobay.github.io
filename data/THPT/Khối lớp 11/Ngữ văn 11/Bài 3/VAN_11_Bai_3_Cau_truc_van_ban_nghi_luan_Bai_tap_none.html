ưởng thành, truyền cảm hứng cho người khác. e) Phản đề: phê phán thói nản chí, bỏ cuộc, đổ lỗi cho hoàn cảnh; phân biệt ý chí với cố chấp, liều lĩnh. f) Bài học, giải pháp: rèn luyện từ việc nhỏ, có mục tiêu rõ ràng; liên hệ bản thân. 3. Kết bài: khẳng định “có chí thì nên”; lời nhắn nhủ."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Trong thời đại công nghệ, đọc sách giấy đã lỗi thời, chỉ cần đọc trên mạng là đủ.” Ý kiến này chưa thật đúng đắn. Đọc trên mạng tuy nhanh, tiện, nhưng thường hời hợt, dễ bị phân tâm bởi vô số thông tin nhiễu. Ngược lại, đọc sách giấy giúp ta tập trung, nghiền ngẫm sâu, ghi nhớ lâu. Nhiều nghiên cứu cho thấy người đọc sách giấy có khả năng tư duy sâu và trí nhớ tốt hơn. Hơn nữa, sách giấy còn là người bạn đồng hành thân thiết, không cần pin, không quảng cáo. Vì thế, dù công nghệ phát triển, sách giấy vẫn có vị trí không thể thay thế. Điều quan trọng là ta biết kết hợp cả hai để việc đọc hiệu quả nhất. (Ngữ liệu minh họa — tự soạn) Thao tác lập luận nào được sử dụng ở câu mở đầu của ngữ liệu?", "options": ["A. Chứng minh", "B. Bác bỏ (nêu ý kiến sai rồi phản bác)", "C. Giải thích", "D. Bình luận"], "answer": "B", "explain": "Tác giả nêu ý kiến “đọc sách giấy đã lỗi thời” rồi dùng “chưa thật đúng đắn” để phản bác, sau đó đưa lí lẽ chứng minh — đó là thao tác bác bỏ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Trong thời đại công nghệ, đọc sách giấy đã lỗi thời, chỉ cần đọc trên mạng là đủ.” Ý kiến này chưa thật đúng đắn. Đọc trên mạng tuy nhanh, tiện, nhưng thường hời hợt, dễ bị phân tâm bởi vô số thông tin nhiễu. Ngược lại, đọc sách giấy giúp ta tập trung, nghiền ngẫm sâu, ghi nhớ lâu. Nhiều nghiên cứu cho thấy người đọc sách giấy có khả năng tư duy sâu và trí nhớ tốt hơn. Hơn nữa, sách giấy còn là người bạn đồng hành thân thiết, không cần pin, không quảng cáo. Vì thế, dù công nghệ phát triển, sách giấy vẫn có vị trí không thể thay thế. Điều quan trọng là ta biết kết hợp cả hai để việc đọc hiệu quả nhất. (Ngữ liệu minh họa — tự soạn) Luận cứ nào được dùng để bảo vệ vai trò của sách giấy?", "options": ["A. Sách giấy rẻ tiền", "B. Đọc sách giấy giúp tập trung, nghiền ngẫm sâu, ghi nhớ lâu; nghiên cứu khoa học chứng minh; tiện lợi không cần pin", "C. Sách giấy đẹp", "D. Ai cũng thích sách giấy"], "answer": "B", "explain": "Các luận cứ: tập trung, nghiền ngẫm sâu, ghi nhớ lâu; nghiên cứu khoa học; không cần pin, không quảng cáo — đều hướng tới việc khẳng định giá trị sách giấy.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Trong thời đại công nghệ, đọc sách giấy đã lỗi thời, chỉ cần đọc trên mạng là đủ.” Ý kiến này chưa thật đúng đắn. Đọc trên mạng tuy nhanh, tiện, nhưng thường hời hợt, dễ bị phân tâm bởi vô số thông tin nhiễu. Ngược lại, đọc sách giấy giúp ta tập trung, nghiền ngẫm sâu, ghi nhớ lâu. Nhiều nghiên cứu cho thấy người đọc sách giấy có khả năng tư duy sâu và trí nhớ tốt hơn. Hơn nữa, sách giấy còn là người bạn đồng hành thân thiết, không cần pin, không quảng cáo. Vì thế, dù công nghệ phát triển, sách giấy vẫn có vị trí không thể thay thế. Điều quan trọng là ta biết kết hợp cả hai để việc đọc hiệu quả nhất. (Ngữ liệu minh họa — tự soạn) Cách kết thúc ngữ liệu (“biết kết hợp cả hai”) thể hiện đặc điểm gì trong lập luận?", "options": ["A. Cực đoan, một chiều", "B. Khách quan, toàn diện: không phủ nhận hẳn cái mới mà đề xuất giải pháp hài hòa", "C. Mâu thuẫn", "D. Thiếu chính kiến"], "answer": "B", "explain": "Sau khi bảo vệ sách giấy, tác giả không phủ nhận công nghệ mà đề xuất kết hợp cả hai — lập luận khách quan, toàn diện, thuyết phục hơn lối suy nghĩ cực đoan.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Bác bỏ” là thao tác phê phán ý kiến sai để bảo vệ ý kiến đúng.", "b) Dẫn chứng “nhiều nghiên cứu cho thấy…” làm tăng sức thuyết phục.", "c) Văn bản nghị luận chỉ được trình bày một chiều, không cần nhìn nhận nhiều mặt.", "d) Luận đề của ngữ liệu là vai trò của sách giấy trong thời đại công nghệ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: khái niệm bác bỏ. b) Đúng: dẫn chứng khoa học có tính xác thực cao. c) Sai: lập luận toàn diện, khách quan mới thuyết phục. d) Đúng.", "points": 1}, {"type": "short", "level": "TH", "q": "Văn bản “Một thời đại trong thi ca” của Hoài Thanh thuộc loại nghị luận nào?", "answer": "Nghị luận văn học (tiểu luận phê bình văn học)", "explain": "Đây là tiểu luận phê bình văn học — bàn về phong trào Thơ mới, về “cái tôi” trữ tình — thuộc loại nghị luận văn học.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn nghị luận xã hội khoảng 200 chữ về văn hóa đọc của giới trẻ hiện nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Văn hóa đọc của giới trẻ hiện nay đang có những chuyển biến đáng suy ngẫm. Mặt tích cực, công nghệ giúp các bạn trẻ tiếp cận tri thức dễ dàng hơn bao giờ hết qua sách điện tử, audiobook. Nhưng mặt khác, không ít bạn đọc hời hợt, “lướt” qua thông tin mà ít khi đọc sâu, đọc kĩ một cuốn sách; có bạn cả năm không đọc nổi một cuốn sách giấy. Nguyên nhân một phần do sức hấp dẫn của mạng xã hội, game; một phần do chưa được rèn thói quen đọc từ nhỏ. Hậu quả là vốn hiểu biết nông, khả năng tư duy, diễn đạt hạn chế. Để chấn hưng văn hóa đọc, mỗi bạn trẻ hãy bắt đầu từ việc nhỏ: dành 30 phút mỗi ngày cho sách, tham gia câu lạc bộ đọc, chia sẻ sách hay với bạn bè. Đọc sách hôm nay là đầu tư cho trí tuệ ngày mai."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về tác hại của việc lạm dụng mạng xã hội ở giới trẻ. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: nêu thực trạng giới trẻ “dán mắt” vào mạng xã hội — vấn đề cần bàn: tác hại của việc lạm dụng. 2. Thân bài: a) Giải thích: mạng xã hội là gì; lạm dụng là dùng quá mức, phụ thuộc. b) Biểu hiện: online hàng giờ, sao nhãng học tập, “sống ảo”, so sánh, khoe khoang. c) Tác hại: với sức khỏe (mắt, giấc ngủ, tinh thần); với học tập (sa sút); với nhân cách (vô cảm, bạo lực mạng, lừa đảo); với các mối quan hệ thực. d) Nguyên nhân: thiếu kiểm soát bản thân, thiếu định hướng, sức hấp dẫn của công nghệ. e) Giải pháp: tự quản lí thời gian, dùng mạng có mục đích; gia đình, nhà trường định hướng; phát triển sở thích lành mạnh. f) Phản đề: mạng xã hội cũng có mặt tích cực nếu dùng đúng — vấn đề là ở cách dùng. 3. Kết bài: khẳng định cần làm chủ công nghệ thay vì bị công nghệ chi phối; liên hệ bản thân."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Hiền tài là nguyên khí của quốc gia” — lời dạy của cha ông vẫn còn nguyên giá trị. Một đất nước muốn phát triển bền vững, trước hết phải biết trọng dụng người tài. Nhìn ra thế giới, những quốc gia phát triển vượt bậc đều là những nơi biết trân trọng tri thức: họ đầu tư cho giáo dục, tạo môi trường tốt để người tài cống hiến. Ở nước ta, Đảng và Nhà nước đã có nhiều chính sách thu hút nhân tài. Tuy nhiên, đâu đó vẫn còn tình trạng “chảy máu chất xám”, người tài chưa được đặt đúng vị trí. Vì vậy, trọng dụng hiền tài không chỉ là chính sách, mà phải trở thành văn hóa, thành ý thức của cả xã hội — từ việc phát hiện, bồi dưỡng đến tạo điều kiện để họ tỏa sáng. (Ngữ liệu minh họa — tự soạn) Luận đề của ngữ liệu là gì?", "options": ["A. Kể về người tài", "B. Bàn về vai trò và sự cần thiết của việc trọng dụng hiền tài", "C. Phê phán người tài", "D. Giới thiệu chính sách giáo dục"], "answer": "B", "explain": "Ngữ liệu bàn về vai trò của hiền tài (“nguyên khí quốc gia”) và sự cần thiết phải trọng dụng họ — đây là luận đề xuyên suốt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Hiền tài là nguyên khí của quốc gia” — lời dạy của cha ông vẫn còn nguyên giá trị. Một đất nước muốn phát triển bền vững, trước hết phải biết trọng dụng người tài. Nhìn ra thế giới, những quốc gia phát triển vượt bậc đều là những nơi biết trân trọng tri thức: họ đầu tư cho giáo dục, tạo môi trường tốt để người tài cống hiến. Ở nước ta, Đảng và Nhà nước đã có nhiều chính sách thu hút nhân tài. Tuy nhiên, đâu đó vẫn còn tình trạng “chảy máu chất xám”, người tài chưa được đặt đúng vị trí. Vì vậy, trọng dụng hiền tài không chỉ là chính sách, mà phải trở thành văn hóa, thành ý thức của cả xã hội — từ việc phát hiện, bồi dưỡng đến tạo điều kiện để họ tỏa sáng. (Ngữ liệu minh họa — tự soạn) Câu “Hiền tài là nguyên khí của quốc gia” được dùng làm gì trong ngữ liệu?", "options": ["A. Luận cứ (dẫn chứng từ lời dạy của cha ông) để mở đầu, tạo uy tín cho luận đề", "B. Kết luận", "C. Ví dụ minh họa", "D. Lời bình luận"], "answer": "A", "explain": "Lời dạy của cha ông được trích dẫn ngay đầu như một luận cứ có uy tín, làm chỗ dựa cho toàn bộ lập luận về trọng dụng hiền tài.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Hiền tài là nguyên khí của quốc gia” — lời dạy của cha ông vẫn còn nguyên giá trị. Một đất nước muốn phát triển bền vững, trước hết phải biết trọng dụng người tài. Nhìn ra thế giới, những quốc gia phát triển vượt bậc đều là những nơi biết trân trọng tri thức: họ đầu tư cho giáo dục, tạo môi trường tốt để người tài cống hiến. Ở nước ta, Đảng và Nhà nước đã có nhiều chính sách thu hút nhân tài. Tuy nhiên, đâu đó vẫn còn tình trạng “chảy máu chất xám”, người tài chưa được đặt đúng vị trí. Vì vậy, trọng dụng hiền tài không chỉ là chính sách, mà phải trở thành văn hóa, thành ý thức của cả xã hội — từ việc phát hiện, bồi dưỡng đến tạo điều kiện để họ tỏa sáng. (Ngữ liệu minh họa — tự soạn) Ngữ liệu có điểm chung nào với văn bản “Cầu hiền chiếu” của Ngô Thì Nhậm?", "options": ["A. Đều bàn về việc chiêu mộ, trọng dụng hiền tài cho đất nước", "B. Đều là chiếu của vua", "C. Đều viết bằng chữ Hán", "D. Không có điểm chung"], "answer": "A", "explain": "“Cầu hiền chiếu” (1788) là chiếu thư của vua Quang Trung chiêu mộ hiền tài; ngữ liệu cũng bàn về trọng dụng hiền tài — cùng chung tư tưởng lớn, dù cách thể hiện khác nhau (văn cổ và văn hiện đại).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Cầu hiền chiếu” được Ngô Thì Nhậm viết thay lời vua Quang Trung năm 1788.", "b) Thể “chiếu” là văn bản do vua ban bố.", "c) Luận cứ trong ngữ liệu Đề 3 chỉ gồm lí lẽ, không có dẫn chứng thực tế.", "d) “Trọng dụng hiền tài phải trở thành văn hóa của cả xã hội” là một luận điểm của ngữ liệu."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: chiếu là văn bản của vua. c) Sai: có dẫn chứng thực tế (các quốc gia phát triển, chính sách thu hút nhân tài, tình trạng “chảy máu chất xám”). d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu hoàn cảnh ra đời của “Cầu hiền chiếu”.", "answer": "Năm 1788, sau khi Quang Trung đại phá quân Thanh, Ngô Thì Nhậm viết thay lời vua để chiêu mộ hiền tài ra giúp nước", "explain": "Sau chiến thắng Ngọc Hồi – Đống Đa (1788), đất nước cần người tài xây dựng; vua Quang Trung ban “Cầu hiền chiếu” (do Ngô Thì Nhậm soạn) kêu gọi hiền tài ra gánh vác việc nước.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của người tài đối với đất nước. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Người tài là “nguyên khí của quốc gia” — nguồn lực quý giá nhất quyết định sự thịnh suy của đất nước. Lịch sử đã chứng minh: thời nào trọng dụng hiền tài, thời ấy đất nước thịnh trị; ngược lại, bỏ rơi người tài là tự làm suy yếu mình. Ngày nay, trong cuộc cạnh tranh toàn cầu về tri thức, vai trò của người tài càng nổi bật: họ là những nhà khoa học, kĩ sư, bác sĩ, thầy cô… trực tiếp tạo ra của cải, tri thức và tiến bộ xã hội. Vì vậy, trọng dụng người tài không chỉ là chính sách của Nhà nước mà phải thành ý thức của cả xã hội: phát hiện sớm, đào tạo bài bản, đặt đúng vị trí và tạo môi trường để họ cống hiến. Mỗi bạn trẻ cũng cần ý thức rèn đức, luyện tài, để mai này trở thành “nguyên khí” góp phần xây dựng quê hương, đất nước giàu mạnh."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về vấn đề “chảy máu chất xám” và trách nhiệm của tuổi trẻ. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: nêu hiện tượng nhiều người tài ra nước ngoài học tập, làm việc không trở về — vấn đề “chảy máu chất xám”. 2. Thân bài: a) Giải thích: “chảy máu chất xám” là tình trạng chất xám (người tài) di chuyển ra nước ngoài. b) Thực trạng, nguyên nhân: môi trường làm việc, đãi ngộ, cơ hội phát triển; tâm lí sính ngoại. c) Tác hại: đất nước mất nguồn nhân lực chất lượng cao, thiệt thòi trong cạnh tranh; lãng phí đầu tư đào tạo. d) Bàn luận nhiều chiều: quyền tự do lựa chọn của mỗi người cần tôn trọng; nhưng với người được Nhà nước, nhân dân nuôi dưỡng, cần có trách nhiệm; nhiều người thành công ở nước ngoài vẫn hướng về quê hương — đáng trân trọng. e) Giải pháp: chính sách đãi ngộ, môi trường làm việc tốt; giáo dục lòng yêu nước, trách nhiệm từ sớm. f) Liên hệ bản thân: học tập tốt, nuôi khát vọng cống hiến cho đất nước. 3. Kết bài: khẳng định giữ chân và trọng dụng người tài là nhiệm vụ chung; lời nhắn nhủ tuổi trẻ."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nLòng tự trọng là giá trị cao quý của con người. Người có lòng tự trọng biết giữ gìn phẩm giá, không làm điều xấu xa dù không ai biết, không quỵ lụy, van xin. Trong lịch sử, biết bao tấm gương đã sống và chết vì lòng tự trọng: những anh hùng thà chết không chịu nhục, những nhà khoa học nghèo mà không bán rẻ lương tâm. Ngược lại, kẻ thiếu tự trọng sẵn sàng luồn cúi, làm điều trái đạo lí vì lợi ích cá nhân. Những kẻ ấy có thể được lợi trước mắt, nhưng sẽ bị người đời khinh bỉ. Vì vậy, mỗi chúng ta hãy rèn luyện lòng tự trọng từ những việc nhỏ nhất: trung thực trong thi cử, dám nhận lỗi, không a dua theo cái xấu. (Ngữ liệu minh họa — tự soạn) Theo ngữ liệu, người có lòng tự trọng là người như thế nào?", "options": ["A. Giàu có, quyền lực", "B. Biết giữ gìn phẩm giá, không làm điều xấu, không quỵ lụy", "C. Luôn khoe khoang", "D. Sống ích kỉ"], "answer": "B", "explain": "Ngữ liệu định nghĩa trực tiếp: “biết giữ gìn phẩm giá, không làm điều xấu xa dù không ai biết, không quỵ lụy, van xin”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nLòng tự trọng là giá trị cao quý của con người. Người có lòng tự trọng biết giữ gìn phẩm giá, không làm điều xấu xa dù không ai biết, không quỵ lụy, van xin. Trong lịch sử, biết bao tấm gương đã sống và chết vì lòng tự trọng: những anh hùng thà chết không chịu nhục, những nhà khoa học nghèo mà không bán rẻ lương tâm. Ngược lại, kẻ thiếu tự trọng sẵn sàng luồn cúi, làm điều trái đạo lí vì lợi ích cá nhân. Những kẻ ấy có thể được lợi trước mắt, nhưng sẽ bị người đời khinh bỉ. Vì vậy, mỗi chúng ta hãy rèn luyện lòng tự trọng từ những việc nhỏ nhất: trung thực trong thi cử, dám nhận lỗi, không a dua theo cái xấu. (Ngữ liệu minh họa — tự soạn) Thao tác lập luận chính được sử dụng trong đoạn 2 và 3 của ngữ liệu là gì?", "options": ["A. Giải thích", "B. Chứng minh kết hợp so sánh đối lập (tấm gương tự trọng và kẻ thiếu tự trọng)", "C. Bác bỏ", "D. Bình luận"], "answer": "B", "explain": "Tác giả đưa dẫn chứng về những tấm gương tự trọng rồi đối lập với “kẻ thiếu tự trọng” — vừa chứng minh vừa so sánh đối lập để làm nổi bật vấn đề.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nLòng tự trọng là giá trị cao quý của con người. Người có lòng tự trọng biết giữ gìn phẩm giá, không làm điều xấu xa dù không ai biết, không quỵ lụy, van xin. Trong lịch sử, biết bao tấm gương đã sống và chết vì lòng tự trọng: những anh hùng thà chết không chịu nhục, những nhà khoa học nghèo mà không bán rẻ lương tâm. Ngược lại, kẻ thiếu tự trọng sẵn sàng luồn cúi, làm điều trái đạo lí vì lợi ích cá nhân. Những kẻ ấy có thể được lợi trước mắt, nhưng sẽ bị người đời khinh bỉ. Vì vậy, mỗi chúng ta hãy rèn luyện lòng tự trọng từ những việc nhỏ nhất: trung thực trong thi cử, dám nhận lỗi, không a dua theo cái xấu. (Ngữ liệu minh họa — tự soạn) Câu văn nào thể hiện thao tác “bình luận” rõ nhất?", "options": ["A. “Lòng tự trọng là giá trị cao quý của con người.”", "B. “Những kẻ ấy có thể được lợi trước mắt, nhưng sẽ bị người đời khinh bỉ.”", "C. “Trong lịch sử, biết bao tấm gương…”", "D. “Mỗi chúng ta hãy rèn luyện…”"], "answer": "B", "explain": "Câu này đánh giá, bày tỏ thái độ (khinh bỉ) đối với kẻ thiếu tự trọng — đó là bình luận, khác với giải thích (A), chứng minh (C) và kêu gọi (D).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Thao tác “giải thích” nhằm làm rõ nghĩa của khái niệm, vấn đề.", "b) Thao tác “bình luận” là đưa ra đánh giá, thái độ và rút ra bài học.", "c) Một bài văn nghị luận chỉ được dùng duy nhất một thao tác lập luận.", "d) Dẫn chứng trong văn nghị luận cần tiêu biểu, xác thực."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: một bài văn thường kết hợp nhiều thao tác (giải thích, chứng minh, bình luận, bác bỏ...). d) Đúng: dẫn chứng phải tiêu biểu, xác thực, phù hợp.", "points": 1}, {"type": "short", "level": "NB", "q": "Bài diễn văn “Tôi có một ước mơ” của Martin Luther King được đọc vào năm nào, ở đâu?", "answer": "Ngày 28-8-1963, tại Washington (Mỹ)", "explain": "Bài diễn văn đọc ngày 28-8-1963 trước hơn 200.000 người tại Washington, trong cuộc tuần hành đòi quyền công dân của người da đen ở Mỹ.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lòng tự trọng của học sinh trong thi cử. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Lòng tự trọng trong thi cử thể hiện ở sự trung thực — làm bài bằng chính sức mình, không quay cóp, không gian lận. Đáng buồn là hiện nay, một bộ phận học sinh vì bệnh thành tích, vì sợ điểm kém mà sẵn sàng gian lận: mang tài liệu, trao đổi bài, thậm chí thuê người làm bài hộ. Hành vi ấy không chỉ vi phạm nội quy mà còn đánh mất lòng tự trọng, tự đánh cắp tương lai của chính mình — điểm số gian dối không phản ánh năng lực thật, khiến ta ảo tưởng và ngày càng tụt hậu. Ngược lại, những bạn trung thực dù điểm chưa cao nhưng được thầy cô, bạn bè tôn trọng, và quan trọng hơn, giữ được sự thanh thản trong tâm hồn. Mỗi học sinh hãy nhớ: thi cử trung thực là bài học đầu tiên về lòng tự trọng; chỉ có tri thức thật mới là hành trang vững chắc cho tương lai."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về bệnh thành tích trong giáo dục. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: nêu hiện tượng chạy theo thành tích hình thức trong giáo dục — vấn đề “bệnh thành tích”. 2. Thân bài: a) Giải thích: bệnh thành tích là coi trọng kết quả bề ngoài hơn chất lượng thực. b) Biểu hiện: ép học sinh giỏi ảo, gian lận thi cử, báo cáo số liệu đẹp; phụ huynh, nhà trường chạy theo danh hiệu. c) Nguyên nhân: áp lực thi đua, tư duy hình thức, thiếu đánh giá thực chất. d) Tác hại: học sinh hổng kiến thức, mất trung thực; giáo dục phát triển lệch lạc; lãng phí nguồn lực. e) Giải pháp: đổi mới đánh giá theo năng lực thực; giảm áp lực thi đua hình thức; giáo dục lòng trung thực; mỗi thầy cô, phụ huynh, học sinh nói không với gian dối. f) Liên hệ bản thân. 3. Kết bài: khẳng định chất lượng thật mới là mục tiêu của giáo dục; lời kêu gọi."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nSự tử tế là điều giản dị nhất mà cũng quý giá nhất trong cuộc sống. Một nụ cười, một lời chào, một việc giúp đỡ nhỏ — đôi khi đủ sưởi ấm cả một tâm hồn đang lạnh giá. Người ta vẫn kể về những “anh hùng” đời thường: bác xe ôm miễn phí chở học sinh nghèo, cô bán hàng rong dành dụm tiền ủng hộ đồng bào bão lụt, những bạn trẻ tình nguyện dạy học nơi vùng cao. Họ không giàu có, không nổi tiếng, nhưng sự tử tế của họ lan tỏa như hương thơm, khiến cuộc đời đẹp hơn. Trái lại, sự vô cảm — thấy người gặp nạn mà thờ ơ bước qua — đang làm xói mòn tình người. Đã có những vụ tai nạn mà nạn nhân phải chờ đợi trong tuyệt vọng vì không ai dừng lại giúp đỡ. Vì thế, hãy bắt đầu sự tử tế từ những việc nhỏ nhất hôm nay: nhường ghế cho người già, an ủi bạn đang buồn, không xả rác bừa bãi. Tử tế với người khác cũng là tử tế với chính mình. (Ngữ liệu minh họa — tự soạn) Theo ngữ liệu, sự tử tế được thể hiện qua những việc như thế nào?", "options": ["A. Những việc lớn lao, phi thường", "B. Những việc giản dị hằng ngày: nụ cười, lời chào, việc giúp đỡ nhỏ", "C. Chỉ bằng tiền bạc", "D. Chỉ dành cho người nổi tiếng"], "answer": "B", "explain": "Ngữ liệu khẳng định: “Một nụ cười, một lời chào, một việc giúp đỡ nhỏ” và các dẫn chứng đều là việc làm giản dị, đời thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nSự tử tế là điều giản dị nhất mà cũng quý giá nhất trong cuộc sống. Một nụ cười, một lời chào, một việc giúp đỡ nhỏ — đôi khi đủ sưởi ấm cả một tâm hồn đang lạnh giá. Người ta vẫn kể về những “anh hùng” đời thường: bác xe ôm miễn phí chở học sinh nghèo, cô bán hàng rong dành dụm tiền ủng hộ đồng bào bão lụt, những bạn trẻ tình nguyện dạy học nơi vùng cao. Họ không giàu có, không nổi tiếng, nhưng sự tử tế của họ lan tỏa như hương thơm, khiến cuộc đời đẹp hơn. Trái lại, sự vô cảm — thấy người gặp nạn mà thờ ơ bước qua — đang làm xói mòn tình người. Đã có những vụ tai nạn mà nạn nhân phải chờ đợi trong tuyệt vọng vì không ai dừng lại giúp đỡ. Vì thế, hãy bắt đầu sự tử tế từ những việc nhỏ nhất hôm nay: nhường ghế cho người già, an ủi bạn đang buồn, không xả rác bừa bãi. Tử tế với người khác cũng là tử tế với chính mình. (Ngữ liệu minh họa — tự soạn) Dẫn chứng về “bác xe ôm”, “cô bán hàng rong”, “bạn trẻ tình nguyện” có tác dụng gì?", "options": ["A. Chứng minh sự tử tế tồn tại ở những con người bình dị quanh ta, có sức lan tỏa", "B. Quảng cáo", "C. Kể chuyện vui", "D. Phê phán người giàu"], "answer": "A", "explain": "Các dẫn chứng đều là người bình thường với việc làm bình dị — chứng minh sự tử tế không xa vời mà ở ngay quanh ta, và có sức lan tỏa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nSự tử tế là điều giản dị nhất mà cũng quý giá nhất trong cuộc sống. Một nụ cười, một lời chào, một việc giúp đỡ nhỏ — đôi khi đủ sưởi ấm cả một tâm hồn đang lạnh giá. Người ta vẫn kể về những “anh hùng” đời thường: bác xe ôm miễn phí chở học sinh nghèo, cô bán hàng rong dành dụm tiền ủng hộ đồng bào bão lụt, những bạn trẻ tình nguyện dạy học nơi vùng cao. Họ không giàu có, không nổi tiếng, nhưng sự tử tế của họ lan tỏa như hương thơm, khiến cuộc đời đẹp hơn. Trái lại, sự vô cảm — thấy người gặp nạn mà thờ ơ bước qua — đang làm xói mòn tình người. Đã có những vụ tai nạn mà nạn nhân phải chờ đợi trong tuyệt vọng vì không ai dừng lại giúp đỡ. Vì thế, hãy bắt đầu sự tử tế từ những việc nhỏ nhất hôm nay: nhường ghế cho người già, an ủi bạn đang buồn, không xả rác bừa bãi. Tử tế với người khác cũng là tử tế với chính mình. (Ngữ liệu minh họa — tự soạn) Việc đưa ra hiện tượng “vô cảm” trong đoạn 4 có tác dụng gì về mặt lập luận?", "options": ["A. Làm rối vấn đề", "B. Dùng mặt trái để đối lập, làm nổi bật giá trị của sự tử tế và tính cấp thiết của vấn đề", "C. Để phê phán nạn nhân", "D. Không có tác dụng"], "answer": "B", "explain": "Nêu mặt trái (vô cảm) để đối lập với mặt phải (tử tế) là thủ pháp lập luận quen thuộc: càng thấy tác hại của vô cảm, càng thấy quý giá sự tử tế.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Luận cứ gồm lí lẽ và dẫn chứng làm sáng tỏ luận điểm.", "b) Dẫn chứng trong văn nghị luận càng nhiều càng tốt, không cần chọn lọc.", "c) Câu “Tử tế với người khác cũng là tử tế với chính mình” là một lời bình luận sâu sắc.", "d) Bố cục của ngữ liệu đi từ khái niệm đến dẫn chứng, phản đề rồi kêu gọi hành động."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: dẫn chứng cần tiêu biểu, xác thực, phù hợp — nhiều mà lan man sẽ làm loãng bài. c) Đúng: vừa là bình luận vừa là đúc kết triết lí. d) Đúng: cấu trúc chặt chẽ của một đoạn văn nghị luận hoàn chỉnh.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên tác giả của văn bản “Một thời đại trong thi ca” và nhận định nổi tiếng nhất của ông về Thơ mới.", "answer": "Hoài Thanh — Thơ mới là sự xuất hiện của “cái tôi” cá nhân", "explain": "Hoài Thanh (1909 – 1982); nhận định kinh điển: tinh thần Thơ mới là sự xuất hiện của “cái tôi” với ý thức cá nhân sâu sắc — điều chưa từng có trong thơ ca truyền thống.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn nghị luận xã hội khoảng 200 chữ về sự tử tế trong cuộc sống. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Sự tử tế là món quà quý giá nhất mà con người có thể trao cho nhau. Nó không cần những việc lớn lao, phi thường — đôi khi chỉ là nụ cười thân thiện, lời chào buổi sáng, cái nhường ghế trên xe buýt hay bàn tay chìa ra với người gặp khó khăn. Sự tử tế có sức mạnh kì diệu: nó sưởi ấm tâm hồn người nhận và cũng làm đẹp tâm hồn người cho đi. Trong cuộc sống hôm nay, khi sự vô cảm, ích kỉ có lúc lấn át, những hành động tử tế dù nhỏ bé lại càng đáng trân trọng — như những đốm lửa nhỏ xua tan bóng tối. Mỗi chúng ta hãy bắt đầu từ hôm nay: tử tế với gia đình, bạn bè, với cả người xa lạ. Bởi “tử tế với người khác cũng là tử tế với chính mình” — gieo nhân ái, ta sẽ gặt hạnh phúc."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về sự vô cảm trong xã hội hiện nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: nêu hiện tượng vô cảm (thờ ơ trước nỗi đau người khác) đang lan rộng — vấn đề cần lên án. 2. Thân bài: a) Giải thích: vô cảm là trạng thái thờ ơ, không rung động trước niềm vui, nỗi buồn của người khác. b) Biểu hiện: thấy người gặp nạn không cứu giúp; quay clip thay vì can ngăn bạo lực; sống ích kỉ, chỉ biết mình; vô cảm với người thân. c) Nguyên nhân: lối sống thực dụng, ích kỉ; sợ liên lụy, sợ phiền phức; ảnh hưởng của mạng xã hội (sống ảo thay vì sống thật); giáo dục thiếu sự đồng cảm. d) Tác hại: làm xói mòn tình người, xã hội lạnh lẽo; nạn nhân bị tổn thương gấp bội; chính kẻ vô cảm cũng đánh mất nhân tính. e) Giải pháp: giáo dục lòng nhân ái từ gia đình, nhà trường; đề cao, bảo vệ người tốt việc tốt; mỗi người rèn sự đồng cảm từ việc nhỏ. f) Phản đề: cần tỉnh táo, giúp đỡ đúng cách, tránh bị lợi dụng — nhưng đó không phải lí do để vô cảm. 3. Kết bài: khẳng định “người với người sống để yêu nhau”; kêu gọi hành động."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nMôi trường đang kêu cứu. Rừng bị tàn phá, biển đầy rác thải nhựa, không khí ô nhiễm, khí hậu biến đổi cực đoan — những thảm họa ấy đều có bàn tay con người. Việt Nam là một trong những quốc gia chịu ảnh hưởng nặng nề nhất của biến đổi khí hậu: hạn hán, xâm nhập mặn ở Đồng bằng sông Cửu Long, bão lũ miền Trung ngày càng dữ dội. Nguyên nhân chính là ý thức của một bộ phận người dân còn kém: xả rác bừa bãi, chặt phá rừng, lạm dụng túi ni lông. Bên cạnh đó, công tác quản lí, xử phạt chưa đủ sức răn đe. Nhưng vẫn còn hy vọng: nhiều bạn trẻ đã hành động — nhặt rác bãi biển, trồng cây gây rừng, từ chối đồ nhựa dùng một lần. Những việc làm nhỏ ấy đang lan tỏa thành phong trào. Bảo vệ môi trường là bảo vệ chính cuộc sống của chúng ta. Hãy hành động ngay hôm nay, từ việc từ chối một chiếc túi ni lông. (Ngữ liệu minh họa — tự soạn) Luận đề của ngữ liệu là gì?", "options": ["A. Kể về thiên tai", "B. Bàn về thực trạng ô nhiễm môi trường, nguyên nhân và kêu gọi hành động bảo vệ", "C. Giới thiệu du lịch", "D. Bàn về kinh tế"], "answer": "B", "explain": "Ngữ liệu nêu thực trạng (rừng bị tàn phá, biển đầy rác...), phân tích nguyên nhân và kết thúc bằng lời kêu gọi hành động — luận đề về bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nMôi trường đang kêu cứu. Rừng bị tàn phá, biển đầy rác thải nhựa, không khí ô nhiễm, khí hậu biến đổi cực đoan — những thảm họa ấy đều có bàn tay con người. Việt Nam là một trong những quốc gia chịu ảnh hưởng nặng nề nhất của biến đổi khí hậu: hạn hán, xâm nhập mặn ở Đồng bằng sông Cửu Long, bão lũ miền Trung ngày càng dữ dội. Nguyên nhân chính là ý thức của một bộ phận người dân còn kém: xả rác bừa bãi, chặt phá rừng, lạm dụng túi ni lông. Bên cạnh đó, công tác quản lí, xử phạt chưa đủ sức răn đe. Nhưng vẫn còn hy vọng: nhiều bạn trẻ đã hành động — nhặt rác bãi biển, trồng cây gây rừng, từ chối đồ nhựa dùng một lần. Những việc làm nhỏ ấy đang lan tỏa thành phong trào. Bảo vệ môi trường là bảo vệ chính cuộc sống của chúng ta. Hãy hành động ngay hôm nay, từ việc từ chối một chiếc túi ni lông. (Ngữ liệu minh họa — tự soạn) Dẫn chứng về Đồng bằng sông Cửu Long và miền Trung có tác dụng gì?", "options": ["A. Làm văn bản dài", "B. Chứng minh Việt Nam chịu ảnh hưởng nặng nề của biến đổi khí hậu — dẫn chứng cụ thể, gần gũi", "C. Quảng bá du lịch", "D. Không có tác dụng"], "answer": "B", "explain": "Dẫn chứng cụ thể về những vùng đất quen thuộc của Việt Nam khiến vấn đề trở nên gần gũi, có sức thuyết phục cao với người đọc Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nMôi trường đang kêu cứu. Rừng bị tàn phá, biển đầy rác thải nhựa, không khí ô nhiễm, khí hậu biến đổi cực đoan — những thảm họa ấy đều có bàn tay con người. Việt Nam là một trong những quốc gia chịu ảnh hưởng nặng nề nhất của biến đổi khí hậu: hạn hán, xâm nhập mặn ở Đồng bằng sông Cửu Long, bão lũ miền Trung ngày càng dữ dội. Nguyên nhân chính là ý thức của một bộ phận người dân còn kém: xả rác bừa bãi, chặt phá rừng, lạm dụng túi ni lông. Bên cạnh đó, công tác quản lí, xử phạt chưa đủ sức răn đe. Nhưng vẫn còn hy vọng: nhiều bạn trẻ đã hành động — nhặt rác bãi biển, trồng cây gây rừng, từ chối đồ nhựa dùng một lần. Những việc làm nhỏ ấy đang lan tỏa thành phong trào. Bảo vệ môi trường là bảo vệ chính cuộc sống của chúng ta. Hãy hành động ngay hôm nay, từ việc từ chối một chiếc túi ni lông. (Ngữ liệu minh họa — tự soạn) Cấu trúc lập luận của ngữ liệu có gì đặc sắc?", "options": ["A. Chỉ nêu thực trạng", "B. Đi từ thực trạng đến nguyên nhân, rồi mở ra hy vọng và kêu gọi hành động — mạch lập luận toàn diện, hướng tới giải pháp", "C. Chỉ phê phán", "D. Lộn xộn, thiếu logic"], "answer": "B", "explain": "Mạch lập luận: thực trạng đáng báo động — nguyên nhân — những tín hiệu tích cực — kêu gọi hành động. Cách triển khai này vừa thuyết phục vừa truyền cảm hứng, tránh gây bi quan.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Văn bản nghị luận về vấn đề xã hội thường có bố cục: thực trạng — nguyên nhân — hậu quả — giải pháp.", "b) Dẫn chứng càng gần gũi với người đọc càng có sức thuyết phục.", "c) Lời kêu gọi hành động thường đặt ở phần kết bài.", "d) Bảo vệ môi trường chỉ là trách nhiệm của Nhà nước, người dân không liên quan."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: bố cục phổ biến của NLXH về hiện tượng đời sống. b) Đúng. c) Đúng: kết bài là nơi khẳng định và kêu gọi. d) Sai: bảo vệ môi trường là trách nhiệm của mọi người, từ việc nhỏ nhất.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu tên hai thao tác lập luận được sử dụng phổ biến nhất trong văn nghị luận xã hội.", "answer": "Chứng minh và bình luận (hoặc: giải thích và chứng minh)", "explain": "Các thao tác phổ biến: giải thích, chứng minh, bình luận, bác bỏ — trong đó chứng minh (đưa dẫn chứng) và bình luận (đánh giá, rút bài học) được dùng nhiều nhất trong NLXH.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý thức bảo vệ môi trường của học sinh. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Bảo vệ môi trường là trách nhiệm của mỗi học sinh chúng ta, bắt đầu từ những việc nhỏ nhất. Thực tế, không ít bạn còn xả rác bừa bãi trong sân trường, lãng phí giấy, dùng túi ni lông thoải mái mà không nghĩ đến hậu quả. Mỗi chiếc túi ni lông phải mất hàng trăm năm mới phân hủy; mỗi tờ giấy lãng phí là một phần rừng xanh bị đốn hạ. Ngược lại, nhiều bạn đã hành động đẹp: bỏ rác đúng nơi quy định, mang bình nước cá nhân, tham gia ngày “Chủ nhật xanh”. Những việc nhỏ ấy, khi được hàng triệu học sinh cùng làm, sẽ tạo nên sức mạnh lớn. Hãy nhớ: Trái Đất chỉ có một, và tương lai của nó nằm trong tay chúng ta. Từ hôm nay, mỗi học sinh hãy nói không với rác thải nhựa, tiết kiệm điện nước, trồng thêm cây xanh — vì một môi trường xanh, sạch, đẹp."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về trách nhiệm của con người trong việc bảo vệ môi trường. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: “Môi trường đang kêu cứu” — đặt vấn đề trách nhiệm bảo vệ môi trường. 2. Thân bài: a) Giải thích: môi trường là không gian sống của con người; bảo vệ môi trường là giữ gìn sự sống. b) Thực trạng: ô nhiễm không khí, nguồn nước, rác thải nhựa; biến đổi khí hậu với hạn hán, bão lũ. c) Nguyên nhân: ý thức kém, lối sống tiêu dùng lãng phí; quản lí, xử phạt chưa nghiêm. d) Hậu quả: sức khỏe con người, thiệt hại kinh tế, đe dọa tương lai các thế hệ. e) Giải pháp: mỗi người thay đổi thói quen (giảm nhựa, tiết kiệm, phân loại rác); cộng đồng, nhà trường hành động; Nhà nước hoàn thiện chính sách, xử phạt nghiêm; phát triển công nghệ xanh. f) Dẫn chứng: các phong trào “Ngày Trái Đất”, bạn trẻ nhặt rác bãi biển. g) Liên hệ bản thân. 3. Kết bài: khẳng định bảo vệ môi trường là bảo vệ chính mình; lời kêu gọi hành động ngay hôm nay."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nThất bại là mẹ thành công — câu tục ngữ xưa vẫn còn nguyên giá trị. Không ai thành công mà chưa từng vấp ngã; điều quan trọng là ta đứng dậy như thế nào sau mỗi lần ngã. Edison đã thất bại hàng nghìn lần trước khi phát minh ra bóng đèn điện. Các nhà khoa học, doanh nhân vĩ đại đều có chung một điểm: không bỏ cuộc. Ngược lại, những kẻ sợ thất bại, mới vấp ngã đã nản chí, buông xuôi thì mãi mãi dậm chân tại chỗ. Thất bại chỉ thực sự là thất bại khi ta từ bỏ. Vì vậy, đừng sợ sai, đừng sợ ngã. Hãy coi mỗi thất bại là một bài học, mỗi vấp ngã là một bước đệm để ta trưởng thành và tiến xa hơn. (Ngữ liệu minh họa — tự soạn) Luận điểm trung tâm của ngữ liệu là gì?", "options": ["A. Thất bại là điều đáng sợ", "B. Thất bại là bài học quý giá; điều quan trọng là biết đứng dậy sau vấp ngã", "C. Không nên làm gì để tránh thất bại", "D. Thành công là dễ dàng"], "answer": "B", "explain": "Xuyên suốt ngữ liệu là quan điểm: thất bại không đáng sợ, nó là “mẹ thành công”; quan trọng là thái độ đứng dậy sau vấp ngã.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nThất bại là mẹ thành công — câu tục ngữ xưa vẫn còn nguyên giá trị. Không ai thành công mà chưa từng vấp ngã; điều quan trọng là ta đứng dậy như thế nào sau mỗi lần ngã. Edison đã thất bại hàng nghìn lần trước khi phát minh ra bóng đèn điện. Các nhà khoa học, doanh nhân vĩ đại đều có chung một điểm: không bỏ cuộc. Ngược lại, những kẻ sợ thất bại, mới vấp ngã đã nản chí, buông xuôi thì mãi mãi dậm chân tại chỗ. Thất bại chỉ thực sự là thất bại khi ta từ bỏ. Vì vậy, đừng sợ sai, đừng sợ ngã. Hãy coi mỗi thất bại là một bài học, mỗi vấp ngã là một bước đệm để ta trưởng thành và tiến xa hơn. (Ngữ liệu minh họa — tự soạn) Dẫn chứng về Edison có tác dụng gì?", "options": ["A. Chứng minh thất bại hàng nghìn lần vẫn có thể dẫn đến thành công nếu kiên trì", "B. Giới thiệu nhà khoa học", "C. Kể chuyện vui", "D. Phê phán Edison"], "answer": "A", "explain": "Edison thất bại “hàng nghìn lần” mới thành công — dẫn chứng điển hình, có sức thuyết phục mạnh mẽ cho luận điểm về giá trị của sự kiên trì.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nThất bại là mẹ thành công — câu tục ngữ xưa vẫn còn nguyên giá trị. Không ai thành công mà chưa từng vấp ngã; điều quan trọng là ta đứng dậy như thế nào sau mỗi lần ngã. Edison đã thất bại hàng nghìn lần trước khi phát minh ra bóng đèn điện. Các nhà khoa học, doanh nhân vĩ đại đều có chung một điểm: không bỏ cuộc. Ngược lại, những kẻ sợ thất bại, mới vấp ngã đã nản chí, buông xuôi thì mãi mãi dậm chân tại chỗ. Thất bại chỉ thực sự là thất bại khi ta từ bỏ. Vì vậy, đừng sợ sai, đừng sợ ngã. Hãy coi mỗi thất bại là một bài học, mỗi vấp ngã là một bước đệm để ta trưởng thành và tiến xa hơn. (Ngữ liệu minh họa — tự soạn) Câu “Thất bại chỉ thực sự là thất bại khi ta từ bỏ” sử dụng nghệ thuật gì và có ý nghĩa gì?", "options": ["A. Chơi chữ với từ “thất bại” — nhấn mạnh: thất bại chỉ đáng sợ khi ta đầu hàng; còn đứng dậy được thì đó chỉ là bài học", "B. Nói quá", "C. Ẩn dụ", "D. Không có nghệ thuật"], "answer": "A", "explain": "Lặp lại từ “thất bại” với hai sắc thái nghĩa khác nhau (vấp ngã cụ thể với sự đầu hàng hoàn toàn) — cách chơi chữ sâu sắc, đúc kết triết lí: kẻ thù lớn nhất là sự bỏ cuộc.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Tục ngữ, danh ngôn là nguồn dẫn chứng giàu sức thuyết phục trong văn nghị luận.", "b) Dẫn chứng về nhân vật lịch sử, vĩ nhân có tính xác thực cao.", "c) Trong văn nghị luận, không cần có phần bàn luận mở rộng hay liên hệ.", "d) “Thất bại là mẹ thành công” là một luận cứ lí lẽ mở đầu cho ngữ liệu."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: tục ngữ, danh ngôn là trí tuệ dân gian được thừa nhận rộng rãi. b) Đúng. c) Sai: phần mở rộng, liên hệ giúp bài văn sâu sắc, thuyết phục hơn. d) Đúng: câu tục ngữ đặt nền tảng lí lẽ cho toàn bộ lập luận.", "points": 1}, {"type": "short", "level": "NB", "q": "Văn bản “Tôi có một ước mơ” sử dụng biện pháp nghệ thuật nổi bật nào?", "answer": "Điệp ngữ (“Tôi có một ước mơ”)", "explain": "Điệp ngữ “Tôi có một ước mơ” được lặp lại nhiều lần tạo nhịp điệu hùng hồn, khắc sâu thông điệp về khát vọng bình đẳng, có sức lay động hàng triệu con tim.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn nghị luận xã hội khoảng 200 chữ về thái độ cần có khi đối mặt với thất bại. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Thất bại là điều không ai tránh khỏi trong đời, nhưng thái độ đối mặt với nó mới quyết định ta là ai. Người bản lĩnh coi thất bại là bài học: bình tĩnh nhìn lại sai lầm, rút kinh nghiệm và đứng dậy mạnh mẽ hơn — như Edison thất bại nghìn lần mới thắp sáng bóng đèn. Ngược lại, kẻ yếu đuối thì nản chí, đổ lỗi cho hoàn cảnh, thậm chí buông xuôi — và thất bại tạm thời biến thành thất bại vĩnh viễn. Trong học tập cũng vậy: điểm kém một bài kiểm tra không đáng sợ, đáng sợ là ta không dám đối diện để sửa sai. Vì vậy, mỗi chúng ta hãy rèn cho mình thái độ đúng đắn: dũng cảm thừa nhận sai lầm, kiên trì sửa chữa, không bỏ cuộc. Hãy nhớ: “Thất bại chỉ thực sự là thất bại khi ta từ bỏ” — vấp ngã ở đâu, đứng dậy ở đó, ta sẽ tiến xa hơn."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về ý nghĩa của tinh thần vượt khó trong cuộc sống. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: dẫn từ câu “Thất bại là mẹ thành công” — nêu vấn đề: tinh thần vượt khó. 2. Thân bài: a) Giải thích: vượt khó là không đầu hàng trước khó khăn, kiên trì vươn lên. b) Biểu hiện: học sinh nghèo vượt khó học giỏi; người khuyết tật vươn lên; doanh nhân khởi nghiệp từ hai bàn tay trắng. c) Dẫn chứng: thầy Nguyễn Ngọc Ký, Nick Vujicic, các tấm gương quanh ta. d) Ý nghĩa: giúp chinh phục mục tiêu, rèn bản lĩnh, truyền cảm hứng; khó khăn là “lò luyện” của thành công. e) Phản đề: phê phán thói nản chí, ỷ lại, đổ lỗi; phân biệt vượt khó với liều lĩnh mù quáng. f) Cách rèn luyện: đặt mục tiêu nhỏ, kiên trì từng bước; tìm sự giúp đỡ đúng lúc; giữ tinh thần lạc quan. g) Liên hệ bản thân. 3. Kết bài: khẳng định “lửa thử vàng, gian nan thử sức”; lời nhắn nhủ."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nLòng biết ơn là truyền thống quý báu của dân tộc ta: “Uống nước nhớ nguồn”, “Ăn quả nhớ kẻ trồng cây”. Biết ơn cha mẹ đã sinh thành, thầy cô đã dạy dỗ, biết ơn những người đã hi sinh vì đất nước. Thế nhưng, một bộ phận giới trẻ hôm nay đang dần quên đi truyền thống ấy. Có bạn coi sự hi sinh của cha mẹ là điều hiển nhiên, thờ ơ với thầy cô, vô tâm với những giá trị tốt đẹp quanh mình. Biểu hiện của lòng biết ơn không cần điều gì lớn lao: một lời cảm ơn chân thành, một việc làm thiết thực, sự cố gắng học tập, rèn luyện để không phụ lòng người đã vì ta. Người biết ơn là người sống có đạo lí, được mọi người yêu mến. Kẻ vô ơn, dù tài giỏi đến đâu, cũng khó được tôn trọng. Vì vậy, hãy nuôi dưỡng lòng biết ơn từ hôm nay — đó là nền tảng của nhân cách và cũng là cách ta làm đẹp cho cuộc đời. (Ngữ liệu minh họa — tự soạn) Hai câu tục ngữ được trích dẫn ở đầu ngữ liệu có tác dụng gì?", "options": ["A. Trang trí", "B. Làm luận cứ mở đầu: khẳng định lòng biết ơn là truyền thống quý báu của dân tộc", "C. Kể chuyện", "D. Phê phán"], "answer": "B", "explain": "Tục ngữ là trí tuệ dân gian được thừa nhận rộng rãi — trích dẫn chúng ở đầu bài tạo luận cứ vững chắc, uy tín cho luận đề về lòng biết ơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nLòng biết ơn là truyền thống quý báu của dân tộc ta: “Uống nước nhớ nguồn”, “Ăn quả nhớ kẻ trồng cây”. Biết ơn cha mẹ đã sinh thành, thầy cô đã dạy dỗ, biết ơn những người đã hi sinh vì đất nước. Thế nhưng, một bộ phận giới trẻ hôm nay đang dần quên đi truyền thống ấy. Có bạn coi sự hi sinh của cha mẹ là điều hiển nhiên, thờ ơ với thầy cô, vô tâm với những giá trị tốt đẹp quanh mình. Biểu hiện của lòng biết ơn không cần điều gì lớn lao: một lời cảm ơn chân thành, một việc làm thiết thực, sự cố gắng học tập, rèn luyện để không phụ lòng người đã vì ta. Người biết ơn là người sống có đạo lí, được mọi người yêu mến. Kẻ vô ơn, dù tài giỏi đến đâu, cũng khó được tôn trọng. Vì vậy, hãy nuôi dưỡng lòng biết ơn từ hôm nay — đó là nền tảng của nhân cách và cũng là cách ta làm đẹp cho cuộc đời. (Ngữ liệu minh họa — tự soạn) Đoạn 2 của ngữ liệu (“Thế nhưng, một bộ phận giới trẻ…”) thực hiện thao tác lập luận nào?", "options": ["A. Chứng minh", "B. Nêu thực trạng đáng lo ngại (mặt trái) để làm nổi bật tính cấp thiết của vấn đề", "C. Giải thích", "D. Kêu gọi"], "answer": "B", "explain": "Sau khi khẳng định truyền thống tốt đẹp, tác giả chỉ ra thực trạng một bộ phận giới trẻ quên đi truyền thống — nêu mặt trái để thấy vấn đề cần được quan tâm, giáo dục.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nLòng biết ơn là truyền thống quý báu của dân tộc ta: “Uống nước nhớ nguồn”, “Ăn quả nhớ kẻ trồng cây”. Biết ơn cha mẹ đã sinh thành, thầy cô đã dạy dỗ, biết ơn những người đã hi sinh vì đất nước. Thế nhưng, một bộ phận giới trẻ hôm nay đang dần quên đi truyền thống ấy. Có bạn coi sự hi sinh của cha mẹ là điều hiển nhiên, thờ ơ với thầy cô, vô tâm với những giá trị tốt đẹp quanh mình. Biểu hiện của lòng biết ơn không cần điều gì lớn lao: một lời cảm ơn chân thành, một việc làm thiết thực, sự cố gắng học tập, rèn luyện để không phụ lòng người đã vì ta. Người biết ơn là người sống có đạo lí, được mọi người yêu mến. Kẻ vô ơn, dù tài giỏi đến đâu, cũng khó được tôn trọng. Vì vậy, hãy nuôi dưỡng lòng biết ơn từ hôm nay — đó là nền tảng của nhân cách và cũng là cách ta làm đẹp cho cuộc đời. (Ngữ liệu minh họa — tự soạn) Câu “Kẻ vô ơn, dù tài giỏi đến đâu, cũng khó được tôn trọng” thể hiện quan điểm gì?", "options": ["A. Coi thường người tài", "B. Đề cao đạo đức, lòng biết ơn hơn cả tài năng — tài mà thiếu đức thì không được tôn trọng", "C. Khuyên không cần học giỏi", "D. Phê phán người nghèo"], "answer": "B", "explain": "Đây là một bình luận sắc sảo: đặt “đức” (lòng biết ơn) lên trên “tài” — quan điểm phù hợp với truyền thống “tiên học lễ, hậu học văn” của dân tộc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Tục ngữ, ca dao là nguồn luận cứ giàu sức thuyết phục trong văn nghị luận.", "b) Nêu mặt trái của vấn đề là thao tác không cần thiết trong văn nghị luận.", "c) Lòng biết ơn là biểu hiện của đạo lí làm người.", "d) Bài văn nghị luận xã hội cần có phần liên hệ bản thân."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: trí tuệ dân gian có sức thuyết phục cao. b) Sai: nêu mặt trái giúp nhìn vấn đề toàn diện, tăng sức thuyết phục. c) Đúng. d) Đúng: liên hệ bản thân thể hiện sự thấm nhuần vấn đề.", "points": 1}, {"type": "short", "level": "TH", "q": "Văn bản “Cầu hiền chiếu” thuộc thể loại văn học nào?", "answer": "Thể “chiếu” — văn bản của vua ban bố", "explain": "“Chiếu” là thể văn do vua ban bố (mệnh lệnh, kêu gọi của nhà vua); “Cầu hiền chiếu” là chiếu thư của vua Quang Trung chiêu mộ hiền tài, thuộc văn nghị luận chính luận cổ.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lòng biết ơn thầy cô. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): “Muốn sang thì bắc cầu Kiều, muốn con hay chữ thì yêu lấy thầy” — công ơn thầy cô như trời biển, là điều mỗi học trò phải khắc ghi. Thầy cô không chỉ truyền đạt tri thức mà còn dạy ta cách làm người: những đêm thức khuya soạn giáo án, những lời động viên khi ta nản chí, những lần nghiêm khắc cũng chỉ vì mong ta nên người. Thế nhưng, không ít bạn còn vô tâm: nói trống không với thầy cô, không chào hỏi, thậm chí xúc phạm thầy cô trên mạng xã hội — những hành vi đáng lên án. Biểu hiện lòng biết ơn không cần điều gì lớn lao: chăm ngoan học giỏi, lễ phép chào hỏi, một lời chúc chân thành ngày 20-11, và lớn lên sống có ích để thầy cô tự hào. Hãy nhớ: “Một chữ cũng là thầy, nửa chữ cũng là thầy” — biết ơn thầy cô là đạo lí làm người mà mỗi học sinh phải giữ gìn."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về truyền thống “Uống nước nhớ nguồn” của dân tộc. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giải thích câu tục ngữ “Uống nước nhớ nguồn” — nêu vấn đề: truyền thống biết ơn của dân tộc. 2. Thân bài: a) Giải thích: “uống nước nhớ nguồn” nghĩa là hưởng thụ thành quả phải nhớ đến người tạo ra nó — lòng biết ơn. b) Biểu hiện: nhớ ơn tổ tiên (thờ cúng, giỗ tổ Hùng Vương); biết ơn các anh hùng liệt sĩ (đền ơn đáp nghĩa, nghĩa trang liệt sĩ); biết ơn cha mẹ, thầy cô; biết ơn người lao động. c) Ý nghĩa: là đạo lí làm người, gắn kết cộng đồng, tạo sức mạnh dân tộc; người biết ơn được yêu mến, tôn trọng. d) Thực trạng đáng lo: một bộ phận giới trẻ vô ơn, thờ ơ — phê phán. e) Cách giữ gìn: giáo dục từ gia đình, nhà trường; hành động cụ thể (chăm sóc cha mẹ, đền ơn đáp nghĩa, học tập tốt). f) Liên hệ bản thân. 3. Kết bài: khẳng định đây là truyền thống quý báu cần phát huy; lời nhắn nhủ."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTrung thực là đức tính quý giá nhất của con người. Người trung thực dám nói thật, làm thật, không dối trá dù trong hoàn cảnh nào. Trong học tập, trung thực thể hiện ở việc tự làm bài, không quay cóp; trong cuộc sống, thể hiện ở việc dám nhận lỗi, giữ chữ tín. Có ý kiến cho rằng trong xã hội hiện nay, “thật thà thường thua thiệt”. Suy nghĩ ấy là sai lầm. Sự dối trá có thể mang lại lợi ích trước mắt, nhưng sẽ bị phát hiện và phải trả giá đắt. Lịch sử và thực tế đã chứng minh: những người thành công bền vững đều là những người trung thực, đáng tin cậy. Chữ “tín” chính là vốn quý nhất để lập thân, lập nghiệp. Vì vậy, mỗi chúng ta hãy rèn luyện tính trung thực từ hôm nay, từ những việc nhỏ nhất. (Ngữ liệu minh họa — tự soạn) Theo ngữ liệu, trung thực là gì?", "options": ["A. Là giàu có", "B. Là dám nói thật, làm thật, không dối trá trong mọi hoàn cảnh", "C. Là khéo léo", "D. Là im lặng"], "answer": "B", "explain": "Ngữ liệu định nghĩa trực tiếp ở câu đầu: trung thực là dám nói thật, làm thật, không dối trá.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTrung thực là đức tính quý giá nhất của con người. Người trung thực dám nói thật, làm thật, không dối trá dù trong hoàn cảnh nào. Trong học tập, trung thực thể hiện ở việc tự làm bài, không quay cóp; trong cuộc sống, thể hiện ở việc dám nhận lỗi, giữ chữ tín. Có ý kiến cho rằng trong xã hội hiện nay, “thật thà thường thua thiệt”. Suy nghĩ ấy là sai lầm. Sự dối trá có thể mang lại lợi ích trước mắt, nhưng sẽ bị phát hiện và phải trả giá đắt. Lịch sử và thực tế đã chứng minh: những người thành công bền vững đều là những người trung thực, đáng tin cậy. Chữ “tín” chính là vốn quý nhất để lập thân, lập nghiệp. Vì vậy, mỗi chúng ta hãy rèn luyện tính trung thực từ hôm nay, từ những việc nhỏ nhất. (Ngữ liệu minh họa — tự soạn) Ý kiến “thật thà thường thua thiệt” được tác giả xử lí như thế nào?", "options": ["A. Đồng tình", "B. Bác bỏ: cho rằng đó là suy nghĩ sai lầm, dối trá sẽ bị phát hiện và trả giá", "C. Bỏ qua", "D. Không nhắc đến"], "answer": "B", "explain": "Tác giả nêu ý kiến trái chiều rồi dùng “Suy nghĩ ấy là sai lầm” để bác bỏ, sau đó đưa lí lẽ chứng minh — thao tác bác bỏ điển hình.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTrung thực là đức tính quý giá nhất của con người. Người trung thực dám nói thật, làm thật, không dối trá dù trong hoàn cảnh nào. Trong học tập, trung thực thể hiện ở việc tự làm bài, không quay cóp; trong cuộc sống, thể hiện ở việc dám nhận lỗi, giữ chữ tín. Có ý kiến cho rằng trong xã hội hiện nay, “thật thà thường thua thiệt”. Suy nghĩ ấy là sai lầm. Sự dối trá có thể mang lại lợi ích trước mắt, nhưng sẽ bị phát hiện và phải trả giá đắt. Lịch sử và thực tế đã chứng minh: những người thành công bền vững đều là những người trung thực, đáng tin cậy. Chữ “tín” chính là vốn quý nhất để lập thân, lập nghiệp. Vì vậy, mỗi chúng ta hãy rèn luyện tính trung thực từ hôm nay, từ những việc nhỏ nhất. (Ngữ liệu minh họa — tự soạn) Câu “Chữ “tín” chính là vốn quý nhất để lập thân, lập nghiệp” có thể coi là gì trong văn bản?", "options": ["A. Luận cứ", "B. Lời bình luận, đúc kết sâu sắc — khẳng định giá trị của trung thực", "C. Dẫn chứng", "D. Luận đề"], "answer": "B", "explain": "Đây là câu đúc kết, đánh giá giá trị của trung thực (“vốn quý nhất”) — mang tính bình luận, khái quát, thường đặt ở phần kết của mạch lập luận.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Thao tác “bác bỏ” giúp bài văn thêm sức thuyết phục khi đối diện ý kiến trái chiều.", "b) Trong văn nghị luận, có thể nêu ý kiến trái chiều rồi phản bác.", "c) Trung thực chỉ cần trong thi cử, ngoài đời không quan trọng.", "d) “Chữ tín” là uy tín, sự đáng tin cậy của con người."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: đây là cách lập luận phổ biến, thể hiện tư duy phản biện. c) Sai: trung thực cần trong mọi lĩnh vực của đời sống. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên đầy đủ của tác giả bài diễn văn “Tôi có một ước mơ”.", "answer": "Martin Luther King", "explain": "Martin Luther King (1929 – 1968), nhà hoạt động nhân quyền vĩ đại của người da đen ở Mỹ, giải Nobel Hòa bình 1964.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn nghị luận xã hội khoảng 200 chữ về tính trung thực trong cuộc sống. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Trung thực là nền tảng của nhân cách và là “vốn quý nhất để lập thân, lập nghiệp”. Người trung thực dám nói thật, làm thật, giữ chữ tín nên luôn được mọi người tin yêu, tôn trọng; trong công việc, họ là đối tác đáng tin cậy; trong cuộc sống, họ sống thanh thản vì không phải che giấu điều gì. Ngược lại, dối trá dù mang lại lợi ích trước mắt nhưng sẽ bị phát hiện, và cái giá phải trả là mất niềm tin — thứ một khi mất đi rất khó lấy lại. Đáng buồn là hiện nay, sự dối trá vẫn tồn tại: gian lận thi cử, hàng giả, tin giả trên mạng… Mỗi chúng ta, nhất là học sinh, hãy rèn tính trung thực từ việc nhỏ: tự làm bài, dám nhận lỗi, giữ lời hứa. Sống trung thực không chỉ làm đẹp nhân cách mà còn góp phần xây dựng một xã hội lành mạnh, đáng sống."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về hiện tượng gian lận trong thi cử. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: nêu hiện tượng gian lận thi cử vẫn tồn tại — vấn đề cần lên án. 2. Thân bài: a) Giải thích: gian lận thi cử là quay cóp, mang tài liệu, trao đổi bài… b) Biểu hiện: các hình thức gian lận ngày càng tinh vi (thiết bị công nghệ). c) Nguyên nhân: bệnh thành tích, áp lực điểm số; ý thức kém; sự buông lỏng quản lí. d) Tác hại: đánh giá sai năng lực, tạo thế hệ “học giả bằng thật”; xói mòn đạo đức, lòng tự trọng; làm méo mó nền giáo dục. e) Giải pháp: đổi mới cách đánh giá; xử phạt nghiêm; giáo dục lòng trung thực; mỗi học sinh tự giác nói không với gian lận. f) Liên hệ bản thân. 3. Kết bài: khẳng định “học thật, thi thật”; lời kêu gọi."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nĐọc sách là con đường ngắn nhất để tiếp cận tri thức nhân loại. Một cuốn sách hay mở ra trước mắt ta cả một thế giới: quá khứ, hiện tại, tương lai; những miền đất xa xôi và những tâm hồn đồng điệu. Người đọc sách nhiều có vốn hiểu biết phong phú, tư duy sâu sắc, tâm hồn giàu có. Không ngẫu nhiên mà các vĩ nhân đều là những người ham đọc sách. Thế nhưng, trong thời đại bùng nổ thông tin, nhiều người, nhất là giới trẻ, đang xa rời sách. Họ dành hàng giờ cho mạng xã hội, game mà không đọc nổi một cuốn sách mỗi năm. Hậu quả là tri thức nông cạn, khả năng diễn đạt kém, tâm hồn nghèo nàn. Đã đến lúc mỗi chúng ta phải chấn hưng văn hóa đọc, bắt đầu từ việc dành 30 phút mỗi ngày cho sách. “Một cuốn sách tốt là người bạn hiền” — hãy kết bạn với sách ngay hôm nay. (Ngữ liệu minh họa — tự soạn) Luận điểm mở đầu của ngữ liệu là gì?", "options": ["A. Đọc sách là con đường ngắn nhất để tiếp cận tri thức nhân loại", "B. Giới trẻ không đọc sách", "C. Sách rất đắt", "D. Mạng xã hội có hại"], "answer": "A", "explain": "Câu đầu tiên nêu luận điểm trung tâm, các đoạn sau triển khai: vai trò của sách, thực trạng xa rời sách, hậu quả và kêu gọi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nĐọc sách là con đường ngắn nhất để tiếp cận tri thức nhân loại. Một cuốn sách hay mở ra trước mắt ta cả một thế giới: quá khứ, hiện tại, tương lai; những miền đất xa xôi và những tâm hồn đồng điệu. Người đọc sách nhiều có vốn hiểu biết phong phú, tư duy sâu sắc, tâm hồn giàu có. Không ngẫu nhiên mà các vĩ nhân đều là những người ham đọc sách. Thế nhưng, trong thời đại bùng nổ thông tin, nhiều người, nhất là giới trẻ, đang xa rời sách. Họ dành hàng giờ cho mạng xã hội, game mà không đọc nổi một cuốn sách mỗi năm. Hậu quả là tri thức nông cạn, khả năng diễn đạt kém, tâm hồn nghèo nàn. Đã đến lúc mỗi chúng ta phải chấn hưng văn hóa đọc, bắt đầu từ việc dành 30 phút mỗi ngày cho sách. “Một cuốn sách tốt là người bạn hiền” — hãy kết bạn với sách ngay hôm nay. (Ngữ liệu minh họa — tự soạn) Bố cục của ngữ liệu được triển khai theo trình tự nào?", "options": ["A. Kể chuyện", "B. Nêu vấn đề (vai trò của sách) — thực trạng — hậu quả — giải pháp/kêu gọi", "C. Chỉ miêu tả", "D. Lộn xộn"], "answer": "B", "explain": "Mạch lập luận rõ ràng: khẳng định vai trò của sách — chỉ ra thực trạng xa rời sách — phân tích hậu quả — kêu gọi hành động. Đây là bố cục điển hình của NLXH.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nĐọc sách là con đường ngắn nhất để tiếp cận tri thức nhân loại. Một cuốn sách hay mở ra trước mắt ta cả một thế giới: quá khứ, hiện tại, tương lai; những miền đất xa xôi và những tâm hồn đồng điệu. Người đọc sách nhiều có vốn hiểu biết phong phú, tư duy sâu sắc, tâm hồn giàu có. Không ngẫu nhiên mà các vĩ nhân đều là những người ham đọc sách. Thế nhưng, trong thời đại bùng nổ thông tin, nhiều người, nhất là giới trẻ, đang xa rời sách. Họ dành hàng giờ cho mạng xã hội, game mà không đọc nổi một cuốn sách mỗi năm. Hậu quả là tri thức nông cạn, khả năng diễn đạt kém, tâm hồn nghèo nàn. Đã đến lúc mỗi chúng ta phải chấn hưng văn hóa đọc, bắt đầu từ việc dành 30 phút mỗi ngày cho sách. “Một cuốn sách tốt là người bạn hiền” — hãy kết bạn với sách ngay hôm nay. (Ngữ liệu minh họa — tự soạn) Câu kết “Một cuốn sách tốt là người bạn hiền” có tác dụng gì?", "options": ["A. Không có tác dụng", "B. Dùng danh ngôn để kết bài ấn tượng, khắc sâu thông điệp và kêu gọi hành động", "C. Để khoe kiến thức", "D. Để kéo dài bài"], "answer": "B", "explain": "Kết bài bằng danh ngôn vừa tạo ấn tượng sâu sắc, vừa khái quát thông điệp (hãy kết bạn với sách) — cách kết bài giàu sức thuyết phục.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định sau (tổng hợp Bài 3):", "statements": ["a) Văn bản nghị luận gồm các yếu tố: luận đề, luận điểm, luận cứ, lập luận.", "b) “Cầu hiền chiếu”, “Tôi có một ước mơ”, “Một thời đại trong thi ca” đều là văn bản nghị luận nhưng thuộc thể loại khác nhau.", "c) Dẫn chứng trong văn nghị luận phải tiêu biểu, xác thực, phù hợp với luận điểm.", "d) Viết văn nghị luận xã hội không cần có phần liên hệ bản thân."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: chiếu thư, diễn văn, tiểu luận phê bình — đa dạng thể loại. c) Đúng. d) Sai: liên hệ bản thân thể hiện sự thấm nhuần vấn đề, là phần quan trọng của NLXH.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu cấu trúc (bố cục) chung của một văn bản nghị luận.", "answer": "Mở bài (nêu luận đề) — Thân bài (triển khai luận điểm, luận cứ) — Kết bài (khẳng định, bài học, kêu gọi)", "explain": "Bố cục ba phần: mở bài nêu vấn đề; thân bài triển khai các luận điểm với luận cứ; kết bài khẳng định lại vấn đề, rút ra bài học, kêu gọi hành động.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn nghị luận xã hội khoảng 200 chữ về lợi ích của việc đọc sách. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Đọc sách mang lại vô vàn lợi ích cho con người. Trước hết, sách là kho tri thức vô tận, giúp ta hiểu biết về thế giới, về con người, về quá khứ và tương lai. Người đọc sách nhiều có vốn từ phong phú, tư duy sâu sắc, khả năng diễn đạt tốt — những hành trang quý giá cho học tập và công việc. Sách còn nuôi dưỡng tâm hồn: những câu chuyện đẹp gieo vào ta lòng nhân ái, những tấm gương sáng truyền cho ta nghị lực sống. Trong thời đại số, khi thông tin tràn lan mà nông cạn, việc đọc sách sâu càng trở nên quý giá, giúp ta tĩnh tâm, suy ngẫm. Vì vậy, mỗi chúng ta hãy tạo thói quen đọc sách mỗi ngày — “một cuốn sách tốt là người bạn hiền”, và người bạn ấy sẽ đồng hành cùng ta suốt cuộc đời."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ trình bày ý kiến của em về vấn đề: “Con người với cuộc sống xung quanh” (tự chọn một khía cạnh: tình yêu thương, trách nhiệm cộng đồng, hay ứng xử văn minh). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: con người không sống đơn độc mà luôn trong mối quan hệ với cuộc sống xung quanh — nêu khía cạnh em chọn (ví dụ: trách nhiệm với cộng đồng). 2. Thân bài: a) Giải thích khái niệm (trách nhiệm cộng đồng là gì). b) Biểu hiện: quan tâm việc chung, giúp đỡ người khó khăn, bảo vệ môi trường, sống văn minh. c) Ý nghĩa: gắn kết xã hội, cuộc sống tốt đẹp hơn; bản thân trưởng thành, được tôn trọng. d) Phản đề: phê phán lối sống ích kỉ, vô cảm, “đèn nhà ai nấy rạng”. e) Dẫn chứng: tấm gương người tốt việc tốt; phong trào tình nguyện. f) Bài học, giải pháp: bắt đầu từ việc nhỏ; liên hệ bản thân. 3. Kết bài: khẳng định con người chỉ thực sự hạnh phúc khi sống có trách nhiệm với xung quanh; lời nhắn nhủ."}]}]}
