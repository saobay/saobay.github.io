 cút làm ăn” đứng lên đánh giặc Pháp", "C. Quan lại", "D. Thương nhân"], "answer": "B", "explain": "“Cui cút làm ăn, toan lo nghèo khó”, “chỉ biết ruộng trâu” — họ là nông dân chất phác đứng lên chống giặc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Nhớ linh xưa:\nCui cút làm ăn, toan lo nghèo khó,\nChưa quen cung ngựa, đâu tới trường nhung;\nChỉ biết ruộng trâu, ở trong làng bộ.\n...\nĐạp rào lướt tới, coi giặc cũng như không;\nĐâm ngang chém ngược, làm cho mã tà ma ní hồn kinh.”\n(Trích “Văn tế nghĩa sĩ Cần Giuộc” — Nguyễn Đình Chiểu) Nghệ thuật đối lập trong đoạn trích thể hiện ở điểm nào?", "options": ["A. Không có đối lập", "B. Đối lập giữa vũ khí thô sơ, thân phận bình dị (“manh áo vải”, “chưa quen cung ngựa”) với khí phách anh hùng (“đạp rào lướt tới”, “đâm ngang chém ngược”) — tạo vẻ đẹp bi tráng", "C. Đối lập giàu nghèo", "D. Đối lập già trẻ"], "answer": "B", "explain": "Tương phản mạnh: con người bình dị, vũ khí thô sơ tương phản với hành động anh hùng, lẫm liệt — vẻ đẹp bi tráng của người nông dân yêu nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Nhớ linh xưa:\nCui cút làm ăn, toan lo nghèo khó,\nChưa quen cung ngựa, đâu tới trường nhung;\nChỉ biết ruộng trâu, ở trong làng bộ.\n...\nĐạp rào lướt tới, coi giặc cũng như không;\nĐâm ngang chém ngược, làm cho mã tà ma ní hồn kinh.”\n(Trích “Văn tế nghĩa sĩ Cần Giuộc” — Nguyễn Đình Chiểu) Cụm từ “coi giặc cũng như không” thể hiện điều gì?", "options": ["A. Khinh địch", "B. Khí phách hiên ngang, coi thường hiểm nguy của nghĩa sĩ — lòng yêu nước đã biến những người nông dân thành anh hùng", "C. Sợ giặc", "D. Không thể hiện gì"], "answer": "B", "explain": "“Coi giặc cũng như không” — sự dũng cảm tuyệt vời: khi lòng yêu nước bùng cháy, con người vượt lên trên nỗi sợ hãi thông thường.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Văn tế nghĩa sĩ Cần Giuộc” được Nguyễn Đình Chiểu viết năm 1861 để tế nghĩa sĩ hi sinh ở Cần Giuộc.", "b) Tác phẩm ca ngợi lòng yêu nước của người nông dân.", "c) Giọng điệu của bài văn tế vừa bi thương vừa hùng tráng (bi tráng).", "d) Nguyễn Đình Chiểu là nhà thơ mù lòa nhưng giàu lòng yêu nước."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: tế nghĩa sĩ trận Cần Giuộc chống Pháp. b) Đúng. c) Đúng: xót thương (bi) + ca ngợi (tráng). d) Đúng: mù từ năm 25 tuổi, tấm gương nghị lực.", "points": 1}, {"type": "short", "level": "TH", "q": "Văn tế là thể loại văn học như thế nào?", "answer": "Văn bản đọc trong lễ cúng tế người đã khuất", "explain": "Văn tế là thể văn đọc trong lễ tế người chết, bày tỏ lòng thương tiếc, ca ngợi công đức; kết cấu thường có: lung khởi, thích thực, ai vãn, kết.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ cảm nhận về vẻ đẹp của người nghĩa sĩ Cần Giuộc qua ngữ liệu Đề 2. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Hình ảnh người nghĩa sĩ Cần Giuộc hiện lên với vẻ đẹp bi tráng, khiến lòng tôi vô cùng xúc động và khâm phục. Họ chỉ là những người nông dân “cui cút làm ăn”, “chỉ biết ruộng trâu” — bình dị, chất phác, chưa từng cầm gươm đánh trận. Vậy mà khi giặc đến, họ đã “đạp rào lướt tới, coi giặc cũng như không”, “đâm ngang chém ngược” với khí phách anh hùng. Sự đối lập giữa vũ khí thô sơ và tinh thần dũng cảm càng làm nổi bật vẻ đẹp của họ: sức mạnh không đến từ gươm giáo mà từ lòng yêu nước nồng nàn. Họ đã lựa chọn hi sinh chứ không chịu sống nhục — sự lựa chọn cao cả nhất của con người. Đọc đoạn văn tế, tôi thấm thía hơn giá trị của hòa bình hôm nay và tự nhủ phải sống xứng đáng với sự hi sinh của cha ông."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ phân tích đoạn trích “Văn tế nghĩa sĩ Cần Giuộc” của Nguyễn Đình Chiểu. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu Nguyễn Đình Chiểu, hoàn cảnh sáng tác (1861, tế nghĩa sĩ Cần Giuộc); vấn đề: bản anh hùng ca bi tráng. 2. Thân bài: a) Hình ảnh người nông dân nghĩa sĩ: bình dị (“cui cút làm ăn”) mà anh hùng (“đạp rào lướt tới”). b) Nghệ thuật đối lập tạo vẻ đẹp bi tráng. c) Tình cảm của tác giả: xót thương (bi) + ca ngợi (tráng); tố cáo giặc Pháp. d) Ngôn ngữ: vừa trang trọng vừa bình dị Nam Bộ. e) Ý nghĩa: khẳng định sức mạnh lòng yêu nước; sự lựa chọn hi sinh cao cả. 3. Kết bài: khẳng định giá trị; bài học về lòng yêu nước hôm nay."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTrong cuốn “Thế giới như tôi thấy”, An-be Anh-xtanh viết về mối quan hệ giữa cá nhân và cộng đồng: con người không thể sống tách rời xã hội. Mỗi chúng ta vừa thụ hưởng những thành quả của cộng đồng (tri thức, văn minh, sự che chở), vừa có trách nhiệm đóng góp lại. Sống có ý nghĩa, theo Einstein, là sống vì người khác, vì cộng đồng — chứ không phải sống ích kỉ cho riêng mình. Triết lí ấy, dù viết cách đây gần một thế kỉ, vẫn còn nguyên giá trị trong thế giới hôm nay. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Theo Einstein, mối quan hệ giữa cá thể và cộng đồng là gì?", "options": ["A. Tách rời nhau", "B. Gắn bó: cá thể vừa thụ hưởng thành quả cộng đồng vừa có trách nhiệm đóng góp", "C. Đối đầu", "D. Không liên quan"], "answer": "B", "explain": "Ngữ liệu nêu rõ hai chiều: thụ hưởng và đóng góp — mối quan hệ gắn bó, tương hỗ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTrong cuốn “Thế giới như tôi thấy”, An-be Anh-xtanh viết về mối quan hệ giữa cá nhân và cộng đồng: con người không thể sống tách rời xã hội. Mỗi chúng ta vừa thụ hưởng những thành quả của cộng đồng (tri thức, văn minh, sự che chở), vừa có trách nhiệm đóng góp lại. Sống có ý nghĩa, theo Einstein, là sống vì người khác, vì cộng đồng — chứ không phải sống ích kỉ cho riêng mình. Triết lí ấy, dù viết cách đây gần một thế kỉ, vẫn còn nguyên giá trị trong thế giới hôm nay. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Theo Einstein, sống có ý nghĩa là sống như thế nào?", "options": ["A. Sống hưởng thụ", "B. Sống vì người khác, vì cộng đồng — chứ không ích kỉ cho riêng mình", "C. Sống cô độc", "D. Sống giàu sang"], "answer": "B", "explain": "“Sống có ý nghĩa là sống vì người khác, vì cộng đồng” — triết lí nhân văn của Einstein.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTrong cuốn “Thế giới như tôi thấy”, An-be Anh-xtanh viết về mối quan hệ giữa cá nhân và cộng đồng: con người không thể sống tách rời xã hội. Mỗi chúng ta vừa thụ hưởng những thành quả của cộng đồng (tri thức, văn minh, sự che chở), vừa có trách nhiệm đóng góp lại. Sống có ý nghĩa, theo Einstein, là sống vì người khác, vì cộng đồng — chứ không phải sống ích kỉ cho riêng mình. Triết lí ấy, dù viết cách đây gần một thế kỉ, vẫn còn nguyên giá trị trong thế giới hôm nay. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Triết lí của Einstein có điểm chung nào với chủ đề “Lựa chọn và hành động” của Bài 9?", "options": ["A. Không chung", "B. Cùng đề cao sự lựa chọn sống có trách nhiệm: chọn cống hiến thay vì ích kỉ — đó là “hành động” xứng đáng của con người", "C. Cùng viết về khoa học", "D. Cùng hài hước"], "answer": "B", "explain": "Einstein chọn sống vì cộng đồng; Nguyễn Công Trứ chọn sống tự do; nghĩa sĩ chọn hi sinh — cùng là những lựa chọn cao đẹp, có trách nhiệm.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) An-be Anh-xtanh (1879 – 1955) là nhà vật lí thiên tài, cha đẻ thuyết tương đối.", "b) “Cộng đồng và cá thể” trích từ cuốn “Thế giới như tôi thấy”.", "c) Theo Einstein, cá nhân không cần có trách nhiệm với cộng đồng.", "d) Sống vì cộng đồng là triết lí có giá trị muôn đời."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: giải Nobel Vật lí 1921. b) Đúng. c) Sai: ngược lại — cá nhân có trách nhiệm đóng góp cho cộng đồng. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên cuốn sách mà văn bản “Cộng đồng và cá thể” được trích ra.", "answer": "“Thế giới như tôi thấy”", "explain": "Văn bản trích từ cuốn “Thế giới như tôi thấy” — tập hợp các bài viết, diễn văn thể hiện tư tưởng nhân văn của Einstein.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về trách nhiệm của cá nhân với cộng đồng (gợi ý từ ngữ liệu Đề 3). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Triết lí của Einstein nhắc nhở chúng ta về trách nhiệm của cá nhân với cộng đồng. Mỗi chúng ta sinh ra đã thụ hưởng biết bao thành quả của xã hội: tri thức trong sách vở, đường sá, bệnh viện, sự bình yên... — tất cả đều do bao thế hệ đi trước và cộng đồng hôm nay tạo dựng. Vì vậy, sống có trách nhiệm, biết đóng góp là đạo lí làm người. Trách nhiệm ấy thể hiện từ việc nhỏ: giữ gìn vệ sinh chung, tuân thủ pháp luật, giúp đỡ người khó khăn, đến việc lớn: học tập tốt để mai này cống hiến, bảo vệ Tổ quốc. Ngược lại, lối sống ích kỉ, chỉ biết hưởng thụ mà không đóng góp là đáng phê phán. Là học sinh, chúng ta hãy bắt đầu từ hôm nay: sống có trách nhiệm với gia đình, nhà trường và xã hội — để xứng đáng với những gì cộng đồng đã dành cho mình, như lời Einstein dạy: sống có ý nghĩa là sống vì người khác."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về trách nhiệm của tuổi trẻ với cộng đồng. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ triết lí của Einstein, đặt vấn đề: trách nhiệm của tuổi trẻ với cộng đồng. 2. Thân bài: a) Giải thích: trách nhiệm với cộng đồng là ý thức và hành động vì lợi ích chung. b) Biểu hiện: tuân thủ pháp luật, giữ gìn môi trường, giúp đỡ người khó khăn, tham gia tình nguyện, học tập tốt để cống hiến. c) Ý nghĩa: cộng đồng tốt đẹp hơn; bản thân trưởng thành; phát huy truyền thống “lá lành đùm lá rách”. d) Phản đề: phê phán lối sống ích kỉ, vô cảm, “sống ảo”. e) Dẫn chứng: tấm gương tuổi trẻ tình nguyện, sáng tạo vì cộng đồng. f) Liên hệ bản thân. 3. Kết bài: khẳng định “sống là cho đâu chỉ nhận riêng mình”; lời kêu gọi hành động."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Làm việc” cũng là “làm người”! Đó là thông điệp của văn bản Thực hành đọc trong Bài 9. Văn bản kể về những con người lao động bình dị mà cao quý: họ làm việc không chỉ để mưu sinh mà còn để khẳng định nhân cách, để sống có ích. Qua đó, tác giả gửi gắm triết lí: lao động là vinh quang; con người trở nên cao đẹp chính trong lao động. “Làm việc” — hành động cụ thể; “làm người” — mục đích cao cả. Hai vế gắn bó không thể tách rời. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Thông điệp chính của văn bản “‘Làm việc’ cũng là ‘làm người’!” là gì?", "options": ["A. Chỉ cần làm việc kiếm tiền", "B. Lao động không chỉ để mưu sinh mà còn để khẳng định nhân cách, sống có ích — “làm việc” gắn với “làm người”", "C. Không cần làm việc", "D. Làm người khó hơn làm việc"], "answer": "B", "explain": "Thông điệp được nêu trực tiếp: lao động là vinh quang; con người cao đẹp chính trong lao động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Làm việc” cũng là “làm người”! Đó là thông điệp của văn bản Thực hành đọc trong Bài 9. Văn bản kể về những con người lao động bình dị mà cao quý: họ làm việc không chỉ để mưu sinh mà còn để khẳng định nhân cách, để sống có ích. Qua đó, tác giả gửi gắm triết lí: lao động là vinh quang; con người trở nên cao đẹp chính trong lao động. “Làm việc” — hành động cụ thể; “làm người” — mục đích cao cả. Hai vế gắn bó không thể tách rời. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Mối quan hệ giữa “làm việc” và “làm người” theo văn bản là gì?", "options": ["A. Tách rời", "B. Gắn bó không thể tách rời: làm việc tốt là một cách làm người tốt; nhân cách được rèn luyện qua lao động", "C. Đối lập", "D. Không liên quan"], "answer": "B", "explain": "“Hai vế gắn bó không thể tách rời”: lao động vừa tạo ra của cải vừa rèn luyện nhân cách — đó là triết lí sâu sắc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Làm việc” cũng là “làm người”! Đó là thông điệp của văn bản Thực hành đọc trong Bài 9. Văn bản kể về những con người lao động bình dị mà cao quý: họ làm việc không chỉ để mưu sinh mà còn để khẳng định nhân cách, để sống có ích. Qua đó, tác giả gửi gắm triết lí: lao động là vinh quang; con người trở nên cao đẹp chính trong lao động. “Làm việc” — hành động cụ thể; “làm người” — mục đích cao cả. Hai vế gắn bó không thể tách rời. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Văn bản có điểm chung nào với chủ đề Bài 9?", "options": ["A. Không chung", "B. Cùng đề cao sự lựa chọn hành động đúng đắn: chọn lao động chân chính, sống có ích — đó là cách “làm người” xứng đáng", "C. Cùng viết về chiến tranh", "D. Cùng hài hước"], "answer": "B", "explain": "“Làm việc” cũng là một sự “lựa chọn và hành động”: chọn lao động chân chính thay vì lười biếng, ỷ lại — lựa chọn làm nên nhân cách.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “‘Làm việc’ cũng là ‘làm người’!” là văn bản Thực hành đọc trong Bài 9.", "b) Lao động vừa tạo ra của cải vừa rèn luyện nhân cách con người.", "c) Chỉ cần “làm người” tốt mà không cần “làm việc”.", "d) Lười biếng, ỷ lại là biểu hiện của sự thiếu trách nhiệm với bản thân và cộng đồng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: giá trị kép của lao động. c) Sai: “làm việc” và “làm người” gắn bó không tách rời. d) Đúng.", "points": 1}, {"type": "short", "level": "TH", "q": "Kể tên ba văn bản đọc chính trong Bài 9.", "answer": "“Bài ca ngất ngưởng”, “Văn tế nghĩa sĩ Cần Giuộc”, “Cộng đồng và cá thể”", "explain": "Ba văn bản: “Bài ca ngất ngưởng” (Nguyễn Công Trứ), “Văn tế nghĩa sĩ Cần Giuộc” (Nguyễn Đình Chiểu), “Cộng đồng và cá thể” (Einstein).", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ về ý nghĩa của lao động trong cuộc sống (gợi ý từ ngữ liệu Đề 4). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Lao động có ý nghĩa vô cùng to lớn trong cuộc sống con người, đúng như thông điệp “‘Làm việc’ cũng là ‘làm người’!”. Trước hết, lao động tạo ra của cải vật chất nuôi sống con người và phát triển xã hội. Nhưng quan trọng hơn, lao động rèn luyện nhân cách: người chăm chỉ lao động sẽ có ý chí, nghị lực, tính kỉ luật và lòng tự trọng; ngược lại, lười biếng khiến con người ỷ lại, hư hỏng. Nhìn quanh ta, những con người đáng kính nhất đều là những người lao động chân chính: bác nông dân một nắng hai sương, cô công nhân cần mẫn, thầy cô tận tụy... Chính trong lao động, họ khẳng định giá trị bản thân và đóng góp cho đời. Là học sinh, “lao động” của chúng ta là học tập: hãy học tập chăm chỉ, trung thực — đó cũng là cách “làm người” tốt nhất ở tuổi học trò."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về ý nghĩa của lao động đối với tuổi trẻ. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ thông điệp “‘Làm việc’ cũng là ‘làm người’!”, đặt vấn đề: ý nghĩa của lao động với tuổi trẻ. 2. Thân bài: a) Giải thích: lao động là hoạt động tạo ra giá trị; với tuổi trẻ, lao động là học tập, rèn luyện. b) Ý nghĩa: tạo ra của cải; rèn ý chí, nhân cách; khẳng định giá trị bản thân; góp phần xây dựng đất nước. c) Dẫn chứng: tấm gương lao động sáng tạo của tuổi trẻ. d) Phản đề: phê phán thói lười biếng, ỷ lại, “há miệng chờ sung”; phân biệt lao động chân chính với lao động cật lực mù quáng. e) Cách rèn: chăm học, làm việc nhà, tham gia lao động công ích. f) Liên hệ bản thân. 3. Kết bài: khẳng định “lao động là vinh quang”; lời nhắn nhủ."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nĐứng trước ngã rẽ cuộc đời, mỗi người đều phải lựa chọn: chọn nghề gì, sống ở đâu, theo đuổi giá trị nào. Lựa chọn đúng đắn đưa ta đến thành công, hạnh phúc; lựa chọn sai lầm có thể khiến ta trả giá đắt. Nhưng lựa chọn chỉ là bước đầu — điều quyết định là hành động. Bao người có ước mơ đẹp mà mãi không thực hiện vì ngại khó; bao người chọn đúng hướng mà bỏ cuộc giữa chừng. Vì vậy, hãy lựa chọn bằng cả trái tim và lí trí, rồi hành động kiên trì đến cùng. “Lựa chọn và hành động” — đó là công thức của một cuộc đời xứng đáng. (Ngữ liệu nghị luận — tự soạn) Theo ngữ liệu, mối quan hệ giữa “lựa chọn” và “hành động” là gì?", "options": ["A. Chỉ cần lựa chọn", "B. Lựa chọn là bước đầu, hành động kiên trì mới quyết định thành công — cả hai đều cần thiết", "C. Chỉ cần hành động", "D. Không liên quan"], "answer": "B", "explain": "Ngữ liệu khẳng định: “lựa chọn chỉ là bước đầu — điều quyết định là hành động”; cần cả hai: chọn đúng và làm đến cùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nĐứng trước ngã rẽ cuộc đời, mỗi người đều phải lựa chọn: chọn nghề gì, sống ở đâu, theo đuổi giá trị nào. Lựa chọn đúng đắn đưa ta đến thành công, hạnh phúc; lựa chọn sai lầm có thể khiến ta trả giá đắt. Nhưng lựa chọn chỉ là bước đầu — điều quyết định là hành động. Bao người có ước mơ đẹp mà mãi không thực hiện vì ngại khó; bao người chọn đúng hướng mà bỏ cuộc giữa chừng. Vì vậy, hãy lựa chọn bằng cả trái tim và lí trí, rồi hành động kiên trì đến cùng. “Lựa chọn và hành động” — đó là công thức của một cuộc đời xứng đáng. (Ngữ liệu nghị luận — tự soạn) Vì sao nhiều người có ước mơ đẹp mà không thành công?", "options": ["A. Vì kém may mắn", "B. Vì ngại khó, không hành động kiên trì; hoặc bỏ cuộc giữa chừng — thiếu hành động đi kèm lựa chọn", "C. Vì ước mơ xấu", "D. Không có lí do"], "answer": "B", "explain": "Ngữ liệu chỉ rõ: “ngại khó”, “bỏ cuộc giữa chừng” — lựa chọn đúng mà không hành động thì ước mơ mãi chỉ là mơ ước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nĐứng trước ngã rẽ cuộc đời, mỗi người đều phải lựa chọn: chọn nghề gì, sống ở đâu, theo đuổi giá trị nào. Lựa chọn đúng đắn đưa ta đến thành công, hạnh phúc; lựa chọn sai lầm có thể khiến ta trả giá đắt. Nhưng lựa chọn chỉ là bước đầu — điều quyết định là hành động. Bao người có ước mơ đẹp mà mãi không thực hiện vì ngại khó; bao người chọn đúng hướng mà bỏ cuộc giữa chừng. Vì vậy, hãy lựa chọn bằng cả trái tim và lí trí, rồi hành động kiên trì đến cùng. “Lựa chọn và hành động” — đó là công thức của một cuộc đời xứng đáng. (Ngữ liệu nghị luận — tự soạn) Lời khuyên “hãy lựa chọn bằng cả trái tim và lí trí” có ý nghĩa gì?", "options": ["A. Nghe theo cảm xúc", "B. Lựa chọn cần cả đam mê (trái tim) và sự tỉnh táo (lí trí) — tránh quyết định mù quáng hay khô khan", "C. Chỉ dùng lí trí", "D. Không ý nghĩa"], "answer": "B", "explain": "Trái tim cho đam mê, lí trí cho sự tỉnh táo — lựa chọn khôn ngoan là sự kết hợp cả hai, tránh cực đoan.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Lựa chọn đúng đắn là điều kiện cần nhưng chưa đủ — cần hành động kiên trì.", "b) Bỏ cuộc giữa chừng là nguyên nhân phổ biến của thất bại.", "c) Chỉ cần ước mơ đẹp là sẽ thành công, không cần hành động.", "d) Chủ đề “Lựa chọn và hành động” có ý nghĩa thiết thực với tuổi trẻ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: ước mơ phải đi kèm hành động. d) Đúng: tuổi trẻ đang đứng trước nhiều ngã rẽ.", "points": 1}, {"type": "short", "level": "NB", "q": "Nhan đề Bài 9 của SGK Ngữ văn 11 là gì?", "answer": "“Lựa chọn và hành động”", "explain": "Bài 9 có nhan đề “Lựa chọn và hành động” — chủ đề về sự lựa chọn đúng đắn và hành động kiên trì trong cuộc đời.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ về một lựa chọn quan trọng của em (hoặc của tuổi trẻ) và bài học rút ra. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Năm lớp 9, tôi đứng trước lựa chọn quan trọng: thi vào trường chuyên hay học trường gần nhà. Trường chuyên là ước mơ với môi trường tốt, nhưng áp lực lớn và xa nhà; trường gần nhà thì thoải mái nhưng ít thử thách. Sau nhiều đêm trăn trở, lắng nghe cả “trái tim” (khao khát thử sức) và “lí trí” (đánh giá sức mình), tôi chọn thi chuyên. Rồi tôi hành động: lập kế hoạch ôn tập chi tiết, kiên trì suốt một năm. Kết quả, tôi đỗ với số điểm cao. Lựa chọn ấy dạy tôi bài học quý giá: đừng sợ lựa chọn khó, chỉ sợ không dám hành động. “Lựa chọn và hành động” — khi ta chọn bằng cả trái tim và lí trí rồi kiên trì đến cùng, thành công sẽ mỉm cười. Đó cũng là hành trang tôi mang theo trên mỗi chặng đường sau này."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về vai trò của ước mơ và hành động trong cuộc sống tuổi trẻ. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: đặt vấn đề — ước mơ và hành động là đôi cánh của tuổi trẻ. 2. Thân bài: a) Giải thích: ước mơ là khát vọng; hành động là việc làm biến ước mơ thành hiện thực. b) Vai trò của ước mơ: định hướng, tạo động lực. c) Vai trò của hành động: biến ước mơ thành hiện thực; “lựa chọn chỉ là bước đầu”. d) Mối quan hệ: ước mơ không hành động là ảo tưởng; hành động không ước mơ là mù quáng — cần cả hai. e) Dẫn chứng: tấm gương biến ước mơ thành hiện thực. f) Phản đề: phê phán kẻ chỉ mơ mộng hoặc sống không ước mơ. g) Bài học: chọn ước mơ đẹp, hành động kiên trì; liên hệ bản thân. 3. Kết bài: khẳng định; lời nhắn nhủ tuổi trẻ dám ước mơ, dám hành động."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNguyễn Đình Chiểu mù lòa từ năm 25 tuổi, nhưng ông không gục ngã. Ông mở trường dạy học, bốc thuốc chữa bệnh cho dân, và sáng tác thơ văn yêu nước. Trong bóng tối của đôi mắt, ông vẫn “nhìn” thấy rõ lẽ phải, vẫn cầm bút chiến đấu bằng thơ văn. Người đời sau kính trọng gọi ông là “ngôi sao sáng trong văn nghệ của dân tộc”. Cuộc đời Nguyễn Đình Chiểu là minh chứng: nghị lực có thể chiến thắng số phận; người khiếm khuyết về thể chất vẫn có thể vĩ đại về tâm hồn. (Ngữ liệu tổng hợp — tự soạn) Nguyễn Đình Chiểu đã làm gì sau khi bị mù?", "options": ["A. Gục ngã, buông xuôi", "B. Mở trường dạy học, bốc thuốc chữa bệnh, sáng tác thơ văn yêu nước — sống có ích, cống hiến", "C. Đi ăn xin", "D. Không làm gì"], "answer": "B", "explain": "Ngữ liệu liệt kê: dạy học, làm thuốc, sáng tác — biến nghịch cảnh thành cống hiến.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNguyễn Đình Chiểu mù lòa từ năm 25 tuổi, nhưng ông không gục ngã. Ông mở trường dạy học, bốc thuốc chữa bệnh cho dân, và sáng tác thơ văn yêu nước. Trong bóng tối của đôi mắt, ông vẫn “nhìn” thấy rõ lẽ phải, vẫn cầm bút chiến đấu bằng thơ văn. Người đời sau kính trọng gọi ông là “ngôi sao sáng trong văn nghệ của dân tộc”. Cuộc đời Nguyễn Đình Chiểu là minh chứng: nghị lực có thể chiến thắng số phận; người khiếm khuyết về thể chất vẫn có thể vĩ đại về tâm hồn. (Ngữ liệu tổng hợp — tự soạn) Câu “trong bóng tối của đôi mắt, ông vẫn ‘nhìn’ thấy rõ lẽ phải” sử dụng nghệ thuật gì?", "options": ["A. So sánh", "B. Chơi chữ với từ “nhìn”: mù về thể chất nhưng sáng về tâm hồn, lí tưởng — nghệ thuật đối lập", "C. Nhân hóa", "D. Liệt kê"], "answer": "B", "explain": "“Nhìn” trong ngoặc kép: không nhìn bằng mắt mà “nhìn” bằng tâm hồn — đối lập giữa mù lòa thể chất và sáng suốt tinh thần.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNguyễn Đình Chiểu mù lòa từ năm 25 tuổi, nhưng ông không gục ngã. Ông mở trường dạy học, bốc thuốc chữa bệnh cho dân, và sáng tác thơ văn yêu nước. Trong bóng tối của đôi mắt, ông vẫn “nhìn” thấy rõ lẽ phải, vẫn cầm bút chiến đấu bằng thơ văn. Người đời sau kính trọng gọi ông là “ngôi sao sáng trong văn nghệ của dân tộc”. Cuộc đời Nguyễn Đình Chiểu là minh chứng: nghị lực có thể chiến thắng số phận; người khiếm khuyết về thể chất vẫn có thể vĩ đại về tâm hồn. (Ngữ liệu tổng hợp — tự soạn) Cuộc đời Nguyễn Đình Chiểu gửi gắm thông điệp gì về “lựa chọn và hành động”?", "options": ["A. Số phận quyết định tất cả", "B. Dù nghịch cảnh, con người vẫn có thể lựa chọn sống có ích, hành động cống hiến — nghị lực chiến thắng số phận", "C. Nên buông xuôi", "D. Không thông điệp"], "answer": "B", "explain": "Mù lòa không ngăn được ông cống hiến — thông điệp: hoàn cảnh không quyết định giá trị con người; lựa chọn và hành động mới quyết định.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Nguyễn Đình Chiểu (1822 – 1888), quê Gia Định, là nhà thơ yêu nước lớn.", "b) Ông bị mù từ năm 25 tuổi nhưng vẫn cống hiến không ngừng.", "c) Nghị lực có thể giúp con người chiến thắng nghịch cảnh.", "d) Người khuyết tật không thể làm nên điều lớn lao."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: bài học từ cuộc đời ông. d) Sai: Nguyễn Đình Chiểu và biết bao tấm gương đã chứng minh điều ngược lại.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên hiệu (danh xưng) mà người đời dành cho Nguyễn Đình Chiểu.", "answer": "“Ngôi sao sáng trong văn nghệ của dân tộc”", "explain": "Người đời kính trọng gọi Nguyễn Đình Chiểu là “ngôi sao sáng trong văn nghệ của dân tộc” — ghi nhận tài năng và nhân cách lớn của ông.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nghĩ của em về nghị lực của Nguyễn Đình Chiểu. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Cuộc đời Nguyễn Đình Chiểu khiến tôi vô cùng khâm phục. Mù lòa từ năm 25 tuổi — độ tuổi đẹp nhất của đời người — nhưng ông không gục ngã mà chọn cách sống có ích: mở trường dạy học, bốc thuốc cứu người, sáng tác thơ văn yêu nước. Trong “bóng tối của đôi mắt”, ông vẫn “nhìn” thấy rõ lẽ phải và cầm bút chiến đấu. Nghị lực ấy thật phi thường: thay vì oán trách số phận, ông biến nghịch cảnh thành động lực cống hiến. Cuộc đời ông là minh chứng sống động cho chân lí: giá trị con người không nằm ở sự lành lặn của thể chất mà ở sự vĩ đại của tâm hồn; nghị lực có thể chiến thắng số phận. Là học sinh lành lặn, tôi thấy mình càng phải nỗ lực hơn — không có lí do gì để than vãn, bỏ cuộc trước những khó khăn nhỏ bé trong học tập và cuộc sống."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về ý chí, nghị lực vượt lên nghịch cảnh. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ tấm gương Nguyễn Đình Chiểu, đặt vấn đề: nghị lực vượt nghịch cảnh. 2. Thân bài: a) Giải thích: nghịch cảnh là hoàn cảnh khó khăn, bất hạnh; nghị lực là sức mạnh tinh thần vượt qua. b) Biểu hiện: người khuyết tật thành công, học sinh nghèo vượt khó, bệnh nhân chiến thắng bệnh tật. c) Dẫn chứng: Nguyễn Đình Chiểu, thầy Nguyễn Ngọc Ký, Nick Vujicic, vận động viên Paralympic. d) Ý nghĩa: chiến thắng số phận, khẳng định giá trị bản thân, truyền cảm hứng. e) Phản đề: phê phán thói đổ lỗi cho hoàn cảnh, buông xuôi. f) Cách rèn: đặt mục tiêu, kiên trì, lạc quan, tìm sự giúp đỡ. g) Liên hệ bản thân. 3. Kết bài: khẳng định “tàn nhưng không phế”; lời nhắn nhủ."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTranh biện là hình thức tranh luận có tổ chức, có luật lệ: hai bên (ủng hộ và phản đối) thay phiên trình bày quan điểm, phản biện lẫn nhau trước ban giám khảo và khán giả. Muốn tranh biện tốt, cần chuẩn bị luận điểm, luận cứ vững chắc; dự đoán ý đối phương để phản biện; trình bày mạch lạc, tự tin; và luôn tôn trọng đối thủ. Tranh biện không phải để “hạ gục” đối phương mà để cùng tìm ra chân lí. Người tranh biện giỏi là người vừa sắc sảo vừa văn minh. (Ngữ liệu tổng hợp — tự soạn) Tranh biện khác tranh luận thông thường ở điểm nào?", "options": ["A. Không khác", "B. Có tổ chức, có luật lệ: hai bên thay phiên trình bày, phản biện trước ban giám khảo và khán giả", "C. Ồn ào hơn", "D. Không cần lí lẽ"], "answer": "B", "explain": "Tranh biện là hình thức có tổ chức, có luật lệ rõ ràng — khác với tranh luận tự phát, không quy tắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTranh biện là hình thức tranh luận có tổ chức, có luật lệ: hai bên (ủng hộ và phản đối) thay phiên trình bày quan điểm, phản biện lẫn nhau trước ban giám khảo và khán giả. Muốn tranh biện tốt, cần chuẩn bị luận điểm, luận cứ vững chắc; dự đoán ý đối phương để phản biện; trình bày mạch lạc, tự tin; và luôn tôn trọng đối thủ. Tranh biện không phải để “hạ gục” đối phương mà để cùng tìm ra chân lí. Người tranh biện giỏi là người vừa sắc sảo vừa văn minh. (Ngữ liệu tổng hợp — tự soạn) Theo ngữ liệu, muốn tranh biện tốt cần chuẩn bị những gì?", "options": ["A. Học thuộc lòng", "B. Luận điểm, luận cứ vững chắc; dự đoán ý đối phương; trình bày mạch lạc, tự tin; tôn trọng đối thủ", "C. Nói to", "D. Không cần chuẩn bị"], "answer": "B", "explain": "Bốn yêu cầu được nêu rõ: chuẩn bị nội dung, dự đoán phản biện, kĩ năng trình bày, thái độ văn minh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTranh biện là hình thức tranh luận có tổ chức, có luật lệ: hai bên (ủng hộ và phản đối) thay phiên trình bày quan điểm, phản biện lẫn nhau trước ban giám khảo và khán giả. Muốn tranh biện tốt, cần chuẩn bị luận điểm, luận cứ vững chắc; dự đoán ý đối phương để phản biện; trình bày mạch lạc, tự tin; và luôn tôn trọng đối thủ. Tranh biện không phải để “hạ gục” đối phương mà để cùng tìm ra chân lí. Người tranh biện giỏi là người vừa sắc sảo vừa văn minh. (Ngữ liệu tổng hợp — tự soạn) Câu “tranh biện không phải để ‘hạ gục’ đối phương mà để cùng tìm ra chân lí” thể hiện quan niệm gì?", "options": ["A. Sợ thua", "B. Quan niệm văn minh: mục đích cao nhất của tranh biện là chân lí, không phải thắng thua — thể hiện tầm văn hóa của người tranh biện", "C. Không muốn thắng", "D. Thiếu quyết tâm"], "answer": "B", "explain": "Đặt chân lí lên trên thắng thua — đó là tầm văn hóa, là mục đích đích thực của tranh biện.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Tranh biện là hình thức tranh luận có tổ chức, có luật lệ.", "b) Trong tranh biện, cần tôn trọng đối thủ và dùng lí lẽ, dẫn chứng.", "c) Mục đích của tranh biện là tìm ra chân lí.", "d) Tranh biện giỏi chỉ cần nói to, át giọng đối phương."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cần lí lẽ sắc sảo và thái độ văn minh, không phải át giọng.", "points": 1}, {"type": "short", "level": "TH", "q": "Phần Nói và nghe trong Bài 9 yêu cầu kĩ năng gì?", "answer": "Tranh biện về một vấn đề trong đời sống", "explain": "Bài 9 yêu cầu: “Tranh biện về một vấn đề trong đời sống” — rèn kĩ năng tranh luận có tổ chức, văn minh.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ về một cuộc tranh biện (hoặc thảo luận) mà em đã tham gia hoặc chứng kiến. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Tuần trước, lớp tôi tổ chức tranh biện với chủ đề: “Học sinh có nên dùng điện thoại trong giờ học không?”. Đội ủng hộ cho rằng điện thoại giúp tra cứu nhanh, học tập hiệu quả; đội phản đối lập luận rằng điện thoại gây mất tập trung, dễ sa vào mạng xã hội. Cuộc tranh biện diễn ra sôi nổi: mỗi bên đều chuẩn bị luận cứ kĩ lưỡng, dẫn chứng cụ thể. Điều khiến tôi ấn tượng nhất là thái độ văn minh của cả hai đội: lắng nghe nhau, không công kích cá nhân, biết ghi nhận ý đúng của đối phương. Kết thúc, cô giáo kết luận: điện thoại là công cụ tốt nếu dùng đúng cách, và quan trọng là ý thức tự giác của mỗi người. Cuộc tranh biện không chỉ giúp tôi hiểu sâu vấn đề mà còn dạy tôi cách trình bày quan điểm, lắng nghe và tôn trọng người khác — những kĩ năng quý giá cho cuộc sống."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về vai trò của kĩ năng tranh biện trong học tập và cuộc sống. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: đặt vấn đề — tranh biện là kĩ năng quan trọng của công dân hiện đại. 2. Thân bài: a) Giải thích: tranh biện là tranh luận có tổ chức. b) Vai trò: rèn tư duy phản biện, logic; rèn kĩ năng diễn đạt, thuyết trình; giúp tìm ra chân lí, giải pháp tốt; rèn bản lĩnh, tự tin; xây dựng văn hóa tranh luận văn minh. c) Dẫn chứng: các cuộc thi tranh biện học sinh; vai trò trong học tập nhóm, bảo vệ quan điểm. d) Thực trạng: nhiều bạn trẻ ngại bày tỏ, hoặc tranh luận thiếu văn hóa — cần rèn luyện. e) Cách rèn: đọc nhiều, chuẩn bị kĩ, thực hành thường xuyên, học cách lắng nghe. f) Liên hệ bản thân. 3. Kết bài: khẳng định; lời kêu gọi rèn kĩ năng tranh biện."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nVăn bản nghị luận về tác phẩm nghệ thuật khác với văn bản giới thiệu, thuyết minh ở chỗ: không chỉ cung cấp thông tin mà còn bày tỏ quan điểm, đánh giá của người viết. Muốn viết tốt kiểu bài này, trước hết phải hiểu sâu tác phẩm: nắm được nội dung, nghệ thuật, hoàn cảnh ra đời. Sau đó, phải có chính kiến: thích hay không thích? Vì sao? Hay ở chỗ nào? Mỗi nhận định đều cần dẫn chứng cụ thể từ tác phẩm. Và quan trọng, phải viết bằng cả lí trí và cảm xúc — phân tích sắc sảo mà vẫn chân thành. (Ngữ liệu tổng hợp — tự soạn) Điểm khác nhau giữa nghị luận về tác phẩm nghệ thuật và thuyết minh là gì?", "options": ["A. Không khác", "B. Nghị luận bày tỏ quan điểm, đánh giá chủ quan; thuyết minh cung cấp tri thức khách quan", "C. Thuyết minh dài hơn", "D. Nghị luận ngắn hơn"], "answer": "B", "explain": "Điểm khác cốt lõi: nghị luận có chính kiến, đánh giá (chủ quan); thuyết minh cung cấp tri thức (khách quan).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nVăn bản nghị luận về tác phẩm nghệ thuật khác với văn bản giới thiệu, thuyết minh ở chỗ: không chỉ cung cấp thông tin mà còn bày tỏ quan điểm, đánh giá của người viết. Muốn viết tốt kiểu bài này, trước hết phải hiểu sâu tác phẩm: nắm được nội dung, nghệ thuật, hoàn cảnh ra đời. Sau đó, phải có chính kiến: thích hay không thích? Vì sao? Hay ở chỗ nào? Mỗi nhận định đều cần dẫn chứng cụ thể từ tác phẩm. Và quan trọng, phải viết bằng cả lí trí và cảm xúc — phân tích sắc sảo mà vẫn chân thành. (Ngữ liệu tổng hợp — tự soạn) Theo ngữ liệu, muốn viết tốt bài nghị luận về tác phẩm nghệ thuật cần những gì?", "options": ["A. Chỉ cần cảm xúc", "B. Hiểu sâu tác phẩm, có chính kiến, dẫn chứng cụ thể, kết hợp lí trí và cảm xúc", "C. Chỉ cần lí trí", "D. Viết tùy hứng"], "answer": "B", "explain": "Bốn yêu cầu: hiểu sâu — có chính kiến — dẫn chứng — kết hợp lí trí và cảm xúc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nVăn bản nghị luận về tác phẩm nghệ thuật khác với văn bản giới thiệu, thuyết minh ở chỗ: không chỉ cung cấp thông tin mà còn bày tỏ quan điểm, đánh giá của người viết. Muốn viết tốt kiểu bài này, trước hết phải hiểu sâu tác phẩm: nắm được nội dung, nghệ thuật, hoàn cảnh ra đời. Sau đó, phải có chính kiến: thích hay không thích? Vì sao? Hay ở chỗ nào? Mỗi nhận định đều cần dẫn chứng cụ thể từ tác phẩm. Và quan trọng, phải viết bằng cả lí trí và cảm xúc — phân tích sắc sảo mà vẫn chân thành. (Ngữ liệu tổng hợp — tự soạn) Vì sao mỗi nhận định trong bài nghị luận đều cần dẫn chứng cụ thể?", "options": ["A. Để dài bài", "B. Vì dẫn chứng là “bằng chứng” khiến nhận định có sức thuyết phục; nhận định không có dẫn chứng chỉ là ý kiến suông", "C. Để khoe", "D. Không cần thiết"], "answer": "B", "explain": "Dẫn chứng cụ thể từ tác phẩm là cơ sở của mọi đánh giá — không có dẫn chứng, bài viết thiếu sức thuyết phục.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Nghị luận về tác phẩm nghệ thuật cần có quan điểm, đánh giá riêng.", "b) Thuyết minh về tác phẩm cung cấp tri thức khách quan.", "c) Viết nghị luận về tác phẩm nghệ thuật không cần hiểu tác phẩm.", "d) Bài nghị luận hay kết hợp hài hòa lí trí và cảm xúc."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phải hiểu sâu mới có thể đánh giá đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu dàn ý chung của bài văn nghị luận về một tác phẩm nghệ thuật.", "answer": "Mở bài (giới thiệu) — Thân bài (phân tích nghệ thuật, đánh giá nội dung, nêu ý nghĩa) — Kết bài (khẳng định, cảm nhận)", "explain": "Dàn ý: mở bài giới thiệu tác phẩm và vấn đề; thân bài phân tích đặc sắc nghệ thuật, đánh giá giá trị nội dung, nêu ý nghĩa; kết bài khẳng định giá trị, nêu cảm nhận.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ giới thiệu về một tác phẩm nghệ thuật em yêu thích (bài hát, bức tranh, bộ phim...). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Tác phẩm nghệ thuật tôi yêu thích nhất là bức tranh “Thiếu nữ bên hoa huệ” của họa sĩ Tô Ngọc Vân. Bức tranh vẽ một thiếu nữ mặc áo dài trắng ngồi nghiêng bên lọ hoa huệ trắng, với gam màu nhẹ nhàng, tinh tế. Điều khiến tôi say mê là vẻ đẹp vừa hiện thực vừa mơ màng: gương mặt thiếu nữ thanh thoát, tà áo dài mềm mại, những bông huệ trắng tinh khôi — tất cả hòa quyện thành một vẻ đẹp đậm chất Việt Nam. Bức tranh không chỉ đẹp về hình thức mà còn gợi cảm xúc: sự trong sáng, dịu dàng của người phụ nữ Việt. Mỗi lần ngắm tranh, tôi như được trở về với những giá trị truyền thống tốt đẹp. “Thiếu nữ bên hoa huệ” xứng đáng là kiệt tác của hội họa Việt Nam hiện đại, và tôi tự hào khi được chiêm ngưỡng nó."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ về một tác phẩm nghệ thuật em yêu thích (tự chọn). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu tác phẩm và lí do yêu thích. 2. Thân bài: a) Giới thiệu khái quát (tác giả, hoàn cảnh, nội dung). b) Phân tích đặc sắc nghệ thuật (với dẫn chứng cụ thể). c) Đánh giá giá trị nội dung, tư tưởng. d) Nêu ý nghĩa, ảnh hưởng của tác phẩm với em và với mọi người. 3. Kết bài: khẳng định giá trị; cảm nhận, bài học."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTrong cuộc đời, ai cũng phải đối mặt với những cám dỗ: tiền bạc, danh vọng, lạc thú. Kẻ yếu đuối sẽ gục ngã; người bản lĩnh sẽ vượt qua. Nguyễn Công Trứ từng trải qua thăng trầm quan trường mà vẫn giữ được khí phách “ngất ngưởng”. Nguyễn Đình Chiểu mù lòa mà vẫn một lòng vì nước. Họ chứng minh: bản lĩnh không phải là không gặp cám dỗ, mà là đủ mạnh để không bị cám dỗ đánh gục. Tuổi trẻ hôm nay cũng cần bản lĩnh ấy: trước cám dỗ của game, mạng xã hội, lối sống hưởng thụ — hãy biết nói “không” đúng lúc. (Ngữ liệu nghị luận — tự soạn) Theo ngữ liệu, bản lĩnh là gì?", "options": ["A. Không gặp cám dỗ", "B. Đủ mạnh để không bị cám dỗ đánh gục — vượt qua thử thách mà vẫn giữ được mình", "C. Sợ hãi cám dỗ", "D. Tránh mọi thử thách"], "answer": "B", "explain": "“Bản lĩnh không phải là không gặp cám dỗ, mà là đủ mạnh để không bị cám dỗ đánh gục” — định nghĩa trực tiếp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTrong cuộc đời, ai cũng phải đối mặt với những cám dỗ: tiền bạc, danh vọng, lạc thú. Kẻ yếu đuối sẽ gục ngã; người bản lĩnh sẽ vượt qua. Nguyễn Công Trứ từng trải qua thăng trầm quan trường mà vẫn giữ được khí phách “ngất ngưởng”. Nguyễn Đình Chiểu mù lòa mà vẫn một lòng vì nước. Họ chứng minh: bản lĩnh không phải là không gặp cám dỗ, mà là đủ mạnh để không bị cám dỗ đánh gục. Tuổi trẻ hôm nay cũng cần bản lĩnh ấy: trước cám dỗ của game, mạng xã hội, lối sống hưởng thụ — hãy biết nói “không” đúng lúc. (Ngữ liệu nghị luận — tự soạn) Dẫn chứng về Nguyễn Công Trứ và Nguyễn Đình Chiểu có tác dụng gì?", "options": ["A. Kể chuyện", "B. Chứng minh bằng tấm gương lịch sử: những con người bản lĩnh vượt qua thăng trầm, nghịch cảnh — tăng sức thuyết phục", "C. Không tác dụng", "D. Để dài bài"], "answer": "B", "explain": "Hai tấm gương cụ thể, tiêu biểu: một vượt thăng trầm quan trường, một vượt mù lòa — chứng minh hùng hồn cho luận điểm về bản lĩnh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTrong cuộc đời, ai cũng phải đối mặt với những cám dỗ: tiền bạc, danh vọng, lạc thú. Kẻ yếu đuối sẽ gục ngã; người bản lĩnh sẽ vượt qua. Nguyễn Công Trứ từng trải qua thăng trầm quan trường mà vẫn giữ được khí phách “ngất ngưởng”. Nguyễn Đình Chiểu mù lòa mà vẫn một lòng vì nước. Họ chứng minh: bản lĩnh không phải là không gặp cám dỗ, mà là đủ mạnh để không bị cám dỗ đánh gục. Tuổi trẻ hôm nay cũng cần bản lĩnh ấy: trước cám dỗ của game, mạng xã hội, lối sống hưởng thụ — hãy biết nói “không” đúng lúc. (Ngữ liệu nghị luận — tự soạn) “Cám dỗ” với tuổi trẻ hôm nay được nêu trong ngữ liệu là gì?", "options": ["A. Học tập", "B. Game, mạng xã hội, lối sống hưởng thụ — những thứ khiến giới trẻ sao nhãng, hư hỏng nếu không bản lĩnh", "C. Thể thao", "D. Đọc sách"], "answer": "B", "explain": "Ngữ liệu chỉ rõ: game, mạng xã hội, lối sống hưởng thụ — cám dỗ thời hiện đại; cần “biết nói ‘không’ đúng lúc”.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Bản lĩnh là sức mạnh tinh thần giúp con người vượt qua cám dỗ, thử thách.", "b) Dẫn chứng lịch sử có sức thuyết phục cao trong văn nghị luận.", "c) Tuổi trẻ hôm nay không phải đối mặt với cám dỗ nào.", "d) Biết nói “không” đúng lúc là biểu hiện của bản lĩnh."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: game, mạng xã hội, lối sống hưởng thụ là những cám dỗ lớn. d) Đúng.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu hai biểu hiện của sự thiếu bản lĩnh ở một bộ phận giới trẻ hiện nay.", "answer": "Sa vào game, mạng xã hội; sống buông thả, hưởng thụ; dễ bị rủ rê, lôi kéo vào tệ nạn", "explain": "Các biểu hiện: nghiện game, “sống ảo”; lười học, ỷ lại; dễ bị rủ rê vào tệ nạn; thiếu chính kiến, a dua theo đám đông.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ về bản lĩnh của tuổi trẻ trước những cám dỗ (gợi ý từ ngữ liệu Đề 9). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Tuổi trẻ hôm nay đứng trước vô vàn cám dỗ: game online, mạng xã hội, lối sống hưởng thụ, thậm chí cả tệ nạn xã hội. Không ít bạn đã gục ngã: bỏ học vì game, sống ảo quên đời thực, sa vào những thú vui độc hại. Vì vậy, bản lĩnh là phẩm chất vô cùng cần thiết: đủ mạnh để nói “không” với cám dỗ, đủ tỉnh táo để không bị cuốn theo đám đông. Bản lĩnh không phải là không bao giờ vấp ngã, mà là biết đứng dậy; không phải là tránh mọi thử thách, mà là vượt qua chúng. Hãy noi gương Nguyễn Công Trứ, Nguyễn Đình Chiểu — những con người đã chiến thắng nghịch cảnh bằng bản lĩnh. Mỗi bạn trẻ hãy rèn cho mình một “hệ miễn dịch” tinh thần: có ước mơ, có kỉ luật, biết chọn bạn mà chơi và dám từ chối những gì xấu xa. Có bản lĩnh, tuổi trẻ sẽ vững vàng trước mọi sóng gió cuộc đời."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về lối sống của giới trẻ hiện nay (mặt tích cực và hạn chế). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: đặt vấn đề — lối sống của giới trẻ có nhiều mặt đáng suy ngẫm. 2. Thân bài: a) Mặt tích cực: năng động, sáng tạo, tự tin, giỏi công nghệ, giàu lòng nhân ái (tình nguyện), khát vọng vươn lên. b) Mặt hạn chế: một bộ phận sống ảo, lười biếng, ích kỉ, thiếu bản lĩnh trước cám dỗ, “sính ngoại” quên cội nguồn. c) Nguyên nhân: ảnh hưởng mạng xã hội, thiếu định hướng, gia đình nuông chiều. d) Giải pháp: giáo dục toàn diện, nêu gương tốt, mỗi bạn trẻ tự rèn. e) Liên hệ bản thân: em sẽ sống như thế nào. 3. Kết bài: khẳng định tuổi trẻ là tương lai; lời nhắn nhủ sống đẹp, sống có ích."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBa tác phẩm trong Bài 9 — “Bài ca ngất ngưởng”, “Văn tế nghĩa sĩ Cần Giuộc”, “Cộng đồng và cá thể” — tưởng chừng khác nhau mà cùng chung một chủ đề: sự lựa chọn và hành động. Nguyễn Công Trứ chọn lối sống tự do, phóng khoáng. Nghĩa sĩ Cần Giuộc chọn hi sinh vì nước. Einstein chọn sống có trách nhiệm với cộng đồng. Ba lựa chọn, ba thời đại, ba con người — cùng gửi gắm một thông điệp: hãy lựa chọn và hành động một cách xứng đáng với tư cách con người. Đó cũng là lời nhắn nhủ cho mỗi chúng ta hôm nay. (Ngữ liệu tổng kết — tự soạn) Chủ đề chung của ba tác phẩm trong Bài 9 là gì?", "options": ["A. Tình yêu", "B. Sự lựa chọn và hành động: mỗi tác phẩm thể hiện một sự lựa chọn cao đẹp", "C. Chiến tranh", "D. Thiên nhiên"], "answer": "B", "explain": "Ngữ liệu nêu trực tiếp: “cùng chung một chủ đề: sự lựa chọn và hành động”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBa tác phẩm trong Bài 9 — “Bài ca ngất ngưởng”, “Văn tế nghĩa sĩ Cần Giuộc”, “Cộng đồng và cá thể” — tưởng chừng khác nhau mà cùng chung một chủ đề: sự lựa chọn và hành động. Nguyễn Công Trứ chọn lối sống tự do, phóng khoáng. Nghĩa sĩ Cần Giuộc chọn hi sinh vì nước. Einstein chọn sống có trách nhiệm với cộng đồng. Ba lựa chọn, ba thời đại, ba con người — cùng gửi gắm một thông điệp: hãy lựa chọn và hành động một cách xứng đáng với tư cách con người. Đó cũng là lời nhắn nhủ cho mỗi chúng ta hôm nay. (Ngữ liệu tổng kết — tự soạn) Mỗi tác phẩm thể hiện sự lựa chọn nào?", "options": ["A. Giống nhau", "B. Nguyễn Công Trứ chọn sống tự do; nghĩa sĩ chọn hi sinh vì nước; Einstein chọn sống có trách nhiệm — ba lựa chọn khác nhau mà cùng cao đẹp", "C. Đều chọn tiền bạc", "D. Không có lựa chọn"], "answer": "B", "explain": "Ba lựa chọn cụ thể được liệt kê — khác nhau về nội dung mà thống nhất ở phẩm chất cao đẹp.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBa tác phẩm trong Bài 9 — “Bài ca ngất ngưởng”, “Văn tế nghĩa sĩ Cần Giuộc”, “Cộng đồng và cá thể” — tưởng chừng khác nhau mà cùng chung một chủ đề: sự lựa chọn và hành động. Nguyễn Công Trứ chọn lối sống tự do, phóng khoáng. Nghĩa sĩ Cần Giuộc chọn hi sinh vì nước. Einstein chọn sống có trách nhiệm với cộng đồng. Ba lựa chọn, ba thời đại, ba con người — cùng gửi gắm một thông điệp: hãy lựa chọn và hành động một cách xứng đáng với tư cách con người. Đó cũng là lời nhắn nhủ cho mỗi chúng ta hôm nay. (Ngữ liệu tổng kết — tự soạn) Thông điệp “hãy lựa chọn và hành động một cách xứng đáng” có ý nghĩa gì với tuổi trẻ?", "options": ["A. Không ý nghĩa", "B. Lời nhắn nhủ: tuổi trẻ đang đứng trước nhiều lựa chọn — hãy chọn điều đúng đắn, cao đẹp và hành động kiên trì để sống một cuộc đời xứng đáng", "C. Chỉ dành cho người lớn", "D. Khuyên không lựa chọn"], "answer": "B", "explain": "Tuổi trẻ là giai đoạn của những lựa chọn (nghề nghiệp, lối sống, giá trị) — thông điệp là kim chỉ nam: chọn đúng và làm đến cùng.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định sau (tổng hợp Bài 9):", "statements": ["a) “Bài ca ngất ngưởng” (Nguyễn Công Trứ) là tuyên ngôn về lối sống tự do, “ngất ngưởng”.", "b) “Văn tế nghĩa sĩ Cần Giuộc” (Nguyễn Đình Chiểu) ca ngợi lòng yêu nước của người nông dân.", "c) “Cộng đồng và cá thể” (Einstein) bàn về trách nhiệm của cá nhân với cộng đồng.", "d) Cả ba tác phẩm đều là thơ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: “Bài ca ngất ngưởng” là thơ (hát nói), “Văn tế” là văn tế, “Cộng đồng và cá thể” là văn xuôi triết lí.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên tác giả và thể loại của ba tác phẩm trong Bài 9.", "answer": "Nguyễn Công Trứ – hát nói; Nguyễn Đình Chiểu – văn tế; Einstein – văn xuôi (trích “Thế giới như tôi thấy”)", "explain": "“Bài ca ngất ngưởng” (Nguyễn Công Trứ, hát nói); “Văn tế nghĩa sĩ Cần Giuộc” (Nguyễn Đình Chiểu, văn tế); “Cộng đồng và cá thể” (Einstein, văn xuôi triết lí).", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về thông điệp “hãy lựa chọn và hành động một cách xứng đáng”. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Thông điệp “hãy lựa chọn và hành động một cách xứng đáng” là lời nhắn nhủ quý giá cho mỗi chúng ta, nhất là tuổi trẻ. Cuộc đời là chuỗi những lựa chọn: chọn nghề, chọn bạn, chọn lối sống, chọn giá trị để theo đuổi. Lựa chọn đúng đắn đưa ta đến thành công và hạnh phúc; lựa chọn sai lầm khiến ta trả giá. Nhưng lựa chọn chỉ là bước đầu — điều quyết định là hành động kiên trì. Nhìn vào ba tấm gương trong Bài 9, ta thấy: Nguyễn Công Trứ chọn sống tự do và sống trọn với lựa chọn ấy; nghĩa sĩ Cần Giuộc chọn hi sinh và đã anh dũng hi sinh; Einstein chọn sống vì cộng đồng và cống hiến cả đời. Họ đều “xứng đáng” vì lựa chọn của họ hướng tới những giá trị cao đẹp và họ đã hành động đến cùng. Với tôi, bài học là: hãy suy nghĩ kĩ trước mỗi lựa chọn, rồi dũng cảm hành động — để sau này nhìn lại, ta có thể tự hào về cuộc đời mình."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về lẽ sống của tuổi trẻ hôm nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ chủ đề “Lựa chọn và hành động”, đặt vấn đề: lẽ sống của tuổi trẻ. 2. Thân bài: a) Giải thích: lẽ sống là mục đích, giá trị mà con người theo đuổi. b) Lẽ sống đẹp của tuổi trẻ: có ước mơ, hoài bão; sống có trách nhiệm với bản thân, gia đình, cộng đồng, đất nước; sống nhân ái, trung thực; không ngừng học hỏi, cống hiến. c) Dẫn chứng: tấm gương tuổi trẻ sống đẹp (tình nguyện, sáng tạo, vượt khó). d) Phản đề: phê phán lối sống ích kỉ, hưởng thụ, vô cảm, “sống ảo”. e) Cách hình thành lẽ sống: suy ngẫm về giá trị, noi gương tốt, hành động từ việc nhỏ. f) Liên hệ bản thân: lẽ sống của em. 3. Kết bài: khẳng định “sống là cho đâu chỉ nhận riêng mình”; lời nhắn nhủ hãy lựa chọn và hành động xứng đáng."}]}]}
