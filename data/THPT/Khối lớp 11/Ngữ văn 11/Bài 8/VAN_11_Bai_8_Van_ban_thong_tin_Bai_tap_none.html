iên từ hơn 160 quốc gia, tranh tài ở hàng chục môn. 3. Ý nghĩa: Paralympic không chỉ là thi đấu mà còn là “liều thuốc” chữa lành — giúp người khuyết tật tự tin, hòa nhập; lan tỏa thông điệp bình đẳng, nhân ái đến toàn nhân loại. (Ngữ liệu thông tin — tự soạn) Theo ngữ liệu, Paralympic khởi nguồn từ đâu?", "options": ["A. Từ Olympic cổ đại", "B. Từ hoạt động thể thao phục hồi cho thương binh chiến tranh năm 1948 của bác sĩ Ludwig Guttmann tại Anh", "C. Từ trường học", "D. Không rõ"], "answer": "B", "explain": "Thông tin cụ thể: năm 1948, bác sĩ Ludwig Guttmann tổ chức thi đấu cho thương binh tại Anh — khởi nguồn nhân văn của Paralympic.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nPA-RA-LIM-PÍCH: NGÀY HỘI CỦA NGHỊ LỰC\nPa-ra-lim-pích (Paralympic) là Đại hội thể thao quốc tế dành cho người khuyết tật, được tổ chức 4 năm một lần, song song với Olympic. 1. Lịch sử: khởi nguồn từ năm 1948, khi bác sĩ Ludwig Guttmann tổ chức thi đấu thể thao cho các thương binh chiến tranh tại Anh, nhằm giúp họ phục hồi cả thể chất lẫn tinh thần. 2. Phát triển: từ vài chục vận động viên ban đầu, Paralympic nay quy tụ hàng nghìn vận động viên từ hơn 160 quốc gia, tranh tài ở hàng chục môn. 3. Ý nghĩa: Paralympic không chỉ là thi đấu mà còn là “liều thuốc” chữa lành — giúp người khuyết tật tự tin, hòa nhập; lan tỏa thông điệp bình đẳng, nhân ái đến toàn nhân loại. (Ngữ liệu thông tin — tự soạn) Vì sao văn bản “Pa-ra-lim-pích: Một lịch sử chữa lành những vết thương” có nhan đề như vậy?", "options": ["A. Để gây chú ý", "B. Vì Paralympic ra đời để “chữa lành” — giúp người khuyết tật phục hồi thể chất, tinh thần, hòa nhập cuộc sống — ý nghĩa nhân văn sâu sắc", "C. Vì có bác sĩ", "D. Không có lí do"], "answer": "B", "explain": "“Chữa lành những vết thương” vừa nói về nguồn gốc (phục hồi cho thương binh) vừa nói về ý nghĩa (chữa lành mặc cảm, giúp hòa nhập) — nhan đề giàu ý nghĩa nhân văn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Văn bản thông tin về sự kiện thường có cấu trúc: lịch sử hình thành — phát triển — ý nghĩa.", "b) Số liệu, dẫn chứng cụ thể (năm 1948, hơn 160 quốc gia) làm tăng độ tin cậy.", "c) “Pa-ra-lim-pích” trong SGK là văn bản của Huy Đăng.", "d) Văn bản thông tin không cần đảm bảo tính chính xác."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: số liệu cụ thể tạo độ tin cậy. c) Đúng. d) Sai: tính chính xác, khách quan là yêu cầu hàng đầu.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu ý nghĩa nhân văn của Pa-ra-lim-pích.", "answer": "Tôn vinh nghị lực, lan tỏa thông điệp bình đẳng, nhân ái; giúp người khuyết tật tự tin, hòa nhập", "explain": "Paralympic tôn vinh nghị lực phi thường của người khuyết tật, lan tỏa thông điệp bình đẳng — mọi người đều có quyền được thi đấu, được tỏa sáng.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ bày tỏ sự khâm phục của em với nghị lực của các vận động viên khuyết tật. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Mỗi lần xem các vận động viên khuyết tật thi đấu tại Paralympic, tôi đều vô cùng khâm phục và xúc động. Họ — những con người không may mắn về thể chất — đã vượt qua mặc cảm, vượt qua giới hạn của bản thân để vươn tới những đỉnh cao thể thao. Có vận động viên không chân vẫn chạy nhanh như gió, có người không tay vẫn bơi lội điêu luyện. Đằng sau mỗi tấm huy chương là những giọt mồ hôi, nước mắt và ý chí thép. Họ chứng minh một chân lí: khuyết tật về thể chất không có nghĩa là khuyết tật về ý chí; con người có thể chiến thắng số phận bằng nghị lực. Tấm gương của họ là bài học quý giá cho chúng ta — những người lành lặn: đừng bao giờ than vãn, bỏ cuộc trước khó khăn nhỏ; hãy sống mạnh mẽ, kiên cường như các vận động viên Paralympic."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về nghị lực vượt lên số phận của con người. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ hình ảnh vận động viên Paralympic, đặt vấn đề: nghị lực vượt lên số phận. 2. Thân bài: a) Giải thích: số phận là hoàn cảnh không may; nghị lực là sức mạnh tinh thần vượt qua. b) Biểu hiện: người khuyết tật thành công, học sinh nghèo vượt khó, bệnh nhân chiến thắng bệnh tật. c) Dẫn chứng: vận động viên Paralympic, thầy Nguyễn Ngọc Ký, Nick Vujicic. d) Ý nghĩa: chiến thắng số phận, truyền cảm hứng, khẳng định giá trị con người. e) Phản đề: phê phán thói đổ lỗi cho số phận, buông xuôi. f) Cách rèn nghị lực: đặt mục tiêu, kiên trì, lạc quan. g) Liên hệ bản thân. 3. Kết bài: khẳng định “tàn nhưng không phế”; lời nhắn nhủ sống mạnh mẽ."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTHỦY TRIỀU: NHỊP THỞ CỦA ĐẠI DƯƠNG\nThủy triều là hiện tượng nước biển dâng lên, hạ xuống theo chu kì, như “nhịp thở” của đại dương. 1. Nguyên nhân: chủ yếu do lực hấp dẫn của Mặt Trăng (và một phần Mặt Trời) tác động lên Trái Đất. 2. Phân loại: có nơi một ngày một lần lên xuống (nhật triều), có nơi hai lần (bán nhật triều). 3. Ứng dụng: ngư dân dựa vào thủy triều để đánh bắt, ra khơi; con người xây nhà máy điện thủy triều để phát điện sạch. Hiểu về thủy triều giúp con người khai thác biển hiệu quả và sống hài hòa với thiên nhiên. (Ngữ liệu thông tin — tự soạn) Theo ngữ liệu, nguyên nhân chính gây ra thủy triều là gì?", "options": ["A. Gió bão", "B. Lực hấp dẫn của Mặt Trăng (và một phần Mặt Trời)", "C. Động đất", "D. Núi lửa"], "answer": "B", "explain": "Ngữ liệu nêu rõ: “chủ yếu do lực hấp dẫn của Mặt Trăng (và một phần Mặt Trời) tác động lên Trái Đất”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTHỦY TRIỀU: NHỊP THỞ CỦA ĐẠI DƯƠNG\nThủy triều là hiện tượng nước biển dâng lên, hạ xuống theo chu kì, như “nhịp thở” của đại dương. 1. Nguyên nhân: chủ yếu do lực hấp dẫn của Mặt Trăng (và một phần Mặt Trời) tác động lên Trái Đất. 2. Phân loại: có nơi một ngày một lần lên xuống (nhật triều), có nơi hai lần (bán nhật triều). 3. Ứng dụng: ngư dân dựa vào thủy triều để đánh bắt, ra khơi; con người xây nhà máy điện thủy triều để phát điện sạch. Hiểu về thủy triều giúp con người khai thác biển hiệu quả và sống hài hòa với thiên nhiên. (Ngữ liệu thông tin — tự soạn) Hình ảnh so sánh “nhịp thở của đại dương” có tác dụng gì?", "options": ["A. Không tác dụng", "B. Giúp người đọc hình dung sinh động hiện tượng thủy triều lên xuống đều đặn như nhịp thở — văn bản thông tin cũng có thể dùng hình ảnh để dễ hiểu", "C. Để cho đẹp", "D. Gây khó hiểu"], "answer": "B", "explain": "So sánh giúp khái niệm khoa học trở nên gần gũi, dễ hình dung — văn bản thông tin hay cũng cần cách diễn đạt sinh động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTHỦY TRIỀU: NHỊP THỞ CỦA ĐẠI DƯƠNG\nThủy triều là hiện tượng nước biển dâng lên, hạ xuống theo chu kì, như “nhịp thở” của đại dương. 1. Nguyên nhân: chủ yếu do lực hấp dẫn của Mặt Trăng (và một phần Mặt Trời) tác động lên Trái Đất. 2. Phân loại: có nơi một ngày một lần lên xuống (nhật triều), có nơi hai lần (bán nhật triều). 3. Ứng dụng: ngư dân dựa vào thủy triều để đánh bắt, ra khơi; con người xây nhà máy điện thủy triều để phát điện sạch. Hiểu về thủy triều giúp con người khai thác biển hiệu quả và sống hài hòa với thiên nhiên. (Ngữ liệu thông tin — tự soạn) Cấu trúc của ngữ liệu có gì đặc sắc?", "options": ["A. Lộn xộn", "B. Đi từ khái niệm đến nguyên nhân, phân loại, ứng dụng và ý nghĩa — từ lí thuyết đến thực tiễn, từ chung đến riêng", "C. Chỉ nêu ứng dụng", "D. Không có cấu trúc"], "answer": "B", "explain": "Trình tự logic: là gì — vì sao — có mấy loại — dùng để làm gì — ý nghĩa; từ nhận thức đến vận dụng — cấu trúc khoa học, dễ tiếp thu.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Văn bản thông tin về hiện tượng tự nhiên cần đảm bảo tính khoa học, chính xác.", "b) Có thể dùng hình ảnh so sánh để giúp người đọc dễ hiểu khái niệm khoa học.", "c) Nhan đề của văn bản thông tin thường nêu đối tượng cung cấp thông tin.", "d) Văn bản thuyết minh về hiện tượng tự nhiên không cần nêu ứng dụng, ý nghĩa."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: như “nhịp thở của đại dương”. c) Đúng: “Thủy triều: nhịp thở của đại dương”. d) Sai: nêu ứng dụng, ý nghĩa giúp thông tin thiết thực, gần gũi hơn.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu cấu trúc (các thành phần) chung của một văn bản thông tin.", "answer": "Nhan đề — Sa-pô — Các đề mục — Kết thúc", "explain": "Cấu trúc: nhan đề (nêu đối tượng), sa-pô (tóm tắt), các đề mục (triển khai từng khía cạnh), kết thúc (tổng kết, đánh giá, mở hướng tìm hiểu).", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn thuyết minh khoảng 200 chữ về một hiện tượng tự nhiên em biết (cầu vồng, mưa đá, nhật thực...). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Cầu vồng là một trong những hiện tượng tự nhiên đẹp nhất mà tôi từng thấy. Sau cơn mưa rào mùa hạ, khi nắng vừa lên, trên bầu trời thường xuất hiện một dải màu cong cong rực rỡ với bảy sắc: đỏ, cam, vàng, lục, lam, chàm, tím. Về mặt khoa học, cầu vồng hình thành do ánh sáng Mặt Trời khúc xạ, phản xạ qua các giọt nước mưa còn lơ lửng trong không khí, tách thành các màu sắc khác nhau. Cầu vồng thường xuất hiện khi trời vừa mưa xong mà nắng đã lên, và người quan sát đứng quay lưng về phía Mặt Trời. Trong văn hóa dân gian, cầu vồng được coi là chiếc cầu nối giữa trời và đất, là điềm lành. Mỗi lần thấy cầu vồng, tôi đều ngẩn ngơ trước vẻ đẹp của tự nhiên và thêm yêu những điều kì diệu quanh mình."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn thuyết minh khoảng 600 chữ về một hiện tượng tự nhiên (tự chọn: thủy triều, núi lửa, cực quang, sa mạc hóa...). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu hiện tượng em chọn. 2. Thân bài: a) Khái niệm, đặc điểm. b) Nguyên nhân hình thành (giải thích khoa học). c) Phân loại / biểu hiện. d) Ảnh hưởng đến đời sống, sản xuất. e) Ứng dụng và cách ứng xử của con người. 3. Kết bài: đánh giá ý nghĩa; lời nhắn nhủ tìm hiểu, bảo vệ thiên nhiên. (Thông tin phải chính xác, khoa học.)"}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nRỪNG NGẬP MẶN: LÁ CHẮN XANH CỦA BIỂN\nRừng ngập mặn là hệ sinh thái đặc biệt, mọc ở vùng cửa sông, ven biển nơi nước mặn và nước ngọt giao hòa. 1. Đặc điểm: cây đước, cây mắm với bộ rễ chằng chịt, có khả năng sống trong nước mặn, thích nghi với thủy triều lên xuống. 2. Vai trò: chắn sóng, chống xói lở bờ biển; là nơi cư trú, sinh sản của tôm, cua, cá; lọc nước, hấp thụ khí CO2, chống biến đổi khí hậu. 3. Thực trạng: diện tích rừng ngập mặn đang bị thu hẹp do nuôi tôm tự phát, chặt phá, ô nhiễm. Bảo vệ rừng ngập mặn là bảo vệ “lá chắn xanh” cho bờ biển và cho chính cuộc sống của chúng ta. (Ngữ liệu thông tin — tự soạn) Rừng ngập mặn mọc ở đâu?", "options": ["A. Trên núi cao", "B. Ở vùng cửa sông, ven biển nơi nước mặn và nước ngọt giao hòa", "C. Trong sa mạc", "D. Ở đồng bằng"], "answer": "B", "explain": "Ngữ liệu nêu trực tiếp: “mọc ở vùng cửa sông, ven biển nơi nước mặn và nước ngọt giao hòa”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nRỪNG NGẬP MẶN: LÁ CHẮN XANH CỦA BIỂN\nRừng ngập mặn là hệ sinh thái đặc biệt, mọc ở vùng cửa sông, ven biển nơi nước mặn và nước ngọt giao hòa. 1. Đặc điểm: cây đước, cây mắm với bộ rễ chằng chịt, có khả năng sống trong nước mặn, thích nghi với thủy triều lên xuống. 2. Vai trò: chắn sóng, chống xói lở bờ biển; là nơi cư trú, sinh sản của tôm, cua, cá; lọc nước, hấp thụ khí CO2, chống biến đổi khí hậu. 3. Thực trạng: diện tích rừng ngập mặn đang bị thu hẹp do nuôi tôm tự phát, chặt phá, ô nhiễm. Bảo vệ rừng ngập mặn là bảo vệ “lá chắn xanh” cho bờ biển và cho chính cuộc sống của chúng ta. (Ngữ liệu thông tin — tự soạn) Theo ngữ liệu, rừng ngập mặn có những vai trò nào?", "options": ["A. Chỉ để ngắm", "B. Chắn sóng, chống xói lở; nơi cư trú của thủy sản; lọc nước, hấp thụ CO2, chống biến đổi khí hậu", "C. Chỉ để lấy gỗ", "D. Không có vai trò"], "answer": "B", "explain": "Ba nhóm vai trò được liệt kê: bảo vệ bờ biển, sinh thái thủy sản, môi trường — toàn diện và quan trọng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nRỪNG NGẬP MẶN: LÁ CHẮN XANH CỦA BIỂN\nRừng ngập mặn là hệ sinh thái đặc biệt, mọc ở vùng cửa sông, ven biển nơi nước mặn và nước ngọt giao hòa. 1. Đặc điểm: cây đước, cây mắm với bộ rễ chằng chịt, có khả năng sống trong nước mặn, thích nghi với thủy triều lên xuống. 2. Vai trò: chắn sóng, chống xói lở bờ biển; là nơi cư trú, sinh sản của tôm, cua, cá; lọc nước, hấp thụ khí CO2, chống biến đổi khí hậu. 3. Thực trạng: diện tích rừng ngập mặn đang bị thu hẹp do nuôi tôm tự phát, chặt phá, ô nhiễm. Bảo vệ rừng ngập mặn là bảo vệ “lá chắn xanh” cho bờ biển và cho chính cuộc sống của chúng ta. (Ngữ liệu thông tin — tự soạn) Nhan đề gọi rừng ngập mặn là “lá chắn xanh của biển” dựa trên cơ sở nào?", "options": ["A. Rừng màu xanh", "B. Dựa trên vai trò chắn sóng, chống xói lở, bảo vệ bờ biển — như tấm lá chắn; “xanh” vừa chỉ màu sắc vừa chỉ giá trị sinh thái", "C. Để cho hay", "D. Không cơ sở"], "answer": "B", "explain": "“Lá chắn” từ chức năng bảo vệ, “xanh” từ màu sắc và giá trị môi trường — nhan đề vừa hình ảnh vừa chính xác về vai trò.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Văn bản thông tin cần kết hợp số liệu, dẫn chứng cụ thể để tăng độ tin cậy.", "b) Nêu thực trạng là một phần quan trọng của văn bản thông tin về vấn đề môi trường.", "c) “Lá chắn xanh” là cách nói hình ảnh, giúp nhan đề hấp dẫn hơn.", "d) Bảo vệ rừng ngập mặn không liên quan đến cuộc sống con người."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: thực trạng cho thấy tính cấp thiết. c) Đúng. d) Sai: rừng ngập mặn bảo vệ bờ biển, sinh kế người dân — liên quan trực tiếp.", "points": 1}, {"type": "short", "level": "TH", "q": "Kể tên hai phương tiện phi ngôn ngữ thường dùng trong văn bản thông tin và nêu tác dụng.", "answer": "Hình ảnh, biểu đồ (bảng số liệu, sơ đồ) — minh họa, giúp thông tin trực quan, dễ hiểu", "explain": "Các phương tiện phi ngôn ngữ: hình ảnh, biểu đồ, bảng số liệu, sơ đồ, video — có tác dụng minh họa, bổ sung, giúp thông tin trực quan, sinh động, dễ tiếp thu.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ kêu gọi bảo vệ rừng ngập mặn (hoặc rừng nói chung). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Rừng ngập mặn — “lá chắn xanh” của biển — đang kêu cứu! Diện tích rừng ngày càng thu hẹp vì nuôi tôm tự phát, chặt phá và ô nhiễm. Mất rừng, bờ biển sẽ bị sóng đánh xói lở, người dân mất đi nơi cư trú của tôm cua cá — nguồn sinh kế quan trọng; môi trường mất đi “máy lọc” CO2 tự nhiên. Bảo vệ rừng ngập mặn không phải việc của riêng ai: mỗi chúng ta hãy không xả rác xuống biển, không tiếp tay cho việc phá rừng; tham gia trồng rừng, tuyên truyền cho mọi người cùng hiểu. Các bạn học sinh có thể bắt đầu từ việc nhỏ: tìm hiểu về rừng ngập mặn, vẽ tranh, viết bài kêu gọi bảo vệ. Hãy nhớ: bảo vệ rừng là bảo vệ chính cuộc sống của chúng ta — đừng để đến khi “lá chắn xanh” mất đi, ta mới hối tiếc."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn thuyết minh khoảng 600 chữ về một hệ sinh thái (rừng ngập mặn, rừng nhiệt đới, sa mạc, đại dương...). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu hệ sinh thái em chọn. 2. Thân bài: a) Khái niệm, phân bố. b) Đặc điểm (khí hậu, sinh vật đặc trưng, mối quan hệ). c) Vai trò với tự nhiên và con người. d) Thực trạng (nguy cơ, thách thức). e) Biện pháp bảo vệ. 3. Kết bài: khẳng định giá trị; lời kêu gọi bảo vệ. (Thông tin khoa học, chính xác.)"}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNỮ PHÓNG VIÊN ĐẦU TIÊN: NGƯỜI MỞ ĐƯỜNG\nTrong lịch sử báo chí, có những người phụ nữ đã dũng cảm mở đường. Bài viết “Nữ phóng viên đầu tiên” giới thiệu chân dung một nhân vật như thế. 1. Hoàn cảnh: bà đến với nghề báo trong xã hội mà phụ nữ ít được đi học, đi làm; phải vượt qua định kiến “phụ nữ không làm được việc lớn”. 2. Sự nghiệp: bà lăn lộn với thực tế, viết những bài báo sắc sảo, dấn thân vào những đề tài khó; từng bước khẳng định vị trí trong làng báo. 3. Ý nghĩa: bà là người tiên phong, mở đường cho các thế hệ nữ nhà báo sau này; tấm gương về bản lĩnh, khát vọng bình đẳng. (Ngữ liệu thông tin — tự soạn) Văn bản trên cung cấp thông tin về đối tượng nào?", "options": ["A. Một nam phóng viên", "B. Người phụ nữ được coi là nữ phóng viên đầu tiên — nhân vật tiên phong trong nghề báo", "C. Một tờ báo", "D. Một sự kiện"], "answer": "B", "explain": "Nhan đề và nội dung đều hướng về “nữ phóng viên đầu tiên” — văn bản thông tin về nhân vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNỮ PHÓNG VIÊN ĐẦU TIÊN: NGƯỜI MỞ ĐƯỜNG\nTrong lịch sử báo chí, có những người phụ nữ đã dũng cảm mở đường. Bài viết “Nữ phóng viên đầu tiên” giới thiệu chân dung một nhân vật như thế. 1. Hoàn cảnh: bà đến với nghề báo trong xã hội mà phụ nữ ít được đi học, đi làm; phải vượt qua định kiến “phụ nữ không làm được việc lớn”. 2. Sự nghiệp: bà lăn lộn với thực tế, viết những bài báo sắc sảo, dấn thân vào những đề tài khó; từng bước khẳng định vị trí trong làng báo. 3. Ý nghĩa: bà là người tiên phong, mở đường cho các thế hệ nữ nhà báo sau này; tấm gương về bản lĩnh, khát vọng bình đẳng. (Ngữ liệu thông tin — tự soạn) Khó khăn lớn nhất mà nhân vật phải vượt qua là gì?", "options": ["A. Thiếu tiền", "B. Định kiến xã hội “phụ nữ không làm được việc lớn” trong xã hội cũ", "C. Không biết viết", "D. Không có khó khăn"], "answer": "B", "explain": "Ngữ liệu nêu rõ: bà phải vượt qua định kiến về phụ nữ trong xã hội mà “phụ nữ ít được đi học, đi làm”.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNỮ PHÓNG VIÊN ĐẦU TIÊN: NGƯỜI MỞ ĐƯỜNG\nTrong lịch sử báo chí, có những người phụ nữ đã dũng cảm mở đường. Bài viết “Nữ phóng viên đầu tiên” giới thiệu chân dung một nhân vật như thế. 1. Hoàn cảnh: bà đến với nghề báo trong xã hội mà phụ nữ ít được đi học, đi làm; phải vượt qua định kiến “phụ nữ không làm được việc lớn”. 2. Sự nghiệp: bà lăn lộn với thực tế, viết những bài báo sắc sảo, dấn thân vào những đề tài khó; từng bước khẳng định vị trí trong làng báo. 3. Ý nghĩa: bà là người tiên phong, mở đường cho các thế hệ nữ nhà báo sau này; tấm gương về bản lĩnh, khát vọng bình đẳng. (Ngữ liệu thông tin — tự soạn) Cấu trúc của ngữ liệu theo mô hình nào của văn bản thông tin về nhân vật?", "options": ["A. Lộn xộn", "B. Giới thiệu nhân vật — hoàn cảnh, sự nghiệp — đánh giá ý nghĩa: từ cụ thể đến khái quát, từ quá khứ đến giá trị", "C. Chỉ kể chuyện", "D. Chỉ đánh giá"], "answer": "B", "explain": "Mô hình chuẩn: giới thiệu — tiểu sử/sự nghiệp — đánh giá vị trí, ý nghĩa; từ sự việc cụ thể nâng lên giá trị khái quát.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Nữ phóng viên đầu tiên” (Trần Nhật Vy) là văn bản thông tin về nhân vật.", "b) Văn bản thông tin về nhân vật cần đảm bảo tính xác thực của tiểu sử, sự kiện.", "c) Nhân vật tiên phong có ý nghĩa mở đường cho thế hệ sau.", "d) Định kiến giới không còn là rào cản với phụ nữ hiện nay nên không cần quan tâm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: tính xác thực là yêu cầu hàng đầu. c) Đúng. d) Sai: bình đẳng giới vẫn là vấn đề cần quan tâm; tấm gương người đi trước luôn có giá trị.", "points": 1}, {"type": "short", "level": "NB", "q": "Tác giả của văn bản “Nữ phóng viên đầu tiên” trong SGK là ai?", "answer": "Trần Nhật Vy", "explain": "“Nữ phóng viên đầu tiên” là bài viết của nhà báo, nhà văn Trần Nhật Vy — văn bản thông tin về nhân vật trong Bài 8.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về vai trò của phụ nữ trong xã hội hiện nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Phụ nữ ngày nay đã khẳng định vai trò to lớn trong mọi lĩnh vực của xã hội. Họ là nhà khoa học, bác sĩ, kĩ sư, doanh nhân, nhà lãnh đạo — không thua kém nam giới. Trong gia đình, họ là người giữ lửa, nuôi dạy con cái; ngoài xã hội, họ đóng góp trí tuệ, tài năng cho sự phát triển chung. Những tấm gương như nữ phóng viên đầu tiên cho thấy: khi được tạo cơ hội, phụ nữ có thể làm nên những điều phi thường. Tuy nhiên, đâu đó định kiến giới vẫn còn tồn tại, phụ nữ vẫn chịu nhiều thiệt thòi. Vì vậy, mỗi chúng ta cần tôn trọng, tạo điều kiện để phụ nữ phát huy hết khả năng; các bạn nữ hãy tự tin vươn lên, khẳng định mình. Bình đẳng giới không chỉ là quyền của phụ nữ mà còn là thước đo văn minh của xã hội."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về bình đẳng giới trong xã hội hiện nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ tấm gương nữ phóng viên đầu tiên, đặt vấn đề bình đẳng giới. 2. Thân bài: a) Giải thích: bình đẳng giới là nam nữ có quyền, cơ hội ngang nhau. b) Biểu hiện tiến bộ: phụ nữ tham gia mọi lĩnh vực, giữ vị trí lãnh đạo; pháp luật bảo vệ. c) Những rào cản còn tồn tại: định kiến, bạo lực gia đình, chênh lệch thu nhập, tư tưởng trọng nam khinh nữ. d) Ý nghĩa của bình đẳng giới: phát huy nguồn lực, xã hội công bằng, văn minh. e) Giải pháp: hoàn thiện pháp luật, tuyên truyền, giáo dục; mỗi người thay đổi nhận thức; phụ nữ tự vươn lên. f) Liên hệ bản thân. 3. Kết bài: khẳng định bình đẳng giới là xu thế tất yếu; lời kêu gọi."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNĂNG LƯỢNG MẶT TRỜI: MÓN QUÀ CỦA THIÊN NHIÊN\nMặt Trời mỗi ngày chiếu xuống Trái Đất một nguồn năng lượng khổng lồ, gấp hàng nghìn lần nhu cầu của nhân loại. 1. Nguyên lí: tấm pin mặt trời chuyển hóa quang năng thành điện năng. 2. Ưu điểm: sạch, không gây ô nhiễm; vô tận, miễn phí; phù hợp với vùng sâu, vùng xa, hải đảo. 3. Hạn chế: phụ thuộc thời tiết; chi phí đầu tư ban đầu cao; cần diện tích lắp đặt lớn. Với tiến bộ công nghệ, năng lượng mặt trời ngày càng rẻ và hiệu quả — là chìa khóa cho tương lai xanh. (Ngữ liệu thông tin — tự soạn) Theo ngữ liệu, năng lượng mặt trời có những ưu điểm nào?", "options": ["A. Gây ô nhiễm", "B. Sạch, không ô nhiễm; vô tận, miễn phí; phù hợp vùng sâu, vùng xa", "C. Đắt đỏ mãi mãi", "D. Không có ưu điểm"], "answer": "B", "explain": "Ba ưu điểm được liệt kê: sạch, vô tận/miễn phí, phù hợp vùng khó khăn — thông tin rõ ràng, cụ thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNĂNG LƯỢNG MẶT TRỜI: MÓN QUÀ CỦA THIÊN NHIÊN\nMặt Trời mỗi ngày chiếu xuống Trái Đất một nguồn năng lượng khổng lồ, gấp hàng nghìn lần nhu cầu của nhân loại. 1. Nguyên lí: tấm pin mặt trời chuyển hóa quang năng thành điện năng. 2. Ưu điểm: sạch, không gây ô nhiễm; vô tận, miễn phí; phù hợp với vùng sâu, vùng xa, hải đảo. 3. Hạn chế: phụ thuộc thời tiết; chi phí đầu tư ban đầu cao; cần diện tích lắp đặt lớn. Với tiến bộ công nghệ, năng lượng mặt trời ngày càng rẻ và hiệu quả — là chìa khóa cho tương lai xanh. (Ngữ liệu thông tin — tự soạn) Việc nêu cả ưu điểm và hạn chế thể hiện đặc điểm nào của văn bản thông tin?", "options": ["A. Thiên vị", "B. Tính khách quan, toàn diện: nhìn nhận vấn đề nhiều chiều, không một chiều", "C. Mâu thuẫn", "D. Thiếu chính kiến"], "answer": "B", "explain": "Nêu cả mặt mạnh và mặt hạn chế là biểu hiện của tính khách quan — văn bản thông tin đáng tin cậy nhìn vấn đề toàn diện.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNĂNG LƯỢNG MẶT TRỜI: MÓN QUÀ CỦA THIÊN NHIÊN\nMặt Trời mỗi ngày chiếu xuống Trái Đất một nguồn năng lượng khổng lồ, gấp hàng nghìn lần nhu cầu của nhân loại. 1. Nguyên lí: tấm pin mặt trời chuyển hóa quang năng thành điện năng. 2. Ưu điểm: sạch, không gây ô nhiễm; vô tận, miễn phí; phù hợp với vùng sâu, vùng xa, hải đảo. 3. Hạn chế: phụ thuộc thời tiết; chi phí đầu tư ban đầu cao; cần diện tích lắp đặt lớn. Với tiến bộ công nghệ, năng lượng mặt trời ngày càng rẻ và hiệu quả — là chìa khóa cho tương lai xanh. (Ngữ liệu thông tin — tự soạn) Câu kết (“là chìa khóa cho tương lai xanh”) có vai trò gì?", "options": ["A. Quảng cáo", "B. Đánh giá, mở ra triển vọng: khẳng định vai trò của năng lượng mặt trời trong tương lai — kết thúc có tính định hướng", "C. Kể chuyện", "D. Không vai trò"], "answer": "B", "explain": "Sau khi phân tích các mặt, câu kết đưa ra đánh giá và triển vọng — đúng chức năng kết thúc của văn bản thông tin.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Văn bản thông tin khoa học cần đảm bảo tính chính xác, khách quan.", "b) Nêu cả ưu điểm và hạn chế giúp người đọc có cái nhìn toàn diện.", "c) Số liệu (“gấp hàng nghìn lần”) làm tăng sức thuyết phục.", "d) Văn bản thông tin chỉ nên nêu mặt tích cực để gây ấn tượng tốt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: số liệu cụ thể tạo độ tin cậy. d) Sai: phải khách quan, toàn diện — che giấu mặt hạn chế làm mất độ tin cậy.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu hai yêu cầu quan trọng nhất của văn bản thông tin.", "answer": "Tính khách quan, chính xác và cấu trúc rõ ràng, hệ thống", "explain": "Hai yêu cầu hàng đầu: thông tin phải khách quan, chính xác (đúng sự thật, có nguồn tin cậy); cấu trúc phải rõ ràng, hệ thống (dễ theo dõi, tra cứu).", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ về lợi ích của năng lượng tái tạo (gợi ý từ ngữ liệu Đề 6). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Năng lượng tái tạo (mặt trời, gió, thủy triều...) là chìa khóa cho tương lai xanh của nhân loại. Ưu điểm lớn nhất là sạch và vô tận: không gây ô nhiễm như than đá, dầu mỏ; không bao giờ cạn kiệt như nhiên liệu hóa thạch. Việt Nam với lợi thế nắng gió dồi dào có tiềm năng rất lớn về điện mặt trời, điện gió — nhiều vùng quê, hải đảo đã có điện sạch nhờ các dự án năng lượng tái tạo. Tuy nhiên, việc phát triển còn gặp khó khăn: chi phí đầu tư cao, phụ thuộc thời tiết, cần chính sách hỗ trợ. Là học sinh, chúng ta có thể góp phần bằng cách tiết kiệm điện, tìm hiểu về năng lượng sạch và lan tỏa ý thức bảo vệ môi trường. Hãy nhớ: hôm nay ta dùng năng lượng sạch, ngày mai con cháu ta được hưởng bầu trời trong xanh."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn thuyết minh khoảng 600 chữ về một nguồn năng lượng (tự chọn: mặt trời, gió, thủy điện, sinh khối...). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu nguồn năng lượng em chọn và vai trò của nó. 2. Thân bài: a) Khái niệm, nguyên lí hoạt động. b) Ưu điểm. c) Hạn chế, thách thức. d) Thực trạng phát triển ở Việt Nam và thế giới (số liệu). e) Triển vọng. 3. Kết bài: đánh giá; liên hệ ý thức tiết kiệm năng lượng của bản thân."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBIẾN ĐỔI KHÍ HẬU: THÁCH THỨC TOÀN CẦU\nBiến đổi khí hậu là sự thay đổi của hệ thống khí hậu Trái Đất, biểu hiện ở nóng lên toàn cầu, nước biển dâng, thời tiết cực đoan. 1. Nguyên nhân: chủ yếu do hoạt động của con người — đốt nhiên liệu hóa thạch thải khí CO2, phá rừng, công nghiệp hóa. 2. Hậu quả: băng tan, nước biển dâng đe dọa các vùng ven biển; hạn hán, bão lũ dữ dội; ảnh hưởng nông nghiệp, sức khỏe. Việt Nam là một trong những nước chịu ảnh hưởng nặng nề nhất. 3. Giải pháp: giảm khí thải, phát triển năng lượng sạch, trồng rừng, và quan trọng nhất — thay đổi ý thức, lối sống của mỗi người. Trái Đất chỉ có một. Hành động ngay hôm nay! (Ngữ liệu thông tin — tự soạn) Theo ngữ liệu, nguyên nhân chính của biến đổi khí hậu là gì?", "options": ["A. Thiên nhiên", "B. Hoạt động của con người: đốt nhiên liệu hóa thạch, phá rừng, công nghiệp hóa", "C. Động vật", "D. Không rõ"], "answer": "B", "explain": "Ngữ liệu khẳng định: “chủ yếu do hoạt động của con người” với các biểu hiện cụ thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBIẾN ĐỔI KHÍ HẬU: THÁCH THỨC TOÀN CẦU\nBiến đổi khí hậu là sự thay đổi của hệ thống khí hậu Trái Đất, biểu hiện ở nóng lên toàn cầu, nước biển dâng, thời tiết cực đoan. 1. Nguyên nhân: chủ yếu do hoạt động của con người — đốt nhiên liệu hóa thạch thải khí CO2, phá rừng, công nghiệp hóa. 2. Hậu quả: băng tan, nước biển dâng đe dọa các vùng ven biển; hạn hán, bão lũ dữ dội; ảnh hưởng nông nghiệp, sức khỏe. Việt Nam là một trong những nước chịu ảnh hưởng nặng nề nhất. 3. Giải pháp: giảm khí thải, phát triển năng lượng sạch, trồng rừng, và quan trọng nhất — thay đổi ý thức, lối sống của mỗi người. Trái Đất chỉ có một. Hành động ngay hôm nay! (Ngữ liệu thông tin — tự soạn) Chi tiết “Việt Nam là một trong những nước chịu ảnh hưởng nặng nề nhất” có tác dụng gì?", "options": ["A. Gây hoang mang", "B. Làm cho vấn đề toàn cầu trở nên gần gũi, cấp thiết với người đọc Việt Nam — tăng sức thuyết phục", "C. Khoe khoang", "D. Không tác dụng"], "answer": "B", "explain": "Đưa vấn đề toàn cầu về gần với người đọc: đây không phải chuyện của ai khác mà của chính chúng ta — tính cấp thiết tăng lên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBIẾN ĐỔI KHÍ HẬU: THÁCH THỨC TOÀN CẦU\nBiến đổi khí hậu là sự thay đổi của hệ thống khí hậu Trái Đất, biểu hiện ở nóng lên toàn cầu, nước biển dâng, thời tiết cực đoan. 1. Nguyên nhân: chủ yếu do hoạt động của con người — đốt nhiên liệu hóa thạch thải khí CO2, phá rừng, công nghiệp hóa. 2. Hậu quả: băng tan, nước biển dâng đe dọa các vùng ven biển; hạn hán, bão lũ dữ dội; ảnh hưởng nông nghiệp, sức khỏe. Việt Nam là một trong những nước chịu ảnh hưởng nặng nề nhất. 3. Giải pháp: giảm khí thải, phát triển năng lượng sạch, trồng rừng, và quan trọng nhất — thay đổi ý thức, lối sống của mỗi người. Trái Đất chỉ có một. Hành động ngay hôm nay! (Ngữ liệu thông tin — tự soạn) Cấu trúc “nguyên nhân — hậu quả — giải pháp” là mô hình của kiểu văn bản nào?", "options": ["A. Truyện", "B. Văn bản thông tin/nghị luận về vấn đề xã hội — mô hình phân tích toàn diện, hướng tới hành động", "C. Thơ", "D. Kịch"], "answer": "B", "explain": "Mô hình nguyên nhân — hậu quả — giải pháp là cấu trúc kinh điển để phân tích một vấn đề một cách toàn diện và đề xuất hướng hành động.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Biến đổi khí hậu là thách thức toàn cầu, cần sự chung tay của nhân loại.", "b) Việt Nam chịu ảnh hưởng nặng nề của biến đổi khí hậu.", "c) Mỗi cá nhân không thể góp phần chống biến đổi khí hậu.", "d) Văn bản thông tin có thể kết thúc bằng lời kêu gọi hành động."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: mỗi người thay đổi lối sống (tiết kiệm điện, trồng cây, giảm rác thải) đều góp phần. d) Đúng: như câu kết của ngữ liệu.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu ba giải pháp chính để ứng phó với biến đổi khí hậu (theo ngữ liệu).", "answer": "Giảm khí thải; phát triển năng lượng sạch, trồng rừng; thay đổi ý thức, lối sống", "explain": "Ba nhóm giải pháp: giảm phát thải khí nhà kính; phát triển năng lượng sạch, trồng rừng; thay đổi ý thức và lối sống của mỗi người.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ về trách nhiệm của tuổi trẻ trong việc ứng phó với biến đổi khí hậu. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Biến đổi khí hậu là thách thức toàn cầu, và tuổi trẻ chúng ta có trách nhiệm góp phần ứng phó. Dù còn nhỏ, chúng ta vẫn có thể hành động từ những việc đơn giản nhất: tiết kiệm điện, nước; hạn chế dùng đồ nhựa; trồng và chăm sóc cây xanh; phân loại rác; đi xe đạp, đi bộ khi có thể. Quan trọng hơn, chúng ta là thế hệ tương lai — cần trang bị tri thức về môi trường, lan tỏa ý thức bảo vệ Trái Đất đến gia đình, bạn bè và cộng đồng qua các hoạt động tình nguyện, truyền thông. Đừng nghĩ rằng việc nhỏ không có ý nghĩa: hàng triệu hành động nhỏ sẽ tạo nên sức mạnh lớn. Hãy nhớ: Trái Đất chỉ có một, và tương lai của nó nằm trong tay chúng ta. Hành động ngay hôm nay — vì một hành tinh xanh cho mai sau."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về trách nhiệm của con người trước biến đổi khí hậu. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: nêu vấn đề biến đổi khí hậu — thách thức lớn nhất của nhân loại. 2. Thân bài: a) Thực trạng: nóng lên toàn cầu, nước biển dâng, thời tiết cực đoan; dẫn chứng, số liệu. b) Nguyên nhân: hoạt động con người là chính. c) Hậu quả: với tự nhiên, kinh tế, sức khỏe, an ninh lương thực; Việt Nam chịu ảnh hưởng nặng. d) Trách nhiệm: của các quốc gia (cam kết quốc tế), của cộng đồng, của mỗi cá nhân. e) Giải pháp: năng lượng sạch, trồng rừng, thay đổi lối sống; vai trò của tuổi trẻ. f) Liên hệ bản thân. 3. Kết bài: khẳng định “bảo vệ Trái Đất là bảo vệ chính mình”; lời kêu gọi hành động."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Học sinh không cần đọc văn bản thông tin vì khô khan, chỉ cần học văn bản văn học.” Ý kiến này chưa đúng. Văn bản thông tin cung cấp tri thức cần thiết cho cuộc sống: hiểu về sức khỏe, công nghệ, môi trường, pháp luật... — những điều văn bản văn học không thể thay thế. Hơn nữa, kĩ năng đọc hiểu văn bản thông tin (tìm ý chính, đánh giá độ tin cậy, sử dụng số liệu) là kĩ năng sống quan trọng trong thời đại bùng nổ thông tin, giúp ta không bị tin giả lừa dối. Vì vậy, cần học cả hai loại văn bản: văn học nuôi dưỡng tâm hồn, văn bản thông tin trang bị tri thức — hai cánh của một con chim. (Ngữ liệu nghị luận — tự soạn) Ý kiến “học sinh không cần đọc văn bản thông tin” được tác giả đánh giá như thế nào?", "options": ["A. Đồng tình", "B. Phản bác: cho rằng “chưa đúng” và đưa ra lí lẽ chứng minh", "C. Không ý kiến", "D. Ủng hộ một phần"], "answer": "B", "explain": "Tác giả dùng “Ý kiến này chưa đúng” để phản bác, sau đó đưa lí lẽ (tri thức cần thiết, kĩ năng sống) để chứng minh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Học sinh không cần đọc văn bản thông tin vì khô khan, chỉ cần học văn bản văn học.” Ý kiến này chưa đúng. Văn bản thông tin cung cấp tri thức cần thiết cho cuộc sống: hiểu về sức khỏe, công nghệ, môi trường, pháp luật... — những điều văn bản văn học không thể thay thế. Hơn nữa, kĩ năng đọc hiểu văn bản thông tin (tìm ý chính, đánh giá độ tin cậy, sử dụng số liệu) là kĩ năng sống quan trọng trong thời đại bùng nổ thông tin, giúp ta không bị tin giả lừa dối. Vì vậy, cần học cả hai loại văn bản: văn học nuôi dưỡng tâm hồn, văn bản thông tin trang bị tri thức — hai cánh của một con chim. (Ngữ liệu nghị luận — tự soạn) Theo ngữ liệu, kĩ năng đọc văn bản thông tin có ý nghĩa gì trong thời đại hiện nay?", "options": ["A. Không ý nghĩa", "B. Giúp tìm ý chính, đánh giá độ tin cậy, không bị tin giả lừa dối — kĩ năng sống quan trọng", "C. Chỉ để thi", "D. Để giải trí"], "answer": "B", "explain": "Trong thời đại bùng nổ thông tin và tin giả, kĩ năng đọc hiểu, đánh giá thông tin là “kĩ năng sống quan trọng”.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Học sinh không cần đọc văn bản thông tin vì khô khan, chỉ cần học văn bản văn học.” Ý kiến này chưa đúng. Văn bản thông tin cung cấp tri thức cần thiết cho cuộc sống: hiểu về sức khỏe, công nghệ, môi trường, pháp luật... — những điều văn bản văn học không thể thay thế. Hơn nữa, kĩ năng đọc hiểu văn bản thông tin (tìm ý chính, đánh giá độ tin cậy, sử dụng số liệu) là kĩ năng sống quan trọng trong thời đại bùng nổ thông tin, giúp ta không bị tin giả lừa dối. Vì vậy, cần học cả hai loại văn bản: văn học nuôi dưỡng tâm hồn, văn bản thông tin trang bị tri thức — hai cánh của một con chim. (Ngữ liệu nghị luận — tự soạn) Hình ảnh so sánh “hai cánh của một con chim” có ý nghĩa gì?", "options": ["A. Trang trí", "B. Khẳng định văn học và văn bản thông tin đều cần thiết, bổ sung cho nhau — thiếu một trong hai, việc học sẽ “không bay được”", "C. Nói về chim", "D. Không ý nghĩa"], "answer": "B", "explain": "So sánh đẹp: văn học (nuôi tâm hồn) và thông tin (trang bị tri thức) như hai cánh — cần cả hai để phát triển toàn diện.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Văn bản thông tin và văn bản văn học có chức năng khác nhau nhưng đều cần thiết.", "b) Đọc văn bản thông tin giúp phòng tránh tin giả.", "c) Chỉ cần học văn bản văn học là đủ cho cuộc sống.", "d) Thao tác “bác bỏ” được sử dụng ở đầu ngữ liệu."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: kĩ năng đánh giá độ tin cậy. c) Sai: cần cả tri thức từ văn bản thông tin. d) Đúng: nêu ý kiến sai rồi phản bác.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu hai chức năng chính của văn bản thông tin.", "answer": "Cung cấp tri thức và giúp người đọc hiểu, ứng xử đúng với sự vật, hiện tượng", "explain": "Chức năng: cung cấp tri thức khách quan, chính xác; giúp người đọc hiểu biết, đánh giá và ứng xử đúng đắn với sự vật, hiện tượng trong đời sống.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ về cách phòng tránh tin giả trên mạng xã hội. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Tin giả tràn lan trên mạng xã hội là thách thức lớn hiện nay, và mỗi chúng ta cần biết cách phòng tránh. Trước hết, hãy kiểm tra nguồn tin: tin từ báo chí chính thống, cơ quan uy tín đáng tin hơn tin từ tài khoản ẩn danh. Thứ hai, đọc kĩ nội dung, cảnh giác với những tiêu đề giật gân, hình ảnh cắt ghép; có thể dùng công cụ tìm kiếm để đối chiếu nhiều nguồn. Thứ ba, không vội chia sẻ khi chưa xác thực — một nút chia sẻ thiếu suy nghĩ có thể tiếp tay lan truyền tin giả, gây hoang mang. Thứ tư, trang bị kiến thức nền để có khả năng phán đoán: hiểu biết càng rộng, càng khó bị lừa. Cuối cùng, hãy báo cáo những tin giả, độc hại cho nền tảng mạng xã hội. Là học sinh, chúng ta hãy là người dùng mạng thông thái: đọc có chọn lọc, chia sẻ có trách nhiệm — góp phần làm sạch môi trường mạng."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về vấn đề tin giả trên mạng xã hội. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: nêu thực trạng tin giả tràn lan — vấn đề nhức nhối. 2. Thân bài: a) Giải thích: tin giả là thông tin sai sự thật, bịa đặt. b) Biểu hiện: tin sức khỏe, chính trị, lừa đảo; tiêu đề giật gân. c) Nguyên nhân: câu view, câu like; động cơ xấu; người dùng thiếu kĩ năng, nhẹ dạ. d) Tác hại: hoang mang dư luận, thiệt hại kinh tế, ảnh hưởng sức khỏe, an ninh. e) Giải pháp: hoàn thiện pháp luật, xử phạt; nền tảng mạng có trách nhiệm; mỗi người nâng cao kĩ năng (kiểm chứng, không chia sẻ bừa); giáo dục từ nhà trường. f) Liên hệ bản thân. 3. Kết bài: khẳng định cần chung tay đẩy lùi tin giả; lời kêu gọi dùng mạng thông thái."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nĐẠI DƯƠNG: KHO BÁU CHƯA ĐƯỢC KHÁM PHÁ\nĐại dương chiếm hơn 70% diện tích bề mặt Trái Đất, nhưng con người mới khám phá được một phần rất nhỏ. 1. Tài nguyên: hải sản, dầu khí, khoáng sản, năng lượng sóng, gió biển... — nguồn sống của hàng tỉ người. 2. Bí ẩn: đáy đại dương sâu thẳm với những sinh vật kì lạ, những dãy núi ngầm, những dòng hải lưu khổng lồ ảnh hưởng đến khí hậu toàn cầu. 3. Thách thức: ô nhiễm rác thải nhựa, khai thác quá mức, biến đổi khí hậu đang đe dọa đại dương. Khám phá và bảo vệ đại dương là nhiệm vụ chung của nhân loại trong thế kỉ XXI. (Ngữ liệu thông tin — tự soạn) Theo ngữ liệu, đại dương chiếm bao nhiêu diện tích bề mặt Trái Đất?", "options": ["A. 30%", "B. Hơn 70%", "C. 50%", "D. 90%"], "answer": "B", "explain": "Ngữ liệu nêu trực tiếp: “Đại dương chiếm hơn 70% diện tích bề mặt Trái Đất”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nĐẠI DƯƠNG: KHO BÁU CHƯA ĐƯỢC KHÁM PHÁ\nĐại dương chiếm hơn 70% diện tích bề mặt Trái Đất, nhưng con người mới khám phá được một phần rất nhỏ. 1. Tài nguyên: hải sản, dầu khí, khoáng sản, năng lượng sóng, gió biển... — nguồn sống của hàng tỉ người. 2. Bí ẩn: đáy đại dương sâu thẳm với những sinh vật kì lạ, những dãy núi ngầm, những dòng hải lưu khổng lồ ảnh hưởng đến khí hậu toàn cầu. 3. Thách thức: ô nhiễm rác thải nhựa, khai thác quá mức, biến đổi khí hậu đang đe dọa đại dương. Khám phá và bảo vệ đại dương là nhiệm vụ chung của nhân loại trong thế kỉ XXI. (Ngữ liệu thông tin — tự soạn) Cấu trúc của ngữ liệu được triển khai theo logic nào?", "options": ["A. Lộn xộn", "B. Tài nguyên — bí ẩn — thách thức: từ giá trị đến điều chưa biết đến vấn đề cần giải quyết — toàn diện, có chiều sâu", "C. Chỉ nêu tài nguyên", "D. Chỉ nêu thách thức"], "answer": "B", "explain": "Ba đề mục: giá trị (tài nguyên), điều kì bí (khám phá), vấn đề (bảo vệ) — từ nhận thức đến trách nhiệm, logic chặt chẽ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nĐẠI DƯƠNG: KHO BÁU CHƯA ĐƯỢC KHÁM PHÁ\nĐại dương chiếm hơn 70% diện tích bề mặt Trái Đất, nhưng con người mới khám phá được một phần rất nhỏ. 1. Tài nguyên: hải sản, dầu khí, khoáng sản, năng lượng sóng, gió biển... — nguồn sống của hàng tỉ người. 2. Bí ẩn: đáy đại dương sâu thẳm với những sinh vật kì lạ, những dãy núi ngầm, những dòng hải lưu khổng lồ ảnh hưởng đến khí hậu toàn cầu. 3. Thách thức: ô nhiễm rác thải nhựa, khai thác quá mức, biến đổi khí hậu đang đe dọa đại dương. Khám phá và bảo vệ đại dương là nhiệm vụ chung của nhân loại trong thế kỉ XXI. (Ngữ liệu thông tin — tự soạn) Nhan đề gọi đại dương là “kho báu chưa được khám phá” dựa trên cơ sở nào?", "options": ["A. Có vàng", "B. Vừa giàu tài nguyên (kho báu) vừa còn nhiều bí ẩn chưa biết (chưa được khám phá) — nhan đề khái quát chính xác hai đặc điểm lớn", "C. Để hấp dẫn", "D. Không cơ sở"], "answer": "B", "explain": "“Kho báu” từ nguồn tài nguyên phong phú; “chưa được khám phá” từ những bí ẩn đáy sâu — nhan đề vừa hấp dẫn vừa chính xác.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Nhan đề văn bản thông tin cần ngắn gọn, nêu bật đối tượng.", "b) Các đề mục giúp người đọc dễ theo dõi, tra cứu thông tin.", "c) Văn bản thông tin về đại dương cần đảm bảo tính khoa học.", "d) Bảo vệ đại dương không phải trách nhiệm của Việt Nam vì Việt Nam không có biển."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: chức năng của đề mục. c) Đúng. d) Sai: Việt Nam có bờ biển dài hơn 3260 km — bảo vệ biển là trách nhiệm trực tiếp.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu vai trò của các đề mục (tiêu đề nhỏ) trong văn bản thông tin.", "answer": "Giúp cấu trúc rõ ràng, người đọc dễ theo dõi, nắm bắt và tra cứu từng khía cạnh", "explain": "Đề mục chia văn bản thành các phần rõ ràng theo từng khía cạnh; giúp người đọc dễ theo dõi mạch thông tin, nhanh chóng tìm được nội dung cần thiết.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ kêu gọi bảo vệ môi trường biển. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Biển đang kêu cứu! Rác thải nhựa tràn ngập đại dương, mỗi năm giết chết hàng triệu sinh vật biển; khai thác quá mức làm cạn kiệt nguồn lợi; biến đổi khí hậu khiến nước biển dâng, san hô chết trắng. Việt Nam với hơn 3260 km bờ biển chịu ảnh hưởng trực tiếp: ngư dân khó khăn, du lịch biển bị đe dọa. Bảo vệ biển là bảo vệ chính chúng ta: hãy giảm thiểu rác thải nhựa, không xả rác xuống biển; không mua bán, tiêu thụ các loài hải sản quý hiếm, đánh bắt trái phép; tham gia làm sạch bãi biển; tuyên truyền cho mọi người cùng hiểu. Mỗi hành động nhỏ — từ chối một chiếc ống hút nhựa, nhặt một mẩu rác trên bãi biển — đều góp phần cứu đại dương. Hãy nhớ: đại dương là “kho báu” của nhân loại, và chúng ta có trách nhiệm giữ gìn kho báu ấy cho mai sau."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn thuyết minh khoảng 600 chữ về biển Việt Nam (vị trí, tài nguyên, vai trò và bảo vệ). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu biển Việt Nam — một phần máu thịt của Tổ quốc. 2. Thân bài: a) Vị trí địa lí: bờ biển dài hơn 3260 km, nhiều đảo, quần đảo (Hoàng Sa, Trường Sa). b) Tài nguyên: hải sản, dầu khí, du lịch, giao thông biển, năng lượng. c) Vai trò: kinh tế, an ninh quốc phòng, văn hóa. d) Thực trạng: ô nhiễm, khai thác quá mức; vấn đề chủ quyền biển đảo. e) Biện pháp bảo vệ: chính sách, ý thức người dân, vai trò tuổi trẻ. 3. Kết bài: khẳng định “biển là nhà”; lời kêu gọi bảo vệ biển đảo quê hương."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nVăn bản thông tin hiện diện khắp nơi trong đời sống: sách giáo khoa, báo chí, biển quảng cáo, hướng dẫn sử dụng... Biết đọc hiểu văn bản thông tin là kĩ năng không thể thiếu. Để đọc hiệu quả, trước hết hãy đọc lướt nhan đề, sa-pô để nắm ý chính. Sau đó đọc kĩ từng đề mục, chú ý số liệu, hình ảnh minh họa. Quan trọng nhất, hãy luôn đặt câu hỏi: thông tin này có chính xác không? Nguồn có đáng tin không? Đừng vội tin mọi thứ đọc được — nhất là trên mạng. Người đọc thông thái là người vừa tiếp thu tri thức, vừa biết đánh giá, chọn lọc. (Ngữ liệu tổng kết — tự soạn) Theo ngữ liệu, để đọc hiểu văn bản thông tin hiệu quả cần làm gì?", "options": ["A. Đọc thuộc lòng", "B. Đọc lướt nhan đề, sa-pô nắm ý chính; đọc kĩ đề mục, chú ý số liệu, hình ảnh; đặt câu hỏi về độ chính xác, nguồn tin", "C. Chỉ đọc nhan đề", "D. Không cần đọc"], "answer": "B", "explain": "Ba bước được nêu rõ: đọc lướt nắm ý chính — đọc kĩ chi tiết — đánh giá độ tin cậy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nVăn bản thông tin hiện diện khắp nơi trong đời sống: sách giáo khoa, báo chí, biển quảng cáo, hướng dẫn sử dụng... Biết đọc hiểu văn bản thông tin là kĩ năng không thể thiếu. Để đọc hiệu quả, trước hết hãy đọc lướt nhan đề, sa-pô để nắm ý chính. Sau đó đọc kĩ từng đề mục, chú ý số liệu, hình ảnh minh họa. Quan trọng nhất, hãy luôn đặt câu hỏi: thông tin này có chính xác không? Nguồn có đáng tin không? Đừng vội tin mọi thứ đọc được — nhất là trên mạng. Người đọc thông thái là người vừa tiếp thu tri thức, vừa biết đánh giá, chọn lọc. (Ngữ liệu tổng kết — tự soạn) Vì sao cần đặt câu hỏi về độ chính xác của thông tin, nhất là trên mạng?", "options": ["A. Để khó tính", "B. Vì có nhiều tin giả, thông tin sai lệch; người đọc cần tỉnh táo để không bị lừa dối", "C. Không cần thiết", "D. Để mất thời gian"], "answer": "B", "explain": "Mạng xã hội tràn lan tin giả; kĩ năng đánh giá nguồn tin giúp ta không bị lừa dối, không lan truyền sai lệch.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nVăn bản thông tin hiện diện khắp nơi trong đời sống: sách giáo khoa, báo chí, biển quảng cáo, hướng dẫn sử dụng... Biết đọc hiểu văn bản thông tin là kĩ năng không thể thiếu. Để đọc hiệu quả, trước hết hãy đọc lướt nhan đề, sa-pô để nắm ý chính. Sau đó đọc kĩ từng đề mục, chú ý số liệu, hình ảnh minh họa. Quan trọng nhất, hãy luôn đặt câu hỏi: thông tin này có chính xác không? Nguồn có đáng tin không? Đừng vội tin mọi thứ đọc được — nhất là trên mạng. Người đọc thông thái là người vừa tiếp thu tri thức, vừa biết đánh giá, chọn lọc. (Ngữ liệu tổng kết — tự soạn) “Người đọc thông thái” theo ngữ liệu là người như thế nào?", "options": ["A. Đọc nhiều", "B. Vừa tiếp thu tri thức vừa biết đánh giá, chọn lọc — đọc một cách chủ động, phản biện", "C. Tin mọi thứ", "D. Không đọc"], "answer": "B", "explain": "“Vừa tiếp thu tri thức, vừa biết đánh giá, chọn lọc” — đọc chủ động, phản biện chứ không thụ động tiếp nhận.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định sau (tổng hợp Bài 8):", "statements": ["a) Văn bản thông tin cung cấp tri thức khách quan, chính xác với cấu trúc rõ ràng.", "b) Phương tiện phi ngôn ngữ (hình ảnh, biểu đồ) giúp thông tin trực quan, dễ hiểu.", "c) “Nữ phóng viên đầu tiên”, “Trí thông minh nhân tạo”, “Pa-ra-lim-pích” đều là văn bản thông tin.", "d) Khi đọc văn bản thông tin, không cần quan tâm đến nguồn gốc, độ tin cậy."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: về nhân vật, vấn đề khoa học, sự kiện thể thao. d) Sai: đánh giá nguồn tin, độ tin cậy là yêu cầu quan trọng.", "points": 1}, {"type": "short", "level": "TH", "q": "Kể tên ba văn bản đọc chính trong Bài 8 và cho biết mỗi văn bản cung cấp thông tin về lĩnh vực nào.", "answer": "“Nữ phóng viên đầu tiên” (nhân vật), “Trí thông minh nhân tạo” (khoa học – công nghệ), “Pa-ra-lim-pích” (thể thao)", "explain": "Ba văn bản: “Nữ phóng viên đầu tiên” (Trần Nhật Vy) — về nhân vật; “Trí thông minh nhân tạo” (R. Watson) — về khoa học công nghệ; “Pa-ra-lim-pích” (Huy Đăng) — về thể thao.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận của em về vai trò của văn bản thông tin trong học tập. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Văn bản thông tin đóng vai trò vô cùng quan trọng trong học tập của chúng ta. Sách giáo khoa các môn Vật lí, Hóa học, Sinh học, Lịch sử, Địa lí chủ yếu là văn bản thông tin — cung cấp tri thức khoa học, chính xác làm nền tảng hiểu biết. Khi làm bài tập, nghiên cứu, chúng ta cũng cần đọc hiểu các văn bản thông tin: bảng số liệu, biểu đồ, hướng dẫn thí nghiệm. Đặc biệt trong thời đại số, kĩ năng đọc hiểu văn bản thông tin còn giúp ta tra cứu, tự học hiệu quả và phòng tránh tin giả. Tuy nhiên, để phát huy vai trò ấy, chúng ta cần đọc một cách chủ động: nắm ý chính, chú ý số liệu, đánh giá độ tin cậy — trở thành “người đọc thông thái”. Có thể nói, văn bản thông tin là người thầy thầm lặng, trang bị cho ta tri thức để vững bước vào đời."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn thuyết minh khoảng 600 chữ về một vấn đề khoa học em quan tâm (tự chọn). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu vấn đề em chọn và lí do quan tâm. 2. Thân bài: a) Khái niệm, đặc điểm. b) Thực trạng / lịch sử phát triển. c) Ứng dụng, ý nghĩa. d) Thách thức, vấn đề đặt ra. e) Triển vọng. 3. Kết bài: đánh giá; liên hệ trách nhiệm tìm hiểu khoa học của tuổi trẻ. (Đảm bảo tính khoa học, chính xác; có thể dùng số liệu, hình ảnh minh họa.)"}]}]}
