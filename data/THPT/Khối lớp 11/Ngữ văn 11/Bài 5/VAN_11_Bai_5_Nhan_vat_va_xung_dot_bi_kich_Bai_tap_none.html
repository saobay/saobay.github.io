": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Công trường xây dựng. TRƯỞNG nhóm thợ ĐỨC đối mặt với CHỦ thầu BẢO.)\nĐỨC: Anh Bảo, vật liệu này không đạt chuẩn. Nếu cố xây, công trình sẽ nguy hiểm cho bao người!\nBẢO (quát): Cậu lo hão! Cứ làm theo lệnh tôi. Không làm thì nghỉ việc!\nĐỨC (nắm chặt tay, giọng run run): Tôi không thể đánh đổi sinh mạng con người lấy đồng tiền. Tôi nghỉ việc!\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Xung đột trong đoạn trích diễn ra giữa những ai?", "options": ["A. Đức với chính mình", "B. Đức (thợ, đại diện cho lương tâm, trách nhiệm) với Bảo (chủ thầu, đại diện cho lợi ích vật chất)", "C. Đức với thiên nhiên", "D. Không có xung đột"], "answer": "B", "explain": "Hai nhân vật đối đầu trực diện: Đức bảo vệ chất lượng, sinh mạng con người; Bảo chỉ quan tâm lợi nhuận, đe dọa đuổi việc — xung đột giữa lương tâm và đồng tiền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Công trường xây dựng. TRƯỞNG nhóm thợ ĐỨC đối mặt với CHỦ thầu BẢO.)\nĐỨC: Anh Bảo, vật liệu này không đạt chuẩn. Nếu cố xây, công trình sẽ nguy hiểm cho bao người!\nBẢO (quát): Cậu lo hão! Cứ làm theo lệnh tôi. Không làm thì nghỉ việc!\nĐỨC (nắm chặt tay, giọng run run): Tôi không thể đánh đổi sinh mạng con người lấy đồng tiền. Tôi nghỉ việc!\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Hành động “Tôi nghỉ việc!” của Đức thể hiện phẩm chất gì?", "options": ["A. Nóng nảy", "B. Dũng cảm bảo vệ lương tâm, dám từ bỏ lợi ích cá nhân vì trách nhiệm với cộng đồng", "C. Sợ hãi", "D. Thiếu suy nghĩ"], "answer": "B", "explain": "Trước sự đe dọa mất việc, Đức vẫn chọn lương tâm: không đánh đổi sinh mạng con người — hành động dũng cảm, có trách nhiệm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Công trường xây dựng. TRƯỞNG nhóm thợ ĐỨC đối mặt với CHỦ thầu BẢO.)\nĐỨC: Anh Bảo, vật liệu này không đạt chuẩn. Nếu cố xây, công trình sẽ nguy hiểm cho bao người!\nBẢO (quát): Cậu lo hão! Cứ làm theo lệnh tôi. Không làm thì nghỉ việc!\nĐỨC (nắm chặt tay, giọng run run): Tôi không thể đánh đổi sinh mạng con người lấy đồng tiền. Tôi nghỉ việc!\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Lời thoại trong đoạn trích có đặc điểm gì?", "options": ["A. Dài dòng, lan man", "B. Ngắn gọn, sắc sảo, bộc lộ tính cách và thúc đẩy xung đột phát triển", "C. Nhạt nhẽo", "D. Không liên quan đến xung đột"], "answer": "B", "explain": "Mỗi lời thoại đều “đánh trúng” mâu thuẫn: Đức kiên quyết, Bảo hống hách — lời thoại vừa khắc họa tính cách vừa đẩy xung đột lên cao trào.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Xung đột là sự đối đầu gay gắt giữa các nhân vật, là linh hồn của kịch.", "b) Lời thoại trong kịch vừa bộc lộ tính cách vừa thúc đẩy xung đột.", "c) Nhân vật Đức trong đoạn trích gợi liên tưởng đến Vũ Như Tô — người nghệ sĩ dám bảo vệ lí tưởng.", "d) Trong kịch, tính cách nhân vật được bộc lộ qua lời kể của tác giả."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: chức năng kép của lời thoại. c) Đúng: cùng dám bảo vệ lí tưởng, không khuất phục (Vũ Như Tô không bỏ Cửu Trùng Đài). d) Sai: trong kịch, tính cách bộc lộ qua lời thoại và hành động, không qua lời kể.", "points": 1}, {"type": "short", "level": "TH", "q": "Vở bi kịch “Vũ Như Tô” của Nguyễn Huy Tưởng viết về nhân vật lịch sử nào, dưới thời vua nào?", "answer": "Kiến trúc sư Vũ Như Tô, thời vua Lê Tương Dực", "explain": "Vở kịch viết về Vũ Như Tô — người kiến trúc sư thiên tài mơ xây Cửu Trùng Đài, dưới thời vua Lê Tương Dực hoang dâm.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ bày tỏ suy nghĩ của em về hành động của nhân vật Đức trong ngữ liệu Đề 2. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Hành động “Tôi nghỉ việc!” của Đức khiến tôi vô cùng khâm phục. Trước sức ép của chủ thầu và nguy cơ mất việc làm, anh vẫn kiên quyết không đánh đổi sinh mạng con người lấy đồng tiền. Đó là biểu hiện cao đẹp của lương tâm nghề nghiệp và trách nhiệm với cộng đồng. Trong cuộc sống hôm nay, không ít người vì lợi ích cá nhân mà làm ngơ trước sai trái, thậm chí tiếp tay cho cái xấu; hành động của Đức như một tấm gương sáng về dũng khí. Tôi hiểu rằng, giữ vững lương tâm đôi khi phải trả giá, nhưng cái giá ấy xứng đáng — vì sự bình yên của bao người và sự thanh thản của chính mình. Đoạn trích nhắc nhở mỗi chúng ta, nhất là thế hệ trẻ mai này bước vào nghề: hãy đặt trách nhiệm với con người lên trên lợi ích vật chất, dám nói không với cái sai, cái xấu."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về lương tâm nghề nghiệp trong cuộc sống hôm nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ hành động của Đức trong ngữ liệu, đặt vấn đề: lương tâm nghề nghiệp. 2. Thân bài: a) Giải thích: lương tâm nghề nghiệp là ý thức trách nhiệm, đạo đức trong công việc. b) Biểu hiện: bác sĩ tận tâm, thầy cô hết lòng, kĩ sư đảm bảo chất lượng, người bán hàng trung thực. c) Ý nghĩa: bảo vệ con người, tạo niềm tin xã hội, nghề nghiệp phát triển bền vững. d) Mặt trái: vô trách nhiệm, gian dối vì lợi ích (công trình kém chất lượng, thực phẩm bẩn, “phong bì”) — phê phán, nêu hậu quả. e) Nguyên nhân và giải pháp: giáo dục đạo đức nghề nghiệp; cơ chế giám sát, xử phạt; mỗi người tự rèn. f) Liên hệ bản thân: học sinh rèn tính trách nhiệm từ việc học. 3. Kết bài: khẳng định lương tâm là “thước đo” giá trị con người; lời kêu gọi."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Xưởng vẽ. Họa sĩ TRUNG đứng trước bức tranh sắp hoàn thành. Bạn thân anh, QUÂN, bước vào.)\nQUÂN: Bức tranh này đẹp lắm! Nhưng triển lãm yêu cầu vẽ theo chủ đề tuyên truyền. Cậu sửa đi, sẽ được giải thưởng lớn.\nTRUNG (lắc đầu): Tớ vẽ bằng cảm xúc thật của mình. Nghệ thuật mà phải uốn theo ý người khác thì còn gì là nghệ thuật!\nQUÂN: Cậu cứng đầu quá! Thời buổi này, nghệ thuật cũng phải biết “linh hoạt” chứ.\nTRUNG: Tớ thà không triển lãm, chứ không đánh mất chính mình.\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Xung đột trong đoạn trích là xung đột giữa những quan niệm nào?", "options": ["A. Giữa hai người bạn", "B. Giữa quan niệm nghệ thuật chân chính (Trung) và quan niệm thực dụng, uốn éo theo thị hiếu (Quân)", "C. Giữa giàu và nghèo", "D. Không có xung đột quan niệm"], "answer": "B", "explain": "Trung: nghệ thuật phải chân thành, không uốn éo; Quân: nghệ thuật phải “linh hoạt” theo yêu cầu để được giải — hai quan niệm đối lập gay gắt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Xưởng vẽ. Họa sĩ TRUNG đứng trước bức tranh sắp hoàn thành. Bạn thân anh, QUÂN, bước vào.)\nQUÂN: Bức tranh này đẹp lắm! Nhưng triển lãm yêu cầu vẽ theo chủ đề tuyên truyền. Cậu sửa đi, sẽ được giải thưởng lớn.\nTRUNG (lắc đầu): Tớ vẽ bằng cảm xúc thật của mình. Nghệ thuật mà phải uốn theo ý người khác thì còn gì là nghệ thuật!\nQUÂN: Cậu cứng đầu quá! Thời buổi này, nghệ thuật cũng phải biết “linh hoạt” chứ.\nTRUNG: Tớ thà không triển lãm, chứ không đánh mất chính mình.\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Câu nói “Tớ thà không triển lãm, chứ không đánh mất chính mình” thể hiện điều gì?", "options": ["A. Sự cố chấp", "B. Khí phách của người nghệ sĩ: dám từ bỏ danh lợi để bảo vệ sự chân thành trong nghệ thuật", "C. Sự sợ hãi", "D. Tính kiêu ngạo"], "answer": "B", "explain": "Dám từ bỏ cơ hội triển lãm, giải thưởng để giữ sự chân thành — đó là khí phách, là lòng tự trọng của người nghệ sĩ chân chính.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Xưởng vẽ. Họa sĩ TRUNG đứng trước bức tranh sắp hoàn thành. Bạn thân anh, QUÂN, bước vào.)\nQUÂN: Bức tranh này đẹp lắm! Nhưng triển lãm yêu cầu vẽ theo chủ đề tuyên truyền. Cậu sửa đi, sẽ được giải thưởng lớn.\nTRUNG (lắc đầu): Tớ vẽ bằng cảm xúc thật của mình. Nghệ thuật mà phải uốn theo ý người khác thì còn gì là nghệ thuật!\nQUÂN: Cậu cứng đầu quá! Thời buổi này, nghệ thuật cũng phải biết “linh hoạt” chứ.\nTRUNG: Tớ thà không triển lãm, chứ không đánh mất chính mình.\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Đoạn trích gợi liên tưởng đến bi kịch nào trong Bài 5?", "options": ["A. Hamlet", "B. Vũ Như Tô trong “Vĩnh biệt cửu trùng đài” — người nghệ sĩ bảo vệ lí tưởng nghệ thuật đến cùng", "C. Không liên quan", "D. Chí Phèo"], "answer": "B", "explain": "Vũ Như Tô cũng từ chối thỏa hiệp, ở lại với Cửu Trùng Đài đến cùng dù phải chết — cùng là bi kịch của người nghệ sĩ bảo vệ lí tưởng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Bi kịch thường có kết thúc bi thảm nhưng có tác dụng thanh lọc tâm hồn người xem.", "b) Nhân vật bi kịch thường có khát vọng, lí tưởng cao đẹp.", "c) Xung đột trong bi kịch luôn có thể điều hòa dễ dàng.", "d) “Vĩnh biệt cửu trùng đài” đặt ra vấn đề: nghệ thuật vì ai, nghệ thuật và cuộc đời."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: đặc điểm nhân vật bi kịch. c) Sai: xung đột bi kịch gay gắt, không thể điều hòa — đó là bản chất của bi kịch. d) Đúng: tư tưởng trung tâm của vở kịch.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên hai nhân vật chính trong đoạn trích “Vĩnh biệt cửu trùng đài” và mối quan hệ của họ.", "answer": "Vũ Như Tô và Đan Thiềm — Đan Thiềm là tri kỉ, người thấu hiểu và cổ vũ Vũ Như Tô", "explain": "Vũ Như Tô: kiến trúc sư thiên tài; Đan Thiềm: cung nữ, tri kỉ duy nhất thấu hiểu, đồng cảm và ở bên ông đến phút cuối trong biển lửa.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày quan niệm của em về mối quan hệ giữa nghệ thuật và cuộc sống (gợi ý từ ngữ liệu Đề 3). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Đoạn trích đặt ra vấn đề muôn thuở: nghệ thuật chân chính là gì? Theo tôi, nghệ thuật đích thực phải bắt nguồn từ cảm xúc chân thành và hướng tới con người, như quan niệm của Trung: “nghệ thuật mà phải uốn theo ý người khác thì còn gì là nghệ thuật”. Nghệ thuật không thể tách rời cuộc sống — nó phải nói lên tiếng nói của con người, vì con người. Tuy nhiên, điều đó không có nghĩa nghệ thuật được phép xa rời thực tế, sống trong tháp ngà; như bi kịch Vũ Như Tô cho thấy, nghệ thuật xây trên đau khổ của nhân dân cũng khó được chấp nhận. Vì vậy, người nghệ sĩ cần giữ vững sự chân thành, đồng thời gắn bó với cuộc đời. Với người thưởng thức, chúng ta hãy trân trọng những tác phẩm chân chính và tỉnh táo trước những sản phẩm “nghệ thuật” chỉ chạy theo thị hiếu tầm thường."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ phân tích bi kịch của nhân vật Vũ Như Tô trong đoạn trích “Vĩnh biệt cửu trùng đài”. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu Nguyễn Huy Tưởng, vở “Vũ Như Tô”, đoạn trích hồi V; vấn đề: bi kịch của người nghệ sĩ thiên tài. 2. Thân bài: a) Vũ Như Tô: kiến trúc sư thiên tài, đam mê nghệ thuật, mơ xây Cửu Trùng Đài thành kì quan — khát vọng cao đẹp. b) Xung đột bi kịch: giữa khát vọng nghệ thuật với hiện thực tàn khốc (hôn quân hoang dâm, dân chúng lầm than, thợ thuyền nổi loạn); giữa người nghệ sĩ với xã hội; xung đột nội tâm (xây đài vì nghệ thuật hay tiếp tay cho hôn quân?). c) Hành động bi kịch: không chạy trốn, ở lại bên công trình, chết trong biển lửa cùng Đan Thiềm — khí phách của người nghệ sĩ. d) Nghệ thuật: xung đột đa tầng, lời thoại triết lí, kết thúc bi thảm mà hào hùng. e) Ý nghĩa: bài học về mối quan hệ nghệ thuật — cuộc đời; sự cảm thông với người nghệ sĩ. 3. Kết bài: khẳng định giá trị vở kịch; suy ngẫm về trách nhiệm của người nghệ sĩ hôm nay."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Sân đình làng. Ông TRƯỞNG họ tộc đang họp bàn với bà con về việc có nên phá ngôi đình cổ để xây nhà văn hóa mới.)\nTRƯỞNG HỌ: Đình đã xuống cấp, sửa tốn kém lắm. Phá đi xây mới cho khang trang!\nCụ TỪ (giọng run run): Đình là hồn làng, là nơi bao thế hệ cúng tế, hội họp. Phá đình là phá đi kí ức của cha ông!\nMột thanh niên: Cháu nghĩ ta có thể vừa trùng tu đình cổ, vừa xây nhà văn hóa ở khu đất mới. Giữ được cả hai!\nCả sân đình ồ lên. Cuộc tranh luận còn tiếp diễn...\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Xung đột trong đoạn trích là xung đột giữa những quan điểm nào?", "options": ["A. Giữa già và trẻ", "B. Giữa quan điểm phá bỏ cái cũ (trưởng họ) và quan điểm giữ gìn di sản (cụ Từ)", "C. Giữa giàu và nghèo", "D. Không có xung đột"], "answer": "B", "explain": "Trưởng họ muốn phá đình cổ xây mới; cụ Từ muốn giữ đình vì đó là “hồn làng”, kí ức cha ông — hai quan điểm đối lập về ứng xử với di sản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Sân đình làng. Ông TRƯỞNG họ tộc đang họp bàn với bà con về việc có nên phá ngôi đình cổ để xây nhà văn hóa mới.)\nTRƯỞNG HỌ: Đình đã xuống cấp, sửa tốn kém lắm. Phá đi xây mới cho khang trang!\nCụ TỪ (giọng run run): Đình là hồn làng, là nơi bao thế hệ cúng tế, hội họp. Phá đình là phá đi kí ức của cha ông!\nMột thanh niên: Cháu nghĩ ta có thể vừa trùng tu đình cổ, vừa xây nhà văn hóa ở khu đất mới. Giữ được cả hai!\nCả sân đình ồ lên. Cuộc tranh luận còn tiếp diễn...\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Ý kiến của người thanh niên có ý nghĩa gì?", "options": ["A. Không có ý nghĩa", "B. Đề xuất giải pháp hài hòa: vừa trùng tu đình cổ vừa xây nhà văn hóa mới — hóa giải xung đột một cách khôn ngoan", "C. Gây thêm mâu thuẫn", "D. Ủng hộ phá đình"], "answer": "B", "explain": "Ý kiến “giữ được cả hai” là giải pháp dung hòa: bảo tồn di sản mà vẫn đáp ứng nhu cầu mới — cách hóa giải xung đột thông minh, tiến bộ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Sân đình làng. Ông TRƯỞNG họ tộc đang họp bàn với bà con về việc có nên phá ngôi đình cổ để xây nhà văn hóa mới.)\nTRƯỞNG HỌ: Đình đã xuống cấp, sửa tốn kém lắm. Phá đi xây mới cho khang trang!\nCụ TỪ (giọng run run): Đình là hồn làng, là nơi bao thế hệ cúng tế, hội họp. Phá đình là phá đi kí ức của cha ông!\nMột thanh niên: Cháu nghĩ ta có thể vừa trùng tu đình cổ, vừa xây nhà văn hóa ở khu đất mới. Giữ được cả hai!\nCả sân đình ồ lên. Cuộc tranh luận còn tiếp diễn...\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Câu nói của cụ Từ (“Đình là hồn làng…”) sử dụng biện pháp nghệ thuật gì?", "options": ["A. So sánh đình với “hồn làng” — ẩn dụ, khẳng định giá trị tinh thần thiêng liêng của di tích", "B. Nhân hóa", "C. Nói quá", "D. Liệt kê"], "answer": "B", "explain": "“Hồn làng” là ẩn dụ: đình không chỉ là công trình vật chất mà là linh hồn, là kí ức tinh thần của cộng đồng — cách nói giàu sức thuyết phục.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Xung đột trong kịch có thể là xung đột quan điểm, lí tưởng giữa các nhân vật.", "b) Trong đoạn trích, người thanh niên đóng vai trò hóa giải xung đột.", "c) Bảo vệ di tích là trách nhiệm của cộng đồng.", "d) Kịch chỉ phản ánh xung đột cá nhân, không phản ánh vấn đề xã hội."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: đề xuất giải pháp dung hòa. c) Đúng. d) Sai: kịch thường phản ánh những vấn đề xã hội sâu sắc (như ứng xử với di sản trong đoạn trích).", "points": 1}, {"type": "short", "level": "NB", "q": "Nguyễn Huy Tưởng nổi tiếng ở những thể loại văn học nào?", "answer": "Tiểu thuyết lịch sử và kịch", "explain": "Nguyễn Huy Tưởng (1912 – 1960) thành công ở tiểu thuyết lịch sử (“Đêm hội Long Trì”) và kịch (“Vũ Như Tô”, “Bắc Sơn”) — kịch của ông giàu tính triết lí.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ trình bày ý kiến của em về việc ứng xử với di tích lịch sử (gợi ý từ ngữ liệu Đề 4). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Đoạn trích đặt ra vấn đề thời sự: ứng xử thế nào với di tích lịch sử khi nhu cầu phát triển ngày càng lớn? Tôi đồng tình với ý kiến của người thanh niên: vừa trùng tu, bảo vệ di tích vừa xây dựng mới ở vị trí phù hợp — “giữ được cả hai”. Di tích như ngôi đình cổ không chỉ là gạch ngói mà là “hồn làng”, là kí ức của bao thế hệ, là bản sắc văn hóa; phá bỏ nó là đánh mất cội nguồn. Nhưng giữ gìn không có nghĩa là đóng băng quá khứ, từ chối phát triển. Cách làm khôn ngoan là bảo tồn có chọn lọc, trùng tu khoa học, đồng thời phát triển hạ tầng mới đáp ứng đời sống hiện đại. Mỗi chúng ta hãy nâng cao ý thức: không xâm hại di tích, tích cực tham gia bảo vệ, và lan tỏa tình yêu di sản đến mọi người — vì giữ gìn quá khứ chính là cách tốt nhất để bước vào tương lai."}, {"type": "essay", "level": "VDC", "q": "Viết bài báo cáo nghiên cứu (dạng rút gọn) khoảng 600 chữ về thực trạng bảo vệ di tích lịch sử ở địa phương em. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT (báo cáo nghiên cứu rút gọn): 1. Mở đầu: lí do chọn đề tài (di tích là hồn quê, nhiều nơi xuống cấp); mục đích (đánh giá thực trạng, đề xuất giải pháp); phạm vi (một số di tích ở địa phương). 2. Nội dung: a) Thực trạng: di tích được bảo vệ tốt (ví dụ) và di tích xuống cấp, bị xâm hại (ví dụ); số liệu, hình ảnh minh họa (nếu khảo sát được). b) Nguyên nhân: thiếu kinh phí, ý thức người dân, quản lí lỏng lẻo. c) Đánh giá: mặt tích cực và hạn chế. d) Giải pháp, kiến nghị: với chính quyền (kinh phí, quy hoạch), với cộng đồng (nâng cao ý thức, mô hình “dân giữ di tích”), với nhà trường (giáo dục di sản). 3. Kết luận: khẳng định giá trị di tích; kêu gọi chung tay bảo vệ. (Lưu ý: số liệu trong báo cáo cần xác thực từ khảo sát, tài liệu địa phương.)"}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Phòng họp. Giám đốc CÔNG đang chất vấn nhân viên LAN về một sai phạm.)\nCÔNG (đập bàn): Cô có biết sai phạm này gây thiệt hại bao nhiêu không? Cô định chịu trách nhiệm thế nào?\nLAN (bình tĩnh): Thưa anh, tôi nhận lỗi về mình. Nhưng xin anh cho tôi được giải thích: sai phạm xảy ra do quy trình có lỗ hổng, không chỉ lỗi cá nhân tôi.\nCÔNG (ngạc nhiên, giọng dịu xuống): Cô nói rõ hơn xem nào...\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Thái độ của Lan khi bị chất vấn thể hiện điều gì?", "options": ["A. Sợ hãi, chối tội", "B. Bình tĩnh, dám nhận lỗi và dám nói lên sự thật một cách thẳng thắn", "C. Thờ ơ", "D. Tức giận, cãi lại"], "answer": "B", "explain": "Lan “bình tĩnh”, “nhận lỗi về mình” nhưng cũng “xin được giải thích” — thái độ dũng cảm, trung thực, có trách nhiệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Phòng họp. Giám đốc CÔNG đang chất vấn nhân viên LAN về một sai phạm.)\nCÔNG (đập bàn): Cô có biết sai phạm này gây thiệt hại bao nhiêu không? Cô định chịu trách nhiệm thế nào?\nLAN (bình tĩnh): Thưa anh, tôi nhận lỗi về mình. Nhưng xin anh cho tôi được giải thích: sai phạm xảy ra do quy trình có lỗ hổng, không chỉ lỗi cá nhân tôi.\nCÔNG (ngạc nhiên, giọng dịu xuống): Cô nói rõ hơn xem nào...\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Chi tiết “giọng dịu xuống” của Công cho thấy điều gì?", "options": ["A. Công mệt", "B. Thái độ bình tĩnh, thẳng thắn của Lan đã làm thay đổi không khí đối thoại — sự thật và lẽ phải có sức thuyết phục", "C. Công bỏ qua", "D. Không cho thấy gì"], "answer": "B", "explain": "Từ “đập bàn” quát tháo sang “giọng dịu xuống” muốn nghe giải thích — diễn biến cho thấy sức mạnh của thái độ đúng đắn, của sự thật.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Phòng họp. Giám đốc CÔNG đang chất vấn nhân viên LAN về một sai phạm.)\nCÔNG (đập bàn): Cô có biết sai phạm này gây thiệt hại bao nhiêu không? Cô định chịu trách nhiệm thế nào?\nLAN (bình tĩnh): Thưa anh, tôi nhận lỗi về mình. Nhưng xin anh cho tôi được giải thích: sai phạm xảy ra do quy trình có lỗ hổng, không chỉ lỗi cá nhân tôi.\nCÔNG (ngạc nhiên, giọng dịu xuống): Cô nói rõ hơn xem nào...\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Xung đột trong đoạn trích được hóa giải theo cách nào?", "options": ["A. Bằng bạo lực", "B. Bằng đối thoại thẳng thắn, bình tĩnh — mâu thuẫn được làm sáng tỏ thay vì bị dồn nén", "C. Bằng cách bỏ trốn", "D. Không được hóa giải"], "answer": "B", "explain": "Khác với bi kịch (xung đột không thể điều hòa), ở đây mâu thuẫn được hóa giải bằng đối thoại chân thành — cho thấy sức mạnh của giao tiếp văn minh.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Khác với bi kịch, không phải mọi xung đột trong kịch đều dẫn đến kết thúc bi thảm.", "b) Đối thoại thẳng thắn, bình tĩnh có thể hóa giải mâu thuẫn.", "c) Dám nhận lỗi là biểu hiện của lòng dũng cảm và trách nhiệm.", "d) Trong “Hamlet”, xung đột nội tâm của Hamlet đã được hóa giải dễ dàng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: có hài kịch, chính kịch với kết thúc khác nhau. b) Đúng: bài học từ đoạn trích. c) Đúng. d) Sai: xung đột nội tâm của Hamlet gay gắt, giằng xé đến cùng và dẫn đến kết thúc bi thảm.", "points": 1}, {"type": "short", "level": "TH", "q": "Kể tên ba vở bi kịch nổi tiếng của Shakespeare.", "answer": "“Hamlet”, “Othello”, “Vua Lear” (hoặc: “Macbeth”, “Romeo và Juliet”)", "explain": "Shakespeare để lại nhiều bi kịch bất hủ: “Hamlet”, “Othello”, “Vua Lear”, “Macbeth”, “Romeo và Juliet”...", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ về nghệ thuật ứng xử khi mắc lỗi (gợi ý từ ngữ liệu Đề 5). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Ai cũng có lúc mắc lỗi, nhưng cách ứng xử khi mắc lỗi mới thể hiện nhân cách con người. Nhân vật Lan trong đoạn trích là tấm gương đẹp: bình tĩnh nhận lỗi về mình, đồng thời thẳng thắn giải thích nguyên nhân để cùng tìm giải pháp. Thái độ ấy vừa có trách nhiệm vừa có dũng khí — không đổ lỗi, không quanh co. Trong cuộc sống, nhiều người khi mắc lỗi thường chối bay, đổ lỗi cho người khác, khiến mâu thuẫn thêm trầm trọng; có người lại sợ hãi, im lặng chịu đựng. Cả hai thái độ đều sai. Cách ứng xử đúng đắn là: dũng cảm nhận lỗi, chân thành xin lỗi, phân tích nguyên nhân khách quan và đề xuất cách khắc phục. Người biết nhận lỗi không bị coi thường mà ngược lại, được tôn trọng vì sự trung thực. Hãy nhớ: “nhân vô thập toàn” — điều quan trọng không phải là không bao giờ sai, mà là biết sửa sai và trưởng thành từ sai lầm."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về văn hóa tranh luận trong đời sống. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ cuộc đối thoại trong ngữ liệu, đặt vấn đề: tranh luận văn minh là kĩ năng cần thiết. 2. Thân bài: a) Giải thích: tranh luận là bày tỏ, bảo vệ quan điểm trước ý kiến khác; văn hóa tranh luận là tranh luận tôn trọng, có lí lẽ. b) Biểu hiện: lắng nghe, tôn trọng đối phương; dùng lí lẽ, dẫn chứng thay vì công kích cá nhân; biết tiếp thu ý đúng. c) Ý nghĩa: tìm ra chân lí, giải pháp tốt; rèn tư duy phản biện; giữ hòa khí. d) Thực trạng đáng buồn: tranh cãi bằng cảm xúc, “ném đá”, bạo lực mạng — phê phán. e) Cách rèn luyện: học cách lắng nghe, kiềm chế cảm xúc, chuẩn bị lí lẽ; thực hành trong thảo luận nhóm, diễn đàn. f) Liên hệ bản thân. 3. Kết bài: khẳng định “tranh luận để hiểu nhau hơn, không phải để thắng thua”; lời nhắn nhủ."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNgười ta kể rằng, có một vị quan thanh liêm nổi tiếng. Khi về hưu, ông chỉ mang theo vài bộ quần áo cũ và mấy cuốn sách. Kẻ xấu đến dụ dỗ: “Quan lớn một thời, sao không vơ vét chút ít để dưỡng già?” Ông cười: “Ta nghèo tiền bạc nhưng giàu thanh danh. Kẻ tham thì giàu mà nhục, ta nghèo mà vinh.” Cả đời ông sống thanh bạch, được dân yêu mến, sử sách lưu danh. (Ngữ liệu minh họa — tự soạn) Câu nói của vị quan thể hiện quan niệm sống nào?", "options": ["A. Coi trọng tiền bạc", "B. Coi trọng thanh danh, phẩm giá hơn tiền bạc: “nghèo mà vinh” hơn “giàu mà nhục”", "C. Thích nghèo khổ", "D. Khinh người giàu"], "answer": "B", "explain": "“Ta nghèo tiền bạc nhưng giàu thanh danh. Kẻ tham thì giàu mà nhục, ta nghèo mà vinh” — quan niệm đặt phẩm giá lên trên vật chất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNgười ta kể rằng, có một vị quan thanh liêm nổi tiếng. Khi về hưu, ông chỉ mang theo vài bộ quần áo cũ và mấy cuốn sách. Kẻ xấu đến dụ dỗ: “Quan lớn một thời, sao không vơ vét chút ít để dưỡng già?” Ông cười: “Ta nghèo tiền bạc nhưng giàu thanh danh. Kẻ tham thì giàu mà nhục, ta nghèo mà vinh.” Cả đời ông sống thanh bạch, được dân yêu mến, sử sách lưu danh. (Ngữ liệu minh họa — tự soạn) Biện pháp nghệ thuật trong câu “Kẻ tham thì giàu mà nhục, ta nghèo mà vinh” là gì?", "options": ["A. So sánh", "B. Đối lập (giữa giàu mà nhục với nghèo mà vinh) để khẳng định giá trị của sự thanh liêm", "C. Nhân hóa", "D. Liệt kê"], "answer": "B", "explain": "Cặp đối lập “giàu mà nhục — nghèo mà vinh” tạo sự tương phản mạnh mẽ, khẳng định: giá trị con người không ở tiền bạc mà ở phẩm giá.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNgười ta kể rằng, có một vị quan thanh liêm nổi tiếng. Khi về hưu, ông chỉ mang theo vài bộ quần áo cũ và mấy cuốn sách. Kẻ xấu đến dụ dỗ: “Quan lớn một thời, sao không vơ vét chút ít để dưỡng già?” Ông cười: “Ta nghèo tiền bạc nhưng giàu thanh danh. Kẻ tham thì giàu mà nhục, ta nghèo mà vinh.” Cả đời ông sống thanh bạch, được dân yêu mến, sử sách lưu danh. (Ngữ liệu minh họa — tự soạn) Hình ảnh vị quan thanh liêm gợi liên tưởng đến phẩm chất nào của người nghệ sĩ chân chính trong Bài 5?", "options": ["A. Không liên quan", "B. Cùng dám từ bỏ lợi ích vật chất để bảo vệ giá trị tinh thần (thanh danh, nghệ thuật chân chính)", "C. Cùng giàu có", "D. Cùng làm quan"], "answer": "B", "explain": "Vị quan từ chối “vơ vét”, Vũ Như Tô từ chối thỏa hiệp nghệ thuật — cùng là những con người dám đặt giá trị tinh thần lên trên lợi ích vật chất.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Đối lập là biện pháp đặt hai sự vật, hiện tượng trái ngược nhau để làm nổi bật.", "b) Người có khí phách là người dám bảo vệ lẽ phải, không khuất phục trước cám dỗ.", "c) Trong xã hội hiện nay, sự thanh liêm không còn giá trị.", "d) “Vũ Như Tô” thà chết chứ không từ bỏ Cửu Trùng Đài — đó cũng là khí phách."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: thanh liêm, chính trực luôn là giá trị được tôn vinh, nhất là trong cuộc đấu tranh chống tham nhũng hôm nay. d) Đúng.", "points": 1}, {"type": "short", "level": "NB", "q": "Vở kịch “Vũ Như Tô” được Nguyễn Huy Tưởng sáng tác năm nào?", "answer": "Năm 1941", "explain": "“Vũ Như Tô” sáng tác năm 1941 — vở bi kịch lịch sử xuất sắc về người nghệ sĩ thiên tài và mối quan hệ giữa nghệ thuật với cuộc đời.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về sự thanh liêm trong cuộc sống hôm nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Câu chuyện vị quan thanh liêm nhắc nhở chúng ta về giá trị của sự chính trực trong cuộc sống hôm nay. Thanh liêm là sống trong sạch, không tham ô, không vụ lợi — phẩm chất vô cùng quý giá, nhất là đối với cán bộ, công chức. Thực tế, Đảng và Nhà nước ta đang quyết liệt đấu tranh chống tham nhũng, và nhiều cán bộ thanh liêm đã trở thành tấm gương sáng. Ngược lại, những kẻ tham nhũng dù giàu sang cũng “giàu mà nhục”, bị pháp luật trừng trị và người đời khinh bỉ. Với học sinh chúng ta, rèn tính thanh liêm bắt đầu từ việc nhỏ: trung thực trong thi cử, không gian lận, không vụ lợi cá nhân. Hãy nhớ lời vị quan xưa: “nghèo mà vinh” hơn “giàu mà nhục” — giữ được phẩm giá trong sạch chính là tài sản lớn nhất của mỗi con người."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về đấu tranh chống tham nhũng, tiêu cực trong xã hội hiện nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ câu chuyện vị quan thanh liêm, đặt vấn đề: tham nhũng là “giặc nội xâm”, cần đấu tranh quyết liệt. 2. Thân bài: a) Giải thích: tham nhũng là lợi dụng chức vụ để vụ lợi. b) Biểu hiện: tham ô, nhận hối lộ, “lợi ích nhóm”, chạy chức chạy quyền. c) Tác hại: thất thoát tài sản quốc gia, xói mòn niềm tin, cản trở phát triển, bất công xã hội. d) Nguyên nhân: suy thoái đạo đức, cơ chế kiểm soát lỏng lẻo. e) Giải pháp: hoàn thiện pháp luật, xử lí nghiêm không vùng cấm; công khai, minh bạch; giáo dục đạo đức; phát huy vai trò giám sát của nhân dân, báo chí. f) Liên hệ: học sinh rèn tính trung thực, liêm khiết từ hôm nay. 3. Kết bài: khẳng định quyết tâm chống tham nhũng; niềm tin vào sự trong sạch của xã hội."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Nghĩa trang liệt sĩ. CHIẾN, cựu chiến binh già, thắp hương trước mộ đồng đội.)\nCHIẾN (nghẹn ngào): Đồng đội ơi, hòa bình đã về rồi! Các anh nằm đây, tôi về già vẫn day dứt một điều: giá như ngày ấy tôi nhanh hơn một bước...\n(Tiếng gió thổi. CHIẾN lặng đi, mắt nhìn xa xăm.)\nCHIẾN (tiếp): Nhưng tôi biết, các anh không trách tôi. Các anh chỉ mong thế hệ sau sống xứng đáng với sự hi sinh này. Tôi hứa!\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Hình thức lời thoại chính của nhân vật Chiến là gì?", "options": ["A. Đối thoại", "B. Độc thoại (nói một mình trước mộ đồng đội, bộc lộ nỗi niềm)", "C. Lời kể", "D. Bài hát"], "answer": "B", "explain": "Chiến nói một mình trước mộ đồng đội, bộc lộ nỗi day dứt và lời hứa — đó là độc thoại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Nghĩa trang liệt sĩ. CHIẾN, cựu chiến binh già, thắp hương trước mộ đồng đội.)\nCHIẾN (nghẹn ngào): Đồng đội ơi, hòa bình đã về rồi! Các anh nằm đây, tôi về già vẫn day dứt một điều: giá như ngày ấy tôi nhanh hơn một bước...\n(Tiếng gió thổi. CHIẾN lặng đi, mắt nhìn xa xăm.)\nCHIẾN (tiếp): Nhưng tôi biết, các anh không trách tôi. Các anh chỉ mong thế hệ sau sống xứng đáng với sự hi sinh này. Tôi hứa!\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Nỗi day dứt của Chiến (“giá như ngày ấy tôi nhanh hơn một bước”) thể hiện điều gì?", "options": ["A. Sự hèn nhát", "B. Tình đồng đội sâu nặng và nỗi đau của người ở lại — day dứt vì không cứu được đồng đội", "C. Sự hối hận vì đi bộ đội", "D. Tính hay than vãn"], "answer": "B", "explain": "Nỗi day dứt của người lính già trước mộ đồng đội là biểu hiện của tình đồng chí thiêng liêng và nỗi đau đáu của người ở lại.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Nghĩa trang liệt sĩ. CHIẾN, cựu chiến binh già, thắp hương trước mộ đồng đội.)\nCHIẾN (nghẹn ngào): Đồng đội ơi, hòa bình đã về rồi! Các anh nằm đây, tôi về già vẫn day dứt một điều: giá như ngày ấy tôi nhanh hơn một bước...\n(Tiếng gió thổi. CHIẾN lặng đi, mắt nhìn xa xăm.)\nCHIẾN (tiếp): Nhưng tôi biết, các anh không trách tôi. Các anh chỉ mong thế hệ sau sống xứng đáng với sự hi sinh này. Tôi hứa!\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Lời hứa cuối (“Tôi hứa!”) có ý nghĩa gì?", "options": ["A. Hứa suông", "B. Chuyển từ nỗi đau quá khứ sang trách nhiệm với tương lai: sống xứng đáng với sự hi sinh của thế hệ trước — thông điệp của đoạn trích", "C. Kết thúc vở kịch", "D. Không có ý nghĩa"], "answer": "B", "explain": "Lời hứa ngắn gọn mà đanh thép: biến nỗi day dứt thành hành động, thành trách nhiệm “sống xứng đáng” — đó là thông điệp sâu sắc nhất.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Độc thoại trong kịch có vai trò bộc lộ nội tâm nhân vật.", "b) Chỉ dẫn sân khấu (“Tiếng gió thổi”, “mắt nhìn xa xăm”) góp phần tạo không khí.", "c) Tình đồng đội là một trong những tình cảm cao đẹp của người lính.", "d) Thế hệ trẻ hôm nay không cần nhớ đến sự hi sinh của cha anh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: chỉ dẫn sân khấu hỗ trợ diễn xuất, tạo không khí trang nghiêm, xúc động. c) Đúng. d) Sai: “uống nước nhớ nguồn”, sống xứng đáng với hi sinh của cha anh là đạo lí và trách nhiệm.", "points": 1}, {"type": "short", "level": "NB", "q": "Shakespeare được mệnh danh là gì?", "answer": "“Thi sĩ của mọi thời đại” (nhà viết kịch vĩ đại nhất của nước Anh và nhân loại)", "explain": "William Shakespeare (1564 – 1616) được mệnh danh là “thi sĩ của mọi thời đại”, tác giả của 37 vở kịch bất hủ.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ bày tỏ lòng biết ơn với các anh hùng liệt sĩ (gợi ý từ ngữ liệu Đề 7). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Đọc đoạn độc thoại của người cựu chiến binh già trước mộ đồng đội, lòng tôi nghẹn ngào xúc động. Các anh hùng liệt sĩ đã ngã xuống để đất nước được hòa bình, để chúng ta được sống trong độc lập, tự do. Sự hi sinh ấy là vô giá, không gì đền đáp được. Nỗi day dứt của người ở lại càng cho thấy sự mất mát lớn lao của chiến tranh. Là thế hệ trẻ được hưởng hòa bình, chúng ta phải khắc ghi công ơn ấy bằng hành động cụ thể: học tập tốt, rèn luyện đạo đức, sống có trách nhiệm; thăm viếng, chăm sóc nghĩa trang liệt sĩ, giúp đỡ gia đình thương binh; và đặc biệt là “sống xứng đáng với sự hi sinh này” như lời hứa của nhân vật Chiến. Đừng để sự hi sinh của cha anh trở nên vô nghĩa — hãy biến lòng biết ơn thành động lực xây dựng đất nước giàu mạnh, bảo vệ vững chắc nền hòa bình mà các anh đã đổi bằng máu xương."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về đạo lí “Uống nước nhớ nguồn” của dân tộc ta. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giải thích “Uống nước nhớ nguồn” — đặt vấn đề: truyền thống biết ơn là đạo lí cao quý. 2. Thân bài: a) Giải thích: nhớ đến cội nguồn, biết ơn người đã tạo ra thành quả. b) Biểu hiện: thờ cúng tổ tiên, giỗ Tổ Hùng Vương; đền ơn đáp nghĩa liệt sĩ, thương binh; biết ơn cha mẹ, thầy cô; trân trọng người lao động. c) Ý nghĩa: gắn kết cộng đồng, tạo sức mạnh dân tộc; nuôi dưỡng nhân cách; người biết ơn được tôn trọng. d) Thực trạng: một bộ phận vô ơn, thờ ơ — phê phán. e) Cách giữ gìn: giáo dục từ gia đình, nhà trường; hành động cụ thể (thăm viếng nghĩa trang, giúp đỡ gia đình chính sách, học tập tốt). f) Liên hệ bản thân. 3. Kết bài: khẳng định đây là truyền thống quý báu; lời nhắn nhủ."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Lớp học. Cô giáo CHỦ NHIỆM đang nói chuyện với học sinh NAM vừa bị phát hiện quay cóp.)\nCÔ: Em có biết vì sao cô buồn không? Không phải vì điểm số, mà vì em đã đánh mất lòng trung thực của mình.\nNAM (cúi đầu): Em xin lỗi cô. Em sợ điểm kém, sợ bố mẹ mắng...\nCÔ (nhẹ nhàng): Cô hiểu. Nhưng điểm kém có thể sửa, còn lòng trung thực một khi đánh mất thì khó lấy lại. Cô tin em sẽ sửa sai.\nNAM (ngẩng lên, mắt sáng): Em hứa sẽ không bao giờ gian lận nữa!\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Xung đột trong đoạn trích được hóa giải nhờ điều gì?", "options": ["A. Sự trừng phạt nghiêm khắc", "B. Sự bao dung, thấu hiểu và niềm tin của cô giáo đã cảm hóa học sinh", "C. Bỏ qua lỗi lầm", "D. Đuổi học"], "answer": "B", "explain": "Cô không quát mắng mà thấu hiểu (“cô hiểu”), phân tích (“điểm kém có thể sửa…”) và tin tưởng (“cô tin em sẽ sửa sai”) — sự bao dung đã cảm hóa Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Lớp học. Cô giáo CHỦ NHIỆM đang nói chuyện với học sinh NAM vừa bị phát hiện quay cóp.)\nCÔ: Em có biết vì sao cô buồn không? Không phải vì điểm số, mà vì em đã đánh mất lòng trung thực của mình.\nNAM (cúi đầu): Em xin lỗi cô. Em sợ điểm kém, sợ bố mẹ mắng...\nCÔ (nhẹ nhàng): Cô hiểu. Nhưng điểm kém có thể sửa, còn lòng trung thực một khi đánh mất thì khó lấy lại. Cô tin em sẽ sửa sai.\nNAM (ngẩng lên, mắt sáng): Em hứa sẽ không bao giờ gian lận nữa!\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Câu nói của cô (“điểm kém có thể sửa, còn lòng trung thực một khi đánh mất thì khó lấy lại”) là bài học gì?", "options": ["A. Coi thường điểm số", "B. Bài học về giá trị của lòng trung thực: điểm số có thể cải thiện, nhưng nhân cách một khi hoen ố khó lấy lại", "C. Khuyên bỏ học", "D. Không có bài học"], "answer": "B", "explain": "Câu nói đặt lên bàn cân: điểm số (có thể sửa) và lòng trung thực (khó lấy lại) — khẳng định nhân cách quý hơn điểm số.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Lớp học. Cô giáo CHỦ NHIỆM đang nói chuyện với học sinh NAM vừa bị phát hiện quay cóp.)\nCÔ: Em có biết vì sao cô buồn không? Không phải vì điểm số, mà vì em đã đánh mất lòng trung thực của mình.\nNAM (cúi đầu): Em xin lỗi cô. Em sợ điểm kém, sợ bố mẹ mắng...\nCÔ (nhẹ nhàng): Cô hiểu. Nhưng điểm kém có thể sửa, còn lòng trung thực một khi đánh mất thì khó lấy lại. Cô tin em sẽ sửa sai.\nNAM (ngẩng lên, mắt sáng): Em hứa sẽ không bao giờ gian lận nữa!\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Diễn biến tâm lí của Nam qua đoạn trích thể hiện nghệ thuật xây dựng nhân vật nào trong kịch?", "options": ["A. Nhân vật đơn điệu", "B. Nhân vật có sự chuyển biến: từ sợ hãi, cúi đầu đến ngẩng lên, mắt sáng, hứa sửa sai — bộc lộ qua lời thoại và hành động sân khấu", "C. Nhân vật không thay đổi", "D. Không có nghệ thuật"], "answer": "B", "explain": "Từ “cúi đầu” sợ hãi đến “ngẩng lên, mắt sáng” quyết tâm — sự chuyển biến tâm lí được thể hiện qua lời thoại và chỉ dẫn sân khấu, đúng cách xây dựng nhân vật trong kịch.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Trong kịch, sự chuyển biến tâm lí nhân vật thường bộc lộ qua lời thoại và hành động.", "b) Giáo dục bằng sự bao dung, thấu hiểu có sức cảm hóa mạnh mẽ.", "c) Gian lận trong thi cử là biểu hiện của sự thiếu trung thực.", "d) Điểm số quan trọng hơn nhân cách con người."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: bài học từ cách ứng xử của cô giáo. c) Đúng. d) Sai: nhân cách, lòng trung thực quý hơn điểm số — đó chính là thông điệp của đoạn trích.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong bi kịch, tính cách nhân vật được bộc lộ chủ yếu qua những yếu tố nào?", "answer": "Qua lời thoại và hành động (và xung đột)", "explain": "Khác với truyện (có lời kể), trong kịch tính cách nhân vật bộc lộ qua lời thoại (đối thoại, độc thoại), hành động sân khấu và sự tham gia vào xung đột.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ về vai trò của sự bao dung trong giáo dục (gợi ý từ ngữ liệu Đề 8). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Cách ứng xử của cô giáo trong đoạn trích là bài học đẹp về sự bao dung trong giáo dục. Thay vì quát mắng, trừng phạt nặng nề khi phát hiện học sinh quay cóp, cô đã thấu hiểu nguyên nhân (“cô hiểu”), phân tích nhẹ nhàng và đặt niềm tin (“cô tin em sẽ sửa sai”). Chính sự bao dung ấy đã cảm hóa Nam, biến sợ hãi thành quyết tâm sửa chữa. Trong giáo dục, trừng phạt có thể khiến học sinh sợ mà không phục, thậm chí trở nên lì lợm, chống đối; còn bao dung, thấu hiểu sẽ chạm đến trái tim, giúp các em tự nhận ra lỗi lầm và muốn thay đổi. Dĩ nhiên, bao dung không có nghĩa là dung túng, bỏ qua — mà là nghiêm khắc một cách nhân ái. Mỗi thầy cô hãy là người “trồng người” bằng cả trí tuệ và tình thương; mỗi học sinh khi được bao dung cũng hãy biết trân trọng mà sửa mình, để không phụ lòng tin của thầy cô."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về vai trò của người thầy trong việc hình thành nhân cách học sinh. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ hình ảnh cô giáo trong ngữ liệu, đặt vấn đề: người thầy có vai trò to lớn trong việc hình thành nhân cách học sinh. 2. Thân bài: a) Vai trò: không chỉ truyền tri thức mà còn dạy làm người; là tấm gương đạo đức; là người cảm hóa, định hướng khi học sinh lầm lỗi. b) Dẫn chứng: những thầy cô tận tụy, bao dung; câu chuyện cảm động về tình thầy trò. c) Ý nghĩa: học sinh có nhân cách tốt sẽ thành công dân tốt; “trồng người” là sự nghiệp cao quý. d) Thực trạng đáng buồn: một số thầy cô thiếu tâm huyết, thậm chí vi phạm đạo đức — phê phán. e) Giải pháp: nâng cao chất lượng đào tạo sư phạm; xã hội tôn vinh nghề giáo; mỗi thầy cô tự rèn đức, rèn tài. f) Liên hệ: em sẽ làm gì để xứng đáng với công ơn thầy cô. 3. Kết bài: khẳng định “nhất tự vi sư, bán tự vi sư”; lời tri ân."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBi kịch không chỉ có trên sân khấu. Trong cuộc sống, cũng có những “bi kịch” thầm lặng: người tốt bị hiểu lầm, kẻ ngay thẳng bị vùi dập, ước mơ đẹp bị thực tế phũ phàng chà đạp. Nhưng khác với nhân vật bi kịch trên sân khấu thường phải chết, con người trong đời thực có thể chọn cách đứng dậy. Lịch sử đã chứng minh: biết bao con người bị oan khuất đã được minh oan; biết bao ước mơ tưởng chừng tan vỡ đã thành hiện thực nhờ kiên trì. Vì vậy, khi gặp bi kịch trong đời, đừng tuyệt vọng. Hãy học nhân vật bi kịch ở lòng dũng cảm, nhưng đừng học họ ở sự buông xuôi. Cuộc đời vẫn cho ta cơ hội thứ hai — nếu ta đủ bản lĩnh để nắm lấy. (Ngữ liệu nghị luận — tự soạn) Theo ngữ liệu, điểm khác nhau cơ bản giữa bi kịch sân khấu và “bi kịch” đời thực là gì?", "options": ["A. Không có điểm khác", "B. Nhân vật sân khấu thường phải chết; con người đời thực có thể đứng dậy, làm lại từ đầu", "C. Đời thực không có bi kịch", "D. Sân khấu vui hơn"], "answer": "B", "explain": "Ngữ liệu nêu rõ: nhân vật bi kịch “thường phải chết”, còn “con người trong đời thực có thể chọn cách đứng dậy” — đó là điểm khác cơ bản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBi kịch không chỉ có trên sân khấu. Trong cuộc sống, cũng có những “bi kịch” thầm lặng: người tốt bị hiểu lầm, kẻ ngay thẳng bị vùi dập, ước mơ đẹp bị thực tế phũ phàng chà đạp. Nhưng khác với nhân vật bi kịch trên sân khấu thường phải chết, con người trong đời thực có thể chọn cách đứng dậy. Lịch sử đã chứng minh: biết bao con người bị oan khuất đã được minh oan; biết bao ước mơ tưởng chừng tan vỡ đã thành hiện thực nhờ kiên trì. Vì vậy, khi gặp bi kịch trong đời, đừng tuyệt vọng. Hãy học nhân vật bi kịch ở lòng dũng cảm, nhưng đừng học họ ở sự buông xuôi. Cuộc đời vẫn cho ta cơ hội thứ hai — nếu ta đủ bản lĩnh để nắm lấy. (Ngữ liệu nghị luận — tự soạn) Lời khuyên “hãy học nhân vật bi kịch ở lòng dũng cảm, nhưng đừng học họ ở sự buông xuôi” có ý nghĩa gì?", "options": ["A. Khuyên bắt chước hoàn toàn", "B. Khuyên học cái hay (dũng cảm) và tránh cái dở (buông xuôi, tuyệt vọng) — thái độ đúng đắn khi tiếp nhận văn học", "C. Chê bai nhân vật", "D. Không có ý nghĩa"], "answer": "B", "explain": "Đây là cách tiếp nhận văn học đúng đắn: học phẩm chất tốt đẹp, đồng thời tỉnh táo không lặp lại bi kịch — biến bài học văn học thành bản lĩnh sống.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBi kịch không chỉ có trên sân khấu. Trong cuộc sống, cũng có những “bi kịch” thầm lặng: người tốt bị hiểu lầm, kẻ ngay thẳng bị vùi dập, ước mơ đẹp bị thực tế phũ phàng chà đạp. Nhưng khác với nhân vật bi kịch trên sân khấu thường phải chết, con người trong đời thực có thể chọn cách đứng dậy. Lịch sử đã chứng minh: biết bao con người bị oan khuất đã được minh oan; biết bao ước mơ tưởng chừng tan vỡ đã thành hiện thực nhờ kiên trì. Vì vậy, khi gặp bi kịch trong đời, đừng tuyệt vọng. Hãy học nhân vật bi kịch ở lòng dũng cảm, nhưng đừng học họ ở sự buông xuôi. Cuộc đời vẫn cho ta cơ hội thứ hai — nếu ta đủ bản lĩnh để nắm lấy. (Ngữ liệu nghị luận — tự soạn) Câu “Cuộc đời vẫn cho ta cơ hội thứ hai — nếu ta đủ bản lĩnh để nắm lấy” thể hiện tư tưởng gì?", "options": ["A. Bi quan", "B. Lạc quan, nhân văn: tin vào khả năng vươn lên của con người; cơ hội luôn dành cho người bản lĩnh", "C. Thờ ơ", "D. Đầu hàng số phận"], "answer": "B", "explain": "Tư tưởng lạc quan, nhân văn: không có thất bại vĩnh viễn với người bản lĩnh — cuộc đời luôn mở ra cơ hội mới.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Văn học có thể mang lại bài học cho cuộc sống thực tế.", "b) Học văn học là học cách sống, cách làm người.", "c) Khi gặp khó khăn, nên tuyệt vọng, buông xuôi như nhân vật bi kịch.", "d) Bản lĩnh giúp con người vượt qua bi kịch đời thực."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: mục đích cao nhất của việc học văn. c) Sai: phải học lòng dũng cảm chứ không học sự buông xuôi — như ngữ liệu đã phân tích. d) Đúng.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu tên thể loại kịch có kết thúc bi thảm và thể loại kịch có tính chất gây cười.", "answer": "Bi kịch (kết thúc bi thảm) và hài kịch (gây cười)", "explain": "Bi kịch: xung đột gay gắt, kết thúc bi thảm; hài kịch: dùng tiếng cười để phê phán cái xấu, cái lố bịch. Ngoài ra còn có chính kịch.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ về bản lĩnh sống của tuổi trẻ trước khó khăn (gợi ý từ ngữ liệu Đề 9). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Cuộc đời không phải lúc nào cũng bằng phẳng, và tuổi trẻ chúng ta ai cũng sẽ có lúc gặp “bi kịch” của riêng mình: thi trượt, bị hiểu lầm, ước mơ tan vỡ. Điều quan trọng không phải là ta vấp ngã bao nhiêu lần, mà là ta có đủ bản lĩnh để đứng dậy hay không. Bản lĩnh là dám đối mặt với sự thật, không đổ lỗi, không tuyệt vọng; là kiên trì tìm giải pháp thay vì buông xuôi. Nhìn quanh ta, biết bao tấm gương đã đứng dậy từ thất bại: người nghèo vượt khó học giỏi, vận động viên khuyết tật chinh phục đỉnh cao. Họ chứng minh: “cuộc đời vẫn cho ta cơ hội thứ hai — nếu ta đủ bản lĩnh để nắm lấy”. Vì vậy, mỗi bạn trẻ hãy rèn cho mình một tinh thần thép: vấp ngã ở đâu, đứng dậy ở đó. Khó khăn chỉ là phép thử, và người bản lĩnh sẽ biến phép thử thành bệ phóng vươn tới thành công."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về ý nghĩa của thất bại trong cuộc sống. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: dẫn từ ngữ liệu về “bi kịch đời thực” — đặt vấn đề: thất bại có ý nghĩa gì. 2. Thân bài: a) Giải thích: thất bại là không đạt được mục tiêu mong muốn. b) Ý nghĩa tích cực: là bài học kinh nghiệm (“thất bại là mẹ thành công”); rèn bản lĩnh, ý chí; giúp ta hiểu mình, trưởng thành; nhiều thành công lớn đều trải qua thất bại. c) Dẫn chứng: Edison, các tấm gương vượt khó. d) Mặt trái cần tránh: sợ thất bại đến mức không dám làm; hoặc thất bại rồi buông xuôi, tuyệt vọng — phê phán. e) Thái độ đúng: dũng cảm đối mặt, phân tích nguyên nhân, đứng dậy làm lại; biến thất bại thành bàn đạp. f) Liên hệ bản thân. 3. Kết bài: khẳng định thất bại không đáng sợ, đáng sợ là không dám đứng dậy; lời nhắn nhủ."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Sân khấu trống. Ánh đèn mờ. NHÂN VẬT NGƯỜI NGHỆ SĨ bước ra, tay ôm cây đàn.)\nNGHỆ SĨ (độc thoại): Cả đời ta theo đuổi cái đẹp. Người ta bảo ta điên, ta cười. Người ta bảo ta nghèo, ta vẫn vui. Vì ta biết: cái đẹp cứu rỗi tâm hồn con người. Một bài hát hay có thể làm dịu một trái tim đang đau, một bức tranh đẹp có thể thắp sáng một tâm hồn đang tối. Ta có thể nghèo tiền bạc, nhưng ta giàu có vì ta có nghệ thuật. Vĩnh biệt những kẻ chỉ biết đến tiền! Ta chọn con đường của mình.\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Quan niệm nghệ thuật của nhân vật Nghệ sĩ là gì?", "options": ["A. Nghệ thuật vì tiền", "B. Nghệ thuật vì cái đẹp, vì con người: cái đẹp có sức cứu rỗi, thắp sáng tâm hồn", "C. Nghệ thuật vô nghĩa", "D. Nghệ thuật để nổi tiếng"], "answer": "B", "explain": "“Cái đẹp cứu rỗi tâm hồn con người”, “thắp sáng một tâm hồn đang tối” — quan niệm nghệ thuật vị nhân sinh, vì con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Sân khấu trống. Ánh đèn mờ. NHÂN VẬT NGƯỜI NGHỆ SĨ bước ra, tay ôm cây đàn.)\nNGHỆ SĨ (độc thoại): Cả đời ta theo đuổi cái đẹp. Người ta bảo ta điên, ta cười. Người ta bảo ta nghèo, ta vẫn vui. Vì ta biết: cái đẹp cứu rỗi tâm hồn con người. Một bài hát hay có thể làm dịu một trái tim đang đau, một bức tranh đẹp có thể thắp sáng một tâm hồn đang tối. Ta có thể nghèo tiền bạc, nhưng ta giàu có vì ta có nghệ thuật. Vĩnh biệt những kẻ chỉ biết đến tiền! Ta chọn con đường của mình.\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Câu “Ta có thể nghèo tiền bạc, nhưng ta giàu có vì ta có nghệ thuật” sử dụng nghệ thuật gì?", "options": ["A. So sánh", "B. Đối lập (giữa nghèo tiền bạc với giàu nghệ thuật) để khẳng định giá trị tinh thần của nghệ thuật", "C. Nhân hóa", "D. Liệt kê"], "answer": "B", "explain": "Đối lập giữa “nghèo tiền bạc” và “giàu nghệ thuật” — khẳng định: giá trị đích thực của người nghệ sĩ ở sự giàu có tinh thần.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n(Sân khấu trống. Ánh đèn mờ. NHÂN VẬT NGƯỜI NGHỆ SĨ bước ra, tay ôm cây đàn.)\nNGHỆ SĨ (độc thoại): Cả đời ta theo đuổi cái đẹp. Người ta bảo ta điên, ta cười. Người ta bảo ta nghèo, ta vẫn vui. Vì ta biết: cái đẹp cứu rỗi tâm hồn con người. Một bài hát hay có thể làm dịu một trái tim đang đau, một bức tranh đẹp có thể thắp sáng một tâm hồn đang tối. Ta có thể nghèo tiền bạc, nhưng ta giàu có vì ta có nghệ thuật. Vĩnh biệt những kẻ chỉ biết đến tiền! Ta chọn con đường của mình.\n(Ngữ liệu minh họa — trích đoạn kịch tự soạn) Lời độc thoại của Nghệ sĩ gợi liên tưởng đến nhân vật nào trong Bài 5?", "options": ["A. Hamlet", "B. Vũ Như Tô — người nghệ sĩ suốt đời theo đuổi cái đẹp, thà chết chứ không từ bỏ lí tưởng", "C. Chí Phèo", "D. Không liên quan"], "answer": "B", "explain": "Cùng là người nghệ sĩ đam mê cái đẹp đến cùng cực, coi nghệ thuật là lẽ sống — rất gần với Vũ Như Tô và Cửu Trùng Đài của ông.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định sau (tổng hợp Bài 5):", "statements": ["a) Bi kịch là thể loại kịch có xung đột gay gắt, kết thúc bi thảm.", "b) Xung đột là linh hồn của kịch, có thể là xung đột xã hội hoặc xung đột nội tâm.", "c) Trong kịch, tính cách nhân vật bộc lộ qua lời thoại và hành động.", "d) “Hamlet” và “Vĩnh biệt cửu trùng đài” đều là hài kịch."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cả hai đều là bi kịch.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu ý nghĩa của kết thúc bi thảm trong bi kịch (vì sao nhân vật phải chết mà vở kịch vẫn có giá trị?).", "answer": "Cái chết gây xúc động mạnh, thanh lọc tâm hồn người xem, khiến ta suy ngẫm về con người và cuộc đời", "explain": "Kết thúc bi thảm không phải để gây đau thương vô nghĩa mà để thanh lọc tâm hồn (catharsis): người xem xúc động, suy ngẫm, rút ra bài học về lí tưởng, nhân cách và cuộc đời.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về vai trò của nghệ thuật trong cuộc sống. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Nghệ thuật có vai trò to lớn trong đời sống con người, như nhân vật Nghệ sĩ đã khẳng định: “cái đẹp cứu rỗi tâm hồn con người”. Một bài hát hay xoa dịu nỗi buồn, một bức tranh đẹp thắp sáng tâm hồn, một vở kịch hay khiến ta suy ngẫm về cuộc đời — nghệ thuật nuôi dưỡng cảm xúc, bồi đắp nhân cách. Trong cuộc sống bộn bề, nghệ thuật là nơi con người tìm về để thư giãn, để được đồng cảm, để sống đẹp hơn. Tuy nhiên, cần phân biệt nghệ thuật chân chính với những sản phẩm giải trí rẻ tiền, độc hại. Mỗi chúng ta hãy biết thưởng thức nghệ thuật một cách lành mạnh: đọc sách hay, nghe nhạc đẹp, xem phim có ý nghĩa — để tâm hồn ngày càng phong phú, nhân ái. Và nếu có năng khiếu, hãy dũng cảm theo đuổi nghệ thuật như nhân vật trong đoạn trích — vì một cuộc sống không có cái đẹp sẽ trở nên khô cằn, vô vị."}, {"type": "essay", "level": "VDC", "q": "Viết bài báo cáo nghiên cứu (dạng rút gọn) khoảng 600 chữ về thực trạng thưởng thức nghệ thuật của giới trẻ hiện nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở đầu: lí do chọn đề tài (nghệ thuật quan trọng với đời sống tinh thần; giới trẻ có xu hướng thưởng thức mới); mục đích, phạm vi (khảo sát học sinh trong trường/lớp). 2. Nội dung: a) Thực trạng: các loại hình nghệ thuật giới trẻ yêu thích (nhạc, phim, sách, hội họa…); thời gian, cách thức thưởng thức; những xu hướng tích cực (yêu nhạc truyền thống, đọc sách) và đáng lo (nhạc thị trường rẻ tiền, phim bạo lực). b) Nguyên nhân: ảnh hưởng mạng xã hội, thiếu định hướng, ít sân chơi nghệ thuật. c) Đánh giá: mặt tích cực và hạn chế. d) Giải pháp, kiến nghị: nhà trường tổ chức hoạt động nghệ thuật; gia đình định hướng; mỗi bạn trẻ chủ động tìm đến nghệ thuật chân chính. 3. Kết luận: khẳng định vai trò của nghệ thuật; kêu gọi thưởng thức nghệ thuật lành mạnh. (Số liệu cần xác thực từ khảo sát thực tế.)"}]}]}
