ng đầy nắng. Cánh đồng lúa chín vàng trải dài tít tắp, những rặng đước xanh rì rào trong gió biển. Người dân nơi đây hiếu khách lạ thường: mới gặp mà đã mời tôi ăn cơm, kể chuyện đất, chuyện người say sưa. Tôi chợt nhớ đến những trang viết của Nguyễn Tuân, Anh Đức về vùng đất này — hóa ra, Cà Mau không chỉ đẹp trong văn chương mà còn đẹp trong đời thực, đẹp bởi những con người chân chất, nghĩa tình. (Ngữ liệu minh họa — đoạn tản văn tự soạn) Đoạn văn trên thuộc thể loại nào?", "options": ["A. Truyện ngắn", "B. Tản văn (ghi lại cảm xúc, suy ngẫm trước cảnh và người Đất Mũi)", "C. Thơ", "D. Kịch"], "answer": "B", "explain": "Văn xuôi ngắn, tự do, ghi lại cảm xúc, suy ngẫm của tác giả trước thiên nhiên, con người Cà Mau — đặc trưng của tản văn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTôi đến Cà Mau vào một buổi sáng đầy nắng. Cánh đồng lúa chín vàng trải dài tít tắp, những rặng đước xanh rì rào trong gió biển. Người dân nơi đây hiếu khách lạ thường: mới gặp mà đã mời tôi ăn cơm, kể chuyện đất, chuyện người say sưa. Tôi chợt nhớ đến những trang viết của Nguyễn Tuân, Anh Đức về vùng đất này — hóa ra, Cà Mau không chỉ đẹp trong văn chương mà còn đẹp trong đời thực, đẹp bởi những con người chân chất, nghĩa tình. (Ngữ liệu minh họa — đoạn tản văn tự soạn) Chi tiết liên tưởng đến Nguyễn Tuân, Anh Đức có tác dụng gì?", "options": ["A. Khoe kiến thức", "B. Làm giàu thêm cảm nhận: đặt trải nghiệm cá nhân trong dòng chảy văn hóa — cho thấy Cà Mau đẹp cả trong văn chương và đời thực", "C. Không có tác dụng", "D. Để dài văn"], "answer": "B", "explain": "Liên tưởng đến các nhà văn đã viết về Cà Mau làm cho cảm nhận thêm sâu sắc, có chiều sâu văn hóa — đúng phong cách “nhiều liên tưởng” của tản văn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTôi đến Cà Mau vào một buổi sáng đầy nắng. Cánh đồng lúa chín vàng trải dài tít tắp, những rặng đước xanh rì rào trong gió biển. Người dân nơi đây hiếu khách lạ thường: mới gặp mà đã mời tôi ăn cơm, kể chuyện đất, chuyện người say sưa. Tôi chợt nhớ đến những trang viết của Nguyễn Tuân, Anh Đức về vùng đất này — hóa ra, Cà Mau không chỉ đẹp trong văn chương mà còn đẹp trong đời thực, đẹp bởi những con người chân chất, nghĩa tình. (Ngữ liệu minh họa — đoạn tản văn tự soạn) Đoạn văn gợi liên tưởng đến văn bản nào trong Bài 7?", "options": ["A. Ai đã đặt tên cho dòng sông?", "B. Cà Mau quê xứ của Trần Tuấn — cùng viết về vùng đất Mũi Cà Mau với liên tưởng văn học", "C. Và tôi vẫn muốn mẹ…", "D. Không liên quan"], "answer": "B", "explain": "“Cà Mau quê xứ” (Trần Tuấn) cũng ghi lại trải nghiệm ở Đất Mũi, cũng liên tưởng đến Nguyễn Tuân, Anh Đức, Xuân Diệu — cùng đề tài, cùng phong cách tản văn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về “Cà Mau quê xứ”:", "statements": ["a) Tác giả là Trần Tuấn (sinh năm 1967, quê Hà Nội).", "b) Văn bản trích từ tập “Uống cà phê trên đường của Vũ”.", "c) Văn bản là truyện ngắn hư cấu hoàn toàn.", "d) Tác giả thể hiện tình cảm mến thương với thiên nhiên, con người Cà Mau."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đây là tản văn — ghi chép trải nghiệm có thật, không phải truyện hư cấu. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên ba nhà văn được Trần Tuấn liên tưởng đến khi viết về Cà Mau.", "answer": "Nguyễn Tuân, Anh Đức, Xuân Diệu", "explain": "Khi đến Đất Mũi, Trần Tuấn liên tưởng đến những nhà văn đã có “duyên nợ” với Cà Mau: Nguyễn Tuân, Anh Đức, Xuân Diệu — làm giàu thêm chiều sâu văn hóa cho trang viết.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ ghi lại ấn tượng của em về một vùng đất em đã đến (theo phong cách tản văn). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Hè năm ngoái, tôi được về quê ngoại ở miền biển. Ấn tượng đầu tiên là mùi mặn mòi của biển, là những con sóng trắng xóa xô vào bờ cát vàng. Sáng sớm, tôi theo các bác ngư dân ra biển: những chiếc thuyền thúng tròn vo, những mẻ lưới đầy ắp cá tôm, tiếng cười nói rộn rã cả một góc biển. Người dân quê ngoại hiếu khách lạ thường: mới gặp đã mời tôi ăn cơm với cá kho tộ, canh chua cá bớp ngon tuyệt. Tôi chợt nhớ đến những bài thơ về biển đã học — hóa ra biển không chỉ đẹp trong thơ mà còn đẹp trong đời thực, đẹp bởi những con người lao động chân chất. Chuyến đi ấy cho tôi thêm yêu quê hương, thêm trân trọng những vùng đất bình dị mà giàu nghĩa tình của Tổ quốc."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn thuyết minh khoảng 600 chữ về một danh lam thắng cảnh ở quê hương em (hoặc ở Việt Nam). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT (văn thuyết minh): 1. Mở bài: giới thiệu danh lam thắng cảnh em chọn và lí do chọn. 2. Thân bài: a) Vị trí địa lí, cách đi đến. b) Lịch sử hình thành (nếu có). c) Vẻ đẹp: miêu tả cụ thể từng phần (có thể theo trình tự không gian hoặc thời gian); dùng số liệu, so sánh. d) Giá trị: văn hóa, lịch sử, du lịch, kinh tế. e) Thực trạng bảo vệ và kiến nghị. 3. Kết bài: khẳng định giá trị; lời mời gọi mọi người đến thăm và cùng bảo vệ."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBà tôi kể: năm đói, cả nhà phải ăn cháo cám cầm hơi. Có hôm, bà nhịn phần mình để nhường cho các con. Đêm đêm, bà thức trắng quạt cho con ngủ, miệng hát ru ầu ơ. Tôi ghi lại lời bà kể vào cuốn sổ nhỏ. Mỗi lần đọc lại, tôi như thấy hiện ra cả một thời gian khó mà ấm áp tình người. Tôi tự nhủ: phải viết lại câu chuyện này, để con cháu mai sau biết rằng ông bà đã sống như thế nào. (Ngữ liệu minh họa — đoạn truyện kí tự soạn) Đoạn văn trên gần với thể loại nào nhất?", "options": ["A. Truyện cổ tích", "B. Truyện kí (ghi chép lời kể có thật của bà, có chi tiết, có cảm xúc của người ghi)", "C. Thơ", "D. Kịch"], "answer": "B", "explain": "Ghi chép lời kể có thật của bà về năm đói, có chi tiết cụ thể, có cảm xúc của người ghi — đặc trưng của truyện kí (người thật, việc thật).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBà tôi kể: năm đói, cả nhà phải ăn cháo cám cầm hơi. Có hôm, bà nhịn phần mình để nhường cho các con. Đêm đêm, bà thức trắng quạt cho con ngủ, miệng hát ru ầu ơ. Tôi ghi lại lời bà kể vào cuốn sổ nhỏ. Mỗi lần đọc lại, tôi như thấy hiện ra cả một thời gian khó mà ấm áp tình người. Tôi tự nhủ: phải viết lại câu chuyện này, để con cháu mai sau biết rằng ông bà đã sống như thế nào. (Ngữ liệu minh họa — đoạn truyện kí tự soạn) Chi tiết “bà nhịn phần mình để nhường cho các con” có ý nghĩa gì?", "options": ["A. Chứng tỏ nhà nghèo", "B. Khắc họa đức hi sinh cao cả của người mẹ: nhịn ăn để con được no — vẻ đẹp của tình mẫu tử trong gian khó", "C. Không có ý nghĩa", "D. Miêu tả món ăn"], "answer": "B", "explain": "Chi tiết nhỏ mà chứa đựng tình mẫu tử lớn lao: người mẹ hi sinh phần ăn của mình — vẻ đẹp cao cả trong đói khổ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nBà tôi kể: năm đói, cả nhà phải ăn cháo cám cầm hơi. Có hôm, bà nhịn phần mình để nhường cho các con. Đêm đêm, bà thức trắng quạt cho con ngủ, miệng hát ru ầu ơ. Tôi ghi lại lời bà kể vào cuốn sổ nhỏ. Mỗi lần đọc lại, tôi như thấy hiện ra cả một thời gian khó mà ấm áp tình người. Tôi tự nhủ: phải viết lại câu chuyện này, để con cháu mai sau biết rằng ông bà đã sống như thế nào. (Ngữ liệu minh họa — đoạn truyện kí tự soạn) Câu “phải viết lại câu chuyện này, để con cháu mai sau biết rằng ông bà đã sống như thế nào” thể hiện nhận thức gì về giá trị của kí?", "options": ["A. Không thể hiện gì", "B. Nhận thức sâu sắc: kí có giá trị lưu giữ sự thật, kí ức cho thế hệ sau — ghi chép hôm nay là tài sản của mai sau", "C. Thích viết", "D. Muốn nổi tiếng"], "answer": "B", "explain": "Người ghi ý thức được chức năng lưu trữ của kí: ghi lại sự thật hôm nay để mai sau còn biết — đó là giá trị bền vững của thể loại kí.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về truyện kí:", "statements": ["a) Truyện kí viết về người thật, việc thật nhưng vẫn có yếu tố văn học (chi tiết, cảm xúc, giọng điệu).", "b) “Và tôi vẫn muốn mẹ…” là truyện kí phi hư cấu, ghi lại lời kể của nhân chứng chiến tranh.", "c) Người viết kí được phép bịa đặt hoàn toàn để câu chuyện hấp dẫn.", "d) Ghi chép trung thực là yêu cầu hàng đầu của kí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: phỏng vấn nhân chứng, người thật việc thật. c) Sai: không được bịa đặt làm sai lệch sự thật. d) Đúng.", "points": 1}, {"type": "short", "level": "TH", "q": "Văn bản “Và tôi vẫn muốn mẹ…” được trích từ tác phẩm nào của Xvét-la-na A-lếch-xi-ê-vích?", "answer": "“Những nhân chứng cuối cùng – Solo cho giọng trẻ em”", "explain": "Văn bản trích từ cuốn “Những nhân chứng cuối cùng – Solo cho giọng trẻ em” — truyện kí phỏng vấn những người từng là trẻ em trong Chiến tranh thế giới thứ hai.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ ghi lại một câu chuyện có thật mà em được nghe kể (theo phong cách truyện kí). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Ông tôi kể rằng, năm 1972, ông là bộ đội pháo cao xạ bảo vệ bầu trời Hà Nội. Đêm Noel năm ấy, máy bay B-52 của Mỹ ồ ạt ném bom, bầu trời rực sáng như ban ngày. Đơn vị ông chiến đấu suốt đêm, có đồng đội đã ngã xuống ngay bên cạnh ông. Sáng ra, trận địa còn khét mùi thuốc súng, nhưng anh em vẫn cười vang vì đã bắn rơi được máy bay giặc. Ông bảo: “Lúc ấy chẳng ai nghĩ đến cái chết, chỉ nghĩ phải bảo vệ Thủ đô, bảo vệ nhân dân.” Tôi ghi lại câu chuyện vào sổ, mỗi lần đọc lại đều thấy nghẹn ngào. Câu chuyện của ông không chỉ là kỉ niệm gia đình mà còn là một mảnh ghép của lịch sử dân tộc — nhắc tôi nhớ rằng hòa bình hôm nay được đánh đổi bằng máu xương của cha ông, và tôi phải sống xứng đáng với sự hi sinh ấy."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn thuyết minh khoảng 600 chữ về một hiện tượng xã hội: văn hóa đọc sách của giới trẻ. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu hiện tượng văn hóa đọc trong giới trẻ hiện nay. 2. Thân bài: a) Khái niệm văn hóa đọc. b) Thực trạng: mặt tích cực (sách điện tử, audiobook, câu lạc bộ đọc) và mặt đáng lo (lười đọc, đọc hời hợt); số liệu, dẫn chứng. c) Nguyên nhân: sức hấp dẫn của mạng xã hội, game; thiếu thói quen từ nhỏ; ít thư viện, không gian đọc. d) Tác động: tri thức, tư duy, tâm hồn. e) Giải pháp: gia đình, nhà trường, xã hội chung tay; mỗi bạn trẻ dành thời gian cho sách. 3. Kết bài: đánh giá, kiến nghị; lời kêu gọi chấn hưng văn hóa đọc."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nHoàng Phủ Ngọc Tường viết về sông Hương với một tình yêu đặc biệt: ông theo dòng sông từ thượng nguồn Trường Sơn, qua những khúc quanh, đến với thành phố Huế. Ngòi bút của ông vừa ghi chép tỉ mỉ từng đoạn sông, vừa tưởng tượng phong phú: sông Hương lúc như “cô gái Di-gan phóng khoáng và man dại”, lúc như “người mẹ phù sa của một vùng văn hóa xứ sở”. Đằng sau những trang viết tài hoa là một trí thức uyên bác, một tâm hồn say đắm với Huế, với quê hương đất nước. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Phong cách nghệ thuật của Hoàng Phủ Ngọc Tường được nêu trong ngữ liệu là gì?", "options": ["A. Khô khan, máy móc", "B. Trữ tình, trí tuệ: kết hợp ghi chép tỉ mỉ với tưởng tượng phong phú, uyên bác", "C. Hài hước", "D. Bi quan"], "answer": "B", "explain": "“Vừa ghi chép tỉ mỉ… vừa tưởng tượng phong phú”, “trí thức uyên bác, tâm hồn say đắm” — phong cách trữ tình, trí tuệ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nHoàng Phủ Ngọc Tường viết về sông Hương với một tình yêu đặc biệt: ông theo dòng sông từ thượng nguồn Trường Sơn, qua những khúc quanh, đến với thành phố Huế. Ngòi bút của ông vừa ghi chép tỉ mỉ từng đoạn sông, vừa tưởng tượng phong phú: sông Hương lúc như “cô gái Di-gan phóng khoáng và man dại”, lúc như “người mẹ phù sa của một vùng văn hóa xứ sở”. Đằng sau những trang viết tài hoa là một trí thức uyên bác, một tâm hồn say đắm với Huế, với quê hương đất nước. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Hai hình ảnh so sánh về sông Hương (“cô gái Di-gan” và “người mẹ phù sa”) cho thấy điều gì?", "options": ["A. Sự mâu thuẫn", "B. Dòng sông được nhìn từ nhiều góc độ: vừa phóng khoáng, man dại (thượng nguồn) vừa dịu dàng, nuôi dưỡng (về với Huế) — vẻ đẹp đa dạng, phong phú", "C. Tác giả không hiểu sông", "D. Không cho thấy gì"], "answer": "B", "explain": "Hai hình ảnh đối lập mà thống nhất: sông Hương có nhiều “khuôn mặt” — man dại nơi thượng nguồn, dịu dàng khi về với Huế — cho thấy cái nhìn đa chiều, tinh tế.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nHoàng Phủ Ngọc Tường viết về sông Hương với một tình yêu đặc biệt: ông theo dòng sông từ thượng nguồn Trường Sơn, qua những khúc quanh, đến với thành phố Huế. Ngòi bút của ông vừa ghi chép tỉ mỉ từng đoạn sông, vừa tưởng tượng phong phú: sông Hương lúc như “cô gái Di-gan phóng khoáng và man dại”, lúc như “người mẹ phù sa của một vùng văn hóa xứ sở”. Đằng sau những trang viết tài hoa là một trí thức uyên bác, một tâm hồn say đắm với Huế, với quê hương đất nước. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Vì sao “Ai đã đặt tên cho dòng sông?” được coi là bài tùy bút xuất sắc?", "options": ["A. Vì dài", "B. Vì kết hợp hài hòa ghi chép xác thực với tưởng tượng tài hoa, ngôn ngữ giàu chất thơ và tình yêu Huế thiết tha — mẫu mực của tùy bút", "C. Vì khó hiểu", "D. Không có lí do"], "answer": "B", "explain": "Bài kí hội tụ mọi phẩm chất của tùy bút hay: sự thật được ghi chép tỉ mỉ, tưởng tượng bay bổng, ngôn ngữ tài hoa và cái tôi đậm nét.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hoàng Phủ Ngọc Tường chuyên viết tùy bút, bút kí.", "b) “Ai đã đặt tên cho dòng sông?” viết về sông Hương xứ Huế.", "c) Trong tùy bút, chi tiết, sự kiện chỉ là cái cớ để bộc lộ cảm xúc, suy tư.", "d) Ngôn ngữ tùy bút thường khô khan, thiếu hình ảnh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: đặc trưng của tùy bút. d) Sai: ngôn ngữ tùy bút giàu chất thơ, tài hoa.", "points": 1}, {"type": "short", "level": "NB", "q": "Bài kí “Ai đã đặt tên cho dòng sông?” được viết năm nào, in trong tập sách nào?", "answer": "Viết năm 1981, in trong tập bút kí cùng tên (1986)", "explain": "Bài kí viết tại Huế năm 1981, in trong tập bút kí “Ai đã đặt tên cho dòng sông?” năm 1986.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ giới thiệu về một dòng sông (hoặc thắng cảnh) của quê hương em theo phong cách tùy bút. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Sông Đáy quê tôi không nổi tiếng như sông Hương, sông Hồng, nhưng với tôi, nó đẹp nhất trên đời. Dòng sông uốn lượn qua làng như một dải lụa xanh, ôm ấp những cánh đồng lúa thẳng cánh cò bay. Sáng sớm, mặt sông phẳng lặng in bóng rặng tre; chiều về, nắng vàng rải những vệt lấp lánh trên mặt nước. Tôi vẫn nhớ những trưa hè cùng lũ bạn ùa xuống tắm, tiếng cười vang cả khúc sông. Dòng sông đã chứng kiến bao thế hệ làng tôi lớn lên: ông tôi từng chèo thuyền chở lúa qua sông, bố tôi từng mò cua bắt ốc nuôi cả nhà. Với tôi, sông Đáy như một người mẹ hiền, lặng lẽ nuôi dưỡng quê hương. Ước gì dòng sông mãi trong xanh, để mai này con cháu tôi cũng có một dòng sông đẹp để yêu, để nhớ."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ phân tích bài tùy bút “Ai đã đặt tên cho dòng sông?” (tập trung vào nghệ thuật ghi chép và tưởng tượng). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu Hoàng Phủ Ngọc Tường, bài kí; vấn đề: sự kết hợp ghi chép và tưởng tượng. 2. Thân bài: a) Nghệ thuật ghi chép: theo sát thủy trình sông Hương từ thượng nguồn đến Huế; chi tiết địa lí, lịch sử, văn hóa chính xác, tỉ mỉ — tính xác thực. b) Nghệ thuật tưởng tượng: so sánh tài hoa (cô gái Di-gan, người mẹ phù sa...); liên tưởng phong phú (âm nhạc, thi ca, lịch sử). c) Mối quan hệ: ghi chép là gốc, tưởng tượng là cánh — tưởng tượng dựa trên sự thật, làm sự thật thêm sinh động. d) Ngôn ngữ: giàu chất thơ, uyên bác. e) Cái tôi tác giả: say đắm, tinh tế, trí tuệ. f) Ý nghĩa: bản tình ca về sông Hương, về Huế; tình yêu quê hương. 3. Kết bài: khẳng định giá trị; bài học về cách quan sát, ghi chép trong cuộc sống."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nChiến tranh đã lùi xa, nhưng những trang truyện kí của Xvét-la-na A-lếch-xi-ê-vích vẫn khiến người đọc nghẹn ngào. Bà không viết về những trận đánh, mà ghi lại lời kể của những đứa trẻ từng đi qua chiến tranh. Chúng kể về đói khát, bom đạn bằng giọng ngây thơ: “Chúng tôi gọi tất cả những người lính là ba”. Ngây thơ mà ám ảnh — bởi đằng sau giọng kể ấy là những mất mát không gì bù đắp được. Đọc những trang viết ấy, ta càng thấm thía giá trị của hòa bình và càng căm ghét chiến tranh. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Điểm đặc sắc trong cách ghi chép của A-lếch-xi-ê-vích là gì?", "options": ["A. Viết về trận đánh", "B. Ghi lại lời kể của những đứa trẻ từng đi qua chiến tranh — nhân chứng nhỏ tuổi với giọng kể ngây thơ", "C. Bịa đặt", "D. Viết về người lớn"], "answer": "B", "explain": "Bà phỏng vấn những người từng là trẻ em trong chiến tranh — góc nhìn trẻ thơ mang lại sức ám ảnh đặc biệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nChiến tranh đã lùi xa, nhưng những trang truyện kí của Xvét-la-na A-lếch-xi-ê-vích vẫn khiến người đọc nghẹn ngào. Bà không viết về những trận đánh, mà ghi lại lời kể của những đứa trẻ từng đi qua chiến tranh. Chúng kể về đói khát, bom đạn bằng giọng ngây thơ: “Chúng tôi gọi tất cả những người lính là ba”. Ngây thơ mà ám ảnh — bởi đằng sau giọng kể ấy là những mất mát không gì bù đắp được. Đọc những trang viết ấy, ta càng thấm thía giá trị của hòa bình và càng căm ghét chiến tranh. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Chi tiết “Chúng tôi gọi tất cả những người lính là ba” gây xúc động vì sao?", "options": ["A. Ngộ nghĩnh", "B. Ngây thơ mà xót xa: những đứa trẻ mất cha, thèm khát tình cha đến mức gọi mọi người lính là “ba” — nỗi đau chiến tranh qua mắt trẻ thơ", "C. Hài hước", "D. Không gây xúc động"], "answer": "B", "explain": "Câu nói ngây thơ chứa đựng nỗi đau lớn: trẻ em mất cha trong chiến tranh — sự đối lập giữa ngây thơ và bi thảm tạo sức ám ảnh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nChiến tranh đã lùi xa, nhưng những trang truyện kí của Xvét-la-na A-lếch-xi-ê-vích vẫn khiến người đọc nghẹn ngào. Bà không viết về những trận đánh, mà ghi lại lời kể của những đứa trẻ từng đi qua chiến tranh. Chúng kể về đói khát, bom đạn bằng giọng ngây thơ: “Chúng tôi gọi tất cả những người lính là ba”. Ngây thơ mà ám ảnh — bởi đằng sau giọng kể ấy là những mất mát không gì bù đắp được. Đọc những trang viết ấy, ta càng thấm thía giá trị của hòa bình và càng căm ghét chiến tranh. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Giá trị lớn nhất của các tác phẩm phi hư cấu về chiến tranh là gì?", "options": ["A. Giải trí", "B. Lưu giữ sự thật lịch sử bằng lời kể của nhân chứng; tố cáo chiến tranh và ngợi ca khát vọng hòa bình — “tượng đài” của sự thật", "C. Kiếm tiền", "D. Không có giá trị"], "answer": "B", "explain": "Phi hư cấu có sức mạnh của sự thật: lời kể nhân chứng là bằng chứng sống tố cáo chiến tranh, nhắc nhở nhân loại trân trọng hòa bình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Xvét-la-na A-lếch-xi-ê-vích được trao giải Nobel Văn học năm 2015.", "b) Các tác phẩm của bà thuộc loại phi hư cấu (người thật, việc thật).", "c) “Và tôi vẫn muốn mẹ…” thể hiện nỗi đau và khát vọng yêu thương của trẻ em trong chiến tranh.", "d) Viết về chiến tranh chỉ nên ca ngợi, không nên ghi lại đau thương."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: truyện kí phỏng vấn. c) Đúng: “Và tôi vẫn còn muốn mẹ” — khát vọng tình mẫu tử. d) Sai: phải ghi lại đầy đủ sự thật, cả đau thương, để nhân loại không quên và không lặp lại.", "points": 1}, {"type": "short", "level": "TH", "q": "Giải Nobel Văn học năm 2015 được trao cho Xvét-la-na A-lếch-xi-ê-vích vì lí do gì?", "answer": "Vì các tác phẩm phi hư cấu — “tượng đài tưởng niệm sự thống khổ và lòng can đảm trong thời đại chúng ta”", "explain": "Ủy ban Nobel đánh giá các tác phẩm phi hư cấu của bà đã dựng lên “tượng đài tưởng niệm sự thống khổ và lòng can đảm trong thời đại chúng ta”.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về giá trị của hòa bình (gợi ý từ ngữ liệu Đề 5). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Đọc những trang truyện kí về trẻ em trong chiến tranh, tôi càng thấm thía giá trị của hòa bình. Chiến tranh đã cướp đi tuổi thơ của bao đứa trẻ: chúng phải chịu đói khát, bom đạn, mất cha mất mẹ khi còn quá nhỏ. Câu nói ngây thơ “chúng tôi gọi tất cả những người lính là ba” khiến lòng tôi quặn thắt — đằng sau sự ngây thơ là nỗi đau không gì bù đắp. Hòa bình hôm nay mà chúng ta đang hưởng — được đến trường, được sống bên gia đình — là điều mà bao thế hệ đã phải đánh đổi bằng máu xương. Vì vậy, mỗi chúng ta phải biết trân trọng hòa bình, sống có trách nhiệm để giữ gìn nó; đồng thời biết căm ghét chiến tranh, yêu chuộng hòa bình — không chỉ cho dân tộc mình mà cho cả nhân loại. Đó cũng là thông điệp mà các tác phẩm phi hư cấu về chiến tranh muốn gửi gắm đến muôn đời sau."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn thuyết minh khoảng 600 chữ về một hiện tượng xã hội: tình trạng bạo lực học đường. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu hiện tượng bạo lực học đường đang báo động. 2. Thân bài: a) Khái niệm: bạo lực học đường là gì (thể chất, tinh thần, mạng). b) Biểu hiện: đánh nhau, bắt nạt, cô lập, bạo lực mạng; dẫn chứng, số liệu. c) Nguyên nhân: thiếu kĩ năng kiểm soát cảm xúc, ảnh hưởng phim ảnh bạo lực, gia đình thiếu quan tâm, nhà trường chưa sát sao. d) Hậu quả: với nạn nhân (tổn thương thể chất, tinh thần), với người gây ra, với môi trường giáo dục. e) Giải pháp: giáo dục kĩ năng sống, tâm lí học đường; gia đình đồng hành; nhà trường xử lí nghiêm kết hợp giáo dục; mỗi học sinh nói không với bạo lực. 3. Kết bài: đánh giá, kiến nghị; lời kêu gọi xây dựng trường học an toàn, thân thiện."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nSáng nay, tôi ra chợ quê. Chợ họp từ tinh mơ, đông vui như hội: hàng rau xanh mướt, hàng cá tươi roi rói, hàng quà quê thơm phức. Bà cụ bán xôi vẫn như mọi khi, gói xôi nóng hổi vào lá chuối, cười móm mém: “Xôi nếp nương đấy cháu, ăn đi cho ấm bụng.” Tôi mua một gói xôi, vừa ăn vừa ngắm chợ. Chợt nghĩ: chợ quê không chỉ là nơi mua bán mà còn là nơi gặp gỡ, là hồn quê, là kí ức tuổi thơ của bao người. (Ngữ liệu minh họa — đoạn tản văn tự soạn) Bức tranh chợ quê được miêu tả với những nét nào?", "options": ["A. Ảm đạm, vắng vẻ", "B. Đông vui, đầy màu sắc, hương vị: rau xanh, cá tươi, quà thơm, xôi nóng — sinh động, gần gũi", "C. Hiện đại, sang trọng", "D. Không được miêu tả"], "answer": "B", "explain": "Liệt kê các hình ảnh, màu sắc, hương vị cụ thể — bức tranh chợ quê hiện lên sinh động, đầy sức sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nSáng nay, tôi ra chợ quê. Chợ họp từ tinh mơ, đông vui như hội: hàng rau xanh mướt, hàng cá tươi roi rói, hàng quà quê thơm phức. Bà cụ bán xôi vẫn như mọi khi, gói xôi nóng hổi vào lá chuối, cười móm mém: “Xôi nếp nương đấy cháu, ăn đi cho ấm bụng.” Tôi mua một gói xôi, vừa ăn vừa ngắm chợ. Chợt nghĩ: chợ quê không chỉ là nơi mua bán mà còn là nơi gặp gỡ, là hồn quê, là kí ức tuổi thơ của bao người. (Ngữ liệu minh họa — đoạn tản văn tự soạn) Hình ảnh bà cụ bán xôi gợi cảm xúc gì?", "options": ["A. Sợ hãi", "B. Ấm áp, thân thương: nụ cười móm mém, lời mời chân tình — vẻ đẹp của người lao động quê hương", "C. Khinh thường", "D. Không cảm xúc"], "answer": "B", "explain": "Chi tiết “gói xôi vào lá chuối”, “cười móm mém”, “ăn đi cho ấm bụng” — chân dung người lao động hiền hậu, ấm áp tình người.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nSáng nay, tôi ra chợ quê. Chợ họp từ tinh mơ, đông vui như hội: hàng rau xanh mướt, hàng cá tươi roi rói, hàng quà quê thơm phức. Bà cụ bán xôi vẫn như mọi khi, gói xôi nóng hổi vào lá chuối, cười móm mém: “Xôi nếp nương đấy cháu, ăn đi cho ấm bụng.” Tôi mua một gói xôi, vừa ăn vừa ngắm chợ. Chợt nghĩ: chợ quê không chỉ là nơi mua bán mà còn là nơi gặp gỡ, là hồn quê, là kí ức tuổi thơ của bao người. (Ngữ liệu minh họa — đoạn tản văn tự soạn) Câu cuối (“chợ quê không chỉ là nơi mua bán mà còn là nơi gặp gỡ, là hồn quê…”) thể hiện đặc điểm nào của tản văn?", "options": ["A. Kể lan man", "B. Từ ghi chép cụ thể nâng lên suy ngẫm, khái quát — cái tôi bộc lộ cảm xúc, triết lí", "C. Chỉ miêu tả", "D. Không đặc điểm"], "answer": "B", "explain": "Từ cảnh chợ cụ thể, tác giả suy ngẫm về ý nghĩa văn hóa của chợ quê — đúng đặc trưng tản văn: ghi chép gắn với trữ tình, suy tư.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Tản văn là văn xuôi ngắn, tự do, giàu chất trữ tình.", "b) Trong tản văn, tác giả thường ghi lại cảm xúc, suy ngẫm trước con người, cảnh vật.", "c) “Cà Mau quê xứ” của Trần Tuấn là một bài tản văn.", "d) Tản văn không cần có cái tôi tác giả."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cái tôi là linh hồn của tản văn.", "points": 1}, {"type": "short", "level": "NB", "q": "Tập “Uống cà phê trên đường của Vũ” là của tác giả nào?", "answer": "Trần Tuấn", "explain": "“Uống cà phê trên đường của Vũ” là tập tản văn, bút kí của Trần Tuấn — trong đó có bài “Cà Mau quê xứ”.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ ghi lại ấn tượng của em về một khu chợ (hoặc một nét sinh hoạt quê hương). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Chợ quê tôi họp vào các buổi sáng, đông vui như một lễ hội nhỏ. Từ tinh mơ, bà con đã gánh gồng tấp nập: hàng rau xanh mướt còn đọng sương, hàng cá tươi roi rói vừa đánh bắt, hàng bánh quê thơm phức mùi nếp mới. Tôi thích nhất hàng xôi của bà cụ Tư: xôi nếp nương dẻo thơm gói trong lá chuối, ăn kèm muối vừng bùi bùi. Bà cụ lúc nào cũng cười móm mém, thỉnh thoảng còn cho thêm tôi nắm xôi: “Ăn đi cho ấm bụng, cháu!” Chợ quê không chỉ là nơi mua bán mà còn là nơi gặp gỡ: các bà, các mẹ vừa mua vừa trò chuyện rôm rả, hỏi thăm nhau đủ chuyện. Với tôi, chợ quê là hồn quê, là kí ức tuổi thơ ngọt ngào — nơi lưu giữ những gì bình dị, chân thành nhất của làng quê Việt Nam."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn thuyết minh khoảng 600 chữ về một lễ hội truyền thống của quê hương em. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu lễ hội em chọn (tên, địa điểm, thời gian). 2. Thân bài: a) Nguồn gốc, ý nghĩa lịch sử, văn hóa của lễ hội. b) Thời gian, không gian tổ chức. c) Các hoạt động: phần lễ (nghi thức) và phần hội (trò chơi, văn nghệ) — miêu tả cụ thể, sinh động. d) Nét đặc sắc, độc đáo. e) Giá trị: văn hóa, tinh thần, du lịch; thực trạng bảo tồn và kiến nghị. 3. Kết bài: khẳng định giá trị; lời mời gọi giữ gìn, phát huy lễ hội truyền thống."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Kí là thể loại dễ viết vì chỉ cần ghi lại sự thật.” Thực ra, viết kí hay rất khó. Ghi lại sự thật thì ai cũng làm được, nhưng biến sự thật thành trang văn có hồn — đó mới là tài năng. Người viết kí phải có con mắt quan sát tinh tế, có vốn tri thức phong phú và một trái tim biết rung động. Hoàng Phủ Ngọc Tường từng mất nhiều tháng trời đi dọc sông Hương để viết một bài kí. A-lếch-xi-ê-vích dành hàng chục năm phỏng vấn nhân chứng. Vì vậy, đằng sau mỗi trang kí hay là mồ hôi, tâm huyết của người viết. (Ngữ liệu nghị luận — tự soạn) Ý kiến “Kí là thể loại dễ viết” được tác giả đánh giá như thế nào?", "options": ["A. Đồng tình", "B. Không đồng tình: viết kí hay rất khó — cần biến sự thật thành trang văn có hồn", "C. Không ý kiến", "D. Cho là đúng một phần"], "answer": "B", "explain": "Tác giả phản bác: “Thực ra, viết kí hay rất khó” — ghi sự thật thì dễ, biến sự thật thành văn có hồn mới khó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Kí là thể loại dễ viết vì chỉ cần ghi lại sự thật.” Thực ra, viết kí hay rất khó. Ghi lại sự thật thì ai cũng làm được, nhưng biến sự thật thành trang văn có hồn — đó mới là tài năng. Người viết kí phải có con mắt quan sát tinh tế, có vốn tri thức phong phú và một trái tim biết rung động. Hoàng Phủ Ngọc Tường từng mất nhiều tháng trời đi dọc sông Hương để viết một bài kí. A-lếch-xi-ê-vích dành hàng chục năm phỏng vấn nhân chứng. Vì vậy, đằng sau mỗi trang kí hay là mồ hôi, tâm huyết của người viết. (Ngữ liệu nghị luận — tự soạn) Theo ngữ liệu, người viết kí giỏi cần có những phẩm chất nào?", "options": ["A. Giàu có", "B. Con mắt quan sát tinh tế, vốn tri thức phong phú, trái tim biết rung động và sự lao động nghiêm túc", "C. Nổi tiếng", "D. Viết nhanh"], "answer": "B", "explain": "Ngữ liệu liệt kê: quan sát tinh tế, tri thức phong phú, trái tim rung động — cộng với dẫn chứng về sự lao động công phu của các nhà văn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Kí là thể loại dễ viết vì chỉ cần ghi lại sự thật.” Thực ra, viết kí hay rất khó. Ghi lại sự thật thì ai cũng làm được, nhưng biến sự thật thành trang văn có hồn — đó mới là tài năng. Người viết kí phải có con mắt quan sát tinh tế, có vốn tri thức phong phú và một trái tim biết rung động. Hoàng Phủ Ngọc Tường từng mất nhiều tháng trời đi dọc sông Hương để viết một bài kí. A-lếch-xi-ê-vích dành hàng chục năm phỏng vấn nhân chứng. Vì vậy, đằng sau mỗi trang kí hay là mồ hôi, tâm huyết của người viết. (Ngữ liệu nghị luận — tự soạn) Dẫn chứng về Hoàng Phủ Ngọc Tường và A-lếch-xi-ê-vích có tác dụng gì?", "options": ["A. Khoe kiến thức", "B. Chứng minh sự lao động nghiêm túc, công phu đằng sau mỗi trang kí hay — làm tăng sức thuyết phục", "C. Không tác dụng", "D. Để dài bài"], "answer": "B", "explain": "Hai dẫn chứng cụ thể (đi dọc sông Hương nhiều tháng, phỏng vấn hàng chục năm) chứng minh: kí hay là kết quả của lao động nghiêm túc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Viết kí hay đòi hỏi quan sát tinh tế, tri thức phong phú và sự lao động nghiêm túc.", "b) Tưởng tượng trong kí có thể thay thế hoàn toàn ghi chép.", "c) Cái tôi tác giả là linh hồn của thể kí.", "d) Đọc kí giúp ta hiểu thêm về con người, cuộc đời qua những sự thật được văn học hóa."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: tưởng tượng chỉ bổ sung, không thể thay thế ghi chép — “ghi chép là gốc”. c) Đúng. d) Đúng: giá trị của kí.", "points": 1}, {"type": "short", "level": "VD", "q": "Phân biệt “ghi chép” và “tưởng tượng” trong kí.", "answer": "Ghi chép: ghi lại sự thật quan sát được. Tưởng tượng: liên tưởng, hình dung, suy ngẫm của tác giả dựa trên sự thật", "explain": "Ghi chép là nền tảng (người thật, việc thật, chi tiết thật); tưởng tượng là sự sáng tạo (liên tưởng, hình dung tâm trạng, suy ngẫm) dựa trên sự thật, làm trang viết sinh động — không được bịa đặt sai sự thật.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về vai trò của sự quan sát trong học tập và cuộc sống. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Quan sát là kĩ năng quan trọng trong học tập và cuộc sống, như bài học từ các nhà văn viết kí. Trong học tập, quan sát giúp ta nắm bắt kiến thức sinh động: quan sát thí nghiệm vật lí, quan sát mẫu vật sinh học, quan sát cách thầy cô giải bài — từ đó hiểu sâu, nhớ lâu hơn là học vẹt. Trong cuộc sống, quan sát tinh tế giúp ta thấu hiểu con người: nhận ra niềm vui, nỗi buồn của cha mẹ, bạn bè để sẻ chia kịp thời; nhận ra vẻ đẹp bình dị quanh ta để yêu đời hơn. Ngược lại, thiếu quan sát, ta sẽ hời hợt, vô tâm, bỏ lỡ bao điều quý giá. Vì vậy, mỗi chúng ta hãy rèn cho mình đôi mắt tinh tế: nhìn kĩ, nhìn sâu, nhìn bằng cả trái tim — để học tập hiệu quả hơn và sống nhân ái, sâu sắc hơn."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về ý nghĩa của lao động nghiêm túc trong học tập. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ sự lao động công phu của các nhà văn viết kí, đặt vấn đề: lao động nghiêm túc trong học tập. 2. Thân bài: a) Giải thích: lao động nghiêm túc là học tập chăm chỉ, có phương pháp, trung thực. b) Biểu hiện: chuẩn bị bài, tập trung nghe giảng, tự học, không gian lận. c) Ý nghĩa: nắm vững kiến thức, rèn ý chí, tạo nền tảng tương lai; “có công mài sắt, có ngày nên kim”. d) Phản đề: phê phán thói lười biếng, học vẹt, gian lận — hậu quả. e) Cách rèn: lập kế hoạch, kiên trì, tìm niềm vui trong học tập; noi gương tấm gương vượt khó. f) Liên hệ bản thân. 3. Kết bài: khẳng định “học tập là công việc nghiêm túc”; lời nhắn nhủ."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTranh luận là một hình thức giao tiếp quan trọng trong đời sống. Tranh luận tốt giúp tìm ra chân lí, giải pháp tối ưu; tranh luận xấu chỉ gây mâu thuẫn, chia rẽ. Muốn tranh luận tốt, trước hết phải tôn trọng đối phương — lắng nghe trước khi phản bác. Thứ hai, phải dùng lí lẽ, dẫn chứng thay vì cảm xúc, công kích cá nhân. Thứ ba, phải bám sát vấn đề, không lan man, không đánh tráo khái niệm. Cuối cùng, phải biết tiếp thu ý đúng của đối phương — tranh luận là để hiểu nhau hơn, không phải để thắng thua. Rèn kĩ năng tranh luận từ hôm nay, chúng ta sẽ tự tin hơn trong học tập và cuộc sống. (Ngữ liệu nghị luận — tự soạn) Theo ngữ liệu, mục đích của tranh luận tốt là gì?", "options": ["A. Để thắng đối phương", "B. Để tìm ra chân lí, giải pháp tối ưu và hiểu nhau hơn", "C. Để gây mâu thuẫn", "D. Để khoe kiến thức"], "answer": "B", "explain": "Ngữ liệu khẳng định: tranh luận tốt “giúp tìm ra chân lí, giải pháp tối ưu”; “tranh luận là để hiểu nhau hơn, không phải để thắng thua”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTranh luận là một hình thức giao tiếp quan trọng trong đời sống. Tranh luận tốt giúp tìm ra chân lí, giải pháp tối ưu; tranh luận xấu chỉ gây mâu thuẫn, chia rẽ. Muốn tranh luận tốt, trước hết phải tôn trọng đối phương — lắng nghe trước khi phản bác. Thứ hai, phải dùng lí lẽ, dẫn chứng thay vì cảm xúc, công kích cá nhân. Thứ ba, phải bám sát vấn đề, không lan man, không đánh tráo khái niệm. Cuối cùng, phải biết tiếp thu ý đúng của đối phương — tranh luận là để hiểu nhau hơn, không phải để thắng thua. Rèn kĩ năng tranh luận từ hôm nay, chúng ta sẽ tự tin hơn trong học tập và cuộc sống. (Ngữ liệu nghị luận — tự soạn) Theo ngữ liệu, muốn tranh luận tốt cần những yêu cầu nào?", "options": ["A. Nói to, át giọng đối phương", "B. Tôn trọng, lắng nghe; dùng lí lẽ, dẫn chứng; bám sát vấn đề; biết tiếp thu ý đúng", "C. Công kích cá nhân", "D. Lan man"], "answer": "B", "explain": "Bốn yêu cầu được nêu rõ: tôn trọng — lí lẽ — bám sát vấn đề — tiếp thu ý đúng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTranh luận là một hình thức giao tiếp quan trọng trong đời sống. Tranh luận tốt giúp tìm ra chân lí, giải pháp tối ưu; tranh luận xấu chỉ gây mâu thuẫn, chia rẽ. Muốn tranh luận tốt, trước hết phải tôn trọng đối phương — lắng nghe trước khi phản bác. Thứ hai, phải dùng lí lẽ, dẫn chứng thay vì cảm xúc, công kích cá nhân. Thứ ba, phải bám sát vấn đề, không lan man, không đánh tráo khái niệm. Cuối cùng, phải biết tiếp thu ý đúng của đối phương — tranh luận là để hiểu nhau hơn, không phải để thắng thua. Rèn kĩ năng tranh luận từ hôm nay, chúng ta sẽ tự tin hơn trong học tập và cuộc sống. (Ngữ liệu nghị luận — tự soạn) Ngữ liệu trên gần với kiểu văn bản nào trong chương trình Bài 7?", "options": ["A. Tùy bút", "B. Văn bản phục vụ cho kĩ năng thảo luận, tranh luận về một vấn đề trong đời sống (nói và nghe)", "C. Truyện kí", "D. Thơ"], "answer": "B", "explain": "Ngữ liệu bàn về kĩ năng tranh luận — đúng với nội dung phần Nói và nghe của Bài 7: “Thảo luận, tranh luận về một vấn đề trong đời sống”.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Tranh luận văn minh cần tôn trọng và lắng nghe đối phương.", "b) Trong tranh luận nên dùng cảm xúc thay cho lí lẽ.", "c) Mục đích của tranh luận là tìm ra chân lí, không phải để thắng thua.", "d) Biết tiếp thu ý đúng của đối phương là biểu hiện của người tranh luận giỏi."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: phải dùng lí lẽ, dẫn chứng thay vì cảm xúc, công kích cá nhân. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu ba nguyên tắc cơ bản khi tham gia thảo luận, tranh luận.", "answer": "Tôn trọng đối phương; dùng lí lẽ, dẫn chứng; bám sát vấn đề (và biết tiếp thu ý đúng)", "explain": "Ba nguyên tắc: tôn trọng, lắng nghe đối phương; tranh luận bằng lí lẽ, dẫn chứng; bám sát vấn đề, không lan man; đồng thời biết tiếp thu ý kiến đúng.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về văn hóa tranh luận của giới trẻ trên mạng xã hội. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Văn hóa tranh luận của giới trẻ trên mạng xã hội hiện nay đang có nhiều điều đáng lo ngại. Thay vì dùng lí lẽ, dẫn chứng để bảo vệ quan điểm, không ít bạn trẻ công kích cá nhân, dùng lời lẽ thô tục, “ném đá” tập thể — biến tranh luận thành cuộc chiến. Nguyên nhân một phần do ẩn danh trên mạng khiến người ta dễ buông lời thiếu suy nghĩ; một phần do thiếu kĩ năng tranh luận văn minh. Hậu quả là mâu thuẫn leo thang, nhiều người bị tổn thương tinh thần, thậm chí dẫn đến bạo lực mạng. Để cải thiện, mỗi bạn trẻ cần nhớ: tranh luận là để tìm ra chân lí, không phải để thắng thua; hãy tôn trọng đối phương, dùng lí lẽ thay vì cảm xúc; không đồng tình thì trình bày quan điểm một cách văn minh. Một cộng đồng mạng văn minh bắt đầu từ mỗi chúng ta."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về kĩ năng giao tiếp của giới trẻ hiện nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giao tiếp là kĩ năng sống quan trọng; đặt vấn đề về kĩ năng giao tiếp của giới trẻ. 2. Thân bài: a) Giải thích: giao tiếp là trao đổi thông tin, tình cảm; kĩ năng giao tiếp gồm lắng nghe, diễn đạt, ứng xử. b) Thực trạng: mặt tích cực (tự tin, năng động, giỏi công nghệ) và mặt hạn chế (ngại giao tiếp trực tiếp, “nghiện” mạng xã hội, thiếu lễ phép, tranh luận thiếu văn hóa). c) Nguyên nhân: ảnh hưởng công nghệ, thiếu rèn luyện, gia đình, nhà trường chưa chú trọng. d) Hậu quả và ý nghĩa: giao tiếp tốt mở ra cơ hội; giao tiếp kém gây hiểu lầm, cô lập. e) Giải pháp: rèn từ việc nhỏ (chào hỏi, lắng nghe), tham gia hoạt động tập thể, học cách tranh luận văn minh; gia đình, nhà trường tạo môi trường. f) Liên hệ bản thân. 3. Kết bài: khẳng định “lời nói chẳng mất tiền mua”; lời nhắn nhủ."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Cây diêm cuối cùng” là truyện ngắn trong phần Thực hành đọc, Bài 7. Truyện kể về một con người trong hoàn cảnh tuyệt vọng, chỉ còn một que diêm cuối cùng để sưởi ấm và thắp lên hy vọng. Que diêm nhỏ bé mà mang ý nghĩa lớn: nó là biểu tượng của niềm tin, của sự sống — chỉ cần còn một tia hy vọng, con người còn có thể bước tiếp. Truyện nhắc nhở ta: trong những lúc tăm tối nhất, đừng bao giờ đánh mất niềm tin. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Hình ảnh “que diêm cuối cùng” mang ý nghĩa biểu tượng gì?", "options": ["A. Sự nghèo khó", "B. Niềm tin, hy vọng, sự sống — tia sáng cuối cùng để con người bước tiếp trong tuyệt vọng", "C. Lửa trại", "D. Không có ý nghĩa"], "answer": "B", "explain": "Que diêm “thắp lên hy vọng”, là “biểu tượng của niềm tin, của sự sống” — ý nghĩa được nêu trực tiếp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Cây diêm cuối cùng” là truyện ngắn trong phần Thực hành đọc, Bài 7. Truyện kể về một con người trong hoàn cảnh tuyệt vọng, chỉ còn một que diêm cuối cùng để sưởi ấm và thắp lên hy vọng. Que diêm nhỏ bé mà mang ý nghĩa lớn: nó là biểu tượng của niềm tin, của sự sống — chỉ cần còn một tia hy vọng, con người còn có thể bước tiếp. Truyện nhắc nhở ta: trong những lúc tăm tối nhất, đừng bao giờ đánh mất niềm tin. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Vì sao một vật nhỏ bé như que diêm lại có sức ám ảnh lớn?", "options": ["A. Vì hiếm", "B. Vì trong hoàn cảnh tuyệt vọng, điều nhỏ bé nhất cũng trở thành điểm tựa tinh thần lớn lao — nghệ thuật biểu tượng", "C. Vì đẹp", "D. Không có lí do"], "answer": "B", "explain": "Sức mạnh của biểu tượng: vật càng nhỏ bé trong hoàn cảnh càng tuyệt vọng thì ý nghĩa càng lớn — que diêm là “tia hy vọng” cuối cùng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Cây diêm cuối cùng” là truyện ngắn trong phần Thực hành đọc, Bài 7. Truyện kể về một con người trong hoàn cảnh tuyệt vọng, chỉ còn một que diêm cuối cùng để sưởi ấm và thắp lên hy vọng. Que diêm nhỏ bé mà mang ý nghĩa lớn: nó là biểu tượng của niềm tin, của sự sống — chỉ cần còn một tia hy vọng, con người còn có thể bước tiếp. Truyện nhắc nhở ta: trong những lúc tăm tối nhất, đừng bao giờ đánh mất niềm tin. (Ngữ liệu giới thiệu tác phẩm — tự soạn) Thông điệp của truyện có mối liên hệ nào với chủ đề Bài 7?", "options": ["A. Không liên quan", "B. Cùng ngợi ca sức sống, niềm tin của con người trước nghịch cảnh — như niềm tin vào sự sống trong các trang kí", "C. Cùng viết về sông", "D. Cùng hài hước"], "answer": "B", "explain": "“Cây diêm cuối cùng” ngợi ca niềm tin, sức sống — tương đồng với tinh thần nhân văn trong các văn bản kí của Bài 7 (yêu quê hương, trân trọng sự sống).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Biểu tượng là hình ảnh cụ thể mang ý nghĩa trừu tượng, khái quát.", "b) “Cây diêm cuối cùng” là văn bản Thực hành đọc trong Bài 7.", "c) Niềm tin có sức mạnh giúp con người vượt qua nghịch cảnh.", "d) Trong tuyệt vọng, con người nên buông xuôi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: khái niệm biểu tượng. b) Đúng. c) Đúng: thông điệp của truyện. d) Sai: phải giữ niềm tin, không buông xuôi.", "points": 1}, {"type": "short", "level": "TH", "q": "Kể tên ba văn bản đọc chính trong Bài 7 của SGK.", "answer": "“Ai đã đặt tên cho dòng sông?”, “Và tôi vẫn muốn mẹ…”, “Cà Mau quê xứ”", "explain": "Ba văn bản đọc: “Ai đã đặt tên cho dòng sông?” (Hoàng Phủ Ngọc Tường), “Và tôi vẫn muốn mẹ…” (A-lếch-xi-ê-vích), “Cà Mau quê xứ” (Trần Tuấn).", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về sức mạnh của niềm tin (gợi ý từ ngữ liệu Đề 9). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): “Cây diêm cuối cùng” cho ta bài học sâu sắc về sức mạnh của niềm tin. Trong những lúc tăm tối nhất của cuộc đời — thất bại, mất mát, tuyệt vọng — niềm tin chính là “que diêm cuối cùng” thắp sáng con đường phía trước. Niềm tin giúp ta không gục ngã, cho ta sức mạnh để đứng dậy và bước tiếp. Nhìn quanh ta, biết bao con người đã vượt qua nghịch cảnh nhờ niềm tin: bệnh nhân chiến thắng bệnh tật vì tin vào sự sống, học sinh nghèo vượt khó vì tin vào tương lai. Ngược lại, đánh mất niềm tin là đánh mất tất cả — con người sẽ buông xuôi, gục ngã trước khó khăn. Vì vậy, mỗi chúng ta hãy nuôi dưỡng niềm tin: tin vào bản thân, tin vào điều tốt đẹp, tin vào tương lai. Hãy nhớ: chỉ cần còn một tia hy vọng, ta còn có thể làm nên điều kì diệu."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về vai trò của niềm tin trong cuộc sống. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: từ hình ảnh “cây diêm cuối cùng”, đặt vấn đề: niềm tin là sức mạnh của con người. 2. Thân bài: a) Giải thích: niềm tin là sự tin tưởng vào bản thân, vào điều tốt đẹp, vào tương lai. b) Biểu hiện: tin vào khả năng của mình, kiên trì mục tiêu; tin vào con người, vào cuộc đời. c) Vai trò: giúp vượt qua khó khăn, thất bại; tạo động lực phấn đấu; lan tỏa năng lượng tích cực. d) Dẫn chứng: tấm gương vượt khó nhờ niềm tin. e) Phản đề: phê phán sự mất niềm tin, bi quan, buông xuôi; phân biệt niềm tin với ảo tưởng, mù quáng. f) Cách nuôi dưỡng: đặt mục tiêu nhỏ và chinh phục, sống tích cực, gần người tốt. g) Liên hệ bản thân. 3. Kết bài: khẳng định “mất niềm tin là mất tất cả”; lời nhắn nhủ giữ vững niềm tin."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nKí là thể loại của sự thật, nhưng sự thật trong kí không khô khan. Nhờ con mắt quan sát tinh tế, trí tưởng tượng phong phú và trái tim rung động, người viết kí đã biến những sự thật bình dị thành những trang văn đẹp. Hoàng Phủ Ngọc Tường biến dòng sông thành bản tình ca; A-lếch-xi-ê-vích biến lời kể trẻ thơ thành tượng đài; Trần Tuấn biến Đất Mũi thành miền thương nhớ. Đó là sức mạnh của kí: nói sự thật một cách đẹp đẽ, khiến người đọc vừa biết thêm, vừa yêu thêm cuộc đời. (Ngữ liệu tổng kết — tự soạn) Theo ngữ liệu, sức mạnh của kí là gì?", "options": ["A. Bịa đặt hay", "B. Nói sự thật một cách đẹp đẽ: vừa cung cấp tri thức vừa bồi đắp tình cảm", "C. Viết dài", "D. Khó hiểu"], "answer": "B", "explain": "“Nói sự thật một cách đẹp đẽ, khiến người đọc vừa biết thêm, vừa yêu thêm cuộc đời” — sức mạnh kép của kí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nKí là thể loại của sự thật, nhưng sự thật trong kí không khô khan. Nhờ con mắt quan sát tinh tế, trí tưởng tượng phong phú và trái tim rung động, người viết kí đã biến những sự thật bình dị thành những trang văn đẹp. Hoàng Phủ Ngọc Tường biến dòng sông thành bản tình ca; A-lếch-xi-ê-vích biến lời kể trẻ thơ thành tượng đài; Trần Tuấn biến Đất Mũi thành miền thương nhớ. Đó là sức mạnh của kí: nói sự thật một cách đẹp đẽ, khiến người đọc vừa biết thêm, vừa yêu thêm cuộc đời. (Ngữ liệu tổng kết — tự soạn) Ba ví dụ trong đoạn 2 (Hoàng Phủ Ngọc Tường, A-lếch-xi-ê-vích, Trần Tuấn) có tác dụng gì?", "options": ["A. Khoe tên", "B. Chứng minh bằng ba phong cách khác nhau: sự thật bình dị đều có thể thành trang văn đẹp qua ngòi bút tài hoa", "C. Không tác dụng", "D. Để dài bài"], "answer": "B", "explain": "Ba cây bút, ba đề tài, ba phong cách — cùng chứng minh một luận điểm: sức mạnh của kí nằm ở cách viết, ở cái tôi tác giả.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nKí là thể loại của sự thật, nhưng sự thật trong kí không khô khan. Nhờ con mắt quan sát tinh tế, trí tưởng tượng phong phú và trái tim rung động, người viết kí đã biến những sự thật bình dị thành những trang văn đẹp. Hoàng Phủ Ngọc Tường biến dòng sông thành bản tình ca; A-lếch-xi-ê-vích biến lời kể trẻ thơ thành tượng đài; Trần Tuấn biến Đất Mũi thành miền thương nhớ. Đó là sức mạnh của kí: nói sự thật một cách đẹp đẽ, khiến người đọc vừa biết thêm, vừa yêu thêm cuộc đời. (Ngữ liệu tổng kết — tự soạn) Câu “biến những sự thật bình dị thành những trang văn đẹp” thể hiện quan niệm gì về văn học?", "options": ["A. Văn học xa rời đời sống", "B. Văn học bắt nguồn từ đời sống và có khả năng nâng đời sống lên thành cái đẹp — chức năng thẩm mĩ và nhận thức của văn học", "C. Văn học chỉ để giải trí", "D. Không quan niệm"], "answer": "B", "explain": "Quan niệm: văn học bắt nguồn từ hiện thực (sự thật bình dị) và có chức năng làm đẹp cuộc đời (thành trang văn đẹp) — vừa nhận thức vừa thẩm mĩ.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định sau (tổng hợp Bài 7):", "statements": ["a) Kí là thể loại ghi chép người thật, việc thật, có cái tôi tác giả và tính văn học.", "b) Trong kí, ghi chép là gốc, tưởng tượng là cánh — tưởng tượng dựa trên sự thật.", "c) Tùy bút, tản văn, truyện kí đều là các tiểu loại của kí.", "d) “Ai đã đặt tên cho dòng sông?”, “Và tôi vẫn muốn mẹ…”, “Cà Mau quê xứ” đều là truyện ngắn hư cấu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cả ba đều là kí (tùy bút, truyện kí, tản văn) — người thật việc thật, không phải truyện hư cấu.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu điểm khác nhau cơ bản giữa kí và truyện ngắn.", "answer": "Kí viết về người thật, việc thật; truyện ngắn có thể hư cấu", "explain": "Kí tôn trọng sự thật (người thật, việc thật), cái tôi tác giả hiện trực tiếp; truyện ngắn là sáng tác hư cấu với nhân vật, cốt truyện do tác giả tưởng tượng.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận chung của em về các văn bản kí đã học trong Bài 7. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Học xong Bài 7, tôi thêm yêu thể loại kí — thể loại của sự thật mà đẹp như thơ. “Ai đã đặt tên cho dòng sông?” cho tôi thấy một sông Hương thơ mộng qua ngòi bút tài hoa, uyên bác của Hoàng Phủ Ngọc Tường; “Và tôi vẫn muốn mẹ…” khiến tôi nghẹn ngào trước những lời kể ngây thơ mà ám ảnh của trẻ em trong chiến tranh; “Cà Mau quê xứ” đưa tôi đến với Đất Mũi đầy nắng gió và những con người nghĩa tình. Ba văn bản, ba phong cách, nhưng đều cho tôi bài học chung: sự thật bình dị quanh ta đều có thể thành trang văn đẹp nếu ta biết quan sát bằng đôi mắt tinh tế và cảm nhận bằng trái tim rung động. Bài học ấy không chỉ cho việc viết văn mà cho cả cuộc sống: hãy sống chậm lại, quan sát kĩ hơn, yêu thương nhiều hơn — để thấy cuộc đời đẹp biết bao."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn thuyết minh khoảng 600 chữ về một hiện tượng xã hội em quan tâm (tự chọn). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu hiện tượng em chọn và lí do quan tâm. 2. Thân bài: a) Khái niệm, biểu hiện cụ thể của hiện tượng (có dẫn chứng, số liệu). b) Nguyên nhân. c) Tác động (tích cực và/hoặc tiêu cực). d) Giải pháp, kiến nghị. 3. Kết bài: đánh giá chung; lời kêu gọi hành động. (Lưu ý: đảm bảo tính khách quan, chính xác của tri thức; dẫn chứng, số liệu cần xác thực.)"}]}]}
