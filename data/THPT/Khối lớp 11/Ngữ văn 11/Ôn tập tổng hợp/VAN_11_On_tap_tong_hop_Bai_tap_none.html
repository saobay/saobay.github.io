i", "D. Không ý nghĩa"], "answer": "B", "explain": "Chiếc lá là hình ảnh biểu tượng: niềm tin vào sự sống; đồng thời là kết tinh của tình thương, sự hi sinh của người họa sĩ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nChiếc lá cuối cùng vẫn bám trên cành sau đêm bão. Cô gái nhìn nó qua khung cửa sổ, và một niềm tin lạ lùng trỗi dậy trong cô: nếu chiếc lá mong manh còn không chịu rụng, tại sao mình lại buông xuôi? Cô bắt đầu ăn uống trở lại, dần hồi phục. Mãi sau này cô mới biết: đêm bão ấy, chiếc lá thật đã rụng; chiếc lá cô nhìn thấy là do người họa sĩ già vẽ lên tường trong đêm mưa gió, bằng tất cả tình thương dành cho cô. Ông đã ra đi sau đêm vẽ ấy vì cảm lạnh, để lại cho đời kiệt tác cuối cùng — và cho cô gái một mạng sống. (Truyện ngắn “Chiếc lá cuối cùng” — phỏng theo O Hen-ri, tóm tắt) Truyện được kể theo điểm nhìn nào và có tác dụng gì?", "options": ["A. Ngôi thứ nhất", "B. Ngôi thứ ba, điểm nhìn toàn tri: người kể biết hết mọi chuyện (cả bí mật về chiếc lá vẽ) — tạo bất ngờ ở kết truyện, tăng sức xúc động", "C. Không có điểm nhìn", "D. Điểm nhìn hạn tri"], "answer": "B", "explain": "Người kể biết cả bí mật mà nhân vật không biết (lá do họa sĩ vẽ) — điểm nhìn toàn tri, tạo nút thắt bất ngờ ở cuối.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Chiếc lá cuối cùng” ca ngợi tình thương và sự hi sinh thầm lặng.", "b) Chiếc lá do họa sĩ vẽ là “kiệt tác” vì nó cứu sống một con người.", "c) Điểm nhìn toàn tri giúp tạo bất ngờ nghệ thuật ở cuối truyện.", "d) Cô gái hồi phục nhờ thuốc men hiện đại."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: giá trị của nghệ thuật nằm ở khả năng cứu rỗi con người. c) Đúng. d) Sai: cô hồi phục nhờ niềm tin mà chiếc lá mang lại.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên thủ pháp nghệ thuật tạo bất ngờ ở cuối truyện ngắn.", "answer": "Nút thắt bất n  về tình thương và niềm tin."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Quê hương tôi có con sông xanh biếc\nNước gương trong soi tóc những hàng tre\nTâm hồn tôi là một buổi trưa hè\nTỏa nắng xuống lòng sông lấp loáng.”\n(Trích “Nhớ con sông quê hương” — Tế Hanh) Đoạn thơ trên được viết theo thể thơ nào?", "options": ["A. Lục bát", "B. Tự do", "C. Thất ngôn (7 chữ) — mỗi dòng 7 tiếng", "D. Ngũ ngôn"], "answer": "C", "explain": "Mỗi dòng 7 tiếng — thể thất ngôn, phổ biến trong thơ hiện đại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Quê hương tôi có con sông xanh biếc\nNước gương trong soi tóc những hàng tre\nTâm hồn tôi là một buổi trưa hè\nTỏa nắng xuống lòng sông lấp loáng.”\n(Trích “Nhớ con sông quê hương” — Tế Hanh) Hình ảnh “tâm hồn tôi là một buổi trưa hè / Tỏa nắng xuống lòng sông lấp loáng” sử dụng biện pháp tu từ gì?", "options": ["A. Nhân hóa", "B. So sánh ngầm (ẩn dụ chuyển đổi cảm giác): tâm hồn được ví như buổi trưa hè tỏa nắng — diễn tả tình yêu quê hương nồng nàn, rực rỡ", "C. Nói quá", "D. Điệp ngữ"], "answer": "B", "explain": "“Tâm hồn tôi là...” — so sánh ngầm: tình cảm với quê hương được hình ảnh hóa thành nắng trưa hè rực rỡ, ấm áp.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Quê hương tôi có con sông xanh biếc\nNước gương trong soi tóc những hàng tre\nTâm hồn tôi là một buổi trưa hè\nTỏa nắng xuống lòng sông lấp loáng.”\n(Trích “Nhớ con sông quê hương” — Tế Hanh) Cấu tứ của đoạn thơ có thể khái quát như thế nào?", "options": ["A. Không có cấu tứ", "B. Từ hình ảnh cụ thể (con sông xanh biếc, hàng tre) đến cảm xúc trừu tượng (tâm hồn tỏa nắng) — mạch đi từ cảnh đến tình, từ quê hương đến tâm hồn", "C. Chỉ tả cảnh", "D. Chỉ nói tình"], "answer": "B", "explain": "Cấu tứ: cảnh sông quê cụ thể gợi mở cảm xúc — rồi cảm xúc dâng lên thành hình ảnh tâm hồn tỏa nắng — mạch “cảnh gợi tình”.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Tế Hanh là nhà thơ của quê hương, sông nước miền Trung.", "b) Đoạn thơ kết hợp miêu tả cảnh và bộc lộ tình cảm.", "c) “Nước gương trong” là hình ảnh so sánh dòng sông như tấm gương.", "d) Đoạn thơ thể hiện tình yêu quê hương tha thiết."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: Tế Hanh nổi tiếng với thơ về quê hương Bình Định. b) Đúng: cảnh — tình hòa quyện. c) Đúng: sông như gương soi. d) Đúng.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu tên biện pháp tu từ trong câu “Nước gương trong soi tóc những hàng tre”.", "answer": "So sánh (sông như tấm gương) và nhân hóa (tre có “tóc”)", "explain": "“Nước gương trong”: so sánh sông như gương; “soi tóc”: nhân hóa hàng tre như người có mái tóc — hình ảnh sinh động, gợi cảm.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ phân tích vẻ đẹp của quê hương qua đoạn thơ trong ngữ liệu Đề 2. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Đoạn thơ của Tế Hanh vẽ nên bức tranh quê hương tươi đẹp và chan chứa tình cảm. Con sông “xanh biếc”, “nước gương trong soi tóc những hàng tre” — hình ảnh vừa thực vừa thơ, gợi một miền quê thanh bình, trong lành. Từ cảnh sông, nhà thơ chuyển sang tình: “tâm hồn tôi là một buổi trưa hè / tỏa nắng xuống lòng sông lấp loáng” — tình yêu quê hương được hình ảnh hóa thành nắng hè rực rỡ, ấm áp, lan tỏa khắp lòng sông. Cấu tứ “từ cảnh đến tình” rất tự nhiên: cảnh quê nuôi dưỡng tâm hồn, tâm hồn lại làm đẹp thêm cảnh quê. Đọc đoạn thơ, ta cảm nhận được tình yêu quê hương tha thiết, trong sáng của Tế Hanh — tình cảm mà mỗi chúng ta đều mang trong mình về nơi chôn nhau cắt rốn."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ phân tích bài thơ “Nhớ con sông quê hương” của Tế Hanh. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu Tế Hanh, bài thơ; vấn đề: tình yêu quê hương. 2. Thân bài: a) Hình ảnh con sông quê: xanh biếc, trong như gương — vẻ đẹp thanh bình. b) Tình cảm của nhà thơ: tâm hồn như nắng trưa hè — nồng nàn, rực rỡ. c) Cấu tứ: từ cảnh đến tình, từ cụ thể đến trừu tượng. d) Nghệ thuật: so sánh, nhân hóa, ngôn ngữ trong sáng, giàu hình ảnh. e) Ý nghĩa: tình yêu quê hương là tình cảm thiêng liêng, nguồn nuôi dưỡng tâm hồn. 3. Kết bài: khẳng định giá trị; liên hệ tình yêu quê hương của bản thân."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Học sinh ngày nay quá phụ thuộc vào công nghệ, đánh mất khả năng tư duy độc lập.” Ý kiến khác lại khẳng định: “Công nghệ là công cụ đắc lực, giúp học sinh học tập hiệu quả hơn bao giờ hết.” Thực ra, công nghệ chỉ là công cụ — tốt hay xấu tùy thuộc vào người sử dụng. Học sinh biết dùng công nghệ để tra cứu, mở rộng tri thức sẽ tiến bộ vượt bậc; ngược lại, kẻ lạm dụng để gian lận, sao nhãng sẽ thụt lùi. Vấn đề không nằm ở công nghệ mà ở ý thức và phương pháp của người học. Hãy làm chủ công nghệ, đừng để công nghệ làm chủ mình. (Ngữ liệu nghị luận — tự soạn) Luận đề của đoạn văn nghị luận trên là gì?", "options": ["A. Công nghệ xấu", "B. Công nghệ tốt hay xấu tùy thuộc vào người sử dụng — học sinh cần làm chủ công nghệ", "C. Học sinh lười", "D. Không có luận đề"], "answer": "B", "explain": "Luận đề được nêu rõ: “công nghệ chỉ là công cụ — tốt hay xấu tùy thuộc vào người sử dụng”; kết luận: “hãy làm chủ công nghệ”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Học sinh ngày nay quá phụ thuộc vào công nghệ, đánh mất khả năng tư duy độc lập.” Ý kiến khác lại khẳng định: “Công nghệ là công cụ đắc lực, giúp học sinh học tập hiệu quả hơn bao giờ hết.” Thực ra, công nghệ chỉ là công cụ — tốt hay xấu tùy thuộc vào người sử dụng. Học sinh biết dùng công nghệ để tra cứu, mở rộng tri thức sẽ tiến bộ vượt bậc; ngược lại, kẻ lạm dụng để gian lận, sao nhãng sẽ thụt lùi. Vấn đề không nằm ở công nghệ mà ở ý thức và phương pháp của người học. Hãy làm chủ công nghệ, đừng để công nghệ làm chủ mình. (Ngữ liệu nghị luận — tự soạn) Cách lập luận của đoạn văn có đặc điểm gì?", "options": ["A. Một chiều", "B. Lập luận hai mặt: nêu ý kiến trái chiều rồi phân tích, tổng hợp — thừa nhận mặt tích cực và chỉ ra mặt tiêu cực của việc lạm dụng", "C. Không có luận cứ", "D. Cảm tính"], "answer": "B", "explain": "Đoạn văn nêu hai ý kiến đối lập, rồi phân tích để đi đến kết luận cân bằng — lập luận biện chứng, thuyết phục.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nCó ý kiến cho rằng: “Học sinh ngày nay quá phụ thuộc vào công nghệ, đánh mất khả năng tư duy độc lập.” Ý kiến khác lại khẳng định: “Công nghệ là công cụ đắc lực, giúp học sinh học tập hiệu quả hơn bao giờ hết.” Thực ra, công nghệ chỉ là công cụ — tốt hay xấu tùy thuộc vào người sử dụng. Học sinh biết dùng công nghệ để tra cứu, mở rộng tri thức sẽ tiến bộ vượt bậc; ngược lại, kẻ lạm dụng để gian lận, sao nhãng sẽ thụt lùi. Vấn đề không nằm ở công nghệ mà ở ý thức và phương pháp của người học. Hãy làm chủ công nghệ, đừng để công nghệ làm chủ mình. (Ngữ liệu nghị luận — tự soạn) Câu kết “Hãy làm chủ công nghệ, đừng để công nghệ làm chủ mình” sử dụng nghệ thuật gì?", "options": ["A. Không nghệ thuật", "B. Đối lập giữa “làm chủ” và “bị làm chủ” + câu mệnh lệnh — tạo ấn tượng mạnh, dễ nhớ, có sức kêu gọi", "C. Kể chuyện", "D. Miêu tả"], "answer": "B", "explain": "Cặp đối lập “làm chủ / bị làm chủ” đặt trong câu mệnh lệnh — ngắn gọn, mạnh mẽ, giàu sức thuyết phục.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Đoạn văn trên là văn bản nghị luận về vấn đề xã hội.", "b) Luận cứ của đoạn văn là những phân tích về cách sử dụng công nghệ.", "c) Kết luận của đoạn văn là lời kêu gọi hành động.", "d) Đoạn văn phủ nhận hoàn toàn vai trò của công nghệ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: “hãy làm chủ công nghệ...”. d) Sai: đoạn văn thừa nhận công nghệ là “công cụ đắc lực” nếu dùng đúng.", "points": 1}, {"type": "short", "level": "NB", "q": "Nêu ba thành phần cơ bản của cấu trúc văn bản nghị luận.", "answer": "Luận đề, luận điểm, luận cứ (và lập luận)", "explain": "Cấu trúc văn bản nghị luận gồm: luận đề (vấn đề bàn luận), luận điểm (ý kiến chính), luận cứ (lí lẽ, dẫn chứng) và cách lập luận.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ về cách sử dụng công nghệ hiệu quả trong học tập. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Công nghệ là con dao hai lưỡi: dùng đúng cách, nó là trợ thủ đắc lực; dùng sai, nó trở thành kẻ thù của việc học. Để sử dụng công nghệ hiệu quả, trước hết cần xác định mục đích rõ ràng: dùng để tra cứu tài liệu, học trực tuyến, làm bài tập — chứ không phải để lướt mạng vô bổ. Thứ hai, cần kỉ luật: đặt giới hạn thời gian, tắt thông báo khi học, tránh xa những nội dung gây sao nhãng. Thứ ba, luôn tư duy độc lập: công nghệ chỉ cung cấp thông tin, còn phân tích, đánh giá phải do chính mình thực hiện — đừng bao giờ sao chép máy móc. Tôi đã áp dụng và thấy hiệu quả rõ rệt: việc học trở nên sinh động, tri thức được mở rộng. Hãy nhớ: công nghệ phục vụ con người chứ không thay thế con người — người làm chủ công nghệ sẽ là người chiến thắng trong thời đại số."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về vai trò của công nghệ trong học tập của học sinh hiện nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: đặt vấn đề — công nghệ len lỏi vào mọi mặt học tập; cần nhìn nhận đúng vai trò của nó. 2. Thân bài: a) Giải thích: công nghệ trong học tập (internet, thiết bị, phần mềm). b) Mặt tích cực: kho tri thức khổng lồ, học mọi lúc mọi nơi, học tập sinh động, kết nối thầy trò. c) Mặt tiêu cực: sao nhãng, gian lận, lệ thuộc, giảm tư duy độc lập, ảnh hưởng sức khỏe. d) Nguyên nhân của mặt tiêu cực: thiếu ý thức, thiếu phương pháp. e) Giải pháp: dùng có mục đích, có kỉ luật, tư duy độc lập; nhà trường, gia đình hướng dẫn. f) Liên hệ bản thân. 3. Kết bài: khẳng định “làm chủ công nghệ”; lời nhắn nhủ."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nRÔ-MÊ-Ô: “Nhưng nhẹ nhàng! Ánh sáng nào xuyên qua khung cửa sổ kia? Đó là phương đông, và Giu-li-ét là mặt trời! Hãy mọc lên, hỡi mặt trời xinh đẹp, và giết chết mặt trăng ghen tức...” (Trích “Rô-mê-ô và Giu-li-ét” — Sếch-xpia, cảnh ban công) Lời thoại trên là của nhân vật nào, nói về ai?", "options": ["A. Giu-li-ét nói về Rô-mê-ô", "B. Rô-mê-ô nói về Giu-li-ét: ví nàng như mặt trời, ánh sáng phương đông", "C. Người kể chuyện", "D. Không rõ"], "answer": "B", "explain": "Lời độc thoại của Rô-mê-ô dưới ban công: ngắm Giu-li-ét và ví nàng như mặt trời xinh đẹp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nRÔ-MÊ-Ô: “Nhưng nhẹ nhàng! Ánh sáng nào xuyên qua khung cửa sổ kia? Đó là phương đông, và Giu-li-ét là mặt trời! Hãy mọc lên, hỡi mặt trời xinh đẹp, và giết chết mặt trăng ghen tức...” (Trích “Rô-mê-ô và Giu-li-ét” — Sếch-xpia, cảnh ban công) Biện pháp tu từ chính trong lời thoại là gì?", "options": ["A. Nhân hóa", "B. Ẩn dụ và so sánh ngầm: Giu-li-ét được ví như “mặt trời”, “ánh sáng phương đông” — ca ngợi vẻ đẹp rực rỡ, sự sống mà nàng mang lại", "C. Nói giảm", "D. Liệt kê"], "answer": "B", "explain": "“Giu-li-ét là mặt trời” — ẩn dụ: nàng là nguồn sáng, nguồn sống, vẻ đẹp rực rỡ xua tan bóng tối.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nRÔ-MÊ-Ô: “Nhưng nhẹ nhàng! Ánh sáng nào xuyên qua khung cửa sổ kia? Đó là phương đông, và Giu-li-ét là mặt trời! Hãy mọc lên, hỡi mặt trời xinh đẹp, và giết chết mặt trăng ghen tức...” (Trích “Rô-mê-ô và Giu-li-ét” — Sếch-xpia, cảnh ban công) Qua lời thoại, tình yêu của Rô-mê-ô được thể hiện như thế nào?", "options": ["A. Hời hợt", "B. Say đắm, nồng nàn, mang màu sắc lí tưởng hóa: người yêu được nâng lên tầm vũ trụ (mặt trời) — tình yêu tuổi trẻ mãnh liệt, trong sáng", "C. Toan tính", "D. Giả dối"], "answer": "B", "explain": "Ví người yêu như mặt trời — sự lí tưởng hóa tột cùng: tình yêu được nâng lên tầm vũ trụ, thể hiện sự say đắm mãnh liệt.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Rô-mê-ô và Giu-li-ét” là bi kịch nổi tiếng của Sếch-xpia.", "b) Cảnh ban công là một trong những cảnh lãng mạn nhất của vở kịch.", "c) Ngôn ngữ kịch giàu hình ảnh, cảm xúc.", "d) Tình yêu của hai nhân vật bị gia đình hai bên ủng hộ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: lời thoại thơ mộng, giàu ẩn dụ. d) Sai: hai dòng họ Mon-ta-ghiu và Ca-piu-lét thù địch nhau — đó là nguồn gốc bi kịch.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu tên hai dòng họ thù địch trong vở kịch “Rô-mê-ô và Giu-li-ét”.", "answer": "Mon-ta-ghiu và Ca-piu-lét", "explain": "Hai dòng họ Mon-ta-ghiu (nhà Rô-mê-ô) và Ca-piu-lét (nhà Giu-li-ét) thù địch nhau — mối thù là nguồn gốc xung đột bi kịch.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ cảm nhận về vẻ đẹp tình yêu qua lời thoại trong ngữ liệu Đề 4. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Lời thoại của Rô-mê-ô dưới ban công là một trong những lời tỏ tình đẹp nhất trong văn học thế giới. Chàng ví Giu-li-ét như “mặt trời”, như “ánh sáng phương đông” — người yêu được nâng lên tầm vũ trụ, trở thành nguồn sáng xua tan bóng tối. Ẩn dụ ấy cho thấy tình yêu của Rô-mê-ô say đắm đến mức nào: trong mắt kẻ đang yêu, người yêu là đẹp nhất, rực rỡ nhất, là tất cả ý nghĩa của cuộc đời. Tình yêu tuổi trẻ hiện lên mãnh liệt, trong sáng, không toan tính — dám yêu hết mình. Đọc lời thoại, tôi cảm nhận được sức mạnh của tình yêu chân thành: nó có thể biến con người thành thi sĩ, biến đêm tối thành ban ngày. Đó cũng là lí do vở bi kịch của Sếch-xpia sống mãi: tình yêu đẹp luôn có sức lay động lòng người, vượt qua mọi rào cản."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ phân tích cảnh ban công trong vở kịch “Rô-mê-ô và Giu-li-ét” của Sếch-xpia. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu Sếch-xpia, vở kịch; vị trí cảnh ban công. 2. Thân bài: a) Bối cảnh: đêm, vườn nhà Ca-piu-lét — không gian lãng mạn. b) Lời thoại Rô-mê-ô: ẩn dụ mặt trời, sự lí tưởng hóa. c) Lời thoại Giu-li-ét: tình yêu dũng cảm, chủ động. d) Nghệ thuật: ngôn ngữ thơ, giàu hình ảnh; độc thoại nội tâm; sự kết hợp tình yêu và định mệnh. e) Ý nghĩa: đỉnh cao lãng mạn; báo hiệu bi kịch (tình yêu đẹp trong hoàn cảnh thù hận). 3. Kết bài: khẳng định giá trị; sức sống của tình yêu chân thành."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTheo một khảo sát gần đây, hơn 70% học sinh trung học sử dụng điện thoại trên 3 giờ mỗi ngày ngoài giờ học. Trong đó, thời gian dành cho học tập chỉ chiếm khoảng 20%, còn lại là mạng xã hội và giải trí. Các chuyên gia cảnh báo: sử dụng điện thoại quá nhiều ảnh hưởng đến thị lực, giấc ngủ, khả năng tập trung và kết quả học tập. Tuy nhiên, cũng có ý kiến cho rằng điện thoại là công cụ học tập không thể thiếu trong thời đại số. Vấn đề đặt ra là: làm thế nào để sử dụng điện thoại một cách khoa học, hiệu quả? (Văn bản thông tin — tổng hợp, tự soạn) Văn bản trên thuộc kiểu văn bản nào?", "options": ["A. Văn bản nghị luận", "B. Văn bản thông tin: cung cấp số liệu khảo sát, ý kiến chuyên gia về một vấn đề thực tế", "C. Truyện ngắn", "D. Thơ"], "answer": "B", "explain": "Văn bản cung cấp số liệu (70%, 3 giờ, 20%), ý kiến chuyên gia — đặc trưng của văn bản thông tin.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTheo một khảo sát gần đây, hơn 70% học sinh trung học sử dụng điện thoại trên 3 giờ mỗi ngày ngoài giờ học. Trong đó, thời gian dành cho học tập chỉ chiếm khoảng 20%, còn lại là mạng xã hội và giải trí. Các chuyên gia cảnh báo: sử dụng điện thoại quá nhiều ảnh hưởng đến thị lực, giấc ngủ, khả năng tập trung và kết quả học tập. Tuy nhiên, cũng có ý kiến cho rằng điện thoại là công cụ học tập không thể thiếu trong thời đại số. Vấn đề đặt ra là: làm thế nào để sử dụng điện thoại một cách khoa học, hiệu quả? (Văn bản thông tin — tổng hợp, tự soạn) Dữ liệu “hơn 70% học sinh sử dụng điện thoại trên 3 giờ mỗi ngày” có vai trò gì?", "options": ["A. Trang trí", "B. Làm bằng chứng cụ thể, tin cậy cho nhận định về thực trạng sử dụng điện thoại — dữ liệu là “linh hồn” của văn bản thông tin", "C. Không vai trò", "D. Gây hoang mang"], "answer": "B", "explain": "Số liệu cụ thể khiến nhận định có sức thuyết phục — đây là đặc trưng quan trọng của văn bản thông tin.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nTheo một khảo sát gần đây, hơn 70% học sinh trung học sử dụng điện thoại trên 3 giờ mỗi ngày ngoài giờ học. Trong đó, thời gian dành cho học tập chỉ chiếm khoảng 20%, còn lại là mạng xã hội và giải trí. Các chuyên gia cảnh báo: sử dụng điện thoại quá nhiều ảnh hưởng đến thị lực, giấc ngủ, khả năng tập trung và kết quả học tập. Tuy nhiên, cũng có ý kiến cho rằng điện thoại là công cụ học tập không thể thiếu trong thời đại số. Vấn đề đặt ra là: làm thế nào để sử dụng điện thoại một cách khoa học, hiệu quả? (Văn bản thông tin — tổng hợp, tự soạn) Thái độ của người viết thể hiện qua câu cuối như thế nào?", "options": ["A. Bi quan", "B. Khách quan, hướng tới giải pháp: không phủ nhận điện thoại mà đặt vấn đề sử dụng khoa học, hiệu quả — thái độ cân bằng, xây dựng", "C. Phê phán", "D. Thờ ơ"], "answer": "B", "explain": "Câu hỏi cuối hướng tới giải pháp — người viết giữ thái độ khách quan, không cực đoan phủ nhận hay tán dương.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Văn bản thông tin cung cấp tri thức dựa trên dữ liệu, nguồn tin.", "b) Số liệu khảo sát làm tăng tính thuyết phục của văn bản.", "c) Người viết văn bản thông tin cần giữ thái độ khách quan.", "d) Văn bản thông tin không cần nêu nguồn dữ liệu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: nguồn tin rõ ràng là yêu cầu quan trọng để kiểm chứng độ tin cậy.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu hai tiêu chí đánh giá độ tin cậy của một văn bản thông tin.", "answer": "Nguồn tin rõ ràng, uy tín; dữ liệu cụ thể, có thể kiểm chứng", "explain": "Hai tiêu chí: nguồn tin rõ ràng, có uy tín; dữ liệu cụ thể, chính xác, có thể kiểm chứng được.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày quan điểm của em về việc sử dụng điện thoại của học sinh hiện nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Số liệu “hơn 70% học sinh dùng điện thoại trên 3 giờ mỗi ngày, chỉ 20% cho học tập” là hồi chuông cảnh báo. Điện thoại mang lại nhiều tiện ích: tra cứu tài liệu, học trực tuyến, kết nối bạn bè. Nhưng lạm dụng nó, học sinh sẽ phải trả giá: mắt mờ, mất ngủ, mất tập trung, học hành sa sút — chưa kể những cạm bẫy trên mạng xã hội. Theo tôi, vấn đề không phải là cấm đoán mà là sử dụng khoa học: đặt giới hạn thời gian, ưu tiên mục đích học tập, tắt thông báo khi cần tập trung, và quan trọng nhất là rèn ý thức tự giác. Gia đình và nhà trường cũng cần hướng dẫn, đồng hành thay vì chỉ cấm đoán. Điện thoại là công cụ tốt trong tay người biết làm chủ — hãy biến nó thành “gia sư” chứ đừng để nó thành “kẻ cắp” thời gian của mình."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về tác động của mạng xã hội đối với giới trẻ. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: đặt vấn đề — mạng xã hội là một phần không thể thiếu của giới trẻ; cần nhìn nhận đúng tác động hai mặt. 2. Thân bài: a) Giải thích: mạng xã hội là gì. b) Tác động tích cực: kết nối, chia sẻ tri thức, học tập, kinh doanh, lan tỏa điều tốt đẹp. c) Tác động tiêu cực: nghiện, sống ảo, so sánh, trầm cảm, tin giả, lừa đảo, mất thời gian học tập. d) Dẫn chứng cụ thể, số liệu. e) Nguyên nhân: thiếu ý thức, thiếu kĩ năng số. f) Giải pháp: dùng có chọn lọc, có giới hạn; nâng cao kĩ năng số; gia đình, nhà trường đồng hành. g) Liên hệ bản thân. 3. Kết bài: khẳng định; lời nhắn nhủ dùng mạng xã hội thông minh."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Đêm khuya văng vẳng trống canh dồn,\nTrơ cái hồng nhan với nước non.\nChén rượu hương đưa say lại tỉnh,\nVầng trăng bóng xế khuyết chưa tròn.”\n(Trích “Tự tình II” — Hồ Xuân Hương) Bài thơ “Tự tình II” được viết theo thể thơ nào?", "options": ["A. Lục bát", "B. Thất ngôn bát cú Đường luật", "C. Tự do", "D. Song thất lục bát"], "answer": "B", "explain": "8 câu, mỗi câu 7 chữ, niêm luật chặt chẽ — thể thất ngôn bát cú Đường luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Đêm khuya văng vẳng trống canh dồn,\nTrơ cái hồng nhan với nước non.\nChén rượu hương đưa say lại tỉnh,\nVầng trăng bóng xế khuyết chưa tròn.”\n(Trích “Tự tình II” — Hồ Xuân Hương) Hình ảnh “trơ cái hồng nhan với nước non” gợi tâm trạng gì?", "options": ["A. Vui vẻ", "B. Cô đơn, bẽ bàng, chua xót: “trơ” vừa là trơ trọi một mình giữa đêm khuya, vừa là sự thách thức — tâm trạng phức tạp của người phụ nữ tài hoa mà bất hạnh", "C. Hài hước", "D. Bình thản"], "answer": "B", "explain": "“Trơ” hai nghĩa: trơ trọi (cô đơn) và trơ ra, thách thức — diễn tả nỗi đau thân phận mà vẫn kiêu hãnh, không khuất phục.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Đêm khuya văng vẳng trống canh dồn,\nTrơ cái hồng nhan với nước non.\nChén rượu hương đưa say lại tỉnh,\nVầng trăng bóng xế khuyết chưa tròn.”\n(Trích “Tự tình II” — Hồ Xuân Hương) Cặp câu “Chén rượu hương đưa say lại tỉnh, / Vầng trăng bóng xế khuyết chưa tròn” thể hiện nghệ thuật gì?", "options": ["A. Kể chuyện", "B. Tả cảnh ngụ tình: mượn rượu và trăng để nói nỗi niềm — “say lại tỉnh” là vòng luẩn quẩn của kiếp người; trăng “khuyết chưa tròn” là ẩn dụ cho duyên phận dở dang", "C. Miêu tả đơn thuần", "D. Không nghệ thuật"], "answer": "B", "explain": "Tả cảnh ngụ tình: rượu, trăng là hình ảnh khách quan chở tâm trạng chủ quan — duyên phận “khuyết chưa tròn”, đời người “say lại tỉnh”.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hồ Xuân Hương được mệnh danh là “Bà chúa thơ Nôm”.", "b) Thơ Hồ Xuân Hương vừa trào phúng vừa trữ tình, thể hiện cá tính mạnh mẽ.", "c) “Tự tình II” bộc lộ nỗi đau thân phận người phụ nữ trong xã hội phong kiến.", "d) Bài thơ thể hiện sự cam chịu, buông xuôi trước số phận."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bài thơ thể hiện sự phản kháng, thách thức (“trơ”), khát vọng hạnh phúc — không cam chịu.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu tên hiệu mà người đời dành cho Hồ Xuân Hương.", "answer": "“Bà chúa thơ Nôm”", "explain": "Hồ Xuân Hương được mệnh danh là “Bà chúa thơ Nôm” — bậc thầy của thơ Nôm Đường luật với cá tính độc đáo.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích tâm trạng của nhân vật trữ tình qua đoạn thơ trong ngữ liệu Đề 6. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Đoạn thơ mở đầu “Tự tình II” bộc lộ tâm trạng phức tạp của nhân vật trữ tình: vừa cô đơn, chua xót vừa kiêu hãnh, thách thức. Giữa đêm khuya thanh vắng, “trơ cái hồng nhan với nước non” — chữ “trơ” đắt giá, vừa diễn tả sự trơ trọi một mình, vừa là thái độ trơ ra, dám đối mặt với đời. “Hồng nhan” mà phải “trơ” cùng “nước non” — nỗi đau của người phụ nữ tài sắc mà bất hạnh. Rồi “chén rượu hương đưa say lại tỉnh” — muốn say để quên mà vẫn tỉnh, vòng luẩn quẩn không lối thoát. “Vầng trăng bóng xế khuyết chưa tròn” — trăng khuyết là ẩn dụ cho duyên phận dở dang, tuổi xuân trôi qua mà hạnh phúc chưa tròn. Tả cảnh ngụ tình, Hồ Xuân Hương đã nói hộ nỗi lòng của bao người phụ nữ: đau đớn trước số phận nhưng không cam chịu, vẫn khát khao và thách thức — đó là vẻ đẹp vừa bi vừa hùng của thơ bà."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ phân tích bài thơ “Tự tình II” của Hồ Xuân Hương. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu Hồ Xuân Hương, bài thơ; vấn đề: tiếng nói phản kháng của người phụ nữ. 2. Thân bài: a) Hai câu đề: đêm khuya, nỗi cô đơn — “trơ cái hồng nhan”. b) Hai câu thực: say — tỉnh, trăng khuyết — duyên phận dở dang (tả cảnh ngụ tình). c) Hai câu luận: sự phản kháng, thách thức số phận. d) Hai câu kết: khát vọng hạnh phúc, tiếng nói nhân văn. e) Nghệ thuật: ngôn ngữ Nôm điêu luyện, hình ảnh giàu sức gợi, giọng vừa than vừa thách thức. f) Ý nghĩa: tiếng nói của người phụ nữ; giá trị nhân đạo. 3. Kết bài: khẳng định vị trí “Bà chúa thơ Nôm”; sức sống của tác phẩm."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNgười kể chuyện trong truyện ngắn có thể đứng ở nhiều vị trí khác nhau. Kể ở ngôi thứ nhất, người kể là nhân vật trong truyện — gần gũi, chân thực nhưng bị giới hạn bởi tầm nhìn của nhân vật. Kể ở ngôi thứ ba, người kể đứng ngoài câu chuyện — có thể toàn tri (biết hết) hoặc hạn tri (biết có giới hạn). Điểm nhìn toàn tri giúp bao quát, còn điểm nhìn hạn tri tạo kịch tính, bất ngờ. Việc lựa chọn ngôi kể và điểm nhìn không ngẫu nhiên: nó quyết định cách câu chuyện được kể và cảm xúc của người đọc. (Ngữ liệu lí thuyết — tự soạn) Người kể chuyện ở ngôi thứ nhất có đặc điểm gì?", "options": ["A. Biết hết mọi chuyện", "B. Là nhân vật trong truyện — gần gũi, chân thực nhưng bị giới hạn bởi tầm nhìn của nhân vật", "C. Đứng ngoài truyện", "D. Không có đặc điểm"], "answer": "B", "explain": "Ngôi thứ nhất: người kể đồng thời là nhân vật — ưu điểm chân thực, gần gũi; hạn chế là tầm nhìn bị giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNgười kể chuyện trong truyện ngắn có thể đứng ở nhiều vị trí khác nhau. Kể ở ngôi thứ nhất, người kể là nhân vật trong truyện — gần gũi, chân thực nhưng bị giới hạn bởi tầm nhìn của nhân vật. Kể ở ngôi thứ ba, người kể đứng ngoài câu chuyện — có thể toàn tri (biết hết) hoặc hạn tri (biết có giới hạn). Điểm nhìn toàn tri giúp bao quát, còn điểm nhìn hạn tri tạo kịch tính, bất ngờ. Việc lựa chọn ngôi kể và điểm nhìn không ngẫu nhiên: nó quyết định cách câu chuyện được kể và cảm xúc của người đọc. (Ngữ liệu lí thuyết — tự soạn) Điểm nhìn hạn tri khác điểm nhìn toàn tri ở điểm nào?", "options": ["A. Không khác", "B. Hạn tri: người kể chỉ biết có giới hạn (theo tầm nhìn nhân vật) — tạo kịch tính, bất ngờ; toàn tri: biết hết — giúp bao quát câu chuyện", "C. Hạn tri biết nhiều hơn", "D. Toàn tri gây bất ngờ hơn"], "answer": "B", "explain": "Hạn tri giới hạn thông tin nên tạo được bất ngờ, kịch tính; toàn tri bao quát nhưng ít bất ngờ hơn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nNgười kể chuyện trong truyện ngắn có thể đứng ở nhiều vị trí khác nhau. Kể ở ngôi thứ nhất, người kể là nhân vật trong truyện — gần gũi, chân thực nhưng bị giới hạn bởi tầm nhìn của nhân vật. Kể ở ngôi thứ ba, người kể đứng ngoài câu chuyện — có thể toàn tri (biết hết) hoặc hạn tri (biết có giới hạn). Điểm nhìn toàn tri giúp bao quát, còn điểm nhìn hạn tri tạo kịch tính, bất ngờ. Việc lựa chọn ngôi kể và điểm nhìn không ngẫu nhiên: nó quyết định cách câu chuyện được kể và cảm xúc của người đọc. (Ngữ liệu lí thuyết — tự soạn) Vì sao việc lựa chọn ngôi kể và điểm nhìn lại quan trọng?", "options": ["A. Không quan trọng", "B. Vì nó quyết định cách câu chuyện được kể, lượng thông tin người đọc nhận được và cảm xúc thẩm mĩ — là lựa chọn nghệ thuật có chủ ý của nhà văn", "C. Chỉ để khác biệt", "D. Do thói quen"], "answer": "B", "explain": "Ngôi kể, điểm nhìn là công cụ nghệ thuật: quyết định góc nhìn, thông tin, cảm xúc — nhà văn lựa chọn có chủ ý để đạt hiệu quả.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau (tổng hợp Bài 1):", "statements": ["a) Ngôi kể thứ nhất tạo sự gần gũi, chân thực.", "b) Điểm nhìn toàn tri giúp người kể biết hết mọi chuyện.", "c) Điểm nhìn hạn tri có thể tạo kịch tính, bất ngờ.", "d) Nhà văn chọn ngôi kể một cách ngẫu nhiên, không có chủ ý."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: lựa chọn ngôi kể, điểm nhìn là quyết định nghệ thuật có chủ ý.", "points": 1}, {"type": "short", "level": "NB", "q": "Kể tên hai ngôi kể cơ bản trong truyện kể.", "answer": "Ngôi thứ nhất và ngôi thứ ba", "explain": "Hai ngôi kể cơ bản: ngôi thứ nhất (người kể là nhân vật trong truyện) và ngôi thứ ba (người kể đứng ngoài câu chuyện).", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ phân tích tác dụng của việc lựa chọn ngôi kể trong một truyện ngắn em đã học. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Trong truyện ngắn “Chiếc lá cuối cùng”, O Hen-ri lựa chọn ngôi kể thứ ba với điểm nhìn toàn tri — và đó là lựa chọn nghệ thuật vô cùng khôn ngoan. Nhờ điểm nhìn toàn tri, người kể biết hết mọi chuyện: biết nỗi tuyệt vọng của cô gái, biết bí mật về chiếc lá do họa sĩ vẽ trong đêm bão — những điều mà các nhân vật không biết. Chính sự chênh lệch thông tin này tạo nên nút thắt bất ngờ ở cuối truyện, khiến người đọc xúc động mạnh khi sự thật được hé lộ. Nếu kể ở ngôi thứ nhất hạn tri, bí mật về chiếc lá khó được giữ đến cuối một cách tự nhiên như vậy. Qua đó, ta thấy ngôi kể và điểm nhìn không phải là lựa chọn ngẫu nhiên: chúng quyết định cách câu chuyện được kể, lượng thông tin người đọc nhận được và cảm xúc thẩm mĩ. Hiểu được điều này giúp em đọc truyện sâu sắc hơn, thấy được bàn tay nghệ thuật của nhà văn sau mỗi trang viết."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ bàn về vai trò của người kể chuyện và điểm nhìn trong truyện ngắn. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: đặt vấn đề — ai kể chuyện và kể như thế nào quyết định sức hấp dẫn của truyện. 2. Thân bài: a) Giải thích: người kể chuyện, ngôi kể, điểm nhìn. b) Ngôi thứ nhất: đặc điểm, tác dụng, ví dụ. c) Ngôi thứ ba: điểm nhìn toàn tri và hạn tri, tác dụng, ví dụ. d) Mối quan hệ giữa lựa chọn ngôi kể và hiệu quả nghệ thuật (dẫn chứng “Chiếc lá cuối cùng”). e) Ý nghĩa: hiểu ngôi kể giúp đọc sâu, viết hay. f) Liên hệ: khi viết văn, em sẽ chọn ngôi kể như thế nào. 3. Kết bài: khẳng định; lời nhắn nhủ đọc truyện bằng con mắt nghệ thuật."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nMột buổi chiều, tôi về thăm quê. Con đường làng vẫn quanh co, hàng tre vẫn xanh, nhưng những mái nhà tranh xưa đã nhường chỗ cho nhà ngói, nhà tầng. Bà con ra đón, tay bắt mặt mừng. Mẹ tôi đã già, tóc bạc nhiều, nhưng nụ cười vẫn hiền như xưa. Bữa cơm quê đạm bạc mà ấm cúng lạ thường. Đêm, nằm nghe tiếng côn trùng, tôi chợt nhận ra: quê hương thay đổi nhiều, nhưng tình người quê vẫn vẹn nguyên. Và chính tình người ấy là điều níu giữ bước chân người đi xa. (Tản văn “Về quê” — tự soạn) Văn bản “Về quê” thuộc thể loại nào?", "options": ["A. Truyện ngắn", "B. Tản văn (thuộc thể kí): ghi chép chân thực về chuyến về quê, kết hợp cảm xúc, suy ngẫm của cái “tôi” tác giả", "C. Thơ", "D. Kịch"], "answer": "B", "explain": "Ghi chép về chuyến đi thực, đậm cảm xúc và suy ngẫm của cái “tôi” — đặc trưng của tản văn (thể kí).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nMột buổi chiều, tôi về thăm quê. Con đường làng vẫn quanh co, hàng tre vẫn xanh, nhưng những mái nhà tranh xưa đã nhường chỗ cho nhà ngói, nhà tầng. Bà con ra đón, tay bắt mặt mừng. Mẹ tôi đã già, tóc bạc nhiều, nhưng nụ cười vẫn hiền như xưa. Bữa cơm quê đạm bạc mà ấm cúng lạ thường. Đêm, nằm nghe tiếng côn trùng, tôi chợt nhận ra: quê hương thay đổi nhiều, nhưng tình người quê vẫn vẹn nguyên. Và chính tình người ấy là điều níu giữ bước chân người đi xa. (Tản văn “Về quê” — tự soạn) Sự kết hợp giữa “ghi chép” và “tưởng tượng, cảm xúc” thể hiện ở đâu?", "options": ["A. Không có", "B. Ghi chép: con đường, hàng tre, nhà ngói, bữa cơm — những chi tiết thực; cảm xúc, suy ngẫm: “tình người quê vẫn vẹn nguyên”, “níu giữ bước chân người đi xa” — cái “tôi” trữ tình hòa vào sự thực", "C. Chỉ ghi chép", "D. Chỉ tưởng tượng"], "answer": "B", "explain": "Chi tiết thực (ghi chép) làm nền cho cảm xúc, suy ngẫm (chủ quan) — sự kết hợp đặc trưng của thể kí.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nMột buổi chiều, tôi về thăm quê. Con đường làng vẫn quanh co, hàng tre vẫn xanh, nhưng những mái nhà tranh xưa đã nhường chỗ cho nhà ngói, nhà tầng. Bà con ra đón, tay bắt mặt mừng. Mẹ tôi đã già, tóc bạc nhiều, nhưng nụ cười vẫn hiền như xưa. Bữa cơm quê đạm bạc mà ấm cúng lạ thường. Đêm, nằm nghe tiếng côn trùng, tôi chợt nhận ra: quê hương thay đổi nhiều, nhưng tình người quê vẫn vẹn nguyên. Và chính tình người ấy là điều níu giữ bước chân người đi xa. (Tản văn “Về quê” — tự soạn) Câu “quê hương thay đổi nhiều, nhưng tình người quê vẫn vẹn nguyên” thể hiện triết lí gì?", "options": ["A. Chê quê", "B. Triết lí về sự biến đổi và cái bất biến: vật chất đổi thay theo thời gian, nhưng tình người, cội nguồn là giá trị bền vững — điều níu giữ con người với quê hương", "C. Khoe quê", "D. Không triết lí"], "answer": "B", "explain": "Đối lập “thay đổi” và “vẹn nguyên” — khẳng định giá trị bền vững của tình người, cội nguồn trước sự biến đổi của vật chất.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau (tổng hợp Bài 7):", "statements": ["a) Kí là thể loại kết hợp ghi chép trung thực và tưởng tượng, cảm xúc.", "b) Tản văn là một tiểu loại của kí.", "c) Cái “tôi” của tác giả đóng vai trò quan trọng trong thể kí.", "d) Thể kí chỉ ghi chép sự thực, không có cảm xúc chủ quan."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: tùy bút, tản văn, du kí, truyện kí đều thuộc kí. c) Đúng. d) Sai: cảm xúc, suy ngẫm của cái “tôi” là linh hồn của thể kí.", "points": 1}, {"type": "short", "level": "TH", "q": "Kể tên bốn tiểu loại của thể kí.", "answer": "Tùy bút, tản văn, truyện kí, du kí (kí sự)", "explain": "Các tiểu loại của kí: tùy bút, tản văn, truyện kí, du kí (kí sự) — đều kết hợp ghi chép và sáng tạo.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ về tình cảm quê hương qua văn bản “Về quê” trong ngữ liệu Đề 8. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Tản văn “Về quê” gợi trong tôi những cảm xúc thân thương về quê hương. Tác giả ghi lại chuyến về quê bằng những chi tiết rất thực: con đường quanh co, hàng tre xanh, mái nhà tranh nhường chỗ cho nhà ngói, nụ cười hiền của mẹ già. Nhưng điều đọng lại sâu nhất không phải là sự đổi thay vật chất mà là “tình người quê vẫn vẹn nguyên” — cái bắt tay thân tình, bữa cơm đạm bạc mà ấm cúng. Câu kết “chính tình người ấy là điều níu giữ bước chân người đi xa” thật thấm thía: quê hương không chỉ là mảnh đất mà là tình người, là cội nguồn. Dù đi đâu, làm gì, mỗi người đều mang theo hình bóng quê nhà trong tim. Đọc tản văn, tôi thêm yêu quê hương mình và tự nhủ: hãy sống sao cho xứng đáng với tình cảm quê hương đã dành cho mình."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ về tình yêu quê hương của tuổi trẻ hôm nay. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: đặt vấn đề — quê hương là cội nguồn; tình yêu quê hương của tuổi trẻ có biểu hiện mới. 2. Thân bài: a) Giải thích: quê hương, tình yêu quê hương. b) Biểu hiện: nhớ quê, tự hào về quê; giữ gìn văn hóa quê; học tập tốt để xây dựng quê hương; quảng bá hình ảnh quê hương. c) Dẫn chứng: tấm gương tuổi trẻ lập nghiệp ở quê, tình nguyện vì quê. d) Phản đề: phê phán thói chê quê, quên cội nguồn, chỉ thích đô thị. e) Ý nghĩa: quê hương là điểm tựa tinh thần; yêu quê là yêu nước. f) Liên hệ bản thân: em sẽ làm gì cho quê hương. 3. Kết bài: khẳng định “quê hương là chùm khế ngọt”; lời nhắn nhủ."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Sen tàn, cúc lại nở hoa,\nSầu dài ngày ngắn, đông đà sang xuân.\nTìm đâu cho thấy cố nhân?\nLấy câu vận mệnh khuây dần nhớ thương.”\n(Trích “Truyện Kiều” — Nguyễn Du, đoạn Kiều ở lầu Ngưng Bích) Đoạn thơ trên trích từ tác phẩm nào, của ai?", "options": ["A. “Chinh phụ ngâm” — Đặng Trần Côn", "B. “Truyện Kiều” — Nguyễn Du (đoạn Kiều ở lầu Ngưng Bích)", "C. “Cung oán ngâm khúc” — Nguyễn Gia Thiều", "D. “Lục Vân Tiên” — Nguyễn Đình Chiểu"], "answer": "B", "explain": "Đoạn thơ trích từ “Truyện Kiều” của Nguyễn Du — cảnh Kiều một mình ở lầu Ngưng Bích, nhớ nhà, nhớ người yêu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Sen tàn, cúc lại nở hoa,\nSầu dài ngày ngắn, đông đà sang xuân.\nTìm đâu cho thấy cố nhân?\nLấy câu vận mệnh khuây dần nhớ thương.”\n(Trích “Truyện Kiều” — Nguyễn Du, đoạn Kiều ở lầu Ngưng Bích) Bút pháp “tả cảnh ngụ tình” thể hiện như thế nào trong đoạn thơ?", "options": ["A. Không có", "B. Cảnh vật (sen tàn, cúc nở, ngày ngắn, đông sang xuân) gợi vòng thời gian trôi — ngoại cảnh hòa vào tâm trạng: thời gian trôi mà người đi xa chưa về, nỗi “sầu dài” của Kiều", "C. Chỉ tả cảnh", "D. Chỉ tả tình"], "answer": "B", "explain": "Sen tàn — cúc nở, đông sang xuân: thời gian trôi gợi nỗi sầu; cảnh vật mang tâm trạng — tả cảnh ngụ tình đặc sắc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\n“Sen tàn, cúc lại nở hoa,\nSầu dài ngày ngắn, đông đà sang xuân.\nTìm đâu cho thấy cố nhân?\nLấy câu vận mệnh khuây dần nhớ thương.”\n(Trích “Truyện Kiều” — Nguyễn Du, đoạn Kiều ở lầu Ngưng Bích) Câu “Lấy câu vận mệnh khuây dần nhớ thương” cho thấy tâm trạng gì của Kiều?", "options": ["A. Vui vẻ", "B. Đành chấp nhận số phận, tự an ủi mình — tâm trạng cam chịu mà chua xót của người con gái tài hoa bạc mệnh", "C. Phản kháng", "D. Thờ ơ"], "answer": "B", "explain": "“Khuây dần” — tự dỗ dành, chấp nhận “vận mệnh”: nỗi đau của người không làm chủ được số phận mình.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau (tổng hợp Bài 6):", "statements": ["a) Nguyễn Du (1765 – 1820) là đại thi hào dân tộc, danh nhân văn hóa thế giới.", "b) “Truyện Kiều” viết bằng chữ Nôm, thể lục bát.", "c) Đoạn Kiều ở lầu Ngưng Bích thể hiện bút pháp tả cảnh ngụ tình đặc sắc.", "d) Nguyễn Du chỉ viết “Truyện Kiều”, không có tác phẩm chữ Hán."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: UNESCO vinh danh 1965. b) Đúng: 3254 câu lục bát chữ Nôm. c) Đúng. d) Sai: Nguyễn Du còn có “Thanh Hiên thi tập”, “Nam trung tạp ngâm”, “Bắc hành tạp lục” bằng chữ Hán.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên thể thơ và số câu của “Truyện Kiều”.", "answer": "Thể lục bát, 3254 câu", "explain": "“Truyện Kiều” gồm 3254 câu thơ lục bát viết bằng chữ Nôm — kiệt tác của văn học Việt Nam.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích tâm trạng Thúy Kiều qua đoạn thơ trong ngữ liệu Đề 9. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Đoạn thơ bộc lộ tâm trạng cô đơn, sầu nhớ của Thúy Kiều khi một mình ở lầu Ngưng Bích. Mở đầu, thời gian trôi qua hình ảnh “sen tàn, cúc lại nở hoa”, “đông đà sang xuân” — vòng tuần hoàn của tạo hóa tương phản với nỗi “sầu dài” không nguôi của con người. Câu hỏi tu từ “Tìm đâu cho thấy cố nhân?” là tiếng kêu xé lòng: nhớ cha mẹ, nhớ Kim Trọng mà bặt vô âm tín, không biết tìm đâu. Rồi Kiều đành “lấy câu vận mệnh khuây dần nhớ thương” — tự an ủi bằng thuyết định mệnh, chấp nhận số phận. Bút pháp tả cảnh ngụ tình của Nguyễn Du thật đặc sắc: cảnh vật không vô tri mà mang nỗi niềm con người. Qua đoạn thơ, ta thấy Nguyễn Du thấu hiểu sâu sắc nỗi đau của người phụ nữ tài hoa bạc mệnh, đồng thời cảm phục sức chịu đựng phi thường của Kiều — vẻ đẹp tâm hồn trong nghịch cảnh."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ phân tích đoạn trích Kiều ở lầu Ngưng Bích (Trích “Truyện Kiều” — Nguyễn Du). Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: giới thiệu Nguyễn Du, “Truyện Kiều”; vị trí đoạn trích (sau khi Kiều bị lừa vào lầu xanh). 2. Thân bài: a) Bức tranh thiên nhiên qua bút pháp tả cảnh ngụ tình (buồn trông...). b) Nỗi nhớ: nhớ Kim Trọng (tình yêu), nhớ cha mẹ (hiếu thảo) — tấm lòng thủy chung, hiếu nghĩa. c) Dự cảm về tương lai: “buồn trông” điệp lại, nỗi lo âu. d) Nghệ thuật: điệp ngữ, tả cảnh ngụ tình, ngôn ngữ độc thoại nội tâm. e) Ý nghĩa: vẻ đẹp tâm hồn Kiều; tấm lòng nhân đạo của Nguyễn Du. 3. Kết bài: khẳng định giá trị; “Truyện Kiều” sống mãi."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nMột năm học sắp khép lại. Nhìn lại, mỗi chúng ta đều đã đi một chặng đường dài: từ những bỡ ngỡ đầu năm đến sự trưởng thành hôm nay. Kiến thức Ngữ văn 11 không chỉ là những bài học trong sách — đó là hành trang để ta hiểu con người, hiểu cuộc đời. Từ điểm nhìn trong truyện kể đến cấu tứ trong thơ, từ bi kịch đến kí, từ văn bản nghị luận đến thông tin — mỗi bài học đều mở ra một ô cửa nhìn ra thế giới. Điều quý giá nhất mà môn Văn mang lại không phải là điểm số, mà là tâm hồn biết rung động trước cái đẹp, biết suy nghĩ trước lẽ phải — trái. Hãy mang theo hành trang ấy bước vào tương lai. (Ngữ liệu tổng kết — tự soạn) Theo ngữ liệu, điều quý giá nhất mà môn Ngữ văn mang lại là gì?", "options": ["A. Điểm số cao", "B. Tâm hồn biết rung động trước cái đẹp, biết suy nghĩ trước lẽ phải — trái", "C. Kĩ năng thi cử", "D. Bằng cấp"], "answer": "B", "explain": "Ngữ liệu khẳng định trực tiếp: “không phải là điểm số, mà là tâm hồn biết rung động...”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nMột năm học sắp khép lại. Nhìn lại, mỗi chúng ta đều đã đi một chặng đường dài: từ những bỡ ngỡ đầu năm đến sự trưởng thành hôm nay. Kiến thức Ngữ văn 11 không chỉ là những bài học trong sách — đó là hành trang để ta hiểu con người, hiểu cuộc đời. Từ điểm nhìn trong truyện kể đến cấu tứ trong thơ, từ bi kịch đến kí, từ văn bản nghị luận đến thông tin — mỗi bài học đều mở ra một ô cửa nhìn ra thế giới. Điều quý giá nhất mà môn Văn mang lại không phải là điểm số, mà là tâm hồn biết rung động trước cái đẹp, biết suy nghĩ trước lẽ phải — trái. Hãy mang theo hành trang ấy bước vào tương lai. (Ngữ liệu tổng kết — tự soạn) Hình ảnh “mỗi bài học đều mở ra một ô cửa nhìn ra thế giới” sử dụng biện pháp tu từ gì?", "options": ["A. Nhân hóa", "B. Ẩn dụ: bài học được ví như “ô cửa” — mỗi tri thức mở ra một góc nhìn mới về con người, cuộc đời", "C. So sánh có từ “như”", "D. Nói quá"], "answer": "B", "explain": "Ẩn dụ “ô cửa”: tri thức là cánh cửa mở ra thế giới — hình ảnh đẹp, giàu sức gợi về vai trò của học vấn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "📖 ĐỌC HIỂU — Đọc ngữ liệu sau và trả lời các câu 1 – 5:\nMột năm học sắp khép lại. Nhìn lại, mỗi chúng ta đều đã đi một chặng đường dài: từ những bỡ ngỡ đầu năm đến sự trưởng thành hôm nay. Kiến thức Ngữ văn 11 không chỉ là những bài học trong sách — đó là hành trang để ta hiểu con người, hiểu cuộc đời. Từ điểm nhìn trong truyện kể đến cấu tứ trong thơ, từ bi kịch đến kí, từ văn bản nghị luận đến thông tin — mỗi bài học đều mở ra một ô cửa nhìn ra thế giới. Điều quý giá nhất mà môn Văn mang lại không phải là điểm số, mà là tâm hồn biết rung động trước cái đẹp, biết suy nghĩ trước lẽ phải — trái. Hãy mang theo hành trang ấy bước vào tương lai. (Ngữ liệu tổng kết — tự soạn) Ngữ liệu trên có thể xem là văn bản thuộc kiểu nào?", "options": ["A. Truyện", "B. Văn bản nghị luận — biểu cảm tổng kết: bày tỏ quan điểm, đánh giá về giá trị của môn học, gửi gắm thông điệp — kết hợp nghị luận và trữ tình", "C. Thơ", "D. Văn bản thông tin"], "answer": "B", "explain": "Văn bản bày tỏ quan điểm (“điều quý giá nhất...”), đánh giá và gửi thông điệp — mang tính nghị luận kết hợp biểu cảm.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định sau (tổng hợp toàn năm):", "statements": ["a) Điểm nhìn và ngôi kể là tri thức trọng tâm của Bài 1.", "b) Cấu tứ và hình ảnh là tri thức trọng tâm của Bài 2.", "c) Văn bản nghị luận và văn bản thông tin đều cần dữ liệu, dẫn chứng thuyết phục.", "d) Học văn chỉ để thi cử, không có ý nghĩa với cuộc sống."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: cả hai đều cần căn cứ thuyết phục. d) Sai: học văn bồi dưỡng tâm hồn, nhân cách — hành trang vào đời.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên ba tác giả lớn em đã học trong chương trình Ngữ văn 11 và một tác phẩm tiêu biểu của mỗi người.", "answer": "Nguyễn Du – “Truyện Kiều”; Nguyễn Đình Chiểu – “Văn tế nghĩa sĩ Cần Giuộc” / “Lục Vân Tiên”; Hồ Xuân Hương – “Tự tình II”; Nguyễn Công Trứ – “Bài ca ngất ngưởng”; Sếch-xpia – “Rô-mê-ô và Giu-li-ét”...", "explain": "Các tác giả lớn: Nguyễn Du (“Truyện Kiều”), Nguyễn Đình Chiểu (“Văn tế nghĩa sĩ Cần Giuộc”), Hồ Xuân Hương (“Tự tình”), Nguyễn Công Trứ (“Bài ca ngất ngưởng”), Sếch-xpia (“Rô-mê-ô và Giu-li-ét”)...", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nghĩ của em về môn Ngữ văn sau một năm học lớp 11. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "BÀI MẪU (đoạn văn 200 chữ): Một năm học Ngữ văn 11 khép lại, để trong tôi nhiều cảm xúc và bài học quý giá. Tôi đã được gặp gỡ những con người phi thường: Nguyễn Du với tấm lòng nhân đạo mênh mông, Nguyễn Đình Chiểu mù lòa mà sáng ngời khí phách, Hồ Xuân Hương cá tính, kiêu hãnh. Tôi đã học cách đọc truyện bằng con mắt nghệ thuật — nhận ra điểm nhìn, cấu tứ; học cách lập luận sắc sảo, viết văn thuyết phục; học cách rung động trước cái đẹp của thơ ca. Mỗi bài học như một ô cửa mở ra thế giới: thế giới của con người với bao số phận, khát vọng. Điều quý giá nhất tôi nhận được không phải là điểm số mà là tâm hồn giàu có hơn, biết yêu thương, biết suy nghĩ. Mai này dù theo nghề gì, tôi sẽ mang theo hành trang ấy — hành trang của một con người biết sống đẹp, sống có ích."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận xã hội khoảng 600 chữ về vai trò của văn học trong đời sống tinh thần của con người. Câu tự luận — giáo viên chấm thủ công (points 0).", "points": 0, "explain": "DÀN Ý CHI TIẾT: 1. Mở bài: đặt vấn đề — trong thời đại công nghệ, văn học có còn cần thiết? Khẳng định: rất cần thiết. 2. Thân bài: a) Giải thích: văn học, đời sống tinh thần. b) Vai trò: bồi dưỡng tâm hồn, tình cảm (rung động trước cái đẹp); mở rộng hiểu biết về con người, cuộc đời; giáo dục nhân cách, lẽ sống; là nơi nương náu tinh thần, chữa lành tâm hồn; giữ gìn, lan tỏa văn hóa dân tộc. c) Dẫn chứng: tác động của tác phẩm văn học với bạn đọc; tấm gương người tìm thấy lẽ sống qua sách. d) Thực trạng: một bộ phận giới trẻ xa rời sách — nguyên nhân, hậu quả. e) Giải pháp: đưa sách đến gần bạn trẻ, đổi mới cách dạy văn. f) Liên hệ bản thân. 3. Kết bài: khẳng định “văn học là nhân học”; lời nhắn nhủ hãy đọc sách, yêu văn chương."}]}]}
