<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Chỉ số tổng hợp đánh giá sự phát triển con người của các quốc gia là","options":["A. GDP.","B. HDI.","C. CPI.","D. FDI."],"answer":"B","explain":"HDI (chỉ số phát triển con người) tổng hợp tuổi thọ, giáo dục và thu nhập.","points":0.25},{"type":"mcq","level":"NB","q":"WTO là tên viết tắt của","options":["A. Tổ chức Thương mại Thế giới.","B. Ngân hàng Thế giới.","C. Quỹ Tiền tệ Quốc tế.","D. Liên hợp quốc."],"answer":"A","explain":"WTO (World Trade Organization) là Tổ chức Thương mại Thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Liên hợp quốc được thành lập vào năm","options":["A. 1944.","B. 1945.","C. 1967.","D. 1995."],"answer":"B","explain":"Liên hợp quốc thành lập năm 1945.","points":0.25},{"type":"mcq","level":"NB","q":"Nhóm nước chiếm khoảng 80% dân số thế giới là","options":["A. Nhóm nước phát triển.","B. Nhóm nước đang phát triển.","C. Nhóm nước xuất khẩu dầu.","D. Nhóm nước công nghiệp mới."],"answer":"B","explain":"Nhóm nước đang phát triển chiếm khoảng 80% dân số thế giới.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao toàn cầu hóa được coi là xu thế tất yếu của kinh tế thế giới?","options":["A. Vì mọi nước đều muốn đóng cửa.","B. Vì phân công lao động quốc tế sâu sắc, không nước nào có thể phát triển độc lập ngoài mạng lưới liên kết toàn cầu.","C. Vì các nước bị ép buộc.","D. Vì toàn cầu hóa không mang lại lợi ích."],"answer":"B","explain":"Phân công lao động quốc tế và lợi ích của liên kết khiến không nước nào đứng ngoài được toàn cầu hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các vấn đề an ninh toàn cầu cần hợp tác quốc tế để giải quyết?","options":["A. Vì các nước đều giàu.","B. Vì các mối đe dọa vượt qua biên giới quốc gia, không nước nào tự giải quyết được.","C. Vì Liên hợp quốc ra lệnh.","D. Vì các nước không có chính phủ."],"answer":"B","explain":"Biến đổi khí hậu, dịch bệnh, khủng bố... vượt biên giới nên cần hợp tác quốc tế.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) HDI tổng hợp tuổi thọ, giáo dục và thu nhập.","b) Toàn cầu hóa kinh tế chỉ diễn ra ở châu Á.","c) Liên hợp quốc hiện có 193 quốc gia thành viên.","d) Bùng nổ dân số diễn ra chủ yếu ở nhóm nước phát triển."],"answer":["T","F","T","F"],"explain":"a), c) Đúng. b) Sai: toàn cầu hóa diễn ra trên toàn thế giới. d) Sai: bùng nổ dân số diễn ra ở nhóm nước đang phát triển.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ở nước phát triển, dịch vụ chiếm tỉ trọng rất cao trong GDP.","b) Khu vực hóa vừa cạnh tranh vừa bổ sung cho toàn cầu hóa.","c) Tây Nam Á và Bắc Phi thiếu nước ngọt nghiêm trọng.","d) GDP bình quân đầu người phản ánh đầy đủ mọi mặt của sự phát triển."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần thêm HDI và các chỉ tiêu xã hội.","points":1},{"type":"short","level":"NB","q":"Hiệp hội các quốc gia Đông Nam Á có tên viết tắt là gì?","answer":"ASEAN","explain":"ASEAN (Association of Southeast Asian Nations).","points":0.5},{"type":"short","level":"TH","q":"Tổ chức Thương mại Thế giới được thành lập vào năm nào?","answer":"1995","explain":"WTO thành lập năm 1995.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Khu vực kinh tế chiếm tỉ trọng lớn nhất trong GDP của nhóm nước phát triển là","options":["A. Nông nghiệp.","B. Công nghiệp.","C. Dịch vụ.","D. Khai khoáng."],"answer":"C","explain":"Ở nước phát triển, dịch vụ thường chiếm trên 70% GDP.","points":0.25},{"type":"mcq","level":"NB","q":"FDI là","options":["A. Đầu tư trực tiếp nước ngoài.","B. Viện trợ không hoàn lại.","C. Vay nợ quốc tế.","D. Xuất khẩu lao động."],"answer":"A","explain":"FDI (Foreign Direct Investment) là đầu tư trực tiếp nước ngoài.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức nào cung cấp vốn vay ưu đãi cho các nước đang phát triển?","options":["A. WB.","B. NATO.","C. UNESCO.","D. WHO."],"answer":"A","explain":"Ngân hàng Thế giới (WB) cung cấp vốn vay ưu đãi và hỗ trợ kĩ thuật.","points":0.25},{"type":"mcq","level":"NB","q":"Hiện tượng dân số nào diễn ra chủ yếu ở nhóm nước phát triển?","options":["A. Bùng nổ dân số.","B. Già hóa dân số.","C. Tăng dân số cơ học.","D. Di cư ồ ạt."],"answer":"B","explain":"Già hóa dân số diễn ra chủ yếu ở nhóm nước phát triển.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu hiện nào sau đây thuộc về khu vực hóa kinh tế?","options":["A. Thương mại toàn cầu tăng nhanh.","B. Sự ra đời của EU, ASEAN, APEC.","C. Công ty xuyên quốc gia mở rộng.","D. Thị trường tài chính toàn cầu liên thông."],"answer":"B","explain":"Sự ra đời của các tổ chức liên kết khu vực là biểu hiện của khu vực hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân chủ yếu gây mất an ninh lương thực ở châu Phi là","options":["A. Xung đột, hạn hán và nghèo đói.","B. Dân số quá ít.","C. Công nghệ quá hiện đại.","D. Thừa lương thực."],"answer":"A","explain":"Xung đột vũ trang, hạn hán do biến đổi khí hậu và nghèo đói gây mất an ninh lương thực ở châu Phi.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dịch vụ chiếm tỉ trọng lớn nhất trong GDP của nước phát triển.","b) FDI là đầu tư trực tiếp nước ngoài.","c) WB cung cấp vốn vay ưu đãi cho nước đang phát triển.","d) Già hóa dân số diễn ra chủ yếu ở nước đang phát triển."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: già hóa diễn ra ở nước phát triển.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) EU, ASEAN, APEC là các tổ chức liên kết kinh tế khu vực.","b) Xung đột và hạn hán gây mất an ninh lương thực ở châu Phi.","c) Biểu đồ tròn thích hợp để thể hiện cơ cấu GDP.","d) Toàn cầu hóa không có mặt tiêu cực nào."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: toàn cầu hóa có mặt tiêu cực như phân hóa giàu nghèo.","points":1},{"type":"short","level":"NB","q":"Năm 2022, dân số thế giới đã vượt mốc bao nhiêu tỉ người?","answer":"8","explain":"Năm 2022, dân số thế giới vượt mốc 8 tỉ người.","points":0.5},{"type":"short","level":"TH","q":"Liên kết kinh tế khu vực lớn nhất thế giới hiện nay là tổ chức nào?","answer":"EU","explain":"EU (Liên minh châu Âu) là liên kết kinh tế khu vực lớn nhất, chặt chẽ nhất.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Quốc gia nào thường đứng đầu thế giới về chỉ số HDI?","options":["A. Na Uy.","B. Ấn Độ.","C. Ni-giê.","D. Băng-la-đét."],"answer":"A","explain":"Na Uy, Thụy Sĩ thường đứng đầu thế giới về HDI.","points":0.25},{"type":"mcq","level":"NB","q":"Công ty xuyên quốc gia viết tắt là","options":["A. TNC.","B. GDP.","C. ODA.","D. NGO."],"answer":"A","explain":"TNC (Transnational Corporation) là công ty xuyên quốc gia.","points":0.25},{"type":"mcq","level":"NB","q":"Trụ sở chính của Liên hợp quốc đặt tại","options":["A. Niu Y-oóc (Hoa Kỳ).","B. Pa-ri (Pháp).","C. Luân Đôn (Anh).","D. Bắc Kinh (Trung Quốc)."],"answer":"A","explain":"Trụ sở chính LHQ đặt tại Niu Y-oóc, Hoa Kỳ.","points":0.25},{"type":"mcq","level":"NB","q":"Nguồn năng lượng nào là năng lượng tái tạo?","options":["A. Than đá.","B. Dầu mỏ.","C. Năng lượng mặt trời.","D. Khí tự nhiên."],"answer":"C","explain":"Năng lượng mặt trời, gió, thủy điện là năng lượng tái tạo.","points":0.25},{"type":"mcq","level":"TH","q":"Cho bảng số liệu: GDP/người (USD) năm 2020: Na Uy 89 000, Việt Nam 3 400, Bu-run-đi 300. Nhận xét đúng là","options":["A. Chênh lệch giữa các nước không đáng kể.","B. GDP/người của Na Uy gấp gần 300 lần Bu-run-đi, thể hiện chênh lệch rất lớn về trình độ phát triển.","C. Việt Nam có GDP/người cao nhất.","D. Bu-run-đi thuộc nhóm phát triển."],"answer":"B","explain":"89 000 chia 300 gần 300 lần — chênh lệch rất lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Giải pháp căn bản bảo đảm an ninh năng lượng là","options":["A. Khai thác tối đa nhiên liệu hóa thạch.","B. Sử dụng tiết kiệm và phát triển năng lượng tái tạo.","C. Ngừng sử dụng điện.","D. Chỉ dùng dầu mỏ."],"answer":"B","explain":"Tiết kiệm và phát triển năng lượng tái tạo là giải pháp căn bản, bền vững.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Na Uy thường đứng đầu thế giới về HDI.","b) TNC là công ty xuyên quốc gia.","c) Trụ sở LHQ đặt tại Niu Y-oóc.","d) Dầu mỏ là năng lượng tái tạo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: dầu mỏ là nhiên liệu hóa thạch.","points":1},{"type":"truefalse","level":"TH","q":"Dựa vào bảng số liệu GDP/người ở trên. Xét tính đúng, sai:","statements":["a) Na Uy có GDP/người cao nhất bảng.","b) GDP/người của Na Uy gấp gần 300 lần Bu-run-đi.","c) Số liệu thể hiện chênh lệch lớn về trình độ phát triển.","d) Bu-run-đi có GDP/người cao hơn Việt Nam."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Bu-run-đi 300 thấp hơn Việt Nam 3 400.","points":1},{"type":"short","level":"NB","q":"Tổ chức Thương mại Thế giới có tên viết tắt là gì?","answer":"WTO","explain":"WTO (World Trade Organization).","points":0.5},{"type":"short","level":"TH","q":"Dựa vào bảng số liệu, GDP/người của Na Uy (89 000 USD) gấp khoảng bao nhiêu lần Bu-run-đi (300 USD)? (làm tròn đến hàng đơn vị)","answer":"297","explain":"89 000 chia 300 bằng khoảng 296,7, làm tròn là 297 lần.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Đặc điểm cơ cấu kinh tế của nhóm nước đang phát triển là","options":["A. Dịch vụ chiếm trên 70% GDP.","B. Nông nghiệp vẫn chiếm tỉ trọng đáng kể.","C. Không còn nông nghiệp.","D. Chỉ có công nghiệp công nghệ cao."],"answer":"B","explain":"Ở nhiều nước đang phát triển, nông nghiệp vẫn chiếm tỉ trọng đáng kể.","points":0.25},{"type":"mcq","level":"TH","q":"Hệ quả tiêu cực của toàn cầu hóa là","options":["A. Mở rộng thị trường.","B. Phân hóa giàu nghèo giữa các nước ngày càng sâu sắc.","C. Tiếp cận công nghệ mới.","D. Tăng trưởng kinh tế."],"answer":"B","explain":"Phân hóa giàu nghèo, lệ thuộc, ô nhiễm môi trường là mặt tiêu cực của toàn cầu hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân gây tranh chấp nguồn nước giữa các quốc gia là","options":["A. Các dòng sông xuyên biên giới thiếu cơ chế chia sẻ công bằng.","B. Lượng mưa quá nhiều.","C. Các nước không cần nước.","D. Nước biển dâng."],"answer":"A","explain":"Sông xuyên biên giới như sông Nin dễ thành nguồn gốc xung đột nếu thiếu cơ chế chia sẻ.","points":0.25},{"type":"mcq","level":"TH","q":"Trong kinh tế tri thức, yếu tố nào là lực lượng sản xuất quan trọng nhất?","options":["A. Tài nguyên thiên nhiên.","B. Tri thức và công nghệ cao.","C. Lao động phổ thông.","D. Đất đai."],"answer":"B","explain":"Tri thức và công nghệ cao là lực lượng sản xuất trực tiếp quan trọng nhất của kinh tế tri thức.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: tỉ trọng dịch vụ trong GDP (%): Hoa Kỳ 77, Ấn Độ 49, Ni-giê-ri-a 44. Nước nào có cơ cấu kinh tế hiện đại nhất?","options":["A. Hoa Kỳ.","B. Ấn Độ.","C. Ni-giê-ri-a.","D. Cả ba như nhau."],"answer":"A","explain":"Hoa Kỳ có tỉ trọng dịch vụ cao nhất (77%) — cơ cấu hiện đại nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao GDP/người cao chưa đảm bảo HDI cao? (Ví dụ Ca-ta: GDP/người 62 000 USD nhưng HDI 0,848, thấp hơn Na Uy 0,957)","options":["A. Vì HDI tính cả tuổi thọ và giáo dục, không chỉ thu nhập.","B. Vì Ca-ta không có dân số.","C. Vì GDP tính sai.","D. Vì HDI không có ý nghĩa."],"answer":"A","explain":"HDI gồm 3 thành tố; thu nhập cao nhưng giáo dục, y tế chưa theo kịp thì HDI vẫn thấp hơn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ở nước đang phát triển, nông nghiệp vẫn chiếm tỉ trọng đáng kể.","b) Phân hóa giàu nghèo là mặt tiêu cực của toàn cầu hóa.","c) Sông xuyên biên giới thiếu cơ chế chia sẻ dễ gây tranh chấp.","d) Tri thức là lực lượng sản xuất quan trọng nhất của kinh tế tri thức."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu tỉ trọng dịch vụ ở trên. Xét tính đúng, sai:","statements":["a) Hoa Kỳ có tỉ trọng dịch vụ cao nhất bảng.","b) Tỉ trọng dịch vụ càng cao thì cơ cấu càng hiện đại.","c) Ấn Độ có tỉ trọng dịch vụ cao hơn Hoa Kỳ.","d) Chênh lệch giữa Hoa Kỳ và Ni-giê-ri-a là 33 điểm phần trăm."],"answer":["T","T","F","T"],"explain":"a), b) Đúng. c) Sai: 49% thấp hơn 77%. d) Đúng: 77 trừ 44 bằng 33.","points":1},{"type":"short","level":"TH","q":"Diễn đàn hợp tác kinh tế châu Á – Thái Bình Dương viết tắt là gì?","answer":"APEC","explain":"APEC (Asia-Pacific Economic Cooperation).","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, chênh lệch tỉ trọng dịch vụ giữa Hoa Kỳ (77%) và Ni-giê-ri-a (44%) là bao nhiêu điểm phần trăm?","answer":"33","explain":"77 trừ 44 bằng 33 điểm phần trăm.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"TH","q":"Nhóm nước công nghiệp mới (Hàn Quốc, Xin-ga-po) đã","options":["A. Vẫn thuộc nhóm kém phát triển nhất.","B. Vươn lên nhóm nước phát triển nhờ công nghiệp hóa nhanh.","C. Không hội nhập quốc tế.","D. Chỉ phát triển nông nghiệp."],"answer":"B","explain":"Các nước NICs đã công nghiệp hóa nhanh và vươn lên nhóm phát triển.","points":0.25},{"type":"mcq","level":"TH","q":"Vai trò của WTO là","options":["A. Thúc đẩy tự do hóa thương mại toàn cầu.","B. Cấm mọi hoạt động thương mại.","C. Chỉ bảo vệ nước giàu.","D. Quy định giá cả mọi mặt hàng."],"answer":"A","explain":"WTO thúc đẩy tự do hóa thương mại và giải quyết tranh chấp thương mại.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp bảo vệ nguồn nước ngọt là","options":["A. Xả thải trực tiếp ra sông.","B. Sử dụng tiết kiệm, chống lãng phí và ô nhiễm.","C. Khai thác nước ngầm vô tội vạ.","D. Lấp ao hồ."],"answer":"B","explain":"Sử dụng tiết kiệm, chống lãng phí và ô nhiễm là biện pháp căn bản.","points":0.25},{"type":"mcq","level":"TH","q":"Tháp dân số già có đặc điểm","options":["A. Đáy rộng, đỉnh nhọn.","B. Đáy hẹp, đỉnh mở rộng.","C. Hình tam giác đều.","D. Chỉ có trẻ em."],"answer":"B","explain":"Tháp già: đáy hẹp (sinh thấp), đỉnh rộng (người già đông).","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: kim ngạch xuất khẩu thế giới (nghìn tỉ USD): 2000: 6,4; 2020: 17,6. Tỉ số năm 2020 so với năm 2000 là","options":["A. Khoảng 1,5 lần.","B. Khoảng 2,75 lần.","C. Khoảng 5 lần.","D. Khoảng 10 lần."],"answer":"B","explain":"17,6 chia 6,4 bằng 2,75 lần — thương mại thế giới tăng nhanh.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao giá dầu biến động mạnh có thể gây khủng hoảng kinh tế toàn cầu?","options":["A. Vì dầu mỏ không được dùng nữa.","B. Vì dầu mỏ là nguồn năng lượng chủ yếu, giá dầu tăng đẩy chi phí sản xuất và lạm phát lên cao.","C. Vì mọi nước đều xuất khẩu dầu.","D. Vì giá dầu không ảnh hưởng sản xuất."],"answer":"B","explain":"Giá dầu tăng làm tăng chi phí sản xuất, vận chuyển — gây lạm phát và suy giảm tăng trưởng toàn cầu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàn Quốc, Xin-ga-po là những nước công nghiệp mới.","b) WTO thúc đẩy tự do hóa thương mại.","c) Sử dụng tiết kiệm giúp bảo vệ nguồn nước.","d) Tháp dân số già có đáy rộng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tháp già có đáy hẹp.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu xuất khẩu thế giới ở trên. Xét tính đúng, sai:","statements":["a) Kim ngạch năm 2020 gấp 2,75 lần năm 2000.","b) Thương mại thế giới tăng nhanh giai đoạn 2000 – 2020.","c) Số liệu thể hiện xu thế toàn cầu hóa thương mại.","d) Năm 2020 kim ngạch thấp hơn năm 2000."],"answer":["T","T","T","F"],"explain":"a) Đúng: 17,6 chia 6,4 bằng 2,75. b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Quỹ Tiền tệ Quốc tế có tên viết tắt là gì?","answer":"IMF","explain":"IMF (International Monetary Fund).","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, kim ngạch xuất khẩu thế giới năm 2020 gấp bao nhiêu lần năm 2000? (làm tròn đến 2 chữ số thập phân)","answer":"2,75","explain":"17,6 chia 6,4 bằng 2,75.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Để hội nhập hiệu quả, các nước đang phát triển cần","options":["A. Đóng cửa nền kinh tế.","B. Nâng cao năng lực cạnh tranh, phát triển nguồn nhân lực và khoa học – công nghệ.","C. Chỉ trông chờ viện trợ.","D. Từ chối đầu tư nước ngoài."],"answer":"B","explain":"Nâng cao năng lực cạnh tranh và nguồn nhân lực giúp hội nhập hiệu quả, hạn chế lệ thuộc.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa an ninh lương thực, năng lượng và nguồn nước là","options":["A. Hoàn toàn độc lập.","B. Gắn bó chặt chẽ: sản xuất lương thực cần nước và năng lượng.","C. Chỉ năng lượng quan trọng.","D. Không cần quan tâm."],"answer":"B","explain":"Ba vấn đề tạo thành mối liên kết: nông nghiệp cần nước tưới và năng lượng; sản xuất năng lượng cần nước.","points":0.25},{"type":"mcq","level":"TH","q":"Bùng nổ dân số bắt đầu từ","options":["A. Những năm 50 của thế kỉ XX.","B. Thế kỉ XVIII.","C. Năm 2020.","D. Thời nguyên thủy."],"answer":"A","explain":"Từ những năm 50 của thế kỉ XX, dân số thế giới tăng rất nhanh, chủ yếu ở nước đang phát triển.","points":0.25},{"type":"mcq","level":"TH","q":"Tổ chức khu vực ở châu Phi là","options":["A. AU.","B. EU.","C. ASEAN.","D. NATO."],"answer":"A","explain":"AU (African Union) là Liên minh châu Phi.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: vốn FDI vào nước đang phát triển (tỉ USD): 2000: 250; 2020: 870. Tỉ số năm 2020 so với năm 2000 là","options":["A. Khoảng 2 lần.","B. Khoảng 3,5 lần.","C. Khoảng 5 lần.","D. Khoảng 10 lần."],"answer":"B","explain":"870 chia 250 bằng 3,48 — khoảng 3,5 lần.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: cơ cấu tiêu thụ năng lượng thế giới 2020 (%): dầu 31, than 27, khí 25, tái tạo 12, khác 5. Tổng tỉ trọng nhiên liệu hóa thạch là","options":["A. 56%.","B. 83%.","C. 12%.","D. 31%."],"answer":"B","explain":"31 + 27 + 25 = 83% — nhiên liệu hóa thạch vẫn áp đảo.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nâng cao năng lực cạnh tranh giúp hội nhập hiệu quả.","b) An ninh lương thực, năng lượng, nguồn nước gắn bó với nhau.","c) Bùng nổ dân số bắt đầu từ những năm 50 của thế kỉ XX.","d) AU là tổ chức ở châu Âu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: AU là Liên minh châu Phi.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào hai bảng số liệu FDI và cơ cấu năng lượng ở trên. Xét tính đúng, sai:","statements":["a) FDI năm 2020 gấp khoảng 3,5 lần năm 2000.","b) Nhiên liệu hóa thạch chiếm 83% tiêu thụ năng lượng.","c) Năng lượng tái tạo đã thay thế hoàn toàn nhiên liệu hóa thạch.","d) Dòng vốn FDI tăng thể hiện toàn cầu hóa về đầu tư."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: tái tạo mới chiếm 12%.","points":1},{"type":"short","level":"TH","q":"Liên minh châu Phi có tên viết tắt là gì?","answer":"AU","explain":"AU (African Union) là Liên minh châu Phi.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, tổng tỉ trọng nhiên liệu hóa thạch trong tiêu thụ năng lượng thế giới năm 2020 là bao nhiêu phần trăm?","answer":"83","explain":"31 + 27 + 25 = 83%.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: HDI năm 2019: Na Uy 0,957; Việt Nam 0,704; Ni-giê 0,394. Chênh lệch HDI giữa Na Uy và Ni-giê là","options":["A. 0,253.","B. 0,563.","C. 0,310.","D. 0,704."],"answer":"B","explain":"0,957 trừ 0,394 bằng 0,563 — chênh lệch rất lớn.","points":0.25},{"type":"mcq","level":"VD","q":"Việt Nam gia nhập WTO năm 2007 đã giúp","options":["A. Mở rộng thị trường xuất khẩu và thu hút FDI.","B. Đóng cửa thị trường.","C. Giảm xuất khẩu.","D. Ngừng hội nhập."],"answer":"A","explain":"Gia nhập WTO giúp Việt Nam mở rộng thị trường, thu hút FDI và hội nhập sâu.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu dân số (triệu người): nhóm đang phát triển: 2000: 4 949; 2020: 6 522. Số dân tăng thêm giai đoạn 2000 – 2020 là","options":["A. 1 573 triệu người.","B. 573 triệu người.","C. 6 522 triệu người.","D. 4 949 triệu người."],"answer":"A","explain":"6 522 trừ 4 949 bằng 1 573 triệu người.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nước đang phát triển muốn phát triển kinh tế tri thức, điều kiện tiên quyết là","options":["A. Có nhiều tài nguyên.","B. Đầu tư mạnh cho giáo dục, nguồn nhân lực chất lượng cao và nghiên cứu khoa học.","C. Tăng dân số nhanh.","D. Đóng cửa với thế giới."],"answer":"B","explain":"Kinh tế tri thức dựa vào con người có tri thức — giáo dục và nhân lực là tiên quyết.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định đúng về tác động của toàn cầu hóa đối với văn hóa là","options":["A. Chỉ có tác động tích cực.","B. Vừa thúc đẩy giao lưu vừa đặt ra nguy cơ mai một bản sắc dân tộc.","C. Làm mọi nền văn hóa giống hệt nhau ngay.","D. Không ảnh hưởng gì."],"answer":"B","explain":"Toàn cầu hóa thúc đẩy giao lưu văn hóa nhưng cũng đe dọa bản sắc dân tộc.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện sự thay đổi cơ cấu GDP theo khu vực kinh tế giai đoạn 2000 – 2020, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ tròn.","C. Biểu đồ miền.","D. Biểu đồ cột đơn."],"answer":"C","explain":"Biểu đồ miền thể hiện sự thay đổi cơ cấu qua nhiều năm.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu HDI ở trên. Xét tính đúng, sai:","statements":["a) Na Uy có HDI cao nhất bảng.","b) Chênh lệch HDI giữa Na Uy và Ni-giê là 0,563.","c) Việt Nam có HDI cao hơn Ni-giê.","d) Ni-giê có HDI cao nhất bảng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Ni-giê thấp nhất (0,394).","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các nhận định:","statements":["a) Phát triển kinh tế tri thức cần đầu tư cho giáo dục và nhân lực.","b) Toàn cầu hóa vừa thúc đẩy giao lưu văn hóa vừa đe dọa bản sắc dân tộc.","c) Biểu đồ miền thích hợp để thể hiện thay đổi cơ cấu qua nhiều năm.","d) Nước đang phát triển không thể phát triển kinh tế tri thức."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhiều nước đang phát triển (Ấn Độ...) đã phát triển mạnh kinh tế tri thức.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, tính chênh lệch HDI giữa Na Uy (0,957) và Ni-giê (0,394), làm tròn đến 2 chữ số thập phân.","answer":"0,56","explain":"0,957 trừ 0,394 bằng 0,563, làm tròn là 0,56.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu dân số, số dân tăng thêm của nhóm nước đang phát triển giai đoạn 2000 – 2020 là bao nhiêu triệu người?","answer":"1573","explain":"6 522 trừ 4 949 bằng 1 573 triệu người.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: tỉ lệ tăng dân số tự nhiên (%): châu Phi 2,5; châu Âu 0,1. Tỉ lệ của châu Phi gấp bao nhiêu lần châu Âu?","options":["A. 2,5 lần.","B. 10 lần.","C. 25 lần.","D. 2,4 lần."],"answer":"C","explain":"2,5 chia 0,1 bằng 25 lần.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: số nước thành viên WTO: 1995: 128; 2023: 166. Nhận xét đúng là","options":["A. Số thành viên giảm.","B. Ngày càng nhiều nước tham gia, thể hiện xu thế tự do hóa thương mại.","C. WTO chỉ có thành viên châu Âu.","D. Năm 2023 có dưới 100 thành viên."],"answer":"B","explain":"Số thành viên tăng từ 128 lên 166 — xu thế tự do hóa thương mại toàn cầu.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh nói: “Nước A có GDP/người gấp đôi nước B nên trình độ phát triển của A chắc chắn cao hơn”. Nhận xét này","options":["A. Hoàn toàn đúng.","B. Chưa đủ cơ sở vì cần xét thêm HDI, cơ cấu kinh tế và chỉ tiêu xã hội.","C. Hoàn toàn sai.","D. Đúng vì GDP/người là duy nhất."],"answer":"B","explain":"Cần đánh giá tổng hợp qua HDI, cơ cấu kinh tế, giáo dục, y tế...","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: giá trị xuất khẩu phần mềm của Ấn Độ (tỉ USD): 2000: 6; 2020: 150. Tỉ số năm 2020 so với năm 2000 là","options":["A. 15 lần.","B. 20 lần.","C. 25 lần.","D. 30 lần."],"answer":"C","explain":"150 chia 6 bằng 25 lần — biểu hiện kinh tế tri thức ở nước đang phát triển.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong giải quyết tranh chấp nguồn nước xuyên biên giới, nguyên tắc quan trọng nhất là","options":["A. Nước thượng nguồn dùng tùy ý.","B. Sử dụng công bằng, hợp lí và không gây hại đáng kể cho các nước cùng lưu vực.","C. Nước mạnh được dùng nhiều hơn.","D. Cấm hoàn toàn sử dụng."],"answer":"B","explain":"Nguyên tắc sử dụng công bằng, hợp lí và không gây hại đáng kể được quốc tế thừa nhận.","points":0.25},{"type":"mcq","level":"VDC","q":"Giải pháp vừa bảo đảm an ninh năng lượng vừa bảo vệ môi trường là","options":["A. Mở rộng khai thác than.","B. Phát triển điện mặt trời, điện gió thay thế dần nhiên liệu hóa thạch.","C. Tăng nhập khẩu dầu.","D. Đốt rừng làm nương."],"answer":"B","explain":"Điện mặt trời, điện gió vừa đa dạng hóa nguồn cung vừa giảm phát thải.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu tỉ lệ tăng dân số ở trên. Xét tính đúng, sai:","statements":["a) Châu Phi có tỉ lệ tăng dân số cao nhất.","b) Tỉ lệ của châu Phi gấp 25 lần châu Âu.","c) Châu Âu có tỉ lệ tăng dân số thấp nhất.","d) Hai châu lục có tỉ lệ bằng nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 2,5 chia 0,1 bằng 25. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các nhận định:","statements":["a) Đánh giá trình độ phát triển cần tổng hợp nhiều chỉ tiêu, không chỉ GDP/người.","b) Xuất khẩu phần mềm tăng nhanh là biểu hiện của kinh tế tri thức.","c) Tranh chấp nguồn nước cần nguyên tắc sử dụng công bằng, hợp lí.","d) Năng lượng tái tạo vừa bảo đảm an ninh năng lượng vừa bảo vệ môi trường."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, tỉ lệ tăng dân số tự nhiên của châu Phi (2,5%) gấp bao nhiêu lần châu Âu (0,1%)?","answer":"25","explain":"2,5 chia 0,1 bằng 25 lần.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, giá trị xuất khẩu phần mềm của Ấn Độ năm 2020 gấp bao nhiêu lần năm 2000?","answer":"25","explain":"150 chia 6 bằng 25 lần.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"GDP bình quân đầu người được tính bằng cách","options":["A. Lấy GDP chia cho dân số.","B. Lấy dân số chia cho GDP.","C. Lấy GDP cộng dân số.","D. Lấy GDP nhân dân số."],"answer":"A","explain":"GDP/người = GDP chia cho tổng dân số.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức nào sau đây là tổ chức khu vực?","options":["A. Liên hợp quốc.","B. WTO.","C. ASEAN.","D. IMF."],"answer":"C","explain":"ASEAN là tổ chức khu vực Đông Nam Á; các tổ chức còn lại hoạt động toàn cầu.","points":0.25},{"type":"mcq","level":"NB","q":"Toàn cầu hóa kinh tế diễn ra trên phạm vi","options":["A. Toàn thế giới.","B. Chỉ châu Âu.","C. Chỉ châu Á.","D. Chỉ Bắc Mỹ."],"answer":"A","explain":"Toàn cầu hóa là quá trình liên kết kinh tế trên phạm vi toàn thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Vấn đề an ninh nào liên quan đến thiếu ăn, suy dinh dưỡng?","options":["A. An ninh năng lượng.","B. An ninh lương thực.","C. An ninh nguồn nước.","D. An ninh mạng."],"answer":"B","explain":"Thiếu ăn, suy dinh dưỡng liên quan đến an ninh lương thực.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: cơ cấu lao động theo khu vực (%): nước X: nông nghiệp 40, dịch vụ 35; nước Y: nông nghiệp 2, dịch vụ 78. Kết luận đúng là","options":["A. X là nước phát triển, Y là
