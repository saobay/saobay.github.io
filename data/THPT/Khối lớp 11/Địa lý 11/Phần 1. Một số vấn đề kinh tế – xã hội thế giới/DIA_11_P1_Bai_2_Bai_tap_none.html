<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Toàn cầu hóa kinh tế là quá trình","options":["A. Các nước đóng cửa nền kinh tế.","B. Tăng cường liên kết, phụ thuộc lẫn nhau về kinh tế giữa các quốc gia trên phạm vi toàn thế giới.","C. Chỉ các nước giàu hợp tác với nhau.","D. Xóa bỏ hoàn toàn thương mại quốc tế."],"answer":"B","explain":"Toàn cầu hóa kinh tế là quá trình tăng cường liên kết, phụ thuộc lẫn nhau về kinh tế giữa các quốc gia trên phạm vi toàn thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện nào sau đây của toàn cầu hóa kinh tế?","options":["A. Thương mại thế giới phát triển mạnh.","B. Các nước hạn chế xuất nhập khẩu.","C. Dòng vốn đầu tư bị ngăn chặn.","D. Các nước không hợp tác khoa học – công nghệ."],"answer":"A","explain":"Thương mại thế giới phát triển mạnh với tốc độ tăng cao hơn tốc độ tăng GDP là biểu hiện nổi bật của toàn cầu hóa.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức Thương mại Thế giới có tên viết tắt là","options":["A. WB.","B. IMF.","C. WTO.","D. WHO."],"answer":"C","explain":"WTO (World Trade Organization) là Tổ chức Thương mại Thế giới, thúc đẩy tự do hóa thương mại toàn cầu.","points":0.25},{"type":"mcq","level":"NB","q":"Khu vực hóa kinh tế là quá trình","options":["A. Các quốc gia trong một khu vực liên kết, hợp tác với nhau về kinh tế.","B. Mỗi quốc gia phát triển độc lập.","C. Chỉ các nước giàu liên kết với nhau.","D. Xóa bỏ mọi tổ chức khu vực."],"answer":"A","explain":"Khu vực hóa kinh tế là quá trình các quốc gia trong một khu vực liên kết, hợp tác với nhau về kinh tế nhằm cùng phát triển.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao toàn cầu hóa kinh tế vừa là cơ hội vừa là thách thức đối với các nước đang phát triển?","options":["A. Vì chỉ mang lại lợi ích, không có rủi ro.","B. Vì mang lại thị trường, vốn và công nghệ nhưng cũng đặt ra cạnh tranh gay gắt và nguy cơ lệ thuộc.","C. Vì các nước đang phát triển không thể hội nhập.","D. Vì toàn cầu hóa chỉ có mặt tiêu cực."],"answer":"B","explain":"Toàn cầu hóa mở ra thị trường, vốn, công nghệ (cơ hội) nhưng cũng gây cạnh tranh gay gắt, phân hóa giàu nghèo, nguy cơ lệ thuộc (thách thức).","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa toàn cầu hóa và khu vực hóa kinh tế là","options":["A. Loại trừ lẫn nhau hoàn toàn.","B. Vừa cạnh tranh vừa bổ sung cho nhau.","C. Không liên quan gì đến nhau.","D. Khu vực hóa thay thế toàn cầu hóa."],"answer":"B","explain":"Khu vực hóa tạo bước đệm để các nước hội nhập toàn cầu; toàn cầu hóa thúc đẩy các nước liên kết khu vực để tăng sức cạnh tranh.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thương mại thế giới tăng nhanh là một biểu hiện của toàn cầu hóa kinh tế.","b) FDI là vốn đầu tư trực tiếp nước ngoài.","c) Toàn cầu hóa kinh tế chỉ diễn ra ở châu Âu.","d) Các công ty xuyên quốc gia ngày càng có vai trò lớn trong kinh tế thế giới."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: toàn cầu hóa diễn ra trên phạm vi toàn thế giới.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khu vực hóa tạo bước đệm để các nước hội nhập vào toàn cầu hóa.","b) EU là liên kết kinh tế khu vực lớn nhất và chặt chẽ nhất thế giới.","c) Toàn cầu hóa và khu vực hóa loại trừ lẫn nhau.","d) ASEAN là tổ chức liên kết kinh tế khu vực ở Đông Nam Á."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: hai quá trình vừa cạnh tranh vừa bổ sung cho nhau.","points":1},{"type":"short","level":"NB","q":"Tên viết tắt của Tổ chức Thương mại Thế giới là gì?","answer":"WTO","explain":"WTO (World Trade Organization) là Tổ chức Thương mại Thế giới.","points":0.5},{"type":"short","level":"TH","q":"Liên kết kinh tế khu vực lớn nhất và chặt chẽ nhất thế giới hiện nay là tổ chức nào?","answer":"EU","explain":"EU (Liên minh châu Âu) là liên kết kinh tế khu vực lớn nhất, chặt chẽ nhất thế giới.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"FDI là hình thức","options":["A. Đầu tư trực tiếp nước ngoài.","B. Viện trợ không hoàn lại.","C. Vay nợ nước ngoài.","D. Xuất khẩu lao động."],"answer":"A","explain":"FDI (Foreign Direct Investment) là đầu tư trực tiếp nước ngoài — dòng vốn đầu tư chảy qua biên giới để sản xuất, kinh doanh.","points":0.25},{"type":"mcq","level":"NB","q":"Công ty xuyên quốc gia có tên viết tắt là","options":["A. NGO.","B. TNC.","C. GDP.","D. ODA."],"answer":"B","explain":"TNC (Transnational Corporation) là công ty xuyên quốc gia, hoạt động sản xuất kinh doanh ở nhiều nước.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức liên kết kinh tế khu vực ở Bắc Mỹ hiện nay là","options":["A. EU.","B. ASEAN.","C. USMCA.","D. MERCOSUR."],"answer":"C","explain":"USMCA (trước đây là NAFTA) là khu vực mậu dịch tự do Bắc Mỹ gồm Hoa Kỳ, Ca-na-đa và Mê-hi-cô.","points":0.25},{"type":"mcq","level":"NB","q":"Nền kinh tế tri thức phát triển dựa chủ yếu vào","options":["A. Khai thác tài nguyên thô.","B. Lao động phổ thông giá rẻ.","C. Tri thức, công nghệ cao và lao động trí tuệ.","D. Nông nghiệp truyền thống."],"answer":"C","explain":"Kinh tế tri thức là nền kinh tế mà sáng tạo, phân phối và sử dụng tri thức, công nghệ cao đóng vai trò quyết định.","points":0.25},{"type":"mcq","level":"TH","q":"Hệ quả tích cực của toàn cầu hóa kinh tế là","options":["A. Thúc đẩy tăng trưởng kinh tế, mở rộng thị trường và chuyên môn hóa sản xuất.","B. Làm mọi nước giàu lên như nhau.","C. Xóa bỏ hoàn toàn nghèo đói.","D. Giảm cạnh tranh giữa các nước."],"answer":"A","explain":"Toàn cầu hóa thúc đẩy tăng trưởng, mở rộng thị trường, chuyên môn hóa sản xuất và giúp tiếp cận vốn, công nghệ mới.","points":0.25},{"type":"mcq","level":"TH","q":"Hệ quả tiêu cực của toàn cầu hóa kinh tế là","options":["A. Tăng cường giao lưu văn hóa.","B. Phân hóa giàu nghèo giữa các nước ngày càng sâu sắc.","C. Mở rộng thị trường tiêu thụ.","D. Nâng cao trình độ công nghệ."],"answer":"B","explain":"Toàn cầu hóa làm phân hóa giàu nghèo sâu sắc, gây lệ thuộc, ô nhiễm môi trường và nguy cơ mai một bản sắc văn hóa.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dòng vốn FDI tăng nhanh là biểu hiện của toàn cầu hóa kinh tế.","b) Các công ty xuyên quốc gia chi phối nhiều lĩnh vực sản xuất toàn cầu.","c) Kinh tế tri thức dựa chủ yếu vào khai thác tài nguyên thô.","d) APEC là Diễn đàn hợp tác kinh tế châu Á – Thái Bình Dương."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: kinh tế tri thức dựa vào tri thức và công nghệ cao, không phải tài nguyên thô.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Toàn cầu hóa thúc đẩy chuyên môn hóa sản xuất và nâng cao hiệu quả kinh tế.","b) Khu vực hóa có thể tạo ra sự phân biệt đối xử với các nước ngoài khối.","c) Ô nhiễm môi trường mang tính toàn cầu là thách thức của toàn cầu hóa.","d) Nguy cơ mai một bản sắc văn hóa là mặt tích cực của toàn cầu hóa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mai một bản sắc văn hóa là mặt tiêu cực của toàn cầu hóa.","points":1},{"type":"short","level":"NB","q":"Tên viết tắt của công ty xuyên quốc gia là gì?","answer":"TNC","explain":"TNC (Transnational Corporation) là công ty xuyên quốc gia.","points":0.5},{"type":"short","level":"TH","q":"Diễn đàn hợp tác kinh tế châu Á – Thái Bình Dương có tên viết tắt là gì?","answer":"APEC","explain":"APEC (Asia-Pacific Economic Cooperation) là Diễn đàn hợp tác kinh tế châu Á – Thái Bình Dương.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Tốc độ tăng trưởng thương mại thế giới so với tốc độ tăng trưởng GDP thế giới thường","options":["A. Thấp hơn nhiều.","B. Cao hơn.","C. Bằng nhau tuyệt đối.","D. Không so sánh được."],"answer":"B","explain":"Tốc độ tăng trưởng thương mại thế giới thường cao hơn tốc độ tăng trưởng GDP — biểu hiện của tự do hóa thương mại.","points":0.25},{"type":"mcq","level":"NB","q":"MERCOSUR là tổ chức liên kết kinh tế khu vực ở","options":["A. Nam Mỹ.","B. Bắc Mỹ.","C. Châu Âu.","D. Châu Phi."],"answer":"A","explain":"MERCOSUR (Thị trường chung Nam Mỹ) là tổ chức liên kết kinh tế khu vực ở Nam Mỹ.","points":0.25},{"type":"mcq","level":"NB","q":"Trong nền kinh tế tri thức, loại lao động nào chiếm tỉ trọng lớn?","options":["A. Lao động phổ thông.","B. Lao động trí tuệ, có trình độ cao.","C. Lao động chân tay.","D. Lao động thời vụ."],"answer":"B","explain":"Kinh tế tri thức sử dụng chủ yếu lao động trí tuệ, có trình độ cao.","points":0.25},{"type":"mcq","level":"NB","q":"Ngành nào sau đây thuộc nhóm ngành công nghệ cao của nền kinh tế tri thức?","options":["A. Khai thác than.","B. Điện tử – tin học.","C. Trồng lúa nước.","D. Đánh bắt cá thủ công."],"answer":"B","explain":"Điện tử – tin học, công nghệ sinh học, vật liệu mới... là các ngành công nghệ cao của kinh tế tri thức.","points":0.25},{"type":"mcq","level":"TH","q":"Cho bảng số liệu: kim ngạch xuất khẩu hàng hóa thế giới (nghìn tỉ USD): năm 2000: 6,4; năm 2010: 15,2; năm 2020: 17,6. Nhận xét nào sau đây đúng?","options":["A. Thương mại thế giới giảm liên tục.","B. Thương mại thế giới tăng nhanh, thể hiện xu thế toàn cầu hóa về thương mại.","C. Năm 2020 xuất khẩu thấp hơn năm 2000.","D. Thương mại thế giới không thay đổi."],"answer":"B","explain":"Kim ngạch xuất khẩu tăng từ 6,4 lên 17,6 nghìn tỉ USD — tăng nhanh, thể hiện toàn cầu hóa thương mại.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các nước đang phát triển vừa muốn hội nhập toàn cầu vừa lo ngại?","options":["A. Vì hội nhập chỉ có lợi, không có hại.","B. Vì hội nhập mang lại vốn, công nghệ, thị trường nhưng cũng đặt ra cạnh tranh gay gắt và nguy cơ lệ thuộc.","C. Vì các nước này không cần vốn đầu tư.","D. Vì hội nhập làm giảm xuất khẩu."],"answer":"B","explain":"Hội nhập mang cơ hội (vốn, công nghệ, thị trường) nhưng cũng là thách thức (cạnh tranh, lệ thuộc, phân hóa).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tốc độ tăng trưởng thương mại thường cao hơn tốc độ tăng trưởng GDP.","b) MERCOSUR là tổ chức liên kết kinh tế ở Nam Mỹ.","c) Kinh tế tri thức coi nhẹ vai trò của sáng tạo.","d) Lao động trí tuệ đóng vai trò quan trọng trong kinh tế tri thức."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: sáng tạo, đổi mới là cốt lõi của kinh tế tri thức.","points":1},{"type":"truefalse","level":"TH","q":"Dựa vào bảng số liệu kim ngạch xuất khẩu thế giới ở trên. Xét tính đúng, sai:","statements":["a) Kim ngạch xuất khẩu năm 2020 gấp khoảng 2,75 lần năm 2000.","b) Thương mại thế giới tăng liên tục trong giai đoạn 2000 – 2020.","c) Số liệu chứng tỏ xu thế toàn cầu hóa về thương mại.","d) Năm 2010 kim ngạch xuất khẩu giảm so với năm 2000."],"answer":["T","T","T","F"],"explain":"a) Đúng: 17,6 chia 6,4 bằng 2,75. b), c) Đúng. d) Sai: năm 2010 là 15,2, cao hơn năm 2000.","points":1},{"type":"short","level":"NB","q":"Thị trường chung Nam Mỹ có tên viết tắt là gì?","answer":"MERCOSUR","explain":"MERCOSUR là Thị trường chung Nam Mỹ.","points":0.5},{"type":"short","level":"TH","q":"Dựa vào bảng số liệu kim ngạch xuất khẩu, tính tỉ số giữa năm 2020 và năm 2000 (17,6 chia 6,4), làm tròn đến 2 chữ số thập phân.","answer":"2,75","explain":"17,6 chia 6,4 bằng 2,75.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Biểu hiện nào sau đây KHÔNG phải của toàn cầu hóa kinh tế?","options":["A. Thương mại thế giới phát triển mạnh.","B. Dòng vốn FDI tăng nhanh.","C. Các nước đóng cửa biên giới, hạn chế giao thương.","D. Hợp tác quốc tế về khoa học – công nghệ mở rộng."],"answer":"C","explain":"Đóng cửa biên giới, hạn chế giao thương là ngược lại với toàn cầu hóa — đó là chủ nghĩa bảo hộ.","points":0.25},{"type":"mcq","level":"TH","q":"Lợi ích của khu vực hóa kinh tế đối với các nước thành viên là","options":["A. Mở rộng thị trường trong khu vực, thu hút đầu tư và tăng cường hợp tác.","B. Giảm hoàn toàn cạnh tranh.","C. Không cần hội nhập toàn cầu nữa.","D. Được miễn mọi nghĩa vụ quốc tế."],"answer":"A","explain":"Khu vực hóa giúp mở rộng thị trường nội khối, thu hút đầu tư, tăng cường hợp tác và nâng cao vị thế đàm phán quốc tế.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc điểm nổi bật của sản phẩm trong nền kinh tế tri thức là","options":["A. Hàm lượng tài nguyên thô rất cao.","B. Hàm lượng tri thức, công nghệ trong mỗi sản phẩm ngày càng cao.","C. Giá thành luôn rẻ nhất.","D. Không cần đổi mới sáng tạo."],"answer":"B","explain":"Trong kinh tế tri thức, giá trị sản phẩm chủ yếu nằm ở hàm lượng tri thức và công nghệ, đòi hỏi đổi mới liên tục.","points":0.25},{"type":"mcq","level":"TH","q":"Thách thức lớn nhất của toàn cầu hóa đối với các nước đang phát triển là","options":["A. Thiếu thị trường tiêu thụ.","B. Cạnh tranh gay gắt và nguy cơ lệ thuộc về vốn, công nghệ.","C. Thừa lao động chất lượng cao.","D. Không tiếp cận được thông tin."],"answer":"B","explain":"Năng lực cạnh tranh còn yếu khiến các nước đang phát triển dễ bị thua thiệt và lệ thuộc vào vốn, công nghệ của nước phát triển.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: vốn FDI vào các nước đang phát triển (tỉ USD): năm 2000: 250; năm 2010: 600; năm 2020: 870. Nhận xét nào sau đây đúng?","options":["A. Dòng vốn FDI vào nước đang phát triển tăng nhanh, thể hiện toàn cầu hóa về đầu tư.","B. FDI vào nước đang phát triển giảm liên tục.","C. Năm 2020 FDI thấp hơn năm 2000.","D. Toàn cầu hóa không liên quan đến đầu tư."],"answer":"A","explain":"FDI tăng từ 250 lên 870 tỉ USD — tăng nhanh, thể hiện dòng vốn xuyên biên giới mạnh mẽ của toàn cầu hóa.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nói khu vực hóa kinh tế vừa cạnh tranh vừa bổ sung cho toàn cầu hóa?","options":["A. Vì khu vực hóa ngăn cản toàn cầu hóa hoàn toàn.","B. Vì các khối khu vực vừa bảo vệ lợi ích nội khối (cạnh tranh) vừa tạo bước đệm để thành viên hội nhập toàn cầu (bổ sung).","C. Vì hai quá trình không liên quan.","D. Vì khu vực hóa chỉ có ở châu Âu."],"answer":"B","explain":"Các khối có thể ưu đãi nội khối gây cạnh tranh với bên ngoài, nhưng đồng thời giúp thành viên lớn mạnh để hội nhập toàn cầu tốt hơn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đóng cửa biên giới, hạn chế giao thương không phải là biểu hiện của toàn cầu hóa.","b) Khu vực hóa giúp các nước thành viên mở rộng thị trường.","c) Sản phẩm của kinh tế tri thức có hàm lượng tri thức ngày càng cao.","d) Toàn cầu hóa không đặt ra thách thức nào cho các nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: toàn cầu hóa đặt ra nhiều thách thức như cạnh tranh gay gắt, phân hóa giàu nghèo.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu vốn FDI ở trên. Xét tính đúng, sai:","statements":["a) Vốn FDI năm 2020 gấp khoảng 3,5 lần năm 2000.","b) Dòng vốn FDI vào nước đang phát triển tăng liên tục giai đoạn 2000 – 2020.","c) Dòng vốn đầu tư chủ yếu chảy từ nước phát triển sang nước đang phát triển.","d) Số liệu cho thấy dòng vốn đầu tư đang giảm dần."],"answer":["T","T","T","F"],"explain":"a) Đúng: 870 chia 250 bằng 3,48, khoảng 3,5 lần. b), c) Đúng. d) Sai: số liệu tăng liên tục.","points":1},{"type":"short","level":"TH","q":"Tổ chức liên kết kinh tế khu vực ở Đông Nam Á có tên là gì?","answer":"ASEAN","explain":"ASEAN (Hiệp hội các quốc gia Đông Nam Á) là tổ chức liên kết kinh tế khu vực ở Đông Nam Á.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu FDI, tính tỉ số vốn FDI năm 2020 so với năm 2000 (870 chia 250), làm tròn đến 1 chữ số thập phân.","answer":"3,5","explain":"870 chia 250 bằng 3,48, làm tròn 1 chữ số thập phân là 3,5.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"TH","q":"Vai trò chủ yếu của WTO trong thương mại thế giới là","options":["A. Ngăn cấm mọi hoạt động xuất nhập khẩu.","B. Thúc đẩy tự do hóa thương mại và giải quyết tranh chấp thương mại.","C. Chỉ bảo vệ lợi ích của nước giàu.","D. Quy định giá cả mọi mặt hàng."],"answer":"B","explain":"WTO thúc đẩy tự do hóa thương mại toàn cầu, xây dựng luật chơi chung và giải quyết tranh chấp thương mại giữa các thành viên.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu hiện của khu vực hóa kinh tế là sự","options":["A. Ra đời và phát triển của các tổ chức liên kết kinh tế khu vực.","B. Giải thể mọi tổ chức quốc tế.","C. Các nước ngừng buôn bán với nhau.","D. Xóa bỏ mọi hiệp định thương mại."],"answer":"A","explain":"Sự ra đời của EU, ASEAN, APEC, USMCA, MERCOSUR... là biểu hiện rõ nhất của khu vực hóa kinh tế.","points":0.25},{"type":"mcq","level":"TH","q":"Ngành nào sau đây thuộc nhóm ngành công nghệ cao?","options":["A. Công nghệ sinh học.","B. Khai thác cát.","C. Đốn gỗ thủ công.","D. Làm muối thủ công."],"answer":"A","explain":"Công nghệ sinh học, điện tử – tin học, vật liệu mới, năng lượng mới là các ngành công nghệ cao của kinh tế tri thức.","points":0.25},{"type":"mcq","level":"TH","q":"Tác động tích cực của các công ty xuyên quốc gia đối với nước tiếp nhận đầu tư là","options":["A. Tạo việc làm, chuyển giao công nghệ và tăng nguồn thu.","B. Làm giảm hoàn toàn ô nhiễm.","C. Xóa bỏ mọi doanh nghiệp trong nước.","D. Không tạo ra việc làm nào."],"answer":"A","explain":"TNC mang vốn, công nghệ, tạo việc làm và nguồn thu cho nước tiếp nhận; mặt trái là có thể gây ô nhiễm và chèn ép doanh nghiệp nội địa.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: tỉ trọng xuất khẩu của các nước đang phát triển trong tổng xuất khẩu thế giới (%): năm 2000: 32; năm 2010: 44; năm 2020: 46. Nhận xét nào sau đây đúng?","options":["A. Vai trò của các nước đang phát triển trong thương mại toàn cầu ngày càng tăng.","B. Các nước đang phát triển không tham gia thương mại toàn cầu.","C. Tỉ trọng xuất khẩu của nhóm này giảm liên tục.","D. Năm 2020 tỉ trọng thấp hơn năm 2000."],"answer":"A","explain":"Tỉ trọng tăng từ 32% lên 46% — vai trò của các nước đang phát triển trong thương mại toàn cầu ngày càng lớn.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao toàn cầu hóa có thể làm gia tăng các vấn đề môi trường mang tính toàn cầu?","options":["A. Vì các nước ngừng sản xuất.","B. Vì mở rộng sản xuất và tiêu dùng trên quy mô toàn cầu làm tăng khai thác tài nguyên và phát thải.","C. Vì môi trường không liên quan đến kinh tế.","D. Vì toàn cầu hóa làm giảm dân số."],"answer":"B","explain":"Sản xuất và tiêu dùng mở rộng toàn cầu kéo theo khai thác tài nguyên mạnh, phát thải lớn — gây biến đổi khí hậu, ô nhiễm xuyên biên giới.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) WTO thúc đẩy tự do hóa thương mại toàn cầu.","b) Sự ra đời của các tổ chức liên kết khu vực là biểu hiện của khu vực hóa.","c) Công nghệ sinh học là ngành công nghệ cao.","d) Công ty xuyên quốc gia không tạo ra việc làm cho nước tiếp nhận."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: TNC tạo nhiều việc làm cho nước tiếp nhận đầu tư.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu tỉ trọng xuất khẩu của các nước đang phát triển ở trên. Xét tính đúng, sai:","statements":["a) Tỉ trọng xuất khẩu năm 2020 tăng 14 điểm phần trăm so với năm 2000.","b) Vai trò của các nước đang phát triển trong thương mại toàn cầu tăng lên.","c) Năm 2010 tỉ trọng đạt 44%.","d) Số liệu cho thấy các nước đang phát triển bị gạt ra khỏi thương mại toàn cầu."],"answer":["T","T","T","F"],"explain":"a) Đúng: 46 trừ 32 bằng 14. b), c) Đúng. d) Sai: ngược lại, vai trò của nhóm này tăng lên.","points":1},{"type":"short","level":"TH","q":"Tổ chức nào thúc đẩy tự do hóa thương mại toàn cầu? (viết tắt)","answer":"WTO","explain":"WTO (Tổ chức Thương mại Thế giới) thúc đẩy tự do hóa thương mại toàn cầu.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, tỉ trọng xuất khẩu của các nước đang phát triển năm 2020 tăng bao nhiêu điểm phần trăm so với năm 2000?","answer":"14","explain":"46 trừ 32 bằng 14 điểm phần trăm.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Để tận dụng tốt cơ hội của toàn cầu hóa, các nước đang phát triển cần","options":["A. Đóng cửa nền kinh tế.","B. Nâng cao năng lực cạnh tranh, phát triển nguồn nhân lực và khoa học – công nghệ.","C. Chỉ trông chờ vào viện trợ.","D. Từ chối mọi vốn đầu tư nước ngoài."],"answer":"B","explain":"Nâng cao năng lực cạnh tranh, nguồn nhân lực và khoa học – công nghệ giúp các nước đang phát triển hội nhập hiệu quả, hạn chế lệ thuộc.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ nào thích hợp nhất để thể hiện tốc độ tăng trưởng thương mại thế giới giai đoạn 2000 – 2020?","options":["A. Biểu đồ tròn.","B. Biểu đồ đường.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"B","explain":"Biểu đồ đường thể hiện sự biến động, tốc độ tăng trưởng của đối tượng theo thời gian.","points":0.25},{"type":"mcq","level":"TH","q":"Trong nền kinh tế tri thức, yếu tố nào trở thành lực lượng sản xuất trực tiếp quan trọng nhất?","options":["A. Tài nguyên thiên nhiên.","B. Tri thức và công nghệ cao.","C. Lao động phổ thông.","D. Vốn đất đai."],"answer":"B","explain":"Trong kinh tế tri thức, tri thức và công nghệ cao trở thành lực lượng sản xuất trực tiếp quan trọng nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt tiêu cực của khu vực hóa kinh tế là","options":["A. Mở rộng thị trường nội khối.","B. Có thể tạo ra sự phân biệt đối xử với các nước ngoài khối.","C. Thu hút đầu tư nước ngoài.","D. Tăng cường hợp tác giữa các thành viên."],"answer":"B","explain":"Các khối kinh tế có thể ưu đãi nội khối, dựng rào cản với nước ngoài khối — gây phân biệt đối xử trong thương mại.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: số lượng công ty trong danh sách 500 công ty lớn nhất thế giới có trụ sở ở các nước đang phát triển: năm 2000: 30; năm 2010: 100; năm 2020: 150. Nhận xét nào sau đây đúng?","options":["A. Vị thế của các nước đang phát triển trong kinh tế toàn cầu ngày càng tăng.","B. Các nước đang phát triển không có công ty lớn nào.","C. Số lượng công ty giảm liên tục.","D. Toàn cầu hóa chỉ có lợi cho nước phát triển."],"answer":"A","explain":"Số công ty lớn của các nước đang phát triển tăng từ 30 lên 150 — cho thấy vị thế kinh tế của nhóm này tăng lên nhờ hội nhập.","points":0.25},{"type":"mcq","level":"VD","q":"Một quốc gia đang phát triển thu hút nhiều FDI nhưng phần lớn là các ngành thâm dụng lao động, ít công nghệ. Để phát triển bền vững, quốc gia này nên","options":["A. Tiếp tục chỉ thu hút các ngành ít công nghệ.","B. Có chính sách chọn lọc, ưu tiên các dự án công nghệ cao, thân thiện môi trường và chuyển giao công nghệ.","C. Ngừng thu hút FDI hoàn toàn.","D. Chỉ phát triển nông nghiệp."],"answer":"B","explain":"Thu hút FDI có chọn lọc — ưu tiên công nghệ cao, chuyển giao công nghệ, bảo vệ môi trường — giúp phát triển bền vững, tránh lệ thuộc.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nâng cao năng lực cạnh tranh giúp nước đang phát triển hội nhập hiệu quả.","b) Biểu đồ đường thích hợp để thể hiện tốc độ tăng trưởng theo thời gian.","c) Tri thức và công nghệ cao là lực lượng sản xuất quan trọng nhất của kinh tế tri thức.","d) Khu vực hóa không có mặt tiêu cực nào."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: khu vực hóa có thể gây phân biệt đối xử với nước ngoài khối.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu số công ty lớn của các nước đang phát triển ở trên. Xét tính đúng, sai:","statements":["a) Năm 2020 số công ty gấp 5 lần năm 2000.","b) Số lượng công ty tăng liên tục giai đoạn 2000 – 2020.","c) Vị thế kinh tế của các nước đang phát triển ngày càng tăng.","d) Số liệu cho thấy các nước đang phát triển không hội nhập được."],"answer":["T","T","T","F"],"explain":"a) Đúng: 150 chia 30 bằng 5 lần. b), c) Đúng. d) Sai: số liệu chứng tỏ hội nhập ngày càng sâu.","points":1},{"type":"short","level":"TH","q":"Yếu tố nào trở thành lực lượng sản xuất trực tiếp quan trọng nhất trong nền kinh tế tri thức?","answer":"Tri thức","explain":"Trong kinh tế tri thức, tri thức (gắn với công nghệ cao) trở thành lực lượng sản xuất trực tiếp quan trọng nhất.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, số công ty lớn của các nước đang phát triển năm 2020 gấp bao nhiêu lần năm 2000?","answer":"5","explain":"150 chia 30 bằng 5 lần.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: kim ngạch thương mại thế giới (nghìn tỉ USD): 1990: 3,5; 2000: 6,4; 2010: 15,2; 2020: 17,6. Giai đoạn nào thương mại thế giới tăng nhanh nhất về giá trị tuyệt đối?","options":["A. 1990 – 2000.","B. 2000 – 2010.","C. 2010 – 2020.","D. Cả ba giai đoạn như nhau."],"answer":"B","explain":"1990–2000 tăng 2,9; 2000–2010 tăng 8,8; 2010–2020 tăng 2,4 nghìn tỉ USD — giai đoạn 2000–2010 tăng nhanh nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Việt Nam gia nhập WTO năm 2007 đã mang lại kết quả nào sau đây?","options":["A. Mở rộng thị trường xuất khẩu, thu hút FDI và thúc đẩy cải cách kinh tế.","B. Đóng cửa thị trường trong nước.","C. Giảm xuất khẩu.","D. Không thay đổi gì."],"answer":"A","explain":"Gia nhập WTO giúp Việt Nam mở rộng thị trường, thu hút FDI mạnh, thúc đẩy cải cách thể chế và hội nhập sâu vào kinh tế toàn cầu.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ trọng của 3 trung tâm kinh tế (Hoa Kỳ, EU, Nhật Bản) trong GDP thế giới (%): 1990: 60; 2000: 55; 2010: 45; 2020: 40. Xu hướng này phản ánh","options":["A. Các trung tâm cũ suy yếu tuyệt đối và biến mất.","B. Sự trỗi dậy của các nền kinh tế mới nổi, cán cân kinh tế thế giới dịch chuyển.","C. Toàn cầu hóa đã kết thúc.","D. GDP thế giới giảm liên tục."],"answer":"B","explain":"Tỉ trọng giảm từ 60% xuống 40% cho thấy các nền kinh tế mới nổi (Trung Quốc, Ấn Độ...) trỗi dậy, cán cân kinh tế thế giới dịch chuyển — hệ quả của toàn cầu hóa.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong bối cảnh toàn cầu hóa, một nước đang phát triển muốn phát triển kinh tế tri thức thì điều kiện tiên quyết là","options":["A. Có nhiều tài nguyên thiên nhiên.","B. Đầu tư mạnh cho giáo dục, đào tạo nguồn nhân lực chất lượng cao và nghiên cứu khoa học.","C. Tăng dân số thật nhanh.","D. Đóng cửa với thế giới."],"answer":"B","explain":"Kinh tế tri thức dựa vào con người có tri thức — nên đầu tư cho giáo dục, nhân lực chất lượng cao và nghiên cứu là điều kiện tiên quyết.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào sau đây đúng về tác động của toàn cầu hóa đối với văn hóa?","options":["A. Chỉ mang lại tác động tích cực.","B. Vừa thúc đẩy giao lưu, hiểu biết lẫn nhau, vừa đặt ra nguy cơ mai một bản sắc văn hóa dân tộc.","C. Làm mọi nền văn hóa trở nên giống hệt nhau ngay lập tức.","D. Không ảnh hưởng gì đến văn hóa."],"answer":"B","explain":"Toàn cầu hóa thúc đẩy giao lưu văn hóa nhưng làn sóng văn hóa ngoại lai mạnh cũng đe dọa bản sắc dân tộc nếu không có bản lĩnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện cơ cấu kim ngạch xuất nhập khẩu của một nước trong một năm, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ tròn.","C. Biểu đồ cột chồng.","D. Biểu đồ kết hợp."],"answer":"B","explain":"Biểu đồ tròn thể hiện cơ cấu (tỉ trọng các thành phần trong tổng thể) tại một thời điểm.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu kim ngạch thương mại thế giới ở trên. Xét tính đúng, sai:","statements":["a) Giai đoạn 2000 – 2010 thương mại thế giới tăng nhanh nhất về giá trị tuyệt đối.","b) Kim ngạch năm 2020 gấp hơn 5 lần năm 1990.","c) Thương mại thế giới tăng liên tục giai đoạn 1990 – 2020.","d) Giai đoạn 2010 – 2020 tăng nhanh hơn giai đoạn 2000 – 2010."],"answer":["T","T","T","F"],"explain":"a) Đúng: tăng 8,8 nghìn tỉ, lớn nhất. b) Đúng: 17,6 chia 3,5 khoảng 5 lần. c) Đúng. d) Sai: 2010–2020 chỉ tăng 2,4, chậm hơn nhiều.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ trọng của 3 trung tâm kinh tế trong GDP thế giới ở trên. Xét tính đúng, sai:","statements":["a) Tỉ trọng của 3 trung tâm giảm liên tục từ 1990 đến 2020.","b) Xu hướng này phản ánh sự trỗi dậy của các nền kinh tế mới nổi.","c) Năm 2020, 3 trung tâm vẫn chiếm đa số GDP thế giới.","d) Toàn cầu hóa góp phần làm dịch chuyển cán cân kinh tế thế giới."],"answer":["T","T","F","T"],"explain":"a) Đúng: 60 xuống 40%. b), d) Đúng. c) Sai: 40% là thiểu số.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu thương mại thế giới, kim ngạch năm 2020 gấp khoảng bao nhiêu lần năm 1990? (làm tròn đến hàng đơn vị)","answer":"5","explain":"17,6 chia 3,5 bằng khoảng 5,03, làm tròn là 5 lần.","points":0.5},{"type":"short","level":"VDC","q":"Việt Nam chính thức trở thành thành viên của WTO vào năm nào?","answer":"2007","explain":"Việt Nam gia nhập WTO ngày 11/01/2007, trở thành thành viên thứ 150.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: số nước thành viên WTO: 1995: 128; 2005: 148; 2015: 162; 2023: 166. Nhận xét nào sau đây đúng?","options":["A. Số thành viên WTO giảm liên tục.","B. Ngày càng nhiều nước tham gia WTO, chứng tỏ xu thế tự do hóa thương mại toàn cầu.","C. WTO chỉ có thành viên ở châu Âu.","D. Năm 2023 WTO có dưới 100 thành viên."],"answer":"B","explain":"Số thành viên tăng từ 128 lên 166 — ngày càng nhiều nước tham gia, thể hiện xu thế tự do hóa thương mại toàn cầu.","points":0.25},{"type":"mcq","level":"VD","q":"Trong các tổ chức sau, tổ chức nào là liên kết kinh tế khu vực?","options":["A. Liên hợp quốc.","B. ASEAN.","C. Tổ chức Y tế Thế giới.","D. UNESCO."],"answer":"B","explain":"ASEAN là tổ chức liên kết kinh tế – chính trị khu vực Đông Nam Á; các tổ chức còn lại hoạt động trên phạm vi toàn cầu, không phải liên kết kinh tế khu vực.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh nói: “Khu vực hóa sẽ làm suy yếu toàn cầu hóa vì các nước chỉ buôn bán trong khối”. Nhận xét này","options":["A. Đúng hoàn toàn.","B. Chưa đúng vì khu vực hóa vừa tạo cạnh tranh vừa là bước đệm giúp các nước hội nhập toàn cầu tốt hơn.","C. Sai hoàn toàn vì hai quá trình không liên quan.","D. Đúng vì các khối luôn đóng cửa."],"answer":"B","explain":"Khu vực hóa có mặt cạnh tranh nhưng chủ yếu bổ sung cho toàn cầu hóa: giúp thành viên lớn mạnh để hội nhập toàn cầu.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: giá trị xuất khẩu phần mềm và dịch vụ công nghệ thông tin của Ấn Độ (tỉ USD): 2000: 6; 2010: 60; 2020: 150. Số liệu này là biểu hiện của","options":["A. Nền kinh tế tri thức ở một nước đang phát triển.","B. Nền nông nghiệp truyền thống.","C. Sự suy thoái công nghệ.","D. Khai thác tài nguyên thô."],"answer":"A","explain":"Xuất khẩu phần mềm, dịch vụ công nghệ thông tin tăng nhanh là biểu hiện điển hình của kinh tế tri thức ở Ấn Độ.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện sự thay đổi cơ cấu GDP theo khu vực kinh tế của một nước giai đoạn 2000 – 2020, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ tròn.","C. Biểu đồ miền.","D. Biểu đồ cột đơn."],"answer":"C","explain":"Biểu đồ miền thể hiện sự thay đổi cơ cấu (tỉ trọng các thành phần) qua nhiều năm.","points":0.25},{"type":"mcq","level":"VDC","q":"Thách thức lớn nhất khi Việt Nam hội nhập sâu vào kinh tế toàn cầu là","options":["A. Không có thị trường xuất khẩu.","B. Năng lực cạnh tranh của nhiều doanh nghiệp còn yếu trước sức ép cạnh tranh quốc tế.","C. Thừa vốn đầu tư.","D. Không có lao động."],"answer":"B","explain":"Hội nhập mở ra thị trường nhưng cũng đặt doanh nghiệp Việt Nam trước cạnh tranh gay gắt khi năng lực cạnh tranh còn hạn chế.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu số nước thành viên WTO ở trên. Xét tính đúng, sai:","statements":["a) Số thành viên WTO tăng liên tục từ 1995 đến 2023.","b) Năm 2023, WTO có 166 thành viên.","c) Số liệu chứng tỏ xu thế tự do hóa thương mại toàn cầu.","d) Năm 2005 WTO có dưới 100 thành viên."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: năm 2005 đã có 148 thành viên.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu xuất khẩu phần mềm của Ấn Độ ở trên. Xét tính đúng, sai:","statements":["a) Giá trị xuất khẩu năm 2020 gấp 25 lần năm 2000.","b) Số liệu là biểu hiện của kinh tế tri thức.","c) Tốc độ tăng giai đoạn 2000 – 2010 nhanh hơn 2010 – 2020 về số lần.","d) Ấn Độ là nước phát triển."],"answer":["T","T","T","F"],"explain":"a) Đúng: 150 chia 6 bằng 25 lần. b) Đúng. c) Đúng: 2000–2010 tăng 10 lần, 2010–2020 tăng 2,5 lần. d) Sai: Ấn Độ là nước đang phát triển.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, giá trị xuất khẩu phần mềm của Ấn Độ năm 2020 gấp bao nhiêu lần năm 2000?","answer":"25","explain":"150 chia 6 bằng 25 lần.","points":0.5},{"type":"short","level":"VDC","q":"Năm 2023, Tổ chức Thương mại Thế giới có bao nhiêu nước thành viên?","answer":"166","explain":"Tính đến năm 2023, WTO có 166 nước thành viên.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tổ chức nào sau đây là tổ chức liên kết kinh tế khu vực lớn nhất thế giới?","options":["A. EU.","B. NATO.","C. WHO.","D. UNESCO."],"answer":"A","explain":"EU (Liên minh châu Âu) là liên kết kinh tế khu vực lớn nhất, chặt chẽ nhất thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Hiệp hội các quốc gia Đông Nam Á có tên viết tắt là","options":["A. EU.","B. ASEAN.","C. APEC.","D. OPEC."],"answer":"B","explain":"ASEAN (Association of Southeast Asian Nations) là Hiệp hội các quốc gia Đông Nam Á.","points":0.25},{"type":"mcq","level":"NB","q":"Đặc trưng cơ bản của nền kinh tế tri thức là","options":["A. Dựa vào khai thác tài nguyên.","B. Dựa vào tri thức, công nghệ cao và đổi mới sáng tạo.","C. Dựa vào lao động phổ thông.","D. Dựa vào nông nghiệp tự cấp."],"answer":"B","explain":"Kinh tế tri thức dựa vào sáng tạo, phân phối và sử dụng tri thức, công nghệ cao.","points":0.25},{"type":"mcq","level":"NB","q":"Dòng vốn đầu tư trực tiếp từ nước ngoài vào một nước được gọi là","options":["A. FDI.","B. ODA.","C. GDP.","D. HDI."],"answer":"A","explain":"FDI là đầu tư trực tiếp nước ngoài; ODA là viện trợ phát triển chính thức.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ lệ thất nghiệp ở một số nước EU (%): Đức 3, Hy Lạp 12, Tây Ban Nha 14, Pháp 8 (năm 2020). Nhận xét nào sau đây đúng?","options":["A. Mọi nước EU đều có tỉ lệ thất nghiệp như nhau.","B. Trong nội bộ EU vẫn có sự chênh lệch về trình độ phát triển và việc làm.","C. Đức có tỉ lệ thất nghiệp cao nhất.","D. Hy Lạp có tỉ lệ thất nghiệp thấp nhất."],"answer":"B","explain":"Đức chỉ 3% trong khi Hy Lạp 12%, Tây Ban Nha 14% — cho thấy ngay trong EU vẫn có chênh lệch phát triển.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nước đang phát triển đứng trước lựa chọn: mở cửa hội nhập sâu hay bảo hộ nền kinh tế. Theo xu thế toàn cầu hóa, lựa chọn khôn ngoan là","options":["A. Đóng cửa hoàn toàn để tránh cạnh tranh.","B. Mở cửa hội nhập chủ động, vừa tận dụng cơ hội vừa có chính sách bảo vệ hợp lí và nâng cao năng lực cạnh tranh.","C. Chỉ xuất khẩu, không nhập khẩu.","D. Không cần chính sách gì."],"answer":"B","explain":"Xu thế tất yếu là hội nhập; vấn đề là hội nhập chủ động, có lộ trình bảo hộ hợp lí và không ngừng nâng cao năng lực cạnh tranh.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) EU là liên kết kinh tế khu vực lớn nhất thế giới.","b) ASEAN là Hiệp hội các quốc gia Đông Nam Á.","c) Kinh tế tri thức dựa vào tri thức và công nghệ cao.","d) ODA là vốn đầu tư trực tiếp nước ngoài."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: FDI mới là đầu tư trực tiếp nước ngoài; ODA là viện trợ phát triển chính thức.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ lệ thất nghiệp các nước EU ở trên. Xét tính đúng, sai:","statements":["a) Đức có tỉ lệ thất nghiệp thấp nhất bảng.","b) Tây Ban Nha có tỉ lệ thất nghiệp cao nhất bảng.","c) Trong nội bộ EU vẫn tồn tại chênh lệch phát triển.","d) Mọi nước EU đều có tỉ lệ thất nghiệp dưới 5%."],"answer":["T","T","T","F"],"explain":"a) Đúng: 3% thấp nhất. b) Đúng: 14% cao nhất. c) Đúng. d) Sai: Hy Lạp, Tây Ban Nha, Pháp đều trên 5%.","points":1},{"type":"short","level":"NB","q":"Khu vực mậu dịch tự do Bắc Mỹ (trước đây là NAFTA) hiện nay có tên viết tắt là gì?","answer":"USMCA","explain":"USMCA thay thế NAFTA từ năm 2020, gồm Hoa Kỳ, Ca-na-đa và Mê-hi-cô.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, chênh lệch tỉ lệ thất nghiệp giữa Tây Ban Nha (14%) và Đức (3%) là bao nhiêu điểm phần trăm?","answer":"11","explain":"14 trừ 3 bằng 11 điểm phần trăm.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tổ chức nào thúc đẩy tự do hóa thương mại trên phạm vi toàn cầu?","options":["A. WTO.","B. ASEAN.","C. EU.","D. MERCOSUR."],"answer":"A","explain":"WTO hoạt động trên phạm vi toàn cầu; các tổ chức còn lại là liên kết khu vực.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện của khu vực hóa kinh tế là","options":["A. Các nước trong khu vực liên kết thành các tổ chức như EU, ASEAN.","B. Mỗi nước phát triển riêng lẻ.","C. Ngừng mọi hoạt động thương mại.","D. Chỉ có một nước trong khu vực phát triển."],"answer":"A","explain":"Sự ra đời của EU, ASEAN, APEC... là biểu hiện của khu vực hóa kinh tế.","points":0.25},{"type":"mcq","level":"NB","q":"Lao động chủ yếu trong nền kinh tế tri thức là","options":["A. Lao động phổ thông.","B. Lao động trí tuệ, trình độ cao.","C. Lao động chân tay.","D. Lao động chưa qua đào tạo."],"answer":"B","explain":"Kinh tế tri thức sử dụng chủ yếu lao động trí tuệ, có trình độ cao.","points":0.25},{"type":"mcq","level":"NB","q":"Toàn cầu hóa kinh tế diễn ra trên phạm vi","options":["A. Toàn thế giới.","B. Chỉ ở châu Âu.","C. Chỉ ở châu Á.","D. Chỉ ở Bắc Mỹ."],"answer":"A","explain":"Toàn cầu hóa là quá trình liên kết kinh tế trên phạm vi toàn thế giới.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: kim ngạch xuất khẩu của Việt Nam (tỉ USD): 2007: 48,6; 2015: 162,1; 2022: 371,9. Nhận xét nào sau đây đúng?","options":["A. Xuất khẩu của Việt Nam giảm sau khi gia nhập WTO.","B. Xuất khẩu tăng nhanh sau khi hội nhập sâu, năm 2022 gấp khoảng 7,7 lần năm 2007.","C. Hội nhập không ảnh hưởng đến xuất khẩu.","D. Năm 2022 xuất khẩu thấp hơn năm 2007."],"answer":"B","explain":"371,9 chia 48,6 khoảng 7,7 lần — xuất khẩu tăng nhanh nhờ hội nhập sâu vào kinh tế toàn cầu.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao các nước đang phát triển cần phát triển kinh tế tri thức trong bối cảnh toàn cầu hóa?","options":["A. Vì tài nguyên thiên nhiên là vô hạn.","B. Vì tri thức và công nghệ cao giúp nâng cao năng lực cạnh tranh, rút ngắn khoảng cách phát triển.","C. Vì không cần hội nhập nữa.","D. Vì kinh tế tri thức không cần lao động."],"answer":"B","explain":"Trong toàn cầu hóa, cạnh tranh dựa vào tri thức và công nghệ; phát triển kinh tế tri thức giúp nước đang phát triển nâng cao vị thế.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) WTO thúc đẩy tự do hóa thương mại toàn cầu.","b) EU và ASEAN là các tổ chức liên kết kinh tế khu vực.","c) Kinh tế tri thức sử dụng chủ yếu lao động trí tuệ.","d) Toàn cầu hóa chỉ diễn ra ở châu Âu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: toàn cầu hóa diễn ra trên phạm vi toàn thế giới.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu xuất khẩu của Việt Nam ở trên. Xét tính đúng, sai:","statements":["a) Kim ngạch xuất khẩu tăng liên tục giai đoạn 2007 – 2022.","b) Năm 2022 xuất khẩu gấp khoảng 7,7 lần năm 2007.","c) Hội nhập kinh tế quốc tế góp phần thúc đẩy xuất khẩu của Việt Nam.","d) Năm 2015 xuất khẩu thấp hơn năm 2007."],"answer":["T","T","T","F"],"explain":"a) Đúng: 48,6 lên 371,9. b) Đúng: 371,9 chia 48,6 khoảng 7,7. c) Đúng. d) Sai: 162,1 cao hơn 48,6.","points":1},{"type":"short","level":"NB","q":"Việt Nam chính thức gia nhập WTO vào năm nào?","answer":"2007","explain":"Việt Nam trở thành thành viên thứ 150 của WTO vào ngày 11/01/2007.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, kim ngạch xuất khẩu của Việt Nam năm 2022 gấp khoảng bao nhiêu lần năm 2007? (làm tròn đến 1 chữ số thập phân)","answer":"7,7","explain":"371,9 chia 48,6 bằng khoảng 7,65, làm tròn 1 chữ số thập phân là 7,7.","points":0.5}]}]}</script>
