<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Liên hợp quốc được thành lập vào năm nào?","options":["A. 1944.","B. 1945.","C. 1995.","D. 1967."],"answer":"B","explain":"Liên hợp quốc được thành lập năm 1945 sau Chiến tranh thế giới thứ hai.","points":0.25},{"type":"mcq","level":"NB","q":"Trụ sở chính của Liên hợp quốc đặt tại","options":["A. Giơ-ne-vơ (Thụy Sĩ).","B. Niu Y-oóc (Hoa Kỳ).","C. Pa-ri (Pháp).","D. Băng Cốc (Thái Lan)."],"answer":"B","explain":"Trụ sở chính của Liên hợp quốc đặt tại thành phố Niu Y-oóc, Hoa Kỳ.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức Thương mại Thế giới (WTO) được thành lập vào năm","options":["A. 1945.","B. 1967.","C. 1995.","D. 2007."],"answer":"C","explain":"WTO được thành lập năm 1995 trên cơ sở Hiệp định chung về Thuế quan và Thương mại (GATT).","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức nào cung cấp vốn vay và hỗ trợ kĩ thuật giúp các nước đang phát triển xóa đói giảm nghèo?","options":["A. Ngân hàng Thế giới (WB).","B. Tổ chức Y tế Thế giới.","C. UNESCO.","D. NATO."],"answer":"A","explain":"Ngân hàng Thế giới (WB) cung cấp vốn vay ưu đãi và hỗ trợ kĩ thuật cho các nước đang phát triển.","points":0.25},{"type":"mcq","level":"TH","q":"Mục đích hàng đầu của Liên hợp quốc là","options":["A. Thúc đẩy thương mại tự do.","B. Duy trì hòa bình và an ninh quốc tế.","C. Cho các nước vay vốn.","D. Bảo tồn di sản văn hóa."],"answer":"B","explain":"Mục đích hàng đầu của LHQ là duy trì hòa bình, an ninh quốc tế; thúc đẩy quan hệ hữu nghị và hợp tác giữa các nước.","points":0.25},{"type":"mcq","level":"TH","q":"Tình trạng mất an ninh lương thực nghiêm trọng nhất ở khu vực nào sau đây?","options":["A. Tây Âu.","B. Bắc Mỹ.","C. Châu Phi (vùng cận Xa-ha-ra, Sừng châu Phi).","D. Ô-xtrây-li-a."],"answer":"C","explain":"Châu Phi, nhất là vùng cận Xa-ha-ra và Sừng châu Phi, là nơi mất an ninh lương thực nghiêm trọng nhất do xung đột, hạn hán và nghèo đói.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Liên hợp quốc được thành lập năm 1945.","b) Trụ sở chính của Liên hợp quốc đặt tại Niu Y-oóc.","c) Tổ chức Thương mại Thế giới được thành lập năm 1945.","d) ASEAN là một tổ chức khu vực."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: WTO thành lập năm 1995.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) IMF cho các nước vay vốn nhằm ổn định kinh tế.","b) Tình trạng mất an ninh lương thực nghiêm trọng nhất ở châu Phi.","c) Tây Nam Á và Bắc Phi là những khu vực thiếu nước ngọt nghiêm trọng.","d) Mọi vấn đề an ninh toàn cầu đều do một quốc gia tự giải quyết được."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: các vấn đề an ninh vượt qua biên giới quốc gia, cần hợp tác quốc tế.","points":1},{"type":"short","level":"NB","q":"Hiện nay Liên hợp quốc có bao nhiêu quốc gia thành viên?","answer":"193","explain":"Liên hợp quốc hiện có 193 quốc gia thành viên.","points":0.5},{"type":"short","level":"TH","q":"Khu vực nào trên thế giới thiếu nước ngọt nghiêm trọng nhất do khí hậu khô nóng? (kể tên một khu vực)","answer":"Tây Nam Á","explain":"Tây Nam Á và Bắc Phi là những khu vực thiếu nước ngọt nghiêm trọng nhất do khí hậu khô nóng, lượng mưa ít.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"IMF là tên viết tắt của tổ chức nào?","options":["A. Quỹ Tiền tệ Quốc tế.","B. Ngân hàng Thế giới.","C. Tổ chức Thương mại Thế giới.","D. Diễn đàn Kinh tế Thế giới."],"answer":"A","explain":"IMF (International Monetary Fund) là Quỹ Tiền tệ Quốc tế, giám sát hệ thống tài chính toàn cầu.","points":0.25},{"type":"mcq","level":"NB","q":"Liên minh châu Âu (EU) hiện nay có bao nhiêu nước thành viên?","options":["A. 15.","B. 27.","C. 28.","D. 30."],"answer":"B","explain":"Sau khi Anh rời EU (Brexit, 2020), EU còn 27 nước thành viên.","points":0.25},{"type":"mcq","level":"NB","q":"ASEAN được thành lập vào năm nào?","options":["A. 1945.","B. 1967.","C. 1995.","D. 2015."],"answer":"B","explain":"ASEAN được thành lập năm 1967 theo Tuyên bố Băng Cốc với 5 nước sáng lập.","points":0.25},{"type":"mcq","level":"NB","q":"An ninh năng lượng gắn với vấn đề nào sau đây?","options":["A. Cạn kiệt dần nhiên liệu hóa thạch và nguy cơ khủng hoảng năng lượng.","B. Thừa năng lượng trên toàn cầu.","C. Giá năng lượng luôn ổn định.","D. Không cần sử dụng năng lượng."],"answer":"A","explain":"Nhu cầu năng lượng tăng nhanh trong khi than, dầu mỏ, khí tự nhiên dần cạn kiệt — đe dọa an ninh năng lượng toàn cầu.","points":0.25},{"type":"mcq","level":"TH","q":"Giải pháp căn bản để bảo đảm an ninh năng lượng toàn cầu là","options":["A. Khai thác tối đa nhiên liệu hóa thạch.","B. Sử dụng tiết kiệm, hiệu quả và phát triển năng lượng tái tạo.","C. Ngừng sử dụng điện.","D. Chỉ dùng than đá."],"answer":"B","explain":"Tiết kiệm năng lượng và phát triển năng lượng tái tạo (mặt trời, gió, thủy điện...) là giải pháp căn bản, bền vững.","points":0.25},{"type":"mcq","level":"TH","q":"Nguy cơ tranh chấp nguồn nước giữa các quốc gia xuất phát chủ yếu từ","options":["A. Các dòng sông xuyên biên giới thiếu cơ chế chia sẻ công bằng.","B. Lượng mưa quá nhiều.","C. Nước biển dâng.","D. Các nước không cần nước ngọt."],"answer":"A","explain":"Các sông xuyên biên giới như sông Nin, sông Mê Công... dễ thành nguồn gốc xung đột nếu không có cơ chế quản lí, chia sẻ công bằng.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) IMF là Quỹ Tiền tệ Quốc tế.","b) Sau Brexit, EU còn 27 nước thành viên.","c) ASEAN được thành lập năm 1967.","d) An ninh năng lượng không liên quan đến nhiên liệu hóa thạch."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: an ninh năng lượng gắn chặt với việc nhiên liệu hóa thạch dần cạn kiệt.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phát triển năng lượng tái tạo giúp bảo đảm an ninh năng lượng.","b) Sông Nin là ví dụ về nguồn nước xuyên biên giới dễ gây tranh chấp.","c) Sử dụng tiết kiệm giúp bảo vệ nguồn nước.","d) Các vấn đề an ninh toàn cầu không cần hợp tác quốc tế."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: các vấn đề an ninh vượt biên giới nên bắt buộc cần hợp tác quốc tế.","points":1},{"type":"short","level":"NB","q":"Đồng tiền chung của Liên minh châu Âu có tên là gì?","answer":"ơ-rô","explain":"Đồng ơ-rô (euro) là đồng tiền chung của khu vực đồng ơ-rô trong EU.","points":0.5},{"type":"short","level":"TH","q":"Kể tên một dòng sông xuyên biên giới ở châu Phi dễ trở thành nguồn gốc tranh chấp nguồn nước.","answer":"sông Nin","explain":"Sông Nin chảy qua nhiều quốc gia Đông Bắc châu Phi, là ví dụ điển hình về nguồn nước xuyên biên giới cần cơ chế chia sẻ.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"AU là tên viết tắt của tổ chức khu vực ở châu lục nào?","options":["A. Châu Phi.","B. Châu Âu.","C. Châu Á.","D. Châu Mỹ."],"answer":"A","explain":"AU (African Union) là Liên minh châu Phi, thúc đẩy đoàn kết và phát triển của các nước châu Phi.","points":0.25},{"type":"mcq","level":"NB","q":"APEC là","options":["A. Diễn đàn hợp tác kinh tế châu Á – Thái Bình Dương.","B. Liên minh quân sự Bắc Đại Tây Dương.","C. Tổ chức các nước xuất khẩu dầu mỏ.","D. Quỹ bảo vệ động vật hoang dã."],"answer":"A","explain":"APEC (Asia-Pacific Economic Cooperation) là Diễn đàn hợp tác kinh tế châu Á – Thái Bình Dương.","points":0.25},{"type":"mcq","level":"NB","q":"Vấn đề an ninh nào liên quan trực tiếp đến tình trạng thiếu ăn, suy dinh dưỡng?","options":["A. An ninh năng lượng.","B. An ninh lương thực.","C. An ninh nguồn nước.","D. An ninh mạng."],"answer":"B","explain":"An ninh lương thực là việc bảo đảm mọi người dân được tiếp cận đủ lương thực an toàn, dinh dưỡng.","points":0.25},{"type":"mcq","level":"NB","q":"Nguồn năng lượng nào sau đây là năng lượng tái tạo?","options":["A. Than đá.","B. Dầu mỏ.","C. Năng lượng mặt trời.","D. Khí tự nhiên."],"answer":"C","explain":"Năng lượng mặt trời, gió, thủy điện, sinh khối là năng lượng tái tạo; than, dầu, khí là nhiên liệu hóa thạch.","points":0.25},{"type":"mcq","level":"TH","q":"Cho bảng số liệu: số người thiếu ăn trên thế giới (triệu người): năm 2019: 690; năm 2020: 720; năm 2021: 800. Nhận xét nào sau đây đúng?","options":["A. Số người thiếu ăn giảm liên tục.","B. Số người thiếu ăn tăng lên, an ninh lương thực toàn cầu đáng lo ngại.","C. Năm 2021 số người thiếu ăn thấp nhất.","D. An ninh lương thực đã được bảo đảm hoàn toàn."],"answer":"B","explain":"Số người thiếu ăn tăng từ 690 lên 800 triệu người — an ninh lương thực toàn cầu ngày càng đáng lo ngại.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các vấn đề an ninh hiện nay mang tính toàn cầu và cần hợp tác quốc tế để giải quyết?","options":["A. Vì mọi nước đều giàu có.","B. Vì các mối đe dọa như biến đổi khí hậu, dịch bệnh, khủng bố vượt qua biên giới quốc gia, không nước nào tự giải quyết được.","C. Vì Liên hợp quốc yêu cầu.","D. Vì các nước không có quân đội."],"answer":"B","explain":"Các vấn đề an ninh phi truyền thống vượt qua biên giới quốc gia nên đòi hỏi hợp tác quốc tế chặt chẽ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) AU là Liên minh châu Phi.","b) APEC là Diễn đàn hợp tác kinh tế châu Á – Thái Bình Dương.","c) Thiếu ăn, suy dinh dưỡng liên quan đến an ninh lương thực.","d) Than đá là nguồn năng lượng tái tạo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: than đá là nhiên liệu hóa thạch, không tái tạo được trong thời gian ngắn.","points":1},{"type":"truefalse","level":"TH","q":"Dựa vào bảng số liệu số người thiếu ăn ở trên. Xét tính đúng, sai:","statements":["a) Số người thiếu ăn tăng liên tục giai đoạn 2019 – 2021.","b) Năm 2021 số người thiếu ăn cao nhất trong bảng.","c) An ninh lương thực toàn cầu đang đáng lo ngại.","d) Số liệu cho thấy nạn đói đã được xóa bỏ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: số người thiếu ăn vẫn tăng, nạn đói chưa được xóa bỏ.","points":1},{"type":"short","level":"NB","q":"Tổ chức Thương mại Thế giới được thành lập vào năm nào?","answer":"1995","explain":"WTO được thành lập năm 1995.","points":0.5},{"type":"short","level":"TH","q":"Dựa vào bảng số liệu, số người thiếu ăn trên thế giới năm 2021 tăng bao nhiêu triệu người so với năm 2019?","answer":"110","explain":"800 trừ 690 bằng 110 triệu người.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Cơ quan nào của Liên hợp quốc có vai trò quan trọng nhất trong việc duy trì hòa bình, an ninh quốc tế?","options":["A. Đại hội đồng.","B. Hội đồng Bảo an.","C. Tòa án Quốc tế.","D. Ban Thư kí."],"answer":"B","explain":"Hội đồng Bảo an là cơ quan có trách nhiệm chính trong duy trì hòa bình, an ninh quốc tế, có quyền áp đặt biện pháp trừng phạt.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân nào sau đây KHÔNG gây mất an ninh lương thực?","options":["A. Xung đột vũ trang.","B. Hạn hán, lũ lụt do biến đổi khí hậu.","C. Ứng dụng khoa học – công nghệ vào sản xuất nông nghiệp.","D. Nghèo đói và giá lương thực biến động."],"answer":"C","explain":"Ứng dụng khoa học – công nghệ giúp tăng năng suất, là giải pháp bảo đảm an ninh lương thực chứ không phải nguyên nhân gây mất an ninh.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp nào sau đây giúp bảo vệ nguồn nước ngọt?","options":["A. Xả thải trực tiếp ra sông.","B. Sử dụng tiết kiệm, chống lãng phí và ô nhiễm nguồn nước.","C. Khai thác nước ngầm vô tội vạ.","D. Lấp ao hồ để xây dựng."],"answer":"B","explain":"Sử dụng tiết kiệm, chống lãng phí và ô nhiễm là biện pháp căn bản để bảo vệ nguồn nước ngọt.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ nào thích hợp nhất để thể hiện số người thiếu ăn trên thế giới giai đoạn 2019 – 2021?","options":["A. Biểu đồ tròn.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"B","explain":"Biểu đồ cột thích hợp để so sánh giá trị tuyệt đối của một đối tượng qua các năm.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: tỉ lệ dân số được sử dụng nước sạch (%) năm 2020: Tây Âu 100, Bắc Mỹ 100, Tây Nam Á 85, châu Phi cận Xa-ha-ra 60. Nhận xét nào sau đây đúng?","options":["A. Mọi khu vực đều được dùng nước sạch 100%.","B. Có sự chênh lệch lớn về tiếp cận nước sạch giữa các khu vực, châu Phi cận Xa-ha-ra thấp nhất.","C. Tây Nam Á có tỉ lệ cao nhất.","D. Bắc Mỹ thấp hơn châu Phi cận Xa-ha-ra."],"answer":"B","explain":"Tây Âu, Bắc Mỹ đạt 100% trong khi châu Phi cận Xa-ha-ra chỉ 60% — chênh lệch lớn, phản ánh vấn đề an ninh nguồn nước.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao giá dầu mỏ biến động mạnh có thể gây khủng hoảng kinh tế trên phạm vi toàn cầu?","options":["A. Vì dầu mỏ không còn được sử dụng.","B. Vì dầu mỏ vẫn là nguồn năng lượng chủ yếu, chi phí năng lượng tăng sẽ đẩy giá cả hàng hóa và lạm phát lên cao ở nhiều nước.","C. Vì mọi nước đều xuất khẩu dầu.","D. Vì giá dầu không ảnh hưởng đến sản xuất."],"answer":"B","explain":"Dầu mỏ chiếm tỉ trọng lớn trong cơ cấu năng lượng; giá dầu tăng làm tăng chi phí sản xuất, vận chuyển — gây lạm phát và suy giảm tăng trưởng toàn cầu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hội đồng Bảo an có vai trò quan trọng trong duy trì hòa bình thế giới.","b) Ứng dụng khoa học – công nghệ giúp bảo đảm an ninh lương thực.","c) Sử dụng tiết kiệm giúp bảo vệ nguồn nước ngọt.","d) Biểu đồ cột thích hợp để so sánh giá trị qua các năm."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu tỉ lệ dân số dùng nước sạch ở trên. Xét tính đúng, sai:","statements":["a) Châu Phi cận Xa-ha-ra có tỉ lệ thấp nhất bảng.","b) Chênh lệch giữa Tây Âu và châu Phi cận Xa-ha-ra là 40 điểm phần trăm.","c) Số liệu phản ánh vấn đề an ninh nguồn nước mang tính toàn cầu.","d) Tây Nam Á có tỉ lệ dùng nước sạch cao hơn Bắc Mỹ."],"answer":["T","T","T","F"],"explain":"a) Đúng: 60% thấp nhất. b) Đúng: 100 trừ 60 bằng 40. c) Đúng. d) Sai: Tây Nam Á 85% thấp hơn Bắc Mỹ 100%.","points":1},{"type":"short","level":"TH","q":"Cơ quan nào của Liên hợp quốc chịu trách nhiệm chính về duy trì hòa bình, an ninh quốc tế?","answer":"Hội đồng Bảo an","explain":"Hội đồng Bảo an là cơ quan chịu trách nhiệm chính về duy trì hòa bình và an ninh quốc tế.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, chênh lệch tỉ lệ dân số dùng nước sạch giữa Tây Âu (100%) và châu Phi cận Xa-ha-ra (60%) là bao nhiêu điểm phần trăm?","answer":"40","explain":"100 trừ 60 bằng 40 điểm phần trăm.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"TH","q":"Vai trò của WB đối với các nước đang phát triển là","options":["A. Cung cấp vốn vay ưu đãi và hỗ trợ kĩ thuật để xóa đói giảm nghèo.","B. Điều hành quân đội quốc tế.","C. Tổ chức các kì thi quốc tế.","D. Bảo tồn di sản thế giới."],"answer":"A","explain":"WB cung cấp vốn vay ưu đãi, hỗ trợ kĩ thuật giúp các nước đang phát triển xóa đói giảm nghèo và phát triển bền vững.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ thích hợp nhất để thể hiện cơ cấu các nguồn năng lượng tiêu thụ của thế giới năm 2020 là","options":["A. Biểu đồ đường.","B. Biểu đồ tròn.","C. Biểu đồ cột.","D. Lược đồ."],"answer":"B","explain":"Biểu đồ tròn thể hiện cơ cấu (tỉ trọng các thành phần trong tổng thể) tại một thời điểm.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân sâu xa của tình trạng thiếu nước ngọt ở Tây Nam Á là","options":["A. Khí hậu khô nóng, lượng mưa rất ít.","B. Dân số quá ít.","C. Mưa quá nhiều gây lũ lụt.","D. Không có sông ngòi nào."],"answer":"A","explain":"Tây Nam Á có khí hậu khô nóng, hoang mạc rộng, lượng mưa rất ít nên thiếu nước ngọt nghiêm trọng.","points":0.25},{"type":"mcq","level":"TH","q":"Giải pháp nào sau đây góp phần bảo đảm an ninh lương thực ở châu Phi?","options":["A. Phát triển nông nghiệp bền vững, ứng dụng khoa học – công nghệ và tăng cường hợp tác quốc tế.","B. Bỏ hoang đất nông nghiệp.","C. Ngừng mọi hoạt động sản xuất.","D. Chỉ trông chờ vào viện trợ mà không sản xuất."],"answer":"A","explain":"Phát triển nông nghiệp bền vững, ứng dụng khoa học – công nghệ, kết hợp viện trợ và ổn định chính trị là giải pháp căn bản.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: cơ cấu tiêu thụ năng lượng thế giới năm 2020 (%): dầu mỏ 31, than 27, khí tự nhiên 25, năng lượng tái tạo 12, khác 5. Nhận xét nào sau đây đúng?","options":["A. Năng lượng tái tạo chiếm tỉ trọng lớn nhất.","B. Nhiên liệu hóa thạch vẫn chiếm tỉ trọng áp đảo (83%), năng lượng tái tạo còn thấp.","C. Than đá không được sử dụng.","D. Dầu mỏ chiếm dưới 10%."],"answer":"B","explain":"Dầu mỏ + than + khí = 83% — nhiên liệu hóa thạch vẫn áp đảo; năng lượng tái tạo mới 12%.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao Liên hợp quốc được coi là tổ chức có vai trò điều phối quan trọng nhất trong giải quyết các vấn đề an ninh toàn cầu?","options":["A. Vì LHQ có quân đội mạnh nhất.","B. Vì LHQ có tính phổ quát (193 thành viên), là diễn đàn và cơ chế hợp tác chung của cộng đồng quốc tế.","C. Vì LHQ giàu nhất thế giới.","D. Vì chỉ LHQ mới được bàn về an ninh."],"answer":"B","explain":"Với 193 thành viên, LHQ là tổ chức phổ quát nhất, là diễn đàn và cơ chế điều phối hợp tác quốc tế trong các vấn đề toàn cầu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) WB cung cấp vốn vay ưu đãi cho các nước đang phát triển.","b) Biểu đồ tròn thích hợp để thể hiện cơ cấu năng lượng tiêu thụ.","c) Tây Nam Á thiếu nước ngọt do khí hậu khô nóng.","d) Phát triển nông nghiệp bền vững giúp bảo đảm an ninh lương thực."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu cơ cấu tiêu thụ năng lượng thế giới ở trên. Xét tính đúng, sai:","statements":["a) Nhiên liệu hóa thạch chiếm 83% tổng tiêu thụ năng lượng.","b) Năng lượng tái tạo chiếm tỉ trọng thấp nhất trong bảng.","c) Dầu mỏ là nguồn năng lượng được tiêu thụ nhiều nhất.","d) Năng lượng tái tạo đã thay thế hoàn toàn nhiên liệu hóa thạch."],"answer":["T","F","T","F"],"explain":"a) Đúng: 31 + 27 + 25 = 83%. b) Sai: nhóm “khác” 5% thấp hơn tái tạo 12%. c) Đúng: dầu mỏ 31% cao nhất. d) Sai: tái tạo mới 12%.","points":1},{"type":"short","level":"TH","q":"Tổ chức nào cung cấp vốn vay ưu đãi giúp các nước đang phát triển xóa đói giảm nghèo? (viết tắt)","answer":"WB","explain":"WB (Ngân hàng Thế giới) cung cấp vốn vay ưu đãi và hỗ trợ kĩ thuật cho các nước đang phát triển.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, tính tổng tỉ trọng của nhiên liệu hóa thạch (dầu mỏ + than + khí tự nhiên) trong tiêu thụ năng lượng thế giới năm 2020 (%).","answer":"83","explain":"31 + 27 + 25 = 83%.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Điểm khác nhau cơ bản giữa tổ chức quốc tế và tổ chức khu vực là","options":["A. Quy mô hoạt động: toàn cầu so với một khu vực.","B. Tổ chức khu vực lớn hơn tổ chức quốc tế.","C. Tổ chức quốc tế không có thành viên.","D. Không có điểm khác nhau."],"answer":"A","explain":"Tổ chức quốc tế (UN, WTO...) hoạt động phạm vi toàn cầu; tổ chức khu vực (EU, ASEAN...) hoạt động trong một khu vực.","points":0.25},{"type":"mcq","level":"TH","q":"Hậu quả của việc thiếu nước ngọt kéo dài ở Tây Nam Á là","options":["A. Nông nghiệp phát triển mạnh.","B. Khó khăn cho sản xuất nông nghiệp, đời sống và nguy cơ xung đột nguồn nước.","C. Dân số tăng nhanh.","D. Không ảnh hưởng gì."],"answer":"B","explain":"Thiếu nước gây khó khăn cho nông nghiệp và đời sống, đồng thời tiềm ẩn nguy cơ tranh chấp, xung đột nguồn nước.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các vấn đề an ninh phi truyền thống, vấn đề nào liên quan đến biến đổi khí hậu, ô nhiễm xuyên biên giới?","options":["A. An ninh môi trường.","B. An ninh lương thực.","C. An ninh quân sự.","D. An ninh biên giới."],"answer":"A","explain":"An ninh môi trường liên quan đến biến đổi khí hậu, ô nhiễm xuyên biên giới, suy giảm đa dạng sinh học...","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp khử mặn nước biển được áp dụng phổ biến ở khu vực nào sau đây?","options":["A. Tây Nam Á.","B. Tây Âu.","C. Đông Nam Á.","D. Nam Mỹ."],"answer":"A","explain":"Các nước vùng Vịnh (A-rập Xê-út, UAE, Ca-ta...) thiếu nước ngọt nên đầu tư mạnh vào công nghệ khử mặn nước biển.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: lượng dầu mỏ xuất khẩu của một số nước (triệu thùng/ngày) năm 2020: A-rập Xê-út 6,5; Nga 5,0; I-rắc 3,5; Ca-na-đa 3,2. Nước nào xuất khẩu dầu mỏ lớn nhất?","options":["A. A-rập Xê-út.","B. Nga.","C. I-rắc.","D. Ca-na-đa."],"answer":"A","explain":"A-rập Xê-út xuất khẩu 6,5 triệu thùng/ngày — lớn nhất trong bảng.","points":0.25},{"type":"mcq","level":"VD","q":"Việc các nước Tây Nam Á phụ thuộc lớn vào xuất khẩu dầu mỏ đặt ra thách thức nào về an ninh năng lượng?","options":["A. Không có thách thức nào.","B. Khi giá dầu biến động hoặc dầu cạn kiệt, nền kinh tế các nước này bị ảnh hưởng nặng nề; thế giới cũng đối mặt nguy cơ thiếu hụt năng lượng.","C. Làm tăng trữ lượng dầu.","D. Giúp các nước này không cần năng lượng tái tạo mãi mãi."],"answer":"B","explain":"Phụ thuộc vào một nguồn thu dễ tổn thương trước biến động giá và cạn kiệt tài nguyên — vừa là thách thức với các nước này, vừa với an ninh năng lượng toàn cầu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tổ chức quốc tế hoạt động trên phạm vi toàn cầu, tổ chức khu vực hoạt động trong một khu vực.","b) Thiếu nước kéo dài gây khó khăn cho nông nghiệp và đời sống.","c) Biến đổi khí hậu là một vấn đề an ninh môi trường.","d) Khử mặn nước biển được áp dụng phổ biến ở Tây Nam Á."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu xuất khẩu dầu mỏ ở trên. Xét tính đúng, sai:","statements":["a) A-rập Xê-út là nước xuất khẩu dầu lớn nhất bảng.","b) Nga xuất khẩu nhiều dầu hơn I-rắc.","c) Ca-na-đa xuất khẩu ít dầu nhất bảng.","d) I-rắc xuất khẩu nhiều dầu hơn A-rập Xê-út."],"answer":["T","T","T","F"],"explain":"a) Đúng: 6,5 triệu thùng/ngày. b) Đúng: 5,0 lớn hơn 3,5. c) Đúng: 3,2 thấp nhất. d) Sai: I-rắc 3,5 thấp hơn A-rập Xê-út 6,5.","points":1},{"type":"short","level":"TH","q":"Biện pháp công nghệ nào được các nước vùng Vịnh áp dụng phổ biến để có thêm nước ngọt?","answer":"Khử mặn nước biển","explain":"Các nước A-rập Xê-út, UAE, Ca-ta... đầu tư mạnh vào công nghệ khử mặn nước biển do thiếu nước ngọt.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, nước nào xuất khẩu dầu mỏ lớn nhất?","answer":"A-rập Xê-út","explain":"A-rập Xê-út xuất khẩu 6,5 triệu thùng/ngày, lớn nhất bảng.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: số người phải di dời do xung đột và thiên tai (triệu người): 2015: 65; 2018: 70; 2021: 89. Nhận xét nào sau đây đúng?","options":["A. Số người phải di dời giảm liên tục.","B. Số người phải di dời tăng nhanh, phản ánh tình trạng mất an ninh toàn cầu gia tăng.","C. Năm 2021 số người di dời thấp nhất.","D. Xung đột không gây di dời dân cư."],"answer":"B","explain":"Số người phải di dời tăng từ 65 lên 89 triệu người — phản ánh xung đột, thiên tai và mất an ninh gia tăng.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa an ninh lương thực, an ninh năng lượng và an ninh nguồn nước là","options":["A. Hoàn toàn độc lập, không liên quan.","B. Có mối quan hệ chặt chẽ: sản xuất lương thực cần nước và năng lượng; thiếu một yếu tố sẽ ảnh hưởng các yếu tố còn lại.","C. Chỉ có an ninh năng lượng là quan trọng.","D. Không cần quan tâm đồng thời."],"answer":"B","explain":"Ba vấn đề gắn bó: nông nghiệp cần nước tưới và năng lượng; sản xuất năng lượng cần nước làm mát — tạo thành mối liên kết lương thực – năng lượng – nước.","points":0.25},{"type":"mcq","level":"VDC","q":"Một quốc gia ở Tây Nam Á có trữ lượng dầu mỏ lớn nhưng thiếu nước ngọt trầm trọng. Chiến lược phát triển bền vững phù hợp nhất là","options":["A. Dùng toàn bộ thu nhập từ dầu mỏ để nhập khẩu lương thực mà không đầu tư gì thêm.","B. Dùng nguồn thu từ dầu mỏ đầu tư vào công nghệ khử mặn, nông nghiệp công nghệ cao tiết kiệm nước và đa dạng hóa kinh tế.","C. Khai thác dầu mỏ tối đa đến khi cạn kiệt.","D. Ngừng khai thác dầu mỏ ngay lập tức."],"answer":"B","explain":"Dùng thu nhập dầu mỏ để giải quyết điểm yếu (nước) bằng công nghệ và đa dạng hóa kinh tế là chiến lược bền vững, tránh phụ thuộc đơn điệu.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ lệ điện từ năng lượng tái tạo trong tổng sản lượng điện (%): Đức 45, Trung Quốc 28, Hoa Kỳ 20, Ấn Độ 22, thế giới 29 (năm 2020). Nhận xét nào sau đây đúng?","options":["A. Đức dẫn đầu về tỉ lệ điện tái tạo trong bảng.","B. Hoa Kỳ có tỉ lệ cao nhất.","C. Thế giới đã đạt 100% điện tái tạo.","D. Trung Quốc thấp hơn Hoa Kỳ."],"answer":"A","explain":"Đức 45% là cao nhất bảng, vượt xa mức trung bình thế giới 29% — thể hiện nỗ lực chuyển đổi năng lượng.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện tỉ lệ điện từ năng lượng tái tạo của các nước trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Biểu đồ tròn."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị của nhiều đối tượng tại một thời điểm — phù hợp để so sánh tỉ lệ giữa các nước.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong giải quyết tranh chấp nguồn nước sông xuyên biên giới, nguyên tắc quan trọng nhất được cộng đồng quốc tế thừa nhận là","options":["A. Nước ở thượng nguồn được dùng tùy ý.","B. Sử dụng công bằng, hợp lí và không gây hại đáng kể cho các nước cùng lưu vực.","C. Nước nào mạnh hơn được dùng nhiều hơn.","D. Cấm hoàn toàn việc sử dụng."],"answer":"B","explain":"Luật pháp quốc tế về nguồn nước xuyên biên giới dựa trên nguyên tắc sử dụng công bằng, hợp lí và nghĩa vụ không gây hại đáng kể.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu số người phải di dời ở trên. Xét tính đúng, sai:","statements":["a) Số người phải di dời tăng liên tục giai đoạn 2015 – 2021.","b) Năm 2021 số người phải di dời cao nhất trong bảng.","c) Số liệu phản ánh tình trạng mất an ninh toàn cầu gia tăng.","d) Xung đột và thiên tai không gây di dời dân cư."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: xung đột và thiên tai là nguyên nhân chính gây di dời.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ lệ điện tái tạo ở trên. Xét tính đúng, sai:","statements":["a) Đức có tỉ lệ điện tái tạo cao nhất bảng.","b) Tỉ lệ của Đức cao hơn mức trung bình thế giới.","c) Hoa Kỳ có tỉ lệ thấp nhất bảng.","d) Chênh lệch giữa Đức và Hoa Kỳ là 25 điểm phần trăm."],"answer":["T","T","T","T"],"explain":"a) Đúng: 45% cao nhất. b) Đúng: 45% lớn hơn 29%. c) Đúng: 20% thấp nhất. d) Đúng: 45 trừ 20 bằng 25.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, số người phải di dời năm 2021 tăng bao nhiêu triệu người so với năm 2015?","answer":"24","explain":"89 trừ 65 bằng 24 triệu người.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, chênh lệch tỉ lệ điện tái tạo giữa Đức (45%) và Hoa Kỳ (20%) là bao nhiêu điểm phần trăm?","answer":"25","explain":"45 trừ 20 bằng 25 điểm phần trăm.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: chi tiêu quân sự thế giới (nghìn tỉ USD): 2015: 1,7; 2018: 1,8; 2021: 2,1. Nhận xét nào sau đây đúng?","options":["A. Chi tiêu quân sự giảm liên tục.","B. Chi tiêu quân sự tăng lên, phản ánh tình hình an ninh thế giới còn nhiều bất ổn.","C. Năm 2021 chi tiêu thấp nhất.","D. An ninh thế giới đã hoàn toàn ổn định."],"answer":"B","explain":"Chi tiêu quân sự tăng từ 1,7 lên 2,1 nghìn tỉ USD — phản ánh chạy đua vũ trang và bất ổn an ninh.","points":0.25},{"type":"mcq","level":"VD","q":"Đại dịch COVID-19 cho thấy vấn đề an ninh nào sau đây mang tính toàn cầu?","options":["A. An ninh y tế – dịch bệnh.","B. An ninh lương thực ở một làng.","C. An ninh của một gia đình.","D. An ninh giao thông địa phương."],"answer":"A","explain":"COVID-19 lây lan khắp thế giới, cho thấy an ninh y tế – dịch bệnh là vấn đề an ninh phi truyền thống mang tính toàn cầu.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh cho rằng: “Chỉ cần phát triển kinh tế là tự động bảo đảm được an ninh lương thực, năng lượng và nguồn nước”. Ý kiến này","options":["A. Đúng hoàn toàn.","B. Chưa đúng vì tăng trưởng kinh tế nếu không bền vững có thể làm cạn kiệt tài nguyên, ô nhiễm môi trường, gây mất an ninh; cần phát triển bền vững và hợp tác quốc tế.","C. Sai hoàn toàn vì kinh tế không liên quan.","D. Đúng vì tiền giải quyết được mọi việc."],"answer":"B","explain":"Tăng trưởng nóng có thể gây cạn kiệt tài nguyên, ô nhiễm — đe dọa an ninh; cần phát triển bền vững gắn với bảo vệ tài nguyên, môi trường và hợp tác quốc tế.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: lượng khí CO2 phát thải (tỉ tấn): Trung Quốc 11, Hoa Kỳ 5, Ấn Độ 2,7, EU 2,5 (năm 2020). Nước nào phát thải nhiều nhất?","options":["A. Trung Quốc.","B. Hoa Kỳ.","C. Ấn Độ.","D. EU."],"answer":"A","explain":"Trung Quốc phát thải 11 tỉ tấn CO2 — nhiều nhất bảng, đặt ra thách thức lớn về an ninh môi trường toàn cầu.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện lượng khí CO2 phát thải của các nước trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Biểu đồ kết hợp."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị tuyệt đối giữa các đối tượng tại một thời điểm.","points":0.25},{"type":"mcq","level":"VDC","q":"Giải pháp nào sau đây vừa góp phần bảo đảm an ninh năng lượng vừa bảo vệ môi trường?","options":["A. Mở rộng khai thác than đá.","B. Phát triển điện mặt trời, điện gió thay thế dần nhiên liệu hóa thạch.","C. Tăng nhập khẩu dầu mỏ.","D. Đốt rừng làm nương rẫy."],"answer":"B","explain":"Điện mặt trời, điện gió vừa đa dạng hóa nguồn cung (an ninh năng lượng) vừa giảm phát thải (bảo vệ môi trường).","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu chi tiêu quân sự ở trên. Xét tính đúng, sai:","statements":["a) Chi tiêu quân sự thế giới tăng liên tục giai đoạn 2015 – 2021.","b) Năm 2021 chi tiêu quân sự cao nhất trong bảng.","c) Số liệu phản ánh tình hình an ninh thế giới còn nhiều bất ổn.","d) Chi tiêu quân sự năm 2021 thấp hơn năm 2015."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: 2,1 cao hơn 1,7.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu phát thải CO2 ở trên. Xét tính đúng, sai:","statements":["a) Trung Quốc là nước phát thải CO2 nhiều nhất bảng.","b) Lượng phát thải của Trung Quốc gấp hơn 2 lần Hoa Kỳ.","c) Phát thải CO2 liên quan đến an ninh môi trường toàn cầu.","d) EU phát thải nhiều hơn Ấn Độ."],"answer":["T","T","T","F"],"explain":"a) Đúng: 11 tỉ tấn. b) Đúng: 11 chia 5 bằng 2,2 lần. c) Đúng: CO2 gây biến đổi khí hậu. d) Sai: EU 2,5 thấp hơn Ấn Độ 2,7.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, chi tiêu quân sự thế giới năm 2021 tăng bao nhiêu nghìn tỉ USD so với năm 2015? (làm tròn đến 1 chữ số thập phân)","answer":"0,4","explain":"2,1 trừ 1,7 bằng 0,4 nghìn tỉ USD.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, lượng khí CO2 phát thải của Trung Quốc (11 tỉ tấn) gấp khoảng bao nhiêu lần Hoa Kỳ (5 tỉ tấn)? (làm tròn đến 1 chữ số thập phân)","answer":"2,2","explain":"11 chia 5 bằng 2,2 lần.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tổ chức nào sau đây là tổ chức quốc tế hoạt động trên phạm vi toàn cầu?","options":["A. Liên hợp quốc.","B. ASEAN.","C. EU.","D. AU."],"answer":"A","explain":"Liên hợp quốc hoạt động phạm vi toàn cầu; ASEAN, EU, AU là các tổ chức khu vực.","points":0.25},{"type":"mcq","level":"NB","q":"Năm thành lập của Liên hợp quốc là","options":["A. 1944.","B. 1945.","C. 1967.","D. 1995."],"answer":"B","explain":"Liên hợp quốc thành lập năm 1945.","points":0.25},{"type":"mcq","level":"NB","q":"Vấn đề nào sau đây thuộc an ninh phi truyền thống?","options":["A. Xung đột vũ trang.","B. Chạy đua vũ trang.","C. Biến đổi khí hậu và dịch bệnh toàn cầu.","D. Tranh chấp lãnh thổ."],"answer":"C","explain":"Biến đổi khí hậu, dịch bệnh, khủng bố, an ninh mạng là các vấn đề an ninh phi truyền thống.","points":0.25},{"type":"mcq","level":"NB","q":"Khu vực nào thiếu nước ngọt nghiêm trọng do khí hậu khô nóng?","options":["A. Tây Nam Á.","B. Tây Âu.","C. Đông Nam Á.","D. Đông Bắc Hoa Kỳ."],"answer":"A","explain":"Tây Nam Á (và Bắc Phi) có khí hậu khô nóng, lượng mưa ít nên thiếu nước ngọt nghiêm trọng.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: dân số bị ảnh hưởng bởi hạn hán ở vùng Sừng châu Phi (triệu người): 2019: 12; 2021: 18; 2023: 23. Nhận xét nào sau đây đúng?","options":["A. Số người bị ảnh hưởng giảm liên tục.","B. Số người bị ảnh hưởng tăng nhanh, cho thấy an ninh lương thực và nguồn nước ở đây ngày càng nghiêm trọng.","C. Hạn hán không ảnh hưởng đến con người.","D. Năm 2023 số người bị ảnh hưởng thấp nhất."],"answer":"B","explain":"Số người bị ảnh hưởng tăng từ 12 lên 23 triệu — hạn hán đe dọa nghiêm trọng an ninh lương thực và nguồn nước ở Sừng châu Phi.","points":0.25},{"type":"mcq","level":"VDC","q":"Một quốc gia có thể vừa xuất khẩu lương thực vừa nhập khẩu năng lượng. Điều này cho thấy","options":["A. Các vấn đề an ninh của mỗi nước là khác nhau, các nước phụ thuộc lẫn nhau và cần hợp tác để cùng bảo đảm an ninh.","B. Nước này không cần hợp tác quốc tế.","C. An ninh lương thực không quan trọng.","D. Mọi nước đều tự túc được mọi thứ."],"answer":"A","explain":"Không nước nào tự túc mọi mặt; các vấn đề an ninh đan xen và các nước phụ thuộc lẫn nhau — cần hợp tác quốc tế.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Liên hợp quốc là tổ chức quốc tế hoạt động trên phạm vi toàn cầu.","b) Liên hợp quốc được thành lập năm 1945.","c) Biến đổi khí hậu là vấn đề an ninh phi truyền thống.","d) Tây Nam Á có khí hậu ẩm ướt, mưa nhiều."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Tây Nam Á có khí hậu khô nóng, lượng mưa ít.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu dân số bị ảnh hưởng bởi hạn hán ở Sừng châu Phi ở trên. Xét tính đúng, sai:","statements":["a) Số người bị ảnh hưởng tăng liên tục giai đoạn 2019 – 2023.","b) Năm 2023 số người bị ảnh hưởng cao nhất trong bảng.","c) Số liệu cho thấy an ninh lương thực và nguồn nước ở đây ngày càng nghiêm trọng.","d) Hạn hán không liên quan đến an ninh lương thực."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hạn hán trực tiếp đe dọa sản xuất lương thực.","points":1},{"type":"short","level":"NB","q":"Tổ chức khu vực nào gồm 10 quốc gia Đông Nam Á?","answer":"ASEAN","explain":"ASEAN (Hiệp hội các quốc gia Đông Nam Á) hiện có 10 nước thành viên.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, số người bị ảnh hưởng bởi hạn hán ở Sừng châu Phi năm 2023 tăng bao nhiêu triệu người so với năm 2019?","answer":"11","explain":"23 trừ 12 bằng 11 triệu người.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Quỹ Tiền tệ Quốc tế có tên viết tắt là","options":["A. WB.","B. IMF.","C. WTO.","D. UN."],"answer":"B","explain":"IMF (International Monetary Fund) là Quỹ Tiền tệ Quốc tế.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức nào giám sát hệ thống tài chính toàn cầu và cho các nước vay vốn để ổn định kinh tế?","options":["A. IMF.","B. UNESCO.","C. WHO.","D. FAO."],"answer":"A","explain":"IMF giám sát hệ thống tài chính toàn cầu và hỗ trợ vốn cho các nước gặp khó khăn nhằm ổn định kinh tế.","points":0.25},{"type":"mcq","level":"NB","q":"Nguồn năng lượng nào sau đây KHÔNG phải năng lượng tái tạo?","options":["A. Năng lượng mặt trời.","B. Năng lượng gió.","C. Dầu mỏ.","D. Thủy điện."],"answer":"C","explain":"Dầu mỏ là nhiên liệu hóa thạch, không phải năng lượng tái tạo.","points":0.25},{"type":"mcq","level":"NB","q":"Nguyên nhân chủ yếu gây mất an ninh lương thực ở châu Phi là","options":["A. Xung đột, hạn hán và nghèo đói.","B. Dân số quá ít.","C. Công nghệ quá hiện đại.","D. Xuất khẩu lương thực quá nhiều."],"answer":"A","explain":"Xung đột vũ trang, hạn hán do biến đổi khí hậu và nghèo đói là những nguyên nhân chính gây mất an ninh lương thực ở châu Phi.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ lệ hộ gia đình được dùng điện ở châu Phi cận Xa-ha-ra (%): 2010: 33; 2015: 42; 2020: 48. Nhận xét nào sau đây đúng?","options":["A. Tỉ lệ hộ dùng điện giảm liên tục.","B. Tỉ lệ hộ dùng điện tăng lên nhưng vẫn còn thấp, cho thấy thách thức về an ninh năng lượng ở khu vực này.","C. Năm 2020 đã đạt 100%.","D. An ninh năng lượng ở đây đã được bảo đảm hoàn toàn."],"answer":"B","explain":"Tỉ lệ tăng từ 33% lên 48% nhưng vẫn dưới một nửa — thách thức an ninh năng lượng còn lớn.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao hợp tác quốc tế là yêu cầu bắt buộc trong bảo đảm an ninh nguồn nước?","options":["A. Vì mọi nước đều thừa nước.","B. Vì nhiều nguồn nước (sông, hồ, tầng nước ngầm) chảy qua nhiều quốc gia, việc sử dụng của nước này ảnh hưởng đến nước khác.","C. Vì không nước nào cần nước.","D. Vì nước không quan trọng."],"answer":"B","explain":"Nguồn nước xuyên biên giới mang tính liên quốc gia; hành động của nước thượng nguồn ảnh hưởng trực tiếp nước hạ nguồn — buộc phải hợp tác.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) IMF là Quỹ Tiền tệ Quốc tế.","b) Dầu mỏ là nhiên liệu hóa thạch, không phải năng lượng tái tạo.","c) Xung đột và hạn hán gây mất an ninh lương thực ở châu Phi.","d) Mọi hộ gia đình ở châu Phi cận Xa-ha-ra đều đã có điện."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: năm 2020 mới chỉ 48% hộ gia đình được dùng điện.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ lệ hộ dùng điện ở châu Phi cận Xa-ha-ra ở trên. Xét tính đúng, sai:","statements":["a) Tỉ lệ hộ dùng điện tăng liên tục giai đoạn 2010 – 2020.","b) Năm 2020 tỉ lệ đạt 48%.","c) Thách thức về an ninh năng lượng ở khu vực này còn lớn.","d) Năm 2010 tỉ lệ hộ dùng điện đã đạt trên 50%."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: năm 2010 mới chỉ 33%.","points":1},{"type":"short","level":"NB","q":"Năm 2020, khoảng bao nhiêu phần trăm hộ gia đình ở châu Phi cận Xa-ha-ra được dùng điện? (theo bảng số liệu)","answer":"48","explain":"Theo bảng số liệu, năm 2020 có 48% hộ gia đình ở châu Phi cận Xa-ha-ra được dùng điện.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, tỉ lệ hộ dùng điện ở châu Phi cận Xa-ha-ra năm 2020 tăng bao nhiêu điểm phần trăm so với năm 2010?","answer":"15","explain":"48 trừ 33 bằng 15 điểm phần trăm.","points":0.5}]}]}</script>
