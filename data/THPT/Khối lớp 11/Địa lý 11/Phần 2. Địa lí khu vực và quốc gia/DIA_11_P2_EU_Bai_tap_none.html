51.","c) Hiện nay EU có 27 nước thành viên.","d) Đồng ơ-rô là đồng tiền chung của nhiều nước EU."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thị trường chung EU có 4 tự do lưu thông.","b) Brexit là sự kiện Anh rời EU năm 2020.","c) Tự do lưu thông lao động cho phép người dân EU làm việc ở bất kì nước thành viên nào.","d) EU không có chính sách chung nào."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: EU có nhiều chính sách chung (nông nghiệp, thương mại, môi trường...).","points":1},{"type":"short","level":"NB","q":"EU chính thức được thành lập vào năm nào?","answer":"1993","explain":"Hiệp ước Ma-xtrích-tơ năm 1993 chính thức thành lập Liên minh châu Âu.","points":0.5},{"type":"short","level":"TH","q":"Nước nào đã rời khỏi EU vào năm 2020?","answer":"Anh","explain":"Anh rời EU năm 2020 (Brexit), EU còn 27 thành viên.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Cộng đồng Kinh tế châu Âu (EEC) được thành lập năm","options":["A. 1951.","B. 1957.","C. 1993.","D. 2020."],"answer":"B","explain":"Năm 1957, Hiệp ước Rô-ma thành lập Cộng đồng Kinh tế châu Âu (EEC).","points":0.25},{"type":"mcq","level":"NB","q":"Nền kinh tế lớn nhất trong EU hiện nay là","options":["A. Đức.","B. Hy Lạp.","C. Bồ Đào Nha.","D. Ai-len."],"answer":"A","explain":"Đức là nền kinh tế lớn nhất EU với công nghiệp ô tô, máy móc hàng đầu.","points":0.25},{"type":"mcq","level":"NB","q":"Khu vực kinh tế chiếm tỉ trọng lớn nhất trong GDP của EU là","options":["A. Nông nghiệp.","B. Công nghiệp.","C. Dịch vụ.","D. Khai khoáng."],"answer":"C","explain":"Dịch vụ chiếm trên 70% GDP của EU.","points":0.25},{"type":"mcq","level":"NB","q":"Cảng biển lớn nhất châu Âu, được coi là cửa ngõ thương mại của châu Âu, nằm ở nước nào?","options":["A. Hà Lan.","B. Đức.","C. Pháp.","D. Bỉ."],"answer":"A","explain":"Cảng Rốt-tec-đam (Hà Lan ],"answer":["T","F","T","T"],"explain":"a), c), d) Đúng. b) Sai: bốn tự do là hàng hóa, dịch vụ, vốn, lao động.","points":1},{"type":"truefalse","level":"TH","q":"Dựa vào bảng số liệu GDP các trung tâm kinh tế ở trên. Xét tính đúng, sai:","statements":["a) Hoa Kỳ có GDP lớn nhất bảng.","b) EU đứng thứ hai về GDP trong bảng.","c) Trung Quốc có GDP lớn hơn Nhật Bản.","d) EU có GDP thấp nhất bảng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 21, 17, 15, 5. d) Sai: Nhật Bản thấp nhất.","points":1},{"type":"short","level":"NB","q":"Hiệp ước nào đã chính thức thành lập Liên minh châu Âu năm 1993?","answer":"Ma-xtrích-tơ","explain":"Hiệp ước Ma-xtrích-tơ (1993) chính thức thành lập EU.","points":0.5},{"type":"short","level":"TH","q":"Dựa vào bảng số liệu, GDP của EU năm 2020 là bao nhiêu nghìn tỉ USD?","answer":"17","explain":"GDP của EU khoảng 17 nghìn tỉ USD.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"EU được đánh giá là","options":["A. Liên kết kinh tế khu vực lớn nhất, chặt chẽ nhất thế giới.","B. Tổ chức quân sự lớn nhất.","C. Tổ chức chỉ gồm các nước nghèo.","D. Tổ chức đã giải thể."],"answer":"A","explain":"EU là liên kết kinh tế khu vực lớn nhất, chặt chẽ nhất thế giới với thị trường chung và đồng tiền chung.","points":0.25},{"type":"mcq","level":"TH","q":"Ngành công nghiệp nổi tiếng của Đức trong EU là","options":["A. Ô tô và máy móc.","B. Dệt may thủ công.","C. Khai thác than củi.","D. Đóng tàu gỗ."],"answer":"A","explain":"Đức nổi tiếng với công nghiệp ô tô, máy móc, hóa chất hàng đầu thế giới.","points":0.25},{"type":"mcq","level":"TH","q":"Nông nghiệp của EU có đặc điểm","options":["A. Công nghệ cao, năng suất lớn.","B. Lạc hậu, năng suất thấp.","C. Chỉ trồng lúa nước.","D. Không phát triển."],"answer":"A","explain":"Nông nghiệp EU áp dụng công nghệ cao, năng suất lớn (Pháp, Hà Lan...).","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ nào thích hợp nhất để thể hiện cơ cấu GDP theo khu vực kinh tế của EU năm 2020?","options":["A. Biểu đồ tròn.","B. Biểu đồ đường.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"A","explain":"Biểu đồ tròn thể hiện cơ cấu tại một thời điểm.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: GDP/người (USD) năm 2020: Lu-xăm-bua 115 000, Đức 46 000, Ba Lan 15 000, Bun-ga-ri 9 000. Nhận xét nào sau đây đúng?","options":["A. Mọi nước EU đều có GDP/người như nhau.","B. Trong nội bộ EU còn chênh lệch lớn về trình độ phát triển.","C. Bun-ga-ri có GDP/người cao nhất.","D. Đức thấp hơn Ba Lan."],"answer":"B","explain":"Lu-xăm-bua gấp hơn 12 lần Bun-ga-ri — chênh lệch lớn trong nội bộ EU.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao thị trường chung giúp nội thương EU phát triển mạnh?","options":["A. Vì xóa bỏ rào cản thuế quan và tự do lưu thông hàng hóa, dịch vụ, vốn, lao động.","B. Vì cấm nhập khẩu.","C. Vì chỉ buôn bán với nước ngoài.","D. Vì không có sản xuất."],"answer":"A","explain":"Thị trường chung xóa bỏ thuế quan nội khối và đảm bảo 4 tự do lưu thông nên nội thương phát triển mạnh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) EU là liên kết kinh tế khu vực lớn nhất thế giới.","b) Đức nổi tiếng với công nghiệp ô tô, máy móc.","c) Nông nghiệp EU có trình độ công nghệ cao.","d) Biểu đồ tròn thích hợp để thể hiện cơ cấu GDP."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu GDP/người các nước EU ở trên. Xét tính đúng, sai:","statements":["a) Lu-xăm-bua có GDP/người cao nhất bảng.","b) GDP/người của Lu-xăm-bua gấp hơn 12 lần Bun-ga-ri.","c) Trong nội bộ EU còn chênh lệch phát triển lớn.","d) Ba Lan có GDP/người cao hơn Đức."],"answer":["T","T","T","F"],"explain":"a) Đúng: 115 000 cao nhất. b) Đúng: 115 000 chia 9 000 khoảng 12,8 lần. c) Đúng. d) Sai: Ba Lan 15 000 thấp hơn Đức 46 000.","points":1},{"type":"short","level":"TH","q":"Nước nào nổi tiếng với công nghiệp ô tô hàng đầu trong EU?","answer":"Đức","explain":"Đức nổi tiếng với công nghiệp ô tô, máy móc hàng đầu thế giới.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, GDP/người của Lu-xăm-bua (115 000 USD) gấp khoảng bao nhiêu lần Bun-ga-ri (9 000 USD)? (làm tròn đến hàng đơn vị)","answer":"13","explain":"115 000 chia 9 000 bằng khoảng 12,8, làm tròn là 13 lần.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"TH","q":"Chính sách chung nào sau đây KHÔNG thuộc EU?","options":["A. Chính sách nông nghiệp chung.","B. Chính sách thương mại chung.","C. Chính sách quân sự riêng của từng nước ngoài EU.","D. Chính sách môi trường chung."],"answer":"C","explain":"EU có chính sách chung về nông nghiệp, thương mại, môi trường, đối ngoại...; quốc phòng vẫn chủ yếu do từng nước quyết định.","points":0.25},{"type":"mcq","level":"TH","q":"Tự do lưu thông lao động trong EU cho phép","options":["A. Người dân EU được làm việc ở bất kì nước thành viên nào.","B. Chỉ người Đức được làm việc.","C. Cấm di chuyển giữa các nước.","D. Chỉ lao động nông nghiệp được di chuyển."],"answer":"A","explain":"Công dân EU được tự do sinh sống và làm việc ở bất kì nước thành viên nào.","points":0.25},{"type":"mcq","level":"TH","q":"Thương mại nội khối EU phát triển mạnh nhờ","options":["A. Thị trường chung xóa bỏ rào cản thuế quan.","B. Cấm buôn bán giữa các nước.","C. Chỉ xuất khẩu ra ngoài.","D. Không sản xuất hàng hóa."],"answer":"A","explain":"Thị trường chung với 4 tự do lưu thông giúp nội thương EU phát triển mạnh.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ đường thích hợp nhất để thể hiện","options":["A. Tốc độ tăng trưởng GDP của EU giai đoạn 2000 – 2020.","B. Cơ cấu GDP của EU năm 2020.","C. Tỉ lệ dân đô thị một năm.","D. Diện tích các nước EU."],"answer":"A","explain":"Biểu đồ đường thể hiện sự biến động, tốc độ tăng trưởng theo thời gian.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: tỉ lệ thất nghiệp (%) năm 2020: Đức 4, Pháp 8, Hy Lạp 16, Tây Ban Nha 15. Nước nào có tỉ lệ thất nghiệp cao nhất?","options":["A. Hy Lạp.","B. Đức.","C. Pháp.","D. Tây Ban Nha."],"answer":"A","explain":"Hy Lạp 16% — cao nhất bảng, phản ánh khó khăn kinh tế ở Nam Âu.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nhiều khu vực trên thế giới học tập mô hình liên kết của EU?","options":["A. Vì EU là mô hình liên kết khu vực thành công nhất: thị trường chung, đồng tiền chung, chính sách chung mang lại thịnh vượng.","B. Vì EU giàu tài nguyên.","C. Vì EU có diện tích lớn nhất.","D. Vì EU không có thách thức."],"answer":"A","explain":"EU là mô hình liên kết sâu rộng và thành công nhất, được nhiều khu vực tham khảo.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) EU có chính sách nông nghiệp và thương mại chung.","b) Công dân EU được tự do làm việc ở mọi nước thành viên.","c) Thị trường chung giúp nội thương EU phát triển.","d) Biểu đồ đường thích hợp để thể hiện tốc độ tăng trưởng theo thời gian."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu tỉ lệ thất nghiệp ở trên. Xét tính đúng, sai:","statements":["a) Hy Lạp có tỉ lệ thất nghiệp cao nhất bảng.","b) Đức có tỉ lệ thất nghiệp thấp nhất bảng.","c) Chênh lệch giữa Hy Lạp và Đức là 12 điểm phần trăm.","d) Pháp có tỉ lệ thất nghiệp cao hơn Tây Ban Nha."],"answer":["T","T","T","F"],"explain":"a), b) Đúng. c) Đúng: 16 trừ 4 bằng 12. d) Sai: Pháp 8% thấp hơn Tây Ban Nha 15%.","points":1},{"type":"short","level":"TH","q":"Công dân EU được tự do làm việc ở bất kì nước thành viên nào nhờ tự do lưu thông gì?","answer":"lao động","explain":"Tự do lưu thông lao động cho phép công dân EU làm việc ở mọi nước thành viên.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, chênh lệch tỉ lệ thất nghiệp giữa Hy Lạp (16%) và Đức (4%) là bao nhiêu điểm phần trăm?","answer":"12","explain":"16 trừ 4 bằng 12 điểm phần trăm.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Vai trò của EU trên trường quốc tế là","options":["A. Có tiếng nói quan trọng trong các vấn đề toàn cầu.","B. Không tham gia vấn đề quốc tế.","C. Chỉ lo việc nội bộ.","D. Đã giải thể."],"answer":"A","explain":"EU là trung tâm kinh tế lớn, có tiếng nói quan trọng trong các vấn đề toàn cầu.","points":0.25},{"type":"mcq","level":"TH","q":"Nước nào sau đây KHÔNG phải thành viên EU hiện nay?","options":["A. Đức.","B. Pháp.","C. Anh.","D. I-ta-li-a."],"answer":"C","explain":"Anh đã rời EU năm 2020 (Brexit).","points":0.25},{"type":"mcq","level":"TH","q":"Đồng ơ-rô được sử dụng ở","options":["A. Nhiều nước thành viên EU (khu vực đồng ơ-rô).","B. Tất cả các nước trên thế giới.","C. Chỉ ở Đức.","D. Chỉ ở ngoài EU."],"answer":"A","explain":"Đồng ơ-rô là đồng tiền chung của khu vực đồng ơ-rô gồm nhiều (không phải tất cả) nước EU.","points":0.25},{"type":"mcq","level":"TH","q":"Ngành kinh tế nào chiếm tỉ trọng cao nhất trong GDP của EU?","options":["A. Dịch vụ.","B. Nông nghiệp.","C. Khai khoáng.","D. Lâm nghiệp."],"answer":"A","explain":"Dịch vụ chiếm trên 70% GDP của EU.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: kim ngạch xuất khẩu (nghìn tỉ USD) năm 2020: EU 6,5; Hoa Kỳ 2,1; Trung Quốc 2,6. Nhận xét nào sau đây đúng?","options":["A. EU là trung tâm xuất khẩu lớn nhất trong bảng.","B. Hoa Kỳ xuất khẩu nhiều nhất.","C. Trung Quốc xuất khẩu ít nhất.","D. Ba trung tâm xuất khẩu bằng nhau."],"answer":"A","explain":"EU 6,5 nghìn tỉ USD — lớn nhất bảng, thể hiện vai trò trung tâm thương mại thế giới.","points":0.25},{"type":"mcq","level":"VD","q":"Một doanh nghiệp Việt Nam muốn xuất khẩu sang EU cần lưu ý nhất điều gì?","options":["A. Đáp ứng các tiêu chuẩn khắt khe về chất lượng, an toàn thực phẩm và môi trường của EU.","B. Không cần tiêu chuẩn gì.","C. Chỉ cần giá rẻ.","D. EU không nhập khẩu."],"answer":"A","explain":"EU có các tiêu chuẩn rất khắt khe về chất lượng, an toàn và môi trường — thách thức lớn với hàng xuất khẩu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) EU có tiếng nói quan trọng trong các vấn đề toàn cầu.","b) Anh hiện nay không còn là thành viên EU.","c) Đồng ơ-rô được dùng ở nhiều nước EU.","d) Dịch vụ chiếm tỉ trọng cao nhất trong GDP của EU."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu kim ngạch xuất khẩu ở trên. Xét tính đúng, sai:","statements":["a) EU có kim ngạch xuất khẩu lớn nhất bảng.","b) Kim ngạch của EU gấp hơn 3 lần Hoa Kỳ.","c) Trung Quốc xuất khẩu nhiều hơn Hoa Kỳ.","d) Hoa Kỳ xuất khẩu nhiều nhất bảng."],"answer":["T","T","T","F"],"explain":"a) Đúng: 6,5 lớn nhất. b) Đúng: 6,5 chia 2,1 khoảng 3,1 lần. c) Đúng: 2,6 lớn hơn 2,1. d) Sai.","points":1},{"type":"short","level":"TH","q":"Khu vực gồm các nước EU sử dụng đồng tiền chung ơ-rô được gọi là gì?","answer":"khu vực đồng ơ-rô","explain":"Khu vực đồng ơ-rô (eurozone) gồm các nước EU sử dụng đồng ơ-rô làm đồng tiền chung.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, kim ngạch xuất khẩu của EU (6,5 nghìn tỉ USD) gấp khoảng bao nhiêu lần Hoa Kỳ (2,1 nghìn tỉ USD)? (làm tròn đến 1 chữ số thập phân)","answer":"3,1","explain":"6,5 chia 2,1 bằng khoảng 3,1 lần.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: số nước thành viên EU: 1995: 15; 2004: 25; 2013: 28; 2020: 27. Nhận xét nào sau đây đúng?","options":["A. Số thành viên tăng liên tục từ 1995 đến 2020.","B. Số thành viên tăng mạnh nhờ mở rộng về phía đông, sau đó giảm 1 do Brexit.","C. EU chưa từng mở rộng.","D. Năm 2020 EU có 28 thành viên."],"answer":"B","explain":"EU mở rộng mạnh về phía đông (2004), đạt 28 rồi giảm còn 27 sau Brexit 2020.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao các nước Đông Âu muốn gia nhập EU?","options":["A. Để được tiếp cận thị trường chung, vốn đầu tư và hỗ trợ phát triển.","B. Để bị kiểm soát.","C. Để giảm thương mại.","D. Không có lí do."],"answer":"A","explain":"Gia nhập EU giúp các nước Đông Âu tiếp cận thị trường rộng lớn, vốn FDI và các quỹ hỗ trợ phát triển.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh nói: “EU chỉ mang lại lợi ích, không có thách thức nào”. Ý kiến này","options":["A. Đúng hoàn toàn.","B. Chưa đúng vì EU vẫn đối mặt chênh lệch phát triển nội khối, vấn đề nhập cư và mâu thuẫn lợi ích như Brexit.","C. Sai hoàn toàn vì EU không có lợi ích.","D. Đúng vì EU hoàn hảo."],"answer":"B","explain":"EU thành công nhưng vẫn có thách thức: chênh lệch phát triển, nhập cư, mâu thuẫn nội bộ (Brexit).","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ trọng EU trong GDP thế giới (%): 2000: 28; 2010: 25; 2020: 21. Xu hướng này phản ánh","options":["A. EU suy yếu tuyệt đối và biến mất.","B. Sự trỗi dậy của các nền kinh tế mới nổi làm cán cân kinh tế thế giới dịch chuyển.","C. GDP thế giới giảm.","D. EU không còn vai trò gì."],"answer":"B","explain":"Tỉ trọng giảm do các nền kinh tế mới nổi (Trung Quốc, Ấn Độ...) tăng nhanh hơn — dịch chuyển cán cân kinh tế thế giới.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện số nước thành viên EU qua các năm trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ tròn.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị qua các thời điểm rời rạc.","points":0.25},{"type":"mcq","level":"VDC","q":"Bài học nào cho ASEAN từ mô hình liên kết của EU?","options":["A. Liên kết sâu rộng (thị trường chung, chính sách chung) giúp các nước cùng thịnh vượng, nhưng cần tôn trọng sự đa dạng và có lộ trình phù hợp.","B. Nên sao chép y nguyên mô hình EU.","C. Không nên liên kết.","D. Chỉ liên kết quân sự."],"answer":"A","explain":"ASEAN học tập tinh thần liên kết sâu của EU nhưng phải phù hợp với đặc điểm đa dạng của khu vực.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu số nước thành viên EU ở trên. Xét tính đúng, sai:","statements":["a) Năm 2004 EU kết nạp thêm 10 nước, lên 25 thành viên.","b) Năm 2020 EU còn 27 thành viên do Brexit.","c) EU đã từng mở rộng về phía đông.","d) Số thành viên EU năm 2020 nhiều hơn năm 2013."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: 27 ít hơn 28.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ trọng EU trong GDP thế giới ở trên. Xét tính đúng, sai:","statements":["a) Tỉ trọng của EU giảm liên tục từ 2000 đến 2020.","b) Xu hướng này phản ánh sự trỗi dậy của các nền kinh tế mới nổi.","c) Năm 2020 EU vẫn chiếm trên 20% GDP thế giới.","d) GDP tuyệt đối của EU giảm liên tục."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 21% vẫn trên 20%. d) Sai: tỉ trọng giảm không có nghĩa GDP tuyệt đối giảm.","points":1},{"type":"short","level":"VD","q":"Năm 2004, EU kết nạp thêm 10 nước, nâng tổng số thành viên lên bao nhiêu?","answer":"25","explain":"Năm 2004 EU mở rộng lớn nhất, từ 15 lên 25 thành viên.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, tỉ trọng của EU trong GDP thế giới năm 2020 giảm bao nhiêu điểm phần trăm so với năm 2000?","answer":"7","explain":"28 trừ 21 bằng 7 điểm phần trăm.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: dân số (triệu người) năm 2020: Đức 83, Pháp 68, I-ta-li-a 60, Tây Ban Nha 47. Nước nào đông dân nhất EU?","options":["A. Đức.","B. Pháp.","C. I-ta-li-a.","D. Tây Ban Nha."],"answer":"A","explain":"Đức 83 triệu người — đông dân nhất EU.","points":0.25},{"type":"mcq","level":"VD","q":"Pháp có thế mạnh nổi bật nào trong EU?","options":["A. Nông nghiệp, công nghiệp hàng không và du lịch.","B. Khai thác dầu mỏ.","C. Trồng lúa nước.","D. Đánh bắt cá voi."],"answer":"A","explain":"Pháp nổi tiếng với nông nghiệp (rượu vang), công nghiệp hàng không (Airbus) và du lịch.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty logistics muốn đặt trung tâm phân phối hàng hóa cho cả châu Âu. Vị trí thuận lợi nhất là","options":["A. Hà Lan (cảng Rốt-tec-đam).","B. Một nước không có cảng biển ở sâu trong nội địa.","C. Vùng núi cao.","D. Ngoài châu Âu."],"answer":"A","explain":"Cảng Rốt-tec-đam là cảng lớn nhất châu Âu, cửa ngõ thương mại — vị trí logistics lí tưởng.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: kim ngạch thương mại nội khối EU (nghìn tỉ USD): 2000: 2,0; 2010: 3,8; 2020: 4,2. Nhận xét nào sau đây đúng?","options":["A. Thương mại nội khối tăng hơn 2 lần giai đoạn 2000 – 2020, cho thấy hiệu quả của thị trường chung.","B. Thương mại nội khối giảm.","C. Năm 2020 thấp hơn năm 2000.","D. Thị trường chung không có tác dụng."],"answer":"A","explain":"4,2 chia 2,0 bằng 2,1 lần — nội thương tăng mạnh nhờ thị trường chung.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện kim ngạch thương mại nội khối EU qua các năm trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ tròn.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Biểu đồ đường."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị tuyệt đối qua các năm rời rạc.","points":0.25},{"type":"mcq","level":"VDC","q":"Thách thức lớn nhất của EU trong vấn đề nhập cư là","options":["A. Vừa cần lao động nhập cư bổ sung, vừa phải đối mặt với sức ép xã hội, việc làm và an ninh.","B. Không có người nhập cư.","C. Cấm hoàn toàn nhập cư.","D. Nhập cư không ảnh hưởng gì."],"answer":"A","explain":"EU già hóa dân số nên cần lao động nhập cư, nhưng làn sóng nhập cư ồ ạt gây sức ép xã hội và an ninh.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu dân số các nước EU ở trên. Xét tính đúng, sai:","statements":["a) Đức là nước đông dân nhất EU.","b) Pháp đông dân hơn I-ta-li-a.","c) Tây Ban Nha có dân số thấp nhất bảng.","d) I-ta-li-a đông dân hơn Đức."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 83, 68, 60, 47. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu thương mại nội khối EU ở trên. Xét tính đúng, sai:","statements":["a) Thương mại nội khối tăng liên tục giai đoạn 2000 – 2020.","b) Năm 2020 gấp hơn 2 lần năm 2000.","c) Số liệu cho thấy hiệu quả của thị trường chung.","d) Năm 2010 thương mại nội khối thấp hơn năm 2000."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 4,2 chia 2,0 bằng 2,1 lần. d) Sai: 3,8 cao hơn 2,0.","points":1},{"type":"short","level":"VD","q":"Nước nào đông dân nhất trong Liên minh châu Âu?","answer":"Đức","explain":"Đức có dân số khoảng 83 triệu người, đông nhất EU.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, thương mại nội khối EU năm 2020 gấp khoảng bao nhiêu lần năm 2000? (làm tròn đến 1 chữ số thập phân)","answer":"2,1","explain":"4,2 chia 2,0 bằng 2,1 lần.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"EU là tên viết tắt của","options":["A. Liên minh châu Âu.","B. Liên hợp quốc.","C. Cộng đồng châu Á.","D. Khối Bắc Mỹ."],"answer":"A","explain":"EU (European Union) là Liên minh châu Âu.","points":0.25},{"type":"mcq","level":"NB","q":"Năm 1951, 6 nước Tây Âu thành lập tổ chức nào?","options":["A. Cộng đồng Than – Thép châu Âu.","B. Liên minh châu Âu.","C. NATO.","D. Liên hợp quốc."],"answer":"A","explain":"Cộng đồng Than – Thép châu Âu (1951) là tiền thân của EU.","points":0.25},{"type":"mcq","level":"NB","q":"Nước nào sau đây KHÔNG phải thành viên EU?","options":["A. Đức.","B. Hoa Kỳ.","C. Pháp.","D. Tây Ban Nha."],"answer":"B","explain":"Hoa Kỳ không phải thành viên EU.","points":0.25},{"type":"mcq","level":"NB","q":"Đồng tiền chung của khu vực đồng ơ-rô là","options":["A. Đồng ơ-rô.","B. Đồng đô la.","C. Đồng yên.","D. Đồng bảng."],"answer":"A","explain":"Đồng ơ-rô (euro) là đồng tiền chung của khu vực đồng ơ-rô.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ lệ năng lượng tái tạo trong tổng tiêu thụ năng lượng (%): Đức 18, Pháp 17, Thụy Điển 55, EU trung bình 22 (năm 2020). Nhận xét nào sau đây đúng?","options":["A. Thụy Điển dẫn đầu EU về tỉ lệ năng lượng tái tạo.","B. Đức cao nhất bảng.","C. Pháp thấp nhất bảng.","D. EU trung bình cao hơn Thụy Điển."],"answer":"A","explain":"Thụy Điển 55% — cao nhất bảng, vượt xa mức trung bình EU.","points":0.25},{"type":"mcq","level":"VDC","q":"Một sinh viên Việt Nam muốn du học ở một nước EU có nền công nghiệp ô tô hàng đầu. Lựa chọn phù hợp nhất là","options":["A. Đức.","B. Hy Lạp.","C. Bồ Đào Nha.","D. Ai-len."],"answer":"A","explain":"Đức có nền công nghiệp ô tô, máy móc hàng đầu thế giới.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) EU là Liên minh châu Âu.","b) Cộng đồng Than – Thép châu Âu ra đời năm 1951.","c) Hoa Kỳ là thành viên EU.","d) Đồng ơ-rô là đồng tiền chung của khu vực đồng ơ-rô."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Hoa Kỳ không thuộc EU.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu năng lượng tái tạo ở trên. Xét tính đúng, sai:","statements":["a) Thụy Điển có tỉ lệ năng lượng tái tạo cao nhất bảng.","b) Tỉ lệ của Thụy Điển gấp hơn 3 lần Đức.","c) Mức trung bình EU là 22%.","d) Đức có tỉ lệ cao hơn mức trung bình EU."],"answer":["T","T","T","F"],"explain":"a) Đúng: 55% cao nhất. b) Đúng: 55 chia 18 khoảng 3,1 lần. c) Đúng. d) Sai: Đức 18% thấp hơn 22%.","points":1},{"type":"short","level":"NB","q":"Cộng đồng Than – Thép châu Âu được thành lập vào năm nào?","answer":"1951","explain":"Cộng đồng Than – Thép châu Âu thành lập năm 1951.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, tỉ lệ năng lượng tái tạo của Thụy Điển (55%) gấp khoảng bao nhiêu lần Đức (18%)? (làm tròn đến 1 chữ số thập phân)","answer":"3,1","explain":"55 chia 18 bằng khoảng 3,06, làm tròn là 3,1 lần.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Thị trường chung EU đảm bảo mấy tự do lưu thông?","options":["A. 2.","B. 3.","C. 4.","D. 5."],"answer":"C","explain":"Thị trường chung EU có 4 tự do lưu thông: hàng hóa, dịch vụ, vốn, lao động.","points":0.25},{"type":"mcq","level":"NB","q":"Nước nào có nền kinh tế lớn nhất EU?","options":["A. Đức.","B. Ba Lan.","C. Hy Lạp.","D. Rumani."],"answer":"A","explain":"Đức là nền kinh tế lớn nhất EU.","points":0.25},{"type":"mcq","level":"NB","q":"Khu vực kinh tế chiếm tỉ trọng cao nhất trong GDP của EU là","options":["A. Dịch vụ.","B. Nông nghiệp.","C. Công nghiệp.","D. Xây dựng."],"answer":"A","explain":"Dịch vụ chiếm trên 70% GDP của EU.","points":0.25},{"type":"mcq","level":"NB","q":"Sự kiện nào khiến EU giảm từ 28 xuống 27 thành viên?","options":["A. Brexit.","B. Mở rộng về phía đông.","C. Thành lập EU.","D. Thành lập EEC."],"answer":"A","explain":"Brexit (Anh rời EU, 2020) khiến EU còn 27 thành viên.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: xuất khẩu nông sản (tỉ USD) năm 2020: Pháp 75, Hà Lan 110, Đức 85. Nước nào xuất khẩu nông sản lớn nhất?","options":["A. Hà Lan.","B. Pháp.","C. Đức.","D. Cả ba bằng nhau."],"answer":"A","explain":"Hà Lan 110 tỉ USD — lớn nhất bảng nhờ nông nghiệp công nghệ cao.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao Hà Lan tuy diện tích nhỏ nhưng là nước xuất khẩu nông sản hàng đầu EU?","options":["A. Nhờ nông nghiệp công nghệ cao, nhà kính hiện đại và cảng Rốt-tec-đam thuận lợi xuất khẩu.","B. Nhờ diện tích lớn.","C. Nhờ dân số đông.","D. Nhờ khí hậu nhiệt đới."],"answer":"A","explain":"Hà Lan phát triển nông nghiệp nhà kính công nghệ cao và có cảng Rốt-tec-đam — xuất khẩu nông sản hàng đầu.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thị trường chung EU có 4 tự do lưu thông.","b) Đức là nền kinh tế lớn nhất EU.","c) Dịch vụ chiếm tỉ trọng cao nhất trong GDP của EU.","d) Brexit khiến EU tăng thêm thành viên."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Brexit khiến EU giảm từ 28 xuống 27 thành viên.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu xuất khẩu nông sản ở trên. Xét tính đúng, sai:","statements":["a) Hà Lan xuất khẩu nông sản nhiều nhất bảng.","b) Pháp xuất khẩu ít hơn Hà Lan.","c) Đức xuất khẩu nhiều hơn Pháp.","d) Cả ba nước đều xuất khẩu nông sản lớn."],"answer":["T","T","T","T"],"explain":"a) Đúng: 110 lớn nhất. b) Đúng: 75 ít hơn 110. c) Đúng: 85 lớn hơn 75. d) Đúng.","points":1},{"type":"short","level":"NB","q":"Cảng biển lớn nhất châu Âu nằm ở nước nào?","answer":"Hà Lan","explain":"Cảng Rốt-tec-đam (Hà Lan) là cảng biển lớn nhất châu Âu.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, kim ngạch xuất khẩu nông sản của Hà Lan (110 tỉ USD) hơn Pháp (75 tỉ USD) bao nhiêu tỉ USD?","answer":"35","explain":"110 trừ 75 bằng 35 tỉ USD.","points":0.5}]}]}</script>
