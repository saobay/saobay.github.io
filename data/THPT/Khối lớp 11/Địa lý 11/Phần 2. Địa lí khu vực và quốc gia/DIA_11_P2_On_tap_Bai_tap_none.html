ên kết sâu rộng về kinh tế, tiền tệ, chính sách làm nên thành công của EU.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Biểu đồ tròn thích hợp để thể hiện cơ cấu.","b) Biểu đồ đường thích hợp để thể hiện tăng trưởng theo thời gian.","c) BRICS gồm Bra-xin, Nga, Ấn Độ, Trung Quốc, Nam Phi.","d) Bra-xin vừa thuộc Mỹ La tinh vừa là thành viên BRICS."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu GDP ở trên. Xét tính đúng, sai:","statements":["a) Hoa Kỳ đứng thứ nhất bảng.","b) Nhật Bản đứng thứ 3 trong bảng.","c) Ấn Độ đứng cuối bảng.","d) Đức đứng thứ 2 trong bảng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Trung Quốc thứ 2.","points":1},{"type":"short","level":"TH","q":"Tổ chức các nền kinh tế mới nổi gồm Bra-xin, Nga, Ấn Độ, Trung Quốc, Nam Phi có tên viết tắt là gì?","answer":"BRICS","explain":"BRICS là tổ chức các nền kinh tế mới nổi.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, GDP của Hoa Kỳ (21 nghìn tỉ USD) gấp bao nhiêu lần Ấn Độ (2,7 nghìn tỉ USD)? (làm tròn đến 1 chữ số thập phân)","answer":"7,8","explain":"21 chia 2,7 bằng khoảng 7,78, làm tròn là 7,8 lần.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"TH","q":"Điểm chung về tự nhiên của Nhật Bản và Đông Nam Á (đảo) là","options":["A. Đều là quốc đảo/quần đảo, nhiều động đất, núi lửa.","B. Đều là sa mạc.","C. Đều lạnh giá quanh năm.","D. Đều không có biển."],"answer":"A","explain":"Nhật Bản và Đông Nam Á hải đảo đều nằm trên vành đai lửa TBD.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung về kinh tế của Hoa Kỳ, Nhật Bản, Đức là","options":["A. Đều là nước phát triển, mạnh về công nghiệp công nghệ cao.","B. Đều là nước đang phát triển.","C. Đều nghèo tài nguyên.","D. Đều chỉ phát triển nông nghiệp."],"answer":"A","explain":"Cả ba đều là cường quốc công nghiệp phát tri  Nhật Bản cao nhất.","D. Nga cao hơn Ni-giê."],"answer":"A","explain":"38 cao nhất, -5 thấp nhất.","points":0.25},{"type":"mcq","level":"VDC","q":"Sự khác biệt tỉ lệ tăng dân số giữa Ni-giê và Nhật Bản phản ánh","options":["A. Chênh lệch trình độ phát triển và chính sách dân số.","B. Không phản ánh gì.","C. Do khí hậu.","D. Do diện tích."],"answer":"A","explain":"Nước kém phát triển tăng nhanh, nước phát triển tăng chậm/âm.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện tỉ lệ tăng dân số tự nhiên của các nước trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ tròn.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị (kể cả giá trị âm) giữa các đối tượng.","points":0.25},{"type":"mcq","level":"VDC","q":"Việt Nam có thể học gì từ chính sách dân số của Nhật Bản và Trung Quốc?","options":["A. Duy trì mức sinh hợp lí, tránh già hóa nhanh hay bùng nổ dân số.","B. Không cần chính sách.","C. Tăng sinh tối đa.","D. Giảm sinh tối đa."],"answer":"A","explain":"Cần chính sách dân số cân bằng, bền vững.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu dân số ở trên. Xét tính đúng, sai:","statements":["a) Trung Quốc đông dân nhất bảng.","b) Ấn Độ đông hơn Hoa Kỳ.","c) In-đô-nê-xi-a ít dân nhất bảng.","d) Hoa Kỳ đông dân hơn Trung Quốc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 1 400; 1 380; 331; 274. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ lệ tăng dân số ở trên. Xét tính đúng, sai:","statements":["a) Ni-giê có tỉ lệ cao nhất bảng.","b) Nga có tỉ lệ thấp nhất bảng.","c) Việt Nam tăng dương.","d) Nhật Bản tăng nhanh hơn Ni-giê."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 38, -5, 9, -4. d) Sai.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, nước nào có dân số đông thứ hai trong bảng?","answer":"Ấn Độ","explain":"Ấn Độ 1 380 triệu — đông thứ hai sau Trung Quốc.","points":0.5},{"type":
