<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Khu vực Mỹ La tinh gồm các bộ phận nào sau đây?","options":["A. Trung Mỹ, vùng Ca-ri-bê và Nam Mỹ.","B. Bắc Mỹ và Trung Mỹ.","C. Chỉ có Nam Mỹ.","D. Hoa Kỳ và Ca-na-đa."],"answer":"A","explain":"Mỹ La tinh gồm Trung Mỹ, vùng Ca-ri-bê và Nam Mỹ — các nước chịu ảnh hưởng văn hóa La tinh.","points":0.25},{"type":"mcq","level":"NB","q":"Dãy núi trẻ, cao và đồ sộ chạy dọc phía tây Nam Mỹ là","options":["A. Dãy An-đét.","B. Dãy A-pa-lat.","C. Dãy Hi-ma-lay-a.","D. Dãy An-pơ."],"answer":"A","explain":"Dãy An-đét là dãy núi trẻ chạy dọc phía tây Nam Mỹ, có nhiều đỉnh cao trên 6 000 m.","points":0.25},{"type":"mcq","level":"NB","q":"Sông nào có lưu vực rộng lớn nhất thế giới?","options":["A. Sông Nin.","B. Sông A-ma-dôn.","C. Sông Mê Công.","D. Sông Đa-nuýp."],"answer":"B","explain":"Sông A-ma-dôn ở Nam Mỹ có lưu vực rộng lớn nhất thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Rừng rậm A-ma-dôn được ví như","options":["A. Lá phổi xanh của thế giới.","B. Vườn quốc gia lớn nhất.","C. Sa mạc lớn nhất.","D. Đồng cỏ lớn nhất."],"answer":"A","explain":"Rừng rậm A-ma-dôn giàu đa dạng sinh học, được ví như lá phổi xanh của thế giới.","points":0.25},{"type":"mcq","level":"TH","q":"Kênh đào Pa-na-ma có ý nghĩa quan trọng vì","options":["A. Nối Thái Bình Dương với Đại Tây Dương, rút ngắn đường hàng hải.","B. Cung cấp nước tưới cho nông nghiệp.","C. Là biên giới tự nhiên giữa hai châu lục.","D. Ngăn cách Nam Mỹ với Bắc Mỹ."],"answer":"A","explain":"Kênh đào Pa-na-ma nối hai đại dương, giúp tàu thuyền không phải đi vòng qua mũi Hảo Vọng phía nam.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc điểm nổi bật về dân cư – xã hội của Mỹ La tinh là","options":["A. Dân cư thuần nhất một chủng tộc.","B. Đa chủng tộc, đô thị hóa cao, chênh lệch giàu nghèo lớn.","C. Dân số ít, phân bố đều.","D. Không có đô thị lớn."],"answer":"B","explain":"Mỹ La tinh có dân cư đa chủng tộc (người lai chiếm đa số), đô thị hóa trên 80% và chênh lệch giàu nghèo sâu sắc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mỹ La tinh gồm Trung Mỹ, vùng Ca-ri-bê và Nam Mỹ.","b) Dãy An-đét nằm ở phía đông Nam Mỹ.","c) Sông A-ma-dôn có lưu vực rộng lớn nhất thế giới.","d) Kênh đào Pa-na-ma nối Thái Bình Dương với Đại Tây Dương."],"answer":["T","F","T","T"],"explain":"a), c), d) Đúng. b) Sai: dãy An-đét chạy dọc phía tây Nam Mỹ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Rừng A-ma-dôn rất giàu đa dạng sinh học.","b) Ngôn ngữ chính của Mỹ La tinh là tiếng Anh.","c) Tỉ lệ dân đô thị của Mỹ La tinh trên 80%.","d) Bra-xin sử dụng tiếng Tây Ban Nha là ngôn ngữ chính."],"answer":["T","F","T","F"],"explain":"a), c) Đúng. b) Sai: ngôn ngữ chính là tiếng Tây Ban Nha và tiếng Bồ Đào Nha. d) Sai: Bra-xin nói tiếng Bồ Đào Nha.","points":1},{"type":"short","level":"NB","q":"Dãy núi trẻ chạy dọc phía tây Nam Mỹ có tên là gì?","answer":"An-đét","explain":"Dãy An-đét là dãy núi trẻ, cao, chạy dọc phía tây Nam Mỹ.","points":0.5},{"type":"short","level":"TH","q":"Quốc gia Nam Mỹ nào sử dụng tiếng Bồ Đào Nha là ngôn ngữ chính?","answer":"Bra-xin","explain":"Bra-xin từng là thuộc địa của Bồ Đào Nha nên sử dụng tiếng Bồ Đào Nha.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Kênh đào nối Thái Bình Dương với Đại Tây Dương ở Trung Mỹ là","options":["A. Kênh đào Xuy-ê.","B. Kênh đào Pa-na-ma.","C. Kênh đào Ki-en.","D. Kênh đào Co-rin-tơ."],"answer":"B","explain":"Kênh đào Pa-na-ma ở Trung Mỹ nối Thái Bình Dương với Đại Tây Dương.","points":0.25},{"type":"mcq","level":"NB","q":"Đồng bằng rộng lớn ở phía đông nam Nam Mỹ là","options":["A. Đồng bằng La Pla-ta.","B. Đồng bằng sông Hằng.","C. Đồng bằng Hoa Bắc.","D. Đồng bằng Tây Xi-bia."],"answer":"A","explain":"Đồng bằng La Pla-ta (gồm Pam-pa) là đồng bằng rộng lớn, màu mỡ ở phía đông nam Nam Mỹ.","points":0.25},{"type":"mcq","level":"NB","q":"Quốc gia nào là nước sản xuất và xuất khẩu cà phê lớn nhất thế giới?","options":["A. Bra-xin.","B. Việt Nam.","C. Cô-lôm-bi-a.","D. Ê-ti-ô-pi-a."],"answer":"A","explain":"Bra-xin là nước sản xuất và xuất khẩu cà phê lớn nhất thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Ngôn ngữ chính của Bra-xin là","options":["A. Tiếng Tây Ban Nha.","B. Tiếng Bồ Đào Nha.","C. Tiếng Anh.","D. Tiếng Pháp."],"answer":"B","explain":"Bra-xin từng là thuộc địa của Bồ Đào Nha nên ngôn ngữ chính là tiếng Bồ Đào Nha.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao khí hậu Mỹ La tinh rất đa dạng?","options":["A. Vì lãnh thổ trải dài từ khoảng 32°B đến 56°N, qua nhiều đới khí hậu, lại có địa hình phân hóa.","B. Vì nằm hoàn toàn trong đới nóng.","C. Vì không có núi cao.","D. Vì bao quanh là sa mạc."],"answer":"A","explain":"Lãnh thổ trải dài qua nhiều vĩ độ cộng với địa hình (An-đét, sơn nguyên) tạo nên sự đa dạng khí hậu.","points":0.25},{"type":"mcq","level":"TH","q":"Khó khăn lớn về kinh tế của các nước Mỹ La tinh là","options":["A. Thừa vốn đầu tư.","B. Nợ nước ngoài lớn, phụ thuộc vào tư bản nước ngoài.","C. Thiếu tài nguyên thiên nhiên.","D. Không có lao động."],"answer":"B","explain":"Nhiều nước Mỹ La tinh nợ nước ngoài lớn và phụ thuộc vào tư bản nước ngoài, kinh tế tăng trưởng không ổn định.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kênh đào Pa-na-ma nằm ở Trung Mỹ.","b) Đồng bằng La Pla-ta nằm ở phía đông nam Nam Mỹ.","c) Bra-xin là nước xuất khẩu cà phê lớn nhất thế giới.","d) Bra-xin nói tiếng Tây Ban Nha."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Bra-xin nói tiếng Bồ Đào Nha.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lãnh thổ trải dài qua nhiều vĩ độ làm khí hậu Mỹ La tinh đa dạng.","b) Nợ nước ngoài là khó khăn lớn của kinh tế Mỹ La tinh.","c) Các nước Mỹ La tinh đều là nước phát triển.","d) Tốc độ tăng trưởng kinh tế của khu vực rất ổn định."],"answer":["T","T","F","F"],"explain":"a), b) Đúng. c) Sai: các nước Mỹ La tinh đều là nước đang phát triển. d) Sai: tăng trưởng không ổn định.","points":1},{"type":"short","level":"NB","q":"Quốc gia Mỹ La tinh nào có trữ lượng dầu mỏ lớn nhất thế giới?","answer":"Vê-nê-xu-ê-la","explain":"Vê-nê-xu-ê-la có trữ lượng dầu mỏ đã được chứng minh lớn nhất thế giới.","points":0.5},{"type":"short","level":"TH","q":"Quốc gia nào là nước xuất khẩu đồng hàng đầu thế giới ở Nam Mỹ?","answer":"Chi-lê","explain":"Chi-lê là nước xuất khẩu đồng hàng đầu thế giới.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Dân số của khu vực Mỹ La tinh khoảng","options":["A. 65 triệu người.","B. 650 triệu người.","C. 6,5 tỉ người.","D. 65 nghìn người."],"answer":"B","explain":"Dân số Mỹ La tinh khoảng 650 triệu người (năm 2020).","points":0.25},{"type":"mcq","level":"NB","q":"Tỉ lệ dân đô thị của Mỹ La tinh khoảng","options":["A. Dưới 30%.","B. Khoảng 50%.","C. Trên 80%.","D. Dưới 10%."],"answer":"C","explain":"Mỹ La tinh có tỉ lệ dân đô thị trên 80% — thuộc hàng cao nhất trong các khu vực đang phát triển.","points":0.25},{"type":"mcq","level":"NB","q":"Nền kinh tế lớn nhất khu vực Mỹ La tinh là","options":["A. Bra-xin.","B. Chi-lê.","C. Cô-lôm-bi-a.","D. Pê-ru."],"answer":"A","explain":"Bra-xin là nền kinh tế lớn nhất Mỹ La tinh.","points":0.25},{"type":"mcq","level":"NB","q":"Cây công nghiệp nổi tiếng nhất của Bra-xin là","options":["A. Cà phê.","B. Chè.","C. Cao su.","D. Hồ tiêu."],"answer":"A","explain":"Bra-xin nổi tiếng với cà phê — nước sản xuất và xuất khẩu cà phê lớn nhất thế giới.","points":0.25},{"type":"mcq","level":"TH","q":"Cho bảng số liệu: tỉ lệ dân đô thị (%) năm 2020: Ác-hen-ti-na 92, Bra-xin 87, Mê-hi-cô 80. Nhận xét nào sau đây đúng?","options":["A. Các nước Mỹ La tinh có tỉ lệ dân đô thị thấp.","B. Các nước Mỹ La tinh có tỉ lệ dân đô thị rất cao, Ác-hen-ti-na cao nhất bảng.","C. Mê-hi-cô có tỉ lệ dân đô thị cao nhất.","D. Bra-xin có tỉ lệ dân đô thị thấp nhất thế giới."],"answer":"B","explain":"Cả ba nước đều trên 80%, Ác-hen-ti-na cao nhất (92%) — thể hiện đô thị hóa cao của khu vực.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao ở các đô thị lớn của Mỹ La tinh xuất hiện các khu ổ chuột (pha-vê-la)?","options":["A. Vì đô thị hóa tự phát: dân nghèo từ nông thôn đổ về thành phố nhưng thiếu việc làm và nhà ở.","B. Vì chính phủ xây nhà ổ chuột.","C. Vì người dân thích sống ở ổ chuột.","D. Vì không có nông thôn."],"answer":"A","explain":"Đô thị hóa tự phát khiến dân nghèo đổ về thành phố, thiếu việc làm và nhà ở — hình thành các khu ổ chuột.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dân số Mỹ La tinh khoảng 650 triệu người.","b) Tỉ lệ dân đô thị của Mỹ La tinh trên 80%.","c) Bra-xin là nền kinh tế lớn nhất Mỹ La tinh.","d) Cà phê là cây công nghiệp nổi tiếng của Bra-xin."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Dựa vào bảng số liệu tỉ lệ dân đô thị ở trên. Xét tính đúng, sai:","statements":["a) Ác-hen-ti-na có tỉ lệ dân đô thị cao nhất bảng.","b) Cả ba nước đều có tỉ lệ dân đô thị trên 80%.","c) Mê-hi-cô có tỉ lệ dân đô thị thấp nhất bảng.","d) Số liệu cho thấy đô thị hóa của khu vực còn thấp."],"answer":["T","T","T","F"],"explain":"a) Đúng: 92% cao nhất. b), c) Đúng: Mê-hi-cô 80% thấp nhất bảng. d) Sai: trên 80% là rất cao.","points":1},{"type":"short","level":"NB","q":"Các khu ổ chuột ở các đô thị lớn Mỹ La tinh được gọi là gì?","answer":"pha-vê-la","explain":"Pha-vê-la (favela) là tên gọi các khu ổ chuột ở Bra-xin và các đô thị Mỹ La tinh.","points":0.5},{"type":"short","level":"TH","q":"Dựa vào bảng số liệu, nước nào có tỉ lệ dân đô thị cao nhất?","answer":"Ác-hen-ti-na","explain":"Ác-hen-ti-na có tỉ lệ dân đô thị 92%, cao nhất bảng.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Bộ phận dân cư chiếm đa số ở Mỹ La tinh là","options":["A. Người lai (giữa người châu Âu và người bản địa).","B. Người da trắng thuần chủng.","C. Người da đen thuần chủng.","D. Người châu Á."],"answer":"A","explain":"Người lai giữa người châu Âu và người bản địa chiếm đa số dân cư Mỹ La tinh.","points":0.25},{"type":"mcq","level":"TH","q":"Ngành chăn nuôi bò phát triển mạnh ở các nước nào của Nam Mỹ?","options":["A. Bra-xin và Ác-hen-ti-na.","B. Chi-lê và Pê-ru.","C. Cô-lôm-bi-a và Ê-cu-a-đo.","D. U-ru-goay và Pa-ra-goay."],"answer":"A","explain":"Bra-xin và Ác-hen-ti-na có đồng cỏ rộng (Pam-pa) nên chăn nuôi bò phát triển mạnh.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ nào thích hợp nhất để thể hiện tỉ lệ dân đô thị của các nước Mỹ La tinh năm 2020?","options":["A. Biểu đồ đường.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Biểu đồ tròn."],"answer":"B","explain":"Biểu đồ cột thích hợp để so sánh giá trị của nhiều đối tượng tại một thời điểm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao rừng A-ma-dôn đang bị thu hẹp?","options":["A. Do khai thác gỗ, đốt rừng làm nương rẫy và chăn thả gia súc.","B. Do rừng tự chết.","C. Do không có mưa.","D. Do người dân trồng thêm rừng."],"answer":"A","explain":"Khai thác gỗ, đốt rừng làm nương rẫy, chăn thả và trồng đậu tương làm rừng A-ma-dôn thu hẹp nhanh.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: sản lượng cà phê (nghìn tấn) năm 2020: Bra-xin 3 000, Việt Nam 1 700, Cô-lôm-bi-a 800. Nhận xét nào sau đây đúng?","options":["A. Bra-xin sản xuất cà phê lớn nhất bảng, gấp khoảng 1,8 lần Việt Nam.","B. Việt Nam sản xuất nhiều hơn Bra-xin.","C. Cô-lôm-bi-a sản xuất nhiều nhất.","D. Ba nước sản xuất bằng nhau."],"answer":"A","explain":"3 000 chia 1 700 khoảng 1,8 lần — Bra-xin lớn nhất bảng.","points":0.25},{"type":"mcq","level":"VD","q":"Mê-hi-cô phát triển công nghiệp chế tạo gắn chặt với Hoa Kỳ chủ yếu nhờ","options":["A. Vị trí địa lí giáp Hoa Kỳ và tham gia khu vực mậu dịch tự do Bắc Mỹ.","B. Có nhiều dầu mỏ.","C. Dân số đông.","D. Khí hậu thuận lợi."],"answer":"A","explain":"Mê-hi-cô giáp Hoa Kỳ và là thành viên USMCA nên thu hút nhiều nhà máy của các công ty Hoa Kỳ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Người lai chiếm đa số dân cư Mỹ La tinh.","b) Chăn nuôi bò phát triển mạnh ở Bra-xin và Ác-hen-ti-na.","c) Biểu đồ cột thích hợp để so sánh tỉ lệ dân đô thị các nước.","d) Rừng A-ma-dôn đang được mở rộng nhanh chóng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: rừng A-ma-dôn đang bị thu hẹp do khai thác và đốt rừng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu sản lượng cà phê ở trên. Xét tính đúng, sai:","statements":["a) Bra-xin có sản lượng cà phê lớn nhất bảng.","b) Sản lượng của Bra-xin gấp khoảng 1,8 lần Việt Nam.","c) Cô-lôm-bi-a có sản lượng thấp nhất bảng.","d) Việt Nam có sản lượng cao hơn Bra-xin."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 3 000 chia 1 700 khoảng 1,8. d) Sai.","points":1},{"type":"short","level":"TH","q":"Đồng cỏ rộng lớn ở Ác-hen-ti-na, thuận lợi cho chăn nuôi bò, có tên là gì?","answer":"Pam-pa","explain":"Đồng cỏ Pam-pa ở Ác-hen-ti-na rất thuận lợi cho chăn nuôi bò.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, sản lượng cà phê của Bra-xin (3 000 nghìn tấn) gấp khoảng bao nhiêu lần Việt Nam (1 700 nghìn tấn)? (làm tròn đến 1 chữ số thập phân)","answer":"1,8","explain":"3 000 chia 1 700 bằng khoảng 1,76, làm tròn là 1,8 lần.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"TH","q":"Các nước Mỹ La tinh đang đẩy mạnh quá trình nào sau đây?","options":["A. Công nghiệp hóa.","B. Quay lại kinh tế tự cấp.","C. Đóng cửa biên giới.","D. Từ bỏ thương mại."],"answer":"A","explain":"Các nước Mỹ La tinh là nước đang phát triển, đang đẩy mạnh công nghiệp hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Khoáng sản nào là thế mạnh của Chi-lê?","options":["A. Đồng.","B. Than đá.","C. Vàng đen.","D. Kim cương."],"answer":"A","explain":"Chi-lê giàu quặng đồng và là nước xuất khẩu đồng hàng đầu thế giới.","points":0.25},{"type":"mcq","level":"TH","q":"Khoáng sản nào là thế mạnh của Bra-xin?","options":["A. Quặng sắt.","B. Than đá.","C. Dầu mỏ.","D. Khí đốt."],"answer":"A","explain":"Bra-xin giàu quặng sắt với trữ lượng lớn, là nước xuất khẩu quặng sắt hàng đầu.","points":0.25},{"type":"mcq","level":"TH","q":"Ngành dịch vụ của Mỹ La tinh hiện nay","options":["A. Chiếm tỉ trọng ngày càng cao, du lịch phát triển.","B. Không phát triển.","C. Chỉ có ở Bra-xin.","D. Bị cấm phát triển."],"answer":"A","explain":"Dịch vụ chiếm tỉ trọng ngày càng cao trong GDP; du lịch phát triển nhờ cảnh quan và văn hóa đặc sắc.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: GDP (tỉ USD) năm 2020: Bra-xin 1 445, Mê-hi-cô 1 074, Ác-hen-ti-na 385. Nhận xét nào sau đây đúng?","options":["A. Bra-xin có GDP lớn nhất bảng.","B. Ác-hen-ti-na có GDP lớn nhất.","C. Mê-hi-cô có GDP thấp nhất.","D. Ba nước có GDP bằng nhau."],"answer":"A","explain":"Bra-xin 1 445 tỉ USD — lớn nhất bảng, gần gấp 4 lần Ác-hen-ti-na.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao kinh tế Mỹ La tinh tăng trưởng không ổn định?","options":["A. Vì phụ thuộc vào xuất khẩu nguyên liệu thô và nông sản, dễ bị tổn thương trước biến động giá thế giới.","B. Vì không có tài nguyên.","C. Vì dân số quá ít.","D. Vì không tham gia thương mại."],"answer":"A","explain":"Cơ cấu kinh tế phụ thuộc vào xuất khẩu nguyên liệu thô, nông sản nên khi giá thế giới biến động, kinh tế bị ảnh hưởng mạnh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Các nước Mỹ La tinh đang đẩy mạnh công nghiệp hóa.","b) Chi-lê là nước xuất khẩu đồng hàng đầu thế giới.","c) Bra-xin giàu quặng sắt.","d) Ngành dịch vụ của Mỹ La tinh không phát triển."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: dịch vụ chiếm tỉ trọng ngày càng cao.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu GDP ở trên. Xét tính đúng, sai:","statements":["a) Bra-xin có GDP lớn nhất bảng.","b) Mê-hi-cô có GDP lớn hơn Ác-hen-ti-na.","c) GDP của Bra-xin gấp gần 4 lần Ác-hen-ti-na.","d) Ác-hen-ti-na có GDP lớn nhất bảng."],"answer":["T","T","T","F"],"explain":"a), b) Đúng. c) Đúng: 1 445 chia 385 khoảng 3,8 lần. d) Sai.","points":1},{"type":"short","level":"TH","q":"Nước nào ở Nam Mỹ nổi tiếng với quặng đồng?","answer":"Chi-lê","explain":"Chi-lê giàu quặng đồng, là nước xuất khẩu đồng hàng đầu thế giới.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, GDP của Bra-xin (1 445 tỉ USD) gấp khoảng bao nhiêu lần Ác-hen-ti-na (385 tỉ USD)? (làm tròn đến hàng đơn vị)","answer":"4","explain":"1 445 chia 385 bằng khoảng 3,75, làm tròn là 4 lần.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Dân cư Mỹ La tinh phân bố","options":["A. Rất đều khắp lãnh thổ.","B. Không đều, tập trung ở ven biển, cao nguyên và các đô thị lớn.","C. Chỉ sống trên núi.","D. Chỉ sống trong rừng."],"answer":"B","explain":"Dân cư phân bố không đều, tập trung ở ven biển, các cao nguyên ôn hòa và đô thị lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Vấn đề xã hội nổi cộm của Mỹ La tinh là","options":["A. Chênh lệch giàu nghèo sâu sắc.","B. Thiếu trường học ở mọi nơi.","C. Không có đô thị.","D. Dân số quá ít."],"answer":"A","explain":"Chênh lệch giàu nghèo sâu sắc là vấn đề xã hội nổi cộm, đi cùng đô thị hóa tự phát.","points":0.25},{"type":"mcq","level":"TH","q":"Cây trồng nào sau đây là thế mạnh của Mỹ La tinh?","options":["A. Đậu tương.","B. Lúa mì.","C. Khoai tây.","D. Yến mạch."],"answer":"A","explain":"Đậu tương (Bra-xin, Ác-hen-ti-na) cùng cà phê, mía đường là cây trồng thế mạnh của khu vực.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ thích hợp nhất để thể hiện cơ cấu GDP theo khu vực kinh tế của Bra-xin năm 2020 là","options":["A. Biểu đồ tròn.","B. Biểu đồ đường.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"A","explain":"Biểu đồ tròn thể hiện cơ cấu (tỉ trọng các thành phần trong tổng thể) tại một thời điểm.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: tỉ lệ hộ nghèo (%): Bra-xin 25, Mê-hi-cô 42, Ác-hen-ti-na 40 (năm 2020). Nhận xét nào sau đây đúng?","options":["A. Mê-hi-cô có tỉ lệ hộ nghèo cao nhất bảng.","B. Bra-xin có tỉ lệ hộ nghèo cao nhất.","C. Ba nước không có hộ nghèo.","D. Ác-hen-ti-na thấp nhất."],"answer":"A","explain":"Mê-hi-cô 42% là cao nhất bảng — phản ánh chênh lệch giàu nghèo sâu sắc.","points":0.25},{"type":"mcq","level":"VD","q":"Để phát triển bền vững, các nước Mỹ La tinh cần","options":["A. Chỉ khai thác tài nguyên đến cạn kiệt.","B. Đa dạng hóa kinh tế, bảo vệ rừng A-ma-dôn và giảm chênh lệch giàu nghèo.","C. Đóng cửa với thế giới.","D. Chỉ phát triển một ngành duy nhất."],"answer":"B","explain":"Đa dạng hóa kinh tế giảm phụ thuộc nguyên liệu thô; bảo vệ rừng A-ma-dôn và giảm nghèo là yêu cầu bền vững.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dân cư Mỹ La tinh phân bố không đều.","b) Chênh lệch giàu nghèo là vấn đề xã hội nổi cộm.","c) Đậu tương là cây trồng thế mạnh của khu vực.","d) Biểu đồ tròn thích hợp để thể hiện cơ cấu GDP."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu tỉ lệ hộ nghèo ở trên. Xét tính đúng, sai:","statements":["a) Mê-hi-cô có tỉ lệ hộ nghèo cao nhất bảng.","b) Bra-xin có tỉ lệ hộ nghèo thấp nhất bảng.","c) Số liệu phản ánh chênh lệch giàu nghèo sâu sắc.","d) Chênh lệch giữa Mê-hi-cô và Bra-xin là 17 điểm phần trăm."],"answer":["T","T","T","T"],"explain":"a), b) Đúng. c) Đúng. d) Đúng: 42 trừ 25 bằng 17.","points":1},{"type":"short","level":"TH","q":"Cây công nghiệp nào là thế mạnh xuất khẩu của Bra-xin và Cô-lôm-bi-a?","answer":"Cà phê","explain":"Cà phê là cây công nghiệp thế mạnh của Bra-xin (lớn nhất thế giới) và Cô-lôm-bi-a.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, chênh lệch tỉ lệ hộ nghèo giữa Mê-hi-cô (42%) và Bra-xin (25%) là bao nhiêu điểm phần trăm?","answer":"17","explain":"42 trừ 25 bằng 17 điểm phần trăm.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: diện tích rừng A-ma-dôn bị mất (nghìn km2): 2004: 27, 2012: 4,5; 2020: 11. Nhận xét nào sau đây đúng?","options":["A. Diện tích rừng mất giảm liên tục từ 2004 đến 2020.","B. Diện tích rừng mất giảm mạnh giai đoạn 2004 – 2012 rồi tăng trở lại đến 2020.","C. Năm 2020 không mất rừng.","D. Năm 2004 mất rừng ít nhất."],"answer":"B","explain":"Từ 27 xuống 4,5 (giảm mạnh) rồi tăng lên 11 — cho thấy nỗ lực bảo vệ rừng chưa bền vững.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao việc bảo vệ rừng A-ma-dôn là vấn đề toàn cầu, không chỉ của Bra-xin?","options":["A. Vì rừng chỉ có ở Bra-xin.","B. Vì rừng A-ma-dôn điều hòa khí hậu toàn cầu, là “lá phổi xanh” và kho đa dạng sinh học của nhân loại.","C. Vì Bra-xin không đủ sức bảo vệ.","D. Vì rừng không có giá trị."],"answer":"B","explain":"Rừng A-ma-dôn ảnh hưởng đến khí hậu toàn cầu và đa dạng sinh học — là tài sản chung của nhân loại.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhà đầu tư muốn xây dựng nhà máy chế biến cà phê ở Mỹ La tinh. Quốc gia thuận lợi nhất về nguồn nguyên liệu là","options":["A. Bra-xin.","B. Chi-lê.","C. Pê-ru.","D. Ê-cu-a-đo."],"answer":"A","explain":"Bra-xin là nước sản xuất cà phê lớn nhất thế giới — nguồn nguyên liệu dồi dào nhất.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: GDP/người (USD) năm 2020: Chi-lê 13 000, Bra-xin 6 800, Bô-li-vi-a 3 100. Nhận xét nào sau đây đúng?","options":["A. Trong nội bộ Mỹ La tinh vẫn có sự chênh lệch đáng kể về trình độ phát triển.","B. Ba nước có trình độ như nhau.","C. Bô-li-vi-a phát triển nhất.","D. Chi-lê kém phát triển nhất."],"answer":"A","explain":"Chi-lê 13 000 gấp hơn 4 lần Bô-li-vi-a 3 100 — chênh lệch đáng kể trong nội bộ khu vực.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện diện tích rừng A-ma-dôn bị mất qua các năm trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ tròn.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị tuyệt đối qua các năm rời rạc.","points":0.25},{"type":"mcq","level":"VDC","q":"Giải pháp căn cơ để các nước Mỹ La tinh giảm phụ thuộc vào xuất khẩu nguyên liệu thô là","options":["A. Tăng cường chế biến sâu, phát triển công nghiệp và dịch vụ có giá trị gia tăng cao.","B. Ngừng xuất khẩu hoàn toàn.","C. Chỉ bán nguyên liệu thô.","D. Đóng cửa nền kinh tế."],"answer":"A","explain":"Chế biến sâu và phát triển các ngành giá trị gia tăng cao giúp giảm phụ thuộc vào biến động giá nguyên liệu thô.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu diện tích rừng A-ma-dôn bị mất ở trên. Xét tính đúng, sai:","statements":["a) Giai đoạn 2004 – 2012 diện tích rừng bị mất giảm mạnh.","b) Giai đoạn 2012 – 2020 diện tích rừng bị mất tăng trở lại.","c) Năm 2004 là năm mất rừng nhiều nhất trong bảng.","d) Nỗ lực bảo vệ rừng A-ma-dôn đã hoàn toàn thành công."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: diện tích mất tăng trở lại cho thấy chưa bền vững.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu GDP/người ở trên. Xét tính đúng, sai:","statements":["a) Chi-lê có GDP/người cao nhất bảng.","b) GDP/người của Chi-lê gấp hơn 4 lần Bô-li-vi-a.","c) Trong nội bộ Mỹ La tinh có sự chênh lệch phát triển đáng kể.","d) Bô-li-vi-a có GDP/người cao nhất bảng."],"answer":["T","T","T","F"],"explain":"a) Đúng: 13 000 cao nhất. b) Đúng: 13 000 chia 3 100 khoảng 4,2 lần. c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, diện tích rừng A-ma-dôn bị mất năm 2020 (11 nghìn km2) gấp khoảng bao nhiêu lần năm 2012 (4,5 nghìn km2)? (làm tròn đến 1 chữ số thập phân)","answer":"2,4","explain":"11 chia 4,5 bằng khoảng 2,44, làm tròn là 2,4 lần.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, GDP/người của Chi-lê (13 000 USD) gấp khoảng bao nhiêu lần Bô-li-vi-a (3 100 USD)? (làm tròn đến 1 chữ số thập phân)","answer":"4,2","explain":"13 000 chia 3 100 bằng khoảng 4,19, làm tròn là 4,2 lần.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: xuất khẩu dầu mỏ của Vê-nê-xu-ê-la (tỉ USD): 2012: 95; 2016: 25; 2020: 8. Nhận xét nào sau đây đúng?","options":["A. Xuất khẩu dầu mỏ tăng liên tục.","B. Xuất khẩu dầu mỏ giảm mạnh, cho thấy sự phụ thuộc vào một mặt hàng khiến kinh tế dễ tổn thương.","C. Năm 2020 xuất khẩu cao nhất.","D. Dầu mỏ không quan trọng với Vê-nê-xu-ê-la."],"answer":"B","explain":"Từ 95 xuống 8 tỉ USD — sự sụp đổ cho thấy rủi ro của nền kinh tế đơn điệu phụ thuộc dầu mỏ.","points":0.25},{"type":"mcq","level":"VD","q":"Đồng bằng Pam-pa ở Ác-hen-ti-na thuận lợi cho","options":["A. Chăn nuôi bò và trồng lúa mì.","B. Trồng lúa nước.","C. Khai thác dầu mỏ.","D. Trồng cao su."],"answer":"A","explain":"Đồng bằng Pam-pa màu mỡ, khí hậu ôn hòa — thuận lợi cho chăn nuôi bò và trồng lúa mì.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh nhận xét: “Mỹ La tinh giàu tài nguyên nên chắc chắn sẽ phát triển nhanh”. Nhận xét này","options":["A. Đúng hoàn toàn.","B. Chưa đúng vì tài nguyên chỉ là điều kiện cần; cần thêm vốn, công nghệ, nguồn nhân lực và thể chế tốt — nhiều nước giàu tài nguyên vẫn chậm phát triển.","C. Sai hoàn toàn vì tài nguyên không có giá trị.","D. Đúng vì tài nguyên là tất cả."],"answer":"B","explain":"Tài nguyên là lợi thế nhưng chưa đủ; nhiều nước Mỹ La tinh giàu tài nguyên nhưng vẫn gặp khó khăn do phụ thuộc, nợ nần.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ trọng nông nghiệp trong GDP (%): Bra-xin 6, Ác-hen-ti-na 8, Bô-li-vi-a 14 (năm 2020). Nước nào còn phụ thuộc nhiều nhất vào nông nghiệp?","options":["A. Bô-li-vi-a.","B. Bra-xin.","C. Ác-hen-ti-na.","D. Cả ba như nhau."],"answer":"A","explain":"Bô-li-vi-a có tỉ trọng nông nghiệp cao nhất (14%) — còn phụ thuộc nhiều nhất vào nông nghiệp.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện tỉ trọng nông nghiệp trong GDP của ba nước trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Biểu đồ kết hợp."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị của các đối tượng tại một thời điểm.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao Bra-xin được coi là “người khổng lồ” của Mỹ La tinh?","options":["A. Vì diện tích và dân số lớn nhất khu vực, kinh tế đa dạng và lớn nhất Mỹ La tinh.","B. Vì có nhiều núi cao.","C. Vì nói tiếng Tây Ban Nha.","D. Vì nằm ở Bắc Mỹ."],"answer":"A","explain":"Bra-xin có diện tích, dân số lớn nhất khu vực và nền kinh tế lớn, đa dạng nhất Mỹ La tinh.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu xuất khẩu dầu mỏ của Vê-nê-xu-ê-la ở trên. Xét tính đúng, sai:","statements":["a) Xuất khẩu dầu mỏ giảm mạnh giai đoạn 2012 – 2020.","b) Năm 2012 xuất khẩu đạt 95 tỉ USD.","c) Số liệu cho thấy rủi ro của nền kinh tế phụ thuộc vào một mặt hàng.","d) Năm 2020 xuất khẩu cao hơn năm 2012."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: 8 thấp hơn nhiều so với 95.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ trọng nông nghiệp trong GDP ở trên. Xét tính đúng, sai:","statements":["a) Bô-li-vi-a có tỉ trọng nông nghiệp cao nhất bảng.","b) Bra-xin có tỉ trọng nông nghiệp thấp nhất bảng.","c) Tỉ trọng nông nghiệp của Bô-li-vi-a gấp hơn 2 lần Bra-xin.","d) Cả ba nước đều không còn nông nghiệp."],"answer":["T","T","T","F"],"explain":"a), b) Đúng. c) Đúng: 14 chia 6 khoảng 2,3 lần. d) Sai.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, xuất khẩu dầu mỏ của Vê-nê-xu-ê-la năm 2020 chỉ bằng khoảng bao nhiêu phần trăm năm 2012? (làm tròn đến hàng đơn vị)","answer":"8","explain":"8 chia 95 bằng khoảng 0,084, tức khoảng 8%.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, tỉ trọng nông nghiệp trong GDP của Bô-li-vi-a (14%) gấp khoảng bao nhiêu lần Bra-xin (6%)? (làm tròn đến 1 chữ số thập phân)","answer":"2,3","explain":"14 chia 6 bằng khoảng 2,33, làm tròn là 2,3 lần.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Lãnh thổ Mỹ La tinh trải dài từ khoảng","options":["A. 32°B đến 56°N.","B. 60°B đến 70°B.","C. Xích đạo đến 20°B.","D. 30°N đến 60°N."],"answer":"A","explain":"Mỹ La tinh trải dài từ khoảng 32°B (Mê-hi-cô) đến 56°N (đất lửa phía nam).","points":0.25},{"type":"mcq","level":"NB","q":"Mỹ La tinh nằm giữa hai đại dương nào?","options":["A. Thái Bình Dương và Đại Tây Dương.","B. Ấn Độ Dương và Bắc Băng Dương.","C. Thái Bình Dương và Ấn Độ Dương.","D. Đại Tây Dương và Bắc Băng Dương."],"answer":"A","explain":"Mỹ La tinh nằm giữa Thái Bình Dương (phía tây) và Đại Tây Dương (phía đông).","points":0.25},{"type":"mcq","level":"NB","q":"Nước nào sau đây thuộc khu vực Mỹ La tinh?","options":["A. Ác-hen-ti-na.","B. Hoa Kỳ.","C. Ca-na-đa.","D. Nhật Bản."],"answer":"A","explain":"Ác-hen-ti-na thuộc Nam Mỹ, là nước Mỹ La tinh; Hoa Kỳ, Ca-na-đa thuộc Bắc Mỹ (văn hóa Ăng-glô).","points":0.25},{"type":"mcq","level":"NB","q":"Sơn nguyên lớn ở phía đông Nam Mỹ là","options":["A. Sơn nguyên Bra-xin.","B. Sơn nguyên Trung Xi-bia.","C. Sơn nguyên Tây Tạng.","D. Sơn nguyên Đê-can."],"answer":"A","explain":"Sơn nguyên Bra-xin là sơn nguyên lớn ở phía đông Nam Mỹ.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: lượng mưa trung bình năm (mm): Ma-na-út (lưu vực A-ma-dôn) 2 300, Xan-ti-a-gô (Chi-lê) 360, Mên-đô-xa (Ác-hen-ti-na) 200. Nhận xét nào sau đây đúng?","options":["A. Lượng mưa phân hóa rất mạnh theo khu vực, thể hiện sự đa dạng khí hậu của Mỹ La tinh.","B. Mọi nơi đều mưa nhiều như nhau.","C. Xan-ti-a-gô mưa nhiều nhất.","D. Khí hậu khu vực đồng nhất."],"answer":"A","explain":"Từ 2 300 mm xuống 200 mm — phân hóa mạnh, thể hiện khí hậu đa dạng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty muốn đầu tư vào khai thác đồng ở Nam Mỹ. Quốc gia nên ưu tiên khảo sát đầu tiên là","options":["A. Chi-lê.","B. U-ru-goay.","C. Pa-ra-goay.","D. Ê-cu-a-đo."],"answer":"A","explain":"Chi-lê giàu quặng đồng nhất khu vực, là nước xuất khẩu đồng hàng đầu thế giới.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mỹ La tinh trải dài từ khoảng 32°B đến 56°N.","b) Mỹ La tinh nằm giữa Thái Bình Dương và Đại Tây Dương.","c) Ác-hen-ti-na thuộc khu vực Mỹ La tinh.","d) Sơn nguyên Bra-xin nằm ở phía đông Nam Mỹ."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu lượng mưa ở trên. Xét tính đúng, sai:","statements":["a) Ma-na-út có lượng mưa cao nhất bảng.","b) Lượng mưa ở Ma-na-út gấp hơn 10 lần Mên-đô-xa.","c) Số liệu thể hiện sự phân hóa khí hậu mạnh của khu vực.","d) Xan-ti-a-gô có lượng mưa cao hơn Ma-na-út."],"answer":["T","T","T","F"],"explain":"a) Đúng: 2 300 mm cao nhất. b) Đúng: 2 300 chia 200 bằng 11,5 lần. c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Sông nào có lưu vực rộng lớn nhất thế giới, chảy qua Nam Mỹ?","answer":"A-ma-dôn","explain":"Sông A-ma-dôn có lưu vực rộng lớn nhất thế giới.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, lượng mưa ở Ma-na-út (2 300 mm) gấp khoảng bao nhiêu lần Mên-đô-xa (200 mm)? (làm tròn đến 1 chữ số thập phân)","answer":"11,5","explain":"2 300 chia 200 bằng 11,5 lần.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Nước nào có nền kinh tế lớn nhất Mỹ La tinh?","options":["A. Bra-xin.","B. Pê-ru.","C. Bô-li-vi-a.","D. Ê-cu-a-đo."],"answer":"A","explain":"Bra-xin là nền kinh tế lớn nhất Mỹ La tinh.","points":0.25},{"type":"mcq","level":"NB","q":"Các nước Mỹ La tinh đều thuộc nhóm nước","options":["A. Đang phát triển.","B. Phát triển.","C. Kém phát triển nhất.","D. Không xác định."],"answer":"A","explain":"Các nước Mỹ La tinh đều là nước đang phát triển.","points":0.25},{"type":"mcq","level":"NB","q":"Kim loại nào là thế mạnh xuất khẩu của Chi-lê?","options":["A. Đồng.","B. Sắt.","C. Nhôm.","D. Kẽm."],"answer":"A","explain":"Chi-lê là nước xuất khẩu đồng hàng đầu thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Ngôn ngữ được sử dụng rộng rãi nhất ở Mỹ La tinh là","options":["A. Tiếng Tây Ban Nha.","B. Tiếng Anh.","C. Tiếng Pháp.","D. Tiếng Đức."],"answer":"A","explain":"Tiếng Tây Ban Nha được sử dụng ở hầu hết các nước Mỹ La tinh (trừ Bra-xin nói tiếng Bồ Đào Nha).","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: kim ngạch xuất khẩu (tỉ USD) năm 2020: Bra-xin 210, Mê-hi-cô 418, Chi-lê 74. Nước nào xuất khẩu lớn nhất?","options":["A. Mê-hi-cô.","B. Bra-xin.","C. Chi-lê.","D. Cả ba bằng nhau."],"answer":"A","explain":"Mê-hi-cô 418 tỉ USD — lớn nhất bảng nhờ công nghiệp chế tạo gắn với Hoa Kỳ.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao Mê-hi-cô có kim ngạch xuất khẩu lớn hơn Bra-xin dù GDP nhỏ hơn?","options":["A. Vì Mê-hi-cô giáp Hoa Kỳ, tham gia USMCA, là nơi đặt nhiều nhà máy xuất khẩu của các công ty Hoa Kỳ.","B. Vì Mê-hi-cô có nhiều dầu hơn.","C. Vì Bra-xin không xuất khẩu.","D. Vì Mê-hi-cô đông dân hơn."],"answer":"A","explain":"Vị trí giáp Hoa Kỳ và USMCA giúp Mê-hi-cô trở thành trung tâm sản xuất xuất khẩu sang Hoa Kỳ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bra-xin là nền kinh tế lớn nhất Mỹ La tinh.","b) Các nước Mỹ La tinh đều là nước đang phát triển.","c) Chi-lê xuất khẩu đồng hàng đầu thế giới.","d) Tiếng Tây Ban Nha được dùng rộng rãi nhất ở Mỹ La tinh."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu kim ngạch xuất khẩu ở trên. Xét tính đúng, sai:","statements":["a) Mê-hi-cô có kim ngạch xuất khẩu lớn nhất bảng.","b) Kim ngạch của Mê-hi-cô gấp khoảng 2 lần Bra-xin.","c) Chi-lê có kim ngạch thấp nhất bảng.","d) Bra-xin có kim ngạch lớn hơn Mê-hi-cô."],"answer":["T","T","T","F"],"explain":"a) Đúng: 418 lớn nhất. b) Đúng: 418 chia 210 khoảng 2 lần. c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Nước nào ở Nam Mỹ có trữ lượng dầu mỏ lớn nhất thế giới?","answer":"Vê-nê-xu-ê-la","explain":"Vê-nê-xu-ê-la có trữ lượng dầu mỏ đã chứng minh lớn nhất thế giới.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, kim ngạch xuất khẩu của Mê-hi-cô (418 tỉ USD) gấp khoảng bao nhiêu lần Chi-lê (74 tỉ USD)? (làm tròn đến 1 chữ số thập phân)","answer":"5,6","explain":"418 chia 74 bằng khoảng 5,65, làm tròn là 5,6 lần.","points":0.5}]}]}</script>
