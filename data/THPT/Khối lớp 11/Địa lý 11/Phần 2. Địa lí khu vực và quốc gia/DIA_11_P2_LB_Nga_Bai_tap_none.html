ên bang Nga khoảng","options":["A. 75%.","B. 30%.","C. 95%.","D. 50%."],"answer":"A","explain":"Tỉ lệ đô thị hóa của Nga khoảng 75%.","points":0.25},{"type":"mcq","level":"TH","q":"Để khắc phục tình trạng tăng dân số âm, Nga cần","options":["A. Có chính sách khuyến khích sinh và hỗ trợ gia đình.","B. Cấm kết hôn.","C. Hạn chế sinh.","D. Không cần chính sách gì."],"answer":"A","explain":"Nga đã thực hiện các chính sách khuyến khích sinh, hỗ trợ gia đình nhiều con.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ đường thích hợp nhất để thể hiện","options":["A. Tốc độ tăng trưởng GDP của Nga giai đoạn 2000 – 2020.","B. Cơ cấu GDP năm 2020.","C. Dân số năm 2020.","D. Diện tích lãnh thổ."],"answer":"A","explain":"Biểu đồ đường thể hiện tốc độ tăng trưởng theo thời gian.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: GDP (nghìn tỉ USD) năm 2020: Nga 1,5; Đức 3,8; Nhật Bản 5,0. Nhận xét nào sau đây đúng?","options":["A. GDP của Nga thấp hơn Đức và Nhật Bản.","B. Nga có GDP cao nhất bảng.","C. Đức thấp hơn Nga.","D. Ba nước bằng nhau."],"answer":"A","explain":"Nga 1,5 thấp hơn Đức 3,8 và Nhật Bản 5,0.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao khí hậu khắc nghiệt gây khó khăn cho phát triển kinh tế Xi-bia?","options":["A. Vì mùa đông rất lạnh, đất đóng băng, giao thông khó khăn và chi phí sản xuất cao.","B. Vì quá nóng.","C. Vì mưa nhiều.","D. Vì không có tài nguyên."],"answer":"A","explain":"Băng giá vĩnh cửu, lạnh khắc nghiệt làm tăng chi phí xây dựng, khai thác và đời sống.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công nghiệp quốc phòng, vũ trụ của Nga ở trình độ hàng đầu.","b) Tỉ lệ đô thị hóa của Nga khoảng 75%.","c) Nga cần chính sách khuyến khích sinh.","d) Biểu đồ đường thích hợp để thể hiện tốc độ tăng trưởng theo thời gian."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu GDP ở trên. Xét tính đúng, sai:","statements":["a) Nga có GDP thấp nhất bảng.","b) GDP của Đức gấp hơn 2 lần Nga.","c) Nhật Bản có GDP cao nhất bảng.","d) Nga có GDP cao hơn Đức."],"answer":["T","T","T","F"],"explain":"a), c) Đúng. b) Đúng: 3,8 chia 1,5 khoảng 2,5 lần. d) Sai.","points":1},{"type":"short","level":"TH","q":"Để khắc phục tăng dân số âm, Nga cần thực hiện chính sách gì?","answer":"khuyến khích sinh","explain":"Nga thực hiện chính sách khuyến khích sinh, hỗ trợ gia đình.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, GDP của Đức (3,8 nghìn tỉ USD) gấp khoảng bao nhiêu lần Nga (1,5 nghìn tỉ USD)? (làm tròn đến 1 chữ số thập phân)","answer":"2,5","explain":"3,8 chia 1,5 bằng khoảng 2,53, làm tròn là 2,5 lần.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Khoáng sản nào sau đây là thế mạnh của Nga?","options":["A. Dầu mỏ, khí tự nhiên, than đá, kim cương.","B. Cao su, cà phê.","C. Bông, đay.","D. Thiếc, bô-xít."],"answer":"A","explain":"Nga giàu dầu khí, than, kim cương, vàng... với trữ lượng hàng đầu thế giới.","points":0.25},{"type":"mcq","level":"TH","q":"Vùng nào của Nga tập trung đông dân cư nhất?","options":["A. Đồng bằng Đông Âu (phía tây).","B. Xi-bia.","C. Viễn Đông.","D. Bắc Cực."],"answer":"A","explain":"Phía tây (đồng bằng Đông Âu) khí hậu ôn hòa hơn nên tập trung đông dân.","points":0.25},{"type":"mcq","level":"TH","q":"Cấm vận kinh tế của phương Tây ảnh hưởng đến Nga như thế nào?","options":["A. Gây khó khăn cho tăng trưởng, buộc Nga phải tự cường và hướng sang châu Á.","B. Không ảnh hưởng gì.","C. Giúp kinh tế tăng nhanh.","D. Làm Nga giàu hơn."],"answer":"A","explain":"Cấm vận gây khó khăn nhưng cũng thúc đẩy Nga tự chủ và tăng cường hợp tác với châu Á.","points":0.25},{"type":"mcq","level":"TH","q":"Nga xuất khẩu khí tự nhiên chủ yếu sang","options":["A. Châu Âu và châu Á.","B. Châu Phi.","C. Nam Mỹ.","D. Châu Đại Dương."],"answer":"A","explain":"Nga xuất khẩu khí đốt lớn sang  1 (°C): Mát-xcơ-va -7, Nô-ri-xcơ -30, Xô-chi 6. Nhận xét nào sau đây đúng?","options":["A. Nhiệt độ mùa đông phân hóa mạnh theo vĩ độ ở Nga.","B. Mọi nơi ở Nga đều ấm.","C. Nô-ri-xcơ ấm nhất.","D. Xô-chi lạnh nhất."],"answer":"A","explain":"Từ -30°C đến 6°C — phân hóa mạnh theo vĩ độ và vị trí.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao Nga có tiềm năng lớn về năng lượng tái tạo (điện gió, thủy điện)?","options":["A. Vì lãnh thổ rộng lớn, nhiều sông và ven biển gió mạnh.","B. Vì nắng nóng quanh năm.","C. Vì không có nhiên liệu hóa thạch.","D. Vì dân số đông."],"answer":"A","explain":"Lãnh thổ rộng, sông lớn nhiều và bờ biển dài tạo tiềm năng thủy điện, điện gió lớn.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty muốn đầu tư khai thác kim cương ở Nga. Vùng nào sau đây có tiềm năng nhất?","options":["A. Cộng hòa Xa-kha (Y-a-ku-ti-a) ở Xi-bia.","B. Đồng bằng Đông Âu.","C. Bán đảo Crưm.","D. Vùng Viễn Đông ven biển."],"answer":"A","explain":"Xa-kha (Y-a-ku-ti-a) là vùng khai thác kim cương nổi tiếng của Nga.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ lệ tăng dân số tự nhiên (phần nghìn): Nga -5, Nhật Bản -4, Đức -2, Hoa Kỳ 4 (năm 2020). Nhận xét nào sau đây đúng?","options":["A. Nga có tỉ lệ tăng dân số tự nhiên thấp nhất bảng.","B. Hoa Kỳ thấp nhất.","C. Nhật Bản cao nhất.","D. Đức cao nhất."],"answer":"A","explain":"Nga -5 phần nghìn — thấp nhất bảng, thể hiện khủng hoảng dân số.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện tỉ lệ tăng dân số tự nhiên của các nước trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Biểu đồ tròn."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị (kể cả giá trị âm) giữa các đối tượng.","points":0.25},{"type":"mcq","level":"VDC","q":"Giải pháp lâu dài để Nga giảm phụ thuộc vào xuất khẩu năng lượng là","options":["A. Đa dạng hóa kinh tế, phát triển công nghiệp chế biến và công nghệ cao.","B. Tăng khai thác dầu khí tối đa.","C. Ngừng xuất khẩu năng lượng.","D. Chỉ phát triển nông nghiệp."],"answer":"A","explain":"Đa dạng hóa, phát triển công nghiệp chế biến và công nghệ cao là hướng đi bền vững.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu nhiệt độ tháng 1 ở trên. Xét tính đúng, sai:","statements":["a) Nhiệt độ mùa đông phân hóa mạnh ở Nga.","b) Nô-ri-xcơ lạnh nhất bảng.","c) Xô-chi ấm nhất bảng.","d) Mọi nơi ở Nga đều có nhiệt độ như nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: -30, -7, 6. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ lệ tăng dân số tự nhiên ở trên. Xét tính đúng, sai:","statements":["a) Nga có tỉ lệ tăng dân số tự nhiên thấp nhất bảng.","b) Hoa Kỳ là nước duy nhất tăng dương trong bảng.","c) Nhật Bản và Đức đều tăng âm.","d) Đức có tỉ lệ cao nhất bảng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: -5, -4, -2, 4. d) Sai: Hoa Kỳ 4 cao nhất.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, nơi nào ở Nga có nhiệt độ trung bình tháng 1 thấp nhất?","answer":"Nô-ri-xcơ","explain":"Nô-ri-xcơ -30°C — lạnh nhất bảng.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, chênh lệch tỉ lệ tăng dân số tự nhiên giữa Hoa Kỳ (4 phần nghìn) và Nga (-5 phần nghìn) là bao nhiêu phần nghìn?","answer":"9","explain":"4 trừ (-5) bằng 9 phần nghìn.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: trữ lượng khí tự nhiên đã chứng minh (nghìn tỉ m3): Nga 38, I-ran 34, Ca-ta 24. Nước nào có trữ lượng lớn nhất?","options":["A. Nga.","B. I-ran.","C. Ca-ta.","D. Cả ba bằng nhau."],"answer":"A","explain":"Nga 38 nghìn tỉ m3 — trữ lượng khí tự nhiên lớn nhất thế giới.","points":0.25},{"type":"mcq","level":"VD","q":"Đường ống dẫn khí đốt của Nga sang châu Âu đi qua nhiều nước, điều này cho thấy","options":["A. Năng lượng gắn với địa chính trị, các nước trung chuyển có vai trò quan trọng.","B. Nga không cần xuất khẩu.","C. Châu Âu không cần khí đốt.","D. Đường ống không quan trọng."],"answer":"A","explain":"Năng lượng là vấn đề địa chính trị; nước trung chuyển có thể ảnh hưởng nguồn cung.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh nói: “Nga giàu tài nguyên nên người dân chắc chắn giàu có”. Ý kiến này","options":["A. Đúng hoàn toàn.","B. Chưa đúng vì tài nguyên cần được khai thác hiệu quả và phân phối hợp lí; nhiều nước giàu tài nguyên nhưng dân chưa giàu.","C. Sai hoàn toàn.","D. Đúng vì tài nguyên là tất cả."],"answer":"B","explain":"Tài nguyên là lợi thế nhưng cần công nghệ, quản lí và phân phối tốt mới thành giàu có.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ trọng năng lượng trong xuất khẩu của Nga (%): 2000: 55; 2010: 68; 2020: 60. Nhận xét nào sau đây đúng?","options":["A. Nga phụ thuộc lớn vào xuất khẩu năng lượng trong cả giai đoạn.","B. Nga không xuất khẩu năng lượng.","C. Tỉ trọng giảm liên tục.","D. Năm 2000 tỉ trọng cao nhất."],"answer":"A","explain":"Tỉ trọng luôn trên 55% — phụ thuộc lớn vào năng lượng.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện tỉ trọng năng lượng trong xuất khẩu của Nga qua các năm trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ tròn.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"A","explain":"Biểu đồ đường thể hiện sự biến động của một đối tượng theo thời gian.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao việc đa dạng hóa thị trường xuất khẩu năng lượng (sang châu Á) quan trọng với Nga?","options":["A. Vì giảm phụ thuộc vào một thị trường, tăng an toàn năng lượng và địa chính trị.","B. Vì châu Âu không mua nữa hoàn toàn.","C. Vì châu Á trả giá cao hơn luôn.","D. Không quan trọng."],"answer":"A","explain":"Đa dạng hóa thị trường giúp giảm rủi ro phụ thuộc và tăng vị thế đàm phán.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu trữ lượng khí tự nhiên ở trên. Xét tính đúng, sai:","statements":["a) Nga có trữ lượng khí tự nhiên lớn nhất bảng.","b) I-ran có trữ lượng lớn hơn Ca-ta.","c) Ca-ta có trữ lượng thấp nhất bảng.","d) Nga không có khí tự nhiên."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 38, 34, 24. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ trọng năng lượng trong xuất khẩu của Nga ở trên. Xét tính đúng, sai:","statements":["a) Tỉ trọng năng lượng luôn trên 55% giai đoạn 2000 – 2020.","b) Năm 2010 tỉ trọng cao nhất (68%).","c) Nga phụ thuộc lớn vào xuất khẩu năng lượng.","d) Năm 2020 tỉ trọng thấp hơn năm 2000."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: 60% cao hơn 55%.","points":1},{"type":"short","level":"VD","q":"Nước nào có trữ lượng khí tự nhiên đã chứng minh lớn nhất thế giới?","answer":"Nga","explain":"Nga có trữ lượng khí tự nhiên lớn nhất thế giới (khoảng 38 nghìn tỉ m3).","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, năm nào tỉ trọng năng lượng trong xuất khẩu của Nga cao nhất?","answer":"2010","explain":"Năm 2010 tỉ trọng đạt 68%, cao nhất bảng.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Liên bang Nga nằm ở hai châu lục nào?","options":["A. Châu Âu và châu Á.","B. Châu Âu và châu Phi.","C. Châu Á và châu Mỹ.","D. Châu Âu và châu Đại Dương."],"answer":"A","explain":"Nga trải dài từ Đông Âu đến Bắc Á.","points":0.25},{"type":"mcq","level":"NB","q":"Đại dương nào ở phía bắc Liên bang Nga?","options":["A. Bắc Băng Dương.","B. Thái Bình Dương.","C. Ấn Độ Dương.","D. Đại Tây Dương."],"answer":"A","explain":"Phía bắc Nga giáp Bắc Băng Dương.","points":0.25},{"type":"mcq","level":"NB","q":"GDP của Liên bang Nga khoảng","options":["A. 1,5 nghìn tỉ USD.","B. 15 nghìn tỉ USD.","C. 150 tỉ USD.","D. 1,5 tỉ USD."],"answer":"A","explain":"GDP của Nga khoảng 1,5 nghìn tỉ USD.","points":0.25},{"type":"mcq","level":"NB","q":"Thành phố lớn thứ hai của Nga, trung tâm văn hóa là","options":["A. Xanh Pê-téc-bua.","B. Ki-ép.","C. Min-xcơ.","D. Vla-đi-vô-xtốc."],"answer":"A","explain":"Xanh Pê-téc-bua là thành phố lớn thứ hai, trung tâm văn hóa của Nga.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: số múi giờ: Nga 11, Hoa Kỳ 6, Trung Quốc 1, Ca-na-đa 6. Nhận xét nào sau đây đúng?","options":["A. Nga có số múi giờ nhiều nhất bảng.","B. Trung Quốc nhiều nhất.","C. Hoa Kỳ nhiều nhất.","D. Cả bốn bằng nhau."],"answer":"A","explain":"Nga 11 múi giờ — nhiều nhất bảng; Trung Quốc chỉ dùng 1 múi giờ chính thức.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhà đầu tư muốn xây nhà máy chế biến gỗ ở Nga. Điều kiện thuận lợi nhất là","options":["A. Nguồn nguyên liệu gỗ dồi dào từ rừng tai-ga.","B. Khí hậu ấm áp.","C. Gần xích đạo.","D. Dân số đông."],"answer":"A","explain":"Rừng tai-ga rộng lớn nhất thế giới cung cấp nguyên liệu gỗ dồi dào.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nga nằm ở hai châu lục Âu và Á.","b) Phía bắc Nga giáp Bắc Băng Dương.","c) GDP của Nga khoảng 1,5 nghìn tỉ USD.","d) Xanh Pê-téc-bua là thành phố lớn thứ hai của Nga."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu số múi giờ ở trên. Xét tính đúng, sai:","statements":["a) Nga có số múi giờ nhiều nhất bảng.","b) Trung Quốc có ít múi giờ nhất bảng.","c) Hoa Kỳ và Ca-na-đa có số múi giờ bằng nhau.","d) Nga có ít múi giờ hơn Hoa Kỳ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 11, 1, 6 = 6. d) Sai.","points":1},{"type":"short","level":"NB","q":"Thành phố lớn thứ hai của Nga, được coi là trung tâm văn hóa là thành phố nào?","answer":"Xanh Pê-téc-bua","explain":"Xanh Pê-téc-bua là thành phố lớn thứ hai, trung tâm văn hóa của Nga.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, số múi giờ của Nga (11) gấp bao nhiêu lần Trung Quốc (1)?","answer":"11","explain":"11 chia 1 bằng 11 lần.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cây lương thực chính của Liên bang Nga là","options":["A. Lúa mì.","B. Lúa nước.","C. Ngô.","D. Sắn."],"answer":"A","explain":"Lúa mì là cây lương thực chính và mặt hàng xuất khẩu quan trọng của Nga.","points":0.25},{"type":"mcq","level":"NB","q":"Trình độ dân trí của Nga được đánh giá là","options":["A. Cao, đội ngũ trí thức đông đảo.","B. Rất thấp.","C. Không có trường đại học.","D. Thấp nhất châu Âu."],"answer":"A","explain":"Nga có truyền thống giáo dục, khoa học lâu đời, dân trí cao.","points":0.25},{"type":"mcq","level":"NB","q":"Biển nào ở phía tây bắc Liên bang Nga?","options":["A. Biển Ban-tích.","B. Biển Đỏ.","C. Biển Ả-rập.","D. Biển Đông."],"answer":"A","explain":"Nga giáp biển Ban-tích ở phía tây bắc và biển Đen ở phía tây nam.","points":0.25},{"type":"mcq","level":"NB","q":"Ngành nào của Nga có trình độ hàng đầu thế giới?","options":["A. Công nghiệp quốc phòng và vũ trụ.","B. Dệt may.","C. Sản xuất đồ chơi.","D. Chế biến thực phẩm."],"answer":"A","explain":"Công nghiệp quốc phòng, vũ trụ của Nga ở trình độ hàng đầu thế giới.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: sản lượng lúa mì (triệu tấn) năm 2020: Nga 85, Hoa Kỳ 50, Ca-na-đa 35. Nước nào sản xuất nhiều nhất?","options":["A. Nga.","B. Hoa Kỳ.","C. Ca-na-đa.","D. Cả ba bằng nhau."],"answer":"A","explain":"Nga 85 triệu tấn — sản xuất lúa mì nhiều nhất bảng.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao Nga được coi là cường quốc về tài nguyên nhưng kinh tế vẫn chưa tương xứng?","options":["A. Vì kinh tế phụ thuộc vào xuất khẩu nguyên liệu thô, công nghiệp chế biến và công nghệ cao chưa phát triển tương xứng.","B. Vì không có tài nguyên.","C. Vì dân số quá đông.","D. Vì không có thị trường."],"answer":"A","explain":"Phụ thuộc nguyên liệu thô, thiếu đa dạng hóa khiến kinh tế dễ tổn thương và chưa tương xứng tiềm năng.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lúa mì là cây lương thực chính của Nga.","b) Dân trí của Nga cao.","c) Nga giáp biển Ban-tích ở phía tây bắc.","d) Công nghiệp quốc phòng, vũ trụ của Nga hàng đầu thế giới."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu sản lượng lúa mì ở trên. Xét tính đúng, sai:","statements":["a) Nga sản xuất lúa mì nhiều nhất bảng.","b) Hoa Kỳ sản xuất nhiều hơn Ca-na-đa.","c) Ca-na-đa sản xuất ít nhất bảng.","d) Hoa Kỳ sản xuất nhiều hơn Nga."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 85, 50, 35. d) Sai.","points":1},{"type":"short","level":"NB","q":"Cây lương thực chính và là mặt hàng xuất khẩu quan trọng của Nga là cây gì?","answer":"lúa mì","explain":"Lúa mì là cây lương thực chính của Nga.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, Nga sản xuất lúa mì nhiều hơn Ca-na-đa bao nhiêu triệu tấn?","answer":"50","explain":"85 trừ 35 bằng 50 triệu tấn.","points":0.5}]}]}</script>
