úng, sai:","statements":["a) Ấn Độ có nhiều ngôn ngữ chính thức nhất bảng.","b) Nam Phi nhiều hơn Thụy Sĩ.","c) Việt Nam có ít nhất bảng.","d) Nam Phi có nhiều hơn Ấn Độ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 22, 11, 4, 1. d) Sai.","points":1},{"type":"short","level":"NB","q":"Mũi đất nổi tiếng ở cực nam châu Phi, gần Cape Town có tên là gì?","answer":"Mũi Hảo Vọng","explain":"Mũi Hảo Vọng là điểm du lịch nổi tiếng của Nam Phi.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, Ấn Độ có nhiều hơn Nam Phi bao nhiêu ngôn ngữ chính thức?","answer":"11","explain":"22 trừ 11 bằng 11.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"“Big Five” ở vườn quốc gia Kruger gồm","options":["A. Sư tử, voi, trâu rừng, báo, tê giác.","B. Hổ, gấu, sói, cáo, thỏ.","C. Cá voi, cá heo, rùa, cua, tôm.","D. Đại bàng, kền kền, cú, sáo, sẻ."],"answer":"A","explain":"“Big Five” gồm sư tử, voi, trâu rừng, báo hoa mai và tê giác.","points":0.25},{"type":"mcq","level":"NB","q":"Nam Phi xuất khẩu chủ yếu","options":["A. Khoáng sản, kim loại.","B. Lúa gạo.","C. Cà phê.","D. Dầu mỏ."],"answer":"A","explain":"Nam Phi xuất khẩu chủ yếu khoáng sản và kim loại.","points":0.25},{"type":"mcq","level":"NB","q":"Thủ đô tư pháp của Nam Phi là","options":["A. Blum-phôn-tên.","B. Prê-tô-ri-a.","C. Cape Town.","D. Giô-han-ne-xbớc."],"answer":"A","explain":"Blum-phôn-tên là thủ đô tư pháp của Nam Phi.","points":0.25},{"type":"mcq","level":"NB","q":"Quan hệ Việt Nam – Nam Phi nổi bật trong lĩnh vực","options":["A. Thương mại, đầu tư (viễn thông).","B. Không có quan hệ.","C. Chỉ du lịch.","D. Chỉ giáo dục."],"answer":"A","explain":"Việt Nam và Nam Phi hợp tác thương mại, đầu tư (Viettel đầu tư viễn thông tại châu Phi).","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: kim ngạch thương mại Việt Nam – Nam Phi (triệu USD): 2015: 800; 2020: 1 200. Nhận xét nào sau đây đúng?","options":["A. Kim ngạch tăng 1,5 lần sau 5 năm.","B. Kim
