ưởng nhanh nhất bảng.","b) Hoa Kỳ tăng trưởng nhanh hơn Nhật Bản.","c) Nhật Bản tăng trưởng chậm nhất bảng.","d) Hoa Kỳ tăng trưởng nhanh hơn Trung Quốc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 6,0; 2,2; 0,7. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ trọng công nghiệp ở trên. Xét tính đúng, sai:","statements":["a) Trung Quốc có tỉ trọng công nghiệp cao nhất bảng.","b) Hoa Kỳ có tỉ trọng thấp nhất bảng.","c) Nhật Bản cao hơn Hoa Kỳ.","d) Hoa Kỳ có tỉ trọng cao hơn Trung Quốc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 38, 18, 29. d) Sai.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, nước nào có tốc độ tăng trưởng GDP nhanh nhất năm 2019?","answer":"Trung Quốc","explain":"Trung Quốc tăng trưởng 6,0%/năm, nhanh nhất bảng.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, tỉ trọng công nghiệp trong GDP của Trung Quốc (38%) cao hơn Hoa Kỳ (18%) bao nhiêu điểm phần trăm?","answer":"20","explain":"38 trừ 18 bằng 20 điểm phần trăm.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: vốn đầu tư trực tiếp ra nước ngoài (tỉ USD) năm 2020: Trung Quốc 130, Hoa Kỳ 300, Nhật Bản 170. Nhận xét nào sau đây đúng?","options":["A. Hoa Kỳ đầu tư ra nước ngoài nhiều nhất bảng.","B. Trung Quốc nhiều nhất.","C. Nhật Bản ít nhất.","D. Cả ba bằng nhau."],"answer":"A","explain":"Hoa Kỳ 300 tỉ USD — nhiều nhất bảng.","points":0.25},{"type":"mcq","level":"VD","q":"Sáng kiến “Vành đai – Con đường” của Trung Quốc nhằm mục đích","options":["A. Tăng cường kết nối hạ tầng, thương mại với các nước.","B. Đóng cửa biên giới.","C. Cấm thương mại.","D. Chỉ phát triển trong nước."],"answer":"A","explain":"Sáng kiến nhằm kết nối hạ tầng và thương mại Á – Âu – Phi.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh nói: “Trung Quốc chỉ sao chép công nghệ, không sáng tạo”. Ý kiến này","options":["A. Đúng hoàn toàn.","B. Chưa đúng vì Trung  d) Sai.","points":1},{"type":"short","level":"VD","q":"Nước nào đầu tư trực tiếp ra nước ngoài nhiều nhất trong bảng số liệu trên?","answer":"Hoa Kỳ","explain":"Hoa Kỳ đầu tư 300 tỉ USD, nhiều nhất bảng.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, sản lượng điện tái tạo của Trung Quốc (900 tỉ kWh) gấp bao nhiêu lần Đức (250 tỉ kWh)? (làm tròn đến 1 chữ số thập phân)","answer":"3,6","explain":"900 chia 250 bằng 3,6 lần.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Đỉnh núi cao nhất thế giới nằm trên dãy Hi-ma-lay-a có tên là","options":["A. Ê-vơ-rét.","B. Phú Sĩ.","C. An-pơ.","D. Phan-xi-păng."],"answer":"A","explain":"Đỉnh Ê-vơ-rét (8 848 m) cao nhất thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Đồng bằng nào sau đây ở Trung Quốc?","options":["A. Hoa Bắc.","B. Ấn – Hằng.","C. La Pla-ta.","D. A-ma-dôn."],"answer":"A","explain":"Đồng bằng Hoa Bắc (cùng Hoa Trung, Hoa Nam) ở phía đông Trung Quốc.","points":0.25},{"type":"mcq","level":"NB","q":"Ngành công nghiệp nào sau đây là thế mạnh của Trung Quốc?","options":["A. Điện tử, dệt may.","B. Khai thác kim cương.","C. Chế biến gỗ.","D. Sản xuất đồ chơi duy nhất."],"answer":"A","explain":"Điện tử, dệt may là thế mạnh công nghiệp của Trung Quốc.","points":0.25},{"type":"mcq","level":"NB","q":"Nuôi trồng thủy sản của Trung Quốc","options":["A. Phát triển mạnh, đứng đầu thế giới.","B. Không phát triển.","C. Chỉ nuôi cá cảnh.","D. Bị cấm."],"answer":"A","explain":"Trung Quốc đứng đầu thế giới về nuôi trồng thủy sản.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: số lượng siêu đô thị trên 10 triệu dân: Trung Quốc 6, Ấn Độ 5, Hoa Kỳ 2 (năm 2020). Nhận xét nào sau đây đúng?","options":["A. Trung Quốc có nhiều siêu đô thị nhất bảng.","B. Hoa Kỳ nhiều nhất.","C. Ấn Độ ít nhất.","D. Cả ba bằng nhau."],"answer":"A","explain":"Trung Quốc 6 siêu đô thị — nhiều nhất bảng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty muốn đặt nhà m à cây gì?","answer":"lúa mì","explain":"Phía bắc Trung Quốc trồng lúa mì.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, kim ngạch thương mại Việt Nam – Trung Quốc năm 2020 (134 tỉ USD) tăng bao nhiêu tỉ USD so với năm 2015 (66 tỉ USD)?","answer":"68","explain":"134 trừ 66 bằng 68 tỉ USD.","points":0.5}]}]}</script>
