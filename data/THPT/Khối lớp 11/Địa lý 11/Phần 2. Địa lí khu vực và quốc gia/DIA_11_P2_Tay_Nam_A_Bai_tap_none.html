nts":["a) Tây Nam Á nằm ở ngã ba ba châu lục Á, Âu, Phi.","b) Kênh đào Xuy-ê nối Địa Trung Hải với Biển Đỏ.","c) Tây Nam Á tập trung khoảng một nửa trữ lượng dầu mỏ thế giới.","d) Đa số dân cư Tây Nam Á theo Phật giáo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đa số theo Hồi giáo.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tây Nam Á có khí hậu khô nóng, thiếu nước ngọt nghiêm trọng.","b) Sông Ti-grơ và Ơ-phơ-rát cung cấp nước cho vùng Lưỡng Hà.","c) Hoang mạc chiếm diện tích lớn ở Tây Nam Á.","d) Tây Nam Á có khí hậu ẩm ướt, mưa nhiều."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: khí hậu khô nóng, ít mưa.","points":1},{"type":"short","level":"NB","q":"Kênh đào nối Địa Trung Hải với Biển Đỏ có tên là gì?","answer":"Xuy-ê","explain":"Kênh đào Xuy-ê nối Địa Trung Hải với Biển Đỏ.","points":0.5},{"type":"short","level":"TH","q":"Hai con sông cung cấp nước cho vùng Lưỡng Hà là sông Ti-grơ và sông gì?","answer":"Ơ-phơ-rát","explain":"Sông Ti-grơ và sông Ơ-phơ-rát là hai con sông của vùng Lưỡng Hà.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Quốc gia nào là nước xuất khẩu dầu mỏ lớn nhất thế giới ở Tây Nam Á?","options":["A. A-rập Xê-út.","B. Y-ê-men.","C. Xy-ri.","D. Li-băng."],"answer":"A","explain":"A-rập Xê-út là nước xuất khẩu dầu mỏ lớn nhất thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Ngành kinh tế nào là trụ cột của nhiều nước Tây Nam Á?","options":["A. Khai thác và xuất khẩu dầu mỏ, khí tự nhiên.","B. Trồng lúa nước.","C. Đánh bắt cá.","D. Du lịch biển."],"answer":"A","explain":"Dầu khí là ngành kinh tế mũi nhọn, trụ cột của nhiều nước Tây Nam Á.","points":0.25},{"type":"mcq","level":"NB","q":"Dân số của Tây Nam Á khoảng","options":["A. 30 triệu người.","B. 300 triệu người.","C. 3 tỉ người.","D. 3 triệu người."],"answer":"B","explain":"Dân số Tây Nam Á khoảng 300 triệu người.","points":0.25},{"type":"mcq","level":"NB","q":"Thánh địa Méc-ca của Hồi giáo nằm ở quốc gia nào?","options":["A. A-rập Xê-út.","B. I-ran.","C. Thổ Nhĩ Kỳ.","D. Ai Cập."],"answer":"A","explain":"Thánh địa Méc-ca nằm ở A-rập Xê-út.","points":0.25},{"type":"mcq","level":"TH","q":"Các nước vùng Vịnh có GDP/người rất cao chủ yếu nhờ","options":["A. Xuất khẩu dầu mỏ, khí tự nhiên.","B. Xuất khẩu lúa gạo.","C. Xuất khẩu cà phê.","D. Du lịch biển."],"answer":"A","explain":"Ca-ta, UAE, Cô-oét... giàu lên nhờ xuất khẩu dầu khí.","points":0.25},{"type":"mcq","level":"TH","q":"Nông nghiệp Tây Nam Á gặp khó khăn chủ yếu vì","options":["A. Thiếu nước ngọt nghiêm trọng.","B. Đất quá màu mỡ.","C. Mưa quá nhiều.","D. Dân số quá ít."],"answer":"A","explain":"Khí hậu khô nóng, thiếu nước là khó khăn lớn nhất của nông nghiệp khu vực.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) A-rập Xê-út là nước xuất khẩu dầu mỏ lớn nhất thế giới.","b) Dầu khí là trụ cột kinh tế của nhiều nước Tây Nam Á.","c) Dân số Tây Nam Á khoảng 300 triệu người.","d) Thánh địa Méc-ca nằm ở I-ran."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Méc-ca nằm ở A-rập Xê-út.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Các nước vùng Vịnh giàu lên nhờ dầu khí.","b) Thiếu nước là khó khăn lớn nhất của nông nghiệp Tây Nam Á.","c) I-xra-en nổi tiếng về nông nghiệp công nghệ cao.","d) Mọi nước Tây Nam Á đều rất giàu có."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Y-ê-men, Xy-ri còn nghèo và bất ổn.","points":1},{"type":"short","level":"NB","q":"Nước nào xuất khẩu dầu mỏ lớn nhất thế giới?","answer":"A-rập Xê-út","explain":"A-rập Xê-út là nước xuất khẩu dầu mỏ lớn nhất thế giới.","points":0.5},{"type":"short","level":"TH","q":"Quốc gia Tây Nam Á nào nổi tiếng về phát triển nông nghiệp công nghệ cao giữa hoang mạc?","answer":"I-xra-en","explain":"I-xra-en nổi tiếng với nông nghiệp công nghệ cao (tưới nhỏ giọt) giữa hoang mạc.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Tây Nam Á gồm khoảng bao nhiêu quốc gia?","options":["A. 5.","B. 11.","C. 20.","D. 50."],"answer":"C","explain":"Tây Nam Á gồm khoảng 20 quốc gia.","points":0.25},{"type":"mcq","level":"NB","q":"Quốc gia nào nằm trên hai châu lục Á – Âu ở Tây Nam Á?","options":["A. Thổ Nhĩ Kỳ.","B. A-rập Xê-út.","C. I-ran.","D. Ca-ta."],"answer":"A","explain":"Thổ Nhĩ Kỳ nằm trên cả châu Á và châu Âu (eo biển Bô-pho).","points":0.25},{"type":"mcq","level":"NB","q":"Thành phố nào của UAE nổi tiếng về đa dạng hóa kinh tế (tài chính, du lịch)?","options":["A. Du-bai.","B. Méc-ca.","C. Tê-hê-ran.","D. Bát-đa."],"answer":"A","explain":"Du-bai (UAE) nổi tiếng với tài chính, thương mại và du lịch.","points":0.25},{"type":"mcq","level":"NB","q":"Hoang mạc lớn trên bán đảo A-rập là","options":["A. Hoang mạc A-rập.","B. Hoang mạc Xa-ha-ra.","C. Hoang mạc Gô-bi.","D. Hoang mạc Ca-la-ha-ri."],"answer":"A","explain":"Hoang mạc A-rập (gồm Ru-bi-en Kha-li) chiếm phần lớn bán đảo A-rập.","points":0.25},{"type":"mcq","level":"TH","q":"Cho bảng số liệu: GDP/người (USD) năm 2020: Ca-ta 52 000, UAE 43 000, A-rập Xê-út 20 000, Y-ê-men 600. Nhận xét nào sau đây đúng?","options":["A. Chênh lệch giàu nghèo trong nội bộ Tây Nam Á rất lớn.","B. Mọi nước đều giàu như nhau.","C. Y-ê-men giàu nhất bảng.","D. A-rập Xê-út nghèo nhất."],"answer":"A","explain":"Ca-ta gấp gần 87 lần Y-ê-men — chênh lệch rất lớn trong khu vực.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Tây Nam Á thường xuyên bất ổn về chính trị?","options":["A. Do tranh chấp lãnh thổ, xung đột sắc tộc, tôn giáo và vị trí chiến lược giàu dầu mỏ.","B. Do không có tài nguyên.","C. Do dân số quá ít.","D. Do khí hậu ôn hòa."],"answer":"A","explain":"Vị trí chiến lược, dầu mỏ cùng mâu thuẫn sắc tộc, tôn giáo khiến khu vực thường xuyên bất ổn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tây Nam Á gồm khoảng 20 quốc gia.","b) Thổ Nhĩ Kỳ nằm trên hai châu lục Á – Âu.","c) Du-bai thuộc UAE.","d) Hoang mạc Xa-ha-ra nằm trên bán đảo A-rập."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Xa-ha-ra ở Bắc Phi; bán đảo A-rập có hoang mạc A-rập.","points":1},{"type":"truefalse","level":"TH","q":"Dựa vào bảng số liệu GDP/người ở trên. Xét tính đúng, sai:","statements":["a) Ca-ta có GDP/người cao nhất bảng.","b) Chênh lệch giàu nghèo trong khu vực rất lớn.","c) Y-ê-men có GDP/người thấp nhất bảng.","d) A-rập Xê-út có GDP/người cao hơn UAE."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: A-rập Xê-út 20 000 thấp hơn UAE 43 000.","points":1},{"type":"short","level":"NB","q":"Hoang mạc lớn chiếm phần lớn bán đảo A-rập có tên là gì?","answer":"A-rập","explain":"Hoang mạc A-rập chiếm phần lớn bán đảo A-rập.","points":0.5},{"type":"short","level":"TH","q":"Dựa vào bảng số liệu, GDP/người của Ca-ta (52 000 USD) gấp khoảng bao nhiêu lần Y-ê-men (600 USD)? (làm tròn đến hàng đơn vị)","answer":"87","explain":"52 000 chia 600 bằng khoảng 86,7, làm tròn là 87 lần.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Biện pháp nào giúp các nước Tây Nam Á có thêm nước ngọt?","options":["A. Khử mặn nước biển.","B. Chờ mưa nhiều.","C. Khai thác nước ngầm vô tội vạ.","D. Nhập khẩu băng tuyết."],"answer":"A","explain":"Các nước vùng Vịnh đầu tư mạnh vào công nghệ khử mặn nước biển.","points":0.25},{"type":"mcq","level":"TH","q":"Chăn nuôi ở các vùng hoang mạc Tây Nam Á chủ yếu là","options":["A. Chăn nuôi du mục (cừu, dê, lạc đà).","B. Chăn nuôi bò sữa công nghiệp.","C. Nuôi lợn trang trại.","D. Nuôi tằm."],"answer":"A","explain":"Vùng hoang mạc thích hợp với chăn nuôi du mục cừu, dê, lạc đà.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghiệp lọc – hóa dầu phát triển mạnh ở Tây Nam Á vì","options":["A. Có nguồn dầu mỏ, khí tự nhiên dồi dào tại chỗ.","B. Có nhiều than đá.","C. Có nhiều lao động giá rẻ.","D. Khí hậu thuận lợi."],"answer":"A","explain":"Nguồn dầu khí dồi dào là cơ sở phát triển công nghiệp lọc – hóa dầu.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ nào thích hợp nhất để thể hiện sản lượng dầu mỏ của các nước Tây Nam Á năm 2020?","options":["A. Biểu đồ cột.","B. Biểu đồ đường.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"A","explain":"Biểu đồ cột so sánh giá trị giữa các đối tượng tại một thời điểm.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: sản lượng dầu mỏ (triệu thùng/ngày) năm 2020: A-rập Xê-út 9, I-rắc 4, UAE 3, Cô-oét 2,7. Nước nào sản xuất nhiều nhất?","options":["A. A-rập Xê-út.","B. I-rắc.","C. UAE.","D. Cô-oét."],"answer":"A","explain":"A-rập Xê-út 9 triệu thùng/ngày — lớn nhất bảng.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao UAE đa dạng hóa kinh tế sang tài chính, du lịch?","options":["A. Để giảm phụ thuộc vào dầu mỏ, phát triển bền vững khi dầu cạn kiệt.","B. Vì hết dầu mỏ hoàn toàn.","C. Vì không thích dầu mỏ.","D. Vì bị cấm xuất khẩu dầu."],"answer":"A","explain":"Đa dạng hóa giúp giảm rủi ro phụ thuộc vào một nguồn thu và chuẩn bị cho thời kì sau dầu mỏ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khử mặn nước biển giúp các nước vùng Vịnh có thêm nước ngọt.","b) Chăn nuôi du mục phổ biến ở vùng hoang mạc Tây Nam Á.","c) Công nghiệp lọc – hóa dầu phát triển nhờ nguồn dầu khí dồi dào.","d) Biểu đồ cột thích hợp để so sánh sản lượng dầu các nước."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu sản lượng dầu mỏ ở trên. Xét tính đúng, sai:","statements":["a) A-rập Xê-út sản xuất dầu nhiều nhất bảng.","b) I-rắc sản xuất nhiều hơn UAE.","c) Sản lượng của A-rập Xê-út gấp 3 lần UAE.","d) Cô-oét sản xuất nhiều nhất bảng."],"answer":["T","T","T","F"],"explain":"a), b) Đúng. c) Đúng: 9 chia 3 bằng 3 lần. d) Sai.","points":1},{"type":"short","level":"TH","q":"Công nghệ nào được các nước vùng Vịnh dùng phổ biến để có thêm nước ngọt?","answer":"Khử mặn nước biển","explain":"Khử mặn nước biển là giải pháp phổ biến ở các nước vùng Vịnh.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, sản lượng dầu của A-rập Xê-út (9 triệu thùng/ngày) gấp bao nhiêu lần UAE (3 triệu thùng/ngày)?","answer":"3","explain":"9 chia 3 bằng 3 lần.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"TH","q":"Tỉ lệ dân thành thị ở các nước vùng Vịnh cao chủ yếu vì","options":["A. Kinh tế dầu mỏ phát triển, đô thị hiện đại thu hút dân cư.","B. Nông nghiệp phát triển.","C. Khí hậu mát mẻ.","D. Dân số ít."],"answer":"A","explain":"Thu nhập dầu mỏ giúp xây dựng đô thị hiện đại, thu hút dân cư và lao động nhập cư.","points":0.25},{"type":"mcq","level":"TH","q":"Lao động nhập cư đông đảo ở các nước vùng Vịnh đến chủ yếu từ","options":["A. Châu Á (Nam Á, Đông Nam Á).","B. Châu Âu.","C. Bắc Mỹ.","D. Châu Đại Dương."],"answer":"A","explain":"Nhiều lao động từ Ấn Độ, Pa-ki-xtan, Phi-lip-pin, Việt Nam... sang vùng Vịnh làm việc.","points":0.25},{"type":"mcq","level":"TH","q":"Vùng Lưỡng Hà (I-rắc) nổi tiếng với","options":["A. Nền văn minh cổ đại và hai con sông Ti-grơ, Ơ-phơ-rát.","B. Rừng nhiệt đới.","C. Núi lửa.","D. Băng tuyết."],"answer":"A","explain":"Lưỡng Hà là cái nôi văn minh cổ đại với hai sông Ti-grơ và Ơ-phơ-rát.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ tròn thích hợp nhất để thể hiện","options":["A. Cơ cấu GDP theo khu vực kinh tế của A-rập Xê-út năm 2020.","B. Sản lượng dầu qua các năm.","C. Dân số các nước.","D. Diện tích các nước."],"answer":"A","explain":"Biểu đồ tròn thể hiện cơ cấu tại một thời điểm.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: tỉ lệ lao động nhập cư trong tổng lao động (%): Ca-ta 95, UAE 90, A-rập Xê-út 50. Nhận xét nào sau đây đúng?","options":["A. Ca-ta phụ thuộc rất lớn vào lao động nhập cư.","B. A-rập Xê-út có tỉ lệ cao nhất.","C. UAE không có lao động nhập cư.","D. Ba nước không dùng lao động nước ngoài."],"answer":"A","explain":"Ca-ta 95% — phụ thuộc rất lớn vào lao động nhập cư.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao giá dầu giảm mạnh gây khó khăn lớn cho các nước Tây Nam Á?","options":["A. Vì ngân sách các nước này phụ thuộc lớn vào thu nhập từ dầu mỏ.","B. Vì các nước này không có dầu.","C. Vì giá dầu không ảnh hưởng ngân sách.","D. Vì các nước này chỉ trồng lúa."],"answer":"A","explain":"Thu ngân sách phụ thuộc lớn vào dầu mỏ nên giá dầu giảm gây thâm hụt ngân sách nghiêm trọng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đô thị ở vùng Vịnh hiện đại nhờ thu nhập dầu mỏ.","b) Lao động nhập cư ở vùng Vịnh chủ yếu từ châu Á.","c) Lưỡng Hà là cái nôi văn minh cổ đại.","d) Biểu đồ tròn thích hợp để thể hiện cơ cấu GDP."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu lao động nhập cư ở trên. Xét tính đúng, sai:","statements":["a) Ca-ta có tỉ lệ lao động nhập cư cao nhất bảng.","b) UAE có tỉ lệ cao hơn A-rập Xê-út.","c) Các nước vùng Vịnh phụ thuộc lớn vào lao động nhập cư.","d) A-rập Xê-út không sử dụng lao động nhập cư."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: A-rập Xê-út có 50% lao động là nhập cư.","points":1},{"type":"short","level":"TH","q":"Vùng đất giữa hai sông Ti-grơ và Ơ-phơ-rát được gọi là gì?","answer":"Lưỡng Hà","explain":"Lưỡng Hà (Mê-sô-pô-ta-mi) là vùng đất giữa hai sông Ti-grơ và Ơ-phơ-rát.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, tỉ lệ lao động nhập cư của Ca-ta (95%) hơn A-rập Xê-út (50%) bao nhiêu điểm phần trăm?","answer":"45","explain":"95 trừ 50 bằng 45 điểm phần trăm.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Thổ Nhĩ Kỳ có nền kinh tế như thế nào so với các nước Tây Nam Á khác?","options":["A. Đa dạng nhất khu vực, ít phụ thuộc vào dầu mỏ.","B. Chỉ có dầu mỏ.","C. Nghèo nhất khu vực.","D. Không có công nghiệp."],"answer":"A","explain":"Thổ Nhĩ Kỳ có nền kinh tế đa dạng (công nghiệp, dịch vụ, du lịch), ít phụ thuộc dầu mỏ.","points":0.25},{"type":"mcq","level":"TH","q":"Vấn đề Pa-le-xtin ở Tây Nam Á liên quan đến","options":["A. Xung đột giữa I-xra-en và người Pa-le-xtin về lãnh thổ.","B. Tranh chấp nguồn nước duy nhất.","C. Thi đấu thể thao.","D. Thương mại dầu mỏ."],"answer":"A","explain":"Vấn đề Pa-le-xtin là xung đột kéo dài về lãnh thổ giữa I-xra-en và người Pa-le-xtin.","points":0.25},{"type":"mcq","level":"TH","q":"Nông nghiệp ốc đảo ở Tây Nam Á trồng chủ yếu","options":["A. Chà là và một số cây chịu hạn.","B. Lúa nước.","C. Chè.","D. Cà phê."],"answer":"A","explain":"Các ốc đảo trồng chà là và cây chịu hạn nhờ nguồn nước ngầm.","points":0.25},{"type":"mcq","level":"TH","q":"Để thể hiện tốc độ tăng trưởng GDP của Ca-ta giai đoạn 2000 – 2020, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ tròn.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"A","explain":"Biểu đồ đường thể hiện tốc độ tăng trưởng theo thời gian.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: lượng mưa trung bình năm (mm): Ri-át (A-rập Xê-út) 100, Ma-na-ma (Ba-ranh) 80, I-xtan-bun (Thổ Nhĩ Kỳ) 800. Nhận xét nào sau đây đúng?","options":["A. Lượng mưa phân hóa mạnh: Thổ Nhĩ Kỳ mưa nhiều hơn hẳn vùng A-rập.","B. Mọi nơi đều mưa như nhau.","C. Ri-át mưa nhiều nhất.","D. I-xtan-bun khô hạn nhất."],"answer":"A","explain":"I-xtan-bun 800 mm gấp 8 lần Ri-át — phân hóa mạnh do vị trí địa lí.","points":0.25},{"type":"mcq","level":"VD","q":"I-xra-en phát triển được nông nghiệp công nghệ cao giữa hoang mạc nhờ","options":["A. Công nghệ tưới nhỏ giọt, giống cây chịu hạn và quản lí nước hiệu quả.","B. Mưa nhiều.","C. Đất màu mỡ tự nhiên.","D. Sông lớn chảy qua."],"answer":"A","explain":"I-xra-en nổi tiếng với tưới nhỏ giọt và công nghệ nông nghiệp sa mạc.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kinh tế Thổ Nhĩ Kỳ đa dạng, ít phụ thuộc dầu mỏ.","b) Vấn đề Pa-le-xtin là xung đột về lãnh thổ.","c) Nông nghiệp ốc đảo trồng chà là.","d) Biểu đồ đường thích hợp để thể hiện tốc độ tăng trưởng theo thời gian."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu lượng mưa ở trên. Xét tính đúng, sai:","statements":["a) I-xtan-bun có lượng mưa cao nhất bảng.","b) Lượng mưa ở I-xtan-bun gấp 8 lần Ri-át.","c) Lượng mưa phân hóa mạnh trong khu vực.","d) Ri-át có lượng mưa cao hơn I-xtan-bun."],"answer":["T","T","T","F"],"explain":"a) Đúng: 800 mm cao nhất. b) Đúng: 800 chia 100 bằng 8 lần. c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Cây trồng đặc trưng của các ốc đảo ở Tây Nam Á là cây gì?","answer":"chà là","explain":"Chà là là cây trồng đặc trưng của các ốc đảo sa mạc Tây Nam Á.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, lượng mưa ở I-xtan-bun (800 mm) gấp bao nhiêu lần Ri-át (100 mm)?","answer":"8","explain":"800 chia 100 bằng 8 lần.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: trữ lượng dầu mỏ đã chứng minh (tỉ thùng): A-rập Xê-út 260, I-ran 150, I-rắc 140, Cô-oét 100. Nước nào có trữ lượng lớn nhất?","options":["A. A-rập Xê-út.","B. I-ran.","C. I-rắc.","D. Cô-oét."],"answer":"A","explain":"A-rập Xê-út 260 tỉ thùng — lớn nhất bảng.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao kênh đào Xuy-ê có ý nghĩa chiến lược toàn cầu?","options":["A. Vì rút ngắn đáng kể đường hàng hải giữa châu Âu và châu Á, tiết kiệm thời gian và chi phí.","B. Vì cung cấp nước tưới.","C. Vì là nơi đánh bắt cá.","D. Vì ngăn cách hai châu lục."],"answer":"A","explain":"Kênh Xuy-ê giúp tàu không phải đi vòng qua mũi Hảo Vọng — rút ngắn khoảng 7 000 km.","points":0.25},{"type":"mcq","level":"VDC","q":"Một quốc gia Tây Nam Á muốn giảm phụ thuộc vào dầu mỏ. Chiến lược phù hợp nhất là","options":["A. Dùng thu nhập dầu mỏ đầu tư vào công nghệ, du lịch, tài chính và năng lượng tái tạo.","B. Ngừng khai thác dầu ngay lập tức.","C. Chỉ trông chờ giá dầu tăng.","D. Đóng cửa nền kinh tế."],"answer":"A","explain":"Đa dạng hóa bằng nguồn thu dầu mỏ là chiến lược bền vững như UAE đã làm.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ trọng dầu mỏ trong GDP (%): A-rập Xê-út 40, Ca-ta 50, Y-ê-men 25. Nhận xét nào sau đây đúng?","options":["A. Các nước này phụ thuộc lớn vào dầu mỏ, Ca-ta phụ thuộc nhiều nhất.","B. Không nước nào phụ thuộc dầu mỏ.","C. Y-ê-men phụ thuộc nhiều nhất.","D. Dầu mỏ không quan trọng."],"answer":"A","explain":"Ca-ta 50% — phụ thuộc nhiều nhất; cả ba đều phụ thuộc lớn vào dầu mỏ.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện tỉ trọng dầu mỏ trong GDP của ba nước trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Biểu đồ tròn."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị giữa các đối tượng tại một thời điểm.","points":0.25},{"type":"mcq","level":"VDC","q":"Nguyên nhân sâu xa khiến Tây Nam Á trở thành “điểm nóng” chính trị thế giới là","options":["A. Vị trí chiến lược và nguồn dầu mỏ khổng lồ khiến các cường quốc tranh giành ảnh hưởng.","B. Dân số quá đông.","C. Khí hậu quá lạnh.","D. Không có tài nguyên."],"answer":"A","explain":"Vị trí ngã ba ba châu lục và dầu mỏ khiến khu vực thành nơi tranh giành ảnh hưởng của các cường quốc.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu trữ lượng dầu mỏ ở trên. Xét tính đúng, sai:","statements":["a) A-rập Xê-út có trữ lượng dầu lớn nhất bảng.","b) I-ran có trữ lượng lớn hơn I-rắc.","c) Cô-oét có trữ lượng thấp nhất bảng.","d) I-rắc có trữ lượng lớn nhất bảng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 260, 150, 140, 100. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ trọng dầu mỏ trong GDP ở trên. Xét tính đúng, sai:","statements":["a) Ca-ta phụ thuộc vào dầu mỏ nhiều nhất bảng.","b) Cả ba nước đều phụ thuộc lớn vào dầu mỏ.","c) A-rập Xê-út có tỉ trọng cao hơn Y-ê-men.","d) Dầu mỏ không ảnh hưởng đến GDP các nước này."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 50%, 40%, 25%. d) Sai.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, nước nào có trữ lượng dầu mỏ đã chứng minh lớn nhất?","answer":"A-rập Xê-út","explain":"A-rập Xê-út có trữ lượng 260 tỉ thùng, lớn nhất bảng.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, trữ lượng dầu của A-rập Xê-út (260 tỉ thùng) gấp bao nhiêu lần Cô-oét (100 tỉ thùng)? (làm tròn đến 1 chữ số thập phân)","answer":"2,6","explain":"260 chia 100 bằng 2,6 lần.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: nhiệt độ trung bình tháng 7 (°C): Ri-át 36, Đu-ba 41, I-xtan-bun 24. Nhận xét nào sau đây đúng?","options":["A. Vùng A-rập có mùa hè cực kì nóng, trong khi Thổ Nhĩ Kỳ ôn hòa hơn.","B. Mọi nơi đều mát mẻ.","C. I-xtan-bun nóng nhất.","D. Ri-át lạnh nhất."],"answer":"A","explain":"Đu-ba 41°C, Ri-át 36°C — cực nóng; I-xtan-bun 24°C ôn hòa hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nông nghiệp công nghệ cao của I-xra-en được nhiều nước học tập?","options":["A. Vì đã chinh phục được hoang mạc bằng công nghệ tưới nhỏ giọt và giống chịu hạn.","B. Vì có mưa nhiều.","C. Vì đất đai màu mỡ sẵn.","D. Vì không cần nước."],"answer":"A","explain":"I-xra-en là hình mẫu biến hoang mạc thành vựa nông nghiệp bằng công nghệ.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh nói: “Tây Nam Á giàu dầu mỏ nên mọi nước đều giàu có”. Ý kiến này","options":["A. Đúng hoàn toàn.","B. Chưa đúng vì dầu mỏ phân bố không đều và nhiều nước còn nghèo, bất ổn như Y-ê-men, Xy-ri.","C. Sai hoàn toàn vì không có dầu.","D. Đúng vì dầu mỏ chia đều."],"answer":"B","explain":"Dầu mỏ tập trung ở một số nước vùng Vịnh; nhiều nước khác nghèo và bất ổn.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: chi tiêu cho quốc phòng (tỉ USD) năm 2020: A-rập Xê-út 57, I-xra-en 22, Thổ Nhĩ Kỳ 18. Nhận xét nào sau đây đúng?","options":["A. A-rập Xê-út chi tiêu quốc phòng lớn nhất bảng, phản ánh tình trạng bất ổn an ninh khu vực.","B. Thổ Nhĩ Kỳ chi nhiều nhất.","C. I-xra-en không chi quốc phòng.","D. Ba nước không có quân đội."],"answer":"A","explain":"A-rập Xê-út 57 tỉ USD — lớn nhất bảng, phản ánh bất ổn an ninh khu vực.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện chi tiêu quốc phòng của ba nước trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Biểu đồ tròn."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị giữa các đối tượng.","points":0.25},{"type":"mcq","level":"VDC","q":"Giải pháp căn bản để Tây Nam Á ổn định và phát triển bền vững là","options":["A. Giải quyết xung đột bằng hòa bình, đa dạng hóa kinh tế và hợp tác khu vực.","B. Tăng cường chạy đua vũ trang.","C. Chỉ khai thác dầu mỏ.","D. Cô lập với thế giới."],"answer":"A","explain":"Hòa bình, đa dạng hóa kinh tế và hợp tác là con đường bền vững cho khu vực.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu nhiệt độ tháng 7 ở trên. Xét tính đúng, sai:","statements":["a) Đu-ba có nhiệt độ tháng 7 cao nhất bảng.","b) I-xtan-bun ôn hòa hơn hẳn vùng A-rập.","c) Số liệu thể hiện khí hậu khô nóng của Tây Nam Á.","d) Ri-át có nhiệt độ thấp hơn I-xtan-bun."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 41, 36, 24. d) Sai: Ri-át 36 cao hơn I-xtan-bun 24.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu chi tiêu quốc phòng ở trên. Xét tính đúng, sai:","statements":["a) A-rập Xê-út chi tiêu quốc phòng lớn nhất bảng.","b) Số liệu phản ánh bất ổn an ninh khu vực.","c) I-xra-en chi nhiều hơn Thổ Nhĩ Kỳ.","d) Thổ Nhĩ Kỳ chi tiêu nhiều nhất bảng."],"answer":["T","T","T","F"],"explain":"a), b) Đúng. c) Đúng: 22 lớn hơn 18. d) Sai.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, thành phố nào có nhiệt độ trung bình tháng 7 cao nhất?","answer":"Đu-ba","explain":"Đu-ba 41°C — cao nhất bảng.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, chi tiêu quốc phòng của A-rập Xê-út (57 tỉ USD) gấp khoảng bao nhiêu lần Thổ Nhĩ Kỳ (18 tỉ USD)? (làm tròn đến 1 chữ số thập phân)","answer":"3,2","explain":"57 chia 18 bằng khoảng 3,17, làm tròn là 3,2 lần.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Đặc trưng tự nhiên nổi bật nhất của Tây Nam Á là","options":["A. Khí hậu khô nóng và giàu dầu mỏ.","B. Khí hậu ẩm ướt và nhiều rừng.","C. Khí hậu lạnh giá quanh năm.","D. Nhiều sông lớn, đồng bằng rộng."],"answer":"A","explain":"Khô nóng, thiếu nước nhưng giàu dầu mỏ là đặc trưng nổi bật nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Nước nào sau đây thuộc Tây Nam Á?","options":["A. I-ran.","B. Nhật Bản.","C. Ấn Độ.","D. Hàn Quốc."],"answer":"A","explain":"I-ran thuộc Tây Nam Á; các nước còn lại thuộc Đông Á, Nam Á.","points":0.25},{"type":"mcq","level":"NB","q":"Kênh đào Xuy-ê nằm ở quốc gia nào?","options":["A. Ai Cập.","B. A-rập Xê-út.","C. Thổ Nhĩ Kỳ.","D. I-ran."],"answer":"A","explain":"Kênh đào Xuy-ê nằm ở Ai Cập, nối Địa Trung Hải với Biển Đỏ.","points":0.25},{"type":"mcq","level":"NB","q":"Tôn giáo nào ảnh hưởng sâu sắc đến đời sống Tây Nam Á?","options":["A. Hồi giáo.","B. Phật giáo.","C. Công giáo.","D. Tin Lành."],"answer":"A","explain":"Hồi giáo ảnh hưởng sâu sắc đến đời sống, văn hóa Tây Nam Á.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: lượng dầu xuất khẩu qua eo biển Hoóc-mút (triệu thùng/ngày): 2018: 20; 2020: 17; 2022: 21. Nhận xét nào sau đây đúng?","options":["A. Eo biển Hoóc-mút là tuyến vận chuyển dầu mỏ huyết mạch của thế giới.","B. Không có dầu đi qua eo biển này.","C. Lượng dầu giảm liên tục.","D. Eo biển này không quan trọng."],"answer":"A","explain":"Khoảng 1/5 lượng dầu thế giới đi qua eo Hoóc-mút — huyết mạch năng lượng toàn cầu.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty năng lượng muốn đầu tư vào năng lượng tái tạo ở Tây Nam Á. Lợi thế lớn nhất của khu vực là","options":["A. Nắng nóng quanh năm, tiềm năng điện mặt trời khổng lồ.","B. Nhiều sông lớn.","C. Gió mùa mạnh.","D. Than đá dồi dào."],"answer":"A","explain":"Hoang mạc nắng nóng là lợi thế lớn cho điện mặt trời ở Tây Nam Á.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khí hậu khô nóng và giàu dầu mỏ là đặc trưng của Tây Nam Á.","b) I-ran thuộc Tây Nam Á.","c) Kênh đào Xuy-ê nằm ở Ai Cập.","d) Phật giáo ảnh hưởng sâu sắc nhất đến Tây Nam Á."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Hồi giáo ảnh hưởng sâu sắc nhất.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu dầu qua eo Hoóc-mút ở trên. Xét tính đúng, sai:","statements":["a) Năm 2022 lượng dầu qua eo biển cao nhất trong bảng.","b) Eo Hoóc-mút là tuyến vận chuyển dầu huyết mạch.","c) Năm 2020 lượng dầu qua eo biển thấp nhất bảng.","d) Không có dầu mỏ đi qua eo biển này."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 21, 20, 17. d) Sai.","points":1},{"type":"short","level":"NB","q":"Eo biển nào là tuyến vận chuyển dầu mỏ huyết mạch từ vùng Vịnh ra thế giới?","answer":"Hoóc-mút","explain":"Eo biển Hoóc-mút là cửa ngõ vận chuyển dầu từ vùng Vịnh.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, năm 2022 lượng dầu qua eo Hoóc-mút (21 triệu thùng/ngày) hơn năm 2020 (17 triệu thùng/ngày) bao nhiêu triệu thùng/ngày?","answer":"4","explain":"21 trừ 17 bằng 4 triệu thùng/ngày.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"4 từ khóa đặc trưng nhất của Tây Nam Á là","options":["A. Dầu mỏ, thiếu nước, Hồi giáo, bất ổn chính trị.","B. Lúa nước, mưa nhiều, Phật giáo, ổn định.","C. Rừng rậm, sông lớn, đông dân, công nghiệp.","D. Băng tuyết, lạnh giá, thưa dân, du mục."],"answer":"A","explain":"Dầu mỏ, thiếu nước, Hồi giáo và bất ổn chính trị là 4 đặc trưng nổi bật.","points":0.25},{"type":"mcq","level":"NB","q":"Quốc gia nào có nền kinh tế đa dạng nhất Tây Nam Á?","options":["A. Thổ Nhĩ Kỳ.","B. Ca-ta.","C. Cô-oét.","D. Ba-ranh."],"answer":"A","explain":"Thổ Nhĩ Kỳ có nền kinh tế đa dạng (công nghiệp, dịch vụ, du lịch), ít phụ thuộc dầu mỏ.","points":0.25},{"type":"mcq","level":"NB","q":"Cây trồng đặc trưng của các ốc đảo Tây Nam Á là","options":["A. Chà là.","B. Lúa nước.","C. Cà phê.","D. Cao su."],"answer":"A","explain":"Chà là là cây trồng đặc trưng của các ốc đảo sa mạc.","points":0.25},{"type":"mcq","level":"NB","q":"Vật nuôi phổ biến ở vùng hoang mạc Tây Nam Á là","options":["A. Lạc đà.","B. Trâu.","C. Bò sữa.","D. Lợn."],"answer":"A","explain":"Lạc đà thích nghi tốt với hoang mạc, được chăn nuôi du mục.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ lệ che phủ rừng (%): Thổ Nhĩ Kỳ 29, A-rập Xê-út 0,5, Ca-ta 0. Nhận xét nào sau đây đúng?","options":["A. Tây Nam Á hầu như không có rừng do khí hậu khô nóng.","B. Mọi nước đều nhiều rừng.","C. A-rập Xê-út nhiều rừng nhất.","D. Ca-ta có rừng rậm."],"answer":"A","explain":"Tỉ lệ rừng cực thấp (0–0,5%) ở vùng Vịnh do khô nóng; Thổ Nhĩ Kỳ ôn hòa hơn nên có rừng.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao Thổ Nhĩ Kỳ có tỉ lệ rừng cao hơn hẳn các nước vùng Vịnh?","options":["A. Vì Thổ Nhĩ Kỳ có khí hậu ôn hòa, mưa nhiều hơn, không hoàn toàn là hoang mạc.","B. Vì Thổ Nhĩ Kỳ trồng rừng nhân tạo duy nhất.","C. Vì vùng Vịnh không cần rừng.","D. Vì Thổ Nhĩ Kỳ không có sa mạc nào."],"answer":"A","explain":"Thổ Nhĩ Kỳ nằm ở vùng khí hậu Địa Trung Hải, ôn hòa, mưa nhiều hơn nên có rừng tự nhiên.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dầu mỏ, thiếu nước, Hồi giáo, bất ổn là đặc trưng của Tây Nam Á.","b) Thổ Nhĩ Kỳ có nền kinh tế đa dạng nhất khu vực.","c) Chà là là cây trồng đặc trưng của ốc đảo.","d) Lạc đà là vật nuôi phổ biến ở hoang mạc."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ lệ che phủ rừng ở trên. Xét tính đúng, sai:","statements":["a) Thổ Nhĩ Kỳ có tỉ lệ rừng cao nhất bảng.","b) Ca-ta hầu như không có rừng.","c) Khí hậu khô nóng khiến vùng Vịnh ít rừng.","d) A-rập Xê-út có tỉ lệ rừng cao hơn Thổ Nhĩ Kỳ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: 0,5% thấp hơn 29%.","points":1},{"type":"short","level":"NB","q":"Vật nuôi nào được mệnh danh là “con tàu của sa mạc” ở Tây Nam Á?","answer":"Lạc đà","explain":"Lạc đà được mệnh danh là con tàu của sa mạc.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, tỉ lệ che phủ rừng của Thổ Nhĩ Kỳ (29%) gấp bao nhiêu lần A-rập Xê-út (0,5%)?","answer":"58","explain":"29 chia 0,5 bằng 58 lần.","points":0.5}]}]}</script>
