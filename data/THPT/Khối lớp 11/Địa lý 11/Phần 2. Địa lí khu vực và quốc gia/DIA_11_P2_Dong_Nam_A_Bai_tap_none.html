hập ASEAN ngày 28/7/1995.","points":0.25},{"type":"mcq","level":"NB","q":"Cây lương thực chính của Đông Nam Á là","options":["A. Lúa nước.","B. Lúa mì.","C. Ngô.","D. Khoai tây."],"answer":"A","explain":"Lúa nước là cây lương thực chính nhờ khí hậu nhiệt đới gió mùa.","points":0.25},{"type":"mcq","level":"TH","q":"Các nước xuất khẩu gạo hàng đầu thế giới ở Đông Nam Á là","options":["A. Thái Lan và Việt Nam.","B. Xin-ga-po và Bru-nây.","C. Lào và Đông Ti-mo.","D. Phi-lip-pin và Ma-lai-xi-a."],"answer":"A","explain":"Thái Lan và Việt Nam là những nước xuất khẩu gạo hàng đầu thế giới.","points":0.25},{"type":"mcq","level":"TH","q":"Cộng đồng ASEAN chính thức hình thành ngày 31/12/2015 gồm 3 trụ cột là","options":["A. Chính trị – An ninh, Kinh tế, Văn hóa – Xã hội.","B. Quân sự, Giáo dục, Y tế.","C. Nông nghiệp, Công nghiệp, Dịch vụ.","D. Giao thông, Bưu điện, Du lịch."],"answer":"A","explain":"3 trụ cột Cộng đồng ASEAN: Chính trị – An ninh, Kinh tế, Văn hóa – Xã hội.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) In-đô-nê-xi-a là nước đông dân nhất Đông Nam Á.","b) Xin-ga-po có GDP/người cao nhất Đông Nam Á.","c) Việt Nam gia nhập ASEAN năm 1995.","d) Lúa mì là cây lương thực chính của Đông Nam Á."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lúa nước mới là cây lương thực chính.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thái Lan và Việt Nam là những nước xuất khẩu gạo hàng đầu thế giới.","b) Cộng đồng ASEAN có 3 trụ cột.","c) Cộng đồng ASEAN hình thành năm 2015.","d) Trụ cột Kinh tế là trụ cột duy nhất của ASEAN."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: có 3 trụ cột.","points":1},{"type":"short","level":"NB","q":"Nước nào đông dân nhất Đông Nam Á?","answer":"In-đô-nê-xi-a","explain":"In-đô-nê-xi-a có khoảng 270 triệu người, đông nhất khu vực.","points":0.5},{"type":"short","level":"TH","q":"Cộng đồng ASEAN chính thức được hình thành vào năm nào?","answer":"2015","explain":"Cộng đồng ASEAN chính thức hình thành ngày 31/12/2015.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Khí hậu chủ yếu của Đông Nam Á là","options":["A. Nhiệt đới gió mùa.","B. Ôn đới hải dương.","C. Hàn đới.","D. Địa Trung Hải."],"answer":"A","explain":"Đông Nam Á có khí hậu nhiệt đới gió mùa, nóng ẩm, mưa nhiều.","points":0.25},{"type":"mcq","level":"NB","q":"Tôn giáo chủ yếu ở In-đô-nê-xi-a và Ma-lai-xi-a là","options":["A. Hồi giáo.","B. Phật giáo.","C. Thiên Chúa giáo.","D. Ấn Độ giáo."],"answer":"A","explain":"Hồi giáo là tôn giáo chủ yếu ở In-đô-nê-xi-a, Ma-lai-xi-a và Bru-nây.","points":0.25},{"type":"mcq","level":"NB","q":"Nước nào ở Đông Nam Á có đa số dân theo Thiên Chúa giáo?","options":["A. Phi-lip-pin.","B. Thái Lan.","C. Lào.","D. Cam-pu-chia."],"answer":"A","explain":"Phi-lip-pin từng là thuộc địa Tây Ban Nha nên đa số dân theo Thiên Chúa giáo.","points":0.25},{"type":"mcq","level":"NB","q":"Khoáng sản nào là thế mạnh của Ma-lai-xi-a, Thái Lan và In-đô-nê-xi-a?","options":["A. Thiếc.","B. Vàng.","C. Kim cương.","D. Uranium."],"answer":"A","explain":"Ma-lai-xi-a, Thái Lan, In-đô-nê-xi-a là những nước xuất khẩu thiếc hàng đầu.","points":0.25},{"type":"mcq","level":"TH","q":"Cho bảng số liệu: dân số (triệu người) năm 2020: In-đô-nê-xi-a 270, Phi-lip-pin 110, Việt Nam 97, Thái Lan 70. Nhận xét nào sau đây đúng?","options":["A. In-đô-nê-xi-a đông dân nhất bảng, gấp khoảng 2,5 lần Phi-lip-pin.","B. Việt Nam đông dân nhất.","C. Thái Lan đông dân nhất.","D. Bốn nước có dân số bằng nhau."],"answer":"A","explain":"270 chia 110 khoảng 2,5 lần — In-đô-nê-xi-a đông dân nhất bảng.","points":0.25},{"type":"mcq","level":"TH","q":"Mục tiêu hàng đầu của ASEAN khi thành lập là","options":["A. Thúc đẩy hòa bình, ổn định và hợp tác phát triển giữa các nước thành viên.","B. Thành lập liên minh quân sự.","C. Cô lập các nước ngoài khối.","D. Xóa bỏ mọi nền văn -lai-xi-a, Bru-nây và Việt Nam là những nước có dầu khí ở Đông Nam Á.","points":0.25},{"type":"mcq","level":"TH","q":"Ngành công nghiệp nào phát triển mạnh ở Ma-lai-xi-a, Thái Lan, Việt Nam?","options":["A. Điện tử và công nghiệp chế biến.","B. Đóng tàu vũ trụ.","C. Luyện kim đen.","D. Khai thác kim cương."],"answer":"A","explain":"Công nghiệp điện tử, chế biến phát triển mạnh nhờ vốn FDI và lao động.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ nào thích hợp nhất để thể hiện tỉ trọng các ngành kinh tế trong GDP của Việt Nam năm 2020?","options":["A. Biểu đồ tròn.","B. Biểu đồ đường.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"A","explain":"Biểu đồ tròn thể hiện cơ cấu tại một thời điểm.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: GDP/người (USD) năm 2020: Xin-ga-po 59 000, Ma-lai-xi-a 10 400, Thái Lan 7 200, Việt Nam 3 400, Cam-pu-chia 1 600. Nhận xét nào sau đây đúng?","options":["A. Chênh lệch trình độ phát triển trong ASEAN còn lớn.","B. Mọi nước ASEAN đều có GDP/người như nhau.","C. Cam-pu-chia cao nhất bảng.","D. Việt Nam cao hơn Ma-lai-xi-a."],"answer":"A","explain":"Xin-ga-po gấp gần 37 lần Cam-pu-chia — chênh lệch rất lớn trong nội bộ ASEAN.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao Xin-ga-po tuy diện tích nhỏ, nghèo tài nguyên nhưng lại phát triển nhất Đông Nam Á?","options":["A. Nhờ vị trí chiến lược, cảng biển, phát triển dịch vụ, tài chính và công nghệ cao.","B. Nhờ khai thác dầu mỏ.","C. Nhờ trồng lúa nước.","D. Nhờ dân số đông."],"answer":"A","explain":"Xin-ga-po tận dụng vị trí, phát triển cảng biển, tài chính, công nghệ cao — không phụ thuộc tài nguyên.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đông Nam Á có dân số trẻ, lao động dồi dào.","b) Việt Nam là nước có dầu khí ở Đông Nam Á.","c) Công nghiệp điện tử phát triển mạnh ở Ma-lai-xi-a, Thái Lan, Việt Nam.","d) Biểu đồ tròn thích hợp để thể hiện cơ cấu GDP."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu GDP/người ở trên. Xét tính đúng, sai:","statements":["a) Xin-ga-po có GDP/người cao nhất bảng.","b) Chênh lệch trình độ phát triển trong ASEAN còn lớn.","c) Cam-pu-chia có GDP/người thấp nhất bảng.","d) Việt Nam có GDP/người cao hơn Thái Lan."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Việt Nam 3 400 thấp hơn Thái Lan 7 200.","points":1},{"type":"short","level":"TH","q":"Nước nào có GDP bình quân đầu người cao nhất Đông Nam Á?","answer":"Xin-ga-po","explain":"Xin-ga-po có GDP/người cao nhất Đông Nam Á (khoảng 59 000 USD năm 2020).","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, GDP/người của Xin-ga-po (59 000 USD) gấp khoảng bao nhiêu lần Cam-pu-chia (1 600 USD)? (làm tròn đến hàng đơn vị)","answer":"37","explain":"59 000 chia 1 600 bằng khoảng 36,9, làm tròn là 37 lần.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"TH","q":"Thứ tự gia nhập ASEAN của các nước Đông Dương là","options":["A. Việt Nam (1995), Lào và Mi-an-ma (1997), Cam-pu-chia (1999).","B. Cam-pu-chia (1995), Việt Nam (1999).","C. Cả ba cùng năm 1967.","D. Lào (1995), Việt Nam (1999)."],"answer":"A","explain":"Việt Nam gia nhập 1995, Lào và Mi-an-ma 1997, Cam-pu-chia 1999.","points":0.25},{"type":"mcq","level":"TH","q":"Du lịch Đông Nam Á phát triển mạnh ở các nước nào?","options":["A. Thái Lan, Việt Nam, Ma-lai-xi-a.","B. Chỉ ở Xin-ga-po.","C. Chỉ ở Bru-nây.","D. Không nước nào phát triển du lịch."],"answer":"A","explain":"Thái Lan, Việt Nam, Ma-lai-xi-a... có cảnh quan, văn hóa đặc sắc nên du lịch phát triển mạnh.","points":0.25},{"type":"mcq","level":"TH","q":"Cây công nghiệp nào là thế mạnh của Ma-lai-xi-a và In-đô-nê-xi-a?","options":["A. Cọ dầu.","B. Bông.","C. Đậu tương.","D. Hướng dương."],"answer":"A","explain":"Ma-lai-xi-a và In-đô-nê-xi-a là những nước sản xuất dầu cọ hàng đầu thế giới.","points":0.25},{"type": ,"explain":"Cả bốn khẳng định đều đúng với số liệu bảng.","points":1},{"type":"short","level":"TH","q":"Nước nào gia nhập ASEAN năm 1999, là thành viên thứ 10?","answer":"Cam-pu-chia","explain":"Cam-pu-chia gia nhập ASEAN năm 1999, là thành viên thứ 10.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, năm 2020 Việt Nam xuất khẩu gạo nhiều hơn Thái Lan bao nhiêu triệu tấn? (làm tròn đến 1 chữ số thập phân)","answer":"0,5","explain":"6,2 trừ 5,7 bằng 0,5 triệu tấn.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Vai trò của ASEAN đối với Việt Nam là","options":["A. Tạo môi trường hòa bình, mở rộng thị trường và thu hút đầu tư.","B. Hạn chế phát triển.","C. Cô lập Việt Nam.","D. Không có vai trò gì."],"answer":"A","explain":"ASEAN tạo môi trường hòa bình, mở rộng thị trường, thu hút FDI và nâng cao vị thế của Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Thiên tai nào thường xuyên đe dọa Phi-lip-pin và Việt Nam?","options":["A. Bão nhiệt đới.","B. Động đất núi lửa ở mọi nơi.","C. Bão tuyết.","D. Hạn hán vĩnh viễn."],"answer":"A","explain":"Phi-lip-pin và Việt Nam ven biển Thái Bình Dương nên thường chịu bão nhiệt đới.","points":0.25},{"type":"mcq","level":"TH","q":"Dân cư Đông Nam Á phân bố","options":["A. Không đều, tập trung ở đồng bằng châu thổ và ven biển.","B. Rất đều khắp nơi.","C. Chỉ sống trên núi.","D. Chỉ sống trong rừng."],"answer":"A","explain":"Dân cư tập trung ở đồng bằng sông Hồng, sông Mê Công, đảo Gia-va, ven biển.","points":0.25},{"type":"mcq","level":"TH","q":"Kinh tế đối ngoại của Đông Nam Á hiện nay có đặc điểm","options":["A. Hội nhập sâu rộng, xuất khẩu hàng công nghiệp chế biến ngày càng tăng.","B. Đóng cửa với thế giới.","C. Chỉ xuất khẩu nguyên liệu thô.","D. Không có thương mại."],"answer":"A","explain":"Các nước Đông Nam Á hội nhập sâu, xuất khẩu hàng công nghiệp chế biến tăng nhanh.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: tỉ lệ tăng trưởng GDP (%) năm 2020: Việt Nam 2,9; Thái Lan -6,1; Ma-lai-xi-a -5,6; Xin-ga-po -5,4. Nhận xét nào sau đây đúng?","options":["A. Việt Nam là nước duy nhất tăng trưởng dương trong bảng năm 2020 (do kiểm soát tốt dịch COVID-19).","B. Mọi nước đều tăng trưởng dương.","C. Thái Lan tăng trưởng cao nhất.","D. Xin-ga-po tăng trưởng dương."],"answer":"A","explain":"Năm 2020, Việt Nam tăng 2,9% — hiếm hoi tăng trưởng dương nhờ kiểm soát dịch tốt.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao vị trí địa lí là lợi thế lớn nhất của Đông Nam Á?","options":["A. Vì nằm ở ngã tư đường hàng hải quốc tế, thuận lợi giao thương và thu hút đầu tư.","B. Vì có nhiều núi.","C. Vì khí hậu lạnh.","D. Vì xa các trung tâm kinh tế."],"answer":"A","explain":"Vị trí ngã tư đường giúp giao thương thuận lợi, thu hút đầu tư và phát triển dịch vụ cảng biển.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) ASEAN tạo môi trường hòa bình và mở rộng thị trường cho Việt Nam.","b) Bão nhiệt đới thường đe dọa Phi-lip-pin và Việt Nam.","c) Dân cư Đông Nam Á tập trung ở đồng bằng và ven biển.","d) Đông Nam Á hội nhập sâu vào kinh tế thế giới."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu tăng trưởng GDP năm 2020 ở trên. Xét tính đúng, sai:","statements":["a) Việt Nam là nước duy nhất tăng trưởng dương trong bảng.","b) Thái Lan tăng trưởng âm 6,1%.","c) Dịch COVID-19 đã ảnh hưởng nặng nề đến kinh tế khu vực.","d) Mọi nước trong bảng đều tăng trưởng dương."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chỉ Việt Nam tăng trưởng dương.","points":1},{"type":"short","level":"TH","q":"Thiên tai nào thường xuyên đe dọa các nước ven biển Đông Nam Á như Phi-lip-pin, Việt Nam?","answer":"Bão nhiệt đới","explain":"Bão nhiệt đới từ Thái Bình Dương thường xuyên đe dọa Phi-lip-pin, Việt Nam.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số l ượng tại một thời điểm.","points":0.25},{"type":"mcq","level":"VDC","q":"Thách thức lớn nhất của Cộng đồng Kinh tế ASEAN là","options":["A. Thu hẹp khoảng cách phát triển giữa các thành viên.","B. Thiếu nước thành viên.","C. Không có thương mại.","D. Các nước không muốn hợp tác."],"answer":"A","explain":"Chênh lệch trình độ phát triển (Xin-ga-po so với Lào, Cam-pu-chia...) là thách thức lớn nhất của liên kết kinh tế.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu diện tích ở trên. Xét tính đúng, sai:","statements":["a) In-đô-nê-xi-a có diện tích lớn nhất Đông Nam Á.","b) Việt Nam có diện tích nhỏ nhất bảng.","c) Mi-an-ma có diện tích lớn hơn Thái Lan.","d) Thái Lan có diện tích lớn nhất bảng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 1 905, 677, 513, 331. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu mật độ dân số ở trên. Xét tính đúng, sai:","statements":["a) Xin-ga-po có mật độ dân số cao nhất bảng.","b) Mật độ dân số chênh lệch rất lớn trong khu vực.","c) Lào có mật độ thấp nhất bảng.","d) Việt Nam có mật độ cao hơn Xin-ga-po."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Việt Nam 290 thấp hơn Xin-ga-po 8 300.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, nước nào có diện tích lớn nhất Đông Nam Á?","answer":"In-đô-nê-xi-a","explain":"In-đô-nê-xi-a có diện tích 1 905 nghìn km2, lớn nhất khu vực.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, mật độ dân số của Xin-ga-po (8 300 người/km2) gấp khoảng bao nhiêu lần Việt Nam (290 người/km2)? (làm tròn đến hàng đơn vị)","answer":"29","explain":"8 300 chia 290 bằng khoảng 28,6, làm tròn là 29 lần.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: sản lượng dầu cọ (triệu tấn) năm 2020: In-đô-nê-xi-a 44, Ma-lai-xi-a 19, Thái Lan 3. Nhận xét nào sau đây đúng?","options":["A. In-đô-nê-xi-a là nước sản xuất dầu cọ lớn nhất bảng.","B. Thái Lan sản xuất nhiều nhất.","C. Ma-lai-xi-a sản xuất ít nhất.","D. Ba nước sản xuất bằng nhau."],"answer":"A","explain":"In-đô-nê-xi-a 44 triệu tấn — lớn nhất bảng, cũng là lớn nhất thế giới.","points":0.25},{"type":"mcq","level":"VD","q":"Phi-lip-pin có thế mạnh về","options":["A. Xuất khẩu lao động và dịch vụ thuê ngoài.","B. Khai thác dầu mỏ.","C. Trồng lúa mì.","D. Chăn nuôi cừu."],"answer":"A","explain":"Phi-lip-pin nổi tiếng với xuất khẩu lao động và dịch vụ thuê ngoài (BPO).","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh nói: “Đông Nam Á chỉ có thế mạnh về nông nghiệp”. Ý kiến này","options":["A. Đúng hoàn toàn.","B. Chưa đúng vì khu vực còn mạnh về công nghiệp điện tử, dầu khí, dịch vụ tài chính, du lịch.","C. Sai hoàn toàn vì không có nông nghiệp.","D. Đúng vì không có ngành nào khác."],"answer":"B","explain":"Đông Nam Á đa dạng: điện tử, dầu khí, tài chính (Xin-ga-po), du lịch... bên cạnh nông nghiệp.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: khách du lịch quốc tế (triệu lượt) năm 2019: Thái Lan 40, Ma-lai-xi-a 26, Việt Nam 18, Xin-ga-po 19. Nước nào đón nhiều khách nhất?","options":["A. Thái Lan.","B. Ma-lai-xi-a.","C. Việt Nam.","D. Xin-ga-po."],"answer":"A","explain":"Thái Lan 40 triệu lượt — nhiều nhất bảng, là điểm đến du lịch hàng đầu khu vực.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện số khách du lịch quốc tế của các nước trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Biểu đồ tròn."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị giữa các đối tượng tại một thời điểm.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao du lịch là ngành kinh tế mũi nhọn của nhiều nước Đông Nam Á?","options":["A. Vì có tài nguyên du lịch phong phú (biển đảo, văn hóa) và chi phí hợp lí, thu hút khách quốc tế.","B. Vì không có ngành nào khác.","C. Vì du lịch không cần đầu tư.","D. Vì chỉ có khách nội địa."],"answer":"A","explain":"Biển đảo :"Đông Ti-mo","explain":"Đông Ti-mo thuộc Đông Nam Á nhưng chưa phải thành viên ASEAN.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, chênh lệch tỉ lệ dân thành thị giữa Xin-ga-po (100%) và Cam-pu-chia (24%) là bao nhiêu điểm phần trăm?","answer":"76","explain":"100 trừ 24 bằng 76 điểm phần trăm.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"5 nước sáng lập ASEAN là","options":["A. In-đô-nê-xi-a, Ma-lai-xi-a, Phi-lip-pin, Xin-ga-po, Thái Lan.","B. Việt Nam, Lào, Cam-pu-chia, Mi-an-ma, Bru-nây.","C. Trung Quốc, Nhật Bản, Hàn Quốc, Ấn Độ, Ô-xtrây-li-a.","D. Anh, Pháp, Đức, I-ta-li-a, Tây Ban Nha."],"answer":"A","explain":"5 nước sáng lập ASEAN (1967).","points":0.25},{"type":"mcq","level":"NB","q":"Cộng đồng ASEAN chính thức hình thành vào","options":["A. 31/12/2015.","B. 8/8/1967.","C. 28/7/1995.","D. 1/1/2020."],"answer":"A","explain":"Cộng đồng ASEAN chính thức hình thành ngày 31/12/2015.","points":0.25},{"type":"mcq","level":"NB","q":"Quốc gia nào có diện tích lớn nhất Đông Nam Á?","options":["A. In-đô-nê-xi-a.","B. Việt Nam.","C. Thái Lan.","D. Phi-lip-pin."],"answer":"A","explain":"In-đô-nê-xi-a có diện tích lớn nhất Đông Nam Á (1 905 nghìn km2).","points":0.25},{"type":"mcq","level":"NB","q":"Cây công nghiệp nào là thế mạnh của Ma-lai-xi-a và In-đô-nê-xi-a?","options":["A. Cọ dầu.","B. Bông.","C. Chè.","D. Mía đường."],"answer":"A","explain":"Cọ dầu là cây công nghiệp thế mạnh của Ma-lai-xi-a và In-đô-nê-xi-a.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: xuất khẩu điện tử (tỉ USD) năm 2020: Việt Nam 110, Ma-lai-xi-a 90, Thái Lan 60, Xin-ga-po 130. Nước nào xuất khẩu điện tử lớn nhất?","options":["A. Xin-ga-po.","B. Việt Nam.","C. Ma-lai-xi-a.","D. Thái Lan."],"answer":"A","explain":"Xin-ga-po 130 tỉ USD — lớn nhất bảng.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao nhiều tập đoàn điện tử chọn Đông Nam Á đặt nhà máy?","options":["A. Vì lao động dồi dào, chi phí hợp lí, vị tr
