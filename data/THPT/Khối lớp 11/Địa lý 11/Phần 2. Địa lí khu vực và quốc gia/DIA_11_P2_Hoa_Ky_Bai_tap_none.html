Kỳ tập trung phát triển các ngành","options":["A. Đòi hỏi nhiều tri thức khoa học như điện tử – tin học, hàng không – vũ trụ.","B. Khai thác thủ công.","C. Dệt may giá rẻ.","D. Chế biến gỗ thô."],"answer":"A","explain":"Hoa Kỳ chú trọng các ngành công nghệ cao, hàm lượng khoa học – kĩ thuật lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Nguồn lao động của Hoa Kỳ có đặc điểm","options":["A. Dồi dào, trình độ kĩ thuật cao, năng suất lao động lớn.","B. Thiếu hụt nghiêm trọng.","C. Trình độ thấp.","D. Không có lao động nhập cư."],"answer":"A","explain":"Lao động Hoa Kỳ có trình độ cao, năng suất thuộc hàng cao nhất thế giới.","points":0.25},{"type":"mcq","level":"TH","q":"Hoa Kỳ phát triển thương mại theo hướng","options":["A. Đa phương hóa, đa dạng hóa.","B. Chỉ buôn bán với một nước.","C. Đóng cửa thị trường.","D. Cấm xuất khẩu."],"answer":"A","explain":"Hoa Kỳ đa phương hóa, đa dạng hóa quan hệ thương mại với nhiều đối tác.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ đường thích hợp nhất để thể hiện","options":["A. Tốc độ tăng trưởng GDP của Hoa Kỳ giai đoạn 2000 – 2020.","B. Cơ cấu GDP năm 2020.","C. Dân số năm 2020.","D. Diện tích các bang."],"answer":"A","explain":"Biểu đồ đường thể hiện tốc độ tăng trưởng theo thời gian.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: trị giá xuất nhập khẩu của Hoa Kỳ (tỉ USD) năm 2020: xuất khẩu 2 149, nhập khẩu 2 776. Cán cân thương mại của Hoa Kỳ là","options":["A. Nhập siêu 627 tỉ USD.","B. Xuất siêu 627 tỉ USD.","C. Cân bằng.","D. Xuất siêu 2 776 tỉ USD."],"answer":"A","explain":"2 149 trừ 2 776 bằng âm 627 — nhập siêu 627 tỉ USD.","points":0.25},{"type":"mcq","level":"VD","q":"Trị giá nhập khẩu cao của Hoa Kỳ phản ánh","options":["A. Sức mua lớn và nhu cầu tiêu dùng cao của nền kinh tế, không có nghĩa sản xuất trong nước yếu kém.","B. Nền sản xuất trong nước sụp đổ.","C. Hoa Kỳ không sản xuất được gì.","D. Hoa Kỳ nghèo đi."],"answer":"A","explain":"Nhập siêu của Hoa Kỳ chủ yếu do sức tiêu dùng lớn và đồng đô la mạnh, không đồng nghĩa với sản xuất yếu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công nghiệp Hoa Kỳ tập trung vào các ngành công nghệ cao.","b) Lao động Hoa Kỳ có trình độ kĩ thuật cao.","c) Hoa Kỳ đa phương hóa thương mại.","d) Biểu đồ đường thích hợp để thể hiện tốc độ tăng trưởng theo thời gian."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu xuất nhập khẩu của Hoa Kỳ ở trên. Xét tính đúng, sai:","statements":["a) Hoa Kỳ nhập siêu 627 tỉ USD năm 2020.","b) Trị giá nhập khẩu lớn hơn xuất khẩu.","c) Nhập siêu chứng tỏ sức mua và tiêu dùng lớn.","d) Hoa Kỳ xuất siêu năm 2020."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 2 776 trừ 2 149 bằng 627. d) Sai: Hoa Kỳ nhập siêu.","points":1},{"type":"short","level":"TH","q":"Hoa Kỳ là nước xuất siêu hay nhập siêu?","answer":"nhập siêu","explain":"Trị giá nhập khẩu của Hoa Kỳ lớn hơn xuất khẩu nên là nước nhập siêu.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, tính cán cân thương mại của Hoa Kỳ năm 2020 (xuất khẩu trừ nhập khẩu, tỉ USD).","answer":"-627","explain":"2 149 trừ 2 776 bằng âm 627 tỉ USD (nhập siêu).","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Vì sao Hoa Kỳ thu hút được nhiều chất xám từ khắp thế giới?","options":["A. Vì có môi trường nghiên cứu, đãi ngộ tốt và nền kinh tế tri thức phát triển.","B. Vì cấp quốc tịch tự động.","C. Vì không cần trình độ.","D. Vì khí hậu đẹp."],"answer":"A","explain":"Môi trường nghiên cứu hàng đầu, đãi ngộ cao thu hút nhân tài toàn cầu.","points":0.25},{"type":"mcq","level":"TH","q":"Khí hậu của Hoa Kỳ có đặc điểm","options":["A. Đa dạng: ôn đới, cận nhiệt, hoang mạc, hàn đới.","B. Chỉ có khí hậu nhiệt đới.","C. Chỉ có khí hậu lạnh.","D. Đồng nhất khắp lãnh thổ."],"answer":"A","explain":"Lãnh thổ rộng lớn khiến khí hậu Hoa Kỳ rất đa dạng.","points":0.25},{"type":"mcq","level":"TH","q":"Khoáng sản nào sau đây KHÔNG phải là thế mạnh của Hoa Kỳ?","options":["A. Than, dầu mỏ, khí tự nhiên, quặng sắt, đồng.","B. Kim cương.","C. Vàng.","D. Than đá."],"answer":"B","explain":"Hoa Kỳ giàu than, dầu, khí, sắt, đồng, vàng...; kim cương không phải thế mạnh.","points":0.25},{"type":"mcq","level":"TH","q":"Đô thị nào sau đây là trung tâm kinh tế lớn nhất của Hoa Kỳ?","options":["A. Niu Y-oóc.","B. Anchorage.","C. Honolulu.","D. Juneau."],"answer":"A","explain":"Niu Y-oóc là trung tâm kinh tế, tài chính lớn nhất Hoa Kỳ.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: GDP/người (USD) năm 2020: Hoa Kỳ 63 000, Trung Quốc 10 000, Ấn Độ 2 000. Nhận xét nào sau đây đúng?","options":["A. GDP/người của Hoa Kỳ gấp 6,3 lần Trung Quốc.","B. Ấn Độ cao nhất bảng.","C. Trung Quốc cao hơn Hoa Kỳ.","D. Ba nước bằng nhau."],"answer":"A","explain":"63 000 chia 10 000 bằng 6,3 lần.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao vị trí địa lí là lợi thế lớn của Hoa Kỳ?","options":["A. Vì tiếp giáp hai đại dương, thuận lợi giao thương và ít bị chiến tranh tàn phá.","B. Vì nằm ở cực Bắc.","C. Vì không giáp biển.","D. Vì xa mọi trung tâm."],"answer":"A","explain":"Hai đại dương bao bọc vừa thuận giao thương vừa là lá chắn an ninh tự nhiên.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hoa Kỳ thu hút chất xám nhờ môi trường nghiên cứu và đãi ngộ tốt.","b) Khí hậu Hoa Kỳ rất đa dạng.","c) Hoa Kỳ giàu than, dầu mỏ, quặng sắt.","d) Niu Y-oóc là trung tâm kinh tế lớn nhất Hoa Kỳ."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu GDP/người ở trên. Xét tính đúng, sai:","statements":["a) Hoa Kỳ có GDP/người cao nhất bảng.","b) GDP/người của Hoa Kỳ gấp 6,3 lần Trung Quốc.","c) Ấn Độ có GDP/người thấp nhất bảng.","d) Trung Quốc có GDP/người cao hơn Hoa Kỳ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 63 000 chia 10 000 bằng 6,3. d) Sai.","points":1},{"type":"short","level":"TH","q":"Đô thị nào là trung tâm kinh tế lớn nhất của Hoa Kỳ?","answer":"Niu Y-oóc","explain":"Niu Y-oóc là trung tâm kinh tế, tài chính lớn nhất Hoa Kỳ.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, GDP/người của Hoa Kỳ (63 000 USD) gấp bao nhiêu lần Trung Quốc (10 000 USD)? (làm tròn đến 1 chữ số thập phân)","answer":"6,3","explain":"63 000 chia 10 000 bằng 6,3 lần.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: diện tích (triệu km2): Hoa Kỳ 9,8; Trung Quốc 9,6; Bra-xin 8,5. Nước nào có diện tích lớn nhất?","options":["A. Hoa Kỳ.","B. Trung Quốc.","C. Bra-xin.","D. Cả ba bằng nhau."],"answer":"A","explain":"Hoa Kỳ 9,8 triệu km² — lớn nhất bảng.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao đồng bằng Trung tâm là vùng nông nghiệp trù phú nhất Hoa Kỳ?","options":["A. Vì đất đai màu mỡ, địa hình bằng phẳng, khí hậu thuận lợi và sông Mi-xi-xi-pi cung cấp nước.","B. Vì có nhiều núi.","C. Vì khí hậu lạnh.","D. Vì không có sông."],"answer":"A","explain":"Đất đen màu mỡ, bằng phẳng cùng nguồn nước dồi dào tạo vùng nông nghiệp trù phú.","points":0.25},{"type":"mcq","level":"VDC","q":"Một doanh nghiệp muốn đầu tư vào công nghiệp hàng không – vũ trụ ở Hoa Kỳ. Bang nào sau đây có lợi thế nhất về truyền thống công nghiệp này?","options":["A. Texas và California (có các trung tâm vũ trụ, công nghiệp hàng không).","B. Alaska.","C. Hawaii.","D. Vermont."],"answer":"A","explain":"Texas (Houston – NASA) và California là trung tâm hàng không – vũ trụ của Hoa Kỳ.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: chi tiêu cho nghiên cứu và phát triển (tỉ USD) năm 2020: Hoa Kỳ 600, Trung Quốc 500, Nhật Bản 180. Nhận xét nào sau đây đúng?","options":["A. Hoa Kỳ dẫn đầu thế giới về đầu tư cho nghiên cứu và phát triển.","B. Nhật Bản dẫn đầu.","C. Trung Quốc không đầu tư.","D. Ba nước bằng nhau."],"answer":"A","explain":"Hoa Kỳ 600 tỉ USD — dẫn đầu, là cơ sở của nền kinh tế tri thức.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện chi tiêu nghiên cứu và phát triển của ba nước trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Biểu đồ tròn."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị giữa các đối tượng tại một thời điểm.","points":0.25},{"type":"mcq","level":"VDC","q":"Thách thức lớn nhất của kinh tế Hoa Kỳ hiện nay là","options":["A. Cạnh tranh gay gắt từ các nền kinh tế mới nổi, thâm hụt thương mại và nợ công lớn.","B. Thiếu tài nguyên.","C. Dân số quá ít.","D. Không có công nghệ."],"answer":"A","explain":"Hoa Kỳ đối mặt cạnh tranh từ Trung Quốc, thâm hụt thương mại và nợ công cao.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu diện tích ở trên. Xét tính đúng, sai:","statements":["a) Hoa Kỳ có diện tích lớn nhất bảng.","b) Bra-xin có diện tích nhỏ nhất bảng.","c) Trung Quốc có diện tích lớn hơn Bra-xin.","d) Hoa Kỳ có diện tích nhỏ hơn Trung Quốc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 9,8; 9,6; 8,5. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu chi tiêu nghiên cứu và phát triển ở trên. Xét tính đúng, sai:","statements":["a) Hoa Kỳ dẫn đầu về chi tiêu nghiên cứu và phát triển.","b) Chi tiêu của Hoa Kỳ gấp hơn 3 lần Nhật Bản.","c) Đầu tư nghiên cứu là cơ sở của kinh tế tri thức.","d) Trung Quốc chi nhiều hơn Hoa Kỳ."],"answer":["T","T","T","F"],"explain":"a) Đúng: 600 lớn nhất. b) Đúng: 600 chia 180 khoảng 3,3 lần. c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, nước nào có diện tích lớn nhất?","answer":"Hoa Kỳ","explain":"Hoa Kỳ 9,8 triệu km² — lớn nhất bảng.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, chi tiêu nghiên cứu và phát triển của Hoa Kỳ (600 tỉ USD) gấp khoảng bao nhiêu lần N  Trung tâm nằm ở phía tây Hoa Kỳ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đồng bằng Trung tâm nằm ở giữa lãnh thổ.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ lệ dân nhập cư ở trên. Xét tính đúng, sai:","statements":["a) Ô-xtrây-li-a có tỉ lệ dân nhập cư cao nhất bảng.","b) Hoa Kỳ có tỉ lệ thấp nhất bảng.","c) Ca-na-đa có tỉ lệ cao hơn Hoa Kỳ.","d) Hoa Kỳ có tỉ lệ dân nhập cư cao nhất."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 30, 21, 15. d) Sai.","points":1},{"type":"short","level":"NB","q":"Quốc gia nào ở phía nam giáp với Hoa Kỳ?","answer":"Mê-hi-cô","explain":"Phía nam Hoa Kỳ giáp Mê-hi-cô.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, tỉ lệ dân nhập cư của Ô-xtrây-li-a (30%) gấp bao nhiêu lần Hoa Kỳ (15%)?","answer":"2","explain":"30 chia 15 bằng 2 lần.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Ngành công nghiệp nào là thế mạnh hiện đại của Hoa Kỳ?","options":["A. Điện tử – tin học và hàng không – vũ trụ.","B. Dệt may thủ công.","C. Khai thác than củi.","D. Chế biến gỗ thô."],"answer":"A","explain":"Hoa Kỳ mạnh về các ngành công nghệ cao: điện tử – tin học, hàng không – vũ trụ.","points":0.25},{"type":"mcq","level":"NB","q":"Nông sản xuất khẩu nổi tiếng của Hoa Kỳ là","options":["A. Đậu tương, ngô, lúa mì.","B. Lúa nước.","C. Cà phê.","D. Cao su."],"answer":"A","explain":"Hoa Kỳ là nước xuất khẩu đậu tương, ngô, lúa mì hàng đầu thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Dân số Hoa Kỳ đứng thứ mấy thế giới?","options":["A. Thứ nhất.","B. Thứ hai.","C. Thứ ba.","D. Thứ tư."],"answer":"C","explain":"Hoa Kỳ đứng thứ 3 thế giới về dân số (sau Trung Quốc và Ấn Độ).","points":0.25},{"type":"mcq","level":"NB","q":"Quần đảo Ha-oai nằm ở đại dương nào?","options":["A. Thái Bình Dương.","B. Đại Tây Dương.","C. Ấn Độ Dương.","D. Bắc Băng Dương."],"answer":"A","explain":"Quần đảo Ha-oai nằm giữa Thái Bình Dương.","points":0.25}
