:"short","level":"TH","q":"Dựa vào bảng số liệu, GDP của Nhật Bản (5,0 nghìn tỉ USD) bằng bao nhiêu lần Đức (3,8 nghìn tỉ USD)? (làm tròn đến 1 chữ số thập phân)","answer":"1,3","explain":"5,0 chia 3,8 bằng khoảng 1,32, làm tròn là 1,3 lần.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Ngư trường lớn của Nhật Bản hình thành do","options":["A. Nơi gặp nhau của dòng nóng Ku-rô-si-ô và dòng lạnh Ôi-a-si-ô.","B. Nước biển mặn.","C. Gần xích đạo.","D. Không có dòng biển."],"answer":"A","explain":"Nơi gặp nhau của dòng nóng và dòng lạnh tạo ngư trường lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Thiên tai nào thường xuyên đe dọa Nhật Bản?","options":["A. Động đất, sóng thần.","B. Bão tuyết vùng cực.","C. Hạn hán kéo dài.","D. Lũ quét sa mạc."],"answer":"A","explain":"Nằm trên vành đai lửa TBD nên Nhật Bản thường xuyên động đất, sóng thần.","points":0.25},{"type":"mcq","level":"TH","q":"Tỉ lệ tự túc lương thực của Nhật Bản khoảng","options":["A. 40%.","B. 100%.","C. 90%.","D. 80%."],"answer":"A","explain":"Nhật Bản chỉ tự túc khoảng 40% lương thực, phải nhập khẩu nhiều.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ nào thích hợp nhất để thể hiện cơ cấu xuất khẩu của Nhật Bản năm 2020?","options":["A. Biểu đồ tròn.","B. Biểu đồ đường.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"A","explain":"Biểu đồ tròn thể hiện cơ cấu tại một thời điểm.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: tỉ lệ người trên 65 tuổi (%): Nhật Bản 28, I-ta-li-a 23, Đức 22, Hoa Kỳ 17 (năm 2020). Nhận xét nào sau đây đúng?","options":["A. Nhật Bản có tỉ lệ dân số già cao nhất bảng.","B. Hoa Kỳ cao nhất.","C. Đức cao nhất.","D. Bốn nước bằng nhau."],"answer":"A","explain":"Nhật Bản 28% — cao nhất bảng.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao Nhật Bản chú trọng phát triển rô-bốt?","options":["A. Vì dân số già, thiếu lao động nên cần tự động hóa sản xuất và chăm sóc người cao tuổi.","B. Vì thích chơi.","C. Vì không có công nhân.","D. Vì rẻ hơn thuê người hoàn toàn."],"answer":"A","explain":"Rô-bốt giúp bù đắp thiếu hụt lao động và chăm sóc người già.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ngư trường Nhật Bản hình thành do gặp nhau của hai dòng biển nóng, lạnh.","b) Động đất, sóng thần thường xuyên đe dọa Nhật Bản.","c) Tỉ lệ tự túc lương thực của Nhật Bản khoảng 40%.","d) Biểu đồ tròn thích hợp để thể hiện cơ cấu."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu tỉ lệ người trên 65 tuổi ở trên. Xét tính đúng, sai:","statements":["a) Nhật Bản có tỉ lệ cao nhất bảng.","b) I-ta-li-a cao hơn Đức.","c) Hoa Kỳ có tỉ lệ thấp nhất bảng.","d) Hoa Kỳ có tỉ lệ cao hơn Nhật Bản."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 28, 23, 22, 17. d) Sai.","points":1},{"type":"short","level":"TH","q":"Dòng biển nóng chảy ven bờ đông Nhật Bản có tên là gì?","answer":"Ku-rô-si-ô","explain":"Dòng nóng Ku-rô-si-ô gặp dòng lạnh Ôi-a-si-ô tạo ngư trường lớn.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, tỉ lệ người trên 65 tuổi của Nhật Bản (28%) cao hơn Hoa Kỳ (17%) bao nhiêu điểm phần trăm?","answer":"11","explain":"28 trừ 17 bằng 11 điểm phần trăm.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"TH","q":"Nhật Bản xuất khẩu chủ yếu","options":["A. Ô tô, máy móc, sản phẩm điện tử.","B. Dầu mỏ, khí đốt.","C. Lúa gạo, cà phê.","D. Quặng sắt, than đá."],"answer":"A","explain":"Nhật Bản xuất khẩu sản phẩm công nghiệp công nghệ cao.","points":0.25},{"type":"mcq","level":"TH","q":"Nhật Bản nhập khẩu chủ yếu","options":["A. Nguyên, nhiên liệu và lương thực.","B. Ô tô, điện tử.","C. Rô-bốt.","D. Tàu biển."],"answer":"A","explain":"Nghèo tài nguyên nên Nhật Bản phải nhập khẩu nguyên, nhiên liệu và lương thực.","points":0.25},{"type":"mcq","level":"TH","q":"Đồng bằng lớn nhất của Nhật Bản là","options":["A. Can-tô.","B. Hoa Bắc.","C. Mê Công.","D. La Pla-ta."],"answer":"A","explain":"Đồng bằng Can-tô trên đảo Hôn-su là đồng bằng lớn nhất Nhật Bản.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu đồ đường thích hợp nhất để thể hiện","options":["A. Dân số Nhật Bản giai đoạn 2000 – 2020.","B. Cơ cấu GDP năm 2020.","C. Diện tích các đảo.","D. Số lượng núi lửa."],"answer":"A","explain":"Biểu đồ đường thể hiện sự biến động theo thời gian.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: sản lượng đánh bắt hải sản (triệu tấn): Nhật Bản 4, Trung Quốc 15, In-đô-nê-xi-a 7 (năm 2020). Nhận xét nào sau đây đúng?","options":["A. Trung Quốc đánh bắt nhiều nhất bảng.","B. Nhật Bản nhiều nhất.","C. In-đô-nê-xi-a ít nhất.","D. Cả ba bằng nhau."],"answer":"A","explain":"Trung Quốc 15 triệu tấn — nhiều nhất bảng.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao Nhật Bản đầu tư nhiều ra nước ngoài?","options":["A. Vì trong nước thiếu tài nguyên, đất chật, cần mở rộng thị trường và nguồn nguyên liệu.","B. Vì thừa tiền.","C. Vì không có công nghiệp trong nước.","D. Vì bị ép buộc."],"answer":"A","explain":"Đầu tư ra nước ngoài giúp Nhật Bản đảm bảo nguyên liệu và mở rộng thị trường.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhật Bản xuất khẩu ô tô, điện tử.","b) Nhật Bản nhập khẩu nguyên, nhiên liệu.","c) Đồng bằng Can-tô là đồng bằng lớn nhất Nhật Bản.","d) Biểu đồ đường thích hợp để thể hiện dân số theo thời gian."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu đánh bắt hải sản ở trên. Xét tính đúng, sai:","statements":["a) Trung Quốc đánh bắt nhiều nhất bảng.","b) In-đô-nê-xi-a đánh bắt nhiều hơn Nhật Bản.","c) Nhật Bản đánh bắt ít nhất bảng.","d) Nhật Bản đánh bắt nhiều hơn Trung Quốc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 15, 7, 4. d) Sai.","points":1},{"type":"short","level":"TH","q":"Đồng bằng lớn nhất của Nhật Bản, nơi đặt thủ đô Tô-ky-ô có tên là gì?","answer":"Can-tô","explain":"Đồng bằng Can-tô là đồng bằng lớn nhất Nhật Bản.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, Trung Quốc đánh bắt hải sản nhiều hơn Nhật Bản bao nhiêu triệu tấn?","answer":"11","explain":"15 trừ 4 bằng 11 triệu tấn.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Khí hậu của Nhật Bản có đặc điểm","options":["A. Ôn đới gió mùa, 4 mùa rõ rệt, mưa nhiều.","B. Xích đạo nóng ẩm quanh năm.","C. Hoang mạc khô hạn.","D. Hàn đới lạnh giá."],"answer":"A","explain":"Nhật Bản có khí hậu ôn đới gió mùa và cận nhiệt đới, 4 mùa rõ rệt.","points":0.25},{"type":"mcq","level":"TH","q":"Người Nhật Bản nổi tiếng với đức tính","options":["A. Cần cù, kỉ luật, trách nhiệm cao.","B. Lười biếng.","C. Thiếu trung thực.","D. Không coi trọng công việc."],"answer":"A","explain":"Người Nhật nổi tiếng cần cù, kỉ luật và có tinh thần trách nhiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Dân cư Nhật Bản tập trung chủ yếu ở","options":["A. Các đồng bằng ven biển Thái Bình Dương.","B. Vùng núi cao.","C. Đảo Hô-cai-đô.","D. Vùng sa mạc."],"answer":"A","explain":"Dân cư tập trung ở các đồng bằng ven biển TBD (vùng Can-tô, Can-xai...).","points":0.25},{"type":"mcq","level":"TH","q":"Ngành dịch vụ của Nhật Bản chiếm khoảng","options":["A. 70% GDP.","B. 10% GDP.","C. 30% GDP.","D. 100% GDP."],"answer":"A","explain":"Dịch vụ chiếm khoảng 70% GDP của Nhật Bản.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu: tuổi thọ trung bình (tuổi): Nhật Bản 84, Thụy Sĩ 83, Tây Ban Nha 83, Hoa Kỳ 79 (năm 2020). Nhận xét nào sau đây đúng?","options":["A. Nhật Bản có tuổi thọ cao nhất bảng.","B. Hoa Kỳ cao nhất.","C. Thụy Sĩ thấp nhất.","D. Bốn nước bằng nhau."],"answer":"A","explain":"Nhật Bản 84 tuổi — cao nhất bảng.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao Nhật Bản có thể trở thành cường quốc kinh tế dù nghèo tài nguyên?","options":["A. Nhờ con người cần cù, sáng tạo, khoa học – công nghệ phát triển và chiến lược đúng đắn.","B. Nhờ tài nguyên phong phú.","C. Nhờ dân số đông.","D. Nhờ may mắn."],"answer":"A","explain":"Con người và khoa học – công nghệ là chìa khóa thành công của Nhật Bản.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khí hậu Nhật Bản ôn đới gió mùa, 4 mùa rõ rệt.","b) Người Nhật nổi tiếng cần cù, kỉ luật.","c) Dân cư tập trung ở đồng bằng ven biển TBD.","d) Dịch vụ chiếm khoảng 70% GDP của Nhật Bản."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu tuổi thọ ở trên. Xét tính đúng, sai:","statements":["a) Nhật Bản có tuổi thọ cao nhất bảng.","b) Thụy Sĩ và Tây Ban Nha có tuổi thọ bằng nhau.","c) Hoa Kỳ có tuổi thọ thấp nhất bảng.","d) Thụy Sĩ có tuổi thọ cao hơn Nhật Bản."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 84, 83, 83, 79. d) Sai.","points":1},{"type":"short","level":"TH","q":"Nhật Bản nghèo loại tài nguyên nào nên phải nhập khẩu phần lớn nguyên, nhiên liệu?","answer":"khoáng sản","explain":"Nhật Bản nghèo khoáng sản nên phải nhập khẩu nguyên, nhiên liệu.","points":0.5},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, tuổi thọ trung bình của Nhật Bản (84 tuổi) cao hơn Hoa Kỳ (79 tuổi) bao nhiêu tuổi?","answer":"5","explain":"84 trừ 79 bằng 5 tuổi.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: số trận động đất mạnh (từ 6 độ richter trở lên) trung bình mỗi năm: Nhật Bản 15, Phi-li-pin 12, In-đô-nê-xi-a 20. Nhận xét nào sau đây đúng?","options":["A. In-đô-nê-xi-a có số trận động đất mạnh nhiều nhất bảng.","B. Nhật Bản nhiều nhất.","C. Phi-li-pin nhiều nhất.","D. Cả ba bằng nhau."],"answer":"A","explain":"In-đô-nê-xi-a 20 trận — nhiều nhất bảng; cả ba đều nằm trên vành đai lửa TBD.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao Nhật Bản có hệ thống cảnh báo sóng thần hiện đại nhất thế giới?","options":["A. Vì thường xuyên chịu động đất, sóng thần nên phải đầu tư phòng tránh thiên tai.","B. Vì thích công nghệ.","C. Vì không có thiên tai.","D. Vì được nước khác tặng."],"answer":"A","explain":"Thiên tai thường xuyên buộc Nhật Bản phát triển công nghệ phòng tránh hàng đầu.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty Việt Nam muốn nhập khẩu rô-bốt công nghiệp. Nước nào sau đây là lựa chọn hợp lí nhất?","options":["A. Nhật Bản.","B. Lào.","C. Mông Cổ.","D. Nê-pan."],"answer":"A","explain":"Nhật Bản là cường quốc rô-bốt hàng đầu thế giới.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: tỉ lệ sinh (trẻ/1000 dân): Nhật Bản 7, Ni-giê 46, Ấn Độ 18, Hoa Kỳ 11 (năm 2020). Nhận xét nào sau đây đúng?","options":["A. Nhật Bản có tỉ lệ sinh thấp nhất bảng.","B. Hoa Kỳ thấp nhất.","C. Ấn Độ cao nhất.","D. Nhật Bản cao nhất."],"answer":"A","explain":"Nhật Bản 7 — thấp nhất bảng, nguyên nhân dân số già và giảm.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện tỉ lệ sinh của các nước trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ đường.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Biểu đồ tròn."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị giữa các đối tượng.","points":0.25},{"type":"mcq","level":"VDC","q":"Giải pháp nào giúp Nhật Bản khắc phục thiếu hụt lao động do dân số già?","options":["A. Tự động hóa, rô-bốt hóa và thu hút lao động nước ngoài.","B. Cấm người già làm việc.","C. Giảm tuổi nghỉ hưu.","D. Không cần giải pháp."],"answer":"A","explain":"Nhật Bản đẩy mạnh rô-bốt hóa và tiếp nhận lao động nước ngoài (trong đó có Việt Nam).","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu động đất ở trên. Xét tính đúng, sai:","statements":["a) In-đô-nê-xi-a có số trận động đất mạnh nhiều nhất bảng.","b) Nhật Bản có nhiều hơn Phi-li-pin.","c) Cả ba nước đều nằm trên vành đai lửa TBD.","d) Phi-li-pin có số trận nhiều nhất bảng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 20, 15, 12. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu tỉ lệ sinh ở trên. Xét tính đúng, sai:","statements":["a) Nhật Bản có tỉ lệ sinh thấp nhất bảng.","b) Ni-giê có tỉ lệ sinh cao nhất bảng.","c) Ấn Độ có tỉ lệ sinh cao hơn Hoa Kỳ.","d) Nhật Bản có tỉ lệ sinh cao hơn Ni-giê."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 7, 46, 18, 11. d) Sai.","points":1},{"type":"short","level":"VD","q":"Dựa vào bảng số liệu, nước nào có số trận động đất mạnh trung bình mỗi năm nhiều nhất?","answer":"In-đô-nê-xi-a","explain":"In-đô-nê-xi-a có 20 trận/năm, nhiều nhất bảng.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, tỉ lệ sinh của Ni-giê (46) gấp khoảng bao nhiêu lần Nhật Bản (7)? (làm tròn số nguyên)","answer":"7","explain":"46 chia 7 bằng khoảng 6,6, làm tròn là 7 lần.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VD","q":"Cho bảng số liệu: kim ngạch xuất khẩu ô tô (tỉ USD) năm 2020: Nhật Bản 90, Đức 140, Hàn Quốc 40. Nước nào xuất khẩu ô tô nhiều nhất?","options":["A. Đức.","B. Nhật Bản.","C. Hàn Quốc.","D. Cả ba bằng nhau."],"answer":"A","explain":"Đức 140 tỉ USD — xuất khẩu ô tô nhiều nhất bảng.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao ô tô Nhật Bản được ưa chuộng trên thế giới?","options":["A. Vì bền, tiết kiệm nhiên liệu và giá cả cạnh tranh.","B. Vì rẻ nhất.","C. Vì to nhất.","D. Vì chạy nhanh nhất."],"answer":"A","explain":"Ô tô Nhật nổi tiếng bền bỉ, tiết kiệm nhiên liệu (Toyota, Honda...).","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh nói: “Nhật Bản nghèo tài nguyên nên không thể giàu”. Ý kiến này","options":["A. Đúng.","B. Sai vì Nhật Bản đã chứng minh con người, khoa học – công nghệ có thể bù đắp thiếu hụt tài nguyên.","C. Đúng một nửa.","D. Không thể kết luận."],"answer":"B","explain":"Nhật Bản là minh chứng: phát triển dựa vào con người và công nghệ.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu: chi tiêu cho nghiên cứu và phát triển (% GDP): Nhật Bản 3,3; Hàn Quốc 4,5; Hoa Kỳ 3,1; Việt Nam 0,5 (năm 2020). Nhận xét nào sau đây đúng?","options":["A. Hàn Quốc chi nhiều nhất bảng.","B. Việt Nam chi nhiều nhất.","C. Hoa Kỳ chi ít nhất.","D. Nhật Bản chi ít nhất."],"answer":"A","explain":"Hàn Quốc 4,5% — cao nhất bảng; Việt Nam 0,5% thấp nhất.","points":0.25},{"type":"mcq","level":"VDC","q":"Bài học cho Việt Nam từ mô hình phát triển của Nhật Bản là","options":["A. Đầu tư vào con người, giáo dục và khoa học – công nghệ.","B. Chỉ khai thác tài nguyên.","C. Không cần học tập.","D. Phụ thuộc hoàn toàn vào nước ngoài."],"answer":"A","explain":"Nhật Bản thành công nhờ đầu tư vào con người và công nghệ — bài học quý cho Việt Nam.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thể hiện chi tiêu cho nghiên cứu và phát triển của các nước trong bảng trên, biểu đồ thích hợp nhất là","options":["A. Biểu đồ tròn.","B. Biểu đồ cột.","C. Biểu đồ miền.","D. Lược đồ."],"answer":"B","explain":"Biểu đồ cột so sánh giá trị giữa các đối tượng.","points":0.25},{"type":"truefalse","level":"VD","q":"Dựa vào bảng số liệu xuất khẩu ô tô ở trên. Xét tính đúng, sai:","statements":["a) Đức xuất khẩu ô tô nhiều nhất bảng.","b) Nhật Bản xuất khẩu nhiều hơn Hàn Quốc.","c) Hàn Quốc xuất khẩu ít nhất bảng.","d) Nhật Bản xuất khẩu nhiều hơn Đức."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 140, 90, 40. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu chi tiêu cho nghiên cứu – phát triển ở trên. Xét tính đúng, sai:","statements":["a) Hàn Quốc chi cho nghiên cứu – phát triển nhiều nhất bảng.","b) Nhật Bản chi nhiều hơn Hoa Kỳ.","c) Việt Nam chi ít nhất bảng.","d) Hoa Kỳ chi nhiều hơn Hàn Quốc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 4,5; 3,3; 3,1; 0,5. d) Sai.","points":1},{"type":"short","level":"VD","q":"Nước nào xuất khẩu ô tô nhiều nhất trong bảng số liệu trên?","answer":"Đức","e ain":"Hoa anh đào nở vào mùa xuân; núi Phú Sĩ nằm trên đảo Hôn-su.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhật Bản giáp Thái Bình Dương.","b) Hô-cai-đô là đảo ở phía bắc nhất.","c) Công nghiệp giữ vai trò then chốt trong xuất khẩu của Nhật Bản.","d) Nhật Bản đánh bắt hải sản phát triển nhờ ngư trường lớn."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Dựa vào bảng số liệu mật độ dân số ở trên. Xét tính đúng, sai:","statements":["a) Nhật Bản có mật độ dân số cao nhất bảng.","b) Việt Nam có mật độ cao hơn Hoa Kỳ.","c) Nga có mật độ thấp nhất bảng.","d) Nga có mật độ cao hơn Nhật Bản."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: 334, 314, 36, 9. d) Sai.","points":1},{"type":"short","level":"NB","q":"Đảo lớn ở phía bắc nhất của Nhật Bản có tên là gì?","answer":"Hô-cai-đô","explain":"Hô-cai-đô là đảo ở phía bắc nhất của Nhật Bản.","points":0.5},{"type":"short","level":"VDC","q":"Dựa vào bảng số liệu, mật độ dân số của Nhật Bản (334 người/km2) gấp khoảng bao nhiêu lần Nga (9 người/km2)? (làm tròn số nguyên)","answer":"37","explain":"334 chia 9 bằng khoảng 37,1, làm tròn là 37 lần.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Vành đai lửa Thái Bình Dương gây ra thiên tai nào ở Nhật Bản?","options":["A. Động đất, núi lửa.","B. Bão cát.","C. Hạn hán.","D. Lốc xoáy sa mạc."],"answer":"A","explain":"Vành đai lửa gây động đất, núi lửa, sóng thần ở Nhật Bản.","points":0.25},{"type":"mcq","level":"NB","q":"Dân tộc chiếm đa số tuyệt đối ở Nhật Bản là","options":["A. Người Nhật.","B. Người Hoa.","C. Người Hàn.","D. Người Việt."],"answer":"A","explain":"Nhật Bản có cơ cấu dân tộc đồng nhất, người Nhật chiếm tuyệt đại đa số.","points":0.25},{"type":"mcq","level":"NB","q":"Nhật Bản đầu tư ra nước ngoài rất lớn, trong đó có","options":["A. Việt Nam.","B. Nam Cực.","C. Bắc Cực.","D. Mặt Trăng."]
