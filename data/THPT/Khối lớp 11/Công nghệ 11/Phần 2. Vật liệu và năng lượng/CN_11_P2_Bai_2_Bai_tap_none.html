{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Chất dẻo (nhựa) là","options":["A. vật liệu hữu cơ tổng hợp có tính dẻo, dễ tạo hình","B. hợp kim của sắt và cacbon","C. vật liệu vô cơ nung ở nhiệt độ cao","D. kim loại màu"],"answer":"A","explain":"Chất dẻo là vật liệu hữu cơ tổng hợp có tính dẻo, dễ tạo hình.","points":0.25},{"type":"mcq","level":"NB","q":"Nhựa nhiệt dẻo có đặc điểm","options":["A. nung nóng thì mềm, làm nguội cứng lại, tái chế được","B. đóng rắn vĩnh viễn, không nung mềm lại được","C. rất giòn, dễ vỡ","D. dẫn điện tốt"],"answer":"A","explain":"Nhựa nhiệt dẻo nung nóng thì mềm, làm nguội thì cứng lại nên tái chế được nhiều lần.","points":0.25},{"type":"mcq","level":"NB","q":"Nhựa nhiệt rắn có đặc điểm","options":["A. sau khi đóng rắn không mềm lại khi nung nóng","B. tái chế được nhiều lần","C. nung nóng thì chảy ra","D. nhẹ hơn không khí"],"answer":"A","explain":"Nhựa nhiệt rắn sau khi đóng rắn thì không mềm lại khi nung nóng; cứng và chịu nhiệt tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Ổ cắm điện thường làm bằng nhựa nhiệt rắn (Bakelite) vì","options":["A. cứng, chịu nhiệt tốt, cách điện","B. tái chế được","C. mềm dẻo","D. trong suốt"],"answer":"A","explain":"Ổ cắm điện cần cách điện, cứng, chịu nhiệt: nhựa nhiệt rắn (Bakelite) đáp ứng tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Chai nhựa, ống nước PVC thuộc loại","options":["A. nhựa nhiệt dẻo","B. nhựa nhiệt rắn","C. cao su","D. gốm sứ"],"answer":"A","explain":"Chai nhựa (PE), ống nước PVC là nhựa nhiệt dẻo, tái chế được.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty muốn sản xuất chai nhựa có thể tái chế. Nên chọn loại nhựa nào?","options":["A. Nhựa nhiệt dẻo","B. Nhựa nhiệt rắn","C. Cao su lưu hóa","D. Gốm sứ"],"answer":"A","explain":"Chỉ nhựa nhiệt dẻo mới nung mềm lại được nên tái chế được; nhựa nhiệt rắn không tái chế bằng cách nung lại.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về chất dẻo:","statements":["a) Nhựa nhiệt dẻo tái chế được nhiều lần.","b) Nhựa nhiệt rắn không mềm lại khi nung nóng.","c) Chất dẻo nhẹ, cách điện tốt, chống ăn mòn.","d) Mọi loại chất dẻo đều cứng hơn thép."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chất dẻo thường có độ bền, độ cứng thấp hơn kim loại.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về lựa chọn nhựa:","statements":["a) Làm chai lọ dùng một lần nên chọn nhựa nhiệt dẻo.","b) Làm ổ cắm điện nên chọn nhựa nhiệt rắn.","c) Nhựa nhiệt rắn tái chế bằng cách nung chảy như nhựa nhiệt dẻo.","d) Tay cầm nồi chống nóng thường làm bằng nhựa nhiệt rắn."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: nhựa nhiệt rắn không nung mềm lại được nên không tái chế bằng cách nung chảy.","points":1},{"type":"short","level":"VDC","q":"Nêu điểm khác nhau cơ bản giữa nhựa nhiệt dẻo và nhựa nhiệt rắn.","answer":"Nhiệt dẻo nung mềm lại được (tái chế được), nhiệt rắn đóng rắn vĩnh viễn","explain":"Nhựa nhiệt dẻo nung nóng thì mềm, nguội thì cứng lại nên tái chế được; nhựa nhiệt rắn sau khi đóng rắn không mềm lại khi nung nóng.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao rác thải nhựa là vấn đề môi trường nghiêm trọng?","answer":"Vì nhựa khó phân hủy trong tự nhiên, tồn tại hàng trăm năm","explain":"Chất dẻo rất khó phân hủy sinh học, tồn tại hàng trăm năm trong môi trường, gây ô nhiễm đất, nước và đại dương.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Cao su tự nhiên lấy từ","options":["A. mủ cây cao su","B. dầu mỏ","C. than đá","D. quặng sắt"],"answer":"A","explain":"Cao su tự nhiên lấy từ mủ cây cao su.","points":0.25},{"type":"mcq","level":"NB","q":"Tính chất nổi bật nhất của cao su là","options":["A. đàn hồi cao","B. độ cứng rất cao","C. dẫn điện tốt","D. chịu nhiệt trên 1000°C"],"answer":"A","explain":"Cao su có tính đàn hồi cao, chịu mài mòn, cách điện, chống thấm nước.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu composite được tạo thành từ","options":["A. hai hay nhiều vật liệu thành phần kết hợp với nhau","B. một kim loại nguyên chất","C. nhựa nguyên sinh","D. gốm nung"],"answer":"A","explain":"Composite là vật liệu tạo thành từ hai hay nhiều vật liệu thành phần kết hợp, phát huy ưu điểm mỗi loại.","points":0.25},{"type":"mcq","level":"TH","q":"Trong vật liệu composite, vật liệu nền (nhựa) có nhiệm vụ","options":["A. liên kết, bao bọc vật liệu cốt","B. chịu lực chính","C. tạo màu sắc","D. dẫn điện"],"answer":"A","explain":"Vật liệu nền (thường là nhựa) liên kết, bao bọc vật liệu cốt; vật liệu cốt (sợi) chịu lực chính.","points":0.25},{"type":"mcq","level":"TH","q":"Trong vật liệu composite, vật liệu cốt (sợi thủy tinh, sợi cacbon) có nhiệm vụ","options":["A. chịu lực chính","B. liên kết các sợi","C. chống thấm nước","D. tạo độ bóng"],"answer":"A","explain":"Vật liệu cốt dạng sợi (thủy tinh, cacbon) có độ bền cao, chịu lực chính trong composite.","points":0.25},{"type":"mcq","level":"VD","q":"Vỏ tàu thuyền, thân xe đua thường làm bằng composite vì","options":["A. nhẹ, bền cao, chống ăn mòn tốt","B. rẻ nhất trong mọi vật liệu","C. dẫn điện tốt","D. dễ hàn"],"answer":"A","explain":"Composite nhẹ mà bền cao, chống ăn mòn tốt nên phù hợp làm vỏ tàu, thân xe đua, cánh máy bay.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về cao su:","statements":["a) Cao su tự nhiên lấy từ mủ cây cao su.","b) Cao su nhân tạo chế tạo từ dầu mỏ.","c) Cao su đàn hồi cao, dùng làm lốp xe.","d) Cao su dẫn điện tốt nên làm dây điện."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cao su cách điện, không dẫn điện.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về composite: (1):","statements":["a) Composite gồm vật liệu nền và vật liệu cốt.","b) Vật liệu cốt chịu lực chính.","c) Composite nhẹ mà bền cao.","d) Composite là kim loại nguyên chất."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: composite là vật liệu tổ hợp từ nhiều thành phần, không phải kim loại nguyên chất.","points":1},{"type":"short","level":"VDC","q":"Kể tên hai ứng dụng của vật liệu composite trong giao thông vận tải.","answer":"Vỏ tàu thuyền, thân xe đua (cánh máy bay)","explain":"Composite nhẹ, bền, chống ăn mòn nên dùng làm vỏ tàu thuyền, thân xe đua, cánh máy bay, khung xe đạp cao cấp.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao lốp xe được làm bằng cao su mà không làm bằng nhựa cứng?","answer":"Vì cao su đàn hồi, chịu mài mòn, bám đường tốt","explain":"Lốp xe cần đàn hồi để giảm xóc, chịu mài mòn khi lăn và bám đường: cao su đáp ứng tốt hơn nhựa cứng.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Gốm sứ kỹ thuật có tính chất","options":["A. cứng rất cao, chịu nhiệt tốt nhưng giòn","B. dẻo, dễ uốn","C. dẫn điện tốt","D. nhẹ như xốp"],"answer":"A","explain":"Gốm sứ kỹ thuật cứng rất cao, chịu nhiệt tốt, chống ăn mòn nhưng giòn.","points":0.25},{"type":"mcq","level":"NB","q":"Hợp kim nhớ hình có đặc điểm","options":["A. bị biến dạng nhưng tự trở lại hình dạng ban đầu khi nung nóng","B. không bao giờ biến dạng","C. tan chảy ở nhiệt độ thường","D. nhẹ hơn không khí"],"answer":"A","explain":"Hợp kim nhớ hình bị biến dạng nhưng tự trở lại hình dạng ban đầu khi được nung nóng.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu nano có đặc điểm","options":["A. cấu trúc siêu nhỏ cỡ nanomet, tính chất vượt trội","B. khối lượng rất lớn","C. chỉ tồn tại trong phòng thí nghiệm","D. không có ứng dụng thực tế"],"answer":"A","explain":"Vật liệu nano có cấu trúc siêu nhỏ (cỡ nanomet) nên có tính chất vượt trội, ứng dụng trong sơn, pin, y học.","points":0.25},{"type":"mcq","level":"TH","q":"Dao cắt gốm (dao sứ) sắc bén lâu vì gốm","options":["A. có độ cứng rất cao","B. rất dẻo","C. dẫn nhiệt tốt","D. nhẹ"],"answer":"A","explain":"Gốm kỹ thuật có độ cứng rất cao nên dao cắt gốm giữ được lưỡi sắc lâu.","points":0.25},{"type":"mcq","level":"TH","q":"Gioăng đệm (ron) làm kín trong máy móc thường làm bằng cao su vì","options":["A. đàn hồi, biến dạng để làm kín khe hở","B. cứng như thép","C. dẫn nhiệt tốt","D. trong suốt"],"answer":"A","explain":"Gioăng cần đàn hồi để biến dạng, lấp kín khe hở, chống rò rỉ: cao su phù hợp.","points":0.25},{"type":"mcq","level":"VD","q":"Khung kính mắt dùng hợp kim nhớ hình có lợi ích gì?","options":["A. bị bẻ cong vẫn tự trở lại hình dạng ban đầu khi nung nóng","B. không bao giờ gãy","C. nhẹ hơn nhựa","D. rẻ hơn mọi vật liệu"],"answer":"A","explain":"Hợp kim nhớ hình giúp gọng kính bị biến dạng có thể phục hồi hình dạng ban đầu khi nung nóng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về gốm sứ kỹ thuật:","statements":["a) Gốm sứ kỹ thuật cứng rất cao.","b) Gốm sứ kỹ thuật chịu nhiệt tốt.","c) Gốm sứ kỹ thuật rất dẻo.","d) Gốm sứ kỹ thuật dùng làm sứ cách điện."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: gốm sứ kỹ thuật giòn, không dẻo.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về vật liệu mới: (1):","statements":["a) Hợp kim nhớ hình tự phục hồi hình dạng khi nung nóng.","b) Vật liệu nano có cấu trúc siêu nhỏ.","c) Vật liệu composite nhẹ mà bền cao.","d) Vật liệu mới không có ứng dụng thực tế."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: vật liệu mới đã được ứng dụng rộng rãi (y tế, hàng không, thể thao...).","points":1},{"type":"short","level":"VDC","q":"Nêu một ứng dụng của vật liệu nano trong đời sống.","answer":"Sơn tự làm sạch (pin mặt trời, y học)","explain":"Vật liệu nano ứng dụng làm sơn tự làm sạch, pin hiệu suất cao, thuốc trong y học...","points":0.5},{"type":"short","level":"VDC","q":"Vì sao sứ được dùng làm vật liệu cách điện trên đường dây cao thế?","answer":"Vì sứ cách điện tốt, cứng, chịu được môi trường ngoài trời","explain":"Sứ cách điện tốt, cứng, bền với thời tiết nên dùng làm chuỗi sứ cách điện trên đường dây cao thế.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Vật liệu phi kim loại gồm","options":["A. chất dẻo, cao su, gốm sứ...","B. gang, thép","C. đồng, nhôm","D. inox, titan"],"answer":"A","explain":"Vật liệu phi kim loại gồm chất dẻo, cao su, gốm sứ...","points":0.25},{"type":"mcq","level":"NB","q":"Ưu điểm chung của chất dẻo so với kim loại là","options":["A. nhẹ, cách điện, chống ăn mòn, giá thành thấp","B. cứng hơn","C. bền hơn","D. chịu nhiệt cao hơn"],"answer":"A","explain":"Chất dẻo nhẹ, cách điện tốt, chống ăn mòn, dễ gia công, giá thành thấp.","points":0.25},{"type":"mcq","level":"NB","q":"Nhược điểm của chất dẻo so với kim loại là","options":["A. độ bền, độ cứng thấp hơn","B. nặng hơn","C. dẫn điện","D. khó tạo hình"],"answer":"A","explain":"Chất dẻo có độ bền, độ cứng thấp hơn kim loại; một số loại khó phân hủy gây ô nhiễm.","points":0.25},{"type":"mcq","level":"TH","q":"Ống nước trong nhà thường làm bằng nhựa PVC vì","options":["A. chống ăn mòn, nhẹ, giá rẻ, dễ lắp đặt","B. cứng như thép","C. dẫn nhiệt tốt","D. chịu được lửa"],"answer":"A","explain":"Ống nước PVC chống ăn mòn, nhẹ, giá rẻ, dễ cắt nối, phù hợp cho hệ thống nước sinh hoạt.","points":0.25},{"type":"mcq","level":"TH","q":"Vợt tennis, gậy golf cao cấp làm bằng composite sợi cacbon vì","options":["A. nhẹ mà bền, cứng, đàn hồi tốt","B. rẻ tiền","C. dẫn điện","D. dễ gãy để thay mới"],"answer":"A","explain":"Composite sợi cacbon nhẹ, bền cao, cứng vững nên dùng cho dụng cụ thể thao cao cấp.","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết máy cần vừa cách điện vừa chịu nhiệt (như ổ cắm điện). Vật liệu phù hợp nhất là","options":["A. nhựa nhiệt rắn","B. thép","C. đồng","D. nhôm"],"answer":"A","explain":"Ổ cắm điện cần cách điện, chịu nhiệt, cứng: nhựa nhiệt rắn (Bakelite) là lựa chọn phù hợp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tính chất chất dẻo:","statements":["a) Chất dẻo nhẹ hơn kim loại.","b) Chất dẻo cách điện tốt.","c) Chất dẻo chống ăn mòn tốt.","d) Chất dẻo cứng hơn thép."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chất dẻo có độ cứng thấp hơn kim loại.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về bảo vệ môi trường:","statements":["a) Nên ưu tiên nhựa nhiệt dẻo để tái chế được.","b) Rác thải nhựa khó phân hủy gây ô nhiễm.","c) Chọn vật liệu cần xét khả năng tái chế.","d) Vật liệu nào rẻ nhất thì tốt nhất cho môi trường."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chọn vật liệu phải xét tác động môi trường, không chỉ giá rẻ.","points":1},{"type":"short","level":"VDC","q":"Nêu hai ví dụ về sản phẩm làm bằng nhựa nhiệt rắn trong gia đình.","answer":"Ổ cắm điện, tay cầm nồi (công tắc điện)","explain":"Nhựa nhiệt rắn (Bakelite) cứng, chịu nhiệt, cách điện nên dùng làm ổ cắm điện, công tắc, tay cầm nồi, tay cầm bàn là.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao composite được gọi là vật liệu tổ hợp?","answer":"Vì được tạo thành từ hai hay nhiều vật liệu thành phần kết hợp với nhau","explain":"Composite tổ hợp vật liệu nền và vật liệu cốt (hoặc nhiều thành phần khác) để phát huy ưu điểm của từng loại.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Cao su nhân tạo được chế tạo từ","options":["A. dầu mỏ","B. mủ cây cao su","C. than đá","D. quặng đồng"],"answer":"A","explain":"Cao su nhân tạo (tổng hợp) được chế tạo từ dầu mỏ.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu nền trong composite thường là","options":["A. nhựa","B. thép","C. sợi cacbon","D. gốm"],"answer":"A","explain":"Vật liệu nền trong composite thường là nhựa, có nhiệm vụ liên kết, bao bọc vật liệu cốt.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu cốt trong composite thường là","options":["A. sợi thủy tinh, sợi cacbon","B. hạt nhựa","C. bột sắt","D. nước"],"answer":"A","explain":"Vật liệu cốt thường dạng sợi (thủy tinh, cacbon...) có độ bền cao, chịu lực chính.","points":0.25},{"type":"mcq","level":"TH","q":"Tay cầm nồi, chảo chống nóng làm bằng nhựa nhiệt rắn vì","options":["A. chịu nhiệt tốt, cách nhiệt, cứng","B. tái chế được","C. mềm dẻo","D. trong suốt"],"answer":"A","explain":"Tay cầm nồi cần chịu nhiệt, cách nhiệt, cứng vững: nhựa nhiệt rắn đáp ứng tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Đế giày thể thao thường làm bằng cao su vì","options":["A. đàn hồi, chịu mài mòn, bám đường","B. cứng như gỗ","C. dẫn điện","D. chống cháy tuyệt đối"],"answer":"A","explain":"Đế giày cần đàn hồi giảm chấn, chịu mài mòn, bám đường: cao su phù hợp.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty sản xuất mũ bảo hiểm muốn mũ nhẹ mà chịu va đập tốt. Vật liệu nên dùng là","options":["A. composite (nhựa + sợi)","B. gang","C. thép tấm dày","D. gốm sứ"],"answer":"A","explain":"Mũ bảo hiểm cần nhẹ mà chịu va đập: composite (vỏ nhựa cứng + lớp xốp) là lựa chọn phù hợp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ứng dụng:","statements":["a) Lốp xe làm bằng cao su.","b) Ống nước làm bằng nhựa PVC.","c) Vỏ tàu thuyền làm bằng composite.","d) Dây điện làm bằng gốm sứ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: dây điện làm bằng đồng (dẫn điện), gốm chỉ làm sứ cách điện.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về so sánh vật liệu:","statements":["a) Composite nhẹ hơn thép mà bền tương đương.","b) Cao su đàn hồi hơn nhựa cứng.","c) Gốm cứng hơn nhựa.","d) Nhựa nhiệt dẻo chịu nhiệt tốt hơn nhựa nhiệt rắn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhựa nhiệt rắn chịu nhiệt tốt hơn nhựa nhiệt dẻo.","points":1},{"type":"short","level":"VDC","q":"Giải thích vì sao vật liệu composite ngày càng thay thế kim loại trong hàng không.","answer":"Vì nhẹ hơn nhiều mà vẫn đảm bảo độ bền, giúp tiết kiệm nhiên liệu","explain":"Trong hàng không, giảm khối lượng giúp tiết kiệm nhiên liệu; composite nhẹ mà bền cao nên dần thay thế hợp kim kim loại.","points":0.5},{"type":"short","level":"VDC","q":"Nêu một biện pháp giảm thiểu rác thải nhựa trong đời sống.","answer":"Tái chế nhựa nhiệt dẻo, hạn chế đồ nhựa dùng một lần","explain":"Tái chế nhựa nhiệt dẻo, dùng đồ tái sử dụng, hạn chế túi nilon và đồ nhựa dùng một lần giúp giảm rác thải nhựa.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Vật liệu thông minh là vật liệu","options":["A. thay đổi tính chất theo môi trường (nhiệt, điện, từ)","B. có trí tuệ nhân tạo","C. tự di chuyển được","D. phát sáng trong bóng tối"],"answer":"A","explain":"Vật liệu thông minh thay đổi tính chất (hình dạng, độ cứng...) theo tác động của môi trường như nhiệt độ, điện, từ trường.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu siêu nhẹ được ứng dụng chủ yếu trong","options":["A. hàng không, vũ trụ","B. xây dựng nhà cấp 4","C. đồ gia dụng giá rẻ","D. bao bì thực phẩm"],"answer":"A","explain":"Vật liệu siêu nhẹ (khối lượng riêng rất thấp mà vẫn bền) dùng trong hàng không, vũ trụ nơi yêu cầu giảm khối lượng khắt khe.","points":0.25},{"type":"mcq","level":"NB","q":"PE, PP, PVC là các loại","options":["A. nhựa nhiệt dẻo","B. nhựa nhiệt rắn","C. cao su","D. sợi composite"],"answer":"A","explain":"PE, PP, PVC là các loại nhựa nhiệt dẻo phổ biến (chai lọ, ống nước, túi nilon).","points":0.25},{"type":"mcq","level":"TH","q":"Bakelite là loại nhựa","options":["A. nhiệt rắn","B. nhiệt dẻo","C. sinh học","D. dẻo sinh học"],"answer":"A","explain":"Bakelite là nhựa nhiệt rắn điển hình, dùng làm ổ cắm điện, tay cầm chịu nhiệt.","points":0.25},{"type":"mcq","level":"TH","q":"Sứ cách điện trên đường dây cao thế làm bằng gốm vì gốm","options":["A. cách điện tốt, cứng, bền với thời tiết","B. dẫn điện tốt","C. dẻo dễ uốn","D. nhẹ như xốp"],"answer":"A","explain":"Gốm cách điện tốt, cứng, bền với thời tiết nên dùng làm sứ cách điện ngoài trời.","points":0.25},{"type":"mcq","level":"VD","q":"Một bệnh viện cần vật liệu làm răng giả. Vật liệu phù hợp nhất là","options":["A. gốm sứ y tế","B. gang xám","C. nhựa nhiệt dẻo thường","D. cao su"],"answer":"A","explain":"Răng giả cần cứng, bền, an toàn sinh học, thẩm mỹ: gốm sứ y tế đáp ứng tốt.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về phân loại nhựa:","statements":["a) PE, PVC là nhựa nhiệt dẻo.","b) Bakelite là nhựa nhiệt rắn.","c) Nhựa nhiệt dẻo tái chế được.","d) Nhựa nhiệt rắn nung nóng sẽ mềm ra."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhựa nhiệt rắn đã đóng rắn vĩnh viễn, không mềm lại khi nung nóng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về xu hướng vật liệu:","statements":["a) Vật liệu mới giúp sản phẩm nhẹ hơn, bền hơn.","b) Chọn vật liệu cần xét khả năng tái chế.","c) Vật liệu composite thay thế dần kim loại trong hàng không.","d) Trong tương lai chỉ dùng vật liệu mới, bỏ hết kim loại."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: kim loại vẫn giữ vai trò quan trọng, vật liệu mới bổ sung chứ không thay thế hoàn toàn.","points":1},{"type":"short","level":"VDC","q":"Nêu hai tính chất khiến gốm sứ kỹ thuật khác biệt với nhựa.","answer":"Cứng rất cao, chịu nhiệt tốt (nhưng giòn)","explain":"Gốm sứ kỹ thuật cứng rất cao, chịu nhiệt tốt nhưng giòn; nhựa thì mềm dẻo hơn, chịu nhiệt kém hơn.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao nói composite phát huy ưu điểm và khắc phục nhược điểm của từng vật liệu thành phần?","answer":"Vì nền nhựa nhẹ, dễ tạo hình còn cốt sợi bền chắc; kết hợp được vật liệu vừa nhẹ vừa bền","explain":"Nhựa nhẹ nhưng yếu, sợi bền nhưng khó tạo hình; kết hợp thành composite được vật liệu vừa nhẹ, dễ tạo hình vừa bền chắc.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Túi nilon, chai nhựa thuộc loại","options":["A. nhựa nhiệt dẻo","B. nhựa nhiệt rắn","C. cao su lưu hóa","D. gốm"],"answer":"A","explain":"Túi nilon (PE), chai nhựa là nhựa nhiệt dẻo, có thể tái chế.","points":0.25},{"type":"mcq","level":"NB","q":"Keo epoxy thuộc loại","options":["A. nhựa nhiệt rắn","B. nhựa nhiệt dẻo","C. cao su tự nhiên","D. sợi cacbon"],"answer":"A","explain":"Keo epoxy sau khi đóng rắn thì cứng vĩnh viễn, thuộc nhựa nhiệt rắn.","points":0.25},{"type":"mcq","level":"NB","q":"Găng tay y tế thường làm bằng","options":["A. cao su","B. thép","C. gốm","D. gỗ"],"answer":"A","explain":"Găng tay y tế làm bằng cao su (mỏng, đàn hồi, chống thấm, cách ly tốt).","points":0.25},{"type":"mcq","level":"TH","q":"Sợi cacbon trong composite có vai trò","options":["A. chịu lực chính nhờ độ bền rất cao","B. tạo màu đen đẹp","C. dẫn điện cho composite","D. làm composite nhẹ hơn"],"answer":"A","explain":"Sợi cacbon có độ bền rất cao nên làm vật liệu cốt chịu lực chính trong composite.","points":0.25},{"type":"mcq","level":"TH","q":"Răng giả, khớp nhân tạo trong y tế ưu tiên vật liệu","options":["A. gốm sứ y tế, hợp kim tương thích sinh học","B. gang xám","C. nhựa PVC thường","D. gỗ"],"answer":"A","explain":"Vật liệu y tế cần tương thích sinh học, bền, an toàn: gốm sứ y tế và hợp kim đặc biệt được ưu tiên.","points":0.25},{"type":"mcq","level":"VD","q":"Một xưởng cần làm khuôn đúc chi tiết chịu nhiệt độ cao (trên 1000°C). Vật liệu khuôn phù hợp là","options":["A. gốm sứ chịu nhiệt hoặc hợp kim chịu nhiệt","B. nhựa nhiệt dẻo","C. cao su","D. gỗ"],"answer":"A","explain":"Ở nhiệt độ trên 1000°C, nhựa và cao su bị phá hủy; cần gốm sứ chịu nhiệt hoặc hợp kim chịu nhiệt đặc biệt.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tính chất cao su:","statements":["a) Cao su có tính đàn hồi cao.","b) Cao su dùng làm lốp xe, gioăng đệm.","c) Cao su cách điện tốt.","d) Cao su cứng hơn thép."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cao su mềm, đàn hồi, không cứng như thép.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về lựa chọn vật liệu phi kim loại:","statements":["a) Chi tiết cách điện nên chọn nhựa.","b) Chi tiết cần đàn hồi nên chọn cao su.","c) Chi tiết chịu nhiệt rất cao nên chọn gốm.","d) Mọi chi tiết máy đều nên làm bằng nhựa cho rẻ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhựa độ bền thấp, không thể thay thế kim loại trong chi tiết chịu lực lớn.","points":1},{"type":"short","level":"VDC","q":"Nêu một ứng dụng của hợp kim nhớ hình trong y tế.","answer":"Stent mạch máu, nẹp xương (dụng cụ chỉnh nha)","explain":"Hợp kim nhớ hình (như Nitinol) dùng làm stent mạch máu tự bung, nẹp xương, dây cung chỉnh nha trong y tế.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao vỏ máy bay hiện đại dùng nhiều composite thay cho hợp kim nhôm?","answer":"Vì composite nhẹ hơn mà bền tương đương, chống ăn mòn tốt","explain":"Composite nhẹ hơn hợp kim nhôm mà vẫn đảm bảo độ bền, lại chống ăn mòn tốt, giúp giảm khối lượng máy bay, tiết kiệm nhiên liệu.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Vật liệu mới gồm","options":["A. composite, vật liệu nano, hợp kim nhớ hình...","B. gang, thép, đồng","C. nhựa PE, PVC","D. cao su tự nhiên"],"answer":"A","explain":"Vật liệu mới gồm composite, vật liệu nano, hợp kim nhớ hình, vật liệu siêu nhẹ, vật liệu thông minh...","points":0.25},{"type":"mcq","level":"NB","q":"Thân xe đua công thức 1 thường làm bằng","options":["A. composite sợi cacbon","B. gang","C. gỗ","D. nhựa PVC"],"answer":"A","explain":"Thân xe đua cần nhẹ, cứng vững, chịu va đập: composite sợi cacbon là lựa chọn hàng đầu.","points":0.25},{"type":"mcq","level":"NB","q":"Ống dẫn nước, dây điện trong nhà thường bọc bằng","options":["A. nhựa PVC","B. giấy","C. vải","D. lá cây"],"answer":"A","explain":"Nhựa PVC cách điện, chống ẩm, rẻ nên dùng bọc dây điện, làm ống nước.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung của vật liệu phi kim loại so với kim loại là","options":["A. thường nhẹ hơn, chống ăn mòn tốt hơn","B. luôn bền hơn","C. luôn cứng hơn","D. luôn chịu nhiệt tốt hơn"],"answer":"A","explain":"Vật liệu phi kim loại thường nhẹ hơn, chống ăn mòn tốt hơn kim loại, nhưng độ bền, độ cứng thường thấp hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Sơn tự làm sạch (lá sen) ứng dụng thành tựu của","options":["A. vật liệu nano","B. gang xám","C. thép hợp kim","D. cao su"],"answer":"A","explain":"Sơn tự làm sạch ứng dụng công nghệ nano tạo bề mặt chống bám bẩn như lá sen.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty đồ chơi trẻ em cần vật liệu an toàn, nhẹ, nhiều màu sắc, giá rẻ. Lựa chọn tốt nhất là","options":["A. nhựa nhiệt dẻo","B. gang","C. thép","D. gốm sứ"],"answer":"A","explain":"Đồ chơi trẻ em cần nhẹ, an toàn, dễ tạo hình nhiều màu, giá rẻ: nhựa nhiệt dẻo phù hợp nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vật liệu mới: (2):","statements":["a) Composite nhẹ mà bền cao.","b) Hợp kim nhớ hình tự phục hồi hình dạng.","c) Vật liệu nano có cấu trúc siêu nhỏ.","d) Vật liệu mới đã lỗi thời, ít dùng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: vật liệu mới đang được nghiên cứu và ứng dụng mạnh mẽ.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tác động môi trường:","statements":["a) Ưu tiên vật liệu tái chế được.","b) Hạn chế đồ nhựa dùng một lần.","c) Vật liệu nhẹ giúp tiết kiệm nhiên liệu vận tải.","d) Giá rẻ là tiêu chí duy nhất khi chọn vật liệu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: còn phải xét độ bền, an toàn, tác động môi trường.","points":1},{"type":"short","level":"VDC","q":"Nêu ba tiêu chí ngoài tính chất cơ học cần xét khi lựa chọn vật liệu hiện nay.","answer":"Giá thành, khả năng tái chế, tác động môi trường","explain":"Ngoài tính chất cơ học, chọn vật liệu hiện nay còn xét giá thành, khả năng tái chế, tác động môi trường và chi phí vòng đời sản phẩm.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao nói vật liệu là nền tảng của cách mạng công nghiệp?","answer":"Vì mỗi bước tiến vật liệu mở ra khả năng chế tạo sản phẩm mới","explain":"Từ đồ đá, đồ đồng, đồ sắt đến vật liệu mới: mỗi bước tiến về vật liệu đều mở ra khả năng chế tạo công cụ, máy móc mới, thúc đẩy sản xuất.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Chất dẻo dễ tạo hình vì","options":["A. có tính dẻo khi gia nhiệt","B. rất cứng","C. dẫn điện","D. nặng"],"answer":"A","explain":"Chất dẻo có tính dẻo, mềm ra khi gia nhiệt nên dễ đúc, ép, thổi thành hình dạng mong muốn.","points":0.25},{"type":"mcq","level":"NB","q":"Cao su được dùng làm đế giày vì","options":["A. đàn hồi, chịu mài mòn","B. cứng","C. dẫn điện","D. trong suốt"],"answer":"A","explain":"Đế giày cần đàn hồi giảm chấn, chịu mài mòn khi đi lại: cao su phù hợp.","points":0.25},{"type":"mcq","level":"NB","q":"Gốm sứ kỹ thuật được chế tạo bằng cách","options":["A. nung các oxit kim loại ở nhiệt độ cao","B. nấu chảy kim loại","C. ép nhựa","D. lưu hóa cao su"],"answer":"A","explain":"Gốm sứ kỹ thuật chế tạo bằng cách nung các oxit kim loại (vật liệu vô cơ) ở nhiệt độ cao.","points":0.25},{"type":"mcq","level":"TH","q":"Khung xe đạp cao cấp làm bằng composite sợi cacbon thay cho thép vì","options":["A. nhẹ hơn nhiều mà vẫn đủ cứng vững","B. rẻ hơn thép","C. dễ hàn hơn","D. dẫn điện tốt hơn"],"answer":"A","explain":"Khung xe đạp cần nhẹ để đi nhanh, ít tốn sức: composite sợi cacbon nhẹ hơn thép nhiều mà vẫn cứng vững.","points":0.25},{"type":"mcq","level":"TH","q":"Tay cầm bàn là điện làm bằng nhựa nhiệt rắn vì","options":["A. cách nhiệt, chịu nhiệt, cứng vững","B. dẫn nhiệt tốt","C. mềm dẻo","D. tái chế dễ"],"answer":"A","explain":"Tay cầm bàn là cần cách nhiệt, chịu nhiệt độ cao, cứng vững: nhựa nhiệt rắn phù hợp.","points":0.25},{"type":"mcq","level":"VD","q":"Một nhà máy thực phẩm cần băng tải chịu dầu mỡ, dễ vệ sinh. Vật liệu băng tải nên là","options":["A. nhựa hoặc cao su chuyên dụng chống dầu","B. vải thô","C. giấy","D. thép không bọc"],"answer":"A","explain":"Băng tải thực phẩm cần chống dầu mỡ, dễ vệ sinh, an toàn: nhựa hoặc cao su chuyên dụng (đạt chuẩn thực phẩm) phù hợp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (tổng kết):","statements":["a) Nhựa nhiệt dẻo tái chế được.","b) Nhựa nhiệt rắn chịu nhiệt tốt.","c) Cao su đàn hồi cao.","d) Gốm sứ kỹ thuật rất dẻo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: gốm sứ kỹ thuật giòn.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về composite: (2):","statements":["a) Gồm vật liệu nền và vật liệu cốt.","b) Nhẹ mà bền cao.","c) Ứng dụng trong hàng không, thể thao.","d) Là vật liệu kim loại."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: composite là vật liệu tổ hợp phi kim loại (nền nhựa + cốt sợi).","points":1},{"type":"short","level":"VDC","q":"So sánh khả năng tái chế của nhựa nhiệt dẻo và nhựa nhiệt rắn.","answer":"Nhiệt dẻo tái chế được bằng cách nung chảy, nhiệt rắn không","explain":"Nhựa nhiệt dẻo nung nóng thì mềm nên tái chế bằng cách nung chảy; nhựa nhiệt rắn đóng rắn vĩnh viễn nên không tái chế bằng cách này.","points":0.5},{"type":"short","level":"VDC","q":"Nêu một ví dụ về vật liệu thông minh và nguyên lý hoạt động của nó.","answer":"Hợp kim nhớ hình: biến dạng rồi tự phục hồi khi nung nóng","explain":"Hợp kim nhớ hình là vật liệu thông minh: bị biến dạng nhưng tự trở lại hình dạng ban đầu khi nung nóng, dùng làm van tự động, dụng cụ y tế.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Hai loại nhựa cơ bản là","options":["A. nhựa nhiệt dẻo và nhựa nhiệt rắn","B. nhựa cứng và nhựa mềm","C. nhựa trong và nhựa đục","D. nhựa đắt và nhựa rẻ"],"answer":"A","explain":"Chất dẻo chia thành nhựa nhiệt dẻo và nhựa nhiệt rắn.","points":0.25},{"type":"mcq","level":"NB","q":"Hai loại cao su cơ bản là","options":["A. cao su tự nhiên và cao su nhân tạo","B. cao su cứng và cao su mềm","C. cao su đen và cao su trắng","D. cao su đắt và cao su rẻ"],"answer":"A","explain":"Cao su gồm cao su tự nhiên (mủ cây) và cao su nhân tạo (từ dầu mỏ).","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu composite có ưu điểm","options":["A. nhẹ, bền cao, chống ăn mòn","B. dẫn điện tốt","C. rẻ nhất","D. chịu nhiệt trên 2000°C"],"answer":"A","explain":"Composite nhẹ, bền cao, chống ăn mòn tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Khi chọn vật liệu làm chi tiết máy, cần xét đến","options":["A. tính chất cơ học, giá thành, môi trường làm việc","B. màu sắc yêu thích","C. tên gọi vật liệu","D. xuất xứ duy nhất"],"answer":"A","explain":"Chọn vật liệu dựa trên tính chất cơ học, yêu cầu sử dụng, môi trường làm việc, giá thành, khả năng tái chế.","points":0.25},{"type":"mcq","level":"TH","q":"Rác thải nhựa gây hại vì","options":["A. khó phân hủy, tồn tại lâu trong môi trường","B. quá nhẹ","C. quá đẹp","D. dễ cháy"],"answer":"A","explain":"Nhựa khó phân hủy sinh học, tồn tại hàng trăm năm, gây ô nhiễm đất, nước.","points":0.25},{"type":"mcq","level":"VD","q":"Một startup muốn sản xuất vali siêu nhẹ, bền, chống va đập. Vật liệu nên nghiên cứu là","options":["A. composite hoặc nhựa kỹ thuật cao cấp","B. gang","C. gỗ tự nhiên","D. giấy bìa"],"answer":"A","explain":"Vali cần nhẹ, bền, chống va đập: composite hoặc nhựa kỹ thuật (như polycarbonate) là lựa chọn phù hợp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về bài học:","statements":["a) Chất dẻo: nhẹ, cách điện, dễ tạo hình.","b) Cao su: đàn hồi cao.","c) Gốm: cứng, chịu nhiệt, giòn.","d) Composite: nặng, yếu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: composite nhẹ mà bền cao.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về vật liệu mới: (3):","statements":["a) Hợp kim nhớ hình thuộc vật liệu thông minh.","b) Vật liệu nano có cấu trúc siêu nhỏ.","c) Vật liệu siêu nhẹ dùng trong hàng không.","d) Vật liệu mới không liên quan đến công nghệ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: vật liệu mới là nền tảng của nhiều tiến bộ công nghệ.","points":1},{"type":"short","level":"VDC","q":"Tóm tắt ưu điểm của vật liệu phi kim loại so với kim loại.","answer":"Nhẹ, chống ăn mòn tốt, cách điện, dễ tạo hình, giá thành thấp","explain":"Vật liệu phi kim loại (nhựa, cao su...) nhẹ, chống ăn mòn, cách điện tốt, dễ gia công tạo hình, giá thành thấp; nhược điểm là độ bền, độ cứng thấp hơn kim loại.","points":0.5},{"type":"short","level":"VDC","q":"Dự đoán một ứng dụng tương lai của vật liệu thông minh trong nhà ở.","answer":"Cửa sổ tự đổi màu theo nắng, vật liệu tự vá nứt","explain":"Vật liệu thông minh trong tương lai: kính tự đổi màu theo ánh nắng, tường tự vá vết nứt, vật liệu điều hòa nhiệt độ thụ động...","points":0.5}]}]}</script>
