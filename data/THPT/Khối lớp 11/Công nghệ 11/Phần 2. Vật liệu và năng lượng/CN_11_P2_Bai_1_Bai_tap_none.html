 vật liệu mới.","b) Kim loại đen gồm gang và thép.","c) Kim loại màu gồm đồng, nhôm và hợp kim.","d) Nhựa là kim loại màu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhựa là vật liệu phi kim loại.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về lựa chọn vật liệu:","statements":["a) Làm dây điện nên chọn đồng.","b) Làm khung xe đạp nên chọn hợp kim nhôm.","c) Làm thân máy nên chọn gang xám.","d) Làm lưỡi dao nên chọn gang xám."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lưỡi dao cần độ cứng cao nên chọn thép cacbon cao, không chọn gang xám giòn.","points":1},{"type":"short","level":"VDC","q":"Độ dai va đập thể hiện khả năng gì của vật liệu?","answer":"Khả năng chịu tải trọng va đập mà không bị phá hủy","explain":"Độ dai va đập là khả năng chịu tải trọng va đập đột ngột mà không bị phá hủy (ngược với tính giòn).","points":0.5},{"type":"short","level":"VDC","q":"Một hợp kim Fe – C có 4% C. Hỏi đó là gang hay thép? Vì sao?","answer":"Gang, vì hàm lượng C trên 2,14%","explain":"4% C lớn hơn mốc 2,14% nên hợp kim này là gang.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Thép hợp kim khác thép cacbon ở điểm","options":["A. pha thêm các nguyên tố hợp kim như Cr, Ni, Mn","B. không chứa cacbon","C. không chứa sắt","D. nhẹ hơn nhôm"],"answer":"A","explain":"Thép hợp kim là thép cacbon pha thêm các nguyên tố hợp kim (Cr, Ni, Mn...) để cải thiện tính chất.","points":0.25},{"type":"mcq","level":"NB","q":"Thép không gỉ (inox) thuộc loại","options":["A. thép hợp kim","B. gang xám","C. đồng thau","D. thép cacbon thấp"],"answer":"A","explain":"Thép không gỉ là thép hợp kim (pha thêm crôm, niken...) có khả năng chống ăn mòn cao.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu nào sau đây nhẹ nhất?","options":["A. Hợp kim nhôm","B. Thép","C. Gang","D. Đồng"],"answer":"A","explain":"Nhôm và hợp kim nhôm nhẹ (khoảng 1/3 thép), nhẹ nhất trong các vật liệu đã cho.","points":0.25},{"type":"mcq","level":"TH","q":"Gang xám thường dùng làm","options":["A. thân máy, vỏ hộp số","B. dây điện","C. lưỡi dao","D. khung xe đạp"],"answer":"A","explain":"Gang xám đúc tốt, chịu nén tốt, giảm rung nên dùng làm thân máy, vỏ hộp số, bánh đà.","points":0.25},{"type":"mcq","level":"TH","q":"Tính chất nào sau đây là tính chất cơ học của vật liệu?","options":["A. Độ bền","B. Màu sắc","C. Tính dẫn điện","D. Khối lượng riêng"],"answer":"A","explain":"Độ bền là tính chất cơ học; màu sắc, dẫn điện, khối lượng riêng là tính chất vật lý.","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết vừa cần cứng bề mặt vừa cần dẻo ở lõi (như bánh răng). Biện pháp thường dùng là","options":["A. dùng thép và nhiệt luyện bề mặt","B. dùng gang xám","C. dùng đồng thau","D. dùng nhựa"],"answer":"A","explain":"Bánh răng cần bề mặt cứng chống mài mòn, lõi dẻo chịu va đập: dùng thép cacbon rồi nhiệt luyện (tôi) bề mặt.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về gang:","statements":["a) Gang xám dễ đúc, chịu nén tốt.","b) Gang dẻo dẻo hơn gang xám.","c) Gang cầu bền cao gần như thép.","d) Gang thường dùng để rèn thành chi tiết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: gang cứng, giòn nên chủ yếu đúc, không rèn được như thép.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về ảnh hưởng của cacbon:","statements":["a) Càng nhiều C, hợp kim Fe – C càng cứng.","b) Càng nhiều C, hợp kim Fe – C càng giòn.","c) Thép ít C hơn gang nên dẻo hơn gang.","d) Có thể tăng độ dẻo của thép bằng cách tăng hàm lượng C."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tăng C làm tăng độ cứng nhưng giảm độ dẻo.","points":1},{"type":"short","level":"VDC","q":"Vì sao thép được dùng phổ biến hơn gang để chế tạo trục, bánh răng?","answer":"Vì thép dẻo, dai, chịu lực và va đập tốt hơn gang","explain":"Trục, bánh răng chịu lực, chịu va đập, cần độ dẻo dai: thép đáp ứng tốt hơn gang (cứng, giòn).","points":0.5},{"type":"short","level":"VDC","q":"Nêu tên ba loại gang thường gặp.","answer":"Gang xám, gang dẻo, gang cầu","explain":"Ba loại gang thường gặp: gang xám (phổ biến nhất), gang dẻo, gang cầu (bền cao).","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Thành phần chủ yếu của kim loại đen là","options":["A. sắt và cacbon","B. đồng và kẽm","C. nhôm và magie","D. đồng và thiếc"],"answer":"A","explain":"Kim loại đen (gang, thép) có thành phần chủ yếu là sắt và cacbon.","points":0.25},{"type":"mcq","level":"NB","q":"Nhạc cụ bằng đồng (kèn, trumpet) thường làm bằng","options":["A. đồng thau","B. gang xám","C. thép cacbon","D. nhôm"],"answer":"A","explain":"Đồng thau (Cu – Zn) dễ gia công, màu đẹp, âm thanh tốt nên dùng làm nhạc cụ.","points":0.25},{"type":"mcq","level":"NB","q":"Tính giòn là tính chất","options":["A. ngược với độ dai va đập","B. giống với độ dẻo","C. giống với độ bền","D. không liên quan cơ học"],"answer":"A","explain":"Giòn là tính chất ngược với dai: vật liệu giòn dễ vỡ khi chịu va đập.","points":0.25},{"type":"mcq","level":"TH","q":"Hợp kim nhôm được dùng làm vỏ máy bay vì","options":["A. nhẹ mà vẫn đảm bảo độ bền cần thiết","B. rẻ nhất","C. cứng nhất","D. dẫn điện tốt nhất"],"answer":"A","explain":"Vỏ máy bay cần nhẹ để tiết kiệm nhiên liệu mà vẫn đủ bền: hợp kim nhôm đáp ứng tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Để xác định độ cứng của vật liệu, người ta","options":["A. ấn một vật cứng lên bề mặt vật liệu và đo vết ấn","B. kéo vật liệu đến khi đứt","C. nung nóng vật liệu","D. cân khối lượng vật liệu"],"answer":"A","explain":"Độ cứng xác định bằng cách ấn vật cứng (bi thép, mũi kim cương) lên bề mặt và đo kích thước vết ấn.","points":0.25},{"type":"mcq","level":"VD","q":"Hai chi tiết cùng kích thước, một bằng thép, một bằng gang xám, cùng chịu va đập mạnh. Chi tiết nào dễ vỡ hơn?","options":["A. Chi tiết bằng gang xám","B. Chi tiết bằng thép","C. Cả hai như nhau","D. Không xác định được"],"answer":"A","explain":"Gang xám cứng, giòn, độ dai va đập thấp nên dễ vỡ hơn thép dẻo, dai khi chịu va đập.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về đồng và nhôm:","statements":["a) Đồng dẫn điện tốt hơn nhôm.","b) Nhôm nhẹ hơn đồng.","c) Đồng thau đẹp, dễ gia công.","d) Hợp kim nhôm không chống được ăn mòn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hợp kim nhôm chống ăn mòn tốt.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về thí nghiệm cơ tính:","statements":["a) Thí nghiệm kéo xác định độ bền kéo.","b) Thí nghiệm ấn lõm xác định độ cứng.","c) Thí nghiệm va đập xác định độ dai va đập.","d) Nhìn bằng mắt thường xác định được độ bền."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: độ bền phải xác định bằng thí nghiệm, không nhìn bằng mắt.","points":1},{"type":"short","level":"VDC","q":"Một vật liệu vừa cứng vừa giòn (như gang) thì độ dẻo của nó như thế nào?","answer":"Thấp (kém)","explain":"Cứng và giòn đi đôi với độ dẻo thấp: vật liệu khó biến dạng dẻo mà dễ nứt vỡ.","points":0.5},{"type":"short","level":"VDC","q":"Nêu hai ứng dụng của đồng trong đời sống và kỹ thuật.","answer":"Dây điện, ống dẫn nhiệt (thiết bị điện, tản nhiệt)","explain":"Đồng dẫn điện, dẫn nhiệt tốt nên dùng làm dây điện, cuộn dây động cơ, ống dẫn nhiệt, thiết bị tản nhiệt.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Vật liệu cơ khí được chia thành","options":["A. kim loại, phi kim loại và vật liệu mới","B. chỉ kim loại","C. sắt và đồng","D. rắn và lỏng"],"answer":"A","explain":"Vật liệu cơ khí gồm vật liệu kim loại, vật liệu phi kim loại và vật liệu mới.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm lượng cacbon của thép","options":["A. dưới 2,14%","B. trên 2,14%","C. bằng 2,14% chính xác","D. trên 5%"],"answer":"A","explain":"Thép có hàm lượng cacbon dưới 2,14%.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm lượng cacbon của gang","options":["A. trên 2,14%","B. dưới 2,14%","C. bằng 0%","D. dưới 0,5%"],"answer":"A","explain":"Gang có hàm lượng cacbon trên 2,14%.","points":0.25},{"type":"mcq","level":"TH","q":"Thép cacbon cao (nhiều C) có tính chất","options":["A. cứng cao, ít dẻo","B. rất dẻo","C. rất nhẹ","D. dẫn điện tốt"],"answer":"A","explain":"Thép càng nhiều cacbon càng cứng nhưng càng giòn, độ dẻo thấp.","points":0.25},{"type":"mcq","level":"TH","q":"Bánh đà của động cơ thường làm bằng gang xám vì","options":["A. đúc được khối lớn, chịu mài mòn, giá thành thấp","B. nhẹ nhất","C. dẫn điện tốt","D. dẻo dễ uốn"],"answer":"A","explain":"Bánh đà cần khối lượng lớn, chịu mài mòn: gang xám đúc tốt, chịu mài mòn, giá thành thấp.","points":0.25},{"type":"mcq","level":"VD","q":"Cần chế tạo một chi tiết vừa nhẹ vừa chống ăn mòn dùng ngoài trời (như khung cửa). Vật liệu tốt nhất là","options":["A. hợp kim nhôm","B. gang xám","C. thép cacbon thường","D. đồng thau"],"answer":"A","explain":"Hợp kim nhôm nhẹ, chống ăn mòn tốt, phù hợp cho khung cửa dùng ngoài trời.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về mốc 2,14% C:","statements":["a) Là mốc phân biệt gang và thép.","b) Trên 2,14% C là gang.","c) Dưới 2,14% C là thép.","d) Mọi hợp kim Fe – C đều có đúng 2,14% C."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hàm lượng C thay đổi tùy loại gang, thép.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về chọn vật liệu:","statements":["a) Chi tiết chịu va đập nên chọn vật liệu dai, dẻo.","b) Chi tiết cần độ cứng cao nên chọn thép nhiều C.","c) Chi tiết cần nhẹ nên chọn hợp kim nhôm.","d) Mọi chi tiết đều nên làm bằng thép."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chọn vật liệu phải theo yêu cầu sử dụng, không phải lúc nào cũng là thép.","points":1},{"type":"short","level":"VDC","q":"So sánh khả năng rèn của gang và thép.","answer":"Thép rèn được, gang hầu như không rèn được","explain":"Thép dẻo nên rèn được; gang cứng, giòn nên chủ yếu đúc, không rèn được.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao không dùng gang xám để chế tạo lò xo?","answer":"Vì gang cứng, giòn, độ đàn hồi và độ dẻo kém","explain":"Lò xo cần đàn hồi, dẻo dai để biến dạng và hồi phục; gang xám giòn, dễ gãy nên không phù hợp.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Đồng dẫn điện tốt nên được dùng làm","options":["A. dây dẫn điện","B. lưỡi dao","C. khung xe đạp","D. thân máy"],"answer":"A","explain":"Đồng dẫn điện, dẫn nhiệt tốt nên dùng làm dây dẫn điện, cuộn dây.","points":0.25},{"type":"mcq","level":"NB","q":"Tính chất đặc trưng của kim loại màu so với kim loại đen là","options":["A. có màu sắc đặc trưng, không phải màu xám đen của sắt","B. luôn cứng hơn","C. luôn rẻ hơn","D. không dẫn điện"],"answer":"A","explain":"Kim loại màu (đồng, nhôm...) có màu sắc đặc trưng riêng, khác màu xám đen của sắt.","points":0.25},{"type":"mcq","level":"NB","q":"Độ dai va đập ngược với tính chất nào?","options":["A. Tính giòn","B. Tính dẻo","C. Độ bền","D. Độ cứng"],"answer":"A","explain":"Độ dai va đập cao nghĩa là khó vỡ khi va đập, ngược với tính giòn (dễ vỡ).","points":0.25},{"type":"mcq","level":"TH","q":"Thép dùng làm dụng cụ cắt gọt (dao tiện, mũi khoan) cần tính chất nào nhất?","options":["A. Độ cứng cao","B. Độ dẻo cao","C. Khối lượng nhẹ","D. Dẫn điện tốt"],"answer":"A","explain":"Dụng cụ cắt gọt cần độ cứng cao để cắt được vật liệu khác và giữ được lưỡi cắt.","points":0.25},{"type":"mcq","level":"TH","q":"Vỏ hộp số ô tô thường làm bằng","options":["A. gang xám","B. đồng thau","C. thép không gỉ","D. nhôm nguyên chất"],"answer":"A","explain":"Vỏ hộp số cần đúc khối phức tạp, chịu lực, giảm rung, giá thành hợp lý: gang xám phù hợp.","points":0.25},{"type":"mcq","level":"VD","q":"Một nhà máy cần vật liệu làm đường ray xe lửa chịu tải nặng, mài mòn. Lựa chọn hợp lý là","options":["A. thép cacbon cao, độ cứng tốt","B. gang xám","C. đồng thanh","D. hợp kim nhôm"],"answer":"A","explain":"Ray xe lửa chịu tải nặng, mài mòn liên tục cần thép cứng, bền: thép cacbon cao (thép ray chuyên dụng).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ứng dụng kim loại:","statements":["a) Dây điện: đồng.","b) Khung xe đạp thể thao: hợp kim nhôm.","c) Thân máy công cụ: gang xám.","d) Bạc lót ổ trượt: thép cacbon thấp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bạc lót cần chịu mài mòn nên dùng đồng thanh.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tính chất và ứng dụng:","statements":["a) Vật liệu làm lò xo cần đàn hồi, dẻo dai.","b) Vật liệu làm dụng cụ cắt cần độ cứng cao.","c) Vật liệu làm dây điện cần dẫn điện tốt.","d) Vật liệu nào cứng nhất thì dùng làm mọi chi tiết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mỗi chi tiết có yêu cầu khác nhau, phải chọn vật liệu phù hợp.","points":1},{"type":"short","level":"VDC","q":"Nêu hai nguyên tố hợp kim thường pha vào thép để tăng tính chống ăn mòn, độ cứng.","answer":"Crôm (Cr), niken (Ni)","explain":"Crôm và niken là các nguyên tố hợp kim phổ biến pha vào thép để tăng độ cứng, khả năng chống ăn mòn (thép không gỉ).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao đồng thau được dùng làm van nước, khóa nước?","answer":"Vì dễ gia công, chống ăn mòn, màu đẹp","explain":"Đồng thau (Cu – Zn) dễ gia công, chống ăn mòn trong môi trường nước, màu vàng đẹp nên dùng làm van, khóa nước, đồ trang trí.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Kim loại đen có màu sắc đặc trưng là","options":["A. xám đen","B. đỏ","C. vàng","D. trắng bạc"],"answer":"A","explain":"Kim loại đen (gang, thép) có màu xám đen đặc trưng của sắt.","points":0.25},{"type":"mcq","level":"NB","q":"Chi tiết nào sau đây thường làm bằng thép?","options":["A. Trục, bánh răng","B. Dây điện","C. Khung cửa nhôm","D. Vỏ hộp số"],"answer":"A","explain":"Trục, bánh răng chịu lực, chịu mài mòn nên thường làm bằng thép.","points":0.25},{"type":"mcq","level":"NB","q":"Chi tiết nào sau đây thường làm bằng gang?","options":["A. Thân máy, vỏ hộp","B. Dây điện","C. Lưỡi dao","D. Lò xo"],"answer":"A","explain":"Thân máy, vỏ hộp đúc khối lớn, chịu nén nên thường làm bằng gang xám.","points":0.25},{"type":"mcq","level":"TH","q":"So sánh khối lượng của hai chi tiết cùng kích thước, một bằng nhôm, một bằng thép. Kết luận đúng là","options":["A. chi tiết nhôm nhẹ hơn nhiều","B. chi tiết thép nhẹ hơn","C. hai chi tiết nặng bằng nhau","D. không so sánh được"],"answer":"A","explain":"Nhôm nhẹ hơn thép nhiều (khối lượng riêng khoảng 1/3) nên chi tiết nhôm nhẹ hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Tính chất nào giúp thép có thể kéo thành sợi, cán thành tấm?","options":["A. Độ dẻo","B. Độ cứng","C. Tính giòn","D. Tính dẫn điện"],"answer":"A","explain":"Độ dẻo là khả năng biến dạng dẻo mà không nứt vỡ (kéo sợi, cán tấm, rèn, dập).","points":0.25},{"type":"mcq","level":"VD","q":"Một công trình ven biển cần vật liệu làm lan can chống gỉ tốt. Lựa chọn tốt nhất là","options":["A. thép không gỉ hoặc hợp kim nhôm","B. thép cacbon thường không sơn","C. gang xám","D. sắt non"],"answer":"A","explain":"Môi trường biển ăn mòn mạnh: cần vật liệu chống ăn mòn như thép không gỉ (inox) hoặc hợp kim nhôm.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tính chất vật lý và cơ học:","statements":["a) Độ bền, độ cứng là tính chất cơ học.","b) Màu sắc, khối lượng riêng là tính chất vật lý.","c) Tính dẫn điện là tính chất cơ học.","d) Độ dẻo là tính chất cơ học."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: dẫn điện là tính chất vật lý.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về so sánh gang và thép:","statements":["a) Gang cứng hơn thép cacbon thấp.","b) Thép dẻo hơn gang.","c) Gang đúc tốt hơn thép.","d) Thép hàn được còn gang khó hàn."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng, tóm tắt sự khác nhau cơ bản giữa gang và thép.","points":1},{"type":"short","level":"VDC","q":"Nêu nguyên tắc chung khi lựa chọn vật liệu chế tạo chi tiết máy.","answer":"Chọn theo yêu cầu sử dụng: tải trọng, môi trường, giá thành","explain":"Chọn vật liệu dựa trên yêu cầu làm việc của chi tiết (chịu lực, mài mòn, ăn mòn...), điều kiện môi trường và giá thành hợp lý.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao ngày càng nhiều chi tiết ô tô được thay từ thép sang hợp kim nhôm?","answer":"Để giảm khối lượng xe, tiết kiệm nhiên liệu","explain":"Hợp kim nhôm nhẹ hơn thép nhiều mà vẫn đủ bền, giúp giảm khối lượng xe, tiết kiệm nhiên liệu và giảm khí thải.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hợp kim là","options":["A. vật liệu tạo thành khi nấu chảy hai hay nhiều kim loại (hoặc kim loại với phi kim)","B. kim loại nguyên chất","C. nhựa tổng hợp","D. gốm sứ"],"answer":"A","explain":"Hợp kim là vật liệu tạo thành khi nấu chảy hai hay nhiều kim loại với nhau (hoặc kim loại với phi kim như cacbon).","points":0.25},{"type":"mcq","level":"NB","q":"Cacbon trong gang và thép tồn tại ở dạng","options":["A. hòa tan trong sắt hoặc tạo hợp chất","B. sợi riêng biệt","C. hạt nhựa","D. bọt khí"],"answer":"A","explain":"Cacbon trong gang, thép tồn tại hòa tan trong sắt hoặc tạo thành hợp chất (xementit), quyết định tính chất hợp kim.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu nào dẫn điện tốt nhất trong các vật liệu sau?","options":["A. Đồng","B. Thép","C. Gang","D. Nhôm"],"answer":"A","explain":"Đồng dẫn điện tốt nhất trong các vật liệu đã cho, vì vậy được dùng làm dây dẫn điện.","points":0.25},{"type":"mcq","level":"TH","q":"Thép cacbon thấp (ít C) có tính chất","options":["A. dẻo, dễ hàn, dễ gia công","B. rất cứng","C. rất giòn","D. không dẫn điện"],"answer":"A","explain":"Thép ít cacbon dẻo, dễ hàn, dễ gia công cắt gọt, thường dùng làm kết cấu, chi tiết ít chịu mài mòn.","points":0.25},{"type":"mcq","level":"TH","q":"Gang dẻo được dùng làm","options":["A. chi tiết chịu va đập nhẹ","B. dây điện","C. dụng cụ cắt","D. khung máy bay"],"answer":"A","explain":"Gang dẻo dẻo hơn gang xám nên dùng làm chi tiết chịu va đập nhẹ (khớp nối, bánh xe...).","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết yêu cầu: nhẹ, chịu lực trung bình, chống ăn mòn. Sắp xếp vật liệu theo mức độ phù hợp giảm dần:","options":["A. hợp kim nhôm, thép không gỉ, gang xám","B. gang xám, thép không gỉ, hợp kim nhôm","C. thép không gỉ, gang xám, hợp kim nhôm","D. gang xám, hợp kim nhôm, thép không gỉ"],"answer":"A","explain":"Yêu cầu nhẹ là quan trọng nhất: hợp kim nhôm phù hợp nhất, tiếp theo là thép không gỉ (chống ăn mòn nhưng nặng), cuối cùng là gang xám (nặng, dễ gỉ).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về thép cacbon:","statements":["a) Thép ít C thì dẻo, dễ hàn.","b) Thép nhiều C thì cứng, thích hợp làm dụng cụ cắt.","c) Thép cacbon không chứa sắt.","d) Thép cacbon trung bình dùng làm trục, bánh răng."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: thép cacbon chủ yếu là sắt với cacbon.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về bài học:","statements":["a) Mốc 2,14% C phân biệt gang và thép.","b) Đồng thau là Cu – Zn, đồng thanh là Cu – Sn.","c) Nhôm nhẹ, chống ăn mòn tốt.","d) Vật liệu càng cứng thì càng dẻo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: càng cứng thường càng giòn, độ dẻo càng thấp.","points":1},{"type":"short","level":"VDC","q":"Một hợp kim có thành phần chính là sắt với 1% C và pha thêm crôm. Hỏi đó là gang hay thép? Thuộc loại thép nào?","answer":"Thép, thép hợp kim","explain":"1% C dưới 2,14% nên là thép; có pha thêm crôm nên là thép hợp kim.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao thép làm dụng cụ cắt gọt thường có hàm lượng cacbon cao?","answer":"Vì cần độ cứng cao để cắt được vật liệu khác","explain":"Dụng cụ cắt gọt cần độ cứng cao để cắt và giữ lưỡi sắc; thép nhiều cacbon cho độ cứng cao sau nhiệt luyện.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Bốn tính chất cơ học cơ bản của vật liệu là","options":["A. độ bền, độ cứng, độ dẻo, độ dai va đập","B. màu sắc, mùi, vị, khối lượng","C. dẫn điện, dẫn nhiệt, từ tính","D. độ bền, màu sắc, dẫn điện, độ cứng"],"answer":"A","explain":"Bốn tính chất cơ học cơ bản: độ bền, độ cứng, độ dẻo, độ dai va đập.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu mới sẽ học ở bài 2 gồm","options":["A. composite, vật liệu nano...","B. gang, thép","C. đồng, nhôm","D. sắt, cacbon"],"answer":"A","explain":"Vật liệu mới như composite, vật liệu nano, hợp kim nhớ hình sẽ học ở Bài 2.","points":0.25},{"type":"mcq","level":"NB","q":"Ký hiệu hóa học của sắt và cacbon lần lượt là","options":["A. Fe và C","B. Cu và C","C. Al và C","D. Fe và Ca"],"answer":"A","explain":"Sắt ký hiệu Fe, cacbon ký hiệu C.","points":0.25},{"type":"mcq","level":"TH","q":"Khi chọn vật liệu cho chi tiết máy, yếu tố nào KHÔNG cần xét đến?","options":["A. Màu sắc yêu thích của người thiết kế","B. Tải trọng chi tiết chịu","C. Môi trường làm việc","D. Giá thành vật liệu"],"answer":"A","explain":"Chọn vật liệu dựa trên tải trọng, môi trường làm việc, giá thành... chứ không theo sở thích màu sắc.","points":0.25},{"type":"mcq","level":"TH","q":"Thép không gỉ được dùng làm dụng cụ y tế, dao kéo vì","options":["A. chống ăn mòn tốt, bền, an toàn","B. rẻ nhất","C. nhẹ nhất","D. dẫn điện tốt"],"answer":"A","explain":"Thép không gỉ (inox) chống ăn mòn tốt, bền, an toàn vệ sinh nên dùng làm dụng cụ y tế, dao kéo, thiết bị nhà bếp.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty muốn giảm giá thành sản phẩm máy nông nghiệp mà vẫn đảm bảo độ bền. Biện pháp về vật liệu hợp lý là","options":["A. dùng gang cho các chi tiết đúc khối lớn, thép cho chi tiết chịu lực","B. dùng toàn bộ bằng đồng","C. dùng toàn bộ bằng inox","D. dùng toàn bộ bằng gang"],"answer":"A","explain":"Phối hợp vật liệu hợp lý: gang cho chi tiết đúc lớn (rẻ), thép cho chi tiết chịu lực — vừa đảm bảo độ bền vừa giảm giá thành.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (tổng kết bài):","statements":["a) Kim loại đen: gang, thép.","b) Kim loại màu: đồng, nhôm và hợp kim.","c) 2,14% C là mốc phân biệt gang, thép.","d) Mọi kim loại đều nặng hơn nhựa."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng: tóm tắt phân loại kim loại và mốc 2,14% C.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tính chất:","statements":["a) Độ bền: chịu lực không phá hủy.","b) Độ cứng: chống biến dạng khi bị ấn.","c) Độ dẻo: biến dạng dẻo không nứt vỡ.","d) Độ dai va đập: chịu va đập không phá hủy."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng theo định nghĩa các tính chất cơ học.","points":1},{"type":"short","level":"VDC","q":"Một kỹ sư cần vật liệu làm ốc vít dùng ngoài trời, yêu cầu: bền, không gỉ. Đề xuất vật liệu và giải thích.","answer":"Thép không gỉ, vì bền và chống ăn mòn tốt","explain":"Ốc vít ngoài trời chịu lực và môi trường ẩm ướt: thép không gỉ (inox) vừa đảm bảo độ bền vừa chống gỉ.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao cùng là hợp kim Fe – C mà gang dùng để đúc còn thép dùng để rèn?","answer":"Vì gang cứng giòn không rèn được, thép dẻo nên rèn được","explain":"Gang cứng, giòn, độ dẻo thấp nên không rèn được mà chủ yếu đúc; thép dẻo dai nên rèn, cán, kéo được.","points":0.5}]}]}</script>
