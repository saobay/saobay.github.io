wer":"A","explain":"Thép ít C dẻo, dễ hàn, dễ gia công.","points":0.25},{"type":"mcq","level":"TH","q":"Mỗi lần biến đổi năng lượng đều","options":["A. có hao phí","B. không hao phí","C. sinh thêm năng lượng","D. mất hết năng lượng"],"answer":"A","explain":"Mỗi lần biến đổi năng lượng đều có một phần hao phí.","points":0.25},{"type":"mcq","level":"VD","q":"Startup muốn vali siêu nhẹ, bền, chống va đập. Vật liệu nên nghiên cứu là","options":["A. composite hoặc nhựa kỹ thuật","B. gang","C. gỗ","D. giấy bìa"],"answer":"A","explain":"Vali cần nhẹ, bền, chống va đập: composite hoặc nhựa kỹ thuật (polycarbonate).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về cao su và gốm:","statements":["a) Cao su đàn hồi cao.","b) Gốm cứng, chịu nhiệt tốt.","c) Gốm rất dẻo.","d) Cao su dùng làm lốp xe."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: gốm giòn.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về thiết bị biến đổi năng lượng:","statements":["a) Pin mặt trời: quang năng thành điện năng.","b) Động cơ điện: điện năng thành cơ năng.","c) Máy phát điện: cơ năng thành điện năng.","d) Bếp gas: điện năng thành nhiệt năng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bếp gas biến hóa năng thành nhiệt năng.","points":1},{"type":"short","level":"VDC","q":"Một hợp kim Fe – C có 1% C và pha thêm crôm. Đó là gang hay thép? Loại nào?","answer":"Thép, thép hợp kim","explain":"1% C dưới 2,14% nên là thép; pha thêm crôm nên là thép hợp kim.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao đèn sợi đốt tốn điện hơn đèn LED cùng độ sáng?","answer":"Vì phần lớn điện năng biến thành nhiệt năng vô ích","explain":"Đèn sợi đốt biến phần lớn điện năng thành nhiệt năng, chỉ một phần nhỏ thành quang năng.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Độ dai va đập ngược với","options":["A. tính giòn","B. tính dẻo","C. độ bền","D. độ cứng"],"answer":"A","explain":"Độ dai va đập cao nghĩa là khó vỡ, ngược với tính giòn.","points":0.25},{"type":"mcq","level":"NB","q":"PE, PVC là","options":["A. nhựa nhiệt dẻo","B. nhựa nhiệt rắn","C. cao su","D. sợi cacbon"],"answer":"A","explain":"PE, PVC là nhựa nhiệt dẻo phổ biến.","points":0.25},{"type":"mcq","level":"NB","q":"Năng lượng địa nhiệt từ","options":["A. nhiệt trong lòng đất","B. mặt trời","C. gió","D. nước"],"answer":"A","explain":"Địa nhiệt khai thác nhiệt trong lòng đất.","points":0.25},{"type":"mcq","level":"TH","q":"Bạc lót ổ trượt nên làm bằng","options":["A. đồng thanh","B. gang xám","C. thép cacbon thấp","D. nhôm"],"answer":"A","explain":"Bạc lót cần chịu mài mòn: đồng thanh cứng, chịu mài mòn tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của năng lượng hóa thạch là","options":["A. ổn định, chủ động","B. vô tận","C. không ô nhiễm","D. miễn phí"],"answer":"A","explain":"Năng lượng hóa thạch ổn định, chủ động, công nghệ sẵn có.","points":0.25},{"type":"mcq","level":"VD","q":"Khu công nghiệp muốn giảm phát thải CO2. Giải pháp hợp lý là","options":["A. điện mặt trời mái nhà và thiết bị hiệu suất cao","B. đốt thêm than","C. máy phát diesel cũ","D. tăng lò hơi đốt dầu"],"answer":"A","explain":"Điện mặt trời mái nhà và thiết bị hiệu suất cao giảm phát thải, tiết kiệm lâu dài.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về lựa chọn vật liệu:","statements":["a) Dây điện: chọn đồng.","b) Khung xe đạp: chọn hợp kim nhôm.","c) Thân máy: chọn gang xám.","d) Lưỡi dao: chọn gang xám."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lưỡi dao cần thép cacbon cao.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về trách nhiệm năng lượng:","statements":["a) Mỗi người đều có thể tiết kiệm năng lượng.","b) Học sinh có thể tuyên truyền năng lượng tái tạo.","c) Tiết kiệm năng lượng bảo vệ môi trường.","d) Môi trường là việc của riêng nhà nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: là trách nhiệm của mọi người.","points":1},{"type":"short","level":"VDC","q":"Nêu hai nguyên tố hợp kim thường pha vào thép để chống gỉ, tăng độ cứng.","answer":"Crôm (Cr), niken (Ni)","explain":"Crôm và niken pha vào thép để tăng độ cứng, chống ăn mòn (thép không gỉ).","points":0.5},{"type":"short","level":"VDC","q":"Nêu chuỗi biến đổi năng lượng khi dùng quạt điện.","answer":"Điện năng thành cơ năng","explain":"Quạt điện biến điện năng thành cơ năng quay cánh quạt.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hàm lượng C của gang","options":["A. trên 2,14%","B. dưới 2,14%","C. bằng 0%","D. dưới 0,5%"],"answer":"A","explain":"Gang có hàm lượng C trên 2,14%.","points":0.25},{"type":"mcq","level":"NB","q":"Sứ cách điện làm bằng gốm vì","options":["A. cách điện tốt, cứng, bền thời tiết","B. dẫn điện tốt","C. dẻo","D. nhẹ như xốp"],"answer":"A","explain":"Gốm cách điện tốt, cứng, bền với thời tiết nên làm sứ cách điện.","points":0.25},{"type":"mcq","level":"NB","q":"Dạng năng lượng của xăng là","options":["A. hóa năng","B. cơ năng","C. điện năng","D. quang năng"],"answer":"A","explain":"Xăng dự trữ năng lượng trong liên kết hóa học: hóa năng.","points":0.25},{"type":"mcq","level":"TH","q":"So sánh chi tiết nhôm và thép cùng kích thước","options":["A. chi tiết nhôm nhẹ hơn nhiều","B. chi tiết thép nhẹ hơn","C. nặng bằng nhau","D. không so sánh được"],"answer":"A","explain":"Nhôm nhẹ hơn thép nhiều (khoảng 1/3 khối lượng riêng).","points":0.25},{"type":"mcq","level":"TH","q":"Khi phanh xe, cơ năng chuyển thành","options":["A. nhiệt năng ở má phanh","B. quang năng","C. hóa năng","D. không chuyển"],"answer":"A","explain":"Phanh xe biến cơ năng thành nhiệt năng làm nóng má phanh.","points":0.25},{"type":"mcq","level":"VD","q":"Nhà máy thực phẩm cần băng tải chịu dầu mỡ, dễ vệ sinh. Vật liệu nên là","options":["A. nhựa hoặc cao su chuyên dụng","B. vải thô","C. giấy","D. thép không bọc"],"answer":"A","explain":"Băng tải thực phẩm cần chống dầu mỡ, dễ vệ sinh: nhựa hoặc cao su chuyên dụng đạt chuẩn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về mốc 2,14% C:","statements":["a) Là mốc phân biệt gang và thép.","b) Trên 2,14% là gang.","c) Dưới 2,14% là thép.","d) Gang dẻo hơn thép."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thép dẻo hơn gang.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tương lai:","statements":["a) Vật liệu mới ngày càng quan trọng.","b) Năng lượng tái tạo tăng tỉ trọng.","c) Kim loại sẽ bị loại bỏ hoàn toàn.","d) Tiết kiệm năng lượng luôn cần thiết."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: kim loại vẫn giữ vai trò quan trọng.","points":1},{"type":"short","level":"VDC","q":"Vì sao cùng là hợp kim Fe – C mà gang đúc còn thép rèn?","answer":"Vì gang cứng giòn không rèn được, thép dẻo nên rèn được","explain":"Gang cứng, giòn, độ dẻo thấp nên chủ yếu đúc; thép dẻo dai nên rèn, cán được.","points":0.5},{"type":"short","level":"VDC","q":"Nêu hai lợi ích của điện mặt trời mái nhà.","answer":"Giảm tiền điện, giảm tải lưới điện","explain":"Điện mặt trời mái nhà giúp giảm tiền điện, giảm tải lưới điện quốc gia và giảm phát thải.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Ký hiệu hóa học của sắt và cacbon là","options":["A. Fe và C","B. Cu và C","C. Al và C","D. Fe và Ca"],"answer":"A","explain":"Sắt: Fe, cacbon: C.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu thông minh là vật liệu","options":["A. thay đổi tính chất theo môi trường","B. có trí tuệ nhân tạo","C. tự di chuyển","D. phát sáng"],"answer":"A","explain":"Vật liệu thông minh thay đổi tính chất theo tác động của môi trường (nhiệt, điện, từ).","points":0.25},{"type":"mcq","level":"NB","q":"Năm dạng năng lượng cơ bản là","options":["A. cơ, nhiệt, điện, hóa, quang","B. cơ, thủy, phong","C. điện, từ, âm","D. hóa, sinh, tử"],"answer":"A","explain":"Năm dạng: cơ năng, nhiệt năng, điện năng, hóa năng, quang năng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi chọn vật liệu KHÔNG cần xét","options":["A. màu sắc yêu thích của người thiết kế","B. tải trọng","C. môi trường làm việc","D. giá thành"],"answer":"A","explain":"Chọn vật liệu dựa trên tải trọng, môi trường, giá thành, không theo sở thích màu sắc.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp nào KHÔNG tiết kiệm năng lượng?","options":["A. Dùng thiết bị cũ hiệu suất thấp","B. Dùng đèn LED","C. Tắt thiết bị khi không dùng","D. Bảo dưỡng máy định kỳ"],"answer":"A","explain":"Thiết bị cũ hiệu suất thấp gây tốn năng lượng.","points":0.25},{"type":"mcq","level":"VD","q":"Công ty muốn giảm giá thành máy nông nghiệp mà vẫn đảm bảo độ bền. Biện pháp hợp lý là","options":["A. gang cho chi tiết đúc lớn, thép cho chi tiết chịu lực","B. toàn bộ bằng đồng","C. toàn bộ bằng inox","D. toàn bộ bằng gang"],"answer":"A","explain":"Phối hợp vật liệu: gang cho chi tiết đúc lớn (rẻ), thép cho chi tiết chịu lực — vừa bền vừa giảm giá thành.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (tổng kết):","statements":["a) Kim loại đen: gang, thép.","b) Kim loại màu: đồng, nhôm.","c) Nhựa nhiệt dẻo tái chế được.","d) Năng lượng tái tạo gây ô nhiễm nặng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: năng lượng tái tạo ít gây ô nhiễm.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về phát triển bền vững:","statements":["a) Giảm phụ thuộc nhiên liệu hóa thạch.","b) Phát triển năng lượng tái tạo.","c) Sử dụng năng lượng tiết kiệm.","d) Đốt càng nhiều than càng tốt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VDC","q":"Tóm tắt vai trò của vật liệu mới trong tương lai.","answer":"Giúp sản phẩm nhẹ hơn, bền hơn, thông minh hơn, thân thiện môi trường","explain":"Vật liệu mới (composite, nano, thông minh...) giúp sản phẩm nhẹ, bền, thông minh và thân thiện môi trường hơn.","points":0.5},{"type":"short","level":"VDC","q":"Một quốc gia có nên chỉ phát triển một loại năng lượng duy nhất không? Vì sao?","answer":"Không, nên đa dạng hóa để đảm bảo an ninh năng lượng","explain":"Mỗi nguồn có ưu, nhược điểm riêng; đa dạng hóa giúp cung cấp điện ổn định, an toàn.","points":0.5}]}]}</script>
