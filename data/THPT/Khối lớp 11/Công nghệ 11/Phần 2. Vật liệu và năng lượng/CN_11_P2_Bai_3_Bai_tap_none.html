{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Năng lượng là","options":["A. khả năng thực hiện công của một vật thể hoặc hệ thống","B. khối lượng của vật","C. tốc độ của vật","D. nhiệt độ của vật"],"answer":"A","explain":"Năng lượng là khả năng thực hiện công của một vật thể hoặc một hệ thống.","points":0.25},{"type":"mcq","level":"NB","q":"Dạng năng lượng của nước chảy, gió thổi là","options":["A. cơ năng","B. nhiệt năng","C. hóa năng","D. quang năng"],"answer":"A","explain":"Nước chảy, gió thổi thể hiện cơ năng (chuyển động của vật).","points":0.25},{"type":"mcq","level":"NB","q":"Dạng năng lượng dự trữ trong xăng, dầu là","options":["A. hóa năng","B. cơ năng","C. điện năng","D. quang năng"],"answer":"A","explain":"Xăng, dầu dự trữ năng lượng trong liên kết hóa học nên là hóa năng.","points":0.25},{"type":"mcq","level":"TH","q":"Định luật bảo toàn năng lượng phát biểu rằng","options":["A. năng lượng không tự sinh ra cũng không tự mất đi, chỉ chuyển hóa từ dạng này sang dạng khác","B. năng lượng tự sinh ra khi cần","C. năng lượng mất đi sau mỗi lần sử dụng","D. chỉ có cơ năng được bảo toàn"],"answer":"A","explain":"Năng lượng không tự sinh ra cũng không tự mất đi, chỉ chuyển hóa từ dạng này sang dạng khác.","points":0.25},{"type":"mcq","level":"TH","q":"Động cơ đốt trong biến đổi","options":["A. nhiệt năng thành cơ năng","B. cơ năng thành điện năng","C. quang năng thành điện năng","D. hóa năng thành quang năng"],"answer":"A","explain":"Động cơ đốt trong đốt nhiên liệu tạo nhiệt năng rồi biến thành cơ năng (pít-tông chuyển động).","points":0.25},{"type":"mcq","level":"VD","q":"Chuỗi biến đổi năng lượng khi ô tô chạy xăng là","options":["A. hóa năng thành nhiệt năng thành cơ năng","B. cơ năng thành hóa năng thành nhiệt năng","C. quang năng thành điện năng thành cơ năng","D. nhiệt năng thành hóa năng thành cơ năng"],"answer":"A","explain":"Xăng cháy (hóa năng thành nhiệt năng), khí giãn nở đẩy pít-tông (nhiệt năng thành cơ năng).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về các dạng năng lượng:","statements":["a) Cơ năng gắn với chuyển động và vị trí của vật.","b) Nhiệt năng gắn với độ nóng của vật.","c) Điện năng gắn với dòng điện.","d) Hóa năng gắn với ánh sáng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hóa năng gắn với liên kết hóa học; ánh sáng là quang năng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về động cơ đốt trong: (1):","statements":["a) Động cơ xăng dùng bugi đánh lửa.","b) Động cơ diesel dùng nhiên liệu tự bốc cháy do nén.","c) Động cơ đốt trong biến nhiệt năng thành cơ năng.","d) Động cơ đốt trong không gây ô nhiễm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: động cơ đốt trong phát thải khí gây ô nhiễm và hiệu ứng nhà kính.","points":1},{"type":"short","level":"VDC","q":"Nêu chuỗi biến đổi năng lượng trong nhà máy thủy điện.","answer":"Thế năng của nước thành cơ năng (tuabin) thành điện năng","explain":"Nước ở trên cao có thế năng, chảy xuống làm quay tuabin (thế năng thành cơ năng), tuabin kéo máy phát tạo điện năng (cơ năng thành điện năng).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao nói mọi máy móc đều là thiết bị biến đổi năng lượng?","answer":"Vì máy nào cũng chuyển năng lượng từ dạng này sang dạng khác để thực hiện công","explain":"Theo định luật bảo toàn năng lượng, máy móc không tạo ra năng lượng mà chỉ biến đổi năng lượng (ví dụ động cơ biến nhiệt năng thành cơ năng).","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Năng lượng tái tạo là năng lượng từ các nguồn","options":["A. liên tục được bổ sung trong tự nhiên, hầu như vô tận","B. sẽ cạn kiệt trong vài chục năm","C. chỉ có trong phòng thí nghiệm","D. gây ô nhiễm nặng"],"answer":"A","explain":"Năng lượng tái tạo từ các nguồn liên tục được bổ sung trong tự nhiên, hầu như vô tận và ít gây ô nhiễm.","points":0.25},{"type":"mcq","level":"NB","q":"Nguồn năng lượng nào sau đây là năng lượng tái tạo?","options":["A. Năng lượng mặt trời","B. Than đá","C. Dầu mỏ","D. Khí tự nhiên"],"answer":"A","explain":"Năng lượng mặt trời là năng lượng tái tạo; than đá, dầu mỏ, khí tự nhiên là nhiên liệu hóa thạch.","points":0.25},{"type":"mcq","level":"NB","q":"Nguồn năng lượng nào sau đây KHÔNG phải năng lượng tái tạo?","options":["A. Dầu mỏ","B. Năng lượng gió","C. Năng lượng mặt trời","D. Thủy điện"],"answer":"A","explain":"Dầu mỏ là nhiên liệu hóa thạch, không phải năng lượng tái tạo.","points":0.25},{"type":"mcq","level":"TH","q":"Pin mặt trời biến đổi","options":["A. quang năng thành điện năng","B. nhiệt năng thành cơ năng","C. cơ năng thành điện năng","D. hóa năng thành quang năng"],"answer":"A","explain":"Pin mặt trời (tấm quang điện) biến quang năng của ánh sáng mặt trời thành điện năng.","points":0.25},{"type":"mcq","level":"TH","q":"Tuabin gió biến đổi","options":["A. cơ năng của gió thành điện năng","B. quang năng thành điện năng","C. nhiệt năng thành cơ năng","D. hóa năng thành điện năng"],"answer":"A","explain":"Tuabin gió biến cơ năng (động năng) của gió thành cơ năng quay rồi thành điện năng.","points":0.25},{"type":"mcq","level":"VD","q":"Việt Nam có tiềm năng lớn về điện mặt trời và điện gió ở","options":["A. Ninh Thuận, Bình Thuận, Bạc Liêu","B. vùng núi phía Bắc","C. đồng bằng sông Hồng","D. Tây Nguyên duy nhất"],"answer":"A","explain":"Ninh Thuận, Bình Thuận có nắng, gió mạnh; Bạc Liêu có điện gió ven biển — là các trung tâm năng lượng tái tạo của Việt Nam.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về năng lượng tái tạo:","statements":["a) Năng lượng mặt trời là năng lượng tái tạo.","b) Năng lượng gió là năng lượng tái tạo.","c) Thủy điện là năng lượng tái tạo.","d) Than đá là năng lượng tái tạo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: than đá là nhiên liệu hóa thạch.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về biến đổi năng lượng: (3):","statements":["a) Pin mặt trời: quang năng thành điện năng.","b) Tuabin gió: cơ năng thành điện năng.","c) Thủy điện: thế năng nước thành điện năng.","d) Động cơ xăng: điện năng thành cơ năng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: động cơ xăng biến nhiệt năng (từ hóa năng) thành cơ năng.","points":1},{"type":"short","level":"VDC","q":"Kể tên ba nguồn năng lượng tái tạo đang được khai thác ở Việt Nam.","answer":"Mặt trời, gió, thủy điện","explain":"Việt Nam đang khai thác mạnh điện mặt trời, điện gió và thủy điện (ngoài ra có sinh khối như biogas).","points":0.5},{"type":"short","level":"VDC","q":"Biogas trong chăn nuôi nông thôn được tạo ra từ nguồn nào?","answer":"Chất thải chăn nuôi, rơm rạ (sinh khối)","explain":"Biogas tạo ra khi ủ yếm khí chất thải chăn nuôi, rơm rạ... thuộc năng lượng sinh khối.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Nhiên liệu hóa thạch gồm","options":["A. than đá, dầu mỏ, khí tự nhiên","B. năng lượng mặt trời, gió","C. củi, rơm rạ","D. pin, ắc quy"],"answer":"A","explain":"Nhiên liệu hóa thạch gồm than đá, dầu mỏ, khí tự nhiên — hình thành từ xác sinh vật qua hàng triệu năm.","points":0.25},{"type":"mcq","level":"NB","q":"Nhược điểm lớn nhất của nhiên liệu hóa thạch là","options":["A. đang cạn kiệt và gây ô nhiễm môi trường","B. quá rẻ","C. quá sạch","D. khó vận chuyển"],"answer":"A","explain":"Nhiên liệu hóa thạch đang cạn kiệt và khi đốt gây ô nhiễm, phát thải CO2 gây hiệu ứng nhà kính.","points":0.25},{"type":"mcq","level":"NB","q":"Ưu điểm lớn nhất của năng lượng tái tạo là","options":["A. vô tận và ít gây ô nhiễm","B. giá thành luôn rẻ nhất","C. ổn định tuyệt đối","D. không cần thiết bị"],"answer":"A","explain":"Năng lượng tái tạo hầu như vô tận và ít gây ô nhiễm môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Động cơ diesel khác động cơ xăng ở điểm","options":["A. nhiên liệu tự bốc cháy do nén, không cần bugi","B. dùng bugi đánh lửa","C. không dùng nhiên liệu","D. chạy bằng điện"],"answer":"A","explain":"Động cơ diesel nén không khí đến nhiệt độ cao làm nhiên liệu tự bốc cháy, không cần bugi như động cơ xăng.","points":0.25},{"type":"mcq","level":"TH","q":"Thủy điện Hòa Bình, Sơn La biến đổi","options":["A. thế năng của nước thành điện năng","B. quang năng thành điện năng","C. hóa năng thành điện năng","D. nhiệt năng thành điện năng"],"answer":"A","explain":"Thủy điện biến thế năng của nước (trên cao) thành cơ năng tuabin rồi thành điện năng.","points":0.25},{"type":"mcq","level":"VD","q":"Một vùng nông thôn chưa có điện lưới, nắng nhiều quanh năm. Giải pháp cấp điện hợp lý nhất là","options":["A. lắp đặt hệ thống điện mặt trời mái nhà","B. xây nhà máy nhiệt điện than","C. kéo cáp từ thành phố xa hàng trăm km","D. dùng máy phát điện diesel chạy liên tục"],"answer":"A","explain":"Vùng nắng nhiều, xa lưới điện: điện mặt trời mái nhà là giải pháp sạch, chủ động và kinh tế nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nhiên liệu hóa thạch:","statements":["a) Than đá, dầu mỏ là nhiên liệu hóa thạch.","b) Nhiên liệu hóa thạch hình thành qua hàng triệu năm.","c) Đốt nhiên liệu hóa thạch gây hiệu ứng nhà kính.","d) Nhiên liệu hóa thạch là vô tận."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhiên liệu hóa thạch có hạn, đang cạn kiệt.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về so sánh hai nguồn năng lượng:","statements":["a) Năng lượng hóa thạch ổn định, chủ động hơn.","b) Năng lượng tái tạo ít gây ô nhiễm hơn.","c) Năng lượng tái tạo phụ thuộc thời tiết.","d) Năng lượng hóa thạch là vô tận."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: năng lượng hóa thạch có hạn.","points":1},{"type":"short","level":"VDC","q":"Nêu hai nhược điểm của năng lượng tái tạo so với năng lượng hóa thạch.","answer":"Phụ thuộc thời tiết, chi phí đầu tư ban đầu cao","explain":"Năng lượng tái tạo (mặt trời, gió) phụ thuộc thời tiết, không ổn định bằng hóa thạch; chi phí đầu tư ban đầu cao dù vận hành rẻ.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao các nước phát triển vẫn duy trì nhà máy điện hóa thạch dù đẩy mạnh năng lượng tái tạo?","answer":"Vì năng lượng tái tạo phụ thuộc thời tiết, cần nguồn ổn định dự phòng","explain":"Điện mặt trời, điện gió phụ thuộc thời tiết nên cần nguồn điện ổn định (hóa thạch, thủy điện, hạt nhân) đảm bảo lưới điện liên tục.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Dạng năng lượng của ánh sáng mặt trời là","options":["A. quang năng","B. cơ năng","C. hóa năng","D. nhiệt năng"],"answer":"A","explain":"Ánh sáng mặt trời mang quang năng.","points":0.25},{"type":"mcq","level":"NB","q":"Dạng năng lượng của dòng điện là","options":["A. điện năng","B. cơ năng","C. hóa năng","D. quang năng"],"answer":"A","explain":"Dòng điện mang điện năng.","points":0.25},{"type":"mcq","level":"NB","q":"Năng lượng địa nhiệt khai thác từ","options":["A. nhiệt trong lòng đất","B. ánh sáng mặt trời","C. sức gió","D. dòng nước"],"answer":"A","explain":"Năng lượng địa nhiệt khai thác nhiệt từ trong lòng đất.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp nào sau đây giúp tiết kiệm năng lượng?","options":["A. Dùng đèn LED thay đèn sợi đốt","B. Bật điều hòa cả ngày","C. Để máy tính chạy qua đêm","D. Dùng động cơ cũ hiệu suất thấp"],"answer":"A","explain":"Đèn LED hiệu suất cao, tiết kiệm điện hơn nhiều so với đèn sợi đốt.","points":0.25},{"type":"mcq","level":"TH","q":"Xe ô tô điện biến đổi","options":["A. điện năng thành cơ năng","B. nhiệt năng thành cơ năng","C. hóa năng thành nhiệt năng","D. quang năng thành cơ năng"],"answer":"A","explain":"Ô tô điện dùng động cơ điện biến điện năng thành cơ năng làm quay bánh xe.","points":0.25},{"type":"mcq","level":"VD","q":"Một gia đình muốn giảm tiền điện. Biện pháp hiệu quả, ít tốn kém nhất là","options":["A. thay đèn sợi đốt bằng đèn LED và tắt thiết bị khi không dùng","B. mua máy phát điện diesel","C. lắp điều hòa công suất lớn","D. dùng bếp điện thay bếp gas"],"answer":"A","explain":"Thay đèn LED và tắt thiết bị khi không dùng là biện pháp tiết kiệm điện hiệu quả, ít tốn kém nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tiết kiệm năng lượng:","statements":["a) Dùng thiết bị hiệu suất cao giúp tiết kiệm năng lượng.","b) Bảo dưỡng máy móc định kỳ giảm hao phí năng lượng.","c) Tắt thiết bị khi không dùng giúp tiết kiệm điện.","d) Để đèn sáng cả ngày không tốn điện."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: để đèn sáng cả ngày rất tốn điện.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về xe điện:","statements":["a) Xe điện biến điện năng thành cơ năng.","b) Xe điện không phát thải tại chỗ.","c) Điện cho xe điện có thể từ nguồn tái tạo.","d) Xe điện biến nhiệt năng thành cơ năng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: xe điện sạch tại chỗ, có thể dùng điện tái tạo. d) Sai: xe điện dùng động cơ điện, không đốt nhiên liệu.","points":1},{"type":"short","level":"VDC","q":"Nêu hai biện pháp tiết kiệm năng lượng trong gia đình.","answer":"Dùng thiết bị hiệu suất cao (LED), tắt thiết bị khi không dùng","explain":"Tiết kiệm điện trong gia đình: dùng đèn LED, thiết bị hiệu suất cao; tắt điện, quạt, điều hòa khi không dùng; tận dụng ánh sáng tự nhiên.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao bảo dưỡng máy móc định kỳ giúp tiết kiệm năng lượng?","answer":"Vì máy móc mòn, khô dầu làm tăng ma sát, hao phí năng lượng","explain":"Máy móc không bảo dưỡng bị mòn, khô dầu, tăng ma sát và hao phí năng lượng; bảo dưỡng giúp máy chạy êm, hiệu suất cao.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Năng lượng sinh khối gồm","options":["A. rơm rạ, gỗ, chất thải hữu cơ, biogas","B. than đá, dầu mỏ","C. uranium","D. pin lithium"],"answer":"A","explain":"Năng lượng sinh khối từ rơm rạ, gỗ, chất thải hữu cơ, biogas...","points":0.25},{"type":"mcq","level":"NB","q":"Điện gió Bạc Liêu khai thác nguồn năng lượng","options":["A. gió","B. mặt trời","C. thủy triều","D. địa nhiệt"],"answer":"A","explain":"Điện gió Bạc Liêu dùng tuabin gió khai thác cơ năng của gió ven biển.","points":0.25},{"type":"mcq","level":"NB","q":"Thủy điện là nguồn năng lượng","options":["A. tái tạo","B. hóa thạch","C. hạt nhân","D. không tái tạo"],"answer":"A","explain":"Thủy điện khai thác năng lượng của dòng nước, là năng lượng tái tạo.","points":0.25},{"type":"mcq","level":"TH","q":"Mỗi lần biến đổi năng lượng đều","options":["A. có một phần hao phí","B. không hao phí gì","C. sinh thêm năng lượng","D. mất hết năng lượng"],"answer":"A","explain":"Mỗi lần biến đổi năng lượng đều có một phần hao phí (thường thành nhiệt năng vô ích), nên hiệu suất luôn dưới 100%.","points":0.25},{"type":"mcq","level":"TH","q":"Hiệu ứng nhà kính chủ yếu do","options":["A. khí CO2 từ đốt nhiên liệu hóa thạch","B. năng lượng mặt trời","C. năng lượng gió","D. thủy điện"],"answer":"A","explain":"Đốt nhiên liệu hóa thạch thải CO2 gây hiệu ứng nhà kính, biến đổi khí hậu.","points":0.25},{"type":"mcq","level":"VD","q":"Một khu công nghiệp muốn giảm phát thải CO2. Giải pháp về năng lượng hợp lý là","options":["A. lắp điện mặt trời mái nhà xưởng, dùng thiết bị hiệu suất cao","B. đốt thêm than đá","C. dùng máy phát diesel cũ","D. tăng số lò hơi đốt dầu"],"answer":"A","explain":"Lắp điện mặt trời mái nhà và dùng thiết bị hiệu suất cao vừa giảm phát thải vừa tiết kiệm chi phí lâu dài.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về các nguồn tái tạo ở Việt Nam:","statements":["a) Việt Nam có tiềm năng điện mặt trời lớn.","b) Việt Nam có tiềm năng điện gió ven biển.","c) Thủy điện đã được khai thác nhiều ở Việt Nam.","d) Việt Nam không có nguồn năng lượng tái tạo nào."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: Việt Nam giàu tiềm năng mặt trời, gió, thủy điện. d) Sai.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về hao phí năng lượng:","statements":["a) Mỗi lần biến đổi năng lượng đều có hao phí.","b) Hiệu suất máy luôn dưới 100%.","c) Bảo dưỡng tốt giúp giảm hao phí.","d) Có thể chế tạo máy hiệu suất trên 100%."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: không thể có máy hiệu suất trên 100% (vi phạm định luật bảo toàn năng lượng).","points":1},{"type":"short","level":"VDC","q":"Nêu chuỗi biến đổi năng lượng khi đun nước bằng bếp gas.","answer":"Hóa năng (gas) thành nhiệt năng","explain":"Gas cháy biến hóa năng thành nhiệt năng đun nóng nước (một phần hao phí ra môi trường).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao thủy điện được coi là nguồn năng lượng tái tạo dù cần xây đập lớn?","answer":"Vì nước được bổ sung liên tục bởi vòng tuần hoàn nước trong tự nhiên","explain":"Nước mưa bổ sung liên tục cho sông hồ theo vòng tuần hoàn nước nên thủy điện là năng lượng tái tạo; xây đập chỉ là công trình khai thác.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Động cơ đốt trong được dùng trên","options":["A. ô tô, xe máy, tàu thủy, máy phát điện","B. bóng đèn","C. quạt điện","D. máy tính"],"answer":"A","explain":"Động cơ đốt trong dùng trên ô tô, xe máy, tàu thủy, máy phát điện, máy nông nghiệp.","points":0.25},{"type":"mcq","level":"NB","q":"Nhiên liệu của động cơ xăng là","options":["A. xăng","B. dầu diesel","C. than đá","D. điện"],"answer":"A","explain":"Động cơ xăng dùng nhiên liệu xăng, đốt cháy bằng tia lửa điện của bugi.","points":0.25},{"type":"mcq","level":"NB","q":"Nhiên liệu của động cơ diesel là","options":["A. dầu diesel","B. xăng","C. gas","D. cồn"],"answer":"A","explain":"Động cơ diesel dùng nhiên liệu diesel (dầu diesel).","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của năng lượng hóa thạch so với năng lượng tái tạo là","options":["A. ổn định, chủ động, công nghệ sẵn có","B. vô tận","C. không gây ô nhiễm","D. miễn phí"],"answer":"A","explain":"Năng lượng hóa thạch ổn định, chủ động, công nghệ khai thác đã sẵn có, chi phí đầu tư thấp.","points":0.25},{"type":"mcq","level":"TH","q":"Nhược điểm của điện mặt trời, điện gió là","options":["A. phụ thuộc thời tiết, không ổn định","B. gây ô nhiễm nặng","C. cạn kiệt nhanh","D. chi phí vận hành rất cao"],"answer":"A","explain":"Điện mặt trời, điện gió phụ thuộc thời tiết (nắng, gió) nên công suất không ổn định.","points":0.25},{"type":"mcq","level":"VD","q":"Một tàu đánh cá xa bờ cần nguồn điện độc lập. Giải pháp phù hợp nhất là","options":["A. kết hợp pin mặt trời và máy phát diesel dự phòng","B. kéo điện lưới ra biển","C. chỉ dùng nến","D. không dùng điện"],"answer":"A","explain":"Tàu xa bờ: kết hợp pin mặt trời (sạch, chủ động ban ngày) với máy phát diesel dự phòng là giải pháp khả thi.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về động cơ đốt trong: (2):","statements":["a) Biến nhiệt năng thành cơ năng.","b) Động cơ xăng dùng bugi đánh lửa.","c) Động cơ diesel tự bốc cháy do nén.","d) Dùng rộng rãi trong giao thông vận tải."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng, tóm tắt về động cơ đốt trong.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về phát triển bền vững:","statements":["a) Cần giảm dần phụ thuộc vào nhiên liệu hóa thạch.","b) Cần phát triển năng lượng tái tạo.","c) Cần sử dụng năng lượng tiết kiệm, hiệu quả.","d) Nên đốt càng nhiều than đá càng tốt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo hướng phát triển bền vững. d) Sai: đốt than đá gây ô nhiễm, cần hạn chế.","points":1},{"type":"short","level":"VDC","q":"Nêu hai ứng dụng của động cơ diesel trong đời sống.","answer":"Xe tải, tàu thủy (máy phát điện, máy nông nghiệp)","explain":"Động cơ diesel khỏe, tiết kiệm nhiên liệu nên dùng cho xe tải, tàu thủy, máy phát điện, máy nông nghiệp.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao động cơ diesel thường dùng cho xe tải nặng mà ít dùng cho xe máy?","answer":"Vì diesel khỏe, tiết kiệm nhưng nặng, ồn, rung hơn động cơ xăng","explain":"Động cơ diesel moment xoắn lớn, tiết kiệm nhiên liệu, phù hợp xe tải; nhưng nặng, ồn, rung nên ít dùng cho xe máy nhỏ nhẹ.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Quang năng là năng lượng của","options":["A. ánh sáng","B. dòng điện","C. chuyển động","D. liên kết hóa học"],"answer":"A","explain":"Quang năng là năng lượng của ánh sáng.","points":0.25},{"type":"mcq","level":"NB","q":"Nhiệt năng là năng lượng gắn với","options":["A. độ nóng của vật","B. ánh sáng","C. dòng điện","D. vị trí của vật"],"answer":"A","explain":"Nhiệt năng gắn với độ nóng của vật (chuyển động nhiệt của phân tử).","points":0.25},{"type":"mcq","level":"NB","q":"Cơ năng gồm","options":["A. động năng và thế năng","B. quang năng và hóa năng","C. điện năng và nhiệt năng","D. hóa năng và quang năng"],"answer":"A","explain":"Cơ năng gồm động năng (chuyển động) và thế năng (vị trí).","points":0.25},{"type":"mcq","level":"TH","q":"Khi phanh xe, cơ năng của xe chuyển thành","options":["A. nhiệt năng ở má phanh","B. quang năng","C. hóa năng","D. không chuyển thành gì"],"answer":"A","explain":"Phanh xe biến cơ năng thành nhiệt năng làm nóng má phanh (hao phí).","points":0.25},{"type":"mcq","level":"TH","q":"Ắc quy (pin) khi phóng điện biến đổi","options":["A. hóa năng thành điện năng","B. cơ năng thành điện năng","C. quang năng thành điện năng","D. nhiệt năng thành điện năng"],"answer":"A","explain":"Ắc quy dự trữ hóa năng, khi phóng điện biến hóa năng thành điện năng.","points":0.25},{"type":"mcq","level":"VD","q":"Một học sinh nói: năng lượng mặt trời là vô tận nên dùng thoải mái không cần tiết kiệm. Nhận xét đúng là","options":["A. sai, vì thiết bị khai thác có hạn và mọi hao phí đều tốn kém","B. đúng hoàn toàn","C. sai vì mặt trời sẽ tắt ngay","D. đúng vì không tốn tiền"],"answer":"A","explain":"Dù nguồn vô tận nhưng thiết bị khai thác tốn kém, mỗi lần biến đổi đều hao phí nên vẫn cần sử dụng tiết kiệm, hiệu quả.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về biến đổi năng lượng: (4):","statements":["a) Ắc quy: hóa năng thành điện năng.","b) Bóng đèn: điện năng thành quang năng.","c) Quạt điện: điện năng thành cơ năng.","d) Pin mặt trời: nhiệt năng thành điện năng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: pin mặt trời biến quang năng thành điện năng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về hiệu quả năng lượng:","statements":["a) Đèn LED hiệu quả hơn đèn sợi đốt.","b) Động cơ điện hiệu suất cao hơn động cơ đốt trong.","c) Biến tần giúp tiết kiệm điện cho động cơ.","d) Thiết bị càng cũ càng tiết kiệm điện."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thiết bị cũ hiệu suất giảm, tốn điện hơn.","points":1},{"type":"short","level":"VDC","q":"Nêu chuỗi biến đổi năng lượng khi dùng quạt điện.","answer":"Điện năng thành cơ năng (cánh quạt quay)","explain":"Quạt điện biến điện năng thành cơ năng làm quay cánh quạt tạo gió (một phần hao phí thành nhiệt).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao đèn sợi đốt tốn điện hơn đèn LED khi cho cùng độ sáng?","answer":"Vì đèn sợi đốt biến phần lớn điện năng thành nhiệt năng vô ích","explain":"Đèn sợi đốt biến phần lớn điện năng thành nhiệt năng (nóng) chỉ một phần nhỏ thành quang năng; đèn LED biến phần lớn thành quang năng nên hiệu quả hơn.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Nguồn năng lượng nào sau đây có thể cạn kiệt?","options":["A. Dầu mỏ","B. Ánh sáng mặt trời","C. Gió","D. Nước sông"],"answer":"A","explain":"Dầu mỏ là nhiên liệu hóa thạch có hạn, có thể cạn kiệt; mặt trời, gió, nước được bổ sung liên tục.","points":0.25},{"type":"mcq","level":"NB","q":"Khí thải chính gây hiệu ứng nhà kính khi đốt nhiên liệu hóa thạch là","options":["A. CO2","B. O2","C. N2","D. H2"],"answer":"A","explain":"Đốt nhiên liệu hóa thạch thải khí CO2 gây hiệu ứng nhà kính.","points":0.25},{"type":"mcq","level":"NB","q":"Năng lượng mặt trời ở Việt Nam dồi dào nhất ở","options":["A. Nam Trung Bộ (Ninh Thuận, Bình Thuận)","B. vùng núi cao phía Bắc","C. đồng bằng sông Hồng","D. Bắc Trung Bộ"],"answer":"A","explain":"Nam Trung Bộ (Ninh Thuận, Bình Thuận) nắng nhiều nhất, tiềm năng điện mặt trời lớn nhất Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà máy nhiệt điện đốt than biến đổi","options":["A. hóa năng thành nhiệt năng thành cơ năng thành điện năng","B. quang năng thành điện năng","C. cơ năng thành hóa năng","D. điện năng thành nhiệt năng"],"answer":"A","explain":"Nhiệt điện than: đốt than (hóa năng thành nhiệt năng), hơi nước làm quay tuabin (thành cơ năng), máy phát tạo điện (thành điện năng).","points":0.25},{"type":"mcq","level":"TH","q":"Biogas đun nấu trong gia đình nông thôn biến đổi","options":["A. hóa năng thành nhiệt năng","B. quang năng thành điện năng","C. cơ năng thành điện năng","D. điện năng thành nhiệt năng"],"answer":"A","explain":"Biogas cháy biến hóa năng dự trữ thành nhiệt năng đun nấu.","points":0.25},{"type":"mcq","level":"VD","q":"Một thành phố muốn giảm kẹt xe và ô nhiễm. Giải pháp giao thông bền vững là","options":["A. phát triển xe buýt điện, xe đạp, đường sắt đô thị","B. cấm mọi phương tiện","C. chỉ dùng xe máy xăng","D. mở thêm đường cho ô tô xăng"],"answer":"A","explain":"Giao thông bền vững: phát triển phương tiện công cộng chạy điện, xe đạp, đường sắt đô thị để giảm phát thải.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về năng lượng ở Việt Nam:","statements":["a) Thủy điện là nguồn điện quan trọng của Việt Nam.","b) Điện mặt trời phát triển mạnh ở Ninh Thuận.","c) Điện gió phát triển ở Bạc Liêu.","d) Việt Nam chỉ dùng nhiệt điện than."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Việt Nam dùng đa dạng nguồn điện: thủy điện, nhiệt điện, điện mặt trời, điện gió...","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tương lai năng lượng:","statements":["a) Xu hướng là tăng tỉ trọng năng lượng tái tạo.","b) Xe điện dần thay thế xe xăng.","c) Tiết kiệm năng lượng luôn cần thiết.","d) Có thể quay lại chỉ dùng năng lượng hóa thạch."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo xu hướng phát triển bền vững. d) Sai: hóa thạch đang cạn kiệt và gây ô nhiễm.","points":1},{"type":"short","level":"VDC","q":"Nêu hai lợi ích của việc phát triển điện mặt trời mái nhà ở Việt Nam.","answer":"Giảm tiền điện, giảm tải lưới điện (bảo vệ môi trường)","explain":"Điện mặt trời mái nhà giúp hộ gia đình giảm tiền điện, giảm tải cho lưới điện quốc gia và giảm phát thải.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao nói tiết kiệm năng lượng cũng là một nguồn năng lượng?","answer":"Vì mỗi đơn vị năng lượng tiết kiệm được tương đương một đơn vị không phải sản xuất thêm","explain":"Tiết kiệm năng lượng giúp giảm nhu cầu sản xuất điện, giảm đầu tư nhà máy và giảm ô nhiễm — hiệu quả như tạo thêm nguồn năng lượng.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Thiết bị biến quang năng thành điện năng là","options":["A. pin mặt trời","B. động cơ điện","C. ắc quy","D. bóng đèn"],"answer":"A","explain":"Pin mặt trời (tấm quang điện) biến quang năng thành điện năng.","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị biến điện năng thành cơ năng là","options":["A. động cơ điện","B. pin mặt trời","C. ắc quy","D. bếp điện"],"answer":"A","explain":"Động cơ điện biến điện năng thành cơ năng.","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị biến cơ năng thành điện năng là","options":["A. máy phát điện","B. động cơ điện","C. bóng đèn","D. quạt điện"],"answer":"A","explain":"Máy phát điện biến cơ năng (tuabin quay) thành điện năng.","points":0.25},{"type":"mcq","level":"TH","q":"Trong tuabin gió, cánh quạt quay nhờ","options":["A. động năng của gió","B. quang năng","C. hóa năng","D. nhiệt năng"],"answer":"A","explain":"Gió thổi (động năng) làm quay cánh quạt tuabin.","points":0.25},{"type":"mcq","level":"TH","q":"Trong nhà máy thủy điện, tuabin quay nhờ","options":["A. thế năng của nước trên cao","B. quang năng mặt trời","C. sức gió","D. nhiên liệu đốt"],"answer":"A","explain":"Nước từ trên cao chảy xuống (thế năng) làm quay tuabin.","points":0.25},{"type":"mcq","level":"VD","q":"Một hộ gia đình lắp điện mặt trời mái nhà 3 kWp. Vào ngày nắng tốt, hệ thống này chủ yếu giúp","options":["A. giảm đáng kể tiền điện ban ngày","B. sưởi ấm nhà vào mùa đông","C. chạy được mọi thiết bị cả đêm không cần lưới","D. bán điện thu lãi lớn"],"answer":"A","explain":"Điện mặt trời mái nhà phát mạnh ban ngày nắng tốt, giúp giảm tiền điện ban ngày; ban đêm vẫn cần lưới điện hoặc ắc quy lưu trữ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về thiết bị biến đổi năng lượng:","statements":["a) Pin mặt trời: quang năng thành điện năng.","b) Động cơ điện: điện năng thành cơ năng.","c) Máy phát điện: cơ năng thành điện năng.","d) Bếp gas: điện năng thành nhiệt năng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bếp gas biến hóa năng thành nhiệt năng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về sử dụng năng lượng hợp lý:","statements":["a) Nên dùng thiết bị có hiệu suất cao.","b) Nên tận dụng ánh sáng tự nhiên.","c) Nên bảo dưỡng máy móc định kỳ.","d) Nên bật điều hòa ở nhiệt độ thấp nhất có thể."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đặt nhiệt độ quá thấp gây tốn điện và hại sức khỏe; nên đặt 26–28°C.","points":1},{"type":"short","level":"VDC","q":"Nêu chuỗi biến đổi năng lượng trong máy phát điện diesel.","answer":"Hóa năng (diesel) thành nhiệt năng thành cơ năng thành điện năng","explain":"Diesel cháy (hóa năng thành nhiệt năng), đẩy pít-tông (thành cơ năng), quay máy phát tạo điện năng.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao các tấm pin mặt trời thường đặt nghiêng về hướng Nam ở Việt Nam?","answer":"Để hứng được nhiều ánh sáng mặt trời nhất trong ngày","explain":"Ở Bắc bán cầu, mặt trời lệch về phía Nam; đặt tấm pin nghiêng về hướng Nam giúp hứng nắng tối đa, tăng hiệu suất phát điện.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Năm dạng năng lượng cơ bản gồm","options":["A. cơ năng, nhiệt năng, điện năng, hóa năng, quang năng","B. cơ năng, thủy năng, phong năng","C. điện năng, từ năng, âm năng","D. hóa năng, sinh năng, tử năng"],"answer":"A","explain":"Năm dạng năng lượng cơ bản: cơ năng, nhiệt năng, điện năng, hóa năng, quang năng.","points":0.25},{"type":"mcq","level":"NB","q":"Định luật bảo toàn năng lượng khẳng định","options":["A. năng lượng chỉ chuyển hóa từ dạng này sang dạng khác","B. năng lượng tự sinh ra","C. năng lượng tự mất đi","D. chỉ cơ năng được bảo toàn"],"answer":"A","explain":"Năng lượng không tự sinh ra cũng không tự mất đi, chỉ chuyển hóa từ dạng này sang dạng khác.","points":0.25},{"type":"mcq","level":"NB","q":"Năng lượng tái tạo có đặc điểm","options":["A. vô tận, ít ô nhiễm","B. cạn kiệt nhanh","C. gây ô nhiễm nặng","D. không khai thác được"],"answer":"A","explain":"Năng lượng tái tạo hầu như vô tận và ít gây ô nhiễm.","points":0.25},{"type":"mcq","level":"TH","q":"Động cơ đốt trong và động cơ điện khác nhau ở","options":["A. dạng năng lượng đầu vào (nhiệt năng và điện năng)","B. đều dùng xăng","C. đều phát thải","D. không có điểm khác"],"answer":"A","explain":"Động cơ đốt trong biến nhiệt năng (từ nhiên liệu cháy) thành cơ năng; động cơ điện biến điện năng thành cơ năng.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp nào KHÔNG giúp tiết kiệm năng lượng?","options":["A. Dùng thiết bị cũ, hiệu suất thấp","B. Dùng đèn LED","C. Tắt thiết bị khi không dùng","D. Bảo dưỡng máy định kỳ"],"answer":"A","explain":"Thiết bị cũ hiệu suất thấp gây tốn năng lượng; các biện pháp còn lại đều giúp tiết kiệm.","points":0.25},{"type":"mcq","level":"VD","q":"Một trường học muốn giáo dục học sinh về năng lượng tái tạo. Hoạt động thực tế nhất là","options":["A. lắp mô hình pin mặt trời mini và đo điện tạo ra","B. đốt than để xem khói","C. mua xăng về thí nghiệm","D. chỉ học lý thuyết"],"answer":"A","explain":"Mô hình pin mặt trời mini giúp học sinh trực quan thấy quá trình biến quang năng thành điện năng, đo đạc được.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (tổng kết bài):","statements":["a) Có 5 dạng năng lượng cơ bản.","b) Động cơ đốt trong biến nhiệt năng thành cơ năng.","c) Mặt trời, gió, thủy điện là năng lượng tái tạo.","d) Than đá, dầu mỏ là năng lượng tái tạo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: than đá, dầu mỏ là nhiên liệu hóa thạch.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về trách nhiệm:","statements":["a) Mỗi người đều có thể tiết kiệm năng lượng.","b) Học sinh có thể tuyên truyền năng lượng tái tạo.","c) Tiết kiệm năng lượng góp phần bảo vệ môi trường.","d) Bảo vệ môi trường là việc của riêng nhà nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bảo vệ môi trường là trách nhiệm của mọi người.","points":1},{"type":"short","level":"VDC","q":"Tóm tắt vai trò của năng lượng tái tạo trong tương lai.","answer":"Thay thế dần nhiên liệu hóa thạch, giảm ô nhiễm, phát triển bền vững","explain":"Năng lượng tái tạo vô tận, ít ô nhiễm sẽ thay thế dần nhiên liệu hóa thạch đang cạn kiệt, hướng tới phát triển bền vững.","points":0.5},{"type":"short","level":"VDC","q":"Một quốc gia có nên chỉ phát triển một loại năng lượng duy nhất không? Vì sao?","answer":"Không, nên đa dạng hóa để đảm bảo an ninh năng lượng","explain":"Mỗi nguồn năng lượng có ưu, nhược điểm riêng; đa dạng hóa (hóa thạch, tái tạo, hạt nhân...) giúp đảm bảo cung cấp điện ổn định, an toàn.","points":0.5}]}]}</script>
