 chắn an toàn là vi phạm nghiêm trọng, dễ gây tai nạn chết người.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về đúc, rèn, hàn:","statements":["a) Đúc rót kim loại lỏng vào khuôn.","b) Rèn biến dạng kim loại.","c) Hàn nung chảy mép để nối.","d) Cả ba thuộc cắt gọt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thuộc gia công không phoi.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về văn hóa an toàn:","statements":["a) An toàn là trách nhiệm mọi người.","b) Báo cáo nguy cơ tiềm ẩn.","c) Tai nạn người khác không liên quan mình.","d) Học từ sự cố để phòng ngừa."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai.","points":1},{"type":"short","level":"VDC","q":"Kể tên ba loại robot công nghiệp.","answer":"Robot hàn, robot sơn, robot lắp ráp","explain":"Robot hàn, robot sơn, robot lắp ráp, robot vận chuyển...","points":0.5},{"type":"short","level":"VDC","q":"Phân biệt tai nạn lao động và bệnh nghề nghiệp.","answer":"Tai nạn đột ngột do sự cố; bệnh nghề nghiệp phát sinh dần do tiếp xúc lâu dài","explain":"Tai nạn: sự cố đột ngột. Bệnh nghề nghiệp: tiếp xúc lâu dài với yếu tố độc hại.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Dập dùng để","options":["A. tạo hình chi tiết từ tấm kim loại","B. cắt gọt","C. rót kim loại lỏng","D. khoan lỗ"],"answer":"A","explain":"Dập: dùng khuôn và lực ép tạo hình chi tiết từ tấm kim loại.","points":0.25},{"type":"mcq","level":"NB","q":"In 3D là công nghệ","options":["A. bồi đắp theo lớp","B. cắt gọt","C. đúc","D. rèn"],"answer":"A","explain":"In 3D: công nghệ bồi đắp đắp dần vật liệu theo lớp.","points":0.25},{"type":"mcq","level":"NB","q":"Biển báo nguy hiểm có tác dụng","options":["A. cảnh báo, nhắc nhở phòng tránh","B. trang trí","C. quảng cáo","D. không tác dụng"],"answer":"A","explain":"Biển báo cảnh báo nguy cơ, nhắc nhở phòng tránh.","points":0.25},{"type":"mcq","level":"TH","q":"Nhiệt luyện nhằm","options":["A. tăng độ cứng, độ bền","B. làm nhẹ","C. thay đổi kích thước","D. làm đẹp"],"answer":"A","explain":"Nhiệt luyện (tôi, ram) tăng độ cứng, độ bền chi tiết.","points":0.25},{"type":"mcq","level":"TH","q":"Doanh nghiệp nhỏ vốn ít nên","options":["A. cơ khí hóa, tự động từng phần phù hợp","B. vay nợ đầu tư toàn phần ngay","C. không đổi mới","D. giảm lương"],"answer":"A","explain":"Doanh nghiệp nhỏ: cơ khí hóa, tự động từng phần phù hợp vốn, nâng dần.","points":0.25},{"type":"mcq","level":"VD","q":"Công nhân bị đứt tay khi vận hành máy. Xử lý đúng là","options":["A. dừng máy, cầm máu bằng gạc sạch, đưa đi y tế","B. cho máy chạy tiếp","C. rắc ớt bột","D. để tự cầm"],"answer":"A","explain":"Dừng máy, ấn gạc sạch cầm máu, đưa đến y tế.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về in 3D:","statements":["a) Công nghệ bồi đắp theo lớp.","b) Chế tạo từ mô hình số.","c) Phù hợp mẫu thử.","d) Rẻ hơn mọi phương pháp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: in 3D đắt, chậm.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về phòng cháy:","statements":["a) Xưởng phải có bình chữa cháy.","b) Bình phải kiểm định định kỳ.","c) Lối thoát hiểm thông thoáng.","d) Cháy dùng thang máy thoát nhanh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: không dùng thang máy khi cháy.","points":1},{"type":"short","level":"VDC","q":"Nêu hai sản phẩm gia đình chế tạo bằng dập.","answer":"Nồi, chậu nhôm (vỏ nồi cơm điện, lon)","explain":"Dập tấm: nồi, chậu nhôm, vỏ nồi cơm điện, lon nước ngọt...","points":0.5},{"type":"short","level":"VDC","q":"Nêu ba quyền của người lao động về an toàn.","answer":"Được huấn luyện, được bảo hộ, được từ chối việc nguy hiểm","explain":"Được huấn luyện, trang bị bảo hộ, khám sức khỏe định kỳ, từ chối việc nguy hiểm.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Mài là phương pháp","options":["A. cắt gọt tinh cho độ chính xác cao","B. không phoi","C. nung chảy","D. đúc"],"answer":"A","explain":"Mài: cắt gọt tinh bằng đá mài, độ chính xác và độ nhẵn rất cao.","points":0.25},{"type":"mcq","level":"NB","q":"Lợi ích của tự động hóa KHÔNG bao gồm","options":["A. tăng số công nhân","B. năng suất cao","C. chất lượng ổn định","D. giảm việc nặng nhọc"],"answer":"A","explain":"Tự động hóa giảm nhu cầu lao động trực tiếp.","points":0.25},{"type":"mcq","level":"NB","q":"Giẻ lau dính dầu là","options":["A. chất thải nguy hại","B. rác sinh hoạt","C. phân bón","D. thức ăn gia súc"],"answer":"A","explain":"Giẻ dính dầu là chất thải nguy hại, dễ cháy, phải xử lý riêng.","points":0.25},{"type":"mcq","level":"TH","q":"Chi tiết lỗ chính xác cao: quy trình thường là","options":["A. khoan rồi doa","B. chỉ khoan","C. đúc là đủ","D. hàn rồi khoan"],"answer":"A","explain":"Khoan rồi doa tinh (hoặc mài lỗ) cho lỗ chính xác cao.","points":0.25},{"type":"mcq","level":"TH","q":"Con người vượt trội robot ở","options":["A. sáng tạo, quyết định phức tạp","B. lặp đi lặp lại","C. làm trong lò nung","D. nâng vật nặng"],"answer":"A","explain":"Con người vượt trội ở sáng tạo, tư duy, quyết định phức tạp.","points":0.25},{"type":"mcq","level":"VD","q":"Khu dân cư khiếu nại xưởng ồn, khói bụi. Xưởng nên","options":["A. lắp cách âm, lọc bụi, tuân thủ quy hoạch","B. hoạt động mạnh hơn","C. đuổi dân","D. mặc kệ"],"answer":"A","explain":"Lắp chống ồn, lọc bụi, xử lý chất thải, tuân thủ quy hoạch di dời.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về độ chính xác:","statements":["a) Đúc kém chính xác hơn tiện.","b) Mài chính xác hơn tiện.","c) Khoan kém chính xác hơn doa.","d) Mọi phương pháp như nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về kinh tế môi trường:","statements":["a) Tái chế phoi vừa kinh tế vừa BVMT.","b) Công nghệ sạch giảm chi phí lâu dài.","c) Phạt ô nhiễm nặng hơn chi phí xử lý.","d) Ô nhiễm không tốn chi phí xã hội."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai.","points":1},{"type":"short","level":"VDC","q":"Vì sao lưỡi dao cắt phải cứng hơn vật liệu gia công?","answer":"Vì dao mềm hơn sẽ mòn, gãy mà không cắt được","explain":"Dao phải cứng hơn phoi mới tách được phoi; dao làm bằng thép gió, hợp kim cứng.","points":0.5},{"type":"short","level":"VDC","q":"Nêu trách nhiệm của doanh nghiệp và người lao động về môi trường.","answer":"Doanh nghiệp xử lý chất thải đúng luật; người lao động phân loại rác, tiết kiệm","explain":"Doanh nghiệp: xử lý chất thải, công nghệ sạch. Người lao động: phân loại rác, tiết kiệm, tuân thủ quy định.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Khâu đầu tiên của sản xuất cơ khí là","options":["A. chuẩn bị sản xuất","B. lắp ráp","C. đóng gói","D. kiểm tra"],"answer":"A","explain":"Quá trình bắt đầu từ khâu chuẩn bị.","points":0.25},{"type":"mcq","level":"NB","q":"Bốn công nghệ 4.0 là","options":["A. IoT, AI, Big Data, in 3D","B. hơi nước, điện, máy tính, Internet","C. sắt, thép, đồng, nhôm","D. tiện, phay, bào, khoan"],"answer":"A","explain":"IoT, AI, Big Data, in 3D.","points":0.25},{"type":"mcq","level":"NB","q":"An toàn lao động nhằm","options":["A. bảo vệ sức khỏe, tính mạng người lao động","B. tăng lợi nhuận","C. giảm công nhân","D. trang trí xưởng"],"answer":"A","explain":"Bảo vệ sức khỏe, tính mạng người lao động.","points":0.25},{"type":"mcq","level":"TH","q":"Phoi là","options":["A. phần vật liệu bị tách ra khi cắt gọt","B. sản phẩm hoàn chỉnh","C. dụng cụ cắt","D. nhiên liệu"],"answer":"A","explain":"Phoi: phần vật liệu bị dao tách ra khi cắt gọt.","points":0.25},{"type":"mcq","level":"TH","q":"Tự động hóa và việc làm: quan điểm đúng","options":["A. máy thay việc nặng nhọc, người chuyển sang việc trí tuệ","B. máy thay hoàn toàn người","C. không cần học","D. nên cấm tự động hóa"],"answer":"A","explain":"Máy thay việc nặng nhọc đơn điệu; người chuyển sang giám sát, sáng tạo.","points":0.25},{"type":"mcq","level":"VD","q":"Học sinh tốt nghiệp muốn làm công nhân giỏi, an toàn. Điều quan trọng nhất","options":["A. vững quy trình, kỷ luật, ý thức an toàn","B. làm thật nhanh","C. không cần học","D. chỉ cần sức khỏe"],"answer":"A","explain":"Vững chuyên môn, tuân thủ quy trình, ý thức an toàn quan trọng nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (tổng kết):","statements":["a) 5 khâu sản xuất.","b) 2 nhóm gia công.","c) 3 mức tự động hóa.","d) 4 công nghệ 4.0."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng: công thức nhớ nhanh Phần 3.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về ý thức:","statements":["a) Thấy nguy cơ báo cáo ngay.","b) Nhắc nhở đồng nghiệp vi phạm.","c) Học tập nâng cao hiểu biết.","d) An toàn việc của riêng cán bộ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: là trách nhiệm mọi người.","points":1},{"type":"short","level":"VDC","q":"Tóm tắt công thức nhớ nhanh Phần 3.","answer":"5 khâu, 2 nhóm, 3 mức, 4 công nghệ, 3 trụ cột","explain":"5 khâu sản xuất, 2 nhóm gia công, 3 mức tự động hóa, 4 công nghệ 4.0, 3 trụ cột an toàn.","points":0.5},{"type":"short","level":"VDC","q":"Nêu thông điệp về an toàn và môi trường.","answer":"An toàn là trên hết; sản xuất gắn với bảo vệ môi trường","explain":"Luôn đặt an toàn lên hàng đầu; sản xuất phải đi đôi với bảo vệ môi trường.","points":0.5}]}]}</script>
