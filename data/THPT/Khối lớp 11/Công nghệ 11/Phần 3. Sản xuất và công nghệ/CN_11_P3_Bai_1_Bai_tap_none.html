<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Quá trình sản xuất cơ khí là","options":["A. toàn bộ công việc từ chuẩn bị sản xuất đến khi tạo ra sản phẩm hoàn chỉnh","B. chỉ công việc gia công trên máy","C. chỉ công việc lắp ráp","D. chỉ công việc đóng gói"],"answer":"A","explain":"Quá trình sản xuất cơ khí là toàn bộ các công việc từ chuẩn bị sản xuất đến khi tạo ra sản phẩm hoàn chỉnh.","points":0.25},{"type":"mcq","level":"NB","q":"Phôi là","options":["A. vật liệu đã được tạo hình gần giống chi tiết, chờ gia công tiếp","B. sản phẩm hoàn chỉnh","C. vật liệu thô chưa qua xử lý","D. phế liệu"],"answer":"A","explain":"Phôi là bán thành phẩm đã có hình dáng gần giống chi tiết, được tạo ra bằng đúc, rèn, dập... chờ gia công tinh.","points":0.25},{"type":"mcq","level":"NB","q":"Gia công không phoi là gia công","options":["A. không tách phoi khỏi vật liệu","B. tách phoi khỏi vật liệu","C. không cần máy móc","D. không cần vật liệu"],"answer":"A","explain":"Gia công không phoi (đúc, rèn, dập, hàn) tạo hình chi tiết mà không tách phoi.","points":0.25},{"type":"mcq","level":"TH","q":"Thứ tự đúng của quá trình sản xuất cơ khí là","options":["A. chuẩn bị, chế tạo phôi, gia công, lắp ráp, kiểm tra đóng gói","B. gia công, chế tạo phôi, chuẩn bị, lắp ráp","C. lắp ráp, gia công, chế tạo phôi, chuẩn bị","D. chuẩn bị, lắp ráp, gia công, chế tạo phôi"],"answer":"A","explain":"Thứ tự: chuẩn bị sản xuất → chế tạo phôi → gia công cơ khí → lắp ráp → kiểm tra, đóng gói.","points":0.25},{"type":"mcq","level":"TH","q":"Phương pháp nào sau đây thuộc gia công không phoi? (1):","options":["A. Đúc","B. Tiện","C. Phay","D. Khoan"],"answer":"A","explain":"Đúc thuộc gia công không phoi; tiện, phay, khoan thuộc gia công cắt gọt (có phoi).","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết thân máy có hình dạng phức tạp, khối lượng lớn. Phương pháp chế tạo phôi phù hợp nhất là","options":["A. đúc","B. tiện","C. phay","D. khoan"],"answer":"A","explain":"Chi tiết phức tạp, khối lớn như thân máy: đúc là phương pháp chế tạo phôi phù hợp nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về quá trình sản xuất:","statements":["a) Quá trình sản xuất bắt đầu từ khâu chuẩn bị.","b) Chế tạo phôi tạo hình dáng gần giống chi tiết.","c) Gia công cơ khí đạt độ chính xác yêu cầu.","d) Không cần kiểm tra sau khi lắp ráp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: sau lắp ráp phải kiểm tra chất lượng trước khi đóng gói.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về phân loại gia công:","statements":["a) Đúc, rèn, dập, hàn thuộc gia công không phoi.","b) Tiện, phay, bào, khoan thuộc gia công cắt gọt.","c) Gia công cắt gọt cho độ chính xác cao.","d) Gia công không phoi luôn cho độ chính xác cao hơn cắt gọt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: gia công cắt gọt cho độ chính xác cao hơn gia công không phoi.","points":1},{"type":"short","level":"VDC","q":"Nêu hai phương pháp chế tạo phôi thuộc nhóm gia công không phoi.","answer":"Đúc, rèn (dập, hàn)","explain":"Các phương pháp chế tạo phôi không phoi: đúc, rèn, dập, hàn.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao sau khi đúc phôi vẫn cần gia công cắt gọt?","answer":"Vì phôi đúc chưa đạt độ chính xác và độ nhẵn bề mặt yêu cầu","explain":"Phôi đúc có hình dáng gần đúng nhưng độ chính xác thấp, bề mặt thô nên cần gia công cắt gọt (tiện, phay...) để đạt yêu cầu kỹ thuật.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Tiện là phương pháp gia công","options":["A. phôi quay tròn, dao chuyển động, gia công mặt tròn xoay","B. dao quay tròn, phôi chuyển động","C. tạo lỗ","D. nung chảy vật liệu"],"answer":"A","explain":"Tiện: phôi quay tròn, dao chuyển động tịnh tiến — gia công các mặt tròn xoay (trục, bạc).","points":0.25},{"type":"mcq","level":"NB","q":"Phay là phương pháp gia công","options":["A. dao quay tròn, phôi chuyển động, gia công mặt phẳng, rãnh","B. phôi quay tròn","C. tạo lỗ tròn","D. nung chảy mép vật liệu"],"answer":"A","explain":"Phay: dao phay quay tròn, phôi chuyển động — gia công mặt phẳng, rãnh, bánh răng.","points":0.25},{"type":"mcq","level":"NB","q":"Khoan là phương pháp gia công để","options":["A. tạo lỗ trên chi tiết","B. tạo mặt phẳng","C. tạo ren ngoài","D. nối hai tấm thép"],"answer":"A","explain":"Khoan dùng mũi khoan tạo lỗ trên chi tiết.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn gia công một chiếc trục tròn xoay, phương pháp phù hợp nhất là","options":["A. tiện","B. phay","C. bào","D. hàn"],"answer":"A","explain":"Trục là chi tiết tròn xoay: tiện là phương pháp phù hợp nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn tạo rãnh then trên trục, phương pháp phù hợp là","options":["A. phay","B. tiện","C. đúc","D. hàn"],"answer":"A","explain":"Rãnh then là rãnh trên mặt trụ: phay rãnh là phương pháp phù hợp.","points":0.25},{"type":"mcq","level":"VD","q":"Một xưởng cần nối hai dầm thép thành khung nhà xưởng. Phương pháp phù hợp nhất là","options":["A. hàn","B. tiện","C. phay","D. khoan"],"answer":"A","explain":"Nối các kết cấu thép thành khung: hàn là phương pháp phù hợp (nung chảy mép vật liệu để dính liền).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về các phương pháp cắt gọt:","statements":["a) Tiện gia công mặt tròn xoay.","b) Phay gia công mặt phẳng, rãnh.","c) Khoan tạo lỗ.","d) Bào gia công mặt tròn xoay."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bào gia công mặt phẳng (dao hoặc phôi chuyển động tịnh tiến).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về lựa chọn phương pháp:","statements":["a) Chi tiết tròn xoay nên tiện.","b) Rãnh, mặt phẳng nên phay.","c) Lỗ nên khoan.","d) Mọi chi tiết đều nên đúc là xong."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đúc chỉ tạo phôi, chi tiết yêu cầu chính xác phải gia công cắt gọt tiếp.","points":1},{"type":"short","level":"VDC","q":"Phân biệt chuyển động của phôi và dao trong phương pháp tiện và phay.","answer":"Tiện: phôi quay, dao tịnh tiến; phay: dao quay, phôi tịnh tiến","explain":"Tiện: phôi quay tròn, dao chuyển động tịnh tiến. Phay: dao quay tròn, phôi chuyển động tịnh tiến.","points":0.5},{"type":"short","level":"VDC","q":"Nêu một ưu điểm của gia công cắt gọt so với gia công không phoi.","answer":"Độ chính xác và độ nhẵn bề mặt cao hơn","explain":"Gia công cắt gọt (tiện, phay...) cho độ chính xác kích thước và độ nhẵn bề mặt cao hơn đúc, rèn.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Quy trình công nghệ là","options":["A. trình tự các nguyên công biến phôi thành chi tiết hoàn chỉnh","B. danh sách máy móc trong xưởng","C. bảng lương công nhân","D. sơ đồ nhà xưởng"],"answer":"A","explain":"Quy trình công nghệ là trình tự các nguyên công để biến phôi thành chi tiết hoàn chỉnh.","points":0.25},{"type":"mcq","level":"NB","q":"Nguyên công là","options":["A. phần việc hoàn thành tại một vị trí làm việc (một máy)","B. toàn bộ quá trình sản xuất","C. một bước nhỏ nhất","D. ca làm việc của công nhân"],"answer":"A","explain":"Nguyên công là phần việc được hoàn thành tại một vị trí làm việc (thường là một máy), gồm nhiều bước.","points":0.25},{"type":"mcq","level":"NB","q":"Đúc là phương pháp","options":["A. rót kim loại lỏng vào khuôn, để nguội thành chi tiết","B. cắt gọt bằng dao","C. nung chảy mép để nối","D. khoan lỗ"],"answer":"A","explain":"Đúc: rót kim loại lỏng vào khuôn, để nguội đông đặc thành chi tiết.","points":0.25},{"type":"mcq","level":"TH","q":"Rèn, dập khác đúc ở điểm","options":["A. làm biến dạng kim loại (thường nung nóng) thay vì rót lỏng vào khuôn","B. không cần nhiệt","C. chỉ dùng cho nhựa","D. không cần lực"],"answer":"A","explain":"Rèn, dập dùng lực ép, đập làm biến dạng dẻo kim loại (thường nung nóng); đúc rót kim loại lỏng vào khuôn.","points":0.25},{"type":"mcq","level":"TH","q":"Trong quy trình gia công trục, nguyên công tiện thực hiện trên","options":["A. máy tiện","B. máy phay","C. máy khoan","D. máy hàn"],"answer":"A","explain":"Nguyên công tiện thực hiện trên máy tiện.","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết yêu cầu độ chính xác cao, bề mặt nhẵn bóng. Công đoạn cuối cùng thường là","options":["A. mài tinh","B. đúc","C. rèn","D. hàn"],"answer":"A","explain":"Mài là phương pháp cắt gọt tinh cho độ chính xác và độ nhẵn rất cao, thường là nguyên công cuối.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về quy trình công nghệ:","statements":["a) Quy trình công nghệ gồm trình tự các nguyên công.","b) Mỗi nguyên công thực hiện tại một máy.","c) Nguyên công gồm nhiều bước.","d) Không cần quy trình công nghệ khi sản xuất."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: quy trình công nghệ là tài liệu quan trọng, bắt buộc trong sản xuất.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về ý nghĩa quy trình công nghệ:","statements":["a) Quy trình hợp lý nâng cao năng suất.","b) Quy trình hợp lý đảm bảo chất lượng.","c) Quy trình hợp lý giảm giá thành.","d) Quy trình càng nhiều nguyên công càng tốt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: quy trình cần hợp lý, gọn; quá nhiều nguyên công gây tốn kém.","points":1},{"type":"short","level":"VDC","q":"Nêu ba nguyên công trong quy trình gia công một chiếc trục đơn giản.","answer":"Cắt phôi, tiện, khoan lỗ tâm (nhiệt luyện, mài tinh, kiểm tra)","explain":"Quy trình gia công trục: cắt phôi → tiện → khoan lỗ tâm → nhiệt luyện → mài tinh → kiểm tra.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao quy trình công nghệ được coi là tài liệu quan trọng nhất trong xưởng cơ khí?","answer":"Vì nó hướng dẫn công nhân thực hiện đúng trình tự, đảm bảo chất lượng và năng suất","explain":"Quy trình công nghệ quy định trình tự nguyên công, máy, dụng cụ, chế độ cắt... giúp sản xuất đúng, đều, chất lượng ổn định.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Hàn là phương pháp","options":["A. nung nóng chảy mép vật liệu để dính liền","B. cắt gọt bằng dao","C. rót kim loại lỏng vào khuôn","D. khoan lỗ"],"answer":"A","explain":"Hàn nung nóng chảy mép các chi tiết để chúng dính liền thành một khối.","points":0.25},{"type":"mcq","level":"NB","q":"Bào là phương pháp gia công","options":["A. dao hoặc phôi chuyển động tịnh tiến, gia công mặt phẳng","B. phôi quay tròn","C. dao quay tròn","D. tạo lỗ"],"answer":"A","explain":"Bào: dao hoặc phôi chuyển động tịnh tiến qua lại để gia công mặt phẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm của quá trình đúc gọi là","options":["A. vật đúc (phôi đúc)","B. phoi","C. chi tiết hoàn chỉnh","D. nguyên liệu"],"answer":"A","explain":"Sản phẩm của quá trình đúc là vật đúc (thường là phôi đúc, cần gia công tiếp).","points":0.25},{"type":"mcq","level":"TH","q":"Phoi là","options":["A. phần vật liệu bị tách ra khi gia công cắt gọt","B. sản phẩm hoàn chỉnh","C. dụng cụ cắt","D. nhiên liệu"],"answer":"A","explain":"Phoi là phần vật liệu bị dao cắt tách ra khỏi phôi trong gia công cắt gọt.","points":0.25},{"type":"mcq","level":"TH","q":"Chi tiết chịu lực lớn như trục khuỷu thường được chế tạo phôi bằng","options":["A. rèn","B. đúc áp lực nhỏ","C. hàn","D. dán"],"answer":"A","explain":"Rèn làm kim loại biến dạng dẻo, thớ kim loại tốt nên chi tiết chịu lực lớn (trục khuỷu) thường rèn phôi.","points":0.25},{"type":"mcq","level":"VD","q":"Một xưởng chỉ có máy tiện và máy khoan. Muốn gia công mặt phẳng của tấm thép, xưởng","options":["A. không gia công được tốt, cần máy phay hoặc máy bào","B. vẫn gia công tốt bằng máy tiện","C. dùng máy khoan để phay","D. dùng tay để bào"],"answer":"A","explain":"Mặt phẳng gia công bằng phay hoặc bào; máy tiện (tròn xoay) và máy khoan (lỗ) không phù hợp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về đúc, rèn, hàn:","statements":["a) Đúc rót kim loại lỏng vào khuôn.","b) Rèn dùng lực làm biến dạng kim loại.","c) Hàn nung chảy mép để nối.","d) Cả ba đều thuộc gia công cắt gọt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cả ba thuộc gia công không phoi.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về phoi:","statements":["a) Phoi sinh ra trong gia công cắt gọt.","b) Đúc, rèn không sinh phoi.","c) Phoi có thể thu hồi tái chế.","d) Gia công càng chính xác thì phoi càng nhiều."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: phoi kim loại được thu hồi nấu lại. d) Sai: không có quan hệ như vậy.","points":1},{"type":"short","level":"VDC","q":"Nêu ưu điểm của phương pháp đúc so với gia công cắt gọt.","answer":"Chế tạo được chi tiết phức tạp, khối lớn; ít hao vật liệu; năng suất cao","explain":"Đúc tạo được chi tiết phức tạp, khối lớn mà cắt gọt khó làm; ít hao vật liệu, năng suất cao, giá thành thấp.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao chi tiết rèn thường bền hơn chi tiết đúc cùng vật liệu?","answer":"Vì rèn làm thớ kim loại mịn, chắc, không có khuyết tật đúc","explain":"Rèn biến dạng dẻo làm thớ kim loại mịn, đặc chắc, loại bỏ rỗ khí nên bền hơn vật đúc.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Khâu đầu tiên của quá trình sản xuất cơ khí là","options":["A. chuẩn bị sản xuất","B. lắp ráp","C. đóng gói","D. kiểm tra"],"answer":"A","explain":"Quá trình sản xuất bắt đầu từ khâu chuẩn bị: vật liệu, dụng cụ, thiết bị, bản vẽ, quy trình.","points":0.25},{"type":"mcq","level":"NB","q":"Khâu cuối cùng của quá trình sản xuất cơ khí là","options":["A. kiểm tra, đóng gói","B. chế tạo phôi","C. gia công","D. chuẩn bị"],"answer":"A","explain":"Sau lắp ráp là kiểm tra chất lượng, đóng gói, nhập kho — khâu cuối của quá trình sản xuất.","points":0.25},{"type":"mcq","level":"NB","q":"Lắp ráp là công việc","options":["A. lắp các chi tiết thành cụm máy, sản phẩm","B. cắt phôi","C. nấu chảy kim loại","D. đóng gói sản phẩm"],"answer":"A","explain":"Lắp ráp là lắp các chi tiết đã gia công thành cụm máy, sản phẩm hoàn chỉnh.","points":0.25},{"type":"mcq","level":"TH","q":"Một chi tiết sau khi tiện còn cần mài tinh vì","options":["A. tiện chưa đạt độ chính xác và độ nhẵn yêu cầu","B. tiện làm hỏng chi tiết","C. mài để trang trí","D. quy định bắt buộc mọi chi tiết"],"answer":"A","explain":"Tiện là gia công thô/bán tinh; chi tiết yêu cầu chính xác cao, bề mặt nhẵn cần nguyên công mài tinh tiếp theo.","points":0.25},{"type":"mcq","level":"TH","q":"Nhiệt luyện (tôi) trong quy trình gia công nhằm mục đích","options":["A. tăng độ cứng, độ bền cho chi tiết","B. làm chi tiết nhẹ hơn","C. thay đổi kích thước","D. làm đẹp bề mặt"],"answer":"A","explain":"Nhiệt luyện (tôi, ram...) làm thay đổi cơ tính, tăng độ cứng, độ bền cho chi tiết.","points":0.25},{"type":"mcq","level":"VD","q":"Một xưởng sản xuất ốc vít hàng loạt. Để năng suất cao, giá thành thấp, nên","options":["A. dập phôi rồi cán ren tự động","B. tiện từng chiếc ốc","C. đúc từng chiếc ốc","D. hàn từng chiếc ốc"],"answer":"A","explain":"Sản xuất hàng loạt ốc vít: dập phôi và cán ren trên dây chuyền tự động cho năng suất cao, giá thành thấp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về các khâu sản xuất:","statements":["a) Chuẩn bị sản xuất gồm vật liệu, dụng cụ, bản vẽ.","b) Chế tạo phôi bằng đúc, rèn, dập.","c) Gia công cơ khí bằng tiện, phay, khoan.","d) Lắp ráp thực hiện trước khi chế tạo phôi."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lắp ráp thực hiện sau khi đã gia công xong các chi tiết.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về sản xuất hàng loạt:","statements":["a) Nên dùng phương pháp năng suất cao như dập, đúc.","b) Nên chuyên môn hóa máy móc, đồ gá.","c) Quy trình công nghệ càng chi tiết càng tốt.","d) Sản xuất đơn chiếc không cần quy trình công nghệ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: dù sản xuất đơn chiếc vẫn cần quy trình công nghệ.","points":1},{"type":"short","level":"VDC","q":"Nêu thứ tự các khâu chính của quá trình sản xuất cơ khí.","answer":"Chuẩn bị, chế tạo phôi, gia công, lắp ráp, kiểm tra đóng gói","explain":"Quá trình sản xuất cơ khí: chuẩn bị sản xuất → chế tạo phôi → gia công cơ khí → lắp ráp → kiểm tra, đóng gói.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao khâu kiểm tra phải thực hiện ở nhiều công đoạn chứ không chỉ ở cuối?","answer":"Để phát hiện lỗi sớm, tránh lãng phí gia công tiếp trên phế phẩm","explain":"Kiểm tra giữa các công đoạn phát hiện lỗi sớm, loại bỏ phế phẩm kịp thời, tránh tốn công gia công tiếp và đảm bảo chất lượng cuối.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Gia công cắt gọt còn gọi là gia công","options":["A. có phoi","B. không phoi","C. áp lực","D. nhiệt"],"answer":"A","explain":"Gia công cắt gọt tách phoi khỏi phôi nên còn gọi là gia công có phoi.","points":0.25},{"type":"mcq","level":"NB","q":"Dụng cụ cắt gọt trong phương pháp tiện gọi là","options":["A. dao tiện","B. mũi khoan","C. dao phay","D. lưỡi cưa"],"answer":"A","explain":"Dụng cụ cắt trong phương pháp tiện gọi là dao tiện.","points":0.25},{"type":"mcq","level":"NB","q":"Dụng cụ tạo lỗ trong phương pháp khoan gọi là","options":["A. mũi khoan","B. dao tiện","C. dao phay","D. đá mài"],"answer":"A","explain":"Dụng cụ tạo lỗ trong phương pháp khoan gọi là mũi khoan.","points":0.25},{"type":"mcq","level":"TH","q":"Để gia công bánh răng, phương pháp thường dùng là","options":["A. phay răng hoặc chuốt răng","B. tiện trơn","C. khoan","D. hàn"],"answer":"A","explain":"Bánh răng có răng: gia công bằng phay răng, chuốt răng hoặc các phương pháp chuyên dùng khác.","points":0.25},{"type":"mcq","level":"TH","q":"Mài khác tiện ở điểm","options":["A. dùng đá mài, cho độ chính xác và độ nhẵn rất cao","B. không cần máy","C. không tách phoi","D. chỉ dùng cho gỗ"],"answer":"A","explain":"Mài dùng đá mài (hạt mài) cắt gọt, cho độ chính xác và độ nhẵn bề mặt rất cao, thường là nguyên công tinh cuối.","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết yêu cầu lỗ có độ chính xác cao. Quy trình lỗ thường là","options":["A. khoan rồi doa (hoặc mài lỗ)","B. chỉ khoan một lần","C. đúc là đủ","D. hàn rồi khoan"],"answer":"A","explain":"Khoan cho độ chính xác thấp; lỗ chính xác cao cần khoan rồi doa tinh (hoặc mài lỗ).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về dụng cụ cắt:","statements":["a) Tiện dùng dao tiện.","b) Phay dùng dao phay.","c) Khoan dùng mũi khoan.","d) Mài dùng đá mài."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng: mỗi phương pháp cắt gọt có dụng cụ cắt đặc trưng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về độ chính xác:","statements":["a) Đúc cho độ chính xác thấp hơn tiện.","b) Mài cho độ chính xác cao hơn tiện.","c) Khoan thường kém chính xác hơn doa.","d) Phương pháp nào cũng cho độ chính xác như nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo thứ tự độ chính xác tăng dần. d) Sai.","points":1},{"type":"short","level":"VDC","q":"Nêu tên phương pháp gia công phù hợp cho từng yêu cầu: mặt tròn xoay, mặt phẳng, lỗ.","answer":"Tiện, phay (bào), khoan","explain":"Mặt tròn xoay: tiện; mặt phẳng, rãnh: phay (hoặc bào); lỗ: khoan (rồi doa nếu cần chính xác).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao lưỡi dao cắt gọt phải cứng hơn vật liệu gia công?","answer":"Vì dao mềm hơn sẽ bị mòn, gãy mà không cắt được vật liệu","explain":"Dao cắt phải cứng hơn phôi mới tách được phoi; dao thường làm bằng thép gió, hợp kim cứng.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Bước là","options":["A. phần nhỏ nhất của nguyên công","B. toàn bộ quy trình","C. một ca làm việc","D. một loại máy"],"answer":"A","explain":"Bước là phần việc nhỏ nhất trong một nguyên công (ví dụ: tiện một bậc trục là một bước).","points":0.25},{"type":"mcq","level":"NB","q":"Một nguyên công tiện trục gồm 3 bước. Điều này có nghĩa là","options":["A. trên máy tiện thực hiện 3 phần việc nhỏ liên tiếp","B. cần 3 máy tiện","C. cần 3 công nhân","D. mất 3 ngày"],"answer":"A","explain":"Một nguyên công gồm nhiều bước thực hiện liên tiếp tại một máy (một vị trí làm việc).","points":0.25},{"type":"mcq","level":"NB","q":"Phôi thép tròn trước khi tiện thường được","options":["A. cắt theo chiều dài yêu cầu","B. nung chảy","C. hàn lại","D. sơn"],"answer":"A","explain":"Phôi thanh tròn được cắt (cưa) theo chiều dài yêu cầu trước khi đưa lên máy tiện.","points":0.25},{"type":"mcq","level":"TH","q":"Trong quy trình công nghệ, nguyên công kiểm tra thường đặt","options":["A. sau các nguyên công quan trọng và ở cuối","B. chỉ ở đầu","C. không cần đặt","D. thay cho gia công"],"answer":"A","explain":"Kiểm tra đặt sau các nguyên công quan trọng và ở cuối quy trình để phát hiện lỗi kịp thời.","points":0.25},{"type":"mcq","level":"TH","q":"Đồ gá trong gia công có tác dụng","options":["A. định vị và kẹp chặt phôi","B. cắt phoi","C. đo kích thước","D. bôi trơn"],"answer":"A","explain":"Đồ gá dùng để định vị và kẹp chặt phôi trên máy, đảm bảo gia công chính xác, nhanh.","points":0.25},{"type":"mcq","level":"VD","q":"Một xưởng sản xuất hàng loạt chi tiết giống nhau. Biện pháp nâng cao năng suất là","options":["A. dùng đồ gá chuyên dùng và quy trình hợp lý","B. gia công thủ công từng chiếc","C. bỏ khâu kiểm tra","D. dùng máy hỏng"],"answer":"A","explain":"Sản xuất hàng loạt: dùng đồ gá chuyên dùng, quy trình hợp lý, chuyên môn hóa để nâng năng suất, đảm bảo chất lượng đều.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nguyên công và bước:","statements":["a) Nguyên công thực hiện tại một máy.","b) Một nguyên công gồm nhiều bước.","c) Bước là phần việc nhỏ nhất.","d) Mỗi bước phải thực hiện trên một máy khác nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: các bước của một nguyên công thực hiện liên tiếp tại cùng một máy.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tổ chức sản xuất:","statements":["a) Sản xuất đơn chiếc: quy trình linh hoạt.","b) Sản xuất hàng loạt: chuyên môn hóa cao.","c) Sản xuất hàng khối: tự động hóa cao.","d) Mọi loại hình sản xuất đều không cần quy trình."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo đặc điểm các loại hình sản xuất. d) Sai: loại hình nào cũng cần quy trình công nghệ.","points":1},{"type":"short","level":"VDC","q":"Phân biệt nguyên công và bước trong quy trình công nghệ.","answer":"Nguyên công là phần việc tại một máy, bước là phần việc nhỏ nhất trong nguyên công","explain":"Nguyên công: phần việc hoàn thành tại một vị trí làm việc (một máy). Bước: phần việc nhỏ nhất trong nguyên công.","points":0.5},{"type":"short","level":"VDC","q":"Nêu tác dụng của đồ gá trong gia công hàng loạt.","answer":"Định vị nhanh, kẹp chặt chắc, đảm bảo chính xác và năng suất","explain":"Đồ gá giúp định vị nhanh, kẹp chặt phôi chắc chắn, đảm bảo độ chính xác đều cho hàng loạt chi tiết, nâng cao năng suất.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Phương pháp nào sau đây KHÔNG thuộc gia công cắt gọt?","options":["A. Đúc","B. Tiện","C. Phay","D. Mài"],"answer":"A","explain":"Đúc thuộc gia công không phoi; tiện, phay, mài thuộc gia công cắt gọt.","points":0.25},{"type":"mcq","level":"NB","q":"Phương pháp nào sau đây thuộc gia công không phoi? (2):","options":["A. Rèn","B. Tiện","C. Khoan","D. Mài"],"answer":"A","explain":"Rèn thuộc gia công không phoi (gia công áp lực).","points":0.25},{"type":"mcq","level":"NB","q":"Chế tạo phôi bằng đúc phù hợp với","options":["A. chi tiết phức tạp, khối lớn","B. chi tiết nhỏ đơn giản","C. chi tiết cần độ chính xác cao ngay","D. mọi chi tiết"],"answer":"A","explain":"Đúc phù hợp chi tiết phức tạp, khối lớn (thân máy, vỏ hộp); chi tiết cần chính xác cao phải gia công tiếp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao rèn phôi trước khi gia công cắt gọt đối với chi tiết chịu lực lớn?","options":["A. Vì chi tiết rèn bền, chịu lực tốt hơn","B. Vì rèn rẻ hơn đúc","C. Vì rèn không cần máy","D. Vì rèn nhanh hơn tiện"],"answer":"A","explain":"Rèn làm thớ kim loại mịn, đặc chắc nên chi tiết chịu lực lớn (trục khuỷu) bền hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Hàn được dùng phổ biến trong","options":["A. kết cấu thép (khung, dầm, cầu)","B. gia công lỗ nhỏ","C. tạo mặt phẳng nhẵn","D. chế tạo lò xo"],"answer":"A","explain":"Hàn dùng để nối các kết cấu thép: khung nhà xưởng, dầm cầu, ống dẫn.","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết máy bị gãy cần sửa chữa nhanh tại công trường. Biện pháp thường dùng là","options":["A. hàn đắp rồi gia công lại","B. đúc lại chi tiết mới","C. rèn lại từ đầu","D. bỏ đi mua mới"],"answer":"A","explain":"Sửa chữa tại chỗ: hàn đắp phần gãy rồi gia công lại là nhanh và kinh tế nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ứng dụng phương pháp:","statements":["a) Thân máy phức tạp: nên đúc phôi.","b) Trục chịu lực lớn: nên rèn phôi.","c) Khung thép: nên hàn.","d) Chi tiết chính xác cao: chỉ cần đúc là đủ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chi tiết chính xác cao cần gia công cắt gọt (tiện, mài...) sau khi tạo phôi.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về kinh tế kỹ thuật:","statements":["a) Đúc ít hao vật liệu hơn cắt gọt từ phôi thanh.","b) Rèn tốn năng lượng nung nóng.","c) Cắt gọt cho phoi có thể tái chế.","d) Phương pháp nào cũng có chi phí như nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mỗi phương pháp có chi phí khác nhau, phải chọn hợp lý.","points":1},{"type":"short","level":"VDC","q":"Nêu hai lĩnh vực ứng dụng của công nghệ hàn trong đời sống.","answer":"Kết cấu xây dựng (nhà xưởng, cầu), đóng tàu (ống dẫn, bồn chứa)","explain":"Hàn dùng rộng rãi trong kết cấu thép xây dựng, đóng tàu, chế tạo ống dẫn, bồn chứa, sửa chữa máy móc.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao ngày nay hàn được dùng nhiều thay cho đinh tán trong kết cấu thép?","answer":"Vì mối hàn kín, bền, nhẹ hơn và thi công nhanh hơn đinh tán","explain":"Hàn cho mối nối kín, bền chắc, nhẹ hơn dùng đinh tán, thi công nhanh, tiết kiệm vật liệu.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Quá trình sản xuất cơ khí KHÔNG gồm khâu nào?","options":["A. Trồng trọt","B. Chuẩn bị sản xuất","C. Gia công cơ khí","D. Lắp ráp"],"answer":"A","explain":"Quá trình sản xuất cơ khí gồm chuẩn bị, chế tạo phôi, gia công, lắp ráp, kiểm tra đóng gói; không gồm trồng trọt.","points":0.25},{"type":"mcq","level":"NB","q":"Dập là phương pháp","options":["A. dùng khuôn và lực ép tạo hình chi tiết từ tấm kim loại","B. cắt gọt bằng dao","C. rót kim loại lỏng","D. khoan lỗ"],"answer":"A","explain":"Dập dùng khuôn và lực ép (máy dập) tạo hình chi tiết từ tấm kim loại (vỏ xe, nắp...).","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm của dập tấm là","options":["A. chi tiết dạng tấm vỏ (vỏ xe, nắp, chậu)","B. phôi tròn","C. phoi","D. thỏi kim loại"],"answer":"A","explain":"Dập tấm tạo các chi tiết dạng vỏ mỏng: vỏ ô tô, nắp, chậu, lon...","points":0.25},{"type":"mcq","level":"TH","q":"Vỏ ô tô được chế tạo bằng phương pháp","options":["A. dập tấm","B. tiện","C. khoan","D. đúc cát"],"answer":"A","explain":"Vỏ ô tô là chi tiết dạng tấm vỏ lớn: dập tấm trên máy dập công suất lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Lon nước ngọt bằng nhôm được chế tạo bằng","options":["A. dập vuốt","B. tiện","C. hàn","D. đúc"],"answer":"A","explain":"Lon nước ngọt (dạng cốc mỏng) được chế tạo bằng dập vuốt từ tấm nhôm.","points":0.25},{"type":"mcq","level":"VD","q":"Một xưởng cần sản xuất 10.000 chiếc nắp chai kim loại. Phương pháp tối ưu là","options":["A. dập trên khuôn chuyên dùng","B. tiện từng chiếc","C. đúc từng chiếc","D. cắt tay"],"answer":"A","explain":"Sản xuất hàng loạt chi tiết tấm: dập trên khuôn chuyên dùng cho năng suất rất cao, giá thành thấp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về dập:","statements":["a) Dập dùng khuôn và lực ép.","b) Dập tạo chi tiết từ tấm kim loại.","c) Dập thuộc gia công không phoi.","d) Dập cho năng suất rất cao."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng về phương pháp dập.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về chọn phương pháp:","statements":["a) Chi tiết tấm vỏ số lượng lớn: nên dập.","b) Chi tiết tròn xoay: nên tiện.","c) Chi tiết khối lớn phức tạp: nên đúc.","d) Chi tiết nào cũng nên tiện cho nhanh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mỗi hình dạng chi tiết có phương pháp phù hợp riêng.","points":1},{"type":"short","level":"VDC","q":"Nêu hai sản phẩm trong gia đình được chế tạo bằng phương pháp dập.","answer":"Nồi, chậu nhôm (vỏ nồi cơm điện, lon)","explain":"Dập tấm tạo các sản phẩm gia dụng: nồi, chậu nhôm, vỏ nồi cơm điện, lon nước ngọt...","points":0.5},{"type":"short","level":"VDC","q":"Vì sao dập cho năng suất cao hơn tiện khi sản xuất chi tiết tấm hàng loạt?","answer":"Vì một lần dập tạo ngay hình dạng, không phải cắt gọt từng chút","explain":"Dập dùng khuôn tạo hình chi tiết trong một vài nhát ép, rất nhanh; tiện phải cắt gọt từng lớp nên chậm hơn nhiều với chi tiết tấm.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Các khâu của quá trình sản xuất cơ khí theo thứ tự là","options":["A. chuẩn bị – chế tạo phôi – gia công – lắp ráp – kiểm tra, đóng gói","B. gia công – chuẩn bị – lắp ráp – chế tạo phôi","C. lắp ráp – gia công – chuẩn bị – chế tạo phôi","D. chuẩn bị – lắp ráp – gia công – chế tạo phôi"],"answer":"A","explain":"Thứ tự đúng: chuẩn bị → chế tạo phôi → gia công → lắp ráp → kiểm tra, đóng gói.","points":0.25},{"type":"mcq","level":"NB","q":"Hai nhóm gia công cơ khí là","options":["A. gia công không phoi và gia công cắt gọt","B. gia công nóng và gia công lạnh","C. gia công tay và gia công máy","D. gia công trong và gia công ngoài"],"answer":"A","explain":"Gia công cơ khí chia thành gia công không phoi (đúc, rèn, dập, hàn) và gia công cắt gọt (tiện, phay, bào, khoan, mài).","points":0.25},{"type":"mcq","level":"NB","q":"Quy trình công nghệ gồm","options":["A. trình tự các nguyên công","B. danh sách công nhân","C. bảng giá vật liệu","D. sơ đồ điện xưởng"],"answer":"A","explain":"Quy trình công nghệ là trình tự các nguyên công biến phôi thành chi tiết.","points":0.25},{"type":"mcq","level":"TH","q":"Phôi là gì?","options":["A. Bán thành phẩm gần giống chi tiết, chờ gia công tiếp","B. Sản phẩm hoàn chỉnh","C. Phoi vụn","D. Dụng cụ cắt"],"answer":"A","explain":"Phôi là bán thành phẩm đã có hình dáng gần giống chi tiết, tạo bằng đúc, rèn, dập...","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên công là gì?","options":["A. Phần việc hoàn thành tại một máy","B. Toàn bộ quá trình sản xuất","C. Một ngày làm việc","D. Một loại vật liệu"],"answer":"A","explain":"Nguyên công là phần việc hoàn thành tại một vị trí làm việc (một máy).","points":0.25},{"type":"mcq","level":"VD","q":"Một kỹ sư lập quy trình gia công chi tiết mới. Việc đầu tiên cần làm là","options":["A. phân tích bản vẽ chi tiết, xác định yêu cầu kỹ thuật","B. mua máy mới","C. tuyển công nhân","D. đóng gói sản phẩm"],"answer":"A","explain":"Lập quy trình công nghệ bắt đầu từ phân tích bản vẽ: hình dạng, kích thước, độ chính xác, vật liệu, số lượng... rồi mới chọn phương pháp, máy.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (tổng kết):","statements":["a) Đúc, rèn, dập, hàn: không phoi.","b) Tiện, phay, khoan, mài: có phoi.","c) Tiện: tròn xoay; phay: mặt phẳng, rãnh.","d) Mọi phương pháp đều cho độ chính xác như nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: độ chính xác khác nhau theo phương pháp.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về sản xuất hiện đại:","statements":["a) Quy trình công nghệ là tài liệu bắt buộc.","b) Kiểm tra thực hiện ở nhiều công đoạn.","c) Phôi kim loại tái chế được.","d) Sản xuất không cần quan tâm môi trường."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: sản xuất hiện đại phải bảo vệ môi trường (bài 3).","points":1},{"type":"short","level":"VDC","q":"Tóm tắt vai trò của từng khâu trong quá trình sản xuất cơ khí.","answer":"Chuẩn bị tạo điều kiện, chế tạo phôi tạo hình, gia công đạt chính xác, lắp ráp thành sản phẩm, kiểm tra đảm bảo chất lượng","explain":"Chuẩn bị: vật liệu, dụng cụ, bản vẽ. Chế tạo phôi: tạo hình gần đúng. Gia công: đạt chính xác. Lắp ráp: thành cụm máy. Kiểm tra: đảm bảo chất lượng.","points":0.5},{"type":"short","level":"VDC","q":"Một học sinh muốn làm mô hình xe từ bìa cứng. Hãy nêu các bước theo trình tự sản xuất cơ khí.","answer":"Chuẩn bị (bìa, kéo, keo, bản vẽ), tạo phôi (cắt các tấm), gia công (tỉa chi tiết), lắp ráp, kiểm tra hoàn thiện","explain":"Áp dụng trình tự sản xuất: chuẩn bị → tạo phôi (cắt) → gia công (tỉa, khoét) → lắp ráp → kiểm tra, hoàn thiện mô hình.","points":0.5}]}]}</script>
