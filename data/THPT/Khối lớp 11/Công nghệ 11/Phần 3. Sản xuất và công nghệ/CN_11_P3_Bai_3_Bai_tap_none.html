<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Nguyên nhân chủ yếu gây tai nạn lao động trong sản xuất cơ khí là","options":["A. con người (chủ quan, vi phạm quy trình)","B. thiên tai","C. động đất","D. mưa bão"],"answer":"A","explain":"Phần lớn tai nạn lao động xuất phát từ con người: chủ quan, vi phạm quy trình, không dùng đồ bảo hộ.","points":0.25},{"type":"mcq","level":"NB","q":"Biện pháp kỹ thuật đảm bảo an toàn về điện là","options":["A. nối đất vỏ máy, dùng aptomat chống rò điện","B. đi chân đất","C. chạm tay vào dây điện","D. bỏ hết cầu chì"],"answer":"A","explain":"Nối đất vỏ máy điện và dùng aptomat chống rò điện là biện pháp kỹ thuật chống điện giật.","points":0.25},{"type":"mcq","level":"NB","q":"Thợ hàn cần trang bị bảo hộ nào?","options":["A. Mặt nạ hàn, găng tay da, tạp dề chống cháy","B. Quần đùi, áo cộc","C. Kính râm thời trang","D. Không cần gì"],"answer":"A","explain":"Thợ hàn tiếp xúc tia lửa, tia tử ngoại, kim loại nóng chảy: cần mặt nạ hàn, găng tay da, tạp dề chống cháy.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải che chắn các bộ phận chuyển động của máy?","options":["A. Để tránh quần áo, tay chân bị cuốn vào gây tai nạn","B. Để máy đẹp hơn","C. Để máy chạy nhanh hơn","D. Để tiết kiệm điện"],"answer":"A","explain":"Bộ phận chuyển động (dây đai, bánh răng, trục quay) có thể cuốn quần áo, tay chân gây tai nạn nghiêm trọng nên phải che chắn.","points":0.25},{"type":"mcq","level":"TH","q":"Trước khi sửa chữa máy, việc bắt buộc phải làm là","options":["A. ngắt điện và treo biển báo","B. để máy chạy","C. nhờ người khác trông","D. sửa thật nhanh"],"answer":"A","explain":"Sửa chữa máy phải ngắt điện, treo biển báo để tránh người khác vô tình khởi động máy gây tai nạn.","points":0.25},{"type":"mcq","level":"VD","q":"Một công nhân vận hành máy tiện mà không đeo kính bảo hộ. Nguy cơ lớn nhất là","options":["A. phoi bắn vào mắt gây thương tích","B. máy chạy chậm","C. tốn điện","D. ồn ào"],"answer":"A","explain":"Tiện tạo phoi bắn ra với tốc độ cao, dễ bắn vào mắt gây thương tích nghiêm trọng nếu không đeo kính bảo hộ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nguyên nhân tai nạn:","statements":["a) Máy không có che chắn gây tai nạn.","b) Rò điện gây tai nạn điện giật.","c) Vi phạm quy trình là nguyên nhân từ con người.","d) Tai nạn lao động chủ yếu do thiên tai."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tai nạn lao động chủ yếu do máy móc, điện và con người.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về biện pháp an toàn:","statements":["a) Che chắn bộ phận chuyển động.","b) Nối đất vỏ máy điện.","c) Đeo đồ bảo hộ cá nhân.","d) Được phép đùa nghịch trong xưởng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nghiêm cấm đùa nghịch trong xưởng sản xuất.","points":1},{"type":"short","level":"VDC","q":"Nêu ba trụ cột đảm bảo an toàn lao động.","answer":"Biện pháp kỹ thuật, bảo hộ cá nhân, chấp hành quy trình kỷ luật","explain":"Ba trụ cột: biện pháp kỹ thuật (che chắn, nối đất), trang bị bảo hộ cá nhân, chấp hành quy trình và kỷ luật lao động.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao ý thức kỷ luật được coi là biện pháp an toàn quan trọng nhất?","answer":"Vì phần lớn tai nạn xuất phát từ chủ quan, vi phạm quy trình của con người","explain":"Máy móc có che chắn tốt đến đâu mà con người chủ quan, vi phạm quy trình thì tai nạn vẫn xảy ra; ý thức kỷ luật quyết định.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Ô nhiễm không khí trong xưởng cơ khí chủ yếu từ","options":["A. hàn, đúc, sơn, mài (khói hàn, bụi kim loại, hơi sơn)","B. trồng cây","C. nuôi cá","D. văn phòng"],"answer":"A","explain":"Hàn, đúc, sơn, mài sinh khói hàn, bụi kim loại, hơi sơn gây ô nhiễm không khí.","points":0.25},{"type":"mcq","level":"NB","q":"Nước thải trong sản xuất cơ khí chứa","options":["A. dầu mỡ, hóa chất, kim loại nặng","B. nước sạch","C. nước mưa","D. nước suối"],"answer":"A","explain":"Nước thải từ tẩy rửa, làm nguội, xi mạ chứa dầu mỡ, hóa chất, kim loại nặng, phải xử lý trước khi thải.","points":0.25},{"type":"mcq","level":"NB","q":"Chất thải rắn trong xưởng cơ khí gồm","options":["A. phoi, xỉ, dầu thải, giẻ lau dính dầu","B. rau củ","C. giấy vụn văn phòng duy nhất","D. thức ăn thừa"],"answer":"A","explain":"Chất thải rắn cơ khí: phoi kim loại, xỉ, bao bì, dầu thải, giẻ lau dính dầu...","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp xử lý bụi, khí thải trong xưởng là","options":["A. lắp hệ thống hút, lọc bụi, xử lý khí thải","B. mở cửa cho bay ra ngoài","C. không cần xử lý","D. đốt thêm"],"answer":"A","explain":"Xưởng cơ khí phải lắp hệ thống hút, lọc bụi và xử lý khí thải đạt chuẩn trước khi thải ra môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Phoi kim loại trong xưởng nên được","options":["A. phân loại, thu hồi tái chế","B. đổ ra sông","C. đốt bỏ","D. chôn lấp bừa bãi"],"answer":"A","explain":"Phoi kim loại là tài nguyên: phân loại, thu hồi để nấu lại tái chế, vừa kinh tế vừa bảo vệ môi trường.","points":0.25},{"type":"mcq","level":"VD","q":"Một xưởng xi mạ xả thẳng nước thải ra sông. Hậu quả là","options":["A. ô nhiễm nguồn nước, ảnh hưởng sức khỏe cộng đồng, bị xử phạt","B. không ảnh hưởng gì","C. làm sạch sông","D. tăng thu nhập"],"answer":"A","explain":"Nước thải xi mạ chứa kim loại nặng, hóa chất độc hại: xả thẳng gây ô nhiễm nghiêm trọng, ảnh hưởng sức khỏe và bị pháp luật xử phạt.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ô nhiễm cơ khí:","statements":["a) Hàn, sơn gây ô nhiễm không khí.","b) Xi mạ gây ô nhiễm nước.","c) Phoi kim loại là chất thải rắn.","d) Sản xuất cơ khí không gây tiếng ồn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: máy dập, máy nén khí... gây tiếng ồn, rung.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về xử lý chất thải:","statements":["a) Khí thải phải qua hệ thống lọc.","b) Nước thải phải xử lý đạt chuẩn.","c) Phoi kim loại nên tái chế.","d) Dầu thải đổ đâu cũng được."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: dầu thải là chất thải nguy hại, phải thu gom xử lý đúng quy định.","points":1},{"type":"short","level":"VDC","q":"Nêu bốn loại ô nhiễm trong sản xuất cơ khí.","answer":"Khí thải bụi, nước thải, chất thải rắn, tiếng ồn rung","explain":"Bốn loại ô nhiễm: khí thải/bụi, nước thải, chất thải rắn, tiếng ồn và rung động.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao nước thải xi mạ nguy hiểm hơn nước thải sinh hoạt?","answer":"Vì chứa kim loại nặng và hóa chất độc hại khó phân hủy","explain":"Nước thải xi mạ chứa kim loại nặng (crôm, niken...), axit, hóa chất độc hại, khó phân hủy, tích lũy trong môi trường và cơ thể.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Tiếng ồn trong xưởng cơ khí chủ yếu từ","options":["A. máy dập, máy nén khí, máy mài","B. máy tính","C. điều hòa","D. quạt trần"],"answer":"A","explain":"Máy dập, máy nén khí, máy mài, vận chuyển gây tiếng ồn, rung lớn.","points":0.25},{"type":"mcq","level":"NB","q":"Biện pháp chống tiếng ồn cho công nhân là","options":["A. đeo nút tai chống ồn, che chắn cách âm máy","B. mở nhạc to","C. hét to","D. không cần biện pháp"],"answer":"A","explain":"Chống ồn: che chắn, cách âm nguồn ồn; công nhân đeo nút tai, tai nghe chống ồn.","points":0.25},{"type":"mcq","level":"NB","q":"Dầu thải trong xưởng cơ khí là","options":["A. chất thải nguy hại, phải thu gom xử lý đúng quy định","B. nước sạch","C. đổ ra đất cũng được","D. dùng để nấu ăn"],"answer":"A","explain":"Dầu thải là chất thải nguy hại, phải thu gom, xử lý đúng quy định, không được đổ bừa bãi.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao xưởng cơ khí nên bố trí xa khu dân cư?","options":["A. Để giảm ảnh hưởng tiếng ồn, khí thải đến người dân","B. Để đất rẻ","C. Để công nhân đi xa","D. Không có lý do"],"answer":"A","explain":"Xưởng cơ khí gây ồn, khí thải, nên bố trí xa khu dân cư (kèm biện pháp xử lý) để bảo vệ sức khỏe cộng đồng.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghệ sạch trong sản xuất cơ khí là công nghệ","options":["A. ít phát thải, tiết kiệm năng lượng, thân thiện môi trường","B. đắt nhất","C. mới nhất","D. phức tạp nhất"],"answer":"A","explain":"Công nghệ sạch: ít phát thải, tiết kiệm năng lượng, vật liệu, thân thiện môi trường.","points":0.25},{"type":"mcq","level":"VD","q":"Một khu dân cư khiếu nại vì xưởng cơ khí bên cạnh ồn ào, khói bụi. Xưởng nên","options":["A. lắp cách âm, hệ thống lọc bụi và di dời theo quy hoạch","B. hoạt động mạnh hơn","C. đuổi dân đi","D. không quan tâm"],"answer":"A","explain":"Xưởng phải lắp biện pháp chống ồn, lọc bụi, xử lý chất thải và tuân thủ quy hoạch di dời — trách nhiệm với cộng đồng và pháp luật.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về biện pháp bảo vệ môi trường:","statements":["a) Lắp hệ thống hút, lọc bụi.","b) Xử lý nước thải đạt chuẩn.","c) Phân loại, tái chế phoi kim loại.","d) Xả thải trực tiếp cho nhanh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: xả thải trực tiếp vi phạm pháp luật, gây ô nhiễm.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về trách nhiệm môi trường:","statements":["a) Doanh nghiệp phải xử lý chất thải đúng luật.","b) Công nhân góp phần bằng phân loại rác.","c) Học sinh có thể tuyên truyền bảo vệ môi trường.","d) Bảo vệ môi trường chỉ là việc của nhà nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bảo vệ môi trường là trách nhiệm của mọi người.","points":1},{"type":"short","level":"VDC","q":"Nêu ba biện pháp giảm tiếng ồn trong xưởng cơ khí.","answer":"Che chắn cách âm máy, bố trí xưởng xa dân cư, công nhân đeo chống ồn","explain":"Giảm ồn: che chắn, cách âm nguồn ồn; bố trí mặt bằng hợp lý, xa khu dân cư; công nhân đeo nút tai chống ồn; bảo dưỡng máy tốt.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao phoi kim loại được coi là tài nguyên chứ không phải rác?","answer":"Vì phoi kim loại nấu lại tái chế được thành vật liệu mới","explain":"Phoi kim loại (sắt, đồng, nhôm...) thu gom nấu lại thành vật liệu mới, tiết kiệm tài nguyên, giảm khai thác quặng.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Khi vận hành máy, công nhân KHÔNG được","options":["A. đùa nghịch, vận hành khi mệt mỏi","B. đeo kính bảo hộ","C. kiểm tra máy trước khi chạy","D. đọc kỹ quy trình"],"answer":"A","explain":"Nghiêm cấm đùa nghịch, vận hành máy khi mệt mỏi, thiếu tỉnh táo — nguyên nhân hàng đầu gây tai nạn.","points":0.25},{"type":"mcq","level":"NB","q":"Biển báo nguy hiểm trong xưởng có tác dụng","options":["A. cảnh báo, nhắc nhở công nhân phòng tránh","B. trang trí","C. quảng cáo","D. không có tác dụng"],"answer":"A","explain":"Biển báo nguy hiểm (điện, máy quay, hóa chất...) cảnh báo, nhắc nhở công nhân phòng tránh tai nạn.","points":0.25},{"type":"mcq","level":"NB","q":"Ánh sáng trong xưởng sản xuất cần","options":["A. đầy đủ để nhìn rõ, tránh nhầm lẫn gây tai nạn","B. càng tối càng tốt","C. nhấp nháy","D. không cần thiết"],"answer":"A","explain":"Thiếu ánh sáng dễ nhìn nhầm, thao tác sai gây tai nạn; xưởng cần chiếu sáng đầy đủ.","points":0.25},{"type":"mcq","level":"TH","q":"Một công nhân tự ý tháo che chắn máy để làm nhanh hơn. Hành động này","options":["A. vi phạm quy trình, rất nguy hiểm","B. đáng khen vì nhanh","C. bình thường","D. giúp tăng năng suất"],"answer":"A","explain":"Tự ý tháo che chắn an toàn là vi phạm nghiêm trọng, dễ gây tai nạn chết người.","points":0.25},{"type":"mcq","level":"TH","q":"Sàn xưởng trơn trượt do dầu mỡ cần được","options":["A. vệ sinh sạch, rắc vật liệu chống trơn","B. để nguyên","C. đổ thêm dầu","D. phủ bạt"],"answer":"A","explain":"Sàn trơn trượt dễ gây ngã: phải vệ sinh sạch dầu mỡ, có biện pháp chống trơn, đi giày bảo hộ.","points":0.25},{"type":"mcq","level":"VD","q":"Một học sinh thực hành xưởng trường mặc áo rộng thùng thình, tóc dài không buộc. Nguy cơ là","options":["A. áo, tóc bị cuốn vào máy quay gây tai nạn","B. không có nguy cơ gì","C. chỉ mất thẩm mỹ","D. máy chạy chậm"],"answer":"A","explain":"Quần áo rộng, tóc dài dễ bị cuốn vào bộ phận quay của máy gây tai nạn nghiêm trọng; phải mặc gọn gàng, buộc tóc.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về kỷ luật xưởng:","statements":["a) Tuân thủ quy trình vận hành máy.","b) Không đùa nghịch trong xưởng.","c) Kiểm tra máy trước khi làm việc.","d) Được tự ý sửa máy đang chạy."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tuyệt đối không tự ý sửa máy đang chạy.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về trang phục xưởng:","statements":["a) Mặc quần áo gọn gàng.","b) Buộc gọn tóc dài.","c) Đi giày bảo hộ.","d) Mặc áo rộng thùng thình cho mát."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: áo rộng dễ bị cuốn vào máy.","points":1},{"type":"short","level":"VDC","q":"Nêu năm việc cần làm để đảm bảo an toàn khi vận hành máy.","answer":"Học quy trình, kiểm tra máy, đeo bảo hộ, không đùa nghịch, ngắt điện khi sửa","explain":"An toàn khi vận hành máy: học thuộc quy trình; kiểm tra máy trước khi chạy; đeo đầy đủ bảo hộ; không đùa nghịch, không làm khi mệt; ngắt điện khi sửa chữa, vệ sinh.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao xưởng thực hành của trường học cũng phải tuân thủ an toàn lao động?","answer":"Vì học sinh cũng đối mặt nguy cơ như công nhân (máy quay, điện, phoi)","explain":"Xưởng trường có máy móc, điện, dụng cụ sắc nhọn như xưởng thật; học sinh thiếu kinh nghiệm càng cần tuân thủ nghiêm để tránh tai nạn.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"An toàn lao động nhằm mục đích","options":["A. bảo vệ sức khỏe, tính mạng người lao động","B. tăng lợi nhuận","C. giảm số công nhân","D. trang trí xưởng"],"answer":"A","explain":"An toàn lao động nhằm bảo vệ sức khỏe, tính mạng người lao động, phòng ngừa tai nạn, bệnh nghề nghiệp.","points":0.25},{"type":"mcq","level":"NB","q":"Bảo vệ môi trường trong sản xuất nhằm","options":["A. giảm ô nhiễm, phát triển bền vững","B. tăng sản lượng bằng mọi giá","C. giảm chi phí xử lý chất thải","D. không có mục đích"],"answer":"A","explain":"Bảo vệ môi trường trong sản xuất nhằm giảm ô nhiễm, sử dụng hợp lý tài nguyên, phát triển bền vững.","points":0.25},{"type":"mcq","level":"NB","q":"Bệnh nghề nghiệp của thợ hàn là","options":["A. bệnh về mắt, đường hô hấp do khói hàn","B. bệnh về da do nắng","C. bệnh về tiêu hóa","D. không có bệnh nghề nghiệp"],"answer":"A","explain":"Thợ hàn tiếp xúc tia tử ngoại (đau mắt) và khói hàn (bệnh hô hấp) nên cần bảo hộ đầy đủ.","points":0.25},{"type":"mcq","level":"TH","q":"Để phòng bệnh nghề nghiệp cho thợ sơn, cần","options":["A. mặt nạ phòng độc, thông gió tốt","B. ăn nhiều","C. làm việc liên tục","D. không cần gì"],"answer":"A","explain":"Hơi sơn độc hại: thợ sơn cần mặt nạ phòng độc, xưởng thông gió tốt, khám sức khỏe định kỳ.","points":0.25},{"type":"mcq","level":"TH","q":"Nước làm nguội trong xưởng nên được","options":["A. tuần hoàn tái sử dụng sau xử lý","B. xả thẳng ra sông","C. đổ ra đất","D. để bay hơi"],"answer":"A","explain":"Nước làm nguội nên tuần hoàn tái sử dụng sau xử lý: tiết kiệm nước, giảm ô nhiễm.","points":0.25},{"type":"mcq","level":"VD","q":"Một doanh nghiệp muốn đạt chứng nhận sản xuất xanh. Điều cần làm là","options":["A. xử lý chất thải đạt chuẩn, tiết kiệm năng lượng, công nghệ sạch","B. tăng sản lượng bằng mọi giá","C. giảm lương công nhân","D. quảng cáo nhiều"],"answer":"A","explain":"Sản xuất xanh: xử lý chất thải đạt chuẩn, tiết kiệm năng lượng vật liệu, công nghệ sạch, trách nhiệm xã hội.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về bệnh nghề nghiệp:","statements":["a) Thợ hàn dễ mắc bệnh về mắt, hô hấp.","b) Thợ sơn cần phòng độc do hơi sơn.","c) Công nhân ồn cần bảo vệ thính giác.","d) Làm cơ khí không có bệnh nghề nghiệp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nghề cơ khí có nhiều yếu tố gây bệnh nghề nghiệp (bụi, ồn, hóa chất...).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về sản xuất xanh:","statements":["a) Xử lý chất thải đạt chuẩn.","b) Tiết kiệm năng lượng, vật liệu.","c) Dùng công nghệ sạch.","d) Xả thải lén để giảm chi phí."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: xả thải lén vi phạm pháp luật, gây hậu quả nghiêm trọng.","points":1},{"type":"short","level":"VDC","q":"Phân biệt tai nạn lao động và bệnh nghề nghiệp.","answer":"Tai nạn xảy ra đột ngột do sự cố; bệnh nghề nghiệp phát sinh dần do tiếp xúc lâu dài với yếu tố độc hại","explain":"Tai nạn lao động: sự cố đột ngột gây thương tích. Bệnh nghề nghiệp: phát sinh từ từ do tiếp xúc lâu dài với bụi, ồn, hóa chất... trong quá trình làm việc.","points":0.5},{"type":"short","level":"VDC","q":"Nêu trách nhiệm của doanh nghiệp và người lao động trong bảo vệ môi trường.","answer":"Doanh nghiệp xử lý chất thải đúng luật; người lao động phân loại rác, tiết kiệm, tuân thủ quy định","explain":"Doanh nghiệp: đầu tư xử lý chất thải, công nghệ sạch. Người lao động: phân loại rác, tiết kiệm điện nước, tuân thủ quy định môi trường.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Khi phát hiện máy có hiện tượng bất thường (kêu lạ, rung mạnh), cần","options":["A. dừng máy, báo cáo, không cố vận hành","B. tiếp tục chạy","C. đập máy","D. bỏ đi"],"answer":"A","explain":"Máy có hiện tượng bất thường phải dừng ngay, báo cáo để kiểm tra, tuyệt đối không cố vận hành.","points":0.25},{"type":"mcq","level":"NB","q":"Đá mài bị sứt mẻ","options":["A. không được dùng, phải thay đá mới","B. vẫn dùng bình thường","C. dùng nhanh hơn","D. mài bằng tay"],"answer":"A","explain":"Đá mài sứt mẻ dễ vỡ văng khi quay tốc độ cao, rất nguy hiểm — phải thay đá mới, kiểm tra trước khi dùng.","points":0.25},{"type":"mcq","level":"NB","q":"Khi hàn điện, để tránh điện giật cần","options":["A. găng tay cách điện, kìm hàn cách điện tốt","B. tay ướt","C. chân đất","D. không cần gì"],"answer":"A","explain":"Hàn điện: dùng găng tay, kìm hàn cách điện tốt, giữ khô ráo để tránh điện giật.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cấm để vật liệu, dụng cụ bừa bãi trong xưởng?","options":["A. Dễ vấp ngã, cản lối thoát hiểm khi sự cố","B. Để xưởng đẹp","C. Để tiết kiệm diện tích","D. Không có lý do"],"answer":"A","explain":"Vật liệu bừa bãi gây vấp ngã tai nạn, cản lối thoát hiểm khi cháy nổ — xưởng phải gọn gàng, ngăn nắp.","points":0.25},{"type":"mcq","level":"TH","q":"Lối thoát hiểm trong xưởng phải","options":["A. luôn thông thoáng, có biển chỉ dẫn rõ ràng","B. khóa lại","C. chất đầy hàng","D. không cần thiết"],"answer":"A","explain":"Lối thoát hiểm phải luôn thông thoáng, có biển chỉ dẫn phát sáng để thoát nhanh khi sự cố.","points":0.25},{"type":"mcq","level":"VD","q":"Xưởng có bình chữa cháy nhưng để quá hạn kiểm định. Khi xảy ra cháy nhỏ, hậu quả có thể là","options":["A. bình không hoạt động, cháy lan rộng","B. không ảnh hưởng","C. cháy tự tắt","D. bình tự nổ"],"answer":"A","explain":"Bình chữa cháy quá hạn có thể mất áp, không phun được; phải kiểm định, bảo dưỡng định kỳ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về phòng cháy chữa cháy:","statements":["a) Xưởng phải có bình chữa cháy.","b) Bình chữa cháy phải kiểm định định kỳ.","c) Lối thoát hiểm luôn thông thoáng.","d) Khi cháy, dùng thang máy để thoát nhanh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: khi cháy tuyệt đối không dùng thang máy, thoát bằng thang bộ.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về xử lý sự cố máy:","statements":["a) Máy kêu lạ: dừng máy, báo cáo.","b) Đá mài sứt mẻ: thay đá mới.","c) Rò điện: ngắt điện, báo thợ điện.","d) Máy hỏng nhẹ: tự ý tháo sửa khi đang chạy."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: không tự ý sửa máy đang chạy; phải ngắt điện, do thợ có chuyên môn sửa.","points":1},{"type":"short","level":"VDC","q":"Nêu các bước xử lý khi phát hiện rò điện ở máy.","answer":"Ngắt điện, cảnh báo mọi người, báo thợ điện sửa chữa","explain":"Phát hiện rò điện: ngắt nguồn điện ngay, cảnh báo mọi người tránh xa, báo thợ điện kiểm tra sửa chữa, không tự ý chạm vào.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao trong xưởng cơ khí cần trang bị bình chữa cháy?","answer":"Vì có nguy cơ cháy từ điện, dầu mỡ, tia lửa hàn","explain":"Xưởng cơ khí có nhiều nguy cơ cháy: chập điện, dầu mỡ, tia lửa hàn, bụi kim loại — cần bình chữa cháy và phương án chữa cháy.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Sơ cứu ban đầu khi bị điện giật nhẹ là","options":["A. ngắt điện, tách nạn nhân khỏi nguồn điện bằng vật cách điện rồi sơ cứu","B. chạm tay kéo nạn nhân","C. dội nước","D. bỏ mặc"],"answer":"A","explain":"Điện giật: ngắt điện trước, dùng vật cách điện (gậy gỗ khô) tách nạn nhân, rồi sơ cứu, gọi cấp cứu.","points":0.25},{"type":"mcq","level":"NB","q":"Khi bị phoi bắn vào mắt, cần","options":["A. không dụi mắt, đến cơ sở y tế","B. dụi mạnh cho ra","C. nhỏ nước ớt","D. để tự khỏi"],"answer":"A","explain":"Phoi vào mắt: không dụi (làm trầy xước nặng thêm), che mắt và đến cơ sở y tế.","points":0.25},{"type":"mcq","level":"NB","q":"Tủ thuốc sơ cứu trong xưởng dùng để","options":["A. sơ cứu ban đầu khi tai nạn nhẹ","B. chữa bệnh mãn tính","C. trang trí","D. đựng dụng cụ"],"answer":"A","explain":"Tủ thuốc sơ cứu để xử lý ban đầu các tai nạn nhẹ (đứt tay, bỏng nhẹ...) trước khi đến cơ sở y tế.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao khi sơ cứu điện giật phải dùng vật cách điện để tách nạn nhân?","options":["A. Vì chạm trực tiếp sẽ bị điện giật theo","B. Vì nạn nhân nặng","C. Vì vật cách điện đẹp","D. Không cần thiết"],"answer":"A","explain":"Nạn nhân đang nhiễm điện; chạm trực tiếp sẽ bị điện giật theo nên phải dùng vật cách điện (gậy gỗ khô, vải khô).","points":0.25},{"type":"mcq","level":"TH","q":"Khi bị bỏng nhẹ do tia lửa hàn, xử lý đúng là","options":["A. ngâm, rửa bằng nước sạch mát rồi băng nhẹ","B. bôi kem đánh răng","C. chọc vỡ nốt phồng","D. đắp lá cây không rõ"],"answer":"A","explain":"Bỏng nhẹ: làm mát bằng nước sạch, không chọc vỡ nốt phồng, băng nhẹ, đến y tế nếu nặng.","points":0.25},{"type":"mcq","level":"VD","q":"Một công nhân bị đứt tay chảy máu khi vận hành máy. Người bên cạnh nên","options":["A. dừng máy, cầm máu bằng gạc sạch, đưa đi y tế","B. tiếp tục cho máy chạy","C. rắc ớt bột vào vết thương","D. để máu tự cầm"],"answer":"A","explain":"Đứt tay: dừng máy ngay, ấn gạc sạch cầm máu, băng lại và đưa đến cơ sở y tế; không rắc chất lạ vào vết thương.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về sơ cứu:","statements":["a) Điện giật: ngắt điện trước khi chạm vào nạn nhân.","b) Phoi vào mắt: không dụi mắt.","c) Bỏng nhẹ: làm mát bằng nước sạch.","d) Đứt tay: rắc ớt bột để cầm máu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: không rắc chất lạ vào vết thương; dùng gạc sạch ấn cầm máu.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về ứng phó sự cố:","statements":["a) Cháy nhỏ: dùng bình chữa cháy dập ngay.","b) Cháy lớn: báo cháy, thoát hiểm, gọi cứu hỏa.","c) Rò gas: khóa van, mở cửa thông gió, không bật lửa.","d) Cháy do điện: dùng nước dội trực tiếp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cháy do điện không dùng nước khi chưa ngắt điện (dùng bình CO2, bột sau khi ngắt điện).","points":1},{"type":"short","level":"VDC","q":"Nêu trình tự sơ cứu người bị điện giật.","answer":"Ngắt điện, tách nạn nhân bằng vật cách điện, kiểm tra hô hấp, hô hấp nhân tạo nếu cần, gọi cấp cứu","explain":"Sơ cứu điện giật: ngắt nguồn điện; tách nạn nhân bằng vật cách điện; kiểm tra hô hấp, mạch; hô hấp nhân tạo, ép tim nếu ngừng thở; gọi cấp cứu 115.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao mỗi xưởng cần có người được huấn luyện sơ cứu?","answer":"Vì sơ cứu kịp thời, đúng cách giảm thương tật và cứu sống nạn nhân","explain":"Tai nạn xảy ra bất ngờ; sơ cứu đúng trong những phút đầu quyết định mức độ thương tật, thậm chí tính mạng nạn nhân.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Khẩu hiệu đúng về an toàn lao động là","options":["A. An toàn là trên hết","B. Nhanh là trên hết","C. Rẻ là trên hết","D. Đẹp là trên hết"],"answer":"A","explain":"An toàn là trên hết — không đánh đổi an toàn lấy tiến độ hay lợi nhuận.","points":0.25},{"type":"mcq","level":"NB","q":"Ai chịu trách nhiệm chính về an toàn lao động trong doanh nghiệp?","options":["A. Người sử dụng lao động (chủ doanh nghiệp)","B. Chỉ công nhân","C. Chỉ khách hàng","D. Không ai"],"answer":"A","explain":"Người sử dụng lao động chịu trách nhiệm chính: đảm bảo điều kiện an toàn, huấn luyện, trang bị bảo hộ.","points":0.25},{"type":"mcq","level":"NB","q":"Công nhân có quyền","options":["A. từ chối làm việc khi thấy nguy hiểm đến tính mạng","B. tự ý nghỉ việc không lý do","C. vi phạm quy trình","D. không cần bảo hộ"],"answer":"A","explain":"Người lao động có quyền từ chối làm việc khi thấy rõ nguy cơ đe dọa tính mạng, sức khỏe.","points":0.25},{"type":"mcq","level":"TH","q":"Huấn luyện an toàn lao động nhằm","options":["A. trang bị kiến thức, kỹ năng phòng tránh tai nạn","B. tăng giờ làm","C. giảm lương","D. hình thức đối phó"],"answer":"A","explain":"Huấn luyện an toàn trang bị kiến thức, kỹ năng nhận biết nguy cơ và phòng tránh tai nạn, bệnh nghề nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Khám sức khỏe định kỳ cho công nhân nhằm","options":["A. phát hiện sớm bệnh nghề nghiệp","B. tăng lương","C. giảm giờ làm","D. hình thức"],"answer":"A","explain":"Khám sức khỏe định kỳ phát hiện sớm bệnh nghề nghiệp để điều trị, điều chuyển công việc phù hợp.","points":0.25},{"type":"mcq","level":"VD","q":"Một doanh nghiệp cắt giảm chi phí bằng cách không trang bị bảo hộ cho công nhân. Điều này","options":["A. vi phạm pháp luật, gây nguy hiểm cho người lao động","B. hợp lý để tăng lợi nhuận","C. được khuyến khích","D. không ảnh hưởng gì"],"answer":"A","explain":"Không trang bị bảo hộ vi phạm luật an toàn lao động, gây nguy hiểm cho công nhân và bị xử phạt.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về quyền và nghĩa vụ:","statements":["a) Chủ doanh nghiệp phải đảm bảo an toàn lao động.","b) Công nhân được huấn luyện an toàn.","c) Công nhân có quyền từ chối việc nguy hiểm.","d) Công nhân không cần tuân thủ quy trình."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo luật an toàn vệ sinh lao động. d) Sai: công nhân phải tuân thủ quy trình, nội quy.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về văn hóa an toàn:","statements":["a) An toàn là trách nhiệm của mọi người.","b) Báo cáo nguy cơ tiềm ẩn là việc nên làm.","c) Tai nạn của người khác không liên quan đến mình.","d) Học hỏi từ sự cố để phòng ngừa."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: an toàn là việc chung; thấy nguy cơ phải báo cáo, nhắc nhở nhau.","points":1},{"type":"short","level":"VDC","q":"Nêu ba quyền cơ bản của người lao động về an toàn lao động.","answer":"Được huấn luyện, được trang bị bảo hộ, được từ chối việc nguy hiểm","explain":"Người lao động được huấn luyện an toàn, được trang bị bảo hộ, được khám sức khỏe định kỳ và có quyền từ chối công việc nguy hiểm đến tính mạng.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao nói đầu tư cho an toàn lao động là đầu tư có lợi?","answer":"Vì giảm tai nạn, giảm chi phí bồi thường, năng suất ổn định, uy tín doanh nghiệp","explain":"Đầu tư an toàn giảm tai nạn, bệnh nghề nghiệp; giảm chi phí bồi thường, dừng sản xuất; người lao động yên tâm, năng suất cao; nâng uy tín doanh nghiệp.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Nguồn gây ô nhiễm tiếng ồn cần được","options":["A. che chắn, cách âm","B. để nguyên","C. tăng công suất","D. di chuyển liên tục"],"answer":"A","explain":"Nguồn ồn cần che chắn, cách âm để giảm ảnh hưởng đến công nhân và xung quanh.","points":0.25},{"type":"mcq","level":"NB","q":"Giẻ lau dính dầu mỡ là","options":["A. chất thải nguy hại","B. rác sinh hoạt","C. phân bón","D. thức ăn gia súc"],"answer":"A","explain":"Giẻ lau dính dầu mỡ là chất thải nguy hại, phải thu gom xử lý riêng, dễ gây cháy.","points":0.25},{"type":"mcq","level":"NB","q":"Để phòng cháy, giẻ lau dính dầu cần","options":["A. đựng trong thùng kim loại có nắp đậy","B. vứt bừa bãi","C. chất đống góc xưởng","D. phơi ngoài nắng"],"answer":"A","explain":"Giẻ dính dầu dễ tự bốc cháy: phải đựng trong thùng kim loại có nắp đậy, thu gom xử lý.","points":0.25},{"type":"mcq","level":"TH","q":"Xử lý nước thải sản xuất đạt chuẩn có nghĩa là","options":["A. các chất ô nhiễm giảm dưới ngưỡng cho phép của pháp luật","B. nước trong như nước suối","C. không cần xử lý","D. pha loãng là đủ"],"answer":"A","explain":"Xử lý đạt chuẩn: các chỉ tiêu ô nhiễm giảm dưới ngưỡng quy định trước khi thải ra môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Tuần hoàn tái sử dụng nước làm nguội giúp","options":["A. tiết kiệm nước và giảm ô nhiễm","B. tăng ô nhiễm","C. tốn kém vô ích","D. không có tác dụng"],"answer":"A","explain":"Tuần hoàn nước làm nguội vừa tiết kiệm nước vừa giảm lượng nước thải ra môi trường.","points":0.25},{"type":"mcq","level":"VD","q":"Một xưởng mạ muốn giảm chi phí xử lý nước thải một cách bền vững. Biện pháp tốt nhất là","options":["A. cải tiến công nghệ ít hóa chất độc hại và tuần hoàn nước","B. xả lén ban đêm","C. pha loãng rồi xả","D. chuyển xưởng đi nơi khác để xả"],"answer":"A","explain":"Giảm ô nhiễm bền vững: cải tiến công nghệ (ít hóa chất độc), tuần hoàn tái sử dụng nước — vừa giảm chi phí xử lý vừa đúng luật.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về quản lý chất thải:","statements":["a) Phân loại chất thải tại nguồn.","b) Thu hồi tái chế phoi kim loại.","c) Xử lý chất thải nguy hại đúng quy định.","d) Trộn chung mọi loại rác để xử lý một lần."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: phải phân loại, xử lý riêng từng loại, nhất là chất thải nguy hại.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về kinh tế và môi trường:","statements":["a) Tái chế phoi vừa kinh tế vừa bảo vệ môi trường.","b) Công nghệ sạch giảm chi phí xử lý lâu dài.","c) Phạt ô nhiễm nặng hơn chi phí xử lý đúng.","d) Ô nhiễm môi trường không tốn chi phí xã hội."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ô nhiễm gây thiệt hại sức khỏe, môi trường rất lớn cho xã hội.","points":1},{"type":"short","level":"VDC","q":"Nêu quy trình quản lý chất thải rắn trong xưởng cơ khí.","answer":"Phân loại tại nguồn, thu gom, tái chế được thì tái chế, nguy hại xử lý riêng","explain":"Quản lý chất thải rắn: phân loại tại nguồn (phoi kim loại, dầu thải, rác thường...); thu gom riêng; tái chế phoi kim loại; chất thải nguy hại (dầu, giẻ dính dầu, hóa chất) xử lý theo quy định.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao nói bảo vệ môi trường trong sản xuất cũng là bảo vệ chính doanh nghiệp?","answer":"Vì ô nhiễm bị phạt nặng, mất uy tín, mất khách hàng; sản xuất xanh bền vững","explain":"Doanh nghiệp gây ô nhiễm bị phạt nặng, mất uy tín, mất khách hàng, thậm chí đình chỉ; sản xuất xanh giúp phát triển bền vững lâu dài.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Ba trụ cột an toàn lao động là","options":["A. kỹ thuật, bảo hộ cá nhân, kỷ luật","B. nhanh, rẻ, đẹp","C. máy, điện, nước","D. sáng, trưa, chiều"],"answer":"A","explain":"Ba trụ cột: biện pháp kỹ thuật, trang bị bảo hộ cá nhân, chấp hành quy trình kỷ luật.","points":0.25},{"type":"mcq","level":"NB","q":"Bốn loại ô nhiễm trong sản xuất cơ khí là","options":["A. khí thải, nước thải, chất thải rắn, tiếng ồn","B. đất, đá, cát, sỏi","C. sáng, tối, nóng, lạnh","D. mưa, nắng, gió, bão"],"answer":"A","explain":"Bốn loại: khí thải/bụi, nước thải, chất thải rắn, tiếng ồn/rung.","points":0.25},{"type":"mcq","level":"NB","q":"Khẩu hiệu an toàn đúng là","options":["A. An toàn là trên hết","B. Tiến độ là trên hết","C. Lợi nhuận là trên hết","D. Nhanh là trên hết"],"answer":"A","explain":"An toàn là trên hết — không đánh đổi an toàn lấy tiến độ hay lợi nhuận.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân hàng đầu gây tai nạn lao động là","options":["A. con người chủ quan, vi phạm quy trình","B. thiên tai","C. máy quá hiện đại","D. xưởng quá sạch"],"answer":"A","explain":"Phần lớn tai nạn xuất phát từ con người: chủ quan, vi phạm quy trình, thiếu bảo hộ.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp bảo vệ môi trường hiệu quả nhất là","options":["A. phòng ngừa từ đầu (công nghệ sạch) kết hợp xử lý cuối đường ống","B. chỉ xử lý khi bị phạt","C. xả lén","D. không sản xuất"],"answer":"A","explain":"Hiệu quả nhất: phòng ngừa từ đầu bằng công nghệ sạch, tiết kiệm, kết hợp xử lý chất thải đạt chuẩn.","points":0.25},{"type":"mcq","level":"VD","q":"Một học sinh tốt nghiệp muốn làm công nhân cơ khí giỏi và an toàn. Điều quan trọng nhất là","options":["A. học vững quy trình, kỷ luật và ý thức an toàn","B. làm thật nhanh","C. không cần học","D. chỉ cần sức khỏe"],"answer":"A","explain":"Công nhân giỏi và an toàn: vững chuyên môn, tuân thủ quy trình, kỷ luật và ý thức an toàn cao — quan trọng hơn tốc độ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (tổng kết):","statements":["a) An toàn lao động bảo vệ con người.","b) Bảo vệ môi trường bảo vệ cuộc sống.","c) Cả hai đều bắt buộc trong sản xuất hiện đại.","d) Chỉ cần một trong hai là đủ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cả an toàn lao động và bảo vệ môi trường đều bắt buộc.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về ý thức:","statements":["a) Thấy nguy cơ phải báo cáo ngay.","b) Nhắc nhở đồng nghiệp vi phạm an toàn.","c) Học tập nâng cao hiểu biết an toàn.","d) An toàn là việc của riêng cán bộ an toàn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: an toàn là trách nhiệm của mọi người.","points":1},{"type":"short","level":"VDC","q":"Tóm tắt nội dung chính của bài học.","answer":"Nguyên nhân và biện pháp an toàn lao động; các loại ô nhiễm và biện pháp bảo vệ môi trường","explain":"Bài học gồm: nguyên nhân tai nạn lao động; 3 trụ cột an toàn (kỹ thuật, bảo hộ, kỷ luật); 4 loại ô nhiễm cơ khí; biện pháp bảo vệ môi trường.","points":0.5},{"type":"short","level":"VDC","q":"Nêu thông điệp em muốn gửi đến người lao động về an toàn và môi trường.","answer":"An toàn là trên hết; sản xuất phải gắn với bảo vệ môi trường","explain":"Thông điệp: luôn đặt an toàn lên hàng đầu, tuân thủ quy trình; sản xuất phải đi đôi với bảo vệ môi trường vì cuộc sống hôm nay và mai sau.","points":0.5}]}]}</script>
