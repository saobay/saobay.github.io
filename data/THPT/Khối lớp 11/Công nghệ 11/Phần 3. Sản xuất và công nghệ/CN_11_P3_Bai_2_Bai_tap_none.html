<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Tự động hóa là","options":["A. ứng dụng máy móc tự động thay sức lao động của con người","B. dùng sức người là chính","C. sản xuất thủ công","D. ngừng sử dụng máy móc"],"answer":"A","explain":"Tự động hóa là ứng dụng các thiết bị, máy móc tự động (điều khiển bằng chương trình) thay sức lao động con người.","points":0.25},{"type":"mcq","level":"NB","q":"Cơ khí hóa là","options":["A. dùng máy thay sức người nhưng con người vẫn điều khiển trực tiếp","B. máy tự làm hoàn toàn","C. không dùng máy","D. dùng robot"],"answer":"A","explain":"Cơ khí hóa: dùng máy thay sức người nhưng con người vẫn điều khiển trực tiếp máy.","points":0.25},{"type":"mcq","level":"NB","q":"Dây chuyền sản xuất tự động là","options":["A. hệ thống nhiều máy tự động nối tiếp theo trình tự công nghệ","B. một máy đơn lẻ","C. nhóm công nhân làm việc","D. kho chứa hàng"],"answer":"A","explain":"Dây chuyền sản xuất tự động gồm nhiều máy tự động sắp xếp theo trình tự công nghệ, liên kết bằng vận chuyển tự động.","points":0.25},{"type":"mcq","level":"TH","q":"Lợi ích của tự động hóa KHÔNG bao gồm","options":["A. tăng số lượng công nhân","B. năng suất tăng cao","C. chất lượng ổn định","D. giảm lao động nặng nhọc"],"answer":"A","explain":"Tự động hóa làm giảm nhu cầu lao động trực tiếp, không làm tăng số công nhân.","points":0.25},{"type":"mcq","level":"TH","q":"Các máy trong dây chuyền tự động được liên kết bằng","options":["A. thiết bị vận chuyển tự động (băng tải, robot)","B. sức người khuân vác","C. xe đạp","D. không cần liên kết"],"answer":"A","explain":"Các máy trong dây chuyền tự động liên kết với nhau bằng băng tải, robot vận chuyển tự động.","points":0.25},{"type":"mcq","level":"VD","q":"Một nhà máy muốn tăng năng suất gấp 3 lần mà không tăng công nhân. Giải pháp tốt nhất là","options":["A. tự động hóa dây chuyền sản xuất","B. tăng giờ làm","C. tuyển thêm công nhân","D. giảm kiểm tra chất lượng"],"answer":"A","explain":"Tự động hóa dây chuyền giúp tăng năng suất cao mà không cần tăng lao động, chất lượng ổn định.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tự động hóa:","statements":["a) Tự động hóa thay sức lao động con người bằng máy.","b) Cơ khí hóa: người vẫn điều khiển trực tiếp máy.","c) Tự động hóa toàn phần: người chỉ giám sát chung.","d) Tự động hóa làm năng suất giảm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tự động hóa làm năng suất tăng cao.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về dây chuyền tự động:","statements":["a) Các máy sắp xếp theo trình tự công nghệ.","b) Liên kết bằng vận chuyển tự động.","c) Con người vẫn giám sát, điều khiển chung.","d) Dây chuyền tự động không cần bảo dưỡng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: máy móc tự động vẫn cần bảo dưỡng định kỳ.","points":1},{"type":"short","level":"VDC","q":"Nêu ba lợi ích của tự động hóa trong sản xuất.","answer":"Năng suất cao, chất lượng ổn định, giảm lao động nặng nhọc","explain":"Tự động hóa giúp năng suất tăng, chất lượng đồng đều, giảm lao động nặng nhọc độc hại, an toàn hơn.","points":0.5},{"type":"short","level":"VDC","q":"Phân biệt cơ khí hóa và tự động hóa toàn phần.","answer":"Cơ khí hóa: người vẫn điều khiển trực tiếp; tự động toàn phần: máy tự làm, người chỉ giám sát","explain":"Cơ khí hóa dùng máy thay sức người nhưng người điều khiển trực tiếp; tự động hóa toàn phần máy tự thực hiện toàn bộ, người chỉ giám sát chung.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Robot công nghiệp là","options":["A. thiết bị tự động lập trình được, thực hiện thao tác như tay người","B. người máy trong phim","C. máy tính để bàn","D. điện thoại thông minh"],"answer":"A","explain":"Robot công nghiệp là thiết bị tự động có thể lập trình để thực hiện các thao tác như tay người.","points":0.25},{"type":"mcq","level":"NB","q":"Robot hàn được dùng nhiều trong","options":["A. sản xuất ô tô (hàn thân xe)","B. nấu ăn","C. dạy học","D. khám bệnh"],"answer":"A","explain":"Robot hàn dùng trong sản xuất ô tô để hàn thân xe: nhanh, đều, tránh khói độc.","points":0.25},{"type":"mcq","level":"NB","q":"Ưu điểm của robot so với con người là","options":["A. làm việc nhanh, chính xác, bền bỉ trong môi trường độc hại","B. suy nghĩ sáng tạo","C. không cần năng lượng","D. không cần bảo dưỡng"],"answer":"A","explain":"Robot làm việc nhanh, chính xác, bền bỉ, chịu được môi trường độc hại, nguy hiểm.","points":0.25},{"type":"mcq","level":"TH","q":"Robot lắp ráp linh kiện điện tử đòi hỏi","options":["A. độ chính xác rất cao (micromet)","B. sức mạnh lớn","C. tốc độ chậm","D. kích thước khổng lồ"],"answer":"A","explain":"Lắp ráp linh kiện điện tử nhỏ cần độ chính xác đến micromet — việc con người khó làm, robot làm tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao dùng robot sơn thay người sơn trong nhà máy ô tô?","options":["A. Sơn đều, tiết kiệm sơn, tránh độc hại cho công nhân","B. Robot sơn đẹp hơn về mặt nghệ thuật","C. Robot không cần sơn","D. Để giảm số lượng ô tô"],"answer":"A","explain":"Robot sơn cho lớp sơn đều, tiết kiệm sơn và tránh cho công nhân hít phải hơi sơn độc hại.","points":0.25},{"type":"mcq","level":"VD","q":"Một công đoạn hàn trong môi trường khói độc, cần mối hàn đều, đẹp. Giải pháp tốt nhất là","options":["A. dùng robot hàn","B. thợ hàn làm thêm giờ","C. bỏ công đoạn hàn","D. hàn bằng tay không có bảo hộ"],"answer":"A","explain":"Môi trường độc hại, yêu cầu đều đẹp: robot hàn là giải pháp tốt nhất, bảo vệ sức khỏe công nhân.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về robot công nghiệp:","statements":["a) Robot công nghiệp lập trình được.","b) Robot hàn dùng trong sản xuất ô tô.","c) Robot làm việc được trong môi trường độc hại.","d) Robot có thể thay thế hoàn toàn trí tuệ con người."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: robot chỉ thực hiện chương trình, không thay thế trí tuệ, sáng tạo của con người.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về ứng dụng robot:","statements":["a) Robot vận chuyển gắp đặt phôi giữa các máy.","b) Robot lắp ráp linh kiện điện tử chính xác cao.","c) Robot sơn tiết kiệm sơn, đều màu.","d) Robot không cần lập trình vẫn làm việc được."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: robot công nghiệp hoạt động theo chương trình được lập trình.","points":1},{"type":"short","level":"VDC","q":"Kể tên ba loại robot công nghiệp theo công dụng.","answer":"Robot hàn, robot sơn, robot lắp ráp (robot vận chuyển)","explain":"Robot công nghiệp phân loại theo công dụng: robot hàn, robot sơn, robot lắp ráp, robot vận chuyển...","points":0.5},{"type":"short","level":"VDC","q":"Vì sao robot phù hợp với công việc lặp đi lặp lại?","answer":"Vì robot không mệt mỏi, không chán nản, luôn chính xác đều đặn","explain":"Công việc lặp đi lặp lại gây mệt mỏi, nhàm chán cho con người, dễ sai sót; robot làm đều đặn, chính xác, không mệt mỏi.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Cách mạng công nghiệp lần thứ 4 dựa trên","options":["A. công nghệ số, kết nối Internet","B. máy hơi nước","C. điện năng","D. sức người"],"answer":"A","explain":"CMCN 4.0 dựa trên công nghệ số, kết nối vạn vật qua Internet.","points":0.25},{"type":"mcq","level":"NB","q":"IoT là viết tắt của","options":["A. Internet vạn vật (Internet of Things)","B. trí tuệ nhân tạo","C. dữ liệu lớn","D. in 3 chiều"],"answer":"A","explain":"IoT (Internet of Things) là Internet vạn vật: mọi thiết bị kết nối, trao đổi dữ liệu qua Internet.","points":0.25},{"type":"mcq","level":"NB","q":"AI là viết tắt của","options":["A. trí tuệ nhân tạo","B. Internet vạn vật","C. dữ liệu lớn","D. robot công nghiệp"],"answer":"A","explain":"AI (Artificial Intelligence) là trí tuệ nhân tạo.","points":0.25},{"type":"mcq","level":"TH","q":"Trong nhà máy thông minh, AI có thể","options":["A. tự phát hiện lỗi sản phẩm bằng thị giác máy","B. thay công nhân ăn trưa","C. tự sửa chữa mọi hỏng hóc","D. ra quyết định chiến lược kinh doanh"],"answer":"A","explain":"AI trong sản xuất: kiểm tra lỗi bằng thị giác máy, dự báo hỏng hóc, tối ưu quy trình.","points":0.25},{"type":"mcq","level":"TH","q":"In 3D trong sản xuất có ưu điểm","options":["A. chế tạo chi tiết phức tạp trực tiếp từ mô hình số","B. chỉ in được giấy","C. chậm hơn mọi phương pháp","D. không cần thiết kế"],"answer":"A","explain":"In 3D (công nghệ bồi đắp) chế tạo chi tiết phức tạp trực tiếp từ mô hình số, không cần khuôn.","points":0.25},{"type":"mcq","level":"VD","q":"Một nhà máy muốn biết trước khi nào máy sẽ hỏng để bảo dưỡng kịp thời. Công nghệ phù hợp là","options":["A. IoT kết hợp AI phân tích dữ liệu cảm biến","B. tăng số công nhân trực","C. đoán mò","D. chờ máy hỏng mới sửa"],"answer":"A","explain":"Cảm biến IoT thu thập dữ liệu máy, AI phân tích để dự báo hỏng hóc (bảo trì dự đoán) — công nghệ của CMCN 4.0.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về CMCN 4.0:","statements":["a) CMCN 4.0 dựa trên công nghệ số.","b) IoT kết nối máy móc qua Internet.","c) AI giúp máy tự học, tự ra quyết định.","d) CMCN 4.0 là cuộc cách mạng về máy hơi nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: máy hơi nước là CMCN 1.0.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về nhà máy thông minh:","statements":["a) Máy móc tự giao tiếp, trao đổi dữ liệu.","b) Con người giám sát qua màn hình.","c) Cần lao động trình độ cao.","d) Nhà máy thông minh không cần con người."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: vẫn cần con người giám sát, ra quyết định chiến lược, làm chủ công nghệ.","points":1},{"type":"short","level":"VDC","q":"Nêu bốn công nghệ cốt lõi của cách mạng công nghiệp 4.0.","answer":"IoT, AI, Big Data, in 3D","explain":"Bốn công nghệ cốt lõi của CMCN 4.0: Internet vạn vật (IoT), trí tuệ nhân tạo (AI), dữ liệu lớn (Big Data), in 3D.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao CMCN 4.0 đòi hỏi người lao động phải có trình độ cao?","answer":"Vì phải vận hành, làm chủ hệ thống tự động, công nghệ số phức tạp","explain":"Nhà máy thông minh dùng công nghệ số phức tạp; người lao động phải biết vận hành, lập trình, phân tích dữ liệu — đòi hỏi trình độ cao.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Cách mạng công nghiệp 1.0 gắn với","options":["A. máy hơi nước","B. điện năng","C. máy tính","D. Internet"],"answer":"A","explain":"CMCN 1.0: máy hơi nước — cơ khí hóa sản xuất.","points":0.25},{"type":"mcq","level":"NB","q":"Cách mạng công nghiệp 2.0 gắn với","options":["A. điện năng, sản xuất hàng loạt","B. máy hơi nước","C. Internet","D. trí tuệ nhân tạo"],"answer":"A","explain":"CMCN 2.0: điện năng — sản xuất hàng loạt trên dây chuyền.","points":0.25},{"type":"mcq","level":"NB","q":"Cách mạng công nghiệp 3.0 gắn với","options":["A. điện tử, máy tính — tự động hóa","B. máy hơi nước","C. Internet vạn vật","D. in 3D"],"answer":"A","explain":"CMCN 3.0: điện tử, máy tính — tự động hóa sản xuất.","points":0.25},{"type":"mcq","level":"TH","q":"Dữ liệu lớn (Big Data) giúp nhà máy","options":["A. phân tích dữ liệu sản xuất để tối ưu quy trình","B. lưu trữ ảnh cá nhân","C. chơi game","D. thay thế máy móc"],"answer":"A","explain":"Big Data: thu thập, phân tích khối dữ liệu lớn từ sản xuất để tối ưu quy trình, dự báo.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà máy thông minh là nhà máy mà","options":["A. máy móc tự giao tiếp, tự điều chỉnh; người giám sát, ra quyết định","B. không có máy móc","C. không có con người","D. chỉ sản xuất điện thoại"],"answer":"A","explain":"Nhà máy thông minh: máy móc kết nối, tự điều chỉnh; con người giám sát qua hệ thống số, ra quyết định chiến lược.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty may mặc muốn kiểm tra lỗi vải tự động thay vì soi bằng mắt. Công nghệ nên dùng là","options":["A. thị giác máy (camera kết hợp AI)","B. thuê thêm công nhân soi","C. bỏ khâu kiểm tra","D. sờ bằng tay"],"answer":"A","explain":"Thị giác máy (camera + AI) tự phát hiện lỗi vải nhanh, chính xác, không mệt mỏi — ứng dụng CMCN 4.0.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về các cuộc CMCN:","statements":["a) 1.0: máy hơi nước.","b) 2.0: điện năng.","c) 3.0: điện tử, máy tính.","d) 4.0: công nghệ số, Internet."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng, tóm tắt 4 cuộc cách mạng công nghiệp.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tác động của tự động hóa:","statements":["a) Năng suất lao động tăng.","b) Đòi hỏi lao động trình độ cao hơn.","c) Một số công việc giản đơn bị thay thế.","d) Con người không cần học thêm gì nữa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tự động hóa đòi hỏi người lao động phải học tập suốt đời, nâng cao trình độ.","points":1},{"type":"short","level":"VDC","q":"Nêu thứ tự 4 cuộc cách mạng công nghiệp và đặc trưng mỗi cuộc.","answer":"1.0 máy hơi nước, 2.0 điện năng, 3.0 điện tử máy tính, 4.0 công nghệ số","explain":"1.0: máy hơi nước (cơ khí hóa). 2.0: điện năng (sản xuất hàng loạt). 3.0: điện tử, máy tính (tự động hóa). 4.0: công nghệ số, Internet (nhà máy thông minh).","points":0.5},{"type":"short","level":"VDC","q":"Học sinh phổ thông cần chuẩn bị gì để thích ứng với CMCN 4.0?","answer":"Học tốt tin học, ngoại ngữ, tư duy sáng tạo và học tập suốt đời","explain":"CMCN 4.0 cần lao động làm chủ công nghệ số: học sinh cần giỏi tin học, ngoại ngữ, tư duy logic, sáng tạo và tinh thần học tập suốt đời.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Tự động hóa từng phần là","options":["A. một số công đoạn tự động, một số do người làm","B. máy làm hoàn toàn","C. người làm hoàn toàn","D. không sản xuất"],"answer":"A","explain":"Tự động hóa từng phần: một số công đoạn tự động, một số công đoạn con người thực hiện.","points":0.25},{"type":"mcq","level":"NB","q":"Tự động hóa toàn phần là","options":["A. máy tự làm toàn bộ, người chỉ giám sát chung","B. người làm toàn bộ","C. máy và người làm ngang nhau","D. không cần người"],"answer":"A","explain":"Tự động hóa toàn phần: máy tự thực hiện toàn bộ quá trình, con người chỉ giám sát, điều khiển chung.","points":0.25},{"type":"mcq","level":"NB","q":"Ví dụ về dây chuyền sản xuất tự động là","options":["A. dây chuyền đóng chai nước giải khát","B. gánh hàng rong","C. chợ phiên","D. cửa hàng tạp hóa"],"answer":"A","explain":"Dây chuyền đóng chai nước giải khát (rửa chai, chiết, đóng nắp, dán nhãn tự động) là ví dụ điển hình.","points":0.25},{"type":"mcq","level":"TH","q":"Trong dây chuyền tự động, vai trò của con người là","options":["A. giám sát, điều khiển chung, bảo dưỡng","B. làm mọi công đoạn","C. không có vai trò gì","D. chỉ đứng xem"],"answer":"A","explain":"Trong dây chuyền tự động, con người giám sát, điều khiển chung, xử lý sự cố, bảo dưỡng thiết bị.","points":0.25},{"type":"mcq","level":"TH","q":"Robot vận chuyển trong nhà máy có nhiệm vụ","options":["A. gắp, đặt phôi và sản phẩm giữa các máy","B. nấu ăn cho công nhân","C. tính lương","D. quét nhà xưởng"],"answer":"A","explain":"Robot vận chuyển (tay máy, xe tự hành) gắp, đặt phôi và sản phẩm giữa các máy trong dây chuyền.","points":0.25},{"type":"mcq","level":"VD","q":"Một xưởng gỗ muốn cưa, bào gỗ tự động theo kích thước lập trình. Thiết bị phù hợp là","options":["A. máy CNC","B. cưa tay","C. rìu","D. dao"],"answer":"A","explain":"Máy CNC (điều khiển số bằng máy tính) gia công tự động theo chương trình: cưa, phay, tiện chính xác theo kích thước lập trình.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về mức độ tự động hóa:","statements":["a) Cơ khí hóa: người vẫn điều khiển trực tiếp.","b) Tự động từng phần: một số công đoạn tự động.","c) Tự động toàn phần: người chỉ giám sát.","d) Mức độ càng cao càng không cần con người."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: dù tự động toàn phần vẫn cần con người giám sát, bảo dưỡng, ra quyết định.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về máy CNC:","statements":["a) CNC là máy điều khiển số bằng máy tính.","b) CNC gia công theo chương trình lập trình.","c) CNC cho độ chính xác cao.","d) CNC không cần người lập trình."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: CNC cần người lập trình chương trình gia công.","points":1},{"type":"short","level":"VDC","q":"Nêu ba mức độ tự động hóa trong sản xuất.","answer":"Cơ khí hóa, tự động hóa từng phần, tự động hóa toàn phần","explain":"Ba mức độ: cơ khí hóa (người điều khiển trực tiếp), tự động hóa từng phần, tự động hóa toàn phần (người chỉ giám sát).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao dây chuyền tự động cho chất lượng sản phẩm ổn định hơn làm thủ công?","answer":"Vì máy làm theo chương trình chính xác, không bị ảnh hưởng bởi mệt mỏi, tâm trạng","explain":"Máy tự động thực hiện đúng chương trình, thông số ổn định; con người bị ảnh hưởng bởi mệt mỏi, tâm trạng nên chất lượng không đều.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Máy CNC là","options":["A. máy điều khiển số bằng máy tính","B. máy chạy bằng tay","C. máy hơi nước","D. máy tính để bàn"],"answer":"A","explain":"CNC (Computer Numerical Control) là máy điều khiển số bằng máy tính, gia công theo chương trình.","points":0.25},{"type":"mcq","level":"NB","q":"Ưu điểm của máy CNC là","options":["A. chính xác cao, gia công được chi tiết phức tạp","B. giá rẻ nhất","C. không cần điện","D. ai cũng vận hành được ngay"],"answer":"A","explain":"Máy CNC cho độ chính xác cao, gia công được chi tiết phức tạp, năng suất cao.","points":0.25},{"type":"mcq","level":"NB","q":"Cảm biến trong nhà máy thông minh có tác dụng","options":["A. thu thập dữ liệu (nhiệt độ, áp suất, vị trí...)","B. trang trí","C. phát nhạc","D. chiếu sáng"],"answer":"A","explain":"Cảm biến thu thập dữ liệu (nhiệt độ, áp suất, vị trí, hình ảnh...) gửi về hệ thống điều khiển.","points":0.25},{"type":"mcq","level":"TH","q":"Bảo trì dự đoán trong nhà máy thông minh là","options":["A. dự báo trước hỏng hóc từ dữ liệu cảm biến để bảo dưỡng kịp thời","B. chờ hỏng mới sửa","C. thay máy mới hàng ngày","D. không bảo dưỡng"],"answer":"A","explain":"Bảo trì dự đoán: AI phân tích dữ liệu cảm biến IoT để dự báo hỏng hóc, bảo dưỡng trước khi sự cố xảy ra.","points":0.25},{"type":"mcq","level":"TH","q":"Thị giác máy trong kiểm tra chất lượng là","options":["A. camera kết hợp AI tự phát hiện lỗi sản phẩm","B. công nhân nhìn bằng mắt","C. kính hiển vi","D. gương soi"],"answer":"A","explain":"Thị giác máy: camera kết hợp AI tự động phát hiện lỗi sản phẩm nhanh, chính xác, không mệt mỏi.","points":0.25},{"type":"mcq","level":"VD","q":"Một nhà máy dệt muốn phát hiện lỗi vải nhanh gấp 10 lần. Nên đầu tư","options":["A. hệ thống thị giác máy","B. thêm 10 công nhân soi vải","C. bỏ kiểm tra","D. giảm tốc độ máy"],"answer":"A","explain":"Thị giác máy kiểm tra nhanh, chính xác gấp nhiều lần soi bằng mắt, không mệt mỏi.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về công nghệ 4.0 trong nhà máy:","statements":["a) Cảm biến thu thập dữ liệu sản xuất.","b) AI phân tích dữ liệu, dự báo hỏng hóc.","c) Thị giác máy kiểm tra lỗi tự động.","d) Mọi quyết định đều do máy tự đưa ra, người không cần biết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: con người vẫn giám sát, ra quyết định quan trọng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về lợi ích và thách thức:","statements":["a) Tự động hóa nâng cao năng suất.","b) Tự động hóa đòi hỏi vốn đầu tư lớn.","c) Tự động hóa cần lao động trình độ cao.","d) Tự động hóa không có thách thức nào."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tự động hóa có thách thức về vốn, lao động, an ninh mạng...","points":1},{"type":"short","level":"VDC","q":"Giải thích khái niệm bảo trì dự đoán.","answer":"Dự báo trước hỏng hóc từ dữ liệu để bảo dưỡng kịp thời, tránh dừng máy đột ngột","explain":"Bảo trì dự đoán dùng cảm biến IoT và AI phân tích dữ liệu máy để dự báo hỏng hóc, bảo dưỡng trước khi sự cố xảy ra, tránh dừng dây chuyền đột ngột.","points":0.5},{"type":"short","level":"VDC","q":"Nêu một rủi ro của nhà máy thông minh kết nối Internet.","answer":"Nguy cơ bị tấn công mạng, mất an toàn thông tin","explain":"Nhà máy kết nối Internet đối mặt nguy cơ tấn công mạng, đánh cắp dữ liệu, phá hoại hệ thống điều khiển — cần bảo mật chặt chẽ.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trong các công việc sau, công việc nào robot làm tốt hơn con người?","options":["A. Hàn trong môi trường khói độc với mối hàn đều","B. Sáng tác nhạc","C. Dạy học","D. Khám bệnh"],"answer":"A","explain":"Robot vượt trội trong công việc nặng nhọc, độc hại, đòi hỏi đều đặn chính xác như hàn trong khói độc.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các công việc sau, công việc nào con người vẫn vượt trội robot?","options":["A. Sáng tạo, ra quyết định phức tạp","B. Lặp đi lặp lại đơn điệu","C. Làm việc trong lò nung","D. Nâng vật nặng liên tục"],"answer":"A","explain":"Con người vượt trội ở sáng tạo, tư duy, ra quyết định phức tạp, giao tiếp — robot chỉ làm theo chương trình.","points":0.25},{"type":"mcq","level":"NB","q":"Dây chuyền sản xuất ô tô gồm các công đoạn","options":["A. dập, hàn thân xe, sơn, lắp ráp","B. trồng trọt, chăn nuôi","C. đào mỏ, luyện kim","D. đánh cá, chế biến"],"answer":"A","explain":"Dây chuyền ô tô: dập tấm → hàn thân xe (robot) → sơn (robot) → lắp ráp hoàn chỉnh → kiểm tra.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao robot hàn thân xe cho mối hàn đẹp hơn thợ hàn?","options":["A. Vì robot di chuyển đều, chính xác theo chương trình","B. Vì robot khỏe hơn","C. Vì robot không cần điện","D. Vì robot rẻ hơn"],"answer":"A","explain":"Robot hàn di chuyển đều, đúng quỹ đạo lập trình nên mối hàn đều, đẹp, chất lượng ổn định.","points":0.25},{"type":"mcq","level":"TH","q":"Tự động hóa giúp bảo vệ sức khỏe công nhân vì","options":["A. máy làm thay các công việc nặng nhọc, độc hại","B. công nhân không cần làm gì","C. máy chữa bệnh","D. công nhân được tăng lương"],"answer":"A","explain":"Máy móc, robot thay con người làm việc nặng nhọc, độc hại, nguy hiểm nên bảo vệ sức khỏe người lao động.","points":0.25},{"type":"mcq","level":"VD","q":"Một làng nghề truyền thống muốn giữ nghề mà vẫn nâng năng suất. Hướng đi phù hợp là","options":["A. cơ khí hóa, tự động hóa từng phần các khâu nặng nhọc","B. bỏ nghề truyền thống","C. tự động hóa toàn phần ngay","D. giữ nguyên không đổi mới"],"answer":"A","explain":"Làng nghề: cơ khí hóa, tự động từng phần các khâu nặng nhọc, giữ lại khâu tinh xảo thủ công — vừa nâng năng suất vừa giữ bản sắc nghề.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vai trò con người và máy:","statements":["a) Máy vượt trội trong việc lặp đi lặp lại chính xác.","b) Người vượt trội trong sáng tạo, quyết định.","c) Robot thay thế được mọi công việc của con người.","d) Người và máy bổ sung cho nhau."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: robot không thay thế được sáng tạo, trí tuệ con người.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về chuyển đổi số trong sản xuất:","statements":["a) Số hóa quy trình giúp quản lý tốt hơn.","b) Dữ liệu giúp ra quyết định chính xác.","c) Tự động hóa cần đi đôi với đào tạo lao động.","d) Chuyển đổi số chỉ cần mua máy đắt tiền."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chuyển đổi số cần cả công nghệ, con người và quy trình phù hợp.","points":1},{"type":"short","level":"VDC","q":"Nêu quan điểm đúng về mối quan hệ giữa robot và việc làm của con người.","answer":"Robot thay thế việc nặng nhọc, đơn điệu; con người chuyển sang việc đòi hỏi trí tuệ, sáng tạo","explain":"Robot thay thế công việc nặng nhọc, độc hại, lặp đi lặp lại; con người chuyển sang giám sát, sáng tạo, ra quyết định — cần nâng cao trình độ để thích ứng.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao các nước phát triển vẫn giữ một số công đoạn thủ công trong sản xuất hàng cao cấp?","answer":"Vì thủ công tạo giá trị tinh xảo, độc đáo mà máy khó thay thế","explain":"Hàng cao cấp (đồng hồ, thời trang xa xỉ) giữ công đoạn thủ công vì giá trị tinh xảo, độc bản — điều máy móc khó tạo ra.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Lợi ích lớn nhất của dây chuyền sản xuất tự động là","options":["A. năng suất cao, chất lượng ổn định, giá thành thấp","B. không cần điện","C. không cần nhà xưởng","D. không cần bảo dưỡng"],"answer":"A","explain":"Dây chuyền tự động cho năng suất cao, chất lượng ổn định, giá thành sản phẩm thấp.","points":0.25},{"type":"mcq","level":"NB","q":"Nhược điểm của tự động hóa là","options":["A. vốn đầu tư ban đầu lớn","B. năng suất thấp","C. chất lượng kém","D. tốn nhiều công nhân"],"answer":"A","explain":"Tự động hóa đòi hỏi vốn đầu tư ban đầu lớn cho máy móc, robot, hệ thống điều khiển.","points":0.25},{"type":"mcq","level":"NB","q":"In 3D còn gọi là công nghệ","options":["A. bồi đắp (đắp dần vật liệu theo lớp)","B. cắt gọt","C. đúc","D. rèn"],"answer":"A","explain":"In 3D là công nghệ bồi đắp: đắp dần vật liệu theo từng lớp từ mô hình số.","points":0.25},{"type":"mcq","level":"TH","q":"In 3D phù hợp nhất với","options":["A. chế tạo mẫu thử, chi tiết phức tạp số lượng ít","B. sản xuất hàng loạt hàng triệu chi tiết","C. đúc thép khối lớn","D. sản xuất ốc vít"],"answer":"A","explain":"In 3D chậm, đắt nên phù hợp chế tạo mẫu thử (prototype), chi tiết phức tạp số lượng ít, y tế cá nhân hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Big Data trong sản xuất giúp","options":["A. tối ưu quy trình từ phân tích dữ liệu lớn","B. lưu trữ phim ảnh","C. thay thế công nhân","D. giảm tiền điện"],"answer":"A","explain":"Phân tích dữ liệu lớn từ sản xuất giúp phát hiện bất thường, tối ưu quy trình, nâng cao chất lượng.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty muốn thử nghiệm 10 mẫu thiết kế chi tiết mới trong một tuần. Công nghệ phù hợp nhất là","options":["A. in 3D","B. đúc khuôn thép","C. rèn","D. dập"],"answer":"A","explain":"Thử nghiệm nhanh nhiều mẫu: in 3D tạo mẫu trực tiếp từ file thiết kế, không cần làm khuôn, rất nhanh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về in 3D:","statements":["a) In 3D là công nghệ bồi đắp theo lớp.","b) In 3D chế tạo từ mô hình số.","c) In 3D phù hợp mẫu thử, chi tiết phức tạp.","d) In 3D nhanh và rẻ hơn mọi phương pháp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: in 3D chậm và đắt, không phù hợp sản xuất hàng loạt.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về đầu tư tự động hóa:","statements":["a) Vốn đầu tư ban đầu lớn.","b) Phù hợp sản xuất hàng loạt.","c) Cần tính toán hiệu quả kinh tế.","d) Doanh nghiệp nào cũng nên tự động hóa toàn phần ngay."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mức độ tự động hóa phải phù hợp quy mô, vốn, sản phẩm từng doanh nghiệp.","points":1},{"type":"short","level":"VDC","q":"So sánh in 3D với đúc khi chế tạo mẫu thử chi tiết mới.","answer":"In 3D nhanh, không cần khuôn, phù hợp số lượng ít; đúc cần làm khuôn, phù hợp số lượng lớn","explain":"Chế tạo mẫu thử: in 3D nhanh, không cần khuôn, linh hoạt thay đổi thiết kế; đúc phải làm khuôn tốn kém, chỉ hiệu quả khi sản xuất hàng loạt.","points":0.5},{"type":"short","level":"VDC","q":"Nêu một ứng dụng của in 3D trong y tế.","answer":"In mô hình xương, chân tay giả cá nhân hóa (mão răng)","explain":"In 3D trong y tế: in mô hình xương để phẫu thuật thử, chân tay giả cá nhân hóa, mão răng sứ...","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tự động hóa giúp giảm giá thành vì","options":["A. năng suất cao, ít phế phẩm, ít nhân công","B. không tốn điện","C. máy rẻ hơn người","D. không cần nhà xưởng"],"answer":"A","explain":"Tự động hóa: năng suất cao, ít phế phẩm, giảm nhân công trực tiếp nên giá thành sản phẩm giảm.","points":0.25},{"type":"mcq","level":"NB","q":"IoT giúp các máy trong nhà máy","options":["A. kết nối, trao đổi dữ liệu với nhau","B. tự di chuyển","C. tự sửa chữa","D. nói chuyện với công nhân"],"answer":"A","explain":"IoT kết nối máy móc, cảm biến qua Internet để trao đổi dữ liệu, phối hợp hoạt động.","points":0.25},{"type":"mcq","level":"NB","q":"AI trong nhà máy có thể","options":["A. phát hiện lỗi sản phẩm, dự báo hỏng hóc","B. thay giám đốc","C. nấu cơm","D. tuyển dụng"],"answer":"A","explain":"AI trong nhà máy: thị giác máy phát hiện lỗi, phân tích dữ liệu dự báo hỏng hóc, tối ưu quy trình.","points":0.25},{"type":"mcq","level":"TH","q":"Để dây chuyền tự động hoạt động ổn định, cần","options":["A. bảo dưỡng định kỳ và công nhân kỹ thuật giỏi","B. bỏ bảo dưỡng","C. chạy quá tải liên tục","D. không cần ai giám sát"],"answer":"A","explain":"Máy tự động vẫn cần bảo dưỡng định kỳ và đội ngũ kỹ thuật giỏi để vận hành, xử lý sự cố.","points":0.25},{"type":"mcq","level":"TH","q":"Khi một máy trong dây chuyền tự động bị hỏng, điều gì xảy ra?","options":["A. Cả dây chuyền có thể phải dừng","B. Không ảnh hưởng gì","C. Máy khác tự thay thế ngay","D. Dây chuyền chạy nhanh hơn"],"answer":"A","explain":"Các máy nối tiếp nhau nên một máy hỏng có thể làm dừng cả dây chuyền — vì vậy bảo trì dự đoán rất quan trọng.","points":0.25},{"type":"mcq","level":"VD","q":"Một doanh nghiệp nhỏ vốn ít muốn nâng năng suất. Lời khuyên hợp lý là","options":["A. cơ khí hóa, tự động hóa từng phần phù hợp với vốn","B. vay nợ đầu tư robot toàn phần ngay","C. không đổi mới gì","D. giảm lương công nhân"],"answer":"A","explain":"Doanh nghiệp nhỏ nên cơ khí hóa, tự động từng phần phù hợp với vốn và quy mô, nâng dần theo hiệu quả.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vận hành dây chuyền:","statements":["a) Cần bảo dưỡng định kỳ.","b) Cần công nhân kỹ thuật giỏi.","c) Máy hỏng có thể dừng cả dây chuyền.","d) Dây chuyền tự động không bao giờ hỏng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: máy móc nào cũng có thể hỏng, cần bảo trì.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về chiến lược tự động hóa:","statements":["a) Phù hợp với quy mô sản xuất.","b) Phù hợp với vốn đầu tư.","c) Đi đôi với đào tạo lao động.","d) Càng tự động càng tốt, bất chấp điều kiện."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: phải tính toán hiệu quả, phù hợp điều kiện thực tế.","points":1},{"type":"short","level":"VDC","q":"Vì sao một máy hỏng có thể làm dừng cả dây chuyền tự động?","answer":"Vì các máy nối tiếp theo trình tự công nghệ, máy sau chờ sản phẩm của máy trước","explain":"Dây chuyền: máy sau gia công tiếp sản phẩm của máy trước; một máy dừng thì các máy sau không có việc, cả dây chuyền đình trệ.","points":0.5},{"type":"short","level":"VDC","q":"Nêu hai việc con người vẫn phải làm trong nhà máy tự động hóa toàn phần.","answer":"Giám sát, bảo dưỡng và ra quyết định (lập trình, xử lý sự cố)","explain":"Dù tự động toàn phần, con người vẫn giám sát hệ thống, bảo dưỡng thiết bị, lập trình, xử lý sự cố và ra quyết định chiến lược.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Ba mức độ tự động hóa là","options":["A. cơ khí hóa, tự động từng phần, tự động toàn phần","B. thủ công, bán thủ công, máy","C. nhỏ, vừa, lớn","D. cũ, mới, hiện đại"],"answer":"A","explain":"Ba mức độ: cơ khí hóa → tự động hóa từng phần → tự động hóa toàn phần.","points":0.25},{"type":"mcq","level":"NB","q":"Bốn công nghệ cốt lõi của CMCN 4.0 là","options":["A. IoT, AI, Big Data, in 3D","B. hơi nước, điện, máy tính, Internet","C. sắt, thép, đồng, nhôm","D. tiện, phay, bào, khoan"],"answer":"A","explain":"Bốn công nghệ cốt lõi CMCN 4.0: IoT, AI, Big Data, in 3D.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà máy thông minh là","options":["A. nhà máy mà máy móc tự giao tiếp, con người giám sát qua hệ thống số","B. nhà máy không có người","C. nhà máy sản xuất điện thoại","D. nhà máy trong phim"],"answer":"A","explain":"Nhà máy thông minh: máy móc kết nối IoT tự phối hợp; con người giám sát, điều khiển qua hệ thống số.","points":0.25},{"type":"mcq","level":"TH","q":"Robot công nghiệp cần","options":["A. được lập trình trước khi làm việc","B. tự suy nghĩ","C. ăn uống","D. nghỉ ngơi"],"answer":"A","explain":"Robot công nghiệp hoạt động theo chương trình được con người lập trình sẵn.","points":0.25},{"type":"mcq","level":"TH","q":"Tự động hóa và việc làm: quan điểm đúng là","options":["A. máy thay việc nặng nhọc, người chuyển sang việc trí tuệ","B. máy thay thế hoàn toàn con người","C. con người không cần học gì","D. nên cấm tự động hóa"],"answer":"A","explain":"Tự động hóa thay thế công việc nặng nhọc, đơn điệu; con người chuyển sang giám sát, sáng tạo — cần nâng cao trình độ.","points":0.25},{"type":"mcq","level":"VD","q":"Một quốc gia muốn phát triển công nghiệp 4.0. Việc ưu tiên đầu tư là","options":["A. hạ tầng số và đào tạo nhân lực công nghệ","B. chỉ mua thật nhiều robot","C. đóng cửa với thế giới","D. quay lại sản xuất thủ công"],"answer":"A","explain":"Phát triển công nghiệp 4.0 cần hạ tầng số (Internet, dữ liệu) và nhân lực làm chủ công nghệ — mua robot mà không có hai điều này sẽ không hiệu quả.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (tổng kết):","statements":["a) Tự động hóa: máy thay sức người.","b) Dây chuyền: nhiều máy nối tiếp tự động.","c) Robot: thiết bị lập trình được.","d) CMCN 4.0: công nghệ số."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng, tóm tắt toàn bài.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tương lai lao động:","statements":["a) Lao động cần trình độ cao hơn.","b) Cần học tập suốt đời.","c) Kỹ năng số ngày càng quan trọng.","d) Học xong phổ thông là đủ cho mọi nghề."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: CMCN 4.0 đòi hỏi học tập suốt đời, liên tục cập nhật.","points":1},{"type":"short","level":"VDC","q":"Tóm tắt con đường phát triển từ cơ khí hóa đến nhà máy thông minh.","answer":"Cơ khí hóa (máy thay sức người), tự động hóa (máy tự làm), nhà máy thông minh (máy tự giao tiếp qua IoT, AI)","explain":"Cơ khí hóa: máy thay sức người. Tự động hóa: máy tự thực hiện công việc. Nhà máy thông minh (4.0): máy móc kết nối IoT, AI tự phối hợp, con người giám sát số.","points":0.5},{"type":"short","level":"VDC","q":"Nêu một thách thức của Việt Nam khi phát triển tự động hóa, công nghiệp 4.0.","answer":"Thiếu nhân lực trình độ cao, vốn đầu tư lớn (hạ tầng số chưa đồng đều)","explain":"Thách thức: thiếu nhân lực làm chủ công nghệ số, vốn đầu tư lớn, hạ tầng số chưa đồng đều giữa các vùng, doanh nghiệp nhỏ khó tiếp cận.","points":0.5}]}]}</script>
