<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Mặt cắt là hình biểu diễn","options":["A. phần vật thể nằm trên mặt phẳng cắt","B. toàn bộ vật thể sau khi cắt","C. phần vật thể phía sau mặt phẳng cắt","D. hình chiếu của vật thể"],"answer":"A","explain":"Mặt cắt chỉ biểu diễn phần vật thể nằm trên mặt phẳng cắt (phần bị mặt phẳng cắt qua).","points":0.25},{"type":"mcq","level":"NB","q":"Hình cắt là hình biểu diễn","options":["A. phần vật thể còn lại sau khi tưởng tượng cắt bỏ một phần","B. chỉ phần bị mặt phẳng cắt qua","C. hình chiếu đứng của vật thể","D. mặt ngoài của vật thể"],"answer":"A","explain":"Hình cắt biểu diễn phần vật thể còn lại sau khi tưởng tượng cắt bỏ một phần, gồm mặt cắt và phần phía sau mặt phẳng cắt.","points":0.25},{"type":"mcq","level":"NB","q":"Đường gạch trên mặt cắt được vẽ bằng nét nào?","options":["A. Nét liền mảnh nghiêng 45°","B. Nét liền đậm ngang","C. Nét đứt mảnh","D. Nét chấm gạch"],"answer":"A","explain":"Đường gạch mặt cắt vẽ bằng nét liền mảnh, nghiêng 45° so với đường bao.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa hình cắt và mặt cắt là","options":["A. hình cắt gồm mặt cắt và phần vật thể phía sau mặt phẳng cắt","B. mặt cắt gồm hình cắt và phần vật thể phía trước","C. hai khái niệm hoàn toàn giống nhau","D. không có liên quan gì"],"answer":"A","explain":"Hình cắt = mặt cắt + phần vật thể còn lại phía sau mặt phẳng cắt, nên đầy đủ hơn mặt cắt.","points":0.25},{"type":"mcq","level":"TH","q":"Trên mặt cắt, phần rỗng của vật thể (lỗ, hốc) được thể hiện bằng cách","options":["A. không kẻ gạch","B. kẻ gạch chéo 45°","C. tô đen","D. vẽ nét đứt"],"answer":"A","explain":"Phần rỗng (lỗ, hốc) trên mặt cắt không kẻ gạch; chỉ phần vật liệu đặc mới kẻ gạch chéo.","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết đối xứng có cấu tạo trong và ngoài đều cần thể hiện. Cách biểu diễn hợp lý nhất là","options":["A. hình cắt một nửa: nửa vẽ hình cắt, nửa vẽ hình chiếu","B. hình cắt toàn bộ","C. chỉ vẽ ba hình chiếu","D. hình cắt cục bộ"],"answer":"A","explain":"Với vật thể đối xứng, dùng hình cắt một nửa: một nửa thể hiện cấu tạo trong (hình cắt), nửa còn lại thể hiện hình dạng ngoài (hình chiếu), tiết kiệm diện tích bản vẽ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về khái niệm mặt cắt, hình cắt:","statements":["a) Mặt cắt chỉ vẽ phần vật thể bị mặt phẳng cắt qua.","b) Hình cắt bao gồm mặt cắt và phần vật thể phía sau mặt phẳng cắt.","c) Hình cắt thể hiện đầy đủ hơn mặt cắt.","d) Mặt cắt và hình cắt là hai tên gọi của cùng một hình biểu diễn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mặt cắt và hình cắt là hai hình biểu diễn khác nhau.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về quy ước vẽ:","statements":["a) Đường gạch mặt cắt nghiêng 45° so với đường bao.","b) Vị trí mặt phẳng cắt vẽ bằng nét cắt có mũi tên chỉ hướng nhìn.","c) Tên hình cắt ghi dạng chữ cái, ví dụ A – A.","d) Phần lỗ rỗng trên mặt cắt được kẻ gạch chéo dày đặc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: phần rỗng không kẻ gạch.","points":1},{"type":"short","level":"VDC","q":"Dấu hiệu nào trên bản vẽ giúp nhận biết ngay đó là hình cắt?","answer":"Vùng gạch chéo 45°","explain":"Vùng gạch chéo 45° (đường gạch mặt cắt) là dấu hiệu đặc trưng để nhận biết hình cắt, mặt cắt trên bản vẽ.","points":0.5},{"type":"short","level":"VDC","q":"Khi chỉ cần thể hiện một chi tiết nhỏ bên trong vật thể, nên dùng loại hình cắt nào?","answer":"Hình cắt cục bộ","explain":"Hình cắt cục bộ dùng khi chỉ cần thể hiện một phần nhỏ bên trong, giới hạn bằng nét lượn sóng.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Mặt cắt chập được vẽ","options":["A. ngay trên hình chiếu bằng nét liền mảnh","B. ngoài hình chiếu bằng nét liền đậm","C. thay cho hình chiếu đứng","D. bằng nét đứt"],"answer":"A","explain":"Mặt cắt chập vẽ ngay trên hình chiếu bằng nét liền mảnh.","points":0.25},{"type":"mcq","level":"NB","q":"Mặt cắt rời được vẽ","options":["A. ngoài hình chiếu bằng nét liền đậm","B. ngay trên hình chiếu bằng nét liền mảnh","C. đè lên hình cắt","D. bằng nét chấm gạch"],"answer":"A","explain":"Mặt cắt rời vẽ riêng ngoài hình chiếu bằng nét liền đậm.","points":0.25},{"type":"mcq","level":"NB","q":"Hình cắt toàn bộ dùng mặt phẳng cắt","options":["A. cắt suốt vật thể","B. chỉ cắt một nửa vật thể","C. cắt một phần nhỏ","D. không cắt vật thể"],"answer":"A","explain":"Hình cắt toàn bộ dùng một mặt phẳng cắt suốt vật thể.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt cắt chập thường dùng cho vật thể","options":["A. dài có tiết diện không đổi như trục, thanh","B. có hình dạng phức tạp","C. rất ngắn","D. rỗng ruột"],"answer":"A","explain":"Mặt cắt chập thường dùng cho vật thể dài có tiết diện không đổi (trục, thanh) để thể hiện hình dạng tiết diện.","points":0.25},{"type":"mcq","level":"TH","q":"Hình cắt một nửa thường dùng cho vật thể","options":["A. đối xứng","B. không đối xứng","C. rất dài","D. rất nhỏ"],"answer":"A","explain":"Hình cắt một nửa dùng cho vật thể đối xứng: một nửa vẽ hình cắt (cấu tạo trong), nửa còn lại vẽ hình chiếu (hình dạng ngoài).","points":0.25},{"type":"mcq","level":"VD","q":"Trên hình cắt cục bộ, đường giới hạn phần cắt được vẽ bằng","options":["A. nét lượn sóng","B. nét liền đậm","C. nét đứt mảnh","D. nét chấm gạch"],"answer":"A","explain":"Hình cắt cục bộ giới hạn phần cắt bằng nét lượn sóng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về các loại mặt cắt:","statements":["a) Mặt cắt chập vẽ ngay trên hình chiếu.","b) Mặt cắt rời vẽ ngoài hình chiếu.","c) Mặt cắt chập vẽ bằng nét liền đậm.","d) Mặt cắt rời vẽ bằng nét liền mảnh."],"answer":["T","T","F","F"],"explain":"a) Đúng. b) Đúng. c) Sai: mặt cắt chập vẽ bằng nét liền mảnh. d) Sai: mặt cắt rời vẽ bằng nét liền đậm.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về các loại hình cắt:","statements":["a) Hình cắt toàn bộ cắt suốt vật thể bằng một mặt phẳng.","b) Hình cắt một nửa dùng cho vật thể đối xứng.","c) Hình cắt cục bộ giới hạn bằng nét lượn sóng.","d) Hình cắt một nửa cắt bỏ hoàn toàn một nửa vật thể trên bản vẽ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hình cắt một nửa chỉ tưởng tượng cắt để vẽ, nửa còn lại vẫn vẽ hình chiếu bình thường.","points":1},{"type":"short","level":"VDC","q":"Tên của hình cắt được ghi như thế nào trên bản vẽ?","answer":"Bằng chữ cái in hoa, ví dụ A – A","explain":"Vị trí mặt phẳng cắt đánh dấu bằng chữ cái in hoa ở hai đầu, tên hình cắt ghi dạng A – A đặt phía trên hình cắt.","points":0.5},{"type":"short","level":"VDC","q":"Mũi tên trên nét vẽ vị trí mặt phẳng cắt chỉ điều gì?","answer":"Hướng nhìn của hình cắt","explain":"Nét vẽ vị trí mặt phẳng cắt có mũi tên chỉ hướng nhìn để biết hình cắt được nhìn từ phía nào.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Mục đích của mặt cắt, hình cắt là","options":["A. thể hiện rõ hình dạng bên trong của vật thể","B. làm đẹp bản vẽ","C. thay thế khung tên","D. giảm số hình chiếu xuống còn một"],"answer":"A","explain":"Mặt cắt, hình cắt dùng để thể hiện rõ cấu tạo bên trong (lỗ, rãnh, hốc) của vật thể.","points":0.25},{"type":"mcq","level":"NB","q":"Khi tưởng tượng cắt vật thể để vẽ hình cắt, phần vật thể bị cắt bỏ được","options":["A. bỏ đi, chỉ vẽ phần còn lại","B. vẽ bằng nét đứt","C. tô đen","D. vẽ thêm một lần nữa"],"answer":"A","explain":"Phần bị cắt bỏ được tưởng tượng bỏ đi, chỉ vẽ phần vật thể còn lại.","points":0.25},{"type":"mcq","level":"NB","q":"Góc nghiêng của đường gạch mặt cắt so với đường bao là","options":["A. 45°","B. 90°","C. 30°","D. 75°"],"answer":"A","explain":"Đường gạch mặt cắt nghiêng 45° so với đường bao (hoặc so với trục chính).","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao trên hình cắt, lỗ rỗng lại không kẻ gạch?","options":["A. Vì chỗ đó không có vật liệu","B. Vì quên kẻ","C. Vì lỗ quá nhỏ","D. Vì quy định cấm kẻ lỗ"],"answer":"A","explain":"Đường gạch biểu diễn vật liệu bị cắt qua; chỗ rỗng không có vật liệu nên không kẻ gạch.","points":0.25},{"type":"mcq","level":"TH","q":"Vị trí của mặt phẳng cắt trên hình chiếu được vẽ bằng","options":["A. nét cắt (nét liền đậm) có mũi tên","B. nét đứt mảnh","C. nét chấm gạch mảnh","D. nét liền mảnh"],"answer":"A","explain":"Vị trí mặt phẳng cắt vẽ bằng nét cắt là nét liền đậm, có mũi tên chỉ hướng nhìn và chữ cái ở hai đầu.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạc lót hình trụ rỗng có hình chiếu đứng là hình chữ nhật với hai nét đứt ở giữa. Để thể hiện rõ lỗ rỗng, nên dùng","options":["A. hình cắt toàn bộ qua trục của bạc","B. mặt cắt chập","C. thêm một hình chiếu nữa","D. vẽ phóng to hình chiếu đứng"],"answer":"A","explain":"Hình cắt toàn bộ qua trục sẽ thể hiện rõ thành bạc (gạch chéo) và lỗ rỗng ở giữa (không gạch), bản vẽ rõ ràng hơn nét đứt.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ý nghĩa mặt cắt, hình cắt:","statements":["a) Mặt cắt giúp thể hiện tiết diện của vật thể.","b) Hình cắt giúp đọc rõ cấu tạo trong mà nét đứt thể hiện rối.","c) Mặt cắt chập thích hợp cho trục, thanh dài.","d) Mọi bản vẽ đều bắt buộc phải có hình cắt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chỉ dùng hình cắt khi cần thiết, không phải bản vẽ nào cũng cần.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về quy ước gạch mặt cắt:","statements":["a) Đường gạch là nét liền mảnh nghiêng 45°.","b) Các chi tiết khác nhau trên cùng hình cắt nên kẻ gạch khác hướng hoặc khác khoảng cách.","c) Lỗ rỗng trên mặt cắt không kẻ gạch.","d) Đường gạch được kẻ đè lên cả đường bao thấy."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: để phân biệt các chi tiết. c) Đúng. d) Sai: đường gạch kẻ trong phạm vi mặt cắt, không đè lên đường bao.","points":1},{"type":"short","level":"VDC","q":"Phân biệt mặt cắt chập và mặt cắt rời về vị trí vẽ.","answer":"Mặt cắt chập vẽ ngay trên hình chiếu, mặt cắt rời vẽ riêng ngoài hình chiếu","explain":"Mặt cắt chập vẽ chồng ngay trên hình chiếu bằng nét liền mảnh; mặt cắt rời vẽ tách riêng ngoài hình chiếu bằng nét liền đậm.","points":0.5},{"type":"short","level":"VDC","q":"Trên hình cắt một nửa của vật thể đối xứng, nửa còn lại (không cắt) được vẽ gì?","answer":"Hình chiếu","explain":"Hình cắt một nửa: một nửa vẽ hình cắt thể hiện cấu tạo trong, nửa còn lại vẽ hình chiếu thể hiện hình dạng ngoài.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Hình cắt cục bộ khác hình cắt toàn bộ ở điểm","options":["A. chỉ cắt một phần nhỏ, giới hạn bằng nét lượn sóng","B. cắt suốt vật thể","C. dùng cho vật đối xứng","D. không cần kẻ gạch"],"answer":"A","explain":"Hình cắt cục bộ chỉ cắt một phần nhỏ của vật thể, giới hạn phần cắt bằng nét lượn sóng.","points":0.25},{"type":"mcq","level":"NB","q":"Trên bản vẽ, chữ cái A, B ở hai đầu nét vẽ vị trí mặt phẳng cắt dùng để","options":["A. đặt tên cho hình cắt tương ứng (A – A, B – B)","B. đánh dấu khổ giấy","C. ghi tên người vẽ","D. chỉ tỉ lệ bản vẽ"],"answer":"A","explain":"Chữ cái in hoa ở hai đầu nét cắt dùng để đặt tên hình cắt, ví dụ A – A.","points":0.25},{"type":"mcq","level":"NB","q":"Nét vẽ vị trí mặt phẳng cắt là","options":["A. nét liền đậm có mũi tên","B. nét đứt mảnh","C. nét chấm gạch mảnh","D. nét liền mảnh"],"answer":"A","explain":"Vị trí mặt phẳng cắt vẽ bằng nét cắt là nét liền đậm, có mũi tên chỉ hướng nhìn.","points":0.25},{"type":"mcq","level":"TH","q":"Khi các chi tiết khác nhau cùng xuất hiện trên một hình cắt, để phân biệt người ta","options":["A. kẻ gạch khác hướng hoặc khác khoảng cách đường gạch","B. tô màu khác nhau","C. đánh số thứ tự","D. vẽ tách thành nhiều hình"],"answer":"A","explain":"Các chi tiết khác nhau trên cùng hình cắt được kẻ gạch khác hướng hoặc khác khoảng cách để phân biệt.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt cắt rời được vẽ bằng nét","options":["A. liền đậm","B. liền mảnh","C. đứt mảnh","D. chấm gạch"],"answer":"A","explain":"Mặt cắt rời vẽ riêng ngoài hình chiếu bằng nét liền đậm.","points":0.25},{"type":"mcq","level":"VD","q":"Một trục bậc có nhiều đoạn đường kính khác nhau. Để thể hiện rõ các bậc trên hình chiếu đứng mà không rối nét đứt, cách tốt nhất là","options":["A. dùng hình cắt toàn bộ dọc theo trục","B. chỉ dùng nét đứt","C. vẽ thêm hình chiếu cạnh","D. dùng mặt cắt chập"],"answer":"A","explain":"Hình cắt toàn bộ dọc trục sẽ thể hiện rõ từng bậc của trục (phần đặc gạch chéo), rõ ràng hơn nhiều so với nét đứt.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về hình cắt một nửa:","statements":["a) Dùng cho vật thể đối xứng.","b) Một nửa vẽ hình cắt, nửa còn lại vẽ hình chiếu.","c) Đường phân cách hai nửa là trục đối xứng vẽ bằng nét chấm gạch.","d) Hình cắt một nửa thể hiện ít thông tin hơn hình cắt toàn bộ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: với vật đối xứng, hình cắt một nửa thể hiện đầy đủ cả trong lẫn ngoài, không thiếu thông tin.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về ứng dụng:","statements":["a) Trục dài nên dùng mặt cắt chập để thể hiện tiết diện.","b) Chi tiết có lỗ ren trong nên dùng hình cắt để thấy rõ ren.","c) Chỉ cần xem một rãnh nhỏ thì dùng hình cắt cục bộ.","d) Vật thể đặc hoàn toàn không bao giờ cần hình cắt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: vật đặc vẫn có thể cần hình cắt nếu hình dạng ngoài phức tạp, khó hình dung bằng hình chiếu.","points":1},{"type":"short","level":"VDC","q":"Vì sao hình cắt một nửa giúp tiết kiệm diện tích bản vẽ?","answer":"Vì một hình vừa thể hiện cấu tạo trong vừa thể hiện hình dạng ngoài","explain":"Hình cắt một nửa gộp cả hình cắt (trong) và hình chiếu (ngoài) vào một hình nên không cần vẽ hai hình riêng, tiết kiệm diện tích.","points":0.5},{"type":"short","level":"VDC","q":"Nêu tên loại mặt cắt được vẽ chồng ngay trên hình chiếu của trục dài.","answer":"Mặt cắt chập","explain":"Mặt cắt chập vẽ ngay trên hình chiếu bằng nét liền mảnh, thường dùng cho trục, thanh dài có tiết diện không đổi.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Phần vật thể nằm trên mặt phẳng cắt được gọi là","options":["A. mặt cắt","B. hình cắt","C. hình chiếu","D. mặt phẳng cắt"],"answer":"A","explain":"Mặt cắt là hình biểu diễn phần vật thể nằm trên mặt phẳng cắt.","points":0.25},{"type":"mcq","level":"NB","q":"Mặt phẳng dùng để tưởng tượng cắt vật thể gọi là","options":["A. mặt phẳng cắt","B. mặt phẳng chiếu","C. mặt phẳng đối xứng","D. mặt phẳng hình chiếu"],"answer":"A","explain":"Mặt phẳng tưởng tượng cắt qua vật thể gọi là mặt phẳng cắt.","points":0.25},{"type":"mcq","level":"NB","q":"Tên hình cắt A – A cho biết","options":["A. hình cắt ứng với mặt phẳng cắt có ký hiệu A ở hai đầu","B. khổ giấy A","C. tỉ lệ 1 : 1","D. vật liệu loại A"],"answer":"A","explain":"Tên hình cắt A – A ứng với mặt phẳng cắt được đánh dấu chữ A ở hai đầu.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác nhau cơ bản giữa mặt cắt và hình cắt là","options":["A. hình cắt còn vẽ thêm phần vật thể phía sau mặt phẳng cắt","B. mặt cắt vẽ bằng nét đậm hơn","C. hình cắt không cần kẻ gạch","D. mặt cắt luôn vẽ rời"],"answer":"A","explain":"Hình cắt = mặt cắt + phần vật thể phía sau mặt phẳng cắt; mặt cắt chỉ vẽ phần bị cắt qua.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vẽ hình cắt, các nét đứt thể hiện phần khuất phía sau mặt phẳng cắt được xử lý thế nào?","options":["A. Thường bỏ đi vì đã thấy rõ cấu tạo trong","B. Vẫn vẽ đầy đủ như hình chiếu","C. Vẽ bằng nét liền đậm","D. Tô đen"],"answer":"A","explain":"Khi đã dùng hình cắt, cấu tạo trong đã rõ nên các nét đứt phía sau thường được bỏ đi cho bản vẽ gọn, dễ đọc.","points":0.25},{"type":"mcq","level":"VD","q":"Một nắp máy có nhiều lỗ bắt bulông. Trên hình cắt qua tâm các lỗ, các lỗ được thể hiện là","options":["A. vùng không gạch chéo (rỗng) xen giữa vùng gạch chéo","B. vùng gạch chéo dày đặc","C. nét đứt","D. vùng tô đen"],"answer":"A","explain":"Lỗ là phần rỗng nên trên mặt cắt không kẻ gạch, nằm xen giữa các vùng vật liệu được gạch chéo.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về mặt phẳng cắt:","statements":["a) Mặt phẳng cắt là mặt phẳng tưởng tượng cắt qua vật thể.","b) Vị trí mặt phẳng cắt vẽ bằng nét liền đậm có mũi tên.","c) Mũi tên chỉ hướng nhìn của hình cắt.","d) Mỗi bản vẽ chỉ được dùng một mặt phẳng cắt duy nhất."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: một bản vẽ có thể dùng nhiều mặt phẳng cắt (A – A, B – B...).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về đọc hình cắt:","statements":["a) Vùng gạch chéo là phần vật liệu đặc bị cắt qua.","b) Vùng không gạch trong phạm vi cắt là lỗ rỗng.","c) Hình cắt cho biết kích thước bên trong dễ hơn nét đứt.","d) Trên hình cắt không bao giờ có nét đứt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: một số nét đứt vẫn có thể giữ lại nếu cần thiết.","points":1},{"type":"short","level":"VDC","q":"Một chi tiết có mặt cắt chập là hình tròn. Hỏi tiết diện của chi tiết có dạng gì?","answer":"Hình tròn (chi tiết dạng trụ)","explain":"Mặt cắt chập thể hiện đúng hình dạng tiết diện; mặt cắt là hình tròn nghĩa là tiết diện tròn (chi tiết dạng trục tròn).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao khi đã vẽ hình cắt toàn bộ, người ta thường bỏ các nét đứt?","answer":"Vì cấu tạo trong đã thể hiện rõ, giữ nét đứt sẽ gây rối","explain":"Hình cắt đã thể hiện rõ cấu tạo trong nên các nét đứt không còn cần thiết; giữ lại sẽ làm bản vẽ rối, khó đọc.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Đường giới hạn của hình cắt cục bộ được vẽ bằng","options":["A. nét lượn sóng","B. nét liền đậm","C. nét đứt mảnh","D. nét chấm gạch mảnh"],"answer":"A","explain":"Hình cắt cục bộ giới hạn phần cắt bằng nét lượn sóng.","points":0.25},{"type":"mcq","level":"NB","q":"Hình cắt một nửa có đường phân cách hai nửa là","options":["A. trục đối xứng vẽ bằng nét chấm gạch mảnh","B. nét liền đậm","C. nét đứt mảnh","D. nét lượn sóng"],"answer":"A","explain":"Hai nửa của hình cắt một nửa phân cách bằng trục đối xứng (nét chấm gạch mảnh).","points":0.25},{"type":"mcq","level":"NB","q":"Mặt cắt dùng để","options":["A. thể hiện hình dạng tiết diện của vật thể","B. thể hiện mặt ngoài của vật thể","C. thay thế hình chiếu bằng","D. ghi kích thước"],"answer":"A","explain":"Mặt cắt dùng để thể hiện hình dạng tiết diện của vật thể tại vị trí cắt.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của hình cắt so với việc chỉ dùng nét đứt trên hình chiếu là","options":["A. thể hiện rõ ràng, dễ đọc, dễ ghi kích thước bên trong","B. vẽ nhanh hơn","C. tốn ít mực hơn","D. không cần ghi kích thước"],"answer":"A","explain":"Hình cắt thể hiện cấu tạo trong rõ ràng, dễ đọc và thuận tiện ghi kích thước hơn nét đứt rối rắm.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt cắt rời khác mặt cắt chập ở","options":["A. vị trí vẽ và loại nét vẽ","B. mục đích sử dụng","C. góc gạch chéo","D. không có điểm khác"],"answer":"A","explain":"Mặt cắt chập vẽ ngay trên hình chiếu bằng nét liền mảnh; mặt cắt rời vẽ riêng ngoài hình chiếu bằng nét liền đậm.","points":0.25},{"type":"mcq","level":"VD","q":"Trên một hình cắt có hai chi tiết lắp ghép với nhau (trục và bạc). Để phân biệt hai chi tiết, người ta","options":["A. kẻ đường gạch của hai chi tiết khác hướng nhau","B. tô một chi tiết màu đen","C. vẽ tách thành hai hình","D. không cần phân biệt"],"answer":"A","explain":"Các chi tiết khác nhau trên cùng hình cắt được kẻ gạch khác hướng (hoặc khác khoảng cách) để phân biệt.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về phân loại:","statements":["a) Có hai loại mặt cắt: chập và rời.","b) Có ba loại hình cắt: toàn bộ, một nửa, cục bộ.","c) Mặt cắt chập vẽ bằng nét liền mảnh.","d) Hình cắt cục bộ dùng cho vật thể đối xứng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hình cắt cục bộ dùng khi chỉ cần thể hiện một phần nhỏ; vật đối xứng dùng hình cắt một nửa.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về kỹ thuật vẽ:","statements":["a) Đường gạch không được đè lên đường bao.","b) Hai chi tiết khác nhau nên gạch khác hướng.","c) Lỗ rỗng không kẻ gạch.","d) Mặt cắt chập nên vẽ đè lên nét đứt của hình chiếu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mặt cắt chập vẽ bằng nét liền mảnh chồng lên hình chiếu, không liên quan đến nét đứt.","points":1},{"type":"short","level":"VDC","q":"Một vật thể đối xứng được biểu diễn bằng hình cắt một nửa. Hỏi nửa hình cắt và nửa hình chiếu nằm ở hai bên đường nào?","answer":"Trục đối xứng","explain":"Hình cắt một nửa phân chia bởi trục đối xứng: một bên vẽ hình cắt, một bên vẽ hình chiếu.","points":0.5},{"type":"short","level":"VDC","q":"Nêu tác dụng của mũi tên trên nét vẽ vị trí mặt phẳng cắt.","answer":"Chỉ hướng nhìn của hình cắt","explain":"Mũi tên trên nét cắt chỉ hướng nhìn, cho biết hình cắt được quan sát từ phía nào.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Khi vẽ hình cắt, phần vật thể phía trước mặt phẳng cắt được","options":["A. tưởng tượng cắt bỏ đi","B. vẽ bằng nét đứt","C. tô đen","D. vẽ lại bằng nét đậm"],"answer":"A","explain":"Phần vật thể phía trước mặt phẳng cắt được tưởng tượng cắt bỏ đi, chỉ vẽ phần còn lại.","points":0.25},{"type":"mcq","level":"NB","q":"Đường gạch mặt cắt biểu diễn","options":["A. vật liệu của vật thể bị cắt qua","B. phần rỗng của vật thể","C. mặt ngoài của vật thể","D. đường tâm"],"answer":"A","explain":"Đường gạch chéo biểu diễn phần vật liệu bị mặt phẳng cắt qua.","points":0.25},{"type":"mcq","level":"NB","q":"Hình cắt toàn bộ thích hợp với vật thể","options":["A. có cấu tạo trong phức tạp","B. đặc hoàn toàn, đơn giản","C. rất dài và mảnh","D. chỉ cần xem một điểm nhỏ"],"answer":"A","explain":"Hình cắt toàn bộ dùng khi vật thể có cấu tạo trong phức tạp cần thể hiện toàn diện.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt cắt chập vẽ đè lên hình chiếu nên phải vẽ bằng","options":["A. nét liền mảnh để không che mất hình chiếu","B. nét liền đậm","C. nét đứt","D. nét chấm gạch"],"answer":"A","explain":"Mặt cắt chập vẽ chồng lên hình chiếu nên dùng nét liền mảnh để không che lấp các đường của hình chiếu.","points":0.25},{"type":"mcq","level":"TH","q":"Tên gọi A – A của hình cắt được đặt ở","options":["A. phía trên hình cắt tương ứng","B. trong khung tên","C. dưới hình chiếu đứng","D. bên cạnh đường gióng"],"answer":"A","explain":"Tên hình cắt (ví dụ A – A) ghi phía trên hình cắt tương ứng.","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết máy có rãnh then nhỏ bên trong lỗ trụ. Để thể hiện rãnh then mà không cần cắt cả chi tiết, nên dùng","options":["A. hình cắt cục bộ tại vị trí rãnh then","B. hình cắt toàn bộ","C. mặt cắt rời toàn chi tiết","D. thêm hai hình chiếu nữa"],"answer":"A","explain":"Chỉ cần thể hiện một chi tiết nhỏ (rãnh then) thì dùng hình cắt cục bộ, giới hạn bằng nét lượn sóng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về quy ước chung:","statements":["a) Phần bị cắt qua được kẻ gạch chéo 45° bằng nét liền mảnh.","b) Phần rỗng không kẻ gạch.","c) Vị trí mặt phẳng cắt có mũi tên chỉ hướng nhìn.","d) Hình cắt vẽ xong không cần ghi kích thước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hình cắt vẫn cần ghi đầy đủ kích thước để chế tạo.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về so sánh các loại:","statements":["a) Hình cắt toàn bộ cho thông tin trong đầy đủ nhất.","b) Hình cắt một nửa tiết kiệm diện tích hơn hình cắt toàn bộ.","c) Hình cắt cục bộ chỉ dùng cho chi tiết nhỏ.","d) Mặt cắt rời cho thông tin nhiều hơn hình cắt toàn bộ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hình cắt toàn bộ cho thông tin đầy đủ hơn mặt cắt rời.","points":1},{"type":"short","level":"VDC","q":"Vì sao mặt cắt chập thường chỉ dùng cho vật thể dài có tiết diện không đổi?","answer":"Vì vẽ chồng lên hình chiếu nên chỉ hợp với tiết diện đơn giản, không che hình chiếu","explain":"Mặt cắt chập vẽ chồng ngay trên hình chiếu nên chỉ phù hợp với tiết diện đơn giản của vật thể dài (trục, thanh); tiết diện phức tạp sẽ che lấp, gây rối hình chiếu.","points":0.5},{"type":"short","level":"VDC","q":"Trên hình cắt, hai chi tiết lắp với nhau được phân biệt bằng cách nào?","answer":"Kẻ đường gạch khác hướng nhau","explain":"Các chi tiết khác nhau trên cùng hình cắt được kẻ gạch khác hướng hoặc khác khoảng cách để phân biệt.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Số loại mặt cắt cơ bản là","options":["A. 2 (chập và rời)","B. 3","C. 4","D. 1"],"answer":"A","explain":"Có hai loại mặt cắt: mặt cắt chập và mặt cắt rời.","points":0.25},{"type":"mcq","level":"NB","q":"Số loại hình cắt cơ bản là","options":["A. 3 (toàn bộ, một nửa, cục bộ)","B. 2","C. 4","D. 5"],"answer":"A","explain":"Có ba loại hình cắt: toàn bộ, một nửa và cục bộ.","points":0.25},{"type":"mcq","level":"NB","q":"Chữ cái đặt tên mặt phẳng cắt thường là","options":["A. chữ in hoa (A, B, C...)","B. chữ in thường","C. chữ số","D. ký hiệu đặc biệt"],"answer":"A","explain":"Vị trí mặt phẳng cắt được đánh dấu bằng chữ cái in hoa ở hai đầu.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đọc hình cắt của một bạc lót, vùng không gạch chéo ở giữa cho biết","options":["A. đó là lỗ rỗng của bạc","B. đó là phần vật liệu cứng nhất","C. bản vẽ bị thiếu nét","D. đó là đường tâm"],"answer":"A","explain":"Vùng không gạch trong phạm vi mặt cắt là phần rỗng (lỗ) của chi tiết.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây SAI?","options":["A. Mặt cắt vẽ cả phần vật thể phía sau mặt phẳng cắt","B. Hình cắt gồm mặt cắt và phần phía sau mặt phẳng cắt","C. Đường gạch mặt cắt nghiêng 45°","D. Lỗ rỗng trên mặt cắt không kẻ gạch"],"answer":"A","explain":"Mặt cắt chỉ vẽ phần bị mặt phẳng cắt qua; vẽ cả phần phía sau là hình cắt.","points":0.25},{"type":"mcq","level":"VD","q":"Một van nước có cấu tạo trong phức tạp và đối xứng qua mặt phẳng dọc. Cách biểu diễn tối ưu là","options":["A. hình cắt một nửa theo mặt phẳng đối xứng","B. chỉ vẽ hình chiếu đứng","C. hình cắt cục bộ","D. mặt cắt chập"],"answer":"A","explain":"Vật đối xứng có cấu tạo trong phức tạp: dùng hình cắt một nửa vừa thể hiện cấu tạo trong vừa thể hiện hình dạng ngoài, gọn và đầy đủ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nhận biết trên bản vẽ:","statements":["a) Vùng gạch chéo 45° là dấu hiệu của mặt cắt, hình cắt.","b) Nét lượn sóng là dấu hiệu của hình cắt cục bộ.","c) Chữ A – A phía trên một hình cho biết đó là hình cắt.","d) Nét đứt là dấu hiệu bắt buộc của mọi hình cắt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: trên hình cắt thường bỏ nét đứt, không bắt buộc.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về thực hành vẽ:","statements":["a) Trước khi vẽ hình cắt phải xác định vị trí mặt phẳng cắt.","b) Mũi tên hướng nhìn giúp đặt đúng vị trí hình cắt.","c) Hình cắt một nửa bắt buộc phải có trục đối xứng.","d) Mặt cắt rời phải vẽ đè lên hình chiếu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mặt cắt rời vẽ riêng ngoài hình chiếu; vẽ đè lên hình chiếu là mặt cắt chập.","points":1},{"type":"short","level":"VDC","q":"Một kỹ sư muốn thể hiện tiết diện của một thanh thép dài tại giữa thanh. Nên dùng loại mặt cắt nào?","answer":"Mặt cắt rời (hoặc mặt cắt chập)","explain":"Thể hiện tiết diện của thanh dài có thể dùng mặt cắt rời vẽ riêng bên cạnh, hoặc mặt cắt chập vẽ ngay trên hình chiếu.","points":0.5},{"type":"short","level":"VDC","q":"Giải thích vì sao trên hình cắt toàn bộ của chi tiết rỗng, vùng lỗ ở giữa không được kẻ gạch.","answer":"Vì lỗ là phần rỗng không có vật liệu bị cắt qua","explain":"Đường gạch chỉ kẻ trên phần vật liệu đặc bị mặt phẳng cắt qua; lỗ rỗng không có vật liệu nên không kẻ gạch.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tưởng tượng cắt vật thể để vẽ hình cắt nhằm mục đích","options":["A. nhìn thấy cấu tạo bên trong của vật thể","B. làm vật thể nhỏ lại","C. kiểm tra độ cứng vật liệu","D. trang trí bản vẽ"],"answer":"A","explain":"Tưởng tượng cắt vật thể để bộc lộ, thể hiện rõ cấu tạo bên trong của nó.","points":0.25},{"type":"mcq","level":"NB","q":"Trên hình cắt, phần vật liệu đặc bị cắt qua được","options":["A. kẻ gạch chéo","B. tô đen hoàn toàn","C. để trắng","D. vẽ nét đứt"],"answer":"A","explain":"Phần vật liệu đặc bị mặt phẳng cắt qua được kẻ gạch chéo 45° bằng nét liền mảnh.","points":0.25},{"type":"mcq","level":"NB","q":"Mặt cắt rời được vẽ ở đâu?","options":["A. Ngoài hình chiếu, tại vị trí thuận tiện","B. Đè lên hình chiếu đứng","C. Trong khung tên","D. Thay cho hình chiếu bằng"],"answer":"A","explain":"Mặt cắt rời vẽ riêng ngoài hình chiếu, tại vị trí thuận tiện trên bản vẽ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao mặt cắt chập vẽ bằng nét liền mảnh mà không vẽ bằng nét liền đậm?","options":["A. Để không che lấp các đường của hình chiếu bên dưới","B. Vì quy định tiết kiệm mực","C. Vì nét đậm chỉ dùng cho khung tên","D. Vì mặt cắt chập không quan trọng"],"answer":"A","explain":"Mặt cắt chập vẽ chồng lên hình chiếu nên dùng nét liền mảnh để không che lấp các đường nét của hình chiếu.","points":0.25},{"type":"mcq","level":"TH","q":"Hình cắt nào sau đây cần ít diện tích bản vẽ nhất khi thể hiện vật đối xứng?","options":["A. Hình cắt một nửa","B. Hình cắt toàn bộ","C. Hai hình cắt toàn bộ","D. Ba hình chiếu"],"answer":"A","explain":"Hình cắt một nửa gộp cả trong lẫn ngoài vào một hình nên tiết kiệm diện tích nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Trên hình cắt dọc trục của một bulông, phần ren trong của đai ốc lắp trên bulông được thể hiện","options":["A. bằng đường gạch chéo của vật liệu đai ốc","B. bằng nét đứt","C. không thể hiện","D. bằng vùng tô đen"],"answer":"A","explain":"Trên hình cắt, ren trong của đai ốc là phần vật liệu bị cắt qua nên được kẻ gạch chéo như các phần đặc khác.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tổng kết bài học:","statements":["a) Mặt cắt chỉ vẽ phần bị mặt phẳng cắt qua.","b) Hình cắt đầy đủ hơn mặt cắt.","c) Có 2 loại mặt cắt và 3 loại hình cắt.","d) Đường gạch mặt cắt là nét liền đậm nghiêng 45°."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đường gạch mặt cắt là nét liền mảnh nghiêng 45°.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tình huống thực tế:","statements":["a) Muốn xem tiết diện thanh ray, dùng mặt cắt rời là hợp lý.","b) Muốn xem rãnh then trong lỗ, dùng hình cắt cục bộ là hợp lý.","c) Chi tiết đối xứng nên ưu tiên hình cắt một nửa.","d) Mọi chi tiết đơn giản đều nên vẽ thêm hình cắt cho đẹp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chỉ dùng hình cắt khi cần thiết, chi tiết đơn giản không cần.","points":1},{"type":"short","level":"VDC","q":"Một bản vẽ có hai hình cắt tên là A – A và B – B. Hỏi bản vẽ đó dùng bao nhiêu mặt phẳng cắt?","answer":"2","explain":"Mỗi tên hình cắt (A – A, B – B) ứng với một mặt phẳng cắt riêng, vậy có 2 mặt phẳng cắt.","points":0.5},{"type":"short","level":"VDC","q":"Nêu điểm giống nhau giữa mặt cắt chập và mặt cắt rời.","answer":"Đều thể hiện tiết diện vật thể tại vị trí cắt, đều kẻ gạch chéo 45°","explain":"Cả hai đều biểu diễn phần vật thể bị mặt phẳng cắt qua với đường gạch chéo 45°; chỉ khác vị trí vẽ và loại nét vẽ.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Hình biểu diễn phần vật thể còn lại sau khi tưởng tượng cắt bỏ một phần gọi là","options":["A. hình cắt","B. mặt cắt","C. hình chiếu","D. hình trích"],"answer":"A","explain":"Hình cắt là hình biểu diễn phần vật thể còn lại sau khi tưởng tượng cắt bỏ một phần.","points":0.25},{"type":"mcq","level":"NB","q":"Đường gạch chéo trên mặt cắt có góc nghiêng","options":["A. 45° so với đường bao","B. 90° so với đường bao","C. 30° so với đường bao","D. 0° so với đường bao"],"answer":"A","explain":"Đường gạch mặt cắt nghiêng 45° so với đường bao.","points":0.25},{"type":"mcq","level":"NB","q":"Nét lượn sóng xuất hiện trong loại hình cắt nào?","options":["A. Hình cắt cục bộ","B. Hình cắt toàn bộ","C. Hình cắt một nửa","D. Mọi loại hình cắt"],"answer":"A","explain":"Nét lượn sóng dùng làm đường giới hạn của hình cắt cục bộ.","points":0.25},{"type":"mcq","level":"TH","q":"Khi có nhiều mặt phẳng cắt trên một bản vẽ, cách phân biệt các hình cắt là","options":["A. đặt tên khác nhau (A – A, B – B...)","B. vẽ màu khác nhau","C. đánh số thứ tự hình","D. không cần phân biệt"],"answer":"A","explain":"Mỗi mặt phẳng cắt được đánh dấu chữ cái riêng (A, B...) và hình cắt tương ứng mang tên A – A, B – B...","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm lớn nhất của hình cắt một nửa đối với vật thể đối xứng là","options":["A. vừa thể hiện cấu tạo trong vừa thể hiện hình dạng ngoài trong một hình","B. vẽ nhanh gấp đôi","C. không cần ghi kích thước","D. không cần kẻ gạch"],"answer":"A","explain":"Hình cắt một nửa gộp cả thông tin trong (hình cắt) và ngoài (hình chiếu) vào một hình duy nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Một sinh viên vẽ hình cắt nhưng quên kẻ gạch chéo phần vật liệu đặc. Bản vẽ này","options":["A. sai quy ước, khó phân biệt đặc – rỗng","B. vẫn đúng vì đã có hình dạng","C. chỉ sai khi có lỗ","D. vẫn chấp nhận được"],"answer":"A","explain":"Không kẻ gạch sẽ không phân biệt được phần đặc và phần rỗng, vi phạm quy ước và gây khó đọc bản vẽ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ký hiệu:","statements":["a) Nét cắt là nét liền đậm có mũi tên.","b) Chữ cái đặt tên mặt phẳng cắt là chữ in hoa.","c) Tên hình cắt ghi phía trên hình cắt.","d) Đường gạch mặt cắt là nét đứt mảnh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đường gạch mặt cắt là nét liền mảnh.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về lựa chọn loại hình cắt:","statements":["a) Vật đối xứng: ưu tiên hình cắt một nửa.","b) Chỉ xem một chỗ nhỏ: dùng hình cắt cục bộ.","c) Cấu tạo trong phức tạp toàn chi tiết: dùng hình cắt toàn bộ.","d) Tiết diện thanh dài: dùng mặt cắt chập hoặc rời."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng, tóm tắt cách chọn loại mặt cắt, hình cắt phù hợp.","points":1},{"type":"short","level":"VDC","q":"Trên hình cắt của một chi tiết, người ta thấy hai vùng gạch chéo có hướng gạch ngược nhau. Điều đó cho biết gì?","answer":"Đó là hai chi tiết khác nhau (lắp ghép với nhau)","explain":"Các chi tiết khác nhau trên cùng hình cắt được kẻ gạch khác hướng để phân biệt.","points":0.5},{"type":"short","level":"VDC","q":"Một mặt phẳng cắt đi qua trục của chi tiết tròn xoay. Hình cắt thu được gọi là gì?","answer":"Hình cắt dọc (hình cắt toàn bộ qua trục)","explain":"Mặt phẳng cắt chứa trục của chi tiết tròn xoay cho hình cắt dọc, thường là hình cắt toàn bộ thể hiện rõ cấu tạo trong.","points":0.5}]}]}</script>
