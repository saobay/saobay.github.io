{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Phép chiếu vuông góc là phép chiếu mà","options":["A. tia chiếu vuông góc với mặt phẳng chiếu","B. tia chiếu xiên góc với mặt phẳng chiếu","C. tia chiếu song song với mặt phẳng chiếu","D. tia chiếu xuất phát từ một điểm"],"answer":"A","explain":"Phép chiếu vuông góc có các tia chiếu vuông góc với mặt phẳng chiếu.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu của vật thể lên mặt phẳng chiếu đứng gọi là","options":["A. hình chiếu đứng","B. hình chiếu bằng","C. hình chiếu cạnh","D. hình chiếu trục đo"],"answer":"A","explain":"Chiếu vật thể lên mặt phẳng chiếu đứng ta được hình chiếu đứng.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu bằng cho biết hai kích thước nào của vật thể?","options":["A. Chiều dài và chiều rộng","B. Chiều dài và chiều cao","C. Chiều rộng và chiều cao","D. Chỉ chiều cao"],"answer":"A","explain":"Hình chiếu bằng (nhìn từ trên xuống) cho biết chiều dài và chiều rộng của vật thể.","points":0.25},{"type":"mcq","level":"TH","q":"Theo phương pháp góc chiếu thứ nhất, hình chiếu bằng được đặt ở vị trí nào?","options":["A. Phía dưới hình chiếu đứng","B. Phía trên hình chiếu đứng","C. Phía bên phải hình chiếu đứng","D. Phía bên trái hình chiếu đứng"],"answer":"A","explain":"Theo phương pháp góc chiếu thứ nhất: hình chiếu bằng đặt phía dưới hình chiếu đứng, hình chiếu cạnh đặt phía bên phải.","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu cạnh cho biết hai kích thước nào của vật thể?","options":["A. Chiều rộng và chiều cao","B. Chiều dài và chiều cao","C. Chiều dài và chiều rộng","D. Chỉ chiều dài"],"answer":"A","explain":"Hình chiếu cạnh (nhìn từ bên cạnh) cho biết chiều rộng và chiều cao của vật thể.","points":0.25},{"type":"mcq","level":"VD","q":"Một khối hộp chữ nhật có kích thước dài 60 mm, rộng 40 mm, cao 30 mm. Trên hình chiếu đứng của nó, hai kích thước thể hiện là","options":["A. 60 mm và 30 mm","B. 60 mm và 40 mm","C. 40 mm và 30 mm","D. 60 mm và 60 mm"],"answer":"A","explain":"Hình chiếu đứng cho biết chiều dài và chiều cao, tức 60 mm và 30 mm.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ba mặt phẳng chiếu:","statements":["a) Mặt phẳng chiếu đứng đặt thẳng đứng phía sau vật thể.","b) Mặt phẳng chiếu bằng đặt nằm ngang phía dưới vật thể.","c) Mặt phẳng chiếu cạnh đặt thẳng đứng bên cạnh vật thể.","d) Ba mặt phẳng chiếu đôi một song song với nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo định nghĩa. d) Sai: ba mặt phẳng chiếu đôi một vuông góc với nhau.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về vị trí các hình chiếu:","statements":["a) Hình chiếu bằng đặt phía dưới hình chiếu đứng.","b) Hình chiếu cạnh đặt phía bên phải hình chiếu đứng.","c) Hình chiếu đứng và hình chiếu bằng có chiều dài bằng nhau.","d) Hình chiếu đứng và hình chiếu cạnh có chiều rộng bằng nhau."],"answer":["T","T","T","F"],"explain":"a), b) Đúng (góc chiếu thứ nhất). c) Đúng. d) Sai: hình chiếu đứng và hình chiếu cạnh bằng nhau về chiều cao.","points":1},{"type":"short","level":"VDC","q":"Một vật thể có hình chiếu đứng là hình chữ nhật, hình chiếu bằng là hình tròn, hình chiếu cạnh là hình chữ nhật. Vật thể đó là khối gì?","answer":"Hình trụ","explain":"Hình chiếu bằng là hình tròn cho thấy đáy là tròn; hai hình chiếu còn lại là hình chữ nhật nên vật thể là hình trụ đặt thẳng đứng.","points":0.5},{"type":"short","level":"VDC","q":"Trong phương pháp góc chiếu thứ nhất, hình chiếu cạnh nằm ở phía nào của hình chiếu đứng?","answer":"Bên phải","explain":"Theo phương pháp góc chiếu thứ nhất, hình chiếu cạnh đặt phía bên phải hình chiếu đứng.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hình chiếu của vật thể lên mặt phẳng chiếu bằng gọi là","options":["A. hình chiếu bằng","B. hình chiếu đứng","C. hình chiếu cạnh","D. hình chiếu phối cảnh"],"answer":"A","explain":"Chiếu vật thể lên mặt phẳng chiếu bằng ta được hình chiếu bằng.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu đứng cho biết hai kích thước nào của vật thể?","options":["A. Chiều dài và chiều cao","B. Chiều dài và chiều rộng","C. Chiều rộng và chiều cao","D. Chỉ chiều rộng"],"answer":"A","explain":"Hình chiếu đứng (nhìn từ trước) cho biết chiều dài và chiều cao của vật thể.","points":0.25},{"type":"mcq","level":"NB","q":"Mặt phẳng chiếu bằng có vị trí như thế nào?","options":["A. Nằm ngang, đặt dưới vật thể","B. Thẳng đứng, đặt sau vật thể","C. Thẳng đứng, đặt bên cạnh vật thể","D. Xiên 45° so với vật thể"],"answer":"A","explain":"Mặt phẳng chiếu bằng nằm ngang và đặt phía dưới vật thể.","points":0.25},{"type":"mcq","level":"TH","q":"Theo phương pháp góc chiếu thứ nhất, hình chiếu cạnh được đặt ở","options":["A. phía bên phải hình chiếu đứng","B. phía bên trái hình chiếu đứng","C. phía dưới hình chiếu đứng","D. phía trên hình chiếu đứng"],"answer":"A","explain":"Hình chiếu cạnh đặt phía bên phải hình chiếu đứng.","points":0.25},{"type":"mcq","level":"TH","q":"Cặp hình chiếu nào sau đây có chiều cao bằng nhau?","options":["A. Hình chiếu đứng và hình chiếu cạnh","B. Hình chiếu đứng và hình chiếu bằng","C. Hình chiếu bằng và hình chiếu cạnh","D. Không có cặp nào"],"answer":"A","explain":"Hình chiếu đứng và hình chiếu cạnh đều thể hiện chiều cao nên có chiều cao bằng nhau (dóng ngang hàng).","points":0.25},{"type":"mcq","level":"VD","q":"Hình chiếu đứng và hình chiếu bằng của một vật thể đều là hình vuông cạnh a. Có thể kết luận chắc chắn vật thể là","options":["A. hình lập phương","B. hình trụ","C. hình cầu","D. chưa đủ căn cứ, cần thêm hình chiếu cạnh"],"answer":"D","explain":"Hai hình chiếu chưa đủ để xác định duy nhất vật thể (ví dụ hình trụ đặt đứng cũng có thể cho kết quả tương tự nếu a bằng đường kính). Cần hình chiếu cạnh mới kết luận chắc chắn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về phép chiếu vuông góc:","statements":["a) Tia chiếu vuông góc với mặt phẳng chiếu.","b) Hình chiếu vuông góc thể hiện đầy đủ ba chiều của vật thể trên một hình.","c) Mỗi hướng chiếu cho một hình chiếu khác nhau.","d) Phép chiếu vuông góc là cơ sở của phương pháp hình chiếu trong vẽ kỹ thuật."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: mỗi hình chiếu chỉ thể hiện hai trong ba chiều. c) Đúng. d) Đúng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về liên hệ kích thước:","statements":["a) Hình chiếu đứng và hình chiếu bằng bằng nhau về chiều dài.","b) Hình chiếu bằng và hình chiếu cạnh bằng nhau về chiều rộng.","c) Hình chiếu đứng và hình chiếu cạnh bằng nhau về chiều cao.","d) Cả ba hình chiếu đều thể hiện chiều dài của vật thể."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo quy tắc dài – rộng – cao. d) Sai: hình chiếu cạnh không thể hiện chiều dài.","points":1},{"type":"short","level":"VDC","q":"Ba hình chiếu của một vật thể đều là hình tròn bằng nhau. Vật thể đó là khối gì?","answer":"Hình cầu","explain":"Hình cầu chiếu theo mọi hướng đều cho hình tròn, nên cả ba hình chiếu đều là hình tròn.","points":0.5},{"type":"short","level":"VDC","q":"Khi vẽ hình chiếu, cạnh khuất của vật thể được thể hiện bằng nét vẽ nào?","answer":"Nét đứt","explain":"Cạnh khuất (không nhìn thấy) được vẽ bằng nét đứt mảnh.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Hình chiếu của một đoạn thẳng song song với mặt phẳng chiếu là","options":["A. đoạn thẳng bằng đoạn thẳng đã cho","B. một điểm","C. đoạn thẳng dài gấp đôi","D. đoạn thẳng ngắn hơn"],"answer":"A","explain":"Đoạn thẳng song song với mặt phẳng chiếu thì hình chiếu vuông góc của nó bằng chính nó.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu của một điểm lên mặt phẳng chiếu là","options":["A. một điểm","B. một đoạn thẳng","C. một đường tròn","D. một hình vuông"],"answer":"A","explain":"Hình chiếu vuông góc của một điểm là một điểm.","points":0.25},{"type":"mcq","level":"NB","q":"Để thể hiện đầy đủ hình dạng vật thể, số hình chiếu vuông góc thường dùng là","options":["A. ba","B. một","C. hai","D. bốn"],"answer":"A","explain":"Thường dùng ba hình chiếu (đứng, bằng, cạnh) để thể hiện đầy đủ vật thể.","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu đứng của hình trụ đặt thẳng đứng (trục vuông góc với mặt bằng) là","options":["A. hình chữ nhật","B. hình tròn","C. hình tam giác","D. hình vuông"],"answer":"A","explain":"Nhìn ngang hình trụ đặt đứng ta thấy hình chữ nhật (chiều cao trụ × đường kính đáy).","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu bằng của hình nón đặt thẳng đứng là","options":["A. hình tròn có tâm","B. hình tam giác cân","C. hình chữ nhật","D. hình vuông"],"answer":"A","explain":"Nhìn từ trên xuống, hình nón cho hình tròn (đáy nón) có tâm là đỉnh nón chiếu xuống.","points":0.25},{"type":"mcq","level":"VD","q":"Một vật thể có hình chiếu đứng là hình tam giác cân, hình chiếu bằng là hình tròn có tâm. Vật thể đó là","options":["A. hình nón đặt thẳng đứng","B. hình trụ đặt thẳng đứng","C. hình chóp tứ giác đều","D. hình cầu"],"answer":"A","explain":"Hình chiếu bằng tròn có tâm + hình chiếu đứng tam giác cân là đặc trưng của hình nón đặt thẳng đứng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về hình chiếu các khối cơ bản:","statements":["a) Ba hình chiếu của hình cầu đều là hình tròn.","b) Hình chiếu bằng của hình trụ đặt đứng là hình tròn.","c) Hình chiếu đứng của hình hộp chữ nhật là hình chữ nhật.","d) Hình chiếu đứng của hình nón đặt đứng là hình tròn."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: hình chiếu đứng của hình nón đặt đứng là hình tam giác cân.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về cách vẽ hình chiếu:","statements":["a) Nên vẽ mờ ba hình chiếu trước rồi mới tô đậm.","b) Cạnh khuất vẽ bằng nét đứt mảnh.","c) Đường tâm vẽ bằng nét liền đậm.","d) Ba hình chiếu phải khớp nhau về kích thước dài, rộng, cao."],"answer":["T","T","F","T"],"explain":"a) Đúng: vẽ mờ trước để dễ sửa. b) Đúng. c) Sai: đường tâm vẽ bằng nét chấm gạch mảnh. d) Đúng.","points":1},{"type":"short","level":"VDC","q":"Hình chiếu đứng của lăng trụ tam giác đều đặt nằm ngang (mặt đáy tam giác song song với mặt phẳng chiếu cạnh) là hình gì?","answer":"Hình chữ nhật","explain":"Nhìn từ trước, lăng trụ tam giác đều đặt nằm ngang cho hình chữ nhật (chiều dài lăng trụ × chiều cao tam giác đáy).","points":0.5},{"type":"short","level":"VDC","q":"Muốn hình chiếu đứng thể hiện rõ nhất hình dạng của vật thể, ta nên chọn hướng chiếu như thế nào?","answer":"Hướng chiếu cho thấy rõ nhất hình dạng đặc trưng của vật thể","explain":"Hướng chiếu của hình chiếu đứng được chọn sao cho thể hiện rõ nhất hình dạng đặc trưng của vật thể, các hình chiếu khác ít bị khuất.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Mặt phẳng chiếu đứng có vị trí","options":["A. thẳng đứng, đặt sau vật thể","B. nằm ngang, đặt dưới vật thể","C. thẳng đứng, đặt bên cạnh vật thể","D. xiên góc với vật thể"],"answer":"A","explain":"Mặt phẳng chiếu đứng thẳng đứng và đặt phía sau vật thể.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu cạnh là hình chiếu thu được trên","options":["A. mặt phẳng chiếu cạnh","B. mặt phẳng chiếu đứng","C. mặt phẳng chiếu bằng","D. mặt phẳng nghiêng"],"answer":"A","explain":"Hình chiếu cạnh thu được khi chiếu vật thể lên mặt phẳng chiếu cạnh.","points":0.25},{"type":"mcq","level":"NB","q":"Trong ba hình chiếu, hình nào thể hiện chiều rộng và chiều cao của vật thể?","options":["A. Hình chiếu cạnh","B. Hình chiếu đứng","C. Hình chiếu bằng","D. Cả ba hình"],"answer":"A","explain":"Hình chiếu cạnh cho biết chiều rộng và chiều cao của vật thể.","points":0.25},{"type":"mcq","level":"TH","q":"Cặp hình chiếu nào có chiều dài bằng nhau?","options":["A. Hình chiếu đứng và hình chiếu bằng","B. Hình chiếu đứng và hình chiếu cạnh","C. Hình chiếu bằng và hình chiếu cạnh","D. Không có cặp nào"],"answer":"A","explain":"Hình chiếu đứng và hình chiếu bằng đều thể hiện chiều dài nên bằng nhau về chiều dài (dóng thẳng hàng dọc).","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu đứng của hình cầu là","options":["A. hình tròn","B. hình vuông","C. hình tam giác","D. hình chữ nhật"],"answer":"A","explain":"Hình cầu chiếu theo mọi hướng đều cho hình tròn.","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết gồm một khối hộp chữ nhật có khoét một lỗ trụ xuyên suốt theo chiều cao. Trên hình chiếu đứng, lỗ trụ khuất được thể hiện bằng","options":["A. hai nét đứt mảnh song song","B. hai nét liền đậm song song","C. một hình tròn","D. không thể hiện gì"],"answer":"A","explain":"Lỗ trụ khoét theo chiều cao, nhìn từ trước thấy thành lỗ là hai đường khuất song song, vẽ bằng nét đứt mảnh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về hướng chiếu:","statements":["a) Hình chiếu đứng ứng với hướng nhìn từ trước tới.","b) Hình chiếu bằng ứng với hướng nhìn từ trên xuống.","c) Hình chiếu cạnh ứng với hướng nhìn từ trái sang.","d) Mỗi hình chiếu làm mất đi một chiều của vật thể."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng: mỗi hướng nhìn cho một hình chiếu, và mỗi hình chiếu chỉ thể hiện hai trong ba chiều.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về đọc hình chiếu:","statements":["a) Chỉ cần hình chiếu đứng là đủ để chế tạo vật thể.","b) Hình chiếu bằng đặt phía dưới hình chiếu đứng giúp dóng chiều dài.","c) Đường dóng giữa hình chiếu đứng và hình chiếu cạnh là đường ngang.","d) Nét đứt trên hình chiếu thể hiện phần khuất của vật thể."],"answer":["F","T","T","T"],"explain":"a) Sai: một hình chiếu không đủ, cần kết hợp cả ba. b) Đúng. c) Đúng: dóng ngang để khớp chiều cao. d) Đúng.","points":1},{"type":"short","level":"VDC","q":"Hình chiếu đứng và hình chiếu cạnh của một vật thể đều là hình tam giác cân bằng nhau, hình chiếu bằng là hình vuông có hai đường chéo. Vật thể đó là khối gì?","answer":"Hình chóp tứ giác đều","explain":"Đây là đặc trưng của hình chóp tứ giác đều đặt thẳng đứng: đứng và cạnh là tam giác cân, bằng là hình vuông có đường chéo (các cạnh bên).","points":0.5},{"type":"short","level":"VDC","q":"Khi vẽ ba hình chiếu, để dễ sửa chữa người ta thường vẽ các đường bằng nét nào trước?","answer":"Nét mảnh (vẽ mờ)","explain":"Vẽ mờ (nét mảnh) ba hình chiếu trước, kiểm tra khớp kích thước rồi mới tô đậm các nét thấy.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Ba mặt phẳng chiếu đôi một có quan hệ","options":["A. vuông góc với nhau","B. song song với nhau","C. trùng nhau","D. xiên góc 45°"],"answer":"A","explain":"Ba mặt phẳng chiếu (đứng, bằng, cạnh) đôi một vuông góc với nhau.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu bằng ứng với hướng nhìn","options":["A. từ trên xuống","B. từ trước tới","C. từ trái sang","D. từ dưới lên"],"answer":"A","explain":"Hình chiếu bằng thu được khi nhìn vật thể từ trên xuống.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu đứng ứng với hướng nhìn","options":["A. từ trước tới","B. từ trên xuống","C. từ trái sang","D. từ sau tới"],"answer":"A","explain":"Hình chiếu đứng thu được khi nhìn vật thể từ trước tới.","points":0.25},{"type":"mcq","level":"TH","q":"Cặp hình chiếu nào có chiều rộng bằng nhau?","options":["A. Hình chiếu bằng và hình chiếu cạnh","B. Hình chiếu đứng và hình chiếu bằng","C. Hình chiếu đứng và hình chiếu cạnh","D. Không có cặp nào"],"answer":"A","explain":"Hình chiếu bằng và hình chiếu cạnh đều thể hiện chiều rộng nên bằng nhau về chiều rộng.","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu bằng của hình hộp chữ nhật là","options":["A. hình chữ nhật","B. hình tròn","C. hình tam giác","D. hình vuông"],"answer":"A","explain":"Nhìn từ trên xuống, hộp chữ nhật cho hình chữ nhật (dài × rộng).","points":0.25},{"type":"mcq","level":"VD","q":"Một vật thể có hình chiếu đứng là hình chữ nhật, hình chiếu bằng là hình chữ nhật, hình chiếu cạnh là hình tròn. Vật thể đó là","options":["A. hình trụ nằm ngang, trục song song với mặt phẳng chiếu cạnh","B. hình hộp chữ nhật","C. hình cầu","D. hình nón"],"answer":"A","explain":"Hình chiếu cạnh là hình tròn cho thấy mặt đầu tròn; hai hình còn lại là chữ nhật nên vật thể là hình trụ nằm ngang với trục vuông góc mặt phẳng chiếu cạnh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về hình chiếu khối tròn xoay:","statements":["a) Hình trụ đặt đứng có hình chiếu bằng là hình tròn.","b) Hình nón đặt đứng có hình chiếu đứng là tam giác cân.","c) Hình cầu có ba hình chiếu đều là hình tròn.","d) Hình trụ đặt đứng có hình chiếu cạnh là hình tròn."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: hình chiếu cạnh của hình trụ đặt đứng là hình chữ nhật.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về nét vẽ trong hình chiếu:","statements":["a) Cạnh thấy vẽ bằng nét liền đậm.","b) Cạnh khuất vẽ bằng nét đứt mảnh.","c) Đường trục đối xứng vẽ bằng nét chấm gạch mảnh.","d) Đường bao của hình chiếu vẽ bằng nét liền mảnh."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: đường bao của hình chiếu vẽ bằng nét liền đậm.","points":1},{"type":"short","level":"VDC","q":"Giải thích vì sao trên hình chiếu đứng của hình trụ đặt thẳng đứng không thấy đường tròn đáy.","answer":"Vì nhìn từ trước, đáy tròn bị che khuất và thu thành đoạn thẳng","explain":"Nhìn ngang hình trụ đặt đứng, mặt đáy tròn vuông góc với hướng nhìn nên hình chiếu của nó suy biến thành đoạn thẳng (cạnh trên và dưới của hình chữ nhật).","points":0.5},{"type":"short","level":"VDC","q":"Đường dóng dùng để đảm bảo điều gì giữa các hình chiếu?","answer":"Các hình chiếu khớp nhau về kích thước","explain":"Đường dóng (đường gióng nối giữa các hình chiếu) đảm bảo các hình chiếu khớp nhau về chiều dài, chiều rộng, chiều cao.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Phương pháp góc chiếu thứ nhất là phương pháp mà","options":["A. hình chiếu bằng đặt dưới, hình chiếu cạnh đặt bên phải hình chiếu đứng","B. hình chiếu bằng đặt trên, hình chiếu cạnh đặt bên trái hình chiếu đứng","C. chỉ dùng hai hình chiếu","D. các tia chiếu xiên góc"],"answer":"A","explain":"Phương pháp góc chiếu thứ nhất (Việt Nam đang dùng): hình chiếu bằng đặt phía dưới, hình chiếu cạnh đặt phía bên phải hình chiếu đứng.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu của mặt phẳng song song với mặt phẳng chiếu là","options":["A. hình thật của mặt phẳng đó","B. một đoạn thẳng","C. một điểm","D. hình nhỏ hơn một nửa"],"answer":"A","explain":"Mặt phẳng song song với mặt phẳng chiếu thì hình chiếu của nó là hình thật (không biến dạng).","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu của đường thẳng vuông góc với mặt phẳng chiếu là","options":["A. một điểm","B. một đoạn thẳng bằng nó","C. một đoạn thẳng dài hơn","D. một đường tròn"],"answer":"A","explain":"Đường thẳng vuông góc với mặt phẳng chiếu thì hình chiếu của nó suy biến thành một điểm.","points":0.25},{"type":"mcq","level":"TH","q":"Khi chọn hướng chiếu cho hình chiếu đứng, nguyên tắc là","options":["A. chọn hướng thể hiện rõ nhất hình dạng đặc trưng của vật thể","B. luôn chọn hướng từ trái sang","C. luôn chọn hướng từ trên xuống","D. chọn hướng tùy ý"],"answer":"A","explain":"Hướng chiếu của hình chiếu đứng được chọn sao cho thể hiện rõ nhất hình dạng đặc trưng của vật thể.","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu đứng của hình chóp tứ giác đều đặt thẳng đứng là","options":["A. hình tam giác cân","B. hình vuông","C. hình tròn","D. hình chữ nhật"],"answer":"A","explain":"Nhìn từ trước, hình chóp tứ giác đều cho hình tam giác cân.","points":0.25},{"type":"mcq","level":"VD","q":"Một vật thể đối xứng có trục đối xứng nằm ngang. Trên các hình chiếu, trục đối xứng được vẽ bằng","options":["A. nét chấm gạch mảnh","B. nét liền đậm","C. nét đứt mảnh","D. không vẽ trục đối xứng"],"answer":"A","explain":"Trục đối xứng, đường tâm luôn vẽ bằng nét chấm gạch mảnh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tính chất hình chiếu:","statements":["a) Đoạn thẳng song song với mặt phẳng chiếu thì hình chiếu bằng nó.","b) Đường thẳng vuông góc với mặt phẳng chiếu thì hình chiếu là một điểm.","c) Mặt phẳng song song với mặt phẳng chiếu thì hình chiếu là hình thật.","d) Mọi đường tròn đều có hình chiếu là đường tròn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đường tròn chỉ cho hình chiếu là đường tròn khi mặt phẳng của nó song song với mặt phẳng chiếu.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về bố trí hình chiếu:","statements":["a) Khoảng cách giữa các hình chiếu nên đều nhau, cân đối.","b) Được phép đặt hình chiếu bằng phía trên hình chiếu đứng.","c) Hình chiếu cạnh phải dóng ngang hàng với hình chiếu đứng.","d) Không cần vẽ đường tâm trên các hình chiếu."],"answer":["T","F","T","F"],"explain":"a) Đúng: bố trí cân đối, đẹp. b) Sai: theo góc chiếu thứ nhất, hình chiếu bằng đặt phía dưới. c) Đúng: dóng ngang để khớp chiều cao. d) Sai: cần vẽ đường tâm bằng nét chấm gạch.","points":1},{"type":"short","level":"VDC","q":"Một mặt phẳng nghiêng so với mặt phẳng chiếu thì hình chiếu của nó sẽ như thế nào so với hình thật?","answer":"Bị biến dạng (nhỏ hơn hình thật)","explain":"Mặt phẳng nghiêng với mặt phẳng chiếu thì hình chiếu bị thu nhỏ, biến dạng so với hình thật; chỉ khi song song mới được hình thật.","points":0.5},{"type":"short","level":"VDC","q":"Trong ba hình chiếu, hình nào KHÔNG thể hiện chiều dài của vật thể?","answer":"Hình chiếu cạnh","explain":"Hình chiếu cạnh thể hiện chiều rộng và chiều cao; chiều dài chỉ có trên hình chiếu đứng và hình chiếu bằng.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Hình chiếu vuông góc của vật thể ba chiều lên mặt phẳng là","options":["A. hình phẳng hai chiều","B. hình khối ba chiều","C. đường cong không gian","D. tập hợp điểm rời rạc"],"answer":"A","explain":"Phép chiếu biến vật thể ba chiều thành hình phẳng hai chiều trên mặt phẳng chiếu.","points":0.25},{"type":"mcq","level":"NB","q":"Số mặt phẳng chiếu thường dùng trong phương pháp hình chiếu vuông góc là","options":["A. 3","B. 1","C. 2","D. 6"],"answer":"A","explain":"Thường dùng 3 mặt phẳng chiếu: đứng, bằng, cạnh.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu bằng của hình cầu là","options":["A. hình tròn","B. hình vuông","C. hình tam giác","D. hình chữ nhật"],"answer":"A","explain":"Hình cầu chiếu theo mọi hướng đều cho hình tròn.","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu đứng của lăng trụ tam giác đều đặt thẳng đứng (đáy tam giác nằm ngang) là","options":["A. hình chữ nhật","B. hình tam giác","C. hình tròn","D. hình thang"],"answer":"A","explain":"Nhìn từ trước lăng trụ tam giác đều đặt thẳng đứng ta thấy hình chữ nhật (chiều cao lăng trụ × cạnh đáy).","points":0.25},{"type":"mcq","level":"TH","q":"Để các hình chiếu khớp nhau về kích thước, người ta dùng","options":["A. đường dóng","B. đường bao","C. đường tâm","D. đường gạch"],"answer":"A","explain":"Đường dóng nối các hình chiếu với nhau để đảm bảo khớp kích thước dài, rộng, cao.","points":0.25},{"type":"mcq","level":"VD","q":"Trên hình chiếu đứng của một tấm phẳng hình chữ nhật đặt nghiêng so với mặt phẳng chiếu đứng, hình thu được là","options":["A. hình bình hành (bị biến dạng)","B. hình chữ nhật đúng kích thước thật","C. một đoạn thẳng","D. một điểm"],"answer":"A","explain":"Mặt phẳng nghiêng so với mặt phẳng chiếu thì hình chiếu bị biến dạng, thu nhỏ; tấm chữ nhật đặt nghiêng cho hình bình hành.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về hình chiếu các khối đa diện:","statements":["a) Hình hộp chữ nhật có ba hình chiếu đều là hình chữ nhật.","b) Lăng trụ tam giác đều đặt đứng có hình chiếu bằng là tam giác.","c) Hình chóp tứ giác đều có hình chiếu bằng là hình vuông có đường chéo.","d) Mọi khối đa diện đều có hình chiếu là đa giác."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng theo tính chất hình chiếu của các khối đa diện.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về vẽ hình chiếu vật thể:","statements":["a) Bước đầu tiên là phân tích hình dạng vật thể thành các khối cơ bản.","b) Nên tô đậm ngay từ đầu để bản vẽ rõ.","c) Cạnh khuất thể hiện bằng nét đứt mảnh.","d) Sau khi vẽ xong cần ghi kích thước và kiểm tra lại."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: nên vẽ mờ trước, tô đậm sau để dễ sửa. c) Đúng. d) Đúng.","points":1},{"type":"short","level":"VDC","q":"Một vật thể có hình chiếu đứng là hình thang cân, hai hình chiếu còn lại là hình chữ nhật. Vật thể đó có thể là khối gì?","answer":"Hình chóp cụt tứ giác đều (hoặc lăng trụ có đáy hình thang)","explain":"Hình chiếu đứng thang cân + hai hình chữ nhật gợi ý khối chóp cụt tứ giác đều đặt thẳng đứng (hoặc khối lăng trụ đáy thang).","points":0.5},{"type":"short","level":"VDC","q":"Nêu tên phương pháp chiếu mà Việt Nam đang sử dụng trong vẽ kỹ thuật.","answer":"Phương pháp góc chiếu thứ nhất","explain":"Việt Nam sử dụng phương pháp góc chiếu thứ nhất: hình chiếu bằng đặt dưới, hình chiếu cạnh đặt bên phải hình chiếu đứng.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Tia chiếu trong phép chiếu vuông góc có đặc điểm","options":["A. song song với nhau và vuông góc với mặt phẳng chiếu","B. giao nhau tại một điểm","C. song song với mặt phẳng chiếu","D. phân kỳ từ vật thể"],"answer":"A","explain":"Trong phép chiếu vuông góc, các tia chiếu song song với nhau và vuông góc với mặt phẳng chiếu.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu cạnh của hình hộp chữ nhật là","options":["A. hình chữ nhật","B. hình tròn","C. hình tam giác","D. hình thang"],"answer":"A","explain":"Các mặt của hình hộp chữ nhật đều là hình chữ nhật nên mọi hình chiếu đều là hình chữ nhật.","points":0.25},{"type":"mcq","level":"NB","q":"Khi nhìn vật thể từ bên trái sang, ta thu được","options":["A. hình chiếu cạnh","B. hình chiếu đứng","C. hình chiếu bằng","D. hình chiếu trục đo"],"answer":"A","explain":"Nhìn từ bên cạnh (trái hoặc phải) ta thu được hình chiếu cạnh.","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu bằng của hình trụ nằm ngang (trục song song với mặt phẳng chiếu đứng) là","options":["A. hình chữ nhật","B. hình tròn","C. hình tam giác","D. hình vuông"],"answer":"A","explain":"Nhìn từ trên xuống hình trụ nằm ngang ta thấy hình chữ nhật (chiều dài trụ × đường kính).","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây SAI về hình chiếu vuông góc?","options":["A. Mỗi hình chiếu thể hiện đầy đủ cả ba chiều của vật thể","B. Hình chiếu đứng thể hiện chiều dài và chiều cao","C. Hình chiếu bằng thể hiện chiều dài và chiều rộng","D. Hình chiếu cạnh thể hiện chiều rộng và chiều cao"],"answer":"A","explain":"Mỗi hình chiếu chỉ thể hiện hai trong ba chiều của vật thể, không thể hiện đầy đủ cả ba chiều.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạc lót hình trụ rỗng (có lỗ xuyên suốt theo trục) đặt thẳng đứng. Trên hình chiếu đứng, lỗ rỗng được thể hiện bằng","options":["A. hai nét đứt mảnh song song ở giữa","B. một hình tròn","C. hai nét liền đậm","D. không thể hiện"],"answer":"A","explain":"Lỗ trụ rỗng theo trục đứng, nhìn từ trước thấy thành lỗ là hai đường khuất song song ở giữa, vẽ bằng nét đứt mảnh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về mặt phẳng chiếu:","statements":["a) Mặt phẳng chiếu đứng thẳng đứng, đặt sau vật thể.","b) Mặt phẳng chiếu bằng nằm ngang, đặt dưới vật thể.","c) Mặt phẳng chiếu cạnh thẳng đứng, đặt bên cạnh vật thể.","d) Cả ba mặt phẳng chiếu đều đi qua vật thể."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: các mặt phẳng chiếu đặt ngoài vật thể (sau, dưới, bên cạnh), không đi qua vật thể.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về suy biến hình chiếu:","statements":["a) Điểm chiếu lên mặt phẳng cho một điểm.","b) Đường thẳng vuông góc với mặt phẳng chiếu cho một điểm.","c) Mặt phẳng vuông góc với mặt phẳng chiếu cho một đoạn thẳng.","d) Khối cầu không bao giờ bị suy biến hình chiếu."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng: các trường hợp suy biến của hình chiếu vuông góc, riêng hình cầu chiếu hướng nào cũng là hình tròn.","points":1},{"type":"short","level":"VDC","q":"Một chi tiết máy dài 120 mm, rộng 80 mm, cao 50 mm. Trên hình chiếu cạnh, hai kích thước ghi được là bao nhiêu?","answer":"80 mm và 50 mm","explain":"Hình chiếu cạnh thể hiện chiều rộng (80 mm) và chiều cao (50 mm).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao khi đọc bản vẽ phải kết hợp cả ba hình chiếu mà không chỉ dùng một hình?","answer":"Vì mỗi hình chiếu chỉ thể hiện hai chiều, dễ gây nhầm lẫn","explain":"Mỗi hình chiếu chỉ thể hiện hai trong ba chiều; nhiều vật thể khác nhau có thể có cùng một hình chiếu nên phải kết hợp cả ba mới xác định đúng vật thể.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hình chiếu thu được khi chiếu vật thể lên mặt phẳng chiếu đứng gọi là","options":["A. hình chiếu đứng","B. hình chiếu bằng","C. hình chiếu cạnh","D. mặt cắt"],"answer":"A","explain":"Chiếu lên mặt phẳng chiếu đứng được hình chiếu đứng.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các hình sau, hình nào có ba hình chiếu đều là hình vuông?","options":["A. Hình lập phương","B. Hình trụ","C. Hình nón","D. Hình cầu"],"answer":"A","explain":"Hình lập phương có các mặt đều là hình vuông nên ba hình chiếu đều là hình vuông.","points":0.25},{"type":"mcq","level":"NB","q":"Đường dóng giữa hình chiếu đứng và hình chiếu bằng là đường","options":["A. thẳng đứng","B. nằm ngang","C. xiên 45°","D. cong"],"answer":"A","explain":"Hình chiếu bằng nằm dưới hình chiếu đứng nên đường dóng nối chúng là đường thẳng đứng (để khớp chiều dài).","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu đứng của hình nón cụt đặt thẳng đứng là","options":["A. hình thang cân","B. hình tam giác cân","C. hình chữ nhật","D. hình tròn"],"answer":"A","explain":"Hình nón cụt đặt đứng, nhìn từ trước cho hình thang cân.","points":0.25},{"type":"mcq","level":"TH","q":"Vị trí đặt hình chiếu bằng so với hình chiếu đứng theo phương pháp góc chiếu thứ nhất là","options":["A. phía dưới","B. phía trên","C. phía trái","D. phía phải"],"answer":"A","explain":"Theo phương pháp góc chiếu thứ nhất, hình chiếu bằng đặt phía dưới hình chiếu đứng.","points":0.25},{"type":"mcq","level":"VD","q":"Một vật thể có hình chiếu đứng là hình chữ nhật, hình chiếu bằng là hình chữ nhật nhỏ hơn nằm lọt trong, hình chiếu cạnh cũng tương tự. Vật thể đó có thể là","options":["A. tấm phẳng có gờ (bậc) ở giữa","B. hình trụ đặc","C. hình cầu","D. hình nón"],"answer":"A","explain":"Hình chữ nhật nhỏ lọt trong gợi ý chi tiết có bậc, gờ nổi ở giữa tấm phẳng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ba hình chiếu của khối hộp:","statements":["a) Hình chiếu đứng của hộp chữ nhật là hình chữ nhật.","b) Hình chiếu bằng của hộp chữ nhật là hình chữ nhật.","c) Hình chiếu cạnh của hộp chữ nhật là hình chữ nhật.","d) Kích thước ba hình chiếu của hình lập phương đều bằng nhau."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng: hộp chữ nhật cho ba hình chữ nhật; hình lập phương cho ba hình vuông bằng nhau.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về nguyên tắc vẽ:","statements":["a) Hình chiếu đứng nên chọn hướng thể hiện rõ nhất vật thể.","b) Các hình chiếu phải bố trí cân đối trên bản vẽ.","c) Có thể bỏ qua nét đứt nếu bản vẽ đã rõ.","d) Phải ghi đầy đủ kích thước để chế tạo."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: cạnh khuất bắt buộc thể hiện bằng nét đứt. d) Đúng.","points":1},{"type":"short","level":"VDC","q":"Một ống trụ đặt nằm ngang có chiều dài 200 mm, đường kính ngoài 60 mm. Hình chiếu đứng của nó có kích thước bao nhiêu?","answer":"200 mm × 60 mm","explain":"Nhìn ngang ống trụ nằm ngang thấy hình chữ nhật với chiều dài 200 mm và chiều cao bằng đường kính 60 mm.","points":0.5},{"type":"short","level":"VDC","q":"Trên hình chiếu, đường tròn của lỗ ren khuất được vẽ bằng nét gì?","answer":"Nét đứt mảnh","explain":"Mọi cạnh, đường khuất đều vẽ bằng nét đứt mảnh.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cơ sở của phương pháp hình chiếu vuông góc trong vẽ kỹ thuật là","options":["A. phép chiếu vuông góc","B. phép chiếu xuyên tâm","C. phép chiếu xiên","D. phép đối xứng"],"answer":"A","explain":"Phương pháp hình chiếu vuông góc được xây dựng trên cơ sở phép chiếu vuông góc.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu bằng của lăng trụ tam giác đều đặt thẳng đứng là","options":["A. hình tam giác","B. hình chữ nhật","C. hình tròn","D. hình vuông"],"answer":"A","explain":"Nhìn từ trên xuống lăng trụ tam giác đều đặt đứng ta thấy mặt đáy là hình tam giác.","points":0.25},{"type":"mcq","level":"NB","q":"Đường dóng giữa hình chiếu đứng và hình chiếu cạnh là đường","options":["A. nằm ngang","B. thẳng đứng","C. xiên 45°","D. cong"],"answer":"A","explain":"Hình chiếu cạnh nằm bên phải hình chiếu đứng nên đường dóng nối chúng là đường nằm ngang (để khớp chiều cao).","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu cạnh của hình trụ đặt thẳng đứng là","options":["A. hình chữ nhật","B. hình tròn","C. hình tam giác","D. hình vuông"],"answer":"A","explain":"Nhìn từ bên cạnh hình trụ đặt đứng ta thấy hình chữ nhật.","points":0.25},{"type":"mcq","level":"TH","q":"Một vật thể có hình chiếu đứng và hình chiếu bằng đều là hình tròn. Vật thể đó là","options":["A. hình cầu","B. hình trụ đặt đứng","C. hình nón đặt đứng","D. hình hộp"],"answer":"A","explain":"Chỉ có hình cầu mới cho hình chiếu đứng và hình chiếu bằng đều là hình tròn (hình trụ đặt đứng có hình chiếu đứng là chữ nhật).","points":0.25},{"type":"mcq","level":"VD","q":"Khi vẽ hình chiếu của vật thể có nhiều phần khuất phức tạp, để bản vẽ dễ đọc người ta thường","options":["A. kết hợp dùng thêm mặt cắt, hình cắt","B. chỉ vẽ hình chiếu đứng","C. bỏ hết nét đứt","D. vẽ phóng to gấp 10 lần"],"answer":"A","explain":"Với vật thể có cấu tạo trong phức tạp, người ta kết hợp thêm mặt cắt, hình cắt để thể hiện rõ (nội dung Bài 3).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về hình chiếu khối tròn xoay đặt đứng:","statements":["a) Hình trụ có hình chiếu bằng là hình tròn.","b) Hình nón có hình chiếu bằng là hình tròn có tâm.","c) Hình cầu có ba hình chiếu là ba hình tròn bằng nhau.","d) Hình trụ có hình chiếu đứng là hình tròn."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: hình chiếu đứng của hình trụ đặt đứng là hình chữ nhật.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về đọc bản vẽ:","statements":["a) Đọc bản vẽ bắt đầu từ khung tên.","b) Phải đối chiếu cả ba hình chiếu với nhau.","c) Nét đứt cho biết phần khuất của vật thể.","d) Một hình chiếu đứng là đủ để hình dung mọi vật thể."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần kết hợp cả ba hình chiếu.","points":1},{"type":"short","level":"VDC","q":"Một chi tiết có hình chiếu đứng là hình chữ nhật 100 × 60, hình chiếu cạnh là hình chữ nhật 40 × 60. Hỏi chiều dài, rộng, cao của chi tiết là bao nhiêu?","answer":"Dài 100, rộng 40, cao 60","explain":"Hình chiếu đứng cho dài × cao = 100 × 60; hình chiếu cạnh cho rộng × cao = 40 × 60. Vậy dài 100, rộng 40, cao 60 (mm).","points":0.5},{"type":"short","level":"VDC","q":"Nêu một lỗi thường gặp khi sắp xếp vị trí các hình chiếu trên bản vẽ.","answer":"Đặt sai vị trí hình chiếu bằng hoặc hình chiếu cạnh","explain":"Lỗi hay gặp: đặt hình chiếu bằng không ở dưới hình chiếu đứng, hoặc hình chiếu cạnh không ở bên phải; các hình chiếu không khớp kích thước với nhau.","points":0.5}]}]}</script>
