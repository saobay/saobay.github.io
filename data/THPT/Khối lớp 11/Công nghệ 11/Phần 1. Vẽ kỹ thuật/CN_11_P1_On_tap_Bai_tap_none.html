 giấy","D. một loại nét vẽ"],"answer":"A","explain":"CAD (Computer Aided Design) là thiết kế có sự trợ giúp của máy tính.","points":0.25},{"type":"mcq","level":"VD","q":"Một học sinh vẽ hình chiếu bằng ở phía trên hình chiếu đứng. Cách vẽ này","options":["A. sai với phương pháp góc chiếu thứ nhất","B. đúng quy định","C. chỉ sai khi có hình chiếu cạnh","D. được phép tùy ý"],"answer":"A","explain":"Theo phương pháp góc chiếu thứ nhất, hình chiếu bằng phải đặt phía dưới hình chiếu đứng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về bản vẽ nhà:","statements":["a) Mặt bằng cho biết bố trí các phòng.","b) Mặt đứng cho biết hình dáng bên ngoài.","c) Mặt cắt cho biết cấu tạo theo chiều cao.","d) Mặt bằng cho biết chiều cao tầng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mặt bằng không thể hiện chiều cao.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về đọc bản vẽ:","statements":["a) Đọc khung tên trước tiên.","b) Phải phân tích các hình biểu diễn.","c) Phải phân tích kích thước.","d) Không cần tổng hợp sau khi đọc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bước cuối là tổng hợp để hình dung toàn bộ.","points":1},{"type":"short","level":"VDC","q":"Một tờ A0 gấp được bao nhiêu tờ A4?","answer":"16","explain":"Từ A0 đến A4 chia 4 lần, mỗi lần diện tích giảm một nửa: 2^4 = 16 tờ A4.","points":0.5},{"type":"short","level":"VDC","q":"Nêu tên loại hình cắt dùng nét lượn sóng làm đường giới hạn.","answer":"Hình cắt cục bộ","explain":"Hình cắt cục bộ giới hạn phần cắt bằng nét lượn sóng.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Đơn vị mặc định của kích thước dài trên bản vẽ là","options":["A. milimét","B. centimét","C. mét","D. inch"],"answer":"A","explain":"Kích thước dài mặc định tính bằng milimét, không cần ghi đơn vị.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu cạnh cho biết","options":["A. chiều rộng và chiều cao","B. chiều dài và chiều cao","C. chiều dài và chiều rộng","D. cả ba chiều"],"answer":"A","explain":"Hình chiếu cạnh cho biết chiều rộng và chiều cao.","points":0.25},{"type":"mcq","level":"NB","q":"Mặt cắt là hình biểu diễn","options":["A. phần vật thể bị mặt phẳng cắt qua","B. toàn bộ vật thể còn lại","C. mặt ngoài vật thể","D. hình chiếu đứng"],"answer":"A","explain":"Mặt cắt chỉ biểu diễn phần vật thể nằm trên (bị) mặt phẳng cắt.","points":0.25},{"type":"mcq","level":"TH","q":"Ký hiệu trước chữ số chỉ bán kính là","options":["A. R","B. ký hiệu đường kính","C. D","D. S"],"answer":"A","explain":"Trước chữ số chỉ bán kính ghi ký hiệu R.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của bản vẽ CAD so với vẽ tay là","options":["A. nhanh, chính xác, dễ sửa, dễ lưu trữ","B. không cần tuân thủ tiêu chuẩn","C. rẻ hơn giấy bút","D. ai cũng vẽ được ngay"],"answer":"A","explain":"CAD giúp vẽ nhanh, chính xác, dễ sửa chữa, lưu trữ và chia sẻ thuận tiện.","points":0.25},{"type":"mcq","level":"VD","q":"Trên hình cắt một nửa của chi tiết đối xứng, đường phân cách hai nửa là","options":["A. trục đối xứng (nét chấm gạch)","B. nét liền đậm","C. nét đứt","D. nét lượn sóng"],"answer":"A","explain":"Hai nửa phân cách bởi trục đối xứng vẽ bằng nét chấm gạch mảnh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về khổ giấy và tỉ lệ:","statements":["a) Chia đôi A2 theo chiều dài được hai khổ A3.","b) Tỉ lệ 1 : 2 là tỉ lệ thu nhỏ.","c) Tỉ lệ 5 : 1 là tỉ lệ phóng to.","d) Chữ số kích thước phụ thuộc tỉ lệ vẽ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chữ số kích thước luôn là kích thước thật.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về hình chiếu khối:","statements":["a) Hình trụ đặt đứng có hình chiếu bằng là hình tròn.","b) Hình nón đặt đứng có hình chiếu đứng là tam giác cân.","c) Hình hộp có ba hình chiếu là hình chữ nhật."," B. nét đứt mảnh","C. nét chấm gạch","D. nét liền mảnh"],"answer":"A","explain":"Vị trí mặt phẳng cắt vẽ bằng nét cắt (liền đậm) có mũi tên chỉ hướng nhìn.","points":0.25},{"type":"mcq","level":"TH","q":"Cặp hình chiếu có chiều cao bằng nhau là","options":["A. đứng và cạnh","B. đứng và bằng","C. bằng và cạnh","D. không có"],"answer":"A","explain":"Hình chiếu đứng và hình chiếu cạnh bằng nhau về chiều cao.","points":0.25},{"type":"mcq","level":"TH","q":"Trên mặt bằng, cửa sổ được thể hiện","options":["A. trên tường tại vị trí đặt cửa","B. ở giữa phòng","C. trên mái nhà","D. trong khung tên"],"answer":"A","explain":"Mặt bằng cắt ngang qua cửa sổ nên cửa hiện trên tường tại đúng vị trí.","points":0.25},{"type":"mcq","level":"VD","q":"Một bản vẽ có hình cắt tên B – B. Điều này cho biết","options":["A. có mặt phẳng cắt đánh dấu chữ B","B. khổ giấy loại B","C. tỉ lệ 1 : 2","D. vật liệu loại B"],"answer":"A","explain":"Tên hình cắt B – B ứng với mặt phẳng cắt được đánh dấu chữ B ở hai đầu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về hình chiếu vuông góc:","statements":["a) Mỗi hình chiếu thể hiện hai chiều của vật thể.","b) Cần kết hợp ba hình chiếu để xác định vật thể.","c) Một hình chiếu đủ để chế tạo mọi vật thể.","d) Hình chiếu bằng nhìn từ trên xuống."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: một hình chiếu không đủ.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về mặt cắt:","statements":["a) Mặt cắt chập vẽ trên hình chiếu bằng nét mảnh.","b) Mặt cắt rời vẽ ngoài hình chiếu bằng nét đậm.","c) Mặt cắt thể hiện tiết diện vật thể.","d) Mặt cắt đầy đủ hơn hình cắt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hình cắt đầy đủ hơn mặt cắt.","points":1},{"type":"short","level":"VDC","q":"Một chi tiết máy gồm hai khối hộp ghép lại. Để thể hiện chỗ tiếp giáp bên trong, nên dùng loại hình biểu diễn nào?","answer":"Hình cắt","explain":"Chỗ tiếp giáp bên trong hai khối ghép chỉ thể hiện rõ bằng hình cắt (mặt cắt).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao bản vẽ nhà cần cả mặt bằng, mặt đứng và mặt cắt?","answer":"Vì mỗi hình cho một loại thông tin khác nhau, bổ sung cho nhau","explain":"Mặt bằng cho bố trí phòng, mặt đứng cho hình dáng ngoài, mặt cắt cho cấu tạo theo chiều cao; ba hình bổ sung nhau tạo nên bản vẽ hoàn chỉnh.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"TCVN là ký hiệu của","options":["A. tiêu chuẩn Việt Nam","B. tiêu chuẩn quốc tế","C. tiêu chuẩn Nhật","D. tiêu chuẩn Mỹ"],"answer":"A","explain":"TCVN là tiêu chuẩn Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Mặt phẳng chiếu bằng đặt ở đâu?","options":["A. Nằm ngang, dưới vật thể","B. Thẳng đứng, sau vật thể","C. Thẳng đứng, cạnh vật thể","D. Xiên góc"],"answer":"A","explain":"Mặt phẳng chiếu bằng nằm ngang, đặt dưới vật thể.","points":0.25},{"type":"mcq","level":"NB","q":"Hai chi tiết khác nhau trên cùng hình cắt được phân biệt bằng","options":["A. hướng gạch chéo khác nhau","B. màu sắc","C. độ dày nét","D. không phân biệt"],"answer":"A","explain":"Các chi tiết khác nhau kẻ gạch khác hướng hoặc khác khoảng cách.","points":0.25},{"type":"mcq","level":"TH","q":"Chia đôi khổ A1 theo chiều dài được","options":["A. hai khổ A2","B. hai khổ A0","C. hai khổ A3","D. bốn khổ A2"],"answer":"A","explain":"Chia đôi khổ lớn được hai khổ nhỏ liền kề: A1 thành 2 tờ A2.","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu đứng của hình chóp tứ giác đều là","options":["A. hình tam giác cân","B. hình vuông","C. hình tròn","D. hình chữ nhật"],"answer":"A","explain":"Nhìn từ trước, hình chóp tứ giác đều cho hình tam giác cân.","points":0.25},{"type":"mcq","level":"VD","q":"Một sinh viên quên kẻ gạch trên hình cắt. Hậu quả là","options":["A. không phân biệt được phần đặc và phần rỗng","B. không ảnh hưởng gì","C. bản vẽ đẹp hơn","D. chỉ sai khi có kích thước"],"answer":"A","explain":"Không kẻ gạch sẽ không phân biệt được đặc – rỗng, vi phạm quy ước.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ứng dụng:","statements":["a) Chế tạo chi tiết cần bản vẽ chi tiết.","b) Lắp ráp máy cần bản vẽ lắp.","c) Xây nhà cần bản vẽ nhà.","d) Vẽ CAD không cần tiêu chuẩn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: CAD vẫn phải tuân thủ tiêu chuẩn.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về hình cắt một nửa:","statements":["a) Dùng cho vật đối xứng.","b) Nửa vẽ hình cắt, nửa vẽ hình chiếu.","c) Phân cách bằng trục đối xứng.","d) Tốn diện tích hơn hình cắt toàn bộ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hình cắt một nửa tiết kiệm diện tích hơn.","points":1},{"type":"short","level":"VDC","q":"Một bản vẽ chi tiết ghi vật liệu là thép. Hỏi thông tin này đọc ở đâu trên bản vẽ?","answer":"Khung tên (và yêu cầu kỹ thuật)","explain":"Vật liệu chi tiết ghi trong khung tên và phần yêu cầu kỹ thuật của bản vẽ chi tiết.","points":0.5},{"type":"short","level":"VDC","q":"Nêu ba loại hình cắt cơ bản.","answer":"Toàn bộ, một nửa, cục bộ","explain":"Ba loại hình cắt: toàn bộ (cắt suốt), một nửa (vật đối xứng), cục bộ (nét lượn sóng).","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Cách chia các khổ giấy từ A0 đến A4 là","options":["A. chia đôi theo chiều dài","B. chia đôi theo chiều rộng","C. chia ba theo chiều dài","D. chia tư"],"answer":"A","explain":"Chia đôi khổ lớn theo chiều dài được hai khổ nhỏ liền kề.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu bằng của hình trụ đặt đứng là","options":["A. hình tròn","B. hình chữ nhật","C. hình tam giác","D. hình vuông"],"answer":"A","explain":"Nhìn từ trên xuống hình trụ đặt đứng thấy đáy tròn.","points":0.25},{"type":"mcq","level":"NB","q":"Nét lượn sóng dùng trong","options":["A. hình cắt cục bộ","B. hình cắt toàn bộ","C. mọi hình chiếu","D. khung tên"],"answer":"A","explain":"Nét lượn sóng làm đường giới hạn của hình cắt cục bộ.","points":0.25},{"type":"mcq","level":"TH","q":"Mũi tên trên đường kích thước","options":["A. chạm vào đường gióng","B. chạm vào đường bao","C. hướng ra ngoài","D. không chạm gì"],"answer":"A","explain":"Mũi tên ở hai đầu đường kích thước chạm vào đường gióng.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn biết vật liệu của chi tiết, đọc","options":["A. khung tên","B. hình chiếu đứng","C. đường kích thước","D. nét vẽ"],"answer":"A","explain":"Vật liệu ghi trong khung tên (và yêu cầu kỹ thuật).","points":0.25},{"type":"mcq","level":"VD","q":"Một đội xây dựng làm sai chiều cao tầng so với thiết kế. Họ đã không đọc kỹ hình nào?","options":["A. Mặt cắt hoặc mặt đứng","B. Mặt bằng","C. Khung tên","D. Bảng kê"],"answer":"A","explain":"Chiều cao thể hiện trên mặt cắt hoặc mặt đứng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tổng hợp kiến thức:","statements":["a) Vẽ kỹ thuật tuân thủ TCVN.","b) Ba hình chiếu: đứng, bằng, cạnh.","c) Hình cắt giúp thấy cấu tạo trong.","d) Bản vẽ nhà chỉ cần mặt bằng là đủ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bản vẽ nhà cần cả mặt bằng, mặt đứng, mặt cắt.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về lỗi thường gặp:","statements":["a) Ghi chữ số kích thước theo tỉ lệ vẽ là sai.","b) Vẽ đường tâm bằng nét liền là sai.","c) Đặt hình chiếu bằng phía trên hình chiếu đứng là sai.","d) Kẻ gạch cả phần lỗ rỗng là sai."],"answer":["T","T","T","T"],"explain":"Cả bốn đều là lỗi thường gặp cần tránh.","points":1},{"type":"short","level":"VDC","q":"Một xưởng cần chế tạo 50 chiếc bạc lót giống nhau. Loại bản vẽ nào là căn cứ chính?","answer":"Bản vẽ chi tiết","explain":"Chế tạo hàng loạt chi tiết cần bản vẽ chi tiết (kích thước chế tạo, vật liệu, yêu cầu kỹ thuật).","points":0.5},{"type":"short","level":"VDC","q":"Giải thích ngắn gọn vì sao hình cắt đầy đủ hơn mặt cắt.","answer":"Vì hình cắt gồm mặt cắt và phần vật thể phía sau mặt phẳng cắt","explain":"Mặt cắt chỉ vẽ phần bị cắt qua; hình cắt vẽ thêm phần còn lại phía sau nên đầy đủ hơn.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Ngôn ngữ chung của người làm kỹ thuật là","options":["A. bản vẽ kỹ thuật","B. tiếng Anh","C. toán học","D. tin học"],"answer":"A","explain":"Bản vẽ kỹ thuật là ngôn ngữ chung của người làm kỹ thuật.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu của đường thẳng vuông góc với mặt phẳng chiếu là","options":["A. một điểm","B. một đoạn thẳng","C. một đường tròn","D. một hình vuông"],"answer":"A","explain":"Đường thẳng vuông góc với mặt phẳng chiếu thì hình chiếu suy biến thành một điểm.","points":0.25},{"type":"mcq","level":"NB","q":"Mặt cắt rời vẽ bằng nét","options":["A. liền đậm","B. liền mảnh","C. đứt mảnh","D. chấm gạch"],"answer":"A","explain":"Mặt cắt rời vẽ ngoài hình chiếu bằng nét liền đậm.","points":0.25},{"type":"mcq","level":"TH","q":"Trên bản vẽ lắp, bảng kê cho biết","options":["A. tên gọi, số lượng, vật liệu các chi tiết","B. giá tiền sản phẩm","C. tên công nhân","D. tiến độ lắp ráp"],"answer":"A","explain":"Bảng kê liệt kê số thứ tự, tên gọi, số lượng, vật liệu, ghi chú các chi tiết.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt đứng của ngôi nhà thể hiện","options":["A. hình dáng bên ngoài","B. bố trí phòng","C. cấu tạo móng","D. hệ thống nước"],"answer":"A","explain":"Mặt đứng thể hiện hình dáng bên ngoài của ngôi nhà.","points":0.25},{"type":"mcq","level":"VD","q":"Một kỹ sư muốn kiểm tra cấu tạo mái của ngôi nhà. Hình nào hữu ích nhất?","options":["A. Mặt cắt qua mái","B. Mặt bằng tầng 1","C. Mặt đứng","D. Khung tên"],"answer":"A","explain":"Mặt cắt thể hiện cấu tạo bên trong theo chiều cao, bao gồm cấu tạo mái.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (ôn tập):","statements":["a) Khổ A4 = 210 × 297 mm.","b) Tỉ lệ 1 : 1 là nguyên hình.","c) Nét đứt vẽ cạnh khuất.","d) Khung tên ở góc trái dưới."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: khung tên ở góc phải phía dưới.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về đọc bản vẽ tổng hợp:","statements":["a) Đọc khung tên biết tên gọi, vật liệu, tỉ lệ.","b) Đối chiếu các hình biểu diễn để hiểu hình dạng.","c) Kích thước là căn cứ chế tạo, thi công.","d) Chỉ thợ cả mới cần đọc bản vẽ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mọi người thợ đều cần đọc được bản vẽ.","points":1},{"type":"short","level":"VDC","q":"Nêu công thức 4 bước đọc mọi bản vẽ kỹ thuật.","answer":"Tên, Hình, Số, Kết luận","explain":"Đọc khung tên → phân tích hình biểu diễn → phân tích kích thước → tổng hợp kết luận.","points":0.5},{"type":"short","level":"VDC","q":"Một vật thể có ba hình chiếu đều là hình vuông bằng nhau. Đó là khối gì?","answer":"Hình lập phương","explain":"Ba hình chiếu đều là hình vuông bằng nhau là đặc trưng của hình lập phương.","points":0.5}]}]}</script>
