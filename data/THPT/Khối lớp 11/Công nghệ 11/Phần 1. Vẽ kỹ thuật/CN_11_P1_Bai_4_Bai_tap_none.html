<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Bản vẽ chi tiết là bản vẽ của","options":["A. từng chi tiết riêng lẻ","B. cụm máy hoàn chỉnh","C. ngôi nhà","D. dây chuyền sản xuất"],"answer":"A","explain":"Bản vẽ chi tiết là bản vẽ của từng chi tiết riêng lẻ.","points":0.25},{"type":"mcq","level":"NB","q":"Bản vẽ chi tiết dùng làm căn cứ để","options":["A. chế tạo và kiểm tra chi tiết","B. lắp ráp sản phẩm","C. thi công nhà","D. quảng cáo sản phẩm"],"answer":"A","explain":"Bản vẽ chi tiết dùng làm căn cứ để chế tạo và kiểm tra từng chi tiết.","points":0.25},{"type":"mcq","level":"NB","q":"Bản vẽ lắp dùng làm căn cứ để","options":["A. lắp ráp và vận hành sản phẩm","B. chế tạo từng chi tiết","C. thi công móng nhà","D. thiết kế nội thất"],"answer":"A","explain":"Bản vẽ lắp dùng làm căn cứ để lắp ráp và vận hành cụm máy, sản phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Bảng kê trên bản vẽ lắp có nội dung","options":["A. liệt kê các chi tiết: số thứ tự, tên gọi, số lượng, vật liệu","B. liệt kê giá tiền các chi tiết","C. liệt kê công nhân lắp ráp","D. liệt kê dụng cụ cần dùng"],"answer":"A","explain":"Bảng kê liệt kê tất cả chi tiết của cụm máy: số thứ tự, tên gọi, số lượng, vật liệu, ghi chú.","points":0.25},{"type":"mcq","level":"TH","q":"Trên bản vẽ lắp, mỗi chi tiết được đánh dấu bằng","options":["A. số thứ tự trên đường chỉ số","B. màu sắc khác nhau","C. tên viết tắt","D. ký hiệu hình học"],"answer":"A","explain":"Mỗi chi tiết trên bản vẽ lắp được đánh số thứ tự bằng đường dẫn (đường chỉ số) nối tới bảng kê.","points":0.25},{"type":"mcq","level":"VD","q":"Một kỹ sư cần chế tạo một bánh răng. Loại bản vẽ anh ta cần là","options":["A. bản vẽ chi tiết của bánh răng","B. bản vẽ lắp của hộp giảm tốc","C. bản vẽ mặt bằng nhà xưởng","D. bản vẽ mặt đứng"],"answer":"A","explain":"Để chế tạo một chi tiết riêng lẻ cần bản vẽ chi tiết của nó; bản vẽ lắp dùng để lắp ráp nhiều chi tiết.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về bản vẽ cơ khí:","statements":["a) Bản vẽ chi tiết thể hiện từng chi tiết riêng lẻ.","b) Bản vẽ chi tiết là căn cứ để chế tạo.","c) Bản vẽ lắp thể hiện cụm máy hoàn chỉnh.","d) Bản vẽ lắp là căn cứ để lắp ráp."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng theo định nghĩa bản vẽ chi tiết và bản vẽ lắp.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về nội dung bản vẽ:","statements":["a) Bản vẽ chi tiết ghi đầy đủ kích thước chế tạo.","b) Bản vẽ chi tiết ghi vật liệu và yêu cầu kỹ thuật.","c) Bản vẽ lắp ghi kích thước lắp ghép giữa các chi tiết.","d) Bản vẽ lắp ghi kích thước chế tạo chi tiết từng cái."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bản vẽ lắp không ghi kích thước chế tạo từng chi tiết, chỉ ghi kích thước lắp ghép, kích thước bao.","points":1},{"type":"short","level":"VDC","q":"Trên bản vẽ lắp, bảng kê dùng để làm gì?","answer":"Liệt kê các chi tiết của cụm máy","explain":"Bảng kê liệt kê tất cả chi tiết: số thứ tự, tên gọi, số lượng, vật liệu, giúp quản lý và lắp ráp đúng đủ chi tiết.","points":0.5},{"type":"short","level":"VDC","q":"Muốn lắp ráp một chiếc quạt điện từ các chi tiết rời, cần loại bản vẽ nào?","answer":"Bản vẽ lắp","explain":"Bản vẽ lắp thể hiện vị trí tương quan các chi tiết và là căn cứ để lắp ráp thành sản phẩm hoàn chỉnh.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Mặt bằng của ngôi nhà là","options":["A. hình cắt bằng khi dùng mặt phẳng nằm ngang qua cửa sổ","B. hình chiếu từ trước tới","C. hình cắt đứng","D. hình chiếu từ trên xuống không cắt"],"answer":"A","explain":"Mặt bằng là hình cắt bằng của ngôi nhà khi dùng mặt phẳng cắt nằm ngang đi qua cửa sổ.","points":0.25},{"type":"mcq","level":"NB","q":"Mặt đứng của ngôi nhà thể hiện","options":["A. hình dáng bên ngoài của ngôi nhà","B. bố trí các phòng bên trong","C. cấu tạo móng nhà","D. hệ thống điện nước"],"answer":"A","explain":"Mặt đứng là hình chiếu thẳng góc lên mặt phẳng đứng, thể hiện hình dáng bên ngoài: mặt tiền, chiều cao tầng, mái.","points":0.25},{"type":"mcq","level":"NB","q":"Mặt cắt của ngôi nhà thể hiện","options":["A. cấu tạo bên trong theo chiều cao (phòng, cầu thang, mái, móng)","B. hình dáng mặt tiền","C. bố trí sân vườn","D. vị trí các phòng trên mặt đất"],"answer":"A","explain":"Mặt cắt ngôi nhà tạo bởi mặt phẳng cắt thẳng đứng, thể hiện cấu tạo bên trong theo chiều cao.","points":0.25},{"type":"mcq","level":"TH","q":"Trên mặt bằng, người ta KHÔNG thể hiện","options":["A. chiều cao các tầng nhà","B. vị trí các phòng","C. vị trí cửa đi, cửa sổ","D. kích thước tường"],"answer":"A","explain":"Mặt bằng là hình cắt ngang nên không thể hiện chiều cao; chiều cao xem trên mặt đứng, mặt cắt.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt phẳng cắt để tạo mặt bằng đi qua vị trí nào của ngôi nhà?","options":["A. Ngang qua cửa sổ, cách sàn khoảng 1 m","B. Dọc theo chiều cao nhà","C. Qua mái nhà","D. Dưới mặt móng"],"answer":"A","explain":"Mặt phẳng cắt ngang để tạo mặt bằng đi qua cửa sổ, cách mặt sàn khoảng 1 m.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn biết chiều cao từ sàn tầng 1 đến sàn tầng 2 của ngôi nhà, xem hình nào?","options":["A. Mặt cắt hoặc mặt đứng","B. Mặt bằng","C. Bảng kê","D. Khung tên"],"answer":"A","explain":"Chiều cao các tầng thể hiện trên mặt cắt (cắt đứng) hoặc mặt đứng; mặt bằng không thể hiện chiều cao.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về bản vẽ nhà:","statements":["a) Mặt bằng cho biết vị trí, kích thước các phòng.","b) Mặt đứng thể hiện hình dáng bên ngoài ngôi nhà.","c) Mặt cắt thể hiện cấu tạo theo chiều cao.","d) Cả ba hình đều là hình chiếu thẳng góc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mặt bằng và mặt cắt là hình cắt, chỉ mặt đứng là hình chiếu.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về đọc bản vẽ nhà:","statements":["a) Muốn bố trí nội thất thì xem mặt bằng.","b) Muốn xem mặt tiền nhà thì xem mặt đứng.","c) Muốn biết chiều cao phòng thì xem mặt cắt.","d) Mặt bằng thể hiện được chiều cao tầng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mặt bằng là hình cắt ngang, không thể hiện chiều cao.","points":1},{"type":"short","level":"VDC","q":"Bản vẽ nhà dùng làm căn cứ để làm gì?","answer":"Thi công xây dựng","explain":"Bản vẽ nhà thể hiện hình dạng, kích thước, cấu tạo ngôi nhà, dùng làm căn cứ để thi công xây dựng.","points":0.5},{"type":"short","level":"VDC","q":"Trên mặt bằng, cửa đi và cửa sổ được thể hiện ở vị trí nào?","answer":"Trên tường, tại vị trí đặt cửa thật","explain":"Mặt bằng cắt ngang qua cửa sổ nên cửa đi, cửa sổ hiện rõ trên tường tại đúng vị trí của chúng.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"CAD là viết tắt của","options":["A. Computer Aided Design (thiết kế có sự trợ giúp của máy tính)","B. Computer And Drawing","C. Central Aided Device","D. Creative Art Design"],"answer":"A","explain":"CAD là Computer Aided Design – thiết kế có sự trợ giúp của máy tính.","points":0.25},{"type":"mcq","level":"NB","q":"Ưu điểm của việc lập bản vẽ bằng máy tính (CAD) là","options":["A. vẽ nhanh, chính xác, dễ sửa chữa","B. không cần biết tiêu chuẩn bản vẽ","C. bản vẽ không cần ghi kích thước","D. thay thế hoàn toàn người thiết kế"],"answer":"A","explain":"CAD giúp vẽ nhanh, chính xác, dễ sửa chữa, dễ lưu trữ và chia sẻ.","points":0.25},{"type":"mcq","level":"NB","q":"Bước đầu tiên khi đọc một bản vẽ là","options":["A. đọc khung tên","B. xem hình chiếu đứng","C. đọc kích thước","D. xem bảng kê"],"answer":"A","explain":"Đọc bản vẽ luôn bắt đầu từ khung tên để biết tên gọi, vật liệu, tỉ lệ.","points":0.25},{"type":"mcq","level":"TH","q":"Trên bản vẽ chi tiết, yêu cầu kỹ thuật KHÔNG bao gồm","options":["A. giá thành sản phẩm","B. vật liệu chế tạo","C. độ nhám bề mặt","D. dung sai kích thước"],"answer":"A","explain":"Yêu cầu kỹ thuật gồm vật liệu, độ nhám, dung sai, nhiệt luyện... không gồm giá thành.","points":0.25},{"type":"mcq","level":"TH","q":"Phần mềm nào sau đây dùng để lập bản vẽ kỹ thuật bằng máy tính?","options":["A. AutoCAD","B. Microsoft Word","C. Paint đơn giản","D. Trình duyệt web"],"answer":"A","explain":"AutoCAD là phần mềm CAD phổ biến dùng để lập bản vẽ kỹ thuật.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty cần lưu trữ hàng nghìn bản vẽ để dễ tìm kiếm, sửa chữa. Giải pháp tốt nhất là","options":["A. số hóa bản vẽ bằng phần mềm CAD, lưu trên máy tính","B. vẽ tay và cất trong tủ","C. chụp ảnh bản vẽ giấy","D. ghi chép lại bằng văn bản"],"answer":"A","explain":"Lập và lưu trữ bản vẽ bằng CAD trên máy tính giúp dễ tìm kiếm, sửa chữa, sao chép và chia sẻ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về CAD:","statements":["a) CAD giúp vẽ nhanh và chính xác.","b) CAD dễ sửa chữa bản vẽ.","c) CAD có thể dựng mô hình 3D.","d) Dùng CAD thì không cần tuân thủ tiêu chuẩn bản vẽ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: dù vẽ bằng CAD vẫn phải tuân thủ các tiêu chuẩn trình bày bản vẽ.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về quy trình đọc bản vẽ:","statements":["a) Đọc khung tên trước để biết tên gọi, tỉ lệ.","b) Phân tích các hình biểu diễn để hiểu hình dạng.","c) Phân tích kích thước để biết độ lớn.","d) Không cần đọc yêu cầu kỹ thuật."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo trình tự đọc bản vẽ. d) Sai: cần đọc yêu cầu kỹ thuật (vật liệu, độ nhám, dung sai...).","points":1},{"type":"short","level":"VDC","q":"Kể tên một phần mềm CAD phổ biến dùng để lập bản vẽ kỹ thuật.","answer":"AutoCAD","explain":"AutoCAD là phần mềm CAD phổ biến nhất dùng để lập bản vẽ kỹ thuật 2D và mô hình 3D.","points":0.5},{"type":"short","level":"VDC","q":"Ngoài bản vẽ 2D, phần mềm CAD còn có thể tạo ra loại mô hình nào?","answer":"Mô hình 3D","explain":"Phần mềm CAD hiện đại có thể dựng mô hình 3D, từ đó xuất tự động các hình chiếu và mô phỏng lắp ráp.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Bản vẽ lắp thể hiện","options":["A. vị trí tương quan giữa các chi tiết trong cụm máy","B. từng chi tiết riêng lẻ","C. mặt bằng ngôi nhà","D. quy trình công nghệ"],"answer":"A","explain":"Bản vẽ lắp thể hiện vị trí tương quan giữa các chi tiết trong cụm máy, sản phẩm hoàn chỉnh.","points":0.25},{"type":"mcq","level":"NB","q":"Kích thước ghi trên bản vẽ lắp chủ yếu là","options":["A. kích thước lắp ghép, kích thước bao","B. kích thước chế tạo từng chi tiết","C. kích thước khổ giấy","D. kích thước chữ viết"],"answer":"A","explain":"Bản vẽ lắp ghi kích thước lắp ghép, kích thước bao, kích thước điều chỉnh; không ghi kích thước chế tạo từng chi tiết.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị kích thước dài thường dùng trên bản vẽ xây dựng là","options":["A. milimét","B. mét","C. centimét","D. kilômét"],"answer":"A","explain":"Trên bản vẽ xây dựng, kích thước dài thường tính bằng milimét (giống bản vẽ cơ khí).","points":0.25},{"type":"mcq","level":"TH","q":"Điểm giống nhau giữa bản vẽ chi tiết và bản vẽ lắp là","options":["A. đều tuân thủ tiêu chuẩn trình bày bản vẽ kỹ thuật","B. đều có bảng kê","C. đều thể hiện ngôi nhà","D. đều dùng để chế tạo"],"answer":"A","explain":"Mọi bản vẽ kỹ thuật đều phải tuân thủ các tiêu chuẩn trình bày (khổ giấy, nét vẽ, chữ viết, ghi kích thước...).","points":0.25},{"type":"mcq","level":"TH","q":"Muốn biết trong cụm máy có bao nhiêu chi tiết và tên gọi từng chi tiết, xem","options":["A. bảng kê trên bản vẽ lắp","B. khung tên","C. hình chiếu đứng","D. mặt cắt"],"answer":"A","explain":"Bảng kê liệt kê đầy đủ các chi tiết của cụm máy: số thứ tự, tên gọi, số lượng, vật liệu.","points":0.25},{"type":"mcq","level":"VD","q":"Một thợ cơ khí được giao bản vẽ lắp của hộp giảm tốc nhưng không có bản vẽ chi tiết. Anh ta có thể","options":["A. lắp ráp được nhưng không chế tạo được chi tiết mới","B. chế tạo được mọi chi tiết","C. không làm được gì","D. vẽ lại bản vẽ chi tiết dễ dàng"],"answer":"A","explain":"Bản vẽ lắp là căn cứ để lắp ráp; muốn chế tạo chi tiết mới cần bản vẽ chi tiết (có kích thước chế tạo, yêu cầu kỹ thuật).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về so sánh hai loại bản vẽ cơ khí:","statements":["a) Bản vẽ chi tiết dùng để chế tạo từng chi tiết.","b) Bản vẽ lắp dùng để lắp ráp cụm máy.","c) Bản vẽ lắp có bảng kê, bản vẽ chi tiết không có.","d) Cả hai đều cần ghi đầy đủ kích thước chế tạo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chỉ bản vẽ chi tiết ghi kích thước chế tạo; bản vẽ lắp ghi kích thước lắp ghép.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về bản vẽ xây dựng:","statements":["a) Bản vẽ nhà gồm mặt bằng, mặt đứng, mặt cắt.","b) Mặt bằng là hình cắt ngang qua cửa sổ.","c) Mặt đứng thể hiện hình dáng bên ngoài.","d) Mặt cắt thể hiện cấu tạo theo chiều cao."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng, tóm tắt các hình biểu diễn chính của bản vẽ nhà.","points":1},{"type":"short","level":"VDC","q":"Trên bản vẽ lắp, đường nối từ số thứ tự đến chi tiết tương ứng gọi là gì?","answer":"Đường chỉ số (đường dẫn)","explain":"Số thứ tự chi tiết trên bản vẽ lắp được ghi trên đường dẫn (đường chỉ số) nối tới chi tiết đó, tương ứng với bảng kê.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao bản vẽ lắp không ghi kích thước chế tạo từng chi tiết?","answer":"Vì bản vẽ lắp dùng để lắp ráp, kích thước chế tạo đã có trên bản vẽ chi tiết","explain":"Mỗi loại bản vẽ có mục đích riêng: bản vẽ lắp phục vụ lắp ráp (kích thước lắp ghép), bản vẽ chi tiết phục vụ chế tạo.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Hình biểu diễn nào cho biết cách bố trí các phòng trong nhà?","options":["A. Mặt bằng","B. Mặt đứng","C. Mặt cắt","D. Phối cảnh"],"answer":"A","explain":"Mặt bằng (hình cắt ngang) cho biết vị trí, kích thước các phòng và cách bố trí trong nhà.","points":0.25},{"type":"mcq","level":"NB","q":"Hình biểu diễn nào cho biết mặt tiền của ngôi nhà?","options":["A. Mặt đứng","B. Mặt bằng","C. Mặt cắt","D. Bảng kê"],"answer":"A","explain":"Mặt đứng thể hiện hình dáng bên ngoài, bao gồm mặt tiền của ngôi nhà.","points":0.25},{"type":"mcq","level":"NB","q":"Bản vẽ nhà dùng làm căn cứ để","options":["A. thi công xây dựng","B. chế tạo máy","C. lắp ráp ô tô","D. thiết kế thời trang"],"answer":"A","explain":"Bản vẽ nhà dùng làm căn cứ để thi công xây dựng ngôi nhà.","points":0.25},{"type":"mcq","level":"TH","q":"Trên mặt cắt ngôi nhà, có thể thấy","options":["A. cầu thang, chiều cao phòng, sàn, mái","B. bố trí bàn ghế từng phòng","C. màu sơn tường","D. giá vật liệu xây dựng"],"answer":"A","explain":"Mặt cắt (cắt đứng) thể hiện cấu tạo theo chiều cao: cầu thang, chiều cao phòng, sàn, mái, móng.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác nhau giữa mặt đứng và mặt cắt của ngôi nhà là","options":["A. mặt đứng là hình chiếu ngoài, mặt cắt là hình cắt bên trong","B. mặt đứng vẽ bằng tay, mặt cắt vẽ bằng máy","C. mặt đứng không cần tỉ lệ","D. không có điểm khác nhau"],"answer":"A","explain":"Mặt đứng là hình chiếu thẳng góc thể hiện bên ngoài; mặt cắt là hình cắt bởi mặt phẳng đứng thể hiện cấu tạo bên trong.","points":0.25},{"type":"mcq","level":"VD","q":"Một gia đình muốn sửa lại vị trí các phòng trong nhà. Hình nào của bản vẽ nhà hữu ích nhất?","options":["A. Mặt bằng","B. Mặt đứng","C. Mặt cắt móng","D. Khung tên"],"answer":"A","explain":"Mặt bằng thể hiện bố trí các phòng nên hữu ích nhất khi muốn thay đổi vị trí phòng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ứng dụng bản vẽ:","statements":["a) Chế tạo bánh răng cần bản vẽ chi tiết.","b) Lắp ráp xe máy cần bản vẽ lắp.","c) Xây nhà cần bản vẽ nhà.","d) Sửa chữa máy cần đọc được bản vẽ lắp."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng: mỗi công việc dùng đúng loại bản vẽ phù hợp với mục đích.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về đọc bản vẽ cơ khí:","statements":["a) Đọc khung tên biết được vật liệu chi tiết.","b) Số thứ tự trên bản vẽ lắp tra được tên chi tiết ở bảng kê.","c) Kích thước lắp ghép cho biết mối quan hệ giữa các chi tiết.","d) Bản vẽ chi tiết không cần yêu cầu kỹ thuật."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bản vẽ chi tiết cần ghi yêu cầu kỹ thuật (độ nhám, dung sai...).","points":1},{"type":"short","level":"VDC","q":"Muốn biết ngôi nhà có bao nhiêu phòng và diện tích mỗi phòng, xem hình nào?","answer":"Mặt bằng","explain":"Mặt bằng thể hiện vị trí, kích thước các phòng nên cho biết số phòng và diện tích mỗi phòng.","points":0.5},{"type":"short","level":"VDC","q":"Muốn biết chiều cao của mái nhà so với mặt đất, xem hình nào của bản vẽ nhà?","answer":"Mặt đứng (hoặc mặt cắt)","explain":"Chiều cao các bộ phận của ngôi nhà (tầng, mái) thể hiện trên mặt đứng hoặc mặt cắt.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Trình tự đọc bản vẽ đúng là","options":["A. khung tên → hình biểu diễn → kích thước → tổng hợp","B. kích thước → khung tên → hình biểu diễn","C. hình biểu diễn → khung tên → kích thước","D. tổng hợp → khung tên → kích thước"],"answer":"A","explain":"Trình tự đọc: khung tên, phân tích hình biểu diễn, phân tích kích thước, tổng hợp.","points":0.25},{"type":"mcq","level":"NB","q":"Yêu cầu kỹ thuật trên bản vẽ chi tiết KHÔNG gồm","options":["A. số lượng sản phẩm cần chế tạo","B. vật liệu","C. độ nhám bề mặt","D. phương pháp nhiệt luyện"],"answer":"A","explain":"Yêu cầu kỹ thuật gồm vật liệu, độ nhám, dung sai, nhiệt luyện...; số lượng sản phẩm không phải yêu cầu kỹ thuật của chi tiết.","points":0.25},{"type":"mcq","level":"NB","q":"Bản vẽ lắp có thêm thành phần nào mà bản vẽ chi tiết không có?","options":["A. Bảng kê","B. Khung tên","C. Hình chiếu","D. Kích thước"],"answer":"A","explain":"Bản vẽ lắp có bảng kê liệt kê các chi tiết; bản vẽ chi tiết không có bảng kê.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao trên bản vẽ lắp cần đánh số thứ tự các chi tiết?","options":["A. Để tra cứu tên gọi, số lượng trong bảng kê khi lắp ráp","B. Để trang trí bản vẽ","C. Để tính giá thành","D. Để đánh dấu thứ tự chế tạo"],"answer":"A","explain":"Số thứ tự giúp tra cứu chi tiết trong bảng kê, đảm bảo lắp ráp đúng, đủ chi tiết.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt bằng tầng 2 của ngôi nhà hai tầng cho biết","options":["A. bố trí các phòng ở tầng 2","B. chiều cao tầng 2","C. cấu tạo móng nhà","D. hình dáng mái nhà"],"answer":"A","explain":"Mặt bằng tầng 2 là hình cắt ngang tầng 2, cho biết bố trí các phòng ở tầng 2.","points":0.25},{"type":"mcq","level":"VD","q":"Một đội thợ xây nhận bản vẽ nhà nhưng chỉ có mặt đứng và mặt cắt, không có mặt bằng. Họ sẽ gặp khó khăn gì?","options":["A. Không biết bố trí các phòng, vị trí cửa","B. Không biết chiều cao nhà","C. Không biết cấu tạo móng","D. Không thi công được gì"],"answer":"A","explain":"Mặt bằng cho biết bố trí phòng, vị trí cửa; thiếu mặt bằng sẽ không xác định được các thông tin này.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về bản vẽ CAD:","statements":["a) Vẽ bằng CAD nhanh hơn vẽ tay.","b) Bản vẽ CAD dễ sửa chữa.","c) CAD lưu trữ, chia sẻ bản vẽ thuận tiện.","d) CAD tự động thay người thiết kế ra quyết định kỹ thuật."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: CAD là công cụ hỗ trợ, quyết định kỹ thuật vẫn do người thiết kế.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về kích thước trên bản vẽ:","statements":["a) Bản vẽ chi tiết ghi kích thước chế tạo đầy đủ.","b) Bản vẽ lắp ghi kích thước lắp ghép.","c) Bản vẽ nhà ghi kích thước các phòng, tường, cửa.","d) Cả ba loại bản vẽ đều ghi kích thước khổ giấy."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: kích thước khổ giấy không phải nội dung ghi trên bản vẽ.","points":1},{"type":"short","level":"VDC","q":"Một xưởng cơ khí nhận đơn hàng chế tạo 100 chiếc trục. Loại bản vẽ xưởng cần là gì?","answer":"Bản vẽ chi tiết","explain":"Để chế tạo hàng loạt một chi tiết cần bản vẽ chi tiết (kích thước chế tạo, vật liệu, yêu cầu kỹ thuật).","points":0.5},{"type":"short","level":"VDC","q":"Trên bản vẽ lắp, làm thế nào để biết một chi tiết tên là gì?","answer":"Tra số thứ tự của chi tiết trong bảng kê","explain":"Mỗi chi tiết có số thứ tự trên đường chỉ số; tra số đó trong bảng kê sẽ biết tên gọi, số lượng, vật liệu.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Bản vẽ cơ khí gồm hai loại chính là","options":["A. bản vẽ chi tiết và bản vẽ lắp","B. bản vẽ mặt bằng và mặt đứng","C. bản vẽ phác thảo và bản vẽ hoàn chỉnh","D. bản vẽ tay và bản vẽ máy"],"answer":"A","explain":"Bản vẽ cơ khí gồm bản vẽ chi tiết và bản vẽ lắp.","points":0.25},{"type":"mcq","level":"NB","q":"Bản vẽ xây dựng thể hiện","options":["A. hình dạng, kích thước, cấu tạo công trình","B. chi tiết máy","C. mạch điện","D. quy trình sản xuất"],"answer":"A","explain":"Bản vẽ xây dựng thể hiện hình dạng, kích thước, cấu tạo của công trình, ngôi nhà.","points":0.25},{"type":"mcq","level":"NB","q":"Mặt phẳng cắt tạo mặt bằng của ngôi nhà là mặt phẳng","options":["A. nằm ngang","B. thẳng đứng","C. xiên 45°","D. song song với mái"],"answer":"A","explain":"Mặt bằng là hình cắt bằng tạo bởi mặt phẳng cắt nằm ngang.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung của bản vẽ chi tiết, bản vẽ lắp và bản vẽ nhà là","options":["A. đều là bản vẽ kỹ thuật, tuân thủ tiêu chuẩn trình bày","B. đều có bảng kê","C. đều thể hiện ngôi nhà","D. đều dùng để chế tạo máy"],"answer":"A","explain":"Tất cả đều là bản vẽ kỹ thuật, phải tuân thủ các tiêu chuẩn về khổ giấy, nét vẽ, chữ viết, ghi kích thước.","points":0.25},{"type":"mcq","level":"TH","q":"Trên bản vẽ nhà, kích thước chiều cao của tầng được ghi trên","options":["A. mặt đứng hoặc mặt cắt","B. mặt bằng","C. khung tên","D. bảng kê"],"answer":"A","explain":"Chiều cao thể hiện trên mặt đứng hoặc mặt cắt (hình cắt đứng).","points":0.25},{"type":"mcq","level":"VD","q":"Một kiến trúc sư muốn kiểm tra xem mái nhà có bị dột do cấu tạo sai không. Hình nào giúp ích nhất?","options":["A. Mặt cắt qua mái","B. Mặt bằng tầng 1","C. Mặt đứng mặt tiền","D. Khung tên"],"answer":"A","explain":"Mặt cắt thể hiện cấu tạo bên trong theo chiều cao, bao gồm cấu tạo mái, nên giúp kiểm tra cấu tạo mái.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về phân loại bản vẽ:","statements":["a) Bản vẽ chi tiết thuộc bản vẽ cơ khí.","b) Bản vẽ lắp thuộc bản vẽ cơ khí.","c) Bản vẽ nhà thuộc bản vẽ xây dựng.","d) Bản vẽ mặt bằng thuộc bản vẽ cơ khí."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mặt bằng là hình của bản vẽ nhà, thuộc bản vẽ xây dựng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về thực hành:","statements":["a) Thợ tiện dùng bản vẽ chi tiết để gia công.","b) Thợ lắp ráp dùng bản vẽ lắp để lắp máy.","c) Thợ xây dùng bản vẽ nhà để thi công.","d) Thợ hàn chỉ cần nhìn hình ảnh minh họa, không cần bản vẽ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mọi công việc kỹ thuật đều cần đọc đúng loại bản vẽ tương ứng.","points":1},{"type":"short","level":"VDC","q":"Nêu hai loại bản vẽ cơ khí chính.","answer":"Bản vẽ chi tiết và bản vẽ lắp","explain":"Bản vẽ cơ khí gồm bản vẽ chi tiết (chế tạo từng chi tiết) và bản vẽ lắp (lắp ráp cụm máy).","points":0.5},{"type":"short","level":"VDC","q":"Nêu ba hình biểu diễn chính của bản vẽ nhà.","answer":"Mặt bằng, mặt đứng, mặt cắt","explain":"Bản vẽ nhà gồm mặt bằng (cắt ngang), mặt đứng (nhìn thẳng), mặt cắt (cắt đứng).","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Để thể hiện vị trí tương quan giữa các chi tiết trong một cụm máy, dùng","options":["A. bản vẽ lắp","B. bản vẽ chi tiết","C. mặt bằng","D. mặt đứng nhà"],"answer":"A","explain":"Bản vẽ lắp thể hiện vị trí tương quan giữa các chi tiết trong cụm máy.","points":0.25},{"type":"mcq","level":"NB","q":"Số thứ tự chi tiết trên bản vẽ lắp được ghi","options":["A. trên đường chỉ số nối tới chi tiết","B. trong khung tên","C. trên đường kích thước","D. dưới hình chiếu"],"answer":"A","explain":"Số thứ tự ghi trên đường dẫn (đường chỉ số) nối tới chi tiết tương ứng.","points":0.25},{"type":"mcq","level":"NB","q":"Mô hình 3D trong CAD có tác dụng","options":["A. giúp hình dung trực quan, xuất tự động các hình chiếu","B. thay thế bản vẽ 2D hoàn toàn","C. tính giá thành sản phẩm","D. điều khiển máy thi công"],"answer":"A","explain":"Mô hình 3D giúp hình dung trực quan sản phẩm, có thể xuất tự động các hình chiếu và mô phỏng lắp ráp.","points":0.25},{"type":"mcq","level":"TH","q":"Một bản vẽ chi tiết thiếu ghi vật liệu. Hậu quả có thể là","options":["A. chế tạo sai vật liệu, chi tiết không đạt yêu cầu","B. không ảnh hưởng gì","C. chỉ ảnh hưởng thẩm mỹ","D. bản vẽ đẹp hơn"],"answer":"A","explain":"Vật liệu là yêu cầu kỹ thuật quan trọng; thiếu nó có thể dẫn đến chế tạo sai vật liệu, chi tiết không đảm bảo độ bền.","points":0.25},{"type":"mcq","level":"TH","q":"Trên mặt bằng, tường nhà được thể hiện bằng","options":["A. hai nét liền đậm song song","B. một nét liền mảnh","C. nét đứt","D. nét chấm gạch"],"answer":"A","explain":"Tường nhà trên mặt bằng thể hiện bằng hai nét liền đậm song song (chiều dày tường).","points":0.25},{"type":"mcq","level":"VD","q":"Một học sinh đọc bản vẽ lắp thấy chi tiết số 5 nhưng trong bảng kê không có số 5. Điều này cho thấy","options":["A. bản vẽ bị thiếu sót, cần kiểm tra lại","B. chi tiết số 5 không quan trọng","C. bảng kê chỉ ghi chi tiết chính","D. đó là quy ước bình thường"],"answer":"A","explain":"Mọi số thứ tự trên bản vẽ lắp phải có trong bảng kê; thiếu là sai sót cần kiểm tra, bổ sung.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nội dung khung tên:","statements":["a) Khung tên bản vẽ chi tiết ghi tên chi tiết.","b) Khung tên bản vẽ chi tiết ghi vật liệu.","c) Khung tên bản vẽ chi tiết ghi tỉ lệ.","d) Khung tên bản vẽ lắp ghi giá tiền từng chi tiết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: khung tên không ghi giá tiền.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về bản vẽ nhà hai tầng:","statements":["a) Cần mặt bằng cho từng tầng.","b) Mặt đứng thể hiện chiều cao cả hai tầng.","c) Mặt cắt thể hiện cầu thang giữa hai tầng.","d) Chỉ cần một mặt bằng chung cho cả nhà."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mỗi tầng có bố trí khác nhau nên cần mặt bằng riêng cho từng tầng.","points":1},{"type":"short","level":"VDC","q":"Vì sao khi lắp ráp một cụm máy phức tạp, thợ cơ khí cần cả bản vẽ lắp và các bản vẽ chi tiết?","answer":"Bản vẽ lắp để biết cách lắp, bản vẽ chi tiết để kiểm tra từng chi tiết","explain":"Bản vẽ lắp cho biết vị trí lắp ráp; bản vẽ chi tiết giúp kiểm tra chi tiết có đúng kích thước, yêu cầu kỹ thuật trước khi lắp.","points":0.5},{"type":"short","level":"VDC","q":"Trên mặt bằng nhà, làm thế nào để phân biệt tường chịu lực và tường ngăn?","answer":"Dựa vào chiều dày tường thể hiện trên mặt bằng (kèm ký hiệu quy ước)","explain":"Trên mặt bằng, tường thể hiện bằng hai nét song song; tường chịu lực thường dày hơn tường ngăn, có ký hiệu quy ước riêng.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Căn cứ để kiểm tra chất lượng một chi tiết sau khi chế tạo là","options":["A. bản vẽ chi tiết","B. bản vẽ lắp","C. bản vẽ nhà","D. ảnh chụp sản phẩm"],"answer":"A","explain":"Bản vẽ chi tiết có đầy đủ kích thước và yêu cầu kỹ thuật nên là căn cứ để kiểm tra chi tiết sau chế tạo.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các công việc sau, công việc nào cần bản vẽ nhà?","options":["A. Xây dựng một ngôi nhà","B. Chế tạo một bánh răng","C. Lắp ráp một chiếc xe đạp","D. Sửa chữa một chiếc quạt"],"answer":"A","explain":"Xây dựng nhà cửa cần bản vẽ nhà (mặt bằng, mặt đứng, mặt cắt).","points":0.25},{"type":"mcq","level":"NB","q":"Phần mềm CAD giúp người thiết kế","options":["A. vẽ nhanh, chính xác, dễ sửa và lưu trữ","B. không cần học vẽ kỹ thuật","C. tự động thi công công trình","D. thay thế kỹ sư thiết kế"],"answer":"A","explain":"CAD hỗ trợ vẽ nhanh, chính xác, dễ sửa chữa, lưu trữ và chia sẻ; người thiết kế vẫn cần kiến thức vẽ kỹ thuật.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác nhau giữa kích thước trên bản vẽ chi tiết và bản vẽ lắp là","options":["A. bản vẽ chi tiết ghi kích thước chế tạo, bản vẽ lắp ghi kích thước lắp ghép","B. bản vẽ lắp ghi chi tiết hơn","C. bản vẽ chi tiết không ghi kích thước","D. không có điểm khác nhau"],"answer":"A","explain":"Bản vẽ chi tiết ghi kích thước chế tạo từng chi tiết; bản vẽ lắp ghi kích thước lắp ghép, kích thước bao.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn biết tổng chiều dài của ngôi nhà, xem","options":["A. mặt bằng","B. mặt đứng","C. mặt cắt móng","D. khung tên"],"answer":"A","explain":"Mặt bằng thể hiện kích thước dài, rộng của ngôi nhà và các phòng.","points":0.25},{"type":"mcq","level":"VD","q":"Một công trình xây dựng bị sai vị trí cửa sổ so với thiết kế. Để xác định lỗi, đối chiếu với hình nào?","options":["A. Mặt bằng (vị trí cửa trên tường)","B. Mặt đứng","C. Mặt cắt móng","D. Bảng kê"],"answer":"A","explain":"Vị trí cửa đi, cửa sổ trên tường thể hiện rõ trên mặt bằng nên đối chiếu mặt bằng để phát hiện sai vị trí cửa.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vai trò các loại bản vẽ:","statements":["a) Không có bản vẽ chi tiết thì không chế tạo được chi tiết đúng yêu cầu.","b) Không có bản vẽ lắp thì khó lắp ráp đúng cụm máy.","c) Không có bản vẽ nhà thì không thi công đúng thiết kế.","d) Bản vẽ chỉ cần cho người thiết kế, thợ không cần đọc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thợ trực tiếp thi công, chế tạo, lắp ráp nên càng cần đọc được bản vẽ.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tiêu chuẩn:","statements":["a) Bản vẽ CAD vẫn phải tuân thủ TCVN về trình bày.","b) Nét vẽ trên bản vẽ CAD vẫn phân biệt đậm, mảnh, đứt.","c) Khung tên trên bản vẽ CAD vẫn đặt góc phải dưới.","d) Bản vẽ CAD không cần ghi kích thước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: CAD chỉ là công cụ, mọi tiêu chuẩn trình bày vẫn áp dụng. d) Sai: vẫn phải ghi đầy đủ kích thước.","points":1},{"type":"short","level":"VDC","q":"Một kỹ sư thiết kế xong cụm máy trên phần mềm CAD 3D. Hỏi để chế tạo từng chi tiết, xưởng cơ khí cần loại bản vẽ nào được xuất từ mô hình 3D?","answer":"Bản vẽ chi tiết","explain":"Từ mô hình 3D có thể xuất các bản vẽ 2D; để chế tạo từng chi tiết cần xuất bản vẽ chi tiết của nó.","points":0.5},{"type":"short","level":"VDC","q":"Giải thích vì sao bản vẽ lắp cần có bảng kê mà bản vẽ chi tiết thì không.","answer":"Vì bản vẽ lắp gồm nhiều chi tiết cần liệt kê để quản lý, bản vẽ chi tiết chỉ có một chi tiết","explain":"Bản vẽ lắp thể hiện cụm gồm nhiều chi tiết nên cần bảng kê để liệt kê, quản lý; bản vẽ chi tiết chỉ vẽ một chi tiết nên không cần.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Ba hình biểu diễn chính của bản vẽ nhà là","options":["A. mặt bằng, mặt đứng, mặt cắt","B. hình chiếu đứng, bằng, cạnh","C. mặt cắt chập, mặt cắt rời","D. hình chiếu trục đo, phối cảnh"],"answer":"A","explain":"Bản vẽ nhà gồm mặt bằng, mặt đứng và mặt cắt.","points":0.25},{"type":"mcq","level":"NB","q":"Hai loại bản vẽ cơ khí chính là","options":["A. bản vẽ chi tiết và bản vẽ lắp","B. bản vẽ mặt bằng và mặt đứng","C. bản vẽ 2D và 3D","D. bản vẽ tay và bản vẽ máy"],"answer":"A","explain":"Bản vẽ cơ khí gồm bản vẽ chi tiết và bản vẽ lắp.","points":0.25},{"type":"mcq","level":"NB","q":"CAD là công cụ","options":["A. hỗ trợ thiết kế, lập bản vẽ bằng máy tính","B. thay thế hoàn toàn con người","C. chỉ dùng để chơi game","D. chỉ dùng để soạn văn bản"],"answer":"A","explain":"CAD là công cụ hỗ trợ thiết kế, lập bản vẽ bằng máy tính.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đọc bản vẽ lắp của một cụm máy, thông tin nào giúp biết số lượng từng loại chi tiết?","options":["A. Cột số lượng trong bảng kê","B. Khung tên","C. Đường kích thước","D. Nét vẽ"],"answer":"A","explain":"Bảng kê có cột số lượng cho biết mỗi loại chi tiết cần bao nhiêu cái.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn kiểm tra một chi tiết vừa gia công có đúng đường kính lỗ không, căn cứ vào","options":["A. kích thước ghi trên bản vẽ chi tiết","B. bản vẽ lắp","C. mặt bằng nhà","D. ước lượng bằng mắt"],"answer":"A","explain":"Kích thước chế tạo ghi trên bản vẽ chi tiết là căn cứ để kiểm tra chi tiết sau gia công.","points":0.25},{"type":"mcq","level":"VD","q":"Một nhóm học sinh được giao đề tài: thiết kế mô hình nhà từ bìa cứng. Để phân công cắt các tấm tường đúng kích thước, nhóm cần dựa vào","options":["A. kích thước ghi trên mặt bằng và mặt đứng","B. ảnh chụp ngôi nhà mẫu","C. ước lượng tự do","D. khung tên bản vẽ"],"answer":"A","explain":"Kích thước dài, rộng xem trên mặt bằng; chiều cao xem trên mặt đứng, mặt cắt — đó là căn cứ để cắt tấm bìa đúng kích thước.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (tổng kết):","statements":["a) Bản vẽ chi tiết phục vụ chế tạo.","b) Bản vẽ lắp phục vụ lắp ráp.","c) Bản vẽ nhà phục vụ thi công.","d) Cả ba đều tuân thủ tiêu chuẩn bản vẽ kỹ thuật."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng, tóm tắt vai trò của các loại bản vẽ.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về đọc hiểu:","statements":["a) Đọc bản vẽ bắt đầu từ khung tên.","b) Bảng kê giúp tra cứu chi tiết trên bản vẽ lắp.","c) Mặt bằng giúp bố trí nội thất.","d) Người thợ không cần biết đọc bản vẽ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: người thợ trực tiếp làm nên phải đọc được bản vẽ.","points":1},{"type":"short","level":"VDC","q":"Một công ty muốn giới thiệu sản phẩm máy mới với khách hàng một cách trực quan, sinh động. Ngoài bản vẽ 2D, họ có thể dùng sản phẩm nào của CAD?","answer":"Mô hình 3D","explain":"Mô hình 3D từ CAD giúp khách hàng hình dung trực quan, sinh động sản phẩm trước khi chế tạo.","points":0.5},{"type":"short","level":"VDC","q":"Nêu điểm khác nhau cơ bản về mục đích giữa bản vẽ chi tiết và bản vẽ lắp.","answer":"Bản vẽ chi tiết để chế tạo từng chi tiết, bản vẽ lắp để lắp ráp các chi tiết thành cụm máy","explain":"Bản vẽ chi tiết là căn cứ chế tạo, kiểm tra từng chi tiết; bản vẽ lắp là căn cứ lắp ráp, vận hành cụm máy hoàn chỉnh.","points":0.5}]}]}</script>
