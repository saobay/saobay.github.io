<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Bản vẽ kỹ thuật được coi là gì trong lĩnh vực kỹ thuật?","options":["A. Ngôn ngữ chung của người làm kỹ thuật","B. Tài liệu quảng cáo sản phẩm","C. Bản phác thảo tự do của người thiết kế","D. Sổ tay ghi chép cá nhân"],"answer":"A","explain":"Bản vẽ kỹ thuật là ngôn ngữ chung của người làm kỹ thuật trên toàn thế giới, giúp mọi người đọc hiểu thống nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Ký hiệu các khổ giấy chính dùng cho bản vẽ kỹ thuật là","options":["A. A0, A1, A2, A3, A4","B. B0, B1, B2, B3, B4","C. C0, C1, C2, C3, C4","D. K0, K1, K2, K3, K4"],"answer":"A","explain":"Tiêu chuẩn quy định 5 khổ giấy chính ký hiệu từ A0 đến A4.","points":0.25},{"type":"mcq","level":"NB","q":"Tỉ lệ 1 : 1 được gọi là tỉ lệ","options":["A. nguyên hình","B. thu nhỏ","C. phóng to","D. tùy ý"],"answer":"A","explain":"Tỉ lệ 1 : 1 là tỉ lệ nguyên hình: kích thước trên bản vẽ bằng kích thước thật của vật thể.","points":0.25},{"type":"mcq","level":"TH","q":"Kích thước của khổ giấy A4 là","options":["A. 210 × 297 mm","B. 297 × 420 mm","C. 420 × 594 mm","D. 594 × 841 mm"],"answer":"A","explain":"Khổ A4 có kích thước 210 × 297 mm, là khổ giấy quen thuộc nhất trong học tập.","points":0.25},{"type":"mcq","level":"TH","q":"Đường bao thấy của vật thể được vẽ bằng nét nào?","options":["A. Nét liền đậm","B. Nét liền mảnh","C. Nét đứt mảnh","D. Nét chấm gạch mảnh"],"answer":"A","explain":"Đường bao thấy, cạnh thấy của vật thể được vẽ bằng nét liền đậm.","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết dài 400 mm được vẽ trên khổ A4 theo tỉ lệ 1 : 2. Chữ số kích thước chiều dài ghi trên bản vẽ là","options":["A. 400","B. 200","C. 800","D. 100"],"answer":"A","explain":"Dù vẽ theo tỉ lệ nào, chữ số kích thước ghi trên bản vẽ luôn là kích thước thật của vật thể, tức 400 (đơn vị mm không cần ghi).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về khổ giấy:","statements":["a) Chia đôi khổ A0 theo chiều dài được hai khổ A1.","b) Khổ A3 có kích thước 297 × 420 mm.","c) Khung vẽ thường cách mép giấy 5 mm, riêng cạnh trái chừa 20 mm để đóng tập.","d) Tờ A4 là khổ giấy lớn nhất trong các khổ A0 đến A4."],"answer":["T","T","T","F"],"explain":"a) Đúng: chia đôi khổ lớn theo chiều dài được hai khổ nhỏ liền kề. b) Đúng: A3 = 297 × 420 mm. c) Đúng theo quy định khung vẽ. d) Sai: A0 mới là khổ lớn nhất.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về ghi kích thước:","statements":["a) Đường kích thước được vẽ bằng nét liền mảnh, hai đầu có mũi tên.","b) Chữ số kích thước cho biết kích thước đo được trên bản vẽ.","c) Đơn vị milimét không cần ghi sau chữ số kích thước dài.","d) Trước chữ số chỉ đường kính phải ghi ký hiệu Ø."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: chữ số kích thước cho biết kích thước thật của vật thể. c) Đúng: mm là đơn vị mặc định. d) Đúng: Ø là ký hiệu đường kính.","points":1},{"type":"short","level":"VDC","q":"Khổ giấy A2 có kích thước 420 × 594 mm. Hỏi diện tích một tờ A2 gấp bao nhiêu lần diện tích một tờ A4?","answer":"4","explain":"Mỗi lần chia đôi khổ giấy thì diện tích giảm một nửa. Từ A2 đến A4 phải chia 2 lần (A2 thành A3, A3 thành A4) nên diện tích A2 gấp 2 × 2 = 4 lần diện tích A4.","points":0.5},{"type":"short","level":"VDC","q":"Khung tên của bản vẽ kỹ thuật được đặt ở vị trí nào trên tờ giấy?","answer":"Góc phải phía dưới","explain":"Theo tiêu chuẩn, khung tên đặt ở góc phải phía dưới bản vẽ, ghi tên chi tiết, vật liệu, tỉ lệ và các thông tin khác.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hệ thống tiêu chuẩn bản vẽ kỹ thuật của Việt Nam có ký hiệu là","options":["A. TCVN","B. ISO","C. JIS","D. DIN"],"answer":"A","explain":"Việt Nam ban hành hệ thống tiêu chuẩn Việt Nam, ký hiệu TCVN, về bản vẽ kỹ thuật.","points":0.25},{"type":"mcq","level":"NB","q":"Đường bao khuất của vật thể được vẽ bằng nét nào?","options":["A. Nét đứt mảnh","B. Nét liền đậm","C. Nét liền mảnh","D. Nét chấm gạch mảnh"],"answer":"A","explain":"Đường bao khuất, cạnh khuất của vật thể được vẽ bằng nét đứt mảnh.","points":0.25},{"type":"mcq","level":"NB","q":"Đường tâm, trục đối xứng của vật thể được vẽ bằng nét nào?","options":["A. Nét chấm gạch mảnh","B. Nét liền đậm","C. Nét đứt mảnh","D. Nét lượn sóng"],"answer":"A","explain":"Đường tâm và trục đối xứng được vẽ bằng nét chấm gạch mảnh.","points":0.25},{"type":"mcq","level":"TH","q":"Tỉ lệ nào sau đây là tỉ lệ phóng to?","options":["A. 2 : 1","B. 1 : 2","C. 1 : 5","D. 1 : 10"],"answer":"A","explain":"Tỉ lệ phóng to có số đầu lớn hơn số sau: 2 : 1, 5 : 1... Các tỉ lệ 1 : 2, 1 : 5, 1 : 10 là tỉ lệ thu nhỏ.","points":0.25},{"type":"mcq","level":"TH","q":"Chữ viết trên bản vẽ kỹ thuật thường được viết","options":["A. thẳng đứng hoặc nghiêng 75°","B. nghiêng 45° về bên trái","C. theo kiểu chữ nghệ thuật","D. chỉ viết bằng chữ in hoa"],"answer":"A","explain":"Chữ viết trên bản vẽ dùng kiểu thẳng đứng hoặc nghiêng 75°, rõ ràng, dễ đọc.","points":0.25},{"type":"mcq","level":"VD","q":"Trên bản vẽ ghi tỉ lệ 5 : 1, một đoạn thẳng đo được trên giấy dài 60 mm. Kích thước thật của đoạn thẳng đó là","options":["A. 12 mm","B. 300 mm","C. 60 mm","D. 65 mm"],"answer":"A","explain":"Tỉ lệ 5 : 1 nghĩa là kích thước trên bản vẽ gấp 5 lần kích thước thật, nên kích thước thật = 60 chia 5 = 12 mm.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nét vẽ:","statements":["a) Nét liền mảnh dùng để vẽ đường gióng và đường kích thước.","b) Nét lượn sóng dùng để vẽ đường giới hạn của hình cắt.","c) Đường bao thấy vẽ bằng nét đứt mảnh.","d) Mỗi loại nét vẽ mang một ý nghĩa riêng, không dùng lẫn lộn."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: nét lượn sóng vẽ đường giới hạn hình cắt, chỗ gãy vỡ quy ước. c) Sai: bao thấy vẽ bằng nét liền đậm. d) Đúng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tỉ lệ:","statements":["a) Tỉ lệ 1 : 5 là tỉ lệ thu nhỏ.","b) Khi vẽ tỉ lệ 2 : 1, chữ số kích thước ghi gấp đôi kích thước thật.","c) Tỉ lệ được ghi trong khung tên của bản vẽ.","d) Chi tiết máy nhỏ như linh kiện đồng hồ thường vẽ theo tỉ lệ phóng to."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: chữ số kích thước luôn là kích thước thật. c) Đúng. d) Đúng: chi tiết nhỏ vẽ phóng to cho dễ đọc.","points":1},{"type":"short","level":"VDC","q":"Kích thước của khổ giấy A1 là bao nhiêu (ghi theo dạng rộng × dài, đơn vị mm)?","answer":"594 × 841 mm","explain":"Khổ A1 có kích thước 594 × 841 mm, bằng hai tờ A2 ghép lại theo chiều dài.","points":0.5},{"type":"short","level":"VDC","q":"Ký hiệu ghi trước chữ số chỉ bán kính của cung tròn trên bản vẽ là ký hiệu nào?","answer":"R","explain":"Trước chữ số chỉ bán kính ghi ký hiệu R (ví dụ R10); trước đường kính ghi ký hiệu đường kính.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Đường gióng và đường kích thước được vẽ bằng nét nào?","options":["A. Nét liền mảnh","B. Nét liền đậm","C. Nét đứt mảnh","D. Nét chấm gạch đậm"],"answer":"A","explain":"Đường gióng và đường kích thước đều được vẽ bằng nét liền mảnh.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị mặc định của kích thước dài trên bản vẽ kỹ thuật là","options":["A. milimét (mm)","B. centimét (cm)","C. mét (m)","D. inch"],"answer":"A","explain":"Kích thước dài trên bản vẽ mặc định tính bằng milimét và không cần ghi đơn vị sau chữ số.","points":0.25},{"type":"mcq","level":"NB","q":"Trước chữ số chỉ đường kính trên bản vẽ phải ghi ký hiệu nào?","options":["A. Ký hiệu đường kính","B. Chữ R","C. Chữ D","D. Không ghi ký hiệu gì"],"answer":"A","explain":"Trước chữ số chỉ đường kính ghi ký hiệu đường kính (ví dụ với đường kính 20).","points":0.25},{"type":"mcq","level":"TH","q":"Chia đôi khổ giấy A3 theo chiều dài ta được","options":["A. hai khổ A4","B. hai khổ A2","C. hai khổ A5","D. bốn khổ A4"],"answer":"A","explain":"Chia đôi khổ lớn theo chiều dài được hai khổ nhỏ liền kề: A3 chia đôi được 2 tờ A4.","points":0.25},{"type":"mcq","level":"TH","q":"Cỡ chữ nào sau đây KHÔNG thuộc dãy cỡ chữ tiêu chuẩn trên bản vẽ?","options":["A. 4 mm","B. 3,5 mm","C. 7 mm","D. 14 mm"],"answer":"A","explain":"Dãy cỡ chữ tiêu chuẩn là 2,5 – 3,5 – 5 – 7 – 10 – 14 – 20 mm; không có cỡ 4 mm.","points":0.25},{"type":"mcq","level":"VD","q":"Một bản vẽ ghi tỉ lệ 1 : 50, trên bản vẽ chiều dài phòng khách đo được 120 mm. Chiều dài thật của phòng khách là","options":["A. 6 m","B. 60 m","C. 2,4 m","D. 12 m"],"answer":"A","explain":"Tỉ lệ 1 : 50 nghĩa là kích thước thật gấp 50 lần trên bản vẽ: 120 × 50 = 6000 mm = 6 m.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về chữ viết:","statements":["a) Chữ số kích thước thường dùng cỡ 3,5 mm hoặc 5 mm.","b) Cỡ chữ trên bản vẽ lấy theo dãy 2,5 – 3,5 – 5 – 7 – 10 – 14 – 20 mm.","c) Chữ viết trên bản vẽ phải nghiêng đúng 45°.","d) Chữ viết phải rõ ràng, dễ đọc."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng theo dãy cỡ chữ tiêu chuẩn. c) Sai: chữ viết thẳng đứng hoặc nghiêng 75°. d) Đúng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về kích thước góc và đường gióng:","statements":["a) Kích thước góc được ghi kèm ký hiệu độ.","b) Không được ghi trùng lặp một kích thước ở nhiều hình biểu diễn.","c) Đường gióng kẻ song song với đoạn cần đo.","d) Khung tên ghi tên chi tiết, vật liệu, tỉ lệ bản vẽ."],"answer":["T","T","F","T"],"explain":"a) Đúng: ví dụ 45°. b) Đúng: tránh trùng lặp gây rối. c) Sai: đường gióng kẻ vuông góc với đoạn cần đo. d) Đúng.","points":1},{"type":"short","level":"VDC","q":"Khổ giấy A0 có kích thước 841 × 1189 mm. Hỏi phải ghép bao nhiêu tờ A4 mới phủ kín một tờ A0?","answer":"16","explain":"Từ A0 đến A4 phải chia 4 lần (A0→A1→A2→A3→A4), mỗi lần diện tích giảm một nửa nên một tờ A0 bằng 2^4 = 16 tờ A4.","points":0.5},{"type":"short","level":"VDC","q":"Nêu tên nét vẽ dùng để thể hiện chỗ gãy vỡ quy ước của vật thể dài.","answer":"Nét lượn sóng","explain":"Nét lượn sóng dùng để vẽ đường giới hạn của hình cắt và thể hiện chỗ gãy vỡ quy ước.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Khung vẽ là","options":["A. đường viền bao quanh bản vẽ, cách mép giấy một khoảng quy định","B. khung ghi tên chi tiết ở góc bản vẽ","C. đường chia khổ giấy thành các ô","D. viền trang trí xung quanh bản vẽ"],"answer":"A","explain":"Khung vẽ là đường viền bao quanh bản vẽ, cách mép giấy một khoảng quy định (thường 5 mm, cạnh trái 20 mm).","points":0.25},{"type":"mcq","level":"NB","q":"Tỉ lệ thu nhỏ thường dùng khi vẽ","options":["A. vật thể lớn như nhà cửa, máy móc","B. chi tiết nhỏ như linh kiện điện tử","C. mọi vật thể","D. chỉ vẽ phác thảo"],"answer":"A","explain":"Vật thể lớn như nhà cửa, máy móc được vẽ theo tỉ lệ thu nhỏ (1 : 2, 1 : 5...) cho vừa khổ giấy.","points":0.25},{"type":"mcq","level":"NB","q":"Chữ số kích thước được đặt ở vị trí nào so với đường kích thước nằm ngang?","options":["A. Phía trên đường kích thước","B. Phía dưới đường kích thước","C. Đè lên đường kích thước","D. Ở đầu mũi tên"],"answer":"A","explain":"Chữ số kích thước ghi phía trên đường kích thước nằm ngang (hoặc bên trái đường kích thước thẳng đứng).","points":0.25},{"type":"mcq","level":"TH","q":"Hai đầu của đường kích thước có","options":["A. mũi tên chạm vào đường gióng","B. vòng tròn nhỏ","C. dấu chấm đậm","D. không có ký hiệu gì"],"answer":"A","explain":"Đường kích thước có hai đầu là mũi tên chạm vào đường gióng.","points":0.25},{"type":"mcq","level":"TH","q":"Đường gióng được kẻ như thế nào so với đoạn cần đo?","options":["A. Vuông góc và vượt quá đường kích thước một chút","B. Song song và trùng với đoạn cần đo","C. Xiên 45°","D. Chấm dứt đúng tại đường kích thước"],"answer":"A","explain":"Đường gióng kẻ vuông góc với đoạn cần đo và vượt quá đường kích thước một chút.","points":0.25},{"type":"mcq","level":"VD","q":"Trên một bản vẽ, cùng một kích thước được ghi ở cả hình chiếu đứng và hình chiếu bằng. Cách ghi này","options":["A. sai quy định vì gây trùng lặp","B. đúng quy định, càng rõ càng tốt","C. chỉ sai khi hai số khác nhau","D. bắt buộc với mọi kích thước"],"answer":"A","explain":"Không được ghi trùng lặp một kích thước ở nhiều hình biểu diễn vì gây rối và dễ mâu thuẫn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về khung tên:","statements":["a) Khung tên đặt ở góc phải phía dưới bản vẽ.","b) Khung tên ghi tên gọi chi tiết hoặc sản phẩm.","c) Khung tên ghi vật liệu chế tạo và tỉ lệ bản vẽ.","d) Khung tên ghi họ tên người vẽ và ngày vẽ."],"answer":["T","T","T","T"],"explain":"Khung tên đặt ở góc phải phía dưới, ghi đầy đủ: tên chi tiết, vật liệu, tỉ lệ, người vẽ, người kiểm tra, ngày tháng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tỉ lệ và chữ số kích thước:","statements":["a) Bản vẽ tỉ lệ 1 : 1 gọi là tỉ lệ nguyên hình.","b) Chữ số kích thước trên bản vẽ tỉ lệ 1 : 2 bằng một nửa kích thước thật.","c) Kích thước 45° là kích thước góc.","d) Đường tâm của lỗ tròn vẽ bằng nét chấm gạch mảnh."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: chữ số kích thước luôn là kích thước thật. c) Đúng. d) Đúng.","points":1},{"type":"short","level":"VDC","q":"Một trục máy dài thật 1,5 m được vẽ với tỉ lệ 1 : 5. Hỏi đoạn thẳng biểu diễn trục trên bản vẽ dài bao nhiêu milimét?","answer":"300","explain":"1,5 m = 1500 mm; tỉ lệ 1 : 5 nên đoạn trên bản vẽ dài 1500 chia 5 = 300 mm.","points":0.5},{"type":"short","level":"VDC","q":"Khi đọc một bản vẽ kỹ thuật, người ta thường bắt đầu đọc từ bộ phận nào của bản vẽ?","answer":"Khung tên","explain":"Đọc bản vẽ luôn bắt đầu từ khung tên để biết tên chi tiết, vật liệu, tỉ lệ rồi mới xem các hình biểu diễn.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Kích thước của khổ giấy A2 là","options":["A. 420 × 594 mm","B. 210 × 297 mm","C. 297 × 420 mm","D. 594 × 841 mm"],"answer":"A","explain":"Khổ A2 có kích thước 420 × 594 mm.","points":0.25},{"type":"mcq","level":"NB","q":"Nét nào dùng để vẽ đường gạch trên mặt cắt?","options":["A. Nét liền mảnh","B. Nét liền đậm","C. Nét đứt mảnh","D. Nét chấm gạch đậm"],"answer":"A","explain":"Đường gạch biểu diễn vật liệu trên mặt cắt được vẽ bằng nét liền mảnh.","points":0.25},{"type":"mcq","level":"NB","q":"Khổ giấy nào sau đây lớn hơn khổ A3?","options":["A. A2","B. A4","C. A5","D. Không có khổ nào"],"answer":"A","explain":"Thứ tự khổ giấy từ lớn đến nhỏ: A0, A1, A2, A3, A4. A2 lớn hơn A3.","points":0.25},{"type":"mcq","level":"TH","q":"Tỉ lệ 10 : 1 là tỉ lệ","options":["A. phóng to","B. thu nhỏ","C. nguyên hình","D. đặc biệt"],"answer":"A","explain":"Tỉ lệ 10 : 1 có số đầu lớn hơn nhiều số sau nên là tỉ lệ phóng to, dùng cho chi tiết rất nhỏ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chữ số kích thước trên bản vẽ luôn ghi kích thước thật?","options":["A. Để người đọc biết đúng kích thước chế tạo, không phụ thuộc tỉ lệ vẽ","B. Để tiết kiệm chỗ trên bản vẽ","C. Để bản vẽ đẹp hơn","D. Vì quy định cấm ghi số đo trên giấy"],"answer":"A","explain":"Chữ số kích thước là căn cứ để chế tạo nên phải là kích thước thật, không phụ thuộc vào tỉ lệ người vẽ đã chọn.","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết có đường kính thật Ø50 mm được vẽ theo tỉ lệ 2 : 1. Trên bản vẽ, đường tròn biểu diễn có đường kính đo được 100 mm và chữ số ghi là","options":["A. 50","B. 100","C. 25","D. 200"],"answer":"A","explain":"Đường tròn vẽ ra có đường kính 100 mm (phóng to gấp đôi) nhưng chữ số kích thước vẫn ghi kích thước thật là 50.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về kích thước các khổ giấy:","statements":["a) Khổ A1 = 594 × 841 mm.","b) Chia đôi A1 theo chiều dài được hai khổ A2.","c) Cạnh trái của khung vẽ chừa 20 mm để đóng tập bản vẽ.","d) Khổ A4 là khổ lớn nhất."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: chia đôi khổ lớn được hai khổ nhỏ liền kề. c) Đúng. d) Sai: A0 lớn nhất.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về đường gióng:","statements":["a) Đường gióng vẽ bằng nét liền mảnh.","b) Đường gióng vượt quá đường kích thước một chút.","c) Đường gióng kẻ xiên 45° so với đoạn cần đo.","d) Mũi tên của đường kích thước chạm vào đường gióng."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: đường gióng kẻ vuông góc với đoạn cần đo. d) Đúng.","points":1},{"type":"short","level":"VDC","q":"Cỡ chữ tiêu chuẩn nào thường được dùng để ghi chữ số kích thước trên bản vẽ? (ghi một cỡ)","answer":"3,5","explain":"Chữ số kích thước thường dùng cỡ chữ 3,5 mm hoặc 5 mm.","points":0.5},{"type":"short","level":"VDC","q":"Một bản vẽ chi tiết máy ghi tỉ lệ 1 : 1. Hỏi kích thước đo trên bản vẽ so với kích thước thật như thế nào?","answer":"Bằng nhau","explain":"Tỉ lệ 1 : 1 là tỉ lệ nguyên hình: kích thước trên bản vẽ bằng kích thước thật của vật thể.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Tỉ lệ là","options":["A. tỉ số giữa kích thước đo được trên bản vẽ và kích thước thật của vật thể","B. tỉ số giữa chiều dài và chiều rộng khổ giấy","C. tỉ số giữa các cỡ chữ trên bản vẽ","D. tỉ số giữa nét đậm và nét mảnh"],"answer":"A","explain":"Tỉ lệ là tỉ số giữa kích thước đo được trên bản vẽ và kích thước thật của vật thể.","points":0.25},{"type":"mcq","level":"NB","q":"Kích thước góc trên bản vẽ được tính bằng đơn vị","options":["A. độ","B. milimét","C. radian","D. phút"],"answer":"A","explain":"Kích thước góc tính bằng độ và phải ghi ký hiệu độ (ví dụ 45°).","points":0.25},{"type":"mcq","level":"NB","q":"Trong các khổ giấy sau, khổ nào có diện tích lớn nhất?","options":["A. A0","B. A1","C. A3","D. A4"],"answer":"A","explain":"A0 là khổ giấy lớn nhất (841 × 1189 mm), diện tích gấp đôi A1, gấp 16 lần A4.","points":0.25},{"type":"mcq","level":"TH","q":"Đường bao thấy của một khối hộp chữ nhật trên bản vẽ được vẽ bằng","options":["A. nét liền đậm","B. nét đứt mảnh","C. nét chấm gạch mảnh","D. nét liền mảnh"],"answer":"A","explain":"Đường bao thấy, cạnh thấy vẽ bằng nét liền đậm.","points":0.25},{"type":"mcq","level":"TH","q":"Khi ghi kích thước đường kính của lỗ tròn, ký hiệu đường kính được đặt","options":["A. trước chữ số kích thước","B. sau chữ số kích thước","C. dưới chữ số kích thước","D. thay cho chữ số kích thước"],"answer":"A","explain":"Ký hiệu đường kính ghi trước chữ số kích thước (ví dụ với đường kính 20).","points":0.25},{"type":"mcq","level":"VD","q":"Bạn An vẽ một con bulông dài 30 mm theo tỉ lệ 2 : 1 trên giấy. Chiều dài đoạn thẳng bạn An vẽ và chữ số kích thước ghi trên bản vẽ lần lượt là","options":["A. 60 mm và 30","B. 30 mm và 60","C. 15 mm và 30","D. 60 mm và 60"],"answer":"A","explain":"Tỉ lệ 2 : 1 phóng to gấp đôi nên đoạn vẽ dài 60 mm; chữ số kích thước luôn ghi kích thước thật là 30.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tỉ lệ bản vẽ:","statements":["a) Tỉ lệ 1 : 2 là tỉ lệ thu nhỏ.","b) Tỉ lệ 5 : 1 là tỉ lệ phóng to.","c) Bản vẽ nhà thường dùng tỉ lệ nguyên hình 1 : 1.","d) Tỉ lệ bản vẽ được ghi trong khung tên."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: bản vẽ nhà dùng tỉ lệ thu nhỏ (ví dụ 1 : 50, 1 : 100). d) Đúng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về chữ viết và nét vẽ:","statements":["a) Chữ số kích thước thẳng đứng ghi ở bên trái đường kích thước.","b) Được phép ghi đơn vị mm sau mọi chữ số kích thước dài.","c) Nét đứt mảnh dùng để vẽ cạnh khuất.","d) Mỗi bản vẽ chỉ dùng một loại tỉ lệ duy nhất."],"answer":["T","F","T","F"],"explain":"a) Đúng. b) Sai: mm là đơn vị mặc định, không cần ghi. c) Đúng. d) Sai: một bản vẽ có thể dùng tỉ lệ chính và tỉ lệ riêng cho hình phóng to chi tiết.","points":1},{"type":"short","level":"VDC","q":"Khung vẽ của bản vẽ thường cách mép giấy bao nhiêu milimét (trừ cạnh trái để đóng)?","answer":"5","explain":"Khung vẽ thường cách mép giấy 5 mm; riêng cạnh trái chừa 20 mm để đóng tập bản vẽ.","points":0.5},{"type":"short","level":"VDC","q":"Chữ viết trên bản vẽ ngoài kiểu thẳng đứng còn có thể viết nghiêng một góc bao nhiêu độ?","answer":"75","explain":"Chữ viết trên bản vẽ dùng kiểu thẳng đứng hoặc nghiêng 75°.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Nét lượn sóng trên bản vẽ dùng để","options":["A. vẽ đường giới hạn của hình cắt và chỗ gãy vỡ quy ước","B. vẽ đường bao thấy","C. vẽ đường tâm","D. vẽ đường kích thước"],"answer":"A","explain":"Nét lượn sóng dùng để vẽ đường giới hạn của hình cắt và thể hiện chỗ gãy vỡ quy ước.","points":0.25},{"type":"mcq","level":"NB","q":"Khổ giấy A3 có kích thước","options":["A. 297 × 420 mm","B. 210 × 297 mm","C. 420 × 594 mm","D. 841 × 1189 mm"],"answer":"A","explain":"Khổ A3 có kích thước 297 × 420 mm.","points":0.25},{"type":"mcq","level":"NB","q":"Ký hiệu R ghi trước chữ số kích thước cho biết đó là kích thước","options":["A. bán kính","B. đường kính","C. chiều dài","D. góc"],"answer":"A","explain":"Ký hiệu R ghi trước chữ số chỉ bán kính của cung tròn (ví dụ R10).","points":0.25},{"type":"mcq","level":"TH","q":"Trên bản vẽ, trục đối xứng của chi tiết được vẽ bằng","options":["A. nét chấm gạch mảnh","B. nét liền đậm","C. nét đứt mảnh","D. nét liền mảnh"],"answer":"A","explain":"Trục đối xứng, đường tâm vẽ bằng nét chấm gạch mảnh.","points":0.25},{"type":"mcq","level":"TH","q":"Một bản vẽ có tỉ lệ ghi trong khung tên là 1 : 10. Đây là tỉ lệ","options":["A. thu nhỏ","B. phóng to","C. nguyên hình","D. tự do"],"answer":"A","explain":"Tỉ lệ 1 : 10 là tỉ lệ thu nhỏ (kích thước trên bản vẽ bằng một phần mười kích thước thật).","points":0.25},{"type":"mcq","level":"VD","q":"Để vẽ một ngôi nhà dài 12 m vừa khổ giấy A3 (chiều dài khổ A3 là 420 mm, trừ lề còn khoảng 400 mm), nên chọn tỉ lệ nào?","options":["A. 1 : 50","B. 1 : 10","C. 2 : 1","D. 1 : 1"],"answer":"A","explain":"12 m = 12000 mm. Với tỉ lệ 1 : 50, đoạn vẽ dài 12000 chia 50 = 240 mm, vừa trong khổ A3. Tỉ lệ 1 : 10 cho đoạn 1200 mm vượt khổ giấy.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về các loại nét vẽ:","statements":["a) Nét liền đậm dùng để vẽ đường bao thấy.","b) Nét đứt mảnh dùng để vẽ đường bao khuất.","c) Nét chấm gạch mảnh dùng để vẽ đường kích thước.","d) Nét liền mảnh dùng để vẽ đường gióng."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: đường kích thước vẽ bằng nét liền mảnh; chấm gạch dùng cho đường tâm. d) Đúng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về chữ số kích thước và khung tên:","statements":["a) Chữ số kích thước trên bản vẽ tỉ lệ 1 : 5 bằng kích thước thật.","b) Đơn vị của kích thước dài mặc định là milimét.","c) Kích thước góc 45° phải ghi kèm ký hiệu độ.","d) Khung tên đặt ở góc trái phía dưới bản vẽ."],"answer":["T","T","T","F"],"explain":"a) Đúng: chữ số kích thước luôn là kích thước thật. b) Đúng. c) Đúng. d) Sai: khung tên đặt ở góc phải phía dưới.","points":1},{"type":"short","level":"VDC","q":"Một tờ giấy A0 chia theo chiều dài thành các tờ A4. Hỏi cạnh 1189 mm của tờ A0 sau khi chia sẽ tạo ra cạnh bao nhiêu milimét của tờ A4?","answer":"297","explain":"Cạnh 1189 mm chia đôi 4 lần: 1189→594→297... thực tế khổ A4 có cạnh dài 297 mm (làm tròn theo tiêu chuẩn).","points":0.5},{"type":"short","level":"VDC","q":"Đường gạch biểu diễn vật liệu trên mặt cắt được vẽ bằng nét gì?","answer":"Nét liền mảnh","explain":"Đường gạch chéo biểu diễn vật liệu trên mặt cắt được vẽ bằng nét liền mảnh, nghiêng 45°.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"TCVN là ký hiệu của","options":["A. tiêu chuẩn Việt Nam","B. tiêu chuẩn quốc tế","C. tiêu chuẩn Nhật Bản","D. tiêu chuẩn Đức"],"answer":"A","explain":"TCVN là ký hiệu của tiêu chuẩn Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Cách chia các khổ giấy A0, A1, A2, A3, A4 từ khổ A0 là","options":["A. chia đôi theo chiều dài","B. chia đôi theo chiều rộng","C. chia ba theo chiều dài","D. chia tư theo đường chéo"],"answer":"A","explain":"Chia đôi khổ lớn theo chiều dài được hai khổ nhỏ liền kề.","points":0.25},{"type":"mcq","level":"NB","q":"Mũi tên ở hai đầu đường kích thước có tác dụng","options":["A. chỉ giới hạn đoạn cần đo, chạm vào đường gióng","B. trang trí cho bản vẽ đẹp","C. chỉ hướng đọc bản vẽ","D. đánh dấu vị trí khung tên"],"answer":"A","explain":"Mũi tên ở hai đầu đường kích thước chạm vào đường gióng, chỉ rõ giới hạn đoạn cần đo.","points":0.25},{"type":"mcq","level":"TH","q":"Khổ giấy nào thường dùng nhất trong học tập?","options":["A. A4","B. A0","C. A1","D. A2"],"answer":"A","explain":"Khổ A4 (210 × 297 mm) là khổ giấy quen thuộc nhất, thường dùng trong học tập.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây đúng về đường gióng?","options":["A. Vẽ bằng nét liền mảnh, vuông góc với đoạn cần đo","B. Vẽ bằng nét liền đậm, song song với đoạn cần đo","C. Vẽ bằng nét đứt, xiên 45°","D. Vẽ bằng nét chấm gạch, trùng với đoạn cần đo"],"answer":"A","explain":"Đường gióng vẽ bằng nét liền mảnh, kẻ vuông góc với đoạn cần đo và vượt quá đường kích thước một chút.","points":0.25},{"type":"mcq","level":"VD","q":"Một bản vẽ dùng tỉ lệ 1 : 2 cho hình chính và có một hình phóng to chi tiết ghi tỉ lệ 4 : 1. Điều này cho thấy","options":["A. một bản vẽ có thể dùng nhiều tỉ lệ khác nhau cho các hình","B. bản vẽ bị sai quy định","C. tỉ lệ trong khung tên không còn ý nghĩa","D. hình phóng to phải vẽ nhỏ hơn hình chính"],"answer":"A","explain":"Một bản vẽ có thể dùng tỉ lệ chính (ghi trong khung tên) và các tỉ lệ riêng cho hình trích, hình phóng to chi tiết.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về khung vẽ và khung tên:","statements":["a) Khung vẽ cách mép giấy 5 mm, cạnh trái chừa 20 mm.","b) Khung tên chứa thông tin về người vẽ và ngày vẽ.","c) Đọc bản vẽ nên bắt đầu từ khung tên.","d) Khung tên đặt ở góc phải phía trên bản vẽ."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: đọc khung tên trước để biết tên chi tiết, vật liệu, tỉ lệ. d) Sai: khung tên đặt ở góc phải phía dưới.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tỉ lệ và cách chọn tỉ lệ:","statements":["a) Tỉ lệ 2 : 1 nghĩa là hình vẽ lớn gấp đôi vật thật.","b) Tỉ lệ 1 : 100 nghĩa là hình vẽ nhỏ bằng một phần trăm vật thật.","c) Chữ số kích thước trên bản vẽ tỉ lệ 2 : 1 gấp đôi kích thước thật.","d) Người ta chọn tỉ lệ sao cho hình vẽ cân đối trong khổ giấy."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: chữ số kích thước luôn là kích thước thật. d) Đúng: chọn tỉ lệ để hình biểu diễn vừa vặn, cân đối trong khổ giấy.","points":1},{"type":"short","level":"VDC","q":"Dãy cỡ chữ tiêu chuẩn trên bản vẽ gồm các cỡ: 2,5 – 3,5 – 5 – 7 – 10 – 14 – 20. Hỏi cỡ chữ lớn nhất trong dãy là bao nhiêu milimét?","answer":"20","explain":"Cỡ chữ lớn nhất trong dãy tiêu chuẩn là 20 mm.","points":0.5},{"type":"short","level":"VDC","q":"Nêu tên gọi của tỉ lệ mà kích thước trên bản vẽ bằng kích thước thật của vật thể.","answer":"Tỉ lệ nguyên hình","explain":"Tỉ lệ 1 : 1 được gọi là tỉ lệ nguyên hình.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Trên bản vẽ kỹ thuật, chữ số kích thước cho biết","options":["A. kích thước thật của vật thể","B. kích thước đo được trên giấy","C. tỉ lệ của bản vẽ","D. cỡ chữ dùng trên bản vẽ"],"answer":"A","explain":"Chữ số kích thước cho biết kích thước thật của vật thể, không phụ thuộc tỉ lệ vẽ.","points":0.25},{"type":"mcq","level":"NB","q":"Đường tâm của chi tiết đối xứng được vẽ bằng","options":["A. nét chấm gạch mảnh","B. nét liền đậm","C. nét đứt mảnh","D. nét lượn sóng"],"answer":"A","explain":"Đường tâm, trục đối xứng vẽ bằng nét chấm gạch mảnh.","points":0.25},{"type":"mcq","level":"NB","q":"Khổ giấy A0 có kích thước","options":["A. 841 × 1189 mm","B. 594 × 841 mm","C. 420 × 594 mm","D. 1189 × 1682 mm"],"answer":"A","explain":"Khổ A0 có kích thước 841 × 1189 mm, là khổ lớn nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Khi ghi kích thước bán kính, ký hiệu R được đặt ở đâu?","options":["A. Trước chữ số kích thước","B. Sau chữ số kích thước","C. Dưới chữ số kích thước","D. Trên đường gióng"],"answer":"A","explain":"Ký hiệu R ghi trước chữ số chỉ bán kính (ví dụ R10).","points":0.25},{"type":"mcq","level":"TH","q":"Ý nghĩa của việc quy định thống nhất các tiêu chuẩn trình bày bản vẽ là","options":["A. mọi người đọc hiểu bản vẽ thống nhất, tránh nhầm lẫn","B. làm cho bản vẽ đẹp hơn","C. giảm số lượng bản vẽ cần lập","D. tăng tốc độ vẽ"],"answer":"A","explain":"Tiêu chuẩn thống nhất giúp mọi người đọc hiểu bản vẽ giống nhau, tránh nhầm lẫn khi chế tạo.","points":0.25},{"type":"mcq","level":"VD","q":"Một kỹ sư muốn vẽ chi tiết dài 800 mm lên khổ A4 (chiều dài sử dụng khoảng 270 mm). Tỉ lệ nào sau đây phù hợp nhất?","options":["A. 1 : 4","B. 1 : 2","C. 2 : 1","D. 1 : 1"],"answer":"A","explain":"800 chia 4 = 200 mm vừa trong 270 mm. Tỉ lệ 1 : 2 cho đoạn 400 mm vượt quá khổ giấy.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nét đứt và nét chấm gạch:","statements":["a) Nét liền mảnh dùng để vẽ đường bao thấy.","b) Nét đứt mảnh dùng để vẽ cạnh khuất.","c) Nét chấm gạch mảnh dùng để vẽ trục đối xứng.","d) Nét lượn sóng dùng để vẽ đường giới hạn hình cắt."],"answer":["F","T","T","T"],"explain":"a) Sai: bao thấy vẽ bằng nét liền đậm. b) Đúng. c) Đúng. d) Đúng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về quy định ghi kích thước:","statements":["a) Bản vẽ tỉ lệ 1 : 1 có hình vẽ bằng vật thật.","b) Không được ghi trùng một kích thước ở hai hình biểu diễn.","c) Chữ số kích thước góc không cần ghi ký hiệu độ.","d) Đường gióng vẽ bằng nét liền mảnh."],"answer":["T","T","F","T"],"explain":"a) Đúng: tỉ lệ nguyên hình. b) Đúng. c) Sai: kích thước góc phải ghi ký hiệu độ. d) Đúng.","points":1},{"type":"short","level":"VDC","q":"Một bản vẽ mặt bằng nhà ghi tỉ lệ 1 : 100. Chiều rộng ngôi nhà trên bản vẽ đo được 90 mm. Hỏi chiều rộng thật của ngôi nhà là bao nhiêu mét?","answer":"9","explain":"Tỉ lệ 1 : 100 nên chiều rộng thật = 90 × 100 = 9000 mm = 9 m.","points":0.5},{"type":"short","level":"VDC","q":"Hai đầu đường kích thước được vẽ ký hiệu gì để chạm vào đường gióng?","answer":"Mũi tên","explain":"Đường kích thước có hai đầu là mũi tên chạm vào đường gióng.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Bản vẽ kỹ thuật được xây dựng dựa trên","options":["A. các tiêu chuẩn thống nhất của Nhà nước","B. ý thích của người vẽ","C. thói quen của từng công ty","D. yêu cầu của khách hàng"],"answer":"A","explain":"Bản vẽ kỹ thuật tuân theo các tiêu chuẩn thống nhất (TCVN) để mọi người đọc hiểu giống nhau.","points":0.25},{"type":"mcq","level":"NB","q":"Chữ số kích thước trên đường kích thước thẳng đứng được ghi ở","options":["A. bên trái đường kích thước","B. bên phải đường kích thước","C. đè lên đường kích thước","D. dưới mũi tên"],"answer":"A","explain":"Chữ số kích thước thẳng đứng ghi ở bên trái đường kích thước.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các tỉ lệ sau, tỉ lệ nào là tỉ lệ thu nhỏ?","options":["A. 1 : 5","B. 5 : 1","C. 1 : 1","D. 10 : 1"],"answer":"A","explain":"Tỉ lệ 1 : 5 là tỉ lệ thu nhỏ; 5 : 1 và 10 : 1 là phóng to; 1 : 1 là nguyên hình.","points":0.25},{"type":"mcq","level":"TH","q":"Khung tên của bản vẽ KHÔNG ghi thông tin nào sau đây?","options":["A. Giá tiền của sản phẩm","B. Tên gọi chi tiết","C. Vật liệu chế tạo","D. Tỉ lệ bản vẽ"],"answer":"A","explain":"Khung tên ghi tên chi tiết, vật liệu, tỉ lệ, người vẽ, ngày vẽ... không ghi giá tiền sản phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Đường gạch chéo biểu diễn vật liệu trên mặt cắt nghiêng một góc","options":["A. 45° so với đường bao","B. 90° so với đường bao","C. 30° so với đường bao","D. 75° so với đường bao"],"answer":"A","explain":"Đường gạch trên mặt cắt là nét liền mảnh, nghiêng 45° so với đường bao của mặt cắt.","points":0.25},{"type":"mcq","level":"VD","q":"Một học sinh ghi chữ số kích thước trên bản vẽ tỉ lệ 1 : 2 bằng cách lấy kích thước thật chia đôi rồi ghi. Cách làm này","options":["A. sai, vì chữ số kích thước phải ghi kích thước thật","B. đúng, vì tỉ lệ là 1 : 2","C. đúng nếu ghi thêm đơn vị mm","D. sai, vì phải nhân đôi kích thước thật"],"answer":"A","explain":"Dù vẽ theo tỉ lệ nào, chữ số kích thước luôn ghi kích thước thật của vật thể.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về TCVN và khổ giấy:","statements":["a) TCVN là hệ thống tiêu chuẩn Việt Nam về bản vẽ kỹ thuật.","b) Có 5 khổ giấy chính từ A0 đến A4.","c) Khổ A4 = 210 × 297 mm.","d) Chia đôi khổ A4 theo chiều dài được khổ A3."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: chia đôi A4 được khổ A5 (nhỏ hơn), không phải A3.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về nét vẽ và đường gióng:","statements":["a) Đường bao thấy vẽ bằng nét liền đậm.","b) Cạnh khuất vẽ bằng nét đứt mảnh.","c) Đường tâm vẽ bằng nét liền mảnh.","d) Đường gióng vẽ bằng nét chấm gạch."],"answer":["T","T","F","F"],"explain":"a) Đúng. b) Đúng. c) Sai: đường tâm vẽ bằng nét chấm gạch mảnh. d) Sai: đường gióng vẽ bằng nét liền mảnh.","points":1},{"type":"short","level":"VDC","q":"Một chi tiết máy có chiều dài thật 250 mm được vẽ theo tỉ lệ 5 : 1. Hỏi trên bản vẽ, đoạn thẳng biểu diễn chi tiết dài bao nhiêu milimét?","answer":"1250","explain":"Tỉ lệ 5 : 1 phóng to gấp 5 lần nên đoạn vẽ dài 250 × 5 = 1250 mm.","points":0.5},{"type":"short","level":"VDC","q":"Kể tên một thông tin bắt buộc phải có trong khung tên của bản vẽ kỹ thuật.","answer":"Tên gọi chi tiết","explain":"Khung tên bắt buộc ghi tên gọi chi tiết hoặc sản phẩm (ngoài ra còn vật liệu, tỉ lệ, người vẽ, ngày vẽ...).","points":0.5}]}]}</script>
