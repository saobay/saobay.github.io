"],"explain":"a) Đúng: hàm hợp b) Đúng: hàm hợp c) Đúng: hàm hợp d) Sai: thiếu chéo: $f'g + fg'$","points":1},{"type":"short","level":"NB","q":"Đạo hàm của $y = x^{5}$ là gì? (viết dạng $5x^{4}$)","answer":"$5x^{4}$","explain":"$(x^{5})' = 5x^{4}$.","points":0.5},{"type":"short","level":"TH","q":"Đạo hàm của $y = 1x^2 + 2x + 1$ là gì? (viết dạng $Ax + B$)","answer":"$2x + 2$","explain":"$y' = 2x + 2$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"$(\\sqrt{x})'$ ($x$ dương) bằng:","options":["A. $\\frac{1}{\\sqrt{x}}$","B. $\\frac{1}{2\\sqrt{x}}$","C. $-\\frac{1}{2\\sqrt{x}}$","D. $2\\sqrt{x}$"],"answer":"B","explain":"$(\\sqrt{x})' = \\frac{1}{2\\sqrt{x}}$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của $y = x^{8}$ là:","options":["A. $8x^{8}$","B. $7x^{6}$","C. $8x^{7}$","D. $x^{7}$"],"answer":"C","explain":"$(x^{8})' = 8x^{7}$.","points":0.25},{"type":"mcq","level":"TH","q":"Đạo hàm của $y = -1x^2 + 2x + 1$ là:","options":["A. $2x + 2$","B. $-2x + 2$","C. $-2x - 2$","D. $-2x + 3$"],"answer":"B","explain":"$y' = -2x + 2$.","points":0.25},{"type":"mcq","level":"TH","q":"Đạo hàm của $y = \\frac{2x + 1}{1x + 1}$ là:","options":["A. $\\frac{-1}{(1x + 1)^2}$","B. $\\frac{2}{(1x + 1)^2}$","C. $\\frac{1}{1x + 1}$","D. $\\frac{1}{(x + 1)^2}$"],"answer":"D","explain":"$y' = \\frac{2 \\cdot 1 - 1 \\cdot 1}{(1x+1)^2} = \\frac{1}{(x + 1)^2}$.","points":0.25},{"type":"mcq","level":"VD","q":"Đạo hàm của $y = e^{2x + 3}$ là:","options":["A. $-2e^{2x + 3}$","B. $2e^{2x + 3}$","C. $2x e^{2x + 3}$","D. $e^{2x + 3}$"],"answer":"B","explain":"$y' = 2e^{2x + 3}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Đạo hàm của $y = \\ln(3x + 2)$ là:","options":["A. $\\frac{3}{3x + 2}$","B. $\\frac{1}{3x + 2}$","C. $\\frac{3x}{3x + 2}$","D. $\\frac{-3}{3x + 2}$"],"answer":"A","explain":"$y' = \\frac{(3x + 2)'}{3x + 2} = \\frac{3}{3x + 2}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statement
