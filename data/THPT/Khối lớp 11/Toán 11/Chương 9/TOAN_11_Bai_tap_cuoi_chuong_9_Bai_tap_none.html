(t) = 2t$, $a(t) = 2$ (hằng số).","points":0.25},{"type":"mcq","level":"VD","q":"Đạo hàm cấp hai của $y = x^{3}$ là:","options":["A. $6x^{0}$","B. $3x^{2}$","C. $6x^{1}$","D. $6x^{3}$"],"answer":"C","explain":"$y' = 3x^{2}$, $y'' = 6x^{1}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $y = e^{2x + 1}$. Đạo hàm cấp hai $y''$ bằng:","options":["A. $x e^{2x + 1}$","B. $5e^{2x + 1}$","C. $4e^{2x + 1}$","D. $2e^{2x + 1}$"],"answer":"C","explain":"$y' = 2e^{2x+1}$, $y'' = 4e^{2x+1}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $(e^x)'' = e^x$.","b) Đạo hàm cấp $n$ được định nghĩa truy hồi từ đạo hàm cấp $n-1$.","c) Đạo hàm cấp hai của hàm hằng bằng hằng số đó.","d) Nếu $s = s(t)$ thì gia tốc $a(t) = s''(t)$."],"answer":["T","T","F","T"],"explain":"a) Đúng: tính toán b) Đúng: định nghĩa c) Sai: bằng $0$ d) Đúng: ý nghĩa vật lí","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $(\\tan x)'' = \\frac{2\\sin x}{\\cos^3 x}$.","b) Cho $y = x^4$ thì $y'' = 12x^2$.","c) Đạo hàm cấp hai của $y = (2x+1)^2$ là $8$.","d) $[(x^2+1)' ]' = 2$."],"answer":["T","T","T","T"],"explain":"a) Đúng: đạo hàm của $\\frac{1}{\\cos^2 x}$ b) Đúng: tính toán c) Đúng: $y' = 4(2x+1)$, $y'' = 8$ d) Đúng: tính toán","points":1},{"type":"short","level":"NB","q":"Đạo hàm cấp hai là đạo hàm của cái gì?","answer":"đạo hàm cấp một","explain":"Định nghĩa.","points":0.5},{"type":"short","level":"TH","q":"Cho $y = 2x^2 + x$. $y''$ bằng bao nhiêu?","answer":"$4$","explain":"$y' = 4x + 1$, $y'' = 4$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Đạo hàm của $y = x^{2}$ là:","options":["A. $1x^{0}$","B. $2x^{2}$","C. $x^{1}$","D. $2x^{1}$"],"answer":"D","explain":"$(x^{2})' = 2x^{1}$.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo hàm của $y = 3x$ là:","options":["A. $3$","B. $2$","C. $1$","D. $4$"],"answer":"A","explain":"$(3x)' = 3$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $f(x) = 2x^2 + 1x + 1$. Giá trị $f''(2)$ bằng:","options":["A. $3$","B. $6$","C. $8$","D. $4$"],"answer":"D","explain":"$f'(x) = 4x + 1$, $f''(x) = 4$ (hằng số).","points":0.25},{"type":"mcq","level":"TH","q":"Một chất điểm chuyển động với $s(t) = 2t^3$. Gia tốc tại $t = 1$ bằng:","options":["A. $13$ m/s$^2$","B. $7$ m/s$^2$","C. $18$ m/s$^2$","D. $12$ m/s$^2$"],"answer":"D","explain":"$v(t) = 6t^2$, $a(t) = 12t$; tại $t = 1$: $12$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $y = \\sin(2x)$. Đạo hàm cấp hai $y''$ bằng:","options":["A. $-4\\sin(2x)$","B. $-2\\cos(2x)$","C. $4\\sin(2x)$","D. $2\\cos(2x)$"],"answer":"A","explain":"$y' = 2\\cos(2x)$, $y'' = -4\\sin(2x)$.","points":0.25},{"type":"mcq","level":"VDC","q":"Một chất điểm chuyển động với $s(t) = t^3 - 3t^2 + 14t$. Tại thời điểm gia tốc triệt tiêu, vận tốc bằng bao nhiêu? (m/s)","options":["A. $11$","B. $15$","C. $13$","D. $9$"],"answer":"A","explain":"$v(t) = 3t^2 - 6t + 14$, $a(t) = 6t - 6 = 0 \\iff t = 1$; $v(1) = 3 - 6 + 14 = 11$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàm số có đạo hàm tại $x_0$ thì liên tục tại $x_0$.","b) Hàm số liên tục tại $x_0$ thì có đạo hàm tại $x_0$.","c) $f'(x_0)$ là hệ số góc của tiếp tuyến tại $(x_0; f(x_0))$.","d) Nếu $s = s(t)$ là quãng đường thì $v(t) = s'(t)$."],"answer":["T","F","T","T"],"explain":"a) Đúng: định lí b) Sai: ví dụ $y = |x|$ tại $0$ c) Đúng: ý nghĩa hình học d) Đúng: ý nghĩa vật lí","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $f'(2) = 5$ có nghĩa là tiếp tuyến tại $x = 2$ có hệ số góc bằng $5$.","b) Gia tốc tức thời $a(t) = v'(t) = s''(t)$.","c) $\\frac{d}{dx}(5) = 5$.","d) Hàm số $f(x) = x^2$ khi $x$ không âm, $f(x) = -x$ khi $x$ âm không có đạo hàm tại $0$."],"answer":["T","T","F","T"],"explain":"a) Đúng: ý nghĩa hình học b) Đúng: đạo hàm cấp hai c) Sai: bằng $0$ d) Đúng: đạo hàm hai phía khác nhau","points":1},{"type":"short","level":"NB","q":"$(x^{3})''$ bằng gì? (viết dạng $6x^{1}$)","answer":"$6x^{1}$","explain":"$= 6x^{1}$.","points":0.5},{"type":"short","level":"TH","q":"$s(t) = 2t^2$. Gia tốc tại $t = 2$ bằng bao nhiêu? (m/s$^2$)","answer":"$4$","explain":"$a(t) = s''(t) = 4$ (hằng số).","points":0.5}]}]}
