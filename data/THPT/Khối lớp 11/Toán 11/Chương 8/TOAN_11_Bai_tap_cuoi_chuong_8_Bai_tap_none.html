{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Hai biến cố $A, B$ được gọi là xung khắc nếu:","options":["A. $A = B$","B. $A \\subset B$","C. $A \\cup B = \\Omega$","D. $A \\cap B = \\varnothing$"],"answer":"D","explain":"Định nghĩa hai biến cố xung khắc.","points":0.25},{"type":"mcq","level":"NB","q":"Gieo hai con xúc xắc. $A$ là “con thứ nhất ra mặt 6”, $B$ là “con thứ hai ra mặt 6”. $A$ và $B$ là hai biến cố:","options":["A. đối nhau","B. xung khắc","C. phụ thuộc","D. độc lập"],"answer":"D","explain":"Kết quả gieo con này không ảnh hưởng con kia.","points":0.25},{"type":"mcq","level":"TH","q":"Tung đồng xu 3 lần. $A$ là “có đúng 2 lần sấp”. Số phần tử của $A$ là:","options":["A. $3$","B. $8$","C. $4$","D. $2$"],"answer":"A","explain":"$A = \\{SSN, SNS, NSS\\}$: $3$ phần tử.","points":0.25},{"type":"mcq","level":"TH","q":"Hai biến cố đối nhau thì:","options":["A. chắc chắn cùng xảy ra","B. xung khắc","C. bằng nhau","D. độc lập"],"answer":"B","explain":"Đối nhau suy ra xung khắc.","points":0.25},{"type":"mcq","level":"VD","q":"Gieo một con xúc xắc. $A$ là “mặt chẵn”, $B$ là “mặt lớn hơn 3”. $P(A \\cap B)$ bằng:","options":["A. $\\frac{2}{3}$","B. $\\frac{1}{2}$","C. $\\frac{1}{6}$","D. $\\frac{1}{3}$"],"answer":"D","explain":"$A \\cap B = \\{4; 6\\}$ nên $P = \\frac{2}{6} = \\frac{1}{3}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Một đề thi có 2 câu độc lập, xác suất làm đúng mỗi câu là $0{,}6$. Xác suất làm đúng cả 2 câu là:","options":["A. $0{,}36$","B. $0{,}48$","C. $1{,}2$","D. $0{,}6$"],"answer":"A","explain":"$0{,}6 \\cdot 0{,}6 = 0{,}36$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hai biến cố độc lập là hai biến cố xung khắc.","b) Biến cố không thể $\\varnothing$ có xác suất bằng $0$.","c) Biến cố giao $A \\cap B$ xảy ra khi $A$ và $B$ cùng xảy ra.","d) Nếu $A, B$ xung khắc thì $P(A \\cup B) = P(A) + P(B)$."],"answer":["F","T","T","T"],"explain":"a) Sai: hai khái niệm khác nhau b) Đúng: định nghĩa c) Đúng: định nghĩa d) Đúng: công thức cộng","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Biến cố hợp của hai biến cố xung khắc có xác suất bằng tổng xác suất.","b) Nếu $P(A) = 0{,}3$, $P(B) = 0{,}4$, $A, B$ xung khắc thì $P(A \\cup B) = 0{,}7$.","c) Tung đồng xu 2 lần, biến cố “2 sấp” và “2 ngửa” xung khắc.","d) Chọn 1 học sinh, biến cố “giỏi Toán” và “giỏi Văn” xung khắc."],"answer":["T","T","T","F"],"explain":"a) Đúng: công thức cộng b) Đúng: công thức cộng c) Đúng: không thể cùng xảy ra d) Sai: có thể giỏi cả hai","points":1},{"type":"short","level":"NB","q":"Biến cố $A \\cup B$ xảy ra khi nào?","answer":"$A$ hoặc $B$ xảy ra","explain":"Định nghĩa biến cố hợp.","points":0.5},{"type":"short","level":"TH","q":"Tung đồng xu 2 lần. $P(2 sấp) + P(2 ngửa)$ bằng bao nhiêu?","answer":"$\\frac{1}{2}$","explain":"$\\frac{1}{4} + \\frac{1}{4}$.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Cho hai biến cố $A, B$ với $P(A) = $0{,}4$$, $P(B) = $0{,}2$$, $P(AB) = $0{,}1$$. $P(A \\cup B)$ bằng:","options":["A. $0{,}6$","B. $\\frac{1}{3}$","C. $0{,}5$","D. $0{,}1$"],"answer":"C","explain":"$P(A \\cup B) = P(A) + P(B) - P(AB) = 0{,}4 + 0{,}2 - 0{,}1 = 0{,}5$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $P(A) = $0{,}7$$, $P(B) = $0{,}4$$, $P(A \\cup B) = $0{,}8$$. $P(AB)$ bằng:","options":["A. $0{,}3$","B. $\\frac{1}{6}$","C. $0{,}1$","D. $\\frac{23}{60}$"],"answer":"A","explain":"$P(AB) = P(A) + P(B) - P(A \\cup B) = 0{,}7 + 0{,}4 - 0{,}8 = 0{,}3$.","points":0.25},{"type":"mcq","level":"TH","q":"Một hộp có 11 bi đỏ và 19 bi xanh. Lấy ngẫu nhiên 1 bi. Gọi $A$ là “bi đỏ”, $B$ là “bi xanh”. $P(A \\cup B)$ bằng:","options":["A. $1$","B. $\\frac{19}{30}$","C. $\\frac{11}{30}$","D. $0{,}5$"],"answer":"A","explain":"$A, B$ xung khắc và phủ hết hộp nên $P(A \\cup B) = \\frac{11}{30} + \\frac{19}{30} = 1$.","points":0.25},{"type":"mcq","level":"TH","q":"Lớp có 45 học sinh, trong đó có 10 học sinh giỏi Toán. Chọn ngẫu nhiên 1 học sinh. Gọi $A$ là “giỏi Toán”, $B$ là “không giỏi Toán”. $P(A \\cup B)$ bằng:","options":["A. $0{,}5$","B. $1$","C. $\\frac{7}{9}$","D. $\\frac{2}{9}$"],"answer":"B","explain":"$B = \\bar{A}$ nên $P(A \\cup B) = 1$.","points":0.25},{"type":"mcq","level":"VD","q":"Một hộp có 6 bi đỏ, 9 bi xanh và 0 bi vàng. Lấy ngẫu nhiên 1 bi. $P$(“bi đỏ hoặc bi xanh”) bằng:","options":["A. $0{,}4$","B. $0{,}6$","C. $1$","D. $0{,}5$"],"answer":"C","explain":"Hai biến cố xung khắc: $P = \\frac{6}{15} + \\frac{9}{15} = 1$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $A, B$ độc lập với $P(A) = $\\frac{1}{3}$$, $P(B) = $0{,}25$$. $P$(“đúng một trong hai biến cố xảy ra”) bằng:","options":["A. $\\frac{1}{12}$","B. $\\frac{5}{12}$","C. $\\frac{7}{12}$","D. $0{,}5$"],"answer":"B","explain":"$P = P(A\\bar{B}) + P(\\bar{A}B) = \\frac{1}{3}(1-0{,}25) + (1-\\frac{1}{3})0{,}25 = \\frac{5}{12}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho $P(A) = \\frac{1}{2}$, $P(B) = \\frac{1}{3}$, $P(AB) = \\frac{1}{6}$ thì $P(A \\cup B) = \\frac{2}{3}$.","b) Nếu $A, B$ xung khắc thì $P(A \\cup B) = P(A) + P(B)$.","c) $P(A \\cup B)$ luôn lớn hơn hoặc bằng $P(A)$.","d) Cho $A, B$ xung khắc, $P(A) = 0{,}2$ thì $P(\\bar{A} \\cup B) = 0{,}8 + P(B)$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $\\frac{1}{2}+\\frac{1}{3}-\\frac{1}{6}=\\frac{2}{3}$ b) Đúng: trường hợp riêng c) Đúng: tính đơn điệu d) Sai: $B \\subset \\bar{A}$ (vì xung khắc) nên $\\bar{A} \\cup B = \\bar{A}$, $P = 0{,}8$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho $P(A) = P(B) = \\frac{1}{2}$, $A, B$ xung khắc thì $P(A \\cup B) = 1$ và $A, B$ đối nhau.","b) $P$(“cả hai đều không xảy ra”) $= 1 - P(A \\cup B)$.","c) Cho $A, B$ độc lập, $P(A) = \\frac{1}{2}$, $P(B) = \\frac{1}{3}$ thì $P(A \\cup B) = \\frac{2}{3}$.","d) $P(A \\setminus B) = P(A) - P(AB)$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $P(A \\cup B) = \\frac{1}{2} + \\frac{1}{2} = 1$ và $A \\cap B = \\varnothing$ nên $B = \\bar{A}$ b) Đúng: biến cố đối c) Đúng: $\\frac{1}{2}+\\frac{1}{3}-\\frac{1}{6}=\\frac{2}{3}$ d) Đúng: hiệu hai biến cố","points":1},{"type":"short","level":"NB","q":"Cho $P(A) = $0{,}6$$, $P(B) = $0{,}4$$, $P(AB) = $0{,}2$$. Tính $P(A \\cup B)$. (viết phân số a/b)","answer":"$4/5$","explain":"$P(A \\cup B) = 0{,}6 + 0{,}4 - 0{,}2 = 0{,}8$.","points":0.5},{"type":"short","level":"TH","q":"Cho $A, B$ xung khắc với $P(A) = $\\frac{1}{6}$$, $P(B) = $0{,}5$$. Tính $P(A \\cup B)$. (viết phân số a/b)","answer":"$2/3$","explain":"$P(A \\cup B) = \\frac{1}{6} + 0{,}5 = \\frac{2}{3}$.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Cho hai biến cố xung khắc $A, B$ với $P(A) = $0{,}25$$, $P(B) = $0{,}2$$. $P(A \\cup B)$ bằng:","options":["A. $0{,}55$","B. $0{,}35$","C. $0{,}05$","D. $0{,}45$"],"answer":"D","explain":"Xung khắc nên $P(A \\cup B) = P(A) + P(B) = 0{,}25 + 0{,}2 = 0{,}45$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho biến cố $A$ với $P(A) = $\\frac{3}{7}$$. $P(\\bar{A})$ bằng:","options":["A. $0{,}5$","B. $\\frac{3}{7}$","C. $\\frac{10}{7}$","D. $\\frac{4}{7}$"],"answer":"D","explain":"$P(\\bar{A}) = 1 - P(A) = 1 - \\frac{3}{7} = \\frac{4}{7}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $P(A) = $0{,}5$$, $P(B) = $0{,}25$$, $P(AB) = $0{,}25$$. $P(A \\cup B)$ bằng:","options":["A. $0{,}75$","B. $\\frac{5}{8}$","C. $0{,}25$","D. $0{,}5$"],"answer":"D","explain":"$P(A \\cup B) = 0{,}5 + 0{,}25 - 0{,}25 = 0{,}5$.","points":0.25},{"type":"mcq","level":"TH","q":"Gieo một con xúc xắc. Gọi $A$ là biến cố ra mặt có xác suất $\\frac{5}{12}$, $B$ là biến cố xung khắc với $A$ có xác suất $0{,}25$. $P(A \\cup B)$ bằng:","options":["A. $\\frac{5}{48}$","B. $\\frac{2}{3}$","C. $\\frac{5}{12}$","D. $0{,}75$"],"answer":"B","explain":"Xung khắc: $P(A \\cup B) = \\frac{5}{12} + 0{,}25 = \\frac{2}{3}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $A, B$ độc lập với $P(A) = $0{,}25$$, $P(A \\cup B) = $\\frac{5}{8}$$. $P(B)$ bằng bao nhiêu?","options":["A. $\\frac{2}{3}$","B. $\\frac{1}{8}$","C. $0{,}5$","D. $\\frac{7}{12}$"],"answer":"C","explain":"Đặt $x = P(B)$: $\\frac{5}{8}$ = $0{,}25$ + x - $0{,}25$x, suy ra $x = $0{,}5$$.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai xạ thủ bắn độc lập, mỗi người trúng với xác suất $0{,}5$. Xác suất có ít nhất một người trúng là:","options":["A. $0{,}5$","B. $0{,}75$","C. $1$","D. $0{,}25$"],"answer":"B","explain":"$P = 1 - P$(cả hai trượt)$ = 1 - (1-0{,}5)^2 = 0{,}75$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Rút 2 lá bài có hoàn lại, hai lần rút độc lập.","b) Gieo 2 xúc xắc, kết quả 2 con độc lập.","c) Nếu $P(AB) = P(A) \\cdot P(B)$ thì $A, B$ độc lập.","d) Nếu $A, B$ độc lập thì $\\bar{A}, B$ cũng độc lập."],"answer":["T","T","T","T"],"explain":"a) Đúng: có hoàn lại b) Đúng: tính chất c) Đúng: định nghĩa d) Đúng: tính chất","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hai biến cố có xác suất bằng $0$ thì độc lập với mọi biến cố.","b) Công thức nhân mở rộng: $P(ABC) = P(A)P(B)P(C)$ khi độc lập từng đôi một và độc lập toàn phần.","c) Cho $A, B$ độc lập, $P(A) = a$ thì $P(\\bar{A}}|B) = 1 - a$.","d) Nếu $A, B$ độc lập thì $\\bar{A}, \\bar{B}$ độc lập."],"answer":["T","T","T","T"],"explain":"a) Đúng: $P(AB) = 0 = 0 \\cdot P(B)$ b) Đúng: định nghĩa độc lập của 3 biến cố c) Đúng: độc lập d) Đúng: tính chất","points":1},{"type":"short","level":"NB","q":"Cho $P(A) = $\\frac{1}{6}$$. Tính $P(\\bar{A})$. (viết phân số a/b)","answer":"$5/6$","explain":"$P(\\bar{A}) = 1 - \\frac{1}{6} = \\frac{5}{6}$.","points":0.5},{"type":"short","level":"TH","q":"Hai xạ thủ bắn độc lập, mỗi người trúng với xác suất $0{,}5$. Tính xác suất có ít nhất một người trúng. (viết phân số a/b)","answer":"$3/4$","explain":"$1 - (1 - 0{,}5)^2 = 0{,}75$.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Cho $A, B$ độc lập với $P(A) = $0{,}25$$, $P(B) = $0{,}2$$. $P(AB)$ bằng:","options":["A. $0{,}25$","B. $0{,}05$","C. $0{,}45$","D. $\\frac{2}{15}$"],"answer":"B","explain":"$P(AB) = P(A) \\cdot P(B) = 0{,}25 \\cdot 0{,}2 = 0{,}05$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $P(A) = $0{,}5$$, $P(B) = $\\frac{1}{3}$$, $P(AB) = $\\frac{1}{3}$$. $A$ và $B$ có độc lập không?","options":["A. Có","B. Không","C. Không xác định được","D. Xung khắc"],"answer":"B","explain":"$P(A) \\cdot P(B) = \\frac{1}{6}$ khác $P(AB) = \\frac{1}{3}$ nên không độc lập.","points":0.25},{"type":"mcq","level":"TH","q":"Một phép thử được lặp lại 2 lần độc lập, mỗi lần biến cố $A$ xảy ra với xác suất $\\frac{2}{3}$. Xác suất cả 2 lần $A$ đều xảy ra là:","options":["A. $\\frac{4}{9}$","B. $\\frac{2}{3}$","C. $\\frac{8}{9}$","D. $\\frac{41}{72}$"],"answer":"A","explain":"Hai lần độc lập: $P = \\frac{2}{3} \\cdot \\frac{2}{3} = \\frac{4}{9}$.","points":0.25},{"type":"mcq","level":"TH","q":"Một xạ thủ bắn 1 phát trúng với xác suất $0{,}7$. Bắn 2 phát độc lập. Xác suất cả 2 phát đều trượt là:","options":["A. $0{,}09$","B. $0{,}49$","C. $0{,}6$","D. $0{,}19$"],"answer":"A","explain":"$P$(trượt 1 phát)$ = 1 - 0{,}7 = 0{,}3$; $P$(cả 2 trượt)$ = 0{,}3^2 = 0{,}09$.","points":0.25},{"type":"mcq","level":"VD","q":"Hai bạn An, Bình làm bài độc lập, xác suất làm đúng của mỗi bạn là $0{,}4$. Xác suất có ít nhất một bạn làm đúng là:","options":["A. $0{,}16$","B. $\\frac{217}{300}$","C. $0{,}64$","D. $0{,}4$"],"answer":"C","explain":"$1 - (1 - 0{,}4)^2 = 0{,}64$.","points":0.25},{"type":"mcq","level":"VDC","q":"Một xạ thủ bắn 3 phát độc lập, mỗi phát trúng với xác suất $0{,}5$. Xác suất có ít nhất 2 phát trúng là:","options":["A. $0{,}75$","B. $\\frac{7}{12}$","C. $0{,}5$","D. $0{,}25$"],"answer":"C","explain":"$P = C_3^2 0{,}5^2(1-0{,}5) + 0{,}5^3 = 0{,}5$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xác suất của một biến cố luôn thuộc $[0; 1]$.","b) Biến cố không thể $\\varnothing$ có xác suất bằng $0$.","c) Biến cố chắc chắn $\\Omega$ có xác suất bằng $1$.","d) Hai biến cố độc lập là hai biến cố xung khắc."],"answer":["T","T","T","F"],"explain":"a) Đúng: định nghĩa b) Đúng: định nghĩa c) Đúng: định nghĩa d) Sai: hai khái niệm khác nhau","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $P(A) = 0{,}5$, $P(B) = 0{,}5$, $A, B$ độc lập thì $P(AB) = 0{,}25$.","b) Nếu $A \\subset B$ thì $P(A)$ nhỏ hơn hoặc bằng $P(B)$.","c) Tung đồng xu 2 lần, biến cố “2 sấp” và “2 ngửa” xung khắc.","d) Gieo xúc xắc, biến cố “mặt chẵn” và “mặt lẻ” đối nhau."],"answer":["T","T","T","T"],"explain":"a) Đúng: công thức nhân b) Đúng: tính đơn điệu c) Đúng: không thể cùng xảy ra d) Đúng: phủ nhau và xung khắc","points":1},{"type":"short","level":"NB","q":"Cho $A, B$ độc lập với $P(A) = $0{,}25$$, $P(B) = $0{,}2$$. Tính $P(AB)$. (viết phân số a/b)","answer":"$1/20$","explain":"$P(AB) = 0{,}25 \\cdot 0{,}2 = 0{,}05$.","points":0.5},{"type":"short","level":"TH","q":"Cho $A, B$ độc lập với $P(A) = $0{,}2$$, $P(B) = $0{,}25$$. Tính $P(A\\bar{B})$. (viết phân số a/b)","answer":"$3/20$","explain":"$P(A\\bar{B}) = 0{,}2 \\cdot (1 - 0{,}25) = 0{,}15$.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Cho $A, B$ độc lập với $P(AB) = $\\frac{1}{12}$$, $P(B) = $0{,}25$$. $P(A)$ bằng:","options":["A. $\\frac{1}{3}$","B. $\\frac{1}{12}$","C. $0{,}5$","D. $0{,}25$"],"answer":"A","explain":"$P(A) = \\frac{P(AB)}{P(B)} = \\frac{\\frac{1}{12}}{0{,}25} = \\frac{1}{3}$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $A, B$ độc lập với $P(A) = $\\frac{1}{3}$$. $P(\\bar{A})$ bằng:","options":["A. $\\frac{2}{3}$","B. $0{,}5$","C. $\\frac{1}{3}$","D. $\\frac{2}{9}$"],"answer":"A","explain":"$P(\\bar{A}) = 1 - \\frac{1}{3} = \\frac{2}{3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Một hộp có bi đỏ và bi xanh. Lấy lần lượt 2 bi có hoàn lại. Xác suất lần 1 đỏ là $\\frac{4}{7}$, lần 2 xanh là $\\frac{3}{7}$. Xác suất “lần 1 đỏ và lần 2 xanh” là:","options":["A. $\\frac{4}{7}$","B. $1$","C. $\\frac{169}{490}$","D. $\\frac{12}{49}$"],"answer":"D","explain":"Độc lập (có hoàn lại): $P = \\frac{4}{7} \\cdot \\frac{3}{7} = \\frac{12}{49}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $A, B$ độc lập với $P(A) = $\\frac{5}{8}$$, $P(B) = $\\frac{1}{3}$$. $P(A\\bar{B})$ bằng:","options":["A. $\\frac{5}{24}$","B. $\\frac{5}{12}$","C. $\\frac{3}{8}$","D. $\\frac{31}{60}$"],"answer":"B","explain":"$P(A\\bar{B}) = P(A) \\cdot P(\\bar{B}) = \\frac{5}{8} \\cdot \\frac{2}{3} = \\frac{5}{12}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $A, B$ độc lập với $P(A) = $0{,}5$$, $P(B) = $\\frac{1}{3}$$. $P$(“$A, B$ cùng xảy ra hoặc cùng không xảy ra”) bằng:","options":["A. $0{,}5$","B. $\\frac{2}{3}$","C. $0{,}6$","D. $\\frac{1}{6}$"],"answer":"A","explain":"$P(AB) + P(\\bar{A}\\bar{B}) = \\frac{1}{6} + \\frac{1}{3} = 0{,}5$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $A, B$ độc lập có cùng xác suất $x$. Biết $P(A \\cup B) = $\\frac{7}{16}$$. Giá trị của $x$ là:","options":["A. $\\frac{1}{8}$","B. $\\frac{7}{12}$","C. $0{,}25$","D. $1{,}75$"],"answer":"C","explain":"$P(A \\cup B) = 2x - x^2 = \\frac{7}{16}$, giải $x^2 - 2x + \\frac{7}{16} = 0$ được $x = 0{,}25$ (nghiệm còn lại lớn hơn $1$, loại).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $P(A \\cup B)$ luôn lớn hơn hoặc bằng $P(A)$.","b) Cho $A, B$ xung khắc, $P(A) = 0{,}2$ thì $P(\\bar{A} \\cup B) = 0{,}8 + P(B)$.","c) Biến cố đối của $A \\cup B$ là $\\bar{A} \\cap \\bar{B}$.","d) Cho $P(A) = \\frac{1}{2}$, $P(B) = \\frac{1}{3}$, $P(AB) = \\frac{1}{6}$ thì $P(A \\cup B) = \\frac{2}{3}$."],"answer":["T","F","T","T"],"explain":"a) Đúng: tính đơn điệu b) Sai: $B \\subset \\bar{A}$ (vì xung khắc) nên $\\bar{A} \\cup B = \\bar{A}$, $P = 0{,}8$ c) Đúng: quy tắc De Morgan d) Đúng: $\\frac{1}{2}+\\frac{1}{3}-\\frac{1}{6}=\\frac{2}{3}$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $P(A \\cup B) = P(A)$ thì $B \\subset A$ về mặt xác suất ($P(B \\setminus A) = 0$).","b) $P$(“cả hai đều không xảy ra”) $= 1 - P(A \\cup B)$.","c) Cho $A, B$ độc lập, $P(A) = \\frac{1}{2}$, $P(B) = \\frac{1}{3}$ thì $P(A \\cup B) = \\frac{2}{3}$.","d) $P(A \\setminus B) = P(A) - P(AB)$."],"answer":["T","T","T","T"],"explain":"a) Đúng: suy luận b) Đúng: biến cố đối c) Đúng: $\\frac{1}{2}+\\frac{1}{3}-\\frac{1}{6}=\\frac{2}{3}$ d) Đúng: hiệu hai biến cố","points":1},{"type":"short","level":"NB","q":"Một đồng xu cân đối được tung 2 lần. Tính xác suất cả 2 lần đều sấp. (mở rộng: biến cố lặp lại 2 lần độc lập, mỗi lần xác suất $0{,}75$) (viết phân số a/b)","answer":"$9/16$","explain":"$0{,}75^2 = \\frac{9}{16}$.","points":0.5},{"type":"short","level":"TH","q":"Hai xạ thủ bắn độc lập, mỗi người trúng với xác suất $\\frac{5}{6}$. Tính xác suất có ít nhất một người trúng. (viết phân số a/b)","answer":"$35/36$","explain":"$1 - (1 - \\frac{5}{6})^2 = \\frac{35}{36}$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Kí hiệu biến cố giao của $A$ và $B$ là:","options":["A. $A \\cap B$ (hay $AB$)","B. $A \\cup B$","C. $A \\setminus B$","D. $A + B$"],"answer":"A","explain":"Kí hiệu.","points":0.25},{"type":"mcq","level":"NB","q":"Rút một lá bài từ bộ 52 lá. $A$ là “lá cơ”, $B$ là “lá át”. Biến cố $A \\cap B$ là:","options":["A. rút được lá không phải cơ","B. rút được lá cơ hoặc lá át","C. rút được lá át cơ","D. không thể xảy ra"],"answer":"C","explain":"$A \\cap B$ là lá vừa cơ vừa át.","points":0.25},{"type":"mcq","level":"TH","q":"Chọn ngẫu nhiên một số tự nhiên từ 1 đến 10. $A$ là “số chẵn”, $B$ là “số chia hết cho el":"TH","q":"Một phép thử được lặp lại 2 lần độc lập, mỗi lần biến cố $A$ xảy ra với xác suất $0{,}75$. Xác suất cả 2 lần $A$ đều xảy ra là:","options":["A. $\\frac{9}{16}$","B. $\\frac{15}{16}$","C. $0{,}75$","D. $\\frac{11}{16}$"],"answer":"A","explain":"Hai lần độc lập: $P = 0{,}75 \\cdot 0{,}75 = \\frac{9}{16}$.","points":0.25},{"type":"mcq","level":"TH","q":"Một xạ thủ bắn 1 phát trúng với xác suất $0{,}75$. Bắn 2 phát độc lập. Xác suất cả 2 phát đều trượt là:","options":["A. $\\frac{1}{16}$","B. $0{,}5$","C. $\\frac{9}{16}$","D. $\\frac{13}{80}$"],"answer":"A","explain":"$P$(trượt 1 phát)$ = 1 - 0{,}75 = 0{,}25$; $P$(cả 2 trượt)$ = 0{,}25^2 = \\frac{1}{16}$.","points":0.25},{"type":"mcq","level":"VD","q":"Hai bạn An, Bình làm bài độc lập, xác suất làm đúng của mỗi bạn là $\\frac{1}{3}$. Xác suất có ít nhất một bạn làm đúng là:","options":["A. $\\frac{1}{9}$","B. $\\frac{5}{9}$","C. $\\frac{1}{3}$","D. $\\frac{23}{36}$"],"answer":"B","explain":"$1 - (1 - \\frac{1}{3})^2 = \\frac{5}{9}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Một xạ thủ bắn 3 phát độc lập, mỗi phát trúng với xác suất $0{,}25$. Xác suất có ít nhất 2 phát trúng là:","options":["A. $\\frac{3}{16}$","B. $\\frac{5}{32}$","C. $\\frac{1}{16}$","D. $\\frac{23}{96}$"],"answer":"B","explain":"$P = C_3^2 0{,}25^2(1-0{,}25) + 0{,}25^3 = \\frac{5}{32}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Gieo 2 xúc xắc, kết quả 2 con độc lập.","b) Nếu $P(AB) = P(A) \\cdot P(B)$ thì $A, B$ độc lập.","c) Nếu $A, B$ độc lập thì $P(A \\cup B) = P(A) + P(B)$.","d) Nếu $A, B$ độc lập thì $P(AB) = P(A) \\cdot P(B)$."],"answer":["T","T","F","T"],"explain":"a) Đúng: tính chất b) Đúng: định nghĩa c) Sai: thiếu trừ $P(AB)$ d) Đúng: công thức nhân","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Xạ thủ bắn 3 phát độc lập, xác suất trúng mỗi phát $\\frac{1}{2}$ thì $P$(trúng ít nhất 1) $= \\frac{7}{8}$.","b) Công thức nhân mở rộng: $P(ABC) = P(A)P(B)P(C)$ khi độc lập từng đôi một và độc lập toàn phần.","c) Ba biến cố đôi một độc lập thì độc lập từng đôi một.","d) Cho $A, B$ độc lập, $P(A\\bar{B}}) = P(A)(1-P(B))$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $1-(\\frac{1}{2})^3$ b) Đúng: định nghĩa độc lập của 3 biến cố c) Đúng: định nghĩa d) Đúng: công thức","points":1},{"type":"short","level":"NB","q":"Cho $A, B$ độc lập với $P(A) = $0{,}75$$, $P(B) = $\\frac{1}{3}$$. Tính $P(AB)$. (viết phân số a/b)","answer":"$1/4$","explain":"$P(AB) = 0{,}75 \\cdot \\frac{1}{3} = 0{,}25$.","points":0.5},{"type":"short","level":"TH","q":"Cho $A, B$ độc lập với $P(A) = $\\frac{2}{3}$$, $P(B) = $0{,}25$$. Tính $P(A\\bar{B})$. (viết phân số a/b)","answer":"$1/2$","explain":"$P(A\\bar{B}) = \\frac{2}{3} \\cdot (1 - 0{,}25) = 0{,}5$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cho $A, B$ độc lập với $P(AB) = $0{,}05$$, $P(B) = $0{,}25$$. $P(A)$ bằng:","options":["A. $0{,}2$","B. $0{,}05$","C. $\\frac{11}{30}$","D. $0{,}25$"],"answer":"A","explain":"$P(A) = \\frac{P(AB)}{P(B)} = \\frac{0{,}05}{0{,}25} = 0{,}2$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $A, B$ độc lập với $P(A) = $\\frac{2}{7}$$. $P(\\bar{A})$ bằng:","options":["A. $\\frac{10}{49}$","B. $0{,}5$","C. $\\frac{5}{7}$","D. $\\frac{2}{7}$"],"answer":"C","explain":"$P(\\bar{A}) = 1 - \\frac{2}{7} = \\frac{5}{7}$.","points":0.25},{"type":"mcq","level":"TH","q":"Một hộp có bi đỏ và bi xanh. Lấy lần lượt 2 bi có hoàn lại. Xác suất lần 1 đỏ là $0{,}7$, lần 2 xanh là $0{,}6$. Xác suất “lần 1 đỏ và lần 2 xanh” là:","options":["A. $0{,}7$","B. $0{,}52$","C. $1{,}3$","D. $0{,}42$"],"answer":"D","explain":"Độc lập (có hoàn lại): $P = 0{,}7 \\cdot 0{,}6 = 0{,}42$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $A, B$ độc lập với $P(A) = $0{,}5$$, $P(B) = $0{,}25$$. $P(A\\bar{B})$ bằng:","options":["A. $\\frac{19}{40}$","B. $\\frac{3}{8}$","C. $0{,}5$","D. $\\frac{1}{8}$"],"answer":"B","explain":"$P(A\\bar{B}) = P(A) \\cdot P(\\bar{B}) = 0{,}5 \\cdot 0{,}75 = \\frac{3}{8}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $A, B$ độc lập với $P(A) = $\\frac{2}{3}$$, $P(B) = $0{,}25$$. $P$(“$A, B$ cùng xảy ra hoặc cùng không xảy ra”) bằng:","options":["A. $\\frac{5}{12}$","B. $\\frac{31}{60}$","C. $\\frac{1}{6}$","D. $0{,}75$"],"answer":"A","explain":"$P(AB) + P(\\bar{A}\\bar{B}) = \\frac{1}{6} + 0{,}25 = \\frac{5}{12}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $A, B$ độc lập có cùng xác suất $x$. Biết $P(A \\cup B) = $0{,}75$$. Giá trị của $x$ là:","options":["A. $0{,}5$","B. $1{,}5$","C. $\\frac{5}{6}$","D. $0{,}25$"],"answer":"A","explain":"$P(A \\cup B) = 2x - x^2 = 0{,}75$, giải $x^2 - 2x + 0{,}75 = 0$ được $x = 0{,}5$ (nghiệm còn lại lớn hơn $1$, loại).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Biến cố giao $A \\cap B$ xảy ra khi $A$ và $B$ cùng xảy ra.","b) Hai biến cố xung khắc là hai biến cố không thể cùng xảy ra.","c) Hai biến cố độc lập là hai biến cố xung khắc.","d) Biến cố hợp $A \\cup B$ xảy ra khi $A$ hoặc $B$ xảy ra."],"answer":["T","T","F","T"],"explain":"a) Đúng: định nghĩa b) Đúng: định nghĩa c) Sai: hai khái niệm khác nhau d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $P(A \\cup B) = P(A) + P(B)$ thì $A, B$ xung khắc.","b) Gieo hai con xúc xắc, biến cố “con 1 ra 6” và “con 2 ra 6” độc lập.","c) Nếu $P(A) = 0{,}3$, $P(B) = 0{,}4$, $A, B$ xung khắc thì $P(A \\cup B) = 0{,}7$.","d) Gieo xúc xắc, biến cố “mặt chẵn” và “mặt lẻ” đối nhau."],"answer":["T","T","T","T"],"explain":"a) Đúng: suy từ công thức cộng tổng quát b) Đúng: hai lần gieo độc lập c) Đúng: công thức cộng d) Đúng: phủ nhau và xung khắc","points":1},{"type":"short","level":"NB","q":"Một đồng xu cân đối được tung 2 lần. Tính xác suất cả 2 lần đều sấp. (mở rộng: biến cố lặp lại 2 lần độc lập, mỗi lần xác suất $\\frac{2}{3}$) (viết phân số a/b)","answer":"$4/9$","explain":"$\\frac{2}{3}^2 = \\frac{4}{9}$.","points":0.5},{"type":"short","level":"TH","q":"Hai xạ thủ bắn độc lập, mỗi người trúng với xác suất $0{,}7$. Tính xác suất có ít nhất một người trúng. (viết phân số a/b)","answer":"$91/100$","explain":"$1 - (1 - 0{,}7)^2 = 0{,}91$.","points":0.5}]}]}
