{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Phép chiếu song song biến đường thẳng song song với phương chiếu thành:","options":["A. vô số điểm","B. một đoạn thẳng","C. một đường thẳng","D. một điểm"],"answer":"D","explain":"Mọi điểm trên đường thẳng đó có cùng ảnh (đường thẳng song song phương chiếu gặp $(P)$ tại một điểm).","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu song song của hai đường thẳng song song là:","options":["A. một điểm duy nhất","B. hai đường thẳng chéo nhau","C. hai đường thẳng cắt nhau","D. hai đường thẳng song song hoặc trùng nhau"],"answer":"D","explain":"Tính chất: ảnh của hai đường song song là hai đường song song hoặc trùng nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình hộp $ABCD.A'B'C'D'$. Hình chiếu song song của điểm $A$ lên $(A'B'C'D')$ theo phương $AA'$ là:","options":["A. $A'$","B. $A$","C. $B'$","D. tâm của $(A'B'C'D')$"],"answer":"A","explain":"Đường thẳng qua $A$ song song $AA'$ chính là $AA'$, cắt $(A'B'C'D')$ tại $A'$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong hình biểu diễn, nét vẽ nào dùng cho các đường bị che khuất?","options":["A. nét chấm gạch","B. nét liền đậm","C. nét đứt","D. không vẽ"],"answer":"C","explain":"Quy ước: đường không bị che khuất vẽ nét liền, đường bị che khuất vẽ nét đứt.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện $ABCD$, $G$ là trọng tâm tam giác $BCD$. Xét phép chiếu song song theo phương $AG$ lên $(BCD)$. Ảnh của $A$ là $G$; ảnh của đường thẳng $AB$ là đường thẳng:","options":["A. $GA$","B. $GB$","C. $GD$","D. $AB$"],"answer":"B","explain":"Ảnh của $A$ là $G$, ảnh của $B \\in (BCD)$ là $B$: ảnh của $AB$ là $GB$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Hình chiếu song song của $AB$ lên $(BCD)$ theo phương vuông góc với $(BCD)$ (phép chiếu vuông góc) là đoạn thẳng nối:","options":["A. $A$ với $B$","B. $C$ với $D$","C. hình chiếu của $A$ với $B$","D. trung điểm các cạnh"],"answer":"C","explain":"$B \\in (BCD)$ nên ảnh của $B$ là $B$; ảnh của $A$ là hình chiếu vuông góc của $A$ lên $(BCD)$ (trọng tâm tam giác $BCD$).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $M'$ là ảnh của $M$ thì đường thẳng $MM'$ song song với phương chiếu.","b) Ảnh của hình bình hành là hình bình hành.","c) Phép chiếu song song biến đường tròn thành đường tròn.","d) Ảnh của một tam giác (không suy biến) là một tam giác."],"answer":["T","T","F","T"],"explain":"a) Đúng: định nghĩa phép chiếu song song b) Đúng: bảo toàn tính song song của các cặp cạnh đối c) Sai: đường tròn chiếu xiên thành elip d) Đúng: bảo toàn tính thẳng hàng của ba đỉnh","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của tâm $O'$ của mặt trên là tâm $O$ của mặt dưới.","b) Ảnh của trung điểm của $A'B'$ là trung điểm của $AB$.","c) Ảnh của $B'$ là $B$.","d) Ảnh của $C'$ là $C$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $OO' \\parallel AA'$ b) Đúng: bảo toàn trung điểm c) Đúng: $BB' \\parallel AA'$ d) Đúng: $CC' \\parallel AA'$","points":1},{"type":"short","level":"NB","q":"Điểm $M$ thuộc mặt phẳng chiếu $(P)$. Ảnh của $M$ qua phép chiếu song song là gì?","answer":"chính $M$","explain":"Đường thẳng qua $M$ song song với phương chiếu cắt $(P)$ tại $M$.","points":0.5},{"type":"short","level":"TH","q":"Cho hình lăng trụ $ABC.A'B'C'$, xét phép chiếu theo phương $AA'$ lên $(A'B'C')$. Ảnh của tam giác $ABC$ là gì?","answer":"tam giác $A'B'C'$","explain":"Mỗi đỉnh $A, B, C$ chiếu thành $A', B', C'$.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Phép chiếu song song lên mặt phẳng $(P)$ theo phương $l$ biến mỗi điểm $M$ thành:","options":["A. hình chiếu vuông góc của $M$ lên $(P)$","B. giao điểm $M'$ của đường thẳng qua $M$ song song với $l$ và mặt phẳng $(P)$","C. điểm $M$ cố định trên $(P)$","D. điểm đối xứng của $M$ qua $(P)$"],"answer":"B","explain":"Định nghĩa: $M'$ là giao của đường thẳng qua $M$ song song với phương chiếu $l$ và mặt phẳng chiếu $(P)$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $A, B, C$ thẳng hàng theo thứ tự đó, $A', B', C'$ là hình chiếu song song. Khẳng định đúng:","options":["A. $A', B', C'$ không thẳng hàng","B. $A' \\equiv B' \\equiv C'$","C. $A', B', C'$ thẳng hàng theo thứ tự đó","D. $B'$ là trung điểm $A'C'$ luôn luôn"],"answer":"C","explain":"Phép chiếu song song bảo toàn tính thẳng hàng và thứ tự các điểm.","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu song song của một hình bình hành (mặt phẳng không song song phương chiếu) là:","options":["A. một hình bình hành","B. một đoạn thẳng","C. một hình thang","D. một hình chữ nhật"],"answer":"A","explain":"Phép chiếu song song bảo toàn tính song song: ảnh của hình bình hành là hình bình hành.","points":0.25},{"type":"mcq","level":"TH","q":"Hình biểu diễn của đường tròn thường là:","options":["A. một parabol","B. một đường tròn","C. một đoạn thẳng","D. một hình elip"],"answer":"D","explain":"Phép chiếu song song (xiên) biến đường tròn thành elip.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện $ABCD$, $G$ là trọng tâm tam giác $BCD$. Xét phép chiếu song song theo phương $AG$ lên $(BCD)$. Ảnh của $A$ là $G$; ảnh của đường thẳng $AB$ là đường thẳng:","options":["A. $AB$","B. $GA$","C. $GB$","D. $GD$"],"answer":"C","explain":"Ảnh của $A$ là $G$, ảnh của $B \\in (BCD)$ là $B$: ảnh của $AB$ là $GB$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình vuông. Hình biểu diễn đúng của đáy trên mặt phẳng vẽ là hình bình hành $A'B'C'D'$ có $A'B'$ gấp đôi $B'C'$. Điều này:","options":["A. chấp nhận được, vì tỉ số độ dài trên hai đường không song song không cần bảo toàn","B. đúng chỉ khi $A'B'C'D'$ là hình chữ nhật","C. sai, vì hình vuông phải vẽ thành hình vuông","D. sai, vì phải giữ nguyên tỉ số cạnh"],"answer":"A","explain":"Phép chiếu song song chỉ bảo toàn tỉ số trên các đường song song; $A'B'$ và $B'C'$ không song song nên tỉ số của chúng có thể thay đổi.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của hình bình hành là hình bình hành.","b) Ảnh của một tam giác (không suy biến) là một tam giác.","c) Thứ tự của ba điểm thẳng hàng được bảo toàn qua phép chiếu song song.","d) Phép chiếu song song bảo toàn số đo góc."],"answer":["T","T","T","F"],"explain":"a) Đúng: bảo toàn tính song song của các cặp cạnh đối b) Đúng: bảo toàn tính thẳng hàng của ba đỉnh c) Đúng: tính chất d) Sai: góc có thể thay đổi qua phép chiếu xiên","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của $C'$ là $C$.","b) Ảnh của tam giác $A'B'D'$ là tam giác $ABD$.","c) Ảnh của toàn bộ hình hộp là hình bình hành $ABCD$.","d) Mọi điểm của mặt phẳng $(ABCD)$ đều là ảnh của chính nó."],"answer":["T","T","T","T"],"explain":"a) Đúng: $CC' \\parallel AA'$ b) Đúng: bảo toàn tính thẳng hàng c) Đúng: mọi đỉnh đều chiếu xuống mặt đáy d) Đúng: điểm thuộc mặt phẳng chiếu giữ nguyên","points":1},{"type":"short","level":"NB","q":"Nếu $M$ là trung điểm của $AB$ thì ảnh $M'$ là gì của $A'B'$?","answer":"trung điểm","explain":"Phép chiếu song song bảo toàn tỉ số nên bảo toàn trung điểm.","points":0.5},{"type":"short","level":"TH","q":"Để vẽ hình biểu diễn của hình chóp có đáy là hình vuông, ta vẽ đáy thành hình gì?","answer":"hình bình hành","explain":"Quy ước: hình vuông (là hình bình hành đặc biệt) được biểu diễn thành hình bình hành.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Điều kiện của phương chiếu $l$ đối với mặt phẳng chiếu $(P)$ là:","options":["A. $l$ song song với $(P)$","B. $l$ nằm trong $(P)$","C. $l$ vuông góc với $(P)$","D. $l$ không song song và không nằm trong $(P)$"],"answer":"D","explain":"Phương chiếu phải cắt mặt phẳng chiếu (không song song, không nằm trong).","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu song song của hai đường thẳng song song là:","options":["A. hai đường thẳng chéo nhau","B. hai đường thẳng song song hoặc trùng nhau","C. một điểm duy nhất","D. hai đường thẳng cắt nhau"],"answer":"B","explain":"Tính chất: ảnh của hai đường song song là hai đường song song hoặc trùng nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình hộp $ABCD.A'B'C'D'$. Hình chiếu song song của điểm $A$ lên $(A'B'C'D')$ theo phương $AA'$ là:","options":["A. $A$","B. tâm của $(A'B'C'D')$","C. $B'$","D. $A'$"],"answer":"D","explain":"Đường thẳng qua $A$ song song $AA'$ chính là $AA'$, cắt $(A'B'C'D')$ tại $A'$.","points":0.25},{"type":"mcq","level":"TH","q":"Để vẽ hình biểu diễn của hình chóp $S.ABCD$ (đáy hình bình hành), ta vẽ đáy $ABCD$ thành:","options":["A. đúng hình bình hành đã cho","B. một hình bình hành","C. một hình thang cân","D. một hình chữ nhật"],"answer":"B","explain":"Quy ước vẽ: hình bình hành được biểu diễn thành hình bình hành.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện $ABCD$, $G$ là trọng tâm tam giác $BCD$. Xét phép chiếu song song theo phương $AG$ lên $(BCD)$. Ảnh của $A$ là $G$; ảnh của đường thẳng $AB$ là đường thẳng:","options":["A. $GA$","B. $GB$","C. $AB$","D. $GD$"],"answer":"B","explain":"Ảnh của $A$ là $G$, ảnh của $B \\in (BCD)$ là $B$: ảnh của $AB$ là $GB$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Xét phép chiếu song song theo phương $AC'$ lên mặt phẳng $(ABCD)$. Ảnh của điểm $C'$ là:","options":["A. $C$","B. trung điểm của $AC$","C. điểm đối xứng của $A$ qua $C$","D. $A$"],"answer":"D","explain":"Đường thẳng qua $C'$ song song với $AC'$ chính là đường thẳng $AC'$, cắt $(ABCD)$ tại $A$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của một tam giác (không suy biến) là một tam giác.","b) Hai đoạn thẳng bằng nhau luôn có ảnh bằng nhau.","c) Phép chiếu song song biến đường tròn thành đường tròn.","d) Ảnh của hình bình hành là hình bình hành."],"answer":["T","F","F","T"],"explain":"a) Đúng: bảo toàn tính thẳng hàng của ba đỉnh b) Sai: độ dài không được bảo toàn c) Sai: đường tròn chiếu xiên thành elip d) Đúng: bảo toàn tính song song của các cặp cạnh đối","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của trung điểm của $A'B'$ là trung điểm của $AB$.","b) Ảnh của điểm $D'$ là $D$.","c) Ảnh của tam giác $A'B'D'$ là tam giác $ABD$.","d) Ảnh của $A'$ là $A$."],"answer":["T","T","T","T"],"explain":"a) Đúng: bảo toàn trung điểm b) Đúng: $DD' \\parallel AA'$ c) Đúng: bảo toàn tính thẳng hàng d) Đúng: đường thẳng qua $A'$ song song $AA'$ cắt $(ABCD)$ tại $A$","points":1},{"type":"short","level":"NB","q":"Phép chiếu song song có bảo toàn tính song song không?","answer":"Có","explain":"Tính chất cơ bản.","points":0.5},{"type":"short","level":"TH","q":"Hình biểu diễn của đường tròn qua phép chiếu song song (xiên) là hình gì?","answer":"elip","explain":"Đường tròn chiếu xiên thành elip.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Phép chiếu song song biến đường thẳng song song với phương chiếu thành:","options":["A. vô số điểm","B. một đường thẳng","C. một điểm","D. một đoạn thẳng"],"answer":"C","explain":"Mọi điểm trên đường thẳng đó có cùng ảnh (đường thẳng song song phương chiếu gặp $(P)$ tại một điểm).","points":0.25},{"type":"mcq","level":"NB","q":"Cho $A, B, C$ thẳng hàng theo thứ tự đó, $A', B', C'$ là hình chiếu song song. Khẳng định đúng:","options":["A. $A', B', C'$ thẳng hàng theo thứ tự đó","B. $B'$ là trung điểm $A'C'$ luôn luôn","C. $A', B', C'$ không thẳng hàng","D. $A' \\equiv B' \\equiv C'$"],"answer":"A","explain":"Phép chiếu song song bảo toàn tính thẳng hàng và thứ tự các điểm.","points":0.25},{"type":"mcq","level":"TH","q":"Hình biểu diễn của hình vuông $ABCD$ qua phép chiếu song song có thể là:","options":["A. một tứ giác lồi bất kì","B. chỉ có thể là hình vuông","C. một hình thang","D. một hình bình hành"],"answer":"D","explain":"Ảnh của hình bình hành là hình bình hành (hình vuông là trường hợp riêng); góc vuông và độ dài bằng nhau không bảo toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vẽ hình không gian, tỉ số độ dài nào thường được giữ nguyên trên hình biểu diễn?","options":["A. diện tích","B. số đo góc","C. độ dài mọi đoạn thẳng","D. tỉ số độ dài hai đoạn thẳng song song"],"answer":"D","explain":"Phép chiếu song song bảo toàn tỉ số độ dài trên hai đường thẳng song song — đây là cơ sở để vẽ hình biểu diễn.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABC$, phép chiếu song song theo phương $SA$ lên $(ABC)$. Ảnh của $S$ là $A$; ảnh của tam giác $SBC$ là:","options":["A. đoạn $BC$","B. tam giác $ABC$","C. tam giác $SBC$","D. điểm $A$"],"answer":"B","explain":"Ảnh của $S$ là $A$, của $B$ là $B$, của $C$ là $C$: ảnh của tam giác $SBC$ là tam giác $ABC$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Hình chiếu song song của $AB$ lên $(BCD)$ theo phương vuông góc với $(BCD)$ (phép chiếu vuông góc) là đoạn thẳng nối:","options":["A. $C$ với $D$","B. hình chiếu của $A$ với $B$","C. $A$ với $B$","D. trung điểm các cạnh"],"answer":"B","explain":"$B \\in (BCD)$ nên ảnh của $B$ là $B$; ảnh của $A$ là hình chiếu vuông góc của $A$ lên $(BCD)$ (trọng tâm tam giác $BCD$).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $M'$ là ảnh của $M$ thì đường thẳng $MM'$ song song với phương chiếu.","b) Hai đoạn thẳng bằng nhau luôn có ảnh bằng nhau.","c) Thứ tự của ba điểm thẳng hàng được bảo toàn qua phép chiếu song song.","d) Ảnh của một đường thẳng song song với phương chiếu là một điểm."],"answer":["T","F","T","T"],"explain":"a) Đúng: định nghĩa phép chiếu song song b) Sai: độ dài không được bảo toàn c) Đúng: tính chất d) Đúng: mọi điểm trên đó có cùng ảnh","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của đường thẳng $A'C'$ là đường thẳng $AC$.","b) Ảnh của trung điểm của $A'B'$ là trung điểm của $AB$.","c) Ảnh của tam giác $A'B'D'$ là tam giác $ABD$.","d) Ảnh của đoạn $A'C'$ là đoạn $AC$."],"answer":["T","T","T","T"],"explain":"a) Đúng: ảnh của đường thẳng (không song song phương chiếu) là đường thẳng b) Đúng: bảo toàn trung điểm c) Đúng: bảo toàn tính thẳng hàng d) Đúng: bảo toàn tính thẳng hàng và thứ tự","points":1},{"type":"short","level":"NB","q":"Ảnh của đường thẳng song song với phương chiếu là gì?","answer":"một điểm","explain":"Mọi điểm trên đường thẳng đó có cùng ảnh.","points":0.5},{"type":"short","level":"TH","q":"Hình biểu diễn của hình bình hành qua phép chiếu song song là hình gì?","answer":"hình bình hành","explain":"Phép chiếu song song bảo toàn tính song song của các cặp cạnh đối.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Điều kiện của phương chiếu $l$ đối với mặt phẳng chiếu $(P)$ là:","options":["A. $l$ không song song và không nằm trong $(P)$","B. $l$ song song với $(P)$","C. $l$ vuông góc với $(P)$","D. $l$ nằm trong $(P)$"],"answer":"A","explain":"Phương chiếu phải cắt mặt phẳng chiếu (không song song, không nằm trong).","points":0.25},{"type":"mcq","level":"NB","q":"Cho $A, B, C$ thẳng hàng theo thứ tự đó, $A', B', C'$ là hình chiếu song song. Khẳng định đúng:","options":["A. $A', B', C'$ thẳng hàng theo thứ tự đó","B. $A', B', C'$ không thẳng hàng","C. $B'$ là trung điểm $A'C'$ luôn luôn","D. $A' \\equiv B' \\equiv C'$"],"answer":"A","explain":"Phép chiếu song song bảo toàn tính thẳng hàng và thứ tự các điểm.","points":0.25},{"type":"mcq","level":"TH","q":"Xét phép chiếu song song theo phương $AD$ lên mặt phẳng $(BCD)$. Ảnh của điểm $A$ là:","options":["A. $A$","B. $B$","C. $C$","D. $D$"],"answer":"D","explain":"Đường thẳng qua $A$ song song với $AD$ chính là đường thẳng $AD$, cắt $(BCD)$ tại $D$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong hình biểu diễn, nét vẽ nào dùng cho các đường bị che khuất?","options":["A. không vẽ","B. nét chấm gạch","C. nét đứt","D. nét liền đậm"],"answer":"C","explain":"Quy ước: đường không bị che khuất vẽ nét liền, đường bị che khuất vẽ nét đứt.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lăng trụ tam giác $ABC.A'B'C'$. Hình chiếu song song của trung điểm $M$ của $BC$ lên $(A'B'C')$ theo phương $AA'$ là:","options":["A. $A'$","B. $C'$","C. $B'$","D. trung điểm của $B'C'$"],"answer":"D","explain":"Ảnh của $B, C$ là $B', C'$; bảo toàn trung điểm nên ảnh của $M$ là trung điểm $B'C'$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Hình chiếu song song của $AB$ lên $(BCD)$ theo phương vuông góc với $(BCD)$ (phép chiếu vuông góc) là đoạn thẳng nối:","options":["A. $C$ với $D$","B. hình chiếu của $A$ với $B$","C. trung điểm các cạnh","D. $A$ với $B$"],"answer":"B","explain":"$B \\in (BCD)$ nên ảnh của $B$ là $B$; ảnh của $A$ là hình chiếu vuông góc của $A$ lên $(BCD)$ (trọng tâm tam giác $BCD$).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của một đường thẳng song song với phương chiếu là một điểm.","b) Phép chiếu song song bảo toàn tính thẳng hàng của ba điểm.","c) Phép chiếu song song biến đường tròn thành đường tròn.","d) Ảnh của hình bình hành là hình bình hành."],"answer":["T","T","F","T"],"explain":"a) Đúng: mọi điểm trên đó có cùng ảnh b) Đúng: tính chất cơ bản c) Sai: đường tròn chiếu xiên thành elip d) Đúng: bảo toàn tính song song của các cặp cạnh đối","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của điểm $D'$ là $D$.","b) Ảnh của $A'$ là $A$.","c) Ảnh của $C'$ là $C$.","d) Ảnh của $B'$ là $B$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $DD' \\parallel AA'$ b) Đúng: đường thẳng qua $A'$ song song $AA'$ cắt $(ABCD)$ tại $A$ c) Đúng: $CC' \\parallel AA'$ d) Đúng: $BB' \\parallel AA'$","points":1},{"type":"short","level":"NB","q":"Phương chiếu $l$ và mặt phẳng chiếu $(P)$ cần thỏa điều kiện gì?","answer":"$l$ cắt $(P)$","explain":"$l$ không song song và không nằm trong $(P)$.","points":0.5},{"type":"short","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$, xét phép chiếu theo phương $AC'$ lên $(ABCD)$. Ảnh của $C'$ là điểm nào?","answer":"$A$","explain":"Đường thẳng qua $C'$ song song với $AC'$ chính là $AC'$, cắt $(ABCD)$ tại $A$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Phép chiếu song song biến đường thẳng $a$ (không song song với phương chiếu) thành:","options":["A. một đoạn thẳng","B. một điểm","C. một tia","D. một đường thẳng $a'$"],"answer":"D","explain":"Tính chất: ảnh của đường thẳng là đường thẳng (trừ khi song song với phương chiếu thì thành một điểm).","points":0.25},{"type":"mcq","level":"NB","q":"Tính chất nào KHÔNG được bảo toàn qua phép chiếu song song?","options":["A. tính song song của hai đường thẳng","B. độ dài đoạn thẳng","C. tỉ số độ dài hai đoạn thẳng trên cùng một đường thẳng","D. tính thẳng hàng của ba điểm"],"answer":"B","explain":"Phép chiếu song song bảo toàn tính thẳng hàng, song song, tỉ số trên cùng đường thẳng — nhưng KHÔNG bảo toàn độ dài và góc.","points":0.25},{"type":"mcq","level":"TH","q":"Hình biểu diễn của hình vuông $ABCD$ qua phép chiếu song song có thể là:","options":["A. chỉ có thể là hình vuông","B. một hình bình hành","C. một hình thang","D. một tứ giác lồi bất kì"],"answer":"B","explain":"Ảnh của hình bình hành là hình bình hành (hình vuông là trường hợp riêng); góc vuông và độ dài bằng nhau không bảo toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vẽ hình không gian, tỉ số độ dài nào thường được giữ nguyên trên hình biểu diễn?","options":["A. diện tích","B. số đo góc","C. tỉ số độ dài hai đoạn thẳng song song","D. độ dài mọi đoạn thẳng"],"answer":"C","explain":"Phép chiếu song song bảo toàn tỉ số độ dài trên hai đường thẳng song song — đây là cơ sở để vẽ hình biểu diễn.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lăng trụ tam giác $ABC.A'B'C'$. Hình chiếu song song của trung điểm $M$ của $BC$ lên $(A'B'C')$ theo phương $AA'$ là:","options":["A. $C'$","B. $A'$","C. $B'$","D. trung điểm của $B'C'$"],"answer":"D","explain":"Ảnh của $B, C$ là $B', C'$; bảo toàn trung điểm nên ảnh của $M$ là trung điểm $B'C'$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình vuông. Hình biểu diễn đúng của đáy trên mặt phẳng vẽ là hình bình hành $A'B'C'D'$ có $A'B'$ gấp đôi $B'C'$. Điều này:","options":["A. sai, vì hình vuông phải vẽ thành hình vuông","B. sai, vì phải giữ nguyên tỉ số cạnh","C. đúng chỉ khi $A'B'C'D'$ là hình chữ nhật","D. chấp nhận được, vì tỉ số độ dài trên hai đường không song song không cần bảo toàn"],"answer":"D","explain":"Phép chiếu song song chỉ bảo toàn tỉ số trên các đường song song; $A'B'$ và $B'C'$ không song song nên tỉ số của chúng có thể thay đổi.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thứ tự của ba điểm thẳng hàng được bảo toàn qua phép chiếu song song.","b) Phép chiếu song song bảo toàn tính thẳng hàng của ba điểm.","c) Phép chiếu song song bảo toàn số đo góc.","d) Phép chiếu song song bảo toàn độ dài đoạn thẳng."],"answer":["T","T","F","F"],"explain":"a) Đúng: tính chất b) Đúng: tính chất cơ bản c) Sai: góc có thể thay đổi qua phép chiếu xiên d) Sai: chỉ bảo toàn tỉ số độ dài, không bảo toàn độ dài","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của đường chéo $B'D'$ là đường chéo $BD$.","b) Ảnh của đường thẳng $A'C'$ là đường thẳng $AC$.","c) Ảnh của trung điểm của $A'B'$ là trung điểm của $AB$.","d) Ảnh của tam giác $A'B'D'$ là tam giác $ABD$."],"answer":["T","T","T","T"],"explain":"a) Đúng: mỗi đầu mút chiếu xuống đầu mút tương ứng b) Đúng: ảnh của đường thẳng (không song song phương chiếu) là đường thẳng c) Đúng: bảo toàn trung điểm d) Đúng: bảo toàn tính thẳng hàng","points":1},{"type":"short","level":"NB","q":"Ảnh của hai đường thẳng song song qua phép chiếu song song là gì?","answer":"hai đường thẳng song song hoặc trùng nhau","explain":"Tính chất cơ bản của phép chiếu song song.","points":0.5},{"type":"short","level":"TH","q":"Cho tứ diện $ABCD$, xét phép chiếu theo phương $AD$ lên $(BCD)$. Ảnh của $A$ là điểm nào?","answer":"$D$","explain":"Đường thẳng qua $A$ song song với $AD$ cắt $(BCD)$ tại $D$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Phép chiếu song song biến đường thẳng song song với phương chiếu thành:","options":["A. một đoạn thẳng","B. một điểm","C. một đường thẳng","D. vô số điểm"],"answer":"B","explain":"Mọi điểm trên đường thẳng đó có cùng ảnh (đường thẳng song song phương chiếu gặp $(P)$ tại một điểm).","points":0.25},{"type":"mcq","level":"NB","q":"Mệnh đề nào SAI?","options":["A. Phép chiếu song song biến hai đường thẳng song song thành hai đường song song hoặc trùng nhau","B. Phép chiếu song song biến trung điểm thành trung điểm","C. Phép chiếu song song bảo toàn độ dài đoạn thẳng","D. Phép chiếu song song biến ba điểm thẳng hàng thành ba điểm thẳng hàng"],"answer":"C","explain":"Phép chiếu song song không bảo toàn độ dài (chỉ bảo toàn tỉ số).","points":0.25},{"type":"mcq","level":"TH","q":"Xét phép chiếu song song theo phương $AD$ lên mặt phẳng $(BCD)$. Ảnh của điểm $A$ là:","options":["A. $D$","B. $A$","C. $B$","D. $C$"],"answer":"A","explain":"Đường thẳng qua $A$ song song với $AD$ chính là đường thẳng $AD$, cắt $(BCD)$ tại $D$.","points":0.25},{"type":"mcq","level":"TH","q":"Để vẽ hình biểu diễn của hình chóp $S.ABCD$ (đáy hình bình hành), ta vẽ đáy $ABCD$ thành:","options":["A. một hình thang cân","B. một hình bình hành","C. đúng hình bình hành đã cho","D. một hình chữ nhật"],"answer":"B","explain":"Quy ước vẽ: hình bình hành được biểu diễn thành hình bình hành.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình hộp $ABCD.A'B'C'D'$. Gọi $O, O'$ lần lượt là tâm của $ABCD$ và $A'B'C'D'$. Hình chiếu song song của $O$ lên $(A'B'C'D')$ theo phương $AA'$ là:","options":["A. $O$","B. $A'$","C. $O'$","D. $B'$"],"answer":"C","explain":"$OO' \\parallel AA'$ (tính chất hình hộp) nên đường qua $O$ song song $AA'$ cắt $(A'B'C'D')$ tại $O'$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Hình chiếu song song của $AB$ lên $(BCD)$ theo phương vuông góc với $(BCD)$ (phép chiếu vuông góc) là đoạn thẳng nối:","options":["A. hình chiếu của $A$ với $B$","B. trung điểm các cạnh","C. $C$ với $D$","D. $A$ với $B$"],"answer":"A","explain":"$B \\in (BCD)$ nên ảnh của $B$ là $B$; ảnh của $A$ là hình chiếu vuông góc của $A$ lên $(BCD)$ (trọng tâm tam giác $BCD$).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phép chiếu song song bảo toàn độ dài đoạn thẳng.","b) Phép chiếu song song biến đường tròn thành đường tròn.","c) Ảnh của trung điểm một đoạn thẳng là trung điểm của đoạn ảnh.","d) Nếu $M'$ là ảnh của $M$ thì đường thẳng $MM'$ song song với phương chiếu."],"answer":["F","F","T","T"],"explain":"a) Sai: chỉ bảo toàn tỉ số độ dài, không bảo toàn độ dài b) Sai: đường tròn chiếu xiên thành elip c) Đúng: trường hợp riêng của bảo toàn tỉ số $1:1$ d) Đúng: định nghĩa phép chiếu song song","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của toàn bộ hình hộp là hình bình hành $ABCD$.","b) Ảnh của $A'$ là $A$.","c) Ảnh của đường chéo $B'D'$ là đường chéo $BD$.","d) Ảnh của tâm $O'$ của mặt trên là tâm $O$ của mặt dưới."],"answer":["T","T","T","T"],"explain":"a) Đúng: mọi đỉnh đều chiếu xuống mặt đáy b) Đúng: đường thẳng qua $A'$ song song $AA'$ cắt $(ABCD)$ tại $A$ c) Đúng: mỗi đầu mút chiếu xuống đầu mút tương ứng d) Đúng: $OO' \\parallel AA'$","points":1},{"type":"short","level":"NB","q":"Trong hình biểu diễn, đường bị che khuất được vẽ bằng nét gì?","answer":"nét đứt","explain":"Quy ước vẽ hình không gian.","points":0.5},{"type":"short","level":"TH","q":"Tỉ số độ dài nào được bảo toàn qua phép chiếu song song?","answer":"tỉ số độ dài hai đoạn thẳng trên cùng một đường thẳng","explain":"Tính chất cơ bản.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Điều kiện của phương chiếu $l$ đối với mặt phẳng chiếu $(P)$ là:","options":["A. $l$ song song với $(P)$","B. $l$ không song song và không nằm trong $(P)$","C. $l$ nằm trong $(P)$","D. $l$ vuông góc với $(P)$"],"answer":"B","explain":"Phương chiếu phải cắt mặt phẳng chiếu (không song song, không nằm trong).","points":0.25},{"type":"mcq","level":"NB","q":"Mệnh đề nào SAI?","options":["A. Phép chiếu song song biến hai đường thẳng song song thành hai đường song song hoặc trùng nhau","B. Phép chiếu song song biến trung điểm thành trung điểm","C. Phép chiếu song song biến ba điểm thẳng hàng thành ba điểm thẳng hàng","D. Phép chiếu song song bảo toàn độ dài đoạn thẳng"],"answer":"D","explain":"Phép chiếu song song không bảo toàn độ dài (chỉ bảo toàn tỉ số).","points":0.25},{"type":"mcq","level":"TH","q":"Hình chiếu song song của một hình bình hành (mặt phẳng không song song phương chiếu) là:","options":["A. một hình thang","B. một hình bình hành","C. một đoạn thẳng","D. một hình chữ nhật"],"answer":"B","explain":"Phép chiếu song song bảo toàn tính song song: ảnh của hình bình hành là hình bình hành.","points":0.25},{"type":"mcq","level":"TH","q":"Để vẽ hình biểu diễn của hình chóp $S.ABCD$ (đáy hình bình hành), ta vẽ đáy $ABCD$ thành:","options":["A. một hình chữ nhật","B. một hình thang cân","C. một hình bình hành","D. đúng hình bình hành đã cho"],"answer":"C","explain":"Quy ước vẽ: hình bình hành được biểu diễn thành hình bình hành.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lăng trụ tam giác $ABC.A'B'C'$. Hình chiếu song song của trung điểm $M$ của $BC$ lên $(A'B'C')$ theo phương $AA'$ là:","options":["A. $A'$","B. $B'$","C. $C'$","D. trung điểm của $B'C'$"],"answer":"D","explain":"Ảnh của $B, C$ là $B', C'$; bảo toàn trung điểm nên ảnh của $M$ là trung điểm $B'C'$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Hình chiếu song song của $AB$ lên $(BCD)$ theo phương vuông góc với $(BCD)$ (phép chiếu vuông góc) là đoạn thẳng nối:","options":["A. hình chiếu của $A$ với $B$","B. $C$ với $D$","C. $A$ với $B$","D. trung điểm các cạnh"],"answer":"A","explain":"$B \\in (BCD)$ nên ảnh của $B$ là $B$; ảnh của $A$ là hình chiếu vuông góc của $A$ lên $(BCD)$ (trọng tâm tam giác $BCD$).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phép chiếu song song biến đường tròn thành đường tròn.","b) Ảnh của hình bình hành là hình bình hành.","c) Thứ tự của ba điểm thẳng hàng được bảo toàn qua phép chiếu song song.","d) Phép chiếu song song bảo toàn số đo góc."],"answer":["F","T","T","F"],"explain":"a) Sai: đường tròn chiếu xiên thành elip b) Đúng: bảo toàn tính song song của các cặp cạnh đối c) Đúng: tính chất d) Sai: góc có thể thay đổi qua phép chiếu xiên","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của tam giác $A'B'D'$ là tam giác $ABD$.","b) Ảnh của đoạn $A'C'$ là đoạn $AC$.","c) Ảnh của trung điểm của $A'B'$ là trung điểm của $AB$.","d) Mọi điểm của mặt phẳng $(ABCD)$ đều là ảnh của chính nó."],"answer":["T","T","T","T"],"explain":"a) Đúng: bảo toàn tính thẳng hàng b) Đúng: bảo toàn tính thẳng hàng và thứ tự c) Đúng: bảo toàn trung điểm d) Đúng: điểm thuộc mặt phẳng chiếu giữ nguyên","points":1},{"type":"short","level":"NB","q":"Ảnh của đoạn thẳng $AB$ (không song song với phương chiếu) là gì?","answer":"đoạn thẳng $A'B'$","explain":"Ảnh của đoạn thẳng là đoạn thẳng nối các ảnh của hai đầu mút.","points":0.5},{"type":"short","level":"TH","q":"Cho $M$ là trung điểm của $AB$. Qua phép chiếu song song, ảnh $M'$ của $M$ là gì của $A'B'$?","answer":"trung điểm","explain":"Bảo toàn tỉ số: $M'$ là trung điểm của $A'B'$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Phép chiếu song song lên mặt phẳng $(P)$ theo phương $l$ biến mỗi điểm $M$ thành:","options":["A. giao điểm $M'$ của đường thẳng qua $M$ song song với $l$ và mặt phẳng $(P)$","B. điểm $M$ cố định trên $(P)$","C. điểm đối xứng của $M$ qua $(P)$","D. hình chiếu vuông góc của $M$ lên $(P)$"],"answer":"A","explain":"Định nghĩa: $M'$ là giao của đường thẳng qua $M$ song song với phương chiếu $l$ và mặt phẳng chiếu $(P)$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $M$ là trung điểm của $AB$, $M', A', B'$ là hình chiếu song song. Khi đó:","options":["A. $M'$ trùng $A'$","B. $M'$ nằm ngoài đoạn $A'B'$","C. $M'$ là trung điểm của $A'B'$","D. $A'B' = AB$"],"answer":"C","explain":"Bảo toàn tỉ số: $\\frac{AM}{MB} = 1$ nên $\\frac{A'M'}{M'B'} = 1$: $M'$ là trung điểm $A'B'$.","points":0.25},{"type":"mcq","level":"TH","q":"Hình biểu diễn của hình vuông $ABCD$ qua phép chiếu song song có thể là:","options":["A. một hình bình hành","B. một hình thang","C. một tứ giác lồi bất kì","D. chỉ có thể là hình vuông"],"answer":"A","explain":"Ảnh của hình bình hành là hình bình hành (hình vuông là trường hợp riêng); góc vuông và độ dài bằng nhau không bảo toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Để vẽ hình biểu diễn của hình chóp $S.ABCD$ (đáy hình bình hành), ta vẽ đáy $ABCD$ thành:","options":["A. một hình thang cân","B. đúng hình bình hành đã cho","C. một hình bình hành","D. một hình chữ nhật"],"answer":"C","explain":"Quy ước vẽ: hình bình hành được biểu diễn thành hình bình hành.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện $ABCD$, $G$ là trọng tâm tam giác $BCD$. Xét phép chiếu song song theo phương $AG$ lên $(BCD)$. Ảnh của $A$ là $G$; ảnh của đường thẳng $AB$ là đường thẳng:","options":["A. $GD$","B. $AB$","C. $GA$","D. $GB$"],"answer":"D","explain":"Ảnh của $A$ là $G$, ảnh của $B \\in (BCD)$ là $B$: ảnh của $AB$ là $GB$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Hình chiếu song song của $AB$ lên $(BCD)$ theo phương vuông góc với $(BCD)$ (phép chiếu vuông góc) là đoạn thẳng nối:","options":["A. $A$ với $B$","B. trung điểm các cạnh","C. hình chiếu của $A$ với $B$","D. $C$ với $D$"],"answer":"C","explain":"$B \\in (BCD)$ nên ảnh của $B$ là $B$; ảnh của $A$ là hình chiếu vuông góc của $A$ lên $(BCD)$ (trọng tâm tam giác $BCD$).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của một tam giác (không suy biến) là một tam giác.","b) Ảnh của một đường thẳng song song với phương chiếu là một điểm.","c) Ảnh của hình bình hành là hình bình hành.","d) Ảnh của hai đường thẳng song song là hai đường thẳng song song hoặc trùng nhau."],"answer":["T","T","T","T"],"explain":"a) Đúng: bảo toàn tính thẳng hàng của ba đỉnh b) Đúng: mọi điểm trên đó có cùng ảnh c) Đúng: bảo toàn tính song song của các cặp cạnh đối d) Đúng: tính chất","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi điểm của mặt phẳng $(ABCD)$ đều là ảnh của chính nó.","b) Ảnh của trung điểm của $A'B'$ là trung điểm của $AB$.","c) Ảnh của tâm $O'$ của mặt trên là tâm $O$ của mặt dưới.","d) Ảnh của tam giác $A'B'D'$ là tam giác $ABD$."],"answer":["T","T","T","T"],"explain":"a) Đúng: điểm thuộc mặt phẳng chiếu giữ nguyên b) Đúng: bảo toàn trung điểm c) Đúng: $OO' \\parallel AA'$ d) Đúng: bảo toàn tính thẳng hàng","points":1},{"type":"short","level":"NB","q":"Ảnh của ba điểm thẳng hàng qua phép chiếu song song là gì?","answer":"ba điểm thẳng hàng","explain":"Phép chiếu song song bảo toàn tính thẳng hàng.","points":0.5},{"type":"short","level":"TH","q":"Hình biểu diễn của một tam giác đều là hình gì?","answer":"một tam giác","explain":"Ảnh của tam giác là tam giác; tính 'đều' và độ dài không được bảo toàn.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Phép chiếu song song biến đường thẳng song song với phương chiếu thành:","options":["A. một điểm","B. vô số điểm","C. một đường thẳng","D. một đoạn thẳng"],"answer":"A","explain":"Mọi điểm trên đường thẳng đó có cùng ảnh (đường thẳng song song phương chiếu gặp $(P)$ tại một điểm).","points":0.25},{"type":"mcq","level":"NB","q":"Cho $A, B, C$ thẳng hàng theo thứ tự đó, $A', B', C'$ là hình chiếu song song. Khẳng định đúng:","options":["A. $A' \\equiv B' \\equiv C'$","B. $A', B', C'$ không thẳng hàng","C. $B'$ là trung điểm $A'C'$ luôn luôn","D. $A', B', C'$ thẳng hàng theo thứ tự đó"],"answer":"D","explain":"Phép chiếu song song bảo toàn tính thẳng hàng và thứ tự các điểm.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lăng trụ $ABC.A'B'C'$. Hình chiếu song song của tam giác $ABC$ lên $(A'B'C')$ theo phương $AA'$ là:","options":["A. một đoạn thẳng","B. tam giác $A'B'C'$","C. tam giác $ABC$","D. một điểm"],"answer":"B","explain":"Mỗi đỉnh $A, B, C$ chiếu thành $A', B', C'$ nên ảnh là tam giác $A'B'C'$.","points":0.25},{"type":"mcq","level":"TH","q":"Trong hình biểu diễn, nét vẽ nào dùng cho các đường bị che khuất?","options":["A. nét liền đậm","B. không vẽ","C. nét đứt","D. nét chấm gạch"],"answer":"C","explain":"Quy ước: đường không bị che khuất vẽ nét liền, đường bị che khuất vẽ nét đứt.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện $ABCD$, $G$ là trọng tâm tam giác $BCD$. Xét phép chiếu song song theo phương $AG$ lên $(BCD)$. Ảnh của $A$ là $G$; ảnh của đường thẳng $AB$ là đường thẳng:","options":["A. $GB$","B. $AB$","C. $GA$","D. $GD$"],"answer":"A","explain":"Ảnh của $A$ là $G$, ảnh của $B \\in (BCD)$ là $B$: ảnh của $AB$ là $GB$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Xét phép chiếu song song theo phương $AC'$ lên mặt phẳng $(ABCD)$. Ảnh của điểm $C'$ là:","options":["A. $A$","B. trung điểm của $AC$","C. điểm đối xứng của $A$ qua $C$","D. $C$"],"answer":"A","explain":"Đường thẳng qua $C'$ song song với $AC'$ chính là đường thẳng $AC'$, cắt $(ABCD)$ tại $A$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phép chiếu song song bảo toàn tính thẳng hàng của ba điểm.","b) Phép chiếu song song bảo toàn độ dài đoạn thẳng.","c) Hai đoạn thẳng bằng nhau luôn có ảnh bằng nhau.","d) Ảnh của hai đường thẳng song song là hai đường thẳng song song hoặc trùng nhau."],"answer":["T","F","F","T"],"explain":"a) Đúng: tính chất cơ bản b) Sai: chỉ bảo toàn tỉ số độ dài, không bảo toàn độ dài c) Sai: độ dài không được bảo toàn d) Đúng: tính chất","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của trung điểm của $A'B'$ là trung điểm của $AB$.","b) Ảnh của $C'$ là $C$.","c) Ảnh của đoạn $A'C'$ là đoạn $AC$.","d) Ảnh của đường thẳng $A'C'$ là đường thẳng $AC$."],"answer":["T","T","T","T"],"explain":"a) Đúng: bảo toàn trung điểm b) Đúng: $CC' \\parallel AA'$ c) Đúng: bảo toàn tính thẳng hàng và thứ tự d) Đúng: ảnh của đường thẳng (không song song phương chiếu) là đường thẳng","points":1},{"type":"short","level":"NB","q":"Phép chiếu song song có bảo toàn độ dài đoạn thẳng không?","answer":"Không","explain":"Phép chiếu song song chỉ bảo toàn tỉ số độ dài, không bảo toàn độ dài.","points":0.5},{"type":"short","level":"TH","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu theo phương $AA'$ lên $(ABCD)$. Ảnh của $C'$ là điểm nào?","answer":"$C$","explain":"$CC' \\parallel AA'$ nên đường qua $C'$ song song phương chiếu cắt $(ABCD)$ tại $C$.","points":0.5}]}]}
