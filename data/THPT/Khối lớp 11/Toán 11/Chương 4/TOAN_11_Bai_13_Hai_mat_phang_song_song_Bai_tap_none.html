ó thể chéo nhau","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $AC \\parallel (A'B'C'D')$.","b) $(A'BD) \\parallel (CB'D')$.","c) $(ADD'A')$ cắt $(BCC'B')$ theo một giao tuyến.","d) Đường chéo $AC'$ cắt mặt phẳng $(A'BD)$ tại trọng tâm của tam giác $A'BD$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $AC \\subset (ABCD) \\parallel (A'B'C'D')$ b) Đúng: $A'B \\parallel CD'$, $BD \\parallel B'D'$ là hai cặp đường cắt nhau c) Sai: hai mặt đối song song nên không có giao tuyến d) Đúng: tính chất quen thuộc của hình hộp (bất biến qua phép biến đổi afin)","points":1},{"type":"short","level":"NB","q":"Cho hình hộp $ABCD.A'B'C'D'$. Mặt phẳng $(ABCD)$ song song với mặt phẳng nào?","answer":"$(A'B'C'D')$","explain":"Hai mặt đối của hình hộp song song với nhau.","points":0.5},{"type":"short","level":"TH","q":"Ba mặt phẳng $(P) \\parallel (Q) \\parallel (R)$ cắt đường thẳng $a$ tại $A, B, C$ với $AB = 3$, $BC = 3$; cắt đường thẳng $b$ tại $A', B', C'$ với $A'B' = 12$. Độ dài $B'C'$ bằng bao nhiêu?","answer":"$12$","explain":"Theo định lí Thales: $\\frac{AB}{BC} = \\frac{A'B'}{B'C'}$ nên $B'C' = \\frac{BC \\cdot A'B'}{AB} = \\frac{3 \\cdot 12}{3} = 12$.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Cho $(P) \\parallel (Q)$. Khẳng định nào đúng?","options":["A. Tồn tại đường thẳng trong $(P)$ cắt $(Q)$","B. Mọi đường thẳng nằm trong $(P)$ đều song song với $(Q)$","C. $(P)$ và $(Q)$ có vô số điểm chung","D. Mọi đường thẳng trong $(P)$ đều cắt $(Q)$"],"answer":"B","explain":"Nếu $(P) \\parallel (Q)$ thì mọi đường thẳng $d \\subset (P)$ đều không có điểm chung với $(Q)$, tức $d \\parallel (Q)$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $(P) \\parallel (Q)$, $a \\subset (P)$, $b \\subset (Q)$. Vị trí của $a, b$ là:","options":["A. chắc chắn song song","B. chắc chắn chéo nhau","C. cắt nhau","D. song song hoặc chéo nhau"],"answer":"D","explain":"$a, b$ nằm trong hai mặt phẳng song song nên không có điểm chung: song song hoặc chéo nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q)$, mặt phẳng $(R)$ cắt $(P)$ theo $a$ và cắt $(Q)$ theo $b$. Khi đó:","options":["A. $a \\parallel b$","B. $a, b$ chéo nhau","C. $a$ cắt $b$","D. $a \\equiv b$"],"answer":"A","explain":"Tính chất: hai mặt phẳng song song bị cắt bởi mặt phẳng thứ ba thì giao tuyến song song với nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q)$, $A, B \\in (P)$, $A', B'$ lần lượt là hình chiếu song song của $A, B$ lên $(Q)$. Tứ giác $ABB'A'$ là:","options":["A. hình thang","B. hình chữ nhật","C. tứ giác lồi bất kì","D. hình bình hành"],"answer":"D","explain":"$AA' \\parallel BB'$ (cùng phương chiếu), $AB \\parallel A'B'$ (tính chất phép chiếu song song): hình bình hành.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lăng trụ $ABC.A'B'C'$. Khẳng định nào đúng?","options":["A. $(ABC) \\parallel (A'B'C')$","B. $(ABC)$ cắt $(A'B'C')$","C. $(ABB'A') \\parallel (ABC)$","D. $AA' \\parallel (ABC)$ là sai"],"answer":"A","explain":"Hai mặt đáy của lăng trụ song song với nhau.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành, $M$ là điểm trên $SA$ sao cho $\\frac{SM}{SA} = \\frac{1}{2}$. Mặt phẳng qua $M$ song song với đáy cắt $SB, SC, SD$ tại $N, P, Q$. Tỉ số $\\frac{V_{S.MNPQ}}{V_{S.ABCD}}$ bằng:","options":["A. $\\frac{1}{16}$","B. $\\frac{1}{2}$","C. $\\frac{1}{4}$","D. $\\frac{1}{8}$"],"answer":"D","explain":"Mặt phẳng qua $M$ song song với $(ABCD)$ cắt các cạnh bên theo tỉ số $\\frac{SM}{SA} = \\frac{1}{2}$ nên $MNPQ$ là hình bình hành đồng dạng với $ABCD$ tỉ số $\\frac{1}{2}$. Hai khối chóp $S.MNPQ$ và $S.ABCD$ đồng dạng tỉ số $\\frac{1}{2}$ nên tỉ số thể tích là $\\left(\\frac{1}{2}\\right)^3 = \\frac{1}{8}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đường thẳng cắt một trong hai mặt phẳng song song thì cắt mặt phẳng còn lại.","b) Hai mặt phẳng cùng song song với một mặt phẳng thứ ba thì song song với nhau.","c) Hai mặt phẳng song song bị mặt phẳng thứ ba cắt theo hai giao tuyến song song.","d) Nếu $(P)$ chứa hai đường thẳng cắt nhau cùng song song với $(Q)$ thì $(P) \\parallel (Q)$."],"answer":["T","T","T","T"],"explain":"a) Đúng: tính chất b) Đúng: tính chất bắc cầu c) Đúng: tính chất của giao tuyến d) Đúng: dấu hiệu nhận biết hai mặt phẳng song song","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $(A'BD) \\parallel (CB'D')$.","b) Tâm $O$ của đáy thuộc mặt phẳng $(AA'C'C)$.","c) $AB' \\parallel (CDD'C')$.","d) $(ADD'A')$ cắt $(BCC'B')$ theo một giao tuyến."],"answer":["T","T","T","F"],"explain":"a) Đúng: $A'B \\parallel CD'$, $BD \\parallel B'D'$ là hai cặp đường cắt nhau b) Đúng: $O \\in AC \\subset (AA'C'C)$ c) Đúng: $AB' \\subset (ABB'A') \\parallel (CDD'C')$ d) Sai: hai mặt đối song song nên không có giao tuyến","points":1},{"type":"short","level":"NB","q":"Cho $(P) \\parallel (Q)$, $A \\in (P)$. Đường thẳng đi qua $A$ và song song với $(Q)$ thì có vị trí gì đối với $(P)$?","answer":"nằm trong $(P)$","explain":"Nếu đường thẳng qua $A$ song song với $(Q)$ mà không nằm trong $(P)$ sẽ mâu thuẫn với tính duy nhất.","points":0.5},{"type":"short","level":"TH","q":"Ba mặt phẳng $(P) \\parallel (Q) \\parallel (R)$ cắt đường thẳng $a$ tại $A, B, C$ với $AB = 2$, $BC = 4$; cắt đường thẳng $b$ tại $A', B', C'$ với $A'B' = 6$. Độ dài $B'C'$ bằng bao nhiêu?","answer":"$12$","explain":"Theo định lí Thales: $\\frac{AB}{BC} = \\frac{A'B'}{B'C'}$ nên $B'C' = \\frac{BC \\cdot A'B'}{AB} = \\frac{4 \\cdot 6}{2} = 12$.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Nếu $(P) \\parallel (Q)$ và đường thẳng $d$ cắt $(P)$ thì $d$:","options":["A. cắt $(Q)$","B. chéo với $(Q)$","C. song song với $(Q)$","D. nằm trong $(Q)$"],"answer":"A","explain":"Đường thẳng cắt một trong hai mặt phẳng song song thì cắt mặt phẳng còn lại.","points":0.25},{"type":"mcq","level":"NB","q":"Điều kiện để hai mặt phẳng $(P), (Q)$ song song là:","options":["A. $(P)$ và $(Q)$ cùng song song với một đường thẳng","B. $(P)$ chứa hai đường thẳng song song cùng song song với $(Q)$","C. $(P)$ chứa hai đường thẳng cắt nhau cùng song song với $(Q)$","D. $(P)$ chứa một đường thẳng song song với $(Q)$"],"answer":"C","explain":"Dấu hiệu: mặt phẳng chứa hai đường thẳng cắt nhau cùng song song với mặt phẳng kia thì hai mặt phẳng song song.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q)$, $d \\subset (P)$. Khẳng định nào đúng?","options":["A. $d$ cắt $(Q)$","B. $d \\subset (Q)$","C. $d \\parallel (Q)$","D. $d$ vuông góc $(Q)$"],"answer":"C","explain":"Mọi đường thẳng trong $(P)$ đều song song với $(Q)$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho ba mặt phẳng $(P) \\parallel (Q) \\parallel (R)$ cắt đường thẳng $a$ tại $A, B, C$ và cắt đường thẳng $b$ tại $A', B', C'$. Khi đó:","options":["A. $\\frac{AB}{A'B'} = \\frac{BC}{B'C'} = 1$","B. $AC = A'C'$","C. $\\frac{AB}{BC} = \\frac{A'B'}{B'C'}$","D. $AB = A'B'$"],"answer":"C","explain":"Theo định lí Thales: $\\frac{AB}{BC} = \\frac{A'B'}{B'C'}$ (và $\\frac{AB}{AC} = \\frac{A'B'}{A'C'}$).","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABC$, $M, N, P$ lần lượt là trung điểm của $SA, SB, SC$. Khẳng định đúng là:","options":["A. $(MNP)$ trùng $(SBC)$","B. $(MNP)$ cắt $(ABC)$","C. $(MNP) \\equiv (ABC)$","D. $(MNP) \\parallel (ABC)$"],"answer":"D","explain":"$MN \\parallel AB$, $MP \\parallel AC$ (đường trung bình); hai đường cắt nhau tại $M$ cùng song song với $(ABC)$ nên $(MNP) \\parallel (ABC)$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện $ABCD$, $M \\in AB$ sao cho $\\frac{AM}{AB} = \\frac{2}{3}$. Mặt phẳng $(\\alpha)$ qua $M$ song song với $(BCD)$ cắt $AC, AD$ tại $N, P$. Tỉ số $\\frac{V_{A.MNP}}{V_{ABCD}}$ bằng:","options":["A. $\\frac{8}{27}$","B. $\\frac{1}{2}$","C. $\\frac{2}{3}$","D. $\\frac{4}{9}$"],"answer":"A","explain":"$(\\alpha) \\parallel (BCD)$ nên giao tuyến của $(\\alpha)$ với $(ABC)$ song song với $BC$: $MN \\parallel BC$, suy ra $\\frac{AN}{AC} = \\frac{AM}{AB} = \\frac{2}{3}$. Tương tự $\\frac{AP}{AD} = \\frac{2}{3}$. Khối tứ diện $A.MNP$ đồng dạng với $ABCD$ theo tỉ số $\\frac{2}{3}$ nên tỉ số thể tích là $\\left(\\frac{2}{3}\\right)^3 = \\frac{8}{27}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ba mặt phẳng đôi một song song chắn trên hai đường thẳng bất kì các đoạn thẳng tương ứng tỉ lệ.","b) Nếu $(P)$ chứa hai đường thẳng song song cùng song song với $(Q)$ thì $(P) \\parallel (Q)$.","c) Đường thẳng cắt một trong hai mặt phẳng song song thì cắt mặt phẳng còn lại.","d) Hai mặt phẳng song song bị mặt phẳng thứ ba cắt theo hai giao tuyến song song."],"answer":["T","F","T","T"],"explain":"a) Đúng: định lí Thales trong không gian b) Sai: cần hai đường thẳng cắt nhau mới đủ kết luận c) Đúng: tính chất d) Đúng: tính chất của giao tuyến","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $(ABB'A') \\parallel (CDD'C')$.","b) $AC \\parallel (A'B'C'D')$.","c) $AB' \\parallel (CDD'C')$.","d) Đường chéo $AC'$ cắt mặt phẳng $(A'BD)$ tại trọng tâm của tam giác $A'BD$."],"answer":["T","T","T","T"],"explain":"a) Đúng: hai mặt đối của hình hộp song song với nhau b) Đúng: $AC \\subset (ABCD) \\parallel (A'B'C'D')$ c) Đúng: $AB' \\subset (ABB'A') \\parallel (CDD'C')$ d) Đúng: tính chất quen thuộc của hình hộp (bất biến qua phép biến đổi afin)","points":1},{"type":"short","level":"NB","q":"Hai mặt phẳng $(P), (Q)$ không có điểm chung. Kết luận nào đúng?","answer":"$(P) \\parallel (Q)$","explain":"Theo định nghĩa hai mặt phẳng song song.","points":0.5},{"type":"short","level":"TH","q":"Ba mặt phẳng $(P) \\parallel (Q) \\parallel (R)$ cắt đường thẳng $a$ tại $A, B, C$ với $AB = 4$, $BC = 2$; cắt đường thẳng $b$ tại $A', B', C'$ với $A'B' = 16$. Độ dài $B'C'$ bằng bao nhiêu?","answer":"$8$","explain":"Theo định lí Thales: $\\frac{AB}{BC} = \\frac{A'B'}{B'C'}$ nên $B'C' = \\frac{BC \\cdot A'B'}{AB} = \\frac{2 \\cdot 16}{4} = 8$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Cho $(P) \\parallel (Q)$. Khẳng định nào đúng?","options":["A. Mọi đường thẳng trong $(P)$ đều cắt $(Q)$","B. Tồn tại đường thẳng trong $(P)$ cắt $(Q)$","C. Mọi đường thẳng nằm trong $(P)$ đều song song với $(Q)$","D. $(P)$ và $(Q)$ có vô số điểm chung"],"answer":"C","explain":"Nếu $(P) \\parallel (Q)$ thì mọi đường thẳng $d \\subset (P)$ đều không có điểm chung với $(Q)$, tức $d \\parallel (Q)$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $(P) \\parallel (Q)$, $a \\subset (P)$, $b \\subset (Q)$. Vị trí của $a, b$ là:","options":["A. cắt nhau","B. song song hoặc chéo nhau","C. chắc chắn song song","D. chắc chắn chéo nhau"],"answer":"B","explain":"$a, b$ nằm trong hai mặt phẳng song song nên không có điểm chung: song song hoặc chéo nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q)$, $d \\subset (P)$. Khẳng định nào đúng?","options":["A. $d$ cắt $(Q)$","B. $d \\subset (Q)$","C. $d$ vuông góc $(Q)$","D. $d \\parallel (Q)$"],"answer":"D","explain":"Mọi đường thẳng trong $(P)$ đều song song với $(Q)$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q)$, $A, B \\in (P)$, $A', B'$ lần lượt là hình chiếu song song của $A, B$ lên $(Q)$. Tứ giác $ABB'A'$ là:","options":["A. hình bình hành","B. hình thang","C. hình chữ nhật","D. tứ giác lồi bất kì"],"answer":"A","explain":"$AA' \\parallel BB'$ (cùng phương chiếu), $AB \\parallel A'B'$ (tính chất phép chiếu song song): hình bình hành.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình hộp $ABCD.A'B'C'D'$. Mặt phẳng $(A'BD)$ song song với mặt phẳng nào?","options":["A. $(ABC)$","B. $(CB'D')$","C. $(ABB'A')$","D. $(ACD)$"],"answer":"B","explain":"$A'B \\parallel CD'$ và $BD \\parallel B'D'$ (tính chất hình hộp); hai đường thẳng cắt nhau tại $B$ lần lượt song song với hai đường thẳng cắt nhau tại $D'$ trong $(CB'D')$ nên $(A'BD) \\parallel (CB'D').","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành, $M$ là điểm trên $SA$ sao cho $\\frac{SM}{SA} = \\frac{1}{2}$. Mặt phẳng qua $M$ song song với đáy cắt $SB, SC, SD$ tại $N, P, Q$. Tỉ số $\\frac{V_{S.MNPQ}}{V_{S.ABCD}}$ bằng:","options":["A. $\\frac{1}{2}$","B. $\\frac{1}{4}$","C. $\\frac{1}{16}$","D. $\\frac{1}{8}$"],"answer":"D","explain":"Mặt phẳng qua $M$ song song với $(ABCD)$ cắt các cạnh bên theo tỉ số $\\frac{SM}{SA} = \\frac{1}{2}$ nên $MNPQ$ là hình bình hành đồng dạng với $ABCD$ tỉ số $\\frac{1}{2}$. Hai khối chóp $S.MNPQ$ và $S.ABCD$ đồng dạng tỉ số $\\frac{1}{2}$ nên tỉ số thể tích là $\\left(\\frac{1}{2}\\right)^3 = \\frac{1}{8}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Qua một điểm nằm ngoài $(P)$ có duy nhất một mặt phẳng song song với $(P)$.","b) Nếu $(P)$ chứa hai đường thẳng cắt nhau cùng song song với $(Q)$ thì $(P) \\parallel (Q)$.","c) Hai mặt phẳng song song bị mặt phẳng thứ ba cắt theo hai giao tuyến song song.","d) Nếu $(P) \\parallel (Q)$ thì mọi đường thẳng trong $(P)$ đều song song với $(Q)$."],"answer":["T","T","T","T"],"explain":"a) Đúng: tính chất b) Đúng: dấu hiệu nhận biết hai mặt phẳng song song c) Đúng: tính chất của giao tuyến d) Đúng: tính chất của hai mặt phẳng song song","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $(ADD'A')$ cắt $(BCC'B')$ theo một giao tuyến.","b) $AC \\parallel (A'B'C'D')$.","c) Tâm $O$ của đáy thuộc mặt phẳng $(AA'C'C)$.","d) $(A'BD) \\parallel (CB'D')$."],"answer":["F","T","T","T"],"explain":"a) Sai: hai mặt đối song song nên không có giao tuyến b) Đúng: $AC \\subset (ABCD) \\parallel (A'B'C'D')$ c) Đúng: $O \\in AC \\subset (AA'C'C)$ d) Đúng: $A'B \\parallel CD'$, $BD \\parallel B'D'$ là hai cặp đường cắt nhau","points":1},{"type":"short","level":"NB","q":"Cho $(P) \\parallel (Q)$, $(R)$ cắt $(P)$. $(R)$ và $(Q)$ có quan hệ gì?","answer":"cắt nhau","explain":"Mặt phẳng cắt một trong hai mặt phẳng song song thì cắt mặt phẳng còn lại.","points":0.5},{"type":"short","level":"TH","q":"Ba mặt phẳng $(P) \\parallel (Q) \\parallel (R)$ cắt đường thẳng $a$ tại $A, B, C$ với $AB = 3$, $BC = 4$; cắt đường thẳng $b$ tại $A', B', C'$ với $A'B' = 6$. Độ dài $B'C'$ bằng bao nhiêu?","answer":"$8$","explain":"Theo định lí Thales: $\\frac{AB}{BC} = \\frac{A'B'}{B'C'}$ nên $B'C' = \\frac{BC \\cdot A'B'}{AB} = \\frac{4 \\cdot 6}{3} = 8$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Cho $(P) \\parallel (Q)$. Khẳng định nào đúng?","options":["A. Mọi đường thẳng trong $(P)$ đều cắt $(Q)$","B. Mọi đường thẳng nằm trong $(P)$ đều song song với $(Q)$","C. $(P)$ và $(Q)$ có vô số điểm chung","D. Tồn tại đường thẳng trong $(P)$ cắt $(Q)$"],"answer":"B","explain":"Nếu $(P) \\parallel (Q)$ thì mọi đường thẳng $d \\subset (P)$ đều không có điểm chung với $(Q)$, tức $d \\parallel (Q)$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $a, b$ là hai đường thẳng cắt nhau trong $(P)$, $a \\parallel (Q)$, $b \\parallel (Q)$. Kết luận:","options":["A. $(P) \\equiv (Q)$","B. không kết luận được","C. $(P)$ cắt $(Q)$","D. $(P) \\parallel (Q)$"],"answer":"D","explain":"Đúng theo dấu hiệu nhận biết hai mặt phẳng song song.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hai mặt phẳng song song $(P), (Q)$. Một đường thẳng cắt $(P)$ tại $A$ và cắt $(Q)$ tại $B$. Khẳng định đúng:","options":["A. đường thẳng đó không song song với $(P)$ cũng không song song với $(Q)$","B. đường thẳng đó nằm trong $(P)$","C. đường thẳng đó song song với $(Q)$","D. $A \\equiv B$"],"answer":"A","explain":"Đường thẳng cắt $(P)$ thì cắt $(Q)$ (tính chất).","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q)$, $A, B \\in (P)$, $A', B'$ lần lượt là hình chiếu song song của $A, B$ lên $(Q)$. Tứ giác $ABB'A'$ là:","options":["A. hình chữ nhật","B. tứ giác lồi bất kì","C. hình bình hành","D. hình thang"],"answer":"C","explain":"$AA' \\parallel BB'$ (cùng phương chiếu), $AB \\parallel A'B'$ (tính chất phép chiếu song song): hình bình hành.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình hộp $ABCD.A'B'C'D'$. Mặt phẳng $(A'BD)$ song song với mặt phẳng nào?","options":["A. $(CB'D')$","B. $(ACD)$","C. $(ABB'A')$","D. $(ABC)$"],"answer":"A","explain":"$A'B \\parallel CD'$ và $BD \\parallel B'D'$ (tính chất hình hộp); hai đường thẳng cắt nhau tại $B$ lần lượt song song với hai đường thẳng cắt nhau tại $D'$ trong $(CB'D')$ nên $(A'BD) \\parallel (CB'D').","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành, $M$ là điểm trên $SA$ sao cho $\\frac{SM}{SA} = \\frac{1}{2}$. Mặt phẳng qua $M$ song song với đáy cắt $SB, SC, SD$ tại $N, P, Q$. Tỉ số $\\frac{V_{S.MNPQ}}{V_{S.ABCD}}$ bằng:","options":["A. $\\frac{1}{16}$","B. $\\frac{1}{4}$","C. $\\frac{1}{2}$","D. $\\frac{1}{8}$"],"answer":"D","explain":"Mặt phẳng qua $M$ song song với $(ABCD)$ cắt các cạnh bên theo tỉ số $\\frac{SM}{SA} = \\frac{1}{2}$ nên $MNPQ$ là hình bình hành đồng dạng với $ABCD$ tỉ số $\\frac{1}{2}$. Hai khối chóp $S.MNPQ$ và $S.ABCD$ đồng dạng tỉ số $\\frac{1}{2}$ nên tỉ số thể tích là $\\left(\\frac{1}{2}\\right)^3 = \\frac{1}{8}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hai mặt phẳng song song bị mặt phẳng thứ ba cắt theo hai giao tuyến song song.","b) Hai mặt phẳng cùng song song với một mặt phẳng thứ ba thì song song với nhau.","c) Hai mặt phẳng không có điểm chung thì song song với nhau.","d) Mặt phẳng cắt một trong hai mặt phẳng song song thì cắt mặt phẳng còn lại."],"answer":["T","T","T","T"],"explain":"a) Đúng: tính chất của giao tuyến b) Đúng: tính chất bắc cầu c) Đúng: định nghĩa hai mặt phẳng song song d) Đúng: tính chất","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $(ABCD) \\parallel (A'B'C'D')$.","b) $(A'BD) \\parallel (CB'D')$.","c) $(ABB'A') \\parallel (CDD'C')$.","d) $A'C$ cắt $(ABCD)$ tại trung điểm của $A'C$."],"answer":["T","T","T","F"],"explain":"a) Đúng: hai mặt đối của hình hộp song song với nhau b) Đúng: $A'B \\parallel CD'$, $BD \\parallel B'D'$ là hai cặp đường cắt nhau c) Đúng: hai mặt đối của hình hộp song song với nhau d) Sai: $A'C$ cắt $(ABCD)$ tại $C$","points":1},{"type":"short","level":"NB","q":"Cho hình lăng trụ $ABC.A'B'C'$. Mặt phẳng $(ABC)$ song song với mặt phẳng nào?","answer":"$(A'B'C')$","explain":"Hai mặt đáy của lăng trụ song song với nhau.","points":0.5},{"type":"short","level":"TH","q":"Ba mặt phẳng $(P) \\parallel (Q) \\parallel (R)$ cắt đường thẳng $a$ tại $A, B, C$ với $AB = 4$, $BC = 6$; cắt đường thẳng $b$ tại $A', B', C'$ với $A'B' = 8$. Độ dài $B'C'$ bằng bao nhiêu?","answer":"$12$","explain":"Theo định lí Thales: $\\frac{AB}{BC} = \\frac{A'B'}{B'C'}$ nên $B'C' = \\frac{BC \\cdot A'B'}{AB} = \\frac{6 \\cdot 8}{4} = 12$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Cho $(P) \\parallel (Q)$, $a \\subset (P)$. Vị trí của $a$ và $(Q)$ là:","options":["A. $a$ chéo $(Q)$","B. $a$ cắt $(Q)$","C. $a \\parallel (Q)$","D. $a \\subset (Q)$"],"answer":"C","explain":"$a$ nằm trong $(P)$ nên không có điểm chung với $(Q)$: $a \\parallel (Q)$.","points":0.25},{"type":"mcq","level":"NB","q":"Nếu $(\\alpha) \\parallel (\\beta)$ và $(\\gamma) \\parallel (\\beta)$ thì:","options":["A. $(\\alpha) \\parallel (\\gamma)$","B. chưa kết luận được","C. $(\\alpha) \\equiv (\\gamma)$","D. $(\\alpha)$ cắt $(\\gamma)$"],"answer":"A","explain":"Tính chất bắc cầu của quan hệ song song giữa các mặt phẳng.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q)$, $d \\subset (P)$. Khẳng định nào đúng?","options":["A. $d$ cắt $(Q)$","B. $d$ vuông góc $(Q)$","C. $d \\subset (Q)$","D. $d \\parallel (Q)$"],"answer":"D","explain":"Mọi đường thẳng trong $(P)$ đều song song với $(Q)$.","points":0.25},{"type":"mcq","level":"TH","q":"Định lí Thales trong không gian: Ba mặt phẳng đôi một song song chắn trên hai đường thẳng bất kì các đoạn thẳng:","options":["A. tương ứng tỉ lệ","B. vuông góc","C. đồng quy","D. bằng nhau"],"answer":"A","explain":"Nội dung định lí Thales: các đoạn chắn tương ứng tỉ lệ với nhau.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện $ABCD$, $M, N, P$ lần lượt là trung điểm của $AB, AC, AD$. Mặt phẳng $(MNP)$ song song với mặt phẳng nào?","options":["A. $(ACD)$","B. $(ABD)$","C. $(BCD)$","D. $(ABC)$"],"answer":"C","explain":"$MN \\parallel BC$, $MP \\parallel CD$ (đường trung bình); $(MNP) \\parallel (BCD)$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$, $M \\in SA$, $N \\in SB$, $P \\in SC$ sao cho $\\frac{SM}{SA} = \\frac{SN}{SB} = \\frac{SP}{SC} = \\frac{1}{3}$. Mặt phẳng $(MNP)$ chia khối chóp thành hai phần. Tỉ số thể tích phần chứa $S$ và phần còn lại là:","options":["A. $\\frac{1}{26}$","B. $\\frac{1}{27}$","C. $\\frac{1}{7}$","D. $\\frac{1}{8}$"],"answer":"A","explain":"$(MNP) \\parallel (ABC)$ (Thales đảo). Khối $S.MNP$ đồng dạng khối $S.ABC$ tỉ số $\\frac{1}{3}$ nên $\\frac{V_{S.MNP}}{V_{S.ABC}} = \\frac{1}{27}$. Phần còn lại có thể tích $\\frac{26}{27}$: tỉ số $\\frac{1}{26}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đường thẳng cắt một trong hai mặt phẳng song song thì cắt mặt phẳng còn lại.","b) Qua một điểm nằm ngoài $(P)$ có duy nhất một mặt phẳng song song với $(P)$.","c) Nếu $(P)$ chứa hai đường thẳng cắt nhau cùng song song với $(Q)$ thì $(P) \\parallel (Q)$.","d) Hai mặt phẳng cùng song song với một mặt phẳng thứ ba thì song song với nhau."],"answer":["T","T","T","T"],"explain":"a) Đúng: tính chất b) Đúng: tính chất c) Đúng: dấu hiệu nhận biết hai mặt phẳng song song d) Đúng: tính chất bắc cầu","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $(ABCD) \\parallel (A'B'C'D')$.","b) $(AA'C'C)$ cắt $(BB'D'D)$ theo đường thẳng $OO'$ ($O, O'$ là tâm hai đáy).","c) $AC \\parallel (A'B'C'D')$.","d) Đường chéo $AC'$ cắt mặt phẳng $(A'BD)$ tại trọng tâm của tam giác $A'BD$."],"answer":["T","T","T","T"],"explain":"a) Đúng: hai mặt đối của hình hộp song song với nhau b) Đúng: $O, O'$ cùng thuộc hai mặt phẳng chéo c) Đúng: $AC \\subset (ABCD) \\parallel (A'B'C'D')$ d) Đúng: tính chất quen thuộc của hình hộp (bất biến qua phép biến đổi afin)","points":1},{"type":"short","level":"NB","q":"Hai mặt phẳng song song có điểm chung không?","answer":"Không","explain":"Theo định nghĩa.","points":0.5},{"type":"short","level":"TH","q":"Ba mặt phẳng $(P) \\parallel (Q) \\parallel (R)$ cắt đường thẳng $a$ tại $A, B, C$ với $AB = 3$, $BC = 2$; cắt đường thẳng $b$ tại $A', B', C'$ với $A'B' = 6$. Độ dài $B'C'$ bằng bao nhiêu?","answer":"$4$","explain":"Theo định lí Thales: $\\frac{AB}{BC} = \\frac{A'B'}{B'C'}$ nên $B'C' = \\frac{BC \\cdot A'B'}{AB} = \\frac{2 \\cdot 6}{3} = 4$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Nếu $(P) \\parallel (Q)$ và đường thẳng $d$ cắt $(P)$ thì $d$:","options":["A. nằm trong $(Q)$","B. chéo với $(Q)$","C. song song với $(Q)$","D. cắt $(Q)$"],"answer":"D","explain":"Đường thẳng cắt một trong hai mặt phẳng song song thì cắt mặt phẳng còn lại.","points":0.25},{"type":"mcq","level":"NB","q":"Qua một điểm $M$ ngoài $(P)$ có bao nhiêu mặt phẳng song song với $(P)$?","options":["A. Vô số","B. Hai","C. Một và chỉ một","D. Không có"],"answer":"C","explain":"Qua $M$ dựng hai đường thẳng cắt nhau cùng song song với $(P)$; mặt phẳng xác định là duy nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q) \\parallel (R)$ cắt đường thẳng $a$ tại $A, B, C$ với $AB = 2$, $AC = 8$; cắt đường thẳng $b$ tại $A', B', C'$ với $A'B' = 3$. Độ dài $A'C'$ bằng:","options":["A. $24$","B. $9$","C. $12$","D. $6$"],"answer":"C","explain":"Theo định lí Thales: $\\frac{AB}{AC} = \\frac{A'B'}{A'C'}$ nên $\\frac{2}{8} = \\frac{3}{A'C'}$, suy ra $A'C' = 12$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q)$, $A, B \\in (P)$, $A', B'$ lần lượt là hình chiếu song song của $A, B$ lên $(Q)$. Tứ giác $ABB'A'$ là:","options":["A. tứ giác lồi bất kì","B. hình bình hành","C. hình thang","D. hình chữ nhật"],"answer":"B","explain":"$AA' \\parallel BB'$ (cùng phương chiếu), $AB \\parallel A'B'$ (tính chất phép chiếu song song): hình bình hành.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình hộp $ABCD.A'B'C'D'$. Mặt phẳng $(A'BD)$ song song với mặt phẳng nào?","options":["A. $(ABB'A')$","B. $(ACD)$","C. $(CB'D')$","D. $(ABC)$"],"answer":"C","explain":"$A'B \\parallel CD'$ và $BD \\parallel B'D'$ (tính chất hình hộp); hai đường thẳng cắt nhau tại $B$ lần lượt song song với hai đường thẳng cắt nhau tại $D'$ trong $(CB'D')$ nên $(A'BD) \\parallel (CB'D').","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành, $M$ là điểm trên $SA$ sao cho $\\frac{SM}{SA} = \\frac{1}{2}$. Mặt phẳng qua $M$ song song với đáy cắt $SB, SC, SD$ tại $N, P, Q$. Tỉ số $\\frac{V_{S.MNPQ}}{V_{S.ABCD}}$ bằng:","options":["A. $\\frac{1}{16}$","B. $\\frac{1}{8}$","C. $\\frac{1}{4}$","D. $\\frac{1}{2}$"],"answer":"B","explain":"Mặt phẳng qua $M$ song song với $(ABCD)$ cắt các cạnh bên theo tỉ số $\\frac{SM}{SA} = \\frac{1}{2}$ nên $MNPQ$ là hình bình hành đồng dạng với $ABCD$ tỉ số $\\frac{1}{2}$. Hai khối chóp $S.MNPQ$ và $S.ABCD$ đồng dạng tỉ số $\\frac{1}{2}$ nên tỉ số thể tích là $\\left(\\frac{1}{2}\\right)^3 = \\frac{1}{8}$.","points":0.25},{"type":"truefalse","le $ với $AB = 2$, $BC = 2$; cắt đường thẳng $b$ tại $A', B', C'$ với $A'B' = 4$. Độ dài $B'C'$ bằng bao nhiêu?","answer":"$4$","explain":"Theo định lí Thales: $\\frac{AB}{BC} = \\frac{A'B'}{B'C'}$ nên $B'C' = \\frac{BC \\cdot A'B'}{AB} = \\frac{2 \\cdot 4}{2} = 4$.","points":0.5}]}]}
