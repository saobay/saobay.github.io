<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Trong không gian, hai đường thẳng phân biệt cùng song song với một đường thẳng thứ ba thì:","options":["A. chúng cắt nhau","B. chúng chéo nhau","C. chúng song song với nhau","D. chúng trùng nhau"],"answer":"C","explain":"Tính chất bắc cầu của quan hệ song song trong không gian.","points":0.25},{"type":"mcq","level":"NB","q":"Cho tứ diện $ABCD$. Hai đường thẳng $AB$ và $CD$ là hai đường thẳng:","options":["A. song song","B. trùng nhau","C. chéo nhau","D. cắt nhau"],"answer":"C","explain":"$AB$ và $CD$ là hai cạnh đối của tứ diện, không đồng phẳng nên chéo nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành. Giao tuyến $d$ của $(SAB)$ và $(SCD)$ thỏa mãn:","options":["A. $d \\equiv CD$","B. $d \\equiv AB$","C. $d$ đi qua $S$ và $d \\parallel AB \\parallel CD$","D. $d$ cắt $AB$"],"answer":"C","explain":"$(SAB)$ chứa $AB$, $(SCD)$ chứa $CD$, $AB \\parallel CD$ nên giao tuyến qua $S$ song song với $AB, CD$.","points":0.25},{"type":"mcq","level":"TH","q":"Định lí Thales trong không gian: Ba mặt phẳng đôi một song song chắn trên hai đường thẳng bất kì các đoạn thẳng:","options":["A. tương ứng tỉ lệ","B. đồng quy","C. vuông góc","D. bằng nhau"],"answer":"A","explain":"Nội dung định lí Thales: các đoạn chắn tương ứng tỉ lệ với nhau.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABC$, $M$ là trung điểm $AB$, $N$ là trung điểm $AC$. Chứng minh $MN \\parallel (SBC)$. Cơ sở là:","options":["A. $MN \\parallel SB$","B. $M, N \\in (SBC)$","C. $MN \\parallel BC \\subset (SBC)$ và $MN \\not\\subset (SBC)$","D. $MN$ cắt $(SBC)$"],"answer":"C","explain":"$MN$ là đường trung bình của tam giác $ABC$ nên $MN \\parallel BC$; $BC \\subset (SBC)$, $MN$ không nằm trong $(SBC)$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện $ABCD$, $M$ là trung điểm $AB$, $N$ là trung điểm $AC$. Giao tuyến của $(DMN)$ và $(DBC)$ là đường thẳng:","options":["A. $DM$","B. đi qua $D$ và song song với $MN, BC$","C. $DN$","D. $BC$"],"answer":"B","explain":"$MN$ là đường trung bình của tam giác $ABC$ nên $MN \\parallel BC$; giao tuyến qua điểm chung $D$, song song với $MN, BC$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho tứ diện $ABCD$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trong không gian, hai đường thẳng không cắt nhau thì song song.","b) Giao tuyến của $(ABC)$ và $(ABD)$ là $AB$.","c) Hai đường thẳng phân biệt cùng song song với một mặt phẳng thì song song với nhau.","d) Hai đường thẳng song song là hai đường thẳng không có điểm chung và đồng phẳng."],"answer":["F","T","F","T"],"explain":"a) Sai: chúng có thể chéo nhau b) Đúng: hai mặt phẳng có hai điểm chung $A, B$ c) Sai: chúng có thể cắt nhau hoặc chéo nhau d) Đúng: định nghĩa hai đường thẳng song song","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $(A'BD) \\parallel (CB'D')$.","b) $C'D' \\subset (A'B'C'D')$.","c) Giao tuyến của $(ABC'D')$ và $(ABCD)$ là $AD'$.","d) $AC \\parallel (A'B'C'D')$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $A'B \\parallel CD'$, $BD \\parallel B'D'$ là hai cặp đường cắt nhau b) Đúng: $C'D'$ là cạnh của mặt trên c) Sai: hai mặt phẳng có hai điểm chung $A, B$ nên giao tuyến là $AB$ d) Đúng: $AC \\subset (ABCD) \\parallel (A'B'C'D')$","points":1},{"type":"short","level":"NB","q":"Hình chóp có đáy là lục giác có tất cả bao nhiêu mặt?","answer":"$7$","explain":"Số mặt $=$ số mặt bên $+$ mặt đáy $= 6 + 1 = 7$.","points":0.5},{"type":"short","level":"TH","q":"Hình biểu diễn của đường tròn qua phép chiếu song song (xiên) là hình gì?","answer":"elip","explain":"Đường tròn chiếu xiên thành elip.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Cho đường thẳng $d$ không nằm trong $(P)$. Để kết luận $d \\parallel (P)$, điều kiện đủ là:","options":["A. tồn tại một điểm của $d$ thuộc $(P)$","B. $d$ vuông góc với $(P)$","C. $d$ cắt mọi đường thẳng trong $(P)$","D. tồn tại đường thẳng $d' \\subset (P)$ sao cho $d \\parallel d'$"],"answer":"D","explain":"Điều kiện: đường thẳng không nằm trong mặt phẳng, song song với một đường thẳng nằm trong mặt phẳng thì song song với mặt phẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu song song của hai đường thẳng song song là:","options":["A. hai đường thẳng chéo nhau","B. hai đường thẳng song song hoặc trùng nhau","C. hai đường thẳng cắt nhau","D. một điểm duy nhất"],"answer":"B","explain":"Tính chất: ảnh của hai đường song song là hai đường song song hoặc trùng nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Nếu ba mặt phẳng đôi một cắt nhau theo ba giao tuyến phân biệt thì ba giao tuyến đó:","options":["A. luôn chéo nhau từng đôi một","B. luôn đồng quy","C. luôn đôi một song song","D. hoặc đồng quy hoặc đôi một song song"],"answer":"D","explain":"Định lí: ba giao tuyến của ba mặt phẳng đôi một cắt nhau thì hoặc đồng quy hoặc đôi một song song.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q)$, $A, B \\in (P)$, $A', B'$ lần lượt là hình chiếu song song của $A, B$ lên $(Q)$. Tứ giác $ABB'A'$ là:","options":["A. hình chữ nhật","B. hình bình hành","C. tứ giác lồi bất kì","D. hình thang"],"answer":"B","explain":"$AA' \\parallel BB'$ (cùng phương chiếu), $AB \\parallel A'B'$ (tính chất phép chiếu song song): hình bình hành.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện $ABCD$, $M, N$ lần lượt thuộc $AB, AD$ sao cho $\\frac{AM}{AB} = \\frac{AN}{AD} = \\frac{1}{2}$. Khẳng định đúng là:","options":["A. $MN \\parallel BD$ và $MN = \\frac{1}{2}BD$","B. $MN \\parallel CD$","C. $M, N, B, D$ không đồng phẳng","D. $MN$ cắt $BD$"],"answer":"A","explain":"Theo định lí Thales đảo, $MN \\parallel BD$; $MN$ là đường trung bình nên $MN = \\frac{1}{2}BD$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Hình chiếu song song của $AB$ lên $(BCD)$ theo phương vuông góc với $(BCD)$ (phép chiếu vuông góc) là đoạn thẳng nối:","options":["A. $C$ với $D$","B. trung điểm các cạnh","C. $A$ với $B$","D. hình chiếu của $A$ với $B$"],"answer":"D","explain":"$B \\in (BCD)$ nên ảnh của $B$ là $B$; ảnh của $A$ là hình chiếu vuông góc của $A$ lên $(BCD)$ (trọng tâm tam giác $BCD$).","points":0.25},{"type":"truefalse","level":"VD","q":"Cho tứ diện $ABCD$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $M, N$ là trung điểm của $AB, CD$ thì $MN$ song song với $AC$.","b) Đường thẳng nối trung điểm của $AC$ và $AD$ song song với $CD$.","c) Hai đường thẳng $AB$ và $CD$ chéo nhau.","d) Đường trung bình $MN$ của tam giác $ABC$ ($M \\in AB$, $N \\in AC$) song song với $BC$."],"answer":["F","T","T","T"],"explain":"a) Sai: $MN$ nối trung điểm hai cạnh đối, không song song $AC$ b) Đúng: đường trung bình của tam giác $ACD$ c) Đúng: các cạnh đối của tứ diện chéo nhau d) Đúng: tính chất đường trung bình","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành, $M, N$ lần lượt là trung điểm của $AB, CD$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ba điểm $M, N, S$ thẳng hàng.","b) Thiết diện của hình chóp cắt bởi $(SMN)$ là tam giác $SMN$.","c) Giao tuyến của $(SMN)$ và $(ABCD)$ là $MN$.","d) $MN$ cắt $AD$."],"answer":["F","T","T","F"],"explain":"a) Sai: $S, M, N$ không thẳng hàng, chúng xác định mặt phẳng $(SMN)$ b) Đúng: $(SMN)$ cắt đáy theo $MN$, cắt $(SAB), (SCD)$ theo $SM, SN$ c) Đúng: hai mặt phẳng có hai điểm chung $M, N$ d) Sai: $MN \\parallel AD$ nên không cắt nhau","points":1},{"type":"short","level":"NB","q":"Cho $AB \\parallel CD$ và bốn điểm $A, B, C, D$ phân biệt. Bốn điểm đó có đồng phẳng không?","answer":"Có","explain":"Hai đường thẳng song song xác định một mặt phẳng chứa cả bốn điểm.","points":0.5},{"type":"short","level":"TH","q":"Ba mặt phẳng $(P) \\parallel (Q) \\parallel (R)$ cắt đường thẳng $a$ tại $A, B, C$ với $AB = 4$, $BC = 5$; cắt đường thẳng $b$ tại $A', B', C'$ với $A'B' = 16$. Độ dài $B'C'$ bằng bao nhiêu?","answer":"$20$","explain":"Theo định lí Thales: $\\frac{AB}{BC} = \\frac{A'B'}{B'C'}$ nên $B'C' = \\frac{BC \\cdot A'B'}{AB} = \\frac{5 \\cdot 16}{4} = 20$.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Cho $a \\parallel b$. Khẳng định nào đúng?","options":["A. Không có mặt phẳng nào chứa cả $a$ và $b$","B. Mọi mặt phẳng chứa $a$ đều chứa $b$","C. $a$ và $b$ chéo nhau","D. Tồn tại duy nhất một mặt phẳng chứa $a$ và $b$"],"answer":"D","explain":"Hai đường thẳng song song xác định duy nhất một mặt phẳng chứa chúng.","points":0.25},{"type":"mcq","level":"NB","q":"Điều kiện để hai mặt phẳng $(P), (Q)$ song song là:","options":["A. $(P)$ chứa hai đường thẳng cắt nhau cùng song song với $(Q)$","B. $(P)$ chứa hai đường thẳng song song cùng song song với $(Q)$","C. $(P)$ chứa một đường thẳng song song với $(Q)$","D. $(P)$ và $(Q)$ cùng song song với một đường thẳng"],"answer":"A","explain":"Dấu hiệu: mặt phẳng chứa hai đường thẳng cắt nhau cùng song song với mặt phẳng kia thì hai mặt phẳng song song.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hai mặt phẳng $(P), (Q)$ cắt nhau theo giao tuyến $d$. Trong $(P)$ có đường thẳng $a \\parallel d$, trong $(Q)$ có đường thẳng $b \\parallel d$. Khi đó:","options":["A. $a \\parallel b$","B. $a \\equiv b$","C. $a, b$ chéo nhau","D. $a$ cắt $b$"],"answer":"A","explain":"$a, b$ cùng song song với $d$ nên $a \\parallel b$ (bắc cầu).","points":0.25},{"type":"mcq","level":"TH","q":"Tứ diện $ABCD$ có bao nhiêu cạnh?","options":["A. $8$","B. $6$","C. $12$","D. $4$"],"answer":"B","explain":"Tứ diện có $6$ cạnh: $AB, AC, AD, BC, BD, CD$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABC$. Gọi $M$ là trung điểm của $SA$. Giao điểm của đường thẳng $CM$ với mặt phẳng $(SAB)$ là:","options":["A. điểm $S$","B. điểm $A$","C. điểm $M$","D. điểm $C$"],"answer":"C","explain":"$M \\in SA \\subset (SAB)$ nên $M \\in (SAB)$; $C \\notin (SAB)$. Đường thẳng $CM$ nối điểm ngoài $(SAB)$ với điểm trong $(SAB)$ nên cắt $(SAB)$ tại $M$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện $ABCD$. Giao tuyến của hai mặt phẳng $(ABC)$ và $(ABD)$ là đường thẳng:","options":["A. $AC$","B. $AD$","C. $CD$","D. $AB$"],"answer":"D","explain":"Hai mặt phẳng có hai điểm chung $A, B$ nên giao tuyến là $AB$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $(P) \\parallel (Q)$ thì mọi đường thẳng trong $(P)$ đều song song với $(Q)$.","b) Hai mặt phẳng song song bị mặt phẳng thứ ba cắt theo hai giao tuyến song song.","c) Đường thẳng cắt một trong hai mặt phẳng song song thì cắt mặt phẳng còn lại.","d) Qua một điểm nằm ngoài $(P)$ có duy nhất một mặt phẳng song song với $(P)$."],"answer":["T","T","T","T"],"explain":"a) Đúng: tính chất của hai mặt phẳng song song b) Đúng: tính chất của giao tuyến c) Đúng: tính chất d) Đúng: tính chất","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của đường thẳng $A'C'$ là đường thẳng $AC$.","b) Ảnh của toàn bộ hình hộp là hình bình hành $ABCD$.","c) Ảnh của trung điểm của $A'B'$ là trung điểm của $AB$.","d) Ảnh của $C'$ là $C$."],"answer":["T","T","T","T"],"explain":"a) Đúng: ảnh của đường thẳng (không song song phương chiếu) là đường thẳng b) Đúng: mọi đỉnh đều chiếu xuống mặt đáy c) Đúng: bảo toàn trung điểm d) Đúng: $CC' \\parallel AA'$","points":1},{"type":"short","level":"NB","q":"Cho $d \\parallel (P)$. $d$ và $(P)$ có bao nhiêu điểm chung?","answer":"$0$","explain":"Theo định nghĩa đường thẳng song song với mặt phẳng.","points":0.5},{"type":"short","level":"TH","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành tâm $O$. Giao điểm của $AC$ với $(SBD)$ là điểm nào?","answer":"$O$","explain":"$O = AC \\cap BD$ và $O \\in (SBD)$.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Có một và chỉ một mặt phẳng đi qua:","options":["A. một đường thẳng và một điểm không thuộc đường thẳng đó","B. hai điểm và một đường thẳng đi qua hai điểm đó","C. hai đường thẳng chéo nhau","D. một đường thẳng và một điểm thuộc đường thẳng đó"],"answer":"A","explain":"Tiên đề: một đường thẳng và một điểm nằm ngoài nó xác định duy nhất một mặt phẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Nếu hai điểm $A, B$ cùng thuộc mặt phẳng $(P)$ thì:","options":["A. đường thẳng $AB$ cắt $(P)$","B. đường thẳng $AB$ nằm trong $(P)$","C. $(P)$ chỉ chứa $A, B$","D. $A \\equiv B$"],"answer":"B","explain":"Tiên đề: nếu hai điểm của một đường thẳng thuộc một mặt phẳng thì đường thẳng nằm trong mặt phẳng đó.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $d_1 \\parallel d_2$, $d_1 \\subset (P)$, $d_2 \\subset (Q)$, $(P) \\cap (Q) = d$. Khẳng định đúng là:","options":["A. $d_1$ cắt $d_2$","B. $d$ chéo $d_2$","C. $d$ cắt $d_1$","D. $d \\parallel d_1$ và $d \\parallel d_2$"],"answer":"D","explain":"Theo định lí về giao tuyến của hai mặt phẳng chứa hai đường thẳng song song.","points":0.25},{"type":"mcq","level":"TH","q":"Định lí Thales trong không gian: Ba mặt phẳng đôi một song song chắn trên hai đường thẳng bất kì các đoạn thẳng:","options":["A. bằng nhau","B. vuông góc","C. đồng quy","D. tương ứng tỉ lệ"],"answer":"D","explain":"Nội dung định lí Thales: các đoạn chắn tương ứng tỉ lệ với nhau.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện $ABCD$, $P$ là điểm trên cạnh $AC$. Đường thẳng $BP$ cắt mặt phẳng $(ACD)$ tại:","options":["A. điểm $C$","B. điểm $P$","C. điểm $B$","D. điểm $A$"],"answer":"B","explain":"$P \\in AC \\subset (ACD)$; $B \\notin (ACD)$ nên $BP$ cắt $(ACD)$ tại $P$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$ có $M, N$ lần lượt là trung điểm của $AB, AC$. Mặt phẳng $(\\alpha)$ qua $MN$ và song song với $SA$ cắt $SC$ tại $P$. Tỉ số $\\frac{SP}{SC}$ bằng:","options":["A. $\\frac{2}{3}$","B. $\\frac{1}{2}$","C. $\\frac{1}{3}$","D. $1$"],"answer":"B","explain":"$(\\alpha) \\cap (SAC)$ là đường qua $N$ song song $SA$ (vì $(\\alpha) \\parallel SA$), cắt $SC$ tại trung điểm $P$: $\\frac{SP}{SC} = \\frac{1}{2}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phép chiếu song song bảo toàn độ dài đoạn thẳng.","b) Ảnh của một tam giác (không suy biến) là một tam giác.","c) Ảnh của hai đường thẳng song song là hai đường thẳng song song hoặc trùng nhau.","d) Phép chiếu song song bảo toàn số đo góc."],"answer":["F","T","T","F"],"explain":"a) Sai: chỉ bảo toàn tỉ số độ dài, không bảo toàn độ dài b) Đúng: bảo toàn tính thẳng hàng của ba đỉnh c) Đúng: tính chất d) Sai: góc có thể thay đổi qua phép chiếu xiên","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của điểm $D'$ là $D$.","b) Ảnh của $A'$ là $A$.","c) Ảnh của đường chéo $B'D'$ là đường chéo $BD$.","d) Ảnh của đoạn $A'C'$ là đoạn $AC$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $DD' \\parallel AA'$ b) Đúng: đường thẳng qua $A'$ song song $AA'$ cắt $(ABCD)$ tại $A$ c) Đúng: mỗi đầu mút chiếu xuống đầu mút tương ứng d) Đúng: bảo toàn tính thẳng hàng và thứ tự","points":1},{"type":"short","level":"NB","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành. Đường thẳng $AD$ song song với mặt phẳng nào?","answer":"$(SBC)$","explain":"$AD \\parallel BC \\subset (SBC)$ và $AD \\not\\subset (SBC)$.","points":0.5},{"type":"short","level":"TH","q":"Cho hình chóp $S.ABC$, $D, E$ lần lượt là trung điểm của $AB, AC$. Giao tuyến của $(SDE)$ và $(ABC)$ song song với đường thẳng nào?","answer":"$BC$","explain":"$DE \\parallel BC$; giao tuyến của hai mặt phẳng chứa hai đường song song thì song song với hai đường đó.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Mặt phẳng hoàn toàn được xác định khi biết:","options":["A. hai đường thẳng chéo nhau","B. ba điểm không thẳng hàng","C. một đường thẳng","D. hai điểm phân biệt"],"answer":"B","explain":"Ba điểm không thẳng hàng xác định duy nhất một mặt phẳng; các dữ kiện còn lại cho vô số mặt phẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Tính chất nào KHÔNG được bảo toàn qua phép chiếu song song?","options":["A. độ dài đoạn thẳng","B. tính thẳng hàng của ba điểm","C. tính song song của hai đường thẳng","D. tỉ số độ dài hai đoạn thẳng trên cùng một đường thẳng"],"answer":"A","explain":"Phép chiếu song song bảo toàn tính thẳng hàng, song song, tỉ số trên cùng đường thẳng — nhưng KHÔNG bảo toàn độ dài và góc.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tứ diện $ABCD$, $M, N$ lần lượt là trung điểm của $AB, AC$. Đường thẳng $MN$ song song với mặt phẳng nào?","options":["A. $(BCD)$","B. $(ACD)$","C. $(ABC)$","D. $(ABD)$"],"answer":"A","explain":"$MN \\parallel BC \\subset (BCD)$, $MN \\not\\subset (BCD)$ nên $MN \\parallel (BCD)$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $a \\parallel (P)$, $b \\subset (P)$, $a$ và $b$ chéo nhau. Mặt phẳng $(a, b')$ với $b' \\parallel b$ đi qua một điểm của $a$ thì:","options":["A. trùng $(P)$","B. cắt $(P)$","C. song song với $(P)$","D. vuông góc $(P)$"],"answer":"C","explain":"Mặt phẳng chứa hai đường cắt nhau ($a$ và $b'$) cùng song song với $(P)$... $a \\parallel (P)$, $b' \\parallel b \\subset (P)$ nên $b' \\parallel (P)$: mặt phẳng song song với $(P)$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành. Giao điểm của $AC$ và mặt phẳng $(SBD)$ là:","options":["A. điểm $A$","B. giao điểm $O$ của $AC$ và $BD$","C. điểm $S$","D. điểm $C$"],"answer":"B","explain":"Trong mặt phẳng đáy, $AC$ cắt $BD$ tại $O$; mà $BD \\subset (SBD)$ nên $O \\in (SBD)$. Vậy $AC \\cap (SBD) = O$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành, $M$ là điểm trên $SA$ sao cho $\\frac{SM}{SA} = \\frac{1}{2}$. Mặt phẳng qua $M$ song song với đáy cắt $SB, SC, SD$ tại $N, P, Q$. Tỉ số $\\frac{V_{S.MNPQ}}{V_{S.ABCD}}$ bằng:","options":["A. $\\frac{1}{4}$","B. $\\frac{1}{2}$","C. $\\frac{1}{16}$","D. $\\frac{1}{8}$"],"answer":"D","explain":"Mặt phẳng qua $M$ song song với $(ABCD)$ cắt các cạnh bên theo tỉ số $\\frac{SM}{SA} = \\frac{1}{2}$ nên $MNPQ$ là hình bình hành đồng dạng với $ABCD$ tỉ số $\\frac{1}{2}$. Hai khối chóp $S.MNPQ$ và $S.ABCD$ đồng dạng tỉ số $\\frac{1}{2}$ nên tỉ số thể tích là $\\left(\\frac{1}{2}\\right)^3 = \\frac{1}{8}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu đường thẳng $a$ nằm trong $(P)$, đường thẳng $b$ nằm trong $(Q)$ và $(P)$ cắt $(Q)$ thì $a$ cắt $b$.","b) Hai mặt phẳng phân biệt hoặc song song hoặc cắt nhau theo một đường thẳng.","c) Một đường thẳng và một mặt phẳng hoặc song song, hoặc cắt nhau, hoặc đường thẳng nằm trong mặt phẳng.","d) Nếu đường thẳng $d$ song song với mặt phẳng $(P)$ thì $d$ không có điểm chung với $(P)$."],"answer":["F","T","T","T"],"explain":"a) Sai: $a, b$ có thể chéo nhau b) Đúng: hai vị trí tương đối của hai mặt phẳng c) Đúng: ba vị trí tương đối của đường thẳng và mặt phẳng d) Đúng: định nghĩa đường thẳng song song mặt phẳng","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hai mặt phẳng $(SAC)$ và $(ABCD)$ cắt nhau theo giao tuyến $AC$.","b) Giao tuyến của $(SAB)$ và $(SCD)$ là đường thẳng qua $S$ song song với $AB$.","c) Giao điểm của $SD$ với $(ABC)$ là trung điểm của $SD$.","d) Điểm $S$ thuộc mặt phẳng $(ABCD)$."],"answer":["T","T","F","F"],"explain":"a) Đúng: hai mặt phẳng có hai điểm chung $A, C$ b) Đúng: hai mặt phẳng chứa hai đường song song $AB, CD$ c) Sai: $SD$ cắt $(ABC)$ tại $D$ d) Sai: $S$ nằm ngoài mặt đáy","points":1},{"type":"short","level":"NB","q":"Ảnh của hai đường thẳng song song qua phép chiếu song song là gì?","answer":"hai đường thẳng song song hoặc trùng nhau","explain":"Tính chất cơ bản của phép chiếu song song.","points":0.5},{"type":"short","level":"TH","q":"Cho tam giác $ABC$, $M \\in AB$, $N \\in AC$ sao cho $\\frac{AM}{MB} = \\frac{2}{3}$ và $MN \\parallel BC$. Tỉ số $\\frac{MN}{BC}$ bằng bao nhiêu?","answer":"$\\frac{2}{5}$","explain":"Theo định lí Thales: $\\frac{MN}{BC} = \\frac{AM}{AB} = \\frac{2}{2 + 3} = \\frac{2}{5}$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Có một và chỉ một mặt phẳng đi qua:","options":["A. một đường thẳng và một điểm thuộc đường thẳng đó","B. một đường thẳng và một điểm không thuộc đường thẳng đó","C. hai điểm và một đường thẳng đi qua hai điểm đó","D. hai đường thẳng chéo nhau"],"answer":"B","explain":"Tiên đề: một đường thẳng và một điểm nằm ngoài nó xác định duy nhất một mặt phẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Nếu $(\\alpha) \\parallel (\\beta)$ và $(\\gamma) \\parallel (\\beta)$ thì:","options":["A. $(\\alpha) \\equiv (\\gamma)$","B. chưa kết luận được","C. $(\\alpha) \\parallel (\\gamma)$","D. $(\\alpha)$ cắt $(\\gamma)$"],"answer":"C","explain":"Tính chất bắc cầu của quan hệ song song giữa các mặt phẳng.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $A \\in (P)$, $B \\in (P)$, $C \\notin (P)$. Khẳng định nào đúng?","options":["A. Đường thẳng $AB$ nằm trong $(P)$","B. Đường thẳng $AC$ nằm trong $(P)$","C. Đường thẳng $BC$ nằm trong $(P)$","D. Ba điểm $A, B, C$ thẳng hàng"],"answer":"A","explain":"Vì $A, B \\in (P)$ nên $AB \\subset (P)$; $C \\notin (P)$ nên $AC, BC$ không nằm trong $(P)$.","points":0.25},{"type":"mcq","level":"TH","q":"Hình biểu diễn của đường tròn thường là:","options":["A. một đường tròn","B. một parabol","C. một đoạn thẳng","D. một hình elip"],"answer":"D","explain":"Phép chiếu song song (xiên) biến đường tròn thành elip.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lăng trụ tam giác $ABC.A'B'C'$. Hình chiếu song song của trung điểm $M$ của $BC$ lên $(A'B'C')$ theo phương $AA'$ là:","options":["A. $A'$","B. $C'$","C. trung điểm của $B'C'$","D. $B'$"],"answer":"C","explain":"Ảnh của $B, C$ là $B', C'$; bảo toàn trung điểm nên ảnh của $M$ là trung điểm $B'C'$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Hình chiếu song song của $AB$ lên $(BCD)$ theo phương vuông góc với $(BCD)$ (phép chiếu vuông góc) là đoạn thẳng nối:","options":["A. $A$ với $B$","B. trung điểm các cạnh","C. $C$ với $D$","D. hình chiếu của $A$ với $B$"],"answer":"D","explain":"$B \\in (BCD)$ nên ảnh của $B$ là $B$; ảnh của $A$ là hình chiếu vuông góc của $A$ lên $(BCD)$ (trọng tâm tam giác $BCD$).","points":0.25},{"type":"truefalse","level":"VD","q":"Cho tứ diện $ABCD$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giao tuyến của $(ABC)$ và $(ABD)$ là $AB$.","b) Trong không gian, hai đường thẳng không cắt nhau thì song song.","c) Hai đường thẳng cùng song song với đường thẳng thứ ba thì song song với nhau.","d) Nếu $M, N$ là trung điểm của $AB, CD$ thì $MN$ song song với $AC$."],"answer":["T","F","T","F"],"explain":"a) Đúng: hai mặt phẳng có hai điểm chung $A, B$ b) Sai: chúng có thể chéo nhau c) Đúng: tính chất bắc cầu của quan hệ song song d) Sai: $MN$ nối trung điểm hai cạnh đối, không song song $AC$","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình bình hành, $M, N$ lần lượt là trung điểm của $AB, CD$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giao tuyến của $(SAB)$ và $(SMN)$ là $SM$.","b) Giao tuyến của $(SMN)$ và $(SAD)$ là đường thẳng qua $S$ song song với $AD$.","c) Giao tuyến của $(SMN)$ và $(ABCD)$ là $MN$.","d) Ba điểm $M, N, S$ thẳng hàng."],"answer":["T","T","T","F"],"explain":"a) Đúng: hai mặt phẳng có hai điểm chung $S, M$ b) Đúng: hai mặt phẳng chứa hai đường song song $MN, AD$ c) Đúng: hai mặt phẳng có hai điểm chung $M, N$ d) Sai: $S, M, N$ không thẳng hàng, chúng xác định mặt phẳng $(SMN)$","points":1},{"type":"short","level":"NB","q":"Cho tứ diện $ABCD$, $P$ là trung điểm của $AD$, $Q$ là trung điểm của $AC$. $PQ$ song song với mặt phẳng nào?","answer":"$(BCD)$","explain":"$PQ$ là đường trung bình của tam giác $ACD$ nên $PQ \\parallel CD \\subset (BCD)$.","points":0.5},{"type":"short","level":"TH","q":"Cho tứ diện $ABCD$. Có bao nhiêu mặt phẳng chứa $AB$ và song song với $CD$?","answer":"$1$","explain":"Lấy $M \\in AB$, qua $M$ kẻ đường thẳng song song với $CD$; mặt phẳng xác định bởi $AB$ và đường đó là duy nhất.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Mặt phẳng hoàn toàn được xác định khi biết:","options":["A. hai điểm phân biệt","B. ba điểm không thẳng hàng","C. hai đường thẳng chéo nhau","D. một đường thẳng"],"answer":"B","explain":"Ba điểm không thẳng hàng xác định duy nhất một mặt phẳng; các dữ kiện còn lại cho vô số mặt phẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Hai đường thẳng được gọi là chéo nhau nếu:","options":["A. chúng không có điểm chung","B. chúng song song","C. chúng không đồng phẳng","D. chúng cắt nhau"],"answer":"C","explain":"Chéo nhau nghĩa là không cùng nằm trong một mặt phẳng nào.","points":0.25},{"type":"mcq","level":"TH","q":"Hình biểu diễn của một tam giác đều qua phép chiếu song song là:","options":["A. một tam giác","B. một đoạn thẳng","C. một tam giác đều","D. một điểm"],"answer":"A","explain":"Ảnh của tam giác (không suy biến) là một tam giác; tính 'đều' không được bảo toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Trong hình biểu diễn, nét vẽ nào dùng cho các đường bị che khuất?","options":["A. nét đứt","B. nét chấm gạch","C. nét liền đậm","D. không vẽ"],"answer":"A","explain":"Quy ước: đường không bị che khuất vẽ nét liền, đường bị che khuất vẽ nét đứt.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABC$, $D$ là điểm trên $AB$ sao cho $AD = 2DB$. Qua $D$ kẻ đường thẳng song song với $BC$ cắt $AC$ tại $E$. Biết $BC = 9$. Độ dài $DE$ bằng:","options":["A. $9$","B. $3$","C. $4{,}5$","D. $6$"],"answer":"D","explain":"$\\frac{DE}{BC} = \\frac{AD}{AB} = \\frac{2}{3}$ nên $DE = \\frac{2}{3}\\cdot 9 = 6$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$, $M, N, P$ lần lượt là trung điểm của $SA, SB, SC$. Mặt phẳng $(MNP)$ song song với mặt phẳng nào?","options":["A. $(ABC)$","B. $(SCA)$","C. $(SAB)$","D. $(SBC)$"],"answer":"A","explain":"$MN \\parallel AB$, $MP \\parallel AC$ (đường trung bình); hai đường cắt nhau cùng song song với $(ABC)$ nên $(MNP) \\parallel (ABC)$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $d \\subset (P)$ thì $d$ song song với $(P)$.","b) Đường thẳng song song với mặt phẳng thì không có điểm chung với mặt phẳng đó.","c) Nếu $d \\parallel (P)$ thì mọi mặt phẳng chứa $d$ đều song song với $(P)$.","d) Nếu $d \\parallel (P)$ thì $d$ song song với mọi đường thẳng nằm trong $(P)$."],"answer":["F","T","F","F"],"explain":"a) Sai: $d$ nằm trong $(P)$ nên có vô số điểm chung b) Đúng: định nghĩa c) Sai: mặt phẳng chứa $d$ có thể cắt $(P)$ theo giao tuyến song song với $d$ d) Sai: $d$ có thể chéo với các đường thẳng trong $(P)$","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của $C'$ là $C$.","b) Ảnh của trung điểm của $A'B'$ là trung điểm của $AB$.","c) Ảnh của tam giác $A'B'D'$ là tam giác $ABD$.","d) Ảnh của $A'$ là $A$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $CC' \\parallel AA'$ b) Đúng: bảo toàn trung điểm c) Đúng: bảo toàn tính thẳng hàng d) Đúng: đường thẳng qua $A'$ song song $AA'$ cắt $(ABCD)$ tại $A$","points":1},{"type":"short","level":"NB","q":"Ảnh của ba điểm thẳng hàng qua phép chiếu song song là gì?","answer":"ba điểm thẳng hàng","explain":"Phép chiếu song song bảo toàn tính thẳng hàng.","points":0.5},{"type":"short","level":"TH","q":"Hình biểu diễn của hình bình hành qua phép chiếu song song là hình gì?","answer":"hình bình hành","explain":"Phép chiếu song song bảo toàn tính song song của các cặp cạnh đối.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Phép chiếu song song biến đường thẳng song song với phương chiếu thành:","options":["A. một điểm","B. một đoạn thẳng","C. vô số điểm","D. một đường thẳng"],"answer":"A","explain":"Mọi điểm trên đường thẳng đó có cùng ảnh (đường thẳng song song phương chiếu gặp $(P)$ tại một điểm).","points":0.25},{"type":"mcq","level":"NB","q":"Cho $d \\parallel (P)$ và $(Q)$ chứa $d$ cắt $(P)$ theo giao tuyến $d'$. Khi đó:","options":["A. $d' \\subset (Q)$ và $d' \\parallel (P)$","B. $d$ cắt $d'$","C. $d \\parallel d'$","D. $d$ chéo $d'$"],"answer":"C","explain":"Tính chất: giao tuyến của mặt phẳng chứa $d$ với $(P)$ song song với $d$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hai mặt phẳng $(P), (Q)$ cắt nhau theo giao tuyến $d$. Trong $(P)$ có đường thẳng $a \\parallel d$, trong $(Q)$ có đường thẳng $b \\parallel d$. Khi đó:","options":["A. $a \\equiv b$","B. $a, b$ chéo nhau","C. $a \\parallel b$","D. $a$ cắt $b$"],"answer":"C","explain":"$a, b$ cùng song song với $d$ nên $a \\parallel b$ (bắc cầu).","points":0.25},{"type":"mcq","level":"TH","q":"Để vẽ hình biểu diễn của hình chóp $S.ABCD$ (đáy hình bình hành), ta vẽ đáy $ABCD$ thành:","options":["A. đúng hình bình hành đã cho","B. một hình thang cân","C. một hình chữ nhật","D. một hình bình hành"],"answer":"D","explain":"Quy ước vẽ: hình bình hành được biểu diễn thành hình bình hành.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình hộp $ABCD.A'B'C'D'$. Mặt phẳng $(A'BD)$ song song với mặt phẳng nào?","options":["A. $(ABC)$","B. $(ABB'A')$","C. $(ACD)$","D. $(CB'D')$"],"answer":"D","explain":"$A'B \\parallel CD'$ và $BD \\parallel B'D'$ (tính chất hình hộp); hai đường thẳng cắt nhau tại $B$ lần lượt song song với hai đường thẳng cắt nhau tại $D'$ trong $(CB'D')$ nên $(A'BD) \\parallel (CB'D').","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện $ABCD$, $M \\in AB$ sao cho $\\frac{AM}{AB} = \\frac{2}{3}$. Mặt phẳng $(\\alpha)$ qua $M$ song song với $(BCD)$ cắt $AC, AD$ tại $N, P$. Tỉ số $\\frac{V_{A.MNP}}{V_{ABCD}}$ bằng:","options":["A. $\\frac{1}{2}$","B. $\\frac{2}{3}$","C. $\\frac{4}{9}$","D. $\\frac{8}{27}$"],"answer":"D","explain":"$(\\alpha) \\parallel (BCD)$ nên giao tuyến của $(\\alpha)$ với $(ABC)$ song song với $BC$: $MN \\parallel BC$, suy ra $\\frac{AN}{AC} = \\frac{AM}{AB} = \\frac{2}{3}$. Tương tự $\\frac{AP}{AD} = \\frac{2}{3}$. Khối tứ diện $A.MNP$ đồng dạng với $ABCD$ theo tỉ số $\\frac{2}{3}$ nên tỉ số thể tích là $\\left(\\frac{2}{3}\\right)^3 = \\frac{8}{27}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho tứ diện $ABCD$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hai đường thẳng chéo nhau thì không đồng phẳng.","b) Hai đường thẳng phân biệt cùng song song với một mặt phẳng thì song song với nhau.","c) Hai đường thẳng song song là hai đường thẳng không có điểm chung và đồng phẳng.","d) Hai đường thẳng cùng song song với đường thẳng thứ ba thì song song với nhau."],"answer":["T","F","T","T"],"explain":"a) Đúng: định nghĩa hai đường thẳng chéo nhau b) Sai: chúng có thể cắt nhau hoặc chéo nhau c) Đúng: định nghĩa hai đường thẳng song song d) Đúng: tính chất bắc cầu của quan hệ song song","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $C'D' \\subset (A'B'C'D')$.","b) $AC \\parallel (A'B'C'D')$.","c) $(AA'C'C)$ cắt $(BB'D'D)$ theo đường thẳng $OO'$ ($O, O'$ là tâm hai đáy).","d) $(ABCD) \\parallel (A'B'C'D')$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $C'D'$ là cạnh của mặt trên b) Đúng: $AC \\subset (ABCD) \\parallel (A'B'C'D')$ c) Đúng: $O, O'$ cùng thuộc hai mặt phẳng chéo d) Đúng: hai mặt đối của hình hộp song song với nhau","points":1},{"type":"short","level":"NB","q":"Phép chiếu song song có bảo toàn độ dài đoạn thẳng không?","answer":"Không","explain":"Phép chiếu song song chỉ bảo toàn tỉ số độ dài, không bảo toàn độ dài.","points":0.5},{"type":"short","level":"TH","q":"Cho hình chóp $S.ABC$. Giao tuyến của $(SAB)$ và $(ABC)$ là đường thẳng nào?","answer":"$AB$","explain":"Hai mặt phẳng có hai điểm chung $A, B$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Phép chiếu song song biến đường thẳng $a$ (không song song với phương chiếu) thành:","options":["A. một tia","B. một điểm","C. một đường thẳng $a'$","D. một đoạn thẳng"],"answer":"C","explain":"Tính chất: ảnh của đường thẳng là đường thẳng (trừ khi song song với phương chiếu thì thành một điểm).","points":0.25},{"type":"mcq","level":"NB","q":"Cho $a \\parallel (P)$, $b \\parallel (P)$. Khẳng định nào đúng?","options":["A. $a, b$ có thể cắt nhau, song song hoặc chéo nhau","B. $a \\parallel b$","C. $a, b$ chéo nhau","D. $a$ cắt $b$"],"answer":"A","explain":"Hai đường thẳng cùng song song với một mặt phẳng chưa chắc song song với nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q)$, mặt phẳng $(R)$ cắt $(P)$ theo $a$ và cắt $(Q)$ theo $b$. Khi đó:","options":["A. $a \\equiv b$","B. $a \\parallel b$","C. $a$ cắt $b$","D. $a, b$ chéo nhau"],"answer":"B","explain":"Tính chất: hai mặt phẳng song song bị cắt bởi mặt phẳng thứ ba thì giao tuyến song song với nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\parallel (Q)$, $A, B \\in (P)$, $A', B'$ lần lượt là hình chiếu song song của $A, B$ lên $(Q)$. Tứ giác $ABB'A'$ là:","options":["A. hình bình hành","B. hình chữ nhật","C. hình thang","D. tứ giác lồi bất kì"],"answer":"A","explain":"$AA' \\parallel BB'$ (cùng phương chiếu), $AB \\parallel A'B'$ (tính chất phép chiếu song song): hình bình hành.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình hộp $ABCD.A'B'C'D'$. Gọi $O, O'$ lần lượt là tâm của $ABCD$ và $A'B'C'D'$. Hình chiếu song song của $O$ lên $(A'B'C'D')$ theo phương $AA'$ là:","options":["A. $O'$","B. $B'$","C. $O$","D. $A'$"],"answer":"A","explain":"$OO' \\parallel AA'$ (tính chất hình hộp) nên đường qua $O$ song song $AA'$ cắt $(A'B'C'D')$ tại $O'$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$. Giao tuyến của hai mặt phẳng $(SAB)$ và $(SBC)$ là đường thẳng:","options":["A. $SA$","B. $AB$","C. $SB$","D. $AC$"],"answer":"C","explain":"Hai mặt phẳng có hai điểm chung $S, B$ nên giao tuyến là $SB$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hai mặt phẳng cùng song song với một mặt phẳng thứ ba thì song song với nhau.","b) Hai mặt phẳng không có điểm chung thì song song với nhau.","c) Nếu $(P)$ chứa hai đường thẳng song song cùng song song với $(Q)$ thì $(P) \\parallel (Q)$.","d) Nếu $a \\subset (P)$, $b \\subset (Q)$ và $(P) \\parallel (Q)$ thì $a \\parallel b$."],"answer":["T","T","F","F"],"explain":"a) Đúng: tính chất bắc cầu b) Đúng: định nghĩa hai mặt phẳng song song c) Sai: cần hai đường thẳng cắt nhau mới đủ kết luận d) Sai: $a, b$ có thể chéo nhau","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của tâm $O'$ của mặt trên là tâm $O$ của mặt dưới.","b) Ảnh của toàn bộ hình hộp là hình bình hành $ABCD$.","c) Ảnh của trung điểm của $A'B'$ là trung điểm của $AB$.","d) Ảnh của tam giác $A'B'D'$ là tam giác $ABD$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $OO' \\parallel AA'$ b) Đúng: mọi đỉnh đều chiếu xuống mặt đáy c) Đúng: bảo toàn trung điểm d) Đúng: bảo toàn tính thẳng hàng","points":1},{"type":"short","level":"NB","q":"Hình chóp có đáy là tứ giác có tất cả bao nhiêu mặt?","answer":"$5$","explain":"Số mặt $=$ số mặt bên $+$ mặt đáy $= 4 + 1 = 5$.","points":0.5},{"type":"short","level":"TH","q":"Cho tam giác $ABC$, $M \\in AB$, $N \\in AC$ sao cho $\\frac{AM}{MB} = \\frac{3}{3}$ và $MN \\parallel BC$. Tỉ số $\\frac{MN}{BC}$ bằng bao nhiêu?","answer":"$\\frac{1}{2}$","explain":"Theo định lí Thales: $\\frac{MN}{BC} = \\frac{AM}{AB} = \\frac{3}{3 + 3} = \\frac{1}{2}$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Hai đường thẳng $a, b$ không có điểm chung thì:","options":["A. chúng song song hoặc chéo nhau","B. chúng trùng nhau","C. chắc chắn chúng chéo nhau","D. chắc chắn chúng song song"],"answer":"A","explain":"Không có điểm chung chưa đủ: còn phải xét có đồng phẳng không (song song) hay không (chéo nhau).","points":0.25},{"type":"mcq","level":"NB","q":"Qua một điểm $M$ ngoài $(P)$ có bao nhiêu mặt phẳng song song với $(P)$?","options":["A. Một và chỉ một","B. Hai","C. Vô số","D. Không có"],"answer":"A","explain":"Qua $M$ dựng hai đường thẳng cắt nhau cùng song song với $(P)$; mặt phẳng xác định là duy nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tứ diện $ABCD$, $P$ là trung điểm $AC$, $Q$ là trung điểm $AD$. Đường thẳng $PQ$ song song với mặt phẳng:","options":["A. $(ABD)$","B. $(ACD)$","C. $(BCD)$","D. $(ABC)$"],"answer":"C","explain":"$PQ$ là đường trung bình của tam giác $ACD$ nên $PQ \\parallel CD \\subset (BCD)$: $PQ \\parallel (BCD)$.","points":0.25},{"type":"mcq","level":"TH","q":"Hình chóp $S.ABCD$ có bao nhiêu cạnh?","options":["A. $8$","B. $12$","C. $4$","D. $5$"],"answer":"A","explain":"Gồm $4$ cạnh bên $SA, SB, SC, SD$ và $4$ cạnh đáy: tổng $8$ cạnh.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lăng trụ $ABC.A'B'C'$. Khẳng định nào đúng?","options":["A. $(ABC) \\parallel (A'B'C')$","B. $(ABB'A') \\parallel (ABC)$","C. $AA' \\parallel (ABC)$ là sai","D. $(ABC)$ cắt $(A'B'C')$"],"answer":"A","explain":"Hai mặt đáy của lăng trụ song song với nhau.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$, $M \\in SA$, $N \\in SB$, $P \\in SC$ sao cho $\\frac{SM}{SA} = \\frac{SN}{SB} = \\frac{SP}{SC} = \\frac{1}{3}$. Mặt phẳng $(MNP)$ chia khối chóp thành hai phần. Tỉ số thể tích phần chứa $S$ và phần còn lại là:","options":["A. $\\frac{1}{26}$","B. $\\frac{1}{8}$","C. $\\frac{1}{27}$","D. $\\frac{1}{7}$"],"answer":"A","explain":"$(MNP) \\parallel (ABC)$ (Thales đảo). Khối $S.MNP$ đồng dạng khối $S.ABC$ tỉ số $\\frac{1}{3}$ nên $\\frac{V_{S.MNP}}{V_{S.ABC}} = \\frac{1}{27}$. Phần còn lại có thể tích $\\frac{26}{27}$: tỉ số $\\frac{1}{26}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của một đường thẳng song song với phương chiếu là một điểm.","b) Nếu $M'$ là ảnh của $M$ thì đường thẳng $MM'$ song song với phương chiếu.","c) Ảnh của hình bình hành là hình bình hành.","d) Phép chiếu song song biến đường tròn thành đường tròn."],"answer":["T","T","T","F"],"explain":"a) Đúng: mọi điểm trên đó có cùng ảnh b) Đúng: định nghĩa phép chiếu song song c) Đúng: bảo toàn tính song song của các cặp cạnh đối d) Sai: đường tròn chiếu xiên thành elip","points":1},{"type":"truefalse","level":"VDC","q":"Cho hình hộp $ABCD.A'B'C'D'$, xét phép chiếu song song theo phương $AA'$ lên mặt phẳng $(ABCD)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ảnh của tam giác $A'B'D'$ là tam giác $ABD$.","b) Ảnh của điểm $D'$ là $D$.","c) Ảnh của đường chéo $B'D'$ là đường chéo $BD$.","d) Ảnh của đoạn $A'C'$ là đoạn $AC$."],"answer":["T","T","T","T"],"explain":"a) Đúng: bảo toàn tính thẳng hàng b) Đúng: $DD' \\parallel AA'$ c) Đúng: mỗi đầu mút chiếu xuống đầu mút tương ứng d) Đúng: bảo toàn tính thẳng hàng và thứ tự","points":1},{"type":"short","level":"NB","q":"Qua điểm $M$ nằm ngoài $(P)$ có bao nhiêu mặt phẳng song song với $(P)$?","answer":"$1$","explain":"Mặt phẳng duy nhất.","points":0.5},{"type":"short","level":"TH","q":"Cho hình chóp $S.ABC$, $M$ là trung điểm của $AB$. Đường thẳng qua $M$ song song với $SB$ cắt mặt phẳng $(SAC)$ tại điểm nào?","answer":"trung điểm của $SA$","explain":"Trong tam giác $SAB$, đường qua $M$ song song $SB$ gặp $SA$ tại trung điểm của $SA$; điểm này thuộc $(SAC)$.","points":0.5}]}]}
