{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Khoảng cách giữa đường thẳng $a$ và mặt phẳng $(P)$ song song với nhau là:","options":["A. khoảng cách từ một điểm bất kì trên $(P)$ đến $a$","B. $0$","C. không xác định","D. khoảng cách từ một điểm bất kì trên $a$ đến $(P)$"],"answer":"D","explain":"Định nghĩa.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn vuông góc chung của hai đường thẳng chéo nhau:","options":["A. có một và chỉ một","B. có đúng hai","C. có vô số","D. không tồn tại"],"answer":"A","explain":"Tính chất: tồn tại duy nhất đoạn vuông góc chung.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$, $SA = a$, tam giác $ABC$ vuông tại $B$, $AB = a$. Khoảng cách từ $A$ đến $(SBC)$ bằng:","options":["A. $a$","B. $\\frac{2a\\sqrt{5}}{5}$","C. $\\frac{a\\sqrt{2}}{2}$","D. $\\frac{a}{2}$"],"answer":"C","explain":"$BC \\perp AB$, $BC \\perp SA$ nên $BC \\perp (SAB)$; kẻ $AH \\perp SB$ ($H$ trên $SB$) thì $AH \\perp (SBC)$ và $\\frac{1}{AH^2} = \\frac{1}{SA^2} + \\frac{1}{AB^2} = \\frac{2}{a^2}$, suy ra $AH = \\frac{a\\sqrt{2}}{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình hộp chữ nhật $ABCD.A'B'C'D'$ có $AB = a$, $AD = 2a$, $AA' = 3a$. Khoảng cách từ $A$ đến $(A'BD)$ bằng:","options":["A. $\\frac{3a}{2}$","B. $\\frac{6a}{7}$","C. $a$","D. $2a$"],"answer":"B","explain":"$\\frac{1}{d^2} = \\frac{1}{AB^2} + \\frac{1}{AD^2} + \\frac{1}{AA'^2} = \\frac{1}{a^2} + \\frac{1}{4a^2} + \\frac{1}{9a^2} = \\frac{49}{36a^2}$ nên $d = \\frac{6a}{7}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABCD$ có đáy là hình thoi cạnh $a$, $\\angle BAD = 60^\\circ$, $SA \\perp (ABCD)$, $SA = a$. Khoảng cách từ $A$ đến $(SBD)$ bằng:","options":["A. $a$","B. $\\frac{a\\sqrt{21}}{7}$","C. $\\frac{a}{2}$","D. $\\frac{a\\sqrt{3}}{3}$"],"answer":"B","explain":"$BD \\perp AO$ ($O$ là tâm hình thoi, $AO = \\frac{a\\sqrt{3}}{2}$), $BD \\perp SO$ nên $BD \\perp (SAO)$; kẻ $AK \\perp SO$ thì $AK \\perp (SBD)$ và $\\frac{1}{AK^2} = \\frac{1}{SA^2} + \\frac{1}{AO^2} = \\frac{7}{3a^2}$, suy ra $AK = \\frac{a\\sqrt{21}}{7}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp đều $S.ABCD$ có cạnh đáy $2a$, chiều cao $a\\sqrt{2}$. Khoảng cách từ tâm $O$ đến mặt bên $(SAB)$ bằng:","options":["A. $a$","B. $\\frac{a\\sqrt{6}}{3}$","C. $\\frac{2a\\sqrt{3}}{3}$","D. $a\\sqrt{2}$"],"answer":"B","explain":"$OM = a$ ($M$ là trung điểm $AB$); kẻ $OK \\perp SM$ thì $OK \\perp (SAB)$ và $\\frac{1}{OK^2} = \\frac{1}{SO^2} + \\frac{1}{OM^2} = \\frac{3}{2a^2}$, suy ra $OK = \\frac{a\\sqrt{6}}{3}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khoảng cách từ điểm đến mặt phẳng luôn nhỏ hơn khoảng cách từ điểm đó đến một điểm bất kì trên mặt phẳng.","b) Đoạn vuông góc chung của hai đường chéo nhau là duy nhất.","c) Cho $SA \\perp (ABC)$ thì $d(S, (ABC)) = SA$.","d) Nếu $a \\parallel (P)$ thì $d(a, (P)) = d(M, (P))$ với $M$ là điểm bất kì trên $a$."],"answer":["F","T","T","T"],"explain":"a) Sai: nhỏ hơn hoặc bằng (bằng khi trùng hình chiếu) b) Đúng: tính chất c) Đúng: định nghĩa d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khoảng cách giữa hai cạnh đối của tứ diện đều cạnh $a$ bằng $\\frac{a\\sqrt{2}}{2}$.","b) Khoảng cách giữa đường thẳng và mặt phẳng song song không phụ thuộc vào điểm chọn trên đường thẳng.","c) Cho hình chóp đều $S.ABCD$, khoảng cách từ $O$ đến các mặt bên đều bằng nhau.","d) Cho hình chóp $S.ABCD$ đáy là hình vuông cạnh $a$, $SA \\perp (ABCD)$, $SA = a$ thì $d(A, (SBD)) = \\frac{a\\sqrt{3}}{3}$."],"answer":["T","T","T","T"],"explain":"a) Đúng: đoạn nối hai trung điểm b) Đúng: định nghĩa c) Đúng: tính đối xứng d) Đúng: tính theo hệ thức lượng","points":1},{"type":"short","level":"NB","q":"Đoạn vuông góc chung của hai đường chéo nhau có mấy đoạn?","answer":"$1$","explain":"Tồn tại duy nhất.","points":0.5},{"type":"short","level":"TH","q":"Trong hình chóp $S.ABC$ có $SA \\perp (ABC)$, để tính $d(A, (SBC))$ ta thường kẻ thêm đường nào?","answer":"đường cao $AH$ của tam giác $SAB$ ($H$ trên $SB$) khi $BC \\perp (SAB)$","explain":"Phương pháp.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Cho $M \\notin (P)$, $H$ là hình chiếu của $M$ lên $(P)$. Khẳng định nào đúng?","options":["A. không so sánh được","B. $MH$ nhỏ hơn $d(M, (P))$","C. $MH = d(M, (P))$","D. $MH$ lớn hơn $d(M, (P))$"],"answer":"C","explain":"Định nghĩa khoảng cách.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $(P) \\parallel (Q)$, $M \\in (P)$. Khoảng cách giữa $(P), (Q)$ bằng:","options":["A. $d(M, (Q))$","B. $0$","C. $d(M, (P))$","D. không xác định"],"answer":"A","explain":"Định nghĩa.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABCD$ có đáy là hình vuông cạnh $a$, $SA \\perp (ABCD)$, $SA = a$. Khoảng cách từ $A$ đến $(SBD)$ bằng:","options":["A. $\\frac{a\\sqrt{2}}{2}$","B. $\\frac{a\\sqrt{3}}{3}$","C. $a$","D. $\\frac{a}{3}$"],"answer":"B","explain":"Kẻ $AO \\perp BD$ ($O$ là tâm đáy), $AK \\perp SO$: $AO = \\frac{a\\sqrt{2}}{2}$; $\\frac{1}{AK^2} = \\frac{1}{SA^2} + \\frac{1}{AO^2} = \\frac{1}{a^2} + \\frac{2}{a^2} = \\frac{3}{a^2}$ nên $AK = \\frac{a\\sqrt{3}}{3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABCD$ có đáy là hình chữ nhật, $AB = a$, $AD = 2a$, $SA \\perp (ABCD)$, $SA = a$. Khoảng cách từ $A$ đến $(SCD)$ bằng:","options":["A. $\\frac{a}{2}$","B. $\\frac{a\\sqrt{2}}{2}$","C. $a$","D. $\\frac{2a\\sqrt{5}}{5}$"],"answer":"D","explain":"$CD \\perp AD$, $CD \\perp SA$ nên $CD \\perp (SAD)$; kẻ $AH \\perp SD$ ($H$ trên $SD$) thì $AH \\perp (SCD)$ và $\\frac{1}{AH^2} = \\frac{1}{SA^2} + \\frac{1}{AD^2} = \\frac{5}{4a^2}$, suy ra $AH = \\frac{2a\\sqrt{5}}{5}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABCD$ có đáy là hình vuông cạnh $a$, $SA \\perp (ABCD)$, $SA = 2a$. Khoảng cách giữa hai đường thẳng $AB$ và $SD$ bằng:","options":["A. $a$","B. $\\frac{2a\\sqrt{5}}{5}$","C. $2a$","D. $\\frac{a\\sqrt{5}}{5}$"],"answer":"B","explain":"$AB \\parallel CD$ nên $d(AB, SD) = d(AB, (SCD)) = d(A, (SCD))$; $CD \\perp (SAD)$, kẻ $AH \\perp SD$: $\\frac{1}{AH^2} = \\frac{1}{4a^2} + \\frac{1}{a^2} = \\frac{5}{4a^2}$ nên $AH = \\frac{2a\\sqrt{5}}{5}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp đều $S.ABCD$ có cạnh đáy $2a$, chiều cao $a\\sqrt{2}$. Khoảng cách từ tâm $O$ đến mặt bên $(SAB)$ bằng:","options":["A. $\\frac{2a\\sqrt{3}}{3}$","B. $a\\sqrt{2}$","C. $\\frac{a\\sqrt{6}}{3}$","D. $a$"],"answer":"C","explain":"$OM = a$ ($M$ là trung điểm $AB$); kẻ $OK \\perp SM$ thì $OK \\perp (SAB)$ và $\\frac{1}{OK^2} = \\frac{1}{SO^2} + \\frac{1}{OM^2} = \\frac{3}{2a^2}$, suy ra $OK = \\frac{a\\sqrt{6}}{3}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khoảng cách giữa hai đường thẳng chéo nhau bằng độ dài đoạn vuông góc chung.","b) Công thức $\\frac{1}{d^2} = \\frac{1}{a^2} + \\frac{1}{b^2} + \\frac{1}{c^2}$ tính khoảng cách trong tứ diện vuông.","c) Nếu $d(a, (P)) = 0$ với $a \\parallel (P)$ thì $a \\subset (P)$.","d) Nếu $M \\in (P)$ thì $d(M, (P)) = 0$."],"answer":["T","T","T","T"],"explain":"a) Đúng: định nghĩa b) Đúng: mở rộng của hệ thức lượng c) Đúng: suy luận d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho hình chóp đều $S.ABCD$, khoảng cách từ $O$ đến các mặt bên đều bằng nhau.","b) Nếu hai đường thẳng chéo nhau cùng vuông góc với một mặt phẳng thì khoảng cách giữa chúng bằng $0$.","c) Trong hình lập phương cạnh $a$, $d(A, (A'BD)) = \\frac{a\\sqrt{3}}{3}$.","d) Khoảng cách giữa đường thẳng và mặt phẳng song song không phụ thuộc vào điểm chọn trên đường thẳng."],"answer":["T","F","T","T"],"explain":"a) Đúng: tính đối xứng b) Sai: hai đường cùng vuông góc với một mặt phẳng thì song song, không chéo nhau c) Đúng: bằng $\\frac{1}{3}AC'$ d) Đúng: định nghĩa","points":1},{"type":"short","level":"NB","q":"Khoảng cách giữa đường thẳng $a$ và $(P)$ song song được tính thế nào?","answer":"lấy một điểm trên $a$, tính khoảng cách đến $(P)$","explain":"Định nghĩa.","points":0.5},{"type":"short","level":"TH","q":"Cho $AB \\parallel (P)$. $d(AB, (P))$ bằng $d(M, (P))$ với $M$ là điểm nào?","answer":"điểm bất kì trên $AB$","explain":"Định nghĩa.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Kí hiệu khoảng cách từ điểm $M$ đến mặt phẳng $(P)$ là:","options":["A. $|MP|$","B. $d(M, (P))$","C. $MH$","D. $d(M, P)$ viết thiếu ngoặc"],"answer":"B","explain":"Kí hiệu chuẩn: $d(M, (P))$.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn vuông góc chung của hai đường thẳng chéo nhau:","options":["A. có vô số","B. không tồn tại","C. có một và chỉ một","D. có đúng hai"],"answer":"C","explain":"Tính chất: tồn tại duy nhất đoạn vuông góc chung.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Khoảng cách từ $B$ đến mặt phẳng $(ACD')$... khoảng cách từ $A$ đến $(A'BD)$ bằng:","options":["A. $\\frac{a\\sqrt{3}}{2}$","B. $a$","C. $\\frac{a\\sqrt{3}}{3}$","D. $\\frac{a}{2}$"],"answer":"C","explain":"$AC' \\perp (A'BD)$ và $AC'$ bị $(A'BD)$ chia theo tỉ lệ $2:1$... $d(A, (A'BD)) = \\frac{1}{3}AC' = \\frac{a\\sqrt{3}}{3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp đều $S.ABCD$ có cạnh đáy $a$, cạnh bên $a\\sqrt{2}$. Khoảng cách từ $O$ (tâm đáy) đến $(SAB)$ bằng:","options":["A. $\\frac{a\\sqrt{6}}{6}$","B. $\\frac{a}{2}$","C. $a$","D. $\\frac{a\\sqrt{42}}{14}$"],"answer":"D","explain":"$SO = \\sqrt{SB^2 - OB^2} = \\sqrt{2a^2 - \\frac{a^2}{2}} = \\frac{a\\sqrt{6}}{2}$, $OM = \\frac{a}{2}$ ($M$ là trung điểm $AB$); kẻ $OK \\perp SM$ thì $OK \\perp (SAB)$ và $\\frac{1}{OK^2} = \\frac{1}{SO^2} + \\frac{1}{OM^2} = \\frac{14}{3a^2}$, suy ra $OK = \\frac{a\\sqrt{42}}{14}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Khoảng cách giữa hai đường thẳng $AB$ và $B'C'$ bằng:","options":["A. $a\\sqrt{2}$","B. $2a$","C. $\\frac{a}{2}$","D. $a$"],"answer":"D","explain":"$AB, B'C'$ chéo nhau; $BB' \\perp AB$, $BB' \\perp B'C'$ nên $BB'$ là đoạn vuông góc chung, độ dài $a$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Khoảng cách từ $C'$ đến $(A'BD)$ bằng:","options":["A. $a$","B. $\\frac{a\\sqrt{3}}{3}$","C. $\\frac{2a\\sqrt{3}}{3}$","D. $\\frac{a}{2}$"],"answer":"C","explain":"$d(C', (A'BD)) = 2 \\cdot d(A, (A'BD)) = \\frac{2a\\sqrt{3}}{3}$ (vì $AC'$ bị chia tỉ lệ $1:2$).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho hình lập phương cạnh $a$, khoảng cách giữa hai mặt đáy bằng $a$.","b) Nếu $d(a, (P)) = 0$ với $a \\parallel (P)$ thì $a \\subset (P)$.","c) Khoảng cách giữa hai đường thẳng chéo nhau bằng độ dài đoạn vuông góc chung.","d) Khoảng cách từ điểm đến mặt phẳng luôn nhỏ hơn khoảng cách từ điểm đó đến một điểm bất kì trên mặt phẳng."],"answer":["T","T","T","F"],"explain":"a) Đúng: bằng cạnh bên b) Đúng: suy luận c) Đúng: định nghĩa d) Sai: nhỏ hơn hoặc bằng (bằng khi trùng hình chiếu)","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu hai đường thẳng chéo nhau cùng vuông góc với một mặt phẳng thì khoảng cách giữa chúng bằng $0$.","b) Cho tứ diện $OABC$ vuông tại $O$, $OA = OB = OC = a$ thì $d(O, (ABC)) = \\frac{a\\sqrt{3}}{3}$.","c) Cho $AB \\parallel (P)$, $C \\in AB$ thì $d(C, (P)) = d(AB, (P))$.","d) Khoảng cách giữa đường thẳng và mặt phẳng song song không phụ thuộc vào điểm chọn trên đường thẳng."],"answer":["F","T","T","T"],"explain":"a) Sai: hai đường cùng vuông góc với một mặt phẳng thì song song, không chéo nhau b) Đúng: công thức c) Đúng: định nghĩa d) Đúng: định nghĩa","points":1},{"type":"short","l $a$","B. $\\frac{a\\sqrt{3}}{2}$","C. $\\frac{a}{2}$","D. $\\frac{a\\sqrt{2}}{2}$"],"answer":"D","explain":"Gọi $M, N$ là trung điểm $AB, CD$: $MN$ là đoạn vuông góc chung, $MN = \\frac{a\\sqrt{2}}{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp đều $S.ABCD$ có cạnh đáy $2a$, chiều cao $a\\sqrt{2}$. Khoảng cách từ tâm $O$ đến mặt bên $(SAB)$ bằng:","options":["A. $\\frac{2a\\sqrt{3}}{3}$","B. $a\\sqrt{2}$","C. $a$","D. $\\frac{a\\sqrt{6}}{3}$"],"answer":"D","explain":"$OM = a$ ($M$ là trung điểm $AB$); kẻ $OK \\perp SM$ thì $OK \\perp (SAB)$ và $\\frac{1}{OK^2} = \\frac{1}{SO^2} + \\frac{1}{OM^2} = \\frac{3}{2a^2}$, suy ra $OK = \\frac{a\\sqrt{6}}{3}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trong hình chóp $S.ABC$ có $SA \\perp (ABC)$, $d(A, (SBC))$ là độ dài đường cao $AH$ của tam giác $SAB$ ($H$ trên $SB$).","b) Đoạn vuông góc chung của hai đường chéo nhau là duy nhất.","c) Cho hình lập phương cạnh $a$, khoảng cách giữa hai mặt đáy bằng $a$.","d) Khoảng cách từ $M$ đến $(P)$ là độ dài đoạn $MH$ với $H$ là hình chiếu của $M$ lên $(P)$."],"answer":["F","T","T","T"],"explain":"a) Sai: chỉ đúng khi $BC \\perp (SAB)$; trong trường hợp tổng quát $AH$ kẻ trong $(SAB)$ chưa chắc vuông góc $(SBC)$ b) Đúng: tính chất c) Đúng: bằng cạnh bên d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho hình chóp đều $S.ABCD$, khoảng cách từ $O$ đến các mặt bên đều bằng nhau.","b) Cho tứ diện $OABC$ vuông tại $O$, $OA = OB = OC = a$ thì $d(O, (ABC)) = \\frac{a\\sqrt{3}}{3}$.","c) Khoảng cách giữa hai cạnh đối của tứ diện đều cạnh $a$ bằng $\\frac{a\\sqrt{2}}{2}$.","d) Nếu hai đường thẳng chéo nhau cùng vuông góc với một mặt phẳng thì khoảng cách giữa chúng bằng $0$."],"answer":["T","T","T","F"],"explain":"a) Đúng: tính đối xứng b) Đúng: công thức c) Đúng: đoạn nối hai trung điểm d) Sai: hai đường cùng vuông góc với một mặt phẳng thì song song, không chéo nhau","points":1},{"type":"short","level":"NB","q":"Kí hiệu khoảng cách từ $M$ đến $(P)$ là gì?","answer":"$d(M, (P))$","explain":"Kí hiệu chuẩn.","points":0.5},{"type":"short","level":"TH","q":"Cho tứ diện $OABC$ vuông tại $O$, $OA = OB = OC = a$. $d(O, (ABC))$ bằng bao nhiêu? (viết $\\frac{a\\sqrt{3}}{3}$)","answer":"$\\frac{a\\sqrt{3}}{3}$","explain":"$\\frac{1}{d^2} = \\frac{3}{a^2}$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Khoảng cách từ điểm $M$ đến mặt phẳng $(P)$ là:","options":["A. độ dài đoạn $MA$ với $A$ là điểm bất kì trên $(P)$","B. khoảng cách từ $M$ đến một đường thẳng trong $(P)$","C. $0$","D. độ dài đoạn $MH$ với $H$ là hình chiếu vuông góc của $M$ lên $(P)$"],"answer":"D","explain":"Định nghĩa khoảng cách từ điểm đến mặt phẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Khoảng cách từ $A$ đến $(A'B'C'D')$ bằng:","options":["A. $a\\sqrt{2}$","B. $a\\sqrt{3}$","C. $\\frac{a}{2}$","D. $a$"],"answer":"D","explain":"$AA' \\perp (A'B'C'D')$ nên khoảng cách bằng $AA' = a$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lăng trụ đứng $ABC.A'B'C'$ có đáy là tam giác vuông tại $A$, $AB = a$, $AC = a\\sqrt{3}$. Khoảng cách từ $A$ đến $(BCC'B')$ bằng:","options":["A. $a\\sqrt{3}$","B. $a$","C. $\\frac{a}{2}$","D. $\\frac{a\\sqrt{3}}{2}$"],"answer":"D","explain":"Kẻ $AH \\perp BC$: $AH = \\frac{AB \\cdot AC}{BC} = \\frac{a \\cdot a\\sqrt{3}}{2a} = \\frac{a\\sqrt{3}}{2}$; $AH \\perp (BCC'B')$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tứ diện $ABCD$ có $AB \\perp (BCD)$, $AB = a$, $BC = a$, $CD = a\\sqrt{3}$, $\\angle BCD = 90^\\circ$. Khoảng cách từ $B$ đến $(ACD)$ bằng:","options":["A. $a$","B. $\\frac{a}{2}$","C. $\\frac{a\\sqrt{21}}{7}$","D. $\\frac{a\\sqrt{3}}{2}$"],"answer":"C","explain":"$BD = 2a$; kẻ $BH \\perp CD$: $BH = \\frac{BC \\cdot CD}{BD} = \\frac{a\\sqrt{3}}{2}$; $CD \\perp BH$, $CD \\perp AB$ nên $CD \\perp (ABH)$; kẻ $BK \\perp AH$ thì $BK \\perp (ACD)$ và $BK = \\frac{AB \\cdot BH}{\\sqrt{AB^2 + BH^2}} = \\frac{a\\sqrt{21}}{7}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Khoảng cách giữa $AC$ và $B'D'$ bằng:","options":["A. $\\frac{a}{2}$","B. $0$","C. $a$","D. $a\\sqrt{2}$"],"answer":"C","explain":"$AC \\parallel A'C'$, $B'D' \\perp A'C'$... $OO'$ ($O, O'$ là tâm hai đáy) là đoạn vuông góc chung, độ dài $a$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp đều $S.ABCD$ có cạnh đáy $2a$, chiều cao $a\\sqrt{2}$. Khoảng cách từ tâm $O$ đến mặt bên $(SAB)$ bằng:","options":["A. $\\frac{2a\\sqrt{3}}{3}$","B. $\\frac{a\\sqrt{6}}{3}$","C. $a\\sqrt{2}$","D. $a$"],"answer":"B","explain":"$OM = a$ ($M$ là trung điểm $AB$); kẻ $OK \\perp SM$ thì $OK \\perp (SAB)$ và $\\frac{1}{OK^2} = \\frac{1}{SO^2} + \\frac{1}{OM^2} = \\frac{3}{2a^2}$, suy ra $OK = \\frac{a\\sqrt{6}}{3}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công thức $\\frac{1}{d^2} = \\frac{1}{a^2} + \\frac{1}{b^2} + \\frac{1}{c^2}$ tính khoảng cách trong tứ diện vuông.","b) Đoạn vuông góc chung của hai đường chéo nhau là duy nhất.","c) Khoảng cách giữa hai đường thẳng chéo nhau bằng độ dài đoạn vuông góc chung.","d) Cho $SA \\perp (ABC)$ thì $d(S, (ABC)) = SA$."],"answer":["T","T","T","T"],"explain":"a) Đúng: mở rộng của hệ thức lượng b) Đúng: tính chất c) Đúng: định nghĩa d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu hai đường thẳng chéo nhau cùng vuông góc với một mặt phẳng thì khoảng cách giữa chúng bằng $0$.","b) Cho tứ diện $OABC$ vuông tại $O$, $OA = OB = OC = a$ thì $d(O, (ABC)) = \\frac{a\\sqrt{3}}{3}$.","c) Trong hình lập phương cạnh $a$, $d(A, (A'BD)) = \\frac{a\\sqrt{3}}{3}$.","d) Cho hình chóp $S.ABCD$ đáy là hình vuông cạnh $a$, $SA \\perp (ABCD)$, $SA = a$ thì $d(A, (SBD)) = \\frac{a\\sqrt{3}}{3}$."],"answer":["F","T","T","T"],"explain":"a) Sai: hai đường cùng vuông góc với một mặt phẳng thì song song, không chéo nhau b) Đúng: công thức c) Đúng: bằng $\\frac{1}{3}AC'$ d) Đúng: tính theo hệ thức lượng","points":1},{"type":"short","level":"NB","q":"Cho $(P) \\parallel (Q)$. $d((P), (Q))$ có phụ thuộc điểm chọn không?","answer":"Không","explain":"Định nghĩa.","points":0.5},{"type":"short","level":"TH","q":"Đường cao $SH$ của hình chóp có độ dài bằng khoảng cách nào?","answer":"$d(S, \\text{mặt đáy})$","explain":"Định nghĩa.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Khoảng cách giữa đường thẳng $a$ và mặt phẳng $(P)$ song song với nhau là:","options":["A. không xác định","B. khoảng cách từ một điểm bất kì trên $(P)$ đến $a$","C. $0$","D. khoảng cách từ một điểm bất kì trên $a$ đến $(P)$"],"answer":"D","explain":"Định nghĩa.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hình chóp $S.ABCD$ có đáy là hình vuông, $SA \\perp (ABCD)$. Khoảng cách từ $A$ đến $(SBC)$ là độ dài đoạn nào? (Biết $AH \\perp SB$, $H$ trên $SB$)","options":["A. $AB$","B. $AH$","C. $AC$","D. $AS$"],"answer":"B","explain":"$BC \\perp (SAB)$ nên $(SBC) \\perp (SAB)$; kẻ $AH \\perp SB$ thì $AH \\perp (SBC)$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều cạnh $a$, $SA \\perp (ABC)$, $SA = a$. Khoảng cách từ $A$ đến $(SBC)$ bằng:","options":["A. $\\frac{a\\sqrt{21}}{7}$","B. $\\frac{a\\sqrt{3}}{3}$","C. $a$","D. $\\frac{a}{2}$"],"answer":"A","explain":"Gọi $M$ là trung điểm $BC$: $AM = \\frac{a\\sqrt{3}}{2}$; kẻ $AK \\perp SM$: $\\frac{1}{AK^2} = \\frac{1}{SA^2} + \\frac{1}{AM^2} = \\frac{1}{a^2} + \\frac{4}{3a^2} = \\frac{7}{3a^2}$ nên $AK = \\frac{a\\sqrt{21}}{7}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp đều $S.ABCD$ có cạnh đáy $a$, cạnh bên $a\\sqrt{2}$. Khoảng cách từ $O$ (tâm đáy) đến $(SAB)$ bằng:","options":["A. $\\frac{a\\sqrt{42}}{14}$","B. $\\frac{a\\sqrt{6}}{6}$","C. $\\frac{a}{2}$","D. $a$"],"answer":"A","explain":"$SO = \\sqrt{SB^2 - OB^2} = \\sqrt{2a^2 - \\frac{a^2}{2}} = \\frac{a\\sqrt{6}}{2}$, $OM = \\frac{a}{2}$ ($M$ là trung điểm $AB$); kẻ $OK \\perp SM$ thì $OK \\perp (SAB)$ và $\\frac{1}{OK^2} = \\frac{1}{SO^2} + \\frac{1}{OM^2} = \\frac{14}{3a^2}$, suy ra $OK = \\frac{a\\sqrt{42}}{14}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều cạnh $a$, $O$ là trọng tâm, $SO \\perp (ABC)$, $SO = a$. Khoảng cách từ $O$ đến $(SBC)$ bằng:","options":["A. $\\frac{a\\sqrt{13}}{13}$","B. $\\frac{a\\sqrt{21}}{7}$","C. $a$","D. $\\frac{a}{2}$"],"answer":"A","explain":"$OM = \\frac{a\\sqrt{3}}{6}$ ($M$ là trung điểm $BC$); kẻ $OK \\perp SM$ thì $OK \\perp (SBC)$ và $\\frac{1}{OK^2} = \\frac{1}{SO^2} + \\frac{1}{OM^2} = \\frac{13}{a^2}$, suy ra $OK = \\frac{a\\sqrt{13}}{13}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Khoảng cách từ $C'$ đến $(A'BD)$ bằng:","options":["A. $\\frac{2a\\sqrt{3}}{3}$","B. $\\frac{a\\sqrt{3}}{3}$","C. $\\frac{a}{2}$","D. $a$"],"answer":"A","explain":"$d(C', (A'BD)) = 2 \\cdot d(A, (A'BD)) = \\frac{2a\\sqrt{3}}{3}$ (vì $AC'$ bị chia tỉ lệ $1:2$).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho hình lập phương cạnh $a$, khoảng cách giữa hai mặt đáy bằng $a$.","b) Cho $SA \\perp (ABC)$ thì $d(S, (ABC)) = SA$.","c) Đoạn vuông góc chung của hai đường chéo nhau là duy nhất.","d) Khoảng cách từ $M$ đến $(P)$ là độ dài đoạn $MH$ với $H$ là hình chiếu của $M$ lên $(P)$."],"answer":["T","T","T","T"],"explain":"a) Đúng: bằng cạnh bên b) Đúng: định nghĩa c) Đúng: tính chất d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đường cao của hình chóp bằng khoảng cách từ đỉnh đến mặt đáy.","b) Khoảng cách giữa hai cạnh đối của tứ diện đều cạnh $a$ bằng $\\frac{a\\sqrt{2}}{2}$.","c) Nếu hai đường thẳng chéo nhau cùng vuông góc với một mặt phẳng thì khoảng cách giữa chúng bằng $0$.","d) Khoảng cách giữa đường thẳng và mặt phẳng song song không phụ thuộc vào điểm chọn trên đường thẳng."],"answer":["T","T","F","T"],"explain":"a) Đúng: định nghĩa b) Đúng: đoạn nối hai trung điểm c) Sai: hai đường cùng vuông góc với một mặt phẳng thì song song, không chéo nhau d) Đúng: định nghĩa","points":1},{"type":"short","level":"NB","q":"Khoảng cách từ $M$ đến $(P)$ là độ dài đoạn nào?","answer":"$MH$ với $H$ là hình chiếu của $M$ lên $(P)$","explain":"Định nghĩa.","points":0.5},{"type":"short","level":"TH","q":"Cho hình chóp $S.ABCD$ đáy là hình vuông cạnh $a$, $SA \\perp (ABCD)$, $SA = a$. $d(A, (SBD))$ bằng bao nhiêu? (viết $\\frac{a\\sqrt{3}}{3}$)","answer":"$\\frac{a\\sqrt{3}}{3}$","explain":"Hệ thức lượng trong tam giác $SAO$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Khoảng cách giữa hai mặt phẳng song song $(P), (Q)$ là:","options":["A. khoảng cách từ một điểm bất kì trên $(P)$ đến $(Q)$","B. khoảng cách giữa hai đường thẳng bất kì","C. $0$","D. khoảng cách giữa hai điểm bất kì"],"answer":"A","explain":"Định nghĩa.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$. Khoảng cách từ $S$ đến $(ABC)$ bằng:","options":["A. $SB$","B. $SC$","C. $AB$","D. $SA$"],"answer":"D","explain":"$SA \\perp (ABC)$ nên $d(S, (ABC)) = SA$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Khoảng cách từ $B$ đến mặt phẳng $(ACD')$... khoảng cách từ $A$ đến $(A'BD)$ bằng:","options":["A. $\\frac{a}{2}$","B. $a$","C. $\\frac{a\\sqrt{3}}{3}$","D. $\\frac{a\\sqrt{3}}{2}$"],"answer":"C","explain":"$AC' \\perp (A'BD)$ và $AC'$ bị $(A'BD)$ chia theo tỉ lệ $2:1$... $d(A, (A'BD)) = \\frac{1}{3}AC' = \\frac{a\\sqrt{3}}{3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABCD$ có đáy là hình chữ nhật, $AB = a$, $AD = 2a$, $SA \\perp (ABCD)$, $SA = a$. Khoảng cách từ $A$ đến $(SCD)$ bằng:","options":["A. $\\frac{a\\sqrt{2}}{2}$","B. $\\frac{a}{2}$","C. $\\frac{2a\\sqrt{5}}{5}$","D. $a$"],"answer":"C","explain":"$CD \\perp AD$, $CD \\perp SA$ nên $CD \\perp (SAD)$; kẻ $AH \\perp SD$ ($H$ trên $SD$) thì $AH \\perp (SCD)$ và $\\frac{1}{AH^2} = \\frac{1}{SA^2} + \\frac{1}{AD^2} = \\frac{5}{4a^2}$, suy ra $AH = \\frac{2a\\sqrt{5}}{5}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABCD$ có đáy là hình thoi cạnh $a$, $\\angle BAD = 60^\\circ$, $SA \\perp (ABCD)$, $SA = a$. Khoảng cách từ $A$ đến $(SBD)$ bằng:","options":["A. $\\frac{a\\sqrt{21}}{7}$","B. $a$","C. $\\frac{a}{2}$","D. $\\frac{a\\sqrt{3}}{3}$"],"answer":"A","explain":"$BD \\perp AO$ ($O$ là tâm hình thoi, $AO = \\frac{a\\sqrt{3}}{2}$), $BD \\perp SO$ nên $BD \\perp (SAO)$; kẻ $AK \\perp SO$ thì $AK \\perp (SBD)$ và $\\frac{1}{AK^2} = \\frac{1}{SA^2} + \\frac{1}{AO^2} = \\frac{7}{3a^2}$, suy ra $AK = \\frac{a\\sqrt{21}}{7}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Khoảng cách từ $C'$ đến $(A'BD)$ bằng:","options":["A. $a$","B. $\\frac{a}{2}$","C. $\\frac{a\\sqrt{3}}{3}$","D. $\\frac{2a\\sqrt{3}}{3}$"],"answer":"D","explain":"$d(C', (A'BD)) = 2 \\cdot d(A, (A'BD)) = \\frac{2a\\sqrt{3}}{3}$ (vì $AC'$ bị chia tỉ lệ $1:2$).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $M \\in (P)$ thì $d(M, (P)) = 0$.","b) Khoảng cách giữa hai đường thẳng chéo nhau bằng độ dài đoạn vuông góc chung.","c) Trong hình chóp $S.ABC$ có $SA \\perp (ABC)$, $d(A, (SBC))$ là độ dài đường cao $AH$ của tam giác $SAB$ ($H$ trên $SB$).","d) Nếu $d(a, (P)) = 0$ với $a \\parallel (P)$ thì $a \\subset (P)$."],"answer":["T","T","F","T"],"explain":"a) Đúng: định nghĩa b) Đúng: định nghĩa c) Sai: chỉ đúng khi $BC \\perp (SAB)$; trong trường hợp tổng quát $AH$ kẻ trong $(SAB)$ chưa chắc vuông góc $(SBC)$ d) Đúng: suy luận","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khoảng cách giữa đường thẳng và mặt phẳng song song không phụ thuộc vào điểm chọn trên đường thẳng.","b) Trong hình hộp chữ nhật, khoảng cách từ một đỉnh đến mặt phẳng chứa ba đỉnh kề được tính bằng công thức nghịch đảo bình phương.","c) Cho $AB \\parallel (P)$, $C \\in AB$ thì $d(C, (P)) = d(AB, (P))$.","d) Đường cao của hình chóp bằng khoảng cách từ đỉnh đến mặt đáy."],"answer":["T","T","T","T"],"explain":"a) Đúng: định nghĩa b) Đúng: tứ diện vuông tại đỉnh c) Đúng: định nghĩa d) Đúng: định nghĩa","points":1},{"type":"short","level":"NB","q":"Cho hình lập phương cạnh $a$. Khoảng cách giữa hai mặt đáy bằng bao nhiêu?","answer":"$a$","explain":"Bằng cạnh bên.","points":0.5},{"type":"short","level":"TH","q":"Cho hình hộp chữ nhật có ba kích thước $a, b, c$. Khoảng cách từ một đỉnh đến mặt phẳng qua ba đỉnh kề thỏa mãn hệ thức nào?","answer":"$\\frac{1}{d^2} = \\frac{1}{a^2} + \\frac{1}{b^2} + \\frac{1}{c^2}$","explain":"Mở rộng hệ thức lượng.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Kí hiệu khoảng cách từ điểm $M$ đến mặt phẳng $(P)$ là:","options":["A. $d(M, P)$ viết thiếu ngoặc","B. $d(M, (P))$","C. $MH$","D. $|MP|$"],"answer":"B","explain":"Kí hiệu chuẩn: $d(M, (P))$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$. Khoảng cách từ $S$ đến $(ABC)$ bằng:","options":["A. $SB$","B. $SA$","C. $SC$","D. $AB$"],"answer":"B","explain":"$SA \\perp (ABC)$ nên $d(S, (ABC)) = SA$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tứ diện $OABC$ có $OA, OB, OC$ đôi một vuông góc, $OA = OB = OC = a$. Khoảng cách từ $O$ đến $(ABC)$ bằng:","options":["A. $a$","B. $\\frac{a}{3}$","C. $\\frac{a\\sqrt{3}}{3}$","D. $\\frac{a\\sqrt{2}}{2}$"],"answer":"C","explain":"$\\frac{1}{d^2} = \\frac{1}{OA^2} + \\frac{1}{OB^2} + \\frac{1}{OC^2} = \\frac{3}{a^2}$ nên $d = \\frac{a\\sqrt{3}}{3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tứ diện $ABCD$ có $AB \\perp (BCD)$, $AB = a$, $BC = a$, $CD = a\\sqrt{3}$, $\\angle BCD = 90^\\circ$. Khoảng cách từ $B$ đến $(ACD)$ bằng:","options":["A. $\\frac{a\\sqrt{3}}{2}$","B. $\\frac{a\\sqrt{21}}{7}$","C. $a$","D. $\\frac{a}{2}$"],"answer":"B","explain":"$BD = 2a$; kẻ $BH \\perp CD$: $BH = \\frac{BC \\cdot CD}{BD} = \\frac{a\\sqrt{3}}{2}$; $CD \\perp BH$, $CD \\perp AB$ nên $CD \\perp (ABH)$; kẻ $BK \\perp AH$ thì $BK \\perp (ACD)$ và $BK = \\frac{AB \\cdot BH}{\\sqrt{AB^2 + BH^2}} = \\frac{a\\sqrt{21}}{7}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều cạnh $a$, $O$ là trọng tâm, $SO \\perp (ABC)$, $SO = a$. Khoảng cách từ $O$ đến $(SBC)$ bằng:","options":["A. $a$","B. $\\frac{a\\sqrt{13}}{13}$","C. $\\frac{a}{2}$","D. $\\frac{a\\sqrt{21}}{7}$"],"answer":"B","explain":"$OM = \\frac{a\\sqrt{3}}{6}$ ($M$ là trung điểm $BC$); kẻ $OK \\perp SM$ thì $OK \\perp (SBC)$ và $\\frac{1}{OK^2} = \\frac{1}{SO^2} + \\frac{1}{OM^2} = \\frac{13}{a^2}$, suy ra $OK = \\frac{a\\sqrt{13}}{13}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Khoảng cách từ $C'$ đến $(A'BD)$ bằng:","options":["A. $\\frac{a}{2}$","B. $a$","C. $\\frac{2a\\sqrt{3}}{3}$","D. $\\frac{a\\sqrt{3}}{3}$"],"answer":"C","explain":"$d(C', (A'BD)) = 2 \\cdot d(A, (A'BD)) = \\frac{2a\\sqrt{3}}{3}$ (vì $AC'$ bị chia tỉ lệ $1:2$).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $d(a, (P)) = 0$ với $a \\parallel (P)$ thì $a \\subset (P)$.","b) Khoảng cách giữa hai đường thẳng chéo nhau bằng độ dài đoạn vuông góc chung.","c) Khoảng cách từ $M$ đến $(P)$ là độ dài đoạn $MH$ với $H$ là hình chiếu của $M$ lên $(P)$.","d) Khoảng cách giữa hai mặt phẳng song song bằng $0$."],"answer":["T","T","T","F"],"explain":"a) Đúng: suy luận b) Đúng: định nghĩa c) Đúng: định nghĩa d) Sai: bằng khoảng cách từ một điểm trên mặt này đến mặt kia","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $M$ là trung điểm của $AB$ thì $d(M, (P)) = \\frac{1}{2}(d(A, (P)) + d(B, (P))$ khi $A, B$ cùng phía với $(P)$.","b) Nếu hai đường thẳng chéo nhau cùng vuông góc với một mặt phẳng thì khoảng cách giữa chúng bằng $0$.","c) Cho $AB \\parallel (P)$, $C \\in AB$ thì $d(C, (P)) = d(AB, (P))$.","d) Trong hình lập phương cạnh $a$, $d(A, (A'BD)) = \\frac{a\\sqrt{3}}{3}$."],"answer":["T","F","T","T"],"explain":"a) Đúng: tính chất đường trung bình b) Sai: hai đường cùng vuông góc với một mặt phẳng thì song song, không chéo nhau c) Đúng: định nghĩa d) Đúng: bằng $\\frac{1}{3}AC'$","points":1},{"type":"short","level":"NB","q":"Khoảng cách giữa hai mặt phẳng song song được tính bằng cách nào?","answer":"khoảng cách từ một điểm trên mặt này đến mặt kia","explain":"Định nghĩa.","points":0.5},{"type":"short","level":"TH","q":"Nếu $M$ là trung điểm $AB$, $A, B$ cùng phía với $(P)$ thì $d(M, (P))$ bằng gì?","answer":"trung bình cộng của $d(A, (P))$ và $d(B, (P))$","explain":"Đường trung bình.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cho $M \\notin (P)$, $H$ là hình chiếu của $M$ lên $(P)$. Khẳng định nào đúng?","options":["A. $MH = d(M, (P))$","B. $MH$ nhỏ hơn $d(M, (P))$","C. không so sánh được","D. $MH$ lớn hơn $d(M, (P))$"],"answer":"A","explain":"Định nghĩa khoảng cách.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn vuông góc chung của hai đường thẳng chéo nhau:","options":["A. có vô số","B. có đúng hai","C. có một và chỉ một","D. không tồn tại"],"answer":"C","explain":"Tính chất: tồn tại duy nhất đoạn vuông góc chung.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tứ diện $OABC$ có $OA, OB, OC$ đôi một vuông góc, $OA = OB = OC = a$. Khoảng cách từ $O$ đến $(ABC)$ bằng:","options":["A. $\\frac{a\\sqrt{3}}{3}$","B. $\\frac{a\\sqrt{2}}{2}$","C. $a$","D. $\\frac{a}{3}$"],"answer":"A","explain":"$\\frac{1}{d^2} = \\frac{1}{OA^2} + \\frac{1}{OB^2} + \\frac{1}{OC^2} = \\frac{3}{a^2}$ nên $d = \\frac{a\\sqrt{3}}{3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tứ diện $ABCD$ có $AB \\perp (BCD)$, $AB = a$, $BC = a$, $CD = a\\sqrt{3}$, $\\angle BCD = 90^\\circ$. Khoảng cách từ $B$ đến $(ACD)$ bằng:","options":["A. $\\frac{a\\sqrt{21}}{7}$","B. $\\frac{a}{2}$","C. $\\frac{a\\sqrt{3}}{2}$","D. $a$"],"answer":"A","explain":"$BD = 2a$; kẻ $BH \\perp CD$: $BH = \\frac{BC \\cdot CD}{BD} = \\frac{a\\sqrt{3}}{2}$; $CD \\perp BH$, $CD \\perp AB$ nên $CD \\perp (ABH)$; kẻ $BK \\perp AH$ thì $BK \\perp (ACD)$ và $BK = \\frac{AB \\cdot BH}{\\sqrt{AB^2 + BH^2}} = \\frac{a\\sqrt{21}}{7}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Khoảng cách giữa hai cạnh đối $AB$ và $CD$ bằng:","options":["A. $\\frac{a}{2}$","B. $\\frac{a\\sqrt{3}}{2}$","C. $a$","D. $\\frac{a\\sqrt{2}}{2}$"],"answer":"D","explain":"Gọi $M, N$ là trung điểm $AB, CD$: $MN$ là đoạn vuông góc chung, $MN = \\frac{a\\sqrt{2}}{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện $OABC$ có $OA = a$, $OB = 2a$, $OC = 3a$ đôi một vuông góc. Khoảng cách từ $O$ đến $(ABC)$ bằng:","options":["A. $a$","B. $\\frac{3a}{2}$","C. $2a$","D. $\\frac{6a}{7}$"],"answer":"D","explain":"$\\frac{1}{d^2} = \\frac{1}{a^2} + \\frac{1}{4a^2} + \\frac{1}{9a^2} = \\frac{49}{36a^2}$ nên $d = \\frac{6a}{7}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khoảng cách từ điểm đến mặt phẳng luôn nhỏ hơn khoảng cách từ điểm đó đến một điểm bất kì trên mặt phẳng.","b) Khoảng cách từ $M$ đến $(P)$ là độ dài đoạn $MH$ với $H$ là hình chiếu của $M$ lên $(P)$.","c) Nếu $a \\parallel (P)$ thì $d(a, (P)) = d(M, (P))$ với $M$ là điểm bất kì trên $a$.","d) Nếu $M \\in (P)$ thì $d(M, (P)) = 0$."],"answer":["F","T","T","T"],"explain":"a) Sai: nhỏ hơn hoặc bằng (bằng khi trùng hình chiếu) b) Đúng: định nghĩa c) Đúng: định nghĩa d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $M$ là trung điểm của $AB$ thì $d(M, (P)) = \\frac{1}{2}(d(A, (P)) + d(B, (P))$ khi $A, B$ cùng phía với $(P)$.","b) Khoảng cách giữa hai cạnh đối của tứ diện đều cạnh $a$ bằng $\\frac{a\\sqrt{2}}{2}$.","c) Trong hình lập phương cạnh $a$, $d(A, (A'BD)) = \\frac{a\\sqrt{3}}{3}$.","d) Đường cao của hình chóp bằng khoảng cách từ đỉnh đến mặt đáy."],"answer":["T","T","T","T"],"explain":"a) Đúng: tính chất đường trung bình b) Đúng: đoạn nối hai trung điểm c) Đúng: bằng $\\frac{1}{3}AC'$ d) Đúng: định nghĩa","points":1},{"type":"short","level":"NB","q":"Cho $SA \\perp (ABC)$. Khoảng cách từ $S$ đến $(ABC)$ bằng đoạn nào?","answer":"$SA$","explain":"Định nghĩa.","points":0.5},{"type":"short","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$. $d(S, (ABC))$ bằng đoạn nào?","answer":"$SA$","explain":"Định nghĩa.","points":0.5}]}]}
