<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Cho khối lăng trụ có thể tích $50$, chiều cao $5$. Diện tích đáy bằng:","options":["A. $250$","B. $10$","C. $25$","D. $\\frac{10}{3}$"],"answer":"B","explain":"$B = \\frac{V}{h} = 10$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Hình chiếu vuông góc của $AC'$ lên $(ABCD)$ là:","options":["A. $AA'$","B. $AB$","C. $AC$","D. $BD$"],"answer":"C","explain":"$A$ chiếu thành $A$, $C'$ chiếu thành $C$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$, tam giác $ABC$ vuông tại $B$, $AB = a$, $BC = a\\sqrt{3}$, $SA = 2a$. Góc giữa $SC$ và $(ABC)$ bằng:","options":["A. $45^\\circ$","B. $60^\\circ$","C. $30^\\circ$","D. $90^\\circ$"],"answer":"A","explain":"Hình chiếu của $SC$ là $AC = \\sqrt{a^2 + 3a^2} = 2a$; $\\tan\\varphi = \\frac{SA}{AC} = \\frac{2a}{2a} = 1$ nên $\\varphi = 45^\\circ$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lăng trụ đứng $ABC.A'B'C'$. Khẳng định nào đúng?","options":["A. $AB \\perp (BCC'B')$","B. $AA' \\perp (ABC)$","C. $AA' \\parallel (ABC)$","D. $AC \\subset (BCC'B')$"],"answer":"B","explain":"Cạnh bên của lăng trụ đứng vuông góc với mặt đáy.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABC$ có $SA = SB = SC$, $AB = BC = CA$. Góc giữa $SA$ và $BC$ bằng:","options":["A. $0^\\circ$","B. $90^\\circ$","C. $45^\\circ$","D. $60^\\circ$"],"answer":"B","explain":"Gọi $M$ là trung điểm $BC$: $BC \\perp AM$, $BC \\perp SM$ nên $BC \\perp (SAM)$; suy ra $BC \\perp SA$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều cạnh $a$, $O$ là trọng tâm, $SO \\perp (ABC)$, $SO = a$. Góc giữa $(SBC)$ và $(ABC)$ có tang bằng:","options":["A. $2\\sqrt{3}$","B. $\\sqrt{3}$","C. $\\frac{\\sqrt{3}}{3}$","D. $1$"],"answer":"A","explain":"$OM = \\frac{a\\sqrt{3}}{6}$ ($M$ là trung điểm $BC$); $\\tan = \\frac{SO}{OM} = \\frac{a}{a\\sqrt{3}/6} = 2\\sqrt{3}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho hình chóp $S.ABCD$ đáy là hình bình hành, $V_{S.ABD} = \\frac{1}{2}V_{S.ABCD}$.","b) Cho $d \\perp (P)$, mọi mặt phẳng chứa $d$ đều vuông góc với $(P)$.","c) Thể tích khối chóp cụt được tính bằng hiệu thể tích hai khối chóp.","d) Thể tích khối lập phương cạnh $a$ bằng $3a^3$."],"answer":["T","T","T","F"],"explain":"a) Đúng: đáy $ABD$ bằng nửa đáy b) Đúng: điều kiện hai mặt phẳng vuông góc c) Đúng: định nghĩa d) Sai: bằng $a^3$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $M$ là trung điểm của $AB$ thì $d(M, (P)) = \\frac{1}{2}(d(A, (P)) + d(B, (P))$ khi $A, B$ cùng phía với $(P)$.","b) Cho $d_1 \\parallel d_2$ chéo nhau? hai đường song song không chéo nhau.","c) Trong hình chóp $S.ABC$ có $SA \\perp (ABC)$, $\\triangle ABC$ vuông tại $B$ thì $SB \\perp BC$.","d) Nếu đường thẳng $d$ vuông góc với hai đường thẳng cắt nhau trong $(P)$ thì $d \\perp (P)$."],"answer":["T","F","T","T"],"explain":"a) Đúng: tính chất đường trung bình b) Sai: hai đường song song thì đồng phẳng c) Đúng: $BC \\perp (SAB)$ d) Đúng: điều kiện đường thẳng vuông góc mặt phẳng","points":1},{"type":"short","level":"NB","q":"Kí hiệu $(P)$ vuông góc với $(Q)$ là gì?","answer":"$(P) \\perp (Q)$","explain":"Kí hiệu chuẩn.","points":0.5},{"type":"short","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$. Góc giữa $SA$ và $AB$ bằng bao nhiêu độ?","answer":"$90$","explain":"$SA$ vuông góc với mọi đường trong $(ABC)$.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$. Khẳng định nào đúng?","options":["A. $SA \\parallel BC$","B. $SB \\perp AC$","C. $SC \\subset (ABC)$","D. $SA \\perp BC$"],"answer":"D","explain":"$BC \\subset (ABC)$ nên $SA \\perp BC$.","points":0.25},{"type":"mcq","level":"NB","q":"Nếu $a \\parallel b$ và $a \\perp c$ thì:","options":["A. không kết luận được","B. $b$ cắt $c$","C. $b \\perp c$","D. $b \\parallel c$"],"answer":"C","explain":"Đường thẳng vuông góc với một trong hai đường song song thì vuông góc với đường còn lại.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tứ diện $ABCD$ có $AB \\perp CD$, $AB \\perp BD$. Kết luận nào đúng?","options":["A. $CD \\perp (ABD)$","B. $AB \\perp (BCD)$","C. $AB \\parallel (BCD)$","D. $BD \\perp (ACD)$"],"answer":"B","explain":"$AB$ vuông góc với hai đường cắt nhau $CD, BD$ trong $(BCD)$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABCD$ có đáy là hình vuông cạnh $a$, $SA \\perp (ABCD)$, $SA = 2a$. Thể tích bằng:","options":["A. $\\frac{2a^3}{3}$","B. $\\frac{a^3}{3}$","C. $2a^3$","D. $a^3$"],"answer":"A","explain":"$V = \\frac{1}{3} \\cdot a^2 \\cdot 2a = \\frac{2a^3}{3}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Khẳng định nào đúng?","options":["A. $BD \\perp (ACC'A')$","B. $BD \\parallel (ACC'A')$","C. $B'D' \\parallel (ACC'A')$","D. $AC' \\perp (ABCD)$"],"answer":"A","explain":"$BD \\perp AC$, $BD \\perp AA'$ nên $BD \\perp (ACC'A')$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều cạnh $a$, $SA \\perp (ABC)$, $SA = \\frac{3a}{2}$. Gọi $M$ là trung điểm $BC$. Góc giữa $SM$ và $(ABC)$ bằng:","options":["A. $90^\\circ$","B. $30^\\circ$","C. $60^\\circ$","D. $45^\\circ$"],"answer":"C","explain":"Hình chiếu của $SM$ lên $(ABC)$ là $AM = \\frac{a\\sqrt{3}}{2}$; $\\tan\\varphi = \\frac{SA}{AM} = \\frac{3a/2}{a\\sqrt{3}/2} = \\sqrt{3}$ nên $\\varphi = 60^\\circ$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cạnh bên của hình lăng trụ đứng vuông góc với mặt đáy.","b) Khối hộp chữ nhật có ba kích thước $a, b, c$ thì thể tích bằng $abc$.","c) Nếu $V_{S.ABC} = V$ thì $V_{A.SBC} = V$.","d) Nếu $a \\parallel (P)$ thì $d(a, (P)) = d(M, (P))$ với $M$ là điểm bất kì trên $a$."],"answer":["T","T","T","T"],"explain":"a) Đúng: định nghĩa lăng trụ đứng b) Đúng: công thức c) Đúng: cùng khối tứ diện d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trong hình chóp $S.ABC$ có $SA \\perp (ABC)$, $\\triangle ABC$ vuông tại $B$ thì $SB \\perp BC$.","b) Cho $M, N$ là trung điểm $SB, SC$ thì $\\frac{V_{S.AMN}}{V_{S.ABC}} = \\frac{1}{4}$.","c) Cho hình chóp đều $S.ABC$, góc giữa cạnh bên $SA$ và $(ABC)$ là góc $SAO$ ($O$ là trọng tâm đáy).","d) Hai đường thẳng vuông góc thì phải cắt nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng: $BC \\perp (SAB)$ b) Đúng: tỉ số thể tích c) Đúng: hình chiếu của $S$ là $O$ d) Sai: chúng có thể chéo nhau","points":1},{"type":"short","level":"NB","q":"Hai đường thẳng song song có góc bằng bao nhiêu độ?","answer":"$0$","explain":"Theo định nghĩa.","points":0.5},{"type":"short","level":"TH","q":"Cho hình hộp chữ nhật có ba kích thước $a, b, c$. Khoảng cách từ một đỉnh đến mặt phẳng qua ba đỉnh kề thỏa mãn hệ thức nào?","answer":"$\\frac{1}{d^2} = \\frac{1}{a^2} + \\frac{1}{b^2} + \\frac{1}{c^2}$","explain":"Mở rộng hệ thức lượng.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Nếu $d \\perp (P)$ và $a \\subset (P)$ thì:","options":["A. $d \\perp a$","B. không kết luận được","C. $d \\parallel a$","D. $d$ cắt $a$"],"answer":"A","explain":"Theo định nghĩa, $d$ vuông góc với mọi đường trong $(P)$.","points":0.25},{"type":"mcq","level":"NB","q":"Nếu $a \\parallel b$ và $a \\perp c$ thì:","options":["A. $b$ cắt $c$","B. $b \\perp c$","C. $b \\parallel c$","D. không kết luận được"],"answer":"B","explain":"Đường thẳng vuông góc với một trong hai đường song song thì vuông góc với đường còn lại.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\perp d$ và $(Q) \\parallel (P)$. Kết luận nào đúng?","options":["A. $(Q) \\parallel d$","B. $d \\subset (Q)$","C. $(Q) \\perp d$","D. không kết luận được"],"answer":"C","explain":"Tính chất liên hệ song song — vuông góc.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $d \\perp (P)$ và $d' \\parallel d$. Kết luận nào đúng?","options":["A. $d' \\perp (P)$","B. $d' \\parallel (P)$","C. không kết luận được","D. $d' \\subset (P)$"],"answer":"A","explain":"Đường thẳng song song với đường vuông góc mặt phẳng thì cũng vuông góc với mặt phẳng đó.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Góc giữa $(AB'D')$ và $(ABCD)$ có tang bằng:","options":["A. $\\sqrt{2}$","B. $\\frac{1}{2}$","C. $\\frac{\\sqrt{2}}{2}$","D. $1$"],"answer":"A","explain":"Gọi $O$ là tâm đáy: $B'D' \\perp A'O$... góc là $\\angle AOA'$? $\\tan = \\frac{AA'}{AO} = \\frac{a}{a\\sqrt{2}/2} = \\sqrt{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình vuông cạnh $a$, $SA \\perp (ABCD)$, $SA = a\\sqrt{3}$. Góc giữa $SC$ và $(SAB)$ có sin bằng:","options":["A. $\\frac{1}{2}$","B. $\\frac{\\sqrt{3}}{2}$","C. $\\frac{\\sqrt{5}}{5}$","D. $\\frac{\\sqrt{2}}{2}$"],"answer":"C","explain":"$BC \\perp (SAB)$ nên hình chiếu của $SC$ lên $(SAB)$ là $SB = \\sqrt{3a^2 + a^2} = 2a$; $SC = \\sqrt{3a^2 + 2a^2} = a\\sqrt{5}$; $\\sin\\varphi = \\frac{BC}{SC} = \\frac{1}{\\sqrt{5}} = \\frac{\\sqrt{5}}{5}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trong hình hộp chữ nhật, khoảng cách từ một đỉnh đến mặt phẳng chứa ba đỉnh kề được tính bằng công thức nghịch đảo bình phương.","b) Nếu $(P) \\perp (Q)$, $d \\perp (P)$ thì $d \\parallel (Q)$ hoặc $d \\subset (Q)$.","c) Góc giữa đường thẳng và mặt phẳng bằng góc giữa đường thẳng và pháp tuyến của mặt phẳng.","d) Nếu $a \\parallel (P)$ thì $d(a, (P)) = d(M, (P))$ với $M$ là điểm bất kì trên $a$."],"answer":["T","T","F","T"],"explain":"a) Đúng: tứ diện vuông tại đỉnh b) Đúng: tính chất c) Sai: hai góc phụ nhau d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thể tích khối tứ diện đều cạnh $a$ bằng $\\frac{a^3\\sqrt{2}}{12}$.","b) Thể tích khối chóp $S.ABC$ bằng thể tích khối chóp $A.SBC$.","c) Tỉ số thể tích của hai khối chóp có cùng chiều cao bằng tỉ số diện tích hai đáy.","d) Hai đường thẳng phân biệt cùng vuông góc với một đường thẳng thứ ba thì song song với nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng: công thức b) Đúng: cùng một khối tứ diện c) Đúng: công thức d) Sai: trong không gian có thể chéo nhau","points":1},{"type":"short","level":"NB","q":"Góc giữa hai đường thẳng trong không gian có số đo lớn nhất là bao nhiêu độ?","answer":"$90$","explain":"Theo định nghĩa, góc giữa hai đường thẳng thuộc $[0^\\circ; 90^\\circ]$.","points":0.5},{"type":"short","level":"TH","q":"Cho hình chóp đều $S.ABC$, $O$ là trọng tâm đáy. Hình chiếu của $S$ lên $(ABC)$ là điểm nào?","answer":"$O$","explain":"Tính chất hình chóp đều.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$. Khoảng cách từ $S$ đến $(ABC)$ bằng:","options":["A. $SB$","B. $AB$","C. $SA$","D. $SC$"],"answer":"C","explain":"$SA \\perp (ABC)$ nên $d(S, (ABC)) = SA$.","points":0.25},{"type":"mcq","level":"NB","q":"Kí hiệu đường thẳng $d$ vuông góc với mặt phẳng $(P)$ là:","options":["A. $d \\perp (P)$","B. $d \\subset (P)$","C. $d \\parallel (P)$","D. $d \\cap (P) = \\varnothing$"],"answer":"A","explain":"Kí hiệu: $d \\perp (P)$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$, $SA = a$, $AB = a$. Góc giữa $SB$ và $(ABC)$ bằng:","options":["A. $90^\\circ$","B. $30^\\circ$","C. $45^\\circ$","D. $60^\\circ$"],"answer":"C","explain":"Góc là $\\angle SBA$; $\\tan = \\frac{SA}{AB} = 1$ nên góc $45^\\circ$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$, $SA = a\\sqrt{3}$, tam giác $ABC$ vuông tại $A$, $AB = a$, $AC = a\\sqrt{3}$. Khoảng cách từ $B$ đến $(SAC)$ bằng:","options":["A. $\\frac{a}{2}$","B. $2a$","C. $a$","D. $a\\sqrt{3}$"],"answer":"C","explain":"$BA \\perp AC$, $BA \\perp SA$ nên $BA \\perp (SAC)$; $d(B, (SAC)) = BA = a$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Khoảng cách giữa hai cạnh đối $AB$ và $CD$ bằng:","options":["A. $\\frac{a}{2}$","B. $a$","C. $\\frac{a\\sqrt{3}}{2}$","D. $\\frac{a\\sqrt{2}}{2}$"],"answer":"D","explain":"Gọi $M, N$ là trung điểm $AB, CD$: $MN$ là đoạn vuông góc chung, $MN = \\frac{a\\sqrt{2}}{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho lăng trụ $ABC.A'B'C'$ có đáy là tam giác đều cạnh $a$, $A'$ cách đều $A, B, C$, góc giữa $AA'$ và $(ABC)$ bằng $60^\\circ$. Thể tích bằng:","options":["A. $\\frac{3a^3}{4}$","B. $\\frac{3a^3}{8}$","C. $\\frac{a^3}{2}$","D. $\\frac{a^3\\sqrt{3}}{4}$"],"answer":"D","explain":"Hình chiếu của $A'$ lên $(ABC)$ là trọng tâm $G$: $AG = \\frac{a\\sqrt{3}}{3}$; $h = AG \\cdot \\tan 60^\\circ = a$; $V = \\frac{a^2\\sqrt{3}}{4} \\cdot a = \\frac{a^3\\sqrt{3}}{4}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho $M, N$ là trung điểm $SB, SC$ thì $\\frac{V_{S.AMN}}{V_{S.ABC}} = \\frac{1}{4}$.","b) Cho khối chóp có đáy là tam giác, nếu tăng mỗi cạnh đáy lên $2$ lần và giữ chiều cao thì thể tích tăng $4$ lần.","c) Nếu tăng chiều cao của khối chóp lên $2$ lần thì thể tích tăng $2$ lần.","d) Nếu $(P)$ chứa một đường thẳng vuông góc với $(Q)$ thì $(P) \\perp (Q)$."],"answer":["T","T","T","T"],"explain":"a) Đúng: tỉ số thể tích b) Đúng: diện tích đáy tăng $4$ lần c) Đúng: $V$ tỉ lệ thuận với $h$ d) Đúng: điều kiện","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho $M, N$ là trung điểm $SB, SC$ thì $\\frac{V_{S.AMN}}{V_{S.ABC}} = \\frac{1}{4}$.","b) Nếu $a \\parallel b$ và $a \\perp c$ thì $b \\perp c$.","c) Cho $(P) \\perp (Q)$, $d = (P) \\cap (Q)$; nếu $a \\subset (P)$, $a \\perp d$ thì $a \\perp (Q)$.","d) Nếu $M$ là trung điểm của $AB$ thì $d(M, (P)) = \\frac{1}{2}(d(A, (P)) + d(B, (P))$ khi $A, B$ cùng phía với $(P)$."],"answer":["T","T","T","T"],"explain":"a) Đúng: tỉ số thể tích b) Đúng: tính chất c) Đúng: tính chất d) Đúng: tính chất đường trung bình","points":1},{"type":"short","level":"NB","q":"Cho hình lăng trụ đứng $ABC.A'B'C'$. Cạnh $BB'$ vuông góc với mặt phẳng nào?","answer":"$(ABC)$","explain":"Cạnh bên vuông góc mặt đáy.","points":0.5},{"type":"short","level":"TH","q":"Nếu $(P)$ chứa $d \\perp (Q)$ thì $(P)$ và $(Q)$ có vị trí gì?","answer":"vuông góc","explain":"Điều kiện.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Khoảng cách giữa hai đường thẳng chéo nhau $a, b$ là:","options":["A. không xác định","B. độ dài đoạn vuông góc chung của $a$ và $b$","C. $0$","D. khoảng cách giữa hai điểm bất kì trên $a, b$"],"answer":"B","explain":"Định nghĩa: độ dài đoạn vuông góc chung.","points":0.25},{"type":"mcq","level":"NB","q":"Thể tích khối chóp có diện tích đáy $B$, chiều cao $h$ là:","options":["A. $V = Bh$","B. $V = 2Bh$","C. $V = \\frac{1}{2}Bh$","D. $V = \\frac{1}{3}Bh$"],"answer":"D","explain":"Công thức thể tích khối chóp.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$, $SA = a$, tam giác $ABC$ vuông tại $B$, $AB = a$. Khoảng cách từ $A$ đến $(SBC)$ bằng:","options":["A. $\\frac{a\\sqrt{2}}{2}$","B. $\\frac{2a\\sqrt{5}}{5}$","C. $\\frac{a}{2}$","D. $a$"],"answer":"A","explain":"$BC \\perp AB$, $BC \\perp SA$ nên $BC \\perp (SAB)$; kẻ $AH \\perp SB$ ($H$ trên $SB$) thì $AH \\perp (SBC)$ và $\\frac{1}{AH^2} = \\frac{1}{SA^2} + \\frac{1}{AB^2} = \\frac{2}{a^2}$, suy ra $AH = \\frac{a\\sqrt{2}}{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABCD$ có đáy là hình chữ nhật, $AB = a$, $AD = 2a$, $SA \\perp (ABCD)$, $SA = a$. Khoảng cách từ $A$ đến $(SCD)$ bằng:","options":["A. $\\frac{2a\\sqrt{5}}{5}$","B. $a$","C. $\\frac{a}{2}$","D. $\\frac{a\\sqrt{2}}{2}$"],"answer":"A","explain":"$CD \\perp AD$, $CD \\perp SA$ nên $CD \\perp (SAD)$; kẻ $AH \\perp SD$ ($H$ trên $SD$) thì $AH \\perp (SCD)$ và $\\frac{1}{AH^2} = \\frac{1}{SA^2} + \\frac{1}{AD^2} = \\frac{5}{4a^2}$, suy ra $AH = \\frac{2a\\sqrt{5}}{5}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABCD$ có đáy là hình thoi, $SA \\perp (ABCD)$. Góc giữa $AC$ và $SD$ bằng:","options":["A. $45^\\circ$","B. $0^\\circ$","C. $90^\\circ$","D. $60^\\circ$"],"answer":"C","explain":"$AC \\perp BD$ (đường chéo hình thoi), $AC \\perp SA$ nên $AC \\perp (SBD)$; $SD \\subset (SBD)$ nên $AC \\perp SD$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABCD$ có đáy là hình vuông cạnh $a$, $SA \\perp (ABCD)$, $SA = a\\sqrt{2}$. Góc giữa $(SBD)$ và $(ABCD)$ có tang bằng:","options":["A. $\\frac{\\sqrt{2}}{2}$","B. $2$","C. $\\sqrt{2}$","D. $1$"],"answer":"B","explain":"$BD \\perp AO$, $BD \\perp SO$ ($O$ là tâm đáy) nên góc là $\\angle SOA$; $\\tan = \\frac{SA}{AO} = \\frac{a\\sqrt{2}}{a\\sqrt{2}/2} = 2$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tỉ số thể tích hai khối đa diện đồng dạng tỉ số $k$ bằng $k^3$.","b) Cho $AH \\perp (P)$, $a \\subset (P)$, nếu $AM \\perp a$ thì $MH \\perp a$ ($M$ trên $(P)$).","c) Cho tứ diện $ABCD$ có $AB \\perp CD$ và $AC \\perp BD$ thì $AD \\perp BC$.","d) Góc giữa đường thẳng và mặt phẳng nằm trong $[0^\\circ; 90^\\circ]$."],"answer":["T","T","T","T"],"explain":"a) Đúng: tính chất b) Đúng: định lí ba đường vuông góc (đảo) c) Đúng: tính chất tứ diện trực tâm d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho $(P) \\perp (Q)$; hình chiếu của một đường thẳng trong $(P)$ lên $(Q)$ luôn là một đường thẳng.","b) Nếu $d_1 \\perp (P)$, $d_2 \\perp (P)$ thì $d_1 \\parallel d_2$ hoặc $d_1 \\equiv d_2$.","c) Cho hình chóp $S.ABC$ có đáy vuông tại $B$, $SA \\perp (ABC)$ thì $(SBC) \\perp (SAB)$.","d) Góc giữa $AC'$ và $(A'BD)$ trong hình lập phương bằng $90^\\circ$."],"answer":["F","T","T","T"],"explain":"a) Sai: có thể là một điểm b) Đúng: tính chất c) Đúng: $BC \\perp (SAB)$ d) Đúng: vì $AC' \\perp (A'BD)$","points":1},{"type":"short","level":"NB","q":"Kí hiệu khoảng cách từ $M$ đến $(P)$ là gì?","answer":"$d(M, (P))$","explain":"Kí hiệu chuẩn.","points":0.5},{"type":"short","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$. $(ACC'A')$ có vuông góc với $(BDD'B')$ không?","answer":"Có","explain":"$BD \\perp (ACC'A')$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Khoảng cách giữa hai mặt phẳng song song $(P), (Q)$ là:","options":["A. $0$","B. khoảng cách giữa hai điểm bất kì","C. khoảng cách từ một điểm bất kì trên $(P)$ đến $(Q)$","D. khoảng cách giữa hai đường thẳng bất kì"],"answer":"C","explain":"Định nghĩa.","points":0.25},{"type":"mcq","level":"NB","q":"Kí hiệu khoảng cách từ điểm $M$ đến mặt phẳng $(P)$ là:","options":["A. $d(M, (P))$","B. $|MP|$","C. $MH$","D. $d(M, P)$ viết thiếu ngoặc"],"answer":"A","explain":"Kí hiệu chuẩn: $d(M, (P))$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$, tam giác $ABC$ vuông tại $B$, $SA = AB = BC = a$. Góc giữa $SC$ và $(ABC)$ bằng:","options":["A. $30^\\circ$","B. $\\arctan\\frac{\\sqrt{2}}{2}$ ($\\approx 35^\\circ$)","C. $45^\\circ$","D. $60^\\circ$"],"answer":"B","explain":"Hình chiếu của $SC$ là $AC = a\\sqrt{2}$; $\\tan\\varphi = \\frac{a}{a\\sqrt{2}} = \\frac{\\sqrt{2}}{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp đều $S.ABC$ ($ABC$ là tam giác đều, $SO \\perp (ABC)$ với $O$ là trọng tâm). Góc giữa cạnh bên $SA$ và $(ABC)$ là góc giữa:","options":["A. $SO$ và $AO$","B. $SA$ và $AO$","C. $SA$ và $SO$","D. $SA$ và $AB$"],"answer":"B","explain":"Hình chiếu của $S$ lên $(ABC)$ là $O$ nên hình chiếu của $SA$ là $AO$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Góc giữa $(AB'D')$ và $(ABCD)$ có tang bằng:","options":["A. $\\frac{\\sqrt{2}}{2}$","B. $\\frac{1}{2}$","C. $\\sqrt{2}$","D. $1$"],"answer":"C","explain":"Gọi $O$ là tâm đáy: $B'D' \\perp A'O$... góc là $\\angle AOA'$? $\\tan = \\frac{AA'}{AO} = \\frac{a}{a\\sqrt{2}/2} = \\sqrt{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$, $AB = a$, $AC = 2a$, $\\angle BAC = 90^\\circ$, $SA = a$. Khoảng cách từ $A$ đến $(SBC)$ bằng:","options":["A. $\\frac{2a}{3}$","B. $a$","C. $\\frac{a}{2}$","D. $\\frac{2a\\sqrt{5}}{5}$"],"answer":"A","explain":"$BC = a\\sqrt{5}$, $AH = \\frac{AB \\cdot AC}{BC} = \\frac{2a}{\\sqrt{5}}$ ($AH \\perp BC$); kẻ $AK \\perp SH$ thì $AK \\perp (SBC)$ và $AK = \\frac{SA \\cdot AH}{\\sqrt{SA^2 + AH^2}} = \\frac{2a}{3}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $d(a, (P)) = 0$ với $a \\parallel (P)$ thì $a \\subset (P)$.","b) Nếu $a \\perp (P)$ và $b \\parallel (P)$ thì $a \\perp b$.","c) Trong hình chóp $S.ABC$ có $SA \\perp (ABC)$, $\\triangle ABC$ vuông tại $B$ thì $SB \\perp BC$.","d) Cho $d \\perp (P)$, mọi mặt phẳng chứa $d$ đều vuông góc với $(P)$."],"answer":["T","T","T","T"],"explain":"a) Đúng: suy luận b) Đúng: tính chất liên hệ c) Đúng: $BC \\perp (SAB)$ d) Đúng: điều kiện hai mặt phẳng vuông góc","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tích vô hướng của hai vectơ chỉ phương bằng $0$ là điều kiện cần và đủ để hai đường thẳng vuông góc.","b) Trong tứ diện đều, các cặp cạnh đối vuông góc với nhau.","c) Nếu $a \\parallel b$ và $a \\perp c$ thì $b \\perp c$.","d) Hai đường thẳng song song có hình chiếu vuông góc lên $(P)$ song song với nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng: định nghĩa qua vectơ b) Đúng: tính chất tứ diện đều c) Đúng: tính chất d) Sai: hình chiếu có thể là điểm hoặc cắt nhau","points":1},{"type":"short","level":"NB","q":"Cho $(P) \\perp (Q)$, $d = (P) \\cap (Q)$, $a \\subset (P)$, $a \\perp d$. Kết luận về $a$ và $(Q)$?","answer":"$a \\perp (Q)$","explain":"Tính chất.","points":0.5},{"type":"short","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$. $d(S, (ABC))$ bằng đoạn nào?","answer":"$SA$","explain":"Định nghĩa.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Định lí ba đường vuông góc phát biểu về:","options":["A. đường thẳng và hai mặt phẳng","B. đường xiên, hình chiếu của nó và một đường thẳng nằm trong mặt phẳng","C. ba đường thẳng đồng quy","D. ba mặt phẳng vuông góc"],"answer":"B","explain":"Nội dung định lí ba đường vuông góc.","points":0.25},{"type":"mcq","level":"NB","q":"Cho khối chóp có diện tích đáy $12$, chiều cao $5$. Thể tích bằng:","options":["A. $30$","B. $60$","C. $20$","D. $40$"],"answer":"C","explain":"$V = \\frac{1}{3} \\cdot 12 \\cdot 5 = 20$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tứ diện $ABCD$ có $AB \\perp CD$, $AC \\perp BD$. Góc giữa $AD$ và $BC$ bằng:","options":["A. $90^\\circ$","B. $45^\\circ$","C. $0^\\circ$","D. $60^\\circ$"],"answer":"A","explain":"Tính chất: nếu hai cặp cạnh đối vuông góc thì cặp còn lại cũng vuông góc (tứ diện trực tâm).","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$, $SA = a\\sqrt{3}$, $AB = a$. Góc giữa $SB$ và $(ABC)$ bằng:","options":["A. $60^\\circ$","B. $45^\\circ$","C. $30^\\circ$","D. $90^\\circ$"],"answer":"A","explain":"$\\tan\\varphi = \\frac{SA}{AB} = \\sqrt{3}$ nên $\\varphi = 60^\\circ$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Khẳng định nào đúng?","options":["A. $AC' \\perp (ABCD)$","B. $BD \\perp (ACC'A')$","C. $B'D' \\parallel (ACC'A')$","D. $BD \\parallel (ACC'A')$"],"answer":"B","explain":"$BD \\perp AC$, $BD \\perp AA'$ nên $BD \\perp (ACC'A')$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều cạnh $a$, $SA \\perp (ABC)$, $SA = \\frac{3a}{2}$. Gọi $M$ là trung điểm $BC$. Góc giữa $SM$ và $(ABC)$ bằng:","options":["A. $45^\\circ$","B. $90^\\circ$","C. $60^\\circ$","D. $30^\\circ$"],"answer":"C","explain":"Hình chiếu của $SM$ lên $(ABC)$ là $AM = \\frac{a\\sqrt{3}}{2}$; $\\tan\\varphi = \\frac{SA}{AM} = \\frac{3a/2}{a\\sqrt{3}/2} = \\sqrt{3}$ nên $\\varphi = 60^\\circ$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho hình chóp đều $S.ABC$, góc giữa cạnh bên $SA$ và $(ABC)$ là góc $SAO$ ($O$ là trọng tâm đáy).","b) Cho hình lập phương, $A'B \\perp B'C$.","c) Trong tứ diện đều, các cặp cạnh đối vuông góc với nhau.","d) Cho hình chóp $S.ABCD$ đáy là hình vuông, $SA \\perp (ABCD)$ thì $(SBD) \\perp (SAC)$."],"answer":["T","F","T","T"],"explain":"a) Đúng: hình chiếu của $S$ là $O$ b) Sai: góc giữa chúng bằng $60^\\circ$ c) Đúng: tính chất tứ diện đều d) Đúng: $BD \\perp (SAC)$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thể tích khối chóp bằng một phần ba diện tích đáy nhân chiều cao.","b) Nếu $(P) \\perp (Q)$ thì mọi đường thẳng trong $(P)$ đều vuông góc với $(Q)$.","c) Nếu $a \\parallel b$ và $a \\perp c$ thì $b \\perp c$.","d) Một đường thẳng vuông góc với một đường thẳng trong $(P)$ thì vuông góc với $(P)$."],"answer":["T","F","T","F"],"explain":"a) Đúng: công thức b) Sai: chỉ đường vuông góc với giao tuyến c) Đúng: tính chất d) Sai: cần hai đường cắt nhau","points":1},{"type":"short","level":"NB","q":"Kí hiệu $a \\perp b$ đọc là gì?","answer":"$a$ vuông góc với $b$","explain":"Kí hiệu vuông góc.","points":0.5},{"type":"short","level":"TH","q":"Khối hộp chữ nhật $2 \\times 3 \\times 5$ có thể tích bằng bao nhiêu?","answer":"$30$","explain":"$V = 2 \\cdot 3 \\cdot 5 = 30$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Khoảng cách từ $A$ đến $(A'B'C'D')$ bằng:","options":["A. $a\\sqrt{2}$","B. $\\frac{a}{2}$","C. $a\\sqrt{3}$","D. $a$"],"answer":"D","explain":"$AA' \\perp (A'B'C'D')$ nên khoảng cách bằng $AA' = a$.","points":0.25},{"type":"mcq","level":"NB","q":"Nếu $a \\parallel b$ và $a \\perp c$ thì:","options":["A. $b \\parallel c$","B. không kết luận được","C. $b \\perp c$","D. $b$ cắt $c$"],"answer":"C","explain":"Đường thẳng vuông góc với một trong hai đường song song thì vuông góc với đường còn lại.","points":0.25},{"type":"mcq","level":"TH","q":"Cho khối chóp $S.ABC$ có thể tích $V$. Gọi $M$ là trung điểm $SA$. Thể tích khối chóp $M.ABC$ bằng:","options":["A. $V$","B. $\\frac{V}{2}$","C. $2V$","D. $\\frac{V}{3}$"],"answer":"B","explain":"Chiều cao giảm một nửa, đáy chung nên thể tích bằng $\\frac{V}{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Góc giữa $AC$ và $A'C'$ bằng:","options":["A. $60^\\circ$","B. $0^\\circ$","C. $45^\\circ$","D. $90^\\circ$"],"answer":"B","explain":"$AC \\parallel A'C'$ nên góc bằng $0^\\circ$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Góc giữa $(AB'D')$ và $(ABCD)$ có tang bằng:","options":["A. $\\frac{\\sqrt{2}}{2}$","B. $\\sqrt{2}$","C. $\\frac{1}{2}$","D. $1$"],"answer":"B","explain":"Gọi $O$ là tâm đáy: $B'D' \\perp A'O$... góc là $\\angle AOA'$? $\\tan = \\frac{AA'}{AO} = \\frac{a}{a\\sqrt{2}/2} = \\sqrt{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều cạnh $a$, $O$ là trọng tâm tam giác $ABC$, $SO \\perp (ABC)$, $SO = \\frac{a\\sqrt{3}}{3}$. Góc giữa $SA$ và $(ABC)$ bằng:","options":["A. $45^\\circ$","B. $30^\\circ$","C. $60^\\circ$","D. $90^\\circ$"],"answer":"A","explain":"$AO = \\frac{2}{3} \\cdot \\frac{a\\sqrt{3}}{2} = \\frac{a\\sqrt{3}}{3} = SO$; tam giác $SOA$ vuông cân nên góc $45^\\circ$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thể tích khối chóp không đổi khi đỉnh di chuyển trên mặt phẳng song song với đáy.","b) Hai đường thẳng phân biệt cùng vuông góc với một mặt phẳng thì song song với nhau.","c) Trong hình lập phương, $BD \\perp AC'$.","d) Cho hình lập phương $ABCD.A'B'C'D'$, $AC \\perp B'D'$."],"answer":["T","T","T","T"],"explain":"a) Đúng: chiều cao không đổi b) Đúng: tính chất c) Đúng: $AC \\perp (BDD'B')$ d) Đúng: $AC \\parallel A'C' \\perp B'D'$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $M'$ là hình chiếu của $M$ lên $(P)$ thì $MM' \\perp (P)$.","b) Hình chiếu vuông góc của đường tròn lên mặt phẳng luôn là đường tròn.","c) Thể tích khối chóp cụt được tính bằng hiệu thể tích hai khối chóp.","d) Hai mặt phẳng phân biệt cùng vuông góc với một đường thẳng thì song song với nhau."],"answer":["T","F","T","T"],"explain":"a) Đúng: định nghĩa hình chiếu vuông góc b) Sai: có thể là đoạn thẳng hoặc elip c) Đúng: định nghĩa d) Đúng: tính chất","points":1},{"type":"short","level":"NB","q":"Hai đường thẳng $a, b$ có góc bằng $90^\\circ$. Kết luận nào đúng?","answer":"$a \\perp b$","explain":"Định nghĩa hai đường thẳng vuông góc.","points":0.5},{"type":"short","level":"TH","q":"Cho hình chóp $S.ABCD$ đáy là hình vuông, $SA \\perp (ABCD)$. $(SAC)$ có vuông góc với $(SBD)$ không?","answer":"Có","explain":"$BD \\perp (SAC)$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Hình chiếu vuông góc của $AC'$ lên $(ABCD)$ là:","options":["A. $AB$","B. $AC$","C. $AA'$","D. $BD$"],"answer":"B","explain":"$A$ chiếu thành $A$, $C'$ chiếu thành $C$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$. Mặt phẳng nào vuông góc với $(ABC)$?","options":["A. $(SAB)$","B. không có","C. $(ABC)$","D. $(SBC)$"],"answer":"A","explain":"$(SAB)$ chứa $SA \\perp (ABC)$ nên $(SAB) \\perp (ABC)$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình hộp chữ nhật $ABCD.A'B'C'D'$. Khẳng định nào đúng?","options":["A. $AB \\perp BB'$","B. $AB \\parallel BB'$","C. $AC \\parallel BD$","D. $AA' \\parallel AC$"],"answer":"A","explain":"Cạnh bên vuông góc với cạnh đáy trong hình hộp chữ nhật.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tứ diện $ABCD$ có $AB, AC, AD$ đôi một vuông góc. Khẳng định nào đúng?","options":["A. $CD \\parallel (ABC)$","B. $BC \\perp (ABD)$","C. $AB \\parallel (ACD)$","D. $AB \\perp (ACD)$"],"answer":"D","explain":"$AB \\perp AC$, $AB \\perp AD$ nên $AB \\perp (ACD)$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều cạnh $a$, $O$ là trọng tâm, $SO \\perp (ABC)$, $SO = a$. Khoảng cách từ $O$ đến $(SBC)$ bằng:","options":["A. $\\frac{a\\sqrt{13}}{13}$","B. $\\frac{a\\sqrt{21}}{7}$","C. $a$","D. $\\frac{a}{2}$"],"answer":"A","explain":"$OM = \\frac{a\\sqrt{3}}{6}$ ($M$ là trung điểm $BC$); kẻ $OK \\perp SM$ thì $OK \\perp (SBC)$ và $\\frac{1}{OK^2} = \\frac{1}{SO^2} + \\frac{1}{OM^2} = \\frac{13}{a^2}$, suy ra $OK = \\frac{a\\sqrt{13}}{13}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Góc giữa $A'B$ và $B'C$ bằng:","options":["A. $0^\\circ$","B. $60^\\circ$","C. $90^\\circ$","D. $45^\\circ$"],"answer":"B","explain":"$A'B \\parallel D'C$, góc giữa $A'B$ và $B'C$ bằng góc giữa $D'C$ và $B'C$ là $60^\\circ$ (tam giác $B'CD'$ đều cạnh $a\\sqrt{2}$).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hai đường thẳng phân biệt cùng vuông góc với một mặt phẳng thì song song với nhau.","b) Đường thẳng vuông góc với mặt phẳng thì vuông góc với mọi đường thẳng nằm trong mặt phẳng đó.","c) Hai mặt phẳng song song thì góc giữa chúng bằng $0^\\circ$.","d) Khoảng cách từ điểm đến mặt phẳng luôn nhỏ hơn khoảng cách từ điểm đó đến một điểm bất kì trên mặt phẳng."],"answer":["T","T","T","F"],"explain":"a) Đúng: tính chất b) Đúng: định nghĩa đường thẳng vuông góc mặt phẳng c) Đúng: quy ước d) Sai: nhỏ hơn hoặc bằng (bằng khi trùng hình chiếu)","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho hình chóp $S.ABCD$ đáy là hình vuông, $SA \\perp (ABCD)$ thì $(SBD) \\perp (SAC)$.","b) Mặt bên của hình lăng trụ đứng vuông góc với mặt đáy.","c) Hai đường thẳng phân biệt cùng vuông góc với một đường thẳng thứ ba thì song song với nhau.","d) Hình chiếu vuông góc của một đường thẳng lên mặt phẳng luôn là một đường thẳng."],"answer":["T","T","F","F"],"explain":"a) Đúng: $BD \\perp (SAC)$ b) Đúng: định nghĩa lăng trụ đứng c) Sai: trong không gian có thể chéo nhau d) Sai: có thể là một điểm nếu đường thẳng vuông góc với mặt phẳng","points":1},{"type":"short","level":"NB","q":"Cho $(P) \\parallel (Q)$. $d((P), (Q))$ có phụ thuộc điểm chọn không?","answer":"Không","explain":"Định nghĩa.","points":0.5},{"type":"short","level":"TH","q":"Khối chóp có thể tích $24$, diện tích đáy $8$. Chiều cao bằng bao nhiêu?","answer":"$9$","explain":"$h = \\frac{3V}{B} = 9$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Nếu $a \\parallel b$ và $a \\perp c$ thì:","options":["A. $b \\perp c$","B. $b$ cắt $c$","C. $b \\parallel c$","D. không kết luận được"],"answer":"A","explain":"Đường thẳng vuông góc với một trong hai đường song song thì vuông góc với đường còn lại.","points":0.25},{"type":"mcq","level":"NB","q":"Điều kiện để hai mặt phẳng $(P), (Q)$ vuông góc là:","options":["A. $(P)$ song song với $(Q)$","B. giao tuyến của chúng vuông góc với $(P)$","C. $(P)$ chứa một đường thẳng vuông góc với $(Q)$","D. $(P)$ chứa một đường thẳng song song với $(Q)$"],"answer":"C","explain":"Định lí: mặt phẳng chứa đường thẳng vuông góc với mặt phẳng kia thì vuông góc với nó.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$, $H$ là hình chiếu của $A$ lên $BC$. Khẳng định nào đúng?","options":["A. $(SAB) \\perp (SAC)$","B. $(SAH) \\perp (SBC)$","C. $(SAB) \\perp (SBC)$","D. $(SBC) \\perp (ABC)$"],"answer":"B","explain":"$BC \\perp AH$, $BC \\perp SA$ nên $BC \\perp (SAH)$; $BC \\subset (SBC)$ nên $(SBC) \\perp (SAH)$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều, $SA \\perp (ABC)$, $M$ là trung điểm $BC$. Góc giữa $(SBC)$ và $(ABC)$ là:","options":["A. góc $SAB$","B. góc $SCA$","C. góc $SMA$","D. góc $SBA$"],"answer":"C","explain":"$BC \\perp AM$, $BC \\perp SM$ nên góc giữa hai mặt phẳng là góc giữa $SM$ và $AM$, tức góc $SMA$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABCD$ có đáy là hình thoi cạnh $a$, $\\angle BAD = 60^\\circ$, $SA \\perp (ABCD)$, $SA = a\\sqrt{3}$. Gọi $O$ là tâm hình thoi. Góc giữa $(SBD)$ và $(ABCD)$ có tang bằng:","options":["A. $1$","B. $\\frac{1}{2}$","C. $2$","D. $\\sqrt{3}$"],"answer":"C","explain":"$BD \\perp AO$, $BD \\perp SO$ nên góc là $\\angle SOA$; $AO = \\frac{a\\sqrt{3}}{2}$; $\\tan = \\frac{SA}{AO} = \\frac{a\\sqrt{3}}{a\\sqrt{3}/2} = 2$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$ có $AB = a$, $AC = 2a$, $\\angle BAC = 120^\\circ$, $SA \\perp (ABC)$, $SA = a$. Thể tích bằng:","options":["A. $\\frac{a^3\\sqrt{3}}{2}$","B. $\\frac{a^3}{3}$","C. $\\frac{a^3\\sqrt{3}}{6}$","D. $\\frac{a^3\\sqrt{3}}{3}$"],"answer":"C","explain":"$B = \\frac{1}{2} \\cdot a \\cdot 2a \\cdot \\sin 120^\\circ = \\frac{a^2\\sqrt{3}}{2}$; $V = \\frac{1}{3} \\cdot \\frac{a^2\\sqrt{3}}{2} \\cdot a = \\frac{a^3\\sqrt{3}}{6}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $(P) \\perp (Q)$ thì mọi đường thẳng trong $(P)$ đều vuông góc với $(Q)$.","b) Cho $a \\perp b$, $b \\perp c$ thì $a \\parallel c$.","c) Hai mặt phẳng vuông góc khi góc giữa chúng bằng $90^\\circ$.","d) Cho hình chóp $S.ABCD$ có đáy là hình vuông, $SA \\perp (ABCD)$ thì góc giữa $SC$ và $(ABCD)$ là góc $SCA$."],"answer":["F","F","T","T"],"explain":"a) Sai: chỉ đường vuông góc với giao tuyến b) Sai: trong không gian $a$ có thể chéo $c$ c) Đúng: định nghĩa d) Đúng: hình chiếu của $SC$ là $AC$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trong hình chóp đều $S.ABCD$, $SO \\perp (ABCD)$ với $O$ là tâm đáy.","b) Khối bát diện đều cạnh $a$ có thể tích $\\frac{a^3\\sqrt{2}}{3}$.","c) Cho $SA \\perp (ABC)$ thì $d(S, (ABC)) = SA$.","d) Thể tích khối chóp cụt được tính bằng hiệu thể tích hai khối chóp."],"answer":["T","T","T","T"],"explain":"a) Đúng: định nghĩa hình chóp đều b) Đúng: công thức c) Đúng: định nghĩa d) Đúng: định nghĩa","points":1},{"type":"short","level":"NB","q":"Công thức tính thể tích khối chóp là gì?","answer":"$V = \\frac{1}{3}Bh$","explain":"Công thức.","points":0.5},{"type":"short","level":"TH","q":"Cho $(P) \\perp (Q)$, $(Q) \\perp (R)$. Có thể kết luận $(P) \\parallel (R)$ không?","answer":"Không","explain":"Trong không gian $(P)$ có thể cắt $(R)$.","points":0.5}]}]}
