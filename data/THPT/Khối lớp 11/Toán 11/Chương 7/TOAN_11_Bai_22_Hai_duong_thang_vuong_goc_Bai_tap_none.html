"statements":["a) Cho hình lập phương, $A'B \\perp B'C$.","b) Trong hình lập phương, $BD \\perp AC'$.","c) Hai đường thẳng phân biệt cùng vuông góc với một đường thẳng thứ ba thì song song với nhau.","d) Cho hình lập phương $ABCD.A'B'C'D'$, $AC \\perp B'D'$."],"answer":["F","T","F","T"],"explain":"a) Sai: góc giữa chúng bằng $60^\\circ$ b) Đúng: $AC \\perp (BDD'B')$ c) Sai: trong không gian có thể chéo nhau d) Đúng: $AC \\parallel A'C' \\perp B'D'$","points":1},{"type":"short","level":"NB","q":"Hai đường thẳng $a, b$ có góc bằng $90^\\circ$. Kết luận nào đúng?","answer":"$a \\perp b$","explain":"Định nghĩa hai đường thẳng vuông góc.","points":0.5},{"type":"short","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$. Góc giữa $SA$ và $AB$ bằng bao nhiêu độ?","answer":"$90$","explain":"$SA$ vuông góc với mọi đường trong $(ABC)$.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Hai đường thẳng $a, b$ được gọi là vuông góc với nhau khi:","options":["A. chúng chéo nhau","B. chúng cắt nhau","C. góc giữa chúng bằng $0^\\circ$","D. góc giữa chúng bằng $90^\\circ$"],"answer":"D","explain":"Định nghĩa: $a \\perp b$ khi góc giữa $a$ và $b$ bằng $90^\\circ$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Góc giữa $AB$ và $A'D'$ bằng:","options":["A. $0^\\circ$","B. $60^\\circ$","C. $90^\\circ$","D. $45^\\circ$"],"answer":"C","explain":"$AB \\parallel A'B'$, góc giữa $AB$ và $A'D'$ bằng góc giữa $A'B'$ và $A'D'$ là $90^\\circ$ (góc của hình vuông).","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$, tam giác $ABC$ vuông tại $B$. Góc giữa $SB$ và $BC$ bằng:","options":["A. $90^\\circ$","B. $0^\\circ$","C. $45^\\circ$","D. $60^\\circ$"],"answer":"A","explain":"$BC \\perp AB$, $BC \\perp SA$ nên $BC \\perp (SAB)$; suy ra $BC \\perp SB$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Góc giữa $AD'$ và $BC'$ bằng:","options":["A. $90^\\circ$","B. $0^\\circ$","C. $60^\\circ$","D. $45^\\circ$"],"answer":"B","explain":"$AD' \\parallel BC'$ (tứ giác $ABC'D'$ là hình bình hành) nên góc bằng $0^\\circ$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Góc giữa $AC'$ và $BD$ bằng:","options":["A. $0^\\circ$","B. $45^\\circ$","C. $90^\\circ$","D. $60^\\circ$"],"answer":"C","explain":"$BD \\perp AC$, $BD \\perp AA'$ nên $BD \\perp (ACC'A')$; mà $AC' \\subset (ACC'A')$ nên $BD \\perp AC'$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều cạnh $a$, $SA \\perp (ABC)$, $SA = a$. Góc giữa $SB$ và $AC$ bằng:","options":["A. $45^\\circ$","B. $90^\\circ$","C. $60^\\circ$","D. $\\arccos \\frac{\\sqrt{2}}{4}$ ($\\approx 69^\\circ$)"],"answer":"D","explain":"Qua $B$ kẻ $Bx \\parallel AC$; góc giữa $SB$ và $AC$ bằng góc giữa $SB$ và $Bx$. Tính toán cho $\\cos = \\frac{\\sqrt{2}}{4}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Góc giữa hai đường thẳng song song bằng $0^\\circ$.","b) Hai đường thẳng vuông góc khi góc giữa chúng bằng $90^\\circ$.","c) Nếu đường thẳng $d$ vuông góc với hai đường thẳng cắt nhau trong $(P)$ thì $d \\perp (P)$.","d) Trong tứ diện đều, các cặp cạnh đối vuông góc với nhau."],"answer":["T","T","T","T"],"explain":"a) Đúng: định nghĩa b) Đúng: định nghĩa c) Đúng: điều kiện đường thẳng vuông góc mặt phẳng d) Đúng: tính chất tứ diện đều","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $\\vec{u} \\cdot \\vec{v} = 0$ thì hai đường thẳng có vectơ chỉ phương $\\vec{u}, \\vec{v}$ vuông góc.","b) Trong hình chóp $S.ABC$ có $SA \\perp (ABC)$, $\\triangle ABC$ vuông tại $B$ thì $SB \\perp BC$.","c) Cho $a \\perp (P)$, $b \\subset (P)$ thì $a \\perp b$.","d) Hai đường thẳng phân biệt cùng vuông góc với một đường thẳng thứ ba thì song song với nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng: điều kiện vuông góc qua tích vô hướng b) Đúng: $BC \\perp (SAB)$ c) Đúng: định nghĩa d) Sai: trong không gian có thể chéo nhau","points":1},{"type":"short","level":"NB","q":"Trong tứ diện đều, góc giữa hai cạnh đối bằng bao nhiêu độ?","answer":"$90$","explain":"Tính chất tứ diện đều.","points":0.5},{"type":"short","level":"TH","q":"Cho hình hộp chữ nhật. Góc giữa đường chéo $AC'$ và cạnh $AB$ có thể bằng $90^\\circ$ không?","answer":"Không","explain":"$AC'$ xiên với đáy, góc với $AB$ nhọn.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Góc giữa hai đường thẳng trong không gian có số đo thuộc khoảng nào?","options":["A. từ $0^\\circ$ đến $360^\\circ$","B. từ $0^\\circ$ đến $90^\\circ$","C. từ $90^\\circ$ đến $180^\\circ$","D. từ $0^\\circ$ đến $180^\\circ$"],"answer":"B","explain":"Định nghĩa: góc giữa hai đường thẳng là góc từ $0^\\circ$ đến $90^\\circ$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $a \\perp b$, $b \\parallel c$. Kết luận nào đúng?","options":["A. $a$ cắt $c$","B. $a \\parallel c$","C. $a \\perp c$","D. $a$ trùng $c$"],"answer":"C","explain":"Tính chất bắc cầu của quan hệ vuông góc qua song song.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Góc giữa $AB$ và $B'C'$ bằng:","options":["A. $90^\\circ$","B. $45^\\circ$","C. $0^\\circ$","D. $60^\\circ$"],"answer":"A","explain":"$AB \\parallel A'B'$; góc giữa $A'B'$ và $B'C'$ bằng $90^\\circ$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Đường thẳng nào sau đây vuông góc với $AB$?","options":["A. $AD$ và $AA'$","B. $BC$ và $A'C'$","C. $AC$ và $BD$","D. $CD$ và $C'D'$"],"answer":"A","explain":"$AD \\perp AB$ (cạnh kề hình vuông), $AA' \\perp AB$ (cạnh bên vuông góc cạnh đáy).","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lăng trụ đứng $ABC.A'B'C'$ có đáy là tam giác vuông tại $A$. Góc giữa $B'C'$ và $AA'$ bằng:","options":["A. $90^\\circ$","B. $45^\\circ$","C. $0^\\circ$","D. $60^\\circ$"],"answer":"A","explain":"$AA' \\perp (ABC)$ nên $AA'$ vuông góc với mọi đường trong đáy, kể cả $BC \\parallel B'C'$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Góc giữa $AB$ và $CD$ bằng $90^\\circ$. Khẳng định nào giải thích đúng?","options":["A. Không giải thích được","B. $AB$ cắt $CD$","C. $AB \\parallel CD$","D. Gọi $M, N$ là trung điểm $AB, CD$: $CD \\perp (ABN)$ nên $CD \\perp AB$"],"answer":"D","explain":"Trong tam giác cân $ACD, BCD$: $CD \\perp AN$, $CD \\perp BN$ nên $CD \\perp (ABN)$; $AB \\subset (ABN)$ nên $CD \\perp AB$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trong tứ diện đều, các cặp cạnh đối vuông góc với nhau.","b) Hai đường thẳng vuông góc khi góc giữa chúng bằng $90^\\circ$.","c) Đường thẳng vuông góc với mặt phẳng thì vuông góc với mọi đường thẳng nằm trong mặt phẳng đó.","d) Góc giữa $AB$ và $CD$ trong tứ diện đều bằng $60^\\circ$."],"answer":["T","T","T","F"],"explain":"a) Đúng: tính chất tứ diện đều b) Đúng: định nghĩa c) Đúng: định nghĩa đường thẳng vuông góc mặt phẳng d) Sai: bằng $90^\\circ$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho hình lập phương, $A'B \\perp B'C$.","b) Cho $a \\perp (P)$, $b \\subset (P)$ thì $a \\perp b$.","c) Trong hình lập phương, $BD \\perp AC'$.","d) Nếu $SA \\perp (ABC)$ thì $SA \\perp BC$."],"answer":["F","T","T","T"],"explain":"a) Sai: góc giữa chúng bằng $60^\\circ$ b) Đúng: định nghĩa c) Đúng: $AC \\perp (BDD'B')$ d) Đúng: $BC \\subset (ABC)$","points":1},{"type":"short","level":"NB","q":"Nếu $a \\parallel b$ và góc giữa $a, c$ bằng $30^\\circ$ thì góc giữa $b, c$ bằng bao nhiêu độ?","answer":"$30$","explain":"Góc giữa $b, c$ bằng góc giữa $a, c$.","points":0.5},{"type":"short","level":"TH","q":"Góc giữa đường thẳng $a$ và đường thẳng $b$ bằng góc giữa hai đường thẳng nào?","answer":"hai đường thẳng lần lượt song song với $a, b$ cùng đi qua một điểm","explain":"Định nghĩa góc giữa hai đường thẳng trong không gian.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Hai đường thẳng chéo nhau thì:","options":["A. luôn vuông góc với nhau","B. không thể vuông góc với nhau","C. luôn song song với nhau","D. có thể vuông góc với nhau"],"answer":"D","explain":"Hai đường chéo nhau vẫn có góc (xác định qua hai đường song song cùng đi qua một điểm); góc có thể bằng $90^\\circ$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong tứ diện đều $ABCD$, góc giữa hai cạnh đối $AB$ và $CD$ bằng:","options":["A. $45^\\circ$","B. $0^\\circ$","C. $90^\\circ$","D. $60^\\circ$"],"answer":"C","explain":"Tính chất: các cặp cạnh đối của tứ diện đều vuông góc với nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Cặp đường thẳng nào sau đây vuông góc?","options":["A. $AB$ và $A'C'$","B. $AD$ và $BC$","C. $AA'$ và $BB'$","D. $AC$ và $B'D'$"],"answer":"D","explain":"$AC \\parallel A'C'$, $B'D' \\perp A'C'$ (đường chéo hình vuông) nên $AC \\perp B'D'$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $a, b$ là hai đường thẳng trong không gian. Mệnh đề nào đúng?","options":["A. Hai đường thẳng vuông góc thì phải cắt nhau","B. Góc giữa $a, b$ luôn bằng $90^\\circ$","C. Nếu $a \\perp b$ thì góc giữa $a, b$ bằng $90^\\circ$","D. Nếu $a, b$ chéo nhau thì không xác định được góc"],"answer":"C","explain":"Định nghĩa góc và quan hệ vuông góc.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABC$ có $SA = SB = SC$, $AB = BC = CA$. Góc giữa $SA$ và $BC$ bằng:","options":["A. $90^\\circ$","B. $45^\\circ$","C. $60^\\circ$","D. $0^\\circ$"],"answer":"A","explain":"Gọi $M$ là trung điểm $BC$: $BC \\perp AM$, $BC \\perp SM$ nên $BC \\perp (SAM)$; suy ra $BC \\perp SA$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Góc giữa $A'B$ và $B'C$ bằng:","options":["A. $0^\\circ$","B. p b$.","d) Đường chéo của hình lập phương vuông góc với mọi cạnh."],"answer":["T","F","T","F"],"explain":"a) Đúng: định nghĩa qua vectơ b) Sai: góc giữa hai đường thẳng không vượt quá $90^\\circ$, còn góc giữa hai vectơ có thể lớn hơn c) Đúng: định nghĩa d) Sai: chỉ vuông góc với một số đường","points":1},{"type":"short","level":"NB","q":"Kí hiệu $a \\perp b$ đọc là gì?","answer":"$a$ vuông góc với $b$","explain":"Kí hiệu vuông góc.","points":0.5},{"type":"short","level":"TH","q":"Cho $a, b$ chéo nhau và vuông góc. Góc giữa $a, b$ bằng bao nhiêu độ?","answer":"$90$","explain":"Theo định nghĩa.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Cho $a \\perp b$. Góc giữa $a$ và $b$ bằng:","options":["A. $0^\\circ$","B. $180^\\circ$","C. $90^\\circ$","D. $45^\\circ$"],"answer":"C","explain":"Theo định nghĩa hai đường thẳng vuông góc.","points":0.25},{"type":"mcq","level":"NB","q":"Nếu $a \\parallel b$ và $a \\perp c$ thì:","options":["A. không kết luận được","B. $b \\perp c$","C. $b \\parallel c$","D. $b$ cắt $c$"],"answer":"B","explain":"Đường thẳng vuông góc với một trong hai đường song song thì vuông góc với đường còn lại.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Góc giữa $AC$ và $BD$ bằng:","options":["A. $0^\\circ$","B. $90^\\circ$","C. $60^\\circ$","D. $45^\\circ$"],"answer":"B","explain":"$AC, BD$ là hai đường chéo của hình vuông $ABCD$, vuông góc với nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Đường thẳng nào sau đây vuông góc với $AB$?","options":["A. $BC$ và $A'C'$","B. $AD$ và $AA'$","C. $AC$ và $BD$","D. $CD$ và $C'D'$"],"answer":"B","explain":"$AD \\perp AB$ (cạnh kề hình vuông), $AA' \\perp AB$ (cạnh bên vuông góc cạnh đáy).","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện $ABCD$ có $AB = CD = a$, $AC = BD = b$, $AD = BC = c$ (tứ diện gần đều). Góc giữa $AB$ và $CD$ bằng:","options":["A. $0^\\circ$","B. $90^\\circ$","C. $60^\\circ$","D. chưa xác định được"],"answer":"B","explain":"Trong tứ diện gần đều (các cặp cạnh đối bằng nhau), các cặp cạnh đối đôi một vuông góc.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Góc giữa $BD'$ và $AC$ bằng:","options":["A. $60^\\circ$","B. $45^\\circ$","C. $0^\\circ$","D. $90^\\circ$"],"answer":"D","explain":"$AC \\perp BD$, $AC \\perp BB'$ nên $AC \\perp (BDD'B')$; $BD' \\subset (BDD'B')$ nên $AC \\perp BD'$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $a \\parallel b$ và $a \\perp c$ thì $b \\perp c$.","b) Cho $a \\perp b$, $b \\perp c$ thì $a \\parallel c$.","c) Nếu $a \\perp b$ thì $a$ và $b$ không thể chéo nhau.","d) Hai đường thẳng vuông góc thì phải cắt nhau."],"answer":["T","F","F","F"],"explain":"a) Đúng: tính chất b) Sai: trong không gian $a$ có thể chéo $c$ c) Sai: có thể chéo nhau d) Sai: chúng có thể chéo nhau","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hai đường thẳng phân biệt cùng vuông góc với một đường thẳng thứ ba thì song song với nhau.","b) Đường chéo của hình lập phương vuông góc với mọi cạnh.","c) Góc giữa hai đường thẳng bằng góc giữa hai vectơ chỉ phương của chúng.","d) Nếu $\\vec{u} \\cdot \\vec{v} = 0$ thì hai đường thẳng có vectơ chỉ phương $\\vec{u}, \\vec{v}$ vuông góc."],"answer":["F","F","F","T"],"explain":"a) Sai: trong không gian có thể chéo nhau b) Sai: chỉ vuông góc với một số đường c) Sai: góc giữa hai đường thẳng không vượt quá $90^\\circ$, còn góc giữa hai vectơ có thể lớn hơn d) Đúng: điều kiện vuông góc qua tích vô hướng","points":1},{"type":"short","level":"NB","q":"Cho hình hộp chữ nhật $ABCD.A'B'C'D'$. Góc giữa $AB$ và $AA'$ bằng bao nhiêu độ?","answer":"$90$","explain":"Cạnh đáy vuông góc với cạnh bên.","points":0.5},{"type":"short","level":"TH","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Góc giữa $AB$ và $A'D'$ bằng bao nhiêu độ?","answer":"$90$","explain":"$AB \\parallel A'B'$, góc $(A'B', A'D') = 90^\\circ$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Hai đường thẳng $a, b$ được gọi là vuông góc với nhau khi:","options":["A. góc giữa chúng bằng $0^\\circ$","B. chúng cắt nhau","C. góc giữa chúng bằng $90^\\circ$","D. chúng chéo nhau"],"answer":"C","explain":"Định nghĩa: $a \\perp b$ khi góc giữa $a$ và $b$ bằng $90^\\circ$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Góc giữa $AB$ và $BC$ bằng:","options":["A. $90^\\circ$","B. $0^\\circ$","C. $45^\\circ$","D. $60^\\circ$"],"answer":"A","explain":"$AB$ và $BC$ là hai cạnh kề của hình vuông $ABCD$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình chóp $S.ABC$ có $SA \\perp (ABC)$, tam giác $ABC$ vuông tại $B$. Góc giữa $SB$ và $BC$ bằng:","options":["A. $0^\\circ$","B. $90^\\circ$","C. $60^\\circ$","D. $45^\\circ$"],"answer":"B","explain":"$BC \\perp AB$, $BC \\perp SA$ nên $BC \\perp (SAB)$; suy ra $BC \\perp SB$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $a, b$ là hai đường thẳng trong không gian. Mệnh đề nào đúng?","options":["A. Góc giữa $a, b$ luôn bằng $90^\\circ$","B. Nếu $a \\perp b$ thì góc giữa $a, b$ bằng $90^\\circ$","C. Nếu $a, b$ chéo nhau thì không xác định được góc","D. Hai đường thẳng vuông góc thì phải cắt nhau"],"answer":"B","explain":"Định nghĩa góc và quan hệ vuông góc.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Góc giữa $AC'$ và $BD$ bằng:","options":["A. $60^\\circ$","B. $90^\\circ$","C. $0^\\circ$","D. $45^\\circ$"],"answer":"B","explain":"$BD \\perp AC$, $BD \\perp AA'$ nên $BD \\perp (ACC'A')$; mà $AC' \\subset (ACC'A')$ nên $BD \\perp AC'$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình lập phương $ABCD.A'B'C'D'$. Góc giữa $BD'$ và $AC$ bằng:","options":["A. $45^\\circ$","B. $60^\\circ$","C. $0^\\circ$","D. $90^\\circ$"],"answer":"D","explain":"$AC \\perp BD$, $AC \\perp BB'$ nên $AC \\perp (BDD'B')$; $BD' \\subset (BDD'B')$ nên $AC \\perp BD'$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trong tứ diện đều, các cặp cạnh đối vuông góc với nhau.","b) Nếu $a \\parallel b$ và $a \\perp c$ thì $b \\perp c$.","c) Trong hình hộp chữ nhật, hai đường chéo của một mặt đáy luôn vuông góc với nhau.","d) Góc giữa hai đường thẳng song song bằng $0^\\circ$."],"answer":["T","T","F","T"],"explain":"a) Đúng: tính chất tứ diện đều b) Đúng: tính chất c) Sai: chỉ đúng khi mặt đáy là hình vuông; hình chữ nhật thường thì không d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho $a \\perp (P)$, $b \\subset (P)$ thì $a \\perp b$.","b) Tích vô hướng của hai vectơ chỉ phương bằng $0$ là điều kiện cần và đủ để hai đường thẳng vuông góc.","c) Cho hình lập phương, $A'B \\perp B'C$.","d) Hai đường thẳng phân biệt cùng vuông góc với một đường thẳng thứ ba thì song song với nhau."],"answer":["T","T","F","F"],"explain":"a) Đúng: định nghĩa b) Đúng: định nghĩa qua vectơ c) Sai: góc giữa chúng bằng $60^\\circ$ d) Sai: trong không gian có thể chéo nhau","points":1},{"type":"short","level":"NB","q":"Hai đường thẳng song song có góc bằng bao nhiêu độ?","answer":"$0$","explain":"Theo định nghĩa.","points":0.5},{"type":"short","level":"TH","q":"Cho hình lập phương cạnh $a$. Góc giữa hai đường chéo của một mặt bằng bao nhiêu độ?","answer":"$90$","explain":"Hai đường chéo hình vuông vuông góc.","points":0.5}]}]}
