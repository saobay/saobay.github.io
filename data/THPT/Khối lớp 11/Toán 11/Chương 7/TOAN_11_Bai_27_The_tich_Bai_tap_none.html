, góc giữa $(SBC)$ và $(ABC)$ bằng $60^\\circ$. Thể tích bằng:","options":["A. $\\frac{2a^3}{3}$","B. $a^3\\sqrt{3}$","C. $a^3$","D. $2a^3$"],"answer":"B","explain":"$AM = a\\sqrt{3}$ ($M$ là trung điểm $BC$); góc giữa $(SBC)$ và $(ABC)$ là $\\angle SMA = 60^\\circ$ nên $SA = AM \\cdot \\tan 60^\\circ = 3a$; $B = a^2\\sqrt{3}$; $V = \\frac{1}{3} \\cdot a^2\\sqrt{3} \\cdot 3a = a^3\\sqrt{3}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tỉ số thể tích của hai khối chóp có cùng chiều cao bằng tỉ số diện tích hai đáy.","b) Thể tích khối tứ diện đều cạnh $a$ bằng $\\frac{a^3\\sqrt{2}}{12}$.","c) Nếu tăng chiều cao của khối chóp lên $2$ lần thì thể tích tăng $2$ lần.","d) Khối hộp chữ nhật có ba kích thước $a, b, c$ thì thể tích bằng $abc$."],"answer":["T","T","T","T"],"explain":"a) Đúng: công thức b) Đúng: công thức c) Đúng: $V$ tỉ lệ thuận với $h$ d) Đúng: công thức","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Diện tích hình thoi cạnh $a$, góc $60^\\circ$ bằng $\\frac{a^2\\sqrt{3}}{2}$.","b) Thể tích khối hộp $ABCD.A'B'C'D'$ gấp $6$ lần thể tích khối tứ diện $ACB'D'$.","c) Tỉ số thể tích hai khối đa diện đồng dạng tỉ số $k$ bằng $k^3$.","d) Cho tứ diện $ABCD$, $V_{ABCD} = \\frac{1}{3} \\cdot S_{BCD} \\cdot d(A, (BCD))$."],"answer":["T","F","T","T"],"explain":"a) Đúng: hai tam giác đều b) Sai: gấp $3$ lần ($V_{ACB'D'} = \\frac{V}{3}$) c) Đúng: tính chất d) Đúng: công thức","points":1},{"type":"short","level":"NB","q":"Diện tích tam giác đều cạnh $a$ bằng bao nhiêu?","answer":"$\\frac{a^2\\sqrt{3}}{4}$","explain":"Công thức.","points":0.5},{"type":"short","level":"TH","q":"Khối hộp chữ nhật $2 \\times 3 \\times 5$ có thể tích bằng bao nhiêu?","answer":"$30$","explain":"$V = 2 \\cdot 3 \\cdot 5 = 30$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Khối lập phương cạnh $a$ có thể tích bằng:","options":["A. $a^3$","B. $\\frac{a^3}{3}$","C. $3a^3$","D. $6a^2$"],"answer":"A","explain":"$V = a^3$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho khối chóp có thể tích $36$, diện tích đáy $9$. Chiều cao bằng:","options":["A. $4$","B. $108$","C. $12$","D. $6$"],"answer":"C","explain":"$h = \\frac{3V}{B} = \\frac{108}{9} = 12$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho khối chóp $S.ABC$ có thể tích $V$. Gọi $M$ là trung điểm $SA$. Thể tích khối chóp $M.ABC$ bằng:","options":["A. $V$","B. $2V$","C. $\\frac{V}{2}$","D. $\\frac{V}{3}$"],"answer":"C","explain":"Chiều cao giảm một nửa, đáy chung nên thể tích bằng $\\frac{V}{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho khối chóp tứ giác đều có cạnh đáy $2a$, chiều cao $3a$. Thể tích bằng:","options":["A. $12a^3$","B. $6a^3$","C. $8a^3$","D. $4a^3$"],"answer":"D","explain":"$V = \\frac{1}{3} \\cdot 4a^2 \\cdot 3a = 4a^3$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chóp $S.ABCD$ có đáy là hình thoi cạnh $a$, $\\angle BAD = 60^\\circ$, $SA \\perp (ABCD)$, $SA = 2a$. Thể tích bằng:","options":["A. $a^3\\sqrt{3}$","B. $\\frac{a^3}{3}$","C. $\\frac{2a^3\\sqrt{3}}{3}$","D. $\\frac{a^3\\sqrt{3}}{3}$"],"answer":"D","explain":"$B = a^2 \\cdot \\frac{\\sqrt{3}}{2}$; $V = \\frac{1}{3} \\cdot \\frac{a^2\\sqrt{3}}{2} \\cdot 2a = \\frac{a^3\\sqrt{3}}{3}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều cạnh $2a$, $SA \\perp (ABC)$, góc giữa $(SBC)$ và $(ABC)$ bằng $60^\\circ$. Thể tích bằng:","options":["A. $\\frac{2a^3}{3}$","B. $a^3$","C. $2a^3$","D. $a^3\\sqrt{3}$"],"answer":"D","explain":"$AM = a\\sqrt{3}$ ($M$ là trung điểm $BC$); góc giữa $(SBC)$ và $(ABC)$ là $\\angle SMA = 60^\\circ$ nên $SA = AM \\cdot \\tan 60^\\circ = 3a$; $B = a^2\\sqrt{3}$; $V = \\frac{1}{3} \\cdot a^2\\sqrt{3} \\cdot 3a = a^3\\sqrt{3}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu tăng chiều cao của khối chóp lên $2$ lần thì thể tích tăng $2$ lần.","b) Diện tích tam giác đều cạnh $a$ bằng $\\frac{a^2\\sqrt{3}}{4}$.","c) Khối hộp chữ nhật có ba kích thước $a, b, c$ thì thể tích bằng $abc$.","d) Cho $M$ là trung điểm $SA$ thì $V_{M.ABC} = \\frac{1}{2}V_{S.ABC}$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $V$ tỉ lệ thuận với $h$ b) Đúng: công thức c) Đúng: công thức d) Đúng: chiều cao giảm một nửa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho hình chóp $S.ABCD$ đáy là hình bình hành, $V_{S.ABD} = \\frac{1}{2}V_{S.ABCD}$.","b) Thể tích khối hộp $ABCD.A'B'C'D'$ gấp $6$ lần thể tích khối tứ diện $ACB'D'$.","c) Khối bát diện đều cạnh $a$ có thể tích $\\frac{a^3\\sqrt{2}}{3}$.","d) Diện tích hình thoi cạnh $a$, góc $60^\\circ$ bằng $\\frac{a^2\\sqrt{3}}{2}$."],"answer":["T","F","T","T"],"explain":"a) Đúng: đáy $ABD$ bằng nửa đáy b) Sai: gấp $3$ lần ($V_{ACB'D'} = \\frac{V}{3}$) c) Đúng: công thức d) Đúng: hai tam giác đều","points":1},{"type":"short","level":"NB","q":"Chiều cao của khối chóp là khoảng cách từ đâu đến đâu?","answer":"từ đỉnh đến mặt đáy","explain":"Định nghĩa.","points":0.5},{"type":"short","level":"TH","q":"Khối chóp tứ giác đều cạnh đáy $3$, chiều cao $6$. Thể tích bằng bao nhiêu?","answer":"$18$","explain":"$V = \\frac{1}{3} \\cdot 9 \\cdot 6 = 18$.","points":0.5}]}]}
