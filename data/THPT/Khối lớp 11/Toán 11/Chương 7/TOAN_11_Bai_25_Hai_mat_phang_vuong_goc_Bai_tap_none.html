$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình lập phương $ABCD.A'B'C'D'$ cạnh $a$. Góc giữa $(AB'D')$ và $(ABCD)$ có tang bằng:","options":["A. $\\sqrt{2}$","B. $1$","C. $\\frac{1}{2}$","D. $\\frac{\\sqrt{2}}{2}$"],"answer":"A","explain":"Gọi $O$ là tâm đáy: $B'D' \\perp A'O$... góc là $\\angle AOA'$? $\\tan = \\frac{AA'}{AO} = \\frac{a}{a\\sqrt{2}/2} = \\sqrt{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho lăng trụ đứng $ABC.A'B'C'$ có đáy là tam giác đều cạnh $a$, $AA' = a$. Góc giữa $(AB'C')$ và $(ABC)$ có tang bằng:","options":["A. $1$","B. $\\sqrt{3}$","C. $\\frac{2\\sqrt{3}}{3}$","D. $\\frac{\\sqrt{3}}{3}$"],"answer":"C","explain":"Gọi $M$ là trung điểm $B'C'$: $B'C' \\perp A'M$, $B'C' \\perp AM$ nên góc là $\\angle AMA'$; $\\tan = \\frac{AA'}{A'M} = \\frac{a}{a\\sqrt{3}/2} = \\frac{2\\sqrt{3}}{3}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hai mặt phẳng song song thì góc giữa chúng bằng $0^\\circ$.","b) Hai mặt phẳng phân biệt cùng vuông góc với một mặt phẳng thứ ba thì song song với nhau.","c) Cho $(P) \\perp (Q)$, $d = (P) \\cap (Q)$; nếu $a \\subset (P)$, $a \\perp d$ thì $a \\perp (Q)$.","d) Hai mặt phẳng vuông góc khi góc giữa chúng bằng $90^\\circ$."],"answer":["T","F","T","T"],"explain":"a) Đúng: quy ước b) Sai: có thể cắt nhau c) Đúng: tính chất d) Đúng: định nghĩa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho tứ diện đều, góc giữa hai mặt bên có cosin bằng $\\frac{1}{3}$.","b) Nếu $(P) \\perp (Q)$, $d \\perp (P)$ thì $d \\parallel (Q)$ hoặc $d \\subset (Q)$.","c) Trong hình lập phương, $(ACC'A') \\perp (BDD'B')$.","d) Hai mặt phẳng vuông góc thì giao tuyến của chúng vuông góc với cả hai mặt phẳng."],"answer":["T","T","T","F"],"explain":"a) Đúng: tính theo định lí cosin b) Đúng: tính chất c) Đúng: $BD \\perp (ACC'A')$ d) Sai: giao tuyến nằm trong cả hai mặt phẳng","points":1},{"type":"short","level":"NB","q":"Cho $(P) \\perp (Q)$, $d = (P) \\cap (Q)$, $a \\subset (P)$, $a \\perp d$. Kết luận về $a$ và $(Q)$?","answer":"$a \\perp (Q)$","explain":"Tính chất.","points":0.5},{"type":"short","level":"TH","q":"Diện tích hình chiếu của tam giác lên mặt phẳng bằng diện tích tam giác nhân với cosin của góc nào?","answer":"góc giữa hai mặt phẳng","explain":"Công thức diện tích hình chiếu.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Điều kiện để hai mặt phẳng $(P), (Q)$ vuông góc là:","options":["A. $(P)$ song song với $(Q)$","B. $(P)$ chứa một đường thẳng vuông góc với $(Q)$","C. $(P)$ chứa một đường thẳng song song với $(Q)$","D. giao tuyến của chúng vuông góc với $(P)$"],"answer":"B","explain":"Định lí: mặt phẳng chứa đường thẳng vuông góc với mặt phẳng kia thì vuông góc với nó.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $(P) \\perp (Q)$ và $d \\subset (P)$, $d \\perp$ giao tuyến của $(P), (Q)$. Kết luận nào đúng?","options":["A. không kết luận được","B. $d \\perp (Q)$","C. $d \\subset (Q)$","D. $d \\parallel (Q)$"],"answer":"B","explain":"Tính chất: đường thẳng trong mặt phẳng này vuông góc với giao tuyến thì vuông góc với mặt phẳng kia.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tứ diện $ABCD$ có $AB \\perp (BCD)$, $BE$ là đường cao của tam giác $BCD$ ($E$ trên $CD$). Khẳng định nào đúng?","options":["A. $(ABC) \\perp (ACD)$","B. $(ABE) \\perp (ABC)$","C. $(ABE) \\perp (ACD)$","D. $(ABD) \\perp (ABC)$"],"answer":"C","explain":"$CD \\perp BE$, $CD \\perp AB$ nên $CD \\perp (ABE)$; $CD \\subset (ACD)$ nên $(ACD) \\perp (ABE)$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $(P) \\perp (Q)$ và đường thẳng $d$ vuông góc với $(P)$. Vị trí của $d$ đối với $(Q)$ là:","options":["A. $d \\parallel (Q)$ hoặc $d \\subset (Q)$","B. $d$ cắt $(Q)$","C. không kết luận được","D. $d \\perp (Q)$"],"answer":"A","explain":"Tính chất liên hệ.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tứ diện đều $ABCD$ cạnh $a$. Góc giữa hai mặt $(ABC)$ và $(ABD)$ có cosin bằng:","options":["A. $\\frac{1}{3}$","B. $\\frac{1}{2}$","C. $\\frac{\\sqrt{2}}{2}$","D. $\\frac{\\sqrt{3}}{3}$"],"answer":"A","explain":"Gọi $M$ là trung điểm $AB$: góc là $\\angle CMD$; $\\cos = \\frac{CM^2 + DM^2 - CD^2}{2 \\cdot CM \\cdot DM} = \\frac{1}{3}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình chóp $S.ABC$ có đáy là tam giác đều cạnh $a$, $O$ là trọng tâm, $SO \\perp (ABC)$, $SO = a$. Góc giữa $(SBC)$ và $(ABC)$ có tang bằng:","options":["A. $\\frac{\\sqrt{3}}{3}$","B. $2\\sqrt{3}$","C. $\\sqrt{3}$","D. $1$"],"answer":"B","explain":"$OM = \\frac{a\\sqrt{3}}{6}$ ($M$ là trung điểm $BC$); $\\tan = \\frac{SO}{OM} = \\frac{a}{a\\sqrt{3}/6} = 2\\sqrt{3}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $(P)$ chứa một đường thẳng vuông góc với $(Q)$ thì $(P) \\perp (Q)$.","b) Mặt bên của hình lăng trụ đứng vuông góc với mặt đáy.","c) Hai mặt phẳng vuông góc khi góc giữa chúng bằng $90^\\circ$.","d) Góc giữa hai mặt phẳng bằng góc giữa hai đường thẳng lần lượt nằm trong hai mặt phẳng đó."],"answer":["T","T","T","F"],"explain":"a) Đúng: điều kiện b) Đúng: định nghĩa lăng trụ đứng c) Đúng: định nghĩa d) Sai: phải là hai đường lần lượt vuông góc với hai mặt phẳng","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho tứ diện đều, góc giữa hai mặt bên có cosin bằng $\\frac{1}{3}$.","b) Trong hình lập phương, $(ACC'A') \\perp (BDD'B')$.","c) Cho $(P) \\perp (Q)$; hình chiếu của một đường thẳng trong $(P)$ lên $(Q)$ luôn là một đường thẳng.","d) Nếu $(SAB) \\perp (ABC)$ và $SH \\perp AB$ ($H$ trên $AB$) thì $SH \\perp (ABC)$."],"answer":["T","T","F","T"],"explain":"a) Đúng: tính theo định lí cosin b) Đúng: $BD \\perp (ACC'A')$ c) Sai: có thể là một điểm d) Đúng: tính chất","points":1},{"type":"short","level":"NB","q":"Góc giữa hai mặt phẳng song song bằng bao nhiêu độ?","answer":"$0$","explain":"Quy ước.","points":0.5},{"type":"short","level":"TH","q":"Trong hình chóp $S.ABC$ có $SA \\perp (ABC)$, $M$ là trung điểm $BC$ (đáy đều). Góc giữa $(SBC)$ và $(ABC)$ là góc nào?","answer":"$SMA$","explain":"$BC \\perp AM, SM$.","points":0.5}]}]}
