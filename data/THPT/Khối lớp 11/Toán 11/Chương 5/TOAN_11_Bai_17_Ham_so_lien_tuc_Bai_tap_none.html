ương nên nghiệm duy nhất thuộc $(0; 1)$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $f$ liên tục trên $[a; b]$ và tích $f(a) \\cdot f(b)$ âm thì tồn tại $c \\in (a; b)$ sao cho $f(c) = 0$.","b) Hàm số $y = f(x)$ liên tục tại $x_0$ nếu $\\lim_{x \\to x_0} f(x) = f(x_0)$.","c) Hàm số $y = \\sin x$ liên tục trên $\\mathbb{R}$.","d) Nếu $\\lim_{x \\to x_0^+} f(x) \\ne \\lim_{x \\to x_0^-} f(x)$ thì $f$ gián đoạn tại $x_0$."],"answer":["T","T","T","T"],"explain":"a) Đúng: định lí về giá trị trung gian b) Đúng: định nghĩa hàm số liên tục tại một điểm c) Đúng: hàm lượng giác cơ bản liên tục trên $\\mathbb{R}$ d) Đúng: không tồn tại giới hạn hai bên","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phương trình $2x^3 - 6x + 1 = 0$ có $3$ nghiệm phân biệt.","b) Hàm số $f(x) = x+1$ khi $x \\ge 0$ và $f(x) = x-1$ khi $x$ âm thì liên tục tại $x = 0$.","c) Nếu $f$ liên tục trên $(a; b)$ thì $f$ liên tục tại mọi điểm của $(a; b)$.","d) Nếu $f, g$ liên tục tại $x_0$ thì $\\frac{f}{g}$ liên tục tại $x_0$."],"answer":["T","F","T","F"],"explain":"a) Đúng: $f(-2)$ và $f(0)$ trái dấu, $f(0)$ và $f(1)$ trái dấu, $f(1)$ và $f(2)$ trái dấu b) Sai: giới hạn trái bằng $-1 \\ne 1$ bằng giới hạn phải c) Đúng: định nghĩa liên tục trên khoảng d) Sai: cần thêm điều kiện $g(x_0) \\ne 0$","points":1},{"type":"short","level":"NB","q":"Hàm số $f(x) = -1x^2 + 1$ có liên tục tại $x = 2$ không? (Trả lời Có/Không)","answer":"Có","explain":"Hàm đa thức liên tục trên $\\mathbb{R}$ nên liên tục tại $x = 2$.","points":0.5},{"type":"short","level":"TH","q":"Cho $f(x) = \\frac{x^2-25}{x-5}$ khi $x \\ne 5$ và $f(5) = m$. Giá trị của $m$ để $f$ liên tục tại $x = 5$ là bao nhiêu?","answer":"$10$","explain":"$\\lim_{x \\to 5} f(x) = 10$ nên $m = 10$.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hàm số nào sau đây KHÔNG liên tục trên $\\mathbb{ au đây?","options":["A. chỉ tại $x_0 = 1$","B. không tại điểm nào","C. mọi điểm $x_0 \\in \\mathbb{R}$","D. chỉ tại $x_0 = 0$"],"answer":"C","explain":"Hàm hằng $y = 4$ liên tục tại mọi điểm thuộc $\\mathbb{R}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hàm số $f(x) = 2x+1$ khi $x$ nhỏ hơn $1$ và $f(x) = mx+1$ khi $x \\ge 1$. Giá trị của $m$ để $f$ liên tục tại $x = 1$ là:","options":["A. $m = 1$","B. $m = 4$","C. $m = 0$","D. $m = 2$"],"answer":"D","explain":"$\\lim_{x \\to 1^-} f(x) = 2 + 1 = 3$; $f(1) = m + 1$. Liên tục khi $m + 1 = 3$, suy ra $m = 2$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $f(x) = 2x+1$ khi $x$ nhỏ hơn $2$ và $f(x) = x^2+-1$ khi $x \\ge 2$. Khẳng định nào đúng?","options":["A. $\\lim_{x \\to 2} f(x) = 3$","B. $f$ gián đoạn tại $x = 2$","C. $f$ liên tục tại $x = 2$","D. $f$ không xác định tại $x = 2$"],"answer":"B","explain":"$\\lim_{x \\to 2^-} f(x) = 5$, $\\lim_{x \\to 2^+} f(x) = f(2) = 3$. Vì $5 \\ne 3$ nên $f$ gián đoạn tại $x = 2$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{x \\to 2} \\frac{\\sqrt{x+2}-2}{x-2}$ bằng:","options":["A. 0,25","B. $0$","C. 0,5","D. $4$"],"answer":"A","explain":"Nhân liên hợp: $\\frac{\\sqrt{x+2}-2}{x-2} = \\frac{1}{\\sqrt{x+2}+2} \\to \\frac{1}{2 \\cdot 2} = 0{,}25$.","points":0.25},{"type":"mcq","level":"VDC","q":"Phương trình $x^3 - 12x + 0 = 0$ có bao nhiêu nghiệm phân biệt?","options":["A. $1$","B. $2$","C. $3$","D. $0$"],"answer":"C","explain":"Đặt $f(x) = x^3 - 12x + 0$ liên tục trên $\\mathbb{R}$. $f$ có hai điểm cực trị tại $x = \\pm2$ với $f(-2) \\cdot f(2)$ âm nên đồ thị cắt trục hoành tại $3$ điểm phân biệt.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi hàm đa thức đều liên tục trên $\\mathbb{R}$.","b) Hàm số $f(x) = |x|$ liên tục tại $x = 0$.","c) Đồ thị của hàm số liên tục trên một khoảng là một đường liền nét, không bị đứt.","d) Hàm số $y = f(x)$ liên tục tại $x_0$ nếu $\\lim_{x \\to x_0} f an d) Đúng: tính chất của hàm đa thức","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phương trình $x^3 + x - 1 = 0$ có ít nhất một nghiệm thực.","b) Phương trình $2x^3 - 6x + 1 = 0$ có $3$ nghiệm phân biệt.","c) Nếu $f$ liên tục tại $x_0$ và $f(x_0)$ dương thì $f(x)$ dương trong một lân cận của $x_0$.","d) Hàm $f(x) = \\frac{x^2-1}{x-1}$ ($x \\ne 1$), $f(1) = 2$ liên tục tại $x = 1$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $f(0) = -1$ âm còn $f(1) = 1$ dương, $f$ liên tục nên b) Đúng: $f(-2)$ và $f(0)$ trái dấu, $f(0)$ và $f(1)$ trái dấu, $f(1)$ và $f(2)$ trái dấu c) Đúng: tính bảo toàn dấu của hàm liên tục d) Đúng: $\\lim_{x \\to 1} f(x) = 2 = f(1)$","points":1},{"type":"short","level":"NB","q":"Hàm số $f(x) = -2x^2 + 1$ có liên tục tại $x = 2$ không? (Trả lời Có/Không)","answer":"Có","explain":"Hàm đa thức liên tục trên $\\mathbb{R}$ nên liên tục tại $x = 2$.","points":0.5},{"type":"short","level":"TH","q":"Cho $f(x) = \\frac{x^2-9}{x-3}$ khi $x \\ne 3$ và $f(3) = m$. Giá trị của $m$ để $f$ liên tục tại $x = 3$ là bao nhiêu?","answer":"$6$","explain":"$\\lim_{x \\to 3} f(x) = 6$ nên $m = 6$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Hàm số nào sau đây KHÔNG liên tục trên $\\mathbb{R}$?","options":["A. $y = x^3 + x$","B. $y = x^2 - 3$","C. $y = 2x + 1$","D. $y = \\frac{1}{x}$"],"answer":"D","explain":"Các hàm đa thức đều liên tục trên $\\mathbb{R}$; hàm đã chọn gián đoạn (hoặc không xác định) tại ít nhất một điểm.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm số $y = -1$ liên tục tại điểm nào sau đây?","options":["A. chỉ tại $x_0 = 0$","B. chỉ tại $x_0 = 1$","C. mọi điểm $x_0 \\in \\mathbb{R}$","D. không tại điểm nào"],"answer":"C","explain":"Hàm hằng $y = -1$ liên tục tại mọi điểm thuộc $\\mathbb{R}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hàm số $f(x) = 3x+2$ khi $x$ nhỏ hơn $1$ và $f(x) = mx+2$ khi $x \\ge 1$. Giá trị của $m$ để $f$ liên tục tại $x = 1$ là:","options":["A. $m = 2$","B. $m = 3$","C. $m = 4$","D. $m = 7$"],"answer":"B","explain":"$\\lim_{x \\to 1^-} f(x) = 3 + 2 = 5$; $f(1) = m + 2$. Liên tục khi $m + 2 = 5$, suy ra $m = 3$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $f(x) = 2x+1$ khi $x$ nhỏ hơn $2$ và $f(x) = x^2+0$ khi $x \\ge 2$. Khẳng định nào đúng?","options":["A. $f$ liên tục tại $x = 2$","B. $f$ không xác định tại $x = 2$","C. $f$ gián đoạn tại $x = 2$","D. $\\lim_{x \\to 2} f(x) = 4$"],"answer":"C","explain":"$\\lim_{x \\to 2^-} f(x) = 5$, $\\lim_{x \\to 2^+} f(x) = f(2) = 4$. Vì $5 \\ne 4$ nên $f$ gián đoạn tại $x = 2$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{x \\to 2} \\frac{\\sqrt{x+2}-2}{x-2}$ bằng:","options":["A. 0,5","B. $4$","C. 0,25","D. $1$"],"answer":"C","explain":"Nhân liên hợp: $\\frac{\\sqrt{x+2}-2}{x-2} = \\frac{1}{\\sqrt{x+2}+2} \\to \\frac{1}{2 \\cdot 2} = 0{,}25$.","points":0.25},{"type":"mcq","level":"VDC","q":"Phương trình $x^3 - 12x + 0 = 0$ có bao nhiêu nghiệm phân biệt?","options":["A. $1$","B. $3$","C. $2$","D. $0$"],"answer":"B","explain":"Đặt $f(x) = x^3 - 12x + 0$ liên tục trên $\\mathbb{R}$. $f$ có hai điểm cực trị tại $x = \\pm2$ với $f(-2) \\cdot f(2)$ âm nên đồ thị cắt trục hoành tại $3$ điểm phân biệt.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi hàm đa thức đều liên tục trên $\\mathbb{R}$.","b) Nếu $f$ gián đoạn tại $x_0$ thì $f$ không có giới hạn tại $x_0$.","c) Hàm số $f(x) = \\sqrt{x}$ liên tục trên $[0; +\\infty)$.","d) Hàm số $y = \\sin x$ liên tục trên $\\mathbb{R}$."],"answer":["T","F","T","T"],"explain":"a) Đúng: tính chất của hàm đa thức b) Sai: $f$ có thể có giới hạn nhưng khác $f(x_0)$ c) Đúng: hàm căn thức liên tục trên tập xác định d) Đúng: hàm lượng giác cơ bản liên tục trên $\\mathbb{R}$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi hàm số liên tục trên đo  \\to 2} (x + 2) = 4$. Liên tục tại $2$ khi $k = f(2) = \\lim f(x) = 4$.","points":0.25},{"type":"mcq","level":"TH","q":"Hàm số $y = \\frac{1}{x-1}$ gián đoạn tại điểm nào?","options":["A. $x = 1$","B. $x = -2$","C. $x = 2$","D. $x = 0$"],"answer":"A","explain":"Hàm số không xác định tại $x = 1$ nên gián đoạn tại đó.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hàm số $f(x) = \\frac{x^2-16}{x-4}$ khi $x \\ne 4$ và $f(4) = m$. Giá trị của $m$ để $f$ liên tục tại $x = 4$ là:","options":["A. $m = 4$","B. $m = 16$","C. $m = 1$","D. $m = 8$"],"answer":"D","explain":"$\\lim_{x \\to 4} \\frac{x^2-16}{x-4} = \\lim_{x \\to 4} (x+4) = 8$. Để liên tục tại $4$ cần $m = f(4) = 8$.","points":0.25},{"type":"mcq","level":"VDC","q":"Phương trình $x^3 + 1x - 1 = 0$ có nghiệm duy nhất thuộc khoảng nào?","options":["A. $(-1; 0)$","B. $(-2; -1)$","C. $(1; 2)$","D. $(0; 1)$"],"answer":"D","explain":"Đặt $f(x) = x^3 + 1x - 1$ liên tục trên $\\mathbb{R}$, $f'(x) = 3x^2 + 1$ luôn dương nên $f$ đồng biến (nghiệm duy nhất). $f(0) = -1$ âm còn $f(1) = 1$ dương nên nghiệm duy nhất thuộc $(0; 1)$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàm số $y = \\sin x$ liên tục trên $\\mathbb{R}$.","b) Hàm số $f(x) = \\frac{1}{x}$ liên tục tại $x = 0$.","c) Tổng của hai hàm số liên tục là một hàm số liên tục.","d) Hàm số $f(x) = |x|$ liên tục tại $x = 0$."],"answer":["T","F","T","T"],"explain":"a) Đúng: hàm lượng giác cơ bản liên tục trên $\\mathbb{R}$ b) Sai: hàm không xác định tại $x = 0$ c) Đúng: phép toán về hàm liên tục d) Đúng: $\\lim_{x \\to 0} |x| = 0 = f(0)$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàm số $f(x) = [x]$ (phần nguyên) liên tục tại $x = 1$.","b) Hàm số $f(x) = x^2$ liên tục tại mọi $x_0 \\in \\mathbb{R}$.","c) Phương trình $x^5 - 3x + 1 = 0$ có ít nhất một nghiệm trong $(0; 1)$.","d) Nếu $f$ liên tục trên $(a; b)$ thì $f$ liên tục t oạn tại $x = 1$"],"answer":"D","explain":"$\\lim_{x \\to 1^-} f(x) = 3$, $\\lim_{x \\to 1^+} f(x) = f(1) = 4$. Vì $3 \\ne 4$ nên $f$ gián đoạn tại $x = 1$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{x \\to 2} \\frac{\\sqrt{x+7}-3}{x-2}$ bằng:","options":["A. $0$","B. $6$","C. $1$","D. 1/6"],"answer":"D","explain":"Nhân liên hợp: $\\frac{\\sqrt{x+7}-3}{x-2} = \\frac{1}{\\sqrt{x+7}+3} \\to \\frac{1}{2 \\cdot 3} = \\frac{1}{6}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Phương trình $x^3 - 12x + 5 = 0$ có bao nhiêu nghiệm phân biệt?","options":["A. $3$","B. $0$","C. $1$","D. $2$"],"answer":"A","explain":"Đặt $f(x) = x^3 - 12x + 5$ liên tục trên $\\mathbb{R}$. $f$ có hai điểm cực trị tại $x = \\pm2$ với $f(-2) \\cdot f(2)$ âm nên đồ thị cắt trục hoành tại $3$ điểm phân biệt.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàm số $f(x) = \\frac{1}{x}$ liên tục tại $x = 0$.","b) Nếu $f$ liên tục trên $[a; b]$ và tích $f(a) \\cdot f(b)$ âm thì tồn tại $c \\in (a; b)$ sao cho $f(c) = 0$.","c) Đồ thị của hàm số liên tục trên một khoảng là một đường liền nét, không bị đứt.","d) Nếu $\\lim_{x \\to x_0^+} f(x) \\ne \\lim_{x \\to x_0^-} f(x)$ thì $f$ gián đoạn tại $x_0$."],"answer":["F","T","T","T"],"explain":"a) Sai: hàm không xác định tại $x = 0$ b) Đúng: định lí về giá trị trung gian c) Đúng: nhận xét trực quan trong SGK d) Đúng: không tồn tại giới hạn hai bên","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàm $f(x) = \\frac{x^2-1}{x-1}$ ($x \\ne 1$), $f(1) = 2$ liên tục tại $x = 1$.","b) Nếu $f, g$ liên tục tại $x_0$ thì $\\frac{f}{g}$ liên tục tại $x_0$.","c) Mọi hàm số liên tục trên đoạn $[a; b]$ đều bị chặn trên đoạn đó.","d) Hàm số $f(x) = x+1$ khi $x \\ge 0$ và $f(x) = x-1$ khi $x$ âm thì liên tục tại $x = 0$."],"answer":["T","F","T","F"],"explain":"a) Đúng: $\\lim_{x \\to 1} f(x) = 2 = f(1)$ b) Sai: cần thêm điều kiện $g(x_0) \\ne 0$ c) Đúng: tính chất của hàm liên tục trên đoạn d) Sai: giới hạn trái bằng $-1 \\ne 1$ bằng giới hạn phải","points":1},{"type":"short","level":"NB","q":"Hàm số $f(x) = \\frac{1}{x - 5}$ có liên tục tại $x = 5$ không? (Trả lời Có/Không)","answer":"Không","explain":"Hàm số không xác định tại $x = 5$ nên gián đoạn tại đó.","points":0.5},{"type":"short","level":"TH","q":"Phương trình $x^3 -5x + 1 = 0$ có ít nhất một nghiệm trong khoảng $(0; 1)$ không? (Trả lời Có/Không)","answer":"Có","explain":"$f(0) = 1$ dương còn $f(1) = -3$ âm,  $f$ liên tục trên $[0; 1]$ nên tồn tại nghiệm trong $(0; 1)$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hàm số nào sau đây liên tục trên $\\mathbb{R}$?","options":["A. $y = \\frac{x}{x-2}$","B. $y = -3x^3 + x$","C. $y = \\tan x$","D. $y = \\frac{1}{x}$"],"answer":"B","explain":"Mọi hàm đa thức đều liên tục trên $\\mathbb{R}$; các phương án còn lại gián đoạn tại ít nhất một điểm.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm số $y = \\frac{1}{x+2}$ liên tục trên:","options":["A. $\\emptyset$","B. $\\mathbb{R}$","C. $[0; +\\infty)$","D. $\\mathbb{R} \\setminus \\{-2}$"],"answer":"D","explain":"Hàm phân thức liên tục trên từng khoảng của tập xác định; ở đây TXĐ là $\\mathbb{R} \\setminus \\{-2\\}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hàm số $f(x) = \\frac{x^2-9}{x-3}$ khi $x \\ne 3$ và $f(3) = k$. Hàm số liên tục tại $x = 3$ khi:","options":["A. $k = 6$","B. $k = -6$","C. $k = 3$","D. $k = 0$"],"answer":"A","explain":"$\\lim_{x \\to 3} f(x) = \\lim_{x \\to 3} (x + 3) = 6$. Liên tục tại $3$ khi $k = f(3) = \\lim f(x) = 6$.","points":0.25},{"type":"mcq","level":"TH","q":"Hàm số $y = \\frac{1}{x+1}$ gián đoạn tại điểm nào?","options":["A. $x = 1$","B. $x = -1$","C. $x = 0$","D. $x = -2$"],"answer":"B","explain":"Hàm số không xác định tại $x = -1$ nên gián đoạn tại đó.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hàm số $f(x) = \\frac{x^2-36}{x-6}$ khi $x \\ne 6$ và $f(6) = m$. Giá trị của $m$ để $f$ liên tục tại $x = 6$ là:","options":["A. $m = 12$","B. $m = 0$","C. $m = 36$","D. $m = 1$"],"answer":"A","explain":"$\\lim_{x \\to 6} \\frac{x^2-36}{x-6} = \\lim_{x \\to 6} (x+6) = 12$. Để liên tục tại $6$ cần $m = f(6) = 12$.","points":0.25},{"type":"mcq","level":"VDC","q":"Phương trình $x^3 + 3x - 2 = 0$ có nghiệm duy nhất thuộc khoảng nào?","options":["A. $(-1; 0)$","B. $(-2; -1)$","C. $(0; 1)$","D. $(1; 2)$"],"answer":"C","explain":"Đặt $f(x) = x^3 + 3x - 2$ liên tục trên $\\mathbb{R}$, $f'(x) = 3x^2 + 3$ luôn dương nên $f$ đồng biến (nghiệm duy nhất). $f(0) = -2$ âm còn $f(1) = 2$ dương nên nghiệm duy nhất thuộc $(0; 1)$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi hàm đa thức đều liên tục trên $\\mathbb{R}$.","b) Hàm phân thức liên tục trên từng khoảng của tập xác định.","c) Nếu $f$ gián đoạn tại $x_0$ thì $f$ không có giới hạn tại $x_0$.","d) Hàm số $y = f(x)$ liên tục tại $x_0$ nếu $\\lim_{x \\to x_0} f(x) = f(x_0)$."],"answer":["T","T","F","T"],"explain":"a) Đúng: tính chất của hàm đa thức b) Đúng: tính chất của hàm phân thức c) Sai: $f$ có thể có giới hạn nhưng khác $f(x_0)$ d) Đúng: định nghĩa hàm số liên tục tại một điểm","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $f$ liên tục trên $(a; b)$ thì $f$ liên tục tại mọi điểm của $(a; b)$.","b) Hàm số $f(x) = x^2$ liên tục tại mọi $x_0 \\in \\mathbb{R}$.","c) Phương trình $2x^3 - 6x + 1 = 0$ có $3$ nghiệm phân biệt.","d) Nếu $f, g$ liên tục tại $x_0$ thì $\\frac{f}{g}$ liên tục tại $x_0$."],"answer":["T","T","T","F"],"explain":"a) Đúng: định nghĩa liên tục trên khoảng b) Đúng: hàm đa thức liên tục trên $\\mathbb{R}$ c) Đúng: $f(-2)$ và $f(0)$ trái dấu, $f(0)$ và $f(1)$ trái dấu, $f(1)$ và $f(2)$ trái dấu d) Sai: cần thêm điều kiện $g(x_0) \\ne 0$","points":1},{"type":"short","level":"NB","q":"Hàm số $f(x) = 4x^2 + 1$ có liên tục tại $x = 2$ không? (Trả lời Có/Không)","answer":"Có","explain":"Hàm đa thức liên tục trên $\\mathbb{R}$ nên liên tục tại $x = 2$.","points":0.5},{"type":"short","level":"TH","q":"Cho $f(x) = \\frac{x^2-4}{x-2}$ khi $x \\ne 2$ và $f(2) = m$. Giá trị của $m$ để $f$ liên tục tại $x = 2$ là bao nhiêu?","answer":"$4$","explain":"$\\lim_{x \\to 2} f(x) = 4$ nên $m = 4$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Hàm số nào sau đây KHÔNG liên tục trên $\\mathbb{R}$?","options":["A. $y = x^3 + x$","B. $y = x^2 - 3$","C. $y = \\frac{1}{x^2-4}$","D. $y = 2x + 1$"],"answer":"C","explain":"Các hàm đa thức đều liên tục trên $\\mathbb{R}$; hàm đã chọn gián đoạn (hoặc không xác định) tại ít nhất một điểm.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm số $y = 2$ liên tục tại điểm nào sau đây?","options":["A. chỉ tại $x_0 = 0$","B. chỉ tại $x_0 = 1$","C. mọi điểm $x_0 \\in \\mathbb{R}$","D. không tại điểm nào"],"answer":"C","explain":"Hàm hằng $y = 2$ liên tục tại mọi điểm thuộc $\\mathbb{R}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hàm số $f(x) = 3x+2$ khi $x$ nhỏ hơn $1$ và $f(x) = mx+2$ khi $x \\ge 1$. Giá trị của $m$ để $f$ liên tục tại $x = 1$ là:","options":["A. $m = 4$","B. $m = 3$","C. $m = 7$","D. $m = 2$"],"answer":"B","explain":"$\\lim_{x \\to 1^-} f(x) = 3 + 2 = 5$; $f(1) = m + 2$. Liên tục khi $m + 2 = 5$, suy ra $m = 3$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $f(x) = 2x+1$ khi $x$ nhỏ hơn $2$ và $f(x) = x^2+-1$ khi $x \\ge 2$. Khẳng định nào đúng?","options":["A. $f$ gián đoạn tại $x = 2$","B. $f$ không xác định tại $x = 2$","C. $f$ liên tục tại $x = 2$","D. $\\lim_{x \\to 2} f(x) = 3$"],"answer":"A","explain":"$\\lim_{x \\to 2^-} f(x) = 5$, $\\lim_{x \\to 2^+} f(x) = f(2) = 3$. Vì $5 \\ne 3$ nên $f$ gián đoạn tại $x = 2$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{x \\to 2} \\frac{\\sqrt{x+7}-3}{x-2}$ bằng:","options":["A. $0$","B. 1/3","C. 1/6","D. $6$"],"answer":"C","explain":"Nhân liên hợp: $\\frac{\\sqrt{x+7}-3}{x-2} = \\frac{1}{\\sqrt{x+7}+3} \\to \\frac{1}{2 \\cdot 3} = \\frac{1}{6}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Phương trình $x^3 - 3x + (-1) = 0$ có bao nhiêu nghiệm phân biệt?","options":["A. $1$","B. $2$","C. $3$","D. $0$"],"answer":"C","explain":"Đặt $f(x) = x^3 - 3x + -1$ liên tục trên $\\mathbb{R}$. $f$ có hai điểm cực trị tại $x = \\pm1$ với $f(-1) \\cdot f(1)$ âm nên đồ thị cắt trục hoành tại $3$ điểm phân biệt.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi hàm đa thức đều liên tục trên $\\mathbb{R}$.","b) Hàm số $f(x) = \\frac{1}{x}$ liên tục tại $x = 0$.","c) Tổng của hai hàm số liên tục là một hàm số liên tục.","d) Nếu $\\lim_{x \\to x_0^+} f(x) \\ne \\lim_{x \\to x_0^-} f(x)$ thì $f$ gián đoạn tại $x_0$."],"answer":["T","F","T","T"],"explain":"a) Đúng: tính chất của hàm đa thức b) Sai: hàm không xác định tại $x = 0$ c) Đúng: phép toán về hàm liên tục d) Đúng: không tồn tại giới hạn hai bên","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàm $f(x) = \\frac{x^2-1}{x-1}$ ($x \\ne 1$), $f(1) = 3$ gián đoạn tại $x = 1$.","b) Hàm số $f(x) = x+1$ khi $x \\ge 0$ và $f(x) = x-1$ khi $x$ âm thì liên tục tại $x = 0$.","c) Hàm số $f(x) = x^2$ liên tục tại mọi $x_0 \\in \\mathbb{R}$.","d) Hàm số $f(x) = [x]$ (phần nguyên) liên tục tại $x = 1$."],"answer":["T","F","T","F"],"explain":"a) Đúng: $\\lim_{x \\to 1} f(x) = 2 \\ne 3 = f(1)$ b) Sai: giới hạn trái bằng $-1 \\ne 1$ bằng giới hạn phải c) Đúng: hàm đa thức liên tục trên $\\mathbb{R}$ d) Sai: giới hạn trái bằng $0$, giới hạn phải bằng $1$","points":1},{"type":"short","level":"NB","q":"Hàm số $f(x) = \\frac{1}{x - 4}$ có liên tục tại $x = 4$ không? (Trả lời Có/Không)","answer":"Không","explain":"Hàm số không xác định tại $x = 4$ nên gián đoạn tại đó.","points":0.5},{"type":"short","level":"TH","q":"Phương trình $x^3 -5x + 2 = 0$ có ít nhất một nghiệm trong khoảng $(0; 1)$ không? (Trả lời Có/Không)","answer":"Có","explain":"$f(0) = 2$ dương còn $f(1) = -2$ âm,  $f$ liên tục trên $[0; 1]$ nên tồn tại nghiệm trong $(0; 1)$.","points":0.5}]}]}
