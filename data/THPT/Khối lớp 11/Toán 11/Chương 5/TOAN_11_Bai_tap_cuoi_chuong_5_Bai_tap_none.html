to -\\infty} x^3 = -\\infty$.","d) Mọi hàm đa thức đều có giới hạn tại mọi điểm $x_0 \\in \\mathbb{R}$."],"answer":["F","T","T","T"],"explain":"a) Sai: khi $x \\to 1^-$ thì $x - 1$ âm nên giới hạn bằng $-\\infty$ b) Đúng: giới hạn của hàm hằng c) Đúng: lũy thừa bậc lẻ tại $-\\infty$ d) Đúng: bằng giá trị của hàm tại $x_0$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phương trình $2x^3 - 6x + 1 = 0$ có $3$ nghiệm phân biệt.","b) Phương trình $x^5 - 3x + 1 = 0$ có ít nhất một nghiệm trong $(0; 1)$.","c) Nếu $f$ liên tục tại $x_0$ và $f(x_0)$ dương thì $f(x)$ dương trong một lân cận của $x_0$.","d) Hàm số $f(x) = x^2$ liên tục tại mọi $x_0 \\in \\mathbb{R}$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $f(-2)$ và $f(0)$ trái dấu, $f(0)$ và $f(1)$ trái dấu, $f(1)$ và $f(2)$ trái dấu b) Đúng: $f(0) = 1$ dương, $f(1) = -1$ âm c) Đúng: tính bảo toàn dấu của hàm liên tục d) Đúng: hàm đa thức liên tục trên $\\mathbb{R}$","points":1},{"type":"short","level":"NB","q":"$\\lim_{{n \\to +\\infty}} (1)$ bằng bao nhiêu?","answer":"$1$","explain":"Giới hạn của hằng số bằng chính nó: $\\lim (1) = 1$.","points":0.5},{"type":"short","level":"TH","q":"Tổng của cấp số nhân lùi vô hạn $(16, 8, 4, \\dots)$ bằng bao nhiêu?","answer":"$32$","explain":"$S = \\frac{u_1}{1-q} = \\frac{16}{1-1/2} = 32$.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"$\\lim_{{n \\to +\\infty}} 1$ bằng:","options":["A. $+\\infty$","B. $0$","C. $-1$","D. $1$"],"answer":"D","explain":"Giới hạn của dãy hằng số bằng chính hằng số đó: $\\lim 1 = 1$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\lim_{x \\to 0} (3x^2+3x-3)$ bằng:","options":["A. $-3$","B. $0$","C. $-6$","D. $-2$"],"answer":"A","explain":"Thay trực tiếp $x = 0$: $3 \\cdot 0^2 + (3) \\cdot (0) + (-3) = -3$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hàm số $f(x) = \\frac{x^2-16}{x-4}$ khi $x \\ne 4$ và $f(4) = k$. Hàm số liên tục tại $x = 4$ khi:","options":["A. $k = 8$","B. $k = 0$","C. $k = 16$","D. $k = -8$"],"answer":"A","explain":"$\\lim_{x \\to 4} f(x) = \\lim_{x \\to 4} (x + 4) = 8$. Liên tục tại $4$ khi $k = f(4) = \\lim f(x) = 8$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\lim_{x \\to -\\infty} \\frac{3x^2+1}{2x^2-3}$ bằng:","options":["A. $0$","B. 1,5","C. $1$","D. $-\\infty$"],"answer":"B","explain":"Chia cả tử và mẫu cho $x^2$: giới hạn $= \\frac{3}{2} = 1{,}5$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{{n \\to +\\infty}} \\left(\\sqrt{n^2+2n+4} - n\\right)$ bằng:","options":["A. $-1$","B. $2$","C. $0$","D. $1$"],"answer":"D","explain":"Nhân liên hợp: $\\frac{(2n+4)}{\\sqrt{n^2+2n+4}+n} = \\frac{2+4/n}{\\sqrt{1+2/n+4/n^2}+1} \\to \\frac{2}{2} = 1$.","points":0.25},{"type":"mcq","level":"VDC","q":"Phương trình $x^3 - 3x + 1 = 0$ có bao nhiêu nghiệm phân biệt?","options":["A. $2$","B. $0$","C. $1$","D. $3$"],"answer":"D","explain":"Đặt $f(x) = x^3 - 3x + 1$ liên tục trên $\\mathbb{R}$. $f$ có hai điểm cực trị tại $x = \\pm1$ với $f(-1) \\cdot f(1)$ âm nên đồ thị cắt trục hoành tại $3$ điểm phân biệt.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàm phân thức liên tục trên từng khoảng của tập xác định.","b) Hàm số $f(x) = |x|$ liên tục tại $x = 0$.","c) Nếu $f$ gián đoạn tại $x_0$ thì $f$ không có giới hạn tại $x_0$.","d) Nếu $\\lim_{x \\to x_0^+} f(x) \\ne \\lim_{x \\to x_0^-} f(x)$ thì $f$ gián đoạn tại $x_0$."],"answer":["T","T","F","T"],"explain":"a) Đúng: tính chất của hàm phân thức b) Đúng: $\\lim_{x \\to 0} |x| = 0 = f(0)$ c) Sai: $f$ có thể có giới hạn nhưng khác $f(x_0)$ d) Đúng: không tồn tại giới hạn hai bên","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $f$ liên tục trên $(a; b)$ thì $f$ liên tục tại mọi điểm của $(a; b)$.","b) Hàm số $f(x) = x^2$ liên tục tại mọi $x_0 \\in \\mathbb{R}$.","c) Hàm $f(x) = \\frac{x^2-1}{x-1}$ ($x \\ne 1$), $f(1) = 3$ gián đoạn tại $x = 1$.","d) Nếu $f, g$ liên tục tại $x_0$ thì $\\frac{f}{g}$ liên tục tại $x_0$."],"answer":["T","T","T","F"],"explain":"a) Đúng: định nghĩa liên tục trên khoảng b) Đúng: hàm đa thức liên tục trên $\\mathbb{R}$ c) Đúng: $\\lim_{x \\to 1} f(x) = 2 \\ne 3 = f(1)$ d) Sai: cần thêm điều kiện $g(x_0) \\ne 0$","points":1},{"type":"short","level":"NB","q":"$\\lim_{{n \\to +\\infty}} \\frac{6}{n}$ bằng bao nhiêu?","answer":"$0$","explain":"$\\lim \\frac{6}{n} = 6 \\cdot \\lim \\frac{1}{n} = 0$.","points":0.5},{"type":"short","level":"TH","q":"Cho $f(x) = \\frac{x^2-25}{x-5}$ khi $x \\ne 5$ và $f(5) = m$. Giá trị của $m$ để $f$ liên tục tại $x = 5$ là bao nhiêu?","answer":"$10$","explain":"$\\lim_{x \\to 5} f(x) = 10$ nên $m = 10$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"$\\lim_{{n \\to +\\infty}} \\frac{1}{n^{3}}$ bằng:","options":["A. $4$","B. $+\\infty$","C. $1$","D. $0$"],"answer":"D","explain":"$\\lim \\frac{1}{n^3} = 0$ với mọi $k \\ge 1$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\lim_{{n \\to +\\infty}} \\left(-3/7\\right)^n$ bằng:","options":["A. $1$","B. $+\\infty$","C. $0$","D. $-\\infty$"],"answer":"C","explain":"Vì $\\left|\\frac{-3}{7}\\right| = \\frac{3}{7} $ (nhỏ hơn $1$) nên $\\lim q^n = 0$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\lim_{x \\to -3} \\frac{x^2 - 9}{x - (-3)}$ bằng:","options":["A. $6$","B. $0$","C. $9$","D. $-6$"],"answer":"D","explain":"Dạng $\\frac{0}{0}$: $\\frac{x^2 - 9}{x - (-3)} = \\frac{(x - (-3))(x + 3)}{x - (-3)} = x + 3 \\to -6$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\lim_{x \\to -\\infty} \\frac{2x^2+1}{4x^2-3}$ bằng:","options":["A. 0,4","B. 0,75","C. 0,5","D. $-\\infty$"],"answer":"C","explain":"Chia cả tử và mẫu cho $x^2$: giới hạn $= \\frac{2}{4} = 0{,}5$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{x \\to 4} \\frac{\\sqrt{x} - 2}{x - 4}$ bằng:","options":["A. $2$","B. 0,25","C. 0,5","D. $4$"],"answer":"B","explain":"Nhân liên hợp: $\\frac{\\sqrt{x} - 2}{x - 4} = \\frac{1}{\\sqrt{x} + 2} \\to \\frac{1}{2 \\cdot 2} = 0{,}25$.","points":0.25},{"type":"mcq","level":"VDC","q":"$\\lim_{x \\to 1^+} \\frac{x^2 - 1}{|x - 1|}$ bằng:","options":["A. $2$","B. $1$","C. $4$","D. $-2$"],"answer":"A","explain":"Với $x \\to 1^+$: $|x - 1| = x - 1$ nên $\\frac{(x-1)(x+1)}{|x-1|} = x + 1 \\to 2$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàm phân thức liên tục trên từng khoảng của tập xác định.","b) Hàm số $y = f(x)$ liên tục tại $x_0$ nếu $\\lim_{x \\to x_0} f(x) = f(x_0)$.","c) Hàm số $y = \\sin x$ liên tục trên $\\mathbb{R}$.","d) Nếu $f$ liên tục trên $[a; b]$ và tích $f(a) \\cdot f(b)$ âm thì tồn tại $c \\in (a; b)$ sao cho $f(c) = 0$."],"answer":["T","T","T","T"],"explain":"a) Đúng: tính chất của hàm phân thức b) Đúng: định nghĩa hàm số liên tục tại một điểm c) Đúng: hàm lượng giác cơ bản liên tục trên $\\mathbb{R}$ d) Đúng: định lí về giá trị trung gian","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàm $f(x) = \\frac{x^2-1}{x-1}$ ($x \\ne 1$), $f(1) = 3$ gián đoạn tại $x = 1$.","b) Phương trình $x^5 - 3x + 1 = 0$ có ít nhất một nghiệm trong $(0; 1)$.","c) Hàm số $f(x) = x^2$ liên tục tại mọi $x_0 \\in \\mathbb{R}$.","d) Nếu $f, g$ liên tục tại $x_0$ thì $\\frac{f}{g}$ liên tục tại $x_0$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $\\lim_{x \\to 1} f(x) = 2 \\ne 3 = f(1)$ b) Đúng: $f(0) = 1$ dương, $f(1) = -1$ âm c) Đúng: hàm đa thức liên tục trên $\\mathbb{R}$ d) Sai: cần thêm điều kiện $g(x_0) \\ne 0$","points":1},{"type":"short","level":"NB","q":"$\\lim_{{n \\to +\\infty}} \\frac{4}{n}$ bằng bao nhiêu?","answer":"$0$","explain":"$\\lim \\frac{4}{n} = 4 \\cdot \\lim \\frac{1}{n} = 0$.","points":0.5},{"type":"short","level":"TH","q":"$\\lim_{{n \\to +\\infty}} \\frac{3n}{2n+2}$ bằng bao nhiêu?","answer":"1,5","explain":"Chia cả tử và mẫu cho $n$: giới hạn $= \\frac{3}{2} = 1{,}5$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Hàm số nào sau đây liên tục trên $\\mathbb{R}$?","options":["A. $y = 7x - 2$","B. $y = \\frac{x}{x-2}$","C. $y = \\frac{1}{x}$","D. $y = \\tan x$"],"answer":"A","explain":"Mọi hàm đa thức đều liên tục trên $\\mathbb{R}$; các phương án còn lại gián đoạn tại ít nhất một điểm.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm số $y = 2$ liên tục tại điểm nào sau đây?","options":["A. không tại điểm nào","B. chỉ tại $x_0 = 0$","C. mọi điểm $x_0 \\in \\mathbb{R}$","D. chỉ tại $x_0 = 1$"],"answer":"C","explain":"Hàm hằng $y = 2$ liên tục tại mọi điểm thuộc $\\mathbb{R}$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\lim_{x \\to -3} \\frac{x^2 - 9}{x - (-3)}$ bằng:","options":["A. $9$","B. $-6$","C. $-3$","D. $6$"],"answer":"B","explain":"Dạng $\\frac{0}{0}$: $\\frac{x^2 - 9}{x - (-3)} = \\frac{(x - (-3))(x + 3)}{x - (-3)} = x + 3 \\to -6$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $f(x) = 2x+1$ khi $x$ nhỏ hơn $2$ và $f(x) = x^2+0$ khi $x \\ge 2$. Khẳng định nào đúng?","options":["A. $f$ liên tục tại $x = 2$","B. $f$ gián đoạn tại $x = 2$","C. $\\lim_{x \\to 2} f(x) = 4$","D. $f$ không xác định tại $x = 2$"],"answer":"B","explain":"$\\lim_{x \\to 2^-} f(x) = 5$, $\\lim_{x \\to 2^+} f(x) = f(2) = 4$. Vì $5 \\ne 4$ nên $f$ gián đoạn tại $x = 2$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{x \\to 9} \\frac{\\sqrt{x} - 3}{x - 9}$ bằng:","options":["A. $6$","B. $0$","C. 1/6","D. 1/3"],"answer":"C","explain":"Nhân liên hợp: $\\frac{\\sqrt{x} - 3}{x - 9} = \\frac{1}{\\sqrt{x} + 3} \\to \\frac{1}{2 \\cdot 3} = \\frac{1}{6}$.","points":0.25},{"type":"mcq","level":"VDC","q":"$\\lim_{x \\to 0} \\frac{\\sqrt{1+4x} - 1}{x}$ bằng:","options":["A. $-2$","B. $4$","C. $0$","D. $2$"],"answer":"D","explain":"Nhân liên hợp: $\\frac{\\sqrt{1+4x} - 1}{x} = \\frac{4}{\\sqrt{1+4x}+1} \\to \\frac{4}{2} = 2$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\lim_{x \\to +\\infty} \\frac{2x+1}{x-3} = 2$.","b) $\\lim_{x \\to x_0} c = c$ với $c$ là hằng số.","c) $\\lim_{x \\to +\\infty} \\frac{1}{x} = 0$.","d) $\\lim_{x \\to 2} \\frac{x^2-4}{x-2} = 4$."],"answer":["T","T","T","T"],"explain":"a) Đúng: chia cả tử mẫu cho $x$ b) Đúng: giới hạn của hàm hằng c) Đúng: giới hạn cơ bản tại vô cực d) Đúng: rút gọn được $x + 2 \\to 4$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $f$ liên tục trên $(a; b)$ thì $f$ liên tục tại mọi điểm của $(a; b)$.","b) Mọi hàm số liên tục trên đoạn $[a; b]$ đều bị chặn trên đoạn đó.","c) Hàm số $f(x) = x^2$ liên tục tại mọi $x_0 \\in \\mathbb{R}$.","d) Phương trình $2x^3 - 6x + 1 = 0$ có $3$ nghiệm phân biệt."],"answer":["T","T","T","T"],"explain":"a) Đúng: định nghĩa liên tục trên khoảng b) Đúng: tính chất của hàm liên tục trên đoạn c) Đúng: hàm đa thức liên tục trên $\\mathbb{R}$ d) Đúng: $f(-2)$ và $f(0)$ trái dấu, $f(0)$ và $f(1)$ trái dấu, $f(1)$ và $f(2)$ trái dấu","points":1},{"type":"short","level":"NB","q":"$\\lim_{x \\to 0} (3x-4)$ bằng bao nhiêu?","answer":"$-4$","explain":"Thay trực tiếp: $3 \\cdot (0) + (-4) = -4$.","points":0.5},{"type":"short","level":"TH","q":"Tổng của cấp số nhân lùi vô hạn $(8, 4, 2, \\dots)$ bằng bao nhiêu?","answer":"$16$","explain":"$S = \\frac{u_1}{1-q} = \\frac{8}{1-1/2} = 16$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"$\\lim_{{n \\to +\\infty}} 2$ bằng:","options":["A. $+\\infty$","B. $0$","C. $2$","D. $-2$"],"answer":"C","explain":"Giới hạn của dãy hằng số bằng chính hằng số đó: $\\lim 2 = 2$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\lim_{x \\to -\\infty} (-5)$ bằng:","options":["A. $+\\infty$","B. $0$","C. $-\\infty$","D. $-5$"],"answer":"D","explain":"Giới hạn của hàm hằng tại vô cực vẫn bằng hằng số: $-5$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\lim_{{n \\to +\\infty}} \\frac{3n+3}{4n^2+3}$ bằng:","options":["A. $0$","B. $+\\infty$","C. $-\\infty$","D. $2$"],"answer":"A","explain":"Bậc của tử (1) nhỏ hơn bậc của mẫu (2) nên giới hạn bằng $0$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $f(x) = 2x+1$ khi $x$ nhỏ hơn $2$ và $f(x) = x^2+0$ khi $x \\ge 2$. Khẳng định nào đúng?","options":["A. $\\lim_{x \\to 2} f(x) = 4$","B. $f$ gián đoạn tại $x = 2$","C. $f$ liên tục tại $x = 2$","D. $f$ không xác định tại $x = 2$"],"answer":"B","explain":"$\\lim_{x \\to 2^-} f(x) = 5$, $\\lim_{x \\to 2^+} f(x) = f(2) = 4$. Vì $5 \\ne 4$ nên $f$ gián đoạn tại $x = 2$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{x \\to 2} \\frac{\\sqrt{x+2}-2}{x-2}$ bằng:","options":["A. $0$","B. 0,5","C. 0,25","D. $4$"],"answer":"C","explain":"Nhân liên hợp: $\\frac{\\sqrt{x+2}-2}{x-2} = \\frac{1}{\\sqrt{x+2}+2} \\to \\frac{1}{2 \\cdot 2} = 0{,}25$.","points":0.25},{"type":"mcq","level":"VDC","q":"$\\lim_{{n \\to +\\infty}} \\frac{2 \\cdot 3^n + 1}{4 \\cdot 3^n - 2}$ bằng:","options":["A. 0,5","B. -0,5","C. $0$","D. $2$"],"answer":"A","explain":"Chia cả tử và mẫu cho $3^n$: $\\lim \\frac{2 + 1/3^n}{4 - 2/3^n} = \\frac{2}{4} = 0{,}5$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\lim_{n \\to +\\infty} q^n = 0$ khi $\\left|q\\right|$ nhỏ hơn $1$.","b) Nếu $\\lim u_n = a$, $\\lim v_n = b$ hữu hạn thì $\\lim (u_n + v_n) = a + b$.","c) Nếu $\\lim u_n = +\\infty$ thì $\\lim \\frac{1}{u_n} = 0$.","d) $\\lim_{n \\to +\\infty} \\frac{1}{n^2} = 1$."],"answer":["T","T","T","F"],"explain":"a) Đúng: tính chất của lũy thừa b) Đúng: phép toán về giới hạn c) Đúng: nghịch đảo của vô cực là $0$ d) Sai: giới hạn này bằng $0$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $|q| \\ge 1$ thì cấp số nhân không có tổng lùi vô hạn.","b) $0,(6) = \\frac{2}{3}$.","c) $\\lim_{n \\to +\\infty} \\frac{3n+1}{n+2} = 3$.","d) $\\lim_{n \\to +\\infty} (\\sqrt{n^2+1} - n) = 0$."],"answer":["T","T","T","T"],"explain":"a) Đúng: điều kiện $\\left|q\\right|$ nhỏ hơn $1$ là bắt buộc b) Đúng: tương tự: $\\frac{6/10}{1-1/10} = \\frac{2}{3}$ c) Đúng: chia cả tử mẫu cho $n$ d) Đúng: nhân liên hợp được $\\frac{1}{\\sqrt{n^2+1}+n} \\to 0$","points":1},{"type":"short","level":"NB","q":"$\\lim_{x \\to -3} (3x+4)$ bằng bao nhiêu?","answer":"$-5$","explain":"Thay trực tiếp: $3 \\cdot (-3) + (4) = -5$.","points":0.5},{"type":"short","level":"TH","q":"$\\lim_{{n \\to +\\infty}} \\frac{5n-2}{2n+1}$ bằng bao nhiêu?","answer":"2,5","explain":"Chia cả tử và mẫu cho $n$: giới hạn $= \\frac{5}{2} = 2{,}5$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"$\\lim_{{n \\to +\\infty}} \\frac{1}{n^{5}}$ bằng:","options":["A. $6$","B. $0$","C. $+\\infty$","D. $1$"],"answer":"B","explain":"$\\lim \\frac{1}{n^5} = 0$ với mọi $k \\ge 1$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\lim_{{n \\to +\\infty}} (2n^2)$ bằng:","options":["A. $-\\infty$","B. $1$","C. $+\\infty$","D. $0$"],"answer":"C","explain":"$\\lim (2n^2) = +\\infty$ vì bậc dương và hệ số dương.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hàm số $f(x) = \\frac{x^2-16}{x-4}$ khi $x \\ne 4$ và $f(4) = k$. Hàm số liên tục tại $x = 4$ khi:","options":["A. $k = 16$","B. $k = -8$","C. $k = 4$","D. $k = 8$"],"answer":"D","explain":"$\\lim_{x \\to 4} f(x) = \\lim_{x \\to 4} (x + 4) = 8$. Liên tục tại $4$ khi $k = f(4) = \\lim f(x) = 8$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\lim_{x \\to -\\infty} \\frac{3x^2+1}{4x^2-3}$ bằng:","options":["A. $1$","B. $+\\infty$","C. 0,75","D. $-\\infty$"],"answer":"C","explain":"Chia cả tử và mẫu cho $x^2$: giới hạn $= \\frac{3}{4} = 0{,}75$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{x \\to +\\infty} \\left(\\sqrt{x^2+4x+1} - x\\right)$ bằng:","options":["A. $+\\infty$","B. $-2$","C. $0$","D. $2$"],"answer":"D","explain":"Nhân liên hợp: $\\frac{4x+1}{\\sqrt{x^2+4x+1}+x} \\to \\frac{4}{2} = 2$.","points":0.25},{"type":"mcq","level":"VDC","q":"$\\lim_{x \\to 1^+} \\frac{x^2 - 1}{|x - 1|}$ bằng:","options":["A. $1$","B. $-2$","C. $2$","D. $0$"],"answer":"C","explain":"Với $x \\to 1^+$: $|x - 1| = x - 1$ nên $\\frac{(x-1)(x+1)}{|x-1|} = x + 1 \\to 2$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi hàm đa thức đều liên tục trên $\\mathbb{R}$.","b) Hàm số $f(x) = |x|$ liên tục tại $x = 0$.","c) Nếu $f$ liên tục trên $[a; b]$ và tích $f(a) \\cdot f(b)$ âm thì tồn tại $c \\in (a; b)$ sao cho $f(c) = 0$.","d) Hàm phân thức liên tục trên từng khoảng của tập xác định."],"answer":["T","T","T","T"],"explain":"a) Đúng: tính chất của hàm đa thức b) Đúng: $\\lim_{x \\to 0} |x| = 0 = f(0)$ c) Đúng: định lí về giá trị trung gian d) Đúng: tính chất của hàm phân thức","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\lim_{x \\to 3} \\frac{|x-3|}{x-3}$ không tồn tại.","b) $\\lim_{x \\to 2} \\frac{x^3-8}{x-2} = 12$.","c) Hàm số $f(x) = \\frac{1}{x}$ có giới hạn tại $x = 0$.","d) $\\lim_{x \\to 0} \\frac{\\sin x}{x} = 1$."],"answer":["T","T","F","T"],"explain":"a) Đúng: giới hạn trái bằng $-1$, giới hạn phải bằng $1$ b) Đúng: rút gọn $x^2+2x+4 \\to 12$ c) Sai: hàm không xác định tại $x = 0$ và hai giới hạn một bên khác nhau d) Đúng: giới hạn lượng giác cơ bản","points":1},{"type":"short","level":"NB","q":"Hàm số $f(x) = 4x^2 + 1$ có liên tục tại $x = 2$ không? (Trả lời Có/Không)","answer":"Có","explain":"Hàm đa thức liên tục trên $\\mathbb{R}$ nên liên tục tại $x = 2$.","points":0.5},{"type":"short","level":"TH","q":"$\\lim_{{n \\to +\\infty}} \\frac{2n-3}{2n+1}$ bằng bao nhiêu?","answer":"$1$","explain":"Chia cả tử và mẫu cho $n$: giới hạn $= \\frac{2}{2} = 1$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"$\\lim_{{n \\to +\\infty}} \\frac{1}{n^{5}}$ bằng:","options":["A. $6$","B. $0$","C. $1$","D. $+\\infty$"],"answer":"B","explain":"$\\lim \\frac{1}{n^5} = 0$ với mọi $k \\ge 1$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\lim_{{n \\to +\\infty}} \\left(1/3\\right)^n$ bằng:","options":["A. $-\\infty$","B. $1$","C. $0$","D. $+\\infty$"],"answer":"C","explain":"Vì $\\left|\\frac{1}{3}\\right| = \\frac{1}{3} $ (nhỏ hơn $1$) nên $\\lim q^n = 0$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\lim_{{n \\to +\\infty}} \\frac{2n+1}{2n^2+1}$ bằng:","options":["A. $+\\infty$","B. $-\\infty$","C. $0$","D. $1$"],"answer":"C","explain":"Bậc của tử (1) nhỏ hơn bậc của mẫu (2) nên giới hạn bằng $0$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $f(x) = 2x+1$ khi $x$ nhỏ hơn $2$ và $f(x) = x^2+-1$ khi $x \\ge 2$. Khẳng định nào đúng?","options":["A. $\\lim_{x \\to 2} f(x) = 3$","B. $f$ liên tục tại $x = 2$","C. $f$ gián đoạn tại $x = 2$","D. $f$ không xác định tại $x = 2$"],"answer":"C","explain":"$\\lim_{x \\to 2^-} f(x) = 5$, $\\lim_{x \\to 2^+} f(x) = f(2) = 3$. Vì $5 \\ne 3$ nên $f$ gián đoạn tại $x = 2$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{x \\to 9} \\frac{\\sqrt{x} - 3}{x - 9}$ bằng:","options":["A. 1/6","B. $6$","C. 1/3","D. $0$"],"answer":"A","explain":"Nhân liên hợp: $\\frac{\\sqrt{x} - 3}{x - 9} = \\frac{1}{\\sqrt{x} + 3} \\to \\frac{1}{2 \\cdot 3} = \\frac{1}{6}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tổng của cấp số nhân lùi vô hạn có số hạng đầu $6$ và công bội $\\frac{1}{3}$ bằng:","options":["A. $4$","B. $6$","C. $0$","D. $9$"],"answer":"D","explain":"Tổng CSN lùi vô hạn: $S = \\frac{u_1}{1 - q} = \\frac{6}{1 - (\\frac{1}{3})} = 9$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\lim_{x \\to 1^-} \\frac{1}{x-1} = +\\infty$.","b) $\\lim_{x \\to 0^+} \\frac{1}{x} = -\\infty$.","c) Nếu $\\lim_{x \\to x_0} f(x) = L$, $\\lim_{x \\to x_0} g(x) = M$ hữu hạn thì $\\lim_{x \\to x_0} [f(x) \\cdot g(x)] = L \\cdot M$.","d) $\
