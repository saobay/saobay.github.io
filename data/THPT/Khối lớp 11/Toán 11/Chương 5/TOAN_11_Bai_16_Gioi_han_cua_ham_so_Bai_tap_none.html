","q":"$\\lim_{x \\to -\\infty} \\frac{3x^2+1}{4x^2-3}$ bằng:","options":["A. $0$","B. $-\\infty$","C. 0,75","D. $+\\infty$"],"answer":"C","explain":"Chia cả tử và mẫu cho $x^2$: giới hạn $= \\frac{3}{4} = 0{,}75$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{x \\to +\\infty} \\left(\\sqrt{x^2+6x+1} - x\\right)$ bằng:","options":["A. $+\\infty$","B. $-3$","C. $3$","D. $6$"],"answer":"C","explain":"Nhân liên hợp: $\\frac{6x+1}{\\sqrt{x^2+6x+1}+x} \\to \\frac{6}{2} = 3$.","points":0.25},{"type":"mcq","level":"VDC","q":"$\\lim_{x \\to 3^+} \\frac{x^2 - 9}{|x - 3|}$ bằng:","options":["A. $6$","B. $-6$","C. $0$","D. $3$"],"answer":"A","explain":"Với $x \\to 3^+$: $|x - 3| = x - 3$ nên $\\frac{(x-3)(x+3)}{|x-3|} = x + 3 \\to 6$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\lim_{x \\to +\\infty} \\frac{1}{x} = 0$.","b) Nếu $\\lim_{x \\to x_0} f(x) = L$, $\\lim_{x \\to x_0} g(x) = M$ hữu hạn thì $\\lim_{x \\to x_0} [f(x) \\cdot g(x)] = L \\cdot M$.","c) $\\lim_{x \\to -\\infty} x^3 = -\\infty$.","d) Nếu $\\lim_{x \\to x_0^+} f(x) = \\lim_{x \\to x_0^-} f(x) = L$ thì $\\lim_{x \\to x_0} f(x) = L$."],"answer":["T","T","T","T"],"explain":"a) Đúng: giới hạn cơ bản tại vô cực b) Đúng: phép toán về giới hạn hàm số c) Đúng: lũy thừa bậc lẻ tại $-\\infty$ d) Đúng: điều kiện tồn tại giới hạn hai bên","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\lim_{x \\to 1} \\frac{x^2-1}{x^2-3x+2} = -2$.","b) Hàm số $f(x) = \\frac{1}{x}$ có giới hạn tại $x = 0$.","c) $\\lim_{x \\to 0} \\frac{\\sin x}{x} = 1$.","d) $\\lim_{x \\to 2} \\frac{x^3-8}{x-2} = 12$."],"answer":["T","F","T","T"],"explain":"a) Đúng: rút gọn $\\frac{x+1}{x-2} \\to -2$ b) Sai: hàm không xác định tại $x = 0$ và hai giới hạn một bên khác nhau c) Đúng: giới hạn lượng giác cơ bản d) Đúng: rút gọn $x^2+2x+4 \\to 12$","points":1},{"type":"short","level":"NB","q":"$\\lim_{x \\to 2} (x^2 + 1)$ bằng bao nhiêu?","answer":"$5$","explain":"Thay trực tiếp: $2^2 + 1 = 5$.","points":0.5},{"type":"short","level":"TH","q":"$\\lim_{x \\to +\\infty} \\frac{2x+1}{3x-2}$ bằng bao nhiêu?","answer":"2/3","explain":"Chia cả tử mẫu cho $x$: $\\frac{2}{3} = \\frac{2}{3}$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"$\\lim_{x \\to -1} (2x)$ bằng:","options":["A. $-2$","B. $-3$","C. $-1$","D. $0$"],"answer":"A","explain":"Hàm đa thức có giới hạn bằng giá trị tại điểm đó: $\\lim_{x \\to -1} (2x) = 2 \\cdot (-1) + (0) = -2$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\lim_{x \\to 1} (1x^2-3x-3)$ bằng:","options":["A. $-4$","B. $0$","C. $5$","D. $-5$"],"answer":"D","explain":"Thay trực tiếp $x = 1$: $1 \\cdot 1^2 + (-3) \\cdot (1) + (-3) = -5$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\lim_{x \\to 1} \\frac{x^2 - 1}{x - 1}$ bằng:","options":["A. $2$","B. $-2$","C. $1$","D. $0$"],"answer":"A","explain":"Dạng $\\frac{0}{0}$: $\\frac{x^2 - 1}{x - 1} = \\frac{(x - 1)(x + (-1))}{x - 1} = x + (-1) \\to 2$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\lim_{x \\to +\\infty} \\frac{3x+3}{3x}$ bằng:","options":["A. $0$","B. 4/3","C. $1$","D. 0,75"],"answer":"C","explain":"Chia cả tử và mẫu cho $x$: giới hạn $= \\frac{3}{3} = 1$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\lim_{x \\to 16} \\frac{\\sqrt{x} - 4}{x - 16}$ bằng:","options":["A. 0,25","B. $4$","C. $8$","D. 1/8"],"answer":"D","explain":"Nhân liên hợp: $\\frac{\\sqrt{x} - 4}{x - 16} = \\frac{1}{\\sqrt{x} + 4} \\to \\frac{1}{2 \\cdot 4} = \\frac{1}{8}$.","points":0.25},{"type":"mcq","level":"VDC","q":"$\\lim_{x \\to 0} \\frac{\\sqrt{1+4x} - 1}{x}$ bằng:","options":["A. $4$","B. $0$","C. $2$","D. $1$"],"answer":"C","explain":"Nhân liên hợp: $\\frac{\\sqrt{1+4x} - 1}{x} = \\frac{4}{\\sqrt{1+4x}+1} \\to \\frac{4}{2} = 2$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\lim_{x \\to x_0} c =
