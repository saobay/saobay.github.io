 không so sánh được","D. $\\left(\\frac{1}{2}\\right)^{2}$ lớn hơn $\\left(\\frac{1}{2}\\right)^{6}$"],"answer":"D","explain":"Hàm $y = \\left(\\frac{1}{2}\\right)^x$ nghịch biến; $2$ nhỏ hơn $6$ nên $\\left(\\frac{1}{2}\\right)^{2}$ lớn hơn $\\left(\\frac{1}{2}\\right)^{6}$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàm số $y = a^x$ ($a$ dương, $a$ khác $1$) có tập xác định là $\\mathbb{R}$.","b) Đồ thị $y = 2^x$ và $y = \\log_2 x$ đối xứng qua đường thẳng $y = x$.","c) Tập giá trị của $y = 3^x$ là $(0; +\\infty)$.","d) Tập giá trị của $y = \\log_5 x$ là $\\mathbb{R}$."],"answer":["T","T","T","T"],"explain":"a) Đúng: định nghĩa hàm số mũ b) Đúng: hai hàm ngược nhau c) Đúng: tính chất hàm mũ d) Đúng: tính chất hàm lôgarit","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đồ thị $y = \\log_3 x$ đi qua điểm $(9; 3)$.","b) Nếu $0$ nhỏ hơn $a$ nhỏ hơn $1$ thì $a^m$ lớn hơn $a^n$ tương đương $m$ nhỏ hơn $n$.","c) $\\log_2 5$ nhỏ hơn $\\log_2 7$.","d) Nếu $a$ lớn hơn $1$ thì $a^m$ lớn hơn $a^n$ tương đương $m$ lớn hơn $n$."],"answer":["F","T","T","T"],"explain":"a) Sai: đi qua $(9; 2)$ vì $\\log_3 9 = 2$ b) Đúng: tính đơn điệu đảo ngược c) Đúng: hàm $\\log_2$ đồng biến d) Đúng: tính đơn điệu","points":1},{"type":"short","level":"NB","q":"Tập xác định của hàm số $y = \\log_{2} x$ là gì?","answer":"$(0; +\\infty)$","explain":"Hàm lôgarit xác định khi $x$ dương.","points":0.5},{"type":"short","level":"TH","q":"Hàm số $y = 2^x$ đồng biến hay nghịch biến trên $\\mathbb{R}$?","answer":"đồng biến","explain":"Cơ số $2$ lớn hơn $1$ nên hàm đồng biến.","points":0.5}]}]}
