ai của các khẳng định sau:","statements":["a) Nếu $0$ nhỏ hơn $a$ nhỏ hơn $1$ thì $a^m$ lớn hơn $a^n$ khi $m$ lớn hơn $n$.","b) Nếu $a$ lớn hơn $1$ thì $a^m$ lớn hơn $a^n$ khi $m$ lớn hơn $n$.","c) $a^{-n} = \\frac{1}{a^n}$ với $a$ khác $0$.","d) $a^m \\cdot a^n = a^{m+n}$ với mọi số thực $m, n$ và $a$ dương."],"answer":["F","T","T","T"],"explain":"a) Sai: chiều bất đẳng thức đảo ngược: $a^m$ nhỏ hơn $a^n$ b) Đúng: tính đơn điệu của hàm mũ với cơ số lớn hơn $1$ c) Đúng: định nghĩa lũy thừa số mũ nguyên âm d) Đúng: tính chất của lũy thừa","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phương trình $\\log_2 x + \\log_2 (x - 2) = 3$ có hai nghiệm.","b) $\\log_3 x$ lớn hơn $2$ tương đương $x$ lớn hơn $9$ (với $x$ dương).","c) Bất phương trình $\\log_2 (x - 1)$ nhỏ hơn $2$ có tập nghiệm $(1; 5)$.","d) Phương trình $9^x - 10 \\cdot 3^x + 9 = 0$ có $2$ nghiệm phân biệt."],"answer":["F","T","T","T"],"explain":"a) Sai: điều kiện $x$ lớn hơn $2$; chỉ có một nghiệm $x = 4$ b) Đúng: cơ số $3$ lớn hơn $1$ c) Đúng: $1$ nhỏ hơn $x$ nhỏ hơn $5$ d) Đúng: $t = 1, 9$","points":1},{"type":"short","level":"NB","q":"$\\log_{3} x = 3$. Nghiệm của phương trình là bao nhiêu?","answer":"$27$","explain":"$x = 3^{3} = 27$.","points":0.5},{"type":"short","level":"TH","q":"$2^{\\log_2 5}$ bằng bao nhiêu?","answer":"$5$","explain":"$a^{\\log_a b} = b$ nên $2^{\\log_2 5} = 5$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tập xác định của hàm số $y = 3^x$ là:","options":["A. $(0; +\\infty)$","B. $\\mathbb{R} \\setminus \\{0\\}$","C. $\\mathbb{R}$","D. $[0; +\\infty)$"],"answer":"C","explain":"Hàm số mũ $y = 3^x$ xác định với mọi $x \\in \\mathbb{R}$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\log_2 x$ nhỏ hơn $2$. Tập nghiệm của bất phương trình là:","options":["A. $(0; 4)$","B. $[4; +\\infty)$","C. $(4; +\\infty)$","D. $\\mathbb{R}$"],"answer":"A","explain":"$\\log_2 x$ nhỏ hơn $2$ tương đương $0$ nhỏ hơn $x$ nhỏ hơn $2^{2} = 4$.","points":0.25},{"type":"mcq","level":"TH","q":"$5^{\\log_{5} 7}$ bằng:","options":["A. $0$","B. $5$","C. $1$","D. $7$"],"answer":"D","explain":"$a^{\\log_a b} = b$ nên $5^{\\log_{5} 7} = 7$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\log_{16} 8$ bằng:","options":["A. 1,75","B. 0,75","C. 4/3","D. $1$"],"answer":"B","explain":"$\\log_{16} 8 = \\frac{\\log_2 8}{\\log_2 16} = \\frac{3}{4} = 0{,}75$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\sqrt{3^{2}}$ bằng:","options":["A. $3$","B. $6$","C. $9$","D. $4$"],"answer":"A","explain":"$\\sqrt{3^{2}} = 3^{\\frac{2}{2}} = 3^{1} = 3$.","points":0.25},{"type":"mcq","level":"VDC","q":"$\\log_{2} x$ lớn hơn $3$. Tập nghiệm của bất phương trình là:","options":["A. $(8; +\\infty)$","B. $(-\\infty; 8)$","C. $(0; 8)$","D. $\\mathbb{R}$"],"answer":"A","explain":"Điều kiện $x$ dương; cơ số $2$ lớn hơn $1$ nên $\\log_{2} x$ lớn hơn $3 = \\log_{2} 8$ tương đương $x$ lớn hơn $8$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\log_5 5 = 0$.","b) $\\log_2 8 = 4$.","c) $a^{\\log_a b} = b$ với $a$ dương, $a$ khác $1$, $b$ dương.","d) $\\ln e = 1$."],"answer":["F","F","T","T"],"explain":"a) Sai: bằng $1$ b) Sai: bằng $3$ vì $2^3 = 8$ c) Đúng: tính chất cơ bản d) Đúng: lôgarit tự nhiên của $e$","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hàm số $y = x^\\pi$ là hàm số mũ.","b) Đồ thị $y = 3^x$ đi qua điểm $(2; 9)$.","c) Phương trình $3^x = 10$ có nghiệm duy nhất.","d) Đồ thị $y = \\log_3 x$ đi qua điểm $(9; 3)$."],"answer":["F","T","T","F"],"explain":"a) Sai: đây là hàm lũy thừa (biến ở cơ số) b) Đúng: $3^2 = 9$ c) Đúng: hàm $3^x$ liên tục và đơn điệu trên $\\mathbb{R}$ d) Sai: đi qua $(9; 2)$ vì $\\log_3 9 = 2$","points":1},{"type":"short","level":"NB","q":"$(3^{1})^{2}$ bằng bao nhiêu?","answer":"$9$","explain":"$= 3^{2} = 9$.","points":0.5},{"type":"short","level":"TH","q":"$\\log_2 128 - \\log_2 4$ bằng bao nhiêu?","answer":"$5$","explain":"$= 7 - 2 = 5$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"$\\log_{5} 625$ bằng:","options":["A. $625$","B. $4$","C. $3$","D. $5$"],"answer":"B","explain":"$\\log_{5} 625 = 4$ vì $5^{4} = 625$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\log_2 4 + \\log_2 16$ bằng:","options":["A. $5$","B. $8$","C. $6$","D. $64$"],"answer":"C","explain":"$\\log_2 4 + \\log_2 16 = 2 + 4 = 6$.","points":0.25},{"type":"mcq","level":"TH","q":"$3^{x+1} = 27$. Nghiệm của phương trình là:","options":["A. $x = 2$","B. $3$","C. $0$","D. $4$"],"answer":"A","explain":"$3^{x+1} = 27 = 3^{3}$ nên $x + 1 = 3$, suy ra $x = 2$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $a = 3$ (lớn hơn $1$). So sánh $3^{2}$ và $3^{7}$:","options":["A. không so sánh được","B. $3^{2}$ nhỏ hơn $3^{7}$","C. $3^{2}$ bằng $3^{7}$","D. $3^{2}$ lớn hơn $3^{7}$"],"answer":"B","explain":"Với cơ số lớn hơn $1$, số mũ lớn hơn thì lũy thừa lớn hơn: $3^{2} = 9$ nhỏ hơn $3^{7} = 2187$.","points":0.25},{"type":"mcq","level":"VD","q":"$\\log_2 2 + \\log_2 2 - 1$ bằng:","options":["A. $2$","B. $1$","C. $0$","D. $3$"],"answer":"B","explain":"$\\log_2 2 + \\log_2 2 - 1 = 1 + 1 - 1 = 1$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tập nghiệm của bất phương trình $\\log_2 x$ nhỏ hơn $5$ là:","options":["A. $[32; +\\infty)$","B. $(32; +\\infty)$","C. $(0; 32)$","D. $\\mathbb{R}$"],"answer":"C","explain":"$\\log_2 x$ nhỏ hơn $5$ tương đương $0$ nhỏ hơn $x$ nhỏ hơn $2^{5} = 32$.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\log_a f(x) = \\log_a g(x)$ tương đương $f(x) = g(x)$.","b) Phương trình $3^x = -9$ có nghiệm.","c) Phương trình $\\log_2 x = 3$ có nghiệm $x = 8$.","d) $a^{f(x)} = b$ ($a$ dương khác $1$, $b$ dương) tương đương $f(x) = \\log_a b$."],"answer":["F","F","T","T"],"explain":"a) Sai: cần thêm điều kiện $f(x), g(x)$ dương b) Sai: $3^x$ luôn dương nên vô nghiệm c) Đúng: $2^3 = 8$ và $8$ dương d) Đúng: định nghĩa phương trình mũ cơ bản","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\sqrt[3]{\\sqrt{a}} = a^{\\frac{1}{6}}$ với $a$ dương.","b) $2^{300}$ nhỏ hơn $3^{200}$.","c) $\\left(\\frac{1}{2}\\right)^{-2} = 4$.","d) $\\left(2^{x}\\right)^3 = 2^{3x}$ với mọi $x$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $(a^{1/2})^{1/3} = a^{1/6}$ b) Đúng: $2^{300} = 8^{100}$, $3^{200} = 9^{100}$ c) Đúng: $= 2^2 = 4$ d) Đúng: tính chất lũy thừa","points":1},{"type":"short","level":"NB","q":"$3^x = 27$. Nghiệm của phương trình là bao nhiêu?","answer":"$3$","explain":"$x = 3$.","points":0.5},{"type":"short","level":"TH","q":"$32^{\\frac{3}{5}}$ bằng bao nhiêu?","answer":"$8$","explain":"$= \\sqrt[5]{32^{3}} = 8$.","points":0.5}]}]}
