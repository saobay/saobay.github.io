$.","answer":"$25$","explain":"Đây là tổng $5$ số hạng đầu của cấp số cộng có $u_1 = 1$, $d = 2$: $S_5 = \\frac{5(2+2(5-1))}{2} = 5^2 = 25$.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Cho dãy số $(u_n)$ với $u_n = 4n+8$. Số hạng $u_2$ là:","options":["A. $17$","B. $15$","C. $12$","D. $16$"],"answer":"D","explain":"$u_2 = 4\\cdot 2 + 8 = 16$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 4$, công bội $q = 3$. Số hạng $u_3$ là:","options":["A. $108$","B. $36$","C. $37$","D. $12$"],"answer":"B","explain":"$u_3 = u_1\\cdot q^2 = 4\\cdot 3^2 = 36$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 5$, $u_6 = 20$. Công sai $d$ là:","options":["A. $2$","B. $6$","C. $4$","D. $3$"],"answer":"D","explain":"$u_6 = u_1 + 5d$ nên $5d = 20 - 5 = 15$, suy ra $d = 3$.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy số $(u_n)$ với $u_n = n^2 + 3n$ ($n \\ge 1$) là dãy số:","options":["A. Bị chặn trên","B. Tăng","C. Không tăng, không giảm","D. Giảm"],"answer":"B","explain":"$u_{n+1} - u_n = 2n + 4$ dương với mọi $n \\ge 1$ nên dãy tăng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$, công sai $d = 2$. Số $22$ là số hạng thứ mấy?","options":["A. Thứ $13$","B. Thứ $11$","C. Thứ $12$","D. Thứ $10$"],"answer":"B","explain":"$2 + (n-1)\\cdot 2 = 22$ nên $(n-1)\\cdot 2 = 20$, suy ra $n = 11$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho cấp số cộng $(u_n)$ thỏa mãn $u_2 + u_4 = 28$ và $u_1 + u_3 = 20$. Số hạng $u_3$ là:","options":["A. $14$","B. $18$","C. $15$","D. $13$"],"answer":"A","explain":"$u_2+u_4 = 2u_1+4d = 28$ và $u_1+u_3 = 2u_1+2d = 20$. Trừ hai đẳng thức: $2d = 28-20 = 8$, suy ra $d = 4$. Thay vào: $2u_1 = 20-2\\cdot 4 = 12$, suy ra $u_1 = 6$. Vậy $u_3 = 6+2\\cdot 4 = 14$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$, công sai $d = 4$. Xét tính đúng, sai của các khẳng định sau:","stat u_1\\cdot q^3 = 2\\cdot 2^3 = 16$.","points":0.5},{"type":"short","level":"TH","q":"Cho dãy số $(u_n)$ với $u_n = 2n - 1$. Tính tổng $u_1 + u_2 + \\dots + u_3$.","answer":"$9$","explain":"Đây là tổng $3$ số hạng đầu của cấp số cộng có $u_1 = 1$, $d = 2$: $S_3 = \\frac{3(2+2(3-1))}{2} = 3^2 = 9$.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Cho dãy số $(u_n)$ với $u_n = 3n+8$. Số hạng $u_2$ là:","options":["A. $14$","B. $11$","C. $15$","D. $13$"],"answer":"A","explain":"$u_2 = 3\\cdot 2 + 8 = 14$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 1$, công bội $q = 3$. Số hạng $u_3$ là:","options":["A. $27$","B. $10$","C. $3$","D. $9$"],"answer":"D","explain":"$u_3 = u_1\\cdot q^2 = 1\\cdot 3^2 = 9$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$, $u_6 = 17$. Công sai $d$ là:","options":["A. $4$","B. $2$","C. $6$","D. $3$"],"answer":"D","explain":"$u_6 = u_1 + 5d$ nên $5d = 17 - 2 = 15$, suy ra $d = 3$.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy số $(u_n)$ với $u_n = n^2 + 5n + 1$ ($n \\ge 1$) là dãy số:","options":["A. Giảm","B. Không tăng, không giảm","C. Tăng","D. Bị chặn trên"],"answer":"C","explain":"$u_{n+1} - u_n = 2n + 6$ dương với mọi $n \\ge 1$ nên dãy tăng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$, công sai $d = 4$. Số $26$ là số hạng thứ mấy?","options":["A. Thứ $6$","B. Thứ $9$","C. Thứ $8$","D. Thứ $7$"],"answer":"D","explain":"$2 + (n-1)\\cdot 4 = 26$ nên $(n-1)\\cdot 4 = 24$, suy ra $n = 7$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho cấp số cộng $(u_n)$ thỏa mãn $u_2 + u_4 = 22$ và $u_1 + u_3 = 16$. Số hạng $u_3$ là:","options":["A. $12$","B. $10$","C. $11$","D. $14$"],"answer":"C","explain":"$u_2+u_4 = 2u_1+4d = 22$ và $u_1+u_3 = 2u_1+2d = 16$. Trừ hai đẳng thức: $2d = 22-16 = 6$, suy ra $d = 3$. Thay vào: $2u_1 = 16-2\\cdot 3 = 10$, suy ra $u_1 = 5$. Vậy $u_3 = 5+2\\cdot 3 = 11$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 4$, công sai $d = 2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_3 = 8$.","b) $u_n = 2n+2$.","c) $S_5 = 41$.","d) Dãy số $(u_n)$ là dãy số tăng."],"answer":["T","T","F","T"],"explain":"a) Đúng: $u_3 = 4+2\\cdot 2 = 8$. b) Đúng: $u_n = 4+(n-1)2 = 2n+2$. c) Sai: $S_5 = \\frac{5(2\\cdot 4+4\\cdot 2)}{2} = 40$. d) Đúng vì $d$ dương.","points":1},{"type":"truefalse","level":"VDC","q":"Cho dãy số $(u_n)$ với $u_n = \\frac{n}{n+1}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_1 = \\frac{1}{2}$.","b) $(u_n)$ là dãy số tăng.","c) $(u_n)$ bị chặn trên bởi $1$.","d) $u_{n+1} - u_n = \\frac{1}{(n+1)(n+2)}$ với mọi $n$."],"answer":["T","T","T","T"],"explain":"a) Đúng: thay $n=1$ được $u_1 = \\frac{1}{2}$. b) Đúng: hiệu ở câu d dương. c) Đúng: $u_n = 1-\\frac{1}{n+1}$ nhỏ hơn $1$ với mọi $n$. d) Đúng: $\\frac{n+1}{n+2}-\\frac{n}{n+1} = \\frac{1}{(n+1)(n+2)}$.","points":1},{"type":"short","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 5$, công sai $d = 2$. Tính $u_5$.","answer":"$13$","explain":"$u_5 = u_1 + 4d = 5 + 4\\cdot 2 = 13$.","points":0.5},{"type":"short","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 6$, công sai $d = 3$. Tìm $n$ biết $u_n = 21$.","answer":"$6$","explain":"$6+(n-1)\\cdot 3 = 21$ nên $n-1 = 5$, vậy $n = 6$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 1$, công sai $d = 3$. Số hạng $u_4$ là:","options":["A. $13$","B. $7$","C. $16$","D. $10$"],"answer":"D","explain":"$u_4 = u_1 + 3d = 1 + 3\\cdot 3 = 10$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các dãy số sau, dãy số nào vừa là cấp số cộng vừa là cấp số nhân?","options":["A. $u_n = 3^n$","B. $u_n = n^2$","C. Dãy số hằng $u_n = 5$","D. $u_n = 2n$"],"answer":"C","explain":"Dãy hằng $u_n = 5$ là cấp số cộng công sai $0$ và cũng là cấp số nhân công bội $1$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 3$, công bội $q = 3$. Số hạng $u_4$ là:","options":["A. $243$","B. $81$","C. $82$","D. $245$"],"answer":"B","explain":"$u_4 = 3\\cdot 3^{3} = 81$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 5$, công sai $d = 4$. Tổng $6$ số hạng đầu là:","options":["A. $94$","B. $84$","C. $30$","D. $90$"],"answer":"D","explain":"$S_6 = \\frac{6(2\\cdot 5+5\\cdot 4)}{2} = 90$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 2$, công bội $q = 2$. Tổng $4$ số hạng đầu là:","options":["A. $31$","B. $30$","C. $29$","D. $33$"],"answer":"B","explain":"$S_4 = 2\\cdot\\frac{2^4-1}{2-1} = 30$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tổng của cấp số nhân lùi vô hạn có số hạng đầu $2$ và công bội $$\\frac{1}{2}$$ là:","options":["A. $4$","B. $3$","C. $5$","D. $6$"],"answer":"A","explain":"$S = \\frac{2}{1-$\\frac{1}{2}$} = 4$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 3$, công bội $q = 3$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_4 = 81$.","b) $u_n = 3\\cdot 3^{n-1}$.","c) $S_3 = 39$.","d) $u_2^2 = u_1\\cdot u_3$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $u_4 = 3\\cdot 3^3 = 81$. b) Đúng theo công thức. c) Đúng: $S_3 = 3+9+27 = 39$. d) Đúng: tính chất ba số hạng liên tiếp của cấp số nhân.","points":1},{"type":"truefalse","level":"VDC","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 4$, công sai $d = 2$ và cấp số nhân $(v_n)$ có $v_1 = 4$, công bội $q = 2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_3 = v_2$ khi $4+2\\cdot 2 = 4\\cdot 2$.","b) $u_5 = 12$ và $v_3 = 16$.","c) Tổng $3$ số hạng đầu của $(u_n)$ là $18$.","d) $v_4$ gấp $2$ lần $v_3$."],"answer":["F","T","T","T"],"explain":"a) Sai: $u_3 = 8$ còn $v_2 = 8$, hai số này khác nhau. b) Đúng: $u_5 = 4+4\\cdot 2 = 12$; $v_3 = 4\\cdot 2^2 = 16$. c) Đúng: $S_3 = \\frac{3(2\\cdot 4+2\\cdot 2)}{2} = 18$. d) Đúng theo định nghĩa cấp số nhân.","points":1},{"type":"short","level":"NB","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 4$, công bội $q = 3$. Tính $u_4$.","answer":"$108$","explain":"$u_4 = u_1\\cdot q^3 = 4\\cdot 3^3 = 108$.","points":0.5},{"type":"short","level":"TH","q":"Cho dãy số $(u_n)$ với $u_n = 2n - 1$. Tính tổng $u_1 + u_2 + \\dots + u_2$.","answer":"$4$","explain":"Đây là tổng $2$ số hạng đầu của cấp số cộng có $u_1 = 1$, $d = 2$: $S_2 = \\frac{2(2+2(2-1))}{2} = 2^2 = 4$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Cho dãy số $(u_n)$ với $u_n = 3n+3$. Số hạng $u_2$ là:","options":["A. $9$","B. $6$","C. $8$","D. $10$"],"answer":"A","explain":"$u_2 = 3\\cdot 2 + 3 = 9$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 5$, công bội $q = 2$. Số hạng $u_3$ là:","options":["A. $21$","B. $10$","C. $20$","D. $40$"],"answer":"C","explain":"$u_3 = u_1\\cdot q^2 = 5\\cdot 2^2 = 20$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 5$, $u_6 = 25$. Công sai $d$ là:","options":["A. $5$","B. $8$","C. $3$","D. $4$"],"answer":"D","explain":"$u_6 = u_1 + 5d$ nên $5d = 25 - 5 = 20$, suy ra $d = 4$.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy số $(u_n)$ với $u_n = n^2 + 1$ ($n \\ge 1$) là dãy số:","options":["A. Giảm","B. Bị chặn trên","C. Tăng","D. Không tăng, không giảm"],"answer":"C","explain":"$u_{n+1} - u_n = 2n + 1$ dương với mọi $n \\ge 1$ nên dãy tăng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$, công sai $d = 3$. Số $29$ là số hạng thứ mấy?","options":["A. Thứ $9$","B. Thứ $11$","C. Thứ $10$","D. Thứ $12$"],"answer":"C","explain":"$2 + (n-1)\\cdot 3 = 29$ nên $(n-1)\\cdot 3 = 27$, suy ra $n = 10$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho cấp số cộng $(u_n)$ thỏa mãn $u_2 + u_4 = 20$ và $u_1 + u_3 = 14$. Số hạng $u_3$ là:","options":["A. $9$","B. $11$","C. $13$","D. $10$"],"answer":"D","explain":"$u_2+u_4 = 2u_1+4d = 20$ và $u_1+u_3 = 2u_1+2d = 14$. Trừ hai đẳng thức: $2d = 20-14 = 6$, suy ra $d = 3$. Thay vào: $2u_1 = 14-2\\cdot 3 = 8$, suy ra $u_1 = 4$. Vậy $u_3 = 4+2\\cdot 3 = 10$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 1$, công sai $d = 3$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_3 = 7$.","b) $u_n = 3n-2$.","c) $S_5 = 36$.","d) Dãy số $(u_n)$ là dãy số tăng."],"answer":["T","T","F","T"],"explain":"a) Đúng: $u_3 = 1+2\\cdot 3 = 7$. b) Đúng: $u_n = 1+(n-1)3 = 3n-2$. c) Sai: $S_5 = \\frac{5(2\\cdot 1+4\\cdot 3)}{2} = 35$. d) Đúng vì $d$ dương.","points":1},{"type":"truefalse","level":"VDC","q":"Cho dãy số $(u_n)$ với $u_n = \\frac{n+2}{n+4}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_1 = \\frac{3}{5}$.","b) $(u_n)$ là dãy số tăng.","c) $(u_n)$ bị chặn trên bởi $1$.","d) $u_{n+1} - u_n = \\frac{2}{(n+4)(n+5)}$ với mọi $n$."],"answer":["T","T","T","T"],"explain":"a) Đúng: thay $n=1$ được $u_1 = \\frac{3}{5}$. b) Đúng: hiệu ở câu d dương. c) Đúng: $u_n = 1-\\frac{2}{n+4}$ nhỏ hơn $1$ với mọi $n$. d) Đúng: $\\frac{n+3}{n+5}-\\frac{n+2}{n+4} = \\frac{2}{(n+4)(n+5)}$.","points":1},{"type":"short","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 1$, công sai $d = 5$. Tính $u_5$.","answer":"$21$","explain":"$u_5 = u_1 + 4d = 1 + 4\\cdot 5 = 21$.","points":0.5},{"type":"short","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 3$, công sai $d = 2$. Tìm $n$ biết $u_n = 15$.","answer":"$7$","explain":"$3+(n-1)\\cdot 2 = 15$ nên $n-1 = 6$, vậy $n = 7$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 3$, công sai $d = 5$. Số hạng $u_4$ là:","options":["A. $13$","B. $18$","C. $23$","D. $28$"],"answer":"B","explain":"$u_4 = u_1 + 3d = 3 + 3\\cdot 5 = 18$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các dãy số sau, dãy số nào vừa là cấp số cộng vừa là cấp số nhân?","options":["A. $u_n = n^2$","B. Dãy số hằng $u_n = 13$","C. $u_n = 3^n$","D. $u_n = 2n$"],"answer":"B","explain":"Dãy hằng $u_n = 13$ là cấp số cộng công sai $0$ và cũng là cấp số nhân công bội $1$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 1$, công bội $q = 2$. Số hạng $u_5$ là:","options":["A. $32$","B. $34$","C. $17$","D. $16$"],"answer":"D","explain":"$u_5 = 1\\cdot 2^{4} = 16$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 3$, công sai $d = 2$. Tổng $6$ số hạng đầu là:","options":["A. $18$","B. $42$","C. $48$","D. $50$"],"answer":"C","explain":"$S_6 = \\frac{6(2\\cdot 3+5\\cdot 2)}{2} = 48$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 1$, công bội $q = 2$. Tổng $4$ số hạng đầu là:","options":["A. $14$","B. $16$","C. $18$","D. $15$"],"answer":"D","explain":"$S_4 = 1\\cdot\\frac{2^4-1}{2-1} = 15$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tổng của cấp số nhân lùi vô hạn có số hạng đầu $1$ và công bội $$\\frac{1}{2}$$ là:","options":["A. $3$","B. $2$","C. $1$","D. $4$"],"answer":"B","explain":"$S = \\frac{1}{1-$\\frac{1}{2}$} = 2$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 4$, công bội $q = 2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_4 = 32$.","b) $u_n = 4\\cdot 2^{n-1}$.","c) $S_3 = 28$.","d) $u_2^2 = u_1\\cdot u_3$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $u_4 = 4\\cdot 2^3 = 32$. b) Đúng theo công thức. c) Đúng: $S_3 = 4+8+16 = 28$. d) Đúng: tính chất ba số hạng liên tiếp của cấp số nhân.","points":1},{"type":"truefalse","level":"VDC","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 3$, công sai $d = 2$ và cấp số nhân $(v_n)$ có $v_1 = 3$, công bội $q = 2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_3 = v_2$ khi $3+2\\cdot 2 = 3\\cdot 2$.","b) $u_5 = 11$ và $v_3 = 12$.","c) Tổng $3$ số hạng đầu của $(u_n)$ là $15$.","d) $v_4$ gấp $2$ lần $v_3$."],"answer":["F","T","T","T"],"explain":"a) Sai: $u_3 = 7$ còn $v_2 = 6$, hai số này khác nhau. b) Đúng: $u_5 = 3+4\\cdot 2 = 11$; $v_3 = 3\\cdot 2^2 = 12$. c) Đúng: $S_3 = \\frac{3(2\\cdot 3+2\\cdot 2)}{2} = 15$. d) Đúng theo định nghĩa cấp số nhân.","points":1},{"type":"short","level":"NB","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 3$, công bội $q = 2$. Tính $u_4$.","answer":"$24$","explain":"$u_4 = u_1\\cdot q^3 = 3\\cdot 2^3 = 24$.","points":0.5},{"type":"short","level":"TH","q":"Cho dãy số $(u_n)$ với $u_n = 2n - 1$. Tính tổng $u_1 + u_2 + \\dots + u_7$.","answer":"$49$","explain":"Đây là tổng $7$ số hạng đầu của cấp số cộng có $u_1 = 1$, $d = 2$: $S_7 = \\frac{7(2+2(7-1))}{2} = 7^2 = 49$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Cho dãy số $(u_n)$ với $u_n = 3n+5$. Số hạng $u_2$ là:","options":["A. $10$","B. $12$","C. $8$","D. $11$"],"answer":"D","explain":"$u_2 = 3\\cdot 2 + 5 = 11$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 3$, công bội $q = 3$. Số hạng $u_3$ là:","options":["A. $9$","B. $81$","C. $28$","D. $27$"],"answer":"D","explain":"$u_3 = u_1\\cdot q^2 = 3\\cdot 3^2 = 27$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 1$, $u_6 = 26$. Công sai $d$ là:","options":["A. $10$","B. $6$","C. $5$","D. $4$"],"answer":"C","explain":"$u_6 = u_1 + 5d$ nên $5d = 26 - 1 = 25$, suy ra $d = 5$.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy số $(u_n)$ với $u_n = 3n^2 - n$ ($n \\ge 1$) là dãy số:","options":["A. Không tăng, không giảm","B. Tăng","C. Bị chặn trên","D. Giảm"],"answer":"B","explain":"$u_{n+1} - u_n = 6n + 2$ dương với mọi $n \\ge 1$ nên dãy tăng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 5$, công sai $d = 3$. Số $26$ là số hạng thứ mấy?","options":["A. Thứ $10$","B. Thứ $8$","C. Thứ $9$","D. Thứ $7$"],"answer":"B","explain":"$5 + (n-1)\\cdot 3 = 26$ nên $(n-1)\\cdot 3 = 21$, suy ra $n = 8$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho cấp số cộng $(u_n)$ thỏa mãn $u_2 + u_4 = 24$ và $u_1 + u_3 = 18$. Số hạng $u_3$ là:","options":["A. $11$","B. $12$","C. $13$","D. $15$"],"answer":"B","explain":"$u_2+u_4 = 2u_1+4d = 24$ và $u_1+u_3 = 2u_1+2d = 18$. Trừ hai đẳng thức: $2d = 24-18 = 6$, suy ra $d = 3$. Thay vào: $2u_1 = 18-2\\cdot 3 = 12$, suy ra $u_1 = 6$. Vậy $u_3 = 6+2\\cdot 3 = 12$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 1$, công sai $d = 4$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_3 = 9$.","b) $u_n = 4n-3$.","c) $S_5 = 46$.","d) Dãy số $(u_n)$ là dãy số tăng."],"answer":["T","T","F","T"],"explain":"a) Đúng: $u_3 = 1+2\\cdot 4 = 9$. b) Đúng: $u_n = 1+(n-1)4 = 4n-3$. c) Sai: $S_5 = \\frac{5(2\\cdot 1+4\\cdot 4)}{2} = 45$. d) Đúng vì $d$ dương.","points":1},{"type":"truefalse","level":"VDC","q":"Cho dãy số $(u_n)$ với $u_n = \\frac{2n+1}{2n+3}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_1 = \\frac{3}{5}$.","b) $(u_n)$ là dãy số tăng.","c) $(u_n)$ bị chặn trên bởi $1$.","d) $u_{n+1} - u_n = \\frac{4}{(2n+3)(2n+5)}$ với mọi $n$."],"answer":["T","T","T","T"],"explain":"a) Đúng: thay $n=1$ được $u_1 = \\frac{3}{5}$. b) Đúng: hiệu ở câu d dương. c) Đúng: $u_n = 1-\\frac{2}{2n+3}$ nhỏ hơn $1$ với mọi $n$. d) Đúng: $\\frac{2n+3}{2n+5}-\\frac{2n+1}{2n+3} = \\frac{4}{(2n+3)(2n+5)}$.","points":1},{"type":"short","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 5$, công sai $d = 4$. Tính $u_5$.","answer":"$21$","explain":"$u_5 = u_1 + 4d = 5 + 4\\cdot 4 = 21$.","points":0.5},{"type":"short","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 6$, công sai $d = 2$. Tìm $n$ biết $u_n = 14$.","answer":"$5$","explain":"$6+(n-1)\\cdot 2 = 14$ nên $n-1 = 4$, vậy $n = 5$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$, công sai $d = 3$. Số hạng $u_4$ là:","options":["A. $11$","B. $17$","C. $8$","D. $14$"],"answer":"A","explain":"$u_4 = u_1 + 3d = 2 + 3\\cdot 3 = 11$.","points":0.25},{"type":"mcq","level":"NB
