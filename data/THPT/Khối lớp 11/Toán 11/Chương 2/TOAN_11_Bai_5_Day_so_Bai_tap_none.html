 dưới dạng phân số tối giản).","answer":"$\\frac{7}{9}$","explain":"$u_6 = \\frac{6+1}{6+3} = $\\frac{7}{9}$ = $\\frac{7}{9}$$ (rút gọn cho $1$).","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Cho dãy số $(u_n)$ với $u_n = 6n-4$. Số hạng đầu $u_1$ của dãy số là:","options":["A. $3$","B. $2$","C. $-2$","D. $10$"],"answer":"B","explain":"$u_1 = 6\\cdot 1 - 4 = 2$.","points":0.25},{"type":"mcq","level":"NB","q":"Dãy số nào sau đây là dãy số giảm?","options":["A. $u_n = n^2 + 1$","B. $u_n = (-2)^n$","C. $u_n = 10 - 2n$","D. $u_n = 2n + 3$"],"answer":"C","explain":"Với $u_n = 10 - 2n$ thì hiệu $u_{n+1} - u_n$ là hằng số âm nên dãy giảm. Các dãy $u_n = n^2 + 1$ và $u_n = 2n + 3$ là dãy tăng; $u_n = (-2)^n$ không đơn điệu.","points":0.25},{"type":"mcq","level":"TH","q":"Cho dãy số $(u_n)$ với $u_n = \\frac{n+2}{n+3}$. Số hạng $u_4$ của dãy số là:","options":["A. $\\frac{4}{5}$","B. $\\frac{6}{7}$","C. $\\frac{5}{6}$","D. $\\frac{7}{6}$"],"answer":"B","explain":"Thay $n = 4$: $u_4 = \\frac{4+2}{4+3} = $\\frac{6}{7}$$.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy số $(u_n)$ với $u_n = 2 - 3n$ là dãy số:","options":["A. Không tăng, không giảm","B. Giảm","C. Bị chặn trên bởi $0$","D. Tăng"],"answer":"B","explain":"$u_{n+1} - u_n = -3$ âm với mọi $n$ nên dãy giảm.","points":0.25},{"type":"mcq","level":"VD","q":"Cho dãy số $(u_n)$ với $u_n = 5n-3$. Số $57$ là số hạng thứ mấy của dãy số?","options":["A. Số hạng thứ $11$","B. Số hạng thứ $12$","C. Số hạng thứ $13$","D. Số hạng thứ $14$"],"answer":"B","explain":"Giải $5n - 3 = 57$ được $5n = 60$, suy ra $n = 12$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho dãy số $(u_n)$ xác định bởi $u_1 = 2$ và $u_{n+1} = u_n + 6$ với mọi $n \\ge 1$. Số hạng $u_5$ của dãy số là:","options":["A. $24$","B. $32$","C. $26$","D. $20$"],"answer":"C","explain":"Đây là dãy cộng thêm $6$ mỗi bước: $u_5 = u_1 + 4\\cdot 6 = 2 + 24 = 26$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho dãy số $(u_n)$ với $u_n = 3n-3$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_2 = 3$.","b) $(u_n)$ là dãy số giảm.","c) $u_10 = 27$.","d) $(u_n)$ bị chặn dưới bởi $0$."],"answer":["T","F","T","T"],"explain":"a) Đúng: $u_2 = 6-3 = 3$. b) Sai: $u_{n+1}-u_n = 3$ dương nên dãy tăng. c) Đúng: $u_10 = 30-3 = 27$. d) Đúng: dãy tăng nên $u_n \\ge u_1 = 0$ với mọi $n$.","points":1},{"type":"truefalse","level":"VDC","q":"Cho dãy số $(u_n)$ xác định bởi $u_1 = 1$ và $u_{n+1} = 3u_n$ với mọi $n \\ge 1$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_3 = 9$.","b) $u_n = 1\\cdot 3^{n-1}$ với mọi $n \\ge 1$.","c) $(u_n)$ là dãy số giảm.","d) $u_5 = 81$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $u_2 = 3$, $u_3 = 9$. b) Đúng: mỗi bước nhân $3$ nên $u_n = 1\\cdot 3^{n-1}$. c) Sai: dãy tăng. d) Đúng: $u_5 = 1\\cdot 3^4 = 81$.","points":1},{"type":"short","level":"NB","q":"Cho dãy số $(u_n)$ với $u_n = n^2 - n + 4$. Tính $u_4$.","answer":"$16$","explain":"$u_4 = 4^2 - 4 + 4 = 16 - 4 + 4 = 16$.","points":0.5},{"type":"short","level":"TH","q":"Cho dãy số $(u_n)$ với $u_n = 3n+5$. Tìm $n$ để $u_n = 38$.","answer":"$11$","explain":"Giải $3n + 5 = 38$ được $3n = 33$, suy ra $n = 11$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Cho dãy số $(u_n)$ với $u_n = 2n+5$. Số hạng đầu $u_1$ của dãy số là:","options":["A. $9$","B. $5$","C. $2$","D. $7$"],"answer":"D","explain":"Thay $n = 1$ vào công thức số hạng tổng quát: $u_1 = 2\\cdot 1 + 5 = 7$.","points":0.25},{"type":"mcq","level":"NB","q":"Dãy số nào sau đây là dãy số tăng?","options":["A. $u_n = (-1)^n \\cdot n$","B. $u_n = 7 - n$","C. $u_n = 3n - 2$","D. $u_n = \\frac{1}{2n+1}$"],"answer":"C","explain":"Với $u_n = 3n - 2$ thì hiệu $u_{n+1} - u_n$ là hằng số dương nên dãy tăng. Các dãy $u_n = 7 - n$ và $u_n = \\frac{1}{2n+1}$ là dãy giảm; $u_n = (-1)^n \\cdot n$ không đơn điệu.","points":0.25},{"type":"mcq","level":"TH","q":"Cho dãy số $(u_n)$ với $u_n = 2n^2 - 3n + 3$. Số hạng $u_4$ của dãy số là:","options":["A. $24$","B. $21$","C. $23$","D. $27$"],"answer":"C","explain":"Thay $n = 4$: $u_4 = 2\\cdot 4^2 - 3\\cdot 4 + 3 = 32 - 12 + 3 = 23$.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy số $(u_n)$ với $u_n = 3n+6$ là dãy số:","options":["A. Giảm","B. Không tăng, không giảm","C. Tăng","D. Vừa tăng vừa giảm"],"answer":"C","explain":"$u_{n+1} - u_n = [3(n+1)+6] - (3n+6) = 3$ dương với mọi $n$ nên dãy tăng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho dãy số $(u_n)$ với $u_n = 3n+6$. Số $48$ là số hạng thứ mấy của dãy số?","options":["A. Số hạng thứ $15$","B. Số hạng thứ $14$","C. Số hạng thứ $16$","D. Số hạng thứ $13$"],"answer":"B","explain":"Giải phương trình $u_n = 48$: $3n + 6 = 48$, suy ra $3n = 42$, vậy $n = 14$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho dãy số $(u_n)$ xác định bởi $u_1 = 5$ và $u_{n+1} = 2u_n + 3$ với mọi $n \\ge 1$. Số hạng $u_3$ của dãy số là:","options":["A. $30$","B. $13$","C. $16$","D. $29$"],"answer":"D","explain":"$u_2 = 2u_1 + 3 = 2\\cdot 5 + 3 = 13$; $u_3 = 2u_2 + 3 = 2\\cdot 13 + 3 = 29$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho dãy số $(u_n)$ với $u_n = -2n+12$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_1 = 10$.","b) $u_{n+1} - u_n = -2$ với mọi $n$.","c) $(u_n)$ là dãy số tăng.","d) $(u_n)$ bị chặn trên bởi $10$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $u_1 = -2+12 = 10$. b) Đúng: hiệu hai số hạng liên tiếp luôn bằng $-2$. c) Sai: hiệu âm nên dãy giảm. d) Đúng: dãy giảm nên mọi số hạng đều nhỏ hơn hoặc bằng $u_1 = 10$.","points":1},{"type":"truefalse","level":"VDC","q":"Cho dãy số $(u_n)$ xác định bởi $u_1 = 3$ và $u_{n+1} = u_n + 3$ với mọi $n \\ge 1$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_2 = 6$.","b) $u_4 = 12$.","c) $u_n = 3n$ với mọi $n \\ge 1$.","d) $(u_n)$ là dãy số bị chặn trên."],"answer":["T","T","T","F"],"explain":"a) Đúng: $u_2 = 3+3 = 6$. b) Đúng: $u_3 = 9$, $u_4 = 12$. c) Đúng: $u_n = 3+3(n-1) = 3n$. d) Sai: dãy tăng ra vô cùng nên không bị chặn trên.","points":1},{"type":"short","level":"NB","q":"Cho dãy số $(u_n)$ với $u_n = 3n+4$. Tính $u_3$.","answer":"$13$","explain":"$u_3 = 3\\cdot 3 + 4 = 13$.","points":0.5},{"type":"short","level":"TH","q":"Cho dãy số $(u_n)$ với $u_n = \\frac{n+1}{n+3}$. Tính $u_8$ (viết dưới dạng phân số tối giản).","answer":"$\\frac{9}{11}$","explain":"$u_8 = \\frac{8+1}{8+3} = $\\frac{9}{11}$ = $\\frac{9}{11}$$ (rút gọn cho $1$).","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cho dãy số $(u_n)$ với $u_n = 3n-5$. Số hạng đầu $u_1$ của dãy số là:","options":["A. $8$","B. $2$","C. $-1$","D. $-2$"],"answer":"D","explain":"$u_1 = 3\\cdot 1 - 5 = -2$.","points":0.25},{"type":"mcq","level":"NB","q":"Dãy số nào sau đây là dãy số giảm?","options":["A. $u_n = 7 - n$","B. $u_n = (-3)^n$","C. $u_n = 3n - 2$","D. $u_n = 3n + 2$"],"answer":"A","explain":"Với $u_n = 7 - n$ thì hiệu $u_{n+1} - u_n$ là hằng số âm nên dãy giảm. Các dãy $u_n = 3n + 2$ và $u_n = 3n - 2$ là dãy tăng; $u_n = (-3)^n$ không đơn điệu.","points":0.25},{"type":"mcq","level":"TH","q":"Cho dãy số $(u_n)$ với $u_n = \\frac{n+2}{n+3}$. Số hạng $u_5$ của dãy số là:","options":["A. $\\frac{5}{6}$","B. $\\frac{8}{7}$","C. $\\frac{6}{7}$","D. $\\frac{7}{8}$"],"answer":"D","explain":"Thay $n = 5$: $u_5 = \\frac{5+2}{5+3} = $\\frac{7}{8}$$.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy số $(u_n)$ với $u_n = 7 - 3n$ là dãy số:","options":["A. Tăng","B. Không tăng, không giảm","C. Giảm","D. Bị chặn trên bởi $0$"],"answer":"C","explain":"$u_{n+1} - u_n = -3$ âm với mọi $n$ nên dãy giảm.","points":0.25},{"type":"mcq","level":"VD","q":"Cho dãy số $(u_n)$ với $u_n = 5n-3$. Số $22$ là số hạng thứ mấy của dãy số?","options":["A. Số hạng thứ $6$","B. Số hạng thứ $5$","C. Số hạng thứ $4$","D. Số hạng thứ $7$"],"answer":"B","explain":"Giải $5n - 3 = 22$ được $5n = 25$, suy ra $n = 5$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho dãy số $(u_n)$ xác định bởi $u_1 = 2$ và $u_{n+1} = u_n + 4$ với mọi $n \\ge 1$. Số hạng $u_5$ của dãy số là:","options":["A. $16$","B. $14$","C. $18$","D. $22$"],"answer":"C","explain":"Đây là dãy cộng thêm $4$ mỗi bước: $u_5 = u_1 + 4\\cdot 4 = 2 + 16 = 18$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho dãy số $(u_n)$ với $u_n = 2n-4$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_2 = 0$.","b) $(u_n)$ là dãy số giảm.","c) $u_10 = 16$.","d) $(u_n)$ bị chặn dưới bởi $-2$."],"answer":["T","F","T","T"],"explain":"a) Đúng: $u_2 = 4-4 = 0$. b) Sai: $u_{n+1}-u_n = 2$ dương nên dãy tăng. c) Đúng: $u_10 = 20-4 = 16$. d) Đúng: dãy tăng nên $u_n \\ge u_1 = -2$ với mọi $n$.","points":1},{"type":"truefalse","level":"VDC","q":"Cho dãy số $(u_n)$ xác định bởi $u_1 = 2$ và $u_{n+1} = 2u_n$ với mọi $n \\ge 1$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_3 = 8$.","b) $u_n = 2\\cdot 2^{n-1}$ với mọi $n \\ge 1$.","c) $(u_n)$ là dãy số giảm.","d) $u_5 = 32$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $u_2 = 4$, $u_3 = 8$. b) Đúng: mỗi bước nhân $2$ nên $u_n = 2\\cdot 2^{n-1}$. c) Sai: dãy tăng. d) Đúng: $u_5 = 2\\cdot 2^4 = 32$.","points":1},{"type":"short","level":"NB","q":"Cho dãy số $(u_n)$ với $u_n = n^2 - n + 6$. Tính $u_5$.","answer":"$26$","explain":"$u_5 = 5^2 - 5 + 6 = 25 - 5 + 6 = 26$.","points":0.5},{"type":"short","level":"TH","q":"Cho dãy số $(u_n)$ với $u_n = 4n+3$. Tìm $n$ để $u_n = 31$.","answer":"$7$","explain":"Giải $4n + 3 = 31$ được $4n = 28$, suy ra $n = 7$.","points":0.5}]}]}
