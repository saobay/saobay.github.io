ứ $10$ có $48$ ghế.","d) Tổng số ghế của $10$ hàng đầu là $355$."],"answer":["T","T","T","F"],"explain":"a) Đúng theo giả thiết. b) Đúng: $21+3 = 24$. c) Đúng: $u_10 = 21+(10-1)\\cdot 3 = 48$. d) Sai: tổng đúng là $S_10 = \\frac{10(2\\cdot 21+(10-1)3)}{2} = 345$.","points":1},{"type":"short","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = -3$, công sai $d = 2$. Tính $u_4$.","answer":"$3$","explain":"$u_4 = u_1 + 3d = -3 + 3\\cdot 2 = 3$.","points":0.5},{"type":"short","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 4$, công sai $d = 3$. Tìm $n$ để $u_n = 28$.","answer":"$9$","explain":"$u_n = 4 + (n-1)\\cdot 3 = 28$ nên $(n-1)\\cdot 3 = 24$, suy ra $n - 1 = 8$, vậy $n = 9$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Dãy số nào sau đây là một cấp số cộng?","options":["A. $u_n = 5^n$","B. $u_n = n + 2^n$","C. $u_n = 5n + 2$","D. $u_n = 2n^2 + 1$"],"answer":"C","explain":"$u_n = 5n + 2$ có hiệu hai số hạng liên tiếp không đổi bằng $5$, là cấp số cộng công sai $5$. Các dãy còn lại không có hiệu hằng số.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số cộng $(u_n)$ có số hạng đầu $u_1 = 1$ và công sai $d = 4$. Số hạng $u_2$ là:","options":["A. $-3$","B. $9$","C. $1$","D. $5$"],"answer":"D","explain":"$u_2 = u_1 + d = 1 + (4) = 5$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 3$, công sai $d = 4$. Số hạng $u_10$ là:","options":["A. $39$","B. $51$","C. $43$","D. $35$"],"answer":"A","explain":"Số hạng tổng quát $u_n = u_1 + (n-1)d$. Suy ra $u_10 = 3 + (10-1)\\cdot 4 = 39$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 1$, $u_2 = 4$. Công sai $d$ của cấp số cộng là:","options":["A. $6$","B. $4$","C. $2$","D. $3$"],"answer":"D","explain":"$d = u_2 - u_1 = 4 - 1 = 3$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$, công sai $d = 3$. Tổng $8$ số hạng đầu $S_8$ là:","options":["A. $100$","B. $103$","C. $184$","D. $92$"],"answer":"A","explain":"$S_n = \\frac{n[2u_1 + (n-1)d]}{2} = \\frac{8[2\\cdot 2 + 7\\cdot 3]}{2} = 100$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho cấp số cộng $(u_n)$ có $u_3 = 15$ và công sai $d = 4$. Số hạng $u_7$ là:","options":["A. $31$","B. $35$","C. $27$","D. $23$"],"answer":"A","explain":"$u_7 = u_3 + 4d = 15 + 4\\cdot 4 = 31$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$, công sai $d = 3$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_2 = 5$.","b) $u_4 = 11$.","c) Số hạng tổng quát $u_n = 3n-1$.","d) Tổng $4$ số hạng đầu $S_4 = 28$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $u_2 = 2+3 = 5$. b) Đúng: $u_4 = 2+3\\cdot 3 = 11$. c) Đúng: $u_n = 2+(n-1)3 = 3n-1$. d) Sai: $S_4 = \\frac{4(2\\cdot 2+3\\cdot 3)}{2} = 26$.","points":1},{"type":"truefalse","level":"VDC","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$, công sai $d = 2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_6 = 12$.","b) Tổng $n = 6$ số hạng đầu $S_6 = 42$.","c) $14$ là số hạng thứ $6$ của dãy.","d) Tổng $6$ số hạng đầu chia hết cho $6$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $u_6 = 2+(6-1)\\cdot 2 = 12$. b) Đúng: $S_6 = \\frac{6(2\\cdot 2+(6-1)2)}{2} = 42$. c) Sai: $u_6 = 12$ chứ không phải $14$. d) Đúng: $S_6 = 6\\cdot 7$ chia hết cho $6$.","points":1},{"type":"short","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 6$, công sai $d = 2$. Tính $u_3$.","answer":"$10$","explain":"$u_3 = u_1 + 2d = 6 + 2\\cdot 2 = 10$.","points":0.5},{"type":"short","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 4$, công sai $d = 4$. Tính tổng $5$ số hạng đầu $S_5$.","answer":"$60$","explain":"$S_5 = \\frac{5[2\\cdot 4 + 4\\cdot 4]}{2} = 60$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Dãy số nào sau đây KHÔNG phải là cấp số cộng?","options":["A. $u_n = 2n - 5$","B. $u_n = 10 - 3n$","C. $u_n = n^2$","D. $u_n = 7$"],"answer":"C","explain":"$u_n = 10 - 3n$ và $u_n = 2n - 5$ là cấp số cộng; $u_n = 7$ là cấp số cộng công sai $0$. $u_n = n^2$ có hiệu $u_{n+1}-u_n$ thay đổi theo $n$ nên không phải cấp số cộng.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 1$, công sai $d = 2$. Số hạng $u_3$ là:","options":["A. $1$","B. $3$","C. $5$","D. $7$"],"answer":"C","explain":"$u_3 = u_1 + 2d = 1 + 2\\cdot 2 = 5$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 6$, công sai $d = -4$. Số hạng $u_{10}$ là:","options":["A. $-22$","B. $-30$","C. $-34$","D. $-26$"],"answer":"B","explain":"$u_{10} = u_1 + 9d = 6 + 9\\cdot (-4) = -30$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 4$, $u_5 = 16$. Công sai $d$ của cấp số cộng là:","options":["A. $2$","B. $6$","C. $3$","D. $4$"],"answer":"C","explain":"$u_5 = u_1 + 4d$ nên $4d = 16 - 4 = 12$, suy ra $d = 3$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 5$, công sai $d = -3$. Tổng $10$ số hạng đầu $S_{10}$ là:","options":["A. $50$","B. $-80$","C. $-85$","D. $-95$"],"answer":"C","explain":"$u_{10} = 5 + 9\\cdot (-3) = -22$; $S_{10} = \\frac{10(u_1+u_{10})}{2} = 5\\cdot (5+-22) = -85$.","points":0.25},{"type":"mcq","level":"VDC","q":"Ba số $10$, $x$, $14$ theo thứ tự lập thành một cấp số cộng. Giá trị của $x$ là:","options":["A. $13$","B. $11$","C. $12$","D. $14$"],"answer":"C","explain":"Số ở giữa là trung bình cộng của hai số hai bên: $x = \\frac{10+14}{2} = 12$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 6$, $u_5 = 26$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công sai $d = 5$.","b) $u_3 = 16$.","c) $u_{10} = 51$.","d) $(u_n)$ là dãy số giảm."],"answer":["T","T","T","F"],"explain":"a) Đúng: $4d = 26-6 = 20$ nên $d = 5$. b) Đúng: $u_3 = 6+2\\cdot 5 = 16$. c) Đúng: $u_{10} = 6+9\\cdot 5 = 51$. d) Sai: $d$ dương nên dãy tăng.","points":1},{"type":"truefalse","level":"VDC","q":"Một rạp hát xếp ghế sao cho hàng thứ nhất có $22$ ghế, mỗi hàng sau hơn hàng trước $2$ ghế. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số ghế các hàng lập thành cấp số cộng công sai $2$.","b) Hàng thứ $2$ có $24$ ghế.","c) Hàng thứ $12$ có $44$ ghế.","d) Tổng số ghế của $12$ hàng đầu là $406$."],"answer":["T","T","T","F"],"explain":"a) Đúng theo giả thiết. b) Đúng: $22+2 = 24$. c) Đúng: $u_12 = 22+(12-1)\\cdot 2 = 44$. d) Sai: tổng đúng là $S_12 = \\frac{12(2\\cdot 22+(12-1)2)}{2} = 396$.","points":1},{"type":"short","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = -2$, công sai $d = 2$. Tính $u_4$.","answer":"$4$","explain":"$u_4 = u_1 + 3d = -2 + 3\\cdot 2 = 4$.","points":0.5},{"type":"short","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 3$, công sai $d = 5$. Tìm $n$ để $u_n = 38$.","answer":"$8$","explain":"$u_n = 3 + (n-1)\\cdot 5 = 38$ nên $(n-1)\\cdot 5 = 35$, suy ra $n - 1 = 7$, vậy $n = 8$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Dãy số nào sau đây là một cấp số cộng?","options":["A. $u_n = n + 2^n$","B. $u_n = 2n - 3$","C. $u_n = n^2 - 2n$","D. $u_n = 5^n$"],"answer":"B","explain":"$u_n = 2n - 3$ có hiệu hai số hạng liên tiếp không đổi bằng $2$, là cấp số cộng công sai $2$. Các dãy còn lại không có hiệu hằng số.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số cộng $(u_n)$ có số hạng đầu $u_1 = 9$ và công sai $d = 5$. Số hạng $u_2$ là:","options":["A. $9$","B. $4$","C. $14$","D. $19$"],"answer":"C","explain":"$u_2 = u_1 + d = 9 + (5) = 14$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 5$, công sai $d = 2$. Số hạng $u_8$ là:","options":["A. $21$","B. $25$","C. $19$","D. $17$"],"answer":"C","explain":"Số hạng tổng quát $u_n = u_1 + (n-1)d$. Suy ra $u_8 = 5 + (8-1)\\cdot 2 = 19$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 1$, $u_2 = 3$. Công sai $d$ của cấp số cộng là:","options":["A. $2$","B. $3$","C. $4$","D. $1$"],"answer":"A","explain":"$d = u_2 - u_1 = 3 - 1 = 2$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 6$, công sai $d = 3$. Tổng $8$ số hạng đầu $S_8$ là:","options":["A. $132$","B. $124$","C. $135$","D. $216$"],"answer":"A","explain":"$S_n = \\frac{n[2u_1 + (n-1)d]}{2} = \\frac{8[2\\cdot 6 + 7\\cdot 3]}{2} = 132$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho cấp số cộng $(u_n)$ có $u_3 = 8$ và công sai $d = 3$. Số hạng $u_7$ là:","options":["A. $23$","B. $17$","C. $14$","D. $20$"],"answer":"D","explain":"$u_7 = u_3 + 4d = 8 + 4\\cdot 3 = 20$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$, công sai $d = 4$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_2 = 6$.","b) $u_4 = 14$.","c) Số hạng tổng quát $u_n = 4n-2$.","d) Tổng $4$ số hạng đầu $S_4 = 34$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $u_2 = 2+4 = 6$. b) Đúng: $u_4 = 2+3\\cdot 4 = 14$. c) Đúng: $u_n = 2+(n-1)4 = 4n-2$. d) Sai: $S_4 = \\frac{4(2\\cdot 2+3\\cdot 4)}{2} = 32$.","points":1},{"type":"truefalse","level":"VDC","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 2$, công sai $d = 2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_7 = 14$.","b) Tổng $n = 7$ số hạng đầu $S_7 = 56$.","c) $16$ là số hạng thứ $7$ của dãy.","d) Tổng $7$ số hạng đầu chia hết cho $7$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $u_7 = 2+(7-1)\\cdot 2 = 14$. b) Đúng: $S_7 = \\frac{7(2\\cdot 2+(7-1)2)}{2} = 56$. c) Sai: $u_7 = 14$ chứ không phải $16$. d) Đúng: $S_7 = 7\\cdot 8$ chia hết cho $7$.","points":1},{"type":"short","level":"NB","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 7$, công sai $d = 6$. Tính $u_3$.","answer":"$19$","explain":"$u_3 = u_1 + 2d = 7 + 2\\cdot 6 = 19$.","points":0.5},{"type":"short","level":"TH","q":"Cho cấp số cộng $(u_n)$ có $u_1 = 3$, công sai $d = 4$. Tính tổng $5$ số hạng đầu $S_5$.","answer":"$55$","explain":"$S_5 = \\frac{5[2\\cdot 3 + 4\\cdot 4]}{2} = 55$.","points":0.5}]},{"name":"Đề 10","questi
