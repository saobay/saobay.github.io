{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Dãy số nào sau đây là một cấp số nhân?","options":["A. $u_n = n^2 + 1$","B. $u_n = 3^n - 1$","C. $u_n = 3n + 2$","D. $u_n = 5\\cdot 2^n$"],"answer":"D","explain":"$u_n = 5\\cdot 2^n$ có tỉ số hai số hạng liên tiếp không đổi, là cấp số nhân. Các dãy còn lại không có tỉ số hằng số.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số nhân $(u_n)$ có số hạng đầu $u_1 = 1$ và công bội $q = 2$. Số hạng $u_2$ là:","options":["A. $4$","B. $2$","C. $1$","D. $3$"],"answer":"B","explain":"$u_2 = u_1 \\cdot q = 1 \\cdot (2) = 2$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 2$, công bội $q = 2$. Số hạng $u_4$ là:","options":["A. $33$","B. $32$","C. $8$","D. $16$"],"answer":"D","explain":"Số hạng tổng quát $u_n = u_1 \\cdot q^{n-1}$. Suy ra $u_4 = 2 \\cdot 2^{3} = 16$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 3$, $u_3 = 12$. Công bội $q$ của cấp số nhân là:","options":["A. $3$","B. $2$","C. $1$","D. $-2$"],"answer":"B","explain":"$u_3 = u_1 \\cdot q^{2}$ nên $q^{2} = \\frac{12}{3} = 4$, suy ra $q = 2$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 4$, công bội $q = 3$. Tổng $4$ số hạng đầu $S_4$ là:","options":["A. $161$","B. $159$","C. $163$","D. $160$"],"answer":"D","explain":"$S_n = u_1\\cdot\\frac{q^n-1}{q-1} = 4\\cdot\\frac{3^{4}-1}{3-1} = 160$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tổng của cấp số nhân lùi vô hạn $(u_n)$ có số hạng đầu $u_1 = 6$ và công bội $q = $\\frac{1}{2}$$ là:","options":["A. $12$","B. $14$","C. $11$","D. $13$"],"answer":"A","explain":"Vì $|q| = $\\frac{1}{2}$$ nhỏ hơn $1$ nên tổng $S = \\frac{u_1}{1-q} = \\frac{6}{1-$\\frac{1}{2}$} = \\frac{6}{$\\frac{1}{2}$} = 12$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 4$, công bội $q = 2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_2 = 8$.","b) $u_3 = 16$.","c) Số hạng tổng quát $u_n = 4\\cdot 2^{n-1}$.","d) Tổng $3$ số hạng đầu $S_3 = 29$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $u_2 = 4\\cdot 2 = 8$. b) Đúng: $u_3 = 4\\cdot 2^2 = 16$. c) Đúng theo công thức. d) Sai: $S_3 = 4+8+16 = 28$.","points":1},{"type":"truefalse","level":"VDC","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 3$, công bội $q = 2$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $u_3 = 12$.","b) Tổng $3$ số hạng đầu $S_3 = 21$.","c) $u_{n+1} = 2\\cdot u_n$ với mọi $n$.","d) Tổng $3$ số hạng đầu chia hết cho $u_1$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $u_3 = 3\\cdot 2^{2} = 12$. b) Đúng: $S_3 = 3\\cdot\\frac{2^{3}-1}{2-1} = 21$. c) Đúng theo định nghĩa cấp số nhân. d) Đúng: $S_3 = 3\\cdot 7$ chia hết cho $u_1 = 3$.","points":1},{"type":"short","level":"NB","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 6$, công bội $q = 3$. Tính $u_3$.","answer":"$54$","explain":"$u_3 = u_1 \\cdot q^2 = 6 \\cdot 3^2 = 54$.","points":0.5},{"type":"short","level":"TH","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 3$, công bội $q = 2$. Tính tổng $4$ số hạng đầu $S_4$.","answer":"$45$","explain":"$S_4 = 3\\cdot\\frac{2^4-1}{2-1} = 45$.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Dãy số nào sau đây KHÔNG phải là cấp số nhân?","options":["A. $u_n = \\left(\\frac{1}{2}\\right)^n$","B. $u_n = 3\\cdot 2^n$","C. $u_n = 3$","D. $u_n = 2n + 1$"],"answer":"D","explain":"$u_n = 3\\cdot 2^n$ là cấp số nhân; $u_n = 3$ là cấp số nhân công bội $1$; $u_n = \\left(\\frac{1}{2}\\right)^n$ là cấp số nhân. $u_n = 2n + 1$ là cấp số cộng, không phải cấp số nhân.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 8$, công bội $q = 2$. Số hạng $u_3$ là:","options":["A. $31$","B. $33$","C. $16$","D. $32$"],"answer":"D","explain":"$u_3 = u_1 \\cdot q^2 = 8 \\cdot 2^2 = 32$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 4$, công bội $q = 2$. Số hạng $u_4$ là:","options":["A. $32$","B. $64$","C. $16$","D. $-30$"],"answer":"A","explain":"$u_4 = u_1 \\cdot q^3 = 4 \\cdot (2)^3 = 32$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số nhân $(u_n)$ có các số hạng dương, $u_1 = 5$, $u_3 = 20$. Công bội $q$ là:","options":["A. $3$","B. $-2$","C. $2$","D. $4$"],"answer":"C","explain":"$u_3 = u_1 \\cdot q^2$ nên $q^2 = \\frac{20}{5} = 4$. Vì các số hạng dương nên $q$ dương, vậy $q = 2$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 4$, công bội $q = 2$. Tổng $3$ số hạng đầu $S_3$ là:","options":["A. $28$","B. $12$","C. $24$","D. $30$"],"answer":"A","explain":"$S_3 = u_1 + u_2 + u_3 = 4 + 8 + 16 = 28$.","points":0.25},{"type":"mcq","level":"VDC","q":"Ba số $16$, $x$, $16$ theo thứ tự lập thành một cấp số nhân có các số hạng dương. Giá trị của $x$ là:","options":["A. $18$","B. $17$","C. $15$","D. $16$"],"answer":"D","explain":"Số ở giữa là trung bình nhân của hai số hai bên: $x^2 = 16\\cdot 16 = 256$. Vì các số hạng dương nên $x = 16$.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 2$, $u_4 = 54$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công bội $q = 3$.","b) $u_2 = 6$.","c) $u_5 = 162$.","d) $(u_n)$ là dãy số giảm."],"answer":["T","T","T","F"],"explain":"a) Đúng: $q^3 = \\frac{54}{2} = 27$ nên $q = 3$. b) Đúng: $u_2 = 6$. c) Đúng: $u_5 = 54\\cdot 3 = 162$. d) Sai: $q$ dương lớn hơn $1$ nên dãy tăng.","points":1},{"type":"truefalse","level":"VDC","q":"Số lượng vi khuẩn trong một mẫu thử tăng gấp đôi sau mỗi giờ. Lúc đầu có $306$ con. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số vi khuẩn sau mỗi giờ lập thành cấp số nhân công bội $2$.","b) Sau $1$ giờ có $612$ con vi khuẩn.","c) Sau $4$ giờ có $4896$ con vi khuẩn.","d) Sau $4$ giờ, số vi khuẩn gấp $17$ lần lúc đầu."],"answer":["T","T","T","F"],"explain":"a) Đúng theo giả thiết. b) Đúng: $306\\cdot 2 = 612$. c) Đúng: $306\\cdot 2^{4} = 4896$. d) Sai: gấp $2^{4} = 16$ lần.","points":1},{"type":"short","level":"NB","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 7$, công bội $q = 2$. Tính $u_2$.","answer":"$14$","explain":"$u_2 = u_1 \\cdot q = 7 \\cdot (2) = 14$.","points":0.5},{"type":"short","level":"TH","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 3$, công bội $q = 3$. Tìm $n$ để $u_n = 729$.","answer":"$6$","explain":"$u_n = 3\\cdot 3^{n-1} = 729$ nên $3^{n-1} = 243$, suy ra $n - 1 = 5$, vậy $n = 6$.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Dãy số nào sau đây là một cấp số nhân?","options":["A. $u_n = n^2 + 1$","B. $u_n = 3\\cdot 2^n$","C. $u_n = 4n - 3$","D. $u_n = 3^n - 1$"],"answer":"B","explain":"$u_n = 3\\cdot 2^n$ có tỉ số hai số hạng liên tiếp không đổi, là cấp số nhân. Các dãy còn lại không có tỉ số hằng số.","points":0.25},{"type":"mcq","level":"NB","q":"Cho cấp số nhân $(u_n)$ có số hạng đầu $u_1 = 3$ và công bội $q = 2$. Số hạng $u_2$ là:","options":["A. $12$","B. $3$","C. $5$","D. $6$"],"answer":"D","explain":"$u_2 = u_1 \\cdot q = 3 \\cdot (2) = 6$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 4$, công bội $q = 3$. Số hạng $u_5$ là:","options":["A. $108$","B. $972$","C. $973$","D. $324$"],"answer":"D","explain":"Số hạng tổng quát $u_n = u_1 \\cdot q^{n-1}$. Suy ra $u_5 = 4 \\cdot 3^{4} = 324$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 4$, $u_3 = 16$. Công bội $q$ của cấp số nhân là:","options":["A. $-2$","B. $1$","C. $3$","D. $2$"],"answer":"D","explain":"$u_3 = u_1 \\cdot q^{2}$ nên $q^{2} = \\frac{16}{4} = 4$, suy ra $q = 2$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho cấp số nhân $(u_n)$ có $u_1 = 4$, công bội $q = 2$. Tổng $3$ số hạng đầu $S_3$ là:","options":["A. $29$","B. $28$","C. $31$","D. $27$"],"answer":"B","explain":"$S_n = u_1\\cdot\\frac{q^n-1}{q-1} = 4\\cdot\\frac{2^{3}-1}{2-1} = 28$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tổng của cấp số nhân lùi vô hạn $(u_n)$ có số hạng đầu $u_1 = 2$ và c
