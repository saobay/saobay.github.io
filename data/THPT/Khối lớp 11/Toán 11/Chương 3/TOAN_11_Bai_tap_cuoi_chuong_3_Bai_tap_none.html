ên là $20$.","b) Khoảng tứ phân vị $\\Delta_Q$ luôn nhỏ hơn hoặc bằng khoảng biến thiên.","c) Nhóm chứa $Q_1$ là $[155;160)$.","d) Nhóm chứa $Q_3$ là $[160;165)$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $R = 170 - 150 = 20$. b) Đúng: $Q_1, Q_3$ đều nằm trong $[min; max]$ nên $\\Delta_Q \\le R$. c), d) Đúng theo vị trí các tứ phân vị.","points":1},{"type":"short","level":"NB","q":"Khảo sát nhiệt độ trung bình ngày của 30 ngày, thu được bảng tần số ghép nhóm sau (đơn vị: độ C): $[20;22)$: 6, $[22;24)$: 10, $[24;26)$: 8, $[26;28)$: 6. Cỡ mẫu của mẫu số liệu là bao nhiêu?","answer":"$30$","explain":"Cỡ mẫu $= $ tổng các tần số $= 30$.","points":0.5},{"type":"short","level":"TH","q":"Khảo sát cân nặng của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: kg): $[40;45)$: 5, $[45;50)$: 10, $[50;55)$: 8, $[55;60)$: 7. Tính số trung bình của mẫu số liệu.","answer":"151/3","explain":"$\\overline{x} = \\frac{\\sum n_ic_i}{n} = \\frac{151}{3}$.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Tần số tích lũy của nhóm đầu tiên trong bảng tần số ghép nhóm bằng:","options":["A. $0$","B. Cỡ mẫu","C. Tần số của chính nhóm đó","D. $100\\%$"],"answer":"C","explain":"Tần số tích lũy của nhóm đầu tiên chính là tần số của nhóm đó.","points":0.25},{"type":"mcq","level":"NB","q":"Số trung bình của mẫu số liệu ghép nhóm là:","options":["A. Trung bình có trọng số theo tần số của các giá trị đại diện","B. Giá trị ở chính giữa bảng","C. Giá trị xuất hiện nhiều nhất","D. Trung bình cộng đơn thuần của các giá trị đại diện"],"answer":"A","explain":"$\\overline{x} = \\frac{\\sum n_ic_i}{n}$ là trung bình có trọng số theo tần số.","points":0.25},{"type":"mcq","level":"TH","q":"Khảo sát doanh thu ngày của 30 cửa hàng, thu được bảng tần số ghép nhóm sau (đơn vị: triệu đồng): $[5;10)$: 4, $[10;15)$: 9, $[15;20)$: 11, $[20;25)$: 6. Nhóm chứa trung vị là:","options":["A. $[15;20)$","B. Không xác định","C. $[5;10)$","D. $[20;25)$"],"answer":"A","explain":"Vị trí trung vị $n/2 = 15$; nhóm đầu tiên có tần số tích lũy đạt vị trí này là $[15;20)$.","points":0.25},{"type":"mcq","level":"TH","q":"Khảo sát doanh thu ngày của 30 cửa hàng, thu được bảng tần số ghép nhóm sau (đơn vị: triệu đồng): $[5;10)$: 4, $[10;15)$: 9, $[15;20)$: 11, $[20;25)$: 6. Nhóm chứa tứ phân vị thứ nhất $Q_1$ là:","options":["A. $[20;25)$","B. Không xác định","C. $[5;10)$","D. $[10;15)$"],"answer":"D","explain":"$Q_1$ ứng với vị trí $n/4 = 7{,}5$, thuộc nhóm $[10;15)$.","points":0.25},{"type":"mcq","level":"VD","q":"Khảo sát chiều cao của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: cm): $[150;155)$: 4, $[155;160)$: 8, $[160;165)$: 12, $[165;170)$: 6. Khoảng tứ phân vị $\\Delta_Q = Q_3 - Q_1$ cho biết điều gì?","options":["A. Mức độ phân tán của một nửa số liệu chính giữa","B. Giá trị trung bình của mẫu số liệu","C. Số phần tử của mẫu số liệu","D. Giá trị lớn nhất trừ giá trị nhỏ nhất"],"answer":"A","explain":"Khoảng tứ phân vị $\\Delta_Q = Q_3 - Q_1$ đo mức độ phân tán của $50\\%$ số liệu chính giữa (không bị ảnh hưởng bởi các giá trị quá lớn/quá nhỏ).","points":0.25},{"type":"mcq","level":"VDC","q":"Hai mẫu số liệu ghép nhóm có khoảng biến thiên lần lượt là $8$ và $4$. Mẫu nào phân tán hơn (theo khoảng biến thiên)?","options":["A. Hai mẫu phân tán như nhau","B. Mẫu thứ nhất","C. Không kết luận được","D. Mẫu thứ hai"],"answer":"B","explain":"Khoảng biến thiên càng lớn thì số liệu càng phân tán. Vì $8$ lớn hơn $4$ nên mẫu thứ nhất phân tán hơn.","points":0.25},{"type":"truefalse","level":"VD","q":"Khảo sát thành tích chạy 100m của 25 vận động viên, thu được bảng tần số ghép nhóm sau (đơn vị: giây): $[10;11)$: 3, $[11;12)$: 7, $[12;13)$: 9, $[13;14)$: 6. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhóm chứa mốt là $[12;13)$.","b) Mốt của mẫu số liệu là $12{,}4$.","c) Mốt luôn thuộc nhóm đầu tiên.","d) Cỡ mẫu $25$ bằng tổng các tần số."],"answer":["T","T","F","T"],"explain":"a) Đúng: tần số $9$ lớn nhất. b) Đúng: $M_o = 12{,}4$. c) Sai: mốt thuộc nhóm có tần số lớn nhất, chưa chắc là nhóm đầu. d) Đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Khảo sát cân nặng của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: kg): $[40;45)$: 5, $[45;50)$: 10, $[50;55)$: 8, $[55;60)$: 7. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu cộng thêm $5$ vào mỗi số liệu thì số trung bình mới là $\\frac{166}{3}$.","b) Nếu nhân mỗi số liệu với $2$ thì trung vị mới gấp đôi trung vị cũ.","c) Số trung bình luôn nằm trong khoảng biến thiên của mẫu số liệu.","d) Trung vị luôn bằng số trung bình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $\\overline{x}$ mới $= \\frac{151}{3} + 5 = \\frac{166}{3}$. b) Đúng theo tính chất. c) Đúng: trung bình luôn nằm giữa giá trị nhỏ nhất và lớn nhất. d) Sai: chỉ đúng khi phân phối đối xứng.","points":1},{"type":"short","level":"NB","q":"Giá trị đại diện của nhóm $[0;20)$ là bao nhiêu?","answer":"$10$","explain":"Giá trị đại diện $= (0+20)/2 = 10$.","points":0.5},{"type":"short","level":"TH","q":"Khảo sát doanh thu ngày của 30 cửa hàng, thu được bảng tần số ghép nhóm sau (đơn vị: triệu đồng): $[5;10)$: 4, $[10;15)$: 9, $[15;20)$: 11, $[20;25)$: 6. Tính trung vị của mẫu số liệu.","answer":"175/11","explain":"Nhóm chứa trung vị là $[15;20)$; áp dụng công thức được $M_e = \\frac{175}{11}$.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Khảo sát chiều cao của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: cm): $[150;155)$: 4, $[155;160)$: 8, $[160;165)$: 12, $[165;170)$: 6. Cỡ mẫu của mẫu số liệu là:","options":["A. $32$","B. $60$","C. $30$","D. $29$"],"answer":"C","explain":"Cỡ mẫu bằng tổng các tần số: $30$.","points":0.25},{"type":"mcq","level":"NB","q":"Khảo sát nhiệt độ trung bình ngày của 30 ngày, thu được bảng tần số ghép nhóm sau (đơn vị: độ C): $[20;22)$: 6, $[22;24)$: 10, $[24;26)$: 8, $[26;28)$: 6. Tần số tích lũy đến hết nhóm $[20;22)$ là:","options":["A. $6$","B. $11$","C. $8$","D. $5$"],"ans  nhóm đầu"],"answer":"D","explain":"$R = $ (đầu mút phải nhóm cuối) $-$ (đầu mút trái nhóm đầu).","points":0.25},{"type":"mcq","level":"NB","q":"Trong công thức tính trung vị $M_e = a_m + \\frac{n/2-C_{m-1}}{n_m}\\cdot h$, $n_m$ là:","options":["A. Cỡ mẫu","B. Tần số của nhóm chứa trung vị","C. Độ dài nhóm","D. Tần số tích lũy"],"answer":"B","explain":"$n_m$ là tần số của nhóm chứa trung vị, $h$ là độ dài nhóm đó.","points":0.25},{"type":"mcq","level":"TH","q":"Khảo sát điểm kiểm tra của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: điểm): $[0;2)$: 2, $[2;4)$: 5, $[4;6)$: 10, $[6;8)$: 8, $[8;10)$: 5. Nhóm chứa trung vị là:","options":["A. $[4;6)$","B. Không xác định","C. $[0;2)$","D. $[8;10)$"],"answer":"A","explain":"Vị trí trung vị $n/2 = 15$; nhóm đầu tiên có tần số tích lũy đạt vị trí này là $[4;6)$.","points":0.25},{"type":"mcq","level":"TH","q":"Khảo sát chiều cao của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: cm): $[150;155)$: 4, $[155;160)$: 8, $[160;165)$: 12, $[165;170)$: 6. Nhóm chứa tứ phân vị thứ nhất $Q_1$ là:","options":["A. $[150;155)$","B. Không xác định","C. $[165;170)$","D. $[155;160)$"],"answer":"D","explain":"$Q_1$ ứng với vị trí $n/4 = 7{,}5$, thuộc nhóm $[155;160)$.","points":0.25},{"type":"mcq","level":"VD","q":"Khảo sát cân nặng của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: kg): $[40;45)$: 5, $[45;50)$: 10, $[50;55)$: 8, $[55;60)$: 7. Khoảng tứ phân vị $\\Delta_Q = Q_3 - Q_1$ cho biết điều gì?","options":["A. Giá trị trung bình của mẫu số liệu","B. Số phần tử của mẫu số liệu","C. Giá trị lớn nhất trừ giá trị nhỏ nhất","D. Mức độ phân tán của một nửa số liệu chính giữa"],"answer":"D","explain":"Khoảng tứ phân vị $\\Delta_Q = Q_3 - Q_1$ đo mức độ phân tán của $50\\%$ số liệu chính giữa (không bị ảnh hưởng bởi các giá trị quá lớn/quá nhỏ).","points":0.25},{"type":"mcq","level":"VDC","q":"Hai mẫu số liệu ghép nhóm có khoảng biến thiên lần lượt là $20$ và $20$. Mẫu nào phân tán hơn (theo khoảng biến thiên)?","options":["A. Không kết luận được","B. Hai mẫu phân tán như nhau","C. Mẫu thứ hai","D. Mẫu thứ nhất"],"answer":"C","explain":"Khoảng biến thiên càng lớn thì số liệu càng phân tán. Vì $20$ lớn hơn $20$ nên mẫu thứ hai phân tán hơn.","points":0.25},{"type":"truefalse","level":"VD","q":"Khảo sát cân nặng của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: kg): $[40;45)$: 5, $[45;50)$: 10, $[50;55)$: 8, $[55;60)$: 7. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhóm chứa mốt là $[45;50)$.","b) Mốt của mẫu số liệu là $\\frac{340}{7}$.","c) Mốt luôn thuộc nhóm đầu tiên.","d) Cỡ mẫu $30$ bằng tổng các tần số."],"answer":["T","T","F","T"],"explain":"a) Đúng: tần số $10$ lớn nhất. b) Đúng: $M_o = \\frac{340}{7}$. c) Sai: mốt thuộc nhóm có tần số lớn nhất, chưa chắc là nhóm đầu. d) Đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Khảo sát nhiệt độ trung bình ngày của 30 ngày, thu được bảng tần số ghép nhóm sau (đơn vị: độ C): $[20;22)$: 6, $[22;24)$: 10, $[24;26)$: 8, $[26;28)$: 6. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu cộng thêm $5$ vào mỗi số liệu thì số trung bình mới là $\\frac{434}{15}$.","b) Nếu nhân mỗi số liệu với $2$ thì trung vị mới gấp đôi trung vị cũ.","c) Số trung bình luôn nằm trong khoảng biến thiên của mẫu số liệu.","d) Trung vị luôn bằng số trung bình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $\\overline{x}$ mới $= \\frac{359}{15} + 5 = \\frac{434}{15}$. b) Đúng theo tính chất. c) Đúng: trung bình luôn nằm giữa giá trị nhỏ nhất và lớn nhất. d) Sai: chỉ đúng khi phân phối đối xứng.","points":1},{"type":"short","level":"NB","q":"Giá trị đại diện của nhóm $[10;30)$ là bao nhiêu?","answer":"$20$","explain":"Giá trị đại diện $= (10+30)/2 = 20$.","points":0.5},{"type":"short","level":"TH","q":"Khảo sát chiều cao của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: cm): $[150;155)$: 4, $[155;160)$: 8, $[160;165)$: 12, $[165;170)$: 6. Tính trung vị của mẫu số liệu.","answer":"161,25","ex khoảng biến thiên.","c) Nhóm chứa $Q_1$ là $[22;24)$.","d) Nhóm chứa $Q_3$ là $[24;26)$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $R = 28 - 20 = 8$. b) Đúng: $Q_1, Q_3$ đều nằm trong $[min; max]$ nên $\\Delta_Q \\le R$. c), d) Đúng theo vị trí các tứ phân vị.","points":1},{"type":"short","level":"NB","q":"Khảo sát cân nặng của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: kg): $[40;45)$: 5, $[45;50)$: 10, $[50;55)$: 8, $[55;60)$: 7. Cỡ mẫu của mẫu số liệu là bao nhiêu?","answer":"$30$","explain":"Cỡ mẫu $= $ tổng các tần số $= 30$.","points":0.5},{"type":"short","level":"TH","q":"Khảo sát điểm kiểm tra của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: điểm): $[0;2)$: 2, $[2;4)$: 5, $[4;6)$: 10, $[6;8)$: 8, $[8;10)$: 5. Tính số trung bình của mẫu số liệu.","answer":"5,6","explain":"$\\overline{x} = \\frac{\\sum n_ic_i}{n} = 5{,}6$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tần số tương đối của một nhóm trong bảng tần số ghép nhóm được tính bằng:","options":["A. Cỡ mẫu chia cho tần số của nhóm","B. Tần số của nhóm cộng cỡ mẫu","C. Tần số của nhóm nhân với cỡ mẫu","D. Tần số của nhóm chia cho cỡ mẫu"],"answer":"D","explain":"Tần số tương đối $=$ tần số của nhóm $/$ cỡ mẫu (thường tính theo phần trăm).","points":0.25},{"type":"mcq","level":"NB","q":"Tứ phân vị thứ hai $Q_2$ của mẫu số liệu chính là:","options":["A. Giá trị lớn nhất","B. Số trung bình","C. Trung vị","D. Mốt"],"answer":"C","explain":"$Q_2$ ứng với vị trí $n/2$, chính là trung vị.","points":0.25},{"type":"mcq","level":"TH","q":"Khảo sát chiều cao của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: cm): $[150;155)$: 4, $[155;160)$: 8, $[160;165)$: 12, $[165;170)$: 6. Nhóm chứa trung vị là:","options":["A. $[150;155)$","B. Không xác định","C. $[165;170)$","D. $[160;165)$"],"answer":"D","explain":"Vị trí trung vị $n/2 = 15$; nhóm đầu tiên có tần số tích lũy đạt vị trí này là $[160;165)$.","points":0.25},{"type":"mcq","level":"TH","q":" alse","level":"VDC","q":"Khảo sát điểm kiểm tra của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: điểm): $[0;2)$: 2, $[2;4)$: 5, $[4;6)$: 10, $[6;8)$: 8, $[8;10)$: 5. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu cộng thêm $5$ vào mỗi số liệu thì số trung bình mới là $10{,}6$.","b) Nếu nhân mỗi số liệu với $2$ thì trung vị mới gấp đôi trung vị cũ.","c) Số trung bình luôn nằm trong khoảng biến thiên của mẫu số liệu.","d) Trung vị luôn bằng số trung bình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $\\overline{x}$ mới $= 5{,}6 + 5 = 10{,}6$. b) Đúng theo tính chất. c) Đúng: trung bình luôn nằm giữa giá trị nhỏ nhất và lớn nhất. d) Sai: chỉ đúng khi phân phối đối xứng.","points":1},{"type":"short","level":"NB","q":"Giá trị đại diện của nhóm $[10;15)$ là bao nhiêu?","answer":"12,5","explain":"Giá trị đại diện $= (10+15)/2 = 12{,}5$.","points":0.5},{"type":"short","level":"TH","q":"Khảo sát điểm kiểm tra của 30 học sinh, thu được bảng tần số ghép nhóm sau (đơn vị: điểm): $[0;2)$: 2, $[2;4)$: 5, $[4;6)$: 10, $[6;8)$: 8, $[8;10)$: 5. Tính trung vị của mẫu số liệu.","answer":"5,6","explain":"Nhóm chứa trung vị là $[4;6)$; áp dụng công thức được $M_e = 5{,}6$.","points":0.5}]}]}
