25},{"type":"mcq","level":"TH","q":"Điểm chung của các nước sáng lập ECSC và ASEAN là gì?","options":["A. Đều từng trải qua chiến tranh, có nhu cầu hòa bình và phát triển","B. Đều là cường quốc","C. Đều có cùng ngôn ngữ","D. Đều giàu có"],"answer":"A","explain":"Cả hai nhóm nước đều chịu hậu quả chiến tranh, khát khao hòa bình và phát triển.","points":0.25},{"type":"mcq","level":"TH","q":"Nước nào vừa là thành viên sáng lập ECSC vừa thuộc EU hiện nay?","options":["A. Pháp","B. Anh","C. Ba Lan","D. Hy Lạp"],"answer":"A","explain":"Pháp là nước sáng lập ECSC (1951) và vẫn là thành viên trụ cột của EU.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) ECSC có 6 nước sáng lập.","b) ASEAN có 5 nước sáng lập.","c) Năm 1967 quan trọng với cả hai tổ chức.","d) Anh là nước sáng lập ECSC."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: Anh gia nhập Cộng đồng châu Âu năm 1973, không phải nước sáng lập.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Cả hai tổ chức đều khởi đầu với số thành viên ít rồi mở rộng.","b) Hòa bình là khát vọng chung của các nước sáng lập.","c) Mọi nước sáng lập đều có trình độ phát triển ngang nhau.","d) Sự ra đời của hai tổ chức đều gắn với bối cảnh Chiến tranh lạnh."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: ngay trong nhóm sáng lập đã có chênh lệch phát triển.","points":1},{"type":"short","level":"VD","q":"Kể tên một nước sáng lập ECSC (1951).","answer":"Pháp","explain":"Các nước sáng lập ECSC: Pháp, Tây Đức, I-ta-li-a, Bỉ, Hà Lan, Lúc-xăm-bua.","points":0.5},{"type":"short","level":"VDC","q":"Kể tên một nước sáng lập ASEAN (1967).","answer":"Thái Lan","explain":"Các nước sáng lập ASEAN: In-đô-nê-xi-a, Ma-lai-xi-a, Phi-líp-pin, Xin-ga-po, Thái Lan.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Thách thức chung của EU và ASEAN hiện nay là gì?","options":["A. Chênh lệch phát triển và bất đồng nội bộ","B. Thiếu dân số","C. Không có thách thức","D. Thiếu tài nguyên"],"answer":"A","explain":"Cả hai tổ chức đều đối mặt thách thức chênh lệch phát triển giữa thành viên và bất đồng nội bộ.","points":0.25},{"type":"mcq","level":"NB","q":"Vấn đề nào là thách thức riêng nổi bật của ASEAN?","options":["A. Vấn đề Biển Đông","B. Brexit","C. Khủng hoảng nợ công châu Âu","D. Vấn đề di cư châu Phi"],"answer":"A","explain":"Vấn đề Biển Đông là thách thức riêng, thử thách đoàn kết ASEAN.","points":0.25},{"type":"mcq","level":"NB","q":"Sự kiện nào là thách thức riêng nổi bật của EU?","options":["A. Brexit","B. Vấn đề Biển Đông","C. Xung đột sắc tộc","D. Thiên tai"],"answer":"A","explain":"Brexit (Anh rời EU 2020) là thách thức riêng lớn của EU.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cạnh tranh cường quốc là thách thức với cả EU và ASEAN?","options":["A. Vì cả hai đều cần giữ tự chủ, vai trò trung tâm trước sức ép bên ngoài","B. Vì cả hai muốn gây chiến","C. Vì cả hai yếu kém","D. Không phải thách thức"],"answer":"A","explain":"Trước cạnh tranh cường quốc, cả EU và ASEAN đều phải giữ tự chủ, đoàn kết và vai trò của mình.","points":0.25},{"type":"mcq","level":"TH","q":"Bài học chung từ thách thức của hai tổ chức là gì?","options":["A. Cần tăng cường đoàn kết, cải cách để thích ứng","B. Nên giải thể","C. Nên đóng cửa","D. Nên phụ thuộc cường quốc"],"answer":"A","explain":"Để vượt qua thách thức, các tổ chức liên kết cần tăng đoàn kết nội khối và cải cách thích ứng.","points":0.25},{"type":"mcq","level":"TH","q":"Hạn chế của nguyên tắc đồng thuận ASEAN thể hiện ở điểm nào?","options":["A. Đôi khi phản ứng chậm trước vấn đề nóng","B. Làm ASEAN tan rã","C. Gây chiến tranh","D. Không có hạn chế"],"answer":"A","explain":"Đồng thuận bảo vệ lợi ích các nước nhưng đôi khi khiến ASEAN phản ứng chậm.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Chênh lệch phát triển là thách thức chung của hai tổ chức.","b) Brexit là thách thức riêng của EU.","c) Biển Đông là thách thức riêng của ASEAN.","d) Hai tổ chức không còn thách thức nào."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cả hai vẫn đối mặt nhiều thách thức.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Thách thức là động lực để các tổ chức cải cách.","b) Đoàn kết nội khối là chìa khóa vượt qua thách thức.","c) Mọi thách thức đều đến từ bên ngoài.","d) Thích ứng với biến động là yêu cầu sống còn."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: thách thức còn đến từ nội tại tổ chức.","points":1},{"type":"short","level":"VD","q":"Nêu một thách thức chung của EU và ASEAN.","answer":"Chênh lệch trình độ phát triển","explain":"Chênh lệch trình độ phát triển giữa các thành viên là thách thức chung.","points":0.5},{"type":"short","level":"VDC","q":"Chìa khóa để các tổ chức liên kết vượt qua thách thức nội bộ là gì?","answer":"Đoàn kết","explain":"Tăng cường đoàn kết nội khối là chìa khóa vượt qua thách thức.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"EVFTA là hiệp định giữa Việt Nam và đối tác nào?","options":["A. Liên minh châu Âu","B. ASEAN","C. Mỹ","D. Trung Quốc"],"answer":"A","explain":"EVFTA là Hiệp định thương mại tự do giữa Việt Nam và EU, có hiệu lực 2020.","points":0.25},{"type":"mcq","level":"NB","q":"Việt Nam làm Chủ tịch ASEAN gần đây nhất năm nào?","options":["A. 2020","B. 2010","C. 1998","D. 2015"],"answer":"A","explain":"Việt Nam làm Chủ tịch ASEAN năm 2020.","points":0.25},{"type":"mcq","level":"NB","q":"Quốc kì EU có bao nhiêu ngôi sao vàng?","options":["A. 12","B. 27","C. 10","D. 28"],"answer":"A","explain":"Quốc kì EU có 12 ngôi sao vàng trên nền xanh.","points":0.25},{"type":"mcq","level":"TH","q":"Ý nghĩa của EVFTA đối với Việt Nam là gì?","options":["A. Mở rộng thị trường xuất khẩu, thu hút đầu tư từ EU","B. Đóng cửa thị trường","C. Cấm xuất khẩu","D. Giảm quan hệ"],"answer":"A","explain":"EVFTA mở rộng thị trường xuất khẩu và thu hút đầu tư từ EU vào Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Trong năm Chủ tịch ASEAN 2020, Việt Nam nổi bật với đóng góp nào?","options":["A. Dẫn dắt ASEAN ứng phó đại dịch COVID-19","B. Tổ chức chiến tranh","C. Rút khỏi ASEAN","D. Không có đóng góp"],"answer":"A","explain":"Năm 2020, Việt Nam dẫn dắt ASEAN ứng phó COVID-19, được quốc tế đánh giá cao.","points":0.25},{"type":"mcq","level":"TH","q":"Logo ASEAN có đặc điểm nào?","options":["A. Bó 10 bông lúa vàng trên nền đỏ - xanh","B. 12 ngôi sao vàng","C. Hình chim bồ câu","D. Hình ngôi nhà"],"answer":"A","explain":"Logo ASEAN: bó 10 bông lúa vàng tượng trưng 10 nước thành viên đoàn kết.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) EVFTA có hiệu lực từ 2020.","b) Việt Nam làm Chủ tịch ASEAN năm 2020.","c) Quốc kì EU có 12 ngôi sao.","d) Logo ASEAN có 10 bông lúa."],"answer":["T","T","T","T"],"explain":"Cả 4 nhận định đều đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Quan hệ Việt Nam - EU phát triển toàn diện.","b) Việt Nam góp phần nâng cao vị thế ASEAN.","c) Hội nhập khu vực giúp Việt Nam phát triển.","d) Việt Nam chỉ nhận mà không đóng góp cho ASEAN."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: Việt Nam đóng góp tích cực, có trách nhiệm.","points":1},{"type":"short","level":"VD","q":"Viết tắt của Hiệp định thương mại tự do Việt Nam - EU là gì?","answer":"EVFTA","explain":"EVFTA có hiệu lực từ 1/8/2020.","points":0.5},{"type":"short","level":"VDC","q":"Trên quốc kì EU có bao nhiêu ngôi sao vàng?","answer":"12","explain":"Quốc kì EU có 12 ngôi sao vàng xếp thành vòng tròn.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Sắp xếp đúng trình tự phát triển của liên kết châu Âu: (1) ECSC; (2) EEC; (3) EC; (4) EU.","options":["A. (1) - (2) - (3) - (4)","B. (4) - (3) - (2) - (1)","C. (2) - (1) - (4) - (3)","D. (1) - (3) - (2) - (4)"],"answer":"A","explain":"Trình tự: ECSC (1951) - EEC (1957) - EC (1967) - EU (1993).","points":0.25},{"type":"mcq","level":"NB","q":"Sắp xếp đúng trình tự phát triển ASEAN: (1) Tuyên bố Băng-cốc; (2) Việt Nam gia nhập; (3) Hiến chương; (4) Cộng đồng ASEAN.","options":["A. (1) - (2) - (3) - (4)","B. (4) - (3) - (2) - (1)","C. (1) - (3) - (2) - (4)","D. (2) - (1) - (3) - (4)"],"answer":"A","explain":"Trình tự: 1967 - 1995 - 2008 - 2015.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức nào ra đời trước?","options":["A. Tiền thân của EU (ECSC, 1951)","B. ASEAN (1967)","C. Cộng đồng ASEAN (2015)","D. EU (1993)"],"answer":"A","explain":"ECSC (1951) ra đời trước ASEAN (1967).","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung trong quá trình phát triển của EU và ASEAN là gì?","options":["A. Từ ít thành viên mở rộng dần, từ hợp tác thấp đến cao","B. Từ nhiều thành viên giảm dần","C. Không thay đổi","D. Từ cao xuống thấp"],"answer":"A","explain":"Cả hai đều mở rộng thành viên và nâng dần mức độ liên kết.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói liên kết khu vực là xu thế tất yếu?","options":["A. Vì toàn cầu hóa đòi hỏi các nước hợp tác để phát triển","B. Vì chiến tranh","C. Vì ép buộc","D. Vì ngẫu nhiên"],"answer":"A","explain":"Toàn cầu hóa và cách mạng khoa học - kĩ thuật đòi hỏi các nước liên kết, hợp tác để phát triển.","points":0.25},{"type":"mcq","level":"TH","q":"Bài học cho Việt Nam từ hai mô hình liên kết là gì?","options":["A. Chủ động hội nhập, chọn mô hình phù hợp điều kiện đất nước","B. Sao chép y nguyên mô hình EU","C. Đóng cửa","D. Không hội nhập"],"answer":"A","explain":"Việt Nam cần chủ động hội nhập, vận dụng bài học phù hợp với điều kiện đất nước.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) ECSC ra đời trước ASEAN.","b) Cả hai tổ chức đều mở rộng dần.","c) Liên kết khu vực là xu thế tất yếu.","d) Việt Nam nên sao chép y nguyên mô hình EU."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cần chọn mô hình phù hợp điều kiện riêng.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Lịch sử liên kết khu vực là lịch sử từ thấp đến cao.","b) Mỗi bước tiến đều gắn với bối cảnh cụ thể.","c) Không có mô hình chung tuyệt đối cho mọi khu vực.","d) Hòa bình là mục tiêu xuyên suốt của liên kết khu vực."],"answer":["T","T","T","T"],"explain":"Cả 4 nhận định đều đúng, tổng kết chương 2.","points":1},{"type":"short","level":"VD","q":"Tổ chức nào trong hai tổ chức (EU, ASEAN) có tiền thân ra đời sớm hơn?","answer":"EU","explain":"Tiền thân của EU là ECSC (1951), ra đời trước ASEAN (1967).","points":0.5},{"type":"short","level":"VDC","q":"Xu thế chung của thế giới sau Chiến tranh thế giới thứ hai về quan hệ giữa các nước trong khu vực là gì?","answer":"Liên kết khu vực","explain":"Liên kết khu vực là xu thế tất yếu sau 1945.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Chương 2 của sách Lịch sử 11 nghiên cứu về vấn đề gì?","options":["A. Sự hình thành và phát triển của các liên minh khu vực ở châu Âu và châu Á","B. Cách mạng tư sản","C. Chiến tranh thế giới","D. Chủ nghĩa xã hội"],"answer":"A","explain":"Chương 2 nghiên cứu sự hình thành và phát triển của các liên minh khu vực ở châu Âu (EU) và châu Á (ASEAN).","points":0.25},{"type":"mcq","level":"NB","q":"Hai tổ chức tiêu biểu của chương 2 là gì?","options":["A. EU và ASEAN","B. NATO và SEATO","C. Liên hợp quốc và G7","D. APEC và AU"],"answer":"A","explain":"Hai tổ chức tiêu biểu: Liên minh châu Âu (EU) và ASEAN.","points":0.25},{"type":"mcq","level":"NB","q":"Việt Nam là thành viên của tổ chức nào trong chương 2?","options":["A. ASEAN","B. EU","C. NATO","D. Cả EU và ASEAN"],"answer":"A","explain":"Việt Nam là thành viên ASEAN từ 1995.","points":0.25},{"type":"mcq","level":"TH","q":"Ý nghĩa lớn nhất của liên minh khu vực đối với hòa bình thế giới là gì?","options":["A. Góp phần giữ hòa bình, ngăn ngừa xung đột giữa các nước","B. Gây chiến tranh","C. Chia rẽ thế giới","D. Không có ý nghĩa"],"answer":"A","explain":"Liên minh khu vực góp phần giữ hòa bình, ngăn ngừa xung đột, thúc đẩy hợp tác.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao học sinh Việt Nam cần hiểu biết về EU và ASEAN?","options":["A. Vì Việt Nam hội nhập sâu rộng, cần hiểu đối tác và khu vực","B. Vì thi cử","C. Vì bắt buộc","D. Không cần thiết"],"answer":"A","explain":"Việt Nam hội nhập sâu rộng; hiểu EU (đối tác lớn) và ASEAN (mái nhà chung) là cần thiết.","points":0.25},{"type":"mcq","level":"TH","q":"Nhận định nào đúng nhất về chương 2?","options":["A. Phản ánh xu thế liên kết khu vực tất yếu của thế giới hiện đại","B. Chỉ nói về chiến tranh","C. Chỉ nói về một nước","D. Không có giá trị thực tiễn"],"answer":"A","explain":"Chương 2 phản ánh xu thế liên kết khu vực tất yếu của thế giới hiện đại.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Chương 2 nghiên cứu EU và ASEAN.","b) Việt Nam là thành viên ASEAN.","c) Liên minh khu vực góp phần giữ hòa bình.","d) EU và ASEAN đều là liên minh quân sự."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: EU và ASEAN là tổ chức hợp tác, không phải liên minh quân sự.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Hiểu biết về liên kết khu vực giúp hội nhập tốt hơn.","b) Mỗi tổ chức có mô hình phù hợp riêng.","c) Hòa bình, hợp tác là mục tiêu chung.","d) Liên kết khu vực mâu thuẫn với độc lập dân tộc."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: liên kết trên cơ sở tôn trọng độc lập, chủ quyền.","points":1},{"type":"short","level":"VD","q":"Kể tên hai tổ chức liên minh khu vực tiêu biểu được học trong chương 2.","answer":"EU và ASEAN","explain":"Hai tổ chức tiêu biểu: Liên minh châu Âu (EU) và ASEAN.","points":0.5},{"type":"short","level":"VDC","q":"Mục tiêu chung cao nhất của các tổ chức liên minh khu vực là gì?","answer":"Hòa bình","explain":"Hòa bình, hợp tác và phát triển là mục tiêu chung của liên minh khu vực.","points":0.5}]}]}
