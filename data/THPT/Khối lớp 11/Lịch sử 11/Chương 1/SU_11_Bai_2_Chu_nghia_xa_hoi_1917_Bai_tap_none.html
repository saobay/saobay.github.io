<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Cách mạng tháng Mười Nga năm 1917 do tổ chức nào lãnh đạo?","options":["A. Đảng Men-sê-vích","B. Đảng Bôn-sê-vích","C. Đảng Xã hội cách mạng","D. Đảng Lập hiến dân chủ"],"answer":"B","explain":"Cách mạng tháng Mười Nga do Đảng Bôn-sê-vích do Lê-nin đứng đầu lãnh đạo.","points":0.25},{"type":"mcq","level":"NB","q":"Lãnh tụ của Cách mạng tháng Mười Nga năm 1917 là ai?","options":["A. Các Mác","B. Ăng-ghen","C. Lê-nin","D. Xta-lin"],"answer":"C","explain":"Lê-nin là lãnh tụ của Đảng Bôn-sê-vích, người đề ra đường lối và trực tiếp lãnh đạo Cách mạng tháng Mười Nga.","points":0.25},{"type":"mcq","level":"NB","q":"Khởi nghĩa vũ trang trong Cách mạng tháng Mười Nga bùng nổ ở đâu?","options":["A. Mát-xcơ-va","B. Pê-tơ-rô-grát","C. Ki-ép","D. Vôn-ga-grát"],"answer":"B","explain":"Đêm 24 rạng 25/10/1917, khởi nghĩa vũ trang bùng nổ ở Pê-tơ-rô-grát (Pê-téc-bua), thủ đô nước Nga lúc bấy giờ.","points":0.25},{"type":"mcq","level":"TH","q":"Trước Cách mạng tháng Mười, nước Nga tồn tại tình trạng chính trị đặc biệt nào?","options":["A. Hai chính quyền song song tồn tại","B. Nga hoàng khôi phục quyền lực tuyệt đối","C. Đảng Bôn-sê-vích đã nắm chính quyền","D. Nước Nga bị chia cắt thành nhiều quốc gia"],"answer":"A","explain":"Sau cách mạng tháng Hai, nước Nga tồn tại tình trạng hai chính quyền song song: Chính phủ lâm thời tư sản và các Xô viết đại biểu công - nông - binh.","points":0.25},{"type":"mcq","level":"TH","q":"Văn kiện nào của Lê-nin đã chỉ ra nhiệm vụ chuyển từ cách mạng dân chủ tư sản sang cách mạng xã hội chủ nghĩa ở Nga?","options":["A. Tuyên ngôn của Đảng Cộng sản","B. Luận cương tháng Tư","C. Sắc lệnh hòa bình","D. Sắc lệnh ruộng đất"],"answer":"B","explain":"Tháng 4/1917, Lê-nin trình bày Luận cương tháng Tư, chỉ rõ cần chuyển từ cách mạng dân chủ tư sản sang cách mạng xã hội chủ nghĩa.","points":0.25},{"type":"mcq","level":"TH","q":"Mục tiêu trực tiếp của khởi nghĩa vũ trang tháng Mười ở Pê-tơ-rô-grát là gì?","options":["A. Lật đổ chế độ Nga hoàng","B. Lật đổ Chính phủ lâm thời tư sản","C. Đánh bại quân can thiệp 14 nước","D. Thống nhất các Xô viết toàn Nga"],"answer":"B","explain":"Chế độ Nga hoàng đã bị lật đổ từ tháng 2/1917. Khởi nghĩa tháng Mười nhằm lật đổ Chính phủ lâm thời tư sản, giành chính quyền về tay các Xô viết.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Cách mạng tháng Mười Nga là cuộc cách mạng xã hội chủ nghĩa đầu tiên thắng lợi.","b) Khởi nghĩa tháng Mười nổ ra đêm 24 rạng 25/10/1917 theo lịch Nga cũ.","c) Sào huyệt cuối cùng của Chính phủ lâm thời là Cung điện Mùa Đông.","d) Cách mạng tháng Mười lật đổ chế độ quân chủ chuyên chế Nga hoàng."],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo diễn biến. d sai: Nga hoàng đã bị lật đổ trong cách mạng tháng Hai 1917; tháng Mười lật đổ Chính phủ lâm thời tư sản.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Đại hội Xô viết toàn Nga lần thứ II họp ngay trong đêm khởi nghĩa thắng lợi.","b) Hai sắc lệnh đầu tiên của chính quyền Xô viết là Sắc lệnh hòa bình và Sắc lệnh ruộng đất.","c) Sắc lệnh ruộng đất giao ruộng đất của địa chủ cho nông dân.","d) Cách mạng tháng Mười chỉ có ý nghĩa đối với nước Nga, không ảnh hưởng đến thế giới."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cách mạng có ý nghĩa quốc tế to lớn, cổ vũ phong trào cách mạng thế giới và phong trào giải phóng dân tộc.","points":1},{"type":"short","level":"VD","q":"Ngày tháng năm nào (theo lịch mới) khởi nghĩa vũ trang ở Pê-tơ-rô-grát thắng lợi, mở đầu Cách mạng tháng Mười Nga?","answer":"7/11/1917","explain":"Đêm 24 rạng 25/10/1917 theo lịch Nga cũ tương ứng ngày 7/11/1917 theo lịch mới (dương lịch).","points":0.5},{"type":"short","level":"VDC","q":"Tên gọi của bản luận cương do Lê-nin trình bày tháng 4/1917, vạch ra đường lối chuyển sang cách mạng xã hội chủ nghĩa là gì?","answer":"Luận cương tháng Tư","explain":"Luận cương tháng Tư (4/1917) của Lê-nin chỉ rõ nhiệm vụ chuyển từ cách mạng dân chủ tư sản sang cách mạng xã hội chủ nghĩa.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Sau Cách mạng tháng Mười, nước Nga Xô viết phải đối mặt với khó khăn nào trong những năm 1918 - 1920?","options":["A. Nội chiến và can thiệp vũ trang của 14 nước đế quốc","B. Khủng hoảng kinh tế thừa","C. Chiến tranh với phát xít Đức","D. Sự chia rẽ trong Đảng Bôn-sê-vích"],"answer":"A","explain":"Những năm 1918 - 1920, nước Nga Xô viết phải tiến hành cuộc nội chiến chống thù trong và chống sự can thiệp vũ trang của 14 nước đế quốc.","points":0.25},{"type":"mcq","level":"NB","q":"Để đối phó với nội chiến và can thiệp vũ trang, chính quyền Xô viết đã thi hành chính sách nào?","options":["A. Chính sách kinh tế mới","B. Chính sách cộng sản thời chiến","C. Kế hoạch 5 năm lần thứ nhất","D. Chính sách trung lập"],"answer":"B","explain":"Chính quyền Xô viết thi hành Chính sách cộng sản thời chiến nhằm tập trung mọi nguồn lực bảo vệ thành quả cách mạng.","points":0.25},{"type":"mcq","level":"NB","q":"Lực lượng vũ trang của chính quyền Xô viết trong thời kì nội chiến có tên gọi là gì?","options":["A. Hồng quân","B. Bạch vệ","C. Quân đồng minh","D. Quân tình nguyện"],"answer":"A","explain":"Hồng quân là lực lượng vũ trang của chính quyền Xô viết, đã giành thắng lợi trong cuộc nội chiến 1918 - 1920.","points":0.25},{"type":"mcq","level":"TH","q":"Kết quả của cuộc nội chiến ở Nga (1918 - 1920) là gì?","options":["A. Chính quyền Xô viết bị lật đổ","B. Nước Nga bị chia cắt","C. Hồng quân thắng lợi, bảo vệ vững chắc chính quyền Xô viết","D. Các nước đế quốc thiết lập chính quyền mới ở Nga"],"answer":"C","explain":"Đến cuối năm 1920, Hồng quân giành thắng lợi, đánh bại thù trong giặc ngoài, bảo vệ vững chắc chính quyền Xô viết.","points":0.25},{"type":"mcq","level":"VDC","q":"Ý nghĩa quan trọng nhất của thắng lợi trong cuộc nội chiến (1918 - 1920) đối với nước Nga là gì?","options":["A. Đưa nước Nga trở thành cường quốc kinh tế","B. Bảo vệ vững chắc thành quả của Cách mạng tháng Mười","C. Mở rộng lãnh thổ nước Nga","D. Thiết lập quan hệ ngoại giao với Mỹ"],"answer":"B","explain":"Thắng lợi của Hồng quân đã bảo vệ vững chắc thành quả của Cách mạng tháng Mười, giữ vững chính quyền Xô viết non trẻ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các nước đế quốc tiến hành can thiệp vũ trang vào nước Nga Xô viết?","options":["A. Để giúp Nga phát triển kinh tế","B. Để bóp chết nhà nước xã hội chủ nghĩa đầu tiên","C. Để tranh giành thuộc địa ở châu Á","D. Để ủng hộ Chính phủ lâm thời tư sản"],"answer":"B","explain":"Các nước đế quốc lo sợ sự lan tỏa của cách mạng xã hội chủ nghĩa nên cấu kết can thiệp vũ trang nhằm bóp chết nhà nước Xô viết non trẻ.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Nội chiến ở Nga diễn ra trong những năm 1918 - 1920.","b) Có 14 nước đế quốc can thiệp vũ trang vào nước Nga Xô viết.","c) Chính sách cộng sản thời chiến nhằm tập trung nguồn lực bảo vệ cách mạng.","d) Hồng quân đã thất bại trong cuộc nội chiến."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: Hồng quân giành thắng lợi, bảo vệ vững chắc chính quyền Xô viết.","points":1},{"type":"truefalse","level":"TH","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Sau năm 1920, chính quyền Xô viết đã hoàn toàn vững chắc, không còn khó khăn nào.","b) Cuộc nội chiến gây tổn thất nặng nề cho kinh tế nước Nga.","c) Thắng lợi của Hồng quân cổ vũ phong trào cách mạng thế giới.","d) Các nước đế quốc can thiệp vì muốn bảo vệ hòa bình thế giới."],"answer":["F","T","T","F"],"explain":"a sai: sau nội chiến, kinh tế Nga kiệt quệ, cần chính sách mới (NEP). b, c đúng. d sai: chúng can thiệp để bóp chết chính quyền Xô viết.","points":1},{"type":"short","level":"VD","q":"Có bao nhiêu nước đế quốc đã can thiệp vũ trang vào nước Nga Xô viết trong những năm 1918 - 1920?","answer":"14","explain":"14 nước đế quốc đã cấu kết can thiệp vũ trang vào nước Nga Xô viết.","points":0.5},{"type":"short","level":"VDC","q":"Tên gọi chính sách kinh tế đặc biệt mà chính quyền Xô viết thi hành trong thời kì nội chiến 1918 - 1920 là gì?","answer":"Chính sách cộng sản thời chiến","explain":"Chính sách cộng sản thời chiến được thi hành để tập trung mọi nguồn lực cho cuộc kháng chiến bảo vệ chính quyền Xô viết.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Chính sách kinh tế mới (NEP) ở nước Nga được thực hiện từ năm nào?","options":["A. 1917","B. 1918","C. 1921","D. 1922"],"answer":"C","explain":"Năm 1921, theo đề nghị của Lê-nin, nước Nga chuyển từ Chính sách cộng sản thời chiến sang Chính sách kinh tế mới (NEP).","points":0.25},{"type":"mcq","level":"TH","q":"Ai là người đề xướng thực hiện Chính sách kinh tế mới (NEP) ở nước Nga?","options":["A. Xta-lin","B. Lê-nin","C. Tơ-rốt-xki","D. Goóc-ba-chốp"],"answer":"B","explain":"Lê-nin là người đề xướng và chỉ đạo thực hiện Chính sách kinh tế mới (NEP) từ năm 1921.","points":0.25},{"type":"mcq","level":"NB","q":"Liên bang Cộng hòa xã hội chủ nghĩa Xô viết được thành lập vào thời gian nào?","options":["A. 7/11/1917","B. 30/12/1922","C. 21/1/1924","D. 9/5/1945"],"answer":"B","explain":"Ngày 30/12/1922, Liên bang Cộng hòa xã hội chủ nghĩa Xô viết (Liên Xô) chính thức thành lập.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây thuộc Chính sách kinh tế mới (NEP)?","options":["A. Trưng thu lương thực thừa của nông dân","B. Thay trưng thu lương thực bằng thuế lương thực","C. Quốc hữu hóa mọi xí nghiệp","D. Cấm hoàn toàn buôn bán tư nhân"],"answer":"B","explain":"NEP thay chế độ trưng thu lương thực bằng thuế lương thực, cho phép tư nhân buôn bán nhỏ, khuyến khích sản xuất hàng hóa.","points":0.25},{"type":"mcq","level":"VDC","q":"Tác dụng quan trọng nhất của Chính sách kinh tế mới (NEP) là gì?","options":["A. Đưa Liên Xô thành cường quốc công nghiệp","B. Giúp kinh tế phục hồi, củng cố liên minh công - nông","C. Xóa bỏ hoàn toàn thành phần kinh tế tư nhân","D. Thắng lợi trong Chiến tranh thế giới thứ hai"],"answer":"B","explain":"NEP giúp kinh tế Nga phục hồi nhanh chóng sau nội chiến, củng cố liên minh công nhân - nông dân, củng cố chính quyền Xô viết.","points":0.25},{"type":"mcq","level":"TH","q":"Liên Xô là nhà nước như thế nào trong lịch sử thế giới?","options":["A. Nhà nước tư bản đầu tiên","B. Nhà nước xã hội chủ nghĩa đầu tiên trên thế giới","C. Nhà nước phong kiến cuối cùng","D. Nhà nước liên bang đầu tiên"],"answer":"B","explain":"Liên Xô là nhà nước xã hội chủ nghĩa đầu tiên trên thế giới, ra đời ngày 30/12/1922.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) NEP cho phép tư nhân được buôn bán nhỏ.","b) NEP khuyến khích phát triển sản xuất hàng hóa.","c) NEP được thực hiện trong hoàn cảnh đất nước đã hoàn toàn hòa bình, kinh tế phát triển.","d) NEP góp phần củng cố khối liên minh công - nông."],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo nội dung và tác dụng của NEP. c sai: NEP ra đời khi kinh tế Nga kiệt quệ sau nội chiến.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Liên Xô lúc mới thành lập gồm 4 nước cộng hòa.","b) NEP là sự vận dụng sáng tạo của Lê-nin trong thời kì quá độ lên chủ nghĩa xã hội.","c) NEP xóa bỏ hoàn toàn các thành phần kinh tế phi xã hội chủ nghĩa.","d) Sự ra đời của Liên Xô đánh dấu chủ nghĩa xã hội từ lí luận trở thành hiện thực ở quy mô nhà nước liên bang."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: NEP vẫn cho phép tồn tại một số thành phần kinh tế tư nhân nhỏ, kinh tế tư bản nhà nước.","points":1},{"type":"short","level":"NB","q":"Viết tắt của Chính sách kinh tế mới ở nước Nga (1921) là gì?","answer":"NEP","explain":"NEP (New Economic Policy) là Chính sách kinh tế mới do Lê-nin đề xướng năm 1921.","points":0.5},{"type":"short","level":"VD","q":"Ngày tháng năm nào Liên bang Cộng hòa xã hội chủ nghĩa Xô viết chính thức thành lập?","answer":"30/12/1922","explain":"Ngày 30/12/1922, Liên bang Cộng hòa xã hội chủ nghĩa Xô viết chính thức được thành lập.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Từ cuối những năm 20 của thế kỉ XX, Liên Xô đã tiến hành nhiệm vụ trọng tâm nào?","options":["A. Công nghiệp hóa xã hội chủ nghĩa và tập thể hóa nông nghiệp","B. Cải cách ruộng đất","C. Mở cửa hội nhập kinh tế","D. Tư nhân hóa toàn bộ nền kinh tế"],"answer":"A","explain":"Từ cuối những năm 1920, Liên Xô tiến hành công nghiệp hóa xã hội chủ nghĩa và tập thể hóa nông nghiệp thông qua các kế hoạch 5 năm.","points":0.25},{"type":"mcq","level":"NB","q":"Công cụ chủ yếu để Liên Xô thực hiện công nghiệp hóa là gì?","options":["A. Các kế hoạch 5 năm","B. Viện trợ của Mỹ","C. Vốn đầu tư tư nhân","D. Kế hoạch Mác-san"],"answer":"A","explain":"Liên Xô thực hiện công nghiệp hóa thông qua các kế hoạch 5 năm (kế hoạch 5 năm lần thứ nhất 1928 - 1932...).","points":0.25},{"type":"mcq","level":"NB","q":"Sau công cuộc công nghiệp hóa, Liên Xô trở thành cường quốc công nghiệp đứng thứ mấy thế giới?","options":["A. Thứ nhất","B. Thứ hai","C. Thứ ba","D. Thứ tư"],"answer":"B","explain":"Chỉ trong thời gian ngắn, Liên Xô từ nước nông nghiệp lạc hậu trở thành cường quốc công nghiệp thứ hai thế giới (sau Mỹ).","points":0.25},{"type":"mcq","level":"TH","q":"Thành tựu nổi bật của Liên Xô trong công cuộc xây dựng chủ nghĩa xã hội những năm 30 của thế kỉ XX là gì?","options":["A. Hoàn thành cách mạng khoa học kĩ thuật","B. Xây dựng cơ sở vật chất - kĩ thuật của chủ nghĩa xã hội","C. Chinh phục vũ trụ","D. Trở thành trung tâm tài chính thế giới"],"answer":"B","explain":"Nhờ công nghiệp hóa và tập thể hóa, Liên Xô đã xây dựng được cơ sở vật chất - kĩ thuật của chủ nghĩa xã hội.","points":0.25},{"type":"mcq","level":"VDC","q":"Hiến pháp Xô viết năm 1936 đã khẳng định điều gì?","options":["A. Liên Xô đã xây dựng xong chủ nghĩa cộng sản","B. Chủ nghĩa xã hội đã được xây dựng cơ bản ở Liên Xô","C. Liên Xô chuyển sang chế độ tư bản","D. Liên Xô giải tán các Xô viết"],"answer":"B","explain":"Hiến pháp 1936 tuyên bố chủ nghĩa xã hội đã được xây dựng về cơ bản ở Liên Xô.","points":0.25},{"type":"mcq","level":"TH","q":"Về đối ngoại trong những năm 30 của thế kỉ XX, Liên Xô kiên trì chính sách nào?","options":["A. Bành trướng lãnh thổ","B. Hòa bình, ủng hộ phong trào giải phóng dân tộc","C. Liên minh với phát xít Đức","D. Trung lập tuyệt đối"],"answer":"B","explain":"Liên Xô kiên trì chính sách hòa bình, ủng hộ phong trào đấu tranh cho hòa bình, dân chủ và phong trào giải phóng dân tộc.","points":0.25},{"type":"truefalse","level":"TH","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Liên Xô tiến hành công nghiệp hóa trong khi vẫn là nước nông nghiệp lạc hậu.","b) Các kế hoạch 5 năm là công cụ thực hiện công nghiệp hóa ở Liên Xô.","c) Công nghiệp hóa giúp Liên Xô trở thành cường quốc công nghiệp thứ hai thế giới.","d) Liên Xô hoàn thành công nghiệp hóa mà không gặp khó khăn nào."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: công nghiệp hóa diễn ra với nhiều khó khăn, hi sinh to lớn của nhân dân Liên Xô.","points":1},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Tập thể hóa nông nghiệp đưa nông dân vào các nông trang tập thể.","b) Công nghiệp hóa ưu tiên phát triển công nghiệp nặng.","c) Đến cuối những năm 30, Liên Xô đã có nền công nghiệp hiện đại.","d) Thành tựu xây dựng CNXH tạo tiềm lực để Liên Xô đánh thắng phát xít sau này."],"answer":["T","T","T","T"],"explain":"Cả 4 nhận định đều đúng: nội dung công nghiệp hóa - tập thể hóa, thành tựu và ý nghĩa tạo tiềm lực quốc phòng cho cuộc chiến tranh vệ quốc.","points":1},{"type":"short","level":"VD","q":"Kế hoạch phát triển kinh tế - xã hội của Liên Xô được thực hiện theo từng giai đoạn mấy năm?","answer":"5 năm","explain":"Liên Xô thực hiện các kế hoạch 5 năm (kế hoạch 5 năm lần thứ nhất 1928 - 1932).","points":0.5},{"type":"short","level":"VDC","q":"Nước nào đứng thứ nhất thế giới về công nghiệp khi Liên Xô vươn lên vị trí thứ hai sau công nghiệp hóa?","answer":"Mỹ","explain":"Sau công nghiệp hóa, Liên Xô trở thành cường quốc công nghiệp thứ hai thế giới, sau Mỹ.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Trong Chiến tranh thế giới thứ hai, Liên Xô đóng vai trò gì trong việc tiêu diệt chủ nghĩa phát xít?","options":["A. Vai trò quyết định","B. Vai trò thứ yếu","C. Vai trò trung gian hòa giải","D. Không tham gia"],"answer":"A","explain":"Liên Xô đóng vai trò quyết định trong việc tiêu diệt chủ nghĩa phát xít, cứu nhân loại khỏi thảm họa phát xít.","points":0.25},{"type":"mcq","level":"NB","q":"Ngày 9/5/1945 ghi dấu sự kiện nào?","options":["A. Liên Xô phóng vệ tinh nhân tạo","B. Phát xít Đức đầu hàng Đồng minh","C. Liên Xô thử bom nguyên tử","D. Chiến tranh lạnh kết thúc"],"answer":"B","explain":"Ngày 9/5/1945, phát xít Đức kí văn kiện đầu hàng không điều kiện, chiến tranh kết thúc ở châu Âu.","points":0.25},{"type":"mcq","level":"TH","q":"Trận đánh nào được coi là bước ngoặt của Chiến tranh thế giới thứ hai ở mặt trận Xô - Đức?","options":["A. Trận Xta-lin-grát","B. Trận Mát-xcơ-va","C. Trận Cuốc-xcơ","D. Trận Béc-lin"],"answer":"A","explain":"Chiến thắng Xta-lin-grát (2/1943) là bước ngoặt căn bản của Chiến tranh thế giới thứ hai, Hồng quân chuyển sang phản công.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao nói Liên Xô đóng vai trò quyết định trong việc tiêu diệt chủ nghĩa phát xít?","options":["A. Vì Liên Xô là nước duy nhất chống phát xít","B. Vì mặt trận Xô - Đức là mặt trận chủ yếu, Liên Xô đánh bại đại bộ phận quân phát xít","C. Vì Liên Xô chế tạo bom nguyên tử đầu tiên","D. Vì Liên Xô không bị tổn thất gì"],"answer":"B","explain":"Mặt trận Xô - Đức là mặt trận chủ yếu, quyết định nhất; Liên Xô đã tiêu diệt đại bộ phận sinh lực của phát xít Đức.","points":0.25},{"type":"mcq","level":"TH","q":"Cuộc chiến tranh của nhân dân Liên Xô chống phát xít Đức (1941 - 1945) còn được gọi là gì?","options":["A. Chiến tranh vệ quốc vĩ đại","B. Chiến tranh lạnh","C. Nội chiến","D. Chiến tranh cách mạng"],"answer":"A","explain":"Cuộc chiến tranh 1941 - 1945 của nhân dân Liên Xô chống phát xít Đức được gọi là Chiến tranh vệ quốc vĩ đại.","points":0.25},{"type":"mcq","level":"TH","q":"Thắng lợi của Liên Xô trong Chiến tranh thế giới thứ hai đã tạo điều kiện quốc tế thuận lợi nào?","options":["A. Phong trào giải phóng dân tộc dâng cao, hệ thống xã hội chủ nghĩa hình thành","B. Chủ nghĩa thực dân được củng cố","C. Mỹ trở thành siêu cường duy nhất mãi mãi","D. Chiến tranh lạnh không bao giờ xảy ra"],"answer":"A","explain":"Thắng lợi của Liên Xô cổ vũ phong trào giải phóng dân tộc, tạo điều kiện cho hệ thống xã hội chủ nghĩa thế giới hình thành.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Phát xít Đức tấn công Liên Xô ngày 22/6/1941.","b) Trận Xta-lin-grát là bước ngoặt của Chiến tranh thế giới thứ hai.","c) Hồng quân tiến vào giải phóng Béc-lin tháng 4 - 5/1945.","d) Liên Xô là nước duy nhất đánh bại phát xít Đức, không cần đồng minh."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: thắng lợi là của cả phe Đồng minh, trong đó Liên Xô đóng vai trò quyết định.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Liên Xô phải chịu tổn thất nặng nề nhất trong Chiến tranh thế giới thứ hai.","b) Công nghiệp hóa trước chiến tranh tạo tiềm lực quốc phòng cho Liên Xô.","c) Thắng lợi 9/5/1945 cứu nhân loại khỏi thảm họa phát xít.","d) Sau chiến tranh, uy tín của Liên Xô trên trường quốc tế được nâng cao vượt bậc."],"answer":["T","T","T","T"],"explain":"Cả 4 nhận định đều đúng: tổn thất to lớn, tiềm lực từ công nghiệp hóa, ý nghĩa cứu nhân loại và uy tín quốc tế của Liên Xô.","points":1},{"type":"short","level":"NB","q":"Ngày tháng năm nào phát xít Đức đầu hàng, kết thúc chiến tranh ở châu Âu?","answer":"9/5/1945","explain":"Ngày 9/5/1945, phát xít Đức đầu hàng không điều kiện, chiến tranh kết thúc ở châu Âu.","points":0.5},{"type":"short","level":"VD","q":"Tên gọi cuộc chiến tranh 1941 - 1945 của nhân dân Liên Xô chống phát xít Đức là gì?","answer":"Chiến tranh vệ quốc vĩ đại","explain":"Cuộc chiến tranh 1941 - 1945 của nhân dân Liên Xô được gọi là Chiến tranh vệ quốc vĩ đại.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Nước Cộng hòa Nhân dân Trung Hoa được thành lập vào thời gian nào?","options":["A. 1/10/1949","B. 2/9/1945","C. 7/11/1917","D. 1/1/1959"],"answer":"A","explain":"Ngày 1/10/1949, nước Cộng hòa Nhân dân Trung Hoa ra đời, đánh dấu thắng lợi của cách mạng Trung Quốc.","points":0.25},{"type":"mcq","level":"NB","q":"Cách mạng Cu-ba thắng lợi vào năm nào?","options":["A. 1945","B. 1949","C. 1959","D. 1975"],"answer":"C","explain":"Năm 1959, cách mạng Cu-ba thắng lợi, đưa Cu-ba đi lên chủ nghĩa xã hội - ngọn cờ đầu ở Tây bán cầu.","points":0.25},{"type":"mcq","level":"NB","q":"Sau Chiến tranh thế giới thứ hai, chủ nghĩa xã hội đã phát triển thành gì?","options":["A. Một trào lưu tư tưởng","B. Hệ thống xã hội chủ nghĩa thế giới","C. Một liên minh quân sự","D. Một tổ chức kinh tế"],"answer":"B","explain":"Sau 1945, chủ nghĩa xã hội vượt ra khỏi phạm vi một nước, trở thành hệ thống xã hội chủ nghĩa thế giới.","points":0.25},{"type":"mcq","level":"TH","q":"Các nước Đông Âu đi lên chủ nghĩa xã hội sau Chiến tranh thế giới thứ hai gồm những nước nào?","options":["A. Ba Lan, Tiệp Khắc, Hung-ga-ri, Ru-ma-ni, Bun-ga-ri","B. Anh, Pháp, Đức, Ý, Tây Ban Nha","C. Nhật Bản, Hàn Quốc, Thái Lan, Phi-líp-pin","D. Ai Cập, An-giê-ri, Ma-rốc, Tuy-ni-di"],"answer":"A","explain":"Sau 1945, các nước Đông Âu như Ba Lan, Tiệp Khắc, Hung-ga-ri, Ru-ma-ni, Bun-ga-ri, An-ba-ni, CHDC Đức đi lên chủ nghĩa xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Ở châu Á sau năm 1945, những nước nào đã đi theo con đường xã hội chủ nghĩa?","options":["A. Trung Quốc, Việt Nam, Triều Tiên, Lào, Mông Cổ","B. Nhật Bản, Hàn Quốc, Xin-ga-po, Ma-lai-xi-a","C. Ấn Độ, Pa-ki-xtan, Băng-la-đét, Xri Lan-ca","D. I-ran, I-rắc, Ả-rập Xê-út, Thổ Nhĩ Kỳ"],"answer":"A","explain":"Ở châu Á, Trung Quốc (1949), Việt Nam, Triều Tiên, Lào, Mông Cổ đã đi lên chủ nghĩa xã hội sau 1945.","points":0.25},{"type":"mcq","level":"VDC","q":"Hệ thống xã hội chủ nghĩa thế giới ra đời có ý nghĩa gì?","options":["A. Trở thành lực lượng hùng hậu đối trọng với chủ nghĩa đế quốc","B. Chấm dứt hoàn toàn chủ nghĩa tư bản","C. Thống nhất toàn thế giới","D. Xóa bỏ chiến tranh vĩnh viễn"],"answer":"A","explain":"Hệ thống xã hội chủ nghĩa thế giới trở thành lực lượng hùng hậu, đối trọng với chủ nghĩa đế quốc trong thời kì Chiến tranh lạnh.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Nước Cộng hòa Nhân dân Trung Hoa ra đời ngày 1/10/1949.","b) Cách mạng Cu-ba thắng lợi năm 1959.","c) Hệ thống XHCN thế giới chỉ gồm các nước ở châu Âu.","d) Sự ra đời của hệ thống XHCN gắn liền với thắng lợi của Liên Xô trong chiến tranh."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: hệ thống XHCN gồm các nước ở châu Âu, châu Á và châu Mỹ (Cu-ba).","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Thắng lợi của cách mạng Trung Quốc 1949 làm thay đổi cục diện chính trị châu Á.","b) Cu-ba là nước xã hội chủ nghĩa đầu tiên ở Tây bán cầu.","c) Tất cả các nước Đông Âu đều tự nguyện đi lên CNXH mà không có vai trò của Hồng quân Liên Xô.","d) Hệ thống XHCN thế giới là thành quả của phong trào cộng sản và công nhân quốc tế."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: Hồng quân Liên Xô giải phóng Đông Âu khỏi phát xít đã tạo điều kiện cho các nước này đi lên CNXH.","points":1},{"type":"short","level":"TH","q":"Năm nào nước Cộng hòa Nhân dân Trung Hoa ra đời?","answer":"1949","explain":"Ngày 1/10/1949, nước Cộng hòa Nhân dân Trung Hoa ra đời.","points":0.5},{"type":"short","level":"VD","q":"Nước xã hội chủ nghĩa đầu tiên ở Tây bán cầu (châu Mỹ) là nước nào?","answer":"Cu-ba","explain":"Cách mạng Cu-ba thắng lợi năm 1959, đưa Cu-ba trở thành nước xã hội chủ nghĩa đầu tiên ở Tây bán cầu.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Liên Xô tan rã vào thời gian nào?","options":["A. Tháng 12/1991","B. Tháng 12/1985","C. Tháng 8/1990","D. Tháng 3/1990"],"answer":"A","explain":"Tháng 12/1991, Liên Xô chính thức tan rã, chế độ xã hội chủ nghĩa ở Liên Xô và Đông Âu sụp đổ.","points":0.25},{"type":"mcq","level":"NB","q":"Ai là người lãnh đạo công cuộc cải tổ ở Liên Xô từ giữa những năm 80 của thế kỉ XX?","options":["A. Lê-nin","B. Xta-lin","C. Goóc-ba-chốp","D. En-xin"],"answer":"C","explain":"Từ giữa những năm 1980, Goóc-ba-chốp tiến hành công cuộc cải tổ ở Liên Xô nhưng mắc nhiều sai lầm nghiêm trọng.","points":0.25},{"type":"mcq","level":"VD","q":"Sự kiện Liên Xô tan rã (1991) có ý nghĩa như thế nào đối với phong trào cộng sản quốc tế?","options":["A. Là thắng lợi vĩ đại","B. Là tổn thất to lớn","C. Không có ảnh hưởng gì","D. Đánh dấu sự cáo chung của chủ nghĩa xã hội"],"answer":"B","explain":"Sự sụp đổ ở Liên Xô - Đông Âu là tổn thất to lớn của phong trào cộng sản và công nhân quốc tế, nhưng không phải sự cáo chung của chủ nghĩa xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân chủ yếu dẫn đến sự sụp đổ của chế độ xã hội chủ nghĩa ở Liên Xô là gì?","options":["A. Thiên tai liên tiếp","B. Cải tổ xa rời nguyên tắc của chủ nghĩa xã hội, sự chống phá của các thế lực thù địch","C. Chiến tranh với Mỹ","D. Khủng hoảng dân số"],"answer":"B","explain":"Cải tổ mắc sai lầm nghiêm trọng, xa rời nguyên tắc của chủ nghĩa xã hội, cộng với sự chống phá quyết liệt của các thế lực thù địch.","points":0.25},{"type":"mcq","level":"TH","q":"Bài học lớn nhất rút ra từ sự sụp đổ của Liên Xô đối với các nước xã hội chủ nghĩa là gì?","options":["A. Từ bỏ con đường xã hội chủ nghĩa","B. Kiên định mục tiêu, giữ vững nguyên tắc của chủ nghĩa xã hội trong cải cách","C. Đóng cửa, không cải cách","D. Dựa hoàn toàn vào viện trợ nước ngoài"],"answer":"B","explain":"Bài học: phải kiên định mục tiêu xã hội chủ nghĩa, giữ vững nguyên tắc, không xa rời bản chất của chế độ trong quá trình cải cách.","points":0.25},{"type":"mcq","level":"VDC","q":"Sau khi Liên Xô tan rã, nước Nga kế thừa vị trí nào của Liên Xô trên trường quốc tế?","options":["A. Ủy viên thường trực Hội đồng Bảo an Liên hợp quốc","B. Chủ tịch Liên hợp quốc","C. Tổng thư kí NATO","D. Chủ tịch EU"],"answer":"A","explain":"Liên bang Nga kế thừa Liên Xô, trong đó có vị trí Ủy viên thường trực Hội đồng Bảo an Liên hợp quốc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Liên Xô tan rã vào tháng 12/1991.","b) Công cuộc cải tổ của Goóc-ba-chốp mắc nhiều sai lầm nghiêm trọng.","c) Sự sụp đổ của Liên Xô là tổn thất to lớn của phong trào cộng sản quốc tế.","d) Sự sụp đổ của Liên Xô đồng nghĩa với sự cáo chung của chủ nghĩa xã hội."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: đó chỉ là sự sụp đổ của một mô hình, chủ nghĩa xã hội vẫn tiếp tục phát triển ở nhiều nước.","points":1},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Cải tổ ở Liên Xô xa rời nguyên tắc của chủ nghĩa xã hội.","b) Các thế lực thù địch đã chống phá quyết liệt chế độ Xô viết.","c) Mọi thành tựu của Liên Xô đều bị phủ nhận hoàn toàn sau 1991.","d) Bài học từ Liên Xô giúp các nước XHCN kiên định hơn trong cải cách."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: những thành tựu to lớn của Liên Xô (công nghiệp hóa, thắng phát xít, chinh phục vũ trụ) vẫn được lịch sử ghi nhận.","points":1},{"type":"short","level":"TH","q":"Tháng năm nào Liên Xô chính thức tan rã?","answer":"12/1991","explain":"Tháng 12/1991, Liên Xô chính thức tan rã.","points":0.5},{"type":"short","level":"VDC","q":"Ai là Tổng thống đầu tiên (cũng là cuối cùng) của Liên Xô, người gắn liền với công cuộc cải tổ?","answer":"Goóc-ba-chốp","explain":"Goóc-ba-chốp là người lãnh đạo công cuộc cải tổ ở Liên Xô từ giữa những năm 1980.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Trung Quốc bắt đầu thực hiện cải cách - mở cửa từ năm nào?","options":["A. 1949","B. 1978","C. 1986","D. 1991"],"answer":"B","explain":"Từ năm 1978, Trung Quốc thực hiện cải cách - mở cửa do Đặng Tiểu Bình khởi xướng.","points":0.25},{"type":"mcq","level":"NB","q":"Việt Nam bắt đầu thực hiện đường lối đổi mới từ năm nào?","options":["A. 1975","B. 1986","C. 1991","D. 2000"],"answer":"B","explain":"Từ năm 1986, Việt Nam thực hiện đường lối đổi mới toàn diện, đạt nhiều thành tựu to lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Ai là người khởi xướng công cuộc cải cách - mở cửa ở Trung Quốc?","options":["A. Mao Trạch Đông","B. Đặng Tiểu Bình","C. Chu Ân Lai","D. Tập Cận Bình"],"answer":"B","explain":"Đặng Tiểu Bình là người khởi xướng công cuộc cải cách - mở cửa ở Trung Quốc từ năm 1978.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung cơ bản của công cuộc đổi mới ở Việt Nam (từ 1986) là gì?","options":["A. Chuyển sang kinh tế thị trường định hướng xã hội chủ nghĩa","B. Quay lại cơ chế kế hoạch hóa tập trung","C. Tư nhân hóa toàn bộ nền kinh tế","D. Đóng cửa với thế giới"],"answer":"A","explain":"Đổi mới ở Việt Nam chuyển từ cơ chế kế hoạch hóa tập trung sang kinh tế thị trường định hướng xã hội chủ nghĩa.","points":0.25},{"type":"mcq","level":"TH","q":"Thành tựu nổi bật của cải cách - mở cửa ở Trung Quốc là gì?","options":["A. Trở thành nền kinh tế lớn thứ hai thế giới","B. Trở thành siêu cường quân sự duy nhất","C. Xóa bỏ hoàn toàn đói nghèo trên toàn cầu","D. Thống nhất hoàn toàn lãnh thổ"],"answer":"A","explain":"Nhờ cải cách - mở cửa, Trung Quốc vươn lên thành nền kinh tế lớn thứ hai thế giới.","points":0.25},{"type":"mcq","level":"VDC","q":"Hiện nay, những nước nào vẫn kiên trì con đường xã hội chủ nghĩa?","options":["A. Trung Quốc, Việt Nam, Lào, Cu-ba, Triều Tiên","B. Mỹ, Anh, Pháp, Đức, Nhật","C. Ấn Độ, Bra-xin, Nam Phi, Ai Cập","D. Thái Lan, Ma-lai-xi-a, Xin-ga-po, In-đô-nê-xi-a"],"answer":"A","explain":"Trung Quốc, Việt Nam, Lào, Cu-ba, Triều Tiên vẫn kiên trì con đường xã hội chủ nghĩa, tiến hành cải cách phù hợp.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Trung Quốc cải cách - mở cửa từ năm 1978.","b) Việt Nam đổi mới từ năm 1986.","c) Cải cách ở các nước XHCN đồng nghĩa với từ bỏ chủ nghĩa xã hội.","d) Đổi mới ở Việt Nam đạt nhiều thành tựu to lớn, có ý nghĩa lịch sử."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: cải cách, đổi mới nhằm hoàn thiện, phát triển chủ nghĩa xã hội chứ không từ bỏ nó.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Sau 1991, chủ nghĩa xã hội vẫn chứng tỏ sức sống qua cải cách, đổi mới.","b) Kinh tế thị trường định hướng XHCN là sáng tạo của Việt Nam.","c) Mọi nước XHCN đều áp dụng một mô hình cải cách giống hệt nhau.","d) Thành tựu đổi mới của Việt Nam là minh chứng cho sức sống của CNXH."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: mỗi nước cải cách phù hợp với điều kiện cụ thể của mình, không rập khuôn.","points":1},{"type":"short","level":"NB","q":"Năm nào Việt Nam bắt đầu thực hiện đường lối đổi mới?","answer":"1986","explain":"Năm 1986, Đại hội VI của Đảng đề ra đường lối đổi mới toàn diện đất nước.","points":0.5},{"type":"short","level":"VD","q":"Ai khởi xướng công cuộc cải cách - mở cửa ở Trung Quốc năm 1978?","answer":"Đặng Tiểu Bình","explain":"Đặng Tiểu Bình khởi xướng cải cách - mở cửa ở Trung Quốc từ năm 1978.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Sự kiện nào đánh dấu sự ra đời của nhà nước xã hội chủ nghĩa đầu tiên trên thế giới?","options":["A. Cách mạng tháng Mười Nga 1917","B. Công xã Pa-ri 1871","C. Cách mạng Trung Quốc 1949","D. Cách mạng Cu-ba 1959"],"answer":"A","explain":"Thắng lợi của Cách mạng tháng Mười Nga 1917 đưa đến sự ra đời của nhà nước xã hội chủ nghĩa đầu tiên trên thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Sắp xếp đúng trình tự thời gian các sự kiện: (1) Thành lập Liên Xô; (2) Cách mạng tháng Mười; (3) NEP; (4) Liên Xô tan rã.","options":["A. (2) - (3) - (1) - (4)","B. (2) - (1) - (3) - (4)","C. (1) - (2) - (3) - (4)","D. (3) - (2) - (1) - (4)"],"answer":"A","explain":"Trình tự đúng: (2) Cách mạng tháng Mười 1917 - (3) NEP 1921 - (1) Thành lập Liên Xô 1922 - (4) Liên Xô tan rã 1991.","points":0.25},{"type":"mcq","level":"NB","q":"Sự kiện nào mở đầu kỉ nguyên mới trong lịch sử nhân loại: kỉ nguyên độc lập dân tộc gắn liền với chủ nghĩa xã hội?","options":["A. Chiến tranh thế giới thứ nhất","B. Cách mạng tháng Mười Nga","C. Chiến tranh thế giới thứ hai","D. Chiến tranh lạnh"],"answer":"B","explain":"Cách mạng tháng Mười Nga mở ra kỉ nguyên mới: kỉ nguyên độc lập dân tộc gắn liền với chủ nghĩa xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung của NEP (1921) với công cuộc đổi mới ở Việt Nam (1986) là gì?","options":["A. Đều từ bỏ chủ nghĩa xã hội","B. Đều vận dụng kinh tế thị trường để xây dựng chủ nghĩa xã hội","C. Đều do Lê-nin khởi xướng","D. Đều diễn ra trong chiến tranh"],"answer":"B","explain":"Cả NEP và Đổi mới đều thừa nhận, vận dụng quan hệ hàng hóa - tiền tệ, kinh tế thị trường trong thời kì quá độ lên chủ nghĩa xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Cách mạng tháng Mười Nga được coi là cuộc cách mạng xã hội chủ nghĩa?","options":["A. Vì lật đổ chế độ phong kiến","B. Vì lật đổ giai cấp tư sản, lập chính quyền của nhân dân lao động","C. Vì do nông dân lãnh đạo","D. Vì được Mỹ ủng hộ"],"answer":"B","explain":"Cách mạng tháng Mười lật đổ giai cấp tư sản (Chính phủ lâm thời), lập chính quyền Xô viết của công - nông - binh, mở đường đi lên CNXH.","points":0.25},{"type":"mcq","level":"VDC","q":"Ảnh hưởng lớn nhất của Cách mạng tháng Mười đối với Việt Nam là gì?","options":["A. Cung cấp viện trợ kinh tế trực tiếp","B. Mở ra con đường cứu nước mới: độc lập dân tộc gắn liền với chủ nghĩa xã hội","C. Đưa quân đội sang giúp Việt Nam","D. Giúp Việt Nam gia nhập Liên hợp quốc"],"answer":"B","explain":"Cách mạng tháng Mười giúp Nguyễn Ái Quốc tìm ra con đường cứu nước đúng đắn: độc lập dân tộc gắn liền với chủ nghĩa xã hội.","points":0.25},{"type":"truefalse","level":"TH","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Cách mạng tháng Mười là cuộc cách mạng vô sản đầu tiên thắng lợi.","b) NEP ra đời trước khi Liên Xô thành lập.","c) Liên Xô tồn tại gần 70 năm (1922 - 1991).","d) Hệ thống XHCN thế giới hình thành trước Chiến tranh thế giới thứ hai."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: hệ thống XHCN thế giới hình thành sau Chiến tranh thế giới thứ hai.","points":1},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Từ 1917 đến nay, CNXH trải qua cả thắng lợi và tổn thất.","b) Sự sụp đổ ở Liên Xô - Đông Âu không phủ nhận tính đúng đắn của CNXH.","c) Cải cách, đổi mới là con đường phát triển tất yếu của CNXH hiện nay.","d) Hiện nay không còn nước nào theo con đường XHCN."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: Trung Quốc, Việt Nam, Lào, Cu-ba, Triều Tiên vẫn kiên trì con đường XHCN.","points":1},{"type":"short","level":"VD","q":"Nhà nước xã hội chủ nghĩa đầu tiên trên thế giới ra đời từ thắng lợi của cuộc cách mạng nào?","answer":"Cách mạng tháng Mười Nga","explain":"Thắng lợi của Cách mạng tháng Mười Nga 1917 đưa đến sự ra đời của nhà nước XHCN đầu tiên.","points":0.5},{"type":"short","level":"VDC","q":"Kỉ nguyên mới mà Cách mạng tháng Mười mở ra trong lịch sử nhân loại được gọi là kỉ nguyên gì?","answer":"Kỉ nguyên độc lập dân tộc gắn liền với chủ nghĩa xã hội","explain":"Cách mạng tháng Mười mở ra kỉ nguyên độc lập dân tộc gắn liền với chủ nghĩa xã hội.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tổ chức quốc tế nào của các nước xã hội chủ nghĩa được thành lập năm 1949 về hợp tác kinh tế?","options":["A. Hội đồng tương trợ kinh tế (SEV)","B. Tổ chức Hiệp ước Vác-sa-va","C. Liên hợp quốc","D. Cộng đồng châu Âu"],"answer":"A","explain":"Năm 1949, Hội đồng tương trợ kinh tế (SEV/COMECON) được thành lập nhằm hợp tác, giúp đỡ nhau về kinh tế giữa các nước XHCN.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức quân sự - chính trị của các nước xã hội chủ nghĩa châu Âu (1955 - 1991) là gì?","options":["A. NATO","B. Tổ chức Hiệp ước Vác-sa-va","C. SEATO","D. CENTO"],"answer":"B","explain":"Tổ chức Hiệp ước Vác-sa-va (1955 - 1991) là liên minh quân sự - chính trị của các nước XHCN châu Âu.","points":0.25},{"type":"mcq","level":"NB","q":"Thành tựu nào của Liên Xô thể hiện bước tiến vượt bậc về khoa học - kĩ thuật năm 1957?","options":["A. Phóng vệ tinh nhân tạo đầu tiên","B. Chế tạo bom nguyên tử đầu tiên","C. Đưa người lên Mặt Trăng","D. Phát minh máy tính điện tử"],"answer":"A","explain":"Năm 1957, Liên Xô phóng thành công vệ tinh nhân tạo đầu tiên của nhân loại, mở ra kỉ nguyên chinh phục vũ trụ.","points":0.25},{"type":"mcq","level":"TH","q":"Người đầu tiên bay vào vũ trụ (1961) là công dân nước nào?","options":["A. Mỹ","B. Liên Xô","C. Trung Quốc","D. Pháp"],"answer":"B","explain":"Ngày 12/4/1961, nhà du hành vũ trụ Ga-ga-rin (Liên Xô) trở thành người đầu tiên bay vào vũ trụ.","points":0.25},{"type":"mcq","level":"TH","q":"Ý nghĩa quốc tế to lớn nhất của Cách mạng tháng Mười Nga là gì?","options":["A. Làm thay đổi bản đồ chính trị châu Âu","B. Cổ vũ mạnh mẽ phong trào cách mạng thế giới và phong trào giải phóng dân tộc","C. Chấm dứt Chiến tranh thế giới thứ nhất","D. Thành lập Liên hợp quốc"],"answer":"B","explain":"Cách mạng tháng Mười cổ vũ mạnh mẽ phong trào cách mạng thế giới, nhất là phong trào giải phóng dân tộc ở thuộc địa.","points":0.25},{"type":"mcq","level":"TH","q":"Nhận định nào đúng về chủ nghĩa xã hội từ năm 1917 đến nay?","options":["A. Phát triển liên tục, không gặp thất bại nào","B. Trải qua cả thắng lợi to lớn và tổn thất nặng nề, nhưng vẫn khẳng định sức sống","C. Đã hoàn toàn biến mất sau 1991","D. Chỉ tồn tại ở châu Âu"],"answer":"B","explain":"Từ 1917 đến nay, CNXH trải qua thắng lợi (1917, 1945, hệ thống XHCN) và tổn thất (1991), nhưng vẫn khẳng định sức sống qua cải cách, đổi mới.","points":0.25},{"type":"truefalse","level":"VD","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) SEV là tổ chức hợp tác kinh tế của các nước XHCN.","b) Tổ chức Vác-sa-va là liên minh quân sự của các nước XHCN châu Âu.","c) Liên Xô phóng vệ tinh nhân tạo đầu tiên năm 1957.","d) Ga-ga-rin là người Mỹ đầu tiên bay vào vũ trụ."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: Ga-ga-rin là công dân Liên Xô, người đầu tiên bay vào vũ trụ năm 1961.","points":1},{"type":"truefalse","level":"VDC","q":"Xác định các nhận định sau Đúng (T) hay Sai (F):","statements":["a) Thành tựu khoa học - kĩ thuật chứng tỏ tính ưu việt của chế độ XHCN.","b) Mọi thành tựu của Liên Xô đều gắn với sự lãnh đạo của Đảng Cộng sản.","c) Sự sụp đổ năm 1991 xóa nhòa mọi đóng góp của Liên Xô với nhân loại.","d) Bài học Liên Xô có giá trị với công cuộc đổi mới ở Việt Nam."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: những đóng góp của Liên Xô (thắng phát xít, khoa học, ủng hộ giải phóng dân tộc) mãi được ghi nhận.","points":1},{"type":"short","level":"VD","q":"Năm nào Liên Xô phóng thành công vệ tinh nhân tạo đầu tiên của nhân loại?","answer":"1957","explain":"Năm 1957, Liên Xô phóng vệ tinh nhân tạo đầu tiên, mở ra kỉ nguyên vũ trụ.","points":0.5},{"type":"short","level":"VDC","q":"Ai là người đầu tiên bay vào vũ trụ năm 1961?","answer":"Ga-ga-rin","explain":"Ngày 12/4/1961, Ga-ga-rin (Liên Xô) trở thành người đầu tiên bay vào vũ trụ.","points":0.5}]}]}
