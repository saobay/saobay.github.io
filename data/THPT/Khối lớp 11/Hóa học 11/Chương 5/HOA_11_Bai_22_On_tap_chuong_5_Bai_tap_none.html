H$ đặc ($t^o$, p cao) cho sản phẩm nào? (viết công thức)", "answer": "C6H5OH", "explain": "SGK."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đề cuối: phát biểu nào sau đây ĐÚNG?", "answer": "A", "explain": "SGK.", "options": ["A. Phenol có tính acid yếu.", "B. Phenol là base mạnh.", "C. Ethanol là acid mạnh.", "D. Methanol không độc."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Đề cuối: phát biểu nào sau đây SAI?", "answer": "A", "explain": "Phenol không tác dụng với $NaHCO_3$.", "options": ["A. Phenol tác dụng được với $NaHCO_3$.", "B. Phenol tác dụng với $NaOH$.", "C. Ethanol tác dụng với $Na$.", "D. Glycerol hoà tan $Cu(OH)_2$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Đề cuối: để phân biệt 3 chất $C_2H_5Cl$, $C_2H_5OH$, $C_6H_5OH$, dùng", "answer": "A", "explain": "SGK.", "options": ["A. $AgNO_3$, $Br_2$.", "B. $Na$ duy nhất.", "C. quỳ tím.", "D. $KMnO_4$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Đề cuối: hiện tượng khi cho $Br_2$ vào phenol là", "answer": "A", "explain": "SGK.", "options": ["A. kết tủa trắng.", "B. dung dịch hoá xanh.", "C. có khí.", "D. không hiện tượng."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Đề cuối: cho 0,1 mol X ($C_3H_8O$, alcohol bậc 1) + $Na$ dư. $V_{H_2}$ (đkc) là", "answer": "A", "explain": "$n_{H_2} = 0{,}05$.", "options": ["A. $1{,}24$ lít.", "B. $2{,}479$ lít.", "C. $4{,}958$ lít.", "D. $0{,}62$ lít."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Đề cuối: đốt cháy 0,1 mol X (alcohol no, đơn chức) thu được 14,874 lít $CO_2$ (đkc). X là", "answer": "A", "explain": "$n_{CO_2} = 0{,}6$; số nguyên tử C = 6.", "options": ["A. $C_6H_{14}O$.", "B. $C_3H_8O$.", "C. $C_2H_6O$.", "D. $CH_4O$."]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau (cuối chương):", "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "statements": ["a) Phenol có tính acid yếu.", "b) Phenol k
