NB", "points": 0.25, "q": "Số hiệu nguyên tử của nitrogen là", "answer": "A", "explain": "N ở ô số 7: Z = 7.", "options": ["A. $7$.", "B. $8$.", "C. $14$.", "D. $5$."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Nitrogen thuộc nhóm nào trong bảng tuần hoàn?", "answer": "A", "explain": "N có 5 electron lớp ngoài cùng nên thuộc nhóm VA.", "options": ["A. Nhóm VA.", "B. Nhóm VIIA.", "C. Nhóm VIA.", "D. Nhóm IVA."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Độ âm điện của nitrogen là 3,04 (khá lớn). Điều này cho thấy nitrogen", "answer": "A", "explain": "Độ âm điện lớn nghĩa là hút electron mạnh — xu hướng nhận electron (tính oxi hoá).", "options": ["A. có xu hướng nhận electron, thể hiện tính oxi hoá.", "B. có xu hướng nhường electron.", "C. là kim loại điển hình.", "D. không tham gia phản ứng hoá học."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Sấm sét tạo ra $NO$ trong không khí. Sau đó $NO$ tiếp tục chuyển thành", "answer": "A", "explain": "$2NO + O_2 \\to 2NO_2$; $NO_2$ tan trong nước mưa tạo acid, cung cấp đạm cho đất.", "options": ["A. $NO_2$ rồi thành $HNO_3$ theo nước mưa xuống đất.", "B. $N_2$ và $O_2$.", "C. $NH_3$.", "D. $N_2O$."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Trong các phản ứng sau, $N_2$ thể hiện tính khử trong phản ứng", "answer": "A", "explain": "Chỉ với $O_2$, số oxi hoá của N tăng ($0 \\to +2$) nên $N_2$ thể hiện tính khử.", "options": ["A. $N_2 + O_2 \\rightarrow 2NO$.", "B. $N_2 + 3H_2 \\rightleftharpoons 2NH_3$.", "C. $3Mg + N_2 \\rightarrow Mg_3N_2$.", "D. $N_2 + Ca \\rightarrow Ca_3N_2$."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho 0,15 mol $Mg$ cháy hoàn toàn trong khí $N_2$ dư. Khối lượng $Mg_3N_2$ thu được là", "answer": "A", "explain": "$n_{Mg_3N_2} = 0{,}15/3 = 0{,}05\\,mol$; $m = 0{,}05 \\times 100 = 5$ gam.", "options": ["A. $5$ gam.", "B. $10$ gam.", "C. $2{,}5$ gam.", "D. $15$ gam."]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về nguyên tử nitrogen:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai — nitrogen là phi kim.", "statements": ["a) Nitrogen có số hiệu nguyên tử là 7.", "b) Nitrogen ở chu kì 2 trong bảng tuần hoàn.", "c) Nguyên tử N có 5 electron ở lớp ngoài cùng.", "d) Nitrogen là kim loại."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai — $N_2$ trơ, không tác dụng với acid ở nhiệt độ thường.", "statements": ["a) Tổng hợp $NH_3$: $N_2 + 3H_2 \\rightleftharpoons 2NH_3$ cần xúc tác, nhiệt độ và áp suất cao.", "b) $N_2 + O_2 \\rightarrow 2NO$ cần nhiệt độ rất cao.", "c) $3Mg + N_2 \\rightarrow Mg_3N_2$ cần đun nóng.", "d) $N_2$ tác dụng với dung dịch $HCl$ ở nhiệt độ thường."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Số oxi hoá của nitrogen trong $NO_2$ là bao nhiêu?", "answer": "+4", "explain": "$x + 2 \\times (-2) = 0$ nên $x = +4$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Có 0,3 mol $N_2$ và 0,9 mol $H_2$. Tiến hành tổng hợp $NH_3$ với hiệu suất 40%. Số mol $NH_3$ thu được là bao nhiêu?", "answer": "0,24", "explain": "Lí thuyết tạo $0{,}6\\,mol$ $NH_3$; hiệu suất 40% nên thực tế $0{,}24\\,mol$."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Mưa rào sau sấm sét cung cấp đạm cho đất là nhờ phản ứng", "answer": "A", "explain": "Sét cung cấp năng lượng để $N_2$ phản ứng với $O_2$ tạo $NO$, mở đầu chuỗi tạo đạm tự nhiên.", "options": ["A. $N_2 + O_2 \\rightarrow 2NO$ (tia lửa điện).", "B. $N_2 + 3H_2 \\rightarrow 2NH_3$.", "C. $3Mg + N_2 \\rightarrow Mg_3N_2$.", "D. $N_2 + H_2O \\rightarrow NH_3 + O_2$."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Tính chất nào sau đây khiến $N_2$ được dùng trong bảo quản thực phẩm?", "answer": "A", "explain": "$N_2$ trơ nên ngăn thực phẩm bị oxi hoá.", "options": ["A. Tính trơ ở nhiệt độ thường.", "B. Tính dễ cháy.", "C. Mùi thơm đặc trưng.", "D. Tính tan nhiều trong nước."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "So sánh tính oxi hoá của $N_2$ và $O_2$ ở nhiệt độ thường:", "answer": "A", "explain": "$O_2$ phản ứng với hầu hết kim loại ở nhiệt độ thường; $N_2$ thì trơ do liên kết ba bền.", "options": ["A. $O_2$ có tính oxi hoá mạnh hơn $N_2$ nhiều.", "B. $N_2$ có tính oxi hoá mạnh hơn $O_2$.", "C. Cả hai đều trơ như nhau.", "D. Cả hai đều không có tính oxi hoá."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phản ứng tổng hợp ammonia $N_2 + 3H_2 \\rightleftharpoons 2NH_3$ có đặc điểm", "answer": "A", "explain": "$\\Delta H \\lt 0$ (toả nhiệt); số mol khí giảm từ 4 còn 2; là phản ứng thuận nghịch.", "options": ["A. thuận nghịch, toả nhiệt, số mol khí giảm.", "B. một chiều, thu nhiệt.", "C. thuận nghịch, thu nhiệt, số mol khí tăng.", "D. một chiều, toả nhiệt."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cần bao nhiêu mol $N_2$ để điều chế 0,2 mol $NH_3$ (hiệu suất 100%)?", "answer": "A", "explain": "Tỉ lệ $1:2$ nên $n_{N_2} = 0{,}2/2 = 0{,}1\\,mol$.", "options": ["A. $0{,}1$ mol.", "B. $0{,}2$ mol.", "C. $0{,}3$ mol.", "D. $0{,}05$ mol."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cần bao nhiêu mol $N_2$ để điều chế 2 mol $NH_3$ nếu hiệu suất phản ứng là 80%?", "answer": "A", "explain": "Lí thuyết cần $1\\,mol$ $N_2$; hiệu suất 80% nên thực tế cần $1/0{,}8 = 1{,}25\\,mol$.", "options": ["A. $1{,}25$ mol.", "B. $1$ mol.", "C. $2$ mol.", "D. $0{,}8$ mol."]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng (oxi hoá $NH_3$). c) Đúng. d) Sai.", "statements": ["a) $NH_3$ được tổng hợp từ $N_2$ và $H_2$.", "b) $HNO_3$ được sản xuất từ $NH_3$.", "c) Phân đạm cung cấp nguyên tố nitrogen cho cây.", "d) $N_2$ là nguyên liệu để sản xuất $O_2$."]}, {"type": "truefalse", "level": "TH", "points": 1, (tia lửa điện).", "D. $3Mg + N_2 \\rightarrow Mg_3N_2$ ($t^o$)."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Vai trò của $N_2$ trong công nghiệp sản xuất phân đạm là", "answer": "A", "explain": "$NH_3$ (từ $N_2$ + $H_2$) là nguyên liệu chính sản xuất phân đạm.", "options": ["A. nguyên liệu để sản xuất $NH_3$.", "B. chất xúc tác.", "C. chất đốt.", "D. chất làm lạnh duy nhất."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho m gam $N_2$ tác dụng hoàn toàn với $H_2$ dư thu được 6,8 gam $NH_3$ (hiệu suất 100%). Giá trị của m là", "answer": "A", "explain": "$n_{NH_3} = 0{,}4\\,mol$; $n_{N_2} = 0{,}2\\,mol$; $m = 0{,}2 \\times 28 = 5{,}6$ gam.", "options": ["A. $5{,}6$ gam.", "B. $11{,}2$ gam.", "C. $2{,}8$ gam.", "D. $6{,}8$ gam."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Có 3 bình khí riêng biệt: $N_2$, $O_2$, $CO_2$. Thuốc thử để phân biệt 3 khí trên là", "answer": "A", "explain": "Que đóm: $O_2$ làm bùng cháy, $N_2$ và $CO_2$ làm tắt. $Ca(OH)_2$: $CO_2$ làm vẩn đục, $N_2$ không hiện tượng.", "options": ["A. que đóm đang cháy và dung dịch $Ca(OH)_2$.", "B. dung dịch $HCl$.", "C. dung dịch $NaOH$.", "D. giấy quỳ tím ẩm."]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai — mùi khai là của $NH_3$.", "statements": ["a) $N_2$ là chất khí không màu.", "b) $N_2$ không mùi, không vị.", "c) $N_2$ ít tan trong nước.", "d) $N_2$ có mùi khai đặc trưng."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai — trơ ở nhiệt độ thường.", "statements": ["a) $N_2$ khá trơ ở nhiệt độ thường.", "b) $N_2$ phản ứng với $H_2$ khi có xúc tác và đun nóng.", "c) $N_2$ phản ứng với $O_2$ khi có tia lửa điện.", "d) $N_2$ là chất oxi hoá mạnh ở nhiệt độ thường."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tỉ khối của $N_2$ so với không khí xấp xỉ bao nhiêu? (làm tròn 2 chữ số)", "answer": "0,97", "explain": "$d = 28/29 \\approx 0{,}97$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Khối lượng $NH_4NO_2$ cần dùng để thu được 12,395 lít $N_2$ (đkc, hiệu suất 100%) là bao nhiêu gam?", "answer": "32", "explain": "$n_{N_2} = 12{,}395/24{,}79 = 0{,}5\\,mol$; $m = 0{,}5 \\times 64 = 32$ gam."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Công thức hoá học của magnesium nitride là", "answer": "A", "explain": "$3Mg + N_2 \\xrightarrow{t^o} Mg_3N_2$.", "options": ["A. $Mg_3N_2$.", "B. $MgN$.", "C. $Mg(NO_3)_2$.", "D. $MgO$."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Sản phẩm của phản ứng $N_2 + O_2$ (tia lửa điện) là", "answer": "A", "explain": "$N_2 + O_2 \\rightarrow 2NO$ ở nhiệt độ rất cao.", "options": ["A. $NO$.", "B. $NO_2$.", "C. $N_2O$.", "D. $HNO_3$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nhận xét đúng về tính chất hoá học của $N_2$ là", "answer": "A", "explain": "$N_2$ oxi hoá $H_2$, kim loại (N: $0 \\to -3$); khử $O_2$ (N: $0 \\to +2$).", "options": ["A. vừa có tính oxi hoá, vừa có tính khử.", "B. chỉ có tính oxi hoá.", "C. chỉ có tính khử.", "D. không có tính oxi hoá, khử."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Để $N_2$ phản ứng được với $H_2$ cần điều kiện", "answer": "A", "explain": "Tổng hợp $NH_3$: xúc tác (Fe), khoảng $450^oC$, áp suất cao.", "options": ["A. xúc tác, nhiệt độ cao, áp suất cao.", "B. nhiệt độ thường.", "C. chỉ cần trộn hai khí.", "D. ánh sáng mặt trời."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Số oxi hoá của nitrogen trong $N_2O$, $NO$, $NO_2$ lần lượt là", "answer": "A", "explain": "$N_2O$: $2x - 2 = 0$ nên $x = +1$; $NO$: $x = +2$; $NO_2$: $x = +4$.", "options": ["A. $+1$, $+2$, $+4$.", "B. $-1$, $-2$, $-4$.", "C. $+2$, $+4$, $+1$.", "D. $0$, $+2$, $+4$."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "C ng. c) Đúng. d) Sai — $N_2$ không màu.", "statements": ["a) $NH_3$ có mùi khai đặc trưng.", "b) $N_2$ không mùi.", "c) $NO_2$ có màu nâu đỏ.", "d) $N_2$ có màu nâu đỏ."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Phân tử $N_2$ có bao nhiêu liên kết pi?", "answer": "2", "explain": "Liên kết ba $N \\equiv N$: 1σ + 2π."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Nhiệt phân 19,2 gam $NH_4NO_2$ với hiệu suất 75%. Thể tích $N_2$ thu được ở đkc là bao nhiêu lít? (làm tròn 2 chữ số)", "answer": "5,58", "explain": "$n = 19{,}2/64 = 0{,}3\\,mol$; thực tế $0{,}225\\,mol$; $V = 0{,}225 \\times 24{,}79 = 5{,}58$ lít."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nguyên tố nitrogen có nhiều trong", "answer": "A", "explain": "N là thành phần của protein (trong cơ thể) và chiếm 78% không khí.", "options": ["A. protein và không khí.", "B. đá vôi.", "C. nước biển (dạng $NaCl$).", "D. quặng sắt."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Đơn chất nitrogen được gọi là khí trơ tương đối vì", "answer": "A", "explain": "Liên kết ba bền khiến $N_2$ khó tham gia phản ứng ở nhiệt độ thường.", "options": ["A. liên kết ba $N \\equiv N$ rất bền.", "B. $N_2$ là chất lỏng.", "C. $N_2$ có màu sắc sặc sỡ.", "D. $N_2$ tan nhiều trong nước."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phát biểu nào sau đây SAI về đơn chất nitrogen?", "answer": "A", "explain": "A sai: $N_2$ không tác dụng với nước.", "options": ["A. $N_2$ tác dụng mãnh liệt với nước ở nhiệt độ thường.", "B. $N_2$ khá trơ ở nhiệt độ thường.", "C. $N_2$ có cả tính oxi hoá và tính khử.", "D. Phân tử $N_2$ có liên kết ba."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Ứng dụng nào sau đây KHÔNG phải của đơn chất nitrogen?", "answer": "A", "explain": "$N_2$ không cháy nên không thể làm chất đốt.", "options": ["A. Làm chất đốt trong động cơ.", "B. Bảo quản thực phẩm.", "C. Sản xuất $NH_3$.", "D. Bơm lốp xe."]}, {"type": "mcq", "level":
