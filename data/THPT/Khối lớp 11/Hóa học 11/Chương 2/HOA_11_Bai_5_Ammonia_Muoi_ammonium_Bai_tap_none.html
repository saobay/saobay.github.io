) Đúng. b) Đúng. c) Sai. d) Sai — $NH_3$ tan nhiều trong nước nên thu bằng cách đẩy không khí (úp ngược bình).", "statements": ["a) Phòng thí nghiệm: $2NH_4Cl + Ca(OH)_2 \\xrightarrow{t^o} CaCl_2 + 2NH_3 + 2H_2O$.", "b) Công nghiệp: $N_2 + 3H_2 \\rightleftharpoons 2NH_3$ (Fe, $450^oC$, áp suất cao).", "c) Có thể điều chế $NH_3$ bằng cách cho $N_2$ tác dụng với $O_2$.", "d) $NH_3$ được thu bằng cách đẩy nước."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về ứng dụng của $NH_3$:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.", "statements": ["a) $NH_3$ là nguyên liệu sản xuất $HNO_3$.", "b) $NH_3$ là nguyên liệu sản xuất phân đạm.", "c) $NH_3$ lỏng được dùng làm chất làm lạnh.", "d) $NH_3$ được dùng để sản xuất xà phòng."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Hoàn thành phương trình: $NH_3 + HCl \\rightarrow$ ? (viết công thức sản phẩm)", "answer": "NH4Cl", "explain": "$NH_3 + HCl \\rightarrow NH_4Cl$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cho 3,4 gam $NH_3$ tác dụng vừa đủ với dung dịch $H_2SO_4$. Khối lượng muối $(NH_4)_2SO_4$ thu được là bao nhiêu gam?", "answer": "13,2", "explain": "$n_{NH_3} = 0{,}2\\,mol$; $n_{(NH_4)_2SO_4} = 0{,}1\\,mol$; $m = 0{,}1 \\times 132 = 13{,}2$ gam."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Ion $NH_4^+$ có tên gọi là", "answer": "A", "explain": "$NH_4^+$: ion ammonium.", "options": ["A. ammonium.", "B. nitrate.", "C. nitride.", "D. amide."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Muối nào sau đây là muối ammonium?", "answer": "A", "explain": "Muối ammonium chứa $NH_4^+$.", "options": ["A. $NH_4NO_3$.", "B. $NaNO_3$.", "C. $K_2SO_4$.", "D. $CaCl_2$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi đun nóng dung dịch chứa $NH_4Cl$ và $NaOH$, khí thoát ra là", "answer": "A", "explain": "$NH_4^+ + OH^- \\xrightarrow{t^o} NH_3 + H_2O$.", "options": ["A. $NH_3$ (mùi khai).", "B. $HCl$.", "C. $Cl_2$.", "D. $H_2$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hiện tượng khi nhỏ dung dịch $NaOH$ vào dung dịch $NH_4Cl$ rồi đun nóng là", "answer": "A", "explain": "Phản ứng nhận biết $NH_4^+$.", "options": ["A. có khí mùi khai thoát ra làm xanh quỳ tím ẩm.", "B. có kết tủa trắng.", "C. dung dịch chuyển sang đỏ.", "D. không có hiện tượng gì."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho 10,7 gam $NH_4Cl$ tác dụng với dung dịch $NaOH$ dư, đun nóng. Thể tích $NH_3$ thu được ở đkc là", "answer": "A", "explain": "$n_{NH_3} = n_{NH_4Cl} = 0{,}2\\,mol$; $V = 4{,}958$ lít.", "options": ["A. $4{,}958$ lít.", "B. $2{,}479$ lít.", "C. $9{,}916$ lít.", "D. $24{,}79$ lít."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho m gam $(NH_4)_2SO_4$ tác dụng với $NaOH$ dư, đun nóng thu được 4,958 lít $NH_3$ (đkc). Giá trị của m là", "answer": "A", "explain": "$n_{NH_3} = 0{,}2\\,mol$; $n_{(NH_4)_2SO_4} = 0{,}1\\,mol$; $m = 13{,}2$ gam.", "options": ["A. $13{,}2$ gam.", "B. $26{,}4$ gam.", "C. $6{,}6$ gam.", "D. $19{,}8$ gam."]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai — không tồn tại. d) Đúng.", "statements": ["a) $NH_4NO_3$ là muối ammonium.", "b) $(NH_4)_2SO_4$ là muối ammonium.", "c) $NaNH_4$ là muối ammonium.", "d) $NH_4Cl$ là muối ammonium."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về tính chất của muối ammonium:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai — làm phân đạm.", "statements": ["a) Muối ammonium dễ tan trong nước.", "b) Muối ammonium bị nhiệt phân khi đun nóng.", "c) Muối ammonium tác dụng với base giải phóng $NH_3$.", "d) Muối ammonium không có ứng dụng gì."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Khí có mùi khai làm xanh quỳ tím ẩm, sinh ra khi đun nóng muối ammonium với base là khí gì? (viết công thức)", "answer": "NH3", "explain": "$NH_4^+ + OH^- \\xrightarrow{t^o} NH_3 + H_2O$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Nhiệt phân hoàn toàn 16 gam $NH_4NO_3$. Thể tích $N_2O$ thu được ở đkc là bao nhiêu lít?", "answer": "4,958", "explain": "$n = 0{,}2\\,mol$; $V = 0{,}2 \\times 24{,}79 = 4{,}958$ lít."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Phân tử $NH_3$ còn một cặp electron riêng trên nguyên tử N. Điều này giúp $NH_3$", "answer": "A", "explain": "Cặp e riêng nhận $H^+$ tạo $NH_4^+$ — tính base.", "options": ["A. nhận proton $H^+$ thể hiện tính base.", "B. nhường proton $H^+$.", "C. không tham gia phản ứng.", "D. có tính oxi hoá mạnh."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Dung dịch ammonia có tên gọi khác là", "answer": "A", "explain": "Dung dịch $NH_3$ trong nước gọi là nước ammonia.", "options": ["A. nước ammonia.", "B. nước Giaven.", "C. nước cường toan.", "D. nước cất."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "So sánh tính base của $NH_3$ và $NaOH$:", "answer": "A", "explain": "$NH_3$ điện li một phần (base yếu); $NaOH$ điện li hoàn toàn.", "options": ["A. $NH_3$ là base yếu, $NaOH$ là base mạnh.", "B. Cả hai đều là base mạnh.", "C. $NH_3$ là base mạnh hơn $NaOH$.", "D. $NH_3$ không có tính base."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho khí $NH_3$ đi qua $CuO$ nung nóng. Hiện tượng là", "answer": "A", "explain": "$2NH_3 + 3CuO \\to N_2 + 3Cu + 3H_2O$; $CuO$ đen thành $Cu$ đỏ.", "options": ["A. chất rắn từ đen chuyển sang đỏ (Cu).", "B. chất rắn không đổi màu.", "C. xuất hiện khói trắng.", "D. chất rắn tan hoàn toàn."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Trong phản ứng $2NH_3 + 3Cl_2 \\rightarrow N_2 + 6HCl$, $NH_3$ đóng vai trò", "answer": "A", "explain": "N: $-3 \\to 0$, số oxi hoá tăng nên $NH_3$ là chất khử.", "options": ["A. chất khử.", "B. chất oxi h
