b) $BaSO_4$ không tan trong $HCl$.", "c) $BaCO_3$ tan trong $HCl$.", "d) Không phân biệt được $SO_4^{2-}$ và $CO_3^{2-}$ bằng $BaCl_2$ + $HCl$."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Muối sulfate nào không tan trong nước và được dùng để nhận biết $SO_4^{2-}$? (viết công thức kết tủa)", "answer": "BaSO4", "explain": "Kết tủa trắng $BaSO_4$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cho 100 ml dung dịch $H_2SO_4$ 2M tác dụng hết với $BaCl_2$ dư. Khối lượng $BaSO_4$ thu được là bao nhiêu gam?", "answer": "46,6", "explain": "$n = 0{,}2\\,mol$; $m = 46{,}6$ gam."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong ắc quy chì, dung dịch điện li là", "answer": "A", "explain": "Ắc quy chì dùng $H_2SO_4$.", "options": ["A. $H_2SO_4$ loãng.", "B. $NaOH$.", "C. $HCl$.", "D. nước cất."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Phân đạm ammonium sulfate có công thức là", "answer": "A", "explain": "Đạm sulfate: $(NH_4)_2SO_4$.", "options": ["A. $(NH_4)_2SO_4$.", "B. $NH_4NO_3$.", "C. $K_2SO_4$.", "D. $CaSO_4$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Muối nào sau đây được dùng làm phân bón?", "answer": "A", "explain": "Phân đạm, phân kali.", "options": ["A. $(NH_4)_2SO_4$, $K_2SO_4$.", "B. $BaSO_4$.", "C. $PbSO_4$.", "D. $Ag_2SO_4$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phèn chua có công thức là", "answer": "A", "explain": "Phèn chua: $K_2SO_4.Al_2(SO_4)_3.24H_2O$.", "options": ["A. $K_2SO_4.Al_2(SO_4)_3.24H_2O$.", "B. $Na_2SO_4$.", "C. $CuSO_4.5H_2O$.", "D. $FeSO_4.7H_2O$."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho 13,2 gam $(NH_4)_2SO_4$ tác dụng với dung dịch $BaCl_2$ dư. Khối lượng kết tủa thu được là", "answer": "A", "explain": "$n = 0{,}1\\,mol$; $m_{BaSO_4} = 23{,}3$ gam.", "options": ["A. $23{,}3$ gam.", "B. $46{,}6$ gam.", "C. $11{,}65$ gam.", "D. $69{,}9$ gam."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hoà tan 23,3 gam $BaSO_4$ cần tối thiểu bao nhiêu ml dung dịch $HCl$ 1M? (Bẫy: $BaSO_4$ không tan trong acid)", "answer": "A", "explain": "$BaSO_4$ không tan trong acid nên không phản ứng.", "options": ["A. $0$ ml (không tan).", "B. $100$ ml.", "C. $200$ ml.", "D. $50$ ml."]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.", "statements": ["a) Ắc quy chì dùng $H_2SO_4$ loãng.", "b) $(NH_4)_2SO_4$ là phân đạm.", "c) Phèn chua chứa ion sulfate.", "d) $BaSO_4$ tan trong $HCl$."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết bài):", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.", "statements": ["a) $H_2SO_4$ đặc háo nước, oxi hoá mạnh.", "b) Pha loãng: rót acid vào nước.", "c) $BaSO_4$ trắng, không tan trong acid.", "d) Mọi muối sulfate đều tan."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Viết công thức của đạm sulfate (phân đạm).", "answer": "(NH4)2SO4", "explain": "$(NH_4)_2SO_4$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cho 6,6 gam $(NH_4)_2SO_4$ tác dụng với $Ba(OH)_2$ dư. Khối lượng $BaSO_4$ thu được là bao nhiêu gam?", "answer": "11,65", "explain": "$n = 0{,}05\\,mol$; $m = 11{,}65$ gam."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Số oxi hoá của S trong $SO_4^{2-}$ là", "answer": "A", "explain": "$x - 8 = -2$ nên $x = +6$.", "options": ["A. $+6$.", "B. $+4$.", "C. $-2$.", "D. $0$."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Số oxi hoá của S trong $HSO_4^-$ là", "answer": "A", "explain": "$1 + x - 8 = -1$ nên $x = +6$.", "options": ["A. $+6$.", "B. $+4$.", "C. $+5$.", "D. $-2$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dãy các chất đều chứa S với số oxi hoá $+6$ là", "answer": "A", "explain": "Cả ba đều có S(+6).", "options": ["A. $H_2SO_4$, $SO_4
