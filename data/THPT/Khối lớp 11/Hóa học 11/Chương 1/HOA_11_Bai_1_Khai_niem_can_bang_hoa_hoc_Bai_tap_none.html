ptions": ["A. $K_C = \\frac{[NH_3]}{[N_2][H_2]}$", "B. $K_C = \\frac{[NH_3]^2}{[N_2][H_2]^3}$", "C. $K_C = \\frac{[N_2][H_2]^3}{[NH_3]^2}$", "D. $K_C = \\frac{[N_2][H_2]}{[NH_3]}$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phản ứng $H_2 + I_2 \\rightleftharpoons 2HI$ có $K_C = 64$ ở $t^o$C. Tại cân bằng, $[H_2] = [I_2] = 0{,}1\\,M$. Nồng độ $HI$ tại cân bằng là", "answer": "A", "explain": "$K_C = \\frac{[HI]^2}{[H_2][I_2]} = 64$ nên $[HI]^2 = 64 \\times 0{,}1 \\times 0{,}1 = 0{,}64$, suy ra $[HI] = 0{,}8\\,M$.", "options": ["A. $0{,}8\\,M$", "B. $0{,}4\\,M$", "C. $6{,}4\\,M$", "D. $0{,}64\\,M$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về phản ứng thuận nghịch:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng — định nghĩa. b) Đúng — cùng điều kiện. c) Đúng — kí hiệu $\\rightleftharpoons$. d) Sai — có phản ứng một chiều (vd: đốt cháy).", "statements": ["a) Phản ứng thuận nghịch xảy ra đồng thời theo hai chiều ngược nhau.", "b) Hai chiều của phản ứng thuận nghịch xảy ra trong cùng điều kiện.", "c) Người ta dùng mũi tên hai chiều để biểu diễn phản ứng thuận nghịch.", "d) Mọi phản ứng hoá học đều là phản ứng thuận nghịch."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về hằng số cân bằng $K_C$ của phản ứng $aA + bB \\rightleftharpoons cC + dD$:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng — phải là nồng độ tại cân bằng. c) Sai — bỏ chất rắn/lỏng nguyên chất. d) Đúng — $K_C$ lớn nghĩa là nhiều sản phẩm.", "statements": ["a) $K_C = \\frac{[C]^c[D]^d}{[A]^a[B]^b}$.", "b) Các nồng độ trong biểu thức là nồng độ tại thời điểm cân bằng.", "c) Chất rắn nguyên chất vẫn được ghi vào biểu thức $K_C$.", "d) $K_C$ càng lớn thì cân bằng càng nghiêng về chiều thuận."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Cho phản ứng $2SO_2 + O_2 \\rightleftharpoons 2SO_3$. Tại cân bằng: $[SO_2] = 0{,}2\\,M$; $[O_2] = 0{,}1\\,M$; $[SO_3] = 0{,}4\\,M$. Tính $K_C$.", "answer": "40", "explain": "$K_C = \\frac{[SO_3]^2}{[SO_2]^2[O_2]} = \\frac{0{,}4^2}{0{,}2^2 \\times 0{,}1} = \\frac{0{,}16}{0{,}004} = 40$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cho phản ứng $CO + H_2O \\rightleftharpoons CO_2 + H_2$ có $K_C = 4$ ở $850^oC$. Trộn $1\\,mol$ $CO$ và $1\\,mol$ $H_2O$ trong bình kín dung tích $1\\,L$. Gọi $x$ là số mol $CO_2$ tạo thành khi đạt cân bằng. Tính $x$.", "answer": "2/3", "explain": "Tại cân bằng: $[CO]=[H_2O]=1-x$; $[CO_2]=[H_2]=x$. $K_C=\\frac{x^2}{(1-x)^2}=4$ nên $\\frac{x}{1-x}=2$, suy ra $x = 2 - 2x$, $3x = 2$, $x = \\frac{2}{3}$."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Phản ứng một chiều là phản ứng", "answer": "A", "explain": "Phản ứng một chiều chỉ xảy ra theo chiều tạo sản phẩm (vd: đốt cháy nhiên liệu, nhiệt phân $KClO_3$).", "options": ["A. xảy ra theo một chiều tạo ra sản phẩm, chất phản ứng chuyển hoá gần như hoàn toàn.", "B. xảy ra đồng thời theo hai chiều ngược nhau.", "C. có thể đảo ngược dễ dàng khi đổi điều kiện.", "D. luôn cần chất xúc tác."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong phản ứng thuận nghịch $N_2 + 3H_2 \\rightleftharpoons 2NH_3$, chiều nghịch là chiều", "answer": "B", "explain": "Chiều thuận (trái sang phải) tạo $NH_3$; chiều nghịch (phải sang trái) phân huỷ $NH_3$ thành $N_2$ và $H_2$.", "options": ["A. tạo ra $NH_3$ từ $N_2$ và $H_2$.", "B. phân huỷ $NH_3$ thành $N_2$ và $H_2$.", "C. tạo ra $H_2$ từ $N_2$.", "D. tổng hợp $N_2$ từ $NH_3$ và $H_2$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao cân bằng hoá học được gọi là cân bằng động?", "answer": "B", "explain": "Cân bằng động: phản ứng hai chiều vẫn xảy ra ($v_t = v_n$) nên ở cấp độ phân tử hệ không đứng yên, dù nồng độ vĩ mô không đổi.", "options": ["A. Vì nồng độ các chất liên tục thay đổi.", "B. Vì ở cấp độ phân tử, phản ứng thuận và nghịch vẫn tiếp diễn với tốc độ bằng nhau.", "C. Vì hệ luôn chuyển động cơ học.", "D. Vì nhiệt độ của hệ luôn thay đổi."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi một hệ phản ứng thuận nghịch đạt cân bằng hoá học, nhận định nào sau đây đúng?", "answer": "B", "explain": "Ở cân bằng, nồng độ các chất không đổi theo thời gian (nhưng không nhất thiết bằng nhau); phản ứng vẫn tiếp diễn.", "options": ["A. Nồng độ mọi chất trong hệ đều bằng nhau.", "B. Nồng độ các chất không thay đổi theo thời gian.", "C. Phản ứng thuận và nghịch đều dừng lại.", "D. Không còn chất phản ứng trong hệ."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho phản ứng $2NO_2 \\rightleftharpoons N_2O_4$. Biểu thức $K_C$ đúng là", "answer": "B", "explain": "$K_C = $ sản phẩm mũ hệ số chia chất phản ứng mũ hệ số $= \\frac{[N_2O_4]}{[NO_2]^2}$.", "options": ["A. $K_C = \\frac{[N_2O_4]}{[NO_2]}$", "B. $K_C = \\frac{[N_2O_4]}{[NO_2]^2}$", "C. $K_C = \\frac{[NO_2]^2}{[N_2O_4]}$", "D. $K_C = [N_2O_4][NO_2]^2$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phản ứng $A + B \\rightleftharpoons C + D$ có $K_C = 9$. Trộn $1\\,mol$ $A$ và $1\\,mol$ $B$ trong bình $1\\,L$. Khi cân bằng, số mol $C$ tạo thành là", "answer": "B", "explain": "Gọi $x$ là số mol $C$ (bằng số mol $D$) tại cân bằng; còn lại $1-x$ mol $A$, $B$. $K_C = \\frac{x^2}{(1-x)^2} = 9$ nên $\\frac{x}{1-x} = 3$, suy ra $x = 0{,}75\\,mol$.", "options": ["A. $0{,}5\\,mol$", "B. $0{,}75\\,mol$", "C. $0{,}9\\,mol$", "D. $1\\,mol$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về cân bằng hoá học:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng — định nghĩa. b) Đúng. c) Sai — là cân bằng động, phản ứng vẫn tiếp diễn. d) Đúng.", "statements": ["a) Cân bằng hoá học là trạng thái khi tốc độ phản ứng thuận bằng tốc độ phản ứng nghịch.", "b) Ở trạng thái cân bằng, nồng độ các chất không thay đổi theo thời gian.", "c) Cân bằng hoá học là cân bằng tĩnh, phản ứng đã dừng hẳn.", "d) Chỉ phản ứng thuận nghịch mới có trạng thái cân bằng hoá học."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho phản ứng $CaCO_3(s) \\rightleftharpoons CaO(s) + CO_2(g)$. Xét tính đúng, sai:", "answer": ["T", "F", "T", "T"], "explain": "a) Đúng — chỉ còn $[CO_2]$. b) Đúng — bỏ chất rắn nguyên chất. c) Sai — $K_C$ chỉ phụ thuộc nhiệt độ. d) Đúng — chất rắn không ảnh hưởng cân bằng.", "statements": ["a) Biểu thức $K_C = [CO_2]$.", "b) $CaCO_3$ và $CaO$ là chất rắn nên không ghi vào biểu thức $K_C$.", "c) $K_C$ của phản ứng này phụ thuộc vào lượng $CaCO_3$ ban đầu.", "d) Thêm $CaCO_3$ rắn vào hệ đang cân bằng không làm chuyển dịch cân bằng."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Phản ứng $PCl_5(g) \\rightleftharpoons PCl_3(g) + Cl_2(g)$ có $K_C = 0{,}5$. Tại cân bằng, $[PCl_5] = 0{,}4\\,M$ và $[PCl_3] = 0{,}2\\,M$. Tính $[Cl_2]$ tại cân bằng (đơn vị $M$).", "answer": "1", "explain": "$K_C = \\frac{[PCl_3][Cl_2]}{[PCl_5]} = 0{,}5$ nên $[Cl_2] = \\frac{0{,}5 \\times 0{,}4}{0{,}2} = 1\\,M$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phản ứng $2A \\rightleftharpoons B$ có $K_C = 0{,}5$. Ban đầu chỉ có $A$ với nồng độ $2\\,M$ trong bình kín. Khi cân bằng, nồng độ của $B$ là $x\\,M$. Tính $x$.", "answer": "0,5", "explain": "Gọi $x = [B]$ tại cân bằng thì $[A] = 2 - 2x$. $K_C = \\frac{[B]}{[A]^2} = \\frac{x}{(2-2x)^2} = 0{,}5$. Thử $x = 0{,}5$: mẫu số $(2-1)^2 = 1$, $\\frac{0{,}5}{1} = 0{,}5$ thoả mãn. Vậy $x = 0{,}5\\,M$."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Khi tăng nhiệt độ của hệ phản ứng thuận nghịch đang cân bằng, cân bằng chuyển dịch theo chiều", "answer": "B", "explain": "Tăng nhiệt độ, cân bằng chuyển dịch theo chiều thu nhiệt ($\\Delta H \\gt 0$) để chống lại tác động tăng nhiệt độ.", "options": ["A. toả nhiệt ($\\Delta H \\lt 0$).", "B. thu nhiệt ($\\Delta H \\gt 0$).", "C. thuận.", "D. nghịch."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Chất xúc tác ảnh hưởng thế nào đến cân bằng hoá học?", "answer": "C", "explain": "Xúc tác chỉ tăng tốc độ phản ứng (cả hai chiều như nhau) nên không làm chuyển dịch cân bằng và không đổi $K_C$.", "options": ["A. Làm cân bằng chuyển dịch theo chiều thuận.", "B. Làm cân bằng chuyển dịch theo chiều nghịch.", "C. Không làm chuyển dịch cân bằng, chỉ giúp đạt cân bằng nhanh hơn.", "D. Làm thay đổi hằng số cân bằng $K_C$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho phản ứng $N_2 + 3H_2 \\rightleftharpoons 2NH_3$; $\\Delta H \\lt 0$. Để thu được nhiều $NH_3$ hơn, cần", "answer": "B", "explain": "Chiều thuận toả nhiệt và giảm số mol khí (4 còn 2). Muốn nghiêng về chiều thuận: giảm nhiệt độ (chuyển dịch theo chiều toả nhiệt) và tăng áp suất (theo chiều giảm mol khí).", "options": ["A. tăng nhiệt độ, giảm áp suất.", "B. giảm nhiệt độ, tăng áp suất.", "C. tăng nhiệt độ, tăng áp suất.", "D. giảm nhiệt độ, giảm áp suất."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho phản ứng $2SO_2 + O_2 \\rightleftharpoons 2SO_3$. Khi tăng áp suất chung của hệ đang cân bằng, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Tăng áp suất, cân bằng chuyển dịch theo chiều giảm số mol khí: vế trái 3 mol khí, vế phải 2 mol khí nên chuyển dịch theo chiều thuận.", "options": ["A. thuận (số mol khí giảm từ 3 còn 2).", "B. nghịch (số mol khí tăng từ 2 lên 3).", "C. không chuyển dịch vì $\\Delta H \\lt 0$.", "D. không chuyển dịch vì có chất xúc tác."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho phản ứng $H_2 + Br_2 \\rightleftharpoons 2HBr$ có $K_C = 0{,}25$ ở $t^oC$. Nhận định nào đúng?", "answer": "B", "explain": "$K_C = 0{,}25 \\ll 1$ nên cân bằng nghiêng hẳn về chiều nghịch, hầu như không tạo sản phẩm $HBr$. $K_C$ chỉ phụ thuộc nhiệt độ.", "options": ["A. Tại cân bằng, lượng $HBr$ tạo ra rất nhiều.", "B. Tại cân bằng, phản ứng hầu như không tạo ra $HBr$.", "C. $K_C$ sẽ tăng nếu thêm chất xúc tác.", "D. $K_C$ sẽ tăng nếu tăng nồng độ $H_2$ ban đầu."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Xét phản ứng $2NO_2 \\rightleftharpoons N_2O_4$; $K_C = 4$. Tại một thời điểm, $[NO_2] = 0{,}5\\,M$ và $[N_2O_4] = 0{,}5\\,M$. Nhận định đúng là", "answer": "B", "explain": "Tính thương số $Q = \\frac{[N_2O_4]}{[NO_2]^2} = \\frac{0{,}5}{0{,}25} = 2 \\lt K_C = 4$ nên hệ chưa cân bằng và sẽ chuyển dịch theo chiều thuận để $Q$ tăng dần tới $K_C$.", "options": ["A. Hệ đang ở trạng thái cân bằng.", "B. Hệ chưa cân bằng, phản ứng sẽ chuyển dịch theo chiều thuận.", "C. Hệ chưa cân bằng, phản ứng sẽ chuyển dịch theo chiều nghịch.", "D. Không đủ dữ kiện để kết luận."]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Cho phản ứng $N_2 + 3H_2 \\rightleftharpoons 2NH_3$; $\\Delta H \\lt 0$ đang ở cân bằng. Xét tính đúng, sai:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng — tăng T chuyển dịch theo chiều thu nhiệt (nghịch). b) Đúng — tăng p theo chiều giảm mol khí (thuận: 4 còn 2). c) Đúng — tăng nồng độ chất phản ứng thì chuyển dịch theo chiều thuận. d) Sai — xúc tác không làm chuyển dịch cân bằng.", "statements": ["a) Tăng nhiệt độ làm cân bằng chuyển dịch theo chiều nghịch.", "b) Tăng áp suất làm cân bằng chuyển dịch theo chiều thuận.", "c) Thêm $N_2$ vào hệ làm cân bằng chuyển dịch theo chiều thuận.", "d) Thêm chất xúc tác làm cân bằng chuyển dịch theo chiều thuận."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về nguyên lí Le Chatelier:", "answer": ["T", "T", "F", "F"], "explain": "a) Đúng — nội dung nguyên lí. b) Đúng — hệ bù lại lượng sản phẩm bị lấy đi. c) Đúng — vd $H_2 + I_2 \\rightleftharpoons 2HI$. d) Sai — xúc tác không đổi $K_C$, không chuyển dịch cân bằng.", "statements": ["a) Khi hệ cân bằng chịu tác động bên ngoài, cân bằng chuyển dịch theo chiều chống lại tác động đó.", "b) Giảm nồng độ sản phẩm làm cân bằng chuyển dịch theo chiều tạo thêm sản phẩm (chiều thuận).", "c) Với phản ứng có tổng số mol khí hai vế bằng nhau, thay đổi áp suất không làm chuyển dịch cân bằng.", "d) Chất xúc tác làm tăng $K_C$ nên cân bằng chuyển dịch theo chiều thuận."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Cho phản ứng $CO_2 + H_2 \\rightleftharpoons CO + H_2O$ có $K_C = 1$. Tại cân bằng, $[CO_2] = [H_2] = [CO] = 0{,}4\\,M$. Tính $[H_2O]$ tại cân bằng (đơn vị $M$).", "answer": "0,4", "explain": "$K_C = \\frac{[CO][H_2O]}{[CO_2][H_2]} = 1$ nên $[H_2O] = \\frac{1 \\times 0{,}4 \\times 0{,}4}{0{,}4} = 0{,}4\\,M$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phản ứng $A \\rightleftharpoons 2B$ có $K_C = 4$. Ban đầu $[A] = 2\\,M$ (không có $B$). Khi cân bằng, $[B] = x\\,M$. Tính $x$.", "answer": "2", "explain": "Gọi $x = [B]$ tại cân bằng thì $[A] = 2 - x/2$. $K_C = \\frac{[B]^2}{[A]} = \\frac{x^2}{2 - x/2} = 4$. Thử $x = 2$: mẫu số $2 - 1 = 1$, $\\frac{4}{1} = 4$ thoả mãn. Vậy $x = 2\\,M$."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nguyên lí Le Chatelier phát biểu rằng", "answer": "B", "explain": "Đó chính là nội dung nguyên lí Le Chatelier: cân bằng chuyển dịch theo chiều chống lại tác động từ bên ngoài (nồng độ, áp suất, nhiệt độ).", "options": ["A. chất xúc tác luôn làm tăng hiệu suất phản ứng.", "B. khi hệ cân bằng chịu tác động bên ngoài, cân bằng chuyển dịch theo chiều chống lại tác động đó.", "C. tăng nhiệt độ luôn làm tăng $K_C$.", "D. mọi phản ứng đều đạt cân bằng sau cùng một thời gian."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Đại lượng nào đặc trưng cho mức độ chuyển hoá của phản ứng thuận nghịch tại một nhiệt độ xác định?", "answer": "B", "explain": "Hằng số cân bằng $K_C$ cho biết cân bằng nghiêng về chiều nào và mức độ tạo sản phẩm ($K_C$ lớn: nhiều sản phẩm).", "options": ["A. Tốc độ phản ứng.", "B. Hằng số cân bằng $K_C$.", "C. Nồng độ ban đầu.", "D. Áp suất khí quyển."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho phản ứng $2HI \\rightleftharpoons H_2 + I_2$ đang ở cân bằng. Nếu lấy bớt $H_2$ ra khỏi hệ, cân bằng sẽ", "answer": "B", "explain": "Giảm nồng độ sản phẩm ($H_2$), cân bằng chuyển dịch theo chiều bù lại lượng chất bị lấy đi, tức chiều thuận (tạo thêm $H_2$).", "options": ["A. chuyển dịch theo chiều nghịch.", "B. chuyển dịch theo chiều thuận (chiều tạo thêm $H_2$).", "C. không chuyển dịch.", "D. chuyển dịch theo chiều toả nhiệt."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phản ứng $CaCO_3(s) \\rightleftharpoons CaO(s) + CO_2(g)$; $\\Delta H \\gt 0$. Để tăng hiệu suất phân huỷ $CaCO_3$, cần", "answer": "A", "explain": "Chiều thuận thu nhiệt ($\\Delta H \\gt 0$) và tăng số mol khí (0 lên 1). Muốn nghiêng về chiều thuận: tăng nhiệt độ (theo chiều thu nhiệt) và giảm áp suất (theo chiều tăng mol khí).", "options": ["A. tăng nhiệt độ và giảm áp suất $CO_2$.", "B. giảm nhiệt độ và tăng áp suất $CO_2$.", "C. tăng nhiệt độ và tăng áp suất $CO_2$.", "D. thêm chất xúc tác."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho phản ứng $A(g) + B(g) \\rightleftharpoons 2C(g)$ có $K_C = 16$. Biểu thức nào đúng?", "answer": "B", "explain": "$K_C = $ tích nồng độ sản phẩm mũ hệ số chia tích nồng độ chất phản ứng mũ hệ số $= \\frac{[C]^2}{[A][B]}$.", "options": ["A. $K_C = \\frac{[A][B]}{[C]^2}$", "B. $K_C = \\frac{[C]^2}{[A][B]}$", "C. $K_C = \\frac{[C]}{[A][B]}$", "D. $K_C = [A][B][C]^2$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hai phản ứng: (1) $H_2 + I_2 \\rightleftharpoons 2HI$, $K_{C1} = 64$; (2) $2HI \\rightleftharpoons H_2 + I_2$, $K_{C2} = ?$ ở cùng nhiệt độ. Giá trị $K_{C2}$ là", "answer": "C", "explain": "Phản ứng (2) là phản ứng nghịch của (1) nên $K_{C2} = \\frac{1}{K_{C1}} = \\frac{1}{64}$ (cùng nhiệt độ).", "options": ["A. $64$", "B. $8$", "C. $\\frac{1}{64}$", "D. $-64$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về sự chuyển dịch cân bằng:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng — giảm p theo chiều tăng mol khí. c) Sai — nhiệt độ ảnh hưởng mạnh tới cân bằng. d) Đúng — hệ bù lại chất bị lấy đi.", "statements": ["a) Tăng nồng độ chất phản ứng làm cân bằng chuyển dịch theo chiều thuận.", "b) Giảm áp suất làm cân bằng chuyển dịch theo chiều tăng số mol khí.", "c) Thay đổi nhiệt độ không ảnh hưởng tới cân bằng hoá học.", "d) Lấy bớt sản phẩm ra khỏi hệ làm cân bằng chuyển dịch theo chiều tạo thêm sản phẩm."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho phản ứng $2SO_2 + O_2 \\rightleftharpoons 2SO_3$; $\\Delta H \\lt 0$ đang cân bằng. Xét tính đúng, sai:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng — tăng T theo chiều thu nhiệt (nghịch). b) Đúng — tăng p theo chiều giảm mol khí (3 còn 2, chiều thuận). c) Đúng — tăng nồng độ chất phản ứng. d) Sai — xúc tác không chuyển dịch cân bằng.", "statements": ["a) Tăng nhiệt độ làm cân bằng chuyển dịch theo chiều nghịch.", "b) Tăng áp suất làm cân bằng chuyển dịch theo chiều thuận.", "c) Thêm $O_2$ vào hệ làm cân bằng chuyển dịch theo chiều thuận.", "d) Dùng chất xúc tác $V_2O_5$ làm cân bằng chuyển dịch theo chiều thuận."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Phản ứng $N_2O_4 \\rightleftharpoons 2NO_2$ có $K_C = 0{,}36$. Tại cân bằng $[N_2O_4] = 0{,}25\\,M$. Tính $[NO_2]$ tại cân bằng (đơn vị $M$).", "answer": "0,3", "explain": "$K_C = \\frac{[NO_2]^2}{[N_2O_4]} = 0{,}36$ nên $[NO_2]^2 = 0{,}36 \\times 0{,}25 = 0{,}09$, suy ra $[NO_2] = 0{,}3\\,M$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phản ứng $2NO_2 \\rightleftharpoons N_2O_4$ có $K_C = 1$. Ban đầu $[NO_2] = 1\\,M$ (không có $N_2O_4$). Gọi $x$ là nồng độ $N_2O_4$ tại cân bằng (đơn vị $M$). Tính $x$.", "answer": "0,25", "explain": "Gọi $x = [N_2O_4]$ tại cân bằng thì $[NO_2] = 1 - 2x$. $K_C = \\frac{[N_2O_4]}{[NO_2]^2} = \\frac{x}{(1-2x)^2} = 1$. Thử $x = 0{,}25$: mẫu số $(1 - 0{,}5)^2 = 0{,}25$; $\\frac{0{,}25}{0{,}25} = 1$ thoả mãn. Vậy $x = 0{,}25\\,M$."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hằng số cân bằng $K_C$ được tính theo", "answer": "A", "explain": "$K_C$ dùng nồng độ (mol/L) của các chất tại thời điểm cân bằng.", "options": ["A. nồng độ các chất tại thời điểm cân bằng.", "B. nồng độ ban đầu của các chất.", "C. khối lượng các chất.", "D. thể tích bình phản ứng."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Hằng số cân bằng $K_P$ được tính theo", "answer": "A", "explain": "Với phản ứng có chất khí, $K_P$ tính theo áp suất riêng phần tại cân bằng, cách viết tương tự $K_C$.", "options": ["A. áp suất riêng phần của các chất khí tại cân bằng.", "B. nồng độ mol/L của các chất.", "C. tổng áp suất của hệ.", "D. nhiệt độ của hệ."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho phản ứng $4HCl + O_2 \\rightleftharpoons 2Cl_2 + 2H_2O$. Biểu thức $K_C$ đúng là", "answer": "A", "explain": "Tích nồng độ sản phẩm mũ hệ số chia tích nồng độ chất phản ứng mũ hệ số; $H_2O$ ở đây là hơi (khí) nên vẫn ghi vào biểu thức.", "options": ["A. $K_C = \\frac{[Cl_2]^2[H_2O]^2}{[HCl]^4[O_2]}$", "B. $K_C = \\frac{[HCl]^4[O_2]}{[Cl_2]^2[H_2O]^2}$", "C. $K_C = \\frac{[Cl_2][H_2O]}{[HCl]^4[O_2]}$", "D. $K_C = \\frac{[Cl_2]^2[H_2O]^2}{[HCl]^2[O_2]}$"]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một phản ứng thuận nghịch có $K_C$ rất lớn ($K_C \\gg 1$). Điều này chứng tỏ", "answer": "A", "explain": "$K_C$ lớn nghĩa là tại cân bằng nồng độ sản phẩm lớn hơn nhiều so với chất phản ứng.", "options": ["A. cân bằng nghiêng hẳn về chiều thuận, tạo nhiều sản phẩm.", "B. cân bằng nghiêng hẳn về chiều nghịch.", "C. phản ứng xảy ra rất nhanh.", "D. phản ứng cần chất xúc tác."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho phản ứng $C(s) + CO_2(g) \\rightleftharpoons 2CO(g)$. Biểu thức $K_C$ đúng là", "answer": "A", "explain": "Bỏ chất rắn $C$ nguyên chất khỏi biểu thức: $K_C = \\frac{[CO]^2}{[CO_2]}$.", "options": ["A. $K_C = \\frac{[CO]^2}{[CO_2]}$", "B. $K_C = \\frac{[CO_2]}{[CO]^2}$", "C. $K_C = \\frac{[C][CO_2]}{[CO]^2}$", "D. $K_C = [CO]^2[CO_2]$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phản ứng $N_2 + 3H_2 \\rightleftharpoons 2NH_3$ có $K_C = 0{,}59$. Tại một thời điểm: $[N_2] = 0{,}5\\,M$; $[H_2] = 1{,}5\\,M$; $[NH_3] = 2\\,M$. Hệ sẽ", "answer": "A", "explain": "$Q = \\frac{2^2}{0{,}5 \\times 1{,}5^3} = \\frac{4}{1{,}6875} \\approx 2{,}37 \\gt K_C = 0{,}59$ nên hệ chuyển dịch theo chiều nghịch để $Q$ giảm về $K_C$.", "options": ["A. chuyển dịch theo chiều nghịch.", "B. chuyển dịch theo chiều thuận.", "C. đang ở cân bằng.", "D. dừng phản ứng."]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai về hằng số cân bằng $K_C$:", "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo SGK Bài 1.", "statements": ["a) $K_C$ bằng tích nồng độ sản phẩm mũ hệ số chia tích nồng độ chất phản ứng mũ hệ số.", "b) Các nồng độ trong biểu thức là nồng độ tại thời điểm cân bằng.", "c) $K_C$ chỉ phụ thuộc vào nhiệt độ (và bản chất phản ứng).", "d) $K_C$ càng lớn thì lượng sản phẩm tại cân bằng càng nhiều."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Trong dung dịch: $2CrO_4^{2-} + 2H^+ \\rightleftharpoons Cr_2O_7^{2-} + H_2O$ (vàng $\\rightleftharpoons$ da cam). Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng — tăng $[H^+]$ thì chuyển dịch theo chiều thuận. c) Đúng — giảm $[H^+]$ thì chuyển dịch theo chiều nghịch. d) Đúng.", "statements": ["a) $K_C = \\frac{[Cr_2O_7^{2-}]}{[CrO_4^{2-}]^2[H^+]^2}$ (bỏ $H_2O$ lỏng).", "b) Thêm acid ($H^+$) làm cân bằng chuyển dịch theo chiều thuận, dung dịch chuyển sang da cam.", "c) Thêm base (làm giảm $H^+$) làm cân bằng chuyển dịch theo chiều nghịch, dung dịch chuyển sang vàng.", "d) $H_2O$ là chất lỏng nguyên chất nên không ghi vào biểu thức $K_C$."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Phản ứng $2NO_2 \\rightleftharpoons N_2O_4$ có $K_C = 4$. Tại cân bằng $[NO_2] = 0{,}25\\,M$. Tính $[N_2O_4]$ tại cân bằng (đơn vị $M$).", "answer": "0,25", "explain": "$[N_2O_4] = K_C \\times [NO_2]^2 = 4 \\times 0{,}0625 = 0{,}25\\,M$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phản ứng $2X \\rightleftharpoons Y + Z$ có $K_C = 1$. Tại cân bằng $[X] = 2\\,M$ và $[Y] = [Z]$. Tính $[Y]$ (đơn vị $M$).", "answer": "2", "explain": "$K_C = \\frac{[Y][Z]}{[X]^2} = \\frac{[Y]^2}{4} = 1$ nên $[Y]^2 = 4$, suy ra $[Y] = 2\\,M$."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Khi tăng nồng độ của chất phản ứng trong hệ đang cân bằng, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Tăng nồng độ chất phản ứng → cân bằng chuyển dịch theo chiều làm giảm chất đó, tức chiều thuận.", "options": ["A. thuận.", "B. nghịch.", "C. không chuyển dịch.", "D. thuận rồi nghịch."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Khi giảm áp suất chung của hệ khí đang cân bằng, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Giảm $p$ → chuyển dịch theo chiều tăng số mol khí (chống lại tác động giảm áp suất).", "options": ["A. làm tăng số mol khí.", "B. làm giảm số mol khí.", "C. toả nhiệt.", "D. thu nhiệt."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $2SO_2 + O_2 \\rightleftharpoons 2SO_3$; $\\Delta H \\lt 0$ đang cân bằng. Khi tăng nhiệt độ, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Tăng $T$ → chuyển dịch theo chiều thu nhiệt ($\\Delta H \\gt 0$), tức chiều nghịch.", "options": ["A. nghịch (chiều thu nhiệt).", "B. thuận (chiều toả nhiệt).", "C. không chuyển dịch.", "D. thuận rồi nghịch."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $N_2O_4$ (không màu) $\\rightleftharpoons 2NO_2$ (nâu đỏ); $\\Delta H \\gt 0$ đang cân bằng. Khi đun nóng bình phản ứng, màu của hỗn hợp sẽ", "answer": "A", "explain": "Tăng $T$ → chuyển dịch theo chiều thu nhiệt (thuận) → $[NO_2]$ tăng → màu nâu đỏ đậm dần.", "options": ["A. đậm dần (nhiều $NO_2$ hơn).", "B. nhạt dần.", "C. không đổi.", "D. chuyển sang xanh."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho $H_2 + I_2 \\rightleftharpoons 2HI$ đang ở cân bằng. Khi nén đẳng nhiệt hệ (tăng áp suất), cân bằng sẽ", "answer": "A", "explain": "Số mol khí hai vế bằng nhau (2 = 2) nên thay đổi áp suất không làm chuyển dịch cân bằng.", "options": ["A. không chuyển dịch (số mol khí hai vế bằng nhau).", "B. chuyển dịch theo chiều thuận.", "C. chuyển dịch theo chiều nghịch.", "D. chuyển dịch theo chiều toả nhiệt."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Để điều chế $NH_3$ từ $N_2 + 3H_2 \\rightleftharpoons 2NH_3$; $\\Delta H \\lt 0$ với hiệu suất cao, cần", "answer": "A", "explain": "Chiều thuận toả nhiệt và giảm mol khí: $T$ thấp (theo chiều toả nhiệt), $p$ cao (theo chiều giảm mol khí); lấy $NH_3$ ra liên tục để cân bằng chuyển dịch theo chiều thuận.", "options": ["A. nhiệt độ thấp, áp suất cao và lấy $NH_3$ ra liên tục.", "B. nhiệt độ cao, áp suất thấp.", "C. nhiệt độ cao, áp suất cao.", "D. chỉ cần thêm chất xúc tác."]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai về nguyên lí Le Chatelier:", "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo SGK.", "statements": ["a) Tăng nhiệt độ làm cân bằng chuyển dịch theo chiều thu nhiệt.", "b) Tăng áp suất làm cân bằng chuyển dịch theo chiều giảm số mol khí.", "c) Tăng nồng độ chất phản ứng làm cân bằng chuyển dịch theo chiều thuận.", "d) Chất xúc tác không làm chuyển dịch cân bằng."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho $N_2 + 3H_2 \\rightleftharpoons 2NH_3$; $\\Delta H \\lt 0$ đang cân bằng. Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng — giảm nồng độ sản phẩm thì chuyển dịch theo chiều tạo thêm sản phẩm.", "statements": ["a) Tăng nhiệt độ làm cân bằng chuyển dịch theo chiều nghịch.", "b) Tăng áp suất làm cân bằng chuyển dịch theo chiều thuận.", "c) Thêm $N_2$ làm cân bằng chuyển dịch theo chiều thuận.", "d) Rút bớt $NH_3$ ra làm cân bằng chuyển dịch theo chiều thuận."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Phản ứng $2NO_2 \\rightleftharpoons N_2O_4$ (2 mol khí $\\rightleftharpoons$ 1 mol khí). Khi tăng áp suất chung, cân bằng chuyển dịch theo chiều nào? (Trả lời: thuận/nghịch/không)", "answer": "thuận", "explain": "Tăng $p$ → chuyển dịch theo chiều giảm số mol khí, tức chiều thuận."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phản ứng $X + 2Y \\rightleftharpoons Z$ có $K_C = 2$. Tại một thời điểm: $[X] = 1\\,M$; $[Y] = 2\\,M$; $[Z] = 6\\,M$. Cân bằng sẽ chuyển dịch theo chiều nào? (Trả lời: thuận/nghịch)", "answer": "thuận", "explain": "$Q = \\frac{6}{1 \\times 2^2} = 1{,}5 \\lt K_C = 2$ nên hệ chuyển dịch theo chiều thuận."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Phản ứng nào sau đây là phản ứng thuận nghịch?", "answer": "A", "explain": "Chỉ phương án A dùng mũi tên hai chiều $\\rightleftharpoons$ (chlorine tác dụng với nước).", "options": ["A. $Cl_2 + H_2O \\rightleftharpoons HCl + HClO$", "B. $CH_4 + 2O_2 \\xrightarrow{t^o} CO_2 + 2H_2O$", "C. $2KClO_3 \\xrightarrow{t^o} 2KCl + 3O_2$", "D. $NaOH + HCl \\rightarrow NaCl + H_2O$"]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Ví dụ nào sau đây là phản ứng một chiều?", "answer": "A", "explain": "Đốt cháy nhiên liệu là phản ứng một chiều điển hình.", "options": ["A. Đốt cháy methane: $CH_4 + 2O_2 \\xrightarrow{t^o} CO_2 + 2H_2O$.", "B. $N_2 + 3H_2 \\rightleftharpoons 2NH_3$.", "C. $H_2 + I_2 \\rightleftharpoons 2HI$.", "D. $Cl_2 + H_2O \\rightleftharpoons HCl + HClO$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi hệ phản ứng thuận nghịch đạt cân bằng, phát biểu đúng là", "answer": "A", "explain": "Ở cân bằng, nồng độ các chất không đổi (nhưng không nhất thiết bằng nhau); phản ứng vẫn tiếp diễn.", "options": ["A. nồng độ các chất không thay đổi theo thời gian.", "B. nồng độ các chất đều bằng nhau.", "C. phản ứng đã dừng hẳn.", "D. chất phản ứng đã hết."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hằng số cân bằng $K_C$ không thay đổi khi", "answer": "A", "explain": "$K_C$ chỉ phụ thuộc nhiệt độ và bản chất phản ứng; xúc tác, nồng độ, áp suất không đổi $K_C$.", "options": ["A. thêm chất xúc tác vào hệ đang cân bằng.", "B. tăng nhiệt độ của hệ.", "C. tăng nồng độ chất phản ứng.", "D. tăng áp suất của hệ."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho $Fe^{3+} + SCN^- \\rightleftharpoons FeSCN^{2+}$ (không màu + không màu $\\rightleftharpoons$ đỏ như máu). Khi thêm dung dịch $Fe^{3+}$ vào hệ đang cân bằng, màu của dung dịch sẽ", "answer": "A", "explain": "Tăng $[Fe^{3+}]$ → cân bằng chuyển dịch theo chiều thuận → $[FeSCN^{2+}]$ tăng → màu đỏ đậm dần.", "options": ["A. đỏ đậm dần.", "B. nhạt dần.", "C. không đổi.", "D. chuyển sang xanh."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phản ứng $2A \\rightleftharpoons B + C$ có $K_C = 4$. Ban đầu $[A] = 4\\,M$ (không có B, C). Gọi $x$ là nồng độ của B tại cân bằng ($[B] = [C] = x$). Giá trị $x$ là", "answer": "A", "explain": "$[A] = 4 - 2x$; $\\frac{x^2}{(4-2x)^2} = 4$ nên $\\frac{x}{4-2x} = 2$, suy ra $x = 8 - 4x$, $5x = 8$, $x = 1{,}6\\,M$.", "options": ["A. $1{,}6\\,M$", "B. $2\\,M$", "C. $1\\,M$", "D. $3{,}2\\,M$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về phản ứng một chiều và thuận nghịch:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai — có phản ứng một chiều.", "statements": ["a) Đốt cháy nhiên liệu là phản ứng một chiều.", "b) $Cl_2 + H_2O \\rightleftharpoons HCl + HClO$ là phản ứng thuận nghịch.", "c) Mũi tên hai chiều $\\rightleftharpoons$ biểu diễn phản ứng thuận nghịch.", "d) Mọi phản ứng hoá học đều là phản ứng thuận nghịch."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho $Fe^{3+} + SCN^- \\rightleftharpoons FeSCN^{2+}$ (đỏ) đang cân bằng. Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng — $[FeSCN^{2+}]$ tăng. d) Đúng — tăng nồng độ sản phẩm.", "statements": ["a) Thêm $Fe^{3+}$ làm cân bằng chuyển dịch theo chiều thuận.", "b) Thêm $SCN^-$ làm cân bằng chuyển dịch theo chiều thuận.", "c) Màu đỏ đậm dần chứng tỏ cân bằng chuyển dịch theo chiều thuận.", "d) Thêm $FeSCN^{2+}$ làm cân bằng chuyển dịch theo chiều nghịch."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Phản ứng $Fe^{3+} + SCN^- \\rightleftharpoons FeSCN^{2+}$ có $K_C = 138$. Tại cân bằng $[Fe^{3+}] = [SCN^-] = 0{,}1\\,M$. Tính $[FeSCN^{2+}]$ (đơn vị $M$).", "answer": "1,38", "explain": "$[FeSCN^{2+}] = K_C \\times [Fe^{3+}][SCN^-] = 138 \\times 0{,}01 = 1{,}38\\,M$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phản ứng $H_2 + I_2 \\rightleftharpoons 2HI$ có $K_C = 64$. Tại cân bằng $[H_2] = [I_2] = 0{,}125\\,M$. Tính $[HI]$ (đơn vị $M$).", "answer": "1", "explain": "$[HI]^2 = 64 \\times 0{,}125 \\times 0{,}125 = 1$, suy ra $[HI] = 1\\,M$."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Cân bằng hoá học là trạng thái của phản ứng thuận nghịch khi", "answer": "A", "explain": "Định nghĩa SGK: $v_t = v_n$.", "options": ["A. tốc độ phản ứng thuận bằng tốc độ phản ứng nghịch.", "B. các chất ngừng phản ứng với nhau.", "C. nồng độ các chất bằng nhau.", "D. nhiệt độ của hệ không đổi."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Số mol khí của các chất ảnh hưởng tới sự chuyển dịch cân bằng khi thay đổi", "answer": "A", "explain": "Thay đổi áp suất làm cân bằng chuyển dịch theo chiều tăng/giảm số mol khí.", "options": ["A. áp suất chung của hệ.", "B. nhiệt độ của hệ.", "C. nồng độ của hệ.", "D. chất xúc tác."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $2A(k) + B(k) \\rightleftharpoons 2C(k)$; $\\Delta H \\gt 0$ đang cân bằng. Khi tăng nhiệt độ, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Tăng $T$ → chuyển dịch theo chiều thu nhiệt ($\\Delta H \\gt 0$), tức chiều thuận.", "options": ["A. thuận (chiều thu nhiệt).", "B. nghịch (chiều toả nhiệt).", "C. không chuyển dịch.", "D. thuận rồi nghịch."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hằng số cân bằng $K_C$ của một phản ứng tăng lên khi", "answer": "A", "explain": "$K_C$ chỉ phụ thuộc nhiệt độ: tăng $T$ làm cân bằng chuyển dịch theo chiều thu nhiệt nên $K_C$ tăng nếu chiều thuận thu nhiệt.", "options": ["A. tăng nhiệt độ, nếu chiều thuận là chiều thu nhiệt.", "B. thêm chất xúc tác.", "C. tăng nồng độ chất phản ứng.", "D. tăng áp suất của hệ."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Phản ứng $N_2O_4 \\rightleftharpoons 2NO_2$ có $K_C = 0{,}18$. Tại cân bằng $[NO_2] = 0{,}3\\,M$. Nồng độ $[N_2O_4]$ tại cân bằng là", "answer": "A", "explain": "$K_C = \\frac{[NO_2]^2}{[N_2O_4]} = 0{,}18$ nên $[N_2O_4] = \\frac{0{,}09}{0{,}18} = 0{,}5\\,M$.", "options": ["A. $0{,}5\\,M$", "B. $0{,}054\\,M$", "C. $0{,}06\\,M$", "D. $1{,}8\\,M$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phản ứng $A \\rightleftharpoons B + C$ có $K_C = 1$. Ban đầu $[A] = 2\\,M$ (không có B, C). Gọi $x$ là nồng độ của B tại cân bằng. Giá trị $x$ là", "answer": "A", "explain": "$[A] = 2 - x$; $\\frac{x^2}{2-x} = 1$ nên $x^2 + x - 2 = 0$, nghiệm dương $x = 1\\,M$.", "options": ["A. $1\\,M$", "B. $2\\,M$", "C. $0{,}5\\,M$", "D. $1{,}5\\,M$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về đặc điểm phản ứng hoá học:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.", "statements": ["a) Phản ứng thuận nghịch được biểu diễn bằng mũi tên hai chiều.", "b) Tại cân bằng, tốc độ phản ứng thuận bằng tốc độ phản ứng nghịch.", "c) $K_C$ chỉ phụ thuộc vào nhiệt độ.", "d) Chất xúc tác làm chuyển dịch cân bằng hoá học."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho $CO + H_2O \\rightleftharpoons CO_2 + H_2$; $\\Delta H \\lt 0$ (chiều thuận toả nhiệt) đang cân bằng. Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng — tăng $T$ theo chiều thu nhiệt. c) Đúng — 2 mol khí mỗi vế. d) Đúng.", "statements": ["a) $K_C = \\frac{[CO_2][H_2]}{[CO][H_2O]}$.", "b) Tăng nhiệt độ làm cân bằng chuyển dịch theo chiều nghịch.", "c) Tăng áp suất không làm chuyển dịch cân bằng (số mol khí hai vế bằng nhau).", "d) Thêm $CO$ làm cân bằng chuyển dịch theo chiều thuận."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Phản ứng $2HI \\rightleftharpoons H_2 + I_2$ có $K_C = 0{,}01$. Tại cân bằng $[HI] = 2\\,M$ và $[H_2] = [I_2] = x\\,M$. Tính $x$.", "answer": "0,2", "explain": "$\\frac{x^2}{2^2} = 0{,}01$ nên $x^2 = 0{,}04$, suy ra $x = 0{,}2\\,M$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phản ứng $X + 3Y \\rightleftharpoons 2Z$ có $K_C = 4$. Tại cân bằng $[X] = [Y] = 1\\,M$. Tính $[Z]$ (đơn vị $M$).", "answer": "2", "explain": "$K_C = \\frac{[Z]^2}{[X][Y]^3} = \\frac{[Z]^2}{1} = 4$ nên $[Z] = 2\\,M$."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Khi hệ chưa cân bằng và có $Q \\lt K_C$, hệ sẽ chuyển dịch theo chiều", "answer": "A", "explain": "$Q \\lt K_C$ nên phản ứng chuyển dịch theo chiều thuận để $Q$ tăng dần tới $K_C$.", "options": ["A. thuận.", "B. nghịch.", "C. không chuyển dịch.", "D. thuận rồi nghịch."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Các yếu tố có thể làm chuyển dịch cân bằng hoá học là", "answer": "A", "explain": "Ba yếu tố: nồng độ, áp suất (hệ khí), nhiệt độ. Chất xúc tác không làm chuyển dịch cân bằng.", "options": ["A. nồng độ, áp suất, nhiệt độ.", "B. nồng độ, áp suất, chất xúc tác.", "C. nhiệt độ, chất xúc tác, áp suất.", "D. chỉ có nhiệt độ."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $A + 2B \\rightleftharpoons C$ (các chất đều ở thể khí) đang cân bằng. Khi nén đẳng nhiệt hệ (giảm thể tích), cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Nén (tăng $p$) → chuyển dịch theo chiều giảm số mol khí: 3 mol còn 1 mol, tức chiều thuận.", "options": ["A. thuận (chiều giảm số mol khí).", "B. nghịch.", "C. không chuyển dịch.", "D. thuận rồi nghịch."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phản ứng thuận có $\\Delta H \\gt 0$ (thu nhiệt). Khi làm lạnh hệ đang cân bằng, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Giảm $T$ → chuyển dịch theo chiều toả nhiệt ($\\Delta H \\lt 0$), tức chiều nghịch.", "options": ["A. nghịch (chiều toả nhiệt).", "B. thuận (chiều thu nhiệt).", "C. không chuyển dịch.", "D. thuận rồi nghịch."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Phản ứng $2SO_2 + O_2 \\rightleftharpoons 2SO_3$ có $K_C = 40$. Tại cân bằng $[SO_2] = 0{,}1\\,M$; $[O_2] = 0{,}1\\,M$. Nồng độ $[SO_3]$ tại cân bằng là", "answer": "A", "explain": "$[SO_3]^2 = 40 \\times 0{,}1^2 \\times 0{,}1 = 0{,}04$, suy ra $[SO_3] = 0{,}2\\,M$.", "options": ["A. $0{,}2\\,M$", "B. $0{,}4\\,M$", "C. $2\\,M$", "D. $4\\,M$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phản ứng $2A \\rightleftharpoons B$ có $K_C = \\frac{1}{2}$. Ban đầu $[A] = 2\\,M$ (không có B). Nồng độ $[B]$ tại cân bằng là", "answer": "A", "explain": "Gọi $x = [B]$ thì $[A] = 2 - 2x$; $\\frac{x}{(2-2x)^2} = \\frac{1}{2}$; thử $x = 0{,}5$: mẫu $= 1$, $0{,}5/1 = 0{,}5$ thoả mãn.", "options": ["A. $0{,}5\\,M$", "B. $1\\,M$", "C. $2\\,M$", "D. $0{,}25\\,M$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về trạng thái cân bằng hoá học:", "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo SGK.", "statements": ["a) Tại cân bằng, tốc độ phản ứng thuận bằng tốc độ phản ứng nghịch.", "b) Nồng độ các chất tại cân bằng không đổi theo thời gian.", "c) Cân bằng hoá học là cân bằng động.", "d) Cân bằng hoá học chỉ tồn tại trong hệ kín."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho $N_2 + 3H_2 \\rightleftharpoons 2NH_3$ đang cân bằng. Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo SGK.", "statements": ["a) $K_C = \\frac{[NH_3]^2}{[N_2][H_2]^3}$.", "b) Chiều thuận toả nhiệt ($\\Delta H \\lt 0$) nên tăng nhiệt độ làm cân bằng chuyển dịch theo chiều nghịch.", "c) Tăng áp suất làm cân bằng chuyển dịch theo chiều thuận.", "d) Chất xúc tác sắt không làm chuyển dịch cân bằng."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Phản ứng $H_2 + Br_2 \\rightleftharpoons 2HBr$ có $K_C = 0{,}25$. Tại cân bằng $[H_2] = [Br_2] = 0{,}4\\,M$. Tính $[HBr]$ (đơn vị $M$).", "answer": "0,2", "explain": "$[HBr]^2 = 0{,}25 \\times 0{,}4 \\times 0{,}4 = 0{,}04$, suy ra $[HBr] = 0{,}2\\,M$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phản ứng $A + 2B \\rightleftharpoons 2C$ có $K_C = 4$. Tại cân bằng $[A] = 1\\,M$; $[B] = 2\\,M$. Tính $[C]$ (đơn vị $M$).", "answer": "4", "explain": "$[C]^2 = K_C \\times [A][B]^2 = 4 \\times 1 \\times 4 = 16$, suy ra $[C] = 4\\,M$."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Phản ứng thuận nghịch đạt trạng thái cân bằng hoá học khi", "answer": "A", "explain": "Định nghĩa: $v_t = v_n$.", "options": ["A. tốc độ phản ứng thuận bằng tốc độ phản ứng nghịch.", "B. các chất ngừng phản ứng.", "C. nồng độ các chất bằng nhau.", "D. phản ứng toả nhiệt."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Yếu tố nào sau đây không ảnh hưởng tới hằng số cân bằng $K_C$?", "answer": "A", "explain": "$K_C$ chỉ phụ thuộc nhiệt độ và bản chất phản ứng.", "options": ["A. Chất xúc tác.", "B. Nhiệt độ.", "C. Bản chất của phản ứng.", "D. Không có đáp án nào."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $2NO(k) + O_2(k) \\rightleftharpoons 2NO_2(k)$ đang cân bằng. Khi tăng áp suất chung, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Tăng $p$ → chiều giảm số mol khí.", "options": ["A. thuận (3 mol khí còn 2 mol).", "B. nghịch.", "C. không chuyển dịch.", "D. thuận rồi nghịch."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $X + Y \\rightleftharpoons Z$; $\\Delta H \\lt 0$ (chiều thuận toả nhiệt). Muốn cân bằng chuyển dịch theo chiều nghịch, cần", "answer": "A", "explain": "Tăng $T$ → chuyển dịch theo chiều thu nhiệt, tức chiều nghịch.", "options": ["A. tăng nhiệt độ.", "B. giảm nhiệt độ.", "C. tăng áp suất.", "D. thêm chất xúc tác."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Phản ứng $C(r) + CO_2(k) \\rightleftharpoons 2CO(k)$ có $K_C = 2$. Tại cân bằng $[CO_2] = 0{,}5\\,M$. Nồng độ $[CO]$ tại cân bằng là", "answer": "A", "explain": "$[CO]^2 = K_C \\times [CO_2] = 2 \\times 0{,}5 = 1$, suy ra $[CO] = 1\\,M$.", "options": ["A. $1\\,M$", "B. $0{,}5\\,M$", "C. $2\\,M$", "D. $4\\,M$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phản ứng $X + Y \\rightleftharpoons Z$ có $K_C = 1$. Trộn $[X]_0 = [Y]_0 = 2\\,M$ (không có Z). Nồng độ $[Z]$ tại cân bằng là", "answer": "A", "explain": "Gọi $x = [Z]$ thì $[X] = [Y] = 2 - x$; $\\frac{x}{(2-x)^2} = 1$ nên $x = x^2 - 4x + 4$, hay $(x-1)(x-4) = 0$; $x = 1\\,M$ (loại $x = 4$).", "options": ["A. $1\\,M$", "B. $2\\,M$", "C. $0{,}5\\,M$", "D. $4\\,M$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về hằng số cân bằng:", "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo SGK.", "statements": ["a) $K_C$ càng lớn, cân bằng càng nghiêng về chiều thuận.", "b) $K_C$ càng nhỏ, cân bằng càng nghiêng về chiều nghịch.", "c) $K_C$ chỉ phụ thuộc vào nhiệt độ.", "d) $K_P$ là hằng số cân bằng tính theo áp suất riêng phần của chất khí."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về yếu tố ảnh hưởng tới cân bằng:", "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo SGK và nguyên lí Le Chatelier.", "statements": ["a) Tăng nhiệt độ làm cân bằng chuyển dịch theo chiều thu nhiệt.", "b) Giảm áp suất (hệ khí) làm cân bằng chuyển dịch theo chiều tăng số mol khí.", "c) Giảm nồng độ sản phẩm làm cân bằng chuyển dịch theo chiều thuận.", "d) Thêm chất rắn nguyên chất vào hệ đang cân bằng không làm chuyển dịch cân bằng."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Phản ứng $N_2 + 3H_2 \\rightleftharpoons 2NH_3$ có $K_C = 2$. Tại cân bằng $[N_2] = 2\\,M$; $[H_2] = 1\\,M$. Tính $[NH_3]$ (đơn vị $M$).", "answer": "2", "explain": "$[NH_3]^2 = K_C \\times [N_2][H_2]^3 = 2 \\times 2 \\times 1 = 4$, suy ra $[NH_3] = 2\\,M$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phản ứng $2A + B \\rightleftharpoons C$ có $K_C = 8$. Tại cân bằng $[A] = [B] = 0{,}5\\,M$. Tính $[C]$ (đơn vị $M$).", "answer": "1", "explain": "$[C] = K_C \\times [A]^2[B] = 8 \\times 0{,}25 \\times 0{,}5 = 1\\,M$."}]}]}
