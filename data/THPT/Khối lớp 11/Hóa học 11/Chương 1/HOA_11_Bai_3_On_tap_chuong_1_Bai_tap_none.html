: "Cho $CaCO_3(s) \\rightleftharpoons CaO(s) + CO_2(g)$. Biểu thức $K_C$ đúng là", "answer": "A", "explain": "Bỏ chất rắn nguyên chất ($CaCO_3$, $CaO$) khỏi biểu thức.", "options": ["A. $K_C = [CO_2]$", "B. $K_C = \\frac{[CaO][CO_2]}{[CaCO_3]}$", "C. $K_C = [CaO][CO_2]$", "D. $K_C = \\frac{[CO_2]}{[CaCO_3]}$"]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch $CH_3COONa$ có môi trường", "answer": "A", "explain": "Muối của acid yếu và base mạnh: ion $CH_3COO^-$ thuỷ phân tạo $OH^-$.", "options": ["A. base ($pH \\gt 7$).", "B. acid ($pH \\lt 7$).", "C. trung tính ($pH = 7$).", "D. không xác định."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho $H_2 + I_2 \\rightleftharpoons 2HI$ ($K_C = 64$). $Q = \\frac{[HI]^2}{[H_2][I_2]} = 16 \\lt K_C$. Hệ sẽ", "answer": "A", "explain": "$Q \\lt K_C$ nên phản ứng chuyển dịch theo chiều thuận để $Q$ tăng tới $K_C$.", "options": ["A. chuyển dịch theo chiều thuận.", "B. chuyển dịch theo chiều nghịch.", "C. đã ở cân bằng.", "D. dừng phản ứng."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Pha loãng $10\\,mL$ $NaOH$ $pH = 12$ thành $1\\,L$. pH mới là", "answer": "A", "explain": "Pha loãng $100$ lần: $[OH^-]$ từ $10^{-2}$ còn $10^{-4}$, $pOH = 4$, $pH = 10$.", "options": ["A. $10$", "B. $11$", "C. $9$", "D. $12$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về kiến thức chung chương 1:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai — chỉ phụ thuộc nhiệt độ.", "statements": ["a) $K_w = [H^+][OH^-]$.", "b) Ở $25^oC$, $K_w = 10^{-14}$.", "c) Mọi dung dịch nước đều có cả $H^+$ và $OH^-$.", "d) $K_w$ phụ thuộc nồng độ ban đầu."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Chuẩn độ $20\\,mL$ $NaOH$ bằng $HCl$ $0{,}1\\,M$ hết $16\\,mL$. Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng ($0{,}1 \\times 16/20$). d) Đúng — cả hai đều đổi màu gần điểm tương đương.", "statements": ["a) $HCl$ là dung dịch chuẩn.", "b) Điểm tương đương có $pH = 7$.", "c) $C_{NaOH} = 0{,}08\\,M$.", "d) Có thể thay phenolphtalein bằng methyl da cam."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "$K_C$ của phản ứng $N_2 + 3H_2 \\rightleftharpoons 2NH_3$ ở $t^oC$ là $0{,}5$. Tại cân bằng $[N_2] = 1\\,M$, $[H_2] = 1\\,M$. Tính $[NH_3]$ (đơn vị $M$).", "answer": "0,71", "explain": "$K_C = \\frac{[NH_3]^2}{1 \\times 1} = 0{,}5$ nên $[NH_3] = \\sqrt{0{,}5} \\approx 0{,}71\\,M$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cần bao nhiêu $mL$ $HCl$ $0{,}2\\,M$ để trung hoà vừa đủ $40\\,mL$ $NaOH$ $0{,}1\\,M$?", "answer": "20", "explain": "$0{,}2V = 0{,}1 \\times 40$, suy ra $V = 20\\,mL$."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Cân bằng hoá học có đặc điểm là", "answer": "A", "explain": "Cân bằng hoá học là cân bằng động ($v_t = v_n$), nồng độ các chất không đổi.", "options": ["A. cân bằng động: hai chiều vẫn tiếp diễn với tốc độ bằng nhau.", "B. cân bằng tĩnh: phản ứng đã dừng hẳn.", "C. chỉ xảy ra với chất khí.", "D. nồng độ các chất luôn bằng nhau."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Dung dịch $HCl$ $0{,}001\\,M$ có pH bằng", "answer": "A", "explain": "$[H^+] = 10^{-3}\\,M$ nên $pH = 3$.", "options": ["A. $3$", "B. $11$", "C. $7$", "D. $10$"]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $N_2 + 3H_2 \\rightleftharpoons 2NH_3$; $\\Delta H \\lt 0$. Để tăng hiệu suất tạo $NH_3$, cần", "answer": "A", "explain": "Chiều thuận toả nhiệt và giảm mol khí (4 còn 2): giảm $T$ (theo chiều toả nhiệt), tăng $p$ (theo chiều giảm mol khí). Xúc tác không chuyển dịch cân bằng.", "options": ["A. giảm nhiệt độ, tăng áp suất.", "B. tăng nhiệt độ, giảm áp suất.", "C. tăng nhiệt độ, tăng áp suất.", "D. thêm chất xúc tác."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch nào sau đây có $pH \\gt 7$ (ở $25^oC$)?", "answer": "A", "explain": "$NaOH$ là base: $[OH^-] = 10^{-2}$, $pOH = 2$, $pH = 12 \\gt 7$.", "options": ["A. $NaOH$ $0{,}01\\,M$.", "B. $HCl$ $0{,}01\\,M$.", "C. $NaCl$ $0{,}01\\,M$.", "D. Nước cất."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Phản ứng $2NO_2 \\rightleftharpoons N_2O_4$ có $K_C = 4$. Tại cân bằng $[NO_2] = 0{,}5\\,M$. Nồng độ $[N_2O_4]$ tại cân bằng là", "answer": "A", "explain": "$K_C = \\frac{[N_2O_4]}{[NO_2]^2} = 4$ nên $[N_2O_4] = 4 \\times 0{,}25 = 1\\,M$.", "options": ["A. $1\\,M$", "B. $0{,}25\\,M$", "C. $2\\,M$", "D. $4\\,M$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trộn $100\\,mL$ dung dịch $Ba(OH)_2$ $0{,}05\\,M$ với $100\\,mL$ dung dịch $HCl$ $0{,}1\\,M$. pH của dung dịch thu được là", "answer": "A", "explain": "$n_{OH^-} = 2 \\times 0{,}005 = 0{,}01\\,mol$; $n_{H^+} = 0{,}01\\,mol$; trung hoà vừa đủ nên $pH = 7$.", "options": ["A. $7$", "B. $12$", "C. $2$", "D. $13$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về phản ứng một chiều và nước:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.", "statements": ["a) Tại cân bằng, tốc độ phản ứng thuận bằng tốc độ phản ứng nghịch.", "b) $K_C$ chỉ phụ thuộc vào nhiệt độ.", "c) $pH = -\\log[H^+]$.", "d) Chất xúc tác làm chuyển dịch cân bằng hoá học."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho $H_2 + I_2 \\rightleftharpoons 2HI$; $\\Delta H \\lt 0$ (chiều thuận toả nhiệt) đang cân bằng. Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng — tăng nồng độ chất phản ứng. b) Đúng — 2 mol khí mỗi vế. c) Đúng — tăng $T$ theo chiều thu nhiệt. d) Đúng — tăng nồng độ sản phẩm.", "statements": ["a) Thêm $H_2$ vào hệ làm cân bằng chuyển dịch theo chiều thuận.", "b) Tăng áp suất không làm chuyển dịch cân bằng (số mol khí hai vế bằng nhau).", "c) Tăng nhiệt độ làm cân bằng chuyển dịch theo chiều nghịch.", "d) Thêm $HI$ vào hệ làm cân bằng chuyển dịch theo chiều nghịch."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dung dịch $Ca(OH)_2$ $0{,}005\\,M$ (điện li hoàn toàn) có $pH$ bằng bao nhiêu?", "answer": "12", "explain": "$[OH^-] = 2 \\times 0{,}005 = 0{,}01 = 10^{-2}\\,M$ nên $pOH = 2$, $pH = 12$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phản ứng $A \\rightleftharpoons 2B$ có $K_C = 4$. Ban đầu $[A] = 2\\,M$ (không có B). Khi cân bằng, $[B] = x\\,M$. Tính $x$.", "answer": "2", "explain": "$[A] = 2 - x/2$; $\\frac{x^2}{2 - x/2} = 4$; thử $x = 2$: mẫu $= 1$, $4/1 = 4$ thoả mãn."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nội dung nguyên lí Le Chatelier là", "answer": "B", "explain": "Nguyên lí Le Chatelier (SGK Bài 1).", "options": ["A. tăng nhiệt độ luôn làm tăng tốc độ phản ứng.", "B. khi hệ cân bằng chịu tác động bên ngoài, cân bằng chuyển dịch theo chiều chống lại tác động đó.", "C. chất xúc tác làm tăng $K_C$.", "D. mọi phản ứng đều một chiều."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Thang pH thường được dùng có khoảng giá trị", "answer": "A", "explain": "Thang pH thường dùng từ 0 đến 14 (ở $25^oC$).", "options": ["A. từ $0$ đến $14$.", "B. từ $0$ đến $7$.", "C. từ $7$ đến $14$.", "D. từ $0$ đến $100$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $CO + H_2O \\rightleftharpoons CO_2 + H_2$ đang ở cân bằng. Khi thêm $CO$ vào hệ, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Tăng nồng độ chất phản ứng ($CO$) → cân bằng chuyển dịch theo chiều thuận.", "options": ["A. thuận.", "B. nghịch.", "C. không chuyển dịch.", "D. thuận rồi nghịch."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch X có $[H^+] = 10^{-5}\\,M$ (ở $25^oC$). Nhận định đúng là", "answer": "A", "explain": "$pH = 5 \\lt 7$ nên môi trường acid.", "options": ["A. $pH = 5$, môi trường acid.", "B. $pH = 9$, môi trường base.", "C. $pH = 5$, môi trường base.", "D. môi trường trung tính."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho $2SO_2 + O_2 \\rightleftharpoons 2SO_3$; $\\Delta H \\lt 0$ đang cân bằng. Khi giảm nhiệt độ, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Giảm $T$ → chuyển dịch theo chiều toả nhiệt ($\\Delta H \\lt 0$), tức chiều thuận.", "options": ["A. thuận (chiều toả nhiệt).", "B. nghịch (chiều thu nhiệt).", "C. không chuyển dịch.", "D. thuận rồi dừng."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Chuẩn độ $20\\,mL$ dung dịch $H_2SO_4$ $0{,}1\\,M$ bằng dung dịch $NaOH$ $0{,}2\\,M$. Thể tích $NaOH$ cần dùng tới điểm tương đương là", "answer": "A", "explain": "$H_2SO_4 + 2NaOH \\rightarrow Na_2SO_4 + 2H_2O$; $n_{H_2SO_4} = 0{,}002\\,mol$ nên $n_{NaOH} = 0{,}004\\,mol$; $V = 0{,}004/0{,}2 = 0{,}02\\,L = 20\\,mL$.", "options": ["A. $20\\,mL$", "B. $10\\,mL$", "C. $40\\,mL$", "D. $5\\,mL$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về tích số ion của nước:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng — acid mạnh, base mạnh.", "statements": ["a) Phản ứng thuận nghịch được biểu diễn bằng mũi tên hai chiều.", "b) Ở $25^oC$, $K_w = 10^{-14}$.", "c) Dung dịch có $pH \\lt 7$ là môi trường acid.", "d) Điểm tương đương của chuẩn độ $HCl$ bằng $NaOH$ có $pH = 7$."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về trạng thái cân bằng:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng — tăng $T$ chuyển dịch theo chiều thu nhiệt (nghịch) nên $K_C$ giảm. b) Đúng. c) Sai — pha loãng acid làm pH tăng. d) Đúng.", "statements": ["a) Tăng nhiệt độ làm giảm $K_C$ của phản ứng có chiều thuận toả nhiệt.", "b) $K_C$ không đổi khi thêm chất xúc tác.", "c) Pha loãng dung dịch acid bằng nước làm pH giảm.", "d) Trộn acid mạnh và base mạnh vừa đủ được dung dịch $pH = 7$."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Hằng số cân bằng của phản ứng nghịch $2HI \\rightleftharpoons H_2 + I_2$ bằng nghịch đảo hằng số cân bằng của phản ứng thuận $H_2 + I_2 \\rightleftharpoons 2HI$. Biết $K_C$ (thuận) $= 64$. Tính $K_C$ (nghịch).", "answer": "1/64", "explain": "$K_{C(nghịch)} = \\frac{1}{K_{C(thuận)}} = \\frac{1}{64}$ (cùng nhiệt độ)."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cần $V\\,mL$ dung dịch $HCl$ $0{,}1\\,M$ để trung hoà vừa đủ $50\\,mL$ dung dịch $Ba(OH)_2$ $0{,}05\\,M$. Tính $V$.", "answer": "50", "explain": "$n_{OH^-} = 2 \\times 0{,}0025 = 0{,}005\\,mol = n_{HCl}$; $V = 0{,}005/0{,}1 = 0{,}05\\,L = 50\\,mL$."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tại trạng thái cân bằng hoá học, tốc độ phản ứng thuận và tốc độ phản ứng nghịch", "answer": "A", "explain": "$v_t = v_n$ — định nghĩa cân bằng hoá học.", "options": ["A. bằng nhau.", "B. thuận lớn hơn nghịch.", "C. nghịch lớn hơn thuận.", "D. đều bằng 0."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Dung dịch có $pOH = 3$ (ở $25^oC$) thì", "answer": "A", "explain": "$pH = 14 - 3 = 11 \\gt 7$: môi trường base.", "options": ["A. $pH = 11$, môi trường base.", "B. $pH = 3$, môi trường acid.", "C. $pH = 11$, môi trường acid.", "D. môi trường trung tính."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $2NO_2$ (nâu đỏ) $\\rightleftharpoons N_2O_4$ (không màu); $\\Delta H \\lt 0$ đang cân bằng. Khi làm lạnh bình phản ứng, màu của hỗn hợp sẽ", "answer": "A", "explain": "Làm lạnh (giảm $T$) → chuyển dịch theo chiều toả nhiệt (thuận) → $NO_2$ giảm → màu nhạt dần.", "options": ["A. nhạt dần.", "B. đậm dần.", "C. không đổi.", "D. chuyển sang xanh."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi chuẩn độ dung dịch $HCl$ bằng $NaOH$ mà cho dư $NaOH$ (vượt quá điểm tương đương), dung dịch trong bình có", "answer": "A", "explain": "Dư base $NaOH$ nên môi trường base, $pH \\gt 7$.", "options": ["A. $pH \\gt 7$.", "B. $pH = 7$.", "C. $pH \\lt 7$.", "D. $pH = 0$."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Dung dịch X có $pH = 3$, dung dịch Y có $pH = 5$ (cùng $25^oC$). Nồng độ $[H^+]$ của X gấp mấy lần của Y?", "answer": "A", "explain": "$[H^+]_X = 10^{-3}$, $[H^+]_Y = 10^{-5}$; tỉ số $= 100$.", "options": ["A. $100$ lần.", "B. $2$ lần.", "C. $10$ lần.", "D. $1000$ lần."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho $A + 2B \\rightleftharpoons C$ có $K_C = 8$. Tại cân bằng $[A] = 0{,}5\\,M$, $[B] = 1\\,M$. Nồng độ $[C]$ tại cân bằng là", "answer": "A", "explain": "$K_C = \\frac{[C]}{[A][B]^2} = 8$ nên $[C] = 8 \\times 0{,}5 \\times 1^2 = 4\\,M$.", "options": ["A. $4\\,M$", "B. $2\\,M$", "C. $8\\,M$", "D. $1\\,M$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về kí hiệu phản ứng:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng.", "statements": ["a) Cân bằng hoá học là cân bằng động.", "b) $K_C$ càng lớn, cân bằng càng nghiêng về chiều thuận.", "c) Nước là chất điện li rất yếu.", "d) Chuẩn độ cần dùng chất chỉ thị để nhận biết điểm tương đương."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai về ảnh hưởng của áp suất tới cân bằng (hệ khí):", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng — Le Chatelier. b) Đúng — 2 mol khí mỗi vế. c) Đúng — 4 còn 2. d) Đúng.", "statements": ["a) Tăng áp suất làm cân bằng chuyển dịch theo chiều giảm số mol khí.", "b) Với $H_2 + I_2 \\rightleftharpoons 2HI$, thay đổi áp suất không chuyển dịch cân bằng.", "c) Với $N_2 + 3H_2 \\rightleftharpoons 2NH_3$, tăng áp suất chuyển dịch theo chiều thuận.", "d) Giảm áp suất làm cân bằng chuyển dịch theo chiều tăng số mol khí."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dung dịch $HCl$ $0{,}05\\,M$ được pha loãng $5$ lần bằng nước cất. pH của dung dịch sau khi pha loãng là", "answer": "2", "explain": "Pha loãng $5$ lần: $[H^+]$ từ $0{,}05$ còn $0{,}01 = 10^{-2}\\,M$ nên $pH = 2$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Trộn $V_1\\,mL$ dung dịch $NaOH$ $0{,}2\\,M$ với $V_2\\,mL$ dung dịch $HCl$ $0{,}1\\,M$ ($V_1 + V_2 = 300\\,mL$) được dung dịch có $pH = 12$. Tính $V_1$.", "answer": "110", "explain": "$[OH^-]$ dư $= 10^{-2}\\,M$; $n$ dư $= 0{,}01 \\times 0{,}3 = 0{,}003\\,mol$. Mà $0{,}2V_1 - 0{,}1V_2 = 3$ (với $V$ tính bằng $mL$); thay $V_2 = 300 - V_1$: $0{,}3V_1 = 33$, suy ra $V_1 = 110\\,mL$."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Phản ứng một chiều là phản ứng", "answer": "A", "explain": "SGK Bài 1: phản ứng một chiều chỉ xảy ra theo chiều tạo sản phẩm.", "options": ["A. xảy ra theo một chiều tạo ra sản phẩm.", "B. xảy ra đồng thời theo hai chiều ngược nhau.", "C. luôn đạt trạng thái cân bằng.", "D. cần chất xúc tác mới xảy ra."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhỏ methyl da cam vào dung dịch $NaOH$, dung dịch có màu", "answer": "A", "explain": "Methyl da cam: vàng trong môi trường base, đỏ trong môi trường acid.", "options": ["A. vàng.", "B. đỏ.", "C. không màu.", "D. tím."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $CaCO_3(s) \\rightleftharpoons CaO(s) + CO_2(g)$; $\\Delta H \\gt 0$. Khi nung nóng hệ đang cân bằng, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Tăng $T$ → chuyển dịch theo chiều thu nhiệt ($\\Delta H \\gt 0$), tức chiều thuận.", "options": ["A. thuận (phân huỷ $CaCO_3$).", "B. nghịch (tạo $CaCO_3$).", "C. không chuyển dịch.", "D. thuận rồi nghịch."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch $NH_4Cl$ có môi trường", "answer": "A", "explain": "Muối của acid mạnh và base yếu: $NH_4^+$ thuỷ phân tạo $H^+$.", "options": ["A. acid ($pH \\lt 7$).", "B. base ($pH \\gt 7$).", "C. trung tính ($pH = 7$).", "D. không xác định."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Biết $K_C$ của $2SO_2 + O_2 \\rightleftharpoons 2SO_3$ là $40$. $K_C$ của phản ứng nghịch $2SO_3 \\rightleftharpoons 2SO_2 + O_2$ (cùng nhiệt độ) là", "answer": "A", "explain": "$K_{C(nghịch)} = 1/40 = 0{,}025$.", "options": ["A. $0{,}025$", "B. $40$", "C. $20$", "D. $80$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Có hai dung dịch cùng nồng độ $0{,}1\\,M$: X là $HCl$, Y là $CH_3COOH$ (acid yếu). So sánh pH:", "answer": "A", "explain": "$HCl$ điện li hoàn toàn ($pH = 1$); $CH_3COOH$ điện li một phần nên $[H^+]$ nhỏ hơn, pH lớn hơn.", "options": ["A. $pH_X \\lt pH_Y$.", "B. $pH_X = pH_Y$.", "C. $pH_X \\gt pH_Y$.", "D. không so sánh được."]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về hằng số cân bằng và nhiệt độ:", "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo SGK.", "statements": ["a) Phản ứng thuận nghịch dùng mũi tên hai chiều $\\rightleftharpoons$.", "b) $K_w$ chỉ phụ thuộc vào nhiệt độ.", "c) $pH + pOH = 14$ (ở $25^oC$).", "d) Burette dùng để đo thể tích dung dịch chuẩn."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Chuẩn độ $25\\,mL$ dung dịch $NaOH$ $0{,}1\\,M$ bằng dung dịch $HCl$ $0{,}1\\,M$. Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng ($C_1V_1 = C_2V_2$, cùng C nên cùng V). c) Đúng. d) Đúng — tỉ lệ 1:1.", "statements": ["a) Điểm tương đương có $pH = 7$.", "b) Thể tích $HCl$ cần dùng là $25\\,mL$.", "c) Phenolphtalein chuyển từ không màu sang hồng khi tới điểm tương đương.", "d) Tại điểm tương đương, $n_{NaOH} = n_{HCl}$."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Trộn $50\\,mL$ dung dịch $HCl$ $0{,}2\\,M$ với $50\\,mL$ dung dịch $NaOH$ $0{,}2\\,M$. pH của dung dịch thu được là", "answer": "7", "explain": "Trung hoà vừa đủ nên $pH = 7$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phản ứng $2A \\rightleftharpoons B$ có $K_C = 1$. Ban đầu $[A] = 3\\,M$ (không có B). Tính nồng độ $[B]$ tại cân bằng (đơn vị $M$).", "answer": "1", "explain": "Gọi $x = [B]$ thì $[A] = 3 - 2x$; $\\frac{x}{(3-2x)^2} = 1$; thử $x = 1$: mẫu $= 1$, $1/1 = 1$ thoả mãn."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hằng số cân bằng $K_C$", "answer": "A", "explain": "SGK Bài 1: $K_C$ chỉ phụ thuộc nhiệt độ và bản chất phản ứng.", "options": ["A. chỉ phụ thuộc vào nhiệt độ (và bản chất phản ứng).", "B. phụ thuộc nồng độ ban đầu của các chất.", "C. phụ thuộc chất xúc tác.", "D. luôn bằng $1$."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhúng giấy quỳ tím vào dung dịch $NaOH$, giấy quỳ chuyển sang màu", "answer": "A", "explain": "Quỳ tím hoá xanh trong môi trường base.", "options": ["A. xanh.", "B. đỏ.", "C. không đổi màu.", "D. vàng."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $N_2 + 3H_2 \\rightleftharpoons 2NH_3$ đang ở cân bằng. Khi rút bớt $NH_3$ ra khỏi hệ, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Giảm nồng độ sản phẩm → cân bằng chuyển dịch theo chiều bù lại (chiều thuận).", "options": ["A. thuận (tạo thêm $NH_3$).", "B. nghịch.", "C. không chuyển dịch.", "D. thuận rồi nghịch."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch có $[H^+] = 10^{-8}\\,M$ (ở $25^oC$) là môi trường", "answer": "A", "explain": "$pH = 8 \\gt 7$: môi trường base.", "options": ["A. base.", "B. acid.", "C. trung tính.", "D. không xác định."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tại cân bằng của $2SO_2 + O_2 \\rightleftharpoons 2SO_3$: $[SO_2] = 0{,}2\\,M$; $[O_2] = 0{,}1\\,M$; $[SO_3] = 0{,}4\\,M$. Giá trị $K_C$ là", "answer": "A", "explain": "$K_C = \\frac{0{,}4^2}{0{,}2^2 \\times 0{,}1} = \\frac{0{,}16}{0{,}004} = 40$.", "options": ["A. $40$", "B. $4$", "C. $0{,}4$", "D. $400$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trộn $100\\,mL$ dung dịch $HCl$ $0{,}1\\,M$ với $200\\,mL$ dung dịch $NaOH$ $0{,}2\\,M$. pH của dung dịch thu được là", "answer": "A", "explain": "$n_{H^+} = 0{,}01\\,mol$; $n_{OH^-} = 0{,}04\\,mol$; dư $0{,}03\\,mol$ $OH^-$ trong $0{,}3\\,L$ nên $[OH^-] = 0{,}1 = 10^{-1}\\,M$; $pOH = 1$, $pH = 13$.", "options": ["A. $13$", "B. $1$", "C. $7$", "D. $12$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về cân bằng động và chất chỉ thị:", "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo SGK.", "statements": ["a) Nguyên lí Le Chatelier: cân bằng chuyển dịch theo chiều chống lại tác động bên ngoài.", "b) Tăng nhiệt độ làm cân bằng chuyển dịch theo chiều thu nhiệt.", "c) Chất xúc tác không làm chuyển dịch cân bằng.", "d) pH của máu người ổn định khoảng $7{,}4$."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Tính nhanh pH (ở $25^oC$). Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng ($pOH = 2$). c) Đúng ($[H^+] = 10^{-4}$). d) Đúng — trung hoà vừa đủ.", "statements": ["a) Dung dịch $HCl$ $0{,}01\\,M$ có $pH = 2$.", "b) Dung dịch $NaOH$ $0{,}01\\,M$ có $pH = 12$.", "c) Pha loãng dung dịch $HCl$ $0{,}01\\,M$ đi $100$ lần được dung dịch $pH = 4$.", "d) Trộn hai dung dịch trên với thể tích bằng nhau được dung dịch $pH = 7$."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Cần $V\\,mL$ dung dịch $HCl$ $0{,}1\\,M$ để trung hoà vừa đủ $25\\,mL$ dung dịch $NaOH$ $0{,}2\\,M$. Tính $V$.", "answer": "50", "explain": "$0{,}1V = 0{,}2 \\times 25$, suy ra $V = 50\\,mL$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Dung dịch X có $pH = 2$. Thêm nước vào X để thể tích tăng $1000$ lần. pH của dung dịch mới là", "answer": "5", "explain": "$[H^+]$ giảm $1000$ lần: từ $10^{-2}$ còn $10^{-5}\\,M$ nên $pH = 5$."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trạng thái cân bằng hoá học đạt được khi", "answer": "A", "explain": "Định nghĩa cân bằng hoá học: $v_t = v_n$.", "options": ["A. tốc độ phản ứng thuận bằng tốc độ phản ứng nghịch.", "B. các chất ngừng phản ứng.", "C. nồng độ các chất bằng nhau.", "D. hệ toả nhiệt mạnh."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Dung dịch làm quỳ tím hoá xanh là dung dịch có tính", "answer": "A", "explain": "Quỳ tím hoá xanh trong môi trường base.", "options": ["A. base.", "B. acid.", "C. trung tính.", "D. lưỡng tính."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho $2SO_2 + O_2 \\rightleftharpoons 2SO_3$; $\\Delta H \\lt 0$ đang cân bằng. Khi tăng nhiệt độ, cân bằng chuyển dịch theo chiều", "answer": "A", "explain": "Tăng $T$ → chuyển dịch theo chiều thu nhiệt ($\\Delta H \\gt 0$), tức chiều nghịch.", "options": ["A. nghịch (chiều thu nhiệt).", "B. thuận (chiều toả nhiệt).", "C. không chuyển dịch.", "D. thuận rồi nghịch."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Vai trò của pH trong đời sống: phát biểu đúng là", "answer": "A", "explain": "SGK Bài 2: pH đất quyết định cây trồng; còn pH nước mưa, mỹ phẩm, thuỷ sản...", "options": ["A. pH của đất giúp lựa chọn cây trồng phù hợp.", "B. pH không ảnh hưởng gì tới đời sống.", "C. mọi loại cây đều sống tốt ở mọi pH.", "D. pH của nước uống càng thấp càng tốt."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Phản ứng $H_2 + I_2 \\rightleftharpoons 2HI$ có $K_C = 64$. Tại cân bằng $[H_2] = [I_2] = 0{,}25\\,M$. Nồng độ $[HI]$ tại cân bằng là", "answer": "A", "explain": "$[HI]^2 = 64 \\times 0{,}25 \\times 0{,}25 = 4$, suy ra $[HI] = 2\\,M$.", "options": ["A. $2\\,M$", "B. $1\\,M$", "C. $4\\,M$", "D. $0{,}5\\,M$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Chuẩn độ $10\\,mL$ dung dịch $Ba(OH)_2$ bằng dung dịch $HCl$ $0{,}1\\,M$; tới điểm tương đương đã dùng hết $20\\,mL$ $HCl$. Nồng độ của $Ba(OH)_2$ là", "answer": "A", "explain": "$Ba(OH)_2 + 2HCl \\rightarrow BaCl_2 + 2H_2O$; $n_{HCl} = 0{,}002\\,mol$ nên $n_{Ba(OH)_2} = 0{,}001\\,mol$; $C = 0{,}001/0{,}01 = 0{,}1\\,M$.", "options": ["A. $0{,}1\\,M$", "B. $0{,}05\\,M$", "C. $0{,}2\\,M$", "D. $0{,}01\\,M$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về phản ứng và tích số ion:", "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo SGK.", "statements": ["a) Phản ứng thuận nghịch dùng mũi tên hai chiều.", "b) Ở $25^oC$, $K_w = 10^{-14}$.", "c) Dung dịch acid có $pH \\lt 7$.", "d) Chuẩn độ tỉ lệ 1:1 thì $C_1V_1 = C_2V_2$."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Cho phản ứng $aA + bB \\rightleftharpoons cC + dD$ với $Q = \\frac{[C]^c[D]^d}{[A]^a[B]^b}$ (thương số phản ứng). Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "Đây là quy tắc so sánh $Q$ với $K_C$ để dự đoán chiều chuyển dịch của hệ chưa cân bằng.", "statements": ["a) $Q \\lt K_C$: hệ chuyển dịch theo chiều thuận.", "b) $Q \\gt K_C$: hệ chuyển dịch theo chiều nghịch.", "c) $Q = K_C$: hệ đang ở cân bằng.", "d) $Q$ được tính bằng nồng độ tức thời (chưa chắc ở cân bằng)."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dung dịch $NaOH$ có $[OH^-] = 10^{-3}\\,M$ (ở $25^oC$). pH của dung dịch là", "answer": "11", "explain": "$pOH = 3$ nên $pH = 14 - 3 = 11$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Hoà tan $0{,}04\\,mol$ $NaOH$ vào nước được $1\\,L$ dung dịch X. Thêm $0{,}03\\,mol$ $HCl$ vào X được dung dịch Y. Tính pH của Y.", "answer": "12", "explain": "Dư $0{,}01\\,mol$ $OH^-$ trong $1\\,L$: $[OH^-] = 10^{-2}\\,M$; $pOH = 2$, $pH = 12$."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Phản ứng thuận nghịch được biểu diễn bằng mũi tên", "answer": "A", "explain": "SGK Bài 1.", "options": ["A. hai chiều $\\rightleftharpoons$.", "B. một chiều $\\rightarrow$.", "C. đi lên $\\uparrow$.", "D. đi xuống $\\downarrow$."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Nước cất (ở $25^oC$) có pH bằng", "answer": "A", "explain": "Nước cất trung tính: $[H^+] = 10^{-7}\\,M$ nên $pH = 7$.", "options": ["A. $7$", "B. $1$", "C. $14$", "D. $0$"]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Yếu tố nào sau đây KHÔNG làm chuyển dịch cân bằng hoá học?", "answer": "A", "explain": "Xúc tác chỉ giúp đạt cân bằng nhanh hơn, không làm chuyển dịch cân bằng.", "options": ["A. Chất xúc tác.", "B. Nhiệt độ.", "C. Nồng độ.", "D. Áp suất (với hệ khí)."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch $HCl$ $0{,}1\\,M$ và dung dịch $NaOH$ $0{,}1\\,M$ có pH lần lượt là", "answer": "A", "explain": "$HCl$: $[H^+] = 10^{-1}$, $pH = 1$; $NaOH$: $[OH^-] = 10^{-1}$, $pOH = 1$, $pH = 13$.", "options": ["A. $1$ và $13$.", "B. $13$ và $1$.", "C. $7$ và $7$.", "D. $2$ và $12$."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho $A \\rightleftharpoons B + C$ có $K_C = 2$. Tại cân bằng $[A] = 0{,}5\\,M$, $[B] = 1\\,M$. Nồng độ $[C]$ tại cân bằng là", "answer": "A", "explain": "$K_C = \\frac{[B][C]}{[A]} = 2$ nên $[C] = \\frac{2 \\times 0{,}5}{1} = 1\\,M$.", "options": ["A. $1\\,M$", "B. $2\\,M$", "C. $0{,}5\\,M$", "D. $4\\,M$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trộn $150\\,mL$ dung dịch $H_2SO_4$ $0{,}1\\,M$ với $150\\,mL$ dung dịch $KOH$ $0{,}2\\,M$. pH của dung dịch thu được là", "answer": "A", "explain": "$n_{H^+} = 2 \\times 0{,}015 = 0{,}03\\,mol$; $n_{OH^-} = 0{,}03\\,mol$; trung hoà vừa đủ nên $pH = 7$.", "options": ["A. $7$", "B. $1$", "C. $13$", "D. $2$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về nguyên lí Le Chatelier:", "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo SGK.", "statements": ["a) Cân bằng hoá học là cân bằng động.", "b) $K_C$ chỉ phụ thuộc vào nhiệt độ.", "c) $pH = -\\log[H^+]$.", "d) Điểm tương đương của chuẩn độ $HCl$ bằng $NaOH$ có $pH = 7$."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về mũi tên phản ứng và Kw:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng — chất rắn nguyên chất không ảnh hưởng cân bằng.", "statements": ["a) Tăng nồng độ chất phản ứng → cân bằng chuyển dịch theo chiều thuận.", "b) Giảm nhiệt độ → cân bằng chuyển dịch theo chiều toả nhiệt.", "c) Tăng áp suất (hệ khí) → cân bằng chuyển dịch theo chiều giảm số mol khí.", "d) Thêm $CaCO_3$ rắn vào hệ $CaCO_3(s) \\rightleftharpoons CaO(s) + CO_2(g)$ đang cân bằng không làm chuyển dịch cân bằng."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dung dịch $NaOH$ có $[OH^-] = 0{,}001\\,M$ (ở $25^oC$). pH của dung dịch là", "answer": "11", "explain": "$[OH^-] = 10^{-3}\\,M$ nên $pOH = 3$, $pH = 11$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cần lấy bao nhiêu $mL$ dung dịch $HCl$ $0{,}4\\,M$ để pha thành $250\\,mL$ dung dịch $HCl$ $0{,}04\\,M$?", "answer": "25", "explain": "$0{,}4V = 0{,}04 \\times 250$, suy ra $V = 25\\,mL$."}]}]}
