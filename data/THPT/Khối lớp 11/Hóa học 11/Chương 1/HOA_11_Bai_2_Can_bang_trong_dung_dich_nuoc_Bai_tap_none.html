= 10^{-4}$, $[H^+]_Y = 10^{-6}$; tỉ số $10^{-4}/10^{-6} = 100$. pH hơn kém 1 đơn vị thì $[H^+]$ gấp 10 lần.", "options": ["A. $[H^+]$ của X gấp $100$ lần của Y.", "B. $[H^+]$ của Y gấp $100$ lần của X.", "C. $[H^+]$ hai dung dịch bằng nhau.", "D. $[H^+]$ của X gấp $2$ lần của Y."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nhỏ từ từ dung dịch $NaOH$ vào dung dịch $HCl$ có sẵn vài giọt phenolphtalein. Hiện tượng quan sát được là", "answer": "A", "explain": "Ban đầu môi trường acid: phenolphtalein không màu. Tới điểm tương đương, môi trường chuyển sang base: xuất hiện màu hồng.", "options": ["A. dung dịch từ không màu chuyển sang hồng khi vừa tới điểm tương đương.", "B. dung dịch từ hồng chuyển sang không màu ngay từ đầu.", "C. không có hiện tượng gì.", "D. xuất hiện kết tủa trắng."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Dung dịch $HCl$ có $pH = 7$? Không — xét bài toán: Hoà tan thêm $HCl$ vào nước cất ($pH = 7$) để $[H^+] = 10^{-3}\\,M$. pH mới của dung dịch là", "answer": "A", "explain": "$pH = -\\log(10^{-3}) = 3$.", "options": ["A. $3$", "B. $4$", "C. $10$", "D. $11$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trộn $V_1\\,mL$ dung dịch $HCl$ $0{,}1\\,M$ với $V_2\\,mL$ dung dịch $NaOH$ $0{,}1\\,M$ ($V_1 + V_2 = 200\\,mL$) được dung dịch có $pH = 12$. Giá trị của $V_2$ là", "answer": "C", "explain": "$pH = 12$ nên $[OH^-]$ dư $= 10^{-2}\\,M$; $n_{OH^-}$ dư $= 0{,}01 \\times 0{,}2 = 0{,}002\\,mol$. Mà $n_{OH^-}$ dư $= 0{,}1(V_2 - V_1)/1000$, suy ra $V_2 - V_1 = 20$. Với $V_1 + V_2 = 200$ giải được $V_2 = 110\\,mL$.", "options": ["A. $90\\,mL$", "B. $100\\,mL$", "C. $110\\,mL$", "D. $120\\,mL$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về chuẩn độ acid – base:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng — định nghĩa điểm tương đương. d) Sai — cần chất chỉ thị để nhận biết điểm tương đương.", "statements": ["a) Chuẩn độ là phương pháp xác định nồng độ của một dung dịch chưa biết.", "b) Dung dịch chuẩn là dung dịch đã biết chính xác nồng độ.", "c) Điểm tương đương là thời điểm acid và base phản ứng vừa đủ với nhau.", "d) Khi chuẩn độ không cần dùng chất chỉ thị."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về tích số ion của nước:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng — tăng T, nước điện li nhiều hơn. c) Sai — $K_w$ tăng khi T tăng. d) Đúng — mọi dung dịch nước đều có cả $H^+$ và $OH^-$.", "statements": ["a) $K_w$ chỉ phụ thuộc vào nhiệt độ.", "b) Khi tăng nhiệt độ, $K_w$ tăng.", "c) Ở $50^oC$, $K_w$ vẫn bằng $10^{-14}$.", "d) Trong dung dịch $NaOH$ vẫn tồn tại ion $H^+$."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "$50\\,mL$ dung dịch $HCl$ $0{,}2\\,M$ trung hoà vừa đủ $V\\,mL$ dung dịch $KOH$ $0{,}1\\,M$. Tính $V$.", "answer": "100", "explain": "Tỉ lệ 1:1 nên $0{,}1 \\times V = 0{,}2 \\times 50$, suy ra $V = 100\\,mL$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Hoà tan $0{,}04\\,mol$ $NaOH$ vào nước được $1\\,L$ dung dịch X. Thêm tiếp $0{,}03\\,mol$ $HCl$ vào X được dung dịch Y. Tính pH của Y.", "answer": "12", "explain": "$n_{OH^-}$ ban đầu $= 0{,}04\\,mol$; $HCl$ trung hoà $0{,}03\\,mol$ nên còn dư $0{,}01\\,mol$ $OH^-$ trong $1\\,L$: $[OH^-] = 0{,}01 = 10^{-2}\\,M$. Suy ra $pOH = 2$ và $pH = 14 - 2 = 12$."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Phương trình điện li của nước được viết là", "answer": "B", "explain": "Nước là chất điện li rất yếu nên dùng mũi tên hai chiều: $H_2O \\rightleftharpoons H^+ + OH^-$.", "options": ["A. $H_2O \\rightarrow H^+ + OH^-$", "B. $H_2O \\rightleftharpoons H^+ + OH^-$", "C. $2H_2O \\rightarrow 2H_2 + O_2$", "D. $H_2O \\rightarrow H_2 + O$"]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Ý nghĩa thực tiễn của việc đo pH: ví dụ nào sau đây đúng?", "answer": "A", "explain": "pH đất quyết định cây trồng phù hợp; ngoài ra còn pH nước mưa, pH mỹ phẩm, pH ao nuôi thuỷ sản... pH máu người ổn định khoảng $7{,}4$.", "options": ["A. pH của đất giúp chọn cây trồng phù hợp.", "B. pH không liên quan gì tới đời sống.", "C. Mọi dung dịch đều có $pH = 7$.", "D. pH của máu người là $2$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cho các dung dịch (cùng $25^oC$): (1) $pH = 2$; (2) $pH = 7$; (3) $pH = 9$. Sắp xếp theo chiều tính acid tăng dần:", "answer": "B", "explain": "pH càng nhỏ, tính acid càng mạnh. Thứ tự acid tăng dần: (3) base \\lt (2) trung tính \\lt (1) acid mạnh.", "options": ["A. (1) \\lt (2) \\lt (3).", "B. (3) \\lt (2) \\lt (1).", "C. (2) \\lt (1) \\lt (3).", "D. (1) \\lt (3) \\lt (2)."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nhỏ dung dịch $NaOH$ vào dung dịch $HCl$ có methyl da cam. Màu của dung dịch chuyển như thế nào khi đi qua điểm tương đương?", "answer": "A", "explain": "Methyl da cam: màu đỏ trong môi trường acid, màu vàng trong môi trường base. Đi từ acid sang base, màu chuyển từ đỏ sang vàng.", "options": ["A. Từ đỏ sang vàng.", "B. Từ vàng sang đỏ.", "C. Từ không màu sang hồng.", "D. Không đổi màu."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Dung dịch X có $pH = 3$. Pha loãng X với nước (thể tích tăng $100$ lần). pH của dung dịch sau khi pha loãng là", "answer": "B", "explain": "Pha loãng $100$ lần, $[H^+]$ giảm $100$ lần: từ $10^{-3}$ còn $10^{-5}\\,M$ nên $pH = 5$ (vẫn $\\lt 7$, hợp lí).", "options": ["A. $1$", "B. $5$", "C. $4$", "D. $6$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Có hai dung dịch: X là $HCl$ $0{,}1\\,M$, Y là $CH_3COOH$ $0{,}1\\,M$ (acid yếu). So sánh pH của X và Y:", "answer": "B", "explain": "$HCl$ điện li hoàn toàn cho $[H^+] = 0{,}1$ ($pH = 1$); $CH_3COOH$ điện li một phần nên $[H^+] \\lt 0{,}1$, pH lớn hơn. Vậy $pH_X \\lt pH_Y$.", "options": ["A. $pH_X = pH_Y$.", "B. $pH_X \\lt pH_Y$.", "C. $pH_X \\gt pH_Y$.", "D. Không so sánh được."]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về sự điện li của nước:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng — từ $K_w = 10^{-14}$. c) Sai — tăng T thì nước điện li nhiều hơn, $K_w$ tăng. d) Đúng — tích $[H^+][OH^-] = K_w$ không đổi nên $[H^+]$ tăng thì $[OH^-]$ giảm.", "statements": ["a) Nước là chất điện li rất yếu: $H_2O \\rightleftharpoons H^+ + OH^-$.", "b) Ở $25^oC$, nước tinh khiết có $[H^+] = [OH^-] = 10^{-7}\\,M$.", "c) Khi đun nóng nước, $K_w$ giảm.", "d) Thêm acid vào nước làm tăng $[H^+]$ và giảm $[OH^-]$."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Để xác định nồng độ dung dịch $NaOH$ (chưa biết) bằng chuẩn độ với $HCl$ $0{,}1\\,M$, một học sinh tiến hành thí nghiệm. Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng — tỉ lệ 1:1. d) Đúng — từ $C_1V_1 = C_2V_2$ suy ra $C_{NaOH} = 0{,}1V/V_{NaOH}$.", "statements": ["a) Dung dịch $HCl$ $0{,}1\\,M$ đóng vai trò dung dịch chuẩn.", "b) Có thể dùng phenolphtalein để nhận biết điểm tương đương.", "c) Tại điểm tương đương, số mol $HCl$ đã dùng bằng số mol $NaOH$ ban đầu.", "d) Nếu dùng hết $V\\,mL$ $HCl$ thì $C_{NaOH} = \\frac{0{,}1V}{V_{NaOH}}$."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dung dịch $KOH$ $0{,}01\\,M$ có $pH$ bằng bao nhiêu?", "answer": "12", "explain": "$[OH^-] = 0{,}01 = 10^{-2}\\,M$ nên $pOH = 2$, suy ra $pH = 14 - 2 = 12$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Chuẩn độ $10\\,mL$ dung dịch $H_2SO_4$ (chưa biết nồng độ) bằng dung dịch $NaOH$ $0{,}2\\,M$; tới điểm tương đương đã dùng hết $15\\,mL$ $NaOH$. Tính nồng độ $mol/L$ của dung dịch $H_2SO_4$.", "answer": "0,15", "explain": "$H_2SO_4 + 2NaOH \\rightarrow Na_2SO_4 + 2H_2O$ (tỉ lệ 1:2). $n_{NaOH} = 0{,}2 \\times 0{,}015 = 0{,}003\\,mol$ nên $n_{H_2SO_4} = 0{,}0015\\,mol$. $C = 0{,}0015/0{,}01 = 0{,}15\\,M$."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Thuốc thử dùng để nhận biết điểm tương đương trong chuẩn độ acid – base là", "answer": "A", "explain": "Chất chỉ thị đổi màu gần điểm tương đương giúp nhận biết thời điểm kết thúc chuẩn độ.", "options": ["A. chất chỉ thị acid – base (vd: phenolphtalein).", "B. dung dịch $AgNO_3$.", "C. dung dịch $BaCl_2$.", "D. giấy lọc."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong dung dịch nước ở $25^oC$ luôn đúng hệ thức", "answer": "A", "explain": "Tích số ion của nước: $[H^+][OH^-] = K_w = 10^{-14}$ đúng với mọi dung dịch nước ở $25^oC$.", "options": ["A. $[H^+][OH^-] = 10^{-14}$.", "B. $[H^+] + [OH^-] = 10^{-14}$.", "C. $[H^+]/[OH^-] = 10^{-14}$.", "D. $[H^+] = [OH^-]$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch A có $[H^+] = 10^{-4}\\,M$, dung dịch B có $[OH^-] = 10^{-4}\\,M$ (cùng $25^oC$). Nhận định đúng là", "answer": "A", "explain": "A: $[H^+] = 10^{-4} \\gt 10^{-7}$ nên là acid ($pH = 4$). B: $[OH^-] = 10^{-4}$ nên $pOH = 4$, $pH = 10 \\gt 7$ là base.", "options": ["A. A là acid, B là base.", "B. A là base, B là acid.", "C. cả hai đều trung tính.", "D. cả hai đều là acid."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi chuẩn độ dung dịch $NaOH$ bằng dung dịch $HCl$, nếu vượt quá điểm tương đương (dư acid) thì dung dịch trong bình sẽ", "answer": "A", "explain": "Dư acid $HCl$ nên dung dịch có môi trường acid, $pH \\lt 7$ (phenolphtalein mất màu hồng).", "options": ["A. có $pH \\lt 7$.", "B. có $pH = 7$.", "C. có $pH \\gt 7$.", "D. mất màu hoàn toàn."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Giá trị $K_w$ ở $100^oC$ lớn hơn ở $25^oC$. Điều này chứng tỏ quá trình điện li của nước là quá trình", "answer": "B", "explain": "Tăng nhiệt độ làm cân bằng điện li chuyển dịch theo chiều thuận (tăng $K_w$) nên chiều thuận là chiều thu nhiệt (theo Le Chatelier).", "options": ["A. toả nhiệt.", "B. thu nhiệt.", "C. không có trao đổi nhiệt.", "D. không thuận nghịch."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Pha loãng $10\\,mL$ dung dịch $NaOH$ có $pH = 12$ thành $1000\\,mL$. pH của dung dịch sau là", "answer": "A", "explain": "Pha loãng $100$ lần: $[OH^-]$ từ $10^{-2}$ còn $10^{-4}\\,M$ nên $pOH = 4$, $pH = 10$.", "options": ["A. $10$", "B. $11$", "C. $13$", "D. $9$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về thang pH (ở $25^oC$):", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng — pH càng nhỏ acid càng mạnh. d) Đúng — theo SGK.", "statements": ["a) Thang pH thường có giá trị từ $0$ đến $14$.", "b) $pH = 7$ ứng với môi trường trung tính.", "c) Dung dịch $pH = 2$ có tính acid mạnh hơn dung dịch $pH = 5$.", "d) Nước mưa có $pH \\lt 5{,}6$ được gọi là mưa acid."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai khi nói về pH của các dung dịch sau (ở $25^oC$):", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng ($pOH = 3$). c) Sai — pH lần lượt là 3 và 11. d) Đúng — trung hoà vừa đủ.", "statements": ["a) Dung dịch $HCl$ $10^{-3}\\,M$ có $pH = 3$.", "b) Dung dịch $NaOH$ $10^{-3}\\,M$ có $pH = 11$.", "c) Dung dịch $HCl$ $10^{-3}\\,M$ và dung dịch $NaOH$ $10^{-3}\\,M$ có pH bằng nhau.", "d) Trộn hai dung dịch trên với thể tích bằng nhau được dung dịch $pH = 7$."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dung dịch X có $pH = 2$. Nồng độ $[H^+]$ của X là $10^{-a}\\,M$. Tính $a$.", "answer": "2", "explain": "$pH = -\\log[H^+] = 2$ nên $[H^+] = 10^{-2}\\,M$, vậy $a = 2$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Để trung hoà $25\\,mL$ dung dịch $Ba(OH)_2$ $0{,}1\\,M$ cần dùng $V\\,mL$ dung dịch $HCl$ $0{,}2\\,M$. Tính $V$.", "answer": "25", "explain": "$Ba(OH)_2 + 2HCl \\rightarrow BaCl_2 + 2H_2O$ (tỉ lệ 1:2). $n_{Ba(OH)_2} = 0{,}0025\\,mol$ nên $n_{HCl} = 0{,}005\\,mol$; $V = 0{,}005/0{,}2 = 0{,}025\\,L = 25\\,mL$."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Mưa acid là hiện tượng nước mưa có", "answer": "A", "explain": "Nước mưa bình thường $pH \\approx 5{,}6$ (do $CO_2$); $pH \\lt 5{,}6$ là mưa acid, gây hại công trình, cây cối.", "options": ["A. $pH \\lt 5{,}6$.", "B. $pH = 7$.", "C. $pH \\gt 7$.", "D. $pH \\gt 10$."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Điểm tương đương trong chuẩn độ acid – base là thời điểm", "answer": "A", "explain": "Định nghĩa SGK: điểm tương đương là lúc acid và base phản ứng vừa đủ theo đúng tỉ lệ hoá học.", "options": ["A. acid và base phản ứng vừa đủ với nhau theo đúng tỉ lệ phương trình.", "B. dung dịch bắt đầu đổi màu.", "C. ngừng cho dung dịch chuẩn vào.", "D. pH của dung dịch bằng $0$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch $NH_4Cl$ (muối của acid mạnh và base yếu) có môi trường", "answer": "A", "explain": "Ion $NH_4^+$ thuỷ phân tạo $H^+$ ($NH_4^+ + H_2O \\rightleftharpoons NH_3 + H_3O^+$) nên dung dịch có môi trường acid.", "options": ["A. acid ($pH \\lt 7$).", "B. base ($pH \\gt 7$).", "C. trung tính ($pH = 7$).", "D. không xác định được."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch $CH_3COONa$ (muối của acid yếu và base mạnh) có môi trường", "answer": "B", "explain": "Ion $CH_3COO^-$ thuỷ phân tạo $OH^-$ nên dung dịch có môi trường base.", "options": ["A. acid ($pH \\lt 7$).", "B. base ($pH \\gt 7$).", "C. trung tính ($pH = 7$).", "D. không xác định được."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Nhúng giấy pH vào các dung dịch: $HCl$ $0{,}01\\,M$ (1), nước cất (2), $NaOH$ $0{,}01\\,M$ (3). Màu giấy pH tương ứng gần đúng là", "answer": "A", "explain": "(1) $pH = 2$: đỏ/cam; (2) $pH = 7$: xanh lá; (3) $pH = 12$: tím/xanh đậm.", "options": ["A. đỏ – xanh lá – tím.", "B. tím – xanh lá – đỏ.", "C. xanh lá – đỏ – tím.", "D. đỏ – tím – xanh lá."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trộn $100\\,mL$ dung dịch $HCl$ $0{,}02\\,M$ với $100\\,mL$ dung dịch $NaOH$ $0{,}04\\,M$. pH của dung dịch thu được là", "answer": "A", "explain": "$n_{H^+} = 0{,}002\\,mol$; $n_{OH^-} = 0{,}004\\,mol$; $OH^-$ dư $0{,}002\\,mol$ trong $0{,}2\\,L$ nên $[OH^-] = 0{,}01 = 10^{-2}\\,M$. Suy ra $pOH = 2$ và $pH = 12$.", "options": ["A. $12$", "B. $7$", "C. $2$", "D. $13$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về chất chỉ thị:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng — muối của acid mạnh và base mạnh. d) Sai — pH càng lớn, tính base càng mạnh.", "statements": ["a) Giấy quỳ tím chuyển đỏ trong dung dịch acid, chuyển xanh trong dung dịch base.", "b) Thang pH cho biết độ acid – base của dung dịch.", "c) Dung dịch $NaCl$ có $pH = 7$ (ở $25^oC$).", "d) $pH$ càng lớn thì tính base càng yếu."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai về ảnh hưởng của nhiệt độ tới $K_w$:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng ($[H^+] = 10^{-7}$). c) Sai — $K_w$ tăng nên $[H^+] \\gt 10^{-7}$, $pH \\lt 7$ (vẫn trung tính vì $[H^+] = [OH^-]$). d) Đúng — trung tính nghĩa là $[H^+] = [OH^-]$, không nhất thiết $pH = 7$.", "statements": ["a) $K_w$ tăng khi nhiệt độ tăng.", "b) Ở $25^oC$, nước tinh khiết có $pH = 7$.", "c) Ở $100^oC$, nước tinh khiết vẫn có $pH = 7$.", "d) Dù nhiệt độ nào, nước tinh khiết luôn trung tính."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dung dịch $HCl$ $0{,}001\\,M$ được pha loãng $10$ lần bằng nước cất. pH của dung dịch sau khi pha loãng là", "answer": "4", "explain": "Pha loãng $10$ lần: $[H^+]$ từ $10^{-3}$ còn $10^{-4}\\,M$ nên $pH = 4$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Có $200\\,mL$ dung dịch $KOH$ $a\\,M$. Thêm $100\\,mL$ dung dịch $HCl$ $0{,}1\\,M$ vào được dung dịch có $pH = 13$. Tính $a$.", "answer": "0,2", "explain": "$pH = 13$ nên $[OH^-]$ dư $= 0{,}1\\,M$; $n_{OH^-}$ dư $= 0{,}1 \\times 0{,}3 = 0{,}03\\,mol$. $n_{KOH} - n_{HCl} = 0{,}2a - 0{,}01 = 0{,}03$, suy ra $0{,}2a = 0{,}04$, $a = 0{,}2\\,M$."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Khi cho thêm acid vào nước cất, điều nào sau đây xảy ra?", "answer": "A", "explain": "Thêm acid làm $[H^+]$ tăng; vì $[H^+][OH^-] = K_w = 10^{-14}$ không đổi (ở $25^oC$) nên $[OH^-]$ giảm.", "options": ["A. $[H^+]$ tăng, $[OH^-]$ giảm, tích $[H^+][OH^-]$ không đổi ($25^oC$).", "B. $[H^+]$ tăng, $[OH^-]$ tăng.", "C. $[H^+]$ giảm, $[OH^-]$ tăng.", "D. $K_w$ tăng lên."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Dung dịch nào sau đây có $pH = 7$ (ở $25^oC$)?", "answer": "A", "explain": "Nước cất trung tính ($[H^+] = [OH^-] = 10^{-7}\\,M$) nên $pH = 7$.", "options": ["A. Nước cất.", "B. Dung dịch $HCl$ $0{,}1\\,M$.", "C. Dung dịch $NaOH$ $0{,}1\\,M$.", "D. Dung dịch $CH_3COOH$ $0{,}1\\,M$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Có 3 dung dịch: X ($pH = 3$), Y ($pH = 5$), Z ($pH = 11$). Phát biểu đúng là", "answer": "A", "explain": "pH càng nhỏ acid càng mạnh: X ($pH = 3$) acid mạnh nhất; Z ($pH = 11 \\gt 7$) có tính base; Y ($pH = 5$) acid yếu hơn X.", "options": ["A. X có tính acid mạnh nhất, Z có tính base.", "B. Z có tính acid mạnh nhất.", "C. Y trung tính.", "D. X và Y đều có tính base."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Chuẩn độ $20\\,mL$ dung dịch $NaOH$ chưa biết nồng độ bằng $HCl$ $0{,}1\\,M$ hết $16\\,mL$. Nồng độ $NaOH$ là", "answer": "A", "explain": "Tỉ lệ 1:1: $C_{NaOH} \\times 20 = 0{,}1 \\times 16$, suy ra $C_{NaOH} = 0{,}08\\,M$.", "options": ["A. $0{,}08\\,M$", "B. $0{,}125\\,M$", "C. $0{,}16\\,M$", "D. $0{,}05\\,M$"]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho $V\\,mL$ dung dịch $NaOH$ $0{,}1\\,M$ vào $100\\,mL$ dung dịch $HCl$ $0{,}2\\,M$ được dung dịch có $pH = 1$. Giá trị của $V$ là", "answer": "A", "explain": "$pH = 1$ nên $[H^+]$ dư $= 0{,}1\\,M$. Gọi $V$ tính bằng $mL$: $n_{H^+}$ dư $= 0{,}02 - 0{,}0001V$; thể tích sau $= (100 + V)/1000\\,L$. Ta có $\\frac{0{,}02 - 0{,}0001V}{(100+V)/1000} = 0{,}1$, suy ra $0{,}02 - 0{,}0001V = 0{,}01 + 0{,}0001V$, giải được $V = 50\\,mL$.", "options": ["A. $50\\,mL$", "B. $100\\,mL$", "C. $150\\,mL$", "D. $200\\,mL$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Dung dịch X gồm $HCl$ $0{,}006\\,M$ và $H_2SO_4$ $0{,}002\\,M$ (điện li hoàn toàn). pH của X là", "answer": "A", "explain": "$[H^+] = 0{,}006 + 2 \\times 0{,}002 = 0{,}01 = 10^{-2}\\,M$ nên $pH = 2$.", "options": ["A. $2$", "B. $1$", "C. $3$", "D. $12$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về chuẩn độ:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng — burette là dụng cụ đo thể tích chính xác trong chuẩn độ.", "statements": ["a) Mục đích của chuẩn độ là xác định nồng độ dung dịch chưa biết.", "b) Dung dịch chuẩn phải biết chính xác nồng độ.", "c) Chất chỉ thị giúp nhận biết điểm tương đương.", "d) Thể tích dung dịch chuẩn đã dùng được đọc trên burette."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Một học sinh đo pH của 4 mẫu nước. Xét tính đúng, sai:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng — gần 7. b) Đúng — $\\lt 5{,}6$ là mưa acid. c) Đúng. d) Sai — $pH = 8{,}5 \\gt 7$ là môi trường base.", "statements": ["a) Mẫu A: $pH = 6{,}8$ — gần trung tính.", "b) Mẫu B: $pH = 4{,}2$ — mưa acid.", "c) Mẫu C: $pH = 7{,}0$ — trung tính.", "d) Mẫu D: $pH = 8{,}5$ — môi trường acid."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dung dịch $NaOH$ có $pH = 13$. Nồng độ $[OH^-]$ của dung dịch là $10^{-a}\\,M$. Tính $a$.", "answer": "1", "explain": "$pH = 13$ nên $pOH = 1$, suy ra $[OH^-] = 10^{-1}\\,M$, vậy $a = 1$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Trộn $100\\,mL$ dung dịch $HCl$ $0{,}1\\,M$ với $200\\,mL$ dung dịch $Ba(OH)_2$ $0{,}1\\,M$. Tính pH của dung dịch thu được.", "answer": "13", "explain": "$n_{H^+} = 0{,}01\\,mol$; $n_{OH^-} = 2 \\times 0{,}02 = 0{,}04\\,mol$; $OH^-$ dư $0{,}03\\,mol$ trong $0{,}3\\,L$ nên $[OH^-] = 0{,}1 = 10^{-1}\\,M$. Suy ra $pOH = 1$ và $pH = 13$."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Công thức tính pH của dung dịch là", "answer": "A", "explain": "Định nghĩa: $pH = -\\log[H^+]$.", "options": ["A. $pH = -\\log[H^+]$", "B. $pH = \\log[H^+]$", "C. $pH = [H^+]$", "D. $pH = \\frac{1}{[H^+]}$"]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Chất chỉ thị methyl da cam có đặc điểm", "answer": "A", "explain": "Methyl da cam: đỏ khi $pH \\lt 3{,}1$ (acid), vàng khi $pH \\gt 4{,}4$ (base).", "options": ["A. màu đỏ trong môi trường acid, màu vàng trong môi trường base.", "B. màu vàng trong môi trường acid, màu đỏ trong môi trường base.", "C. không màu trong mọi môi trường.", "D. chỉ dùng trong chuẩn độ kết tủa."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch có $pH = 9$ thì nồng độ $[H^+]$ bằng", "answer": "A", "explain": "$[H^+] = 10^{-pH} = 10^{-9}\\,M$.", "options": ["A. $10^{-9}\\,M$", "B. $10^{-5}\\,M$", "C. $9\\,M$", "D. $10^{9}\\,M$"]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Để pha $100\\,mL$ dung dịch $HCl$ $0{,}1\\,M$ từ dung dịch $HCl$ $1\\,M$, cần", "answer": "A", "explain": "Pha loãng: $C_1V_1 = C_2V_2$ nên $1 \\times V_1 = 0{,}1 \\times 100$, suy ra $V_1 = 10\\,mL$; thêm nước vừa đủ $100\\,mL$.", "options": ["A. lấy $10\\,mL$ dung dịch $1\\,M$ rồi thêm nước vừa đủ $100\\,mL$.", "B. lấy $100\\,mL$ dung dịch $1\\,M$ rồi thêm nước vừa đủ $1000\\,mL$.", "C. lấy $1\\,mL$ dung dịch $1\\,M$ rồi thêm nước vừa đủ $100\\,mL$.", "D. đun cạn $100\\,mL$ dung dịch $1\\,M$ còn $10\\,mL$."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Dung dịch A có $pH = 4$. Cần pha loãng A bao nhiêu lần để thu được dung dịch có $pH = 6$?", "answer": "A", "explain": "$[H^+]$ cần giảm từ $10^{-4}$ xuống $10^{-6}\\,M$, tức giảm $100$ lần, nên pha loãng $100$ lần (pH tăng 2 đơn vị).", "options": ["A. $100$ lần.", "B. $2$ lần.", "C. $10$ lần.", "D. $1000$ lần."]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Có dung dịch $NaOH$ $pH = 12$. Cần thêm bao nhiêu $mL$ nước vào $100\\,mL$ dung dịch này để được dung dịch $pH = 11$?", "answer": "A", "explain": "pH giảm 1 đơn vị nghĩa là $[OH^-]$ giảm $10$ lần, cần pha loãng $10$ lần: thể tích sau $= 1000\\,mL$ nên thêm $900\\,mL$ nước.", "options": ["A. $900\\,mL$", "B. $100\\,mL$", "C. $1000\\,mL$", "D. $10\\,mL$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về môi trường dung dịch (ở $25^oC$):", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng — máy đo pH cho kết quả chính xác.", "statements": ["a) $[H^+] \\gt 10^{-7}\\,M$ là môi trường acid.", "b) $[H^+] = 10^{-7}\\,M$ là môi trường trung tính.", "c) $[H^+] \\lt 10^{-7}\\,M$ là môi trường base.", "d) Có thể dùng máy đo pH để xác định pH của dung dịch."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai khi pha chế dung dịch:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng ($1 \\times 10 = 0{,}1 \\times 100$). c) Đúng. d) Đúng — $[H^+]$ giảm 10 lần.", "statements": ["a) Khi pha loãng, số mol chất tan không đổi: $C_1V_1 = C_2V_2$.", "b) Để pha $100\\,mL$ $HCl$ $0{,}1\\,M$ từ $HCl$ $1\\,M$ cần lấy $10\\,mL$ dung dịch đậm đặc.", "c) Thêm nước vào dung dịch acid không làm thay đổi số mol acid.", "d) Pha loãng dung dịch acid $10$ lần thì pH tăng $1$ đơn vị."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "$20\\,mL$ dung dịch $KOH$ $0{,}05\\,M$ trung hoà vừa đủ $V\\,mL$ dung dịch $HCl$ $0{,}05\\,M$. Tính $V$.", "answer": "20", "explain": "Tỉ lệ 1:1 và cùng nồng độ nên $V_{HCl} = V_{KOH} = 20\\,mL$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cho $200\\,mL$ dung dịch $H_2SO_4$ $0{,}05\\,M$ vào $100\\,mL$ dung dịch $NaOH$ $a\\,M$ được dung dịch có $pH = 7$. Tính $a$.", "answer": "0,2", "explain": "$n_{H^+} = 2 \\times 0{,}01 = 0{,}02\\,mol$; trung hoà vừa đủ ($pH = 7$) nên $n_{OH^-} = 0{,}02\\,mol$; $0{,}1a = 0{,}02$, suy ra $a = 0{,}2\\,M$."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Dung dịch $NaOH$ $0{,}1\\,M$ (điện li hoàn toàn) có pH bằng", "answer": "B", "explain": "$[OH^-] = 0{,}1 = 10^{-1}\\,M$ nên $pOH = 1$, suy ra $pH = 13$.", "options": ["A. $1$", "B. $13$", "C. $7$", "D. $10^{-1}$"]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Burette trong thí nghiệm chuẩn độ dùng để", "answer": "A", "explain": "Burette là ống đong có vạch chia chính xác, dùng để cho từ từ và đọc thể tích dung dịch chuẩn.", "options": ["A. đo chính xác thể tích dung dịch chuẩn đã dùng.", "B. đun nóng dung dịch.", "C. lọc kết tủa.", "D. cân hoá chất rắn."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch có $[OH^-] = 10^{-2}\\,M$ (ở $25^oC$) thì pH bằng", "answer": "B", "explain": "$pOH = 2$ nên $pH = 14 - 2 = 12$.", "options": ["A. $2$", "B. $12$", "C. $10$", "D. $7$"]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch X làm quỳ tím hoá đỏ. X có thể là dung dịch", "answer": "A", "explain": "Quỳ tím hoá đỏ trong môi trường acid; $HCl$ là acid.", "options": ["A. $HCl$.", "B. $NaOH$.", "C. $NaCl$.", "D. nước cất."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Trộn $50\\,mL$ dung dịch $HCl$ $0{,}1\\,M$ với $50\\,mL$ dung dịch $NaOH$ $0{,}08\\,M$. pH của dung dịch thu được là", "answer": "B", "explain": "$n_{H^+} = 0{,}005\\,mol$; $n_{OH^-} = 0{,}004\\,mol$; $H^+$ dư $0{,}001\\,mol$ trong $0{,}1\\,L$ nên $[H^+] = 0{,}01 = 10^{-2}\\,M$, $pH = 2$.", "options": ["A. $1$", "B. $2$", "C. $7$", "D. $12$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Có ba dung dịch cùng thể tích: A ($pH = 1$, $HCl$), B ($pH = 7$, $NaCl$), C ($pH = 13$, $NaOH$). Trộn cả ba lại với nhau, pH của dung dịch thu được gần nhất với", "answer": "A", "explain": "Gọi thể tích mỗi dung dịch là $V$: $n_{H^+} = 0{,}1V$ (từ A); $n_{OH^-} = 0{,}1V$ (từ C, vì $pH = 13$ nên $[OH^-] = 0{,}1$); trung hoà vừa đủ, B trung tính nên dung dịch sau có $pH = 7$.", "options": ["A. $7$", "B. $1$", "C. $13$", "D. $4$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về chuẩn độ acid – base:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng — các dụng cụ và chỉ thị cơ bản của chuẩn độ.", "statements": ["a) Burette dùng để đo chính xác thể tích dung dịch chuẩn.", "b) Phenolphtalein không màu trong môi trường acid.", "c) Methyl da cam có màu đỏ trong môi trường acid.", "d) Bình tam giác (erlen) dùng để đựng dung dịch cần chuẩn độ."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai về pH trong thực tế:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai — nước cam có tính acid ($pH$ khoảng $3$–$4$).", "statements": ["a) pH của đất ảnh hưởng tới sự sinh trưởng của cây trồng.", "b) Nước mưa có $pH \\lt 5{,}6$ được gọi là mưa acid.", "c) pH của máu người ổn định khoảng $7{,}4$.", "d) Nước cam vắt có $pH \\gt 7$."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dung dịch $HNO_3$ $0{,}1\\,M$ được pha loãng $100$ lần bằng nước cất. pH của dung dịch sau khi pha loãng là", "answer": "3", "explain": "Pha loãng $100$ lần: $[H^+]$ từ $10^{-1}$ còn $10^{-3}\\,M$ nên $pH = 3$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Chuẩn độ $15\\,mL$ dung dịch $NaOH$ bằng dung dịch $H_2SO_4$ $0{,}05\\,M$; tới điểm tương đương đã dùng hết $12\\,mL$ $H_2SO_4$. Tính nồng độ $mol/L$ của dung dịch $NaOH$.", "answer": "0,08", "explain": "$H_2SO_4 + 2NaOH \\rightarrow Na_2SO_4 + 2H_2O$ (tỉ lệ 1:2). $n_{H_2SO_4} = 0{,}05 \\times 0{,}012 = 0{,}0006\\,mol$ nên $n_{NaOH} = 0{,}0012\\,mol$; $C = 0{,}0012/0{,}015 = 0{,}08\\,M$."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nước tinh khiết (ở $25^oC$) có tính", "answer": "A", "explain": "Nước tinh khiết: $[H^+] = [OH^-] = 10^{-7}\\,M$ nên trung tính, $pH = 7$.", "options": ["A. trung tính ($pH = 7$).", "B. acid mạnh.", "C. base mạnh.", "D. acid yếu."]}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Dung dịch có $pOH = 5$ (ở $25^oC$) thì pH bằng", "answer": "A", "explain": "$pH + pOH = 14$ nên $pH = 14 - 5 = 9$.", "options": ["A. $9$", "B. $5$", "C. $14$", "D. $19$"]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dung dịch làm phenolphtalein chuyển sang màu hồng thì có", "answer": "A", "explain": "Phenolphtalein hoá hồng trong môi trường base ($pH$ khoảng $8{,}2$–$10$ trở lên).", "options": ["A. $pH \\gt 7$.", "B. $pH \\lt 7$.", "C. $pH = 7$.", "D. $pH = 0$."]}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi pha loãng một dung dịch acid bằng nước cất, pH của dung dịch sẽ", "answer": "A", "explain": "Pha loãng làm $[H^+]$ giảm nên pH tăng, tiến dần về $7$ nhưng không vượt quá $7$.", "options": ["A. tăng dần về $7$.", "B. giảm dần.", "C. không thay đổi.", "D. tăng vượt quá $7$."]}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho $10\\,mL$ dung dịch $HCl$ $1\\,M$ vào $90\\,mL$ nước cất. Nồng độ $[H^+]$ của dung dịch thu được là", "answer": "A", "explain": "Pha loãng $10$ lần: $[H^+]$ từ $1\\,M$ còn $0{,}1\\,M$.", "options": ["A. $0{,}1\\,M$", "B. $1\\,M$", "C. $0{,}01\\,M$", "D. $10\\,M$"]}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trộn $100\\,mL$ dung dịch $HCl$ $0{,}03\\,M$ với $100\\,mL$ dung dịch $NaOH$ $0{,}01\\,M$. pH của dung dịch thu được là", "answer": "A", "explain": "$n_{H^+} = 0{,}003\\,mol$; $n_{OH^-} = 0{,}001\\,mol$; $H^+$ dư $0{,}002\\,mol$ trong $0{,}2\\,L$ nên $[H^+] = 0{,}01 = 10^{-2}\\,M$, $pH = 2$.", "options": ["A. $2$", "B. $12$", "C. $7$", "D. $1$"]}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về Kw, pH và chuẩn độ:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai — xúc tác không ảnh hưởng tới cân bằng điện li của nước.", "statements": ["a) Ở $25^oC$, $K_w = 10^{-14}$.", "b) Ở $25^oC$, $pH + pOH = 14$.", "c) Điểm tương đương của chuẩn độ acid mạnh – base mạnh có $pH = 7$.", "d) Thêm chất xúc tác làm thay đổi pH của dung dịch."]}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Tính nhanh pH (ở $25^oC$). Xét tính đúng, sai:", "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng ($pOH = 1$). c) Đúng ($[H^+] = 10^{-2}$). d) Đúng — trung hoà vừa đủ.", "statements": ["a) Dung dịch $HCl$ $0{,}1\\,M$ có $pH = 1$.", "b) Dung dịch $NaOH$ $0{,}1\\,M$ có $pH = 13$.", "c) Pha loãng dung dịch $HCl$ $0{,}1\\,M$ đi $10$ lần được dung dịch $pH = 2$.", "d) Trộn $HCl$ $0{,}1\\,M$ và $NaOH$ $0{,}1\\,M$ với thể tích bằng nhau được dung dịch $pH = 7$."]}, {"type": "short", "level": "VD", "points": 0.5, "q": "Cần lấy bao nhiêu $mL$ dung dịch $NaOH$ $1\\,M$ để pha thành $500\\,mL$ dung dịch $NaOH$ $0{,}2\\,M$?", "answer": "100", "explain": "$C_1V_1 = C_2V_2$: $1 \\times V_1 = 0{,}2 \\times 500$, suy ra $V_1 = 100\\,mL$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Dung dịch A là $NaOH$ có $pH = 13$. Lấy $10\\,mL$ dung dịch A pha loãng thành $100\\,mL$ được dung dịch B. pH của B là", "answer": "12", "explain": "Pha loãng $10$ lần: $[OH^-]$ từ $10^{-1}$ còn $10^{-2}\\,M$ nên $pOH = 2$, $pH = 12$."}]}]}
