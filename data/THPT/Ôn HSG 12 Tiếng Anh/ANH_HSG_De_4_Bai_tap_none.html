<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 4","questions":[{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe findings ______ new light on the causes of the disease.","options":["A. shed","B. cast","C. threw","D. put"],"answer":"A","explain":"Đáp án A. Cụm cố định \"shed light on\" (làm sáng tỏ, soi sáng). B sai: \"cast\" đi với \"doubt/shadow\", không đi với \"light\". C sai: không có cụm \"throw light on\". D sai: không có cụm \"put light on\" với nghĩa này."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe professor's explanation ______; it clarified everything instantly.","options":["A. hit the hay","B. hit the nail on the head","C. hit the jackpot","D. hit the roof"],"answer":"B","explain":"Đáp án B. \"hit the nail on the head\" = nói trúng phóc, hoàn toàn chính xác (lời giải thích làm sáng tỏ mọi thứ). C sai: \"hit the jackpot\" = gặp may lớn, trúng số. D sai: \"hit the roof\" = nổi giận đùng đùng. A sai: \"hit the hay\" = đi ngủ."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe ______ weather forced the organizers to cancel the outdoor concert.","options":["A. disclement","B. inclemency","C. inclement","D. unclement"],"answer":"C","explain":"Đáp án C. \"inclement\" (tính từ, tiền tố \"in-\") nghĩa là thời tiết xấu, khắc nghiệt. B và A sai: không tồn tại trong tiếng Anh. B sai: \"inclemency\" là danh từ, không đứng trước danh từ \"weather\" để bổ nghĩa."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nAfter heated debate, the committee ______ the controversial proposal.","options":["A. voted out","B. voted off","C. voted in","D. voted down"],"answer":"D","explain":"Đáp án D. \"vote down\" = bác bỏ bằng biểu quyết. A sai: \"vote out\" = bãi nhiệm ai khỏi chức vụ. B sai: \"vote off\" = loại khỏi cuộc thi/chương trình. C sai: \"vote in\" = bầu chọn ai vào chức vụ, nghĩa ngược."},{"type":"mcq","level":"VDC","q":"Choose the sentence closest in meaning to the given sentence:\n\n\"The truth was revealed only when the documents were declassified.\"","options":["A. Only when the documents were declassified was the truth revealed.","B. Only when the documents were declassified the truth was revealed.","C. Only the documents' declassification that revealed the truth.","D. It was only the documents were declassified when the truth revealed."],"answer":"A","explain":"Đáp án A. \"Only when + mệnh đề\" ở đầu câu gây đảo ngữ: trợ động từ \"was\" đảo lên trước chủ ngữ \"the truth\". B sai: thiếu đảo ngữ. C sai: cấu trúc câu chẻ sai (\"that\" thừa, thiếu động từ chính). D sai: cấu trúc lủng củng, \"the truth revealed\" thiếu \"was\"."},{"type":"mcq","level":"VDC","q":"Choose the sentence closest in meaning to the given sentence:\n\n\"I prefer reading to watching television.\"","options":["A. I'd rather reading than watching television.","B. I would rather read than watch television.","C. I would prefer to read than watching television.","D. I prefer to read than to watch television."],"answer":"B","explain":"Đáp án B. \"would rather + V nguyên + than + V nguyên\" tương đương \"prefer + V-ing + to + V-ing\". C sai: sau \"would prefer\" phải là \"to read\" và \"rather than read\". D sai: \"prefer\" phải đi với \"to\", không đi với \"than\". A sai: sau \"would rather\" phải là động từ nguyên mẫu, không phải V-ing."},{"type":"mcq","level":"VDC","q":"There is ONE mistake in the sentence. Choose the underlined part (A, B, C or D) that needs correcting:\n\n(A) Hardly the ink had dried (B) on the contract when the company (C) announced it was (D) filing for bankruptcy.","options":["A. (C)","B. (D)","C. (A)","D. (B)"],"answer":"C","explain":"Đáp án C. \"Hardly\" ở đầu câu gây đảo ngữ: phải là \"Hardly had the ink dried\" (trợ động từ \"had\" đảo lên trước chủ ngữ). Phần (A) viết sai thứ tự từ. Các phần còn lại đúng (\"Hardly... when\" là cặp đúng)."},{"type":"mcq","level":"VDC","q":"There is ONE mistake in the sentence. Choose the underlined part (A, B, C or D) that needs correcting:\n\nShe (A) is one of the few scientists (B) who has challenged (C) the prevailing theory (D) of climate change.","options":["A. (C)","B. (D)","C. (A)","D. (B)"],"answer":"D","explain":"Đáp án D. Mệnh đề quan hệ \"who...\" bổ nghĩa cho \"scientists\" (số nhiều) trong cấu trúc \"one of the few + N số nhiều + who\", nên động từ phải là \"have challenged\". \"has\" là sai. Các phần còn lại đúng."},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the following statements are True (T) or False (F):\n\nHow should we do the most good with limited resources? Effective altruism, a philosophical movement founded in the 2000s, applies evidence and reason to this question, often reaching counterintuitive conclusions. Donating to a charity that trains guide dogs, for example, feels noble, yet the same money could fund cataract surgeries restoring sight to hundreds. Critics object that reducing morality to calculation drains it of humanity, and that unpredictable consequences make such calculations unreliable. Proponents concede uncertainty but argue that acting on best estimates still beats acting on sentiment. Whether or not one embraces the movement, it forces an uncomfortable question: is it enough to mean well, or must we also ensure our good intentions actually do good?","statements":["a) Effective altruism encourages donors to follow their emotions when choosing charities.","b) The guide dog example is used to show that intuitively appealing donations may not maximize impact.","c) Critics argue that effective altruism's calculations are always perfectly reliable.","d) The passage ends by questioning whether good intentions alone are morally sufficient."],"answer":["F","T","F","T"],"explain":"a) Sai: phong trào dùng \"evidence and reason\" (bằng chứng và lý trí) và cho rằng hành động theo ước tính tốt nhất \"beats acting on sentiment\" (hơn hành động theo cảm tính). b) Đúng: ví dụ chó dẫn đường cho thấy quyên góp theo cảm tính có thể kém hiệu quả hơn phẫu thuật đục thủy tinh thể. c) Sai: ngược lại, nhà phê bình cho rằng hậu quả khó lường khiến các tính toán \"unreliable\" (không đáng tin). d) Đúng: câu kết đặt câu hỏi liệu chỉ có ý tốt đã đủ hay phải đảm bảo ý tốt thực sự mang lại điều tốt."},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the following statements are True (T) or False (F):\n\nAs cities swell, sociologists worry about the erosion of social capital: the networks of trust and reciprocity that bind communities. Urban life offers diversity and opportunity, yet its anonymity can weaken neighborly bonds; residents of high-rise blocks often know fewer neighbors than villagers know fellow villagers. However, the picture is not uniformly bleak. Digital platforms enable new forms of community, from neighborhood forums to crowdfunding for local causes, suggesting social capital is mutating rather than simply vanishing. Researchers now distinguish between bonding capital (ties within groups) and bridging capital (ties across groups), finding cities excel at the latter. The challenge for urban planners is to design spaces, such as parks, markets, and community centers, where casual encounters can rebuild the trust that density alone cannot guarantee.","statements":["a) The passage claims that city dwellers have stronger neighborly ties than villagers.","b) Digital technology is presented as completely replacing traditional community bonds.","c) According to researchers, cities are particularly good at fostering connections between different groups.","d) The author believes urban design can help restore social trust."],"answer":["F","F","T","T"],"explain":"a) Sai: bài viết nói cư dân chung cư \"know fewer neighbors than villagers\" (biết ít hàng xóm hơn dân làng). b) Sai: công nghệ tạo \"new forms of community\", vốn xã hội \"mutating rather than simply vanishing\" (biến đổi chứ không biến mất), không phải thay thế hoàn toàn. c) Đúng: thành phố vượt trội ở \"bridging capital\" (vốn kết nối giữa các nhóm). d) Đúng: nhà quy hoạch cần thiết kế không gian để \"rebuild the trust\" (xây dựng lại niềm tin)."},{"type":"short","level":"VDC","q":"Give the correct form of the word in CAPITALS to complete the sentence. Write ONE word:\n\nVoters were frustrated by the candidate's ______ answers to direct questions. (EVADE)","answer":"evasive","explain":"Vị trí trước danh từ \"answers\" cần tính từ. Động từ EVADE (tránh né) chuyển thành tính từ \"evasive\" (tránh né, quanh co). Đáp án: evasive."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word:\n\n______ the storm warnings, the organizers refused to cancel the event.","answer":"despite","explain":"Cấu trúc \"Despite + N/V-ing\" (mặc dù) diễn tả sự nhượng bộ. \"Despite the storm warnings\" = mặc dù có cảnh báo bão. Đáp án: despite."}]}]}
