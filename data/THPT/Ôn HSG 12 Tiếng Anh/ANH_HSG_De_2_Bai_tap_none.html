<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 2","questions":[{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe minister's unexpected remarks ______ rise to speculation that a cabinet reshuffle was imminent.","options":["A. gave","B. raised","C. lifted","D. aroused"],"answer":"A","explain":"Đáp án A. Cụm cố định \"give rise to\" (gây ra, dẫn đến). B sai: \"raise\" đi với \"question/doubt/concern\" chứ không đi với \"rise\". C sai: \"lift\" không kết hợp với \"rise to\". D sai: \"arouse\" đi với \"suspicion/interest/curiosity\", không đi với \"rise\"."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nWith the election just days away, the outcome still ______.","options":["A. is on the cards","B. hangs in the balance","C. sits on the fence","D. stands on thin ice"],"answer":"B","explain":"Đáp án B. \"hang in the balance\" = chưa ngã ngũ, còn bỏ ngỏ (kết quả bầu cử chưa rõ). C sai: \"sit on the fence\" chỉ người không chịu chọn phe, không dùng cho \"outcome\". D sai: \"on thin ice\" = trong tình thế rủi ro (dùng cho người). A sai: \"be on the cards\" = có khả năng cao xảy ra, nghĩa ngược với \"vẫn chưa rõ\"."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nDespite the ______ of his argument, few were persuaded by his conclusions.","options":["A. cogitation","B. cognition","C. cogency","D. cogence"],"answer":"C","explain":"Đáp án C. Tính từ \"cogent\" (có sức thuyết phục) có danh từ là \"cogency\". D sai: \"cogence\" không tồn tại. A sai: \"cogitation\" = hành động suy nghĩ, suy ngẫm, sai nghĩa. B sai: \"cognition\" = quá trình nhận thức, sai nghĩa trong ngữ cảnh này."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe CEO's sudden resignation ______ rumors of an impending takeover.","options":["A. set out","B. set forth","C. set about","D. set off"],"answer":"D","explain":"Đáp án D. \"set off\" = gây ra, châm ngòi (tin đồn). A sai: \"set out\" = bắt đầu hành trình hoặc bắt tay vào việc (\"set out to do\"). B sai: \"set forth\" = trình bày (ý kiến, quan điểm), văn phong trang trọng. C sai: \"set about\" = bắt đầu làm việc gì."},{"type":"mcq","level":"VDC","q":"Choose the sentence closest in meaning to the given sentence:\n\n\"She didn't study hard, so she isn't a doctor now.\"","options":["A. If she had studied hard, she would be a doctor now.","B. If she studied hard, she would have been a doctor now.","C. Had she studied hard, she would have been a doctor now.","D. If she had studied hard, she would have been a doctor now."],"answer":"A","explain":"Đáp án A. Đây là câu điều kiện hỗn hợp: điều kiện không có thật ở quá khứ (If + had + V3/ed) dẫn tới kết quả ở hiện tại (would + V nguyên). B sai: điều kiện loại 2 (hiện tại) không khớp \"didn't study\" (quá khứ). C và D sai: \"would have been\" diễn tả kết quả trong quá khứ, trong khi câu gốc nói \"isn't a doctor now\" (hiện tại)."},{"type":"mcq","level":"VDC","q":"Choose the sentence closest in meaning to the given sentence:\n\n\"It is believed that the thief entered through the basement window.\"","options":["A. People believe that the thief had entered through the basement window.","B. The thief is believed to have entered through the basement window.","C. The thief is believed to enter through the basement window.","D. That the thief entered through the basement window is believed."],"answer":"B","explain":"Đáp án B. Cấu trúc bị động đặc biệt: S + be + believed + to have + V3/ed khi hành động được tường thuật xảy ra trước thời điểm nói (\"entered\" đã xảy ra). C sai: \"to enter\" (nguyên mẫu) chỉ dùng khi hành động đồng thời hoặc sau. D sai: cấu trúc gượng ép, không tự nhiên. A sai: tự ý đổi thì thành quá khứ hoàn thành, sai nghĩa gốc."},{"type":"mcq","level":"VDC","q":"There is ONE mistake in the sentence. Choose the underlined part (A, B, C or D) that needs correcting:\n\nThe (A) newly discovery (B) of a distant exoplanet has (C) reignited debate about the (D) possibility of extraterrestrial life.","options":["A. (C)","B. (D)","C. (A)","D. (B)"],"answer":"C","explain":"Đáp án C. Lỗi từ loại: trước danh từ \"discovery\" cần tính từ \"new\", không dùng trạng từ \"newly\" (trạng từ chỉ bổ nghĩa cho động từ/tính từ/trạng từ khác). Các phần còn lại đều đúng."},{"type":"mcq","level":"VDC","q":"There is ONE mistake in the sentence. Choose the underlined part (A, B, C or D) that needs correcting:\n\nEach of the (A) participants was asked to submit (B) their proposals before (C) the deadline, but only half of (D) them complied.","options":["A. (C)","B. (D)","C. (A)","D. (B)"],"answer":"D","explain":"Đáp án D. Lỗi hòa hợp đại từ: chủ ngữ \"Each\" là số ít (động từ \"was\"), nên đại từ sở hữu phải là số ít \"his or her\" (hoặc \"his/her\"), không dùng \"their\" số nhiều. Các phần còn lại đúng."},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the following statements are True (T) or False (F):\n\nWhen our actions contradict our beliefs, we experience an uncomfortable tension psychologists call cognitive dissonance. Rather than admitting we were wrong, we typically adjust our beliefs to justify our behavior. In a classic experiment, participants paid a small sum to lie about a boring task later rated the task as more enjoyable than those paid generously: the poorly paid needed to convince themselves the lie had been worthwhile. This mechanism explains phenomena from buyer's remorse to the persistence of failed policies: having invested heavily, people convince themselves the investment was sound. Recognizing dissonance does not eliminate it, but awareness allows more honest self-examination before beliefs harden into dogma.","statements":["a) People usually resolve cognitive dissonance by changing their behavior to match their beliefs.","b) The experiment described suggests that larger rewards produce stronger attitude change.","c) Cognitive dissonance can help explain why people defend decisions that have proven unsuccessful.","d) The passage claims that understanding cognitive dissonance completely removes its influence."],"answer":["F","F","T","F"],"explain":"a) Sai: con người thường điều chỉnh niềm tin để biện minh cho hành vi, chứ không đổi hành vi cho khớp niềm tin. b) Sai: ngược lại, nhóm được trả ít tiền đánh giá công việc thú vị hơn (cần tự thuyết phục lời nói dối là xứng đáng). c) Đúng: cơ chế này giải thích việc bảo vệ chính sách thất bại (\"persistence of failed policies\"). d) Sai: bài viết nói rõ nhận biết bất hòa nhận thức \"does not eliminate it\"."},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the following statements are True (T) or False (F):\n\nRewilding, the restoration of ecosystems by reintroducing native species and reducing human intervention, has moved from fringe idea to mainstream conservation strategy. Proponents point to Yellowstone, where the return of wolves curbed elk overgrazing, allowing vegetation and beaver populations to recover in a trophic cascade. Yet rewilding remains controversial. Farmers fear predation on livestock, while critics question whether humans can ever truly step back from landscapes shaped by millennia of use. Advocates counter that rewilding need not mean abandoning land: carefully managed projects can coexist with agriculture and even boost rural economies through ecotourism. The debate reflects a deeper question: should conservation aim to restore a vanished past, or manage nature for an uncertain future?","statements":["a) The Yellowstone example is used to illustrate how rewilding can trigger positive chain effects in an ecosystem.","b) All stakeholders agree that rewilding is the best approach to conservation.","c) Supporters of rewilding believe it is incompatible with farming and rural livelihoods.","d) The passage suggests the rewilding debate is ultimately about the goals of conservation itself."],"answer":["T","F","F","T"],"explain":"a) Đúng: ví dụ Yellowstone minh họa \"trophic cascade\" (hiệu ứng dây chuyền dinh dưỡng) tích cực. b) Sai: bài nhấn mạnh rewilding \"remains controversial\" (nông dân lo sợ, nhà phê bình hoài nghi). c) Sai: ngược lại, phe ủng hộ cho rằng dự án được quản lý tốt \"can coexist with agriculture\" và thúc đẩy kinh tế nông thôn. d) Đúng: câu kết nêu câu hỏi cốt lõi về mục tiêu của bảo tồn."},{"type":"short","level":"VDC","q":"Give the correct form of the word in CAPITALS to complete the sentence. Write ONE word:\n\nThe diplomat's ______ tone helped defuse a potentially explosive situation. (CONCILIATE)","answer":"conciliatory","explain":"Vị trí trước danh từ \"tone\" cần một tính từ. Động từ CONCILIATE (xoa dịu, hòa giải) chuyển thành tính từ \"conciliatory\" (có tính xoa dịu, hòa giải). Đáp án: conciliatory."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word:\n\n______ from its economic benefits, the project has created thousands of jobs.","answer":"apart","explain":"Cụm \"apart from\" nghĩa là \"ngoài... ra\" (bên cạnh lợi ích kinh tế, dự án còn tạo việc làm). Đáp án: apart."}]}]}
