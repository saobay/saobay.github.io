<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 5","questions":[{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe audit ______ several irregularities in the procurement process.","options":["A. brought to light","B. brought to life","C. brought to mind","D. brought to bear"],"answer":"A","explain":"Đáp án A. \"bring to light\" = phơi bày, phát hiện (cuộc kiểm toán phát hiện sai phạm). B sai: \"bring to life\" = làm sống động, thổi hồn. C sai: \"bring to mind\" = gợi nhớ. D sai: \"bring to bear\" = vận dụng, gây áp lực."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe politician's tearful apology was ______, fooling no one.","options":["A. sour grapes","B. crocodile tears","C. a wolf in sheep's clothing","D. a snake in the grass"],"answer":"B","explain":"Đáp án B. \"crocodile tears\" = nước mắt cá sấu, sự hối lỗi giả tạo (không lừa được ai). C sai: \"a wolf in sheep's clothing\" = kẻ đội lốt người tốt, chỉ người chứ không chỉ lời xin lỗi. D sai: \"a snake in the grass\" = kẻ phản trắc ẩn mình. A sai: \"sour grapes\" = chê bai thứ mình không có được."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nWidespread ______ among voters led to the lowest turnout in decades.","options":["A. apathness","B. apathia","C. apathy","D. apathism"],"answer":"C","explain":"Đáp án C. \"apathy\" (danh từ, gốc Hy Lạp a- + pathos) = sự thờ ơ, lãnh đạm. B, C, D đều không tồn tại trong tiếng Anh chuẩn (bẫy hậu tố giả \"-ism/-ness\" và biến thể sai chính tả)."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe government decided to ______ the outdated regulations.","options":["A. do up","B. do over","C. do in","D. do away with"],"answer":"D","explain":"Đáp án D. \"do away with\" = bãi bỏ, loại bỏ (quy định lỗi thời). A sai: \"do up\" = sửa sang, thắt chặt. B sai: \"do over\" = làm lại. C sai: \"do in\" = giết, làm kiệt sức."},{"type":"mcq","level":"VDC","q":"Choose the sentence closest in meaning to the given sentence:\n\n\"He not only cheated in the exam but also bribed the invigilator.\"","options":["A. Not only did he cheat in the exam, but he also bribed the invigilator.","B. Not only he cheated in the exam, but also he bribed the invigilator.","C. Not only did he cheat in the exam but also bribed the invigilator.","D. Not only he did cheat in the exam, but he also bribed the invigilator."],"answer":"A","explain":"Đáp án A. \"Not only\" ở đầu câu gây đảo ngữ (did + S + V) và cấu trúc song hành đầy đủ \"Not only did he cheat..., but he also bribed...\". B sai: thiếu đảo ngữ sau \"Not only\". C sai: vế sau \"but also\" thiếu chủ ngữ \"he\", phá vỡ song hành. D sai: sai vị trí đảo ngữ (\"he did cheat\" thay vì \"did he cheat\")."},{"type":"mcq","level":"VDC","q":"Choose the sentence closest in meaning to the given sentence:\n\n\"If you work harder, you will achieve more.\"","options":["A. The more hard you work, the more you achieve.","B. The harder you work, the more you will achieve.","C. Harder you work, more you will achieve.","D. The harder you work, the more will you achieve."],"answer":"B","explain":"Đáp án B. Cấu trúc so sánh kép \"The + so sánh hơn + S + V, the + so sánh hơn + S + V\" (càng... càng...). C sai: thiếu mạo từ \"the\". D sai: vế kết quả không đảo ngữ (\"the more you will achieve\" mới đúng). A sai: \"more hard\" sai, phải là \"harder\"."},{"type":"mcq","level":"VDC","q":"There is ONE mistake in the sentence. Choose the underlined part (A, B, C or D) that needs correcting:\n\nThe (A) committee were (B) divided in (C) its opinion on whether to approve (D) the merger.","options":["A. (C)","B. (D)","C. (A)","D. (B)"],"answer":"C","explain":"Đáp án C. Danh từ tập hợp \"committee\" ở đây được đối xử như số ít (bằng chứng là đại từ \"its\" ở phần C), nên động từ phải là \"was\", không phải \"were\". Các phần còn lại đúng."},{"type":"mcq","level":"VDC","q":"There is ONE mistake in the sentence. Choose the underlined part (A, B, C or D) that needs correcting:\n\n(A) Despite of the heavy rain, (B) the match continued (C) until the referee decided (D) to abandon it.","options":["A. (B)","B. (C)","C. (D)","D. (A)"],"answer":"D","explain":"Đáp án D. Lỗi giới từ: \"Despite\" không đi với \"of\" (phải là \"Despite the heavy rain\" hoặc \"In spite of the heavy rain\"). Các phần còn lại đúng."},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the following statements are True (T) or False (F):\n\nNatural selection is often caricatured as nature red in tooth and claw, yet cooperation is everywhere: bees sacrifice themselves for the hive, vampire bats share blood with hungry roost-mates. Evolutionary biologists explain such altruism through kin selection, in which helping relatives propagates shared genes, and reciprocal altruism, where favors are repaid over time. Game theory models show that in repeated interactions, cooperative strategies like tit-for-tat outperform pure selfishness. Still, cooperation remains vulnerable to cheaters who take benefits without paying costs, which is why mechanisms for detecting and punishing defectors evolve alongside it. Far from contradicting Darwin, cooperation reveals selection operating at multiple levels, favoring traits that help groups, and the genes within them, survive.","statements":["a) The passage suggests that cooperation in nature contradicts the theory of evolution.","b) Kin selection explains cooperation as a way of promoting the survival of shared genes.","c) According to game theory, selfish strategies always win in repeated interactions.","d) The passage indicates that punishment of cheaters plays a role in sustaining cooperation."],"answer":["F","T","F","T"],"explain":"a) Sai: bài viết khẳng định hợp tác \"Far from contradicting Darwin\" (hoàn toàn không mâu thuẫn với Darwin). b) Đúng: chọn lọc họ hàng là giúp đỡ người thân để lan truyền gen chung. c) Sai: ngược lại, chiến lược hợp tác \"outperform pure selfishness\" (vượt trội hơn ích kỷ thuần túy) trong tương tác lặp lại. d) Đúng: cơ chế phát hiện và trừng phạt kẻ gian lận tiến hóa song song để duy trì hợp tác."},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the following statements are True (T) or False (F):\n\nWhat makes art valuable: the object, the skill, or the human behind it? The question has sharpened as AI systems produce images indistinguishable from human-made works. Traditionalists insist art requires intention: a painting matters because someone meant something by it. Others counter that viewers respond to the work itself, not its biography; few admirers of a melody inquire about the composer's motives. Markets, meanwhile, price scarcity and story as much as beauty: a canvas by a famous hand commands millions partly because only one hand made it. Perhaps the AI debate reveals less about machines than about ourselves: we value art not only for how it looks or sounds, but for the human connection it promises, a promise no algorithm can sign.","statements":["a) AI-generated images are described as easily distinguishable from human-made art.","b) Traditionalists believe artistic value depends on the creator's intention.","c) The passage states that art markets value only aesthetic beauty.","d) The author suggests people value art partly for the human connection it represents."],"answer":["F","T","F","T"],"explain":"a) Sai: ảnh do AI tạo ra được mô tả là \"indistinguishable\" (không thể phân biệt) với tác phẩm của con người. b) Đúng: phe truyền thống cho rằng nghệ thuật cần \"intention\" (ý đồ của tác giả). c) Sai: thị trường định giá \"scarcity and story as much as beauty\" (sự khan hiếm và câu chuyện cũng như vẻ đẹp), không chỉ vẻ đẹp. d) Đúng: câu kết nói ta trân trọng nghệ thuật vì \"the human connection it promises\" (kết nối con người mà nó hứa hẹn)."},{"type":"short","level":"VDC","q":"Give the correct form of the word in CAPITALS to complete the sentence. Write ONE word:\n\nCritics praised the novel's ______ prose and vivid imagery. (LYRIC)","answer":"lyrical","explain":"Vị trí trước danh từ \"prose\" cần tính từ. Danh từ LYRIC (lời bài hát, chất trữ tình) chuyển thành tính từ \"lyrical\" (trữ tình, giàu chất thơ). Đáp án: lyrical."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word:\n\n______ hard the committee tried, no consensus could be reached.","answer":"however","explain":"Cấu trúc nhượng bộ \"However + adj/adv + S + V\" (dù... đến đâu): \"However hard the committee tried\" = dù ủy ban đã cố gắng đến đâu. Đáp án: however."}]}]}
