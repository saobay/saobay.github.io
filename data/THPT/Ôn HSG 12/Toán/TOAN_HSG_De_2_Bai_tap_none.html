<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 2","questions": [{"type": "mcq","level": "VDC","q": "Phương trình $4^x - m \\cdot 2^{x+1} + 2m = 0$ có hai nghiệm thực phân biệt $x_1, x_2$ thỏa mãn $x_1 + x_2 = 2$. Khẳng định nào sau đây đúng?","options": ["A. $m = 1$","B. $m = 2$","C. $m = 3$","D. Không tồn tại giá trị nào của $m$"],"answer": "D","explain": "Hướng tư duy: đặt ẩn phụ để đưa về bậc hai, nhưng đừng quên điều kiện \"hai $x$ phân biệt\" mạnh hơn \"hai $t$ phân biệt\" — và dùng Viète kết hợp với $x_1+x_2=2$ để khóa $m$ trước khi kiểm tra. Đặt $t = 2^x \\gt 0$, phương trình thành $t^2-2mt+2m = 0$. Nếu có hai $x$ phân biệt với $x_1+x_2 = 2$ thì $t_1 t_2 = 2^{x_1+x_2} = 4$. Theo Viète, $t_1 t_2 = 2m$, suy ra $2m = 4$, tức $m = 2$. Thử lại với $m = 2$: phương trình thành $t^2-4t+4 = (t-2)^2 = 0$, nghiệm kép $t = 2$, chỉ cho một giá trị $x = 1$ (không phải hai nghiệm phân biệt). Vậy không tồn tại $m$ thỏa mãn đồng thời cả hai điều kiện.","points": 0.25},{"type": "mcq","level": "VDC","q": "Có bao nhiêu giá trị nguyên của $m$ để bất phương trình $\\log_{1/2}(x^2 + 2mx + 4) \\ge -2$ nghiệm đúng với mọi $x \\in [1; 2]$?","options": ["A. $1$","B. $2$","C. $3$","D. $0$"],"answer": "A","explain": "Hướng tư duy: cơ số nhỏ hơn $1$ nên bất phương trình log tương đương với $0 \\lt$ biểu thức $\\le 4$; vế phải cho điều kiện chặn trên của $m$, vế trái (điều kiện xác định) cho điều kiện chặn dưới — cả hai đều phải đúng với mọi $x$ trong đoạn. Vì cơ số $1/2 \\lt 1$ nên $\\log_{1/2}(u) \\ge -2$ tương đương $0 \\lt u \\le (1/2)^{-2} = 4$, với $u = x^2+2mx+4$. Điều kiện $u \\le 4$ trên $[1;2]$: $x^2+2mx \\le 0$, tức $x(x+2m) \\le 0$; do $x \\gt 0$ nên $x+2m \\le 0$ với mọi $x \\in [1;2]$, suy ra $2m \\le -2$, tức $m \\le -1$. Điều kiện $u \\gt 0$: $h(x) = x^2+2mx+4$ có đỉnh tại $x = -m \\ge 1$. Nếu $1 \\le -m \\le 2$ (tức $-2 \\le m \\le -1$) thì $\\min h = h(-m) = 4-m^2 \\gt 0$ cho $m \\in (-2; -1]$; nếu $-m \\gt 2$ (tức $m \\lt -2$) thì $h$ nghịch biến trên $[1;2]$, $\\min h = h(2) = 8+4m \\gt 0$ cho $m \\gt -2$, mâu thuẫn. Vậy $-2 \\lt m \\le -1$, số nguyên duy nhất là $m = -1$ (kiểm tra: $m = -2$ làm $u = 0$ tại $x = 2$, log không xác định). Đáp số $1$.","points": 0.25},{"type": "mcq","level": "VDC","q": "Hệ phương trình $\\begin{cases} \\log_2(x + y) = 3 \\\\ 4^x + 4^y = 40 \\end{cases}$ có bao nhiêu nghiệm $(x; y)$?","options": ["A. $0$","B. $1$","C. $2$","D. $4$"],"answer": "A","explain": "Hướng tư duy: đừng lao vào giải trực tiếp; từ phương trình đầu rút ra tích $4^x \\cdot 4^y$ là hằng số, rồi dùng bất đẳng thức AM-GM để thấy tổng $4^x+4^y$ không thể nhỏ như vế phải. Từ $\\log_2(x+y) = 3$ được $x+y = 8$ (điều kiện $x+y \\gt 0$ thỏa mãn). Đặt $a = 4^x \\gt 0$, $b = 4^y \\gt 0$; khi đó $ab = 4^{x+y} = 4^8$ và $a+b = 40$. Theo AM-GM, $a+b \\ge 2\\sqrt{ab} = 2 \\cdot 4^4 = 512 \\gt 40$, mâu thuẫn. (Tương đương: $a, b$ là nghiệm của $t^2-40t+4^8 = 0$ có $\\Delta = 1600-4\\cdot 65536 \\lt 0$.) Vậy hệ vô nghiệm.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho hàm số $f(x)$ liên tục trên $\\mathbb{R}$ thỏa mãn $f(x) + 2f(1 - x) = 3x$ với mọi $x$. Tính $I = \\int_0^1 f(x)\\,dx$.","options": ["A. $\\frac{1}{2}$","B. $1$","C. $\\frac{3}{2}$","D. $2$"],"answer": "A","explain": "Hướng tư duy: đây là dạng \"hàm ẩn đối xứng\" — không thể tìm $f$ trực tiếp, nhưng phép đổi biến $u = 1-x$ biến $\\int_0^1 f(1-x)\\,dx$ thành chính $I$, rồi lấy tích phân hai vế của đẳng thức đã cho. Đặt $u = 1-x$ thì $\\int_0^1 f(1-x)\\,dx = \\int_1^0 f(u)(-du) = \\int_0^1 f(u)\\,du = I$. Lấy tích phân từ $0$ đến $1$ hai vế của $f(x)+2f(1-x) = 3x$: $\\int_0^1 f(x)\\,dx + 2\\int_0^1 f(1-x)\\,dx = \\int_0^1 3x\\,dx$, tức $I + 2I = \\frac{3}{2}$. Vậy $I = \\frac{1}{2}$.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho $x, y$ là các số thực dương thỏa mãn $\\log_3(x^2 + y^2) = 1 + \\log_3(xy)$. Khẳng định nào sau đây đúng về $P = x + y$?","options": ["A. $P$ có giá trị lớn nhất bằng $2\\sqrt{5}$","B. $P$ có giá trị lớn nhất bằng $5$","C. $P$ không có giá trị lớn nhất","D. $P$ có giá trị lớn nhất bằng $10$"],"answer": "C","explain": "Hướng tư duy: điều kiện log thực chất khóa chặt tỉ số $y/x$ (đưa về phương trình bậc hai của tỉ số), khi đó $P$ tỉ lệ với $x$ và $x$ tự do tiến ra vô cùng. Điều kiện tương đương $x^2+y^2 = 3xy$ (và $xy \\gt 0$). Chia hai vế cho $x^2$, đặt $t = y/x \\gt 0$: $1+t^2 = 3t$, tức $t^2-3t+1 = 0$, được $t = \\frac{3\\pm\\sqrt{5}}{2}$ (hằng số). Vậy $y = tx$ với $t$ cố định, $P = x(1+t)$ với $x \\gt 0$ tùy ý, nên $P$ có thể lớn tùy ý — không có giá trị lớn nhất. (Tương tự $P$ cũng không có giá trị nhỏ nhất dương.)","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho $\\log_{12} 6 = a$ và $\\log_{12} 7 = b$. Giá trị của $\\log_2 7$ tính theo $a, b$ là","options": ["A. $\\frac{b}{1-a}$","B. $\\frac{b}{1+a}$","C. $\\frac{1-a}{b}$","D. $\\frac{a}{1-b}$"],"answer": "A","explain": "Hướng tư duy: đưa tất cả về logarit tự nhiên (hoặc cùng một cơ số) của các thừa số nguyên tố $2, 3, 7$; từ giả thiết lập hệ hai phương trình rồi khử để được tỉ số cần tìm. Đặt $x = \\ln 2$, $y = \\ln 3$, $z = \\ln 7$. Khi đó $a = \\frac{x+y}{2x+y}$ và $b = \\frac{z}{2x+y}$. Từ phương trình đầu: $x+y = a(2x+y)$, suy ra $x(1-2a) = y(a-1)$, được $y = x\\frac{1-2a}{a-1}$. Mẫu số chung $2x+y = 2x + x\\frac{1-2a}{a-1} = x\\left(2+\\frac{1-2a}{a-1}\\right) = x\\cdot\\frac{-1}{a-1} = \\frac{x}{1-a}$. Do đó $b = \\frac{z}{x/(1-a)}$, suy ra $\\frac{z}{x} = \\frac{b}{1-a}$, tức $\\log_2 7 = \\frac{b}{1-a}$.","points": 0.25},{"type": "truefalse","level": "VDC","q": "Cho phương trình $\\log_2(x^2 + 1) - \\log_2(x + m) = 1$ với $m$ là tham số. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Với $m = 2$, phương trình có hai nghiệm phân biệt.","b) Với $m = 0$, phương trình có nghiệm duy nhất $x = 1$.","c) Với mọi $m \\gt 0$, phương trình đều có nghiệm.","d) Có đúng $2$ giá trị nguyên âm của $m$ để phương trình vô nghiệm."],"answer": ["T","T","T","F"],"explain": "Điều kiện: $x^2+1 \\gt 0$ luôn đúng; $x+m \\gt 0$, tức $x \\gt -m$. Phương trình tương đương $\\frac{x^2+1}{x+m} = 2$, tức $x^2-2x+1-2m = 0$, hay $(x-1)^2 = 2m$. a) Đúng: $m = 2$ cho $(x-1)^2 = 4$, $x = 3$ hoặc $x = -1$, cả hai đều thỏa $x \\gt -2$. b) Đúng: $m = 0$ cho $x = 1$ (thỏa $x \\gt 0$). c) Đúng: $m \\gt 0$ cho $x = 1\\pm\\sqrt{2m}$; nghiệm lớn $1+\\sqrt{2m} \\gt -m$ luôn đúng vì $1+\\sqrt{2m}+m \\gt 0$. d) Sai: với mọi $m \\lt 0$ thì $(x-1)^2 = 2m \\lt 0$ vô nghiệm, tức có vô số (chứ không phải đúng $2$) giá trị nguyên âm làm phương trình vô nghiệm.","points": 1},{"type": "truefalse","level": "VDC","q": "Cho hàm số $f(x)$ liên tục trên $[-1; 1]$ thỏa mãn $f(x) + f(-x) = 2x^2 + 2$ với mọi $x$. Đặt $I = \\int_{-1}^1 f(x)\\,dx$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $I = \\frac{8}{3}$.","b) $\\int_{-1}^1 [f(x) - x^2]\\,dx = 2$.","c) Hàm số $g(x) = f(x) - x^2 - 1$ là hàm số lẻ.","d) $\\int_{-1}^1 g(x)\\,dx = 1$."],"answer": ["T","T","T","F"],"explain": "Hướng tư duy: với điều kiện đối xứng $f(x)+f(-x)$, phép đổi biến $u = -x$ cho thấy $\\int_{-1}^1 f(-x)\\,dx = \\int_{-1}^1 f(x)\\,dx$. a) Đúng: lấy tích phân hai vế trên $[-1;1]$ được $I + I = \\int_{-1}^1 (2x^2+2)\\,dx = \\left[\\frac{2x^3}{3}+2x\\right]_{-1}^1 = \\frac{16}{3}$, nên $I = \\frac{8}{3}$. b) Đúng: $\\int_{-1}^1 x^2\\,dx = \\frac{2}{3}$ nên hiệu bằng $\\frac{8}{3}-\\frac{2}{3} = 2$. c) Đúng: $g(x)+g(-x) = [f(x)+f(-x)]-2x^2-2 = 0$, tức $g(-x) = -g(x)$. d) Sai: tích phân của hàm lẻ trên đoạn đối xứng bằng $0$, không phải $1$.","points": 1},{"type": "short","level": "VDC","q": "Tích các nghiệm của phương trình $\\log_2 x \\cdot \\log_3 x = \\log_2 x + \\log_3 x$ là bao nhiêu?","answer": "12","explain": "Hướng tư duy: điều kiện $x \\gt 0$; nhận ra $x = 1$ là một nghiệm hiển nhiên (hai vế cùng bằng $0$), với $x \\ne 1$ thì chia hai vế cho $\\log_2 x$ để đưa về phương trình một ẩn. Với $x = 1$: hai vế đều bằng $0$, nhận. Với $x \\ne 1$ (tức $\\log_2 x \\ne 0$), chia hai vế cho $\\log_2 x$: $\\log_3 x = 1 + \\frac{\\log_3 x}{\\log_2 x}$. Đặt $t = \\log_2 x \\ne 0$; vì $\\log_3 x = \\frac{t}{\\log_2 3}$ nên phương trình thành $\\frac{t^2}{\\log_2 3} = t\\left(1+\\frac{1}{\\log_2 3}\\right)$, suy ra $t = \\log_2 3 + 1 = \\log_2 6$, tức $x = 6$. Vậy phương trình có hai nghiệm $x = 1$ và $x = 6$ (thử lại đều thỏa), tích bằng $12$.","points": 0.5},{"type": "short","level": "VDC","q": "Cho $I = \\int_0^{\\pi/2} \\frac{\\sin x}{\\sin x + \\cos x}\\,dx = a\\pi + b$ với $a, b$ là các số hữu tỉ. Tính $a + b$ (viết dưới dạng số thập phân).","answer": "0.25","explain": "Hướng tư duy: đây là tích phân \"cặp đối xứng\" kinh điển — đổi biến $u = \\pi/2-x$ sẽ hoán đổi vai trò $\\sin \\leftrightarrow \\cos$. Đặt $J = \\int_0^{\\pi/2} \\frac{\\cos x}{\\sin x+\\cos x}\\,dx$. Đổi biến $u = \\pi/2-x$ trong $I$: $\\sin x = \\cos u$, $\\cos x = \\sin u$, ta được $I = \\int_0^{\\pi/2} \\frac{\\cos u}{\\sin u+\\cos u}\\,du = J$. Mặt khác $I+J = \\int_0^{\\pi/2} 1\\,dx = \\frac{\\pi}{2}$. Suy ra $I = \\frac{\\pi}{4}$, tức $a = \\frac{1}{4}$, $b = 0$, $a+b = 0.25.","points": 0.5}]}]}
