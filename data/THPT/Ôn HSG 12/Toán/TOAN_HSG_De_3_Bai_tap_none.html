<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 3","questions": [{"type": "mcq","level": "VDC","q": "Có bao nhiêu số nguyên tố $p$ sao cho $p^2 + 2$ cũng là số nguyên tố?","options": ["A. $0$","B. $1$","C. $2$","D. Vô số"],"answer": "B","explain": "Hướng tư duy: với bài toán nguyên tố dạng đa thức, xét các giá trị nhỏ trực tiếp rồi dùng đồng dư để loại toàn bộ các giá trị lớn. Thử $p = 2$: $p^2+2 = 6$ là hợp số. Thử $p = 3$: $p^2+2 = 11$ là số nguyên tố (nhận). Với $p \\gt 3$: $p$ không chia hết cho $3$ nên $p^2 \\equiv 1 \\pmod{3}$, suy ra $p^2+2 \\equiv 0 \\pmod{3}$; mặt khác $p^2+2 \\gt 3$ nên là hợp số. Vậy chỉ có đúng $1$ số nguyên tố $p = 3$ thỏa mãn.","points": 0.25},{"type": "mcq","level": "VDC","q": "Số nghiệm nguyên dương của phương trình $x^2 - y^2 = 2025$ là","options": ["A. $6$","B. $7$","C. $8$","D. $15$"],"answer": "B","explain": "Hướng tư duy: phân tích hiệu hai bình phương thành tích, rồi đếm cặp ước — chú ý điều kiện $x, y$ nguyên dương loại đi cặp ước bằng nhau, còn tính chẵn lẻ tự thỏa vì $2025$ lẻ. Ta có $(x-y)(x+y) = 2025 = 3^4 \\cdot 5^2$. Đặt $d = x-y$, $e = x+y$ ($0 \\lt d \\lt e$, $de = 2025$); khi đó $x = (d+e)/2$, $y = (e-d)/2$ nguyên dương. Vì $2025$ lẻ nên $d, e$ cùng lẻ, $x, y$ luôn nguyên. Số ước dương của $2025$ là $(4+1)(2+1) = 15$, gồm cặp $d = e = 45$ (cho $y = 0$, loại vì cần $y \\gt 0$) và $7$ cặp $d \\lt e$ còn lại, mỗi cặp cho đúng một nghiệm $(x; y)$ nguyên dương. Vậy có $7$ nghiệm.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho dãy số $(u_n)$ xác định bởi $u_1 = 2$ và $u_{n+1} = \\frac{u_n^2 + 2}{2u_n}$ với mọi $n \\ge 1$. Giới hạn $\\lim u_n$ bằng","options": ["A. $1$","B. $\\sqrt{2}$","C. $2$","D. Dãy số không hội tụ"],"answer": "B","explain": "Hướng tư duy: đây là công thức Newton tìm $\\sqrt{2}$; chứng minh dãy giảm và bị chặn dưới bằng cách xét hiệu $u_{n+1}-\\sqrt{2}$ (phân tích thành bình phương) rồi chuyển giới hạn qua công thức truy hồi. Ta có $u_{n+1}-\\sqrt{2} = \\frac{u_n^2+2-2\\sqrt{2}u_n}{2u_n} = \\frac{(u_n-\\sqrt{2})^2}{2u_n} \\ge 0$ nên $u_n \\ge \\sqrt{2}$ với $n \\ge 2$ (và $u_n \\gt 0$). Mặt khác $u_{n+1}-u_n = \\frac{2-u_n^2}{2u_n} \\le 0$ khi $u_n \\ge \\sqrt{2}$, nên $(u_n)$ giảm và bị chặn dưới, hội tụ về $L \\ge \\sqrt{2}$. Chuyển giới hạn qua công thức truy hồi: $L = \\frac{L^2+2}{2L}$, suy ra $L^2 = 2$, tức $L = \\sqrt{2}$.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cho dãy số $(u_n)$ tăng và là một cấp số cộng thỏa mãn $u_1 + u_4 + u_{10} = 69$, đồng thời $u_1$, $u_2+1$, $u_3+14$ theo thứ tự lập thành một cấp số nhân. Tổng của $20$ số hạng đầu tiên của dãy số $(u_n)$ bằng","options": ["A. $1010$","B. $2020$","C. $505$","D. $-5590$"],"answer": "A","explain": "Hướng tư duy: dùng công thức số hạng tổng quát để đưa cả hai điều kiện về hệ hai ẩn $u_1, d$; phương trình bậc hai cho hai nghiệm $d$ nhưng điều kiện \"dãy tăng\" loại một nghiệm. Đặt $u_n = u_1+(n-1)d$. Từ $u_1+u_4+u_{10} = 3u_1+12d = 69$ được $u_1+4d = 23$. Điều kiện cấp số nhân: $(u_1+d+1)^2 = u_1(u_1+2d+14)$. Thay $u_1 = 23-4d$: $(24-3d)^2 = (23-4d)(37-2d)$, khai triển được $d^2+50d-275 = 0$, cho $d = 5$ hoặc $d = -55$. Vì dãy tăng nên $d = 5$, $u_1 = 3$. Tổng $S_{20} = \\frac{20}{2}(2u_1+19d) = 10(6+95) = 1010$.","points": 0.25},{"type": "mcq","level": "VDC","q": "Có bao nhiêu số tự nhiên có $5$ chữ số khác nhau được lập từ các chữ số $0, 1, 2, 3, 4, 5$ sao cho số đó chia hết cho $3$?","options": ["A. $192$","B. $216$","C. $240$","D. $120$"],"answer": "B","explain": "Hướng tư duy: dấu hiệu chia hết cho $3$ là tổng các chữ số chia hết cho $3$; vì chọn $5$ trong $6$ chữ số nên xét theo chữ số bị loại, dùng số dư modulo $3$ để lọc nhanh. Các chữ số có số dư mod $3$: dư $0$: $\\{0,3\\}$; dư $1$: $\\{1,4\\}$; dư $2$: $\\{2,5\\}$. Loại chữ số $0$: còn $\\{1,2,3,4,5\\}$ tổng $15 \\vdots 3$, số cách $5! = 120$. Loại chữ số $3$: còn $\\{0,1,2,4,5\\}$ tổng $12 \\vdots 3$, số cách $5!-4! = 96$ (trừ trường hợp chữ số $0$ đứng đầu). Loại $1$ hoặc $4$: tổng các chữ số còn lại $\\equiv 2 \\pmod{3}$ (loại). Loại $2$ hoặc $5$: tổng $\\equiv 1 \\pmod{3}$ (loại). Tổng cộng $120+96 = 216$ số.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một bài trắc nghiệm có $10$ câu hỏi, mỗi câu có $4$ phương án trong đó có $1$ phương án đúng. Mỗi câu trả lời đúng được $5$ điểm, mỗi câu trả lời sai bị trừ $2$ điểm. Một học sinh chọn hú họa (ngẫu nhiên) một phương án cho mỗi câu và làm hết $10$ câu. Xác suất để học sinh này được điểm dưới $1$ là","options": ["A. $\\frac{21}{4}\\left(\\frac{3}{4}\\right)^8$","B. $\\left(\\frac{3}{4}\\right)^{10}$","C. $\\frac{45}{16}\\left(\\frac{3}{4}\\right)^8$","D. $\\frac{1}{4}$"],"answer": "A","explain": "Hướng tư duy: mô hình hóa điểm số theo số câu đúng $k$ (phân phối nhị thức), biến điều kiện \"điểm dưới $1$\" thành điều kiện chặn trên của $k$, rồi cộng xác suất. Gọi $k$ là số câu đúng, $k \\sim B(10, 1/4)$. Điểm $= 5k-2(10-k) = 7k-20$. Điều kiện điểm $\\lt 1$ tương đương $7k \\lt 21$, tức $k \\le 2$. Xác suất $= \\sum_{k=0}^{2} C_{10}^{k}\\left(\\frac{1}{4}\\right)^k\\left(\\frac{3}{4}\\right)^{10-k} = \\left(\\frac{3}{4}\\right)^8\\left[\\left(\\frac{3}{4}\\right)^2+10\\cdot\\frac{1}{4}\\cdot\\frac{3}{4}+45\\cdot\\frac{1}{16}\\right] = \\left(\\frac{3}{4}\\right)^8\\cdot\\frac{84}{16} = \\frac{21}{4}\\left(\\frac{3}{4}\\right)^8$.","points": 0.25},{"type": "truefalse","level": "VDC","q": "Cho $n$ là số nguyên dương. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Nếu $n^2$ chia hết cho $3$ thì $n$ chia hết cho $3$.","b) Tồn tại số nguyên tố $p$ sao cho $p^2 + 11$ là số nguyên tố.","c) Với mọi số nguyên $a$ thì $a^3 - a$ chia hết cho $6$.","d) Phương trình $x^2 + y^2 = 3z^2$ có nghiệm nguyên dương."],"answer": ["T","F","T","F"],"explain": "a) Đúng: nếu $3 \\nmid n$ thì $n^2 \\equiv 1 \\pmod{3}$, mâu thuẫn với $3 \\mid n^2$. b) Sai: $p = 2$ cho $15$ là hợp số; $p$ lẻ thì $p^2$ lẻ, $p^2+11$ chẵn và lớn hơn $2$ nên là hợp số. c) Đúng: $a^3-a = (a-1)a(a+1)$ là tích ba số nguyên liên tiếp nên chia hết cho $3! = 6$. d) Sai: xét modulo $4$, số chính phương chỉ có dư $0$ hoặc $1$; $x^2+y^2 \\equiv 3z^2 \\pmod{4}$ buộc $x, y, z$ đều chẵn (vì $3z^2 \\equiv 0$ hoặc $3$, còn $x^2+y^2 \\equiv 0,1,2$; giao nhau chỉ khi cả hai vế $\\equiv 0$), rồi dùng xuống thang vô hạn: nghiệm nguyên dương sẽ sinh ra nghiệm nhỏ hơn mãi, vô lí. Vậy chỉ có nghiệm tầm thường $(0;0;0)$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một lớp có $40$ học sinh gồm $22$ nam và $18$ nữ. Chọn ngẫu nhiên $3$ học sinh. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Xác suất để cả $3$ học sinh đều là nam bằng $\\frac{C_{22}^{3}}{C_{40}^{3}}$.","b) Xác suất để có ít nhất $1$ nữ bằng $1-\\frac{C_{22}^{3}}{C_{40}^{3}}$.","c) Biết rằng trong $3$ học sinh được chọn có ít nhất $1$ nam, xác suất để cả $3$ đều là nam bằng $\\frac{C_{22}^{3}}{C_{40}^{3}-C_{18}^{3}}$.","d) Xác suất để có đúng $2$ nữ lớn hơn xác suất để có đúng $2$ nam."],"answer": ["T","T","T","F"],"explain": "a) Đúng theo định nghĩa xác suất cổ điển. b) Đúng: biến cố đối của \"ít nhất $1$ nữ\" là \"cả $3$ đều nam\". c) Đúng theo công thức xác suất có điều kiện: $P(\\text{cả 3 nam} \\mid \\text{ít nhất 1 nam}) = \\frac{C_{22}^{3}}{C_{40}^{3}-C_{18}^{3}}$ (mẫu số trừ đi trường hợp cả $3$ đều nữ). d) Sai: $P(\\text{đúng 2 nữ}) = \\frac{C_{18}^{2}C_{22}^{1}}{C_{40}^{3}} = \\frac{153\\cdot 22}{C_{40}^{3}}$, $P(\\text{đúng 2 nam}) = \\frac{C_{22}^{2}C_{18}^{1}}{C_{40}^{3}} = \\frac{231\\cdot 18}{C_{40}^{3}}$; vì $153\\cdot 22 = 3366 \\lt 4158 = 231\\cdot 18$ nên xác suất đúng $2$ nữ nhỏ hơn.","points": 1},{"type": "short","level": "VDC","q": "Tìm số nguyên dương $n$ nhỏ nhất sao cho $2^n - 1$ chia hết cho $49$.","answer": "21","explain": "Hướng tư duy: $n$ cần tìm chính là cấp (bậc) của $2$ theo modulo $49$; tính $\\varphi(49) = 42$ rồi rút gọn bằng cách thử các ước của $42$. Ta cần $2^n \\equiv 1 \\pmod{49}$. Vì $\\gcd(2,49) = 1$ nên cấp của $2$ là ước của $\\varphi(49) = 42$. Tính: $2^7 = 128 \\equiv 30 \\pmod{49}$; $2^{14} \\equiv 30^2 = 900 \\equiv 18 \\pmod{49}$; $2^{21} \\equiv 18\\cdot 30 = 540 \\equiv 1 \\pmod{49}$. Các ước thực sự của $21$ là $1, 3, 7$: $2^1, 2^3 = 8, 2^7 \\equiv 30$ đều khác $1$ mod $49$. Vậy cấp của $2$ mod $49$ là $21$, tức $n = 21$ là số nhỏ nhất.","points": 0.5},{"type": "short","level": "VDC","q": "Có bao nhiêu số tự nhiên có $6$ chữ số khác nhau được lập từ các chữ số $0, 1, 2, 3, 4, 5, 6$ và chia hết cho $5$?","answer": "1320","explain": "Hướng tư duy: chia hết cho $5$ thì chữ số tận cùng là $0$ hoặc $5$; xét riêng hai trường hợp vì vai trò của chữ số $0$ ở hàng đầu khác nhau. Trường hợp tận cùng là $0$: chữ số đầu có $6$ cách (từ $1$ đến $6$), $4$ chữ số giữa chọn có thứ tự từ $5$ chữ số còn lại: $P_5^4 = 120$ cách, được $6\\cdot 120 = 720$ số. Trường hợp tận cùng là $5$: chữ số đầu có $5$ cách (loại $0$ và $5$), $4$ chữ số giữa có $P_5^4 = 120$ cách (kể cả $0$), được $5\\cdot 120 = 600$ số. Tổng cộng $720+600 = 1320$ số.","points": 0.5}]}]}
