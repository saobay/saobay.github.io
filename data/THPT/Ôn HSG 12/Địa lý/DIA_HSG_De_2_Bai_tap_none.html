<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 2", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu cơ cấu dân số theo nhóm tuổi của nước ta (đơn vị: %, nguồn: Tổng cục Thống kê, số liệu khoảng): Năm 1999: 0 đến 14 tuổi là 33,5; 15 đến 64 tuổi là 61,1; từ 65 tuổi trở lên là 5,4. Năm 2009: 24,9; 68,7; 6,4. Năm 2019: 23,8; 68,0; 8,2. Năm 2023: 23,5; 67,4; 9,1. Nhận định nào sau đây đúng nhất?", "options": ["A. Việt Nam đã kết thúc thời kì cơ cấu dân số vàng vì tỉ lệ nhóm 15 đến 64 tuổi giảm liên tục.", "B. Việt Nam đang trong thời kì cơ cấu dân số vàng nhưng nhóm từ 65 tuổi trở lên tăng nhanh, báo hiệu quá trình già hoá dân số sẽ diễn ra trong tương lai gần.", "C. Tỉ số phụ thuộc của dân số năm 2023 đã vượt 60%.", "D. Nước ta vẫn có cơ cấu dân số trẻ với nhóm 0 đến 14 tuổi chiếm trên 30%."], "answer": "B", "explain": "Nhóm tuổi lao động (15 đến 64) chiếm khoảng 67 đến 68%, cao gấp đôi nhóm phụ thuộc, nên Việt Nam vẫn đang trong thời kì cơ cấu dân số vàng (cửa sổ cơ hội). Tuy nhiên nhóm từ 65 tuổi trở lên tăng từ 5,4% (1999) lên 9,1% (2023), tốc độ già hoá nhanh, dự báo Việt Nam sẽ thành nước có dân số già vào khoảng năm 2036. Phương án A sai vì 67,4% vẫn rất cao; C sai vì tỉ số phụ thuộc năm 2023 chỉ khoảng 48,4% ((23,5 cộng 9,1) chia 67,4 nhân 100); D sai vì nhóm 0 đến 14 tuổi chỉ còn 23,5%, thời kì dân số trẻ đã qua."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu dân số và diện tích các vùng năm 2023 (khoảng, nguồn: Tổng cục Thống kê): Đồng bằng sông Hồng: 23,8 triệu người, 21,3 nghìn km2. Trung du và miền núi Bắc Bộ: 13,5 triệu người, 95,2 nghìn km2. Bắc Trung Bộ: 11,1 triệu người, 51,5 nghìn km2. Duyên hải Nam Trung Bộ: 9,4 triệu người, 44,6 nghìn km2. Tây Nguyên: 6,0 triệu người, 54,5 nghìn km2. Đông Nam Bộ: 18,2 triệu người, 23,6 nghìn km2. Đồng bằng sông Cửu Long: 17,4 triệu người, 40,8 nghìn km2. Vùng nào có mật độ dân số cao nhất và nguyên nhân chủ yếu là gì?", "options": ["A. Đông Nam Bộ, do thu hút nhập cư mạnh nhất cả nước.", "B. Đồng bằng sông Hồng (khoảng 1.117 người/km2), do lịch sử khai thác lãnh thổ lâu đời, đất phù sa màu mỡ, công nghiệp hoá và đô thị hoá mạnh mẽ.", "C. Đồng bằng sông Cửu Long, do là vùng sản xuất lương thực lớn nhất.", "D. Tây Nguyên, do đất badan màu mỡ thu hút dân cư."], "answer": "B", "explain": "Mật độ dân số bằng dân số chia diện tích: Đồng bằng sông Hồng là 23,8 triệu chia 21,3 nghìn km2, khoảng 1.117 người/km2, cao nhất cả nước và gấp gần 4 lần mức trung bình (khoảng 303 người/km2). Nguyên nhân tổng hợp: lịch sử khai phá hàng nghìn năm của nền văn minh lúa nước; đất phù sa sông Hồng màu mỡ; sớm công nghiệp hoá, có hai đô thị đặc biệt và lớn (Hà Nội, Hải Phòng), thu hút lao động. Đông Nam Bộ mật độ khoảng 771 người/km2, đứng thứ hai. Phương án C, D sai vì ĐBSCL khoảng 426 người/km2, Tây Nguyên chỉ khoảng 110 người/km2 (thấp nhất)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Năm 2023, tỉ lệ dân thành thị của cả nước đạt khoảng 42,6%, trong đó Đông Nam Bộ cao nhất (trên 60%), Trung du và miền núi Bắc Bộ thấp nhất (khoảng 20%). Vì sao Đông Nam Bộ có trình độ đô thị hoá cao nhất cả nước?", "options": ["A. Vì Đông Nam Bộ có diện tích tự nhiên nhỏ nhất cả nước.", "B. Vì đây là vùng công nghiệp hoá mạnh nhất, tập trung dày đặc các khu công nghiệp, khu chế xuất, thu hút lượng lớn lao động nhập cư, hình thành mạng lưới đô thị lớn (TP. Hồ Chí Minh, Biên Hoà, Thủ Dầu Một, Vũng Tàu).", "C. Vì Đông Nam Bộ có mật độ dân số cao nhất cả nước.", "D. Vì Đông Nam Bộ là vùng sản xuất lương thực lớn nhất."], "answer": "B", "explain": "Đô thị hoá gắn chặt với công nghiệp hoá. Đông Nam Bộ dẫn đầu cả nước về giá trị sản xuất công nghiệp và thu hút FDI, với hàng trăm khu công nghiệp (Bình Dương, Đồng Nai, TP. Hồ Chí Minh, Bà Rịa Vũng Tàu), tạo hàng triệu việc làm, thu hút dòng nhập cư lớn từ khắp cả nước, thúc đẩy bùng nổ đô thị. TP. Hồ Chí Minh là đô thị đặc biệt lớn nhất nước (trên 9 triệu dân). Phương án A sai (diện tích ĐNB 23,6 nghìn km2, không phải nhỏ nhất); C sai (mật độ cao nhất là ĐBSH); D sai (vựa lúa là ĐBSCL)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu cơ cấu lao động theo ngành của nước ta (đơn vị: %, nguồn: Tổng cục Thống kê): Năm 2010: nông, lâm nghiệp và thuỷ sản 48,7; công nghiệp và xây dựng 21,7; dịch vụ 29,6. Năm 2023: 26,4; 33,4; 40,2. Nhận định nào sau đây đúng nhất về sự chuyển dịch này?", "options": ["A. Lao động nông nghiệp giảm cả về tỉ trọng và số lượng tuyệt đối, chứng tỏ nông nghiệp không còn vai trò quan trọng trong nền kinh tế.", "B. Cơ cấu lao động chuyển dịch theo hướng công nghiệp hoá, hiện đại hoá: tỉ trọng lao động nông, lâm, thuỷ sản giảm mạnh, tỉ trọng công nghiệp, xây dựng và dịch vụ tăng lên, phù hợp với chuyển dịch cơ cấu GDP.", "C. Ngành dịch vụ đã thu hút trên một nửa lực lượng lao động của cả nước.", "D. Công nghiệp và xây dựng là ngành thu hút ít lao động nhất."], "answer": "B", "explain": "Trong 13 năm, tỉ trọng lao động nông, lâm, thuỷ sản giảm từ 48,7% xuống 26,4% (giảm 22,3 điểm phần trăm), trong khi công nghiệp, xây dựng tăng từ 21,7% lên 33,4% và dịch vụ tăng từ 29,6% lên 40,2%. Đây là chuyển dịch tích cực theo hướng công nghiệp hoá, hiện đại hoá, song hành với chuyển dịch cơ cấu GDP. Phương án A sai vì số tuyệt đối lao động nông nghiệp vẫn rất lớn (trên 13 triệu người) và nông nghiệp vẫn đảm bảo an ninh lương thực, xuất khẩu; C sai vì dịch vụ mới đạt 40,2%; D sai vì nông nghiệp vẫn là ngành có tỉ trọng lao động thấp nhất? Không, nông nghiệp 26,4% vẫn cao hơn? So sánh: 26,4 (nông nghiệp) nhỏ hơn 33,4 và 40,2, nên nông nghiệp hiện là ngành có tỉ trọng lao động thấp nhất, D nói công nghiệp ít nhất là sai."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Đồng bằng sông Cửu Long có tỉ suất xuất cư cao nhất cả nước, trong khi Đông Nam Bộ có tỉ suất nhập cư cao nhất. Cách giải thích nào sau đây đầy đủ và đúng bản chất nhất?", "options": ["A. Do Đồng bằng sông Cửu Long đất chật người đông, thiếu việc làm, thu nhập thấp, lại chịu tác động nặng nề của xâm nhập mặn và sụt lún; còn Đông Nam Bộ là trung tâm công nghiệp, dịch vụ lớn nhất nước với nhu cầu lao động khổng lồ và thu nhập cao, tạo lực hút nhập cư mạnh.", "B. Do Đồng bằng sông Cửu Long có trình độ đô thị hoá cao nên dân cư di chuyển nhiều.", "C. Do Đông Nam Bộ có diện tích đất nông nghiệp lớn, cần nhiều lao động.", "D. Do chính sách của Đồng bằng sông Cửu Long hạn chế người nhập cư."], "answer": "A", "explain": "Di cư là kết quả của lực đẩy (nơi đi) và lực hút (nơi đến). Lực đẩy ở ĐBSCL: dân số đông (17,4 triệu người), đất nông nghiệp bình quân đầu người giảm, thiếu việc làm phi nông nghiệp, thu nhập thấp, cộng thêm xâm nhập mặn, sụt lún, thiếu nước ngọt do biến đổi khí hậu. Lực hút ở ĐNB: trung tâm công nghiệp (chiếm khoảng 1/3 giá trị sản xuất công nghiệp cả nước), dịch vụ phát triển, hàng triệu việc làm với thu nhập cao hơn hẳn. Phương án B sai (ĐBSCL đô thị hoá thấp, khoảng 28%); C sai (ĐNB đất nông nghiệp ngày càng thu hẹp); D không có cơ sở."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Sự tương phản sâu sắc về phân bố dân cư giữa Đồng bằng sông Hồng (mật độ trên 1.100 người/km2) và Tây Nguyên (khoảng 110 người/km2) bắt nguồn sâu xa nhất từ nhân tố nào?", "options": ["A. Khí hậu Tây Nguyên khắc nghiệt hơn Đồng bằng sông Hồng.", "B. Lịch sử khai thác lãnh thổ: Đồng bằng sông Hồng là cái nôi của nền văn minh lúa nước với hàng nghìn năm khai phá, đất phù sa màu mỡ, sớm phát triển công nghiệp và đô thị; Tây Nguyên mới được khai thác mạnh từ thế kỉ XX, địa hình cao nguyên, giao thông khó khăn, kinh tế còn dựa vào nông, lâm nghiệp.", "C. Tây Nguyên thiếu tài nguyên thiên nhiên nên không thu hút dân cư.", "D. Đồng bằng sông Hồng có diện tích tự nhiên lớn hơn Tây Nguyên."], "answer": "B", "explain": "Phân bố dân cư là kết quả tổng hợp của lịch sử, tự nhiên và kinh tế xã hội, trong đó lịch sử khai thác lãnh thổ là nhân tố gốc rễ, lâu dài. ĐBSH được khai phá từ thời các vua Hùng, là trung tâm văn minh lúa nước, tích tụ dân cư hàng nghìn năm; sau này lại là trung tâm công nghiệp, đô thị lớn. Tây Nguyên đến đầu thế kỉ XX vẫn là vùng rừng núi thưa dân, mới phát triển mạnh từ sau 1975 nhờ cây công nghiệp và thuỷ điện. Phương án A sai (khí hậu Tây Nguyên ôn hoà, mát mẻ); C sai (Tây Nguyên rất giàu tài nguyên: đất badan, rừng, bô-xít, thuỷ điện); D sai (Tây Nguyên 54,5 nghìn km2, rộng gấp 2,5 lần ĐBSH)."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các nhận định sau về dân số nước ta:", "statements": ["a) Tổng tỉ suất sinh của cả nước đã giảm xuống dưới mức sinh thay thế (2,1 con/phụ nữ), ở các thành phố lớn như TP. Hồ Chí Minh chỉ còn khoảng 1,3 con/phụ nữ.", "b) Cơ cấu dân số theo giới tính khi sinh đang mất cân đối theo hướng thừa nam thiếu nữ, khoảng 112 bé trai trên 100 bé gái.", "c) Nước ta đã trở thành nước có dân số già vì tỉ lệ người từ 65 tuổi trở lên đã vượt 20%.", "d) Mật độ dân số trung bình cả nước năm 2023 khoảng 300 người/km2, thuộc loại cao so với trung bình thế giới."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: tổng tỉ suất sinh cả nước năm 2023 khoảng 1,96 con/phụ nữ, dưới mức sinh thay thế; TP. Hồ Chí Minh khoảng 1,3, Hà Nội khoảng 1,6, báo hiệu nguy cơ thiếu hụt lao động tương lai. b) Đúng: tỉ số giới tính khi sinh khoảng 111 đến 112 bé trai trên 100 bé gái (mức tự nhiên là 104 đến 106), hệ quả của tư tưởng trọng nam. c) Sai: tỉ lệ từ 65 tuổi trở lên mới khoảng 9,1%, nước ta đang trong quá trình già hoá (dự báo thành nước có dân số già vào khoảng năm 2036) chứ chưa phải dân số già. d) Đúng: khoảng 303 người/km2, gấp nhiều lần trung bình thế giới (khoảng 60 người/km2)."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các nhận định sau về lao động, việc làm và đô thị hoá ở nước ta:", "statements": ["a) Tỉ lệ thất nghiệp ở thành thị thường cao hơn ở nông thôn vì lao động nông thôn chủ yếu thiếu việc làm theo mùa vụ chứ ít thất nghiệp hoàn toàn.", "b) Đô thị hoá ở nước ta diễn ra nhanh nhưng chất lượng còn thấp, nhiều đô thị phát triển tự phát, hạ tầng quá tải, ô nhiễm môi trường.", "c) Tỉ lệ lao động qua đào tạo của nước ta đã chiếm trên 70% lực lượng lao động.", "d) Xuất khẩu lao động là một giải pháp quan trọng góp phần giải quyết việc làm, tăng thu nhập và nguồn ngoại tệ cho đất nước."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: thất nghiệp thành thị khoảng 2,5 đến 3%, cao hơn nông thôn (dưới 2%), vì nông thôn lao động theo mùa vụ, thiếu việc làm lúc nông nhàn chứ không thất nghiệp hoàn toàn. b) Đúng: tốc độ đô thị hoá nhanh (từ 19,6% năm 1990 lên 42,6% năm 2023) nhưng nhiều đô thị loại IV, V phát triển tự phát, ngập úng, kẹt xe, ô nhiễm ở Hà Nội, TP. Hồ Chí Minh. c) Sai: lao động qua đào tạo (có bằng cấp, chứng chỉ) mới đạt khoảng 27 đến 28%, chất lượng nguồn nhân lực là điểm nghẽn lớn. d) Đúng: mỗi năm đưa khoảng 130.000 đến 150.000 lao động đi làm việc ở nước ngoài, kiều hối từ xuất khẩu lao động đạt hàng tỉ USD mỗi năm."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Từ bảng số liệu cơ cấu dân số theo nhóm tuổi ở câu trắc nghiệm số 1 (năm 2023: nhóm 0 đến 14 tuổi chiếm 23,5%; nhóm 15 đến 64 tuổi chiếm 67,4%; nhóm từ 65 tuổi trở lên chiếm 9,1%), hãy tính tỉ số phụ thuộc của dân số năm 2023 (đơn vị: %, làm tròn đến 1 chữ số thập phân).", "answer": "48,4", "explain": "Tỉ số phụ thuộc bằng tổng tỉ lệ hai nhóm tuổi phụ thuộc (0 đến 14 tuổi và từ 65 tuổi trở lên) chia cho tỉ lệ nhóm tuổi lao động (15 đến 64 tuổi), nhân 100: (23,5 cộng 9,1) chia 67,4 nhân 100 bằng 48,4%. Nghĩa là cứ 100 người trong độ tuổi lao động phải nuôi khoảng 48 người phụ thuộc. Tỉ số này còn thấp (dưới 50%) nên Việt Nam vẫn đang tận hưởng lợi thế cơ cấu dân số vàng, nhưng đang tăng dần do già hoá."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Năm 2023, Đồng bằng sông Hồng có dân số khoảng 23,8 triệu người, diện tích tự nhiên khoảng 21,3 nghìn km2. Tính mật độ dân số của vùng (đơn vị: người/km2, làm tròn đến hàng đơn vị).", "answer": "1117", "explain": "Mật độ dân số bằng dân số chia cho diện tích: 23.800.000 chia 21.300 bằng khoảng 1.117 người/km2. Đây là vùng có mật độ dân số cao nhất cả nước, gấp gần 4 lần mức trung bình (khoảng 303 người/km2) và gấp hơn 10 lần Tây Nguyên (khoảng 110 người/km2), tạo sức ép rất lớn lên đất đai, việc làm và hạ tầng."}]}]}
