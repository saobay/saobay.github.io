<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"VDC","q":"Một gene ở sinh vật nhân thực có 5 exon với chiều dài lần lượt là 300, 450, 200, 600 và 280 nucleotide. Sau quá trình xử lí, toàn bộ intron bị loại bỏ và các exon được nối lại tạo thành mRNA trưởng thành (chưa tính đuôi poly-A). Biết exon 1 chứa đoạn 5'UTR dài 150 nucleotide; exon 5 chứa đoạn 3'UTR dài 180 nucleotide (codon kết thúc nằm trong vùng mã hóa, không tính vào 3'UTR). Chuỗi polypeptide hoàn chỉnh do gene này mã hóa gồm bao nhiêu amino acid?","options":["A. 500","B. 499","C. 610","D. 609"],"answer":"B","explain":"mRNA trưởng thành bằng tổng chiều dài các exon: 300 + 450 + 200 + 600 + 280 = 1830 nucleotide. Vùng mã hóa (CDS) = 1830 − 150 (5'UTR) − 180 (3'UTR) = 1500 nucleotide, tương ứng 1500/3 = 500 codon. Codon kết thúc không mã hóa amino acid nên chuỗi polypeptide hoàn chỉnh có 500 − 1 = 499 amino acid. (Bẫy: 500 nếu quên trừ codon kết thúc; 610 nếu lấy cả UTR chia cho 3.)","points":0.25},{"type":"mcq","level":"VDC","q":"Trên mạch khuôn (mạch mã gốc, đọc theo chiều 3' → 5') của một gene, bộ ba 3'-AXX-5' phiên mã tạo ra codon 5'-UGG-3' mã hóa tryptophan trên mRNA. Một đột biến thay thế một cặp nucleotide làm bộ ba trên mạch khuôn trở thành 3'-AXT-5'. Loại đột biến và hậu quả đối với chuỗi polypeptide là gì?","options":["A. Thay thế cặp G–X bằng cặp A–T; đột biến đồng nghĩa, chuỗi polypeptide không đổi.","B. Thay thế cặp G–X bằng cặp T–A; đột biến sai nghĩa, một amino acid bị thay thế bằng amino acid khác.","C. Thay thế cặp G–X bằng cặp T–A; đột biến vô nghĩa, chuỗi polypeptide bị rút ngắn.","D. Mất một cặp nucleotide; đột biến dịch khung, toàn bộ amino acid phía sau vị trí đột biến bị thay đổi."],"answer":"C","explain":"Mạch khuôn 3'-AXX-5' bắt cặp bổ sung với mạch mã hóa 5'-TGG-3' (các cặp A–T, X–G, X–G). Sau đột biến, mạch khuôn là 3'-AXT-5' nên mạch mã hóa thành 5'-TGA-3': cặp nucleotide tại vị trí thứ ba đã đổi từ X–G thành T–A, tức đột biến thay thế (dạng transversion). mRNA tương ứng đổi từ 5'-UGG-3' (tryptophan) thành 5'-UGA-3' (codon kết thúc). Đây là đột biến vô nghĩa (nonsense): codon kết thúc xuất hiện sớm làm dịch mã dừng sớm, chuỗi polypeptide bị rút ngắn và protein thường mất chức năng.","points":0.25},{"type":"mcq","level":"VDC","q":"Xét operon lac ở E. coli với ba chủng đột biến: chủng 1 bị mất vùng vận hành O (protein ức chế không bám được vào O); chủng 2 bị mất gene điều hòa lacI (không tổng hợp được protein ức chế); chủng 3 bị mất vùng khởi động P (RNA polymerase không bám được vào P). Cả ba chủng đều được nuôi trong môi trường KHÔNG có lactose. Có bao nhiêu chủng vẫn phiên mã các gene cấu trúc lacZ, lacY, lacA?","options":["A. 0","B. 1","C. 3","D. 2"],"answer":"D","explain":"Chủng 1: vùng O đột biến nên protein ức chế không bám được vào O dù không có lactose (chất cảm ứng) → RNA polymerase phiên mã bình thường. Chủng 2: không có protein ức chế → O luôn trống → các gene cấu trúc phiên mã liên tục (đột biến cấu trúc). Chủng 3: mất vùng P nên RNA polymerase không bám được → không phiên mã trong mọi điều kiện. Vậy có 2 chủng (1 và 2) vẫn phiên mã.","points":0.25},{"type":"mcq","level":"VDC","q":"Một đơn vị tái bản (replicon) dài 10000 cặp nucleotide chỉ có một điểm khởi đầu sao chép. Từ điểm này, hai chạc sao chép (chạc chữ Y) hoạt động ngược chiều nhau, mỗi chạc phụ trách một nửa đơn vị tái bản. Tốc độ tổng hợp của DNA polymerase là 1000 nucleotide/giây trên mỗi mạch khuôn; mạch liên tục và mạch gián đoạn trên mỗi chạc được tổng hợp đồng thời. Thời gian tối thiểu để sao chép hoàn chỉnh cả đơn vị tái bản là bao nhiêu?","options":["A. 5 giây","B. 2,5 giây","C. 10 giây","D. 20 giây"],"answer":"A","explain":"Mỗi chạc sao chép phụ trách 10000/2 = 5000 cặp nucleotide. Trên mỗi chạc, hai mạch khuôn được tổng hợp đồng thời (một mạch liên tục, một mạch gián đoạn qua các đoạn Okazaki) nên thời gian do mạch dài nhất quyết định: 5000/1000 = 5 giây. Hai chạc hoạt động song song ngược chiều nhau nên thời gian chung vẫn là 5 giây. (Bẫy: 10 giây nếu tính hai mạch nối tiếp nhau; 20 giây nếu tính cả hai chạc nối tiếp.)","points":0.25},{"type":"mcq","level":"VDC","q":"Một đoạn DNA mạch kép dài 4200 cặp nucleotide có 3 trình tự nhận biết của enzyme EcoRI (5'-GAATTC-3'), nằm cách đầu trái của phân tử lần lượt 600, 1800 và 3000 cặp nucleotide. Biết trình tự nhận biết thứ hai (cách đầu trái 1800 cặp nucleotide) bị methyl hóa nên EcoRI không cắt được tại đó. Sau khi xử lí hoàn toàn bằng EcoRI, thu được bao nhiêu đoạn DNA và đoạn dài nhất dài bao nhiêu?","options":["A. 4 đoạn, đoạn dài nhất 1200 cặp nucleotide.","B. 3 đoạn, đoạn dài nhất 2400 cặp nucleotide.","C. 4 đoạn, đoạn dài nhất 2400 cặp nucleotide.","D. 3 đoạn, đoạn dài nhất 1800 cặp nucleotide."],"answer":"B","explain":"Methyl hóa làm enzyme giới hạn không nhận biết được trình tự đích, nên EcoRI chỉ cắt tại hai vị trí 600 và 3000. Ba đoạn thu được: 0–600 (600 bp), 600–3000 (2400 bp), 3000–4200 (1200 bp). Vậy thu được 3 đoạn, đoạn dài nhất 2400 cặp nucleotide.","points":0.25},{"type":"mcq","level":"VDC","q":"Một gene có vùng mã hóa gồm 600 codon (tính cả codon mở đầu và codon kết thúc). Hai đột biến điểm xảy ra trong vùng mã hóa: đột biến 1 làm mất 3 nucleotide liên tiếp tại vị trí codon thứ 100; đột biến 2 làm thêm 1 nucleotide tại vị trí codon thứ 200. Chuỗi polypeptide do gene đột biến tạo ra thay đổi như thế nào so với chuỗi bình thường?","options":["A. Mất 3 amino acid tại vị trí 100; toàn bộ amino acid từ vị trí 200 trở đi bị thay đổi.","B. Toàn bộ amino acid từ vị trí 100 trở đi bị thay đổi; thêm 1 amino acid tại vị trí 200.","C. Mất 1 amino acid tại vị trí 100; trình tự amino acid từ vị trí 200 trở đi bị thay đổi hoàn toàn.","D. Chuỗi polypeptide không đổi vì số nucleotide mất đi và thêm vào bù trừ cho nhau."],"answer":"C","explain":"Mất 3 nucleotide liên tiếp đúng bằng một codon → chỉ mất 1 amino acid tại vị trí 100, khung đọc từ codon 101 trở đi vẫn giữ nguyên (đột biến không dịch khung). Thêm 1 nucleotide tại codon 200 làm lệch khung đọc từ đó về sau → mọi codon từ vị trí 200 trở đi bị đọc sai (đột biến dịch khung), thường tạo ra codon kết thúc sớm. Phương án D sai vì hai đột biến ở hai vị trí khác nhau, không bù trừ cho nhau.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau về quá trình tổng hợp protein ở sinh vật nhân thực và nhân sơ:","statements":["a) mRNA sơ khai (tiền mRNA) ở sinh vật nhân thực có thể làm khuôn trực tiếp cho dịch mã mà không cần biến đổi gì thêm.","b) Nhờ cơ chế cắt nối thay thế (alternative splicing), một gene ở sinh vật nhân thực có thể tạo ra nhiều loại mRNA trưởng thành và nhiều loại protein khác nhau.","c) Mũ 5' và đuôi poly-A giúp bảo vệ mRNA khỏi enzyme phân hủy và giúp ribosome nhận biết điểm khởi đầu dịch mã.","d) Ở sinh vật nhân sơ, phiên mã và dịch mã có thể diễn ra đồng thời vì không có màng nhân ngăn cách."],"answer":["F","T","T","T"],"explain":"a) Sai: tiền mRNA phải qua biến đổi sau phiên mã (cắt intron, nối exon, gắn mũ 5', cắt đầu 3' và gắn đuôi poly-A) mới thành mRNA trưởng thành. b) Đúng: cùng một tiền mRNA nhưng cách nối các exon khác nhau tạo ra các mRNA trưởng thành khác nhau → tăng đa dạng protein mà không cần tăng số gene. c) Đúng: mũ 5' (7-methylguanosine) giúp tiểu đơn vị bé của ribosome bám vào; đuôi poly-A tăng độ bền của mRNA trong tế bào chất. d) Đúng: không có nhân riêng nên ribosome bám vào mRNA và dịch mã ngay khi mRNA đang được phiên mã (phiên mã – dịch mã liên hợp).","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau về đột biến gene:","statements":["a) Mọi đột biến thay thế một cặp nucleotide đều làm thay đổi trình tự amino acid của chuỗi polypeptide.","b) Đột biến dịch khung xảy ra càng gần đầu vùng mã hóa thì hậu quả đối với protein thường càng nghiêm trọng.","c) Đột biến ở vùng điều hòa của gene có thể làm thay đổi mức độ phiên mã mà không làm thay đổi trình tự amino acid của protein.","d) Mọi đột biến gene phát sinh trong cơ thể đều di truyền được cho thế hệ sau."],"answer":["F","T","T","F"],"explain":"a) Sai: do tính thoái hóa của mã di truyền, thay thế nucleotide (nhất là ở vị trí thứ ba của codon) có thể tạo codon đồng nghĩa → trình tự amino acid không đổi (đột biến câm). b) Đúng: dịch khung gần đầu vùng mã hóa làm sai lệch gần như toàn bộ chuỗi polypeptide; càng gần cuối gene thì số amino acid bị ảnh hưởng càng ít. c) Đúng: vùng điều hòa (vùng khởi động, vùng tăng cường) quyết định thời điểm và mức độ phiên mã, không mã hóa amino acid nên đột biến ở đây không đổi trình tự protein. d) Sai: chỉ đột biến phát sinh ở tế bào sinh dục (hoặc ở giai đoạn tiền phôi) mới truyền cho đời sau qua sinh sản; đột biến ở tế bào sinh dưỡng (đột biến soma) không di truyền qua sinh sản hữu tính.","points":1},{"type":"short","level":"VDC","q":"Một gene ở sinh vật nhân thực có 5 exon với chiều dài lần lượt là 300, 450, 200, 600 và 280 nucleotide. Sau xử lí, các intron bị loại bỏ hoàn toàn và các exon nối lại thành mRNA trưởng thành (chưa tính đuôi poly-A). Exon 1 chứa đoạn 5'UTR dài 150 nucleotide; exon 5 chứa đoạn 3'UTR dài 180 nucleotide (codon kết thúc nằm trong vùng mã hóa, không tính vào 3'UTR). Chuỗi polypeptide hoàn chỉnh do gene này mã hóa gồm bao nhiêu amino acid?","answer":"499","explain":"mRNA trưởng thành = tổng chiều dài các exon = 300 + 450 + 200 + 600 + 280 = 1830 nucleotide. Vùng mã hóa = 1830 − 150 − 180 = 1500 nucleotide = 500 codon. Codon kết thúc không mã hóa amino acid nên chuỗi polypeptide hoàn chỉnh có 500 − 1 = 499 amino acid.","points":0.5},{"type":"short","level":"VDC","q":"Một gene có tổng số 3900 liên kết hydrogene; số nucleotide loại A chiếm 20% tổng số nucleotide của gene. Khi gene này nhân đôi 2 lần liên tiếp, môi trường nội bào phải cung cấp bao nhiêu nucleotide loại G?","answer":"2700","explain":"Gọi N là tổng số nucleotide của gene. A = T = 0,2N; G = X = 0,3N. Số liên kết hydrogene = 2A + 3G = 0,4N + 0,9N = 1,3N = 3900, suy ra N = 3000 và G = 900. Gene nhân đôi 2 lần tạo 4 phân tử con; số nucleotide loại G môi trường cung cấp = 900 × (2² − 1) = 900 × 3 = 2700.","points":0.5}]}]}
