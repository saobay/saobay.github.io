<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 4","questions":[{"type":"mcq","level":"VDC","q":"Trong một hệ sinh thái đồng cỏ, năng lượng tích lũy tại các bậc dinh dưỡng như sau: cỏ $10^6$ kcal, thỏ $10^5$ kcal, cáo $2 \\times 10^4$ kcal. Biết mỗi con cáo cần $10^4$ kcal/năm để duy trì hoạt động sống. Hiệu suất sinh thái giữa cáo và thỏ là bao nhiêu và hệ sinh thái này nuôi được tối đa bao nhiêu con cáo?","options":["A. Hiệu suất 20%, nuôi tối đa 2 con cáo.","B. Hiệu suất 10%, nuôi tối đa 10 con cáo.","C. Hiệu suất 20%, nuôi tối đa 10 con cáo.","D. Hiệu suất 2%, nuôi tối đa 2 con cáo."],"answer":"A","explain":"Hiệu suất sinh thái = năng lượng tích lũy ở bậc dinh dưỡng sau / năng lượng tích lũy ở bậc dinh dưỡng trước × 100% = $(2 \\times 10^4)/(10^5)$ = 20%. Tổng năng lượng tích lũy ở bậc cáo là $2 \\times 10^4$ kcal → số cáo tối đa = $(2 \\times 10^4)/(10^4)$ = 2 con. (Hiệu suất giữa thỏ và cỏ là 10%, đúng với quy luật '10%' của Lindeman.)","points":0.25},{"type":"mcq","level":"VDC","q":"Ở một hệ sinh thái, người ta vẽ được tháp sinh khối có dạng đảo ngược: sinh khối của bậc dinh dưỡng sau (động vật ăn thực vật) lớn hơn sinh khối của bậc dinh dưỡng trước (thực vật). Hiện tượng này có thể xảy ra ở hệ sinh thái nào và giải thích nào sau đây đúng?","options":["A. Rừng mưa nhiệt đới, vì cây gỗ tích lũy sinh khối chậm.","B. Hệ sinh thái nước (thủy vực), vì tảo có sinh khối nhỏ tại một thời điểm nhưng tốc độ sinh sản và luân chuyển vật chất rất nhanh.","C. Đồng cỏ, vì cỏ bị động vật ăn liên tục nên sinh khối thấp.","D. Sa mạc, vì thực vật thưa thớt, sinh khối thấp."],"answer":"B","explain":"Ở thủy vực, sinh vật sản xuất (tảo, thực vật phù du) có kích thước nhỏ, vòng đời ngắn, bị ăn nhanh nên sinh khối đo tại một thời điểm nhỏ; nhưng tốc độ quang hợp và tái tạo cực nhanh, đủ cung cấp năng lượng nuôi bậc dinh dưỡng cao hơn có sinh khối lớn hơn → tháp sinh khối đảo ngược. Lưu ý: tháp năng lượng không bao giờ đảo ngược vì năng lượng luôn hao hụt qua mỗi bậc.","points":0.25},{"type":"mcq","level":"VDC","q":"Một quần thể vi khuẩn được nuôi trong môi trường có sức chứa K = $10^6$ cá thể, tốc độ tăng trưởng riêng r = 0,5/giờ. Khi quần thể đạt kích thước $8 \\times 10^5$ cá thể, tốc độ tăng trưởng thực tế của quần thể (dN/dt) là bao nhiêu cá thể/giờ?","options":["A. $4 \\times 10^5$","B. $10^5$","C. $8 \\times 10^4$","D. $5 \\times 10^4$"],"answer":"C","explain":"Áp dụng mô hình tăng trưởng logistic: dN/dt = rN(1 − N/K) = 0,5 × $8 \\times 10^5$ × (1 − 0,8) = 0,5 × $8 \\times 10^5$ × 0,2 = $8 \\times 10^4$ cá thể/giờ. Khi kích thước quần thể càng tiến gần sức chứa K, sức ép của môi trường (cạnh tranh thức ăn, không gian) càng lớn, tốc độ tăng trưởng thực tế càng giảm dần về 0.","points":0.25},{"type":"mcq","level":"VDC","q":"Để phòng trừ sâu cuốn lá hại lúa, người ta thả ong mắt đỏ vào ruộng; ong đẻ trứng vào trứng sâu, ấu trùng ong nở ra ăn trứng sâu non. Biện pháp này dựa trên mối quan hệ sinh thái nào và có ưu điểm gì so với dùng thuốc trừ sâu hóa học?","options":["A. Quan hệ cạnh tranh; chi phí rẻ hơn thuốc hóa học.","B. Quan hệ cộng sinh; giúp cây lúa tăng năng suất một cách trực tiếp.","C. Quan hệ hội sinh; an toàn tuyệt đối cho sức khỏe con người.","D. Quan hệ kí sinh (sử dụng thiên địch); không gây ô nhiễm môi trường, không diệt trừ các loài có ích, hiệu quả lâu dài và bền vững."],"answer":"D","explain":"Ong mắt đỏ kí sinh trứng sâu là thiên địch của sâu hại → mối quan hệ kí sinh (dạng đặc biệt của quan hệ vật ăn thịt – con mồi). Đây là biện pháp khống chế sinh học: dùng một loài sinh vật để hạn chế số lượng loài gây hại. Ưu điểm so với thuốc hóa học: không để lại dư lượng độc hại trong nông sản và môi trường, bảo vệ các loài thiên địch và đa dạng sinh học, hiệu quả bền vững lâu dài (nhược điểm là tác dụng chậm hơn thuốc hóa học).","points":0.25},{"type":"mcq","level":"VDC","q":"Trong chu trình nitrogen, quá trình nào sau đây do vi khuẩn kị khí thực hiện, biến nitrate trong đất thành nitrogen phân tử ($N_2$) bay vào khí quyển và làm giảm lượng đạm trong đất?","options":["A. Phản nitrat hóa.","B. Cố định nitrogen phân tử.","C. Amon hóa.","D. Nitrat hóa."],"answer":"A","explain":"Phản nitrat hóa (khử nitrat) do vi khuẩn kị khí (ví dụ Pseudomonas) thực hiện trong điều kiện đất úng, yếm khí: $NO_3^-$ → $N_2$, làm thất thoát đạm khỏi đất → gây hại cho trồng trọt. Phân biệt với nitrat hóa (do vi khuẩn hiếu khí Nitrosomonas, Nitrobacter biến $NH_4^+$ thành $NO_3^-$) làm tăng lượng đạm dễ tiêu cho cây.","points":0.25},{"type":"mcq","level":"VDC","q":"Sau một vụ cháy rừng, trên nền đất còn dinh dưỡng và hạt giống, quần xã sinh vật phục hồi dần qua các giai đoạn: cỏ dại → cây bụi → cây gỗ nhỏ → rừng cây gỗ lớn tương tự như ban đầu. Quá trình này thuộc loại diễn thế sinh thái nào?","options":["A. Diễn thế nguyên sinh.","B. Diễn thế thứ sinh.","C. Diễn thế phân hủy.","D. Không phải diễn thế sinh thái."],"answer":"B","explain":"Đây là diễn thế thứ sinh: khởi đầu từ môi trường đã từng tồn tại quần xã (còn đất, dinh dưỡng, hạt giống, rễ) nên quá trình phục hồi diễn ra tương đối nhanh và có xu hướng trở lại quần xã ổn định ban đầu (quần xã đỉnh cực). Diễn thế nguyên sinh khởi đầu từ môi trường trống trơn chưa từng có sinh vật (đá trần, đảo núi lửa mới), phải trải qua giai đoạn sinh vật tiên phong (địa y, rêu) rất lâu.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau về hệ sinh thái:","statements":["a) Trong hệ sinh thái, năng lượng được truyền theo một chiều từ sinh vật sản xuất qua các bậc dinh dưỡng và không được tái sử dụng.","b) Vật chất trong hệ sinh thái được tuần hoàn liên tục nhờ hoạt động của sinh vật phân giải.","c) Hiệu suất sinh thái càng cao thì chuỗi thức ăn trong hệ sinh thái càng dài.","d) Tháp năng lượng luôn có dạng chuẩn (đáy rộng, đỉnh hẹp) và không bao giờ bị đảo ngược."],"answer":["T","T","F","T"],"explain":"a) Đúng: ở mỗi bậc dinh dưỡng, một phần lớn năng lượng bị thất thoát qua hô hấp, bài tiết, rơi rụng → năng lượng truyền một chiều, không quay vòng. b) Đúng: sinh vật phân giải phân hủy xác sinh vật thành chất vô cơ trả lại môi trường → chu trình vật chất khép kín. c) Sai: hiệu suất sinh thái trung bình chỉ khoảng 10% nên năng lượng hao hụt rất nhanh, chuỗi thức ăn thường chỉ dài 4–5 bậc; chuỗi dài đòi hỏi hiệu suất cao ở mọi bậc, thực tế rất hiếm. d) Đúng: vì năng lượng luôn hao hụt, bậc dinh dưỡng sau không thể chứa nhiều năng lượng hơn bậc trước → tháp năng lượng không bao giờ đảo ngược (khác tháp sinh khối, tháp số lượng).","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau về quần xã sinh vật:","statements":["a) Quần xã có độ đa dạng loài càng cao thì thường càng ổn định trước những biến động của môi trường.","b) Loài ưu thế trong quần xã là loài có số lượng cá thể nhiều nhất.","c) Ổ sinh thái của một loài chính là giới hạn sinh thái của loài đó về mọi nhân tố môi trường.","d) Sự phân tầng theo chiều thẳng đứng của thực vật trong rừng giúp các loài tận dụng tốt hơn nguồn ánh sáng."],"answer":["T","F","F","T"],"explain":"a) Đúng: đa dạng cao → lưới thức ăn phức tạp, nhiều loài thay thế nhau → quần xã ổn định hơn trước biến động. b) Sai: loài ưu thế là loài đóng vai trò quan trọng nhất, quyết định cấu trúc quần xã (ví dụ cây gỗ lớn trong rừng), không nhất thiết là loài đông nhất về số lượng. c) Sai: ổ sinh thái là 'không gian sinh thái' tổng hợp (nơi ở, cách kiếm ăn, nguồn thức ăn, mối quan hệ…) — rộng hơn khái niệm giới hạn sinh thái (khoảng giá trị chịu đựng của từng nhân tố). d) Đúng: phân tầng (tầng vượt tán, tầng tán, tầng dưới tán, thảm cỏ) giúp các loài sử dụng ánh sáng ở các cường độ khác nhau, giảm cạnh tranh.","points":1},{"type":"short","level":"VDC","q":"Để ước tính số cá trong một ao, người ta bắt 200 con, đánh dấu rồi thả lại ao. Sau một thời gian, bắt lại 300 con thì thấy có 60 con mang dấu. Biết rằng sau khi thả, 10% số cá đã đánh dấu bị chết (số còn lại phân bố đều trong ao). Ước tính tổng số cá trong ao ở thời điểm bắt lần hai là bao nhiêu con?","answer":"900","explain":"Số cá đánh dấu còn sống sau khi thả = 200 × 90% = 180 con. Gọi N là tổng số cá trong ao; theo phương pháp đánh dấu – bắt lại: 180/N = 60/300, suy ra N = 180 × 300/60 = 900 con. (Giả thiết: cá mang dấu và không mang dấu có khả năng bị bắt như nhau, không có di cư trong thời gian nghiên cứu.)","points":0.5},{"type":"short","level":"VDC","q":"Một quần thể thỏ có kích thước ban đầu là 500 con. Tỉ lệ sinh là 0,4/năm, tỉ lệ tử là 0,1/năm; không có di cư hay nhập cư (tăng trưởng hàm mũ). Sau 2 năm, kích thước quần thể là bao nhiêu con? (Làm tròn đến số nguyên.)","answer":"845","explain":"Tốc độ tăng trưởng riêng r = tỉ lệ sinh − tỉ lệ tử = 0,4 − 0,1 = 0,3/năm. Theo mô hình tăng trưởng hàm mũ (dạng rời rạc): N(t) = N0 × (1 + r)^t = 500 × 1,3² = 500 × 1,69 = 845 con.","points":0.5}]}]}
