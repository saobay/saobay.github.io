<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 3", "questions": [{"type": "mcq", "level": "VDC", "q": "Có 4 món đồ với trọng lượng w = [2, 3, 4, 5] và giá trị v = [3, 4, 5, 6]. Một chiếc ba lô chịu được trọng lượng tối đa W = 8. Mỗi món đồ chỉ được lấy tối đa một lần (bài toán cái túi 0/1). Hỏi tổng giá trị lớn nhất có thể đạt được là bao nhiêu?", "options": ["A. 9", "B. 10", "C. 11", "D. 12"], "answer": "B", "explain": "Liệt kê các tập đồ vật có tổng trọng lượng không vượt quá 8:\n- {đồ 1, đồ 4}: trọng lượng 2 + 5 = 7, giá trị 3 + 6 = 9.\n- {đồ 2, đồ 3}: trọng lượng 3 + 4 = 7, giá trị 4 + 5 = 9.\n- {đồ 2, đồ 4}: trọng lượng 3 + 5 = 8, giá trị 4 + 6 = 10.\n- {đồ 1, đồ 2, đồ 3}: trọng lượng 9, vượt quá W nên loại.\n- {đồ 3, đồ 4}: trọng lượng 9, vượt quá W nên loại.\nGiá trị lớn nhất đạt được là 10 (lấy đồ 2 và đồ 4). Đáp án B.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho dãy số a = [10, 9, 2, 5, 3, 7, 101, 18]. Độ dài của dãy con tăng dài nhất (không nhất thiết liên tục) của a là bao nhiêu?", "options": ["A. 3", "B. 4", "C. 5", "D. 6"], "answer": "B", "explain": "Gọi dp[i] là độ dài dãy con tăng dài nhất kết thúc tại a[i]: dp = [1, 1, 1, 2, 2, 3, 4, 4]. Ví dụ dp[6] = 4 ứng với dãy con 2, 3, 7, 101 (hoặc 2, 5, 7, 101); dp[7] = 4 ứng với 2, 3, 7, 18. Giá trị lớn nhất là 4. Đáp án B.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cần đổi số tiền 6 bằng các loại xu có mệnh giá [1, 3, 4] (mỗi loại có đủ số lượng), mục tiêu dùng ít xu nhất. Thuật toán tham lam \"mỗi bước lấy đồng xu có mệnh giá lớn nhất không vượt quá số tiền còn lại\" cho kết quả thế nào?", "options": ["A. 3 xu và đây là phương án tối ưu.", "B. 2 xu và đây là phương án tối ưu.", "C. 3 xu nhưng chưa tối ưu; phương án tối ưu chỉ cần 2 xu (3 + 3).", "D. 4 xu nhưng chưa tối ưu; phương án tối ưu chỉ cần 2 xu (3 + 3)."], "answer": "C", "explain": "Truy vết thuật toán tham lam với số tiền 6: lấy xu 4 (còn 2), lấy xu 1 (còn 1), lấy xu 1 (còn 0) — tổng 3 xu. Nhưng phương án 3 + 3 chỉ cần 2 xu, tốt hơn. Đây là phản ví dụ kinh điển cho thấy thuật toán tham lam đổi tiền KHÔNG luôn tối ưu với mọi hệ tiền xu (nó chỉ đảm bảo tối ưu với các hệ tiền \"chuẩn\" như tiền Việt Nam). Đáp án C.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xét đoạn mã đếm số cách đổi tiền (thứ tự các đồng xu không phân biệt):\n\ndp = [0] * 11\ndp[0] = 1\nVới c trong [1, 2, 5]:\n    Với x chạy từ c đến 10:\n        dp[x] = dp[x] + dp[x - c]\nIn dp[10]\n\nGiá trị in ra là bao nhiêu?", "options": ["A. 8", "B. 10", "C. 12", "D. 27"], "answer": "B", "explain": "Đây là quy hoạch động đếm số cách đổi tiền xu (mỗi loại xu xét một lần nên thứ tự không phân biệt). Đếm theo số đồng xu 5:\n- 0 đồng xu 5: đổi 10 bằng xu [1, 2] có 6 cách (0..5 đồng xu 2).\n- 1 đồng xu 5: đổi 5 còn lại bằng xu [1, 2] có 3 cách.\n- 2 đồng xu 5: 1 cách.\nTổng cộng 6 + 3 + 1 = 10 cách. Đáp án B.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Có 11 hoạt động, mỗi hoạt động có thời gian bắt đầu và kết thúc (bắt đầu, kết thúc): (1,4), (3,5), (0,6), (5,7), (3,9), (5,9), (6,10), (8,11), (8,12), (2,14), (12,16). Cần chọn nhiều hoạt động nhất sao cho không có hai hoạt động nào giao nhau (hoạt động kết thúc tại thời điểm t thì hoạt động khác được phép bắt đầu tại t). Áp dụng thuật toán tham lam \"luôn chọn hoạt động có thời gian kết thúc sớm nhất trong số các hoạt động còn tương thích\", hỏi chọn được tối đa bao nhiêu hoạt động?", "options": ["A. 3", "B. 4", "C. 5", "D. 6"], "answer": "B", "explain": "Sắp xếp theo giờ kết thúc tăng dần: (1,4), (3,5), (0,6), (5,7), (3,9), (5,9), (6,10), (8,11), (8,12), (2,14), (12,16). Tham lam:\n- Chọn (1,4).\n- Hoạt động tương thích tiếp theo có giờ kết thúc sớm nhất: (5,7) (vì 5 lớn hơn hoặc bằng 4).\n- Tiếp theo: (8,11) (8 lớn hơn hoặc bằng 7).\n- Tiếp theo: (12,16) (12 lớn hơn hoặc bằng 11).\nChọn được 4 hoạt động: (1,4), (5,7), (8,11), (12,16). Đáp án B.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thuật toán quy hoạch động tìm dãy con chung dài nhất (LCS) của hai xâu có độ dài n và m dùng một bảng hai chiều kích thước (n + 1) × (m + 1), mỗi ô tính trong $O(1)$. Với n = m = 1000, bảng này có khoảng bao nhiêu ô nhớ?", "options": ["A. khoảng $2 \\times 10^3$ ô", "B. khoảng $10^6$ ô", "C. khoảng $10^9$ ô", "D. khoảng $10^3$ ô"], "answer": "B", "explain": "Bảng có kích thước $1001 \\times 1001 = 1002001$ ô, tức khoảng $10^6$ ô nhớ. Mỗi ô thường lưu một số nguyên (4 byte) nên tổng bộ nhớ khoảng 4MB — hoàn toàn khả thi. Đáp án B.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về quy hoạch động:", "statements": ["a) Bài toán cái túi 0/1 có thể giải tối ưu bằng thuật toán tham lam chọn đồ vật theo tỉ lệ giá trị/trọng lượng giảm dần.", "b) Công thức truy hồi F(n) = F(n-1) + F(n-2) của dãy Fibonacci thể hiện tính chất các bài toán con gối nhau.", "c) Mọi bài toán quy hoạch động đều bắt buộc phải dùng bảng phương án hai chiều.", "d) Thuật toán Floyd-Warshall tìm đường đi ngắn nhất giữa mọi cặp đỉnh có độ phức tạp thời gian $O(n^3)$ với n là số đỉnh."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: tỉ lệ giá trị/trọng lượng chỉ tối ưu cho bài toán cái túi PHÂN SỐ; với 0/1, tham lam có thể sai (ví dụ W = 8 ở câu trên: tham lam theo tỉ lệ sẽ lấy đồ có tỉ lệ cao trước và không đạt tối ưu).\nb) Đúng: để tính F(n) phải tính lại F(n-1), F(n-2) mà các giá trị này gối lên nhau — chính là lý do đệ quy ngây thơ chậm và quy hoạch động hiệu quả.\nc) Sai: nhiều bài toán chỉ cần bảng một chiều (cái túi 0/1) hoặc vài biến (Fibonacci).\nd) Đúng: ba vòng lặp lồng nhau (đỉnh trung gian, đỉnh đầu, đỉnh cuối) nên độ phức tạp là $O(n^3)$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về thuật toán tham lam:", "statements": ["a) Thuật toán Dijkstra tìm đường đi ngắn nhất từ một đỉnh nguồn là một thuật toán tham lam.", "b) Thuật toán Kruskal tìm cây khung nhỏ nhất là một thuật toán tham lam.", "c) Trong bài toán xếp lịch (chọn nhiều hoạt động nhất), chiến lược tham lam \"chọn hoạt động bắt đầu sớm nhất\" luôn cho số hoạt động tối đa.", "d) Thuật toán tham lam đổi tiền luôn cho số xu ít nhất với mọi hệ tiền xu."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: Dijkstra mỗi bước tham lam chọn đỉnh chưa xét có khoảng cách tạm thời nhỏ nhất.\nb) Đúng: Kruskal mỗi bước tham lam chọn cạnh rẻ nhất không tạo chu trình.\nc) Sai: chiến lược đúng là chọn hoạt động KẾT THÚC sớm nhất; chọn theo giờ bắt đầu sớm nhất có thể cho kết quả kém (ví dụ hoạt động (0,6) bắt đầu sớm nhất nhưng chặn nhiều hoạt động khác).\nd) Sai: phản ví dụ hệ xu [1, 3, 4] với số tiền 6 (tham lam cho 3 xu trong khi tối ưu là 2 xu).", "points": 1}, {"type": "short", "level": "VDC", "q": "Một robot đứng tại ô (0, 0) của lưới 3 hàng × 4 cột (hàng 0..2, cột 0..3), cần tới ô (2, 3). Mỗi bước robot chỉ được đi sang phải một ô hoặc xuống dưới một ô. Gọi dp[i][j] là số cách đi tới ô (i, j), với dp[0][j] = dp[i][0] = 1 và dp[i][j] = dp[i-1][j] + dp[i][j-1] (i, j lớn hơn 0). Hỏi dp[2][3] bằng bao nhiêu?", "answer": "10", "explain": "Điền bảng dp:\n- Hàng 0: dp[0][0..3] = 1, 1, 1, 1.\n- Hàng 1: dp[1][0] = 1; dp[1][1] = 1 + 1 = 2; dp[1][2] = 1 + 2 = 3; dp[1][3] = 1 + 3 = 4.\n- Hàng 2: dp[2][0] = 1; dp[2][1] = 1 + 2 = 3; dp[2][2] = 3 + 3 = 6; dp[2][3] = 4 + 6 = 10.\nVậy dp[2][3] = 10 (cũng bằng tổ hợp chập 2 của 5: chọn 2 bước xuống trong tổng 5 bước).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Độ dài của dãy con chung dài nhất của hai xâu X = \"ABCBDAB\" và Y = \"BDCABA\" là bao nhiêu? (Dãy con không cần liên tục.)", "answer": "4", "explain": "Dùng quy hoạch động LCS: dp[i][j] là độ dài LCS của X[0..i-1] và Y[0..j-1]; nếu hai ký tự cuối bằng nhau thì dp[i][j] = dp[i-1][j-1] + 1, ngược lại dp[i][j] = max(dp[i-1][j], dp[i][j-1]). Điền bảng cho X = \"ABCBDAB\", Y = \"BDCABA\" được dp[7][6] = 4. Một LCS cụ thể là \"BCBA\" (B-C-B-A). Vậy đáp án là 4.", "points": 0.5}]}]}
