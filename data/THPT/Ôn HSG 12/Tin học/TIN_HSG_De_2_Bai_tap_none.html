<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 2", "questions": [{"type": "mcq", "level": "VDC", "q": "Xét hàm đệ quy tính số Fibonacci (dem là biến toàn cục, khởi tạo bằng 0):\n\nF(n):\n    dem = dem + 1\n    Nếu n nhỏ hơn hoặc bằng 1:\n        trả về n\n    Ngược lại:\n        trả về F(n - 1) + F(n - 2)\n\nKhi gọi F(5), biến dem bằng bao nhiêu (tức có bao nhiêu lần gọi hàm F, kể cả lần gọi đầu tiên)?", "options": ["A. 9", "B. 12", "C. 15", "D. 25"], "answer": "C", "explain": "Cây gọi đệ quy: F(5) gọi F(4) và F(3); F(4) gọi F(3) và F(2); F(3) gọi F(2) và F(1); F(2) gọi F(1) và F(0). Gọi C(n) là số lần gọi hàm khi tính F(n): C(0) = C(1) = 1 và C(n) = 1 + C(n-1) + C(n-2). Tính dần: C(2) = 3, C(3) = 5, C(4) = 9, C(5) = 15. Vậy dem = 15. Đáp án C.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xét thủ tục đệ quy:\n\nF(n):\n    Nếu n lớn hơn 0:\n        F(n // 2)\n        In (n mod 2)   # in liền nhau, không xuống dòng\n\nKhi gọi F(13), dãy ký tự được in ra (liền nhau, không xuống dòng) là gì?", "options": ["A. \"1011\"", "B. \"1101\"", "C. \"1010\"", "D. \"0111\""], "answer": "B", "explain": "Vì lệnh in đặt SAU lời gọi đệ quy nên các chữ số được in theo thứ tự từ lần gọi sâu nhất trở ra (ngược với thứ tự gọi):\n- F(13) gọi F(6) rồi in 13 mod 2 = 1.\n- F(6) gọi F(3) rồi in 6 mod 2 = 0.\n- F(3) gọi F(1) rồi in 3 mod 2 = 1.\n- F(1) gọi F(0) (không làm gì) rồi in 1 mod 2 = 1.\nThứ tự in: 1, 0, 1, 1, tức \"1101\" — chính là biểu diễn nhị phân của 13. Đáp án B.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xét thủ tục đệ quy giải bài toán Tháp Hà Nội (chuyển n đĩa từ cọc A sang cọc C nhờ cọc trung gian B), biến dem đếm số lần gọi thủ tục:\n\nChuyen(n, A, B, C):\n    dem = dem + 1\n    Nếu n bằng 1:\n        In A, \"sang\", C\n        trả về\n    Chuyen(n - 1, A, C, B)\n    In A, \"sang\", C\n    Chuyen(n - 1, B, A, C)\n\nKhi gọi Chuyen(3, 'A', 'B', 'C'), dem bằng bao nhiêu (dem khởi tạo bằng 0)?", "options": ["A. 5", "B. 6", "C. 7", "D. 8"], "answer": "C", "explain": "Gọi C(n) là số lần gọi thủ tục khi chuyển n đĩa: C(1) = 1 và C(n) = 1 + 2 × C(n-1) (một lần gọi hiện tại cộng hai lần gọi đệ quy cho n-1 đĩa). Tính dần: C(2) = 1 + 2 × 1 = 3, C(3) = 1 + 2 × 3 = 7. Vậy dem = 7. Đáp án C.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để tính số Fibonacci F(6), người ta dùng kỹ thuật nhớ (memoization): mỗi giá trị F(k) với k từ 0 đến 6 chỉ được tính một lần duy nhất, các lần cần lại thì tra bảng. Hỏi tổng số phép cộng được thực hiện để tính F(6) (không tính các phép cộng, trừ của chỉ số và điều khiển vòng lặp)?", "options": ["A. 4", "B. 5", "C. 8", "D. 15"], "answer": "B", "explain": "Với memoization, mỗi F(k) (k = 2..6) được tính đúng một lần theo công thức F(k) = F(k-1) + F(k-2), mỗi lần tính tốn đúng 1 phép cộng (hai giá trị F(k-1), F(k-2) đã có sẵn trong bảng). Có 5 giá trị cần tính (F(2) đến F(6)) nên tổng số phép cộng là 5. (So sánh: đệ quy ngây thơ cần tới 15 lần gọi hàm.) Đáp án B.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để tìm đồng thời giá trị lớn nhất và nhỏ nhất của mảng a có n = 8 phần tử, người ta dùng thuật toán chia để trị:\n\nMaxMin(l, r):\n    Nếu l bằng r: trả về (a[l], a[l])\n    Nếu r bằng l + 1:\n        Nếu a[l] lớn hơn a[r]: trả về (a[l], a[r])\n        Ngược lại: trả về (a[r], a[l])\n    mid = (l + r) // 2\n    (max1, min1) = MaxMin(l, mid)\n    (max2, min2) = MaxMin(mid + 1, r)\n    Nếu max1 lớn hơn max2: mx = max1, ngược lại mx = max2\n    Nếu min1 nhỏ hơn min2: mn = min1, ngược lại mn = min2\n    trả về (mx, mn)\n\nHỏi tổng số phép so sánh giữa các phần tử của mảng khi gọi MaxMin(0, 7) là bao nhiêu? (Mỗi lần thực hiện \"nếu ... lớn hơn ...\" hoặc \"nhỏ hơn\" tính là một phép so sánh.)", "options": ["A. 8", "B. 10", "C. 12", "D. 14"], "answer": "B", "explain": "Gọi T(n) là số phép so sánh với đoạn có n phần tử. Với n = 2: đúng 1 phép so sánh. Với n lớn hơn 2: T(n) = 2 × T(n/2) + 2 (hai bài toán con nửa kích thước cộng 2 phép so sánh để gộp max và min). Tính dần: T(4) = 2 × 1 + 2 = 4, T(8) = 2 × 4 + 2 = 10. (Cách ngây thơ duyệt một lần cần tới 2n - 2 = 14 phép so sánh.) Đáp án B.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cần tính $a^n \\bmod M$ với n có thể tới $10^{18}$ (M cho trước; a, M nguyên dương). Nhận định nào sau đây đúng?", "options": ["A. Dùng vòng lặp nhân a đúng n lần rồi lấy dư cho M: đơn giản và đủ nhanh vì mỗi phép nhân chỉ tốn $O(1)$.", "B. Dùng đệ quy chia để trị: $P(n) = P(n/2)^2 \\bmod M$ khi n chẵn, $P(n) = a \\cdot P(n-1) \\bmod M$ khi n lẻ (với $P(0) = 1$); độ phức tạp $O(\\log n)$ nên khả thi với n = $10^{18}$.", "C. Tính $a^n$ bằng hàm lũy thừa có sẵn của ngôn ngữ rồi lấy dư cho M: nhanh nhất vì hàm có sẵn được tối ưu ở mức thấp.", "D. Không thể tính được vì $a^n$ với n = $10^{18}$ vượt quá mọi kiểu dữ liệu số nguyên."], "answer": "B", "explain": "Phân tích:\n- A sai: lặp $10^{18}$ lần là không thể (cần hàng chục năm).\n- C sai: $a^n$ tràn số từ rất sớm, hàm lũy thừa số thực còn mất chính xác.\n- D sai: ta không bao giờ cần lưu $a^n$ đầy đủ.\n- B đúng: đây là thuật toán lũy thừa nhị phân; mỗi bước đệ quy giảm n đi khoảng một nửa (trường hợp n lẻ thì n-1 chẵn nên bước sau lại giảm nửa), số phép nhân chỉ cỡ $2\\log_2 n \\approx 120$ với n = $10^{18}$, và mọi phép tính đều lấy dư M nên không tràn số. Đáp án B.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về đệ quy:", "statements": ["a) Mọi hàm đệ quy đều có thể viết lại thành dạng vòng lặp có dùng ngăn xếp (stack) tường minh.", "b) Đệ quy đuôi (tail recursion) luôn được mọi trình biên dịch tối ưu thành vòng lặp nên không bao giờ gây tràn ngăn xếp.", "c) Thuật toán QuickSort trong trường hợp xấu nhất có độ sâu đệ quy $O(n)$, có thể gây tràn ngăn xếp.", "d) Số lần gọi hàm của thuật toán đệ quy ngây thơ tính số Fibonacci tăng theo hàm mũ theo n."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: ngăn xếp tường minh mô phỏng chính xác ngăn xếp lời gọi hàm của đệ quy.\nb) Sai: tối ưu đệ quy đuôi phụ thuộc trình biên dịch/ngôn ngữ (ví dụ Python không tối ưu), không phải \"mọi trình biên dịch\" đều làm.\nc) Đúng: khi chốt luôn rơi vào đầu/cuối đoạn (mảng đã sắp xếp), mỗi lần đệ quy chỉ giảm 1 phần tử nên độ sâu đệ quy là $O(n)$.\nd) Đúng: số lần gọi hàm xấp xỉ $2 \\times F(n+1) - 1$, tăng theo hàm mũ (cơ số tỉ lệ vàng $\\approx 1{,}618$).", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về chia để trị và quy hoạch động:", "statements": ["a) Kỹ thuật chia để trị yêu cầu các bài toán con phải gối lên nhau (có phần chung).", "b) Quy hoạch động áp dụng được khi bài toán có cấu trúc con tối ưu và các bài toán con gối nhau.", "c) Thuật toán tham lam luôn cho nghiệm tối ưu chỉ cần bài toán có cấu trúc con tối ưu.", "d) MergeSort là ví dụ của chia để trị; tính số Fibonacci bằng vòng lặp chỉ lưu hai giá trị trước là ví dụ của quy hoạch động (dạng tối ưu bộ nhớ)."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: chia để trị yêu cầu các bài toán con ĐỘC LẬP (không gối nhau); bài toán con gối nhau là dấu hiệu của quy hoạch động.\nb) Đúng: đó chính là hai điều kiện để quy hoạch động phát huy tác dụng.\nc) Sai: tham lam còn cần thêm tính chất lựa chọn tham lam (lựa chọn tối ưu cục bộ dẫn tới tối ưu toàn cục); ví dụ đổi tiền với hệ xu [1, 3, 4] thì tham lam không tối ưu.\nd) Đúng: MergeSort chia mảng thành hai nửa độc lập; vòng lặp Fibonacci chỉ lưu hai giá trị trước chính là quy hoạch động với bảng được nén còn $O(1)$ bộ nhớ.", "points": 1}, {"type": "short", "level": "VDC", "q": "Xét hàm đệ quy (dem là biến toàn cục khởi tạo bằng 0):\n\nG(n):\n    dem = dem + 1\n    Nếu n nhỏ hơn hoặc bằng 1:\n        trả về 1\n    Ngược lại:\n        trả về G(n - 1) + G(n - 2) + G(n - 3)\n\nKhi gọi G(4), dem bằng bao nhiêu (tức có bao nhiêu lần gọi hàm G, kể cả lần gọi đầu tiên)?", "answer": "13", "explain": "Gọi C(n) là số lần gọi hàm: C(n) = 1 với n nhỏ hơn hoặc bằng 1 (gồm cả n âm), và C(n) = 1 + C(n-1) + C(n-2) + C(n-3) với n lớn hơn 1.\n- C(2) = 1 + C(1) + C(0) + C(-1) = 1 + 1 + 1 + 1 = 4.\n- C(3) = 1 + C(2) + C(1) + C(0) = 1 + 4 + 1 + 1 = 7.\n- C(4) = 1 + C(3) + C(2) + C(1) = 1 + 7 + 4 + 1 = 13.\nVậy dem = 13.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Xét hàm đệ quy (dem là biến toàn cục khởi tạo bằng 0):\n\nK(n):\n    dem = dem + 1\n    Nếu n bằng 1:\n        trả về 1\n    Nếu n chẵn:\n        trả về K(n // 2)\n    Ngược lại:\n        trả về K(3 * n + 1)\n\nKhi gọi K(6), dem bằng bao nhiêu (tức có bao nhiêu lần gọi hàm K, kể cả lần gọi đầu tiên)?", "answer": "9", "explain": "Đây là hàm mô phỏng dãy Collatz. Truy vết các lần gọi: K(6) (6 chẵn) gọi K(3); K(3) (3 lẻ) gọi K(10); K(10) gọi K(5); K(5) gọi K(16); K(16) gọi K(8); K(8) gọi K(4); K(4) gọi K(2); K(2) gọi K(1); K(1) gặp điều kiện dừng. Tổng cộng 9 lần gọi hàm, vậy dem = 9.", "points": 0.5}]}]}
