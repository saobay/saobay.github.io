<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nDespite the CEO's repeated reassurances, the leaked memo only served to ______ serious doubts about the company's solvency.","options":["A. cast","B. shed","C. throw","D. project"],"answer":"A","explain":"Đáp án A. Cụm cố định là \"cast doubt on/about something\" (gây nghi ngờ). B sai: \"shed\" đi với \"light\" (shed light on: làm sáng tỏ), không đi với \"doubt\". C sai: không có cụm \"throw doubt\". D sai: \"project\" nghĩa là thể hiện hình ảnh, không kết hợp với \"doubt\"."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe new policy, though initially unpopular, proved to be ______ when productivity rose sharply within a year.","options":["A. a Pyrrhic victory","B. a blessing in disguise","C. a bolt from the blue","D. a flash in the pan"],"answer":"B","explain":"Đáp án B. \"a blessing in disguise\" = điều ban đầu tưởng xấu nhưng hóa ra tốt (chính sách ban đầu bị phản đối nhưng sau đó năng suất tăng). C sai: \"a bolt from the blue\" = sự việc hoàn toàn bất ngờ, không nhấn mạnh \"tưởng xấu hóa tốt\". D sai: \"a flash in the pan\" = thành công chớp nhoáng rồi tắt. A sai: \"a Pyrrhic victory\" = chiến thắng với cái giá quá đắt."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nHer ______ to the throne was contested by several rival claimants.","options":["A. accessing","B. accessment","C. accession","D. accedence"],"answer":"C","explain":"Đáp án C. \"accession\" là danh từ đúng của \"accede\" với nghĩa lên ngôi (accession to the throne). B, C, D không phải danh từ chuẩn trong tiếng Anh cho nghĩa này (\"accedence\" và \"accessment\" không tồn tại; \"accessing\" là danh động từ của \"access\" nghĩa truy cập)."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe results of the experiment ______ the hypothesis that bilingual children develop stronger executive functions.","options":["A. bear down","B. bear up","C. bear with","D. bear out"],"answer":"D","explain":"Đáp án D. \"bear out\" = xác nhận, chứng thực (kết quả thí nghiệm xác nhận giả thuyết). A sai: \"bear down\" = đè nặng, tiến tới. B sai: \"bear up\" = chịu đựng (thường là \"bear up well\"). C sai: \"bear with\" = kiên nhẫn với ai."},{"type":"mcq","level":"VDC","q":"Choose the sentence closest in meaning to the given sentence:\n\n\"As soon as the meeting ended, the press released the statement.\"","options":["A. No sooner had the meeting ended than the press released the statement.","B. Hardly had the meeting ended than the press released the statement.","C. Scarcely had the meeting ended when the press had released the statement.","D. No sooner did the meeting end when the press released the statement."],"answer":"A","explain":"Đáp án A. Cấu trúc đảo ngữ \"No sooner + had + S + V3/ed + than + S + V2/ed\". B sai: \"Hardly/Scarcely\" phải đi với \"when\", không đi với \"than\". C sai: mệnh đề sau \"when\" phải ở quá khứ đơn (\"released\"), không dùng quá khứ hoàn thành. D sai: \"No sooner\" phải đi với \"than\", không đi với \"when\"."},{"type":"mcq","level":"VDC","q":"Choose the sentence closest in meaning to the given sentence:\n\n\"I regret not applying for that scholarship.\"","options":["A. I wish I applied for that scholarship.","B. I wish I had applied for that scholarship.","C. If only I would apply for that scholarship.","D. I regret to not apply for that scholarship."],"answer":"B","explain":"Đáp án B. Hối tiếc về việc trong quá khứ: \"regret + V-ing\" tương đương \"wish + had + V3/ed\". A sai: \"wish + quá khứ đơn\" diễn tả ước muốn ở hiện tại, không phải quá khứ. C sai: \"If only + would\" diễn tả mong muốn chung chung, không phù hợp. D sai: \"regret to do\" nghĩa là \"lấy làm tiếc khi phải làm gì (sắp làm)\", sai nghĩa."},{"type":"mcq","level":"VDC","q":"There is ONE mistake in the sentence. Choose the underlined part (A, B, C or D) that needs correcting:\n\nThe (A) rapid spread of misinformation on social media (B) have made (C) it increasingly difficult for voters to (D) distinguish fact from fiction.","options":["A. (D)","B. (A)","C. (B)","D. (C)"],"answer":"C","explain":"Đáp án C. Chủ ngữ chính là \"spread\" (số ít), nên động từ phải là \"has made\", không phải \"have made\"; cụm \"of misinformation on social media\" chỉ là cụm bổ nghĩa xen giữa, không quyết định số của động từ. Các phần còn lại đều đúng."},{"type":"mcq","level":"VDC","q":"There is ONE mistake in the sentence. Choose the underlined part (A, B, C or D) that needs correcting:\n\nShe enjoys (A) reading novels, (B) to play chess, and (C) hiking (D) on weekends.","options":["A. (C)","B. (D)","C. (A)","D. (B)"],"answer":"D","explain":"Đáp án D. Lỗi song hành (parallelism): sau \"enjoys\" các hoạt động liệt kê phải cùng dạng V-ing (reading..., hiking...), nên \"to play\" phải sửa thành \"playing\". Các phần còn lại đúng dạng và đúng ngữ pháp."},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the following statements are True (T) or False (F):\n\nFor decades, linguists have debated whether the language we speak shapes the way we think. The strong version of the Sapir-Whorf hypothesis claims that language determines thought, a view now largely abandoned. However, a weaker version, known as linguistic relativity, has gained empirical support. Studies show that speakers of languages with absolute spatial terms navigate more accurately than speakers of languages relying on relative terms like left and right. Similarly, Russian speakers, who have distinct words for light and dark blue, discriminate shades of blue faster than English speakers. Critics argue these effects are modest and task-specific, suggesting language influences rather than dictates cognition. The emerging consensus treats language as one of several lenses through which humans interpret experience: powerful, but not all-determining.","statements":["a) The strong version of the Sapir-Whorf hypothesis is still widely accepted by linguists.","b) Research on color perception supports the idea that language can affect cognitive processing.","c) Critics of linguistic relativity claim that language has no effect whatsoever on thought.","d) The passage suggests that language is the single most important factor in shaping human thought."],"answer":["F","T","F","F"],"explain":"a) Sai: bài viết nói quan điểm này \"now largely abandoned\" (hiện đã bị bỏ rơi phần lớn). b) Đúng: nghiên cứu người Nga phân biệt sắc xanh nhanh hơn là bằng chứng ngôn ngữ ảnh hưởng xử lý nhận thức. c) Sai: các nhà phê bình chỉ cho rằng hiệu ứng \"modest and task-specific\" và ngôn ngữ \"influences rather than dictates\" (ảnh hưởng chứ không quyết định), chứ không phủ nhận hoàn toàn. d) Sai: kết luận coi ngôn ngữ chỉ là \"one of several lenses\" (một trong nhiều lăng kính), \"not all-determining\"."},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the following statements are True (T) or False (F):\n\nTraditional economics assumes people make rational choices, yet everyday behavior tells a different story. Behavioral economists argue that humans rely on mental shortcuts, often leading to predictable errors. Nudge theory, popularized by Thaler and Sunstein, proposes that small changes in how options are presented, known as choice architecture, can steer people toward better decisions without restricting freedom. Automatically enrolling employees in pension schemes, for instance, dramatically raises participation compared with opt-in systems. Critics warn, however, that nudges can be manipulative, allowing policymakers to steer citizens toward ends they have not consciously chosen. Defenders reply that choice architecture is unavoidable: options must be presented somehow, so they might as well be presented wisely.","statements":["a) Nudge theory is based on the assumption that people always make rational decisions.","b) Automatic pension enrollment is presented as evidence that nudges can change behavior.","c) According to critics, the main danger of nudges is that they restrict people's freedom of choice.","d) The author concludes that nudges should be abandoned because they are unethical."],"answer":["F","T","F","F"],"explain":"a) Sai: lý thuyết nudge xuất phát từ nhận định ngược lại, rằng con người mắc \"predictable errors\" (lỗi có thể dự đoán) do dùng lối tắt tư duy. b) Đúng: ví dụ ghi danh tự động vào quỹ hưu trí làm tăng mạnh tỷ lệ tham gia. c) Sai: phê bình nhắm vào tính \"manipulative\" (thao túng, lái người dân tới mục đích họ không chủ động chọn), trong khi lý thuyết khẳng định không hạn chế tự do lựa chọn. d) Sai: bài chỉ trình bày tranh luận hai chiều và lời đáp của phe ủng hộ, không kết luận nên loại bỏ nudge."},{"type":"short","level":"VDC","q":"Give the correct form of the word in CAPITALS to complete the sentence. Write ONE word:\n\nThe scientist's claims were met with widespread ______ in the academic community. (SKEPTIC)","answer":"skepticism","explain":"Vị trí sau tính từ \"widespread\" cần một danh từ. Từ gốc SKEPTIC (người hoài nghi) chuyển thành danh từ trừu tượng \"skepticism\" (chủ nghĩa hoài nghi, sự hoài nghi). Đáp án: skepticism."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word:\n\n______ the surface, the merger looks beneficial; a closer examination reveals serious risks.","answer":"beneath","explain":"Cụm \"beneath the surface\" (bên dưới bề mặt) nghĩa là \"nhìn thoáng qua thì\"; đối lập với \"a closer examination\" (xem xét kỹ). Đáp án: beneath."}]}]}
