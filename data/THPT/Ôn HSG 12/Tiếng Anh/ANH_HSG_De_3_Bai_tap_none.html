<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 3","questions":[{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe court's landmark ruling ______ a precedent for future cases involving digital privacy.","options":["A. set","B. established","C. laid","D. made"],"answer":"A","explain":"Đáp án A. Cụm cố định trong pháp lý là \"set a precedent\" (tạo tiền lệ). B sai: \"establish\" thường đi với \"principle/rule\", hiếm khi đi với \"precedent\". C sai: \"lay\" đi với \"foundation/basis\", không đi với \"precedent\". D sai: không có cụm \"make a precedent\"."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe whistleblower's testimony was the ______ that finally brought down the corrupt administration.","options":["A. red herring","B. smoking gun","C. silver bullet","D. golden handshake"],"answer":"B","explain":"Đáp án B. \"smoking gun\" = bằng chứng không thể chối cãi. C sai: \"silver bullet\" = giải pháp hoàn hảo cho vấn đề khó, không phải bằng chứng. D sai: \"golden handshake\" = khoản trợ cấp khi nghỉ việc. A sai: \"red herring\" = chi tiết đánh lạc hướng, nghĩa ngược với ngữ cảnh."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nHer ______ to detail impressed everyone on the hiring panel.","options":["A. meticulosity","B. meticulousship","C. meticulousness","D. meticulousity"],"answer":"C","explain":"Đáp án C. Tính từ \"meticulous\" (tỉ mỉ) tạo danh từ bằng hậu tố \"-ness\": \"meticulousness\". B, C, D đều không phải từ tồn tại trong tiếng Anh chuẩn (bẫy hậu tố giả \"-ity/-ship\" và lỗi chính tả \"meticulosity\")."},{"type":"mcq","level":"VDC","q":"Choose the best answer to complete the sentence:\n\nThe professor's lecture ______ the complex theory into terms the undergraduates could grasp.","options":["A. broke into","B. broke through","C. broke out","D. broke down"],"answer":"D","explain":"Đáp án D. \"break down\" = phân tích thành các phần nhỏ dễ hiểu. A sai: \"break into\" = xông vào, ngắt lời. B sai: \"break through\" = vượt qua rào cản, đột phá. C sai: \"break out\" = trốn thoát, bùng phát."},{"type":"mcq","level":"VDC","q":"Choose the sentence closest in meaning to the given sentence:\n\n\"The board insisted that the CEO resign immediately.\"","options":["A. The board insisted on the CEO's immediate resignation.","B. The board insisted that the CEO would resign immediately.","C. The board was insistent for the CEO to resign immediately.","D. The CEO was insisted to resign immediately by the board."],"answer":"A","explain":"Đáp án A. \"insist on + danh từ/V-ing\" tương đương \"insist (that) + S + V nguyên\" (thể giả định). B sai: sau \"insisted that\" không dùng \"would\". C sai: \"insistent\" phải đi với \"on\", không đi với \"for + to V\". D sai: \"insist\" là nội động từ, không dùng bị động kiểu này."},{"type":"mcq","level":"VDC","q":"Choose the sentence closest in meaning to the given sentence:\n\n\"It was the new evidence that convinced the jury.\"","options":["A. The jury was convinced by the new evidence among other things.","B. But for the new evidence, the jury would not have been convinced.","C. Not only the new evidence but also other factors convinced the jury.","D. The new evidence was what had convinced the jury before the trial."],"answer":"B","explain":"Đáp án B. Câu chẻ nhấn mạnh \"chính bằng chứng mới\" đã thuyết phục bồi thẩm đoàn, tương đương \"But for + N\" (nếu không có... thì...). A và C sai: tự ý thêm \"among other things/other factors\", làm mất ý nhấn mạnh duy nhất. D sai: thêm chi tiết \"before the trial\" không có trong câu gốc và sai thì."},{"type":"mcq","level":"VDC","q":"There is ONE mistake in the sentence. Choose the underlined part (A, B, C or D) that needs correcting:\n\n(A) Scarcely had the plane taken off (B) than the passengers (C) heard a loud explosion (D) from the engine.","options":["A. (D)","B. (A)","C. (B)","D. (C)"],"answer":"C","explain":"Đáp án C. Cấu trúc đúng là \"Scarcely/Hardly + had + S + V3/ed + when + S + V2/ed\"; phần (B) dùng \"than\" là sai, phải sửa thành \"when\". (\"No sooner\" mới đi với \"than\".) Các phần còn lại đúng."},{"type":"mcq","level":"VDC","q":"There is ONE mistake in the sentence. Choose the underlined part (A, B, C or D) that needs correcting:\n\n(A) The number of students (B) participating in exchange programs (C) have risen sharply (D) in recent years.","options":["A. (D)","B. (A)","C. (B)","D. (C)"],"answer":"D","explain":"Đáp án D. Chủ ngữ \"The number of...\" luôn ở số ít, nên động từ phải là \"has risen\". (Phân biệt với \"A number of...\" mới là số nhiều.) Các phần còn lại đúng."},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the following statements are True (T) or False (F):\n\nArtificial intelligence systems are often portrayed as objective, yet they learn from data produced by an unequal world. When a hiring algorithm is trained on historical employment records, it may penalize resumes containing words associated with women, simply because past hiring favored men. Such algorithmic bias is pernicious precisely because it wears a mask of neutrality: decisions appear mathematical rather than prejudiced. Technical fixes exist, such as rebalancing training data or constraining models, but they treat symptoms rather than causes. Some researchers argue the deeper problem is delegating moral judgments to systems incapable of understanding context. Until accountability frameworks catch up, the prudent course is to keep humans meaningfully in the loop rather than surrendering decisions to opaque models.","statements":["a) The passage argues that AI systems are inherently neutral because they rely on mathematics.","b) The hiring algorithm example shows how bias in historical data can be reproduced by AI.","c) According to the passage, technical adjustments alone are sufficient to eliminate algorithmic bias.","d) The author recommends removing humans from AI-assisted decision-making to improve efficiency."],"answer":["F","T","F","F"],"explain":"a) Sai: AI chỉ \"wears a mask of neutrality\" (mang mặt nạ trung lập); thực chất học từ dữ liệu của một thế giới bất bình đẳng. b) Đúng: thuật toán học từ hồ sơ tuyển dụng cũ vốn thiên vị nam giới nên tái tạo định kiến. c) Sai: các biện pháp kỹ thuật chỉ \"treat symptoms rather than causes\" (chữa triệu chứng, không chữa nguyên nhân). d) Sai: ngược lại, tác giả khuyên \"keep humans meaningfully in the loop\" (giữ con người trong vòng quyết định)."},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the following statements are True (T) or False (F):\n\nThe fall of the Roman Empire has long been narrated as a sudden catastrophe: barbarians breaching the gates of a decadent civilization. Recent scholarship tells a more gradual story. Archaeological evidence shows many Roman cities thriving well into the fifth century, while so-called invaders often sought integration rather than destruction, serving as soldiers and administrators. Some historians now speak of transformation rather than fall: the empire's institutions, laws, and language persisted, reshaping the kingdoms that succeeded it. This revision does not deny real suffering: plagues, civil wars, and economic contraction were devastating. But it challenges the comforting myth of a single dramatic collapse, reminding us that historical change is usually messier than the stories we tell about it.","statements":["a) Traditional accounts describe Rome's fall as a rapid and dramatic event.","b) Recent research suggests that Rome's institutions disappeared completely after the empire's fall.","c) Modern historians deny that the late empire experienced any real hardship.","d) The passage implies that simple historical narratives often distort complex realities."],"answer":["T","F","F","T"],"explain":"a) Đúng: cách kể truyền thống coi sự sụp đổ là \"sudden catastrophe\" (thảm họa bất ngờ). b) Sai: nghiên cứu mới cho rằng các thể chế, luật pháp, ngôn ngữ \"persisted\" (tồn tại tiếp), đó là \"transformation\" chứ không phải biến mất. c) Sai: bài viết khẳng định cách nhìn mới \"does not deny real suffering\" (không phủ nhận đau khổ thực sự). d) Đúng: câu kết nói biến đổi lịch sử \"messier than the stories we tell about it\" (rối rắm hơn những câu chuyện ta kể)."},{"type":"short","level":"VDC","q":"Give the correct form of the word in CAPITALS to complete the sentence. Write ONE word:\n\nThe peace talks ended in a complete ______. (BREAK)","answer":"breakdown","explain":"Cụm \"end in a complete breakdown\" (kết thúc trong sự đổ vỡ hoàn toàn). Từ BREAK chuyển thành danh từ ghép \"breakdown\" (sự thất bại, đổ vỡ). Đáp án: breakdown."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word:\n\nThe theory was ridiculed at first, only ______ gain widespread acceptance decades later.","answer":"to","explain":"Cấu trúc \"only to + V nguyên\" diễn tả kết quả bất ngờ, trái với mong đợi (ban đầu bị chế giễu, cuối cùng lại được chấp nhận). Đáp án: to."}]}]}
