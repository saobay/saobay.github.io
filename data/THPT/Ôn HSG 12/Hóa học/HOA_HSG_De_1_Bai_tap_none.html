<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "VDC", "q": "Đồng vị phóng xạ $^{210}$Po phân rã phát ra hạt $\\alpha$. Người ta đo được độ phóng xạ của một mẫu $^{210}$Po giảm đi 6,85% sau 14 ngày. Chu kỳ bán hủy của $^{210}$Po xấp xỉ", "options": ["A. 137 ngày", "B. 1384 ngày", "C. 14 ngày", "D. 69 ngày"], "answer": "A", "explain": "Phân rã phóng xạ tuân theo động học bậc 1: $A = A_0 e^{-kt}$, với $A$ là độ phóng xạ. Sau 14 ngày còn lại $100\\% - 6{,}85\\% = 93{,}15\\%$, tức là $A/A_0 = 0{,}9315$. Suy ra $k = -\\ln(0{,}9315)/14 \\approx 0{,}00507$ ngày$^{-1}$. Chu kỳ bán hủy $t_{1/2} = \\ln 2 / k \\approx 0{,}693/0{,}00507 \\approx 137$ ngày. Bẫy thường gặp: lấy 14 ngày chia cho 6,85% (sai vì phân rã theo hàm mũ, không tuyến tính); đáp án B là bẫy đổi đơn vị giờ/ngày.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai ion $XY_3^{2-}$ và $XY_4^{2-}$ được tạo nên từ hai nguyên tố X, Y. Tổng số proton trong $XY_3^{2-}$ là 40 và trong $XY_4^{2-}$ là 48. Số oxi hóa của X trong ion $XY_4^{2-}$ là", "options": ["A. +4", "B. +6", "C. +5", "D. +2"], "answer": "B", "explain": "Gọi $Z_X, Z_Y$ là số proton của X, Y. Ta có hệ: $Z_X + 3Z_Y = 40$ và $Z_X + 4Z_Y = 48$. Trừ hai phương trình được $Z_Y = 8$ (oxygen), suy ra $Z_X = 16$ (sulfur). Vậy hai ion là $SO_3^{2-}$ (sulfite) và $SO_4^{2-}$ (sulfate). Trong $SO_4^{2-}$, gọi số oxi hóa của S là $x$: $x + 4 \\times (-2) = -2$, suy ra $x = +6$. Bẫy thường gặp: nhầm $Z_Y = 8$ rồi kết luận X là oxygen; hoặc quên điện tích ion khi tính số oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Dựa trên mô hình VSEPR, phân tử nào sau đây có dạng hình học chữ T?", "options": ["A. $NH_3$", "B. $SF_4$", "C. $ClF_3$", "D. $XeF_4$"], "answer": "C", "explain": "Xét công thức VSEPR $AX_mE_n$ (m cặp liên kết, n cặp đơn): $NH_3$ là $AX_3E$ nên có dạng chóp tam giác; $SF_4$ là $AX_4E$ nên có dạng bập bênh (seesaw); $XeF_4$ là $AX_4E_2$ nên có dạng vuông phẳng; $ClF_3$ là $AX_3E_2$ với hai cặp electron đơn chiếm vị trí xích đạo của lưỡng chóp tam giác, ba nguyên tử F còn lại tạo thành hình chữ T. Bẫy thường gặp: nhầm $ClF_3$ với dạng phẳng tam giác (quên 2 cặp electron đơn trên Cl).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Kim loại M kết tinh theo mạng lập phương tâm diện (fcc). Bán kính nguyên tử của M là r. Phần trăm thể tích chiếm chỗ của các nguyên tử trong một ô mạng cơ sở xấp xỉ", "options": ["A. 52%", "B. 68%", "C. 74%", "D. 34%"], "answer": "C", "explain": "Ô mạng fcc chứa 4 nguyên tử (8 đỉnh × 1/8 + 6 tâm mặt × 1/2). Các nguyên tử tiếp xúc nhau theo đường chéo mặt: $4r = a\\sqrt{2}$, suy ra cạnh ô mạng $a = 2r\\sqrt{2}$. Thể tích 4 nguyên tử: $4 \\times \\frac{4}{3}\\pi r^3 = \\frac{16}{3}\\pi r^3$. Thể tích ô mạng: $a^3 = (2r\\sqrt{2})^3 = 16\\sqrt{2}\\,r^3$. Phần trăm chiếm chỗ $= \\frac{16\\pi/3}{16\\sqrt{2}} = \\frac{\\pi}{3\\sqrt{2}} \\approx 74\\%$. Bẫy thường gặp: dùng mạng lập phương đơn giản (52%) hoặc lập phương tâm khối (68%); nhầm số nguyên tử trong ô mạng fcc là 2 thay vì 4.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Electron cuối cùng của nguyên tử X (điền theo đúng nguyên lý vững bền và quy tắc Hund) có bộ bốn số lượng tử $n = 3$, $l = 1$, $m_l = 0$, $m_s = -1/2$. Nguyên tố X là", "options": ["A. Cl", "B. Ar", "C. S", "D. P"], "answer": "A", "explain": "Với $n = 3, l = 1$ electron nằm ở phân lớp $3p$ (gồm 3 orbital $m_l = -1, 0, +1$). Theo quy tắc Hund, electron điền lần lượt: $m_l = -1(\\uparrow)$, $0(\\uparrow)$, $+1(\\uparrow)$, rồi $m_l = -1(\\downarrow)$, $0(\\downarrow)$, $+1(\\downarrow)$. Electron có $m_l = 0, m_s = -1/2$ là electron thứ 5 của phân lớp $3p$, tức cấu hình $3p^5$. Cấu hình đầy đủ: $1s^2 2s^2 2p^6 3s^2 3p^5$, vậy $Z = 17$, X là chlorine (Cl). Bẫy thường gặp: đếm sai thứ tự điền spin (cho rằng $m_s = -1/2$ ứng với $3p^2$); nhầm $m_s = -1/2$ là electron đầu tiên của orbital.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong dãy cacbonyl halogenua $COF_2$, $COCl_2$, $COBr_2$, góc liên kết X-C-X biến đổi theo xu hướng nào?", "options": ["A. Tăng dần từ $COF_2$ đến $COBr_2$", "B. Giảm dần từ $COF_2$ đến $COBr_2$", "C. $COCl_2$ lớn nhất", "D. Cả ba bằng nhau (đều $120^\\circ$)"], "answer": "A", "explain": "Thực nghiệm: góc F-C-F $\\approx 108^\\circ$, góc Cl-C-Cl $\\approx 112^\\circ$, góc Br-C-Br $\\approx 113^\\circ$. Giải thích: theo quy tắc Bent, nguyên tử trung tâm C dồn tính chất s vào orbital hướng về nhóm thế ít âm điện hơn. F có độ âm điện lớn nhất nên cặp electron liên kết C-F bị hút mạnh về phía F, lực đẩy giữa các cặp liên kết C-F yếu đi làm góc F-C-F thu hẹp; đồng thời kích thước nguyên tử halogen tăng dần (F, Cl, Br theo chiều tăng dần) làm lực đẩy không gian giữa hai nguyên tử halogen tăng, góc X-C-X mở rộng. Kết quả tổng hợp: góc tăng dần theo thứ tự $COF_2 \\lt COCl_2 \\lt COBr_2$. Bẫy thường gặp: cho rằng cả ba đều $120^\\circ$ vì cùng lai hóa $sp^2$ (quên ảnh hưởng của cặp electron $\\pi$ C=O và hiệu ứng thế).", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về cấu tạo nguyên tử:", "statements": ["a) Chromium (Z = 24) có cấu hình electron là $[Ar]\\,3d^5 4s^1$.", "b) Electron có bộ số lượng tử $n = 2$, $l = 2$, $m_l = 0$, $m_s = +1/2$ có thể tồn tại trong nguyên tử.", "c) Ion $Fe^{3+}$ có cấu hình electron là $[Ar]\\,3d^5$.", "d) Trong cùng một orbital, hai electron luôn có số lượng tử spin trái dấu nhau."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: Cr là trường hợp ngoại lệ, cấu hình nửa bão hòa $3d^5 4s^1$ bền hơn $3d^4 4s^2$. b) Sai: số lượng tử orbital $l$ chỉ nhận giá trị từ $0$ đến $n - 1$, với $n = 2$ thì $l$ tối đa là $1$ (phân lớp p), không tồn tại $l = 2$ (phân lớp d). c) Đúng: Fe có cấu hình $[Ar]\\,3d^6 4s^2$; khi tạo ion $Fe^{3+}$, electron bị tách trước tiên từ phân lớp $4s$ rồi đến $3d$, còn lại $[Ar]\\,3d^5$. d) Đúng: nguyên lý Pauli cấm hai electron trong cùng orbital có cùng bộ bốn số lượng tử, nên hai electron chung orbital phải có spin ngược nhau.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về pin điện hóa:", "statements": ["a) Pin Daniell $Zn\\,|\\,Zn^{2+} \\,||\\, Cu^{2+} \\,|\\, Cu$ có sức điện động chuẩn $E^0_{pin} = 1{,}10\\,V$.", "b) Trong pin điện hóa, cực âm (anode) là nơi xảy ra quá trình khử.", "c) Ở điều kiện chuẩn, khi nối hai điện cực $Pt\\,|\\,Fe^{3+}, Fe^{2+}$ và $Pt\\,|\\,MnO_4^-, Mn^{2+}$ thành pin, $Fe^{2+}$ bị oxi hóa thành $Fe^{3+}$.", "d) Trong quá trình pin hoạt động, sức điện động của pin giảm dần theo thời gian."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: $E^0_{pin} = E^0_{cathode} - E^0_{anode} = E^0_{Cu^{2+}/Cu} - E^0_{Zn^{2+}/Zn} = 0{,}34 - (-0{,}76) = 1{,}10\\,V$. b) Sai: anode (cực âm) là nơi xảy ra quá trình oxi hóa (mất electron); quá trình khử xảy ra ở cathode (cực dương). c) Đúng: $E^0_{MnO_4^-/Mn^{2+}} = 1{,}51\\,V$ lớn hơn $E^0_{Fe^{3+}/Fe^{2+}} = 0{,}77\\,V$ nên $MnO_4^-$ là chất oxi hóa mạnh hơn, nó oxi hóa $Fe^{2+}$ thành $Fe^{3+}$. d) Đúng: khi pin hoạt động, nồng độ chất oxi hóa ở cathode giảm và nồng độ chất khử ở anode tăng, thương số phản ứng Q tiến dần tới hằng số cân bằng K nên theo phương trình Nernst, $E_{pin}$ giảm dần.", "points": 1}, {"type": "short", "level": "VDC", "q": "Ở $25^\\circ C$, tính pH của dung dịch $HCl$ $10^{-7}\\,M$ (lấy $K_w = 10^{-14}$). Viết đáp số làm tròn đến 2 chữ số thập phân.", "answer": "6.79", "explain": "Đây là bẫy kinh điển: không thể kết luận pH = 7 vì còn sự phân li của nước. Đặt $[H^+] = x$: từ $HCl$ có $10^{-7}\\,M$ $H^+$, từ nước có thêm $x - 10^{-7}$ $M$ $H^+$ và $[OH^-] = x - 10^{-7}$. Áp dụng $K_w$: $x(x - 10^{-7}) = 10^{-14}$, giải ra $x = \\frac{10^{-7} + \\sqrt{10^{-14} + 4 \\times 10^{-14}}}{2} = \\frac{1 + \\sqrt{5}}{2} \\times 10^{-7} \\approx 1{,}618 \\times 10^{-7}\\,M$. Suy ra $pH = -\\lg(1{,}618 \\times 10^{-7}) \\approx 6{,}79$. Kết quả vẫn mang tính acid (pH nhỏ hơn 7) như đúng bản chất của dung dịch acid, dù nồng độ acid rất loãng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ở $25^\\circ C$, $K_{sp}(AgCl) = 1{,}8 \\times 10^{-10}$, hằng số bền tổng cộng của phức $Ag(NH_3)_2^+$ là $\\beta_2 = 1{,}7 \\times 10^7$. Tính độ tan (mol/L) của $AgCl$ trong dung dịch $NH_3$ $1\\,M$. Viết đáp số dưới dạng $a \\times 10^{-2}$ với a làm tròn đến 2 chữ số thập phân.", "answer": "5.53", "explain": "Trong dung dịch $NH_3$, xảy ra hai cân bằng nối tiếp: $AgCl(s) \\rightleftharpoons Ag^+ + Cl^-$ ($K_{sp}$) và $Ag^+ + 2NH_3 \\rightleftharpoons Ag(NH_3)_2^+$ ($\\beta_2$). Cộng lại: $AgCl(s) + 2NH_3 \\rightleftharpoons Ag(NH_3)_2^+ + Cl^-$ với $K = K_{sp} \\times \\beta_2 = 1{,}8 \\times 10^{-10} \\times 1{,}7 \\times 10^7 = 3{,}06 \\times 10^{-3}$. Gọi độ tan là $s$: $[Ag(NH_3)_2^+] \\approx [Cl^-] = s$, $[NH_3] \\approx 1 - 2s \\approx 1\\,M$. Suy ra $K = s^2 / 1^2$, vậy $s = \\sqrt{3{,}06 \\times 10^{-3}} \\approx 5{,}53 \\times 10^{-2}\\,M$. Kiểm tra gần đúng: $2s \\approx 0{,}11 \\ll 1$ nên giả thiết $[NH_3] \\approx 1\\,M$ hợp lệ. Bẫy thường gặp: chỉ tính $s = \\sqrt{K_{sp}}$ (bỏ qua tạo phức) hoặc quên bình phương nồng độ $NH_3$.", "points": 0.5}]}]}
