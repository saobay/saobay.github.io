<script type="applicatio<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 2", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một tải ba pha đối xứng nối hình sao, điện áp pha $U_p = 220V$, điện trở mỗi pha $R = 10\\Omega$. Dòng điện dây và công suất tác dụng của tải là:", "options": ["A. $I_d = 22A$, $P = 14.52kW$.", "B. $I_d = 38A$, $P = 25.1kW$.", "C. $I_d = 12.7A$, $P = 8.4kW$.", "D. $I_d = 66A$, $P = 43.6kW$."], "answer": "A", "explain": "Tải nối hình sao: $I_d = I_p = U_p/R = 220/10 = 22A$. Công suất: $P = 3U_pI_p = 3 \\times 220 \\times 22 = 14520W = 14.52kW$. Phương án B nhầm sang cách nối tam giác ($I_p = U_d/R = 380/10 = 38A$); phương án C lấy nhầm $U_p = 220/\\sqrt{3}$."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một tải ba pha đối xứng được chuyển từ cách nối hình sao sang nối hình tam giác, giữ nguyên nguồn điện ba pha. Công suất tiêu thụ của tải thay đổi như thế nào?", "options": ["A. Tăng $3$ lần.", "B. Tăng $\\sqrt{3}$ lần.", "C. Giảm $\\sqrt{3}$ lần.", "D. Không đổi."], "answer": "A", "explain": "Nối sao: $P_Y = 3U_p^2/R$. Nối tam giác: điện áp đặt lên mỗi pha $= U_d = \\sqrt{3}U_p$, nên $P_{\\Delta} = 3(\\sqrt{3}U_p)^2/R = 9U_p^2/R = 3P_Y$. Vậy công suất tăng đúng $3$ lần. Đây chính là cơ sở của phương pháp khởi động sao -- tam giác cho động cơ không đồng bộ ba pha."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một máy biến áp ba pha có cuộn sơ cấp nối hình tam giác, cuộn thứ cấp nối hình sao. Điện áp dây sơ cấp $U_{d1} = 380V$, tỉ số vòng dây mỗi pha $k = N_1/N_2 = 10$. Điện áp dây thứ cấp $U_{d2}$ bằng:", "options": ["A. $38V$.", "B. $22V$.", "C. $66V$.", "D. $220V$."], "answer": "C", "explain": "Sơ cấp nối tam giác: $U_{p1} = U_{d1} = 380V$. Điện áp pha thứ cấp: $U_{p2} = U_{p1}/k = 380/10 = 38V$. Thứ cấp nối hình sao: $U_{d2} = \\sqrt{3}\\,U_{p2} = \\sqrt{3} \\times 38 \\approx 65.8V \\approx 66V$. Phương án A quên nhân $\\sqrt{3}$ khi chuyển từ áp pha sang áp dây của cuộn sao."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một đường dây truyền tải điện có điện trở $R$ không đổi, cần truyền một công suất $P$ xác định (hệ số công suất không đổi). Nếu nâng điện áp truyền tải từ $220V$ lên $22kV$ thì tổn hao công suất trên đường dây thay đổi như thế nào?", "options": ["A. Giảm $10000$ lần.", "B. Giảm $100$ lần.", "C. Giảm $1000$ lần.", "D. Tăng $100$ lần."], "answer": "A", "explain": "Tổn hao trên đường dây: $\\Delta P = I^2R = (P/U)^2R = P^2R/U^2$, tỉ lệ nghịch với bình phương điện áp truyền tải. Tỉ số điện áp $22000/220 = 100$, nên tổn hao giảm $100^2 = 10000$ lần. Đây là lí do lưới điện quốc gia dùng cấp điện áp siêu cao áp để truyền tải điện đi xa."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một gia đình sử dụng điện $220V$ với tổng công suất các thiết bị thường xuyên hoạt động đồng thời khoảng $4.4kW$. Để đảm bảo an toàn và sử dụng lâu dài, aptomat tổng và dây dẫn nên chọn:", "options": ["A. Aptomat $25A$, dây đồng $4mm^2$.", "B. Aptomat $16A$, dây đồng $1.5mm^2$.", "C. Aptomat $40A$, dây đồng $2.5mm^2$.", "D. Aptomat $20A$, dây đồng $1.5mm^2$."], "answer": "A", "explain": "Dòng điện tính toán: $I = P/U = 4400/220 = 20A$. Chọn aptomat có dòng định mức lớn hơn dòng tính toán một cấp: $25A$ (chọn $20A$ vừa khít sẽ dễ nhảy aptomat khi tải dao động; $40A$ thì mất tác dụng bảo vệ quá tải). Dây đồng $4mm^2$ chịu được khoảng $25$--$28A$, phù hợp; dây $1.5mm^2$ chỉ chịu khoảng $12$--$15A$ sẽ quá tải, phát nóng."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trong một phân xưởng, vỏ kim loại của máy công cụ bị rò điện. Một công nhân chạm vào vỏ máy. Biện pháp bảo vệ an toàn điện hiệu quả nhất trong tình huống này là:", "options": ["A. Nối đất bảo vệ vỏ máy kết hợp aptomat chống dòng rò (ELCB).", "B. Tăng tiết diện dây dẫn cấp nguồn cho máy.", "C. Đặt biển cảnh báo nguy hiểm gần máy.", "D. Cho máy nghỉ định kỳ để giảm nhiệt độ."], "answer": "A", "explain": "Nối đất bảo vệ tạo đường dẫn có điện trở rất nhỏ cho dòng rò, kéo điện áp trên vỏ máy xuống mức an toàn; ELCB phát hiện chênh lệch dòng điện đi -- về (dòng rò) và cắt điện trong thời gian rất ngắn. Aptomat thường chỉ bảo vệ quá tải/ngắn mạch, không đủ nhanh để cứu người bị điện giật. Các phương án còn lại không loại trừ nguy cơ điện giật khi chạm vỏ."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về mạch điện xoay chiều ba pha:", "statements": ["a) Nguồn ba pha nối hình sao có dây trung tính tạo ra hai cấp điện áp: $U_d = \\sqrt{3}\\,U_p$.", "b) Tải ba pha đối xứng nối hình sao có thể bỏ dây trung tính mà điện áp các pha tải vẫn ổn định.", "c) Khi tải nối hình tam giác, dòng điện dây bằng dòng điện pha.", "d) Đảo thứ tự hai trong ba pha của nguồn sẽ làm đổi chiều quay của động cơ ba pha."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: hệ thống 380/220V quen thuộc trong thực tế. b) Đúng: tải đối xứng thì điểm trung tính của tải trùng điện thế với điểm trung tính nguồn nên dây trung tính không có dòng điện. c) Sai: $I_d = \\sqrt{3}\\,I_p$. d) Đúng: đảo thứ tự pha làm đổi chiều từ trường quay của stato."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về máy biến áp và truyền tải điện:", "statements": ["a) Lõi thép máy biến áp được ghép từ nhiều lá thép kỹ thuật điện mỏng, sơn cách điện nhằm giảm tổn hao do dòng điện Foucault.", "b) Nâng cao điện áp truyền tải giúp giảm tổn hao công suất trên đường dây.", "c) Máy biến áp có thể làm việc bình thường với nguồn điện một chiều.", "d) Trạm biến áp hạ áp thường đặt gần khu vực tiêu thụ để giảm tổn hao và sụt áp trên lưới hạ áp."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: các lá thép mỏng cách điện với nhau làm tăng điện trở của đường đi dòng Foucault. b) Đúng: $\\Delta P = P^2R/U^2$. c) Sai: máy biến áp hoạt động dựa trên hiện tượng cảm ứng điện từ với từ thông biến thiên; dòng một chiều không tạo từ thông biến thiên mà chỉ làm nóng cuộn dây. d) Đúng."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Nguồn ba pha nối hình sao có $U_p = 220V$. Một tải ba pha đối xứng nối hình tam giác, điện trở mỗi pha $R = 20\\Omega$. Dòng điện dây của tải xấp xỉ bao nhiêu ampe (làm tròn đến số nguyên)?", "answer": "33", "explain": "$U_d = \\sqrt{3} \\times 220 \\approx 380V$. Tải nối tam giác: $I_p = U_d/R = 380/20 = 19A$. Dòng dây: $I_d = \\sqrt{3}\\,I_p \\approx 32.9A \\approx 33A$."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Đường dây truyền tải có điện trở $5\\Omega$, truyền tải công suất $2MW$ ở điện áp $110kV$ (coi hệ số công suất bằng $1$). Tổn hao công suất trên đường dây xấp xỉ bao nhiêu kilôoát (làm tròn đến 2 chữ số thập phân)?", "answer": "1.65", "explain": "$\\Delta P = P^2R/U^2 = (2 \\times 10^6)^2 \\times 5/(1.1 \\times 10^5)^2 = 2 \\times 10^{13}/1.21 \\times 10^{10} \\approx 1652.9W \\approx 1.65kW$."}]}]}
