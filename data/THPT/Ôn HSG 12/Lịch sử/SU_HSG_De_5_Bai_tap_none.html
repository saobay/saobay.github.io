<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 5", "questions": [{"type": "mcq", "level": "VDC", "q": "Phân tích những nguyên nhân dẫn đến việc Đảng quyết định đổi mới toàn diện đất nước từ Đại hội VI (12/1986). Nhận định nào dưới đây là đầy đủ và đúng đắn nhất?", "options": ["A. Chỉ do tình trạng khủng hoảng kinh tế – xã hội trầm trọng ở trong nước.", "B. Do Liên Xô yêu cầu Việt Nam phải đổi mới theo mô hình cải tổ của họ.", "C. Là tổng hòa nhiều nhân tố: khủng hoảng kinh tế – xã hội trầm trọng trong nước; yêu cầu khách quan của thời đại (xu thế hòa bình, hợp tác, cách mạng khoa học – công nghệ); bài học từ công cuộc cải cách ở một số nước; và sự vận dụng sáng tạo chủ nghĩa Mác – Lê-nin, tư tưởng Hồ Chí Minh vào điều kiện Việt Nam.", "D. Do Mỹ dỡ bỏ cấm vận nên Việt Nam có điều kiện để đổi mới."], "answer": "C", "explain": "Đổi mới là tất yếu khách quan: trong nước, mô hình quản lý tập trung, quan liêu, bao cấp bộc lộ toàn diện sự trì trệ — sản xuất đình đốn, lạm phát phi mã, đời sống nhân dân khó khăn; ngoài nước, xu thế hòa bình, hợp tác phát triển và cách mạng khoa học – công nghệ đòi hỏi phải đổi mới để hội nhập; bài học cải cách ở Trung Quốc (1978) và cải tổ ở Liên Xô cho thấy phải đổi mới nhưng phải giữ vững định hướng xã hội chủ nghĩa. Đảng ta đã vận dụng sáng tạo lý luận Mác – Lê-nin vào thực tiễn Việt Nam, đề ra đường lối đổi mới. A phiến diện (bỏ qua nhân tố thời đại); B, D sai sự thật (đổi mới là quyết định độc lập, tự chủ; Mỹ dỡ cấm vận năm 1994, sau đổi mới).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nội dung cốt lõi của đổi mới kinh tế ở Việt Nam từ năm 1986 là:", "options": ["A. Tư nhân hóa toàn bộ nền kinh tế, từ bỏ vai trò chủ đạo của kinh tế nhà nước.", "B. Chuyển từ cơ chế kế hoạch hóa tập trung, quan liêu, bao cấp sang cơ chế thị trường có sự quản lý của Nhà nước theo định hướng xã hội chủ nghĩa; phát triển nền kinh tế nhiều thành phần với kinh tế nhà nước giữ vai trò chủ đạo.", "C. Chỉ đổi mới trong nông nghiệp (khoán sản phẩm đến nhóm và người lao động), giữ nguyên mô hình cũ trong công nghiệp và dịch vụ.", "D. Mở cửa thu hút đầu tư nước ngoài nhưng đóng cửa thị trường trong nước."], "answer": "B", "explain": "Cốt lõi của đổi mới kinh tế là xóa bỏ cơ chế tập trung, quan liêu, bao cấp; thừa nhận nền kinh tế nhiều thành phần (quốc doanh, tập thể, tư nhân, có vốn đầu tư nước ngoài) cùng tồn tại, trong đó kinh tế nhà nước giữ vai trò chủ đạo; vận hành theo cơ chế thị trường có sự quản lý của Nhà nước theo định hướng xã hội chủ nghĩa. Đây là sự nhận thức lại đúng đắn quy luật kinh tế khách quan trong thời kỳ quá độ. A sai (không tư nhân hóa triệt để, không từ bỏ định hướng XHCN); C sai (đổi mới toàn diện, không chỉ nông nghiệp); D mâu thuẫn về logic.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So sánh công cuộc đổi mới ở Việt Nam (từ 1986) với Chính sách kinh tế mới (NEP) của Lê-nin ở nước Nga Xô viết (1921), điểm tương đồng về tư duy kinh tế là:", "options": ["A. Đều từ bỏ hoàn toàn vai trò lãnh đạo của Đảng Cộng sản đối với kinh tế.", "B. Đều thừa nhận và vận dụng quan hệ hàng hóa – tiền tệ, cơ chế thị trường trong thời kỳ quá độ đi lên chủ nghĩa xã hội, khắc phục tư tưởng nóng vội muốn xóa bỏ ngay kinh tế thị trường khi điều kiện chưa chín muồi.", "C. Đều thực hiện tư nhân hóa triệt để tư liệu sản xuất.", "D. Đều được tiến hành dưới áp lực trực tiếp của các nước tư bản."], "answer": "B", "explain": "Điểm tương đồng sâu sắc về tư duy: cả NEP (1921) và Đổi mới (1986) đều xuất phát từ việc nhận thức lại lý luận: không thể nóng vội xóa bỏ quan hệ hàng hóa – tiền tệ, cơ chế thị trường trong thời kỳ quá độ khi lực lượng sản xuất còn thấp; phải vận dụng các quy luật kinh tế khách quan, cho phép nhiều thành phần kinh tế cùng tồn tại dưới sự lãnh đạo của Đảng và định hướng xã hội chủ nghĩa. NEP thay \"chính sách cộng sản thời chiến\" bằng thuế lương thực, tự do thương mại trong chừng mực; Đổi mới xóa bao cấp, phát triển kinh tế nhiều thành phần. A, C sai (cả hai đều kiên định vai trò lãnh đạo của Đảng và định hướng XHCN); D sai.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phân tích ý nghĩa của việc Việt Nam gia nhập ASEAN (28/7/1995) và Tổ chức Thương mại Thế giới WTO (2006) đối với tiến trình hội nhập quốc tế của đất nước:", "options": ["A. Chỉ có ý nghĩa về kinh tế đơn thuần, không liên quan đến chính trị – đối ngoại.", "B. Đánh dấu bước phá vỡ thế bị bao vây, cấm vận; khẳng định đường lối đối ngoại đa phương hóa, đa dạng hóa; tạo động lực cải cách thể chế kinh tế trong nước theo chuẩn mực quốc tế và mở rộng thị trường.", "C. Khiến Việt Nam phụ thuộc hoàn toàn vào các tổ chức quốc tế này.", "D. Là điều kiện để Việt Nam từ bỏ độc lập, tự chủ trong đường lối đối ngoại."], "answer": "B", "explain": "Sau khi bình thường hóa quan hệ với Mỹ (11/7/1995), việc gia nhập ASEAN (thành viên thứ 7) khẳng định chính sách \"Việt Nam muốn làm bạn với tất cả các nước\", phá vỡ thế bị bao vây, cấm vận kéo dài. Gia nhập WTO (7/11/2006, thành viên thứ 150) là bước hội nhập sâu rộng: mở rộng thị trường xuất khẩu, thu hút đầu tư, đồng thời tạo sức ép cải cách thể chế, hoàn thiện pháp luật kinh tế theo chuẩn mực quốc tế. Đây là sự vận dụng bài học \"kết hợp sức mạnh dân tộc với sức mạnh thời đại\". A thu hẹp ý nghĩa; C, D xuyên tạc bản chất (hội nhập nhưng vẫn giữ độc lập, tự chủ).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cộng đồng ASEAN chính thức được thành lập (31/12/2015) trên cơ sở ba trụ cột: Cộng đồng Chính trị – An ninh, Cộng đồng Kinh tế, Cộng đồng Văn hóa – Xã hội. Khi tham gia Cộng đồng Kinh tế ASEAN (AEC), thách thức lớn nhất đồng thời cũng là động lực lớn nhất đối với Việt Nam là:", "options": ["A. Việt Nam không được hưởng bất kỳ ưu đãi thuế quan nào từ AEC.", "B. Sức cạnh tranh của hàng hóa và doanh nghiệp Việt Nam còn hạn chế khi thuế quan nội khối về 0% và các dòng chảy tự do được mở ra — thách thức này buộc Việt Nam phải cải cách, nâng cao năng lực cạnh tranh để tận dụng thị trường hơn 600 triệu dân.", "C. Việt Nam bị cấm xuất khẩu hàng hóa sang  thủ sự ủng hộ quốc tế). Trong bối cảnh hiện nay, bài học này được vận dụng thành chiến lược bảo vệ Tổ quốc \"từ sớm, từ xa\". A, C tuyệt đối hóa một yếu tố; D trái với đường lối hòa bình, tự vệ của Việt Nam.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về đường lối đổi mới của Đảng (từ 1986):", "statements": ["a) Đại hội đại biểu toàn quốc lần thứ VI của Đảng (12/1986) đã đề ra đường lối đổi mới toàn diện đất nước.", "b) Công cuộc đổi mới ở Việt Nam bắt đầu từ lĩnh vực chính trị, sau đó mới lan sang lĩnh vực kinh tế.", "c) Một nội dung quan trọng của đổi mới kinh tế là xóa bỏ cơ chế quản lý tập trung, quan liêu, bao cấp.", "d) Đổi mới có nghĩa là từ bỏ mục tiêu chủ nghĩa xã hội, chuyển sang đi theo con đường tư bản chủ nghĩa."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: Đại hội VI (12/1986) là mốc mở đầu công cuộc đổi mới toàn diện. b) Sai: đổi mới toàn diện nhưng trọng tâm là đổi mới kinh tế; đổi mới chính trị được tiến hành đi đôi, từng bước, không làm thay đổi bản chất chế độ. c) Đúng: xóa bỏ bao cấp là đột phá quan trọng nhất về cơ chế quản lý kinh tế. d) Sai: đổi mới là để nhận thức đúng hơn và xây dựng thành công chủ nghĩa xã hội; Đảng kiên định mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về Hiệp hội các quốc gia Đông Nam Á (ASEAN):", "statements": ["a) ASEAN được thành lập ngày 8/8/1967 với 5 thành viên sáng lập.", "b) Việt Nam chính thức gia nhập ASEAN ngày 28/7/1995, trở thành thành viên thứ 7 của tổ chức.", "c) Cộng đồng ASEAN được thành lập ngày 31/12/2015 trên cơ sở ba trụ cột.", "d) ASEAN là một tổ chức liên minh quân sự – chính trị khép kín ở khu vực Đông Nam Á."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Tuyên bố Băng-cốc ngày 8/8/1967 với 5 nước: In-đô-nê-xi-a, Ma-lai-xi-a, Phi-líp-pin, Xin-ga-po, Thái Lan. b) Đúng: Việt Nam gia nhập ngày 28/7/1995 tại Hội
