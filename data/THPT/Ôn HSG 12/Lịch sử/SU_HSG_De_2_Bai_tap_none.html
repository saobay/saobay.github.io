<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 2", "questions": [{"type": "mcq", "level": "VDC", "q": "Tư liệu: Đảng nhận định thời cơ Tổng khởi nghĩa tháng 8/1945 là thời cơ \"ngàn năm có một\". Phân tích thời cơ đó bao gồm những yếu tố nào?", "options": ["A. Phát xít Nhật đầu hàng Đồng minh; quân Đồng minh chưa kịp tiến vào Đông Dương; chính quyền tay sai của Nhật hoang mang, tê liệt.", "B. Liên Xô tuyên chiến với Nhật; Mỹ ném bom nguyên tử xuống Nhật; thực dân Pháp quay trở lại xâm lược Đông Dương.", "C. Quân Đồng minh đã tiến vào Hà Nội; quân Nhật ở Đông Dương vẫn còn rất mạnh; Việt Minh đã nắm chính quyền trong cả nước.", "D. Chính phủ Trần Trọng Kim ngả theo cách mạng; vua Bảo Đại tự nguyện thoái vị ngay từ đầu tháng 8/1945."], "answer": "A", "explain": "Thời cơ \"ngàn năm có một\" gồm: khách quan — Nhật tuyên bố đầu hàng Đồng minh (15/8/1945), kẻ thù chính bị suy yếu tột cùng; theo thỏa thuận của Đồng minh, quân Anh và quân Tưởng Giới Thạch sẽ vào Đông Dương giải giáp quân Nhật nhưng chưa kịp tiến vào, tạo khoảng trống quyền lực; chính quyền thân Nhật rệu rã, hoang mang. Chủ quan — Đảng và Việt Minh đã chuẩn bị chu đáo suốt 15 năm, sẵn sàng phát động tổng khởi nghĩa. B là nguyên nhân dẫn đến việc Nhật đầu hàng, không phải yếu tố thời cơ trực tiếp ở Đông Dương; C, D trái với sự thật lịch sử (Bảo Đại thoái vị ngày 30/8 dưới sức ép của khởi nghĩa).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So với các phong trào cách mạng 1930–1931 và 1936–1939, điểm mới nổi bật về lực lượng cách mạng trong Cách mạng tháng Tám 1945 là:", "options": ["A. Lần đầu tiên giai cấp công nhân giữ vai trò lãnh đạo cách mạng.", "B. Lần đầu tiên Đảng tập hợp được mặt trận dân tộc thống nhất rộng rãi (Mặt trận Việt Minh) gắn với việc xây dựng lực lượng vũ trang cách mạng và căn cứ địa, sẵn sàng chuyển sang tổng khởi nghĩa giành chính quyền.", "C. Lần đầu tiên giai cấp nông dân tham gia phong trào cách mạng.", "D. Lần đầu tiên Đảng Cộng sản lãnh đạo phong trào đấu tranh của nhân dân."], "answer": "B", "explain": "Điểm mới quyết định: Hội nghị Trung ương 8 (5/1941) thành lập Mặt trận Việt Minh, tập hợp mọi lực lượng yêu nước không phân biệt giai cấp, đảng phái, tôn giáo; đồng thời Đảng xây dựng lực lượng vũ trang cách mạng (Việt Nam Tuyên truyền Giải phóng quân, 22/12/1944), căn cứ địa Việt Bắc, và đề ra chủ trương chuyển từ khởi nghĩa từng phần tiến lên tổng khởi nghĩa. Chính sự chuẩn bị lực lượng toàn diện này tạo nên sức mạnh áp đảo trong tháng 8/1945. A, C, D đều sai vì giai cấp công nhân, nông dân và sự lãnh đạo của Đảng đã có từ các phong trào trước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ý nghĩa quốc tế to lớn nhất của thắng lợi Cách mạng tháng Tám 1945 là:", "options": ["A. Chứng minh chủ nghĩa tư bản đã hoàn toàn lỗi thời ở châu Á.", "B. Cổ vũ mạnh mẽ phong trào đấu tranh giải phóng dân tộc ở các nước thuộc địa, góp phần làm tan rã hệ thống thuộc địa của chủ nghĩa đế quốc.", "C. Mở đầu thời kỳ quá độ lên chủ nghĩa xã hội trên phạm vi toàn thế giới.", "D. Buộc các nước đế quốc phải xóa bỏ ngay lập tức chế độ thuộc địa."], "answer": "B", "explain": "Việt Nam là một trong những nước thuộc địa, nửa phong kiến đầu tiên ở Đông Nam Á giành được độc lập bằng cuộc khởi nghĩa vũ trang của quần chúng nhân dân dưới sự lãnh đạo của Đảng Cộng sản. Thắng lợi này đã cổ vũ các dân tộc bị áp bức ở Lào, Cam-pu-chia, In-đô-nê-xi-a và nhiều nước Á, Phi, Mỹ La-tinh đứng lên đấu tranh, góp phần quan trọng làm tan rã hệ thống thuộc địa của chủ nghĩa đế quốc sau Chiến tranh thế giới thứ hai. C là ý nghĩa của Cách mạng tháng Mười Nga; A, D tuyệt đối hóa, không đúng với tiến trình lịch sử (hệ thống thuộc địa tan rã dần trong nhiều thập kỷ).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong các nguyên nhân dẫn đến thắng lợi của Cách mạng tháng Tám 1945, nguyên nhân giữ vai trò quyết định nhất là:", "options": ["A. Phát xít Nhật đầu hàng Đồng minh, tạo ra thời cơ khách quan hết sức thuận lợi.", "B. Sự lãnh đạo đúng đắn, sáng suốt của Đảng: giương cao ngọn cờ độc lập dân tộc, xây dựng lực lượng cách mạng chu đáo và nghệ thuật chớp thời cơ \"ngàn năm có một\".", "C. Sự giúp đỡ to lớn, trực tiếp của Liên Xô và các nước Đồng minh.", "D. Kẻ thù của cách mạng lúc đó đã hoàn toàn suy yếu, không còn khả năng chống cự."], "answer": "B", "explain": "Theo quan điểm duy vật lịch sử, nguyên nhân chủ quan giữ vai trò quyết định: suốt 15 năm (1930–1945), Đảng đã lãnh đạo nhân dân qua ba cao trào cách mạng để rèn luyện lực lượng; đề ra đường lối đúng đắn (độc lập dân tộc gắn với chủ nghĩa xã hội); thành lập Việt Minh, xây dựng lực lượng vũ trang, căn cứ địa; và đặc biệt là nghệ thuật nắm bắt, chớp thời cơ, phát động tổng khởi nghĩa đúng lúc. Thời cơ khách quan (A) chỉ phát huy tác dụng khi có sự chuẩn bị chủ quan chu đáo — nếu không, thời cơ sẽ trôi qua. C sai vì không có sự giúp đỡ trực tiếp đáng kể; D sai vì quân Nhật ở Đông Dương vẫn còn nguyên vẹn về tổ chức.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tư liệu (Tuyên ngôn độc lập, 2/9/1945): \"Nước Việt Nam có quyền hưởng tự do và độc lập, và sự thật đã thành một nước tự do độc lập.\" Việc Hồ Chí Minh trích dẫn Tuyên ngôn độc lập của Mỹ (1776) và Tuyên ngôn Nhân quyền và Dân quyền của Pháp (1791) ngay trong mở đầu bản Tuyên ngôn có dụng ý sâu xa nào?", "options": ["A. Chứng tỏ cách mạng Việt Nam chịu ảnh hưởng sâu sắc của tư tưởng tư sản Mỹ và Pháp.", "B. Nhằm tranh thủ sự ủng hộ, công nhận của Mỹ và Pháp đối với nền độc lập của Việt Nam.", "C. Dùng chính những giá trị tiến bộ mà các nước đế quốc từng tuyên bố để tố cáo tội ác của thực dân Pháp, khẳng định tính chính nghĩa và phù hợp với lẽ phải của nền độc lập Việt Nam.", "D. Khẳng định Việt Nam sẽ đi theo con đường tư bản chủ nghĩa của Mỹ và Pháp."], "answer": "C", "explain": "Đây là một đòn chính trị – ngoại giao sắc bén: lấy chính những nguyên lý \"quyền sống, quyền tự do, quyền mưu cầu hạnh phúc\" mà Mỹ, Pháp từng long trọng tuyên bố để vạch trần sự giả dối của thực dân Pháp (\"chúng tuyệt đối không cho nhân dân ta một chút tự do dân chủ nào\"), từ đó khẳng định cuộc đấu tranh giành độc lập của Việt Nam là hoàn toàn chính nghĩa, phù hợp với lẽ phải và lương tri của nhân loại tiến bộ. A, D hiểu sai bản chất (đây là thủ pháp lập luận, không phải sự ngả theo tư tưởng tư sản); B hạ thấp tầm vóc của bản Tuyên ngôn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So sánh Cách mạng tháng Tám 1945 ở Việt Nam với Cách mạng tháng Mười Nga 1917, điểm tương đồng cơ bản nhất là:", "options": ["A. Đều do giai cấp công nhân thông qua chính đảng tiên phong lãnh đạo, giành chính quyền bằng con đường bạo lực cách mạng của quần chúng.", "B. Đều nổ ra khi chiến tranh thế giới đã kết thúc và kẻ thù hoàn toàn suy yếu.", "C. Đều là cuộc cách mạng giải phóng dân tộc khỏi ách thống trị thực dân.", "D. Đều chỉ sử dụng hình thức khởi nghĩa vũ trang ở thành thị."], "answer": "A", "explain": "Điểm tương đồng cơ bản: cả hai đều do giai cấp công nhân lãnh đạo thông qua chính đảng tiên phong (Đảng Bôn-sê-vích Nga, Đảng Cộng sản Đông Dương), đều dùng bạo lực cách mạng của quần chúng để giành chính quyền và đều mở ra bước ngoặt lịch sử cho dân tộc mình. Điểm khác biệt quan trọng: Cách mạng tháng Mười là cách mạng xã hội chủ nghĩa lật đổ chính quyền tư sản; Cách mạng tháng Tám là cách mạng dân tộc dân chủ nhân dân, nhiệm vụ hàng đầu là giải phóng dân tộc khỏi ách thực dân – phong kiến, mở đường quá độ lên CNXH. B sai (Cách mạng tháng Mười nổ ra giữa lúc Chiến tranh thế giới thứ nhất còn đang diễn ra); C chỉ đúng với Việt Nam; D sai (Cách mạng tháng Tám là khởi nghĩa toàn dân cả nông thôn và thành thị).", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về Cách mạng tháng Tám 1945:", "statements": ["a) Hội nghị toàn quốc của Đảng họp tại Tân Trào (14–15/8/1945) đã quyết định phát động Tổng khởi nghĩa giành chính quyền trong cả nước.", "b) Thắng lợi của khởi nghĩa ở Hà Nội (19/8/1945) đã cổ vũ, thúc đẩy phong trào khởi nghĩa giành chính quyền trong cả nước.", "c) Tổng khởi nghĩa tháng Tám nổ ra trong bối cảnh quân Đồng minh đã tiến vào Đông Dương làm nhiệm vụ giải giáp quân Nhật.", "d) Ngày 30/8/1945, vua Bảo Đại tuyên bố thoái vị, chế độ phong kiến ở Việt Nam sụp đổ hoàn toàn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Hội nghị toàn quốc tại Tân Trào (Tuyên Quang) quyết định phát động tổng khởi nghĩa; Ủy ban Khởi nghĩa toàn quốc ra Quân lệnh số 1. b) Đúng: Hà Nội giành chính quyền ngày 19/8, tiếp đó Huế (23/8), Sài Gòn (25/8) và cả nước. c) Sai: một yếu tố của thời cơ chính là quân Đồng minh chưa kịp vào Đông Dương, tạo ra khoảng trống quyền lực. d) Đúng: Bảo Đại thoái vị ngày 30/8/1945 tại Huế, chấm dứt chế độ phong kiến tồn tại hàng nghìn năm.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về ý nghĩa và bài học của Cách mạng tháng Tám 1945:", "statements": ["a) Thắng lợi của Cách mạng tháng Tám đã mở ra bước ngoặt vĩ đại, đưa dân tộc Việt Nam bước vào kỷ nguyên độc lập, tự do.", "b) Nguyên nhân chủ yếu dẫn đến thắng lợi của Cách mạng tháng Tám là điều kiện khách quan quốc tế hết sức thuận lợi.", "c) Bài học về nắm vững ngọn cờ độc lập dân tộc và chủ nghĩa xã hội, về nghệ thuật chớp thời cơ của Cách mạng tháng Tám vẫn còn nguyên giá trị đến ngày nay.", "d) Về tính chất, Cách mạng tháng Tám là một cuộc cách mạng tư sản dân quyền do giai cấp tư sản lãnh đạo."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: đập tan xiềng xích thực dân – phong kiến, lập nên nước Việt Nam Dân chủ Cộng hòa, mở ra kỷ nguyên mới. b) Sai: nguyên nhân quyết định là chủ quan — sự lãnh đạo đúng đắn của Đảng và sức mạnh khối đại đoàn kết toàn dân; thời cơ khách quan chỉ là điều kiện thuận lợi. c) Đúng: đó là những bài học có giá trị bền vững trong sự nghiệp xây dựng và bảo vệ Tổ quốc. d) Sai: Cách mạng tháng Tám mang tính chất cách mạng dân tộc dân chủ nhân dân, do giai cấp công nhân thông qua Đảng Cộng sản lãnh đạo.", "points": 1}, {"type": "short", "level": "VDC", "q": "Chủ tịch Hồ Chí Minh đọc bản Tuyên ngôn độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa tại Quảng trường Ba Đình (Hà Nội) vào ngày, tháng, năm nào? (Ghi theo dạng ngày/tháng/năm)", "answer": "2/9/1945", "explain": "Ngày 2/9/1945, tại Quảng trường Ba Đình, Chủ tịch Hồ Chí Minh đọc bản Tuyên ngôn độc lập, trịnh trọng tuyên bố với thế giới: nước Việt Nam Dân chủ Cộng hòa ra đời. Sự kiện này đánh dấu thắng lợi hoàn toàn của Cách mạng tháng Tám và mở ra kỷ nguyên độc lập, tự do cho dân tộc Việt Nam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hội nghị của Đảng họp tại Tân Trào (Tuyên Quang) trong hai ngày 14–15/8/1945, quyết định phát động Tổng khởi nghĩa giành chính quyền trong cả nước, có tên gọi là gì? (Chỉ ghi tên hội nghị)", "answer": "Hội nghị toàn quốc", "explain": "Hội nghị toàn quốc của Đảng họp tại Tân Trào ngày 14–15/8/1945 đã nhận định thời cơ \"ngàn năm có một\" đã đến và quyết định phát động Tổng khởi nghĩa giành chính quyền trong cả nước. Tiếp đó, Đại hội quốc dân Tân Trào (16/8/1945) tán thành chủ trương này và cử ra Ủy ban Dân tộc Giải phóng Việt Nam do Hồ Chí Minh làm Chủ tịch.", "points": 0.5}]}]}
