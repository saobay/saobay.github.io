<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 4", "questions": [{"type": "mcq", "level": "VDC", "q": "Phân tích quá trình Mỹ thay đổi chiến lược chiến tranh ở miền Nam Việt Nam (\"Chiến tranh đặc biệt\" 1961–1965 → \"Chiến tranh cục bộ\" 1965–1968 → \"Việt Nam hóa chiến tranh\" 1969–1973), nguyên nhân sâu xa của sự thay đổi này là:", "options": ["A. Mỹ muốn lần lượt thử nghiệm các học thuyết quân sự mới trên chiến trường Việt Nam.", "B. Thất bại liên tiếp của từng chiến lược trước sức đấu tranh của nhân dân ta buộc Mỹ phải thay đổi hình thức chiến tranh hòng cứu vãn tình thế.", "C. Chính quyền Sài Gòn chủ động yêu cầu Mỹ thay đổi chiến lược.", "D. Liên Xô gây sức ép ngoại giao buộc Mỹ phải xuống thang chiến tranh."], "answer": "B", "explain": "Mỗi lần thay đổi chiến lược là một lần Mỹ thừa nhận thất bại: \"Chiến tranh đặc biệt\" thất bại trước phong trào Đồng khởi và các chiến thắng (Bình Giã 12/1964, Ba Gia, Đồng Xoài 1965); \"Chiến tranh cục bộ\" thất bại trước Tổng tiến công Mậu Thân 1968, buộc Mỹ \"phi Mỹ hóa\" chiến tranh; \"Việt Nam hóa chiến tranh\" thất bại trước cuộc tiến công chiến lược 1972 và \"Điện Biên Phủ trên không\", buộc Mỹ ký Hiệp định Pa-ri. Quy luật: sức mạnh của chiến tranh nhân dân Việt Nam là nguyên nhân sâu xa buộc kẻ thù phải thay đổi chiến lược. A, C, D đều không phản ánh đúng bản chất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá ý nghĩa chiến lược của cuộc Tổng tiến công và nổi dậy Tết Mậu Thân (1968):", "options": ["A. Đã giành thắng lợi quân sự hoàn toàn, giải phóng miền Nam ngay trong năm 1968.", "B. Là đòn giáng mạnh vào ý chí xâm lược của Mỹ, làm phá sản chiến lược \"Chiến tranh cục bộ\", buộc Mỹ phải xuống thang chiến tranh, chấp nhận đàm phán ở Pa-ri.", "C. Chỉ có ý nghĩa cổ vũ tinh thần, không làm thay đổi cục diện chiến tranh.", "D. Đã buộc Mỹ phải rút hết quân khỏi miền Nam ngay lập tức."], "answer": "B", "explain": "Mậu Thân 1968 là đòn bất ngờ chiến lược: ta đồng loạt tiến công vào hầu khắp các đô thị miền Nam, giáng đòn nặng nề vào quân Mỹ – Sài Gòn, làm rung chuyển nước Mỹ (phong trào phản chiến dâng cao, uy tín chính quyền Giôn-xơn sụp đổ). Hậu quả chiến lược: Mỹ buộc phải tuyên bố ngừng ném bom miền Bắc (31/3/1968), \"phi Mỹ hóa\" chiến tranh, chấp nhận đàm phán với ta ở Pa-ri (5/1968) — tức là làm phá sản \"Chiến tranh cục bộ\". Đây là bước ngoặt quyết định của cuộc kháng chiến. A, D tuyệt đối hóa; C hạ thấp ý nghĩa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tư liệu: Tháng 12/1972, quân dân ta đập tan cuộc tập kích đường không chiến lược bằng máy bay B-52 của Mỹ vào Hà Nội, Hải Phòng — trận \"Điện Biên Phủ trên không\". Phân tích tác động trực tiếp của thắng lợi này:", "options": ["A. Buộc Mỹ phải nối lại đàm phán và ký Hiệp định Pa-ri (27/1/1973) với những điều khoản có lợi cho ta, cam kết rút hết quân về nước.", "B. Giải phóng hoàn toàn miền Nam ngay sau đó.", "C. Buộc Mỹ phải chấm dứt vĩnh viễn mọi hoạt động quân sự ở Đông Dương.", "D. Làm sụp đổ hoàn toàn chính quyền Sài Gòn."], "answer": "A", "explain": "Sau khi \"Việt Nam hóa chiến tranh\" thất bại trước cuộc tiến công chiến lược 1972 của ta, Ních-xơn tung đòn cuối cùng: tập kích B-52 hòng \"đưa miền Bắc về thời kỳ đồ đá\" để ép ta ký hiệp định theo điều kiện của Mỹ. Thất bại thảm hại của B-52 (81 máy bay bị bắn rơi, trong đó có 34 B-52) buộc Mỹ phải nối lại đàm phán và ký Hiệp định Pa-ri ngày 27/1/1973, công nhận các quyền dân tộc cơ bản của Việt Nam và rút hết quân. Đây là thắng lợi có ý nghĩa quyết định, tạo bước ngoặt \"đánh cho Mỹ cút\". B, D là kết quả của năm 1975; C sai (Mỹ vẫn tiếp tục viện trợ cho Sài Gòn chống phá hiệp định).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So sánh Hiệp định Giơ-ne-vơ (1954) về Đông Dương với Hiệp định Pa-ri (1973) về Việt Nam, điểm giống nhau cơ bản về nội dung là:", "options": ["A. Đều quy định hai năm sau sẽ tổng tuyển cử thống nhất đất nước.", "B. Đều buộc các nước đế quốc phải công nhận độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam.", "C. Đều do bốn bên cùng tham gia ký kết.", "D. Đều chấm dứt hoàn toàn chiến tranh ở Việt Nam ngay sau khi ký kết."], "answer": "B", "explain": "Điểm giống cơ bản: cả hai hiệp định đều là thắng lợi của đấu tranh quân sự kết hợp ngoại giao, buộc đối phương công nhận các quyền dân tộc cơ bản của Việt Nam (độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ). Điểm khác: Giơ-ne-vơ quy định tổng tuyển cử sau 2 năm và tạm chia cắt ở vĩ tuyến 17 (A chỉ đúng với Giơ-ne-vơ); Pa-ri do 4 bên ký (Việt Nam Dân chủ Cộng hòa, Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam, Mỹ, Việt Nam Cộng hòa), buộc Mỹ rút quân — điều Giơ-ne-vơ không có (C chỉ đúng với Pa-ri); D sai với cả hai (sau Giơ-ne-vơ Mỹ phá hoại; sau Pa-ri chiến tranh còn tiếp diễn đến 30/4/1975).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phân tích nguyên nhân thắng lợi của cuộc Tổng tiến công và nổi dậy Xuân 1975, yếu tố giữ vai trò quyết định nhất là:", "options": ["A. Đế quốc Mỹ đã cắt hoàn toàn viện trợ cho chính quyền Sài Gòn từ đầu năm 1975.", "B. Sự lãnh đạo đúng đắn, sáng suốt của Đảng: nghệ thuật chớp thời cơ, chọn đúng hướng tiến công chiến lược (Tây Nguyên), kết hợp tiến công quân sự với nổi dậy của quần chúng theo phương châm \"thần tốc, táo bạo, bất ngờ, chắc thắng\".", "C. Quân đội Sài Gòn tự tan rã mà không cần quân ta tiến công.", "D. Sự giúp đỡ trực tiếp về quân sự của Liên Xô và Trung Quốc."], "answer": "B", "explain": "Quyết định nhất là nhân tố chủ quan: Đảng đề ra quyết tâm chiến lược (Hội nghị Bộ Chính trị 12/1974 và bổ sung đầu 1975), đánh giá đúng so sánh lực lượng có lợi cho ta, chọn Tây Nguyên làm hướng tiến công chủ yếu trong chiến dịch mở màn, rồi phát triển thành tổng tiến công trên toàn miền Nam kết hợp với nổi dậy của quần chúng; chỉ đạo \"thần tốc, táo bạo, bất ngờ, chắc thắng\". Nhờ đó, chỉ trong 55 ngày đêm (4/3–30/4/1975), ta giải phóng hoàn toàn miền Nam. A là điều kiện khách quan thuận lợi (Mỹ cắt giảm viện trợ), không phải quyết định; C, D trái thực tế (ta phải trải qua các chiến dịch Tây Nguyên, Huế – Đà Nẵng, Hồ Chí Minh ác liệt).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá tầm vóc lịch sử của thắng lợi 30/4/1975 đối với phong trào giải phóng dân tộc trên thế giới:", "options": ["A. Đánh dấu sự sụp đổ hoàn toàn của chủ nghĩa đế quốc trên phạm vi toàn thế giới.", "B. Cổ vũ mạnh mẽ phong trào đấu tranh vì độc lập, tự do của các dân tộc bị áp bức; chứng minh một dân tộc nhỏ, kinh tế còn lạc hậu có thể đánh thắng đế quốc hùng mạnh nếu có đường lối đúng đắn, sự lãnh đạo sáng suốt và khối đoàn kết toàn dân.", "C. Khiến mọi nước thuộc địa trên thế giới giành được độc lập ngay lập tức.", "D. Chấm dứt mọi cuộc xung đột vũ trang trên thế giới từ đó về sau."], "answer": "B", "explain": "Thắng lợi 30/4/1975 kết thúc 21 năm kháng chiến chống Mỹ, hoàn thành cách mạng dân tộc dân chủ nhân dân, thống nhất đất nước — là thắng lợi của sức mạnh chiến tranh nhân dân Việt Nam thời đại Hồ Chí Minh. Với thế giới, đó là nguồn cổ vũ to lớn cho các dân tộc bị áp bức: chứng minh chân lý \"không có gì quý hơn độc lập, tự do\" và khả năng chiến thắng của chính nghĩa trước bạo lực đế quốc. A, C, D đều tuyệt đối hóa, không đúng với tiến trình lịch sử (chủ nghĩa đế quốc vẫn tồn tại, nhiều dân tộc còn phải tiếp tục đấu tranh).", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về các chiến lược chiến tranh của Mỹ ở miền Nam Việt Nam:", "statements": ["a) Trong \"Chiến tranh đặc biệt\", Mỹ thực hiện các chiến thuật \"trực thăng vận\", \"thiết xa vận\" và dồn dân lập \"ấp chiến lược\".", "b) \"Chiến tranh cục bộ\" là chiến lược mà Mỹ trực tiếp đưa quân viễn chinh và quân các nước đồng minh vào tham chiến ở miền Nam.", "c) Thực chất của \"Việt Nam hóa chiến tranh\" là tăng cường quân Mỹ ở miền Nam để giành một thắng lợi quân sự quyết định.", "d) Cả ba chiến lược chiến tranh trên của Mỹ ở miền Nam đều lần lượt bị thất bại."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đó là những biện pháp đặc trưng của \"Chiến tranh đặc biệt\" (1961–1965) với quân đội Sài Gòn làm nòng cốt. b) Đúng: \"Chiến tranh cục bộ\" (1965–1968) đánh dấu việc Mỹ đưa hơn nửa triệu quân viễn chinh và quân đồng minh trực tiếp tham chiến. c) Sai: thực chất là rút dần quân Mỹ về nước, dùng quân đội Sài Gòn thay thế (\"thay màu da xác chết\"), tăng cường viện trợ và cố vấn. d) Đúng: \"Chiến tranh đặc biệt\" thất bại (1965), \"Chiến tranh cục bộ\" phá sản sau Mậu Thân 1968, \"Việt Nam hóa chiến tranh\" thất bại sau tiến công 1972 và \"Điện Biên Phủ trên không\".", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về Hiệp định Pa-ri (1973):", "statements": ["a) Hiệp định Pa-ri về chấm dứt chiến tranh, lập lại hòa bình ở Việt Nam được ký kết ngày 27/1/1973.", "b) Hiệp định công nhận độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam.", "c) Theo Hiệp định, Mỹ phải rút hết quân đội và cố vấn quân sự khỏi miền Nam; nhân dân miền Nam tự quyết định tương lai chính trị của mình.", "d) Sau khi Hiệp định Pa-ri được ký kết, chiến tranh ở miền Nam đã chấm dứt hoàn toàn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Hiệp định được ký chính thức ngày 27/1/1973 tại Pa-ri giữa 4 bên. b) Đúng: Mỹ cam kết tôn trọng các quyền dân tộc cơ bản của nhân dân Việt Nam. c) Đúng: Mỹ rút hết quân (hoàn thành 29/3/1973); điều khoản về quyền tự quyết của nhân dân miền Nam. d) Sai: Mỹ rút quân nhưng vẫn viện trợ, chỉ đạo chính quyền Sài Gòn phá hoại hiệp định, tiến hành \"tràn ngập lãnh thổ\"; chiến tranh còn tiếp diễn cho đến thắng lợi 30/4/1975. Vì vậy, Pa-ri mới chỉ \"đánh cho Mỹ cút\", còn phải \"đánh cho ngụy nhào\".", "points": 1}, {"type": "short", "level": "VDC", "q": "Hiệp định Pa-ri về chấm dứt chiến tranh, lập lại hòa bình ở Việt Nam được ký kết vào ngày, tháng, năm nào? (Ghi theo dạng ngày/tháng/năm)", "answer": "27/1/1973", "explain": "Ngày 27/1/1973, Hiệp định Pa-ri được ký kết chính thức, chấm dứt cuộc chiến tranh xâm lược của đế quốc Mỹ ở Việt Nam. Thắng lợi này tạo ra bước ngoặt: so sánh lực lượng thay đổi hẳn có lợi cho cách mạng miền Nam, mở ra thời cơ để ta giải phóng hoàn toàn miền Nam, thống nhất đất nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong cuộc Tổng tiến công và nổi dậy Xuân 1975, chiến dịch cuối cùng giải phóng Sài Gòn – Gia Định (26/4–30/4/1975) mang tên vị lãnh tụ nào của dân tộc Việt Nam? (Ghi đầy đủ tên chiến dịch)", "answer": "Chiến dịch Hồ Chí Minh", "explain": "Ngày 14/4/1975, Bộ Chính trị quyết định mở chiến dịch giải phóng Sài Gòn – Gia Định với tên gọi \"Chiến dịch Hồ Chí Minh\". Chiến dịch diễn ra từ 26/4 đến 30/4/1975; trưa 30/4, quân ta tiến vào Dinh Độc Lập, chính quyền Sài Gòn đầu hàng vô điều kiện, miền Nam hoàn toàn giải phóng.", "points": 0.5}]}]}
