<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 3","questions":[{"answer":"Thể thơ lục bát; biện pháp nghệ thuật nổi bật: đối lập (tương phản) và phóng đại.","explain":"Thể thơ: lục bát (câu 6 - câu 8), thể thơ truyền thống của ca dao. Biện pháp nghệ thuật nổi bật: (1) Đối lập / tương phản xuyên suốt cả chùm: “nghèo” — “đỗ trạng”, “còn tiền còn bạc” — “hết cơm hết rượu”, “ở rộng” — “ở hẹp”, “cười người” — “người cười”; (2) Phóng đại: “chín nghìn anh em” — nói quá để mỉa mai. Nghệ thuật đối lập làm nổi bật sự tráo trở của thói đời, giọng điệu vừa chua chát vừa hóm hỉnh — đặc trưng của ca dao trào phúng. Chấp nhận cách diễn đạt tương đương.","level":"VDC","points":0.5,"q":"PHẦN I. ĐỌC HIỂU (4,0 điểm)\nĐọc chùm ca dao sau và trả lời các câu hỏi:\n\nKhi nghèo thì chẳng ai nhìn,\nĐến khi đỗ trạng chín nghìn anh em.\n\nCòn tiền còn bạc còn đệ tử,\nHết cơm hết rượu hết ông tôi.\n\nỞ sao cho vừa lòng người,\nỞ rộng người cười, ở hẹp người chê.\n\nAi ơi chớ vội cười nhau,\nCười người hôm trước, hôm sau người cười.\n\n(Ca dao Việt Nam)\n\nXác định thể thơ và chỉ ra biện pháp nghệ thuật nổi bật được sử dụng trong chùm ca dao trên.","type":"short"},{"answer":"“Chín nghìn anh em” là cách nói phóng đại, mỉa mai thói đời thực dụng: khi nghèo bị khinh rẻ, khi thành đạt thì kẻ xu nịnh vây quanh; vạch trần sự giả dối của những quan hệ vụ lợi.","explain":"Phân tích: “chín nghìn” là số lượng phóng đại phi thực tế — không ai có chín nghìn anh em ruột; đây là lối nói quá để mỉa mai. Ý nghĩa: khi “nghèo” thì “chẳng ai nhìn” (bị khinh rẻ, cô độc), nhưng khi “đỗ trạng” (thành đạt) thì bỗng dưng có “chín nghìn anh em” — những kẻ xu nịnh, vụ lợi bâu quanh. Hình ảnh vạch trần thói đời thực dụng: tình thân, tình người bị đo bằng tiền tài, địa vị; đồng thời gửi gắm nỗi chua chát của người lao động từng nếm trải sự tráo trở ấy. Nghệ thuật phóng đại kết hợp đối lập (“nghèo” — “đỗ trạng”) làm tăng sức tố cáo. Chấp nhận cách diễn đạt tương đương.","level":"VDC","points":1.0,"q":"Phân tích ý nghĩa của hình ảnh “chín nghìn anh em” trong câu ca dao thứ nhất.","type":"short"},{"explain":"GỢI Ý TRẢ LỜI — THANG ĐIỂM (1,0 điểm — giáo viên chấm tay). 1. Nêu hai lớp thái độ (0,25 điểm): bề mặt là than thở (chua chát trước thói đời tráo trở), chiều sâu là phản kháng (vạch trần, mỉa mai, cảnh tỉnh). 2. Chứng minh “không chỉ than thở” (0,5 điểm): giọng điệu mỉa mai, hài hước (“chín nghìn anh em”, “còn đệ tử — hết ông tôi”) là vũ khí của kẻ yếu — cười để khinh bỉ thói đời; hai câu cuối (“Ai ơi chớ vội cười nhau...”) mang tính triết lí, răn đời: gieo nhân nào gặt quả ấy, thể hiện trí tuệ và bản lĩnh đạo đức của nhân dân — người lao động không chỉ là nạn nhân mà còn là quan tòa của thói đời. 3. Đánh giá (0,25 điểm): ca dao là tiếng cười vừa tự trào vừa phản kháng, thể hiện sức sống tinh thần và nhân cách lành mạnh của nhân dân lao động. Bài viết lập luận chặt chẽ, có chính kiến được cộng điểm trình bày.","level":"VDC","points":0,"q":"Đánh giá thái độ của nhân dân lao động qua chùm ca dao trên: chỉ đơn thuần là than thở, hay còn chứa đựng sự phản kháng? Vì sao?","type":"essay"},{"explain":"GỢI Ý TRẢ LỜI — THANG ĐIỂM (1,5 điểm — giáo viên chấm tay). 1. Chỉ ra điểm tương đồng (0,5 điểm): “miệng đời” xưa và “cộng đồng mạng” nay đều có sức mạnh phán xét, đều thích bàn tán chuyện người khác; thói “ở rộng người cười, ở hẹp người chê” vẫn còn — làm gì cũng bị soi xét. 2. Chỉ ra điểm khác biệt (0,5 điểm): miệng đời xưa lan truyền trong làng xã hẹp, còn “miệng đời” mạng lan tức thì, ẩn danh, khó kiểm soát; mức độ tổn thương lớn hơn (bạo lực mạng, “ném đá” tập thể); nhưng mặt khác, mạng xã hội cũng là nơi lên tiếng bảo vệ lẽ phải nhanh hơn. 3. Suy nghĩ, bài học (0,5 điểm): bài học “chớ vội cười nhau” càng có giá trị — cần tỉnh táo trước đám đông, không a dua phán xét; đồng thời mỗi người cần bản lĩnh “ở sao cho vừa lòng mình” trước hết, miễn không trái đạo lí. Đoạn văn có dẫn chứng thực tế sinh động, lập luận sắc sảo được cộng điểm trình bày.","level":"VDC","points":0,"q":"“Miệng đời” trong ca dao xưa và “miệng đời” trên mạng xã hội ngày nay có gì giống và khác nhau? Trình bày suy nghĩ của anh/chị (viết đoạn văn khoảng 150 chữ).","type":"essay"},{"explain":"DÀN Ý CHI TIẾT (6,0 điểm — giáo viên chấm tay). I. Mở bài (0,5 điểm): từ chùm ca dao về thói đời thực dụng dẫn đến vấn đề: giữa một xã hội trọng vật chất, lòng tự trọng là điểm tựa để con người không bị tha hóa. II. Thân bài (4,5 điểm): 1. Giải thích (0,75 điểm): lòng tự trọng là ý thức giữ gìn phẩm giá, không hạ mình vì lợi ích; “thói đời thực dụng” là lối sống đo con người bằng tiền bạc, địa vị (như ca dao đã vạch trần). 2. Biểu hiện của lòng tự trọng (0,75 điểm): nghèo nhưng không hèn — không xu nịnh, không bán rẻ lương tâm; dám từ chối điều sai trái dù thiệt thòi; biết xấu hổ trước việc làm thấp hèn. 3. Vì sao cần lòng tự trọng (0,75 điểm): là “hàng rào” bảo vệ nhân cách trước cám dỗ; người có tự trọng mới được người khác tôn trọng thật sự (khác với sự vây quanh giả dối của “chín nghìn anh em”); là nền tảng của xã hội lành mạnh. 4. Phản đề (0,75 điểm): phê phán tự ái thái quá, sĩ diện hão (tự trọng khác tự ái); cũng phê phán lối sống “thực dụng” đội lốt khôn ngoan. 5. Dẫn chứng (0,75 điểm): những tấm gương (người lao động nghèo từ chối tiền “bẩn”, cán bộ liêm khiết...) và mặt trái (chạy chức, nịnh bợ). 6. Bài học, liên hệ (0,75 điểm): rèn tự trọng từ việc nhỏ — trung thực trong thi cử, không gian lận; dám sống thật giữa áp lực đám đông. III. Kết bài (1,0 điểm): khẳng định — mất tiền có thể kiếm lại, mất tự trọng là mất tất cả. BÀI MẪU (đoạn mẫu): “Ca dao xưa đã nhìn thấu một quy luật chua chát: khi nghèo thì “chẳng ai nhìn”, khi sang thì “chín nghìn anh em”. Quy luật ấy đến nay vẫn còn nguyên giá trị, chỉ khác là “anh em” bây giờ đếm bằng lượt theo dõi, lượt thích. Giữa một thời đại mà giá trị con người dễ bị quy đổi thành con số, lòng tự trọng chính là thứ giúp ta phân biệt được đâu là sự tôn trọng thật và đâu là sự vây quanh giả dối. Người có tự trọng có thể nghèo tiền bạc, nhưng không bao giờ nghèo nhân cách — và đó là sự giàu có mà không thói đời nào lấy cắp được.” THANG ĐIỂM GỢI Ý: bố cục 3 phần (1,0); luận điểm đầy đủ, có phản đề, gắn với ngữ liệu ca dao (2,5); lí lẽ + dẫn chứng thuyết phục (1,5); văn viết mạch lạc, giàu sức thuyết phục (1,0).","level":"VDC","points":0,"q":"PHẦN II. LÀM VĂN (16,0 điểm)\nNghị luận xã hội (6,0 điểm). Anh/Chị hãy viết bài văn nghị luận (khoảng 600 chữ) trình bày suy nghĩ về lòng tự trọng của con người trước thói đời thực dụng.","type":"essay"},{"explain":"DÀN Ý CHI TIẾT (10,0 điểm — giáo viên chấm tay). I. Mở bài (1,0 điểm): giới thiệu ý kiến và tác phẩm “Vợ chồng A Phủ” (Tô Hoài) — truyện ngắn viết về số phận và sức phản kháng của người lao động miền núi trước ách thống trị phong kiến. II. Thân bài (7,0 điểm): 1. Giải thích ý kiến (1,0 điểm): “tiếng nói phản kháng” là sự lên án cái ác, bênh vực con người bị áp bức; “những kiếp người bị đè nén” là người lao động nghèo khổ dưới ách phong kiến, thực dân. 2. Hiện thực đè nén trong tác phẩm (1,5 điểm): Mị — con dâu gạt nợ, “lùi lũi như con rùa nuôi trong xó cửa”, bị biến thành công cụ lao động; A Phủ — bị trói đứng vì đánh mất bò; chế độ phong kiến miền núi tàn bạo. 3. Sức phản kháng qua nhân vật Mị (2,0 điểm): từ tê liệt (“nhẫn nhục”) đến bùng nổ — đêm tình mùa xuân Mị muốn đi chơi (sức sống tiềm tàng); đỉnh điểm: Mị cởi trói cho A Phủ rồi chạy theo A Phủ — hành động phản kháng tự phát nhưng tất yếu, là sự vùng lên của khát vọng sống và lòng nhân ái. 4. Sức phản kháng qua A Phủ và sự đổi đời (1,0 điểm): A Phủ quật ngã con hổ, chống lại lí dịch; cả hai đến Phiềng Sa, trở thành du kích — từ phản kháng tự phát đến giác ngộ cách mạng. 5. Nghệ thuật (0,75 điểm): trần thuật theo dòng hồi tưởng, miêu tả tâm lí tinh tế, ngôn ngữ đậm màu sắc miền núi. 6. Đánh giá, mở rộng (0,75 điểm): ý kiến đúng — giá trị nhân đạo của tác phẩm chính là ở tiếng nói phản kháng; liên hệ: văn học hôm nay vẫn cần tiếp tục “phản kháng” lại cái ác, cái xấu dưới những hình thức mới. III. Kết bài (1,0 điểm): khẳng định giá trị ý kiến và tác phẩm. BÀI MẪU (đoạn mẫu — phân tích hành động cởi trói): “Chi tiết Mị cởi trói cho A Phủ là khoảnh khắc đẹp nhất của truyện — và cũng là khoảnh khắc “phản kháng” trọn vẹn nhất. Hãy nhớ: Mị không cởi trói cho mình. Trong đêm tối, nhìn dòng nước mắt của A Phủ, Mị chợt nhớ mình cũng từng bị trói đứng như thế; lòng thương người đã đánh thức lòng thương mình. Nhát dao cắt dây trói ấy cắt đứt cả sợi dây vô hình đã trói buộc tâm hồn Mị bấy lâu. Tô Hoài đã chứng minh một chân lí giản dị mà sâu sắc: sức phản kháng mạnh mẽ nhất của con người không bắt đầu từ hận thù, mà bắt đầu từ tình thương.” THANG ĐIỂM GỢI Ý: bố cục 3 phần (1,0); giải thích đúng ý kiến (1,0); phân tích hiện thực đè nén (1,5); phân tích sức phản kháng qua Mị sâu sắc (3,0); qua A Phủ (1,0); nghệ thuật + mở rộng (1,5); văn viết giàu cảm xúc, chính kiến (1,0).","level":"VDC","points":0,"q":"Nghị luận văn học (10,0 điểm). Có ý kiến cho rằng: “Văn học là tiếng nói phản kháng của những kiếp người bị đè nén.” Anh/Chị hãy bình luận ý kiến trên qua truyện ngắn “Vợ chồng A Phủ” (Tô Hoài).","type":"essay"}]}]}
