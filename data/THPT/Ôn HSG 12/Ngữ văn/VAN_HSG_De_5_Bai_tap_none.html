<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 5","questions":[{"answer":"Các mùi: rơm rạ cháy, khói bếp, bùn non sau mưa, mồ hôi mặn trên vai cha, trầu cay trên môi bà; được sắp xếp theo dòng hồi tưởng từ cảnh vật thiên nhiên đến con người, từ ngoài đồng vào trong mái nhà.","explain":"Liệt kê: (1) mùi rơm rạ cháy âm ỉ chiều đông; (2) mùi khói bếp cay xè mắt mẹ; (3) mùi bùn non ngai ngái sau cơn mưa đầu mùa; (4) mùi mồ hôi mặn chát trên vai cha ngày gặt; (5) mùi trầu cay nồng trên môi bà. Trình tự sắp xếp: theo dòng hồi tưởng lan tỏa — từ ngoài đồng (rơm rạ, bùn non) vào trong nhà (khói bếp, mồ hôi cha, trầu bà), từ cảnh vật thiên nhiên đến hình bóng con người; mỗi mùi gắn với một mảnh ký ức cụ thể, ghép lại thành “bức tranh quê”. Chấp nhận cách diễn đạt tương đương.","level":"VDC","points":0.5,"q":"PHẦN I. ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi:\n\nMÙI CỦA QUÊ\n\nNgười ta có thể quên nhiều thứ khi xa quê: quên đường làng ngoằn ngoèo, quên tên những đứa bạn thuở chăn trâu, thậm chí quên cả giọng nói của chính mình ngày xưa. Nhưng có một thứ không bao giờ quên được: mùi của quê.\n\nMùi của quê không nằm trong từ điển. Nó là mùi rơm rạ cháy âm ỉ chiều đông, lẫn trong mùi khói bếp cay xè mắt mẹ. Là mùi bùn non ngai ngái sau cơn mưa đầu mùa, khi lũ trẻ chúng tôi ùa ra đồng bắt cá rô rạch nước. Là mùi mồ hôi mặn chát trên vai cha những ngày gặt, mùi trầu cay nồng trên môi bà mỗi buổi têm trầu chiều. Mỗi mùi là một mảnh ký ức, ghép lại thành bức tranh quê không bao giờ phai.\n\nLạ lùng thay, quê hương thường chỉ hiện hình rõ nhất khi ta đã rời xa nó. Ở thành phố, giữa những con đường nhựa bóng loáng không một hạt bụi quê, người ta bỗng thèm đến quặn lòng một mùi rơm, một làn khói. Hóa ra, quê hương không phải là nơi ta ở, mà là nơi ta nhớ; không phải là tọa độ địa lí, mà là tọa độ của tâm hồn.\n\nCó người bảo thời nay quê đã khác: đường bê tông thay đường đất, nhà cao tầng thay mái rạ. Đúng, quê có thể đổi thay hình hài. Nhưng chỉ cần một chiều nào đó, bất chợt ngửi thấy mùi khói rơm từ một góc phố thị, lòng ta vẫn se lại — và ta biết, quê vẫn còn đó, nguyên vẹn, trong ngăn kéo ký ức mà thời gian không bao giờ khóa được.\n\n(Người biên soạn)\n\nLiệt kê các “mùi của quê” được nhắc đến trong văn bản và cho biết chúng được sắp xếp theo trình tự nào.","type":"short"},{"answer":"Câu văn định nghĩa lại quê hương bằng cảm xúc và ký ức thay vì địa lí; khẳng định quê hương là giá trị tinh thần, càng xa càng thấm thía.","explain":"Phân tích: (1) Cấu trúc đối lập song hành (“không phải... mà là...” lặp hai lần) tạo nhịp văn cân xứng, cô đúc — một định nghĩa mang tính triết lí. (2) Ý nghĩa: phủ định cách hiểu quê hương thuần túy vật chất (nơi ở, tọa độ địa lí), khẳng định quê hương là giá trị tinh thần (nơi nhớ, tọa độ tâm hồn); diễn tả quy luật tâm lí — càng xa quê, nỗi nhớ càng mãnh liệt, quê càng hiện hình rõ nét (“chỉ hiện hình rõ nhất khi ta đã rời xa”). (3) Câu văn có thể xem là “câu chủ đề” của toàn bài, kết tinh tư tưởng. Chấp nhận cách diễn đạt tương đương.","level":"VDC","points":1.0,"q":"Phân tích ý nghĩa của câu văn: “Quê hương không phải là nơi ta ở, mà là nơi ta nhớ; không phải là tọa độ địa lí, mà là tọa độ của tâm hồn.”","type":"short"},{"explain":"GỢI Ý TRẢ LỜI — THANG ĐIỂM (1,0 điểm — giáo viên chấm tay). 1. Nhận diện nghệ thuật (0,25 điểm): tác giả chọn khứu giác — giác quan thường bị văn chương bỏ quên — làm “chìa khóa” mở ký ức, thay vì thị giác quen thuộc. 2. Tác dụng (0,5 điểm): mùi gợi nhớ mạnh mẽ và trực tiếp hơn hình ảnh — một mùi hương có thể đánh thức cả một thời ấu thơ (hiệu ứng Proust); các tính từ giàu sức gợi (“âm ỉ”, “cay xè”, “ngai ngái”, “mặn chát”, “cay nồng”) khiến mùi như có hình, có vị; mùi gắn với con người cụ thể (mẹ, cha, bà) nên ký ức mang hơi ấm tình thân, không trừu tượng. 3. Đánh giá (0,25 điểm): đây là nét độc đáo, tinh tế của văn bản — viết về quê bằng mũi thay vì bằng mắt, tạo lối đi riêng, tránh sáo mòn. Bài viết có dẫn chứng cụ thể, cảm nhận tinh tế được cộng điểm trình bày.","level":"VDC","points":0,"q":"Nhận xét về nghệ thuật sử dụng giác quan (khứu giác) của tác giả trong văn bản.","type":"essay"},{"explain":"GỢI Ý TRẢ LỜI — THANG ĐIỂM (1,5 điểm — giáo viên chấm tay). 1. Thừa nhận tính tất yếu của đổi thay (0,5 điểm): đô thị hóa mang lại đường sá, trường học, đời sống khá hơn — đó là điều đáng mừng; “quê đổi thay hình hài” là quy luật phát triển, không nên hoài cổ cực đoan, phủ nhận tiến bộ. 2. Nỗi lo đánh mất (0,5 điểm): đổi thay vật chất dễ kéo theo phai nhạt giá trị tinh thần — tình làng nghĩa xóm, phong tục, ký ức tuổi thơ; nhiều người trẻ “mất quê” ngay khi còn ở quê vì không còn gắn bó. 3. Quan điểm, giải pháp (0,5 điểm): cần phát triển hài hòa — giữ “hồn quê” trong “xác quê” mới (bảo tồn di tích, lễ hội, nếp nhà); mỗi người trẻ có thể giữ quê bằng cách nhớ về, viết về, trở về; như văn bản gợi ý — quê mất đi ở bên ngoài nhưng còn nguyên trong ký ức nếu ta biết gìn giữ. Đoạn văn khoảng 150 chữ, có chính kiến cân bằng (không cực đoan), lập luận thuyết phục được cộng điểm trình bày.","level":"VDC","points":0,"q":"“Quê có thể đổi thay hình hài” — anh/chị nghĩ gì về sự đổi thay của quê hương trong quá trình đô thị hóa hiện nay? (Viết đoạn văn khoảng 150 chữ.)","type":"essay"},{"explain":"DÀN Ý CHI TIẾT (6,0 điểm — giáo viên chấm tay). I. Mở bài (0,5 điểm): từ hình ảnh “mùi của quê” trong văn bản đọc hiểu dẫn đến vấn đề: với người trẻ hôm nay — nhiều người sinh ra ở phố, lớn lên xa quê — quê hương có còn ý nghĩa gì? II. Thân bài (4,5 điểm): 1. Giải thích (0,75 điểm): quê hương với người trẻ không chỉ là nơi chôn nhau cắt rốn mà còn là cội nguồn văn hóa, là “tọa độ của tâm hồn” (ý văn bản); có người trẻ “có quê mà như không” vì xa cách. 2. Biểu hiện (0,75 điểm): mặt tích cực — nhiều bạn trẻ tìm về quê, làm du lịch cộng đồng, khởi nghiệp ở quê, lan tỏa văn hóa quê trên mạng; mặt đáng lo — một bộ phận thờ ơ, xem quê là “lạc hậu”, chỉ nhớ quê khi lễ Tết. 3. Vì sao người trẻ cần quê hương (0,75 điểm): quê là điểm tựa tinh thần giữa đời sống xô bồ; là căn cước văn hóa — “cây có cội, nước có nguồn”; người không nhớ quê dễ mất phương hướng, hòa tan. 4. Phản đề (0,75 điểm): yêu quê không có nghĩa là phải bám lấy quê, từ chối đi xa — đi để trở về, như chim di trú; quê hương trong thời đại số cũng có thể được giữ bằng ký ức số, bằng sáng tạo. 5. Dẫn chứng (0,75 điểm): những người trẻ bỏ phố về quê khởi nghiệp; kiều bào hướng về quê hương; phong trào “về quê ăn Tết” đầy cảm xúc mỗi năm. 6. Bài học, liên hệ (0,75 điểm): giữ quê từ việc nhỏ — gọi điện về nhà, học một câu hò quê, kể cho bạn bè nghe về quê mình; đừng để quê chỉ còn trong “ngăn kéo ký ức”. III. Kết bài (1,0 điểm): khẳng định — dù đi đâu, hãy mang quê theo trong tim; thông điệp. BÀI MẪU (đoạn mẫu): “Có một nghịch lí đáng suy ngẫm: càng hiện đại, người ta càng thèm quê. Những video về làng quê Việt Nam thu hàng triệu lượt xem; những người trẻ thành đạt bỗng rủ nhau bỏ phố về quê trồng rau, nuôi cá. Hóa ra, quê hương không hề “lạc hậu” như định kiến — nó chỉ đang chờ người trẻ nhìn nó bằng con mắt mới: không phải là nơi để trốn chạy, mà là nơi để trở về; không phải là quá khứ cần vượt qua, mà là cội nguồn để vươn xa. Người trẻ yêu quê hôm nay không nhất thiết phải ở lại quê — chỉ cần đừng để quê ở lại phía sau lưng mình.” THANG ĐIỂM GỢI Ý: bố cục 3 phần (1,0); luận điểm đầy đủ, có phản đề, gắn với văn bản đọc hiểu (2,5); lí lẽ + dẫn chứng thời sự (1,5); văn viết giàu cảm xúc, có giọng riêng (1,0).","level":"VDC","points":0,"q":"PHẦN II. LÀM VĂN (16,0 điểm)\nNghị luận xã hội (6,0 điểm). Anh/Chị hãy viết bài văn nghị luận (khoảng 600 chữ) trình bày suy nghĩ về quê hương trong tâm hồn người trẻ hôm nay.","type":"essay"},{"explain":"DÀN Ý CHI TIẾT (10,0 điểm — giáo viên chấm tay). I. Mở bài (1,0 điểm): giới thiệu tư tưởng “Đất Nước của Nhân dân” và đoạn trích “Đất Nước” (trường ca “Mặt đường khát vọng” — Nguyễn Khoa Điềm, chương trình Ngữ văn 12). II. Thân bài (7,0 điểm): 1. Giải thích tư tưởng (1,0 điểm): Đất Nước không phải của riêng vua chúa, anh hùng mà là của nhân dân — những con người bình dị, vô danh đã làm nên và giữ gìn đất nước bằng lao động, đấu tranh và văn hóa. 2. Đất Nước của nhân dân trong lao động và đấu tranh (2,0 điểm): “Những người vợ nhớ chồng còn góp cho Đất Nước những núi Vọng Phu”, “những người dân nào đã góp tên...” — nhân dân ở khắp nơi, làm nên mọi miền đất nước; “Đất Nước là máu xương của mình...” — lời nhắn nhủ thế hệ trẻ. 3. Đất Nước của nhân dân trong văn hóa, tâm hồn (1,5 điểm): “Họ giữ và truyền cho ta hạt lúa ta trồng...” — văn hóa dân gian (truyện cổ tích, ca dao) là linh hồn đất nước do nhân dân sáng tạo và lưu giữ. 4. Nghệ thuật thể hiện tư tưởng (1,0 điểm): giọng thơ trữ tình chính luận, chất liệu văn hóa dân gian, cấu trúc “Đất Nước có từ...” — vừa giản dị vừa triết lí. 5. Đánh giá, mở rộng (1,5 điểm): tư tưởng có ý nghĩa thời đại — trong kháng chiến chống Mỹ, nó khơi dậy niềm tự hào và trách nhiệm; hôm nay, nó nhắc người trẻ: yêu nước là gắn bó, san sẻ, giữ gìn văn hóa dân tộc; liên hệ trách nhiệm bản thân. III. Kết bài (1,0 điểm): khẳng định giá trị tư tưởng và sức sống của đoạn trích. BÀI MẪU (đoạn mẫu): “Điều làm nên sức lay động của “Đất Nước” không phải là những hình ảnh hoành tráng, mà chính là sự bình dị. Nguyễn Khoa Điềm không nói về đất nước bằng ngôn ngữ của sử sách — ông nói bằng hạt lúa, bằng núi Vọng Phu, bằng giọng điệu của những câu ca dao mẹ ru. Và qua đó, ông trả đất nước về đúng chủ nhân của nó: nhân dân. Tư tưởng ấy, trong những năm tháng kháng chiến, đã biến mỗi người dân bình thường thành một chiến sĩ; còn hôm nay, nó thì thầm với mỗi người trẻ một điều giản dị: đất nước không ở đâu xa — đất nước là máu xương của chính mình, và yêu nước bắt đầu từ việc biết “gắn bó và san sẻ”.” THANG ĐIỂM GỢI Ý: bố cục 3 phần (1,0); giải thích đúng tư tưởng (1,0); phân tích nội dung sâu, có dẫn chứng (3,5); phân tích nghệ thuật (1,0); đánh giá, mở rộng, liên hệ (1,5); văn viết giàu cảm xúc, chính kiến (2,0).","level":"VDC","points":0,"q":"Nghị luận văn học (10,0 điểm). Bình luận tư tưởng “Đất Nước của Nhân dân” được thể hiện trong đoạn trích “Đất Nước” (trích trường ca “Mặt đường khát vọng” — Nguyễn Khoa Điềm).","type":"essay"}]}]}
