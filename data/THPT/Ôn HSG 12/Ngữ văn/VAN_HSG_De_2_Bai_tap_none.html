<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 2","questions":[{"answer":"Thơ haiku (Nhật Bản); đặc điểm hình thức nổi bật: cực ngắn, chỉ 17 âm tiết ngắt thành 3 dòng 5-7-5, ngôn ngữ hàm súc.","explain":"Ba văn bản đều thuộc thể thơ haiku của Nhật Bản (Matsuo Basho, 1644-1694). Đặc điểm hình thức nổi bật nhất: sự ngắn gọn đến cực đoan — nguyên tác chỉ 17 âm tiết, ngắt thành 3 dòng theo nhịp 5-7-5; không tựa đề, không vần điệu cầu kỳ, ngôn ngữ tối giản, hàm súc. Chính sự tối giản ấy buộc người đọc phải dùng trí tưởng tượng và chiêm nghiệm để lấp đầy “khoảng trống” của bài thơ. Chấp nhận cách diễn đạt tương đương.","level":"VDC","points":0.5,"q":"PHẦN I. ĐỌC HIỂU (4,0 điểm)\nĐọc các văn bản sau và trả lời các câu hỏi:\n\n(1)\nAo xưa lặng lẽ\nmột chú ếch nhảy ùm\nvang tiếng nước\n\n(2)\nCành khô trơ trọi\ncánh quạ sà xuống đậu\nchiều thu tàn\n\n(3)\nỐm đau giữa đường xa\ngiấc mộng vẫn rong ruổi\ntrên đồng cỏ khô\n\n(Matsuo Basho, 1644-1694 — bản dịch của người biên soạn từ nguyên tác tiếng Nhật)\n\nXác định thể thơ của ba văn bản trên và nêu đặc điểm hình thức nổi bật nhất của thể thơ đó.","type":"short"},{"answer":"Khoảng lặng sau “tiếng nước” mở ra không gian suy tưởng: vẻ đẹp nảy sinh từ sự giao hòa giữa động và tĩnh, giữa hữu hạn và vô hạn.","explain":"Phân tích: bài thơ dựng nên hai lớp không gian đối lập — “ao xưa lặng lẽ” (tĩnh tuyệt đối, thời gian ngưng đọng) và “ếch nhảy ùm / vang tiếng nước” (động, khoảnh khắc). Điều nhà thơ KHÔNG nói mới là quan trọng: sau tiếng nước, ao lại trở về lặng lẽ; cái “vang” chỉ có ý nghĩa khi đặt trong cái “lặng”. Khoảng lặng ấy mời gọi người đọc chiêm nghiệm triết lí Thiền: cái đẹp và sự giác ngộ nảy sinh từ sự giao hòa giữa động và tĩnh, giữa cái hữu hạn (một tiếng nước) và cái vô hạn (sự lặng lẽ của ao xưa, của vũ trụ). Đây chính là nghệ thuật “vẽ bằng khoảng trống” của haiku. Chấp nhận cách diễn đạt tương đương.","level":"VDC","points":1.0,"q":"Phân tích vai trò của “khoảng lặng” — những điều nhà thơ không nói ra — trong bài thơ (1).","type":"short"},{"explain":"GỢI Ý TRẢ LỜI — THANG ĐIỂM (1,0 điểm — giáo viên chấm tay). 1. Hoàn cảnh ra đời (0,25 điểm): đây là bài thơ tuyệt mệnh của Basho, viết khi ông lâm bệnh nặng trên đường du hành; “đồng cỏ khô” (kareno) vừa là cảnh thực vừa là ẩn dụ cho cõi chết. 2. Cái nhìn triết lí (0,5 điểm): trước cái chết, con người thường bi lụy, nhưng Basho chỉ ghi lại một hình ảnh giản dị — giấc mộng của kẻ ốm vẫn “rong ruổi” trên đồng cỏ khô; đó là thái độ ung dung, chấp nhận quy luật vô thường của Thiền tông: sống chết chỉ là cuộc du hành, thân xác có thể gục ngã nhưng tinh thần vẫn tự do phiêu diêu; nỗi buồn man mác mà không bi thảm. 3. Đánh giá (0,25 điểm): vẻ đẹp của sự tiết chế — nói ít về cái chết nhưng khiến người đọc thấm thía hơn mọi lời than khóc; phong cách wabi-sabi: tìm cái đẹp trong tàn phai. Bài viết có giọng văn riêng, dẫn dắt mạch lạc được cộng điểm trình bày.","level":"VDC","points":0,"q":"Nhận xét về cái nhìn triết lí của Basho qua bài thơ (3) — bài thơ tuyệt mệnh của ông.","type":"essay"},{"explain":"GỢI Ý TRẢ LỜI — THANG ĐIỂM (1,5 điểm — giáo viên chấm tay). 1. Nêu mối quan hệ trong haiku (0,5 điểm): con người không đứng ngoài, không chinh phục thiên nhiên mà hòa nhập, lắng nghe thiên nhiên — con ếch, cánh quạ, đồng cỏ đều là “người thầy” của thi sĩ; thiên nhiên là nơi con người soi thấy chính mình. 2. Đối chiếu với hiện tại (0,5 điểm): đời sống đô thị, công nghiệp khiến con người xa rời thiên nhiên — thiên nhiên bị xem là tài nguyên để khai thác, là phông nền để “check-in”; hệ quả: ô nhiễm, biến đổi khí hậu và cả sự khô cằn trong tâm hồn. 3. Suy nghĩ, đề xuất (0,5 điểm): cần học lại cách “lắng nghe” thiên nhiên như Basho — sống chậm, quan sát tinh tế, ứng xử khiêm nhường; bảo vệ môi trường bắt đầu từ việc thay đổi cái nhìn: thiên nhiên không phải đối tượng chinh phục mà là người bạn đồng hành. Đoạn văn mạch lạc, có dẫn chứng thực tế và giọng văn riêng được cộng điểm trình bày.","level":"VDC","points":0,"q":"Từ chùm thơ haiku trên, anh/chị suy nghĩ gì về mối quan hệ giữa con người và thiên nhiên trong đời sống hiện đại? (Viết đoạn văn khoảng 150 chữ.)","type":"essay"},{"explain":"DÀN Ý CHI TIẾT (6,0 điểm — giáo viên chấm tay). I. Mở bài (0,5 điểm): từ chùm haiku — vẻ đẹp của khoảng lặng trong thơ — dẫn đến vấn đề: đời sống hiện đại ồn ào đang đánh cắp của con người những khoảng lặng cần thiết. II. Thân bài (4,5 điểm): 1. Giải thích (0,75 điểm): “khoảng lặng” là những phút giây tĩnh tại, không bị lấp đầy bởi âm thanh, thông tin, công việc — để tâm hồn được nghỉ ngơi và tự đối thoại. 2. Biểu hiện của sự ồn ào (0,75 điểm): tai nghe không rời, thông báo điện thoại liên tục, lịch trình kín mít, sợ “nhàm chán”. 3. Nguyên nhân (0,75 điểm): công nghệ và kinh tế chú ý (attention economy) chiếm đoạt sự tập trung; quan niệm sai lầm rằng bận rộn mới là có giá trị. 4. Hậu quả của việc thiếu khoảng lặng (0,75 điểm): căng thẳng, mất khả năng tập trung sâu, suy giảm sáng tạo và sự thấu cảm; con người “nghe” rất nhiều mà “lắng nghe” rất ít. 5. Phản đề (0,75 điểm): ồn ào, sôi động cũng là sức sống; vấn đề là mất cân bằng — khoảng lặng không phải là trốn tránh đời. 6. Bài học, liên hệ (0,75 điểm): chủ động tạo khoảng lặng mỗi ngày (đi bộ không tai nghe, tắt thông báo một giờ, ngồi yên quan sát); như khoảng lặng làm nên bài haiku, khoảng lặng làm nên chiều sâu tâm hồn. III. Kết bài (1,0 điểm): khẳng định giá trị của khoảng lặng, thông điệp. BÀI MẪU (đoạn mẫu): “Thử tưởng tượng bài haiku của Basho nếu được “lấp đầy”: ao xưa lặng lẽ, ếch nhảy ùm, nước vang, rồi ếch bơi đi đâu, trời có mây không, thi sĩ nghĩ gì... — bài thơ sẽ chết ngay lập tức. Sức sống của nó nằm ở những gì không được nói. Đời người cũng vậy. Một tâm hồn bị lấp đầy kín mít bởi tin tức, deadline và tiếng ồn sẽ không còn chỗ cho suy tư nảy mầm. Khoảng lặng không phải là sự trống rỗng đáng sợ; đó là mặt ao phẳng lặng để ta soi thấy chính mình — điều mà không một màn hình nào làm được.” THANG ĐIỂM GỢI Ý: bố cục 3 phần (1,0); luận điểm đầy đủ, có phản đề (2,5); lí lẽ + dẫn chứng thuyết phục, gắn với ngữ liệu haiku (1,5); văn viết mạch lạc, giàu hình ảnh (1,0).","level":"VDC","points":0,"q":"PHẦN II. LÀM VĂN (16,0 điểm)\nNghị luận xã hội (6,0 điểm). Anh/Chị hãy viết bài văn nghị luận (khoảng 600 chữ) trình bày suy nghĩ về giá trị của “khoảng lặng” trong đời sống ồn ào hôm nay.","type":"essay"},{"explain":"DÀN Ý CHI TIẾT (10,0 điểm — giáo viên chấm tay). I. Mở bài (1,0 điểm): giới thiệu ý kiến và bài thơ lựa chọn (gợi ý: “Sóng” — Xuân Quỳnh hoặc “Tây Tiến” — Quang Dũng, chương trình Ngữ văn 12). II. Thân bài (7,0 điểm): 1. Giải thích ý kiến (1,0 điểm): “những điều nhà thơ nói ra” là ngôn từ, hình ảnh cụ thể; “những điều để lại trong im lặng” là tầng nghĩa hàm ẩn, cảm xúc và suy tưởng mà ngôn từ gợi ra nhưng không gọi tên; thơ hay là thơ gợi được nhiều hơn nói. 2. Chứng minh qua bài thơ (3,0 điểm): phân tích 2-3 chi tiết tiêu biểu — ví dụ với “Sóng”: hình tượng sóng — nhà thơ không định nghĩa tình yêu mà để sóng “nói hộ” những trạng thái yêu (dữ dội, dịu êm, khát khao); những câu hỏi tu từ (“Sóng bắt đầu từ gió / Gió bắt đầu từ đâu?”) bỏ ngỏ, mời người đọc tự trả lời; cái “im lặng” sau mỗi khổ thơ là chỗ cho cảm xúc người đọc trú ngụ. 3. Nghệ thuật tạo nên “khoảng lặng” (1,5 điểm): ngôn ngữ hàm súc, hình ảnh đa nghĩa, kết cấu bỏ ngỏ, nhịp điệu. 4. Đánh giá, mở rộng (1,5 điểm): ý kiến đúng với bản chất của thơ trữ tình; phân biệt “im lặng có ý nghĩa” với “mơ hồ, tối nghĩa”; liên hệ vai trò của người đọc — đọc thơ là đồng sáng tạo. III. Kết bài (1,0 điểm): khẳng định lại giá trị ý kiến và sức sống của bài thơ. BÀI MẪU (mở bài mẫu): “Đọc một bài thơ hay, ta thường có cảm giác lạ lùng: những gì đọng lại sâu nhất lại không phải là câu chữ, mà là dư âm của chúng — như tiếng chuông ngân lâu sau khi dùi đã ngừng gõ. “Sóng” của Xuân Quỳnh là một bài thơ như thế: nhà thơ nói về sóng, về gió, về biển, nhưng điều bà thực sự muốn nói — nỗi khát khao yêu thương vô bờ của người phụ nữ — lại nằm ở những khoảng im lặng giữa các dòng thơ, chờ mỗi người đọc tự mình lấp đầy.” THANG ĐIỂM GỢI Ý: bố cục 3 phần (1,0); giải thích đúng ý kiến (1,0); phân tích chi tiết thơ gắn với “khoảng lặng” (3,0); đánh giá nghệ thuật (1,5); mở rộng, liên hệ vai trò người đọc (1,5); văn viết có cảm xúc, chính kiến riêng (2,0).","level":"VDC","points":0,"q":"Nghị luận văn học (10,0 điểm). Có ý kiến cho rằng: “Bài thơ hay không nằm ở những điều nhà thơ nói ra, mà ở những điều nhà thơ để lại trong im lặng.” Anh/Chị hãy bình luận ý kiến trên qua việc phân tích một bài thơ đã học trong chương trình Ngữ văn 12 (gợi ý: “Sóng” — Xuân Quỳnh, “Tây Tiến” — Quang Dũng).","type":"essay"}]}]}
