<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 4","questions":[{"answer":"Phương thức biểu đạt chính là nghị luận; thao tác lập luận chủ yếu là phân tích, bình luận (có kết hợp so sánh và bác bỏ).","explain":"Phương thức biểu đạt chính: nghị luận — văn bản bàn về một vấn đề đời sống (sự tiện lợi của công nghệ), đưa ra luận điểm, lí lẽ, dẫn chứng để thuyết phục người đọc. Thao tác lập luận chủ yếu: phân tích, bình luận (mổ xẻ hai mặt của sự tiện lợi); có kết hợp so sánh (tiện lợi — mất mát: “cho ta thời gian” nhưng “lấy đi khoảnh khắc”) và bác bỏ (bác bỏ quan niệm “càng tiện lợi càng tốt”, bác bỏ ý định “quay lại thời đèn dầu”). Chấp nhận cách diễn đạt tương đương.","level":"VDC","points":0.5,"q":"PHẦN I. ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi:\n\nNGHỊCH LÝ CỦA SỰ TIỆN LỢI\n\nChưa bao giờ con người sống tiện lợi như hôm nay. Một cú chạm để gọi món, một cái lướt để mua sắm, một câu lệnh để trí tuệ nhân tạo viết hộ bài văn, vẽ hộ bức tranh. Mọi khoảng chờ đợi — thứ từng là “gia vị” của đời sống — đang bị xóa sổ khỏi lịch trình của chúng ta.\n\nNhưng tiện lợi đến mức nào thì đủ? Khi chiếc máy giặt thay ta vò từng chiếc áo, ta tiết kiệm được một giờ nhưng cũng mất đi một giờ thảnh thơi ngắm bọt xà phòng vỡ tan dưới nắng. Khi ứng dụng giao đồ ăn trong mười lăm phút, ta quên mất mùi thơm của nồi canh mẹ nấu sôi sùng sục suốt buổi chiều. Tiện lợi cho ta thời gian, nhưng lại lấy đi của ta những khoảnh khắc — mà đời người, suy cho cùng, chẳng phải được dệt nên từ những khoảnh khắc đó sao?\n\nNguy hiểm hơn, sự tiện lợi đang âm thầm bào mòn năng lực của chính chúng ta. Càng quen nhờ máy móc nhớ hộ, trí nhớ càng lười biếng; càng quen để thuật toán chọn hộ bài hát, bộ phim, gu thẩm mỹ càng trở nên nghèo nàn và giống nhau. Chúng ta tưởng mình đang điều khiển công nghệ, nhưng có khi chính công nghệ đang điều khiển lại chúng ta — bằng sự thoải mái.\n\nDĩ nhiên, không ai muốn quay lại thời kỳ đèn dầu. Vấn đề không phải là từ bỏ tiện lợi, mà là đừng để tiện lợi từ bỏ ta. Hãy giữ lại cho mình vài “sự bất tiện” có chủ ý: tự nấu một bữa cơm, viết một lá thư tay, đi bộ một quãng đường không cần vội. Bởi con người chỉ thực sự là con người khi còn biết chờ đợi, còn biết làm những việc “vô ích” mà máy móc không thể thay thế: yêu thương, chiêm nghiệm, và sống chậm lại để thấy mình đang sống.\n\n(Người biên soạn)\n\nXác định phương thức biểu đạt chính và thao tác lập luận chủ yếu của văn bản.","type":"short"},{"answer":"Biện pháp đối lập (“cho” — “lấy đi”, “thời gian” — “khoảnh khắc”) làm nổi bật nghịch lí hai mặt của sự tiện lợi, khiến câu văn cô đúc, giàu sức thuyết phục.","explain":"Phân tích: câu văn sử dụng phép đối lập chặt chẽ trên hai cặp phạm trù — “cho” đối “lấy đi”, “thời gian” (đại lượng đo được) đối “khoảnh khắc” (giá trị sống). Tác dụng: (1) Làm nổi bật nghịch lí trung tâm của văn bản: cái được (thời gian) và cái mất (khoảnh khắc sống) luôn song hành; (2) Câu hỏi tu từ cuối đoạn (“chẳng phải... sao?”) xoáy sâu vào nhận thức người đọc; (3) Cách diễn đạt cô đúc, cân xứng tạo ấn tượng mạnh, dễ nhớ — đặc trưng của văn nghị luận sắc sảo. Chấp nhận cách diễn đạt tương đương.","level":"VDC","points":1.0,"q":"Chỉ ra và phân tích tác dụng của biện pháp tu từ trong câu văn: “Tiện lợi cho ta thời gian, nhưng lại lấy đi của ta những khoảnh khắc”.","type":"short"},{"explain":"GỢI Ý TRẢ LỜI — THANG ĐIỂM (1,0 điểm — giáo viên chấm tay). 1. Đánh giá chung (0,25 điểm): lập luận chặt chẽ, có sức thuyết phục — đi từ hiện tượng đến bản chất, từ cái lợi đến cái hại, rồi đề xuất giải pháp (“sự bất tiện có chủ ý”). 2. Điểm mạnh (0,25 điểm): dẫn chứng gần gũi, cụ thể (máy giặt, giao đồ ăn, thuật toán); giọng văn vừa phê phán vừa thấu hiểu, không cực đoan (thừa nhận “không ai muốn quay lại thời đèn dầu”). 3. Bổ sung hoặc phản biện (0,5 điểm): có thể bổ sung — tiện lợi cũng giải phóng con người khỏi lao động nặng nhọc để làm việc sáng tạo; với người khuyết tật, người già, tiện lợi là nhu cầu thiết yếu chứ không phải xa xỉ; hoặc phản biện — “sự bất tiện có chủ ý” là đặc quyền của người có điều kiện, không phải ai cũng lựa chọn được. Đánh giá cao bài làm có chính kiến độc lập, không lặp lại máy móc văn bản.","level":"VDC","points":0,"q":"Anh/Chị đánh giá thế nào về hệ thống lập luận của tác giả? Có điểm nào anh/chị muốn bổ sung hoặc phản biện không? Vì sao?","type":"essay"},{"explain":"GỢI Ý TRẢ LỜI — THANG ĐIỂM (1,5 điểm — giáo viên chấm tay). 1. Nêu “sự bất tiện có chủ ý” cụ thể (0,5 điểm): ví dụ — tự nấu ăn thay vì đặt đồ ăn sẵn; viết nhật ký tay thay vì gõ máy; đi bộ/đạp xe quãng ngắn thay vì xe ôm công nghệ; đọc sách giấy thay vì lướt tóm tắt; gặp mặt trực tiếp thay vì nhắn tin. 2. Lí giải vì sao (0,5 điểm): những việc “bất tiện” ấy nuôi dưỡng sự kiên nhẫn, khả năng tập trung, cảm xúc thật và kết nối người — người; chúng là “vùng đất” mà thuật toán không chạm tới được; con người cần lao động chân tay và chờ đợi để cảm nhận giá trị của thành quả. 3. Tính khả thi và cam kết cá nhân (0,5 điểm): việc nhỏ, làm được ngay; thể hiện ý thức làm chủ công nghệ thay vì bị công nghệ dắt đi. Đoạn văn khoảng 150 chữ, chân thành, có suy nghĩ riêng được cộng điểm trình bày.","level":"VDC","points":0,"q":"Nêu một “sự bất tiện có chủ ý” mà anh/chị (hoặc người trẻ nói chung) nên giữ lại trong đời sống số, và lí giải vì sao. (Viết đoạn văn khoảng 150 chữ.)","type":"essay"},{"explain":"DÀN Ý CHI TIẾT (6,0 điểm — giáo viên chấm tay). I. Mở bài (0,5 điểm): nghịch lí — con người sáng tạo ra công nghệ để làm chủ cuộc sống, nhưng ngày càng có nguy cơ trở thành “nô lệ” của chính sáng tạo của mình; nêu vấn đề. II. Thân bài (4,5 điểm): 1. Giải thích (0,75 điểm): “làm chủ công nghệ” là dùng công nghệ như công cụ phục vụ mục đích của mình; “bị công nghệ làm chủ” là để công nghệ chi phối thói quen, tư duy, cảm xúc (nghiện mạng xã hội, lệ thuộc AI, để thuật toán quyết định thay). 2. Biểu hiện của việc bị công nghệ làm chủ (0,75 điểm): lướt điện thoại vô thức hàng giờ; nhờ AI làm bài tập, mất dần tư duy độc lập; so sánh, lo âu vì mạng xã hội; dữ liệu cá nhân bị khai thác. 3. Nguyên nhân (0,75 điểm): thiết kế gây nghiện của các nền tảng; tâm lí đám đông, sợ bị bỏ lỡ; thiếu giáo dục về công dân số. 4. Hậu quả (0,75 điểm): suy giảm tập trung, trí nhớ, sáng tạo; rạn nứt quan hệ thật; nguy cơ bị thao túng thông tin. 5. Phản đề (0,75 điểm): công nghệ tự thân không xấu — vấn đề là cách dùng; nhiều người vẫn làm chủ tốt (dùng AI để học sâu hơn, dùng mạng để lan tỏa điều tốt). 6. Giải pháp và liên hệ (0,75 điểm): đặt giới hạn (giờ “cai” điện thoại), dùng công nghệ có chủ đích, rèn tư duy phản biện trước khi hỏi AI, bảo vệ dữ liệu cá nhân. III. Kết bài (1,0 điểm): khẳng định — câu hỏi không phải là “có dùng công nghệ không” mà là “dùng như thế nào”; thông điệp. BÀI MẪU (đoạn mẫu): “Hãy thành thật: lần cuối cùng bạn chờ ai đó mà không rút điện thoại ra là khi nào? Cái máy nhỏ trong túi đã khéo léo biến mọi khoảng trống của đời ta thành “thời gian lướt”. Chúng ta không còn biết chờ đợi, không còn biết buồn chán — mà buồn chán, các nhà tâm lí học nói, chính là cái nôi của sáng tạo. Bi kịch không nằm ở chỗ công nghệ quá thông minh, mà ở chỗ con người ngày càng lười suy nghĩ. Làm chủ công nghệ, suy cho cùng, bắt đầu từ một hành động rất nhỏ: dám đặt điện thoại xuống.” THANG ĐIỂM GỢI Ý: bố cục 3 phần (1,0); luận điểm đầy đủ, có phản đề và giải pháp (2,5); lí lẽ + dẫn chứng thời sự thuyết phục (1,5); văn viết sắc sảo, có giọng riêng (1,0).","level":"VDC","points":0,"q":"PHẦN II. LÀM VĂN (16,0 điểm)\nNghị luận xã hội (6,0 điểm). Anh/Chị hãy viết bài văn nghị luận (khoảng 600 chữ) trình bày suy nghĩ về vấn đề: làm chủ công nghệ hay bị công nghệ làm chủ?","type":"essay"},{"explain":"DÀN Ý CHI TIẾT (10,0 điểm — giáo viên chấm tay). I. Mở bài (1,0 điểm): giới thiệu ý kiến và truyện ngắn “Vợ nhặt” (Kim Lân) — tác phẩm viết về nạn đói năm 1945, nơi tình người tỏa sáng giữa hoàn cảnh khốn cùng. II. Thân bài (7,0 điểm): 1. Giải thích ý kiến (1,0 điểm): “hoàn cảnh khốn cùng” là đói khát, chết chóc, bế tắc; “vẻ đẹp của tình người” là lòng nhân ái, sự đùm bọc, khát vọng sống; văn học có sứ mệnh phát hiện và ngợi ca vẻ đẹp ấy. 2. Hoàn cảnh khốn cùng trong tác phẩm (1,5 điểm): nạn đói khủng khiếp — người chết như ngả rạ, “không khí vẩn lên mùi ẩm thối của rác rưởi và mùi gây của xác người”; Tràng — dân ngụ cư nghèo, xấu xí, ế vợ — “nhặt” được vợ chỉ bằng bốn bát bánh đúc. 3. Vẻ đẹp tình người tỏa sáng (2,5 điểm): Tràng — từ bỡ ngỡ đến hạnh phúc, tình thương biến kẻ khờ khạo thành người chồng có trách nhiệm (“hắn thấy thương thương, xót xót”); người vợ nhặt — từ liều lĩnh, chao chát đến ý tứ, hiền hậu, lo toan (“dọn dẹp, quét tước”, bữa cơm đầu tiên); bà cụ Tứ — “lòng thương” bao dung, nồi cháo cám đắng chát mà ấm tình người, câu chuyện về Việt Minh gieo hy vọng. 4. Nghệ thuật (1,0 điểm): tình huống truyện độc đáo (nhặt vợ giữa nạn đói), miêu tả tâm lí tinh tế, ngôn ngữ giản dị đậm chất nông thôn Bắc Bộ, chi tiết “nồi cháo cám” ám ảnh. 5. Đánh giá, mở rộng (1,0 điểm): ý kiến đúng — giá trị nhân đạo là thước đo của văn học; liên hệ: giữa đời sống hôm nay, văn học vẫn cần tiếp tục phát hiện vẻ đẹp tình người (những tấm lòng trong bão lũ, dịch bệnh...). III. Kết bài (1,0 điểm): khẳng định giá trị ý kiến và tác phẩm — “Vợ nhặt” là minh chứng đẹp nhất cho nhận định. BÀI MẪU (đoạn mẫu — chi tiết nồi cháo cám): “Cả truyện ngắn “Vợ nhặt”, không chi tiết nào ám ảnh bằng nồi cháo cám trong bữa cơm đầu tiên của gia đình Tràng. Cám — thứ thức ăn của súc vật — được bà cụ Tứ múc ra với tất cả sự trang trọng của một “món ăn sang”. Cái đắng chát của cám không át được vị ngọt của tình người: ở đó có sự bao dung của người mẹ, sự ý tứ của nàng dâu mới, và niềm hạnh phúc vừa bỡ ngỡ vừa thiêng liêng của Tràng. Kim Lân đã chứng minh: khi cái đói đẩy con người xuống tận cùng, thứ còn lại — và tỏa sáng nhất — chính là tình người.” THANG ĐIỂM GỢI Ý: bố cục 3 phần (1,0); giải thích đúng ý kiến (1,0); phân tích hoàn cảnh khốn cùng (1,5); phân tích vẻ đẹp tình người sâu sắc, có dẫn chứng (3,5); nghệ thuật + mở rộng (1,5); văn viết giàu cảm xúc (1,5).","level":"VDC","points":0,"q":"Nghị luận văn học (10,0 điểm). Có ý kiến cho rằng: “Trong hoàn cảnh khốn cùng nhất, văn học vẫn giúp con người nhận ra vẻ đẹp của tình người.” Anh/Chị hãy bình luận ý kiến trên qua truyện ngắn “Vợ nhặt” (Kim Lân).","type":"essay"}]}]}
