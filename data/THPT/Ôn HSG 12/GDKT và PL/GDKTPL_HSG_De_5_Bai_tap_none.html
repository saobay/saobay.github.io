<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 5", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Đồng Việt Nam mất giá so với đô la Mỹ, tức tỉ giá USD/VND tăng lên. Tác động nào sau đây đối với nền kinh tế là đúng đắn nhất?", "options": ["A. Hàng hóa xuất khẩu của Việt Nam trở nên đắt hơn đối với người mua nước ngoài.", "B. Hàng xuất khẩu trở nên rẻ hơn tương đối, có lợi cho xuất khẩu; nhưng hàng nhập khẩu đắt hơn, gây áp lực lạm phát chi phí đẩy.", "C. Tỉ giá biến động không ảnh hưởng gì đến hoạt động thương mại quốc tế.", "D. Nhập khẩu tăng mạnh vì hàng hóa nước ngoài trở nên rẻ hơn."], "answer": "B", "explain": "Khi đồng nội tệ mất giá, giá hàng xuất khẩu tính bằng ngoại tệ giảm xuống nên rẻ hơn tương đối, tăng sức cạnh tranh cho hàng xuất khẩu. Ngược lại, giá hàng nhập khẩu tính bằng nội tệ tăng lên, làm tăng chi phí đầu vào cho sản xuất trong nước sử dụng nguyên liệu nhập khẩu, gây áp lực lạm phát chi phí đẩy. Đây là tác động hai mặt của biến động tỉ giá mà nhà hoạch định chính sách và doanh nghiệp xuất nhập khẩu phải tính đến khi hội nhập kinh tế quốc tế."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nhà xuất bản X tự ý in và phát hành cuốn sách của tác giả Y mà không được Y cho phép, thu lợi 500 triệu đồng. Theo pháp luật sở hữu trí tuệ, hành vi của nhà xuất bản X được đánh giá như thế nào?", "options": ["A. Không vi phạm pháp luật vì cuốn sách đã được xuất bản công khai trước đó.", "B. Vi phạm quyền tác giả: tác giả có quyền yêu cầu chấm dứt hành vi vi phạm, bồi thường thiệt hại; nhà xuất bản có thể bị xử phạt vi phạm hành chính hoặc bị truy cứu trách nhiệm hình sự nếu đủ yếu tố cấu thành tội phạm.", "C. Chỉ cần ghi tên tác giả Y trên bìa sách là đã đủ nghĩa vụ pháp lý.", "D. Chỉ vi phạm khi tác giả Y đã đăng ký bản quyền tại cơ quan nhà nước."], "answer": "B", "explain": "Điều 6 Luật Sở hữu trí tuệ 2005 quy định quyền tác giả phát sinh kể từ khi tác phẩm được sáng tạo và thể hiện dưới một hình thức vật chất nhất định, không phụ thuộc vào việc đăng ký. Việc sao chép, phát hành tác phẩm mà không được chủ sở hữu quyền cho phép là xâm phạm quyền tài sản của tác giả. Tác giả có quyền yêu cầu chấm dứt hành vi, bồi thường thiệt hại; tùy mức độ, hành vi có thể bị xử phạt vi phạm hành chính hoặc bị truy cứu trách nhiệm hình sự về tội xâm phạm quyền tác giả, quyền liên quan (Điều 225 Bộ luật Hình sự 2015)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một công ty tuyển dụng ba vị trí và áp dụng thời gian thử việc như sau: giám đốc tài chính thử việc 180 ngày; kỹ sư cần trình độ đại học thử việc 60 ngày; nhân viên tạp vụ thử việc 06 ngày làm việc. Đánh giá nào sau đây đúng theo Bộ luật Lao động 2019?", "options": ["A. Công ty vi phạm vì thời gian thử việc quá dài ở tất cả các vị trí.", "B. Công ty thực hiện đúng khung tối đa: không quá 180 ngày với người quản lý doanh nghiệp; không quá 60 ngày với công việc cần trình độ từ cao đẳng trở lên; không quá 06 ngày làm việc với công việc khác.", "C. Mọi vị trí công việc đều chỉ được thử việc tối đa 30 ngày.", "D. Pháp luật không cho phép thử việc đối với vị trí nhân viên tạp vụ."], "answer": "B", "explain": "Điều 25 Bộ luật Lao động 2019 phân loại thời gian thử việc tối đa theo tính chất công việc: không quá 180 ngày đối với công việc của người quản lý doanh nghiệp; không quá 60 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên; không quá 30 ngày đối với công việc cần trình độ trung cấp, công nhân kỹ thuật, nhân viên nghiệp vụ; không quá 06 ngày làm việc đối với công việc khác. Công ty áp dụng đúng mức tối đa cho từng nhóm công việc nên không vi phạm."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "E (16 tuổi) tự ý bán chiếc xe máy trị giá 40 triệu đồng do bố mẹ mua cho (xe đã đăng ký biển số) cho bạn mà không hỏi ý kiến bố mẹ. Theo Bộ luật Dân sự 2015, giao dịch này có hiệu lực như thế nào?", "options": ["A. Giao dịch có hiệu lực vì E đã đủ 16 tuổi.", "B. Giao dịch không có hiệu lực nếu không được người đại diện theo pháp luật đồng ý, vì người từ đủ 15 tuổi đến chưa đủ 18 tuổi khi xác lập giao dịch liên quan đến động sản phải đăng ký phải được người đại diện đồng ý.", "C. Giao dịch có hiệu lực nếu bạn của E không biết E chưa đủ 18 tuổi.", "D. Bố mẹ E buộc phải chấp nhận giao dịch vì E đã nhận tiền của bạn."], "answer": "B", "explain": "Điều 21 Bộ luật Dân sự 2015 quy định: người từ đủ 15 tuổi đến chưa đủ 18 tuổi tự mình xác lập, thực hiện giao dịch dân sự, trừ giao dịch dân sự liên quan đến bất động sản, động sản phải đăng ký và giao dịch dân sự khác theo quy định của luật phải được người đại diện theo pháp luật đồng ý. Xe máy là động sản phải đăng ký nên giao dịch bán xe của E (16 tuổi) phải được bố mẹ đồng ý mới có hiệu lực; nếu không được đồng ý, giao dịch vô hiệu và các bên hoàn trả cho nhau những gì đã nhận."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Năm 2024, một nền kinh tế có các số liệu: tiêu dùng của hộ gia đình 300 tỉ USD, đầu tư 120 tỉ USD, chi tiêu của chính phủ 80 tỉ USD, xuất khẩu 150 tỉ USD, nhập khẩu 130 tỉ USD. GDP tính theo phương pháp chi tiêu của nền kinh tế này là bao nhiêu?", "options": ["A. 520 tỉ USD.", "B. 500 tỉ USD.", "C. 650 tỉ USD.", "D. 480 tỉ USD."], "answer": "A", "explain": "GDP theo phương pháp chi tiêu (tổng cầu) được tính bằng công thức: GDP = C + I + G + (X - M), trong đó C là tiêu dùng hộ gia đình, I là đầu tư, G là chi tiêu chính phủ, X là xuất khẩu, M là nhập khẩu. Áp dụng: 300 + 120 + 80 + (150 - 130) = 520 tỉ USD. Xuất khẩu ròng (X - M) bằng 20 tỉ USD, phản ánh đóng góp của thương mại quốc tế vào tổng sản phẩm quốc nội."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nhiều doanh nghiệp trong khu công nghiệp K xả thải vượt quy chuẩn ra kênh tiêu chung, gây thiệt hại cho hàng trăm hộ nuôi trồng thủy sản. Người dân khởi kiện yêu cầu bồi thường. Nguyên tắc pháp lý then chốt được áp dụng để giải quyết vụ việc này là gì?", "options": ["A. Người gây ô nhiễm môi trường phải khắc phục hậu quả và bồi thường thiệt hại đã gây ra.", "B. Nhà nước đứng ra bồi thường thay cho các doanh nghiệp gây ô nhiễm.", "C. Người dân tự chịu thiệt hại vì đã chọn sinh sống gần khu công nghiệp.", "D. Chỉ xử phạt vi phạm hành chính, không đặt ra trách nhiệm bồi thường."], "answer": "A", "explain": "Nguyên tắc người gây ô nhiễm phải chịu trách nhiệm là trụ cột của pháp luật môi trường: tổ chức, cá nhân gây ô nhiễm môi trường phải khắc phục ô nhiễm, phục hồi môi trường theo quy định của Luật Bảo vệ môi trường 2020. Đồng thời, thiệt hại về tài sản, sức khỏe do hành vi xả thải gây ra làm phát sinh trách nhiệm bồi thường thiệt hại ngoài hợp đồng theo khoản 1 Điều 584 Bộ luật Dân sự 2015. Xử phạt hành chính và trách nhiệm bồi thường dân sự tồn tại song song, không loại trừ nhau."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Trong buổi sinh hoạt lớp với chủ đề bình đẳng giới, các bạn học sinh đưa ra các nhận định sau. Đánh giá tính đúng, sai của từng nhận định:", "statements": ["a) Mọi người đều bình đẳng trước pháp luật.", "b) Nam, nữ bình đẳng về chính trị, kinh tế, văn hóa, xã hội và trong gia đình.", "c) Người sử dụng lao động được trả lương thấp hơn cho lao động nữ làm cùng công việc với lý do lao động nữ phải nghỉ thai sản.", "d) Trẻ em gái có quyền được đi học như trẻ em trai."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. Điều 16 Hiến pháp 2013 quy định mọi người đều bình đẳng trước pháp luật, không ai bị phân biệt đối xử trong đời sống chính trị, dân sự, kinh tế, văn hóa, xã hội. b) Đúng. Điều 26 Hiến pháp 2013 ghi nhận công dân nam, nữ bình đẳng về mọi mặt và Nhà nước có chính sách bảo đảm quyền, cơ hội bình đẳng giới. c) Sai. Điều 90 Bộ luật Lao động 2019 quy định tiền lương trả theo công việc, không phân biệt giới tính; việc nghỉ thai sản là quyền hợp pháp của lao động nữ, không thể là căn cứ trả lương thấp hơn. d) Đúng. Quyền học tập là quyền cơ bản của mọi công dân (Điều 39 Hiến pháp 2013), trẻ em gái và trẻ em trai bình đẳng trong tiếp cận giáo dục."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Sau khi tìm hiểu về quyền khiếu nại, tố cáo của công dân, bạn H tổng hợp các nội dung sau. Đánh giá tính đúng, sai của từng nội dung:", "statements": ["a) Khiếu nại là việc công dân đề nghị cơ quan có thẩm quyền xem xét lại quyết định hành chính, hành vi hành chính khi có căn cứ cho rằng trái pháp luật, xâm phạm quyền, lợi ích hợp pháp của mình.", "b) Tố cáo là việc cá nhân báo cho cơ quan, tổ chức, cá nhân có thẩm quyền biết về hành vi vi phạm pháp luật gây thiệt hại hoặc đe dọa gây thiệt hại đến lợi ích của Nhà nước, quyền và lợi ích hợp pháp của cơ quan, tổ chức, cá nhân.", "c) Thời hiệu khiếu nại là 30 ngày kể từ ngày người khiếu nại nhận được quyết định hành chính.", "d) Nghiêm cấm hành vi trả thù người khiếu nại, tố cáo; người có hành vi trả thù bị xử lý theo quy định của pháp luật."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. Đây là khái niệm quyền khiếu nại theo Luật Khiếu nại 2011, với đối tượng là quyết định hành chính, hành vi hành chính xâm phạm quyền, lợi ích hợp pháp của chính người khiếu nại. b) Đúng. Đây là khái niệm quyền tố cáo theo Luật Tố cáo 2018, với đối tượng là hành vi vi phạm pháp luật nói chung, không giới hạn ở quyền lợi của bản thân người tố cáo. c) Sai. Điều 9 Luật Khiếu nại 2011 quy định thời hiệu khiếu nại là 90 ngày, không phải 30 ngày, kể từ ngày người khiếu nại nhận được hoặc biết được quyết định hành chính, hành vi hành chính. d) Đúng. Khoản 3 Điều 30 Hiến pháp 2013 nghiêm cấm việc trả thù người khiếu nại, tố cáo; Luật Khiếu nại 2011 và Luật Tố cáo 2018 đều quy định xử lý người có hành vi trả thù."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "GDP tính theo phương pháp chi tiêu bằng tổng của tiêu dùng hộ gia đình (C), đầu tư (I), chi tiêu chính phủ (G) và thành phần nào sau đây?", "answer": "xuất khẩu ròng", "explain": "Công thức GDP theo phương pháp chi tiêu là GDP = C + I + G + (X - M), trong đó (X - M) là xuất khẩu ròng, bằng xuất khẩu trừ nhập khẩu. Xuất khẩu ròng dương có nghĩa nền kinh tế xuất siêu, đóng góp dương vào GDP; xuất khẩu ròng âm có nghĩa nhập siêu, làm giảm GDP tính theo phương pháp này."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Theo khoản 2 Điều 14 Hiến pháp 2013, quyền con người, quyền công dân chỉ có thể bị hạn chế theo quy định của văn bản quy phạm pháp luật loại nào?", "answer": "luật", "explain": "Khoản 2 Điều 14 Hiến pháp 2013 quy định: quyền con người, quyền công dân chỉ có thể bị hạn chế theo quy định của luật trong trường hợp cần thiết vì lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, sức khỏe của cộng đồng. Việc dùng từ luật (văn bản do Quốc hội ban hành) thể hiện nguyên tắc hạn chế quyền ở cấp độ cao nhất, không thể tùy tiện hạn chế bằng văn bản dưới luật."}]}]}
