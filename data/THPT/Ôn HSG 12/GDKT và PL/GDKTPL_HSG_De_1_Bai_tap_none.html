<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Năm 2024, nước X có GDP tăng 6,5% so với năm trước; tuy nhiên tỉ lệ thất nghiệp tăng từ 2,3% lên 4,1%, chỉ số Gini tăng từ 0,35 lên 0,42, tỉ lệ hộ nghèo đa chiều tăng nhẹ, trong khi tỉ trọng công nghiệp chế biến trong GDP giảm dần. Nhận định nào sau đây đúng nhất về tình hình kinh tế của nước X?", "options": ["A. Nước X đạt phát triển kinh tế vì GDP tăng cao.", "B. Nước X chỉ đạt tăng trưởng kinh tế, chưa đạt phát triển kinh tế.", "C. Nước X rơi vào suy thoái kinh tế vì tỉ lệ thất nghiệp tăng.", "D. Nước X đạt phát triển bền vững vì tỉ trọng công nghiệp giảm."], "answer": "B", "explain": "Phát triển kinh tế là sự tăng trưởng kinh tế gắn liền với chuyển dịch cơ cấu kinh tế theo hướng tích cực và bảo đảm tiến bộ, công bằng xã hội. Số liệu cho thấy nước X chỉ có tăng trưởng (GDP tăng 6,5%) nhưng: cơ cấu kinh tế chuyển dịch tiêu cực (tỉ trọng công nghiệp chế biến giảm), bất bình đẳng gia tăng (Gini tăng), thất nghiệp và nghèo đa chiều tăng. Vì vậy chưa thể kết luận đạt phát triển kinh tế. Phương án C sai vì GDP vẫn tăng mạnh nên không phải suy thoái; D sai vì giảm tỉ trọng công nghiệp chế biến ở đây là chuyển dịch tiêu cực."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Công ty hóa chất H xả nước thải chưa qua xử lý ra sông, gây chết cá hàng loạt và ảnh hưởng sức khỏe người dân quanh vùng. Đánh giá nào sau đây đầy đủ nhất về trách nhiệm của công ty H?", "options": ["A. Chỉ phải nộp phạt vi phạm hành chính là đủ.", "B. Phải khắc phục hậu quả, bồi thường thiệt hại theo quy định của pháp luật; đồng thời đã vi phạm trách nhiệm xã hội của doanh nghiệp ở cả phương diện pháp lý và đạo đức.", "C. Chỉ cần công khai xin lỗi người dân vì công ty đã nộp thuế đầy đủ.", "D. Không phải chịu trách nhiệm vì đã tạo việc làm cho địa phương."], "answer": "B", "explain": "Về pháp lý: hành vi xả thải gây ô nhiễm bị xử phạt vi phạm hành chính; gây thiệt hại về tài sản, sức khỏe phải bồi thường thiệt hại ngoài hợp đồng (khoản 1 Điều 584 Bộ luật Dân sự 2015: người nào có hành vi xâm phạm tính mạng, sức khỏe, tài sản, quyền, lợi ích hợp pháp khác của người khác mà gây thiệt hại thì phải bồi thường); nếu đủ yếu tố cấu thành tội phạm còn bị truy cứu trách nhiệm hình sự. Về trách nhiệm xã hội của doanh nghiệp (mô hình kim tự tháp Carroll): công ty vi phạm trách nhiệm pháp lý (không tuân thủ pháp luật môi trường) và trách nhiệm đạo đức (gây hại cộng đồng). Nộp thuế hay tạo việc làm không xóa bỏ các trách nhiệm này."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ông K bị Chủ tịch UBND huyện ra quyết định thu hồi đất; ông K cho rằng quyết định này trái pháp luật, xâm phạm quyền và lợi ích hợp pháp của mình. Theo Luật Khiếu nại 2011, bước đầu tiên ông K phải thực hiện là gì?", "options": ["A. Khởi kiện ngay ra Tòa án nhân dân tỉnh.", "B. Gửi đơn khiếu nại lần đầu đến người đã ra quyết định thu hồi đất.", "C. Gửi đơn tố cáo Chủ tịch UBND huyện đến cơ quan công an.", "D. Gửi đơn khiếu nại đến Chủ tịch UBND tỉnh vì đó là cấp trên trực tiếp."], "answer": "B", "explain": "Điều 7 Luật Khiếu nại 2011 quy định trình tự khiếu nại: khiếu nại lần đầu đến người đã ra quyết định hành chính hoặc cơ quan, tổ chức có người có hành vi hành chính; trường hợp không đồng ý với quyết định giải quyết lần đầu thì mới khiếu nại lần hai đến thủ trưởng cấp trên trực tiếp của người đã giải quyết lần đầu. Đây là quyền khiếu nại (đề nghị xem xét lại quyết định hành chính xâm phạm quyền lợi của chính mình), khác với quyền tố cáo là báo hành vi vi phạm pháp luật. Vì vậy ông K phải khiếu nại lần đầu đến Chủ tịch UBND huyện, không thể bỏ qua bước này để lên tỉnh hay chuyển thành tố cáo."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "T đăng lên mạng xã hội thông tin bịa đặt rằng quán ăn của S dùng thực phẩm bẩn, kèm hình ảnh đã qua chỉnh sửa, khiến quán S mất khách và thiệt hại 200 triệu đồng. Pháp luật đánh giá hành vi của T như thế nào?", "options": ["A. Chỉ vi phạm đạo đức, không vi phạm pháp luật.", "B. Có dấu hiệu tội vu khống (Điều 156 Bộ luật Hình sự 2015) và phải bồi thường thiệt hại ngoài hợp đồng (Điều 584 Bộ luật Dân sự 2015); đồng thời vi phạm hành vi bị nghiêm cấm trên không gian mạng (Điều 8 Luật An ninh mạng 2018).", "C. Chỉ bị xử phạt vi phạm hành chính, không phải bồi thường thiệt hại.", "D. Chỉ cần gỡ bài viết là xong, không phát sinh trách nhiệm nào khác."], "answer": "B", "explain": "Hành vi bịa đặt, loan truyền thông tin sai sự thật xúc phạm nghiêm trọng uy tín của người khác có dấu hiệu tội vu khống theo Điều 156 Bộ luật Hình sự 2015. Thiệt hại vật chất 200 triệu đồng làm phát sinh trách nhiệm bồi thường thiệt hại ngoài hợp đồng theo khoản 1 Điều 584 Bộ luật Dân sự 2015. Việc đưa tin sai sự thật, xúc phạm uy tín người khác trên mạng xã hội còn vi phạm Điều 8 Luật An ninh mạng 2018 về các hành vi bị nghiêm cấm trên không gian mạng. Ba loại trách nhiệm này tồn tại độc lập, không loại trừ nhau."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Chị L có 500 triệu đồng và đang cân nhắc hai phương án: (1) mở quán cà phê, lợi nhuận ròng dự kiến 120 triệu đồng/năm, rủi ro trung bình; (2) gửi tiết kiệm với lãi suất 6%/năm, tức 30 triệu đồng/năm, rủi ro thấp. Nếu chọn phương án 1, chi phí cơ hội mỗi năm của chị L là bao nhiêu và kết luận nào đúng?", "options": ["A. 120 triệu đồng; nên chọn phương án 2.", "B. 500 triệu đồng; nên chọn phương án 1.", "C. 30 triệu đồng; lợi nhuận kinh tế của phương án 1 là 90 triệu đồng nên phương án 1 hiệu quả hơn.", "D. 90 triệu đồng; hai phương án tương đương nhau."], "answer": "C", "explain": "Chi phí cơ hội là giá trị của phương án tốt nhất bị bỏ qua khi đã lựa chọn, ở đây bằng 30 triệu đồng/năm tiền lãi tiết kiệm. Lợi nhuận kế toán của phương án 1 là 120 triệu đồng, nhưng lợi nhuận kinh tế bằng lợi nhuận kế toán trừ chi phí cơ hội, tức 120 - 30 = 90 triệu đồng, vẫn dương nên phương án 1 hiệu quả hơn phương án 2. Đây là điểm khác biệt cốt lõi giữa phân tích kế toán và phân tích kinh tế trong lập kế hoạch kinh doanh."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Anh P là công nhân, tham gia bảo hiểm xã hội bắt buộc; đồng thời anh mua thêm một hợp đồng bảo hiểm nhân thọ của công ty bảo hiểm thương mại. Nhận định nào sau đây đúng nhất?", "options": ["A. Cả hai đều là bảo hiểm xã hội bắt buộc do Nhà nước tổ chức.", "B. Bảo hiểm xã hội bắt buộc mang tính an sinh xã hội, do Nhà nước tổ chức, người lao động và người sử dụng lao động cùng đóng; bảo hiểm nhân thọ là bảo hiểm thương mại, quan hệ hợp đồng dân sự, người tham gia đóng phí để hưởng quyền lợi theo thỏa thuận.", "C. Bảo hiểm nhân thọ cũng là loại hình Nhà nước bắt buộc mọi công nhân phải mua.", "D. Đã tham gia bảo hiểm xã hội bắt buộc thì không được mua bảo hiểm nhân thọ."], "answer": "B", "explain": "Bảo hiểm xã hội (Luật Bảo hiểm xã hội 2014) là chính sách an sinh xã hội của Nhà nước, mang tính bắt buộc với người lao động làm công theo hợp đồng, hai bên cùng đóng vào quỹ chung. Bảo hiểm nhân thọ thuộc lĩnh vực kinh doanh bảo hiểm thương mại, hình thành trên cơ sở hợp đồng tự nguyện giữa bên mua và doanh nghiệp bảo hiểm, quyền lợi theo thỏa thuận trong hợp đồng. Hai loại hình tồn tại song song, bổ trợ cho nhau, không loại trừ nhau."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Chị M đang mang thai tháng thứ 5, làm công nhân may. Do sức khỏe yếu, cơ sở khám bệnh, chữa bệnh có thẩm quyền chỉ định chị phải nghỉ việc để dưỡng thai. Chị M đơn phương chấm dứt hợp đồng lao động ngay mà không báo trước. Đánh giá các nhận định sau:", "statements": ["a) Chị M phải báo trước ít nhất 30 ngày mới được đơn phương chấm dứt hợp đồng lao động.", "b) Người sử dụng lao động không được sa thải chị M vì lý do mang thai.", "c) Nếu tiếp tục làm việc đến khi sinh, thời gian nghỉ thai sản của chị M là 06 tháng.", "d) Vì đã chấm dứt hợp đồng lao động nên chị M không được hưởng chế độ thai sản của bảo hiểm xã hội."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai. Lao động nữ mang thai phải nghỉ việc theo chỉ định của cơ sở khám bệnh, chữa bệnh có thẩm quyền thì được đơn phương chấm dứt hợp đồng lao động mà không cần báo trước (Điều 35 Bộ luật Lao động 2019). b) Đúng. Khoản 3 Điều 137 Bộ luật Lao động 2019 nghiêm cấm người sử dụng lao động sa thải hoặc đơn phương chấm dứt hợp đồng lao động vì lý do mang thai. c) Đúng. Khoản 1 Điều 137 Bộ luật Lao động 2019: lao động nữ được nghỉ thai sản trước và sau khi sinh con là 06 tháng. d) Sai. Chế độ thai sản của bảo hiểm xã hội chỉ yêu cầu đã đóng bảo hiểm xã hội từ đủ 06 tháng trở lên trong thời gian 12 tháng trước khi sinh con (Điều 31 Luật Bảo hiểm xã hội 2014), không yêu cầu còn duy trì hợp đồng lao động tại thời điểm sinh."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Vợ chồng anh A (công chức) và chị B (nội trợ, nuôi hai con nhỏ) ly hôn sau 15 năm chung sống; tài sản chung trị giá 3 tỉ đồng, trong đó phần lớn do anh A tạo lập từ thu nhập. Đánh giá các nhận định sau:", "statements": ["a) Tài sản chung của vợ chồng khi ly hôn luôn được chia đôi bằng nhau trong mọi trường hợp.", "b) Công sức nội trợ, nuôi con của chị B được coi là lao động có thu nhập và được tính đến khi chia tài sản.", "c) Nếu nguyên nhân ly hôn là do anh A ngoại tình, Tòa án có thể chia cho anh A ít hơn một nửa tài sản chung.", "d) Sau ly hôn, nếu chị B trực tiếp nuôi cả hai con thì anh A không phải cấp dưỡng vì tài sản đã chia xong."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai. Điều 59 Luật Hôn nhân và gia đình 2014 quy định tài sản chung được chia đôi nhưng có tính đến các yếu tố: hoàn cảnh của gia đình và của vợ, chồng; công sức đóng góp; bảo vệ lợi ích chính đáng của mỗi bên trong sản xuất, kinh doanh; lỗi của mỗi bên trong vi phạm quyền, nghĩa vụ của vợ chồng. b) Đúng. Khoản 2 Điều 59 quy định công sức đóng góp của vợ, chồng vào việc tạo lập tài sản chung bao gồm cả lao động trong gia đình được coi là lao động có thu nhập. c) Đúng. Lỗi của mỗi bên trong vi phạm quyền, nghĩa vụ vợ chồng (như ngoại tình) là một yếu tố Tòa án tính đến khi chia tài sản theo Điều 59. d) Sai. Nghĩa vụ cấp dưỡng nuôi con sau ly hôn tồn tại độc lập với việc chia tài sản chung vợ chồng."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Anh Q chấm dứt hợp đồng lao động và đủ điều kiện hưởng trợ cấp thất nghiệp. Mức bình quân tiền lương tháng đóng bảo hiểm thất nghiệp của 06 tháng liền kề trước khi thất nghiệp của anh Q là 15 triệu đồng/tháng. Mức trợ cấp thất nghiệp hằng tháng anh Q được hưởng là bao nhiêu?", "answer": "9 triệu đồng", "explain": "Khoản 1 Điều 50 Luật Việc làm 2013 quy định mức hưởng trợ cấp thất nghiệp hằng tháng bằng 60% mức bình quân tiền lương tháng đóng bảo hiểm thất nghiệp của 06 tháng liền kề trước khi thất nghiệp. Vậy mức hưởng của anh Q là 60% x 15 triệu đồng = 9 triệu đồng/tháng (trong giới hạn tối đa không quá 05 lần mức lương tối thiểu vùng)."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Do mâu thuẫn nợ nần, X cùng đồng bọn bắt giữ Y trái pháp luật, giam trong nhà kho suốt hai ngày để ép Y trả nợ. Hành vi của X cấu thành tội danh nào theo Bộ luật Hình sự 2015?", "answer": "Tội bắt, giữ hoặc giam người trái pháp luật", "explain": "Điều 133 Bộ luật Hình sự 2015 quy định tội bắt, giữ hoặc giam người trái pháp luật: người nào bắt, giữ hoặc giam người trái pháp luật thì bị phạt tù từ 02 năm đến 07 năm tùy mức độ. Hành vi bắt giữ Y để ép trả nợ không thuộc trường hợp bắt người theo tố tụng hình sự nên cấu thành tội này, khác với tội cưỡng đoạt tài sản hay tội cố ý gây thương tích."}]}]}
