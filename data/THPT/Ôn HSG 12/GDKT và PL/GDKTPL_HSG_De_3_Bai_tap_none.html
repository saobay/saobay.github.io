<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 3", "questions": [{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Chính phủ áp giá trần đối với mặt hàng xăng dầu ở mức thấp hơn giá cân bằng của thị trường. Hệ quả kinh tế nào sau đây có khả năng xảy ra nhất?", "options": ["A. Lượng cung tăng, lượng cầu giảm, thị trường dư thừa hàng hóa.", "B. Lượng cầu vượt lượng cung, gây khan hiếm, xếp hàng mua hàng và thị trường chợ đen.", "C. Giá giao dịch trên thị trường vẫn giữ nguyên ở mức cân bằng cũ.", "D. Doanh nghiệp kinh doanh xăng dầu tăng lợi nhuận vì bán được nhiều hơn."], "answer": "B", "explain": "Khi giá trần được đặt dưới giá cân bằng, tại mức giá bị khống chế thì lượng cầu vượt lượng cung, tạo ra thiếu hụt hàng hóa. Hệ quả thực tế: người tiêu dùng phải xếp hàng, phân phối theo tem phiếu hoặc hạn mức, xuất hiện chợ đen với giá cao hơn giá trần. Đây là bài học kinh điển về sự can thiệp hành chính vào cơ chế giá cả thị trường: giá trần bảo vệ người tiêu dùng trên danh nghĩa nhưng gây méo mó cung cầu nếu đặt sai mức."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "M (15 tuổi 6 tháng) dùng hung khí cướp tài sản của người đi đường và gây thương tích 35% cho nạn nhân. Theo Bộ luật Hình sự 2015, M phải chịu trách nhiệm hình sự như thế nào?", "options": ["A. Không phải chịu trách nhiệm hình sự vì chưa đủ 16 tuổi.", "B. Phải chịu trách nhiệm hình sự vì người từ đủ 14 tuổi đến dưới 16 tuổi phải chịu trách nhiệm hình sự về tội phạm rất nghiêm trọng, tội phạm đặc biệt nghiêm trọng.", "C. Chỉ bị xử phạt vi phạm hành chính.", "D. Chỉ cha mẹ của M phải bồi thường thiệt hại, M không chịu trách nhiệm hình sự."], "answer": "B", "explain": "Điều 12 Bộ luật Hình sự 2015 quy định: người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm; người từ đủ 14 tuổi đến dưới 16 tuổi phải chịu trách nhiệm hình sự về tội phạm rất nghiêm trọng, tội phạm đặc biệt nghiêm trọng. Tội cướp tài sản với tình tiết dùng hung khí, gây thương tích 35% thuộc loại tội rất nghiêm trọng, đặc biệt nghiêm trọng nên M (15 tuổi 6 tháng) phải chịu trách nhiệm hình sự. Song song đó, cha mẹ M vẫn có thể phải bồi thường thiệt hại về dân sự do người chưa thành niên gây ra."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ông S nhận chuyển nhượng quyền sử dụng đất nông nghiệp của ông V bằng giấy viết tay, chưa làm thủ tục sang tên và thửa đất chưa được cấp Giấy chứng nhận. Sau đó ông V tiếp tục bán thửa đất cho người khác có công chứng, chứng thực. Khi tranh chấp xảy ra, nhận định nào sau đây đúng nhất?", "options": ["A. Giao dịch viết tay giữa ông S và ông V vẫn có hiệu lực vì hai bên hoàn toàn tự nguyện.", "B. Đất đai thuộc sở hữu toàn dân, cá nhân chỉ có quyền sử dụng; việc chuyển nhượng quyền sử dụng đất phải đáp ứng đủ điều kiện luật định nên giao dịch viết tay không đủ điều kiện, quyền lợi các bên được giải quyết theo pháp luật đất đai và dân sự.", "C. Ai trả tiền trước thì đương nhiên được nhận quyền sử dụng đất.", "D. Nhà nước thu hồi thửa đất vì các bên có tranh chấp."], "answer": "B", "explain": "Điều 53 Hiến pháp 2013 và Điều 4 Luật Đất đai 2024 khẳng định đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và thống nhất quản lý; tổ chức, cá nhân chỉ có quyền sử dụng đất. Việc chuyển nhượng quyền sử dụng đất phải đáp ứng các điều kiện luật định, trong đó có điều kiện có Giấy chứng nhận quyền sử dụng đất và không có tranh chấp. Giao dịch viết tay khi đất chưa có Giấy chứng nhận là không đủ điều kiện, có thể bị tuyên vô hiệu; các bên giải quyết hậu quả theo quy định của pháp luật đất đai và pháp luật dân sự về giao dịch dân sự vô hiệu."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Công ty X đơn phương chấm dứt hợp đồng lao động với chị H với lý do duy nhất là chị H đang mang thai tháng thứ 4. Theo Bộ luật Lao động 2019, đánh giá nào sau đây đúng?", "options": ["A. Công ty làm đúng vì lao động nữ mang thai không bảo đảm năng suất lao động.", "B. Công ty đã vi phạm vì người sử dụng lao động không được sa thải hoặc đơn phương chấm dứt hợp đồng lao động với người lao động vì lý do kết hôn, mang thai, nghỉ thai sản, nuôi con dưới 12 tháng tuổi.", "C. Công ty được phép chấm dứt nếu trả cho chị H trợ cấp 2 tháng tiền lương.", "D. Chị H phải chấp nhận vì đã ký kết hợp đồng lao động."], "answer": "B", "explain": "Khoản 3 Điều 137 Bộ luật Lao động 2019 quy định rõ: người sử dụng lao động không được sa thải hoặc đơn phương chấm dứt hợp đồng lao động đối với người lao động vì lý do kết hôn, mang thai, nghỉ thai sản, nuôi con dưới 12 tháng tuổi, trừ trường hợp người sử dụng lao động là cá nhân chết hoặc bị Tòa án tuyên bố mất năng lực hành vi dân sự. Quyết định chấm dứt hợp đồng của công ty X với lý do mang thai là trái pháp luật; chị H có quyền yêu cầu hủy quyết định, được nhận lại làm việc và bồi thường."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ba doanh nghiệp sản xuất thép thỏa thuận ngầm với nhau về việc ấn định giá bán tối thiểu và phân chia khu vực thị trường tiêu thụ. Hành vi này được pháp luật cạnh tranh đánh giá như thế nào?", "options": ["A. Là biểu hiện của cạnh tranh lành mạnh trên thị trường.", "B. Là thỏa thuận hạn chế cạnh tranh bị cấm theo Luật Cạnh tranh 2018.", "C. Chỉ vi phạm pháp luật khi gây thiệt hại trên 1 tỉ đồng.", "D. Được phép thực hiện nếu các doanh nghiệp đều có quy mô nhỏ và vừa."], "answer": "B", "explain": "Điều 9 Luật Cạnh tranh 2018 xác định thỏa thuận hạn chế cạnh tranh bao gồm các thỏa thuận ấn định giá hàng hóa, dịch vụ một cách trực tiếp hoặc gián tiếp và thỏa thuận phân chia thị trường tiêu thụ. Điều 12 của Luật này quy định các thỏa thuận hạn chế cạnh tranh bị cấm, trong đó có thỏa thuận ấn định giá và phân chia thị trường giữa các doanh nghiệp cạnh tranh trên cùng thị trường liên quan. Hành vi thỏa thuận ngầm ấn định giá bán tối thiểu và phân chia thị trường của ba doanh nghiệp thép cấu thành vi phạm, bất kể quy mô doanh nghiệp hay mức thiệt hại cụ thể."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Doanh nghiệp A lập hai hệ thống sổ sách kế toán, khai man doanh thu để nộp thuế ít hơn số thuế phải nộp. Doanh nghiệp B chuyển một phần lợi nhuận sang công ty con đặt tại nước có thuế suất thấp, mọi thủ tục đều đúng quy định pháp luật. Đánh giá nào sau đây đúng nhất?", "options": ["A. Cả hai doanh nghiệp đều thực hiện hành vi trốn thuế.", "B. Doanh nghiệp A có hành vi trốn thuế bị pháp luật nghiêm cấm; doanh nghiệp B thực hiện tránh thuế, tức tối ưu nghĩa vụ thuế trong khuôn khổ pháp luật, nên hai hành vi khác nhau về tính hợp pháp.", "C. Cả hai hành vi đều hợp pháp.", "D. Doanh nghiệp B cũng phạm tội trốn thuế vì làm giảm số thuế nộp tại Việt Nam."], "answer": "B", "explain": "Trốn thuế là hành vi gian dối như lập hai sổ sách, khai man để giảm số thuế phải nộp, thuộc các hành vi bị nghiêm cấm trong quản lý thuế (Điều 8 Luật Quản lý thuế 2019) và có thể bị xử phạt hành chính hoặc truy cứu trách nhiệm hình sự. Tránh thuế là việc vận dụng các quy định pháp luật, chính sách ưu đãi, hiệp định tránh đánh thuế hai lần để giảm nghĩa vụ thuế một cách hợp pháp. Điểm phân biệt cốt lõi là tính hợp pháp của phương thức: gian dối trái luật hay vận dụng đúng luật."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Trong buổi ngoại khóa tìm hiểu Hiến pháp 2013, các bạn học sinh thảo luận về quyền con người, quyền công dân. Đánh giá các nhận định sau:", "statements": ["a) Quyền con người, quyền công dân chỉ có thể bị hạn chế theo quy định của luật trong trường hợp cần thiết vì lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, sức khỏe của cộng đồng.", "b) Người bị buộc tội được coi là có tội ngay từ khi bị khởi tố vụ án.", "c) Mọi người có quyền tự do kinh doanh trong những ngành nghề mà pháp luật không cấm.", "d) Công dân có quyền tự do ngôn luận nhưng không có quyền tiếp cận thông tin."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. Khoản 2 Điều 14 Hiến pháp 2013 quy định nguyên tắc hạn chế quyền: chỉ được hạn chế theo quy định của luật và trong những trường hợp cần thiết nêu trên. b) Sai. Điều 31 Hiến pháp 2013 ghi nhận nguyên tắc suy đoán vô tội: người bị buộc tội được coi là không có tội cho đến khi được chứng minh theo trình tự luật định và có bản án kết tội của Tòa án đã có hiệu lực pháp luật. c) Đúng. Điều 33 Hiến pháp 2013 quy định quyền tự do kinh doanh trong những ngành nghề mà pháp luật không cấm. d) Sai. Điều 25 Hiến pháp 2013 ghi nhận công dân có quyền tự do ngôn luận, tự do báo chí, tiếp cận thông tin, hội họp, lập hội, biểu tình."}, {"type": "truefalse", "level": "VDC", "points": 1, "q": "Anh D làm việc theo hợp đồng lao động tại một công ty tư nhân và tìm hiểu về các khoản bảo hiểm mình tham gia. Đánh giá các nhận định sau:", "statements": ["a) Người lao động tham gia bảo hiểm xã hội bắt buộc đóng bằng 8% mức tiền lương tháng vào quỹ hưu trí và tử tuất.", "b) Người sử dụng lao động đóng bằng 3% mức tiền lương tháng vào quỹ ốm đau và thai sản.", "c) Người lao động đóng bảo hiểm thất nghiệp bằng 1% tiền lương tháng.", "d) Người tham gia bảo hiểm xã hội tự nguyện được hưởng đầy đủ các chế độ như bảo hiểm xã hội bắt buộc, gồm cả chế độ ốm đau và thai sản."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. Theo Luật Bảo hiểm xã hội 2014, người lao động đóng bằng 8% mức tiền lương tháng vào quỹ hưu trí và tử tuất. b) Đúng. Người sử dụng lao động đóng bằng 3% quỹ tiền lương tháng vào quỹ ốm đau và thai sản. c) Đúng. Điều 57 Luật Việc làm 2013 quy định mức đóng bảo hiểm thất nghiệp: người lao động đóng bằng 1% tiền lương tháng, người sử dụng lao động đóng bằng 1% quỹ tiền lương tháng. d) Sai. Bảo hiểm xã hội tự nguyện chỉ gồm hai chế độ hưu trí và tử tuất, không có chế độ ốm đau, thai sản như bảo hiểm xã hội bắt buộc."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Theo Bộ luật Hình sự 2015, người từ đủ bao nhiêu tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm (trừ những tội phạm mà Bộ luật có quy định khác)?", "answer": "16 tuổi", "explain": "Điều 12 Bộ luật Hình sự 2015 quy định: người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm, trừ những tội phạm mà Bộ luật này có quy định khác. Người từ đủ 14 tuổi đến dưới 16 tuổi chỉ phải chịu trách nhiệm hình sự về tội phạm rất nghiêm trọng, tội phạm đặc biệt nghiêm trọng. Đây là căn cứ quan trọng để xác định chủ thể của tội phạm trong các tình huống có người chưa thành niên vi phạm pháp luật hình sự."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Theo Luật Khiếu nại 2011, thời hiệu khiếu nại quyết định hành chính, hành vi hành chính là bao nhiêu ngày kể từ ngày người khiếu nại nhận được hoặc biết được quyết định hành chính, hành vi hành chính đó?", "answer": "90 ngày", "explain": "Điều 9 Luật Khiếu nại 2011 quy định thời hiệu khiếu nại là 90 ngày kể từ ngày người khiếu nại nhận được quyết định hành chính hoặc biết được quyết định hành chính, hành vi hành chính. Hết thời hiệu mà không có lý do chính đáng thì người khiếu nại mất quyền khiếu nại, trừ trường hợp có trở ngại khách quan được pháp luật thừa nhận."}]}]}
