<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Để đối phó với “giặc đói” sau Cách mạng tháng Tám 1945, Đảng và Chính phủ đã phát động phong trào nào?", "options": ["A. Phong trào thi đua yêu nước.", "B. Phong trào tăng gia sản xuất, lập “hũ gạo cứu đói”.", "C. Phong trào toàn dân kháng chiến.", "D. Phong trào xây dựng hợp tác xã."], "answer": "B", "explain": "Trước nạn đói đe dọa, Chính phủ phát động tăng gia sản xuất, thực hành tiết kiệm; Chủ tịch Hồ Chí Minh kêu gọi lập “hũ gạo cứu đói” (mỗi bữa bớt một nắm gạo giúp người nghèo) — biện pháp thiết thực diệt “giặc đói”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phong trào Bình dân học vụ (diệt “giặc dốt”) được phát động vào thời gian nào?", "options": ["A. Tháng 8/1945.", "B. Tháng 12/1946.", "C. Tháng 9/1945 (ngay sau Cách mạng tháng Tám).", "D. Tháng 3/1946."], "answer": "C", "explain": "Ngày 8/9/1945, Chính phủ ra sắc lệnh thành lập Nha Bình dân học vụ, phát động phong trào xóa nạn mù chữ trong cả nước — diệt “giặc dốt”, nâng cao dân trí, bồi dưỡng lòng yêu nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Tuần lễ vàng” và “Quỹ độc lập” (tháng 9/1945) được tổ chức nhằm mục đích gì?", "options": ["A. Tổ chức lễ hội văn hóa mừng độc lập.", "B. Mua vũ khí từ nước ngoài.", "C. Trả nợ chiến tranh cho thực dân Pháp.", "D. Quyên góp vàng bạc, tiền của ủng hộ “Quỹ độc lập”, giải quyết khó khăn tài chính của chính quyền cách mạng."], "answer": "D", "explain": "Tháng 9/1945, Chính phủ phát động “Tuần lễ vàng”, xây dựng “Quỹ độc lập”, kêu gọi nhân dân quyên góp vàng bạc, tiền của ủng hộ chính quyền — thể hiện tinh thần yêu nước, khắc phục khó khăn ngân quỹ trống rỗng sau Cách mạng tháng Tám.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sau Cách mạng tháng Tám 1945, quân Trung Hoa Dân quốc kéo vào miền Bắc Việt Nam với danh nghĩa gì?", "options": ["A. Giúp Việt Nam xây dựng đất nước.", "B. Giải giáp quân Nhật (từ vĩ tuyến 16 trở ra Bắc), nhưng thực chất âm mưu lật đổ chính quyền cách mạng.", "C. Bảo vệ hòa bình thế giới.", "D. Rút quân về nước."], "answer": "B", "explain": "Theo thỏa thuận của Đồng minh, 20 vạn quân Trung Hoa Dân quốc (Tưởng Giới Thạch) vào miền Bắc giải giáp quân Nhật; nhưng chúng dung túng, giúp đỡ bọn phản động tay sai hòng lật đổ chính quyền cách mạng non trẻ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ở miền Nam (từ vĩ tuyến 16 trở vào), quân đội nước nào vào giải giáp quân Nhật và đã giúp Pháp quay lại xâm lược?", "options": ["A. Quân Mỹ.", "B. Quân Liên Xô.", "C. Quân Anh.", "D. Quân Trung Hoa Dân quốc."], "answer": "C", "explain": "Ở miền Nam, quân Anh (dưới quyền chỉ huy của tướng Gracey) vào giải giáp quân Nhật nhưng đã giúp thực dân Pháp nổ súng đánh chiếm Sài Gòn (23/9/1945), mở đầu cuộc xâm lược Việt Nam lần thứ hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nói “Dĩ bất biến, ứng vạn biến” của Chủ tịch Hồ Chí Minh (1946) thể hiện nguyên tắc ngoại giao nào?", "options": ["A. Nhân nhượng tất cả.", "B. Cứng rắn tuyệt đối.", "C. Không có nguyên tắc.", "D. Kiên định về nguyên tắc chiến lược (độc lập dân tộc), mềm dẻo, linh hoạt về sách lược."], "answer": "D", "explain": "“Dĩ bất biến, ứng vạn biến” — lấy cái không đổi (độc lập, chủ quyền dân tộc) để ứng phó với muôn sự biến đổi: thể hiện nghệ thuật ngoại giao vừa kiên định nguyên tắc, vừa mềm dẻo, linh hoạt về sách lược của Hồ Chí Minh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác phẩm “Kháng chiến nhất định thắng lợi” (1947) là của ai?", "options": ["A. Trường Chinh (Tổng Bí thư Đảng).", "B. Hồ Chí Minh.", "C. Võ Nguyên Giáp.", "D. Phạm Văn Đồng."], "answer": "A", "explain": "“Kháng chiến nhất định thắng lợi” (1947) của Tổng Bí thư Trường Chinh là văn kiện lý luận quan trọng, luận giải sâu sắc đường lối kháng chiến toàn dân, toàn diện, trường kỳ, tự lực cánh sinh, khẳng định niềm tin thắng lợi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cụm từ “lừng lẫy năm châu, chấn động địa cầu” dùng để nói về chiến thắng nào?", "options": ["A. Chiến thắng Việt Bắc 1947.", "B. Chiến thắng Điện Biên Phủ 1954.", "C. Chiến thắng Biên giới 1950.", "D. Đại thắng mùa Xuân 1975."], "answer": "B", "explain": "Chủ tịch Hồ Chí Minh đã đánh giá chiến thắng Điện Biên Phủ (7/5/1954) là “lừng lẫy năm châu, chấn động địa cầu” — thắng lợi quân sự lớn nhất của ta trong kháng chiến chống Pháp, giáng đòn quyết định vào chủ nghĩa thực dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khẩu hiệu “Quyết tử để Tổ quốc quyết sinh” gắn với đơn vị anh hùng nào trong những ngày đầu toàn quốc kháng chiến?", "options": ["A. Đại đoàn 308.", "B. Trung đoàn 36.", "C. Trung đoàn Thủ Đô (bảo vệ Hà Nội 60 ngày đêm, cuối 1946 – đầu 1947).", "D. Sư đoàn 312."], "answer": "C", "explain": "Với khẩu hiệu “Quyết tử để Tổ quốc quyết sinh”, Trung đoàn Thủ Đô đã anh dũng chiến đấu, giam chân 6.500 quân Pháp tinh nhuệ ở Hà Nội suốt 60 ngày đêm (19/12/1946 – 17/2/1947), tạo điều kiện cho cả nước chuyển vào kháng chiến lâu dài.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cầu Hiền Lương bắc qua sông Bến Hải (Quảng Trị) là biểu tượng của điều gì?", "options": ["A. Giới tuyến quân sự tạm thời ở vĩ tuyến 17 chia cắt hai miền Nam – Bắc theo Hiệp định Genève.", "B. Biên giới Việt – Trung.", "C. Biên giới Việt – Lào.", "D. Thủ đô Hà Nội."], "answer": "A", "explain": "Cầu Hiền Lương trên sông Bến Hải là điểm nối hai miền tại vĩ tuyến 17 — giới tuyến quân sự tạm thời theo Genève (1954); cây cầu trở thành biểu tượng của nỗi đau chia cắt và khát vọng thống nhất đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tờ báo “Người cùng khổ” (Le Paria) là cơ quan ngôn luận của tổ chức nào do Nguyễn Ái Quốc sáng lập?", "options": ["A. Đảng Cộng sản Pháp.", "B. Hội Liên hiệp thuộc địa (1921, tại Paris).", "C. Mặt trận Việt Minh.", "D. Hội Việt Nam Cách mạng Thanh niên."], "answer": "B", "explain": "Báo “Người cùng khổ” (Le Paria, 1922) là cơ quan ngôn luận của Hội Liên hiệp thuộc địa do Nguyễn Ái Quốc sáng lập tại Paris — diễn đàn tố cáo chủ nghĩa thực dân, thức tỉnh các dân tộc thuộc địa, chuẩn bị dư luận cho cách mạng Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Báo “Thanh Niên” (ra số đầu ngày 21/6/1925) là cơ quan ngôn luận của tổ chức nào?", "options": ["A. Việt Nam Quốc dân Đảng.", "B. Đông Dương Cộng sản đảng.", "C. Hội Việt Nam Cách mạng Thanh niên.", "D. Tân Việt Cách mạng Đảng."], "answer": "C", "explain": "Báo “Thanh Niên” (21/6/1925) là cơ quan ngôn luận của Hội Việt Nam Cách mạng Thanh niên, do Nguyễn Ái Quốc sáng lập — tờ báo cách mạng đầu tiên của Việt Nam, truyền bá chủ nghĩa Mác – Lênin; ngày 21/6 hằng năm là Ngày Báo chí cách mạng Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa của phong trào lập “hũ gạo cứu đói” (1945–1946) là gì?", "options": ["A. Chỉ mang tính hình thức.", "B. Không có tác dụng.", "C. Làm giàu cho cán bộ.", "D. Thể hiện tinh thần “lá lành đùm lá rách”, sức mạnh đoàn kết toàn dân tộc, góp phần đẩy lùi nạn đói, củng cố niềm tin của nhân dân vào chính quyền cách mạng."], "answer": "D", "explain": "“Hũ gạo cứu đói” thể hiện truyền thống tương thân tương ái, sức mạnh đại đoàn kết dân tộc; cùng với tăng gia sản xuất, phong trào góp phần đẩy lùi nạn đói năm 1945, ổn định đời sống, củng cố chính quyền cách mạng non trẻ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Đảng và Chính phủ quyết tâm diệt “giặc dốt” ngay sau Cách mạng tháng Tám?", "options": ["A. Vì muốn mọi người đều biết chữ để xây dựng đời sống mới, tham gia cách mạng; nạn mù chữ là di sản của chế độ thực dân, phong kiến (95% dân số mù chữ).", "B. Vì muốn cấm học chữ Pháp.", "C. Vì muốn đóng cửa trường học.", "D. Vì thiếu giáo viên."], "answer": "A", "explain": "Chế độ cũ để lại 95% dân số mù chữ; diệt “giặc dốt” là nhiệm vụ cấp bách để nâng cao dân trí, bồi dưỡng công dân mới, tạo nguồn nhân lực cho kháng chiến, kiến quốc — “một dân tộc dốt là một dân tộc yếu”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài học về sách lược ngoại giao được rút ra từ giai đoạn 1945–1946 là gì?", "options": ["A. Cứng rắn trong mọi tình huống.", "B. Mềm dẻo, linh hoạt, “dĩ bất biến, ứng vạn biến”: lợi dụng mâu thuẫn kẻ thù, phân hóa, cô lập từng kẻ thù, tranh thủ thời gian chuẩn bị lực lượng.", "C. Cô lập với thế giới.", "D. Nhân nhượng vô nguyên tắc."], "answer": "B", "explain": "Bài học 1945–1946: trong tình thế “ngàn cân treo sợi tóc”, Đảng thực hiện sách lược khôn khéo — hòa hoãn với Tưởng để đánh Pháp, hòa với Pháp để đuổi Tưởng; nhân nhượng có nguyên tắc, tranh thủ từng phút hòa hoãn để chuẩn bị kháng chiến lâu dài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tinh thần “Quyết tử để Tổ quốc quyết sinh” của Trung đoàn Thủ Đô (1946–1947) thể hiện điều gì?", "options": ["A. Tinh thần cầu hòa.", "B. Tinh thần đầu hàng.", "C. Tinh thần rút lui.", "D. Tinh thần chiến đấu anh dũng, sẵn sàng hy sinh vì độc lập, tự do của Tổ quốc, hoàn thành xuất sắc nhiệm vụ giam chân địch ở Hà Nội 60 ngày đêm."], "answer": "D", "explain": "Trung đoàn Thủ Đô với tinh thần “Quyết tử để Tổ quốc quyết sinh” đã chiến đấu ngoan cường từng góc phố, giam chân 6.500 quân Pháp tinh nhuệ suốt 60 ngày đêm, tạo điều kiện cho cả nước chuyển vào kháng chiến lâu dài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cầu Hiền Lương – sông Bến Hải trở thành biểu tượng của khát vọng thống nhất đất nước?", "options": ["A. Vì đây là nơi chia cắt hai miền suốt 21 năm (1954–1975), chứng kiến nỗi đau chia ly và ý chí thống nhất mãnh liệt của dân tộc; sau 1975 cầu được nối lại.", "B. Vì cầu dài nhất Việt Nam.", "C. Vì cầu đẹp.", "D. Vì cầu do Pháp xây."], "answer": "A", "explain": "Suốt 21 năm, vĩ tuyến 17 với cầu Hiền Lương là lằn ranh chia cắt; nhân dân hai miền ngày đêm hướng về nhau với khát vọng thống nhất cháy bỏng — cây cầu trở thành biểu tượng thiêng liêng của ý chí “không có gì quý hơn độc lập, tự do, thống nhất Tổ quốc”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nói bất hủ “Không có gì quý hơn độc lập, tự do” của Chủ tịch Hồ Chí Minh được nêu trong văn kiện nào?", "options": ["A. Tuyên ngôn độc lập (1945).", "B. Lời kêu gọi chống Mỹ, cứu nước (17/7/1966).", "C. Di chúc (1969).", "D. Lời kêu gọi toàn quốc kháng chiến (1946)."], "answer": "B", "explain": "Ngày 17/7/1966, trong Lời kêu gọi chống Mỹ, cứu nước, Chủ tịch Hồ Chí Minh khẳng định: “Không có gì quý hơn độc lập, tự do” — thể hiện quyết tâm sắt đá của dân tộc: dù phải hy sinh gian khổ, cũng quyết giành độc lập, thống nhất đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bản Di chúc của Chủ tịch Hồ Chí Minh được công bố vào năm nào?", "options": ["A. Năm 1945.", "B. Năm 1975.", "C. Năm 1969 (sau khi Người qua đời ngày 2/9/1969).", "D. Năm 1986."], "answer": "C", "explain": "Chủ tịch Hồ Chí Minh qua đời ngày 2/9/1969; Di chúc của Người (viết 1965–1969) được công bố, là văn kiện lịch sử vô giá: căn dặn về đoàn kết Đảng, về sự nghiệp chống Mỹ, về xây dựng đất nước sau chiến tranh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa lịch sử của Hội nghị hợp nhất các tổ chức cộng sản (3/2/1930) là gì?", "options": ["A. Giải tán các tổ chức cộng sản.", "B. Phát động tổng khởi nghĩa ngay lập tức.", "C. Thành lập chính phủ lâm thời.", "D. Chấm dứt sự chia rẽ, thống nhất ba tổ chức cộng sản thành một Đảng duy nhất — Đảng Cộng sản Việt Nam, đội tiên phong lãnh đạo cách mạng."], "answer": "D", "explain": "Hội nghị hợp nhất (3 – 7/2/1930) dưới sự chủ trì của Nguyễn Ái Quốc đã thống nhất ba tổ chức cộng sản thành Đảng Cộng sản Việt Nam — chấm dứt tình trạng chia rẽ và khủng hoảng về giai cấp lãnh đạo, mở ra thời đại mới cho cách mạng Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đại hội VI của Đảng (12/1986) đã đề ra quan điểm quan trọng nào về đổi mới tư duy?", "options": ["A. “Nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật”.", "B. Đổ lỗi mọi khó khăn cho hoàn cảnh khách quan.", "C. Giữ nguyên tư duy kinh tế cũ.", "D. Che giấu khuyết điểm, né tránh sự thật."], "answer": "A", "explain": "Đại hội VI yêu cầu đổi mới tư duy, trước hết là tư duy kinh tế: dũng cảm “nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật”, từ bỏ tư duy chủ quan, nóng vội; xóa bỏ cơ chế tập trung quan liêu bao cấp, chuyển sang hạch toán kinh doanh xã hội chủ nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Nguyễn Ái Quốc khẳng định chỉ có con đường cách mạng vô sản mới giải phóng được dân tộc Việt Nam?", "options": ["A. Vì Người ghét các con đường khác.", "B. Vì Liên Xô ép buộc.", "C. Vì con đường phong kiến và tư sản ở Việt Nam (Cần Vương, Đông Du, Việt Nam Quốc dân Đảng) đều thất bại; chỉ có cách mạng vô sản theo chủ nghĩa Mác – Lênin (như Cách mạng tháng Mười Nga) mới triệt để giải phóng dân tộc gắn với giải phóng giai cấp.", "D. Vì ngẫu nhiên."], "answer": "C", "explain": "Sau khi khảo sát thực tiễn và nghiên cứu, Nguyễn Ái Quốc rút ra kết luận: các con đường cứu nước theo khuynh hướng phong kiến, dân chủ tư sản đều bế tắc; chỉ có con đường cách mạng vô sản — độc lập dân tộc gắn liền với chủ nghĩa xã hội — mới đưa cách mạng Việt Nam đến thắng lợi hoàn toàn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bài học về phát huy sức mạnh đại đoàn kết toàn dân tộc được thể hiện như thế nào trong giai đoạn 1945–1946?", "options": ["A. Chỉ đoàn kết trong Đảng.", "B. Không cần đoàn kết.", "C. Chỉ đoàn kết với nước ngoài.", "D. Đảng và Chính phủ thực hiện đại đoàn kết toàn dân: thành lập Chính phủ liên hiệp, Mặt trận Liên Việt, kêu gọi mọi tầng lớp (kể cả Việt kiều) đóng góp “Tuần lễ vàng”, diệt giặc đói, giặc dốt — tạo sức mạnh vượt qua tình thế “ngàn cân treo sợi tóc”."], "answer": "D", "explain": "Bài học: trong khó khăn, Đảng mở rộng khối đại đoàn kết toàn dân tộc (Chính phủ liên hiệp kháng chiến, Mặt trận Liên Việt 1951, chính sách đoàn kết tôn giáo, kiều bào); sức mạnh đoàn kết là nhân tố quyết định giúp chính quyền non trẻ đứng vững và trưởng thành.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vai trò của quần chúng nhân dân trong thắng lợi của Cách mạng tháng Tám 1945 được thể hiện như thế nào?", "options": ["A. Nhân dân là lực lượng quyết định: hàng triệu quần chúng (công nhân, nông dân, trí thức, các tầng lớp) dưới ngọn cờ Việt Minh nổi dậy giành chính quyền; “cách mạng là sự nghiệp của quần chúng”.", "B. Nhân dân chỉ đứng xem.", "C. Đảng lãnh đạo là đủ.", "D. Nhân dân không tham gia."], "answer": "A", "explain": "CMT8 là minh chứng sinh động: khi Đảng có đường lối đúng, hàng triệu quần chúng nhân dân — lực lượng chính trị hùng hậu — nổi dậy như “triều dâng thác đổ”, giành chính quyền nhanh gọn, ít đổ máu. Quần chúng là người làm nên lịch sử.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về tình hình đất nước sau Cách mạng tháng Tám 1945, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Sau Cách mạng tháng Tám, chính quyền cách mạng non trẻ chỉ phải đối mặt với khó khăn về kinh tế.", "b) Quân Trung Hoa Dân quốc kéo vào miền Bắc Việt Nam để giúp đỡ chính quyền cách mạng xây dựng đất nước.", "c) Để diệt “giặc đói”, Đảng và Chính phủ phát động phong trào tăng gia sản xuất, thực hành tiết kiệm, lập “hũ gạo cứu đói”.", "d) Trước tình thế “ngàn cân treo sợi tóc”, chính quyền cách mạng đã bó tay, không có biện pháp đối phó."], "answer": ["F", "F", "T", "F"], "explain": "a) Sai: khó khăn toàn diện — giặc đói, giặc dốt, giặc ngoại xâm (quân Tưởng, Pháp, Anh, Nhật), ngân quỹ trống rỗng, chính quyền non trẻ. b) Sai: quân Tưởng vào với danh nghĩa giải giáp quân Nhật nhưng thực chất âm mưu lật đổ chính quyền cách mạng, dung túng bọn phản động tay sai. c) Đúng: tăng gia sản xuất, tiết kiệm, “hũ gạo cứu đói” là những biện pháp thiết thực diệt “giặc đói”. d) Sai: Đảng và Chính phủ chủ động đối phó bằng nhiều biện pháp chính trị, kinh tế, ngoại giao khôn khéo (bầu cử Quốc hội, Hiến pháp, hòa hoãn với Pháp...).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về chính sách “dồn dân lập ấp chiến lược” của Mỹ – Diệm, xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Ấp chiến lược” là chính sách nhằm cải thiện đời sống vật chất cho nông dân miền Nam.", "b) Mỹ – Diệm thực hiện dồn dân lập “ấp chiến lược” hòng tách dân khỏi cách mạng, kiểm soát nông thôn miền Nam.", "c) Quân dân miền Nam đã đấu tranh phá “ấp chiến lược”, giành lại nông thôn trong phong trào Đồng Khởi và những năm sau đó.", "d) Chính sách “ấp chiến lược” đã thành công, giúp Mỹ bình định hoàn toàn nông thôn miền Nam."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: “ấp chiến lược” là thủ đoạn thâm độc trong “Chiến tranh đặc biệt”, dồn dân vào khu vực kiểm soát, tách khỏi cách mạng — không vì đời sống dân. b) Đúng: đây là “xương sống” của “Chiến tranh đặc biệt” ở nông thôn. c) Đúng: phong trào phá ấp chiến lược lan rộng, đặc biệt sau Đồng Khởi (1960). d) Sai: “ấp chiến lược” bị phá sản trước phong trào đấu tranh của nhân dân.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về kỳ họp thứ nhất Quốc hội khóa VI (24/6 – 3/7/1976), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Kỳ họp quyết định tên nước là Cộng hòa Xã hội chủ nghĩa Việt Nam.", "b) Kỳ họp quyết định thủ đô là Hà Nội và đổi tên thành phố Sài Gòn – Gia Định thành Thành phố Hồ Chí Minh.", "c) Kỳ họp quyết định sáng tác mới hoàn toàn Quốc huy và Quốc ca.", "d) Những quyết định của kỳ họp thể hiện ý chí thống nhất đất nước của toàn dân tộc Việt Nam."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: ngày 2/7/1976, Quốc hội quyết định tên nước là Cộng hòa Xã hội chủ nghĩa Việt Nam. b) Đúng: thủ đô là Hà Nội; thành phố Sài Gòn – Gia Định được đổi tên thành Thành phố Hồ Chí Minh để đời đời ghi nhớ công ơn của Bác Hồ. c) Sai: Quốc hội quyết định giữ nguyên Quốc huy và Quốc ca “Tiến quân ca” của nước Việt Nam Dân chủ Cộng hòa. d) Đúng: các quyết định hoàn thành thống nhất đất nước về mặt nhà nước, đáp ứng nguyện vọng tha thiết của toàn dân tộc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về hội nhập quốc tế của Việt Nam thời kỳ đổi mới, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Việt Nam chủ trương chủ động, tích cực hội nhập quốc tế toàn diện, sâu rộng.", "b) Hội nhập quốc tế chỉ mang lại lợi ích kinh tế, không tác động đến văn hóa – xã hội.", "c) Việt Nam từ chối tham gia các tổ chức quốc tế để bảo vệ độc lập, tự chủ.", "d) Hội nhập quốc tế giúp Việt Nam nâng cao vị thế, tranh thủ nguồn lực bên ngoài phục vụ phát triển đất nước."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: đây là chủ trương nhất quán của Đảng trong thời kỳ đổi mới. b) Sai: hội nhập tác động toàn diện — vừa tạo thời cơ, vừa đặt ra thách thức trên nhiều lĩnh vực, trong đó có văn hóa – xã hội. c) Sai: Việt Nam tích cực tham gia LHQ, ASEAN, APEC, WTO và nhiều tổ chức quốc tế. d) Đúng: hội nhập góp phần nâng cao vị thế, thu hút đầu tư, công nghệ, mở rộng thị trường.", "points": 1}]}]}</script>
