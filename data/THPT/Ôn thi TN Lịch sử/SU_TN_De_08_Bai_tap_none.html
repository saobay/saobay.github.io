<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Chiến dịch Hồ Chí Minh giải phóng Sài Gòn diễn ra trong thời gian nào?", "options": ["A. Từ ngày 4 đến 24/3/1975.", "B. Từ ngày 26 đến 30/4/1975.", "C. Từ ngày 21 đến 29/3/1975.", "D. Từ ngày 13/3 đến 7/5/1954."], "answer": "B", "explain": "Chiến dịch Hồ Chí Minh — chiến dịch quyết chiến chiến lược — diễn ra từ 26/4 đến trưa 30/4/1975 với 5 cánh quân tiến vào Sài Gòn, giải phóng hoàn toàn thành phố, kết thúc chiến tranh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trưa ngày 30/4/1975, ai đã tuyên bố đầu hàng vô điều kiện, chấm dứt chế độ Sài Gòn?", "options": ["A. Nguyễn Văn Thiệu.", "B. Ngô Đình Diệm.", "C. Dương Văn Minh.", "D. Nguyễn Khánh."], "answer": "C", "explain": "Trưa 30/4/1975, Tổng thống chính quyền Sài Gòn Dương Văn Minh tuyên bố đầu hàng vô điều kiện; cờ giải phóng tung bay trên nóc Dinh Độc Lập lúc 11 giờ 30 phút, chế độ Sài Gòn sụp đổ hoàn toàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sự kiện nào đánh dấu giờ phút thiêng liêng kết thúc chiến tranh, non sông thu về một mối?", "options": ["A. Ký Hiệp định Paris.", "B. Ký Hiệp định Genève.", "C. Tổng tuyển cử 1976.", "D. Cờ giải phóng tung bay trên nóc Dinh Độc Lập lúc 11 giờ 30 phút ngày 30/4/1975."], "answer": "D", "explain": "11 giờ 30 phút ngày 30/4/1975, lá cờ của Mặt trận Dân tộc Giải phóng tung bay trên nóc Dinh Độc Lập — giờ phút thiêng liêng đánh dấu miền Nam hoàn toàn giải phóng, đất nước thống nhất, non sông thu về một mối.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khẩu hiệu “Đánh cho Mỹ cút, đánh cho Ngụy nhào” thể hiện quyết tâm chiến lược nào của nhân dân Việt Nam?", "options": ["A. Đánh bại hoàn toàn quân viễn chinh Mỹ và làm sụp đổ chính quyền tay sai Sài Gòn, giành độc lập, thống nhất đất nước.", "B. Đàm phán hòa bình với Mỹ.", "C. Chia cắt lâu dài đất nước.", "D. Rút quân về miền Bắc."], "answer": "A", "explain": "Khẩu hiệu “Đánh cho Mỹ cút, đánh cho Ngụy nhào” (theo tư tưởng Hồ Chí Minh) thể hiện quyết tâm chiến lược: đánh bại ý chí xâm lược của Mỹ, làm sụp đổ ngụy quân, ngụy quyền, hoàn thành sự nghiệp giải phóng miền Nam, thống nhất Tổ quốc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lá cờ của Mặt trận Dân tộc Giải phóng miền Nam Việt Nam có đặc điểm nào?", "options": ["A. Nền đỏ, sao vàng năm cánh.", "B. Nền vàng, ba sọc đỏ.", "C. Nửa trên đỏ, nửa dưới xanh, giữa có ngôi sao vàng năm cánh.", "D. Nền xanh, sao trắng."], "answer": "C", "explain": "Cờ của Mặt trận Dân tộc Giải phóng miền Nam Việt Nam: nửa trên màu đỏ, nửa dưới màu xanh dương, giữa có ngôi sao vàng năm cánh — tượng trưng cho hai miền Nam – Bắc cùng chung một dân tộc, quyết tâm thống nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến dịch Đường 9 – Nam Lào (1971) của quân dân Việt Nam nhằm đập tan cuộc hành quân nào của địch?", "options": ["A. Hành quân “Junction City”.", "B. Hành quân “Cedar Falls”.", "C. Hành quân “Attleboro”.", "D. Hành quân “Lam Sơn 719”."], "answer": "D", "explain": "Đầu 1971, Mỹ – Ngụy mở cuộc hành quân “Lam Sơn 719” đánh ra đường 9 – Nam Lào hòng cắt đứt tuyến chi viện chiến lược Trường Sơn của ta; chiến dịch phản công Đường 9 – Nam Lào (30/1 – 23/3/1971) đập tan cuộc hành quân, bảo vệ vững chắc hành lang vận chuyển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong chiến dịch “Điện Biên Phủ trên không” (12/1972), quân dân miền Bắc đã bắn rơi bao nhiêu máy bay B-52 của Mỹ?", "options": ["A. 34 chiếc B-52 (trong tổng số 81 máy bay các loại).", "B. 10 chiếc.", "C. 100 chiếc.", "D. 5 chiếc."], "answer": "A", "explain": "Trong 12 ngày đêm (18 – 29/12/1972), quân dân miền Bắc bắn rơi 81 máy bay Mỹ, trong đó có 34 B-52 — “pháo đài bay” bất khả xâm phạm — làm nên chiến thắng “Điện Biên Phủ trên không”, buộc Mỹ phải ký Hiệp định Paris.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiệp định Paris (1973), Hoa Kỳ phải rút hết quân đội khỏi miền Nam Việt Nam trong thời hạn bao lâu?", "options": ["A. 6 tháng.", "B. 60 ngày.", "C. 1 năm.", "D. 2 năm."], "answer": "B", "explain": "Hiệp định Paris quy định: trong vòng 60 ngày kể từ khi ký kết, Hoa Kỳ và quân đội các nước ngoài phải rút hết khỏi miền Nam Việt Nam; các bên trao trả tù binh, thực hiện ngừng bắn tại chỗ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tên nước Cộng hòa Xã hội chủ nghĩa Việt Nam được Quốc hội quyết định vào ngày nào?", "options": ["A. Ngày 2/9/1945.", "B. Ngày 30/4/1975.", "C. Ngày 2/7/1976 (kỳ họp thứ nhất Quốc hội khóa VI).", "D. Ngày 25/4/1976."], "answer": "C", "explain": "Ngày 2/7/1976, kỳ họp thứ nhất Quốc hội khóa VI quyết định: tên nước là Cộng hòa Xã hội chủ nghĩa Việt Nam; thủ đô là Hà Nội; Quốc huy, Quốc ca giữ nguyên; thành phố Sài Gòn – Gia Định đổi tên thành Thành phố Hồ Chí Minh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quốc huy và Quốc ca của nước Việt Nam thống nhất được quyết định như thế nào tại kỳ họp Quốc hội khóa VI (1976)?", "options": ["A. Sáng tác mới hoàn toàn.", "B. Dùng của chính quyền Sài Gòn.", "C. Dùng của nước ngoài.", "D. Quốc huy và Quốc ca của nước Việt Nam Dân chủ Cộng hòa được giữ nguyên làm Quốc huy, Quốc ca của nước Cộng hòa Xã hội chủ nghĩa Việt Nam."], "answer": "D", "explain": "Quốc hội khóa VI (1976) quyết định giữ nguyên Quốc huy (ngôi sao vàng trên nền đỏ, bông lúa) và Quốc ca “Tiến quân ca” của nước Việt Nam Dân chủ Cộng hòa làm biểu tượng của nước Việt Nam thống nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiếu Cần Vương được ban bố vào ngày nào, kêu gọi điều gì?", "options": ["A. Ngày 5/7/1885, kêu gọi đầu hàng Pháp.", "B. Ngày 13/7/1885, kêu gọi văn thân, sĩ phu và nhân dân đứng lên giúp vua cứu nước.", "C. Ngày 2/9/1945, tuyên bố độc lập.", "D. Ngày 3/2/1930, thành lập Đảng."], "answer": "B", "explain": "Sau sự biến kinh thành Huế (5/7/1885), ngày 13/7/1885 vua Hàm Nghi xuống Chiếu Cần Vương tại Tân Sở (Quảng Trị), kêu gọi văn thân, sĩ phu và nhân dân cả nước đứng lên “cần vương” cứu nước, mở đầu phong trào Cần Vương (1885–1896).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc khởi nghĩa Ba Đình (1886–1887) do ai lãnh đạo?", "options": ["A. Phan Đình Phùng.", "B. Hoàng Hoa Thám.", "C. Đinh Công Tráng (cùng Nguyễn Đôn Tiết, Phạm Bành...).", "D. Tôn Thất Thuyết."], "answer": "C", "explain": "Khởi nghĩa Ba Đình (1886–1887, Nga Sơn, Thanh Hóa) do Đinh Công Tráng lãnh đạo, xây dựng căn cứ Ba Đình thành chiến lũy kiên cố; là một trong những cuộc khởi nghĩa tiêu biểu của phong trào Cần Vương chống Pháp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa lịch sử của chiến dịch Hồ Chí Minh (4/1975) là gì?", "options": ["A. Mở đầu cuộc kháng chiến chống Mỹ.", "B. Buộc Mỹ phải đàm phán.", "C. Giải phóng một phần miền Nam.", "D. Là đòn quyết chiến chiến lược, giải phóng hoàn toàn Sài Gòn – Gia Định, kết thúc thắng lợi cuộc kháng chiến chống Mỹ, cứu nước; hoàn thành cách mạng dân tộc dân chủ nhân dân trong cả nước."], "answer": "D", "explain": "Chiến dịch Hồ Chí Minh toàn thắng (30/4/1975) đập tan toàn bộ quân Ngụy, sụp đổ chính quyền Sài Gòn, kết thúc 21 năm kháng chiến chống Mỹ; hoàn thành cách mạng dân tộc dân chủ nhân dân trong cả nước, mở ra kỷ nguyên độc lập, thống nhất và đi lên chủ nghĩa xã hội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao quân dân Việt Nam mở chiến dịch Đường 9 – Nam Lào (1971)?", "options": ["A. Để đập tan cuộc hành quân “Lam Sơn 719” của Mỹ – Ngụy hòng cắt đứt tuyến chi viện chiến lược Trường Sơn, bảo vệ hành lang vận chuyển vào miền Nam.", "B. Để đàm phán với Mỹ.", "C. Để rút quân về miền Bắc.", "D. Để mở rộng chiến tranh."], "answer": "A", "explain": "Đầu 1971, Mỹ – Ngụy mở “Lam Sơn 719” đánh ra đường 9 – Nam Lào nhằm “bẻ gãy” tuyến Trường Sơn; chiến dịch phản công Đường 9 – Nam Lào của ta (30/1 – 23/3/1971) đập tan cuộc hành quân, bảo vệ vững chắc tuyến chi viện chiến lược.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thắng lợi “Điện Biên Phủ trên không” (12/1972) có tác động nào đến đàm phán Paris?", "options": ["A. Không ảnh hưởng gì.", "B. Buộc Mỹ phải trở lại bàn đàm phán, chấp nhận ký Hiệp định Paris theo đúng dự thảo đã thỏa thuận (10/1972).", "C. Làm đàm phán đổ vỡ.", "D. Buộc ta phải nhượng bộ."], "answer": "B", "explain": "Thất bại thảm hại trong cuộc tập kích B-52 (mất 34 B-52) buộc Nixon phải tuyên bố ngừng ném bom miền Bắc, trở lại bàn đàm phán; ngày 27/1/1973 Mỹ phải ký Hiệp định Paris — thắng lợi của nghệ thuật “vừa đánh vừa đàm”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điều khoản “các bên để nguyên vị trí đóng quân” trong Hiệp định Paris (1973) có lợi cho bên nào?", "options": ["A. Có lợi cho chính quyền Sài Gòn.", "B. Có lợi cho Hoa Kỳ.", "C. Có lợi cho cách mạng: ta được giữ vững vùng giải phóng rộng lớn, tạo thế và lực mới để tiến lên giải phóng hoàn toàn miền Nam.", "D. Không có lợi cho bên nào."], "answer": "C", "explain": "Ngừng bắn tại chỗ, giữ nguyên vị trí giúp ta bảo vệ vùng giải phóng (chiếm phần lớn nông thôn miền Nam), củng cố chính quyền cách mạng, chuẩn bị lực lượng; trong khi Mỹ rút quân, Ngụy mất chỗ dựa — so sánh lực lượng thay đổi có lợi cho ta.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc đổi tên thành phố Sài Gòn – Gia Định thành Thành phố Hồ Chí Minh (1976) có ý nghĩa nào?", "options": ["A. Thể hiện lòng biết ơn, tôn vinh công lao vĩ đại của Chủ tịch Hồ Chí Minh — người sáng lập, lãnh đạo cách mạng Việt Nam.", "B. Xóa bỏ lịch sử thành phố.", "C. Theo yêu cầu của nước ngoài.", "D. Chỉ là thay đổi hành chính."], "answer": "A", "explain": "Quốc hội khóa VI (2/7/1976) quyết định đổi tên thành phố Sài Gòn – Gia Định thành Thành phố Hồ Chí Minh để đời đời ghi nhớ công ơn của Người đối với dân tộc — thành phố mang tên Bác, nơi Người ra đi tìm đường cứu nước (1911).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đường lối đối ngoại của Việt Nam thời kỳ đổi mới được thể hiện qua phương châm nào?", "options": ["A. “Đóng cửa, tự cấp”.", "B. “Độc lập, tự chủ, hòa bình, hợp tác và phát triển; đa phương hóa, đa dạng hóa quan hệ đối ngoại”.", "C. “Liên minh quân sự”.", "D. “Chỉ quan hệ với các nước lớn”."], "answer": "B", "explain": "Đổi mới đối ngoại: độc lập, tự chủ, hòa bình, hữu nghị, hợp tác và phát triển; đa phương hóa, đa dạng hóa; “là bạn, là đối tác tin cậy của cộng đồng quốc tế” — đưa Việt Nam hội nhập sâu rộng, nâng cao vị thế đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việt Nam gia nhập Diễn đàn Hợp tác Kinh tế châu Á – Thái Bình Dương (APEC) vào năm nào?", "options": ["A. Năm 1995.", "B. Năm 2007.", "C. Năm 1998.", "D. Năm 1977."], "answer": "C", "explain": "Tháng 11/1998, Việt Nam chính thức gia nhập APEC; năm 2006 và 2017 Việt Nam đăng cai tổ chức thành công Hội nghị cấp cao APEC, khẳng định vị thế trong hợp tác kinh tế khu vực châu Á – Thái Bình Dương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việt Nam là thành viên thứ bao nhiêu của Tổ chức Thương mại Thế giới (WTO)?", "options": ["A. Thứ 7.", "B. Thứ 149.", "C. Thứ 100.", "D. Thứ 150."], "answer": "D", "explain": "Ngày 11/1/2007, Việt Nam trở thành thành viên thứ 150 của WTO sau 11 năm đàm phán, đánh dấu bước hội nhập sâu rộng vào nền kinh tế toàn cầu, mở ra cơ hội và thách thức mới cho phát triển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phong trào Cần Vương (1885–1896) thất bại?", "options": ["A. Vì thiếu đường lối cách mạng đúng đắn, thiếu giai cấp lãnh đạo tiên tiến; khuynh hướng phong kiến đã lỗi thời trước nhiệm vụ giải phóng dân tộc.", "B. Vì Pháp quá yếu.", "C. Vì được nước ngoài giúp đỡ nhiều.", "D. Vì nhân dân không ủng hộ."], "answer": "A", "explain": "Cần Vương thất bại vì ngọn cờ phong kiến không còn đủ sức tập hợp lực lượng; thiếu đường lối đúng đắn và giai cấp lãnh đạo tiên tiến; các cuộc khởi nghĩa còn lẻ tẻ, thiếu liên kết — đặt ra yêu cầu phải có con đường cứu nước mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc Nguyễn Tất Thành ra đi tìm đường cứu nước (5/6/1911) có ý nghĩa nào?", "options": ["A. Chỉ là chuyến đi cá nhân.", "B. Mở đầu hành trình tìm chân lý cứu nước, dẫn đến việc Người tiếp thu chủ nghĩa Mác – Lênin, tìm ra con đường cứu nước đúng đắn cho dân tộc Việt Nam.", "C. Làm Pháp lo sợ.", "D. Không ảnh hưởng đến cách mạng."], "answer": "B", "explain": "Ra đi tìm đường cứu nước (1911), Nguyễn Tất Thành khảo sát thực tiễn nhiều nước, đến với chủ nghĩa Mác – Lênin (1920), khẳng định con đường cách mạng vô sản — chấm dứt khủng hoảng về đường lối cứu nước, mở ra thời đại mới cho dân tộc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bài học về xây dựng lực lượng vũ trang nhân dân được rút ra từ cách mạng Việt Nam (1945–1975) là gì?", "options": ["A. Chỉ cần xây dựng quân đội chính quy.", "B. Thuê quân đội nước ngoài.", "C. Không cần lực lượng vũ trang.", "D. Xây dựng lực lượng vũ trang nhân dân gồm ba thứ quân (bộ đội chủ lực, bộ đội địa phương, dân quân tự vệ), đặt dưới sự lãnh đạo tuyệt đối của Đảng; kết hợp chặt chẽ giữa đấu tranh quân sự với đấu tranh chính trị."], "answer": "D", "explain": "Bài học: xây dựng lực lượng vũ trang ba thứ quân làm nòng cốt cho toàn dân đánh giặc; Đảng lãnh đạo tuyệt đối, trực tiếp về mọi mặt; kết hợp quân sự với chính trị, binh vận — tạo nên sức mạnh tổng hợp, đánh thắng các đế quốc hùng mạnh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao nói đại thắng mùa Xuân 1975 là thắng lợi của “sức mạnh tổng hợp”?", "options": ["A. Vì thắng lợi là kết tinh của sức mạnh đại đoàn kết toàn dân tộc, sức mạnh của đường lối đúng đắn, nghệ thuật quân sự sáng tạo và sự ủng hộ, giúp đỡ của bạn bè quốc tế.", "B. Vì chỉ có sự giúp đỡ quốc tế.", "C. Vì chỉ nhờ vũ khí hiện đại.", "D. Vì chỉ có sức mạnh quân sự."], "answer": "A", "explain": "Đại thắng 1975 là thắng lợi của sức mạnh tổng hợp: đường lối cách mạng đúng đắn của Đảng; sức mạnh đại đoàn kết toàn dân; nghệ thuật quân sự “thần tốc, táo bạo”; sự chi viện của hậu phương miền Bắc và sự đồng tình, ủng hộ của nhân dân tiến bộ thế giới.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về chiến dịch Hồ Chí Minh (1975), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Chiến dịch Hồ Chí Minh là chiến dịch mở màn của cuộc Tổng tiến công và nổi dậy mùa Xuân 1975.", "b) Mệnh lệnh “Thần tốc, táo bạo, bất ngờ, chắc thắng” được Đại tướng Võ Nguyên Giáp ban bố trong chiến dịch Tây Nguyên.", "c) Trưa 30/4/1975, cờ giải phóng tung bay trên nóc Dinh Độc Lập, Sài Gòn được giải phóng.", "d) Chiến dịch Hồ Chí Minh toàn thắng đã kết thúc thắng lợi cuộc kháng chiến chống Mỹ, cứu nước của nhân dân Việt Nam."], "answer": ["F", "F", "T", "T"], "explain": "a) Sai: chiến dịch Hồ Chí Minh (26 – 30/4/1975) là chiến dịch kết thúc; mở màn là chiến dịch Tây Nguyên (4/3/1975). b) Sai: mệnh lệnh “Thần tốc...” được ban bố ngày 7/4/1975 cho chiến dịch giải phóng Sài Gòn (chiến dịch Hồ Chí Minh). c) Đúng: 11 giờ 30 phút 30/4/1975, xe tăng quân giải phóng tiến vào Dinh Độc Lập. d) Đúng: chiến dịch toàn thắng kết thúc 21 năm kháng chiến chống Mỹ, hoàn thành cách mạng dân tộc dân chủ nhân dân trong cả nước.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về cuộc đàm phán tại Hội nghị Paris (1968–1973), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hội nghị Paris về Việt Nam chỉ có hai bên tham dự là Việt Nam Dân chủ Cộng hòa và Hoa Kỳ.", "b) Cuộc đàm phán Paris kéo dài 4 năm 8 tháng, là một trong những cuộc đàm phán dài nhất trong lịch sử ngoại giao Việt Nam.", "c) Lập trường nhất quán của ta tại Paris là Hoa Kỳ phải rút hết quân, tôn trọng độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam.", "d) Hiệp định Paris được ký kết ngay sau chiến thắng Điện Biên Phủ năm 1954."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: Hội nghị Paris gồm bốn bên: VNDCCH, Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam, Hoa Kỳ và Việt Nam Cộng hòa. b) Đúng: từ 13/5/1968 đến 27/1/1973 với hơn 200 phiên họp công khai. c) Đúng: đây là lập trường cơ bản, nhất quán của đoàn Việt Nam. d) Sai: Hiệp định Paris ký ngày 27/1/1973, sau thắng lợi “Điện Biên Phủ trên không” (12/1972), không liên quan đến Điện Biên Phủ 1954.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về việc Việt Nam gia nhập Liên hợp quốc (1977), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Việt Nam chính thức trở thành thành viên Liên hợp quốc ngày 20/9/1977.", "b) Việc gia nhập LHQ đánh dấu sự công nhận của cộng đồng quốc tế đối với nước Việt Nam thống nhất, độc lập, có chủ quyền.", "c) Việt Nam là một trong 50 nước sáng lập Liên hợp quốc năm 1945.", "d) Sau khi gia nhập LHQ, Việt Nam không tham gia bất kỳ hoạt động nào của tổ chức này."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: 20/9/1977, Việt Nam trở thành thành viên thứ 149 của LHQ. b) Đúng: đây là sự ghi nhận của cộng đồng quốc tế về vị thế của nước Việt Nam thống nhất. c) Sai: Việt Nam gia nhập năm 1977, không phải nước sáng lập (1945). d) Sai: Việt Nam là thành viên tích cực: Ủy viên không thường trực HĐBA (2008 – 2009, 2020 – 2021), tham gia gìn giữ hòa bình LHQ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về thành tựu của công cuộc đổi mới ở Việt Nam, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Sau đổi mới, Việt Nam đã thoát khỏi khủng hoảng kinh tế – xã hội, kinh tế tăng trưởng khá liên tục.", "b) Đổi mới đã đưa Việt Nam trở thành nước công nghiệp phát triển ngay trong thập niên 90 của thế kỷ XX.", "c) Thành tựu của đổi mới chỉ giới hạn trong lĩnh vực kinh tế.", "d) Đời sống vật chất và tinh thần của nhân dân được cải thiện rõ rệt sau đổi mới."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: đổi mới đưa đất nước ra khỏi khủng hoảng, kinh tế tăng trưởng liên tục, vị thế quốc tế nâng cao. b) Sai: Việt Nam vẫn là nước đang phát triển, đang đẩy mạnh công nghiệp hóa, hiện đại hóa; chưa phải nước công nghiệp phát triển. c) Sai: thành tựu là toàn diện: chính trị ổn định, văn hóa – xã hội tiến bộ, quốc phòng – an ninh vững chắc, đối ngoại mở rộng. d) Đúng: thu nhập, y tế, giáo dục, đời sống văn hóa tinh thần của nhân dân được nâng lên rõ rệt.", "points": 1}]}]}</script>
