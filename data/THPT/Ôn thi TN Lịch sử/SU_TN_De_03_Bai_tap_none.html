<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung chính của Hiệp định Sơ bộ Việt – Pháp (6/3/1946) là gì?", "options": ["A. Pháp công nhận Việt Nam là một quốc gia tự do, có chính phủ, nghị viện, quân đội và tài chính riêng, nằm trong Liên bang Đông Dương thuộc Liên hiệp Pháp; Việt Nam đồng ý cho 15.000 quân Pháp ra Bắc thay quân Trung Hoa Dân quốc.", "B. Pháp công nhận nền độc lập hoàn toàn của Việt Nam.", "C. Việt Nam sáp nhập vào Liên hiệp Pháp.", "D. Pháp rút hết quân khỏi Đông Dương."], "answer": "A", "explain": "Hiệp định Sơ bộ (6/3/1946): Pháp công nhận Việt Nam là quốc gia tự do trong Liên bang Đông Dương thuộc Liên hiệp Pháp; ta đồng ý cho 15.000 quân Pháp ra miền Bắc thay thế quân Trung Hoa Dân quốc về nước — thể hiện sách lược “hòa để tiến”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bản Tạm ước Việt – Pháp được ký kết vào ngày nào?", "options": ["A. Ngày 6/3/1946.", "B. Ngày 14/9/1946.", "C. Ngày 19/12/1946.", "D. Ngày 2/9/1945."], "answer": "B", "explain": "Ngày 14/9/1946, Chủ tịch Hồ Chí Minh ký với Pháp bản Tạm ước, tiếp tục nhân nhượng một số quyền lợi kinh tế, văn hóa để có thêm thời gian hòa hoãn, củng cố lực lượng chuẩn bị kháng chiến lâu dài.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sau Cách mạng tháng Tám 1945, nước Việt Nam Dân chủ Cộng hòa phải đối mặt với tình thế khó khăn được ví như thế nào?", "options": ["A. “Thuận buồm xuôi gió”.", "B. “Vạn sự khởi đầu nan”.", "C. “Ngàn cân treo sợi tóc”.", "D. “Nước đến chân mới nhảy”."], "answer": "C", "explain": "Sau CMT8, chính quyền non trẻ đối mặt muôn vàn khó khăn: giặc đói, giặc dốt, giặc ngoại xâm (quân Tưởng, Pháp, Anh, Nhật), ngân quỹ trống rỗng — tình thế “ngàn cân treo sợi tóc”, đòi hỏi sách lược khôn khéo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc Tổng tuyển cử đầu tiên bầu Quốc hội khóa I của nước Việt Nam Dân chủ Cộng hòa diễn ra vào ngày nào?", "options": ["A. Ngày 6/1/1946.", "B. Ngày 2/9/1945.", "C. Ngày 19/8/1945.", "D. Ngày 25/4/1976."], "answer": "A", "explain": "Ngày 6/1/1946, cuộc Tổng tuyển cử bầu Quốc hội khóa I diễn ra trong cả nước với hơn 90% cử tri đi bỏ phiếu, thể hiện ý chí và nguyện vọng của nhân dân, củng cố chính quyền cách mạng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kế hoạch Nava (1953) của thực dân Pháp có nội dung cơ bản nào?", "options": ["A. Rút toàn bộ quân Pháp về nước.", "B. Tập trung binh lực, xây dựng lực lượng cơ động mạnh, giành lại thế chủ động trên chiến trường, kết thúc chiến tranh trong 18 tháng.", "C. Đàm phán hòa bình với Việt Nam.", "D. Trao trả độc lập hoàn toàn cho Đông Dương."], "answer": "B", "explain": "Kế hoạch Nava (5/1953) chủ trương trong 18 tháng giành lại thế chủ động: tăng quân, xây dựng khối cơ động mạnh, mở rộng ngụy quân, tiến công chiến lược — với Điện Biên Phủ là khâu chính, hòng kết thúc chiến tranh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiệp định Genève (1954), giới tuyến quân sự tạm thời chia Việt Nam thành hai miền là vĩ tuyến nào?", "options": ["A. Vĩ tuyến 20.", "B. Vĩ tuyến 13.", "C. Vĩ tuyến 17.", "D. Vĩ tuyến 10."], "answer": "C", "explain": "Hiệp định Genève quy định lấy vĩ tuyến 17 (sông Bến Hải, tỉnh Quảng Trị) làm giới tuyến quân sự tạm thời; hai bên thực hiện tập kết, chuyển quân và hiệp thương tổng tuyển cử thống nhất đất nước vào tháng 7/1956.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khẩu hiệu của cuộc cải cách ruộng đất ở miền Bắc (1953–1956) là gì?", "options": ["A. “Tấc đất, tấc vàng”.", "B. “Lấy sức ta mà giải phóng cho ta”.", "C. “Không có gì quý hơn độc lập, tự do”.", "D. “Người cày có ruộng”."], "answer": "D", "explain": "Cải cách ruộng đất (1953–1956) thực hiện khẩu hiệu “người cày có ruộng”: tịch thu ruộng đất của địa chủ chia cho nông dân, xóa bỏ giai cấp địa chủ phong kiến, đưa nông dân lên địa vị làm chủ nông thôn miền Bắc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kế hoạch 5 năm lần thứ nhất (1961–1965) ở miền Bắc Việt Nam có nhiệm vụ trọng tâm nào?", "options": ["A. Xây dựng bước đầu cơ sở vật chất – kỹ thuật của chủ nghĩa xã hội, tiếp tục cải tạo xã hội chủ nghĩa.", "B. Tiến hành cải cách ruộng đất.", "C. Tổng khởi nghĩa giành chính quyền.", "D. Ký hiệp định thương mại với Hoa Kỳ."], "answer": "A", "explain": "Kế hoạch 5 năm lần thứ nhất (1961–1965) nhằm xây dựng bước đầu cơ sở vật chất – kỹ thuật của chủ nghĩa xã hội, hoàn thành cải tạo xã hội chủ nghĩa, củng cố quốc phòng, chi viện cho miền Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đạo luật 10/59 của chính quyền Ngô Đình Diệm (ban hành ngày 6/5/1959) có nội dung thâm độc nào?", "options": ["A. Ân xá cho tù chính trị.", "B. Đặt những người cộng sản và người đấu tranh ngoài vòng pháp luật, lê máy chém đi khắp miền Nam.", "C. Cải cách ruộng đất ở miền Nam.", "D. Tổ chức tổng tuyển cử tự do."], "answer": "B", "explain": "Luật 10/59 (6/5/1959) đặt cộng sản ngoài vòng pháp luật, cho phép xử tử hình những người đấu tranh; Diệm lê máy chém khắp miền Nam, gây ra thời kỳ đen tối “trắng tay, trắng đất” cho cách mạng miền Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến lược “Việt Nam hóa chiến tranh” (1969–1973) là của đời Tổng thống Mỹ nào?", "options": ["A. Kennedy.", "B. Johnson.", "C. Eisenhower.", "D. Nixon."], "answer": "D", "explain": "Sau thất bại của “Chiến tranh cục bộ”, Tổng thống Nixon (lên nắm quyền 1969) đề ra chiến lược “Việt Nam hóa chiến tranh” (1969–1973): rút dần quân Mỹ, dùng người Việt đánh người Việt, tăng viện trợ cho quân đội Sài Gòn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến tranh thế giới thứ nhất diễn ra trong thời gian nào?", "options": ["A. Từ năm 1914 đến năm 1918.", "B. Từ năm 1939 đến năm 1945.", "C. Từ năm 1917 đến năm 1922.", "D. Từ năm 1905 đến năm 1907."], "answer": "A", "explain": "Chiến tranh thế giới thứ nhất (1914–1918) là cuộc chiến tranh đế quốc phi nghĩa giữa hai khối liên minh (Liên minh trung tâm và Hiệp ước), gây tổn thất nặng nề cho nhân loại, làm suy yếu chủ nghĩa tư bản và tạo điều kiện cho Cách mạng tháng Mười Nga.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phong trào Cần Vương (1885–1896) nổ ra dưới sự hưởng ứng của vị vua yêu nước nào?", "options": ["A. Vua Tự Đức.", "B. Vua Hàm Nghi.", "C. Vua Thành Thái.", "D. Vua Khải Định."], "answer": "B", "explain": "Sau sự biến kinh thành Huế (5/7/1885), Tôn Thất Thuyết đưa vua Hàm Nghi ra Tân Sở (Quảng Trị), xuống Chiếu Cần Vương (13/7/1885), kêu gọi văn thân, sĩ phu và nhân dân đứng lên giúp vua cứu nước, mở đầu phong trào Cần Vương (1885–1896).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Đảng và Chính phủ Việt Nam chủ trương ký Hiệp định Sơ bộ (6/3/1946) với Pháp?", "options": ["A. Vì muốn liên minh lâu dài với thực dân Pháp.", "B. Vì đã hoàn toàn tin tưởng vào thiện chí của Pháp.", "C. Để đẩy 20 vạn quân Trung Hoa Dân quốc về nước, tránh cùng lúc đối phó nhiều kẻ thù, có thêm thời gian hòa hoãn chuẩn bị lực lượng.", "D. Vì muốn Pháp giúp chống Nhật."], "answer": "C", "explain": "Đầu 1946, trên đất nước có nhiều kẻ thù: quân Tưởng ở miền Bắc, quân Pháp, Anh ở miền Nam. Ký Sơ bộ với Pháp để đẩy quân Tưởng về nước, tránh đối phó nhiều kẻ thù cùng lúc, tranh thủ hòa hoãn chuẩn bị kháng chiến — sách lược “hòa để tiến” khôn khéo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa chiến lược của cuộc tiến công Đông – Xuân 1953–1954 là gì?", "options": ["A. Giải phóng hoàn toàn miền Bắc.", "B. Kết thúc chiến tranh ở Đông Dương.", "C. Buộc Mỹ phải rút quân khỏi Việt Nam.", "D. Buộc Pháp phải phân tán lực lượng đối phó trên nhiều hướng, bước đầu làm phá sản kế hoạch Nava, tạo điều kiện cho chiến dịch Điện Biên Phủ."], "answer": "D", "explain": "Đông – Xuân 1953–1954, ta mở nhiều hướng tiến công (Tây Bắc, Trung Lào, Thượng Lào, Bắc Tây Nguyên...), buộc Nava phải phân tán lực lượng thành 5 nơi, làm phá sản bước đầu kế hoạch Nava, tạo thế thuận lợi để ta mở chiến dịch quyết chiến Điện Biên Phủ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạn chế lớn nhất của Hiệp định Genève (1954) đối với cách mạng Việt Nam là gì?", "options": ["A. Đất nước tạm thời bị chia cắt thành hai miền, Mỹ và chính quyền Sài Gòn phá hoại hiệp định, không thực hiện tổng tuyển cử thống nhất đất nước (7/1956).", "B. Pháp được ở lại miền Nam.", "C. Việt Nam mất hoàn toàn độc lập.", "D. Quân đội ta phải giải tán."], "answer": "A", "explain": "Hạn chế của Genève: đất nước tạm thời chia cắt ở vĩ tuyến 17; Mỹ phá hoại hiệp định, dựng chính quyền Ngô Đình Diệm, từ chối hiệp thương tổng tuyển cử (7/1956), âm mưu chia cắt lâu dài Việt Nam, biến miền Nam thành thuộc địa kiểu mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đế quốc Mỹ dựng lên chính quyền tay sai Ngô Đình Diệm ở miền Nam sau năm 1954?", "options": ["A. Để giúp Việt Nam thống nhất đất nước.", "B. Để thực hiện tổng tuyển cử theo Hiệp định Genève.", "C. Nhằm biến miền Nam Việt Nam thành thuộc địa kiểu mới và căn cứ quân sự của Mỹ, ngăn chặn phong trào cách mạng.", "D. Để rút hết quân Mỹ về nước."], "answer": "C", "explain": "Mỹ không ký Tuyên bố cuối cùng của Genève, lập khối SEATO (9/1954), dựng chính quyền Ngô Đình Diệm, viện trợ quân sự – kinh tế, âm mưu biến miền Nam thành thuộc địa kiểu mới, tiền đồn chống chủ nghĩa xã hội ở Đông Nam Á.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "“Tìm diệt” và “bình định” là hai thủ đoạn chiến lược thuộc chiến lược chiến tranh nào của Mỹ?", "options": ["A. Chiến tranh đặc biệt.", "B. Chiến tranh phá hoại.", "C. Việt Nam hóa chiến tranh.", "D. Chiến tranh cục bộ."], "answer": "D", "explain": "Trong “Chiến tranh cục bộ” (1965–1968), Mỹ thực hiện hai gọng kìm: “tìm diệt” (mở các cuộc hành quân càn quét, tìm diệt bộ đội chủ lực) và “bình định” (kiểm soát nông thôn, dồn dân), hòng nhanh chóng kết thúc chiến tranh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đối với miền Bắc, thắng lợi của Hiệp định Paris (1973) có ý nghĩa nào?", "options": ["A. Chấm dứt hoàn toàn chiến tranh phá hoại của Mỹ, miền Bắc được hòa bình để tiếp tục xây dựng chủ nghĩa xã hội và chi viện cho miền Nam.", "B. Miền Bắc phải giải giáp quân đội.", "C. Miền Bắc sáp nhập vào miền Nam.", "D. Miền Bắc ngừng mọi hoạt động kinh tế."], "answer": "A", "explain": "Hiệp định Paris buộc Mỹ chấm dứt hoàn toàn chiến tranh phá hoại miền Bắc bằng không quân và hải quân; miền Bắc được hòa bình, ra sức khôi phục kinh tế, tăng cường chi viện cho tiền tuyến miền Nam, tiến tới giải phóng hoàn toàn miền Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ba chương trình kinh tế lớn được Đại hội VI của Đảng (1986) xác định trong thời kỳ đầu đổi mới là gì?", "options": ["A. Công nghiệp, nông nghiệp, dịch vụ.", "B. Lương thực – thực phẩm, hàng tiêu dùng, hàng xuất khẩu.", "C. Dầu khí, điện lực, than khoáng sản.", "D. Giáo dục, y tế, văn hóa."], "answer": "B", "explain": "Đại hội VI (1986) xác định thực hiện ba chương trình kinh tế lớn: lương thực – thực phẩm, hàng tiêu dùng và hàng xuất khẩu, nhằm từng bước đưa đất nước thoát khỏi khủng hoảng kinh tế – xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việt Nam chính thức trở thành thành viên của Tổ chức Thương mại Thế giới (WTO) vào ngày nào?", "options": ["A. Ngày 28/7/1995.", "B. Ngày 31/12/2015.", "C. Ngày 11/1/2007.", "D. Ngày 20/9/1977."], "answer": "C", "explain": "Ngày 11/1/2007, Việt Nam chính thức trở thành thành viên thứ 150 của WTO, đánh dấu bước hội nhập sâu rộng vào nền kinh tế thế giới, mở ra nhiều cơ hội và thách thức mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cách mạng tháng Mười Nga (1917) có ảnh hưởng như thế nào đối với cách mạng Việt Nam?", "options": ["A. Không có ảnh hưởng gì.", "B. Chỉ ảnh hưởng đến kinh tế Việt Nam.", "C. Mở ra con đường giải phóng mới cho các dân tộc bị áp bức.", "D. Mở ra thời đại mới, chỉ ra con đường cứu nước đúng đắn cho dân tộc Việt Nam: con đường cách mạng vô sản; Nguyễn Ái Quốc từ đó xác định lập trường và tìm thấy chân lý cứu nước."], "answer": "D", "explain": "Cách mạng tháng Mười Nga mở ra thời đại mới — thời đại quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên phạm vi toàn thế giới; đối với Việt Nam, nó giúp Nguyễn Ái Quốc tìm thấy con đường cứu nước đúng đắn: con đường cách mạng vô sản theo chủ nghĩa Mác – Lênin.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chính quyền Xô viết Nghệ Tĩnh (1930–1931) đã thực hiện chính sách tiến bộ nào?", "options": ["A. Tăng thuế để xây dựng quân đội.", "B. Chia lại ruộng đất cho nông dân, xóa bỏ các thứ thuế vô lý, thực hiện quyền tự do dân chủ cho nhân dân.", "C. Bán ruộng đất công cho địa chủ.", "D. Khôi phục chế độ phong kiến."], "answer": "B", "explain": "Các Xô viết ở Nghệ Tĩnh đã thực hiện nhiều chính sách tiến bộ: chia lại ruộng đất công cho nông dân, xóa bỏ thuế thân và các thứ thuế vô lý, trừng trị bọn phản cách mạng, thực hiện quyền tự do, dân chủ cho nhân dân lao động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm giống nhau cơ bản giữa Hiệp định Genève (1954) và Hiệp định Paris (1973) là gì?", "options": ["A. Cả hai đều công nhận Việt Nam bị chia cắt lâu dài.", "B. Cả hai đều do Mỹ đơn phương áp đặt.", "C. Cả hai đều là thắng lợi của sự kết hợp giữa đấu tranh quân sự, chính trị với đấu tranh ngoại giao; đều buộc đối phương phải công nhận các quyền dân tộc cơ bản của Việt Nam.", "D. Cả hai đều chấm dứt hoàn toàn chiến tranh ở Việt Nam."], "answer": "C", "explain": "Genève và Paris đều là thắng lợi của đường lối kết hợp đấu tranh quân sự – chính trị với đấu tranh ngoại giao (“vừa đánh vừa đàm”); đều buộc Pháp/Mỹ phải công nhận độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam. Khác nhau: Genève chưa trọn vẹn (chia cắt tạm thời), Paris tạo thời cơ giải phóng hoàn toàn miền Nam.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đường lối “vừa đánh vừa đàm” của Đảng trong kháng chiến chống Mỹ (1968–1973) thể hiện nghệ thuật nào?", "options": ["A. Chỉ đánh mà không đàm.", "B. Chỉ đàm mà không đánh.", "C. Đánh để thắng trên bàn đàm phán.", "D. Kết hợp chặt chẽ giữa đấu tranh quân sự, chính trị với đấu tranh ngoại giao, lấy thắng lợi quân sự làm cơ sở cho thắng lợi ngoại giao và ngược lại."], "answer": "D", "explain": "“Vừa đánh vừa đàm” là nghệ thuật kết hợp sức mạnh quân sự – chính trị với đấu tranh ngoại giao: thắng lợi trên chiến trường (Mậu Thân 1968, “Điện Biên Phủ trên không” 1972) tạo thế mạnh trên bàn đàm phán; thắng lợi ngoại giao (Paris 1973) tạo điều kiện cho thắng lợi quân sự cuối cùng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về Hiệp định Genève (1954), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hiệp định Genève (21/7/1954) công nhận độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam, Lào và Campuchia.", "b) Theo Hiệp định Genève, vĩ tuyến 17 là giới tuyến quân sự vĩnh viễn chia cắt hai miền Nam – Bắc Việt Nam.", "c) Hiệp định Genève đã được Mỹ và chính quyền Sài Gòn triệt để tôn trọng và thi hành nghiêm chỉnh.", "d) Thắng lợi tại Hội nghị Genève gắn liền với thắng lợi quân sự Điện Biên Phủ và cuộc đấu tranh ngoại giao kiên cường của đoàn đại biểu Việt Nam."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: đây là nội dung cốt lõi của Hiệp định Genève về Đông Dương. b) Sai: vĩ tuyến 17 chỉ là giới tuyến quân sự tạm thời; hai bên phải hiệp thương tổng tuyển cử thống nhất đất nước vào tháng 7/1956. c) Sai: Mỹ không ký Tuyên bố cuối cùng, dựng chính quyền Diệm, phá hoại hiệp định, từ chối tổng tuyển cử. d) Đúng: thắng lợi ngoại giao ở Genève là kết quả của thắng lợi quân sự (Điện Biên Phủ) kết hợp đấu tranh ngoại giao.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về chiến lược “Chiến tranh đặc biệt” (1961–1965) của Mỹ, xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Chiến tranh đặc biệt” được Mỹ tiến hành bằng quân đội Sài Gòn làm lực lượng chủ yếu, dưới sự chỉ huy của hệ thống cố vấn Mỹ.", "b) Thủ đoạn dồn dân lập “ấp chiến lược” nhằm mục đích cải thiện đời sống vật chất cho nông dân miền Nam.", "c) Những thắng lợi của quân dân miền Nam (Bình Giã 12/1964, Ba Gia 5/1965, Đồng Xoài 6/1965...) đã làm phá sản chiến lược “Chiến tranh đặc biệt”.", "d) Thất bại của “Chiến tranh đặc biệt” buộc Mỹ phải chuyển sang chiến lược “Chiến tranh cục bộ”, trực tiếp đưa quân viễn chinh vào miền Nam."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: “Chiến tranh đặc biệt” dùng quân Ngụy làm xương sống, cố vấn Mỹ chỉ huy, với vũ khí, phương tiện chiến tranh hiện đại của Mỹ. b) Sai: “ấp chiến lược” hòng tách dân khỏi cách mạng, kiểm soát nông thôn, là thủ đoạn thâm độc chứ không vì đời sống dân. c) Đúng: các thắng lợi quân sự của ta (đặc biệt Bình Giã) làm phá sản cơ bản “Chiến tranh đặc biệt”. d) Đúng: từ giữa 1965 Mỹ chuyển sang “Chiến tranh cục bộ”.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về cuộc Tổng tiến công và nổi dậy Tết Mậu Thân (1968), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Cuộc Tổng tiến công và nổi dậy Tết Mậu Thân (1968) đã giải phóng hoàn toàn miền Nam Việt Nam.", "b) Mậu Thân 1968 giáng đòn bất ngờ, mạnh mẽ vào ý chí xâm lược của Mỹ và làm lung lay chính quyền Sài Gòn.", "c) Thắng lợi của Mậu Thân 1968 buộc Mỹ phải xuống thang chiến tranh, chấp nhận ngồi vào bàn đàm phán với ta tại Paris.", "d) Sau Mậu Thân 1968, Mỹ tăng cường đưa thêm hàng chục vạn quân viễn chinh vào miền Nam."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: Mậu Thân chưa giải phóng miền Nam; ý nghĩa của nó là giáng đòn quyết định vào chiến lược “Chiến tranh cục bộ”, tạo bước ngoặt chiến tranh. b) Đúng: cuộc tiến công đồng loạt vào các đô thị gây chấn động nước Mỹ. c) Đúng: Johnson phải tuyên bố ngừng ném bom miền Bắc, chấp nhận đàm phán — Mỹ chuyển sang “Việt Nam hóa chiến tranh”. d) Sai: sau Mậu Thân Mỹ xuống thang, bắt đầu rút quân dần (“phi Mỹ hóa” chiến tranh).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về việc thống nhất đất nước về mặt nhà nước (1976), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Sau ngày 30/4/1975, hai miền Bắc – Nam vẫn duy trì hai nhà nước riêng biệt cho đến nay.", "b) Ngày 25/4/1976, cuộc Tổng tuyển cử bầu Quốc hội chung của cả nước (Quốc hội khóa VI) được tiến hành thắng lợi.", "c) Kỳ họp thứ nhất Quốc hội khóa VI (24/6 – 3/7/1976) quyết định đổi tên nước thành Việt Nam Dân chủ Cộng hòa.", "d) Thủ đô của nước Việt Nam thống nhất được quyết định là Thành phố Hồ Chí Minh."], "answer": ["F", "T", "F", "F"], "explain": "a) Sai: sau giải phóng, cả nước tiến hành thống nhất về mặt nhà nước, hoàn thành cơ bản năm 1976. b) Đúng: Tổng tuyển cử 25/4/1976 bầu Quốc hội chung khóa VI — cơ quan quyền lực nhà nước cao nhất của nước Việt Nam thống nhất. c) Sai: Quốc hội quyết định tên nước là Cộng hòa Xã hội chủ nghĩa Việt Nam. d) Sai: thủ đô là Hà Nội; thành phố Sài Gòn – Gia Định được đổi tên thành Thành phố Hồ Chí Minh.", "points": 1}]}]}</script>
