<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Thời cơ khách quan thuận lợi để Đảng phát động Tổng khởi nghĩa tháng Tám 1945 xuất hiện khi nào?", "options": ["A. Khi phát xít Nhật đầu hàng Đồng minh (15/8/1945), quân Nhật ở Đông Dương rệu rã, chính phủ tay sai hoang mang.", "B. Khi Pháp trở lại xâm lược Việt Nam.", "C. Khi Mỹ ném bom nguyên tử xuống Việt Nam.", "D. Khi Liên Xô tấn công Đông Dương."], "answer": "A", "explain": "Thời cơ “ngàn năm có một”: Nhật đầu hàng Đồng minh (15/8/1945), quân Nhật ở Đông Dương mất tinh thần, chính phủ Trần Trọng Kim hoang mang, quân Đồng minh chưa kịp vào — Đảng kịp thời phát động Tổng khởi nghĩa giành chính quyền.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nội dung cốt lõi của bản Tuyên ngôn độc lập (2/9/1945) là gì?", "options": ["A. Tuyên bố thành lập Mặt trận Việt Minh.", "B. Khẳng định quyền độc lập, tự do thiêng liêng của dân tộc Việt Nam và quyết tâm bảo vệ nền độc lập đó.", "C. Kêu gọi toàn quốc kháng chiến.", "D. Công bố Hiến pháp đầu tiên."], "answer": "B", "explain": "Tuyên ngôn độc lập khẳng định: “Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng...”; “Nước Việt Nam có quyền hưởng tự do và độc lập, và sự thật đã thành một nước tự do, độc lập”; thể hiện quyết tâm bảo vệ nền độc lập của dân tộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chỉ thị “Toàn dân kháng chiến” của Trung ương Đảng được ban hành vào ngày nào?", "options": ["A. Ngày 19/12/1946.", "B. Ngày 22/12/1944.", "C. Ngày 6/3/1946.", "D. Ngày 12/12/1946."], "answer": "D", "explain": "Ngày 12/12/1946, Ban Thường vụ Trung ương Đảng ra Chỉ thị “Toàn dân kháng chiến”, xác định đường lối kháng chiến; tiếp đó ngày 19/12/1946 Chủ tịch Hồ Chí Minh ra Lời kêu gọi toàn quốc kháng chiến.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thực dân Pháp mở cuộc tiến công lên căn cứ địa Việt Bắc vào thời gian nào?", "options": ["A. Tháng 10/1947.", "B. Tháng 3/1954.", "C. Tháng 9/1950.", "D. Tháng 12/1946."], "answer": "A", "explain": "Ngày 7/10/1947, Pháp huy động 12.000 quân (cả thủy, bộ, không quân) mở cuộc tiến công lên Việt Bắc, hòng tiêu diệt cơ quan đầu não kháng chiến. Quân dân ta đã bẻ gãy cuộc tiến công, bảo vệ vững chắc căn cứ địa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trận đánh mở màn chiến dịch Biên giới (1950) là trận nào?", "options": ["A. Trận Điện Biên Phủ.", "B. Trận Đông Khê.", "C. Trận Bạch Đằng.", "D. Trận đánh ở thị xã Cao Bằng."], "answer": "B", "explain": "Sáng 16/9/1950, quân ta nổ súng tiến công Đông Khê — trận mở màn chiến dịch Biên giới; đến 18/9 ta làm chủ Đông Khê, tạo thế thuận lợi cho toàn chiến dịch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ai là Tổng tư lệnh, trực tiếp chỉ huy chiến dịch Điện Biên Phủ (1954)?", "options": ["A. Chủ tịch Hồ Chí Minh.", "B. Trường Chinh.", "C. Đại tướng Võ Nguyên Giáp.", "D. Phạm Văn Đồng."], "answer": "C", "explain": "Đại tướng Võ Nguyên Giáp — Tổng Tư lệnh Quân đội nhân dân Việt Nam — được Bộ Chính trị giao trực tiếp chỉ huy chiến dịch Điện Biên Phủ; quyết định lịch sử chuyển phương châm từ “đánh nhanh, giải quyết nhanh” sang “đánh chắc, tiến chắc”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sau Hiệp định Genève (1954), đế quốc Mỹ có thái độ nào?", "options": ["A. Tôn trọng và thi hành nghiêm chỉnh hiệp định.", "B. Rút hết ảnh hưởng khỏi Đông Dương.", "C. Giúp Việt Nam tổ chức tổng tuyển cử.", "D. Không ký Tuyên bố cuối cùng, phá hoại hiệp định, dựng chính quyền Ngô Đình Diệm ở miền Nam."], "answer": "D", "explain": "Mỹ không ký Tuyên bố cuối cùng của Hội nghị Genève; lập khối quân sự SEATO (9/1954), viện trợ và dựng chính quyền tay sai Ngô Đình Diệm, phá hoại hiệp định, từ chối hiệp thương tổng tuyển cử, âm mưu chia cắt lâu dài Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiệm vụ cơ bản của miền Bắc trong những năm 1954–1957 là gì?", "options": ["A. Khôi phục kinh tế, hàn gắn vết thương chiến tranh.", "B. Mở cuộc tổng tiến công.", "C. Ký hiệp định thương mại với Mỹ.", "D. Giải phóng miền Nam ngay lập tức."], "answer": "A", "explain": "Sau Genève, miền Bắc bước vào thời kỳ khôi phục kinh tế (1954–1957): hàn gắn vết thương chiến tranh, khôi phục sản xuất nông – công nghiệp, hoàn thành cải cách ruộng đất, tạo cơ sở để tiến lên xây dựng chủ nghĩa xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chính sách “tố cộng, diệt cộng” là của chính quyền nào ở miền Nam Việt Nam?", "options": ["A. Chính quyền Bảo Đại.", "B. Chính quyền Nguyễn Văn Thiệu.", "C. Chính quyền Ngô Đình Diệm.", "D. Chính quyền Dương Văn Minh."], "answer": "C", "explain": "Sau 1954, chính quyền Ngô Đình Diệm thi hành chính sách “tố cộng, diệt cộng”, ban hành Luật 10/59, khủng bố dã man những người kháng chiến cũ và đồng bào yêu nước, gây tổn thất nặng nề cho cách mạng miền Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến thắng Bình Giã (tháng 12/1964) có ý nghĩa nào đối với cách mạng miền Nam?", "options": ["A. Mở đầu phong trào Đồng Khởi.", "B. Kết thúc chiến tranh.", "C. Giải phóng Sài Gòn.", "D. Giáng đòn nặng nề vào chiến lược “Chiến tranh đặc biệt”, làm phá sản về cơ bản chiến lược này của Mỹ."], "answer": "D", "explain": "Chiến thắng Bình Giã (2/12/1964 – 3/1/1965) cùng các thắng lợi Ba Gia, Đồng Xoài (1965) đã làm phá sản về cơ bản chiến lược “Chiến tranh đặc biệt”, buộc Mỹ phải chuyển sang “Chiến tranh cục bộ”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phong trào Đông Du (1905–1908) do ai khởi xướng và lãnh đạo?", "options": ["A. Phan Bội Châu.", "B. Phan Châu Trinh.", "C. Nguyễn Thái Học.", "D. Lương Văn Can."], "answer": "A", "explain": "Phan Bội Châu khởi xướng phong trào Đông Du (1905–1908), đưa thanh niên yêu nước sang Nhật Bản học tập, hòng cầu viện Nhật để đánh Pháp; phong trào tan rã sau khi Pháp – Nhật cấu kết trục xuất du học sinh (1908).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Luận cương chính trị của Đảng (tháng 10/1930) do ai soạn thảo?", "options": ["A. Nguyễn Ái Quốc.", "B. Trần Phú.", "C. Lê Hồng Phong.", "D. Nguyễn Văn Cừ."], "answer": "B", "explain": "Luận cương chính trị (10/1930) do Trần Phú — Tổng Bí thư đầu tiên của Đảng — soạn thảo, được Hội nghị Trung ương tháng 10/1930 thông qua; xác định tính chất, nhiệm vụ, lực lượng và phương pháp của cách mạng Đông Dương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên nhân chủ quan quyết định thắng lợi của Cách mạng tháng Tám 1945 là gì?", "options": ["A. Quân Đồng minh trực tiếp giúp đỡ.", "B. Thực dân Pháp tự rút lui.", "C. Sự lãnh đạo đúng đắn, sáng tạo của Đảng và Chủ tịch Hồ Chí Minh; khối đoàn kết toàn dân; sự chuẩn bị chu đáo về mọi mặt trong suốt 15 năm.", "D. Phát xít Nhật chủ động trao chính quyền."], "answer": "C", "explain": "Nguyên nhân chủ quan quyết định: Đảng có đường lối đúng đắn, chớp đúng thời cơ; nhân dân đoàn kết một lòng dưới ngọn cờ Việt Minh; lực lượng chính trị, vũ trang và căn cứ địa được xây dựng chu đáo qua 15 năm đấu tranh (1930–1945).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa quốc tế của bản Tuyên ngôn độc lập (2/9/1945) là gì?", "options": ["A. Chỉ có ý nghĩa trong phạm vi trong nước.", "B. Tuyên bố Việt Nam gia nhập Liên hợp quốc.", "C. Kêu gọi các nước viện trợ kinh tế.", "D. Khẳng định với thế giới về quyền độc lập của dân tộc Việt Nam, cổ vũ các dân tộc bị áp bức đấu tranh giành độc lập."], "answer": "D", "explain": "Tuyên ngôn độc lập (2/9/1945) không chỉ khai sinh nước Việt Nam Dân chủ Cộng hòa mà còn khẳng định trước thế giới quyền độc lập thiêng liêng của dân tộc Việt Nam, cổ vũ mạnh mẽ phong trào đấu tranh giành độc lập của các dân tộc thuộc địa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao quân dân Việt Nam giành thắng lợi trong chiến dịch Việt Bắc thu – đông 1947?", "options": ["A. Vì Pháp chủ động rút quân.", "B. Vì ta có ưu thế tuyệt đối về vũ khí, đánh bại âm mưu “đánh nhanh, thắng nhanh” của Pháp bằng thế trận chiến tranh nhân dân, bẻ gãy cuộc tiến công quy mô lớn đầu tiên của địch.", "C. Vì Mỹ can thiệp giúp ta.", "D. Vì Pháp thiếu quân."], "answer": "B", "explain": "Ta thắng ở Việt Bắc nhờ: chủ trương đúng đắn (phá cuộc tiến công mùa đông của địch), thế trận chiến tranh nhân dân vững chắc, tinh thần chiến đấu dũng cảm; Pháp chủ quan, khinh địch, bị động trước cách đánh của ta. (Đáp án có diễn đạt dài nhưng đúng là B.)", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nét đặc sắc về nghệ thuật quân sự trong chiến dịch Điện Biên Phủ (1954) là gì?", "options": ["A. Đánh theo kiểu dàn trận cổ điển.", "B. Chỉ dùng pháo binh.", "C. Nghệ thuật “vây, lấn, tấn, diệt”: bao vây, đào chiến hào lấn dần, tiến công tiêu diệt từng cứ điểm, kết hợp đánh địch ngoài công sự và trong công sự.", "D. Phòng ngự phản công."], "answer": "C", "explain": "Nghệ thuật ĐBP: “vây, lấn, tấn, diệt” — vây hãm, đào hàng trăm km chiến hào lấn dần siết chặt vòng vây, tiến công tiêu diệt từng trung tâm đề kháng từ ngoài vào trong, kết hợp chặt chẽ giữa tiến công quân sự với nổi dậy của nhân dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói Hiệp định Genève (1954) là thắng lợi nhưng chưa trọn vẹn?", "options": ["A. Vì ta không giành được gì.", "B. Vì Pháp không chịu ký.", "C. Vì Mỹ không tham dự.", "D. Vì tuy buộc Pháp công nhận các quyền dân tộc cơ bản của Việt Nam, đất nước vẫn tạm thời bị chia cắt ở vĩ tuyến 17 và Mỹ phá hoại việc tổng tuyển cử thống nhất đất nước."], "answer": "D", "explain": "Genève là thắng lợi to lớn (kết thúc chiến tranh, Pháp rút quân) nhưng chưa trọn vẹn: đất nước tạm chia cắt, Mỹ và chính quyền Sài Gòn phá hoại hiệp định, cuộc tổng tuyển cử 7/1956 không thực hiện được, cách mạng Việt Nam phải tiếp tục đấu tranh thống nhất đất nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong kháng chiến chống Mỹ, miền Bắc được xác định có vai trò nào?", "options": ["A. Là căn cứ địa của cách mạng cả nước, hậu phương lớn chi viện cho tiền tuyến lớn miền Nam.", "B. Đứng ngoài cuộc chiến tranh.", "C. Chỉ lo phòng thủ.", "D. Đàm phán riêng với Mỹ."], "answer": "A", "explain": "Miền Bắc xã hội chủ nghĩa là căn cứ địa vững chắc của cách mạng cả nước, đồng thời là hậu phương lớn: vừa sản xuất, chiến đấu chống chiến tranh phá hoại, vừa dốc sức chi viện cho tiền tuyến miền Nam — nhân tố quyết định thắng lợi chung.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nội dung cơ bản của chiến lược “Việt Nam hóa chiến tranh” (1969–1973) là gì?", "options": ["A. Mỹ tăng quân viễn chinh lên 100 vạn.", "B. Rút dần quân Mỹ về nước, tăng cường viện trợ để quân đội Sài Gòn tự đảm đương chiến đấu (“dùng người Việt đánh người Việt”), mở rộng chiến tranh sang Lào, Campuchia.", "C. Mỹ rút hết viện trợ cho Sài Gòn.", "D. Đàm phán hòa bình vô điều kiện."], "answer": "B", "explain": "“Việt Nam hóa chiến tranh”: Mỹ rút dần quân viễn chinh, tăng viện trợ quân sự – kinh tế để quân Ngụy “tự đảm đương”, đồng thời mở rộng chiến tranh ra toàn Đông Dương (đánh sang Campuchia 1970, Lào 1971) — thực chất là tiếp tục chiến tranh xâm lược bằng người Việt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc tập kích chiến lược bằng không quân của Mỹ ra miền Bắc cuối năm 1972 (“Điện Biên Phủ trên không”) diễn ra trong thời gian nào?", "options": ["A. Từ ngày 5 đến ngày 14/8/1964.", "B. Từ tháng 2 đến tháng 10/1965.", "C. Từ ngày 18 đến ngày 29/12/1972.", "D. Từ tháng 3 đến tháng 5/1954."], "answer": "C", "explain": "Từ 18 đến 29/12/1972, Mỹ mở cuộc tập kích chiến lược bằng B-52 ra Hà Nội, Hải Phòng hòng giành thế mạnh trên bàn đàm phán; quân dân miền Bắc đập tan cuộc tập kích, bắn rơi 81 máy bay (trong đó 34 B-52), buộc Mỹ phải trở lại bàn đàm phán và ký Hiệp định Paris.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mặt trận Dân chủ Đông Dương (1936–1939) được thành lập nhằm mục đích gì?", "options": ["A. Tập hợp mọi lực lượng dân chủ chống phát xít, chống chiến tranh, đòi tự do, dân sinh, dân chủ, cơm áo và hòa bình.", "B. Đòi Pháp trao trả độc lập ngay lập tức bằng bạo lực.", "C. Khôi phục chế độ phong kiến.", "D. Liên minh với phát xít Nhật."], "answer": "A", "explain": "Trước nguy cơ phát xít và chiến tranh, Hội nghị Trung ương 7/1936 chủ trương thành lập Mặt trận Dân chủ Đông Dương, tập hợp mọi lực lượng yêu nước, dân chủ đấu tranh chống bọn phản động thuộc địa, đòi các quyền tự do, dân sinh, dân chủ — tạo cao trào dân chủ 1936–1939.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa lịch sử của phong trào Xô viết Nghệ Tĩnh (1930–1931) là gì?", "options": ["A. Giành được chính quyền trong cả nước.", "B. Khẳng định đường lối đúng đắn của Đảng, để lại bài học về xây dựng chính quyền cách mạng và liên minh công – nông.", "C. Đánh dấu bước ngoặt của cách mạng Việt Nam.", "D. Buộc Pháp phải trao trả độc lập."], "answer": "B", "explain": "Xô viết Nghệ Tĩnh là cuộc tổng diễn tập đầu tiên của cách mạng Việt Nam dưới sự lãnh đạo của Đảng: khẳng định đường lối đúng đắn, để lại bài học quý về xây dựng khối liên minh công – nông, về chính quyền cách mạng của dân, do dân, vì dân.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bài học kinh nghiệm quan trọng rút ra từ thắng lợi của Cách mạng tháng Tám 1945 về nghệ thuật chớp thời cơ là gì?", "options": ["A. Chờ thời cơ đến một cách thụ động.", "B. Chỉ khởi nghĩa khi kẻ thù hoàn toàn suy yếu.", "C. Nắm vững thời cơ, chủ động, sáng tạo, kịp thời phát động tổng khởi nghĩa khi thời cơ chín muồi; kết hợp chặt chẽ giữa điều kiện khách quan và sự chuẩn bị chủ quan.", "D. Khởi nghĩa bất cứ lúc nào."], "answer": "C", "explain": "Bài học chớp thời cơ: Đảng vừa ra sức chuẩn bị chu đáo mọi mặt (lực lượng chính trị, vũ trang, căn cứ địa), vừa nhạy bén nắm bắt thời cơ khách quan (“ngàn năm có một” khi Nhật đầu hàng), kịp thời phát động Tổng khởi nghĩa giành thắng lợi nhanh gọn, ít đổ máu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "So sánh chiến lược “Chiến tranh đặc biệt” (1961–1965) và “Việt Nam hóa chiến tranh” (1969–1973) của Mỹ, điểm giống nhau cơ bản là gì?", "options": ["A. Đều dùng quân viễn chinh Mỹ trực tiếp tham chiến.", "B. Đều thắng lợi hoàn toàn.", "C. Đều chỉ diễn ra ở miền Bắc.", "D. Đều là hình thức chiến tranh xâm lược thực dân kiểu mới, dùng người Việt đánh người Việt, hòng biến miền Nam thành thuộc địa kiểu mới của Mỹ."], "answer": "D", "explain": "Cả “Chiến tranh đặc biệt” và “Việt Nam hóa chiến tranh” đều là chiến tranh xâm lược thực dân kiểu mới: Mỹ không trực tiếp đưa quân viễn chinh ồ ạt (khác “Chiến tranh cục bộ”) mà dùng quân đội Sài Gòn làm công cụ, dưới sự chỉ huy, viện trợ của Mỹ — thực chất “dùng người Việt đánh người Việt”.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về chiến dịch Việt Bắc thu – đông (1947), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Tháng 10/1947, thực dân Pháp huy động khoảng 12.000 quân mở cuộc tiến công lên Việt Bắc hòng tiêu diệt cơ quan đầu não kháng chiến của ta.", "b) Âm mưu của Pháp trong cuộc tiến công lên Việt Bắc là đàm phán hòa bình với Chính phủ Việt Nam.", "c) Quân dân ta đã để mất căn cứ địa Việt Bắc trong chiến dịch này.", "d) Chiến thắng Việt Bắc chứng tỏ đường lối kháng chiến toàn dân, toàn diện, trường kỳ, tự lực cánh sinh của Đảng là đúng đắn."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: 7/10/1947 Pháp mở cuộc tiến công quy mô lớn bằng cả đường không, đường bộ, đường thủy lên Việt Bắc. b) Sai: âm mưu là tiêu diệt đầu não, phá căn cứ địa, kết thúc nhanh chiến tranh — không phải đàm phán. c) Sai: ta bẻ gãy cuộc tiến công, bảo vệ vững chắc căn cứ địa Việt Bắc. d) Đúng: thắng lợi khẳng định đường lối kháng chiến đúng đắn, cổ vũ tinh thần toàn dân.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về chiến lược “Chiến tranh cục bộ” (1965–1968) của Mỹ, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Trong “Chiến tranh cục bộ”, Mỹ chỉ sử dụng quân đội Sài Gòn, không đưa quân viễn chinh vào miền Nam.", "b) Chiến lược “Chiến tranh cục bộ” được Mỹ tiến hành đồng thời ở cả hai miền Nam – Bắc với quy mô và tính chất như nhau.", "c) Thắng lợi Vạn Tường (8/1965) chứng tỏ quân dân miền Nam hoàn toàn có khả năng đánh bại quân viễn chinh Mỹ.", "d) Thất bại trong “Chiến tranh cục bộ” (đặc biệt sau Mậu Thân 1968) buộc Mỹ phải xuống thang, chuyển sang chiến lược “Việt Nam hóa chiến tranh”."], "answer": ["F", "F", "T", "T"], "explain": "a) Sai: “Chiến tranh cục bộ” đặc trưng bởi việc Mỹ trực tiếp đưa quân viễn chinh (gần 50 vạn lúc cao nhất) vào miền Nam tham chiến. b) Sai: chiến lược chủ yếu tiến hành ở miền Nam; ở miền Bắc Mỹ mở rộng chiến tranh phá hoại bằng không quân, hải quân. c) Đúng: Vạn Tường (18/8/1965) đánh bại cuộc hành quân tìm diệt của 9.000 quân Mỹ, mở đầu cao trào “tìm Mỹ mà đánh”. d) Đúng: sau Mậu Thân 1968, Mỹ thất bại, phải xuống thang, thực hiện “Việt Nam hóa chiến tranh”.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về chiến lược “Việt Nam hóa chiến tranh” (1969–1973), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Chiến lược “Việt Nam hóa chiến tranh” do Tổng thống Kennedy đề ra từ năm 1961.", "b) Nội dung cơ bản của “Việt Nam hóa chiến tranh” là rút dần quân Mỹ về nước, tăng viện trợ để quân đội Sài Gòn tự đảm đương chiến đấu, đồng thời mở rộng chiến tranh sang Lào, Campuchia.", "c) Trong “Việt Nam hóa chiến tranh”, Mỹ vẫn tiếp tục viện trợ và chỉ đạo chính quyền Sài Gòn chống phá cách mạng.", "d) Chiến lược “Việt Nam hóa chiến tranh” đã giành thắng lợi hoàn toàn ở miền Nam Việt Nam."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: chiến lược do Tổng thống Nixon đề ra (1969), sau thất bại của “Chiến tranh cục bộ”. b) Đúng: “dùng người Việt đánh người Việt”, rút quân Mỹ, tăng cường Ngụy quân, Ngụy quyền, mở rộng chiến tranh ra toàn Đông Dương. c) Đúng: Mỹ vẫn là kẻ chỉ huy, viện trợ; chính quyền Sài Gòn là công cụ tay sai. d) Sai: chiến lược bị phá sản trước thắng lợi của quân dân ta (Tiến công 1972, “Điện Biên Phủ trên không”), dẫn đến việc Mỹ phải ký Hiệp định Paris.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về Liên hợp quốc, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Liên hợp quốc chính thức được thành lập ngày 24/10/1945 khi Hiến chương có hiệu lực.", "b) Mục đích của Liên hợp quốc là duy trì hòa bình, an ninh thế giới và thúc đẩy hợp tác quốc tế giữa các quốc gia.", "c) Việt Nam trở thành thành viên của Liên hợp quốc ngay từ năm 1945.", "d) Nguyên tắc hoạt động của Liên hợp quốc cho phép các nước lớn can thiệp vào công việc nội bộ của nước khác."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: 24/10 hằng năm là Ngày Liên hợp quốc. b) Đúng: theo Hiến chương, mục đích là duy trì hòa bình, an ninh quốc tế, phát triển quan hệ hữu nghị, hợp tác giải quyết các vấn đề quốc tế. c) Sai: Việt Nam gia nhập LHQ ngày 20/9/1977, là thành viên thứ 149. d) Sai: nguyên tắc cơ bản là bình đẳng về chủ quyền giữa các quốc gia, không can thiệp vào công việc thuộc thẩm quyền nội bộ của quốc gia khác.", "points": 1}]}]}</script>
