ỡ, ít muối.", "c) Không nên hút thuốc lá.", "d) Nên ăn nhiều mỡ động vật."], "answer": ["T", "T", "T", "F"], "explain": "Ăn nhiều mỡ gây xơ vữa động mạch.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Nhận định về xử lí mất máu.", "statements": ["a) Mất máu nhiều cần cầm máu ngay.", "b) Cần đưa nạn nhân đến cơ sở y tế.", "c) Ấn chặt vết thương giúp cầm máu.", "d) Mất máu nhiều không nguy hiểm."], "answer": ["T", "T", "T", "F"], "explain": "Mất máu nhiều nguy hiểm tính mạng.", "points": 1}, {"type": "short", "level": "NB", "q": "Tỉ lệ các thành phần trong máu là bao nhiêu?", "answer": "55% huyết tương, 45% tế bào máu", "explain": "Huyết tương chiếm 55%, tế bào máu 45% thể tích máu.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Sơ cứu khi bị chảy máu như thế nào?", "answer": "Ấn chặt, băng ép", "explain": "Cầm máu rồi đến y tế.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Máu gồm những thành phần nào?", "options": ["A. Huyết tương và các tế bào máu", "B. Chỉ huyết tương", "C. Chỉ hồng cầu", "D. Nước và muối"], "answer": "A", "explain": "Máu gồm huyết tương (55%) và tế bào máu (45%).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuốc lá có hại gì cho hệ tuần hoàn?", "options": ["A. Gây xơ vữa động mạch, hại tim", "B. Tốt cho tim", "C. Không ảnh hưởng", "D. Làm tim khỏe"], "answer": "A", "explain": "Thuốc lá gây hại tim mạch.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Van tim có vai trò gì?", "options": ["A. Ngăn máu chảy ngược", "B. Bơm máu", "C. Trao đổi khí", "D. Lọc máu"], "answer": "A", "explain": "Van một chiều ngăn máu chảy ngược.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xơ vữa động mạch gây nguy hiểm gì?", "options": ["A. Hẹp mạch, dễ tắc mạch gây nhồi máu", "B. Không sao", "C. Làm mạch to ra", "D. Tốt cho tim"], "answer": "A", "explain": "Mảng xơ vữa hẹp lòng mạch, dễ tắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao thành động mạch dày và
