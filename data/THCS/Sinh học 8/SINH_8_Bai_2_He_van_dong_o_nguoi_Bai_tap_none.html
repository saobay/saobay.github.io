u co lại.", "d) Hai cơ đối kháng luôn cùng co một lúc."], "answer": ["T", "T", "T", "F"], "explain": "Cặp đối kháng: một cơ co, một cơ dãn.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Nhận định về khớp.", "statements": ["a) Khớp là nơi tiếp giáp giữa các xương.", "b) Khớp động cử động linh hoạt.", "c) Khớp hộp sọ là khớp bất động.", "d) Khớp gối là khớp bất động."], "answer": ["T", "T", "T", "F"], "explain": "Khớp gối là khớp động.", "points": 1}, {"type": "short", "level": "TH", "q": "Có mấy loại khớp? Kể tên.", "answer": "3 loại: bất động, bán động, động", "explain": "Ba loại khớp xương.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Chất tích tụ gây mỏi cơ là gì?", "answer": "Axit lactic", "explain": "Axit lactic gây mỏi cơ.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Có mấy loại khớp xương?", "options": ["A. 1 loại", "B. 2 loại", "C. 3 loại", "D. 4 loại"], "answer": "C", "explain": "Khớp bất động, khớp bán động, khớp động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cơ bám vào xương nhờ bộ phận nào?", "options": ["A. Dây thần kinh", "B. Mạch máu", "C. Gân", "D. Sụn"], "answer": "C", "explain": "Cơ bám vào xương qua gân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao trẻ em xương dễ uốn nhưng khó gãy, người già xương dễ gãy?", "options": ["A. Do tỉ lệ cốt giao và muối khoáng thay đổi theo tuổi", "B. Do trẻ em ít vận động", "C. Do người già ăn nhiều canxi", "D. Do xương người già dài hơn"], "answer": "A", "explain": "Trẻ nhiều cốt giao nên dẻo, già nhiều khoáng nên giòn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lồng ngực được tạo bởi những xương nào?", "options": ["A. Xương sườn, xương ức, cột sống", "B. Xương sọ", "C. Xương tay", "D. Xương chậu"], "answer": "A", "explain": "Lồng ngực gồm xương sườn, ức và cột sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao xương vừa rắn chắc vừa mềm dẻo?", "options": ["A. Vì có cả chất hữu cơ và ch
