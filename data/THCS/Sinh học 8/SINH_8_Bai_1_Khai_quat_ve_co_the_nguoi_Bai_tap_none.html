 1}, {"type": "truefalse", "level": "NB", "q": "Nhận định về sự thống nhất cơ thể.", "statements": ["a) Các hệ cơ quan trong cơ thể phối hợp với nhau.", "b) Hệ thần kinh điều khiển hoạt động của các hệ cơ quan.", "c) Các hệ cơ quan hoạt động hoàn toàn độc lập.", "d) Cơ thể là một thể thống nhất."], "answer": ["T", "T", "F", "T"], "explain": "Các hệ cơ quan phối hợp, không hoạt động độc lập.", "points": 1}, {"type": "short", "level": "TH", "q": "Hệ thần kinh gồm những cơ quan chính nào?", "answer": "Não, tủy sống, dây thần kinh", "explain": "Các cơ quan chính của hệ thần kinh.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Tế bào là đơn vị gì của cơ thể người?", "answer": "Đơn vị cấu tạo và đơn vị chức năng", "explain": "Tế bào là đơn vị cấu tạo và đơn vị chức năng cơ bản.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tế bào thần kinh còn có tên gọi khác là gì?", "options": ["A. Sợi cơ", "B. Nơron", "C. Hồng cầu", "D. Tế bào mỡ"], "answer": "B", "explain": "Tế bào thần kinh gọi là nơron.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cơ thể người có mấy loại mô chính?", "options": ["A. 2 loại", "B. 3 loại", "C. 4 loại", "D. 5 loại"], "answer": "C", "explain": "Gồm mô biểu bì, mô liên kết, mô cơ, mô thần kinh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dạ dày thuộc hệ cơ quan nào?", "options": ["A. Hệ tuần hoàn", "B. Hệ tiêu hóa", "C. Hệ hô hấp", "D. Hệ bài tiết"], "answer": "B", "explain": "Dạ dày thuộc hệ tiêu hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi bị đứt tay, những loại mô nào tham gia làm lành vết thương?", "options": ["A. Chỉ mô cơ", "B. Mô biểu bì tái tạo bề mặt, mô liên kết lấp đầy", "C. Chỉ mô thần kinh", "D. Không mô nào tham gia"], "answer": "B", "explain": "Các mô phối hợp để phục hồi vết thương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xương, khớp, cơ cùng thuộc hệ cơ quan nào?", "options": ["A. Hệ vận động", "B. Hệ tuần hoàn", "C. Hệ thần kinh", "D. Hệ nội tiết"], "answer": "A", "explain": "Ba bộ phận cùng tạo nên sự vận động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi trời lạnh, cơ thể run lên và nổi da gà. Hiện tượng này liên quan đến những hệ cơ quan nào?", "options": ["A. Hệ vận động và hệ thần kinh", "B. Hệ tiêu hóa và hệ hô hấp", "C. Hệ tuần hoàn và hệ sinh dục", "D. Hệ nội tiết và hệ bài tiết"], "answer": "A", "explain": "Thần kinh ra lệnh, cơ co (run) để sinh nhiệt.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Nhận định về hệ tuần hoàn.", "statements": ["a) Tim co bóp đẩy máu đi khắp cơ thể.", "b) Mạch máu dẫn máu tới các cơ quan.", "c) Máu vận chuyển oxi và chất dinh dưỡng.", "d) Hệ tuần hoàn có chức năng trao đổi khí ở phổi."], "answer": ["T", "T", "T", "F"], "explain": "Trao đổi khí là chức năng của hệ hô hấp.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Nhận định về các hệ cơ quan.", "statements": ["a) Tim thuộc hệ tuần hoàn.", "b) Phổi thuộc hệ hô hấp.", "c) Dạ dày thuộc hệ tiêu hóa.", "d) Thận thuộc hệ thần kinh."], "answer": ["T", "T", "T", "F"], "explain": "Thận thuộc hệ bài tiết, không phải hệ thần kinh.", "points": 1}, {"type": "short", "level": "TH", "q": "Hệ thần kinh và hệ nội tiết điều hòa cơ thể bằng cách nào?", "answer": "Xung thần kinh và hoocmon", "explain": "Hai con đường điều hòa của cơ thể.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Hệ cơ quan nào gồm xương, khớp, cơ?", "answer": "Hệ vận động", "explain": "Xương, khớp, cơ tạo hệ vận động.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Mô nào có chức năng nâng đỡ, liên kết các cơ quan?", "options": ["A. Mô liên kết", "B. Mô cơ", "C. Mô biểu bì", "D. Mô thần kinh"], "answer": "A", "explain": "Mô liên kết nâng đỡ và liên kết các cơ quan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xương thuộc loại mô nào?", "options": ["A. Mô liên kết", "B. Mô cơ", "C. Mô biểu bì", "D. Mô thần kinh"], "answer": "A", "explain": "Xương là mô liên kết cứng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tim, mạch máu cùng thuộc hệ cơ quan nào?", "options": ["A. Hệ hô hấp", "B. Hệ tiêu hóa", "C. Hệ tuần hoàn", "D. Hệ bài tiết"], "answer": "C", "explain": "Tim và mạch máu cùng vận chuyển máu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ nội tiết điều hòa hoạt động cơ thể bằng cách nào?", "options": ["A. Bằng xung thần kinh", "B. Bằng hoocmon theo đường máu", "C. Bằng sự co giãn của cơ", "D. Bằng mồ hôi"], "answer": "B", "explain": "Tuyến nội tiết tiết hoocmon vào máu để điều hòa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Da có nhiều lớp tế bào và tuyến mồ hôi cho thấy da thực hiện chức năng gì?", "options": ["A. Bảo vệ và bài tiết", "B. Vận chuyển máu", "C. Tiêu hóa thức ăn", "D. Truyền xung thần kinh"], "answer": "A", "explain": "Da bảo vệ cơ thể và bài tiết mồ hôi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong cấp cứu ngừng tim, ép tim ngoài lồng ngực có tác dụng gì?", "options": ["A. Thay thế hoạt động bơm máu của tim", "B. Làm tim đập lại ngay", "C. Chữa khỏi bệnh tim", "D. Tăng nhịp thở"], "answer": "A", "explain": "Ép lồng ngực tạo áp lực giúp máu lưu thông tạm thời.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Nhận định về mô cơ.", "statements": ["a) Cơ vân gắn với xương giúp vận động theo ý muốn.", "b) Cơ trơn tạo thành nội tạng, hoạt động không theo ý muốn.", "c) Cơ tim chỉ có ở tim, co rút nhịp nhàng.", "d) Cả ba loại cơ đều hoạt động theo ý muốn."], "answer": ["T", "T", "T", "F"], "explain": "Cơ trơn và cơ tim hoạt động không theo ý muốn.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Nhận định về tính thống nhất và hệ mở của cơ thể.", "statements": ["a) Cơ thể lấy thức ăn, nước, oxi từ môi trường.", "b) Cơ thể thải chất cặn bã ra môi trường.", "c) Cơ thể là hệ thống mở, trao đổi với môi trường.", "d) Cơ thể hoạt động hoàn toàn khép kín, không cần môi trường."], "answer": ["T", "T", "T", "F"], "explain": "Cơ thể trao đổi liên tục với môi trường nên là hệ mở.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu ví dụ về sự phối hợp giữa các hệ cơ quan.", "answer": "Khi chạy: vận động, hô hấp, tuần hoàn cùng tăng cường", "explain": "Ví dụ khi chạy nhanh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao nói cơ thể người là một hệ thống mở?", "answer": "Vì cơ thể trao đổi chất và năng lượng với môi trường", "explain": "Lấy thức ăn, oxi và thải chất cặn bã.", "points": 0.5}]}]}
