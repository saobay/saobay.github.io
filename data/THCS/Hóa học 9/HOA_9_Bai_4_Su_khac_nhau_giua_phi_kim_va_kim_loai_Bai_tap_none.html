, "explain": "Iodine có ánh kim loại; các phát biểu còn lại sai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Oxide tạo thành khi phi kim tác dụng với oxygen thường là", "options": ["A. Oxide base", "B. Oxide acid", "C. Oxide lưỡng tính", "D. Oxide trung tính"], "answer": "B", "explain": "Phi kim + O2 → oxide acid (SO2, CO2...).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng 2Na + Cl2 → 2NaCl, chất oxi hóa là", "options": ["A. Na", "B. Cl2", "C. NaCl", "D. Không có"], "answer": "B", "explain": "Cl2 nhận electron nên là chất oxi hóa; Na là chất khử.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định sau.", "statements": ["a) Mức độ hoạt động của halogen: F, Cl, Br, I.", "b) Than chì dùng làm điện cực vì dẫn điện.", "c) Bromine là phi kim ở thể lỏng.", "d) Lưu huỳnh là kim loại."], "answer": ["T", "T", "T", "F"], "explain": "Lưu huỳnh là phi kim.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định sau.", "statements": ["a) Điểm giống nhau của KL và PK là đều tác dụng với O2.", "b) Điểm khác nhau là KL dẻo còn PK giòn.", "c) Oxide KL thường là oxide base, oxide PK thường là oxide acid.", "d) Phi kim tác dụng với dung dịch acid loãng sinh H2."], "answer": ["T", "T", "T", "F"], "explain": "Phi kim không tác dụng với dung dịch acid loãng.", "points": 1}, {"type": "short", "level": "NB", "q": "Hoàn thành phương trình: S + O2 →", "answer": "SO2", "explain": "S + O2 → SO2 (đun nóng).", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu điểm khác nhau cơ bản về tính dẻo giữa kim loại và phi kim.", "answer": "Kim loại dẻo, phi kim giòn", "explain": "Phi kim rắn dễ vỡ vụn.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Sản phẩm của phản ứng S + O2 (đun nóng) là", "options": ["A. SO3", "B. SO2", "C. H2S", "D. S2O"], "answer": "B", "explain": "S + O2 → SO2 (sulfur dioxide).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các chất: Fe, S, O2, NaCl. Chất nào là phi kim?", "options": ["A. Fe", "B. S", "C. NaCl", "D. O2 và S"], "answer": "D", "explain": "S và O2 là phi kim; Fe là kim loại; NaCl là hợp chất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đun nóng 5,6 gam Fe với S dư. Khối lượng FeS thu được là", "options": ["A. 4,4 gam", "B. 8,8 gam", "C. 17,6 gam", "D. 2,2 gam"], "answer": "B", "explain": "nFe = 0,1 mol → mFeS = 8,8 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hỗn hợp X gồm S và C có khối lượng 5,2 gam. Đốt cháy hoàn toàn X thu được 7,437 lít hỗn hợp khí (đkc). Khối lượng S trong X là", "options": ["A. 3,2 gam", "B. 2 gam", "C. 1,6 gam", "D. 4 gam"], "answer": "A", "explain": "Gọi nS = a, nC = b: 32a + 12b = 5,2; a + b = 0,3 → a = 0,1 → mS = 3,2 gam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phi kim nào dẫn điện?", "options": ["A. Lưu huỳnh", "B. Than chì", "C. Oxi", "D. Clo"], "answer": "B", "explain": "Than chì (carbon) là phi kim dẫn điện, dùng làm điện cực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm giống nhau giữa kim loại và phi kim là", "options": ["A. Đều dẻo", "B. Đều dẫn điện", "C. Đều tác dụng được với oxygen", "D. Đều có ánh kim"], "answer": "C", "explain": "Cả kim loại và phi kim đều tác dụng được với oxygen.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) 1,2 gam C cháy hoàn toàn thu 2,479 lít CO2 (đkc).", "b) 11,2 gam Fe cần 6,4 gam S để tạo FeS.", "c) 7,1 gam Cl2 + Na dư thu 11,7 gam NaCl.", "d) Mọi phi kim đều tác dụng với H2."], "answer": ["T", "T", "T", "F"], "explain": "Chỉ một số phi kim (halogen...) tác dụng với H2.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) Hỗn hợp 5,2 gam (S, C) cháy hết thu 7,437 lít khí (đkc) thì mS = 3,2 gam.", "b) Dẫn SO2 vào nước vôi trong dư thu kết tủa CaSO3.", "c) 0,1 mol SO2 tạo 12 gam CaSO3.", "d) SO2 không tác dụng với nước vôi trong."], "answer": ["T", "T", "T", "F"], "explain": "SO2 + Ca(OH)2 → CaSO3 kết tủa + H2O.", "points": 1}, {"type": "short", "level": "VD", "q": "Đốt cháy hoàn toàn 6,4 gam S trong O2 dư, thể tích SO2 thu được ở đkc là bao nhiêu lít?", "answer": "4,958", "explain": "nS = 0,2 mol → V = 4,958 lít.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao nhiệt độ sôi của Br2 cao hơn Cl2?", "answer": "Phân tử khối lớn hơn", "explain": "Tương tác phân tử mạnh hơn.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Khí HCl được tạo thành từ phản ứng nào?", "options": ["A. H2 + Cl2 (ánh sáng)", "B. H2 + O2", "C. Cl2 + H2O", "D. Na + HCl"], "answer": "A", "explain": "H2 + Cl2 → 2HCl khi có ánh sáng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các phi kim F, Cl, Br, I, phi kim hoạt động mạnh nhất là", "options": ["A. I", "B. Br", "C. Cl", "D. F"], "answer": "D", "explain": "F hoạt động mạnh nhất trong các halogen.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đốt cháy hoàn toàn 6,4 gam S trong O2 dư. Thể tích SO2 thu được ở đkc là", "options": ["A. 2,479 lít", "B. 4,958 lít", "C. 7,437 lít", "D. 9,916 lít"], "answer": "B", "explain": "nS = 0,2 mol → VSO2 = 4,958 lít.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong công nghiệp, clo được điều chế bằng cách", "options": ["A. Đun nóng NaCl", "B. Điện phân dung dịch NaCl có màng ngăn", "C. Cho HCl tác dụng với Na", "D. Nung CaCl2"], "answer": "B", "explain": "Điện phân dung dịch NaCl có màng ngăn thu Cl2, H2, NaOH.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Clo ở điều kiện thường tồn tại ở thể", "options": ["A. Rắn", "B. Lỏng", "C. Khí", "D. Rắn và lỏng"], "answer": "C", "explain": "Clo (Cl2) là khí màu vàng lục ở điều kiện thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh tính dẫn điện của đồng và than chì", "options": ["A. Than chì dẫn điện tốt hơn đồng", "B. Đồng dẫn điện tốt hơn than chì", "C. Hai chất dẫn điện như nhau", "D. Cả hai đều không dẫn điện"], "answer": "B", "explain": "Kim loại (đồng) dẫn điện tốt hơn phi kim (than chì).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Điện phân dung dịch NaCl có màng ngăn thu được Cl2.", "b) Clo điều chế trong công nghiệp bằng điện phân.", "c) O2 là phi kim duy trì sự cháy.", "d) CO2 là phi kim."], "answer": ["T", "T", "T", "F"], "explain": "CO2 là hợp chất, không phải phi kim.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) 3,2 gam S cháy trong O2 dư rồi dẫn vào nước vôi trong dư thu 12 gam CaSO3.", "b) Phản ứng của SO2 với Ca(OH)2 tạo kết tủa trắng.", "c) Dư SO2 làm kết tủa tan trở lại.", "d) SO2 là nguyên nhân chính gây mưa acid."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Thể tích Cl2 (đkc) cần để tác dụng hết với 4,6 gam Na là bao nhiêu lít?", "answer": "2,479", "explain": "nCl2 = 0,1 mol → V = 2,479 lít.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hỗn hợp 5,2 gam gồm S và C cháy hoàn toàn thu được 7,437 lít khí (đkc). Khối lượng S là bao nhiêu gam?", "answer": "3,2", "explain": "nS = 0,1 mol → mS = 3,2 gam.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tính chất vật lí nào sau đây là của phi kim?", "options": ["A. Dẻo, dẫn điện tốt", "B. Giòn, không dẫn điện, không có ánh kim", "C. Có ánh kim, dẫn nhiệt tốt", "D. Dẻo, có ánh kim"], "answer": "B", "explain": "Phi kim giòn, không dẫn điện (trừ than chì), không có ánh kim.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho 3,2 gam S tác dụng hết với O2 dư. Thể tích SO2 thu được ở đkc là", "options": ["A. 1,2395 lít", "B. 2,479 lít", "C. 4,958 lít", "D. 7,437 lít"], "answer": "B", "explain": "nS = 0,1 mol → nSO2 = 0,1 mol → V = 2,479 lít.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Để điều chế HCl trong phòng thí nghiệm, người ta cho H2 tác dụng với Cl2 vì", "options": ["A. Phản ứng nhanh khi có ánh sáng", "B. Nguyên liệu rẻ", "C. Không cần điều kiện", "D. Sản phẩm tinh khiết"], "answer": "A", "explain": "H2 + Cl2 → 2HCl xảy ra nhanh khi có ánh sáng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho m gam Na tác dụng hết với Cl2 dư thu được 11,7 gam NaCl. Giá trị m là", "options": ["A. 2,3 gam", "B. 4,6 gam", "C. 6,9 gam", "D. 9,2 gam"], "answer": "B", "explain": "nNaCl = 0,2 mol → nNa = 0,2 mol → mNa = 4,6 gam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sản phẩm của phản ứng C + O2 (đốt cháy) là", "options": ["A. CO", "B. CO2", "C. C2O", "D. Không phản ứng"], "answer": "B", "explain": "C + O2 → CO2 khi đốt cháy hoàn toàn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao bình khí clo trong phòng thí nghiệm phải đậy kín?", "options": ["A. Vì clo nhẹ", "B. Vì clo là khí độc, thoát ra gây nguy hiểm", "C. Vì clo dễ cháy", "D. Vì clo đắt"], "answer": "B", "explain": "Clo là khí độc, phải bảo quản kín.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Đốt 6,4 gam S trong O2 dư thu 4,958 lít SO2 (đkc).", "b) 2,3 gam Na + Cl2 dư thu 5,85 gam NaCl.", "c) 5,6 gam Fe + S dư thu 8,8 gam FeS.", "d) Cần 4,958 lít Cl2 (đkc) để tác dụng hết 4,6 gam Na."], "answer": ["T", "T", "T", "F"], "explain": "nNa = 0,2 mol → nCl2 = 0,1 mol → V = 2,479 lít.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) Nhiệt độ sôi của Br2 cao hơn Cl2 vì phân tử khối lớn hơn.", "b) F là phi kim hoạt động mạnh nhất.", "c) Than chì và kim cương đều là carbon nhưng tính chất khác nhau.", "d) Than chì là kim loại vì dẫn điện."], "answer": ["T", "T", "T", "F"], "explain": "Than chì là phi kim (dạng thù hình của carbon).", "points": 1}, {"type": "short", "level": "VD", "q": "Khí nào sinh ra khi đốt C trong O2 dư?", "answer": "CO2", "explain": "C + O2 → CO2." uefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Khối lượng S cần để tác dụng hết 11,2 gam Fe là 6,4 gam.", "b) 0,1 mol Fe + S dư thu 8,8 gam FeS.", "c) m gam Na + Cl2 dư thu 11,7 gam NaCl thì m = 4,6.", "d) Br2 đẩy được Cl2 ra khỏi dung dịch NaCl."], "answer": ["T", "T", "T", "F"], "explain": "Br yếu hơn Cl nên không đẩy được.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) N2 + O2 → 2NO xảy ra ở điều kiện thường.", "b) Sấm sét tạo điều kiện cho N2 tác dụng với O2.", "c) NO2 là oxide acid.", "d) Mưa acid liên quan đến SO2, NO2."], "answer": ["F", "T", "T", "T"], "explain": "N2 + O2 cần nhiệt độ rất cao (sấm sét), không ở điều kiện thường.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho 2,3 gam Na tác dụng hết với Cl2 dư, khối lượng NaCl thu được là bao nhiêu gam?", "answer": "5,85", "explain": "nNaCl = 0,1 mol → m = 5,85 gam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dẫn SO2 vào nước vôi trong dư thu được kết tủa nào?", "answer": "CaSO3", "explain": "SO2 + Ca(OH)2 → CaSO3 + H2O.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tính chất nào sau đây không phải của phi kim?", "options": ["A. Không dẻo", "B. Không dẫn điện", "C. Có ánh kim", "D. Tồn tại ở nhiều thể"], "answer": "C", "explain": "Phi kim không có ánh kim (trừ iodine).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoàn thành phương trình: S + O2 →", "options": ["A. SO3", "B. SO2", "C. S2O", "D. H2SO4"], "answer": "B", "explain": "S + O2 → SO2 (đun nóng).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thể tích khí Cl2 (đkc) cần để tác dụng hết với 4,6 gam Na là", "options": ["A. 1,2395 lít", "B. 2,479 lít", "C. 4,958 lít", "D. 7,437 lít"], "answer": "A", "explain": "nNa = 0,2 mol → nCl2 = 0,1 mol → V = 2,479 lít.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 0,1 mol Fe tác dụng hết với S dư (đun nóng). Khối lượng FeS thu được là", "options": ["A. 4,4 gam", "B. 8,8 gam", "C. 17,6 gam", "D. 13,2 gam"], "answer": "B", "explain": "nFeS = 0,1 mol → m = 8,8 gam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phi kim tồn tại ở thể lỏng ở nhiệt độ thường là", "options": ["A. Clo", "B. Bromine", "C. Iodine", "D. Lưu huỳnh"], "answer": "B", "explain": "Bromine (Br2) là phi kim ở thể lỏng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phản ứng Fe + S → FeS xảy ra khi", "options": ["A. Để ở nhiệt độ thường", "B. Đun nóng", "C. Có ánh sáng", "D. Trong nước"], "answer": "B", "explain": "Fe + S → FeS cần đun nóng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Phát biểu Mọi phi kim đều không dẫn điện là sai.", "b) Phát biểu Mọi phi kim đều ở thể khí là sai.", "c) Phát biểu Phi kim không tác dụng với kim loại là sai.", "d) Phát biểu Kim loại nào cũng dẻo là sai."], "answer": ["T", "T", "T", "F"], "explain": "Mọi kim loại đều dẻo là phát biểu đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) Iodine thăng hoa từ rắn sang khí.", "b) Iodine có ánh kim nhưng vẫn là phi kim.", "c) Iodine ít tan trong nước, tan tốt trong cồn.", "d) Mọi halogen đều ở thể khí ở điều kiện thường."], "answer": ["T", "T", "T", "F"], "explain": "Br2 lỏng, I2 rắn ở điều kiện thường.", "points": 1}, {"type": "short", "level": "VD", "q": "Đun nóng 5,6 gam Fe với S dư, khối lượng FeS thu được là bao nhiêu gam?", "answer": "8,8", "explain": "nFe = 0,1 mol → mFeS = 8,8 gam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho 4,6 gam Na tác dụng hết với Cl2 dư thu được bao nhiêu gam NaCl?", "answer": "11,7", "explain": "nNaCl = 0,2 mol → m = 11,7 gam.", "points": 0.5}]}]}
