hort", "level": "NB", "q": "Kim loại nào trong các kim loại Cu, Zn, Ag tác dụng được với HCl loãng?", "answer": "Zn", "explain": "Zn đứng trước H; Cu, Ag đứng sau H.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho hỗn hợp Zn và Cu vào HCl dư, chất rắn còn lại là kim loại nào?", "answer": "Đồng", "explain": "Zn tan, Cu không tác dụng với HCl loãng.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Dãy hoạt động hóa học của kim loại được sắp xếp theo chiều", "options": ["A. Khối lượng riêng tăng dần", "B. Mức độ hoạt động hóa học giảm dần", "C. Nhiệt độ nóng chảy tăng dần", "D. Tính dẫn điện giảm dần"], "answer": "B", "explain": "Dãy hoạt động sắp xếp theo chiều mức độ hoạt động hóa học giảm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho 3 kim loại X, Y, Z: X đẩy được Y ra khỏi muối của Y; Z đẩy được X ra khỏi muối của X. Sắp xếp hoạt động giảm dần", "options": ["A. X, Y, Z", "B. Y, X, Z", "C. Z, X, Y", "D. Z, Y, X"], "answer": "C", "explain": "Z mạnh hơn X, X mạnh hơn Y nên thứ tự là Z, X, Y.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho thanh Zn vào dung dịch FeSO4 dư. Sau khi phản ứng hoàn toàn, khối lượng thanh Zn", "options": ["A. Tăng", "B. Giảm vì Zn (65) tan ra nhiều hơn Fe (56) bám vào", "C. Không đổi", "D. Tăng gấp đôi"], "answer": "B", "explain": "Zn + FeSO4 → ZnSO4 + Fe: 65 g tan ra, 56 g bám vào nên giảm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho Fe vào dung dịch hỗn hợp CuSO4 và AgNO3 dư. Sau phản ứng, dung dịch chứa muối nào?", "options": ["A. FeSO4 và Fe(NO3)2", "B. CuSO4 và AgNO3", "C. Fe2(SO4)3", "D. Chỉ có FeSO4"], "answer": "A", "explain": "Fe đẩy hết Cu và Ag ra; dung dịch còn FeSO4 và Fe(NO3)2.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kim loại nào sau đây tác dụng được với dung dịch HCl loãng?", "options": ["A. Cu", "B. Ag", "C. Zn", "D. Au"], "answer": "C", "explain": "Zn đứng trước H nên tác dụng với HCl loãng sinh H2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoàn thành phương trình: Mg + 2HCl →", "options": ["A. MgCl + H2", "B. MgCl2 + H2", "C. MgH2 + Cl2", "D. MgO + 2HCl"], "answer": "B", "explain": "Mg + 2HCl → MgCl2 + H2.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định sau.", "statements": ["a) Hydrogen trong dãy hoạt động làm mốc so sánh.", "b) Pb đứng ngay trước H.", "c) Fe đứng trước Cu trong dãy.", "d) Na đứng sau Mg trong dãy."], "answer": ["T", "T", "T", "F"], "explain": "Na đứng trước Mg trong dãy hoạt động.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định sau.", "statements": ["a) Thứ tự hoạt động giảm dần: Mg, Zn, Fe, Cu.", "b) Al tác dụng với H2SO4 loãng nhanh hơn Fe.", "c) Kim loại R đẩy được Cu khỏi CuSO4 nhưng không đẩy được Zn khỏi ZnSO4 thì R là Fe.", "d) Dùng Fe để thu hồi Cu từ dung dịch CuSO4 trong công nghiệp."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn nhận định đều đúng.", "points": 1}, {"type": "short", "level": "NB", "q": "Viết dãy hoạt động hóa học của các kim loại: K, Na, Mg, Al, Zn, Fe, Pb, H, Cu, Ag, Au theo chiều hoạt động giảm dần.", "answer": "K, Na, Mg, Al, Zn, Fe, Pb, H, Cu, Ag, Au", "explain": "Dãy hoạt động giảm dần từ K đến Au.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu hiện tượng khi cho lá đồng vào dung dịch AgNO3.", "answer": "Có lớp bạc bám trên lá đồng", "explain": "Cu + 2AgNO3 → Cu(NO3)2 + 2Ag.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Phản ứng nào sau đây xảy ra được?", "options": ["A. Cu + 2HCl → CuCl2 + H2", "B. Zn + 2HCl → ZnCl2 + H2", "C. Ag + HCl → AgCl + H2", "D. Au + H2SO4 → AuSO4 + H2"], "answer": "B", "explain": "Zn đứng trước H nên phản ứng xảy ra; Cu, Ag, Au đứng sau H nên không.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không dùng chảo gang để nấu canh chua (có acid)?", "options": ["A. Vì gang quá nặng", "B. Vì sắt trong gang tác dụng với acid làm hỏng chảo và ảnh hưởng sức khỏe", "C. Vì gang không dẫn nhiệt", "D. Vì gang đắt"], "answer": "B", "explain": "Fe + 2H+ → Fe2+ + H2: acid ăn mòn chảo gang.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 5,6 gam Fe tác dụng hết với dung dịch CuSO4 dư. Khối lượng Cu bám vào thanh Fe (giả sử bám hết) là", "options": ["A. 3,2 gam", "B. 6,4 gam", "C. 12,8 gam", "D. 9,6 gam"], "answer": "B", "explain": "nFe = 0,1 mol → nCu = 0,1 mol → mCu = 6,4 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhúng một thanh Fe vào dung dịch CuSO4. Sau một thời gian, khối lượng thanh tăng 0,8 gam. Khối lượng Cu bám vào thanh là", "options": ["A. 3,2 gam", "B. 6,4 gam", "C. 12,8 gam", "D. 1,6 gam"], "answer": "B", "explain": "Mỗi mol Fe → Cu tăng 8 g; tăng 0,8 g ứng 0,1 mol → mCu = 6,4 g.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kim loại hoạt động hóa học yếu nhất trong dãy là", "options": ["A. K", "B. Fe", "C. Au", "D. Cu"], "answer": "C", "explain": "Vàng (Au) đứng cuối dãy nên hoạt động yếu nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để điều chế đồng từ dung dịch CuSO4 trong công nghiệp, có thể dùng kim loại", "options": ["A. Ag", "B. Au", "C. Fe", "D. Pt"], "answer": "C", "explain": "Fe rẻ tiền, đứng trước Cu nên dùng để đẩy Cu ra khỏi dung dịch.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Để thu 12,8 gam Cu từ CuSO4 cần 11,2 gam Fe.", "b) 6,4 gam Cu + AgNO3 dư thu 21,6 gam Ag.", "c) Nhúng Mg vào CuSO4 dư, khối lượng thanh Mg tăng.", "d) Nhúng Fe vào CuSO4, khối lượng thanh Fe giảm."], "answer": ["T", "T", "T", "F"], "explain": "Fe (56) tan ra, Cu (64) bám vào nên khối lượng thanh Fe tăng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) 10 gam hỗn hợp Mg, Cu + HCl dư thu 7,437 lít H2 (đkc) thì %Mg = 72%.", "b) Thanh Fe nhúng CuSO4 tăng 0,8 gam thì có 6,4 gam Cu bám vào.", "c) Dùng tấm Zn bảo vệ đường ống thép th
