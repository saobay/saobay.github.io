B", "q": "Kim loại dẫn điện tốt nhất là kim loại nào?", "answer": "Bạc", "explain": "Bạc (Ag) dẫn điện tốt nhất.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Vonfram được dùng làm dây tóc bóng đèn nhờ tính chất nào?", "answer": "Nhiệt độ nóng chảy cao", "explain": "Vonfram nóng chảy ở 3410°C.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Kim loại nặng nhất là", "options": ["A. Sắt", "B. Chì", "C. Osmium", "D. Vàng"], "answer": "C", "explain": "Osmium (Os) nặng nhất, khối lượng riêng 22,6 g/cm3.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc sắt đẩy được đồng ra khỏi dung dịch CuSO4 chứng tỏ", "options": ["A. Sắt hoạt động hóa học mạnh hơn đồng", "B. Đồng hoạt động mạnh hơn sắt", "C. Sắt và đồng hoạt động như nhau", "D. CuSO4 không bền"], "answer": "A", "explain": "Kim loại mạnh đẩy kim loại yếu ra khỏi dung dịch muối: Fe mạnh hơn Cu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho m gam Zn tác dụng hết với HCl dư thu được 4,958 lít H2 (đkc). Giá trị của m là", "options": ["A. 6,5 gam", "B. 13 gam", "C. 3,25 gam", "D. 26 gam"], "answer": "B", "explain": "nH2 = 0,2 mol → nZn = 0,2 mol → mZn = 0,2 × 65 = 13 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan 8 gam hỗn hợp Fe và Cu trong dung dịch HCl dư thu được 2,479 lít H2 (đkc). Phần trăm khối lượng Fe trong hỗn hợp là", "options": ["A. 35%", "B. 50%", "C. 70%", "D. 30%"], "answer": "C", "explain": "nH2 = 0,1 mol → nFe = 0,1 mol → mFe = 5,6 g → %Fe = 70%.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sản phẩm của phản ứng magnesium cháy trong oxygen là", "options": ["A. Mg(OH)2", "B. MgO", "C. MgCO3", "D. MgCl2"], "answer": "B", "explain": "2Mg + O2 → 2MgO (magnesium oxide, bột trắng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại X tác dụng với dung dịch HCl loãng sinh ra khí H2. X có thể là", "options": ["A. Đồng", "B. Bạc", "C. Kẽm", "D. Vàng"], "answer": "C", "explain": "Kẽm đứng trước H nên tác dụng với HCl sinh H2; Cu, Ag, Au không tác dụng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định sau.", "statements": ["a) Vàng là kim loại dẻo nhất.", "b) Bạc dẫn điện tốt nhất.", "c) Vonfram có nhiệt độ nóng chảy cao nhất.", "d) Sắt là kim loại nhẹ nhất."], "answer": ["T", "T", "T", "F"], "explain": "Kim loại nhẹ nhất là lithium, không phải sắt.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định sau.", "statements": ["a) Bạc dẫn điện tốt hơn đồng nhưng dây điện thường làm bằng đồng vì bạc đắt.", "b) Không nên dùng đồ nhôm đựng acid vì nhôm bị acid ăn mòn.", "c) Vàng làm đồ trang sức vì dẻo, đẹp và bền trong không khí.", "d) Mọi kim loại đều tan trong nước."], "answer": ["T", "T", "T", "F"], "explain": "Chỉ kim loại kiềm và kiềm thổ mới tác dụng với nước.", "points": 1}, {"type": "short", "level": "NB", "q": "Kim loại dẻo nhất là kim loại nào?", "answer": "Vàng", "explain": "Vàng (Au) dẻo nhất, dát được lá mỏng 0,0001 mm.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu hiện tượng khi nhúng đinh sắt vào dung dịch CuSO4.", "answer": "Có lớp đồng đỏ bám trên đinh", "explain": "Dung dịch nhạt màu dần, đồng đỏ bám trên đinh sắt.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Ánh kim của kim loại là hiện tượng", "options": ["A. Bề mặt sáng lấp lánh như gương khi mài nhẵn", "B. Phát ra ánh sáng trong bóng tối", "C. Đổi màu khi đun nóng", "D. Tan chảy thành chất lỏng sáng"], "answer": "A", "explain": "Ánh kim: bề mặt kim loại mài nhẵn sáng lấp lánh như gương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhúng một lá nhôm vào dung dịch CuSO4, hiện tượng là", "options": ["A. Không hiện tượng", "B. Có khí thoát ra", "C. Lá nhôm có lớp đồng đỏ bám vào, dung dịch nhạt màu", "D. Lá nhôm tan hết ngay"], "answer": "C", "explain": "2Al + 3CuSO4 → Al2(SO4)3 + 3Cu: đồng đỏ bám trên lá nhôm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đốt cháy hoàn toàn 4,8 gam Mg trong oxygen dư. Khối lượng MgO thu được là", "options": ["A. 4 gam", "B. 8 gam", "C. 12 gam", "D. 16 gam"], "answer": "B", "explain": "nMg = 0,2 mol → nMgO = 0,2 mol → mMgO = 0,2 × 40 = 8 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhúng thanh Zn vào dung dịch CuSO4 một thời gian. Khối lượng thanh Zn sẽ", "options": ["A. Tăng", "B. Giảm vì Zn (65) tan ra nhiều hơn Cu (64) bám vào", "C. Không đổi", "D. Tăng gấp đôi"], "answer": "B", "explain": "Mỗi mol Zn (65 g) tan ra chỉ có 1 mol Cu (64 g) bám vào nên thanh nhẹ đi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kim loại nào dẻo nhất?", "options": ["A. Sắt", "B. Đồng", "C. Vàng", "D. Nhôm"], "answer": "C", "explain": "Vàng (Au) là kim loại dẻo nhất, 1 gam vàng dát được lá mỏng 0,0001 mm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để bảo quản kim loại natri trong phòng thí nghiệm, người ta", "options": ["A. Để ngoài không khí", "B. Ngâm trong dầu hỏa", "C. Ngâm trong nước", "D. Để trong acid"], "answer": "B", "explain": "Na tác dụng với O2 và hơi nước trong không khí nên ngâm trong dầu hỏa.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Nhúng thanh Fe vào CuSO4, khối lượng thanh Fe tăng lên.", "b) 5,6 gam Fe tác dụng hết với HCl thu được 2,479 lít H2 (đkc).", "c) Đốt 4,8 gam Mg trong O2 dư thu được 8 gam MgO.", "d) Kẽm đẩy được sắt ra khỏi dung dịch FeSO4."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn nhận định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) Cho Fe vào dung dịch ZnSO4 không xảy ra phản ứng.", "b) Cho Zn vào dung dịch FeSO4 xảy ra phản ứng.", "c) Hai hiện tượng trên chứng tỏ Zn hoạt động mạnh hơn Fe.", "d) Cu đẩy được Zn ra khỏi dung dịch ZnSO4."], "answer": ["T", "T", "T", "F"], "explain": "Cu yếu hơn Zn nên không đẩy được Zn ra khỏi muối.", "points": 1}, {"type": "short", "level": "VD", ìm trong nước", "B. Lithium nổi trên mặt nước", "C. Lithium tan trong nước", "D. Lithium nặng hơn sắt"], "answer": "B", "explain": "Khối lượng riêng của Li nhỏ hơn nước (1 g/cm3) nên Li nổi trên nước.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Đốt 2,7 gam Al trong Cl2 dư thu 13,35 gam AlCl3.", "b) Cho Na vào nước thấy natri chạy trên mặt nước và có khí thoát ra.", "c) Không dùng thùng sắt đựng dung dịch CuSO4.", "d) Bạc bị oxi hóa nhanh trong không khí như sắt."], "answer": ["T", "T", "T", "F"], "explain": "Bạc hoạt động yếu, bền trong không khí, không bị gỉ như sắt.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) Vàng tồn tại dạng tự do trong tự nhiên vì hoạt động hóa học yếu.", "b) Nhúng Fe vào AgNO3 dư, khối lượng thanh Fe tăng mạnh.", "c) Dây tóc bóng đèn làm bằng vonfram vì vonfram dẫn điện tốt nhất.", "d) Natri phải ngâm trong dầu hỏa khi bảo quản."], "answer": ["T", "T", "F", "T"], "explain": "Vonfram được dùng vì nhiệt độ nóng chảy cao, không phải vì dẫn điện tốt nhất.", "points": 1}, {"type": "short", "level": "VD", "q": "Nhúng thanh Fe vào dung dịch CuSO4 một thời gian, khối lượng thanh Fe tăng hay giảm?", "answer": "Tăng", "explain": "56 gam Fe tan ra, 64 gam Cu bám vào nên tăng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hòa tan hoàn toàn 5,4 gam Al trong H2SO4 loãng dư, thể tích H2 thu được ở đkc là bao nhiêu lít?", "answer": "7,437", "explain": "nH2 = 0,3 mol → V = 7,437 lít.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong phản ứng Fe + 2HCl → FeCl2 + H2, chất khử là", "options": ["A. HCl", "B. Fe", "C. FeCl2", "D. H2"], "answer": "B", "explain": "Fe nhường electron (số oxi hóa tăng từ 0 lên +2) nên Fe là chất khử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các kim loại Na, Fe, Cu, Au, kim loại tác dụng mãnh liệt với nước ở nhiệt độ thường là", "o
