B", "explain": "n este = 0,1 mol → m = 0,1 × 88 = 8,8 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 0,3 mol C2H5OH cháy hoàn toàn. Thể tích O2 (đkc) cần dùng là", "options": ["A. 7,437 lít", "B. 14,874 lít", "C. 22,311 lít", "D. 29,748 lít"], "answer": "C", "explain": "nO2 = 0,9 mol → V = 22,311 lít.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Rượu methanol nguy hiểm vì", "options": ["A. Đắt tiền", "B. Rất độc, gây mù và tử vong", "C. Khó cháy", "D. Có mùi khó chịu"], "answer": "B", "explain": "Methanol rất độc, uống phải gây mù, tử vong.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để nhận biết ethylic alcohol, có thể", "options": ["A. Đốt cháy (cháy với lửa xanh)", "B. Dùng quỳ tím", "C. Dùng dung dịch Br2", "D. Dùng nước vôi trong"], "answer": "A", "explain": "Rượu cháy với ngọn lửa xanh đặc trưng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) 0,2 mol C2H5OH + Na dư thu 2,479 lít H2 (đkc).", "b) Đốt 0,15 mol C2H5OH thu 7,437 lít CO2 (đkc).", "c) Đốt m gam C2H5OH thu 8,8 gam CO2 thì m = 4,6.", "d) 0,3 mol C2H5OH cháy cần 14,874 lít O2 (đkc)."], "answer": ["T", "T", "T", "F"], "explain": "nO2 = 0,9 mol → V = 22,311 lít.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) C2H5OH là dẫn xuất của hydrocarbon.", "b) CH3-CH2-OH và CH3-O-CH3 là đồng phân.", "c) Hai chất trên có tính chất khác nhau.", "d) Hai chất trên đều là alcohol."], "answer": ["T", "T", "T", "F"], "explain": "CH3-O-CH3 là ether, không phải alcohol.", "points": 1}, {"type": "short", "level": "VD", "q": "Đốt 4,6 gam C2H5OH thu được bao nhiêu lít CO2 (đkc)?", "answer": "4,958", "explain": "nCO2 = 0,2 mol.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Pha 250 mL rượu 60° từ rượu 90° cần bao nhiêu mL rượu 90°?", "answer": "166,7", "explain": "150/0,9 = 166,7 mL.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Ethylic alcohol có trong", "options": ["A. Xăng E5", "B. Nước cất", "C. Dầu ăn", "D. Giấm ăn"], "answer": "A", "explain": "Xăng E5 chứa 5% ethanol sinh học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ethylic alcohol tan vô hạn trong nước còn ethane thì không?", "options": ["A. Vì rượu là chất lỏng", "B. Vì nhóm -OH tạo liên kết hydrogen với nước", "C. Vì rượu nhẹ hơn nước", "D. Vì rượu có màu"], "answer": "B", "explain": "Liên kết hydrogen giúp rượu tan tốt trong nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ester hóa 6 gam CH3COOH với 4,6 gam C2H5OH (H = 100%). Khối lượng este thu được là", "options": ["A. 8,8 gam", "B. 4,4 gam", "C. 13,2 gam", "D. 17,6 gam"], "answer": "A", "explain": "Cả hai đều 0,1 mol → m este = 8,8 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hỗn hợp X gồm C2H5OH và CH3COOH. Cho Na dư vào X thu được 4,958 lít H2 (đkc). Nếu cho X tác dụng với CaCO3 dư thu được 2,479 lít CO2 (đkc). Khối lượng C2H5OH trong X là", "options": ["A. 4,6 gam", "B. 9,2 gam", "C. 13,8 gam", "D. 2,3 gam"], "answer": "B", "explain": "nCO2 = 0,1 → n acid = 0,2; n rượu + n acid = 0,4 → n rượu = 0,2 → m = 9,2 gam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sản phẩm ester CH3COOC2H5 có đặc điểm", "options": ["A. Mùi thơm", "B. Mùi hắc", "C. Không mùi", "D. Mùi tanh"], "answer": "A", "explain": "Ethyl acetate có mùi thơm, dùng làm hương liệu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao rượu để lâu trong chai mở nắp bị nhạt dần?", "options": ["A. Vì rượu bay hơi", "B. Vì rượu bị oxi hóa", "C. Vì rượu đông đặc", "D. Vì chai bị hỏng"], "answer": "A", "explain": "Rượu dễ bay hơi (sôi ở 78,3°C).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Pha 500 mL rượu 40° cần 200 mL rượu nguyên chất.", "b) m gam C2H5OH + Na dư thu 3,7185 lít H2 thì m = 13,8.", "c) Đốt 2,3 gam C2H5OH thu 2,7 gam H2O.", "d) Ester hóa 6 gam CH3COOH
