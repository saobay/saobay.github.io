 → Cu + 2H2O"], "answer": "A", "explain": "CuO + H2 → Cu + H2O ở nhiệt độ cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong tự nhiên, vàng tồn tại chủ yếu ở dạng", "options": ["A. Quặng oxide", "B. Muối", "C. Tự do (đơn chất)", "D. Hợp chất sulfide"], "answer": "C", "explain": "Vàng hoạt động yếu nên tồn tại dạng tự do trong tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hợp kim Y chứa 99,2% Fe và 0,8% C. Y là", "options": ["A. Gang", "B. Thép", "C. Inox", "D. Sắt nguyên chất"], "answer": "B", "explain": "Hàm lượng C dưới 2% nên Y là thép.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khử hoàn toàn 4 gam CuO bằng CO dư. Thể tích CO đã phản ứng ở đkc là", "options": ["A. 1,2395 lít", "B. 2,479 lít", "C. 4,958 lít", "D. 7,437 lít"], "answer": "A", "explain": "nCuO = 0,05 mol → nCO = 0,05 mol → V = 1,2395 lít.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tắc tách kim loại khỏi hợp chất là", "options": ["A. Oxi hóa ion kim loại", "B. Khử ion kim loại thành kim loại tự do", "C. Hòa tan quặng trong nước", "D. Nung quặng đến nóng chảy"], "answer": "B", "explain": "Nguyên tắc: khử ion kim loại Mn+ + ne → M.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho 5,6 gam Fe tác dụng hết với dung dịch CuSO4 dư (thủy luyện). Khối lượng Cu thu được là", "options": ["A. 3,2 gam", "B. 6,4 gam", "C. 12,8 gam", "D. 9,6 gam"], "answer": "B", "explain": "nFe = 0,1 mol → mCu = 6,4 gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về hợp kim.", "statements": ["a) Hợp kim cứng hơn kim loại nguyên chất.", "b) Gang là hợp kim Fe với C (2–5%).", "c) Thép là hợp kim Fe với C (dưới 2%).", "d) Inox là hợp kim của đồng."], "answer": ["T", "T", "T", "F"], "explain": "Inox là hợp kim của sắt (Fe, Cr, Ni).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định sau.", "statements": ["a) Al2O3 rất bền nên không thể dùng C khử ở nhiệt độ thường.", "b) K, Na, Ca, Mg, y dựng, chế tạo dụng cụ", "D. Làm pin"], "answer": "C", "explain": "Thép cứng, bền, dẻo nên dùng trong xây dựng và cơ khí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao luyện nhôm tốn nhiều điện năng?", "options": ["A. Vì nhôm nhẹ", "B. Vì Al2O3 rất bền, cần điện phân nóng chảy ở nhiệt độ cao", "C. Vì nhôm đắt", "D. Vì quặng nhôm hiếm"], "answer": "B", "explain": "Phá vỡ liên kết trong Al2O3 cần nhiều năng lượng điện.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) m gam Al + Fe2O3 dư thu 11,2 gam Fe thì m = 5,4.", "b) 6,4 gam Cu + AgNO3 dư thu 21,6 gam Ag.", "c) Phương pháp thủy luyện dùng KL mạnh đẩy KL yếu khỏi dung dịch.", "d) Điện phân dung dịch AlCl3 thu được Al kim loại."], "answer": ["T", "T", "T", "F"], "explain": "Trong dung dịch, nước bị điện phân trước nên không thu được Al.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) Thứ tự phù hợp: điện phân – KL mạnh; nhiệt luyện – KL trung bình, yếu.", "b) Au không cần tách vì tồn tại dạng tự do.", "c) Cryolite chỉ có tác dụng tạo màu cho Al.", "d) Than cốc trong lò cao tạo ra CO khử quặng."], "answer": ["T", "T", "F", "T"], "explain": "Cryolite hạ nhiệt độ nóng chảy của Al2O3.", "points": 1}, {"type": "short", "level": "VD", "q": "Điện phân nóng chảy 10,2 gam Al2O3, khối lượng Al thu được là bao nhiêu gam?", "answer": "5,4", "explain": "nAl = 0,2 mol → mAl = 5,4 gam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện phân nóng chảy 11,1 gam CaCl2, khối lượng Ca thu được là bao nhiêu gam?", "answer": "4", "explain": "nCa = 0,1 mol → mCa = 4 gam.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Phương pháp thủy luyện là", "options": ["A. Dùng kim loại mạnh đẩy kim loại yếu ra khỏi dung dịch muối", "B. Dùng nước hòa tan quặng", "C. Nung quặng với than", "D. Điện phân dung dịch muối"], "answer": "A", "explain": "Thủy luyện: KL
