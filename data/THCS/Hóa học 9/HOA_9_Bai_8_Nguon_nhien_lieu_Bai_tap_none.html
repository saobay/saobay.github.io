q": "Biogas được tạo ra từ", "options": ["A. Dầu mỏ", "B. Chất thải hữu cơ lên men", "C. Than đá", "D. Nước biển"], "answer": "B", "explain": "Biogas từ quá trình lên men chất thải hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để phòng ngộ độc CO khi dùng bếp than trong phòng kín, cần", "options": ["A. Đóng kín cửa", "B. Mở cửa thông thoáng", "C. Đốt thêm than", "D. Ngủ gần bếp"], "answer": "B", "explain": "Thông thoáng giúp CO thoát ra ngoài.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về nhiên liệu.", "statements": ["a) Nhiên liệu là chất cháy được, tỏa nhiệt.", "b) Than đá, dầu mỏ, khí thiên nhiên là nhiên liệu hóa thạch.", "c) Nhiên liệu hóa thạch tái tạo nhanh.", "d) CO2 gây hiệu ứng nhà kính."], "answer": ["T", "T", "F", "T"], "explain": "Hóa thạch không tái tạo trong thời gian ngắn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định sau.", "statements": ["a) Dùng bếp than trong phòng kín phải mở cửa thông thoáng.", "b) CO gây ngộ độc vì kết hợp với hemoglobin.", "c) Bảo dưỡng bếp gas giúp cháy hoàn toàn.", "d) Để đèn sáng cả ngày giúp tiết kiệm điện."], "answer": ["T", "T", "T", "F"], "explain": "Để đèn sáng cả ngày lãng phí điện.", "points": 1}, {"type": "short", "level": "NB", "q": "Khí nào gây mưa acid?", "answer": "SO2", "explain": "Sulfur dioxide.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nên để ngọn lửa gas màu gì khi đun nấu?", "answer": "Màu xanh", "explain": "Lửa xanh là cháy hoàn toàn.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Ngọn lửa gas màu xanh chứng tỏ", "options": ["A. Gas cháy hoàn toàn", "B. Gas cháy thiếu oxygen", "C. Gas bị hỏng", "D. Bếp bị bẩn"], "answer": "A", "explain": "Lửa xanh là cháy hoàn toàn, hiệu quả nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các nước khuyến khích dùng xe điện?", "options": ["A. Vì xe điện đẹp", "B. Vì giảm khí thải CO2, bảo vệ môi trường", "C. Vì xe điện rẻ", "D. Vì xe điện chạy nhanh hơn"], "answer": "B", "explain": "Xe điện không thải CO2 trực tiếp khi vận hành.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đốt cháy hoàn toàn 3,2 gam CH4. Nhiệt lượng tỏa ra (biết 1 mol CH4 tỏa 890 kJ) là", "options": ["A. 89 kJ", "B. 178 kJ", "C. 356 kJ", "D. 890 kJ"], "answer": "B", "explain": "nCH4 = 0,2 mol → Q = 0,2 × 890 = 178 kJ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một bếp gas hiệu suất 60%, đun 1 lít nước từ 25°C đến 100°C (cần 315 kJ). Khối lượng gas (C3H8, nhiệt cháy 2220 kJ/mol) cần dùng là", "options": ["A. 10,4 gam", "B. 5,2 gam", "C. 20,8 gam", "D. 15,6 gam"], "answer": "A", "explain": "Cần 315/0,6 = 525 kJ → n = 0,236 mol → m = 10,4 gam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao không nên đốt rơm rạ ngoài đồng?", "options": ["A. Vì tốn công", "B. Vì gây khói bụi ô nhiễm, lãng phí", "C. Vì rơm không cháy", "D. Vì rơm đắt"], "answer": "B", "explain": "Đốt rơm gây khói bụi, ô nhiễm và lãng phí tài nguyên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây đúng?", "options": ["A. Nhiên liệu hóa thạch là vô tận", "B. Nên chuyển dần sang năng lượng tái tạo", "C. Đốt than không gây ô nhiễm", "D. CO không độc"], "answer": "B", "explain": "Hóa thạch cạn kiệt dần nên cần năng lượng tái tạo.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Dùng Ca(OH)2 để xử lí SO2 trong khí thải.", "b) Rừng quang hợp hấp thụ CO2, thải O2.", "c) Hydrogen có nhiệt cháy riêng lớn nhất.", "d) Xe buýt nên dùng than đá."], "answer": ["T", "T", "T", "F"], "explain": "Xe buýt nên dùng CNG/biogas sạch hơn.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) CO2 có thể được chuyển hóa thành nhiên liệu.", "b) Công nghệ thu giữ CO2 đang được nghiên cứu.", "c) Giảm CO2 là mục tiêu toàn cầu.", "d) CO2 hoàn toàn vô hại."], "answer": ["T", "T", "T", "F"], "explain": "CO2 dư gây hiệu ứng nhà kính.", "points": 1}, {"type": "short", "level": "VD", "q": "Chất nào cháy không sinh CO2?", "answer": "H2", "explain": "2H2 + O2 → 2H2O.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "1 triệu xe máy, mỗi xe thải 2 kg CO2/ngày. Tổng CO2 một năm là bao nhiêu tấn?", "answer": "730000", "explain": "2000 tấn/ngày × 365.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Xăng E5 là xăng pha", "options": ["A. 5% nước", "B. 5% ethanol sinh học", "C. 5% dầu", "D. 5% chì"], "answer": "B", "explain": "Xăng E5 chứa 5% ethanol sinh học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để giảm ùn tắc và khí thải, nên", "options": ["A. Mỗi người một xe máy", "B. Dùng phương tiện công cộng, xe đạp", "C. Đốt nhiều xăng", "D. Mở thêm cây xăng"], "answer": "B", "explain": "Giao thông công cộng giảm khí thải.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đốt cháy 1 kg than đá (coi như C) tạo ra bao nhiêu kg CO2?", "options": ["A. 1,83 kg", "B. 3,67 kg", "C. 2,75 kg", "D. 0,92 kg"], "answer": "B", "explain": "nC = 83,3 mol → mCO2 = 83,3 × 44 = 3,67 kg.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một thành phố có 1 triệu xe máy, mỗi xe thải 2 kg CO2/ngày. Tổng CO2 một năm là", "options": ["A. 730.000 tấn", "B. 73.000 tấn", "C. 7.300.000 tấn", "D. 7.300 tấn"], "answer": "A", "explain": "2 triệu kg/ngày = 2000 tấn/ngày → 730.000 tấn/năm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khí gây mưa acid khi đốt than đá là", "options": ["A. CO2", "B. SO2", "C. O2", "D. N2"], "answer": "B", "explain": "SO2 tạo mưa acid.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đốt than đá gây mưa acid?", "options": ["A. Vì than chứa lưu huỳnh, cháy tạo SO2", "B. Vì than chứa carbon", "C. Vì than ướt", "D. Vì than có màu đen"], "answer": "A", "explain": "Lưu huỳnh trong than cháy tạo SO2 gây mưa acid.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Đốt 3,2 gam CH4 (890 kJ/mol) tỏa 178 kJ.", "b) Đốt 1 kg than (C) tạo 3,67 kg CO2.", "c) Nhà máy thải 440 kg CO2/ngày ứng với 10000 mol.", "d) Đốt 1 kg than tạo 1 kg CO2."], "answer": ["T", "T", "T", "F"], "explain": "1 kg C tạo 3,67 kg CO2.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) 1 triệu xe máy (2 kg CO2/ngày/xe) thải 730.000 tấn CO2/năm.", "b) Cần 73.000 ha rừng để hấp thụ lượng CO2 trên.", "c) Nhiên liệu hóa thạch tái tạo trong vài năm là sai.", "d) Hydrogen cháy tạo CO2."], "answer": ["T", "T", "T", "F"], "explain": "Hydrogen cháy chỉ tạo nước.", "points": 1}, {"type": "short", "level": "VD", "q": "Đốt 3,2 gam CH4 (tỏa 890 kJ/mol) thì nhiệt lượng tỏa ra là bao nhiêu kJ?", "answer": "178", "explain": "0,2 × 890 = 178 kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao hydrogen được gọi là nhiên liệu sạch?", "answer": "Cháy chỉ tạo nước", "explain": "Không sinh CO2.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Năng lượng tái tạo gồm", "options": ["A. Than đá, dầu mỏ", "B. Mặt trời, gió, thủy điện", "C. Khí thiên nhiên", "D. Xăng, dầu"], "answer": "B", "explain": "Mặt trời, gió, nước là năng lượng tái tạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong gia đình, cách tiết kiệm gas là", "options": ["A. Để lửa to nhất", "B. Chỉnh lửa vừa đủ, đậy nắp nồi, khóa van khi xong", "C. Mở van cả ngày", "D. Đun nước bằng gas thay vì điện"], "answer": "B", "explain": "Lửa vừa, đậy nắp giúp tiết kiệm gas.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trồng 1 ha rừng một năm hấp thụ khoảng 10 tấn CO2. Để bù 440 kg CO2/ngày của nhà máy cần bao nhiêu ha?", "options": ["A. 4,4 ha", "B. 16 ha", "C. 44 ha", "D. 160 ha"], "answer": "B", "explain": "CO2/năm = 160,6 tấn → cần ~16 ha.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao hydrogen được gọi là nhiên liệu sạch?", "options": ["A. Vì nhẹ", "B. Vì cháy chỉ tạo nước, không có CO2", "C. Vì rẻ", "D. Vì dễ sản xuất"], "answer": "B", "explain": "2H2 + O2 → 2H2O.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hydrogen xanh được xem là nhiên liệu của tương lai vì", "options": ["A. Rẻ tiền", "B. Khi cháy chỉ tạo nước, không gây ô nhiễm", "C. Dễ vận chuyển", "D. Có sẵn trong không khí"], "answer": "B", "explain": "2H2 + O2 → 2H2O: sản phẩm chỉ là nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh than đá và biogas, nhiên liệu nào thân thiện môi trường hơn? Vì sao?", "options": ["A. Than đá vì rẻ", "B. Biogas vì tái tạo và ít khí độc hơn", "C. Như nhau", "D. Than đá vì cháy lâu"], "answer": "B", "explain": "Biogas tái tạo được, cháy sạch hơn than đá.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Bếp gas hiệu suất càng cao càng tiết kiệm.", "b) Cháy hoàn toàn tỏa nhiệt nhiều nhất.", "c) Lửa vàng kèm muội là cháy thiếu O2.", "d) Cháy thiếu O2 an toàn hơn cháy hoàn toàn."], "answer": ["T", "T", "T", "F"], "explain": "Cháy thiếu O2 sinh CO độc, nguy hiểm.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) Phát triển bền vững cần tăng tỉ trọng năng lượng tái tạo.", "b) Nhà máy nhiệt điện than nên đặt xa khu dân cư.", "c) Biogas giúp giảm chất thải chăn nuôi.", "d) Nên chỉ dùng than đá vì rẻ."], "answer": ["T", "T", "T", "F"], "explain": "Chỉ dùng than đá gây cạn kiệt và ô nhiễm.", "points": 1}, {"type": "short", "level": "VD", "q": "Nhiên liệu nào có nhiệt cháy riêng lớn nhất?", "answer": "Hydrogen", "explain": "~120 MJ/kg.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu một lợi ích khi thay bếp than bằng bếp biogas.", "answer": "Giảm khói bụi", "explain": "Tận dụng chất thải chăn nuôi.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khí thiên nhiên chứa chủ yếu là", "options": ["A. CO", "B. CH4", "C. H2", "D. O2"], "answer": "B", "explain": "Khí thiên nhiên chứa ~95% methane.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chất nào sau đây khi cháy không sinh CO2?", "options": ["A. CH4", "B. C2H5OH", "C. H2", "D. C3H8"], "answer": "C", "explain": "2H2 + O2 → 2H2O: không sinh CO2.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhiên liệu nào cho nhiệt lượng lớn nhất trên cùng khối lượng?", "options": ["A. Than đá", "B. Xăng", "C. Hydrogen", "D. Củi"], "answer": "C", "explain": "Hydrogen có nhiệt cháy riêng lớn nhất (~120 MJ/kg).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao các nhà máy nhiệt điện than thường đặt xa khu dân cư?", "options": ["A. Vì than nặng", "B. Vì khói bụi, khí thải ảnh hưởng sức khỏe", "C. Vì cần nhiều nước", "D. Vì than rẻ ở xa"], "answer": "B", "explain": "Khí thải than gây ô nhiễm, ảnh hưởng sức khỏe.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiên liệu sạch, tái tạo là", "options": ["A. Than đá", "B. Dầu mỏ", "C. Biogas, ethanol sinh học", "D. Khí thiên nhiên"], "answer": "C", "explain": "Biogas, ethanol sinh học là nhiên liệu tái tạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao xăng E5 thân thiện môi trường hơn xăng thường?", "options": ["A. Vì rẻ hơn", "B. Vì pha ethanol sinh học, giảm khí thải độc", "C. Vì có màu đẹp", "D. Vì cháy lâu hơn"], "answer": "B", "explain": "Ethanol sinh học giúp cháy sạch hơn, giảm khí thải.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) Giao thông công cộng giúp giảm khí thải.", "b) Mỗi người một xe máy làm tăng ô nhiễm.", "c) Đi xe đạp thân thiện môi trường.", "d) Kẹt xe giúp tiết kiệm xăng."], "answer": ["T", "T", "T", "F"], "explain": "Kẹt xe làm tốn xăng hơn.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) Tiết kiệm năng lượng là trách nhiệm của mọi người.", "b) Tắt điện khi ra khỏi phòng giúp tiết kiệm.", "c) Dùng bóng đèn LED tiết kiệm hơn đèn sợi đốt.", "d) Lãng phí năng lượng không ảnh hưởng gì."], "answer": ["T", "T", "T", "F"], "explain": "Lãng phí năng lượng gây cạn kiệt tài nguyên.", "points": 1}, {"type": "short", "level": "VD", "q": "Dùng chất nào để xử lí SO2 trong khí thải?", "answer": "Ca(OH)2", "explain": "SO2 + Ca(OH)2 → CaSO3 + H2O.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao nhà máy nhiệt điện than thường đặt xa khu dân cư?", "answer": "Khí thải độc hại", "explain": "Khói bụi, SO2 ảnh hưởng sức khỏe.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Để nhiên liệu cháy hoàn toàn cần", "options": ["A. Thiếu oxygen", "B. Cung cấp đủ oxygen", "C. Nhiệt độ thấp", "D. Không có gió"], "answer": "B", "explain": "Đủ oxygen giúp cháy hoàn toàn, tỏa nhiệt nhiều nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mưa acid gây hại gì?", "options": ["A. Làm cây cối tươi tốt", "B. Ăn mòn công trình, hại cây trồng, đất và nước", "C. Làm không khí sạch", "D. Không gây hại"], "answer": "B", "explain": "Mưa acid ăn mòn, gây hại môi trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một ô tô thải 2,2 kg CO2 khi chạy 10 km. Khối lượng xăng (coi như C8H18) đã đốt là", "options": ["A. 0,7 kg", "B. 1,4 kg", "C. 2,1 kg", "D. 0,35 kg"], "answer": "A", "explain": "nCO2 = 50 mol → nC8H18 = 6,25 mol → m ≈ 0,7 kg.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biện pháp nào không giúp tiết kiệm nhiên liệu?", "options": ["A. Dùng bếp hiệu suất cao", "B. Tắt thiết bị khi không dùng", "C. Để đèn sáng cả ngày", "D. Bảo dưỡng định kì"], "answer": "C", "explain": "Để đèn sáng cả ngày lãng phí điện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiên liệu là", "options": ["A. Chất cháy được, khi cháy tỏa nhiệt và phát sáng", "B. Mọi chất lỏng", "C. Chất không cháy được", "D. Chất chỉ dùng trong phòng thí nghiệm"], "answer": "A", "explain": "Nhiên liệu là chất cháy được, tỏa nhiệt khi cháy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiện tượng hiệu ứng nhà kính gây ra", "options": ["A. Trái Đất lạnh đi", "B. Trái Đất nóng lên", "C. Mưa nhiều hơn", "D. Không ảnh hưởng"], "answer": "B", "explain": "CO2 giữ nhiệt làm Trái Đất nóng lên.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định sau.", "statements": ["a) 12 kg gas (C3H8)/tháng thải khoảng 36 kg CO2.", "b) Ô tô thải 2,2 kg CO2/10 km đã đốt ~0,7 kg xăng.", "c) Để bù 440 kg CO2/ngày cần ~16 ha rừng.", "d) Trồng rừng làm tăng CO2."], "answer": ["T", "T", "T", "F"], "explain": "Trồng rừng giúp hấp thụ CO2.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định sau.", "statements": ["a) Thay bếp than bằng biogas giảm khói bụi.", "b) Biogas tận dụng chất thải chăn nuôi.", "c) Năng lượng tái tạo phụ thuộc thời tiết.", "d) Năng lượng tái tạo gây ô nhiễm nặng."], "answer": ["T", "T", "T", "F"], "explain": "Năng lượng tái tạo sạch, ít ô nhiễm.", "points": 1}, {"type": "short", "level": "VD", "q": "Đốt 1 kg than (coi như C) tạo ra bao nhiêu kg CO2?", "answer": "3,67", "explain": "83,3 mol × 44 = 3,67 kg.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Để phát triển bền vững về năng lượng, quốc gia nên làm gì?", "answer": "Tăng năng lượng tái tạo", "explain": "Đa dạng nguồn, tăng tỉ trọng tái tạo.", "points": 0.5}]}]}
