 là copper(II) oxide.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 3,2 gam Cu tác dụng hết với oxygen (2Cu + O2 → 2CuO). Khối lượng CuO (M = 80) thu được là:", "options": ["A. 8 gam", "B. 4 gam", "C. 16 gam", "D. 2 gam"], "answer": "B", "explain": "n_Cu = 0,05 mol; n_CuO = 0,05 mol; m = 4 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khử 16 gam Fe2O3 bằng H2 dư (Fe2O3 + 3H2 → 2Fe + 3H2O). Khối lượng Fe (M = 56) thu được là:", "options": ["A. 5,6 gam", "B. 28 gam", "C. 11,2 gam", "D. 2,8 gam"], "answer": "C", "explain": "n_Fe2O3 = 0,1 mol; n_Fe = 0,2 mol; m = 11,2 gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về cách gọi tên oxide.", "statements": ["a) FeO có tên là iron(II) oxide.", "b) Fe2O3 có tên là iron(III) oxide.", "c) Số La Mã chỉ hóa trị của kim loại.", "d) Mọi oxide đều được gọi tên bằng số La Mã."], "answer": ["T", "T", "T", "F"], "explain": "Chỉ kim loại nhiều hóa trị mới dùng số La Mã.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về hóa trị trong oxide.", "statements": ["a) Hóa trị của O trong oxide là II.", "b) Tổng hóa trị các nguyên tố trong oxide bằng 0.", "c) Trong CO2, C có hóa trị IV.", "d) Trong SO2, S có hóa trị VI."], "answer": ["T", "T", "T", "F"], "explain": "Trong SO2, S có hóa trị IV.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu tên oxide có công thức MgO.", "answer": "Magnesium oxide", "explain": "MgO là magnesium oxide.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Hoàn thành PTHH: MgO + HCl → ...", "answer": "MgO + 2HCl → MgCl2 + H2O", "explain": "PTHH: MgO + 2HCl → MgCl2 + H2O.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Chất nào sau đây là oxide acid?", "options": ["A. SO2", "B. Na2O", "C. CaO", "D. MgO"], "answer": "A", "explain": "SO2 là oxide acid.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất nào sau đây là oxide base?", "options": ["A. CO2", "B. CuO", "C. SO3", "D. P2O5"], "answer": "B", "explain": "CuO là oxide base.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho oxide X tác dụng với nước tạo thành dung dịch làm quỳ tím hóa đỏ. X là:", "options": ["A. Na2O", "B. CaO", "C. SO2", "D. MgO"], "answer": "C", "explain": "SO2 + H2O → H2SO3 làm quỳ tím hóa đỏ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho oxide Y tác dụng với nước tạo thành dung dịch làm quỳ tím hóa xanh. Y là:", "options": ["A. CO2", "B. SO2", "C. P2O5", "D. CaO"], "answer": "D", "explain": "CaO + H2O → Ca(OH)2 làm quỳ tím hóa xanh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 14,2 gam P2O5 tác dụng hết với nước (P2O5 + 3H2O → 2H3PO4). Khối lượng H3PO4 (M = 98) thu được là:", "options": ["A. 9,8 gam", "B. 4,9 gam", "C. 19,6 gam", "D. 2,45 gam"], "answer": "C", "explain": "n_P2O5 = 0,1 mol; n_H3PO4 = 0,2 mol; m = 19,6 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 20 gam CaCO3 tác dụng hết với HCl (CaCO3 + 2HCl → CaCl2 + CO2 + H2O). Thể tích CO2 ở đkc thu được là:", "options": ["A. 2,479 L", "B. 12,395 L", "C. 6,1975 L", "D. 4,958 L"], "answer": "D", "explain": "n_CO2 = 0,2 mol; V = 0,2 × 24,79 = 4,958 L.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về tính chất của CO2.", "statements": ["a) Khí CO2 làm đục nước vôi trong.", "b) SO2 là một trong các khí gây mưa acid.", "c) CaO được gọi là vôi sống.", "d) CO2 là oxide base."], "answer": ["T", "T", "T", "F"], "explain": "CO2 là oxide acid.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về PTHH của oxide.", "statements": ["a) CO2 + Ca(OH)2 → CaCO3 + H2O.", "b) SO2 + 2NaOH → Na2SO3 + H2O.", "c) Na2O + 2HCl → 2NaCl + H2O.", "d) CaO + H2SO4 → CaSO3 + H2O."], "answer": ["T", "T", "T", "F"], "explain": "Đúng là CaO + H2SO4 → CaSO4 + H2O.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu tên oxide có công thức Na2O.", "answer": "Sodium oxide", "explain": "Na2O là sodium oxide.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Hoàn thành PTHH: CO2 + NaOH → ...", "answer": "CO2 + 2NaOH → Na2CO3 + H2O", "explain": "PTHH: CO2 + 2NaOH → Na2CO3 + H2O.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Dãy các chất đều là oxide:", "options": ["A. CO2, CaO, SO2", "B. HCl, H2SO4", "C. NaOH, KOH", "D. NaCl, KNO3"], "answer": "A", "explain": "CO2, CaO, SO2 đều là oxide.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dãy các chất đều là oxide acid:", "options": ["A. Na2O, CaO, MgO", "B. CO2, SO2, P2O5", "C. Al2O3, ZnO", "D. CO, NO"], "answer": "B", "explain": "CO2, SO2, P2O5 đều là oxide acid.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy các chất đều là oxide base:", "options": ["A. CO2, SO2", "B. Al2O3, ZnO", "C. Na2O, CaO, CuO", "D. CO, NO"], "answer": "C", "explain": "Na2O, CaO, CuO đều là oxide base.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phản ứng nào sau đây là phản ứng giữa oxide base và acid?", "options": ["A. CO2 + NaOH", "B. SO2 + H2O", "C. Na2O + H2O", "D. CaO + HCl"], "answer": "D", "explain": "CaO + 2HCl → CaCl2 + H2O.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 0,3 mol Na2O tác dụng hết với H2O (Na2O + H2O → 2NaOH). Số mol NaOH thu được là:", "options": ["A. 0,3 mol", "B. 0,15 mol", "C. 1,2 mol", "D. 0,6 mol"], "answer": "D", "explain": "Tỉ lệ 1:2 nên n_NaOH = 0,6 mol.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 32 gam CuO tác dụng hết với H2 dư (CuO + H2 → Cu + H2O). Khối lượng Cu (M = 64) thu được là:", "options": ["A. 25,6 gam", "B. 12,8 gam", "C. 51,2 gam", "D. 6,4 gam"], "answer": "A", "explain": "n_CuO = 0,4 mol; n_Cu = 0,4 mol; m = 25,6 gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về phân biệt oxide acid, oxide base.", "statements": ["a) Oxide base thường là oxide của kim loại.", "b) Oxide acid thường là oxide của phi kim.", "c) Oxide acid chỉ có thể là oxide của phi kim.", "d) Mọi oxide của kim loại đều là oxide base."], "answer": ["T", "T", "F", "F"], "explain": "Có oxide của kim loại là oxide acid (vượt chương trình lớp 8).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về oxide trong đời sống.", "statements": ["a) CO2 được dùng trong bình chữa cháy.", "b) CaO được dùng để khử chua đất.", "c) SiO2 là thành phần chính của thủy tinh.", "d) SO2 có lợi cho sức khỏe."], "answer": ["T", "T", "T", "F"], "explain": "SO2 là khí độc, gây mưa acid.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu tên oxide có công thức CuO.", "answer": "Copper(II) oxide", "explain": "CuO là copper(II) oxide.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Hoàn thành PTHH: SO2 + NaOH → ...", "answer": "SO2 + 2NaOH → Na2SO3 + H2O", "explain": "PTHH: SO2 + 2NaOH → Na2SO3 + H2O.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Oxide của kim loại có hóa trị II với oxygen có công thức chung là:", "options": ["A. MO", "B. M2O", "C. M2O3", "D. MO2"], "answer": "A", "explain": "Kim loại hóa trị II: MO.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Oxide của kim loại có hóa trị III với oxygen có công thức chung là:", "options": ["A. M2O", "B. M2O3", "C. MO", "D. MO2"], "answer": "B", "explain": "Kim loại hóa trị III: M2O3.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hợp chất FeO có tên là:", "options": ["A. Iron(III) oxide", "B. Iron oxide", "C. Iron(II) oxide", "D. Iron dioxide"], "answer": "C", "explain": "FeO là iron(II) oxide.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hợp chất Cu2O có tên là:", "options": ["A. Copper(II) oxide", "B. Copper oxide", "C. Copper dioxide", "D. Copper(I) oxide"], "answer": "D", "explain": "Cu2O là copper(I) oxide.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 2,24 L CO2 (đkc) tác dụng hết với NaOH dư (CO2 + 2NaOH → Na2CO3 + H2O). Khối lượng Na2CO3 (M = 106) thu được là:", "options": ["A. 10,6 gam", "B. 5,3 gam", "C. 21,2 gam", "D. 2,65 gam"], "answer": "A", "explain": "n_CO2 = 0,1 mol; n_Na2CO3 = 0,1 mol; m = 10,6 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đốt cháy hoàn toàn 5,6 gam Fe trong oxygen dư (3Fe + 2O2 → Fe3O4). Khối lượng Fe3O4 (M = 232) thu được là:", "options": ["A. 11,6 gam", "B. 7,7333 gam", "C. 23,2 gam", "D. 5,8 gam"], "answer": "B", "explain": "n_Fe = 0,1 mol; n_Fe3O4 = 1/30 mol; m ≈ 7,7333 gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về tên gọi oxide của kim loại.", "statements": ["a) Cu2O có tên là copper(I) oxide.", "b) CuO có tên là copper(II) oxide.", "c) FeO có tên là iron(II) oxide.", "d) Fe2O3 có tên là iron(II) oxide."], "answer": ["T", "T", "T", "F"], "explain": "Fe2O3 là iron(III) oxide.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về hóa trị trong hợp chất.", "statements": ["a) Trong H2O, H có hóa trị I.", "b) Trong CO2, C có hóa trị IV.", "c) Trong Na2O, Na có hóa trị I.", "d) Trong P2O5, P có hóa trị III."], "answer": ["T", "T", "T", "F"], "explain": "Trong P2O5, P có hóa trị V.", "points": 1}, {"type": "short", "level": "TH", "q": "Viết công thức hóa học của iron(III) oxide.", "answer": "Fe2O3", "explain": "Iron(III) oxide có công thức Fe2O3.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Hoàn thành PTHH: Fe2O3 + HCl → ...", "answer": "Fe2O3 + 6HCl → 2FeCl3 + 3H2O", "explain": "PTHH: Fe2O3 + 6HCl → 2FeCl3 + 3H2O.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Số nguyên tử oxygen trong một phân tử SO3 là:", "options": ["A. 3", "B. 1", "C. 2", "D. 4"], "answer": "A", "explain": "SO3 có 3 nguyên tử oxygen.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số nguyên tử oxygen trong một phân tử P2O5 là:", "options": ["A. 2", "B. 5", "C. 3", "D. 4"], "answer": "B", "explain": "P2O5 có 5 nguyên tử oxygen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khối lượng mol của CO2 là:", "options": ["A. 28 g/mol", "B. 32 g/mol", "C. 44 g/mol", "D. 12 g/mol"], "answer": "C", "explain": "M_CO2 = 12 + 32 = 44 g/mol.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khối lượng mol của CaO là:", "options": ["A. 40 g/mol", "B. 72 g/mol", "C. 44 g/mol", "D. 56 g/mol"], "answer": "D", "explain": "M_CaO = 40 + 16 = 56 g/mol.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 0,25 mol SO2 tác dụng hết với NaOH dư (SO2 + 2NaOH → Na2SO3 + H2O). Khối lượng Na2SO3 (M = 126) thu được là:", "options": ["A. 15,75 gam", "B. 31,5 gam", "C. 63 gam", "D. 7,875 gam"], "answer": "B", "explain": "n_Na2SO3 = 0,25 mol; m = 31,5 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhiệt phân 20 gam CaCO3 (CaCO3 → CaO + CO2). Khối lượng CaO (M = 56) thu được là:", "options": ["A. 5,6 gam", "B. 28 gam", "C. 11,2 gam", "D. 2,8 gam"], "answer": "C", "explain": "n_CaCO3 = 0,2 mol; n_CaO = 0,2 mol; m = 11,2 gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về khối lượng mol của oxide.", "statements": ["a) M_CaO = 56 g/mol.", "b) M_CO2 = 44 g/mol.", "c) M_SO2 = 64 g/mol.", "d) M_H2O = 20 g/mol."], "answer": ["T", "T", "T", "F"], "explain": "M_H2O = 18 g/mol.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về vai trò của CO2.", "statements": ["a) CO2 là sản phẩm của quá trình hô hấp.", "b) CO2 được cây xanh dùng trong quang hợp.", "c) CO2 quá nhiều gây hiệu ứng nhà kính.", "d) CO2 là khí duy nhất gây hiệu ứng nhà kính."], "answer": ["T", "T", "T", "F"], "explain": "Còn nhiều khí khác như CH4, N2O.", "points": 1}, {"type": "short", "level": "TH", "q": "Viết công thức hóa học của calcium oxide.", "answer": "CaO", "explain": "Calcium oxide có công thức CaO.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Hoàn thành PTHH: CaCO3 + HCl → ...", "answer": "CaCO3 + 2HCl → CaCl2 + CO2 + H2O", "explain": "PTHH: CaCO3 + 2HCl → CaCl2 + CO2 + H2O.", "points": 0.5}]}]}
