2", "C. 0,97", "D. 0,55"], "answer": "C", "explain": "d = 28/29 ≈ 0,97, nitrogen nhẹ hơn không khí một chút.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về khối lượng mol và thể tích mol.", "statements": ["a) 1 mol H2O nặng 18 gam.", "b) 1 mol CO2 nặng 44 gam.", "c) 1 mol O2 chiếm 24,79 L ở đkc.", "d) 1 mol H2O lỏng chiếm 24,79 L ở đkc."], "answer": ["T", "T", "T", "F"], "explain": "24,79 L chỉ áp dụng cho chất khí.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về so sánh khối lượng mol với không khí.", "statements": ["a) Khí có M lớn hơn 29 thì nặng hơn không khí.", "b) Khí có M nhỏ hơn 29 thì nhẹ hơn không khí.", "c) CO2 (M = 44) nặng hơn không khí.", "d) CH4 (M = 16) nặng hơn không khí."], "answer": ["T", "T", "T", "F"], "explain": "CH4 nhẹ hơn không khí.", "points": 1}, {"type": "short", "level": "TH", "q": "Tính số mol của 6,4 gam S (M = 32 g/mol).", "answer": "0,2", "explain": "n = 6,4/32 = 0,2 mol.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Tính tỉ khối của khí ammonia (NH3, M = 17) so với không khí.", "answer": "0,59", "explain": "d = 17/29 ≈ 0,59, ammonia nhẹ hơn không khí.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Lượng chất có đơn vị là:", "options": ["A. mol", "B. gam", "C. lít", "D. g/mol"], "answer": "A", "explain": "Mol là đơn vị đo lượng chất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thể tích mol của chất khí ở đkc là:", "options": ["A. 22,4 L/mol", "B. 24,79 L/mol", "C. 24 L/mol", "D. 20 L/mol"], "answer": "B", "explain": "Ở đkc, 1 mol khí chiếm 24,79 L.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khối lượng mol của H2SO4 (H = 1, S = 32, O = 16) là:", "options": ["A. 49 g/mol", "B. 96 g/mol", "C. 98 g/mol", "D. 100 g/mol"], "answer": "C", "explain": "M = 2×1 + 32 + 4×16 = 98 g/mol.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số mol của 2,479 L khí H2 ở đkc là:", "options": ["A. 1 mol", "B. 0,5 mol", "C. 0,2 mol", "D. 0,1 mol"], "answer": "D", "explain": "n = 2,479/24,79 = 0,1 mol.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khối lượng của 0,25 mol O2 (M = 32 g/mol) là:", "options": ["A. 16 gam", "B. 4 gam", "C. 8 gam", "D. 32 gam"], "answer": "C", "explain": "m = 0,25 × 32 = 8 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khí nào sau đây nặng hơn không khí?", "options": ["A. H2", "B. CH4", "C. NH3", "D. CO2"], "answer": "D", "explain": "M_CO2 = 44 lớn hơn 29 nên CO2 nặng hơn không khí.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về số Avogadro.", "statements": ["a) N_A = 6,022×10^23.", "b) 1 mol chứa N_A hạt vi mô.", "c) 0,5 mol chứa 3,011×10^23 hạt.", "d) N_A là số mol của một chất."], "answer": ["T", "T", "T", "F"], "explain": "N_A là số hạt trong 1 mol chất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về công thức tính tỉ khối.", "statements": ["a) Tỉ khối là đại lượng không có đơn vị.", "b) d_A/B = M_A/M_B.", "c) Muốn biết khí A nặng hay nhẹ hơn không khí, ta tính d_A/kk.", "d) Tỉ khối có đơn vị là g/mol."], "answer": ["T", "T", "T", "F"], "explain": "Tỉ khối là tỉ số của hai khối lượng mol nên không có đơn vị.", "points": 1}, {"type": "short", "level": "TH", "q": "Tính số mol của 20 gam CaCO3 (M = 100 g/mol).", "answer": "0,2", "explain": "n = 20/100 = 0,2 mol.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Tính khối lượng của 4,958 L khí CH4 ở đkc (M = 16 g/mol, đơn vị: gam).", "answer": "3,2", "explain": "n = 4,958/24,79 = 0,2 mol; m = 0,2 × 16 = 3,2 gam.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "1 mol phân tử H2 chứa:", "options": ["A. 6,022×10^23 phân tử H2", "B. 1 phân tử H2", "C. 6,022×10^23 nguyên tử H", "D. 2 gam H2"], "answer": "A", "explain": "1 mol phân tử H2 chứa 6,022×10^23 phân tử H2.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức liên hệ giữa số mol, khối lượng và khối lượng mol là:", "options": ["A. n = M/m", "B. n = m/M", "C. n = m × M", "D. n = V × 24,79"], "answer": "B", "explain": "n = m/M.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thể tích ở đkc của 0,2 mol khí N2 là:", "options": ["A. 24,79 L", "B. 2,479 L", "C. 4,958 L", "D. 49,58 L"], "answer": "C", "explain": "V = 0,2 × 24,79 = 4,958 L.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tỉ khối của khí H2 so với không khí xấp xỉ:", "options": ["A. 1", "B. 0,5", "C. 0,14", "D. 0,07"], "answer": "D", "explain": "d = 2/29 ≈ 0,07, hydrogen nhẹ hơn không khí rất nhiều.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số mol của 49,58 L khí CO2 ở đkc là:", "options": ["A. 1 mol", "B. 0,5 mol", "C. 4 mol", "D. 2 mol"], "answer": "D", "explain": "n = 49,58/24,79 = 2 mol.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khí A có M = 44 g/mol. Tỉ khối của A so với khí O2 là:", "options": ["A. 1,375", "B. 2", "C. 0,727", "D. 22"], "answer": "A", "explain": "d = 44/32 = 1,375.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về khối lượng mol của hợp chất.", "statements": ["a) Khối lượng mol của Cl2 là 71 g/mol.", "b) Khối lượng mol của HCl là 36,5 g/mol.", "c) 1 mol Cl2 nặng 71 gam.", "d) 1 mol NaCl rắn chiếm 24,79 L ở đkc."], "answer": ["T", "T", "T", "F"], "explain": "24,79 L chỉ áp dụng cho chất khí.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về thể tích mol của các chất khí.", "statements": ["a) Ở cùng đkc, 1 mol mọi chất khí chiếm thể tích bằng nhau.", "b) Ở cùng đkc, khối lượng của 1 mol các khí khác nhau thì khác nhau.", "c) 24,79 L khí O2 và 24,79 L khí H2 ở đkc chứa số phân tử bằng nhau.", "d) 1 gam H2 và 1 gam O2 ở đkc chiếm thể tích bằng nhau."], "answer": ["T", "T", "T", "F"], "explain": "1 gam H2 (0,5 mol) chiếm thể tích lớn hơn 1 gam O2.", "points": 1}, {"type": "short", "level": "TH", "q": "Tính thể tích ở đkc của 3 mol khí nitrogen (đơn vị: L).", "answer": "74,37", "explain": "V = 3 × 24,79 = 74,37 L.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Tính số mol của 3,011×10^23 phân tử CO2.", "answer": "0,5", "explain": "n = N/N_A = 3,011×10^23 / 6,022×10^23 = 0,5 mol.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đại lượng đặc trưng cho lượng chất là:", "options": ["A. Số mol", "B. Khối lượng", "C. Thể tích", "D. Tỉ khối"], "answer": "A", "explain": "Mol là đơn vị đo lượng chất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "1 mol khí ở đkc chiếm 24,79 L. Vậy 2 mol khí ở đkc chiếm:", "options": ["A. 24,79 L", "B. 49,58 L", "C. 12,395 L", "D. 22,4 L"], "answer": "B", "explain": "V = 2 × 24,79 = 49,58 L.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khối lượng mol của MgO (Mg = 24, O = 16) là:", "options": ["A. 24 g/mol", "B. 16 g/mol", "C. 40 g/mol", "D. 32 g/mol"], "answer": "C", "explain": "M = 24 + 16 = 40 g/mol.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số mol của 24,79 L khí methane ở đkc là:", "options": ["A. 2 mol", "B. 0,5 mol", "C. 0,1 mol", "D. 1 mol"], "answer": "D", "explain": "n = 24,79/24,79 = 1 mol.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khối lượng của 12,044×10^23 nguyên tử Mg (M = 24 g/mol) là:", "options": ["A. 48 gam", "B. 24 gam", "C. 12 gam", "D. 6 gam"], "answer": "A", "explain": "12,044×10^23 hạt = 2 mol; m = 2 × 24 = 48 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tỉ khối của khí oxygen so với không khí xấp xỉ:", "options": ["A. 1,52", "B. 1,10", "C. 0,97", "D. 2,21"], "answer": "B", "explain": "d = 32/29 ≈ 1,10, oxygen nặng hơn không khí.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về các công thức liên quan đến mol.", "statements": ["a) n = m/M dùng để tính số mol từ khối lượng.", "b) V = n × 24,79 dùng ở điều kiện chuẩn.", "c) d_A/kk = M_A/29.", "d) M có đơn vị là mol."], "answer": ["T", "T", "T", "F"], "explain": "Khối lượng mol M có đơn vị g/mol.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về độ nặng nhẹ của các khí so với không khí.", "statements": ["a) Khí SO2 nặng hơn không khí.", "b) Khí CH4 nhẹ hơn không khí.", "c) Khí CO2 nhẹ hơn không khí.", "d) Khí O2 nặng hơn không khí."], "answer": ["T", "T", "F", "T"], "explain": "CO2 (M = 44) nặng hơn không khí.", "points": 1}, {"type": "short", "level": "TH", "q": "Tính khối lượng của 0,1 mol Cu (M = 64 g/mol, đơn vị: gam).", "answer": "6,4", "explain": "m = 0,1 × 64 = 6,4 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Tính tỉ khối của khí carbon dioxide so với khí hydrogen.", "answer": "22", "explain": "d = 44/2 = 22.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Số hạt vi mô trong 1 mol chất được gọi là:", "options": ["A. Số Avogadro", "B. Số mol", "C. Khối lượng mol", "D. Thể tích mol"], "answer": "A", "explain": "Số Avogadro N_A = 6,022×10^23.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khối lượng mol của nguyên tử carbon là:", "options": ["A. 6 g/mol", "B. 12 g/mol", "C. 14 g/mol", "D. 16 g/mol"], "answer": "B", "explain": "Nguyên tử carbon có số khối 12 nên M = 12 g/mol.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số mol của 87,75 gam NaCl (M = 58,5 g/mol) là:", "options": ["A. 1 mol", "B. 2 mol", "C. 1,5 mol", "D. 0,5 mol"], "answer": "C", "explain": "n = 87,75/58,5 = 1,5 mol.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thể tích ở đkc của 0,25 mol khí H2 là:", "options": ["A. 24,79 L", "B. 12,395 L", "C. 49,58 L", "D. 6,1975 L"], "answer": "D", "explain": "V = 0,25 × 24,79 = 6,1975 L.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tỉ khối của khí A so với H2 bằng 16. Khối lượng mol của A là:", "options": ["A. 8 g/mol", "B. 32 g/mol", "C. 16 g/mol", "D. 29 g/mol"], "answer": "B", "explain": "M_A = 16 × 2 = 32 g/mol.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một khí có tỉ khối so với không khí bằng 1,52. Khí đó có thể là:", "options": ["A. O2 (M = 32)", "B. CH4 (M = 16)", "C. CO2 (M = 44)", "D. H2 (M = 2)"], "answer": "C", "explain": "44/29 ≈ 1,52 nên khí đó có thể là CO2.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về khối lượng mol của kim loại.", "statements": ["a) 1 mol Zn nặng 65 gam.", "b) 1 mol Ag nặng 108 gam.", "c) 1 mol Ba nặng 137 gam.", "d) 1 mol mọi kim loại đều nặng 56 gam."], "answer": ["T", "T", "T", "F"], "explain": "Mỗi kim loại có khối lượng mol riêng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về ứng dụng của tỉ khối chất khí.", "statements": ["a) Muốn so sánh độ nặng nhẹ của các khí, ta dùng tỉ khối.", "b) Khí nhẹ hơn không khí sẽ bay lên trên.", "c) Bóng bay bơm khí H2 bay lên được vì H2 nhẹ hơn không khí.", "d) Khí CO2 dập tắt được đám cháy vì nhẹ hơn không khí."], "answer": ["T", "T", "T", "F"], "explain": "CO2 nặng hơn không khí nên bao phủ đám cháy, ngăn tiếp xúc với oxygen.", "points": 1}, {"type": "short", "level": "TH", "q": "Tính số mol của 2,479 L khí oxygen ở đkc.", "answer": "0,1", "explain": "n = 2,479/24,79 = 0,1 mol.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Tính khối lượng mol của khí B biết tỉ khối của B so với không khí bằng 0,55 (đơn vị: g/mol).", "answer": "16", "explain": "M_B = 0,55 × 29 ≈ 16 g/mol.", "points": 0.5}]}]}
