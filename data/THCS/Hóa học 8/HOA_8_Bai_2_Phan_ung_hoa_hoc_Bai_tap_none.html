 "truefalse", "level": "NB", "q": "Đánh giá các nhận định về khái niệm phản ứng hóa học.", "statements": ["a) Phản ứng hóa học là quá trình biến đổi chất này thành chất khác.", "b) Chất tham gia bị biến đổi trong phản ứng.", "c) Sản phẩm được tạo thành sau phản ứng.", "d) Sơ đồ phản ứng dùng dấu bằng thay cho mũi tên."], "answer": ["T", "T", "T", "F"], "explain": "Sơ đồ phản ứng dùng mũi tên, đọc là tạo thành.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về các hiện tượng trong đời sống.", "statements": ["a) Nấu chín thức ăn là biến đổi hóa học.", "b) Nước đá tan thành nước là biến đổi vật lí.", "c) Quá trình hô hấp ở người có xảy ra phản ứng hóa học.", "d) Xé giấy thành mảnh nhỏ là biến đổi hóa học."], "answer": ["T", "T", "T", "F"], "explain": "Xé giấy chỉ thay đổi hình dạng, là biến đổi vật lí.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu một ví dụ về biến đổi vật lí trong đời sống.", "answer": "Nước đá tan thành nước", "explain": "Nước đá tan, xé giấy, hòa tan đường đều là biến đổi vật lí.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một ví dụ về biến đổi hóa học trong đời sống.", "answer": "Đốt cháy tờ giấy", "explain": "Đốt giấy, sắt gỉ, thức ăn ôi thiu đều là biến đổi hóa học.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Chất được tạo thành sau phản ứng hóa học gọi là:", "options": ["A. Sản phẩm", "B. Chất tham gia", "C. Chất xúc tác", "D. Tạp chất"], "answer": "A", "explain": "Sản phẩm (chất tạo thành) là chất mới được tạo ra sau phản ứng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trường hợp nào sau đây có sự tạo thành chất mới?", "options": ["A. Cồn bay hơi", "B. Đường cháy thành than", "C. Nước đóng băng", "D. Thủy tinh vỡ"], "answer": "B", "explain": "Đường cháy thành than tạo ra chất mới, là biến đổi hóa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nhỏ dung dịch acid vào vỏ trứng thấy sủi bọt khí. Dấu hiệu của phản ứng hóa học ở đây là:", "options": ["A. Vỏ trứng đổi màu", "B. Vỏ trứng vỡ vụn", "C. Sủi bọt khí", "D. Acid bay hơi"], "answer": "C", "explain": "Sủi bọt khí là dấu hiệu của phản ứng hóa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sơ đồ nào sau đây viết đúng quy tắc (chất tham gia → sản phẩm)?", "options": ["A. Iron(II) sulfide → Sắt + Lưu huỳnh", "B. Sắt → Lưu huỳnh + Iron(II) sulfide", "C. Lưu huỳnh → Sắt + Iron(II) sulfide", "D. Sắt + Lưu huỳnh → Iron(II) sulfide"], "answer": "D", "explain": "Chất tham gia viết ở vế trái, sản phẩm ở vế phải mũi tên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong phản ứng đốt cháy nến, các chất tham gia là:", "options": ["A. Nến (paraffin) và oxygen", "B. Carbon dioxide và hơi nước", "C. Nến", "D. Oxygen"], "answer": "A", "explain": "Chất tham gia: nến và oxygen; sản phẩm: carbon dioxide và hơi nước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho đinh sắt vào dung dịch copper(II) sulfate màu xanh, sau một thời gian thấy đinh sắt có lớp màu đỏ bám ngoài, dung dịch nhạt màu dần. Kết luận đúng là:", "options": ["A. Không xảy ra phản ứng, chỉ là hiện tượng bám màu", "B. Đã xảy ra phản ứng hóa học tạo chất mới bám trên đinh sắt", "C. Đinh sắt bị gỉ", "D. Dung dịch bị bay hơi"], "answer": "B", "explain": "Xuất hiện chất mới (lớp copper màu đỏ) chứng tỏ đã xảy ra phản ứng hóa học.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về biến đổi của chất.", "statements": ["a) Xé giấy là biến đổi vật lí.", "b) Đốt giấy là biến đổi hóa học.", "c) Hòa tan đường là biến đổi hóa học.", "d) Sắt gỉ là biến đổi hóa học."], "answer": ["T", "T", "F", "T"], "explain": "Hòa tan đường không tạo chất mới, là biến đổi vật lí.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về vị trí các chất trong sơ đồ phản ứng.", "statements": ["a) Trong sơ đồ phản ứng, vế trái là các chất tham gia.", "b) Trong sơ đồ phản ứng, vế phải là các sản phẩm.", "c) Một phản ứng chỉ có đúng một chất tham gia.", "d) Một phản ứng có thể tạo ra nhiều sản phẩm."], "answer": ["T", "T", "F", "T"], "explain": "Một phản ứng có thể có một hoặc nhiều chất tham gia.", "points": 1}, {"type": "short", "level": "TH", "q": "Dấu hiệu nào cho thấy có chất khí thoát ra trong phản ứng?", "answer": "Sủi bọt khí", "explain": "Sủi bọt khí là dấu hiệu có chất khí thoát ra khi phản ứng.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao nói sự gỉ của sắt là biến đổi hóa học?", "answer": "Vì tạo ra chất mới là gỉ sắt", "explain": "Sắt tác dụng với oxygen và hơi nước tạo ra gỉ sắt là chất mới.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Quá trình nào sau đây có xảy ra phản ứng hóa học?", "options": ["A. Quang hợp ở cây xanh", "B. Nước bay hơi", "C. Muối ăn tan trong nước", "D. Băng tan"], "answer": "A", "explain": "Quang hợp tạo ra chất mới (glucose, oxygen), là phản ứng hóa học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tên gọi của chất ban đầu trong phản ứng hóa học là:", "options": ["A. Sản phẩm", "B. Chất tham gia", "C. Hợp chất", "D. Đơn chất"], "answer": "B", "explain": "Chất tham gia là chất ban đầu, bị biến đổi trong phản ứng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiện tượng xuất hiện lớp cặn trắng khi đun nước cứng là dấu hiệu của:", "options": ["A. Biến đổi vật lí", "B. Nước bị bẩn", "C. Phản ứng hóa học tạo chất mới", "D. Hiện tượng không có ý nghĩa"], "answer": "C", "explain": "Lớp cặn trắng là chất mới tạo thành khi đun nóng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho sơ đồ: Zinc + Hydrochloric acid → Zinc chloride + Hydrogen. Các sản phẩm gồm:", "options": ["A. Zinc và hydrochloric acid", "B. Zinc chloride", "C. Hydrogen", "D. Zinc chloride và hydrogen"], "answer": "D", "explain": "Vế phải mũi tên là các sản phẩm: zinc chloride và hydrogen.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi đốt cháy khí methane trong không khí, sản phẩm thu được là carbon dioxide và hơi nước. Sơ đồ phản ứng đúng là:", "options": ["A. Methane → Carbon dioxide + Nước", "B. Methane + Oxygen → Carbon dioxide + Nước", "C. Carbon dioxide + Nước → Methane", "D. Methane + Carbon dioxide → Nước"], "answer": "B", "explain": "Chất tham gia: methane và oxygen; sản phẩm: carbon dioxide và nước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Có hai cốc: cốc A đựng nước cất, cốc B đựng dung dịch copper(II) sulfate màu xanh. Thả một đinh sắt vào mỗi cốc. Sau một thời gian, hiện tượng khác nhau ở hai cốc chứng tỏ:", "options": ["A. Sắt tan trong mọi chất lỏng", "B. Nước cất làm sắt gỉ nhanh hơn", "C. Đã xảy ra phản ứng hóa học giữa sắt và dung dịch copper(II) sulfate", "D. Copper(II) sulfate bị bay hơi"], "answer": "C", "explain": "Chỉ ở cốc B xuất hiện chất mới, chứng tỏ có phản ứng hóa học xảy ra.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về bản chất của sự biến đổi chất.", "statements": ["a) Biến đổi vật lí không làm thay đổi bản chất của chất.", "b) Biến đổi hóa học làm xuất hiện chất mới.", "c) Sự nóng chảy của nến là biến đổi hóa học.", "d) Sự cháy của nến là biến đổi hóa học."], "answer": ["T", "T", "F", "T"], "explain": "Nến nóng chảy chỉ thay đổi trạng thái, là biến đổi vật lí.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về dấu hiệu của phản ứng.", "statements": ["a) Đổi màu là một dấu hiệu của phản ứng hóa học.", "b) Tỏa nhiệt, phát sáng là dấu hiệu của phản ứng hóa học.", "c) Xuất hiện mùi mới là dấu hiệu của phản ứng hóa học.", "d) Chất rắn tan trong nước luôn là phản ứng hóa học."], "answer": ["T", "T", "T", "F"], "explain": "Chất rắn tan trong nước có thể chỉ là biến đổi vật lí.", "points": 1}, {"type": "short", "level": "TH", "q": "Hoàn thành sơ đồ phản ứng: Carbon + Oxygen → ...", "answer": "Carbon dioxide", "explain": "Carbon cháy trong oxygen tạo thành carbon dioxide.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu hai dấu hiệu nhận biết phản ứng hóa học.", "answer": "Sủi bọt khí và tạo chất kết tủa", "explain": "Các dấu hiệu: đổi màu, sủi bọt khí, tạo kết tủa, tỏa nhiệt, phát sáng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong phản ứng hóa học, các chất ban đầu được gọi là:", "options": ["A. Chất tham gia", "B. Sản phẩm", "C. Chất mới", "D. Chất xúc tác"], "answer": "A", "explain": "Chất tham gia là chất ban đầu, bị biến đổi trong phản ứng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện tượng nào sau đây KHÔNG phải biến đổi hóa học?", "options": ["A. Thức ăn ôi thiu", "B. Nước đá tan", "C. Pháo nổ", "D. Cơm bị khê"], "answer": "B", "explain": "Nước đá tan chỉ thay đổi trạng thái, là biến đổi vật lí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhỏ vài giọt dung dịch sodium hydroxide vào dung dịch copper(II) sulfate thấy xuất hiện kết tủa xanh. Điều này chứng tỏ:", "options": ["A. Không có phản ứng xảy ra", "B. Dung dịch bị loãng đi", "C. Đã xảy ra phản ứng hóa học", "D. Copper(II) sulfate bị bay hơi"], "answer": "C", "explain": "Xuất hiện chất kết tủa là dấu hiệu của phản ứng hóa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sơ đồ phản ứng: Sodium + Chlorine → Sodium chloride. Các chất tham gia là:", "options": ["A. Sodium chloride", "B. Sodium", "C. Chlorine", "D. Sodium và chlorine"], "answer": "D", "explain": "Vế trái mũi tên là các chất tham gia: sodium và chlorine.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hiện tượng nào sau đây chứng tỏ đã xảy ra phản ứng hóa học khi nấu ăn?", "options": ["A. Rau bị cắt nhỏ", "B. Nước sôi", "C. Cơm chín, có mùi thơm của cơm mới", "D. Thịt được thái mỏng"], "answer": "C", "explain": "Cơm chín tạo ra chất mới với mùi thơm đặc trưng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một học sinh khẳng định mọi sự thay đổi màu sắc đều là phản ứng hóa học. Ví dụ nào sau đây bác bỏ khẳng định đó?", "options": ["A. Sắt bị gỉ", "B. Táo cắt ra bị thâm", "C. Đốt cháy giấy", "D. Nhỏ mực vào nước làm nước đổi màu nhưng không tạo chất mới"], "answer": "D", "explain": "Nhỏ mực vào nước chỉ là sự hòa tan, pha trộn (biến đổi vật lí).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về sự biến đổi chất trong phản ứng.", "statements": ["a) Phản ứng hóa học tạo ra chất mới.", "b) Chất tham gia giảm dần trong quá trình phản ứng.", "c) Sản phẩm tăng dần trong quá trình phản ứng.", "d) Sau phản ứng, chất tham gia vẫn giữ nguyên không đổi."], "answer": ["T", "T", "T", "F"], "explain": "Chất tham gia bị biến đổi nên giảm dần trong quá trình phản ứng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về biến đổi vật lí và hóa học trong đời sống.", "statements": ["a) Đốt cháy củi là biến đổi hóa học.", "b) Cưa gỗ thành tấm là biến đổi vật lí.", "c) Làm sữa chua từ sữa là biến đổi hóa học.", "d) Gấp giấy thành hình là biến đổi hóa học."], "answer": ["T", "T", "T", "F"], "explain": "Gấp giấy chỉ thay đổi hình dạng, là biến đổi vật lí.", "points": 1}, {"type": "short", "level": "TH", "q": "Viết sơ đồ phản ứng: sắt tác dụng với sulfur tạo thành iron(II) sulfide.", "answer": "Sắt + Lưu huỳnh → Iron(II) sulfide", "explain": "Sơ đồ: Tên các chất tham gia → Tên các sản phẩm.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một ví dụ về phản ứng hóa học có hiện tượng phát sáng.", "answer": "Đốt cháy magnesium", "explain": "Đốt cháy magnesium phát sáng chói, tạo thành magnesium oxide.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Biến đổi vật lí là biến đổi:", "options": ["A. Không tạo ra chất mới", "B. Tạo ra chất mới", "C. Luôn tỏa nhiệt", "D. Làm thay đổi bản chất của chất"], "answer": "A", "explain": "Biến đổi vật lí không tạo ra chất mới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu đặc trưng nhất của phản ứng hóa học là:", "options": ["A. Thay đổi hình dạng", "B. Tạo ra chất mới", "C. Thay đổi trạng thái", "D. Thay đổi vị trí"], "answer": "B", "explain": "Phản ứng hóa học là quá trình biến đổi chất này thành chất khác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho hiện tượng: nhỏ nước vào vôi sống thấy nóng lên và vôi nở ra. Đây là:", "options": ["A. Biến đổi vật lí", "B. Không có biến đổi gì", "C. Biến đổi hóa học", "D. Hiện tượng bay hơi"], "answer": "C", "explain": "Vôi sống tác dụng với nước tạo thành vôi tôi là chất mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong sơ đồ: Hydrogen + Oxygen → Nước, mũi tên cho biết:", "options": ["A. Hydrogen biến mất", "B. Oxygen biến mất", "C. Nước tách thành hydrogen và oxygen", "D. Hydrogen và oxygen tạo thành nước"], "answer": "D", "explain": "Mũi tên đọc là tạo thành: hydrogen và oxygen tạo thành nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số chất tham gia trong sơ đồ: Carbon + Oxygen → Carbon dioxide là:", "options": ["A. 1", "B. 3", "C. 0", "D. 2"], "answer": "D", "explain": "Vế trái có 2 chất tham gia: carbon và oxygen.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phân biệt biến đổi vật lí và biến đổi hóa học một cách chắc chắn nhất, cần dựa vào:", "options": ["A. Có tạo ra chất mới hay không", "B. Màu sắc có thay đổi không", "C. Có tỏa nhiệt không", "D. Có thay đổi hình dạng không"], "answer": "A", "explain": "Tiêu chí quyết định là có tạo ra chất mới hay không.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về cách đọc sơ đồ phản ứng.", "statements": ["a) Sơ đồ phản ứng được biểu diễn bằng tên các chất.", "b) Các chất tham gia được viết ở vế trái mũi tên.", "c) Các sản phẩm được viết ở vế phải mũi tên.", "d) Mũi tên trong sơ đồ được đọc là bằng nhau."], "answer": ["T", "T", "T", "F"], "explain": "Mũi tên trong sơ đồ phản ứng được đọc là tạo thành.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về tính chất của chất trước và sau phản ứng.", "statements": ["a) Khi xảy ra phản ứng hóa học, tính chất của chất thay đổi.", "b) Chất mới tạo thành có tính chất khác chất ban đầu.", "c) Biến đổi vật lí giữ nguyên bản chất của chất.", "d) Phản ứng hóa học không bao giờ tỏa nhiệt."], "answer": ["T", "T", "T", "F"], "explain": "Nhiều phản ứng hóa học có kèm theo hiện tượng tỏa nhiệt.", "points": 1}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Trong phản ứng hóa học, ... là chất ban đầu bị biến đổi.", "answer": "Chất tham gia", "explain": "Chất tham gia là chất ban đầu, bị biến đổi trong phản ứng.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một phản ứng hóa học xảy ra trong cơ thể người.", "answer": "Quá trình hô hấp", "explain": "Hô hấp tạo ra carbon dioxide, nước và năng lượng từ chất dinh dưỡng.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hiện tượng nào sau đây có tạo thành chất mới?", "options": ["A. Nung đá vôi", "B. Xé giấy", "C. Đun sôi nước", "D. Cắt gỗ"], "answer": "A", "explain": "Nung đá vôi tạo ra chất mới (vôi sống và khí carbon dioxide).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sản phẩm là:", "options": ["A. Chất có trước phản ứng", "B. Chất được tạo thành sau phản ứng", "C. Chất xúc tác", "D. Chất không biến đổi"], "answer": "B", "explain": "Sản phẩm là chất mới được tạo thành sau phản ứng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu hiệu nào sau đây cho thấy đã xảy ra phản ứng hóa học khi trộn hai dung dịch không màu với nhau?", "options": ["A. Dung dịch vẫn trong suốt", "B. Dung dịch bị loãng đi", "C. Xuất hiện kết tủa hoặc đổi màu", "D. Không thấy gì thay đổi"], "answer": "C", "explain": "Xuất hiện kết tủa hoặc đổi màu là dấu hiệu của phản ứng hóa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sơ đồ phản ứng đúng của hiện tượng nung nóng copper(II) hydroxide tạo thành copper(II) oxide và nước là:", "options": ["A. Copper(II) oxide + Nước → Copper(II) hydroxide", "B. Copper(II) hyd
