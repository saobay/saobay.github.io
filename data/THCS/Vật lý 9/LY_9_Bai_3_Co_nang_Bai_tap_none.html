<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Cơ năng của vật được tính bằng:","options": ["A. Hiệu của động năng và thế năng","B. Tổng của động năng và thế năng","C. Tích của động năng và thế năng","D. Thương của động năng và thế năng"],"answer": "B","explain": "Cơ năng W = Wđ + Wt.","points": 0.25},{"type": "mcq","level": "TH","q": "Đơn vị đo cơ năng là:","options": ["A. Niutơn (N)","B. Oát (W)","C. Jun (J)","D. Mét trên giây (m/s)"],"answer": "C","explain": "Cơ năng cùng đơn vị với động năng, thế năng là jun.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật có động năng 30 J và thế năng 20 J. Cơ năng của vật là:","options": ["A. 10 J","B. 50 J","C. 600 J","D. 1,5 J"],"answer": "B","explain": "W = 30 + 20 = 50 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Thả một vật khối lượng 1 kg rơi tự do từ độ cao 10 m (bỏ qua sức cản, g = 10 m/s^2). Cơ năng của vật là:","options": ["A. 10 J","B. 100 J","C. 1000 J","D. 0 J"],"answer": "B","explain": "W = Wt ban đầu = P.h = 10.10 = 100 J.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật rơi tự do (bỏ qua sức cản), thế năng của vật chuyển thành:","options": ["A. Nhiệt năng","B. Động năng","C. Điện năng","D. Quang năng"],"answer": "B","explain": "Vật rơi: thế năng giảm, động năng tăng.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi ném vật lên cao (bỏ qua sức cản), động năng của vật chuyển thành:","options": ["A. Thế năng trọng trường","B. Nhiệt năng","C. Điện năng","D. Thế năng đàn hồi"],"answer": "A","explain": "Vật đi lên: động năng giảm, thế năng tăng.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về cơ năng.","statements": ["a) Cơ năng bằng tổng động năng và thế năng.","b) Cơ năng có đơn vị là jun.","c) Vật chỉ có động năng thì cơ năng bằng 0.","d) Vật đứng yên trên mặt đất (mốc) có cơ năng bằng 0."],"answer": ["T","T","F","T"],"explain": "Vật chỉ có động năng thì cơ năng bằng chính động năng đó.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về sự chuyển hóa năng lượng.","statements": ["a) Khi vật rơi, thế năng giảm còn động năng tăng.","b) Khi vật đi lên, động năng giảm còn thế năng tăng.","c) Động năng và thế năng có thể chuyển hóa lẫn nhau.","d) Cơ năng của vật đang chuyển động luôn bằng 0."],"answer": ["T","T","T","F"],"explain": "Vật chuyển động có động năng nên cơ năng khác 0.","points": 1},{"type": "short","level": "NB","q": "Tổng động năng và thế năng của vật được gọi là gì?","answer": "Cơ năng","explain": "Cơ năng là tổng động năng và thế năng.","points": 0.5},{"type": "short","level": "TH","q": "Một vật có động năng 40 J và thế năng 60 J. Cơ năng của vật là bao nhiêu jun?","answer": "100","explain": "W = 40 + 60 = 100 J.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "TH","q": "Định luật bảo toàn cơ năng phát biểu rằng: khi không có ma sát và lực cản thì cơ năng của vật:","options": ["A. Tăng dần","B. Giảm dần","C. Không thay đổi","D. Bằng 0"],"answer": "C","explain": "Không có ma sát, lực cản thì cơ năng được bảo toàn.","points": 0.25},{"type": "mcq","level": "NB","q": "Con lắc đơn đang dao động. Tại vị trí biên, con lắc có:","options": ["A. Động năng cực đại","B. Thế năng cực đại, động năng bằng 0","C. Động năng và thế năng đều cực đại","D. Cơ năng bằng 0"],"answer": "B","explain": "Tại biên, vật ở vị trí cao nhất (Wt max) và tạm dừng (Wđ = 0).","points": 0.25},{"type": "mcq","level": "VD","q": "Con lắc đơn dao động không ma sát, cơ năng 50 J. Tại vị trí cân bằng, động năng là 50 J, thế năng bằng 0. Tại vị trí biên, thế năng của con lắc là:","options": ["A. 0 J","B. 25 J","C. 50 J","D. 100 J"],"answer": "C","explain": "Cơ năng bảo toàn: tại biên Wđ = 0 nên Wt = 50 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Thả vật khối lượng 2 kg rơi tự do từ độ cao 5 m (bỏ qua sức cản, g = 10 m/s^2). Vận tốc của vật khi chạm đất là:","options": ["A. 5 m/s","B. 10 m/s","C. 20 m/s","D. 100 m/s"],"answer": "B","explain": "W = 100 J = 1/2.2.v^2, suy ra v = 10 m/s.","points": 0.25},{"type": "mcq","level": "NB","q": "Tại vị trí cân bằng của con lắc đơn (chọn mốc thế năng tại đó), thế năng trọng trường:","options": ["A. Cực đại","B. Bằng 0 (nhỏ nhất)","C. Bằng động năng","D. Bằng cơ năng"],"answer": "B","explain": "VTCB là vị trí thấp nhất, cũng là mốc nên Wt = 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong dao động của con lắc đơn (không ma sát), đại lượng nào được bảo toàn?","options": ["A. Động năng","B. Thế năng","C. Cơ năng","D. Vận tốc"],"answer": "C","explain": "Chỉ có tổng động năng và thế năng (cơ năng) là không đổi.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về con lắc đơn.","statements": ["a) Tại vị trí biên, con lắc có thế năng cực đại.","b) Tại vị trí cân bằng, con lắc có động năng cực đại.","c) Cơ năng của con lắc (không ma sát) không đổi.","d) Tại vị trí biên, động năng của con lắc cực đại."],"answer": ["T","T","T","F"],"explain": "Tại biên, vật tạm dừng nên động năng bằng 0.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về con lắc đơn.","statements": ["a) Khi con lắc đi từ biên về vị trí cân bằng, thế năng chuyển thành động năng.","b) Khi con lắc đi từ vị trí cân bằng ra biên, động năng chuyển thành thế năng.","c) Nếu có ma sát, cơ năng của con lắc giảm dần.","d) Ma sát biến một phần cơ năng thành nhiệt năng."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Tại vị trí nào của con lắc đơn thì động năng bằng 0?","answer": "Vị trí biên","explain": "Tại biên, vật tạm dừng nên động năng bằng 0.","points": 0.5},{"type": "short","level": "TH","q": "Tại vị trí nào của con lắc đơn thì động năng lớn nhất?","answer": "Vị trí cân bằng","explain": "Tại VTCB, vật chuyển động nhanh nhất nên động năng cực đại.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Khi có ma sát, cơ năng của vật chuyển động sẽ:","options": ["A. Được bảo toàn","B. Giảm dần, một phần chuyển thành nhiệt năng","C. Tăng dần","D. Bằng 0"],"answer": "B","explain": "Ma sát làm một phần cơ năng chuyển thành nhiệt năng.","points": 0.25},{"type": "mcq","level": "TH","q": "Ví dụ nào sau đây cơ năng KHÔNG được bảo toàn?","options": ["A. Vật rơi tự do bỏ qua sức cản","B. Con lắc dao động trong không khí","C. Con lắc dao động trong chân không","D. Vật trượt không ma sát"],"answer": "B","explain": "Trong không khí có lực cản nên cơ năng giảm dần.","points": 0.25},{"type": "mcq","level": "VD","q": "Thả vật 1 kg rơi tự do từ độ cao 6 m (bỏ qua sức cản, g = 10 m/s^2). Khi vật ở độ cao 2 m, động năng của vật là:","options": ["A. 20 J","B. 40 J","C. 60 J","D. 80 J"],"answer": "B","explain": "W = 60 J; Wt = 20 J nên Wđ = 60 - 20 = 40 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Quả bóng rơi từ độ cao 5 m nảy lên chỉ đạt 3 m. Nguyên nhân độ cao giảm là:","options": ["A. Cơ năng được bảo toàn hoàn toàn","B. Một phần cơ năng chuyển thành nhiệt năng và dạng khác khi va chạm","C. Trọng lượng của bóng giảm đi","D. Không khí đẩy bóng xuống"],"answer": "B","explain": "Khi va chạm, một phần cơ năng chuyển thành nhiệt năng, âm thanh...","points": 0.25},{"type": "mcq","level": "TH","q": "Khi quả bóng rơi chạm đất (chọn mốc tại mặt đất), quả bóng có:","options": ["A. Thế năng cực đại","B. Động năng cực đại","C. Cơ năng bằng 0","D. Động năng bằng 0"],"answer": "B","explain": "Tại mặt đất h = 0 nên toàn bộ cơ năng ở dạng động năng.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị của cơ năng, động năng và thế năng đều là:","options": ["A. Jun","B. Niutơn","C. Oát","D. Mét"],"answer": "A","explain": "Mọi dạng năng lượng đều đo bằng jun.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về ma sát và cơ năng.","statements": ["a) Quả bóng nảy lên thấp dần vì mất mát cơ năng khi va chạm.","b) Cơ năng chỉ bảo toàn khi không có ma sát, lực cản.","c) Ma sát làm tăng cơ năng của vật.","d) Nhiệt năng sinh ra do ma sát là một dạng năng lượng."],"answer": ["T","T","F","T"],"explain": "Ma sát làm giảm cơ năng, không làm tăng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về vật trượt có ma sát.","statements": ["a) Vật trượt có ma sát: động năng giảm, nhiệt năng tăng.","b) Tổng năng lượng (kể cả nhiệt năng) vẫn được bảo toàn.","c) Cơ năng của vật trượt có ma sát được bảo toàn.","d) Định luật bảo toàn năng lượng đúng cho mọi trường hợp."],"answer": ["T","T","F","T"],"explain": "Có ma sát thì cơ năng không bảo toàn, nhưng tổng năng lượng vẫn bảo toàn.","points": 1},{"type": "short","level": "NB","q": "Khi có ma sát, một phần cơ năng chuyển thành dạng năng lượng nào?","answer": "Nhiệt năng","explain": "Ma sát biến cơ năng thành nhiệt năng.","points": 0.5},{"type": "short","level": "TH","q": "Vì sao quả bóng rơi từ trên cao nảy lên không đạt độ cao ban đầu?","answer": "Vì một phần cơ năng đã chuyển thành nhiệt năng","explain": "Khi va chạm, một phần cơ năng chuyển thành nhiệt năng và các dạng khác.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "VD","q": "Một vật có cơ năng 120 J. Tại một thời điểm, thế năng của vật là 45 J. Động năng của vật lúc đó là:","options": ["A. 75 J","B. 165 J","C. 45 J","D. 120 J"],"answer": "A","explain": "Wđ = W - Wt = 120 - 45 = 75 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một vật được ném lên với động năng ban đầu 80 J (bỏ qua sức cản, mốc tại mặt đất). Tại độ cao cực đại, thế năng của vật là:","options": ["A. 0 J","B. 40 J","C. 80 J","D. 160 J"],"answer": "C","explain": "Tại điểm cao nhất Wđ = 0 nên toàn bộ cơ năng ở dạng thế năng: 80 J.","points": 0.25},{"type": "mcq","level": "NB","q": "Tại độ cao cực đại của vật được ném lên (bỏ qua sức cản), vật có:","options": ["A. Động năng cực đại","B. Thế năng cực đại","C. Cơ năng bằng 0","D. Động năng và thế năng đều bằng 0"],"answer": "B","explain": "Độ cao lớn nhất nên thế năng cực đại, vận tốc bằng 0 nên động năng bằng 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi vật được ném lên cao, vận tốc của vật:","options": ["A. Tăng dần","B. Giảm dần","C. Không thay đổi","D. Bằng 0 ngay lập tức"],"answer": "B","explain": "Vật chuyển động chậm dần khi đi lên.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi vật được ném lên cao, độ cao của vật:","options": ["A. Giảm dần","B. Tăng dần","C. Không thay đổi","D. Bằng 0"],"answer": "B","explain": "Vật đi lên nên độ cao tăng.","points": 0.25},{"type": "mcq","level": "NB","q": "Dạng năng lượng nào sau đây KHÔNG phải thành phần của cơ năng?","options": ["A. Động năng","B. Thế năng trọng trường","C. Nhiệt năng","D. Thế năng đàn hồi"],"answer": "C","explain": "Cơ năng chỉ gồm động năng và thế năng.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về vật được ném lên (bỏ qua sức cản).","statements": ["a) Khi vật đi lên, động năng giảm dần, thế năng tăng dần.","b) Tại điểm cao nhất, toàn bộ cơ năng ở dạng thế năng.","c) Khi vật rơi xuống, thế năng giảm dần, động năng tăng dần.","d) Cơ năng của vật được bảo toàn trong suốt quá trình."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định sau.","statements": ["a) Hai vật có cùng cơ năng thì vận tốc của chúng bằng nhau.","b) Vật nặng hơn rơi từ cùng độ cao có cơ năng lớn hơn.","c) Cơ năng của vật phụ thuộc vào mốc tính thế năng.","d) Ở cùng một vị trí, vật có cơ năng lớn hơn thì động năng cũng lớn hơn."],"answer": ["F","T","T","F"],"explain": "Cùng cơ năng chưa chắc cùng vận tốc; cùng vị trí (cùng Wt) thì cơ năng lớn hơn mới có động năng lớn hơn.","points": 1},{"type": "short","level": "VD","q": "Một vật đang rơi tự do. Khi thế năng giảm 30 J (bỏ qua sức cản) thì động năng tăng bao nhiêu jun?","answer": "30","explain": "Cơ năng bảo toàn nên động năng tăng đúng bằng lượng thế năng giảm.","points": 0.5},{"type": "short","level": "VDC","q": "Vật khối lượng 2 kg được ném thẳng đứng lên với vận tốc 10 m/s (bỏ qua sức cản, g = 10 m/s^2). Độ cao cực đại vật đạt được là bao nhiêu mét?","answer": "5","explain": "Wđ ban đầu = 100 J = P.h = 20.h, suy ra h = 5 m.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Cụm từ bảo toàn cơ năng có nghĩa là:","options": ["A. Cơ năng luôn bằng 0","B. Cơ năng không thay đổi theo thời gian","C. Cơ năng luôn tăng","D. Cơ năng luôn giảm"],"answer": "B","explain": "Bảo toàn nghĩa là giữ nguyên, không thay đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Điều kiện để cơ năng của vật được bảo toàn là:","options": ["A. Có ma sát lớn","B. Không có ma sát và lực cản","C. Vật đứng yên","D. Vật chuyển động rất nhanh"],"answer": "B","explain": "Chỉ khi không có ma sát, lực cản thì cơ năng mới không đổi.","points": 0.25},{"type": "mcq","level": "VD","q": "Con lắc đơn có cơ năng 25 J (không ma sát). Khi động năng của con lắc là 10 J thì thế năng của nó là:","options": ["A. 15 J","B. 35 J","C. 10 J","D. 250 J"],"answer": "A","explain": "Wt = W - Wđ = 25 - 10 = 15 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một vật trượt không ma sát từ đỉnh dốc cao 5 m xuống chân dốc (g = 10 m/s^2). Vận tốc của vật tại chân dốc là:","options": ["A. 5 m/s","B. 10 m/s","C. 50 m/s","D. 25 m/s"],"answer": "B","explain": "1/2.m.v^2 = m.10.5, suy ra v = 10 m/s.","points": 0.25},{"type": "mcq","level": "NB","q": "Trò chơi nào sau đây minh họa sự chuyển hóa giữa động năng và thế năng?","options": ["A. Cầu trượt","B. Xếp hình","C. Tô màu","D. Nghe nhạc"],"answer": "A","explain": "Trượt từ trên cao xuống: thế năng chuyển thành động năng.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi em trượt cầu trượt từ trên xuống, thế năng của em:","options": ["A. Tăng dần","B. Giảm dần","C. Không thay đổi","D. Bằng 0"],"answer": "B","explain": "Độ cao giảm nên thế năng giảm.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về cầu trượt.","statements": ["a) Trượt cầu trượt: thế năng chuyển thành động năng.","b) Ma sát làm người trượt chậm lại.","c) Ở đỉnh cầu trượt, thế năng lớn nhất.","d) Ở chân cầu trượt (bỏ qua ma sát), động năng lớn nhất."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về nhảy bungee.","statements": ["a) Khi dây chun dãn ra, nó có thế năng đàn hồi.","b) Người nhảy xuống: thế năng chuyển thành động năng.","c) Khi dây dãn cực đại, động năng của người tạm thời bằng 0.","d) Bỏ qua sức cản, cơ năng của hệ người và dây được bảo toàn."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Khi chơi cầu trượt, dạng năng lượng nào chuyển thành động năng?","answer": "Thế năng trọng trường","explain": "Từ trên cao trượt xuống, thế năng trọng trường chuyển thành động năng.","points": 0.5},{"type": "short","level": "TH","q": "Vì sao khi trượt cầu trượt, quần áo bị nóng lên?","answer": "Vì ma sát chuyển cơ năng thành nhiệt năng","explain": "Ma sát giữa người và cầu trượt sinh nhiệt.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "TH","q": "Một vật đang chuyển động trên mặt đất nằm ngang (chọn mốc thế năng tại mặt đất). Cơ năng của vật bằng:","options": ["A. Thế năng của vật","B. Động năng của vật","C. 0","D. Nhiệt năng"],"answer": "B","explain": "Tại mốc, Wt = 0 nên W = Wđ.","points": 0.25},{"type": "mcq","level": "VD","q": "Vật 3 kg chuyển động với vận tốc 4 m/s trên mặt đất nằm ngang (mốc tại mặt đất). Cơ năng của vật là:","options": ["A. 0 J","B. 12 J","C. 24 J","D. 48 J"],"answer": "C","explain": "W = Wđ = 1/2.3.16 = 24 J.","points": 0.25},{"type": "mcq","level": "NB","q": "Mốc tính thế năng trong bài toán cơ năng thường được chọn ở:","options": ["A. Vị trí thấp nhất mà vật đạt tới","B. Vị trí cao nhất","C. Giữa đường đi của vật","D. Ngoài Trái Đất"],"answer": "A","explain": "Thường chọn mốc tại vị trí thấp nhất để thế năng không âm.","points": 0.25},{"type": "mcq","level": "VDC","q": "Hai con lắc đơn giống hệt nhau, con lắc A có biên độ góc lớn hơn con lắc B. So sánh cơ năng của hai con lắc (không ma sát):","options": ["A. Cơ năng con lắc A lớn hơn con lắc B","B. Cơ năng con lắc B lớn hơn con lắc A","C. Cơ năng hai con lắc bằng nhau","D. Không so sánh được"],"answer": "A","explain": "Biên độ lớn hơn nghĩa là lên cao hơn, thế năng cực đại lớn hơn nên cơ năng lớn hơn.","points": 0.25},{"type": "mcq","level": "TH","q": "Biên độ dao động của con lắc càng lớn thì cơ năng của nó:","options": ["A. Càng lớn","B. Càng nhỏ","C. Không thay đổi","D. Bằng 0"],"answer": "A","explain": "Biên độ lớn thì độ cao cực đại lớn, cơ năng lớn.","points": 0.25},{"type": "mcq","level": "NB","q": "Con lắc đơn gồm:","options": ["A. Lò xo và vật nặng","B. Sợi dây và vật nặng","C. Thanh cứng và vật nặng","D. Dây chun và vật nặng"],"answer": "B","explain": "Con lắc đơn là vật nặng treo vào sợi dây.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về con lắc đơn (không ma sát).","statements": ["a) Con lắc có biên độ càng lớn thì cơ năng càng lớn.","b) Thả con lắc từ biên, nó chuyển động nhanh dần về vị trí cân bằng.","c) Qua vị trí cân bằng, con lắc chuyển động chậm dần ra biên.","d) Cơ năng của con lắc tại mọi vị trí đều bằng nhau."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về đồng hồ quả lắc.","statements": ["a) Đồng hồ quả lắc chạy được nhờ cơ năng của quả lắc được tiếp thêm định kì.","b) Nếu không tiếp thêm năng lượng, quả lắc sẽ dừng lại do ma sát.","c) Quả lắc đồng hồ dao động với cơ năng không đổi mãi mãi.","d) Lên dây cót là cung cấp thế năng đàn hồi cho đồng hồ."],"answer": ["T","T","F","T"],"explain": "Có ma sát nên cơ năng giảm dần, phải lên dây cót định kì.","points": 1},{"type": "short","level": "VD","q": "Con lắc đơn dao động. Khi đi từ vị trí cân bằng ra biên, động năng chuyển thành dạng năng lượng nào?","answer": "Thế năng trọng trường","explain": "Vật đi lên cao, động năng chuyển thành thế năng trọng trường.","points": 0.5},{"type": "short","level": "VDC","q": "Một con lắc đơn có động năng cực đại 20 J. Bỏ qua ma sát, thế năng cực đại của nó là bao nhiêu jun?","answer": "20","explain": "Cơ năng bảo toàn nên thế năng cực đại bằng động năng cực đại.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Năng lượng nào sau đây chính là cơ năng?","options": ["A. Nhiệt năng","B. Điện năng","C. Tổng động năng và thế năng","D. Quang năng"],"answer": "C","explain": "Cơ năng là tổng động năng và thế năng.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật nào sau đây có cơ năng lớn nhất (các vật cùng khối lượng)?","options": ["A. Vật đứng yên trên mặt đất","B. Vật chạy nhanh trên mặt đất","C. Vật đứng yên trên tầng cao","D. Vật vừa chạy nhanh vừa ở trên cao"],"answer": "D","explain": "Vừa có động năng lớn vừa có thế năng lớn nên cơ năng lớn nhất.","points": 0.25},{"type": "mcq","level": "VD","q": "Vật A có động năng 50 J, thế năng 50 J. Vật B có động năng 80 J, thế năng 10 J. So sánh cơ năng hai vật:","options": ["A. Cơ năng vật A lớn hơn vật B","B. Cơ năng vật B lớn hơn vật A","C. Cơ năng hai vật bằng nhau","D. Không so sánh được"],"answer": "A","explain": "WA = 100 J, WB = 90 J. Vậy cơ năng vật A lớn hơn.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một vật rơi tự do từ độ cao h (mốc tại mặt đất, bỏ qua sức cản). Khi động năng bằng thế năng thì vật ở độ cao:","options": ["A. Bằng độ cao ban đầu","B. Bằng một nửa độ cao ban đầu","C. Bằng một phần tư độ cao ban đầu","D. Tại mặt đất"],"answer": "B","explain": "Wđ = Wt = W/2 nên h = H/2.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi động năng bằng thế năng thì mỗi dạng năng lượng bằng:","options": ["A. Cơ năng","B. Một nửa cơ năng","C. Gấp đôi cơ năng","D. 0"],"answer": "B","explain": "Wđ = Wt = W/2.","points": 0.25},{"type": "mcq","level": "NB","q": "Kí hiệu thường dùng của cơ năng là:","options": ["A. W","B. A","C. P","D. F"],"answer": "A","explain": "Cơ năng kí hiệu là W.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về cơ năng.","statements": ["a) Cơ năng kí hiệu là W.","b) Cơ năng đo bằng jun.","c) Cơ năng bằng tổng động năng và thế năng.","d) Vật không chuyển động và ở mốc thế năng thì cơ năng bằng 0."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về vật rơi tự do (bỏ qua sức cản).","statements": ["a) Vật rơi qua vị trí có động năng bằng thế năng tại nửa độ cao ban đầu.","b) Tại đó, mỗi dạng năng lượng bằng một nửa cơ năng.","c) Càng gần mặt đất, động năng càng lớn.","d) Tại mặt đất, thế năng bằng cơ năng."],"answer": ["T","T","T","F"],"explain": "Tại mặt đất, thế năng bằng 0, động năng bằng cơ năng.","points": 1},{"type": "short","level": "NB","q": "Vật rơi tự do từ độ cao h (mốc tại mặt đất). Khi vật ở độ cao h/2, động năng và thế năng của vật như thế nào với nhau?","answer": "Bằng nhau","explain": "Tại nửa độ cao, Wđ = Wt = W/2.","points": 0.5},{"type": "short","level": "TH","q": "Một vật có cơ năng 90 J đang rơi. Khi thế năng còn 30 J thì động năng là bao nhiêu jun?","answer": "60","explain": "Wđ = 90 - 30 = 60 J.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "TH","q": "Trong các trường hợp sau, trường hợp nào cơ năng được bảo toàn?","options": ["A. Viên bi lăn có ma sát","B. Vật rơi trong chân không","C. Ô tô đang phanh gấp","D. Con lắc dao động trong không khí"],"answer": "B","explain": "Trong chân không không có lực cản nên cơ năng bảo toàn.","points": 0.25},{"type": "mcq","level": "VD","q": "Một hòn đá 0,2 kg được ném lên với vận tốc 10 m/s (bỏ qua sức cản). Cơ năng của hòn đá là:","options": ["A. 1 J","B. 10 J","C. 20 J","D. 100 J"],"answer": "B","explain": "W = Wđ ban đầu = 1/2.0,2.100 = 10 J.","points": 0.25},{"type": "mcq","level": "NB","q": "Ném hòn đá lên cao rồi nó rơi xuống (bỏ qua sức cản). Quá trình chuyển hóa năng lượng là:","options": ["A. Động năng thành thế năng rồi thế năng thành động năng","B. Thế năng thành động năng rồi động năng thành thế năng","C. Chỉ có động năng thành thế năng","D. Chỉ có thế năng thành động năng"],"answer": "A","explain": "Đi lên: Wđ thành Wt; rơi xuống: Wt thành Wđ.","points": 0.25},{"type": "mcq","level": "VDC","q": "Hòn đá trên (0,2 kg, ném với vận tốc 10 m/s, bỏ qua sức cản) lên đến độ cao cực đại là:","options": ["A. 2 m","B. 5 m","C. 10 m","D. 20 m"],"answer": "B","explain": "W = 10 J = P.h = 2.h, suy ra h = 5 m.","points": 0.25},{"type": "mcq","level": "TH","q": "Độ cao cực đại mà vật ném lên đạt được phụ thuộc vào:","options": ["A. Khối lượng của vật","B. Vận tốc ban đầu của vật","C. Màu sắc của vật","D. Hình dạng của vật"],"answer": "B","explain": "Vận tốc ban đầu càng lớn thì lên càng cao (bỏ qua sức cản).","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật được ném lên, tại thời điểm vừa ném, cơ năng của vật chủ yếu ở dạng:","options": ["A. Thế năng","B. Động năng","C. Nhiệt năng","D. Điện năng"],"answer": "B","explain": "Lúc ném, vật có vận tốc lớn nhất nên động năng lớn nhất.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về vật được ném lên (bỏ qua sức cản).","statements": ["a) Ném vật lên với vận tốc càng lớn thì độ cao cực đại càng lớn.","b) Độ cao cực đại không phụ thuộc khối lượng của vật.","c) Vật nặng hơn ném với cùng vận tốc sẽ lên cao hơn.","d) Tại điểm cao nhất, vận tốc của vật bằng 0."],"answer": ["T","T","F","T"],"explain": "Bỏ qua sức cản, độ cao cực đại chỉ phụ thuộc vận tốc ban đầu.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về sức cản không khí.","statements": ["a) Trong thực tế, vật ném lên không đạt độ cao lí thuyết vì có sức cản.","b) Sức cản biến một phần cơ năng thành nhiệt năng.","c) Bỏ qua sức cản là mô hình lí tưởng hóa.","d) Khi có sức cản, cơ năng của vật vẫn được bảo toàn."],"answer": ["T","T","T","F"],"explain": "Có sức cản thì cơ năng giảm dần, không bảo toàn.","points": 1},{"type": "short","level": "VD","q": "Ném hai vật có khối lượng khác nhau lên với cùng vận tốc ban đầu (bỏ qua sức cản). Vật nào lên cao hơn?","answer": "Cao bằng nhau","explain": "Độ cao cực đại không phụ thuộc khối lượng.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật được ném lên đạt độ cao cực đại 20 m (bỏ qua sức cản, g = 10 m/s^2). Vận tốc ban đầu của vật là bao nhiêu m/s?","answer": "20","explain": "1/2.m.v^2 = m.10.20, suy ra v = 20 m/s.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Thế năng đàn hồi có phải là một thành phần của cơ năng không?","options": ["A. Có","B. Không","C. Chỉ khi không có trọng trường","D. Chỉ khi vật đứng yên"],"answer": "A","explain": "Cơ năng gồm động năng và mọi dạng thế năng, kể cả thế năng đàn hồi.","points": 0.25},{"type": "mcq","level": "TH","q": "Lò xo nằm ngang bị nén rồi thả cho viên bi chuyển động (bỏ qua ma sát). Sự chuyển hóa năng lượng là:","options": ["A. Thế năng đàn hồi thành động năng","B. Động năng thành thế năng đàn hồi","C. Nhiệt năng thành động năng","D. Thế năng trọng trường thành động năng"],"answer": "A","explain": "Lò xo bung ra, thế năng đàn hồi chuyển thành động năng của bi.","points": 0.25},{"type": "mcq","level": "VD","q": "Lò xo bị nén dự trữ thế năng đàn hồi 12 J. Thả ra đẩy viên bi (bỏ qua ma sát), động năng cực đại của viên bi là:","options": ["A. 0 J","B. 6 J","C. 12 J","D. 24 J"],"answer": "C","explain": "Toàn bộ thế năng đàn hồi chuyển thành động năng.","points": 0.25},{"type": "mcq","level": "VDC","q": "Dùng súng lò xo bắn viên đạn lên cao (bỏ qua sức cản). Các chuyển hóa năng lượng diễn ra theo thứ tự:","options": ["A. Thế năng đàn hồi thành động năng rồi thành thế năng trọng trường","B. Động năng thành thế năng đàn hồi","C. Thế năng trọng trường thành động năng","D. Nhiệt năng thành động năng"],"answer": "A","explain": "Lò xo bung (thế năng đàn hồi thành động năng), đạn bay lên (động năng thành thế năng).","points": 0.25},{"type": "mcq","level": "TH","q": "Viên đạn lên đến điểm cao nhất thì có:","options": ["A. Động năng cực đại","B. Thế năng trọng trường cực đại","C. Thế năng đàn hồi cực đại","D. Cơ năng bằng 0"],"answer": "B","explain": "Tại điểm cao nhất, độ cao lớn nhất nên thế năng trọng trường cực đại.","points": 0.25},{"type": "mcq","level": "NB","q": "Ná cao su bắn đạn dựa vào dạng năng lượng nào của dây?","options": ["A. Thế năng đàn hồi của dây","B. Động năng của tay","C. Thế năng trọng trường","D. Nhiệt năng"],"answer": "A","explain": "Dây ná bị kéo căng dự trữ thế năng đàn hồi.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về lò xo.","statements": ["a) Lò xo bị biến dạng có thế năng đàn hồi.","b) Thả lò xo đang nén, thế năng đàn hồi chuyển thành động năng.","c) Cơ năng bao gồm cả thế năng đàn hồi.","d) Lò xo ở trạng thái tự nhiên có thế năng đàn hồi cực đại."],"answer": ["T","T","T","F"],"explain": "Lò xo ở trạng thái tự nhiên có thế năng đàn hồi bằng 0.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về bắn ná cao su (bỏ qua sức cản).","statements": ["a) Khi bắn: thế năng đàn hồi chuyển thành động năng của đạn.","b) Đạn bay lên: động năng chuyển thành thế năng trọng trường.","c) Đạn rơi xuống: thế năng chuyển thành động năng.","d) Trong toàn bộ quá trình, cơ năng được bảo toàn."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Khi lò xo đang bị nén, nó dự trữ dạng năng lượng nào?","answer": "Thế năng đàn hồi","explain": "Lò xo bị biến dạng có thế năng đàn hồi.","points": 0.5},{"type": "short","level": "TH","q": "Buông tay khỏi lò xo đang nén có gắn viên bi, thế năng đàn hồi chuyển thành dạng năng lượng nào của viên bi?","answer": "Động năng","explain": "Thế năng đàn hồi chuyển thành động năng làm bi chuyển động.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Định luật bảo toàn cơ năng chỉ áp dụng khi:","options": ["A. Luôn luôn đúng trong mọi trường hợp","B. Không có ma sát và lực cản","C. Có ma sát rất lớn","D. Vật đứng yên"],"answer": "B","explain": "Có ma sát thì cơ năng giảm dần, không bảo toàn.","points": 0.25},{"type": "mcq","level": "TH","q": "Định luật bảo toàn năng lượng (tổng quát) phát biểu: năng lượng không tự sinh ra, không tự mất đi mà:","options": ["A. Biến mất hoàn toàn","B. Chuyển hóa từ dạng này sang dạng khác","C. Tăng mãi","D. Giảm mãi"],"answer": "B","explain": "Năng lượng chỉ chuyển từ dạng này sang dạng khác.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật trượt từ đỉnh dốc xuống, có ma sát. Cơ năng của vật giảm 20 J. Nhiệt năng sinh ra do ma sát là:","options": ["A. 0 J","B. 20 J","C. 40 J","D. Không xác định được"],"answer": "B","explain": "Phần cơ năng mất đi chuyển thành nhiệt năng.","points": 0.25},{"type": "mcq","level": "VDC","q": "Máy bơm nước dùng điện năng để đưa nước lên cao. Hiệu suất 80%, điện năng tiêu thụ 1000 J. Thế năng mà nước thu được là:","options": ["A. 1000 J","B. 800 J","C. 200 J","D. 1250 J"],"answer": "B","explain": "Năng lượng có ích = 1000.80% = 800 J.","points": 0.25},{"type": "mcq","level": "TH","q": "Phần năng lượng hao phí trong ví dụ trên đã chuyển thành:","options": ["A. Thế năng","B. Nhiệt năng và các dạng năng lượng khác","C. Động năng","D. Mất hẳn"],"answer": "B","explain": "Năng lượng không mất đi mà chuyển thành nhiệt năng và dạng khác.","points": 0.25},{"type": "mcq","level": "NB","q": "Hiệu suất cho biết:","options": ["A. Năng lượng hao phí","B. Tỉ số giữa năng lượng có ích và năng lượng toàn phần","C. Tổng năng lượng","D. Công suất của máy"],"answer": "B","explain": "Hiệu suất = năng lượng có ích / năng lượng toàn phần.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về năng lượng.","statements": ["a) Năng lượng không tự sinh ra cũng không tự mất đi.","b) Năng lượng chỉ chuyển từ dạng này sang dạng khác.","c) Hiệu suất của máy trong thực tế luôn nhỏ hơn 100%.","d) Ma sát làm năng lượng biến mất hoàn toàn."],"answer": ["T","T","T","F"],"explain": "Ma sát chỉ chuyển năng lượng sang dạng khác, không làm mất đi.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về biến đổi năng lượng.","statements": ["a) Động cơ nhiệt biến nhiệt năng thành cơ năng.","b) Nhà máy thủy điện biến thế năng của nước thành điện năng.","c) Pin mặt trời biến quang năng thành điện năng.","d) Mọi quá trình biến đổi năng lượng đều tuân theo định luật bảo toàn năng lượng."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Năng lượng không tự sinh ra và cũng không tự mất đi, mà chỉ chuyển hóa từ dạng này sang dạng khác. Đó là nội dung của định luật nào?","answer": "Định luật bảo toàn năng lượng","explain": "Đó là định luật bảo toàn năng lượng.","points": 0.5},{"type": "short","level": "TH","q": "Một máy có hiệu suất 75%, cung cấp 400 J điện năng. Năng lượng có ích thu được là bao nhiêu jun?","answer": "300","explain": "Năng lượng có ích = 400.75% = 300 J.","points": 0.5}]}]}
