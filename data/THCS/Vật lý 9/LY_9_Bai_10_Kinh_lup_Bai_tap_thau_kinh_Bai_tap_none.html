ều, bằng vật","B. Ảo, cùng chiều, lớn hơn vật","C. Thật, cùng chiều, nhỏ hơn vật","D. Không có ảnh"],"answer": "A","explain": "Tại 2F: ảnh thật, ngược chiều, bằng vật.","points": 0.25},{"type": "mcq","level": "VD","q": "Thấu kính hội tụ có tiêu cự 15 cm, vật đặt cách thấu kính 30 cm. Ảnh cách thấu kính:","options": ["A. 30 cm","B. 15 cm","C. 45 cm","D. 7,5 cm"],"answer": "A","explain": "d = 2f nên d' = 2f = 30 cm.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật ở rất xa thấu kính (d rất lớn so với f), khoảng cách từ ảnh đến thấu kính xấp xỉ:","options": ["A. f","B. 2f","C. Vô cực","D. 0"],"answer": "A","explain": "Vật ở vô cực cho ảnh tại tiêu điểm.","points": 0.25},{"type": "mcq","level": "VDC","q": "Thấu kính hội tụ có f = 10 cm, vật đặt cách thấu kính 15 cm. Khoảng cách từ ảnh đến thấu kính là:","options": ["A. 30 cm","B. 6 cm","C. 25 cm","D. 5 cm"],"answer": "A","explain": "1/d' = 1/10 - 1/15 = 1/30, suy ra d' = 30 cm.","points": 0.25},{"type": "mcq","level": "TH","q": "Độ phóng đại của ảnh trong ví dụ trên là:","options": ["A. 2","B. 0,5","C. 1","D. 3"],"answer": "A","explain": "k = 30/15 = 2.","points": 0.25},{"type": "mcq","level": "NB","q": "Ảnh thật qua thấu kính hội tụ luôn:","options": ["A. Ngược chiều với vật","B. Cùng chiều với vật","C. Bằng vật","D. Nhỏ hơn vật"],"answer": "A","explain": "Ảnh thật luôn ngược chiều với vật.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về bài tập thấu kính.","statements": ["a) Vật tại 2F thì ảnh tại 2F, bằng vật.","b) Vật ở rất xa thì ảnh gần như tại tiêu điểm.","c) Với f = 10 cm, d = 15 cm thì d' = 30 cm.","d) Ảnh thật qua thấu kính hội tụ luôn cùng chiều với vật."],"answer": ["T","T","T","F"],"explain": "Ảnh thật luôn ngược chiều với vật.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về độ phóng đại.","statements": ["a) k = d'/d cho biết độ lớn của ảnh so với vật.","b) k lớn hơn 1: ảnh lớn hơn vật.","c) k nhỏ hơn 1: ảnh nhỏ hơn vật.","d) Ảnh thật qua thấu kính hội tụ luôn lớn hơn vật."],"answer": ["T","T","T","F"],"explain": "Ảnh thật có thể nhỏ hơn, bằng hoặc lớn hơn vật.","points": 1},{"type": "short","level": "VD","q": "Thấu kính hội tụ có f = 20 cm, vật đặt cách thấu kính 60 cm. Ảnh cách thấu kính bao nhiêu xăngtimét?","answer": "30","explain": "1/d' = 1/20 - 1/60 = 1/30, suy ra d' = 30 cm.","points": 0.5},{"type": "short","level": "VDC","q": "Vật sáng cao 2 cm đặt vuông góc với trục chính của thấu kính hội tụ (f = 10 cm), cách thấu kính 30 cm. Ảnh cao bao nhiêu xăngtimét?","answer": "1","explain": "d' = 15 cm, k = 0,5, ảnh cao 1 cm.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Ảnh ảo qua thấu kính hội tụ thì:","options": ["A. Cùng chiều, lớn hơn vật","B. Ngược chiều, nhỏ hơn vật","C. Cùng chiều, nhỏ hơn vật","D. Ngược chiều, lớn hơn vật"],"answer": "A","explain": "Vật trong F cho ảnh ảo, cùng chiều, lớn hơn vật.","points": 0.25},{"type": "mcq","level": "TH","q": "Muốn có ảnh ảo lớn hơn vật qua thấu kính hội tụ, ta đặt vật:","options": ["A. Trong khoảng tiêu cự","B. Ngoài khoảng 2F","C. Tại 2F","D. Rất xa"],"answer": "A","explain": "Vật trong F cho ảnh ảo lớn hơn vật.","points": 0.25},{"type": "mcq","level": "VD","q": "Thấu kính hội tụ có f = 12 cm, vật đặt cách thấu kính 8 cm. Ảnh thu được là:","options": ["A. Ảo, cùng chiều, lớn hơn vật","B. Thật, ngược chiều, nhỏ hơn vật","C. Thật, cùng chiều, bằng vật","D. Không có ảnh"],"answer": "A","explain": "d nhỏ hơn f nên ảnh ảo, cùng chiều, lớn hơn vật.","points": 0.25},{"type": "mcq","level": "VDC","q": "Khoảng cách từ ảnh đến thấu kính trong ví dụ trên là:","options": ["A. 24 cm","B. 4,8 cm","C. 20 cm","D. 96 cm"],"answer": "A","explain": "1/d' = 1/12 - 1/8 = -1/24, ảnh ảo cách thấu kính 24 cm.","points": 0.25},{"type": "mcq","level": "TH","q": "Độ phóng đại của ảnh trong ví dụ trên là:","options": ["A. 3","B. 1/3","C. 1,5","D. 12"],"answer": "A","explain": "k = 24/8 = 3.","points": 0.25},{"type": "mcq","level": "NB","q": "Ảnh ảo thì:","options": ["A. Không hứng được trên màn","B. Hứng được trên màn","C. Luôn nhỏ hơn vật","D. Luôn ngược chiều"],"answer": "A","explain": "Ảnh ảo không hứng được trên màn.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về ảnh ảo.","statements": ["a) Vật trong F cho ảnh ảo.","b) Ảnh ảo cùng chiều và lớn hơn vật.","c) Với f = 12 cm, d = 8 cm thì ảnh cách thấu kính 24 cm.","d) Ảnh ảo hứng được trên màn."],"answer": ["T","T","T","F"],"explain": "Ảnh ảo không hứng được trên màn.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về kính lúp.","statements": ["a) Kính lúp cho ảnh ảo lớn hơn vật.","b) Muốn có ảnh ảo phải đặt vật trong F.","c) Ảnh ảo nằm cùng phía với vật so với thấu kính.","d) Ảnh ảo qua thấu kính hội tụ luôn nhỏ hơn vật."],"answer": ["T","T","T","F"],"explain": "Ảnh ảo qua thấu kính hội tụ luôn lớn hơn vật.","points": 1},{"type": "short","level": "VD","q": "Vật đặt trong khoảng tiêu cự của thấu kính hội tụ cho ảnh thật hay ảnh ảo?","answer": "Ảnh ảo","explain": "Vật trong F cho ảnh ảo.","points": 0.5},{"type": "short","level": "VDC","q": "Thấu kính hội tụ có f = 10 cm, vật đặt cách thấu kính 5 cm. Ảnh lớn gấp mấy lần vật?","answer": "2","explain": "Ảnh ảo cách thấu kính 10 cm, k = 10/5 = 2.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "TH","q": "Thấu kính phân kì luôn cho ảnh:","options": ["A. Ảo, cùng chiều, nhỏ hơn vật","B. Thật, ngược chiều, lớn hơn vật","C. Thật, cùng chiều, bằng vật","D. Ảo, ngược chiều, lớn hơn vật"],"answer": "A","explain": "Thấu kính phân kì luôn cho ảnh ảo, cùng chiều, nhỏ hơn vật.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức thấu kính có áp dụng được cho thấu kính phân kì không?","options": ["A. Có, với tiêu cự f mang dấu âm","B. Không áp dụng được","C. Chỉ áp dụng một nửa","D. Chỉ áp dụng khi vật ở xa"],"answer": "A","explain": "Áp dụng được với f mang dấu âm.","points": 0.25},{"type": "mcq","level": "VD","q": "Thấu kính phân kì có tiêu cự f = -20 cm (theo quy ước dấu), vật đặt cách thấu kính 30 cm. Khoảng cách từ ảnh đến thấu kính là:","options": ["A. 12 cm","B. 60 cm","C. 50 cm","D. 10 cm"],"answer": "A","explain": "1/d' = -1/20 - 1/30 = -1/12, ảnh ảo cách thấu kính 12 cm.","points": 0.25},{"type": "mcq","level": "VDC","q": "Độ phóng đại của ảnh trong ví dụ trên là:","options": ["A. 0,4","B. 2,5","C. 1","D. 1,5"],"answer": "A","explain": "k = 12/30 = 0,4.","points": 0.25},{"type": "mcq","level": "TH","q": "Kính cận thị là thấu kính phân kì, có tác dụng:","options": ["A. Đưa ảnh ảo của vật lại gần mắt hơn","B. Phóng to vật","C. Làm vật sáng hơn","D. Đổi màu vật"],"answer": "A","explain": "Kính cận đưa ảnh ảo lại gần, giúp mắt cận nhìn rõ vật ở xa.","points": 0.25},{"type": "mcq","level": "NB","q": "Người bị cận thị đeo kính phân kì để:","options": ["A. Nhìn rõ vật ở xa","B. Nhìn rõ vật ở gần","C. Nhìn trong bóng tối","D. Chống bụi"],"answer": "A","explain": "Kính phân kì giúp người cận nhìn rõ vật ở xa.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về thấu kính phân kì.","statements": ["a) Thấu kính phân kì luôn cho ảnh ảo nhỏ hơn vật.","b) Công thức thấu kính áp dụng được với f mang dấu âm.","c) Với f = -20 cm, d = 30 cm thì ảnh cách thấu kính 12 cm.","d) Ảnh qua thấu kính phân kì có thể là ảnh thật."],"answer": ["T","T","T","F"],"explain": "Thấu kính phân kì không bao giờ cho ảnh thật.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về kính cận.","statements": ["a) Kính cận là thấu kính phân kì.","b) Kính cận đưa ảnh của vật ở xa lại gần mắt hơn.","c) Người cận thị đeo kính hội tụ.","d) Thấu kính phân kì làm phân kì chùm tia tới."],"answer": ["T","T","F","T"],"explain": "Người cận thị đeo kính phân kì.","points": 1},{"type": "short","level": "VD","q": "Thấu kính phân kì luôn cho ảnh thật hay ảnh ảo?","answer": "Ảnh ảo","explain": "Thấu kính phân kì luôn cho ảnh ảo.","points": 0.5},{"type": "short","level": "VDC","q": "Người bị cận thị đeo loại thấu kính nào?","answer": "Thấu kính phân kì","explain": "Kính cận là thấu kính phân kì.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Máy ảnh tạo ra ảnh có tính chất:","options": ["A. Thật, ngược chiều, nhỏ trên phim","B. Ảo, cùng chiều, lớn","C. Thật, cùng chiều, bằng vật","D. Không có ảnh"],"answer": "A","explain": "Máy ảnh tạo ảnh thật, ngược chiều, nhỏ trên phim.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật cần chụp ở xa máy ảnh, ảnh hiện:","options": ["A. Gần tiêu điểm của vật kính","B. Rất xa vật kính","C. Tại vật kính","D. Ngoài máy ảnh"],"answer": "A","explain": "Vật ở xa cho ảnh gần tiêu điểm.","points": 0.25},{"type": "mcq","level": "VD","q": "Vật kính của máy ảnh có tiêu cự 5 cm, chụp một vật ở cách 10 m. Ảnh cách vật kính xấp xỉ:","options": ["A. 5 cm","B. 10 m","C. 5 m","D. 10 cm"],"answer": "A","explain": "d rất lớn so với f nên d' xấp xỉ f = 5 cm.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao ảnh trong ví dụ trên xấp xỉ tại tiêu điểm?","options": ["A. Vì d rất lớn so với f nên d' ≈ f","B. Vì vật kính bị hỏng","C. Vì phim quá nhạy","D. Vì ánh sáng yếu"],"answer": "A","explain": "Khi d rất lớn so với f, công thức cho d' xấp xỉ f.","points": 0.25},{"type": "mcq","level": "TH","q": "Để chụp vật ở gần, người ta phải:","options": ["A. Điều chỉnh khoảng cách giữa vật kính và phim (lấy nét)","B. Thay phim mới","C. Tắt đèn flash","D. Đứng xa ra"],"answer": "A","explain": "Lấy nét bằng cách thay đổi khoảng cách vật kính-phim.","points": 0.25},{"type": "mcq","level": "NB","q": "Phim (hoặc cảm biến) trong máy ảnh đóng vai trò:","options": ["A. Màn hứng ảnh","B. Vật kính","C. Nguồn sáng","D. Kính ngắm"],"answer": "A","explain": "Phim hứng ảnh thật như màn ảnh.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về máy ảnh.","statements": ["a) Máy ảnh dùng thấu kính hội tụ tạo ảnh thật nhỏ trên phim.","b) Vật ở xa cho ảnh gần tiêu điểm.","c) Chụp vật ở gần phải điều chỉnh lấy nét.","d) Ảnh trên phim là ảnh ảo."],"answer": ["T","T","T","F"],"explain": "Ảnh trên phim là ảnh thật.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về ống kính máy ảnh.","statements": ["a) Lấy nét là thay đổi khoảng cách giữa vật kính và phim.","b) Vật càng gần thì ảnh càng xa vật kính.","c) Ống kính máy ảnh là hệ thấu kính phức tạp.","d) Mọi máy ảnh đều chỉ có một thấu kính duy nhất."],"answer": ["T","T","T","F"],"explain": "Ống kính gồm nhiều thấu kính ghép lại.","points": 1},{"type": "short","level": "VD","q": "Trong máy ảnh, bộ phận nào đóng vai trò như màn hứng ảnh?","answer": "Phim","explain": "Phim (hoặc cảm biến) hứng ảnh thật.","points": 0.5},{"type": "short","level": "VDC","q": "Vì sao khi chụp vật ở gần phải điều chỉnh ống kính?","answer": "Để ảnh hiện rõ nét trên phim","explain": "Điều chỉnh để ảnh thật hiện đúng trên phim.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "TH","q": "Mắt người có thể xem như một thấu kính hội tụ (thể thủy tinh) tạo ảnh thật trên võng mạc. Khi nhìn vật ở xa, ảnh hiện:","options": ["A. Trên võng mạc","B. Trước võng mạc","C. Sau võng mạc","D. Ngoài mắt"],"answer": "A","explain": "Mắt điều tiết để ảnh hiện đúng trên võng mạc.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi nhìn vật ở gần, thể thủy tinh sẽ:","options": ["A. Phồng lên (tăng độ hội tụ)","B. Dẹt lại","C. Vỡ ra","D. Không thay đổi"],"answer": "A","explain": "Thể thủy tinh phồng lên để tăng độ hội tụ.","points": 0.25},{"type": "mcq","level": "VD","q": "Người bị viễn thị:","options": ["A. Nhìn gần khó, phải đeo kính hội tụ","B. Nhìn xa khó, phải đeo kính phân kì","C. Không nhìn thấy gì","D. Nhìn gần rất rõ"],"answer": "A","explain": "Viễn thị nhìn gần khó, đeo kính hội tụ.","points": 0.25},{"type": "mcq","level": "VDC","q": "Người bị cận thị:","options": ["A. Nhìn xa khó, phải đeo kính phân kì","B. Nhìn gần khó, phải đeo kính hội tụ","C. Không nhìn thấy gì","D. Nhìn xa rất rõ"],"answer": "A","explain": "Cận thị nhìn xa khó, đeo kính phân kì.","points": 0.25},{"type": "mcq","level": "TH","q": "Điểm cực viễn của mắt bình thường ở:","options": ["A. Vô cực","B. 25 cm","C. 1 m","D. 10 cm"],"answer": "A","explain": "Mắt bình thường nhìn rõ vật ở vô cực.","points": 0.25},{"type": "mcq","level": "NB","q": "Điểm cực cận của mắt người trẻ khỏe khoảng:","options": ["A. 25 cm","B. 1 m","C. 10 m","D. 1 cm"],"answer": "A","explain": "Cực cận khoảng 25 cm.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về mắt.","statements": ["a) Thể thủy tinh là một thấu kính hội tụ.","b) Võng mạc hứng ảnh thật.","c) Khi nhìn gần, thể thủy tinh phồng lên.","d) Khi nhìn xa, thể thủy tinh dẹt lại."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về tật của mắt.","statements": ["a) Cận thị: nhìn xa khó, đeo kính phân kì.","b) Viễn thị: nhìn gần khó, đeo kính hội tụ.","c) Kính cận đưa ảnh ảo của vật lại gần mắt hơn.","d) Người mắt tốt không cần đeo kính."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "VD","q": "Thể thủy tinh của mắt là thấu kính hội tụ hay phân kì?","answer": "Thấu kính hội tụ","explain": "Thể thủy tinh là thấu kính hội tụ.","points": 0.5},{"type": "short","level": "VDC","q": "Người bị viễn thị đeo loại kính nào?","answer": "Kính hội tụ","explain": "Viễn thị đeo kính hội tụ.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Kính hiển vi dùng để:","options": ["A. Quan sát vật rất nhỏ","B. Nhìn vật ở xa","C. Chụp ảnh","D. Đo khoảng cách"],"answer": "A","explain": "Kính hiển vi quan sát vật rất nhỏ.","points": 0.25},{"type": "mcq","level": "TH","q": "Kính hiển vi quang học có:","options": ["A. Vật kính và thị kính đều là thấu kính hội tụ","B. Hai thấu kính phân kì","C. Một thấu kính duy nhất","D. Gương và lăng kính"],"answer": "A","explain": "Cả vật kính và thị kính đều là thấu kính hội tụ.","points": 0.25},{"type": "mcq","level": "VD","q": "Vật kính của kính hiển vi tạo ra ảnh:","options": ["A. Thật, ngược chiều, lớn hơn vật","B. Ảo, cùng chiều, nhỏ hơn vật","C. Thật, cùng chiều, bằng vật","D. Không có ảnh"],"answer": "A","explain": "Vật kính tạo ảnh thật lớn hơn vật.","points": 0.25},{"type": "mcq","level": "VDC","q": "Thị kính của kính hiển vi đóng vai trò như:","options": ["A. Kính lúp để quan sát ảnh của vật kính","B. Gương phản xạ","C. Màn hứng ảnh","D. Nguồn sáng"],"answer": "A","explain": "Thị kính như kính lúp phóng đại tiếp ảnh của vật kính.","points": 0.25},{"type": "mcq","level": "TH","q": "Độ phóng đại của kính hiển vi bằng:","options": ["A. Tích độ phóng đại của vật kính và thị kính","B. Tổng độ phóng đại hai kính","C. Hiệu độ phóng đại hai kính","D. Thương độ phóng đại hai kính"],"answer": "A","explain": "Bằng tích hai độ phóng đại.","points": 0.25},{"type": "mcq","level": "NB","q": "Kính thiên văn dùng để:","options": ["A. Quan sát vật ở xa (thiên thể)","B. Quan sát vi khuẩn","C. Chụp ảnh cưới","D. Đo nhiệt độ"],"answer": "A","explain": "Kính thiên văn quan sát các thiên thể ở xa.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về kính hiển vi.","statements": ["a) Kính hiển vi dùng để quan sát vật rất nhỏ.","b) Vật kính tạo ảnh thật lớn hơn vật.","c) Thị kính đóng vai trò như kính lúp.","d) Kính hiển vi chỉ có một thấu kính."],"answer": ["T","T","T","F"],"explain": "Kính hiển vi có hai thấu kính chính.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về các loại kính.","statements": ["a) Độ phóng đại của kính hiển vi bằng tích hai độ phóng đại.","b) Kính thiên văn dùng để quan sát thiên thể.","c) Kính thiên văn khúc xạ dùng thấu kính hội tụ làm vật kính.","d) Kính lúp phóng đại được như kính hiển vi."],"answer": ["T","T","T","F"],"explain": "Kính hiển vi phóng đại lớn hơn nhiều.","points": 1},{"type": "short","level": "VD","q": "Kính hiển vi có mấy thấu kính chính? Đó là những thấu kính nào?","answer": "Hai: vật kính và thị kính","explain": "Kính hiển vi có vật kính và thị kính.","points": 0.5},{"type": "short","level": "VDC","q": "Vật kính của kính hiển vi tạo ra ảnh thật hay ảnh ảo?","answer": "Ảnh thật","explain": "Vật kính tạo ảnh thật lớn hơn vật.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Công thức tính độ phóng đại của ảnh qua thấu kính là:","options": ["A. k = h'/h = d'/d","B. k = d/d'","C. k = f/d","D. k = d.f"],"answer": "A","explain": "k = h'/h = d'/d.","points": 0.25},{"type": "mcq","level": "TH","q": "Độ phóng đại k lớn hơn 1 nghĩa là:","options": ["A. Ảnh lớn hơn vật","B. Ảnh nhỏ hơn vật","C. Ảnh bằng vật","D. Không có ảnh"],"answer": "A","explain": "k lớn hơn 1: ảnh lớn hơn vật.","points": 0.25},{"type": "mcq","level": "VD","q": "Vật cách thấu kính 20 cm, ảnh cách thấu kính 60 cm. Độ phóng đại k bằng:","options": ["A. 3","B. 1/3","C. 80","D. 40"],"answer": "A","explain": "k = 60/20 = 3.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vật cao 1 cm, cho ảnh qua thấu kính với độ phóng đại k = 3. Ảnh cao:","options": ["A. 3 cm","B. 1/3 cm","C. 4 cm","D. 2 cm"],"answer": "A","explain": "h' = k.h = 3 cm.","points": 0.25},{"type": "mcq","level": "TH","q": "Độ phóng đại k nhỏ hơn 1 nghĩa là:","options": ["A. Ảnh nhỏ hơn vật","B. Ảnh lớn hơn vật","C. Ảnh bằng vật","D. Không có ảnh"],"answer": "A","explain": "k nhỏ hơn 1: ảnh nhỏ hơn vật.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi d = d', độ phóng đại k bằng:","options": ["A. 1","B. 2","C. 0","D. Vô cực"],"answer": "A","explain": "k = d'/d = 1.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về độ phóng đại.","statements": ["a) Độ phóng đại tính bằng k = h'/h = d'/d.","b) k lớn hơn 1: ảnh lớn hơn vật.","c) k nhỏ hơn 1: ảnh nhỏ hơn vật.","d) k = 1: ảnh bằng vật."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về ví dụ.","statements": ["a) Với d = 20 cm, d' = 60 cm thì k = 3.","b) Vật cao 1 cm thì ảnh cao 3 cm.","c) k cho biết ảnh lớn hay nhỏ hơn vật.","d) k có đơn vị là xăngtimét."],"answer": ["T","T","T","F"],"explain": "k là đại lượng không có đơn vị.","points": 1},{"type": "short","level": "NB","q": "Đại lượng k = h'/h cho biết điều gì?","answer": "Độ phóng đại của ảnh","explain": "k cho biết độ phóng đại của ảnh.","points": 0.5},{"type": "short","level": "TH","q": "Vật cao 2 cm cho ảnh cao 6 cm. Độ phóng đại k bằng bao nhiêu?","answer": "3","explain": "k = 6/2 = 3.","points": 0.5}]}]}
