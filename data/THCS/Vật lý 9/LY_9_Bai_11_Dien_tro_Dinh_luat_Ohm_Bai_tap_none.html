y đồng cùng tiết diện, dây A dài gấp đôi dây B. Điện trở của dây A so với dây B:","options": ["A. Gấp đôi","B. Bằng nhau","C. Bằng một nửa","D. Gấp 4 lần"],"answer": "A","explain": "R tỉ lệ thuận với chiều dài.","points": 0.25},{"type": "mcq","level": "TH","q": "Điện trở của dây dẫn phụ thuộc vào:","options": ["A. Chiều dài, tiết diện và vật liệu làm dây","B. Hiệu điện thế đặt vào","C. Cường độ dòng điện","D. Nhiệt độ phòng"],"answer": "A","explain": "R = ρ.l/S nên phụ thuộc l, S và vật liệu.","points": 0.25},{"type": "mcq","level": "NB","q": "Chất nào sau đây dẫn điện tốt nhất?","options": ["A. Bạc","B. Sắt","C. Nicrom","D. Nhựa"],"answer": "A","explain": "Bạc có điện trở suất nhỏ nhất.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về điện trở của dây dẫn.","statements": ["a) Công thức: R = ρ.l/S.","b) Đơn vị của ρ là Ω.m.","c) Dây càng dài thì điện trở càng lớn.","d) Tiết diện càng lớn thì điện trở càng lớn."],"answer": ["T","T","T","F"],"explain": "Tiết diện càng lớn thì điện trở càng nhỏ.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về vật liệu.","statements": ["a) Bạc dẫn điện tốt nhất trong các kim loại thông dụng.","b) Dây đồng được dùng phổ biến vì rẻ và dẫn điện tốt.","c) Nicrom có điện trở suất lớn, dùng làm dây đốt nóng.","d) Điện trở suất không phụ thuộc vào nhiệt độ."],"answer": ["T","T","T","F"],"explain": "Điện trở suất của kim loại tăng khi nhiệt độ tăng.","points": 1},{"type": "short","level": "NB","q": "Viết công thức tính điện trở của dây dẫn theo điện trở suất.","answer": "R = ρ.l/S","explain": "Công thức: R = ρ.l/S.","points": 0.5},{"type": "short","level": "TH","q": "Dây dẫn có chiều dài tăng gấp đôi (tiết diện không đổi) thì điện trở thay đổi thế nào?","answer": "Tăng gấp đôi","explain": "R tỉ lệ thuận với chiều dài.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "TH","q": "Dây dẫn có tiết diện tăng gấp đôi (chiều dài không đổi) thì điện trở:","options": ["A. Giảm một nửa","B. Tăng gấp đôi","C. Không thay đổi","D. Tăng gấp 4 lần"],"answer": "A","explain": "R tỉ lệ nghịch với tiết diện.","points": 0.25},{"type": "mcq","level": "NB","q": "Ampe kế được mắc:","options": ["A. Nối tiếp với đoạn mạch cần đo","B. Song song với đoạn mạch cần đo","C. Tùy ý","D. Không cần mắc"],"answer": "A","explain": "Ampe kế mắc nối tiếp.","points": 0.25},{"type": "mcq","level": "VD","q": "Vôn kế đo hiệu điện thế hai đầu điện trở 5 Ω chỉ 10 V. Cường độ dòng điện qua điện trở là:","options": ["A. 2 A","B. 50 A","C. 0,5 A","D. 15 A"],"answer": "A","explain": "I = 10/5 = 2 A.","points": 0.25},{"type": "mcq","level": "VDC","q": "Mắc ampe kế (có điện trở rất nhỏ) nối tiếp vào mạch thì:","options": ["A. Hầu như không ảnh hưởng đến dòng điện trong mạch","B. Làm tăng điện trở mạch rất nhiều","C. Làm hỏng mạch","D. Làm giảm hiệu điện thế"],"answer": "A","explain": "Điện trở ampe kế rất nhỏ nên ảnh hưởng không đáng kể.","points": 0.25},{"type": "mcq","level": "TH","q": "Vôn kế được mắc:","options": ["A. Song song với đoạn mạch cần đo","B. Nối tiếp với đoạn mạch cần đo","C. Tùy ý","D. Không cần mắc"],"answer": "A","explain": "Vôn kế mắc song song.","points": 0.25},{"type": "mcq","level": "NB","q": "Ampe kế lí tưởng có điện trở:","options": ["A. Rất nhỏ (coi như bằng 0)","B. Rất lớn","C. Bằng 1 Ω","D. Bằng 100 Ω"],"answer": "A","explain": "Ampe kế lí tưởng có điện trở rất nhỏ.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về cách mắc dụng cụ đo.","statements": ["a) Ampe kế mắc nối tiếp với đoạn mạch.","b) Vôn kế mắc song song với đoạn mạch.","c) Ampe kế lí tưởng có điện trở rất nhỏ.","d) Vôn kế lí tưởng có điện trở rất lớn."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về sử dụng dụng cụ đo.","statements": ["a) Mắc nhầm vôn kế nối tiếp có thể ảnh hưởng lớn đến mạch.","b) Mắc nhầm ampe kế song song gây đoản mạch.","c) Luôn chọn thang đo phù hợp trước khi đo.","d) Có thể dùng vôn kế để đo cường độ dòng điện."],"answer": ["T","T","T","F"],"explain": "Vôn kế đo hiệu điện thế, không đo cường độ dòng điện.","points": 1},{"type": "short","level": "VD","q": "Ampe kế được mắc nối tiếp hay song song với đoạn mạch cần đo cường độ dòng điện?","answer": "Nối tiếp","explain": "Ampe kế mắc nối tiếp.","points": 0.5},{"type": "short","level": "VDC","q": "Vì sao không được mắc trực tiếp ampe kế vào hai cực của nguồn điện?","answer": "Vì gây đoản mạch, dòng điện rất lớn làm hỏng ampe kế","explain": "Ampe kế điện trở rất nhỏ nên dòng điện rất lớn.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Điện trở suất của đồng khoảng:","options": ["A. 1,7.10^-8 Ω.m","B. 1,7.10^-6 Ω.m","C. 1,1.10^-6 Ω.m","D. 10^-10 Ω.m"],"answer": "A","explain": "ρ của đồng khoảng 1,7.10^-8 Ω.m.","points": 0.25},{"type": "mcq","level": "TH","q": "Điện trở suất của nicrom khoảng:","options": ["A. 1,1.10^-6 Ω.m","B. 1,7.10^-8 Ω.m","C. 2,8.10^-8 Ω.m","D. 10^-8 Ω.m"],"answer": "A","explain": "ρ của nicrom khoảng 1,1.10^-6 Ω.m.","points": 0.25},{"type": "mcq","level": "VD","q": "Dây nicrom dài 10 m, tiết diện 0,5 mm^2. Điện trở của dây là:","options": ["A. 22 Ω","B. 2,2 Ω","C. 220 Ω","D. 0,22 Ω"],"answer": "A","explain": "R = 1,1.10^-6.10/(0,5.10^-6) = 22 Ω.","points": 0.25},{"type": "mcq","level": "VDC","q": "Dây đốt nóng của ấm điện thường làm bằng:","options": ["A. Nicrom vì có điện trở suất lớn và chịu nhiệt tốt","B. Đồng","C. Bạc","D. Nhôm"],"answer": "A","explain": "Nicrom tỏa nhiệt nhiều, chịu nhiệt tốt.","points": 0.25},{"type": "mcq","level": "TH","q": "Dây dẫn điện trong nhà thường làm bằng:","options": ["A. Đồng","B. Nicrom","C. Sắt","D. Chì"],"answer": "A","explain": "Đồng dẫn điện tốt, giá hợp lí.","points": 0.25},{"type": "mcq","level": "NB","q": "Vì sao dây dẫn điện dùng đồng mà dây đốt nóng lại dùng nicrom?","options": ["A. Vì đồng dẫn điện tốt, còn nicrom có điện trở suất lớn nên tỏa nhiệt nhiều","B. Vì đồng đắt hơn","C. Vì nicrom dẫn điện tốt hơn","D. Không có lí do"],"answer": "A","explain": "Mỗi vật liệu phù hợp với một mục đích sử dụng.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về điện trở suất.","statements": ["a) Điện trở suất của đồng khoảng 1,7.10^-8 Ω.m.","b) Điện trở suất của nicrom khoảng 1,1.10^-6 Ω.m.","c) Dây đốt nóng của ấm điện làm bằng nicrom.","d) Dây dẫn điện trong nhà làm bằng nicrom."],"answer": ["T","T","T","F"],"explain": "Dây dẫn điện trong nhà làm bằng đồng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về vật liệu.","statements": ["a) Đồng dẫn điện tốt và giá hợp lí nên dùng làm dây dẫn.","b) Nicrom tỏa nhiệt nhiều nên dùng làm dây đốt nóng.","c) Bạc dẫn điện tốt nhất nhưng đắt.","d) Sắt dẫn điện tốt hơn đồng."],"answer": ["T","T","T","F"],"explain": "Đồng dẫn điện tốt hơn sắt.","points": 1},{"type": "short","level": "NB","q": "Kim loại nào dẫn điện tốt nhất trong các kim loại thông dụng?","answer": "Bạc","explain": "Bạc có điện trở suất nhỏ nhất.","points": 0.5},{"type": "short","level": "TH","q": "Dây đốt nóng trong ấm điện thường làm bằng chất nào?","answer": "Nicrom","explain": "Dây đốt nóng làm bằng nicrom.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "TH","q": "Khi nhiệt độ tăng, điện trở suất của kim loại:","options": ["A. Tăng lên","B. Giảm đi","C. Không thay đổi","D. Bằng 0"],"answer": "A","explain": "ρ của kim loại tăng khi nhiệt độ tăng.","points": 0.25},{"type": "mcq","level": "NB","q": "Điện trở của dây tóc bóng đèn khi đang sáng so với khi nguội thì:","options": ["A. Lớn hơn","B. Nhỏ hơn","C. Bằng nhau","D. Bằng 0"],"answer": "A","explain": "Khi nóng, điện trở của dây tóc lớn hơn.","points": 0.25},{"type": "mcq","level": "VD","q": "Một dây dẫn có điện trở 10 Ω ở 20°C. Khi bị đốt nóng, điện trở của dây sẽ:","options": ["A. Lớn hơn 10 Ω","B. Nhỏ hơn 10 Ω","C. Vẫn bằng 10 Ω","D. Bằng 0"],"answer": "A","explain": "Nhiệt độ tăng làm điện trở tăng.","points": 0.25},{"type": "mcq","level": "VDC","q": "Bóng đèn sợi đốt khi vừa bật sáng thì dòng điện qua đèn so với khi sáng ổn định:","options": ["A. Lớn hơn","B. Nhỏ hơn","C. Bằng nhau","D. Bằng 0"],"answer": "A","explain": "Lúc nguội R nhỏ nên dòng điện lớn hơn.","points": 0.25},{"type": "mcq","level": "TH","q": "Vì sao bóng đèn sợi đốt thường bị cháy ngay lúc vừa bật?","options": ["A. Vì lúc nguội điện trở nhỏ nên dòng điện qua đèn rất lớn","B. Vì điện áp tăng đột ngột","C. Vì đèn đã cũ","D. Vì trời lạnh"],"answer": "A","explain": "Dòng điện lúc mới bật lớn gây cháy dây tóc yếu.","points": 0.25},{"type": "mcq","level": "NB","q": "Điện trở suất của vật liệu phụ thuộc vào:","options": ["A. Bản chất vật liệu và nhiệt độ","B. Chiều dài của dây","C. Tiết diện của dây","D. Hiệu điện thế"],"answer": "A","explain": "ρ phụ thuộc bản chất vật liệu và nhiệt độ.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về ảnh hưởng của nhiệt độ.","statements": ["a) Nhiệt độ tăng thì điện trở suất của kim loại tăng.","b) Dây tóc đang nóng sáng có điện trở lớn hơn khi nguội.","c) Bóng đèn dễ bị cháy lúc vừa bật.","d) Điện trở suất không phụ thuộc vào nhiệt độ."],"answer": ["T","T","T","F"],"explain": "Điện trở suất phụ thuộc vào nhiệt độ.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về bảo vệ mạch điện.","statements": ["a) Dòng điện qua bóng đèn lúc mới bật lớn hơn lúc sáng ổn định.","b) Cầu chì bảo vệ mạch khi dòng điện quá lớn.","c) Dây chảy của cầu chì có nhiệt độ nóng chảy thấp.","d) Có thể thay cầu chì bằng dây đồng to."],"answer": ["T","T","T","F"],"explain": "Dây đồng to không tự đứt khi quá tải, rất nguy hiểm.","points": 1},{"type": "short","level": "VD","q": "Khi nhiệt độ tăng, điện trở của dây kim loại tăng hay giảm?","answer": "Tăng","explain": "Điện trở tăng khi nhiệt độ tăng.","points": 0.5},{"type": "short","level": "VDC","q": "Vì sao bóng đèn sợi đốt thường bị cháy ngay lúc vừa bật?","answer": "Vì lúc nguội điện trở nhỏ nên dòng điện lớn","explain": "Dòng điện lớn lúc mới bật làm cháy dây tóc.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Công thức nào sau đây là của định luật Ohm?","options": ["A. I = U/R","B. U = I/R","C. R = I.U","D. I = R/U"],"answer": "A","explain": "Định luật Ohm: I = U/R.","points": 0.25},{"type": "mcq","level": "TH","q": "Từ công thức I = U/R suy ra hiệu điện thế U bằng:","options": ["A. I.R","B. I/R","C. R/I","D. I + R"],"answer": "A","explain": "U = I.R.","points": 0.25},{"type": "mcq","level": "VD","q": "Dòng điện 0,2 A chạy qua điện trở 50 Ω. Hiệu điện thế giữa hai đầu điện trở là:","options": ["A. 10 V","B. 250 V","C. 0,004 V","D. 50,2 V"],"answer": "A","explain": "U = 0,2.50 = 10 V.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một bóng đèn có điện trở 484 Ω mắc vào hiệu điện thế 220 V. Cường độ dòng điện qua đèn là:","options": ["A. Khoảng 0,45 A","B. 2,2 A","C. 106480 A","D. 264 A"],"answer": "A","explain": "I = 220/484 = 0,45 A.","points": 0.25},{"type": "mcq","level": "TH","q": "Tăng hiệu điện thế gấp 3 lần (điện trở không đổi) thì cường độ dòng điện:","options": ["A. Tăng gấp 3 lần","B. Tăng gấp 9 lần","C. Không thay đổi","D. Giảm 3 lần"],"answer": "A","explain": "I tỉ lệ thuận với U.","points": 0.25},{"type": "mcq","level": "NB","q": "Giảm điện trở một nửa (hiệu điện thế không đổi) thì cường độ dòng điện:","options": ["A. Tăng gấp đôi","B. Giảm một nửa","C. Không thay đổi","D. Tăng gấp 4 lần"],"answer": "A","explain": "I tỉ lệ nghịch với R.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về các công thức.","statements": ["a) U = I.R.","b) R = U/I.","c) Tăng U gấp 3 lần thì I tăng gấp 3 lần.","d) Giảm R một nửa thì I giảm một nửa."],"answer": ["T","T","T","F"],"explain": "Giảm R một nửa thì I tăng gấp đôi.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về bóng đèn.","statements": ["a) Bóng đèn 220 V - 484 Ω có dòng điện khoảng 0,45 A.","b) Cường độ dòng điện tỉ lệ thuận với hiệu điện thế.","c) Cường độ dòng điện tỉ lệ nghịch với điện trở.","d) Điện trở tỉ lệ thuận với hiệu điện thế đặt vào."],"answer": ["T","T","T","F"],"explain": "Điện trở không phụ thuộc vào U và I đặt vào.","points": 1},{"type": "short","level": "NB","q": "Viết công thức tính hiệu điện thế theo cường độ dòng điện và điện trở.","answer": "U = I.R","explain": "U = I.R.","points": 0.5},{"type": "short","level": "TH","q": "Viết công thức tính điện trở theo hiệu điện thế và cường độ dòng điện.","answer": "R = U/I","explain": "R = U/I.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "TH","q": "Hai dây dẫn cùng vật liệu, cùng tiết diện, một dây dài 2 m, một dây dài 4 m. Tỉ số điện trở của hai dây là:","options": ["A. 1:2","B. 2:1","C. 1:4","D. 1:1"],"answer": "A","explain": "R tỉ lệ thuận với chiều dài nên tỉ số là 2:4 = 1:2.","points": 0.25},{"type": "mcq","level": "NB","q": "Hai dây cùng vật liệu, cùng chiều dài, tiết diện lần lượt là 1 mm^2 và 2 mm^2. Tỉ số điện trở của hai dây là:","options": ["A. 2:1","B. 1:2","C. 1:4","D. 4:1"],"answer": "A","explain": "R tỉ lệ nghịch với tiết diện nên tỉ số là 2:1.","points": 0.25},{"type": "mcq","level": "VD","q": "Dây nhôm (ρ = 2,8.10^-8 Ω.m) dài 200 m, tiết diện 2 mm^2. Điện trở của dây là:","options": ["A. 2,8 Ω","B. 28 Ω","C. 0,28 Ω","D. 280 Ω"],"answer": "A","explain": "R = 2,8.10^-8.200/(2.10^-6) = 2,8 Ω.","points": 0.25},{"type": "mcq","level": "VDC","q": "Dây sắt (ρ = 12.10^-8 Ω.m) và dây đồng (ρ = 1,7.10^-8 Ω.m) có cùng kích thước. Điện trở của dây sắt gấp khoảng mấy lần dây đồng?","options": ["A. Khoảng 7 lần","B. Bằng nhau","C. 0,14 lần","D. 70 lần"],"answer": "A","explain": "Tỉ số = 12/1,7 = 7,06.","points": 0.25},{"type": "mcq","level": "TH","q": "Muốn giảm điện trở của dây dẫn mà không đổi vật liệu, có thể:","options": ["A. Tăng tiết diện hoặc giảm chiều dài","B. Tăng chiều dài","C. Giảm tiết diện","D. Tăng nhiệt độ"],"answer": "A","explain": "R = ρ.l/S nên tăng S hoặc giảm l đều giảm R.","points": 0.25},{"type": "mcq","level": "NB","q": "Dây dẫn càng to (tiết diện càng lớn) thì điện trở:","options": ["A. Càng nhỏ","B. Càng lớn","C. Không thay đổi","D. Bằng 0"],"answer": "A","explain": "Tiết diện lớn thì điện trở nhỏ.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về điện trở của dây.","statements": ["a) Dây dài gấp đôi thì điện trở gấp đôi.","b) Tiết diện gấp đôi thì điện trở giảm một nửa.","c) Điện trở của dây sắt lớn hơn dây đồng cùng kích thước.","d) Muốn điện trở nhỏ thì dùng dây ngắn và to."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về so sánh vật liệu.","statements": ["a) Tỉ số điện trở suất của sắt và đồng khoảng 7.","b) Dây càng dài thì điện trở càng lớn.","c) Dây càng to thì điện trở càng nhỏ.","d) Điện trở không phụ thuộc vào vật liệu làm dây."],"answer": ["T","T","T","F"],"explain": "Điện trở phụ thuộc vào vật liệu qua ρ.","points": 1},{"type": "short","level": "VD","q": "Hai dây đồng cùng tiết diện, dây A dài 3 m, dây B dài 9 m. Điện trở của dây B gấp mấy lần dây A?","answer": "3","explain": "Tỉ số chiều dài là 3 nên điện trở gấp 3 lần.","points": 0.5},{"type": "short","level": "VDC","q": "Muốn điện trở của dây dẫn giảm một nửa mà không đổi vật liệu, có thể làm gì?","answer": "Tăng tiết diện gấp đôi","explain": "Tăng S gấp đôi thì R giảm một nửa.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Dụng cụ dùng để đo cường độ dòng điện là:","options": ["A. Ampe kế","B. Vôn kế","C. Oát kế","D. Nhiệt kế"],"answer": "A","explain": "Ampe kế đo cường độ dòng điện.","points": 0.25},{"type": "mcq","level": "TH","q": "Dụng cụ dùng để đo hiệu điện thế là:","options": ["A. Vôn kế","B. Ampe kế","C. Oát kế","D. Thước kẻ"],"answer": "A","explain": "Vôn kế đo hiệu điện thế.","points": 0.25},{"type": "mcq","level": "VD","q": "Muốn xác định điện trở của một dây dẫn, ta cần đo:","options": ["A. Hiệu điện thế và cường độ dòng điện rồi tính R = U/I","B. Chỉ cần hiệu điện thế","C. Chỉ cần cường độ dòng điện","D. Chỉ cần chiều dài dây"],"answer": "A","explain": "Đo U và I rồi áp dụng R = U/I.","points": 0.25},{"type": "mcq","level": "VDC","q": "Đo được hiệu điện thế 8 V, cường độ dòng điện 0,4 A. Điện trở của dây dẫn là:","options": ["A. 20 Ω","B. 3,2 Ω","C. 0,05 Ω","D. 8,4 Ω"],"answer": "A","explain": "R = 8/0,4 = 20 Ω.","points": 0.25},{"type": "mcq","level": "TH","q": "Sơ đồ mạch điện để đo điện trở gồm:","options": ["A. Nguồn, ampe kế mắc nối tiếp, vôn kế mắc song song với điện trở","B. Chỉ có nguồn và điện trở","C. Hai ampe kế","D. Hai vôn kế"],"answer": "A","explain": "Đó là sơ đồ đo điện trở.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong sơ đồ đo điện trở, vôn kế được mắc:","options": ["A. Song song với điện trở cần đo","B. Nối tiếp với điện trở cần đo","C. Tùy ý","D. Không mắc vào mạch"],"answer": "A","explain": "Vôn kế mắc song song với điện trở.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về đo điện trở.","statements": ["a) Đo điện trở bằng cách đo U và I.","b) Ampe kế mắc nối tiếp trong mạch.","c) Vôn kế mắc song song với điện trở cần đo.","d) Điện trở tính bằng R = U/I."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về tiến hành đo.","statements": ["a) Sơ đồ đo gồm nguồn, công tắc, ampe kế, vôn kế và điện trở.","b) Đóng công tắc rồi mới đọc số chỉ.","c) Đọc số chỉ khi mạch đang hở.","d) Thay đổi hiệu điện thế, đo nhiều lần rồi lấy trung bình."],"answer": ["T","T","F","T"],"explain": "Phải đóng mạch mới có dòng điện để đo.","points": 1},{"type": "short","level": "NB","q": "Muốn xác định điện trở của dây dẫn, ta cần đo những đại lượng nào?","answer": "Hiệu điện thế và cường độ dòng điện","explain": "Đo U và I rồi tính R = U/I.","points": 0.5},{"type": "short","level": "TH","q": "Trong mạch đo điện trở, vôn kế được mắc như thế nào với điện trở cần đo?","answer": "Song song","explain": "Vôn kế mắc song song với điện trở.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Định luật Ohm áp dụng đúng cho:","options": ["A. Vật dẫn kim loại ở nhiệt độ không đổi","B. Mọi vật liệu","C. Chất cách điện","D. Chân không"],"answer": "A","explain": "Định luật Ohm đúng cho vật dẫn kim loại ở nhiệt độ không đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Dây tóc bóng đèn khi đang nóng sáng:","options": ["A. Không tuân theo định luật Ohm một cách chặt chẽ (vì điện trở thay đổi)","B. Tuân theo định luật Ohm hoàn toàn","C. Không có điện trở","D. Là chất cách điện"],"answer": "A","explain": "Nhiệt độ thay đổi làm R thay đổi.","points": 0.25},{"type": "mcq","level": "VD","q": "Đồ thị biểu diễn sự phụ thuộc của U vào I đối với vật dẫn Ohm là:","options": ["A. Đường thẳng đi qua gốc tọa độ","B. Đường cong","C. Đường gấp khúc","D. Đường tròn"],"answer": "A","explain": "U = I.R với R không đổi nên đồ thị là đường thẳng qua gốc.","points": 0.25},{"type": "mcq","level": "VDC","q": "Từ đồ thị U-I của vật dẫn, điện trở được xác định bằng:","options": ["A. Tỉ số U/I (độ dốc của đường thẳng)","B. Diện tích dưới đường cong","C. Chu vi","D. Không xác định được"],"answer": "A","explain": "R = U/I chính là độ dốc của đường thẳng.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật dẫn có đồ thị U-I là đường cong thì:","options": ["A. Không phải là vật dẫn Ohm","B. Là vật dẫn Ohm","C. Không dẫn điện","D. Là kim loại"],"answer": "A","explain": "Vật dẫn Ohm có đồ thị là đường thẳng.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị của hiệu điện thế là:","options": ["A. Vôn (V)","B. Ampe (A)","C. Ôm (Ω)","D. Oát (W)"],"answer": "A","explain": "Hiệu điện thế đo bằng vôn.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về định luật Ohm.","statements": ["a) Định luật Ohm đúng cho kim loại ở nhiệt độ không đổi.","b) Đồ thị U-I của vật dẫn Ohm là đường thẳng qua gốc tọa độ.","c) Dây tóc nóng sáng không tuân theo một cách chặt chẽ.","d) Mọi chất đều là vật dẫn Ohm."],"answer": ["T","T","T","F"],"explain": "Chất bán dẫn, chất điện phân không phải vật dẫn Ohm.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về đồ thị U-I.","statements": ["a) Từ đồ thị U-I tính được R = U/I.","b) Đường U-I càng dốc thì điện trở càng lớn.","c) Vật dẫn Ohm có điện trở không đổi.","d) Chất bán dẫn là vật dẫn Ohm."],"answer": ["T","T","T","F"],"explain": "Chất bán dẫn không phải vật dẫn Ohm.","points": 1},{"type": "short","level": "NB","q": "Đồ thị biểu diễn sự phụ thuộc của U vào I đối với vật dẫn Ohm có dạng gì?","answer": "Đường thẳng qua gốc tọa độ","explain": "Đồ thị là đường thẳng qua gốc tọa độ.","points": 0.5},{"type": "short","level": "TH","q": "Định luật Ohm chỉ đúng khi nhiệt độ của dây dẫn như thế nào?","answer": "Không đổi","explain": "Nhiệt độ phải không đổi.","points": 0.5}]}]}
