: ["A. Ủ chất thải hữu cơ","B. Đốt than","C. Lọc dầu mỏ","D. Điện phân nước"],"answer": "A","explain": "Ủ chất thải hữu cơ tạo biogas.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về địa nhiệt và sinh khối.","statements": ["a) Địa nhiệt là năng lượng từ hơi nóng trong lòng đất.","b) Địa nhiệt khai thác ở nơi có núi lửa, suối nước nóng.","c) Sinh khối là năng lượng từ chất thải nông nghiệp, rác hữu cơ.","d) Khí biogas tạo ra từ đốt than đá."],"answer": ["T","T","T","F"],"explain": "Biogas từ ủ chất thải hữu cơ.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về ứng dụng.","statements": ["a) Địa nhiệt dùng để phát điện và sưởi ấm.","b) Địa nhiệt ổn định, không phụ thuộc thời tiết.","c) Đốt sinh khối tạo nhiệt, ủ tạo biogas.","d) Sinh khối là nhiên liệu hóa thạch."],"answer": ["T","T","T","F"],"explain": "Sinh khối là năng lượng tái tạo.","points": 1},{"type": "short","level": "NB","q": "Năng lượng địa nhiệt là năng lượng từ đâu?","answer": "Từ hơi nóng trong lòng đất","explain": "Từ lòng đất.","points": 0.5},{"type": "short","level": "TH","q": "Khí biogas được tạo ra từ đâu?","answer": "Ủ chất thải hữu cơ","explain": "Từ ủ chất thải hữu cơ.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "TH","q": "Phát triển bền vững là sự phát triển:","options": ["A. Đáp ứng nhu cầu hiện tại mà không làm hại thế hệ tương lai","B. Chỉ lo cho hiện tại","C. Ngừng phát triển","D. Chỉ phát triển kinh tế"],"answer": "A","explain": "Đó là phát triển bền vững.","points": 0.25},{"type": "mcq","level": "NB","q": "Để sử dụng năng lượng bền vững cần:","options": ["A. Tiết kiệm năng lượng và tăng năng lượng tái tạo","B. Lãng phí năng lượng","C. Chỉ dùng than đá","D. Tăng đốt dầu mỏ"],"answer": "A","explain": "Tiết kiệm và tăng tái tạo.","points": 0.25},{"type": "mcq","level": "VD","q": "Học sinh có thể tiết kiệm năng lượng bằng cách:","options": ["A. Tắt đèn, quạt khi ra khỏi phòng","B. Bật tất cả thiết bị cùng lúc","C. Để điều hòa 16 độ cả ngày","D. Dùng đèn sợi đốt"],"answer": "A","explain": "Tắt thiết bị khi không dùng.","points": 0.25},{"type": "mcq","level": "VDC","q": "Dùng thiết bị dán nhãn năng lượng 5 sao giúp:","options": ["A. Tiết kiệm điện năng","B. Tốn điện hơn","C. Tăng ô nhiễm","D. Giảm tuổi thọ"],"answer": "A","explain": "Thiết bị hiệu suất cao tiết kiệm điện.","points": 0.25},{"type": "mcq","level": "TH","q": "Tiết kiệm năng lượng góp phần:","options": ["A. Bảo vệ môi trường và phát triển bền vững","B. Tăng hiệu ứng nhà kính","C. Cạn kiệt nhanh hơn","D. Tăng giá điện"],"answer": "A","explain": "Góp phần bảo vệ môi trường.","points": 0.25},{"type": "mcq","level": "NB","q": "Năng lượng tái tạo giúp giảm:","options": ["A. Phát thải khí nhà kính","B. Lượng mưa","C. Tốc độ gió","D. Ánh nắng"],"answer": "A","explain": "Giảm phát thải khí nhà kính.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về phát triển bền vững.","statements": ["a) Phát triển bền vững không làm hại thế hệ tương lai.","b) Cần tiết kiệm năng lượng và tăng năng lượng tái tạo.","c) Tắt thiết bị khi không dùng giúp tiết kiệm năng lượng.","d) Nên lãng phí năng lượng để phát triển nhanh."],"answer": ["T","T","T","F"],"explain": "Cần tiết kiệm năng lượng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về tiết kiệm năng lượng.","statements": ["a) Thiết bị 5 sao tiết kiệm điện.","b) Tiết kiệm năng lượng bảo vệ môi trường.","c) Năng lượng tái tạo giảm phát thải khí nhà kính.","d) Để điều hòa 16 độ cả ngày giúp tiết kiệm điện."],"answer": ["T","T","T","F"],"explain": "Để nhiệt độ quá thấp tốn điện.","points": 1},{"type": "short","level": "NB","q": "Phát triển bền vững là gì?","answer": "Phát triển đáp ứng nhu cầu hiện tại mà không làm hại thế hệ tương lai","explain": "Đó là phát triển bền vững.","points": 0.5},{"type": "short","level": "TH","q": "Nêu hai việc cần làm để sử dụng năng lượng bền vững.","answer": "Tiết kiệm năng lượng và tăng năng lượng tái tạo","explain": "Hai việc sử dụng bền vững.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Năng lượng thủy triều là năng lượng từ:","options": ["A. Sự lên xuống của thủy triều","B. Sóng thần","C. Mưa","D. Bão"],"answer": "A","explain": "Từ thủy triều.","points": 0.25},{"type": "mcq","level": "TH","q": "Năng lượng thủy triều thuộc loại:","options": ["A. Năng lượng tái tạo","B. Năng lượng hóa thạch","C. Năng lượng hạt nhân","D. Năng lượng không tái tạo"],"answer": "A","explain": "Là năng lượng tái tạo.","points": 0.25},{"type": "mcq","level": "VD","q": "Nhà máy điện thủy triều hoạt động nhờ:","options": ["A. Dòng nước lên xuống làm quay tuabin","B. Đốt nhiên liệu","C. Pin mặt trời","D. Sức gió"],"answer": "A","explain": "Dòng thủy triều quay tuabin.","points": 0.25},{"type": "mcq","level": "VDC","q": "Hạn chế của điện thủy triều là:","options": ["A. Chỉ xây được ở vùng ven biển có thủy triều lớn","B. Gây ô nhiễm nặng","C. Tốn nhiên liệu","D. Thải CO2"],"answer": "A","explain": "Phụ thuộc vị trí địa lí.","points": 0.25},{"type": "mcq","level": "TH","q": "Năng lượng sóng biển thuộc loại:","options": ["A. Năng lượng tái tạo","B. Năng lượng hóa thạch","C. Năng lượng hạt nhân","D. Năng lượng không tái tạo"],"answer": "A","explain": "Là năng lượng tái tạo.","points": 0.25},{"type": "mcq","level": "NB","q": "Việt Nam có tiềm năng năng lượng tái tạo nào lớn?","options": ["A. Mặt trời, gió, thủy điện","B. Địa nhiệt","C. Thủy triều","D. Sóng biển"],"answer": "A","explain": "Mặt trời, gió, thủy điện.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về năng lượng biển.","statements": ["a) Năng lượng thủy triều từ sự lên xuống của thủy triều.","b) Điện thủy triều dùng dòng nước quay tuabin.","c) Năng lượng sóng biển là năng lượng tái tạo.","d) Năng lượng thủy triều là nhiên liệu hóa thạch."],"answer": ["T","T","T","F"],"explain": "Thủy triều là năng lượng tái tạo.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về tiềm năng.","statements": ["a) Việt Nam có tiềm năng mặt trời, gió, thủy điện lớn.","b) Điện thủy triều chỉ xây ở vùng có thủy triều lớn.","c) Năng lượng biển là năng lượng tái tạo.","d) Việt Nam không có tiềm năng năng lượng tái tạo."],"answer": ["T","T","T","F"],"explain": "Việt Nam có tiềm năng lớn.","points": 1},{"type": "short","level": "NB","q": "Năng lượng thủy triều là năng lượng từ đâu?","answer": "Từ sự lên xuống của thủy triều","explain": "Từ thủy triều.","points": 0.5},{"type": "short","level": "TH","q": "Kể tên hai tiềm năng năng lượng tái tạo lớn của Việt Nam.","answer": "Mặt trời và gió","explain": "Hai tiềm năng lớn.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "TH","q": "So sánh năng lượng tái tạo và hóa thạch, điểm khác biệt cơ bản là:","options": ["A. Tái tạo không cạn kiệt, hóa thạch sẽ cạn kiệt","B. Tái tạo gây ô nhiễm hơn","C. Hóa thạch sạch hơn","D. Không có khác biệt"],"answer": "A","explain": "Khác biệt cơ bản.","points": 0.25},{"type": "mcq","level": "NB","q": "Nguồn năng lượng nào sạch hơn?","options": ["A. Năng lượng tái tạo","B. Than đá","C. Dầu mỏ","D. Khí thiên nhiên"],"answer": "A","explain": "Tái tạo sạch hơn.","points": 0.25},{"type": "mcq","level": "VD","q": "Vì sao các nước đẩy mạnh phát triển năng lượng tái tạo?","options": ["A. Vì hóa thạch cạn kiệt và gây biến đổi khí hậu","B. Vì tái tạo rẻ hơn hẳn","C. Vì hóa thạch hết năng lượng","D. Vì tái tạo không cần đầu tư"],"answer": "A","explain": "Vì hóa thạch cạn kiệt, gây biến đổi khí hậu.","points": 0.25},{"type": "mcq","level": "VDC","q": "Thách thức lớn khi phát triển năng lượng tái tạo là:","options": ["A. Công suất chưa ổn định, chi phí đầu tư cao","B. Gây ô nhiễm nặng","C. Sẽ cạn kiệt","D. Không có công nghệ"],"answer": "A","explain": "Chưa ổn định, đầu tư cao.","points": 0.25},{"type": "mcq","level": "TH","q": "Giải pháp cho tính không ổn định của năng lượng tái tạo là:","options": ["A. Kết hợp nhiều nguồn và dùng pin tích trữ","B. Chỉ dùng một nguồn","C. Ngừng phát triển","D. Quay lại dùng than"],"answer": "A","explain": "Kết hợp nguồn và tích trữ.","points": 0.25},{"type": "mcq","level": "NB","q": "Pin tích trữ điện mặt trời dùng để:","options": ["A. Dùng điện khi không có nắng","B. Tăng công suất pin","C. Làm mát pin","D. Giảm giá thành"],"answer": "A","explain": "Tích trữ để dùng khi không nắng.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định so sánh.","statements": ["a) Tái tạo không cạn kiệt, hóa thạch sẽ cạn kiệt.","b) Năng lượng tái tạo sạch hơn hóa thạch.","c) Các nước đẩy mạnh tái tạo vì hóa thạch gây biến đổi khí hậu.","d) Hóa thạch sạch hơn năng lượng tái tạo."],"answer": ["T","T","T","F"],"explain": "Tái tạo sạch hơn.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về thách thức.","statements": ["a) Công suất tái tạo chưa ổn định.","b) Chi phí đầu tư ban đầu còn cao.","c) Kết hợp nhiều nguồn và pin tích trữ khắc phục tính không ổn định.","d) Năng lượng tái tạo không có hạn chế nào."],"answer": ["T","T","T","F"],"explain": "Tái tạo có hạn chế.","points": 1},{"type": "short","level": "NB","q": "Điểm khác biệt cơ bản giữa năng lượng tái tạo và hóa thạch là gì?","answer": "Tái tạo không cạn kiệt, hóa thạch sẽ cạn kiệt","explain": "Khác biệt cơ bản.","points": 0.5},{"type": "short","level": "TH","q": "Nêu một thách thức khi phát triển năng lượng tái tạo.","answer": "Công suất chưa ổn định, chi phí đầu tư cao","explain": "Thách thức lớn.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Năng lượng mặt trời, gió, nước đều có nguồn gốc từ:","options": ["A. Mặt Trời","B. Lòng đất","C. Mặt Trăng","D. Hóa thạch"],"answer": "A","explain": "Đều từ Mặt Trời.","points": 0.25},{"type": "mcq","level": "TH","q": "Năng lượng địa nhiệt có nguồn gốc từ:","options": ["A. Lòng đất","B. Mặt Trời","C. Mặt Trăng","D. Gió"],"answer": "A","explain": "Từ lòng đất.","points": 0.25},{"type": "mcq","level": "VD","q": "Năng lượng sinh khối có nguồn gốc từ:","options": ["A. Sinh vật (thực vật, chất thải hữu cơ)","B. Than đá","C. Dầu mỏ","D. Đá"],"answer": "A","explain": "Từ sinh vật.","points": 0.25},{"type": "mcq","level": "VDC","q": "Trong các nguồn tái tạo, nguồn nào KHÔNG phụ thuộc thời tiết?","options": ["A. Địa nhiệt","B. Mặt trời","C. Gió","D. Thủy triều"],"answer": "A","explain": "Địa nhiệt ổn định.","points": 0.25},{"type": "mcq","level": "TH","q": "Năng lượng nào sau đây vừa tái tạo vừa có nguồn gốc mặt trời?","options": ["A. Năng lượng gió","B. Năng lượng địa nhiệt","C. Năng lượng hạt nhân","D. Năng lượng hóa thạch"],"answer": "A","explain": "Gió có nguồn gốc mặt trời.","points": 0.25},{"type": "mcq","level": "NB","q": "Năng lượng hạt nhân có phải năng lượng tái tạo không?","options": ["A. Không","B. Có","C. Vừa có vừa không","D. Tùy loại"],"answer": "A","explain": "Hạt nhân không tái tạo.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về nguồn gốc.","statements": ["a) Mặt trời, gió, nước đều có nguồn gốc từ Mặt Trời.","b) Địa nhiệt có nguồn gốc từ lòng đất.","c) Sinh khối có nguồn gốc từ sinh vật.","d) Năng lượng hạt nhân là năng lượng tái tạo."],"answer": ["T","T","T","F"],"explain": "Hạt nhân không tái tạo.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về đặc điểm.","statements": ["a) Địa nhiệt ổn định, không phụ thuộc thời tiết.","b) Gió có nguồn gốc từ năng lượng mặt trời.","c) Mặt trời, gió phụ thuộc điều kiện tự nhiên.","d) Tất cả năng lượng tái tạo đều ổn định."],"answer": ["T","T","T","F"],"explain": "Nhiều nguồn phụ thuộc thời tiết.","points": 1},{"type": "short","level": "NB","q": "Các nguồn năng lượng mặt trời, gió, nước đều có nguồn gốc từ đâu?","answer": "Mặt Trời","explain": "Đều từ Mặt Trời.","points": 0.5},{"type": "short","level": "TH","q": "Trong các nguồn tái tạo, nguồn nào không phụ thuộc thời tiết?","answer": "Địa nhiệt","explain": "Địa nhiệt ổn định.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Năng lượng tái tạo gồm các dạng:","options": ["A. Mặt trời, gió, nước, địa nhiệt, sinh khối","B. Than đá, dầu mỏ","C. Uranium","D. Khí thiên nhiên"],"answer": "A","explain": "Các dạng tái tạo.","points": 0.25},{"type": "mcq","level": "TH","q": "Pin mặt trời biến đổi:","options": ["A. Quang năng thành điện năng","B. Điện năng thành quang năng","C. Nhiệt năng thành điện năng","D. Cơ năng thành điện năng"],"answer": "A","explain": "Quang năng thành điện năng.","points": 0.25},{"type": "mcq","level": "VD","q": "Tuabin gió biến đổi:","options": ["A. Động năng của gió thành điện năng","B. Điện năng thành động năng","C. Nhiệt năng thành điện năng","D. Hóa năng thành điện năng"],"answer": "A","explain": "Động năng gió thành điện năng.","points": 0.25},{"type": "mcq","level": "VDC","q": "Để phát triển bền vững cần:","options": ["A. Tiết kiệm năng lượng, tăng tái tạo, bảo vệ môi trường","B. Chỉ dùng than đá","C. Lãng phí năng lượng","D. Tăng phát thải CO2"],"answer": "A","explain": "Ba việc phát triển bền vững.","points": 0.25},{"type": "mcq","level": "TH","q": "Thủy điện biến đổi:","options": ["A. Thế năng của nước thành điện năng","B. Hóa năng thành điện năng","C. Quang năng thành điện năng","D. Nhiệt năng thành điện năng"],"answer": "A","explain": "Thế năng nước thành điện năng.","points": 0.25},{"type": "mcq","level": "NB","q": "Nguồn năng lượng không cạn kiệt là:","options": ["A. Năng lượng tái tạo","B. Than đá","C. Dầu mỏ","D. Khí thiên nhiên"],"answer": "A","explain": "Là năng lượng tái tạo.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định tổng kết.","statements": ["a) Tái tạo gồm mặt trời, gió, nước, địa nhiệt, sinh khối.","b) Pin mặt trời biến quang năng thành điện năng.","c) Tuabin gió biến động năng gió thành điện năng.","d) Than đá là năng lượng tái tạo."],"answer": ["T","T","T","F"],"explain": "Than đá không tái tạo.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định tổng kết.","statements": ["a) Thủy điện biến thế năng nước thành điện năng.","b) Phát triển bền vững cần tiết kiệm và tăng tái tạo.","c) Năng lượng tái tạo không cạn kiệt.","d) Nên tăng đốt nhiên liệu hóa thạch."],"answer": ["T","T","T","F"],"explain": "Cần giảm đốt hóa thạch.","points": 1},{"type": "short","level": "NB","q": "Kể tên các dạng năng lượng tái tạo đã học.","answer": "Mặt trời, gió, nước, địa nhiệt, sinh khối","explain": "Các dạng tái tạo.","points": 0.5},{"type": "short","level": "TH","q": "Để phát triển bền vững về năng lượng cần làm gì?","answer": "Tiết kiệm năng lượng, tăng tái tạo, bảo vệ môi trường","explain": "Ba việc phát triển bền vững.","points": 0.5}]}]}
