{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Lăng kính là:","options": ["A. Khối chất trong suốt, đồng chất, thường có tiết diện thẳng là tam giác","B. Khối kim loại đặc","C. Một loại thấu kính","D. Một loại gương"],"answer": "A","explain": "Lăng kính là khối trong suốt đồng chất, tiết diện thẳng là tam giác.","points": 0.25},{"type": "mcq","level": "TH","q": "Các bộ phận của lăng kính gồm:","options": ["A. Cạnh, đáy và hai mặt bên","B. Tiêu điểm và quang tâm","C. Mặt cầu lồi và mặt cầu lõm","D. Cực và đỉnh"],"answer": "A","explain": "Lăng kính gồm cạnh, đáy và hai mặt bên.","points": 0.25},{"type": "mcq","level": "VD","q": "Tia sáng truyền qua lăng kính bị lệch về phía nào của lăng kính?","options": ["A. Phía đỉnh","B. Phía đáy","C. Không bị lệch","D. Phía mặt bên"],"answer": "B","explain": "Tia ló lệch về phía đáy của lăng kính.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao tia ló qua lăng kính lại lệch về phía đáy?","options": ["A. Do hiện tượng phản xạ","B. Do khúc xạ hai lần tại hai mặt bên, mỗi lần đều làm tia lệch về phía đáy","C. Do hiện tượng tán sắc","D. Do lăng kính hấp thụ ánh sáng"],"answer": "B","explain": "Mỗi lần khúc xạ tại mặt bên đều làm tia lệch về phía đáy.","points": 0.25},{"type": "mcq","level": "NB","q": "Góc tạo bởi tia tới và tia ló khi qua lăng kính gọi là:","options": ["A. Góc tới","B. Góc lệch D","C. Góc khúc xạ","D. Góc phản xạ"],"answer": "B","explain": "Đó là góc lệch, kí hiệu D.","points": 0.25},{"type": "mcq","level": "TH","q": "Góc lệch qua lăng kính đạt giá trị cực tiểu khi:","options": ["A. Tia tới vuông góc với mặt bên","B. Đường đi của tia sáng đối xứng qua mặt phân giác của góc chiết quang","C. Góc tới bằng 0","D. Góc tới bằng 90°"],"answer": "B","explain": "Dmin xảy ra khi tia đi đối xứng.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về lăng kính.","statements": ["a) Lăng kính là khối chất trong suốt, đồng chất.","b) Tiết diện thẳng của lăng kính thường là tam giác.","c) Tia ló lệch về phía đáy của lăng kính.","d) Lăng kính được làm bằng kim loại."],"answer": ["T","T","T","F"],"explain": "Lăng kính làm bằng thủy tinh hoặc nhựa trong, không phải kim loại.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về đường đi của tia sáng.","statements": ["a) Tia sáng bị khúc xạ hai lần khi truyền qua lăng kính.","b) Mỗi lần khúc xạ đều làm tia sáng lệch về phía đáy.","c) Góc lệch là góc giữa tia tới và tia ló.","d) Lăng kính chỉ cho ánh sáng trắng đi qua."],"answer": ["T","T","T","F"],"explain": "Lăng kính cho mọi ánh sáng đi qua, không chỉ ánh sáng trắng.","points": 1},{"type": "short","level": "NB","q": "Lăng kính thường có tiết diện thẳng là hình gì?","answer": "Hình tam giác","explain": "Tiết diện thẳng của lăng kính là tam giác.","points": 0.5},{"type": "short","level": "TH","q": "Tia sáng truyền qua lăng kính bị lệch về phía nào của lăng kính?","answer": "Phía đáy","explain": "Tia ló lệch về phía đáy.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "TH","q": "Ứng dụng của lăng kính trong máy quang phổ là:","options": ["A. Hội tụ ánh sáng","B. Tán sắc ánh sáng trắng thành dải màu","C. Phản xạ ánh sáng","D. Hấp thụ ánh sáng"],"answer": "B","explain": "Máy quang phổ dùng lăng kính để tán sắc, phân tích ánh sáng.","points": 0.25},{"type": "mcq","level": "NB","q": "Hiện tượng tán sắc ánh sáng là hiện tượng:","options": ["A. Tách chùm sáng trắng thành dải màu","B. Hội tụ chùm sáng","C. Phản xạ chùm sáng","D. Hấp thụ chùm sáng"],"answer": "A","explain": "Tán sắc là tách ánh sáng trắng thành các màu.","points": 0.25},{"type": "mcq","level": "VD","q": "Chiếu chùm sáng trắng qua lăng kính, trên màn hứng ta thu được:","options": ["A. Một vệt sáng trắng","B. Dải màu từ đỏ đến tím","C. Một điểm sáng","D. Bóng tối"],"answer": "B","explain": "Ánh sáng trắng bị tán sắc thành dải màu.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao mỗi màu trong chùm sáng trắng lại  suất lớn nhất nên lệch nhiều nhất.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Lăng kính phản xạ toàn phần có tác dụng:","options": ["A. Tán sắc ánh sáng","B. Đổi hướng chùm sáng mà hầu như không mất mát ánh sáng","C. Hội tụ chùm sáng","D. Phân kì chùm sáng"],"answer": "B","explain": "Lăng kính phản xạ toàn phần đổi hướng chùm sáng hiệu quả.","points": 0.25},{"type": "mcq","level": "TH","q": "Tiết diện thẳng của lăng kính phản xạ toàn phần thường là:","options": ["A. Tam giác vuông cân","B. Tam giác đều","C. Hình vuông","D. Hình chữ nhật"],"answer": "A","explain": "Thường dùng lăng kính tam giác vuông cân.","points": 0.25},{"type": "mcq","level": "VD","q": "Trong ống nhòm, lăng kính phản xạ toàn phần có tác dụng:","options": ["A. Phóng to ảnh","B. Làm gọn ống kính và đổi hướng chùm sáng","C. Tán sắc ánh sáng","D. Hấp thụ ánh sáng thừa"],"answer": "B","explain": "Lăng kính giúp ống nhòm gọn nhẹ và cho ảnh thuận chiều.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao người ta dùng lăng kính thay gương trong ống nhòm cao cấp?","options": ["A. Vì rẻ hơn","B. Vì phản xạ toàn phần gần như không mất mát ánh sáng","C. Vì nhẹ hơn gương","D. Vì đẹp hơn"],"answer": "B","explain": "Gương thường hấp thụ một phần ánh sáng, lăng kính thì không.","points": 0.25},{"type": "mcq","level": "TH","q": "Chiếu tia sáng vuông góc vào mặt bên của lăng kính tam giác vuông cân (thủy tinh n = 1,5). Tia sáng tới mặt huyền với góc tới:","options": ["A. 45°","B. 90°","C. 0°","D. 30°"],"answer": "A","explain": "Tia vuông góc mặt bên sẽ tới mặt huyền với góc 45°.","points": 0.25},{"type": "mcq","level": "NB","q": "Với thủy tinh n = 1,5, góc giới hạn là 41,8°. Tia tới mặt huyền với góc 45° sẽ:","options": ["A. Khúc xạ ra ngoài","B. Bị phản xạ toàn phần","C. Truyền thẳng","D. Bị hấp thụ"],"answer": "B","explain": "45° lớn hơn 41,8° nên xảy ra phản xạ toàn phần.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về lăng kính phản xạ toàn phần.","statements": ["a) Lăng kính phản xạ toàn phần có tiết diện tam giác vuông cân.","b) Nó có thể đổi hướng chùm sáng 90° hoặc 180°.","c) Nó được dùng trong ống nhòm, máy ảnh.","d) Nó hoạt động dựa trên hiện tượng khúc xạ."],"answer": ["T","T","T","F"],"explain": "Nó hoạt động dựa trên hiện tượng phản xạ toàn phần.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về lăng kính trong ống nhòm.","statements": ["a) Tia vào vuông góc mặt bên thì tới mặt huyền với góc 45°.","b) Góc 45° lớn hơn góc giới hạn 41,8° nên xảy ra phản xạ toàn phần.","c) Chùm sáng bị đổi hướng mà không mất mát đáng kể.","d) Gương thường phản xạ tốt hơn lăng kính phản xạ toàn phần."],"answer": ["T","T","T","F"],"explain": "Lăng kính phản xạ toàn phần tốt hơn gương thường.","points": 1},{"type": "short","level": "NB","q": "Lăng kính phản xạ toàn phần hoạt động dựa trên hiện tượng nào?","answer": "Phản xạ toàn phần","explain": "Đúng như tên gọi của nó.","points": 0.5},{"type": "short","level": "TH","q": "Nêu một dụng cụ quang học sử dụng lăng kính phản xạ toàn phần.","answer": "Ống nhòm","explain": "Ống nhòm dùng lăng kính phản xạ toàn phần.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "TH","q": "Đáy của lăng kính là:","options": ["A. Một trong hai mặt bên","B. Mặt đối diện với cạnh","C. Mặt bên thứ nhất","D. Mặt bên thứ hai"],"answer": "B","explain": "Đáy là mặt đối diện với cạnh của lăng kính.","points": 0.25},{"type": "mcq","level": "NB","q": "Cạnh của lăng kính là:","options": ["A. Giao tuyến của hai mặt bên","B. Đường chéo của đáy","C. Đường cao của tam giác","D. Mép của lăng kính"],"answer": "A","explain": "Cạnh là giao tuyến của hai mặt bên.","points": 0.25},{"type": "mcq","level": "VD","q": "Góc chiết quang A của lăng kính là góc:","options": ["A. Giữa hai mặt bên","B. Giữa tia tới và tia ló","C. Giữa tia tới và pháp tuyến","D. Giữa tia ló và đáy"],"answer": "A","explain": "Góc chiết quang là góc nhị diện giữa hai mặt bên.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một lăng kính có góc chiết quang A = 60°, chiết suất n = 1,5. Góc lệch cực tiểu Dmin xấp xỉ:","options": ["A. 30°","B. Khoảng 37,2°","C. 48,6°","D. 60°"],"answer": "B","explain": "sin((Dmin+60°)/2) = 1,5.sin30° = 0,75, suy ra Dmin khoảng 37,2°.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi có góc lệch cực tiểu, đường đi của tia sáng qua lăng kính:","options": ["A. Đối xứng qua mặt phân giác của góc chiết quang","B. Vuông góc với đáy","C. Song song với đáy","D. Trùng với cạnh"],"answer": "A","explain": "Dmin xảy ra khi tia đi đối xứng.","points": 0.25},{"type": "mcq","level": "NB","q": "Góc lệch D qua lăng kính phụ thuộc vào:","options": ["A. Góc tới của tia sáng","B. Màu sắc áo của người quan sát","C. Nhiệt độ phòng","D. Thời gian trong ngày"],"answer": "A","explain": "Góc lệch phụ thuộc góc tới (và chiết suất).","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về các góc trong lăng kính.","statements": ["a) Góc chiết quang là góc giữa hai mặt bên.","b) Góc lệch là góc giữa tia tới và tia ló.","c) Góc lệch cực tiểu xảy ra khi tia đi đối xứng.","d) Mọi góc tới đều cho cùng một góc lệch."],"answer": ["T","T","T","F"],"explain": "Góc lệch thay đổi theo góc tới.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về đo chiết suất bằng lăng kính.","statements": ["a) Đo góc lệch cực tiểu có thể tính được chiết suất của lăng kính.","b) Công thức: n = sin((Dmin + A)/2) / sin(A/2).","c) Lăng kính có góc chiết quang càng lớn thì tán sắc càng mạnh.","d) Góc lệch không phụ thuộc vào chiết suất."],"answer": ["T","T","T","F"],"explain": "Góc lệch phụ thuộc chiết suất.","points": 1},{"type": "short","level": "VD","q": "Góc chiết quang của lăng kính là góc giữa hai bộ phận nào?","answer": "Hai mặt bên","explain": "Góc chiết quang là góc giữa hai mặt bên.","points": 0.5},{"type": "short","level": "VDC","q": "Một lăng kính có góc chiết quang 60°, chiết suất 1,5. Góc lệch cực tiểu xấp xỉ bao nhiêu độ?","answer": "37,2","explain": "Dmin khoảng 37,2°.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Chất liệu thường dùng để làm lăng kính là:","options": ["A. Thủy tinh hoặc nhựa trong suốt","B. Gỗ","C. Kim loại","D. Giấy"],"answer": "A","explain": "Lăng kính làm bằng thủy tinh hoặc nhựa trong suốt.","points": 0.25},{"type": "mcq","level": "TH","q": "Lăng kính phải được làm bằng chất:","options": ["A. Trong suốt và đồng chất","B. Đục và xốp","C. Dẫn điện tốt","D. Có màu sắc"],"answer": "A","explain": "Phải trong suốt và đồng chất để ánh sáng truyền qua tốt.","points": 0.25},{"type": "mcq","level": "VD","q": "Chiếu tia sáng đơn sắc màu đỏ qua lăng kính, trên màn hứng ta thu được:","options": ["A. Dải màu từ đỏ đến tím","B. Một vệt sáng đỏ bị lệch về phía đáy","C. Một điểm sáng trắng","D. Bóng tối"],"answer": "B","explain": "Ánh sáng đơn sắc không bị tán sắc, chỉ bị lệch về phía đáy.","points": 0.25},{"type": "mcq","level": "VDC","q": "Chiếu đồng thời một tia đỏ và một tia tím qua lăng kính. Tia nào bị lệch nhiều hơn?","options": ["A. Tia đỏ","B. Tia tím","C. Hai tia lệch bằng nhau","D. Không tia nào bị lệch"],"answer": "B","explain": "Chiết suất đối với tia tím lớn hơn nên tia tím lệch nhiều hơn.","points": 0.25},{"type": "mcq","level": "TH","q": "Máy quang phổ dùng để:","options": ["A. Đo cường độ ánh sáng","B. Phân tích thành phần của ánh sáng","C. Đo nhiệt độ","D. Đo khoảng cách"],"answer": "B","explain": "Máy quang phổ phân tích ánh sáng thành các thành phần đơn sắc.","points": 0.25},{"type": "mcq","level": "NB","q": "Quang phổ của ánh sáng trắng qua lăng kính gồm:","options": ["A. 3 màu","B. Dải màu liên tục từ đỏ đến tím","C. 1 màu","D. 7 vạch đen"],"answer": "B","explain": "Ánh sáng trắng cho quang phổ liên tục.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về lăng kính và ánh sáng đơn sắc.","statements": ["a) Lăng kính thường làm bằng thủy tinh trong suốt.","b) Ánh sáng đơn sắc qua lăng kính không bị tán sắc.","c) Máy quang phổ dùng để phân tích ánh sáng.","d) Lăng kính chỉ được dùng trong phòng thí nghiệm."],"answer": ["T","T","T","F"],"explain": "Lăng kính còn dùng trong ống nhòm, máy ảnh...","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về quang phổ.","statements": ["a) Mỗi nguyên tố hóa học có quang phổ vạch đặc trưng.","b) Máy quang phổ giúp nhận biết thành phần hóa học của vật.","c) Ánh sáng Mặt Trời cho quang phổ liên tục.","d) Hiện tượng tán sắc chỉ xảy ra ở lăng kính thủy tinh."],"answer": ["T","T","T","F"],"explain": "Tán sắc xảy ra ở mọi lăng kính trong suốt, không chỉ thủy tinh.","points": 1},{"type": "short","level": "NB","q": "Dụng cụ dùng lăng kính để phân tích ánh sáng thành các thành phần đơn sắc gọi là gì?","answer": "Máy quang phổ","explain": "Đó là máy quang phổ.","points": 0.5},{"type": "short","level": "TH","q": "Chiếu ánh sáng đơn sắc qua lăng kính có thu được dải màu không? Vì sao?","answer": "Không, vì ánh sáng đơn sắc không bị tán sắc","explain": "Chỉ ánh sáng trắng (hỗn hợp) mới bị tán sắc.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "TH","q": "Khi góc tới tăng dần từ giá trị nhỏ, góc lệch D qua lăng kính biến đổi như thế nào?","options": ["A. Tăng dần","B. Giảm đến cực tiểu rồi tăng trở lại","C. Không thay đổi","D. Giảm dần"],"answer": "B","explain": "D giảm đến Dmin rồi tăng khi i tiếp tục tăng.","points": 0.25},{"type": "mcq","level": "NB","q": "Góc lệch cực tiểu qua lăng kính thường được kí hiệu là:","options": ["A. Dmin","B. Dmax","C. A","D. igh"],"answer": "A","explain": "Kí hiệu là Dmin.","points": 0.25},{"type": "mcq","level": "VD","q": "Một lăng kính có góc lệch cực tiểu Dmin = 40°, góc chiết quang A = 60°. Chiết suất của lăng kính xấp xỉ:","options": ["A. 1,33","B. 1,41","C. 1,53","D. 2,42"],"answer": "C","explain": "n = sin(50°)/sin(30°) = 0,766/0,5 = 1,53.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao phương pháp đo chiết suất bằng lăng kính cho kết quả chính xác?","options": ["A. Vì lăng kính rất đẹp","B. Vì đo góc lệch cực tiểu dễ dàng và chính xác","C. Vì lăng kính rất rẻ","D. Vì không cần đo góc"],"answer": "B","explain": "Góc lệch cực tiểu dễ xác định chính xác.","points": 0.25},{"type": "mcq","level": "TH","q": "Để đo chiết suất của một chất lỏng, người ta có thể:","options": ["A. Dùng lăng kính rỗng chứa chất lỏng cần đo","B. Đun sôi chất lỏng","C. Cân khối lượng chất lỏng","D. Đo nhiệt độ sôi"],"answer": "A","explain": "Lăng kính rỗng chứa chất lỏng cho phép đo chiết suất.","points": 0.25},{"type": "mcq","level": "NB","q": "Lăng kính rỗng là lăng kính:","options": ["A. Không có chất liệu gì","B. Làm bằng thủy tinh mỏng, bên trong chứa chất cần đo chiết suất","C. Bằng kim loại rỗng","D. Bằng giấy"],"answer": "B","explain": "Lăng kính rỗng chứa chất lỏng cần đo.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về góc lệch cực tiểu.","statements": ["a) Góc lệch giảm đến cực tiểu rồi tăng khi góc tới tăng.","b) Đo Dmin và A có thể tính được chiết suất.","c) Lăng kính rỗng dùng để đo chiết suất chất lỏng.","d) Chiết suất đo bằng lăng kính không chính xác."],"answer": ["T","T","T","F"],"explain": "Đây là phương pháp đo chiết suất chính xác.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về phương pháp lăng kính.","statements": ["a) Phương pháp lăng kính là phương pháp chuẩn để đo chiết suất.","b) Góc lệch cực tiểu không phụ thuộc bước sóng ánh sáng.","c) Mỗi màu có góc lệch cực tiểu hơi khác nhau.","d) Đo với ánh sáng đơn sắc cho chiết suất của màu đó."],"answer": ["T","F","T","T"],"explain": "Do tán sắc nên Dmin hơi khác nhau theo màu.","points": 1},{"type": "short","level": "VD","q": "Khi góc tới tăng dần, góc lệch D qua lăng kính biến đổi như thế nào?","answer": "Giảm đến cực tiểu rồi tăng","explain": "D giảm đến Dmin rồi tăng trở lại.","points": 0.5},{"type": "short","level": "VDC","q": "Để tính chiết suất của lăng kính bằng phương pháp góc lệch cực tiểu, cần đo những góc nào?","answer": "Góc lệch cực tiểu và góc chiết quang","explain": "Cần đo Dmin và A.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Tia sáng truyền qua lăng kính bị khúc xạ mấy lần?","options": ["A. 1 lần","B. 2 lần","C. 3 lần","D. 0 lần"],"answer": "B","explain": "Một lần khi đi vào, một lần khi đi ra.","points": 0.25},{"type": "mcq","level": "TH","q": "Lần khúc xạ thứ nhất xảy ra tại:","options": ["A. Mặt bên thứ nhất (tia tới đi vào lăng kính)","B. Mặt bên thứ hai","C. Đáy lăng kính","D. Đỉnh lăng kính"],"answer": "A","explain": "Lần 1 tại mặt bên thứ nhất, lần 2 tại mặt bên thứ hai.","points": 0.25},{"type": "mcq","level": "VD","q": "Chiếu tia sáng vuông góc vào mặt bên thứ nhất của lăng kính. Tại mặt này, tia sáng:","options": ["A. Bị gãy khúc mạnh","B. Truyền thẳng vào lăng kính","C. Bị phản xạ toàn phần","D. Bị hấp thụ"],"answer": "B","explain": "Góc tới bằng 0 nên tia truyền thẳng.","points": 0.25},{"type": "mcq","level": "VDC","q": "Chiếu tia sáng vuông góc vào mặt bên của lăng kính tam giác đều (n = 1,5). Tia sáng tới mặt bên thứ hai với góc tới:","options": ["A. 30°","B. 60°","C. 90°","D. 0°"],"answer": "B","explain": "Tia vuông góc mặt 1 sẽ tới mặt 2 với góc 60°.","points": 0.25},{"type": "mcq","level": "TH","q": "Với góc tới 60° trên mặt bên thứ hai (góc giới hạn 41,8°), tia sáng sẽ:","options": ["A. Ló ra ngoài","B. Bị phản xạ toàn phần","C. Truyền thẳng","D. Bị hấp thụ"],"answer": "B","explain": "60° lớn hơn 41,8° nên phản xạ toàn phần.","points": 0.25},{"type": "mcq","level": "NB","q": "Hiện tượng trên chính là nguyên tắc hoạt động của:","options": ["A. Lăng kính phản xạ toàn phần","B. Kính lúp","C. Gương phẳng","D. Kính hiển vi"],"answer": "A","explain": "Đó là nguyên tắc của lăng kính phản xạ toàn phần.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về tia vuông góc mặt bên.","statements": ["a) Tia vuông góc với mặt bên thứ nhất thì không bị khúc xạ ở mặt này.","b) Trong lăng kính tam giác đều, tia này tới mặt 2 với góc 60°.","c) Góc 60° lớn hơn góc giới hạn nên xảy ra phản xạ toàn phần.","d) Đây là nguyên tắc của lăng kính phản xạ toàn phần."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về ống nhòm.","statements": ["a) Lăng kính Porro trong ống nhòm gồm 2 lăng kính phản xạ toàn phần.","b) Hệ lăng kính giúp ảnh thuận chiều và ống kính gọn nhẹ.","c) Ống nhòm dùng thấu kính cũng cho ảnh thuận chiều.","d) Lăng kính giúp ống nhòm ngắn gọn hơn."],"answer": ["T","T","F","T"],"explain": "Thấu kính cho ảnh ngược chiều, cần lăng kính để đảo ảnh.","points": 1},{"type": "short","level": "VD","q": "Chiếu tia sáng vuông góc vào mặt bên của lăng kính tam giác đều. Tia sáng có bị khúc xạ tại mặt đó không?","answer": "Không, tia sáng truyền thẳng","explain": "Góc tới bằng 0 nên không bị gãy khúc.","points": 0.5},{"type": "short","level": "VDC","q": "Trong ống nhòm, hệ lăng kính có tác dụng gì đối với ảnh?","answer": "Cho ảnh thuận chiều và làm gọn ống kính","explain": "Lăng kính đảo ảnh ngược thành thuận và rút ngắn ống kính.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "TH","q": "Lăng kính và thấu kính khác nhau cơ bản ở điểm:","options": ["A. Lăng kính chỉ làm lệch chùm sáng, không hội tụ chùm song song thành một điểm","B. Thấu kính không làm lệch tia sáng","C. Lăng kính không dùng hiện tượng khúc xạ","D. Thấu kính không trong suốt"],"answer": "A","explain": "Lăng kính làm lệch chùm sáng, thấu kính hội tụ (hoặc phân kì) chùm sáng.","points": 0.25},{"type": "mcq","level": "NB","q": "Cả lăng kính và thấu kính đều hoạt động dựa trên hiện tượng:","options": ["A. Phản xạ ánh sáng","B. Khúc xạ ánh sáng","C. Tán sắc ánh sáng","D. Giao thoa ánh sáng"],"answer": "B","explain": "Cả hai đều dựa trên sự khúc xạ ánh sáng.","points": 0.25},{"type": "mcq","level": "VD","q": "Đặt một lăng kính trước một thấu kính hội tụ rồi chiếu chùm sáng trắng qua, trên màn ta thu được:","options": ["A. Một điểm sáng trắng","B. Một dải màu (do tán sắc rồi hội tụ)","C. Bóng tối","D. Một vệt sáng trắng"],"answer": "B","explain": "Lăng kính tán sắc, thấu kính hội tụ dải màu lên màn.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao thấu kính cũng gây ra hiện tượng tán sắc (quang sai màu)?","options": ["A. Vì chiết suất của thủy tinh khác nhau đối với mỗi màu sắc","B. Vì thấu kính quá dày","C. Vì ánh sáng quá mạnh","D. Vì thấu kính bị bẩn"],"answer": "A","explain": "Chiết suất phụ thuộc màu sắc nên tiêu điểm mỗi màu hơi khác nhau.","points": 0.25},{"type": "mcq","level": "TH","q": "Quang sai màu là hiện tượng:","options": ["A. Ảnh có viền màu do thấu kính tán sắc ánh sáng","B. Ảnh bị mờ","C. Ảnh bị ngược","D. Ảnh bị méo"],"answer": "A","explain": "Quang sai màu làm ảnh có viền màu.","points": 0.25},{"type": "mcq","level": "NB","q": "Để giảm quang sai màu, người ta thường dùng:","options": ["A. Thấu kính đơn","B. Hệ thấu kính ghép","C. Gương phẳng","D. Lăng kính"],"answer": "B","explain": "Hệ thấu kính ghép (achromat) khử được sắc sai.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về lăng kính và thấu kính.","statements": ["a) Cả lăng kính và thấu kính đều dùng hiện tượng khúc xạ.","b) Thấu kính hội tụ chùm song song thành một điểm.","c) Lăng kính dày cũng gây tán sắc như thấu kính.","d) Quang sai màu là hiện tượng ảnh có viền màu."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về sắc sai.","statements": ["a) Chiết suất phụ thuộc màu sắc gây ra tán sắc.","b) Thấu kính càng dày thì tán sắc càng mạnh.","c) Kính ảnh cao cấp dùng nhiều thấu kính để khử sắc sai.","d) Lăng kính không bao giờ gây tán sắc."],"answer": ["T","T","T","F"],"explain": "Lăng kính chính là dụng cụ tán sắc điển hình.","points": 1},{"type": "short","level": "NB","q": "Điểm giống nhau cơ bản giữa lăng kính và thấu kính là gì?","answer": "Đều hoạt động dựa trên hiện tượng khúc xạ ánh sáng","explain": "Cả hai đều dùng sự khúc xạ ánh sáng.","points": 0.5},{"type": "short","level": "TH","q": "Hiện tượng ảnh có viền màu do thấu kính gây ra gọi là gì?","answer": "Quang sai màu","explain": "Đó là hiện tượng quang sai màu (sắc sai).","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Góc giữa tia tới và pháp tuyến tại mặt bên thứ nhất của lăng kính gọi là:","options": ["A. Góc tới i1","B. Góc khúc xạ","C. Góc lệch","D. Góc chiết quang"],"answer": "A","explain": "Đó là góc tới tại mặt 1, kí hiệu i1.","points": 0.25},{"type": "mcq","level": "TH","q": "Các góc trong đường truyền tia sáng qua lăng kính thường được kí hiệu là:","options": ["A. i1, r1, r2, i2","B. i, r, i, r","C. A, B, C, D","D. x, y, z, t"],"answer": "A","explain": "Kí hiệu: góc tới i1, góc khúc xạ r1 ở mặt 1; r2, i2 ở mặt 2.","points": 0.25},{"type": "mcq","level": "VD","q": "Lăng kính có góc chiết quang A = 60°, tia sáng đi đối xứng (có góc lệch cực tiểu). Góc khúc xạ r1 bằng:","options": ["A. 60°","B. 30°","C. 45°","D. 90°"],"answer": "B","explain": "Khi đối xứng: r1 = r2 = A/2 = 30°.","points": 0.25},{"type": "mcq","level": "VDC","q": "Lăng kính trên có chiết suất n = 1,5. Khi có góc lệch cực tiểu, góc tới i1 bằng:","options": ["A. 30°","B. 48,6°","C. 60°","D. 37,2°"],"answer": "B","explain": "sin i1 = 1,5.sin30° = 0,75, suy ra i1 = 48,6°.","points": 0.25},{"type": "mcq","level": "TH","q": "Công thức lăng kính tại mặt bên thứ nhất là:","options": ["A. sin i1 = n.sin r1","B. sin i1 = sin r1","C. i1 = n.r1","D. i1 + r1 = A"],"answer": "A","explain": "Định luật khúc xạ tại mặt 1: sin i1 = n.sin r1.","points": 0.25},{"type": "mcq","level": "NB","q": "Tổng r1 + r2 trong lăng kính bằng:","options": ["A. Góc chiết quang A","B. 90°","C. Góc lệch D","D. 180°"],"answer": "A","explain": "Hệ thức: r1 + r2 = A.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về công thức lăng kính.","statements": ["a) r1 + r2 = A.","b) D = i1 + i2 - A.","c) Khi đối xứng: r1 = r2 = A/2.","d) Khi đối xứng: i1 = i2."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về công thức lăng kính.","statements": ["a) Từ công thức lăng kính có thể suy ra góc lệch cực tiểu.","b) Khi đối xứng: Dmin = 2.i1 - A.","c) Đo Dmin là cách đo chiết suất chính xác.","d) Công thức lăng kính chỉ đúng với lăng kính tam giác đều."],"answer": ["T","T","T","F"],"explain": "Công thức đúng với mọi lăng kính.","points": 1},{"type": "short","level": "VD","q": "Viết hệ thức liên hệ giữa r1, r2 và góc chiết quang A.","answer": "r1 + r2 = A","explain": "Hệ thức: r1 + r2 = A.","points": 0.5},{"type": "short","level": "VDC","q": "Viết công thức tính góc lệch D qua các góc i1, i2 và A.","answer": "D = i1 + i2 - A","explain": "Công thức: D = i1 + i2 - A.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Trong các dụng cụ sau, dụng cụ nào sử dụng lăng kính?","options": ["A. Máy quang phổ","B. Gương phẳng","C. Thước kẻ","D. Cân đồng hồ"],"answer": "A","explain": "Máy quang phổ dùng lăng kính để tán sắc.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong các dụng cụ sau, dụng cụ nào KHÔNG sử dụng lăng kính?","options": ["A. Máy quang phổ","B. Ống nhòm","C. Kính hiển vi quang học thông thường","D. Máy ảnh DSLR"],"answer": "C","explain": "Kính hiển vi thông thường dùng thấu kính, không dùng lăng kính.","points": 0.25},{"type": "mcq","level": "VD","q": "Máy ảnh DSLR sử dụng lăng kính ngũ giác để:","options": ["A. Tán sắc ánh sáng","B. Đưa ảnh lên kính ngắm thuận chiều","C. Phóng to ảnh","D. Chụp ảnh màu"],"answer": "B","explain": "Lăng kính ngũ giác đảo ảnh cho thuận chiều trên kính ngắm.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao kính ngắm của máy ảnh DSLR cần có lăng kính?","options": ["A. Để ảnh to hơn","B. Vì gương lật cho ảnh ngược chiều, lăng kính đảo lại cho thuận chiều","C. Để ảnh có màu sắc đẹp","D. Để chống rung"],"answer": "B","explain": "Gương lật hắt ảnh lên bị ngược, lăng kính đảo lại.","points": 0.25},{"type": "mcq","level": "TH","q": "Lăng kính ngũ giác trong máy ảnh hoạt động chủ yếu nhờ:","options": ["A. Khúc xạ","B. Phản xạ toàn phần","C. Tán sắc","D. Hấp thụ"],"answer": "B","explain": "Các mặt của lăng kính ngũ giác phản xạ toàn phần.","points": 0.25},{"type": "mcq","level": "NB","q": "Ánh sáng đi qua lăng kính bị lệch về phía đáy chứng tỏ:","options": ["A. Ánh sáng bị phản xạ","B. Ánh sáng bị khúc xạ tại hai mặt bên","C. Ánh sáng bị hấp thụ","D. Ánh sáng biến mất"],"answer": "B","explain": "Sự lệch là do khúc xạ hai lần tại hai mặt bên.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về dụng cụ dùng lăng kính.","statements": ["a) Máy quang phổ dùng lăng kính để tán sắc.","b) Ống nhòm dùng lăng kính phản xạ toàn phần.","c) Máy ảnh DSLR dùng lăng kính ngũ giác.","d) Kính lúp là một loại lăng kính."],"answer": ["T","T","T","F"],"explain": "Kính lúp là thấu kính, không phải lăng kính.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về lăng kính trong máy ảnh.","statements": ["a) Lăng kính ngũ giác cho ảnh thuận chiều trên kính ngắm.","b) Gương lật trong máy ảnh cho ảnh ngược chiều.","c) Lăng kính đảo ảnh nhờ phản xạ toàn phần.","d) Mọi máy ảnh đều dùng lăng kính."],"answer": ["T","T","T","F"],"explain": "Máy ảnh mirrorless không dùng lăng kính ngũ giác.","points": 1},{"type": "short","level": "NB","q": "Kể tên hai dụng cụ quang học sử dụng lăng kính.","answer": "Máy quang phổ và ống nhòm","explain": "Hai dụng cụ điển hình dùng lăng kính.","points": 0.5},{"type": "short","level": "TH","q": "Lăng kính trong máy ảnh DSLR có tác dụng gì?","answer": "Đưa ảnh lên kính ngắm thuận chiều","explain": "Lăng kính ngũ giác đảo ảnh ngược thành thuận.","points": 0.5}]}]}
