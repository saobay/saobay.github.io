{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Động năng là năng lượng mà vật có được do đâu?","options": ["A. Do chuyển động mà có","B. Do vị trí mà có","C. Do bị biến dạng mà có","D. Do nhiệt độ mà có"],"answer": "A","explain": "Động năng là năng lượng của vật do chuyển động mà có.","points": 0.25},{"type": "mcq","level": "TH","q": "Công thức tính động năng của vật có khối lượng m, vận tốc v là:","options": ["A. Wđ = m.v","B. Wđ = 1/2.m.v^2","C. Wđ = m.g.h","D. Wđ = P.h"],"answer": "B","explain": "Công thức động năng: Wđ = 1/2.m.v^2.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật có khối lượng 2 kg chuyển động với vận tốc 3 m/s. Động năng của vật là:","options": ["A. 6 J","B. 9 J","C. 12 J","D. 18 J"],"answer": "B","explain": "Wđ = 1/2.2.3^2 = 9 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Hai xe có cùng khối lượng. Xe A chạy với vận tốc 10 m/s, xe B chạy với vận tốc 20 m/s. Động năng của xe B gấp mấy lần động năng của xe A?","options": ["A. 2 lần","B. 3 lần","C. 4 lần","D. 8 lần"],"answer": "C","explain": "Vận tốc tăng gấp đôi thì động năng tăng gấp 4 lần (tỉ lệ với v^2).","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị đo động năng trong hệ SI là:","options": ["A. Niutơn (N)","B. Oát (W)","C. Jun (J)","D. Mét trên giây (m/s)"],"answer": "C","explain": "Mọi dạng năng lượng đều đo bằng jun (J).","points": 0.25},{"type": "mcq","level": "TH","q": "Thế năng trọng trường của vật phụ thuộc vào yếu tố nào?","options": ["A. Khối lượng và độ cao của vật","B. Vận tốc của vật","C. Nhiệt độ của vật","D. Thể tích của vật"],"answer": "A","explain": "Wt = P.h nên phụ thuộc trọng lượng (khối lượng) và độ cao.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về động năng.","statements": ["a) Mọi vật đang chuyển động đều có động năng.","b) Động năng có đơn vị là jun.","c) Vật đứng yên cũng có động năng.","d) Động năng tỉ lệ thuận với khối lượng của vật."],"answer": ["T","T","F","T"],"explain": "Vật đứng yên có v = 0 nên động năng bằng 0.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về thế năng trọng trường.","statements": ["a) Thế năng trọng trường tính bằng công thức Wt = P.h.","b) Vật ở mặt đất (mốc) có thế năng bằng 0.","c) Thế năng trọng trường phụ thuộc vào vận tốc của vật.","d) Cùng một vật, ở càng cao thì thế năng càng lớn."],"answer": ["T","T","F","T"],"explain": "Thế năng trọng trường không phụ thuộc vận tốc mà phụ thuộc độ cao.","points": 1},{"type": "short","level": "NB","q": "Năng lượng mà vật có được do đang chuyển động được gọi là gì?","answer": "Động năng","explain": "Động năng là năng lượng do chuyển động mà có.","points": 0.5},{"type": "short","level": "TH","q": "Một vật có khối lượng 1 kg chuyển động với vận tốc 4 m/s. Động năng của vật là bao nhiêu jun?","answer": "8","explain": "Wđ = 1/2.1.4^2 = 8 J.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "TH","q": "Khi vận tốc của vật tăng gấp đôi (khối lượng không đổi) thì động năng của vật:","options": ["A. Không thay đổi","B. Tăng gấp đôi","C. Tăng gấp 4 lần","D. Giảm một nửa"],"answer": "C","explain": "Động năng tỉ lệ với bình phương vận tốc nên tăng gấp 4 lần.","points": 0.25},{"type": "mcq","level": "NB","q": "Thế năng trọng trường là năng lượng của vật có được do:","options": ["A. Chuyển động mà có","B. Vị trí so với mặt đất mà có","C. Bị biến dạng mà có","D. Nóng lên mà có"],"answer": "B","explain": "Thế năng trọng trường do vị trí (độ cao) của vật mà có.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật có trọng lượng 50 N ở độ cao 4 m so với mặt đất. Thế năng trọng trường của vật là:","options": ["A. 200 J","B. 54 J","C. 12,5 J","D. 46 J"],"answer": "A","explain": "Wt = P.h = 50.4 = 200 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Viên bi A có khối lượng 1 kg, vận tốc 6 m/s; viên bi B có khối lượng 2 kg, vận tốc 3 m/s. So sánh động năng hai viên bi:","options": ["A. Động năng hai bi bằng nhau","B. Động năng bi A gấp đôi động năng bi B","C. Động năng bi B gấp đôi động năng bi A","D. Động năng bi A gấp 4 lần động năng bi B"],"answer": "B","explain": "WđA = 1/2.1.36 = 18 J; WđB = 1/2.2.9 = 9 J. Vậy WđA gấp đôi WđB.","points": 0.25},{"type": "mcq","level": "NB","q": "Lò xo bị nén lại dự trữ dạng năng lượng nào?","options": ["A. Động năng","B. Thế năng trọng trường","C. Thế năng đàn hồi","D. Không có năng lượng"],"answer": "C","explain": "Lò xo bị biến dạng có thế năng đàn hồi.","points": 0.25},{"type": "mcq","level": "TH","q": "Thế năng đàn hồi của lò xo càng lớn khi:","options": ["A. Lò xo bị biến dạng càng lớn","B. Lò xo càng dài","C. Lò xo càng nặng","D. Nhiệt độ càng cao"],"answer": "A","explain": "Biến dạng càng lớn thì thế năng đàn hồi càng lớn.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về động năng và thế năng.","statements": ["a) Động năng của vật tỉ lệ với bình phương vận tốc.","b) Hai vật có cùng vận tốc thì động năng bằng nhau.","c) Đơn vị của thế năng là jun.","d) Thế năng trọng trường không phụ thuộc mốc tính độ cao."],"answer": ["T","F","T","F"],"explain": "Động năng còn phụ thuộc khối lượng; thế năng phụ thuộc mốc tính độ cao.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định sau.","statements": ["a) Khi lò xo dãn càng nhiều, thế năng đàn hồi càng lớn.","b) Mũi tên rời dây cung bay đi nhờ thế năng đàn hồi của dây chuyển thành động năng.","c) Vật rơi tự do thì thế năng trọng trường tăng dần.","d) Ô tô phanh gấp dừng lại thì động năng giảm dần."],"answer": ["T","T","F","T"],"explain": "Vật rơi thì độ cao giảm nên thế năng trọng trường giảm dần.","points": 1},{"type": "short","level": "TH","q": "Thế năng trọng trường của vật tỉ lệ thuận với những đại lượng nào?","answer": "Trọng lượng và độ cao","explain": "Wt = P.h nên tỉ lệ thuận với trọng lượng P và độ cao h.","points": 0.5},{"type": "short","level": "VD","q": "Một quả bóng khối lượng 0,5 kg đang lăn với vận tốc 10 m/s. Động năng của quả bóng là bao nhiêu jun?","answer": "25","explain": "Wđ = 1/2.0,5.10^2 = 25 J.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Đại lượng nào sau đây KHÔNG ảnh hưởng đến động năng của vật?","options": ["A. Khối lượng của vật","B. Vận tốc của vật","C. Màu sắc của vật","D. Cả khối lượng và vận tốc đều ảnh hưởng"],"answer": "C","explain": "Động năng chỉ phụ thuộc khối lượng và vận tốc.","points": 0.25},{"type": "mcq","level": "TH","q": "Một quả táo treo yên trên cành cao 3 m so với mặt đất. Quả táo có dạng năng lượng nào?","options": ["A. Chỉ có động năng","B. Chỉ có thế năng trọng trường","C. Chỉ có thế năng đàn hồi","D. Không có dạng năng lượng nào"],"answer": "B","explain": "Quả táo đứng yên (không có động năng) nhưng ở trên cao nên có thế năng trọng trường.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật có khối lượng 4 kg chuyển động với vận tốc 5 m/s. Động năng của vật là:","options": ["A. 20 J","B. 50 J","C. 100 J","D. 10 J"],"answer": "B","explain": "Wđ = 1/2.4.25 = 50 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vật A có khối lượng 3 kg ở độ cao 2 m; vật B có khối lượng 2 kg ở độ cao 3 m (g = 10 m/s^2, mốc mặt đất). So sánh thế năng trọng trường của hai vật:","options": ["A. Thế năng vật A lớn hơn vật B","B. Thế năng vật B lớn hơn vật A","C. Thế năng hai vật bằng nhau","D. Không so sánh được"],"answer": "C","explain": "WtA = 30.2 = 60 J; WtB = 20.3 = 60 J. Hai vật có thế năng bằng nhau.","points": 0.25},{"type": "mcq","level": "NB","q": "Vật nào sau đây có thế năng đàn hồi?","options": ["A. Hòn đá nằm trên đỉnh núi","B. Dây cao su bị kéo dãn","C. Ô tô đang chạy","D. Quả bóng nằm yên trên sân"],"answer": "B","explain": "Dây cao su bị biến dạng nên có thế năng đàn hồi.","points": 0.25},{"type": "mcq","level": "TH","q": "Mốc tính thế năng trọng trường thường được chọn ở đâu?","options": ["A. Mặt đất","B. Đỉnh núi cao nhất","C. Mặt Trăng","D. Bất kì đâu cũng cho kết quả như nhau"],"answer": "A","explain": "Thông thường chọn mốc tại mặt đất.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về đơn vị đo.","statements": ["a) Jun là đơn vị đo của mọi dạng năng lượng.","b) Động năng được đo bằng niutơn.","c) Thế năng được đo bằng jun.","d) Vận tốc được đo bằng m/s."],"answer": ["T","F","T","T"],"explain": "Động năng đo bằng jun, không phải niutơn.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về thế năng trọng trường.","statements": ["a) Vật có khối lượng càng lớn, ở cùng độ cao thì thế năng càng lớn.","b) Ở cùng độ cao, vật nặng hơn có thế năng nhỏ hơn.","c) Thế năng trọng trường của vật ở độ cao h tính bằng P.h.","d) Chọn mốc khác nhau, giá trị thế năng của cùng một vật có thể khác nhau."],"answer": ["T","F","T","T"],"explain": "Vật nặng hơn ở cùng độ cao có thế năng lớn hơn; thế năng phụ thuộc mốc.","points": 1},{"type": "short","level": "NB","q": "Lò xo bị biến dạng (nén hoặc dãn) dự trữ dạng thế năng nào?","answer": "Thế năng đàn hồi","explain": "Vật đàn hồi bị biến dạng có thế năng đàn hồi.","points": 0.5},{"type": "short","level": "TH","q": "Một vật có trọng lượng 100 N ở độ cao 2 m so với mặt đất. Thế năng trọng trường của vật là bao nhiêu jun?","answer": "200","explain": "Wt = P.h = 100.2 = 200 J.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "VD","q": "Một xe tải có khối lượng 5000 kg chạy với vận tốc 10 m/s. Động năng của xe tải là:","options": ["A. 25 kJ","B. 250 kJ","C. 500 kJ","D. 50 kJ"],"answer": "B","explain": "Wđ = 1/2.5000.100 = 250 000 J = 250 kJ.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một vật đang chuyển động với vận tốc v. Nếu khối lượng tăng gấp đôi và vận tốc giảm một nửa thì động năng của vật thay đổi thế nào?","options": ["A. Không thay đổi","B. Tăng gấp đôi","C. Giảm một nửa","D. Giảm 4 lần"],"answer": "C","explain": "Wđ mới = 1/2.(2m).(v/2)^2 = (1/2).Wđ ban đầu.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong các vật sau đây (cùng khối lượng), vật nào có động năng lớn nhất?","options": ["A. Viên bi nằm yên trên bàn","B. Người đang đi bộ","C. Ô tô đang chạy nhanh","D. Quyển sách đặt trên giá"],"answer": "C","explain": "Vận tốc càng lớn thì động năng càng lớn.","points": 0.25},{"type": "mcq","level": "TH","q": "Động năng của vật bằng 0 khi nào?","options": ["A. Vật ở trên cao","B. Vật đứng yên","C. Vật có khối lượng lớn","D. Vật đang rơi"],"answer": "B","explain": "Vật đứng yên có v = 0 nên Wđ = 0.","points": 0.25},{"type": "mcq","level": "NB","q": "Thế năng đàn hồi xuất hiện ở vật nào sau đây?","options": ["A. Hòn đá trên đỉnh núi","B. Dây cung đang giương","C. Ô tô đang chạy","D. Quả bóng nằm yên"],"answer": "B","explain": "Dây cung bị biến dạng (uốn cong) nên có thế năng đàn hồi.","points": 0.25},{"type": "mcq","level": "TH","q": "Phát biểu nào sau đây là ĐÚNG về động năng?","options": ["A. Động năng chỉ phụ thuộc khối lượng","B. Động năng phụ thuộc khối lượng và vận tốc","C. Động năng không phụ thuộc vận tốc","D. Động năng là năng lượng dự trữ của vật"],"answer": "B","explain": "Wđ = 1/2.m.v^2 nên phụ thuộc cả m và v.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về động năng trong thực tế.","statements": ["a) Viên đạn đang bay có động năng rất lớn dù khối lượng nhỏ vì vận tốc rất lớn.","b) Động năng của vật chỉ phụ thuộc vào vận tốc.","c) Khi vật rơi, vận tốc tăng nên động năng tăng.","d) Ô tô phanh dừng lại thì động năng bằng 0."],"answer": ["T","F","T","T"],"explain": "Động năng phụ thuộc cả khối lượng và vận tốc.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định sau.","statements": ["a) Hai vật có cùng động năng thì vận tốc của chúng bằng nhau.","b) Vật có khối lượng gấp đôi, vận tốc bằng một nửa thì động năng bằng một nửa vật kia.","c) Thế năng trọng trường có thể mang giá trị âm nếu vật ở dưới mốc.","d) Động năng của vật luôn không âm."],"answer": ["F","T","T","T"],"explain": "Cùng động năng chưa chắc cùng vận tốc vì còn phụ thuộc khối lượng.","points": 1},{"type": "short","level": "VD","q": "Vì sao viên đạn rất nhỏ nhưng lại gây sát thương lớn?","answer": "Vì vận tốc rất lớn nên động năng lớn","explain": "Động năng tỉ lệ với bình phương vận tốc, đạn bay rất nhanh nên động năng lớn.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật có động năng 100 J đang chuyển động với vận tốc 10 m/s. Khối lượng của vật là bao nhiêu kilôgam?","answer": "2","explain": "m = 2.Wđ/v^2 = 200/100 = 2 kg.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Kí hiệu thường dùng của động năng là:","options": ["A. Wt","B. Wđ","C. A","D. P"],"answer": "B","explain": "Động năng kí hiệu là Wđ, thế năng kí hiệu là Wt.","points": 0.25},{"type": "mcq","level": "TH","q": "Kí hiệu thường dùng của thế năng trọng trường là:","options": ["A. Wđ","B. Wt","C. A","D. F"],"answer": "B","explain": "Thế năng trọng trường kí hiệu là Wt.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật có trọng lượng 200 N ở độ cao 1,5 m so với mặt đất. Thế năng trọng trường của vật là:","options": ["A. 300 J","B. 201,5 J","C. 133,3 J","D. 198,5 J"],"answer": "A","explain": "Wt = P.h = 200.1,5 = 300 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một cần cẩu nâng vật nặng 500 kg lên cao 10 m (g = 10 m/s^2). Thế năng trọng trường mà vật thu được là:","options": ["A. 5 kJ","B. 50 kJ","C. 500 kJ","D. 5000 J"],"answer": "B","explain": "P = 5000 N; Wt = 5000.10 = 50 000 J = 50 kJ.","points": 0.25},{"type": "mcq","level": "NB","q": "Nước chứa trong hồ thủy điện ở trên cao (chưa chảy) chủ yếu có dạng năng lượng nào?","options": ["A. Động năng","B. Thế năng trọng trường","C. Thế năng đàn hồi","D. Nhiệt năng"],"answer": "B","explain": "Nước ở trên cao, đứng yên nên có thế năng trọng trường.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi nước từ đập cao chảy xuống, thế năng trọng trường của nước:","options": ["A. Tăng dần","B. Giảm dần","C. Không thay đổi","D. Bằng 0 ngay lập tức"],"answer": "B","explain": "Độ cao giảm nên thế năng trọng trường giảm dần.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về năng lượng của nước.","statements": ["a) Nước trên đập cao có thế năng trọng trường.","b) Nước đang chảy có động năng.","c) Hòn đá lăn từ đỉnh dốc xuống vừa có động năng vừa có thế năng.","d) Vật đứng yên trên mặt đất (mốc) có thế năng bằng 0."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về thế năng đàn hồi.","statements": ["a) Lò xo càng bị nén mạnh thì thế năng đàn hồi càng lớn.","b) Thả lò xo đang nén, thế năng đàn hồi chuyển thành động năng của vật gắn với lò xo.","c) Dây cung không có thế năng đàn hồi khi bị kéo căng.","d) Quả bóng nảy lên được nhờ thế năng đàn hồi khi va chạm mặt đất."],"answer": ["T","T","F","T"],"explain": "Dây cung bị kéo căng (biến dạng) nên có thế năng đàn hồi.","points": 1},{"type": "short","level": "NB","q": "Nước chứa trong hồ thủy điện ở trên cao chủ yếu có dạng năng lượng nào?","answer": "Thế năng trọng trường","explain": "Nước ở trên cao, đứng yên nên có thế năng trọng trường.","points": 0.5},{"type": "short","level": "TH","q": "Khi quả bóng rơi từ trên cao xuống, thế năng trọng trường của nó thay đổi như thế nào?","answer": "Giảm dần","explain": "Độ cao giảm dần nên thế năng trọng trường giảm dần.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "TH","q": "Một vật có khối lượng m, vận tốc v. Nếu vận tốc tăng gấp 3 lần (m không đổi) thì động năng tăng:","options": ["A. 3 lần","B. 6 lần","C. 9 lần","D. 27 lần"],"answer": "C","explain": "Động năng tỉ lệ với v^2 nên tăng 3^2 = 9 lần.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật có động năng 200 J, khối lượng 4 kg. Vận tốc của vật là:","options": ["A. 5 m/s","B. 10 m/s","C. 20 m/s","D. 50 m/s"],"answer": "B","explain": "v^2 = 2.Wđ/m = 400/4 = 100, suy ra v = 10 m/s.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong công thức Wt = P.h, h là gì?","options": ["A. Khối lượng của vật","B. Độ cao của vật so với mốc","C. Vận tốc của vật","D. Thời gian rơi của vật"],"answer": "B","explain": "h là độ cao của vật so với mốc tính độ cao.","points": 0.25},{"type": "mcq","level": "VDC","q": "Hai vật A và B có cùng thế năng trọng trường so với mặt đất. Biết khối lượng vật A gấp đôi vật B. So sánh độ cao của hai vật:","options": ["A. Độ cao A gấp đôi độ cao B","B. Độ cao A bằng một nửa độ cao B","C. Độ cao hai vật bằng nhau","D. Không so sánh được"],"answer": "B","explain": "Wt = P.h bằng nhau, PA gấp đôi PB nên hA = hB/2.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật nào sau đây vừa có động năng vừa có thế năng trọng trường?","options": ["A. Quyển sách nằm trên bàn","B. Máy bay đang bay","C. Lò xo đang bị nén","D. Tảng đá nằm dưới đất"],"answer": "B","explain": "Máy bay vừa chuyển động (động năng) vừa ở trên cao (thế năng).","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị đo công và năng lượng trong hệ SI là:","options": ["A. Oát (W)","B. Jun (J)","C. Niutơn (N)","D. Paxcan (Pa)"],"answer": "B","explain": "Công và mọi dạng năng lượng đều đo bằng jun.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định sau.","statements": ["a) Máy bay đang bay vừa có động năng vừa có thế năng trọng trường.","b) Vệ tinh chuyển động quanh Trái Đất có động năng.","c) Quyển sách nằm trên bàn (mốc mặt đất) vẫn có thế năng trọng trường lớn.","d) Mọi vật ở trên cao đều có thế năng như nhau."],"answer": ["T","T","F","F"],"explain": "Sách trên bàn có độ cao nhỏ nên thế năng nhỏ; thế năng còn phụ thuộc khối lượng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định sau.","statements": ["a) Động năng của Trái Đất chuyển động quanh Mặt Trời là rất lớn.","b) Thế năng trọng trường của vật phụ thuộc vào mốc tính độ cao.","c) Thế năng trọng trường không bao giờ mang giá trị âm.","d) Khi chọn mốc ở mặt đất, vật ở dưới mặt đất có thế năng âm."],"answer": ["T","T","F","T"],"explain": "Thế năng có thể âm khi vật ở dưới mốc tính độ cao.","points": 1},{"type": "short","level": "VD","q": "Một ô tô đang chạy với vận tốc 72 km/h. Đổi ra m/s, vận tốc của ô tô là bao nhiêu?","answer": "20","explain": "72 km/h = 72/3,6 = 20 m/s.","points": 0.5},{"type": "short","level": "VDC","q": "Ô tô trên có khối lượng 1000 kg. Động năng của nó là bao nhiêu kilôjun?","answer": "200","explain": "Wđ = 1/2.1000.20^2 = 200 000 J = 200 kJ.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Đơn vị đo năng lượng là:","options": ["A. Jun (J)","B. Niutơn (N)","C. Oát (W)","D. Kilôgam (kg)"],"answer": "A","explain": "Mọi dạng năng lượng đều đo bằng jun.","points": 0.25},{"type": "mcq","level": "TH","q": "Phát biểu nào sau đây là SAI?","options": ["A. Vật chuyển động có động năng","B. Vật đứng yên có động năng","C. Vật ở trên cao có thế năng trọng trường","D. Lò xo bị biến dạng có thế năng đàn hồi"],"answer": "B","explain": "Vật đứng yên có v = 0 nên động năng bằng 0.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật có khối lượng 0,5 kg chuyển động với vận tốc 20 m/s. Động năng của vật là:","options": ["A. 10 J","B. 100 J","C. 200 J","D. 5 J"],"answer": "B","explain": "Wđ = 1/2.0,5.400 = 100 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một vật được ném thẳng đứng lên cao (bỏ qua sức cản). Tại vị trí cao nhất, vật có:","options": ["A. Động năng cực đại","B. Động năng bằng 0, thế năng cực đại","C. Động năng và thế năng đều cực đại","D. Động năng và thế năng đều bằng 0"],"answer": "B","explain": "Tại điểm cao nhất v = 0 nên Wđ = 0, độ cao lớn nhất nên Wt cực đại.","points": 0.25},{"type": "mcq","level": "NB","q": "Ví dụ nào sau đây về thế năng đàn hồi?","options": ["A. Nước trong hồ thủy điện","B. Ná cao su đang kéo căng","C. Ô tô đang chạy","D. Diều đang bay"],"answer": "B","explain": "Dây ná bị biến dạng nên có thế năng đàn hồi.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi buông ná cao su đang kéo căng, thế năng đàn hồi chuyển thành:","options": ["A. Thế năng trọng trường của ná","B. Động năng của viên đạn","C. Nhiệt năng","D. Mất đi hoàn toàn"],"answer": "B","explain": "Thế năng đàn hồi chuyển thành động năng làm đạn bay đi.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về ná cao su.","statements": ["a) Ná cao su kéo căng có thế năng đàn hồi.","b) Viên đạn rời ná có động năng.","c) Thế năng đàn hồi không thể chuyển thành động năng.","d) Lò xo ở trạng thái tự nhiên (không biến dạng) có thế năng đàn hồi bằng 0."],"answer": ["T","T","F","T"],"explain": "Thế năng đàn hồi chuyển thành động năng khi buông ná.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về quạt điện.","statements": ["a) Bóng đèn đang sáng có động năng.","b) Cánh quạt đang quay có động năng.","c) Cánh quạt quay càng nhanh thì động năng càng lớn.","d) Tắt quạt, cánh quạt vẫn quay một lúc nhờ động năng dự trữ."],"answer": ["F","T","T","T"],"explain": "Bóng đèn đứng yên nên không có động năng.","points": 1},{"type": "short","level": "NB","q": "Khi kéo dãn dây cao su rồi buông tay, dây co lại rất nhanh. Năng lượng nào đã chuyển thành động năng của dây?","answer": "Thế năng đàn hồi","explain": "Dây cao su bị biến dạng dự trữ thế năng đàn hồi.","points": 0.5},{"type": "short","level": "TH","q": "Một lò xo bị nén 5 cm có thế năng đàn hồi lớn hơn hay nhỏ hơn khi nó bị nén 10 cm?","answer": "Nhỏ hơn","explain": "Biến dạng càng lớn thì thế năng đàn hồi càng lớn.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "TH","q": "Động năng của vật phụ thuộc vào những yếu tố nào?","options": ["A. Khối lượng và vận tốc của vật","B. Độ cao của vật","C. Nhiệt độ của vật","D. Màu sắc của vật"],"answer": "A","explain": "Wđ = 1/2.m.v^2 nên phụ thuộc m và v.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật có thế năng trọng trường 600 J, trọng lượng 30 N. Độ cao của vật so với mốc là:","options": ["A. 20 m","B. 630 m","C. 570 m","D. 2 m"],"answer": "A","explain": "h = Wt/P = 600/30 = 20 m.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức nào sau đây tính thế năng trọng trường?","options": ["A. Wt = m.v","B. Wt = P.h","C. Wt = 1/2.m.v^2","D. Wt = F.s"],"answer": "B","explain": "Thế năng trọng trường: Wt = P.h.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một vật rơi tự do từ độ cao h (bỏ qua sức cản). Khi vật rơi được nửa quãng đường, thế năng trọng trường của vật so với lúc đầu:","options": ["A. Không thay đổi","B. Giảm một nửa","C. Tăng gấp đôi","D. Bằng 0"],"answer": "B","explain": "Độ cao còn một nửa nên thế năng giảm một nửa.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi vật rơi tự do, vận tốc của vật:","options": ["A. Giảm dần","B. Tăng dần","C. Không thay đổi","D. Bằng 0"],"answer": "B","explain": "Vật rơi tự do chuyển động nhanh dần nên vận tốc tăng.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật rơi tự do, động năng của vật:","options": ["A. Giảm dần","B. Tăng dần","C. Không thay đổi","D. Bằng 0"],"answer": "B","explain": "Vận tốc tăng nên động năng tăng.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về vật rơi tự do (bỏ qua sức cản).","statements": ["a) Khi vật rơi, thế năng giảm dần còn động năng tăng dần.","b) Tổng động năng và thế năng của vật rơi tự do không đổi.","c) Vật rơi càng nhanh thì động năng càng lớn.","d) Khi chạm đất, thế năng trọng trường (mốc mặt đất) bằng 0."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về sự chuyển hóa năng lượng.","statements": ["a) Ném vật lên cao, động năng chuyển dần thành thế năng.","b) Tại điểm cao nhất, động năng của vật bằng 0.","c) Vật rơi xuống, thế năng chuyển dần thành động năng.","d) Nếu có ma sát với không khí, một phần cơ năng chuyển thành nhiệt năng."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "VD","q": "Một vật đang rơi tự do. Khi độ cao giảm một nửa thì thế năng trọng trường của nó thay đổi thế nào (bỏ qua sức cản)?","answer": "Giảm một nửa","explain": "Wt = P.h, h giảm một nửa nên Wt giảm một nửa.","points": 0.5},{"type": "short","level": "VDC","q": "Thả một vật rơi tự do từ độ cao 20 m (bỏ qua sức cản, g = 10 m/s^2). Vận tốc của vật khi chạm đất là bao nhiêu m/s?","answer": "20","explain": "Wđ = Wt suy ra 1/2.m.v^2 = m.10.20, vậy v = 20 m/s.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Thế năng là:","options": ["A. Năng lượng do chuyển động mà có","B. Năng lượng dự trữ do vị trí hoặc biến dạng mà có","C. Năng lượng do nóng lên mà có","D. Năng lượng do dòng điện mà có"],"answer": "B","explain": "Thế năng là năng lượng dự trữ do vị trí (trọng trường) hoặc biến dạng (đàn hồi).","points": 0.25},{"type": "mcq","level": "TH","q": "Có mấy dạng thế năng đã học trong bài?","options": ["A. 1 dạng","B. 2 dạng","C. 3 dạng","D. 4 dạng"],"answer": "B","explain": "Hai dạng: thế năng trọng trường và thế năng đàn hồi.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vận động viên nhảy cầu từ ván cao 10 m (khối lượng 50 kg, g = 10 m/s^2). Thế năng trọng trường của người so với mặt nước là:","options": ["A. 500 J","B. 5000 J","C. 50 000 J","D. 500 000 J"],"answer": "B","explain": "P = 500 N; Wt = 500.10 = 5000 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Quả bóng khối lượng 0,2 kg được ném lên với vận tốc 15 m/s. Động năng của quả bóng lúc ném là:","options": ["A. 22,5 J","B. 45 J","C. 3 J","D. 1,5 J"],"answer": "A","explain": "Wđ = 1/2.0,2.225 = 22,5 J.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi quả bóng lên đến điểm cao nhất (bỏ qua sức cản), động năng ban đầu đã chuyển thành:","options": ["A. Nhiệt năng","B. Thế năng trọng trường","C. Thế năng đàn hồi","D. Mất hẳn"],"answer": "B","explain": "Động năng chuyển dần thành thế năng trọng trường khi bóng đi lên.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong công thức Wđ = 1/2.m.v^2, đơn vị của vận tốc v là:","options": ["A. km/h","B. m/s","C. m/phút","D. cm/s"],"answer": "B","explain": "Trong hệ SI, vận tốc tính bằng m/s.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về đơn vị trong công thức.","statements": ["a) Mọi dạng năng lượng đều đo bằng jun.","b) Trong công thức Wđ = 1/2.m.v^2, m tính bằng gam.","c) Trong Wt = P.h, P tính bằng niutơn.","d) Trong Wt = P.h, h tính bằng mét."],"answer": ["T","F","T","T"],"explain": "Khối lượng m trong công thức phải tính bằng kilôgam.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về đổi đơn vị.","statements": ["a) Dùng đơn vị km/h cho v trong công thức động năng sẽ cho kết quả sai.","b) 72 km/h = 20 m/s.","c) 1 kJ = 1000 J.","d) Động năng 200 kJ = 200 000 J."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Trong công thức tính động năng Wđ = 1/2.m.v^2, khối lượng m được tính bằng đơn vị nào?","answer": "Kilôgam","explain": "Trong hệ SI, khối lượng tính bằng kilôgam.","points": 0.5},{"type": "short","level": "TH","q": "Đổi 36 km/h ra m/s được bao nhiêu?","answer": "10","explain": "36 km/h = 36/3,6 = 10 m/s.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Vật nào sau đây KHÔNG có động năng?","options": ["A. Ô tô đang chạy","B. Viên bi đang lăn","C. Tảng đá nằm yên trên mặt đất","D. Máy bay đang bay"],"answer": "C","explain": "Tảng đá đứng yên có v = 0 nên không có động năng.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật nào sau đây KHÔNG có thế năng trọng trường (mốc mặt đất)?","options": ["A. Chim đang bay","B. Hòn đá trên tay người","C. Quyển sách trên bàn","D. Hòn sỏi nằm trên mặt đất"],"answer": "D","explain": "Hòn sỏi ở mốc (h = 0) nên thế năng bằng 0.","points": 0.25},{"type": "mcq","level": "VD","q": "Một người nặng 600 N đứng trên tầng 3, cao 9 m so với mặt đất. Thế năng trọng trường của người là:","options": ["A. 5400 J","B. 609 J","C. 591 J","D. 66,7 J"],"answer": "A","explain": "Wt = 600.9 = 5400 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một ô tô khối lượng 1,5 tấn đang chạy với vận tốc 54 km/h. Động năng của ô tô là:","options": ["A. 60,75 kJ","B. 168,75 kJ","C. 337,5 kJ","D. 20,25 kJ"],"answer": "B","explain": "54 km/h = 15 m/s; Wđ = 1/2.1500.225 = 168 750 J = 168,75 kJ.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi ô tô tăng tốc, động năng của nó:","options": ["A. Giảm đi","B. Tăng lên","C. Không thay đổi","D. Bằng 0"],"answer": "B","explain": "Vận tốc tăng nên động năng tăng.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi ô tô phanh dừng hẳn, động năng của nó:","options": ["A. Tăng lên","B. Không thay đổi","C. Bằng 0","D. Chuyển hết thành thế năng"],"answer": "C","explain": "Vận tốc bằng 0 nên động năng bằng 0.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về ô tô.","statements": ["a) Ô tô đang chạy có động năng.","b) Ô tô đỗ trên dốc có thế năng trọng trường.","c) Ô tô phanh dừng hẳn thì động năng bằng 0.","d) Lốp xe bị xẹp không liên quan đến thế năng đàn hồi."],"answer": ["T","T","T","F"],"explain": "Lốp xe bị biến dạng nên có thế năng đàn hồi.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về an toàn giao thông.","statements": ["a) Động năng của xe tải lớn hơn xe máy nếu cùng vận tốc vì khối lượng lớn hơn.","b) Xe chạy càng nhanh càng khó phanh vì động năng lớn.","c) Giới hạn tốc độ giúp giảm động năng, an toàn hơn.","d) Xe dừng hẳn thì động năng chuyển hết thành thế năng trọng trường."],"answer": ["T","T","T","F"],"explain": "Khi phanh, động năng chủ yếu chuyển thành nhiệt năng ở phanh.","points": 1},{"type": "short","level": "NB","q": "Ô tô đang chuyển động trên đường nằm ngang có dạng năng lượng nào?","answer": "Động năng","explain": "Ô tô chuyển động nên có động năng.","points": 0.5},{"type": "short","level": "TH","q": "Vì sao xe chạy nhanh thì quãng đường phanh dài hơn?","answer": "Vì động năng lớn hơn","explain": "Động năng lớn cần quãng đường dài hơn để tiêu tán hết khi phanh.","points": 0.5}]}]}
