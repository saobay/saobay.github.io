{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Dòng điện xoay chiều có các tác dụng:","options": ["A. Nhiệt, phát sáng, từ và sinh lí","B. Chỉ có tác dụng nhiệt","C. Chỉ có tác dụng từ","D. Chỉ có tác dụng phát sáng"],"answer": "A","explain": "Dòng xoay chiều có đủ các tác dụng.","points": 0.25},{"type": "mcq","level": "TH","q": "Ampe kế xoay chiều đo được giá trị nào của dòng điện?","options": ["A. Giá trị hiệu dụng","B. Giá trị cực đại","C. Giá trị trung bình","D. Giá trị tức thời"],"answer": "A","explain": "Đo được giá trị hiệu dụng.","points": 0.25},{"type": "mcq","level": "VD","q": "Vôn kế xoay chiều mắc vào hai đầu bóng đèn chỉ 220 V. Con số 220 V là:","options": ["A. Hiệu điện thế hiệu dụng","B. Hiệu điện thế cực đại","C. Hiệu điện thế một chiều","D. Hiệu điện thế trung bình"],"answer": "A","explain": "Là hiệu điện thế hiệu dụng.","points": 0.25},{"type": "mcq","level": "VDC","q": "Lực từ của dòng điện xoay chiều tác dụng lên nam châm:","options": ["A. Đổi chiều theo sự đổi chiều của dòng điện","B. Không đổi chiều","C. Luôn bằng không","D. Luôn hút nam châm"],"answer": "A","explain": "Lực từ đổi chiều theo dòng điện.","points": 0.25},{"type": "mcq","level": "NB","q": "Kí hiệu nào sau đây chỉ dụng cụ đo dòng điện xoay chiều?","options": ["A. AC hoặc dấu ~","B. DC hoặc dấu -","C. Chữ V","D. Chữ A"],"answer": "A","explain": "AC hoặc dấu ~ chỉ dòng xoay chiều.","points": 0.25},{"type": "mcq","level": "TH","q": "Tác dụng nào của dòng điện xoay chiều được dùng trong bàn là?","options": ["A. Tác dụng nhiệt","B. Tác dụng từ","C. Tác dụng phát sáng","D. Tác dụng sinh lí"],"answer": "A","explain": "Bàn là dùng tác dụng nhiệt.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về tác dụng của dòng điện xoay chiều.","statements": ["a) Dòng điện xoay chiều có tác dụng nhiệt.","b) Dòng điện xoay chiều có tác dụng từ.","c) Ampe kế xoay chiều đo giá trị hiệu dụng.","d) Dòng điện xoay chiều không có tác dụng phát sáng."],"answer": ["T","T","T","F"],"explain": "Dòng xoay chiều có tác dụng phát sáng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về đo dòng điện xoay chiều.","statements": ["a) Vôn kế xoay chiều đo hiệu điện thế hiệu dụng.","b) Lực từ của dòng xoay chiều đổi chiều theo dòng điện.","c) Dụng cụ đo dòng xoay chiều kí hiệu AC hoặc dấu ~.","d) Ampe kế một chiều đo được dòng điện xoay chiều."],"answer": ["T","T","T","F"],"explain": "Phải dùng ampe kế xoay chiều.","points": 1},{"type": "short","level": "NB","q": "Kể tên các tác dụng của dòng điện xoay chiều.","answer": "Nhiệt, phát sáng, từ và sinh lí","explain": "Bốn tác dụng của dòng điện xoay chiều.","points": 0.5},{"type": "short","level": "TH","q": "Ampe kế xoay chiều đo được giá trị nào của dòng điện?","answer": "Giá trị hiệu dụng","explain": "Đo được giá trị hiệu dụng.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Máy biến áp dùng để:","options": ["A. Tăng hoặc giảm hiệu điện thế của dòng điện xoay chiều","B. Biến dòng xoay chiều thành một chiều","C. Tạo ra dòng điện","D. Đo hiệu điện thế"],"answer": "A","explain": "Máy biến áp tăng hoặc giảm hiệu điện thế.","points": 0.25},{"type": "mcq","level": "TH","q": "Máy biến áp gồm:","options": ["A. Hai cuộn dây có số vòng khác nhau quấn trên một lõi sắt chung","B. Một cuộn dây và một nam châm","C. Hai nam châm","D. Một pin và một cuộn dây"],"answer": "A","explain": "Hai cuộn dây trên lõi sắt chung.","points": 0.25},{"type": "mcq","level": "VD","q": "Cuộn sơ cấp của máy biến áp là cuộn dây:","options": ["A. Nối với nguồn điện","B. Lấy điện ra sử dụng","C. Có số vòng lớn nhất","D. Quấn ngoài cùng"],"answer": "A","explain": "Cuộn sơ cấp nối với nguồn.","points": 0.25},{"type": "mcq","level": "VDC","q": "Máy biến áp có hoạt động được với dòng điện một chiều không?","options": ["A. Không, vì từ trường của dòng một chiều ổn định không biến thiên","B. Có, bình thường","C. Có, nhưng yếu hơn","D. Có, nhưng mạnh hơn"],"answer": "A","explain": "Dòng một chiều tạo từ trường không đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Công thức của máy biến áp là:","options": ["A. U1/U2 = N1/N2","B. U1/U2 = N2/N1","C. U1.N1 = U2.N2","D. U1 + U2 = N1 + N2"],"answer": "A","explain": "U1/U2 = N1/N2.","points": 0.25},{"type": "mcq","level": "NB","q": "Nếu N2 lớn hơn N1 thì máy biến áp là máy:","options": ["A. Tăng áp","B. Hạ áp","C. Ổn áp","D. Phát điện"],"answer": "A","explain": "N2 lớn hơn N1 thì U2 lớn hơn U1.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về máy biến áp.","statements": ["a) Máy biến áp tăng hoặc giảm hiệu điện thế của dòng xoay chiều.","b) Máy biến áp gồm hai cuộn dây trên một lõi sắt chung.","c) Cuộn sơ cấp nối với nguồn điện.","d) Máy biến áp hoạt động được với dòng điện một chiều."],"answer": ["T","T","T","F"],"explain": "Máy biến áp không hoạt động với dòng một chiều.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về công thức máy biến áp.","statements": ["a) Hiệu điện thế tỉ lệ thuận với số vòng dây.","b) Công thức là U1/U2 = N1/N2.","c) N2 lớn hơn N1 thì máy tăng áp.","d) N2 nhỏ hơn N1 thì máy tăng áp."],"answer": ["T","T","T","F"],"explain": "N2 nhỏ hơn N1 thì máy hạ áp.","points": 1},{"type": "short","level": "NB","q": "Máy biến áp dùng để làm gì?","answer": "Tăng hoặc giảm hiệu điện thế của dòng điện xoay chiều","explain": "Máy biến áp tăng hoặc giảm hiệu điện thế.","points": 0.5},{"type": "short","level": "TH","q": "Viết công thức của máy biến áp.","answer": "U1/U2 = N1/N2","explain": "Công thức U1/U2 = N1/N2.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "VD","q": "Máy biến áp có N1 = 500 vòng, N2 = 11000 vòng, U1 = 220 V. Hiệu điện thế U2 là:","options": ["A. 4840 V","B. 10 V","C. 220 V","D. 11500 V"],"answer": "A","explain": "U2 = 220.11000/500 = 4840 V.","points": 0.25},{"type": "mcq","level": "TH","q": "Máy biến áp trên là máy:","options": ["A. Tăng áp","B. Hạ áp","C. Ổn áp","D. Phát điện"],"answer": "A","explain": "U2 lớn hơn U1 nên là máy tăng áp.","points": 0.25},{"type": "mcq","level": "VD","q": "Máy biến áp có N1 = 2000 vòng, N2 = 200 vòng, U1 = 220 V. Hiệu điện thế U2 là:","options": ["A. 22 V","B. 2200 V","C. 220 V","D. 2000 V"],"answer": "A","explain": "U2 = 220.200/2000 = 22 V.","points": 0.25},{"type": "mcq","level": "VDC","q": "Máy biến áp trên là máy:","options": ["A. Hạ áp","B. Tăng áp","C. Ổn áp","D. Phát điện"],"answer": "A","explain": "U2 nhỏ hơn U1 nên là máy hạ áp.","points": 0.25},{"type": "mcq","level": "TH","q": "Muốn có hiệu điện thế 12 V từ nguồn 220 V, cần máy biến áp:","options": ["A. Hạ áp","B. Tăng áp","C. Ổn áp","D. Phát điện"],"answer": "A","explain": "12 V nhỏ hơn 220 V nên cần hạ áp.","points": 0.25},{"type": "mcq","level": "NB","q": "Tỉ số N2/N1 của máy hạ áp:","options": ["A. Nhỏ hơn 1","B. Lớn hơn 1","C. Bằng 1","D. Bằng 0"],"answer": "A","explain": "Máy hạ áp có N2 nhỏ hơn N1.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về tính toán máy biến áp.","statements": ["a) N1 = 500, N2 = 11000, U1 = 220 V thì U2 = 4840 V.","b) Máy trên là máy tăng áp.","c) N1 = 2000, N2 = 200, U1 = 220 V thì U2 = 22 V.","d) Máy có U2 = 22 V là máy tăng áp."],"answer": ["T","T","T","F"],"explain": "U2 nhỏ hơn U1 nên là máy hạ áp.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về máy tăng áp và hạ áp.","statements": ["a) Muốn có 12 V từ 220 V cần máy hạ áp.","b) Máy hạ áp có tỉ số N2/N1 nhỏ hơn 1.","c) Máy tăng áp có U2 lớn hơn U1.","d) Máy biến áp làm thay đổi tần số của dòng điện."],"answer": ["T","T","T","F"],"explain": "Máy biến áp không làm thay đổi tần số.","points": 1},{"type": "short","level": "VD","q": "Máy biến áp có N1 = 1000 vòng, N2 = 100 vòng, U1 = 220 V. Tính U2.","answer": "22","explain": "U2 = 220.100/1000 = 22 V.","points": 0.5},{"type": "short","level": "VDC","q": "Máy biến áp có N1 = 400 vòng, N2 = 8000 vòng, U1 = 220 V. Tính U2.","answer": "4400","explain": "U2 = 220.8000/400 = 4400 V.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Khi truyền tải điện năng đi xa, hao phí chủ yếu là do:","options": ["A. Tỏa nhiệt trên đường dây dẫn","B. Bức xạ điện từ","C. Va chạm của electron","D. Từ trường Trái Đất"],"answer": "A","explain": "Hao phí do tỏa nhiệt trên dây.","points": 0.25},{"type": "mcq","level": "TH","q": "Công suất hao phí do tỏa nhiệt trên đường dây được tính bằng:","options": ["A. Php = I^2.R","B. Php = U.I","C. Php = U^2/R","D. Php = I.R"],"answer": "A","explain": "Php = I^2.R.","points": 0.25},{"type": "mcq","level": "VD","q": "Để giảm hao phí khi truyền tải điện năng đi xa, người ta:","options": ["A. Tăng hiệu điện thế trước khi truyền tải","B. Giảm hiệu điện thế","C. Dùng dây dẫn thật dài","D. Tăng cường độ dòng điện"],"answer": "A","explain": "Tăng hiệu điện thế để giảm hao phí.","points": 0.25},{"type": "mcq","level": "VDC","q": "Khi tăng hiệu điện thế truyền tải lên 10 lần (công suất không đổi), công suất hao phí:","options": ["A. Giảm 100 lần","B. Giảm 10 lần","C. Tăng 10 lần","D. Không đổi"],"answer": "A","explain": "I giảm 10 lần nên Php giảm 100 lần.","points": 0.25},{"type": "mcq","level": "TH","q": "Trước khi truyền tải đi xa, hiệu điện thế được tăng lên đến:","options": ["A. Hàng trăm kV","B. 220 V","C. 12 V","D. 1,5 V"],"answer": "A","explain": "Tăng lên hàng trăm kV.","points": 0.25},{"type": "mcq","level": "NB","q": "Trước khi đưa điện vào sử dụng trong gia đình, hiệu điện thế được hạ xuống:","options": ["A. 220 V","B. 500 kV","C. 220 kV","D. 110 kV"],"answer": "A","explain": "Hạ xuống 220 V.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về truyền tải điện năng.","statements": ["a) Hao phí chủ yếu do tỏa nhiệt trên đường dây.","b) Công suất hao phí tính bằng Php = I^2.R.","c) Tăng hiệu điện thế giúp giảm hao phí.","d) Nên giảm hiệu điện thế để giảm hao phí."],"answer": ["T","T","T","F"],"explain": "Phải tăng hiệu điện thế.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về truyền tải điện năng.","statements": ["a) Trước khi truyền tải, hiệu điện thế được tăng lên hàng trăm kV.","b) Trước khi dùng, hiệu điện thế được hạ xuống 220 V.","c) Tăng U lên 10 lần thì hao phí giảm 100 lần.","d) Dây dẫn càng dài thì hao phí càng ít."],"answer": ["T","T","T","F"],"explain": "Dây càng dài thì điện trở càng lớn, hao phí càng nhiều.","points": 1},{"type": "short","level": "NB","q": "Khi truyền tải điện năng đi xa, hao phí chủ yếu do nguyên nhân nào?","answer": "Tỏa nhiệt trên đường dây dẫn","explain": "Hao phí do tỏa nhiệt.","points": 0.5},{"type": "short","level": "TH","q": "Để giảm hao phí khi truyền tải điện năng đi xa, người ta làm gì?","answer": "Tăng hiệu điện thế trước khi truyền tải","explain": "Tăng hiệu điện thế để giảm hao phí.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "TH","q": "Trong gia đình, máy biến áp nhỏ (adapter) dùng để:","options": ["A. Hạ hiệu điện thế xuống mức an toàn cho thiết bị","B. Tăng hiệu điện thế lên cao","C. Tạo ra dòng điện một chiều từ pin","D. Đo hiệu điện thế"],"answer": "A","explain": "Adapter hạ áp cho thiết bị.","points": 0.25},{"type": "mcq","level": "NB","q": "Sạc điện thoại biến đổi:","options": ["A. Điện xoay chiều 220 V thành điện một chiều điện áp thấp","B. Điện một chiều thành xoay chiều","C. Điện áp thấp thành cao","D. Cơ năng thành điện năng"],"answer": "A","explain": "Sạc đổi xoay chiều 220 V thành một chiều áp thấp.","points": 0.25},{"type": "mcq","level": "VD","q": "Một máy biến áp lí tưởng có U1 = 220 V, U2 = 110 V, N1 = 1000 vòng. Số vòng cuộn thứ cấp là:","options": ["A. 500 vòng","B. 2000 vòng","C. 1100 vòng","D. 220 vòng"],"answer": "A","explain": "N2 = 1000.110/220 = 500 vòng.","points": 0.25},{"type": "mcq","level": "VDC","q": "Máy biến áp lí tưởng có N1 = 200 vòng, N2 = 1000 vòng, U1 = 110 V. Hiệu điện thế U2 là:","options": ["A. 550 V","B. 22 V","C. 110 V","D. 1200 V"],"answer": "A","explain": "U2 = 110.1000/200 = 550 V.","points": 0.25},{"type": "mcq","level": "TH","q": "Máy biến áp lí tưởng là máy biến áp:","options": ["A. Bỏ qua mọi hao phí","B. Có hao phí rất lớn","C. Không có lõi sắt","D. Chỉ có một cuộn dây"],"answer": "A","explain": "Lí tưởng là bỏ qua hao phí.","points": 0.25},{"type": "mcq","level": "NB","q": "Lõi sắt trong máy biến áp có tác dụng:","options": ["A. Dẫn từ tốt, tăng hiệu quả biến đổi","B. Dẫn điện","C. Cách điện","D. Tỏa nhiệt"],"answer": "A","explain": "Lõi sắt dẫn từ tốt.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về tính toán.","statements": ["a) U1 = 220 V, U2 = 110 V, N1 = 1000 thì N2 = 500 vòng.","b) N1 = 200, N2 = 1000, U1 = 110 V thì U2 = 550 V.","c) Máy biến áp lí tưởng bỏ qua mọi hao phí.","d) Lõi sắt dẫn từ tốt giúp tăng hiệu quả."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về ứng dụng.","statements": ["a) Adapter hạ hiệu điện thế cho thiết bị.","b) Sạc điện thoại đổi xoay chiều 220 V thành một chiều áp thấp.","c) Trạm biến áp hạ điện áp trước khi vào khu dân cư.","d) Máy biến áp biến dòng xoay chiều thành một chiều."],"answer": ["T","T","T","F"],"explain": "Máy biến áp không đổi xoay chiều thành một chiều.","points": 1},{"type": "short","level": "VD","q": "Máy biến áp có U1 = 220 V, U2 = 110 V, N1 = 1000 vòng. Tính số vòng cuộn thứ cấp.","answer": "500","explain": "N2 = 1000.110/220 = 500 vòng.","points": 0.5},{"type": "short","level": "VDC","q": "Máy biến áp có N1 = 200 vòng, N2 = 1000 vòng, U1 = 110 V. Tính U2.","answer": "550","explain": "U2 = 110.1000/200 = 550 V.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Dòng điện xoay chiều trong mạng điện Việt Nam có tần số:","options": ["A. 50 Hz","B. 60 Hz","C. 100 Hz","D. 220 Hz"],"answer": "A","explain": "Tần số là 50 Hz.","points": 0.25},{"type": "mcq","level": "TH","q": "Tần số 50 Hz có nghĩa là dòng điện:","options": ["A. Đổi chiều 100 lần trong một giây","B. Đổi chiều 50 lần trong một giây","C. Không đổi chiều","D. Đổi chiều 25 lần trong một giây"],"answer": "A","explain": "Mỗi chu kì đổi chiều 2 lần.","points": 0.25},{"type": "mcq","level": "VD","q": "Hiệu điện thế hiệu dụng 220 V, hiệu điện thế cực đại khoảng:","options": ["A. 311 V","B. 220 V","C. 440 V","D. 110 V"],"answer": "A","explain": "Umax = 220.căn 2 = 311 V.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một bóng đèn ghi 220 V dùng với hiệu điện thế hiệu dụng 220 V thì hiệu điện thế cực đại đặt vào đèn là:","options": ["A. Khoảng 311 V","B. 220 V","C. 440 V","D. 110 V"],"answer": "A","explain": "Umax = 311 V.","points": 0.25},{"type": "mcq","level": "TH","q": "Các thiết bị điện trong gia đình được mắc:","options": ["A. Song song với nhau","B. Nối tiếp với nhau","C. Hỗn hợp","D. Tùy ý"],"answer": "A","explain": "Mắc song song để cùng 220 V.","points": 0.25},{"type": "mcq","level": "NB","q": "Hiệu điện thế giữa hai lỗ của ổ điện trong gia đình là:","options": ["A. 220 V","B. 110 V","C. 380 V","D. 12 V"],"answer": "A","explain": "Là 220 V.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về điện sinh hoạt.","statements": ["a) Tần số dòng điện ở Việt Nam là 50 Hz.","b) Dòng điện đổi chiều 100 lần trong một giây.","c) Hiệu điện thế trong gia đình là 220 V.","d) Các thiết bị trong gia đình mắc nối tiếp."],"answer": ["T","T","T","F"],"explain": "Các thiết bị mắc song song.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về giá trị hiệu dụng.","statements": ["a) U hiệu dụng 220 V thì U cực đại khoảng 311 V.","b) Vôn kế xoay chiều chỉ giá trị hiệu dụng.","c) Bóng đèn ghi 220 V chịu được U cực đại 311 V.","d) Tần số càng cao thì đèn càng sáng."],"answer": ["T","T","T","F"],"explain": "Độ sáng phụ thuộc hiệu điện thế hiệu dụng.","points": 1},{"type": "short","level": "NB","q": "Tần số của dòng điện xoay chiều trong mạng điện Việt Nam là bao nhiêu?","answer": "50 Hz","explain": "Tần số là 50 Hz.","points": 0.5},{"type": "short","level": "TH","q": "Dòng điện có tần số 50 Hz đổi chiều bao nhiêu lần trong một giây?","answer": "100","explain": "Mỗi giây đổi chiều 100 lần.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "TH","q": "Tác dụng sinh lí của dòng điện:","options": ["A. Có thể gây nguy hiểm cho cơ thể người","B. Có lợi cho sức khỏe","C. Không ảnh hưởng gì","D. Chữa được bệnh"],"answer": "A","explain": "Dòng điện qua người rất nguy hiểm.","points": 0.25},{"type": "mcq","level": "NB","q": "Dòng điện đi qua cơ thể người gây:","options": ["A. Co giật cơ, nguy hiểm đến tính mạng","B. Cảm giác dễ chịu","C. Không có cảm giác","D. Tăng sức khỏe"],"answer": "A","explain": "Gây co giật, nguy hiểm.","points": 0.25},{"type": "mcq","level": "VD","q": "Khi sử dụng điện, cần:","options": ["A. Tuân thủ các quy tắc an toàn điện","B. Chạm tay vào dây trần","C. Sửa điện khi tay ướt","D. Dùng dây điện hở"],"answer": "A","explain": "Phải tuân thủ an toàn điện.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao không được đến gần đường dây điện cao thế bị đứt rơi xuống đất?","options": ["A. Vì có thể bị điện giật do điện áp bước","B. Vì dây rất nóng","C. Vì dây rất nặng","D. Vì sợ bị phạt"],"answer": "A","explain": "Điện áp bước gây nguy hiểm.","points": 0.25},{"type": "mcq","level": "TH","q": "Điện áp an toàn cho cơ thể người thường lấy là:","options": ["A. Dưới 40 V","B. 220 V","C. 380 V","D. 500 V"],"answer": "A","explain": "Dưới 40 V được coi là an toàn.","points": 0.25},{"type": "mcq","level": "NB","q": "Cầu chì có tác dụng:","options": ["A. Ngắt mạch khi dòng điện quá lớn","B. Tăng cường độ dòng điện","C. Giảm hiệu điện thế","D. Tiết kiệm điện"],"answer": "A","explain": "Cầu chì bảo vệ mạch điện.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về an toàn điện.","statements": ["a) Dòng điện qua người gây co giật, nguy hiểm.","b) Điện áp dưới 40 V thường được coi là an toàn.","c) Cầu chì ngắt mạch khi dòng điện quá lớn.","d) Có thể chạm tay vào dây điện trần khi tay khô."],"answer": ["T","T","T","F"],"explain": "Tuyệt đối không chạm vào dây trần.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về an toàn điện.","statements": ["a) Không đến gần dây điện cao thế bị đứt vì điện áp bước.","b) Sửa điện phải ngắt nguồn trước.","c) Dùng bút thử điện để kiểm tra có điện hay không.","d) Tay ướt vẫn sửa chữa điện được."],"answer": ["T","T","T","F"],"explain": "Tay ướt sửa điện rất nguy hiểm.","points": 1},{"type": "short","level": "NB","q": "Điện áp bao nhiêu vôn thường được coi là an toàn với cơ thể người?","answer": "Dưới 40 V","explain": "Dưới 40 V được coi là an toàn.","points": 0.5},{"type": "short","level": "TH","q": "Cầu chì có tác dụng gì?","answer": "Ngắt mạch khi dòng điện quá lớn","explain": "Cầu chì bảo vệ mạch điện.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Máy biến áp được dùng ở:","options": ["A. Trạm biến áp, sạc điện thoại, các thiết bị điện","B. Chỉ trong nhà máy điện","C. Chỉ trong gia đình","D. Chỉ trong trường học"],"answer": "A","explain": "Máy biến áp dùng ở nhiều nơi.","points": 0.25},{"type": "mcq","level": "TH","q": "Trạm biến áp có nhiệm vụ:","options": ["A. Hạ hiệu điện thế xuống mức sử dụng an toàn","B. Tăng hiệu điện thế lên cao","C. Tạo ra dòng điện","D. Đo điện năng"],"answer": "A","explain": "Trạm biến áp hạ áp cho khu dân cư.","points": 0.25},{"type": "mcq","level": "VD","q": "Đường dây 500 kV dùng để:","options": ["A. Truyền tải điện năng đi xa","B. Cấp điện cho gia đình","C. Thắp sáng đường phố","D. Sạc điện thoại"],"answer": "A","explain": "Đường dây cao thế truyền tải đi xa.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao ở đầu đường dây truyền tải người ta đặt máy tăng áp?","options": ["A. Để giảm hao phí tỏa nhiệt trên đường dây","B. Để tăng công suất phát điện","C. Để giảm chiều dài dây","D. Để tăng tần số dòng điện"],"answer": "A","explain": "Tăng áp để giảm hao phí.","points": 0.25},{"type": "mcq","level": "TH","q": "Ở cuối đường dây truyền tải, người ta đặt máy:","options": ["A. Hạ áp","B. Tăng áp","C. Phát điện","D. Đo điện"],"answer": "A","explain": "Hạ áp trước khi sử dụng.","points": 0.25},{"type": "mcq","level": "NB","q": "Hệ thống truyền tải điện gồm:","options": ["A. Máy tăng áp, đường dây cao thế, máy hạ áp","B. Chỉ có đường dây","C. Chỉ có máy phát điện","D. Chỉ có máy hạ áp"],"answer": "A","explain": "Gồm máy tăng áp, đường dây, máy hạ áp.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về hệ thống điện.","statements": ["a) Máy biến áp dùng ở trạm biến áp và sạc điện thoại.","b) Đường dây 500 kV dùng để truyền tải đi xa.","c) Cuối đường dây đặt máy hạ áp.","d) Điện 500 kV được đưa trực tiếp vào gia đình."],"answer": ["T","T","T","F"],"explain": "Phải hạ áp xuống 220 V mới dùng được.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về truyền tải.","statements": ["a) Đầu đường dây đặt máy tăng áp để giảm hao phí.","b) Hệ thống gồm máy tăng áp, đường dây, máy hạ áp.","c) Trạm biến áp hạ áp cho khu dân cư.","d) Càng tăng hiệu điện thế thì hao phí càng tăng."],"answer": ["T","T","T","F"],"explain": "Tăng U thì hao phí giảm.","points": 1},{"type": "short","level": "NB","q": "Kể tên các bộ phận của hệ thống truyền tải điện năng.","answer": "Máy tăng áp, đường dây cao thế, máy hạ áp","explain": "Ba bộ phận của hệ thống.","points": 0.5},{"type": "short","level": "TH","q": "Vì sao cuối đường dây truyền tải phải đặt máy hạ áp?","answer": "Để hạ hiệu điện thế xuống mức an toàn sử dụng","explain": "Hạ áp xuống 220 V để sử dụng.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "TH","q": "Dòng điện xoay chiều chạy qua bóng đèn sợi đốt làm đèn sáng nhờ:","options": ["A. Tác dụng nhiệt và phát sáng","B. Tác dụng từ","C. Tác dụng hóa học","D. Tác dụng sinh lí"],"answer": "A","explain": "Đèn sợi đốt dùng tác dụng nhiệt, phát sáng.","points": 0.25},{"type": "mcq","level": "NB","q": "Chuông điện hoạt động nhờ tác dụng nào của dòng điện?","options": ["A. Tác dụng từ","B. Tác dụng nhiệt","C. Tác dụng phát sáng","D. Tác dụng sinh lí"],"answer": "A","explain": "Chuông điện dùng tác dụng từ.","points": 0.25},{"type": "mcq","level": "VD","q": "Bếp điện hoạt động nhờ tác dụng nào?","options": ["A. Tác dụng nhiệt","B. Tác dụng từ","C. Tác dụng phát sáng","D. Tác dụng hóa học"],"answer": "A","explain": "Bếp điện dùng tác dụng nhiệt.","points": 0.25},{"type": "mcq","level": "VDC","q": "Quạt điện hoạt động chủ yếu nhờ:","options": ["A. Tác dụng từ của dòng điện lên cuộn dây trong động cơ","B. Tác dụng nhiệt","C. Tác dụng phát sáng","D. Tác dụng sinh lí"],"answer": "A","explain": "Động cơ quạt dùng tác dụng từ.","points": 0.25},{"type": "mcq","level": "TH","q": "Mạ điện ứng dụng tác dụng nào của dòng điện?","options": ["A. Tác dụng hóa học","B. Tác dụng nhiệt","C. Tác dụng từ","D. Tác dụng phát sáng"],"answer": "A","explain": "Mạ điện dùng tác dụng hóa học.","points": 0.25},{"type": "mcq","level": "NB","q": "Bình nóng lạnh dùng tác dụng nào của dòng điện?","options": ["A. Tác dụng nhiệt","B. Tác dụng từ","C. Tác dụng phát sáng","D. Tác dụng sinh lí"],"answer": "A","explain": "Bình nóng lạnh đun nước bằng tác dụng nhiệt.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về tác dụng của dòng điện.","statements": ["a) Bóng đèn sợi đốt dùng tác dụng nhiệt và phát sáng.","b) Chuông điện dùng tác dụng từ.","c) Bếp điện dùng tác dụng nhiệt.","d) Quạt điện dùng tác dụng phát sáng."],"answer": ["T","T","T","F"],"explain": "Quạt điện dùng tác dụng từ.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về ứng dụng.","statements": ["a) Mạ điện dùng tác dụng hóa học.","b) Bình nóng lạnh dùng tác dụng nhiệt.","c) Động cơ điện dùng tác dụng từ.","d) Bóng đèn LED dùng tác dụng nhiệt."],"answer": ["T","T","T","F"],"explain": "Đèn LED dùng tác dụng phát sáng.","points": 1},{"type": "short","level": "NB","q": "Chuông điện hoạt động nhờ tác dụng nào của dòng điện?","answer": "Tác dụng từ","explain": "Chuông điện dùng tác dụng từ.","points": 0.5},{"type": "short","level": "TH","q": "Bếp điện hoạt động nhờ tác dụng nào của dòng điện?","answer": "Tác dụng nhiệt","explain": "Bếp điện dùng tác dụng nhiệt.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Máy biến áp hoạt động dựa trên:","options": ["A. Hiện tượng cảm ứng điện từ","B. Tác dụng nhiệt","C. Tác dụng hóa học","D. Định luật Ôm"],"answer": "A","explain": "Dựa trên hiện tượng cảm ứng điện từ.","points": 0.25},{"type": "mcq","level": "TH","q": "Máy biến áp không làm thay đổi đại lượng nào của dòng điện?","options": ["A. Tần số","B. Hiệu điện thế","C. Cường độ dòng điện","D. Công suất hao phí"],"answer": "A","explain": "Tần số không đổi.","points": 0.25},{"type": "mcq","level": "VD","q": "Khi máy biến áp tăng hiệu điện thế lên 2 lần, cường độ dòng điện ở cuộn thứ cấp (lí tưởng):","options": ["A. Giảm 2 lần","B. Tăng 2 lần","C. Không đổi","D. Giảm 4 lần"],"answer": "A","explain": "Công suất không đổi nên I giảm 2 lần.","points": 0.25},{"type": "mcq","level": "VDC","q": "Máy biến áp lí tưởng tăng áp 10 lần thì công suất hao phí trên đường dây truyền tải:","options": ["A. Giảm 100 lần","B. Giảm 10 lần","C. Tăng 10 lần","D. Không đổi"],"answer": "A","explain": "I giảm 10 lần nên hao phí giảm 100 lần.","points": 0.25},{"type": "mcq","level": "TH","q": "Dòng điện xoay chiều có các tác dụng:","options": ["A. Nhiệt, phát sáng, từ, sinh lí","B. Chỉ nhiệt và từ","C. Chỉ phát sáng","D. Chỉ sinh lí"],"answer": "A","explain": "Bốn tác dụng.","points": 0.25},{"type": "mcq","level": "NB","q": "Giá trị mà ampe kế xoay chiều đo được là:","options": ["A. Giá trị hiệu dụng","B. Giá trị cực đại","C. Giá trị trung bình","D. Giá trị tức thời"],"answer": "A","explain": "Là giá trị hiệu dụng.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định tổng kết.","statements": ["a) Máy biến áp dựa trên hiện tượng cảm ứng điện từ.","b) Máy biến áp không làm thay đổi tần số.","c) Dòng xoay chiều có các tác dụng nhiệt, phát sáng, từ, sinh lí.","d) Ampe kế xoay chiều đo giá trị hiệu dụng."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định tổng kết.","statements": ["a) Tăng áp 2 lần thì dòng điện giảm 2 lần (máy lí tưởng).","b) Tăng áp 10 lần thì hao phí giảm 100 lần.","c) Lõi sắt giúp dẫn từ tốt.","d) Máy biến áp biến dòng xoay chiều thành một chiều."],"answer": ["T","T","T","F"],"explain": "Máy biến áp không đổi xoay chiều thành một chiều.","points": 1},{"type": "short","level": "NB","q": "Máy biến áp hoạt động dựa trên hiện tượng nào?","answer": "Hiện tượng cảm ứng điện từ","explain": "Dựa trên hiện tượng cảm ứng điện từ.","points": 0.5},{"type": "short","level": "TH","q": "Máy biến áp có làm thay đổi tần số của dòng điện không?","answer": "Không","explain": "Tần số không đổi.","points": 0.5}]}]}
