{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Văn bản thông tin có mục đích chính là gì?", "explain": "Văn bản thông tin nhằm cung cấp tri thức, sự thật về sự vật, hiện tượng.", "options": ["A. Cung cấp tri thức, sự thật về sự vật, hiện tượng", "B. Kể chuyện giải trí", "C. Bày tỏ cảm xúc", "D. Tranh luận"], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Đặc điểm nổi bật của văn bản thông tin là gì?", "explain": "Văn bản thông tin phải xác thực, khách quan và có cấu trúc rõ ràng.", "options": ["A. Hư cấu, tưởng tượng", "B. Xác thực, khách quan, cấu trúc rõ ràng", "C. Cảm tính, chủ quan", "D. Rườm rà, khó hiểu"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Tác giả văn bản “Ôn dịch, thuốc lá” là ai?", "explain": "“Ôn dịch, thuốc lá” là văn bản của bác sĩ, nhà nghiên cứu Nguyễn Khắc Viện.", "options": ["A. Thế Lữ", "B. Vũ Đình Liên", "C. Nguyễn Khắc Viện", "D. Tế Hanh"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Nhan đề “Ôn dịch, thuốc lá” gây ấn tượng bằng cách nào?", "explain": "So sánh thuốc lá với ôn dịch nhấn mạnh mức độ nguy hiểm của nó.", "options": ["A. Dùng từ ngữ hoa mĩ", "B. Gây cười", "C. Không có gì đặc biệt", "D. Đặt thuốc lá ngang hàng với ôn dịch – căn bệnh nguy hiểm"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Văn bản “Ôn dịch, thuốc lá” chủ yếu bàn về vấn đề gì?", "explain": "Văn bản phân tích tác hại của thuốc lá và kêu gọi từ bỏ nó.", "options": ["A. Tác hại của thuốc lá đối với sức khỏe và xã hội", "B. Cách trồng thuốc lá", "C. Lịch sử thuốc lá", "D. Lợi ích của thuốc lá"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Khói thuốc lá chứa hàng nghìn chất độc hại. Người hút trực tiếp đã đành, người ngồi cạnh cũng hít phải khói thuốc mà mang bệnh. Vì thế, hút thuốc không còn là chuyện riêng của mỗi người.”\nÝ chính của đoạn văn là gì?", "explain": "Đoạn văn nhấn mạnh thuốc lá hại cả người hút trực tiếp và người hít khói thụ động.", "options": ["A. Thuốc lá chỉ hại người hút", "B. Thuốc lá gây hại cho cả người hút và người xung quanh", "C. Khói thuốc không độc hại", "D. Nên hút thuốc nơi đông người"], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Văn bản thông tin cung cấp tri thức xác thực, có cấu trúc rõ ràng với nhan đề, sa-pô, đề mục. Ngôn ngữ của nó chính xác, ngắn gọn, tránh hoa mĩ.”\nXét tính đúng sai:", "statements": ["a) Văn bản thông tin cung cấp tri thức xác thực.", "b) Văn bản thông tin có cấu trúc rõ ràng.", "c) Ngôn ngữ văn bản thông tin hoa mĩ, bóng bẩy."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – ngôn ngữ chính xác, ngắn gọn."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Mỗi người chúng ta đều có trách nhiệm với ngày mai: hôm nay giữ gìn vệ sinh, ngày mai ta có môi trường xanh; hôm nay chăm học, ngày mai ta có tương lai sáng.”\nThông điệp của đoạn văn là gì?", "explain": "Đoạn văn nhắn nhủ mỗi hành động hôm nay đều góp phần tạo nên ngày mai.", "options": ["A. Chỉ lo cho hôm nay", "B. Ngày mai tự lo liệu", "C. Sống có trách nhiệm hôm nay vì ngày mai tốt đẹp", "D. Không cần trách nhiệm"], "answer": "C"}, {"type": "short", "level": "VD", "q": "Nêu hai đặc điểm của văn bản thông tin.", "answer": "Tính xác thực, khách quan; cấu trúc rõ ràng (nhan đề, sa-pô, đề mục, số liệu).", "explain": "Chấm theo ý: nêu đúng hai đặc điểm cơ bản của văn bản thông tin."}, {"type": "short", "level": "VD", "q": "Vì sao tác giả so sánh thuốc lá với ôn dịch?", "answer": "Để nhấn mạnh mức độ nguy hiểm, lây lan rộng và hậu quả nghiêm trọng của thuốc lá như một dịch bệnh.", "explain": "Chấm theo ý: chỉ ra được dụng ý của cách so sánh."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "TH", "q": "Ngôn ngữ của văn bản thông tin thường như thế nào?", "explain": "Văn bản thông tin dùng ngôn ngữ chính xác, ngắn gọn, rõ ràng.", "options": ["A. Hoa mĩ, bóng bẩy", "B. Mơ hồ, ẩn dụ", "C. Tùy hứng", "D. Chính xác, ngắn gọn, rõ ràng"], "answer": "D"}, {"type": "mcq", "level": "NB", "q": "Các yếu tố nào giúp văn bản thông tin dễ tiếp nhận?", "explain": "Nhan đề, sa-pô, đề mục, số liệu, hình ảnh giúp người đọc nắm bắt nhanh nội dung.", "options": ["A. Nhan đề, sa-pô, đề mục, số liệu, hình ảnh minh họa", "B. Vần điệu", "C. Nhân vật", "D. Cốt truyện"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Trong “Ôn dịch, thuốc lá”, tác giả chủ yếu dùng cách lập luận nào?", "explain": "Tác giả dùng so sánh, liệt kê tác hại và số liệu để thuyết phục.", "options": ["A. Kể chuyện cổ tích", "B. So sánh, liệt kê tác hại, nêu số liệu", "C. Tả cảnh thiên nhiên", "D. Đối thoại"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Đối tượng mà văn bản “Ôn dịch, thuốc lá” hướng tới là ai?", "explain": "Văn bản hướng tới mọi người, nhất là người hút thuốc và thanh thiếu niên.", "options": ["A. Chỉ các bác sĩ", "B. Chỉ người già", "C. Mọi người, đặc biệt là người hút thuốc và thanh thiếu niên", "D. Chỉ trẻ em"], "answer": "C"}, {"type": "mcq", "level": "NB", "q": "Nghị luận xã hội bàn về đối tượng nào?", "explain": "Nghị luận xã hội bàn về các vấn đề của đời sống xã hội.", "options": ["A. Tác phẩm văn học", "B. Sự vật khoa học", "C. Nhân vật lịch sử", "D. Vấn đề đời sống xã hội"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Sa-pô là đoạn tóm tắt ngắn sau nhan đề. Chỉ cần đọc sa-pô, người đọc đã nắm được ý chính của cả bài viết, từ đó quyết định có đọc tiếp hay không.”\nTheo đoạn văn, sa-pô có vai trò gì?", "explain": "Sa-pô tóm tắt ý chính giúp người đọc nắm nhanh nội dung bài viết.", "options": ["A. Tóm tắt ý chính, giúp người đọc nắm nhanh nội dung", "B. Trang trí bài viết", "C. Kéo dài bài viết", "D. Thay cho kết luận"], "answer": "A"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Nguyễn Khắc Viện là bác sĩ, nhà nghiên cứu uy tín. Văn bản “Ôn dịch, thuốc lá” của ông kết hợp thông tin khoa học và lập luận thuyết phục, kêu gọi mọi người từ bỏ thuốc lá.”\nXét tính đúng sai:", "statements": ["a) Nguyễn Khắc Viện là bác sĩ, nhà nghiên cứu.", "b) Văn bản kết hợp thông tin và nghị luận.", "c) Văn bản kêu gọi mọi người hút thuốc lá."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – văn bản kêu gọi từ bỏ thuốc lá."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Thuốc lá không chỉ gây bệnh cho người hút mà còn làm tốn kém tiền bạc, ô nhiễm không khí. Một điếu thuốc là một lần tự làm hại mình và làm phiền người khác.”\nĐoạn văn liệt kê tác hại của thuốc lá trên những phương diện nào?", "explain": "Đoạn văn nêu tác hại về sức khỏe, kinh tế và với người xung quanh.", "options": ["A. Chỉ sức khỏe", "B. Sức khỏe, kinh tế và ảnh hưởng đến người xung quanh", "C. Chỉ kinh tế", "D. Không có tác hại"], "answer": "B"}, {"type": "short", "level": "VD", "q": "Nêu hai dạng bài nghị luận xã hội.", "answer": "Nghị luận về một hiện tượng đời sống; nghị luận về một tư tưởng, đạo lí.", "explain": "Chấm theo ý: nêu đúng tên hai dạng bài."}, {"type": "short", "level": "VD", "q": "Kể tên một vấn đề xã hội hôm nay mà em quan tâm và nêu ngắn gọn suy nghĩ của em.", "answer": "Học sinh tự nêu vấn đề (môi trường, giao thông, mạng xã hội...) và suy nghĩ của mình.", "explain": "Chấm theo ý: vấn đề cụ thể, suy nghĩ chân thành, hợp lí."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "TH", "q": "Điểm giống nhau giữa “Ôn dịch, thuốc lá” và văn bản thông tin thuần túy là gì?", "explain": "Văn bản cũng cung cấp tri thức xác thực, có số liệu và cấu trúc rõ ràng.", "options": ["A. Đều là truyện", "B. Đều là thơ", "C. Đều cung cấp tri thức xác thực, có số liệu, cấu trúc rõ ràng", "D. Đều hư cấu"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Điểm khác của “Ôn dịch, thuốc lá” so với văn bản thông tin thuần túy là gì?", "explain": "Văn bản mang tính nghị luận: thuyết phục và kêu gọi hành động.", "options": ["A. Không có số liệu", "B. Viết bằng thơ", "C. Không có nhan đề", "D. Kết hợp thuyết phục, kêu gọi hành động (tính nghị luận)"], "answer": "D"}, {"type": "mcq", "level": "NB", "q": "“Hiện tượng đời sống” là dạng đề nghị luận xã hội về vấn đề gì?", "explain": "Nghị luận về hiện tượng đời sống bàn về sự việc đang diễn ra trong xã hội.", "options": ["A. Sự việc, hiện tượng đang diễn ra trong xã hội", "B. Tác phẩm văn học", "C. Truyền thuyết", "D. Giấc mơ"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "“Tư tưởng, đạo lí” trong nghị luận xã hội thường là những vấn đề gì?", "explain": "Nghị luận về tư tưởng, đạo lí bàn về lẽ sống và quan niệm đạo đức.", "options": ["A. Công thức toán học", "B. Lẽ sống, quan niệm đúng đắn về đạo đức, nhân cách", "C. Định luật vật lí", "D. Kĩ thuật nấu ăn"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Mở bài của bài văn nghị luận xã hội cần làm gì?", "explain": "Mở bài giới thiệu vấn đề nghị luận một cách ngắn gọn, hấp dẫn.", "options": ["A. Kể chuyện dài", "B. Nêu kết luận", "C. Giới thiệu vấn đề nghị luận", "D. Trích dẫn thơ"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Hiện tượng xả rác bừa bãi rất dễ thấy: công viên, bờ hồ, thậm chí sân trường sau giờ ra chơi. Mỗi mảnh rác là một lần ta làm xấu đi môi trường sống của chính mình.”\nĐoạn văn đang bàn về hiện tượng gì?", "explain": "Đoạn văn nêu biểu hiện cụ thể của hiện tượng xả rác bừa bãi.", "options": ["A. Ô nhiễm không khí", "B. Kẹt xe", "C. Ngập lụt", "D. Xả rác bừa bãi nơi công cộng"], "answer": "D"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Bài văn nghị luận xã hội có bố cục ba phần: mở bài giới thiệu vấn đề; thân bài giải thích, phân tích, bàn luận; kết bài khẳng định và liên hệ.”\nXét tính đúng sai:", "statements": ["a) Bài văn nghị luận xã hội có ba phần.", "b) Thân bài là nơi giải thích, phân tích, bàn luận.", "c) Kết bài không cần liên hệ bản thân."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – kết bài nên có liên hệ."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Dẫn chứng trong nghị luận xã hội phải mới và tiêu biểu: một tấm gương người tốt việc tốt gần gũi sẽ thuyết phục hơn trăm lời sáo rỗng.”\nTheo đoạn văn, dẫn chứng tốt là dẫn chứng như thế nào?", "explain": "Dẫn chứng mới, tiêu biểu, gần gũi mới có sức thuyết phục.", "options": ["A. Mới, tiêu biểu, gần gũi với đời sống", "B. Càng cũ càng tốt", "C. Chung chung, sáo rỗng", "D. Hư cấu"], "answer": "A"}, {"type": "short", "level": "VD", "q": "Nêu bố cục ba phần của bài văn nghị luận xã hội.", "answer": "Mở bài (nêu vấn đề) – Thân bài (giải thích, biểu hiện, nguyên nhân, hậu quả, giải pháp) – Kết bài (khẳng định, liên hệ).", "explain": "Chấm theo ý: nêu đủ ba phần và nội dung chính mỗi phần."}, {"type": "short", "level": "VD", "q": "Vì sao dẫn chứng trong nghị luận xã hội cần mới và tiêu biểu?", "answer": "Dẫn chứng mới, tiêu biểu phản ánh đúng thực tế, tăng sức thuyết phục; dẫn chứng cũ, chung chung gây nhàm chán.", "explain": "Chấm theo ý: chỉ ra được vai trò của dẫn chứng mới, tiêu biểu."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Khi viết về hiện tượng đời sống, cần trình bày những nội dung nào?", "explain": "Viết về hiện tượng đời sống cần nêu biểu hiện, nguyên nhân, hậu quả và giải pháp.", "options": ["A. Chỉ kể lại", "B. Biểu hiện, nguyên nhân, hậu quả, giải pháp", "C. Chỉ nêu ý kiến", "D. Chỉ trích dẫn"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Vấn đề ô nhiễm môi trường thuộc dạng đề nào?", "explain": "Ô nhiễm môi trường là hiện tượng đang diễn ra trong xã hội.", "options": ["A. Nghị luận văn học", "B. Nghị luận về tư tưởng đạo lí", "C. Nghị luận về hiện tượng đời sống", "D. Thuyết minh"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Trách nhiệm của học sinh với “ngày mai” được thể hiện qua việc gì?", "explain": "Học sinh thể hiện trách nhiệm bằng học tập, ý thức, bảo vệ môi trường, rèn sức khỏe.", "options": ["A. Chỉ lo học", "B. Chơi nhiều", "C. Không quan tâm", "D. Học tập tốt, sống có ý thức, bảo vệ môi trường, rèn luyện sức khỏe"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Câu “Hôm nay gieo hành động, ngày mai gặt hậu quả” muốn nhắn nhủ điều gì?", "explain": "Câu nói nhấn mạnh mối quan hệ nhân quả giữa hôm nay và ngày mai.", "options": ["A. Mỗi hành động hôm nay đều ảnh hưởng đến tương lai", "B. Chỉ sống cho hôm nay", "C. Tương lai không quan trọng", "D. Hành động vô nghĩa"], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Phần thân bài nghị luận xã hội thường bắt đầu bằng thao tác nào?", "explain": "Thân bài thường bắt đầu bằng việc giải thích vấn đề là gì.", "options": ["A. Kết luận", "B. Giải thích vấn đề", "C. Kể chuyện", "D. Tả cảnh"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “An toàn giao thông là vấn đề của mọi người: học sinh đội mũ bảo hiểm khi đi xe, không lạng lách; người lớn không uống rượu khi lái xe. Mỗi người ý thức một chút, đường phố sẽ bình yên hơn.”\nTheo đoạn văn, ai có trách nhiệm về an toàn giao thông?", "explain": "An toàn giao thông là trách nhiệm chung của mọi người, kể cả học sinh.", "options": ["A. Chỉ cảnh sát giao thông", "B. Chỉ người lớn", "C. Mọi người, trong đó có học sinh", "D. Không ai"], "answer": "C"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Học sinh là chủ nhân tương lai của đất nước. Những gì các em học hôm nay, cách các em sống hôm nay sẽ quyết định diện mạo ngày mai của quê hương.”\nXét tính đúng sai:", "statements": ["a) Học sinh là chủ nhân tương lai của đất nước.", "b) Việc học hôm nay ảnh hưởng đến ngày mai.", "c) Cách sống hôm nay không liên quan đến tương lai."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – cách sống hôm nay quyết định ngày mai."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Bảo vệ môi trường không phải là việc của riêng ai: em bỏ rác đúng nơi, tắt điện khi ra khỏi phòng, trồng thêm cây xanh – những việc nhỏ ấy góp phần làm nên thay đổi lớn.”\nĐoạn văn kêu gọi điều gì?", "explain": "Đoạn văn kêu gọi mỗi người góp sức bằng những việc làm nhỏ hằng ngày.", "options": ["A. Chỉ nhà nước lo môi trường", "B. Không cần làm gì", "C. Chờ người khác làm", "D. Mỗi người hãy làm những việc nhỏ để bảo vệ môi trường"], "answer": "D"}, {"type": "short", "level": "VD", "q": "Nêu một giải pháp cho vấn đề rác thải nhựa ở trường học.", "answer": "Học sinh tự nêu giải pháp (ví dụ: dùng bình nước cá nhân, phân loại rác, nói không với túi nilon...).", "explain": "Chấm theo ý: giải pháp cụ thể, khả thi, phù hợp với trường học."}, {"type": "short", "level": "VD", "q": "Giải thích ngắn gọn: vì sao nói thanh niên là chủ nhân của ngày mai?", "answer": "Vì tương lai đất nước phụ thuộc vào thế hệ trẻ hôm nay – tri thức, đạo đức và hành động của các em sẽ quyết định ngày mai.", "explain": "Chấm theo ý: chỉ ra được vai trò của thế hệ trẻ với tương lai."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Số liệu trong văn bản thông tin có vai trò gì?", "explain": "Số liệu cụ thể giúp văn bản thông tin xác thực và thuyết phục hơn.", "options": ["A. Tăng tính xác thực, thuyết phục", "B. Trang trí", "C. Gây rối", "D. Không cần thiết"], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Sa-pô trong văn bản thông tin là gì?", "explain": "Sa-pô là đoạn tóm tắt ngắn sau nhan đề, nêu ý chính của văn bản.", "options": ["A. Phần kết luận", "B. Đoạn tóm tắt ngắn sau nhan đề, nêu ý chính", "C. Chú thích ảnh", "D. Tên tác giả"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Khi đọc văn bản thông tin, cần phân biệt điều gì?", "explain": "Cần phân biệt thông tin khách quan với ý kiến, nhận định của tác giả.", "options": ["A. Chữ in hoa và in thường", "B. Câu ngắn và câu dài", "C. Thông tin (sự thật, số liệu) và ý kiến (nhận định, đánh giá)", "D. Không cần phân biệt"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Đánh giá độ tin cậy của văn bản thông tin dựa vào đâu?", "explain": "Độ tin cậy dựa vào nguồn, số liệu kiểm chứng được và uy tín tác giả.", "options": ["A. Độ dài văn bản", "B. Chữ đẹp", "C. Nhiều hình ảnh", "D. Nguồn cung cấp, số liệu kiểm chứng được, tác giả uy tín"], "answer": "D"}, {"type": "mcq", "level": "NB", "q": "Đề “Suy nghĩ về hiện tượng xả rác bừa bãi” thuộc kiểu bài nào?", "explain": "Đề bàn về hiện tượng xã hội nên là nghị luận xã hội về hiện tượng đời sống.", "options": ["A. Nghị luận xã hội về hiện tượng đời sống", "B. Nghị luận văn học", "C. Tự sự", "D. Miêu tả"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Trước một tin tức trên mạng, em đừng vội tin ngay. Hãy xem nguồn tin ở đâu, có số liệu kiểm chứng không, nhiều báo uy tín có đưa tin không. Đó là cách đọc thông minh.”\nĐoạn văn hướng dẫn kĩ năng gì?", "explain": "Đoạn văn hướng dẫn cách kiểm chứng nguồn tin, số liệu trước khi tin.", "options": ["A. Tin mọi thứ trên mạng", "B. Kiểm chứng độ tin cậy của thông tin", "C. Chia sẻ tin ngay", "D. Không đọc tin tức"], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Mạng xã hội là con dao hai lưỡi: giúp kết nối, học hỏi nhưng cũng đầy tin giả, lời lẽ thiếu văn minh. Người dùng thông minh là người biết chọn lọc và ứng xử có văn hóa.”\nXét tính đúng sai:", "statements": ["a) Mạng xã hội có cả mặt tốt và mặt xấu.", "b) Trên mạng xã hội có nhiều tin giả.", "c) Dùng mạng xã hội không cần văn minh."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – cần ứng xử có văn hóa."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Một bạn học sinh thấy tin “uống nước chanh chữa được mọi bệnh” liền chia sẻ ngay cho cả lớp. Sau đó bạn mới biết đó là tin giả. Bài học: hãy kiểm chứng trước khi chia sẻ.”\nBài học rút ra từ câu chuyện là gì?", "explain": "Câu chuyện nhắc nhở phải kiểm chứng thông tin trước khi chia sẻ.", "options": ["A. Không dùng mạng xã hội", "B. Tin mọi thứ bạn bè gửi", "C. Kiểm chứng thông tin trước khi chia sẻ", "D. Chia sẻ càng nhanh càng tốt"], "answer": "C"}, {"type": "short", "level": "VD", "q": "Nêu ba câu hỏi cần đặt ra khi đọc một văn bản thông tin.", "answer": "Ví dụ: Văn bản cung cấp thông tin gì? Thông tin có chính xác, đáng tin không? Ý kiến của tác giả là gì?", "explain": "Chấm theo ý: ba câu hỏi giúp đọc hiểu và đánh giá văn bản thông tin."}, {"type": "short", "level": "VD", "q": "Em sẽ làm gì để góp phần giảm tác hại của thuốc lá trong cộng đồng?", "answer": "Học sinh tự nêu (ví dụ: tuyên truyền, nhắc nhở người thân, không thử hút thuốc...).", "explain": "Chấm theo ý: việc làm cụ thể, thiết thực, thể hiện trách nhiệm."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Văn bản “Ôn dịch, thuốc lá” kêu gọi điều gì?", "explain": "Văn bản kêu gọi mọi người từ bỏ thuốc lá, chung tay phòng chống.", "options": ["A. Trồng thêm thuốc lá", "B. Tăng giá thuốc lá", "C. Không làm gì", "D. Mọi người từ bỏ thuốc lá, chung tay phòng chống"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Tác hại của thuốc lá được liệt kê trên những phương diện nào?", "explain": "Văn bản liệt kê tác hại về sức khỏe, kinh tế và với người xung quanh.", "options": ["A. Sức khỏe, kinh tế, ảnh hưởng đến người xung quanh", "B. Chỉ sức khỏe", "C. Chỉ kinh tế", "D. Không có tác hại"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "“Hút thuốc lá thụ động” có nghĩa là gì?", "explain": "Hút thuốc thụ động là người không hút vẫn hít khói thuốc và chịu tác hại.", "options": ["A. Hút thuốc một mình", "B. Người không hút vẫn hít phải khói thuốc và chịu tác hại", "C. Hút thuốc lá điện tử", "D. Bỏ thuốc thành công"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Câu nào sau đây có thể làm luận điểm trong nghị luận xã hội?", "explain": "Luận điểm phải là một nhận định, ý kiến có thể bàn luận, chứng minh.", "options": ["A. “Hôm nay trời đẹp”", "B. “Tôi thích đọc sách”", "C. “Bảo vệ môi trường là trách nhiệm của mỗi người”", "D. “Bài văn có 3 phần”"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Dẫn chứng trong nghị luận xã hội nên lấy từ đâu?", "explain": "Dẫn chứng nghị luận xã hội lấy từ thực tế đời sống, tấm gương, sự kiện tiêu biểu.", "options": ["A. Truyện cổ tích", "B. Giấc mơ", "C. Phim viễn tưởng", "D. Thực tế đời sống, tấm gương, sự kiện tiêu biểu"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Có bạn cho rằng “tôi hút, tôi chịu, không liên quan đến ai”. Nhưng khói thuốc bay sang bàn bên, vào phổi người khác – đó là sự ích kỉ, thiếu trách nhiệm với cộng đồng.”\nĐoạn văn phê phán quan niệm nào?", "explain": "Đoạn văn phê phán quan niệm coi hút thuốc là chuyện riêng, phớt lờ ảnh hưởng đến cộng đồng.", "options": ["A. Quan niệm hút thuốc là chuyện riêng, không ảnh hưởng đến ai", "B. Quan niệm bỏ thuốc lá", "C. Quan niệm bảo vệ sức khỏe", "D. Quan niệm sống lành mạnh"], "answer": "A"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Thuốc lá gây ra nhiều bệnh nguy hiểm cho đường hô hấp. Người hít khói thuốc thụ động cũng có nguy cơ mắc bệnh. Vì vậy, nói không với thuốc lá là bảo vệ chính mình và mọi người.”\nXét tính đúng sai:", "statements": ["a) Thuốc lá gây bệnh cho đường hô hấp.", "b) Hít khói thuốc thụ động cũng có hại.", "c) Nói không với thuốc lá chỉ bảo vệ bản thân."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – còn bảo vệ mọi người xung quanh."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Phòng chống thuốc lá cần sự chung tay: nhà trường tuyên truyền, gia đình nhắc nhở, mỗi học sinh nói không với điếu thuốc đầu tiên.”\nTheo đoạn văn, phòng chống thuốc lá cần gì?", "explain": "Phòng chống thuốc lá cần sự phối hợp của nhà trường, gia đình và bản thân mỗi học sinh.", "options": ["A. Chỉ cần nhà trường", "B. Sự chung tay của nhà trường, gia đình và mỗi học sinh", "C. Chỉ cần gia đình", "D. Không cần ai"], "answer": "B"}, {"type": "short", "level": "VD", "q": "Nêu tác hại của thuốc lá đối với người hút và người xung quanh.", "answer": "Người hút: bệnh đường hô hấp, ung thư...; người xung quanh: hít khói thụ động, ảnh hưởng sức khỏe; tốn kém kinh tế.", "explain": "Chấm theo ý: nêu được tác hại với cả người hút và người xung quanh."}, {"type": "short", "level": "VD", "q": "Viết một khẩu hiệu tuyên truyền phòng chống thuốc lá.", "answer": "Học sinh tự sáng tác khẩu hiệu (ngắn gọn, dễ nhớ, đúng nội dung).", "explain": "Chấm theo ý: khẩu hiệu ngắn gọn, dễ nhớ, đúng nội dung tuyên truyền."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "TH", "q": "Vì sao văn bản thông tin cần cấu trúc rõ ràng?", "explain": "Cấu trúc rõ ràng giúp người đọc nắm bắt nhanh và chính xác nội dung.", "options": ["A. Để văn bản dài hơn", "B. Để khó hiểu hơn", "C. Giúp người đọc nắm bắt nhanh, chính xác nội dung", "D. Không cần thiết"], "answer": "C"}, {"type": "mcq", "level": "NB", "q": "Nhan đề của văn bản thông tin thường như thế nào?", "explain": "Nhan đề văn bản thông tin ngắn gọn, nêu đúng nội dung chính.", "options": ["A. Thật dài dòng", "B. Bí ẩn, khó đoán", "C. Không cần nhan đề", "D. Ngắn gọn, nêu đúng nội dung chính"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa “hôm nay” và “ngày mai” trong nhan đề Bài 9 là gì?", "explain": "Nhan đề nhấn mạnh: những gì ta làm hôm nay sẽ quyết định ngày mai.", "options": ["A. Hành động hôm nay quyết định tương lai ngày mai", "B. Hai thời điểm độc lập", "C. Ngày mai không quan trọng", "D. Hôm nay không quan trọng"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "An toàn giao thông là trách nhiệm của ai?", "explain": "An toàn giao thông là trách nhiệm chung của toàn xã hội, kể cả học sinh.", "options": ["A. Chỉ của cảnh sát", "B. Của toàn xã hội, trong đó có học sinh", "C. Chỉ của người lớn", "D. Không của ai"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Kết bài nghị luận xã hội nên làm gì?", "explain": "Kết bài khẳng định vấn đề, nêu bài học và liên hệ bản thân.", "options": ["A. Mở vấn đề mới", "B. Kể chuyện cười", "C. Khẳng định vấn đề, nêu bài học, liên hệ bản thân", "D. Dừng đột ngột"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Nghiện mạng xã hội biểu hiện ở việc dán mắt vào điện thoại hàng giờ, sao nhãng học tập, cáu gắt khi bị nhắc nhở. Lâu dần, các em mất đi thời gian quý báu của tuổi trẻ.”\nĐoạn văn nêu biểu hiện của hiện tượng nào?", "explain": "Các biểu hiện nêu trong đoạn văn là của hiện tượng nghiện mạng xã hội.", "options": ["A. Chăm học", "B. Yêu thể thao", "C. Đọc sách nhiều", "D. Nghiện mạng xã hội ở học sinh"], "answer": "D"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Để viết tốt bài nghị luận xã hội, em cần: nắm chắc vấn đề, lập dàn ý rõ ràng, tìm dẫn chứng thực tế tiêu biểu và diễn đạt mạch lạc, chân thành.”\nXét tính đúng sai:", "statements": ["a) Cần nắm chắc vấn đề trước khi viết.", "b) Cần lập dàn ý rõ ràng.", "c) Dẫn chứng có thể bịa đặt cho hay."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – dẫn chứng phải từ thực tế."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Một bài văn hay về hiện tượng xả rác không chỉ chê trách mà còn đề xuất giải pháp: phân loại rác, dùng đồ tái sử dụng, nhắc nhở nhau giữ vệ sinh chung.”\nTheo đoạn văn, bài văn hay cần có thêm gì ngoài phê phán?", "explain": "Bài văn hay không chỉ phê phán mà còn đề xuất giải pháp thiết thực.", "options": ["A. Đề xuất giải pháp khắc phục", "B. Chê trách nhiều hơn", "C. Kể chuyện cười", "D. Không cần gì thêm"], "answer": "A"}, {"type": "short", "level": "VD", "q": "Nêu dàn ý vắn tắt cho đề “Nghị luận về hiện tượng nghiện mạng xã hội ở học sinh”.", "answer": "Mở bài: nêu hiện tượng. Thân bài: biểu hiện – nguyên nhân – hậu quả – giải pháp. Kết bài: bài học, liên hệ bản thân.", "explain": "Chấm theo ý: dàn ý đủ ba phần, các ý triển khai hợp lí."}, {"type": "short", "level": "VD", "q": "Theo em, học sinh cần làm gì để sử dụng mạng xã hội văn minh?", "answer": "Học sinh tự nêu (ví dụ: dùng ngôn ngữ lịch sự, kiểm chứng thông tin, không chia sẻ tin giả...).", "explain": "Chấm theo ý: việc làm cụ thể, thể hiện ý thức văn minh."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "Văn minh trên mạng xã hội thể hiện qua điều gì?", "explain": "Văn minh mạng thể hiện ở ngôn ngữ lịch sự, thông tin đúng và tôn trọng người khác.", "options": ["A. Nói gì cũng được", "B. Ngôn ngữ lịch sự, thông tin đúng sự thật, tôn trọng người khác", "C. Chia sẻ tin giả", "D. Xúc phạm người khác"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Tin giả trên mạng có tác hại gì?", "explain": "Tin giả gây hoang mang, hiểu lầm và ảnh hưởng xấu đến xã hội.", "options": ["A. Không có hại", "B. Giúp vui", "C. Gây hoang mang, hiểu lầm, ảnh hưởng xã hội", "D. Tăng kiến thức"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Khi viết bài nghị luận xã hội, thái độ của người viết nên như thế nào?", "explain": "Người viết cần khách quan, có chính kiến rõ ràng và chân thành.", "options": ["A. Thờ ơ, vô cảm", "B. Cực đoan, phiến diện", "C. Ba phải", "D. Khách quan, có chính kiến rõ ràng, chân thành"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Phần “liên hệ bản thân” trong bài nghị luận xã hội có tác dụng gì?", "explain": "Liên hệ bản thân thể hiện nhận thức và trách nhiệm của người viết.", "options": ["A. Thể hiện nhận thức và trách nhiệm của người viết", "B. Kéo dài bài", "C. Khoe thành tích", "D. Không cần thiết"], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Câu nào là dẫn chứng tốt cho bài viết về bảo vệ môi trường?", "explain": "Dẫn chứng phải từ thực tế, tiêu biểu như phong trào “Ngày chủ nhật xanh”.", "options": ["A. Truyện cổ tích", "B. Phong trào “Ngày chủ nhật xanh” của học sinh cả nước", "C. Giấc mơ đêm qua", "D. Phim hoạt hình"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Trước khi bấm nút chia sẻ, em hãy tự hỏi: tin này có đúng không? Nó có làm tổn thương ai không? Chia sẻ nó có ích gì? Ba câu hỏi nhỏ giúp em trở thành người dùng mạng văn minh.”\nĐoạn văn khuyên người dùng mạng điều gì?", "explain": "Đoạn văn khuyên cân nhắc kĩ lưỡng trước khi chia sẻ để dùng mạng văn minh.", "options": ["A. Chia sẻ mọi thứ thấy được", "B. Không dùng mạng xã hội", "C. Suy nghĩ kĩ trước khi chia sẻ thông tin", "D. Chỉ đọc không chia sẻ"], "answer": "C"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Lòng biết ơn là đạo lí tốt đẹp của dân tộc. Người biết ơn là người nhớ về cội nguồn, trân trọng những gì mình nhận được và sống có trách nhiệm.”\nXét tính đúng sai:", "statements": ["a) Lòng biết ơn là đạo lí tốt đẹp.", "b) Người biết ơn nhớ về cội nguồn.", "c) Biết ơn là chỉ nhớ mà không cần hành động."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – biết ơn gắn với sống có trách nhiệm."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Tình yêu thương không phải là điều xa xôi: là chia sẻ hộp cơm với bạn khó khăn, là đỡ bạn dậy khi ngã, là một lời động viên đúng lúc.”\nTheo đoạn văn, tình yêu thương thể hiện qua điều gì?", "explain": "Tình yêu thương thể hiện qua những việc làm nhỏ, cụ thể hằng ngày.", "options": ["A. Lời nói to tát", "B. Quà cáp đắt tiền", "C. Điều xa xôi", "D. Những việc làm nhỏ, cụ thể hằng ngày"], "answer": "D"}, {"type": "short", "level": "VD", "q": "Nêu hai biểu hiện của lối sống văn minh trên mạng xã hội.", "answer": "Dùng ngôn ngữ lịch sự; kiểm chứng thông tin trước khi chia sẻ; tôn trọng quyền riêng tư của người khác.", "explain": "Chấm theo ý: nêu được hai biểu hiện cụ thể, đúng."}, {"type": "short", "level": "VD", "q": "Em hiểu thế nào về trách nhiệm của thế hệ trẻ với “ngày mai” của đất nước?", "answer": "Học sinh tự nêu (ví dụ: học tập, rèn luyện, sống có ý thức để xây dựng tương lai...).", "explain": "Chấm theo ý: hiểu được vai trò của thế hệ trẻ, diễn đạt chân thành."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "TH", "q": "Vì sao cần quan tâm đến vấn đề xã hội ngay từ hôm nay?", "explain": "Vấn đề hôm nay không giải quyết sẽ thành hậu quả nặng nề của ngày mai.", "options": ["A. Vì hôm nay là nền tảng của ngày mai; chậm trễ sẽ phải trả giá đắt", "B. Vì rảnh rỗi", "C. Vì bắt buộc", "D. Không cần quan tâm"], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Học sinh góp phần bảo vệ môi trường bằng việc nào?", "explain": "Những việc làm nhỏ hằng ngày của học sinh góp phần bảo vệ môi trường.", "options": ["A. Xả rác bừa bãi", "B. Bỏ rác đúng nơi, tiết kiệm điện nước, trồng cây xanh", "C. Lãng phí điện nước", "D. Chặt cây"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Sức khỏe cộng đồng liên quan đến mỗi cá nhân như thế nào?", "explain": "Sức khỏe cá nhân và cộng đồng gắn bó mật thiết, ảnh hưởng lẫn nhau.", "options": ["A. Không liên quan", "B. Chỉ việc của bác sĩ", "C. Sức khỏe mỗi người ảnh hưởng đến cộng đồng và ngược lại", "D. Chỉ việc của người bệnh"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Khi bàn về một tư tưởng, đạo lí, cần làm rõ điều gì đầu tiên?", "explain": "Trước hết cần giải thích rõ nội dung, ý nghĩa của tư tưởng, đạo lí.", "options": ["A. Tiểu sử tác giả", "B. Số liệu thống kê", "C. Kết luận ngay", "D. Nội dung, ý nghĩa của tư tưởng đó"], "answer": "D"}, {"type": "mcq", "level": "NB", "q": "Bài văn nghị luận xã hội hay cần có yếu tố nào?", "explain": "Bài văn hay cần vấn đề rõ, lí lẽ chặt chẽ, dẫn chứng thực tế và cảm xúc chân thành.", "options": ["A. Vấn đề rõ, lí lẽ chặt, dẫn chứng thực tế, cảm xúc chân thành", "B. Thật dài", "C. Thật khó hiểu", "D. Nhiều từ ngữ hoa mĩ"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Ý chí vươn lên là sức mạnh giúp con người vượt qua khó khăn. Nhiều tấm gương học sinh nghèo vượt khó đã chứng minh: hoàn cảnh không quyết định tương lai, ý chí mới quyết định.”\nTheo đoạn văn, điều gì quyết định tương lai?", "explain": "Đoạn văn khẳng định ý chí vươn lên chứ không phải hoàn cảnh quyết định tương lai.", "options": ["A. Hoàn cảnh giàu nghèo", "B. Ý chí vươn lên của con người", "C. May mắn", "D. Ngoại hình"], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Đọc văn bản thông tin, em cần phân biệt thông tin và ý kiến. Thông tin là sự thật, số liệu; ý kiến là nhận định, đánh giá của tác giả. Nhầm lẫn hai thứ dễ dẫn đến hiểu sai.”\nXét tính đúng sai:", "statements": ["a) Cần phân biệt thông tin và ý kiến khi đọc.", "b) Thông tin là sự thật, số liệu.", "c) Ý kiến cũng là sự thật khách quan."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – ý kiến là nhận định chủ quan của tác giả."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Ngày mai của đất nước bắt đầu từ lớp học hôm nay: mỗi bài học thuộc, mỗi việc tốt làm được đều là một viên gạch xây tương lai.”\nHình ảnh “viên gạch xây tương lai” có ý nghĩa gì?", "explain": "Hình ảnh ví von: việc làm hôm nay như viên gạch góp phần xây nên tương lai.", "options": ["A. Xây nhà cần gạch", "B. Tương lai xa vời", "C. Mỗi việc làm hôm nay đều góp phần tạo nên tương lai", "D. Học tập vô ích"], "answer": "C"}, {"type": "short", "level": "VD", "q": "Nêu một tấm gương người tốt việc tốt ở địa phương em và bài học rút ra.", "answer": "Học sinh tự nêu tấm gương cụ thể và bài học (sống nhân ái, có trách nhiệm...).", "explain": "Chấm theo ý: tấm gương cụ thể, bài học rõ ràng, chân thành."}, {"type": "short", "level": "VD", "q": "Viết 2 – 3 câu bày tỏ quyết tâm của em trước một vấn đề xã hội.", "answer": "Học sinh tự viết (ví dụ: quyết tâm bảo vệ môi trường, nói không với thuốc lá...).", "explain": "Chấm theo ý: câu văn hoàn chỉnh, quyết tâm rõ ràng, chân thành."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Văn bản thông tin khác văn bản nghệ thuật ở điểm nào?", "explain": "Văn bản thông tin cung cấp tri thức bằng ngôn ngữ chính xác, không hư cấu.", "options": ["A. Dài hơn", "B. Ngắn hơn", "C. Không khác", "D. Mục đích cung cấp tri thức, ngôn ngữ chính xác, không hư cấu"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Sự kết hợp giữa thông tin và nghị luận trong “Ôn dịch, thuốc lá” tạo hiệu quả gì?", "explain": "Kết hợp thông tin và nghị luận giúp văn bản vừa giàu tri thức vừa thuyết phục.", "options": ["A. Vừa cung cấp tri thức, vừa thuyết phục, kêu gọi hành động", "B. Gây nhàm chán", "C. Khó hiểu", "D. Mâu thuẫn"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Thông điệp chính của Bài 9 là gì?", "explain": "Bài 9 nhắn nhủ: hiểu vấn đề hôm nay để sống có trách nhiệm với ngày mai.", "options": ["A. Chỉ lo cho bản thân", "B. Nhận diện vấn đề xã hội hôm nay và sống có trách nhiệm với ngày mai", "C. Sống hưởng thụ", "D. Không cần quan tâm tương lai"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Kĩ năng quan trọng nhất khi làm bài nghị luận xã hội là gì?", "explain": "Lập dàn ý rõ ràng giúp bài viết đủ ý, mạch lạc, không lạc đề.", "options": ["A. Viết thật nhanh", "B. Chép văn mẫu", "C. Lập dàn ý rõ ràng trước khi viết", "D. Đoán đề"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Đọc nhiều văn bản thông tin giúp em điều gì?", "explain": "Đọc văn bản thông tin mở rộng hiểu biết và rèn tư duy phản biện.", "options": ["A. Mất thời gian", "B. Nhàm chán", "C. Không ích gì", "D. Mở rộng hiểu biết, rèn tư duy phản biện"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Hôm nay và ngày mai không phải là hai thế giới riêng biệt. Hôm nay ta gieo hạt, ngày mai ta gặt quả – đó là quy luật giản dị mà sâu sắc của cuộc sống.”\nTheo đoạn văn, mối quan hệ giữa hôm nay và ngày mai là gì?", "explain": "Hôm nay và ngày mai gắn bó theo quy luật nhân quả.", "options": ["A. Gắn bó nhân quả: hôm nay gieo gì, ngày mai gặt nấy", "B. Hoàn toàn tách biệt", "C. Ngày mai không liên quan hôm nay", "D. Không có quy luật"], "answer": "A"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Bài 9 đã giúp em: nhận diện văn bản thông tin, hiểu văn bản “Ôn dịch, thuốc lá”, nắm cách viết nghị luận xã hội và ý thức trách nhiệm với hôm nay và ngày mai.”\nXét tính đúng sai:", "statements": ["a) Bài 9 dạy về văn bản thông tin.", "b) Bài 9 hướng dẫn viết nghị luận xã hội.", "c) Bài 9 không đề cập đến trách nhiệm với tương lai."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – bài 9 nhấn mạnh trách nhiệm với ngày mai."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Một xã hội tốt đẹp không tự nhiên mà có. Nó được xây nên từ những con người biết quan tâm, biết chia sẻ và dám hành động vì điều đúng đắn – bắt đầu từ chính bạn, ngay hôm nay.”\nĐoạn văn kêu gọi điều gì?", "explain": "Đoạn văn kêu gọi mỗi người hành động từ hôm nay vì xã hội tốt đẹp.", "options": ["A. Chờ xã hội tốt đẹp tự đến", "B. Mỗi người hãy quan tâm, chia sẻ và hành động vì điều đúng đắn", "C. Chỉ lo cho bản thân", "D. Phê phán người khác"], "answer": "B"}, {"type": "short", "level": "VD", "q": "Tóm tắt những kiến thức chính của Bài 9.", "answer": "Văn bản thông tin (đặc điểm, cách đọc); “Ôn dịch, thuốc lá”; nghị luận xã hội (2 dạng, dàn ý, cách viết); trách nhiệm với hôm nay và ngày mai.", "explain": "Chấm theo ý: nêu được các nội dung trọng tâm của bài học."}, {"type": "short", "level": "VD", "q": "Sau khi học Bài 9, em sẽ thay đổi điều gì trong lối sống của mình? Vì sao?", "answer": "Học sinh tự nêu thay đổi cụ thể (ví dụ: bỏ rác đúng nơi, dùng mạng văn minh...) và lí do.", "explain": "Chấm theo ý: thay đổi cụ thể, lí do hợp lí, chân thành."}]}]}
