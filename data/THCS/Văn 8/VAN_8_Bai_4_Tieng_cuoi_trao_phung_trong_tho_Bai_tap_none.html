{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Thơ trào phúng là dòng thơ dùng tiếng cười để làm gì?", "options": ["A. Phê phán, châm biếm thói hư tật xấu trong xã hội", "B. Ca ngợi vẻ đẹp thiên nhiên", "C. Bày tỏ tình yêu quê hương đất nước", "D. Kể lại các câu chuyện cổ tích"], "answer": "A", "explain": "Thơ trào phúng lấy tiếng cười làm vũ khí phê phán cái xấu, cái lố."}, {"type": "mcq", "level": "NB", "q": "Cụm từ “cười ra nước mắt” diễn tả tiếng cười như thế nào?", "options": ["A. Tiếng cười vô tư, hồn nhiên", "B. Vừa cười vừa xót xa, đau đớn cho thân phận con người", "C. Tiếng cười giòn giã khi xem hài kịch", "D. Tiếng cười của trẻ thơ"], "answer": "B", "explain": "“Cười ra nước mắt”: đằng sau tiếng cười là nỗi xót xa, đau đớn."}, {"type": "mcq", "level": "TH", "q": "Thủ pháp phóng đại trong thơ trào phúng có tác dụng gì?", "options": ["A. Làm cho câu thơ thêm dài", "B. Thổi phồng cái lố để lộ rõ bản chất xấu xa, gây cười", "C. Che giấu đối tượng bị châm biếm", "D. Làm cho bài thơ trở nên trữ tình"], "answer": "C", "explain": "Phóng đại thổi phồng cái lố lên nhiều lần khiến ai cũng nhìn thấy bản chất."}, {"type": "mcq", "level": "NB", "q": "Trần Tế Xương thường được gọi bằng tên nào?", "options": ["A. Tam nguyên Yên Đổ", "B. Bà chúa thơ Nôm", "C. Ông đồ Nghệ", "D. Tú Xương"], "answer": "D", "explain": "Trần Tế Xương (1870–1907) được gọi là Tú Xương."}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa thơ trào phúng và thơ trữ tình là gì?", "options": ["A. Trào phúng hướng tới cái xấu để phê phán; trữ tình hướng tới cái đẹp để bày tỏ cảm xúc", "B. Trào phúng luôn viết bằng chữ Hán; trữ tình viết bằng chữ Nôm", "C. Trào phúng không có vần; trữ tình có vần", "D. Hai dòng thơ hoàn toàn giống nhau"], "answer": "A", "explain": "Trào phúng: đối tượng là cái xấu, mục đích phê phán; trữ tình: đối tượng là cái đẹp, mục đích bày tỏ cảm xúc."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác t", "level": "TH", "q": "Nêu một điểm khác nhau giữa thơ trào phúng và thơ trữ tình.", "answer": "Thơ trào phúng hướng tới cái xấu để phê phán bằng tiếng cười; thơ trữ tình hướng tới cái đẹp để bày tỏ cảm xúc. (Chấp nhận các cách diễn đạt tương đương.)", "explain": "Chấm theo ý: chỉ ra được sự khác nhau ở đối tượng hoặc mục đích."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "TH", "q": "Câu nào dưới đây là ví dụ của lối “nói ngược” (nói mát)?", "options": ["A. Anh ấy học rất chăm chỉ", "B. Gọi kẻ lười biếng là “chuyên gia nghỉ ngơi”", "C. Hôm nay trời đẹp quá", "D. Bạn ấy hát hay thật"], "answer": "C", "explain": "“Chuyên gia nghỉ ngơi” là khen mà thực ra chê kẻ lười — đúng lối nói ngược."}, {"type": "mcq", "level": "NB", "q": "Thủ pháp đối lập trong thơ trào phúng là gì?", "options": ["A. Đặt cạnh nhau hai sự vật, hành động trái ngược nhau", "B. Lặp lại một từ nhiều lần", "C. Dùng toàn từ Hán Việt", "D. Viết câu thật dài"], "answer": "D", "explain": "Đối lập đặt cái tốt cạnh cái xấu, lời nói cạnh việc làm để gây cười, tố cáo."}, {"type": "mcq", "level": "NB", "q": "Giọng điệu thơ trào phúng của Trần Tế Xương (Tú Xương) là gì?", "options": ["A. Ngọt ngào, tha thiết", "B. Chua chát, trực diện", "C. Kín đáo, thâm thúy", "D. Táo bạo, chơi chữ"], "answer": "A", "explain": "Thơ Tú Xương châm biếm trực diện, giọng chua chát."}, {"type": "mcq", "level": "TH", "q": "Vì sao nói tiếng cười trào phúng là một thứ “vũ khí”?", "options": ["A. Vì nó làm người đọc sợ hãi", "B. Vì nó dùng để phê phán, đấu tranh loại bỏ cái xấu", "C. Vì nó rất ồn ào", "D. Vì nó chỉ dành cho người lớn"], "answer": "B", "explain": "Tiếng cười trào phúng tấn công cái xấu nên được ví như vũ khí đấu tranh."}, {"type": "mcq", "level": "NB", "q": "Thơ Hồ Xuân Hương nổi bật ở điểm nào?", "options": ["A. Chỉ viết về thiên nhiên", "B. Chơi chữ, nói lái; “tục mà thanh”", "C. Luôn ca ngợi vua quan", "D. Không bao giờ châm biếm ai"], "answer": "C", "explain": "Hồ Xuân Hương giỏi chơi chữ, nói lái, ngôn ngữ táo bạo mà tục mà thanh."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Sách dày cộp chữ chi chít, / Thuộc lòng vanh vách, hỏi thì ngẩn ngơ. / Thầy rằng: “Sao chẳng hiểu gì?” / Trò rằng: “Con vẹt cũng thì như con!”” Đoạn thơ trên châm biếm hiện tượng nào trong học tập?", "options": ["A. Học vẹt: thuộc lòng mà không hiểu bài", "B. Học nhóm hiệu quả", "C. Tự học chăm chỉ", "D. Học đi đôi với hành"], "answer": "A", "explain": "“Thuộc lòng vanh vách, hỏi thì ngẩn ngơ” — châm biếm lối học vẹt."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Sách dày cộp chữ chi chít, / Thuộc lòng vanh vách, hỏi thì ngẩn ngơ. / Thầy rằng: “Sao chẳng hiểu gì?” / Trò rằng: “Con vẹt cũng thì như con!”” Câu kết “Con vẹt cũng thì như con!” có tác dụng gì?", "options": ["A. Khen học trò thông minh", "B. An ủi học trò", "C. Kể về con vật nuôi", "D. So sánh học trò học vẹt với con vẹt chỉ biết nhại lời — đầy mỉa mai"], "answer": "D", "explain": "So sánh học trò với con vẹt là lối châm biếm sâu cay thói học vẹt."}, {"type": "truefalse", "level": "VD", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Sách dày cộp chữ chi chít, / Thuộc lòng vanh vách, hỏi thì ngẩn ngơ. / Thầy rằng: “Sao chẳng hiểu gì?” / Trò rằng: “Con vẹt cũng thì như con!”” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Đoạn thơ sử dụng thủ pháp phóng đại ở hình ảnh “sách dày cộp”.", "b) Đoạn thơ ca ngợi phương pháp học thuộc lòng.", "c) Thông điệp của đoạn thơ: cần học hiểu bản chất, tránh học vẹt."], "answers": ["T", "S", "T"], "explain": "a đúng (thổi phồng); b sai (châm biếm học vẹt); c đúng (thông điệp rõ ràng)."}, {"type": "short", "level": "VD", "q": "Giải thích lối “nói ngược” (nói mát) và tự đặt một ví dụ.", "answer": "Nói ngược: khen mà thực ra chê, ca ngợi mà mỉa mai. Ví dụ: gọi kẻ lười biếng là “chuyên gia nghỉ ngơi”; gọi kẻ hay khoe là “nhà vô địch kể chuyện”.", "explain": "Chấm theo ý: giải thích đúng; ví dụ thể hiện được “khen mà chê”."}, {"type": "short", "level": "TH", "q": "Kể tên ba tác giả thơ trào phúng tiêu biểu đã học cùng danh xưng của mỗi người.", "answer": "Trần Tế Xương – Tú Xương; Nguyễn Khuyến – Tam nguyên Yên Đổ; Hồ Xuân Hương – Bà chúa thơ Nôm.", "explain": "Chấm theo ý: đúng tên và danh xưng tương ứng."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Dòng nào nêu đúng đặc điểm của thơ trữ tình?", "options": ["A. Dùng tiếng cười để phê phán", "B. Bày tỏ cảm xúc trước cái đẹp: thiên nhiên, tình yêu, quê hương", "C. Chỉ trích thói hư tật xấu", "D. Dùng lối nói ngược để mỉa mai"], "answer": "D", "explain": "Thơ trữ tình bày tỏ, sẻ chia cảm xúc trước cái đẹp."}, {"type": "mcq", "level": "NB", "q": "Tác giả nào sau đây KHÔNG thuộc dòng thơ trào phúng tiêu biểu đã học?", "options": ["A. Trần Tế Xương", "B. Nguyễn Khuyến", "C. Hồ Xuân Hương", "D. Nguyễn Du"], "answer": "A", "explain": "Nguyễn Du là tác giả Truyện Kiều (trữ tình, tự sự), không phải thơ trào phúng."}, {"type": "mcq", "level": "TH", "q": "Thủ pháp phóng đại khác thủ pháp đối lập ở điểm nào?", "options": ["A. Phóng đại thổi phồng một đối tượng; đối lập đặt hai đối tượng trái ngược cạnh nhau", "B. Phóng đại chỉ dùng trong văn xuôi", "C. Đối lập không gây cười", "D. Hai thủ pháp giống hệt nhau"], "answer": "B", "explain": "Phóng đại: thổi phồng một cái lố; đối lập: đặt hai cái trái ngược cạnh nhau."}, {"type": "mcq", "level": "NB", "q": "Thơ trào phúng của Nguyễn Khuyến có giọng điệu như thế nào?", "options": ["A. Ồn ào, trực diện", "B. Kín đáo, thâm thúy", "C. Ngọt ngào, lãng mạn", "D. Bi lụy, sầu thảm"], "answer": "C", "explain": "Nguyễn Khuyến cười mỉa kín đáo, thâm thúy."}, {"type": "mcq", "level": "NB", "q": "Từ “trào phúng” gần nghĩa nhất với từ nào?", "options": ["A. Ngợi ca", "B. Châm biếm, phê phán bằng tiếng cười", "C. Tả cảnh", "D. Tự sự"], "answer": "D", "explain": "Trào phúng là dùng tiếng cười để châm biếm, phê phán."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Mâm cỗ vừa dọn ra, anh Béo đã nhanh tay gắp liền ba miếng thịt to nhất bỏ vào bát mình, miệng nhai nhồm nhoàm, mắt vẫn đảo quanh mâm như sợ ai tranh mất. Bà chủ nhà cười gượng: “Ăn từ từ cháu ơi, còn nhiều mà.” Anh đáp tỉnh bơ: “Cháu ăn nhanh để còn... khen ngon ạ!”” Nhân vật anh Béo trong đoạn văn bị châm biếm về thói xấu nào?", "options": ["A. Chăm chỉ làm việc", "B. Tiết kiệm", "C. Tham ăn, vô ý tứ", "D. Lễ phép"], "answer": "C", "explain": "Gắp ba miếng to nhất, nhai nhồm nhoàm, mắt đảo quanh mâm — thói tham ăn."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Mâm cỗ vừa dọn ra, anh Béo đã nhanh tay gắp liền ba miếng thịt to nhất bỏ vào bát mình, miệng nhai nhồm nhoàm, mắt vẫn đảo quanh mâm như sợ ai tranh mất. Bà chủ nhà cười gượng: “Ăn từ từ cháu ơi, còn nhiều mà.” Anh đáp tỉnh bơ: “Cháu ăn nhanh để còn... khen ngon ạ!”” Câu nói “Cháu ăn nhanh để còn... khen ngon ạ!” thuộc lối nói nào?", "options": ["A. Nói ngược: ngụy biện hài hước để che thói tham ăn", "B. Nói thật thà", "C. Nói lắp", "D. Nói nhỏ nhẹ"], "answer": "A", "explain": "Lấy cớ “ăn nhanh để khen ngon” là ngụy biện hài hước, đầy mỉa mai."}, {"type": "truefalse", "level": "VD", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Mâm cỗ vừa dọn ra, anh Béo đã nhanh tay gắp liền ba miếng thịt to nhất bỏ vào bát mình, miệng nhai nhồm nhoàm, mắt vẫn đảo quanh mâm như sợ ai tranh mất. Bà chủ nhà cười gượng: “Ăn từ từ cháu ơi, còn nhiều mà.” Anh đáp tỉnh bơ: “Cháu ăn nhanh để còn... khen ngon ạ!”” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Chi tiết “mắt vẫn đảo quanh mâm” khắc họa sinh động thói tham ăn.", "b) Bà chủ nhà thực sự khen anh Béo ăn khỏe.", "c) Đoạn văn phê phán thói tham ăn, thiếu ý tứ nơi đông người."], "answers": ["T", "S", "T"], "explain": "a đúng; b sai (“cười gượng” cho thấy bà không hài lòng); c đúng."}, {"type": "short", "level": "TH", "q": "Vì sao người ta ví tiếng cười trào phúng như một thứ “vũ khí”?", "answer": "Vì tiếng cười trào phúng dùng để tấn công, phê phán cái xấu, góp phần loại bỏ thói hư tật xấu trong xã hội.", "explain": "Chấm theo ý: nêu được chức năng đấu tranh, phê phán của tiếng cười."}, {"type": "short", "level": "VD", "q": "Trình bày ngắn gọn đối tượng châm biếm và giọng điệu thơ trào phúng của Trần Tế Xương.", "answer": "Đối tượng: bọn quan trường thối nát, thói hư tật xấu đương thời. Giọng điệu: chua chát, trực diện, có khi tục mà thật.", "explain": "Chấm theo ý: nêu được đối tượng và giọng điệu cơ bản."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Mục đích chính của tiếng cười trong thơ trào phúng là gì?", "options": ["A. Mua vui, giải trí đơn thuần", "B. Phê phán cái xấu để loại bỏ nó", "C. Khoe tài văn chương", "D. Ru ngủ người đọc"], "answer": "A", "explain": "Tiếng cười trào phúng có mục đích: phê phán và loại bỏ cái xấu."}, {"type": "mcq", "level": "TH", "q": "Câu “Thi không ăn ớt thế mà cay” của Tú Xương thể hiện sắc thái cười nào?", "options": ["A. Cười hồn nhiên", "B. Cười ra nước mắt", "C. Cười sảng khoái", "D. Cười vui vẻ"], "answer": "D", "explain": "Câu thơ chua chát: cười mà đắng — “cười ra nước mắt”."}, {"type": "mcq", "level": "TH", "q": "Khi đọc một bài thơ trào phúng, việc đầu tiên cần xác định là gì?", "options": ["A. Số lượng chữ trong bài", "B. Nhà thơ đang cười ai, cười cái gì (đối tượng châm biếm)", "C. Năm sinh của tác giả", "D. Bài thơ có bao nhiêu khổ"], "answer": "C", "explain": "Đọc thơ trào phúng trước hết phải tìm đối tượng bị cười."}, {"type": "mcq", "level": "NB", "q": "Thơ trào phúng thường sử dụng loại từ ngữ nào?", "options": ["A. Từ ngữ dân gian, khẩu ngữ đời thường", "B. Toàn từ Hán Việt cao sang", "C. Từ ngữ chuyên ngành khoa học", "D. Từ ngữ nước ngoài"], "answer": "B", "explain": "Thơ trào phúng hay dùng từ ngữ dân gian, khẩu ngữ để tăng tính hài hước."}, {"type": "mcq", "level": "NB", "q": "Hồ Xuân Hương châm biếm chủ yếu đối tượng nào?", "options": ["A. Thiên nhiên", "B. Lễ giáo phong kiến hà khắc", "C. Trẻ em", "D. Người nước ngoài"], "answer": "A", "explain": "Thơ bà châm biếm lễ giáo phong kiến, bênh vực người phụ nữ."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Đồng hồ reo, chăn vẫn ôm, / Mẹ gọi ba lượt, mắt còn lim dim. / Bài tập để đó “tính sau”, / Điện thoại thì mở từ đầu tới khuya!” Đoạn thơ trên châm biếm thói xấu nào?", "options": ["A. Thói chăm chỉ", "B. Thói tiết kiệm", "C. Thói dũng cảm", "D. Thói lười biếng, ham chơi điện thoại, chểnh mảng học tập"], "answer": "D", "explain": "Ngủ nướng, bài tập để “tính sau”, điện thoại mở tới khuya — thói lười biếng."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Đồng hồ reo, chăn vẫn ôm, / Mẹ gọi ba lượt, mắt còn lim dim. / Bài tập để đó “tính sau”, / Điện thoại thì mở từ đầu tới khuya!” Thủ pháp nghệ thuật nổi bật trong đoạn thơ là gì?", "options": ["A. Nhân hóa", "B. Đối lập giữa việc học bị bỏ bê và việc chơi điện thoại say sưa", "C. So sánh", "D. Ẩn dụ"], "answer": "B", "explain": "Bài tập “tính sau” đối lập với điện thoại “mở từ đầu tới khuya”."}, {"type": "truefalse", "level": "VD", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Đồng hồ reo, chăn vẫn ôm, / Mẹ gọi ba lượt, mắt còn lim dim. / Bài tập để đó “tính sau”, / Điện thoại thì mở từ đầu tới khuya!” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Đoạn thơ phản ánh thực trạng một bộ phận học sinh ham chơi, lười học.", "b) Tác giả đồng tình với lối sống của nhân vật.", "c) Đoạn thơ nhắc nhở học sinh cân bằng giữa học tập và giải trí."], "answers": ["T", "S", "T"], "explain": "a đúng; b sai (châm biếm nên không đồng tình); c đúng (thông điệp)."}, {"type": "short", "level": "VD", "q": "Hồ Xuân Hương được mệnh danh là gì? Nêu hai đặc điểm nghệ thuật thơ trào phúng của bà.", "answer": "Bà chúa thơ Nôm. Đặc điểm: giỏi chơi chữ, nói lái; ngôn ngữ táo bạo mà “tục mà thanh”; thơ vừa trào phúng vừa trữ tình.", "explain": "Chấm theo ý: đúng danh xưng; nêu được ít nhất 1-2 đặc điểm."}, {"type": "short", "level": "TH", "q": "Nêu hai đối tượng châm biếm thường gặp trong thơ trào phúng và cho ví dụ minh họa.", "answer": "Kẻ nịnh bợ, dối trá; thói khoe khoang, lười biếng; quan tham; lễ giáo lạc hậu... (chấp nhận ví dụ hợp lý).", "explain": "Chấm theo ý: nêu được 2 đối tượng kèm ví dụ phù hợp."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Nhận định nào đúng về mối quan hệ giữa trào phúng và trữ tình?", "options": ["A. Hai dòng thơ hoàn toàn tách biệt, không bao giờ gặp nhau", "B. Ranh giới không tuyệt đối; có bài thơ vừa trào phúng vừa trữ tình", "C. Thơ trào phúng là một loại của thơ trữ tình", "D. Thơ trữ tình nào cũng là thơ trào phúng"], "answer": "B", "explain": "Ví dụ thơ Hồ Xuân Hương vừa trào phúng vừa trữ tình; ranh giới không tuyệt đối."}, {"type": "mcq", "level": "NB", "q": "“Phê phán” trong thơ trào phúng nghĩa là gì?", "options": ["A. Vạch trần, lên án cái xấu một cách trực diện", "B. Khen ngợi", "C. Tha thứ", "D. Quên đi"], "answer": "A", "explain": "Phê phán là vạch trần cái xấu trực diện, không khoan nhượng."}, {"type": "mcq", "level": "TH", "q": "Để viết đoạn văn cảm nhận về tiếng cười trào phúng, em KHÔNG nên làm gì?", "options": ["A. Chỉ ra đối tượng bị châm biếm", "B. Phân tích thủ pháp nghệ thuật với dẫn chứng", "C. Chép lại nguyên bài thơ thay cho phân tích", "D. Nêu thái độ của tác giả và suy nghĩ của bản thân"], "answer": "D", "explain": "Cảm nhận cần phân tích, không chép lại bài thơ."}, {"type": "mcq", "level": "NB", "q": "Trần Tế Xương sống vào thời kì nào?", "options": ["A. Đầu thế kỉ XX (1870–1907)", "B. Thời Lý – Trần", "C. Thời hiện đại sau 1975", "D. Thời Hùng Vương"], "answer": "C", "explain": "Tú Xương (1870–1907) sống cuối thế kỉ XIX – đầu thế kỉ XX."}, {"type": "mcq", "level": "TH", "q": "Tiếng cười châm biếm khác tiếng cười phê phán ở điểm nào?", "options": ["A. Châm biếm mỉa mai, sâu cay, kín đáo hơn; phê phán vạch trần trực diện", "B. Châm biếm không có mục đích", "C. Phê phán nhẹ nhàng hơn châm biếm", "D. Hai loại cười giống hệt nhau"], "answer": "B", "explain": "Châm biếm: mỉa mai sâu cay, kín đáo; phê phán: vạch trần trực diện."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Thấy thầy giáo bước vào, Tèo vội đứng dậy kéo ghế, miệng rối rít: “Thầy ngồi ạ, thầy giảng bài nào cũng hay tuyệt!” Thầy vừa quay đi, Tèo nháy mắt với bạn: “Nịnh một câu, mai kiểm tra thầy nương tay!”” Hành động của Tèo trong đoạn văn đáng chê ở điểm nào?", "options": ["A. Lễ phép với thầy", "B. Nịnh hót giả tạo để mong được nương tay khi kiểm tra", "C. Chăm học", "D. Giúp đỡ bạn bè"], "answer": "B", "explain": "Tèo nịnh thầy rồi thú nhận “nịnh một câu” để thầy nương tay — nịnh hót giả tạo."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Thấy thầy giáo bước vào, Tèo vội đứng dậy kéo ghế, miệng rối rít: “Thầy ngồi ạ, thầy giảng bài nào cũng hay tuyệt!” Thầy vừa quay đi, Tèo nháy mắt với bạn: “Nịnh một câu, mai kiểm tra thầy nương tay!”” Chi tiết “nháy mắt với bạn” có tác dụng gì?", "options": ["A. Vạch trần sự giả dối: lời nịnh trước mặt khác hẳn ý nghĩ sau lưng", "B. Cho thấy Tèo bị đau mắt", "C. Tả Tèo vui vẻ", "D. Không có tác dụng gì"], "answer": "A", "explain": "Cái nháy mắt tố cáo lời nịnh chỉ là giả tạo — thủ pháp đối lập trước mặt/sau lưng."}, {"type": "truefalse", "level": "VD", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Thấy thầy giáo bước vào, Tèo vội đứng dậy kéo ghế, miệng rối rít: “Thầy ngồi ạ, thầy giảng bài nào cũng hay tuyệt!” Thầy vừa quay đi, Tèo nháy mắt với bạn: “Nịnh một câu, mai kiểm tra thầy nương tay!”” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Đoạn văn châm biếm thói nịnh hót trong học đường.", "b) Tèo thực sự ngưỡng mộ tài giảng dạy của thầy.", "c) Thông điệp: cần chân thành, không nên nịnh bợ, giả dối."], "answers": ["T", "S", "T"], "explain": "a đúng; b sai (chính Tèo thừa nhận chỉ nịnh để được nương tay); c đúng."}, {"type": "short", "level": "TH", "q": "Thủ pháp phóng đại có tác dụng gì trong thơ trào phúng? Cho một ví dụ tự đặt.", "answer": "Thổi phồng cái lố lên nhiều lần để lộ rõ bản chất xấu xa, gây cười. Ví dụ: “Tiếng ngáy của anh vang đến mức cả xóm phải bịt tai.”", "explain": "Chấm theo ý: nêu đúng tác dụng; ví dụ thể hiện sự thổi phồng."}, {"type": "short", "level": "VD", "q": "So sánh giọng điệu thơ trào phúng của Trần Tế Xương và Nguyễn Khuyến.", "answer": "Tú Xương: chua chát, trực diện, vạch trần thẳng mặt. Nguyễn Khuyến: kín đáo, thâm thúy, mỉa mai nhẹ nhàng mà sâu cay.", "explain": "Chấm theo ý: phân biệt được trực diện với kín đáo thâm thúy."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyễn Khuyến sau khi cáo quan đã làm gì?", "options": ["A. Ra làm quan to hơn", "B. Về quê ở ẩn và sáng tác thơ", "C. Đi du học nước ngoài", "D. Bỏ văn chương"], "answer": "C", "explain": "Nguyễn Khuyến cáo quan về quê ở ẩn, viết thơ trào phúng thâm thúy."}, {"type": "mcq", "level": "TH", "q": "Cụm từ “tục mà thanh” khi nói về thơ Hồ Xuân Hương có nghĩa là gì?", "options": ["A. Thơ viết về chuyện tầm thường", "B. Dùng từ ngữ táo bạo, dân dã nhưng ý thơ thanh cao, sâu sắc", "C. Thơ không có giá trị", "D. Thơ chỉ dành cho người lớn tuổi"], "answer": "B", "explain": "“Tục mà thanh”: lời lẽ dân dã táo bạo mà ý tứ thanh cao."}, {"type": "mcq", "level": "NB", "q": "Đối tượng nào sau đây phù hợp để thơ trào phúng châm biếm?", "options": ["A. Người nông dân cần cù", "B. Kẻ nịnh bợ, dối trá", "C. Em bé ngoan", "D. Cảnh bình minh đẹp"], "answer": "A", "explain": "Thơ trào phúng nhắm vào thói hư tật xấu như nịnh bợ, dối trá."}, {"type": "mcq", "level": "TH", "q": "Thủ pháp nào được dùng khi nhà thơ gọi kẻ dốt nát là “bậc thầy phát biểu”?", "options": ["A. Phóng đại", "B. Đối lập", "C. Nói ngược (nói mát)", "D. So sánh"], "answer": "D", "explain": "Khen mà chê chính là lối nói ngược (nói mát)."}, {"type": "mcq", "level": "NB", "q": "Hồ Xuân Hương sáng tác chủ yếu bằng chữ gì?", "options": ["A. Chữ Hán", "B. Chữ Nôm", "C. Chữ Quốc ngữ", "D. Chữ Pháp"], "answer": "C", "explain": "Bà nổi tiếng với thơ Nôm nên được gọi là Bà chúa thơ Nôm."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Bạn vay năm nghìn mua cơm, / Anh lắc đầu bảo: “Tớ còn... âm tiền!” / Chiều thấy quán xá linh đình, / Anh bao cả nhóm, riêng mình... trả sau!” Đoạn thơ trên châm biếm thói xấu nào?", "options": ["A. Thói hào phóng", "B. Thói chăm chỉ", "C. Thói keo kiệt giả vờ nghèo nhưng lại thích khoe khoang bao bạn bè", "D. Thói thật thà"], "answer": "C", "explain": "Không cho bạn vay 5 nghìn vì “âm tiền” nhưng lại bao cả nhóm — keo kiệt giả tạo, thích khoe."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Bạn vay năm nghìn mua cơm, / Anh lắc đầu bảo: “Tớ còn... âm tiền!” / Chiều thấy quán xá linh đình, / Anh bao cả nhóm, riêng mình... trả sau!” Thủ pháp nghệ thuật chính trong đoạn thơ là gì?", "options": ["A. Nhân hóa", "B. So sánh", "C. Ẩn dụ", "D. Đối lập giữa keo kiệt với bạn và hào phóng khoe mẽ nơi đông người"], "answer": "D", "explain": "Từ chối 5 nghìn đối lập với bao cả nhóm — đối lập gây cười."}, {"type": "truefalse", "level": "VD", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Bạn vay năm nghìn mua cơm, / Anh lắc đầu bảo: “Tớ còn... âm tiền!” / Chiều thấy quán xá linh đình, / Anh bao cả nhóm, riêng mình... trả sau!” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Nhân vật “âm tiền” là thật sự hết tiền.", "b) Đoạn thơ châm biếm lối sống giả tạo, khoe mẽ.", "c) Cụm từ “riêng mình... trả sau!” đầy mỉa mai."], "answers": ["S", "T", "T"], "explain": "a sai (chiều vẫn bao cả nhóm nên “âm tiền” là nói dối); b, c đúng."}, {"type": "short", "level": "VD", "q": "Tự sáng tác hai câu thơ (lục bát hoặc tự do) châm biếm thói khoe khoang.", "answer": "Ví dụ: “Miệng khoe học giỏi nhất làng, / Bảng điểm vừa dán, cả làng cùng xem.” (Chấp nhận mọi sáng tác thể hiện được ý châm biếm thói khoe khoang.)", "explain": "Chấm theo ý: đúng thể thơ tương đối; có đối tượng châm biếm rõ ràng là thói khoe khoang."}, {"type": "short", "level": "TH", "q": "Khi viết đoạn văn cảm nhận về tiếng cười trào phúng, em nên triển khai theo dàn ý nào?", "answer": "Giới thiệu bài thơ, tác giả → chỉ ra đối tượng châm biếm → phân tích thủ pháp tiêu biểu kèm dẫn chứng → nêu thái độ tác giả và suy nghĩ bản thân.", "explain": "Chấm theo ý: đủ 4 bước cơ bản của dàn ý."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "Câu nào sau đây thể hiện thủ pháp phóng đại?", "options": ["A. Anh ấy cao lớn", "B. Tiếng ngáy của anh vang đến mức cả xóm phải bịt tai", "C. Hôm nay trời mưa", "D. Cô ấy hát hay"], "answer": "D", "explain": "“Vang đến mức cả xóm phải bịt tai” là thổi phồng quá mức — phóng đại."}, {"type": "mcq", "level": "NB", "q": "Thơ trữ tình có cảm xúc chủ đạo nào?", "options": ["A. Mỉa mai, phẫn nộ", "B. Yêu thương, nhớ nhung, ngợi ca cái đẹp", "C. Chua chát", "D. Khinh bỉ"], "answer": "C", "explain": "Thơ trữ tình bày tỏ cảm xúc yêu thương, ngợi ca trước cái đẹp."}, {"type": "mcq", "level": "TH", "q": "Vì sao thơ trào phúng hay dùng từ ngữ dân gian, khẩu ngữ?", "options": ["A. Vì nhà thơ không biết từ Hán Việt", "B. Để gần gũi, hóm hỉnh và tăng tính hài hước", "C. Vì quy định của thể thơ", "D. Để bài thơ khó hiểu hơn"], "answer": "B", "explain": "Từ ngữ dân gian, khẩu ngữ tạo sự hóm hỉnh, gần gũi, dễ gây cười."}, {"type": "mcq", "level": "NB", "q": "Ai là tác giả có giọng thơ trào phúng “kín đáo, thâm thúy”?", "options": ["A. Trần Tế Xương", "B. Nguyễn Khuyến", "C. Hồ Xuân Hương", "D. Nguyễn Trãi"], "answer": "A", "explain": "Nguyễn Khuyến: kín đáo, thâm thúy (khác Tú Xương trực diện)."}, {"type": "mcq", "level": "NB", "q": "Thơ trào phúng ra đời nhằm mục đích gì?", "options": ["A. Giải trí đơn thuần", "B. Dùng tiếng cười đấu tranh với cái xấu", "C. Ghi chép lịch sử", "D. Dạy ngoại ngữ"], "answer": "D", "explain": "Thơ trào phúng dùng tiếng cười làm vũ khí đấu tranh với cái xấu."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Chị Lan đi du học về được một tháng mà gặp ai cũng chêm tiếng Anh vào câu chuyện: “Cái này very đẹp, cái kia so cute!” Mẹ chị nhắc: “Nói tiếng Việt cho rõ con ơi.” Chị bĩu môi: “Mẹ quê quá, thời này ai còn nói... thuần Việt!”” Đoạn văn trên châm biếm hiện tượng nào?", "options": ["A. Sính ngoại: lạm dụng tiếng Anh để tỏ ra sành điệu, coi thường tiếng Việt", "B. Học giỏi ngoại ngữ", "C. Yêu tiếng Việt", "D. Khiêm tốn"], "answer": "A", "explain": "Chêm tiếng Anh vô tội vạ, chê mẹ “quê” — thói sính ngoại đáng chê."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Chị Lan đi du học về được một tháng mà gặp ai cũng chêm tiếng Anh vào câu chuyện: “Cái này very đẹp, cái kia so cute!” Mẹ chị nhắc: “Nói tiếng Việt cho rõ con ơi.” Chị bĩu môi: “Mẹ quê quá, thời này ai còn nói... thuần Việt!”” Câu nói “Mẹ quê quá, thời này ai còn nói... thuần Việt!” thể hiện điều gì?", "options": ["A. Lòng yêu nước", "B. Sự khiêm tốn", "C. Sự ngụy biện của kẻ sính ngoại, coi thường tiếng mẹ đẻ", "D. Lòng hiếu thảo"], "answer": "C", "explain": "Đó là lời ngụy biện đầy mỉa mai của người sính ngoại."}, {"type": "truefalse", "level": "VD", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Chị Lan đi du học về được một tháng mà gặp ai cũng chêm tiếng Anh vào câu chuyện: “Cái này very đẹp, cái kia so cute!” Mẹ chị nhắc: “Nói tiếng Việt cho rõ con ơi.” Chị bĩu môi: “Mẹ quê quá, thời này ai còn nói... thuần Việt!”” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Đoạn văn phê phán thói sính ngoại, coi nhẹ tiếng Việt.", "b) Tác giả khuyến khích lạm dụng tiếng Anh trong giao tiếp hằng ngày.", "c) Thông điệp: học ngoại ngữ nhưng phải giữ gìn sự trong sáng của tiếng Việt."], "answers": ["T", "S", "T"], "explain": "a đúng; b sai; c đúng (thông điệp nhân văn)."}, {"type": "short", "level": "TH", "q": "Nêu bốn câu hỏi cần trả lời khi đọc hiểu một bài thơ trào phúng.", "answer": "(1) Nhà thơ cười ai, cái gì? (2) Dùng thủ pháp nào? (3) Thái độ tác giả ra sao? (4) Thông điệp gửi gắm là gì?", "explain": "Chấm theo ý: đủ 4 ý cơ bản (đối tượng, thủ pháp, thái độ, thông điệp)."}, {"type": "short", "level": "VD", "q": "Giải thích vì sao thơ Hồ Xuân Hương được nhận xét là “vừa trào phúng vừa trữ tình”.", "answer": "Vì trong tiếng cười châm biếm lễ giáo phong kiến vẫn chan chứa tình cảm yêu thương, bênh vực con người, nhất là người phụ nữ.", "explain": "Chấm theo ý: nêu được sự hòa quyện giữa châm biếm và tình cảm."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "TH", "q": "Nhận định nào SAI về thơ trào phúng?", "options": ["A. Dùng tiếng cười để phê phán", "B. Đối tượng là thói hư tật xấu", "C. Chỉ mua vui, không có mục đích gì", "D. Có các thủ pháp phóng đại, đối lập, nói ngược"], "answer": "A", "explain": "Thơ trào phúng bao giờ cũng có mục đích phê phán, không chỉ mua vui."}, {"type": "mcq", "level": "NB", "q": "“Tam nguyên Yên Đổ” là danh xưng của ai?", "options": ["A. Trần Tế Xương", "B. Nguyễn Khuyến", "C. Hồ Xuân Hương", "D. Cao Bá Quát"], "answer": "D", "explain": "Nguyễn Khuyến đỗ đầu ba kỳ thi, quê Yên Đổ."}, {"type": "mcq", "level": "TH", "q": "Khi phân tích tiếng cười trào phúng, cần làm rõ mấy yếu tố nào?", "options": ["A. Đối tượng bị cười, thủ pháp gây cười, thái độ tác giả, thông điệp", "B. Chỉ cần đếm số câu thơ", "C. Chỉ cần biết năm sinh tác giả", "D. Chỉ cần học thuộc bài thơ"], "answer": "B", "explain": "Bốn yếu tố: đối tượng, thủ pháp, thái độ, thông điệp."}, {"type": "mcq", "level": "NB", "q": "Tú Xương đi thi nhiều lần với kết quả ra sao?", "options": ["A. Đỗ đầu cả ba kỳ", "B. Nhiều lần hỏng, sống chật vật", "C. Không bao giờ đi thi", "D. Đỗ làm quan to"], "answer": "C", "explain": "Tú Xương lận đận thi cử, nhiều lần hỏng."}, {"type": "mcq", "level": "NB", "q": "Dòng thơ nào lấy cái đẹp làm đối tượng phản ánh?", "options": ["A. Thơ trào phúng", "B. Thơ trữ tình", "C. Cả hai đều không", "D. Không dòng nào"], "answer": "B", "explain": "Thơ trữ tình hướng tới cái đẹp: thiên nhiên, tình yêu, quê hương."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Trước mặt thì chị chị em em, / Sau lưng kể xấu, thêm mắm dặm muối. / Người ta nghe chuyện nửa vời, / Tưởng đâu sự thật, hóa lời bịa thêm!” Đoạn thơ trên châm biếm thói xấu nào?", "options": ["A. Thật thà", "B. Dũng cảm", "C. Chăm chỉ", "D. Nói xấu sau lưng, đâm bị thóc chọc bị gạo"], "answer": "D", "explain": "Trước mặt “chị chị em em”, sau lưng “kể xấu, thêm mắm dặm muối”."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Trước mặt thì chị chị em em, / Sau lưng kể xấu, thêm mắm dặm muối. / Người ta nghe chuyện nửa vời, / Tưởng đâu sự thật, hóa lời bịa thêm!” Cụm từ “thêm mắm dặm muối” trong đoạn thơ có nghĩa là gì?", "options": ["A. Thêu dệt, bịa thêm cho câu chuyện thêm ly kỳ", "B. Nấu ăn ngon", "C. Khen ngợi", "D. Xin lỗi"], "answer": "A", "explain": "“Thêm mắm dặm muối” nghĩa bóng: thêu dệt, bịa đặt thêm."}, {"type": "truefalse", "level": "VD", "q": "Đọc đoạn thơ sau (do người biên soạn sáng tác để minh họa): “Trước mặt thì chị chị em em, / Sau lưng kể xấu, thêm mắm dặm muối. / Người ta nghe chuyện nửa vời, / Tưởng đâu sự thật, hóa lời bịa thêm!” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Đoạn thơ sử dụng thủ pháp đối lập trước mặt và sau lưng.", "b) Đoạn thơ ca ngợi tình bạn chân thành.", "c) Thông điệp: sống chân thành, không nói xấu sau lưng người khác."], "answers": ["T", "S", "T"], "explain": "a đúng (trước mặt/sau lưng); b sai (châm biếm kẻ hai mặt); c đúng."}, {"type": "short", "level": "VD", "q": "Phân tích ngắn gọn tác dụng của thủ pháp đối lập trong thơ trào phúng (kèm ví dụ tự đặt).", "answer": "Đối lập đặt cái tốt cạnh cái xấu (lời nói cạnh việc làm) tạo sự chênh lệch gây cười và tố cáo sự giả dối. Ví dụ: “Miệng nói lời hay, tay làm việc xấu.”", "explain": "Chấm theo ý: nêu được cách dùng và tác dụng; có ví dụ."}, {"type": "short", "level": "TH", "q": "Thơ trào phúng thường dùng loại từ ngữ nào? Vì sao?", "answer": "Từ ngữ dân gian, khẩu ngữ đời thường; vì gần gũi, hóm hỉnh, tăng tính hài hước và dễ đi vào lòng người đọc.", "explain": "Chấm theo ý: nêu được loại từ ngữ và lý do."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Ví dụ nào dưới đây thuộc thủ pháp đối lập?", "options": ["A. Miệng nói lời hay, tay làm việc xấu", "B. Anh ấy rất cao", "C. Trời hôm nay đẹp", "D. Cô ấy cười"], "answer": "B", "explain": "Lời hay đặt cạnh việc xấu trái ngược — chính là đối lập."}, {"type": "mcq", "level": "NB", "q": "Biện pháp tu từ nào gần với thủ pháp phóng đại?", "options": ["A. So sánh", "B. Nói quá", "C. Ẩn dụ", "D. Hoán dụ"], "answer": "D", "explain": "Phóng đại chính là nói quá, thổi phồng sự thật."}, {"type": "mcq", "level": "TH", "q": "Thơ Hồ Xuân Hương vừa trào phúng vừa trữ tình vì sao?", "options": ["A. Vì bà viết rất dài", "B. Vì trong tiếng cười châm biếm lễ giáo vẫn chan chứa tình cảm với con người, nhất là người phụ nữ", "C. Vì bà không biết phân biệt hai dòng thơ", "D. Vì thơ bà không có đối tượng"], "answer": "A", "explain": "Thơ bà châm biếm mà vẫn đầy yêu thương, bênh vực người phụ nữ."}, {"type": "mcq", "level": "NB", "q": "Ngôn ngữ thơ trào phúng thường có đặc điểm gì?", "options": ["A. Hài hước, hóm hỉnh", "B. Khô khan, khó hiểu", "C. Chỉ dùng từ Hán Việt", "D. Không có vần điệu"], "answer": "C", "explain": "Ngôn ngữ trào phúng hài hước, hóm hỉnh, giàu khẩu ngữ."}, {"type": "mcq", "level": "NB", "q": "Tác giả nào được gọi là “Bà chúa thơ Nôm”?", "options": ["A. Hồ Xuân Hương", "B. Bà Huyện Thanh Quan", "C. Đoàn Thị Điểm", "D. Nguyễn Thị Duệ"], "answer": "B", "explain": "Hồ Xuân Hương — Bà chúa thơ Nôm."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Lớp 8A quyết tâm đoạt giải “Lớp tiên tiến”. Cuối năm, lớp trưởng bí mật chép hộ bài kiểm tra cho hai bạn học yếu để điểm trung bình cả lớp không bị kéo xuống. Khi bị phát hiện, cả lớp cúi gằm mặt; tấm bằng khen trên tường bỗng trở nên thật... chói mắt.” Hành vi của lớp trưởng trong đoạn văn đáng phê phán vì sao?", "options": ["A. Vì bạn ấy chăm học", "B. Vì gian lận để có thành tích, biến bằng khen thành thứ giả dối", "C. Vì bạn ấy giúp bạn", "D. Vì bạn ấy khiêm tốn"], "answer": "B", "explain": "Chép hộ bài để điểm cao — gian lận vì bệnh thành tích."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Lớp 8A quyết tâm đoạt giải “Lớp tiên tiến”. Cuối năm, lớp trưởng bí mật chép hộ bài kiểm tra cho hai bạn học yếu để điểm trung bình cả lớp không bị kéo xuống. Khi bị phát hiện, cả lớp cúi gằm mặt; tấm bằng khen trên tường bỗng trở nên thật... chói mắt.” Chi tiết “tấm bằng khen trên tường bỗng trở nên thật... chói mắt” gợi điều gì?", "options": ["A. Bằng khen rất đẹp", "B. Lớp học thiếu ánh sáng", "C. Sự mỉa mai: thành tích gian dối khiến bằng khen trở nên đáng xấu hổ", "D. Bằng khen bị hỏng"], "answer": "C", "explain": "“Chói mắt” đầy mỉa mai: vinh quang giả tạo thật đáng xấu hổ."}, {"type": "truefalse", "level": "VD", "q": "Đọc đoạn văn sau (do người biên soạn sáng tác để minh họa): “Lớp 8A quyết tâm đoạt giải “Lớp tiên tiến”. Cuối năm, lớp trưởng bí mật chép hộ bài kiểm tra cho hai bạn học yếu để điểm trung bình cả lớp không bị kéo xuống. Khi bị phát hiện, cả lớp cúi gằm mặt; tấm bằng khen trên tường bỗng trở nên thật... chói mắt.” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Đoạn văn châm biếm bệnh thành tích trong học đường.", "b) Hành vi chép hộ bài là đáng khen vì giúp tập thể.", "c) Thông điệp: thành tích phải đến từ nỗ lực thật sự, không gian dối."], "answers": ["T", "S", "T"], "explain": "a đúng; b sai (gian lận không thể khen); c đúng."}, {"type": "short", "level": "VD", "q": "Nêu hai tác dụng của tiếng cười trào phúng đối với người đọc.", "answer": "Giúp người đọc nhận ra, phê phán cái xấu quanh mình; đồng thời mang lại niềm vui, sự sảng khoái và bài học răn đời.", "explain": "Chấm theo ý: nêu được tác dụng phê phán và tác dụng giải trí, giáo dục."}, {"type": "short", "level": "VD", "q": "Nêu ý nghĩa của tiếng cười trào phúng đối với cuộc sống hôm nay.", "answer": "Tiếng cười giúp nhận diện và phê phán thói hư tật xấu (khoe khoang, lười biếng, giả dối...), góp phần làm cho cuộc sống tốt đẹp hơn.", "explain": "Chấm theo ý: nêu được ý nghĩa phê phán, giáo dục của tiếng cười."}]}]}
