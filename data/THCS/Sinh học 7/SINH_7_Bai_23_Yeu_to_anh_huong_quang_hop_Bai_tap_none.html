":0.25},{"type":"mcq","level":"TH","q":"Dùng bạt che sáng cho rau ưa bóng nhằm mục đích gì?","options":["A. Để đẹp","B. Giảm cường độ sáng phù hợp nhu cầu cây","C. Để giữ ấm","D. Để chống mưa"],"answer":"B","explain":"Cây ưa bóng cần sáng dịu.","points":0.25},{"type":"mcq","level":"VD","q":"Trồng cây trong nhà dùng đèn thường thay đèn led chuyên dụng, hiệu quả sẽ thế nào?","options":["A. Tốt hơn","B. Kém hơn vì quang phổ không tối ưu","C. Như nhau","D. Không quang hợp"],"answer":"B","explain":"Quang phổ ảnh hưởng đến quang hợp.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao bón phân hữu cơ vừa tốt cho cây vừa tăng CO2?","options":["A. Để vui","B. Phân hủy sinh CO2 cho quang hợp và mùn cho đất","C. Để đắt","D. Không có lợi"],"answer":"B","explain":"Phân hữu cơ phân hủy sinh CO2.","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định về nhiệt độ.","statements":["a) Lạnh quá cây ngừng sinh trưởng.","b) Nóng quá phá hủy diệp lục.","c) Nhiệt độ thích hợp cho enzyme hoạt động.","d) Nhiệt độ nào cây cũng quang hợp tốt."],"answer":["T","T","T","F"],"explain":"Nhiệt độ cực đoan gây hại.","points":1},{"type":"truefalse","level":"VDC","q":"Đánh giá các nhận định khái quát.","statements":["a) Điều khiển yếu tố môi trường giúp tăng năng suất.","b) Nông nghiệp công nghệ cao tối ưu các yếu tố.","c) Hiểu yếu tố ảnh hưởng giúp trồng trọt hiệu quả.","d) Năng suất cây trồng không thể cải thiện."],"answer":["T","T","T","F"],"explain":"Khoa học giúp tăng năng suất rõ rệt.","points":1},{"type":"short","level":"TH","q":"Vì sao phải làm cỏ cho ruộng lúa?","answer":"Đủ sáng","explain":"Loại cỏ tranh sáng và dinh dưỡng.","points":0.5},{"type":"short","level":"VDC","q":"Đèn led đỏ và xanh tím được dùng trong nhà kính vì sao?","answer":"Cây hấp thụ tốt","explain":"Hai màu này hiệu quả nhất cho quang hợp.","points":0.5}]}]}</script>
