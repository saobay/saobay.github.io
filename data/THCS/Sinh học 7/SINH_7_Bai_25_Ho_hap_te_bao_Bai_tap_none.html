 hợp","B. Hô hấp của sinh vật","C. Mưa","D. Gió"],"answer":"B","explain":"Hô hấp thải CO2 cho cây dùng.","points":0.25},{"type":"mcq","level":"NB","q":"Quá trình nào cung cấp O2 cho hô hấp của động vật?","options":["A. Hô hấp","B. Quang hợp của cây xanh","C. Mưa","D. Sấm"],"answer":"B","explain":"Quang hợp thải O2.","points":0.25},{"type":"mcq","level":"TH","q":"Vòng tuần hoàn CO2 và O2 trong tự nhiên nhờ đâu?","options":["A. Gió","B. Quang hợp và hô hấp bổ sung nhau","C. Mưa","D. Đất"],"answer":"B","explain":"Hai quá trình tạo vòng tuần hoàn khí.","points":0.25},{"type":"mcq","level":"TH","q":"Trồng cây xanh giúp cân bằng khí quyển vì sao?","options":["A. Cây đẹp","B. Quang hợp hấp thụ CO2, thải O2","C. Cây che nắng","D. Cây to"],"answer":"B","explain":"Cây điều hòa thành phần không khí.","points":0.25},{"type":"mcq","level":"VD","q":"Đốt nhiều nhiên liệu hóa thạch gây hiệu ứng nhà kính vì sao?","options":["A. Lửa đẹp","B. Thải quá nhiều CO2 vượt khả năng hấp thụ của cây","C. Tạo khói","D. Tốn tiền"],"answer":"B","explain":"CO2 dư gây hiệu ứng nhà kính.","points":0.25},{"type":"mcq","level":"VDC","q":"Bảo vệ rừng có ý nghĩa gì với hô hấp của con người?","options":["A. Để du lịch","B. Rừng cung cấp O2, hấp thụ CO2 cho hô hấp","C. Để lấy gỗ","D. Để săn bắn"],"answer":"B","explain":"Rừng duy trì nguồn O2 cho sinh giới.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về bể cá.","statements":["a) Rong quang hợp tạo O2 ban ngày.","b) Ban đêm rong và cá đều hô hấp.","c) Bể kín ban đêm có thể thiếu O2.","d) Rong không hô hấp."],"answer":["T","T","T","F"],"explain":"Rong cũng hô hấp.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về lặn.","statements":["a) Dưới nước không thở được không khí.","b) Bình dưỡng khí cung cấp O2.","c) Thiếu O2 gây nguy hiểm.","d) Con người hô hấp được dưới nước."],"answer":["T","T","T","F"],"explain":"Người không lấy O2 từ nước được.","points":1},{"type":"short","level":"NB","q":"Khí hô hấp :"Đánh giá các nhận định khái quát.","statements":["a) Hô hấp và quang hợp tạo sự cân bằng.","b) Mất cân bằng khí gây hại sinh giới.","c) Bảo vệ cây xanh là bảo vệ sự sống.","d) Hô hấp không quan trọng."],"answer":["T","T","T","F"],"explain":"Hô hấp là quá trình sống còn.","points":1},{"type":"short","level":"TH","q":"Khí hô hấp thải ra là gì?","answer":"Carbon dioxide","explain":"Thải khí CO2.","points":0.5},{"type":"short","level":"VDC","q":"Vòng tuần hoàn O2, CO2 nhờ đâu?","answer":"Hai quá trình","explain":"Quang hợp và hô hấp bổ sung nhau.","points":0.5}]}]}</script>
