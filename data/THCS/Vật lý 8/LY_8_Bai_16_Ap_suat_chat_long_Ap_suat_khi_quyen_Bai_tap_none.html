 nhau có các nhánh thông đáy với nhau.","b) Mực chất lỏng các nhánh luôn bằng nhau.","c) Ấm đun nước hoạt động theo nguyên tắc bình thông nhau.","d) Bình thông nhau chỉ đúng khi các nhánh có tiết diện bằng nhau."],"answer":["T","T","T","F"],"explain":"Mực chất lỏng bằng nhau không phụ thuộc tiết diện nhánh.","points":1},{"type":"short","level":"TH","q":"Trọng lượng riêng của nước là 10 000 N/m³. Áp suất tại độ sâu 0,5 m là bao nhiêu Pa?","answer":"5000","explain":"p = 10 000 × 0,5 = 5 000 Pa.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao thợ lặn xuống càng sâu càng cảm thấy tức ngực? (Trả lời ngắn gọn)","answer":"Vì áp suất nước tăng theo độ sâu","explain":"p = d × h, h tăng thì p tăng.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"TH","q":"Áp suất chất lỏng phụ thuộc vào","options":["A. Hình dạng của bình","B. Lượng chất lỏng trong bình","C. Trọng lượng riêng và độ sâu","D. Diện tích đáy bình"],"answer":"C","explain":"p = d × h chỉ phụ thuộc d và h.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị của độ sâu h trong công thức p = d × h là","options":["A. N","B. m","C. Pa","D. kg"],"answer":"B","explain":"h là độ dài, đơn vị mét.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai bình A và B chứa cùng một loại chất lỏng, mực chất lỏng cao bằng nhau nhưng bình A to gấp đôi bình B. So sánh áp suất tại đáy hai bình","options":["A. Áp suất đáy A lớn hơn","B. Áp suất đáy B lớn hơn","C. Bằng nhau","D. Không xác định được"],"answer":"C","explain":"p = d × h chỉ phụ thuộc d, h; không phụ thuộc lượng chất lỏng.","points":0.25},{"type":"mcq","level":"VD","q":"Cột thủy ngân trong thí nghiệm Torricelli cao 760 mm. Áp suất khí quyển tương ứng khoảng","options":["A. 10 130 Pa","B. 101 300 Pa","C. 1 013 Pa","D. 1 013 000 Pa"],"answer":"B","explain":"760 mmHg ≈ 101 300 Pa.","points":0.25},{"type":"mcq","level":"TH","q":"Hiện tượng nào chứng tỏ sự tồn tại của áp suất khí quyển?","options":["A. Nước chảy từ vòi xuống","B. Giấy không rơi khi úp ":["A. Lớn hơn","B. Nhỏ hơn","C. Bằng nhau","D. Bằng không"],"answer":"B","explain":"Càng lên cao áp suất càng giảm.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Áp suất khí quyển do trọng lượng không khí gây ra.","b) Áp suất khí quyển tác dụng theo mọi phương.","c) Độ cao tăng thì áp suất khí quyển giảm.","d) Ở mọi nơi trên Trái Đất áp suất khí quyển như nhau."],"answer":["T","T","T","F"],"explain":"Áp suất khí quyển thay đổi theo độ cao và thời tiết.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về máy nén thủy lực.","statements":["a) Dùng chất lỏng để truyền áp suất.","b) Áp suất tác dụng lên chất lỏng truyền nguyên vẹn.","c) Pittông nhỏ tác dụng lực nhỏ tạo áp suất lớn ở pittông to.","d) Máy nén thủy lực vi phạm định luật bảo toàn năng lượng."],"answer":["T","T","T","F"],"explain":"Máy nén thủy lực không vi phạm bảo toàn năng lượng.","points":1},{"type":"short","level":"TH","q":"Điểm A ở độ sâu 2 m, điểm B ở độ sâu 5 m trong cùng bể nước. Áp suất tại B gấp mấy lần tại A?","answer":"2,5","explain":"p tỉ lệ với h: 5 / 2 = 2,5 lần.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao nắp ấm đun nước thường có lỗ nhỏ? (Trả lời ngắn gọn)","answer":"Để không khí vào, cân bằng áp suất, nước chảy dễ","explain":"Lỗ thông giúp áp suất trong ấm bằng áp suất khí quyển.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"TH","q":"Đơn vị mmHg dùng để đo","options":["A. Thể tích","B. Áp suất","C. Khối lượng","D. Nhiệt độ"],"answer":"B","explain":"mmHg là đơn vị đo áp suất.","points":0.25},{"type":"mcq","level":"NB","q":"760 mmHg xấp xỉ bằng","options":["A. 10 130 Pa","B. 101 300 Pa","C. 1 013 Pa","D. 1 013 000 Pa"],"answer":"B","explain":"760 mmHg ≈ 101 300 Pa.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bình kín chứa khí có áp suất bằng áp suất khí quyển. Hút bớt khí ra ngoài thì","options":["A. Áp suất trong bình tăng","B. Áp suất trong bình giảm","C. Áp suất không đổi","D. Bình vỡ ngay"],"answer":"B","explain":"Lượng khí giảm nên áp suất giảm.","points":0.25},{"type":"mcq","level":"VD","q":"Một cột dầu cao 2,5 m (d = 8 000 N/m³). Áp suất ở đáy cột dầu là","options":["A. 20 000 Pa","B. 3 200 Pa","C. 200 000 Pa","D. 32 000 Pa"],"answer":"A","explain":"p = 8 000 × 2,5 = 20 000 Pa.","points":0.25},{"type":"mcq","level":"TH","q":"Khi úp ngược cốc nước đầy có đậy tấm bìa, tấm bìa không rơi vì","options":["A. Bìa dính vào cốc","B. Áp suất khí quyển ở dưới đỡ tấm bìa","C. Nước dính vào bìa","D. Trọng lực kéo bìa lên"],"answer":"B","explain":"Áp suất khí quyển từ dưới đẩy lên giữ tấm bìa.","points":0.25},{"type":"mcq","level":"NB","q":"Trọng lượng riêng của nước là","options":["A. 1 000 N/m³","B. 10 000 N/m³","C. 100 000 N/m³","D. 10 N/m³"],"answer":"B","explain":"d nước = 10 000 N/m³.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) p = d × h chỉ đúng cho chất lỏng đứng yên.","b) Trong hai chất lỏng khác nhau, ở cùng độ sâu, chất có d lớn hơn cho p lớn hơn.","c) Áp suất tại đáy bình phụ thuộc diện tích đáy.","d) Độ sâu càng lớn, áp suất càng lớn."],"answer":["T","T","F","T"],"explain":"p không phụ thuộc diện tích đáy.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Chất lỏng gây áp suất lên đáy bình.","b) Chất lỏng gây áp suất lên thành bình.","c) Bình thông nhau có các nhánh thông đáy.","d) Mực chất lỏng các nhánh bình thông nhau luôn bằng nhau."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"short","level":"VDC","q":"Một điểm nằm ở độ sâu 4 m trong bể thủy ngân (d = 136 000 N/m³). Áp suất tại điểm đó là bao nhiêu Pa?","answer":"544000","explain":"p = 136 000 × 4 = 544 000 Pa.","points":0.5},{"type":"short","level":"TH","q":"Người ta đo áp suất khí quyển bằng dụng cụ gì?","answer":"Áp kế","explain":"Áp kế (phong vũ biểu) đo áp suất khí quyển.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Áp suất do cột chất lỏng gây ra tại một điểm phụ thuộc vào","options":["A. Thể tích chất lỏng","B. Độ sâu của điểm và trọng lượng riêng chất lỏng","C. Hình dạng bình chứa","D. Diện tích mặt thoáng"],"answer":"B","explain":"p = d × h.","points":0.25},{"type":"mcq","level":"TH","q":"Một bể nước hình trụ và một bể nước hình hộp có cùng độ sâu mực nước. Áp suất ở đáy hai bể","options":["A. Bể trụ lớn hơn","B. Bể hộp lớn hơn","C. Bằng nhau","D. Không so sánh được"],"answer":"C","explain":"p chỉ phụ thuộc d và h.","points":0.25},{"type":"mcq","level":"VD","q":"Cần áp suất 60 000 Pa từ cột nước. Độ sâu cần thiết là","options":["A. 0,6 m","B. 6 m","C. 60 m","D. 600 m"],"answer":"B","explain":"h = 60 000 / 10 000 = 6 m.","points":0.25},{"type":"mcq","level":"VDC","q":"Đổ thủy ngân vào một nhánh của ống chữ U, đổ nước vào nhánh kia. Mực thủy ngân thấp hơn mực nước vì","options":["A. Thủy ngân nặng hơn","B. d thủy ngân lớn hơn d nước nhiều lần","C. Ống chữ U không cân bằng","D. Nước bay hơi"],"answer":"B","explain":"Để cân bằng áp suất, cột chất lỏng có d lớn hơn thì thấp hơn.","points":0.25},{"type":"mcq","level":"NB","q":"Thí nghiệm Torricelli dùng chất lỏng nào?","options":["A. Nước","B. Thủy ngân","C. Dầu ăn","D. Rượu"],"answer":"B","explain":"Torricelli dùng thủy ngân vì d lớn, cột ngắn gọn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không dùng nước thay thủy ngân trong thí nghiệm Torricelli?","options":["A. Vì nước đắt","B. Vì cột nước cần cao hơn 10 m, bất tiện","C. Vì nước không có trọng lượng","D. Vì nước dễ vỡ ống"],"answer":"B","explain":"Áp suất khí quyển đẩy được cột nước cao ≈ 10,3 m.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Khí quyển bao quanh Trái Đất.","b) Không khí có trọng lượng.","c) Áp suất khí quyển ≈ 101 300 Pa ở mặt biển.","d) Càng lên cao áp suất khí quyển càng tăng."],"answer":["T","T","T","F"],"explain":"Càng lên cao áp suất càng giảm.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các tình huống thực tế.","statements":["a) Vỏ tàu ngầm phải chịu áp suất nước lớn ở độ sâu.","b) Chân đập thủy điện xây dày hơn đỉnh.","c) Thợ lặn cần áo lặn chịu áp lực.","d) Áp suất nước ở độ sâu không đáng kể."],"answer":["T","T","T","F"],"explain":"Áp suất nước ở độ sâu rất lớn.","points":1},{"type":"short","level":"TH","q":"Một điểm ở độ sâu 10 m dưới mặt nước. Áp suất nước tại đó là bao nhiêu Pa?","answer":"100000","explain":"p = 10 000 × 10 = 100 000 Pa.","points":0.5},{"type":"short","level":"VDC","q":"Giải thích ngắn gọn vì sao nước từ vòi ở tầng 1 chảy mạnh hơn ở tầng 5?","answer":"Vì cột nước từ bể trên xuống tầng 1 cao hơn","explain":"h lớn hơn nên p = d × h lớn hơn.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Biết d = 10 000 N/m³, p = 45 000 Pa. Độ sâu h là","options":["A. 0,45 m","B. 4,5 m","C. 45 m","D. 450 m"],"answer":"B","explain":"h = 45 000 / 10 000 = 4,5 m.","points":0.25},{"type":"mcq","level":"NB","q":"Kí hiệu p trong vật lý thường chỉ","options":["A. Áp suất","B. Trọng lượng","C. Công suất","D. Động lượng"],"answer":"A","explain":"p là kí hiệu của áp suất.","points":0.25},{"type":"mcq","level":"VDC","q":"Một pittông nhỏ của máy nén thủy lực có diện tích 0,01 m² tác dụng lực 100 N. Lực nâng tối đa ở pittông lớn (diện tích 1 m²) là","options":["A. 100 N","B. 1 000 N","C. 10 000 N","D. 100 000 N"],"answer":"C","explain":"p = 100 / 0,01 = 10 000 Pa; F lớn = 10 000 × 1 = 10 000 N.","points":0.25},{"type":"mcq","level":"VD","q":"Áp suất khí quyển 101 300 Pa đổi ra kPa là","options":["A. 1,013 kPa","B. 10,13 kPa","C. 101,3 kPa","D. 1 013 kPa"],"answer":"C","explain":"101 300 / 1 000 = 101,3 kPa.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào SAI?","options":["A. Chất lỏng gây áp suất theo mọi phương","B. p = d × h","C. Bình thông nhau có mực chất lỏng bằng nhau","D. Áp suất khí quyển tăng khi lên cao"],"answer":"D","explain":"Áp suất khí quyển giảm khi lên cao.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các hiện tượng sau, hiện tượng nào do áp suất khí quyển gây ra?","options":["A. Mưa rơi","B. Nước dâng lên trong ống hút","C. Thuyền nổi trên sông","D. Gió thổi"],"answer":"B","explain":"Nước dâng lên trong ống hút nhờ áp suất khí quyển.","points":0.25},{"type":"truefalse","level":"VD","q":"Tổng hợp kiến thức. Đánh giá.","statements":["a) p = d × h; h tính từ mặt thoáng.","b) Bình thông nhau: mực chất lỏng các nhánh bằng nhau.","c) Áp suất khí quyển ≈ 101 300 Pa, giảm theo độ cao.","d) Áp suất chất lỏng phụ thuộc hình dạng bình."],"answer":["T","T","T","F"],"explain":"p không phụ thuộc hình dạng bình.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Chất lỏng có trọng lượng.","b) p = d × h.","c) Đơn vị p là Pa.","d) 760 mmHg ≈ 101 300 Pa."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"short","level":"VDC","q":"Tại sao khi uống sữa bằng ống hút, phải ngậm kín miệng quanh ống?","answer":"Để không khí không lọt vào, tạo chênh lệch áp suất","explain":"Kín miệng mới hút giảm áp suất trong ống được.","points":0.5},{"type":"short","level":"TH","q":"Trong ống chữ U chứa nước, nếu thổi mạnh vào một nhánh thì mực nước ở nhánh kia sẽ như thế nào?","answer":"Dâng lên","explain":"Áp suất tăng đẩy mực nước nhánh kia dâng lên.","points":0.5}]}]}
