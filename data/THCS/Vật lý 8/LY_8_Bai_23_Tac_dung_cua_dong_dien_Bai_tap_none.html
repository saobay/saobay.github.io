m châm lệch là","options":["A. Tác dụng từ","B. Tác dụng nhiệt","C. Tác dụng hóa học","D. Tác dụng sinh lý"],"answer":"A","explain":"Từ trường làm lệch kim nam châm.","points":0.25},{"type":"mcq","level":"TH","q":"Điều nào sau đây đúng về mạ điện?","options":["A. Vật cần mạ nối với cực dương","B. Vật cần mạ nối với cực âm","C. Không cần dòng điện","D. Chỉ mạ được vàng"],"answer":"B","explain":"Kim loại bám vào cực âm.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Quạt điện: tác dụng từ.","b) Bếp điện: tác dụng nhiệt.","c) Bể mạ: tác dụng hóa học.","d) Đèn pin: tác dụng từ."],"answer":["T","T","T","F"],"explain":"Đèn pin: tác dụng phát sáng (và nhiệt).","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) Dòng điện qua dung dịch gây biến đổi hóa học.","b) Kim loại bám vào cực âm khi mạ điện.","c) Nạp acquy là tác dụng hóa học.","d) Mạ điện là tác dụng nhiệt."],"answer":["T","T","T","F"],"explain":"Mạ điện là tác dụng hóa học.","points":1},{"type":"short","level":"TH","q":"Nêu tác dụng của dòng điện trong bàn là.","answer":"Tác dụng nhiệt","explain":"Dây đốt nóng bàn là.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao khi có sấm sét không nên trú dưới cây cao? (Trả lời ngắn gọn)","answer":"Vì dễ bị sét đánh","explain":"Cây cao thu hút sét.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Trong các thiết bị sau, thiết bị nào ứng dụng tác dụng sinh lý?","options":["A. Bàn là","B. Máy kích tim","C. Quạt điện","D. Đèn LED"],"answer":"B","explain":"Máy kích tim dùng dòng điện kích thích tim.","points":0.25},{"type":"mcq","level":"NB","q":"Tác dụng của dòng điện được ứng dụng rộng rãi nhất để chiếu sáng là","options":["A. Tác dụng phát sáng","B. Tác dụng nhiệt","C. Tác dụng từ","D. Tác dụng hóa học"],"answer":"A","explain":"Đèn điện dùng tác dụng phát sáng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một người chạm vào vỏ máy giặt bị rò điện. Hiện tượng này liên quan đến tác dụng nào và cách phòng tránh?","options":["A. Tác dụng nhiệt; dùng cầu chì","B. Tác dụng sinh lý; nối đất vỏ máy","C. Tác dụng từ; dùng nam châm","D. Tác dụng hóa học; sơn lại vỏ"],"answer":"B","explain":"Nối đất vỏ máy để tránh điện giật.","points":0.25},{"type":"mcq","level":"VD","q":"Khi dòng điện chạy qua bóng đèn dây tóc, có những tác dụng nào?","options":["A. Chỉ phát sáng","B. Phát sáng và nhiệt","C. Chỉ nhiệt","D. Từ và hóa học"],"answer":"B","explain":"Dây tóc nóng lên (nhiệt) và phát sáng.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào SAI?","options":["A. Dòng điện có tác dụng nhiệt","B. Dòng điện có tác dụng phát sáng","C. Dòng điện có tác dụng từ","D. Dòng điện không có tác dụng nào"],"answer":"D","explain":"Dòng điện có 5 tác dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Số tác dụng của dòng điện được học trong bài là","options":["A. 3","B. 4","C. 5","D. 7"],"answer":"C","explain":"5 tác dụng.","points":0.25},{"type":"truefalse","level":"VD","q":"Tổng hợp kiến thức. Đánh giá.","statements":["a) Nhiệt: dây dẫn nóng lên.","b) Phát sáng: vật phát sáng.","c) Từ: gây từ trường.","d) Hóa học và sinh lý không phải tác dụng của dòng điện."],"answer":["T","T","T","F"],"explain":"Hóa học và sinh lý cũng là tác dụng của dòng điện.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Dòng điện có nhiều tác dụng.","b) Mỗi tác dụng có ứng dụng riêng.","c) Cần an toàn khi dùng điện.","d) Dòng điện vô hại với con người."],"answer":["T","T","T","F"],"explain":"Dòng điện có thể gây nguy hiểm chết người.","points":1},{"type":"short","level":"VDC","q":"Kể hai thiết bị ứng dụng tác dụng từ của dòng điện.","answer":"Nam châm điện và động cơ điện","explain":"Hoặc chuông điện, loa, rơ le (chấp nhận đáp án tương đương).","points":0.5},{"type":"short","level":"TH","q":"Tác dụng nào của dòng điện được dùng để bảo vệ mạch bằng cầu chì?","answer":"Tác dụng nhiệt","explain":"Dòng lớn làm dây chì nóng chảy.","points":0.5}]}]}
