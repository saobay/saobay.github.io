{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Khối lượng riêng của một chất cho biết điều gì?","options":["A. Khối lượng của vật","B. Khối lượng của một đơn vị thể tích chất đó","C. Thể tích của một đơn vị khối lượng","D. Trọng lượng của vật"],"answer":"B","explain":"Khối lượng riêng là khối lượng của một đơn vị thể tích chất đó.","points":0.25},{"type":"mcq","level":"TH","q":"Công thức tính khối lượng riêng D là","options":["A. D = m × V","B. D = V / m","C. D = m / V","D. D = m + V"],"answer":"C","explain":"D = m / V: khối lượng riêng bằng khối lượng chia cho thể tích.","points":0.25},{"type":"mcq","level":"VD","q":"Một khối kim loại có khối lượng 15,6 kg, thể tích 0,002 m³. Khối lượng riêng của kim loại là","options":["A. 780 kg/m³","B. 7 800 kg/m³","C. 31,2 kg/m³","D. 0,0312 kg/m³"],"answer":"B","explain":"D = m / V = 15,6 / 0,002 = 7 800 kg/m³.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai khối có cùng thể tích: khối A bằng sắt (D = 7 800 kg/m³), khối B bằng gỗ (D = 700 kg/m³). So sánh khối lượng hai khối","options":["A. Khối A nặng hơn khối B","B. Khối B nặng hơn khối A","C. Hai khối nặng bằng nhau","D. Không so sánh được"],"answer":"A","explain":"Cùng thể tích, chất có D lớn hơn thì khối lượng lớn hơn: m = D × V.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị của khối lượng riêng trong hệ SI là","options":["A. kg","B. m³","C. kg/m³","D. N"],"answer":"C","explain":"Khối lượng (kg) chia thể tích (m³) cho đơn vị kg/m³.","points":0.25},{"type":"mcq","level":"TH","q":"1 g/cm³ bằng bao nhiêu kg/m³?","options":["A. 10 kg/m³","B. 100 kg/m³","C. 1 000 kg/m³","D. 1 kg/m³"],"answer":"C","explain":"1 g/cm³ = 0,001 kg / 0,000001 m³ = 1 000 kg/m³.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về khối lượng riêng.","statements":["a) Khối lượng riêng tính bằng công thức D = m / V.","b) Đơn vị SI của khối lượng riêng là kg/m³.","c) Mọi chất đều có khối lượng riêng bằng nhau.","d) Khối lượng riêng của nước là 1 000 kg/m³."],"answer":["T","T","F","T"],"explain":"Mỗi chất có khối lượng riêng khác nhau, xác định ở điều kiện nhất định.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định sau.","statements":["a) Vật có khối lượng riêng lớn hơn nước sẽ chìm trong nước.","b) Khối lượng riêng của không khí xấp xỉ 1,29 kg/m³.","c) Đổi 2,7 g/cm³ được 27 000 kg/m³.","d) Hai vật cùng khối lượng thì luôn có cùng khối lượng riêng."],"answer":["T","T","F","F"],"explain":"2,7 g/cm³ = 2 700 kg/m³; cùng khối lượng nhưng khác thể tích thì D khác nhau.","points":1},{"type":"short","level":"TH","q":"Một vật có khối lượng 5 kg, thể tích 0,005 m³. Khối lượng riêng của vật là bao nhiêu kg/m³?","answer":"1000","explain":"D = m / V = 5 / 0,005 = 1 000 kg/m³.","points":0.5},{"type":"short","level":"VDC","q":"Tàu thép nặng hàng nghìn tấn vì sao vẫn nổi được trên mặt nước? (Trả lời ngắn gọn)","answer":"Vì khối lượng riêng trung bình của tàu nhỏ hơn nước","explain":"Tàu rỗng nên khối lượng riêng trung bình nhỏ hơn nước, tàu nổi.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"TH","q":"Trọng lượng riêng d của một chất được tính bằng","options":["A. d = P / V","B. d = V / P","C. d = m / V","D. d = P × V"],"answer":"A","explain":"Trọng lượng riêng d = P / V, đơn vị N/m³.","points":0.25},{"type":"mcq","level":"NB","q":"Kí hiệu của khối lượng riêng là","options":["A. m","B. V","C. D","D. P"],"answer":"C","explain":"Khối lượng riêng kí hiệu là D, khối lượng là m, thể tích là V.","points":0.25},{"type":"mcq","level":"VDC","q":"Một thỏi vàng có khối lượng 19,3 g, thể tích 1 cm³. Có thể kết luận gì về thỏi kim loại?","options":["A. Là vàng thật","B. Là vàng giả","C. Không kết luận được","D. Là bạc"],"answer":"A","explain":"D = 19,3 g/cm³ = 19 300 kg/m³, đúng bằng khối lượng riêng của vàng.","points":0.25},{"type":"mcq","level":"VD","q":"Khối lượng riêng của dầu ăn là 800 kg/m³. Vậy 2 m³ dầu ăn có khối lượng là","options":["A. 400 kg","B. 1 600 kg","C. 1,6 kg","D. 16 000 kg"],"answer":"B","explain":"m = D × V = 800 × 2 = 1 600 kg.","points":0.25},{"type":"mcq","level":"TH","q":"Giữa trọng lượng riêng d và khối lượng riêng D có liên hệ","options":["A. d = D / 10","B. d = 10D","C. d = D","D. d = 100D"],"answer":"B","explain":"Vì P = 10m nên d = P / V = 10D.","points":0.25},{"type":"mcq","level":"NB","q":"Dụng cụ nào dùng để đo thể tích chất lỏng trong phòng thí nghiệm?","options":["A. Cân","B. Bình chia độ","C. Lực kế","D. Nhiệt kế"],"answer":"B","explain":"Bình chia độ dùng để đo thể tích chất lỏng.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định sau.","statements":["a) Trọng lượng riêng của nước là 10 000 N/m³.","b) 1 m³ sắt nặng 7 800 kg.","c) Khối lượng riêng của chất khí thường lớn hơn chất rắn.","d) Dùng công thức V = m / D để tính thể tích khi biết khối lượng và khối lượng riêng."],"answer":["T","T","F","T"],"explain":"Chất khí có D nhỏ hơn chất rắn rất nhiều.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về khối lượng riêng.","statements":["a) Khối lượng riêng cho biết độ đặc của chất.","b) Cùng một chất, ở điều kiện xác định, khối lượng riêng không đổi.","c) 1 kg/m³ = 1 000 g/cm³.","d) Khối lượng riêng của thủy ngân lớn hơn của nước."],"answer":["T","T","F","T"],"explain":"1 g/cm³ = 1 000 kg/m³ nên 1 kg/m³ = 0,001 g/cm³.","points":1},{"type":"short","level":"VDC","q":"Một khối gỗ có D = 700 kg/m³ thả vào nước (D = 1 000 kg/m³) thì nổi hay chìm?","answer":"Nổi","explain":"D gỗ nhỏ hơn D nước nên khối gỗ nổi.","points":0.5},{"type":"short","level":"TH","q":"Đổi 7 800 kg/m³ sang g/cm³ được bao nhiêu?","answer":"7,8","explain":"Chia cho 1 000: 7 800 / 1 000 = 7,8 g/cm³.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Đại lượng đặc trưng cho độ đặc của chất là","options":["A. Khối lượng","B. Thể tích","C. Khối lượng riêng","D. Trọng lượng"],"answer":"C","explain":"Khối lượng riêng đặc trưng cho độ đặc của chất.","points":0.25},{"type":"mcq","level":"TH","q":"Biết khối lượng riêng D và thể tích V, khối lượng m tính bằng","options":["A. m = D / V","B. m = D × V","C. m = V / D","D. m = D + V"],"answer":"B","explain":"Từ D = m / V suy ra m = D × V.","points":0.25},{"type":"mcq","level":"VD","q":"Một bình chứa 0,5 m³ nước. Khối lượng nước trong bình là","options":["A. 50 kg","B. 500 kg","C. 5 000 kg","D. 0,5 kg"],"answer":"B","explain":"m = D × V = 1 000 × 0,5 = 500 kg.","points":0.25},{"type":"mcq","level":"VDC","q":"Có ba khối kim loại cùng khối lượng: nhôm (D = 2 700 kg/m³), sắt (D = 7 800 kg/m³), chì (D = 11 300 kg/m³). Khối nào có thể tích lớn nhất?","options":["A. Khối nhôm","B. Khối sắt","C. Khối chì","D. Cả ba bằng nhau"],"answer":"A","explain":"V = m / D, D càng nhỏ thì V càng lớn nên khối nhôm to nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Khối lượng riêng của nước ở điều kiện thường xấp xỉ","options":["A. 100 kg/m³","B. 1 000 kg/m³","C. 10 000 kg/m³","D. 1 kg/m³"],"answer":"B","explain":"Khối lượng riêng của nước là 1 000 kg/m³.","points":0.25},{"type":"mcq","level":"TH","q":"Trọng lượng riêng của sắt (D = 7 800 kg/m³) là","options":["A. 780 N/m³","B. 7 800 N/m³","C. 78 000 N/m³","D. 780 000 N/m³"],"answer":"C","explain":"d = 10D = 10 × 7 800 = 78 000 N/m³.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về đơn vị đo.","statements":["a) Đơn vị SI của khối lượng riêng là kg/m³.","b) Đơn vị của trọng lượng riêng là N/m³.","c) 1 g/cm³ = 1 000 kg/m³.","d) Khối lượng riêng đo bằng cân."],"answer":["T","T","T","F"],"explain":"Khối lượng riêng tính từ khối lượng (cân) và thể tích (bình chia độ), không đo trực tiếp bằng cân.","points":1},{"type":"truefalse","level":"VD","q":"Một học sinh đo được khối đồng có m = 8,9 kg, V = 0,001 m³. Đánh giá các nhận định.","statements":["a) Khối lượng riêng của khối đồng là 8 900 kg/m³.","b) Khối đồng này là đồng nguyên chất.","c) Trọng lượng riêng của khối đồng là 89 000 N/m³.","d) Thể tích 2 kg đồng là khoảng 0,000225 m³."],"answer":["T","T","T","T"],"explain":"D = 8,9 / 0,001 = 8 900 kg/m³ đúng bảng số liệu; V = 2 / 8 900 ≈ 0,000225 m³.","points":1},{"type":"short","level":"TH","q":"Đổi 0,8 g/cm³ sang kg/m³ được bao nhiêu?","answer":"800","explain":"Nhân với 1 000: 0,8 × 1 000 = 800 kg/m³.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao tảng băng trôi nổi trên mặt nước biển dù phần lớn chìm dưới nước? (Trả lời ngắn gọn)","answer":"Vì khối lượng riêng của nước đá nhỏ hơn nước biển","explain":"D nước đá = 900 kg/m³ nhỏ hơn D nước biển nên băng nổi, phần chìm dưới nước.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Muốn tính thể tích V khi biết khối lượng m và khối lượng riêng D, ta dùng","options":["A. V = m × D","B. V = m / D","C. V = D / m","D. V = m + D"],"answer":"B","explain":"Từ D = m / V suy ra V = m / D.","points":0.25},{"type":"mcq","level":"NB","q":"Khối lượng riêng của sắt là 7 800 kg/m³. Con số này có nghĩa là","options":["A. 1 m³ sắt nặng 7 800 kg","B. 1 kg sắt có thể tích 7 800 m³","C. 7 800 m³ sắt nặng 1 kg","D. 1 m³ sắt nặng 7,8 kg"],"answer":"A","explain":"D = 7 800 kg/m³ nghĩa là 1 m³ sắt có khối lượng 7 800 kg.","points":0.25},{"type":"mcq","level":"VDC","q":"Một quả cầu sắt rỗng và một quả cầu sắt đặc có cùng thể tích ngoài. Quả cầu nào có khối lượng lớn hơn?","options":["A. Quả cầu đặc","B. Quả cầu rỗng","C. Hai quả nặng bằng nhau","D. Không xác định được"],"answer":"A","explain":"Quả đặc chứa nhiều sắt hơn (thể tích sắt thực lớn hơn) nên nặng hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Một xe chở 5 m³ cát. Biết khối lượng riêng của cát là 1 500 kg/m³. Khối lượng cát trên xe là","options":["A. 300 kg","B. 7 500 kg","C. 750 kg","D. 75 000 kg"],"answer":"B","explain":"m = D × V = 1 500 × 5 = 7 500 kg.","points":0.25},{"type":"mcq","level":"TH","q":"Trọng lượng riêng của nhôm (D = 2 700 kg/m³) là","options":["A. 270 N/m³","B. 2 700 N/m³","C. 27 000 N/m³","D. 270 000 N/m³"],"answer":"C","explain":"d = 10D = 27 000 N/m³.","points":0.25},{"type":"mcq","level":"NB","q":"Chất nào sau đây có khối lượng riêng lớn nhất?","options":["A. Nước (1 000 kg/m³)","B. Nhôm (2 700 kg/m³)","C. Sắt (7 800 kg/m³)","D. Gỗ (700 kg/m³)"],"answer":"C","explain":"Sắt có D = 7 800 kg/m³, lớn nhất trong các chất đã cho.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về ứng dụng của khối lượng riêng.","statements":["a) Đo khối lượng riêng giúp phân biệt vàng thật với vàng giả.","b) Làm máy bay nên chọn vật liệu có khối lượng riêng nhỏ.","c) Có thể tính khối lượng bồn xăng bằng cách đo thể tích rồi nhân với khối lượng riêng.","d) Vật có D nhỏ hơn nước sẽ chìm trong nước."],"answer":["T","T","T","F"],"explain":"Vật có D nhỏ hơn nước sẽ nổi, không phải chìm.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Công thức D = m / V đúng cho mọi chất.","b) Khối lượng riêng của chất lỏng thường nhỏ hơn chất rắn.","c) Không khí có khối lượng riêng xấp xỉ 1,29 kg/m³.","d) Số đo D theo g/cm³ lớn gấp 1 000 lần số đo theo kg/m³."],"answer":["T","T","T","F"],"explain":"Số đo theo g/cm³ nhỏ hơn 1 000 lần số đo theo kg/m³.","points":1},{"type":"short","level":"VDC","q":"Giải thích vì sao dầu ăn luôn nổi lên trên mặt nước khi trộn lẫn? (Trả lời ngắn gọn)","answer":"Vì khối lượng riêng của dầu ăn nhỏ hơn nước","explain":"D dầu ăn = 800 kg/m³ nhỏ hơn D nước = 1 000 kg/m³ nên dầu nổi.","points":0.5},{"type":"short","level":"TH","q":"Thể tích của 39 kg sắt (D = 7 800 kg/m³) là bao nhiêu m³?","answer":"0,005","explain":"V = m / D = 39 / 7 800 = 0,005 m³.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Kí hiệu V trong công thức D = m / V là","options":["A. Khối lượng","B. Thể tích","C. Khối lượng riêng","D. Trọng lượng"],"answer":"B","explain":"V là thể tích của vật (chất).","points":0.25},{"type":"mcq","level":"TH","q":"Một vật có D = 2 500 kg/m³, V = 0,004 m³. Khối lượng của vật là","options":["A. 10 kg","B. 100 kg","C. 625 kg","D. 1 000 kg"],"answer":"A","explain":"m = D × V = 2 500 × 0,004 = 10 kg.","points":0.25},{"type":"mcq","level":"VD","q":"Đổi 13 600 kg/m³ (thủy ngân) sang g/cm³ được","options":["A. 1,36 g/cm³","B. 13,6 g/cm³","C. 136 g/cm³","D. 0,136 g/cm³"],"answer":"B","explain":"Chia cho 1 000: 13 600 / 1 000 = 13,6 g/cm³.","points":0.25},{"type":"mcq","level":"VDC","q":"Để xác định một mẫu kim loại là bạc hay nhôm, cách làm đúng nhất là","options":["A. Nhìn màu sắc","B. Cân khối lượng rồi so sánh","C. Đo khối lượng và thể tích, tính khối lượng riêng rồi đối chiếu bảng số liệu","D. Thả vào nước xem nổi hay chìm"],"answer":"C","explain":"Mỗi kim loại có D đặc trưng: bạc 10 500 kg/m³, nhôm 2 700 kg/m³.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị thường dùng để đo thể tích chất lỏng nhỏ trong phòng thí nghiệm là","options":["A. m³","B. cm³ (ml)","C. kg","D. N"],"answer":"B","explain":"Thể tích nhỏ thường đo bằng cm³ hay ml.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây ĐÚNG?","options":["A. Khối lượng riêng của một chất thay đổi tùy theo lượng chất lấy","B. Cùng một chất, ở cùng điều kiện, khối lượng riêng không đổi","C. Chất khí có khối lượng riêng lớn hơn chất rắn","D. Đơn vị của D là N/m³"],"answer":"B","explain":"D là đặc trưng của chất, không phụ thuộc lượng chất.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) D = m / V.","b) m = D × V.","c) V = D / m.","d) d = 10D."],"answer":["T","T","F","T"],"explain":"Từ D = m / V suy ra V = m / D, không phải D / m.","points":1},{"type":"truefalse","level":"VD","q":"Một bể chứa 3 m³ nước. Đánh giá các nhận định.","statements":["a) Khối lượng nước trong bể là 3 000 kg.","b) Trọng lượng nước trong bể là 30 000 N.","c) Nếu đổ thêm 1 m³ dầu ăn (D = 800 kg/m³) thì tổng khối lượng là 3 800 kg.","d) Dầu ăn sẽ chìm xuống đáy bể."],"answer":["T","T","T","F"],"explain":"Dầu có D nhỏ hơn nước nên nổi lên trên.","points":1},{"type":"short","level":"TH","q":"1 m³ không khí ở điều kiện thường nặng khoảng bao nhiêu kg?","answer":"1,29","explain":"D không khí = 1,29 kg/m³ nên 1 m³ nặng 1,29 kg.","points":0.5},{"type":"short","level":"VDC","q":"Tại sao người ta làm vỏ tàu bằng thép nhưng tàu vẫn nổi? Nêu nguyên tắc vật lý. (Trả lời ngắn gọn)","answer":"Tăng thể tích chiếm chỗ làm khối lượng riêng trung bình nhỏ hơn nước","explain":"Vỏ thép mỏng, khoang rỗng chứa không khí làm D trung bình nhỏ hơn D nước.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"So sánh: 2,7 g/cm³ và 2 700 kg/m³","options":["A. 2,7 g/cm³ lớn hơn","B. 2 700 kg/m³ lớn hơn","C. Hai giá trị bằng nhau","D. Không so sánh được vì khác đơn vị"],"answer":"C","explain":"2,7 g/cm³ = 2,7 × 1 000 = 2 700 kg/m³.","points":0.25},{"type":"mcq","level":"NB","q":"Trọng lượng riêng kí hiệu là","options":["A. D","B. d","C. P","D. m"],"answer":"B","explain":"Trọng lượng riêng kí hiệu là d, đơn vị N/m³.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bình rỗng nặng 0,5 kg. Đổ đầy nước, bình nặng 2,5 kg. Thể tích của bình là","options":["A. 0,002 m³","B. 0,02 m³","C. 2 m³","D. 0,2 m³"],"answer":"A","explain":"m nước = 2 kg; V = m / D = 2 / 1 000 = 0,002 m³.","points":0.25},{"type":"mcq","level":"VD","q":"Một khối gỗ có khối lượng 3,5 kg, thể tích 0,005 m³. Khối lượng riêng của gỗ là","options":["A. 700 kg/m³","B. 7 000 kg/m³","C. 70 kg/m³","D. 1 750 kg/m³"],"answer":"A","explain":"D = 3,5 / 0,005 = 700 kg/m³.","points":0.25},{"type":"mcq","level":"TH","q":"Để đo khối lượng riêng của một hòn đá nhỏ, cần dùng các dụng cụ","options":["A. Cân và thước","B. Cân và bình chia độ","C. Lực kế và nhiệt kế","D. Thước và đồng hồ"],"answer":"B","explain":"Cân để đo m, bình chia độ để đo V, rồi tính D = m / V.","points":0.25},{"type":"mcq","level":"NB","q":"Chất khí có khối lượng riêng như thế nào so với chất rắn, chất lỏng?","options":["A. Lớn hơn rất nhiều","B. Nhỏ hơn rất nhiều","C. Bằng nhau","D. Không so sánh được"],"answer":"B","explain":"D chất khí chỉ khoảng vài kg/m³, nhỏ hơn chất rắn, lỏng hàng trăm lần.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về đổi đơn vị.","statements":["a) 5 000 kg/m³ = 5 g/cm³.","b) 0,9 g/cm³ = 900 kg/m³.","c) 19 300 kg/m³ = 19,3 g/cm³.","d) 100 kg/m³ = 1 g/cm³."],"answer":["T","T","T","F"],"explain":"100 kg/m³ = 0,1 g/cm³.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Khối lượng riêng là khối lượng của một đơn vị thể tích.","b) D = m / V.","c) Đơn vị SI của D là kg/m³.","d) Chất nào càng đặc thì D càng nhỏ."],"answer":["T","T","T","F"],"explain":"Chất càng đặc thì khối lượng riêng càng lớn.","points":1},{"type":"short","level":"VDC","q":"Một vật bằng sắt đặc (D = 7 800 kg/m³) có thể tích 0,01 m³. Nếu khoét rỗng bớt đi một nửa thể tích sắt thì khối lượng còn lại là bao nhiêu kg?","answer":"39","explain":"Thể tích sắt còn 0,005 m³; m = 7 800 × 0,005 = 39 kg.","points":0.5},{"type":"short","level":"TH","q":"Trọng lượng riêng của dầu ăn (D = 800 kg/m³) là bao nhiêu N/m³?","answer":"8000","explain":"d = 10D = 8 000 N/m³.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Công thức liên hệ giữa khối lượng riêng D và trọng lượng riêng d là","options":["A. d = D","B. d = 10D","C. d = D / 10","D. d = 100D"],"answer":"B","explain":"Vì P = 10m nên d = P / V = 10D.","points":0.25},{"type":"mcq","level":"TH","q":"Một vật có khối lượng riêng 1 200 kg/m³ thả vào nước sẽ","options":["A. Nổi","B. Chìm","C. Lơ lửng","D. Tan ra"],"answer":"B","explain":"D vật lớn hơn D nước (1 000 kg/m³) nên vật chìm.","points":0.25},{"type":"mcq","level":"VD","q":"Cần một căn phòng hình hộp chữ nhật dài 5 m, rộng 4 m, cao 3 m. Khối lượng không khí trong phòng xấp xỉ","options":["A. 77,4 kg","B. 774 kg","C. 7,74 kg","D. 7 740 kg"],"answer":"A","explain":"V = 60 m³; m = 1,29 × 60 = 77,4 kg.","points":0.25},{"type":"mcq","level":"VDC","q":"Có hai thỏi kim loại A và B. Thỏi A có m = 54 g, V = 20 cm³; thỏi B có m = 78 g, V = 10 cm³. Kết luận nào đúng?","options":["A. A là nhôm, B là sắt","B. A là sắt, B là chì","C. Cả hai đều là nhôm","D. Cả hai đều là sắt"],"answer":"A","explain":"D(A) = 2,7 g/cm³ (nhôm); D(B) = 7,8 g/cm³ (sắt).","points":0.25},{"type":"mcq","level":"NB","q":"Để nhận biết chất liệu của một vật rắn, người ta có thể dựa vào","options":["A. Màu sắc của vật","B. Khối lượng riêng của chất làm vật","C. Hình dạng của vật","D. Nhiệt độ của vật"],"answer":"B","explain":"Mỗi chất có khối lượng riêng đặc trưng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi nhiệt độ tăng, khối lượng riêng của một chất thường","options":["A. Tăng lên","B. Giảm xuống","C. Không đổi","D. Bằng không"],"answer":"B","explain":"Nhiệt độ tăng, chất nở ra, thể tích tăng nên D = m / V giảm.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về thực hành đo khối lượng riêng.","statements":["a) Dùng cân để xác định khối lượng vật.","b) Dùng bình chia độ để xác định thể tích chất lỏng.","c) Đo thể tích hòn đá bằng cách thả vào bình chia độ chứa nước.","d) Chỉ cần cân là đủ để tính được khối lượng riêng."],"answer":["T","T","T","F"],"explain":"Cần thêm thể tích mới tính được D = m / V.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về nổi - chìm.","statements":["a) Nước đá (D = 900 kg/m³) nổi trên mặt nước.","b) Hòn sắt đặc chìm trong thủy ngân (D = 13 600 kg/m³).","c) Gỗ (D = 700 kg/m³) chìm trong dầu ăn (D = 800 kg/m³).","d) Tàu ngầm có thể nổi, chìm nhờ thay đổi khối lượng riêng trung bình."],"answer":["T","F","F","T"],"explain":"Sắt nổi trong thủy ngân vì D sắt nhỏ hơn; gỗ nổi trong dầu ăn vì D gỗ nhỏ hơn.","points":1},{"type":"short","level":"TH","q":"Một chai đựng 1,5 lít dầu ăn (D = 800 kg/m³). Khối lượng dầu trong chai là bao nhiêu kg?","answer":"1,2","explain":"V = 0,0015 m³; m = 800 × 0,0015 = 1,2 kg.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao vào mùa đông, ống nước ngoài trời có thể bị vỡ khi nước đóng băng? (Trả lời ngắn gọn)","answer":"Vì nước đóng băng nở ra làm thể tích tăng","explain":"Nước đóng băng thể tích tăng đột ngột gây áp lực làm vỡ ống.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"TH","q":"Đơn vị nào sau đây KHÔNG phải đơn vị của khối lượng riêng?","options":["A. kg/m³","B. g/cm³","C. kg/dm³","D. N/m³"],"answer":"D","explain":"N/m³ là đơn vị của trọng lượng riêng.","points":0.25},{"type":"mcq","level":"NB","q":"Kí hiệu m trong công thức D = m / V là","options":["A. Khối lượng riêng","B. Khối lượng","C. Thể tích","D. Trọng lượng"],"answer":"B","explain":"m là khối lượng của vật (chất).","points":0.25},{"type":"mcq","level":"VDC","q":"Một hợp kim gồm đồng và nhôm có khối lượng riêng 5 000 kg/m³. Có thể xác định tỉ lệ đồng - nhôm không?","options":["A. Có, vì D hợp kim nằm giữa D đồng và D nhôm","B. Không, vì không đủ dữ kiện","C. Chỉ xác định được nếu biết thể tích","D. Chỉ xác định được nếu biết khối lượng"],"answer":"A","explain":"D hợp kim phụ thuộc tỉ lệ pha trộn giữa hai kim loại có D khác nhau.","points":0.25},{"type":"mcq","level":"VD","q":"Một bể bơi chứa 50 m³ nước. Khối lượng nước trong bể là","options":["A. 5 000 kg","B. 50 000 kg","C. 500 kg","D. 500 000 kg"],"answer":"B","explain":"m = 1 000 × 50 = 50 000 kg = 50 tấn.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây SAI?","options":["A. D = m / V","B. 1 g/cm³ = 1 000 kg/m³","C. Mỗi chất có D xác định ở điều kiện nhất định","D. D của chất khí lớn hơn D của chất rắn"],"answer":"D","explain":"D của chất khí nhỏ hơn chất rắn rất nhiều.","points":0.25},{"type":"mcq","level":"NB","q":"Trọng lượng riêng của nước là","options":["A. 1 000 N/m³","B. 10 000 N/m³","C. 100 N/m³","D. 100 000 N/m³"],"answer":"B","explain":"d = 10D = 10 × 1 000 = 10 000 N/m³.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các tính toán sau (D nước = 1 000 kg/m³).","statements":["a) 0,25 m³ nước nặng 250 kg.","b) 2 000 kg nước có thể tích 2 m³.","c) Trọng lượng của 0,1 m³ sắt là 7 800 N.","d) 1 lít nước nặng 1 kg."],"answer":["T","T","T","T"],"explain":"0,1 m³ sắt: m = 780 kg, P = 7 800 N; 1 lít = 0,001 m³ nặng 1 kg.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Cùng thể tích, chất có D lớn hơn thì nặng hơn.","b) Cùng khối lượng, chất có D lớn hơn thì thể tích nhỏ hơn.","c) D cho biết khối lượng của một đơn vị thể tích.","d) Đo D bằng nhiệt kế."],"answer":["T","T","T","F"],"explain":"Không đo trực tiếp D bằng nhiệt kế.","points":1},{"type":"short","level":"VDC","q":"Một mẫu đá có khối lượng 270 g, thể tích 100 cm³. Khối lượng riêng của mẫu đá theo g/cm³ là bao nhiêu?","answer":"2,7","explain":"D = 270 / 100 = 2,7 g/cm³.","points":0.5},{"type":"short","level":"TH","q":"Vật nào chìm trong nước: gỗ (700 kg/m³), nhựa (1 200 kg/m³) hay xốp (200 kg/m³)?","answer":"Nhựa","explain":"Nhựa có D = 1 200 kg/m³ lớn hơn D nước nên chìm.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Khối lượng riêng của nhôm là 2 700 kg/m³. Phát biểu nào đúng?","options":["A. 1 m³ nhôm nặng 2 700 kg","B. 1 kg nhôm có thể tích 2 700 m³","C. 2 700 m³ nhôm nặng 1 kg","D. 1 cm³ nhôm nặng 2 700 g"],"answer":"A","explain":"D = 2 700 kg/m³ nghĩa là 1 m³ nhôm có khối lượng 2 700 kg.","points":0.25},{"type":"mcq","level":"TH","q":"Một vật có thể tích 2 dm³, khối lượng riêng 800 kg/m³. Khối lượng của vật là","options":["A. 1 600 kg","B. 1,6 kg","C. 16 kg","D. 0,16 kg"],"answer":"B","explain":"V = 0,002 m³; m = 800 × 0,002 = 1,6 kg.","points":0.25},{"type":"mcq","level":"VD","q":"Thả một viên bi sắt đặc (D = 7 800 kg/m³) vào cốc thủy ngân (D = 13 600 kg/m³). Hiện tượng xảy ra là","options":["A. Viên bi chìm xuống đáy","B. Viên bi nổi trên mặt thủy ngân","C. Viên bi lơ lửng","D. Viên bi tan ra"],"answer":"B","explain":"D sắt nhỏ hơn D thủy ngân nên viên bi nổi.","points":0.25},{"type":"mcq","level":"VDC","q":"Một can nhựa 10 lít đựng đầy xăng (D = 700 kg/m³). Nếu đổ đầy nước thì khối lượng chất lỏng tăng thêm bao nhiêu kg?","options":["A. 3 kg","B. 10 kg","C. 7 kg","D. 17 kg"],"answer":"A","explain":"m xăng = 7 kg; m nước = 10 kg; tăng thêm 3 kg.","points":0.25},{"type":"mcq","level":"NB","q":"Dụng cụ đo khối lượng là","options":["A. Bình chia độ","B. Cân","C. Thước dây","D. Ampe kế"],"answer":"B","explain":"Cân dùng để đo khối lượng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đo khối lượng riêng của hòn đá, thể tích hòn đá được xác định bằng cách","options":["A. Đo bằng thước rồi tính","B. Thả hòn đá vào bình chia độ chứa nước, đo độ dâng thể tích nước","C. Ước lượng bằng mắt","D. Cân hòn đá"],"answer":"B","explain":"Độ chênh lệch mực nước trong bình chia độ cho thể tích hòn đá.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về bảng khối lượng riêng.","statements":["a) Vàng có D = 19 300 kg/m³.","b) Chì có D = 11 300 kg/m³.","c) Bạc có D = 2 700 kg/m³.","d) Thủy ngân có D = 13 600 kg/m³."],"answer":["T","T","F","T"],"explain":"Bạc có D = 10 500 kg/m³; 2 700 kg/m³ là của nhôm.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) 1 cm³ vàng nặng 19,3 g.","b) 1 m³ gỗ (D = 700 kg/m³) nặng 700 kg.","c) 10 lít nước nặng 100 kg.","d) Không khí trong căn phòng 60 m³ nặng khoảng 77 kg."],"answer":["T","T","F","T"],"explain":"10 lít = 0,01 m³ nặng 10 kg.","points":1},{"type":"short","level":"TH","q":"Khối lượng của 0,5 m³ bê tông (D = 2 400 kg/m³) là bao nhiêu kg?","answer":"1200","explain":"m = 2 400 × 0,5 = 1 200 kg.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao khinh khí cầu bơm khí nóng có thể bay lên? (Trả lời ngắn gọn)","answer":"Vì khí nóng có khối lượng riêng nhỏ hơn không khí lạnh","explain":"Khí nóng nở ra, D giảm, nhẹ hơn không khí xung quanh nên bay lên.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Biết m = 6 kg, D = 1 500 kg/m³. Thể tích V là","options":["A. 9 000 m³","B. 0,004 m³","C. 250 m³","D. 0,25 m³"],"answer":"B","explain":"V = m / D = 6 / 1 500 = 0,004 m³.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị đo thể tích trong hệ SI là","options":["A. lít","B. m³","C. cm³","D. ml"],"answer":"B","explain":"Đơn vị SI của thể tích là mét khối (m³).","points":0.25},{"type":"mcq","level":"VDC","q":"Một thùng phuy 200 lít đựng đầy dầu (D = 800 kg/m³). Khối lượng dầu trong phuy và trọng lượng tương ứng là","options":["A. 160 kg; 1 600 N","B. 16 kg; 160 N","C. 1 600 kg; 16 000 N","D. 200 kg; 2 000 N"],"answer":"A","explain":"V = 0,2 m³; m = 160 kg; P = 1 600 N.","points":0.25},{"type":"mcq","level":"VD","q":"Hai vật A và B có cùng khối lượng 1 kg. Vật A bằng xốp (D = 200 kg/m³), vật B bằng sắt (D = 7 800 kg/m³). So sánh thể tích","options":["A. V(A) lớn hơn V(B)","B. V(B) lớn hơn V(A)","C. V(A) = V(B)","D. Không so sánh được"],"answer":"A","explain":"V = m / D; D càng nhỏ thì V càng lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây ĐÚNG về trọng lượng riêng?","options":["A. d = P / V, đơn vị N/m³","B. d = m / V, đơn vị kg/m³","C. d = D, đơn vị kg/m³","D. d = 100D"],"answer":"A","explain":"Trọng lượng riêng d = P / V, đơn vị N/m³, và d = 10D.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các chất sau, chất có khối lượng riêng nhỏ nhất là","options":["A. Sắt","B. Nước","C. Không khí","D. Dầu ăn"],"answer":"C","explain":"Không khí có D = 1,29 kg/m³, nhỏ nhất.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định tổng hợp.","statements":["a) D = m / V; m = D × V; V = m / D.","b) d = P / V = 10D.","c) 1 g/cm³ = 1 000 kg/m³.","d) Vật có D bằng D nước sẽ chìm hoàn toàn xuống đáy."],"answer":["T","T","T","F"],"explain":"Vật có D bằng D nước sẽ lơ lửng trong nước, không chìm xuống đáy.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Khối lượng riêng đặc trưng cho từng chất.","b) Đo D giúp nhận biết vật liệu.","c) Làm tàu thủy cần vật liệu có D trung bình lớn.","d) D của nước đá nhỏ hơn D của nước lỏng."],"answer":["T","T","F","T"],"explain":"Tàu thủy cần D trung bình nhỏ để nổi; D nước đá (900 kg/m³) nhỏ hơn D nước lỏng (1 000 kg/m³).","points":1},{"type":"short","level":"VDC","q":"Một quả cầu bằng đồng đặc có khối lượng 8,9 kg (D = 8 900 kg/m³). Thể tích của quả cầu là bao nhiêu m³?","answer":"0,001","explain":"V = 8,9 / 8 900 = 0,001 m³.","points":0.5},{"type":"short","level":"TH","q":"Đơn vị của trọng lượng riêng là gì?","answer":"N/m³","explain":"Trọng lượng riêng d = P / V có đơn vị N/m³.","points":0.5}]}]}
