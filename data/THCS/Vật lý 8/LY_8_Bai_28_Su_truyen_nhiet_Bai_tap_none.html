ng chủ yếu đối lưu.","points":0.25},{"type":"mcq","level":"VD","q":"Trong chân không, nhiệt truyền được bằng","options":["A. Bức xạ nhiệt","B. Dẫn nhiệt","C. Đối lưu","D. Không truyền được"],"answer":"A","explain":"Chỉ bức xạ qua được chân không.","points":0.25},{"type":"mcq","level":"VDC","q":"Các nhà du hành vũ trụ mặc áo đặc biệt vì ngoài không gian","options":["A. Không có không khí, nhiệt chỉ truyền bằng bức xạ nên cần áo cách nhiệt đặc biệt","B. Quá nóng","C. Quá lạnh","D. Không có trọng lực"],"answer":"A","explain":"Chân không: chỉ bức xạ nhiệt.","points":0.25},{"type":"mcq","level":"NB","q":"Bề mặt nào hấp thụ bức xạ nhiệt tốt nhất?","options":["A. Xù xì, màu sẫm","B. Nhẵn, màu sáng","C. Nhẵn, màu sẫm","D. Xù xì, màu sáng"],"answer":"A","explain":"Xù xì, sẫm màu hấp thụ tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Bề mặt nào phản xạ bức xạ nhiệt tốt nhất?","options":["A. Nhẵn, màu sáng","B. Xù xì, màu sẫm","C. Nhẵn, màu sẫm","D. Xù xì, màu sáng"],"answer":"A","explain":"Nhẵn, sáng màu phản xạ tốt.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Rắn: chủ yếu dẫn nhiệt.","b) Lỏng, khí: chủ yếu đối lưu.","c) Chân không: chỉ bức xạ.","d) Rắn: chủ yếu đối lưu."],"answer":["T","T","T","F"],"explain":"Chất rắn không đối lưu.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) Xù xì sẫm màu: hấp thụ tốt.","b) Nhẵn sáng màu: phản xạ tốt.","c) Mọi bề mặt hấp thụ như nhau.","d) Bề mặt ảnh hưởng hấp thụ bức xạ."],"answer":["T","T","F","T"],"explain":"Bề mặt ảnh hưởng khả năng hấp thụ.","points":1},{"type":"short","level":"TH","q":"Nêu hình thức truyền nhiệt chủ yếu trong từng môi trường: rắn, lỏng, chân không.","answer":"Rắn dẫn nhiệt, lỏng đối lưu, chân không bức xạ","explain":"Ba môi trường.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao phích nước nóng có vỏ tráng bạc? (Trả lời ngắn gọn)","answer":"Để hạn chế bức xạ nhiệt","explain":"Bề mặt nhẵn bóng.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Trong các ứng dụng sau, ứng dụng nào dùng đối lưu?","options":["A. Hệ thống sưởi ấm","B. Xoong nhôm","C. Cán nhựa","D. Bình thủy"],"answer":"A","explain":"Sưởi ấm dùng đối lưu không khí.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các ứng dụng sau, ứng dụng nào dùng dẫn nhiệt?","options":["A. Xoong nhôm nấu ăn","B. Gió","C. Nắng","D. Điều hòa"],"answer":"A","explain":"Xoong nhôm dẫn nhiệt tốt.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh nói: Phơi quần áo ngoài nắng, quần áo khô nhờ cả bức xạ nhiệt và đối lưu. Đúng hay sai?","options":["A. Đúng, nắng (bức xạ) làm nóng, gió (đối lưu) làm bay hơi nhanh","B. Sai","C. Chỉ bức xạ","D. Chỉ đối lưu"],"answer":"A","explain":"Cả hai hình thức cùng tác dụng.","points":0.25},{"type":"mcq","level":"VD","q":"Khi nấu canh bằng nồi đất (dẫn nhiệt kém hơn nhôm), thời gian nấu sẽ","options":["A. Lâu hơn","B. Nhanh hơn","C. Như nhau","D. Không nấu được"],"answer":"A","explain":"Dẫn nhiệt kém thì truyền nhiệt chậm.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào ĐÚNG?","options":["A. Mỗi hiện tượng có thể có nhiều hình thức truyền nhiệt cùng xảy ra","B. Mỗi hiện tượng chỉ có một hình thức","C. Dẫn nhiệt không xảy ra trong đời sống","D. Bức xạ chỉ xảy ra ngoài vũ trụ"],"answer":"A","explain":"Nhiều hiện tượng có nhiều hình thức cùng xảy ra.","points":0.25},{"type":"mcq","level":"NB","q":"Ba hình thức truyền nhiệt là","options":["A. Dẫn nhiệt, đối lưu, bức xạ nhiệt","B. Dẫn nhiệt, đối lưu, bay hơi","C. Dẫn điện, đối lưu, bức xạ","D. Dẫn nhiệt, ngưng tụ, bức xạ"],"answer":"A","explain":"Ba hình thức.","points":0.25},{"type":"truefalse","level":"VD","q":"Tổng hợp. Đánh giá các nhận định.","statements":["a) Dẫn nhiệt: tiếp xúc, rắn chủ yếu.","b) Đối lưu: dòng lỏng/khí.","c) Bức xạ: tia nhiệt, qua chân không.","d) Mỗi hiện tượng chỉ có đúng một hình thức."],"answer":["T","T","T","F"],"explain":"Nhiều hình thức có thể cùng xảy ra.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Có 3 hình thức truyền nhiệt.","b) Kim loại dẫn nhiệt tốt.","c) Đối lưu trong lỏng và khí.","d) Bức xạ cần không khí."],"answer":["T","T","T","F"],"explain":"Bức xạ không cần môi trường.","points":1},{"type":"short","level":"VDC","q":"Nêu một hiện tượng có cả ba hình thức truyền nhiệt cùng xảy ra.","answer":"Đun nước bằng ấm trên bếp lửa","explain":"Dẫn qua đáy, đối lưu trong nước, bức xạ từ lửa.","points":0.5},{"type":"short","level":"TH","q":"Nêu tên ba hình thức truyền nhiệt và môi trường chủ yếu của mỗi hình thức.","answer":"Dẫn nhiệt (rắn), đối lưu (lỏng khí), bức xạ (chân không)","explain":"Ba hình thức và môi trường.","points":0.5}]}]}
