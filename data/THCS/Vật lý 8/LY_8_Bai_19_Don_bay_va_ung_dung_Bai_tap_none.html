{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Đòn bẩy là","options":["A. Thanh cứng có thể quay quanh một điểm cố định gọi là điểm tựa","B. Thanh mềm uốn cong được","C. Sợi dây treo vật","D. Mặt phẳng nghiêng"],"answer":"A","explain":"Đòn bẩy là thanh cứng quay quanh điểm tựa O.","points":0.25},{"type":"mcq","level":"TH","q":"Điều kiện cân bằng của đòn bẩy là","options":["A. F₁ × d₁ = F₂ × d₂","B. F₁ + d₁ = F₂ + d₂","C. F₁ / d₁ = F₂ / d₂","D. F₁ - F₂ = d₁ - d₂"],"answer":"A","explain":"Quy tắc moment: F₁d₁ = F₂d₂.","points":0.25},{"type":"mcq","level":"VD","q":"Dùng xà beng dài 1,5 m bẩy hòn đá 600 N, điểm tựa cách hòn đá 0,3 m. Lực tối thiểu cần tác dụng là","options":["A. 120 N","B. 150 N","C. 3 000 N","D. 180 N"],"answer":"B","explain":"d₁ = 1,2 m; F₁ = 600 × 0,3 / 1,2 = 150 N.","points":0.25},{"type":"mcq","level":"VDC","q":"Xe cút kít chở đất 400 N đặt cách trục bánh xe 0,4 m; tay cầm cách trục 1,6 m. Lực tay cần để giữ cân bằng là","options":["A. 100 N","B. 1 600 N","C. 160 N","D. 64 N"],"answer":"A","explain":"F₁ = 400 × 0,4 / 1,6 = 100 N.","points":0.25},{"type":"mcq","level":"NB","q":"Điểm tựa của đòn bẩy kí hiệu là","options":["A. F","B. O","C. M","D. d"],"answer":"B","explain":"Điểm tựa kí hiệu là O.","points":0.25},{"type":"mcq","level":"TH","q":"Đòn bẩy cho ta lợi về lực khi","options":["A. d₁ lớn hơn d₂","B. d₁ nhỏ hơn d₂","C. d₁ bằng d₂","D. F₁ bằng F₂"],"answer":"A","explain":"d₁ lớn hơn d₂ thì F₁ nhỏ hơn F₂: lợi về lực.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Đòn bẩy là thanh cứng quay quanh điểm tựa.","b) Điểm tựa kí hiệu là O.","c) F₁ là lực tác dụng, F₂ là lực cản.","d) Đòn bẩy không thể cân bằng."],"answer":["T","T","T","F"],"explain":"Đòn bẩy cân bằng khi F₁d₁ = F₂d₂.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các tính toán đòn bẩy.","statements":["a) F₂ = 100 N, d₂ = 0,5 m, d₁ = 2 m → F₁ = 25 N.","b) F₂ = 200 N, d₂ = 0,3 m, d₁ = 1,5 m → F₁ = 40 N.","c) F₁ = 50 N, d₁ = 1 m, d₂ = 0,25 m → F₂ = 200 N.","d) F₁ = 50 N, d₁ = 1 m, F₂ = 100 N → d₂ = 2 m."],"answer":["T","T","T","F"],"explain":"d₂ = 50 × 1 / 100 = 0,5 m.","points":1},{"type":"short","level":"TH","q":"Một đòn bẩy có d₁ = 1,2 m, d₂ = 0,3 m, F₂ = 200 N. Tính F₁ (N) để cân bằng.","answer":"50","explain":"F₁ = 200 × 0,3 / 1,2 = 50 N.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao dùng xà beng bẩy đá nặng lại nhẹ nhàng? (Trả lời ngắn gọn)","answer":"Vì đòn bẩy cho lợi về lực khi cánh tay đòn của lực lớn","explain":"d₁ lớn hơn d₂ nên F₁ nhỏ hơn F₂.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"TH","q":"Trong các dụng cụ sau, dụng cụ nào là đòn bẩy loại 2 (vật ở giữa)?","options":["A. Kìm","B. Xe cút kít","C. Nhíp gắp","D. Bập bênh"],"answer":"B","explain":"Xe cút kít: điểm tựa ở bánh xe, vật ở giữa.","points":0.25},{"type":"mcq","level":"NB","q":"Bập bênh thuộc loại đòn bẩy nào?","options":["A. Loại 1 (điểm tựa ở giữa)","B. Loại 2 (vật ở giữa)","C. Loại 3 (lực ở giữa)","D. Không phải đòn bẩy"],"answer":"A","explain":"Bập bênh có điểm tựa ở giữa.","points":0.25},{"type":"mcq","level":"VDC","q":"Một thanh nhẹ dài 2 m làm đòn bẩy, điểm tựa cách một đầu 0,5 m. Treo vật 80 N ở đầu gần điểm tựa, cần lực bao nhiêu ở đầu kia để cân bằng?","options":["A. 26,7 N","B. 240 N","C. 80 N","D. 20 N"],"answer":"A","explain":"d₂ = 0,5 m, d₁ = 1,5 m; F₁ = 80 × 0,5 / 1,5 ≈ 26,7 N.","points":0.25},{"type":"mcq","level":"VD","q":"Kìm cắt dây: tay tác dụng lực 30 N cách chốt 0,12 m; dây đặt cách chốt 0,03 m. Lực kìm tác dụng lên dây là","options":["A. 7,5 N","B. 120 N","C. 90 N","D. 360 N"],"answer":"B","explain":"F₂ = 30 × 0,12 / 0,03 = 120 N.","points":0.25},{"type":"mcq","level":"TH","q":"Nhíp gắp thuộc loại đòn bẩy nào?","options":["A. Loại 1","B. Loại 2","C. Loại 3 (lực ở giữa, thiệt về lực)","D. Không phải đòn bẩy"],"answer":"C","explain":"Nhíp: điểm tựa ở đầu, lực tác dụng ở giữa.","points":0.25},{"type":"mcq","level":"NB","q":"Lực cản F₂ thường là","options":["A. Lực của tay người","B. Trọng lượng của vật cần nâng","C. Lực ma sát","D. Lực đẩy Archimedes"],"answer":"B","explain":"F₂ thường là trọng lượng vật cần nâng.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về ba loại đòn bẩy.","statements":["a) Loại 1: điểm tựa ở giữa lực và vật.","b) Loại 2: vật ở giữa, luôn lợi về lực.","c) Loại 3: lực ở giữa, luôn thiệt về lực.","d) Xe cút kít là đòn bẩy loại 3."],"answer":["T","T","T","F"],"explain":"Xe cút kít là đòn bẩy loại 2.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Đòn bẩy quay quanh điểm tựa O.","b) F₁d₁ = F₂d₂ khi cân bằng.","c) d₁ lớn hơn d₂ thì lợi về lực.","d) Mọi đòn bẩy đều lợi về lực."],"answer":["T","T","T","F"],"explain":"Đòn bẩy loại 3 thiệt về lực.","points":1},{"type":"short","level":"VDC","q":"Cần câu cá thuộc loại đòn bẩy nào?","answer":"Loại 3","explain":"Điểm tựa ở tay cầm đầu cần, lực ở giữa.","points":0.5},{"type":"short","level":"TH","q":"Viết tỉ số giữa F₁ và F₂ theo d₁, d₂ khi đòn bẩy cân bằng.","answer":"F₁ / F₂ = d₂ / d₁","explain":"Từ F₁d₁ = F₂d₂ suy ra tỉ số.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Cánh tay đòn d₁ là khoảng cách từ điểm tựa đến","options":["A. Điểm đặt vật","B. Giá của lực tác dụng F₁","C. Đầu thanh","D. Mặt đất"],"answer":"B","explain":"d₁ là cánh tay đòn của lực F₁.","points":0.25},{"type":"mcq","level":"TH","q":"Khi d₁ = d₂ thì","options":["A. F₁ = F₂","B. F₁ lớn hơn F₂","C. F₁ nhỏ hơn F₂","D. Không so sánh được"],"answer":"A","explain":"F₁d₁ = F₂d₂, d₁ = d₂ nên F₁ = F₂.","points":0.25},{"type":"mcq","level":"VD","q":"Một người dùng đòn bẩy để nâng vật 500 N. Biết d₁ = 2 m, d₂ = 0,5 m. Lực cần tác dụng là","options":["A. 125 N","B. 2 000 N","C. 250 N","D. 1 000 N"],"answer":"A","explain":"F₁ = 500 × 0,5 / 2 = 125 N.","points":0.25},{"type":"mcq","level":"VDC","q":"Thanh AB dài 1,2 m, điểm tựa O ở giữa (OA = OB = 0,6 m). Treo vật 30 N tại A và vật 20 N tại điểm cách O 0,4 m về phía B. Hỏi phải treo thêm vật nặng bao nhiêu tại đầu B để thanh cân bằng?","options":["A. 10 N","B. 16,7 N","C. 50 N","D. 25 N"],"answer":"B","explain":"Moment tại A: 30 x 0,6 = 18 N.m; moment vật 20 N (phía B): 20 x 0,4 = 8 N.m ngược chiều; còn thiếu 10 N.m → treo tại B: F x 0,6 = 10 → F ≈ 16,7 N.","points":0.25},{"type":"mcq","level":"NB","q":"Cái mở nắp chai là đòn bẩy loại","options":["A. Loại 1","B. Loại 2","C. Loại 3","D. Không phải đòn bẩy"],"answer":"B","explain":"Điểm tựa ở đầu, nắp chai (vật) ở giữa.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào SAI?","options":["A. Đòn bẩy loại 2 luôn lợi về lực","B. Đòn bẩy loại 3 luôn thiệt về lực","C. Đòn bẩy loại 1 không bao giờ lợi về lực","D. F₁d₁ = F₂d₂"],"answer":"C","explain":"Đòn bẩy loại 1 có thể lợi về lực nếu d₁ lớn hơn d₂.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các ví dụ.","statements":["a) Kìm, kéo là đòn bẩy loại 1.","b) Xe cút kít là đòn bẩy loại 2.","c) Nhíp, cần câu là đòn bẩy loại 3.","d) Bập bênh là đòn bẩy loại 2."],"answer":["T","T","T","F"],"explain":"Bập bênh là đòn bẩy loại 1.","points":1},{"type":"truefalse","level":"VD","q":"Một đòn bẩy loại 2 có d₁ = 1,8 m, d₂ = 0,6 m. Đánh giá.","statements":["a) Đòn bẩy này lợi về lực 3 lần.","b) Để nâng vật 300 N cần lực 100 N.","c) Điểm tựa ở một đầu của đòn bẩy.","d) Đòn bẩy loại 2 luôn thiệt về lực."],"answer":["T","T","T","F"],"explain":"Loại 2 luôn lợi về lực.","points":1},{"type":"short","level":"TH","q":"Đòn bẩy có F₂ = 120 N, d₂ = 0,4 m, d₁ = 1,6 m. Tính F₁ (N).","answer":"30","explain":"F₁ = 120 × 0,4 / 1,6 = 30 N.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao kìm cắt dây có cán dài? (Trả lời ngắn gọn)","answer":"Để tăng cánh tay đòn của lực tay, lợi về lực","explain":"d₁ lớn thì F₂ lớn với cùng F₁.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Đòn bẩy loại 3 có đặc điểm","options":["A. Luôn lợi về lực","B. Luôn thiệt về lực nhưng lợi về đường đi","C. Điểm tựa ở giữa","D. Vật ở giữa"],"answer":"B","explain":"Loại 3: lực ở giữa, d₁ nhỏ hơn d₂ nên thiệt về lực.","points":0.25},{"type":"mcq","level":"NB","q":"Trong cơ thể người, cẳng tay là đòn bẩy loại","options":["A. Loại 1","B. Loại 2","C. Loại 3","D. Không phải đòn bẩy"],"answer":"C","explain":"Khớp khuỷu tay là điểm tựa, cơ tác dụng lực ở giữa.","points":0.25},{"type":"mcq","level":"VDC","q":"Dùng một thanh sắt dài 2 m làm đòn bẩy để nâng hòn đá 800 N. Đặt điểm tựa cách hòn đá 0,4 m. Lực nhỏ nhất cần tác dụng vào đầu thanh là","options":["A. 160 N","B. 200 N","C. 4 000 N","D. 320 N"],"answer":"B","explain":"d₁ = 1,6 m; F₁ = 800 × 0,4 / 1,6 = 200 N.","points":0.25},{"type":"mcq","level":"VD","q":"Bập bênh: bạn A nặng 350 N ngồi cách trục 1,4 m; bạn B ngồi cách trục 1,0 m phía bên kia. Để cân bằng, bạn B nặng","options":["A. 250 N","B. 490 N","C. 350 N","D. 245 N"],"answer":"B","explain":"F_B = 350 × 1,4 / 1,0 = 490 N.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn đòn bẩy lợi về lực nhiều hơn, ta nên","options":["A. Đặt điểm tựa gần vật hơn","B. Đặt điểm tựa xa vật hơn","C. Rút ngắn đòn bẩy","D. Tăng trọng lượng vật"],"answer":"A","explain":"Điểm tựa gần vật thì d₂ nhỏ, d₁ lớn → lợi về lực.","points":0.25},{"type":"mcq","level":"NB","q":"Xà beng là đòn bẩy loại","options":["A. Loại 1","B. Loại 2","C. Loại 3","D. Không phải đòn bẩy"],"answer":"A","explain":"Xà beng có điểm tựa ở giữa lực và vật.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về lợi về lực.","statements":["a) d₁ lớn hơn d₂ thì F₁ nhỏ hơn F₂: lợi về lực.","b) d₁ nhỏ hơn d₂ thì F₁ lớn hơn F₂: thiệt về lực.","c) Lợi về lực thì thiệt về đường đi.","d) Có thể vừa lợi về lực vừa lợi về đường đi."],"answer":["T","T","T","F"],"explain":"Được lợi về lực thì thiệt về đường đi và ngược lại.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Đòn bẩy là thanh cứng.","b) Đòn bẩy quay quanh điểm tựa.","c) F₁d₁ = F₂d₂ khi cân bằng.","d) Điểm tựa luôn ở giữa thanh."],"answer":["T","T","T","F"],"explain":"Điểm tựa có thể ở đầu thanh (loại 2, 3).","points":1},{"type":"short","level":"VDC","q":"Tại sao người ta làm cán kìm dài? (Trả lời ngắn gọn)","answer":"Để lợi về lực, cắt dễ dàng","explain":"d₁ lớn tạo moment lớn.","points":0.5},{"type":"short","level":"TH","q":"Một đòn bẩy cân bằng có F₁ = 60 N, d₁ = 0,9 m, d₂ = 0,3 m. Tính F₂ (N).","answer":"180","explain":"F₂ = 60 × 0,9 / 0,3 = 180 N.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Khi đòn bẩy cân bằng, moment của lực tác dụng và moment của lực cản","options":["A. Cùng chiều và bằng nhau","B. Ngược chiều và bằng nhau","C. Cùng chiều và khác nhau","D. Không liên quan"],"answer":"B","explain":"Hai moment ngược chiều, độ lớn bằng nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Một đòn bẩy có d₁ gấp 4 lần d₂ thì","options":["A. F₁ gấp 4 lần F₂","B. F₁ bằng 1/4 F₂","C. F₁ bằng F₂","D. F₁ gấp 2 lần F₂"],"answer":"B","explain":"F₁/F₂ = d₂/d₁ = 1/4.","points":0.25},{"type":"mcq","level":"VD","q":"Để nâng vật 1 000 N bằng đòn bẩy mà chỉ có thể tác dụng lực tối đa 250 N, cần tỉ số d₁/d₂ tối thiểu là","options":["A. 1/4","B. 4","C. 2","D. 1/2"],"answer":"B","explain":"d₁/d₂ = F₂/F₁ = 1 000/250 = 4.","points":0.25},{"type":"mcq","level":"VDC","q":"Một người gánh lúa: đòn gánh dài 1,6 m, quang gánh nặng 400 N treo cách vai 0,6 m. Để gánh cân bằng, tay phải tác dụng lực bao nhiêu tại đầu còn lại? (bỏ qua trọng lượng đòn)","options":["A. 240 N","B. 150 N","C. 400 N","D. 640 N"],"answer":"A","explain":"Vai là điểm tựa; d₂ = 0,6 m, d₁ = 1,0 m; F₁ = 400 × 0,6 / 1,0 = 240 N.","points":0.25},{"type":"mcq","level":"NB","q":"Kéo cắt vải là đòn bẩy loại","options":["A. Loại 1","B. Loại 2","C. Loại 3","D. Không phải đòn bẩy"],"answer":"A","explain":"Kéo có điểm tựa (chốt) ở giữa.","points":0.25},{"type":"mcq","level":"TH","q":"Đòn bẩy nào sau đây thiệt về lực?","options":["A. Xà beng","B. Xe cút kít","C. Nhíp gắp","D. Cái mở nắp chai"],"answer":"C","explain":"Nhíp là đòn bẩy loại 3, thiệt về lực.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) F₁ là lực của tay người tác dụng.","b) F₂ thường là trọng lượng vật cần nâng.","c) d₁, d₂ là cánh tay đòn của F₁, F₂.","d) F₁ luôn nhỏ hơn F₂."],"answer":["T","T","T","F"],"explain":"Đòn bẩy loại 3 thì F₁ lớn hơn F₂.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các tình huống.","statements":["a) Xà beng bẩy đá: lợi về lực.","b) Kìm cắt dây: lợi về lực.","c) Cần câu cá: thiệt về lực nhưng vung cần nhanh.","d) Xe cút kít: thiệt về lực."],"answer":["T","T","T","F"],"explain":"Xe cút kít lợi về lực (loại 2).","points":1},{"type":"short","level":"TH","q":"Đòn bẩy cân bằng: F₂ = 90 N, d₂ = 0,5 m, d₁ = 1,5 m. Tính F₁ (N).","answer":"30","explain":"F₁ = 90 × 0,5 / 1,5 = 30 N.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao thợ xây dùng xe cút kít chở gạch nhẹ hơn gánh? (Trả lời ngắn gọn)","answer":"Vì xe cút kít là đòn bẩy loại 2 lợi về lực","explain":"d₁ lớn hơn d₂ nên F₁ nhỏ hơn F₂.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Công thức nào đúng cho đòn bẩy cân bằng?","options":["A. F₁ × d₂ = F₂ × d₁","B. F₁ × d₁ = F₂ × d₂","C. F₁ + F₂ = d₁ + d₂","D. F₁ / F₂ = d₁ / d₂"],"answer":"B","explain":"F₁d₁ = F₂d₂.","points":0.25},{"type":"mcq","level":"NB","q":"Điểm đặt của lực cản F₂ thường là","options":["A. Tay người","B. Vị trí đặt vật cần nâng","C. Điểm tựa","D. Đầu thanh bất kì"],"answer":"B","explain":"F₂ đặt tại vị trí vật cần nâng.","points":0.25},{"type":"mcq","level":"VDC","q":"Thanh AB dài 2,4 m, điểm tựa O cách A 0,8 m. Treo vật 120 N tại A. Cần treo vật bao nhiêu tại B để thanh cân bằng? (bỏ qua trọng lượng thanh)","options":["A. 60 N","B. 240 N","C. 120 N","D. 40 N"],"answer":"A","explain":"OA = 0,8 m, OB = 1,6 m; F_B = 120 × 0,8 / 1,6 = 60 N.","points":0.25},{"type":"mcq","level":"VD","q":"Dùng kéo cắt một cành cây: lực tay 20 N đặt cách chốt 0,15 m; cành cây đặt cách chốt 0,05 m. Lực kéo tác dụng lên cành là","options":["A. 6,7 N","B. 60 N","C. 300 N","D. 1,5 N"],"answer":"B","explain":"F₂ = 20 × 0,15 / 0,05 = 60 N.","points":0.25},{"type":"mcq","level":"TH","q":"Khi điểm tựa dịch gần về phía vật thì","options":["A. Càng lợi về lực","B. Càng thiệt về lực","C. Không thay đổi","D. Đòn bẩy mất tác dụng"],"answer":"A","explain":"d₂ giảm, d₁ tăng → càng lợi về lực.","points":0.25},{"type":"mcq","level":"NB","q":"Mái chèo thuyền là đòn bẩy loại","options":["A. Loại 1","B. Loại 2","C. Loại 3","D. Không phải đòn bẩy"],"answer":"A","explain":"Tay người là điểm tựa ở giữa.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) Đòn bẩy loại 1: điểm tựa ở giữa.","b) Đòn bẩy loại 2: điểm tựa ở đầu, vật ở giữa.","c) Đòn bẩy loại 3: điểm tựa ở đầu, lực ở giữa.","d) Cả ba loại đều lợi về lực."],"answer":["T","T","T","F"],"explain":"Loại 3 thiệt về lực.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Xà beng giúp bẩy vật nặng dễ dàng.","b) Kìm giúp cắt dây dễ dàng.","c) Nhíp giúp gắp vật nhỏ chính xác.","d) Đòn bẩy vi phạm định luật bảo toàn năng lượng."],"answer":["T","T","T","F"],"explain":"Đòn bẩy không vi phạm bảo toàn năng lượng.","points":1},{"type":"short","level":"VDC","q":"Một người dùng đòn bẩy nâng vật 300 N, d₁ = 1,5 m, d₂ = 0,5 m. Lực cần tác dụng là bao nhiêu N?","answer":"100","explain":"F₁ = 300 × 0,5 / 1,5 = 100 N.","points":0.5},{"type":"short","level":"TH","q":"Đòn bẩy loại 2 luôn cho ta lợi về gì?","answer":"Lợi về lực","explain":"d₁ lớn hơn d₂ nên F₁ nhỏ hơn F₂.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trong công thức F₁d₁ = F₂d₂, d₁ là","options":["A. Cánh tay đòn của lực F₁","B. Cánh tay đòn của lực F₂","C. Chiều dài thanh","D. Khối lượng vật"],"answer":"A","explain":"d₁ là cánh tay đòn của F₁.","points":0.25},{"type":"mcq","level":"TH","q":"Một cái kẹp hạt dẻ dài 0,2 m, hạt dẻ đặt cách đầu kẹp 0,05 m, tay bóp cách đầu kẹp 0,18 m. Đây là đòn bẩy loại","options":["A. Loại 1","B. Loại 2","C. Loại 3","D. Không phải đòn bẩy"],"answer":"B","explain":"Điểm tựa ở đầu, vật ở giữa: loại 2.","points":0.25},{"type":"mcq","level":"VD","q":"Để bẩy hòn đá 900 N với lực tay tối đa 180 N bằng thanh dài 2 m, điểm tựa phải đặt cách hòn đá tối đa","options":["A. 0,33 m","B. 1,67 m","C. 0,4 m","D. 1,6 m"],"answer":"A","explain":"d₂/d₁ = 180/900 = 0,2; d₁ + d₂ = 2 → d₂ ≈ 0,33 m.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai bạn chơi bập bênh: bạn A nặng 400 N ngồi cách trục 1,5 m; bạn B nặng 300 N. Để cân bằng, bạn B phải ngồi cách trục","options":["A. 2 m","B. 1,125 m","C. 2,5 m","D. 1,8 m"],"answer":"A","explain":"d_B = 400 × 1,5 / 300 = 2 m.","points":0.25},{"type":"mcq","level":"NB","q":"Đòn bẩy được ứng dụng trong dụng cụ nào?","options":["A. Xà beng","B. Nhiệt kế","C. Cốc đong","D. Đồng hồ"],"answer":"A","explain":"Xà beng là đòn bẩy loại 1.","points":0.25},{"type":"mcq","level":"TH","q":"Khi d₁ nhỏ hơn d₂ thì đòn bẩy","options":["A. Lợi về lực","B. Thiệt về lực","C. Cân bằng","D. Không hoạt động"],"answer":"B","explain":"d₁ nhỏ hơn d₂ thì F₁ lớn hơn F₂: thiệt về lực.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Đòn bẩy gồm điểm tựa, lực tác dụng và lực cản.","b) F₁d₁ = F₂d₂.","c) Lợi về lực khi d₁ lớn hơn d₂.","d) Thiệt về lực khi d₁ lớn hơn d₂."],"answer":["T","T","T","F"],"explain":"Thiệt về lực khi d₁ nhỏ hơn d₂.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các tính toán.","statements":["a) F₂ = 500 N, d₂ = 0,2 m, d₁ = 1 m → F₁ = 100 N.","b) F₁ = 80 N, d₁ = 1,2 m, d₂ = 0,3 m → F₂ = 320 N.","c) F₁ = 80 N, F₂ = 320 N, d₁ = 1,2 m → d₂ = 0,3 m.","d) F₂ = 500 N, d₂ = 0,2 m, d₁ = 1 m → F₁ = 1 000 N."],"answer":["T","T","T","F"],"explain":"F₁ = 500 × 0,2 / 1 = 100 N.","points":1},{"type":"short","level":"TH","q":"Đòn bẩy cân bằng có F₁ = 45 N, d₁ = 1,2 m, d₂ = 0,4 m. Tính F₂ (N).","answer":"135","explain":"F₂ = 45 × 1,2 / 0,4 = 135 N.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao đầu búa nhổ đinh có rãnh xẻ? (Trả lời ngắn gọn)","answer":"Để kẹp chặt đinh, tạo điểm tựa tốt cho đòn bẩy","explain":"Rãnh giữ đinh, đầu búa tì xuống gỗ làm điểm tựa.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"TH","q":"Trong các đòn bẩy sau, đòn bẩy nào thiệt về lực?","options":["A. Xà beng bẩy đá","B. Kìm cộng lực","C. Cần câu cá","D. Xe cút kít"],"answer":"C","explain":"Cần câu là đòn bẩy loại 3, thiệt về lực.","points":0.25},{"type":"mcq","level":"NB","q":"Đòn bẩy loại 1 có điểm tựa","options":["A. Ở một đầu","B. Ở giữa lực và vật","C. Trùng với điểm đặt lực","D. Di động"],"answer":"B","explain":"Loại 1: điểm tựa ở giữa.","points":0.25},{"type":"mcq","level":"VDC","q":"Một thanh đồng chất dài 3 m, nặng 60 N, một đầu đặt trên điểm tựa, đầu kia treo vật 90 N. Cần đặt điểm tựa cách đầu treo vật bao nhiêu để thanh cân bằng nằm ngang?","options":["A. 0,6 m","B. 1,2 m","C. 1,5 m","D. 2,4 m"],"answer":"A","explain":"Gọi x là khoảng cách từ điểm tựa đến đầu treo vật; trọng tâm cách điểm tựa (1,5 - x): 90x = 60(1,5 - x) → 150x = 90 → x = 0,6 m.","points":0.25},{"type":"mcq","level":"VD","q":"Một người nâng vật 240 N bằng đòn bẩy dài 1,8 m, điểm tựa cách vật 0,6 m. Lực tay cần tác dụng là","options":["A. 80 N","B. 120 N","C. 720 N","D. 160 N"],"answer":"B","explain":"d₁ = 1,2 m; F₁ = 240 × 0,6 / 1,2 = 120 N.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào ĐÚNG?","options":["A. Mọi đòn bẩy đều lợi về lực","B. Đòn bẩy loại 2 luôn lợi về lực","C. Đòn bẩy loại 1 luôn thiệt về lực","D. Đòn bẩy không giúp ích gì"],"answer":"B","explain":"Loại 2: d₁ lớn hơn d₂ luôn nên luôn lợi về lực.","points":0.25},{"type":"mcq","level":"NB","q":"Cẳng tay người khi nâng vật là đòn bẩy loại 3 vì","options":["A. Điểm tựa ở đầu ngón tay","B. Khớp khuỷu tay là điểm tựa, cơ bắp tay tác dụng lực ở giữa","C. Vật ở giữa","D. Không có điểm tựa"],"answer":"B","explain":"Khớp khuỷu là điểm tựa, lực cơ ở giữa cẳng tay.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) F₁d₁ = F₂d₂.","b) d₁ lớn hơn d₂ → lợi về lực.","c) d₁ nhỏ hơn d₂ → thiệt về lực.","d) d₁ = d₂ → F₁ lớn hơn F₂."],"answer":["T","T","T","F"],"explain":"d₁ = d₂ thì F₁ = F₂.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Bập bênh là đòn bẩy loại 1.","b) Xe cút kít là đòn bẩy loại 2.","c) Cần câu là đòn bẩy loại 3.","d) Kìm là đòn bẩy loại 2."],"answer":["T","T","T","F"],"explain":"Kìm là đòn bẩy loại 1.","points":1},{"type":"short","level":"VDC","q":"Một đòn bẩy loại 2 có d₁ = 2 m, d₂ = 0,5 m nâng vật 400 N. Lực cần tác dụng là bao nhiêu N?","answer":"100","explain":"F₁ = 400 × 0,5 / 2 = 100 N.","points":0.5},{"type":"short","level":"TH","q":"Đòn bẩy nào luôn lợi về lực: loại 1, 2 hay 3?","answer":"Loại 2","explain":"Loại 2: vật ở giữa, d₁ luôn lớn hơn d₂.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Đòn bẩy cân bằng khi","options":["A. F₁ = F₂","B. F₁d₁ = F₂d₂","C. d₁ = d₂","D. F₁ + F₂ = 0"],"answer":"B","explain":"Điều kiện cân bằng: F₁d₁ = F₂d₂.","points":0.25},{"type":"mcq","level":"TH","q":"Một người dùng búa nhổ đinh: tay tác dụng lực 50 N cách điểm tựa 0,25 m; đinh cách điểm tựa 0,05 m. Lực nhổ đinh là","options":["A. 10 N","B. 250 N","C. 62,5 N","D. 1 000 N"],"answer":"B","explain":"F₂ = 50 × 0,25 / 0,05 = 250 N.","points":0.25},{"type":"mcq","level":"VD","q":"Thanh nhẹ AB dài 1 m, điểm tựa tại O cách A 0,2 m. Treo 50 N tại A, cần treo bao nhiêu tại B để cân bằng?","options":["A. 12,5 N","B. 200 N","C. 50 N","D. 10 N"],"answer":"A","explain":"OA = 0,2 m, OB = 0,8 m; F_B = 50 × 0,2 / 0,8 = 12,5 N.","points":0.25},{"type":"mcq","level":"VDC","q":"Dùng đòn bẩy để nâng vật 600 N lên cao 0,1 m. Tay phải di chuyển quãng đường bao nhiêu nếu d₁ gấp 5 lần d₂? (bỏ qua ma sát)","options":["A. 0,02 m","B. 0,5 m","C. 3 m","D. 0,1 m"],"answer":"B","explain":"Thiệt về đường đi 5 lần: s₁ = 5 × 0,1 = 0,5 m.","points":0.25},{"type":"mcq","level":"NB","q":"Lực của tay người tác dụng vào đòn bẩy gọi là","options":["A. Lực cản","B. Lực tác dụng","C. Trọng lực","D. Lực ma sát"],"answer":"B","explain":"Lực tay là lực tác dụng F₁.","points":0.25},{"type":"mcq","level":"TH","q":"Đòn bẩy giúp con người","options":["A. Nâng vật nặng bằng lực nhỏ hơn","B. Tạo ra năng lượng","C. Giảm khối lượng vật","D. Thay đổi trọng lực"],"answer":"A","explain":"Đòn bẩy cho lợi về lực.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Đòn bẩy là thanh cứng quay quanh điểm tựa.","b) Có hai lực F₁ (tác dụng) và F₂ (cản).","c) Cân bằng khi F₁d₁ = F₂d₂.","d) Đòn bẩy tạo ra công lớn hơn công bỏ ra."],"answer":["T","T","T","F"],"explain":"Đòn bẩy không cho lợi về công.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về đường đi.","statements":["a) Lợi về lực thì thiệt về đường đi.","b) d₁ gấp 3 d₂ thì tay đi quãng đường gấp 3 vật.","c) Đòn bẩy không cho lợi về công.","d) Đòn bẩy loại 3 lợi về đường đi."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"short","level":"TH","q":"Đòn bẩy có d₁ = 0,8 m, d₂ = 0,2 m, F₂ = 160 N. Tính F₁ (N).","answer":"40","explain":"F₁ = 160 × 0,2 / 0,8 = 40 N.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao không thể vừa lợi về lực vừa lợi về đường đi? (Trả lời ngắn gọn)","answer":"Vì công bảo toàn, lợi lực thì thiệt đường đi","explain":"Định luật bảo toàn công.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Biết F₁ = 100 N, d₁ = 0,75 m, F₂ = 300 N. Cánh tay đòn d₂ là","options":["A. 0,25 m","B. 2,25 m","C. 0,025 m","D. 22,5 m"],"answer":"A","explain":"d₂ = 100 × 0,75 / 300 = 0,25 m.","points":0.25},{"type":"mcq","level":"NB","q":"Đòn bẩy loại 2 có vật ở","options":["A. Một đầu","B. Giữa điểm tựa và điểm đặt lực","C. Trùng điểm tựa","D. Ngoài đòn bẩy"],"answer":"B","explain":"Loại 2: vật ở giữa.","points":0.25},{"type":"mcq","level":"VDC","q":"Một người nặng 600 N đứng trên đòn bẩy tại điểm cách điểm tựa 3 m để nâng hòn đá 1 800 N đặt cách điểm tựa 1 m phía bên kia. Đòn bẩy có cân bằng không?","options":["A. Có, vừa cân bằng","B. Không, phía người bị nhấc lên","C. Không, phía đá bị nhấc lên","D. Không xác định được"],"answer":"A","explain":"M_người = 600 × 3 = 1 800 N·m; M_đá = 1 800 × 1 = 1 800 N·m; cân bằng.","points":0.25},{"type":"mcq","level":"VD","q":"Một thanh sắt dài 3 m dùng làm đòn bẩy, điểm tựa cách một đầu 1 m. Tác dụng lực 90 N vào đầu gần điểm tựa, lực nâng được ở đầu kia tối đa là","options":["A. 45 N","B. 180 N","C. 30 N","D. 270 N"],"answer":"A","explain":"d₁ = 1 m, d₂ = 2 m; F₂ = 90 × 1 / 2 = 45 N.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào SAI?","options":["A. Đòn bẩy là thanh cứng quay quanh điểm tựa","B. F₁d₁ = F₂d₂ khi cân bằng","C. Đòn bẩy cho lợi về công","D. Có ba loại đòn bẩy"],"answer":"C","explain":"Đòn bẩy không cho lợi về công.","points":0.25},{"type":"mcq","level":"NB","q":"Ứng dụng nào KHÔNG phải đòn bẩy?","options":["A. Xà beng","B. Kìm","C. Nhiệt kế","D. Bập bênh"],"answer":"C","explain":"Nhiệt kế đo nhiệt độ.","points":0.25},{"type":"truefalse","level":"VD","q":"Tổng hợp kiến thức. Đánh giá.","statements":["a) Đòn bẩy: thanh cứng quay quanh điểm tựa O.","b) Cân bằng: F₁d₁ = F₂d₂.","c) Lợi về lực khi d₁ lớn hơn d₂.","d) Ba loại: điểm tựa giữa, vật giữa, lực giữa."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Xà beng là đòn bẩy loại 1.","b) Xe cút kít là đòn bẩy loại 2.","c) Nhíp là đòn bẩy loại 3.","d) Búa nhổ đinh là đòn bẩy loại 2."],"answer":["T","T","T","F"],"explain":"Búa nhổ đinh là đòn bẩy loại 1.","points":1},{"type":"short","level":"VDC","q":"Một đòn bẩy dài 2,5 m, điểm tựa cách vật 0,5 m. Để nâng vật 500 N cần lực bao nhiêu N?","answer":"125","explain":"d₁ = 2,0 m; F₁ = 500 × 0,5 / 2,0 = 125 N.","points":0.5},{"type":"short","level":"TH","q":"Khi đòn bẩy lợi 4 lần về lực thì thiệt mấy lần về đường đi?","answer":"4","explain":"Lợi bao nhiêu lần về lực thì thiệt bấy nhiêu lần về đường đi.","points":0.5}]}]}
