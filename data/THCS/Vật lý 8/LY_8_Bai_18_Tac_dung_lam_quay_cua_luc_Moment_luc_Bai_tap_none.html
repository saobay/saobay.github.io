nhất","D. Làm vật quay nhanh"],"answer":"B","explain":"d = 0 nên M = 0.","points":0.25},{"type":"mcq","level":"NB","q":"Moment lực có tác dụng","options":["A. Làm vật chuyển động thẳng","B. Làm vật quay quanh trục","C. Làm vật biến dạng","D. Làm vật nóng lên"],"answer":"B","explain":"Moment lực đặc trưng cho tác dụng làm quay.","points":0.25},{"type":"mcq","level":"VDC","q":"Thanh AB dài 1,2 m, trục quay tại O sao cho OA = 0,8 m, OB = 0,4 m. Treo vật 15 N tại A. Cần treo vật nặng bao nhiêu tại B để thanh cân bằng?","options":["A. 7,5 N","B. 30 N","C. 15 N","D. 60 N"],"answer":"B","explain":"F_B = 15 × 0,8 / 0,4 = 30 N.","points":0.25},{"type":"mcq","level":"VD","q":"Một lực 100 N tác dụng vuông góc lên thanh tại điểm cách trục quay 0,15 m. Moment lực là","options":["A. 15 N·m","B. 1,5 N·m","C. 150 N·m","D. 666,7 N·m"],"answer":"A","explain":"M = 100 × 0,15 = 15 N·m.","points":0.25},{"type":"mcq","level":"TH","q":"Để mở nắp chai, ta vặn nắp. Tác dụng làm nắp quay là nhờ","options":["A. Áp suất","B. Moment lực của tay","C. Trọng lực","D. Lực đẩy Archimedes"],"answer":"B","explain":"Tay tạo moment lực làm nắp quay.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các dụng cụ sau, dụng cụ nào ứng dụng tác dụng làm quay của lực?","options":["A. Cờ lê","B. Thước kẻ","C. Cốc đong","D. Nhiệt kế"],"answer":"A","explain":"Cờ lê dùng moment lực để vặn ốc.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về quy tắc moment.","statements":["a) Vật cân bằng khi tổng moment hai chiều quay bằng nhau.","b) F₁ × d₁ = F₂ × d₂ khi cân bằng.","c) Chỉ cần một lực là đủ để vật cân bằng.","d) Hai lực cùng chiều quay có thể cân bằng nhau."],"answer":["T","T","F","F"],"explain":"Cần ít nhất hai moment ngược chiều nhau mới cân bằng.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Đẩy cửa càng xa bản lề càng dễ mở.","b) Vặn ốc bằng cờ lê dài dễ hơn cờ lê ngắn.","c) Lực đặt tại trục quay không làm quay vật.","d) Moment lực càng lớn thì càng khó làm quay vật."],"answer":["T","T","T","F"],"explain":"Moment càng lớn thì càng dễ làm quay.","points":1},{"type":"short","level":"VDC","q":"Một thanh nhẹ có trục quay ở giữa. Treo 40 N cách trục 0,5 m bên trái. Cần treo bao nhiêu N cách trục 0,8 m bên phải để cân bằng?","answer":"25","explain":"F = 40 × 0,5 / 0,8 = 25 N.","points":0.5},{"type":"short","level":"TH","q":"Khi lực tăng gấp 3 (d không đổi), moment lực thay đổi thế nào?","answer":"Tăng 3 lần","explain":"M tỉ lệ thuận với F.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Cánh tay đòn là khoảng cách từ","options":["A. Điểm đặt lực đến đầu thanh","B. Trục quay đến giá của lực","C. Trục quay đến điểm đặt lực","D. Hai đầu thanh"],"answer":"B","explain":"d là khoảng cách từ trục quay đến giá của lực.","points":0.25},{"type":"mcq","level":"TH","q":"Biết M = 30 N·m, d = 0,6 m. Độ lớn lực F là","options":["A. 50 N","B. 18 N","C. 5 N","D. 180 N"],"answer":"A","explain":"F = M / d = 30 / 0,6 = 50 N.","points":0.25},{"type":"mcq","level":"VD","q":"Tác dụng lực 80 N lên đầu cờ lê dài 0,35 m (vuông góc). Moment lực là","options":["A. 28 N·m","B. 228,6 N·m","C. 2,8 N·m","D. 280 N·m"],"answer":"A","explain":"M = 80 × 0,35 = 28 N·m.","points":0.25},{"type":"mcq","level":"VDC","q":"Thanh AB đồng chất dài 2 m, nặng 20 N, trục quay tại A. Cần treo vật nặng bao nhiêu tại B để thanh nằm ngang cân bằng?","options":["A. 20 N","B. 10 N","C. 40 N","D. 5 N"],"answer":"B","explain":"Trọng lực đặt tại trung điểm (d = 1 m): M = 20 N·m; F_B × 2 = 20 → F_B = 10 N.","points":0.25},{"type":"mcq","level":"NB","q":"Vô lăng ô tô quay quanh","options":["A. Trục lái","B. Bánh xe","C. Ghế ngồi","D. Gương"],"answer":"A","explain":"Vô lăng quay quanh trục lái.","points":0.25},{"type":"mcq","level":"TH","q":"Hai người đẩy cửa: người A đẩy với lực 20 N cách bản lề 0,6 m, người B đẩy với lực 30 N cách bản lề 0,3 m (cùng chiều). Ai tạo moment lớn hơn?","options":["A. Người A","B. Người B","C. Bằng nhau","D. Không so sánh được"],"answer":"A","explain":"MA = 12 N·m; MB = 9 N·m.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Moment lực đặc trưng cho tác dụng làm quay.","b) M = F × d.","c) d càng lớn thì M càng lớn.","d) F càng lớn thì M càng nhỏ."],"answer":["T","T","T","F"],"explain":"F càng lớn thì M càng lớn.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các tính toán (đơn vị N·m).","statements":["a) F = 15 N, d = 0,4 m → M = 6.","b) F = 25 N, d = 1,2 m → M = 30.","c) M = 50, d = 2,5 m → F = 20 N.","d) M = 50, F = 10 N → d = 0,5 m."],"answer":["T","T","T","F"],"explain":"d = 50 / 10 = 5 m.","points":1},{"type":"short","level":"TH","q":"Lực 12 N có cánh tay đòn 2,5 m tạo moment bao nhiêu N·m?","answer":"30","explain":"M = 12 × 2,5 = 30 N·m.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao khi vặn ốc bị rỉ, người ta thường nối dài cán cờ lê? (Trả lời ngắn gọn)","answer":"Để tăng cánh tay đòn, tăng moment lực","explain":"d tăng thì M tăng, dễ vặn hơn.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Đơn vị N·m là đơn vị của","options":["A. Công","B. Moment lực","C. Áp suất","D. Công suất"],"answer":"B","explain":"N·m là đơn vị của moment lực (cũng là đơn vị công nhưng ý nghĩa khác).","points":0.25},{"type":"mcq","level":"NB","q":"Giá của lực là","options":["A. Độ lớn của lực","B. Đường thẳng mang vectơ lực","C. Điểm đặt của lực","D. Hướng của lực"],"answer":"B","explain":"Giá của lực là đường thẳng mang vectơ lực.","points":0.25},{"type":"mcq","level":"VDC","q":"Một đĩa tròn có trục quay tại tâm, bán kính 0,2 m. Tác dụng lực 30 N tiếp tuyến tại mép đĩa. Moment lực là","options":["A. 6 N·m","B. 150 N·m","C. 0,6 N·m","D. 60 N·m"],"answer":"A","explain":"d = 0,2 m; M = 30 × 0,2 = 6 N·m.","points":0.25},{"type":"mcq","level":"VD","q":"Thanh ngang có trục quay tại O. Lực F₁ = 12 N tác dụng tại A cách O 0,5 m làm quay cùng chiều kim đồng hồ. Cần lực F₂ tại B cách O 0,3 m ngược chiều để cân bằng. F₂ bằng","options":["A. 20 N","B. 7,2 N","C. 10 N","D. 36 N"],"answer":"A","explain":"F₂ = 12 × 0,5 / 0,3 = 20 N.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vật có trục quay cố định chịu hai lực gây moment ngược chiều nhau và bằng nhau thì vật","options":["A. Quay nhanh dần","B. Đứng yên (cân bằng)","C. Quay chậm dần","D. Rơi xuống"],"answer":"B","explain":"Hai moment triệt tiêu nhau, vật cân bằng.","points":0.25},{"type":"mcq","level":"NB","q":"Bập bênh là ứng dụng của","options":["A. Moment lực","B. Áp suất","C. Lực đẩy Archimedes","D. Quán tính"],"answer":"A","explain":"Bập bênh cân bằng nhờ quy tắc moment lực.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) Lực có giá đi qua trục quay không gây moment.","b) Moment lực phụ thuộc cả F và d.","c) Muốn M lớn: tăng F hoặc tăng d.","d) Hai moment cùng chiều quay có thể làm vật cân bằng."],"answer":["T","T","T","F"],"explain":"Cần hai moment ngược chiều mới cân bằng.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Cánh cửa quay quanh bản lề.","b) Đẩy xa bản lề dễ mở cửa hơn.","c) Cờ lê dài vặn ốc dễ hơn.","d) Đẩy tại bản lề là dễ mở cửa nhất."],"answer":["T","T","T","F"],"explain":"Đẩy tại bản lề có d ≈ 0, rất khó mở.","points":1},{"type":"short","level":"VDC","q":"Một người nặng 500 N đứng ở đầu bập bênh cách trục 2 m. Cần người nặng bao nhiêu đứng cách trục 2,5 m phía bên kia để cân bằng? (Đơn vị N)","answer":"400","explain":"F = 500 × 2 / 2,5 = 400 N.","points":0.5},{"type":"short","level":"TH","q":"Moment lực 45 N·m do lực 15 N gây ra. Cánh tay đòn là bao nhiêu m?","answer":"3","explain":"d = 45 / 15 = 3 m.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trong công thức M = F × d, F là","options":["A. Moment lực","B. Độ lớn của lực","C. Cánh tay đòn","D. Khối lượng"],"answer":"B","explain":"F là độ lớn của lực (N).","points":0.25},{"type":"mcq","level":"TH","q":"Một lực 8 N đặt vuông góc tại đầu thanh dài 1,5 m có trục quay ở đầu kia. Moment lực là","options":["A. 12 N·m","B. 5,3 N·m","C. 0,19 N·m","D. 120 N·m"],"answer":"A","explain":"M = 8 × 1,5 = 12 N·m.","points":0.25},{"type":"mcq","level":"VD","q":"Để có moment 24 N·m với lực 8 N, cần cánh tay đòn","options":["A. 3 m","B. 0,33 m","C. 192 m","D. 16 m"],"answer":"A","explain":"d = 24 / 8 = 3 m.","points":0.25},{"type":"mcq","level":"VDC","q":"Thanh AB dài 1 m, trục quay tại điểm O cách A 0,25 m. Treo 12 N tại A, cần treo bao nhiêu tại B để cân bằng?","options":["A. 4 N","B. 6 N","C. 36 N","D. 12 N"],"answer":"A","explain":"OA = 0,25 m, OB = 0,75 m; F_B = 12 × 0,25 / 0,75 = 4 N.","points":0.25},{"type":"mcq","level":"NB","q":"Khi dùng tuốc nơ vít vặn ốc, tay ta tạo ra","options":["A. Áp suất","B. Moment lực","C. Lực ma sát","D. Trọng lực"],"answer":"B","explain":"Tay tạo moment lực làm ốc quay.","points":0.25},{"type":"mcq","level":"TH","q":"Cánh tay đòn càng dài thì với cùng một lực, tác dụng làm quay","options":["A. Càng yếu","B. Càng mạnh","C. Không đổi","D. Bằng không"],"answer":"B","explain":"d lớn thì M lớn.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Vật có trục quay cố định có thể quay.","b) Moment lực làm vật quay.","c) M = F × d.","d) Trục quay luôn ở giữa vật."],"answer":["T","T","T","F"],"explain":"Trục quay có thể ở bất kì vị trí nào.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các đổi đơn vị và tính toán.","statements":["a) 0,5 m = 50 cm.","b) F = 10 N, d = 50 cm → M = 5 N·m.","c) M = 2 N·m, F = 4 N → d = 0,5 m.","d) F = 10 N, d = 50 cm → M = 500 N·m."],"answer":["T","T","T","F"],"explain":"d = 0,5 m nên M = 5 N·m.","points":1},{"type":"short","level":"TH","q":"Một lực 6 N tác dụng với cánh tay đòn 0,5 m. Moment lực là bao nhiêu N·m?","answer":"3","explain":"M = 6 × 0,5 = 3 N·m.","points":0.5},{"type":"short","level":"VDC","q":"Giải thích vì sao vô lăng ô tô có đường kính lớn giúp lái nhẹ? (Trả lời ngắn gọn)","answer":"Vì bán kính lớn cho cánh tay đòn lớn, moment lực lớn","explain":"d lớn thì cùng lực tay tạo M lớn.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"TH","q":"Trong các yếu tố sau, yếu tố nào KHÔNG ảnh hưởng đến moment lực?","options":["A. Độ lớn của lực","B. Cánh tay đòn","C. Màu sắc của vật","D. Vị trí đặt lực"],"answer":"C","explain":"Màu sắc không ảnh hưởng đến moment lực.","points":0.25},{"type":"mcq","level":"NB","q":"Khi nói về cân bằng của vật có trục quay cố định, điều nào đúng?","options":["A. Tổng moment hai chiều quay bằng nhau","B. Không có lực tác dụng","C. Chỉ có một lực","D. Vật phải đứng yên tuyệt đối"],"answer":"A","explain":"Quy tắc moment lực.","points":0.25},{"type":"mcq","level":"VDC","q":"Một thanh nhẹ dài 3 m có trục quay tại một đầu. Treo vật 60 N ở đầu kia và vật 40 N ở giữa thanh (cùng phía). Tổng moment đối với trục quay là","options":["A. 100 N·m","B. 240 N·m","C. 180 N·m","D. 300 N·m"],"answer":"B","explain":"M = 60 × 3 + 40 × 1,5 = 180 + 60 = 240 N·m.","points":0.25},{"type":"mcq","level":"VD","q":"Lực 200 N tác dụng tại điểm cách trục quay 0,1 m. Moment lực là","options":["A. 20 N·m","B. 2 000 N·m","C. 2 N·m","D. 0,5 N·m"],"answer":"A","explain":"M = 200 × 0,1 = 20 N·m.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào ĐÚNG?","options":["A. Moment lực chỉ phụ thuộc lực","B. Cánh tay đòn là khoảng cách từ trục quay đến giá của lực","C. Đơn vị moment lực là Pa","D. Lực càng gần trục quay càng dễ làm quay"],"answer":"B","explain":"Định nghĩa cánh tay đòn.","points":0.25},{"type":"mcq","level":"NB","q":"Dụng cụ nào KHÔNG ứng dụng moment lực?","options":["A. Cờ lê","B. Bập bênh","C. Nhiệt kế","D. Tuốc nơ vít"],"answer":"C","explain":"Nhiệt kế đo nhiệt độ, không liên quan moment lực.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) M = F × d; đơn vị N·m.","b) d là khoảng cách từ trục quay đến giá của lực.","c) Lực qua trục quay có M = 0.","d) Vật cân bằng khi chỉ có một moment lực tác dụng."],"answer":["T","T","T","F"],"explain":"Một moment đơn sẽ làm vật quay, không cân bằng.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Đẩy cửa xa bản lề dễ hơn gần bản lề.","b) Cờ lê càng dài vặn ốc càng dễ.","c) Tay nắm cửa đặt xa bản lề.","d) Nên đẩy cửa tại bản lề để mở nhanh."],"answer":["T","T","T","F"],"explain":"Đẩy tại bản lề rất khó mở.","points":1},{"type":"short","level":"VDC","q":"Một thanh có trục quay tại O. Lực 50 N tại A (OA = 0,6 m) quay cùng chiều kim đồng hồ. Cần lực bao nhiêu tại B (OB = 1,5 m) ngược chiều để cân bằng? (Đơn vị N)","answer":"20","explain":"F = 50 × 0,6 / 1,5 = 20 N.","points":0.5},{"type":"short","level":"TH","q":"Khi d tăng gấp đôi và F giảm một nửa, M thay đổi thế nào?","answer":"Không đổi","explain":"M = (F/2) × (2d) = F × d.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Moment lực được tính bằng","options":["A. Tích của lực với cánh tay đòn","B. Thương của lực với cánh tay đòn","C. Tổng của lực với cánh tay đòn","D. Hiệu của lực với cánh tay đòn"],"answer":"A","explain":"M = F × d.","points":0.25},{"type":"mcq","level":"TH","q":"Một người đẩy cửa với lực 15 N tại điểm cách bản lề 0,9 m. Moment lực là","options":["A. 13,5 N·m","B. 16,7 N·m","C. 1,35 N·m","D. 135 N·m"],"answer":"A","explain":"M = 15 × 0,9 = 13,5 N·m.","points":0.25},{"type":"mcq","level":"VD","q":"Cần moment 100 N·m để vặn một con ốc. Nếu chỉ có thể tác dụng lực tối đa 250 N thì cần cờ lê dài ít nhất","options":["A. 0,4 m","B. 2,5 m","C. 25 000 m","D. 0,04 m"],"answer":"A","explain":"d = 100 / 250 = 0,4 m.","points":0.25},{"type":"mcq","level":"VDC","q":"Thanh AB đồng chất dài 1 m, nặng 12 N, trục quay tại O cách A 0,75 m. Cần treo vật nặng bao nhiêu tại B để thanh cân bằng nằm ngang?","options":["A. 4 N","B. 6 N","C. 12 N","D. 3 N"],"answer":"C","explain":"Trọng tâm G cách O 0,25 m về phía A, gây moment 12 x 0,25 = 3 N.m; treo vật tại B (OB = 0,25 m) phía đối diện: F x 0,25 = 3 → F = 12 N.","points":0.25},{"type":"mcq","level":"NB","q":"Bản lề cửa đóng vai trò là","options":["A. Điểm đặt lực","B. Trục quay","C. Cánh tay đòn","D. Giá của lực"],"answer":"B","explain":"Bản lề là trục quay của cánh cửa.","points":0.25},{"type":"mcq","level":"TH","q":"Khi hai lực gây ra hai moment ngược chiều nhau và có độ lớn bằng nhau thì","options":["A. Vật quay nhanh","B. Vật cân bằng","C. Vật rơi","D. Vật biến dạng"],"answer":"B","explain":"Hai moment triệt tiêu, vật cân bằng.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) M = F × d.","b) Đơn vị M là N·m.","c) d là khoảng cách từ trục quay đến giá của lực.","d) M càng lớn càng khó quay vật."],"answer":["T","T","T","F"],"explain":"M càng lớn càng dễ làm quay.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các tính toán.","statements":["a) F = 5 N, d = 0,8 m → M = 4 N·m.","b) M = 9 N·m, F = 3 N → d = 3 m.","c) M = 9 N·m, d = 1,5 m → F = 6 N.","d) F = 5 N, d = 0,8 m → M = 40 N·m."],"answer":["T","T","T","F"],"explain":"M = 5 × 0,8 = 4 N·m.","points":1},{"type":"short","level":"TH","q":"Tính moment của lực 18 N với cánh tay đòn 0,25 m. (Đơn vị N·m)","answer":"4,5","explain":"M = 18 × 0,25 = 4,5 N·m.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao kéo co bằng dây dài dễ thắng hơn dây ngắn? (Trả lời ngắn gọn, liên hệ moment)","answer":"Không liên quan moment, do lực kéo trực tiếp","explain":"Kéo co là lực kéo thẳng, không phải tác dụng làm quay.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Biết M = 36 N·m, d = 1,2 m. Lực F là","options":["A. 30 N","B. 43,2 N","C. 0,033 N","D. 300 N"],"answer":"A","explain":"F = 36 / 1,2 = 30 N.","points":0.25},{"type":"mcq","level":"NB","q":"Tác dụng làm quay của lực còn gọi là","options":["A. Tác dụng nén","B. Moment lực","C. Tác dụng kéo","D. Tác dụng uốn"],"answer":"B","explain":"Đặc trưng bằng moment lực.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công nhân dùng xà beng dài 1,5 m để bẩy hòn đá. Điểm tựa cách hòn đá 0,3 m, tay tác dụng lực tại đầu kia. Để nâng hòn đá nặng 600 N cần lực tối thiểu","options":["A. 120 N","B. 150 N","C. 3 000 N","D. 180 N"],"answer":"B","explain":"d_đá = 0,3 m, d_tay = 1,2 m; F = 600 × 0,3 / 1,2 = 150 N.","points":0.25},{"type":"mcq","level":"VD","q":"Hai lực F₁ = 20 N (d₁ = 0,3 m) và F₂ = 15 N (d₂ = 0,4 m) gây moment ngược chiều. Vật sẽ","options":["A. Quay theo chiều của F₁","B. Quay theo chiều của F₂","C. Cân bằng","D. Đứng yên vì lực khác nhau"],"answer":"C","explain":"M₁ = 6 N·m; M₂ = 6 N·m; cân bằng.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào SAI về cánh tay đòn?","options":["A. Là khoảng cách từ trục quay đến giá của lực","B. Lực vuông góc với thanh tại điểm cách trục r thì d = r","C. Lực có giá qua trục quay thì d = 0","D. d là độ lớn của lực"],"answer":"D","explain":"d là khoảng cách, không phải độ lớn lực.","points":0.25},{"type":"mcq","level":"NB","q":"Khi vặn ốc, trục quay là","options":["A. Đầu cờ lê","B. Trục của con ốc","C. Tay người","D. Mặt đất"],"answer":"B","explain":"Ốc quay quanh trục của nó.","points":0.25},{"type":"truefalse","level":"VD","q":"Tổng hợp kiến thức. Đánh giá.","statements":["a) M = F × d; đơn vị N·m.","b) Cân bằng khi tổng moment hai chiều bằng nhau.","c) F₁d₁ = F₂d₂ là điều kiện cân bằng.","d) Lực đặt càng xa trục quay càng khó làm quay."],"answer":["T","T","T","F"],"explain":"Càng xa trục quay càng dễ làm quay.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Lực làm vật quay quanh trục cố định.","b) Moment lực đặc trưng cho tác dụng làm quay.","c) M = F × d.","d) Đơn vị M là Pa."],"answer":["T","T","T","F"],"explain":"Đơn vị M là N·m.","points":1},{"type":"short","level":"VDC","q":"Một lực 8 N tạo moment 2 N·m. Cánh tay đòn là bao nhiêu m?","answer":"0,25","explain":"d = 2 / 8 = 0,25 m.","points":0.5},{"type":"short","level":"TH","q":"Muốn tăng gấp đôi moment lực mà giữ nguyên lực thì phải làm gì với cánh tay đòn?","answer":"Tăng gấp đôi","explain":"M tỉ lệ thuận với d.","points":0.5}]}]}
