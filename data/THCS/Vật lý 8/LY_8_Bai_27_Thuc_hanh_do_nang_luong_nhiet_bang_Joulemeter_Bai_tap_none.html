ain":"Giảm truyền nhiệt ra môi trường.","points":0.5},{"type":"short","level":"TH","q":"Tính Q khi m = 0,5 kg, Δt = 30 độ C (nước).","answer":"63000 J","explain":"Q = 0,5 x 4200 x 30 = 63000 J.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trong thí nghiệm Joulemeter, điện năng chuyển hóa thành","options":["A. Nhiệt năng","B. Cơ năng","C. Quang năng","D. Hóa năng"],"answer":"A","explain":"Điện năng thành nhiệt năng.","points":0.25},{"type":"mcq","level":"TH","q":"Một ấm điện ghi 220 V - 1000 W. Ý nghĩa của 1000 W là","options":["A. Mỗi giây cung cấp 1000 J năng lượng","B. Mỗi giây cung cấp 1000 V","C. Điện trở 1000 ôm","D. Dòng điện 1000 A"],"answer":"A","explain":"1000 W = 1000 J/s.","points":0.25},{"type":"mcq","level":"VD","q":"Ấm trên đun trong 3 phút. Năng lượng cung cấp là","options":["A. 180000 J","B. 18000 J","C. 3000 J","D. 1800 J"],"answer":"A","explain":"Q = 1000 x 180 = 180000 J.","points":0.25},{"type":"mcq","level":"VDC","q":"Với năng lượng trên, có thể đun sôi bao nhiêu kg nước từ 25 độ C (bỏ qua hao phí)?","options":["A. Khoảng 0,57 kg","B. 5,7 kg","C. 0,057 kg","D. 57 kg"],"answer":"A","explain":"m = 180000 / (4200 x 75) = 0,57 kg.","points":0.25},{"type":"mcq","level":"NB","q":"Kí hiệu Δt (đọc là đen-ta t) chỉ","options":["A. Độ tăng nhiệt độ","B. Thời gian","C. Nhiệt lượng","D. Khối lượng"],"answer":"A","explain":"Δt là độ tăng nhiệt độ.","points":0.25},{"type":"mcq","level":"TH","q":"Nếu tăng gấp đôi khối lượng nước (cùng Δt), nhiệt lượng cần","options":["A. Tăng gấp đôi","B. Không đổi","C. Giảm một nửa","D. Tăng gấp 4"],"answer":"A","explain":"Q tỉ lệ thuận với m.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Điện năng thành nhiệt năng khi đun bằng điện.","b) Q = U.I.t.","c) Q = m.c.Δt.","d) Hai công thức trên cho cùng một đại lượng trong thí nghiệm lí tưởng."],"answer":["T","T","T","T"],"explain":"Lí tưởng thì Q1 = Q2.","points":1},{"type":"truefalse","level":"VD"
