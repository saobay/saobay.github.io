ot 25\\pi=90\\pi$ nên c) sai; $V=\\pi\\cdot 5^2\\cdot 4=100\\pi$."}, {"type": "short", "level": "VDC", "q": "Nếu tăng bán kính đáy của một hình trụ lên gấp đôi và giữ nguyên chiều cao thì thể tích của hình trụ tăng lên gấp bao nhiêu lần?", "answer": "4", "explain": "$V=\\pi r^2h$ tỉ lệ với $r^2$. Khi $r$ tăng gấp đôi thì $r^2$ tăng gấp $2^2=4$ lần nên thể tích tăng gấp 4 lần."}, {"type": "short", "level": "VDC", "q": "Một hình trụ có thể tích $50\\pi\\text{ cm}^3$ và bán kính đáy $r=5\\text{ cm}$. Chiều cao của hình trụ bằng bao nhiêu cm?", "answer": "2", "explain": "$V=\\pi r^2h=50\\pi$ với $r=5$ cho $\\pi\\cdot 25\\cdot h=50\\pi$, suy ra $h=2\\text{ cm}$."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Hai mặt đáy của hình trụ là:", "options": ["A. hai hình vuông bằng nhau", "B. hai hình chữ nhật bằng nhau", "C. hai hình tròn bằng nhau", "D. một hình tròn duy nhất"], "answer": "C", "explain": "Hình trụ có hai đáy là hai hình tròn bằng nhau, song song với nhau."}, {"type": "mcq", "level": "NB", "q": "Trong hình nón, đoạn thẳng nối đỉnh với một điểm trên đường tròn đáy được gọi là:", "options": ["A. đường sinh", "B. chiều cao", "C. bán kính đáy", "D. đường kính đáy"], "answer": "A", "explain": "Mọi đoạn thẳng nối đỉnh với một điểm trên đường tròn đáy đều được gọi là đường sinh của hình nón, kí hiệu là $l$."}, {"type": "mcq", "level": "NB", "q": "Công thức tính diện tích toàn phần của hình nón có bán kính đáy $r$ và đường sinh $l$ là:", "options": ["A. $S_{tp}=\\pi rl$", "B. $S_{tp}=\\pi r^2$", "C. $S_{tp}=2\\pi r(l+r)$", "D. $S_{tp}=\\pi r(l+r)$"], "answer": "D", "explain": "$S_{tp}=S_{xq}+S_{\\text{đáy}}=\\pi rl+\\pi r^2=\\pi r(l+r)$."}, {"type": "mcq", "level": "TH", "q": "Một hình trụ có bán kính đáy $r=4\\text{ cm}$, chiều cao $h=3\\text{ cm}$. Thể tích của hình trụ là:", "options": ["A. $36\\pi\\text{ cm}^3$", "B. $48\\pi\\text{ cm}^3$", "C. $64\\pi\\text{ cm}^3$", "D. $96\\pi\\text{ cm}^3$"], "answer": "B", "explain": "$V=\\pi r^2h=\\pi\\cdot 4^2\\cdot 3=48\\pi\\text{ cm}^3$."}, {"type": "mcq", "level": "TH", "q": "Một hình nón có bán kính đáy $r=2\\text{ cm}$, chiều cao $h=9\\text{ cm}$. Thể tích của hình nón là:", "options": ["A. $12\\pi\\text{ cm}^3$", "B. $36\\pi\\text{ cm}^3$", "C. $18\\pi\\text{ cm}^3$", "D. $24\\pi\\text{ cm}^3$"], "answer": "A", "explain": "$V=\\dfrac{1}{3}\\pi r^2h=\\dfrac{1}{3}\\pi\\cdot 2^2\\cdot 9=12\\pi\\text{ cm}^3$."}, {"type": "mcq", "level": "TH", "q": "Một hình nón có bán kính đáy $r=3\\text{ cm}$, đường sinh $l=5\\text{ cm}$. Diện tích toàn phần của hình nón là:", "options": ["A. $15\\pi\\text{ cm}^2$", "B. $30\\pi\\text{ cm}^2$", "C. $20\\pi\\text{ cm}^2$", "D. $24\\pi\\text{ cm}^2$"], "answer": "D", "explain": "$S_{tp}=\\pi r(l+r)=\\pi\\cdot 3\\cdot(5+3)=24\\pi\\text{ cm}^2$."}, {"type": "truefalse", "level": "VD", "q": "Một hình trụ có bán kính đáy $r=3\\text{ cm}$, chiều cao $h=7\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích xung quanh của hình trụ bằng $42\\pi\\text{ cm}^2$.", "b) Thể tích của hình trụ bằng $63\\pi\\text{ cm}^3$.", "c) Diện tích toàn phần của hình trụ bằng $56\\pi\\text{ cm}^2$.", "d) Nếu giảm chiều cao đi một nửa thì thể tích hình trụ giảm đi 4 lần."], "answer": ["T", "T", "F", "F"], "explain": "$S_{xq}=2\\pi\\cdot 3\\cdot 7=42\\pi$; $V=\\pi\\cdot 3^2\\cdot 7=63\\pi$; $S_{tp}=42\\pi+2\\pi\\cdot 3^2=60\\pi$ nên c) sai; $V$ tỉ lệ bậc nhất với $h$ nên khi $h$ giảm một nửa thì $V$ giảm 2 lần, không phải 4 lần."}, {"type": "truefalse", "level": "VD", "q": "Một hình nón có bán kính đáy $r=6\\text{ cm}$, đường sinh $l=10\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Chiều cao của hình nón bằng $6\\text{ cm}$.", "b) Diện tích xung quanh của hình nón bằng $48\\pi\\text{ cm}^2$.", "c) Diện tích toàn phần của hình nón bằng $96\\pi\\text{ cm}^2$.", "d) Thể tích của hình nón bằng $96\\pi\\text{ cm}^3$."], "answer": ["F", "F", "T", "T"], "explain": "Chiều cao $h=\\sqrt{l^2-r^2}=\\sqrt{100-36}=8\\text{ cm}$ nên a) sai; $S_{xq}=\\pi\\cdot 6\\cdot 10=60\\pi$ nên b) sai; $S_{tp}=60\\pi+\\pi\\cdot 6^2=96\\pi$; $V=\\dfrac{1}{3}\\pi\\cdot 6^2\\cdot 8=96\\pi$."}, {"type": "short", "level": "VDC", "q": "Thể tích của một hình trụ gấp bao nhiêu lần thể tích của một hình nón có cùng bán kính đáy và cùng chiều cao với hình trụ đó?", "answer": "3", "explain": "$V_{\\text{trụ}}=\\pi r^2h$ và $V_{\\text{nón}}=\\dfrac{1}{3}\\pi r^2h$ nên $V_{\\text{trụ}}=3\\cdot V_{\\text{nón}}$."}, {"type": "short", "level": "VDC", "q": "Một hình nón có diện tích xung quanh bằng $60\\pi\\text{ cm}^2$ và đường sinh $l=10\\text{ cm}$. Bán kính đáy của hình nón bằng bao nhiêu cm?", "answer": "6", "explain": "$S_{xq}=\\pi rl=60\\pi$ với $l=10$ cho $\\pi r\\cdot 10=60\\pi$, suy ra $r=6\\text{ cm}$."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Mặt xung quanh của hình trụ khi trải phẳng ra là hình gì?", "options": ["A. hình tròn", "B. hình chữ nhật", "C. hình tam giác", "D. hình vuông"], "answer": "B", "explain": "Khi cắt mặt xung quanh của hình trụ theo một đường sinh rồi trải phẳng, ta được một hình chữ nhật."}, {"type": "mcq", "level": "NB", "q": "Công thức tính diện tích xung quanh của hình trụ là:", "options": ["A. $S_{xq}=2\\pi r^2$", "B. $S_{xq}=\\pi r^2h$", "C. $S_{xq}=2\\pi rh$", "D. $S_{xq}=\\pi rh$"], "answer": "C", "explain": "$S_{xq}=2\\pi rh$, trong đó $2\\pi r$ là chu vi đáy và $h$ là chiều cao."}, {"type": "mcq", "level": "NB", "q": "Kí hiệu $l$ trong các công thức của hình nón là:", "options": ["A. chiều cao", "B. bán kính đáy", "C. đường kính đáy", "D. đường sinh"], "answer": "D", "explain": "Trong hình nón, $l$ kí hiệu đường sinh, $h$ kí hiệu chiều cao, $r$ kí hiệu bán kính đáy."}, {"type": "mcq", "level": "TH", "q": "Một hình trụ có bán kính đáy $r=6\\text{ cm}$, chiều cao $h=2\\text{ cm}$. Diện tích xung quanh của hình trụ là:", "options": ["A. $24\\pi\\text{ cm}^2$", "B. $12\\pi\\text{ cm}^2$", "C. $48\\pi\\text{ cm}^2$", "D. $36\\pi\\text{ cm}^2$"], "answer": "A", "explain": "$S_{xq}=2\\pi rh=2\\pi\\cdot 6\\cdot 2=24\\pi\\text{ cm}^2$."}, {"type": "mcq", "level": "TH", "q": "Một hình nón có bán kính đáy $r=4\\text{ cm}$, chiều cao $h=3\\text{ cm}$. Diện tích xung quanh của hình nón là:", "options": ["A. $12\\pi\\text{ cm}^2$", "B. $15\\pi\\text{ cm}^2$", "C. $20\\pi\\text{ cm}^2$", "D. $25\\pi\\text{ cm}^2$"], "answer": "C", "explain": "Đường sinh $l=\\sqrt{4^2+3^2}=5\\text{ cm}$; $S_{xq}=\\pi rl=\\pi\\cdot 4\\cdot 5=20\\pi\\text{ cm}^2$."}, {"type": "mcq", "level": "TH", "q": "Một hình nón có bán kính đáy $r=6\\text{ cm}$, chiều cao $h=4\\text{ cm}$. Thể tích của hình nón là:", "options": ["A. $24\\pi\\text{ cm}^3$", "B. $72\\pi\\text{ cm}^3$", "C. $36\\pi\\text{ cm}^3$", "D. $48\\pi\\text{ cm}^3$"], "answer": "D", "explain": "$V=\\dfrac{1}{3}\\pi r^2h=\\dfrac{1}{3}\\pi\\cdot 6^2\\cdot 4=48\\pi\\text{ cm}^3$."}, {"type": "truefalse", "level": "VD", "q": "Một hình nón có bán kính đáy $r=8\\text{ cm}$, chiều cao $h=6\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Đường sinh của hình nón bằng $10\\text{ cm}$.", "b) Diện tích xung quanh của hình nón bằng $100\\pi\\text{ cm}^2$.", "c) Thể tích của hình nón bằng $128\\pi\\text{ cm}^3$.", "d) Diện tích toàn phần của hình nón bằng $140\\pi\\text{ cm}^2$."], "answer": ["T", "F", "T", "F"], "explain": "$l=\\sqrt{8^2+6^2}=10\\text{ cm}$; $S_{xq}=\\pi\\cdot 8\\cdot 10=80\\pi$ nên b) sai; $V=\\dfrac{1}{3}\\pi\\cdot 8^2\\cdot 6=128\\pi$; $S_{tp}=80\\pi+\\pi\\cdot 8^2=144\\pi$ nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Một hình trụ có bán kính đáy $r=6\\text{ cm}$, chiều cao $h=5\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích xung quanh của hình trụ bằng $50\\pi\\text{ cm}^2$.", "b) Diện tích toàn phần của hình trụ bằng $132\\pi\\text{ cm}^2$.", "c) Thể tích của hình trụ bằng $150\\pi\\text{ cm}^3$.", "d) Diện tích một mặt đáy của hình trụ bằng $36\\pi\\text{ cm}^2$."], "answer": ["F", "T", "F", "T"], "explain": "$S_{xq}=2\\pi\\cdot 6\\cdot 5=60\\pi$ nên a) sai; $S_{tp}=60\\pi+2\\pi\\cdot 6^2=132\\pi$; $V=\\pi\\cdot 6^2\\cdot 5=180\\pi$ nên c) sai; diện tích một đáy $=\\pi\\cdot 6^2=36\\pi$."}, {"type": "short", "level": "VDC", "q": "Một hình trụ có bán kính đáy $r=3\\text{ cm}$, chiều cao $h=4\\text{ cm}$. Một hình nón có bán kính đáy $r=3\\text{ cm}$. Chiều cao của hình nón bằng bao nhiêu cm để thể tích của hai hình bằng nhau?", "answer": "12", "explain": "$\\dfrac{1}{3}\\pi\\cdot 3^2\\cdot h_{\\text{nón}}=\\pi\\cdot 3^2\\cdot 4$, rút gọn được $\\dfrac{1}{3}h_{\\text{nón}}=4$, suy ra $h_{\\text{nón}}=12\\text{ cm}$."}, {"type": "short", "level": "VDC", "q": "Một hình trụ có diện tích xung quanh bằng $72\\pi\\text{ cm}^2$ và bán kính đáy $r=4\\text{ cm}$. Chiều cao của hình trụ bằng bao nhiêu cm?", "answer": "9", "explain": "$S_{xq}=2\\pi rh=72\\pi$ với $r=4$ cho $2\\pi\\cdot 4\\cdot h=72\\pi$, suy ra $h=9\\text{ cm}$."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Thể tích của hình nón bằng bao nhiêu phần thể tích của hình trụ có cùng bán kính đáy và cùng chiều cao?", "options": ["A. bằng nhau", "B. một nửa", "C. gấp đôi", "D. một phần ba"], "answer": "D", "explain": "$V_{\\text{nón}}=\\dfrac{1}{3}\\pi r^2h=\\dfrac{1}{3}V_{\\text{trụ}}$ khi hai hình có cùng $r$ và cùng $h$."}, {"type": "mcq", "level": "NB", "q": "Công thức tính đường sinh $l$ của hình nón có bán kính đáy $r$ và chiều cao $h$ là:", "options": ["A. $l=\\sqrt{r^2+h^2}$", "B. $l=r+h$", "C. $l=\\sqrt{r^2-h^2}$", "D. $l=2r+h$"], "answer": "A", "explain": "Theo định lí Pythagore trong tam giác vuông tạo bởi đường sinh, bán kính đáy và chiều cao: $l=\\sqrt{r^2+h^2}$."}, {"type": "mcq", "level": "NB", "q": "Chiều cao của hình trụ là:", "options": ["A. bán kính đáy", "B. khoảng cách giữa hai mặt đáy", "C. đường sinh của mặt xung quanh", "D. đường kính đáy"], "answer": "B", "explain": "Chiều cao $h$ của hình trụ là khoảng cách giữa hai mặt đáy (cũng là độ dài trục của hình trụ)."}, {"type": "mcq", "level": "TH", "q": "Một hình trụ có bán kính đáy $r=4\\text{ cm}$, chiều cao $h=5\\text{ cm}$. Thể tích của hình trụ là:", "options": ["A. $20\\pi\\text{ cm}^3$", "B. $40\\pi\\text{ cm}^3$", "C. $80\\pi\\text{ cm}^3$", "D. $100\\pi\\text{ cm}^3$"], "answer": "C", "explain": "$V=\\pi r^2h=\\pi\\cdot 4^2\\cdot 5=80\\pi\\text{ cm}^3$."}, {"type": "mcq", "level": "TH", "q": "Một hình nón có bán kính đáy $r=6\\text{ cm}$, chiều cao $h=8\\text{ cm}$. Thể tích của hình nón là:", "options": ["A. $96\\pi\\text{ cm}^3$", "B. $48\\pi\\text{ cm}^3$", "C. $144\\pi\\text{ cm}^3$", "D. $192\\pi\\text{ cm}^3$"], "answer": "A", "explain": "$V=\\dfrac{1}{3}\\pi r^2h=\\dfrac{1}{3}\\pi\\cdot 6^2\\cdot 8=96\\pi\\text{ cm}^3$."}, {"type": "mcq", "level": "TH", "q": "Một hình trụ có bán kính đáy $r=5\\text{ cm}$, chiều cao $h=4\\text{ cm}$. Diện tích xung quanh của hình trụ là:", "options": ["A. $20\\pi\\text{ cm}^2$", "B. $80\\pi\\text{ cm}^2$", "C. $50\\pi\\text{ cm}^2$", "D. $40\\pi\\text{ cm}^2$"], "answer": "D", "explain": "$S_{xq}=2\\pi rh=2\\pi\\cdot 5\\cdot 4=40\\pi\\text{ cm}^2$."}, {"type": "truefalse", "level": "VD", "q": "Một hình trụ có bán kính đáy $r=2\\text{ cm}$, chiều cao $h=10\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích xung quanh của hình trụ bằng $20\\pi\\text{ cm}^2$.", "b) Thể tích của hình trụ bằng $40\\pi\\text{ cm}^3$.", "c) Diện tích toàn phần của hình trụ bằng $48\\pi\\text{ cm}^2$.", "d) Khi gấp đôi chiều cao thì diện tích xung quanh tăng lên gấp 4 lần."], "answer": ["F", "T", "T", "F"], "explain": "$S_{xq}=2\\pi\\cdot 2\\cdot 10=40\\pi$ nên a) sai; $V=\\pi\\cdot 2^2\\cdot 10=40\\pi$; $S_{tp}=40\\pi+2\\pi\\cdot 2^2=48\\pi$; $S_{xq}$ tỉ lệ bậc nhất với $h$ nên khi $h$ gấp đôi thì $S_{xq}$ tăng gấp đôi, không phải 4 lần."}, {"type": "truefalse", "level": "VD", "q": "Một hình nón có bán kính đáy $r=9\\text{ cm}$, chiều cao $h=12\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Đường sinh của hình nón bằng $15\\text{ cm}$.", "b) Diện tích xung quanh của hình nón bằng $120\\pi\\text{ cm}^2$.", "c) Thể tích của hình nón bằng $300\\pi\\text{ cm}^3$.", "d) Diện tích toàn phần của hình nón bằng $216\\pi\\text{ cm}^2$."], "answer": ["T", "F", "F", "T"], "explain": "$l=\\sqrt{9^2+12^2}=15\\text{ cm}$; $S_{xq}=\\pi\\cdot 9\\cdot 15=135\\pi$ nên b) sai; $V=\\dfrac{1}{3}\\pi\\cdot 9^2\\cdot 12=324\\pi$ nên c) sai; $S_{tp}=135\\pi+\\pi\\cdot 9^2=216\\pi$."}, {"type": "short", "level": "VDC", "q": "Một hộp sữa hình trụ có bán kính đáy $5\\text{ cm}$, chiều cao $12\\text{ cm}$. Thể tích của hộp sữa (bỏ qua độ dày của vỏ hộp) bằng $a\\pi\\text{ cm}^3$. Giá trị của $a$ là bao nhiêu?", "answer": "300", "explain": "$V=\\pi r^2h=\\pi\\cdot 5^2\\cdot 12=300\\pi\\text{ cm}^3$ nên $a=300$."}, {"type": "short", "level": "VDC", "q": "Một hình nón có đường sinh $l=25\\text{ cm}$, bán kính đáy $r=24\\text{ cm}$. Chiều cao của hình nón bằng bao nhiêu cm?", "answer": "7", "explain": "$h=\\sqrt{l^2-r^2}=\\sqrt{25^2-24^2}=\\sqrt{625-576}=\\sqrt{49}=7\\text{ cm}$."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức tính diện tích xung quanh của hình nón là:", "options": ["A. $S_{xq}=\\pi rl$", "B. $S_{xq}=\\pi rh$", "C. $S_{xq}=2\\pi rl$", "D. $S_{xq}=\\pi r^2$"], "answer": "A", "explain": "$S_{xq}=\\pi rl$, trong đó $l$ là đường sinh của hình nón."}, {"type": "mcq", "level": "NB", "q": "Công thức tính thể tích của hình trụ là:", "options": ["A. $V=\\dfrac{1}{3}\\pi r^2h$", "B. $V=2\\pi rh$", "C. $V=\\pi r^2h$", "D. $V=\\pi r^2$"], "answer": "C", "explain": "$V=\\pi r^2h$: thể tích bằng diện tích đáy nhân chiều cao."}, {"type": "mcq", "level": "NB", "q": "Mặt phẳng đi qua trục của hình trụ cắt hình trụ theo hình gì?", "options": ["A. hình tròn", "B. hình chữ nhật", "C. hình tam giác", "D. hình thang"], "answer": "B", "explain": "Mặt phẳng chứa trục cắt hai đáy theo hai đường kính song song và cắt mặt xung quanh theo hai đường sinh, tạo thành hình chữ nhật."}, {"type": "mcq", "level": "TH", "q": "Một hình trụ có bán kính đáy $r=3\\text{ cm}$, chiều cao $h=6\\text{ cm}$. Thể tích của hình trụ là:", "options": ["A. $18\\pi\\text{ cm}^3$", "B. $36\\pi\\text{ cm}^3$", "C. $72\\pi\\text{ cm}^3$", "D. $54\\pi\\text{ cm}^3$"], "answer": "D", "explain": "$V=\\pi r^2h=\\pi\\cdot 3^2\\cdot 6=54\\pi\\text{ cm}^3$."}, {"type": "mcq", "level": "TH", "q": "Một hình nón có bán kính đáy $r=5\\text{ cm}$, đường sinh $l=13\\text{ cm}$. Diện tích xung quanh của hình nón là:", "options": ["A. $130\\pi\\text{ cm}^2$", "B. $65\\pi\\text{ cm}^2$", "C. $50\\pi\\text{ cm}^2$", "D. $90\\pi\\text{ cm}^2$"], "answer": "B", "explain": "$S_{xq}=\\pi rl=\\pi\\cdot 5\\cdot 13=65\\pi\\text{ cm}^2$."}, {"type": "mcq", "level": "TH", "q": "Một hình trụ có bán kính đáy $r=2\\text{ cm}$, chiều cao $h=7\\text{ cm}$. Diện tích toàn phần của hình trụ là:", "options": ["A. $36\\pi\\text{ cm}^2$", "B. $28\\pi\\text{ cm}^2$", "C. $40\\pi\\text{ cm}^2$", "D. $32\\pi\\text{ cm}^2$"], "answer": "A", "explain": "$S_{tp}=2\\pi r(h+r)=2\\pi\\cdot 2\\cdot(7+2)=36\\pi\\text{ cm}^2$."}, {"type": "truefalse", "level": "VD", "q": "Một hình nón có bán kính đáy $r=5\\text{ cm}$, chiều cao $h=12\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích xung quanh của hình nón bằng $65\\pi\\text{ cm}^2$.", "b) Thể tích của hình nón bằng $100\\pi\\text{ cm}^3$.", "c) Diện tích toàn phần của hình nón bằng $110\\pi\\text{ cm}^2$.", "d) Nếu cả bán kính đáy và chiều cao đều tăng gấp đôi thì thể tích tăng lên gấp 4 lần."], "answer": ["T", "T", "F", "F"], "explain": "$l=13\\text{ cm}$; $S_{xq}=\\pi\\cdot 5\\cdot 13=65\\pi$; $V=\\dfrac{1}{3}\\pi\\cdot 5^2\\cdot 12=100\\pi$; $S_{tp}=65\\pi+25\\pi=90\\pi$ nên c) sai; $V$ tỉ lệ với $r^2h$ nên khi $r$, $h$ cùng gấp đôi thì $V$ tăng $2^2\\cdot 2=8$ lần, không phải 4 lần."}, {"type": "truefalse", "level": "VD", "q": "Một hình trụ có bán kính đáy $r=7\\text{ cm}$, chiều cao $h=3\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích xung quanh của hình trụ bằng $21\\pi\\text{ cm}^2$.", "b) Thể tích của hình trụ bằng $49\\pi\\text{ cm}^3$.", "c) Diện tích toàn phần của hình trụ bằng $140\\pi\\text{ cm}^2$.", "d) Diện tích một mặt đáy của hình trụ bằng $49\\pi\\text{ cm}^2$."], "answer": ["F", "F", "T", "T"], "explain": "$S_{xq}=2\\pi\\cdot 7\\cdot 3=42\\pi$ nên a) sai; $V=\\pi\\cdot 7^2\\cdot 3=147\\pi$ nên b) sai; $S_{tp}=42\\pi+2\\pi\\cdot 7^2=140\\pi$; diện tích một đáy $=\\pi\\cdot 7^2=49\\pi$."}, {"type": "short", "level": "VDC", "q": "Một hình nón có bán kính đáy $r=9\\text{ cm}$, chiều cao $h=12\\text{ cm}$. Diện tích toàn phần của hình nón bằng $a\\pi\\text{ cm}^2$. Giá trị của $a$ là bao nhiêu?", "answer": "216", "explain": "$l=\\sqrt{9^2+12^2}=15\\text{ cm}$; $S_{tp}=\\pi r(l+r)=\\pi\\cdot 9\\cdot(15+9)=216\\pi\\text{ cm}^2$ nên $a=216$."}, {"type": "short", "level": "VDC", "q": "Một hình trụ có thể tích $64\\pi\\text{ cm}^3$ và bán kính đáy $r=4\\text{ cm}$. Chiều cao của hình trụ bằng bao nhiêu cm?", "answer": "4", "explain": "$V=\\pi r^2h=64\\pi$ với $r=4$ cho $\\pi\\cdot 16\\cdot h=64\\pi$, suy ra $h=4\\text{ cm}$."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức tính diện tích một mặt đáy của hình trụ có bán kính đáy $r$ là:", "options": ["A. $2\\pi r$", "B. $2\\pi r^2$", "C. $\\pi r^2$", "D. $\\pi r$"], "answer": "C", "explain": "Mỗi đáy của hình trụ là một hình tròn bán kính $r$ nên diện tích đáy $=\\pi r^2$."}, {"type": "mcq", "level": "NB", "q": "Công thức tính chu vi đường tròn đáy của hình trụ có bán kính đáy $r$ là:", "options": ["A. $\\pi r$", "B. $\\pi r^2$", "C. $4\\pi r$", "D. $2\\pi r$"], "answer": "D", "explain": "Chu vi đường tròn đáy $=2\\pi r$."}, {"type": "mcq", "level": "NB", "q": "Công thức tính thể tích của hình nón là:", "options": ["A. $V=\\dfrac{1}{3}\\pi r^2h$", "B. $V=\\pi r^2h$", "C. $V=\\pi rl$", "D. $V=\\dfrac{1}{2}\\pi r^2h$"], "answer": "A", "explain": "$V_{\\text{nón}}=\\dfrac{1}{3}\\pi r^2h$."}, {"type": "mcq", "level": "TH", "q": "Một hình trụ có bán kính đáy $r=8\\text{ cm}$, chiều cao $h=2\\text{ cm}$. Diện tích xung quanh của hình trụ là:", "options": ["A. $16\\pi\\text{ cm}^2$", "B. $32\\pi\\text{ cm}^2$", "C. $64\\pi\\text{ cm}^2$", "D. $128\\pi\\text{ cm}^2$"], "answer": "B", "explain": "$S_{xq}=2\\pi rh=2\\pi\\cdot 8\\cdot 2=32\\pi\\text{ cm}^2$."}, {"type": "mcq", "level": "TH", "q": "Một hình nón có bán kính đáy $r=10\\text{ cm}$, đường sinh $l=26\\text{ cm}$. Thể tích của hình nón là:", "options": ["A. $260\\pi\\text{ cm}^3$", "B. $2400\\pi\\text{ cm}^3$", "C. $8000\\pi\\text{ cm}^3$", "D. $800\\pi\\text{ cm}^3$"], "answer": "D", "explain": "Chiều cao $h=\\sqrt{26^2-10^2}=\\sqrt{576}=24\\text{ cm}$; $V=\\dfrac{1}{3}\\pi\\cdot 10^2\\cdot 24=800\\pi\\text{ cm}^3$."}, {"type": "mcq", "level": "TH", "q": "Một hình trụ có diện tích xung quanh bằng $48\\pi\\text{ cm}^2$ và chiều cao $h=4\\text{ cm}$. Bán kính đáy của hình trụ là:", "options": ["A. $6\\text{ cm}$", "B. $3\\text{ cm}$", "C. $12\\text{ cm}$", "D. $24\\text{ cm}$"], "answer": "A", "explain": "$S_{xq}=2\\pi rh=48\\pi$ với $h=4$ cho $2\\pi r\\cdot 4=48\\pi$, suy ra $r=6\\text{ cm}$."}, {"type": "truefalse", "level": "VD", "q": "Một hình trụ có bán kính đáy $r=4\\text{ cm}$, chiều cao $h=9\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích xung quanh của hình trụ bằng $72\\pi\\text{ cm}^2$.", "b) Diện tích toàn phần của hình trụ bằng $96\\pi\\text{ cm}^2$.", "c) Thể tích của hình trụ bằng $144\\pi\\text{ cm}^3$.", "d) Tỉ số giữa diện tích xung quanh và diện tích một mặt đáy bằng $9$."], "answer": ["T", "F", "T", "F"], "explain": "$S_{xq}=2\\pi\\cdot 4\\cdot 9=72\\pi$; $S_{tp}=72\\pi+2\\pi\\cdot 4^2=104\\pi$ nên b) sai; $V=\\pi\\cdot 4^2\\cdot 9=144\\pi$; tỉ số $=\\dfrac{72\\pi}{16\\pi}=4,5$ nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Một hình nón có bán kính đáy $r=12\\text{ cm}$, chiều cao $h=5\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Đường sinh của hình nón bằng $12\\text{ cm}$.", "b) Diện tích xung quanh của hình nón bằng $156\\pi\\text{ cm}^2$.", "c) Thể tích của hình nón bằng $200\\pi\\text{ cm}^3$.", "d) Diện tích toàn phần của hình nón bằng $300\\pi\\text{ cm}^2$."], "answer": ["F", "T", "F", "T"], "explain": "$l=\\sqrt{12^2+5^2}=13\\text{ cm}$ nên a) sai; $S_{xq}=\\pi\\cdot 12\\cdot 13=156\\pi$; $V=\\dfrac{1}{3}\\pi\\cdot 12^2\\cdot 5=240\\pi$ nên c) sai; $S_{tp}=156\\pi+\\pi\\cdot 12^2=300\\pi$."}, {"type": "short", "level": "VDC", "q": "Một chiếc nón lá có dạng hình nón với đường sinh $l=15\\text{ cm}$ và bán kính đáy $r=12\\text{ cm}$. Chiều cao của chiếc nón bằng bao nhiêu cm?", "answer": "9", "explain": "$h=\\sqrt{l^2-r^2}=\\sqrt{15^2-12^2}=\\sqrt{225-144}=\\sqrt{81}=9\\text{ cm}$."}, {"type": "short", "level": "VDC", "q": "Một hình trụ có diện tích toàn phần bằng $112\\pi\\text{ cm}^2$ và bán kính đáy $r=4\\text{ cm}$. Chiều cao của hình trụ bằng bao nhiêu cm?", "answer": "10", "explain": "$S_{tp}=2\\pi r(h+r)=112\\pi$ với $r=4$ cho $2\\pi\\cdot 4\\cdot(h+4)=112\\pi$, suy ra $h+4=14$ nên $h=10\\text{ cm}$."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Mặt đáy của hình nón là hình gì?", "options": ["A. hình chữ nhật", "B. hình tròn", "C. hình tam giác", "D. hình vuông"], "answer": "B", "explain": "Đáy của hình nón là một hình tròn có bán kính $r$."}, {"type": "mcq", "level": "NB", "q": "Công thức tính diện tích toàn phần của hình trụ là:", "options": ["A. $S_{tp}=2\\pi r(h+r)$", "B. $S_{tp}=2\\pi rh$", "C. $S_{tp}=\\pi r(h+r)$", "D. $S_{tp}=2\\pi r^2h$"], "answer": "A", "explain": "$S_{tp}=S_{xq}+2S_{\\text{đáy}}=2\\pi rh+2\\pi r^2=2\\pi r(h+r)$."}, {"type": "mcq", "level": "NB", "q": "Trong các công thức sau, công thức nào SAI?", "options": ["A. $S_{xq}=\\pi rl$ (hình nón)", "B. $V=\\pi r^2h$ (hình trụ)", "C. $l^2=r^2+h^2$ (hình nón)", "D. $S_{xq}=\\pi r^2l$ (hình nón)"], "answer": "D", "explain": "Diện tích xung quanh hình nón là $S_{xq}=\\pi rl$ (bậc nhất theo $r$), không phải $\\pi r^2l$."}, {"type": "mcq", "level": "TH", "q": "Một hình trụ có đường kính đáy $12\\text{ cm}$, chiều cao $h=5\\text{ cm}$. Thể tích của hình trụ là:", "options": ["A. $60\\pi\\text{ cm}^3$", "B. $120\\pi\\text{ cm}^3$", "C. $180\\pi\\text{ cm}^3$", "D. $360\\pi\\text{ cm}^3$"], "answer": "C", "explain": "Bán kính đáy $r=12:2=6\\text{ cm}$; $V=\\pi r^2h=\\pi\\cdot 6^2\\cdot 5=180\\pi\\text{ cm}^3$."}, {"type": "mcq", "level": "TH", "q": "Một hình nón có bán kính đáy $r=7\\text{ cm}$, chiều cao $h=24\\text{ cm}$. Diện tích xung quanh của hình nón là:", "options": ["A. $175\\pi\\text{ cm}^2$", "B. $150\\pi\\text{ cm}^2$", "C. $200\\pi\\text{ cm}^2$", "D. $350\\pi\\text{ cm}^2$"], "answer": "A", "explain": "Đường sinh $l=\\sqrt{7^2+24^2}=25\\text{ cm}$; $S_{xq}=\\pi rl=\\pi\\cdot 7\\cdot 25=175\\pi\\text{ cm}^2$."}, {"type": "mcq", "level": "TH", "q": "Một hình trụ có bán kính đáy $r=6\\text{ cm}$, chiều cao $h=6\\text{ cm}$. Diện tích xung quanh của hình trụ là:", "options": ["A. $36\\pi\\text{ cm}^2$", "B. $60\\pi\\text{ cm}^2$", "C. $108\\pi\\text{ cm}^2$", "D. $72\\pi\\text{ cm}^2$"], "answer": "D", "explain": "$S_{xq}=2\\pi rh=2\\pi\\cdot 6\\cdot 6=72\\pi\\text{ cm}^2$."}, {"type": "truefalse", "level": "VD", "q": "Một hình nón có bán kính đáy $r=24\\text{ cm}$, chiều cao $h=7\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Đường sinh của hình nón bằng $24\\text{ cm}$.", "b) Diện tích xung quanh của hình nón bằng $600\\pi\\text{ cm}^2$.", "c) Thể tích của hình nón bằng $1344\\pi\\text{ cm}^3$.", "d) Diện tích toàn phần của hình nón bằng $1100\\pi\\text{ cm}^2$."], "answer": ["F", "T", "T", "F"], "explain": "$l=\\sqrt{24^2+7^2}=25\\text{ cm}$ nên a) sai; $S_{xq}=\\pi\\cdot 24\\cdot 25=600\\pi$; $V=\\dfrac{1}{3}\\pi\\cdot 24^2\\cdot 7=1344\\pi$; $S_{tp}=600\\pi+\\pi\\cdot 24^2=1176\\pi$ nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Một hình trụ có đường kính đáy $10\\text{ cm}$, chiều cao $h=12\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích xung quanh của hình trụ bằng $120\\pi\\text{ cm}^2$.", "b) Thể tích của hình trụ bằng $250\\pi\\text{ cm}^3$.", "c) Diện tích toàn phần của hình trụ bằng $160\\pi\\text{ cm}^2$.", "d) Diện tích một mặt đáy của hình trụ bằng $25\\pi\\text{ cm}^2$."], "answer": ["T", "F", "F", "T"], "explain": "Bán kính đáy $r=5\\text{ cm}$; $S_{xq}=2\\pi\\cdot 5\\cdot 12=120\\pi$; $V=\\pi\\cdot 5^2\\cdot 12=300\\pi$ nên b) sai; $S_{tp}=120\\pi+2\\cdot 25\\pi=170\\pi$ nên c) sai; diện tích một đáy $=25\\pi$."}, {"type": "short", "level": "VDC", "q": "Một thùng nước hình trụ có bán kính đáy $10\\text{ cm}$, chiều cao $30\\text{ cm}$ đang chứa nước đến một nửa thùng. Thể tích nước trong thùng bằng $a\\pi\\text{ cm}^3$. Giá trị của $a$ là bao nhiêu?", "answer": "1500", "explain": "Thể tích nước $=\\dfrac{1}{2}\\pi r^2h=\\dfrac{1}{2}\\pi\\cdot 10^2\\cdot 30=1500\\pi\\text{ cm}^3$ nên $a=1500$."}, {"type": "short", "level": "VDC", "q": "Một hình nón có diện tích xung quanh bằng $135\\pi\\text{ cm}^2$ và bán kính đáy $r=9\\text{ cm}$. Chiều cao của hình nón bằng bao nhiêu cm?", "answer": "12", "explain": "$S_{xq}=\\pi rl=135\\pi$ cho $l=15\\text{ cm}$; $h=\\sqrt{l^2-r^2}=\\sqrt{225-81}=\\sqrt{144}=12\\text{ cm}$."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức tính diện tích xung quanh của hình trụ là:", "options": ["A. $S_{xq}=\\pi r^2$", "B. $S_{xq}=\\pi rh$", "C. $S_{xq}=2\\pi r^2h$", "D. $S_{xq}=2\\pi rh$"], "answer": "D", "explain": "$S_{xq}=2\\pi rh$."}, {"type": "mcq", "level": "NB", "q": "Công thức tính thể tích của hình nón là:", "options": ["A. $V=\\pi r^2h$", "B. $V=\\dfrac{1}{3}\\pi r^2h$", "C. $V=\\pi rl$", "D. $V=2\\pi r^2h$"], "answer": "B", "explain": "$V_{\\text{nón}}=\\dfrac{1}{3}\\pi r^2h$."}, {"type": "mcq", "level": "NB", "q": "Đường cao của hình nón t 6=96\\pi$; $V=\\pi\\cdot 8^2\\cdot 6=384\\pi$; $S_{tp}=96\\pi+2\\pi\\cdot 8^2=224\\pi$ nên c) sai; $V$ tỉ lệ với $r^2$ nên khi $r$ gấp 3 thì $V$ tăng $3^2=9$ lần, không phải 6 lần."}, {"type": "truefalse", "level": "VD", "q": "Một hình nón có bán kính đáy $r=10\\text{ cm}$, chiều cao $h=24\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Đường sinh của hình nón bằng $25\\text{ cm}$.", "b) Diện tích xung quanh của hình nón bằng $250\\pi\\text{ cm}^2$.", "c) Thể tích của hình nón bằng $800\\pi\\text{ cm}^3$.", "d) Diện tích toàn phần của hình nón bằng $360\\pi\\text{ cm}^2$."], "answer": ["F", "F", "T", "T"], "explain": "$l=\\sqrt{10^2+24^2}=26\\text{ cm}$ nên a) sai; $S_{xq}=\\pi\\cdot 10\\cdot 26=260\\pi$ nên b) sai; $V=\\dfrac{1}{3}\\pi\\cdot 10^2\\cdot 24=800\\pi$; $S_{tp}=260\\pi+\\pi\\cdot 10^2=360\\pi$."}, {"type": "short", "level": "VDC", "q": "Một cái phễu có dạng hình nón với bán kính miệng phễu $7\\text{ cm}$, chiều cao $24\\text{ cm}$. Đường sinh của chiếc phễu bằng bao nhiêu cm?", "answer": "25", "explain": "$l=\\sqrt{r^2+h^2}=\\sqrt{7^2+24^2}=\\sqrt{49+576}=\\sqrt{625}=25\\text{ cm}$."}, {"type": "short", "level": "VDC", "q": "Một hình trụ có bán kính đáy $r=4\\text{ cm}$, chiều cao $h=9\\text{ cm}$. Diện tích toàn phần của hình trụ bằng $a\\pi\\text{ cm}^2$. Giá trị của $a$ là bao nhiêu?", "answer": "104", "explain": "$S_{tp}=2\\pi r(h+r)=2\\pi\\cdot 4\\cdot(9+4)=104\\pi\\text{ cm}^2$ nên $a=104$."}]}]}
