43\\pi\\text{ cm}^3$", "D. $2916\\pi\\text{ cm}^3$"], "answer": "A", "explain": "$V=\\dfrac{4}{3}\\pi R^3=\\dfrac{4}{3}\\pi\\cdot 9^3=972\\pi\\text{ cm}^3$."}, {"type": "mcq", "level": "TH", "q": "Một mặt cầu có đường kính $12\\text{ cm}$. Diện tích của mặt cầu là:", "options": ["A. $36\\pi\\text{ cm}^2$", "B. $72\\pi\\text{ cm}^2$", "C. $48\\pi\\text{ cm}^2$", "D. $144\\pi\\text{ cm}^2$"], "answer": "D", "explain": "Bán kính $R=12:2=6\\text{ cm}$; $S=4\\pi R^2=4\\pi\\cdot 6^2=144\\pi\\text{ cm}^2$."}, {"type": "truefalse", "level": "VD", "q": "Một hình cầu có đường kính $8\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích mặt cầu bằng $64\\pi\\text{ cm}^2$.", "b) Thể tích hình cầu bằng $\\dfrac{256}{3}\\pi\\text{ cm}^3$.", "c) Bán kính của hình cầu bằng $8\\text{ cm}$.", "d) Thể tích hình cầu bằng $64\\pi\\text{ cm}^3$."], "answer": ["T", "T", "F", "F"], "explain": "Bán kính $R=4\\text{ cm}$ nên c) sai; $S=4\\pi\\cdot 4^2=64\\pi$; $V=\\dfrac{4}{3}\\pi\\cdot 4^3=\\dfrac{256}{3}\\pi$ nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Một mặt cầu có bán kính $R=9\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích mặt cầu bằng $81\\pi\\text{ cm}^2$.", "b) Diện tích mặt cầu bằng $324\\pi\\text{ cm}^2$.", "c) Thể tích hình cầu tương ứng bằng $324\\pi\\text{ cm}^3$.", "d) Thể tích hình cầu tương ứng bằng $972\\pi\\text{ cm}^3$."], "answer": ["F", "T", "F", "T"], "explain": "$S=4\\pi\\cdot 9^2=324\\pi$ nên a) sai; $V=\\dfrac{4}{3}\\pi\\cdot 9^3=972\\pi$ nên c) sai."}, {"type": "short", "level": "VDC", "q": "Một quả bóng đá có đường kính $20\\text{ cm}$. Diện tích da cần dùng để may quả bóng (bỏ qua phần mép) bằng $a\\pi\\text{ cm}^2$. Giá trị của $a$ là bao nhiêu?", "answer": "400", "explain": "Bán kính $R=10\\text{ cm}$; $S=4\\pi R^2=4\\pi\\cdot 10^2=400\\pi\\text{ cm}^2$ nên $a=400$."}, {"type": "short", "level": "VDC", "q": "Hai mặt cầu có bán kính lần lượt là $6\\text{ cm}$ và $2\\text{ cm}$. Tỉ số diện tích của mặt cầu lớn và mặt cầu nhỏ bằng bao nhiêu?", "answer": "9", "explain": "Tỉ số diện tích $=\\dfrac{4\\pi\\cdot 6^2}{4\\pi\\cdot 2^2}=\\left(\\dfrac{6}{2}\\right)^2=9$."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức tính thể tích hình cầu là:", "options": ["A. $V=4\\pi R^3$", "B. $V=\\dfrac{4}{3}\\pi R^3$", "C. $V=\\dfrac{4}{3}\\pi R^2$", "D. $V=\\pi R^3$"], "answer": "B", "explain": "$V=\\dfrac{4}{3}\\pi R^3$."}, {"type": "mcq", "level": "NB", "q": "Công thức tính diện tích mặt cầu là:", "options": ["A. $S=2\\pi R$", "B. $S=\\pi R^2$", "C. $S=4\\pi R^2$", "D. $S=\\dfrac{4}{3}\\pi R^3$"], "answer": "C", "explain": "$S=4\\pi R^2$."}, {"type": "mcq", "level": "NB", "q": "Đoạn thẳng nối tâm của mặt cầu với một điểm trên mặt cầu được gọi là:", "options": ["A. đường kính", "B. dây cung", "C. đường sinh", "D. bán kính"], "answer": "D", "explain": "Bán kính $R$ của mặt cầu là đoạn thẳng nối tâm với một điểm trên mặt cầu."}, {"type": "mcq", "level": "TH", "q": "Một hình cầu có bán kính $R=4\\text{ cm}$. Thể tích của hình cầu là:", "options": ["A. $\\dfrac{256}{3}\\pi\\text{ cm}^3$", "B. $\\dfrac{128}{3}\\pi\\text{ cm}^3$", "C. $64\\pi\\text{ cm}^3$", "D. $\\dfrac{64}{3}\\pi\\text{ cm}^3$"], "answer": "A", "explain": "$V=\\dfrac{4}{3}\\pi R^3=\\dfrac{4}{3}\\pi\\cdot 4^3=\\dfrac{256}{3}\\pi\\text{ cm}^3$."}, {"type": "mcq", "level": "TH", "q": "Một mặt cầu có bán kính $R=4\\text{ cm}$. Diện tích của mặt cầu là:", "options": ["A. $16\\pi\\text{ cm}^2$", "B. $32\\pi\\text{ cm}^2$", "C. $64\\pi\\text{ cm}^2$", "D. $48\\pi\\text{ cm}^2$"], "answer": "C", "explain": "$S=4\\pi R^2=4\\pi\\cdot 4^2=64\\pi\\text{ cm}^2$."}, {"type": "mcq", "level": "TH", "q": "Một hình cầu có đường kính $6\\text{ cm}$. Thể tích của hình cầu là:", "options": ["A. $12\\pi\\text{ cm}^3$", "B. $18\\pi\\text{ cm}^3$", "C. $27\\pi\\text{ cm}^3$", "D. $36\\pi\\text{ cm}^3$"], "answer": "D", "explain": "Bán kính $R=3\\text{ cm}$; $V=\\dfrac{4}{3}\\pi R^3=\\dfrac{4}{3}\\pi\\cdot 3^3=36\\pi\\text{ cm}^3$."}, {"type": "truefalse", "level": "VD", "q": "Một hình cầu có bán kính $R=8\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích mặt cầu bằng $256\\pi\\text{ cm}^2$.", "b) Thể tích hình cầu bằng $512\\pi\\text{ cm}^3$.", "c) Đường kính của mặt cầu bằng $16\\text{ cm}$.", "d) Diện tích mặt cầu bằng $128\\pi\\text{ cm}^2$."], "answer": ["T", "F", "T", "F"], "explain": "$S=4\\pi\\cdot 8^2=256\\pi$ nên d) sai; $V=\\dfrac{4}{3}\\pi\\cdot 8^3=\\dfrac{2048}{3}\\pi$ nên b) sai; đường kính $=16\\text{ cm}$."}, {"type": "truefalse", "level": "VD", "q": "Một mặt cầu có bán kính $R=12\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích mặt cầu bằng $144\\pi\\text{ cm}^2$.", "b) Thể tích hình cầu tương ứng bằng $576\\pi\\text{ cm}^3$.", "c) Diện tích mặt cầu bằng $576\\pi\\text{ cm}^2$.", "d) Đường kính của mặt cầu bằng $24\\text{ cm}$."], "answer": ["F", "F", "T", "T"], "explain": "$S=4\\pi\\cdot 12^2=576\\pi$ nên a) sai; $V=\\dfrac{4}{3}\\pi\\cdot 12^3=2304\\pi$ nên b) sai; đường kính $=24\\text{ cm}$."}, {"type": "short", "level": "VDC", "q": "Một mặt cầu có diện tích $144\\pi\\text{ cm}^2$. Đường kính của mặt cầu bằng bao nhiêu cm?", "answer": "12", "explain": "$S=4\\pi R^2=144\\pi$ cho $R^2=36$, suy ra $R=6\\text{ cm}$ nên đường kính $=12\\text{ cm}$."}, {"type": "short", "level": "VDC", "q": "Hai hình cầu có bán kính lần lượt là $4\\text{ cm}$ và $1\\text{ cm}$. Tỉ số thể tích của hình cầu lớn và hình cầu nhỏ bằng bao nhiêu?", "answer": "64", "explain": "Tỉ số thể tích $=\\dfrac{\\frac{4}{3}\\pi\\cdot 4^3}{\\frac{4}{3}\\pi\\cdot 1^3}=\\left(\\dfrac{4}{1}\\right)^3=64$."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các công thức sau, công thức nào SAI?", "options": ["A. $S=4\\pi R^2$ (diện tích mặt cầu)", "B. $V=\\dfrac{4}{3}\\pi R^3$ (thể tích hình cầu)", "C. $d=2R$ ($d$ là đường kính mặt cầu)", "D. $V=4\\pi R^2$ (thể tích hình cầu)"], "answer": "D", "explain": "$4\\pi R^2$ là công thức diện tích mặt cầu, không phải thể tích hình cầu. Thể tích hình cầu là $V=\\dfrac{4}{3}\\pi R^3$."}, {"type": "mcq", "level": "NB", "q": "Công thức tính diện tích mặt cầu là:", "options": ["A. $S=4\\pi R^2$", "B. $S=2\\pi R^2$", "C. $S=6\\pi R^2$", "D. $S=\\pi R^2$"], "answer": "A", "explain": "$S=4\\pi R^2$."}, {"type": "mcq", "level": "NB", "q": "Công thức tính thể tích hình cầu là:", "options": ["A. $V=\\dfrac{1}{3}\\pi R^3$", "B. $V=\\dfrac{4}{3}\\pi R^3$", "C. $V=4\\pi R^3$", "D. $V=2\\pi R^3$"], "answer": "B", "explain": "$V=\\dfrac{4}{3}\\pi R^3$."}, {"type": "mcq", "level": "TH", "q": "Một mặt cầu có bán kính $R=11\\text{ cm}$. Diện tích của mặt cầu là:", "options": ["A. $121\\pi\\text{ cm}^2$", "B. $242\\pi\\text{ cm}^2$", "C. $484\\pi\\text{ cm}^2$", "D. $44\\pi\\text{ cm}^2$"], "answer": "C", "explain": "$S=4\\pi R^2=4\\pi\\cdot 11^2=484\\pi\\text{ cm}^2$."}, {"type": "mcq", "level": "TH", "q": "Một hình cầu có bán kính $R=12\\text{ cm}$. Thể tích của hình cầu là:", "options": ["A. $2304\\pi\\text{ cm}^3$", "B. $1152\\pi\\text{ cm}^3$", "C. $576\\pi\\text{ cm}^3$", "D. $6912\\pi\\text{ cm}^3$"], "answer": "A", "explain": "$V=\\dfrac{4}{3}\\pi R^3=\\dfrac{4}{3}\\pi\\cdot 12^3=2304\\pi\\text{ cm}^3$."}, {"type": "mcq", "level": "TH", "q": "Một mặt cầu có đường kính $4\\text{ cm}$. Diện tích của mặt cầu là:", "options": ["A. $4\\pi\\text{ cm}^2$", "B. $8\\pi\\text{ cm}^2$", "C. $\\dfrac{32}{3}\\pi\\text{ cm}^2$", "D. $16\\pi\\text{ cm}^2$"], "answer": "D", "explain": "Bán kính $R=2\\text{ cm}$; $S=4\\pi R^2=4\\pi\\cdot 2^2=16\\pi\\text{ cm}^2$."}, {"type": "truefalse", "level": "VD", "q": "Một hình cầu có bán kính $R=7\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích mặt cầu bằng $49\\pi\\text{ cm}^2$.", "b) Thể tích hình cầu bằng $\\dfrac{1372}{3}\\pi\\text{ cm}^3$.", "c) Diện tích mặt cầu bằng $196\\pi\\text{ cm}^2$.", "d) Nếu bán kính tăng gấp đôi thì thể tí  Diện tích vỏ quả dưa (xem như diện tích mặt cầu) bằng $a\\pi\\text{ cm}^2$. Giá trị của $a$ là bao nhiêu?", "answer": "576", "explain": "$S=\\pi d^2=\\pi\\cdot 24^2=576\\pi\\text{ cm}^2$ nên $a=576$."}, {"type": "short", "level": "VDC", "q": "Một hình cầu có thể tích $972\\pi\\text{ cm}^3$. Bán kính của hình cầu bằng bao nhiêu cm?", "answer": "9", "explain": "$V=\\dfrac{4}{3}\\pi R^3=972\\pi$ cho $R^3=729$, suy ra $R=9\\text{ cm}$."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức nào sau đây dùng để tính thể tích hình cầu có bán kính $R$?", "options": ["A. $V=4\\pi R^2$", "B. $V=\\pi R^2$", "C. $V=2\\pi R^3$", "D. $V=\\dfrac{4}{3}\\pi R^3$"], "answer": "D", "explain": "$V=\\dfrac{4}{3}\\pi R^3$."}, {"type": "mcq", "level": "NB", "q": "Công thức nào sau đây dùng để tính diện tích mặt cầu có bán kính $R$?", "options": ["A. $S=\\pi R^2$", "B. $S=4\\pi R^2$", "C. $S=2\\pi R^2$", "D. $S=\\dfrac{4}{3}\\pi R^2$"], "answer": "B", "explain": "$S=4\\pi R^2$."}, {"type": "mcq", "level": "NB", "q": "Mặt phẳng đi qua tâm của mặt cầu cắt mặt cầu theo:", "options": ["A. một hình tam giác", "B. một hình chữ nhật", "C. một hình tròn có bán kính bằng bán kính của mặt cầu", "D. một hình tròn nhỏ hơn hình tròn lớn"], "answer": "C", "explain": "Mặt phẳng qua tâm cắt mặt cầu theo đường tròn lớn, là hình tròn có bán kính đúng bằng bán kính $R$ của mặt cầu."}, {"type": "mcq", "level": "TH", "q": "Một mặt cầu có đường kính $8\\text{ cm}$. Diện tích của mặt cầu là:", "options": ["A. $64\\pi\\text{ cm}^2$", "B. $16\\pi\\text{ cm}^2$", "C. $32\\pi\\text{ cm}^2$", "D. $256\\pi\\text{ cm}^2$"], "answer": "A", "explain": "Bán kính $R=4\\text{ cm}$; $S=4\\pi R^2=4\\pi\\cdot 4^2=64\\pi\\text{ cm}^2$."}, {"type": "mcq", "level": "TH", "q": "Một hình cầu có đường kính $8\\text{ cm}$. Thể tích của hình cầu là:", "options": ["A. $64\\pi\\text{ cm}^3$", "B. $\\dfrac{128}{3}\\pi\\text{ cm}^3$", "C. $\\dfrac{256}{3}\\pi\\text{ cm}^3$", "D. $\\dfrac{32}{3}\\pi\\text{ cm}^3$"], "answer": "C", "explain": "Bán kính $R=4\\text{ cm}$; $V=\\dfrac{4}{3}\\pi R^3=\\dfrac{4}{3}\\pi\\cdot 4^3=\\dfrac{256}{3}\\pi\\text{ cm}^3$."}, {"type": "mcq", "level": "TH", "q": "Một mặt cầu có bán kính $R=30\\text{ cm}$. Diện tích của mặt cầu là:", "options": ["A. $900\\pi\\text{ cm}^2$", "B. $3600\\pi\\text{ cm}^2$", "C. $1800\\pi\\text{ cm}^2$", "D. $120\\pi\\text{ cm}^2$"], "answer": "B", "explain": "$S=4\\pi R^2=4\\pi\\cdot 30^2=3600\\pi\\text{ cm}^2$."}, {"type": "truefalse", "level": "VD", "q": "Một hình cầu có bán kính $R=30\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Diện tích mặt cầu bằng $3600\\pi\\text{ cm}^2$.", "b) Thể tích hình cầu bằng $36000\\pi\\text{ cm}^3$.", "c) Đường kính của mặt cầu bằng $30\\text{ cm}$.", "d) Diện tích mặt cầu bằng $1800\\pi\\text{ cm}^2$."], "answer": ["T", "T", "F", "F"], "explain": "$S=4\\pi\\cdot 30^2=3600\\pi$ nên d) sai; $V=\\dfrac{4}{3}\\pi\\cdot 30^3=36000\\pi$; đường kính $=60\\text{ cm}$ nên c) sai."}, {"type": "truefalse", "level": "VD", "q": "Cho hai mặt cầu có bán kính lần lượt là $3\\text{ cm}$ và $6\\text{ cm}$. Xét tính đúng sai của các khẳng định sau:", "statements": ["a) Tỉ số diện tích của mặt cầu lớn và mặt cầu nhỏ bằng $2$.", "b) Tỉ số thể tích của hình cầu lớn và hình cầu nhỏ bằng $4$.", "c) Diện tích mặt cầu lớn gấp 4 lần diện tích mặt cầu nhỏ.", "d) Thể tích hình cầu lớn gấp 8 lần thể tích hình cầu nhỏ."], "answer": ["F", "F", "T", "T"], "explain": "Tỉ số diện tích $=\\left(\\dfrac{6}{3}\\right)^2=4$ nên a) sai; tỉ số thể tích $=\\left(\\dfrac{6}{3}\\right)^3=8$ nên b) sai."}, {"type": "short", "level": "VDC", "q": "Một quả bóng rổ có chu vi đường tròn lớn bằng $20\\pi\\text{ cm}$. Bán kính của quả bóng bằng bao nhiêu cm?", "answer": "10", "explain": "Chu vi đường tròn lớn $=2\\pi R=20\\pi$, suy ra $R=10\\text{ cm}$."}, {"type": "short", "level": "VDC", "q": "Một hình cầu có diện tích mặt cầu bằng $144\\pi\\text{ cm}^2$. Thể tích của hình cầu bằng $a\\pi\\text{ cm}^3$. Giá trị của $a$ là bao nhiêu?", "answer": "288", "explain": "$S=4\\pi R^2=144\\pi$ cho $R=6\\text{ cm}$; $V=\\dfrac{4}{3}\\pi\\cdot 6^3=288\\pi\\text{ cm}^3$ nên $a=288$."}]}]}
