 → MgCl2 + H2). Tính thể tích H2 ở đkc (đơn vị: L).", "answer": "4,958", "explain": "n_Mg = 0,2 mol; n_H2 = 0,2 mol; V = 4,958 L.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Lượng chất tính được từ PTHH khi phản ứng xảy ra hoàn toàn gọi là:", "options": ["A. Lượng lí thuyết", "B. Lượng thực tế", "C. Lượng dư thừa", "D. Lượng hao phí"], "answer": "A", "explain": "Đó là lượng lí thuyết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệu suất phản ứng trong thực tế thường:", "options": ["A. Bằng 100%", "B. Nhỏ hơn 100%", "C. Lớn hơn 100%", "D. Bằng 0%"], "answer": "B", "explain": "Do hao hụt nên hiệu suất thường nhỏ hơn 100%.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho PTHH: S + O2 → SO2. Đốt cháy 0,5 mol S cần bao nhiêu mol O2?", "options": ["A. 1 mol", "B. 2 mol", "C. 0,5 mol", "D. 0,25 mol"], "answer": "C", "explain": "Tỉ lệ 1 : 1 nên cần 0,5 mol O2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho PTHH: 2H2O → 2H2 + O2 (điện phân). Điện phân 2 mol H2O thu được bao nhiêu mol H2?", "options": ["A. 1 mol", "B. 4 mol", "C. 0,5 mol", "D. 2 mol"], "answer": "D", "explain": "Tỉ lệ H2O : H2 = 1 : 1 nên thu được 2 mol H2.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 16 gam CuO (M = 80) tác dụng với H2 (CuO + H2 → Cu + H2O). Khối lượng Cu (M = 64) thu được là:", "options": ["A. 12,8 gam", "B. 6,4 gam", "C. 3,2 gam", "D. 25,6 gam"], "answer": "A", "explain": "n_CuO = 0,2 mol; n_Cu = 0,2 mol; m = 12,8 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nung 200 gam CaCO3 (CaCO3 → CaO + CO2) với hiệu suất 90%. Thể tích CO2 ở đkc thực tế thu được là:", "options": ["A. 49,58 L", "B. 44,622 L", "C. 22,311 L", "D. 4,4622 L"], "answer": "B", "explain": "Lí thuyết 49,58 L; thực tế = 49,58 × 90% = 44,622 L.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về vai trò của PTHH trong tính toán.", "statements": ["a) Bài toán tính theo PTHH luôn bắt đầu bằng việc viết PTHH.", "b) Số mol là cầu nối giữa các đại lượng.", "c) Từ khối lượng chất tham gia tính được khối lượng sản phẩm.", "d) Hệ số PTHH không liên quan đến tính toán."], "answer": ["T", "T", "T", "F"], "explain": "Hệ số PTHH cho biết tỉ lệ mol để tính toán.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về cách tính khối lượng sản phẩm.", "statements": ["a) Cho m gam A, muốn tính m gam B phải qua số mol.", "b) Tỉ lệ mol A : B lấy từ hệ số PTHH.", "c) n_B = n_A × (hệ số B/hệ số A).", "d) m_B = m_A × (hệ số B/hệ số A)."], "answer": ["T", "T", "T", "F"], "explain": "Phải qua số mol, không nhân trực tiếp khối lượng với tỉ lệ hệ số.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho PTHH: Ca + 2H2O → Ca(OH)2 + H2. Cho 2 mol Ca tác dụng hết với nước, số mol H2 thu được là bao nhiêu?", "answer": "2", "explain": "Tỉ lệ Ca : H2 = 1 : 1.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Đốt cháy 3,2 gam S (M = 32) trong O2 (S + O2 → SO2). Tính khối lượng SO2 (M = 64) thu được (đơn vị: gam).", "answer": "6,4", "explain": "n_S = 0,1 mol; n_SO2 = 0,1 mol; m = 6,4 gam.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Bước 2 trong tính toán theo PTHH là:", "options": ["A. Tính số mol của chất đã biết", "B. Viết PTHH", "C. Tính khối lượng chất cần tìm", "D. Tính hiệu suất"], "answer": "A", "explain": "Bước 2: tính số mol của chất đã biết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bước 3 trong tính toán theo PTHH là:", "options": ["A. Viết PTHH", "B. Dựa vào tỉ lệ mol trong PTHH tính số mol chất cần tìm", "C. Tính số mol chất đã biết", "D. Tính thể tích"], "answer": "B", "explain": "Bước 3: dựa vào tỉ lệ mol trong PTHH tính số mol chất cần tìm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho PTHH: Fe + 2HCl → FeCl2 + H2. Cho 0,3 mol Fe tác dụng hết, số mol HCl cần dùng là:", "options": ["A. 0,3 mol", "B. 0,15 mol", "C. 0,6 mol", "D. 0,45 mol"], "answer": ": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về ý nghĩa của tính theo PTHH.", "statements": ["a) Tính theo PTHH giúp biết lượng chất cần dùng và thu được.", "b) Trong công nghiệp, tính theo PTHH giúp tính nguyên liệu.", "c) Số mol là đại lượng trung gian quan trọng nhất.", "d) Chỉ cần biết khối lượng là tính được mọi thứ."], "answer": ["T", "T", "T", "F"], "explain": "Phải qua số mol và tỉ lệ PTHH.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về tính thể tích chất khí.", "statements": ["a) Bài cho V khí ở đkc thì tính n = V/24,79.", "b) Bài hỏi m thì tính m = n × M ở bước cuối.", "c) Tỉ lệ mol lấy từ hệ số cân bằng.", "d) Có thể thay số mol bằng khối lượng trong tỉ lệ PTHH."], "answer": ["T", "T", "T", "F"], "explain": "Tỉ lệ trong PTHH là tỉ lệ số mol, không phải khối lượng.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho PTHH: 2Na + Cl2 → 2NaCl. Với 1 mol Cl2, số mol NaCl tạo thành là bao nhiêu?", "answer": "2", "explain": "Tỉ lệ Cl2 : NaCl = 1 : 2.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cho 9,8 gam H2SO4 (M = 98) tác dụng với NaOH (H2SO4 + 2NaOH → Na2SO4 + 2H2O). Tính khối lượng Na2SO4 (M = 142) (đơn vị: gam).", "answer": "14,2", "explain": "n = 0,1 mol; m = 14,2 gam.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Đại lượng nào có đơn vị mol?", "options": ["A. Lượng chất", "B. Khối lượng", "C. Thể tích", "D. Nồng độ"], "answer": "A", "explain": "Mol là đơn vị đo lượng chất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "1 mol khí ở đkc chiếm thể tích:", "options": ["A. 22,4 L", "B. 24,79 L", "C. 24 L", "D. 1 L"], "answer": "B", "explain": "Ở đkc, 1 mol khí chiếm 24,79 L.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho PTHH: 2SO2 + O2 → 2SO3. Để tạo thành 2 mol SO3 cần bao nhiêu mol SO2?", "options": ["A. 1 mol", "B. 4 mol", "C. 2 mol", "D. 0,5 mol"], "answer": "C", "explain": "Tỉ lệ SO2 : SO3 = 1 : 1 nên cần 2 mol SO2.", "
