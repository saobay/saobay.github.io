ất nhanh.", "d) Mọi phản ứng đốt cháy đều xảy ra với tốc độ như nhau."], "answer": ["T", "T", "T", "F"], "explain": "Tốc độ đốt cháy phụ thuộc vào nhiên liệu và điều kiện.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu tên một chất xúc tác sinh học.", "answer": "Enzyme", "explain": "Enzyme là chất xúc tác sinh học trong cơ thể.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao khi nhóm bếp than, người ta xếp than thưa và quạt mạnh?", "answer": "Để tăng tiếp xúc với oxygen", "explain": "Tăng lượng oxygen và diện tích tiếp xúc giúp than cháy mạnh hơn.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Nghiên cứu tốc độ phản ứng giúp:", "options": ["A. Điều khiển phản ứng theo ý muốn trong sản xuất và đời sống", "B. Biết màu sắc sản phẩm", "C. Đo khối lượng chính xác", "D. Tính thể tích bình"], "answer": "A", "explain": "Nghiên cứu tốc độ giúp điều khiển phản ứng theo ý muốn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi diện tích bề mặt tiếp xúc tăng, tốc độ phản ứng:", "options": ["A. Giảm", "B. Tăng", "C. Không đổi", "D. Bằng 0"], "answer": "B", "explain": "Diện tích tiếp xúc tăng làm tốc độ phản ứng tăng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để dập tắt đám cháy do xăng dầu, không nên dùng:", "options": ["A. Cát", "B. Chăn ướt", "C. Nước", "D. Bình CO2"], "answer": "C", "explain": "Xăng nhẹ hơn nước, dùng nước làm đám cháy lan rộng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp nào làm chậm tốc độ phản ứng?", "options": ["A. Tăng nhiệt độ", "B. Tăng nồng độ", "C. Thêm chất xúc tác", "D. Giảm nhiệt độ"], "answer": "D", "explain": "Giảm nhiệt độ làm tốc độ phản ứng giảm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai viên C sủi cùng loại: viên 1 để nguyên, viên 2 bẻ nhỏ, cùng cho vào 2 cốc nước ấm như nhau. Viên nào tan nhanh hơn?", "options": ["A. Viên 1", "B. Hai viên như nhau", "C. Không viên nào tan", "D. Viên 2"], "answer": "D", "explain": "Viên bẻ nhỏ có diện tích tiếp xúc lớn hơn nên tan nhanh hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong công nghiệp, người ta thường nghiền nhỏ quặng trước khi nung vì:", "options": ["A. Tăng diện tích tiếp xúc, phản ứng xảy ra nhanh và hoàn toàn hơn", "B. Quặng nhỏ dễ vận chuyển", "C. Quặng nhỏ rẻ hơn", "D. Quặng nhỏ đẹp hơn"], "answer": "A", "explain": "Tăng diện tích tiếp xúc giúp phản ứng nhanh và hoàn toàn hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về biểu diễn tốc độ phản ứng.", "statements": ["a) Tốc độ phản ứng là độ biến thiên nồng độ trong một đơn vị thời gian.", "b) Đơn vị tốc độ phản ứng thường là mol/(L.s).", "c) Tốc độ phản ứng luôn không đổi trong suốt quá trình.", "d) Khi chất tham gia giảm dần, tốc độ thường giảm."], "answer": ["T", "T", "F", "T"], "explain": "Tốc độ thường giảm dần khi nồng độ chất tham gia giảm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về tính chất của chất xúc tác.", "statements": ["a) Chất xúc tác làm tăng tốc độ nhưng không làm tăng lượng sản phẩm.", "b) Chất xúc tác không bị biến đổi sau phản ứng.", "c) Không có chất xúc tác, phản ứng vẫn xảy ra.", "d) Chất xúc tác tham gia tạo thành sản phẩm mới."], "answer": ["T", "T", "T", "F"], "explain": "Chất xúc tác không tạo thành sản phẩm mới.", "points": 1}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Nhiệt độ tăng thì tốc độ phản ứng ...", "answer": "Tăng", "explain": "Nhiệt độ tăng làm tốc độ phản ứng tăng.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một biện pháp làm chậm quá trình ôi thiu của thực phẩm.", "answer": "Bảo quản lạnh", "explain": "Nhiệt độ thấp làm chậm tốc độ phản ứng phân hủy.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Yếu tố nào sau đây làm tăng tốc độ phản ứng?", "options": ["A. Tăng nồng độ chất tham gia", "B. Giảm nhiệt độ", "C. Pha loãng dung dịch", "D. Giảm diện tích tiếp xúc"], "answer": "A", "explain": "Tăng nồng độ làm tăng tốc độ phản ứng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất xúc tác được sử dụng với:", "options": ["A. Lượng rất lớn", "B. Lượng nhỏ", "C. Lượng bằng chất tham gia", "D. Lượng tùy ý không giới hạn"], "answer": "B", "explain": "Chất xúc tác chỉ cần dùng với lượng nhỏ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để củi cháy nhanh hơn, ta nên:", "options": ["A. Dùng củi to nguyên khúc", "B. Tưới nước vào củi", "C. Chẻ nhỏ củi", "D. Để củi nơi ẩm"], "answer": "C", "explain": "Chẻ nhỏ làm tăng diện tích tiếp xúc với oxygen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để làm tăng tốc độ hòa tan muối ăn, ta nên:", "options": ["A. Dùng nước lạnh và để yên", "B. Dùng nước đá", "C. Để muối nguyên cục", "D. Dùng nước nóng và khuấy đều"], "answer": "D", "explain": "Nước nóng và khuấy đều giúp muối tan nhanh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong các phản ứng sau, phản ứng nào có tốc độ nhanh nhất?", "options": ["A. Đốt cháy magnesium", "B. Sắt gỉ", "C. Lên men rượu", "D. Đá vôi bị phong hóa"], "answer": "A", "explain": "Đốt cháy magnesium xảy ra rất nhanh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 2 mẩu đá vôi cùng khối lượng, một mẩu để nguyên, một mẩu nghiền nhỏ vào 2 cốc đựng cùng thể tích HCl cùng nồng độ. Sau cùng, lượng CO2 thu được ở 2 cốc:", "options": ["A. Cốc nghiền nhỏ nhiều hơn", "B. Bằng nhau", "C. Cốc để nguyên nhiều hơn", "D. Không thu được CO2"], "answer": "B", "explain": "Lượng chất tham gia bằng nhau nên lượng CO2 cuối cùng bằng nhau.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về chiều ảnh hưởng của các yếu tố.", "statements": ["a) Mọi yếu tố đều làm tăng tốc độ phản ứng.", "b) Giảm nhiệt độ làm giảm tốc độ phản ứng.", "c) Giảm nồng độ làm giảm tốc độ phản ứng.", "d) Giảm diện tích tiếp xúc làm giảm tốc độ phản ứng."], "answer": ["F", "T", "T", "T"], "explain": "Không phải mọi yếu tố đều làm tăng tốc độ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về ứng dụng trong nấu ăn.", "statements": ["a) Quạt bếp than làm tăng lượng oxygen, than cháy mạnh hơn.", "b) Đậy vung khi nấu giúp giữ nhiệt, thức ăn chín nhanh.", "c) Thái nhỏ thực phẩm giúp chín nhanh hơn.", "d) Để thực phẩm ở nhiệt độ thường giúp bảo quản lâu."], "answer": ["T", "T", "T", "F"], "explain": "Nhiệt độ thường làm thực phẩm nhanh hỏng, nên bảo quản lạnh.", "points": 1}, {"type": "short", "level": "TH", "q": "Chất xúc tác sau phản ứng có bị biến đổi không?", "answer": "Không", "explain": "Chất xúc tác không bị biến đổi về chất và lượng sau phản ứng.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một ví dụ về việc điều chỉnh tốc độ phản ứng trong đời sống.", "answer": "Bảo quản thực phẩm trong tủ lạnh", "explain": "Giảm nhiệt độ để làm chậm quá trình phân hủy thực phẩm.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tốc độ phản ứng càng lớn thì:", "options": ["A. Phản ứng xảy ra càng nhanh", "B. Phản ứng xảy ra càng chậm", "C. Phản ứng không xảy ra", "D. Nhiệt độ càng thấp"], "answer": "A", "explain": "Tốc độ càng lớn thì phản ứng xảy ra càng nhanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào đúng về chất xúc tác?", "options": ["A. Làm giảm tốc độ phản ứng", "B. Làm tăng tốc độ phản ứng", "C. Làm thay đổi lượng sản phẩm", "D. Bị tiêu hao sau phản ứng"], "answer": "B", "explain": "Chất xúc tác làm tăng tốc độ phản ứng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để làm chậm sự chín của trái cây, người ta:", "options": ["A. Để nơi nóng", "B. Phơi nắng", "C. Bảo quản lạnh", "D. Để nơi ẩm"], "answer": "C", "explain": "Bảo quản lạnh làm chậm quá trình chín.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi muốn dập tắt đám cháy nhỏ do chập điện, không nên:", "options": ["A. Dùng bình CO2", "B. Dùng cát", "C. Ngắt nguồn điện", "D. Dùng nước"], "answer": "D", "explain": "Chập điện dùng nước rất nguy hiểm vì nước dẫn điện.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho cùng lượng kẽm vào 2 cốc: cốc 1 đựng HCl 1M ở 25°C, cốc 2 đựng HCl 1M ở 50°C. Dự đoán đúng là:", "options": ["A. Cốc 1 sủi bọt nhanh hơn", "B. Cốc 2 sủi bọt nhanh hơn", "C. Hai cốc như nhau", "D. Không có bọt khí"], "answer": "B", "explain": "Nhiệt độ cao hơn làm tốc độ phản ứng nhanh hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Có 4 yếu tố: (1) nồng độ, (2) nhiệt độ, (3) chất xúc tác, (4) diện tích bề mặt. Số yếu tố có thể làm tăng tốc độ phản ứng là:", "options": ["A. 1", "B. 2", "C. 4", "D. 3"], "answer": "C", "explain": "Cả 4 yếu tố đều có thể làm tăng tốc độ phản ứng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về các yếu tố và ứng dụng thực tế.", "statements": ["a) Nồng độ, nhiệt độ ảnh hưởng đến tốc độ phản ứng.", "b) Diện tích bề mặt, chất xúc tác ảnh hưởng đến tốc độ phản ứng.", "c) Tốc độ phản ứng không thể điều chỉnh.", "d) Điều chỉnh tốc độ phản ứng có nhiều ứng dụng thực tế."], "answer": ["T", "T", "F", "T"], "explain": "Có thể điều chỉnh tốc độ phản ứng theo ý muốn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về điều khiển tốc độ phản ứng.", "statements": ["a) Phản ứng nổ xảy ra rất nhanh.", "b) Phản ứng gỉ sắt xảy ra chậm.", "c) Có thể làm phản ứng nhanh lên hoặc chậm đi.", "d) Tốc độ phản ứng luôn không đổi dù điều kiện thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "Tốc độ phản ứng thay đổi theo điều kiện.", "points": 1}, {"type": "short", "level": "TH", "q": "Nêu hai yếu tố ảnh hưởng đến tốc độ phản ứng.", "answer": "Nồng độ và nhiệt độ", "explain": "Các yếu tố: nồng độ, nhiệt độ, diện tích bề mặt, chất xúc tác.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao trong công nghiệp người ta quan tâm đến tốc độ phản ứng?", "answer": "Để điều khiển phản ứng, tăng năng suất", "explain": "Tăng tốc độ giúp tăng năng suất, tiết kiệm thời gian và chi phí.", "points": 0.5}]}]}
