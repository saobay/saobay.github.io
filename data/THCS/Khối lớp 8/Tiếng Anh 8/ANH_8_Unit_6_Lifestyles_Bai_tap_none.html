{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","q":"Choose the word in which the letter 'g' has a different pronunciation from the others.","options":["A. garage","B. change","C. village","D. bridge"],"answer":"A","level":"NB","explain":"Các từ village, change, bridge có 'g' phát âm là /dʒ/, còn garage có 'g' phát âm là /ʒ/ (ˈɡærɑːʒ) nên khác."},{"type":"mcq","q":"Choose the word in which the letter 's' has a different pronunciation from the others.","options":["A. sit","B. six","C. vision","D. sun"],"answer":"C","level":"NB","explain":"Các từ sun, sit, six có 's' phát âm là /s/, còn vision có 's' phát âm là /ʒ/ (ˈvɪʒn) nên khác."},{"type":"mcq","q":"Choose the word with a different main stress from the others.","options":["A. gadget","B. convenient","C. habit","D. lifestyle"],"answer":"B","level":"TH","explain":"Các từ lifestyle, habit, gadget nhấn âm tiết 1, còn convenient nhấn âm tiết 2 (conˈvenient) nên khác."},{"type":"mcq","q":"Many young people enjoy the fast ___ of city life.","options":["A. habit","B. custom","C. lifestyle","D. routine"],"answer":"C","level":"NB","explain":"lifestyle = lối sống. Nhịp sống nhanh của thành phố."},{"type":"mcq","q":"A ___ diet with vegetables and fruit keeps you healthy.","options":["A. balanced","B. crowded","C. modern","D. peaceful"],"answer":"A","level":"TH","explain":"balanced diet = chế độ ăn cân bằng, tốt cho sức khỏe."},{"type":"mcq","q":"Robots ___ do most of the housework in the future.","options":["A. will","B. are","C. do","D. did"],"answer":"A","level":"VD","explain":"Thì tương lai đơn diễn tả dự đoán: S + will + V. Câu A đúng ngữ pháp."},{"type":"mcq","q":"A: How do you stay healthy? - B: ___","options":["A. \"Thank you.\"","B. \"I jog every morning.\"","C. \"I don't know.\"","D. \"Good luck.\""],"answer":"B","level":"TH","explain":"Trả lời đúng câu hỏi về thói quen giữ sức khỏe: chạy bộ mỗi sáng."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). A healthy lifestyle starts with small daily habits. Mai drinks eight glasses of water and eats lots of vegetables every day. She also walks to school instead of taking the bus. She feels full of energy from morning to night.","statements":["a) A healthy lifestyle begins with daily habits.","b) Mai drinks little water every day.","c) She walks to school every day.","d) She often feels tired."],"answer":["T","F","T","F"],"level":"VD","explain":"a) Đúng: lối sống khỏe bắt đầu từ thói quen hằng ngày. b) Sai: Mai uống 8 cốc nước (eight glasses), không phải ít. c) Đúng: đi bộ đến trường. d) Sai: cô ấy tràn đầy năng lượng, không mệt mỏi."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Smart homes are becoming popular in modern cities. Lights, fans and air conditioners can turn on by themselves. Homeowners control everything with a phone app. However, smart homes are still too expensive for many families.","statements":["a) Smart homes are common in modern cities now.","b) Devices in smart homes work automatically.","c) People control smart homes with a phone app.","d) Every family can afford a smart home today."],"answer":["T","T","T","F"],"level":"VDC","explain":"a) Đúng: nhà thông minh ngày càng phổ biến. b) Đúng: thiết bị tự bật/tắt. c) Đúng: điều khiển bằng ứng dụng điện thoại. d) Sai: vẫn còn quá đắt với nhiều gia đình."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. If you save energy, you ___ (help) protect the environment.","answer":"will help","level":"VDC","explain":"Câu điều kiện loại 1: If + hiện tại đơn, S + will + V. Chủ ngữ 'you' nên dùng 'will help'."}]},{"name":"Đề 2","questions":[{"type":"mcq","q":"Pick out the word whose 'g' sound is different from the others.","options":["A. page","B. large","C. garage","D. village"],"answer":"C","level":"NB","explain":"Các từ village, page, large có 'g' phát âm là /dʒ/, còn garage có 'g' phát âm là /ʒ/ (ˈɡærɑːʒ) nên khác."},{"type":"mcq","q":"Pick out the word whose 's' sound is different from the others.","options":["A. bus","B. class","C. decision","D. face"],"answer":"C","level":"NB","explain":"Các từ bus, face, class có 's' phát âm là /s/, còn decision có 's' phát âm là /ʒ/ (dɪˈsɪʒn) nên khác."},{"type":"mcq","q":"Choose the word with its main stress on the second syllable.","options":["A. jogging","B. diet","C. workout","D. technology"],"answer":"D","level":"TH","explain":"technology nhấn âm tiết 2 (techˈnology); workout, jogging, diet đều nhấn âm tiết 1."},{"type":"mcq","q":"My morning ___ includes jogging, breakfast and reading news.","options":["A. routine","B. lifestyle","C. custom","D. habit"],"answer":"A","level":"NB","explain":"routine = thói quen sinh hoạt hằng ngày vào buổi sáng."},{"type":"mcq","q":"Life in the countryside is ___, with fresh air and green fields.","options":["A. noisy","B. peaceful","C. modern","D. crowded"],"answer":"B","level":"TH","explain":"peaceful = yên bình, phù hợp với miêu tả đồng quê."},{"type":"mcq","q":"If you eat too much fast food, you ___ get fat.","options":["A. got","B. getting","C. will get","D. get"],"answer":"C","level":"VD","explain":"Câu điều kiện loại 1: If + hiện tại đơn (eat), S + will + V (will get)."},{"type":"mcq","q":"A: City life is so noisy! - B: ___","options":["A. \"Me too not.\"","B. \"I hate cities.\"","C. \"No, it isn't.\"","D. \"Yes, but it's very convenient.\""],"answer":"D","level":"TH","explain":"Đồng tình một phần rồi đưa ý kiến cân bằng: ồn ào nhưng rất tiện lợi."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Teenagers today spend a lot of time on screens. Many of them use phones for more than five hours a day. Too much screen time can harm their eyes and sleep. Doctors advise teens to exercise outdoors every day.","statements":["a) Many teens use phones over five hours daily.","b) Screen time is good for teens' eyes.","c) Doctors advise outdoor exercise every day.","d) Teens spend little time on screens."],"answer":["T","F","T","F"],"level":"VD","explain":"a) Đúng: hơn 5 giờ mỗi ngày. b) Sai: dùng màn hình quá nhiều hại mắt và giấc ngủ. c) Đúng: bác sĩ khuyên vận động ngoài trời mỗi ngày. d) Sai: thanh thiếu niên dùng màn hình rất nhiều."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). In the future, many people may live in smart cities. Driverless buses will take children to school. Robots will clean streets and deliver food. However, some people worry that life will become less human and warm.","statements":["a) Driverless buses may take children to school.","b) Robots will do cleaning and delivery jobs.","c) Everyone is excited about smart cities.","d) Some people fear life will feel less warm."],"answer":["T","T","F","T"],"level":"VDC","explain":"a) Đúng: xe buýt tự lái đưa trẻ đến trường. b) Đúng: robot dọn đường phố và giao đồ ăn. c) Sai: một số người lo lắng, không phải ai cũng hào hứng. d) Đúng: lo cuộc sống kém ấm áp tình người."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. In the future, people ___ (travel) by flying cars.","answer":"will travel","level":"VDC","explain":"Thì tương lai đơn diễn tả dự đoán: S + will + V → will travel."}]},{"name":"Đề 3","questions":[{"type":"mcq","q":"Choose the word with a different pronunciation of the letter 'g'.","options":["A. massage","B. jump","C. age","D. job"],"answer":"A","level":"NB","explain":"Các từ job, jump, age có 'g'/'j' phát âm là /dʒ/, còn massage có 'g' phát âm là /ʒ/ (məˈsɑːʒ) nên khác."},{"type":"mcq","q":"Choose the word with a different pronunciation of the letter 's'.","options":["A. desk","B. television","C. stop","D. fast"],"answer":"B","level":"NB","explain":"Các từ desk, fast, stop có 's' phát âm là /s/, còn television có 's' phát âm là /ʒ/ (ˈtelɪvɪʒn) nên khác."},{"type":"mcq","q":"Pick the word with a different stress pattern from the others.","options":["A. routine","B. comfortable","C. balanced","D. suburb"],"answer":"A","level":"TH","explain":"Các từ comfortable, balanced, suburb nhấn âm tiết 1, còn routine nhấn âm tiết 2 (rouˈtine) nên khác."},{"type":"mcq","q":"Smartphones are useful ___ that help us study and relax.","options":["A. devices","B. machines","C. gadgets","D. tools"],"answer":"A","level":"NB","explain":"device = thiết bị. Điện thoại thông minh là thiết bị hữu ích."},{"type":"mcq","q":"The streets in big cities are always ___ with people and vehicles.","options":["A. quiet","B. crowded","C. peaceful","D. modern"],"answer":"B","level":"TH","explain":"crowded = đông đúc, phù hợp với đường phố thành phố lớn."},{"type":"mcq","q":"I think people ___ live on the Moon in 100 years.","options":["A. don't","B. aren't","C. didn't","D. won't"],"answer":"D","level":"VD","explain":"Dự đoán tương lai dùng will/won't + V. Câu A đúng ngữ pháp và nghĩa."},{"type":"mcq","q":"A: Will robots replace teachers? - B: ___","options":["A. \"Maybe not will.\"","B. \"Yes, they willn't.\"","C. \"No, they don't.\"","D. \"I don't think so.\""],"answer":"D","level":"TH","explain":"Trả lời câu hỏi dự đoán một cách tự nhiên: I don't think so (Tôi không nghĩ vậy)."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Walking is a simple but great habit. Mr Lam walks 30 minutes every morning in the park. Walking helps him stay fit and sleep well. He also meets friends and chats during his walks.","statements":["a) Walking is a simple and healthy habit.","b) Mr Lam walks for 30 minutes each morning.","c) Walking helps him sleep well.","d) He walks alone and never talks to anyone."],"answer":["T","T","T","F"],"level":"VD","explain":"a) Đúng: đi bộ là thói quen đơn giản và tốt. b) Đúng: 30 phút mỗi sáng. c) Đúng: giúp ngủ ngon. d) Sai: ông gặp gỡ, trò chuyện với bạn bè khi đi bộ."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Green living means choosing habits that protect the Earth. People cycle to work, reuse bags and save water. Green homes use solar energy for lights. Living green is not difficult if everyone starts with small actions.","statements":["a) Green living protects the environment.","b) People reuse bags and save water.","c) Green homes use solar energy.","d) Living green requires big actions only."],"answer":["T","T","T","F"],"level":"VDC","explain":"a) Đúng: sống xanh bảo vệ Trái Đất. b) Đúng: tái dùng túi, tiết kiệm nước. c) Đúng: dùng năng lượng mặt trời. d) Sai: bắt đầu từ những hành động nhỏ là đủ."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. Regular exercise is good for your ___ (healthy).","answer":"health","level":"VDC","explain":"Sau tính từ sở hữu 'your' cần một danh từ; healthy (tính từ) chuyển thành health (danh từ)."}]},{"name":"Đề 4","questions":[{"type":"mcq","q":"Which word has a different 's' sound from the others?","options":["A. speak","B. sport","C. swim","D. pleasure"],"answer":"D","level":"NB","explain":"Các từ sport, speak, swim có 's' phát âm là /s/, còn pleasure có 's' phát âm là /ʒ/ (ˈpleʒə) nên khác."},{"type":"mcq","q":"Which word has a different 'g' sound from the others?","options":["A. change","B. massage","C. large","D. bridge"],"answer":"B","level":"NB","explain":"Các từ bridge, large, change có 'g' phát âm là /dʒ/, còn massage có 'g' phát âm là /ʒ/ nên khác."},{"type":"mcq","q":"Choose the word with its main stress on the first syllable.","options":["A. convenient","B. routine","C. device","D. modern"],"answer":"D","level":"TH","explain":"modern nhấn âm tiết 1; device, routine, convenient đều nhấn âm tiết 2."},{"type":"mcq","q":"This new ___ can translate speech into 20 languages.","options":["A. diet","B. suburb","C. habit","D. gadget"],"answer":"D","level":"NB","explain":"gadget = đồ công nghệ nhỏ. Thiết bị dịch giọng nói sang 20 ngôn ngữ."},{"type":"mcq","q":"Working from home is ___ because you don't need to travel.","options":["A. crowded","B. modern","C. peaceful","D. convenient"],"answer":"D","level":"TH","explain":"convenient = tiện lợi. Làm việc tại nhà tiện vì không phải đi lại."},{"type":"mcq","q":"If it ___ tomorrow, we will stay at home.","options":["A. will rain","B. is raining","C. rains","D. rained"],"answer":"C","level":"VD","explain":"Câu điều kiện loại 1: mệnh đề If dùng hiện tại đơn (rains), không dùng will."},{"type":"mcq","q":"A: Let's go jogging this weekend! - B: ___","options":["A. \"No jogging.\"","B. \"I'm busy not.\"","C. \"Sounds great!\"","D. \"I don't like.\""],"answer":"C","level":"TH","explain":"Hưởng ứng lời rủ một cách hào hứng: Sounds great!"},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Good sleep is part of a healthy lifestyle. Teens need about eight hours of sleep each night. Using phones late at night makes it hard to fall asleep. A dark, quiet room helps you sleep better.","statements":["a) Good sleep is part of a healthy lifestyle.","b) Teens need about eight hours of sleep nightly.","c) Late-night phone use helps teens sleep.","d) A dark, quiet room improves sleep."],"answer":["T","T","F","T"],"level":"VD","explain":"a) Đúng: giấc ngủ ngon là một phần của lối sống khỏe. b) Đúng: khoảng 8 giờ mỗi đêm. c) Sai: dùng điện thoại khuya khiến khó ngủ. d) Đúng: phòng tối, yên tĩnh giúp ngủ ngon hơn."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Slow living is a new trend among young people. Instead of rushing, they enjoy simple things like cooking and reading. They spend less time on social media. Slow living helps them feel calm and happy in busy cities.","statements":["a) Slow living is popular with some young people.","b) Slow living means enjoying simple daily things.","c) Slow livers spend more time on social media.","d) Slow living helps people feel calm."],"answer":["T","T","F","T"],"level":"VDC","explain":"a) Đúng: xu hướng mới của giới trẻ. b) Đúng: tận hưởng những điều giản dị. c) Sai: họ bớt thời gian cho mạng xã hội. d) Đúng: giúp cảm thấy bình yên."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. City life is ___ (convenience) for shopping and entertainment.","answer":"convenient","level":"VDC","explain":"Sau động từ be cần một tính từ; convenience (danh từ) chuyển thành convenient (tính từ)."}]},{"name":"Đề 5","questions":[{"type":"mcq","q":"Find the word whose 's' is pronounced differently from the others.","options":["A. street","B. school","C. treasure","D. smile"],"answer":"C","level":"NB","explain":"Các từ street, school, smile có 's' phát âm là /s/, còn treasure có 's' phát âm là /ʒ/ (ˈtreʒə) nên khác."},{"type":"mcq","q":"Find the word whose 'g' is pronounced differently from the others.","options":["A. garage","B. village","C. page","D. jogging"],"answer":"A","level":"NB","explain":"Các từ jogging, village, page có 'g' phát âm là /dʒ/, còn garage có 'g' phát âm là /ʒ/ nên khác."},{"type":"mcq","q":"Which word has a different main stress from the others?","options":["A. gadget","B. future","C. technology","D. diet"],"answer":"C","level":"TH","explain":"Các từ gadget, diet, future nhấn âm tiết 1, còn technology nhấn âm tiết 2 (techˈnology) nên khác."},{"type":"mcq","q":"She does a 30-minute ___ at the gym every evening.","options":["A. diet","B. jogging","C. workout","D. habit"],"answer":"C","level":"NB","explain":"workout = buổi tập thể dục. Cô ấy tập gym 30 phút mỗi tối."},{"type":"mcq","q":"Many families move to the ___ to enjoy cleaner air.","options":["A. village","B. town","C. suburb","D. city"],"answer":"C","level":"TH","explain":"suburb = ngoại ô, nơi không khí trong lành hơn thành phố."},{"type":"mcq","q":"She ___ buy an electric car next year to protect the environment.","options":["A. is","B. has","C. does","D. will"],"answer":"D","level":"VD","explain":"Diễn tả quyết định/dự định tương lai: S + will + V."},{"type":"mcq","q":"A: Do you prefer city or country life? - B: ___","options":["A. \"I don't prefer.\"","B. \"Yes, I do prefer.\"","C. \"Country is no.\"","D. \"I prefer the countryside. It's peaceful.\""],"answer":"D","level":"TH","explain":"Trả lời câu hỏi so sánh bằng cách nêu lựa chọn và lý do: thích đồng quê vì yên bình."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Online learning is changing students' lifestyles. They can study English with teachers from other countries. They save time travelling to class. However, they need strong self-discipline to learn well at home.","statements":["a) Online learning changes students' lifestyles.","b) Students can learn with foreign teachers online.","c) Online learners save travel time.","d) Learning at home needs no discipline."],"answer":["T","T","T","F"],"level":"VD","explain":"a) Đúng: học trực tuyến thay đổi lối sống học sinh. b) Đúng: học với giáo viên nước ngoài. c) Đúng: tiết kiệm thời gian đi lại. d) Sai: cần tính tự giác cao (strong self-discipline)."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). City noise can harm people's health. Traffic, construction and loud music keep brains busy all day. Long-term noise may cause stress and poor sleep. Experts suggest quiet time every day for a healthier mind.","statements":["a) City noise can damage health.","b) Traffic and construction make cities noisy.","c) Noise may cause stress and bad sleep.","d) Experts advise avoiding quiet time."],"answer":["T","T","T","F"],"level":"VDC","explain":"a) Đúng: tiếng ồn đô thị hại sức khỏe. b) Đúng: giao thông, công trình gây ồn. c) Đúng: gây căng thẳng, mất ngủ. d) Sai: chuyên gia khuyên nên có thời gian yên tĩnh mỗi ngày."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. If it is sunny tomorrow, we ___ (go) jogging in the park.","answer":"will go","level":"VDC","explain":"Câu điều kiện loại 1: If + hiện tại đơn (is), S + will + V → will go."}]},{"name":"Đề 6","questions":[{"type":"mcq","q":"Choose the word where the letter 's' sounds different from the others.","options":["A. study","B. usually","C. son","D. sing"],"answer":"B","level":"NB","explain":"Các từ study, sing, son có 's' phát âm là /s/, còn usually có 's' phát âm là /ʒ/ (ˈjuːʒuəli) nên khác."},{"type":"mcq","q":"Choose the word where the letter 'g' sounds different from the others.","options":["A. orange","B. massage","C. large","D. age"],"answer":"B","level":"NB","explain":"Các từ age, large, orange có 'g' phát âm là /dʒ/, còn massage có 'g' phát âm là /ʒ/ nên khác."},{"type":"mcq","q":"Pick the word stressed on the second syllable.","options":["A. peaceful","B. device","C. habit","D. lifestyle"],"answer":"B","level":"TH","explain":"device nhấn âm tiết 2 (deˈvice); habit, lifestyle, peaceful đều nhấn âm tiết 1."},{"type":"mcq","q":"Too much ___ time is bad for children's eyes.","options":["A. workout","B. diet","C. screen","D. jogging"],"answer":"C","level":"NB","explain":"screen time = thời gian dùng màn hình. Dùng màn hình quá nhiều hại mắt trẻ em."},{"type":"mcq","q":"The new apartment is small but very ___.","options":["A. modern","B. noisy","C. comfortable","D. crowded"],"answer":"C","level":"TH","explain":"comfortable = thoải mái. Căn hộ nhỏ nhưng rất thoải mái."},{"type":"mcq","q":"If we plant more trees, our city ___ cleaner.","options":["A. will be","B. be","C. is","D. was"],"answer":"A","level":"VD","explain":"Câu điều kiện loại 1: If + hiện tại đơn (plant), S + will + V (will be)."},{"type":"mcq","q":"A: You look tired. - B: ___","options":["A. \"No tired.\"","B. \"I should sleep earlier.\"","C. \"I'm fine not.\"","D. \"Thanks you.\""],"answer":"B","level":"TH","explain":"Đáp lại lời quan tâm bằng cách nhận ra vấn đề của mình: nên ngủ sớm hơn."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Breakfast is the most important meal of the day. A good breakfast gives you energy for morning lessons. Students who skip breakfast often feel hungry and tired. A bowl of pho or a sandwich is a great choice.","statements":["a) Breakfast gives energy for the morning.","b) Skipping breakfast makes students tired.","c) Pho is a good breakfast choice.","d) Breakfast is not important for students."],"answer":["T","T","T","F"],"level":"VD","explain":"a) Đúng: bữa sáng cung cấp năng lượng. b) Đúng: bỏ bữa sáng dễ đói và mệt. c) Đúng: phở là lựa chọn tuyệt vời. d) Sai: bữa sáng là bữa quan trọng nhất."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Family lifestyles have changed a lot in 20 years. In the past, families ate dinner together every night. Now, parents work late and children study online. Many families try to keep Sunday as a day for everyone.","statements":["a) Family lifestyles changed little in 20 years.","b) Families used to have dinner together nightly.","c) Busy schedules keep families apart on weekdays.","d) Many families keep Sunday for togetherness."],"answer":["F","T","T","T"],"level":"VDC","explain":"a) Sai: lối sống gia đình đã thay đổi rất nhiều (a lot). b) Đúng: xưa kia cả nhà ăn tối cùng nhau mỗi tối. c) Đúng: cha mẹ làm muộn, con học online khiến gia đình ít sum họp ngày thường. d) Đúng: nhiều gia đình giữ Chủ nhật cho cả nhà."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. Living in the countryside is very ___ (peace).","answer":"peaceful","level":"VDC","explain":"Sau be và very cần một tính từ; peace (danh từ) chuyển thành peaceful (tính từ)."}]},{"name":"Đề 7","questions":[{"type":"mcq","q":"Pick the word with a different 's' pronunciation.","options":["A. city","B. centre","C. casual","D. cinema"],"answer":"C","level":"NB","explain":"Các từ city, centre, cinema có 'c' phát âm là /s/, còn casual có 's' phát âm là /ʒ/ (ˈkæʒuəl) nên khác."},{"type":"mcq","q":"Pick the word with a different 'g' pronunciation.","options":["A. garage","B. bridge","C. job","D. jump"],"answer":"A","level":"NB","explain":"Các từ jump, job, bridge có 'j'/'g' phát âm là /dʒ/, còn garage có 'g' phát âm là /ʒ/ nên khác."},{"type":"mcq","q":"Find the word whose stress pattern is different from the others.","options":["A. healthy","B. convenient","C. workout","D. balanced"],"answer":"B","level":"TH","explain":"Các từ workout, healthy, balanced nhấn âm tiết 1, còn convenient nhấn âm tiết 2 nên khác."},{"type":"mcq","q":"The ___ is full of tall skyscrapers and busy streets.","options":["A. village","B. countryside","C. suburb","D. city centre"],"answer":"D","level":"NB","explain":"city centre = trung tâm thành phố, nơi có nhà chọc trời và phố xá nhộn nhịp."},{"type":"mcq","q":"Modern ___ helps doctors treat patients better.","options":["A. gadget","B. device","C. technology","D. machine"],"answer":"C","level":"TH","explain":"technology = công nghệ. Công nghệ hiện đại giúp bác sĩ chữa bệnh tốt hơn."},{"type":"mcq","q":"They ___ travel by flying car in the future, I believe.","options":["A. don't","B. won't","C. will","D. aren't"],"answer":"C","level":"VD","explain":"Diễn tả niềm tin về tương lai: S + will + V."},{"type":"mcq","q":"A: What will life be like in 2050? - B: ___","options":["A. \"I don't know 2050.\"","B. \"Life is good.\"","C. \"No idea not.\"","D. \"I think technology will change everything.\""],"answer":"D","level":"TH","explain":"Trả lời câu hỏi về tương lai bằng một dự đoán hợp lý."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Sports are a big part of Nam's lifestyle. He plays football three times a week with his classmates. On weekends, he swims with his father. Playing sports helps him make friends and stay strong.","statements":["a) Nam plays football three times a week.","b) He swims with his father on weekends.","c) Sports help him make friends.","d) Nam never does exercise."],"answer":["T","T","T","F"],"level":"VD","explain":"a) Đúng: đá bóng 3 lần mỗi tuần. b) Đúng: bơi với bố vào cuối tuần. c) Đúng: thể thao giúp kết bạn. d) Sai: Nam tập thể thao thường xuyên."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Future transport may look very different. Electric buses are already common in some cities. Scientists are testing flying taxis for short trips. However, new transport must be safe and cheap before everyone can use it.","statements":["a) Electric buses are already used in some cities.","b) Flying taxis are being tested for short trips.","c) Future transport needs to be safe and affordable.","d) Everyone already travels by flying taxi."],"answer":["T","T","T","F"],"level":"VDC","explain":"a) Đúng: xe buýt điện đã phổ biến ở một số thành phố. b) Đúng: đang thử nghiệm taxi bay. c) Đúng: phải an toàn và rẻ trước khi mọi người dùng. d) Sai: taxi bay mới chỉ đang thử nghiệm."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. He ___ (not like) noisy cities, so he moved to the countryside.","answer":"doesn't like","level":"VDC","explain":"Thì hiện tại đơn, chủ ngữ số ít 'he': does + not + V → doesn't like."}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Which of these words has a different 's' sound?","options":["A. vision","B. sun","C. six","D. sit"],"answer":"A","level":"NB","explain":"Các từ sun, sit, six có 's' phát âm là /s/, còn vision có 's' phát âm là /ʒ/ (ˈvɪʒn) nên khác."},{"type":"mcq","q":"Which of these words has a different 'g' sound?","options":["A. change","B. message","C. village","D. garage"],"answer":"D","level":"NB","explain":"Các từ message, village, change có 'g' phát âm là /dʒ/, còn garage có 'g' phát âm là /ʒ/ nên khác."},{"type":"mcq","q":"Pick the word stressed on the first syllable.","options":["A. device","B. suburb","C. routine","D. technology"],"answer":"B","level":"TH","explain":"suburb nhấn âm tiết 1; routine, technology, device đều nhấn âm tiết 2."},{"type":"mcq","q":"___ is a good way to start the day full of energy.","options":["A. Gadget","B. Screen","C. Diet","D. Jogging"],"answer":"D","level":"NB","explain":"jogging = chạy bộ. Chạy bộ là cách tuyệt vời để bắt đầu ngày mới."},{"type":"mcq","q":"Living in a small flat in the city can be ___ at first.","options":["A. peaceful","B. modern","C. uncomfortable","D. convenient"],"answer":"C","level":"TH","explain":"uncomfortable = không thoải mái. Sống trong căn hộ nhỏ ban đầu có thể bất tiện."},{"type":"mcq","q":"If you ___ hard, you will pass the exam.","options":["A. studies","B. will study","C. study","D. studied"],"answer":"C","level":"VD","explain":"Câu điều kiện loại 1: mệnh đề If dùng hiện tại đơn, không dùng will; chủ ngữ 'you' đi với 'study'."},{"type":"mcq","q":"A: Would you like to live in a smart home? - B: ___","options":["A. \"Yes, it sounds convenient.\"","B. \"No, I wouldn'tn't.\"","C. \"Smart home no.\"","D. \"I like not.\""],"answer":"A","level":"TH","explain":"Đáp lại lời hỏi ý kiến một cách lịch sự và nêu lý do: nghe có vẻ tiện lợi."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Hoa has a busy but balanced lifestyle. She studies hard on weekdays and rests on Sundays. She never stays up late on school nights. Her secret is planning her time carefully every evening.","statements":["a) Hoa studies hard on weekdays.","b) She rests on Sundays.","c) She often stays up late on school nights.","d) Planning time helps her stay balanced."],"answer":["T","T","F","T"],"level":"VD","explain":"a) Đúng: học chăm các ngày trong tuần. b) Đúng: nghỉ ngơi vào Chủ nhật. c) Sai: không bao giờ thức khuya đêm trước ngày học. d) Đúng: lên kế hoạch thời gian giúp cân bằng."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Urban life offers many chances to learn and work. Big cities have good schools, hospitals and cinemas. However, living costs are high and air is polluted. Many young people still choose cities for a brighter future.","statements":["a) Cities offer good schools and hospitals.","b) Living costs in cities are low.","c) City air is often polluted.","d) Young people choose cities for better chances."],"answer":["T","F","T","T"],"level":"VDC","explain":"a) Đúng: trường học, bệnh viện, rạp chiếu phim tốt. b) Sai: chi phí sinh hoạt cao (high). c) Đúng: không khí ô nhiễm. d) Đúng: giới trẻ chọn thành phố vì tương lai tươi sáng hơn."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. Technology makes our lives more ___ (comfort).","answer":"comfortable","level":"VDC","explain":"Sau 'more' cần một tính từ; comfort (danh từ) chuyển thành comfortable (tính từ)."}]},{"name":"Đề 9","questions":[{"type":"mcq","q":"Identify the word whose 's' pronunciation is different.","options":["A. small","B. measure","C. smart","D. slow"],"answer":"B","level":"NB","explain":"Các từ small, smart, slow có 's' phát âm là /s/, còn measure có 's' phát âm là /ʒ/ (ˈmeʒə) nên khác."},{"type":"mcq","q":"Identify the word whose 'g' pronunciation is different.","options":["A. orange","B. large","C. massage","D. dangerous"],"answer":"C","level":"NB","explain":"Các từ dangerous, orange, large có 'g' phát âm là /dʒ/, còn massage có 'g' phát âm là /ʒ/ nên khác."},{"type":"mcq","q":"Choose the word stressed differently from the others.","options":["A. modern","B. jogging","C. future","D. device"],"answer":"D","level":"TH","explain":"Các từ jogging, future, modern nhấn âm tiết 1, còn device nhấn âm tiết 2 (deˈvice) nên khác."},{"type":"mcq","q":"My dad bought a new ___ to check his heart rate when running.","options":["A. habit","B. suburb","C. gadget","D. diet"],"answer":"C","level":"NB","explain":"gadget = đồ công nghệ nhỏ. Thiết bị đeo đo nhịp tim khi chạy bộ."},{"type":"mcq","q":"The air in the countryside is fresh and ___.","options":["A. clean","B. modern","C. noisy","D. crowded"],"answer":"A","level":"TH","explain":"clean = trong lành. Không khí đồng quê trong lành."},{"type":"mcq","q":"Life ___ more peaceful in the countryside in the future, I hope.","options":["A. is","B. was","C. be","D. will be"],"answer":"D","level":"VD","explain":"Diễn tả hy vọng về tương lai: S + will + V."},{"type":"mcq","q":"A: I want to lose weight. - B: ___","options":["A. \"Eat more fast food.\"","B. \"You should eat less fast food.\"","C. \"Weight is fine.\"","D. \"Don't eat anything.\""],"answer":"B","level":"TH","explain":"Đưa lời khuyên hợp lý và tốt cho sức khỏe: ăn ít đồ ăn nhanh hơn."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Rural life is quiet and close to nature. Farmers wake up early and work in green fields. Children play freely in large yards. Many people in cities dream of this peaceful lifestyle.","statements":["a) Rural life is close to nature.","b) Farmers wake up early to work.","c) Children have little space to play.","d) City people admire the peaceful countryside life."],"answer":["T","T","F","T"],"level":"VD","explain":"a) Đúng: cuộc sống nông thôn gần gũi thiên nhiên. b) Đúng: nông dân dậy sớm làm đồng. c) Sai: trẻ em chơi tự do trong sân rộng (large yards). d) Đúng: người thành phố mơ về lối sống yên bình."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). A positive lifestyle needs both body and mind care. Exercise keeps the body strong, while reading and music feed the mind. Spending time with family brings happiness. Small good habits today build a bright future.","statements":["a) A good lifestyle cares for body and mind.","b) Reading and music are good for the mind.","c) Family time brings happiness.","d) Small habits cannot change the future."],"answer":["T","T","T","F"],"level":"VDC","explain":"a) Đúng: lối sống tích cực chăm sóc cả thể chất và tinh thần. b) Đúng: đọc sách, nghe nhạc nuôi dưỡng tâm trí. c) Đúng: thời gian bên gia đình mang lại hạnh phúc. d) Sai: thói quen tốt hôm nay xây dựng tương lai tươi sáng."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. If we don't act now, pollution ___ (get) worse.","answer":"will get","level":"VDC","explain":"Câu điều kiện loại 1: If + hiện tại đơn (don't act), S + will + V → will get."}]},{"name":"Đề 10","questions":[{"type":"mcq","q":"Select the word in which 's' is pronounced differently.","options":["A. price","B. nice","C. decision","D. rice"],"answer":"C","level":"NB","explain":"Các từ nice, rice, price có 's' phát âm là /s/, còn decision có 's' phát âm là /ʒ/ (dɪˈsɪʒn) nên khác."},{"type":"mcq","q":"Select the word in which 'g' is pronounced differently.","options":["A. large","B. garage","C. page","D. age"],"answer":"B","level":"NB","explain":"Các từ page, age, large có 'g' phát âm là /dʒ/, còn garage có 'g' phát âm là /ʒ/ nên khác."},{"type":"mcq","q":"Which word has its main stress on the first syllable?","options":["A. lifestyle","B. technology","C. device","D. routine"],"answer":"A","level":"TH","explain":"lifestyle nhấn âm tiết 1; technology, device, routine đều nhấn âm tiết 2."},{"type":"mcq","q":"Eating too many sweets is a bad ___ for your teeth.","options":["A. routine","B. lifestyle","C. habit","D. custom"],"answer":"C","level":"NB","explain":"habit = thói quen. Ăn nhiều đồ ngọt là thói quen xấu cho răng."},{"type":"mcq","q":"The new shopping mall is very ___; it has everything we need.","options":["A. modern","B. quiet","C. crowded","D. peaceful"],"answer":"A","level":"TH","explain":"modern = hiện đại. Trung tâm thương mại mới rất hiện đại."},{"type":"mcq","q":"If people use less plastic, the environment ___ better.","options":["A. were","B. will be","C. is","D. was"],"answer":"B","level":"VD","explain":"Câu điều kiện loại 1: If + hiện tại đơn (use), S + will + V (will be)."},{"type":"mcq","q":"A: Is your neighbourhood crowded? - B: ___","options":["A. \"Yes, but I love its lively atmosphere.\"","B. \"No crowded.\"","C. \"I don't live.\"","D. \"Crowd yes.\""],"answer":"A","level":"TH","explain":"Trả lời đầy đủ, thừa nhận một phần và nêu điểm tích cực: đông nhưng thích không khí sôi động."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Weekends are precious for busy families. On Saturdays, the Minh family cleans the house together. On Sundays, they visit grandparents or go on picnics. These small moments keep everyone happy and close.","statements":["a) Weekends are precious for busy families.","b) The Minh family cleans the house on Saturdays.","c) They never visit their grandparents.","d) Small moments keep the family close."],"answer":["T","T","F","T"],"level":"VD","explain":"a) Đúng: cuối tuần quý giá với gia đình bận rộn. b) Đúng: thứ Bảy cả nhà dọn nhà. c) Sai: Chủ nhật họ thăm ông bà hoặc đi dã ngoại. d) Đúng: những khoảnh khắc nhỏ gắn kết gia đình."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). By 2050, homes may produce their own clean energy. Solar roofs will make electricity during the day. Smart systems will save energy at night. Living in such homes will be both comfortable and eco-friendly.","statements":["a) Future homes may make their own energy.","b) Solar roofs make electricity in daytime.","c) Smart systems help save energy.","d) Future homes will harm the environment."],"answer":["T","T","T","F"],"level":"VDC","explain":"a) Đúng: nhà tương lai tự sản xuất năng lượng sạch. b) Đúng: mái năng lượng mặt trời tạo điện ban ngày. c) Đúng: hệ thống thông minh tiết kiệm năng lượng. d) Sai: sống trong nhà như vậy vừa thoải mái vừa thân thiện môi trường."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. A ___ (balance) diet keeps you healthy and full of energy.","answer":"balanced","level":"VDC","explain":"Trước danh từ 'diet' cần một tính từ; balance (danh từ/động từ) chuyển thành balanced (tính từ)."}]}]}
