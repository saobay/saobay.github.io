has 54 ethnic groups. The Kinh is the largest group. The other 53 groups are ethnic minorities. They mostly live in mountainous areas.", "statements": ["a) Viet Nam has 54 ethnic groups.", "b) The Kinh is the largest group.", "c) All groups are the same size.", "d) Ethnic minorities mostly live in mountainous areas."], "answer": ["T", "T", "F", "T"], "explain": "c) sai vì người Kinh là nhóm đông nhất, các nhóm khác nhỏ hơn."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nEach ethnic group in Viet Nam has its own customs. The Kinh celebrate Tet, while the Hmong celebrate their New Year in December. Although the dates are different, both festivals wish for a happy and rich new year. These traditions make Viet Nam's culture diverse and colourful.", "statements": ["a) All ethnic groups celebrate New Year on the same date.", "b) The Hmong New Year is in December.", "c) Different festivals share similar wishes for the new year.", "d) Viet Nam's culture is diverse because of these traditions."], "answer": ["F", "T", "T", "T"], "explain": "a) sai vì mỗi dân tộc ăn Tết vào thời điểm khác nhau."}, {"type": "short", "level": "VD", "q": "Viet Nam has 54 ethnic ______ (group).", "answer": "groups", "explain": "Sau số lượng 54 cần danh từ số nhiều: group thành groups."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'g' is pronounced differently from the others.", "options": ["A. game", "B. gong", "C. cat", "D. garden"], "answer": "C", "explain": "gong, game, garden có 'g' phát âm /g/; cat có 'c' phát âm /k/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'g' is pronounced differently from the others.", "options": ["A. single", "B. sign", "C. assign", "D. design"], "answer": "A", "explain": "sign, design, assign có 'g' câm (không phát âm); single có 'g' phát âm /g/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. poultry", "B. mountain", "C. harvest", "D. diverse"], "answer": "D", "explain": "diverse nhấn âm tiết thứ 2; các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "Many ethnic people live in ___ houses.", "options": ["A. stone", "B. brick", "C. stilt", "D. glass"], "answer": "C", "explain": "stilt house (nhà sàn) là kiểu nhà truyền thống của nhiều dân tộc."}, {"type": "mcq", "level": "TH", "q": "The village ___ is where all important meetings take place.", "options": ["A. field", "B. stilt house", "C. market", "D. communal house"], "answer": "D", "explain": "communal house (nhà cộng đồng) là nơi họp bàn việc quan trọng của làng."}, {"type": "mcq", "level": "VD", "q": "She bought ___ Hmong costume at the market.", "options": ["A. the", "B. an", "C. a", "D. no article"], "answer": "C", "explain": "Nhắc lần đầu, chưa xác định, Hmong đọc bắt đầu bằng phụ âm nên dùng a."}, {"type": "mcq", "level": "VDC", "q": "A: \"How many ethnic groups are there in Viet Nam?\" - B: \"___\"", "options": ["A. In the north.", "B. Yes, there are.", "C. There are 54.", "D. A lot of people."], "answer": "C", "explain": "Hỏi số lượng dân tộc thì trả lời: có 54 dân tộc."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nThe Hmong live mainly in the northern mountains. The women wear colourful costumes. They are good at embroidery. The Hmong New Year festival is in late December.", "statements": ["a) The Hmong live in the southern plains.", "b) Hmong women wear colourful costumes.", "c) They are good at embroidery.", "d) Their New Year festival is in late December."], "answer": ["F", "T", "T", "T"], "explain": "a) sai vì người Hmong sống ở vùng núi phía Bắc."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nIn the past, ethnic children had to walk far to get to school. Today, the government builds more schools in mountainous areas. Many children now study near their homes. However, some villages are still very far from the nearest school.", "statements": ["a) In the past, ethnic children walked far to school.", "b) There are no schools in mountainous areas today.", "c) All villages are now close to a school.", "d) The government is building more schools in mountainous areas."], "answer": ["T", "F", "F", "T"], "explain": "b) sai vì ngày nay có nhiều trường hơn; c) sai vì một số làng vẫn còn xa trường."}, {"type": "short", "level": "VD", "q": "The Hmong wear colourful ______ (costume) on Tet.", "answer": "costumes", "explain": "costume là danh từ đếm được, ở đây cần dạng số nhiều: costumes."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter is pronounced differently from the others.", "options": ["A. goat", "B. cut", "C. communal", "D. costume"], "answer": "A", "explain": "costume, communal, cut phát âm /k/; goat phát âm /g/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. character", "B. school", "C. kitchen", "D. chemistry"], "answer": "C", "explain": "school, character, chemistry có 'ch' phát âm /k/; kitchen có 'ch' phát âm /tʃ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. terraced", "B. gong", "C. heritage", "D. communal"], "answer": "D", "explain": "communal nhấn âm tiết thứ 2; các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "___ fields on the mountains look beautiful in harvest season.", "options": ["A. Dry", "B. Small", "C. Flat", "D. Terraced"], "answer": "D", "explain": "terraced fields (ruộng bậc thang) trên núi rất đẹp vào mùa gặt."}, {"type": "mcq", "level": "TH", "q": "Their culture is very ___, with many colours and patterns.", "options": ["A. diverse", "B. boring", "C. simple", "D. modern"], "answer": "A", "explain": "diverse (đa dạng) với nhiều màu sắc và hoa văn."}, {"type": "mcq", "level": "VD", "q": "___ hour ago, we arrived at the village.", "options": ["A. No article", "B. A", "C. An", "D. The"], "answer": "C", "explain": "hour đọc bắt đầu bằng nguyên âm /aʊə/ nên dùng an."}, {"type": "mcq", "level": "VDC", "q": "A: \"Would you like to try some local food?\" - B: \"___\"", "options": ["A. Food is good.", "B. Maybe never.", "C. No, I would not.", "D. Yes, I would love to."], "answer": "D", "explain": "Nhận lời mời một cách lịch sự: vâng, tôi rất muốn thử."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nMany ethnic groups live in stilt houses. The houses are built on tall wooden posts. Animals live under the house. People live on the upper floor.", "statements": ["a) Stilt houses are built on tall wooden posts.", "b) Animals live on the upper floor.", "c) People live on the upper floor.", "d) Stilt houses have no posts."], "answer": ["T", "F", "T", "F"], "explain": "b) sai vì vật nuôi ở dưới gầm sàn; d) sai vì nhà sàn dựng trên cột gỗ cao."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nTourism brings money to ethnic villages, but it also changes their life. Some young people leave traditional jobs to work as tour guides. Old customs may disappear if nobody practises them. Villages need to develop tourism without losing their culture.", "statements": ["a) Tourism only brings good things to villages.", "b) Some young people become tour guides.", "c) Old customs can disappear without practice.", "d) Villages should keep their culture while developing tourism."], "answer": ["F", "T", "T", "T"], "explain": "a) sai vì du lịch cũng làm thay đổi cuộc sống của làng."}, {"type": "short", "level": "VD", "q": "How ______ (many) people live in your village?", "answer": "many", "explain": "Hỏi số lượng người (đếm được) dùng How many."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'g' is pronounced differently from the others.", "options": ["A. give", "B. go", "C. kitchen", "D. get"], "answer": "C", "explain": "give, get, go có 'g' phát âm /g/; kitchen có 'k' phát âm /k/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'g' is pronounced differently from the others.", "options": ["A. gong", "B. singer", "C. longer", "D. garden"], "answer": "B", "explain": "gong, longer, garden có âm /g/; singer có 'ng' phát âm /ŋ/ (không có /g/) nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. diverse", "B. culture", "C. livestock", "D. market"], "answer": "A", "explain": "diverse nhấn âm tiết thứ 2; các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "A ___ is a traditional way of doing something in a community.", "options": ["A. custom", "B. market", "C. harvest", "D. costume"], "answer": "A", "explain": "custom (phong tục) là cách làm truyền thống của cộng đồng."}, {"type": "mcq", "level": "TH", "q": "The Hmong New Year ___ takes place in late December.", "options": ["A. festival", "B. custom", "C. market", "D. harvest"], "answer": "A", "explain": "festival (lễ hội) Tết của người Hmong diễn ra cuối tháng 12."}, {"type": "mcq", "level": "VD", "q": "___ Thai have their own traditional houses.", "options": ["A. An", "B. The", "C. No article", "D. A"], "answer": "B", "explain": "Trước tên dân tộc ở dạng số nhiều dùng the: The Thai."}, {"type": "mcq", "level": "VDC", "q": "A: \"Can you tell me about the Hmong New Year festival?\" - B: \"___\"", "options": ["A. No, I cannot speak.", "B. Sure. It is the most important celebration of the year.", "C. I do not celebrate it.", "D. Festivals are boring."], "answer": "B", "explain": "Giới thiệu lễ hội: đó là lễ kỷ niệm quan trọng nhất trong năm."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nTerraced fields are fields on mountain slopes. Farmers grow rice on them. In harvest season, the fields turn golden. Many tourists visit to take photos.", "statements": ["a) Terraced fields are on mountain slopes.", "b) Farmers grow rice on terraced fields.", "c) The fields turn golden in harvest season.", "d) No tourists visit terraced fields."], "answer": ["T", "T", "T", "F"], "explain": "d) sai vì nhiều du khách đến chụp ảnh ruộng bậc thang."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nThe Vietnamese language connects all 54 ethnic groups. Each group also keeps its own language. Children learn Vietnamese at school and speak their mother tongue at home. This helps them talk to everyone while keeping their identity.", "statements": ["a) All ethnic groups speak only Vietnamese.", "b) Each group keeps its own language.", "c) Children speak their mother tongue at home.", "d) Learning Vietnamese helps groups understand each other."], "answer": ["F", "T", "T", "T"], "explain": "a) sai vì mỗi dân tộc còn giữ ngôn ngữ riêng của mình."}, {"type": "short", "level": "VD", "q": "The terraced ______ (field) look golden in autumn.", "answer": "fields", "explain": "Chủ ngữ số nhiều (look) nên field thành fields."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'k' is pronounced differently from the others.", "options": ["A. kitchen", "B. key", "C. group", "D. kind"], "answer": "C", "explain": "kind, kitchen, key có 'k' phát âm /k/; group có 'g' phát âm /g/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'g' is pronounced differently from the others.", "options": ["A. guest", "B. guess", "C. gentle", "D. ghost"], "answer": " el": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nWeaving brocade takes a lot of time and skill. A beautiful skirt can take several months to finish. Young girls learn from their mothers and grandmothers. If the young do not learn, this beautiful art may be lost.", "statements": ["a) Weaving brocade is quick and easy.", "b) A skirt can take several months to finish.", "c) Girls learn weaving from older women in the family.", "d) The art of weaving could disappear one day."], "answer": ["F", "T", "T", "T"], "explain": "a) sai vì dệt thổ cẩm tốn nhiều thời gian và kỹ năng."}, {"type": "short", "level": "VD", "q": "She is ______ honest girl. (a)", "answer": "an", "explain": "honest đọc bắt đầu bằng nguyên âm nên dùng an thay vì a."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'g' is pronounced differently from the others.", "options": ["A. gong", "B. cold", "C. gold", "D. good"], "answer": "B", "explain": "gong, gold, good có 'g' phát âm /g/; cold có 'c' phát âm /k/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. mechanic", "B. chemistry", "C. church", "D. school"], "answer": "C", "explain": "mechanic, school, chemistry có 'ch' phát âm /k/; church có 'ch' phát âm /tʃ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. heritage", "B. communal", "C. ethnic", "D. custom"], "answer": "B", "explain": "communal nhấn âm tiết thứ 2; các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "The ___ is the time when farmers collect their crops.", "options": ["A. festival", "B. harvest", "C. market", "D. costume"], "answer": "B", "explain": "harvest (mùa thu hoạch) là thời điểm nông dân thu hoạch nông sản."}, {"type": "mcq", "level": "TH", "q": "Life in ___ areas is often difficult in winter.", "options": ["A. urban", "B. coastal", "C. central", "D. mountainous"], "answer": "D", "explain": "mountainous areas (vùng miền núi) cuộc sống khó khăn vào mùa đông."}, {"type": "mcq", "level": "VD", "q": "How ___ is it from Ha Noi to Sa Pa?", "options": ["A. much", "B. far", "C. many", "D. long"], "answer": "B", "explain": "Hỏi khoảng cách dùng How far."}, {"type": "mcq", "level": "VDC", "q": "Tourist: \"Do the Thai women weave their own cloth?\" - Local: \"___\"", "options": ["A. Maybe.", "B. Cloth is expensive.", "C. No, they do not weave.", "D. Yes, the women are skilled weavers."], "answer": "D", "explain": "Khẳng định: vâng, phụ nữ ở đây dệt vải rất khéo."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nGongs are traditional musical instruments. People play gongs at festivals. The Gong culture of the Central Highlands is world heritage. UNESCO recognised it in 2005.", "statements": ["a) Gongs are played at festivals.", "b) The Gong culture is world heritage.", "c) UNESCO recognised it in 2005.", "d) Gongs are modern instruments."], "answer": ["T", "T", "T", "F"], "explain": "d) sai vì cồng chiêng là nhạc cụ truyền thống."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nHarvest season is the happiest time in ethnic villages. Families work together in the fields from morning to evening. After the harvest, they hold a festival to thank the gods. Everyone eats, dances and sings together.", "statements": ["a) Harvest season is a sad time for villagers.", "b) Families work together in the fields.", "c) They hold a festival after the harvest.", "d) The festival is a time for the whole village to celebrate."], "answer": ["F", "T", "T", "T"], "explain": "a) sai vì mùa gặt là thời điểm vui nhất trong làng."}, {"type": "short", "level": "VD", "q": "The women ______ (weave) beautiful brocade every day.", "answer": "weave", "explain": "every day là hiện tại đơn, chủ ngữ số nhiều nên dùng weave."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter is pronounced differently from the others.", "options": ["A. guitar", "B. costume", "C. culture", "D. custom"], "answer": "A", "explain": "costume, custom, culture phát âm /k/; guitar phát âm /g/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'g' is pronounced differently from the others.", "options": ["A. finger", "B. hungry", "C. longer", "D. singer"], "answer": "D", "explain": "finger, longer, hungry có âm /g/; singer có 'ng' phát âm /ŋ/ (không có /g/) nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. maintain", "B. market", "C. poultry", "D. gather"], "answer": "A", "explain": "maintain nhấn âm tiết thứ 2; các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "The Gong culture is recognised as world ___ by UNESCO.", "options": ["A. heritage", "B. costume", "C. custom", "D. harvest"], "answer": "A", "explain": "world heritage (di sản thế giới) được UNESCO công nhận."}, {"type": "mcq", "level": "TH", "q": "The sound of ___ welcomes visitors to the festival.", "options": ["A. bells", "B. guitars", "C. flutes", "D. gongs"], "answer": "D", "explain": "Tiếng cồng (gongs) chào đón du khách đến lễ hội."}, {"type": "mcq", "level": "VD", "q": "He plays ___ gong at the festival.", "options": ["A. the", "B. a", "C. an", "D. no article"], "answer": "A", "explain": "Chơi một loại nhạc cụ xác định trong ngữ cảnh dùng the."}, {"type": "mcq", "level": "VDC", "q": "A: \"Shall we visit the terraced fields tomorrow?\" - B: \"___\"", "options": ["A. No way at all.", "B. That sounds great!", "C. I hate travelling.", "D. Fields are boring."], "answer": "B", "explain": "Hưởng ứng lời rủ: nghe tuyệt đấy!"}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nThe Thai are famous for their Xoe dance. Young girls learn the dance from old people. They dance in a circle around a fire. The dance shows their love for life.", "statements": ["a) The Thai are famous for their Xoe dance.", "b) They dance alone at home.", "c) The dance shows their love for life.", "d) Young girls never learn the dance."], "answer": ["T", "F", "T", "F"], "explain": "b) sai vì họ múa vòng tròn quanh đống lửa; d) sai vì các bé gái được học múa."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nStilt houses suit life in the mountains very well. The space under the house keeps animals safe from wild beasts. In summer, the upper floor stays cool. Building a stilt house needs no nails, only wood and bamboo.", "statements": ["a) Stilt houses are not suitable for mountain life.", "b) Animals stay under the house.", "c) The upper floor stays cool in summer.", "d) People build stilt houses with wood and bamboo."], "answer": ["F", "T", "T", "T"], "explain": "a) sai vì nhà sàn rất phù hợp với cuộc sống miền núi."}, {"type": "short", "level": "VD", "q": "The Gong festival ______ (hold) every two years.", "answer": "is held", "explain": "Lễ hội được tổ chức nên dùng bị động hiện tại đơn: is held."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'k' is pronounced differently from the others.", "options": ["A. keep", "B. great", "C. kit", "D. kind"], "answer": "B", "explain": "keep, kind, kit có 'k' phát âm /k/; great có 'g' phát âm /g/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. chorus", "B. chemist", "C. school", "D. chain"], "answer": "D", "explain": "school, chorus, chemist có 'ch' phát âm /k/; chain có 'ch' phát âm /tʃ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. terraced", "B. diverse", "C. remote", "D. unique"], "answer": "A", "explain": "terraced nhấn âm tiết thứ 1; các từ còn lại nhấn âm tiết thứ 2."}, {"type": "mcq", "level": "NB", "q": "She learned to ___ cloth on a wooden loom.", "options": ["A. dance", "B. harvest", "C. weave", "D. cook"], "answer": "C", "explain": "weave (dệt) vải trên khung cửi gỗ."}, {"type": "mcq", "level": "TH", "q": "Tourists love buying ___ souvenirs from the village market.", "options": ["A. handmade", "B. expensive", "C. modern", "D. simple"], "answer": "A", "explain": "handmade souvenirs (quà lưu niệm thủ công) ở chợ làng."}, {"type": "mcq", "level": "VD", "q": "___ most beautiful terraced fields are in Mu Cang Chai.", "options": ["A. An", "B. No article", "C. The", "D. A"], "answer": "C", "explain": "Trước so sánh nhất (most beautiful) dùng the."}, {"type": "mcq", "level": "VDC", "q": "A: \"Excuse me, where is the Gong festival held?\" - B: \"___\"", "options": ["A. In the Central Highlands.", "B. Last year.", "C. I do not like gongs.", "D. Very loudly."], "answer": "A", "explain": "Hỏi địa điểm thì trả lời địa điểm: ở Tây Nguyên."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nBrocade is a colourful cloth. Thai and Hmong women weave brocade by hand. They make skirts and scarves from it. Tourists like to buy brocade souvenirs.", "statements": ["a) Brocade is a colourful cloth.", "b) Women weave brocade by hand.", "c) They make skirts and scarves from brocade.", "d) Tourists do not like brocade."], "answer": ["T", "T", "T", "F"], "explain": "d) sai vì du khách thích mua quà lưu niệm thổ cẩm."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nMany ethnic festivals happen in spring. People pray for good weather and a rich harvest. They wear their most beautiful costumes. Festivals are also a chance for young people to meet and make friends.", "statements": ["a) Ethnic festivals never happen in spring.", "b) People pray for good weather at festivals.", "c) They wear beautiful costumes to festivals.", "d) Festivals help young people make friends."], "answer": ["F", "T", "T", "T"], "explain": "a) sai vì nhiều lễ hội dân tộc diễn ra vào mùa xuân."}, {"type": "short", "level": "VD", "q": "Young people should ______ (preservation) their traditional culture.", "answer": "preserve", "explain": "Sau should là động từ nguyên thể: preservation thành preserve (gìn giữ)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'g' is pronounced differently from the others.", "options": ["A. gift", "B. girl", "C. give", "D. kitchen"], "answer": "D", "explain": "girl, give, gift có 'g' phát âm /g/; kitchen có 'k' phát âm /k/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'g' is pronounced differently from the others.", "options": ["A. gnome", "B. gnat", "C. gnaw", "D. signal"], "answer": "D", "explain": "gnat, gnaw, gnome có 'g' câm (không phát âm); signal có 'g' phát âm /g/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. ethnic", "B. weave", "C. embroider", "D. custom"], "answer": "C", "explain": "embroider nhấn âm tiết thứ 2; các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "Buffaloes and cows are the main ___ of the village.", "options": ["A. livestock", "B. fields", "C. customs", "D. costumes"], "answer": "A", "explain": "livestock (gia súc) gồm trâu, bò của làng."}, {"type": "mcq", "level": "TH", "q": "The Ede's long house is a type of ___ house.", "options": ["A. communal", "B. stilt", "C. modern", "D. brick"], "answer": "B", "explain": "Nhà dài của người Ê Đê là một kiểu nhà sàn (stilt house)."}, {"type": "mcq", "level": "VD", "q": "How ___ does it take to get to the village?", "options": ["A. much", "B. many", "C. far", "D. long"], "answer": "D", "explain": "Hỏi về thời gian mất bao lâu dùng How long."}, {"type": "mcq", "level": "VDC", "q": "A: \"I love your colourful costume!\" - B: \"___\"", "options": ["A. Thank you! My mother made it.", "B. It is old.", "C. Do not look at me.", "D. It is not colourful."], "answer": "A", "explain": "Đáp lại lời khen lịch sự: cảm ơn, mẹ tôi đã làm nó."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nThe communal house is the centre of village life. People meet there to discuss important things. Festivals also take place there. Every village has its own communal house.", "statements": ["a) The communal house is the centre of village life.", "b) People never meet at the communal house.", "c) Festivals take place at the communal house.", "d) Some villages have no communal house."], "answer": ["T", "F", "T", "F"], "explain": "b) sai vì người dân họp ở đó; d) sai vì mỗi làng đều có nhà cộng đồng."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nThe Central Highlands is home to many ethnic groups like the Ede and the Bahnar. The region is famous for coffee and gong culture. Tourists come to see the long houses and listen to gong music. The highlands are cooler than the lowlands.", "statements": ["a) The Ede and the Bahnar live in the Central Highlands.", "b) The region is famous for coffee and gongs.", "c) No tourists visit the Central Highlands.", "d) The highlands are cooler than the lowlands."], "answer": ["T", "T", "F", "T"], "explain": "c) sai vì du khách đến xem nhà dài và nghe nhạc cồng chiêng."}, {"type": "short", "level": "VD", "q": "The gong is ______ (make) of bronze.", "answer": "made", "explain": "Cồng được làm bằng đồng nên dùng bị động: is made of."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter is pronounced differently from the others.", "options": ["A. gold", "B. garden", "C. goat", "D. kind"], "answer": "D", "explain": "goat, gold, garden phát âm /g/; kind phát âm /k/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'g' is pronounced differently from the others.", "options": ["A. giant", "B. give", "C. get", "D. go"], "answer": "A", "explain": "get, give, go có 'g' phát âm /g/; giant có 'g' phát âm /dʒ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. begin", "B. bamboo", "C. stilt", "D. communal"], "answer": "C", "explain": "stilt nhấn âm tiết thứ 1; các từ còn lại nhấn âm tiết thứ 2."}, {"type": "mcq", "level": "NB", "q": "Chickens and ducks are called ___.", "options": ["A. pets", "B. customs", "C. poultry", "D. livestock"], "answer": "C", "explain": "poultry (gia cầm) gồm gà, vịt."}, {"type": "mcq", "level": "TH", "q": "___ is the art of making cloth with beautiful patterns.", "options": ["A. Weaving", "B. Cooking", "C. Harvesting", "D. Fishing"], "answer": "A", "explain": "Weaving (nghề dệt) là nghệ thuật làm vải với hoa văn đẹp."}, {"type": "mcq", "level": "VD", "q": "My friend is ___ honest boy.", "options": ["A. a", "B. an", "C. the", "D. no article"], "answer": "B", "explain": "honest đọc bắt đầu bằng nguyên âm nên dùng an."}, {"type": "mcq", "level": "VDC", "q": "A: \"How do the villagers celebrate the harvest?\" - B: \"___\"", "options": ["A. They go to school.", "B. They do not celebrate.", "C. They hold a big festival with music and dancing.", "D. They sleep early."], "answer": "C", "explain": "Mừng mùa gặt bằng lễ hội lớn với âm nhạc và múa hát."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nThe Dao people live in the northern mountains. They are famous for their red costumes. The women wear coins on their clothes. They believe coins bring good luck.", "statements": ["a) The Dao live in the northern mountains.", "b) They are famous for red costumes.", "c) The women wear coins on their clothes.", "d) They believe coins bring bad luck."], "answer": ["T", "T", "T", "F"], "explain": "d) sai vì họ tin đồng xu mang lại may mắn."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nProtecting ethnic culture is everyone's job. Schools teach students about different customs. Museums keep old costumes and tools. When we respect all cultures, our country becomes stronger and more beautiful.", "statements": ["a) Only the government protects ethnic culture.", "b) Schools teach students about different customs.", "c) Museums keep old costumes and tools.", "d) Respecting all cultures makes the country stronger."], "answer": ["F", "T", "T", "T"], "explain": "a) sai vì bảo vệ văn hóa dân tộc là việc của mọi người."}, {"type": "short", "level": "VD", "q": "Mu Cang Chai has the ______ (beautiful) terraced fields in Viet Nam.", "answer": "most beautiful", "explain": "Trước the và sau là so sánh nhất: beautiful thành most beautiful."}]}]}
