a tùy bút Ca Huế trên sông Hương là ai?", "options": ["A. Nguyễn Khuyến", "B. Hà Ánh Minh", "C. Trần Nhân Tông", "D. Ngô gia văn phái"], "answer": "B", "explain": "Ca Huế trên sông Hương là tùy bút của nhà văn Hà Ánh Minh."}, {"type": "mcq", "level": "NB", "q": "Tác phẩm Ca Huế trên sông Hương ghi lại trải nghiệm nào của tác giả?", "options": ["A. Leo núi ngắm cảnh", "B. Đi chợ phiên vùng cao", "C. Nghe ca Huế trên sông Hương vào một đêm trăng đẹp", "D. Tham quan di tích"], "answer": "C", "explain": "Tác phẩm ghi lại đêm nghe ca Huế trên sông Hương trong ánh trăng."}, {"type": "mcq", "level": "TH", "q": "Không gian nghệ thuật trong Ca Huế trên sông Hương là gì?", "options": ["A. Núi rừng hùng vĩ", "B. Thành phố ồn ào", "C. Biển khơi mênh mông", "D. Sông Hương về đêm lung linh dưới ánh trăng"], "answer": "D", "explain": "Tác phẩm vẽ nên không gian sông Hương về đêm lung linh, thơ mộng."}, {"type": "mcq", "level": "TH", "q": "Nghệ thuật đặc sắc của tùy bút Ca Huế trên sông Hương là gì?", "options": ["A. Miêu tả tinh tế, giàu nhạc điệu; kết hợp tả cảnh và biểu cảm nhuần nhuyễn", "B. Kể chuyện li kì, gay cấn", "C. Chỉ liệt kê số liệu", "D. Viết bằng thơ"], "answer": "A", "explain": "Tác phẩm miêu tả tinh tế, giàu nhạc điệu, kết hợp tả cảnh và biểu cảm."}, {"type": "mcq", "level": "VD", "q": "Ý nghĩa sâu xa của tùy bút Ca Huế trên sông Hương là gì?", "options": ["A. Kêu gọi mọi người đi du lịch Huế", "B. Tôn vinh ca Huế – di sản văn hóa phi vật thể và nhắc nhở ý thức giữ gìn văn hóa truyền thống", "C. Phê phán ca Huế", "D. Quảng cáo du lịch"], "answer": "B", "explain": "Tác phẩm tôn vinh di sản ca Huế và gửi gắm ý thức giữ gìn văn hóa."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Trăng lên cao, rải ánh vàng lấp lánh xuống mặt sông. Trên chiếc thuyền rồng, tiếng đàn tranh thánh thót hòa cùng giọng ca ngọt ngào. Sóng nước lăn tăn như cũng lặng nghe. Đoạn trích trên gợi liên tưởng đến tác phẩm nào?", "options": ["A. Thu điếu", "B. Thiên Trường vãn vọng", "C. Ca Huế trên sông Hương", "D. Quang Trung đại phá quân Thanh"], "answer": "C", "explain": "Trăng sông Hương, thuyền rồng, đàn ca gợi liên tưởng đến Ca Huế trên sông Hương."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Trăng lên cao, rải ánh vàng lấp lánh xuống mặt sông. Từ lấp lánh trong câu trên thuộc loại nào?", "options": ["A. Từ tượng thanh", "B. Từ Hán Việt", "C. Đại từ", "D. Từ tượng hình"], "answer": "D", "explain": "Lấp lánh gợi tả ánh sáng của trăng trên mặt sông nên là từ tượng hình."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Trăng lên cao, ánh vàng lấp lánh xuống mặt sông; tiếng đàn tranh thánh thót hòa cùng giọng ca ngọt ngào.", "statements": ["a) Đoạn trích tả cảnh sông Hương về đêm thơ mộng.", "b) Âm thanh đàn ca được miêu tả sinh động.", "c) Đoạn trích thể hiện thái độ thờ ơ với ca Huế."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đoạn trích thể hiện sự say mê, trân trọng ca Huế."}, {"type": "short", "level": "TH", "q": "Nêu hai làn điệu ca Huế được nhắc đến trong tác phẩm.", "answer": "(mẫu) Nam ai, nam bình (hoặc các làn điệu ca Huế khác)", "explain": "Chấm theo ý: kể đúng hai làn điệu của ca Huế."}, {"type": "short", "level": "VD", "q": "Vì sao ca Huế được coi là di sản văn hóa quý báu của dân tộc?", "answer": "(mẫu) Vì ca Huế là nghệ thuật ca hát truyền thống độc đáo của xứ Huế, kết tinh tâm hồn, bản sắc văn hóa dân tộc.", "explain": "Chấm theo ý: nêu được ca Huế là di sản văn hóa phi vật thể, thể hiện bản sắc dân tộc, cần giữ gìn."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Văn bản thông tin là văn bản có đặc điểm gì?", "options": ["A. Bày tỏ cảm xúc chủ quan", "B. Kể chuyện hư cấu", "C. Cung cấp tri thức một cách khách quan, chính xác", "D. Viết bằng thơ"], "answer": "C", "explain": "Văn bản thông tin cung cấp tri thức khách quan, chính xác."}, {"type": "mcq", "level": "TH", "q": "Ngôn ngữ của văn bản thông tin có đặc điểm gì?", "options": ["A. Giàu hình ảnh, nhạc điệu như thơ", "B. Đầy cảm xúc chủ quan", "C. Hoa mỹ, bóng bẩy", "D. Chính xác, rõ ràng, có số liệu, sự kiện cụ thể"], "answer": "D", "explain": "Văn bản thông tin dùng ngôn ngữ chính xác, rõ ràng với số liệu, sự kiện cụ thể."}, {"type": "mcq", "level": "TH", "q": "Cấu trúc thường gặp của văn bản thông tin là gì?", "options": ["A. Mở đầu – triển khai – kết thúc, mạch lạc", "B. Chỉ có một đoạn duy nhất", "C. Không có cấu trúc", "D. Viết tùy hứng"], "answer": "A", "explain": "Văn bản thông tin có cấu trúc mạch lạc: mở đầu – triển khai – kết thúc."}, {"type": "mcq", "level": "NB", "q": "Bước đầu tiên khi đọc hiểu văn bản thông tin là gì?", "options": ["A. Học thuộc lòng", "B. Xác định đề tài và mục đích của văn bản", "C. Chê bai văn bản", "D. Viết lại văn bản"], "answer": "B", "explain": "Cần xác định văn bản viết về đề tài gì, nhằm cung cấp thông tin gì."}, {"type": "mcq", "level": "VD", "q": "Khi đọc văn bản thông tin về di sản văn hóa, em cần rút ra điều gì?", "options": ["A. Không cần rút ra điều gì", "B. Chỉ cần nhớ số liệu", "C. Hiểu thêm về di sản và ý thức bảo vệ, phát huy giá trị di sản", "D. Chê di sản lạc hậu"], "answer": "C", "explain": "Đọc về di sản cần hiểu giá trị và nuôi dưỡng ý thức bảo vệ di sản."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Cố đô Huế được UNESCO công nhận là Di sản Văn hóa Thế giới năm 1993. Quần thể di tích gồm kinh thành, hoàng thành, các lăng tẩm và chùa chiền, là nơi lưu giữ nhiều giá trị lịch sử, kiến trúc, nghệ thuật của triều Nguyễn. Đoạn trích trên thuộc kiểu văn bản nào?", "options": ["A. Tùy bút", "B. Truyện lịch sử", "C. Thơ", "D. Văn bản thông tin"], "answer": "D", "explain": "Đoạn trích cung cấp tri thức khách quan, có số liệu cụ thể nên là văn bản thông tin."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Cố đô Huế được UNESCO công nhận là Di sản Văn hóa Thế giới năm 1993. Thông tin cụ thể nào được nêu trong đoạn trích?", "options": ["A. Năm 1993, UNESCO công nhận Cố đô Huế là Di sản Văn hóa Thế giới", "B. Ca Huế rất hay", "C. Sông Hương rất đẹp", "D. Huế có nhiều món ăn ngon"], "answer": "A", "explain": "Đoạn trích nêu số liệu cụ thể: năm 1993, UNESCO công nhận Cố đô Huế."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Cố đô Huế được UNESCO công nhận Di sản Văn hóa Thế giới năm 1993, gồm kinh thành, hoàng thành, lăng tẩm, chùa chiền.", "statements": ["a) Đoạn trích cung cấp thông tin khách quan, có số liệu cụ thể.", "b) Cố đô Huế lưu giữ nhiều giá trị lịch sử, văn hóa.", "c) Đoạn trích bày tỏ cảm xúc chủ quan của tác giả."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đoạn trích mang tính khách quan, không bộc lộ cảm xúc."}, {"type": "short", "level": "TH", "q": "Nêu hai đặc điểm của văn bản thông tin.", "answer": "(mẫu) Khách quan, chính xác; có số liệu, sự kiện cụ thể; cấu trúc mạch lạc...", "explain": "Chấm theo ý: nêu được hai đặc điểm: khách quan; chính xác; có số liệu; cấu trúc rõ ràng..."}, {"type": "short", "level": "VD", "q": "Vì sao văn bản thông tin thường sử dụng bảng biểu, hình ảnh, sơ đồ?", "answer": "(mẫu) Để trình bày thông tin trực quan, rõ ràng, dễ hiểu, dễ ghi nhớ.", "explain": "Chấm theo ý: phương tiện phi ngôn ngữ giúp thông tin trực quan, dễ hiểu, dễ nhớ."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Điểm khác nhau về mục đích giữa tùy bút và văn bản thông tin là gì?", "options": ["A. Không có điểm khác nhau", "B. Tùy bút dài hơn văn bản thông tin", "C. Văn bản thông tin hay hơn tùy bút", "D. Tùy bút nhằm bày tỏ cảm xúc, cảm nhận; văn bản thông tin nhằm cung cấp tri thức"], "answer": "D", "explain": "Tùy bút bày tỏ cảm xúc; văn bản thông tin cung cấp tri thức."}, {"type": "mcq", "level": "TH", "q": "Giọng điệu của tùy bút và văn bản thông tin khác nhau như thế nào?", "options": ["A. Tùy bút chủ quan, trữ tình; văn bản thông tin khách quan, trung lập", "B. Cả hai đều khách quan", "C. Cả hai đều chủ quan", "D. Tùy bút khách quan, văn bản thông tin chủ quan"], "answer": "A", "explain": "Tùy bút mang giọng chủ quan, trữ tình; văn bản thông tin giọng khách quan."}, {"type": "mcq", "level": "NB", "q": "Đoạn văn nào sau đây mang đặc điểm của tùy bút?", "options": ["A. Đoạn văn liệt kê số liệu dân số", "B. Đoạn văn tôi kể về đêm trăng quê hương với bao cảm xúc bâng khuâng", "C. Đoạn văn hướng dẫn sử dụng máy giặt", "D. Đoạn văn bản tin thời sự"], "answer": "B", "explain": "Đoạn văn xưng tôi, bộc lộ cảm xúc trước đêm trăng mang đặc điểm tùy bút."}, {"type": "mcq", "level": "NB", "q": "Đoạn văn nào sau đây mang đặc điểm của văn bản thông tin?", "options": ["A. Đoạn văn bày tỏ nỗi nhớ quê da diết", "B. Đoạn văn kể chuyện cổ tích", "C. Đoạn văn giới thiệu về di tích Cố đô Huế với niên đại, số liệu cụ thể", "D. Đoạn thơ tả cảnh"], "answer": "C", "explain": "Đoạn giới thiệu di tích với niên đại, số liệu cụ thể là văn bản thông tin."}, {"type": "mcq", "level": "VD", "q": "Khi làm bài đọc hiểu, em phân biệt tùy bút và văn bản thông tin dựa vào đâu?", "options": ["A. Dựa vào độ dài văn bản", "B. Dựa vào tên tác giả", "C. Dựa vào năm sáng tác", "D. Dựa vào mục đích, giọng điệu, ngôn ngữ: chủ quan, trữ tình hay khách quan, chính xác"], "answer": "D", "explain": "Phân biệt dựa vào mục đích, giọng điệu và ngôn ngữ của văn bản."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Tôi đã đến Huế vào một chiều mưa bay. Phố cổ trầm mặc trong màn mưa mỏng, mái ngói rêu phong như kể chuyện thời gian. Tôi đứng lặng hồi lâu, lòng dâng lên một niềm thương nhớ khó gọi tên. Đoạn trích trên thuộc kiểu văn bản nào?", "options": ["A. Tùy bút", "B. Bản tin", "C. Hướng dẫn sử dụng", "D. Văn bản thông tin"], "answer": "A", "explain": "Người kể xưng tôi, bộc lộ cảm xúc trữ tình nên là đoạn văn tùy bút."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Theo số liệu thống kê, mỗi năm Cố đô Huế đón hàng triệu lượt khách tham quan. Quần thể di tích có hơn 100 công trình kiến trúc lớn nhỏ. Đoạn trích trên thuộc kiểu văn bản nào?", "options": ["A. Tùy bút", "B. Văn bản thông tin", "C. Truyện ngắn", "D. Thơ"], "answer": "B", "explain": "Đoạn trích đưa số liệu khách quan nên là văn bản thông tin."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai khi phân biệt hai kiểu văn bản:", "statements": ["a) Tùy bút bộc lộ cảm xúc, cảm nhận chủ quan của tác giả.", "b) Văn bản thông tin cung cấp tri thức khách quan, chính xác.", "c) Tùy bút và văn bản thông tin hoàn toàn giống nhau."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: hai kiểu văn bản khác nhau về mục đích, giọng điệu, ngôn ngữ."}, {"type": "short", "level": "TH", "q": "Nêu một điểm giống nhau giữa tùy bút và văn bản thông tin khi viết về di sản văn hóa.", "answer": "(mẫu) Đều giúp người đọc hiểu thêm, thêm yêu và có ý thức giữ gìn di sản văn hóa.", "explain": "Chấm theo ý: đều góp phần tuyên truyền, giáo dục về giá trị di sản."}, {"type": "short", "level": "VD", "q": "Em thích đọc tùy bút hay văn bản thông tin hơn? Vì sao? (Trả lời ngắn gọn)", "answer": "(mẫu) Em thích tùy bút vì giàu cảm xúc, gần gũi... / Em thích văn bản thông tin vì cung cấp tri thức rõ ràng...", "explain": "Chấm theo ý: nêu được lựa chọn và lí do hợp lí, diễn đạt mạch lạc."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Di sản văn hóa là gì?", "options": ["A. Những giá trị vật chất và tinh thần do cha ông sáng tạo, lưu truyền", "B. Những món đồ cổ đắt tiền", "C. Những tòa nhà mới xây", "D. Những bài hát nhạc trẻ"], "answer": "A", "explain": "Di sản văn hóa là giá trị vật chất, tinh thần cha ông sáng tạo và lưu truyền."}, {"type": "mcq", "level": "NB", "q": "Ca Huế thuộc loại di sản văn hóa nào?", "options": ["A. Di sản thiên nhiên", "B. Di sản văn hóa phi vật thể", "C. Di sản văn hóa vật thể", "D. Không phải di sản"], "answer": "B", "explain": "Ca Huế là nghệ thuật trình diễn, thuộc di sản văn hóa phi vật thể."}, {"type": "mcq", "level": "TH", "q": "Cố đô Huế thuộc loại di sản văn hóa nào?", "options": ["A. Di sản văn hóa phi vật thể", "B. Di sản thiên nhiên", "C. Di sản văn hóa vật thể (quần thể di tích)", "D. Không phải di sản"], "answer": "C", "explain": "Cố đô Huế với kinh thành, lăng tẩm là di sản văn hóa vật thể."}, {"type": "mcq", "level": "TH", "q": "Vì sao chúng ta phải bảo vệ di sản văn hóa?", "options": ["A. Để khoe với bạn bè", "B. Để thu vé tham quan", "C. Để xây nhà mới", "D. Vì di sản là hồn cốt dân tộc, là cầu nối quá khứ – hiện tại – tương lai"], "answer": "D", "explain": "Di sản là hồn cốt dân tộc, cần bảo vệ để trao truyền cho mai sau."}, {"type": "mcq", "level": "VD", "q": "Là học sinh, em có thể làm gì để góp phần bảo vệ di sản văn hóa?", "options": ["A. Tìm hiểu, tuyên truyền về di sản; không vẽ bậy, không xả rác ở di tích; tham gia hoạt động giữ gìn văn hóa", "B. Không quan tâm", "C. Phá hoại di tích", "D. Xuyên tạc lịch sử"], "answer": "A", "explain": "Học sinh góp phần bằng tìm hiểu, tuyên truyền và hành động giữ gìn cụ thể."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Hội Lim ở Bắc Ninh là lễ hội truyền thống gắn với quan họ – di sản văn hóa phi vật thể của nhân loại. Mỗi độ xuân về, liền anh, liền chị trong áo tứ thân, khăn xếp lại cất lên những câu quan họ đằm thắm, làm say lòng du khách. Đoạn trích trên cung cấp thông tin về di sản nào?", "options": ["A. Ca Huế", "B. Quan họ Bắc Ninh", "C. Cồng chiêng Tây Nguyên", "D. Nhã nhạc cung đình"], "answer": "B", "explain": "Đoạn trích giới thiệu hội Lim gắn với quan họ Bắc Ninh."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Hội Lim ở Bắc Ninh là lễ hội truyền thống gắn với quan họ – di sản văn hóa phi vật thể của nhân loại. Cụm từ di sản văn hóa phi vật thể của nhân loại cho thấy giá trị nào của quan họ?", "options": ["A. Chỉ có giá trị ở Bắc Ninh", "B. Đã bị lãng quên", "C. Được thế giới công nhận, tôn vinh", "D. Không còn ai hát"], "answer": "C", "explain": "Được công nhận là di sản của nhân loại cho thấy giá trị được thế giới tôn vinh."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Hội Lim gắn với quan họ – di sản văn hóa phi vật thể của nhân loại; mỗi xuân về, liền anh liền chị cất câu quan họ đằm thắm.", "statements": ["a) Quan họ là di sản văn hóa phi vật thể.", "b) Hội Lim góp phần bảo tồn và phát huy quan họ.", "c) Quan họ chỉ còn trong sách vở, không ai biểu diễn."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: quan họ vẫn được biểu diễn trong lễ hội."}, {"type": "short", "level": "NB", "q": "Kể tên hai di sản văn hóa của Việt Nam mà em biết.", "answer": "(mẫu) Cố đô Huế, quan họ Bắc Ninh (hoặc ca Huế, cồng chiêng Tây Nguyên, phố cổ Hội An...)", "explain": "Chấm theo ý: kể đúng hai di sản văn hóa Việt Nam."}, {"type": "short", "level": "VD", "q": "Viết 2-3 câu nêu suy nghĩ của em về trách nhiệm giữ gìn di sản văn hóa.", "answer": "(mẫu) Di sản văn hóa là tài sản vô giá của dân tộc. Mỗi chúng ta, nhất là thế hệ trẻ, cần tìm hiểu, trân trọng và góp phần bảo vệ di sản để trao truyền cho mai sau.", "explain": "Chấm theo ý: thể hiện ý thức trách nhiệm; diễn đạt mạch lạc."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Khi đọc văn bản thông tin, việc tìm câu chủ đề, số liệu quan trọng giúp gì?", "options": ["A. Làm văn bản dài hơn", "B. Nắm được ý chính của từng đoạn", "C. Học thuộc lòng", "D. Vẽ tranh minh họa"], "answer": "B", "explain": "Tìm câu chủ đề, số liệu giúp nắm được ý chính của từng đoạn văn."}, {"type": "mcq", "level": "TH", "q": "Vì sao cần đánh giá độ tin cậy của thông tin khi đọc?", "options": ["A. Để chê bai tác giả", "B. Để viết dài hơn", "C. Để biết thông tin có cụ thể, có nguồn gốc rõ ràng, đáng tin không", "D. Để bỏ qua văn bản"], "answer": "C", "explain": "Cần đánh giá xem thông tin có cụ thể, có nguồn gốc rõ ràng hay không."}, {"type": "mcq", "level": "NB", "q": "Phương tiện phi ngôn ngữ thường dùng trong văn bản thông tin là gì?", "options": ["A. Thơ ca", "B. Nhạc", "C. Phim", "D. Bảng biểu, hình ảnh, sơ đồ"], "answer": "D", "explain": "Văn bản thông tin thường dùng bảng biểu, hình ảnh, sơ đồ minh họa."}, {"type": "mcq", "level": "TH", "q": "Trình tự thời gian trong văn bản thông tin về di sản có tác dụng gì?", "options": ["A. Giúp người đọc theo dõi quá trình hình thành, phát triển của di sản", "B. Làm văn bản khó hiểu", "C. Không có tác dụng", "D. Để trang trí"], "answer": "A", "explain": "Trình tự thời gian giúp theo dõi quá trình hình thành, phát triển của di sản."}, {"type": "mcq", "level": "VD", "q": "Em đọc một văn bản thông tin thấy số liệu mâu thuẫn nhau. Em nên làm gì?", "options": ["A. Tin ngay không cần kiểm tra", "B. Đối chiếu với nguồn tin cậy khác để xác minh", "C. Bỏ qua", "D. Chép lại nguyên văn"], "answer": "B", "explain": "Khi số liệu mâu thuẫn, cần đối chiếu với nguồn tin cậy khác để xác minh."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Nhã nhạc cung đình Huế là âm nhạc nghi lễ của triều Nguyễn, được UNESCO công nhận là Di sản văn hóa phi vật thể năm 2003. Dàn nhạc gồm nhiều loại nhạc cụ truyền thống như đàn tỳ bà, đàn tranh, trống, sáo... Nhã nhạc thường biểu diễn trong các lễ tế, lễ hội cung đình. Nội dung chính của đoạn trích trên là gì?", "options": ["A. Giới thiệu về ca Huế", "B. Giới thiệu về quan họ", "C. Giới thiệu về nhã nhạc cung đình Huế – di sản văn hóa phi vật thể", "D. Giới thiệu về Cố đô Huế"], "answer": "C", "explain": "Đoạn trích giới thiệu nhã nhạc cung đình Huế và giá trị di sản của nó."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Nhã nhạc cung đình Huế là âm nhạc nghi lễ của triều Nguyễn, được UNESCO công nhận là Di sản văn hóa phi vật thể năm 2003. Nhã nhạc cung đình Huế được UNESCO công nhận vào năm nào?", "options": ["A. 1993", "B. 2000", "C. 2010", "D. 2003"], "answer": "D", "explain": "Nhã nhạc cung đình Huế được UNESCO công nhận năm 2003."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Nhã nhạc cung đình Huế là âm nhạc nghi lễ triều Nguyễn, được UNESCO công nhận năm 2003, biểu diễn trong lễ tế, lễ hội cung đình.", "statements": ["a) Nhã nhạc là âm nhạc nghi lễ của triều Nguyễn.", "b) Đoạn trích cung cấp thông tin khách quan, có số liệu cụ thể.", "c) Nhã nhạc thường biểu diễn trong quán cà phê hiện đại."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: nhã nhạc biểu diễn trong lễ tế, lễ hội cung đình."}, {"type": "short", "level": "TH", "q": "Nêu hai bước khi đọc hiểu văn bản thông tin.", "answer": "(mẫu) Xác định đề tài, mục đích; tìm ý chính, số liệu quan trọng", "explain": "Chấm theo ý: nêu đúng hai trong năm bước: xác định đề tài, mục đích; tìm ý chính, số liệu; phân tích cấu trúc; đánh giá độ tin cậy; rút ra thông điệp."}, {"type": "short", "level": "NB", "q": "Văn bản thông tin khác văn bản tự sự ở điểm nào?", "answer": "(mẫu) Văn bản thông tin cung cấp tri thức khách quan; văn bản tự sự kể chuyện, có nhân vật, cốt truyện.", "explain": "Chấm theo ý: nêu được sự khác nhau về mục đích và đặc điểm."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "TH", "q": "Hình ảnh mặt sông phẳng lặng như gương trong tùy bút có tác dụng gì?", "options": ["A. Cho biết độ sâu của sông", "B. Để đo nhiệt độ nước", "C. Gợi tả vẻ đẹp thơ mộng, yên bình của sông Hương đêm trăng", "D. Để cảnh báo nguy hiểm"], "answer": "C", "explain": "Hình ảnh so sánh gợi tả vẻ đẹp thơ mộng, yên bình của sông Hương."}, {"type": "mcq", "level": "TH", "q": "Tác giả miêu tả âm thanh ca Huế nhằm mục đích gì?", "options": ["A. Để khoe thính giác tốt", "B. Để ghi âm lại", "C. Để so sánh với nhạc hiện đại", "D. Để người đọc cảm nhận được vẻ đẹp, sức lay động của ca Huế"], "answer": "D", "explain": "Miêu tả âm thanh giúp người đọc cảm nhận vẻ đẹp, sức lay động của ca Huế."}, {"type": "mcq", "level": "NB", "q": "Cái tôi trong tùy bút Ca Huế trên sông Hương bộc lộ tình cảm gì?", "options": ["A. Tình yêu sâu nặng với văn hóa Huế, quê hương đất nước", "B. Sự chán ghét Huế", "C. Sự thờ ơ", "D. Nỗi sợ sông nước"], "answer": "A", "explain": "Tác giả bộc lộ tình yêu sâu nặng với văn hóa Huế và quê hương."}, {"type": "mcq", "level": "VD", "q": "Vì sao tùy bút về di sản văn hóa có sức thuyết phục đặc biệt?", "options": ["A. Vì tùy bút rất dài", "B. Vì cảm xúc chân thành của tác giả dễ lay động, truyền cảm hứng cho người đọc", "C. Vì tùy bút có nhiều số liệu", "D. Vì tùy bút viết bằng thơ"], "answer": "B", "explain": "Cảm xúc chân thành của tác giả dễ lay động và truyền cảm hứng."}, {"type": "mcq", "level": "TH", "q": "Chi tiết các làn điệu khi da diết, khi rộn ràng cho thấy đặc điểm gì của ca Huế?", "options": ["A. Đơn điệu, nhàm chán", "B. Chỉ buồn", "C. Phong phú, đa dạng về sắc thái tình cảm", "D. Ồn ào"], "answer": "C", "explain": "Ca Huế phong phú, đa dạng về sắc thái: khi da diết, khi rộn ràng."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Tôi khép mắt lại, để mặc tiếng đàn, tiếng ca dìu dặt trôi theo sóng nước. Dường như cả dòng sông cũng đang lắng nghe. Một đêm ca Huế không chỉ là một buổi biểu diễn mà là một cuộc gặp gỡ giữa quá khứ và hiện tại, giữa con người với quê hương. Câu cả dòng sông cũng đang lắng nghe sử dụng biện pháp tu từ nào?", "options": ["A. So sánh", "B. Ẩn dụ", "C. Nói quá", "D. Nhân hóa"], "answer": "D", "explain": "Dòng sông được miêu tả như con người biết lắng nghe."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Một đêm ca Huế không chỉ là một buổi biểu diễn mà là một cuộc gặp gỡ giữa quá khứ và hiện tại, giữa con người với quê hương. Theo đoạn trích, đêm ca Huế có ý nghĩa gì?", "options": ["A. Là cuộc gặp gỡ giữa quá khứ và hiện tại, giữa con người với quê hương", "B. Chỉ là buổi biểu diễn mua vui", "C. Không có ý nghĩa gì", "D. Chỉ để kiếm tiền"], "answer": "A", "explain": "Đêm ca Huế là cuộc gặp gỡ giữa quá khứ và hiện tại, giữa con người với quê hương."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Tôi khép mắt để mặc tiếng đàn, tiếng ca trôi theo sóng nước; cả dòng sông cũng đang lắng nghe; đêm ca Huế là cuộc gặp gỡ giữa quá khứ và hiện tại.", "statements": ["a) Người viết đắm mình trong tiếng đàn, tiếng ca Huế.", "b) Đêm ca Huế được cảm nhận như cuộc gặp gỡ giữa quá khứ và hiện tại.", "c) Người viết thờ ơ với ca Huế."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: người viết đắm say, trân trọng ca Huế."}, {"type": "short", "level": "VD", "q": "Nêu cảm nhận của em về một làn điệu dân ca quê hương em (2-3 câu).", "answer": "(mẫu) Em rất yêu làn điệu dân ca quê hương với giai điệu ngọt ngào, đằm thắm. Mỗi lần nghe, em lại thấy nhớ quê hương da diết.", "explain": "Chấm theo ý: bộc lộ tình cảm với dân ca quê hương; diễn đạt mạch lạc."}, {"type": "short", "level": "TH", "q": "Vì sao tác giả Hà Ánh Minh chọn đêm trăng để nghe ca Huế?", "answer": "(mẫu) Vì đêm trăng sông Hương thơ mộng, tôn thêm vẻ đẹp của ca Huế, để lại ấn tượng sâu sắc.", "explain": "Chấm theo ý: không gian đêm trăng thơ mộng làm nổi bật vẻ đẹp ca Huế."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "Trong tùy bút, từ láy tượng hình, tượng thanh thường có tác dụng gì?", "options": ["A. Làm văn bản dài", "B. Thay thế nội dung", "C. Gây khó hiểu", "D. Làm cho miêu tả sinh động, giàu nhạc điệu"], "answer": "D", "explain": "Từ láy gợi tả làm miêu tả sinh động, giàu nhạc điệu."}, {"type": "mcq", "level": "NB", "q": "Từ lấp lánh, thánh thót trong các đoạn trích thuộc loại nào?", "options": ["A. Từ láy tượng hình, tượng thanh", "B. Từ Hán Việt", "C. Danh từ", "D. Động từ"], "answer": "A", "explain": "Lấp lánh là từ láy tượng hình, thánh thót là từ láy tượng thanh."}, {"type": "mcq", "level": "TH", "q": "Câu văn Tiếng đàn, tiếng ca nương theo sóng nước lan xa gợi cảm giác gì?", "options": ["A. Ồn ào, náo nhiệt", "B. Êm đềm, lan tỏa, thấm sâu vào lòng người", "C. Buồn thảm", "D. Khẩn trương"], "answer": "B", "explain": "Câu văn gợi cảm giác êm đềm, lan tỏa, thấm sâu vào lòng người."}, {"type": "mcq", "level": "TH", "q": "Khi viết đoạn văn cảm nhận về một di sản, em nên kết hợp yếu tố nào?", "options": ["A. Chỉ kể chuyện", "B. Chỉ đưa số liệu", "C. Vừa giới thiệu thông tin, vừa bộc lộ cảm xúc của mình", "D. Chỉ chê bai"], "answer": "C", "explain": "Đoạn văn cảm nhận nên vừa có thông tin, vừa bộc lộ cảm xúc."}, {"type": "mcq", "level": "VD", "q": "Học xong Bài 3, em hiểu thêm điều gì về sông núi quê hương?", "options": ["A. Không hiểu thêm gì", "B. Sông núi chỉ để ngắm", "C. Di sản không quan trọng", "D. Sông núi, di sản quê hương đẹp và đáng tự hào; cần giữ gìn, phát huy"], "answer": "D", "explain": "Bài học giúp thêm yêu, tự hào và có ý thức giữ gìn di sản quê hương."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Sông Hương dài khoảng 80 km, chảy qua thành phố Huế trước khi đổ ra biển. Dòng sông hiền hòa, thơ mộng này đã đi vào thơ ca, nhạc họa và trở thành biểu tượng của xứ Huế mộng mơ. Đoạn trích trên thuộc kiểu văn bản nào?", "options": ["A. Văn bản thông tin", "B. Tùy bút", "C. Truyện ngắn", "D. Thơ"], "answer": "A", "explain": "Đoạn trích cung cấp tri thức khách quan, có số liệu nên là văn bản thông tin."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Sông Hương dài khoảng 80 km, chảy qua thành phố Huế trước khi đổ ra biển. Sông Hương dài khoảng bao nhiêu?", "options": ["A. 8 km", "B. Khoảng 80 km", "C. 800 km", "D. 8000 km"], "answer": "B", "explain": "Đoạn trích nêu rõ sông Hương dài khoảng 80 km."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Sông Hương dài khoảng 80 km, chảy qua thành phố Huế, là biểu tượng của xứ Huế mộng mơ.", "statements": ["a) Đoạn trích cung cấp thông tin khách quan về sông Hương.", "b) Sông Hương là biểu tượng của xứ Huế.", "c) Đoạn trích bộc lộ cảm xúc chủ quan của tác giả."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đoạn trích mang tính khách quan."}, {"type": "short", "level": "TH", "q": "Nêu tên tác phẩm tùy bút được học trong Bài 3 và tác giả.", "answer": "Ca Huế trên sông Hương – Hà Ánh Minh", "explain": "Chấm theo ý: nêu đúng tên tác phẩm và tác giả."}, {"type": "short", "level": "NB", "q": "Kể tên một di sản văn hóa vật thể và một di sản văn hóa phi vật thể của Việt Nam.", "answer": "(mẫu) Vật thể: Cố đô Huế; phi vật thể: ca Huế (hoặc quan họ, nhã nhạc...)", "explain": "Chấm theo ý: kể đúng mỗi loại một di sản."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VD", "q": "Cùng viết về sông Hương, tùy bút và văn bản thông tin khác nhau chủ yếu ở điểm nào?", "options": ["A. Tùy bút bộc lộ cảm xúc trữ tình; văn bản thông tin cung cấp tri thức khách quan", "B. Tùy bút dài hơn", "C. Văn bản thông tin hay hơn", "D. Không khác nhau"], "answer": "A", "explain": "Điểm khác chủ yếu là mục đích và giọng điệu: trữ tình hay khách quan."}, {"type": "mcq", "level": "TH", "q": "Để viết tốt đoạn văn giới thiệu một di sản, em cần chuẩn bị gì?", "options": ["A. Chỉ cần cảm xúc", "B. Tìm hiểu thông tin chính xác về di sản (nguồn gốc, đặc điểm, giá trị)", "C. Bịa đặt thêm", "D. Chép trên mạng"], "answer": "B", "explain": "Cần tìm hiểu thông tin chính xác về nguồn gốc, đặc điểm, giá trị di sản."}, {"type": "mcq", "level": "NB", "q": "Nhan đề Lời sông núi gợi cho em liên tưởng gì?", "options": ["A. Tiếng nói của thiên nhiên", "B. Tiếng ồn ào", "C. Lời nhắn gửi của quê hương, đất nước qua sông núi, di sản văn hóa", "D. Lời than thở"], "answer": "C", "explain": "Lời sông núi là lời nhắn gửi của quê hương qua sông núi, di sản văn hóa."}, {"type": "mcq", "level": "TH", "q": "Chi tiết ánh trăng vàng rải xuống dòng Hương giang thuộc phong cách ngôn ngữ nào?", "options": ["A. Ngôn ngữ khoa học", "B. Ngôn ngữ hành chính", "C. Ngôn ngữ báo chí", "D. Ngôn ngữ nghệ thuật giàu hình ảnh"], "answer": "D", "explain": "Chi tiết giàu hình ảnh, thuộc phong cách ngôn ngữ nghệ thuật."}, {"type": "mcq", "level": "VD", "q": "Vì sao bài học về di sản văn hóa được đặt trong chương trình Ngữ văn?", "options": ["A. Vì văn học góp phần bồi đắp tình yêu quê hương, ý thức giữ gìn bản sắc văn hóa dân tộc", "B. Vì để học sinh đi du lịch", "C. Vì để kiếm tiền", "D. Không có lí do"], "answer": "A", "explain": "Văn học bồi đắp tình yêu quê hương và ý thức giữ gìn bản sắc văn hóa."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Chiều nay, tôi đứng trên cầu Trường Tiền nhìn xuống dòng Hương giang. Nước trôi lững lờ, những chiếc thuyền nhỏ nhấp nhô. Bỗng tôi hiểu vì sao bao thi nhân say đắm dòng sông này: nó hiền hòa như tính cách người Huế, thủy chung và sâu lắng. Đoạn trích trên mang đặc điểm nào của tùy bút?", "options": ["A. Chỉ đưa số liệu", "B. Người kể xưng tôi, vừa tả cảnh vừa bộc lộ cảm xúc, suy ngẫm", "C. Kể chuyện có cốt truyện chặt chẽ", "D. Viết bằng thơ"], "answer": "B", "explain": "Người kể xưng tôi, vừa tả cảnh sông Hương vừa bộc lộ cảm xúc, suy ngẫm."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Bỗng tôi hiểu vì sao bao thi nhân say đắm dòng sông này: nó hiền hòa như tính cách người Huế, thủy chung và sâu lắng. Phép so sánh trong câu nó hiền hòa như tính cách người Huế có tác dụng gì?", "options": ["A. Làm người đọc buồn ngủ", "B. Chứng minh khoa học", "C. Gắn vẻ đẹp dòng sông với vẻ đẹp tâm hồn con người xứ Huế", "D. Không có tác dụng"], "answer": "C", "explain": "Phép so sánh gắn vẻ đẹp dòng sông với vẻ đẹp tâm hồn người Huế."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Chiều nay, tôi đứng trên cầu Trường Tiền nhìn xuống dòng Hương giang; dòng sông hiền hòa như tính cách người Huế.", "statements": ["a) Đoạn trích thể hiện tình cảm gắn bó với sông Hương.", "b) Tác giả gắn vẻ đẹp thiên nhiên với vẻ đẹp con người.", "c) Đoạn trích là văn bản thông tin khách quan."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đây là đoạn văn trữ tình mang đặc điểm tùy bút."}, {"type": "short", "level": "VD", "q": "Viết đoạn văn ngắn (3-4 câu) giới thiệu một di sản văn hóa ở quê hương em.", "answer": "(mẫu) Quê em có di tích... với đặc điểm... Em rất tự hào và mong muốn góp phần giữ gìn di sản quê hương.", "explain": "Chấm theo ý: giới thiệu được di sản (tên, đặc điểm, giá trị), bộc lộ tình cảm, diễn đạt mạch lạc."}, {"type": "short", "level": "TH", "q": "Nêu hai việc làm cụ thể của học sinh để bảo vệ di tích lịch sử ở địa phương.", "answer": "(mẫu) Không vẽ bậy, xả rác ở di tích; tham gia dọn vệ sinh, tuyên truyền bảo vệ di tích...", "explain": "Chấm theo ý: nêu được hai việc làm cụ thể, thiết thực."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bài 3 Lời sông núi gồm những nội dung nào?", "options": ["A. Truyện lịch sử, thơ Đường luật", "B. Tùy bút, tác phẩm Ca Huế trên sông Hương, cách đọc hiểu văn bản thông tin về di sản văn hóa", "C. Truyện ngắn, tiểu thuyết", "D. Văn bản hành chính"], "answer": "B", "explain": "Bài 3 gồm tùy bút, Ca Huế trên sông Hương và cách đọc hiểu văn bản thông tin."}, {"type": "mcq", "level": "TH", "q": "Nhận định nào đúng về tùy bút?", "options": ["A. Tùy bút có cốt truyện chặt chẽ như truyện ngắn", "B. Tùy bút không bộc lộ cảm xúc", "C. Tùy bút là văn xuôi tự sự – trữ tình, ghi chép tự do, người kể xưng tôi", "D. Tùy bút viết bằng thơ"], "answer": "C", "explain": "Tùy bút là văn xuôi tự sự – trữ tình, ghi chép tự do, người kể xưng tôi."}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây sai?", "options": ["A. Hà Ánh Minh là tác giả Ca Huế trên sông Hương", "B. Ca Huế là di sản văn hóa phi vật thể", "C. Văn bản thông tin mang tính khách quan", "D. Tùy bút nhằm cung cấp tri thức khách quan như văn bản thông tin"], "answer": "D", "explain": "Tùy bút nhằm bày tỏ cảm xúc; cung cấp tri thức khách quan là mục đích của văn bản thông tin."}, {"type": "mcq", "level": "NB", "q": "Tác phẩm Ca Huế trên sông Hương thuộc thể loại nào?", "options": ["A. Tùy bút", "B. Truyện lịch sử", "C. Thơ Đường luật", "D. Văn bản thông tin"], "answer": "A", "explain": "Ca Huế trên sông Hương là tùy bút tiêu biểu."}, {"type": "mcq", "level": "VD", "q": "Thông điệp chung của Bài 3 là gì?", "options": ["A. Chỉ cần học giỏi văn", "B. Yêu quê hương, trân trọng và góp phần giữ gìn di sản văn hóa dân tộc", "C. Chỉ cần đi du lịch nhiều", "D. Quên đi quá khứ"], "answer": "B", "explain": "Bài 3 gửi gắm thông điệp yêu quê hương, giữ gìn di sản văn hóa."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Di sản văn hóa là món quà vô giá cha ông để lại. Mỗi làn điệu dân ca, mỗi mái đình cổ kính đều kể câu chuyện về cội nguồn dân tộc. Giữ gìn di sản chính là giữ gìn hồn cốt của quê hương, để mai sau con cháu vẫn được nghe lời sông núi thì thầm. Theo đoạn trích, vì sao phải giữ gìn di sản văn hóa?", "options": ["A. Để kiếm tiền", "B. Để khoe khoang", "C. Vì di sản là hồn cốt quê hương, là câu chuyện về cội nguồn dân tộc", "D. Vì bị ép buộc"], "answer": "C", "explain": "Di sản là hồn cốt quê hương, câu chuyện về cội nguồn nên cần giữ gìn."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Giữ gìn di sản chính là giữ gìn hồn cốt của quê hương, để mai sau con cháu vẫn được nghe lời sông núi thì thầm. Cụm từ lời sông núi thì thầm gợi liên tưởng đến nhan đề bài học nào?", "options": ["A. Bài 1", "B. Bài 2", "C. Bài 4", "D. Bài 3: Lời sông núi"], "answer": "D", "explain": "Cụm từ gợi liên tưởng đến nhan đề Bài 3: Lời sông núi."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Di sản văn hóa là món quà vô giá cha ông để lại; giữ gìn di sản là giữ gìn hồn cốt quê hương.", "statements": ["a) Di sản văn hóa là món quà vô giá cha ông để lại.", "b) Giữ gìn di sản là giữ gìn hồn cốt quê hương.", "c) Di sản văn hóa không có giá trị gì với hôm nay."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: di sản có giá trị to lớn với hôm nay và mai sau."}, {"type": "short", "level": "TH", "q": "Phân biệt tùy bút và văn bản thông tin ở hai tiêu chí: mục đích và giọng điệu.", "answer": "(mẫu) Mục đích: tùy bút bày tỏ cảm xúc; văn bản thông tin cung cấp tri thức. Giọng điệu: tùy bút chủ quan, trữ tình; văn bản thông tin khách quan.", "explain": "Chấm theo ý: nêu đúng sự khác nhau ở cả hai tiêu chí."}, {"type": "short", "level": "VD", "q": "Viết 2-3 câu nêu cảm nghĩ của em sau khi học Bài 3.", "answer": "(mẫu) Em thêm yêu quê hương, đất nước qua những trang tùy bút và hiểu biết về di sản. Em sẽ góp phần giữ gìn văn hóa dân tộc.", "explain": "Chấm theo ý: bộc lộ tình cảm, ý thức trách nhiệm; diễn đạt mạch lạc."}]}]}
