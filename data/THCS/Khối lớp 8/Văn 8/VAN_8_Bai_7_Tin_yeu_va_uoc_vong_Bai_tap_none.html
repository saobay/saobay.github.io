{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Phong trào Thơ mới nở rộ trong giai đoạn nào?", "explain": "Phong trào Thơ mới diễn ra từ khoảng năm 1932 đến năm 1945.", "options": ["A. Những năm 1932 – 1945", "B. Những năm 1900 – 1910", "C. Những năm 1945 – 1954", "D. Những năm 1986 – 2000"], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Tác giả của bài thơ “Nhớ rừng” là ai?", "explain": "“Nhớ rừng” là bài thơ nổi tiếng của Thế Lữ, được xem là mở đầu phong trào Thơ mới.", "options": ["A. Vũ Đình Liên", "B. Thế Lữ", "C. Tế Hanh", "D. Huy Cận"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Bài thơ “Ông đồ” của Vũ Đình Liên viết về hình ảnh nào?", "explain": "Bài thơ khắc họa hình ảnh ông đồ già bên phố mỗi dịp Tết đến.", "options": ["A. Người nông dân cày ruộng", "B. Người chiến sĩ ra trận", "C. Ông đồ già viết chữ Nho bên phố ngày Tết", "D. Cậu học trò đến trường"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "“Cái tôi trữ tình” trong thơ mới được hiểu là gì?", "explain": "Cái tôi trữ tình là tiếng nói cảm xúc, tâm trạng riêng, chân thành của nhà thơ.", "options": ["A. Nhân vật phụ trong bài thơ", "B. Người kể chuyện đứng ngoài quan sát", "C. Tâm trạng chung của độc giả", "D. Tiếng nói cảm xúc, tâm trạng riêng của nhà thơ"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Hai câu thơ “Những người muôn năm cũ, / Hồn ở đâu bây giờ?” bộc lộ tâm trạng gì?", "explain": "Câu hỏi tu từ bộc lộ nỗi hoài niệm, tiếc nuối một nét đẹp văn hóa đang phai tàn.", "options": ["A. Hoài niệm, tiếc nuối một thời vàng son đã qua", "B. Vui mừng trước sự đổi mới", "C. Giận dữ với thời cuộc", "D. Thờ ơ, lạnh lùng"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Mỗi lần đọc “Ông đồ”, em lại hình dung một ông già áo the khăn xếp ngồi bên lề phố, tay run run viết từng nét chữ Nho. Ngày Tết, người ta chen nhau xin chữ lấy may; rồi năm tháng qua đi, phố vẫn đông mà chẳng còn ai đoái hoài đến mực tàu giấy đỏ.”\nĐoạn văn trên chủ yếu bộc lộ cảm xúc gì của người viết?", "explain": "Đoạn văn diễn tả sự đối lập xưa đông vui – nay vắng vẻ, gợi niềm xót xa, tiếc nuối.", "options": ["A. Hân hoan trước sự đổi mới", "B. Xót xa, thương cảm trước sự mai một của một nét đẹp văn hóa", "C. Tức giận với người mua chữ", "D. Thờ ơ, vô cảm"], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Thơ mới khác thơ cổ điển ở chỗ đề cao cái tôi cá nhân. Nhà thơ không còn mượn lời chung chung mà dám nói thẳng nỗi buồn, niềm vui của riêng mình. Hình ảnh trong thơ mới cũng gần gũi, sinh động hơn.”\nXét tính đúng sai của các nhận định:", "statements": ["a) Thơ mới đề cao cái tôi cá nhân.", "b) Thơ mới tiếp tục lối nói chung chung, ước lệ của thơ cổ điển.", "c) Hình ảnh trong thơ mới gần gũi, sinh động hơn thơ cổ điển."], "answers": ["T", "S", "T"], "explain": "a) Đúng – đó là đổi mới lớn nhất về nội dung. b) Sai – thơ mới phá bỏ lối nói chung chung. c) Đúng – theo nội dung đoạn văn."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Trong “Quê hương”, nhà thơ nhớ về làng chài với những buổi sớm mai thuyền ra khơi, cánh buồm căng gió. Nỗi nhớ ấy da diết đến mức nhà thơ ước được sống lại những ngày xưa êm đềm.”\nHình ảnh “cánh buồm” trong đoạn trích gợi liên tưởng gì?", "explain": "Cánh buồm là hình ảnh tiêu biểu cho sức sống và hồn quê của làng chài.", "options": ["A. Nỗi buồn chiến tranh", "B. Sự giàu sang vật chất", "C. Hồn quê, sức sống của làng chài ven biển", "D. Cảnh phố thị phồn hoa"], "answer": "C"}, {"type": "short", "level": "VD", "q": "Kể tên hai bài thơ (cùng tác giả) được học trong Bài 7, ngoài “Nhớ rừng”.", "answer": "“Ông đồ” của Vũ Đình Liên và “Quê hương” của Tế Hanh.", "explain": "Chấm theo ý: nêu đúng tên hai bài thơ và tác giả tương ứng."}, {"type": "short", "level": "VD", "q": "Nêu một biểu hiện đổi mới về hình thức của thơ mới so với thơ cổ điển.", "answer": "Thơ mới dùng thể thơ tự do, phá vỡ niêm luật chặt chẽ của thơ Đường luật; câu thơ dài ngắn không đều, nhịp điệu linh hoạt, phóng khoáng.", "explain": "Chấm theo ý: nêu được biểu hiện đổi mới về thể loại, hình thức (thể thơ tự do, nhịp điệu, ngôn ngữ...)."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Bài thơ “Nhớ rừng” mượn lời của nhân vật nào?", "explain": "Bài thơ mượn lời con hổ bị nhốt để nói về khát vọng tự do.", "options": ["A. Người quản tượng", "B. Con chim trong lồng", "C. Người thợ săn", "D. Con hổ bị nhốt trong vườn bách thú"], "answer": "D"}, {"type": "mcq", "level": "NB", "q": "Quê hương của nhà thơ Tế Hanh gắn với vùng đất nào?", "explain": "Tế Hanh sinh ra ở làng chài ven biển miền Trung, quê hương là nguồn cảm hứng lớn của ông.", "options": ["A. Làng chài ven biển miền Trung", "B. Đồng bằng sông Hồng", "C. Vùng núi Tây Bắc", "D. Thành phố lớn"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Điểm mới về thể loại của thơ mới so với thơ cổ điển là gì?", "explain": "Thơ mới phá vỡ niêm luật Đường luật, dùng thể thơ tự do phóng khoáng.", "options": ["A. Chỉ dùng thể thất ngôn bát cú", "B. Dùng thể thơ tự do, không gò bó niêm luật", "C. Quay lại dùng chữ Hán", "D. Bỏ hẳn vần điệu"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Hai câu thơ “Gặm một khối căm hờn trong cũi sắt, / Ta nằm dài, trông ngày tháng dần qua” diễn tả tâm trạng gì của con hổ?", "explain": "“Căm hờn”, “cũi sắt” diễn tả nỗi uất hận, chán chường của con hổ mất tự do.", "options": ["A. Vui vẻ, thảnh thơi", "B. Sợ hãi, run rẩy", "C. Uất hận, chán chường trong cảnh tù túng", "D. Bình thản, an nhiên"], "answer": "C"}, {"type": "mcq", "level": "NB", "q": "Bài thơ nào được xem là mở đầu cho phong trào Thơ mới?", "explain": "“Nhớ rừng” được xem là bài thơ mở đầu phong trào Thơ mới.", "options": ["A. “Ông đồ” của Vũ Đình Liên", "B. “Quê hương” của Tế Hanh", "C. “Tràng giang” của Huy Cận", "D. “Nhớ rừng” của Thế Lữ"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Nhớ về quá khứ, con hổ thấy mình oai hùng giữa rừng xanh: vờn bóng, uống ánh trăng tan. Trở về hiện tại, nó chỉ còn là kẻ nằm dài trong cũi sắt, gặm nhấm nỗi căm hờn.”\nNghệ thuật chính được sử dụng trong đoạn trích là gì?", "explain": "Đoạn văn đặt quá khứ và hiện tại đối lập nhau để làm nổi bật bi kịch của con hổ.", "options": ["A. Đối lập giữa quá khứ oai hùng và hiện tại tù túng", "B. Liệt kê đơn thuần", "C. Tường thuật khách quan", "D. Miêu tả ngoại hình"], "answer": "A"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Cái tôi trữ tình là tiếng nói cảm xúc riêng của nhà thơ. Trong thơ mới, cái tôi ấy được bộc lộ chân thành, không che giấu. Nhờ vậy, người đọc cảm thấy gần gũi như đang nghe nhà thơ tâm sự.”\nXét tính đúng sai:", "statements": ["a) Cái tôi trữ tình là tiếng nói cảm xúc riêng của nhà thơ.", "b) Thơ mới che giấu cảm xúc cá nhân của nhà thơ.", "c) Cái tôi chân thành giúp người đọc cảm thấy gần gũi."], "answers": ["T", "S", "T"], "explain": "a) Đúng – đúng định nghĩa. b) Sai – thơ mới bộc lộ chân thành. c) Đúng – theo đoạn văn."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Ngày Tết, ông đồ vẫn ra phố bày mực tàu giấy đỏ, nhưng người qua lại thưa thớt dần. Ông ngồi lặng lẽ, nhìn lá vàng rơi trên giấy, lòng đầy ngậm ngùi.”\nChi tiết “lá vàng rơi trên giấy” gợi cảm giác gì?", "explain": "Lá vàng rơi gợi sự tàn phai, vắng vẻ, phù hợp với tâm trạng ngậm ngùi của ông đồ.", "options": ["A. Rộn ràng, náo nhiệt", "B. Vắng vẻ, tàn phai, buồn bã", "C. Tươi vui, hy vọng", "D. Bình yên, no đủ"], "answer": "B"}, {"type": "short", "level": "VD", "q": "Vì sao nói “Nhớ rừng” mượn chuyện con hổ để nói chuyện con người?", "answer": "Vì con hổ mất tự do là ẩn dụ cho thân phận người dân Việt Nam mất nước, khao khát tự do, độc lập.", "explain": "Chấm theo ý: chỉ ra được ý nghĩa ẩn dụ – từ con hổ đến con người, khát vọng tự do."}, {"type": "short", "level": "VD", "q": "Nêu cảm hứng chủ đạo chung của ba bài thơ trong Bài 7.", "answer": "Niềm tin yêu cuộc sống, tình yêu quê hương đất nước và ước vọng tự do, tương lai tươi sáng.", "explain": "Chấm theo ý: nêu được tinh thần “tin yêu và ước vọng” qua các bài thơ."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả bài thơ “Ông đồ” là ai?", "explain": "“Ông đồ” là bài thơ nổi tiếng của Vũ Đình Liên.", "options": ["A. Thế Lữ", "B. Tế Hanh", "C. Vũ Đình Liên", "D. Nguyễn Khắc Viện"], "answer": "C"}, {"type": "mcq", "level": "NB", "q": "Trong “Ông đồ”, hình ảnh nào gắn với sự xuất hiện của ông đồ?", "explain": "“Mỗi năm hoa đào nở, lại thấy ông đồ già” – hoa đào là tín hiệu của sự xuất hiện.", "options": ["A. Hoa sen mùa hạ", "B. Lá vàng mùa thu", "C. Mưa phùn mùa xuân", "D. Hoa đào nở mỗi dịp Tết đến"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Nỗi nhớ trong bài “Quê hương” của Tế Hanh là nỗi nhớ về đâu?", "explain": "Bài thơ là nỗi nhớ da diết về làng chài ven biển quê hương.", "options": ["A. Làng chài quê hương với biển cả, thuyền buồm", "B. Phố thị phồn hoa", "C. Mái trường xưa", "D. Chiến trường cũ"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Thơ cổ điển trung đại thường sử dụng ngôn ngữ và hình thức nào?", "explain": "Thơ cổ điển trung đại chủ yếu dùng chữ Hán, tuân thủ niêm luật Đường luật nghiêm ngặt.", "options": ["A. Chữ Nôm tự do", "B. Chữ Hán với niêm luật chặt chẽ", "C. Chữ Quốc ngữ hiện đại", "D. Thể thơ tự do"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Nhân vật trữ tình trong “Nhớ rừng” xưng là gì, thể hiện điều gì?", "explain": "Đại từ “ta” thể hiện cái tôi kiêu hãnh, đầy uất hận của con hổ – cũng là của nhà thơ.", "options": ["A. Xưng “tôi” rụt rè", "B. Xưng “chúng ta” tập thể", "C. Xưng “ta” – cái tôi đầy kiêu hãnh, uất hận", "D. Không xưng hô gì"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Tế Hanh xa quê đã lâu, nhưng trong tâm trí ông, làng chài vẫn hiện lên rõ mồn một: con thuyền ra khơi buổi sớm, cánh buồm no gió, mùi nồng mặn của biển.”\nĐoạn văn cho thấy tình cảm nào của nhà thơ?", "explain": "Các hình ảnh thân thuộc hiện lên rõ nét cho thấy nỗi nhớ quê da diết.", "options": ["A. Nỗi sợ biển cả", "B. Niềm vui xa quê", "C. Sự thờ ơ với quê hương", "D. Nỗi nhớ quê hương da diết, sâu nặng"], "answer": "D"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Thiên nhiên trong thơ mới không còn là thiên nhiên ước lệ mà rất gần gũi, sinh động: cánh đồng, dòng sông, biển cả đều mang hồn người. Nhà thơ gửi vào đó nỗi niềm riêng của mình.”\nXét tính đúng sai:", "statements": ["a) Thiên nhiên trong thơ mới gần gũi, sinh động.", "b) Thiên nhiên thơ mới hoàn toàn ước lệ như thơ cổ điển.", "c) Nhà thơ gửi nỗi niềm riêng vào cảnh vật."], "answers": ["T", "S", "T"], "explain": "a) Đúng. b) Sai – thơ mới thoát khỏi ước lệ. c) Đúng – cảnh vật mang tâm trạng con người."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Thế Lữ thổi vào con hổ một tâm hồn con người: nó biết nhớ, biết hận, biết khao khát. Tiếng gầm của nó vì thế mà lay động lòng người đọc đương thời.”\nTheo đoạn văn, vì sao “Nhớ rừng” lay động người đọc?", "explain": "Nghệ thuật nhân hóa khiến con hổ mang tâm hồn con người, nói hộ khát vọng tự do.", "options": ["A. Vì con hổ được nhân hóa, nói hộ khát vọng của con người", "B. Vì tả hổ rất giống thật", "C. Vì vần điệu vui nhộn", "D. Vì ca ngợi vườn bách thú"], "answer": "A"}, {"type": "short", "level": "VD", "q": "Hình ảnh “ông đồ già” trong bài thơ tượng trưng cho điều gì?", "answer": "Một nét đẹp văn hóa truyền thống đang phai tàn trước sự đổi thay của thời đại.", "explain": "Chấm theo ý: chỉ ra ý nghĩa biểu tượng – nét đẹp văn hóa truyền thống mai một."}, {"type": "short", "level": "VD", "q": "Kể tên một biện pháp tu từ thường gặp trong thơ mới và nêu tác dụng của nó.", "answer": "Ví dụ: so sánh, nhân hóa – làm cho hình ảnh thơ sinh động, gợi cảm, bộc lộ rõ tâm trạng của nhân vật trữ tình.", "explain": "Chấm theo ý: nêu đúng tên biện pháp tu từ và tác dụng phù hợp."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Tên thật của nhà thơ Thế Lữ là gì?", "explain": "Thế Lữ tên thật là Nguyễn Thứ Lễ.", "options": ["A. Nguyễn Khắc Viện", "B. Nguyễn Thứ Lễ", "C. Trần Dần", "D. Nguyễn Đình Thi"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Sự đối lập nào là trung tâm của bài “Nhớ rừng”?", "explain": "Đối lập quá khứ – hiện tại làm nổi bật bi kịch mất tự do của con hổ.", "options": ["A. Ngày và đêm", "B. Mùa xuân và mùa đông", "C. Quá khứ oai hùng nơi rừng xanh với hiện tại tù túng trong cũi sắt", "D. Thành thị và nông thôn"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Sự đối lập xưa – nay trong “Ông đồ” được thể hiện qua chi tiết nào?", "explain": "Đối lập xưa đông vui – nay vắng vẻ gợi niềm tiếc nuối một thời đã qua.", "options": ["A. Xưa nghèo nay giàu", "B. Xưa trẻ nay già", "C. Xưa ở quê nay lên phố", "D. Xưa đông người xin chữ, nay vắng vẻ, lá vàng rơi trên giấy"], "answer": "D"}, {"type": "mcq", "level": "NB", "q": "Dòng thơ nào sau đây thuộc bài “Ông đồ”?", "explain": "Hai câu thơ mở đầu bài “Ông đồ” rất nổi tiếng, các đáp án còn lại thuộc bài khác.", "options": ["A. “Mỗi năm hoa đào nở, / Lại thấy ông đồ già”", "B. “Gặm một khối căm hờn trong cũi sắt”", "C. “Làng tôi ở vốn làm nghề chài lưới”", "D. “Nay xa cách lòng tôi luôn tưởng nhớ”"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Vì sao thơ mới được gọi là một “cuộc cách mạng” trong thi ca?", "explain": "Thơ mới đổi mới toàn diện cả hình thức và nội dung, xứng đáng là cuộc cách mạng thi ca.", "options": ["A. Vì nó cấm dùng chữ Hán", "B. Vì nó phá bỏ lối thơ cũ, đưa cái tôi cá nhân và ngôn ngữ đời thường vào thơ", "C. Vì nó chỉ viết về chiến tranh", "D. Vì nó do người Pháp sáng tạo"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Thơ mới có nhạc điệu tự do: lúc khoan thai như lời tâm sự, lúc dồn dập như tiếng gầm. Nhạc điệu ấy hòa quyện với cảm xúc, khiến bài thơ như một bản nhạc.”\nTheo đoạn văn, nhạc điệu thơ mới có đặc điểm gì?", "explain": "Nhạc điệu thơ mới tự do, phóng khoáng, gắn chặt với diễn biến cảm xúc.", "options": ["A. Gò bó theo niêm luật", "B. Đơn điệu, đều đều", "C. Tự do, biến đổi theo cảm xúc của bài thơ", "D. Không có nhạc tính"], "answer": "C"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Thế Lữ là người mở đầu phong trào Thơ mới. Ông còn là nhà văn, nhà hoạt động sân khấu tài năng, có nhiều đóng góp cho văn học Việt Nam hiện đại.”\nXét tính đúng sai:", "statements": ["a) Thế Lữ là người mở đầu phong trào Thơ mới.", "b) Thế Lữ chỉ sáng tác thơ, không hoạt động lĩnh vực khác.", "c) Thế Lữ có nhiều đóng góp cho văn học Việt Nam hiện đại."], "answers": ["T", "S", "T"], "explain": "a) Đúng – với bài “Nhớ rừng”. b) Sai – ông còn viết văn, làm sân khấu. c) Đúng."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Ước vọng trong thơ mới không phải là mơ mộng viển vông, mà là khát vọng chính đáng: tự do, tình yêu quê hương, một tương lai tươi sáng hơn.”\nTheo đoạn văn, ước vọng trong thơ mới là gì?", "explain": "Ước vọng trong thơ mới gắn với những giá trị cao đẹp, chính đáng.", "options": ["A. Mơ mộng viển vông", "B. Tham vọng quyền lực", "C. Ước muốn giàu sang", "D. Khát vọng chính đáng về tự do, quê hương, tương lai"], "answer": "D"}, {"type": "short", "level": "VD", "q": "Theo em, “tin yêu và ước vọng” trong nhan đề Bài 7 được thể hiện qua các bài thơ đã học như thế nào?", "answer": "Tin yêu cuộc sống qua tình yêu quê hương (“Quê hương”); ước vọng tự do, tương lai tươi sáng qua khát khao của con hổ (“Nhớ rừng”) và niềm tiếc nhớ giá trị văn hóa (“Ông đồ”).", "explain": "Chấm theo ý: liên hệ được nhan đề bài học với nội dung các bài thơ."}, {"type": "short", "level": "VD", "q": "Viết một câu văn nêu cảm nhận của em về hình ảnh con hổ trong “Nhớ rừng”.", "answer": "Ví dụ: Con hổ hiện lên vừa oai hùng vừa bi tráng, là biểu tượng đẹp cho khát vọng tự do của con người.", "explain": "Chấm theo ý: câu văn hoàn chỉnh, có cảm nhận riêng, diễn đạt trong sáng."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Nhà thơ Tế Hanh nổi tiếng với mảng đề tài nào?", "explain": "Tế Hanh được mệnh danh là nhà thơ của quê hương, của biển cả và tuổi thơ.", "options": ["A. Quê hương, biển cả và tuổi thơ", "B. Chiến tranh cách mạng", "C. Tình yêu đôi lứa", "D. Triết lí nhân sinh"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Ngôn ngữ thơ mới có đặc điểm gì?", "explain": "Thơ mới dùng ngôn ngữ giản dị, trong sáng, gần gũi với đời sống.", "options": ["A. Cầu kì, ước lệ như thơ cổ", "B. Giản dị, trong sáng, gần với lời nói hằng ngày", "C. Khô khan như văn xuôi", "D. Chỉ dùng từ Hán Việt"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Biện pháp tu từ nào được dùng nhiều trong “Nhớ rừng” để khắc họa con hổ?", "explain": "Nhân hóa và so sánh là hai biện pháp nổi bật khắc họa hình tượng con hổ.", "options": ["A. Nói giảm nói tránh", "B. Chơi chữ", "C. Nhân hóa và so sánh", "D. Hoán dụ duy nhất"], "answer": "C"}, {"type": "mcq", "level": "NB", "q": "Bài thơ “Ông đồ” ra đời trong bối cảnh xã hội nào?", "explain": "Đầu thế kỉ XX, chữ Quốc ngữ thay thế chữ Nho, nghề viết chữ Nho lụi tàn.", "options": ["A. Thời phong kiến thịnh trị", "B. Thời kì đổi mới 1986", "C. Thời chiến tranh chống Mỹ", "D. Xã hội Việt Nam đầu thế kỉ XX, chữ Nho dần mai một"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Cảm hứng chủ đạo của chùm thơ trong Bài 7 là gì?", "explain": "Ba bài thơ cùng chung cảm hứng tin yêu cuộc sống và ước vọng đẹp đẽ.", "options": ["A. Tin yêu cuộc sống, quê hương và ước vọng tương lai", "B. Bi quan, chán nản", "C. Căm thù giặc ngoại xâm", "D. Ca ngợi chiến thắng"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Từ ngữ trong thơ mới giàu hình ảnh: từ láy gợi tả dáng vẻ, âm thanh; từ ngữ gợi cảm diễn tả tinh tế tâm trạng. Nhờ vậy, mỗi bài thơ như một bức tranh có hồn.”\nTheo đoạn văn, từ ngữ thơ mới có tác dụng gì?", "explain": "Từ ngữ giàu hình ảnh, gợi cảm giúp bài thơ sinh động như bức tranh có hồn.", "options": ["A. Làm bài thơ khó hiểu", "B. Làm cho hình ảnh thơ sinh động, diễn tả tinh tế tâm trạng", "C. Chỉ để trang trí", "D. Không có tác dụng gì"], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Bài “Ông đồ” sử dụng nghệ thuật đối lập xưa – nay rất thành công. Khổ thơ đầu rộn ràng bao nhiêu, khổ thơ cuối vắng vẻ bấy nhiêu, gợi niềm tiếc nuối sâu sắc.”\nXét tính đúng sai:", "statements": ["a) “Ông đồ” sử dụng nghệ thuật đối lập xưa – nay.", "b) Sự đối lập trong bài thơ không có tác dụng gì.", "c) Đối lập xưa – nay gợi niềm tiếc nuối."], "answers": ["T", "S", "T"], "explain": "a) Đúng. b) Sai – đối lập làm nổi bật sự đổi thay. c) Đúng – theo đoạn văn."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Ước vọng tự do trong “Nhớ rừng”, niềm tiếc nhớ trong “Ông đồ”, tình yêu quê hương trong “Quê hương” – tất cả đều là những tình cảm cao đẹp, trong sáng của con người.”\nĐoạn văn khẳng định điều gì?", "explain": "Đoạn văn chỉ ra điểm chung: ngợi ca tình cảm cao đẹp, trong sáng.", "options": ["A. Các bài thơ đều bi quan", "B. Các bài thơ không liên quan nhau", "C. Các bài thơ cùng ngợi ca những tình cảm cao đẹp của con người", "D. Các bài thơ chỉ tả cảnh"], "answer": "C"}, {"type": "short", "level": "VD", "q": "Nêu tên tác giả và tác phẩm được xem là mở đầu phong trào Thơ mới.", "answer": "“Nhớ rừng” – Thế Lữ.", "explain": "Chấm theo ý: nêu đúng cả tên tác phẩm và tác giả."}, {"type": "short", "level": "VD", "q": "Em hiểu thế nào về hình ảnh “cũi sắt” trong “Nhớ rừng”?", "answer": "“Cũi sắt” là ẩn dụ cho cảnh tù túng, mất tự do – của con hổ và của người dân mất nước.", "explain": "Chấm theo ý: chỉ ra được ý nghĩa ẩn dụ của hình ảnh."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Thể loại chính của ba tác phẩm trong Bài 7 là gì?", "explain": "Cả ba tác phẩm “Nhớ rừng”, “Ông đồ”, “Quê hương” đều là thơ trữ tình.", "options": ["A. Truyện ngắn", "B. Tùy bút", "C. Kịch", "D. Thơ trữ tình"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Báo chí chữ Quốc ngữ có vai trò gì đối với phong trào Thơ mới?", "explain": "Báo chí chữ Quốc ngữ là nơi đăng tải và lan tỏa thơ mới rộng rãi.", "options": ["A. Là diễn đàn đăng tải, lan tỏa thơ mới đến công chúng", "B. Cấm đoán thơ mới", "C. Không liên quan", "D. Chỉ đăng thơ cổ điển"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Nỗi nhớ quê trong “Quê hương” được gợi lên qua những hình ảnh nào?", "explain": "Làng chài ven biển với thuyền, buồm, biển là hình ảnh trung tâm của bài thơ.", "options": ["A. Phố xá, đèn điện", "B. Thuyền, buồm, biển, người dân chài", "C. Ruộng lúa, trâu bò", "D. Núi rừng, suối reo"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Nhân vật trữ tình trong thơ mới thường bộc lộ điều gì?", "explain": "Thơ mới bộc lộ trực tiếp tình cảm, tâm trạng riêng tư của nhà thơ.", "options": ["A. Chủ trương chính trị", "B. Kiến thức khoa học", "C. Tình cảm, tâm trạng riêng tư, chân thành", "D. Lời răn dạy đạo đức"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Chi tiết “lá vàng rơi trên giấy” trong “Ông đồ” gợi cảm giác gì?", "explain": "Lá vàng rơi gợi sự tàn phai, vắng vẻ, phù hợp với nỗi buồn của ông đồ.", "options": ["A. Rộn ràng, náo nhiệt", "B. Tươi vui, hy vọng", "C. Bình yên, no đủ", "D. Vắng vẻ, tàn phai, buồn bã"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Cái tôi trong thơ mới không phải là sự ích kỉ, mà là sự chân thành: dám sống thật với cảm xúc của mình, dám nói lên nỗi niềm riêng mà bao người cùng chia sẻ.”\nTheo đoạn văn, cái tôi trong thơ mới có ý nghĩa gì?", "explain": "Cái tôi chân thành nói hộ nỗi niềm của nhiều người nên dễ được đồng cảm.", "options": ["A. Là sự chân thành, nói lên nỗi niềm chung của nhiều người", "B. Là sự ích kỉ cá nhân", "C. Là sự khoe khoang", "D. Không có ý nghĩa gì"], "answer": "A"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Tế Hanh là nhà thơ của quê hương. Thơ ông giản dị, trong sáng, đậm chất miền biển. Bài “Quê hương” là một trong những bài thơ hay nhất viết về tình yêu quê hương.”\nXét tính đúng sai:", "statements": ["a) Tế Hanh được gọi là nhà thơ của quê hương.", "b) Thơ Tế Hanh cầu kì, khó hiểu.", "c) “Quê hương” là bài thơ tiêu biểu về tình yêu quê hương."], "answers": ["T", "S", "T"], "explain": "a) Đúng. b) Sai – thơ ông giản dị, trong sáng. c) Đúng."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Tin yêu cuộc sống không phải là lạc quan mù quáng, mà là dù trong hoàn cảnh nào vẫn giữ được niềm tin vào những giá trị tốt đẹp và nỗ lực vươn lên.”\nTheo đoạn văn, tin yêu cuộc sống là gì?", "explain": "Tin yêu là niềm tin có cơ sở, gắn với nỗ lực vươn lên trong thực tế.", "options": ["A. Lạc quan mù quáng", "B. Giữ niềm tin vào giá trị tốt đẹp và nỗ lực vươn lên", "C. Phớt lờ khó khăn", "D. Chấp nhận số phận"], "answer": "B"}, {"type": "short", "level": "VD", "q": "Phân biệt “cái tôi” trong thơ mới với “cái ta” trong thơ cổ điển.", "answer": "Cái tôi: cá nhân, riêng tư, chân thành; cái ta: chung chung, ước lệ, theo khuôn mẫu.", "explain": "Chấm theo ý: chỉ ra được sự khác nhau cơ bản giữa hai quan niệm."}, {"type": "short", "level": "VD", "q": "Nêu một chi tiết trong “Quê hương” khiến em xúc động và lí giải ngắn gọn vì sao.", "answer": "Học sinh tự chọn chi tiết (ví dụ: cánh buồm, con thuyền, người dân chài...) và lí giải cảm xúc của mình.", "explain": "Chấm theo ý: chọn được chi tiết cụ thể, lí giải chân thành, hợp lí."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Bài thơ “Quê hương” của Tế Hanh viết về đề tài gì?", "explain": "Bài thơ là tiếng lòng yêu quê hương tha thiết của người con làng chài.", "options": ["A. Tình bạn học trò", "B. Cảnh thành phố", "C. Tình yêu quê hương làng chài ven biển", "D. Cuộc kháng chiến"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Nhạc điệu thơ mới có đặc điểm gì?", "explain": "Thơ mới phá vỡ niêm luật, có nhạc điệu tự do, phóng khoáng.", "options": ["A. Gò bó theo niêm luật", "B. Đơn điệu, đều đều", "C. Không có vần điệu", "D. Tự do, phóng khoáng, giàu nhạc tính"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Từ “căm hờn” trong câu thơ “Gặm một khối căm hờn trong cũi sắt” thể hiện tâm trạng gì?", "explain": "“Căm hờn” diễn tả nỗi uất hận, phẫn nộ dồn nén của con hổ mất tự do.", "options": ["A. Uất hận, phẫn nộ bị dồn nén", "B. Vui sướng", "C. Hối hận", "D. Thờ ơ"], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Tác phẩm nào sau đây KHÔNG thuộc phong trào Thơ mới?", "explain": "Truyện Kiều là tác phẩm của Nguyễn Du, thuộc văn học trung đại.", "options": ["A. “Nhớ rừng” của Thế Lữ", "B. Truyện Kiều của Nguyễn Du", "C. “Ông đồ” của Vũ Đình Liên", "D. “Quê hương” của Tế Hanh"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Hình ảnh ông đồ “viết chữ Nho” tượng trưng cho giá trị nào?", "explain": "Chữ Nho, tục xin chữ đầu năm là nét đẹp văn hóa truyền thống.", "options": ["A. Sự giàu có vật chất", "B. Quyền lực phong kiến", "C. Nét đẹp văn hóa truyền thống của dân tộc", "D. Khoa học hiện đại"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Ước mơ trong thơ mới luôn gắn với hiện thực: con hổ mơ rừng xanh tự do, nhà thơ mơ quê hương thanh bình. Đó là những ước mơ chính đáng, cao đẹp.”\nTheo đoạn văn, ước mơ trong thơ mới có đặc điểm gì?", "explain": "Ước mơ trong thơ mới bắt nguồn từ hiện thực và hướng tới giá trị tốt đẹp.", "options": ["A. Viển vông, xa rời thực tế", "B. Ích kỉ, vụ lợi", "C. Bi quan, tuyệt vọng", "D. Gắn với hiện thực, chính đáng và cao đẹp"], "answer": "D"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Nhạc điệu là linh hồn của thơ. Thơ mới thành công một phần lớn nhờ nhạc điệu tự do, khi khoan thai, khi dồn dập, hòa quyện với cảm xúc của bài thơ.”\nXét tính đúng sai:", "statements": ["a) Nhạc điệu có vai trò quan trọng trong thơ.", "b) Thơ mới không chú trọng nhạc điệu.", "c) Nhạc điệu thơ mới biến đổi theo cảm xúc."], "answers": ["T", "S", "T"], "explain": "a) Đúng – nhạc điệu là linh hồn của thơ. b) Sai – thơ mới rất chú trọng nhạc điệu. c) Đúng."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Thế Lữ không chỉ là nhà thơ mà còn là người dựng nền cho sân khấu Việt Nam hiện đại. Ông là nghệ sĩ đa tài, suốt đời cống hiến cho nghệ thuật.”\nĐoạn văn đánh giá Thế Lữ như thế nào?", "explain": "Đoạn văn khẳng định Thế Lữ là nghệ sĩ đa tài với nhiều cống hiến.", "options": ["A. Là nghệ sĩ đa tài, có nhiều cống hiến cho nghệ thuật", "B. Chỉ là nhà thơ bình thường", "C. Không có đóng góp gì", "D. Chỉ hoạt động sân khấu"], "answer": "A"}, {"type": "short", "level": "VD", "q": "Vì sao người đọc dễ đồng cảm với cái tôi trữ tình trong thơ mới?", "answer": "Vì nhà thơ bộc lộ tình cảm chân thành, riêng tư như lời tâm sự, gần gũi với tâm hồn người đọc.", "explain": "Chấm theo ý: chỉ ra được sự chân thành, gần gũi của cái tôi trữ tình."}, {"type": "short", "level": "VD", "q": "Nêu hai từ láy (hoặc từ gợi hình ảnh) em ấn tượng trong thơ Bài 7 và cho biết tác dụng của chúng.", "answer": "Học sinh tự nêu (ví dụ: các từ gợi hình, gợi cảm trong ba bài thơ) và nêu tác dụng làm hình ảnh sinh động, gợi cảm.", "explain": "Chấm theo ý: nêu được từ ngữ cụ thể, tác dụng hợp lí."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phong trào Thơ mới gắn liền với sự phát triển của loại hình báo chí nào?", "explain": "Báo chí chữ Quốc ngữ phát triển là điều kiện lan tỏa thơ mới.", "options": ["A. Báo chữ Hán", "B. Báo chí chữ Quốc ngữ", "C. Báo tiếng Pháp duy nhất", "D. Không gắn với báo chí"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Trong “Nhớ rừng”, rừng xanh tượng trưng cho điều gì?", "explain": "Rừng xanh là không gian của quá khứ tự do, oai hùng của con hổ.", "options": ["A. Nơi nguy hiểm", "B. Sự giàu có", "C. Quá khứ tự do, oai hùng đã mất", "D. Chốn tu hành"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Câu thơ “Nay xa cách lòng tôi luôn tưởng nhớ” bộc lộ tình cảm gì?", "explain": "Câu thơ trực tiếp bộc lộ nỗi nhớ quê da diết của Tế Hanh.", "options": ["A. Nỗi sợ hãi", "B. Niềm vui sướng", "C. Sự giận dữ", "D. Nỗi nhớ quê hương da diết của người con xa xứ"], "answer": "D"}, {"type": "mcq", "level": "NB", "q": "Ai là tác giả của bài thơ “Quê hương”?", "explain": "“Quê hương” là bài thơ nổi tiếng của Tế Hanh.", "options": ["A. Tế Hanh", "B. Thế Lữ", "C. Vũ Đình Liên", "D. Nguyễn Khắc Viện"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Điểm chung về cảm hứng của ba bài thơ trong Bài 7 là gì?", "explain": "Cả ba bài thơ cùng chung cảm hứng tin yêu cuộc sống và ước vọng.", "options": ["A. Tâm trạng bi quan tuyệt vọng", "B. Tình yêu tha thiết với quê hương, cuộc sống và khát vọng đẹp", "C. Thái độ thờ ơ với đời", "D. Chỉ ca ngợi thiên nhiên"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Đọc thơ mới, em nên đọc thành tiếng, đọc diễn cảm. Nhịp thơ lúc nhanh lúc chậm sẽ dẫn dắt cảm xúc của em đi theo tâm trạng của nhà thơ.”\nĐoạn văn khuyên người đọc thơ như thế nào?", "explain": "Đọc diễn cảm giúp cảm nhận nhạc điệu và hòa vào cảm xúc bài thơ.", "options": ["A. Đọc thầm thật nhanh", "B. Chỉ đọc lướt qua", "C. Đọc thành tiếng, đọc diễn cảm để cảm nhận nhịp điệu và cảm xúc", "D. Không cần đọc kĩ"], "answer": "C"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Nghệ thuật đối lập là thế mạnh của “Ông đồ”: xưa đông vui – nay vắng vẻ; xưa rực rỡ – nay tàn phai. Chính sự tương phản ấy làm nên sức ám ảnh của bài thơ.”\nXét tính đúng sai:", "statements": ["a) “Ông đồ” sử dụng nghệ thuật đối lập.", "b) Đối lập trong bài thơ là xưa – nay.", "c) Sự đối lập không tạo ấn tượng gì."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – đối lập tạo sức ám ảnh."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Niềm tin trong thơ mới không phải là sự ngây thơ, mà là thái độ sống tích cực: dù thực tại có phũ phàng, con người vẫn hướng về những giá trị tốt đẹp.”\nTheo đoạn văn, niềm tin trong thơ mới là gì?", "explain": "Niềm tin trong thơ mới là thái độ sống tích cực, có ý thức.", "options": ["A. Sự ngây thơ", "B. Sự trốn tránh thực tại", "C. Sự cam chịu", "D. Thái độ sống tích cực, hướng về giá trị tốt đẹp"], "answer": "D"}, {"type": "short", "level": "VD", "q": "Giải thích nhan đề “Tin yêu và ước vọng” của Bài 7.", "answer": "Tin yêu: niềm tin yêu cuộc sống, quê hương; ước vọng: khát vọng tự do, tương lai tươi sáng – thể hiện qua các bài thơ trong bài học.", "explain": "Chấm theo ý: giải thích được hai vế của nhan đề và liên hệ với bài học."}, {"type": "short", "level": "VD", "q": "Em rút ra bài học gì cho bản thân từ chùm thơ trong Bài 7?", "answer": "Học sinh tự nêu (ví dụ: biết yêu quê hương, giữ niềm tin, nuôi dưỡng ước mơ đẹp...), lí giải ngắn gọn.", "explain": "Chấm theo ý: bài học cụ thể, chân thành, liên hệ được với bản thân."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "TH", "q": "Vì sao “Nhớ rừng” có sức lay động mạnh mẽ với người đọc đương thời?", "explain": "Bài thơ chạm đến khát vọng tự do chung của người dân mất nước nên lay động lòng người.", "options": ["A. Vì tiếng gầm của con hổ nói hộ nỗi khát khao tự do của người dân mất nước", "B. Vì tả hổ rất giống thật", "C. Vì vần điệu vui nhộn", "D. Vì ca ngợi vườn bách thú"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Nghệ thuật đối lập trong “Ông đồ” có tác dụng gì?", "explain": "Đối lập xưa – nay làm nổi bật sự đổi thay và gợi niềm tiếc nuối.", "options": ["A. Gây cười", "B. Làm nổi bật sự đổi thay, gợi niềm tiếc nuối", "C. Làm rối ý thơ", "D. Không có tác dụng"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Trình tự cảm xúc trong bài “Ông đồ” diễn biến như thế nào?", "explain": "Bài thơ đi từ không khí đông vui xưa đến vắng vẻ nay, kết lại bằng niềm tiếc nuối.", "options": ["A. Buồn – vui – buồn", "B. Vui suốt bài", "C. Tưng bừng xưa – vắng vẻ nay – tiếc nuối", "D. Buồn suốt bài"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Hình ảnh “cánh buồm” trong “Quê hương” được ví với gì?", "explain": "“Cánh buồm giương to như mảnh hồn làng” – hình ảnh ví von độc đáo, giàu ý nghĩa.", "options": ["A. Cánh chim", "B. Ngọn lửa", "C. Đám mây", "D. Mảnh hồn làng"], "answer": "D"}, {"type": "mcq", "level": "NB", "q": "Yếu tố nào giúp thơ mới đến gần hơn với đời sống?", "explain": "Chính sự giản dị, gần gũi, chân thành đã đưa thơ mới đến với đông đảo người đọc.", "options": ["A. Ngôn ngữ giản dị, hình ảnh gần gũi, cảm xúc chân thành", "B. Dùng nhiều điển tích", "C. Viết bằng chữ Hán", "D. Niêm luật khắt khe"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Viết đoạn văn ghi lại cảm xúc về một bài thơ, em đừng kể lể dài dòng nội dung. Hãy chọn 2 – 3 hình ảnh gây ấn tượng nhất, trích dẫn rồi lí giải vì sao em xúc động.”\nĐoạn văn hướng dẫn cách viết đoạn văn cảm xúc như thế nào?", "explain": "Trọng tâm là bộc lộ cảm xúc riêng qua hình ảnh tiêu biểu có dẫn chứng.", "options": ["A. Kể lại toàn bộ nội dung", "B. Chọn hình ảnh tiêu biểu, trích dẫn và lí giải cảm xúc", "C. Chép thuộc bài thơ", "D. Viết thật dài"], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Tế Hanh xa quê nhưng quê hương luôn ở trong ông. Mỗi hình ảnh làng chài trong thơ ông đều thấm đẫm nỗi nhớ: con thuyền, cánh buồm, vị mặn mòi của biển.”\nXét tính đúng sai:", "statements": ["a) Tế Hanh viết nhiều về quê hương làng chài.", "b) Hình ảnh thơ Tế Hanh thấm đẫm nỗi nhớ quê.", "c) Tế Hanh không có tình cảm với quê hương."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – trái với nội dung."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Ước vọng về tương lai trong thơ mới cũng là ước vọng của tuổi trẻ hôm nay: được sống tự do, được cống hiến, được thấy quê hương ngày càng tươi đẹp.”\nĐoạn văn liên hệ ước vọng trong thơ với đối tượng nào?", "explain": "Đoạn văn nối ước vọng trong thơ với khát vọng của tuổi trẻ hiện nay.", "options": ["A. Người già", "B. Trẻ em", "C. Tuổi trẻ hôm nay", "D. Không liên hệ ai"], "answer": "C"}, {"type": "short", "level": "VD", "q": "Nêu bố cục của đoạn văn ghi lại cảm xúc về một bài thơ.", "answer": "Mở đoạn (giới thiệu bài thơ và cảm xúc chung) – Thân đoạn (phân tích hình ảnh, chi tiết tiêu biểu kèm lí lẽ, dẫn chứng) – Kết đoạn (khẳng định cảm xúc, ý nghĩa).", "explain": "Chấm theo ý: nêu đủ ba phần và nội dung chính mỗi phần."}, {"type": "short", "level": "VD", "q": "Chọn một hình ảnh em thích nhất trong ba bài thơ của Bài 7 và nêu lí do.", "answer": "Học sinh tự chọn hình ảnh (ví dụ: con hổ, ông đồ, cánh buồm...) và nêu lí do chân thành.", "explain": "Chấm theo ý: hình ảnh cụ thể, lí do hợp lí, có cảm xúc riêng."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Ba tác phẩm thơ được học trong Bài 7 là những bài nào?", "explain": "Bài 7 học ba bài thơ: “Nhớ rừng” (Thế Lữ), “Ông đồ” (Vũ Đình Liên), “Quê hương” (Tế Hanh).", "options": ["A. “Nhớ rừng”, “Tây Tiến”, “Đồng chí”", "B. “Ông đồ”, “Quê hương”, “Bếp lửa”", "C. “Quê hương”, “Sang thu”, “Mùa xuân nho nhỏ”", "D. “Nhớ rừng”, “Ông đồ”, “Quê hương”"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Điểm mới nổi bật nhất của thơ mới về nội dung là gì?", "explain": "Đề cao cái tôi trữ tình là đổi mới lớn nhất về nội dung của thơ mới.", "options": ["A. Đề cao cái tôi cá nhân với cảm xúc chân thành", "B. Chỉ viết về vua chúa", "C. Trở lại khuôn mẫu cổ điển", "D. Bỏ hẳn tình cảm"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Vì sao học thơ mới giúp bồi đắp “tin yêu và ước vọng”?", "explain": "Thơ mới nuôi dưỡng tình yêu quê hương, niềm tin và khát vọng sống đẹp.", "options": ["A. Vì thơ dạy làm giàu", "B. Vì thơ khơi dậy tình yêu quê hương, niềm tin vào cuộc sống và khát vọng vươn lên", "C. Vì thơ toàn niềm vui", "D. Vì thơ dễ thuộc"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Thế Lữ được biết đến với vai trò nào trong phong trào Thơ mới?", "explain": "Với bài “Nhớ rừng”, Thế Lữ được xem là người mở đầu phong trào Thơ mới.", "options": ["A. Nhà văn hiện thực", "B. Nhà soạn kịch", "C. Nhà thơ mở đầu phong trào Thơ mới", "D. Nhà phê bình"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Khi đọc hiểu một bài thơ hiện đại, việc đầu tiên nên làm là gì?", "explain": "Đọc diễn cảm là bước đầu tiên để cảm nhận nhạc điệu và cảm xúc của bài thơ.", "options": ["A. Học thuộc lòng ngay", "B. Tra từ điển hết các từ", "C. Chép lại bài thơ", "D. Đọc diễn cảm nhiều lần để cảm nhận nhạc điệu, cảm xúc chung"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Ba bài thơ trong Bài 7 như ba nốt nhạc: “Nhớ rừng” hùng tráng, “Ông đồ” trầm lắng, “Quê hương” thiết tha. Mỗi bài một vẻ, nhưng đều ngân lên tình yêu cuộc sống.”\nĐoạn văn so sánh ba bài thơ với hình ảnh nào?", "explain": "So sánh với ba nốt nhạc nhấn mạnh sự đa dạng mà thống nhất về cảm hứng.", "options": ["A. Ba nốt nhạc với sắc thái khác nhau", "B. Ba bức tranh", "C. Ba dòng sông", "D. Ba ngọn núi"], "answer": "A"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Học thơ không chỉ để thuộc lòng. Quan trọng hơn là biết rung động trước cái đẹp, biết lí giải vì sao mình xúc động và biết diễn đạt cảm xúc ấy thành lời.”\nXét tính đúng sai:", "statements": ["a) Học thơ quan trọng nhất là thuộc lòng.", "b) Cần biết rung động trước cái đẹp của thơ.", "c) Cần biết diễn đạt cảm xúc của mình thành lời."], "answers": ["S", "T", "T"], "explain": "a) Sai – thuộc lòng chưa đủ. b), c) Đúng – đó là mục đích sâu xa của việc học thơ."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Tình yêu quê hương trong “Quê hương” không ồn ào mà thấm thía: nhớ con thuyền, nhớ cánh buồm, nhớ vị mặn của biển – nhớ những điều bình dị nhất.”\nTheo đoạn văn, tình yêu quê hương của Tế Hanh có đặc điểm gì?", "explain": "Tình yêu quê hương thể hiện qua nỗi nhớ những điều bình dị, thân thuộc.", "options": ["A. Ồn ào, phô trương", "B. Thấm thía qua những điều bình dị nhất", "C. Hời hợt, thoáng qua", "D. Chỉ là hoài niệm viển vông"], "answer": "B"}, {"type": "short", "level": "VD", "q": "Tóm tắt nội dung chính của Bài 7 trong 2 – 3 câu.", "answer": "Ví dụ: Bài 7 giới thiệu phong trào Thơ mới (1932 – 1945) với đổi mới về thể loại và cái tôi trữ tình, qua ba bài thơ tiêu biểu “Nhớ rừng”, “Ông đồ”, “Quê hương” cùng chung cảm hứng tin yêu cuộc sống và ước vọng tương lai.", "explain": "Chấm theo ý: nêu được phong trào Thơ mới, ba tác phẩm và cảm hứng chung."}, {"type": "short", "level": "VD", "q": "Em sẽ giới thiệu bài thơ nào trong Bài 7 cho bạn bè và vì sao?", "answer": "Học sinh tự chọn một bài thơ và nêu lí do thuyết phục (nội dung hay, hình ảnh đẹp, cảm xúc sâu sắc...).", "explain": "Chấm theo ý: chọn được bài thơ cụ thể, lí do rõ ràng, chân thành."}]}]}
