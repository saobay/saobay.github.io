{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Thơ Đường luật có nguồn gốc từ đâu?", "options": ["A. Thời nhà Đường (Trung Quốc), du nhập vào Việt Nam", "B. Thời nhà Lý của Việt Nam", "C. Nước Pháp thế kỉ XIX", "D. Sáng tạo của dân gian Việt Nam"], "answer": "A", "explain": "Thơ Đường luật có nguồn gốc từ thời nhà Đường (Trung Quốc), được thi nhân Việt Nam sử dụng thành công."}, {"type": "mcq", "level": "NB", "q": "Thể thơ Đường luật phổ biến nhất có cấu tạo như thế nào?", "options": ["A. 4 câu, mỗi câu 5 chữ", "B. 8 câu, mỗi câu 7 chữ (thất ngôn bát cú)", "C. 6 câu, mỗi câu 8 chữ", "D. 10 câu, mỗi câu 7 chữ"], "answer": "B", "explain": "Thể thất ngôn bát cú: 8 câu, mỗi câu 7 chữ là thể thơ Đường luật phổ biến nhất."}, {"type": "mcq", "level": "TH", "q": "Niêm trong thơ Đường luật là gì?", "options": ["A. Quy định gieo vần cuối câu", "B. Quy định đối nhau giữa các câu", "C. Sự dính kết về thanh điệu giữa các câu thơ", "D. Quy định số chữ trong câu"], "answer": "C", "explain": "Niêm là sự dính kết về thanh điệu (bằng – trắc) giữa các câu thơ."}, {"type": "mcq", "level": "TH", "q": "Trong thơ Đường luật thất ngôn bát cú, những cặp câu nào phải đối nhau?", "options": ["A. Câu 1 – 2 và câu 7 – 8", "B. Câu 2 – 3 và câu 6 – 7", "C. Câu 1 – 8 và câu 2 – 7", "D. Câu 3 – 4 và câu 5 – 6"], "answer": "D", "explain": "Câu 3 đối với câu 4, câu 5 đối với câu 6 về từ loại, ý nghĩa và cấu trúc."}, {"type": "mcq", "level": "VD", "q": "Vì sao thơ Đường luật được ví như khuôn vàng thước ngọc?", "options": ["A. Vì có hệ thống quy tắc nghiêm ngặt về niêm, luật, đối, vần và bố cục", "B. Vì chỉ vua chúa mới được làm thơ Đường luật", "C. Vì bài thơ nào cũng rất dài", "D. Vì thơ được viết bằng chữ vàng"], "answer": "A", "explain": "Hệ thống quy tắc chặt chẽ về niêm, luật, đối, vần, bố cục tạo nên vẻ đẹp khuôn mẫu cổ điển."}, {"type": "mcq", "level": "TH", "q": "Đoạn thơ (tự biên): Chiều thu nắng nhạt rải triền đê, Lá vàng lác đác rụng bên lề. Sáo diều vi vút t , "q": "Đặc điểm nổi bật của thơ Nôm là gì?", "options": ["A. Xa lạ với đời sống nhân dân", "B. Chỉ viết về đề tài cung đình", "C. Đậm hồn Việt, gần gũi lời ăn tiếng nói của nhân dân", "D. Không có giá trị nghệ thuật"], "answer": "C", "explain": "Thơ Nôm viết bằng chữ dân tộc nên đậm hồn Việt, gần gũi với nhân dân."}, {"type": "mcq", "level": "TH", "q": "Nhà thơ nào sau đây là bậc thầy của thơ Nôm?", "options": ["A. Tố Hữu", "B. Xuân Diệu", "C. Hồ Chí Minh", "D. Hồ Xuân Hương"], "answer": "D", "explain": "Hồ Xuân Hương là bà chúa thơ Nôm với phong cách độc đáo, táo bạo."}, {"type": "mcq", "level": "TH", "q": "Hai câu Thực (câu 3 – 4) trong bài thơ thất ngôn bát cú có nhiệm vụ gì?", "options": ["A. Triển khai, làm rõ ý của hai câu Đề", "B. Mở ra ý thơ", "C. Bàn luận, mở rộng ý thơ", "D. Kết lại ý thơ"], "answer": "A", "explain": "Phần Thực có nhiệm vụ triển khai, làm rõ ý đã mở ở phần Đề."}, {"type": "mcq", "level": "VD", "q": "Bài Thu điếu của Nguyễn Khuyến vừa là thơ Đường luật vừa là thơ Nôm vì sao?", "options": ["A. Vì bài thơ rất dài", "B. Vì bài thơ theo đúng niêm luật Đường luật nhưng viết bằng chữ Nôm", "C. Vì bài thơ không có vần", "D. Vì bài thơ viết bằng chữ Hán"], "answer": "B", "explain": "Thu điếu giữ đúng niêm luật Đường luật và được viết bằng chữ Nôm."}, {"type": "mcq", "level": "TH", "q": "Đoạn thơ (tự biên): Trăng thu vằng vặc sáng sân đình, Gió nhẹ đưa hương lúa chín xinh. Trẻ nhỏ nô đùa quanh gốc đa, Già làng kể chuyện thuở thanh bình. Nội dung chính của đoạn thơ trên là gì?", "options": ["A. Cảnh chiến trận ác liệt", "B. Nỗi buồn xa xứ", "C. Cảnh đêm thu yên bình, đầm ấm ở làng quê", "D. Cảnh lao động vất vả"], "answer": "C", "explain": "Trăng thu, trẻ nô đùa, già làng kể chuyện gợi đêm thu làng quê yên bình, đầm ấm."}, {"type": "mcq", "level": "NB", "q": "Đoạn thơ (tự biên): Trăng thu vằng vặc sáng sân đình, Gió nhẹ đưa hương lúa chín xinh. Từ vằng vặc trong câu Trăng thu vằng vặc sáng sân đình thuộc loại nào?", "options": ["A. Từ Hán Việt", "B. Từ tượng thanh", "C. Danh từ", "D. Từ láy tượng hình gợi tả ánh trăng sáng tỏ"], "answer": "D", "explain": "Vằng vặc là từ láy tượng hình gợi tả ánh trăng sáng trong, tỏ rõ."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn thơ: Trăng thu vằng vặc sáng sân đình, Gió nhẹ đưa hương lúa chín xinh. Trẻ nhỏ nô đùa quanh gốc đa, Già làng kể chuyện thuở thanh bình.", "statements": ["a) Đoạn thơ gợi tả không gian đêm thu làng quê yên bình.", "b) Hình ảnh già làng kể chuyện gợi tình làng nghĩa xóm đầm ấm.", "c) Đoạn thơ thể hiện tâm trạng buồn bã, bi quan."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đoạn thơ thể hiện không khí đầm ấm, yên vui."}, {"type": "short", "level": "TH", "q": "Kể tên hai thể thơ Nôm mà em biết.", "answer": "(mẫu) Lục bát, song thất lục bát (hoặc Đường luật viết bằng chữ Nôm)", "explain": "Chấm theo ý: kể đúng hai thể thơ viết bằng chữ Nôm."}, {"type": "short", "level": "VD", "q": "Vì sao thơ Nôm được coi là mang đậm hồn dân tộc Việt Nam?", "answer": "(mẫu) Vì viết bằng chữ Nôm – chữ viết của dân tộc, gần gũi lời ăn tiếng nói của nhân dân.", "explain": "Chấm theo ý: nêu được chữ Nôm là chữ dân tộc, thơ Nôm gần gũi đời sống nhân dân."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả của bài thơ Thu điếu là ai?", "options": ["A. Trần Nhân Tông", "B. Nguyễn Du", "C. Nguyễn Khuyến", "D. Hồ Xuân Hương"], "answer": "C", "explain": "Thu điếu là bài thơ nổi tiếng của Nguyễn Khuyến."}, {"type": "mcq", "level": "TH", "q": "Nguyễn Khuyến cáo quan về quê ở ẩn trong hoàn cảnh nào?", "options": ["A. Đất nước thái bình, thịnh trị", "B. Ông đỗ đạt, được triều đình trọng dụng", "C. Ông muốn đi du lịch khắp nơi", "D. Đất nước rơi vào tay thực dân Pháp, ông bất lực trước thời cuộc"], "answer": "D", "explain": "Trước cảnh nước mất, Nguyễn Khuyến cáo quan về quê, gửi nỗi niềm vào thơ."}, {"type": "mcq", "level": "TH", "q": "Không gian nghệ thuật của bài Thu điếu là gì?", "options": ["A. Cảnh ao thu làng quê Bắc Bộ yên tĩnh, trong trẻo", "B. Cảnh chiến trận hào hùng", "C. Cảnh cung đình lộng lẫy", "D. Cảnh biển khơi mênh mông"], "answer": "A", "explain": "Bài thơ vẽ nên bức tranh ao thu làng quê Bắc Bộ yên tĩnh đến trong vắt."}, {"type": "mcq", "level": "NB", "q": "Chùm thơ thu nổi tiếng của Nguyễn Khuyến gồm những bài nào?", "options": ["A. Cảnh thu, Thu hứng, Thu cúc", "B. Thu điếu, Thu ẩm, Thu vịnh", "C. Thu ca, Thu tình, Thu mộng", "D. Thu buồn, Thu nhớ, Thu sầu"], "answer": "B", "explain": "Chùm thơ thu của Nguyễn Khuyến gồm Thu điếu, Thu ẩm, Thu vịnh."}, {"type": "mcq", "level": "VD", "q": "Tâm trạng của thi nhân trong Thu điếu là gì?", "options": ["A. Vui tươi, phấn khởi", "B. Hào hùng, sục sôi", "C. Yêu thiên nhiên tha thiết mà man mác buồn, cô đơn trước thời cuộc", "D. Thờ ơ, lạnh nhạt"], "answer": "C", "explain": "Giữa cảnh thu tĩnh lặng là tâm trạng yêu thiên nhiên mà man mác buồn của thi nhân."}, {"type": "mcq", "level": "TH", "q": "Đoạn thơ (tự biên): Ao thu phẳng lặng tựa gương trong, Chiếc lá vàng rơi khẽ mặt dòng. Cần trúc buông câu ngồi lặng lẽ, Nghe lòng man mác nỗi buồn mong. Đoạn thơ trên học tập cảm hứng từ bài thơ nào?", "options": ["A. Thiên Trường vãn vọng", "B. Cảnh khuya", "C. Rằm tháng giêng", "D. Thu điếu"], "answer": "D", "explain": "Hình ảnh ao thu, cần trúc, nỗi buồn man mác gợi cảm hứng từ Thu điếu."}, {"type": "mcq", "level": "NB", "q": "Đoạn thơ (tự biên): Ao thu phẳng lặng tựa gương trong, Chiếc lá vàng rơi khẽ mặt dòng. Cần trúc buông câu ngồi lặng lẽ, Nghe lòng man mác nỗi buồn mong. Các tiếng cuối câu 1, 2, 4 (trong, dòng, mong) được gieo vần gì?", "options": ["A. Vần bằng (vần ong)", "B. Vần trắc", "C. Không gieo vần", "D. Vần lưng"], "answer": "A", "explain": "Các tiếng trong, dòng, mong đều thanh bằng và hiệp vần ong."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn thơ: Ao thu phẳng lặng tựa gương trong, Chiếc lá vàng rơi khẽ mặt dòng. Cần trúc buông câu ngồi lặng lẽ, Nghe lòng man mác nỗi buồn mong.", "statements": ["a) Đoạn thơ gợi tả cảnh ao thu tĩnh lặng.", "b) Tâm trạng trong đoạn thơ man mác buồn.", "c) Đoạn thơ tả cảnh mùa xuân."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đoạn thơ tả cảnh mùa thu."}, {"type": "short", "level": "TH", "q": "Nêu hai hình ảnh tiêu biểu trong bài Thu điếu.", "answer": "(mẫu) Ao thu lạnh lẽo nước trong veo; chiếc thuyền câu bé tẻo teo (hoặc sóng biếc, lá vàng, ngõ trúc...)", "explain": "Chấm theo ý: nêu đúng hai hình ảnh có trong bài thơ."}, {"type": "short", "level": "VD", "q": "Vì sao nói thiên nhiên trong Thu điếu là người bạn tri âm của thi nhân?", "answer": "(mẫu) Vì qua cảnh thu tĩnh lặng, nhà thơ gửi gắm tâm sự, nỗi buồn thời thế của mình.", "explain": "Chấm theo ý: thiên nhiên là nơi nhà thơ gửi gắm tình cảm, tâm sự."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả của bài thơ Thiên Trường vãn vọng là ai?", "options": ["A. Nguyễn Khuyến", "B. Trần Hưng Đạo", "C. Nguyễn Trãi", "D. Trần Nhân Tông"], "answer": "D", "explain": "Thiên Trường vãn vọng là bài thơ của Trần Nhân Tông."}, {"type": "mcq", "level": "NB", "q": "Trần Nhân Tông có những vai trò nào trong lịch sử, văn hóa dân tộc?", "options": ["A. Vừa là nhà vua anh minh, vừa là thiền sư, vừa là thi sĩ", "B. Chỉ là nhà quân sự", "C. Chỉ là nhà thơ", "D. Chỉ là thiền sư"], "answer": "A", "explain": "Trần Nhân Tông vừa là vua anh minh, vừa là sơ tổ Thiền phái Trúc Lâm, vừa là thi sĩ."}, {"type": "mcq", "level": "TH", "q": "Thiên Trường là địa danh gắn với điều gì?", "options": ["A. Kinh đô nhà Lý", "B. Quê hương của nhà Trần (phủ Thiên Trường)", "C. Chiến trường Điện Biên Phủ", "D. Cố đô Huế"], "answer": "B", "explain": "Thiên Trường là phủ quê hương của nhà Trần (nay thuộc Nam Định)."}, {"type": "mcq", "level": "TH", "q": "Bài thơ Thiên Trường vãn vọng ghi lại cảnh gì?", "options": ["A. Cảnh bình minh trên biển", "B. Cảnh đêm trăng", "C. Cảnh chiều ở phủ Thiên Trường: xóm thôn trong khói chiều bảng lảng", "D. Cảnh bão tố"], "answer": "C", "explain": "Bài thơ ghi lại cảnh chiều ở phủ Thiên Trường với khói chiều bảng lảng."}, {"type": "mcq", "level": "VD", "q": "Vẻ đẹp tâm hồn Trần Nhân Tông qua bài thơ là gì?", "options": ["A. Khát vọng quyền lực", "B. Nỗi buồn bi quan", "C. Lòng căm thù giặc", "D. Sự an nhiên, tự tại, chan hòa với thiên nhiên"], "answer": "D", "explain": "Bài thơ thể hiện tâm hồn an nhiên, tự tại, sống chan hòa với đất trời."}, {"type": "mcq", "level": "TH", "q": "Đoạn thơ (tự biên): Chiều buông khói tỏa khắp thôn trang, Tiếng sáo ai đưa vẳng xóm làng. Mây trắng lững lờ trôi đỉnh núi, Lòng ta thanh thản với mênh mang. Đoạn thơ trên gợi cảm hứng từ bài thơ nào của Trần Nhân Tông?", "options": ["A. Thiên Trường vãn vọng", "B. Thu điếu", "C. Cảnh khuya", "D. Bạn đến chơi nhà"], "answer": "A", "explain": "Khói chiều, xóm thôn, tâm trạng thanh thản gợi cảm hứng từ Thiên Trường vãn vọng."}, {"type": "mcq", "level": "NB", "q": "Đoạn thơ (tự biên): Chiều buông khói tỏa khắp thôn trang, Tiếng sáo ai đưa vẳng xóm làng. Cụm từ khói tỏa khắp thôn trang gợi tả thời điểm nào trong ngày?", "options": ["A. Buổi sáng sớm", "B. Buổi chiều tà", "C. Nửa đêm", "D. Giữa trưa"], "answer": "B", "explain": "Khói tỏa khắp thôn trang là hình ảnh quen thuộc của buổi chiều tà ở làng quê."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn thơ: Chiều buông khói tỏa khắp thôn trang, Tiếng sáo ai đưa vẳng xóm làng. Mây trắng lững lờ trôi đỉnh núi, Lòng ta thanh thản với mênh mang.", "statements": ["a) Đoạn thơ gợi tả cảnh chiều quê yên bình.", "b) Tâm trạng trong thơ là sự thanh thản, an nhiên.", "c) Đoạn thơ thể hiện không khí chiến trận khẩn trương."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đoạn thơ gợi cảnh chiều quê yên bình, thanh thản."}, {"type": "short", "level": "TH", "q": "Vãn vọng có nghĩa là gì?", "answer": "Ngắm cảnh chiều (vãn: chiều tối; vọng: ngắm nhìn)", "explain": "Chấm theo ý: vãn là chiều, vọng là ngắm nhìn → ngắm cảnh chiều."}, {"type": "short", "level": "VD", "q": "Nêu điểm chung về vẻ đẹp cổ điển trong Thu điếu và Thiên Trường vãn vọng.", "answer": "(mẫu) Thiên nhiên là người bạn tri âm, nơi thi nhân gửi gắm tâm sự.", "explain": "Chấm theo ý: cả hai bài đều lấy thiên nhiên làm bạn tri âm để gửi gắm tình cảm, suy tư."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Từ Hán Việt là gì?", "options": ["A. Từ có nguồn gốc Hán được Việt hóa về âm đọc", "B. Từ thuần Việt", "C. Từ mượn tiếng Anh", "D. Từ láy"], "answer": "A", "explain": "Từ Hán Việt là từ gốc Hán được Việt hóa về cách đọc."}, {"type": "mcq", "level": "NB", "q": "Từ nào sau đây là từ Hán Việt?", "options": ["A. Lom khom", "B. Vãn vọng", "C. Rào rào", "D. Lấp lánh"], "answer": "B", "explain": "Vãn vọng là từ Hán Việt; các từ còn lại là từ láy thuần Việt."}, {"type": "mcq", "level": "TH", "q": "Thu điếu có nghĩa là gì?", "options": ["A. Câu cá mùa xuân", "B. Ngắm trăng mùa thu", "C. Câu cá mùa thu", "D. Hái sen mùa hạ"], "answer": "C", "explain": "Thu là mùa thu, điếu là câu cá → Thu điếu là câu cá mùa thu."}, {"type": "mcq", "level": "TH", "q": "Vì sao thơ trung đại thường dùng nhiều từ Hán Việt?", "options": ["A. Để người đọc khó hiểu", "B. Để khoe chữ", "C. Để bài thơ dài hơn", "D. Vì từ Hán Việt mang sắc thái trang trọng, cổ kính, hợp với vẻ đẹp cổ điển"], "answer": "D", "explain": "Từ Hán Việt tạo sắc thái trang trọng, cổ kính cho thơ cổ điển."}, {"type": "mcq", "level": "VD", "q": "Khi gặp từ Hán Việt khó hiểu trong thơ cổ, em nên làm gì?", "options": ["A. Tra cứu từ điển, chú thích để hiểu đúng nghĩa", "B. Đoán mò cho qua", "C. Bỏ qua không cần hiểu", "D. Thay bằng từ khác"], "answer": "A", "explain": "Cần tra cứu nghĩa của từ Hán Việt để hiểu đúng, hiểu sâu ý thơ."}, {"type": "mcq", "level": "TH", "q": "Đoạn thơ (tự biên): Sương sớm giăng mờ trắng cành đào, Chim ca ríu rít đón xuân chào. Nắng mới chan hòa trên ngọn cỏ, Lòng người ấm áp biết là bao. Đoạn thơ trên gợi tả khung cảnh nào?", "options": ["A. Đêm thu tĩnh lặng", "B. Buổi sớm mùa xuân tươi vui", "C. Chiều đông giá rét", "D. Trưa hè oi ả"], "answer": "B", "explain": "Sương sớm, chim ca, nắng mới gợi buổi sớm mùa xuân tươi vui."}, {"type": "mcq", "level": "NB", "q": "Đoạn thơ (tự biên): Sương sớm giăng mờ trắng cành đào, Chim ca ríu rít đón xuân chào. Từ ríu rít trong đoạn thơ thuộc loại nào?", "options": ["A. Từ Hán Việt", "B. Từ tượng hình", "C. Từ tượng thanh", "D. Danh từ"], "answer": "C", "explain": "Ríu rít mô phỏng tiếng chim hót nên là từ tượng thanh."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn thơ: Sương sớm giăng mờ trắng cành đào, Chim ca ríu rít đón xuân chào. Nắng mới chan hòa trên ngọn cỏ, Lòng người ấm áp biết là bao.", "statements": ["a) Đoạn thơ gợi tả không khí mùa xuân tươi vui.", "b) Các tiếng cuối câu 1, 2, 4 (đào, chào, bao) hiệp vần với nhau.", "c) Đoạn thơ thể hiện tâm trạng buồn bã."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đoạn thơ thể hiện niềm vui, ấm áp."}, {"type": "short", "level": "TH", "q": "Giải nghĩa từ Hán Việt ngư ông.", "answer": "Ông câu cá (ngư: cá; ông: ông lão)", "explain": "Chấm theo ý: ngư là cá, ông là ông lão → ông lão câu cá."}, {"type": "short", "level": "NB", "q": "Kể tên hai từ Hán Việt thường gặp trong thơ cổ điển.", "answer": "(mẫu) thu điếu, vãn vọng (hoặc thiên trường, bạch vân, ngư ông...)", "explain": "Chấm theo ý: kể đúng hai từ Hán Việt."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Phép đối trong thơ Đường luật yêu cầu điều gì?", "options": ["A. Hai câu phải giống hệt nhau", "B. Hai câu đối nhau về từ loại, ý nghĩa, cấu trúc", "C. Hai câu phải khác vần nhau", "D. Hai câu phải có số chữ khác nhau"], "answer": "B", "explain": "Phép đối yêu cầu hai câu đối nhau về từ loại, ý nghĩa và cấu trúc."}, {"type": "mcq", "level": "TH", "q": "Vần trong thơ Đường luật thất ngôn bát cú thường được gieo ở đâu?", "options": ["A. Giữa các câu thơ", "B. Đầu các câu thơ", "C. Cuối các câu 1, 2, 4, 6, 8", "D. Cuối tất cả các câu"], "answer": "C", "explain": "Vần thường gieo ở cuối các câu 1, 2, 4, 6, 8 (vần chân)."}, {"type": "mcq", "level": "NB", "q": "Từ láy tẻo teo trong câu Một chiếc thuyền câu bé tẻo teo có tác dụng gì?", "options": ["A. Tả âm thanh", "B. Chỉ màu sắc", "C. Chỉ thời gian", "D. Gợi tả hình dáng chiếc thuyền nhỏ bé, cô đơn"], "answer": "D", "explain": "Tẻo teo là từ láy tượng hình gợi tả chiếc thuyền nhỏ bé, cô đơn giữa ao thu."}, {"type": "mcq", "level": "TH", "q": "Hai câu Kết (câu 7 – 8) trong bài thơ thất ngôn bát cú có nhiệm vụ gì?", "options": ["A. Kết lại ý thơ, để lại dư âm lắng đọng", "B. Mở ra ý thơ", "C. Triển khai ý thơ", "D. Bàn luận mở rộng"], "answer": "A", "explain": "Phần Kết khép lại ý thơ, để lại dư âm sâu lắng trong lòng người đọc."}, {"type": "mcq", "level": "VD", "q": "Vì sao Nguyễn Khuyến chọn gieo vần eo trong Thu điếu?", "options": ["A. Vì vần eo dễ gieo", "B. Vì âm hưởng vần eo gợi cảm giác thu hẹp, buồn man mác, hợp với tâm trạng", "C. Vì bắt buộc phải dùng vần eo", "D. Vì vần eo tạo không khí vui tươi"], "answer": "B", "explain": "Vần eo với âm hưởng thu hẹp gợi nỗi buồn man mác, rất hợp tâm trạng bài thơ."}, {"type": "mcq", "level": "TH", "q": "Đoạn thơ (tự biên): Bình minh núi biếc phủ sương êm, Dòng sông uốn lượn chảy êm đềm. Cò trắng nghiêng mình soi bóng nước, Gió chiều bảng lảng thoảng hương đêm. Biện pháp tu từ nào nổi bật trong câu Cò trắng nghiêng mình soi bóng nước?", "options": ["A. So sánh", "B. Ẩn dụ", "C. Nhân hóa", "D. Hoán dụ"], "answer": "C", "explain": "Cò trắng được miêu tả với hành động nghiêng mình soi bóng như con người."}, {"type": "mcq", "level": "NB", "q": "Đoạn thơ (tự biên): Bình minh núi biếc phủ sương êm, Dòng sông uốn lượn chảy êm đềm. Cò trắng nghiêng mình soi bóng nước, Gió chiều bảng lảng thoảng hương đêm. Đoạn thơ trên gợi tả khung cảnh nào?", "options": ["A. Đêm khuya", "B. Trưa hè", "C. Chiều đông", "D. Buổi sớm mai ở vùng sông núi"], "answer": "D", "explain": "Bình minh, sương êm, dòng sông gợi buổi sớm mai ở vùng sông núi."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn thơ: Bình minh núi biếc phủ sương êm, Dòng sông uốn lượn chảy êm đềm. Cò trắng nghiêng mình soi bóng nước, Gió chiều bảng lảng thoảng hương đêm.", "statements": ["a) Đoạn thơ gợi tả cảnh sông núi buổi sớm trong trẻo.", "b) Hình ảnh cò trắng được nhân hóa như con người.", "c) Đoạn thơ không có vần."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: các câu 1, 2, 4 hiệp vần êm."}, {"type": "short", "level": "TH", "q": "Nêu hai cặp câu phải đối nhau trong bài thơ thất ngôn bát cú.", "answer": "Câu 3 đối câu 4; câu 5 đối câu 6", "explain": "Chấm theo ý: nêu đúng hai cặp câu đối nhau."}, {"type": "short", "level": "VD", "q": "Vì sao phép đối được coi là vẻ đẹp đặc sắc của thơ Đường luật?", "answer": "(mẫu) Vì phép đối tạo sự cân xứng, hài hòa về ý và lời, làm câu thơ chặt chẽ, đẹp.", "explain": "Chấm theo ý: phép đối tạo cân xứng, hài hòa, chặt chẽ cho bài thơ."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "TH", "q": "Vẻ đẹp cổ điển trong thơ trung đại được hiểu là gì?", "options": ["A. Vẻ đẹp của đồ cổ", "B. Vẻ đẹp hiện đại, phá cách", "C. Vẻ đẹp của khuôn mẫu mực thước, hài hòa, tinh tế được hun đúc qua thời gian", "D. Vẻ đẹp của sự giàu sang"], "answer": "C", "explain": "Vẻ đẹp cổ điển là vẻ đẹp khuôn mẫu, mực thước, hài hòa, tinh tế."}, {"type": "mcq", "level": "TH", "q": "Điểm chung trong cách cảm nhận thiên nhiên của Nguyễn Khuyến và Trần Nhân Tông là gì?", "options": ["A. Chỉ tả cảnh để mua vui", "B. Thờ ơ với thiên nhiên", "C. Sợ hãi thiên nhiên", "D. Coi thiên nhiên là người bạn tri âm để gửi gắm tâm sự"], "answer": "D", "explain": "Cả hai thi nhân đều coi thiên nhiên là bạn tri âm để gửi gắm tâm sự."}, {"type": "mcq", "level": "NB", "q": "Tâm trạng của Trần Nhân Tông trong Thiên Trường vãn vọng là gì?", "options": ["A. An nhiên, tự tại, thanh thản", "B. Buồn bã, bi quan", "C. Giận dữ, căm thù", "D. Hoảng loạn, sợ hãi"], "answer": "A", "explain": "Bài thơ thể hiện tâm trạng an nhiên, tự tại, thanh thản của thi nhân."}, {"type": "mcq", "level": "TH", "q": "Chi tiết tiếng sáo mục đồng trong thơ Trần Nhân Tông gợi cảm giác gì?", "options": ["A. Khẩn trương, gấp gáp", "B. Thanh bình, thư thái của cuộc sống thôn quê", "C. Buồn thảm, tang thương", "D. Ồn ào, náo nhiệt"], "answer": "B", "explain": "Tiếng sáo mục đồng gợi cuộc sống thôn quê thanh bình, thư thái."}, {"type": "mcq", "level": "VD", "q": "Học thơ cổ điển giúp ích gì cho tâm hồn người đọc hôm nay?", "options": ["A. Không có ích gì", "B. Chỉ để khoe chữ", "C. Nuôi dưỡng tình yêu thiên nhiên, quê hương và sự tinh tế trong cảm xúc", "D. Để trở nên cổ hủ"], "answer": "C", "explain": "Thơ cổ điển nuôi dưỡng tình yêu thiên nhiên, quê hương và cảm xúc tinh tế."}, {"type": "mcq", "level": "TH", "q": "Đoạn thơ (tự biên): Hoàng hôn buông xuống mặt hồ sen, Gió nhẹ mơn man khẽ lá chen. Chuồn chuồn đậu khẽ trên cành liễu, Lòng người chợt thấy hết ưu phiền. Đoạn thơ trên gợi tả khung cảnh nào?", "options": ["A. Buổi sớm mai", "B. Đêm khuya", "C. Giữa trưa", "D. Buổi hoàng hôn ở làng quê"], "answer": "D", "explain": "Hoàng hôn, hồ sen, cành liễu gợi buổi hoàng hôn ở làng quê."}, {"type": "mcq", "level": "NB", "q": "Đoạn thơ (tự biên): Hoàng hôn buông xuống mặt hồ sen, Gió nhẹ mơn man khẽ lá chen. Biện pháp tu từ nào được dùng trong câu Gió nhẹ mơn man khẽ lá chen?", "options": ["A. Nhân hóa", "B. So sánh", "C. Ẩn dụ", "D. Nói quá"], "answer": "A", "explain": "Gió được miêu tả với hành động mơn man như con người."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn thơ: Hoàng hôn buông xuống mặt hồ sen, Gió nhẹ mơn man khẽ lá chen. Chuồn chuồn đậu khẽ trên cành liễu, Lòng người chợt thấy hết ưu phiền.", "statements": ["a) Đoạn thơ gợi tả cảnh hoàng hôn yên bình.", "b) Tâm trạng trong thơ chuyển từ ưu phiền sang nhẹ nhõm.", "c) Đoạn thơ tả cảnh thành phố ồn ào."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đoạn thơ tả cảnh hoàng hôn làng quê yên bình."}, {"type": "short", "level": "VD", "q": "Giải thích vì sao thiên nhiên được coi là người bạn tri âm của thi nhân xưa.", "answer": "(mẫu) Vì thi nhân gửi gắm tâm sự, tình cảm vào thiên nhiên; thiên nhiên đồng điệu, an ủi tâm hồn họ.", "explain": "Chấm theo ý: thi nhân gửi tâm sự vào thiên nhiên; thiên nhiên như người bạn lắng nghe, sẻ chia."}, {"type": "short", "level": "TH", "q": "Nêu một biểu hiện của vẻ đẹp cổ điển trong thơ Nguyễn Khuyến hoặc Trần Nhân Tông.", "answer": "(mẫu) Tuân thủ niêm luật Đường luật chặt chẽ; hình ảnh thiên nhiên tinh tế, hàm súc...", "explain": "Chấm theo ý: nêu được một biểu hiện: niêm luật nghiêm ngặt; hình ảnh chọn lọc, tinh tế; thiên nhiên là tri âm..."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Bước đầu tiên khi đọc hiểu một bài thơ Đường luật là gì?", "options": ["A. Học thuộc lòng ngay", "B. Chê bai bài thơ", "C. Viết tiếp bài thơ", "D. Đọc kĩ, giải nghĩa từ khó (nhất là từ Hán Việt)"], "answer": "D", "explain": "Cần đọc kĩ và giải nghĩa từ khó, nhất là từ Hán Việt, trước khi cảm nhận."}, {"type": "mcq", "level": "TH", "q": "Khi phân tích thơ Đường luật, cần chú ý yếu tố nghệ thuật nào?", "options": ["A. Niêm, luật, đối, vần; từ ngữ, hình ảnh, biện pháp tu từ", "B. Chỉ chú ý độ dài bài thơ", "C. Chỉ chú ý tên tác giả", "D. Không cần chú ý nghệ thuật"], "answer": "A", "explain": "Cần phân tích niêm, luật, đối, vần cùng từ ngữ, hình ảnh, biện pháp tu từ."}, {"type": "mcq", "level": "TH", "q": "Để hiểu tâm trạng thi nhân, em cần làm gì?", "options": ["A. Chỉ đọc lướt qua", "B. Từ bức tranh thiên nhiên suy ra tình cảm, suy tư nhà thơ gửi gắm", "C. Đoán mò", "D. Hỏi bạn chép bài"], "answer": "B", "explain": "Qua bức tranh thiên nhiên, suy ra tình cảm, suy tư mà nhà thơ gửi gắm."}, {"type": "mcq", "level": "NB", "q": "Bố cục đề – thực – luận – kết giúp người đọc làm gì?", "options": ["A. Học thuộc nhanh hơn", "B. Đếm số câu dễ hơn", "C. Nắm được mạch cảm xúc, ý tưởng của bài thơ", "D. Vẽ minh họa"], "answer": "C", "explain": "Bố cục giúp nắm được mạch triển khai cảm xúc, ý tưởng của bài thơ."}, {"type": "mcq", "level": "VD", "q": "Vì sao không nên đoán mò nghĩa từ Hán Việt khi đọc thơ cổ?", "options": ["A. Vì từ điển rất đắt", "B. Vì thầy cô không cho phép", "C. Vì mất thời gian", "D. Vì đoán mò dễ hiểu sai ý thơ, cần tra cứu để hiểu đúng"], "answer": "D", "explain": "Đoán mò dễ hiểu sai; cần tra cứu để hiểu đúng, hiểu sâu ý thơ."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Đọc thơ Đường luật giống như ngắm một bức tranh thủy mặc: càng nhìn kĩ, càng thấy nhiều tầng ý nghĩa. Mỗi chữ đều được chọn lọc kĩ lưỡng, mỗi hình ảnh đều hàm súc. Người đọc cần kiên nhẫn, đọc đi đọc lại mới cảm hết cái hay. Theo đoạn trích, đọc thơ Đường luật cần thái độ gì?", "options": ["A. Kiên nhẫn, đọc đi đọc lại để cảm hết cái hay", "B. Đọc lướt qua một lần", "C. Chỉ đọc phần chú thích", "D. Nhờ người khác đọc hộ"], "answer": "A", "explain": "Đoạn trích nhấn mạnh cần kiên nhẫn, đọc đi đọc lại mới cảm hết cái hay."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Đọc thơ Đường luật giống như ngắm một bức tranh thủy mặc: càng nhìn kĩ, càng thấy nhiều tầng ý nghĩa. Phép so sánh trong câu Đọc thơ Đường luật giống như ngắm một bức tranh thủy mặc có tác dụng gì?", "options": ["A. Làm người đọc buồn ngủ", "B. Giúp hình dung việc đọc thơ cần sự chiêm nghiệm tinh tế như ngắm tranh", "C. Chứng minh thơ khó hơn tranh", "D. Không có tác dụng"], "answer": "B", "explain": "Phép so sánh giúp hình dung việc đọc thơ cần chiêm nghiệm tinh tế như ngắm tranh thủy mặc."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Đọc thơ Đường luật giống như ngắm tranh thủy mặc; mỗi chữ đều được chọn lọc kĩ lưỡng; cần kiên nhẫn đọc đi đọc lại.", "statements": ["a) Thơ Đường luật mỗi chữ đều được chọn lọc kĩ lưỡng.", "b) Đọc thơ cổ cần kiên nhẫn, chiêm nghiệm.", "c) Chỉ cần đọc lướt là hiểu hết thơ Đường luật."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: cần đọc kĩ, chiêm nghiệm mới hiểu sâu."}, {"type": "short", "level": "TH", "q": "Nêu hai bước cơ bản khi đọc hiểu một bài thơ Đường luật.", "answer": "(mẫu) Giải nghĩa từ khó; cảm nhận hình ảnh thơ và tâm trạng thi nhân", "explain": "Chấm theo ý: nêu đúng hai trong các bước: giải nghĩa từ khó; cảm nhận hình ảnh; tìm hiểu tâm trạng; phân tích nghệ thuật; tổng hợp giá trị."}, {"type": "short", "level": "VD", "q": "Vì sao nói mỗi hình ảnh trong thơ Đường luật đều hàm súc?", "answer": "(mẫu) Vì chỉ vài chữ ngắn gọn mà gợi được nhiều tầng ý nghĩa, cảm xúc.", "explain": "Chấm theo ý: hình ảnh thơ ngắn gọn nhưng gợi nhiều ý nghĩa, cảm xúc sâu xa."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "TH", "q": "Điểm giống nhau giữa thơ Đường luật và thơ Nôm là gì?", "options": ["A. Đều là những thể thơ có giá trị nghệ thuật cao của văn học trung đại", "B. Đều viết bằng chữ Hán", "C. Đều do vua chúa sáng tác", "D. Đều không có vần"], "answer": "A", "explain": "Cả hai đều là di sản thơ ca có giá trị nghệ thuật cao của văn học trung đại."}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa thơ Đường luật chữ Hán và thơ Nôm là gì?", "options": ["A. Số câu trong bài", "B. Chữ viết sử dụng: chữ Hán và chữ Nôm", "C. Cách gieo vần", "D. Số chữ trong câu"], "answer": "B", "explain": "Điểm khác cơ bản là chữ viết: thơ chữ Hán dùng chữ Hán, thơ Nôm dùng chữ Nôm."}, {"type": "mcq", "level": "NB", "q": "Bài Thu điếu được viết theo thể thơ nào?", "options": ["A. Lục bát", "B. Song thất lục bát", "C. Thất ngôn bát cú Đường luật (viết bằng chữ Nôm)", "D. Tự do"], "answer": "C", "explain": "Thu điếu là bài thơ thất ngôn bát cú Đường luật viết bằng chữ Nôm."}, {"type": "mcq", "level": "TH", "q": "Câu nào nhận định đúng về Nguyễn Khuyến?", "options": ["A. Ông là vua nhà Trần", "B. Ông là tác giả Thiên Trường vãn vọng", "C. Ông sống ở thời hiện đại", "D. Ông là Tam nguyên thời Nguyễn, nổi tiếng với chùm thơ thu"], "answer": "D", "explain": "Nguyễn Khuyến đỗ Tam nguyên thời Nguyễn, nổi tiếng với chùm thơ thu."}, {"type": "mcq", "level": "VD", "q": "Vì sao hai bài thơ Thu điếu và Thiên Trường vãn vọng đều được coi là mẫu mực của vẻ đẹp cổ điển?", "options": ["A. Vì tuân thủ nghiêm ngặt niêm luật Đường luật và có hình ảnh thiên nhiên tinh tế, hàm súc", "B. Vì hai bài thơ rất dài", "C. Vì hai bài thơ viết về chiến tranh", "D. Vì hai bài thơ dễ thuộc"], "answer": "A", "explain": "Cả hai bài đều chuẩn mực về niêm luật và có hình ảnh thiên nhiên tinh tế, hàm súc."}, {"type": "mcq", "level": "TH", "q": "Đoạn thơ (tự biên): Trăng thu vằng vặc sáng muôn nơi, Sóng gợn lăn tăn ánh nước ngời. Thuyền ai lặng lẽ trôi trên sóng, Tiếng hát ngân nga vọng đất trời. Đoạn thơ trên gợi tả khung cảnh nào?", "options": ["A. Buổi sớm", "B. Đêm thu trăng sáng trên sông nước", "C. Chiều tà", "D. Bình minh"], "answer": "B", "explain": "Trăng thu, sóng nước, con thuyền gợi đêm thu trăng sáng trên sông nước."}, {"type": "mcq", "level": "NB", "q": "Đoạn thơ (tự biên): Trăng thu vằng vặc sáng muôn nơi, Sóng gợn lăn tăn ánh nước ngời. Từ láy lăn tăn trong câu Sóng gợn lăn tăn ánh nước ngời thuộc loại nào?", "options": ["A. Từ Hán Việt", "B. Từ tượng thanh", "C. Từ láy tượng hình gợi tả gợn sóng nhỏ", "D. Danh từ"], "answer": "C", "explain": "Lăn tăn gợi tả hình ảnh gợn sóng nhỏ nên là từ láy tượng hình."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn thơ: Trăng thu vằng vặc sáng muôn nơi, Sóng gợn lăn tăn ánh nước ngời. Thuyền ai lặng lẽ trôi trên sóng, Tiếng hát ngân nga vọng đất trời.", "statements": ["a) Đoạn thơ gợi tả đêm thu trăng sáng yên bình.", "b) Hình ảnh con thuyền và tiếng hát tạo không khí thơ mộng.", "c) Đoạn thơ tả cảnh bão tố dữ dội."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đoạn thơ tả đêm thu yên bình, thơ mộng."}, {"type": "short", "level": "TH", "q": "Phân biệt thơ Đường luật và thơ Nôm ở một điểm cơ bản.", "answer": "(mẫu) Thơ Đường luật theo niêm luật chặt chẽ có nguồn gốc Trung Quốc; thơ Nôm viết bằng chữ Nôm, đậm hồn Việt.", "explain": "Chấm theo ý: nêu được điểm khác biệt về nguồn gốc, chữ viết hoặc đặc điểm."}, {"type": "short", "level": "NB", "q": "Kể tên hai tác giả tiêu biểu của thơ trung đại Việt Nam.", "answer": "(mẫu) Nguyễn Khuyến, Trần Nhân Tông (hoặc Nguyễn Du, Hồ Xuân Hương, Nguyễn Trãi...)", "explain": "Chấm theo ý: kể đúng hai tác giả thơ trung đại."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bài 2 Vẻ đẹp cổ điển học về những nội dung nào?", "options": ["A. Truyện lịch sử, từ tượng hình", "B. Thơ Đường luật, thơ Nôm, hai bài thơ Thu điếu và Thiên Trường vãn vọng, từ Hán Việt", "C. Tùy bút, ca Huế", "D. Văn bản thông tin"], "answer": "B", "explain": "Bài 2 gồm thơ Đường luật, thơ Nôm, hai bài thơ tiêu biểu và từ Hán Việt."}, {"type": "mcq", "level": "TH", "q": "Nhận định nào đúng về thể thất ngôn bát cú?", "options": ["A. Gồm 4 câu, mỗi câu 7 chữ", "B. Không có quy tắc nào", "C. Gồm 8 câu, mỗi câu 7 chữ, có niêm, luật, đối, vần, bố cục đề – thực – luận – kết", "D. Chỉ dùng để viết về chiến tranh"], "answer": "C", "explain": "Thất ngôn bát cú: 8 câu x 7 chữ với niêm, luật, đối, vần và bố cục 4 phần."}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây sai?", "options": ["A. Nguyễn Khuyến là tác giả Thu điếu", "B. Trần Nhân Tông là tác giả Thiên Trường vãn vọng", "C. Thơ Nôm viết bằng chữ Nôm", "D. Thơ Đường luật không có quy tắc về vần"], "answer": "D", "explain": "Thơ Đường luật có quy tắc gieo vần nghiêm ngặt (thường vần bằng ở câu 1, 2, 4, 6, 8)."}, {"type": "mcq", "level": "NB", "q": "Từ thiên trường trong nhan đề bài thơ của Trần Nhân Tông chỉ điều gì?", "options": ["A. Tên phủ quê hương nhà Trần", "B. Tên một ngọn núi", "C. Tên một dòng sông", "D. Tên một loài hoa"], "answer": "A", "explain": "Thiên Trường là phủ quê hương của nhà Trần."}, {"type": "mcq", "level": "VD", "q": "Điều đáng quý nhất ở tâm hồn các thi nhân xưa qua hai bài thơ là gì?", "options": ["A. Sự giàu có", "B. Tình yêu thiên nhiên, quê hương và sự tinh tế, sâu sắc trong tâm hồn", "C. Quyền lực", "D. Danh tiếng"], "answer": "B", "explain": "Hai bài thơ tỏa sáng tình yêu thiên nhiên, quê hương và tâm hồn tinh tế, sâu sắc."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Mỗi lần đọc Thu điếu, em như được trở về làng quê Bắc Bộ với ao thu trong vắt, chiếc thuyền câu bé nhỏ. Thơ xưa không hề xa lạ mà rất gần gũi, bởi tình yêu quê hương trong thơ cũng chính là tình cảm trong lòng mỗi chúng ta hôm nay. Theo đoạn trích, vì sao thơ xưa không hề xa lạ với người đọc hôm nay?", "options": ["A. Vì thơ xưa rất dễ thuộc", "B. Vì thơ xưa ngắn", "C. Vì tình yêu quê hương trong thơ cũng là tình cảm của mỗi chúng ta hôm nay", "D. Vì thơ xưa viết về hiện tại"], "answer": "C", "explain": "Tình yêu quê hương là cầu nối giữa thơ xưa và người đọc hôm nay."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Mỗi lần đọc Thu điếu, em như được trở về làng quê Bắc Bộ với ao thu trong vắt. Thơ xưa không hề xa lạ mà rất gần gũi. Cảm xúc của người viết trong đoạn trích là gì?", "options": ["A. Chán ghét thơ xưa", "B. Thờ ơ", "C. Sợ hãi", "D. Yêu mến, gần gũi với thơ cổ điển"], "answer": "D", "explain": "Người viết bộc lộ tình cảm yêu mến, gần gũi với thơ cổ điển."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Mỗi lần đọc Thu điếu, em như được trở về làng quê Bắc Bộ; thơ xưa không hề xa lạ vì tình yêu quê hương trong thơ cũng là tình cảm của chúng ta hôm nay.", "statements": ["a) Người viết cảm thấy thơ xưa gần gũi.", "b) Tình yêu quê hương là cầu nối giữa thơ xưa và người đọc hôm nay.", "c) Người viết cho rằng thơ xưa xa lạ, khó hiểu."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: người viết thấy thơ xưa gần gũi."}, {"type": "short", "level": "VD", "q": "Viết 2-3 câu nêu cảm nghĩ của em về vẻ đẹp cổ điển của thơ trung đại.", "answer": "(mẫu) Em rất yêu vẻ đẹp cổ điển của thơ trung đại: lời thơ trang trọng, hình ảnh tinh tế, tình cảm sâu sắc. Mỗi bài thơ như một bức tranh đẹp và một bài học về tâm hồn.", "explain": "Chấm theo ý: bộc lộ tình cảm yêu mến; diễn đạt mạch lạc."}, {"type": "short", "level": "TH", "q": "Nêu tên hai bài thơ tiêu biểu được học trong Bài 2 và tác giả của chúng.", "answer": "Thu điếu (Nguyễn Khuyến); Thiên Trường vãn vọng (Trần Nhân Tông)", "explain": "Chấm theo ý: nêu đúng tên bài thơ và tác giả."}]}]}
