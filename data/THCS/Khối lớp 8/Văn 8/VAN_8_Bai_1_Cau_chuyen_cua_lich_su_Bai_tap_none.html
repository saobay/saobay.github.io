 theo nội dung đoạn trích. c sai: quân Thanh lơ là, bị đánh bất ngờ."}, {"type": "short", "level": "VD", "q": "Kể tên một thành viên của Ngô gia văn phái.", "answer": "(mẫu) Ngô Thì Chí (hoặc Ngô Thì Du, Ngô Thì Thuyết)", "explain": "Chấm theo ý: kể đúng một trong các tác giả: Ngô Thì Chí, Ngô Thì Du, Ngô Thì Thuyết."}, {"type": "short", "level": "TH", "q": "Hoàng Lê nhất thống chí được viết bằng chữ gì?", "answer": "Chữ Hán", "explain": "Tác phẩm là tiểu thuyết chương hồi viết bằng chữ Hán."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nhân vật trung tâm của đoạn trích Quang Trung đại phá quân Thanh là ai?", "options": ["A. Lê Chiêu Thống", "B. Tôn Sĩ Nghị", "C. Vua Quang Trung (Nguyễn Huệ)", "D. Ngô Thì Nhậm"], "answer": "C", "explain": "Vua Quang Trung (Nguyễn Huệ) là nhân vật trung tâm, người anh hùng của chiến thắng."}, {"type": "mcq", "level": "TH", "q": "Chi tiết vua Quang Trung mặc áo bào sờn, cưỡi voi đi đầu thể hiện điều gì?", "options": ["A. Sự xa hoa, phô trương của nhà vua", "B. Sự sợ hãi trước quân giặc", "C. Sự giàu có của triều đình Tây Sơn", "D. Tinh thần xông pha, gần gũi, nêu gương cho tướng sĩ"], "answer": "D", "explain": "Vị vua xông pha đi đầu, áo bào sờn cũ cho thấy ông gần gũi và nêu gương cho tướng sĩ."}, {"type": "mcq", "level": "TH", "q": "Lời dụ tướng sĩ Đánh cho để dài tóc, đánh cho để đen răng... thể hiện khát vọng gì của vua Quang Trung?", "options": ["A. Đánh tan quân xâm lược, giữ gìn bản sắc dân tộc", "B. Cầu hòa với quân Thanh", "C. Mở rộng bờ cõi sang Trung Quốc", "D. Từ bỏ ngai vàng đi tu"], "answer": "A", "explain": "Lời dụ thể hiện quyết tâm đánh tan giặc, bảo vệ độc lập và bản sắc văn hóa dân tộc."}, {"type": "mcq", "level": "NB", "q": "Kẻ cầm đầu quân Thanh xâm lược Đại Việt cuối năm 1788 là ai?", "options": ["A. Thoát Hoan", "B. Tôn Sĩ Nghị", "C. Liễu Thăng", "D. Ô Mã Nhi"], "answer": "B", "explain": "Tôn Sĩ Nghị là tổng đốc Lưỡng Quảng cầm đầu quân Thanh sang xâm lược."}, {"type": "mcq", "level": "VD", "q": "Hình tượng vua Quang Trung trong đoạn trích gửi gắm tư tưởng gì?", "options": ["A. Đề cao lối sống ẩn dật, xa lánh thời cuộc", "B. Ca ngợi sự giàu sang, quyền quý", "C. Tôn vinh lòng yêu nước và tài năng của người anh hùng dân tộc", "D. Phê phán tinh thần đấu tranh"], "answer": "C", "explain": "Hình tượng Quang Trung tôn vinh người anh hùng dân tộc tài năng, yêu nước."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Giữa lúc quân Thanh còn đang ăn Tết linh đình trong thành, thám mã đã phi ngựa về báo tin dữ. Tôn Sĩ Nghị tái mặt, vội vã lên ngựa tháo chạy, bỏ lại cả ấn tín. Đoàn quân xâm lược hùng hổ ngày nào giờ chen nhau vượt cầu, giẫm đạp lên nhau mà chạy. Đoạn trích trên chủ yếu khắc họa điều gì?", "options": ["A. Sự anh dũng của quân Thanh", "B. Tài chỉ huy của Tôn Sĩ Nghị", "C. Cảnh đón Tết vui vẻ của quân Thanh", "D. Sự thảm bại, hoảng loạn của quân Thanh khi bị tấn công bất ngờ"], "answer": "D", "explain": "Chi tiết tái mặt, tháo chạy, giẫm đạp lên nhau khắc họa sự thảm bại của quân Thanh."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Giữa lúc quân Thanh còn đang ăn Tết linh đình trong thành, thám mã đã phi ngựa về báo tin dữ. Tôn Sĩ Nghị tái mặt, vội vã lên ngựa tháo chạy. Từ tái mặt trong câu Tôn Sĩ Nghị tái mặt thuộc loại từ ngữ nào?", "options": ["A. Từ tượng hình", "B. Từ tượng thanh", "C. Từ Hán Việt", "D. Đại từ"], "answer": "A", "explain": "Tái mặt gợi tả dáng vẻ, sắc mặt sợ hãi nên là từ tượng hình."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Quân Thanh đang ăn Tết linh đình thì bị tấn công bất ngờ, Tôn Sĩ Nghị tái mặt tháo chạy.", "statements": ["a) Quân Thanh bị tấn công khi đang lơ là phòng bị dịp Tết.", "b) Tôn Sĩ Nghị bình tĩnh tổ chức phản công.", "c) Đoạn trích góp phần làm nổi bật chiến thắng của nghĩa quân Tây Sơn."], "answers": ["T", "S", "T"], "explain": "a, c đúng. b sai: Tôn Sĩ Nghị hoảng loạn tháo chạy, không tổ chức phản công."}, {"type": "short", "level": "VD", "q": "Nêu một phẩm chất của vua Quang Trung được thể hiện trong đoạn trích.", "answer": "(mẫu) Tài thao lược, quyết đoán, dũng cảm, yêu nước", "explain": "Chấm theo ý: nêu được một phẩm chất: tài thao lược, quyết đoán, dũng cảm xông pha, lòng yêu nước, gần gũi tướng sĩ..."}, {"type": "short", "level": "TH", "q": "Trận đại phá quân Thanh diễn ra vào dịp nào?", "answer": "Tết Kỉ Dậu (mồng 5 Tết năm 1789)", "explain": "Chấm theo ý: Tết Kỉ Dậu 1789 (mồng 5 Tết)."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Từ tượng hình là từ có tác dụng gì?", "options": ["A. Mô phỏng âm thanh", "B. Chỉ số lượng sự vật", "C. Biểu thị thời gian", "D. Gợi tả hình ảnh, dáng vẻ, trạng thái của sự vật"], "answer": "D", "explain": "Từ tượng hình gợi tả hình ảnh, dáng vẻ, trạng thái của sự vật."}, {"type": "mcq", "level": "NB", "q": "Từ nào sau đây là từ tượng hình?", "options": ["A. Lom khom", "B. Ầm ầm", "C. Rào rào", "D. Ríu rít"], "answer": "A", "explain": "Lom khom gợi tả dáng người còng xuống nên là từ tượng hình; các từ còn lại mô phỏng âm thanh."}, {"type": "mcq", "level": "TH", "q": "Trong câu Cụ già lom khom chống gậy bước đi, từ tượng hình lom khom gợi tả điều gì?", "options": ["A. Tiếng bước chân của cụ già", "B. Dáng đi còng xuống, chậm chạp của cụ già", "C. Màu sắc của chiếc gậy", "D. Thời gian buổi chiều"], "answer": "B", "explain": "Lom khom gợi tả dáng người còng xuống khi bước đi."}, {"type": "mcq", "level": "TH", "q": "Điểm chung về cấu tạo của đa số từ tượng hình, từ tượng thanh là gì?", "options": ["A. Đều là từ ghép đẳng lập", "B. Đều là từ Hán Việt", "C. Thường là từ láy", "D. Đều là thành ngữ"], "answer": "C", "explain": "Đa số từ tượng hình, từ tượng thanh có cấu tạo là từ láy."}, {"type": "mcq", "level": "VD", "q": "Vì sao nhà văn viết truyện lịch sử thường dùng nhiều từ tượng hình, từ tượng thanh?", "options": ["A. Để bài văn dài hơn", "B. Để khoe vốn từ vựng", "C. Để thay thế hoàn toàn lời kể", "D. Để tái hiện cảnh vật, không khí sinh động như thật"], "answer": "D", "explain": "Từ tượng hình, tượng thanh giúp tái hiện cảnh vật, âm thanh sinh động như thật."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Người lính già lom khom nhóm bếp lửa giữa trời đông giá rét. Ngọn lửa lấp lánh hắt lên những gương mặt gầy gò mà rắn rỏi. Xa xa, đoàn quân lênh khênh gánh vác lặng lẽ hành quân trong đêm. Đoạn trích trên sử dụng những từ tượng hình nào?", "options": ["A. Lom khom, lấp lánh, lênh khênh", "B. Ầm ầm, rào rào, lộp bộp", "C. Vội vã, nhanh chóng, khẩn trương", "D. Buồn bã, vui vẻ, hân hoan"], "answer": "A", "explain": "Lom khom, lấp lánh, lênh khênh đều gợi tả hình ảnh, dáng vẻ nên là từ tượng hình."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Người lính già lom khom nhóm bếp lửa giữa trời đông giá rét. Ngọn lửa lấp lánh hắt lên những gương mặt gầy gò. Từ lấp lánh gợi tả điều gì?", "options": ["A. Âm thanh của ngọn lửa", "B. Ánh sáng của ngọn lửa nhấp nháy, rực rỡ", "C. Mùi vị của thức ăn", "D. Cảm giác lạnh giá"], "answer": "B", "explain": "Lấp lánh gợi tả ánh sáng nhấp nháy của ngọn lửa."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Người lính già lom khom nhóm bếp lửa giữa trời đông giá rét, đoàn quân lênh khênh hành quân trong đêm.", "statements": ["a) Đoạn trích có sử dụng từ tượng hình để miêu tả con người và cảnh vật.", "b) Không khí trong đoạn trích là không khí hành quân gian khổ mà kiên cường.", "c) Lom khom là từ tượng thanh."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: lom khom gợi tả dáng vẻ nên là từ tượng hình."}, {"type": "short", "level": "VD", "q": "Viết một câu văn có sử dụng từ tượng hình để tả dáng đi của một người.", "answer": "(mẫu) Em bé lẫm chẫm tập đi từng bước.", "explain": "Chấm theo ý: câu đúng ngữ pháp, có từ tượng hình tả dáng vẻ (lẫm chẫm, lom khom, lênh khênh, uyển chuyển...)."}, {"type": "short", "level": "NB", "q": "Kể tên hai từ tượng hình mà em biết.", "answer": "(mẫu) lom khom, lấp lánh", "explain": "Chấm theo ý: kể đúng hai từ gợi tả hình ảnh, dáng vẻ (mập mạp, khúc khuỷu, gầy gò, lênh khênh...)."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Từ tượng thanh là từ có tác dụng gì?", "options": ["A. Mô phỏng âm thanh của tự nhiên, của con người", "B. Gợi tả màu sắc của sự vật", "C. Gợi tả hình dáng của sự vật", "D. Chỉ tên riêng của sự vật"], "answer": "A", "explain": "Từ tượng thanh mô phỏng âm thanh của tự nhiên và con người."}, {"type": "mcq", "level": "NB", "q": "Từ nào sau đây là từ tượng thanh?", "options": ["A. Lấp lánh", "B. Ầm ầm", "C. Mập mạp", "D. Khúc khuỷu"], "answer": "B", "explain": "Ầm ầm mô phỏng âm thanh nên là từ tượng thanh."}, {"type": "mcq", "level": "TH", "q": "Trong câu Tiếng trống thùng thùng vang dội, từ tượng thanh thùng thùng có tác dụng gì?", "options": ["A. Tả màu sắc của chiếc trống", "B. Tả hình dáng của chiếc trống", "C. Giúp người đọc như nghe thấy tiếng trống trận hào hùng", "D. Cho biết thời gian đánh trống"], "answer": "C", "explain": "Từ tượng thanh giúp người đọc như được nghe thấy âm thanh thật."}, {"type": "mcq", "level": "TH", "q": "Cách phân biệt từ tượng hình và từ tượng thanh đơn giản nhất là gì?", "options": ["A. Dựa vào số lượng chữ trong từ", "B. Dựa vào vị trí của từ trong câu", "C. Dựa vào từ điển", "D. Tự hỏi: từ ấy giúp ta nhìn thấy hay nghe thấy sự vật"], "answer": "D", "explain": "Từ tượng hình giúp ta nhìn thấy, từ tượng thanh giúp ta nghe thấy sự vật."}, {"type": "mcq", "level": "VD", "q": "Dòng nào gồm toàn từ tượng thanh?", "options": ["A. Rào rào, lộp bộp, ríu rít, thánh thót", "B. Lom khom, lênh khênh, mập mạp, gầy gò", "C. Vui vẻ, buồn bã, hân hoan, lo lắng", "D. Nhanh nhẹn, chậm chạp, vội vã, thong thả"], "answer": "A", "explain": "Dòng A toàn từ mô phỏng âm thanh; dòng B toàn từ tượng hình."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Rạng sáng, tiếng vó ngựa rầm rập dồn dập từ phía chân đồi vọng lại. Trên thành, tiếng trống thúc liên hồi thùng thùng. Gió bấc rít lên từng hồi, cờ xí phần phật trong gió sớm. Đoạn trích trên gợi ra khung cảnh gì?", "options": ["A. Buổi chợ quê đông vui", "B. Không khí ra trận khẩn trương, hào hùng", "C. Buổi học yên tĩnh trong lớp", "D. Đêm hội trăng rằm"], "answer": "B", "explain": "Tiếng vó ngựa, tiếng trống trận gợi không khí ra trận khẩn trương, hào hùng."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Rạng sáng, tiếng vó ngựa rầm rập dồn dập từ phía chân đồi vọng lại. Trên thành, tiếng trống thúc liên hồi thùng thùng. Các từ rầm rập, thùng thùng, phần phật trong đoạn trích thuộc loại nào?", "options": ["A. Từ tượng hình", "B. Từ Hán Việt", "C. Từ tượng thanh", "D. Từ ghép chính phụ"], "answer": "C", "explain": "Các từ này đều mô phỏng âm thanh nên là từ tượng thanh."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Rạng sáng, tiếng vó ngựa rầm rập, tiếng trống thúc liên hồi thùng thùng, cờ xí phần phật trong gió sớm.", "statements": ["a) Đoạn trích sử dụng nhiều từ tượng thanh để tái hiện âm thanh trận mạc.", "b) Các từ tượng thanh giúp không khí đoạn trích thêm sinh động, khẩn trương.", "c) Rầm rập là từ tượng hình."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: rầm rập mô phỏng âm thanh vó ngựa nên là từ tượng thanh."}, {"type": "short", "level": "VD", "q": "Đặt một câu miêu tả âm thanh của cơn mưa, có sử dụng từ tượng thanh.", "answer": "(mẫu) Mưa rào rào đổ xuống mái tôn.", "explain": "Chấm theo ý: câu đúng ngữ pháp, có từ tượng thanh tả tiếng mưa (rào rào, lộp bộp, tí tách...)."}, {"type": "short", "level": "NB", "q": "Từ tượng thanh khác từ tượng hình ở điểm nào?", "answer": "(mẫu) Từ tượng thanh mô phỏng âm thanh; từ tượng hình gợi tả hình ảnh, dáng vẻ.", "explain": "Chấm theo ý: nêu được sự khác nhau: tượng thanh gợi tiếng, tượng hình gợi hình."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Tóm tắt văn bản tự sự là gì?", "options": ["A. Chép lại nguyên văn toàn bộ văn bản", "B. Trình bày lại nội dung chính của văn bản một cách ngắn gọn", "C. Viết tiếp diễn biến mới cho câu chuyện", "D. Phê bình, đánh giá văn bản"], "answer": "B", "explain": "Tóm tắt là trình bày lại nội dung chính ngắn gọn, trung thành với văn bản gốc."}, {"type": "mcq", "level": "NB", "q": "Yêu cầu quan trọng nhất khi tóm tắt văn bản là gì?", "options": ["A. Viết thật dài, thật chi tiết", "B. Thêm nhiều ý kiến, bình luận cá nhân", "C. Trung thành với nội dung của văn bản gốc", "D. Thay đổi kết thúc câu chuyện cho hay hơn"], "answer": "C", "explain": "Bản tóm tắt phải trung thành với nội dung văn bản gốc, không xuyên tạc."}, {"type": "mcq", "level": "TH", "q": "Khi tóm tắt, cần lược bỏ yếu tố nào?", "options": ["A. Nhân vật chính", "B. Sự kiện chính", "C. Kết quả câu chuyện", "D. Chi tiết phụ, lời miêu tả rườm rà"], "answer": "D", "explain": "Tóm tắt giữ lại nhân vật, sự kiện chính và lược bỏ chi tiết phụ rườm rà."}, {"type": "mcq", "level": "TH", "q": "Trình tự nào hợp lí khi sắp xếp các ý trong bản tóm tắt?", "options": ["A. Theo trình tự thời gian hoặc mạch truyện", "B. Theo ý thích ngẫu nhiên", "C. Từ kết thúc kể ngược lên đầu", "D. Chỉ kể đoạn giữa truyện"], "answer": "A", "explain": "Bản tóm tắt thường sắp xếp các ý theo trình tự thời gian hoặc mạch truyện."}, {"type": "mcq", "level": "VD", "q": "Vì sao không nên đưa ý kiến, bình luận cá nhân vào bản tóm tắt?", "options": ["A. Vì bản tóm tắt phải dài", "B. Vì tóm tắt chỉ trình bày lại nội dung khách quan của văn bản gốc", "C. Vì người đọc không thích bình luận", "D. Vì bình luận làm văn bản ngắn đi"], "answer": "B", "explain": "Tóm tắt trình bày lại nội dung khách quan; bình luận cá nhân thuộc về văn nghị luận."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Sau chiến thắng, vua Quang Trung cho quân sĩ nghỉ ngơi, sai thu nhặt binh khí, chôn cất tử sĩ cả hai bên và truyền lệnh giữ nghiêm kỉ luật, không được cướp bóc của dân. Nhân dân Thăng Long đổ ra đường hò reo đón nghĩa quân khải hoàn. Nội dung chính của đoạn trích trên là gì?", "options": ["A. Quân Thanh chuẩn bị phản công", "B. Vua Quang Trung lên ngôi hoàng đế", "C. Vua Quang Trung ổn định tình hình sau chiến thắng và được nhân dân đón chào", "D. Nghĩa quân Tây Sơn rút về Phú Xuân"], "answer": "C", "explain": "Đoạn trích kể việc vua Quang Trung ổn định tình hình và nhân dân đón nghĩa quân khải hoàn."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Sau chiến thắng, vua Quang Trung truyền lệnh giữ nghiêm kỉ luật, không được cướp bóc của dân. Chi tiết không được cướp bóc của dân thể hiện điều gì ở nghĩa quân Tây Sơn?", "options": ["A. Sự nghèo đói", "B. Sự sợ hãi", "C. Sự kiêu ngạo", "D. Kỉ luật nghiêm minh, thương dân"], "answer": "D", "explain": "Lệnh cấm cướp bóc thể hiện kỉ luật nghiêm minh và tình thương dân của nghĩa quân."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Sau chiến thắng, vua Quang Trung cho quân sĩ nghỉ ngơi, giữ nghiêm kỉ luật, nhân dân Thăng Long đổ ra đường đón nghĩa quân.", "statements": ["a) Sau chiến thắng, vua Quang Trung chú trọng ổn định đời sống nhân dân.", "b) Nghĩa quân Tây Sơn có kỉ luật nghiêm minh.", "c) Nhân dân Thăng Long sợ hãi, lánh mặt khi nghĩa quân tiến vào."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: nhân dân đổ ra đường hò reo đón nghĩa quân."}, {"type": "short", "level": "VD", "q": "Tóm tắt đoạn trích Quang Trung đại phá quân Thanh trong khoảng 3 câu.", "answer": "(mẫu) Quân Thanh sang xâm lược, vua Lê cầu viện giặc. Nguyễn Huệ lên ngôi, tiến quân thần tốc ra Bắc. Mồng 5 Tết Kỉ Dậu, nghĩa quân đại phá quân Thanh ở Ngọc Hồi – Đống Đa.", "explain": "Chấm theo ý: nêu được các sự kiện chính (quân Thanh xâm lược – Quang Trung tiến quân – chiến thắng Ngọc Hồi Đống Đa), ngắn gọn, đúng nội dung."}, {"type": "short", "level": "TH", "q": "Khi tóm tắt, có được thêm thắt tình tiết mới không? Vì sao?", "answer": "(mẫu) Không, vì bản tóm tắt phải trung thành với nội dung văn bản gốc.", "explain": "Chấm theo ý: trả lời không và giải thích: tóm tắt phải trung thành với nội dung gốc, không bịa thêm."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "TH", "q": "Trong truyện lịch sử, yếu tố nào phải tuyệt đối trung thành với lịch sử?", "options": ["A. Lời đối thoại của nhân vật", "B. Diễn biến tâm trạng nhân vật", "C. Tên nhân vật, sự kiện chính, bối cảnh thời đại", "D. Chi tiết sinh hoạt đời thường"], "answer": "C", "explain": "Tên nhân vật, sự kiện chính, bối cảnh thời đại là sự thật lịch sử phải giữ đúng."}, {"type": "mcq", "level": "TH", "q": "Yếu tố nào thuộc về hư cấu nghệ thuật trong truyện lịch sử?", "options": ["A. Niên đại của sự kiện", "B. Kết quả của trận đánh", "C. Tên vị vua có thật", "D. Lời đối thoại do nhà văn tưởng tượng"], "answer": "D", "explain": "Lời đối thoại do nhà văn tưởng tượng là hư cấu nghệ thuật; các yếu tố còn lại thuộc sự thật."}, {"type": "mcq", "level": "NB", "q": "Nhân vật trong truyện lịch sử thường có đặc điểm gì?", "options": ["A. Mang tầm vóc lịch sử: anh hùng, danh nhân với tính cách lớn lao", "B. Là nhân vật thần thoại có phép thuật", "C. Là người bình thường không có gì đặc biệt", "D. Là nhân vật hoàn toàn bịa đặt"], "answer": "A", "explain": "Nhân vật truyện lịch sử thường là anh hùng, danh nhân mang tầm vóc lịch sử."}, {"type": "mcq", "level": "VD", "q": "Một bạn viết truyện lịch sử nhưng cho vị anh hùng dùng điện thoại di động. Chi tiết này có hợp lí không?", "options": ["A. Hợp lí vì làm truyện hiện đại hơn", "B. Không hợp lí vì hư cấu trái với bối cảnh lịch sử", "C. Hợp lí vì nhà văn được bịa đặt tự do", "D. Không quan trọng, miễn truyện hay"], "answer": "B", "explain": "Hư cấu phải hợp lí, không được trái với bối cảnh và bản chất của thời đại lịch sử."}, {"type": "mcq", "level": "TH", "q": "Giá trị lớn nhất mà truyện lịch sử mang lại cho người đọc là gì?", "options": ["A. Giải trí đơn thuần", "B. Học cách bịa chuyện", "C. Hiểu biết lịch sử và bồi đắp lòng tự hào dân tộc", "D. Rèn luyện trí nhớ niên đại"], "answer": "C", "explain": "Truyện lịch sử giúp hiểu quá khứ và bồi đắp lòng tự hào, yêu nước."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Bà cụ ngồi bên bếp lửa, kể cho lũ cháu nghe chuyện xưa: Ngày ấy, giặc đến, cả làng ta theo nghĩa quân. Ông nội các cháu mới mười sáu tuổi đã xung phong làm liên lạc, luồn rừng đưa thư trong đêm... Lũ trẻ tròn mắt lắng nghe, như thấy cả một thời oanh liệt hiện về. Đoạn trích trên thể hiện giá trị nào của truyện lịch sử?", "options": ["A. Giá trị giải trí", "B. Giá trị kinh tế", "C. Giá trị khoa học tự nhiên", "D. Giá trị giáo dục truyền thống cho thế hệ trẻ"], "answer": "D", "explain": "Việc bà kể chuyện xưa cho cháu thể hiện giá trị giáo dục truyền thống."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Bà cụ ngồi bên bếp lửa, kể cho lũ cháu nghe chuyện xưa về thời kháng chiến oanh liệt. Hình thức kể chuyện trong đoạn trích là gì?", "options": ["A. Người bà kể chuyện xưa cho cháu nghe", "B. Nhân vật tự kể về mình", "C. Báo chí đưa tin", "D. Thư từ"], "answer": "A", "explain": "Đoạn trích dùng hình thức người bà kể chuyện xưa cho cháu nghe."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Bà cụ kể cho cháu nghe chuyện ông nội mười sáu tuổi làm liên lạc trong kháng chiến.", "statements": ["a) Đoạn trích cho thấy truyện lịch sử giúp thế hệ trẻ hiểu về quá khứ.", "b) Chi tiết ông nội mười sáu tuổi làm liên lạc gợi không khí thời chiến hào hùng.", "c) Đoạn trích phê phán việc kể chuyện lịch sử cho trẻ em."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đoạn trích đề cao việc kể chuyện lịch sử cho thế hệ trẻ."}, {"type": "short", "level": "TH", "q": "Phân biệt sự thật lịch sử và hư cấu nghệ thuật trong truyện lịch sử.", "answer": "(mẫu) Sự thật lịch sử: nhân vật, sự kiện có thật, phải trung thành; hư cấu nghệ thuật: chi tiết tưởng tượng của nhà văn, làm câu chuyện sinh động.", "explain": "Chấm theo ý: nêu được sự thật là cái có thật phải giữ đúng; hư cấu là sáng tạo của nhà văn nhưng phải hợp lí."}, {"type": "short", "level": "VD", "q": "Vì sao nói hư cấu trong truyện lịch sử càng tài tình càng hay nhưng vẫn phải đúng chất lịch sử?", "answer": "(mẫu) Hư cấu hay làm truyện sinh động, hấp dẫn; nhưng nếu bịa đặt sai sự thật sẽ xuyên tạc lịch sử.", "explain": "Chấm theo ý: hư cấu giúp sinh động, lôi cuốn; giới hạn là không được trái với bản chất sự thật lịch sử."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "Nhịp kể trong đoạn trích Quang Trung đại phá quân Thanh có đặc điểm gì?", "options": ["A. Chậm rãi, êm đềm", "B. Đứt quãng, rời rạc", "C. Buồn bã, trầm lắng", "D. Nhanh, dồn dập theo bước tiến thần tốc của nghĩa quân"], "answer": "D", "explain": "Nhịp kể nhanh, dồn dập phù hợp với bước tiến thần tốc của nghĩa quân Tây Sơn."}, {"type": "mcq", "level": "NB", "q": "Biện pháp nào giúp tác giả khắc họa sinh động hình tượng vua Quang Trung?", "options": ["A. Miêu tả hành động, lời nói của nhân vật", "B. Chỉ nêu niên đại, sự kiện khô khan", "C. Liệt kê tên các tướng sĩ", "D. Tả cảnh thiên nhiên"], "answer": "A", "explain": "Tác giả khắc họa Quang Trung qua hành động quyết đoán và lời nói đanh thép."}, {"type": "mcq", "level": "TH", "q": "Chi tiết chọn lọc trong truyện lịch sử có vai trò gì?", "options": ["A. Làm truyện dài hơn", "B. Làm nổi bật tính cách nhân vật và chủ đề tư tưởng", "C. Thay thế hoàn toàn lời kể", "D. Gây khó hiểu cho người đọc"], "answer": "B", "explain": "Chi tiết chọn lọc, tiêu biểu giúp nổi bật tính cách nhân vật và tư tưởng tác phẩm."}, {"type": "mcq", "level": "TH", "q": "Đối thoại trong truyện lịch sử thường là sản phẩm của yếu tố nào?", "options": ["A. Biên bản lịch sử ghi lại đầy đủ", "B. Lời kể của nhân chứng", "C. Hư cấu nghệ thuật của nhà văn", "D. Tài liệu khảo cổ"], "answer": "C", "explain": "Lịch sử không ghi lại đầy đủ lời nói nên đối thoại thường do nhà văn hư cấu."}, {"type": "mcq", "level": "VD", "q": "Câu văn ngắn, gấp gáp trong đoạn trích có tác dụng gì?", "options": ["A. Làm người đọc buồn ngủ", "B. Che giấu sự kiện lịch sử", "C. Kéo dài câu chuyện", "D. Tạo không khí hào hùng, khẩn trương của trận đánh"], "answer": "D", "explain": "Câu văn ngắn, gấp gáp tạo không khí hào hùng, khẩn trương của trận đánh."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Tiến lên! – tiếng hô của vua Quang Trung vang lên như sấm. Hàng nghìn chiến sĩ đồng loạt xông lên, gươm giáo loang loáng dưới nắng sớm. Tiếng reo hò dậy đất, át cả tiếng trống trận. Biện pháp nghệ thuật nào được sử dụng trong câu tiếng hô vang lên như sấm?", "options": ["A. So sánh", "B. Nhân hóa", "C. Ẩn dụ", "D. Hoán dụ"], "answer": "A", "explain": "Cấu trúc như sấm là phép so sánh tiếng hô với tiếng sấm."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Hàng nghìn chiến sĩ đồng loạt xông lên, gươm giáo loang loáng dưới nắng sớm. Từ loang loáng trong đoạn trích thuộc loại nào?", "options": ["A. Từ Hán Việt", "B. Từ tượng hình", "C. Từ tượng thanh", "D. Danh từ"], "answer": "B", "explain": "Loang loáng gợi tả ánh sáng của gươm giáo nên là từ tượng hình."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Tiến lên! – tiếng hô của vua Quang Trung vang lên như sấm, chiến sĩ xông lên, gươm giáo loang loáng.", "statements": ["a) Đoạn trích tái hiện khí thế tiến công hào hùng của nghĩa quân.", "b) Hình ảnh vua Quang Trung hô Tiến lên! thể hiện vai trò nêu gương của người chỉ huy.", "c) Đoạn trích miêu tả cảnh quân Thanh chiến thắng."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: đoạn trích miêu tả nghĩa quân Tây Sơn tiến công."}, {"type": "short", "level": "VD", "q": "Nêu hai biện pháp nghệ thuật tiêu biểu trong đoạn trích Quang Trung đại phá quân Thanh.", "answer": "(mẫu) Miêu tả nhân vật qua hành động, lời nói; nhịp kể nhanh, dồn dập.", "explain": "Chấm theo ý: nêu được hai trong các ý: khắc họa nhân vật qua hành động, lời nói; chi tiết chọn lọc; đối thoại sinh động; nhịp kể dồn dập; dùng từ tượng hình, tượng thanh."}, {"type": "short", "level": "TH", "q": "Vì sao lời đối thoại của nhân vật lịch sử trong truyện thường là hư cấu?", "answer": "(mẫu) Vì lịch sử không ghi lại đầy đủ từng lời nói, nhà văn phải tưởng tượng cho hợp lí.", "explain": "Chấm theo ý: lịch sử không lưu giữ nguyên văn lời nói; nhà văn hư cấu đối thoại để nhân vật sống động, phù hợp tính cách và hoàn cảnh."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "TH", "q": "Trong câu Mặt trời lấp lánh trên mặt biển, từ lấp lánh gợi cảm giác gì?", "options": ["A. Ánh sáng rực rỡ, nhấp nháy sinh động của mặt trời trên sóng nước", "B. Âm thanh của sóng biển", "C. Mùi vị của nước biển", "D. Sự tĩnh lặng của buổi sớm"], "answer": "A", "explain": "Lấp lánh là từ tượng hình gợi tả ánh sáng nhấp nháy, rực rỡ."}, {"type": "mcq", "level": "TH", "q": "Câu nào sử dụng từ tượng thanh?", "options": ["A. Dáng mẹ lom khom trong bếp", "B. Ve sầu kêu râm ran trong vòm lá", "C. Bầu trời xanh ngắt", "D. Con đường khúc khuỷu"], "answer": "B", "explain": "Râm ran mô phỏng tiếng ve kêu nên là từ tượng thanh."}, {"type": "mcq", "level": "VD", "q": "Khi viết đoạn văn tả cơn bão, nên ưu tiên dùng loại từ nào?", "options": ["A. Chỉ dùng từ Hán Việt", "B. Chỉ dùng từ tượng hình", "C. Kết hợp từ tượng thanh (tiếng gió, mưa) và từ tượng hình (cảnh vật)", "D. Không dùng từ gợi tả nào"], "answer": "C", "explain": "Tả bão cần cả âm thanh (tượng thanh) và hình ảnh (tượng hình) mới sinh động."}, {"type": "mcq", "level": "NB", "q": "Từ thánh thót (tiếng hót) thuộc loại nào?", "options": ["A. Từ tượng hình", "B. Từ láy chỉ màu sắc", "C. Từ Hán Việt", "D. Từ tượng thanh"], "answer": "D", "explain": "Thánh thót mô phỏng tiếng hót trong trẻo nên là từ tượng thanh."}, {"type": "mcq", "level": "VD", "q": "Nhận xét nào đúng về giá trị của từ tượng hình, từ tượng thanh?", "options": ["A. Làm cho lời văn gợi hình, gợi cảm, sinh động như thật", "B. Chỉ dùng để trang trí, không có tác dụng", "C. Làm cho câu văn khó hiểu hơn", "D. Chỉ dùng được trong thơ, không dùng trong văn xuôi"], "answer": "A", "explain": "Từ tượng hình, tượng thanh làm lời văn gợi hình, gợi cảm, sinh động."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Đêm khải hoàn, lửa trại bập bùng soi rõ những gương mặt rạng rỡ. Tiếng cười nói râm ran khắp doanh trại. Xa xa, tiếng suối róc rách như cũng hòa chung niềm vui chiến thắng. Không khí trong đoạn trích là không khí gì?", "options": ["A. Buồn bã, ảm đạm sau thất bại", "B. Vui tươi, phấn khởi sau chiến thắng", "C. Căng thẳng trước giờ xuất quân", "D. Hoảng loạn khi bị tập kích"], "answer": "B", "explain": "Lửa trại, tiếng cười, niềm vui chiến thắng gợi không khí vui tươi, phấn khởi."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Đêm khải hoàn, lửa trại bập bùng soi rõ những gương mặt rạng rỡ. Tiếng cười nói râm ran khắp doanh trại. Tiếng suối róc rách hòa chung niềm vui. Các từ bập bùng, râm ran, róc rách thuộc loại nào?", "options": ["A. Toàn là từ tượng hình", "B. Toàn là từ Hán Việt", "C. Bập bùng là từ tượng hình; râm ran, róc rách là từ tượng thanh", "D. Toàn là danh từ"], "answer": "C", "explain": "Bập bùng gợi hình ngọn lửa; râm ran, róc rách mô phỏng âm thanh."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Đêm khải hoàn, lửa trại bập bùng, tiếng cười nói râm ran, tiếng suối róc rách.", "statements": ["a) Đoạn trích miêu tả cảnh vui sau chiến thắng.", "b) Tác giả kết hợp cả từ tượng hình và từ tượng thanh.", "c) Róc rách gợi tả hình ảnh của dòng suối."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: róc rách mô phỏng âm thanh dòng suối nên là từ tượng thanh."}, {"type": "short", "level": "TH", "q": "Giải thích vì sao rào rào là từ tượng thanh còn lênh khênh là từ tượng hình.", "answer": "(mẫu) Rào rào mô phỏng âm thanh; lênh khênh gợi tả dáng vẻ cao, gầy.", "explain": "Chấm theo ý: chỉ ra rào rào giúp ta nghe thấy tiếng, lênh khênh giúp ta nhìn thấy dáng."}, {"type": "short", "level": "VD", "q": "Viết đoạn văn ngắn (3-4 câu) tả quang cảnh trường em vào giờ ra chơi, có sử dụng ít nhất một từ tượng hình và một từ tượng thanh.", "answer": "(mẫu) Giờ ra chơi, sân trường ồn ào tiếng cười nói râm ran. Những tà áo trắng thấp thoáng giữa sân nắng lấp lánh. Tiếng trống trường thùng thùng báo hiệu giờ vào lớp.", "explain": "Chấm theo ý: đoạn văn đúng chủ đề, có ít nhất 1 từ tượng hình và 1 từ tượng thanh, diễn đạt mạch lạc."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Thể loại của văn bản Quang Trung đại phá quân Thanh là gì?", "options": ["A. Thơ Đường luật", "B. Truyện lịch sử (trích tiểu thuyết chương hồi)", "C. Tùy bút", "D. Văn bản thông tin"], "answer": "B", "explain": "Đây là đoạn trích tiểu thuyết chương hồi, thuộc thể loại truyện lịch sử."}, {"type": "mcq", "level": "TH", "q": "Dòng nào nêu đúng các kiến thức trọng tâm của Bài 1?", "options": ["A. Thơ Đường luật, thơ Nôm, từ Hán Việt", "B. Tùy bút, ca Huế, văn bản thông tin", "C. Truyện lịch sử, Hoàng Lê nhất thống chí, từ tượng hình và tượng thanh, cách tóm tắt", "D. Truyện ngắn, tiểu thuyết, phóng sự"], "answer": "C", "explain": "Bài 1 gồm: truyện lịch sử, Hoàng Lê nhất thống chí, từ tượng hình, tượng thanh và cách tóm tắt."}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây là nhận định đúng?", "options": ["A. Truyện lịch sử không được phép hư cấu", "B. Từ tượng thanh gợi tả hình ảnh", "C. Tóm tắt là chép nguyên văn", "D. Hư cấu nghệ thuật phải hợp lí, không trái bản chất lịch sử"], "answer": "D", "explain": "Hư cấu là đặc trưng của truyện lịch sử nhưng phải hợp lí, không xuyên tạc sự thật."}, {"type": "mcq", "level": "NB", "q": "Hoàng Lê nhất thống chí là tác phẩm của thời kì văn học nào?", "options": ["A. Văn học trung đại Việt Nam", "B. Văn học hiện đại", "C. Văn học dân gian", "D. Văn học nước ngoài"], "answer": "A", "explain": "Tác phẩm viết bằng chữ Hán cuối thế kỉ XVIII, thuộc văn học trung đại."}, {"type": "mcq", "level": "VD", "q": "Học xong Bài 1, em rút ra bài học nào sâu sắc nhất?", "options": ["A. Chỉ cần học thuộc lòng niên đại lịch sử", "B. Tự hào về truyền thống đấu tranh của dân tộc và ý thức giữ gìn, phát huy", "C. Lịch sử chỉ là chuyện của quá khứ, không liên quan hiện tại", "D. Hư cấu trong văn học là xấu"], "answer": "B", "explain": "Bài học sâu sắc là lòng tự hào và ý thức giữ gìn, phát huy truyền thống dân tộc."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích (tự biên): Ngày nay, gò Đống Đa ở Hà Nội đã trở thành di tích lịch sử, nơi mỗi dịp đầu xuân người dân lại nô nức trẩy hội, ôn lại chiến công oanh liệt của vua Quang Trung. Những câu chuyện về trận đánh năm xưa vẫn được kể lại đầy tự hào cho con cháu nghe. Đoạn trích trên cho thấy ý nghĩa nào của chiến thắng Ngọc Hồi – Đống Đa?", "options": ["A. Chỉ có ý nghĩa quân sự nhất thời", "B. Đã bị lãng quên trong hiện tại", "C. Sống mãi trong lòng dân tộc, được tưởng nhớ qua lễ hội và câu chuyện kể", "D. Chỉ còn trong sách vở"], "answer": "C", "explain": "Lễ hội gò Đống Đa và chuyện kể cho con cháu cho thấy chiến thắng sống mãi trong lòng dân tộc."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích (tự biên): Ngày nay, gò Đống Đa ở Hà Nội đã trở thành di tích lịch sử, nơi mỗi dịp đầu xuân người dân lại nô nức trẩy hội. Hội gò Đống Đa được tổ chức vào dịp nào?", "options": ["A. Dịp Tết Trung thu", "B. Dịp lễ Giáng sinh", "C. Dịp Quốc khánh", "D. Dịp đầu xuân hằng năm"], "answer": "D", "explain": "Hội gò Đống Đa tổ chức vào dịp đầu xuân hằng năm."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai về đoạn trích: Gò Đống Đa nay là di tích lịch sử, mỗi đầu xuân người dân trẩy hội ôn lại chiến công vua Quang Trung.", "statements": ["a) Gò Đống Đa là di tích gắn với chiến thắng của vua Quang Trung.", "b) Nhân dân tưởng nhớ chiến công qua lễ hội đầu xuân.", "c) Câu chuyện về trận đánh đã bị mai một, không ai còn nhớ."], "answers": ["T", "T", "S"], "explain": "a, b đúng. c sai: câu chuyện vẫn được kể đầy tự hào cho con cháu."}, {"type": "short", "level": "TH", "q": "Nêu tên tác phẩm và tác giả của đoạn trích Quang Trung đại phá quân Thanh.", "answer": "Trích Hoàng Lê nhất thống chí của Ngô gia văn phái", "explain": "Chấm theo ý: nêu đúng tên tác phẩm và nhóm tác giả."}, {"type": "short", "level": "VD", "q": "Viết 2-3 câu nêu cảm nghĩ của em về hình tượng vua Quang Trung.", "answer": "(mẫu) Em rất khâm phục vua Quang Trung – vị anh hùng tài ba, quyết đoán, hết lòng vì nước. Ông là tấm gương sáng về lòng yêu nước cho thế hệ trẻ noi theo.", "explain": "Chấm theo ý: bộc lộ tình cảm, sự khâm phục; diễn đạt mạch lạc, đúng chính tả."}]}]}
