", "level": "TH", "q": "Vì sao truyện “Treo biển” gây cười?", "options": ["A. Vì biển hiệu đẹp", "B. Vì cá rất tươi", "C. Vì nhân vật thiếu chính kiến, ai bảo gì cũng nghe theo", "D. Vì khách hàng đông"], "answer": "C", "explain": "Cái cười bật ra từ sự “đẽo cày giữa đường” của chủ quán."}, {"type": "mcq", "level": "NB", "q": "Nhân vật trong truyện cười thường đại diện cho điều gì?", "options": ["A. Anh hùng dân tộc", "B. Một thói hư tật xấu điển hình", "C. Nhà khoa học", "D. Danh nhân văn hóa"], "answer": "D", "explain": "Nhân vật truyện cười là hiện thân của thói xấu: khoe, dốt, tham..."}, {"type": "mcq", "level": "NB", "q": "Truyện “Treo biển” thuộc loại truyện nào?", "options": ["A. Truyện cười dân gian", "B. Truyện cổ tích", "C. Truyện truyền thuyết", "D. Tiểu thuyết"], "answer": "A", "explain": "“Treo biển” là truyện cười do dân gian sáng tác."}, {"type": "mcq", "level": "TH", "q": "“Chuyện cũ trong phủ chúa Trịnh” khác truyện cười dân gian ở điểm nào?", "options": ["A. Dài hơn", "B. Là tùy bút ghi chép chuyện có thật, giọng vừa hài hước vừa nghiêm trang", "C. Không gây cười", "D. Viết bằng chữ Nôm"], "answer": "B", "explain": "Đây là tùy bút ghi chép sự thật, không phải truyện hư cấu mua vui."}, {"type": "mcq", "level": "NB", "q": "Phạm Đình Hổ sống vào thời kì nào?", "options": ["A. Thời Hùng Vương", "B. Thời Lý – Trần", "C. Cuối thời Lê – đầu thời Nguyễn (1768–1839)", "D. Sau năm 1975"], "answer": "C", "explain": "Phạm Đình Hổ (1768–1839) sống cuối Lê – đầu Nguyễn."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Anh Ba định mở quán cà phê. Bạn bảo nên bán thêm trà sữa, anh nghe. Chị hàng xóm bảo nên bán cơm trưa, anh nghe. Ông bạn già bảo nên làm quán nhậu, anh cũng nghe. Cuối cùng quán anh treo biển: ‘Cà phê – trà sữa – cơm trưa – nhậu bình dân’. Khách nhìn biển hoa cả mắt rồi... đi thẳng.” Mẩu chuyện trên gợi nhớ đến truyện cười nào đã học?", "options": ["A. Lợn cưới, áo mới", "B. Chuyện cũ trong phủ chúa Trịnh", "C. Thạch Sanh", "D. Treo biển"], "answer": "D", "explain": "Nghe ai cũng theo, treo biển loạn xạ — giống “Treo biển”."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Anh Ba định mở quán cà phê. Bạn bảo nên bán thêm trà sữa, anh nghe. Chị hàng xóm bảo nên bán cơm trưa, anh nghe. Ông bạn già bảo nên làm quán nhậu, anh cũng nghe. Cuối cùng quán anh treo biển: ‘Cà phê – trà sữa – cơm trưa – nhậu bình dân’. Khách nhìn biển hoa cả mắt rồi... đi thẳng.” Bài học rút ra từ mẩu chuyện là gì?", "options": ["A. Nên mở quán to", "B. Không nên treo biển", "C. Cần có chính kiến, không nghe theo mọi lời khuyên một cách mù quáng", "D. Nên bán nhiều món"], "answer": "C", "explain": "Thiếu chính kiến dẫn đến thất bại — như anh treo biển."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Anh Ba định mở quán cà phê. Bạn bảo nên bán thêm trà sữa, anh nghe. Chị hàng xóm bảo nên bán cơm trưa, anh nghe. Ông bạn già bảo nên làm quán nhậu, anh cũng nghe. Cuối cùng quán anh treo biển: ‘Cà phê – trà sữa – cơm trưa – nhậu bình dân’. Khách nhìn biển hoa cả mắt rồi... đi thẳng.” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Anh Ba là người có chính kiến vững vàng.", "b) Chi tiết tấm biển dài ngoằng gây cười bằng tình huống tréo ngoe.", "c) Mẩu chuyện phê phán thói “đẽo cày giữa đường”."], "answers": ["S", "T", "T"], "explain": "a sai (anh Ba nghe ai cũng theo); b, c đúng."}, {"type": "short", "level": "VD", "q": "“Vũ trung tùy bút” là tác phẩm của ai? Nêu ý nghĩa của đoạn trích “Chuyện cũ trong phủ chúa Trịnh”.", "answer": "Của Phạm Đình Hổ. Ý nghĩa: phê phán lối sống xa hoa, sự thối nát của chính quyền phong kiến; thể hiện tấm lòng thương dân; là tư liệu lịch sử quý.", "explain": "Chấm theo ý: đúng tác giả; nêu được ý nghĩa phê phán và giá trị."}, {"type": "short", "level": "TH", "q": "“Chơi chữ” là gì? Tự đặt một ví dụ về chơi chữ gây cười.", "answer": "Chơi chữ là lợi dụng từ nhiều nghĩa, từ đồng âm, nói lái để gây cười. Ví dụ: “Con ngựa đá con ngựa đá”; “đồng hồ nước”.", "explain": "Chấm theo ý: giải thích đúng; ví dụ thể hiện được từ nhiều nghĩa."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Tiếng cười trong truyện cười dân gian có tác dụng gì?", "options": ["A. Ru ngủ", "B. Vừa giải trí vừa phê phán thói hư tật xấu", "C. Dọa nạt", "D. Không có tác dụng gì"], "answer": "D", "explain": "Cười xong, người đọc nhận ra thói xấu đáng chê."}, {"type": "mcq", "level": "NB", "q": "Cụm từ “đẽo cày giữa đường” gần nghĩa nhất với nội dung truyện nào?", "options": ["A. Lợn cưới, áo mới", "B. Treo biển", "C. Chuyện cũ trong phủ chúa Trịnh", "D. Thạch Sanh"], "answer": "A", "explain": "“Đẽo cày giữa đường” chỉ người thiếu chính kiến như chủ quán treo biển."}, {"type": "mcq", "level": "TH", "q": "Thủ pháp phóng đại trong truyện cười có tác dụng gì?", "options": ["A. Làm truyện dài hơn", "B. Thổi phồng cái lố bịch để gây cười", "C. Che giấu nhân vật", "D. Làm truyện khó hiểu"], "answer": "B", "explain": "Phóng đại thổi phồng cái xấu lên quá mức khiến ai cũng buồn cười."}, {"type": "mcq", "level": "NB", "q": "Truyện cười dân gian do ai sáng tác?", "options": ["A. Vua quan", "B. Nhân dân lao động", "C. Người nước ngoài", "D. Máy móc"], "answer": "C", "explain": "Truyện cười dân gian là sáng tác tập thể của nhân dân lao động."}, {"type": "mcq", "level": "TH", "q": "Khi kể lại một truyện cười bằng lời của mình, cần chú ý điều gì?", "options": ["A. Kể thật dài", "B. Thêm nhiều nhân vật mới", "C. Đổi tên truyện", "D. Giữ được tình huống và chi tiết gây cười của truyện"], "answer": "D", "explain": "Kể lại phải giữ được “linh hồn” gây cười của truyện."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Mẹ chia cho hai anh em một chiếc bánh. Anh Hai nhanh tay bẻ một miếng to đùng, miệng nói: ‘Em còn nhỏ, ăn ít thôi cho... dễ tiêu!’ Cậu em nhìn miếng bánh tí hon của mình, thở dài: ‘Anh thương em quá, thương đến mức... ăn hộ phần em luôn!’” Mẩu chuyện trên châm biếm thói xấu nào?", "options": ["A. Hào phóng", "B. Tham lam, ích kỷ", "C. Chăm chỉ", "D. Thật thà"], "answer": "B", "explain": "Anh Hai bẻ miếng to, ngụy biện “ăn hộ” — thói tham lam."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Mẹ chia cho hai anh em một chiếc bánh. Anh Hai nhanh tay bẻ một miếng to đùng, miệng nói: ‘Em còn nhỏ, ăn ít thôi cho... dễ tiêu!’ Cậu em nhìn miếng bánh tí hon của mình, thở dài: ‘Anh thương em quá, thương đến mức... ăn hộ phần em luôn!’” Câu nói “thương đến mức... ăn hộ phần em luôn!” có sắc thái gì?", "options": ["A. Mỉa mai, châm biếm sự ngụy biện của anh Hai", "B. Khen ngợi", "C. An ủi", "D. Cảm động"], "answer": "A", "explain": "Lời cậu em đầy mỉa mai trước sự tham lam ngụy biện."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Mẹ chia cho hai anh em một chiếc bánh. Anh Hai nhanh tay bẻ một miếng to đùng, miệng nói: ‘Em còn nhỏ, ăn ít thôi cho... dễ tiêu!’ Cậu em nhìn miếng bánh tí hon của mình, thở dài: ‘Anh thương em quá, thương đến mức... ăn hộ phần em luôn!’” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Mẩu chuyện châm biếm thói tham lam.", "b) Anh Hai thực sự thương em.", "c) Cách gây cười là tình huống oái oăm kết hợp lời nói mỉa mai."], "answers": ["T", "S", "T"], "explain": "a đúng; b sai (chỉ ngụy biện); c đúng."}, {"type": "short", "level": "VD", "q": "Phân biệt truyện cười dân gian (“Lợn cưới, áo mới”) với tùy bút (“Chuyện cũ trong phủ chúa Trịnh”) ở hai điểm.", "answer": "Truyện cười dân gian: hư cấu, ngắn, giọng hóm hỉnh mua vui. Tùy bút: ghi chép chuyện có thật, giọng vừa hài hước vừa nghiêm trang, có giá trị tư liệu.", "explain": "Chấm theo ý: phân biệt được hư cấu/thật và giọng điệu."}, {"type": "short", "level": "TH", "q": "“Tình huống oái oăm” là gì? Lấy một ví dụ từ truyện đã học.", "answer": "Là tình huống tréo ngoe, “gậy ông đập lưng ông”. Ví dụ: trong “Lợn cưới, áo mới”, hỏi lợn mà cốt khoe lợn, trả lời mà cốt khoe áo.", "explain": "Chấm theo ý: giải thích đúng; ví dụ phù hợp."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Nhan đề “Vũ trung tùy bút” có nghĩa là gì?", "options": ["A. Tùy bút viết trong những ngày mưa", "B. Bút ký về vũ trụ", "C. Truyện về mưa", "D. Thơ về mùa thu"], "answer": "A", "explain": "Vũ là mưa, trung là trong: tùy bút viết trong những ngày mưa."}, {"type": "mcq", "level": "TH", "q": "Chi tiết “lợn cưới” gây cười vì sao?", "options": ["A. Vì lợn biết nói", "B. Vì lợn rất đẹp", "C. Vì lợn chạy nhanh", "D. Vì cách nói dễ gây hiểu nhầm, lại đặt cạnh anh chàng cố khoe “áo mới”"], "answer": "D", "explain": "Chơi chữ “lợn cưới” cộng với tình huống hai người cùng khoe."}, {"type": "mcq", "level": "NB", "q": "Truyện “Lợn cưới, áo mới” châm biếm thói xấu nào?", "options": ["A. Lười biếng", "B. Tham lam", "C. Khoe khoang", "D. Keo kiệt"], "answer": "C", "explain": "Cả hai nhân vật đều mắc thói khoe khoang."}, {"type": "mcq", "level": "TH", "q": "Khi đọc một truyện cười, em cần tìm hiểu những gì?", "options": ["A. Số trang của truyện", "B. Tình huống gây cười, đối tượng bị châm biếm và thông điệp", "C. Năm sinh tác giả", "D. Giá tiền cuốn sách"], "answer": "B", "explain": "Đọc truyện cười: tình huống, đối tượng, thông điệp."}, {"type": "mcq", "level": "NB", "q": "Từ “tùy bút” có nghĩa là gì?", "options": ["A. Ghi chép tùy theo cảm hứng, những điều mắt thấy tai nghe", "B. Bút chì", "C. Viết thư", "D. Làm thơ"], "answer": "A", "explain": "Tùy bút là thể văn ghi chép tự do theo cảm hứng."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Thấy mẹ sai quét nhà, Tũn nảy ra ‘sáng kiến’: mở quạt thật to cho bụi bay hết ra cửa. Bụi bay mù mịt, bám đầy vào mâm cơm vừa dọn. Mẹ nhìn mâm cơm phủ bụi, ‘khen’: ‘Con thông minh thật, một công đôi việc: khỏi quét nhà, khỏi... ăn cơm!’” “Sáng kiến” của Tũn gây cười vì sao?", "options": ["A. Rất thông minh", "B. Giúp nhà sạch", "C. Tiết kiệm thời gian", "D. Là mẹo vặt lười biếng phản tác dụng: bụi bay vào mâm cơm"], "answer": "D", "explain": "Lười quét nhà, dùng quạt thổi bụi — kết quả phản tác dụng."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Thấy mẹ sai quét nhà, Tũn nảy ra ‘sáng kiến’: mở quạt thật to cho bụi bay hết ra cửa. Bụi bay mù mịt, bám đầy vào mâm cơm vừa dọn. Mẹ nhìn mâm cơm phủ bụi, ‘khen’: ‘Con thông minh thật, một công đôi việc: khỏi quét nhà, khỏi... ăn cơm!’” Câu nói của mẹ “khỏi quét nhà, khỏi... ăn cơm!” thuộc lối nói nào?", "options": ["A. Khen thật lòng", "B. An ủi", "C. Nói mát, mỉa mai", "D. Dặn dò"], "answer": "C", "explain": "Mẹ “khen” mà thực ra mỉa mai — lối nói mát."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Thấy mẹ sai quét nhà, Tũn nảy ra ‘sáng kiến’: mở quạt thật to cho bụi bay hết ra cửa. Bụi bay mù mịt, bám đầy vào mâm cơm vừa dọn. Mẹ nhìn mâm cơm phủ bụi, ‘khen’: ‘Con thông minh thật, một công đôi việc: khỏi quét nhà, khỏi... ăn cơm!’” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Mẩu chuyện châm biếm thói lười biếng, khôn vặt.", "b) Mẹ thực sự khen Tũn thông minh.", "c) Bài học: làm việc cần chăm chỉ, không nên khôn vặt."], "answers": ["T", "S", "T"], "explain": "a đúng; b sai (nói mát); c đúng."}, {"type": "short", "level": "VD", "q": "Vì sao truyện cười dân gian được gọi là “tiếng cười trí tuệ của nhân dân”? Nêu hai tác dụng của tiếng cười trong truyện cười.", "answer": "Vì nhân dân dùng sự hóm hỉnh, thông minh để phê phán cái xấu. Hai tác dụng: giải trí, mua vui; phê phán thói hư tật xấu, răn đời.", "explain": "Chấm theo ý: giải thích được “trí tuệ”; nêu được 2 tác dụng."}, {"type": "short", "level": "TH", "q": "Kể tên hai truyện cười dân gian đã học và nêu đối tượng châm biếm của mỗi truyện.", "answer": "“Lợn cưới, áo mới”: thói khoe khoang. “Treo biển”: người thiếu chính kiến.", "explain": "Chấm theo ý: đúng tên truyện và đối tượng tương ứng."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Câu nào dưới đây là ví dụ của lối chơi chữ?", "options": ["A. Hôm nay trời đẹp", "B. Con ngựa đá con ngựa đá (từ “đá” vừa là động từ vừa là danh từ)", "C. Em đi học", "D. Mẹ nấu cơm"], "answer": "B", "explain": "“Đá” hai nghĩa: đá (động từ) và đá (hòn đá) — chơi chữ đồng âm."}, {"type": "mcq", "level": "TH", "q": "“Chuyện cũ trong phủ chúa Trịnh” thể hiện tình cảm nào của tác giả?", "options": ["A. Vô cảm", "B. Yêu thiên nhiên", "C. Ghét trẻ em", "D. Thương dân, bất bình trước cảnh xa hoa lãng phí"], "answer": "A", "explain": "Đằng sau tiếng cười chua chát là tấm lòng thương dân."}, {"type": "mcq", "level": "NB", "q": "“Phủ chúa” trong truyện là nơi ở của ai?", "options": ["A. Vua Lê", "B. Chúa Trịnh – người nắm quyền lực ở Đàng Ngoài", "C. Người nông dân", "D. Thầy đồ"], "answer": "D", "explain": "Phủ chúa là nơi ở và làm việc của chúa Trịnh."}, {"type": "mcq", "level": "NB", "q": "Tập “Vũ trung tùy bút” được viết bằng chữ gì?", "options": ["A. Chữ Nôm", "B. Chữ Quốc ngữ", "C. Chữ Hán", "D. Chữ Pháp"], "answer": "C", "explain": "Vũ trung tùy bút viết bằng chữ Hán."}, {"type": "mcq", "level": "TH", "q": "Bài học rút ra từ truyện “Treo biển” là gì?", "options": ["A. Nên treo nhiều biển", "B. Cần có chính kiến, biết phân biệt đúng sai, không nghe theo mù quáng", "C. Không nên bán cá", "D. Nên gỡ biển hiệu"], "answer": "B", "explain": "Truyện răn người thiếu lập trường, “đẽo cày giữa đường”."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Để được điểm cao môn Văn, Sửu ngày nào cũng khen cô giáo: ‘Cô giảng hay nhất trường!’ Hôm kiểm tra, cậu vẫn bị điểm 4 vì bài viết lạc đề. Cậu tiu nghỉu: ‘Hóa ra lời khen của em chỉ có tác dụng... với em!’” Mẩu chuyện trên châm biếm thói xấu nào?", "options": ["A. Nịnh hót để cầu lợi", "B. Chăm học", "C. Thật thà", "D. Dũng cảm"], "answer": "A", "explain": "Sửu nịnh cô để mong điểm cao — thói nịnh hót."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Để được điểm cao môn Văn, Sửu ngày nào cũng khen cô giáo: ‘Cô giảng hay nhất trường!’ Hôm kiểm tra, cậu vẫn bị điểm 4 vì bài viết lạc đề. Cậu tiu nghỉu: ‘Hóa ra lời khen của em chỉ có tác dụng... với em!’” Chi tiết gây cười nhất trong mẩu chuyện là gì?", "options": ["A. Sửu khen cô", "B. Cô giảng hay", "C. Bài kiểm tra khó", "D. Sửu bị điểm 4 vì lạc đề dù nịnh nọt — “gậy ông đập lưng ông”"], "answer": "D", "explain": "Nịnh bao nhiêu cũng không cứu được bài lạc đề — tréo ngoe."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Để được điểm cao môn Văn, Sửu ngày nào cũng khen cô giáo: ‘Cô giảng hay nhất trường!’ Hôm kiểm tra, cậu vẫn bị điểm 4 vì bài viết lạc đề. Cậu tiu nghỉu: ‘Hóa ra lời khen của em chỉ có tác dụng... với em!’” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Mẩu chuyện châm biếm thói nịnh hót trong học đường.", "b) Lời khen chân thành cũng đáng chê như lời nịnh.", "c) Bài học: muốn điểm cao phải học thật, không thể nịnh bợ."], "answers": ["T", "S", "T"], "explain": "a đúng; b sai (chỉ chê lời nịnh giả tạo); c đúng."}, {"type": "short", "level": "TH", "q": "Nêu bài học em rút ra từ truyện “Lợn cưới, áo mới”.", "answer": "Nên sống giản dị, chân thành, khiêm tốn; đừng khoe khoang lố bịch kẻo thành trò cười.", "explain": "Chấm theo ý: bài học về chống khoe khoang, sống khiêm tốn."}, {"type": "short", "level": "VD", "q": "Chi tiết nào trong truyện “Treo biển” gây cười nhất? Vì sao?", "answer": "Chi tiết cuối: gỡ luôn cả tấm biển. Vì tréo ngoe, bất ngờ: sửa mãi thành ra mất cả biển hiệu.", "explain": "Chấm theo ý: chỉ ra chi tiết; giải thích được sự tréo ngoe."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Yếu tố nào tạo nên tiếng cười trong truyện cười?", "options": ["A. Tình huống bình thường", "B. Nhân vật đẹp", "C. Tình huống bất ngờ, tréo ngoe", "D. Truyện thật dài"], "answer": "C", "explain": "Tình huống bất ngờ, tréo ngoe là “mồi” của tiếng cười."}, {"type": "mcq", "level": "TH", "q": "“Nói lái” là cách chơi chữ như thế nào?", "options": ["A. Nói thật to", "B. Đổi chỗ âm hoặc vần để tạo từ mới gây cười", "C. Nói nhỏ", "D. Nói lắp"], "answer": "B", "explain": "Nói lái đảo âm/vần tạo nghĩa mới hài hước."}, {"type": "mcq", "level": "NB", "q": "Trong “Lợn cưới, áo mới”, anh mặc áo mới khoe khoang bằng cách nào?", "options": ["A. Cố ý nhấn mạnh “từ lúc tôi mặc cái áo mới này”", "B. Im lặng", "C. Giấu áo đi", "D. Cho áo người khác"], "answer": "A", "explain": "Anh ta cố tình nhắc đi nhắc lại chữ “áo mới”."}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau giữa truyện cười và truyện cổ tích là gì?", "options": ["A. Không có điểm nào khác", "B. Truyện cười ngắn, gây cười, phê phán; cổ tích thường dài, có yếu tố thần kì, gửi gắm ước mơ", "C. Truyện cười dài hơn", "D. Cổ tích không có nhân vật"], "answer": "D", "explain": "Truyện cười: ngắn, hài, phê phán; cổ tích: thần kì, ước mơ."}, {"type": "mcq", "level": "NB", "q": "Nhân vật chính trong “Chuyện cũ trong phủ chúa Trịnh” là ai?", "options": ["A. Người nông dân", "B. Chúa Trịnh và bọn quan lại xung quanh", "C. Em bé", "D. Thầy giáo"], "answer": "C", "explain": "Đoạn trích vẽ lại cảnh xa hoa trong phủ chúa và bọn quan lại nịnh bợ."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Ông Tư ít học nhưng thích dùng chữ nho. Ông dặn con: ‘Mày phải cần cù bù... siêng năng!’ Cả nhà cười ồ vì hai từ ấy nghĩa như nhau. Ông gãi đầu: ‘Tao nói chữ cho nó... sang!’” Nhân vật ông Tư gây cười vì điều gì?", "options": ["A. Học giỏi", "B. Nói ít", "C. Dốt mà thích dùng chữ nho, nói sai mà tưởng là sang", "D. Khiêm tốn"], "answer": "C", "explain": "“Cần cù bù siêng năng” — hai từ đồng nghĩa, khoe chữ thành khoe dốt."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Ông Tư ít học nhưng thích dùng chữ nho. Ông dặn con: ‘Mày phải cần cù bù... siêng năng!’ Cả nhà cười ồ vì hai từ ấy nghĩa như nhau. Ông gãi đầu: ‘Tao nói chữ cho nó... sang!’” Cách gây cười trong mẩu chuyện gần với truyện nào đã học?", "options": ["A. Treo biển", "B. Lợn cưới, áo mới (khoe khoang, lố bịch)", "C. Chuyện cũ trong phủ chúa Trịnh", "D. Không truyện nào"], "answer": "B", "explain": "Khoe chữ như khoe của — cùng thói khoe khoang lố bịch."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Ông Tư ít học nhưng thích dùng chữ nho. Ông dặn con: ‘Mày phải cần cù bù... siêng năng!’ Cả nhà cười ồ vì hai từ ấy nghĩa như nhau. Ông gãi đầu: ‘Tao nói chữ cho nó... sang!’” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Mẩu chuyện châm biếm kẻ dốt mà hay khoe chữ.", "b) Ông Tư dùng từ rất chính xác.", "c) Bài học: không biết thì học hỏi, đừng khoe khoang lố bịch."], "answers": ["T", "S", "T"], "explain": "a đúng; b sai (“cần cù”, “siêng năng” trùng nghĩa); c đúng."}, {"type": "short", "level": "VD", "q": "Nêu giá trị của đoạn trích “Chuyện cũ trong phủ chúa Trịnh”.", "answer": "Giá trị phê phán: vạch trần sự xa hoa, thối nát của chính quyền phong kiến. Giá trị tư liệu: ghi chép chân thực một giai đoạn lịch sử.", "explain": "Chấm theo ý: nêu được giá trị nội dung và giá trị tư liệu."}, {"type": "short", "level": "TH", "q": "Giải thích nghĩa của nhan đề “Vũ trung tùy bút”.", "answer": "“Vũ” là mưa, “trung” là trong: tập tùy bút được viết trong những ngày mưa.", "explain": "Chấm theo ý: giải thích đúng từng chữ và cả cụm."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "Vì sao truyện cười dân gian được gọi là “tiếng cười trí tuệ của nhân dân”?", "options": ["A. Vì rất dài", "B. Vì do vua viết", "C. Vì nhân dân dùng sự hóm hỉnh, thông minh để phê phán cái xấu", "D. Vì không ai hiểu"], "answer": "D", "explain": "Tiếng cười dân gian vừa thông minh vừa sâu sắc."}, {"type": "mcq", "level": "NB", "q": "Truyện “Treo biển” kết thúc như thế nào?", "options": ["A. Biển hiệu to hơn", "B. Chủ quán giàu lên", "C. Gỡ luôn cả tấm biển", "D. Mở thêm cửa hàng"], "answer": "C", "explain": "Sửa mãi, cuối cùng gỡ cả biển — kết thúc bất ngờ gây cười."}, {"type": "mcq", "level": "TH", "q": "Chi tiết nào cho thấy nhân vật treo biển thiếu chính kiến?", "options": ["A. Treo biển đẹp", "B. Ai góp ý cũng cho là phải và sửa theo ngay", "C. Bán cá tươi", "D. Cửa hàng đông khách"], "answer": "B", "explain": "Nghe ai cũng cho là phải chính là thiếu chính kiến."}, {"type": "mcq", "level": "NB", "q": "Thái độ của tác giả trong “Chuyện cũ trong phủ chúa Trịnh” là gì?", "options": ["A. Vui vẻ hoàn toàn", "B. Vừa hài hước vừa nghiêm trang, xót xa", "C. Vô cảm", "D. Sợ hãi"], "answer": "A", "explain": "Giọng văn vừa châm biếm vừa chứa nỗi xót xa, bất bình."}, {"type": "mcq", "level": "TH", "q": "Đoạn trích “Chuyện cũ trong phủ chúa Trịnh” còn có giá trị gì ngoài tiếng cười?", "options": ["A. Không có giá trị gì", "B. Là tư liệu quý về một giai đoạn lịch sử cuối thời Lê – Trịnh", "C. Dạy nấu ăn", "D. Dạy võ"], "answer": "D", "explain": "Tùy bút ghi chép sự thật nên có giá trị tư liệu lịch sử."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bác Kẹo nổi tiếng keo kiệt. Khách đến chơi, bác rót chén trà loãng như nước lã, miệng nói: ‘Trà nhạt uống mới... thanh tao!’ Khách uống một ngụm, gật gù: ‘Vâng, thanh tao đến mức cháu tưởng mình đang uống... nước lọc!’” Mẩu chuyện trên châm biếm thói xấu nào?", "options": ["A. Hào phóng", "B. Chăm chỉ", "C. Thật thà", "D. Keo kiệt"], "answer": "D", "explain": "Trà loãng như nước lã mà bảo “thanh tao” — keo kiệt."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bác Kẹo nổi tiếng keo kiệt. Khách đến chơi, bác rót chén trà loãng như nước lã, miệng nói: ‘Trà nhạt uống mới... thanh tao!’ Khách uống một ngụm, gật gù: ‘Vâng, thanh tao đến mức cháu tưởng mình đang uống... nước lọc!’” Câu nói của bác Kẹo “Trà nhạt uống mới... thanh tao!” là lối nói gì?", "options": ["A. Nói ngược: ngụy biện cho thói keo kiệt", "B. Nói thật", "C. Nói lắp", "D. Hỏi han"], "answer": "A", "explain": "Lấy cớ “thanh tao” để che thói keo kiệt — nói ngược."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bác Kẹo nổi tiếng keo kiệt. Khách đến chơi, bác rót chén trà loãng như nước lã, miệng nói: ‘Trà nhạt uống mới... thanh tao!’ Khách uống một ngụm, gật gù: ‘Vâng, thanh tao đến mức cháu tưởng mình đang uống... nước lọc!’” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Mẩu chuyện châm biếm thói keo kiệt.", "b) Vị khách thực sự khen trà ngon.", "c) Lời đáp của khách đầy mỉa mai: “tưởng mình đang uống nước lọc”. "], "answers": ["T", "S", "T"], "explain": "a đúng; b sai (khách mỉa mai); c đúng."}, {"type": "short", "level": "VD", "q": "Tự sáng tác một mẩu truyện cười ngắn (4–5 câu) về thói lười biếng.", "answer": "Ví dụ: “Thấy mẹ sai quét nhà, Tũn mở quạt to cho bụi bay ra cửa. Bụi bay mù mịt bám vào mâm cơm. Mẹ ‘khen’: ‘Khỏi quét nhà, khỏi ăn cơm!’” (Chấp nhận mọi sáng tác có tình huống gây cười về thói lười.)", "explain": "Chấm theo ý: có tình huống gây cười; đối tượng là thói lười biếng."}, {"type": "short", "level": "TH", "q": "Nêu hai điểm khác nhau giữa truyện cười dân gian và truyện cổ tích.", "answer": "Truyện cười ngắn, gây cười, phê phán thói hư tật xấu; truyện cổ tích thường dài hơn, có yếu tố thần kì, gửi gắm ước mơ của nhân dân.", "explain": "Chấm theo ý: nêu được 2 điểm khác nhau hợp lý."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Truyện cười thường có độ dài như thế nào?", "options": ["A. Ngắn gọn", "B. Rất dài", "C. Vừa dài vừa khó", "D. Không có chữ"], "answer": "A", "explain": "Truyện cười ngắn gọn, đi thẳng vào tình huống."}, {"type": "mcq", "level": "NB", "q": "“Lợn cưới, áo mới” là truyện của ai?", "options": ["A. Nguyễn Du", "B. Dân gian", "C. Phạm Đình Hổ", "D. Hồ Xuân Hương"], "answer": "B", "explain": "Đây là truyện cười dân gian."}, {"type": "mcq", "level": "TH", "q": "Tình huống oái oăm trong “Lợn cưới, áo mới” là gì?", "options": ["A. Lợn bị mất", "B. Áo bị rách", "C. Trời mưa", "D. Cả hai cùng cố khoe, hỏi lợn mà khoe lợn, trả lời mà khoe áo"], "answer": "D", "explain": "Tréo ngoe ở chỗ ai cũng nhân cơ hội để khoe của mình."}, {"type": "mcq", "level": "NB", "q": "Tác phẩm “Vũ trung tùy bút” thuộc thể loại nào?", "options": ["A. Truyện cười", "B. Thơ", "C. Tùy bút", "D. Tiểu thuyết"], "answer": "C", "explain": "Đúng như tên gọi, đây là tập tùy bút."}, {"type": "mcq", "level": "TH", "q": "Viết đoạn văn cảm nhận về một truyện cười cần có những ý nào?", "options": ["A. Chỉ kể lại truyện", "B. Nêu tình huống và chi tiết gây cười, phân tích ý nghĩa, rút ra bài học", "C. Chép nguyên truyện", "D. Chỉ nêu tên truyện"], "answer": "A", "explain": "Cảm nhận cần phân tích chi tiết gây cười và ý nghĩa."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bác Đãng hay quên nổi tiếng. Một hôm bác hớt hải chạy đi tìm chìa khóa khắp nhà, lục tung mọi thứ. Vợ bác chỉ tay: ‘Chìa khóa ở... tay ông kia kìa!’ Bác nhìn xuống, chìa khóa nằm gọn trong lòng bàn tay mình từ lúc nào.” Mẩu chuyện trên gây cười bằng cách nào?", "options": ["A. Chơi chữ", "B. Phóng đại", "C. Tình huống oái oăm: tìm chìa khóa khắp nơi mà nó nằm ngay trong tay", "D. Tả cảnh"], "answer": "C", "explain": "Tìm khắp nhà, hóa ra ở trong tay — tréo ngoe."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bác Đãng hay quên nổi tiếng. Một hôm bác hớt hải chạy đi tìm chìa khóa khắp nhà, lục tung mọi thứ. Vợ bác chỉ tay: ‘Chìa khóa ở... tay ông kia kìa!’ Bác nhìn xuống, chìa khóa nằm gọn trong lòng bàn tay mình từ lúc nào.” Nhân vật bác Đãng đại diện cho tật xấu nào?", "options": ["A. Khoe khoang", "B. Tham lam", "C. Nịnh hót", "D. Hay quên, đãng trí"], "answer": "D", "explain": "Bác Đãng — cái tên đã nói lên tật hay quên."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bác Đãng hay quên nổi tiếng. Một hôm bác hớt hải chạy đi tìm chìa khóa khắp nhà, lục tung mọi thứ. Vợ bác chỉ tay: ‘Chìa khóa ở... tay ông kia kìa!’ Bác nhìn xuống, chìa khóa nằm gọn trong lòng bàn tay mình từ lúc nào.” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Mẩu chuyện châm biếm tật đãng trí.", "b) Tiếng cười trong truyện nhẹ nhàng, không ác ý.", "c) Mẩu chuyện phê phán thói khoe khoang."], "answers": ["T", "T", "S"], "explain": "a, b đúng; c sai."}, {"type": "short", "level": "TH", "q": "Tìm một điểm giống nhau giữa “Lợn cưới, áo mới” và “Treo biển”.", "answer": "Đều là truyện cười dân gian; đều châm biếm thói hư tật xấu bằng tình huống tréo ngoe, gây cười nhẹ nhàng mà thấm thía.", "explain": "Chấm theo ý: chỉ ra được điểm chung hợp lý."}, {"type": "short", "level": "VD", "q": "Nêu dàn ý cho đoạn văn cảm nhận về một truyện cười đã học.", "answer": "Giới thiệu truyện → tóm tắt tình huống → phân tích chi tiết gây cười → nêu ý nghĩa, bài học → liên hệ bản thân.", "explain": "Chấm theo ý: đủ các bước cơ bản của dàn ý."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Nhận định nào SAI về truyện cười?", "options": ["A. Truyện cười ngắn gọn", "B. Truyện cười chỉ để giải trí, không có ý nghĩa phê phán", "C. Truyện cười tạo tiếng cười qua tình huống", "D. Nhân vật truyện cười thường đại diện cho thói xấu"], "answer": "B", "explain": "Truyện cười bao giờ cũng vừa giải trí vừa phê phán."}, {"type": "mcq", "level": "NB", "q": "Lối chơi chữ thường dựa vào điều gì?", "options": ["A. Tranh vẽ", "B. Từ nhiều nghĩa, từ đồng âm", "C. Nhạc điệu", "D. Màu sắc"], "answer": "D", "explain": "Chơi chữ lợi dụng từ nhiều nghĩa, đồng âm, nói lái."}, {"type": "mcq", "level": "NB", "q": "Nhân vật “anh treo biển” tượng trưng cho kiểu người nào?", "options": ["A. Người thiếu chính kiến, ai nói cũng nghe", "B. Người kiên định", "C. Người thông minh", "D. Người dũng cảm"], "answer": "A", "explain": "Anh treo biển là điển hình của “đẽo cày giữa đường”."}, {"type": "mcq", "level": "TH", "q": "“Chuyện cũ trong phủ chúa Trịnh” có những giá trị nào?", "options": ["A. Chỉ gây cười", "B. Phê phán xã hội phong kiến thối nát, đồng thời là tư liệu lịch sử quý", "C. Dạy làm giàu", "D. Không có giá trị"], "answer": "C", "explain": "Vừa phê phán vừa lưu giữ tư liệu lịch sử."}, {"type": "mcq", "level": "NB", "q": "Tiếng cười trong “Lợn cưới, áo mới” có sắc thái nào?", "options": ["A. Chua chát, đau đớn", "B. Nhẹ nhàng, hóm hỉnh", "C. Giận dữ", "D. Sợ hãi"], "answer": "B", "explain": "Truyện cười dân gian cười nhẹ nhàng, hóm hỉnh."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Thấy bạn bè đeo kính cho ‘tri thức’, Mít dù mắt tinh vẫn mua một chiếc kính không độ đeo đi học. Giờ ra chơi, cậu vấp phải bậc thềm vì kính làm mờ tầm nhìn. Bạn bè cười: ‘Tri thức chưa thấy, chỉ thấy... u đầu!’” Mẩu chuyện trên châm biếm hiện tượng nào?", "options": ["A. Học đòi, làm dáng “tri thức” một cách lố bịch", "B. Học giỏi", "C. Chăm chỉ", "D. Tiết kiệm"], "answer": "A", "explain": "Mắt tinh vẫn đeo kính không độ để ra vẻ tri thức — học đòi."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Thấy bạn bè đeo kính cho ‘tri thức’, Mít dù mắt tinh vẫn mua một chiếc kính không độ đeo đi học. Giờ ra chơi, cậu vấp phải bậc thềm vì kính làm mờ tầm nhìn. Bạn bè cười: ‘Tri thức chưa thấy, chỉ thấy... u đầu!’” Câu kết “Tri thức chưa thấy, chỉ thấy... u đầu!” có tác dụng gì?", "options": ["A. Khen Mít", "B. Châm biếm bằng lối nói ngược đầy mỉa mai", "C. An ủi Mít", "D. Tả cảnh"], "answer": "B", "explain": "Đối lập “tri thức” với “u đầu” — mỉa mai sâu cay."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Thấy bạn bè đeo kính cho ‘tri thức’, Mít dù mắt tinh vẫn mua một chiếc kính không độ đeo đi học. Giờ ra chơi, cậu vấp phải bậc thềm vì kính làm mờ tầm nhìn. Bạn bè cười: ‘Tri thức chưa thấy, chỉ thấy... u đầu!’” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Mẩu chuyện châm biếm thói học đòi, làm dáng.", "b) Mít đeo kính vì mắt bị cận.", "c) Bài học: sống thật với mình, đừng làm dáng lố bịch."], "answers": ["T", "S", "T"], "explain": "a đúng; b sai (mắt tinh, kính không độ); c đúng."}, {"type": "short", "level": "VD", "q": "Thủ pháp phóng đại được sử dụng thế nào trong truyện cười? Cho một ví dụ tự đặt.", "answer": "Thổi phồng cái lố lên quá mức để gây cười. Ví dụ: “Anh ta tham ăn đến mức nhìn mâm cỗ như muốn nuốt cả mâm.”", "explain": "Chấm theo ý: nêu đúng cách dùng; ví dụ thể hiện sự thổi phồng."}, {"type": "short", "level": "TH", "q": "Em học được điều gì từ tiếng cười trong các truyện cười đã học?", "answer": "Cười để nhận ra và tránh xa thói hư tật xấu (khoe khoang, thiếu chính kiến...); sống chân thành, khiêm tốn, có lập trường.", "explain": "Chấm theo ý: rút ra được bài học về hoàn thiện bản thân."}]}]}
