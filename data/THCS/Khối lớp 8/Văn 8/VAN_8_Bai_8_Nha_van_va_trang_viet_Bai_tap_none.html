TH", "q": "Đọc đoạn văn sau: “Thân bài là phần triển khai các luận điểm. Mỗi luận điểm thường thành một đoạn văn với câu chủ đề, lí lẽ, dẫn chứng và phân tích. Các luận điểm sắp xếp theo trình tự hợp lí.”\nXét tính đúng sai:", "statements": ["a) Thân bài là nơi triển khai các luận điểm.", "b) Mỗi luận điểm cần có lí lẽ, dẫn chứng và phân tích.", "c) Các luận điểm sắp xếp tùy ý, không cần trình tự."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng. c) Sai – các luận điểm cần sắp xếp theo trình tự hợp lí."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Kết bài không phải là nhắc lại máy móc những gì đã viết, mà là nâng lên một tầm khái quát mới: khẳng định giá trị tác phẩm và gửi gắm cảm nghĩ của người viết.”\nTheo đoạn văn, kết bài hay là kết bài như thế nào?", "explain": "Kết bài nâng vấn đề lên tầm khái quát, khẳng định giá trị và cảm nghĩ.", "options": ["A. Nhắc lại máy móc thân bài", "B. Khẳng định giá trị, gửi gắm cảm nghĩ ở tầm khái quát mới", "C. Mở thêm vấn đề mới", "D. Dừng đột ngột"], "answer": "B"}, {"type": "short", "level": "VD", "q": "Nêu hai thao tác lập luận thường dùng trong nghị luận văn học.", "answer": "Phân tích, chứng minh (hoặc so sánh, bình luận, giải thích).", "explain": "Chấm theo ý: nêu đúng tên hai thao tác lập luận."}, {"type": "short", "level": "VD", "q": "Thân bài của bài văn nghị luận về một bài thơ thường triển khai theo trình tự nào?", "answer": "Khái quát tác phẩm – phân tích theo các luận điểm (nội dung, nghệ thuật) – đánh giá chung.", "explain": "Chấm theo ý: nêu được trình tự triển khai hợp lí của thân bài."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "TH", "q": "Phép so sánh trong nghị luận văn học có tác dụng gì?", "explain": "So sánh giúp làm nổi bật đặc điểm của đối tượng qua tương đồng và khác biệt.", "options": ["A. Gây nhầm lẫn", "B. Kéo dài bài viết", "C. Làm nổi bật đặc điểm đối tượng qua sự tương đồng, khác biệt", "D. Thay cho dẫn chứng"], "answer": "C"}, {"type": "mcq", "level": "NB", "q": "Dẫn chứng trong nghị luận văn học thường là gì?", "explain": "Dẫn chứng nghị luận văn học chủ yếu lấy từ chính văn bản tác phẩm.", "options": ["A. Câu chuyện ngoài đời", "B. Số liệu thống kê", "C. Lời đồn đại", "D. Chi tiết, hình ảnh, câu thơ, lời văn trong tác phẩm"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Khi trích dẫn thơ trong bài văn, cần chú ý điều gì?", "explain": "Trích dẫn phải chính xác, ngắn gọn, đặt trong ngoặc kép và gắn với phân tích.", "options": ["A. Trích chính xác, ngắn gọn, đặt trong ngoặc kép", "B. Trích càng dài càng tốt", "C. Trích không cần chính xác", "D. Không cần ghi rõ"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "“Cảm thụ cái hay” của tác phẩm văn học nghĩa là gì?", "explain": "Cảm thụ cái hay là nhận ra và lí giải được giá trị đặc sắc của tác phẩm.", "options": ["A. Chép lại đoạn hay", "B. Nhận ra và lí giải được giá trị nội dung, nghệ thuật đặc sắc", "C. Khen chung chung", "D. Thuộc lòng tác phẩm"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Kết bài của bài văn nghị luận cần làm gì?", "explain": "Kết bài khẳng định lại vấn đề, nêu cảm nghĩ và đánh giá của người viết.", "options": ["A. Mở thêm vấn đề mới", "B. Kể thêm câu chuyện", "C. Khẳng định lại vấn đề, nêu cảm nghĩ, đánh giá", "D. Dừng đột ngột"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Bạn Mai viết về “Quê hương”: “Tình yêu quê hương của Tế Hanh thấm thía qua từng hình ảnh: con thuyền ra khơi, cánh buồm no gió, vị mặn mòi của biển. Đó không phải là tình yêu ồn ào mà là nỗi nhớ da diết của người con xa quê.”\nNhận xét nào đúng về đoạn văn của Mai?", "explain": "Đoạn văn có luận điểm (tình yêu quê hương thấm thía) và dẫn chứng cụ thể từ bài thơ.", "options": ["A. Chỉ kể lại nội dung", "B. Không có luận điểm", "C. Toàn là cảm xúc suông", "D. Có luận điểm rõ ràng, có dẫn chứng từ bài thơ"], "answer": "D"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Trích dẫn có hai cách: dẫn trực tiếp (trích nguyên văn trong ngoặc kép) và dẫn gián tiếp (tóm ý bằng lời mình). Dù cách nào cũng phải chính xác và gắn với phân tích.”\nXét tính đúng sai:", "statements": ["a) Dẫn trực tiếp là trích nguyên văn trong ngoặc kép.", "b) Dẫn gián tiếp là tóm ý bằng lời của mình.", "c) Trích dẫn xong không cần phân tích gì thêm."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – trích dẫn phải gắn với phân tích."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Một bài văn hay về “Ông đồ” không dừng ở việc khen thơ hay, mà phải chỉ ra được: hay ở nghệ thuật đối lập, hay ở hình ảnh ông đồ, hay ở nỗi niềm hoài niệm sâu sắc.”\nTheo đoạn văn, bài văn hay cần làm gì?", "explain": "Bài văn hay phải chỉ ra cụ thể cái hay, tránh khen chung chung sáo rỗng.", "options": ["A. Chỉ ra cụ thể cái hay ở nội dung và nghệ thuật", "B. Chỉ khen chung chung", "C. Chép lại bài thơ", "D. Kể tiểu sử tác giả"], "answer": "A"}, {"type": "short", "level": "VD", "q": "Phân biệt dẫn trực tiếp và dẫn gián tiếp khi trích dẫn tác phẩm.", "answer": "Dẫn trực tiếp: trích nguyên văn trong ngoặc kép; dẫn gián tiếp: tóm ý, diễn đạt lại bằng lời của mình.", "explain": "Chấm theo ý: phân biệt được hai cách trích dẫn."}, {"type": "short", "level": "VD", "q": "Nêu một lỗi thường gặp khi viết bài nghị luận văn học và cách khắc phục.", "answer": "Ví dụ: kể lể cốt truyện thay vì phân tích – khắc phục bằng cách bám sát luận điểm, mỗi ý phải có lí lẽ và dẫn chứng.", "explain": "Chấm theo ý: chỉ ra được lỗi cụ thể và cách khắc phục hợp lí."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Muốn bài nghị luận có sức thuyết phục, người viết cần có gì?", "explain": "Ba yếu tố luận điểm, luận cứ, lập luận quyết định sức thuyết phục của bài viết.", "options": ["A. Viết thật dài", "B. Luận điểm rõ ràng, luận cứ xác đáng, lập luận chặt chẽ", "C. Dùng nhiều từ khó", "D. Kể nhiều chuyện"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Thao tác “bình luận” trong nghị luận văn học là gì?", "explain": "Bình luận là thao tác nêu nhận xét, đánh giá về vấn đề bàn luận.", "options": ["A. Kể lại sự việc", "B. Tả cảnh", "C. Nêu nhận xét, đánh giá về vấn đề", "D. Giải thích từ ngữ"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Khi phân tích nhân vật văn học, cần chú ý những mặt nào?", "explain": "Phân tích nhân vật cần toàn diện: ngoại hình, hành động, lời nói, tâm trạng và ý nghĩa.", "options": ["A. Chỉ ngoại hình", "B. Chỉ tên tuổi", "C. Chỉ nghề nghiệp", "D. Ngoại hình, hành động, lời nói, tâm trạng và ý nghĩa hình tượng"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Câu văn nghị luận cần đảm bảo yêu cầu gì?", "explain": "Câu văn nghị luận phải rõ ràng, mạch lạc để thuyết phục người đọc.", "options": ["A. Rõ ràng, mạch lạc, giàu sức thuyết phục", "B. Càng hoa mĩ càng tốt", "C. Càng ngắn càng tốt", "D. Viết theo cảm hứng"], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Đề bài “Cảm nhận về hình ảnh ông đồ trong bài thơ Ông đồ” thuộc kiểu bài nào?", "explain": "Đề yêu cầu cảm nhận về hình ảnh trong tác phẩm thơ nên là nghị luận văn học.", "options": ["A. Nghị luận xã hội", "B. Nghị luận về tác phẩm văn học", "C. Thuyết minh", "D. Tự sự"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Khi viết về nhân vật, đừng chỉ liệt kê: nhân vật A cao, gầy, tốt bụng. Hãy phân tích: chi tiết nào cho thấy nhân vật tốt bụng? Hành động ấy có ý nghĩa gì?”\nĐoạn văn phê phán cách viết nào?", "explain": "Đoạn văn phê phán lối liệt kê chung chung, yêu cầu phân tích sâu chi tiết.", "options": ["A. Viết quá ngắn", "B. Dùng nhiều dẫn chứng", "C. Liệt kê chung chung thay vì phân tích chi tiết", "D. Phân tích quá kĩ"], "answer": "C"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Dàn ý là bản đồ của bài viết. Có dàn ý, em sẽ không bị lạc đề, không bỏ sót ý và biết sắp xếp các luận điểm theo trình tự hợp lí.”\nXét tính đúng sai:", "statements": ["a) Dàn ý giúp bài viết không bị lạc đề.", "b) Dàn ý giúp sắp xếp luận điểm hợp lí.", "c) Viết bài không cần lập dàn ý trước."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – nên lập dàn ý trước khi viết."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Liên hệ mở rộng giúp bài văn sâu sắc hơn: từ hình ảnh ông đồ, em có thể suy nghĩ về việc giữ gìn bản sắc văn hóa dân tộc hôm nay.”\nTheo đoạn văn, liên hệ mở rộng có tác dụng gì?", "explain": "Liên hệ mở rộng gắn tác phẩm với đời sống, làm bài văn sâu sắc hơn.", "options": ["A. Làm bài dài hơn", "B. Thay cho phân tích", "C. Không cần thiết", "D. Làm bài văn sâu sắc hơn, gắn tác phẩm với đời sống"], "answer": "D"}, {"type": "short", "level": "VD", "q": "Nêu dàn ý vắn tắt cho đề “Phân tích khát vọng tự do trong Nhớ rừng”.", "answer": "Mở bài: giới thiệu tác giả, tác phẩm, vấn đề. Thân bài: hoàn cảnh con hổ – đối lập quá khứ/hiện tại – nghệ thuật nhân hóa, so sánh – ý nghĩa khát vọng tự do. Kết bài: khẳng định giá trị.", "explain": "Chấm theo ý: dàn ý đủ ba phần, các ý triển khai hợp lí."}, {"type": "short", "level": "VD", "q": "Vì sao không nên kể lể dài dòng cốt truyện trong bài nghị luận văn học?", "answer": "Vì nhiệm vụ là bàn luận, đánh giá; kể lể làm lu mờ luận điểm, khiến bài viết thiếu sức thuyết phục.", "explain": "Chấm theo ý: chỉ ra được sự khác nhau giữa kể và bàn luận."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Thao tác “giải thích” trong nghị luận văn học dùng để làm gì?", "explain": "Giải thích giúp làm rõ ý nghĩa của vấn đề, khái niệm được bàn luận.", "options": ["A. Làm rõ ý nghĩa của vấn đề, khái niệm", "B. Kể chuyện minh họa", "C. Tả cảnh đẹp", "D. Gây cười"], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Luận điểm thường được diễn đạt bằng loại câu nào?", "explain": "Luận điểm thường là câu khẳng định, rõ ràng, ngắn gọn, dễ chứng minh.", "options": ["A. Câu hỏi tu từ", "B. Câu khẳng định, rõ ràng, ngắn gọn", "C. Câu cảm thán", "D. Câu cầu khiến"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Dẫn chứng lấy từ thực tế đời sống có phù hợp với nghị luận văn học không?", "explain": "Dẫn chứng đời sống chỉ hỗ trợ; dẫn chứng chính của nghị luận văn học phải từ tác phẩm.", "options": ["A. Hoàn toàn không", "B. Chỉ dùng dẫn chứng đời sống", "C. Có thể dùng hỗ trợ, nhưng dẫn chứng chính phải từ tác phẩm", "D. Tùy ý"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Khi viết về một đoạn trích thơ, nên tập trung vào điều gì?", "explain": "Viết về đoạn trích cần đi sâu vào hình ảnh, chi tiết tiêu biểu và ý nghĩa.", "options": ["A. Chép thuộc cả bài", "B. Đếm số câu thơ", "C. Tra tiểu sử tác giả", "D. Những hình ảnh, chi tiết tiêu biểu và ý nghĩa của chúng"], "answer": "D"}, {"type": "mcq", "level": "NB", "q": "Từ nào sau đây thường dùng để chuyển ý giữa các luận điểm?", "explain": "Các từ, cụm từ chuyển ý giúp bài văn liền mạch giữa các luận điểm.", "options": ["A. “Bên cạnh đó”, “Mặt khác”, “Không chỉ... mà còn...”", "B. “Ngày xửa ngày xưa”", "C. “Bỗng nhiên”", "D. “Thế là hết”"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Câu chủ đề là linh hồn của đoạn văn nghị luận. Đọc câu chủ đề, người đọc biết ngay đoạn văn sẽ chứng minh điều gì.”\nTheo đoạn văn, câu chủ đề có vai trò gì?", "explain": "Câu chủ đề nêu luận điểm của đoạn, giúp người đọc nắm được hướng chứng minh.", "options": ["A. Trang trí đoạn văn", "B. Nêu luận điểm của đoạn, định hướng nội dung chứng minh", "C. Kéo dài đoạn văn", "D. Không có vai trò gì"], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Cảm thụ văn học là rung động trước cái đẹp và lí giải được vì sao mình rung động. Cảm thụ phải gắn với dẫn chứng cụ thể, tránh chung chung sáo rỗng.”\nXét tính đúng sai:", "statements": ["a) Cảm thụ là rung động trước cái đẹp của tác phẩm.", "b) Cảm thụ cần lí giải được vì sao mình rung động.", "c) Cảm thụ có thể chung chung, không cần dẫn chứng."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – cảm thụ phải gắn với dẫn chứng cụ thể."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Đọc bài nghị luận mẫu giống như xem thợ giỏi làm việc: em học được cách đặt vấn đề, cách triển khai ý, cách dùng dẫn chứng sao cho thuyết phục.”\nTheo đoạn văn, đọc bài mẫu giúp em điều gì?", "explain": "Đọc bài mẫu giúp học cách đặt vấn đề, triển khai luận điểm và dùng dẫn chứng.", "options": ["A. Để chép lại", "B. Để thuộc lòng", "C. Học cách đặt vấn đề, triển khai ý và dùng dẫn chứng", "D. Không giúp gì"], "answer": "C"}, {"type": "short", "level": "VD", "q": "Nêu ba bước cơ bản khi phân tích một tác phẩm văn học.", "answer": "Đọc kĩ, xác định vấn đề – tìm chi tiết, hình ảnh tiêu biểu – lí giải ý nghĩa và đánh giá giá trị.", "explain": "Chấm theo ý: nêu được trình tự các bước phân tích."}, {"type": "short", "level": "VD", "q": "Em hiểu thế nào là “cảm thụ cái đẹp” trong thơ?", "answer": "Ví dụ: là rung động trước vẻ đẹp của ngôn từ, hình ảnh, nhạc điệu và lí giải được vì sao nó đẹp.", "explain": "Chấm theo ý: nêu được rung động trước cái đẹp và khả năng lí giải."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Văn bản nghị luận văn học thường có giọng điệu như thế nào?", "explain": "Văn nghị luận cần giọng điệu tranh luận, thuyết phục, vừa có lí vừa có tình.", "options": ["A. Hài hước, châm biếm", "B. Buồn bã, bi lụy", "C. Hồn nhiên, ngây thơ", "D. Tranh luận, thuyết phục, có lí có tình"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Việc so sánh hình ảnh con hổ với con người trong bài viết về “Nhớ rừng” thuộc thao tác nào?", "explain": "Đặt hai đối tượng cạnh nhau để làm nổi bật là thao tác so sánh.", "options": ["A. So sánh (lập luận)", "B. Kể chuyện", "C. Miêu tả", "D. Thuyết minh"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Để làm sáng tỏ luận điểm, mỗi đoạn văn trong thân bài nên có gì?", "explain": "Mỗi đoạn cần câu chủ đề, lí lẽ, dẫn chứng và phân tích để làm sáng tỏ luận điểm.", "options": ["A. Chỉ cần dẫn chứng", "B. Câu chủ đề, lí lẽ, dẫn chứng và phân tích", "C. Chỉ cần cảm xúc", "D. Chỉ cần kết luận"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Nhan đề bài văn nghị luận nên như thế nào?", "explain": "Nhan đề nên ngắn gọn và nêu đúng vấn đề nghị luận của bài viết.", "options": ["A. Thật dài", "B. Thật bí ẩn", "C. Ngắn gọn, nêu đúng vấn đề nghị luận", "D. Không cần nhan đề"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Ý kiến “Nhớ rừng là bài thơ yêu nước” có thể dùng làm gì trong bài viết?", "explain": "Đó là một nhận định có thể làm luận điểm, cần được chứng minh bằng dẫn chứng.", "options": ["A. Làm nhan đề duy nhất", "B. Không dùng được", "C. Chỉ để mở bài", "D. Làm luận điểm cần chứng minh bằng dẫn chứng"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Bạn An viết: “Bài “Quê hương” hay vì nó chân thành. Tế Hanh không nói những lời to tát mà chỉ kể về con thuyền, cánh buồm, vị biển mặn mòi – những điều bình dị mà thấm thía.”\nĐiểm mạnh trong cách viết của An là gì?", "explain": "An chỉ ra cụ thể cái hay qua dẫn chứng (con thuyền, cánh buồm, vị biển) thay vì khen suông.", "options": ["A. Chỉ ra cụ thể cái hay qua dẫn chứng, tránh chung chung", "B. Khen rất dài dòng", "C. Chép lại bài thơ", "D. Không có dẫn chứng"], "answer": "A"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Khi viết bài, em nên dùng từ chuyển ý để nối các đoạn: “bên cạnh đó”, “mặt khác”, “không chỉ... mà còn...”. Bài văn nhờ vậy mà liền mạch, rõ ràng.”\nXét tính đúng sai:", "statements": ["a) Từ chuyển ý giúp nối các đoạn văn.", "b) Từ chuyển ý làm bài văn liền mạch hơn.", "c) Bài văn nghị luận không cần từ chuyển ý."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – từ chuyển ý rất cần thiết."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Sửa bài là khâu không thể bỏ qua: đọc lại để kiểm tra luận điểm có rõ không, dẫn chứng có đủ không, câu văn có mạch lạc không.”\nTheo đoạn văn, khi sửa bài cần kiểm tra những gì?", "explain": "Sửa bài cần kiểm tra luận điểm, dẫn chứng và tính mạch lạc.", "options": ["A. Chỉ kiểm tra chữ viết", "B. Luận điểm, dẫn chứng và sự mạch lạc của câu văn", "C. Chỉ đếm số trang", "D. Không cần kiểm tra"], "answer": "B"}, {"type": "short", "level": "VD", "q": "Viết một câu chủ đề cho đoạn văn phân tích nghệ thuật nhân hóa trong “Nhớ rừng”.", "answer": "Ví dụ: Bằng nghệ thuật nhân hóa tài tình, Thế Lữ đã thổi hồn người vào con hổ, khiến tiếng gầm của nó thành tiếng nói của khát vọng tự do.", "explain": "Chấm theo ý: câu văn nêu được luận điểm của đoạn, rõ ràng, có sức gợi."}, {"type": "short", "level": "VD", "q": "Nêu điểm khác nhau giữa “phân tích” và “kể lại” khi viết về tác phẩm.", "answer": "Phân tích: lí giải ý nghĩa, đánh giá giá trị; kể lại: thuật lại sự việc. Bài nghị luận cần phân tích, không dừng ở kể lể.", "explain": "Chấm theo ý: phân biệt được hai thao tác và yêu cầu của bài nghị luận."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "TH", "q": "Vì sao cần đọc kĩ văn bản trước khi viết bài nghị luận văn học?", "explain": "Đọc kĩ giúp nắm chắc nội dung và tìm được chi tiết tiêu biểu làm dẫn chứng.", "options": ["A. Để thuộc lòng", "B. Để chép lại", "C. Để nắm chắc nội dung, tìm được chi tiết tiêu biểu làm dẫn chứng", "D. Để đếm chữ"], "answer": "C"}, {"type": "mcq", "level": "NB", "q": "Phần nào của bài văn tập trung triển khai các luận điểm?", "explain": "Thân bài là phần triển khai các luận điểm bằng lí lẽ và dẫn chứng.", "options": ["A. Mở bài", "B. Kết bài", "C. Nhan đề", "D. Thân bài"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Liên hệ, mở rộng trong bài nghị luận văn học có tác dụng gì?", "explain": "Liên hệ mở rộng gắn tác phẩm với đời sống, làm bài văn sâu sắc hơn.", "options": ["A. Làm sâu sắc vấn đề, thể hiện suy nghĩ riêng", "B. Làm bài dài hơn", "C. Thay cho phân tích", "D. Không cần thiết"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây có thể làm một luận điểm đúng?", "explain": "Luận điểm phải là một nhận định, đánh giá có thể chứng minh được.", "options": ["A. “Bài thơ Ông đồ có 5 khổ”", "B. “Hình ảnh ông đồ là biểu tượng của nét đẹp văn hóa đang phai tàn”", "C. “Vũ Đình Liên là nhà thơ”", "D. “Tôi thích bài thơ này”"], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Khi viết bài văn nghị luận, cách diễn đạt thường dùng là gì?", "explain": "Văn nghị luận cần lối diễn đạt trang trọng, khách quan, giàu sức thuyết phục.", "options": ["A. Lối nói suồng sã", "B. Lối kể chuyện hài hước", "C. Lối diễn đạt trang trọng, khách quan, giàu sức thuyết phục", "D. Lối viết tùy hứng"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Đề bài yêu cầu “phân tích” thì em phải đi sâu lí giải; đề yêu cầu “cảm nhận” thì em được bộc lộ cảm xúc nhiều hơn, nhưng vẫn phải có dẫn chứng.”\nĐoạn văn nhắc em chú ý điều gì khi làm bài?", "explain": "Mỗi kiểu đề có yêu cầu khác nhau, cần đọc kĩ để viết đúng hướng.", "options": ["A. Viết theo một khuôn duy nhất", "B. Không cần đọc đề", "C. Viết tùy hứng", "D. Đọc kĩ yêu cầu của đề để xác định cách viết phù hợp"], "answer": "D"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Một đoạn văn nghị luận tốt thường có: câu chủ đề nêu luận điểm, tiếp theo là lí lẽ và dẫn chứng, cuối cùng là phân tích làm sáng tỏ.”\nXét tính đúng sai:", "statements": ["a) Đoạn văn nghị luận cần câu chủ đề.", "b) Dẫn chứng phải đi kèm phân tích.", "c) Đoạn văn nghị luận chỉ cần nêu luận điểm là đủ."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – cần cả lí lẽ, dẫn chứng, phân tích."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Nhiều bạn viết mở bài rất dài, kể lể lan man rồi mới vào đề. Đó là lỗi cần tránh: mở bài chỉ nên ngắn gọn, đi thẳng vào vấn đề.”\nĐoạn văn phê phán lỗi nào?", "explain": "Đoạn văn phê phán lỗi mở bài dài dòng, kể lể lan man.", "options": ["A. Mở bài dài dòng, lan man", "B. Mở bài quá ngắn", "C. Không có mở bài", "D. Mở bài quá hay"], "answer": "A"}, {"type": "short", "level": "VD", "q": "Nêu trình tự các bước làm bài văn nghị luận về tác phẩm văn học.", "answer": "Tìm hiểu đề – đọc kĩ văn bản, tìm ý – lập dàn ý – viết bài – đọc lại, sửa chữa.", "explain": "Chấm theo ý: nêu được trình tự các bước làm bài."}, {"type": "short", "level": "VD", "q": "Theo em, một bài nghị luận văn học hay cần có yếu tố nào quan trọng nhất? Vì sao?", "answer": "Học sinh tự nêu (ví dụ: luận điểm rõ ràng, dẫn chứng xác đáng...) và lí giải hợp lí.", "explain": "Chấm theo ý: chọn được yếu tố cụ thể, lí giải thuyết phục."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "Thao tác “chứng minh” khác “giải thích” ở điểm nào?", "explain": "Chứng minh khẳng định tính đúng đắn bằng dẫn chứng; giải thích làm rõ ý nghĩa.", "options": ["A. Không khác nhau", "B. Chứng minh dùng dẫn chứng khẳng định tính đúng đắn; giải thích làm rõ ý nghĩa", "C. Chứng minh không cần dẫn chứng", "D. Giải thích không cần lí lẽ"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Dẫn chứng trong bài văn nên được trình bày như thế nào?", "explain": "Dẫn chứng phải ngắn gọn, chính xác và luôn gắn với phân tích.", "options": ["A. Càng dài càng tốt", "B. Để riêng không phân tích", "C. Ngắn gọn, chính xác, gắn với phân tích", "D. Chép nguyên cả bài"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Cụm từ “Không chỉ... mà còn...” trong bài nghị luận có tác dụng gì?", "explain": "Cụm từ này giúp liên kết, nhấn mạnh và mở rộng ý trong bài viết.", "options": ["A. Kết thúc bài", "B. Mở bài", "C. Không có tác dụng", "D. Liên kết, nhấn mạnh, mở rộng ý"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Khi đánh giá giá trị nghệ thuật của bài thơ, cần đề cập đến những gì?", "explain": "Đánh giá nghệ thuật cần đề cập thể thơ, ngôn ngữ, hình ảnh, biện pháp tu từ, nhạc điệu.", "options": ["A. Thể thơ, ngôn ngữ, hình ảnh, biện pháp tu từ, nhạc điệu", "B. Chỉ số câu", "C. Chỉ tên tác giả", "D. Chỉ năm sáng tác"], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Bài văn nghị luận về đoạn trích khác với về cả tác phẩm ở điểm nào?", "explain": "Viết về đoạn trích có phạm vi hẹp hơn, cần đi sâu vào chi tiết cụ thể.", "options": ["A. Không cần mở bài", "B. Phạm vi hẹp hơn, đi sâu vào chi tiết của đoạn trích", "C. Không cần dẫn chứng", "D. Viết tùy ý"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Phân tích nghệ thuật không phải là liệt kê tên biện pháp tu từ. Quan trọng là chỉ ra tác dụng: biện pháp ấy làm cho hình ảnh đẹp hơn, cảm xúc sâu hơn như thế nào.”\nTheo đoạn văn, phân tích nghệ thuật đúng cách là gì?", "explain": "Phân tích nghệ thuật phải chỉ ra tác dụng, không dừng ở liệt kê tên gọi.", "options": ["A. Liệt kê thật nhiều tên biện pháp", "B. Bỏ qua nghệ thuật", "C. Chỉ ra tác dụng của biện pháp nghệ thuật, không chỉ liệt kê tên", "D. Chỉ phân tích nội dung"], "answer": "C"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Khi viết về đoạn trích, em cần đặt đoạn trích trong chỉnh thể tác phẩm: nó ở vị trí nào, có mối quan hệ gì với toàn bài. Như vậy phân tích mới sâu sắc.”\nXét tính đúng sai:", "statements": ["a) Cần đặt đoạn trích trong chỉnh thể tác phẩm.", "b) Cần xem xét vị trí của đoạn trích.", "c) Phân tích đoạn trích tách rời toàn bài vẫn sâu sắc."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – cần đặt trong chỉnh thể."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Giọng văn nghị luận “có lí có tình” nghĩa là vừa lập luận chặt chẽ, vừa chan chứa cảm xúc chân thành. Khô khan quá thì nhạt, sướt mướt quá thì yếu.”\nTheo đoạn văn, giọng văn nghị luận lí tưởng là gì?", "explain": "Giọng văn lí tưởng cân bằng giữa lí lẽ chặt chẽ và cảm xúc chân thành.", "options": ["A. Khô khan, máy móc", "B. Sướt mướt, ủy mị", "C. Hài hước, bông đùa", "D. Vừa có lí vừa có tình, cân bằng chặt chẽ và chân thành"], "answer": "D"}, {"type": "short", "level": "VD", "q": "Nêu hai câu hỏi tự kiểm tra sau khi viết xong bài nghị luận văn học.", "answer": "Ví dụ: Các luận điểm đã rõ ràng chưa? Mỗi luận điểm đã có dẫn chứng và phân tích tương ứng chưa?", "explain": "Chấm theo ý: hai câu hỏi kiểm tra được nội dung chính của bài viết."}, {"type": "short", "level": "VD", "q": "Viết câu kết cho bài văn nghị luận về bài thơ “Ông đồ” theo cảm nhận của em.", "answer": "Học sinh tự viết câu kết (khẳng định giá trị bài thơ, nêu cảm nghĩ).", "explain": "Chấm theo ý: câu văn hoàn chỉnh, khẳng định được vấn đề, có cảm xúc chân thành."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "TH", "q": "Vì sao nghị luận văn học cần “có lí có tình”?", "explain": "“Có lí có tình” giúp bài viết vừa thuyết phục vừa lay động người đọc.", "options": ["A. Vì vừa thuyết phục bằng lí lẽ, vừa lay động bằng cảm xúc chân thành", "B. Vì phải dài", "C. Vì phải khó hiểu", "D. Vì phải hài hước"], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Đề “Suy nghĩ về tình yêu quê hương trong bài Quê hương” yêu cầu kiểu bài nào?", "explain": "Đề bàn về nội dung tác phẩm văn học nên là nghị luận văn học.", "options": ["A. Nghị luận xã hội", "B. Nghị luận văn học", "C. Miêu tả", "D. Kể chuyện"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Khi gặp đề nghị luận về nhân vật, nên bắt đầu từ đâu?", "explain": "Cần xác định đặc điểm nổi bật của nhân vật qua chi tiết tiêu biểu trước.", "options": ["A. Kể tiểu sử tác giả", "B. Chép lại tác phẩm", "C. Xác định đặc điểm nổi bật của nhân vật qua chi tiết tiêu biểu", "D. Đoán mò"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Lí lẽ trong bài nghị luận văn học thường dựa trên cơ sở nào?", "explain": "Lí lẽ phải dựa trên hiểu biết về tác phẩm, bối cảnh và kiến thức văn học.", "options": ["A. Cảm tính cá nhân", "B. Tin đồn", "C. Suy đoán vô căn cứ", "D. Hiểu biết về tác phẩm, bối cảnh và kiến thức văn học"], "answer": "D"}, {"type": "mcq", "level": "NB", "q": "Đoạn văn nghị luận thường mở đầu bằng gì?", "explain": "Đoạn văn nghị luận thường mở đầu bằng câu chủ đề nêu luận điểm.", "options": ["A. Câu chủ đề nêu luận điểm của đoạn", "B. Dẫn chứng dài", "C. Câu hỏi", "D. Lời chào"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Bạn Tuấn viết: ““Nhớ rừng” không chỉ là bài thơ về con hổ. Đằng sau tiếng gầm uất hận là khát vọng tự do của cả một dân tộc. Đó là giá trị lớn nhất của bài thơ.”\nĐiểm mạnh trong đoạn văn của Tuấn là gì?", "explain": "Tuấn đi sâu vào giá trị tư tưởng, thể hiện suy nghĩ riêng sâu sắc.", "options": ["A. Kể lại nội dung", "B. Nêu được giá trị sâu xa của tác phẩm, có suy nghĩ riêng", "C. Chép câu thơ", "D. Viết quá ngắn"], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Khi làm bài kiểm tra, nhiều bạn viết ngay không lập dàn ý nên dễ lạc đề, sót ý. Dành 5 – 10 phút lập dàn ý sẽ giúp bài viết chắc chắn hơn.”\nXét tính đúng sai:", "statements": ["a) Viết ngay không lập dàn ý dễ bị lạc đề, sót ý.", "b) Nên dành thời gian lập dàn ý trước khi viết.", "c) Lập dàn ý làm mất thời gian, không cần thiết."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – lập dàn ý rất cần thiết."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Một bài văn điểm cao không nhất thiết phải dài. Quan trọng là luận điểm rõ, dẫn chứng đắt, lập luận chặt và có suy nghĩ riêng.”\nTheo đoạn văn, bài văn điểm cao cần gì?", "explain": "Chất lượng bài văn nằm ở luận điểm, dẫn chứng, lập luận và suy nghĩ riêng.", "options": ["A. Viết thật dài", "B. Chữ thật đẹp", "C. Luận điểm rõ, dẫn chứng đắt, lập luận chặt, có suy nghĩ riêng", "D. Dùng nhiều từ khó"], "answer": "C"}, {"type": "short", "level": "VD", "q": "Nêu một luận điểm và một luận cứ tương ứng cho đề viết về bài “Quê hương”.", "answer": "Ví dụ: Luận điểm – Tình yêu quê hương tha thiết; luận cứ – hình ảnh thuyền, buồm, biển và nỗi nhớ da diết của người con xa quê.", "explain": "Chấm theo ý: luận điểm rõ ràng, luận cứ tương ứng, lấy từ bài thơ."}, {"type": "short", "level": "VD", "q": "Em sẽ chọn chi tiết nào làm dẫn chứng khi viết về khát vọng tự do trong “Nhớ rừng”? Vì sao?", "answer": "Học sinh tự chọn chi tiết (ví dụ: hình ảnh “cũi sắt”, quá khứ oai hùng...) và lí giải.", "explain": "Chấm theo ý: chi tiết cụ thể, lí do hợp lí, gắn với luận điểm."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Mục đích của bài văn nghị luận văn học là gì?", "explain": "Mục đích của nghị luận văn học là thuyết phục người đọc đồng tình.", "options": ["A. Kể chuyện hay", "B. Tả cảnh đẹp", "C. Giải trí", "D. Thuyết phục người đọc đồng tình với nhận định của mình"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Một bài nghị luận văn học đạt yêu cầu cần tránh điều gì?", "explain": "Bài viết phải tránh chung chung, sáo rỗng, thiếu dẫn chứng.", "options": ["A. Chung chung, sáo rỗng, thiếu dẫn chứng", "B. Có cảm xúc", "C. Có dẫn chứng", "D. Có bố cục"], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa luận điểm, luận cứ và lập luận là gì?", "explain": "Ba yếu tố gắn bó: luận điểm là ý chính, luận cứ làm sáng tỏ, lập luận là cách trình bày.", "options": ["A. Ba yếu tố độc lập", "B. Luận điểm là ý chính, luận cứ làm sáng tỏ, lập luận là cách trình bày", "C. Chỉ cần một trong ba", "D. Không liên quan nhau"], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Khi viết bài văn nghị luận trong giờ kiểm tra, việc quan trọng nhất là gì?", "explain": "Lập dàn ý trước giúp bài viết không lạc đề, đủ ý, sắp xếp hợp lí.", "options": ["A. Viết ngay cho kịp", "B. Viết thật dài", "C. Lập dàn ý trước khi viết", "D. Chép đề bài"], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Đọc một văn bản nghị luận văn học mẫu giúp em điều gì?", "explain": "Đọc bài mẫu giúp học cách đặt vấn đề, triển khai ý và dùng dẫn chứng.", "options": ["A. Để chép lại", "B. Để thuộc lòng", "C. Không giúp gì", "D. Học cách đặt vấn đề, triển khai luận điểm và dùng dẫn chứng"], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Học nghị luận văn học không chỉ để làm bài kiểm tra. Quan trọng hơn, em học được cách suy nghĩ có lí lẽ, biết bảo vệ quan điểm của mình bằng dẫn chứng thuyết phục.”\nTheo đoạn văn, ý nghĩa sâu xa của việc học nghị luận là gì?", "explain": "Học nghị luận rèn tư duy logic và khả năng bảo vệ quan điểm.", "options": ["A. Rèn tư duy có lí lẽ, biết bảo vệ quan điểm bằng dẫn chứng", "B. Chỉ để làm bài kiểm tra", "C. Để tranh cãi hơn người", "D. Không có ý nghĩa gì"], "answer": "A"}, {"type": "truefalse", "level": "TH", "q": "Đọc đoạn văn sau: “Bài 8 đã trang bị cho em: khái niệm nghị luận văn học; bộ ba luận điểm – luận cứ – lập luận; cách phân tích tác phẩm; dàn ý bài văn và kĩ năng trích dẫn. Đó là hành trang để em tự tin viết bài.”\nXét tính đúng sai:", "statements": ["a) Bài 8 dạy về nghị luận văn học.", "b) Luận điểm – luận cứ – lập luận là nội dung trọng tâm.", "c) Bài 8 không hướng dẫn cách viết bài văn."], "answers": ["T", "T", "S"], "explain": "a), b) Đúng – theo đoạn văn. c) Sai – bài 8 có hướng dẫn dàn ý và kĩ năng viết."}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn sau: “Nhà văn và trang viết – nhan đề Bài 8 gợi nhắc: mỗi trang viết của nhà văn đều chứa đựng tâm huyết, và người đọc, người viết về tác phẩm cần trân trọng, thấu hiểu điều đó.”\nTheo đoạn văn, nhan đề Bài 8 gợi điều gì?", "explain": "Nhan đề gợi sự trân trọng tâm huyết của nhà văn gửi trong trang viết.", "options": ["A. Nghề viết văn rất dễ", "B. Sự trân trọng, thấu hiểu tâm huyết của nhà văn trong từng trang viết", "C. Nhà văn giàu có", "D. Không gợi điều gì"], "answer": "B"}, {"type": "short", "level": "VD", "q": "Tóm tắt những kiến thức chính của Bài 8.", "answer": "Nghị luận văn học: khái niệm; luận điểm – luận cứ – lập luận; cách phân tích tác phẩm; dàn ý bài văn; kĩ năng trích dẫn.", "explain": "Chấm theo ý: nêu được các nội dung trọng tâm của bài học."}, {"type": "short", "level": "VD", "q": "Em thích nhất điều gì khi học cách viết bài nghị luận văn học? Vì sao?", "answer": "Học sinh tự nêu (ví dụ: biết cách bảo vệ quan điểm, biết phân tích sâu...) và lí giải.", "explain": "Chấm theo ý: nêu được điều cụ thể, lí do chân thành, hợp lí."}]}]}
