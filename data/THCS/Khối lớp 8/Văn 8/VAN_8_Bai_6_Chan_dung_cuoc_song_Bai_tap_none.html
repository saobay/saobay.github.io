 "D", "explain": "Mẹ Lan tần tảo như người mẹ trong “Trong lòng mẹ”."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Mẹ của Lan làm công nhân, ngày làm mười tiếng, tối về còn nhận thêm hàng may. Có hôm Lan thấy mẹ ngủ gục bên bàn máy, tay vẫn cầm miếng vải. Lan lặng lẽ đắp cho mẹ chiếc chăn mỏng, nước mắt cứ ứa ra: ‘Mẹ vất vả vì con nhiều quá!’” Chi tiết “tay vẫn cầm miếng vải” khi ngủ gục có tác dụng gì?", "options": ["A. Khắc họa sự vất vả, hy sinh thầm lặng của người mẹ", "B. Tả mẹ khéo tay", "C. Tả căn nhà", "D. Không có tác dụng"], "answer": "A", "explain": "Chi tiết nhỏ mà xúc động về sự hy sinh của mẹ."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Mẹ của Lan làm công nhân, ngày làm mười tiếng, tối về còn nhận thêm hàng may. Có hôm Lan thấy mẹ ngủ gục bên bàn máy, tay vẫn cầm miếng vải. Lan lặng lẽ đắp cho mẹ chiếc chăn mỏng, nước mắt cứ ứa ra: ‘Mẹ vất vả vì con nhiều quá!’” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Mẩu chuyện ngợi ca đức hy sinh của người mẹ.", "b) Lan là đứa con vô tâm.", "c) Mẩu chuyện thể hiện giá trị nhân đạo: trân trọng tình mẫu tử."], "answers": ["T", "S", "T"], "explain": "a, c đúng; b sai (Lan biết thương mẹ, đắp chăn cho mẹ)."}, {"type": "short", "level": "VD", "q": "Tóm tắt đoạn trích “Trong lòng mẹ” bằng 4–5 câu.", "answer": "Bé Hồng mồ côi cha, mẹ đi làm ăn xa, cậu sống với họ hàng bên nội cay nghiệt. Một hôm tan học, cậu bất ngờ gặp lại mẹ. Hai mẹ con ôm nhau hạnh phúc; cậu cảm nhận trọn vẹn tình mẫu tử sau bao ngày khao khát.", "explain": "Chấm theo ý: nêu được hoàn cảnh, cuộc gặp gỡ và ý nghĩa."}, {"type": "short", "level": "TH", "q": "Phân tích ngắn gọn nhân vật bé Hồng trong đoạn trích.", "answer": "Hiếu thảo, khát khao tình mẹ mãnh liệt; giàu lòng vị tha dù bị họ hàng đối xử cay nghiệt.", "explain": "Chấm theo ý: nêu được 2–3 nét tính cách."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Vì sao cái chết của lão Hạc gây ám ảnh cho người đọc?", "options": ["A. Vì rất bình thường", "B. Vì lão giàu có", "C. Vì lão còn trẻ", "D. Vì dữ dội, đau đớn — như lời tố cáo xã hội đẩy con người lương thiện đến bước đường cùng"], "answer": "D", "explain": "Cái chết bi thảm tố cáo hiện thực tàn nhẫn."}, {"type": "mcq", "level": "NB", "q": "Nhân vật trong truyện ngắn thường được khắc họa qua những phương diện nào?", "options": ["A. Hành động, lời nói, ngoại hình, diễn biến nội tâm", "B. Chỉ qua tên gọi", "C. Chỉ qua tuổi tác", "D. Không qua phương diện nào"], "answer": "A", "explain": "Nhân vật hiện lên qua hành động, lời nói, nội tâm..."}, {"type": "mcq", "level": "TH", "q": "Tình huống bé Hồng gặp lại mẹ sau bao ngày xa cách có ý nghĩa gì?", "options": ["A. Không có ý nghĩa", "B. Bộc lộ khát khao tình mẫu tử mãnh liệt của cậu bé", "C. Cho thấy cậu bé ghét mẹ", "D. Kể về trường học"], "answer": "B", "explain": "Cuộc đoàn tụ làm bùng lên tình mẫu tử thiêng liêng."}, {"type": "mcq", "level": "NB", "q": "Truyện “Lão Hạc” viết về đề tài gì?", "options": ["A. Người lính", "B. Người nông dân nghèo trước Cách mạng tháng Tám", "C. Doanh nhân", "D. Du lịch"], "answer": "C", "explain": "“Lão Hạc” viết về người nông dân nghèo trước 1945."}, {"type": "mcq", "level": "TH", "q": "Điểm chung về giá trị của hai truyện “Lão Hạc” và “Trong lòng mẹ” là gì?", "options": ["A. Đều viết về người giàu", "B. Đều là truyện cười", "C. Đều là thơ", "D. Đều thể hiện giá trị nhân đạo sâu sắc"], "answer": "D", "explain": "Cả hai đều thấm đẫm tinh thần nhân đạo."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Chú chó Mực đã già, đi lại khó khăn. Có người bảo chủ nó: ‘Nó già rồi, nuôi tốn cơm!’ Chủ nó xoa đầu Mực, nói: ‘Nó đã giữ nhà cho tôi mười năm. Giờ nó già, tôi càng phải thương nó hơn.’ Mực như hiểu lời, dụi đầu vào tay chủ.” Câu chuyện về chú chó Mực gợi nhớ đến chi tiết nào trong “Lão Hạc”?", "options": ["A. Lão Hạc bán chó", "B. Lão Hạc trồng rau", "C. Tình cảm gắn bó giữa con người và con chó Vàng", "D. Lão Hạc đi chợ"], "answer": "C", "explain": "Tình chủ – chó thắm thiết như lão Hạc với con Vàng."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Chú chó Mực đã già, đi lại khó khăn. Có người bảo chủ nó: ‘Nó già rồi, nuôi tốn cơm!’ Chủ nó xoa đầu Mực, nói: ‘Nó đã giữ nhà cho tôi mười năm. Giờ nó già, tôi càng phải thương nó hơn.’ Mực như hiểu lời, dụi đầu vào tay chủ.” Câu nói của người chủ thể hiện phẩm chất gì?", "options": ["A. Vô tâm", "B. Tình nghĩa, thủy chung: không bỏ rơi con vật đã gắn bó", "C. Keo kiệt", "D. Nóng nảy"], "answer": "B", "explain": "“Nó giữ nhà cho tôi mười năm” — tình nghĩa thủy chung."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Chú chó Mực đã già, đi lại khó khăn. Có người bảo chủ nó: ‘Nó già rồi, nuôi tốn cơm!’ Chủ nó xoa đầu Mực, nói: ‘Nó đã giữ nhà cho tôi mười năm. Giờ nó già, tôi càng phải thương nó hơn.’ Mực như hiểu lời, dụi đầu vào tay chủ.” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Mẩu chuyện ca ngợi tình nghĩa thủy chung.", "b) Người chủ nên bỏ con chó già để đỡ tốn cơm.", "c) Chi tiết Mực “dụi đầu vào tay chủ” giàu sức gợi."], "answers": ["T", "S", "T"], "explain": "a, c đúng; b sai (trái với tinh thần nhân đạo)."}, {"type": "short", "level": "VD", "q": "“Giá trị nhân đạo” là gì? Nêu biểu hiện của nó trong hai truyện đã học.", "answer": "Là sự yêu thương, trân trọng, bênh vực con người. Trong “Lão Hạc”: trân trọng phẩm giá người nông dân. Trong “Trong lòng mẹ”: ngợi ca tình mẫu tử.", "explain": "Chấm theo ý: định nghĩa đúng; nêu được biểu hiện ở mỗi truyện."}, {"type": "short", "level": "TH", "q": "Nêu ba đặc điểm của truyện ngắn hiện đại.", "answer": "Cỡ nhỏ; cốt truyện gọn, ít nhân vật; tập trung vào một lát cắt đời sống mà gợi nhiều suy nghĩ.", "explain": "Chấm theo ý: đủ 3 đặc điểm cơ bản."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tình huống truyện thường có vai trò gì trong diễn biến tác phẩm?", "options": ["A. Tạo bước ngoặt, đặt nhân vật vào thử thách", "B. Làm truyện nhàm chán", "C. Không liên quan đến cốt truyện", "D. Chỉ để trang trí"], "answer": "A", "explain": "Tình huống tạo bước ngoặt, thử thách nhân vật."}, {"type": "mcq", "level": "TH", "q": "Chi tiết lão Hạc chọn cái chết bằng bả chó có ý nghĩa nghệ thuật gì?", "options": ["A. Tả món ăn", "B. Chi tiết hài hước", "C. Không có ý nghĩa", "D. Chi tiết gây ám ảnh, tố cáo hiện thực tàn nhẫn và ngợi ca lòng tự trọng"], "answer": "D", "explain": "Cái chết dữ dội vừa tố cáo vừa ngợi ca phẩm giá."}, {"type": "mcq", "level": "NB", "q": "Người mẹ của bé Hồng trong truyện hiện lên như thế nào?", "options": ["A. Giàu có, sung sướng", "B. Độc ác", "C. Đáng thương, bị lễ giáo phong kiến khắt khe", "D. Vô tâm"], "answer": "C", "explain": "Mẹ bé Hồng đáng thương, bị họ hàng khinh miệt."}, {"type": "mcq", "level": "TH", "q": "Khi đọc một truyện ngắn, em cần chú ý những yếu tố nào?", "options": ["A. Chỉ đọc tên truyện", "B. Tình huống truyện, nhân vật, chi tiết nghệ thuật, giá trị tư tưởng", "C. Chỉ đếm số trang", "D. Chỉ xem tranh minh họa"], "answer": "B", "explain": "Đọc truyện ngắn: tình huống, nhân vật, chi tiết, giá trị."}, {"type": "mcq", "level": "NB", "q": "Nam Cao là nhà văn chuyên viết về đề tài nào?", "options": ["A. Người nông dân nghèo", "B. Người lính biển", "C. Doanh nhân thành đạt", "D. Du hành vũ trụ"], "answer": "A", "explain": "Nam Cao gắn bó với đề tài người nông dân nghèo."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bà Năm nhặt ve chai nuôi đứa cháu mồ côi. Ai cũng bảo bà khổ, bà chỉ cười: ‘Khổ mà cháu được đi học là vui rồi.’ Năm nay cháu bà đỗ vào trường chuyên, cả xóm đến chúc mừng, bà rưng rưng: ‘Ve chai mà nuôi được... ước mơ!’” Câu nói “Ve chai mà nuôi được... ước mơ!” thể hiện điều gì?", "options": ["A. Bà Năm khoe của", "B. Bà Năm chê ve chai", "C. Bà Năm buồn", "D. Niềm tự hào, hạnh phúc của người bà nghèo khi cháu thành đạt"], "answer": "D", "explain": "Câu nói rưng rưng niềm hạnh phúc của bà."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bà Năm nhặt ve chai nuôi đứa cháu mồ côi. Ai cũng bảo bà khổ, bà chỉ cười: ‘Khổ mà cháu được đi học là vui rồi.’ Năm nay cháu bà đỗ vào trường chuyên, cả xóm đến chúc mừng, bà rưng rưng: ‘Ve chai mà nuôi được... ước mơ!’” Nhân vật bà Năm đáng quý ở điểm nào?", "options": ["A. Giàu có", "B. Sống một mình", "C. Nhặt ve chai nuôi cháu ăn học bằng tất cả tình thương", "D. Thích được khen"], "answer": "C", "explain": "Bà hy sinh tất cả vì tương lai đứa cháu."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bà Năm nhặt ve chai nuôi đứa cháu mồ côi. Ai cũng bảo bà khổ, bà chỉ cười: ‘Khổ mà cháu được đi học là vui rồi.’ Năm nay cháu bà đỗ vào trường chuyên, cả xóm đến chúc mừng, bà rưng rưng: ‘Ve chai mà nuôi được... ước mơ!’” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Bà Năm là chân dung đẹp về tình bà cháu.", "b) Mẩu chuyện thể hiện giá trị nhân đạo.", "c) Nghèo khó thì không thể nuôi dưỡng ước mơ."], "answers": ["T", "T", "S"], "explain": "a, b đúng; c sai (chính bà Năm đã nuôi được ước mơ)."}, {"type": "short", "level": "VD", "q": "So sánh hoàn cảnh của lão Hạc và bé Hồng (một điểm giống, một điểm khác).", "answer": "Giống: đều nghèo khổ, bất hạnh, thiếu thốn tình cảm. Khác: lão Hạc là người già cô đơn; bé Hồng là trẻ thơ thiếu tình mẹ.", "explain": "Chấm theo ý: chỉ ra được điểm giống và khác hợp lý."}, {"type": "short", "level": "TH", "q": "Nhân vật trong truyện ngắn được khắc họa qua những phương diện nào?", "answer": "Hành động, lời nói, ngoại hình và diễn biến nội tâm.", "explain": "Chấm theo ý: nêu được các phương diện cơ bản."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Chi tiết nào sau đây có thể coi là chi tiết nghệ thuật?", "options": ["A. Liệt kê đồ đạc", "B. Ánh mắt lão Hạc nhìn theo con Vàng đầy day dứt", "C. Kể giờ giấc", "D. Tả thời tiết chung chung"], "answer": "B", "explain": "Ánh mắt day dứt: chi tiết nhỏ mà giàu sức gợi."}, {"type": "mcq", "level": "NB", "q": "Họ hàng bên nội đối xử với mẹ con bé Hồng như thế nào?", "options": ["A. Yêu thương", "B. Tôn trọng", "C. Giúp đỡ", "D. Khinh miệt, cay nghiệt"], "answer": "A", "explain": "Họ hàng bên nội khinh miệt, gieo rắc cay nghiệt."}, {"type": "mcq", "level": "TH", "q": "Giá trị nhân đạo trong “Trong lòng mẹ” thể hiện ở điểm nào?", "options": ["A. Ca ngợi giàu sang", "B. Chê bai người nghèo", "C. Trân trọng, ngợi ca tình mẫu tử thiêng liêng", "D. Không có giá trị gì"], "answer": "D", "explain": "Truyện ngợi ca tình mẫu tử bất diệt."}, {"type": "mcq", "level": "NB", "q": "“Những ngày thơ ấu” thuộc thể loại nào?", "options": ["A. Truyện cười", "B. Thơ", "C. Hồi kí", "D. Kịch"], "answer": "C", "explain": "Đây là hồi kí về tuổi thơ của chính tác giả."}, {"type": "mcq", "level": "TH", "q": "Nhân vật bé Hồng đáng quý ở điểm nào?", "options": ["A. Giàu có", "B. Hiếu thảo, khát khao tình mẹ, giàu lòng vị tha", "C. Lười học", "D. Hỗn láo"], "answer": "B", "explain": "Bé Hồng hiếu thảo, vị tha dù bị đối xử cay nghiệt."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bố của Tuấn chạy xe ôm, nắng mưa đều ngoài đường. Có lần Tuấn xấu hổ không dám nhận bố trước mặt bạn bè. Tối về, thấy đôi vai bố ướt đẫm mồ hôi, Tuấn òa khóc: ‘Con xin lỗi bố. Mồ hôi của bố là để... nuôi con khôn lớn.’” Chi tiết nào cho thấy Tuấn đã thay đổi nhận thức?", "options": ["A. Tuấn òa khóc xin lỗi bố khi thấy vai bố ướt đẫm mồ hôi", "B. Tuấn đi học", "C. Tuấn chơi với bạn", "D. Tuấn ăn cơm"], "answer": "A", "explain": "Giọt nước mắt hối hận cho thấy Tuấn đã hiểu lòng bố."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bố của Tuấn chạy xe ôm, nắng mưa đều ngoài đường. Có lần Tuấn xấu hổ không dám nhận bố trước mặt bạn bè. Tối về, thấy đôi vai bố ướt đẫm mồ hôi, Tuấn òa khóc: ‘Con xin lỗi bố. Mồ hôi của bố là để... nuôi con khôn lớn.’” Hình ảnh người bố chạy xe ôm gợi nhớ đến nhân vật nào đã học?", "options": ["A. Chúa Trịnh", "B. Anh treo biển", "C. Tú Xương", "D. Lão Hạc – người cha nghèo thương con"], "answer": "D", "explain": "Người bố lam lũ thương con như lão Hạc thương con trai."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Bố của Tuấn chạy xe ôm, nắng mưa đều ngoài đường. Có lần Tuấn xấu hổ không dám nhận bố trước mặt bạn bè. Tối về, thấy đôi vai bố ướt đẫm mồ hôi, Tuấn òa khóc: ‘Con xin lỗi bố. Mồ hôi của bố là để... nuôi con khôn lớn.’” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Ban đầu Tuấn xấu hổ về nghề nghiệp của bố là đáng trách.", "b) Tuấn đã nhận ra sự hy sinh của bố và hối hận.", "c) Mẩu chuyện ngợi ca tình cha con."], "answers": ["T", "T", "T"], "explain": "Cả ba nhận xét đều đúng."}, {"type": "short", "level": "VD", "q": "Nêu ý nghĩa cái chết của lão Hạc.", "answer": "Tố cáo xã hội tàn nhẫn đẩy con người lương thiện đến bước đường cùng; đồng thời ngợi ca lòng tự trọng, phẩm giá của người nông dân.", "explain": "Chấm theo ý: nêu được ý nghĩa tố cáo và ngợi ca."}, {"type": "short", "level": "TH", "q": "Tình mẫu tử trong “Trong lòng mẹ” được thể hiện tập trung qua chi tiết nào?", "answer": "Cuộc gặp gỡ, đoàn tụ xúc động của hai mẹ con sau bao ngày xa cách; vòng tay mẹ, niềm hạnh phúc vỡ òa của bé Hồng.", "explain": "Chấm theo ý: chỉ ra được chi tiết đoàn tụ và ý nghĩa."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Truyện ngắn thường tập trung phản ánh điều gì?", "options": ["A. Cả cuộc đời một dân tộc", "B. Một lát cắt của đời sống", "C. Vũ trụ bao la", "D. Không phản ánh gì"], "answer": "C", "explain": "Truyện ngắn khắc họa một lát cắt đời sống mà gợi nhiều."}, {"type": "mcq", "level": "TH", "q": "“Tình huống truyện” khác “cốt truyện” ở điểm nào?", "options": ["A. Giống hệt nhau", "B. Tình huống là hoàn cảnh cụ thể thử thách nhân vật; cốt truyện là toàn bộ diễn biến sự việc", "C. Tình huống dài hơn", "D. Cốt truyện không quan trọng"], "answer": "B", "explain": "Tình huống là một hoàn cảnh trong cốt truyện."}, {"type": "mcq", "level": "NB", "q": "Vì sao lão Hạc phải bán con chó Vàng?", "options": ["A. Vì ghét chó", "B. Vì chó bị bệnh", "C. Vì quá nghèo túng, không nuôi nổi", "D. Vì muốn mua chó mới"], "answer": "A", "explain": "Túng thiếu đến mức không nuôi nổi con Vàng."}, {"type": "mcq", "level": "TH", "q": "Nỗi đau lớn nhất của lão Hạc là gì?", "options": ["A. Mất tiền", "B. Phải xa con chó thân thiết và day dứt vì không lo được cho con trai", "C. Bị ốm", "D. Mất nhà"], "answer": "D", "explain": "Lão đau vì mất Vàng và thương con trai lưu lạc."}, {"type": "mcq", "level": "NB", "q": "Bối cảnh xã hội trong truyện “Lão Hạc” là gì?", "options": ["A. Thành phố hiện đại", "B. Nước ngoài", "C. Làng quê Việt Nam trước Cách mạng tháng Tám 1945", "D. Tương lai"], "answer": "C", "explain": "Truyện viết về làng quê trước 1945."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Cô bé An được mẹ cho một ổ bánh mì. Trên đường về, An gặp cụ già ăn xin run rẩy vì đói. An bẻ đôi ổ bánh, đưa cụ một nửa: ‘Cụ ăn đi cho ấm bụng!’ Cụ già rưng rưng: ‘Nửa ổ bánh mà... ấm cả lòng!’” Hành động bẻ đôi ổ bánh mì của cô bé An thể hiện điều gì?", "options": ["A. Phung phí", "B. Thích được khen", "C. Lòng nhân ái, biết chia sẻ với người khó khăn hơn", "D. Sợ mẹ mắng"], "answer": "C", "explain": "Chia nửa ổ bánh cho cụ già — nhân ái, sẻ chia."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Cô bé An được mẹ cho một ổ bánh mì. Trên đường về, An gặp cụ già ăn xin run rẩy vì đói. An bẻ đôi ổ bánh, đưa cụ một nửa: ‘Cụ ăn đi cho ấm bụng!’ Cụ già rưng rưng: ‘Nửa ổ bánh mà... ấm cả lòng!’” Câu nói “Nửa ổ bánh mà... ấm cả lòng!” có ý nghĩa gì?", "options": ["A. Tình người sưởi ấm lòng người hơn cả vật chất", "B. Bánh rất nóng", "C. Cụ già bị ốm", "D. Bánh khó ăn"], "answer": "A", "explain": "“Ấm lòng” là ấm tình người — chi tiết giàu sức gợi."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Cô bé An được mẹ cho một ổ bánh mì. Trên đường về, An gặp cụ già ăn xin run rẩy vì đói. An bẻ đôi ổ bánh, đưa cụ một nửa: ‘Cụ ăn đi cho ấm bụng!’ Cụ già rưng rưng: ‘Nửa ổ bánh mà... ấm cả lòng!’” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Cô bé An là chân dung đẹp về lòng nhân ái.", "b) Việc chia sẻ chỉ dành cho người giàu.", "c) Mẩu chuyện thể hiện giá trị nhân đạo."], "answers": ["T", "S", "T"], "explain": "a, c đúng; b sai (ai cũng có thể sẻ chia)."}, {"type": "short", "level": "VD", "q": "Kể tên hai chi tiết nghệ thuật trong “Trong lòng mẹ” và nêu ý nghĩa của mỗi chi tiết.", "answer": "Cuộc đoàn tụ mẹ con: ngợi ca tình mẫu tử. Thái độ cay nghiệt của họ hàng: tố cáo lễ giáo, làm nổi bật khát khao của bé Hồng.", "explain": "Chấm theo ý: đúng 2 chi tiết; nêu được ý nghĩa."}, {"type": "short", "level": "TH", "q": "Vì sao truyện “Lão Hạc” có giá trị hiện thực sâu sắc?", "answer": "Vì phản ánh chân thực đời sống khổ cực của người nông dân Việt Nam trước Cách mạng tháng Tám 1945.", "explain": "Chấm theo ý: nêu được giá trị phản ánh hiện thực."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "Vì sao có thể nói lão Hạc “chết mà như sống”?", "options": ["A. Vì lão còn trẻ", "B. Vì lão giàu", "C. Vì lão sống lại", "D. Vì cái chết giữ trọn phẩm giá khiến người đọc càng kính trọng, nhớ mãi"], "answer": "D", "explain": "Chết trong tự trọng nên hình ảnh lão sống mãi."}, {"type": "mcq", "level": "NB", "q": "Khi xa mẹ, bé Hồng phải sống với ai?", "options": ["A. Ông bà ngoại", "B. Họ hàng bên nội cay nghiệt", "C. Bạn bè", "D. Một mình"], "answer": "C", "explain": "Bé Hồng sống với họ hàng bên nội."}, {"type": "mcq", "level": "TH", "q": "Chi tiết nghệ thuật có vai trò gì trong truyện ngắn?", "options": ["A. Làm truyện dài", "B. Tạo điểm nhấn, gợi nhiều suy nghĩ, để lại dư vị", "C. Không có vai trò", "D. Gây khó hiểu"], "answer": "B", "explain": "Chi tiết hay tạo điểm nhấn, ám ảnh lâu dài."}, {"type": "mcq", "level": "NB", "q": "Tên thật của nhà văn Nguyên Hồng là gì?", "options": ["A. Nguyễn Nguyên Hồng", "B. Trần Hữu Tri", "C. Ngô Tất Tố", "D. Tô Hoài"], "answer": "A", "explain": "Nguyên Hồng tên thật là Nguyễn Nguyên Hồng."}, {"type": "mcq", "level": "TH", "q": "Cảm hứng nhân đạo của Nam Cao trong “Lão Hạc” là gì?", "options": ["A. Ghét người nghèo", "B. Xót thương, trân trọng phẩm giá người nông dân nghèo", "C. Ca ngợi giàu sang", "D. Vô cảm"], "answer": "D", "explain": "Nam Cao xót thương và trân trọng người nông dân."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Ông Ba có cây khế ngọt trồng từ ngày con trai chào đời. Con trai đi làm ăn xa, mỗi mùa khế chín, ông lại hái gửi cho con. Ông bảo: ‘Cây khế là... con trai út của tôi. Nhìn nó là nhớ con!’” Cây khế trong mẩu chuyện là biểu tượng của điều gì?", "options": ["A. Sự giàu có", "B. Tình cha con, nỗi nhớ quê hương của người cha", "C. Cây ăn quả ngon", "D. Sự mê tín"], "answer": "B", "explain": "Cây khế gắn với ngày con chào đời — biểu tượng tình phụ tử."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Ông Ba có cây khế ngọt trồng từ ngày con trai chào đời. Con trai đi làm ăn xa, mỗi mùa khế chín, ông lại hái gửi cho con. Ông bảo: ‘Cây khế là... con trai út của tôi. Nhìn nó là nhớ con!’” Câu nói “Cây khế là... con trai út của tôi” cho thấy điều gì?", "options": ["A. Ông Ba lẫn", "B. Ông Ba thích trồng cây", "C. Ông Ba cô đơn", "D. Tình cảm sâu nặng ông dành cho con trai"], "answer": "D", "explain": "Nhìn cây như nhìn con — tình cha tha thiết."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Ông Ba có cây khế ngọt trồng từ ngày con trai chào đời. Con trai đi làm ăn xa, mỗi mùa khế chín, ông lại hái gửi cho con. Ông bảo: ‘Cây khế là... con trai út của tôi. Nhìn nó là nhớ con!’” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Mẩu chuyện ngợi ca tình phụ tử.", "b) Cây khế chỉ là cây ăn quả bình thường.", "c) Chi tiết cây khế là chi tiết nghệ thuật giàu sức gợi."], "answers": ["T", "S", "T"], "explain": "a, c đúng; b sai (cây khế mang ý nghĩa biểu tượng)."}, {"type": "short", "level": "VD", "q": "Nêu dàn ý cho đoạn văn phân tích nhân vật lão Hạc.", "answer": "Giới thiệu nhân vật, tác phẩm → hoàn cảnh → phân tích phẩm chất (tự trọng, thương con) qua dẫn chứng → đánh giá, suy nghĩ bản thân.", "explain": "Chấm theo ý: đủ các bước cơ bản."}, {"type": "short", "level": "TH", "q": "Nêu cảm nghĩ của em về tình cha con trong truyện “Lão Hạc” (2–3 câu).", "answer": "Tình cha con tha thiết: lão Hạc dành dụm từng đồng cho con, thà chết chứ không tiêu phạm. Đó là tình thương cao đẹp, đáng trân trọng.", "explain": "Chấm theo ý: thể hiện được sự cảm nhận chân thành."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Số lượng nhân vật trong truyện ngắn thường như thế nào?", "options": ["A. Ít", "B. Rất đông", "C. Không có", "D. Hàng trăm"], "answer": "A", "explain": "Truyện ngắn ít nhân vật, tập trung khắc họa."}, {"type": "mcq", "level": "NB", "q": "Truyện “Lão Hạc” được sáng tác năm nào?", "options": ["A. 1930", "B. 1943", "C. 1954", "D. 1975"], "answer": "B", "explain": "“Lão Hạc” ra đời năm 1943."}, {"type": "mcq", "level": "TH", "q": "Thái độ của nhà văn với nhân vật người nghèo trong hai truyện là gì?", "options": ["A. Khinh miệt", "B. Vô cảm", "C. Chế giễu", "D. Yêu thương, trân trọng, xót xa"], "answer": "D", "explain": "Cả hai nhà văn đều yêu thương, trân trọng nhân vật."}, {"type": "mcq", "level": "NB", "q": "Đoạn trích “Trong lòng mẹ” được kể theo ngôi kể nào?", "options": ["A. Ngôi thứ ba", "B. Ngôi thứ hai", "C. Ngôi thứ nhất – cậu bé Hồng kể", "D. Không có ngôi kể"], "answer": "C", "explain": "Bé Hồng kể lại tuổi thơ mình — ngôi thứ nhất."}, {"type": "mcq", "level": "TH", "q": "Viết đoạn văn phân tích một nhân vật truyện ngắn cần có những ý nào?", "options": ["A. Nêu đặc điểm, phân tích qua hành động, lời nói, chi tiết tiêu biểu, rút ra nhận xét", "B. Chỉ chép lại truyện", "C. Chỉ nêu tên nhân vật", "D. Không cần ý nào"], "answer": "A", "explain": "Phân tích nhân vật cần dẫn chứng và nhận xét."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Mẹ đi làm ca đêm, bé Na thức đợi đến gần mười một giờ. Nghe tiếng xe máy ngoài ngõ, Na chạy ùa ra ôm chầm lấy mẹ: ‘Mẹ về rồi! Con để dành cho mẹ... cái ôm to nhất!’ Mẹ cười mà nước mắt lăn dài trên má.” Chi tiết bé Na “để dành cho mẹ... cái ôm to nhất” thể hiện điều gì?", "options": ["A. Bé Na nghịch ngợm", "B. Khát khao tình mẹ hồn nhiên, trong sáng của trẻ thơ", "C. Bé Na không ngủ được", "D. Bé Na sợ ma"], "answer": "B", "explain": "Cái ôm để dành — khát khao tình mẹ như bé Hồng."}, {"type": "mcq", "level": "TH", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Mẹ đi làm ca đêm, bé Na thức đợi đến gần mười một giờ. Nghe tiếng xe máy ngoài ngõ, Na chạy ùa ra ôm chầm lấy mẹ: ‘Mẹ về rồi! Con để dành cho mẹ... cái ôm to nhất!’ Mẹ cười mà nước mắt lăn dài trên má.” Vì sao mẹ “cười mà nước mắt lăn dài”?", "options": ["A. Mẹ bị mệt", "B. Mẹ buồn", "C. Xúc động, hạnh phúc trước tình cảm của con sau ngày làm việc vất vả", "D. Mẹ giận con"], "answer": "C", "explain": "Nước mắt hạnh phúc của người mẹ lam lũ."}, {"type": "truefalse", "level": "VD", "q": "Đọc mẩu chuyện sau (do người biên soạn sáng tác): “Mẹ đi làm ca đêm, bé Na thức đợi đến gần mười một giờ. Nghe tiếng xe máy ngoài ngõ, Na chạy ùa ra ôm chầm lấy mẹ: ‘Mẹ về rồi! Con để dành cho mẹ... cái ôm to nhất!’ Mẹ cười mà nước mắt lăn dài trên má.” Xét tính đúng, sai của các nhận xét sau:", "statements": ["a) Mẩu chuyện ngợi ca tình mẫu tử.", "b) Bé Na là đứa trẻ vô tâm.", "c) Mẩu chuyện có giá trị nhân đạo."], "answers": ["T", "S", "T"], "explain": "a, c đúng; b sai (Na thức đợi mẹ vì thương mẹ)."}, {"type": "short", "level": "TH", "q": "Thái độ của Nguyên Hồng đối với nhân vật bé Hồng là gì?", "answer": "Yêu thương, đồng cảm sâu sắc với tuổi thơ bất hạnh; trân trọng khát khao tình mẹ của cậu bé.", "explain": "Chấm theo ý: nêu được sự yêu thương, đồng cảm."}, {"type": "short", "level": "VD", "q": "So sánh giá trị nhân đạo trong “Lão Hạc” và “Trong lòng mẹ”.", "answer": "“Lão Hạc”: trân trọng phẩm giá, lòng tự trọng của người nông dân. “Trong lòng mẹ”: ngợi ca tình mẫu tử thiêng liêng. Chung: yêu thương, bênh vực con người khổ.", "explain": "Chấm theo ý: chỉ ra được nét riêng và điểm chung."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Nhận định nào SAI về truyện ngắn?", "options": ["A. Truyện ngắn có cốt truyện gọn", "B. Truyện ngắn không cần tình huống truyện", "C. Truyện ngắn ít nhân vật", "D. Truyện ngắn giàu chi tiết nghệ thuật"], "answer": "B", "explain": "Tình huống truyện là yếu tố quan trọng của truyện ngắn."}, {"type": "mcq", "level": "NB", "q": "Con chó thân thiết của lão Hạc tên là gì?", "options": ["A. Mực", "B. Vện", "C. Vàng", "D. Đốm"], "answer": "D", "explain": "Con chó của lão Hạc tên là Vàng."}, {"type": "mcq", "level": "NB", "q": "Tình mẫu tử trong “Trong lòng mẹ” được thể hiện tập trung qua sự việc nào?", "options": ["A. Cuộc gặp gỡ xúc động của hai mẹ con sau bao ngày xa cách", "B. Bữa cơm gia đình", "C. Buổi học ở trường", "D. Chuyến đi chơi"], "answer": "A", "explain": "Cuộc đoàn tụ là đỉnh cao cảm xúc của đoạn trích."}, {"type": "mcq", "level": "TH", "q": "Giá trị hiện thực của hai truyện “Lão Hạc” và “Trong lòng mẹ” là gì?", "options": ["A. Ca ngợi giàu sang", "B. Phản ánh chân thực đời sống khổ cực của người dân trước 1945", "C. Viết về tương lai", "D. Không có giá trị hiện thực"], "answer": "C", "explain": "Hai truyện phản ánh đời sống khổ cực trước Cách mạng."}, {"type": "mcq", "level": "NB", "q": "Dòng văn học Việt
