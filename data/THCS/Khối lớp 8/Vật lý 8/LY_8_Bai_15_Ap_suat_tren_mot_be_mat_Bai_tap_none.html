evel":"NB","q":"Diện tích bị ép càng nhỏ thì áp suất càng","options":["A. Nhỏ","B. Lớn","C. Không đổi","D. Bằng không"],"answer":"B","explain":"p tỉ lệ nghịch với S.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định thực tế.","statements":["a) Dao cắt dễ gây áp suất lớn.","b) Kim khâu đầu nhỏ để xuyên vải dễ dàng.","c) Để chân bàn không làm xước sàn nên chân bàn thường có đệm cao su to.","d) Cọc nhọn để đóng cọc xuống đất dễ dàng."],"answer":["T","T","T","T"],"explain":"Tất cả đều là ứng dụng của p = F / S.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Áp lực có phương vuông góc với mặt bị ép.","b) Đơn vị áp lực là N.","c) Đơn vị áp suất là Pa.","d) p = F × S."],"answer":["T","T","T","F"],"explain":"p = F / S.","points":1},{"type":"short","level":"VDC","q":"Tại sao không nên để vật nặng có chân nhọn lên sàn gỗ? (Trả lời ngắn gọn)","answer":"Vì áp suất lớn làm sàn bị lún, xước","explain":"S nhỏ thì p lớn, để lại vết lún.","points":0.5},{"type":"short","level":"TH","q":"Áp suất 2 000 Pa tác dụng lên diện tích 0,5 m² tạo áp lực bao nhiêu N?","answer":"1000","explain":"F = p × S = 2 000 × 0,5 = 1 000 N.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Công thức p = F / S cho biết áp suất","options":["A. Tỉ lệ thuận với F, tỉ lệ nghịch với S","B. Tỉ lệ nghịch với F, tỉ lệ thuận với S","C. Tỉ lệ thuận với cả F và S","D. Không phụ thuộc F, S"],"answer":"A","explain":"p tăng khi F tăng, giảm khi S tăng.","points":0.25},{"type":"mcq","level":"TH","q":"Một người ngồi lên ghế: áp lực 600 N, diện tích 4 chân ghế 0,004 m². Áp suất các chân ghế tác dụng lên sàn là","options":["A. 15 000 Pa","B. 150 000 Pa","C. 2,4 Pa","D. 2 400 Pa"],"answer":"B","explain":"p = 600 / 0,004 = 150 000 Pa.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn áp suất giảm 4 lần mà giữ nguyên áp lực, cần","options":["A. Giảm diện tích 4 lần","B. Tăng diện tích 4 lần","C. Giảm diện tích 2 lần","D. Tăng áp lực 4 lần"],"answer":"B","explain":"p tỉ lệ nghịch với S.","points":0.25},{"type":"mcq","level":"VDC","q":"Một khối sắt đặc hình lập phương cạnh 0,1 m (D = 7 800 kg/m³) đặt trên mặt bàn. Áp suất khối sắt tác dụng lên bàn là","options":["A. 780 Pa","B. 7 800 Pa","C. 78 000 Pa","D. 780 000 Pa"],"answer":"B","explain":"V = 0,001 m³; m = 7,8 kg; F = 78 N; S = 0,01 m²; p = 7 800 Pa.","points":0.25},{"type":"mcq","level":"NB","q":"Áp suất khí quyển ở mặt biển xấp xỉ","options":["A. 101 300 Pa","B. 1 013 Pa","C. 10 Pa","D. 1 000 000 Pa"],"answer":"A","explain":"Áp suất khí quyển chuẩn xấp xỉ 101 300 Pa (sẽ học kĩ Bài 16).","points":0.25},{"type":"mcq","level":"TH","q":"Các chân tủ lạnh thường có đệm rộng để","options":["A. Tăng áp suất lên sàn","B. Giảm áp suất lên sàn","C. Làm đẹp","D. Dễ di chuyển"],"answer":"B","explain":"Đệm rộng tăng S, giảm p, bảo vệ sàn.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Áp suất phụ thuộc áp lực và diện tích bị ép.","b) Tăng F hoặc giảm S đều làm p tăng.","c) Giảm F hoặc tăng S đều làm p giảm.","d) p không đổi nếu F và S cùng tăng gấp đôi."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng theo p = F / S.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các đổi đơn vị.","statements":["a) 5 kPa = 5 000 Pa.","b) 250 Pa = 0,25 kPa.","c) 3 hPa = 300 Pa.","d) 10 000 Pa = 100 kPa."],"answer":["T","T","T","F"],"explain":"10 000 Pa = 10 kPa.","points":1},{"type":"short","level":"TH","q":"Người ta dùng nhiều bánh xe cho xe tải nặng để làm gì?","answer":"Giảm áp suất lên mặt đường","explain":"Tăng S tiếp xúc làm giảm p.","points":0.5},{"type":"short","level":"VDC","q":"Một lưỡi cưa sắc cắt gỗ dễ hơn lưỡi cưa cùn. Giải thích ngắn gọn theo áp suất.","answer":"Lưỡi sắc có diện tích tiếp xúc nhỏ nên áp suất lớn","explain":"S nhỏ thì p lớn với cùng lực đẩy.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"TH","q":"Trong các trường hợp sau, trường hợp nào gây áp suất lớn nhất lên mặt sàn? (cùng một người 50 kg)","options":["A. Đứng cả hai bàn chân","B. Đứng một bàn chân","C. Nằm trên sàn","D. Ngồi trên ghế"],"answer":"B","explain":"Đứng một chân có S nhỏ nhất nên p lớn nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Kí hiệu S trong công thức p = F / S là","options":["A. Áp suất","B. Áp lực","C. Diện tích bị ép","D. Thể tích"],"answer":"C","explain":"S là diện tích bị ép (m²).","points":0.25},{"type":"mcq","level":"VDC","q":"Một máy kéo nặng 30 000 N, diện tích hai dải xích tiếp xúc đất 3 m². Áp suất máy tác dụng lên đất và so sánh với áp suất người 600 N đứng trên 0,03 m²","options":["A. 10 000 Pa, nhỏ hơn người","B. 90 000 Pa, lớn hơn người","C. 10 000 Pa, bằng người","D. 1 000 Pa, nhỏ hơn người"],"answer":"A","explain":"p máy = 10 000 Pa; p người = 20 000 Pa; máy nhỏ hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Áp lực 1 200 N, diện tích 0,6 m². Áp suất là","options":["A. 720 Pa","B. 2 000 Pa","C. 20 000 Pa","D. 0,0005 Pa"],"answer":"B","explain":"p = 1 200 / 0,6 = 2 000 Pa.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào ĐÚNG?","options":["A. Áp lực luôn bằng trọng lượng","B. Áp suất có đơn vị là N","C. Áp suất tăng khi diện tích bị ép giảm","D. Áp lực có đơn vị là Pa"],"answer":"C","explain":"p tỉ lệ nghịch với S.","points":0.25},{"type":"mcq","level":"NB","q":"Tác dụng của áp lực càng lớn khi","options":["A. Áp lực càng nhỏ","B. Diện tích bị ép càng lớn","C. Áp lực càng lớn và diện tích bị ép càng nhỏ","D. Áp lực càng nhỏ và diện tích càng lớn"],"answer":"C","explain":"Tác dụng mạnh khi F lớn, S nhỏ.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các tính toán.","statements":["a) F = 2 000 N, S = 0,5 m² thì p = 4 000 Pa.","b) p = 4 000 Pa, F = 2 000 N thì S = 0,5 m².","c) p = 4 000 Pa, S = 0,5 m² thì F = 2 000 N.","d) F = 2 000 N, p = 500 Pa thì S = 4 m²."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Dao sắc cắt dễ vì áp suất lớn.","b) Đinh nhọn dễ đóng vì áp suất lớn.","c) Xích xe tăng rộng để giảm áp suất.","d) Gót giày nhọn giúp giảm áp suất."],"answer":["T","T","T","F"],"explain":"Gót nhọn làm tăng áp suất.","points":1},{"type":"short","level":"VDC","q":"Vì sao bàn chân lạc đà thường có hình bản rộng? (Trả lời ngắn gọn)","answer":"Để tăng diện tích, giảm áp suất, không bị lầy","explain":"S lớn thì p nhỏ.","points":0.5},{"type":"short","level":"TH","q":"Khi áp lực không đổi, áp suất và diện tích bị ép tỉ lệ như thế nào với nhau?","answer":"Tỉ lệ nghịch","explain":"p = F / S nên p tỉ lệ nghịch với S.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Đơn vị đo áp suất trong hệ SI là","options":["A. niutơn","B. paxcan","C. jun","D. oát"],"answer":"B","explain":"Đơn vị SI của áp suất là paxcan (Pa).","points":0.25},{"type":"mcq","level":"TH","q":"Một quyển sách nặng 3 N đặt trên bàn, diện tích tiếp xúc 0,06 m². Áp suất là","options":["A. 50 Pa","B. 0,18 Pa","C. 18 Pa","D. 500 Pa"],"answer":"A","explain":"p = 3 / 0,06 = 50 Pa.","points":0.25},{"type":"mcq","level":"VD","q":"Để áp suất tăng gấp đôi mà diện tích không đổi, cần","options":["A. Giảm áp lực một nửa","B. Tăng áp lực gấp đôi","C. Giảm áp lực gấp đôi","D. Không đổi áp lực"],"answer":"B","explain":"p tỉ lệ thuận với F.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bể nước hình trụ đứng có diện tích đáy 2 m² chứa 1 000 lít nước. Áp suất do nước gây ra lên đáy bể (bỏ qua vỏ bể) là","options":["A. 500 Pa","B. 5 000 Pa","C. 50 000 Pa","D. 2 000 Pa"],"answer":"B","explain":"m = 1 000 kg; F = 10 000 N; p = 10 000 / 2 = 5 000 Pa.","points":0.25},{"type":"mcq","level":"NB","q":"Áp lực do quyển sách tác dụng lên mặt bàn khi đặt nằm yên bằng","options":["A. Khối lượng quyển sách","B. Trọng lượng quyển sách","C. Áp suất khí quyển","D. Lực ma sát"],"answer":"B","explain":"Khi đặt nằm yên, áp lực bằng trọng lượng.","points":0.25},{"type":"mcq","level":"TH","q":"Người thợ mộc mài lưỡi bào cho sắc để","options":["A. Giảm áp suất","B. Tăng áp suất khi bào gỗ","C. Cho đẹp","D. Giảm lực ma sát"],"answer":"B","explain":"Lưỡi sắc có S nhỏ, áp suất lớn, dễ bào gỗ.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) p = F / S.","b) Đơn vị p là Pa.","c) 1 Pa = 1 N/m².","d) F càng lớn thì p càng nhỏ."],"answer":["T","T","T","F"],"explain":"F càng lớn thì p càng lớn.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về đổi đơn vị.","statements":["a) 0,5 m² = 5 000 cm².","b) 1 m² = 10 000 cm².","c) 200 cm² = 0,02 m².","d) 1 dm² = 100 cm²."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"short","level":"TH","q":"Tính áp suất khi áp lực 900 N tác dụng lên diện tích 0,45 m². (Đơn vị Pa)","answer":"2000","explain":"p = 900 / 0,45 = 2 000 Pa.","points":0.5},{"type":"short","level":"VDC","q":"Giải thích vì sao cầm dao ở lưỡi sắc dễ bị đứt tay? (Trả lời ngắn gọn)","answer":"Vì diện tích nhỏ nên áp suất rất lớn","explain":"S nhỏ thì p = F / S rất lớn dù chỉ chạm nhẹ.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Biết p = 3 000 Pa, S = 0,2 m². Áp lực F là","options":["A. 15 000 N","B. 600 N","C. 60 N","D. 6 000 N"],"answer":"B","explain":"F = p × S = 3 000 × 0,2 = 600 N.","points":0.25},{"type":"mcq","level":"NB","q":"Paxcan viết tắt là","options":["A. P","B. Pa","C. p","D. PA"],"answer":"B","explain":"Paxcan kí hiệu là Pa.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai khối gạch giống nhau, mỗi khối nặng 20 N, kích thước 0,2 m × 0,1 m × 0,06 m. Xếp chồng hai khối lên nhau theo mặt có diện tích nhỏ nhất. Áp suất lên mặt bàn là","options":["A. 666,7 Pa","B. 3 333,3 Pa","C. 333,3 Pa","D. 6 666,7 Pa"],"answer":"D","explain":"F = 40 N; S = 0,1 × 0,06 = 0,006 m²; p = 40 / 0,006 ≈ 6 666,7 Pa.","points":0.25},{"type":"mcq","level":"VD","q":"Một người đứng trên tấm ván lót: áp lực 700 N, diện tích 1,4 m². Áp suất là","options":["A. 980 Pa","B. 500 Pa","C. 5 000 Pa","D. 98 Pa"],"answer":"B","explain":"p = 700 / 1,4 = 500 Pa.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các cách sau, cách nào làm GIẢM áp suất?","options":["A. Mài dao sắc","B. Ấn mạnh tay","C. Kê thêm gối mềm dưới vật nặng","D. Làm đầu đinh nhọn"],"answer":"C","explain":"Gối mềm tăng diện tích tiếp xúc, giảm p.","points":0.25},{"type":"mcq","level":"NB","q":"Áp suất càng lớn thì","options":["A. Tác dụng lên mặt bị ép càng yếu","B. Tác dụng lên mặt bị ép càng mạnh","C. Vật càng nhẹ","D. Diện tích càng lớn"],"answer":"B","explain":"p lớn thì tác dụng mạnh.","points":0.25},{"type":"truefalse","level":"VD","q":"Tổng hợp kiến thức. Đánh giá.","statements":["a) Áp lực vuông góc với mặt bị ép.","b) p = F / S; đơn vị Pa.","c) Muốn tăng p: tăng F hoặc giảm S.","d) Muốn giảm p: tăng F hoặc giảm S."],"answer":["T","T","T","F"],"explain":"Muốn giảm p: giảm F hoặc tăng S.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Áp suất là độ lớn áp lực trên một đơn vị diện tích.","b) 1 kPa = 1 000 Pa.","c) Dao càng sắc cắt càng dễ.","d) Xích xe tăng làm tăng áp suất."],"answer":["T","T","T","F"],"explain":"Xích xe tăng làm giảm áp suất.","points":1},{"type":"short","level":"VDC","q":"Một diện tích 0,006 m² chịu áp lực 40 N. Áp suất là bao nhiêu Pa?","answer":"6666,7","explain":"p = 40 / 0,006 ≈ 6 666,7 Pa.","points":0.5},{"type":"short","level":"TH","q":"Khi diện tích bị ép giảm 2 lần (F không đổi), áp suất thay đổi thế nào?","answer":"Tăng 2 lần","explain":"p tỉ lệ nghịch với S.","points":0.5}]}]}
