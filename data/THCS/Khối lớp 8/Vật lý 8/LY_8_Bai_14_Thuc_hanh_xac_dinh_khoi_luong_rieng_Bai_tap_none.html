{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Mục đích của bài thực hành là","options":["A. Chế tạo cân","B. Xác định khối lượng riêng của vật rắn và chất lỏng","C. Đo nhiệt độ","D. Pha chế dung dịch"],"answer":"B","explain":"Bài thực hành nhằm xác định D của vật rắn và chất lỏng.","points":0.25},{"type":"mcq","level":"TH","q":"Để xác định khối lượng riêng, ta cần đo hai đại lượng nào?","options":["A. Khối lượng và trọng lượng","B. Khối lượng và thể tích","C. Thể tích và nhiệt độ","D. Khối lượng và chiều dài"],"answer":"B","explain":"D = m / V nên cần đo khối lượng m và thể tích V.","points":0.25},{"type":"mcq","level":"VD","q":"Thả hòn đá vào bình chia độ: mực nước từ 150 ml dâng lên 210 ml. Thể tích hòn đá là","options":["A. 150 ml","B. 210 ml","C. 60 ml","D. 360 ml"],"answer":"C","explain":"V = V₂ - V₁ = 210 - 150 = 60 ml.","points":0.25},{"type":"mcq","level":"VDC","q":"Bình rỗng nặng 80 g, đổ 120 ml nước muối vào cân được 200 g. Khối lượng riêng của nước muối là","options":["A. 1,67 g/cm³","B. 1 g/cm³","C. 0,6 g/cm³","D. 2,5 g/cm³"],"answer":"B","explain":"m = 120 g, V = 120 cm³ nên D = 1 g/cm³.","points":0.25},{"type":"mcq","level":"NB","q":"Dụng cụ dùng để đo khối lượng vật rắn là","options":["A. Bình chia độ","B. Cân","C. Thước","D. Lực kế"],"answer":"B","explain":"Cân dùng để đo khối lượng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi thả hòn đá vào bình chia độ, cần chú ý","options":["A. Thả mạnh để đá chìm nhanh","B. Thả nhẹ nhàng để nước không bắn ra ngoài","C. Đổ nước thật đầy bình","D. Không cần đọc mực nước ban đầu"],"answer":"B","explain":"Thả nhẹ để nước không bắn ra ngoài làm sai kết quả.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về dụng cụ.","statements":["a) Cân dùng để đo khối lượng.","b) Bình chia độ dùng để đo thể tích.","c) Nhiệt kế dùng để đo khối lượng riêng.","d) Dây treo mảnh giúp thả vật chìm hẳn vào nước."],"answer":["T","T","F","T"],"explain":"Không đo trực tiếp D bằng nhiệt kế.","points":1},{"type":"truefalse","level":"VD","q":"Một nhóm đo được: m = 156 g, V₁ = 150 ml, V₂ = 210 ml. Đánh giá.","statements":["a) Thể tích hòn đá là 60 cm³.","b) Khối lượng riêng hòn đá là 2,6 g/cm³.","c) Đổi ra đơn vị SI được 2 600 kg/m³.","d) Hòn đá chắc chắn là sắt."],"answer":["T","T","T","F"],"explain":"D = 2,6 g/cm³ gần với đá, không phải sắt (7,8 g/cm³).","points":1},{"type":"short","level":"TH","q":"Viết công thức tính thể tích hòn đá qua hai lần đọc mực nước V₁, V₂.","answer":"V = V₂ - V₁","explain":"Thể tích hòn đá bằng độ dâng mực nước.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao phải đo 3 lần rồi lấy giá trị trung bình? (Trả lời ngắn gọn)","answer":"Để giảm sai số ngẫu nhiên","explain":"Đo lặp lại lấy trung bình giảm sai số ngẫu nhiên.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"TH","q":"Thứ tự đúng khi xác định D của hòn đá là","options":["A. Đo V, đo m, tính D","B. Đo m, đo V, tính D","C. Tính D, đo m, đo V","D. Đo m, tính D, đo V"],"answer":"B","explain":"Đo khối lượng trước, đo thể tích, cuối cùng tính D = m / V.","points":0.25},{"type":"mcq","level":"NB","q":"Thể tích hòn đá được xác định dựa vào","options":["A. Độ dâng của mực nước trong bình chia độ","B. Khối lượng của hòn đá","C. Màu sắc của hòn đá","D. Nhiệt độ của nước"],"answer":"A","explain":"Thể tích vật rắn bằng thể tích nước dâng lên.","points":0.25},{"type":"mcq","level":"VDC","q":"Đo được m = 270 g, V = 100 cm³. Đổi ra kg/m³ và nhận xét chất liệu","options":["A. 2 700 kg/m³, có thể là nhôm","B. 27 000 kg/m³, là chì","C. 270 kg/m³, là gỗ","D. 2,7 kg/m³, là xốp"],"answer":"A","explain":"D = 2,7 g/cm³ = 2 700 kg/m³, trùng với nhôm.","points":0.25},{"type":"mcq","level":"VD","q":"Bình chia độ có GHĐ 200 ml, ĐCNN 2 ml. Mực nước đọc được 124 ml. Kết quả đọc có thể là","options":["A. 123 ml","B. 124 ml","C. 130 ml","D. 124,5 ml"],"answer":"B","explain":"Đọc theo vạch chia, ước lượng đến 1 ml: 124 ml là hợp lý.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đọc mực chất lỏng trong bình chia độ, mắt phải đặt","options":["A. Cao hơn mặt thoáng","B. Thấp hơn mặt thoáng","C. Ngang với mặt thoáng","D. Tùy ý"],"answer":"C","explain":"Mắt đặt ngang mặt thoáng để tránh sai số thị giác.","points":0.25},{"type":"mcq","level":"NB","q":"1 ml bằng bao nhiêu cm³?","options":["A. 0,1 cm³","B. 1 cm³","C. 10 cm³","D. 100 cm³"],"answer":"B","explain":"1 ml = 1 cm³.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về sai số.","statements":["a) Vạch chia càng nhỏ thì đo càng chính xác.","b) Đọc mực nước không ngang mặt thoáng gây sai số.","c) Nước bắn ra ngoài khi thả đá làm V đo được nhỏ đi.","d) Đo một lần là đủ, không cần đo lặp lại."],"answer":["T","T","T","F"],"explain":"Nên đo 3 lần lấy trung bình để giảm sai số.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) D = m / V.","b) V hòn đá = V₂ - V₁.","c) m nước muối = m₂ - m₁ (trừ khối lượng bình).","d) Có thể đo trực tiếp D bằng cân."],"answer":["T","T","T","F"],"explain":"Không có dụng cụ đo trực tiếp D.","points":1},{"type":"short","level":"VDC","q":"Một học sinh quên trừ khối lượng bình khi tính D nước muối. Kết quả sẽ như thế nào?","answer":"Lớn hơn giá trị đúng","explain":"m tính lớn hơn thực tế nên D tính ra lớn hơn.","points":0.5},{"type":"short","level":"TH","q":"Để đo thể tích chất lỏng, ta đọc mực chất lỏng theo bộ phận nào của mặt khum?","answer":"Đáy của mặt khum","explain":"Với nước, đọc theo đáy của mặt khum lõm.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Khối lượng của nước muối trong bình được xác định bằng","options":["A. Cân trực tiếp nước muối","B. Cân bình chứa nước muối trừ đi khối lượng bình rỗng","C. Đo thể tích rồi đoán","D. Nhìn màu sắc"],"answer":"B","explain":"m = m₂ - m₁: trừ khối lượng vỏ bình.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao hòn đá phải chìm hẳn trong nước khi đo thể tích?","options":["A. Để đá không bị ướt","B. Để thể tích nước dâng lên đúng bằng thể tích hòn đá","C. Để nước trong hơn","D. Để cân dễ hơn"],"answer":"B","explain":"Chỉ khi chìm hẳn, thể tích nước dâng lên mới bằng thể tích vật.","points":0.25},{"type":"mcq","level":"VD","q":"Ba lần đo cho D = 2,6; 2,69; 2,63 g/cm³. Giá trị trung bình là","options":["A. 2,64 g/cm³","B. 2,6 g/cm³","C. 2,69 g/cm³","D. 7,92 g/cm³"],"answer":"A","explain":"(2,6 + 2,69 + 2,63) / 3 = 2,64 g/cm³.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhóm đo được D hòn đá = 2,64 g/cm³. Đối chiếu bảng số liệu, có thể kết luận","options":["A. Chắc chắn là đá vôi","B. Có thể là đá (D đá khoảng 2,6 g/cm³)","C. Chắc chắn là sắt","D. Chắc chắn là nhôm"],"answer":"B","explain":"D gần với D của đá nên chỉ có thể kết luận định tính.","points":0.25},{"type":"mcq","level":"NB","q":"Trước khi cân, cân phải","options":["A. Để vật thật nặng lên","B. Hiệu chỉnh về 0","C. Đổ nước lên đĩa cân","D. Đặt nơi ẩm ướt"],"answer":"B","explain":"Cân phải được hiệu chỉnh về 0 trước khi đo.","points":0.25},{"type":"mcq","level":"TH","q":"Bình tràn dùng để","options":["A. Đo thể tích vật rắn to hơn bình chia độ","B. Chứa nước uống","C. Cân vật","D. Đun nóng chất lỏng"],"answer":"A","explain":"Bình tràn giúp đo thể tích vật rắn lớn.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các bước thí nghiệm với hòn đá.","statements":["a) Cân khối lượng hòn đá trước.","b) Đo mực nước ban đầu V₁.","c) Thả đá chìm hẳn rồi đọc V₂.","d) Tính D = m / (V₂ - V₁)."],"answer":["T","T","T","T"],"explain":"Đúng trình tự các bước.","points":1},{"type":"truefalse","level":"VD","q":"Số liệu: bình rỗng 100 g; đổ 200 ml chất lỏng X, cân được 260 g. Đánh giá.","statements":["a) Khối lượng chất lỏng X là 160 g.","b) Thể tích chất lỏng X là 200 cm³.","c) D của X là 0,8 g/cm³.","d) X có thể là dầu ăn."],"answer":["T","T","T","T"],"explain":"D = 160/200 = 0,8 g/cm³, trùng với dầu ăn.","points":1},{"type":"short","level":"TH","q":"120 ml bằng bao nhiêu cm³?","answer":"120","explain":"1 ml = 1 cm³ nên 120 ml = 120 cm³.","points":0.5},{"type":"short","level":"VDC","q":"Nếu hòn đá nổi trên mặt nước thì có đo được thể tích bằng cách thả vào bình chia độ không? Vì sao? (Trả lời ngắn gọn)","answer":"Không vì thể tích nước dâng không bằng thể tích vật","explain":"Vật nổi thì thể tích chìm nhỏ hơn thể tích vật.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Kết quả D đo được cần được đối chiếu với","options":["A. Sách giáo khoa môn Văn","B. Bảng khối lượng riêng của các chất","C. Lịch thi đấu","D. Bản đồ"],"answer":"B","explain":"Đối chiếu bảng số liệu để nhận biết chất liệu.","points":0.25},{"type":"mcq","level":"NB","q":"Đại lượng nào đo bằng bình chia độ?","options":["A. Khối lượng","B. Thể tích","C. Nhiệt độ","D. Thời gian"],"answer":"B","explain":"Bình chia độ dùng để đo thể tích.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai nhóm đo cùng một hòn đá: nhóm A dùng bình ĐCNN 1 ml, nhóm B dùng bình ĐCNN 5 ml. Nhóm nào cho kết quả chính xác hơn?","options":["A. Nhóm A","B. Nhóm B","C. Hai nhóm như nhau","D. Không xác định được"],"answer":"A","explain":"ĐCNN càng nhỏ, phép đo càng chính xác.","points":0.25},{"type":"mcq","level":"VD","q":"Cân được hòn đá nặng 195 g; V₁ = 100 ml, V₂ = 175 ml. D của hòn đá là","options":["A. 2,6 g/cm³","B. 1,95 g/cm³","C. 1,11 g/cm³","D. 2,9 g/cm³"],"answer":"A","explain":"V = 75 cm³; D = 195 / 75 = 2,6 g/cm³.","points":0.25},{"type":"mcq","level":"TH","q":"Khi cân chất lỏng bằng cân đĩa, để tránh làm hỏng cân cần","options":["A. Đổ trực tiếp chất lỏng lên đĩa cân","B. Dùng bình chứa chất lỏng, không để chất lỏng dính vào cân","C. Đổ thật nhiều chất lỏng","D. Cân thật nhanh"],"answer":"B","explain":"Chất lỏng dính vào cân gây hỏng và sai số.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị của thể tích đo bằng bình chia độ thường là","options":["A. kg","B. ml","C. N","D. độ C"],"answer":"B","explain":"Bình chia độ thường chia theo ml.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá cách xử lí số liệu.","statements":["a) Mỗi đại lượng nên đo 3 lần.","b) Lấy giá trị trung bình để giảm sai số ngẫu nhiên.","c) Ghi kết quả vào bảng có kẻ sẵn.","d) Chỉ cần ghi kết quả cuối cùng, không cần ghi số liệu thô."],"answer":["T","T","T","F"],"explain":"Cần ghi đầy đủ số liệu thô vào bảng.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định an toàn.","statements":["a) Cẩn thận khi cầm bình thủy tinh.","b) Lau khô tay và dụng cụ sau thí nghiệm.","c) Được dùng miệng thử bình thủy tinh vỡ.","d) Để vỏ bình thủy tinh vỡ trên bàn."],"answer":["T","T","F","F"],"explain":"Không dùng miệng thử đồ vỡ; vỡ phải được dọn dẹp cẩn thận.","points":1},{"type":"short","level":"VDC","q":"Một bình chia độ có GHĐ 100 ml nhưng vật cần đo có thể tích khoảng 150 ml. Em sẽ làm gì? (Trả lời ngắn gọn)","answer":"Dùng bình tràn hoặc bình chia độ lớn hơn","explain":"Dùng bình tràn hoặc dụng cụ có GHĐ phù hợp.","points":0.5},{"type":"short","level":"TH","q":"Để xác định D của chất lỏng, ngoài bình chia độ còn cần dụng cụ gì để đo khối lượng?","answer":"Cân","explain":"Cân để đo khối lượng bình rỗng và bình chứa chất lỏng.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Công thức tính khối lượng riêng là","options":["A. D = m / V","B. D = m × V","C. D = V / m","D. D = P / V"],"answer":"A","explain":"D = m / V.","points":0.25},{"type":"mcq","level":"TH","q":"Số liệu: m = 78 g, V₁ = 120 ml, V₂ = 150 ml. D là","options":["A. 2,6 g/cm³","B. 0,65 g/cm³","C. 1,3 g/cm³","D. 5,2 g/cm³"],"answer":"A","explain":"V = 30 cm³; D = 78 / 30 = 2,6 g/cm³.","points":0.25},{"type":"mcq","level":"VD","q":"Một cốc đựng 250 ml sữa (D = 1,03 g/cm³). Khối lượng sữa là","options":["A. 257,5 g","B. 242,7 g","C. 250 g","D. 25,75 g"],"answer":"A","explain":"m = D × V = 1,03 × 250 = 257,5 g.","points":0.25},{"type":"mcq","level":"VDC","q":"Học sinh đo được D nước muối = 1,05 g/cm³ trong khi giá trị thật là 1,02 g/cm³. Nguyên nhân có thể là","o s":["A. Không cần đo lại","B. Đọc lại V và cân lại m₂","C. Chỉ cân lại","D. Chỉ đọc V"],"answer":"B","explain":"V và m₂ đều thay đổi nên phải đo lại cả hai.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá trình tự thí nghiệm 2.","statements":["a) Cân bình rỗng được m₁.","b) Đổ chất lỏng vào bình, đọc V.","c) Cân bình chứa chất lỏng được m₂.","d) Tính D = (m₂ - m₁) / V."],"answer":["T","T","T","T"],"explain":"Đúng trình tự.","points":1},{"type":"truefalse","level":"VD","q":"Số liệu nhóm B: m₁ = 90 g, m₂ = 210 g, V = 100 ml. Đánh giá.","statements":["a) m chất lỏng = 120 g.","b) D = 1,2 g/cm³.","c) Chất lỏng có thể là nước muối đặc.","d) Nếu m₁ đo sai thiếu 10 g thì D tính ra nhỏ hơn thực tế."],"answer":["T","T","T","F"],"explain":"m₁ thiếu làm m tính lớn hơn, D lớn hơn thực tế.","points":1},{"type":"short","level":"TH","q":"Viết công thức tính khối lượng chất lỏng trong bình qua m₁ (bình rỗng) và m₂ (bình chứa chất lỏng).","answer":"m = m₂ - m₁","explain":"Lấy khối lượng cả bình trừ khối lượng vỏ bình.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao không nên dùng tay bốc trực tiếp hòn đá ướt khi cân? (Trả lời ngắn gọn)","answer":"Vì nước dính vào tay làm giảm khối lượng đo","explain":"Nước theo tay mất đi làm m đo nhỏ hơn.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"TH","q":"Đơn vị của D khi m đo bằng g và V đo bằng cm³ là","options":["A. kg/m³","B. g/cm³","C. N/m³","D. g/m³"],"answer":"B","explain":"g chia cm³ cho đơn vị g/cm³.","points":0.25},{"type":"mcq","level":"NB","q":"Bình chia độ dùng để đo","options":["A. Khối lượng","B. Thể tích chất lỏng","C. Nhiệt độ","D. Lực"],"answer":"B","explain":"Bình chia độ đo thể tích.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hòn đá có D = 2,5 g/cm³. Thả vào nước, hòn đá sẽ","options":["A. Nổi","B. Chìm","C. Lơ lửng","D. Tan"],"answer":"B","explain":"D đá lớn hơn D nước nên chìm.","points":0.25},{"type":"mcq","level":"VD","q":"Đo được m = 52 g, V = 20 cm³. D và nhận định chất liệu","options":["A. 2,6 g/cm³, có thể là đá","B. 1,04 g/cm³, là nước","C. 5,2 g/cm³, là sắt","D. 0,38 g/cm³, là xốp"],"answer":"A","explain":"D = 2,6 g/cm³, phù hợp với đá.","points":0.25},{"type":"mcq","level":"TH","q":"Để kết quả chính xác, khi thả vật vào bình chia độ nên","options":["A. Thả nhanh, mạnh","B. Dùng dây treo thả từ từ","C. Ném vật vào","D. Lắc mạnh bình"],"answer":"B","explain":"Thả từ từ tránh nước bắn ra ngoài.","points":0.25},{"type":"mcq","level":"NB","q":"Báo cáo thực hành không cần có","options":["A. Bảng số liệu","B. Nhận xét kết quả","C. Ảnh cá nhân của từng thành viên","D. Cách tiến hành"],"answer":"C","explain":"Báo cáo cần số liệu và nhận xét, không cần ảnh cá nhân.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các tình huống.","statements":["a) Bình chia độ bị mờ không đọc được vạch: thay bình khác.","b) Cân hết pin giữa chừng: thay pin rồi hiệu chỉnh lại.","c) Nước tràn ra ngoài khi thả đá: vẫn dùng số liệu cũ.","d) Đá bị vỡ khi thả: nhặt hết các mảnh rồi đo lại."],"answer":["T","T","F","F"],"explain":"Nước tràn ra phải đo lại từ đầu; đá vỡ làm đổi mẫu đo.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Thực hành giúp hiểu sâu công thức D = m / V.","b) Thực hành rèn kĩ năng đo lường.","c) Thực hành không cần ghi chép.","d) Thực hành cần tuân thủ an toàn."],"answer":["T","T","F","T"],"explain":"Phải ghi chép số liệu đầy đủ.","points":1},{"type":"short","level":"VDC","q":"Một vật có D = 0,9 g/cm³ thả vào nước sẽ nổi hay chìm?","answer":"Nổi","explain":"D vật nhỏ hơn D nước nên nổi.","points":0.5},{"type":"short","level":"TH","q":"Khi đo thể tích bằng bình tràn, thể tích vật bằng thể tích của phần nào?","answer":"Nước tràn ra","explain":"Thể tích nước tràn ra bằng thể tích vật.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Trong bài thực hành, đại lượng nào được đo trực tiếp bằng cân?","options":["A. Thể tích","B. Khối lượng","C. Khối lượng riêng","D. Nhiệt độ"],"answer":"B","explain":"Cân đo trực tiếp khối lượng.","points":0.25},{"type":"mcq","level":"TH","q":"V₁ = 200 ml, V₂ = 260 ml, m = 156 g. D là","options":["A. 2,6 g/cm³","B. 0,78 g/cm³","C. 0,6 g/cm³","D. 1,3 g/cm³"],"answer":"A","explain":"V = 60 cm³; D = 156 / 60 = 2,6 g/cm³.","points":0.25},{"type":"mcq","level":"VD","q":"Một chai 500 ml đựng đầy mật ong (D = 1,4 g/cm³). Khối lượng mật ong là","options":["A. 357 g","B. 700 g","C. 500 g","D. 70 g"],"answer":"B","explain":"m = 1,4 × 500 = 700 g.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai hòn đá giống hệt nhau, nhóm A đo 1 lần, nhóm B đo 3 lần lấy trung bình. Kết quả nào đáng tin cậy hơn?","options":["A. Nhóm A","B. Nhóm B","C. Như nhau","D. Không kết luận được"],"answer":"B","explain":"Đo lặp lại lấy trung bình giảm sai số ngẫu nhiên.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị SI của khối lượng riêng là","options":["A. g/cm³","B. kg/m³","C. N/m³","D. ml"],"answer":"B","explain":"Đơn vị SI là kg/m³.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đọc thể tích, nếu mắt đặt cao hơn mặt thoáng thì kết quả","options":["A. Chính xác","B. Lớn hơn thực tế","C. Nhỏ hơn thực tế","D. Không ảnh hưởng"],"answer":"C","explain":"Nhìn từ trên xuống thấy mực nước thấp đi, đọc nhỏ hơn.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về mục đích.","statements":["a) Biết cách dùng cân và bình chia độ.","b) Xác định được D của vật rắn.","c) Xác định được D của chất lỏng.","d) Chế tạo được cân mới."],"answer":["T","T","T","F"],"explain":"Không chế tạo cân trong bài này.","points":1},{"type":"truefalse","level":"VD","q":"Cho số liệu: m đá = 130 g; V₁ = 90 ml; V₂ = 140 ml. Đánh giá.","statements":["a) V đá = 50 cm³.","b) D đá = 2,6 g/cm³.","c) Đổi ra SI: 2 600 kg/m³.","d) Đá này nhẹ hơn nước."],"answer":["T","T","T","F"],"explain":"D đá lớn hơn D nước nên đá nặng hơn nước, chìm trong nước.","points":1},{"type":"short","level":"TH","q":"Nếu chỉ có cân mà không có bình chia độ, có xác định được D của hòn đá không?","answer":"Không","explain":"Thiếu thể tích V thì không tính được D = m / V.","points":0.5},{"type":"short","level":"VDC","q":"Để đo D của chất lỏng dễ bay hơi nhanh (như cồn), cần thao tác như thế nào? (Trả lời ngắn gọn)","answer":"Thao tác nhanh và đậy kín bình","explain":"Hạn chế bay hơi làm giảm khối lượng.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"1 g/cm³ bằng","options":["A. 1 000 kg/m³","B. 100 kg/m³","C. 10 kg/m³","D. 1 kg/m³"],"answer":"A","explain":"1 g/cm³ = 1 000 kg/m³.","points":0.25},{"type":"mcq","level":"NB","q":"Kí hiệu của thể tích là","options":["A. m","B. V","C. D","D. d"],"answer":"B","explain":"Thể tích kí hiệu là V.","points":0.25},{"type":"mcq","level":"VDC","q":"Một miếng gỗ có D = 0,7 g/cm³, thể tích 200 cm³. Khối lượng miếng gỗ và thể tích nước có cùng khối lượng là","options":["A. 140 g; 140 cm³","B. 140 g; 200 cm³","C. 285 g; 285 cm³","D. 140 g; 285 cm³"],"answer":"A","explain":"m = 0,7 × 200 = 140 g; V nước = 140 / 1 = 140 cm³.","points":0.25},{"type":"mcq","level":"VD","q":"Bình rỗng 150 g; đổ 300 ml nước đường, cân được 480 g. D của nước đường là","options":["A. 1,6 g/cm³","B. 1,1 g/cm³","C. 0,5 g/cm³","D. 1,0 g/cm³"],"answer":"B","explain":"m = 330 g; D = 330 / 300 = 1,1 g/cm³.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào ĐÚNG?","options":["A. Đo 3 lần lấy trung bình giảm sai số","B. Đo càng nhiều càng sai","C. Chỉ cần đo 1 lần thật nhanh","D. Không cần ghi đơn vị"],"answer":"A","explain":"Đo lặp lại lấy trung bình giảm sai số ngẫu nhiên.","points":0.25},{"type":"mcq","level":"NB","q":"Sau thí nghiệm, cần","options":["A. Để nguyên hiện trường","B. Vệ sinh, lau khô dụng cụ và sắp xếp gọn gàng","C. Đổ bỏ dụng cụ","D. Mang về nhà"],"answer":"B","explain":"Vệ sinh và sắp xếp dụng cụ sau thí nghiệm.","points":0.25},{"type":"truefalse","level":"VD","q":"Tổng hợp kiến thức bài thực hành. Đánh giá.","statements":["a) D vật rắn đo qua m và độ dâng mực nước.","b) D chất lỏng đo qua trừ khối lượng bình.","c) 1 ml = 1 cm³.","d) Không cần đổi đơn vị khi báo cáo."],"answer":["T","T","T","F"],"explain":"Nên đổi ra đơn vị SI (kg/m³) khi báo cáo.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Cân đo khối lượng.","b) Bình chia độ đo thể tích.","c) D = m / V.","d) Mắt đặt ngang mặt thoáng khi đọc."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"short","level":"VDC","q":"Một vật có thể tích 50 cm³, khối lượng 130 g. Vật nổi hay chìm trong nước?","answer":"Chìm","explain":"D = 2,6 g/cm³ lớn hơn D nước nên chìm.","points":0.5},{"type":"short","level":"TH","q":"Để xác định D của một chất lỏng, ta cần đo thể tích bằng dụng cụ gì?","answer":"Bình chia độ","explain":"Bình chia độ đo thể tích chất lỏng.","points":0.5}]}]}
