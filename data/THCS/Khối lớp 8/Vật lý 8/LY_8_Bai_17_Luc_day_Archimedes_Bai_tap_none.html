{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Lực đẩy Archimedes có phương, chiều như thế nào?","options":["A. Phương thẳng đứng, chiều từ dưới lên","B. Phương thẳng đứng, chiều từ trên xuống","C. Phương nằm ngang","D. Phương xiên"],"answer":"A","explain":"Lực đẩy Archimedes hướng từ dưới lên theo phương thẳng đứng.","points":0.25},{"type":"mcq","level":"TH","q":"Công thức tính lực đẩy Archimedes là","options":["A. FA = d × V","B. FA = P + F","C. FA = d / V","D. FA = P × V"],"answer":"A","explain":"FA = d × V (d: trọng lượng riêng chất lỏng, V: thể tích phần chìm).","points":0.25},{"type":"mcq","level":"VD","q":"Một khối sắt có thể tích 0,002 m³ nhúng chìm hoàn toàn trong nước (d = 10 000 N/m³). Lực đẩy Archimedes là","options":["A. 2 N","B. 20 N","C. 200 N","D. 0,2 N"],"answer":"B","explain":"FA = 10 000 × 0,002 = 20 N.","points":0.25},{"type":"mcq","level":"VDC","q":"Treo vật vào lực kế, số chỉ trong không khí là 8 N, khi nhúng chìm trong nước số chỉ còn 5 N. Lực đẩy Archimedes và thể tích của vật là","options":["A. 3 N; 0,0003 m³","B. 13 N; 0,0013 m³","C. 3 N; 0,003 m³","D. 5 N; 0,0005 m³"],"answer":"A","explain":"FA = 8 - 5 = 3 N; V = 3 / 10 000 = 0,0003 m³.","points":0.25},{"type":"mcq","level":"NB","q":"Khi nhúng vật vào chất lỏng, số chỉ của lực kế","options":["A. Tăng lên","B. Giảm đi","C. Không đổi","D. Bằng không"],"answer":"B","explain":"Lực đẩy Archimedes làm giảm số chỉ lực kế.","points":0.25},{"type":"mcq","level":"TH","q":"Lực đẩy Archimedes bằng","options":["A. Trọng lượng của vật","B. Trọng lượng của phần chất lỏng bị vật chiếm chỗ","C. Khối lượng của vật","D. Thể tích của vật"],"answer":"B","explain":"FA bằng trọng lượng phần chất lỏng bị chiếm chỗ.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Vật nhúng trong chất lỏng chịu lực đẩy hướng từ dưới lên.","b) Lực đẩy đó gọi là lực đẩy Archimedes.","c) FA = P - F (P, F là số chỉ lực kế).","d) Lực đẩy Archimedes hướng từ trên xuống."],"answer":["T","T","T","F"],"explain":"Lực đẩy hướng từ dưới lên.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về độ lớn FA.","statements":["a) FA = d × V.","b) V là thể tích phần vật chìm trong chất lỏng.","c) Vật chìm hẳn thì V là toàn bộ thể tích vật.","d) FA tăng khi vật xuống sâu hơn (đã chìm hẳn)."],"answer":["T","T","T","F"],"explain":"Khi đã chìm hẳn, FA không đổi theo độ sâu.","points":1},{"type":"short","level":"TH","q":"Một vật chìm hẳn trong dầu (d = 8 000 N/m³), thể tích vật 0,001 m³. Tính FA (N).","answer":"8","explain":"FA = 8 000 × 0,001 = 8 N.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao tàu ngầm có thể lặn xuống và nổi lên? (Trả lời ngắn gọn)","answer":"Vì thay đổi lượng nước trong khoang để điều chỉnh khối lượng riêng trung bình","explain":"Cho nước vào để lặn, bơm nước ra để nổi.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"TH","q":"Điều kiện để vật chìm xuống đáy khi thả vào chất lỏng là","options":["A. P nhỏ hơn FA","B. P lớn hơn FA","C. P bằng FA","D. P bằng không"],"answer":"B","explain":"P lớn hơn FA thì vật chìm.","points":0.25},{"type":"mcq","level":"NB","q":"Lực đẩy Archimedes được đặt theo tên nhà bác học","options":["A. Newton","B. Archimedes","C. Pascal","D. Einstein"],"answer":"B","explain":"Nhà bác học Archimedes (Hy Lạp cổ đại).","points":0.25},{"type":"mcq","level":"VDC","q":"Một khúc gỗ có thể tích 0,01 m³ nổi trên mặt nước, phần chìm có thể tích 0,006 m³. Trọng lượng của khúc gỗ là","options":["A. 100 N","B. 60 N","C. 40 N","D. 160 N"],"answer":"B","explain":"Vật nổi đứng yên: P = FA = 10 000 × 0,006 = 60 N.","points":0.25},{"type":"mcq","level":"VD","q":"Thả một viên bi sắt đặc vào cốc nước. Hiện tượng xảy ra là","options":["A. Viên bi nổi","B. Viên bi chìm xuống đáy","C. Viên bi lơ lửng","D. Viên bi tan"],"answer":"B","explain":"D sắt lớn hơn D nước nên P lớn hơn FA, viên bi chìm.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vật nổi và đứng yên trên mặt chất lỏng thì","options":["A. P lớn hơn FA","B. P nhỏ hơn FA","C. P bằng FA","D. FA bằng không"],"answer":"C","explain":"Vật đứng yên thì hai lực cân bằng: P = FA.","points":0.25},{"type":"mcq","level":"NB","q":"Trong công thức FA = d × V, d là","options":["A. Trọng lượng riêng của vật","B. Trọng lượng riêng của chất lỏng","C. Khối lượng riêng của vật","D. Áp suất"],"answer":"B","explain":"d là trọng lượng riêng của chất lỏng.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về nổi - chìm.","statements":["a) D vật lớn hơn D lỏng thì vật chìm.","b) D vật bằng D lỏng thì vật lơ lửng.","c) D vật nhỏ hơn D lỏng thì vật nổi.","d) Vật bằng sắt đặc nổi trong thủy ngân."],"answer":["T","T","T","T"],"explain":"D sắt = 7 800 kg/m³ nhỏ hơn D thủy ngân = 13 600 kg/m³ nên sắt nổi trong thủy ngân.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Chất lỏng tác dụng lực đẩy lên vật nhúng trong nó.","b) Lực đẩy có phương thẳng đứng, chiều từ dưới lên.","c) FA = d × V.","d) Vật càng nặng thì FA càng lớn."],"answer":["T","T","T","F"],"explain":"FA phụ thuộc d và V chìm, không phụ thuộc khối lượng vật.","points":1},{"type":"short","level":"VDC","q":"Một quả bóng có thể tích 0,05 m³ được nhấn chìm hoàn toàn trong nước. Lực đẩy FA là bao nhiêu N?","answer":"500","explain":"FA = 10 000 × 0,05 = 500 N.","points":0.5},{"type":"short","level":"TH","q":"Khi vật lơ lửng trong chất lỏng thì P và FA quan hệ với nhau như thế nào?","answer":"P = FA","explain":"Lơ lửng: hai lực cân bằng.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Thể tích V trong công thức FA = d × V là","options":["A. Thể tích của bình","B. Thể tích phần vật chìm trong chất lỏng","C. Thể tích của chất lỏng","D. Thể tích phần vật nổi trên mặt"],"answer":"B","explain":"V là thể tích phần chất lỏng bị vật chiếm chỗ (phần chìm).","points":0.25},{"type":"mcq","level":"TH","q":"Một vật có P = 10 N nhúng trong nước chịu FA = 4 N. Vật sẽ","options":["A. Nổi lên","B. Chìm xuống","C. Lơ lửng","D. Đứng yên ở mọi vị trí"],"answer":"B","explain":"P lớn hơn FA nên vật chìm.","points":0.25},{"type":"mcq","level":"VD","q":"Nhúng chìm một vật có thể tích 500 cm³ vào trong nước. FA là","options":["A. 5 N","B. 50 N","C. 0,5 N","D. 500 N"],"answer":"A","explain":"V = 0,0005 m³; FA = 10 000 × 0,0005 = 5 N.","points":0.25},{"type":"mcq","level":"VDC","q":"Một tảng băng trôi có thể tích 100 000 m³ nổi trên biển, phần chìm chiếm 90% thể tích. Lực đẩy Archimedes (d nước biển = 10 300 N/m³) xấp xỉ","options":["A. 92 700 000 N","B. 927 000 000 N","C. 9 270 000 N","D. 927 000 N"],"answer":"B","explain":"V chìm = 90 000 m³; FA = 10 300 × 90 000 = 927 000 000 N.","points":0.25},{"type":"mcq","level":"NB","q":"Lực đẩy Archimedes xuất hiện khi","options":["A. Vật đặt trên mặt bàn","B. Vật nhúng trong chất lỏng (hoặc chất khí)","C. Vật rơi tự do","D. Vật đứng yên trong không khí"],"answer":"B","explain":"Vật nhúng trong chất lỏng/chất khí chịu lực đẩy Archimedes.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào SAI?","options":["A. FA hướng từ dưới lên","B. FA = d × V","C. FA phụ thuộc độ sâu của vật","D. Vật nổi đứng yên thì P = FA"],"answer":"C","explain":"FA không phụ thuộc độ sâu (khi vật đã chìm hẳn).","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) FA = P - F.","b) P là số chỉ lực kế trong không khí.","c) F là số chỉ lực kế khi vật nhúng trong chất lỏng.","d) FA = P + F."],"answer":["T","T","T","F"],"explain":"FA = P - F.","points":1},{"type":"truefalse","level":"VD","q":"Một vật có thể tích 0,004 m³, trọng lượng 50 N, nhúng chìm trong nước. Đánh giá.","statements":["a) FA = 40 N.","b) P lớn hơn FA nên vật chìm.","c) Lực cần thiết để giữ vật đứng yên trong nước là 10 N.","d) Nếu thả tay, vật sẽ nổi lên."],"answer":["T","T","T","F"],"explain":"P lớn hơn FA nên thả tay vật chìm xuống.","points":1},{"type":"short","level":"TH","q":"Một vật nhúng chìm trong nước có V = 0,003 m³. Tính FA (N).","answer":"30","explain":"FA = 10 000 × 0,003 = 30 N.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao người béo dễ nổi hơn người gầy khi tập bơi? (Trả lời ngắn gọn)","answer":"Vì mỡ có khối lượng riêng nhỏ làm D trung bình của cơ thể nhỏ hơn","explain":"D trung bình nhỏ hơn nước thì dễ nổi.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"So sánh FA tác dụng lên hai vật có cùng thể tích, một bằng sắt, một bằng gỗ, cùng nhúng chìm trong nước","options":["A. Vật sắt chịu FA lớn hơn","B. Vật gỗ chịu FA lớn hơn","C. Hai vật chịu FA bằng nhau","D. Không so sánh được"],"answer":"C","explain":"FA = d × V chỉ phụ thuộc V chìm, không phụ thuộc chất liệu vật.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị của lực đẩy Archimedes là","options":["A. kg","B. N","C. Pa","D. m³"],"answer":"B","explain":"Lực đẩy là một lực, đơn vị niutơn (N).","points":0.25},{"type":"mcq","level":"VDC","q":"Một quả cầu bằng sắt rỗng có thể tích ngoài 0,01 m³ nổi trên mặt nước, phần chìm 0,008 m³. Khối lượng của quả cầu là","options":["A. 100 kg","B. 80 kg","C. 20 kg","D. 8 kg"],"answer":"D","explain":"P = FA = 10 000 × 0,008 = 80 N, suy ra m = 8 kg.","points":0.25},{"type":"mcq","level":"VD","q":"Treo một vật nặng 12 N vào lực kế rồi nhúng chìm trong dầu (d = 8 000 N/m³). Biết thể tích vật 0,0005 m³. Số chỉ lực kế là","options":["A. 12 N","B. 8 N","C. 4 N","D. 16 N"],"answer":"B","explain":"FA = 8 000 × 0,0005 = 4 N; F = 12 - 4 = 8 N.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vật đã chìm hẳn, nhấn vật xuống sâu hơn thì FA","options":["A. Tăng lên","B. Giảm đi","C. Không đổi","D. Bằng không"],"answer":"C","explain":"FA = d × V không đổi khi V chìm không đổi.","points":0.25},{"type":"mcq","level":"NB","q":"Hiện tượng nào là ứng dụng của lực đẩy Archimedes?","options":["A. Tàu thủy nổi trên mặt nước","B. Dao rơi xuống đất","C. Xe chạy trên đường","D. Đèn sáng"],"answer":"A","explain":"Tàu nổi nhờ lực đẩy Archimedes.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về tàu thủy.","statements":["a) Vỏ tàu bằng thép nhưng tàu vẫn nổi.","b) Khoang rỗng chứa không khí làm D trung bình của tàu nhỏ hơn D nước.","c) Chở càng nhiều hàng, tàu càng chìm sâu.","d) Tàu thép đặc cũng nổi được như tàu rỗng."],"answer":["T","T","T","F"],"explain":"Thép đặc có D lớn hơn nước nên chìm.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Vật nhúng trong chất lỏng bị đẩy từ dưới lên.","b) FA có đơn vị là N.","c) FA = d × V.","d) V là thể tích toàn bộ bình chứa."],"answer":["T","T","T","F"],"explain":"V là thể tích phần vật chìm.","points":1},{"type":"short","level":"VDC","q":"Một miếng gỗ nổi trên mặt nước, 1/4 thể tích nổi trên mặt nước. D của gỗ là bao nhiêu kg/m³?","answer":"750","explain":"P = FA: D_gỗ × V = D_nước × 0,75V; D_gỗ = 750 kg/m³.","points":0.5},{"type":"short","level":"TH","q":"Lực đẩy Archimedes do chất khí tác dụng lên vật gọi là gì trong đời sống?","answer":"Lực nâng","explain":"Khinh khí cầu bay lên nhờ lực nâng của không khí.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Khi thả một cục nước đá vào cốc nước, cục đá sẽ","options":["A. Chìm xuống đáy","B. Nổi trên mặt nước","C. Lơ lửng giữa cốc","D. Tan ngay lập tức"],"answer":"B","explain":"D nước đá nhỏ hơn D nước nên nổi.","points":0.25},{"type":"mcq","level":"TH","q":"Một vật có D = 500 kg/m³ thả vào nước (D = 1 000 kg/m³) sẽ","options":["A. Chìm","B. Nổi","C. Lơ lửng","D. Chỉ chìm một nửa rồi dừng"],"answer":"B","explain":"D vật nhỏ hơn D nước nên nổi.","points":0.25},{"type":"mcq","level":"VD","q":"Một vật nặng 30 N nhúng chìm trong nước, lực kế chỉ 18 N. Thể tích của vật là","options":["A. 0,0012 m³","B. 0,003 m³","C. 0,0018 m³","D. 0,012 m³"],"answer":"A","explain":"FA = 12 N; V = 12 / 10 000 = 0,0012 m³.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai quả cầu cùng kích thước: một bằng chì đặc, một bằng xốp. Cùng nhấn chìm hoàn toàn trong nước rồi thả tay. Hiện tượng xảy ra","options":["A. Cả hai đều chìm","B. Cả hai đều nổi","C. Quả chì chìm, quả xốp nổi","D. Quả xốp chìm, quả chì nổi"],"answer":"C","explain":"Chì có D lớn hơn nước nên chìm; xốp có D nhỏ hơn nên nổi.","points":0.25},{"type":"mcq","level":"NB","q":"Lực đẩy Archimedes do không khí tác dụng lên khinh khí cầu gọi là","options":["A. Trọng lực","B. Lực nâng","C. Lực ma sát","D. Lực đàn hồi"],"answer":"B","explain":"Lực nâng giúp khinh khí cầu bay lên.","points":0.25},{"type":"mcq","level":"TH","q":"Phao cứu sinh giúp người nổi được vì","options":["A. Phao nặng","B. Phao làm bằng vật liệu nhẹ, tăng lực đẩy Archimedes","C. Phao có màu sắc sặc sỡ","D. Phao chống thấm nước"],"answer":"B","explain":"Vật liệu nhẹ làm D trung bình nhỏ, dễ nổi.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) D vật nhỏ hơn D lỏng thì vật nổi.","b) D vật lớn hơn D lỏng thì vật chìm.","c) D vật bằng D lỏng thì vật lơ lửng.","d) Vật nổi thì P lớn hơn FA."],"answer":["T","T","T","F"],"explain":"Vật nổi đứng yên thì P = FA.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về tàu ngầm.","statements":["a) Tàu ngầm thay đổi lượng nước trong khoang để lặn, nổi.","b) Muốn lặn: cho nước vào khoang.","c) Muốn nổi: bơm nước ra khỏi khoang.","d) Tàu ngầm lặn nhờ tăng thể tích."],"answer":["T","T","T","F"],"explain":"Tàu ngầm lặn nhờ tăng khối lượng (cho nước vào), thể tích ngoài không đổi.","points":1},{"type":"short","level":"TH","q":"Một vật có thể tích 200 cm³ nhúng chìm trong nước. FA là bao nhiêu N?","answer":"2","explain":"V = 0,0002 m³; FA = 10 000 × 0,0002 = 2 N.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao trứng thối nổi trong nước muối đặc nhưng chìm trong nước lã? (Trả lời ngắn gọn)","answer":"Vì D nước muối lớn hơn D trứng, D nước lã nhỏ hơn","explain":"So sánh D trứng với D chất lỏng.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Công thức FA = P - F dùng để","options":["A. Đo trực tiếp FA bằng lực kế","B. Xác định FA qua hai lần đo lực kế","C. Tính trọng lượng vật","D. Đo thể tích vật"],"answer":"B","explain":"Đo P trong không khí và F trong chất lỏng, suy ra FA.","points":0.25},{"type":"mcq","level":"NB","q":"Khi vật nổi đứng yên trên mặt thoáng, thể tích phần chìm","options":["A. Bằng không","B. Bằng toàn bộ thể tích vật","C. Nhỏ hơn thể tích vật","D. Lớn hơn thể tích vật"],"answer":"C","explain":"Vật nổi thì một phần chìm, một phần nổi.","points":0.25},{"type":"mcq","level":"VDC","q":"Một khối gỗ hình hộp 0,2 m × 0,1 m × 0,05 m (D = 600 kg/m³) thả nổi trong nước. Chiều cao phần nổi trên mặt nước là","options":["A. 0,02 m","B. 0,03 m","C. 0,04 m","D. 0,05 m"],"answer":"A","explain":"Tỉ lệ chìm = 600/1000 = 0,6; phần chìm = 0,03 m; phần nổi = 0,05 - 0,03 = 0,02 m.","points":0.25},{"type":"mcq","level":"VD","q":"Nhúng chìm một thỏi kim loại có thể tích 0,001 m³ vào thủy ngân (d = 136 000 N/m³). FA là","options":["A. 136 N","B. 13,6 N","C. 1 360 N","D. 1,36 N"],"answer":"A","explain":"FA = 136 000 × 0,001 = 136 N.","points":0.25},{"type":"mcq","level":"TH","q":"Lực đẩy Archimedes không phụ thuộc vào","options":["A. Trọng lượng riêng của chất lỏng","B. Thể tích phần vật chìm","C. Khối lượng của vật","D. Cả A và B đều sai"],"answer":"C","explain":"FA chỉ phụ thuộc d và V chìm.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị của thể tích V trong công thức FA = d × V là","options":["A. m³","B. cm","C. kg","D. lít"],"answer":"A","explain":"V đo bằng m³ (đơn vị SI).","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) FA bằng trọng lượng phần chất lỏng bị chiếm chỗ.","b) Vật chìm hẳn: V là toàn bộ thể tích vật.","c) Vật nổi: V là thể tích phần chìm.","d) FA phụ thuộc hình dạng của vật."],"answer":["T","T","T","F"],"explain":"FA không phụ thuộc hình dạng vật.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Nhúng vật vào nước thấy lực kế chỉ giảm.","b) Độ giảm do lực đẩy Archimedes gây ra.","c) Lực đẩy hướng từ dưới lên.","d) Tất cả mọi vật nhúng trong nước đều chìm."],"answer":["T","T","T","F"],"explain":"Vật có D nhỏ hơn nước thì nổi.","points":1},{"type":"short","level":"VDC","q":"Một vật có P = 25 N, khi nhúng chìm trong nước lực kế chỉ 15 N. Xác định FA và thể tích vật (m³). (Ghi 2 số cách nhau dấu chấm phẩy)","answer":"10; 0,001","explain":"FA = 10 N; V = 10 / 10 000 = 0,001 m³.","points":0.5},{"type":"short","level":"TH","q":"Để xác định FA bằng lực kế, ta cần đo mấy lần?","answer":"2","explain":"Đo P trong không khí và F trong chất lỏng.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Phát biểu nào ĐÚNG về lực đẩy Archimedes?","options":["A. Chỉ tác dụng lên vật chìm hoàn toàn","B. Tác dụng lên mọi vật nhúng trong chất lỏng","C. Hướng từ trên xuống","D. Bằng trọng lượng của vật"],"answer":"B","explain":"Mọi vật nhúng trong chất lỏng đều chịu lực đẩy.","points":0.25},{"type":"mcq","level":"TH","q":"Một quả bóng được nhấn chìm trong nước rồi thả tay, quả bóng","options":["A. Chìm xuống đáy","B. Nổi vọt lên mặt nước","C. Lơ lửng","D. Vỡ ra"],"answer":"B","explain":"D bóng nhỏ hơn D nước nên P nhỏ hơn FA, bóng nổi lên.","points":0.25},{"type":"mcq","level":"VD","q":"Một vật có khối lượng 2 kg, thể tích 0,001 m³, nhúng chìm trong nước. Lực cần thiết để giữ vật đứng yên là","options":["A. 20 N","B. 10 N","C. 30 N","D. 0 N"],"answer":"B","explain":"P = 20 N; FA = 10 N; lực giữ = 20 - 10 = 10 N.","points":0.25},{"type":"mcq","level":"VDC","q":"Thả một cục sắt đặc (D = 7 800 kg/m³) vào chậu thủy ngân (D = 13 600 kg/m³). Hiện tượng là","options":["A. Cục sắt chìm xuống đáy","B. Cục sắt nổi trên mặt thủy ngân","C. Cục sắt lơ lửng","D. Cục sắt tan"],"answer":"B","explain":"D sắt nhỏ hơn D thủy ngân nên nổi.","points":0.25},{"type":"mcq","level":"NB","q":"Khi vật chìm xuống đáy bình, lực đẩy Archimedes","options":["A. Bằng không","B. Vẫn tác dụng lên vật","C. Lớn hơn trọng lượng","D. Mất đi"],"answer":"B","explain":"Vật ở đáy vẫn chịu FA (nhỏ hơn P).","points":0.25},{"type":"mcq","level":"TH","q":"Tỉ trọng kế (kế đo nồng độ) hoạt động dựa trên","options":["A. Lực đẩy Archimedes","B. Áp suất khí quyển","C. Đòn bẩy","D. Ròng rọc"],"answer":"A","explain":"Vạch chìm cho biết D chất lỏng nhờ lực đẩy Archimedes.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) FA = d × V.","b) d là trọng lượng riêng của chất lỏng.","c) V là thể tích phần chìm.","d) Đơn vị FA là Pa."],"answer":["T","T","T","F"],"explain":"Đơn vị FA là N.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về khinh khí cầu.","statements":["a) Khinh khí cầu bay nhờ lực đẩy của không khí.","b) Khí trong cầu càng nhẹ thì lực nâng càng lớn.","c) Đốt nóng không khí trong cầu giúp cầu bay lên.","d) Khinh khí cầu không chịu tác dụng của trọng lực."],"answer":["T","T","T","F"],"explain":"Khinh khí cầu vẫn chịu trọng lực.","points":1},{"type":"short","level":"TH","q":"Một vật nổi trên mặt nước, phần chìm chiếm 3/4 thể tích. D của vật là bao nhiêu kg/m³?","answer":"750","explain":"D_vật = 0,75 × 1 000 = 750 kg/m³.","points":0.5},{"type":"short","level":"VDC","q":"Tại sao tàu chở hàng càng nhiều thì vạch mớn nước càng sâu? (Trả lời ngắn gọn)","answer":"Vì cần lực đẩy lớn hơn để cân bằng trọng lượng tăng","explain":"P tăng thì cần V chìm lớn hơn để FA = P.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"TH","q":"Trong các chất lỏng sau, chất nào tạo lực đẩy lớn nhất lên cùng một vật chìm hoàn toàn?","options":["A. Nước (d = 10 000 N/m³)","B. Dầu (d = 8 000 N/m³)","C. Thủy ngân (d = 136 000 N/m³)","D. Rượu (d = 8 000 N/m³)"],"answer":"C","explain":"FA tỉ lệ với d; thủy ngân có d lớn nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Lực đẩy Archimedes là lực","options":["A. Đẩy","B. Kéo","C. Hút","D. Ma sát"],"answer":"A","explain":"Là lực đẩy từ dưới lên.","points":0.25},{"type":"mcq","level":"VDC","q":"Một con tàu có trọng lượng 50 000 000 N nổi trên biển. Thể tích nước biển bị tàu chiếm chỗ là (d = 10 300 N/m³)","options":["A. 485,4 m³","B. 4 854 m³","C. 48,5 m³","D. 48 540 m³"],"answer":"B","explain":"V = P / d = 50 000 000 / 10 300 ≈ 4 854 m³.","points":0.25},{"type":"mcq","level":"VD","q":"Một hòn đá có thể tích 0,0004 m³ nhúng chìm trong nước. FA là","options":["A. 0,4 N","B. 4 N","C. 40 N","D. 400 N"],"answer":"B","explain":"FA = 10 000 × 0,0004 = 4 N.","points":0.25},{"type":"mcq","level":"TH","q":"Khi nhúng vật vào hai chất lỏng khác nhau, FA","options":["A. Luôn bằng nhau","B. Lớn hơn trong chất lỏng có d lớn hơn","C. Nhỏ hơn trong chất lỏng có d lớn hơn","D. Không phụ thuộc chất lỏng"],"answer":"B","explain":"FA tỉ lệ thuận với d của chất lỏng.","points":0.25},{"type":"mcq","level":"NB","q":"Vật nào sau đây sẽ nổi khi thả vào nước?","options":["A. Hòn sắt đặc","B. Cục gỗ","C. Viên bi thủy tinh đặc","D. Hòn đá"],"answer":"B","explain":"Gỗ có D nhỏ hơn nước nên nổi.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các tính toán (d nước = 10 000 N/m³).","statements":["a) V = 0,002 m³, chìm hẳn: FA = 20 N.","b) V = 0,0001 m³, chìm hẳn: FA = 1 N.","c) Vật nổi, V chìm = 0,005 m³: FA = 50 N.","d) FA = 100 N thì V chìm = 0,001 m³."],"answer":["T","T","T","F"],"explain":"V = 100 / 10 000 = 0,01 m³.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Mọi vật nhúng trong chất lỏng đều chịu FA.","b) FA hướng từ dưới lên.","c) FA = P - F.","d) FA chỉ xuất hiện khi vật chìm hẳn."],"answer":["T","T","T","F"],"explain":"Vật nổi (chìm một phần) vẫn chịu FA.","points":1},{"type":"short","level":"VDC","q":"Một vật có D = 1 200 kg/m³ thả vào thủy ngân (D = 13 600 kg/m³). Vật nổi hay chìm?","answer":"Nổi","explain":"D vật nhỏ hơn D thủy ngân nên nổi.","points":0.5},{"type":"short","level":"TH","q":"Người ta dùng áo phao để làm gì?","answer":"Giúp người nổi trên mặt nước","explain":"Áo phao làm bằng vật liệu nhẹ, tăng khả năng nổi.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Lực đẩy Archimedes phụ thuộc vào","options":["A. Độ sâu của vật","B. Trọng lượng riêng chất lỏng và thể tích phần chìm","C. Khối lượng của vật","D. Hình dạng của vật"],"answer":"B","explain":"FA = d × V.","points":0.25},{"type":"mcq","level":"TH","q":"Một vật có P = 6 N, FA cực đại khi chìm hẳn là 10 N. Thả vật vào nước thì vật sẽ","options":["A. Chìm xuống đáy","B. Nổi lên mặt nước","C. Lơ lửng","D. Chỉ chìm một nửa"],"answer":"B","explain":"P nhỏ hơn FA nên vật nổi lên.","points":0.25},{"type":"mcq","level":"VD","q":"Lực kế chỉ 15 N trong không khí, chỉ 9 N khi vật nhúng chìm trong nước. FA và V của vật là","options":["A. 6 N; 0,0006 m³","B. 24 N; 0,0024 m³","C. 6 N; 0,006 m³","D. 9 N; 0,0009 m³"],"answer":"A","explain":"FA = 6 N; V = 6 / 10 000 = 0,0006 m³.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bể cá có mực nước cao 0,5 m. Thả một hòn đá nhỏ (V = 0,0001 m³) vào bể. Áp suất nước ở đáy bể tăng thêm bao nhiêu? (bỏ qua sự thay đổi mực nước)","options":["A. 5 000 Pa","B. Không đáng kể (gần như không đổi)","C. 1 Pa","D. 10 000 Pa"],"answer":"B","explain":"Mực nước gần như không đổi nên p gần như không đổi.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà bác học Archimedes là người nước nào?","options":["A. Hy Lạp","B. Pháp","C. Đức","D. Anh"],"answer":"A","explain":"Archimedes là nhà bác học Hy Lạp cổ đại.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vật nổi, phần thể tích chìm càng lớn khi","options":["A. D vật càng nhỏ","B. D vật càng gần D chất lỏng","C. Vật càng nhẹ","D. Chất lỏng càng loãng"],"answer":"B","explain":"Tỉ lệ chìm = D_vật / D_lỏng.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Tàu thủy nổi nhờ lực đẩy Archimedes.","b) Tàu ngầm điều chỉnh lượng nước trong khoang để lặn, nổi.","c) Khinh khí cầu bay nhờ lực đẩy của không khí.","d) Phao cứu sinh làm bằng vật liệu có D lớn."],"answer":["T","T","T","F"],"explain":"Phao làm bằng vật liệu nhẹ (D nhỏ).","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) FA không đổi khi vật xuống sâu hơn (đã chìm hẳn).","b) FA lớn hơn trong chất lỏng có d lớn hơn.","c) Hai vật cùng V chìm chịu FA bằng nhau.","d) Vật càng nặng thì FA càng lớn."],"answer":["T","T","T","F"],"explain":"FA không phụ thuộc khối lượng vật.","points":1},{"type":"short","level":"TH","q":"Một vật chìm hẳn trong nước có FA = 25 N. Thể tích của vật là bao nhiêu m³?","answer":"0,0025","explain":"V = 25 / 10 000 = 0,0025 m³.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao khi tắm biển ta dễ nổi hơn khi tắm ở bể bơi nước ngọt? (Trả lời ngắn gọn)","answer":"Vì nước biển có trọng lượng riêng lớn hơn nên lực đẩy lớn hơn","explain":"d nước biển lớn hơn d nước ngọt.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Biết FA = 12 N, d = 10 000 N/m³. Thể tích phần chìm V là","options":["A. 0,0012 m³","B. 0,012 m³","C. 120 000 m³","D. 0,00012 m³"],"answer":"A","explain":"V = FA / d = 12 / 10 000 = 0,0012 m³.","points":0.25},{"type":"mcq","level":"NB","q":"Lực đẩy Archimedes có gốc từ","options":["A. Trọng lực của vật","B. Áp suất chất lỏng tác dụng lên các mặt của vật","C. Lực ma sát","D. Lực đàn hồi"],"answer":"B","explain":"Chênh lệch áp suất trên dưới tạo thành lực đẩy.","points":0.25},{"type":"mcq","level":"VDC","q":"Một quả cầu bằng nhôm (D = 2 700 kg/m³) có khối lượng 2,7 kg được khoét rỗng. Thả vào nước thấy quả cầu lơ lửng. Thể tích phần rỗng là","options":["A. 0,001 m³","B. 0,0017 m³","C. 0,0027 m³","D. 0,0007 m³"],"answer":"B","explain":"V nhôm = 0,001 m³; lơ lửng: V ngoài = m / D_nước = 0,0027 m³; V rỗng = 0,0017 m³.","points":0.25},{"type":"mcq","level":"VD","q":"Một vật có thể tích 0,005 m³, khối lượng 3 kg, thả vào nước. Vật nổi hay chìm?","options":["A. Chìm","B. Nổi","C. Lơ lửng","D. Chỉ chìm một nửa"],"answer":"B","explain":"D_vật = 600 kg/m³ nhỏ hơn D_nước nên nổi.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào ĐÚNG?","options":["A. FA chỉ tác dụng khi vật chìm hẳn","B. FA bằng trọng lượng phần chất lỏng bị chiếm chỗ","C. FA hướng xuống dưới","D. FA không phụ thuộc chất lỏng"],"answer":"B","explain":"FA bằng trọng lượng phần chất lỏng bị vật chiếm chỗ.","points":0.25},{"type":"mcq","level":"NB","q":"Khi vật nổi và đứng yên, lực đẩy Archimedes","options":["A. Lớn hơn trọng lượng","B. Nhỏ hơn trọng lượng","C. Bằng trọng lượng","D. Bằng không"],"answer":"C","explain":"Cân bằng: FA = P.","points":0.25},{"type":"truefalse","level":"VD","q":"Tổng hợp kiến thức. Đánh giá.","statements":["a) FA hướng từ dưới lên, FA = d × V.","b) FA = P - F qua thí nghiệm lực kế.","c) Chìm khi P lớn hơn FA; nổi khi P nhỏ hơn FA; lơ lửng khi P = FA.","d) Ứng dụng: tàu thủy, tàu ngầm, khinh khí cầu."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Vật nhúng trong chất lỏng chịu lực đẩy.","b) Lực đẩy gọi là lực đẩy Archimedes.","c) FA = d × V.","d) FA có đơn vị là Pa."],"answer":["T","T","T","F"],"explain":"Đơn vị FA là N.","points":1},{"type":"short","level":"VDC","q":"Một khúc gỗ (D = 800 kg/m³) có thể tích 0,02 m³ nổi trong nước. Thể tích phần chìm là bao nhiêu m³?","answer":"0,016","explain":"Tỉ lệ chìm = 0,8; V chìm = 0,8 × 0,02 = 0,016 m³.","points":0.5},{"type":"short","level":"TH","q":"Để đo FA bằng lực kế, ta lấy số chỉ trong không khí trừ đi số chỉ nào?","answer":"Số chỉ khi vật nhúng trong chất lỏng","explain":"FA = P - F.","points":0.5}]}]}
