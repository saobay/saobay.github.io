h làm thay đổi nội năng","options":["A. Không có sự chuyển hóa năng lượng","B. Có chuyển hóa cơ năng thành nội năng","C. Có chuyển hóa điện năng","D. Không thay đổi nội năng"],"answer":"A","explain":"Truyền nhiệt không chuyển hóa năng lượng.","points":0.25},{"type":"mcq","level":"TH","q":"Thực hiện công là cách làm thay đổi nội năng","options":["A. Có sự chuyển hóa năng lượng","B. Không chuyển hóa năng lượng","C. Không thay đổi nội năng","D. Chỉ truyền nhiệt"],"answer":"A","explain":"Công: cơ năng chuyển thành nội năng.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Truyền nhiệt: không chuyển hóa năng lượng.","b) Thực hiện công: có chuyển hóa năng lượng.","c) Cả hai cách đều làm thay đổi nội năng.","d) Truyền nhiệt làm nội năng không đổi."],"answer":["T","T","T","F"],"explain":"Truyền nhiệt làm thay đổi nội năng.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) Đun nước: nội năng nước tăng.","b) Cọ xát: nội năng tăng do thực hiện công.","c) Làm lạnh: nội năng giảm.","d) Vật cách nhiệt hoàn toàn: nội năng không đổi."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"short","level":"TH","q":"Nêu điểm khác nhau cơ bản giữa hai cách làm thay đổi nội năng.","answer":"Thực hiện công có chuyển hóa năng lượng, truyền nhiệt không","explain":"Điểm khác nhau cơ bản.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao cán xoong nồi thường làm bằng nhựa hoặc gỗ? (Trả lời ngắn gọn)","answer":"Vì nhựa, gỗ dẫn nhiệt kém, không bị nóng","explain":"Tránh bị bỏng khi cầm.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Trong các khái niệm sau, khái niệm nào là năng lượng?","options":["A. Nội năng","B. Nhiệt độ","C. Khối lượng","D. Thể tích"],"answer":"A","explain":"Nội năng là một dạng năng lượng.","points":0.25},{"type":"mcq","level":"NB","q":"Nhiệt độ cho biết","options":["A. Mức độ nóng lạnh của vật","B. Nội năng của vật","C. ệm khác nhau.","points":0.5},{"type":"short","level":"TH","q":"Nêu công thức tính nhiệt lượng vật thu vào khi nóng lên (đã học ở lớp dưới hoặc biết trước).","answer":"Q = m.c.Δt","explain":"Công thức tính nhiệt lượng.","points":0.5}]}]}
