ng, nhôm là chất dẫn điện.","b) Nhựa, cao su là chất cách điện.","c) Nước muối là chất dẫn điện.","d) Không khí là chất dẫn điện tốt."],"answer":["T","T","T","F"],"explain":"Không khí là chất cách điện.","points":1},{"type":"short","level":"TH","q":"Kể tên hai vật liệu cách điện thường dùng làm vỏ dây điện.","answer":"Nhựa và cao su","explain":"Vỏ dây điện thường làm bằng nhựa hoặc cao su.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao dây điện có lõi bằng đồng mà vỏ bằng nhựa? (Trả lời ngắn gọn)","answer":"Vì đồng dẫn điện tốt, nhựa cách điện an toàn","explain":"Lõi dẫn điện, vỏ bảo vệ người sử dụng.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"TH","q":"Chất cách điện là chất","options":["A. Cho dòng điện đi qua","B. Không cho dòng điện đi qua","C. Tạo ra dòng điện","D. Hút dòng điện"],"answer":"B","explain":"Chất cách điện không cho dòng điện đi qua.","points":0.25},{"type":"mcq","level":"NB","q":"Cực dương của nguồn điện kí hiệu là","options":["A. −","B. +","C. 0","D. N"],"answer":"B","explain":"Cực dương kí hiệu (+).","points":0.25},{"type":"mcq","level":"VDC","q":"Có hai vật liệu A và B: A cho dòng điện đi qua dễ dàng, B hầu như không cho dòng điện đi qua. Kết luận nào đúng?","options":["A. A là chất cách điện, B là chất dẫn điện","B. A là chất dẫn điện, B là chất cách điện","C. Cả hai đều dẫn điện","D. Cả hai đều cách điện"],"answer":"B","explain":"Theo định nghĩa chất dẫn điện và cách điện.","points":0.25},{"type":"mcq","level":"VD","q":"Trong các nguồn điện sau, nguồn nào KHÔNG phải nguồn điện hóa học?","options":["A. Pin con ó","B. Acquy xe máy","C. Pin mặt trời","D. Ổ cắm điện trong nhà"],"answer":"D","explain":"Ổ cắm lấy điện từ lưới điện (máy phát điện).","points":0.25},{"type":"mcq","level":"TH","q":"Khi chưa có dòng điện, các electron tự do trong kim loại","options":["A. Đứng yên","B. Chuyển động hỗn loạn mọi hướng","C. Chuyển dời có hướng","D. Bay ra ngoài"],"answer":"B","explain":"Chưa có dòng điện, electron chuyển động hỗn loạn.","points":0.25},{"type":"mcq","level":"NB","q":"Ví dụ nào là nguồn điện?","options":["A. Pin","B. Bóng đèn","C. Dây dẫn","D. Công tắc"],"answer":"A","explain":"Pin là nguồn điện.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) Dòng điện trong kim loại là dòng electron tự do.","b) Electron tự do chuyển dời có hướng khi có dòng điện.","c) Chất dẫn điện có nhiều hạt mang điện tự do.","d) Chất cách điện có nhiều electron tự do."],"answer":["T","T","T","F"],"explain":"Chất cách điện hầu như không có hạt mang điện tự do.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Pin có hai cực.","b) Cực dương thường có màu đỏ.","c) Acquy là nguồn điện.","d) Bóng đèn là nguồn điện."],"answer":["T","T","T","F"],"explain":"Bóng đèn là thiết bị dùng điện, không phải nguồn điện.","points":1},{"type":"short","level":"VDC","q":"Vì sao tay ướt không được chạm vào ổ cắm điện? (Trả lời ngắn gọn)","answer":"Vì nước dẫn điện gây điện giật nguy hiểm","explain":"Cơ thể ướt dễ bị điện giật.","points":0.5},{"type":"short","level":"TH","q":"Nêu hai ví dụ về nguồn điện.","answer":"Pin và acquy","explain":"Hoặc pin mặt trời, máy phát điện (chấp nhận đáp án tương đương).","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Hạt mang điện trong kim loại là","options":["A. Electron tự do","B. Proton","C. Nơtron","D. Hạt nhân"],"answer":"A","explain":"Electron tự do mang điện trong kim loại.","points":0.25},{"type":"mcq","level":"TH","q":"Vật liệu nào sau đây cách điện?","options":["A. Sắt","B. Đồng","C. Sứ","D. Nước muối"],"answer":"C","explain":"Sứ là chất cách điện.","points":0.25},{"type":"mcq","level":"VD","q":"Một bóng đèn sáng được khi","options":["A. Có dòng điện chạy qua","B. Để trong bóng tối","C. Không có nguồn điện","D. Dây tóc bị đứt"],"answer":"A","explain":"Dòng điện chạy qua làm dây tóc nóng sáng.","points":0.25},{"type":"mcq","level":"VDC","q":"Người ta dùng v truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Dòng điện cần nguồn điện.","b) Pin có cực (+) và (−).","c) Kim loại dẫn điện.","d) Nhựa dẫn điện."],"answer":["T","T","T","F"],"explain":"Nhựa cách điện.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các hiện tượng.","statements":["a) Bóng đèn sáng: có dòng điện chạy qua.","b) Quạt quay: có dòng điện chạy qua.","c) Dây điện nóng: có dòng điện chạy qua.","d) Tủ lạnh chạy: không cần dòng điện."],"answer":["T","T","T","F"],"explain":"Tủ lạnh cần dòng điện để hoạt động.","points":1},{"type":"short","level":"TH","q":"Nêu bản chất dòng điện trong kim loại.","answer":"Dòng electron tự do chuyển dời có hướng","explain":"Electron tự do dịch chuyển có hướng.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao phải ngắt nguồn điện khi sửa chữa thiết bị điện? (Trả lời ngắn gọn)","answer":"Để tránh bị điện giật","explain":"Không có dòng điện chạy qua khi sửa chữa.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Trong các chất sau, chất dẫn điện tốt nhất là","options":["A. Bạc","B. Đồng","C. Nhôm","D. Sắt"],"answer":"A","explain":"Bạc dẫn điện tốt nhất trong các kim loại thông dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị tạo ra dòng điện gọi là","options":["A. Nguồn điện","B. Bóng đèn","C. Công tắc","D. Dây dẫn"],"answer":"A","explain":"Nguồn điện tạo ra dòng điện.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh mắc pin vào hai đầu một thanh nhựa. Có dòng điện chạy qua không? Vì sao?","options":["A. Có, vì có nguồn điện","B. Không, vì nhựa cách điện","C. Có nhưng yếu","D. Không, vì thiếu công tắc"],"answer":"B","explain":"Nhựa cách điện nên không có dòng điện.","points":0.25},{"type":"mcq","level":"VD","q":"Để thắp sáng một bóng đèn pin, cần tối thiểu các bộ phận","options":["A. Pin, bóng đèn, dây dẫn nối thành mạch kín","B. Chỉ cần pin","C. Chỉ cần bóng đèn","D. Pin và công tắc"],"answer":"A","explain":"Cần nguồn, thiết bị dùng
