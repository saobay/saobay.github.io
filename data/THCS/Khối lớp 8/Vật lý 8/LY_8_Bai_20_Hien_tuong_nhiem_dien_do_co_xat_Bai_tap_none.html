{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Vật bị nhiễm điện do cọ xát có khả năng","options":["A. Đẩy mọi vật","B. Hút các vật nhẹ","C. Phát sáng","D. Nóng lên"],"answer":"B","explain":"Vật nhiễm điện hút được các vật nhẹ.","points":0.25},{"type":"mcq","level":"TH","q":"Có mấy loại điện tích?","options":["A. 1 loại","B. 2 loại: dương và âm","C. 3 loại","D. 4 loại"],"answer":"B","explain":"Có hai loại điện tích: dương (+) và âm (−).","points":0.25},{"type":"mcq","level":"VD","q":"Thanh nhựa sẫm màu cọ xát với vải khô rồi đưa lại gần thanh thủy tinh cọ xát với lụa. Hiện tượng xảy ra là","options":["A. Đẩy nhau","B. Hút nhau","C. Không tương tác","D. Vỡ ra"],"answer":"B","explain":"Nhựa nhiễm điện âm, thủy tinh nhiễm điện dương → khác dấu hút nhau.","points":0.25},{"type":"mcq","level":"VDC","q":"Cọ xát thanh thủy tinh với lụa, electron dịch chuyển từ thủy tinh sang lụa. Kết luận nào đúng?","options":["A. Thủy tinh nhiễm điện âm, lụa nhiễm điện dương","B. Thủy tinh nhiễm điện dương, lụa nhiễm điện âm","C. Cả hai đều nhiễm điện dương","D. Cả hai đều nhiễm điện âm"],"answer":"B","explain":"Thủy tinh mất electron → dương; lụa nhận electron → âm.","points":0.25},{"type":"mcq","level":"NB","q":"Điện tích dương kí hiệu là","options":["A. −","B. +","C. 0","D. ×"],"answer":"B","explain":"Điện tích dương kí hiệu (+).","points":0.25},{"type":"mcq","level":"TH","q":"Hai vật nhiễm điện cùng dấu thì","options":["A. Hút nhau","B. Đẩy nhau","C. Không tương tác","D. Trung hòa nhau"],"answer":"B","explain":"Cùng dấu đẩy nhau.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Vật nhiễm điện do cọ xát hút được vật nhẹ.","b) Có hai loại điện tích: dương và âm.","c) Cùng dấu đẩy nhau, khác dấu hút nhau.","d) Chỉ có một loại điện tích."],"answer":["T","T","T","F"],"explain":"Có hai loại điện tích.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về electron.","statements":["a) Electron mang điện tích âm.","b) Hạt nhân mang điện tích dương.","c) Vật nhận thêm electron thì nhiễm điện âm.","d) Vật mất electron thì nhiễm điện âm."],"answer":["T","T","T","F"],"explain":"Vật mất electron thì nhiễm điện dương.","points":1},{"type":"short","level":"TH","q":"Thanh thủy tinh cọ xát với lụa thì nhiễm điện gì?","answer":"Điện dương","explain":"Thủy tinh mất electron nên nhiễm điện dương.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao xe bồn chở xăng phải có dây xích sắt thả xuống đất? (Trả lời ngắn gọn)","answer":"Để truyền điện tích do cọ xát xuống đất, tránh tia lửa gây cháy","explain":"Nối đất triệt tiêu điện tích tích tụ.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"TH","q":"Hai vật nhiễm điện khác dấu thì","options":["A. Đẩy nhau","B. Hút nhau","C. Không tương tác","D. Nổ tung"],"answer":"B","explain":"Khác dấu hút nhau.","points":0.25},{"type":"mcq","level":"NB","q":"Điện tích âm kí hiệu là","options":["A. +","B. −","C. 0","D. ±"],"answer":"B","explain":"Điện tích âm kí hiệu (−).","points":0.25},{"type":"mcq","level":"VDC","q":"Ba quả cầu A, B, C: A hút B, B đẩy C. Biết A nhiễm điện dương. Kết luận nào đúng?","options":["A. B dương, C dương","B. B âm, C âm","C. B âm, C dương","D. B dương, C âm"],"answer":"B","explain":"A(+) hút B → B âm; B(−) đẩy C → C âm.","points":0.25},{"type":"mcq","level":"VD","q":"Lược nhựa chải tóc rồi đưa gần mẩu giấy vụn. Hiện tượng và giải thích đúng là","options":["A. Đẩy giấy vì cùng nhiễm điện","B. Hút giấy vì lược nhiễm điện do cọ xát","C. Không có hiện tượng gì","D. Giấy cháy"],"answer":"B","explain":"Lược nhiễm điện nên hút vật nhẹ.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên tử trung hòa về điện vì","options":["A. Không có điện tích","B. Tổng điện tích dương bằng tổng điện tích âm","C. Chỉ có electron","D. Chỉ có hạt nhân"],"answer":"B","explain":"Điện tích dương của hạt nhân cân bằng điện tích âm của electron.","points":0.25},{"type":"mcq","level":"NB","q":"Hạt mang điện tích âm tro  dương"],"answer":"B","explain":"Vật nhiễm điện hút được cả vật trung hòa nhẹ (hiện tượng hưởng ứng).","points":0.25},{"type":"mcq","level":"VDC","q":"Hai quả cầu kim loại giống nhau: A nhiễm điện dương, B trung hòa. Cho chúng chạm nhau rồi tách ra. Kết luận nào đúng?","options":["A. Cả hai đều trung hòa","B. Cả hai đều nhiễm điện dương","C. A dương, B âm","D. Cả hai đều nhiễm điện âm"],"answer":"B","explain":"Electron từ B sang A, cả hai cùng nhiễm điện dương (chia đều).","points":0.25},{"type":"mcq","level":"NB","q":"Tóc dựng đứng khi chải bằng lược nhựa vì","options":["A. Tóc bị nhiễm điện cùng dấu đẩy nhau","B. Tóc bị ướt","C. Tóc bị đứt","D. Lược hút tóc"],"answer":"A","explain":"Các sợi tóc nhiễm điện cùng dấu đẩy nhau nên dựng đứng.","points":0.25},{"type":"mcq","level":"TH","q":"Sơn tĩnh điện ứng dụng hiện tượng","options":["A. Nhiễm điện do cọ xát (hút nhau khác dấu)","B. Nóng chảy","C. Bay hơi","D. Đông đặc"],"answer":"A","explain":"Hạt sơn nhiễm điện bị hút về vật cần sơn.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Có hai loại điện tích.","b) Cùng dấu đẩy nhau.","c) Khác dấu hút nhau.","d) Điện tích dương hút điện tích dương."],"answer":["T","T","T","F"],"explain":"Cùng dấu đẩy nhau.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về cọ xát.","statements":["a) Cọ xát làm electron dịch chuyển.","b) Vật nhận electron nhiễm điện âm.","c) Vật mất electron nhiễm điện dương.","d) Cọ xát tạo ra điện tích mới."],"answer":["T","T","T","F"],"explain":"Cọ xát chỉ làm dịch chuyển electron, không tạo ra điện tích mới.","points":1},{"type":"short","level":"TH","q":"Vật nhận thêm electron thì nhiễm điện gì?","answer":"Điện âm","explain":"Thừa electron → nhiễm điện âm.","points":0.5},{"type":"short","level":"VDC","q":"Kể một ứng dụng của hiện tượng nhiễm điện trong đời sống.","answer":"Sơn tĩnh điện","explain":"Hoặc máy photocopy, lọc bụi tĩnh điện (chấp nhận đáp án tương đương).","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Để kiểm tra một vật có nhiễm điện hay không, ta có thể","options":["A. Đưa lại gần mẩu giấy vụn xem có hút không","B. Ngửi","C. Nếm","D. Đốt"],"answer":"A","explain":"Vật nhiễm điện hút được vật nhẹ.","points":0.25},{"type":"mcq","level":"NB","q":"Thanh thủy tinh cọ xát với lụa nhiễm điện","options":["A. Âm","B. Dương","C. Không nhiễm điện","D. Vừa âm vừa dương"],"answer":"B","explain":"Thủy tinh mất electron → nhiễm điện dương.","points":0.25},{"type":"mcq","level":"VDC","q":"Bốn vật A, B, C, D: A đẩy B, B hút C, C đẩy D. Biết D nhiễm điện âm. Hỏi A nhiễm điện gì?","options":["A. Dương","B. Âm","C. Trung hòa","D. Không xác định"],"answer":"A","explain":"C đẩy D(-) → C âm; B hút C(-) mà B nhiễm điện → B dương; A đẩy B(+) → A dương.","points":0.25},{"type":"mcq","level":"VD","q":"Khi thời tiết hanh khô, chạm tay vào tay nắm cửa kim loại đôi khi bị giật nhẹ. Nguyên nhân là","options":["A. Cửa có điện","B. Cơ thể nhiễm điện do cọ xát với quần áo rồi phóng điện","C. Tay ướt","D. Cửa bị hỏng"],"answer":"B","explain":"Phóng điện do tĩnh điện tích tụ trên cơ thể.","points":0.25},{"type":"mcq","level":"TH","q":"Máy photocopy hoạt động dựa trên","options":["A. Hiện tượng nhiễm điện hút mực","B. Nhiệt độ cao","C. Áp suất","D. Lực đẩy Archimedes"],"answer":"A","explain":"Trống nhiễm điện hút hạt mực.","points":0.25},{"type":"mcq","level":"NB","q":"Hạt nhân nguyên tử mang điện tích","options":["A. Âm","B. Dương","C. Trung hòa","D. Không có điện tích"],"answer":"B","explain":"Hạt nhân mang điện tích dương.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các biện pháp chống tĩnh điện.","statements":["a) Nối đất để triệt tiêu điện tích.","b) Xe bồn chở xăng có dây xích thả xuống đất.","c) Tăng độ ẩm không khí giảm tích điện.","d) Cọ xát mạnh ở cây xăng là an toàn."],"answer":["T","T","T","F"],"explain":"Cọ xát mạnh ở cây xăng dễ gây tia lửa, cháy nổ.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Lược nhựa cọ xát hút mẩu giấy.","b) Áo len cọ xát có thể gây tiếng tách tách.","c) Mọi vật cọ xát đều nhiễm điện mạnh như nhau.","d) Có hai loại điện tích."],"answer":["T","T","F","T"],"explain":"Mức độ nhiễm điện phụ thuộc chất liệu.","points":1},{"type":"short","level":"VDC","q":"Vì sao không nên cọ xát mạnh quần áo gần cây xăng? (Trả lời ngắn gọn)","answer":"Vì tia lửa điện có thể gây cháy nổ","explain":"Tĩnh điện phóng ra tia lửa.","points":0.5},{"type":"short","level":"TH","q":"Hai vật nhiễm điện cùng dấu đặt gần nhau thì thế nào?","answer":"Đẩy nhau","explain":"Cùng dấu đẩy nhau.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Vật nào sau đây dễ bị nhiễm điện do cọ xát?","options":["A. Thanh nhựa","B. Thanh sắt","C. Cục nước đá","D. Tờ giấy ướt"],"answer":"A","explain":"Nhựa là chất cách điện, dễ giữ điện tích do cọ xát.","points":0.25},{"type":"mcq","level":"TH","q":"Một thước nhựa sau khi cọ xát hút được mẩu giấy. Thước nhựa đã","options":["A. Nhiễm điện","B. Nóng lên","C. Nhiễm từ","D. Bị ướt"],"answer":"A","explain":"Hút vật nhẹ chứng tỏ nhiễm điện.","points":0.25},{"type":"mcq","level":"VD","q":"Treo hai quả cầu nhẹ bằng sợi chỉ: một quả đã nhiễm điện, một quả trung hòa. Đưa chúng lại gần nhau thì","options":["A. Đẩy nhau","B. Hút nhau","C. Không tương tác","D. Cả hai cùng nhiễm điện"],"answer":"B","explain":"Vật nhiễm điện hút vật trung hòa nhẹ.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho thanh kim loại trung hòa chạm vào quả cầu nhiễm điện dương rồi tách ra. Thanh kim loại sẽ","options":["A. Nhiễm điện dương","B. Nhiễm điện âm","C. Vẫn trung hòa","D. Nóng lên"],"answer":"A","explain":"Electron từ thanh sang quả cầu, thanh thiếu electron → dương.","points":0.25},{"type":"mcq","level":"NB","q":"Điện tích của electron là","options":["A. Dương","B. Âm","C. Trung hòa","D. Không xác định"],"answer":"B","explain":"Electron mang điện tích âm.","points":0.25},{"type":"mcq","level":"TH","q":"Khi hai vật nhiễm điện trái dấu tiếp xúc nhau, chúng có xu hướng","options":["A. Đẩy nhau mạnh hơn","B. Trung hòa điện","C. Nổ tung","D. Nhiễm điện mạnh hơn"],"answer":"B","explain":"Điện tích dương và âm trung hòa nhau.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Nhiễm điện do cọ xát do electron dịch chuyển.","b) Nhận electron → nhiễm điện âm.","c) Mất electron → nhiễm điện dương.","d) Hạt nhân dịch chuyển khi cọ xát."],"answer":["T","T","T","F"],"explain":"Hạt nhân không dịch chuyển.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các hiện tượng.","statements":["a) Tóc dựng khi chải: các sợi tóc cùng dấu đẩy nhau.","b) Lược hút giấy: lược nhiễm điện.","c) Tia lửa ở cây xăng: do phóng tĩnh điện.","d) Sơn tĩnh điện: hạt sơn và vật sơn cùng dấu."],"answer":["T","T","T","F"],"explain":"Hạt sơn và vật sơn khác dấu mới hút nhau.","points":1},{"type":"short","level":"TH","q":"Kể tên hai loại điện tích.","answer":"Điện tích dương và điện tích âm","explain":"Hai loại: dương (+) và âm (−).","points":0.5},{"type":"short","level":"VDC","q":"Vật A hút vật B, vật B hút vật C. Có kết luận được dấu điện tích không? Vì sao? (Trả lời ngắn gọn)","answer":"Không vì có thể do hút vật trung hòa","explain":"Vật nhiễm điện hút cả vật trung hòa nhẹ.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Phát biểu nào ĐÚNG?","options":["A. Mọi vật sau khi cọ xát đều hút được nam châm","B. Vật nhiễm điện hút được các vật nhẹ","C. Chỉ kim loại mới nhiễm điện do cọ xát","D. Cọ xát làm vật nóng chảy"],"answer":"B","explain":"Đặc điểm của vật nhiễm điện là hút vật nhẹ.","points":0.25},{"type":"mcq","level":"NB","q":"Cọ xát thước nhựa với vải khô, thước nhựa nhiễm điện","options":["A. Dương","B. Âm","C. Không nhiễm điện","D. Vừa dương vừa âm"],"answer":"B","explain":"Nhựa nhận electron từ vải → nhiễm điện âm.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai quả cầu nhỏ treo gần nhau: quả A nhiễm điện dương. Đưa quả B (chưa biết) lại gần thấy hút nhau. Có thể kết luận gì về B?","options":["A. B chắc chắn nhiễm điện âm","B. B nhiễm điện âm hoặc trung hòa","C. B chắc chắn trung hòa","D. B nhiễm điện dương"],"answer":"B","explain":"Hút nhau có thể do khác dấu hoặc do B trung hòa.","points":0.25},{"type":"mcq","level":"VD","q":"Dùng mảnh vải khô cọ xát ống nhựa rồi đưa gần dòng nước nhỏ chảy từ vòi. Hiện tượng xảy ra là","options":["A. Dòng nước bị hút lệch về phía ống nhựa","B. Dòng nước chảy mạnh hơn","C. Không có hiện tượng gì","D. Nước ngừng chảy"],"answer":"A","explain":"Ống nhựa nhiễm điện hút các phân tử nước.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các vật sau, vật nào là nguồn phát ra tia lửa điện nguy hiểm ở cây xăng?","options":["A. Quần áo cọ xát tích điện","B. Nước","C. Gió","D. Ánh sáng"],"answer":"A","explain":"Tĩnh điện tích tụ phóng ra tia lửa.","points":0.25},{"type":"mcq","level":"NB","q":"Khi cọ xát hai vật với nhau, vật nào nhận electron sẽ","options":["A. Nhiễm điện dương","B. Nhiễm điện âm","C. Trung hòa","D. Nóng chảy"],"answer":"B","explain":"Nhận thêm electron → nhiễm điện âm.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) Vật nhiễm điện có thể hút vật trung hòa nhẹ.","b) Hút nhau chứng tỏ hai vật khác dấu.","c) Đẩy nhau chứng tỏ hai vật cùng dấu.","d) Không hút nhau chứng tỏ cả hai trung hòa."],"answer":["T","F","T","F"],"explain":"Hút nhau có thể do một vật trung hòa; không tương tác có thể do khoảng cách xa.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Electron mang điện tích âm.","b) Hạt nhân mang điện tích dương.","c) Nguyên tử bình thường trung hòa về điện.","d) Cọ xát tạo ra thêm điện tích."],"answer":["T","T","T","F"],"explain":"Cọ xát chỉ dịch chuyển electron.","points":1},{"type":"short","level":"VDC","q":"Nêu cách làm mất điện tích của vật nhiễm điện. (Trả lời ngắn gọn)","answer":"Cho tiếp xúc với đất (nối đất)","exp Trời hanh khô dễ tích tĩnh điện.","b) Trời nồm ẩm khó tích tĩnh điện.","c) Nối đất giúp triệt tiêu điện tích.","d) Tĩnh điện không bao giờ gây nguy hiểm."],"answer":["T","T","T","F"],"explain":"Tĩnh điện có thể gây cháy nổ.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các ứng dụng.","statements":["a) Sơn tĩnh điện: hạt sơn bám đều.","b) Máy in laser dùng tĩnh điện hút mực.","c) Lọc bụi tĩnh điện trong nhà máy.","d) Tĩnh điện dùng để đun nấu."],"answer":["T","T","T","F"],"explain":"Tĩnh điện không dùng để đun nấu.","points":1},{"type":"short","level":"TH","q":"Nêu hiện tượng chứng tỏ vật đã nhiễm điện.","answer":"Hút được các vật nhẹ","explain":"Hoặc làm lá điện nghiệm xòe ra.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao các nhà máy dùng lọc bụi tĩnh điện? (Trả lời ngắn gọn)","answer":"Vì hạt bụi nhiễm điện bị hút về tấm điện cực","explain":"Ứng dụng hút nhau khác dấu.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"TH","q":"Trong các vật sau, vật nào sau khi cọ xát nhiễm điện âm?","options":["A. Thanh thủy tinh cọ xát với lụa","B. Thanh nhựa sẫm màu cọ xát với vải khô","C. Thanh sắt cọ xát với vải","D. Cục nước đá"],"answer":"B","explain":"Nhựa nhận electron → nhiễm điện âm.","points":0.25},{"type":"mcq","level":"NB","q":"Khi hai vật khác dấu điện tích chạm nhau, chúng sẽ","options":["A. Nổ","B. Trung hòa một phần hoặc hoàn toàn","C. Đẩy nhau","D. Nóng chảy"],"answer":"B","explain":"Điện tích trái dấu trung hòa nhau.","points":0.25},{"type":"mcq","level":"VDC","q":"Quả cầu A nhiễm điện dương (+4 đơn vị), quả cầu B trung hòa, hai quả giống nhau. Cho chạm nhau rồi tách ra, điện tích mỗi quả là","options":["A. +4 và 0","B. +2 và +2","C. +4 và +4","D. 0 và 0"],"answer":"B","explain":"Điện tích chia đều cho hai quả giống nhau.","points":0.25},{"type":"mcq","level":"VD","q":"Đưa đũa thủy tinh đã cọ xát lại gần quả cầu kim loại trung hòa treo bằng chỉ. Quả cầu","options":["A. Bị đẩy ra","B. Bị hút lại gần","C. Đứng yên","D. Quay tròn"],"answer":"B","explain":"Vật nhiễm điện hút vật trung hòa.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào SAI?","options":["A. Có hai loại điện tích","B. Cùng dấu đẩy nhau","C. Khác dấu hút nhau","D. Vật nhiễm điện đẩy được mọi vật"],"answer":"D","explain":"Vật nhiễm điện hút vật nhẹ, không đẩy mọi vật.","points":0.25},{"type":"mcq","level":"NB","q":"Electron là hạt","options":["A. Mang điện tích dương","B. Mang điện tích âm","C. Không mang điện","D. Nặng nhất nguyên tử"],"answer":"B","explain":"Electron mang điện tích âm.","points":0.25},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định.","statements":["a) Cọ xát: electron dịch chuyển từ vật này sang vật khác.","b) Vật mất electron nhiễm điện dương.","c) Điện tích được bảo toàn khi cọ xát.","d) Cọ xát sinh ra electron mới."],"answer":["T","T","T","F"],"explain":"Electron chỉ dịch chuyển, không sinh ra mới.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Vật nhiễm điện hút vật nhẹ.","b) Có điện tích dương và điện tích âm.","c) Cùng dấu đẩy nhau.","d) Khác dấu đẩy nhau."],"answer":["T","T","T","F"],"explain":"Khác dấu hút nhau.","points":1},{"type":"short","level":"VDC","q":"Một vật nhiễm điện âm chạm vào vật trung hòa. Vật trung hòa sẽ nhiễm điện gì?","answer":"Điện âm","explain":"Electron từ vật nhiễm điện âm truyền sang.","points":0.5},{"type":"short","level":"TH","q":"Nêu quy luật tương tác giữa hai vật nhiễm điện.","answer":"Cùng dấu đẩy nhau, khác dấu hút nhau","explain":"Quy luật tương tác điện tích.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Vật bị nhiễm điện là vật","options":["A. Có khả năng hút các vật nhẹ","B. Nóng lên","C. Phát sáng","D. Có màu sắc đẹp"],"answer":"A","explain":"Dấu hiệu vật nhiễm điện là hút vật nhẹ.","points":0.25},{"type":"mcq","level":"TH","q":"Một vật đang trung hòa, sau khi cọ xát nhiễm điện dương. Vật đã","options":["A. Nhận thêm electron","B. Mất bớt electron","C. Nhận thêm proton","D. Mất bớt proton"],"answer":"B","explain":"Mất electron → thiếu điện tích âm → dương.","points":0.25},{"type":"mcq","level":"VD","q":"Ba quả cầu kim loại nhỏ A, B, C treo bằng chỉ tơ. A hút B, B hút C. Hỏi có mấy trường hợp về điện tích?","options":["A. 1","B. 2","C. 3","D. 4"],"answer":"B","explain":"Có thể: A(+) B(−) C(+) hoặc A(−) B(+) C(−), hoặc có quả trung hòa bị hút.","points":0.25},{"type":"mcq","level":"VDC","q":"Tích điện cho quả cầu kim loại bằng cách cho chạm vào vật nhiễm điện. Cách nhiễm điện này gọi là","options":["A. Nhiễm điện do tiếp xúc","B. Nhiễm điện do cọ xát","C. Nhiễm điện do hưởng ứng","D. Nhiễm điện do nung nóng"],"answer":"A","explain":"Nhiễm điện do tiếp xúc trực tiếp.","points":0.25},{"type":"mcq","level":"NB","q":"Proton mang điện tích","options":["A. Âm","B. Dương","C. Trung hòa","D. Không xác định"],"answer":"B","explain":"Proton (trong hạt nhân) mang điện tích dương.","points":0.25},{"type":"mcq","level":"TH","q":"Nơtron mang điện tích","options":["A. Âm","B. Dương","C. Không mang điện","D. Vừa âm vừa dương"],"answer":"C","explain":"Nơtron trung hòa về điện.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Nguyên tử gồm hạt nhân và electron.","b) Hạt nhân mang điện dương.","c) Electron mang điện tích âm.","d) Mọi nguyên tử đều nhiễm điện."],"answer":["T","T","T","F"],"explain":"Nguyên tử bình thường trung hòa về điện.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các hiện tượng trong đời sống.","statements":["a) Sét là hiện tượng phóng điện trong khí quyển.","b) Sét do sự tích điện của đám mây.","c) Cột thu lôi giúp dẫn sét xuống đất an toàn.","d) Sét không nguy hiểm."],"answer":["T","T","T","F"],"explain":"Sét rất nguy hiểm.","points":1},{"type":"short","level":"TH","q":"Vật nhiễm điện do cọ xát có đặc điểm gì?","answer":"Hút được các vật nhẹ","explain":"Dấu hiệu nhận biết vật nhiễm điện.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao phải làm cột thu lôi cho nhà cao tầng? (Trả lời ngắn gọn)","answer":"Để dẫn dòng điện của sét xuống đất an toàn","explain":"Tránh sét đánh gây cháy, hư hại.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Biết thanh thủy tinh cọ xát với lụa nhiễm điện dương. Vậy mảnh lụa nhiễm điện","options":["A. Dương","B. Âm","C. Trung hòa","D. Không xác định"],"answer":"B","explain":"Electron từ thủy tinh sang lụa → lụa nhiễm điện âm.","points":0.25},{"type":"mcq","level":"NB","q":"Hiện tượng nhiễm điện do cọ xát được ứng dụng trong","options":["A. Sơn tĩnh điện","B. Nồi cơm điện","C. Quạt điện","D. Bóng đèn"],"answer":"A","explain":"Sơn tĩnh điện ứng dụng hút nhau khác dấu.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai quả cầu kim loại A (+6 đơn vị), B (−2 đơn vị) giống nhau chạm nhau rồi tách ra. Điện tích mỗi quả là","options":["A. +6 và −2","B. +2 và +2","C. +4 và +4","D. 0 và 0"],"answer":"B","explain":"Tổng (+4) chia đều: mỗi quả +2.","points":0.25},{"type":"mcq","level":"VD","q":"Đưa lược nhựa đã chải tóc lại gần quả cầu kim loại nhỏ trung hòa treo bằng chỉ tơ. Hiện tượng là","options":["A. Quả cầu bị hút","B. Quả cầu bị đẩy","C. Quả cầu đứng yên","D. Quả cầu nhiễm điện dương"],"answer":"A","explain":"Lược nhiễm điện hút vật trung hòa nhẹ.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào ĐÚNG?","options":["A. Chỉ có điện tích dương","B. Electron dịch chuyển khi cọ xát","C. Hạt nhân dịch chuyển khi cọ xát","D. Cọ xát tạo ra điện tích mới"],"answer":"B","explain":"Chỉ electron dịch chuyển.","points":0.25},{"type":"mcq","level":"NB","q":"Vật trung hòa về điện là vật","options":["A. Không có điện tích","B. Có tổng điện tích dương bằng tổng điện tích âm","C. Nhiễm điện dương","D. Nhiễm điện âm"],"answer":"B","explain":"Trung hòa khi điện tích dương và âm cân bằng.","points":0.25},{"type":"truefalse","level":"VD","q":"Tổng hợp kiến thức. Đánh giá.","statements":["a) Vật nhiễm điện do cọ xát hút vật nhẹ.","b) Hai loại điện tích: dương và âm.","c) Cùng dấu đẩy, khác dấu hút.","d) Nhiễm điện do electron dịch chuyển."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Cọ xát làm vật nhiễm điện.","b) Vật nhiễm điện hút vật nhẹ.","c) Có hai loại điện tích.","d) Điện tích dương đẩy điện tích âm."],"answer":["T","T","T","F"],"explain":"Điện tích dương hút điện tích âm.","points":1},{"type":"short","level":"VDC","q":"Nêu một nguy hiểm của hiện tượng nhiễm điện do cọ xát.","answer":"Gây tia lửa điện dẫn đến cháy nổ","explain":"Ví dụ ở cây xăng, xe bồn chở xăng.","points":0.5},{"type":"short","level":"TH","q":"Muốn vật hết nhiễm điện ta làm thế nào?","answer":"Nối đất","explain":"Cho vật tiếp xúc với đất.","points":0.5}]}]}
