":"mcq","level":"NB","q":"Hiện tượng nào sau đây là sự nở vì nhiệt?","options":["A. Thanh sắt dài ra khi nung nóng","B. Nước đá tan","C. Nến cháy","D. Sắt gỉ"],"answer":"A","explain":"Thanh sắt dài ra khi nóng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh nói: Cột điện bê tông không cần tính đến sự nở vì nhiệt. Đúng hay sai?","options":["A. Sai, bê tông và cốt thép cũng nở vì nhiệt","B. Đúng","C. Chỉ thép nở","D. Không xác định"],"answer":"A","explain":"Mọi chất rắn đều nở vì nhiệt.","points":0.25},{"type":"mcq","level":"VD","q":"Khi nhiệt độ tăng 10 độ C, một thanh nhôm và một thanh sắt cùng chiều dài ban đầu. Thanh nào dài hơn?","options":["A. Thanh nhôm","B. Thanh sắt","C. Bằng nhau","D. Không xác định"],"answer":"A","explain":"Nhôm nở nhiều hơn sắt.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào ĐÚNG?","options":["A. Rắn, lỏng, khí đều nở khi nóng, co khi lạnh","B. Chỉ rắn nở vì nhiệt","C. Khí không nở vì nhiệt","D. Lỏng chỉ co lại"],"answer":"A","explain":"Cả ba thể đều nở vì nhiệt.","points":0.25},{"type":"mcq","level":"NB","q":"Mức độ nở vì nhiệt của các chất","options":["A. Khác nhau","B. Giống nhau","C. Bằng không","D. Không xác định"],"answer":"A","explain":"Mỗi chất nở khác nhau.","points":0.25},{"type":"truefalse","level":"VD","q":"Tổng hợp. Đánh giá các nhận định.","statements":["a) Rắn, lỏng, khí: nóng nở, lạnh co.","b) Khí nở nhiều nhất, rắn ít nhất.","c) Băng kép: hai kim loại nở khác nhau.","d) Mọi chất nở vì nhiệt như nhau."],"answer":["T","T","T","F"],"explain":"Mỗi chất nở khác nhau.","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định.","statements":["a) Sự nở vì nhiệt có nhiều ứng dụng.","b) Cần lưu ý an toàn với sự nở vì nhiệt.","c) Nhiệt kế dùng sự nở của chất lỏng.","d) Sự nở vì nhiệt không có ứng dụng."],"answer":["T","T","T","F"],"explain":"Nhiều ứng dụng: nhiệt kế, băng kép, khe ray.","points":1},{"type":"short","level":"VDC","q":"Nêu hai ứng dụng và một lưu ý an toàn của sự nở vì nhiệt.","answer":"Ứng dụng: nhiệt kế, băng kép; lưu ý: không để bình ga gần lửa","explain":"Chấp nhận đáp án tương đương.","points":0.5},{"type":"short","level":"TH","q":"Tóm tắt sự nở vì nhiệt của ba thể chất.","answer":"Nóng nở, lạnh co; khí nhiều nhất, rắn ít nhất","explain":"Tóm tắt.","points":0.5}]}]}
