mcq", "level": "NB", "q": "Tứ giác $ABCD$ có $\\widehat{A}=\\widehat{B}=\\widehat{C}=\\widehat{D}=90^\\circ$ là", "options": ["A. hình chữ nhật", "B. hình thoi", "C. hình thang cân", "D. hình bình hành"], "answer": "A", "explain": "Tứ giác có bốn góc vuông là hình chữ nhật."}, {"type": "mcq", "level": "NB", "q": "Trong hình chữ nhật, các cạnh đối", "options": ["A. song song và bằng nhau", "B. vuông góc với nhau", "C. cắt nhau", "D. trùng nhau"], "answer": "A", "explain": "Hình chữ nhật là hình bình hành nên các cạnh đối song song và bằng nhau."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. Hai đường chéo của hình chữ nhật bằng nhau.", "B. Hai đường chéo của hình chữ nhật vuông góc.", "C. Hình chữ nhật có bốn cạnh bằng nhau.", "D. Hình chữ nhật không phải là hình bình hành."], "answer": "A", "explain": "Chỉ có A đúng."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật $IJKL$ có $IJ=24$ cm, $JK=10$ cm. Độ dài đường chéo $IK$ là", "options": ["A. $26$ cm", "B. $34$ cm", "C. $14$ cm", "D. $20$ cm"], "answer": "A", "explain": "$IK=\\sqrt{24^2+10^2}=\\sqrt{676}=26$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật $ABCD$ có diện tích $96$ cm$^2$, $AB=12$ cm. Độ dài cạnh $AD$ là", "options": ["A. $8$ cm", "B. $6$ cm", "C. $10$ cm", "D. $16$ cm"], "answer": "A", "explain": "$AD=96:12=8$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình chữ nhật $ABCD$ có $AB=9$ cm, $BD=15$ cm. Chu vi của hình chữ nhật là", "options": ["A. $42$ cm", "B. $24$ cm", "C. $48$ cm", "D. $36$ cm"], "answer": "A", "explain": "$AD=\\sqrt{15^2-9^2}=12$ (cm); chu vi $=2\\cdot(9+12)=42$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Cho hình chữ nhật $MNPQ$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $\\widehat{M}=\\widehat{N}=\\widehat{P}=\\widehat{Q}=90^\\circ$.", "b) $MN \\parallel PQ$.", "c) $MP=NQ$.", "d) $MP \\perp NQ$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình bình hành $ABCD$ có $AC=BD=18$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $ABCD$ là hình chữ nhật.", "b) $\\widehat{A}=90^\\circ$.", "c) Diện tích $ABCD$ bằng $AB\\cdot BC$.", "d) $AB=BC$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai (chưa đủ dữ kiện)."}, {"type": "short", "level": "VD", "q": "Cho hình chữ nhật $ABCD$ có $AB=21$ cm, $BC=20$ cm. Tính độ dài đường chéo $AC$ (cm).", "answer": "29", "explain": "$AC=\\sqrt{21^2+20^2}=\\sqrt{841}=29$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho hình chữ nhật $ABCD$ có $AB=16$ cm, $BC=12$ cm; $O$ là giao điểm của hai đường chéo. Tính $OA$ (cm).", "answer": "10", "explain": "$AC=\\sqrt{16^2+12^2}=20$ (cm); $OA=AC:2=10$ (cm)."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Hình chữ nhật có", "options": ["A. bốn góc vuông", "B. bốn cạnh bằng nhau", "C. hai đường chéo vuông góc", "D. hai cạnh đối vuông góc"], "answer": "A", "explain": "Hình chữ nhật là tứ giác có bốn góc vuông."}, {"type": "mcq", "level": "NB", "q": "Hình thang cân có một góc vuông là", "options": ["A. hình chữ nhật", "B. hình vuông", "C. hình thoi", "D. hình bình hành"], "answer": "A", "explain": "Dấu hiệu nhận biết: hình thang cân có một góc vuông là hình chữ nhật."}, {"type": "mcq", "level": "NB", "q": "Trong hình chữ nhật, hai đường chéo", "options": ["A. bằng nhau và cắt nhau tại trung điểm của mỗi đường", "B. vuông góc với nhau", "C. là các đường phân giác của các góc", "D. song song với nhau"], "answer": "A", "explain": "Đó là tính chất đường chéo của hình chữ nhật."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật $ABCD$ có $AB=30$ cm, $BC=16$ cm. Độ dài đường chéo $AC$ là", "options": ["A. $34$ cm", "B. $46$ cm", "C. $14$ cm", "D. $40$ cm"], "answer": "A", "explain": "$AC=\\sqrt{30^2+16^2}=\\sqrt{1156}=34$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật có đường chéo $29$ cm và một cạnh $21$ cm. Độ dài cạnh còn lại là", "options": ["A. $20$ cm", "B. $8$ cm", "C. $10$ cm", "D. $50$ cm"], "answer": "A", "explain": "Cạnh còn lại $=\\sqrt{29^2-21^2}=\\sqrt{400}=20$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình chữ nhật $ABCD$ có chu vi $46$ cm, $AB=15$ cm. Độ dài đường chéo $AC$ là", "options": ["A. $17$ cm", "B. $23$ cm", "C. $20$ cm", "D. $15$ cm"], "answer": "A", "explain": "$BC=(46-30):2=8$ (cm); $AC=\\sqrt{15^2+8^2}=17$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình chữ nhật là tứ giác có bốn góc vuông.", "b) Mọi hình chữ nhật đều là hình bình hành.", "c) Mọi hình bình hành đều là hình chữ nhật.", "d) Hình chữ nhật có hai đường chéo bằng nhau."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình chữ nhật $EFGH$ có $EF=8$ cm, $FG=15$ cm, $O$ là giao điểm của hai đường chéo. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $EG=17$ cm.", "b) $OE=8,5$ cm.", "c) Diện tích hình chữ nhật bằng $120$ cm$^2$.", "d) Chu vi hình chữ nhật bằng $40$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì chu vi $=46$ (cm)."}, {"type": "short", "level": "VD", "q": "Cho hình chữ nhật $ABCD$ có $AB=12$ cm, $AD=35$ cm. Tính độ dài đường chéo $BD$ (cm).", "answer": "37", "explain": "$BD=\\sqrt{12^2+35^2}=\\sqrt{1369}=37$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho hình chữ nhật $ABCD$ có $AB=9$ cm, $BC=12$ cm; $O$ là giao điểm của hai đường chéo. Tính chu vi của tam giác $OAB$ (cm).", "answer": "24", "explain": "$OA=OB=AC:2=7,5$ (cm); chu vi $=7,5+7,5+9=24$ (cm)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tứ giác có bốn góc vuông là", "options": ["A. hình chữ nhật", "B. hình thoi", "C. hình thang", "D. hình bình hành"], "answer": "A", "explain": "Tứ giác có bốn góc vuông là hình chữ nhật."}, {"type": "mcq", "level": "NB", "q": "Trong hình chữ nhật $ABCD$", "options": ["A. $AB=CD$ và $AD=BC$", "B. $AB=BC$ và $CD=DA$", "C. $AC=AB$ và $BD=BC$", "D. $AB=AD$ và $CB=CD$"], "answer": "A", "explain": "Các cạnh đối của hình chữ nhật bằng nhau."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây sai về hình chữ nhật?", "options": ["A. Có bốn góc vuông.", "B. Có các cạnh đối song song.", "C. Có bốn cạnh bằng nhau.", "D. Có hai đường chéo bằng nhau."], "answer": "C", "explain": "Hình chữ nhật nói chung không có bốn cạnh bằng nhau nên C sai."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật $MNPQ$ có $MP=37$ cm, $MN=12$ cm. Độ dài cạnh $MQ$ là", "options": ["A. $35$ cm", "B. $25$ cm", "C. $49$ cm", "D. $13$ cm"], "answer": "A", "explain": "$MQ=\\sqrt{37^2-12^2}=\\sqrt{1225}=35$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật $ABCD$ có $AC=65$ cm, $AB=16$ cm. Độ dài cạnh $BC$ là", "options": ["A. $63$ cm", "B. $49$ cm", "C. $81$ cm", "D. $33$ cm"], "answer": "A", "explain": "$BC=\\sqrt{65^2-16^2}=\\sqrt{3969}=63$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình chữ nhật $ABCD$ có $AB=18$ cm, $AD=24$ cm. Độ dài đường chéo $AC$ là", "options": ["A. $30$ cm", "B. $42$ cm", "C. $36$ cm", "D. $25$ cm"], "answer": "A", "explain": "$AC=\\sqrt{18^2+24^2}=\\sqrt{900}=30$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Cho tứ giác $ABCD$ có ba góc vuông. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $ABCD$ là hình chữ nhật.", "b) Góc còn lại cũng là góc vuông.", "c) $AC=BD$.", "d) $AB=AD$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai (chưa đủ dữ kiện)."}, {"type": "truefalse", "level": "TH", "q": "Cho hình chữ nhật $ABCD$ có $AB=7$ cm, $BC=24$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $AC=25$ cm.", "b) Diện tích hình chữ nhật bằng $168$ cm$^2$.", "c) Chu vi hình chữ nhật bằng $62$ cm.", "d) Đường chéo của hình chữ nhật bằng $26$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì đường chéo $=25$ (cm)."}, {"type": "short", "level": "VD", "q": "Cho hình chữ nhật $ABCD$ có $AB=28$ cm, $BC=45$ cm. Tính độ dài đường chéo $AC$ (cm).", "answer": "53", "explain": "$AC=\\sqrt{28^2+45^2}=\\sqrt{2809}=53$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho hình chữ nhật $ABCD$ có $AB=48$ cm, $BC=14$ cm; $O$ là giao điểm của hai đường chéo. Tính chu vi của tam giác $OBC$ (cm).", "answer": "64", "explain": "$AC=\\sqrt{48^2+14^2}=50$ (cm); $OB=OC=25$ (cm); chu vi $=25+25+14=64$ (cm)."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hình chữ nhật là hình vừa là", "options": ["A. hình bình hành vừa là hình thang cân", "B. hình thoi vừa là hình vuông", "C. hình thang vuông vừa là hình thoi", "D. tứ giác lõm vừa là hình thang"], "answer": "A", "explain": "Hình chữ nhật vừa là hình bình hành, vừa là hình thang cân."}, {"type": "mcq", "level": "NB", "q": "Trong hình chữ nhật, giao điểm của hai đường chéo cách đều", "options": ["A. bốn đỉnh của hình chữ nhật", "B. hai đỉnh kề nhau", "C. trung điểm các cạnh", "D. hai đường chéo"], "answer": "A", "explain": "Giao điểm hai đường chéo cách đều bốn đỉnh ($OA=OB=OC=OD$)."}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu nhận biết hình chữ nhật là", "options": ["A. tứ giác có ba góc vuông", "B. tứ giác có hai đường chéo vuông góc", "C. hình bình hành có hai cạnh kề bằng nhau", "D. tứ giác có bốn cạnh bằng nhau"], "answer": "A", "explain": "Tứ giác có ba góc vuông là hình chữ nhật."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật $ABCD$ có $AB=33$ cm, $BC=56$ cm. Độ dài đường chéo $AC$ là", "options": ["A. $65$ cm", "B. $89$ cm", "C. $23$ cm", "D. $45$ cm"], "answer": "A", "explain": "$AC=\\sqrt{33^2+56^2}=\\sqrt{4225}=65$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật có hai cạnh kề bằng $40$ cm và $9$ cm. Độ dài đường chéo là", "options": ["A. $41$ cm", "B. $49$ cm", "C. $31$ cm", "D. $45$ cm"], "answer": "A", "explain": "Đường chéo $=\\sqrt{40^2+9^2}=\\sqrt{1681}=41$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình chữ nhật $ABCD$ có $AB=27$ cm, $AC=45$ cm. Chu vi của hình chữ nhật là", "options": ["A. $126$ cm", "B. $72$ cm", "C. $90$ cm", "D. $108$ cm"], "answer": "A", "explain": "$BC=\\sqrt{45^2-27^2}=36$ (cm); chu vi $=2\\cdot(27+36)=126$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình chữ nhật có bốn góc vuông.", "b) Hình chữ nhật có hai đường chéo bằng nhau.", "c) Hình chữ nhật có bốn cạnh bằng nhau.", "d) Hình chữ nhật là hình bình hành."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình bình hành $MNPQ$ có $MP=NQ=25$ cm, $MN=7$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $MNPQ$ là hình chữ nhật.", "b) $MQ=24$ cm.", "c) Diện tích $MNPQ$ bằng $168$ cm$^2$.", "d) Chu vi $MNPQ$ bằng $60$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng theo dấu hiệu nhận biết. b) Đúng vì $MQ=\\sqrt{25^2-7^2}=24$ (cm). c) Đúng. d) Sai vì chu vi $=62$ (cm)."}, {"type": "short", "level": "VD", "q": "Cho hình chữ nhật $ABCD$ có $AB=60$ cm, $BC=11$ cm. Tính độ dài đường chéo $AC$ (cm).", "answer": "61", "explain": "$AC=\\sqrt{60^2+11^2}=\\sqrt{3721}=61$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho hình chữ nhật $ABCD$ có $AB=20$ cm, $BC=48$ cm. Tính bán kính của đường tròn đi qua bốn đỉnh của hình chữ nhật (cm).", "answer": "26", "explain": "$AC=\\sqrt{20^2+48^2}=52$ (cm); bán kính $=AC:2=26$ (cm)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hình bình hành $ABCD$ có $\\widehat{A}=90^\\circ$ là", "options": ["A. hình chữ nhật", "B. hình thoi", "C. hình thang vuông", "D. tứ giác lồi bất kì"], "answer": "A", "explain": "Hình bình hành có một góc vuông là hình chữ nhật."}, {"type": "mcq", "level": "NB", "q": "Trong hình chữ nhật, hai đường chéo", "options": ["A. bằng nhau", "B. vuông góc với nhau", "C. là các đường phân giác", "D. song song với nhau"], "answer": "A", "explain": "Trong hình chữ nhật, hai đường chéo bằng nhau."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. Hình chữ nhật có tất cả các tính chất của hình bình hành.", "B. Hình chữ nhật có hai đường chéo vuông góc.", "C. Hình chữ nhật có bốn cạnh bằng nhau.", "D. Hình chữ nhật có hai đường chéo là các đường phân giác."], "answer": "A", "explain": "Vì hình chữ nhật cũng là hình bình hành nên có mọi tính chất của hình bình hành."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật $EFGH$ có $EF=14$ cm, $FG=48$ cm. Độ dài đường chéo $EG$ là", "options": ["A. $50$ cm", "B. $62$ cm", "C. $34$ cm", "D. $40$ cm"], "answer": "A", "explain": "$EG=\\sqrt{14^2+48^2}=\\sqrt{2500}=50$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật $ABCD$ có diện tích $300$ cm$^2$, $BC=12$ cm. Độ dài cạnh $AB$ là", "options": ["A. $25$ cm", "B. $20$ cm", "C. $15$ cm", "D. $30$ cm"], "answer": "A", "explain": "$AB=300:12=25$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình chữ nhật $ABCD$ có $AB=44$ cm, $AC=55$ cm. Độ dài cạnh $BC$ là", "options": ["A. $33$ cm", "B. $11$ cm", "C. $22$ cm", "D. $99$ cm"], "answer": "A", "explain": "$BC=\\sqrt{55^2-44^2}=\\sqrt{1089}=33$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Cho hình chữ nhật $ABCD$, $O$ là giao điểm của hai đường chéo. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $OA=OB$.", "b) $OA=OC$.", "c) $OB=OD$.", "d) $O$ là trung điểm của $AB$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình chữ nhật $ABCD$ có $AB=12$ cm, $AD=16$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $AC=20$ cm.", "b) Diện tích $ABCD$ bằng $192$ cm$^2$.", "c) Diện tích tam giác $ABC$ bằng $96$ cm$^2$.", "d) Chu vi $ABCD$ bằng $54$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì chu vi $=56$ (cm)."}, {"type": "short", "level": "VD", "q": "Cho hình chữ nhật $MNPQ$ có $MN=39$ cm, $MQ=52$ cm. Tính độ dài đường chéo $MP$ (cm).", "answer": "65", "explain": "$MP=\\sqrt{39^2+52^2}=\\sqrt{4225}=65$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho hình chữ nhật $ABCD$ có $AB=24$ cm, $BC=10$ cm; $O$ là giao điểm của hai đường chéo. Tính chu vi của tam giác $OAD$ (cm).", "answer": "36", "explain": "$AC=\\sqrt{24^2+10^2}=26$ (cm); $OA=OD=13$ (cm); chu vi $=13+13+10=36$ (cm)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tứ giác có ba góc vuông là", "options": ["A. hình chữ nhật", "B. hình thoi", "C. hình thang", "D. hình bình hành"], "answer": "A", "explain": "Dấu hiệu nhận biết: tứ giác có ba góc vuông là hình chữ nhật."}, {"type": "mcq", "level": "NB", "q": "Trong hình chữ nhật $ABCD$, cặp cạnh bằng nhau là", "options": ["A. $AB=CD$", "B. $AB=BC$", "C. $AC=AB$", "D. $AD=AB$"], "answer": "A", "explain": "Các cạnh đối của hình chữ nhật bằng nhau: $AB=CD$, $AD=BC$."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây sai về hình chữ nhật?", "options": ["A. Có hai đường chéo bằng nhau.", "B. Có bốn góc vuông.", "C. Có hai đường chéo cắt nhau tại trung điểm của mỗi đường.", "D. Có bốn cạnh bằng nhau."], "answer": "D", "explain": "Hình chữ nhật nói chung không có bốn cạnh bằng nhau nên D sai."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật $ABCD$ có $AB=13$ cm, $BC=84$ cm. Độ dài đường chéo $AC$ là", "options": ["A. $85$ cm", "B. $97$ cm", "C. $71$ cm", "D. $45$ cm"], "answer": "A", "explain": "$AC=\\sqrt{13^2+84^2}=\\sqrt{7225}=85$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho hình chữ nhật có đường chéo $65$ cm và một cạnh $39$ cm. Độ dài cạnh còn lại là", "options": ["A. $52$ cm", "B. $26$ cm", "C. $104$ cm", "D. $16$ cm"], "answer": "A", "explain": "Cạnh còn lại $=\\sqrt{65^2-39^2}=\\sqrt{2704}=52$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình chữ nhật $ABCD$ có chu vi $42$ cm, $AB=12$ cm. Độ dài đường chéo $AC$ là", "options": ["A. $15$ cm", "B. $21$ cm", "C. $18$ cm", "D. $30$ cm"], "answer": "A", "explain": "$BC=(42-24):2=9$ (cm); $AC=\\sqrt{12^2+9^2}=15$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Mọi hình chữ nhật đều là hình bình hành.", "b) Mọi hình chữ nhật đều là hình thang cân.", "c) Mọi hình bình hành đều là hình chữ nhật.", "d) Mọi hình chữ nhật đều là hình vuông."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c), d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình chữ nhật $PQRS$ có $PQ=9$ cm, $QR=12$ cm, $O$ là giao điểm của hai đường chéo. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $PR=15$ cm.", "b) $OP=7,5$ cm.", "c) Diện tích $PQRS$ bằng $108$ cm$^2$.", "d) $OQ=8$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì $OQ=OP=7,5$ (cm)."}, {"type": "short", "level": "VD", "q": "Cho hình chữ nhật $ABCD$ có $AB=25$ cm, $AD=60$ cm. Tính độ dài đường chéo $BD$ (cm).", "answer": "65", "explain": "$BD=\\sqrt{25^2+60^2}=\\sqrt{4225}=65$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho hình chữ nhật $ABCD$ có $AB=18$ cm, $AD=24$ cm; $O$ là giao điểm của hai đường chéo. Tính khoảng cách từ $O$ đến cạnh $AB$ (cm).", "answer": "12", "explain": "Khoảng cách từ $O$ đến $AB$ bằng nửa chiều rộng: $AD:2=12$ (cm)."}]}]}
