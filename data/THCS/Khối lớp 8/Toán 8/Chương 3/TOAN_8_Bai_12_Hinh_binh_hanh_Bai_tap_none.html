q", "level": "NB", "q": "Khẳng định nào sau đây sai về hình bình hành?", "options": ["A. Các góc đối bằng nhau.", "B. Hai đường chéo cắt nhau tại trung điểm của mỗi đường.", "C. Có bốn góc vuông.", "D. Các cạnh đối song song."], "answer": "C", "explain": "Hình bình hành nói chung không có bốn góc vuông nên C sai."}, {"type": "mcq", "level": "TH", "q": "Cho hình bình hành $ABCD$ có $\\widehat{A}=108^\\circ$. Số đo góc $\\widehat{C}$ là", "options": ["A. $108^\\circ$", "B. $72^\\circ$", "C. $90^\\circ$", "D. $118^\\circ$"], "answer": "A", "explain": "$\\widehat{C}=\\widehat{A}=108^\\circ$ (hai góc đối)."}, {"type": "mcq", "level": "TH", "q": "Cho hình bình hành $ABCD$ có $AB=16$ cm, $AD=10$ cm. Tổng $CD+BC$ bằng", "options": ["A. $26$ cm", "B. $32$ cm", "C. $20$ cm", "D. $13$ cm"], "answer": "A", "explain": "$CD=AB=16$ (cm), $BC=AD=10$ (cm) nên tổng bằng $26$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình bình hành $ABCD$ có $\\widehat{D}=2\\widehat{C}-30^\\circ$. Số đo góc $\\widehat{D}$ là", "options": ["A. $110^\\circ$", "B. $70^\\circ$", "C. $60^\\circ$", "D. $120^\\circ$"], "answer": "A", "explain": "$\\widehat{D}$ và $\\widehat{C}$ là hai góc kề nhau nên $\\widehat{D}+\\widehat{C}=180^\\circ$; mà $\\widehat{D}=2\\widehat{C}-30^\\circ$ nên $3\\widehat{C}=210^\\circ$, $\\widehat{C}=70^\\circ$, $\\widehat{D}=110^\\circ$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Mọi hình bình hành đều là tứ giác.", "b) Hình bình hành có $4$ góc, tổng các góc bằng $360^\\circ$.", "c) Hình bình hành có hai đường chéo bằng nhau.", "d) Hình bình hành có các cạnh đối song song."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình bình hành $ABCD$ có $\\widehat{A}=45^\\circ$, $AB=8$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $\\widehat{C}=45^\\circ$.", "b) $\\widehat{B}=135^\\circ$.", "c) $\\widehat{D}=135^\\circ$.", {D}$ bằng", "options": ["A. $180^\\circ$", "B. $140^\\circ$", "C. $220^\\circ$", "D. $90^\\circ$"], "answer": "A", "explain": "$\\widehat{C}=\\widehat{A}=70^\\circ$, $\\widehat{D}=\\widehat{B}=110^\\circ$ nên tổng bằng $180^\\circ$."}, {"type": "mcq", "level": "VD", "q": "Cho hình bình hành $ABCD$ có $\\widehat{A}+\\widehat{C}=200^\\circ$. Số đo góc $\\widehat{B}$ là", "options": ["A. $80^\\circ$", "B. $100^\\circ$", "C. $90^\\circ$", "D. $110^\\circ$"], "answer": "A", "explain": "$\\widehat{A}=\\widehat{C}=100^\\circ$ nên $\\widehat{B}=180^\\circ-100^\\circ=80^\\circ$."}, {"type": "truefalse", "level": "NB", "q": "Cho tứ giác $MNPQ$ có $MN=PQ$ và $MQ=NP$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $MNPQ$ là hình bình hành.", "b) $MN \\parallel PQ$.", "c) $\\widehat{M}=\\widehat{Q}$.", "d) $MP=NQ$."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng theo dấu hiệu nhận biết. c) Sai vì $\\widehat{M}=\\widehat{P}$. d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình bình hành $ABCD$ có chu vi $36$ cm, $AB=11$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $CD=11$ cm.", "b) $BC=7$ cm.", "c) $AD=7$ cm.", "d) $AC=BD$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng vì $BC=(36-22):2=7$ (cm). c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "q": "Cho hình bình hành $EFGH$ có $\\widehat{F}=88^\\circ$. Tính số đo góc $\\widehat{H}$ (độ).", "answer": "88", "explain": "$\\widehat{H}=\\widehat{F}=88^\\circ$ (hai góc đối)."}, {"type": "short", "level": "VDC", "q": "Cho hình bình hành $ABCD$ có $AB=11$ cm, $AD=8$ cm; $O$ là giao điểm của hai đường chéo và $OA+OB=15$ cm. Tính chu vi của tam giác $OAB$ (cm).", "answer": "26", "explain": "Chu vi tam giác $OAB$ $=OA+OB+AB=15+11=26$ (cm)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Hình bình hành là hình có", "options": ["A. các cạnh đối song song", "B. hai đường chéo bằng nhau", "C. bốn góc vuông", "D. hai đường chéo vuông góc"], "answer": "A", "explain": "Định nghĩa: hình bình hành là tứ giác có các cạnh đối song song."}, {"type": "mcq", "level": "NB", "q": "Tâm đối xứng của hình bình hành là", "options": ["A. giao điểm của hai đường chéo", "B. trung điểm của một cạnh", "C. một đỉnh của hình bình hành", "D. chân đường cao"], "answer": "A", "explain": "Giao điểm hai đường chéo là tâm đối xứng của hình bình hành."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. Hình bình hành có hai đường chéo cắt nhau tại trung điểm của mỗi đường.", "B. Hình bình hành có hai đường chéo bằng nhau.", "C. Hình bình hành có hai đường chéo vuông góc với nhau.", "D. Hình bình hành có bốn góc bằng nhau."], "answer": "A", "explain": "Chỉ có A đúng theo tính chất hình bình hành."}, {"type": "mcq", "level": "TH", "q": "Cho hình bình hành $ABCD$ có $\\widehat{B}=93^\\circ$. Số đo góc $\\widehat{D}$ là", "options": ["A. $93^\\circ$", "B. $87^\\circ$", "C. $90^\\circ$", "D. $103^\\circ$"], "answer": "A", "explain": "$\\widehat{D}=\\widehat{B}=93^\\circ$ (hai góc đối)."}, {"type": "mcq", "level": "TH", "q": "Cho hình bình hành $KLMN$ có $KL=17$ cm, $LM=13$ cm. Tổng $MN+NK$ bằng", "options": ["A. $30$ cm", "B. $34$ cm", "C. $26$ cm", "D. $60$ cm"], "answer": "A", "explain": "$MN=KL=17$ (cm), $NK=LM=13$ (cm) nên tổng bằng $30$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình bình hành $ABCD$ có $\\widehat{A}=4\\widehat{B}$. Số đo góc $\\widehat{A}$ là", "options": ["A. $144^\\circ$", "B. $36^\\circ$", "C. $90^\\circ$", "D. $100^\\circ$"], "answer": "A", "explain": "$5\\widehat{B}=180^\\circ$ nên $\\widehat{B}=36^\\circ$, $\\widehat{A}=144^\\circ$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình bình hành có các cạnh đối song song.", "b) Hình bình hành có các góc đối bằng nhau.", "c) Hình bình hành là hình thang.", "d) Hình thang là hình bình hành."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng vì hình bình hành có hai cạnh đối song song (là trường hợp đặc biệt của hình thang). d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình bình hành $ABCD$ có $\\widehat{A}=55^\\circ$, $BC=9$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $\\widehat{C}=55^\\circ$.", "b) $\\widehat{B}=125^\\circ$.", "c) $AD=9$ cm.", "d) $AB=9$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai (chưa đủ dữ kiện)."}, {"type": "short", "level": "VD", "q": "Cho hình bình hành $ABCD$ có $\\widehat{D}=64^\\circ$. Tính số đo góc $\\widehat{B}$ (độ).", "answer": "64", "explain": "$\\widehat{B}=\\widehat{D}=64^\\circ$ (hai góc đối)."}, {"type": "short", "level": "VDC", "q": "Cho hình bình hành $ABCD$ có chu vi $72$ cm, $AB=2\\cdot BC+6$ cm. Tính độ dài cạnh $AB$ (cm).", "answer": "26", "explain": "$2\\cdot(AB+BC)=72$ nên $AB+BC=36$; mà $AB=2BC+6$ nên $3BC=30$, $BC=10$ (cm), $AB=26$ (cm)."}]}]}
