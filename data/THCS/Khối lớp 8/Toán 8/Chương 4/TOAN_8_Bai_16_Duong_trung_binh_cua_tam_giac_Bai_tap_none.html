=16$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho tam giác $ABC$, $D$, $E$ lần lượt là trung điểm của $AB$, $AC$; $F$, $G$ lần lượt là trung điểm của $AD$, $AE$. Biết $BC=32$ cm. Tính $FG$ (cm).", "answer": "8", "explain": "$DE=16$ (cm); $FG=\\frac{1}{2}DE=8$ (cm)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Cho tam giác $ABC$, $M$, $N$ là trung điểm của $AB$, $AC$. Khẳng định sai là", "options": ["A. $MN \\parallel BC$", "B. $MN=\\dfrac{1}{2}BC$", "C. $MN=BC$", "D. $M$, $N$ là trung điểm hai cạnh"], "answer": "C", "explain": "$MN=\\frac{1}{2}BC$ nên C sai."}, {"type": "mcq", "level": "NB", "q": "Đường trung bình của tam giác", "options": ["A. song song với cạnh thứ ba", "B. vuông góc với cạnh thứ ba", "C. bằng cạnh thứ ba", "D. đi qua đỉnh đối diện"], "answer": "A", "explain": "Đường trung bình song song với cạnh thứ ba."}, {"type": "mcq", "level": "NB", "q": "Nếu $DE$ là đường trung bình của tam giác $ABC$ ($D \\in AB$, $E \\in AC$) thì", "options": ["A. $DE=\\dfrac{1}{2}BC$", "B. $DE=BC$", "C. $DE=2BC$", "D. $DE \\perp BC$"], "answer": "A", "explain": "Tính chất đường trung bình."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$ đều cạnh $20$ cm; $M$, $N$ lần lượt là trung điểm của $AB$, $AC$. Độ dài $MN$ là", "options": ["A. $10$ cm", "B. $20$ cm", "C. $40$ cm", "D. $5$ cm"], "answer": "A", "explain": "$MN=\\frac{1}{2}BC=10$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $DEF$, $I$, $K$ lần lượt là trung điểm của $DE$, $DF$. Biết $IK=13$ cm. Độ dài $EF$ là", "options": ["A. $26$ cm", "B. $13$ cm", "C. $39$ cm", "D. $6,5$ cm"], "answer": "A", "explain": "$EF=2\\cdot IK=26$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho tam giác $ABC$, $P$, $Q$ lần lượt là trung điểm của $AB$, $AC$. Biết $PQ=2x$ (cm), $BC=5x-9$ (cm). Độ dài $PQ$ là", "options": ["A. $18$ cm", "B. $9$ cm", "C. $27$ cm", "D. $36$ cm"], "answer": "A", "explain": "$4x=5x-9$ nên $x=9$; $PQ=18$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau về đường trung bình của tam giác.", "statements": ["a) Mỗi tam giác có ba đường trung bình.", "b) Mỗi đường trung bình song song với một cạnh của tam giác.", "c) Mỗi đường trung bình bằng nửa cạnh tương ứng.", "d) Ba đường trung bình cắt nhau tại một điểm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho tam giác $ABC$ có $AB=14$ cm, $AC=18$ cm; $M$, $N$ lần lượt là trung điểm của $AB$, $AC$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $AM=7$ cm.", "b) $AN=9$ cm.", "c) $MN \\parallel BC$.", "d) $MN=16$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai (chưa biết $BC$)."}, {"type": "short", "level": "VD", "q": "Cho tam giác $ABC$, $U$, $V$ lần lượt là trung điểm của $AB$, $BC$. Biết $AC=28$ cm. Tính $UV$ (cm).", "answer": "14", "explain": "$UV=\\frac{1}{2}AC=14$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho tam giác $ABC$ có $M$, $N$, $P$ lần lượt là trung điểm của $AB$, $BC$, $CA$. Biết $AB=10$ cm, $BC=14$ cm, $CA=16$ cm. Tính $MN+NP+PM$ (cm).", "answer": "20", "explain": "$MN+NP+PM=\\frac{1}{2}(10+14+16)=20$ (cm)."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Đoạn thẳng nối trung điểm hai cạnh của tam giác", "options": ["A. song song với cạnh thứ ba", "B. vuông góc với cạnh thứ ba", "C. bằng cạnh thứ ba", "D. là đường phân giác"], "answer": "A", "explain": "Đó là tính chất đường trung bình của tam giác."}, {"type": "mcq", "level": "NB", "q": "Cho tam giác $ABC$, $D$ là trung điểm của $AB$, $E$ là trung điểm của $AC$. $DE$ được gọi là", "options": ["A. đường trung bình của tam giác $ABC$", "B. đường trung tuyến của tam giác $ABC$", "C. đường cao của tam giác $ABC$", "D. đường phân giác của tam giác $ABC$"], "answer": "A", "explain": "$DE$ nối trung điểm hai cạnh nên là đường trung bình."}, {"type": "mcq", "level": "NB", "q": "Đường trung bình của tam giác bằng nửa", "options": ["A. cạnh thứ ba", "B. tổng hai cạnh kề", "C. chu vi của tam giác", "D. đường cao tương ứng"], "answer": "A", "explain": "Đường trung bình bằng nửa cạnh thứ ba."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $GHI$, $M$, $N$ lần lượt là trung điểm của $GH$, $GI$. Biết $HI=28$ cm. Độ dài $MN$ là", "options": ["A. $14$ cm", "B. $28$ cm", "C. $56$ cm", "D. $7$ cm"], "answer": "A", "explain": "$MN=\\frac{1}{2}HI=14$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$, $D$, $E$ lần lượt là trung điểm của $AB$, $AC$. Biết $BC-DE=12$ cm. Độ dài $DE$ là", "options": ["A. $12$ cm", "B. $24$ cm", "C. $6$ cm", "D. $18$ cm"], "answer": "A", "explain": "$BC=2\\cdot DE$ nên $DE=12$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho tam giác $ABC$ vuông tại $A$ có $AB=12$ cm, $AC=16$ cm; $D$, $E$ lần lượt là trung điểm của $AB$, $AC$. Độ dài $DE$ là", "options": ["A. $10$ cm", "B. $20$ cm", "C. $14$ cm", "D. $28$ cm"], "answer": "A", "explain": "$BC=20$ (cm) nên $DE=10$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau về đường trung bình.", "statements": ["a) Đường trung bình của tam giác là đoạn thẳng nối hai trung điểm.", "b) Đường trung bình song song với cạnh thứ ba của tam giác.", "c) Đường trung bình dài bằng nửa cạnh thứ ba.", "d) Đường trung bình vuông góc với cạnh thứ ba."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho tam giác $ABC$, $D$, $E$, $F$ lần lượt là trung điểm của $AB$, $BC$, $CA$; $AB=12$ cm, $BC=16$ cm, $CA=20$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $DE=10$ cm.", "b) $EF=6$ cm.", "c) $FD=8$ cm.", "d) Chu vi tam giác $DEF$ bằng $48$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì chu vi $=24$ (cm)."}, {"type": "short", "level": "VD", "q": "Cho tam giác $KLM$, $X$, $Y$ lần lượt là trung điểm của $KL$, $KM$. Biết $LM=36$ cm. Tính $XY$ (cm).", "answer": "18", "explain": "$XY=\\frac{1}{2}LM=18$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho tam giác $ABC$ đều cạnh $24$ cm; $M$, $N$, $P$ lần lượt là trung điểm các cạnh của tam giác. Tính chu vi của tam giác $MNP$ (cm).", "answer": "36", "explain": "Mỗi cạnh của $\\triangle MNP$ bằng $12$ (cm) nên chu vi $=36$ (cm)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong tam giác $ABC$, $M$, $N$ là trung điểm của $AB$, $AC$. Phát biểu đúng là", "options": ["A. $MN \\parallel BC$ và $MN=\\dfrac{1}{2}BC$", "B. $MN \\perp BC$ và $MN=\\dfrac{1}{2}BC$", "C. $MN \\parallel BC$ và $MN=BC$", "D. $MN$ đi qua $A$ và $MN=\\dfrac{1}{2}BC$"], "answer": "A", "explain": "Đó là tính chất đường trung bình của tam giác."}, {"type": "mcq", "level": "NB", "q": "Đường trung bình của tam giác là đoạn thẳng", "options": ["A. nối trung điểm hai cạnh của tam giác", "B. nối một đỉnh với trung điểm cạnh đối diện", "C. kẻ từ trung điểm một cạnh vuông góc với cạnh đó", "D. nối hai đỉnh của tam giác"], "answer": "A", "explain": "Định nghĩa đường trung bình của tam giác."}, {"type": "mcq", "level": "NB", "q": "Cho $MN$ là đường trung bình của tam giác $ABC$ ứng với cạnh $BC$. Khẳng định sai là", "options": ["A. $MN \\parallel BC$", "B. $MN=\\dfrac{1}{2}BC$", "C. $M$ là trung điểm của $AB$", "D. $MN \\perp BC$"], "answer": "D", "explain": "$MN \\parallel BC$ nên D sai."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $PQR$, $E$, $F$ lần lượt là trung điểm của $PQ$, $PR$. Biết $QR=40$ cm. Độ dài $EF$ là", "options": ["A. $20$ cm", "B. $40$ cm", "C. $80$ cm", "D. $10$ cm"], "answer": "A", "explain": "$EF=\\frac{1}{2}QR=20$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$, $M$, $N$ lần lượt là trung điểm của $AB$, $AC$. Biết $MN=17$ cm. Độ dài $BC$ là", "options": ["A. $34$ cm", "B. $17$ cm", "C. $51$ cm", "D. $8,5$ cm"], "answer": "A", "explain": "$BC=2\\cdot MN=34$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho tam giác $ABC$, $D$, $E$ lần lượt là trung điểm của $AB$, $AC$. Biết chu vi tam giác $ADE$ bằng $30$ cm, $AB=16$ cm, $AC=20$ cm. Độ dài $BC$ là", "options": ["A. $24$ cm", "B. $12$ cm", "C. $48$ cm", "D. $30$ cm"], "answer": "A", "explain": "$DE=30-8-10=12$ (cm) nên $BC=24$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Cho tam giác $DEF$, $M$, $N$ lần lượt là trung điểm của $DE$, $DF$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $MN$ là đường trung bình của tam giác $DEF$.", "b) $MN \\parallel EF$.", "c) $MN=\\dfrac{1}{2}EF$.", "d) $M$ là trung điểm của $EF$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho tam giác $ABC$ cân tại $A$ có $AB=AC=13$ cm, $BC=10$ cm; $M$, $N$ lần lượt là trung điểm của $AB$, $AC$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $MN=5$ cm.", "b) $AM=6,5$ cm.", "c) Tứ giác $BMNC$ là hình thang cân.", "d) Chu vi tứ giác $BMNC$ bằng $29,5$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng vì $MN \\parallel BC$ và $BM=CN$. d) Sai vì chu vi $=5+6,5+10+6,5=28$ (cm)."}, {"type": "short", "level": "VD", "q": "Cho tam giác $STU$, $V$, $W$ lần lượt là trung điểm của $ST$, $SU$. Biết $TU=44$ cm. Tính $VW$ (cm).", "answer": "22", "explain": "$VW=\\frac{1}{2}TU=22$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho tam giác $ABC$, $M$, $N$ là trung điểm của $AB$, $AC$; $I$, $K$ lần lượt là trung điểm của $AM$, $AN$. Biết $BC=40$ cm. Tính $IK$ (cm).", "answer": "10", "explain": "$MN=20$ (cm); $IK=\\frac{1}{2}MN=10$ (cm)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tính chất đường trung bình của tam giác: Đường trung bình của tam giác", "options": ["A. song song với cạnh thứ ba và bằng nửa cạnh ấy", "B. vuông góc với cạnh thứ ba", "C. bằng cạnh thứ ba", "D. đi qua trung điểm cạnh thứ ba"], "answer": "A", "explain": "Đó là tính chất đường trung bình của tam giác."}, {"type": "mcq", "level": "NB", "q": "Mỗi tam giác có bao nhiêu đường trung bình?", "options": ["A. $3$", "B. $1$", "C. $2$", "D. $4$"], "answer": "A", "explain": "Mỗi tam giác có $3$ đường trung bình."}, {"type": "mcq", "level": "NB", "q": "Cho tam giác $ABC$, $D$, $E$, $F$ là trung điểm của $AB$, $BC$, $CA$. Đoạn thẳng $EF$", "options": ["A. song song với $AB$ và bằng nửa $AB$", "B. song song với $BC$ và bằng nửa $BC$", "C. vuông góc với $AB$", "D. bằng $AB$"], "answer": "A", "explain": "$EF$ là đường trung bình ứng với cạnh $AB$."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$, $M$, $N$ lần lượt là trung điểm của $AB$, $AC$. Biết $BC=50$ cm. Độ dài $MN$ là", "options": ["A. $25$ cm", "B. $50$ cm", "C. $100$ cm", "D. $12,5$ cm"], "answer": "A", "explain": "$MN=\\frac{1}{2}BC=25$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Đường trung bình của một tam giác dài $19$ cm. Cạnh thứ ba của tam giác dài", "options": ["A. $38$ cm", "B. $19$ cm", "C. $9,5$ cm", "D. $57$ cm"], "answer": "A", "explain": "Cạnh thứ ba $=2\\cdot19=38$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho tam giác $ABC$, $D$, $E$ lần lượt là trung điểm của $AB$, $AC$. Biết $DE=5x-6$ (cm), $BC=11x-18$ (cm). Độ dài $DE$ là", "options": ["A. $24$ cm", "B. $18$ cm", "C. $30$ cm", "D. $12$ cm"], "answer": "A", "explain": "$2(5x-6)=11x-18$ nên $x=6$; $DE=24$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Đường trung bình của tam giác đi qua trung điểm của hai cạnh.", "b) Đường trung bình của tam giác song song với cạnh còn lại.", "c) Đường trung bình của tam giác bằng nửa cạnh còn lại.", "d) Đường trung bình của tam giác đi qua đỉnh đối diện."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho tam giác $ABC$ vuông tại $B$ có $AB=5$ cm, $BC=12$ cm; $D$, $E$ lần lượt là trung điểm của $AB$, $BC$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $AC=13$ cm.", "b) $DE=6,5$ cm.", "c) $DE \\parallel AC$.", "d) $AD=5$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì $AD=2,5$ (cm)."}, {"type": "short", "level": "VD", "q": "Cho tam giác $ABC$, $P$, $Q$ lần lượt là trung điểm của $AB$, $AC$. Biết $PQ=23$ cm. Tính $BC$ (cm).", "answer": "46", "explain": "$BC=2\\cdot PQ=46$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho tam giác $ABC$ có $M$, $N$, $P$ lần lượt là trung điểm của $AB$, $BC$, $CA$. Biết chu vi tam giác $MNP$ bằng $21$ cm. Tính chu vi của tam giác $ABC$ (cm).", "answer": "42", "explain": "Chu vi $\\triangle ABC=2\\cdot21=42$ (cm)."}]}]}
