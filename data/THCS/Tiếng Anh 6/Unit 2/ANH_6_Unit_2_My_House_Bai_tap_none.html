<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "My family watches TV in the ______ every evening.", "options": ["A. living room", "B. bathroom", "C. bedroom", "D. kitchen"], "answer": "A", "explain": "Phòng khách (living room) là nơi cả nhà xem ti-vi. Bedroom là phòng ngủ, kitchen là nhà bếp, bathroom là nhà tắm."}, {"type": "mcq", "level": "NB", "q": "This is ______ bedroom. It is small but tidy.", "options": ["A. of Lan", "B. Lan's", "C. Lan", "D. Lans"], "answer": "B", "explain": "Sở hữu cách: tên người + 's. Đáp án B nghĩa là phòng ngủ của Lan."}, {"type": "mcq", "level": "TH", "q": "My bag is ______ the table. I cannot see it.", "options": ["A. between", "B. in front of", "C. under", "D. on"], "answer": "C", "explain": "Không nhìn thấy cặp vì nó ở dưới gầm bàn — dùng under (ở dưới)."}, {"type": "mcq", "level": "TH", "q": "We cook meals in the ______.", "options": ["A. bathroom", "B. garden", "C. bedroom", "D. kitchen"], "answer": "D", "explain": "Kitchen là nhà bếp, nơi nấu ăn. Các đáp án còn lại không phải nơi nấu ăn."}, {"type": "mcq", "level": "VD", "q": "Choose the word in which the letter 's' is pronounced differently from the others.", "options": ["A. dogs", "B. lamps", "C. cats", "D. books"], "answer": "A", "explain": "cats, books, lamps tận cùng bằng âm vô thanh nên 's' đọc là /s/. dogs tận cùng bằng âm hữu thanh /g/ nên 's' đọc là /z/."}, {"type": "mcq", "level": "VDC", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. bathroom", "B. behind", "C. bedroom", "D. kitchen"], "answer": "B", "explain": "bedroom, kitchen, bathroom nhấn âm đầu. behind nhấn âm thứ hai (beHIND)."}, {"type": "truefalse", "level": "NB", "q": "Read the text and decide whether the statements are true (T) or false (F). Hi! My name is Mai. I live in a small house with my parents and my brother. There are three bedrooms in our house. My bedroom is next to my brother's room.", "statements": ["a) Mai lives in a flat.", "b) There are three bedrooms in the house.", "c) Mai's bedroom is next to her brother's room.", "d) Mai lives with her grandparents."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: Mai sống trong một ngôi nhà (house), không phải căn hộ (flat). b) Đúng: bài viết có ba phòng ngủ. c) Đúng: phòng của Mai cạnh phòng của anh trai. d) Sai: Mai sống với bố mẹ và anh trai."}, {"type": "truefalse", "level": "TH", "q": "Read the text and decide whether the statements are true (T) or false (F). This is my living room. It is big and bright. There is a brown sofa and a small table in the middle of the room. The TV is on the table. My cat is sleeping under the table.", "statements": ["a) The living room is small and dark.", "b) There is a brown sofa in the room.", "c) The TV is under the table.", "d) The cat is sleeping on the sofa."], "answer": ["F", "T", "F", "F"], "explain": "a) Sai: phòng khách to và sáng (big and bright). b) Đúng: có ghế sofa màu nâu. c) Sai: ti-vi ở trên bàn (on the table). d) Sai: mèo ngủ dưới gầm bàn (under the table)."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["bedroom", "phòng ngủ"], ["kitchen", "nhà bếp"], ["bathroom", "phòng tắm"], ["living room", "phòng khách"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["The", "sofa", "is", "in", "the", "living", "room"], "points": 1, "explain": "Câu đúng: The sofa is in the living room."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Where is the kitchen? B: It is next to the living room. A: Is there a fridge in the kitchen? B: Yes, there is.", "sub_questions": [{"q": "Where is the kitchen?", "options": ["Next to the living room", "Behind the bedroom", "Under the stairs"], "answer": 0}, {"q": "Is there a fridge in the kitchen?", "options": ["Yes", "No"], "answer": 0}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "The kitchen is next to the living room", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "We keep our clothes in the ______.", "options": ["A. sofa", "B. cooker", "C. wardrobe", "D. sink"], "answer": "C", "explain": "Wardrobe là tủ quần áo, nơi cất quần áo. Sofa là ghế, cooker là bếp nấu, sink là bồn rửa."}, {"type": "mcq", "level": "NB", "q": "______ the lamp? It is on the table.", "options": ["A. How's", "B. Who's", "C. What's", "D. Where's"], "answer": "D", "explain": "Hỏi vị trí của đồ vật dùng Where's (Where is). Câu trả lời chỉ vị trí: ở trên bàn."}, {"type": "mcq", "level": "TH", "q": "The car is ______ the house. You can see it from the window.", "options": ["A. in front of", "B. between", "C. in", "D. under"], "answer": "A", "explain": "Chiếc xe ở phía trước ngôi nhà — dùng in front of (ở phía trước)."}, {"type": "mcq", "level": "TH", "q": "This is my ______ room. My sister and I sleep here.", "options": ["A. kitchen", "B. bedroom", "C. bed", "D. living"], "answer": "B", "explain": "Bedroom là phòng ngủ, nơi ngủ. Living room là phòng khách, kitchen là nhà bếp."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose final 's' is pronounced differently from the others.", "options": ["A. beds", "B. rooms", "C. stops", "D. chairs"], "answer": "C", "explain": "rooms, chairs, beds tận cùng bằng âm hữu thanh nên 's' đọc là /z/. stops tận cùng bằng âm vô thanh /p/ nên 's' đọc là /s/."}, {"type": "mcq", "level": "VDC", "q": "Choose the correct sentence.", "options": ["A. This is the girl's bedroom are big.", "B. This is bedroom of the girls.", "C. This is the girls's bedroom.", "D. This is the girls' bedroom."], "answer": "D", "explain": "Danh từ số nhiều tận cùng bằng s (girls) chỉ thêm dấu ': girls' bedroom. Đáp án A thừa s, C và D sai ngữ pháp."}, {"type": "truefalse", "level": "NB", "q": "Read the text and decide whether the statements are true (T) or false (F). Hello! I am Nam. This is our kitchen. It is not very big. There is a cooker, a fridge and a sink in the kitchen. Mum is cooking dinner now.", "statements": ["a) Nam is in the kitchen.", "b) The kitchen is very big.", "c) There is a cooker in the kitchen.", "d) Mum is watching TV."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: Nam đang giới thiệu nhà bếp. b) Sai: nhà bếp không lớn lắm (not very big). c) Đúng: có bếp nấu trong bếp. d) Sai: mẹ đang nấu bữa tối (cooking dinner)."}, {"type": "truefalse", "level": "TH", "q": "Read the text and decide whether the statements are true (T) or false (F). My bedroom is my favourite room. There is a blue bed and a big wardrobe. My books are on the bookshelf next to the window. There is a lamp on my desk. I do my homework there every evening.", "statements": ["a) The speaker's favourite room is the bedroom.", "b) The bookshelf is next to the window.", "c) There is a lamp under the desk.", "d) He does his homework in the living room."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: phòng ngủ là phòng yêu thích nhất. b) Đúng: kệ sách cạnh cửa sổ. c) Sai: đèn ở trên bàn học (on the desk). d) Sai: bạn ấy làm bài tập ở bàn học trong phòng ngủ."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["bedroom", "phòng ngủ"], ["kitchen", "nhà bếp"], ["bathroom", "phòng tắm"], ["living room", "phòng khách"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["The", "sofa", "is", "in", "the", "living", "room"], "points": 1, "explain": "Câu đúng: The sofa is in the living room."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Where is the kitchen? B: It is next to the living room. A: Is there a fridge in the kitchen? B: Yes, there is.", "sub_questions": [{"q": "Where is the kitchen?", "options": ["Next to the living room", "Behind the bedroom", "Under the stairs"], "answer": 0}, {"q": "Is there a fridge in the kitchen?", "options": ["Yes", "No"], "answer": 0}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "The kitchen is next to the living room", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "We have dinner in the ______.", "options": ["A. dining room", "B. bathroom", "C. garage", "D. hall"], "answer": "A", "explain": "Dining room là phòng ăn, nơi ăn tối. Bathroom là nhà tắm, garage là nhà để xe."}, {"type": "mcq", "level": "NB", "q": "The ______ is in the kitchen. Mum cooks on it.", "options": ["A. bed", "B. cooker", "C. sofa", "D. wardrobe"], "answer": "B", "explain": "Cooker là bếp nấu, dùng để nấu ăn trong nhà bếp."}, {"type": "mcq", "level": "TH", "q": "The bookshelf is ______ the desk. It is very near.", "options": ["A. of", "B. to", "C. next to", "D. at"], "answer": "C", "explain": "Kệ sách ở bên cạnh bàn học — dùng next to (bên cạnh)."}, {"type": "mcq", "level": "TH", "q": "______ is the bathroom? It is upstairs.", "options": ["A. When", "B. What", "C. Who", "D. Where"], "answer": "D", "explain": "Hỏi vị trí dùng Where. Câu trả lời chỉ vị trí: ở trên lầu (upstairs)."}, {"type": "mcq", "level": "VD", "q": "Pick out the word in which the letter 's' sounds different from the others.", "options": ["A. dogs", "B. watches", "C. boxes", "D. houses"], "answer": "A", "explain": "houses, boxes, watches tận cùng bằng âm xì xì nên 'es' đọc là /ɪz/. dogs tận cùng bằng âm hữu thanh nên 's' đọc là /z/."}, {"type": "mcq", "level": "VDC", "q": "A: Your house is very nice! B: ______", "options": ["A. See you.", "B. Thank you.", "C. No problem.", "D. You are welcome."], "answer": "B", "explain": "Khi được khen, đáp lại lịch sự bằng Thank you (Cảm ơn b ain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "The ______ is soft. We sit on it to watch TV.", "options": ["A. sofa", "B. cooker", "C. sink", "D. fridge"], "answer": "A", "explain": "Sofa là ghế sofa mềm, ngồi xem ti-vi."}, {"type": "mcq", "level": "NB", "q": "My books are on the ______.", "options": ["A. pillow", "B. bookshelf", "C. blanket", "D. curtain"], "answer": "B", "explain": "Bookshelf là kệ sách, nơi để sách."}, {"type": "mcq", "level": "TH", "q": "The garden is ______ the house. We cannot see it from the street.", "options": ["A. under", "B. on", "C. behind", "D. in"], "answer": "C", "explain": "Khu vườn ở phía sau ngôi nhà — dùng behind (ở phía sau)."}, {"type": "mcq", "level": "TH", "q": "There ______ some pictures on the wall.", "options": ["A. am", "B. is", "C. be", "D. are"], "answer": "D", "explain": "Danh từ some pictures là số nhiều nên dùng are."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose 's' is pronounced differently from the others.", "options": ["A. cats", "B. dogs", "C. rooms", "D. tables"], "answer": "A", "explain": "dogs, rooms, tables tận cùng bằng âm hữu thanh nên 's' đọc là /z/. cats tận cùng bằng âm vô thanh /t/ nên 's' đọc là /s/."}, {"type": "mcq", "level": "VDC", "q": "Pick out the word whose main stress is placed differently from the others.", "options": ["A. bedroom", "B. behind", "C. kitchen", "D. living room"], "answer": "B", "explain": "living room, bedroom, kitchen nhấn âm đầu. behind nhấn âm thứ hai (beHIND)."}, {"type": "truefalse", "level": "NB", "q": "Read the text and decide whether the statements are true (T) or false (F). This is our living room. There is a grey sofa and two armchairs. A coffee table is in front of the sofa. There is a lamp on the table. The room is warm and cosy.", "statements": ["a) The sofa is grey.", "b) There are three armchairs.", "c) The coffee table is in front of the sofa.", "d) There is a lamp under the table."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: ghế sofa màu xám. b) Sai: chỉ có hai ghế bành (two armchairs). c) Đúng: bàn cà phê ở phía trước ghế sofa. d) Sai: đèn ở trên bàn (on the table)."}, {"type": "truefalse", "level": "TH", "q": "Read the text and decide whether the statements are true (T) or false (F). Tom's flat is small. There is no garden. But there is a balcony. Tom grows flowers on the balcony. He sits there and reads books in the afternoon.", "statements": ["a) Tom's flat is big.", "b) There is a garden in Tom's flat.", "c) Tom grows flowers on the balcony.", "d) Tom reads books on the balcony in the afternoon."], "answer": ["F", "F", "T", "T"], "explain": "a) Sai: căn hộ nhỏ (small). b) Sai: không có vườn (no garden). c) Đúng: Tom trồng hoa trên ban công. d) Đúng: bạn ấy ngồi đó đọc sách vào buổi chiều."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["bedroom", "phòng ngủ"], ["kitchen", "nhà bếp"], ["bathroom", "phòng tắm"], ["living room", "phòng khách"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["The", "sofa", "is", "in", "the", "living", "room"], "points": 1, "explain": "Câu đúng: The sofa is in the living room."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Where is the kitchen? B: It is next to the living room. A: Is there a fridge in the kitchen? B: Yes, there is.", "sub_questions": [{"q": "Where is the kitchen?", "options": ["Next to the living room", "Behind the bedroom", "Under the stairs"], "answer": 0}, {"q": "Is there a fridge in the kitchen?", "options": ["Yes", "No"], "answer": 0}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "The kitchen is next to the living room", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "The ______ is at the top of the house. We keep old things there.", "options": ["A. garage", "B. hall", "C. attic", "D. garden"], "answer": "C", "explain": "Attic là gác mái, ở trên cùng của ngôi nhà, nơi cất đồ cũ."}, {"type": "mcq", "level": "NB", "q": "Grandpa sits in the ______ and reads newspapers.", "options": ["A. cooker", "B. fridge", "C. sink", "D. armchair"], "answer": "D", "explain": "Armchair là ghế bành, ông ngồi đọc báo."}, {"type": "mcq", "level": "TH", "q": "The supermarket is ______ my house. It is across the street.", "options": ["A. in front of", "B. between", "C. in", "D. on"], "answer": "A", "explain": "Siêu thị ở phía trước nhà tôi — dùng in front of (ở phía trước)."}, {"type": "mcq", "level": "TH", "q": "These are ______ toys. They are mine.", "options": ["A. my brother", "B. my brother's", "C. brothers", "D. my brothers"], "answer": "B", "explain": "Sở hữu cách: my brother's toys nghĩa là đồ chơi của anh trai tôi."}, {"type": "mcq", "level": "VD", "q": "Pick the word with a different pronunciation of the final 's'.", "options": ["A. dishes", "B. boxes", "C. lamps", "D. houses"], "answer": "C", "explain": "houses, boxes, dishes tận cùng bằng âm xì xì nên 'es' đọc là /ɪz/. lamps tận cùng bằng âm vô thanh /p/ nên 's' đọc là /s/."}, {"type": "mcq", "level": "VDC", "q": "Which word has a different stress pattern from the others?", "options": ["A. mirror", "B. window", "C. bedroom", "D. upstairs"], "answer": "D", "explain": "window, mirror, bedroom nhấn âm đầu. upstairs nhấn âm thứ hai (upSTAIRS)."}, {"type": "truefalse", "level": "NB", "q": "Read the text and decide whether the statements are true (T) or false (F). My grandma lives in a cottage in the country. The cottage is old but beautiful. There is a kitchen, a bedroom and a small living room. Chickens walk in the garden.", "statements": ["a) Grandma lives in a town house.", "b) The cottage is old but beautiful.", "c) There are two bedrooms in the cottage.", "d) Chickens walk in the garden."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: bà sống trong nhà tranh ở quê (cottage in the country). b) Đúng: ngôi nhà cũ nhưng đẹp. c) Sai: chỉ có một phòng ngủ (a bedroom). d) Đúng: gà đi lại trong vườn."}, {"type": "truefalse", "level": "TH", "q": "Read the text and decide whether the statements are true (T) or false (F). Anna's house is near her school. It takes her ten minutes to walk to school. Her house has a red roof and a blue door. There is a big tree in front of the house.", "statements": ["a) Anna's house is far from her school.", "b) It takes Anna ten minutes to walk to school.", "c) The door of the house is red.", "d) There is a big tree behind the house."], "answer": ["F", "T", "F", "F"], "explain": "a) Sai: nhà gần trường (near her school). b) Đúng: mất mười phút đi bộ tới trường. c) Sai: cửa màu xanh (blue door), mái nhà mới màu đỏ. d) Sai: cây to ở phía trước nhà (in front of the house)."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["bedroom", "phòng ngủ"], ["kitchen", "nhà bếp"], ["bathroom", "phòng tắm"], ["living room", "phòng khách"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["The", "sofa", "is", "in", "the", "living", "room"], "points": 1, "explain": "Câu đúng: The sofa is in the living room."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Where is the kitchen? B: It is next to the living room. A: Is there a fridge in the kitchen? B: Yes, there is.", "sub_questions": [{"q": "Where is the kitchen?", "options": ["Next to the living room", "Behind the bedroom", "Under the stairs"], "answer": 0}, {"q": "Is there a fridge in the kitchen?", "options": ["Yes", "No"], "answer": 0}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "The kitchen is next to the
