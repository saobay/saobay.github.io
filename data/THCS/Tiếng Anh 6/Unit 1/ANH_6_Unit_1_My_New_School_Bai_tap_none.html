 She gets up at 5:30 every morning. She goes to school by motorbike. She teaches three classes a day. In the evening she prepares lessons for the next day.", "statements": ["a) Mrs Lan is an English teacher.", "b) She gets up at 6:30 every morning.", "c) She goes to school by motorbike.", "d) She teaches three classes a day."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: cô dậy lúc 5:30. c) Đúng. d) Đúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["school", "trường học"], ["teacher", "giáo viên"], ["student", "học sinh"], ["classmate", "bạn cùng lớp"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["My", "new", "school", "is", "very", "big"], "points": 1, "explain": "Câu đúng: My new school is very big."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Hello! What is your name? B: Hi! My name is Nam. A: Which class are you in? B: I am in class 6A.", "sub_questions": [{"q": "What is the boy's name?", "options": ["Nam", "Lan", "Minh"], "answer": 0}, {"q": "Which class is he in?", "options": ["6A", "6B", "6C"], "answer": 0}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "My new school is very big", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. ruler", "B. notebook", "C. eraser", "D. pencil"], "answer": "C", "explain": "eraser có trọng âm rơi vào âm tiết thứ hai (eRAser), các từ còn lại trọng âm rơi vào âm tiết đầu."}, {"type": "mcq", "level": "NB", "q": "I ___ my new school. The teachers are very kind.", "options": ["A. liking", "B. likes", "C. to like", "D. like"], "answer": "D", "explain": "Chủ ngữ 'I' nên động từ giữ ng tember.", "b) Students sing and dance at the festival.", "c) Teachers do not join the festival.", "d) The festival finishes at 9 o'clock in the evening."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: giáo viên cũng tham gia trò chơi. d) Đúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["school", "trường học"], ["teacher", "giáo viên"], ["student", "học sinh"], ["classmate", "bạn cùng lớp"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["My", "new", "school", "is", "very", "big"], "points": 1, "explain": "Câu đúng: My new school is very big."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Hello! What is your name? B: Hi! My name is Nam. A: Which class are you in? B: I am in class 6A.", "sub_questions": [{"q": "What is the boy's name?", "options": ["Nam", "Lan", "Minh"], "answer": 0}, {"q": "Which class is he in?", "options": ["6A", "6B", "6C"], "answer": 0}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "My new school is very big", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "We learn to draw pictures in ___ lesson.", "options": ["A. Art", "B. PE", "C. Maths", "D. Music"], "answer": "A", "explain": "Art (Mỹ thuật) hợp nghĩa: chúng tôi học vẽ tranh trong tiết Mỹ thuật."}, {"type": "mcq", "level": "NB", "q": "My best friend ___ in the same class as me.", "options": ["A. are", "B. is", "C. be", "D. am"], "answer": "B", "explain": "Chủ ngữ 'My best friend' là số ít nên dùng 'is'."}, {"type": "mcq", "level": "NB", "q": "Please ___ your hand before you speak in class.", "options": ["A. run", "B. rise", "C. raise", "D. read"], "answer": "C", "explain": "raise your hand (giơ tay) là cụm từ đúng trong lớp học."}, {"type": "mcq", "level": "TH", "q": "Our teacher always ___ us interesting stories.", "options": ["A. tell", "B. telling", "C. to tell", "D. tells"], "answer": "D", "explain": "Chủ ngữ 'Our teacher' là ngôi thứ ba số ít nên động từ thêm 's': tells."}, {"type": "mcq", "level": "TH", "q": "Thank you very much! - ___", "options": ["A. You are welcome", "B. See you", "C. Good luck", "D. Goodbye"], "answer": "A", "explain": "Đáp lại lời cảm ơn dùng 'You are welcome' (không có gì)."}, {"type": "mcq", "level": "VD", "q": "Every student in my class ___ a new uniform.", "options": ["A. having", "B. has", "C. have", "D. to have"], "answer": "B", "explain": "Chủ ngữ 'Every student' là số ít nên dùng 'has'."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). The school canteen is behind the library. It sells rice, noodles and bread. Many students have lunch there. The food is cheap and delicious.", "statements": ["a) The school canteen is behind the library.", "b) It sells rice, noodles and bread.", "c) Students have lunch at home.", "d) The food is cheap and delicious."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: học sinh ăn trưa ở căng tin. d) Đúng."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last Sunday our class went on a school trip. We visited a beautiful village near our town. We played games and had a picnic there. We came back to school at 4 o'clock. It was a wonderful day.", "statements": ["a) The class went on a school trip last Sunday.", "b) They visited a village far from their town.", "c) They had a picnic there.", "d) They came back at 5 o'clock."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: ngôi làng gần thị trấn. c) Đúng. d) Sai: về trường lúc 4 giờ."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["school", "trường học"], ["teac
