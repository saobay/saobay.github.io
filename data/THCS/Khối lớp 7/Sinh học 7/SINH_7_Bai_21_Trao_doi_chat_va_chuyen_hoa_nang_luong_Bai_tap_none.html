a thức ăn","C. Từ nước uống","D. Từ quần áo"],"answer":"B","explain":"Năng lượng trong thức ăn có nguồn gốc từ quang năng qua quang hợp.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về trao đổi chất.","statements":["a) Trao đổi chất gồm lấy chất vào, biến đổi và thải chất ra.","b) Mọi sinh vật đều trao đổi chất với môi trường.","c) Sinh vật chỉ lấy chất vào mà không thải ra.","d) Trao đổi chất ngừng thì sinh vật chết."],"answer":["T","T","F","T"],"explain":"Sinh vật vừa lấy chất vào vừa thải chất ra; ngừng trao đổi chất thì chết.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về chuyển hóa năng lượng.","statements":["a) Chuyển hóa năng lượng là biến đổi năng lượng từ dạng này sang dạng khác.","b) Quang hợp biến đổi quang năng thành hóa năng.","c) Năng lượng có thể tự sinh ra từ hư không.","d) ATP là dạng tích trữ năng lượng dùng cho hoạt động sống."],"answer":["T","T","F","T"],"explain":"Năng lượng không tự sinh ra; nó chỉ chuyển từ dạng này sang dạng khác.","points":1},{"type":"short","level":"NB","q":"Quá trình cơ thể lấy chất từ môi trường, biến đổi rồi thải chất không cần thiết gọi là gì?","answer":"Trao đổi chất","explain":"Đó là quá trình trao đổi chất.","points":0.5},{"type":"short","level":"VD","q":"Trong quang hợp, quang năng được chuyển thành dạng năng lượng nào?","answer":"Hóa năng","explain":"Quang năng chuyển thành hóa năng trong chất hữu cơ.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Sinh vật thải ra môi trường những gì trong trao đổi chất?","options":["A. Chỉ thải nước","B. Các chất không cần thiết, chất thải","C. Chỉ thải khí oxygen","D. Không thải gì"],"answer":"B","explain":"Cơ thể thải các chất không cần thiết ra môi trường.","points":0.25},{"type":"mcq","level":"NB","q":"Quá trình nào biến đổi quang năng thành hóa năng?","options":["A. Hô hấp tế bào","B. Quang hợp","C. Tiêu hóa","D. Bài tiết"],"answer":"B","explain":"Quang hợp biến đổi quang năng thành hóa năng.","points":0.25},{"type":"mcq","level":"TH","q":"Hô hấp tế bào có vai trò gì đối với chuyển hóa năng lượng?","options":["A. Tích lũy quang năng","B. Giải phóng năng lượng trong chất hữu cơ để cơ thể sử dụng","C. Tạo ra ánh sáng","D. Ngừng trao đổi chất"],"answer":"B","explain":"Hô hấp tế bào giải phóng năng lượng từ chất hữu cơ.","points":0.25},{"type":"mcq","level":"TH","q":"Điều gì xảy ra nếu quá trình trao đổi chất ở sinh vật ngừng lại?","options":["A. Sinh vật ngủ đông","B. Sinh vật sẽ chết","C. Sinh vật lớn nhanh hơn","D. Không có gì xảy ra"],"answer":"B","explain":"Trao đổi chất ngừng thì sinh vật không còn duy trì sự sống.","points":0.25},{"type":"mcq","level":"VD","q":"Cây xanh thải khí oxygen ra môi trường. Khí này có nguồn gốc từ quá trình nào?","options":["A. Hô hấp tế bào","B. Quang hợp","C. Thoát hơi nước","D. Hút nước"],"answer":"B","explain":"Oxygen là sản phẩm của quang hợp ở cây xanh.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao khi lao động nặng, cơ thể toát mồ hôi và thở gấp?","options":["A. Để làm mát cơ thể","B. Trao đổi chất tăng mạnh: cần nhiều O2, thải nhiều CO2 và nhiệt","C. Để uống nước","D. Để nghỉ ngơi"],"answer":"B","explain":"Hoạt động mạnh làm tăng trao đổi chất và chuyển hóa năng lượng.","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định về vai trò của trao đổi chất.","statements":["a) Trao đổi chất cung cấp nguyên liệu cấu tạo cơ thể.","b) Trao đổi chất cung cấp năng lượng cho hoạt động sống.","c) Trao đổi chất giúp thải chất độc ra ngoài.","d) Trao đổi chất chỉ cần thiết với động vật."],"answer":["T","T","T","F"],"explain":"Mọi sinh vật, kể cả thực vật, đều cần trao đổi chất.","points":1},{"type":"truefalse","level":"VDC","q":"Đánh giá các nhận định khái quát.","statements":["a) Ánh sáng Mặt Trời là nguồn năng lượng đầu vào chủ yếu của sinh giới.","b) Nếu không có ánh sáng, mọi sinh vật đều chết ngay lập tức.","c) Hô hấp tế bào giải phóng năng lượng từ chất hữu cơ.","d) Trao đổi chất và chuyển hóa năng lượng luôn đi kèm nhau."],"answer":["T","F","T","T"],"explain":"Một số sinh vật sống được nhờ năng lượng hóa học, nhưng ánh sáng là nguồn chủ yếu.","points":1},{"type":"short","level":"TH","q":"Phân tử được ví như đồng tiền năng lượng của tế bào là gì?","answer":"ATP","explain":"ATP tích trữ và cung cấp năng lượng.","points":0.5},{"type":"short","level":"VDC","q":"Nguồn năng lượng đầu vào chủ yếu của hầu hết sinh giới là gì?","answer":"Ánh sáng Mặt Trời","explain":"Mọi chuỗi thức ăn đều bắt đầu từ năng lượng Mặt Trời.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Nguyên liệu cây xanh lấy từ môi trường để quang hợp gồm những gì?","options":["A. Đất và đá","B. Nước, muối khoáng, khí carbon dioxide và ánh sáng","C. Chỉ cần ánh sáng","D. Chỉ cần không khí"],"answer":"B","explain":"Cây lấy nước, muối khoáng, CO2 và dùng ánh sáng để quang hợp.","points":0.25},{"type":"mcq","level":"NB","q":"Năng lượng trong thức ăn của động vật có nguồn gốc từ đâu?","options":["A. Từ đất","B. Từ thực vật quang hợp, cuối cùng từ ánh sáng Mặt Trời","C. Từ nước","D. Từ không khí"],"answer":"B","explain":"Chuỗi thức ăn bắt đầu từ thực vật quang hợp nhờ ánh sáng Mặt Trời.","points":0.25},{"type":"mcq","level":"TH","q":"Trao đổi chất và chuyển hóa năng lượng có mối quan hệ với nhau như thế nào?","options":["A. Hoàn toàn độc lập","B. Luôn đi kèm nhau: trao đổi chất gắn với biến đổi năng lượng","C. Chỉ gặp ở thực vật","D. Chỉ gặp ở động vật"],"answer":"B","explain":"Hai quá trình luôn đi kèm nhau trong mọi hoạt động sống.","points":0.25},{"type":"mcq","level":"TH","q":"ATP cung cấp năng lượng cho hoạt động nào sau đây?","options":["A. Vận động của cơ","B. Quang hợp tạo chất hữu cơ","C. Hô hấp lấy O2","D. Cả vận động, sinh trưởng, sinh sản"],"answer":"D","explain":"ATP chi trả năng lượng cho mọi hoạt động sống.","points":0.25},{"type":"mcq","level":"VD","q":"Người ta nói cơ thể như một nhà máy hóa chất. Cách nói này nhấn mạnh đặc điểm nào?","options":["A. Cơ thể sản xuất hàng hóa","B. Cơ thể không ngừng biến đổi các chất kèm theo biến đổi năng lượng","C. Cơ thể gây ô nhiễm","D. Cơ thể chỉ tiêu thụ"],"answer":"B","explain":"Cơ thể liên tục biến đổi chất và năng lượng như một nhà máy.","points":0.25},{"type":"mcq","level":"VDC","q":"Khi trời lạnh, động vật hằng nhiệt run lên và ăn nhiều hơn. Giải thích nào đúng?","options":["A. Để giải trí","B. Tăng chuyển hóa năng lượng để sinh nhiệt giữ ấm cơ thể","C. Để giảm cân","D. Để ngủ ngon"],"answer":"B","explain":"Run và ăn nhiều giúp tăng giải phóng năng lượng giữ thân nhiệt.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về quang hợp và hô hấp.","statements":["a) Quang hợp thải khí oxygen ra môi trường.","b) Hô hấp lấy khí oxygen từ môi trường.","c) Cây xanh chỉ quang hợp mà không hô hấp.","d) Động vật không quang hợp."],"answer":["T","T","F","T"],"explain":"Cây xanh vừa quang hợp vừa hô hấp.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về nguồn năng lượng.","statements":["a) Năng lượng trong thức ăn có nguồn gốc từ ánh sáng Mặt Trời.","b) Động vật ăn thịt gián tiếp dùng năng lượng từ thực vật.","c) Than đá, dầu mỏ có nguồn gốc từ sinh vật cổ.","d) Năng lượng có thể tạo ra từ hư không."],"answer":["T","T","T","F"],"explain":"Năng lượng không tự sinh ra từ hư không.","points":1},{"type":"short","level":"NB","q":"Sản phẩm khí mà cây xanh thải ra khi quang hợp là gì?","answer":"Oxygen","explain":"Quang hợp thải khí O2.","points":0.5},{"type":"short","level":"VD","q":"Vì sao bón phân giúp cây sinh trưởng tốt?","answer":"Cung cấp muối khoáng","explain":"Muối khoáng là nguyên liệu cho trao đổi chất của cây.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Chất nào sau đây là sản phẩm thải của cơ thể người?","options":["A. Glucose","B. Khí carbon dioxide, mồ hôi, nước tiểu","C. Protein","D. Vitamin"],"answer":"B","explain":"CO2, mồ hôi, nước tiểu là chất thải của cơ thể.","points":0.25},{"type":"mcq","level":"NB","q":"Quá trình nào giúp cơ thể có nguyên liệu để lớn lên?","options":["A. Bài tiết","B. Trao đổi chất lấy chất dinh dưỡng từ môi trường","C. Ngủ","D. Vận động"],"answer":"B","explain":"Trao đổi chất cung cấp nguyên liệu cấu tạo cơ thể.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cây trồng trong nhà kính vẫn cần ánh sáng?","options":["A. Để trang trí","B. Để thực hiện quang hợp, chuyển quang năng thành hóa năng","C. Để sưởi ấm","D. Để đuổi côn trùng"],"answer":"B","explain":"Không có ánh sáng, cây không quang hợp được.","points":0.25},{"type":"mcq","level":"TH","q":"Khi nhịn ăn lâu ngày, cơ thể gầy đi vì sao?","options":["A. Cơ thể mất nước","B. Cơ thể phải phân giải chất dự trữ để lấy năng lượng duy trì trao đổi chất","C. Cơ thể ngừng hô hấp","D. Cơ thể không cần năng lượng"],"answer":"B","explain":"Thiếu thức ăn, cơ thể dùng chất dự trữ để duy trì sự sống.","points":0.25},{"type":"mcq","level":"VD","q":"So sánh trao đổi chất ở cây xanh và con người, điểm giống nhau cơ bản là gì?","options":["A. Đều quang hợp","B. Đều lấy chất từ môi trường, biến đổi và thải chất không cần","C. Đều không cần nước","D. Đều thải oxygen"],"answer":"B","explain":"Mọi sinh vật đều trao đổi chất với môi trường.","points":0.25},{"type":"mcq","level":"VDC","q":"Một khu rừng bị chặt phá hết cây xanh. Điều gì sẽ xảy ra với dòng năng lượng của hệ sinh thái đó?","options":["A. Không ảnh hưởng","B. Mất nguồn chuyển quang năng thành hóa năng, chuỗi thức ăn sụp đổ","C. Năng lượng tăng lên","D. Động vật tự quang hợp"],"answer":"B","explain":"Cây xanh là khâu chuyển năng lượng Mặt Trời vào hệ sinh thái.","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định về ATP.","statements":["a) ATP được ví như đồng tiền năng lượng của tế bào.","b) Mọi hoạt động sống đều cần năng lượng từ ATP.","c) ATP chỉ có ở tế bào động vật.","d) Vận động cơ bắp tiêu tốn ATP."],"answer":["T","T","F","T"],"explain":"ATP có ở mọi tế bào sống.","points":1},{"type":"truefalse á rừng ảnh hưởng dòng năng lượng của hệ sinh thái.","c) Sinh vật dưới đáy biển sâu hoàn toàn không cần năng lượng.","d) Bảo vệ cây xanh là bảo vệ nguồn sống."],"answer":["T","T","F","T"],"explain":"Sinh vật đáy biển dùng năng lượng hóa học từ các miệng phun.","points":1},{"type":"short","level":"TH","q":"Động vật thuộc nhóm dinh dưỡng nào?","answer":"Dị dưỡng","explain":"Động vật lấy chất hữu cơ từ thức ăn.","points":0.5},{"type":"short","level":"VDC","q":"Một phần năng lượng giải phóng trong hô hấp tỏa ra môi trường dưới dạng nào?","answer":"Nhiệt năng","explain":"Năng lượng dư thừa tỏa ra dưới dạng nhiệt.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Chất hữu cơ trong cơ thể sinh vật được tạo ra chủ yếu nhờ quá trình nào?","options":["A. Hô hấp","B. Quang hợp ở thực vật","C. Bài tiết","D. Vận động"],"answer":"B","explain":"Quang hợp tổng hợp chất hữu cơ nuôi sống sinh giới.","points":0.25},{"type":"mcq","level":"NB","q":"Sinh vật nào sau đây tự tổng hợp được chất hữu cơ?","options":["A. Con người","B. Cây xanh","C. Con mèo","D. Con cá"],"answer":"B","explain":"Cây xanh tự tổng hợp chất hữu cơ nhờ quang hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Động vật lấy chất hữu cơ từ đâu?","options":["A. Tự quang hợp","B. Từ thức ăn là thực vật hoặc động vật khác","C. Từ không khí","D. Từ nước"],"answer":"B","explain":"Động vật là sinh vật dị dưỡng, lấy chất hữu cơ từ thức ăn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải tưới nước cho cây?","options":["A. Để cây mát","B. Nước là nguyên liệu trao đổi chất và dung môi các phản ứng","C. Để rửa lá","D. Để diệt sâu"],"answer":"B","explain":"Nước tham gia trực tiếp vào trao đổi chất của cây.","points":0.25},{"type":"mcq","level":"VD","q":"Người ta ủ phân hữu cơ để bón cho cây. Việc này liên quan đến trao đổi chất như thế nào?","options":["A. Không liên quan","B. Phân hủy tạo muối khoáng cung cấp nguyên liệu cho cây","C. Làm đất nóng","D. Diệt vi khuẩn"],"answer":"B","explain":"Phân hữu cơ phân hủy thành muối khoáng cây hấp thụ được.","points":0.25},{"type":"mcq","level":"VDC","q":"Một người ăn kiêng giảm cân nhưng vẫn khỏe mạnh. Về mặt năng lượng, điều gì đang xảy ra?","options":["A. Cơ thể tạo năng lượng từ hư không","B. Cơ thể phân giải mỡ dự trữ để bù năng lượng thiếu hụt từ thức ăn","C. Cơ thể ngừng trao đổi chất","D. Cơ thể không cần năng lượng"],"answer":"B","explain":"Thiếu năng lượng ăn vào, cơ thể dùng năng lượng dự trữ.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định cơ bản.","statements":["a) Ăn uống là một biểu hiện của trao đổi chất.","b) Hô hấp là một biểu hiện của trao đổi chất.","c) Bài tiết là một biểu hiện của trao đổi chất.","d) Tảng đá cũng trao đổi chất."],"answer":["T","T","T","F"],"explain":"Vật vô sinh không trao đổi chất.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về thực tiễn.","statements":["a) Tưới nước giúp cây trao đổi chất thuận lợi.","b) Trồng cây trong nhà kính cần đảm bảo ánh sáng.","c) Cây héo do thiếu nguyên liệu cho trao đổi chất.","d) Bón quá nhiều phân luôn tốt cho cây."],"answer":["T","T","T","F"],"explain":"Bón quá nhiều phân có thể gây hại cho cây.","points":1},{"type":"short","level":"NB","q":"Chất khí cây xanh lấy từ không khí để quang hợp là gì?","answer":"Carbon dioxide","explain":"Cây lấy khí CO2 qua khí khổng.","points":0.5},{"type":"short","level":"VD","q":"Vì sao trẻ em tuổi lớn cần ăn đầy đủ?","answer":"Cần nguyên liệu sinh trưởng","explain":"Sinh trưởng cần nhiều nguyên liệu và năng lượng.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Khí carbon dioxide cây xanh dùng để quang hợp lấy từ đâu?","options":["A. Từ đất","B. Từ không khí","C. Từ nước","D. Từ phân bón"],"answer":"B","explain":"Cây lấy CO2 từ không khí qua khí khổng.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm khí của quang hợp thải ra môi trường là gì?","options":["A. Carbon dioxide","B. Oxygen","C. Nitrogen","D. Hơi nước"],"answer":"B","explain":"Quang hợp thải khí O2 ra môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa quang hợp và hô hấp tế bào là gì?","options":["A. Không liên quan","B. Hai quá trình ngược nhau, bổ sung cho nhau trong trao đổi chất","C. Giống hệt nhau","D. Chỉ diễn ra ở động vật"],"answer":"B","explain":"Quang hợp tổng hợp, hô hấp phân giải; chúng liên quan chặt chẽ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao rừng được gọi là lá phổi xanh của Trái Đất?","options":["A. Vì rừng màu xanh","B. Rừng quang hợp thải O2, hấp thụ CO2 điều hòa không khí","C. Vì rừng to lớn","D. Vì rừng có nhiều động vật"],"answer":"B","explain":"Quang hợp của rừng cung cấp O2 và hấp thụ CO2.","points":0.25},{"type":"mcq","level":"VD","q":"Trồng nhiều cây xanh trong thành phố giúp ích gì cho trao đổi chất của con người?","options":["A. Không giúp gì","B. Cây cung cấp O2, hấp thụ CO2 làm không khí trong lành cho hô hấp","C. Cây che nắng","D. Cây làm đẹp"],"answer":"B","explain":"Cây xanh cải thiện chất lượng không khí cho hô hấp.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong nhà kính trồng rau, người ta đôi khi tăng nồng độ CO2. Mục đích là gì?","options":["A. Để đuổi sâu","B. Tăng nguyên liệu cho quang hợp, tăng năng suất","C. Để sưởi ấm","D. Để tạo mưa"],"answer":"B","explain":"CO2 là nguyên liệu quang hợp; tăng CO2 giúp cây quang hợp mạnh hơn.","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định về nhu cầu năng lượng.","statements":["a) Trẻ em tuổi lớn cần nhiều chất dinh dưỡng.","b) Người lao động nặng cần nhiều năng lượng hơn người ít vận động.","c) Khi sốt, cơ thể tiêu tốn nhiều năng lượng hơn.","d) Nhu cầu năng lượng của mọi người đều như nhau."],"answer":["T","T","T","F"],"explain":"Nhu cầu năng lượng phụ thuộc tuổi, hoạt động, tình trạng sức khỏe.","points":1},{"type":"truefalse","level":"VDC","q":"Đánh giá các nhận định tổng hợp.","statements":["a) Sinh trưởng cần nguyên liệu từ trao đổi chất.","b) Sinh sản cần năng lượng từ chuyển hóa năng lượng.","c) Cảm ứng không liên quan đến năng lượng.","d) Mọi hoạt động sống đều cần trao đổi chất."],"answer":["T","T","F","T"],"explain":"Cảm ứng cũng cần năng lượng để thực hiện phản ứng.","points":1},{"type":"short","level":"TH","q":"Quá trình phân giải chất hữu cơ để giải phóng năng lượng gọi là gì?","answer":"Hô hấp tế bào","explain":"Hô hấp tế bào giải phóng năng lượng từ chất hữu cơ.","points":0.5},{"type":"short","level":"VDC","q":"Rừng được ví như lá phổi xanh vì vai trò nào?","answer":"Cung cấp O2","explain":"Rừng quang hợp thải O2, hấp thụ CO2.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Năng lượng cần cho mọi hoạt động sống của sinh vật có nguồn gốc chủ yếu từ đâu?","options":["A. Từ đất","B. Từ ánh sáng Mặt Trời qua quang hợp","C. Từ gió","D. Từ sấm sét"],"answer":"B","explain":"Nguồn năng lượng chủ yếu của sinh giới là ánh sáng Mặt Trời.","points":0.25},{"type":"mcq","level":"NB","q":"Quá trình nào sau đây thuộc trao đổi chất?","options":["A. Đọc sách","B. Tiêu hóa thức ăn","C. Ngủ mơ","D. Suy nghĩ"],"answer":"B","explain":"Tiêu hóa là một khâu của trao đổi chất.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao sau khi ăn no, cơ thể cảm thấy ấm lên?","options":["A. Do thức ăn nóng","B. Chuyển hóa thức ăn giải phóng năng lượng, một phần thành nhiệt","C. Do uống nước","D. Do mặc ấm"],"answer":"B","explain":"Tiêu hóa và chuyển hóa thức ăn tỏa nhiệt.","points":0.25},{"type":"mcq","level":"TH","q":"Cây héo khi thiếu nước lâu ngày vì sao?","options":["A. Cây buồn","B. Thiếu nguyên liệu và dung môi cho trao đổi chất, tế bào mất sức trương","C. Cây già","D. Cây thiếu ánh sáng"],"answer":"B","explain":"Nước cần cho mọi hoạt động trao đổi chất của cây.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao người ta khuyên không nên nhịn ăn sáng?","options":["A. Để vui vẻ","B. Bữa sáng cung cấp năng lượng khởi động trao đổi chất sau một đêm dài","C. Để tăng cân","D. Để đỡ tốn tiền"],"answer":"B","explain":"Sau đêm dài, cơ thể cần năng lượng để duy trì hoạt động.","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh một người lao động chân tay và một người làm việc văn phòng, ai cần nhiều năng lượng hơn và vì sao?","options":["A. Người văn phòng","B. Người lao động chân tay vì vận động cơ bắp tiêu tốn nhiều ATP hơn","C. Như nhau","D. Không xác định được"],"answer":"B","explain":"Hoạt động cơ bắp mạnh tiêu tốn nhiều năng lượng hơn.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về khí.","statements":["a) Cây lấy CO2 từ không khí để quang hợp.","b) Người hít O2 và thở ra CO2.","c) Oxygen là sản phẩm của quang hợp.","d) Thực vật không cần oxygen."],"answer":["T","T","T","F"],"explain":"Thực vật cũng hô hấp nên cần O2.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về chuỗi thức ăn.","statements":["a) Cây xanh là sinh vật sản xuất trong chuỗi thức ăn.","b) Động vật ăn cỏ lấy năng lượng gián tiếp từ Mặt Trời.","c) Mất cây xanh, chuỗi thức ăn bị đe dọa.","d) Động vật ăn thịt không phụ thuộc vào thực vật."],"answer":["T","T","T","F"],"explain":"Mọi mắt xích đều phụ thuộc vào sinh vật sản xuất.","points":1},{"type":"short","level":"NB","q":"Chất thải dạng lỏng của cơ thể người gồm những gì?","answer":"Mồ hôi và nước tiểu","explain":"Mồ hôi và nước tiểu chứa chất thải.","points":0.5},{"type":"short","level":"VD","q":"Vì sao sau khi ăn, cơ thể thấy ấm lên?","answer":"Tỏa nhiệt","explain":"Chuyển hóa thức ăn giải phóng năng lượng, một phần thành nhiệt.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Đâu không phải là biểu hiện của trao đổi chất?","options":["A. Hô hấp","B. Bài tiết","C. Quang hợp","D. Tảng đá mòn dần"],"answer":"D","explain":"Tảng đá mòn là hiện tượng vật lí, không phải trao đổi chất.","points":0.25},{"type":"mcq","level":"NB","q":"Sinh vật lấy chất dinh dưỡng chủ yếu qua con đường nào?","options":["A. Qua da","B. Ăn uống, hấp thụ từ môi trường","C. Qua lông","D. Qua móng"],"answer":"B","explain":"Sinh vật lấy chất dinh dưỡng qua ăn uống và hấp thụ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao động vật phải thường xuyên tìm kiếm thức ăn?","options":["A. Để vui chơi","B. Để bổ sung nguyên liệu và năng lượng cho trao đổi chất liên tục","C. Để dự trữ","D. Để tránh kẻ thù"],"answer":"B","explain":"Trao đổi chất diễn ra liên tục nên cần bổ sung thường xuyên.","points":0.25},{"type":"mcq","level":"TH","q":"Cây xanh được xếp vào nhóm sinh vật nào về dinh dưỡng?","options":["A. Dị dưỡng","B. Tự dưỡng","C. Hoại sinh","D. Kí sinh"],"answer":"B","explain":"Cây xanh tự tổng hợp chất hữu cơ nên là sinh vật tự dưỡng.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao không thể ăn một bữa thật no cho cả tuần?","options":["A. Dạ dày nhỏ","B. Trao đổi chất diễn ra liên tục, cần bổ sung thường xuyên","C. Thức ăn đắt","D. Không thích"],"answer":"B","explain":"Trao đổi chất liên tục nên cần ăn thường xuyên.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao du hành vũ trụ cần hệ thống tái tạo không khí, nước?","options":["A. Để vui","B. Duy trì trao đổi chất trong môi trường kín","C. Để thí nghiệm","D. Để trang trí"],"answer":"B","explain":"Môi trường kín không có nguồn cung tự nhiên.","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định về nước.","statements":["a) Nước là dung môi của các phản ứng trong tế bào.","b) Nước tham gia vận chuyển chất trong cơ thể.","c) Thiếu nước làm rối loạn trao đổi chất.","d) Sinh vật sa mạc không cần nước."],"answer":["T","T","T","F"],"explain":"Sinh vật sa mạc vẫn cần nước, chỉ là dùng tiết kiệm.","points":1},{"type":"truefalse","level":"VDC","q":"Đánh giá các nhận định nâng cao.","statements":["a) Ủ phân hữu cơ tạo muối khoáng cho cây hấp thụ.","b) Ăn kiêng buộc cơ thể phân giải mỡ dự trữ.","c) Năng lượng không tự nhiên sinh ra hay mất đi.","d) Sinh vật có thể tạo năng lượng từ hư không."],"answer":["T","T","T","F"],"explain":"Năng lượng chỉ chuyển hóa, không tự sinh ra.","points":1},{"type":"short","level":"TH","q":"Nước có vai trò gì trong trao đổi chất?","answer":"Dung môi","explain":"Nước là dung môi và tham gia vận chuyển chất.","points":0.5},{"type":"short","level":"VDC","q":"Nếu mất toàn bộ cây xanh, chuỗi thức ăn sẽ ra sao?","answer":"Sụp đổ","explain":"Mất nguồn năng lượng đầu vào, chuỗi thức ăn sụp đổ.","points":0.5}]}]}</script>
