ang hợp chủ yếu.","d) Thân cây cũng quang hợp được ở một số loài."],"answer":["T","F","F","T"],"explain":"Một số thân xanh cũng quang hợp được.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về chăm sóc cây.","statements":["a) Tưới đủ nước giúp quang hợp thuận lợi.","b) Bón đạm giúp lá xanh, tăng quang hợp.","c) Để cây cảnh nơi thiếu sáng lâu ngày cây sẽ vàng úa.","d) Càng bón nhiều phân càng tốt."],"answer":["T","T","T","F"],"explain":"Bón quá nhiều phân gây hại cho cây.","points":1},{"type":"short","level":"NB","q":"Quang hợp biến đổi quang năng thành dạng năng lượng nào?","answer":"Hóa năng","explain":"Quang năng thành hóa năng.","points":0.5},{"type":"short","level":"VD","q":"Vì sao trồng cây quá dày làm giảm năng suất?","answer":"Thiếu ánh sáng","explain":"Cây che bóng lẫn nhau, quang hợp kém.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Khí O2 thải ra từ quang hợp có ý nghĩa gì?","options":["A. Gây ô nhiễm","B. Duy trì sự hô hấp của sinh vật","C. Không có ý nghĩa","D. Làm nóng khí hậu"],"answer":"B","explain":"O2 cần cho hô hấp của hầu hết sinh vật.","points":0.25},{"type":"mcq","level":"NB","q":"CO2 trong không khí giảm nhờ quá trình nào của cây?","options":["A. Hô hấp","B. Quang hợp hấp thụ CO2","C. Thoát hơi nước","D. Hút nước"],"answer":"B","explain":"Quang hợp hấp thụ CO2.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa quang hợp của cây và hô hấp của động vật là gì?","options":["A. Không liên quan","B. Cây thải O2 cho động vật thở, động vật thải CO2 cho cây quang hợp","C. Cạnh tranh","D. Giống nhau"],"answer":"B","explain":"Hai quá trình bổ sung cho nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cần bảo vệ rừng?","options":["A. Để lấy gỗ","B. Rừng quang hợp điều hòa O2, CO2 và chống biến đổi khí hậu","C. Để du lịch","D. Để săn bắn"],"answer":"B","explain":"Rừng có vai trò sinh thái to lớn.","points":0.25},{"type":"mcq","level":"VD","q":"Đốt rừng làm nương rẫy gây hạ  Bài tiết","D. Vận động"],"answer":"B","explain":"Quang hợp tổng hợp chất hữu cơ từ chất vô cơ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao lá cây thường có màu xanh?","options":["A. Do nước","B. Do diệp lục","C. Do ánh sáng","D. Do CO2"],"answer":"B","explain":"Diệp lục tạo màu xanh cho lá.","points":0.25},{"type":"mcq","level":"TH","q":"Lá non mới nhú thường có màu nhạt vì sao?","options":["A. Thiếu nước","B. Diệp lục chưa hình thành đầy đủ","C. Thiếu CO2","D. Bị bệnh"],"answer":"B","explain":"Diệp lục cần ánh sáng để hình thành đầy đủ.","points":0.25},{"type":"mcq","level":"VD","q":"Rau trồng dưới ánh đèn led chuyên dụng vẫn xanh tốt vì sao?","options":["A. Đèn đẹp","B. Ánh sáng nhân tạo cung cấp năng lượng cho quang hợp","C. Đèn sưởi ấm","D. Đèn diệt sâu"],"answer":"B","explain":"Cây chỉ cần ánh sáng phù hợp, không nhất thiết là nắng.","points":0.25},{"type":"mcq","level":"VDC","q":"Trên tàu vũ trụ, người ta trồng cây trong khoang kín. Vai trò của cây là gì?","options":["A. Trang trí","B. Quang hợp tái tạo O2 và hấp thụ CO2 cho phi hành gia","C. Làm mát","D. Giải trí"],"answer":"B","explain":"Cây giúp tái tạo không khí trong môi trường kín.","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định về sản phẩm.","statements":["a) Đường là sản phẩm đầu tiên của quang hợp.","b) Đường được chuyển thành tinh bột dự trữ.","c) Tinh bột dự trữ trong củ, hạt, quả.","d) Quang hợp tạo ra protein trực tiếp."],"answer":["T","T","T","F"],"explain":"Quang hợp tạo đường trước, protein tổng hợp sau.","points":1},{"type":"truefalse","level":"VD","q":"Đánh giá các nhận định về khí khổng.","statements":["a) Khí khổng đóng mở điều tiết thoát hơi nước.","b) Trưa nắng gắt khí khổng khép lại.","c) Khí khổng khép làm giảm CO2 vào lá.","d) Khí khổng luôn mở to cả ngày."],"answer":["T","T","T","F"],"explain":"Khí khổng đóng mở linh hoạt theo điều kiện.","points":1},{"type":"short","level":"NB","q":"Than đá có nguồn gốc năng lượng từ đâu?","answer":"Quang hợp","explain":"Than đá là năng lượng quang hợp tích lũy.","points":0.5},{"type":"short","level":"VD","q":"Thí nghiệm che lá bằng giấy đen chứng minh điều gì?","answer":"Cần ánh sáng","explain":"Chứng minh quang hợp cần ánh sáng.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Bộ phận nào của lá chứa nhiều lục lạp nhất?","options":["A. Gân lá","B. Tế bào thịt lá","C. Khí khổng","D. Biểu bì"],"answer":"B","explain":"Tế bào thịt lá chứa nhiều lục lạp.","points":0.25},{"type":"mcq","level":"NB","q":"Quang hợp tạo ra chất hữu cơ nuôi sống đối tượng nào?","options":["A. Chỉ nuôi cây","B. Cây và mọi sinh vật dị dưỡng","C. Chỉ nuôi người","D. Không nuôi ai"],"answer":"B","explain":"Chất hữu cơ nuôi toàn bộ sinh giới.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không nên để cây cảnh trong phòng ngủ kín ban đêm?","options":["A. Cây sợ tối","B. Ban đêm cây hô hấp thải CO2, cạnh tranh O2","C. Cây cần ánh sáng","D. Cây thải độc"],"answer":"B","explain":"Ban đêm cây chỉ hô hấp, làm giảm O2 trong phòng kín.","points":0.25},{"type":"mcq","level":"TH","q":"Cây xanh và con người trao đổi khí với nhau như thế nào?","options":["A. Không trao đổi","B. Cây thải O2 người hít vào, người thải CO2 cây dùng quang hợp","C. Cạnh tranh O2","D. Giống nhau"],"answer":"B","explain":"Đó là mối quan hệ bổ sung khí.","points":0.25},{"type":"mcq","level":"VD","q":"Lá bị sâu ăn mất một nửa thì quang hợp sẽ thế nào?","options":["A. Tăng","B. Giảm vì diện tích hứng sáng giảm","C. Không đổi","D. Ngừng hẳn"],"answer":"B","explain":"Ít diện tích hứng sáng, quang hợp giảm.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao diện tích rừng Amazon giảm gây lo ngại toàn cầu?","options":["A. Mất gỗ","B. Giảm quang hợp, mất cân bằng O2 và CO2","C. Mất đất","D. Mất động vật"],"answer":"B","explain":"Rừng Amazon điều hòa khí quyển toàn cầu.","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định về nước.","statements":["a) Nước là nguyên liệu quang hợp.","b) Thoát hơi nước tạo động lực hút nước.","c) Khí khổng khép khi thiếu nước làm giảm quang hợp.","d) Cây không cần nước vẫn quang hợp được."],"answer":["T","T","T","F"],"explain":"Thiếu nước, quang hợp đình trệ.","points":1},{"type":"truefalse","level":"VDC","q":"Đánh giá các nhận định khái quát.","statements":["a) Quang hợp là quá trình tổng hợp.","b) Hô hấp là quá trình phân giải.","c) Hai quá trình liên quan chặt chẽ.","d) Quang hợp và hô hấp là một."],"answer":["T","T","T","F"],"explain":"Đó là hai quá trình ngược nhau.","points":1},{"type":"short","level":"TH","q":"Cây ưa bóng trồng nơi nắng gắt bị cháy lá vì sao?","answer":"Quá sáng","explain":"Cường độ sáng vượt khả năng chịu đựng.","points":0.5},{"type":"short","level":"VDC","q":"Trên tàu vũ trụ trồng cây để làm gì?","answer":"Tái tạo không khí","explain":"Cây quang hợp tạo O2, hấp thụ CO2.","points":0.5}]}]}</script>
