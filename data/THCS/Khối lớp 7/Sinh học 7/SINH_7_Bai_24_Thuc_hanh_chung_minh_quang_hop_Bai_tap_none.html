un to lửa","D. Vừa đun vừa chơi"],"answer":"B","explain":"Cồn dễ cháy nên phải cẩn thận.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải để cây ngoài sáng vài giờ mà không phải vài phút?","options":["A. Để vui","B. Cần đủ thời gian tạo lượng tinh bột nhận biết được","C. Để cây tắm nắng","D. Không cần thiết"],"answer":"B","explain":"Thời gian ngắn tạo quá ít tinh bột.","points":0.25},{"type":"mcq","level":"VD","q":"Nếu nhỏ iodine trực tiếp lên lá tươi không qua xử lí, khó khăn gì?","options":["A. Không khó","B. Diệp lục xanh che lấp màu, khó quan sát","C. Lá rách","D. Iodine bay hơi"],"answer":"B","explain":"Phải tẩy diệp lục mới quan sát rõ.","points":0.25},{"type":"mcq","level":"VDC","q":"Muốn chứng minh quang hợp tạo đường thì làm thế nào?","options":["A. Không thể","B. Thử bằng thuốc thử đường thích hợp","C. Ngửi lá","D. Nếm lá"],"answer":"B","explain":"Có thuốc thử riêng cho đường.","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định về quan sát.","statements":["a) Phần có sáng chuyển xanh đen rõ rệt.","b) Phần bị che giữ màu nâu vàng của iodine.","c) Diệp lục còn lại che lấp kết quả.","d) Quan sát bằng mắt thường là đủ."],"answer":["T","T","T","F"],"explain":"Phải tẩy diệp lục mới quan sát rõ.","points":1},{"type":"truefalse","level":"VDC","q":"Đánh giá các nhận định về kiến thức liên môn.","statements":["a) Thí nghiệm dùng kiến thức hóa học về iodine.","b) Thí nghiệm cần kĩ năng đun cách thủy an toàn.","c) Thí nghiệm rèn tư duy đối chứng.","d) Thực hành không cần kiến thức lí thuyết."],"answer":["T","T","T","F"],"explain":"Thực hành gắn chặt với lí thuyết.","points":1},{"type":"short","level":"TH","q":"Cần để cây ngoài sáng bao lâu?","answer":"Vài giờ","explain":"Đủ thời gian tạo tinh bột.","points":0.5},{"type":"short","level":"VDC","q":"Ứng dụng thực tiễn rút ra là gì?","answer":"Đủ sáng","explain":"Cây cần đủ ánh sáng mới tốt.","points":0.5}]}]}</script>
