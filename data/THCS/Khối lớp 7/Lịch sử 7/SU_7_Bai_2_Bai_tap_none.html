<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2: Sự phát triển của thành thị trung đại - Bài tập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 16px; line-height: 1.6; }
        .question { background: white; padding: 16px; margin: 12px 0; border-radius: 8px; border: 1px solid #e2e8f0; }
        .options label { display: block; padding: 8px; margin: 4px 0; background: #f8fafc; border-radius: 4px; cursor: pointer; }
        .options label:hover { background: #e0f2fe; }
    </style>
</head>
<body class="bg-slate-50">
<div class="max-w-3xl mx-auto">
<h1 class="text-2xl font-bold mb-4">Bài 2: Sự phát triển của thành thị trung đại - Bài tập</h1>

<div class="question">
<p class="font-semibold mb-2">Câu 1: Thành thị trung đại ra đời từ thế kỉ:</p>
<div class="options">
<label><input type="radio" name="q1" value="A"> A. IX</label>
<label><input type="radio" name="q1" value="B"> B. XI</label>
<label><input type="radio" name="q1" value="C"> C. XIII</label>
<label><input type="radio" name="q1" value="D"> D. XV</label>
</div>
<button onclick="checkAnswer('q1', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q1" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 2: Nguyên nhân chính:</p>
<div class="options">
<label><input type="radio" name="q2" value="A"> A. Chiến tranh</label>
<label><input type="radio" name="q2" value="B"> B. Sản xuất phát triển</label>
<label><input type="radio" name="q2" value="C"> C. Thiên tai</label>
<label><input type="radio" name="q2" value="D"> D. Dịch bệnh</label>
</div>
<button onclick="checkAnswer('q2', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q2" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 3: Thợ thủ công tập trung ở:</p>
<div class="options">
<label><input type="radio" name="q3" value="A"> A. Lãnh địa</label>
<label><input type="radio" name="q3" value="B"> B. Thành thị</label>
<label><input type="radio" name="q3" value="C"> C. Nông thôn</label>
<label><input type="radio" name="q3" value="D"> D. Tu viện</label>
</div>
<button onclick="checkAnswer('q3', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q3" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 4: Vai trò của thành thị:</p>
<div class="options">
<label><input type="radio" name="q4" value="A"> A. Trung tâm kinh tế-văn hóa</label>
<label><input type="radio" name="q4" value="B"> B. Nơi ở của nông dân</label>
<label><input type="radio" name="q4" value="C"> C. Căn cứ quân sự</label>
<label><input type="radio" name="q4" value="D"> D. Nơi thờ cúng</label>
</div>
<button onclick="checkAnswer('q4', 'A')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q4" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 5: Phường hội là tổ chức của:</p>
<div class="options">
<label><input type="radio" name="q5" value="A"> A. Nông dân</label>
<label><input type="radio" name="q5" value="B"> B. Thợ thủ công</label>
<label><input type="radio" name="q5" value="C"> C. Lãnh chúa</label>
<label><input type="radio" name="q5" value="D"> D. Tăng lữ</label>
</div>
<button onclick="checkAnswer('q5', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q5" class="mt-2"></div>
</div>
</div>
<script>
function checkAnswer(qid, correct) {
    const selected = document.querySelector(`input[name="${qid}"]:checked`);
    const feedback = document.getElementById(`fb-${qid}`);
    if (!selected) { feedback.innerHTML = '<span class="text-orange-600">Hãy chọn đáp án!</span>'; return; }
    if (selected.value === correct) {
        feedback.innerHTML = '<span class="text-green-600 font-bold">✓ Đúng!</span>';
    } else {
        feedback.innerHTML = '<span class="text-red-600">✗ Chưa đúng. Đáp án đúng: ' + correct + '</span>';
    }
}
</script>
</body>
</html>
