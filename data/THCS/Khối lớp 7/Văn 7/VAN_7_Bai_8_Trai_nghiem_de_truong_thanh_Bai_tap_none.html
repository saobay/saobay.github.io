B", "explain": "Hồ Chí Minh kết hợp lí lẽ sâu sắc với dẫn chứng lịch sử phong phú, tạo sức thuyết phục mạnh mẽ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp liệt kê các anh hùng, tấm gương yêu nước có tác dụng gì?", "options": ["A. Làm rối bài văn.", "B. Cụ thể hóa luận điểm, tăng sức thuyết phục bằng bằng chứng sống động.", "C. Khoe trí nhớ của tác giả.", "D. Không có tác dụng."], "answer": "B", "explain": "Hàng loạt dẫn chứng cụ thể biến luận điểm trừu tượng thành hiện thực sinh động, khó ai phủ nhận.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giọng văn của Hồ Chí Minh trong văn bản có đặc điểm gì?", "options": ["A. Kiêu căng, xa cách.", "B. Giản dị, chân thành, tha thiết.", "C. Hài hước, châm biếm.", "D. Khô khan, cứng nhắc."], "answer": "B", "explain": "Dù bàn vấn đề lớn lao, giọng văn của Bác vẫn giản dị, gần gũi mà tha thiết, lay động lòng người.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Tinh thần yêu nước của nhân dân ta” là bài viết của Hồ Chí Minh.", "b) Bài viết ra đời trong thời kì kháng chiến chống Pháp.", "c) Mở đầu, tác giả so sánh lòng yêu nước “như các thứ của báu”.", "d) Luận điểm của bài là ca ngợi cảnh đẹp đất nước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng (1951). c) Đúng. d) Sai: luận điểm là khẳng định lòng nồng nàn yêu nước của dân ta.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dẫn chứng trong bài được lấy từ lịch sử đấu tranh của dân tộc.", "b) Tác giả nhắc đến Bà Trưng, Bà Triệu và các tấm gương kháng chiến.", "c) Tác giả chỉ nhắc đến một tầng lớp nhân dân duy nhất.", "d) Cách sắp xếp dẫn chứng từ xưa đến nay chứng minh truyền thống yêu nước liên tục."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: tác giả nhắc đến mọi tầng lớp: già, trẻ, gái, trai. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) chứng minh: “Dân ta có một lòng nồng nàn yêu nước.”", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu luận điểm cần chứng minh. Thân đoạn: dẫn chứng lịch sử (Bà Trưng, Bà Triệu, các cuộc kháng chiến); dẫn chứng hôm nay (học sinh, chiến sĩ); lí lẽ phân tích. Kết đoạn: khẳng định luận điểm. Tiêu chí: ít nhất 2 dẫn chứng xác thực, lập luận chặt chẽ."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) bác bỏ ý kiến: “Học tập đức tính giản dị là lỗi thời trong xã hội hiện đại.”", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu ý kiến cần bác bỏ. Thân đoạn: chỉ ra cái sai (giản dị không phải là lạc hậu mà là lối sống văn minh, tiết kiệm); dẫn chứng (tấm gương Bác, người thành đạt sống giản dị); khẳng định giá trị bền vững. Kết đoạn: khẳng định lại ý kiến đúng. Tiêu chí: có lí lẽ bác bỏ rõ ràng, không sa vào công kích cá nhân."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nhiệm vụ của phần mở bài trong văn nghị luận là", "options": ["A. kể lại toàn bộ câu chuyện.", "B. nêu vấn đề nghị luận, dẫn dắt vào bài.", "C. đưa ra kết luận cuối cùng.", "D. miêu tả cảnh vật."], "answer": "B", "explain": "Mở bài có nhiệm vụ giới thiệu, nêu vấn đề cần nghị luận một cách ngắn gọn, hấp dẫn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiệm vụ của phần thân bài là", "options": ["A. triển khai các luận điểm, luận cứ để làm sáng tỏ vấn đề.", "B. chào tạm biệt người đọc.", "C. kể chuyện cười.", "D. giới thiệu tác giả."], "answer": "A", "explain": "Thân bài là phần trọng tâm, nơi người viết lần lượt trình bày luận điểm, đưa ra lí lẽ và dẫn chứng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiệm vụ của phần kết bài là", "options": ["A. đặt thêm nhiều câu hỏi mới.", "B. khẳng định lại vấn đề, nêu suy nghĩ, cảm xúc của người viết.", "C. bắt đầu một vấn đề khác.", "D. liệt kê tài liệu tham khảo."], "answer": "B", "explain": "Kết bài khép lại vấn đề: khẳng định lại luận điểm, bày tỏ suy nghĩ, kêu gọi hành động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Phạm Văn Đồng chọn chi tiết bữa cơm, ngôi nhà sàn để chứng minh sự giản dị của Bác?", "options": ["A. Vì không còn chi tiết nào khác.", "B. Vì đó là dẫn chứng cụ thể, gần gũi, ai cũng dễ cảm nhận.", "C. Vì muốn chê Bác nghèo.", "D. Vì ngẫu hứng."], "answer": "B", "explain": "Những chi tiết đời thường, cụ thể có sức thuyết phục hơn ngàn lời ca ngợi chung chung.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cách lập luận của văn bản “Đức tính giản dị của Bác Hồ” là", "options": ["A. chỉ nêu ý kiến không cần bằng chứng.", "B. chứng minh bằng dẫn chứng cụ thể rồi bình luận, khái quát nâng cao.", "C. kể chuyện cười.", "D. toàn là câu hỏi."], "answer": "B", "explain": "Tác giả đi từ dẫn chứng cụ thể (đời sống, lời nói, bài viết) đến bình luận khái quát về phẩm chất cao đẹp của Bác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sự giản dị “trong lời nói, bài viết” của Bác được chứng minh bằng điều gì?", "options": ["A. Bác nói rất nhiều, rất dài.", "B. Lời nói, bài viết của Bác ngắn gọn, trong sáng, dễ hiểu.", "C. Bác không bao giờ nói.", "D. Bác chỉ nói tiếng nước ngoài."], "answer": "B", "explain": "Bác luôn diễn đạt giản dị, trong sáng để mọi người dân đều hiểu — đó cũng là biểu hiện của sự gần dân.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Đức tính giản dị của Bác Hồ” là bài viết của Phạm Văn Đồng.", "b) Luận điểm của bài: Bác Hồ giản dị trong đời sống, lời nói và bài viết.", "c) Tác giả chứng minh bằng những dẫn chứng cụ thể, gần gũi.", "d) Bài viết cho rằng Bác Hồ sống xa hoa, phô trương."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: bữa cơm, nhà sàn, lời nói giản dị. d) Sai: hoàn toàn ngược lại.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bữa cơm đạm bạc, nhà sàn đơn sơ là dẫn chứng về sự giản dị của Bác.", "b) Lời nói, bài viết ngắn gọn, trong sáng cũng thể hiện sự giản dị.", "c) Sự giản dị của Bác chỉ là vẻ bề ngoài, không có ý nghĩa sâu xa.", "d) Tấm gương giản dị của Bác có sức cảm hóa lớn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đó là biểu hiện của lối sống thanh bạch, gần dân. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) có sử dụng ít nhất hai từ ngữ chuyển ý, trình bày suy nghĩ về vai trò của trải nghiệm trong sự trưởng thành.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu vấn đề (trải nghiệm giúp con người trưởng thành). Thân đoạn: lí lẽ (trải nghiệm dạy bài học thực tế); dùng từ chuyển ý (“bên cạnh đó”, “tuy nhiên”...) để nối ý; dẫn chứng. Kết đoạn: khẳng định. Tiêu chí: dùng đúng ít nhất 2 từ chuyển ý, mạch văn liền mạch."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) phân tích nghệ thuật lập luận của Hồ Chí Minh trong “Tinh thần yêu nước của nhân dân ta”.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu văn bản và nhận xét chung. Thân đoạn: cách nêu luận điểm (so sánh “như của báu”); hệ thống dẫn chứng từ xưa đến nay; giọng văn tha thiết; kết bài kêu gọi. Kết đoạn: đánh giá sức thuyết phục. Tiêu chí: chỉ ra được ít nhất 3 đặc điểm lập luận."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả của văn bản “Tinh thần yêu nước của nhân dân ta” là ai?", "options": ["A. Phạm Văn Đồng.", "B. Hồ Chí Minh.", "C. Trường Chinh.", "D. Võ Nguyên Giáp."], "answer": "B", "explain": "“Tinh thần yêu nước của nhân dân ta” là bài viết của Chủ tịch Hồ Chí Minh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Văn bản “Tinh thần yêu nước của nhân dân ta” ra đời trong hoàn cảnh nào?", "options": ["A. Thời kì kháng chiến chống Pháp, trích trong Báo cáo chính trị tại Đại hội II của Đảng (1951).", "B. Thời kì đổi mới đất nước.", "C. Thời phong kiến nhà Nguyễn.", "D. Sau ngày hòa bình lập lại ở miền Bắc."], "answer": "A", "explain": "Bài viết ra đời năm 1951, giữa cuộc kháng chiến chống Pháp, nhằm khơi dậy, phát huy lòng yêu nước của toàn dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mở đầu văn bản, Hồ Chí Minh so sánh lòng yêu nước với hình ảnh gì?", "options": ["A. Ngọn lửa hồng.", "B. Các thứ của báu.", "C. Dòng sông lớn.", "D. Ánh mặt trời."], "answer": "B", "explain": "Tác giả viết đại ý: lòng yêu nước như các thứ của báu — quý giá, cần được giữ gìn và phát huy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận xét về bố cục của hai văn bản trong bài?", "options": ["A. Rối rắm, khó theo dõi.", "B. Đều có ba phần rõ ràng, mạch lạc: mở bài nêu vấn đề, thân bài triển khai, kết bài khẳng định.", "C. Chỉ có một phần.", "D. Không có bố cục."], "answer": "B", "explain": "Cả hai văn bản đều mẫu mực về bố cục nghị luận ba phần, giúp người đọc dễ nắm bắt mạch lập luận.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Bên cạnh đó, Bác còn giản dị trong lời nói.”, cụm từ chuyển ý là", "options": ["A. “Bác còn”.", "B. “Bên cạnh đó”.", "C. “giản dị”.", "D. “trong lời nói”."], "answer": "B", "explain": "“Bên cạnh đó” báo hiệu chuyển sang một biểu hiện khác của sự giản dị, nối hai ý trong mạch văn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác dụng của từ ngữ chuyển ý trong đoạn văn là", "options": ["A. làm văn bản rối hơn.", "B. báo hiệu sự chuyển đổi mạch ý, giúp đoạn văn mạch lạc, dễ theo dõi.", "C. trang trí câu văn.", "D. thay thế dấu câu."], "answer": "B", "explain": "Từ ngữ chuyển ý như biển chỉ đường, giúp người đọc nắm được quan hệ giữa các ý: bổ sung, đối lập, nguyên nhân...", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên kết câu là sự gắn kết các câu trong đoạn bằng từ ngữ và ý nghĩa.", "b) Bốn phép liên kết câu: lặp, thế, nối, liên tưởng.", "c) Phép lặp là lặp lại từ ngữ đã dùng để tạo sự gắn kết.", "d) Phép thế là chép lại nguyên văn câu trước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phép thế là dùng từ khác thay thế để tránh lặp.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Bên cạnh đó”, “tuy nhiên”, “hơn nữa” là những từ ngữ chuyển ý.", "b) Từ ngữ chuyển ý giúp đoạn văn mạch lạc, dễ theo dõi.", "c) Từ chuyển ý thường đặt ở đầu câu, đầu đoạn.", "d) Đoạn văn càng dùng nhiều từ chuyển ý càng hay, không cần chọn lọc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: lạm dụng sẽ gượng ép; cần dùng đúng chỗ, đúng lúc.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) phân tích cách dùng dẫn chứng của Phạm Văn Đồng trong “Đức tính giản dị của Bác Hồ”.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu cách dùng dẫn chứng. Thân đoạn: dẫn chứng cụ thể, gần gũi (bữa cơm, nhà sàn); cách sắp xếp từ đời sống đến lời nói, bài viết; tác dụng thuyết phục. Kết đoạn: nhận xét chung. Tiêu chí: có trích dẫn hoặc nhắc lại dẫn chứng, phân tích tác dụng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) giải thích vì sao lòng yêu nước được ví “như các thứ của báu”.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: trích lại hình ảnh so sánh. Thân đoạn: giải thích “của báu” (quý giá, cần giữ gìn); lòng yêu nước quý ở chỗ tạo sức mạnh đoàn kết, giúp dân tộc vượt qua thử thách; ai cũng phải có trách nhiệm phát huy. Kết đoạn: khẳng định sự tài tình của cách so sánh. Tiêu chí: giải thích sâu, có lí lẽ."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả của văn bản “Đức tính giản dị của Bác Hồ” là ai?", "options": ["A. Hồ Chí Minh.", "B. Phạm Văn Đồng.", "C. Lê Duẩn.", "D. Nguyễn Văn Linh."], "answer": "B", "explain": "Phạm Văn Đồng — nhà cách mạng, Thủ tướng Chính phủ — là tác giả bài viết ca ngợi đức tính giản dị của Bác Hồ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phạm Văn Đồng là ai?", "options": ["A. Nhà thơ lớn của dân tộc.", "B. Nhà cách mạng, Thủ tướng Chính phủ, người học trò gần gũi của Bác Hồ.", "C. Nhà khoa học nổi tiếng.", "D. Danh tướng thời Trần."], "answer": "B", "explain": "Phạm Văn Đồng là nhà lãnh đạo, người có nhiều năm gần gũi Bác Hồ nên viết về Bác rất chân thực, sâu sắc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Luận điểm chính của văn bản “Tinh thần yêu nước của nhân dân ta” là", "options": ["A. nhân dân ta rất thích ca hát.", "B. dân ta có một lòng nồng nàn yêu nước — đó là truyền thống quý báu.", "C. nhân dân ta giỏi làm kinh tế.", "D. nhân dân ta thích đi du lịch."], "answer": "B", "explain": "Xuyên suốt văn bản, Hồ Chí Minh khẳng định và chứng minh: dân ta có một lòng nồng nàn yêu nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xét hai câu: “Bác Hồ rất giản dị. Đức tính ấy khiến ai cũng kính yêu.” — phép liên kết nào được dùng?", "options": ["A. Phép lặp.", "B. Phép thế (“đức tính ấy” thay cho “giản dị”).", "C. Phép nối.", "D. Không có phép liên kết."], "answer": "B", "explain": "Cụm “đức tính ấy” thay thế cho từ “giản dị” ở câu trước — đó là phép thế, vừa liên kết vừa tránh lặp từ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đoạn văn thiếu liên kết câu sẽ như thế nào?", "options": ["A. Vẫn hay như thường.", "B. Rời rạc, ý tứ đứt đoạn, người đọc khó hiểu.", "C. Ngắn gọn hơn.", "D. Trở thành thơ."], "answer": "B", "explain": "Không có phương tiện liên kết, các câu đứng cạnh nhau một cách rời rạc, mạch ý bị đứt gãy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao văn nghị luận cần luận cứ xác thực?", "options": ["A. Để bài văn dài hơn.", "B. Vì chỉ có bằng chứng xác thực mới thuyết phục được người đọc tin theo luận điểm.", "C. Để khoe kiến thức.", "D. Không cần thiết."], "answer": "B", "explain": "Sức mạnh của văn nghị luận nằm ở sức thuyết phục; luận cứ giả tạo sẽ làm sụp đổ toàn bộ lập luận.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu chuyển đoạn có nhiệm vụ liên kết đoạn trên với đoạn dưới.", "b) “Bác Hồ giản dị. Đức tính ấy khiến ai cũng kính yêu.” dùng phép thế.", "c) Đoạn văn thiếu liên kết sẽ rời rạc, khó hiểu.", "d) Liên kết đoạn văn không cần thiết trong bài văn nghị luận."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: “đức tính ấy” thay cho “giản dị”. c) Đúng. d) Sai: liên kết đoạn rất cần để mạch văn liền mạch.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chứng minh là dùng lí lẽ, dẫn chứng để làm rõ luận điểm.", "b) Giải thích là làm rõ khái niệm, vấn đề để người đọc hiểu đúng.", "c) Bình luận là bày tỏ ý kiến đánh giá về vấn đề.", "d) Bác bỏ là đồng tình với mọi ý kiến."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bác bỏ là phản bác ý kiến sai trái.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) trình bày suy nghĩ về ý kiến: “Giản dị là biểu hiện của sự giàu có về tâm hồn.”", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giải thích ý kiến. Thân đoạn: người giản dị không chạy theo vật chất nên tâm hồn thanh thản; dẫn chứng (Bác Hồ và những tấm gương); phản đề (xa hoa chưa chắc hạnh phúc). Kết đoạn: bài học cho bản thân. Tiêu chí: có chính kiến, lập luận hai chiều."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) nêu cảm nhận của em về hình ảnh các tầng lớp nhân dân trong “Tinh thần yêu nước của nhân dân ta”.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu hình ảnh. Thân đoạn: liệt kê già, trẻ, gái, trai cùng yêu nước; cảm xúc xúc động, tự hào; sức mạnh đoàn kết dân tộc. Kết đoạn: khẳng định. Tiêu chí: có cảm xúc chân thành, nhắc được chi tiết văn bản."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Dẫn chứng trong “Tinh thần yêu nước của nhân dân ta” được lấy từ đâu?", "options": ["A. Từ các câu chuyện cổ tích.", "B. Từ lịch sử đấu tranh của dân tộc: Bà Trưng, Bà Triệu cho đến kháng chiến chống Pháp.", "C. Từ phim ảnh nước ngoài.", "D. Từ những giấc mơ của tác giả."], "answer": "B", "explain": "Tác giả dẫn ra hàng loạt tấm gương yêu nước trong lịch sử, từ thời Bà Trưng, Bà Triệu đến cuộc kháng chiến đang diễn ra.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Luận điểm chính của văn bản “Đức tính giản dị của Bác Hồ” là", "options": ["A. Bác Hồ là người rất giàu có.", "B. Bác Hồ giản dị trong đời sống, trong lời nói và bài viết.", "C. Bác Hồ thích sống xa hoa.", "D. Bác Hồ không quan tâm đến nhân dân."], "answer": "B", "explain": "Phạm Văn Đồng khẳng định sự giản dị của Bác thể hiện toàn diện: đời sống vật chất, lời nói, bài viết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dẫn chứng về sự giản dị của Bác trong đời sống là", "options": ["A. bữa cơm đạm bạc, ngôi nhà sàn đơn sơ, trang phục giản dị.", "B. biệt thự sang trọng, xe hơi đắt tiền.", "C. yến tiệc linh đình mỗi ngày.", "D. quần áo lụa là, gấm vóc."], "answer": "A", "explain": "Tác giả đưa những dẫn chứng cụ thể, gần gũi: bữa cơm chỉ vài món, nhà sàn gỗ đơn sơ, bộ quần áo ka-ki bạc màu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân biệt lí lẽ và dẫn chứng trong văn nghị luận?", "options": ["A. Giống hệt nhau.", "B. Lí lẽ là phân tích, lập luận; dẫn chứng là sự việc, số liệu cụ thể minh chứng.", "C. Dẫn chứng là lí lẽ.", "D. Không cần phân biệt."], "answer": "B", "explain": "Lí lẽ thuộc về tư duy phân tích, còn dẫn chứng là bằng chứng thực tế; hai yếu tố bổ sung cho nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây là một luận điểm?", "options": ["A. “Hôm nay trời nắng đẹp.”", "B. “Tuổi trẻ cần sống có lí tưởng để cống hiến cho đất nước.”", "C. “Bạn ăn cơm chưa?”", "D. “Hãy mở cửa sổ ra!”"], "answer": "B", "explain": "Đây là một ý kiến, quan điểm cần được bàn luận, chứng minh — đúng bản chất của luận điểm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây là một dẫn chứng?", "options": ["A. “Trong kháng chiến, biết bao anh hùng đã hi sinh vì Tổ quốc.”", "B. “Tôi nghĩ rằng học tập rất quan trọng.”", "C. “Có lẽ ngày mai trời sẽ mưa.”", "D. “Bạn có thích đọc sách không?”"], "answer": "A", "explain": "Câu nêu sự việc cụ thể trong thực tế để minh chứng cho luận điểm — đó là dẫn chứng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thao tác chính trong “Tinh thần yêu nước của nhân dân ta” là chứng minh.", "b) “Đức tính giản dị của Bác Hồ” kết hợp chứng minh và bình luận.", "c) Hai văn bản đều không sử dụng dẫn chứng.", "d) Dẫn chứng cần tiêu biểu, xác thực, phù hợp với luận điểm."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: hàng loạt dẫn chứng lịch sử. b) Đúng. c) Sai: cả hai đều giàu dẫn chứng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giọng văn của Hồ Chí Minh giản dị, chân thành, tha thiết.", "b) Phạm Văn Đồng viết về Bác bằng tình cảm kính yêu sâu sắc.", "c) Cả hai văn bản đều có bố cục ba phần rõ ràng.", "d) Văn nghị luận không cần bố cục rõ ràng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bố cục rõ ràng là yêu cầu quan trọng của văn nghị luận.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) sử dụng phép lặp và phép thế để liên kết các câu, viết về một tấm gương yêu nước mà em biết.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu tấm gương. Thân đoạn: kể việc làm yêu nước; dùng phép lặp (lặp từ khóa) và phép thế (đại từ, từ đồng nghĩa) để liên kết; cảm nghĩ. Kết đoạn: bài học. Tiêu chí: nhận diện được phép lặp, phép thế đã dùng; nội dung chân thực."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) so sánh nghệ thuật lập luận của hai văn bản trong Bài 8.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu hai văn bản. Thân đoạn: giống nhau (bố cục 3 phần, giàu dẫn chứng, giọng chân thành); khác nhau (Hồ Chí Minh dùng dẫn chứng lịch sử hào hùng; Phạm Văn Đồng dùng dẫn chứng đời thường gần gũi). Kết đoạn: hai phong cách bổ sung cho nhau. Tiêu chí: so sánh rõ giống và khác."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Liên kết câu là gì?", "options": ["A. Sự gắn kết các câu trong đoạn bằng từ ngữ và ý nghĩa, tạo nên mạch lạc.", "B. Việc đếm số câu trong đoạn văn.", "C. Việc viết câu thật dài.", "D. Việc dùng nhiều dấu câu trong một câu."], "answer": "A", "explain": "Các câu trong đoạn phải gắn bó với nhau về ý và có phương tiện liên kết bằng từ ngữ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Liên kết đoạn văn là gì?", "options": ["A. Viết các đoạn văn thật dài.", "B. Sự gắn kết các đoạn văn với nhau bằng câu chuyển đoạn, từ ngữ chuyển ý.", "C. Đánh số thứ tự các đoạn văn.", "D. Xuống dòng tùy ý."], "answer": "B", "explain": "Đoạn văn sau phải tiếp nối đoạn văn trước một cách tự nhiên nhờ câu chuyển đoạn và từ ngữ chuyển ý.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các phép liên kết câu thường dùng gồm", "options": ["A. phép lặp, phép thế, phép nối, phép liên tưởng.", "B. phép cộng, phép trừ, phép nhân, phép chia.", "C. so sánh, nhân hóa, ẩn dụ, hoán dụ.", "D. mở bài, thân bài, kết bài."], "answer": "A", "explain": "Bốn phép liên kết câu cơ bản: lặp từ ngữ, thay thế (phép thế), nối (dùng từ nối), liên tưởng (đồng nghĩa, trái nghĩa...).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thao tác nghị luận chính được dùng trong “Tinh thần yêu nước của nhân dân ta” là", "options": ["A. miêu tả.", "B. chứng minh (bằng hàng loạt dẫn chứng lịch sử).", "C. kể chuyện cười.", "D. đối thoại."], "answer": "B", "explain": "Hồ Chí Minh dùng hệ thống dẫn chứng lịch sử phong phú để chứng minh luận điểm về lòng yêu nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thao tác nghị luận trong “Đức tính giản dị của Bác Hồ” là", "options": ["A. chứng minh bằng dẫn chứng cụ thể kết hợp bình luận khái quát.", "B. chỉ bác bỏ.", "C. chỉ giải thích từ ngữ.", "D. không dùng thao tác nào."], "answer": "A", "explain": "Phạm Văn Đồng vừa đưa dẫn chứng sinh động vừa bình luận sâu sắc, nâng tầm ý nghĩa của sự giản dị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa thời sự của văn bản “Tinh thần yêu nước của nhân dân ta” hôm nay là", "options": ["A. chỉ có giá trị trong quá khứ.", "B. khơi dậy lòng yêu nước, ý thức trách nhiệm của mỗi người với đất nước hôm nay.", "C. khuyên mọi người sống ích kỉ.", "D. không còn ý nghĩa gì."], "answer": "B", "explain": "Lòng yêu nước trong thời bình thể hiện qua học tập, lao động, bảo vệ Tổ quốc — bài học còn nguyên giá trị.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Tuổi trẻ cần sống có lí tưởng” là một luận điểm.", "b) “Hôm nay trời nắng đẹp” là một luận điểm nghị luận.", "c) “Biết bao anh hùng đã hi sinh vì Tổ quốc” có thể làm dẫn chứng.", "d) Luận điểm cần được làm sáng tỏ bằng luận cứ."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: đó là ý kiến cần bàn luận. b) Sai: đây chỉ là câu kể miêu tả thời tiết. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lí lẽ là sự phân tích, lập luận của người viết.", "b) Dẫn chứng là sự việc, số liệu cụ thể.", "c) Lí lẽ và dẫn chứng bổ sung cho nhau trong lập luận.", "d) Bài văn nghị luận hay chỉ cần lí lẽ, không cần dẫn chứng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thiếu dẫn chứng, lí lẽ trở nên suông, kém thuyết phục.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) trình bày suy nghĩ: “Trải nghiệm thực tế có vai trò như thế nào đối với sự trưởng thành của tuổi trẻ?”", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu vấn đề. Thân đoạn: trải nghiệm dạy bài học sách vở không có; giúp cứng cỏi, bản lĩnh; dẫn chứng (chuyến đi, hoạt động tập thể); lưu ý trải nghiệm cần an toàn, lành mạnh. Kết đoạn: chủ động trải nghiệm để trưởng thành. Tiêu chí: có lí lẽ và dẫn chứng thực tế."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) bình luận về câu nói của Bác: “Non sông Việt Nam có trở nên tươi đẹp hay không... chính là nhờ một phần lớn ở công học tập của các em.” (gợi ý liên hệ lòng yêu nước).", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: trích dẫn câu nói. Thân đoạn: bình luận (Bác đặt niềm tin vào thế hệ trẻ; học tập tốt là biểu hiện yêu nước thiết thực); liên hệ bản thân. Kết đoạn: quyết tâm học tập. Tiêu chí: bình luận sâu, có liên hệ bản thân."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Từ ngữ chuyển ý là những từ ngữ như", "options": ["A. “tuy nhiên”, “bên cạnh đó”, “mặt khác”, “hơn nữa”.", "B. “ôi”, “chao ôi”, “than ôi”.", "C. “nếu”, “thì”, “và”, “hoặc”.", "D. “rất”, “lắm”, “quá”, “hơi”."], "answer": "A", "explain": "Các từ ngữ chuyển ý báo hiệu sự chuyển đổi mạch văn: đối lập, bổ sung, nguyên nhân, kết quả...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phép lặp trong liên kết câu là", "options": ["A. lặp lại từ ngữ đã dùng ở câu trước để tạo sự gắn kết.", "B. viết lại cả đoạn văn.", "C. đọc đi đọc lại một câu.", "D. chép lại bài văn của bạn."], "answer": "A", "explain": "Ví dụ: “Bác Hồ giản dị. Sự giản dị của Bác thể hiện trong từng bữa ăn.” — lặp từ “giản dị”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phép thế trong liên kết câu là", "options": ["A. thay giáo viên chấm bài.", "B. dùng từ ngữ khác thay thế từ ngữ đã dùng (đại từ, từ đồng nghĩa) để tránh lặp.", "C. thế chỗ ngồi trong lớp.", "D. thay sách giáo khoa mới."], "answer": "B", "explain": "Ví dụ: “Bác Hồ giản dị. Đức tính ấy khiến ai cũng kính yêu.” — “đức tính ấy” thay thế cho “giản dị”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Bác Hồ được coi là tấm gương về đức tính giản dị?", "options": ["A. Vì Bác sống thanh bạch, gần gũi dù ở cương vị lãnh tụ cao nhất.", "B. Vì Bác giàu có.", "C. Vì Bác thích phô trương.", "D. Vì Bác sống xa hoa."], "answer": "A", "explain": "Chính sự đối lập giữa cương vị cao nhất và lối sống thanh bạch nhất làm nên sức cảm hóa của tấm gương Bác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh cách mở bài của hai văn bản trong bài 8?", "options": ["A. Đều mở bài gián tiếp, vòng vo.", "B. Đều nêu trực tiếp vấn đề nghị luận (mở bài trực tiếp), ngắn gọn, rõ ràng.", "C. Một bài không có mở bài.", "D. Đều bắt đầu bằng câu chuyện cười."], "answer": "B", "explain": "Cả hai văn bản đều đi thẳng vào vấn đề: lòng yêu nước của nhân dân ta; đức tính giản dị của Bác Hồ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kết bài của hai văn bản có điểm chung nào?", "options": ["A. Đều bỏ lửng vấn đề.", "B. Đều khẳng định lại vấn đề và kêu gọi phát huy truyền thống, phẩm chất tốt đẹp.", "C. Đều chuyển sang vấn đề khác.", "D. Đều là câu hỏi."], "answer": "B", "explain": "Kết bài khép lại bằng lời khẳng định và kêu gọi: phát huy lòng yêu nước; học tập đức tính giản dị của Bác.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Học văn nghị luận giúp rèn tư duy phản biện.", "b) Văn nghị luận giúp diễn đạt ý kiến một cách thuyết phục.", "c) Lòng yêu nước trong thời bình thể hiện qua học tập, lao động tốt.", "d) Đức tính giản dị đã lỗi thời, không cần học tập."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: giản dị luôn là phẩm chất đáng quý, cần học tập.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mở bài trực tiếp là nêu thẳng vấn đề nghị luận.", "b) Hai văn bản trong bài đều dùng cách mở bài trực tiếp.", "c) Kết bài cần khẳng định lại vấn đề.", "d) Thân bài là phần có thể bỏ qua trong bài văn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thân bài là phần trọng tâm, triển khai luận điểm.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) phân tích vì sao dẫn chứng lịch sử có sức thuyết phục mạnh mẽ trong văn nghị luận.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu vấn đề. Thân đoạn: dẫn chứng lịch sử là sự thật đã được kiểm chứng; gợi niềm tự hào dân tộc; dễ đi vào lòng người; ví dụ từ văn bản Hồ Chí Minh. Kết đoạn: bài học khi chọn dẫn chứng. Tiêu chí: lí lẽ sâu, có ví dụ."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) kể về một việc làm thể hiện lòng yêu nước của em hoặc bạn bè và nêu suy nghĩ.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu việc làm. Thân đoạn: kể ngắn gọn việc làm cụ thể (giữ gìn vệ sinh, giúp đỡ bạn, tìm hiểu lịch sử...); suy nghĩ (việc nhỏ cũng là yêu nước). Kết đoạn: quyết tâm tiếp tục. Tiêu chí: việc làm cụ thể, chân thực; có suy nghĩ."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Phép nối trong liên kết câu là", "options": ["A. nối hai đoạn dây điện.", "B. dùng quan hệ từ, từ nối (“vì vậy”, “tuy nhiên”, “hơn nữa”...) để gắn kết các câu.", "C. nối các bàn học lại với nhau.", "D. kết bạn với nhiều người."], "answer": "B", "explain": "Các từ nối như “vì vậy”, “do đó”, “tuy nhiên” vừa liên kết hình thức vừa thể hiện quan hệ ý nghĩa giữa các câu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu chuyển đoạn có vai trò gì?", "options": ["A. Trang trí cho bài văn đẹp hơn.", "B. Liên kết đoạn văn trên với đoạn văn dưới, giúp mạch văn liền mạch.", "C. Kéo dài bài văn.", "D. Thay thế cho kết bài."], "answer": "B", "explain": "Câu chuyển đoạn thường nằm ở đầu đoạn, vừa tổng kết ý đoạn trước vừa mở ra ý đoạn sau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thao tác chứng minh trong văn nghị luận là", "options": ["A. dùng lí lẽ và dẫn chứng, số liệu cụ thể để làm rõ luận điểm.", "B. kể một câu chuyện cười.", "C. miêu tả phong cảnh.", "D. đặt nhiều câu hỏi."], "answer": "A", "explain": "Chứng minh là dùng bằng chứng xác thực (sự việc, số liệu, lời nói) để khẳng định luận điểm là đúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “tuy nhiên” trong đoạn văn báo hiệu điều gì?", "options": ["A. Sự chuyển ý theo hướng đối lập, bổ sung ý mới khác với ý trước.", "B. Kết thúc đoạn văn.", "C. Bắt đầu bài văn.", "D. Không báo hiệu gì."], "answer": "A", "explain": "“Tuy nhiên” là từ chuyển ý thể hiện quan hệ đối lập: ý sau có sự khác biệt, thậm chí trái ngược với ý trước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ ngữ chuyển ý thường được đặt ở vị trí nào?", "options": ["A. Cuối bài văn.", "B. Đầu câu, đầu đoạn văn nơi chuyển mạch ý.", "C. Giữa từ ghép.", "D. Tùy ý, không có quy tắc."], "answer": "B", "explain": "Đặt ở đầu câu, đầu đoạn, từ chuyển ý như tín hiệu giúp người đọc nhận ra mạch văn đang chuyển hướng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dẫn chứng trong văn nghị luận cần đảm bảo yêu cầu gì?", "options": ["A. Càng nhiều càng tốt, không cần chọn lọc.", "B. Tiêu biểu, xác thực và phù hợp với luận điểm cần chứng minh.", "C. Bịa đặt cho hấp dẫn.", "D. Lấy từ truyện cổ tích."], "answer": "B", "explain": "Dẫn chứng phải tiêu biểu, có thật và gắn chặt với luận điểm; dẫn chứng sai sẽ phá vỡ sức thuyết phục.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) So sánh lòng yêu nước “như của báu” nhấn mạnh giá trị quý giá của nó.", "b) Liệt kê các tầng lớp nhân dân khẳng định lòng yêu nước của toàn dân.", "c) Chi tiết bữa cơm, nhà sàn làm cho hình ảnh Bác gần gũi, thuyết phục.", "d) Các biện pháp nghệ thuật không có vai trò gì trong văn nghị luận."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: so sánh, liệt kê làm tăng sức thuyết phục.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phép liên tưởng dùng từ đồng nghĩa, trái nghĩa để liên kết câu.", "b) Phép nối dùng các từ như “vì vậy”, “tuy nhiên”, “hơn nữa”.", "c) Lạm dụng từ chuyển ý khiến văn bản gượng ép.", "d) Mỗi đoạn văn phải có ít nhất mười từ chuyển ý."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: cần dùng đúng chỗ. d) Sai: không có quy định số lượng cứng nhắc.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) phân tích tác dụng của câu chuyển đoạn trong một đoạn văn nghị luận tự chọn.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: trích dẫn câu chuyển đoạn. Thân đoạn: chỉ ra nó nối ý đoạn trước với đoạn sau thế nào; tác dụng với mạch văn; nếu thiếu sẽ ra sao. Kết đoạn: khẳng định vai trò. Tiêu chí: phân tích đúng chức năng liên kết hai chiều."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) trình bày suy nghĩ về mối quan hệ giữa lí tưởng sống và lòng yêu nước của thanh niên.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu vấn đề. Thân đoạn: lí tưởng sống đúng đắn gắn với cống hiến cho đất nước; yêu nước là nền tảng của lí tưởng; phê phán lối sống ích kỉ, vô cảm; dẫn chứng. Kết đoạn: kêu gọi. Tiêu chí: lập luận chặt chẽ, có chiều sâu."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Thao tác giải thích trong văn nghị luận là", "options": ["A. làm rõ khái niệm, vấn đề để người đọc hiểu đúng, hiểu sâu.", "B. chê bai người khác.", "C. kể chuyện cổ tích.", "D. làm bài tập toán."], "answer": "A", "explain": "Giải thích giúp người đọc hiểu rõ bản chất, ý nghĩa của vấn đề trước khi bàn luận sâu hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thao tác bình luận trong văn nghị luận là", "options": ["A. bày tỏ ý kiến đánh giá, nhận xét về vấn đề.", "B. im lặng không nói gì.", "C. chép lại lời người khác.", "D. vẽ tranh minh họa."], "answer": "A", "explain": "Bình luận là bày tỏ thái độ, sự đánh giá (đồng tình, phê phán) của người viết về vấn đề.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thao tác bác bỏ trong văn nghị luận là", "options": ["A. dùng lí lẽ, dẫn chứng để phản bác ý kiến sai trái.", "B. từ chối làm bài tập.", "C. xóa bài viết của mình.", "D. không nghe ý kiến người khác."], "answer": "A", "explain": "Bác bỏ nhằm vạch rõ cái sai của ý kiến đối lập, từ đó khẳng định ý kiến đúng đắn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lí lẽ “của báu phải được giữ gìn, phát huy” trong văn bản dẫn tới kết luận gì?", "options": ["A. Nên cất giấu lòng yêu nước đi.", "B. Mỗi người phải phát huy lòng yêu nước bằng hành động cụ thể.", "C. Của báu chỉ để ngắm.", "D. Không cần làm gì cả."], "answer": "B", "explain": "Từ lí lẽ về “của báu”, Hồ Chí Minh kêu gọi: phải ra sức phát huy lòng yêu nước trong kháng chiến và xây dựng đất nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Học văn nghị luận giúp học sinh điều gì?", "options": ["A. Chỉ để thi cử.", "B. Rèn tư duy phản biện, khả năng diễn đạt thuyết phục và bản lĩnh bảo vệ chính kiến.", "C. Học thuộc lòng.", "D. Không giúp gì."], "answer": "B", "explain": "Văn nghị luận rèn cho người học cách nghĩ có lí lẽ, nói có bằng chứng — hành trang quan trọng trong học tập và cuộc sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phép liên tưởng trong liên kết câu là", "options": ["A. dùng từ đồng nghĩa, trái nghĩa hoặc cùng trường nghĩa để gắn kết các câu.", "B. tưởng tượng ra câu chuyện.", "C. mơ mộng trong giờ học.", "D. đoán ý giáo viên."], "answer": "A", "explain": "Ví dụ: “Bác giản dị trong ăn mặc. Sự thanh bạch ấy...” — “thanh bạch” liên tưởng với “giản dị”, tạo sự gắn kết.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Tinh thần yêu nước của nhân dân ta” kêu gọi phát huy lòng yêu nước.", "b) “Đức tính giản dị của Bác Hồ” kêu gọi học tập tấm gương của Bác.", "c) Cả hai văn bản đều hướng tới hành động thực tế của người đọc.", "d) Văn nghị luận chỉ để đọc cho biết, không hướng tới hành động."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: văn nghị luận luôn hướng tới thuyết phục, kêu gọi hành động. d) Sai.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bài 8 giúp học sinh nắm được đặc điểm của văn nghị luận.", "b) Luận điểm, luận cứ, lập luận là những khái niệm trung tâm của bài.", "c) Liên kết câu, liên kết đoạn văn là nội dung thực hành tiếng Việt của bài.", "d) Văn nghị luận và truyện khoa học viễn tưởng có cách thuyết phục người đọc giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: văn nghị luận thuyết phục bằng lí lẽ, dẫn chứng; truyện viễn tưởng lôi cuốn bằng tưởng tượng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) nêu bài học em rút ra sau khi học Bài 8: “Trải nghiệm để trưởng thành”.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu bài học chung. Thân đoạn: bài học về lòng yêu nước (từ văn bản Hồ Chí Minh); bài học về sự giản dị (từ văn bản Phạm Văn Đồng); bài học về cách viết văn nghị luận, liên kết câu. Kết đoạn: quyết tâm vận dụng. Tiêu chí: nêu được ít nhất 2 bài học cụ thể."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) chứng minh rằng việc học tập tốt cũng là một biểu hiện của lòng yêu nước.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu luận điểm. Thân đoạn: đất nước cần người tài; học tốt để sau này cống hiến; dẫn chứng (tấm gương học sinh giỏi, nhà khoa học); phản bác ý kiến “học cho bản thân”. Kết đoạn: khẳng định. Tiêu chí: lập luận thuyết phục, có dẫn chứng."}]}]}
