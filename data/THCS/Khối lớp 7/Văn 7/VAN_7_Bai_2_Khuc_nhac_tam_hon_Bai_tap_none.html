thầm lặng, bền bỉ như mưa thấm đất. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về nỗi nhớ mẹ của người lính trong “Gặp lá cơm nếp” (đọc dưới góc nhìn của thơ).", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: hoàn cảnh người lính. Thân đoạn: hình ảnh “lá cơm nếp”, mùi xôi gợi nỗi nhớ; nhịp thơ năm chữ dồn dập như nhịp nhớ; cảm xúc trữ tình da diết. Kết đoạn: suy nghĩ về tình mẫu tử. Tiêu chí chấm: chú ý yếu tố thơ (nhịp, hình ảnh), cảm xúc rõ ràng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) phân tích hình ảnh “mưa” trong “Một mình trong mưa” của Đỗ Trung Lai.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: vị trí hình ảnh trong bài. Thân đoạn: “mưa” vừa tả thực vừa tượng trưng cho gian khó; nổi bật hình ảnh người cha lặng lẽ che chở; giọng thơ trầm lắng. Kết đoạn: cảm nhận về tình cha. Tiêu chí chấm: chỉ ra được hai lớp nghĩa của hình ảnh, phân tích sâu."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Thơ năm chữ có đặc điểm gì?", "options": ["A. Mỗi dòng thơ có 5 chữ.", "B. Mỗi dòng thơ có 6 chữ.", "C. Mỗi khổ thơ có 5 dòng.", "D. Bài thơ có 5 khổ."], "answer": "A", "explain": "Thơ năm chữ: mỗi dòng thơ gồm 5 chữ, nhịp điệu gọn gàng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thơ tự do có đặc điểm gì?", "options": ["A. Số chữ mỗi dòng, số dòng mỗi khổ không gò bó theo quy định.", "B. Mỗi dòng bắt buộc 8 chữ.", "C. Không có vần, nhịp.", "D. Không bộc lộ cảm xúc."], "answer": "A", "explain": "Thơ tự do không gò bó số chữ, số dòng, phóng khoáng về hình thức nhưng vẫn giàu nhạc điệu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả bài thơ “Đồng dao mùa xuân” là ai?", "options": ["A. Thanh Thảo.", "B. Nguyễn Khoa Điềm.", "C. Đỗ Trung Lai.", "D. Hoàng Trung Thông."], "answer": "B", "explain": "“Đồng dao mùa xuân” là bài thơ của Nguyễn Khoa Điềm (sinh 1943).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa ẩn dụ và hoán dụ là gì?", "options": ["A. Ẩn dụ dựa trên nét tương đồng, hoán dụ dựa trên quan hệ gần gũi.", "B. Ẩn dụ hay hơn hoán dụ.", "C. Hoán dụ chỉ dùng trong văn xuôi.", "D. Hai biện pháp hoàn toàn giống nhau."], "answer": "A", "explain": "Mẹo nhớ: ẩn dụ — giống nhau (A như B); hoán dụ — gần nhau (lấy cái này chỉ cái kia).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu thơ “Mặt trời của mẹ, em nằm trên lưng”, biện pháp tu từ nào được dùng?", "options": ["A. Ẩn dụ (em bé được ví như mặt trời của mẹ).", "B. Hoán dụ.", "C. Điệp ngữ.", "D. Nhân hóa."], "answer": "A", "explain": "Em bé được gọi là “mặt trời của mẹ” dựa trên nét tương đồng (đều là nguồn sáng, niềm vui): ẩn dụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Bàn tay ta làm nên tất cả / Có sức người sỏi đá cũng thành cơm”, “sỏi đá” là biện pháp gì?", "options": ["A. Ẩn dụ.", "B. Hoán dụ (“sỏi đá” chỉ khó khăn, gian khổ).", "C. Điệp ngữ.", "D. Nhân hóa."], "answer": "B", "explain": "“Sỏi đá” chỉ những khó khăn, gian khổ — lấy vật cụ thể gần gũi để chỉ khái niệm trừu tượng: hoán dụ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Những cánh buồm” là bài thơ của Hoàng Trung Thông.", "b) Hai cha con dạo chơi bên bờ biển, ngắm cánh buồm.", "c) “Cánh buồm trắng” tượng trưng cho ước mơ, khát vọng tuổi thơ.", "d) Người cha nghiêm khắc cấm con ước mơ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: người cha mỉm cười nâng niu ước mơ của con.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Ẩn dụ là gọi tên sự vật này bằng tên sự vật khác có nét tương đồng.", "b) Trong “Thuyền về có nhớ bến chăng”, “thuyền”, “bến” là ẩn dụ.", "c) Ẩn dụ phải dùng từ “như”.", "d) “Mặt trời trong lăng” ẩn dụ chỉ Bác Hồ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: thuyền, bến ẩn dụ cho người đi, kẻ ở. c) Sai: ẩn dụ không dùng từ so sánh “như”. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về tình cha trong “Một mình trong mưa”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu bài thơ. Thân đoạn: người cha một mình trong mưa — thầm lặng, bền bỉ, che chở cho con; so sánh với tình mẹ ồn ào hơn. Kết đoạn: liên hệ cha của mình. Tiêu chí chấm: cảm nhận tinh tế về sự thầm lặng, có liên hệ bản thân."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) phân tích ý nghĩa tượng trưng của hình ảnh “cánh buồm trắng” trong “Những cánh buồm”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: hình ảnh xuất hiện trong hoàn cảnh hai cha con dạo biển. Thân đoạn: từ tả thực (buồm no gió ra khơi) đến tượng trưng (ước mơ, khát vọng vươn xa); tác dụng khơi gợi. Kết đoạn: ước mơ của bản thân em. Tiêu chí chấm: phân tích được lớp nghĩa tượng trưng, có liên hệ."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Bài thơ “Đồng dao mùa xuân” viết về ai?", "options": ["A. Người nông dân cày ruộng.", "B. Người lính trẻ đã ngã xuống giữa mùa xuân đất nước.", "C. Em bé chăn trâu.", "D. Người thầy giáo."], "answer": "B", "explain": "Bài thơ tưởng niệm người lính trẻ ngã xuống khi tuổi đời còn xanh, hóa thân vào mùa xuân bất diệt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Đồng dao” có nghĩa là gì?", "options": ["A. Lời hát dân gian trong trẻo, hồn nhiên của trẻ em vùng quê.", "B. Bài hát ru con.", "C. Điệu hò kéo lưới.", "D. Lời thề chiến đấu."], "answer": "A", "explain": "Đồng dao là lời hát dân gian của trẻ em, giọng trong trẻo, hồn nhiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả “Một mình trong mưa” là ai?", "options": ["A. Nguyễn Khoa Điềm.", "B. Thanh Thảo.", "C. Đỗ Trung Lai.", "D. Tố Hữu."], "answer": "C", "explain": "“Một mình trong mưa” là bài thơ của Đỗ Trung Lai, nhà thơ viết nhiều về tình cảm gia đình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao thơ rất cần vần và nhịp?", "options": ["A. Để bài thơ dài hơn.", "B. Để tạo nhạc điệu, dễ đọc, dễ nhớ và truyền cảm xúc mạnh hơn.", "C. Để khoe tài của nhà thơ.", "D. Thơ không cần vần, nhịp."], "answer": "B", "explain": "Vần, nhịp tạo nhạc điệu — “khúc nhạc” của tâm hồn — giúp thơ dễ đi vào lòng người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cảm xúc trữ tình được gọi là “linh hồn” của bài thơ?", "options": ["A. Vì nó làm bài thơ dài ra.", "B. Vì không có cảm xúc, thơ chỉ còn là câu chữ khô khan, mất sức sống.", "C. Vì mọi bài thơ đều vui vẻ.", "D. Vì cảm xúc không quan trọng."], "answer": "B", "explain": "Cảm xúc là cái làm nên sức sống của thơ; thiếu nó, ngôn từ dù hay cũng trở nên vô hồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Yếu tố miêu tả trong “Những cánh buồm” thể hiện ở đâu?", "options": ["A. Tả biển xanh, những cánh buồm trắng no gió ra khơi.", "B. Tả chân dung người cha chi tiết.", "C. Tả trận chiến ác liệt.", "D. Không có yếu tố miêu tả."], "answer": "A", "explain": "Bài thơ tả biển, tả cánh buồm — cảnh đẹp làm nền cho ước mơ và tình cha con.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hoán dụ là gọi tên sự vật bằng tên sự vật khác có quan hệ gần gũi.", "b) Trong “Áo chàm đưa buổi phân li”, “áo chàm” là hoán dụ chỉ người dân Việt Bắc.", "c) Ẩn dụ dựa trên nét tương đồng, hoán dụ dựa trên quan hệ gần gũi.", "d) Hoán dụ và ẩn dụ hoàn toàn giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: đó là điểm phân biệt cốt lõi. d) Sai.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Điệp ngữ là lặp lại từ, ngữ để nhấn mạnh và tạo nhịp điệu.", "b) Điệp cấu trúc “Quê hương là…” nhấn mạnh vẻ đẹp muôn mặt của quê hương.", "c) Điệp ngữ làm cho thơ bị lặp, nhàm chán.", "d) Lặp từ “nhớ” trong “Nhớ sao… nhớ sao…” là điệp ngữ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: điệp ngữ có chủ ý nghệ thuật, tạo nhịp tha thiết. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về tình cha con trong “Những cánh buồm” của Hoàng Trung Thông.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: khung cảnh hai cha con. Thân đoạn: người cha nâng niu ước mơ trong trẻo của con; tình cha ấm áp, thấu hiểu; ước mơ được chắp cánh. Kết đoạn: cảm xúc về cha của mình. Tiêu chí chấm: cảm nhận được sự nâng niu, diễn đạt trong sáng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) kể về ước mơ của chính em và người đã nâng đỡ ước mơ ấy.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: ước mơ của em là gì. Thân đoạn: ước mơ bắt nguồn từ đâu, ai nâng đỡ (cha mẹ, thầy cô), kỉ niệm cụ thể; cảm xúc, quyết tâm. Kết đoạn: lời hứa thực hiện ước mơ. Tiêu chí chấm: chân thành, có chi tiết cụ thể, tránh chung chung."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Bài thơ “Một mình trong mưa” viết về tình cảm nào?", "options": ["A. Tình bạn.", "B. Tình cha thầm lặng, bền bỉ.", "C. Tình yêu quê hương.", "D. Tình thầy trò."], "answer": "B", "explain": "Bài thơ khắc họa người cha một mình trong mưa — tình cha thầm lặng mà sâu nặng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả “Những cánh buồm” là ai?", "options": ["A. Hoàng Trung Thông.", "B. Nguyễn Khoa Điềm.", "C. Thanh Thảo.", "D. Đỗ Trung Lai."], "answer": "A", "explain": "“Những cánh buồm” là bài thơ của Hoàng Trung Thông (1925–1993).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong “Những cánh buồm”, hình ảnh “cánh buồm trắng” tượng trưng cho điều gì?", "options": ["A. Sự giàu sang.", "B. Ước mơ, khát vọng của tuổi thơ.", "C. Nỗi buồn.", "D. Chiến tranh."], "answer": "B", "explain": "Cánh buồm trắng ra khơi là hình ảnh tượng trưng cho ước mơ, khát vọng vươn xa của tuổi thơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh hình ảnh người lính trong “Đồng dao mùa xuân” và “Gặp lá cơm nếp”, em thấy điểm chung nào?", "options": ["A. Cả hai đều là người lính trẻ, giàu tình cảm, sẵn sàng hi sinh vì Tổ quốc.", "B. Cả hai đều đã già yếu.", "C. Cả hai đều sợ chiến đấu.", "D. Không có điểm chung nào."], "answer": "A", "explain": "Cả hai bài thơ đều khắc họa người lính trẻ với tâm hồn đẹp: người ngã xuống vì nước, người ôm nỗi nhớ quê — đều cao đẹp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác dụng của điệp ngữ trong thơ là gì?", "options": ["A. Làm thơ dài dòng, khó hiểu.", "B. Nhấn mạnh ý thơ và tạo nhịp điệu dồn dập, da diết.", "C. Làm mất nhạc điệu.", "D. Không có tác dụng gì."], "answer": "B", "explain": "Lặp lại từ ngữ vừa nhấn mạnh cảm xúc, vừa tạo nhịp điệu — như nhịp đập của con tim.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhân hóa làm cho hình ảnh thơ trở nên như thế nào?", "options": ["A. Khô cứng, xa lạ.", "B. Sinh động, gần gũi như con người, dễ gợi đồng cảm.", "C. Khó hiểu hơn.", "D. Mất đi vẻ đẹp."], "answer": "B", "explain": "Vật được nhân hóa mang tâm hồn con người — gần gũi, sinh động, dễ chạm đến cảm xúc người đọc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Nhân hóa là gán cho sự vật đặc điểm của con người.", "b) Trong “Trăng cứ tròn vành vạnh / kể chi người vô tình”, trăng được nhân hóa.", "c) Nhân hóa làm hình ảnh thơ sinh động, gần gũi.", "d) Nhân hóa là so sánh người với vật."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: trăng như người bạn thủy chung. c) Đúng. d) Sai: nhân hóa là gán tính người cho vật.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Thơ chủ yếu bộc lộ cảm xúc (trữ tình).", "b) Thơ có thể kể lại sự việc (yếu tố tự sự).", "c) Thơ có thể tả cảnh, tả người (yếu tố miêu tả).", "d) Thơ không bao giờ có yếu tố tự sự, miêu tả."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: ví dụ “Đồng dao mùa xuân” kể về người lính. c) Đúng: ví dụ tả biển, cánh buồm. d) Sai.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) so sánh hình ảnh người lính trong “Đồng dao mùa xuân” và “Gặp lá cơm nếp”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: điểm chung — người lính trẻ giàu tình cảm. Thân đoạn: giống nhau (yêu nước, tâm hồn đẹp); khác nhau (người ngã xuống vì Tổ quốc, người ôm nỗi nhớ quê); nghệ thuật mỗi bài. Kết đoạn: cảm phục chung. Tiêu chí chấm: so sánh rõ giống, khác, có dẫn chứng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) phân tích tác dụng của biện pháp ẩn dụ trong hai câu thơ “Thuyền về có nhớ bến chăng / Bến thì một dạ khăng khăng đợi thuyền”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu biện pháp ẩn dụ. Thân đoạn: “thuyền”, “bến” ẩn dụ cho người đi, kẻ ở; tác dụng — kín đáo, giàu sức gợi, diễn tả tình nghĩa thủy chung. Kết đoạn: vẻ đẹp của ẩn dụ. Tiêu chí chấm: chỉ đúng ẩn dụ, phân tích được tác dụng."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Ẩn dụ là biện pháp tu từ như thế nào?", "options": ["A. Gọi tên sự vật này bằng tên sự vật khác có nét tương đồng (không dùng từ “như”).", "B. Lặp lại từ ngữ để nhấn mạnh.", "C. Gán đặc điểm của người cho vật.", "D. Nói quá sự thật lên nhiều lần."], "answer": "A", "explain": "Ẩn dụ: gọi A bằng tên của B dựa trên nét tương đồng, không dùng từ so sánh “như”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hoán dụ là biện pháp tu từ như thế nào?", "options": ["A. Gọi tên sự vật bằng tên sự vật khác có quan hệ gần gũi (bộ phận – toàn thể…).", "B. So sánh hai sự vật với nhau.", "C. Lặp lại âm thanh đầu các từ.", "D. Đảo ngược trật tự từ."], "answer": "A", "explain": "Hoán dụ: lấy tên sự vật gần gũi để gọi tên sự vật khác (ví dụ “áo chàm” chỉ người dân Việt Bắc).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điệp ngữ là biện pháp tu từ như thế nào?", "options": ["A. Lặp lại từ, ngữ để nhấn mạnh ý và tạo nhịp điệu.", "B. Gán hành động của người cho vật.", "C. Dùng từ trái nghĩa.", "D. Bỏ bớt từ ngữ trong câu."], "answer": "A", "explain": "Điệp ngữ là lặp lại từ, ngữ có chủ ý để nhấn mạnh và tạo nhịp điệu cho câu thơ, câu văn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao “Những cánh buồm” vừa có yếu tố tự sự vừa đậm chất trữ tình?", "options": ["A. Vì bài thơ kể chuyện hai cha con dạo biển, đồng thời bộc lộ ước mơ và tình cha con tha thiết.", "B. Vì bài thơ rất dài.", "C. Vì bài thơ có nhiều nhân vật.", "D. Vì bài thơ viết bằng văn xuôi."], "answer": "A", "explain": "Tự sự: kể cuộc dạo chơi; trữ tình: ước mơ của con, tình cha ấm áp — hai yếu tố hòa quyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh nào sau đây giàu sức gợi nhất theo đặc trưng của hình ảnh thơ?", "options": ["A. “Cánh buồm trắng no gió ra khơi.”", "B. “Cái bàn có bốn chân.”", "C. “Hôm nay trời nắng.”", "D. “Tôi đi học lúc 6 giờ.”"], "answer": "A", "explain": "“Cánh buồm trắng” vừa tả thực vừa gợi ước mơ, khát vọng — giàu sức gợi, đúng đặc trưng hình ảnh thơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Qua “Những cánh buồm”, em cảm nhận gì về ước mơ của tuổi thơ?", "options": ["A. Ước mơ của trẻ em thật trong trẻo, đẹp đẽ và cần được người lớn nâng niu.", "B. Ước mơ của trẻ em là viển vông.", "C. Trẻ em không nên ước mơ.", "D. Ước mơ chỉ gây phiền phức."], "answer": "A", "explain": "Ước mơ ra khơi của cậu bé trong trẻo, đẹp đẽ; người cha nâng niu nó — bài thơ trân trọng ước mơ tuổi thơ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Thể thơ lục bát gồm cặp câu 6 chữ và 8 chữ.", "b) Thơ năm chữ mỗi dòng có 5 chữ.", "c) Thơ tự do không gò bó số chữ, số dòng.", "d) “Gặp lá cơm nếp” là thơ lục bát."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bài thơ là thơ năm chữ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Đồng dao” là lời hát dân gian trong trẻo của trẻ em.", "b) Giọng “đồng dao” làm dịu nỗi đau, tôn vinh vẻ đẹp hi sinh.", "c) Bài thơ nhắc nhở lòng biết ơn sự hi sinh của cha anh.", "d) “Đồng dao mùa xuân” ca ngợi chiến tranh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bài thơ tưởng niệm, ngợi ca sự hi sinh chứ không ca ngợi chiến tranh.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) phân tích tác dụng của biện pháp hoán dụ trong câu thơ “Áo chàm đưa buổi phân li / Cầm tay nhau biết nói gì hôm nay”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu hoán dụ. Thân đoạn: “áo chàm” chỉ người dân Việt Bắc; tác dụng — gợi hình ảnh cụ thể, tình cảm gắn bó, bịn rịn lúc chia tay. Kết đoạn: sức gợi của hoán dụ. Tiêu chí chấm: chỉ đúng hoán dụ, phân tích sâu tác dụng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về cái hay của điệp ngữ qua một ví dụ tự chọn.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: khái niệm điệp ngữ. Thân đoạn: dẫn ví dụ (có thể từ bài đã học), phân tích tác dụng nhấn mạnh và tạo nhịp điệu; cảm nhận riêng. Kết đoạn: vai trò của điệp ngữ trong thơ. Tiêu chí chấm: ví dụ chính xác, phân tích được tác dụng."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nhân hóa là biện pháp tu từ như thế nào?", "options": ["A. Gán cho sự vật đặc điểm, hành động, tình cảm của con người.", "B. So sánh người với vật.", "C. Lặp lại từ ngữ.", "D. Dùng từ đồng âm."], "answer": "A", "explain": "Nhân hóa: làm cho vật mang tính người — biết hành động, biết cảm xúc như con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Yếu tố tự sự trong thơ là gì?", "options": ["A. Thơ kể lại một sự việc, câu chuyện làm nền cho cảm xúc.", "B. Thơ chỉ tả cảnh, không kể chuyện.", "C. Thơ trình bày lí luận.", "D. Thơ liệt kê số liệu."], "answer": "A", "explain": "Thơ có thể kể lại sự việc (tự sự) — ví dụ kể về người lính, về cuộc dạo chơi — để làm nền cho cảm xúc trữ tình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Yếu tố miêu tả trong thơ là gì?", "options": ["A. Thơ tả cảnh vật, con người để gợi cảm xúc.", "B. Thơ giải thích khái niệm.", "C. Thơ kể chuyện cười.", "D. Thơ không được miêu tả."], "answer": "A", "explain": "Thơ có thể miêu tả cảnh, người (ví dụ tả biển, cánh buồm) để làm nổi bật cảm xúc trữ tình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài học sâu sắc từ “Đồng dao mùa xuân” là gì?", "options": ["A. Phải biết ơn, trân trọng sự hi sinh của các thế hệ cha anh vì Tổ quốc.", "B. Chiến tranh là điều tốt đẹp.", "C. Tuổi trẻ nên tránh xa lí tưởng.", "D. Mùa xuân chỉ để vui chơi."], "answer": "A", "explain": "Bài thơ nhắc nhở thế hệ hôm nay biết ơn sự hi sinh cao đẹp của người lính cho mùa xuân đất nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tình cảm gia đình được thể hiện trong Bài 2 qua những bài thơ nào?", "options": ["A. “Gặp lá cơm nếp” (tình mẹ), “Một mình trong mưa” và “Những cánh buồm” (tình cha con).", "B. Chỉ “Đồng dao mùa xuân”.", "C. Không bài nào.", "D. Chỉ “Những cánh buồm”."], "answer": "A", "explain": "Ba bài thơ cùng ngợi ca tình thân: nhớ mẹ, tình cha thầm lặng, cha nâng niu ước mơ của con.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau giữa thơ trữ tình và thơ tự sự là gì?", "options": ["A. Thơ trữ tình bộc lộ cảm xúc là chính; thơ tự sự kể chuyện là chính (nhưng thơ nào cũng có thể pha trộn).", "B. Thơ trữ tình không có cảm xúc.", "C. Thơ tự sự không kể chuyện.", "D. Hai loại hoàn toàn tách biệt, không bao giờ pha trộn."], "answer": "A", "explain": "Phân biệt ở yếu tố nào là chính, nhưng thực tế thơ thường hòa quyện tự sự, miêu tả và trữ tình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Người lính trong “Gặp lá cơm nếp” và “Đồng dao mùa xuân” đều trẻ tuổi, giàu tình cảm.", "b) Cả hai bài thơ đều có yếu tố tự sự.", "c) Cả hai bài thơ đều viết theo thể lục bát.", "d) Cả hai bài thơ đều chan chứa cảm xúc trữ tình."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: “Gặp lá cơm nếp” thơ năm chữ, “Đồng dao mùa xuân” thơ tự do. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Tình cha trong “Một mình trong mưa” thầm lặng, bền bỉ.", "b) Tình cha trong “Những cánh buồm” ấm áp, nâng niu ước mơ của con.", "c) Cả hai bài thơ đều ngợi ca tình cha con.", "d) Tình cha trong hai bài thơ đều ồn ào, phô trương."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tình cha hiện lên thầm lặng, tinh tế.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) phân tích tác dụng của biện pháp nhân hóa trong hai câu thơ “Trăng cứ tròn vành vạnh / kể chi người vô tình”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu nhân hóa. Thân đoạn: trăng mang phẩm chất người bạn thủy chung; tương phản với “người vô tình”; tác dụng gợi suy ngẫm, nhắc nhở. Kết đoạn: vẻ đẹp nhân văn. Tiêu chí chấm: chỉ đúng nhân hóa, phân tích được ý nghĩa sâu."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về “khúc nhạc tâm hồn” chung của bốn bài thơ trong Bài 2.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giải thích “khúc nhạc tâm hồn”. Thân đoạn: mỗi bài một khúc nhạc — tráng ca, nhớ thương, trầm lắng, trong trẻo; điểm chung là tình yêu quê hương, gia đình, con người. Kết đoạn: bài học về tâm hồn. Tiêu chí chấm: bao quát 4 bài, cảm nhận sâu sắc."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Bài thơ “Gặp lá cơm nếp” của Thanh Thảo được viết theo thể thơ nào?", "options": ["A. Lục bát.", "B. Thơ năm chữ.", "C. Thơ bảy chữ.", "D. Thơ tự do."], "answer": "B", "explain": "“Gặp lá cơm nếp” là bài thơ năm chữ với nhịp điệu gọn gàng, thiết tha.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cảm xúc chủ đạo trong “Gặp lá cơm nếp” là gì?", "options": ["A. Niềm vui chiến thắng.", "B. Nỗi nhớ mẹ, nhớ quê hương da diết của người lính.", "C. Sự căm thù giặc.", "D. Nỗi buồn thất tình."], "answer": "B", "explain": "Bài thơ là khúc nhạc của nỗi nhớ — nhớ mẹ, nhớ quê, nhớ Tết của người lính xa nhà.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong “Những cánh buồm”, hai cha con đang làm gì?", "options": ["A. Dạo chơi bên bờ biển, ngắm những cánh buồm.", "B. Đánh cá ngoài khơi.", "C. Dựng lều trại.", "D. Thi bơi."], "answer": "A", "explain": "Hai cha con dạo chơi bên bờ biển; người con ngước nhìn cánh buồm và ấp ủ ước mơ ra khơi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Ngày ngày mặt trời đi qua trên lăng / Thấy một mặt trời trong lăng rất đỏ”, “mặt trời” lần hai là biện pháp gì?", "options": ["A. Ẩn dụ (Bác Hồ được ví như mặt trời).", "B. Hoán dụ.", "C. Điệp ngữ.", "D. Nhân hóa."], "answer": "A", "explain": "“Mặt trời trong lăng” ẩn dụ chỉ Bác Hồ — dựa trên nét tương đồng (đều tỏa sáng, sưởi ấm).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Vì sao? Trái Đất nặng ân tình / Nhắc mãi tên Người: Hồ Chí Minh”, “Trái Đất” là biện pháp gì?", "options": ["A. Ẩn dụ.", "B. Hoán dụ (“Trái Đất” chỉ nhân loại).", "C. Điệp ngữ.", "D. Nhân hóa."], "answer": "B", "explain": "“Trái Đất” chỉ nhân loại trên trái đất — lấy vật chứa chỉ người trong đó: hoán dụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu “Con ong làm mật, yêu hoa / Con cá bơi, yêu nước; con chim ca, yêu trời” gợi cho em liên tưởng đến biện pháp nào?", "options": ["A. Nhân hóa (ong, cá, chim mang tình cảm yêu thương như con người).", "B. Ẩn dụ.", "C. Hoán dụ.", "D. Điệp ngữ."], "answer": "A", "explain": "Ong, cá, chim được gán tình cảm “yêu” của con người — nhân hóa làm câu thơ sinh động.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hình ảnh thơ phải giàu sức gợi.", "b) “Cánh buồm trắng” vừa tả thực vừa gợi ước mơ.", "c) “Cái bàn có bốn chân” là hình ảnh thơ giàu sức gợi.", "d) “Mùi cơm nếp” gợi nỗi nhớ mẹ, nhớ quê."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đó chỉ là câu miêu tả thông thường, không có sức gợi. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Vần, nhịp tạo nhạc điệu giúp thơ dễ đọc, dễ nhớ.", "b) Cảm xúc trữ tình là linh hồn của bài thơ.", "c) Đọc thơ cần xác định thể thơ, cảm nhận vần, nhịp, hình ảnh, cảm xúc.", "d) Đọc thơ chỉ cần học thuộc lòng là đủ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: đó là 4 “chìa khóa” đọc thơ. d) Sai: cần cảm nhận và phân tích.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) bày tỏ lòng biết ơn của em đối với các anh hùng liệt sĩ đã hi sinh vì Tổ quốc.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: lòng biết ơn chung. Thân đoạn: liên hệ hình ảnh người lính trong “Đồng dao mùa xuân”; cuộc sống hôm nay được đánh đổi bằng xương máu; trách nhiệm của thế hệ trẻ. Kết đoạn: lời hứa. Tiêu chí chấm: chân thành, có liên hệ văn bản và thực tế."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) kể về một kỉ niệm đẹp giữa em và cha (hoặc mẹ).", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu kỉ niệm. Thân đoạn: kể diễn biến cụ thể, kết hợp tả và biểu cảm; tình cảm cha, mẹ qua chi tiết nhỏ. Kết đoạn: ý nghĩa kỉ niệm. Tiêu chí chấm: ngôi thứ nhất, chi tiết chân thực, cảm xúc rõ."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Người cha trong “Những cánh buồm” thể hiện tình cảm với con như thế nào?", "options": ["A. Nghiêm khắc cấm con ước mơ.", "B. Mỉm cười nâng niu ước mơ trong trẻo của con.", "C. Không quan tâm đến con.", "D. Buộc con phải đi biển."], "answer": "B", "explain": "Người cha mỉm cười, nâng niu ước mơ trong trẻo của con — tình cha ấm áp, thấu hiểu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hình ảnh “mưa” trong “Một mình trong mưa” vừa tả thực vừa gợi điều gì?", "options": ["A. Niềm vui hội hè.", "B. Gian khó của cuộc đời mà người cha lặng lẽ che chở cho con.", "C. Mùa màng bội thu.", "D. Trò chơi của trẻ em."], "answer": "B", "explain": "“Mưa” vừa là cơn mưa thật, vừa tượng trưng cho gian khó — nổi bật sự thầm lặng, bền bỉ của tình cha.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu thơ “Thuyền về có nhớ bến chăng” sử dụng biện pháp tu từ nào?", "options": ["A. Ẩn dụ (thuyền, bến ẩn dụ cho người đi, kẻ ở).", "B. Hoán dụ.", "C. Điệp ngữ.", "D. Nhân hóa."], "answer": "A", "explain": "“Thuyền”, “bến” là ẩn dụ: gọi người đi, kẻ ở bằng hình ảnh có nét tương đồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điệp ngữ “Quê hương là… quê hương là…” trong thơ Đỗ Trung Quân có tác dụng gì?", "options": ["A. Nhấn mạnh vẻ đẹp muôn mặt của quê hương và tạo nhịp điệu tha thiết.", "B. Làm thơ bị lặp, nhàm chán.", "C. Không có tác dụng.", "D. Chỉ để cho đủ chữ."], "answer": "A", "explain": "Điệp cấu trúc “Quê hương là…” nhấn mạnh quê hương hiện diện trong mọi điều thân thuộc, tạo nhịp tha thiết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao “Gặp lá cơm nếp” được xếp vào Bài 2 “Khúc nhạc tâm hồn” dù đã học ở Bài 1?", "options": ["A. Vì hết bài để học.", "B. Vì ở Bài 2, bài thơ được đọc dưới góc nhìn của thơ: vần, nhịp, hình ảnh thơ, cảm xúc trữ tình.", "C. Vì bài thơ không liên quan tuổi thơ.", "D. Vì nhầm lẫn khi biên soạn."], "answer": "B", "explain": "Cùng một văn bản có thể đọc ở nhiều góc độ: Bài 1 thấy chất hồi kí, Bài 2 thấy vẻ đẹp của thơ ca.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh người cha trong “Một mình trong mưa” và “Những cánh buồm” có điểm chung nào?", "options": ["A. Cả hai đều nghiêm khắc, xa cách.", "B. Cả hai đều yêu thương con theo cách thầm lặng, tinh tế và bền bỉ.", "C. Cả hai đều không quan tâm con.", "D. Cả hai đều đi xa nhà."], "answer": "B", "explain": "Một người lặng lẽ che chở trong mưa, một người nâng niu ước mơ của con — đều là tình cha sâu nặng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Trong “Bàn tay ta làm nên tất cả…”, “sỏi đá” là hoán dụ chỉ khó khăn.", "b) Trong “Mặt trời của mẹ, em nằm trên lưng”, em bé được ẩn dụ là mặt trời.", "c) Ẩn dụ và hoán dụ đều là cách gọi tên sự vật bằng tên sự vật khác.", "d) “Sỏi đá” trong câu trên là ẩn dụ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: khác nhau ở cơ sở (tương đồng hay gần gũi). d) Sai: là hoán dụ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Con ong làm mật, yêu hoa…” nhân hóa ong, cá, chim.", "b) “Bão bùng thân bọc lấy thân…” nhân hóa tre.", "c) Nhân hóa làm câu thơ sinh động, gợi đồng cảm.", "d) Nhân hóa là lặp lại từ ngữ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: gán tình cảm “yêu” của người. b) Đúng: tre biết “ôm”, “níu”. c) Đúng. d) Sai: lặp từ ngữ là điệp ngữ.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) phân tích vai trò của yếu tố tự sự và miêu tả trong một bài thơ em thích ở Bài 2.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: chọn bài thơ. Thân đoạn: chỉ ra chi tiết tự sự (kể gì), miêu tả (tả gì); tác dụng làm nền cho cảm xúc trữ tình; cảm xúc chính của bài. Kết đoạn: đánh giá. Tiêu chí chấm: chỉ đúng yếu tố, phân tích được tác dụng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu suy nghĩ của em về ý kiến: “Thơ là khúc nhạc của tâm hồn”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giải thích ý kiến. Thân đoạn: chứng minh qua các bài đã học — thơ có nhạc điệu (vần, nhịp) và ngân lên từ cảm xúc; dẫn chứng cụ thể. Kết đoạn: khẳng định ý kiến đúng đắn. Tiêu chí chấm: lập luận rõ ràng, có dẫn chứng từ bài học."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Câu thơ “Áo chàm đưa buổi phân li” sử dụng biện pháp tu từ nào?", "options": ["A. Ẩn dụ.", "B. Hoán dụ (“áo chàm” chỉ người dân Việt Bắc).", "C. Điệp ngữ.", "D. Nhân hóa."], "answer": "B", "explain": "“Áo chàm” (trang phục) chỉ người dân Việt Bắc — lấy vật gần gũi để gọi con người: hoán dụ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong câu “Nhớ sao… nhớ sao…”, biện pháp tu từ nào được dùng?", "options": ["A. Ẩn dụ.", "B. Hoán dụ.", "C. Điệp ngữ (lặp từ “nhớ”).", "D. Nhân hóa."], "answer": "C", "explain": "Lặp lại từ “nhớ” để nhấn mạnh nỗi nhớ da diết — đó là điệp ngữ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu thơ “Trăng cứ tròn vành vạnh / kể chi người vô tình” sử dụng biện pháp nào?", "options": ["A. Ẩn dụ.", "B. Hoán dụ.", "C. Điệp ngữ.", "D. Nhân hóa (trăng như người bạn thủy chung)."], "answer": "D", "explain": "Trăng được gán phẩm chất của người — thủy chung, “kể chi người vô tình”: nhân hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu thơ “Bão bùng thân bọc lấy thân / Tay ôm tay níu tre gần nhau thêm” sử dụng biện pháp nào là chính?", "options": ["A. Nhân hóa (tre được gán hành động, tình cảm của người: bọc, ôm, níu).", "B. Ẩn dụ.", "C. Hoán dụ.", "D. Điệp ngữ."], "answer": "A", "explain": "Tre “ôm”, “níu” nhau như người — nhân hóa ca ngợi tinh thần đoàn kết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi phân tích một bài thơ, việc đầu tiên em nên làm là gì?", "options": ["A. Đếm số chữ mỗi dòng để xác định thể thơ, đọc kĩ để cảm nhận vần, nhịp, hình ảnh và cảm xúc.", "B. Học thuộc lòng ngay.", "C. Tra tiểu sử nhà thơ thật dài.", "D. Đoán mò ý nghĩa."], "answer": "A", "explain": "Cách đọc thơ hiệu quả: xác định thể thơ, cảm nhận nhạc điệu (vần, nhịp), tìm hình ảnh thơ và nắm cảm xúc chủ đạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lời ước ao được như cánh buồm trắng ra khơi của người con trong “Những cánh buồm” thể hiện điều gì?", "options": ["A. Ước mơ trong trẻo của tuổi thơ: khát vọng vươn xa như cánh buồm.", "B. Cậu bé đòi cha mua thuyền thật.", "C. Cậu bé muốn bỏ nhà ra đi.", "D. Người cha không hiểu con."], "answer": "A", "explain": "Lời ước của cậu bé trong trẻo: muốn được như cánh buồm ra khơi — khát vọng vươn xa của tuổi thơ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Gặp lá cơm nếp” ở Bài 1 được đọc như hồi kí, ở Bài 2 được đọc như thơ.", "b) Cùng một văn bản có thể đọc ở nhiều góc độ khác nhau.", "c) Ở Bài 2, ta chú ý vần, nhịp, hình ảnh thơ của bài thơ.", "d) Bài thơ đã học ở Bài 1 thì không được học lại ở Bài 2."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: học lại dưới góc nhìn mới giúp hiểu sâu hơn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Bốn bài thơ trong Bài 2 đều là những “khúc nhạc” của tâm hồn.", "b) “Đồng dao mùa xuân” là khúc tráng ca về người lính.", "c) “Những cánh buồm” là khúc trong trẻo của ước mơ tuổi thơ.", "d) Các bài thơ trong Bài 2 đều viết về chiến tranh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ “Đồng dao mùa xuân” và “Gặp lá cơm nếp” gắn với chiến tranh; hai bài còn lại về tình cha con.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) về một hình ảnh thơ mà em yêu thích nhất trong Bài 2 và lí do.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: chọn hình ảnh. Thân đoạn: miêu tả, phân tích vẻ đẹp và sức gợi của hình ảnh; cảm xúc của em khi đọc; biện pháp tu từ nếu có. Kết đoạn: vì sao yêu thích. Tiêu chí chấm: phân tích được sức gợi, cảm nhận riêng rõ ràng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu bài học về cách đọc, cảm nhận một bài thơ mà em rút ra sau khi học Bài 2.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: 4 “chìa khóa” đọc thơ. Thân đoạn: vận dụng vào một bài cụ thể (thể thơ, vần nhịp, hình ảnh, cảm xúc); điều em đã làm được và chưa làm được. Kết đoạn: quyết tâm rèn luyện. Tiêu chí chấm: nắm được phương pháp, có ví dụ vận dụng."}]}]}
