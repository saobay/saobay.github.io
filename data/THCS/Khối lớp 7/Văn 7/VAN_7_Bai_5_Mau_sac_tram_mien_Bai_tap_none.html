iết thể thơ khác.", "C. Vì lục bát là thể thơ của nước ngoài.", "D. Vì thể lục bát mượt mà, sâu lắng, phù hợp với tình cảm thiết tha về quê hương."], "answer": "D", "explain": "Lục bát với nhịp điệu mượt mà, sâu lắng rất phù hợp để diễn tả tình cảm thiết tha về quê hương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu thơ “Biển vẫn xanh như màu mắt em”, biện pháp tu từ chính là gì?", "options": ["A. So sánh (biển được so sánh với màu mắt em qua từ “như”).", "B. Nói quá.", "C. Điệp ngữ.", "D. Nhân hóa."], "answer": "A", "explain": "“Như” là dấu hiệu của phép so sánh: biển xanh được so sánh với màu mắt em.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Mùa thu mới” ca ngợi mùa thu của sức sống mới, niềm tin mới.", "b) Thơ biển đảo thể hiện ý thức bảo vệ chủ quyền thiêng liêng của Tổ quốc.", "c) Thơ Tây Bắc gợi tả vẻ đẹp hùng vĩ, thơ mộng của núi rừng.", "d) Ba miền trong thơ hiện lên hoàn toàn giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: mỗi miền một vẻ đẹp riêng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhịp điệu nhanh thường diễn tả cảm xúc sôi nổi, hào hứng.", "b) Nhịp điệu chậm thường diễn tả cảm xúc sâu lắng, trầm tư.", "c) Thể thơ lục bát có câu sáu và câu tám xen kẽ, gieo vần chân.", "d) Đọc thơ không cần chú ý đến hình ảnh thơ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hình ảnh thơ là yếu tố cốt lõi khi đọc thơ.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy sáng tác một đoạn thơ ngắn (4 – 6 câu theo thể lục bát hoặc tự do) về quê hương em, sau đó viết 3 – 5 câu giới thiệu ý tưởng sáng tác của mình.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Đoạn thơ: có hình ảnh quê hương cụ thể, giàu cảm xúc; đúng thể thơ đã chọn (lục bát gieo vần chân, hoặc tự do).\n- Phần giới thiệu: nêu hình ảnh trung tâm, cảm xúc muốn gửi gắm.\nChấm theo: thơ có hình ảnh và cảm xúc chân thành; phần giới thiệu rõ ý tưởng; khuyến khích sự sáng tạo, không khắt khe về niêm luật."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) cảm nhận về vẻ đẹp của biển đảo quê hương qua một bài thơ về biển đảo đã học.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: cảm nhận chung về biển đảo trong thơ.\n- Thân đoạn: vẻ đẹp hùng vĩ, thơ mộng của biển; hình ảnh người lính đảo kiên cường; tình yêu và ý thức bảo vệ chủ quyền.\n- Kết đoạn: niềm tự hào, trách nhiệm của bản thân.\nChấm theo: có hình ảnh tiêu biểu, cảm xúc chân thành, liên hệ trách nhiệm bản thân."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nhịp điệu trong thơ có tác dụng gì?", "options": ["A. Thay thế hoàn toàn cho hình ảnh thơ.", "B. Không có tác dụng gì.", "C. Làm bài thơ dài hơn.", "D. Tạo nhạc tính, góp phần diễn tả cảm xúc của bài thơ."], "answer": "D", "explain": "Nhịp điệu tạo nhạc tính cho thơ và góp phần diễn tả cảm xúc: nhanh — sôi nổi, chậm — sâu lắng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ ngữ gợi hình là gì?", "options": ["A. Từ ngữ gợi lên hình ảnh cụ thể, sinh động trước mắt người đọc.", "B. Từ ngữ chỉ dùng trong văn bản khoa học.", "C. Từ ngữ không có nghĩa gì.", "D. Từ ngữ chỉ cảm xúc trừu tượng."], "answer": "A", "explain": "Từ ngữ gợi hình (từ láy, từ chỉ màu sắc, hình dáng...) gợi lên hình ảnh cụ thể, sinh động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ ngữ gợi cảm là gì?", "options": ["A. Từ ngữ chuyên dùng trong toán học.", "B. Từ ngữ không mang cảm xúc nào.", "C. Từ ngữ khơi gợi cảm xúc, rung động trong lòng người đọc.", "D. Từ ngữ chỉ sự vật cụ thể, nhìn thấy được."], "answer": "C", "explain": "Từ ngữ gợi cảm khơi gợi cảm xúc, rung động — ví dụ các từ chỉ cảm xúc, từ láy diễn tả tâm trạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhịp điệu nhanh, dồn dập trong một đoạn thơ thường diễn tả cảm xúc gì?", "options": ["A. Không diễn tả cảm xúc gì.", "B. Sự sôi nổi, hào hứng, khẩn trương.", "C. Sự buồn ngủ, mệt mỏi.", "D. Sự thờ ơ, lạnh nhạt."], "answer": "B", "explain": "Nhịp nhanh, dồn dập thường diễn tả cảm xúc sôi nổi, hào hứng, khẩn trương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhịp điệu chậm, khoan thai trong thơ thường diễn tả cảm xúc gì?", "options": ["A. Không diễn tả cảm xúc gì.", "B. Sự vội vàng, hấp tấp.", "C. Sự sâu lắng, trầm tư, da diết.", "D. Sự giận dữ."], "answer": "C", "explain": "Nhịp chậm, khoan thai thường diễn tả cảm xúc sâu lắng, trầm tư, da diết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu thơ nào dưới đây có sử dụng biện pháp nhân hóa?", "options": ["A. “Núi cao vời vợi, mây trắng bay.”", "B. “Gió hát lời ru trên cánh đồng quê.” (gió được gán hành động “hát” của con người).", "C. “Trời hôm nay nắng đẹp.”", "D. “Con đường dài hun hút.”"], "answer": "B", "explain": "Gió được gán hành động “hát lời ru” như con người — đó là phép nhân hóa.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Màu sắc trăm miền” gợi vẻ đẹp đa dạng của mọi miền đất nước.", "b) Hình ảnh “chùm khế ngọt” gợi tuổi thơ ngọt ngào gắn với quê hương.", "c) Từ láy trong thơ có tác dụng gợi hình, gợi cảm và tạo nhạc tính.", "d) Thơ và văn xuôi hoàn toàn giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thơ giàu nhạc tính, hình ảnh cô đọng, cảm xúc dồn nén hơn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong “Quê hương”, điệp cấu trúc “Quê hương là...” nhấn mạnh và khắc sâu chủ đề.", "b) “Biển vẫn xanh như màu mắt em” sử dụng biện pháp so sánh.", "c) “Gió hát lời ru trên cánh đồng” sử dụng phép nhân hóa.", "d) Biện pháp tu từ làm thơ kém hay đi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: dấu hiệu “như”. c) Đúng: gió được gán hành động của người. d) Sai: tu từ tăng sức gợi cảm.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) miêu tả vẻ đẹp núi rừng Tây Bắc qua cảm nhận từ các bài thơ đã học.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Vẻ đẹp hùng vĩ: núi cao, đèo dốc, ruộng bậc thang.\n- Vẻ đẹp thơ mộng: mùa hoa ban trắng, sương mờ, bản làng.\n- Con người Tây Bắc chân chất, mến khách (nếu có trong thơ).\n- Cảm xúc: yêu mến, tự hào.\nChấm theo: tái hiện được hai nét đẹp hùng vĩ và thơ mộng, ngôn ngữ giàu hình ảnh."}, {"type": "essay", "level": "VDC", "q": "Phân tích tác dụng của từ láy trong câu thơ: “Sóng rì rào vỗ vào bờ cát trắng.” Viết thành đoạn văn (khoảng 120 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Chỉ ra từ láy “rì rào” (láy tượng thanh).\n- Tác dụng: gợi âm thanh sóng biển chân thực; tạo nhạc tính cho câu thơ; gợi hình ảnh bờ biển sinh động; góp phần diễn tả cảm xúc yêu biển.\nChấm theo: chỉ đúng từ láy, phân tích được tác dụng gợi hình, gợi cảm và nhạc tính."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Bài thơ “Mùa thu mới” viết về đề tài gì?", "options": ["A. Vẻ đẹp mùa thu của đất nước trong thời kì mới, đầy sức sống và niềm tin.", "B. Mùa đông lạnh giá ở miền núi.", "C. Mùa hè sôi động của tuổi trẻ.", "D. Mùa thu buồn bã, ảm đạm của chiến tranh."], "answer": "A", "explain": "“Mùa thu mới” ca ngợi mùa thu của sức sống mới, niềm tin và khát vọng vươn lên của đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thơ viết về biển đảo thường thể hiện tình cảm gì?", "options": ["A. Ước muốn rời xa biển đảo.", "B. Sự thờ ơ với biển đảo.", "C. Tình yêu biển đảo quê hương và ý thức bảo vệ chủ quyền thiêng liêng của Tổ quốc.", "D. Nỗi sợ hãi trước biển cả dữ dội."], "answer": "C", "explain": "Thơ biển đảo gửi gắm tình yêu và ý thức bảo vệ chủ quyền biển đảo thiêng liêng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thơ về núi rừng Tây Bắc thường gợi tả vẻ đẹp nào?", "options": ["A. Vẻ đẹp của sa mạc khô cằn.", "B. Vẻ đẹp của thành phố hiện đại.", "C. Vẻ đẹp của biển cả mênh mông.", "D. Vẻ đẹp vừa hùng vĩ vừa thơ mộng của núi cao, ruộng bậc thang, mùa hoa ban."], "answer": "D", "explain": "Thơ Tây Bắc gợi tả núi cao hùng vĩ, ruộng bậc thang và mùa hoa ban thơ mộng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh “con đò” trong thơ về quê hương thường gợi điều gì?", "options": ["A. Kỉ niệm tuổi thơ, sự gắn bó với bến nước quê nhà và nỗi nhớ người đi xa.", "B. Nỗi sợ sông nước.", "C. Không gợi điều gì.", "D. Sự giàu sang, phú quý."], "answer": "A", "explain": "“Con đò”, “bến nước” là hình ảnh bình dị gợi kỉ niệm tuổi thơ và nỗi nhớ quê.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao hình ảnh thơ về quê hương thường là những hình ảnh bình dị (chùm khế, con diều, bến nước...)?", "options": ["A. Vì hình ảnh bình dị dễ vẽ minh họa.", "B. Vì quy định bắt buộc của thể thơ.", "C. Vì nhà thơ không biết hình ảnh sang trọng.", "D. Vì hình ảnh bình dị gần gũi, gợi kỉ niệm tuổi thơ và tình cảm chân thành."], "answer": "D", "explain": "Hình ảnh bình dị gần gũi với mọi người, dễ gợi kỉ niệm tuổi thơ và tình cảm chân thành.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đọc câu thơ: “Mẹ ru con ngủ bằng lời ca dao.” Biện pháp tu từ nào được sử dụng?", "options": ["A. Nói quá: lời ru được ví như dòng sữa nuôi dưỡng tâm hồn — đây là cách nói giàu hình ảnh.", "B. So sánh.", "C. Nhân hóa lời ca dao.", "D. Không có biện pháp tu từ."], "answer": "A", "explain": "Câu thơ không so sánh trực tiếp mà dùng hình ảnh giàu sức gợi; cách diễn đạt “ru bằng lời ca dao” gợi sự nuôi dưỡng tâm hồn — giàu tính biểu cảm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tình yêu quê hương trong thơ thường gắn với kỉ niệm tuổi thơ.", "b) Hình ảnh bình dị dễ gợi tình cảm chân thành nơi người đọc.", "c) “Quê hương mỗi người chỉ một” khẳng định quê hương là duy nhất, thiêng liêng.", "d) Học thơ quê hương bồi dưỡng sự thờ ơ với đất nước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bồi dưỡng tình yêu và ý thức bảo vệ Tổ quốc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu “Nắng chiều nhuộm vàng mái rạ” giàu sức gợi hình.", "b) Từ “biếc” trong “con diều biếc” vừa gợi hình vừa gợi cảm.", "c) Vần thơ giúp người đọc dễ thuộc, dễ nhớ nhờ nhạc tính.", "d) Nhịp thơ lục bát thường ngắt 3/3 ở mọi câu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: gợi màu sắc, hình ảnh. b) Đúng. c) Đúng. d) Sai: câu lục ngắt 2/2/2, câu bát 2/2/2/2.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 – 200 chữ) nêu suy nghĩ của em về ý nghĩa của hai chữ “quê hương” trong cuộc đời mỗi con người.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: quê hương là cội nguồn thiêng liêng.\n- Thân đoạn: quê hương là nơi chôn nhau cắt rốn, gắn với tuổi thơ; là điểm tựa tinh thần khi đi xa; là động lực để sống tốt, cống hiến (dẫn chứng từ thơ).\n- Kết đoạn: liên hệ bản thân — biết ơn và có trách nhiệm với quê hương.\nChấm theo: lập luận rõ, có dẫn chứng thơ, liên hệ bản thân chân thành."}, {"type": "essay", "level": "VDC", "q": "So sánh hình ảnh quê hương trong bài thơ “Quê hương” (Đỗ Trung Quân) với hình ảnh quê hương trong một bài thơ về miền Nam hoặc miền Trung đã học. Viết thành đoạn văn (khoảng 150 – 200 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Điểm chung: đều là hình ảnh bình dị, gợi kỉ niệm tuổi thơ, thể hiện tình yêu quê hương.\n- Điểm riêng: quê hương miền Bắc (chùm khế, con diều, bến nước...) và quê hương miền Trung, Nam (biển, sông nước, ruộng đồng...) với nét đẹp riêng.\n- Kết: mỗi miền một “màu sắc”, cùng làm nên đất nước.\nChấm theo: so sánh rõ chung và riêng, có dẫn chứng, kết luận sâu sắc."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Ba miền Bắc — Trung — Nam trong thơ hiện lên như thế nào?", "options": ["A. Mỗi miền một vẻ đẹp riêng, thống nhất trong tình yêu đất nước.", "B. Chỉ có miền Bắc đẹp, các miền khác không được nhắc đến.", "C. Ba miền hoàn toàn giống nhau.", "D. Ba miền đối lập, mâu thuẫn nhau."], "answer": "A", "explain": "Mỗi miền mang một vẻ đẹp riêng nhưng cùng hòa chung trong tình yêu đất nước thống nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân vật trữ tình trong thơ là ai?", "options": ["A. Người trực tiếp bộc lộ cảm xúc trong thơ, có thể là tác giả hoặc hóa thân của tác giả.", "B. Người đọc bài thơ.", "C. Nhân vật chỉ xuất hiện trong truyện.", "D. Nhân vật phản diện trong bài thơ."], "answer": "A", "explain": "Nhân vật trữ tình là người trực tiếp bộc lộ cảm xúc, suy nghĩ trong thơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cụm từ “Màu sắc trăm miền” gợi cho em liên tưởng gì?", "options": ["A. Vẻ đẹp đa dạng, rực rỡ của mọi miền đất nước.", "B. Một bức tranh trừu tượng.", "C. Màu sắc của cầu vồng sau mưa.", "D. Trăm loại màu vẽ khác nhau."], "answer": "A", "explain": "“Màu sắc trăm miền” gợi vẻ đẹp đa dạng, phong phú của mọi miền Tổ quốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ láy “rì rào” trong câu thơ tả sóng biển có tác dụng gì?", "options": ["A. Không có tác dụng gì.", "B. Làm câu thơ ngắn đi.", "C. Gợi âm thanh của sóng, tạo nhạc tính và hình ảnh sinh động.", "D. Làm câu thơ khó hiểu."], "answer": "C", "explain": "Từ láy “rì rào” gợi âm thanh sóng biển, vừa gợi hình vừa tạo nhạc tính cho câu thơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong bài thơ “Quê hương”, việc lặp lại cấu trúc “Quê hương là...” có tác dụng gì?", "options": ["A. Làm bài thơ dài dòng, nhàm chán.", "B. Nhấn mạnh, khắc sâu định nghĩa về quê hương qua nhiều hình ảnh, tạo nhịp điệu tha thiết.", "C. Che giấu nội dung bài thơ.", "D. Không có tác dụng gì."], "answer": "B", "explain": "Điệp cấu trúc “Quê hương là...” nhấn mạnh và mở rộng ý nghĩa quê hương qua từng hình ảnh, tạo nhịp tha thiết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu thơ “Trường Sơn đông, Trường Sơn tây” gợi cho em cảm nhận gì về nhịp điệu?", "options": ["A. Nhịp điệu lộn xộn.", "B. Nhịp điệu đối xứng, khỏe khoắn như bước chân hành quân.", "C. Nhịp điệu chậm chạp, buồn bã.", "D. Không có nhịp điệu."], "answer": "B", "explain": "Cấu trúc đối xứng “đông — tây” tạo nhịp điệu khỏe khoắn, gợi hình ảnh núi rừng trùng điệp.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người lính đảo là biểu tượng của ý chí bảo vệ chủ quyền.", "b) “Hoa ban nở trắng rừng” gợi vẻ đẹp tinh khôi của Tây Bắc.", "c) “Cánh cò bay lả” gợi vẻ đẹp bình yên của làng quê.", "d) Thơ về biển đảo thể hiện ước muốn rời xa biển."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thơ biển đảo thể hiện tình yêu và ý thức bảo vệ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phân tích thơ cần cảm nhận hình ảnh, nhịp điệu và tình cảm nhân vật trữ tình.", "b) Cảm nhận thơ nên bắt đầu từ hình ảnh nổi bật và cảm xúc chung.", "c) “Đất nước tôi thon thả giọt đàn bầu” là hình ảnh so sánh độc đáo.", "d) Thể thơ không ảnh hưởng đến cảm xúc bài thơ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thể thơ phù hợp giúp chuyên chở trọn vẹn cảm xúc.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) phân tích vai trò của thể thơ lục bát trong việc thể hiện tình cảm quê hương ở bài thơ “Quê hương”.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Đặc điểm lục bát: câu sáu — tám xen kẽ, vần chân, nhịp 2/2/2 mượt mà.\n- Vai trò: nhịp điệu như lời ru, lời tâm tình; dễ đi vào lòng người; phù hợp với tình cảm thiết tha, sâu lắng về quê hương.\n- Kết: thể thơ và nội dung hòa quyện.\nChấm theo: nêu được đặc điểm thể thơ và phân tích mối quan hệ với cảm xúc."}, {"type": "essay", "level": "VDC", "q": "Hãy viết đoạn văn (khoảng 120 – 150 chữ) bày tỏ cảm xúc của em khi đọc câu thơ: “Quê hương mỗi người chỉ một / Như là chỉ một mẹ thôi.”", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Cảm xúc: xúc động, thấm thía trước triết lí sâu sắc.\n- Phân tích: so sánh quê hương với mẹ — duy nhất, thiêng liêng, không thể thay thế; điệp từ “chỉ một” nhấn mạnh.\n- Suy nghĩ: biết trân trọng, yêu thương quê hương như yêu mẹ.\nChấm theo: cảm xúc chân thành, phân tích được ý nghĩa so sánh, liên hệ bản thân."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Biện pháp tu từ nào thường gặp trong thơ?", "options": ["A. So sánh, nhân hóa, ẩn dụ, điệp ngữ...", "B. Chỉ dùng phép chơi chữ.", "C. Chỉ có phép liệt kê.", "D. Không dùng biện pháp tu từ nào."], "answer": "A", "explain": "Thơ thường dùng so sánh, nhân hóa, ẩn dụ, điệp ngữ... để tăng sức gợi cảm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vần trong thơ có tác dụng gì?", "options": ["A. Thay thế cho nội dung bài thơ.", "B. Không có tác dụng gì.", "C. Làm bài thơ khó đọc hơn.", "D. Tạo nhạc tính, liên kết các câu thơ với nhau."], "answer": "D", "explain": "Vần tạo nhạc tính và liên kết các câu thơ, giúp thơ dễ nhớ, dễ thuộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điệp từ “quê hương” được lặp lại nhiều lần trong bài thơ có tác dụng gì?", "options": ["A. Nhấn mạnh tình cảm sâu đậm với quê hương, tạo nhịp điệu tha thiết.", "B. Làm bài thơ ngắn đi.", "C. Che giấu nội dung bài thơ.", "D. Làm bài thơ nhàm chán."], "answer": "A", "explain": "Điệp từ “quê hương” nhấn mạnh tình cảm sâu đậm, tạo nhịp điệu tha thiết, khắc sâu chủ đề.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh “hoa ban nở trắng rừng” trong thơ Tây Bắc gợi cảm xúc gì?", "options": ["A. Nỗi buồn ảm đạm.", "B. Sự sợ hãi rừng thiêng.", "C. Không gợi cảm xúc gì.", "D. Vẻ đẹp tinh khôi, thơ mộng của núi rừng, gợi niềm yêu mến, tự hào."], "answer": "D", "explain": "Hoa ban trắng gợi vẻ đẹp tinh khôi, thơ mộng của Tây Bắc, khơi niềm yêu mến.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao thơ về biển đảo thường nhắc đến hình ảnh “người lính”?", "options": ["A. Vì thơ về biển đảo không có hình ảnh khác.", "B. Vì người lính thích biển.", "C. Vì chỉ người lính mới biết làm thơ.", "D. Vì người lính là biểu tượng của ý chí bảo vệ chủ quyền biển đảo thiêng liêng."], "answer": "D", "explain": "Người lính đảo là biểu tượng cao đẹp của ý chí kiên cường bảo vệ chủ quyền Tổ quốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đọc câu thơ: “Đất nước tôi thon thả giọt đàn bầu.” (Hữu Thỉnh) — hình ảnh “giọt đàn bầu” gợi điều gì?", "options": ["A. Một loại nhạc cụ đắt tiền.", "B. Không gợi điều gì.", "C. Hình dáng đất nước cong cong như chiếc đàn bầu, gợi vẻ đẹp duyên dáng, thân thương.", "D. Âm thanh của đàn bầu."], "answer": "C", "explain": "“Thon thả giọt đàn bầu” là hình ảnh so sánh độc đáo gợi dáng hình duyên dáng của đất nước.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Quê hương” của Đỗ Trung Quân gửi gắm triết lí về cội nguồn.", "b) Thơ lục bát mượt mà, sâu lắng, hợp với tình cảm thiết tha.", "c) Điệp từ “quê hương” nhấn mạnh tình cảm sâu đậm.", "d) Hình ảnh thơ càng khô khan càng hay."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hình ảnh thơ cần giàu sức gợi cảm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Mùa thu mới” viết về mùa đông lạnh giá.", "b) Nhịp điệu góp phần tạo nhạc tính cho bài thơ.", "c) “Con đò”, “bến nước” gợi kỉ niệm tuổi thơ và nỗi nhớ quê.", "d) Mỗi miền đất nước có một vẻ đẹp riêng trong thơ."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: bài thơ viết về mùa thu. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) về một kỉ niệm tuổi thơ gắn với quê hương em (gợi ý: dùng ít nhất một hình ảnh so sánh).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Kể kỉ niệm cụ thể, sinh động (chơi đùa, giúp bố mẹ, ngắm cảnh...).\n- Có sử dụng ít nhất một hình ảnh so sánh.\n- Gửi gắm tình cảm yêu mến quê hương.\nChấm theo: kỉ niệm cụ thể, có so sánh, cảm xúc chân thành, diễn đạt trong sáng."}, {"type": "essay", "level": "VDC", "q": "Phân tích tác dụng của biện pháp nhân hóa trong câu thơ: “Gió hát lời ru trên cánh đồng quê.” Viết thành đoạn văn (khoảng 120 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Chỉ ra nhân hóa: gió được gán hành động “hát lời ru” của con người.\n- Tác dụng: làm cảnh vật trở nên gần gũi, có hồn; gợi không khí bình yên của làng quê; thể hiện tình yêu quê hương của nhà thơ.\nChấm theo: chỉ đúng biện pháp, phân tích được tác dụng gợi hình và gợi cảm."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Cảm hứng chủ đạo của thơ viết về quê hương là gì?", "options": ["A. Ước muốn quên đi quê hương.", "B. Tình yêu quê hương và niềm tự hào dân tộc.", "C. Nỗi buồn chán về quê hương.", "D. Sự phê phán quê hương."], "answer": "B", "explain": "Thơ về quê hương lấy cảm hứng từ tình yêu và niềm tự hào về đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thơ khác văn xuôi ở điểm cơ bản nào?", "options": ["A. Thơ luôn dài hơn văn xuôi.", "B. Thơ giàu nhạc tính, hình ảnh cô đọng, cảm xúc dồn nén hơn văn xuôi.", "C. Thơ không có cảm xúc.", "D. Thơ và văn xuôi hoàn toàn giống nhau."], "answer": "B", "explain": "Thơ giàu nhạc tính, hình ảnh cô đọng và cảm xúc dồn nén; văn xuôi kể, tả dàn trải hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hình ảnh “chùm khế ngọt” trong bài thơ “Quê hương” gợi tả điều gì?", "options": ["A. Nỗi buồn của tuổi thơ.", "B. Tuổi thơ ngọt ngào gắn bó với quê hương.", "C. Một loại quả chua khó ăn.", "D. Sự giàu có về vật chất."], "answer": "B", "explain": "“Chùm khế ngọt” là hình ảnh bình dị gợi tuổi thơ ngọt ngào gắn bó với quê hương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu thơ nào dưới đây giàu sức gợi hình nhất?", "options": ["A. “Quê hương ở miền Bắc.”", "B. “Tôi thích quê hương.”", "C. “Quê hương rất đẹp.”", "D. “Nắng chiều nhuộm vàng mái rạ, khói bếp bay lên thơm mùi rơm mới.”"], "answer": "D", "explain": "Câu C có màu sắc (“vàng”), hình ảnh (“khói bếp bay lên”), mùi vị (“thơm mùi rơm”) — giàu sức gợi hình nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi phân tích một bài thơ, việc làm nào là quan trọng nhất?", "options": ["A. Đếm chính xác số chữ trong mỗi câu.", "B. Cảm nhận hình ảnh thơ, nhịp điệu và tình cảm của nhân vật trữ tình.", "C. Ghi nhớ năm sinh của nhà thơ.", "D. Chép lại toàn bộ bài thơ."], "answer": "B", "explain": "Phân tích thơ cốt lõi là cảm nhận hình ảnh, nhịp điệu và tình cảm nhân vật trữ tình gửi gắm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “biếc” trong “con diều biếc” vừa gợi hình vừa gợi cảm như thế nào?", "options": ["A. Gợi màu đen tối.", "B. Gợi màu xanh trong của bầu trời, đồng thời gợi cảm giác trong trẻo, tươi đẹp của tuổi thơ.", "C. Chỉ là từ trang trí, không có ý nghĩa.", "D. Gợi sự buồn bã."], "answer": "B", "explain": "“Biếc” gợi màu xanh trong của trời, đồng thời gợi cảm giác trong trẻo của tuổi thơ — vừa gợi hình vừa gợi cảm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Từ “da diết” là từ ngữ gợi cảm.", "b) Từ “xanh biếc” là từ ngữ gợi hình.", "c) So sánh, nhân hóa, ẩn dụ thường xuất hiện trong thơ.", "d) Điệp ngữ trong thơ làm giảm cảm xúc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: điệp ngữ nhấn mạnh cảm xúc, tạo nhịp điệu.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Ôi Tổ quốc ta yêu như máu thịt” thể hiện tình yêu sâu đậm.", "b) Vần liên kết các câu thơ với nhau.", "c) Hình ảnh “chùm khế”, “con diều” đều bình dị, thân thuộc.", "d) Đọc thơ chỉ cần đếm số câu là đủ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cần cảm nhận hình ảnh, nhịp điệu, cảm xúc.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 – 200 chữ) bàn về trách nhiệm của học sinh trong việc bảo vệ chủ quyền biển đảo của Tổ quốc.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: biển đảo là phần máu thịt thiêng liêng của Tổ quốc.\n- Thân đoạn: biểu hiện trách nhiệm (học tốt để xây dựng đất nước, tuyên truyền, tham gia hoạt động hướng về biển đảo, không tin tin giả...).\n- Kết đoạn: liên hệ bản thân, quyết tâm.\nChấm theo: nhận thức đúng, có giải pháp cụ thể, liên hệ bản thân."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) cảm nhận về nhịp điệu của một khổ thơ em yêu thích trong các bài thơ đã học.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Trích dẫn khổ thơ (1 – 2 câu, ngắn gọn).\n- Phân tích nhịp điệu: cách ngắt nhịp, vần, điệp từ...\n- Cảm nhận: nhịp điệu góp phần diễn tả cảm xúc gì (sôi nổi, sâu lắng...).\nChấm theo: trích dẫn ngắn gọn, phân tích được yếu tố nhịp điệu và cảm xúc."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Từ láy trong thơ thường có tác dụng gì?", "options": ["A. Làm câu thơ dài lê thê.", "B. Không có tác dụng gì.", "C. Làm thơ khó hiểu hơn.", "D. Gợi hình, gợi cảm và tạo nhạc tính cho câu thơ."], "answer": "D", "explain": "Từ láy vừa gợi hình ảnh, âm thanh, vừa gợi cảm xúc và tạo nhạc tính cho thơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong câu thơ “Quê hương là con diều biếc, tuổi thơ con thả trên đồng”, tác giả dùng biện pháp tu từ nào?", "options": ["A. Nhân hóa.", "B. Nói quá.", "C. So sánh (quê hương được so sánh với con diều biếc).", "D. Chơi chữ."], "answer": "C", "explain": "Quê hương được so sánh với “con diều biếc” qua từ “là” — đó là phép so sánh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhịp thơ lục bát thường được ngắt như thế nào?", "options": ["A. Ngắt nhịp 3/3 ở mọi câu.", "B. Không ngắt nhịp.", "C. Ngắt nhịp 5/5 ở mọi câu.", "D. Ngắt nhịp 2/2/2 ở câu lục và 2/2/2/2 ở câu bát."], "answer": "D", "explain": "Câu lục thường ngắt 2/2/2, câu bát ngắt 2/2/2/2 (hoặc 4/4), tạo nhịp điệu mượt mà.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao vần thơ giúp người đọc dễ thuộc, dễ nhớ?", "options": ["A. Vì vần làm thơ khó hơn.", "B. Vì vần làm bài thơ ngắn đi.", "C. Vì vần tạo nhạc tính, âm thanh lặp lại có quy luật giúp ghi nhớ dễ dàng.", "D. Vì vần thay thế nội dung."], "answer": "C", "explain": "Vần tạo nhạc tính với âm thanh lặp lại có quy luật, giúp thơ dễ đi vào trí nhớ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh “bến nước, con đò” và “chùm khế ngọt” có điểm chung gì?", "options": ["A. Đều là hình ảnh xa lạ, khó hiểu.", "B. Đều chỉ xuất hiện trong văn xuôi.", "C. Không có điểm chung.", "D. Đều là hình ảnh bình dị, thân thuộc gợi kỉ niệm tuổi thơ và tình yêu quê hương."], "answer": "D", "explain": "Cả hai đều là hình ảnh bình dị, gần gũi, gợi kỉ niệm tuổi thơ và tình yêu quê hương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đọc câu thơ: “Ôi Tổ quốc ta yêu như máu thịt.” Cảm xúc của nhân vật trữ tình là gì?", "options": ["A. Nỗi buồn về Tổ quốc.", "B. Sự thờ ơ với Tổ quốc.", "C. Nỗi sợ hãi Tổ quốc.", "D. Tình yêu Tổ quốc sâu đậm, tha thiết như máu thịt của chính mình."], "answer": "D", "explain": "So sánh tình yêu Tổ quốc “như máu thịt” thể hiện tình cảm sâu đậm, gắn bó máu thịt.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thơ giàu nhạc tính hơn văn xuôi.", "b) Cảm xúc trong thơ thường dồn nén, cô đọng.", "c) “Trường Sơn đông, Trường Sơn tây” có nhịp điệu đối xứng, khỏe khoắn.", "d) Nhân vật trữ tình là người đọc bài thơ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: nhân vật trữ tình là người bộc lộ cảm xúc trong thơ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hình ảnh “biển” tượng trưng cho chủ quyền thiêng liêng.", "b) Tây Bắc hiện lên qua núi cao, ruộng bậc thang, hoa ban.", "c) “Màu sắc trăm miền” là nhan đề phù hợp vì mỗi miền một vẻ đẹp riêng.", "d) Thơ quê hương khơi dậy ước muốn quên quê hương."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thơ quê hương bồi dưỡng tình yêu quê hương.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết 4 câu thơ lục bát về mùa thu quê hương em, sau đó chỉ ra vần và nhịp của đoạn thơ mình vừa sáng tác.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- 4 câu thơ (2 cặp lục — bát) có hình ảnh mùa thu quê hương, giàu cảm xúc.\n- Chỉ ra vần chân (tiếng thứ 6 câu lục vần với tiếng thứ 6 câu bát; tiếng thứ 8 câu bát vần với tiếng thứ 6 câu lục tiếp theo) và nhịp ngắt (2/2/2...).\nChấm theo: thơ có hình ảnh, cảm xúc; chỉ đúng vần và nhịp cơ bản; khuyến khích sáng tạo."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) nêu cảm nhận về hình ảnh người lính đảo qua thơ ca về biển đảo.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Hình ảnh người lính: kiên cường bám đảo, lạc quan, giàu tình đồng đội.\n- Nghệ thuật: hình ảnh, ngôn ngữ khỏe khoắn, giàu cảm xúc.\n- Cảm xúc: khâm phục, biết ơn; ý thức trách nhiệm.\nChấm theo: khắc họa được vẻ đẹp người lính, cảm xúc chân thành."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khi đọc thơ, người đọc cần chú ý điều gì?", "options": ["A. Chỉ cần biết năm sáng tác.", "B. Chỉ cần đếm số câu trong bài.", "C. Hình ảnh thơ, nhịp điệu và cảm xúc của nhân vật trữ tình.", "D. Chỉ cần nhớ tên tác giả."], "answer": "C", "explain": "Đọc thơ cần cảm nhận hình ảnh thơ, nhịp điệu và cảm xúc của nhân vật trữ tình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chữ “mới” trong nhan đề “Mùa thu mới” gợi điều gì?", "options": ["A. Mùa thu chỉ có ở thành phố.", "B. Một mùa thu hoàn toàn xa lạ, không liên quan đến đất nước.", "C. Sức sống mới, niềm tin mới vào tương lai của đất nước.", "D. Mùa thu buồn hơn trước."], "answer": "C", "explain": "“Mới” gợi sức sống mới, niềm tin và khát vọng vươn lên của đất nước trong thời kì mới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hình ảnh “biển” trong thơ về biển đảo thường tượng trưng cho điều gì?", "options": ["A. Chủ quyền thiêng liêng của Tổ quốc cần được bảo vệ.", "B. Nỗi sợ hãi của con người.", "C. Sự xa cách, chia lìa.", "D. Không tượng trưng cho điều gì."], "answer": "A", "explain": "Biển trong thơ về biển đảo tượng trưng cho chủ quyền thiêng liêng và tình yêu Tổ quốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thơ lục bát với nhịp điệu mượt mà phù hợp với cảm xúc nào?", "options": ["A. Cảm xúc hoảng loạn.", "B. Không phù hợp với cảm xúc nào.", "C. Cảm xúc thiết tha, sâu lắng về quê hương, tình mẫu tử...", "D. Cảm xúc giận dữ, gay gắt."], "answer": "C", "explain": "Nhịp điệu mượt mà, sâu lắng của lục bát rất hợp với tình cảm thiết tha về quê hương, gia đình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong thơ, biện pháp điệp ngữ thường có tác dụng gì?", "options": ["A. Làm bài thơ ngắn gọn hơn.", "B. Giảm bớt cảm xúc.", "C. Không có tác dụng.", "D. Nhấn mạnh cảm xúc, tạo nhịp điệu và khắc sâu chủ đề bài thơ."], "answer": "D", "explain": "Điệp ngữ trong thơ nhấn mạnh cảm xúc, tạo nhịp điệu và khắc sâu chủ đề.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao “Màu sắc trăm miền” là nhan đề phù hợp cho bài học về thơ quê hương ba miền?", "options": ["A. Vì bài học chỉ nói về màu sắc.", "B. Vì ngẫu nhiên đặt tên.", "C. Vì bài học dạy vẽ tranh.", "D. Vì mỗi miền đất nước hiện lên với một vẻ đẹp, một “màu sắc” riêng trong thơ."], "answer": "D", "explain": "Mỗi miền hiện lên với vẻ đẹp riêng — những “màu sắc” đa dạng cùng làm nên bức tranh đất nước.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu “Tôi thích quê hương” giàu sức gợi hình.", "b) Từ láy “rì rào” gợi âm thanh sóng biển, tạo nhạc tính.", "c) Thể lục bát phù hợp với tình cảm thiết tha, sâu lắng.", "d) “Quê hương là con diều biếc” sử dụng phép so sánh."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: câu này chung chung, thiếu hình ảnh cụ thể. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhan đề “Mùa thu mới” gợi sức sống mới, niềm tin mới.", "b) “Bến nước, con đò” và “chùm khế ngọt” đều gợi kỉ niệm tuổi thơ.", "c) Phân tích thơ quan trọng nhất là cảm nhận hình ảnh và tình cảm.", "d) Vần thơ khiến thơ khó thuộc hơn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: vần giúp thơ dễ thuộc, dễ nhớ.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Phân tích ý nghĩa của nhan đề “Màu sắc trăm miền”. Viết thành đoạn văn (khoảng 120 – 150 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- “Màu sắc”: vẻ đẹp riêng của mỗi vùng miền; “trăm miền”: sự đa dạng, phong phú.\n- Nhan đề khái quát nội dung: thơ về quê hương ba miền với những vẻ đẹp riêng.\n- Tác dụng: giàu sức gợi, hấp dẫn, khơi trí tò mò.\nChấm theo: giải thích được nghĩa đen và nghĩa bóng của nhan đề, gắn với nội dung bài học."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 – 200 chữ) trình bày suy nghĩ của em về câu nói: “Đi xa mới thấy quê hương trong tim mình lớn đến nhường nào.”", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: đồng tình với ý kiến.\n- Thân đoạn: lí giải — khi xa quê, nỗi nhớ làm ta nhận ra giá trị của những điều bình dị; dẫn chứng từ thơ và thực tế (người xa quê, kiều bào...).\n- Kết đoạn: bài học — hãy trân trọng quê hương ngay khi còn ở bên.\nChấm theo: lập luận thuyết phục, có dẫn chứng, liên hệ bản thân."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Thơ viết về Tây Bắc thường nhắc đến những hình ảnh nào?", "options": ["A. Sa mạc, ốc đảo.", "B. Núi cao, ruộng bậc thang, mùa hoa ban nở.", "C. Biển cả, đảo xa.", "D. Phố thị, nhà cao tầng."], "answer": "B", "explain": "Tây Bắc hiện lên qua núi cao, ruộng bậc thang, hoa ban — vừa hùng vĩ vừa thơ mộng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tình yêu quê hương trong thơ thường gắn liền với điều gì?", "options": ["A. Những kỉ niệm tuổi thơ và hình ảnh bình dị, thân thuộc.", "B. Những chuyến du lịch nước ngoài.", "C. Những thành phố hiện đại xa lạ.", "D. Những món đồ đắt tiền."], "answer": "A", "explain": "Tình yêu quê hương trong thơ thường bắt nguồn từ kỉ niệm tuổi thơ và hình ảnh bình dị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Học thơ về quê hương, đất nước giúp chúng ta bồi dưỡng tình cảm gì?", "options": ["A. Tình yêu, niềm tự hào về quê hương, đất nước và ý thức bảo vệ Tổ quốc.", "B. Sự thờ ơ với quê hương.", "C. Ước muốn sống ở nước ngoài.", "D. Thái độ coi thường truyền thống."], "answer": "A", "explain": "Thơ về quê hương bồi dưỡng tình yêu, niềm tự hào và ý thức bảo vệ Tổ quốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu thơ “Quê hương mỗi người chỉ một” gửi gắm triết lí gì?", "options": ["A. Ai cũng có nhiều quê hương.", "B. Quê hương là duy nhất, thiêng liêng, không thể thay thế trong lòng mỗi người.", "C. Mỗi người chỉ được về quê một lần.", "D. Quê hương không quan trọng."], "answer": "B", "explain": "“Chỉ một” khẳng định quê hương là duy nhất, thiêng liêng, không gì thay thế được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi làm bài cảm nhận về một bài thơ, em nên bắt đầu từ đâu?", "options": ["A. Từ việc kể tiểu sử nhà thơ thật dài.", "B. Từ việc đếm số từ trong bài.", "C. Từ việc cảm nhận hình ảnh thơ nổi bật và cảm xúc chung mà bài thơ gợi lên.", "D. Từ việc chê bai bài thơ."], "answer": "C", "explain": "Cảm nhận thơ nên bắt đầu từ hình ảnh nổi bật và cảm xúc chung, sau đó phân tích sâu hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh “cánh cò bay lả” trong thơ về quê hương gợi điều gì?", "options": ["A. Không gợi điều gì.", "B. Vẻ đẹp bình yên, thơ mộng của làng quê Việt Nam.", "C. Sự nguy hiểm của đồng ruộng.", "D. Nỗi buồn chán."], "answer": "B", "explain": "“Cánh cò bay lả” là hình ảnh quen thuộc gợi vẻ đẹp bình yên, thơ mộng của làng quê.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Gió hát lời ru” là nhân hóa.", "b) “Biển xanh như màu mắt em” là so sánh.", "c) Điệp cấu trúc “Quê hương là...” tạo nhịp điệu tha thiết.", "d) Hình ảnh thơ không hàm chứa cảm xúc của nhà thơ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hình ảnh thơ hàm chứa cảm xúc, suy nghĩ của nhà thơ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Học thơ quê hương bồi dưỡng niềm tự hào dân tộc.", "b) Mỗi bài thơ về quê hương đều là một “màu sắc” của đất nước.", "c) Nhịp nhanh diễn tả sôi nổi, nhịp chậm diễn tả sâu lắng.", "d) “Quê hương” được viết theo thể thơ tự do."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bài thơ viết theo thể lục bát.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy chọn một hình ảnh thơ em ấn tượng nhất trong các bài thơ đã học và viết đoạn văn (khoảng 150 chữ) phân tích vì sao hình ảnh đó gây ấn tượng với em.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Nêu hình ảnh được chọn và bài thơ chứa hình ảnh đó.\n- Phân tích: hình ảnh gợi lên điều gì (gợi hình, gợi cảm); biện pháp tu từ được dùng; cảm xúc của em.\n- Kết: ý nghĩa của hình ảnh với bản thân.\nChấm theo: chọn hình ảnh cụ thể, phân tích được sức gợi, cảm xúc chân thành."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) so sánh nhịp điệu thơ lục bát và thơ tự do qua cảm nhận của em về hai bài thơ đã học.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Lục bát: mượt mà, sâu lắng như lời ru (dẫn chứng “Quê hương”).\n- Thơ tự do: phóng khoáng, mạnh mẽ, nhịp điệu biến đổi theo cảm xúc.\n- Mỗi thể thơ phù hợp với một cung bậc cảm xúc khác nhau.\nChấm theo: so sánh được nét đặc trưng của hai thể thơ, có dẫn chứng, cảm nhận riêng."}]}]}
