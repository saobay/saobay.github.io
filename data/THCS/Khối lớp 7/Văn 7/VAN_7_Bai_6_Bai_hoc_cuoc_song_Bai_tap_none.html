, "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thành ngữ là cụm từ cố định, thường mang nghĩa bóng.", "b) “Ếch ngồi đáy giếng” là thành ngữ chỉ kẻ nông cạn mà kiêu ngạo.", "c) Nghĩa bóng là nghĩa suy ra từ nghĩa đen nhờ liên tưởng.", "d) Khi đọc văn bản luôn hiểu từ theo nghĩa đen."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phải đặt vào ngữ cảnh để xem dùng nghĩa đen hay nghĩa bóng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Từ truyện “Chân, Tay, Tai, Mắt, Miệng”, viết đoạn văn (khoảng 150 chữ) bàn về tinh thần đoàn kết trong tập thể lớp em.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: dẫn từ bài học truyện (các bộ phận nương tựa nhau).\n- Thân đoạn: biểu hiện đoàn kết trong lớp (giúp nhau học tập, chia sẻ công việc...); tác hại của tị nạnh, chia rẽ; dẫn chứng thực tế.\n- Kết đoạn: liên hệ bản thân — sống đoàn kết, có trách nhiệm.\nChấm theo: gắn được bài học truyện với thực tế lớp học, có dẫn chứng, liên hệ bản thân."}, {"type": "essay", "level": "VDC", "q": "Giải thích ý nghĩa của câu tục ngữ “Ăn quả nhớ kẻ trồng cây” và nêu một việc làm thể hiện lòng biết ơn của em. Viết thành đoạn văn (khoảng 150 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Giải thích: nghĩa đen (ăn quả phải nhớ người trồng cây) và nghĩa bóng (hưởng thành quả phải nhớ công ơn người tạo ra).\n- Việc làm thể hiện lòng biết ơn: vâng lời cha mẹ, kính trọng thầy cô, chăm sóc người có công...\n- Cảm nghĩ của bản thân.\nChấm theo: giải thích được hai lớp nghĩa, việc làm cụ thể, cảm xúc chân thành."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Truyện “Chân, Tay, Tai, Mắt, Miệng” đề cao bài học gì?", "options": ["A. Sự ganh đua giữa các bộ phận.", "B. Ai cũng chỉ nên lo cho bản thân.", "C. Miệng là bộ phận quan trọng nhất.", "D. Tinh thần đoàn kết: các bộ phận phải nương tựa nhau mới tồn tại được."], "answer": "D", "explain": "Khi các bộ phận tị nạnh, không ai làm việc thì cả cơ thể suy yếu — bài học về đoàn kết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tục ngữ là gì?", "options": ["A. Bài thơ dài nhiều khổ.", "B. Lời thoại trong vở kịch.", "C. Câu chuyện dài về các nhân vật lịch sử.", "D. Những câu nói ngắn gọn, có vần nhịp, đúc kết kinh nghiệm dân gian."], "answer": "D", "explain": "Tục ngữ là câu nói ngắn gọn, có vần nhịp, đúc kết kinh nghiệm dân gian về thiên nhiên, lao động và con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu tục ngữ “Chuồn chuồn bay thấp thì mưa, bay cao thì nắng, bay vừa thì râm” thuộc nhóm nào?", "options": ["A. Tục ngữ về lao động sản xuất.", "B. Tục ngữ về thiên nhiên (kinh nghiệm dự báo thời tiết).", "C. Tục ngữ về lịch sử.", "D. Tục ngữ về con người và xã hội."], "answer": "B", "explain": "Câu này đúc kết kinh nghiệm quan sát chuồn chuồn để dự báo thời tiết — thuộc nhóm thiên nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các bộ phận Chân, Tay, Tai, Mắt, Miệng trong truyện lại cùng suy yếu?", "options": ["A. Vì chúng tị nạnh nhau, không ai chịu làm việc nên Miệng không được ăn, cả cơ thể suy kiệt.", "B. Vì chúng quá chăm chỉ.", "C. Vì thời tiết xấu.", "D. Vì chúng bị bệnh."], "answer": "A", "explain": "Các bộ phận tị nạnh, so bì; khi Miệng không được ăn thì tất cả cùng suy yếu — bài học về đoàn kết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu tục ngữ “Lá lành đùm lá rách” khuyên chúng ta điều gì?", "options": ["A. Người có điều kiện nên giúp đỡ, che chở người khó khăn (tinh thần tương thân tương ái).", "B. Lá cây rất có ích.", "C. Nên trồng nhiều cây.", "D. Nên gói bánh bằng lá."], "answer": "A", "explain": "“Lá lành đùm lá rách” răn dạy tinh thần tương thân tương ái: giúp đỡ người khó khăn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong truyện ngụ ngôn, biện pháp nhân hóa có tác dụng gì?", "options": ["A. Không có tác dụng gì.", "B. Làm truyện dài hơn.", "C. Giúp câu chuyện sinh động, gần gũi và gửi gắm bài học về con người một cách kín đáo, sâu sắc.", "D. Làm người đọc khó hiểu."], "answer": "C", "explain": "Nhân hóa khiến loài vật như con người, giúp truyện sinh động và bài học thấm thía, kín đáo.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Một cây làm chẳng nên non...” đề cao tinh thần đoàn kết.", "b) “Uống nước nhớ nguồn” răn dạy lòng biết ơn.", "c) “Có công mài sắt, có ngày nên kim” răn dạy tính kiên trì.", "d) Tục ngữ là sáng tác của một nhà văn cụ thể."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tục ngữ là sáng tác của nhân dân lao động qua nhiều đời.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chữ “ngụ” trong “ngụ ngôn” nghĩa là gửi gắm.", "b) Nhân vật ngụ ngôn thường là loài vật, đồ vật được nhân hóa.", "c) Ếch tưởng bầu trời chỉ bằng chiếc vung thể hiện tầm nhìn hạn hẹp.", "d) Ếch bị trâu giẫm vì ếch quá thông minh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ếch trả giá vì kiêu ngạo, chủ quan do hạn chế tầm nhìn.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) giải thích ý nghĩa câu tục ngữ “Một cây làm chẳng nên non, ba cây chụm lại nên hòn núi cao” và liên hệ với hoạt động nhóm trong học tập.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Giải thích: một cây đơn lẻ chẳng thành rừng núi; ba cây chụm lại thành núi cao — sức mạnh của đoàn kết.\n- Liên hệ: học nhóm, làm dự án nhóm hiệu quả hơn làm một mình; mỗi người một thế mạnh bổ sung cho nhau.\n- Bài học: biết hợp tác, chia sẻ.\nChấm theo: giải thích đúng, liên hệ thực tế học tập cụ thể."}, {"type": "essay", "level": "VDC", "q": "Hãy kể sáng tạo lại truyện “Ếch ngồi đáy giếng” theo cách của em (khoảng 150 – 200 chữ), sau đó nêu bài học em muốn gửi gắm.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Kể lại sáng tạo: có thể đổi bối cảnh, thêm chi tiết nhưng giữ được cốt truyện và bài học gốc.\n- Nêu rõ bài học gửi gắm: khiêm tốn, không ngừng mở mang hiểu biết.\nChấm theo: kể sáng tạo, mạch lạc; giữ được tinh thần bài học; khuyến khích trí tưởng tượng."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Câu tục ngữ “Nhất nước, nhì phân, tam cần, tứ giống” thuộc nhóm nào?", "options": ["A. Tục ngữ về lao động sản xuất (kinh nghiệm trồng trọt).", "B. Tục ngữ về tình yêu.", "C. Tục ngữ về lịch sử.", "D. Tục ngữ về thiên nhiên."], "answer": "A", "explain": "Câu này đúc kết kinh nghiệm trồng trọt: nước, phân, cần cù, giống — thuộc nhóm lao động sản xuất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu tục ngữ “Ăn quả nhớ kẻ trồng cây” khuyên chúng ta điều gì?", "options": ["A. Không nên ăn quả của người khác.", "B. Lòng biết ơn với người đã tạo ra thành quả cho mình hưởng.", "C. Nên ăn nhiều hoa quả.", "D. Nên trồng nhiều cây ăn quả."], "answer": "B", "explain": "Câu tục ngữ răn dạy lòng biết ơn: hưởng thành quả phải nhớ công ơn người tạo ra.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu tục ngữ “Một cây làm chẳng nên non, ba cây chụm lại nên hòn núi cao” đề cao điều gì?", "options": ["A. Vẻ đẹp của núi cao.", "B. Sự cô đơn.", "C. Sức mạnh của cá nhân.", "D. Tinh thần đoàn kết: hợp sức nhau sẽ làm nên việc lớn."], "answer": "D", "explain": "Câu tục ngữ khẳng định sức mạnh của đoàn kết: một cây chẳng nên non, ba cây chụm lại thành núi cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu tục ngữ “Đi một ngày đàng, học một sàng khôn” có ý nghĩa gì?", "options": ["A. Sàng rất có ích.", "B. Khuyên mọi người nên đi du lịch nhiều.", "C. Càng đi nhiều, trải nghiệm nhiều thì càng mở mang hiểu biết (trái ngược với “ếch ngồi đáy giếng”).", "D. Đường đi rất dài."], "answer": "C", "explain": "Câu tục ngữ khẳng định: đi nhiều, trải nghiệm nhiều sẽ mở mang hiểu biết — ngược với thói ếch ngồi đáy giếng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bạn học sinh luôn cho rằng mình giỏi nhất lớp, không chịu học hỏi ai. Em sẽ khuyên bạn bằng câu chuyện nào?", "options": ["A. “Chân, Tay, Tai, Mắt, Miệng”.", "B. “Sự tích cây nêu ngày Tết”.", "C. “Thánh Gióng”.", "D. “Ếch ngồi đáy giếng” — để bạn hiểu thói kiêu ngạo, hạn chế tầm nhìn sẽ phải trả giá."], "answer": "D", "explain": "“Ếch ngồi đáy giếng” phê phán đúng thói kiêu ngạo, chủ quan do hiểu biết hạn hẹp của bạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người bạn hay thay đổi ý kiến theo người khác, không có chính kiến. Câu chuyện nào phù hợp để khuyên bạn?", "options": ["A. “Sơn Tinh, Thủy Tinh”.", "B. “Ếch ngồi đáy giếng”.", "C. “Đẽo cày giữa đường” — phê phán kẻ ba phải, thiếu chính kiến.", "D. “Chân, Tay, Tai, Mắt, Miệng”."], "answer": "C", "explain": "“Đẽo cày giữa đường” chính là bài học cho người thiếu chính kiến, nghe ai cũng làm theo.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người thợ trong “Đẽo cày giữa đường” đẽo mãi không xong vì thiếu chính kiến.", "b) Các bộ phận trong “Chân, Tay, Tai, Mắt, Miệng” suy yếu vì tị nạnh nhau.", "c) Phần bài học có khi để người đọc tự suy ngẫm.", "d) Truyện ngụ ngôn luôn có cốt truyện dài, phức tạp."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ngụ ngôn ngắn gọn, tập trung vào một tình huống.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Tay làm hàm nhai, tay quai miệng trễ” phê phán thói lười biếng.", "b) “Lá lành đùm lá rách” răn dạy tinh thần tương thân tương ái.", "c) “Đi một ngày đàng, học một sàng khôn” trái ngược với thói “ếch ngồi đáy giếng”.", "d) “Gần mực thì đen, gần đèn thì rạng” khuyên nên chơi với bạn xấu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: câu này khuyên chọn bạn tốt, môi trường tốt.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) phân tích tác dụng của biện pháp nhân hóa trong truyện ngụ ngôn (lấy dẫn chứng từ một truyện đã học).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Nêu dẫn chứng nhân hóa (ếch biết nói, các bộ phận biết tị nạnh...).\n- Tác dụng: câu chuyện sinh động, hấp dẫn; gần gũi với người đọc; gửi gắm bài học về con người kín đáo, sâu sắc; gây cười mà thấm thía.\nChấm theo: có dẫn chứng cụ thể, phân tích được 2 – 3 tác dụng."}, {"type": "essay", "level": "VDC", "q": "Giải thích ý nghĩa câu tục ngữ “Có công mài sắt, có ngày nên kim” và kể một tấm gương kiên trì mà em biết. Viết thành đoạn văn (khoảng 150 – 200 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Giải thích: kiên trì, nhẫn nại thì việc khó cũng thành công.\n- Tấm gương: có thể là nhân vật lịch sử, người thân, bạn bè hoặc chính bản thân.\n- Bài học cho bản thân: kiên trì trong học tập.\nChấm theo: giải thích đúng, tấm gương cụ thể, liên hệ bản thân."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Thành ngữ là gì?", "options": ["A. Tên riêng của một địa danh.", "B. Cụm từ có cấu tạo cố định, biểu thị ý nghĩa hoàn chỉnh, thường mang nghĩa bóng.", "C. Câu nói dài dòng, lan man.", "D. Từ ngữ chỉ dùng trong khoa học."], "answer": "B", "explain": "Thành ngữ là cụm từ cố định với ý nghĩa hoàn chỉnh, thường là nghĩa bóng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thành ngữ “ếch ngồi đáy giếng” có nghĩa là gì?", "options": ["A. Loài ếch rất thông minh.", "B. Người thích đào giếng.", "C. Kẻ hiểu biết nông cạn, hạn chế mà kiêu ngạo, chủ quan.", "D. Người sống ở nông thôn."], "answer": "C", "explain": "“Ếch ngồi đáy giếng” chỉ kẻ hiểu biết nông cạn mà kiêu ngạo — bắt nguồn từ truyện ngụ ngôn cùng tên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nghĩa bóng của từ là gì?", "options": ["A. Cách phát âm của từ.", "B. Nghĩa không liên quan gì đến từ.", "C. Nghĩa gốc, trực tiếp của từ.", "D. Nghĩa được suy ra từ nghĩa đen trên cơ sở liên tưởng, ví von."], "answer": "D", "explain": "Nghĩa bóng là nghĩa suy ra từ nghĩa đen nhờ liên tưởng, ví von trong quá trình sử dụng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Hắn là kẻ đẽo cày giữa đường, ai nói gì cũng gật”, “đẽo cày giữa đường” mang nghĩa gì?", "options": ["A. Nghĩa đen: đang đẽo cày ở giữa đường.", "B. Nghĩa bóng: kẻ ba phải, thiếu chính kiến.", "C. Nghĩa đen: thợ mộc giỏi.", "D. Không có nghĩa."], "answer": "B", "explain": "“Đẽo cày giữa đường” ở đây là thành ngữ mang nghĩa bóng: kẻ thiếu chính kiến, ba phải.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phần “bài học” có khi không được nói thành lời trong truyện ngụ ngôn?", "options": ["A. Vì không có bài học nào.", "B. Vì tác giả quên viết.", "C. Để người đọc tự suy ngẫm, rút ra bài học — khiến bài học thấm thía và sâu sắc hơn.", "D. Vì truyện quá dài."], "answer": "C", "explain": "Để người đọc tự suy ngẫm khiến bài học thấm thía hơn là nói thẳng ra.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu tục ngữ “Gần mực thì đen, gần đèn thì rạng” khuyên điều gì?", "options": ["A. Môi trường sống ảnh hưởng đến con người — cần chọn bạn tốt, môi trường tốt để học tập.", "B. Mực có màu đen.", "C. Đèn rất sáng.", "D. Nên tránh xa mực và đèn."], "answer": "A", "explain": "Câu tục ngữ răn dạy về ảnh hưởng của môi trường: gần người xấu sẽ hư, gần người tốt sẽ nên.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Đẽo cày giữa đường” là thành ngữ chỉ kẻ ba phải, thiếu chính kiến.", "b) Trong “Hắn đúng là đồ ếch ngồi đáy giếng”, cụm từ mang nghĩa bóng.", "c) Hiểu thành ngữ theo nghĩa đen thường dẫn đến vô lí, sai ngữ cảnh.", "d) Thành ngữ và tục ngữ hoàn toàn giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tục ngữ là câu hoàn chỉnh đúc kết kinh nghiệm; thành ngữ là cụm từ cố định.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tục ngữ ngắn gọn, có vần nhịp nên dễ nhớ, dễ thuộc.", "b) Tục ngữ là “trí khôn của dân gian”.", "c) “Học thầy không tày học bạn” đề cao việc học hỏi từ bạn bè, thực tế.", "d) Tục ngữ không có giá trị gì với đời sống."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tục ngữ chứa kinh nghiệm quý báu cho đời sống.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) nêu suy nghĩ của em về thói “ba phải” trong cuộc sống qua bài học từ truyện “Đẽo cày giữa đường”.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: “ba phải” là gì (nghe ai cũng theo, không có chính kiến).\n- Thân đoạn: biểu hiện trong đời sống (học tập, chọn bạn...); tác hại (việc dở dang, mất niềm tin, bị lợi dụng); nguyên nhân.\n- Kết đoạn: bài học — lắng nghe có chọn lọc, giữ vững chính kiến đúng đắn.\nChấm theo: phân tích được biểu hiện và tác hại, có giải pháp, liên hệ bản thân."}, {"type": "essay", "level": "VDC", "q": "Hãy đặt một nhan đề mới cho truyện “Ếch ngồi đáy giếng” và giải thích vì sao em chọn nhan đề đó. Viết thành đoạn văn (khoảng 120 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Nhan đề mới do HS sáng tạo (ví dụ: “Bài học của chú ếch kiêu ngạo”, “Bầu trời ngoài chiếc vung”...).\n- Giải thích: nhan đề phản ánh được nội dung hoặc bài học truyện; ngắn gọn, hấp dẫn.\nChấm theo: nhan đề phù hợp, giải thích hợp lí; khuyến khích sáng tạo."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Khi muốn hiểu đúng nghĩa của từ trong văn bản, ta cần làm gì?", "options": ["A. Bỏ qua từ đó.", "B. Đoán mò theo cảm tính.", "C. Đặt từ vào ngữ cảnh cụ thể để xem tác giả dùng nghĩa đen hay nghĩa bóng.", "D. Luôn hiểu theo nghĩa đen."], "answer": "C", "explain": "Phải đặt từ vào ngữ cảnh mới xác định được tác giả dùng nghĩa đen hay nghĩa bóng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân vật trong truyện ngụ ngôn thường là ai?", "options": ["A. Các nhà khoa học.", "B. Nhân vật lịch sử có thật.", "C. Các vị thần linh.", "D. Loài vật, đồ vật, cây cối được nhân hóa."], "answer": "D", "explain": "Nhân vật ngụ ngôn thường là loài vật, đồ vật, cây cối được nhân hóa để nói chuyện con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao truyện ngụ ngôn thường ngắn gọn?", "options": ["A. Vì thiếu giấy viết.", "B. Vì người đọc không thích đọc.", "C. Vì tác giả lười viết dài.", "D. Vì truyện tập trung vào một tình huống để gửi gắm một bài học, không cần dài dòng."], "answer": "D", "explain": "Ngụ ngôn ngắn gọn vì chỉ cần một tình huống tiêu biểu để gửi gắm bài học đạo lí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các câu sau, câu nào là tục ngữ?", "options": ["A. “Hôm nay tôi đi học.”", "B. “Trời hôm nay rất đẹp.”", "C. “Bạn Lan rất xinh.”", "D. “Học ăn, học nói, học gói, học mở” (câu nói ngắn gọn, có vần nhịp, đúc kết kinh nghiệm)."], "answer": "D", "explain": "“Học ăn, học nói, học gói, học mở” ngắn gọn, có vần nhịp, đúc kết kinh nghiệm — đúng là tục ngữ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu “Ăn cỗ đi trước, lội nước theo sau” phê phán thói nào?", "options": ["A. Thói dũng cảm.", "B. Thói khôn lỏi, chỉ muốn hưởng lợi, tránh việc khó khăn.", "C. Thói chăm chỉ.", "D. Thói thật thà."], "answer": "B", "explain": "Câu tục ngữ phê phán kẻ khôn lỏi: việc sướng thì tranh trước, việc khó thì lùi sau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói tục ngữ là “trí khôn của dân gian”?", "options": ["A. Vì tục ngữ khó hiểu.", "B. Vì tục ngữ rất dài.", "C. Vì tục ngữ đúc kết kinh nghiệm quý báu của nhân dân lao động qua nhiều đời.", "D. Vì tục ngữ do nhà bác học viết."], "answer": "C", "explain": "Tục ngữ đúc kết kinh nghiệm thực tiễn quý báu của nhân dân qua nhiều thế hệ — xứng đáng là “trí khôn dân gian”.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bài học ngụ ngôn luôn hướng tới con người và cách sống.", "b) Truyện ngụ ngôn ngắn gọn vì chỉ cần một tình huống để gửi gắm bài học.", "c) Nhân hóa giúp truyện sinh động và bài học thấm thía hơn.", "d) “Chân, Tay, Tai, Mắt, Miệng” phê phán tinh thần đoàn kết."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: truyện đề cao tinh thần đoàn kết.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Miệng ăn núi lở” dùng phép nói quá để răn dạy tính tiết kiệm.", "b) “Cái khó ló cái khôn” khẳng định khó khăn hun đúc trí thông minh.", "c) “Nói phải củ cải cũng nghe” đề cao lẽ phải.", "d) “Ăn quả nhớ kẻ trồng cây” khuyên nên ăn nhiều hoa quả."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: câu này răn dạy lòng biết ơn.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 – 200 chữ) bàn về ý nghĩa của lòng biết ơn trong cuộc sống (gợi ý: dùng các câu tục ngữ “Ăn quả nhớ kẻ trồng cây”, “Uống nước nhớ nguồn”).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: lòng biết ơn là đạo lí quý báu của dân tộc.\n- Thân đoạn: giải thích hai câu tục ngữ; biểu hiện của lòng biết ơn; ý nghĩa (gắn kết con người, làm đẹp tâm hồn); phê phán kẻ vô ơn.\n- Kết đoạn: liên hệ bản thân.\nChấm theo: dùng được tục ngữ làm dẫn chứng, lập luận rõ, liên hệ bản thân."}, {"type": "essay", "level": "VDC", "q": "Phân biệt tục ngữ và thành ngữ qua hai ví dụ: “Ăn quả nhớ kẻ trồng cây” và “ếch ngồi đáy giếng”. Viết thành đoạn văn (khoảng 150 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- “Ăn quả nhớ kẻ trồng cây”: câu nói hoàn chỉnh, đúc kết kinh nghiệm, răn dạy đạo lí — là tục ngữ.\n- “Ếch ngồi đáy giếng”: cụm từ cố định, mang nghĩa bóng (kẻ nông cạn mà kiêu ngạo) — là thành ngữ.\n- Điểm khác: tục ngữ là câu hoàn chỉnh; thành ngữ là cụm từ.\nChấm theo: phân biệt đúng qua hai ví dụ, diễn đạt rõ ràng."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Câu tục ngữ nào dưới đây thuộc nhóm về thiên nhiên?", "options": ["A. “Một cây làm chẳng nên non...”.", "B. “Chuồn chuồn bay thấp thì mưa, bay cao thì nắng, bay vừa thì râm”.", "C. “Nhất nước, nhì phân, tam cần, tứ giống”.", "D. “Ăn quả nhớ kẻ trồng cây”."], "answer": "B", "explain": "Câu về chuồn chuồn đúc kết kinh nghiệm dự báo thời tiết — thuộc nhóm thiên nhiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu tục ngữ nào dưới đây thuộc nhóm về lao động sản xuất?", "options": ["A. “Nhất nước, nhì phân, tam cần, tứ giống”.", "B. “Chuồn chuồn bay thấp thì mưa...”.", "C. “Một cây làm chẳng nên non...”.", "D. “Ăn quả nhớ kẻ trồng cây”."], "answer": "A", "explain": "Câu “Nhất nước, nhì phân...” đúc kết kinh nghiệm trồng trọt — thuộc nhóm lao động sản xuất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đặc điểm về hình thức của tục ngữ là gì?", "options": ["A. Ngắn gọn, có vần, có nhịp, dễ nhớ, dễ thuộc.", "B. Viết bằng chữ Hán khó hiểu.", "C. Không có vần điệu gì.", "D. Dài dòng, lan man nhiều ý."], "answer": "A", "explain": "Tục ngữ ngắn gọn, có vần nhịp nên dễ nhớ, dễ thuộc, dễ truyền miệng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong truyện “Ếch ngồi đáy giếng”, con trâu tượng trưng cho điều gì?", "options": ["A. Sức mạnh to lớn của thực tế mà kẻ kiêu ngạo, hạn hẹp không lường tới được.", "B. Loài vật đáng yêu.", "C. Không tượng trưng gì.", "D. Sự hiền lành."], "answer": "A", "explain": "Trâu to lớn tượng trưng cho thực tế rộng lớn mà ếch kiêu ngạo không lường tới — và phải trả giá.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu tục ngữ “Cái khó ló cái khôn” có ý nghĩa gì?", "options": ["A. Khó khăn làm con người ngu đi.", "B. Không nên vượt qua khó khăn.", "C. Khôn ngoan là bẩm sinh.", "D. Khó khăn hun đúc trí thông minh, sự sáng tạo của con người."], "answer": "D", "explain": "Trong khó khăn, con người phải động não tìm cách — từ đó nảy sinh trí khôn, sự sáng tạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi viết đoạn văn nêu bài học từ truyện ngụ ngôn, em cần làm gì?", "options": ["A. Tóm tắt ngắn gọn câu chuyện, nêu rõ bài học và liên hệ với bản thân.", "B. Chép nguyên văn truyện.", "C. Chỉ ghi tên truyện.", "D. Kể lại toàn bộ truyện thật dài."], "answer": "A", "explain": "Đoạn văn cần tóm tắt ngắn gọn, nêu bài học rõ ràng và liên hệ bản thân — đó mới là cảm nhận.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Viết đoạn văn về ngụ ngôn cần tóm tắt ngắn gọn, nêu bài học và liên hệ bản thân.", "b) Đoàn kết giúp tập thể cùng tiến bộ — đúng tinh thần “Chân, Tay, Tai, Mắt, Miệng”.", "c) “Đáy giếng” trong thành ngữ mang nghĩa bóng chỉ hiểu biết nông cạn.", "d) Ếch ngồi đáy giếng là tấm gương để học tập."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ếch là hình ảnh phê phán, để tránh chứ không phải noi theo.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Con trâu trong truyện tượng trưng cho thực tế to lớn mà ếch không lường tới.", "b) “Ếch ngồi đáy giếng” trở thành thành ngữ vì bài học có tính khái quát cao.", "c) Muốn hiểu đúng từ phải đặt vào ngữ cảnh cụ thể.", "d) Truyện ngụ ngôn chỉ dành cho trẻ em."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ngụ ngôn có bài học sâu sắc cho mọi lứa tuổi.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) kể về một lần em hoặc bạn em mắc thói “ếch ngồi đáy giếng” và bài học rút ra.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Kể tình huống cụ thể (chủ quan, kiêu ngạo vì nghĩ mình giỏi; kết quả không như ý...).\n- Bài học: khiêm tốn, không ngừng học hỏi, không chủ quan.\n- Cảm nghĩ sau sự việc.\nChấm theo: tình huống cụ thể, chân thành; rút ra bài học đúng; diễn đạt tự nhiên."}, {"type": "essay", "level": "VDC", "q": "Giải thích vì sao “tầm nhìn hạn hẹp” lại nguy hiểm qua bài học của truyện “Ếch ngồi đáy giếng”. Viết thành đoạn văn (khoảng 150 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- “Tầm nhìn hạn hẹp” là chỉ biết điều nhỏ bé quanh mình mà tưởng là tất cả.\n- Nguy hiểm: dẫn đến kiêu ngạo, chủ quan; đưa ra quyết định sai lầm; bị thực tế “giẫm bẹp” như ếch bị trâu giẫm.\n- Giải pháp: mở mang hiểu biết qua sách vở, trải nghiệm, học hỏi mọi người.\nChấm theo: lí giải được sự nguy hiểm, có dẫn chứng từ truyện, đề ra giải pháp."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tục ngữ được sáng tác bởi ai?", "options": ["A. Một vị vua trong triều đình.", "B. Các nhà khoa học.", "C. Một nhà văn nổi tiếng cụ thể.", "D. Nhân dân lao động qua nhiều đời (văn học dân gian)."], "answer": "D", "explain": "Tục ngữ là sáng tác của nhân dân lao động, được đúc kết và truyền miệng qua nhiều đời.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài học trong truyện ngụ ngôn thường hướng tới đối tượng nào?", "options": ["A. Chỉ trẻ em mẫu giáo.", "B. Máy móc, thiết bị.", "C. Chỉ loài vật.", "D. Con người và cách sống, cách ứng xử trong cuộc sống."], "answer": "D", "explain": "Dù mượn chuyện loài vật, bài học ngụ ngôn luôn hướng tới con người và cách sống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thành ngữ “đẽo cày giữa đường” chỉ kiểu người nào?", "options": ["A. Người chăm chỉ làm việc giữa đường.", "B. Người thích đi đường.", "C. Người thợ mộc khéo tay.", "D. Người thiếu chính kiến, nghe ai cũng làm theo, việc gì cũng dở dang."], "answer": "D", "explain": "“Đẽo cày giữa đường” chỉ kẻ ba phải, thiếu chính kiến — bắt nguồn từ truyện ngụ ngôn cùng tên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tình huống nào dưới đây thể hiện đúng tinh thần của truyện “Chân, Tay, Tai, Mắt, Miệng”?", "options": ["A. Các bạn ganh đua, tị nạnh nhau.", "B. Lớp trưởng làm hết mọi việc một mình.", "C. Các bạn trong lớp đoàn kết giúp nhau học tập, cùng tiến bộ.", "D. Mỗi bạn chỉ lo cho bản thân, không giúp ai."], "answer": "C", "explain": "Đoàn kết giúp nhau cùng tiến bộ chính là tinh thần của truyện: các bộ phận nương tựa nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu “Miệng ăn núi lở” sử dụng biện pháp gì và có ý nghĩa gì?", "options": ["A. Không có ý nghĩa.", "B. Nói quá: ăn tiêu hoang phí thì của cải lớn như núi cũng hết — răn dạy tính tiết kiệm.", "C. So sánh: miệng giống như núi.", "D. Nhân hóa: núi biết lở."], "answer": "B", "explain": "“Ăn núi lở” là nói quá: dù giàu như núi mà ăn tiêu hoang phí cũng hết — răn dạy tiết kiệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao “Ếch ngồi đáy giếng” và “Đẽo cày giữa đường” đều trở thành thành ngữ thông dụng?", "options": ["A. Vì truyện quá dài.", "B. Vì hình ảnh truyện sinh động và bài học có tính khái quát cao, đúng với nhiều tình huống đời sống.", "C. Vì bắt buộc phải dùng.", "D. Vì ngẫu nhiên."], "answer": "B", "explain": "Hình ảnh sinh động cùng bài học khái quát, đúng với nhiều tình huống khiến chúng trở thành thành ngữ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Lòng tham không đáy như giếng khơi” dùng nghĩa bóng của “giếng khơi”.", "b) Tục ngữ về thiên nhiên đúc kết kinh nghiệm dự báo thời tiết, trồng trọt.", "c) Tục ngữ về lao động sản xuất đúc kết kinh nghiệm làm ăn.", "d) Tục ngữ về con người, xã hội răn dạy đạo lí làm người."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn khẳng định đều đúng: ba nhóm tục ngữ với nội dung tương ứng, và “giếng khơi” mang nghĩa bóng chỉ lòng tham vô hạn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Học ngụ ngôn giúp ta rèn tính khiêm tốn, có chính kiến.", "b) Học tục ngữ giúp ta biết ơn, đoàn kết, kiên trì.", "c) “Ăn cỗ đi trước, lội nước theo sau” phê phán thói khôn lỏi.", "d) Bài học trong ngụ ngôn không liên quan đến đời sống hôm nay."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bài học ngụ ngôn vẫn nguyên giá trị trong đời sống hôm nay.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy tưởng tượng và viết đoạn đối thoại (khoảng 10 – 12 câu thoại) giữa Ếch và Trâu sau khi Ếch ra khỏi giếng, qua đó gửi gắm bài học khiêm tốn.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Đối thoại tự nhiên, đúng tính cách: Ếch ban đầu kiêu ngạo, sau biết hối hận; Trâu điềm đạm khuyên răn.\n- Gửi gắm bài học: khiêm tốn, không ngừng mở mang hiểu biết.\nChấm theo: đủ số câu thoại, tính cách nhân vật rõ, bài học được gửi gắm tự nhiên."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) nêu cảm nhận về trí tuệ dân gian qua các câu tục ngữ về thiên nhiên đã học.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Dẫn chứng: “Chuồn chuồn bay thấp thì mưa...” và câu khác.\n- Cảm nhận: cha ông quan sát tinh tế, đúc kết thành kinh nghiệm quý; câu chữ ngắn gọn mà hàm chứa hiểu biết sâu sắc về tự nhiên.\n- Suy nghĩ: trân trọng, giữ gìn kho tàng tục ngữ.\nChấm theo: có dẫn chứng, cảm nhận chân thành, thấy được trí tuệ dân gian."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Từ “đáy giếng” trong thành ngữ “ếch ngồi đáy giếng” mang nghĩa bóng chỉ điều gì?", "options": ["A. Một cái giếng thật ở nông thôn.", "B. Nơi ở của loài ếch.", "C. Nước giếng rất trong.", "D. Tầm hiểu biết nông cạn, hạn hẹp."], "answer": "D", "explain": "“Đáy giếng” mang nghĩa bóng chỉ tầm hiểu biết nông cạn, hạn hẹp, cách biệt với thế giới rộng lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu tục ngữ “Có công mài sắt, có ngày nên kim” khuyên điều gì?", "options": ["A. Kim loại rất cứng.", "B. Không nên học hành.", "C. Tính kiên trì, nhẫn nại sẽ dẫn đến thành công.", "D. Nên bỏ nghề rèn sắt."], "answer": "C", "explain": "Câu tục ngữ răn dạy: kiên trì, nhẫn nại mài giũa thì việc khó cũng thành công.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu tục ngữ “Uống nước nhớ nguồn” có ý nghĩa gần với câu nào?", "options": ["A. “Chuồn chuồn bay thấp thì mưa...”.", "B. “Ăn quả nhớ kẻ trồng cây” (cùng răn dạy lòng biết ơn).", "C. “Nhất nước, nhì phân, tam cần, tứ giống”.", "D. “Một cây làm chẳng nên non...”."], "answer": "B", "explain": "“Uống nước nhớ nguồn” và “Ăn quả nhớ kẻ trồng cây” đều răn dạy lòng biết ơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Lòng tham không đáy như giếng khơi”, từ “giếng khơi” gợi liên tưởng gì?", "options": ["A. Nghĩa đen: một cái giếng thật.", "B. Nước giếng rất mát.", "C. Không gợi gì.", "D. Nghĩa bóng: lòng tham vô hạn, không bao giờ đầy như giếng sâu không thấy đáy."], "answer": "D", "explain": "“Giếng khơi” sâu không thấy đáy được dùng để ví lòng tham vô hạn — nghĩa bóng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu tục ngữ “Học thầy không tày học bạn” đề cao điều gì?", "options": ["A. Không cần học.", "B. Việc học hỏi từ bạn bè, từ thực tế xung quanh cũng rất quan trọng.", "C. Thầy giáo không quan trọng.", "D. Chỉ nên học với bạn."], "answer": "B", "explain": "Câu tục ngữ đề cao việc học hỏi từ bạn bè, từ thực tế — bên cạnh việc học thầy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của truyện ngụ ngôn và tục ngữ là gì?", "options": ["A. Đều là truyện dài nhiều chương.", "B. Đều gửi gắm bài học, kinh nghiệm sống một cách ngắn gọn, dễ nhớ.", "C. Đều do một tác giả viết.", "D. Đều viết bằng thơ."], "answer": "B", "explain": "Cả hai đều ngắn gọn, dễ nhớ và gửi gắm bài học, kinh nghiệm sống quý báu.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Học ăn, học nói, học gói, học mở” là một câu tục ngữ.", "b) Tục ngữ được truyền miệng qua nhiều đời.", "c) Điểm chung của ngụ ngôn và tục ngữ là gửi gắm bài học ngắn gọn, dễ nhớ.", "d) Thành ngữ là câu nói hoàn chỉnh đúc kết kinh nghiệm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đó là đặc điểm của tục ngữ; thành ngữ là cụm từ cố định.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người thiếu chính kiến nên học bài học từ “Đẽo cày giữa đường”.", "b) Người kiêu ngạo, chủ quan nên suy ngẫm “Ếch ngồi đáy giếng”.", "c) Tập thể thiếu đoàn kết nên đọc “Chân, Tay, Tai, Mắt, Miệng”.", "d) Truyện ngụ ngôn không thể dùng để khuyên răn ai."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c) Đúng: mỗi truyện là bài học cho một thói xấu. d) Sai: ngụ ngôn sinh ra để răn dạy con người.", "points": 1}, {"type": "essay", "level": "VDC", "q": "So sánh bài học của truyện “Ếch ngồi đáy giếng” và câu tục ngữ “Đi một ngày đàng, học một sàng khôn”. Viết thành đoạn văn (khoảng 150 – 200 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Điểm chung: đều khuyên con người mở mang hiểu biết, không bó hẹp trong không gian chật hẹp.\n- Điểm khác: truyện phê phán thói xấu (kiêu ngạo, hạn hẹp) bằng hình ảnh sinh động; tục ngữ khẳng định mặt tích cực (đi nhiều học nhiều) bằng lời răn ngắn gọn.\n- Kết: hai cách nói bổ sung cho nhau.\nChấm theo: so sánh được chung và riêng, có dẫn chứng, kết luận sâu sắc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) phân tích kết cấu hai phần (phần truyện và phần bài học) của một truyện ngụ ngôn em yêu thích.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Nêu tên truyện và tóm tắt ngắn gọn phần truyện.\n- Chỉ ra phần bài học (được nói thành lời hoặc ngầm hiểu).\n- Phân tích: hai phần gắn bó — câu chuyện sinh động làm nền cho bài học; bài học nâng câu chuyện lên tầm triết lí.\nChấm theo: chỉ rõ hai phần, phân tích được mối quan hệ giữa chúng."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Học truyện ngụ ngôn và tục ngữ giúp chúng ta điều gì?", "options": ["A. Biết cách đẽo cày.", "B. Không giúp ích gì.", "C. Biết cách sống đẹp: khiêm tốn, có chính kiến, đoàn kết, biết ơn...", "D. Biết cách đào giếng."], "answer": "C", "explain": "Ngụ ngôn và tục ngữ dạy ta cách sống: khiêm tốn, có chính kiến, đoàn kết, biết ơn, kiên trì...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điểm khác nhau cơ bản giữa tục ngữ và thành ngữ là gì?", "options": ["A. Thành ngữ do nhân dân sáng tác, tục ngữ do nhà văn sáng tác.", "B. Không có điểm khác nhau.", "C. Tục ngữ là câu nói hoàn chỉnh đúc kết kinh nghiệm; thành ngữ là cụm từ cố định thường mang nghĩa bóng.", "D. Tục ngữ dài hơn thành ngữ rất nhiều."], "answer": "C", "explain": "Tục ngữ là câu hoàn chỉnh đúc kết kinh nghiệm; thành ngữ là cụm từ cố định, thường mang nghĩa bóng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phần “bài học” trong truyện ngụ ngôn có đặc điểm gì?", "options": ["A. Luôn được nói thành lời một cách rõ ràng.", "B. Có thể nói thành lời hoặc để người đọc tự suy ngẫm rút ra.", "C. Không bao giờ tồn tại.", "D. Chỉ dành cho người lớn."], "answer": "B", "explain": "Phần bài học có khi được nói rõ, có khi để người đọc tự suy ngẫm — càng khiến truyện sâu sắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bạn trong nhóm luôn tị nạnh, không chịu hợp tác khiến cả nhóm bị ảnh hưởng. Em rút ra bài học gì từ truyện “Chân, Tay, Tai, Mắt, Miệng”?", "options": ["A. Kệ bạn ấy, không quan tâm.", "B. Trong tập thể phải đoàn kết, mỗi người làm tốt việc của mình vì lợi ích chung.", "C. Nên tị nạnh lại với bạn.", "D. Rời khỏi nhóm."], "answer": "B", "explain": "Truyện dạy: các bộ phận phải nương tựa, làm tốt việc mình thì cơ thể mới khỏe — tập thể cần đoàn kết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu “Nói phải củ cải cũng nghe” có ý nghĩa gì?", "options": ["A. Củ cải biết nghe lời.", "B. Lời nói đúng, có lí thì ai cũng phải nghe theo, tin theo.", "C. Nên nói chuyện với củ cải.", "D. Củ cải rất ngon."], "answer": "B", "explain": "Câu tục ngữ đề cao lẽ phải: lời nói đúng đắn, có lí thì mọi người đều tin theo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao khi dùng thành ngữ, ta phải hiểu nghĩa bóng của nó?", "options": ["A. Vì nghĩa đen luôn đúng.", "B. Không cần hiểu.", "C. Vì nghĩa đen của thành ngữ thường vô lí hoặc không phù hợp ngữ cảnh.", "D. Vì thành ngữ không có nghĩa bóng."], "answer": "C", "explain": "Thành ngữ thường mang nghĩa bóng; hiểu theo nghĩa đen sẽ vô lí, sai ngữ cảnh (ví dụ “miệng ăn núi lở”).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Nhất nước, nhì phân, tam cần, tứ giống” là kinh nghiệm trồng trọt.", "b) “Chuồn chuồn bay thấp thì mưa...” là kinh nghiệm dự báo thời tiết.", "c) Cả hai câu trên đều là tục ngữ về thiên nhiên.", "d) Tục ngữ giúp con người lao động hiệu quả hơn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: câu thứ nhất thuộc nhóm lao động sản xuất. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong truyện ngụ ngôn, loài vật biết nói như người nhờ phép nhân hóa.", "b) Kết cấu hai phần giúp bài học nổi bật sau câu chuyện.", "c) “Gửi gắm kín đáo” là đặc trưng của truyện ngụ ngôn.", "d) Truyện ngụ ngôn và truyện cổ tích hoàn toàn giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cổ tích có yếu tố hoang đường, ngụ ngôn mượn chuyện để răn dạy.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết một câu tục ngữ mới do em sáng tạo đúc kết một kinh nghiệm học tập, sau đó giải thích ý nghĩa của nó trong đoạn văn (khoảng 120 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Câu tục ngữ sáng tạo: ngắn gọn, có vần nhịp, đúc kết kinh nghiệm học tập (ví dụ về chăm chỉ, hỏi bạn, ôn bài...).\n- Giải thích: ý nghĩa của câu tục ngữ; vì sao kinh nghiệm đó đúng.\nChấm theo: câu sáng tạo đúng đặc điểm tục ngữ (ngắn gọn, có vần nhịp); giải thích hợp lí; khuyến khích sáng tạo."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 – 200 chữ) trình bày suy nghĩ của em về ý kiến: “Học từ sách vở chưa đủ, phải học từ cuộc sống.” (Gợi ý: liên hệ các câu tục ngữ, truyện ngụ ngôn đã học.)", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: đồng tình với ý kiến.\n- Thân đoạn: lí giải — sách vở cho tri thức, cuộc sống cho kinh nghiệm (dẫn chứng: tục ngữ là kinh nghiệm thực tiễn; bài học ngụ ngôn từ quan sát đời sống); cần kết hợp cả hai.\n- Kết đoạn: liên hệ bản thân — chăm học và chăm trải nghiệm.\nChấm theo: lập luận thuyết phục, có dẫn chứng từ bài học, liên hệ bản thân."}]}]}
