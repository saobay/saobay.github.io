ộc hoàn toàn không có thật.", "C. Bạch tuộc khổng lồ đã tuyệt chủng từ lâu.", "D. Bạch tuộc chỉ sống trên cạn."], "answer": "A", "explain": "Bạch tuộc là loài có thật; tác giả phóng đại kích thước và sức mạnh của nó thành quái vật — đó là cách kết hợp hiện thực khoa học với tưởng tượng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Chất làm gỉ” là sáng tác của nhà văn Mĩ Rây Brét-bơ-ry.", "b) Truyện đặt ra những suy ngẫm về thế giới tương lai và rô-bốt.", "c) Truyện hoàn toàn không liên quan gì đến khoa học kĩ thuật.", "d) “Chất làm gỉ” là truyện cổ tích dân gian."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng: rô-bốt trong tương lai là trung tâm suy ngẫm của truyện. c) Sai: truyện gắn chặt với tiến bộ khoa học kĩ thuật. d) Sai: đây là truyện khoa học viễn tưởng hiện đại.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu hỏi tu từ có hình thức của câu hỏi nhưng không nhằm tìm câu trả lời.", "b) “Ai mà chẳng yêu Tổ quốc mình?” là câu hỏi tu từ.", "c) Câu hỏi tu từ luôn phải kết thúc bằng dấu chấm hỏi.", "d) Câu hỏi tu từ và câu hỏi thông thường có mục đích giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đó là đặc điểm nhận dạng quan trọng nhất. b) Đúng: câu này nhằm khẳng định ai cũng yêu Tổ quốc. c) Đúng: giữ hình thức câu hỏi với dấu chấm hỏi. d) Sai: câu hỏi thông thường cần câu trả lời, câu hỏi tu từ thì không.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) làm rõ vai trò của tri thức khoa học trong truyện “Bạch tuộc”.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu vai trò chung của tri thức khoa học trong truyện khoa học viễn tưởng. Thân đoạn: tri thức về tàu ngầm, điện năng, sinh vật biển làm cho tưởng tượng đáng tin; tạo sự hấp dẫn, thuyết phục. Kết đoạn: khoa học là bệ đỡ cho đôi cánh tưởng tượng. Tiêu chí: có lí lẽ và liên hệ chi tiết trong văn bản."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) trình bày suy nghĩ của em về thông điệp của truyện “Chất làm gỉ” đối với thế giới tương lai.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu truyện và vấn đề đặt ra (con người và rô-bốt). Thân đoạn: phân tích suy ngẫm về ranh giới người – máy; cảnh báo về việc lạm dụng công nghệ; khẳng định giá trị tình cảm con người không thể thay thế. Kết đoạn: rút ra bài học cho hôm nay. Tiêu chí: có chính kiến riêng, lập luận rõ ràng."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Giuyn Véc-nơ là nhà văn của nước nào?", "options": ["A. Mĩ.", "B. Anh.", "C. Pháp.", "D. Đức."], "answer": "C", "explain": "Giuyn Véc-nơ là nhà văn người Pháp, được xem là một trong những người đặt nền móng cho thể loại truyện khoa học viễn tưởng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Văn bản “Bạch tuộc” được trích từ tác phẩm nào?", "options": ["A. “Chất làm gỉ”.", "B. “Hai vạn dặm dưới đáy biển”.", "C. “Vòng quanh thế giới trong 80 ngày”.", "D. “Hành trình vào tâm Trái Đất”."], "answer": "B", "explain": "Văn bản “Bạch tuộc” trích từ tiểu thuyết “Hai vạn dặm dưới đáy biển” của Giuyn Véc-nơ, kể về cuộc chiến với bạch tuộc khổng lồ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Con tàu ngầm trong văn bản “Bạch tuộc” có tên là gì?", "options": ["A. Nau-ti-lux.", "B. Ti-ta-nic.", "C. Hoa Tiêu.", "D. Đại Bàng."], "answer": "A", "explain": "Nau-ti-lux (Nautilus) là con tàu ngầm chạy bằng điện do thuyền trưởng Nê-mô chế tạo và chỉ huy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Rây Brét-bơ-ry đặt rô-bốt vào trung tâm câu chuyện “Chất làm gỉ”?", "options": ["A. Để quảng cáo đồ chơi trẻ em.", "B. Để người đọc suy ngẫm về ranh giới người – máy trong tương lai.", "C. Vì tác giả không biết viết về con người.", "D. Để kể chuyện hài hước đơn thuần."], "answer": "B", "explain": "Rô-bốt là phương tiện nghệ thuật để tác giả đặt câu hỏi: khi máy móc ngày càng giống người, điều gì làm nên giá trị con người?", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông điệp của truyện khoa học viễn tưởng về khoa học là gì?", "options": ["A. Khoa học là sức mạnh nhưng cần được dùng để phục vụ con người.", "B. Khoa học chỉ mang lại tai họa.", "C. Con người nên từ bỏ mọi phát minh.", "D. Khoa học không liên quan gì đến văn học."], "answer": "A", "explain": "Truyện khoa học viễn tưởng vừa ca ngợi sức mạnh khoa học vừa cảnh báo: khoa học phải phục vụ hạnh phúc con người, nếu không sẽ thành hiểm họa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết “Tàu Nau-ti-lux lặn sâu hai vạn dặm” thuộc yếu tố nào của truyện?", "options": ["A. Yếu tố hiện thực lịch sử.", "B. Yếu tố khoa học giả tưởng.", "C. Yếu tố thần thoại.", "D. Yếu tố tự sự dân gian."], "answer": "B", "explain": "Khả năng lặn sâu phi thường của con tàu là tưởng tượng dựa trên kĩ thuật tàu ngầm — yếu tố khoa học giả tưởng đặc trưng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu cảm thán bộc lộ trực tiếp cảm xúc của người nói.", "b) Cuối câu cảm thán thường đặt dấu chấm than.", "c) Dấu chấm than còn dùng cho câu cầu khiến thể hiện cảm xúc mạnh.", "d) Mọi câu có dấu chấm than đều là câu cảm thán."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: ví dụ “Cẩn thận!” vừa cầu khiến vừa bộc lộ cảm xúc. d) Sai: câu cầu khiến hoặc câu kể cảm xúc mạnh cũng dùng dấu chấm than.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nê-mô là thuyền trưởng tài ba, am hiểu đại dương.", "b) A-rôn-nắc là nhà khoa học ham tìm hiểu sinh vật biển.", "c) Nét Len là thợ săn cá voi dũng cảm.", "d) Công-xây là thuyền trưởng của tàu Nau-ti-lux."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: giáo sư A-rôn-nắc là nhà sinh vật học biển. c) Đúng. d) Sai: Công-xây chỉ là người hầu trung thành của giáo sư A-rôn-nắc.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) nêu cảm nhận của em về cuộc chiến giữa con người và bạch tuộc khổng lồ.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu trận chiến — đỉnh điểm kịch tính của văn bản. Thân đoạn: sự hung dữ của bầy bạch tuộc; lòng dũng cảm, tinh thần đồng đội của các nhân vật; cảm xúc hồi hộp của người đọc. Kết đoạn: ca ngợi bản lĩnh con người. Tiêu chí: có cảm xúc chân thành, dùng từ ngữ gợi hình."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) giải thích vì sao truyện khoa học viễn tưởng có sức hấp dẫn đặc biệt với bạn đọc trẻ tuổi.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu nhận xét chung về sức hấp dẫn. Thân đoạn: thỏa mãn trí tò mò; mở ra thế giới mới lạ; nuôi dưỡng ước mơ khám phá, làm khoa học; vừa giải trí vừa học hỏi. Kết đoạn: khẳng định giá trị của thể loại. Tiêu chí: lí lẽ thuyết phục, có ví dụ."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Thuyền trưởng của tàu ngầm Nau-ti-lux là ai?", "options": ["A. Nét Len.", "B. Công-xây.", "C. Nê-mô.", "D. A-rôn-nắc."], "answer": "C", "explain": "Thuyền trưởng Nê-mô là nhân vật huyền thoại: thiên tài khoa học, am hiểu đại dương, chỉ huy tàu Nau-ti-lux.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân vật kể chuyện, người dẫn chuyện trong “Hai vạn dặm dưới đáy biển” là ai?", "options": ["A. Giáo sư A-rôn-nắc.", "B. Thợ săn Nét Len.", "C. Thuyền trưởng Nê-mô.", "D. Người hầu Công-xây."], "answer": "A", "explain": "Giáo sư A-rôn-nắc, nhà sinh vật học biển, là người kể chuyện ở ngôi thứ nhất trong tác phẩm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người hầu trung thành, tận tụy của giáo sư A-rôn-nắc tên là gì?", "options": ["A. Nét Len.", "B. Công-xây.", "C. Nê-mô.", "D. Fa-ra-go."], "answer": "B", "explain": "Công-xây (Conseil) là người hầu trung thành, ham học hỏi, luôn đồng hành cùng giáo sư A-rôn-nắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu “Ai dám bảo đại dương không còn bí ẩn?” thuộc loại câu gì?", "options": ["A. Câu hỏi thông thường cần câu trả lời.", "B. Câu hỏi tu từ.", "C. Câu cầu khiến.", "D. Câu kể."], "answer": "B", "explain": "Người nói không chờ ai trả lời mà nhằm khẳng định: đại dương vẫn còn đầy bí ẩn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác dụng của câu hỏi tu từ “Ai dám bảo đại dương không còn bí ẩn?” là", "options": ["A. hỏi để biết thêm thông tin về đại dương.", "B. nhấn mạnh, khẳng định đại dương còn nhiều bí ẩn.", "C. ra lệnh cho người nghe đi khám phá.", "D. kể lại một sự việc đã xảy ra."], "answer": "B", "explain": "Câu hỏi tu từ ở đây có tác dụng nhấn mạnh niềm tin rằng đại dương vẫn ẩn chứa vô vàn điều bí ẩn chờ khám phá.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu “Tuyệt vời làm sao, đáy biển rực rỡ!” thuộc loại câu gì và bộc lộ điều gì?", "options": ["A. Câu kể, thuật lại sự việc.", "B. Câu cảm thán, bộc lộ sự trầm trồ, thán phục.", "C. Câu hỏi, cần câu trả lời.", "D. Câu cầu khiến, ra lệnh."], "answer": "B", "explain": "Câu có từ cảm thán “làm sao”, dấu chấm than, bộc lộ trực tiếp cảm xúc trầm trồ trước vẻ đẹp đáy biển.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Truyện khoa học viễn tưởng kết hợp yếu tố hiện thực khoa học và tưởng tượng.", "b) Ngôn ngữ truyện của Véc-nơ giàu tri thức khoa học về biển.", "c) Văn bản “Bạch tuộc” chỉ kể chuyện, không hề miêu tả.", "d) Yếu tố giả tưởng làm giảm tính hấp dẫn của truyện."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: đó là bản chất thể loại. b) Đúng: Véc-nơ đưa nhiều tri thức hải dương học vào truyện. c) Sai: tác giả miêu tả rất sinh động ngoại hình bạch tuộc và cảnh chiến đấu. d) Sai: giả tưởng chính là nguồn hấp dẫn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hai văn bản trong bài đều đề cao trí tuệ và lòng dũng cảm của con người.", "b) Truyện khoa học viễn tưởng khơi gợi ước mơ khám phá khoa học.", "c) “Bạch tuộc” ca ngợi sự khuất phục của con người trước thiên nhiên.", "d) Khoa học trong truyện khoa học viễn tưởng luôn được miêu tả tiêu cực."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng. c) Sai: truyện ca ngợi chiến thắng của bản lĩnh con người. d) Sai: khoa học được ca ngợi là sức mạnh, chỉ bị cảnh báo khi dùng sai mục đích.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) phân tích sự kết hợp giữa yếu tố khoa học và trí tưởng tượng trong truyện khoa học viễn tưởng đã học.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu đặc trưng kết hợp của thể loại. Thân đoạn: dẫn chứng từ “Bạch tuộc” (tàu ngầm, bạch tuộc khổng lồ) và “Chất làm gỉ” (rô-bốt tương lai); phân tích tác dụng: vừa chân thực vừa kì thú. Kết đoạn: sự kết hợp làm nên sức sống của thể loại. Tiêu chí: có dẫn chứng cụ thể từ cả hai văn bản."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) nêu suy nghĩ của em về ước mơ khám phá đại dương của con người qua văn bản “Bạch tuộc”.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: đại dương — thế giới bí ẩn. Thân đoạn: khát vọng khám phá qua hành trình tàu Nau-ti-lux; ý nghĩa của việc tìm hiểu biển sâu với khoa học; liên hệ ước mơ của bản thân. Kết đoạn: trân trọng và tiếp nối khát vọng khám phá. Tiêu chí: có suy nghĩ riêng, liên hệ bản thân."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Thợ săn cá voi người Ca-na-đa cùng có mặt trên tàu Nau-ti-lux là ai?", "options": ["A. Công-xây.", "B. Nét Len.", "C. A-rôn-nắc.", "D. Nê-mô."], "answer": "B", "explain": "Nét Len (Ned Land) là thợ săn cá voi dũng cảm, đại diện cho con người thực tế, gắn với đời sống lao động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quái vật tấn công tàu Nau-ti-lux trong văn bản “Bạch tuộc” là", "options": ["A. cá mập khổng lồ.", "B. rắn biển dài hàng trăm mét.", "C. đàn bạch tuộc khổng lồ.", "D. cua biển thành tinh."], "answer": "C", "explain": "Đàn bạch tuộc khổng lồ với những chiếc vòi sức mạnh phi thường tấn công tàu Nau-ti-lux, tạo nên trận chiến kịch tính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả của truyện ngắn “Chất làm gỉ” là ai?", "options": ["A. Giuyn Véc-nơ.", "B. Rây Brét-bơ-ry.", "C. Héc-man Men-vin.", "D. Giô-dơn Bai-ron."], "answer": "B", "explain": "Rây Brét-bơ-ry (Ray Bradbury, 1920–2012) là nhà văn người Mĩ nổi tiếng với các tác phẩm khoa học viễn tưởng giàu tính nhân văn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu chấm than trong câu “Cẩn thận! Bạch tuộc!” có tác dụng gì?", "options": ["A. Kết thúc một câu kể bình thường.", "B. Bộc lộ cảm xúc hoảng hốt và lời cảnh báo khẩn cấp.", "C. Đánh dấu một câu hỏi.", "D. Ngăn cách các vế câu."], "answer": "B", "explain": "Dấu chấm than thể hiện ngữ điệu gấp gáp, hoảng hốt — vừa là lời cảnh báo khẩn cấp vừa bộc lộ cảm xúc mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm phân biệt câu hỏi tu từ với câu hỏi thông thường là", "options": ["A. câu hỏi tu từ dài hơn.", "B. câu hỏi tu từ không nhằm tìm câu trả lời.", "C. câu hỏi tu từ không có dấu chấm hỏi.", "D. câu hỏi tu từ luôn có từ “không”."], "answer": "B", "explain": "Câu hỏi thông thường cần câu trả lời để có thông tin; câu hỏi tu từ dùng hình thức hỏi để nhấn mạnh, bộc lộ cảm xúc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao truyện khoa học viễn tưởng hấp dẫn bạn đọc trẻ tuổi?", "options": ["A. Vì truyện rất ngắn, dễ đọc.", "B. Vì thỏa mãn trí tò mò và ước mơ khám phá thế giới của tuổi trẻ.", "C. Vì truyện không có nội dung gì.", "D. Vì truyện chỉ toàn tranh vẽ."], "answer": "B", "explain": "Tuổi trẻ ham hiểu biết, thích khám phá; truyện khoa học viễn tưởng mở ra những chân trời mới lạ, thỏa mãn trí tò mò ấy.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giuyn Véc-nơ là nhà văn người Pháp.", "b) Ông được xem là một trong những người đặt nền móng cho truyện khoa học viễn tưởng.", "c) Nhiều tưởng tượng của ông sau này đã thành hiện thực.", "d) Ông chỉ viết truyện khoa học viễn tưởng cho thiếu nhi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: tàu ngầm, du hành vũ trụ là ví dụ. d) Sai: tác phẩm của ông dành cho mọi lứa tuổi.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bối cảnh truyện “Chất làm gỉ” hướng về tương lai.", "b) Rô-bốt trong truyện gợi suy ngẫm về tình cảm giữa con người và máy móc.", "c) Truyện phủ nhận hoàn toàn vai trò của khoa học kĩ thuật.", "d) Truyện khoa học viễn tưởng như “Chất làm gỉ” giúp người đọc hình dung tương lai."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: truyện suy ngẫm về cách dùng khoa học chứ không phủ nhận. d) Đúng: đó là chức năng dự báo của thể loại.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) cảm nhận về tình đồng đội của các nhân vật trên tàu Nau-ti-lux trong trận chiến.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu tình huống trận chiến. Thân đoạn: các nhân vật sát cánh bên nhau (Nê-mô chỉ huy, mọi người chiến đấu); sự hi sinh, chia sẻ hiểm nguy; cảm xúc cảm phục. Kết đoạn: tình đồng đội là sức mạnh chiến thắng. Tiêu chí: có dẫn chứng, cảm xúc chân thành."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) bàn về trách nhiệm của con người khi sử dụng các thành tựu khoa học (gợi ý từ hai văn bản đã học).", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: khoa học là sức mạnh to lớn. Thân đoạn: dùng khoa học để khám phá, phục vụ con người (tàu Nau-ti-lux); cảnh báo khi khoa học bị lạm dụng (suy ngẫm từ “Chất làm gỉ”); trách nhiệm của thế hệ trẻ. Kết đoạn: kêu gọi dùng khoa học vì hạnh phúc con người. Tiêu chí: có lập luận, liên hệ thực tế."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Rây Brét-bơ-ry là nhà văn của nước nào?", "options": ["A. Pháp.", "B. Mĩ.", "C. Nga.", "D. Nhật Bản."], "answer": "B", "explain": "Rây Brét-bơ-ry là nhà văn người Mĩ, một trong những cây bút lớn của văn học khoa học viễn tưởng thế giới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đề tài chính của truyện “Chất làm gỉ” là", "options": ["A. cuộc chiến tranh phong kiến.", "B. thế giới tương lai với sự xuất hiện của rô-bốt.", "C. chuyện tình lãng mạn thời trung cổ.", "D. cuộc sống nông thôn Việt Nam."], "answer": "B", "explain": "Truyện đặt bối cảnh tương lai, xoay quanh hình ảnh rô-bốt để gợi mở những suy ngẫm về mối quan hệ giữa con người và máy móc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu hỏi tu từ là gì?", "options": ["A. Câu hỏi nhằm tìm câu trả lời cụ thể từ người nghe.", "B. Câu có hình thức câu hỏi nhưng không nhằm tìm câu trả lời, dùng để nhấn mạnh, bộc lộ cảm xúc.", "C. Câu khẳng định được viết dưới dạng câu hỏi cho dễ nhớ.", "D. Câu mệnh lệnh được diễn đạt nhẹ nhàng."], "answer": "B", "explain": "Câu hỏi tu từ có hình thức của câu hỏi nhưng người nói không chờ đợi câu trả lời; mục đích là nhấn mạnh ý kiến, bộc lộ cảm xúc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau giữa truyện khoa học viễn tưởng và truyện phiêu lưu thông thường là", "options": ["A. truyện phiêu lưu không có nhân vật.", "B. truyện khoa học viễn tưởng lấy yếu tố khoa học giả tưởng làm nền cho chuyến phiêu lưu.", "C. truyện phiêu lưu luôn dài hơn.", "D. hai thể loại hoàn toàn giống nhau."], "answer": "B", "explain": "Cả hai đều có phiêu lưu, nhưng truyện khoa học viễn tưởng gắn chuyến phiêu lưu với phát minh, hiện tượng được giải thích bằng khoa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Các chi tiết tri thức khoa học về sinh vật biển trong “Bạch tuộc” có tác dụng gì?", "options": ["A. Làm truyện khô khan, khó đọc.", "B. Tăng tính chân thực, khiến tưởng tượng trở nên thuyết phục.", "C. Không có tác dụng gì.", "D. Chỉ để khoe kiến thức của tác giả."], "answer": "B", "explain": "Nhờ vốn tri thức khoa học chính xác, những chi tiết tưởng tượng của Véc-nơ trở nên đáng tin, lôi cuốn người đọc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa của cuộc chiến giữa con người và bạch tuộc khổng lồ là", "options": ["A. ca ngợi lòng dũng cảm, trí tuệ của con người trước sức mạnh thiên nhiên.", "B. chứng tỏ con người bất lực trước thiên nhiên.", "C. khuyên con người không nên ra biển.", "D. ca ngợi sức mạnh của loài bạch tuộc."], "answer": "A", "explain": "Trận chiến là thử thách khắc nghiệt, qua đó tôn vinh bản lĩnh, trí tuệ và tinh thần đồng đội của con người.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Lẽ nào biển cả lại cạn kiệt bí ẩn?” là câu hỏi tu từ.", "b) Câu hỏi tu từ có tác dụng nhấn mạnh ý kiến của người nói.", "c) Câu hỏi tu từ bắt buộc phải chứa từ “không”.", "d) Dấu chấm hỏi không bao giờ đi cùng câu hỏi tu từ."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: câu này khẳng định biển cả còn nhiều bí ẩn. b) Đúng. c) Sai: có nhiều cách diễn đạt khác nhau. d) Sai: câu hỏi tu từ vẫn kết thúc bằng dấu chấm hỏi.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Chao ôi, kì vĩ làm sao!” là câu cảm thán.", "b) Câu cảm thán thường chứa các từ ngữ cảm thán.", "c) “Hãy cẩn thận!” có dấu chấm than nên là câu cảm thán.", "d) Dấu chấm than thể hiện ngữ điệu cảm xúc mạnh của câu."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: “chao ôi”, “làm sao” là từ ngữ cảm thán. c) Sai: đây là câu cầu khiến có cảm xúc mạnh. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) phân tích tác dụng của một câu hỏi tu từ trong văn bản đã học (tự chọn và trích dẫn lại câu văn).", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: trích dẫn câu hỏi tu từ đã chọn. Thân đoạn: xác định đây là câu hỏi tu từ (không cần câu trả lời); phân tích tác dụng nhấn mạnh, bộc lộ cảm xúc; đặt trong ngữ cảnh văn bản. Kết đoạn: khẳng định giá trị nghệ thuật. Tiêu chí: trích dẫn đúng, phân tích đúng tác dụng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) nêu cảm nhận về hình ảnh tàu ngầm Nau-ti-lux — biểu tượng của trí tuệ con người.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu con tàu kì diệu. Thân đoạn: những khả năng phi thường (lặn sâu, chạy bằng điện); là kết tinh trí tuệ và khát vọng; niềm tự hào về sức sáng tạo con người. Kết đoạn: Nau-ti-lux mãi là biểu tượng đẹp. Tiêu chí: có hình ảnh, cảm xúc."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Câu cảm thán là gì?", "options": ["A. Câu kể về một sự việc đã xảy ra.", "B. Câu bộc lộ trực tiếp cảm xúc: vui, buồn, ngạc nhiên, thán phục.", "C. Câu đặt câu hỏi để người nghe trả lời.", "D. Câu ra lệnh, yêu cầu ai đó làm việc gì."], "answer": "B", "explain": "Câu cảm thán dùng để bộc lộ trực tiếp cảm xúc, thái độ của người nói trước sự vật, hiện tượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu chấm than thường được đặt ở cuối loại câu nào?", "options": ["A. Câu kể.", "B. Câu hỏi thông thường.", "C. Câu cảm thán và câu bộc lộ cảm xúc mạnh.", "D. Câu ghép."], "answer": "C", "explain": "Dấu chấm than đặt cuối câu cảm thán, câu cầu khiến hoặc câu kể bộc lộ cảm xúc mạnh, thể hiện ngữ điệu cao, mạnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nào dưới đây là câu hỏi tu từ?", "options": ["A. “Mấy giờ rồi bạn?”", "B. “Ai mà không yêu quê hương mình?”", "C. “Bạn tên là gì?”", "D. “Hôm nay là thứ mấy?”"], "answer": "B", "explain": "“Ai mà không yêu quê hương mình?” không cần câu trả lời mà nhằm khẳng định: ai cũng yêu quê hương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong “Chất làm gỉ”, hình ảnh “gỉ” có thể được hiểu tượng trưng cho", "options": ["A. sự giàu sang, phú quý.", "B. sự cũ kĩ, lỗi thời mà thời gian bào mòn — cả với máy móc lẫn con người.", "C. món ăn ngon.", "D. tiền bạc, của cải."], "answer": "B", "explain": "“Gỉ” là dấu vết của thời gian trên kim loại; đặt trong truyện về rô-bốt, nó gợi suy ngẫm về sự tàn phai và giá trị bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu “Chẳng lẽ rô-bốt không có cảm xúc sao?” là loại câu gì?", "options": ["A. Câu hỏi thông thường.", "B. Câu hỏi tu từ gợi suy ngẫm về ranh giới người – máy.", "C. Câu cầu khiến.", "D. Câu kể."], "answer": "B", "explain": "Người nói không cần câu trả lời cụ thể mà muốn người nghe suy ngẫm: liệu máy móc có thể có cảm xúc như con người?", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu chấm than thường được đặt sau loại từ ngữ nào?", "options": ["A. Sau mọi danh từ.", "B. Sau từ ngữ cảm thán như “ôi”, “chao ôi”, “than ôi”.", "C. Sau mọi động từ.", "D. Sau từ chỉ thời gian."], "answer": "B", "explain": "Các từ ngữ cảm thán “ôi”, “chao ôi”, “than ôi”, “biết bao”, “xiết bao” thường đi với dấu chấm than cuối câu.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tàu Nau-ti-lux là con tàu ngầm chạy bằng điện.", "b) Con tàu là phát minh tưởng tượng vượt thời đại lúc bấy giờ.", "c) Tàu Nau-ti-lux có thật trong lịch sử hàng hải.", "d) Chi tiết con tàu thể hiện niềm tin vào sức mạnh khoa học."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: thế kỉ XIX chưa có tàu ngầm như vậy. c) Sai: đó là sáng tạo tưởng tượng của Véc-nơ. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Truyện khoa học viễn tưởng thuộc loại văn xuôi hư cấu.", "b) Mọi truyện có yếu tố thần kì đều là truyện khoa học viễn tưởng.", "c) Truyện khoa học viễn tưởng cần có cơ sở khoa học cho yếu tố giả tưởng.", "d) Truyện khoa học viễn tưởng chỉ viết về đề tài chiến tranh."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: cổ tích, thần thoại có yếu tố thần kì nhưng không dựa trên khoa học. c) Đúng: đó là điểm phân biệt với cổ tích. d) Sai: đề tài rất đa dạng: vũ trụ, đại dương, tương lai.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) so sánh điểm giống và khác nhau về chủ đề giữa “Bạch tuộc” và “Chất làm gỉ”.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu hai văn bản cùng thể loại. Thân đoạn: giống nhau — đều suy ngẫm về khoa học và con người; khác nhau — “Bạch tuộc” ca ngợi khám phá, chinh phục; “Chất làm gỉ” trăn trở về tương lai người – máy. Kết đoạn: hai góc nhìn bổ sung cho nhau. Tiêu chí: so sánh rõ giống và khác."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) trình bày suy nghĩ của em: “Liệu rô-bốt trong tương lai có thể thay thế con người?” (gợi ý từ “Chất làm gỉ”).", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu vấn đề. Thân đoạn: rô-bốt có thể thay thế lao động chân tay, thậm chí một phần trí tuệ; nhưng không thể thay thế tình cảm, lương tâm, sự sáng tạo đích thực; dẫn chứng từ truyện và thực tế. Kết đoạn: khẳng định giá trị không thể thay thế của con người. Tiêu chí: có chính kiến, lập luận."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nào dưới đây là câu cảm thán?", "options": ["A. “Hôm nay trời đẹp.”", "B. “Bạn có khỏe không?”", "C. “Ôi, đáy biển rực rỡ làm sao!”", "D. “Hãy mở cửa sổ ra.”"], "answer": "C", "explain": "Câu có từ cảm thán “Ôi”, kết thúc bằng dấu chấm than, bộc lộ sự trầm trồ trước vẻ đẹp đáy biển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đặc điểm về mặt thời gian của truyện khoa học viễn tưởng là", "options": ["A. luôn kể về quá khứ xa xưa.", "B. hướng tới tương lai, có tính dự báo.", "C. chỉ kể về hiện tại.", "D. không gắn với thời gian cụ thể nào."], "answer": "B", "explain": "Truyện khoa học viễn tưởng thường hướng về tương lai, dự báo những tiến bộ khoa học kĩ thuật có thể xảy ra.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điểm khác biệt cơ bản giữa truyện khoa học viễn tưởng và truyện cổ tích là", "options": ["A. truyện khoa học viễn tưởng dựa trên cơ sở khoa học, có tính lô-gíc khoa học.", "B. truyện cổ tích dài hơn truyện khoa học viễn tưởng.", "C. truyện khoa học viễn tưởng không có nhân vật.", "D. truyện cổ tích luôn viết về tương lai."], "answer": "A", "explain": "Yếu tố kì ảo trong truyện khoa học viễn tưởng được giải thích bằng khoa học, còn trong cổ tích thuộc về thế giới phép màu, thần linh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu cảm thán thường chứa các từ ngữ nào?", "options": ["A. “nếu”, “thì”, “và”.", "B. “ôi”, “chao ôi”, “biết bao”, “xiết bao”, “làm sao”.", "C. “ai”, “gì”, “nào”.", "D. “hãy”, “đừng”, “chớ”."], "answer": "B", "explain": "Đó là những từ ngữ cảm thán đặc trưng, giúp câu văn bộc lộ trực tiếp cảm xúc mạnh mẽ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân tích câu “Biển cả ơi, bao la xiết bao!”: đây là loại câu gì?", "options": ["A. Câu hỏi tu từ.", "B. Câu cảm thán bộc lộ sự ngưỡng mộ trước sự bao la của biển cả.", "C. Câu cầu khiến.", "D. Câu kể."], "answer": "B", "explain": "Câu gọi “Biển cả ơi”, có cụm từ cảm thán “xiết bao” và dấu chấm than — bộc lộ sự ngưỡng mộ, thán phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Giuyn Véc-nơ được mệnh danh là người đặt nền móng cho truyện khoa học viễn tưởng?", "options": ["A. Vì ông là người đầu tiên viết truyện ngắn.", "B. Vì ông tiên phong xây dựng thể loại với nhiều dự báo khoa học sau này thành hiện thực.", "C. Vì ông viết rất nhiều thơ.", "D. Vì ông là nhà bác học nổi tiếng."], "answer": "B", "explain": "Véc-nơ là một trong những nhà văn đầu tiên hệ thống hóa thể loại; nhiều tưởng tượng của ông như tàu ngầm, du hành vũ trụ sau này trở thành hiện thực.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tác giả miêu tả chi tiết ngoại hình của bạch tuộc khổng lồ.", "b) Nhịp kể trong cảnh chiến đấu nhanh, hồi hộp.", "c) Văn bản sử dụng nhiều tri thức khoa học về sinh vật biển.", "d) Người kể chuyện trong văn bản là ngôi thứ ba toàn tri."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: nhịp kể dồn dập theo diễn biến trận chiến. c) Đúng. d) Sai: người kể là giáo sư A-rôn-nắc, ngôi thứ nhất.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Bạch tuộc” ca ngợi chiến thắng của trí tuệ con người.", "b) Truyện nhắc nhở con người vừa khám phá vừa tôn trọng thiên nhiên.", "c) “Chất làm gỉ” đặt câu hỏi về tương lai của tính nhân văn.", "d) Truyện khoa học viễn tưởng khuyên con người từ bỏ khoa học."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: mối quan hệ người – máy là vấn đề nhân văn. d) Sai: truyện kêu gọi dùng khoa học đúng đắn.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) phân tích nghệ thuật miêu tả sinh động trong đoạn chiến đấu với bạch tuộc.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu đoạn chiến đấu — cao trào của văn bản. Thân đoạn: miêu tả ngoại hình quái vật (vòi khổng lồ); từ ngữ gợi hình, gợi cảm; nhịp kể dồn dập; không khí hồi hộp. Kết đoạn: nghệ thuật miêu tả làm nên sức hấp dẫn. Tiêu chí: chỉ ra được biện pháp nghệ thuật cụ thể."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) nêu cảm nhận về nhân vật A-rôn-nắc — nhà khoa học say mê khám phá.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu A-rôn-nắc, người kể chuyện. Thân đoạn: lòng say mê sinh vật biển; tinh thần ham học hỏi; sự dũng cảm đồng hành trong hiểm nguy; thái độ khách quan của nhà khoa học. Kết đoạn: cảm phục và học tập tinh thần ấy. Tiêu chí: có dẫn chứng, cảm xúc."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Chi tiết nào dưới đây thuộc yếu tố khoa học giả tưởng?", "options": ["A. Bà tiên dùng đũa thần biến bí ngô thành xe ngựa.", "B. Tàu ngầm chạy bằng điện lặn sâu hai vạn dặm dưới đáy biển vào thế kỉ XIX.", "C. Chàng nông dân cày lúa trên đồng ruộng.", "D. Học sinh đến trường bằng xe đạp."], "answer": "B", "explain": "Vào thế kỉ XIX tàu ngầm hiện đại chưa ra đời; chi tiết tàu ngầm chạy bằng điện là tưởng tượng vượt thời đại dựa trên cơ sở khoa học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Truyện khoa học viễn tưởng thường gửi gắm thông điệp gì?", "options": ["A. Ước mơ khám phá, niềm tin vào khoa học và lời cảnh báo về cách con người dùng khoa học.", "B. Khuyên con người từ bỏ khoa học, trở về thời nguyên thủy.", "C. Chỉ nhằm mua vui, giải trí đơn thuần.", "D. Ca ngợi chiến tranh và bạo lực."], "answer": "A", "explain": "Đằng sau những chuyến phiêu lưu kì thú, truyện khoa học viễn tưởng thường gửi gắm ước mơ chinh phục tri thức và suy ngẫm về trách nhiệm của con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong văn bản “Bạch tuộc”, cuộc chiến diễn ra ở đâu?", "options": ["A. Trên đất liền.", "B. Trên boong tàu Nau-ti-lux giữa đại dương.", "C. Trong rừng rậm nhiệt đới.", "D. Trên đỉnh núi tuyết."], "answer": "B", "explain": "Đàn bạch tuộc khổng lồ tấn công ngay trên boong tàu Nau-ti-lux giữa đại dương, nơi các nhân vật trực tiếp đối mặt hiểm nguy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dự báo nào của Giuyn Véc-nơ đã trở thành hiện thực?", "options": ["A. Tàu ngầm hiện đại và chuyến bay chinh phục Mặt Trăng.", "B. Điện thoại thông minh.", "C. Máy tính bảng.", "D. Tàu hỏa chạy bằng than."], "answer": "A", "explain": "Tàu ngầm hạt nhân lặn sâu đại dương và tàu vũ trụ đưa người lên Mặt Trăng đã biến tưởng tượng của Véc-nơ thành hiện thực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Truyện khoa học viễn tưởng có vai trò gì đối với khoa học?", "options": ["A. Không có vai trò gì.", "B. Khơi gợi đam mê, định hướng ước mơ nghiên cứu khoa học cho bạn đọc.", "C. Cản trở sự phát triển khoa học.", "D. Thay thế sách giáo khoa khoa học."], "answer": "B", "explain": "Nhiều nhà khoa học thừa nhận tuổi thơ đọc Véc-nơ đã nuôi dưỡng ước mơ khám phá; văn học viễn tưởng gieo mầm đam mê khoa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhân vật Nét Len trong “Bạch tuộc” đại diện cho kiểu người nào?", "options": ["A. Nhà khoa học lí thuyết.", "B. Con người thực tế, dũng cảm, gắn với đời sống lao động.", "C. Tên tội phạm.", "D. Vị vua quyền quý."], "answer": "B", "explain": "Nét Len là thợ săn cá voi: khỏe mạnh, thực tế, dũng cảm — mẫu người lao động đối lập mà bổ sung cho các nhà khoa học.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu “Biển sâu còn bao điều bí ẩn, phải không?” — nếu người nói chờ câu trả lời thì đó không phải câu hỏi tu từ.", "b) Câu hỏi tu từ có thể dùng để bác bỏ một ý kiến sai.", "c) Mọi câu kết thúc bằng dấu chấm than đều bộc lộ niềm vui.", "d) Dấu chấm than giúp thể hiện ngữ điệu mạnh của câu."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: chờ câu trả lời thì là câu hỏi thông thường. b) Đúng: ví dụ “Chẳng lẽ điều đó là đúng sao?” để bác bỏ. c) Sai: có thể là ngạc nhiên, đau buồn, giận dữ. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Rây Brét-bơ-ry là nhà văn Mĩ nổi tiếng với truyện khoa học viễn tưởng.", "b) Tác phẩm của ông thường giàu tính nhân văn.", "c) “Chất làm gỉ” viết về quá khứ xa xưa.", "d) Ông chỉ viết cho người lớn, thiếu nhi không đọc được."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng: ông luôn đặt con người ở trung tâm. c) Sai: truyện hướng về tương lai. d) Sai: nhiều tác phẩm của ông gần gũi với bạn đọc trẻ.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) làm rõ tính dự báo của truyện khoa học viễn tưởng qua sáng tác của Giuyn Véc-nơ.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu khái niệm tính dự báo. Thân đoạn: tàu ngầm Nau-ti-lux thời chưa có tàu ngầm hiện đại; du hành vũ trụ trong tác phẩm khác; nhiều dự báo thành hiện thực. Kết đoạn: Véc-nơ — nhà tiên tri của khoa học. Tiêu chí: có dẫn chứng cụ thể."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) trình bày suy nghĩ về ý kiến: “Khoa học là sức mạnh” qua hai văn bản đã học.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giải thích ngắn gọn ý kiến. Thân đoạn: sức mạnh khoa học giúp con người khám phá đại dương (“Bạch tuộc”); sức mạnh ấy đòi hỏi trách nhiệm (“Chất làm gỉ”); liên hệ thực tế. Kết đoạn: khẳng định và nhắn nhủ. Tiêu chí: có lí lẽ, dẫn chứng từ văn bản."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bạch tuộc khổng lồ tấn công con người chủ yếu bằng", "options": ["A. hàm răng sắc nhọn.", "B. những chiếc vòi to khỏe, đầy sức mạnh.", "C. nọc độc phun từ xa.", "D. tiếng kêu inh tai."], "answer": "B", "explain": "Tác giả miêu tả những chiếc vòi khổng lồ của bạch tuộc quật chặt, kéo con mồi xuống biển sâu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Truyện “Chất làm gỉ” gợi cho người đọc suy ngẫm về vấn đề gì?", "options": ["A. Cách trồng trọt thời phong kiến.", "B. Mối quan hệ giữa con người và máy móc, rô-bốt trong tương lai.", "C. Nghệ thuật nấu ăn truyền thống.", "D. Lịch sử các triều đại phong kiến."], "answer": "B", "explain": "Qua hình tượng rô-bốt trong thế giới tương lai, truyện đặt ra câu hỏi về ranh giới giữa người và máy, về tính nhân văn trước sự phát triển công nghệ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu để nhận biết câu hỏi tu từ là", "options": ["A. câu có hình thức câu hỏi nhưng người nói không chờ đợi câu trả lời.", "B. câu nào có dấu chấm hỏi cũng là câu hỏi tu từ.", "C. câu hỏi tu từ phải thật dài.", "D. câu hỏi tu từ không bao giờ có dấu chấm hỏi."], "answer": "A", "explain": "Dấu hiệu quan trọng nhất: người nói không nhằm tìm câu trả lời mà dùng câu hỏi để nhấn mạnh, bộc lộ thái độ, cảm xúc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhân vật Công-xây đại diện cho phẩm chất nào?", "options": ["A. Sự phản bội.", "B. Sự trung thành và lòng ham học hỏi khoa học.", "C. Tính kiêu ngạo.", "D. Sự lười biếng."], "answer": "B", "explain": "Công-xây một lòng trung thành với giáo sư A-rôn-nắc, say mê phân loại sinh vật biển — hiện thân của người học trò khoa học tận tụy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sự kết hợp giữa miêu tả và tường thuật trong đoạn chiến đấu với bạch tuộc có tác dụng gì?", "options": ["A. Làm đoạn văn rời rạc.", "B. Khiến cảnh tượng hiện lên sinh động, hồi hộp, lôi cuốn.", "C. Làm giảm kịch tính.", "D. Không có tác dụng nghệ thuật."], "answer": "B", "explain": "Tường thuật dẫn dắt diễn biến dồn dập, miêu tả khắc họa hình ảnh quái vật và khí thế chiến đấu — tạo nên cảnh tượng nghẹt thở.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chủ đề chung của hai văn bản “Bạch tuộc” và “Chất làm gỉ” là", "options": ["A. ca ngợi chiến tranh.", "B. con người khám phá thế giới bằng trí tuệ, lòng dũng cảm và suy ngẫm về khoa học.", "C. tình yêu đôi lứa.", "D. cuộc sống nông thôn yên bình."], "answer": "B", "explain": "Cả hai văn bản đều hướng tới con người trong hành trình khám phá: “Bạch tuộc” ca ngợi bản lĩnh, “Chất làm gỉ” suy ngẫm về tương lai.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đọc truyện khoa học viễn tưởng cần chú ý các chi tiết khoa học giả tưởng.", "b) Cần phân biệt chi tiết có cơ sở khoa học và chi tiết thuần tưởng tượng.", "c) Đọc truyện khoa học viễn tưởng không cần quan tâm đến thông điệp.", "d) Tóm tắt cốt truyện giúp nắm được nội dung chính của văn bản."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: đó là cách đọc hiểu đặc trưng của thể loại. c) Sai: thông điệp về khoa học và con người rất quan trọng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bài 7 giúp học sinh nhận biết đặc điểm của truyện khoa học viễn tưởng.", "b) “Bạch tuộc” và “Chất làm gỉ” đều thuộc thể loại truyện khoa học viễn tưởng.", "c) Câu hỏi tu từ, câu cảm thán, dấu chấm than là nội dung thực hành tiếng Việt của bài.", "d) Truyện khoa học viễn tưởng và văn nghị luận có đặc điểm giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: một bên là văn xuôi hư cấu giàu tưởng tượng, một bên là văn bản bàn luận dùng lí lẽ, dẫn chứng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) kể lại ngắn gọn và nêu cảm nhận về chi tiết em ấn tượng nhất trong Bài 7.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu chi tiết gây ấn tượng. Thân đoạn: kể lại ngắn gọn diễn biến; phân tích vì sao ấn tượng (kịch tính, giàu tưởng tượng, giàu ý nghĩa); cảm xúc của bản thân. Kết đoạn: ý nghĩa của chi tiết với em. Tiêu chí: kể ngắn gọn, cảm nhận sâu sắc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) nêu ý nghĩa của việc đọc truyện khoa học viễn tưởng đối với việc học tập của học sinh.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu ý nghĩa chung. Thân đoạn: mở rộng hiểu biết khoa học; nuôi dưỡng trí tưởng tượng, sáng tạo; rèn thói quen đọc sách; khơi dậy ước mơ nghề nghiệp. Kết đoạn: lời khuyên đọc sách. Tiêu chí: lí lẽ thuyết phục, liên hệ bản thân."}]}]}
