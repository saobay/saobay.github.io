C", "explain": "Giọng (accent) ở Liverpool khác với ở London."}, {"type": "mcq", "level": "TH", "q": "Sydney ___ is very beautiful at night.", "options": ["A. School", "B. Market", "C. Street", "D. Harbour"], "answer": "D", "explain": "Cảng Sydney (Sydney Harbour) rất đẹp về đêm."}, {"type": "mcq", "level": "VD", "q": "He is in ___ hospital. He works there as a doctor.", "options": ["A. (no article)", "B. a", "C. an", "D. the"], "answer": "A", "explain": "Ở trong bệnh viện với tư cách (làm việc) → không dùng mạo từ: in hospital."}, {"type": "mcq", "level": "VDC", "q": "A: Is the Tower of London worth visiting? B: ___", "options": ["A. It is a tall tower.", "B. Definitely. It's full of history.", "C. I don't like old buildings.", "D. London is a big city."], "answer": "B", "explain": "Câu trả lời khẳng định và nêu lý do thuyết phục."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). English sounds different in different countries. People in the UK, the USA and Australia have different accents. Sometimes they use different words for the same thing. For example, 'flat' in the UK is 'apartment' in the USA. Learning these differences is interesting.", "statements": ["Accents are different in English-speaking countries.", "'Flat' and 'apartment' mean the same thing.", "Everyone speaks English exactly the same.", "Learning accent differences is interesting."], "answer": ["T", "T", "F", "T"], "explain": "'Flat' (Anh) và 'apartment' (Mỹ) cùng nghĩa là căn hộ."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Scotland is a part of the UK. Its capital is Edinburgh. The famous Edinburgh Castle is on a hill. Many tourists visit it every year. Scotland is famous for bagpipes and kilts.", "statements": ["Scotland is part of the UK.", "Edinburgh is the capital of Scotland.", "Edinburgh Castle is under the sea.", "Scotland is famous for bagpipes."], "answer": ["T", "T", "F", "T"], "explain": "Lâu đài Edinburgh nằm trên đồi."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: A person who speaks English from birth is a ___ speaker.", "answer": "native", "explain": "Đáp án là 'native' (người bản xứ)."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: I have ___ uncle in Canada.", "answer": "an", "explain": "'Uncle' bắt đầu bằng nguyên âm /ʌ/ → dùng 'an'."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "The voice usually goes DOWN at the end of a ___.", "options": ["A. Yes/No question", "B. command", "C. greeting", "D. Wh-question"], "answer": "D", "explain": "Câu hỏi Wh- có ngữ điệu đi xuống ở cuối câu."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. abroad", "B. native", "C. harbour", "D. castle"], "answer": "A", "explain": "'Abroad' nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "VD", "q": "'To go ___' means to go to another country.", "options": ["A. inside", "B. home", "C. abroad", "D. upstairs"], "answer": "C", "explain": "'Go abroad' nghĩa là đi ra nước ngoài."}, {"type": "mcq", "level": "TH", "q": "The ___ is a cute animal that sleeps about 20 hours a day.", "options": ["A. dog", "B. koala", "C. cat", "D. rabbit"], "answer": "B", "explain": "Gấu koala (koala) ngủ khoảng 20 tiếng mỗi ngày."}, {"type": "mcq", "level": "NB", "q": "I saw ___ interesting film last night.", "options": ["A. the", "B. a", "C. an", "D. (no article)"], "answer": "C", "explain": "'Interesting' bắt đầu bằng nguyên âm /ɪ/ → dùng 'an'."}, {"type": "mcq", "level": "VDC", "q": "A: I want to practise my English with native speakers. B: ___", "options": ["A. Why don't you join an English club?", "B. Good luck to you.", "C. English is difficult.", "D. Native speakers are people."], "answer": "A", "explain": "Câu trả lời đưa ra gợi ý thiết thực nhất."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). New York is a big city in the USA. The Statue of Liberty is a famous landmark there. It was a gift from France. Millions of tourists visit it every year. New York is called 'the city that never sleeps'.", "statements": ["New York is in the USA.", "The Statue of Liberty was a gift from France.", "Few tourists visit New York.", "New York is called 'the city that never sleeps'."], "answer": ["T", "T", "F", "T"], "explain": "Hàng triệu du khách thăm New York mỗi năm."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Niagara Falls is on the border of the USA and Canada. It is one of the most famous waterfalls in the world. The water falls with a loud sound. Tourists take boats near the falls. It is a wonderful natural landmark.", "statements": ["Niagara Falls is between the USA and Canada.", "It is a famous waterfall.", "Tourists cannot visit Niagara Falls.", "It is a wonderful natural landmark."], "answer": ["T", "T", "F", "T"], "explain": "Du khách có thể đi thuyền gần thác."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The ___ is a flightless bird from New Zealand.", "answer": "kiwi", "explain": "Đáp án là 'kiwi' (chim kiwi không biết bay)."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: ___ apple a day keeps the doctor away.", "answer": "An", "explain": "'Apple' bắt đầu bằng nguyên âm → dùng 'An' ở đầu câu."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the question that should have a RISING intonation (the voice goes UP at the end).", "options": ["A. How much is it?", "B. Do they speak French?", "C. Which team won?", "D. When is your birthday?"], "answer": "B", "explain": "Câu hỏi Yes/No (Do they...) có ngữ điệu đi lên."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. official", "B. experience", "C. kangaroo", "D. native"], "answer": "D", "explain": "'Native' nhấn âm 1, các từ còn lại nhấn vào âm sau (official, experience âm 2; kangaroo âm 3)."}, {"type": "mcq", "level": "VD", "q": "Different countries have different ___.", "options": ["A. times", "B. moneys", "C. weathers", "D. cultures"], "answer": "D", "explain": "Các nước khác nhau có nền văn hóa (cultures) khác nhau."}, {"type": "mcq", "level": "TH", "q": "People from New Zealand are often called ___.", "options": ["A. Kiwis", "B. Kangaroos", "C. Koalas", "D. Pandas"], "answer": "A", "explain": "Người New Zealand thường được gọi là Kiwis (theo chim kiwi)."}, {"type": "mcq", "level": "VD", "q": "___ UK is an English-speaking country.", "options": ["A. (no article)", "B. The", "C. A", "D. An"], "answer": "B", "explain": "Tên nước đặc biệt dùng 'the': the UK."}, {"type": "mcq", "level": "VDC", "q": "A: How is the weather in Scotland? B: ___", "options": ["A. It is a beautiful country.", "B. It's often rainy. Bring a warm coat.", "C. I like rainy days.", "D. Scotland is in the UK."], "answer": "B", "explain": "Câu trả lời mô tả thời tiết và đưa ra lời khuyên hữu ích."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many students want to study abroad. They go to the UK, the USA or Australia. They can improve their English and learn about new cultures. Living abroad is exciting but sometimes difficult. They miss their family and friends.", "statements": ["Many students want to study abroad.", "They can improve their English abroad.", "Living abroad is never difficult.", "They sometimes miss their family."], "answer": ["T", "T", "F", "T"], "explain": "Sống ở nước ngoài thú vị nhưng đôi khi khó khăn."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Australia is both a country and a continent. It is the smallest continent in the world. Most Australians live near the sea. The middle of Australia is a big desert. The capital of Australia is Canberra.", "statements": ["Australia is a country and a continent.", "Australia is the biggest continent.", "Most Australians live near the sea.", "Sydney is the capital of Australia."], "answer": ["T", "F", "T", "F"], "explain": "Úc là châu lục nhỏ nhất; thủ đô là Canberra, không phải Sydney."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Sydney ___ is a famous place in Australia.", "answer": "Harbour", "explain": "Đáp án là 'Harbour' (cảng Sydney)."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: We visited ___ USA last summer.", "answer": "the", "explain": "Tên nước USA dùng 'the': the USA."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Choose the question that should have a FALLING intonation (the voice goes DOWN at the end).", "options": ["A. Will you join us?", "B. Is this your bag?", "C. Have you got a map?", "D. Who is your English teacher?"], "answer": "D", "explain": "Câu hỏi Wh- (Who is...) có ngữ điệu đi xuống."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. culture", "B. sightseeing", "C. explore", "D. maple"], "answer": "C", "explain": "'Explore' nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "VD", "q": "Travelling gives us wonderful ___.", "options": ["A. bags", "B. maps", "C. experiences", "D. tickets"], "answer": "C", "explain": "Du lịch mang lại những trải nghiệm (experiences) tuyệt vời."}, {"type": "mcq", "level": "TH", "q": "The ___ is the way people live, eat and celebrate in a country.", "options": ["A. weather", "B. money", "C. traffic", "D. culture"], "answer": "D", "explain": "Văn hóa (culture) là cách con người sống, ăn uống và lễ hội."}, {"type": "mcq", "level": "NB", "q": "___ Eiffel Tower is in Paris.", "options": ["A. An", "B. A", "C. The", "D. (no article)"], "answer": "C", "explain": "Tên công trình đặc biệt dùng 'the'."}, {"type": "mcq", "level": "VDC", "q": "A: Let's go sightseeing tomorrow. B: ___", "options": ["A. I like going out.", "B. Great! Where shall we go first?", "C. Sightseeing is very fun.", "D. Tomorrow is Sunday."], "answer": "B", "explain": "Câu trả lời hào hứng đồng ý và hỏi tiếp một cách tự nhiên."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). The koala is a cute animal from Australia. It lives in eucalyptus trees and eats their leaves. Koalas sleep about 20 hours a day. Baby koalas stay with their mothers for a year. Many tourists want to see koalas in Australia.", "statements": ["The koala is from Australia.", "Koalas eat eucalyptus leaves.", "Koalas sleep only two hours a day.", "Tourists want to see koalas."], "answer": ["T", "T", "F", "T"], "explain": "Koala ngủ khoảng 20 tiếng mỗi ngày, không phải 2 tiếng."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The London Eye is a big wheel in London. People ride in glass rooms and see the city. At night, it has colourful lights. It is near the river Thames. It is a popular attraction for tourists.", "statements": ["The London Eye is in London.", "People can see the city from it.", "The London Eye is in Paris.", "It is near the river Thames."], "answer": ["T", "T", "F", "T"], "explain": "London Eye ở London, gần sông Thames."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: ___ is visiting famous places as a tourist.", "answer": "Sightseeing", "explain": "Đáp án là 'Sightseeing' (sự tham quan)."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: London is ___ capital of the UK.", "answer": "the", "explain": "Danh từ đã xác định (thủ đô của UK) → dùng 'the'."}]}]}</script>
