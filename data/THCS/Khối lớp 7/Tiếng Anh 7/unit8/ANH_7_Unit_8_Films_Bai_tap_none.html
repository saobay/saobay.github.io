<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose 'ea' is pronounced differently from the others.", "options": ["A. fear", "B. chair", "C. dear", "D. near"], "answer": "B", "explain": "Các từ fear, dear, near có âm 'ea' là /ɪə/, còn chair có âm 'ai' là /eə/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose 'ea' is pronounced differently from the others.", "options": ["A. chair", "B. hair", "C. fear", "D. share"], "answer": "C", "explain": "Các từ chair, hair, share có âm là /eə/, còn fear có âm 'ea' là /ɪə/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose 'ea' is pronounced differently from the others.", "options": ["A. idea", "B. share", "C. really", "D. ear"], "answer": "B", "explain": "Các từ idea, really, ear có âm là /ɪə/, còn share có âm 'are' là /eə/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose 'ea' is pronounced differently from the others.", "options": ["A. care", "B. near", "C. dear", "D. year"], "answer": "A", "explain": "Các từ near, dear, year có âm 'ea' là /ɪə/, còn care có âm 'are' là /eə/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose 'ea' is pronounced differently from the others.", "options": ["A. nightmare", "B. clear", "C. idea", "D. ear"], "answer": "A", "explain": "Các từ clear, idea, ear có âm là /ɪə/, còn nightmare có âm 'are' là /eə/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose 'ai' is pronounced differently from the others.", "options": ["A. hair", "B. chair", "C. share", "D. dear"], "answer": "D", "explain": "Các từ hair, chair, share có âm 'ai' là /eə/, còn dear có âm 'ea' là /ɪə/ nên khác."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide True (T) or False (F).\n\nLast night, Mai watched a comedy with her family. The film was very funny. Everyone laughed a lot. They all had a great evening.", "statements": ["Mai watched a horror film.", "The film was funny.", "Her family laughed a lot.", "They had a boring evening."], "answer": ["F", "T", "T", "F"], "explain": "Mai xem phim hài (không phải kinh dị), phim rất vui, cả nhà cười nhiều, buổi tối tuyệt vời (không chán)."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide True (T) or False (F).\n\nTom likes documentaries about animals. He watched one about lions last weekend. It was very interesting. He learned many new things.", "statements": ["Tom likes documentaries.", "The documentary was about lions.", "It was boring.", "He learned nothing new."], "answer": ["T", "T", "F", "F"], "explain": "Tom thích phim tài liệu về sư tử, phim thú vị (không chán), anh học được nhiều điều mới."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: A ___ is a film that makes people laugh.", "answer": "comedy", "explain": "Comedy là phim hài."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: A ___ gives facts about real life.", "answer": "documentary", "explain": "Documentary là phim tài liệu."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose 'ea' is pronounced differently from the others.", "options": ["A. really", "B. ear", "C. square", "D. near"], "answer": "C", "explain": "Các từ really, ear, near có âm 'ea' là /ɪə/, còn square có âm 'are' là /eə/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose 'ea' is pronounced differently from the others.", "options": ["A. where", "B. fear", "C. dear", "D. clear"], "answer": "A", "explain": "Các từ fear, dear, clear có âm 'ea' là /ɪə/, còn where có âm 'ere' là /eə/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose 'ai' is pronounced differently from the others.", "options": ["A. chair", "B. idea", "C. hair", "D. share"], "answer": "B", "explain": "Các từ chair, hair, share có âm 'ai' là /eə/, còn idea có âm 'ea' là /ɪə/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose 'ea' is pronounced differently from the others.", "options": ["A. there", "B. ear", "C. dear", "D. year"], "answer": "A", "explain": "Các từ ear, dear, year có âm 'ea' là /ɪə/, còn there có âm 'ere' là /eə/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose 'ea' is pronounced differently from the others.", "options": ["A. fear", "B. chair", "C. near", "D. dear"], "answer": "B", "explain": "Các từ fear, near, dear có âm 'ea' là /ɪə/, còn chair có âm 'ai' là /eə/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose 'ai' is pronounced differently from the others.", "options": ["A. share", "B. hair", "C. chair", "D. really"], "answer": "D", "explain": "Các từ share, hair, chair có âm 'ai' là /eə/, còn really có âm 'ea' là /ɪə/ nên khác."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide True (T) or False (F).\n\nThe new cinema in our town is very big. It has 10 screens. Tickets are cheap on Mondays. Many students go there at the weekend.", "statements": ["The new cinema is small.", "It has 10 screens.", "Tickets are cheap on Mondays.", "Students go there at the weekend."], "answer": ["F", "T", "T", "T"], "explain": "Rạp mới rất lớn (không nhỏ), có 10 phòng chiếu, vé rẻ vào thứ Hai, học sinh đến vào cuối tuần."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide True (T) or False (F).\n\nLan does not like horror films. She thinks they are too frightening. She prefers comedies. Her brother likes horror films, though.", "statements": ["Lan likes horror films.", "She finds them frightening.", "She prefers comedies.", "Her brother dislikes horror films."], "answer": ["F", "T", "T", "F"], "explain": "Lan không thích phim kinh dị (thấy đáng sợ), thích phim hài hơn, còn anh trai cô thì thích phim kinh dị."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The ___ of the film is very famous.", "answer": "director", "explain": "Director là đạo diễn."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The film was so ___ that I fell asleep.", "answer": "dull", "explain": "Dull là buồn tẻ, nhàm chán."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. comedy", "B. poster", "C. acting", "D. enjoy"], "answer": "D", "explain": "Các từ comedy, poster, acting nhấn âm 1, còn enjoy nhấn âm 2 nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. director", "B. review", "C. movie", "D. ticket"], "answer": "A", "explain": "Các từ review, movie, ticket nhấn âm 1, còn director nhấn âm 2 nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. confusing", "B. gripping", "C. moving", "D. shocking"], "answer": "A", "explain": "Các từ gripping, moving, shocking nhấn âm 1, còn confusing nhấn âm 2 nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. enjoy", "B. repeat", "C. begin", "D. ticket"], "answer": "D", "explain": "Các từ enjoy, repeat, begin nhấn âm 2, còn ticket nhấn âm 1 nên khác."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. polite", "B. comedy", "C. poster", "D. acting"], "answer": "A", "explain": "Các từ comedy, poster, acting nhấn âm 1, còn polite nhấn âm 2 nên khác."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. begin", "B. arrive", "C. enjoy", "D. movie"], "answer": "D", "explain": "Các từ begin, arrive, enjoy nhấn âm 2, còn movie nhấn âm 1 nên khác."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide True (T) or False (F).\n\nAlthough the film was very long, Nam enjoyed every minute of it. The story was gripping and the acting was excellent. He wants to watch it again with his friends.", "statements": ["The film was short.", "Nam enjoyed the film.", "The story was gripping.", "He wants to watch it again."], "answer": ["F", "T", "T", "T"], "explain": "Phim rất dài (không ngắn), Nam thích từng phút, cốt truyện hấp dẫn, muốn xem lại với bạn."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide True (T) or False (F).\n\nThe director of the film is very famous. He has made more than 20 films. This new film got good reviews. Many people say it is his best work.", "statements": ["The director is unknown.", "He has made over 20 films.", "The new film got good reviews.", "People think it is his best film."], "answer": ["F", "T", "T", "T"], "explain": "Đạo diễn rất nổi tiếng (không vô danh), đã làm hơn 20 phim, phim mới được đánh giá tốt, được coi là hay nhất."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: I don't like horror films. They are too ___.", "answer": "scary", "explain": "Scary là đáng sợ."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Her ___ in the film was wonderful.", "answer": "acting", "explain": "Acting là diễn xuất."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "A ___ is a film that makes people laugh.", "options": ["A. comedy", "B. horror film", "C. documentary", "D. thriller"], "answer": "A", "explain": "Comedy là phim hài, làm khán giả cười."}, {"type": "mcq", "level": "NB", "q": "A ___ gives facts about real people, animals or events.", "options": ["A. comedy", "B. horror film", "C. documentary", "D. cartoon"], "answer": "C", "explain": "Documentary là phim tài liệu về người, sự việc có thật."}, {"type": "mcq", "level": "NB", "q": "The film was so ___ that I could not stop laughing.", "options": ["A. dull", "B. scary", "C. funny", "D. violent"], "answer": "C", "explain": "Phim hài thì funny (buồn cười)."}, {"type": "mcq", "level": "NB", "q": "I don't like ___ films because they are too frightening.", "options": ["A. comedy", "B. horror", "C. documentary", "D. romance"], "answer": "B", "explain": "Horror film là phim kinh dị, gây sợ hãi."}, {"type": "mcq", "level": "TH", "q": "The story was so ___ that I couldn't take my eyes off the screen.", "options": ["A. dull", "B. gripping", "C. confusing", "D. boring"], "answer": "B", "explain": "Gripping là hấp dẫn, lôi cuốn."}, {"type": "mcq", "level": "TH", "q": "The film was too ___; I fell asleep in the middle of it.", "options": ["A. gripping", "B. dull", "C. moving", "D. shocking"], "answer": "B", "explain": "Dull là buồn tẻ, nhàm chán."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide True (T) or False (F).\n\nDespite the bad reviews, the film made a lot of money. Teenagers love its funny story. The main actor became very popular. A second part will come out next year.", "statements": ["The film got good reviews.", "Teenagers like the film.", "The main actor is now popular.", "There will be a second part."], "answer": ["F", "T", "T", "T"], "explain": "Phim bị chê (không được khen), thanh thiếu niên thích, diễn viên chính nổi tiếng, sẽ có phần 2 năm sau."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide True (T) or False (F).\n\nHoa watched a science fiction film yesterday. It was about travel to Mars in the year 2050. The special effects were amazing. However, the story was a bit confusing.", "statements": ["Hoa watched a comedy.", "The film was about Mars travel.", "The effects were amazing.", "The story was easy to follow."], "answer": ["F", "T", "T", "F"], "explain": "Hoa xem phim khoa học viễn tưởng (không phải hài) về du hành sao Hỏa, kỹ xảo tuyệt vời, cốt truyện hơi khó hiểu (không dễ theo dõi)."}, {"type": "short", "level": "TH", "q": "Fill in the blank with ONE word: ___ the film was long, we enjoyed it.", "answer": "Although", "explain": "Although + mệnh đề: mặc dù."}, {"type": "short", "level": "TH", "q": "Fill in the blank with ONE word: ___ the rain, we went to the cinema.", "answer": "Despite", "explain": "Despite + danh từ: mặc dù trời mưa."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "The ending of the film was really ___. It made me cry.", "options": ["A. moving", "B. violent", "C. dull", "D. confusing"], "answer": "A", "explain": "Moving là cảm động, làm người xem rơi nước mắt."}, {"type": "mcq", "level": "NB", "q": "Children should not watch ___ films with fighting scenes.", "options": ["A. violent", "B. funny", "C. moving", "D. enjoyable"], "answer": "A", "explain": "Violent là bạo lực, có cảnh đánh nhau."}, {"type": "mcq", "level": "NB", "q": "The ___ of the film is very famous. He has won many awards.", "options": ["A. director", "B. poster", "C. ticket", "D. screen"], "answer": "A", "explain": "Director là đạo diễn của bộ phim."}, {"type": "mcq", "level": "TH", "q": "Her ___ in the film was excellent. She played the role so well.", "options": ["A. acting", "B. poster", "C. ticket", "D. review"], "answer": "A", "explain": "Acting là diễn xuất của diễn viên."}, {"type": "mcq", "level": "TH", "q": "I read a ___ of the film before deciding to watch it.", "options": ["A. poster", "B. review", "C. ticket", "D. trailer"], "answer": "B", "explain": "Review là bài phê bình, nhận xét về phim."}, {"type": "mcq", "level": "TH", "q": "The ___ of the new film is on the wall outside the cinema.", "options": ["A. poster", "B. review", "C. director", "D. ticket"], "answer": "A", "explain": "Poster là áp phích quảng cáo phim."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide True (T) or False (F).\n\nThe poster of the film is on every street. It shows a scary face in the dark. Many children are afraid to look at it. Parents think it is too frightening.", "statements": ["The poster is everywhere.", "It shows a funny face.", "Children are afraid of it.", "Parents like the poster."], "answer": ["T", "F", "T", "F"], "explain": "Áp phích ở khắp nơi, hình khuôn mặt đáng sợ (không vui), trẻ em sợ, phụ huynh thấy quá đáng sợ (không thích)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide True (T) or False (F).\n\nMy favourite film is a fantasy about a magic school. The main character is a brave boy. He fights against dark forces with his friends. The ending is very moving.", "statements": ["The film is about a magic school.", "The main character is a girl.", "He fights with his friends.", "The ending made viewers cry."], "answer": ["T", "F", "T", "T"], "explain": "Phim về trường học phép thuật, nhân vật chính là cậu bé dũng cảm (không phải gái), chiến đấu cùng bạn bè, kết thúc cảm động."}, {"type": "short", "level": "TH", "q": "Fill in the blank with ONE word: The story was ___. I couldn't understand it.", "answer": "confusing", "explain": "Confusing là khó hiểu."}, {"type": "short", "level": "TH", "q": "Fill in the blank with ONE word: The film was ___. I cried at the end.", "answer": "moving", "explain": "Moving là cảm động."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "VD", "q": "___ films are about imaginary worlds with magic and strange creatures.", "options": ["A. Documentary", "B. Horror", "C. Fantasy", "D. Comedy"], "answer": "C", "explain": "Fantasy là thể loại giả tưởng với phép thuật."}, {"type": "mcq", "level": "VD", "q": "___ is about future technology, space travel and aliens.", "options": ["A. Science fiction", "B. Documentary", "C. Comedy", "D. Romance"], "answer": "A", "explain": "Science fiction là khoa học viễn tưởng."}, {"type": "mcq", "level": "NB", "q": "The film was so ___ that I hid my face during the scary scenes.", "options": ["A. enjoyable", "B. scary", "C. moving", "D. dull"], "answer": "B", "explain": "Scary là đáng sợ."}, {"type": "mcq", "level": "VDC", "q": "The plot was ___. I didn't understand what happened at the end.", "options": ["A. gripping", "B. confusing", "C. enjoyable", "D. moving"], "answer": "B", "explain": "Confusing là khó hiểu, gây bối rối."}, {"type": "mcq", "level": "VD", "q": "In my opinion, this is a ___ film. Everyone should watch it once.", "options": ["A. must-see", "B. dull", "C. confusing", "D. violent"], "answer": "A", "explain": "Must-see là đáng xem, không thể bỏ qua."}, {"type": "mcq", "level": "VDC", "q": "The film got ___ reviews from critics, but audiences loved it.", "options": ["A. shocking", "B. confusing", "C. dull", "D. mixed"], "answer": "D", "explain": "Mixed reviews là những nhận xét trái chiều: nhà phê bình chê nhưng khán giả thích."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide True (T) or False (F).\n\nAlthough ticket prices are high, the cinema was full last night. People stood in long lines to buy tickets. The film is a must-see this month. Critics say the acting is the best part.", "statements": ["Tickets are cheap.", "The cinema was full.", "People waited in lines.", "Critics dislike the acting."], "answer": ["F", "T", "T", "F"], "explain": "Vé đắt (không rẻ), rạp đầy, khán giả xếp hàng dài, nhà phê bình khen diễn xuất (không chê)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide True (T) or False (F).\n\nThe documentary about the ocean took five years to make. The team filmed in 20 countries. It shows many strange sea animals. Viewers find it both beautiful and shocking.", "statements": ["The film took five years to make.", "It was filmed in 10 countries.", "It shows strange sea animals.", "Viewers find it boring."], "answer": ["T", "F", "T", "F"], "explain": "Phim mất 5 năm thực hiện, quay ở 20 nước (không phải 10), có nhiều sinh vật biển lạ, khán giả thấy đẹp và gây sốc (không chán)."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE word: The film got bad reviews. ___, it earned a lot of money.", "answer": "However", "explain": "However đứng đầu câu sau dấu chấm: tuy nhiên."}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: The film was so (grip) ___ that I watched it twice.", "answer": "gripping", "explain": "Cần tính từ đuôi ing miêu tả phim: gripping (hấp dẫn)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "___ the film was long, I enjoyed it very much.", "options": ["A. Although", "B. Despite", "C. However", "D. Because"], "answer": "A", "explain": "Although + mệnh đề: mặc dù phim dài nhưng tôi vẫn thích."}, {"type": "mcq", "level": "NB", "q": "___ the bad weather, we went to the cinema.", "options": ["A. Although", "B. Despite", "C. However", "D. Because of"], "answer": "B", "explain": "Despite + danh từ (the bad weather): mặc dù thời tiết xấu."}, {"type": "mcq", "level": "NB", "q": "The film got bad reviews. ___, it was a box-office hit.", "options": ["A. Although", "B. Despite", "C. However", "D. Because"], "answer": "C", "explain": "However đứng đầu câu mới sau dấu chấm: tuy nhiên."}, {"type": "mcq", "level": "VD", "q": "___ the acting was good, the story was dull.", "options": ["A. Though", "B. Despite", "C. However", "D. In spite"], "answer": "A", "explain": "Though + mệnh đề, nghĩa giống although."}, {"type": "mcq", "level": "TH", "q": "___ being tired, she watched the film to the end.", "options": ["A. Although", "B. In spite of", "C. However", "D. Because"], "answer": "B", "explain": "In spite of + V-ing (being tired): mặc dù mệt."}, {"type": "mcq", "level": "TH", "q": "The story was confusing. ___, the acting was excellent.", "options": ["A. Although", "B. Despite", "C. Nevertheless", "D. Because"], "answer": "C", "explain": "Nevertheless đứng đầu câu sau dấu chấm, nghĩa giống however."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide True (T) or False (F).\n\nIn spite of being very tired, Mr Lam took his children to the cinema. They watched an enjoyable cartoon. The children laughed all the time. It was a wonderful family evening.", "statements": ["Mr Lam was full of energy.", "He took his children to the cinema.", "The cartoon was enjoyable.", "The evening was wonderful."], "answer": ["F", "T", "T", "T"], "explain": "Ông Lam rất mệt (không tràn đầy năng lượng), đưa con đi xem phim, phim hoạt hình thú vị, buổi tối tuyệt vời."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide True (T) or False (F).\n\nThe horror film was so frightening that some viewers left early. However, most people stayed until the end. They said the story was gripping. The film will win many awards, they believe.", "statements": ["Some viewers left the cinema early.", "Everyone left before the end.", "The story was gripping.", "People think it will win awards."], "answer": ["T", "F", "T", "T"], "explain": "Một số khán giả bỏ về sớm, nhưng hầu hết ở lại đến cuối (không phải tất cả bỏ về), cốt truyện hấp dẫn, được kỳ vọng đoạt giải."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE word: ___ being tired, he watched the whole film.", "answer": "Despite", "explain": "Despite + V-ing (being tired). Chú ý viết hoa đầu câu."}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: The (act) ___ was excellent.", "answer": "acting", "explain": "Cần danh từ: acting (diễn xuất)."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "___ it was raining, they went out to buy film tickets.", "options": ["A. Despite", "B. Although", "C. However", "D. In spite of"], "answer": "B", "explain": "Sau chỗ trống là mệnh đề (it was raining) nên dùng although."}, {"type": "mcq", "level": "VD", "q": "___ the high ticket price, the cinema was full.", "options": ["A. Although", "B. Despite", "C. However", "D. Though"], "answer": "B", "explain": "Sau chỗ trống là danh từ (the high ticket price) nên dùng despite."}, {"type": "mcq", "level": "VD", "q": "The film was frightening. ___, my little brother watched it alone.", "options": ["A. Although", "B. Despite", "C. However", "D. Because"], "answer": "C", "explain": "However nối hai câu tương phản, đứng đầu câu thứ hai."}, {"type": "mcq", "level": "VD", "q": "___ his old age, the director still makes great films.", "options": ["A. Although", "B. Despite", "C. However", "D. Though"], "answer": "B", "explain": "Despite + danh từ (his old age): mặc dù tuổi cao."}, {"type": "mcq", "level": "NB", "q": "___ the film was scary, the children liked it.", "options": ["A. Although", "B. Despite", "C. However", "D. In spite of"], "answer": "A", "explain": "Although + mệnh đề: mặc dù phim đáng sợ."}, {"type": "mcq", "level": "TH", "q": "We enjoyed the film ___ its simple story.", "options": ["A. although", "B. despite", "C. however", "D. though"], "answer": "B", "explain": "Despite + danh từ (its simple story)."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nCritics gave the film mixed reviews. Some called it a masterpiece, others called it dull. Despite this, audiences gave it high scores. The director thanked fans on social media for their support.", "statements": ["All critics loved the film.", "Some critics found it dull.", "Audiences gave it low scores.", "The director thanked the fans."], "answer": ["F", "T", "F", "T"], "explain": "Không phải mọi nhà phê bình đều thích, một số thấy buồn tẻ, khán giả chấm điểm cao (không thấp), đạo diễn cảm ơn người hâm mộ."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nThe film tells the true story of a young inventor. Though he failed many times, he never gave up. In the end, his invention changed many lives. The moving story touched millions of viewers.", "statements": ["The film is based on a true story.", "The inventor gave up after failing.", "His invention helped many people.", "The story moved many viewers."], "answer": ["T", "F", "T", "T"], "explain": "Phim dựa trên chuyện có thật, nhà phát minh không bỏ cuộc (không từ bỏ), phát minh giúp nhiều người, câu chuyện cảm động."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The ending was (shock) ___.", "answer": "shocking", "explain": "Cần tính từ đuôi ing miêu tả phim: shocking (gây sốc)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: I read an interesting film (reviewer) ___.", "answer": "review", "explain": "Cần danh từ: review (bài phê bình)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VD", "q": "___ the film is very long, it never gets boring.", "options": ["A. Despite", "B. In spite of", "C. Although", "D. However"], "answer": "C", "explain": "Sau chỗ trống là mệnh đề nên dùng although."}, {"type": "mcq", "level": "VDC", "q": "___ the rain, ___ the cold, they waited outside the cinema for hours.", "options": ["A. Despite - and", "B. Although - and", "C. Despite - despite", "D. Although - although"], "answer": "C", "explain": "Lặp cấu trúc song song: despite the rain, despite the cold."}, {"type": "mcq", "level": "VDC", "q": "The film was a success ___ the critics' bad reviews.", "options": ["A. although", "B. despite", "C. however", "D. though"], "answer": "B", "explain": "Despite + danh từ (the critics' bad reviews)."}, {"type": "mcq", "level": "TH", "q": "___ she was tired, she stayed to watch the end of the film.", "options": ["A. Despite", "B. Although", "C. However", "D. In spite"], "answer": "B", "explain": "Although + mệnh đề (she was tired)."}, {"type": "mcq", "level": "VDC", "q": "He went to the cinema alone ___ his friends were busy.", "options": ["A. despite", "B. however", "C. although", "D. in spite of"], "answer": "C", "explain": "Although + mệnh đề (his friends were busy)."}, {"type": "mcq", "level": "VDC", "q": "___ all the noise, I managed to enjoy the film.", "options": ["A. Although", "B. Despite", "C. However", "D. Though"], "answer": "B", "explain": "Despite + danh từ (all the noise)."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nStreaming services have changed how we watch films. People no longer need to go to the cinema. However, many still enjoy the big screen experience. Watching with friends makes films more enjoyable.", "statements": ["Streaming changed film watching.", "Nobody goes to the cinema now.", "Many still like the big screen.", "Films are more fun with friends."], "answer": ["T", "F", "T", "T"], "explain": "Xem trực tuyến thay đổi cách xem phim, nhưng không phải không ai đến rạp nữa, nhiều người vẫn thích màn hình lớn, xem cùng bạn vui hơn."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nThe old cinema in our town will close next month. It opened 50 years ago. Many people have happy memories there. They hope the building will become a museum, not a shopping centre.", "statements": ["The cinema opened 50 years ago.", "It will close next month.", "People have sad memories there.", "They want it to become a museum."], "answer": ["T", "T", "F", "T"], "explain": "Rạp mở cách đây 50 năm, sẽ đóng tháng sau, mọi người có kỷ niệm đẹp (không buồn), muốn nó thành bảo tàng."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: ___ the film was frightening, the kids loved it.", "answer": "Although", "explain": "Although + mệnh đề (the film was frightening)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The story was (enjoy) ___ from start to finish.", "answer": "enjoyable", "explain": "Cần tính từ: enjoyable (thú vị)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Mai: What kind of films do you like? - Nam: ___", "options": ["A. I like comedies. They are funny.", "B. I like it.", "C. At the cinema.", "D. Last night."], "answer": "A", "explain": "Hỏi thể loại phim yêu thích thì kể tên thể loại và lý do."}, {"type": "mcq", "level": "VD", "q": "Tom: The film was so boring! - Jerry: ___", "options": ["A. I agree. I almost fell asleep.", "B. Congratulations!", "C. Good luck!", "D. Never mind."], "answer": "A", "explain": "Đồng tình với nhận xét phim chán."}, {"type": "mcq", "level": "TH", "q": "A: Would you like to go to the cinema tonight? - B: ___", "options": ["A. Sorry, I'm busy tonight.", "B. I like films.", "C. At 7 p.m.", "D. It's far."], "answer": "A", "explain": "Trả lời lời mời: nhận lời hoặc từ chối lịch sự."}, {"type": "mcq", "level": "VD", "q": "Lan: How was the film? - Hoa: ___", "options": ["A. It was gripping from start to finish.", "B. It was 2 hours long.", "C. At the new cinema.", "D. With my friends."], "answer": "A", "explain": "Hỏi phim thế nào thì nhận xét về phim."}, {"type": "mcq", "level": "VDC", "q": "Minh: Shall we watch a horror film? - An: ___", "options": ["A. No way! I'm too scared.", "B. Yes, it is.", "C. I don't know him.", "D. At home."], "answer": "A", "explain": "Từ chối lời đề nghị xem phim kinh dị vì sợ."}, {"type": "mcq", "level": "VDC", "q": "A: I think the acting in this film is terrible. - B: ___", "options": ["A. I don't think so. I liked it.", "B. Yes, it is long.", "C. No, I don't.", "D. I think too."], "answer": "A", "explain": "Bày tỏ ý kiến trái ngược một cách lịch sự."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nA good review can help a film succeed. However, a bad review does not always kill a film. Some films with terrible reviews still earn millions. Word of mouth from friends is often more powerful.", "statements": ["Good reviews help films.", "Bad reviews always destroy films.", "Some badly reviewed films earn a lot.", "Friends' opinions matter a lot."], "answer": ["T", "F", "T", "T"], "explain": "Nhận xét tốt giúp phim thành công, nhận xét xấu không phải lúc nào cũng giết chết phim, phim bị chê vẫn có thể thu hàng triệu, ý kiến bạn bè rất quan trọng."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nAnimated films are not just for children. Many adults enjoy their creative stories. Despite simple drawings, they carry deep meanings. Some animated films have won the world's top film prizes.", "statements": ["Animated films are only for kids.", "Adults enjoy them too.", "They can have deep meanings.", "Some won top prizes."], "answer": ["F", "T", "T", "T"], "explain": "Phim hoạt hình không chỉ cho trẻ em, người lớn cũng thích, mang ý nghĩa sâu sắc, một số đã đoạt giải thưởng điện ảnh hàng đầu."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: In ___ of the bad weather, the show went on.", "answer": "spite", "explain": "Cụm in spite of + danh từ: mặc dù."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The film was a great (succeed) ___.", "answer": "success", "explain": "Cần danh từ: success (sự thành công)."}]}]}</script>
