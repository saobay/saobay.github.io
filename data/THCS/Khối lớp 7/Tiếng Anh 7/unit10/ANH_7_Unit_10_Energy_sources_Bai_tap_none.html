<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'o' is pronounced differently from the others.", "options": ["A. power", "B. oil", "C. flow", "D. coal"], "answer": "B", "explain": "'Oil' phát âm là /ɔɪl/ (âm /ɔɪ/), các từ còn lại có âm /əʊ/: coal /kəʊl/, power /ˈpaʊə/, flow /fləʊ/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. dangerous", "B. available", "C. energy", "D. plentiful"], "answer": "B", "explain": "'Available' nhấn âm 2 (a'vailable), các từ còn lại nhấn âm 1: 'energy, 'plentiful, 'dangerous."}, {"type": "mcq", "level": "TH", "q": "Coal, oil and natural gas are called ___ fuels.", "options": ["A. solar", "B. safe", "C. clean", "D. fossil"], "answer": "D", "explain": "Than đá, dầu mỏ, khí tự nhiên gọi là nhiên liệu hóa thạch (fossil fuels)."}, {"type": "mcq", "level": "NB", "q": "___ energy comes from the sun.", "options": ["A. Wind", "B. Hydro", "C. Solar", "D. Nuclear"], "answer": "C", "explain": "Năng lượng mặt trời (solar energy) đến từ mặt trời."}, {"type": "mcq", "level": "VD", "q": "We ___ a test this Friday morning.", "options": ["A. are having", "B. has", "C. is having", "D. have"], "answer": "A", "explain": "Kế hoạch chắc chắn trong tương lai gần dùng thì hiện tại tiếp diễn: are having."}, {"type": "mcq", "level": "VDC", "q": "A: The electricity bill is so high! B: ___", "options": ["A. Bills are made of paper.", "B. Pay it now.", "C. I like money.", "D. We should use less electricity."], "answer": "D", "explain": "Đáp lại lời than phiền tiền điện cao, câu trả lời hợp lý nhất là nên dùng ít điện hơn."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Solar energy comes from the sun. It is clean and safe. Many houses now have solar panels on the roof. Solar panels change sunlight into electricity. Solar energy does not pollute the air.", "statements": ["Solar energy comes from the sun.", "Solar energy is clean and safe.", "Solar panels are put under the roof.", "Solar energy pollutes the air."], "answer": ["T", "T", "F", "F"], "explain": "Tấm pin mặt trời đặt trên mái nhà (roof), không phải dưới mái; năng lượng mặt trời không gây ô nhiễm."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many big cities use too much energy. The air in these cities is dirty because of cars and factories. Scientists say we should use more clean energy. Solar panels and wind turbines can help. If we do not change, the Earth will get hotter.", "statements": ["Big cities use a lot of energy.", "Cars and factories make the air dirty.", "Scientists want us to use more coal.", "Clean energy can help protect the Earth."], "answer": ["T", "T", "F", "T"], "explain": "Các nhà khoa học khuyên dùng năng lượng sạch chứ không phải than đá."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Solar ___ comes from the sun.", "answer": "energy", "explain": "Đáp án là 'energy' (năng lượng mặt trời)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Look! The students (plant) trees in the garden now.", "answer": "are planting", "explain": "Dấu hiệu 'Look!' + 'now' → thì hiện tại tiếp diễn: are planting."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'e' is pronounced differently from the others.", "options": ["A. electricity", "B. plentiful", "C. energy", "D. expensive"], "answer": "D", "explain": "'Expensive' phát âm /ɪkˈspensɪv/ (âm /ɪ/), các từ còn lại có âm /e/: energy /ˈenədʒi/, plentiful /ˈplentɪfl/, electricity /ɪˌlekˈtrɪsəti/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. natural", "B. limited", "C. nuclear", "D. expensive"], "answer": "D", "explain": "'Expensive' nhấn âm 2 (ex'pensive), các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "___ is a gas that causes air pollution.", "options": ["A. Carbon dioxide", "B. Water", "C. Oxygen", "D. Steam"], "answer": "A", "explain": "Khí CO2 (carbon dioxide) gây ô nhiễm không khí."}, {"type": "mcq", "level": "NB", "q": "We should ___ electricity to save money.", "options": ["A. pollute", "B. burn", "C. save", "D. waste"], "answer": "C", "explain": "Chúng ta nên tiết kiệm (save) điện để tiết kiệm tiền."}, {"type": "mcq", "level": "NB", "q": "She ___ for the exam at the moment.", "options": ["A. study", "B. is studying", "C. are studying", "D. studies"], "answer": "B", "explain": "Dấu hiệu 'at the moment' → thì hiện tại tiếp diễn: is studying."}, {"type": "mcq", "level": "VDC", "q": "A: Why is the air so dirty today? B: ___", "options": ["A. It is windy today.", "B. I like clean air.", "C. Air is a kind of gas.", "D. Because there are too many cars and factories."], "answer": "D", "explain": "Câu trả lời giải thích nguyên nhân không khí bẩn một cách hợp lý nhất."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Wind energy comes from moving air. People build wind turbines in windy places. The turbines change wind into electricity. Wind energy is cheap and clean. However, it is not always windy.", "statements": ["Wind energy comes from moving air.", "Wind turbines make electricity.", "Wind energy is expensive and dirty.", "It is always windy everywhere."], "answer": ["T", "T", "F", "F"], "explain": "Năng lượng gió rẻ và sạch, nhưng không phải lúc nào cũng có gió."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Lan's family put solar panels on their roof last year. Now they pay less money for electricity. On sunny days, the panels make enough electricity for the house. On cloudy days, they still need electricity from the power station. Lan says solar energy is convenient.", "statements": ["Lan's family uses only solar energy.", "They pay less for electricity now.", "On cloudy days they need electricity from the power station.", "Lan thinks solar energy is dangerous."], "answer": ["F", "T", "T", "F"], "explain": "Ngày nhiều mây họ vẫn cần điện lưới; Lan thấy năng lượng mặt trời tiện lợi."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: We should ___ electricity at home.", "answer": "save", "explain": "Đáp án là 'save' (tiết kiệm điện)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She (save) electricity at the moment.", "answer": "is saving", "explain": "Dấu hiệu 'at the moment' → thì hiện tại tiếp diễn: is saving."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. waste", "B. natural", "C. gas", "D. save"], "answer": "B", "explain": "'Natural' phát âm /ˈnætʃrəl/ (âm /æ/), các từ còn lại có âm /eɪ/: gas /ɡæs/, save /seɪv/, waste /weɪst/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. energy", "B. dangerous", "C. plentiful", "D. convenient"], "answer": "D", "explain": "'Convenient' nhấn âm 2 (con'venient), các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Hydro energy comes from ___.", "options": ["A. moving water", "B. the sun", "C. atoms", "D. the wind"], "answer": "A", "explain": "Thủy điện (hydro energy) đến từ dòng nước chuyển động."}, {"type": "mcq", "level": "NB", "q": "Wind ___ is clean and never runs out.", "options": ["A. gas", "B. energy", "C. oil", "D. coal"], "answer": "B", "explain": "Năng lượng gió (wind energy) sạch và không bao giờ cạn."}, {"type": "mcq", "level": "VD", "q": "They ___ to Ha Long Bay tomorrow.",  "short", "level": "VDC", "q": "Give the correct form of the word in brackets: They (build) a new solar power station this year.", "answer": "are building", "explain": "Hành động đang diễn ra trong thời gian này (this year) → are building."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. expensive", "B. oil", "C. limited", "D. wind"], "answer": "B", "explain": "'Oil' phát âm /ɔɪl/ (âm /ɔɪ/), các từ còn lại có âm /ɪ/: wind /wɪnd/, limited /ˈlɪmɪtɪd/, expensive /ɪkˈspensɪv/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. energy", "B. dangerous", "C. limited", "D. expensive"], "answer": "D", "explain": "'Expensive' nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "The opposite of 'save' is ___.", "options": ["A. waste", "B. protect", "C. use", "D. keep"], "answer": "A", "explain": "Trái nghĩa với 'save' (tiết kiệm) là 'waste' (lãng phí)."}, {"type": "mcq", "level": "NB", "q": "We get ___ from power stations to our homes.", "options": ["A. water", "B. coal", "C. electricity", "D. gas"], "answer": "C", "explain": "Chúng ta nhận điện (electricity) từ các nhà máy điện."}, {"type": "mcq", "level": "NB", "q": "Look! The children ___ in the river.", "options": ["A. are swimming", "B. is swimming", "C. swims", "D. swim"], "answer": "A", "explain": "Dấu hiệu 'Look!' → hành động đang diễn ra: are swimming."}, {"type": "mcq", "level": "VDC", "q": "A: What can we do to save energy at home? B: ___", "options": ["A. I like saving things.", "B. Do nothing at all.", "C. Turn off the lights when you leave the room.", "D. Energy is very good."], "answer": "C", "explain": "Câu trả lời đưa ra hành động cụ thể, thiết thực để tiết kiệm điện."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Hydro energy comes from moving water. People build dams on rivers to make hydro power stations. Water falls down and turns big machines. The machines make electricity. Hydro energy is clean, but building dams is expensive.", "statements": ["Hydro energy comes from moving water.", "Hydro power stations are built on mountains.", "Hydro energy is clean.", "Building dams is cheap."], "answer": ["T", "F", "T", "F"], "explain": "Nhà máy thủy điện xây trên sông (đập), và xây đập tốn kém."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). In the past, people burned wood to cook and keep warm. Then they found coal and oil. Factories grew and cities needed more energy. Now we know fossil fuels pollute the air. Scientists are looking for cleaner energy.", "statements": ["People in the past used solar panels.", "Factories and cities need a lot of energy.", "Fossil fuels pollute the air.", "Scientists do not care about clean energy."], "answer": ["F", "T", "T", "F"], "explain": "Ngày xưa người ta đốt củi; các nhà khoa học đang tìm năng lượng sạch hơn."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: ___ energy comes from moving air.", "answer": "Wind", "explain": "Đáp án là 'Wind' (năng lượng gió đến từ không khí chuyển động)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: I (visit) my grandmother tomorrow.", "answer": "am visiting", "explain": "Kế hoạch tương lai gần (tomorrow) → hiện tại tiếp diễn: am visiting."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. gas", "B. source", "C. solar", "D. use"], "answer": "D", "explain": "'Use' phát âm /juːz/ (âm /z/), các từ còn lại có âm /s/: source /sɔːs/, solar /ˈsəʊlə/, gas /ɡæs/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. expensive", "B. convenient", "C. available", "D. nuclear"], "answer": "D", "explain": "'Nuclear' nhấn âm 1 ('nuclear), các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "'Easy to use' means ___.", "options": ["A. dirty", "B. expensive", "C. dangerous", "D. convenient"], "answer": "D", "explain": "'Convenient' nghĩa là tiện lợi, dễ sử dụng."}, {"type": "mcq", "level": "NB", "q": "A power ___ makes electricity for our homes.", "options": ["A. bus", "B. shop", "C. station", "D. school"], "answer": "C", "explain": "Nhà máy điện (power station) sản xuất điện."}, {"type": "mcq", "level": "VD", "q": "I ___ my grandparents next Sunday.", "options": ["A. is visiting", "B. am visiting", "C. visit", "D. visits"], "answer": "B", "explain": "Kế hoạch tương lai gần (next Sunday) → am visiting."}, {"type": "mcq", "level": "VDC", "q": "A: Is solar energy expensive? B: ___", "options": ["A. The panels cost a lot, but the sunlight is free.", "B. The sun is very hot.", "C. I like sunny days.", "D. Yes, very expensive."], "answer": "A", "explain": "Câu trả lời đầy đủ, cân bằng hai mặt của vấn đề."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Nuclear energy comes from atoms. Nuclear power stations make a lot of electricity. Nuclear energy does not make carbon dioxide. However, it can be very dangerous. An accident can hurt people and nature.", "statements": ["Nuclear energy comes from atoms.", "Nuclear power stations make a lot of electricity.", "Nuclear energy makes a lot of carbon dioxide.", "Nuclear energy is always safe."], "answer": ["T", "T", "F", "F"], "explain": "Năng lượng hạt nhân không tạo CO2 nhưng có thể rất nguy hiểm."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). A small village in the mountains has no electricity from the national grid. The villagers built a small hydro power station on the river. Now every house has light at night. Children can study in the evening. The villagers are very happy.", "statements": ["The village is in the mountains.", "The village gets electricity from the national grid.", "Children can study in the evening now.", "The villagers are unhappy."], "answer": ["T", "F", "T", "F"], "explain": "Ngôi làng tự xây nhà máy thủy điện nhỏ, không dùng điện lưới quốc gia."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Carbon ___ is a gas that pollutes the air.", "answer": "dioxide", "explain": "Đáp án là 'dioxide' (khí CO2 gây ô nhiễm)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Listen! The baby (cry).", "answer": "is crying", "explain": "Dấu hiệu 'Listen!' → hành động đang diễn ra: is crying."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'c' is pronounced differently from the others.", "options": ["A. ocean", "B. coal", "C. convenient", "D. carbon"], "answer": "A", "explain": "'Ocean' phát âm /ˈəʊʃn/ (âm /ʃ/), các từ còn lại có âm /k/: coal /kəʊl/, carbon /ˈkɑːbən/, convenient /kənˈviːniənt/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. natural", "B. convenient", "C. energy", "D. limited"], "answer": "B", "explain": "'Convenient' nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "VD", "q": "Solar energy is ___ because the sun will shine for billions of years.", "options": ["A. plentiful", "B. limited", "C. expensive", "D. dangerous"], "answer": "A", "explain": "Năng lượng mặt trời dồi dào (plentiful) vì mặt trời còn chiếu sáng hàng tỷ năm."}, {"type": "mcq", "level": "TH", "q": "Nuclear energy can be very ___.", "options": ["A. safe", "B. clean", "C. dangerous", "D. cheap"], "answer": "C", "explain": "Năng lượng hạt nhân có thể rất nguy hiểm (dangerous)."}, {"type": "mcq", "level": "NB", "q": "My mother ___ dinner in the kitchen now.", "options": ["A. is cooking", "B. cook", "C. cooks", "D. are cooking"], "answer": "A", "explain": "Dấu hiệu 'now' → hành động đang diễn ra: is cooking."}, {"type": "mcq", "level": "VDC", "q": "A: Our village has no electricity. B: ___", "options": ["A. Villages are very small.", "B. I like big cities.", "C. That is too bad.", "D. You can use solar panels. They are convenient."], "answer": "D", "explain": "Câu trả lời đưa ra giải pháp thiết thực cho làng chưa có điện."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). We should save energy every day. Turn off the lights when you leave a room. Do not leave the TV on all night. Take a shower instead of a bath to save water. Saving energy also saves money.", "statements": ["We should save energy every day.", "We should turn off lights when leaving a room.", "We should leave the TV on all night.", "Saving energy wastes money."], "answer": ["T", "T", "F", "F"], "explain": "Không nên để TV mở suốt đêm; tiết kiệm năng lượng cũng tiết kiệm tiền."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Cars use a lot of oil. Oil will run out one day, and it is getting more expensive. Electric cars use electricity, not oil. If the electricity comes from solar or wind, electric cars are very clean. Many people will buy electric cars in the future.", "statements": ["Cars use a lot of oil.", "Oil is getting more expensive.", "Electric cars use oil.", "Electric cars can be very clean."], "answer": ["T", "T", "F", "T"], "explain": "Xe điện dùng điện chứ không dùng dầu; sẽ rất sạch nếu điện từ mặt trời/gió."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Hydro energy comes from ___.", "answer": "water", "explain": "Đáp án là 'water' (thủy điện đến từ nước)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The engineers (install) solar panels this week.", "answer": "are installing", "explain": "Hành động diễn ra trong khoảng thời gian này (this week) → are installing."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'th' is pronounced differently from the others.", "options": ["A. think", "B. Earth", "C. thank", "D. this"], "answer": "D", "explain": "'This' phát âm /ðɪs/ (âm /ð/), các từ còn lại có âm /θ/: Earth /ɜːθ/, think /θɪŋk/, thank /θæŋk/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. dangerous", "B. convenient", "C. available", "D. expensive"], "answer": "A", "explain": "'Dangerous' nhấn âm 1, các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "VD", "q": "Biogas is made from ___.", "options": ["A. coal", "B. animal waste", "C. plastic", "D. oil"], "answer": "B", "explain": "Khí sinh học (biogas) được tạo ra từ chất thải động vật."}, {"type": "mcq", "level": "TH", "q": "Coal and oil are ___; they will run out one day.", "options": ["A. safe", "B. plentiful", "C. clean", "D. limited"], "answer": "D", "explain": "Than và dầu có hạn (limited); chúng sẽ cạn kiệt."}, {"type": "mcq", "level": "VD", "q": "She ___ her friends this evening.", "options": ["A. are meeting", "B. is meeting", "C. meets", "D. meet"], "answer": "B", "explain": "Kế hoạch chắc chắn tối nay (this evening) → is meeting."}, {"type": "mcq", "level": "VDC", "q": "A: Will coal run out one day? B: ___", "options": ["A. I don't know.", "B. Coal is black.", "C. Yes, so we should use more renewable energy.", "D. Maybe one day."], "answer": "C", "explain": "Câu trả lời khẳng định và đưa ra hướng giải quyết hợp lý."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Biogas is a kind of clean energy. People make biogas from animal waste and food waste. Farmers can use biogas for cooking. Biogas does not cost much money. It helps keep the farm clean.", "statements": ["Biogas is clean energy.", "Biogas is made from animal waste.", "Farmers cannot use biogas.", "Biogas is very expensive."], "answer": ["T", "T", "F", "F"], "explain": "Nông dân có thể dùng biogas để nấu ăn; biogas không tốn nhiều tiền."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Wasting energy is bad for the Earth. Leaving lights on all day wastes electricity. Taking very long showers wastes water and energy. We can walk or ride a bike for short trips. Small actions can save a lot of energy.", "statements": ["Wasting energy is bad for the Earth.", "Leaving lights on all day saves electricity.", "Walking for short trips saves energy.", "Small actions cannot save energy."], "answer": ["T", "F", "T", "F"], "explain": "Để đèn sáng cả ngày là lãng phí; hành động nhỏ cũng tiết kiệm được nhiều năng lượng."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: ___ can be very dangerous if there is an accident.", "answer": "Nuclear", "explain": "Đáp án là 'Nuclear' (năng lượng hạt nhân rất nguy hiểm nếu có sự cố)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She (meet) her friends this evening.", "answer": "is meeting", "explain": "Kế hoạch tương lai gần (this evening) → is meeting."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'u' is pronounced differently from the others.", "options": ["A. natural", "B. useful", "C. student", "D. nuclear"], "answer": "A", "explain": "'Natural' phát âm /ˈnætʃrəl/ (chữ 'u' đọc là /ə/), các từ còn lại có âm /uː/: nuclear /ˈnjuːkliə/, useful /ˈjuːsfəl/, student /ˈstjuːdənt/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. convenient", "B. nuclear", "C. available", "D. expensive"], "answer": "B", "explain": "'Nuclear' nhấn âm 1, các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "VD", "q": "Natural gas is ___ than coal.", "options": ["A. dirtier", "B. cleaner", "C. harder", "D. blacker"], "answer": "B", "explain": "Khí tự nhiên sạch hơn (cleaner) than đá."}, {"type": "mcq", "level": "TH", "q": "Which source of energy is NOT renewable?", "options": ["A. Wind", "B. Coal", "C. Hydro", "D. Solar"], "answer": "B", "explain": "Than đá (coal) là nhiên liệu hóa thạch, không tái tạo được."}, {"type": "mcq", "level": "NB", "q": "Be quiet! The baby ___.", "options": ["A. are sleeping", "B. is sleeping", "C. sleep", "D. sleeps"], "answer": "B", "explain": "Hành động đang diễn ra (em bé đang ngủ) → is sleeping."}, {"type": "mcq", "level": "VDC", "q": "A: I left the TV on all night yesterday. B: ___", "options": ["A. TV programmes are fun.", "B. I like watching TV.", "C. You shouldn't waste electricity like that.", "D. Good for you."], "answer": "C", "explain": "Câu trả lời đưa ra lời khuyên phù hợp với việc lãng phí điện."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Natural gas is a fossil fuel. People use it for cooking and heating. It is cleaner than coal and oil. However, it will also run out one day. We should use it carefully.", "statements": ["Natural gas is a fossil fuel.", "People use natural gas for cooking.", "Natural gas is dirtier than coal.", "Natural gas will never run out."], "answer": ["T", "T", "F", "F"], "explain": "Khí tự nhiên sạch hơn than; nhưng rồi cũng sẽ cạn kiệt."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The sun gives the Earth a huge amount of energy every day. Only a small part of it is used by people. Scientists are making better solar panels. In the future, solar energy may be the cheapest energy. It is plentiful and free.", "statements": ["The sun gives the Earth a lot of energy.", "People use most of the sun's energy now.", "Scientists are making better solar panels.", "Solar energy is plentiful."], "answer": ["T", "F", "T", "T"], "explain": "Con người mới dùng một phần nhỏ năng lượng mặt trời."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Oil and coal are ___ of energy.", "answer": "sources", "explain": "Đáp án là 'sources' (dầu và than là các nguồn năng lượng)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: He (do) his homework at the moment.", "answer": "is doing", "explain": "Dấu hiệu 'at the moment' → is doing."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. expensive", "B. biogas", "C. wind", "D. plentiful"], "answer": "B", "explain": "'Biogas' phát âm /ˈbaɪəʊɡæs/ (âm /aɪ/), các từ còn lại có âm /ɪ/: wind /wɪnd/, plentiful /ˈplentɪfl/, expensive /ɪkˈspensɪv/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. natural", "B. limited", "C. available", "D. energy"], "answer": "C", "explain": "'Available' nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "VD", "q": "'The place something comes from' is a ___.", "options": ["A. box", "B. machine", "C. waste", "D. source"], "answer": "D", "explain": "'Source' nghĩa là nguồn, nơi bắt nguồn của thứ gì đó."}, {"type": "mcq", "level": "TH", "q": "Which source of energy does NOT make carbon dioxide?", "options": ["A. Coal", "B. Gas", "C. Oil", "D. Nuclear"], "answer": "D", "explain": "Năng lượng hạt nhân không tạo ra khí CO2."}, {"type": "mcq", "level": "VD", "q": "Which sentence talks about a future plan?", "options": ["A. I am visiting my uncle tomorrow.", "B. I like visiting my uncle.", "C. I visited my uncle yesterday.", "D. I visit my uncle every week."], "answer": "A", "explain": "Câu A dùng hiện tại tiếp diễn với 'tomorrow' → kế hoạch tương lai gần."}, {"type": "mcq", "level": "VDC", "q": "A: Which energy is the cleanest? B: ___", "options": ["A. Solar and wind. They don't pollute the air.", "B. I like all kinds of energy.", "C. All of them are clean.", "D. Coal and oil."], "answer": "A", "explain": "Năng lượng mặt trời và gió là sạch nhất vì không gây ô nhiễm."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Electricity helps us in many ways. We use it for lights, fans and computers. We should not waste electricity. Turn off machines when we do not use them. Using less electricity is good for the Earth.", "statements": ["Electricity helps us a lot.", "We should waste electricity.", "We should turn off machines we do not use.", "Using less electricity is good for the Earth."], "answer": ["T", "F", "T", "T"], "explain": "Không nên lãng phí điện; tắt máy khi không dùng."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some countries have a lot of wind, like Denmark. They build many wind turbines near the sea. On windy days, wind turbines make more electricity than the country needs. They can even sell electricity to other countries. Wind energy brings them money.", "statements": ["Denmark has a lot of wind.", "Wind turbines in Denmark are built in deserts.", "Windy days bring more electricity.", "Wind energy brings Denmark no money."], "answer": ["T", "F", "T", "F"], "explain": "Tuabin gió xây gần biển; năng lượng gió mang lại tiền cho Đan Mạch."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Biogas is made from animal ___.", "answer": "waste", "explain": "Đáp án là 'waste' (khí sinh học từ chất thải động vật)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: My parents (buy) a new car next month.", "answer": "are buying", "explain": "Kế hoạch tương lai gần (next month) → are buying."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. natural", "B. available", "C. waste", "D. dangerous"], "answer": "A", "explain": "'Natural' phát âm /ˈnætʃrəl/ (âm /æ/), các từ còn lại có âm /eɪ/: available /əˈveɪləbl/, dangerous /ˈdeɪndʒərəs/, waste /weɪst/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. energy", "B. limited", "C. dangerous", "D. available"], "answer": "D", "explain": "'Available' nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "VD", "q": "'Available' means ___.", "options": ["A. can be used or bought", "B. very expensive", "C. dangerous", "D. dirty"], "answer": "A", "explain": "'Available' nghĩa là có sẵn, có thể sử dụng."}, {"type": "mcq", "level": "TH", "q": "People put solar ___ on the roof to get electricity.", "options": ["A. windows", "B. doors", "C. walls", "D. panels"], "answer": "D", "explain": "Người ta đặt tấm pin mặt trời (solar panels) trên mái nhà."}, {"type": "mcq", "level": "NB", "q": "They ___ TV in the living room now.", "options": ["A. watches", "B. is watching", "C. are watching", "D. watch"], "answer": "C", "explain": "Dấu hiệu 'now' → hành động đang diễn ra: are watching."}, {"type": "mcq", "level": "VDC", "q": "A: Let's ride our bikes to school. B: ___", "options": ["A. Our school is far.", "B. Good idea! It saves energy and is good for health.", "C. I like walking.", "D. Bikes have two wheels."], "answer": "B", "explain": "Câu trả lời đồng ý và nêu lợi ích của việc đạp xe."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Solar, wind and hydro are renewable sources of energy. They will never run out. They do not pollute the environment. Many countries are using more renewable energy now. It is the energy of the future.", "statements": ["Solar energy is renewable.", "Renewable energy will never run out.", "Renewable energy pollutes the environment.", "Many countries use more renewable energy now."], "answer": ["T", "T", "F", "T"], "explain": "Năng lượng tái tạo không cạn kiệt và không gây ô nhiễm."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Plants need sunlight to grow. Long ago, dead plants became coal under the ground. When we burn coal, we put carbon dioxide into the air. Too much carbon dioxide makes the Earth hotter. That is why we should use less coal.", "statements": ["Plants need sunlight to grow.", "Coal comes from dead plants long ago.", "Burning coal cleans the air.", "We should use less coal."], "answer": ["T", "T", "F", "T"], "explain": "Đốt than thải CO2 làm Trái Đất nóng lên, nên dùng ít than hơn."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: ___ panels change sunlight into electricity.", "answer": "Solar", "explain": "Đáp án là 'Solar' (tấm pin mặt trời biến ánh sáng thành điện)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: They (fly) to Singapore next Monday.", "answer": "are flying", "explain": "Kế hoạch tương lai gần (next Monday) → are flying."}]}]}</script>
