<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the sentence with the correct sentence stress pattern. Stressed words are in CAPITAL LETTERS.", "options": ["A. I WILL TRAVEL TO LONDON NEXT WEEK.", "B. i will travel to london next week", "C. I WILL travel TO London next WEEK.", "D. I will TRAVEL to LONDON NEXT WEEK."], "answer": "D", "explain": "Nhấn các từ mang nghĩa (TRAVEL, LONDON, NEXT WEEK); không nhấn will, to."}, {"type": "mcq", "level": "TH", "q": "In the following sentence, which words are usually STRESSED? She will fly to Paris.", "options": ["A. She, fly, Paris", "B. She, will, fly, to, Paris", "C. fly, Paris", "D. will, to"], "answer": "C", "explain": "Động từ chính 'fly' và danh từ 'Paris' được nhấn; đại từ, will, to không nhấn."}, {"type": "mcq", "level": "TH", "q": "A ___ is a car that does not need a driver.", "options": ["A. driverless car", "B. bus", "C. truck", "D. taxi"], "answer": "A", "explain": "Xe không người lái (driverless car) không cần tài xế."}, {"type": "mcq", "level": "NB", "q": "The ___ train travels very fast between cities.", "options": ["A. small", "B. slow", "C. old", "D. bullet"], "answer": "D", "explain": "Tàu cao tốc (bullet train) chạy rất nhanh."}, {"type": "mcq", "level": "VD", "q": "A: I've decided to lose weight. B: I ___ help you with your diet.", "options": ["A. will", "B. am", "C. did", "D. do"], "answer": "A", "explain": "Quyết định đưa ra ngay lúc nói → dùng 'will'."}, {"type": "mcq", "level": "VDC", "q": "A: This suitcase is so heavy! B: ___", "options": ["A. It is very heavy.", "B. I like suitcases.", "C. Let me help you carry it.", "D. It belongs to you."], "answer": "C", "explain": "Câu trả lời đưa ra lời đề nghị giúp đỡ phù hợp nhất."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). In the future, many people will travel by driverless car. These cars do not need a driver. Passengers can read or sleep on the way. Driverless cars will make roads safer. They will also help old people travel easily.", "statements": ["Driverless cars will be popular in the future.", "Driverless cars do not need a driver.", "Passengers must drive carefully.", "Driverless cars will help old people."], "answer": ["T", "T", "F", "T"], "explain": "Xe không người lái không cần tài xế; hành khách có thể nghỉ ngơi."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Mai thinks travelling in the future will be very different. She will take a hyperloop to school every day. It will take her only five minutes. She will not need to wake up early. Her mother thinks it is just a dream.", "statements": ["Mai thinks future travel will be different.", "The hyperloop will take Mai five minutes to school.", "Mai will need to wake up earlier.", "Mai's mother is sure it will happen."], "answer": ["T", "T", "F", "F"], "explain": "Mai không cần dậy sớm; mẹ cô nghĩ đó chỉ là giấc mơ."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: I ___ live on the Moon one day.", "answer": "will", "explain": "Đáp án là 'will' (thì tương lai đơn)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She (travel) to Paris next summer.", "answer": "will travel", "explain": "Kế hoạch/dự định tương lai (next summer) → will travel."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "TH", "q": "Choose the sentence with the correct sentence stress pattern. Stressed words are in CAPITAL LETTERS.", "options": ["A. My new car will fly to school.", "B. MY new car WILL fly TO school.", "C. MY NEW CAR WILL FLY TO SCHOOL.", "D. My NEW CAR will FLY to SCHOOL."], "answer": "D", "explain": "Nhấn danh từ, tính từ, động từ chính (NEW CAR, FLY, SCHOOL); không nhấn MY, will, to."}, {"type": "mcq", "level": "NB", "q": "In the following sentence, which words are usually STRESSED? I will take a bullet train.", "options": ["A. will, a", "B. I, bullet train", "C. I, will, take", "D. take, bullet train"], "answer": "D", "explain": "Động từ chính 'take' và danh từ 'bullet train' được nhấn."}, {"type": "mcq", "level": "TH", "q": "A ___ can take people into space.", "options": ["A. boat", "B. bicycle", "C. spaceship", "D. train"], "answer": "C", "explain": "Tàu vũ trụ (spaceship) đưa người vào không gian."}, {"type": "mcq", "level": "NB", "q": "In the ___, people may live on Mars.", "options": ["A. future", "B. past", "C. night", "D. morning"], "answer": "A", "explain": "Trong tương lai (future), người ta có thể sống trên sao Hỏa."}, {"type": "mcq", "level": "NB", "q": "She ___ travel by bus tomorrow.", "options": ["A. is", "B. does", "C. will", "D. did"], "answer": "C", "explain": "Diễn tả tương lai (tomorrow) → will + V nguyên thể."}, {"type": "mcq", "level": "VDC", "q": "A: I'm afraid I'll be late for school. B: ___", "options": ["A. Being late is bad.", "B. I like fast trains.", "C. School starts early.", "D. Don't worry. The hyperloop is super fast."], "answer": "D", "explain": "Câu trả lời trấn an và đưa ra giải pháp hợp lý."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). The bullet train is very fast. It can travel at 300 kilometres per hour. Many people take the bullet train to work. It is faster than a car and cheaper than a plane. In the future, bullet trains will be even faster.", "statements": ["The bullet train travels very fast.", "Many people take the bullet train to work.", "The bullet train is slower than a car.", "Bullet trains will disappear in the future."], "answer": ["T", "T", "F", "F"], "explain": "Tàu cao tốc nhanh hơn ô tô và sẽ còn nhanh hơn trong tương lai."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). A solar-powered plane flew around the world in 2016. It used only energy from the sun. The trip took more than a year with many stops. It was slow, but it showed solar energy can power planes. Future planes may be faster.", "statements": ["The solar plane used oil.", "The trip took more than a year.", "The plane showed solar energy can power planes.", "The solar plane flew non-stop in one day."], "answer": ["F", "T", "T", "F"], "explain": "Máy bay chỉ dùng năng lượng mặt trời, chuyến đi kéo dài hơn một năm với nhiều điểm dừng."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: A ___ car does not need a driver.", "answer": "driverless", "explain": "Đáp án là 'driverless' (xe không người lái)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: They (live) on Mars in the future.", "answer": "will live", "explain": "Dự đoán tương lai (in the future) → will live."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the sentence with the correct sentence stress pattern. Stressed words are in CAPITAL LETTERS.", "options": ["A. They will USE a DRIVERLESS CAR.", "B. They WILL use A driverless CAR.", "C. they will use a driverless car", "D. THEY WILL USE A DRIVERLESS CAR."], "answer": "A", "explain": "Nhấn động từ chính và danh từ (USE, DRIVERLESS CAR); không nhấn They, will, a."}, {"type": "mcq", "level": "TH", "q": "In the following sentence, which words are usually STRESSED? They will live in driverless cars.", "options": ["A. live, driverless cars", "B. They, driverless", "C. will, in", "D. They, will, live"], "answer": "A", "explain": "'Live' (động từ chính) và 'driverless cars' (danh từ) được nhấn."}, {"type": "mcq", "level": "TH", "q": "The ___ runs on high tracks above the street.", "options": ["A. bus", "B. subway", "C. tram", "D. skytrain"], "answer": "D", "explain": "Tàu trên cao (skytrain) chạy trên đường ray cao phía trên đường phố."}, {"type": "mcq", "level": "NB", "q": "Birds can ___ in the sky.", "options": ["A. fly", "B. walk", "C. swim", "D. run"], "answer": "A", "explain": "Chim bay (fly) trên trời."}, {"type": "mcq", "level": "VD", "q": "Their car is fast, but ___ is faster.", "options": ["A. us", "B. we", "C. our", "D. ours"], "answer": "D", "explain": "Đại từ sở hữu 'ours' (= our car) đứng độc lập, không kèm danh từ."}, {"type": "mcq", "level": "VDC", "q": "A: Whose idea was the solar-powered bus? B: ___", "options": ["A. It was powered well.", "B. It was sunny yesterday.", "C. It was the students'.", "D. It was a big bus."], "answer": "C", "explain": "Câu trả lời đúng dạng sở hữu (the students' = ý tưởng của các học sinh)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Scientists think people will travel to Mars one day. A spaceship can take people into space. The trip will take many months. People will need food, water and air on the spaceship. It will be a very exciting journey.", "statements": ["People may travel to Mars in the future.", "A spaceship travels under the sea.", "The trip to Mars will take many months.", "People will need nothing on the spaceship."], "answer": ["T", "F", "T", "F"], "explain": "Tàu vũ trụ bay vào không gian; cần mang theo thức ăn, nước và không khí."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some people are afraid of driverless cars. They think computers can make mistakes. But studies show driverless cars have fewer accidents than human drivers. They never get tired or drunk. In the future, they may be the safest cars.", "statements": ["Some people are afraid of driverless cars.", "Studies show driverless cars have more accidents.", "Driverless cars never get tired.", "Driverless cars may be the safest cars."], "answer": ["T", "F", "T", "T"], "explain": "Nghiên cứu cho thấy xe tự lái ít tai nạn hơn xe do người lái."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The ___ train travels very fast.", "answer": "bullet", "explain": "Đáp án là 'bullet' (tàu cao tốc)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: He (buy) a flying car next year.", "answer": "will buy", "explain": "Dự định tương lai (next year) → will buy."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Choose the sentence with the correct sentence stress pattern. Stressed words are in CAPITAL LETTERS.", "options": ["A. THE bullet TRAIN is VERY fast.", "B. The BULLET TRAIN is very FAST.", "C. The BULLET TRAIN IS VERY FAST.", "D. The bullet train is very FAST."], "answer": "B", "explain": "Nhấn đầy đủ các từ mang nghĩa (BULLET TRAIN, FAST); không nhấn The, is, very."}, {"type": "mcq", "level": "NB", "q": "In the following sentence, which words are usually STRESSED? We will visit the Moon.", "options": ["A. visit, Moon", "B. will, the", "C. We, Moon", "D. We, will, visit"], "answer": "A", "explain": "'Visit' (động từ chính) và 'Moon' (danh từ) được nhấn."}, {"type": "mcq", "level": "TH", "q": "A ___ car uses energy from the sun.", "options": ["A. solar-powered", "B. red", "C. old", "D. broken"], "answer": "A", "explain": "Xe chạy bằng năng lượng mặt trời (solar-powered)."}, {"type": "mcq", "level": "NB", "q": "My new car is fast and ___.", "options": ["A. old", "B. slow", "C. comfortable", "D. broken"], "answer": "C", "explain": "Xe mới nhanh và thoải mái (comfortable)."}, {"type": "mcq", "level": "NB", "q": "They ___ visit Ha Noi next week.", "options": ["A. are", "B. will", "C. do", "D. does"], "answer": "B", "explain": "Diễn tả tương lai (next week) → will + V nguyên thể."}, {"type": "mcq", "level": "VDC", "q": "A: Will there be traffic jams in the future? B: ___", "options": ["A. Traffic jams are bad.", "B. Maybe not.", "C. I don't think so. Driverless cars will plan better routes.", "D. I like driving cars."], "answer": "C", "explain": "Câu trả lời đầy đủ: nêu ý kiến và lý do thuyết phục."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). The skytrain runs on high tracks above the street. It does not get stuck in traffic. Many big cities are building skytrains now. The skytrain is fast and comfortable. It helps reduce traffic jams.", "statements": ["The skytrain runs above the street.", "The skytrain does not get stuck in traffic.", "The skytrain is slow and uncomfortable.", "The skytrain helps reduce traffic jams."], "answer": ["T", "T", "F", "T"], "explain": "Tàu trên cao nhanh, thoải mái và giúp giảm kẹt xe."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). In the past, people travelled by horse or on foot. Then trains and cars changed travel. Planes made the world smaller. Now scientists are making spaceships for everyone. Each new transport changes our life.", "statements": ["People in the past travelled by plane.", "Trains and cars changed travel.", "Planes made the world smaller.", "New transport never changes our life."], "answer": ["F", "T", "T", "F"], "explain": "Ngày xưa đi bằng ngựa hoặc đi bộ; mỗi phương tiện mới đều thay đổi cuộc sống."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: This bag is mine. That one is ___.", "answer": "yours", "explain": "Đáp án là 'yours' (đại từ sở hữu, đứng độc lập)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: That house is not mine. It's (they).", "answer": "theirs", "explain": "Đại từ sở hữu của 'they' là 'theirs', không kèm danh từ."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the sentence with the correct sentence stress pattern. Stressed words are in CAPITAL LETTERS.", "options": ["A. We will TELEPORT to PARIS in the FUTURE.", "B. we will teleport to paris in the future", "C. We WILL TELEPORT to Paris IN future.", "D. WE will teleport TO Paris in THE future."], "answer": "A", "explain": "Nhấn động từ chính và danh từ (TELEPORT, PARIS, FUTURE); không nhấn We, will, to, in, the."}, {"type": "mcq", "level": "TH", "q": "In the following sentence, which words are usually STRESSED? He will buy a solar-powered bike.", "options": ["A. He, bike", "B. buy, solar-powered bike", "C. will, a", "D. He, will, buy"], "answer": "B", "explain": "'Buy' và 'solar-powered bike' mang nghĩa chính nên được nhấn."}, {"type": "mcq", "level": "TH", "q": "___ means good for the environment.", "options": ["A. Expensive", "B. Eco-friendly", "C. Noisy", "D. Dangerous"], "answer": "B", "explain": "'Eco-friendly' nghĩa là thân thiện với môi trường."}, {"type": "mcq", "level": "NB", "q": "The new bus is very ___.", "options": ["A. dirty", "B. slow", "C. modern", "D. old"], "answer": "C", "explain": "Xe buýt mới rất hiện đại (modern)."}, {"type": "mcq", "level": "VD", "q": "'___ you help me with this box?' 'Sure, I will.'", "options": ["A. Are", "B. Will", "C. Did", "D. Do"], "answer": "B", "explain": "Lời đề nghị giúp đỡ trong tương lai → Will you...?"}, {"type": "mcq", "level": "VDC", "q": "A: I want to travel to the Moon one day. B: ___", "options": ["A. Good night.", "B. The Moon is round.", "C. Wow! That will be an amazing journey.", "D. I like looking at the sky."], "answer": "C", "explain": "Câu trả lời thể hiện sự hào hứng, phù hợp với ngữ cảnh."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Hyperloop is a new kind of transport. It is a train that travels inside a tube. It can go as fast as a plane. People will travel between cities in minutes. Hyperloop will save a lot of time.", "statements": ["Hyperloop is a new means of transport.", "Hyperloop travels inside a tube.", "Hyperloop is slower than a bus.", "Hyperloop will save time."], "answer": ["T", "T", "F", "T"], "explain": "Hyperloop chạy trong ống, nhanh như máy bay."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Tokyo has one of the best transport systems in the world. Its bullet trains are always on time. Millions of people use them every day. The trains are clean and comfortable. Other countries want to learn from Japan.", "statements": ["Tokyo's transport system is very good.", "Bullet trains in Tokyo are always on time.", "Few people use bullet trains in Tokyo.", "Other countries want to learn from Japan."], "answer": ["T", "T", "F", "T"], "explain": "Hàng triệu người dùng tàu cao tốc Tokyo mỗi ngày."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: A ___ can take people into space.", "answer": "spaceship", "explain": "Đáp án là 'spaceship' (tàu vũ trụ)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: We (use) solar-powered buses soon.", "answer": "will use", "explain": "Dự định tương lai (soon) → will use."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Choose the sentence with the correct sentence stress pattern. Stressed words are in CAPITAL LETTERS.", "options": ["A. SOLAR-POWERED CARS are ECO-FRIENDLY.", "B. Solar-powered CARS are eco-FRIENDLY.", "C. solar-powered cars are eco-friendly", "D. SOLAR-powered cars ARE ECO-friendly."], "answer": "A", "explain": "Nhấn đầy đủ tính từ ghép và danh từ (SOLAR-POWERED CARS, ECO-FRIENDLY); không nhấn are."}, {"type": "mcq", "level": "NB", "q": "In the following sentence, which words are usually STRESSED? My family will travel by hyperloop.", "options": ["A. My, family, by", "B. My, will, travel", "C. family, travel, hyperloop", "D. will, by"], "answer": "C", "explain": "'Family', 'travel', 'hyperloop' là từ mang nghĩa chính."}, {"type": "mcq", "level": "VD", "q": "A ___ is a train that travels inside a tube at the speed of a plane.", "options": ["A. bicycle", "B. ship", "C. car", "D. hyperloop"], "answer": "D", "explain": "Hyperloop là tàu chạy trong ống với tốc độ máy bay."}, {"type": "mcq", "level": "TH", "q": "There is too much ___ on the road this morning.", "options": ["A. rain", "B. water", "C. traffic", "D. wind"], "answer": "C", "explain": "Quá nhiều xe cộ (traffic) trên đường sáng nay."}, {"type": "mcq", "level": "NB", "q": "___ he come with us tomorrow?", "options": ["A. Will", "B. Does", "C. Did", "D. Is"], "answer": "A", "explain": "Câu hỏi tương lai đơn → Will + S + V?"}, {"type": "mcq", "level": "VDC", "q": "A: Do you think teleporting will be possible? B: ___", "options": ["A. Maybe one day, but not now.", "B. It is science fiction.", "C. Teleporting is very fast.", "D. I don't know anything."], "answer": "A", "explain": "Câu trả lời cân bằng, thực tế nhất."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Eco-friendly vehicles do not pollute the air. Solar-powered cars use energy from the sun. Electric buses are also eco-friendly. In the future, all buses may be electric. Our cities will be cleaner and quieter.", "statements": ["Eco-friendly vehicles do not pollute the air.", "Solar-powered cars use the sun's energy.", "Electric buses pollute the air.", "Future cities will be cleaner."], "answer": ["T", "T", "F", "T"], "explain": "Xe điện và xe năng lượng mặt trời thân thiện môi trường."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Lan will visit her grandmother next month. She will take a bullet train, not a bus. The train is faster and more comfortable. Her grandmother lives near the station. Lan is excited about the trip.", "statements": ["Lan will visit her grandmother next month.", "Lan will take a bus.", "The bullet train is faster than the bus.", "Lan is excited about the trip."], "answer": ["T", "F", "T", "T"], "explain": "Lan đi tàu cao tốc, không đi xe buýt."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: ___ means friendly to the environment.", "answer": "Eco-friendly", "explain": "Đáp án là 'Eco-friendly' (thân thiện với môi trường)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The spaceship (take) us to the Moon.", "answer": "will take", "explain": "Dự đoán tương lai → will take."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the sentence with the correct sentence stress pattern. Stressed words are in CAPITAL LETTERS.", "options": ["A. The skytrain WILL BE comfortable AND fast.", "B. THE SKYTRAIN WILL BE COMFORTABLE AND FAST.", "C. The SKYTRAIN will be comfortable and FAST.", "D. The SKYTRAIN will be COMFORTABLE and FAST."], "answer": "D", "explain": "Nhấn danh từ và tính từ (SKYTRAIN, COMFORTABLE, FAST); không nhấn The, will, be, and."}, {"type": "mcq", "level": "TH", "q": "In the following sentence, which words are usually STRESSED? Students will use eco-friendly buses.", "options": ["A. use, buses", "B. Students, use, eco-friendly buses", "C. Students, will", "D. will, use"], "answer": "B", "explain": "'Students', 'use', 'eco-friendly buses' đều là từ mang nghĩa chính."}, {"type": "mcq", "level": "VD", "q": "To move on water without sinking is to ___.", "options": ["A. run", "B. float", "C. drive", "D. fly"], "answer": "B", "explain": "'Float' nghĩa là nổi trên mặt nước mà không chìm."}, {"type": "mcq", "level": "TH", "q": "A long trip from one place to another is called a ___.", "options": ["A. minute", "B. hour", "C. journey", "D. second"], "answer": "C", "explain": "Chuyến đi dài gọi là 'journey' (hành trình)."}, {"type": "mcq", "level": "VD", "q": "This isn't my pen. ___ is blue.", "options": ["A. Me", "B. My", "C. Mine", "D. I"], "answer": "C", "explain": "Đại từ sở hữu 'mine' (= my pen) đứng độc lập."}, {"type": "mcq", "level": "VDC", "q": "A: The skytrain is too crowded today. B: ___", "options": ["A. I like quiet trains.", "B. Today is Monday.", "C. Crowded trains are bad.", "D. Let's wait for the next one."], "answer": "D", "explain": "Câu trả lời đưa ra giải pháp hợp lý cho tình huống."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Nam loves spaceships. He thinks he will fly to the Moon one day. He reads many books about space. He wants to be an astronaut. His friends think his dream will come true.", "statements": ["Nam loves spaceships.", "Nam wants to be an astronaut.", "Nam never reads books about space.", "Nam's friends believe in his dream."], "answer": ["T", "T", "F", "T"], "explain": "Nam đọc nhiều sách về vũ trụ; bạn bè tin giấc mơ của cậu sẽ thành hiện thực."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Future cities will have fewer cars. People will walk more and use public transport. There will be more parks and clean air. Children can play safely in the streets. Life in future cities will be better.", "statements": ["Future cities will have fewer cars.", "People will walk less in the future.", "Future cities will have cleaner air.", "Life in future cities will be better."], "answer": ["T", "F", "T", "T"], "explain": "Người dân sẽ đi bộ nhiều hơn, không khí sạch hơn."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The movement of cars on roads is called ___.", "answer": "traffic", "explain": "Đáp án là 'traffic' (giao thông, xe cộ)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Is this pen (you) or mine?", "answer": "yours", "explain": "Đại từ sở hữu của 'you' là 'yours'."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "Choose the sentence with the correct sentence stress pattern. Stressed words are in CAPITAL LETTERS.", "options": ["A. I THINK flying cars WILL be popular.", "B. I think FLYING cars will BE popular.", "C. i think flying cars will be popular", "D. I think FLYING CARS will be POPULAR."], "answer": "D", "explain": "Nhấn động từ, danh từ, tính từ (FLYING CARS, POPULAR); không nhấn I, think, will, be."}, {"type": "mcq", "level": "NB", "q": "In the following sentence, which words are usually STRESSED? The skytrain will be fast.", "options": ["A. The, fast", "B. skytrain, fast", "C. will, be", "D. The, skytrain, will"], "answer": "B", "explain": "'Skytrain' (danh từ) và 'fast' (tính từ) được nhấn."}, {"type": "mcq", "level": "VD", "q": "'To appear in another place in a second' means to ___.", "options": ["A. walk", "B. climb", "C. teleport", "D. swim"], "answer": "C", "explain": "'Teleport' nghĩa là dịch chuyển tức thời."}, {"type": "mcq", "level": "TH", "q": "The future bus will be fast and ___.", "options": ["A. slow", "B. comfortable", "C. uncomfortable", "D. noisy"], "answer": "B", "explain": "Xe buýt tương lai sẽ nhanh và thoải mái (comfortable)."}, {"type": "mcq", "level": "NB", "q": "We ___ buy a new electric car next year.", "options": ["A. has", "B. have", "C. will", "D. are"], "answer": "C", "explain": "Dự định tương lai (next year) → will + V nguyên thể."}, {"type": "mcq", "level": "VDC", "q": "A: How will we get to the airport tomorrow? B: ___", "options": ["A. I like travelling by plane.", "B. Goodbye and have fun.", "C. We'll take a driverless taxi.", "D. The airport is very far."], "answer": "C", "explain": "Câu trả lời trả lời đúng câu hỏi 'bằng cách nào' với phương án cụ thể."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). In 2050, people may teleport from place to place. Teleporting will take only a few seconds. People will not need cars or planes. It will be the fastest way to travel. But teleporting is still just a dream now.", "statements": ["People may teleport in 2050.", "Teleporting takes many hours.", "People will not need cars if they can teleport.", "People can teleport now."], "answer": ["T", "F", "T", "F"], "explain": "Dịch chuyển tức thời chỉ mất vài giây nhưng hiện tại vẫn là giấc mơ."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). A spaceship needs a lot of fuel to leave the Earth. The trip to the Moon takes about three days. Astronauts must wear special clothes in space. There is no air outside the spaceship. Space travel is exciting but dangerous.", "statements": ["Spaceships need a lot of fuel.", "The trip to the Moon takes three months.", "Astronauts wear special clothes in space.", "Space travel is exciting but dangerous."], "answer": ["T", "F", "T", "T"], "explain": "Chuyến đi tới Mặt Trăng mất khoảng ba ngày, không phải ba tháng."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: I think it ___ rain tomorrow.", "answer": "will", "explain": "Đáp án là 'will' (dự đoán tương lai)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The blue bike is (he), not mine.", "answer": "his", "explain": "Đại từ sở hữu của 'he' là 'his'."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the sentence with the correct sentence stress pattern. Stressed words are in CAPITAL LETTERS.", "options": ["A. HYPERLOOP trains will SAVE TIME.", "B. HYPERLOOP TRAINS WILL SAVE TIME.", "C. Hyperloop trains WILL save time.", "D. Hyperloop TRAINS will save TIME."], "answer": "A", "explain": "Nhấn danh từ và động từ chính (HYPERLOOP trains, SAVE TIME); không nhấn will."}, {"type": "mcq", "level": "TH", "q": "In the following sentence, which words are usually STRESSED? She will teleport to school.", "options": ["A. teleport, school", "B. will, to", "C. She, school", "D. She, will, teleport"], "answer": "A", "explain": "'Teleport' (động từ chính) và 'school' (danh từ) được nhấn."}, {"type": "mcq", "level": "VD", "q": "A ___ is a person travelling in a vehicle.", "options": ["A. pilot", "B. driver", "C. passenger", "D. teacher"], "answer": "C", "explain": "Hành khách (passenger) là người đi trên phương tiện."}, {"type": "mcq", "level": "TH", "q": "'Very new and advanced' means ___.", "options": ["A. boring", "B. modern", "C. ancient", "D. old"], "answer": "B", "explain": "'Modern' nghĩa là hiện đại, rất mới."}, {"type": "mcq", "level": "VD", "q": "Your house is bigger than ___.", "options": ["A. us", "B. our", "C. we", "D. ours"], "answer": "D", "explain": "'Ours' (= our house) là đại từ sở hữu đứng độc lập."}, {"type": "mcq", "level": "VDC", "q": "A: Is your new flying bike fast? B: ___", "options": ["A. It belongs to me.", "B. I like riding bikes.", "C. Yes, it's the fastest in my class.", "D. It is painted red."], "answer": "C", "explain": "Câu trả lời trả lời đúng trọng tâm câu hỏi về tốc độ."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Flying cars will be popular in the future. They can fly above traffic jams. They will need special roads in the sky. Learning to drive a flying car will be difficult. Only adults will use them at first.", "statements": ["Flying cars will fly above traffic.", "Flying cars will drive on normal roads.", "Learning to drive a flying car will be difficult.", "Children will use flying cars first."], "answer": ["T", "F", "T", "F"], "explain": "Xe bay cần đường riêng trên trời; ban đầu chỉ người lớn dùng."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Mr Brown will buy an electric car next year. It will not use oil. He will charge it at home every night. The car is quiet and clean. He thinks it will save him a lot of money.", "statements": ["Mr Brown will buy an electric car.", "The electric car will use oil.", "He will charge the car at home.", "He thinks the car will save money."], "answer": ["T", "F", "T", "T"], "explain": "Xe điện không dùng dầu; sạc tại nhà mỗi tối."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The car belongs to us. It's ___.", "answer": "ours", "explain": "Đáp án là 'ours' (đại từ sở hữu của 'we')."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: I (help) you with your bags.", "answer": "will help", "explain": "Lời đề nghị giúp đỡ ngay lúc nói → will help."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Choose the sentence with the correct sentence stress pattern. Stressed words are in CAPITAL LETTERS.", "options": ["A. people will travel by spaceship", "B. PEOPLE WILL TRAVEL BY SPACESHIP.", "C. People WILL travel BY spaceship.", "D. PEOPLE will TRAVEL by SPACESHIP."], "answer": "D", "explain": "Nhấn danh từ và động từ chính (PEOPLE, TRAVEL, SPACESHIP); không nhấn will, by."}, {"type": "mcq", "level": "NB", "q": "In the following sentence, which words are usually STRESSED? Our car will float on water.", "options": ["A. car, float, water", "B. Our, will, float", "C. Our, car, on", "D. will, on"], "answer": "A", "explain": "'Car', 'float', 'water' là từ mang nghĩa chính nên được nhấn."}, {"type": "mcq", "level": "VD", "q": "Which of these is NOT a means of transport?", "options": ["A. Skytrain", "B. Hyperloop", "C. Traffic", "D. Spaceship"], "answer": "C", "explain": "'Traffic' (xe cộ, giao thông) không phải là phương tiện giao thông."}, {"type": "mcq", "level": "TH", "q": "Electric buses do not ___ the air.", "options": ["A. like", "B. pollute", "C. see", "D. clean"], "answer": "B", "explain": "Xe buýt điện không gây ô nhiễm (pollute) không khí."}, {"type": "mcq", "level": "NB", "q": "I ___ be late for the meeting.", "options": ["A. don't", "B. doesn't", "C. isn't", "D. won't"], "answer": "D", "explain": "Phủ định tương lai đơn → won't (= will not)."}, {"type": "mcq", "level": "VDC", "q": "A: Oh no, I lost my train ticket! B: ___", "options": ["A. Tickets are made of paper.", "B. Don't worry. I'll buy you another one.", "C. I like travelling by train.", "D. Be more careful."], "answer": "B", "explain": "Câu trả lời trấn an và đưa ra giúp đỡ thiết thực nhất."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Traffic jams are a big problem in big cities. People lose much time on the road. Future transport will be faster and smarter. Driverless buses will follow exact plans. People will spend less time travelling.", "statements": ["Traffic jams waste people's time.", "Traffic jams are not a problem.", "Future transport will be smarter.", "People will spend less time travelling."], "answer": ["T", "F", "T", "T"], "explain": "Kẹt xe là vấn đề lớn; giao thông tương lai sẽ thông minh hơn."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Venice is a city on water in Italy. People there travel by boat, not by car. There are no roads, only canals. Tourists love to ride boats in Venice. It is a very special city.", "statements": ["Venice is a city on water.", "People in Venice travel by boat.", "There are many roads for cars in Venice.", "Tourists love boat rides in Venice."], "answer": ["T", "T", "F", "T"], "explain": "Venice không có đường cho ô tô, chỉ có kênh đào."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The ___ runs on high tracks above the street.", "answer": "skytrain", "explain": "Đáp án là 'skytrain' (tàu trên cao)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: That seat is (we), not theirs.", "answer": "ours", "explain": "Đại từ sở hữu của 'we' là 'ours'."}]}]}</script>
