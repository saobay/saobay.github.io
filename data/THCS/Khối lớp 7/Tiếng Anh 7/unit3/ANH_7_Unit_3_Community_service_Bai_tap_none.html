<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. helped", "B. played", "C. wanted", "D. cleaned"], "answer": "C", "explain": "wanted đọc /ɪd/; các từ còn lại đọc /t/ hoặc /d/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. volunteer", "B. donate", "C. happy", "D. collect"], "answer": "C", "explain": "happy nhấn âm 1; các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "She feels ___ to be a volunteer.", "options": ["A. sad", "B. proud", "C. tired", "D. bored"], "answer": "B", "explain": "proud (tự hào) khi làm tình nguyện viên."}, {"type": "mcq", "level": "TH", "q": "We ___ homeless people last weekend.", "options": ["A. help", "B. helped", "C. helps", "D. helping"], "answer": "B", "explain": "'last weekend' (quá khứ) nên dùng helped."}, {"type": "mcq", "level": "VD", "q": "The roads in ___ areas are difficult to travel.", "options": ["A. city", "B. flat", "C. mountainous", "D. coastal"], "answer": "C", "explain": "mountainous (thuộc vùng núi) nên đường đi khó khăn."}, {"type": "mcq", "level": "VDC", "q": "A: Let us join the volunteer club! B: ___", "options": ["A. Great idea!", "B. I do not.", "C. See you.", "D. Not at all."], "answer": "A", "explain": "Đáp lại lời rủ rê: 'Great idea!' (Ý hay đấy!)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). My name is Mai. I am a volunteer at a nursing home. Every Sunday, I visit the elderly people there. I read books to them and talk with them. They are very happy to see me.", "statements": ["a) Mai is a volunteer at a nursing home.", "b) She visits the nursing home every Sunday.", "c) She cooks for the elderly.", "d) The elderly people are happy to see her."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: 'Every Sunday'. c) Sai: đọc sách và trò chuyện, không nấu ăn. d) Đúng: 'very happy to see me'."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last year, our school raised money for flooded areas. Each class collected old textbooks to sell. My class collected the most books - 500 in total. With the money, we bought rice and blankets for the victims.", "statements": ["a) The school raised money for flooded areas.", "b) They sold old textbooks.", "c) The writer's class collected 500 books.", "d) They bought toys for the victims."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: 'collected old textbooks to sell'. c) Đúng: '500 in total'. d) Sai: mua gạo và chăn."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: They ___ (donate) 100 books to the village school yesterday.", "answer": "donated", "explain": "'yesterday' (quá khứ) nên dùng donated."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: Neither my friends nor my sister ___ (be) at the meeting yesterday.", "answer": "was", "explain": "'Neither...nor' chia động từ theo chủ ngữ gần nhất (my sister số ít): was."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. donated", "B. collected", "C. watched", "D. played"], "answer": "C", "explain": "watched đọc /t/; các từ còn lại đọc /d/ hoặc /ɪd/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. community", "B. homeless", "C. donate", "D. protect"], "answer": "B", "explain": "homeless nhấn âm 1; các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "We ___ litter in the park every Sunday.", "options": ["A. collect", "B. throw", "C. buy", "D. sell"], "answer": "A", "explain": "collect (thu gom) rác trong công viên."}, {"type": "mcq", "level": "TH", "q": "___ you donate blood last year?", "options": ["A. Do", "B. Did", "C. Are", "D. Were"], "answer": "B", "explain": "Câu hỏi quá khứ đơn: Did + S + V."}, {"type": "mcq", "level": "VD", "q": "As a ___, she joins many community activities.", "options": ["A. teenager", "B. baby", "C. adult", "D. child"], "answer": "A", "explain": "teenager (thiếu niên) tham gia nhiều hoạt động cộng đồng."}, {"type": "mcq", "level": "VDC", "q": "A: Would you like to donate some books? B: ___", "options": ["A. Sure, I would love to.", "B. I do not like.", "C. Yes, I do.", "D. No, I will not."], "answer": "A", "explain": "'Sure, I would love to.' là cách nhận lời lịch sự."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last month, our class donated 200 books to a rural school. We collected the books from our friends and neighbours. The children in the village were very excited. They thanked us a lot.", "statements": ["a) The class donated books last month.", "b) They donated 200 books.", "c) They bought new books in a shop.", "d) The village children were excited."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: '200 books'. c) Sai: sách gom từ bạn bè và hàng xóm. d) Đúng: 'very excited'."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Mr Hung is proud of his son. Last month, his son spent two weeks tutoring children in a remote village. He taught them English and maths. The villagers thanked him with fresh fruit from their gardens.", "statements": ["a) Mr Hung's son tutored children last month.", "b) He stayed in the village for two weeks.", "c) He taught English and maths.", "d) The villagers gave him money."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: 'two weeks'. c) Đúng. d) Sai: tặng hoa quả tươi."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: ___ you volunteer last summer? - Yes, I did.", "answer": "Did", "explain": "Câu hỏi quá khứ đơn: Did + S + V."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: She ___ (begin) volunteering when she was ten, and she still does it now.", "answer": "began", "explain": "'when she was ten' (quá khứ) nên dùng began."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. volunteered", "B. provided", "C. planted", "D. protected"], "answer": "C", "explain": "planted đọc /ɪd/; các từ còn lại đọc /d/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. provide", "B. protect", "C. tutor", "D. collect"], "answer": "C", "explain": "tutor nhấn âm 1; các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "They ___ trees along the street.", "options": ["A. cut", "B. sell", "C. plant", "D. buy"], "answer": "C", "explain": "plant (trồng) cây dọc theo con đường."}, {"type": "mcq", "level": "TH", "q": "She ___ at an orphanage in 2023.", "options": ["A. volunteer", "B. volunteers", "C. volunteered", "D. volunteering"], "answer": "C", "explain": "'in 2023' (quá khứ) nên dùng volunteered."}, {"type": "mcq", "level": "VD", "q": "The whole ___ joined hands to clean the beach.", "options": ["A. family", "B. class", "C. school", "D. community"], "answer": "D", "explain": "community (cộng đồng) chung tay dọn sạch bãi biển."}, {"type": "mcq", "level": "VDC", "q": "A: Thank you for your help! B: ___", "options": ["A. You are welcome.", "B. I am fine.", "C. Good luck.", "D. See you."], "answer": "A", "explain": "Đáp lại lời cảm ơn: 'You are welcome.' (Không có gì.)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Tom tutors poor children in maths every Saturday. He goes to a small village near his town. The children love his lessons. Tom feels proud to help them.", "statements": ["a) Tom tutors children every Saturday.", "b) He teaches English.", "c) The children love his lessons.", "d) Tom feels proud."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: dạy toán (maths). c) Đúng. d) Đúng: 'feels proud'."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Anna wanted to help the elderly, so she visited a nursing home. At first, she felt shy and did not know what to say. But the old people were kind and told her many interesting stories. Now she visits them every week and never feels shy.", "statements": ["a) Anna visited a nursing home to help the elderly.", "b) She felt shy at first.", "c) The old people were unkind.", "d) She visits them weekly now."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: 'felt shy'. c) Sai: các cụ rất tốt bụng (kind). d) Đúng: 'every week'."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: She ___ (be) very proud of her volunteer work.", "answer": "was", "explain": "'She' số ít, quá khứ của is là was."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: What ___ (happen) at the nursing home last night?", "answer": "happened", "explain": "Câu hỏi quá khứ đơn với 'what' làm chủ ngữ: What happened...?"}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. helped", "B. cooked", "C. walked", "D. cleaned"], "answer": "D", "explain": "cleaned đọc /d/; các từ còn lại đọc /t/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. donate", "B. collect", "C. water", "D. provide"], "answer": "C", "explain": "water nhấn âm 1; các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "The village was ___ after the heavy rain.", "options": ["A. sunny", "B. dry", "C. clean", "D. flooded"], "answer": "D", "explain": "flooded (bị lũ lụt) sau trận mưa lớn."}, {"type": "mcq", "level": "TH", "q": "They ___ go to the nursing home yesterday.", "options": ["A. don't", "B. didn't", "C. doesn't", "D. aren't"], "answer": "B", "explain": "Phủ định quá khứ đơn: didn't + động từ nguyên thể."}, {"type": "mcq", "level": "VD", "q": "The charity provides shelter for ___ people in winter.", "options": ["A. rich", "B. homeless", "C. young", "D. strong"], "answer": "B", "explain": "homeless (vô gia cư) cần nơi trú ẩn trong mùa đông."}, {"type": "mcq", "level": "VDC", "q": "A: What did you do last weekend? B: ___", "options": ["A. I tutored poor children.", "B. I like tutoring.", "C. I will tutor.", "D. Tutoring is fun."], "answer": "A", "explain": "Câu hỏi ở quá khứ nên trả lời ở quá khứ đơn."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). After the flood, many volunteers came to our village. They provided food and clean water. They also helped clean the houses. We will never forget their kindness.", "statements": ["a) Volunteers came after the flood.", "b) They provided food and water.", "c) They destroyed the houses.", "d) The villagers are thankful."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: giúp dọn dẹp nhà cửa. d) Đúng: 'never forget their kindness'."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The beach near our town was full of rubbish. Our volunteer club decided to clean it. Fifty members collected rubbish for a whole day. In the end, we collected two tons of rubbish, and the beach became clean and beautiful again.", "statements": ["a) The beach was dirty.", "b) Fifty members joined the cleaning.", "c) They collected rubbish for a week.", "d) The beach became clean again."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: 'full of rubbish'. b) Đúng. c) Sai: dọn trong một ngày. d) Đúng."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: There ___ (be) many volunteers at the event.", "answer": "were", "explain": "'many volunteers' số nhiều, quá khứ: were."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: The volunteers were tired ___ happy. (but)", "answer": "but", "explain": "Hai ý trái ngược (mệt nhưng vui) nên dùng but."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. wanted", "B. needed", "C. decided", "D. played"], "answer": "D", "explain": "played đọc /d/; các từ còn lại đọc /ɪd/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. volunteer", "B. community", "C. teenager", "D. donate"], "answer": "C", "explain": "teenager nhấn âm 1; các từ còn lại nhấn âm 2 trở đi."}, {"type": "mcq", "level": "TH", "q": "He wants to ___ poor children in English.", "options": ["A. tutor", "B. test", "C. meet", "D. call"], "answer": "A", "explain": "tutor (dạy kèm) trẻ em nghèo môn tiếng Anh."}, {"type": "mcq", "level": "TH", "q": "He ___ very proud of his work.", "options": ["A. is", "B. was", "C. are", "D. were"], "answer": "B", "explain": "Chủ ngữ 'He' số ít, quá khứ của is là was."}, {"type": "mcq", "level": "VD", "q": "Many ___ joined the programme to teach children in remote areas.", "options": ["A. volunteers", "B. teachers", "C. doctors", "D. students"], "answer": "A", "explain": "volunteers (tình nguyện viên) dạy trẻ em vùng xa."}, {"type": "mcq", "level": "VDC", "q": "A: I am proud to be a volunteer. B: ___", "options": ["A. So am I!", "B. So do I.", "C. Me too do.", "D. I am too."], "answer": "A", "explain": "Đồng tình với câu dùng động từ 'be': 'So am I!'."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). My school has a volunteer club. There are 50 members in the club. We plant trees every spring. We also collect rubbish in the park once a month.", "statements": ["a) The school has a volunteer club.", "b) The club has 50 members.", "c) They plant trees every winter.", "d) They collect rubbish monthly."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: trồng cây vào mùa xuân. d) Đúng: 'once a month'."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Donating blood saves lives. Last Sunday, my father donated blood for the third time. He was a little nervous the first time, but now he is used to it. He says one bag of blood can save three lives.", "statements": ["a) Donating blood saves lives.", "b) The father donated blood last Sunday.", "c) It was his first time.", "d) He thinks donating blood is meaningful."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đây là lần thứ ba. d) Đúng: hiến máu cứu người."}, {"type": "short", "level": "NB", "q": "Give the correct form of the verb in brackets: He ___ (take) the children to the park yesterday.", "answer": "took", "explain": "Quá khứ của take là took."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: She has been a volunteer ___ 2019.", "answer": "since", "explain": "'since' (từ khi) dùng với mốc thời gian."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. visited", "B. tutored", "C. laughed", "D. invited"], "answer": "C", "explain": "laughed đọc /t/; các từ còn lại đọc /ɪd/."}, {"type": "mcq", "level": "NB", "q": "A ___ is a person who works for free to help others.", "options": ["A. volunteer", "B. teacher", "C. doctor", "D. farmer"], "answer": "A", "explain": "volunteer (tình nguyện viên) làm việc miễn phí để giúp người khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. orphanage", "B. nursing", "C. mountainous", "D. flooded"], "answer": "D", "explain": "flooded nhấn âm 2; các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "We should ___ the environment.", "options": ["A. pollute", "B. protect", "C. destroy", "D. damage"], "answer": "B", "explain": "protect (bảo vệ) môi trường."}, {"type": "mcq", "level": "VD", "q": "___ they collect rubbish last Sunday?", "options": ["A. Do", "B. Did", "C. Were", "D. Are"], "answer": "B", "explain": "Câu hỏi quá khứ đơn với 'last Sunday': Did."}, {"type": "mcq", "level": "VDC", "q": "A: Shall we collect rubbish in the park? B: ___", "options": ["A. Good idea!", "B. I do not know.", "C. Not at all.", "D. Never mind."], "answer": "A", "explain": "Đáp lại lời đề nghị: 'Good idea!'."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Lan visited an orphanage last weekend. She played games with the children. She also gave them some toys. The children called her 'big sister'.", "statements": ["a) Lan visited an orphanage last weekend.", "b) She played games with the children.", "c) She took toys from the children.", "d) The children liked Lan."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: tặng đồ chơi cho các em. d) Đúng: gọi cô là 'chị lớn'."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). My cousin lives in a mountainous area. The roads are bad, and there is no library. Last year, volunteers built a small library there. Now children can read books every day, and my cousin wants to be a volunteer too.", "statements": ["a) The cousin lives in a mountainous area.", "b) There was no library before.", "c) Volunteers built a library last year.", "d) The cousin does not like reading."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: 'there is no library'. c) Đúng. d) Sai: trẻ em đọc sách mỗi ngày, em họ cũng muốn làm tình nguyện."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: ___ was the weather like? - It was sunny.", "answer": "What", "explain": "Hỏi thời tiết: 'What was the weather like?'."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: They ___ (choose) to build the school in the poorest village.", "answer": "chose", "explain": "Quá khứ của choose là chose (động từ bất quy tắc)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. collected", "B. donated", "C. stopped", "D. raised"], "answer": "C", "explain": "stopped đọc /t/; các từ còn lại đọc /d/ hoặc /ɪd/."}, {"type": "mcq", "level": "NB", "q": "We ___ old clothes to poor children.", "options": ["A. sell", "B. donate", "C. buy", "D. keep"], "answer": "B", "explain": "donate (quyên tặng) quần áo cũ cho trẻ em nghèo."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. volunteer", "B. rural", "C. donate", "D. collect"], "answer": "B", "explain": "rural nhấn âm 1; các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "Our club will ___ food for the flood victims.", "options": ["A. sell", "B. buy", "C. provide", "D. cook"], "answer": "C", "explain": "provide (cung cấp) thức ăn cho nạn nhân lũ lụt."}, {"type": "mcq", "level": "VD", "q": "My dad ___ me to the flooded village.", "options": ["A. take", "B. takes", "C. took", "D. taken"], "answer": "C", "explain": "Quá khứ của take là took."}, {"type": "mcq", "level": "VDC", "q": "Neither Lan nor her friends ___ at the nursing home last month.", "options": ["A. was", "B. were", "C. is", "D. are"], "answer": "B", "explain": "'Neither...nor' chia động từ theo chủ ngữ gần nhất (her friends số nhiều) ở quá khứ: were."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Protecting the environment is our duty. We should not throw litter in the street. We should plant more trees. A clean community makes everyone happy.", "statements": ["a) Protecting the environment is our duty.", "b) We should throw litter in the street.", "c) We should plant more trees.", "d) A clean community makes people happy."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: không nên xả rác. c) Đúng. d) Đúng."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many teenagers think community service is boring, but I do not. Last summer, I joined a programme to teach swimming to poor children. Seeing them smile in the water made all my tiredness go away.", "statements": ["a) The writer thinks community service is boring.", "b) The writer taught swimming last summer.", "c) The children were poor.", "d) The writer felt happy."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: tác giả không nghĩ vậy. b) Đúng. c) Đúng: 'poor children'. d) Đúng: nụ cười của các em xua tan mệt mỏi."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The old man had no home. He was ___. (homeless)", "answer": "homeless", "explain": "homeless (vô gia cư)."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: ___ many volunteers joined the programme? - Over 200.", "answer": "How", "explain": "Hỏi số lượng: How many."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. provided", "B. protected", "C. asked", "D. volunteered"], "answer": ee years ago. Now the garden provides fresh food for 20 poor families. Everyone in the community feels proud of it.", "statements": ["a) The garden was planted three years ago.", "b) Volunteers planted the garden.", "c) The garden feeds 20 poor families.", "d) Nobody cares about the garden."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: '20 poor families'. d) Sai: mọi người đều tự hào về vườn."}, {"type": "short", "level": "NB", "q": "Give the correct form of the word in brackets: We collected rubbish to keep the beach ___. (cleanliness)", "answer": "clean", "explain": "Sau 'keep' cần tính từ: clean (sạch)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: The charity ___ (provide) free meals every day last winter.", "answer": "provided", "explain": "'last winter' (quá khứ) nên dùng provided."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. cleaned", "B. watched", "C. played", "D. rained"], "answer": "B", "explain": "watched đọc /t/; các từ còn lại đọc /d/."}, {"type": "mcq", "level": "NB", "q": "___ people have no home to live in.", "options": ["A. Homeless", "B. Elderly", "C. Young", "D. Rich"], "answer": "A", "explain": "homeless (vô gia cư) không có nhà để ở."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. mountainous", "B. orphanage", "C. collect", "D. rural"], "answer": "C", "explain": "collect nhấn âm 2; các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "___ people need our care and respect.", "options": ["A. Young", "B. Rich", "C. Strong", "D. Elderly"], "answer": "D", "explain": "elderly (người cao tuổi) cần sự quan tâm và kính trọng."}, {"type": "mcq", "level": "VD", "q": "There ___ many volunteers at the event.", "options": ["A. is", "B. are", "C. was", "D. were"], "answer": "D", "explain": "Chủ ngữ 'many volunteers' số nhiều, quá khứ: were."}, {"type": "mcq", "level": "VDC", "q": "The programme ___ over 500 volunteers last year and ___ food to 2,000 families.", "options": ["A. attracted / provided", "B. attract / provide", "C. attracts / provides", "D. attracting / providing"], "answer": "A", "explain": "'last year' (quá khứ) nên cả hai động từ đều ở quá khứ đơn."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Homeless people need our help, especially in winter. Our club collects old clothes for them. We also give them hot food. A small gift can warm their hearts.", "statements": ["a) Homeless people need help in winter.", "b) The club collects old clothes.", "c) They give homeless people hot food.", "d) The club does nothing for them."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 'especially in winter'. b) Đúng. c) Đúng: 'give them hot food'. d) Sai: câu lạc bộ giúp đỡ rất nhiều."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). After the storm, our village had no clean water. A charity provided water filters for every family. They also taught us how to use them. We are very thankful for their help.", "statements": ["a) The village had no clean water after the storm.", "b) A charity provided water filters.", "c) Each family got a water filter.", "d) The charity only gave money."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: 'for every family'. d) Sai: tặng máy lọc nước và hướng dẫn sử dụng."}, {"type": "short", "level": "NB", "q": "Give the correct form of the verb in brackets: She ___ (give) her old toys to the orphanage.", "answer": "gave", "explain": "Quá khứ của give là gave."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: He felt ___ (pride) to be part of the team.", "answer": "proud", "explain": "Sau 'felt' cần tính từ: proud (tự hào)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. started", "B. helped", "C. ended", "D. decided"], "answer": "B", "explain": "helped đọc /t/; các từ còn lại đọc /ɪd/."}, {"type": "mcq", "level": "NB", "q": "My school is in a ___ area with many rice fields.", "options": ["A. city", "B. town", "C. urban", "D. rural"], "answer": "D", "explain": "rural area (vùng nông thôn) có nhiều ruộng lúa."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. nursing", "B. homeless", "C. elderly", "D. collect"], "answer": "D", "explain": "collect nhấn âm 2; các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "She learnt many new ___ from volunteer work.", "options": ["A. games", "B. skills", "C. books", "D. clothes"], "answer": "B", "explain": "skill (kỹ năng) học được từ công việc tình nguyện."}, {"type": "mcq", "level": "VD", "q": "She ___ her old books to the library yesterday.", "options": ["A. give", "B. gives", "C. gave", "D. given"], "answer": "C", "explain": "Quá khứ của give là gave."}, {"type": "mcq", "level": "VDC", "q": "What ___ you do last weekend? - I ___ at the orphanage.", "options": ["A. did / volunteered", "B. do / volunteer", "C. did / volunteer", "D. do / volunteered"], "answer": "A", "explain": "'last weekend' nên câu hỏi dùng Did và câu trả lời ở quá khứ đơn."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Being a volunteer taught me a lot. I learnt to work with other people. I also learnt to care about others. Now I want to be a volunteer for my whole life.", "statements": ["a) The writer is a volunteer.", "b) Volunteering taught the writer a lot.", "c) The writer learnt to care about others.", "d) The writer wants to stop volunteering."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: 'taught me a lot'. c) Đúng. d) Sai: muốn làm tình nguyện viên cả đời."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Being a volunteer is not always easy. Sometimes we work under the hot sun. Sometimes we walk far to reach remote villages. But when we see people's smiles, we know our work is worth it.", "statements": ["a) Volunteer work is always easy.", "b) Volunteers sometimes work in difficult conditions.", "c) They walk far to remote villages.", "d) People's smiles make the work meaningful."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: 'not always easy'. b) Đúng: làm việc dưới nắng nóng. c) Đúng. d) Đúng: 'our work is worth it'."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: A ___ works for free to help others. (voluntary)", "answer": "volunteer", "explain": "volunteer (tình nguyện viên)."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: We ___ (be) proud when the village became clean again.", "answer": "were", "explain": "'We' số nhiều, quá khứ của are là were."}]}]}</script>
