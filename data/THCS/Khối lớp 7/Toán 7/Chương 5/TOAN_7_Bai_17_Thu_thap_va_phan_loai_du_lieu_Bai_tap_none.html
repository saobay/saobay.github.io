<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Dữ liệu nào sau đây là dữ liệu số?", "options": ["A. Màu sắc yêu thích", "B. Chiều cao của các bạn trong lớp (cm)", "C. Quê quán", "D. Môn học yêu thích"], "answer": "B", "explain": "Chiều cao đo bằng số (cm) nên là dữ liệu số."}, {"type": "mcq", "level": "NB", "q": "Muốn biết cân nặng trung bình của học sinh lớp 7A, cách thu thập dữ liệu nào sau đây hợp lí nhất?", "options": ["A. Cân trực tiếp từng bạn trong lớp", "B. Hỏi các bạn thích ăn món gì", "C. Đoán cân nặng của các bạn", "D. Tra cứu cân nặng trung bình của cả nước"], "answer": "A", "explain": "Cân trực tiếp từng bạn cho dữ liệu chính xác và đại diện cho lớp 7A."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu nào sau đây KHÔNG phải là dữ liệu số?", "options": ["A. Cân nặng (kg)", "B. Điểm kiểm tra môn Toán", "C. Số anh chị em trong gia đình", "D. Nghề nghiệp mơ ước trong tương lai"], "answer": "D", "explain": "Nghề nghiệp mơ ước không biểu diễn bằng số."}, {"type": "mcq", "level": "TH", "q": "Trong các dữ liệu sau, dữ liệu nào có thể sắp xếp theo thứ tự được?", "options": ["A. Màu áo yêu thích", "B. Xếp loại học lực: Tốt, Khá, Đạt, Chưa đạt", "C. Tên các tỉnh, thành phố", "D. Món ăn sáng yêu thích"], "answer": "B", "explain": "Xếp loại học lực sắp xếp được theo thứ tự từ cao đến thấp."}, {"type": "mcq", "level": "VD", "q": "Bạn An ghi lại thời gian chạy 100 m (giây) của 5 bạn: 14,2; 15,0; 13,8; 45,6; 14,9. Dữ liệu nào không hợp lí cần loại bỏ?", "options": ["A. 14,2", "B. 13,8", "C. 45,6", "D. Không có dữ liệu nào cần loại"], "answer": "C", "explain": "Học sinh lớp 7 không thể chạy 100 m hết 45,6 giây (quá chậm, vô lí) — có thể do ghi nhầm."}, {"type": "mcq", "level": "VD", "q": "Để tìm hiểu môn thể thao được yêu thích nhất của học sinh toàn trường, cách làm nào sau đây đảm bảo tính đại diện của dữ liệu?", "options": ["A. Chỉ hỏi các bạn lớp 7A", "B. Hỏi ngẫu nhiên một số bạn ở mỗi khối lớp", "C. Chỉ hỏi các bạn trong đội bóng đá của trường", "D. Chỉ hỏi các thầy cô giáo dạy thể dục"], "answer": "B", "explain": "Hỏi ngẫu nhiên mỗi khối một số bạn thì mẫu bao quát toàn trường, không thiên lệch."}, {"type": "truefalse", "level": "TH", "q": "Lớp 7A lập phiếu hỏi về “môn học yêu thích nhất của mỗi bạn”. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Cách thu thập dữ liệu ở đây là lập phiếu hỏi.", "b) Dữ liệu thu được là dữ liệu số.", "c) Dữ liệu “môn học yêu thích” không sắp xếp theo thứ tự được.", "d) Chỉ cần hỏi 3 bạn là đã đủ đại diện cho cả lớp 7A."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai — môn học yêu thích không phải dữ liệu số. c) Đúng. d) Sai — 3 bạn quá ít, không đại diện."}, {"type": "truefalse", "level": "VD", "q": "Bạn Bình thu thập cân nặng (kg) của các bạn trong tổ: 42; 45; 39; 150; 44. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dãy dữ liệu thu được là dữ liệu số.", "b) Giá trị 150 là hợp lí, nên giữ lại để tính cân nặng trung bình.", "c) Nên loại bỏ giá trị 150 vì không hợp lí.", "d) Sau khi loại bỏ dữ liệu không hợp lí, dãy còn 4 giá trị."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai — học sinh lớp 7 không thể nặng 150 kg. c) Đúng. d) Đúng — còn 42; 45; 39; 44."}, {"type": "short", "level": "VD", "q": "Trong dãy dữ liệu: “Hà Nội”, 12, “xanh”, 7,5, “Hùng”, 20 — có bao nhiêu dữ liệu là số?", "answer": "3", "explain": "Các dữ liệu là số: 12; 7,5; 20 → có 3 dữ liệu."}, {"type": "short", "level": "VDC", "q": "Một bạn ghi lại số quyển sách đã đọc trong tháng của 8 bạn: 3; 5; 2; 4; 0; 6; 3; 100. Có bao nhiêu dữ liệu không hợp lí cần loại bỏ?", "answer": "1", "explain": "Giá trị 100 (đọc 100 quyển sách trong một tháng) không hợp lí → loại bỏ 1 dữ liệu."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Cách thu thập dữ liệu nào sau đây sử dụng phiếu hỏi?", "options": ["A. Đếm số xe máy qua ngã tư trong 10 phút", "B. Gieo xúc xắc 50 lần . Số điện thoại của bố mẹ", "D. Chiều dài của bàn học (cm)"], "answer": "C", "explain": "Số điện thoại tuy viết bằng chữ số nhưng không phải dữ liệu số dùng để đo đếm/phân tích."}, {"type": "mcq", "level": "NB", "q": "Muốn biết số lần xuất hiện mặt 6 chấm khi gieo xúc xắc, cách thu thập dữ liệu phù hợp là:", "options": ["A. Quan sát bầu trời", "B. Làm thí nghiệm gieo xúc xắc nhiều lần và ghi lại", "C. Phỏng vấn các bạn", "D. Đọc báo"], "answer": "B", "explain": "Gieo xúc xắc và ghi kết quả là làm thí nghiệm."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu “xếp loại hạnh kiểm: Tốt, Khá, Trung bình, Yếu” thuộc loại:", "options": ["A. Dữ liệu số", "B. Dữ liệu không phải số, sắp xếp theo thứ tự được", "C. Dữ liệu không phải số, không sắp xếp theo thứ tự được", "D. Dữ liệu không hợp lí"], "answer": "B", "explain": "Xếp loại hạnh kiểm không phải số nhưng sắp xếp từ cao đến thấp được."}, {"type": "mcq", "level": "TH", "q": "Khi thu thập dữ liệu từ Internet, điều quan trọng nhất là:", "options": ["A. Lấy thật nhiều số liệu", "B. Chỉ dùng nguồn đáng tin cậy và ghi rõ xuất xứ", "C. Lấy số liệu mới nhất bằng mọi giá", "D. Không cần kiểm tra lại"], "answer": "B", "explain": "Nguồn trên Internet phải đáng tin cậy và có xuất xứ rõ ràng."}, {"type": "mcq", "level": "VD", "q": "Để ước lượng chiều cao trung bình của học sinh khối 7 toàn trường (khoảng 400 em), cách làm nào hợp lí nhất?", "options": ["A. Đo chiều cao của 2 bạn cao nhất mỗi lớp", "B. Đo ngẫu nhiên khoảng 40 bạn ở các lớp khác nhau", "C. Chỉ đo các bạn trong đội bóng rổ", "D. Hỏi mỗi bạn tự ước lượng chiều cao của mình"], "answer": "B", "explain": "Mẫu ngẫu nhiên ~10% ở các lớp khác nhau đảm bảo tính đại diện mà không tốn quá nhiều công."}, {"type": "mcq", "level": "VD", "q": "Dãy số liệu về số giờ ngủ mỗi đêm của 6 bạn: 8; 7,5; 9; 8; 25; 7. Dữ liệu không hợp lí là:", "options": ["A. 8", "B. 7,5", "C. 25", "D. 9"], "answer": "C", "explain": "Không ai ngủ 25 giờ mỗi đêm → dữ liệu không hợp lí."}, {"type": "truefalse", "level": "TH", "q": "Trong một cuộc khảo sát “màu sắc yêu thích”, bạn An ghi được: đỏ: 10 bạn; xanh: 15 bạn; vàng: 8 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “màu sắc yêu thích” không phải là dữ liệu số.", "b) Các số 10, 15, 8 là dữ liệu số.", "c) Dữ liệu “màu sắc yêu thích” sắp xếp theo thứ tự được.", "d) Màu được yêu thích nhất là màu xanh."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng — số bạn chọn là dữ liệu số. c) Sai — màu sắc không sắp xếp theo thứ tự được. d) Đúng — 15 là lớn nhất."}, {"type": "truefalse", "level": "VD", "q": "Bạn Hùng thống kê số quyển vở đã dùng trong năm của tổ mình: 12; 15; 10; 14; 200; 11. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dãy dữ liệu trên là dữ liệu số.", "b) Giá trị 200 là hợp lí vì có bạn dùng nhiều vở.", "c) Nên kiểm tra lại và loại bỏ giá trị 200 trước khi tính trung bình.", "d) Sau khi loại bỏ, trung bình số vở của 5 bạn còn lại là 12,4 quyển."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai — 200 quyển vở/năm là vô lí. c) Đúng. d) Đúng — (12+15+10+14+11)/5 = 62/5 = 12,4."}, {"type": "short", "level": "VD", "q": "Dãy dữ liệu: “Nam”, 165, “nữ”, 158, “Nam”, 170 — có bao nhiêu dữ liệu là số?", "answer": "3", "explain": "Các dữ liệu là số: 165; 158; 170 → 3 dữ liệu."}, {"type": "short", "level": "VDC", "q": "Ghi lại số phút đi từ nhà đến trường của 9 bạn: 15; 20; 10; 25; 18; 12; 300; 22; 16. Có bao nhiêu dữ liệu không hợp lí cần loại bỏ?", "answer": "1", "explain": "300 phút (5 giờ) đi đến trường là không hợp lí → loại 1 dữ liệu."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các dữ liệu sau, dữ liệu nào là dữ liệu số?", "options": ["A. Họ tên học sinh", "B. Số bàn thắng của đội bóng trong mùa giải", "C. Màu áo đấu của đội", "D. Tên huấn luyện viên"], "answer": "B", "explain": "Số bàn thắng là dữ liệu số."}, {"type": "mcq", "level": "NB", "q": "Bạn Lan muốn biết thời tiết mỗi ngày trong tháng để làm bài tập địa lí. Cách thu thập phù hợp là:", "options": ["A. Phỏng vấn các bạn", "B. Quan sát và ghi chép thời tiết mỗi ngày", "C. Gieo xúc xắc", "D. Đoán theo cảm tính"], "answer": "B", "explain": "Ghi chép thời tiết mỗi ngày là quan sát."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu nào sau đây có thể sắp xếp theo thứ tự được?", "options": ["A. Quê quán của học sinh", "B. Món ăn yêu thích", "C. Mức độ hài lòng: Rất hài lòng, Hài lòng, Bình thường, Không hài lòng", "D. Loại thú cưng đang nuôi"], "answer": "C", "explain": "Mức độ hài lòng sắp xếp theo thứ tự từ cao đến thấp được."}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây ĐÚNG về tính đại diện của dữ liệu?", "options": ["A. Chỉ cần hỏi vài người quen là đủ", "B. Dữ liệu phải đủ số lượng và được lấy ngẫu nhiên, không thiên lệch", "C. Chỉ hỏi những người có cùng ý kiến với mình", "D. Càng ít người được hỏi càng tốt"], "answer": "B", "explain": "Tính đại diện yêu cầu mẫu đủ lớn, ngẫu nhiên, không thiên lệch."}, {"type": "mcq", "level": "VD", "q": "Muốn biết loại quả được học sinh toàn trường yêu thích nhất, bạn Chi chỉ phát phiếu hỏi cho các bạn nữ lớp 7A. Kết luận rút ra có đáng tin không?", "options": ["A. Có, vì đã dùng phiếu hỏi", "B. Không, vì mẫu chỉ gồm nữ lớp 7A, thiếu tính đại diện", "C. Có, vì lớp 7A đông học sinh", "D. Không, vì phiếu hỏi không phải cách thu thập dữ liệu"], "answer": "B", "explain": "Mẫu chỉ gồm nữ một lớp → thiên lệch, không đại diện cho toàn trường (cả nam và các khối khác)."}, {"type": "mcq", "level": "VD", "q": "Dãy dữ liệu về tuổi của các bạn trong lớp 7: 12; 13; 12; 45; 13; 12. Dữ liệu không hợp lí là:", "options": ["A. 12", "B. 13", "C. 45", "D. Tất cả đều hợp lí"], "answer": "C", "explain": "Học sinh lớp 7 không thể 45 tuổi → loại bỏ."}, {"type": "truefalse", "level": "TH", "q": "Thầy giáo ghi lại số học sinh nghỉ học mỗi ngày trong một tuần: 2; 0; 1; 3; 1; 0; 0. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Cách thu thập dữ liệu của thầy là quan sát, ghi chép.", "b) Dãy dữ liệu trên là dữ liệu số.", "c) Tổng số lượt học sinh nghỉ trong tuần là 7.", "d) Dữ liệu “số học sinh nghỉ” sắp xếp theo thứ tự được."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng — 2+0+1+3+1+0+0 = 7. d) Sai — đây là dữ liệu số, câu hỏi về sắp xếp thứ tự chỉ dùng cho dữ liệu không phải số."}, {"type": "truefalse", "level": "VD", "q": "Khảo sát “số giờ xem ti-vi mỗi ngày” của 8 bạn cho kết quả (giờ): 1; 2; 1,5; 3; 2; 30; 1; 2,5. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu thu được là dữ liệu số.", "b) Giá trị 30 là hợp lí vì cuối tuần có thể xem nhiều.", "c) Cần loại bỏ giá trị 30 trước khi phân tích.", "d) Sau khi loại bỏ, bạn xem nhiều nhất là 3 giờ mỗi ngày."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai — 30 giờ/ngày vượt quá 24 giờ, vô lí. c) Đúng. d) Đúng."}, {"type": "short", "level": "VD", "q": "Trong dãy: 4; “cam”; 6; “tím”; 2; “cam”; 8 — dữ liệu “cam” xuất hiện bao nhiêu lần?", "answer": "2", "explain": "Từ “cam” xuất hiện 2 lần trong dãy."}, {"type": "short", "level": "VDC", "q": "Điểm kiểm tra Toán của 10 bạn: 8; 7; 9; 6; 8; 25; 7; 8; 9; 6. Sau khi loại bỏ dữ liệu không hợp lí, tính điểm trung bình của các bạn còn lại.", "answer": "7,6", "explain": "Loại 25 (vượt thang điểm 10). Tổng 9 bạn còn lại là 68; trung bình 68 : 9 ≈ 7,6."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Dữ liệu nào sau đây là dữ liệu số?", "options": ["A. Biển số xe của bố", "B. Lượng mưa mỗi tháng (mm)", "C. Tên các con sông", "D. Màu của cầu vồng"], "answer": "B", "explain": "Lượng mưa đo bằng số (mm) nên là dữ liệu số. (Biển số xe tuy có chữ số nhưng không phải dữ liệu số.)"}, {"type": "mcq", "level": "NB", "q": "Để biết số học sinh thích đọc sách ở mỗi lớp khối 7, cách làm hợp lí là:", "options": ["A. Đoán số lượng", "B. Lập phiếu hỏi hoặc phỏng vấn từng lớp", "C. Quan sát sân trường", "D. Gieo đồng xu"], "answer": "B", "explain": "Khảo sát ý thích phù hợp với phiếu hỏi/phỏng vấn."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu “loại phương tiện đến trường: đi bộ, xe đạp, xe máy” thuộc loại:", "options": ["A. Dữ liệu số", "B. Dữ liệu không phải số, không sắp xếp theo thứ tự được", "C. Dữ liệu không phải số, sắp xếp theo thứ tự được", "D. Dữ liệu không hợp lí"], "answer": "B", "explain": "Phương tiện đến trường không phải số và không sắp xếp theo thứ tự được."}, {"type": "mcq", "level": "TH", "q": "Khi dùng số liệu từ báo chí, Internet, ta cần:", "options": ["A. Chép lại nguyên văn không cần kiểm tra", "B. Chọn nguồn đáng tin cậy và ghi rõ xuất xứ", "C. Chỉ lấy số liệu hợp với ý mình", "D. Không cần ghi xuất xứ"], "answer": "B", "explain": "Phải dùng nguồn đáng tin cậy và ghi rõ xuất xứ."}, {"type": "mcq", "level": "VD", "q": "Bạn Nam muốn biết chiều cao trung bình của học sinh nam khối 7 nên đã đo 5 bạn nam cao nhất trường. Cách làm này:", "options": ["A. Rất tốt vì đo được nhiều bạn", "B. Không đảm bảo tính đại diện vì mẫu bị thiên lệch (chỉ chọn bạn cao)", "C. Sai vì không dùng phiếu hỏi", "D. Đúng vì 5 bạn là đủ"], "answer": "B", "explain": "Chỉ chọn bạn cao nhất → mẫu thiên lệch, kết quả cao hơn thực tế."}, {"type": "mcq", "level": "VD", "q": "Dãy dữ liệu về số con trong mỗi gia đình của 6 bạn: 2; 1; 3; 2; 0; 15. Dữ liệu không hợp lí là:", "options": ["A. 0", "B. 15", "C. 1", "D. 3"], "answer": "B", "explain": "Một gia đình có 15 người con là rất vô lí → loại bỏ."}, {"type": "truefalse", "level": "TH", "q": "Bạn Hoa thống kê số cây xanh mỗi lớp đã trồng: 7A: 12 cây; 7B: 15 cây; 7C: 10 cây; 7D: 13 cây. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu thu được là dữ liệu số.", "b) Cách thu thập có thể là quan sát, đếm trực tiếp.", "c) Lớp trồng được nhiều cây nhất là 7B.", "d) Tổng số cây 4 lớp trồng được là 40 cây."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai — 12+15+10+13 = 50 cây."}, {"type": "truefalse", "level": "VD", "q": "Khảo sát “môn thể thao yêu thích” của 40 bạn cho kết quả: bóng đá: 16; cầu lông: 10; bóng rổ: 8; bơi: 6. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “môn thể thao yêu thích” không phải là dữ liệu số.", "b) Môn được yêu thích nhất là bóng đá.", "c) Số bạn thích cầu lông gấp đôi số bạn thích bơi.", "d) Dữ liệu “môn thể thao” sắp xếp theo thứ tự được."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c) Sai — 10 không gấp đôi 6. d) Sai — môn thể thao không sắp xếp theo thứ tự được."}, {"type": "short", "level": "VD", "q": "Dãy dữ liệu: “sách”, 3; “vở”, 5; “bút”, 2 — có bao nhiêu dữ liệu là số?", "answer": "3", "explain": "Các dữ liệu là số: 3; 5; 2 → 3 dữ liệu."}, {"type": "short", "level": "VDC", "q": "Số bước chân mỗi ngày của bạn An trong 7 ngày: 5000; 6200; 4800; 7500; 5900; 6100; 50000. Sau khi loại dữ liệu không hợp lí, tính trung bình số bước chân mỗi ngày (làm tròn đến hàng đơn vị).", "answer": "5917", "explain": "Loại 50000. Tổng 6 ngày còn lại: 5000+6200+4800+7500+5900+6100 = 35500; trung bình 35500 : 6 ≈ 5916,7 → 5917."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các dữ liệu sau, dữ liệu nào KHÔNG phải là dữ liệu số?", "options": ["A. Số trang của quyển sách", "B. Giá tiền của quyển vở (đồng)", "C. Tác giả của quyển sách", "D. Năm xuất bản"], "answer": "C", "explain": "Tác giả là dữ liệu không phải số."}, {"type": "mcq", "level": "NB", "q": "Muốn biết tỉ lệ học sinh đi học bằng xe đạp của trường, cách thu thập nào đảm bảo tính đại diện?", "options": ["A. Hỏi các bạn trong đội xe đạp của trường", "B. Khảo sát ngẫu nhiên học sinh ở các khối lớp khác nhau", "C. Chỉ hỏi lớp mình", "D. Đoán theo cảm tính"], "answer": "B", "explain": "Khảo sát ngẫu nhiên ở các khối lớp khác nhau thì mẫu đại diện cho toàn trường."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu “kết quả xếp loại cuối năm: Xuất sắc, Giỏi, Khá, Trung bình” thuộc loại:", "options": ["A. Dữ liệu số", "B. Dữ liệu không phải số, sắp xếp theo thứ tự được", "C. Dữ liệu không phải số, không sắp xếp theo thứ tự được", "D. Dữ liệu không hợp lí"], "answer": "B", "explain": "Xếp loại sắp xếp theo thứ tự từ cao đến thấp được."}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây SAI?", "options": ["A. Dữ liệu số là dữ liệu biểu diễn bằng số", "B. Màu sắc yêu thích là dữ liệu không phải số", "C. Mọi dữ liệu thu thập được đều hợp lí, không cần kiểm tra", "D. Dữ liệu cần đảm bảo tính đại diện"], "answer": "C", "explain": "Phải kiểm tra và loại bỏ dữ liệu không hợp lí trước khi phân tích."}, {"type": "mcq", "level": "VD", "q": "Bạn Linh ghi lại số tin nhắn đã gửi mỗi ngày trong tuần: 20; 35; 28; 40; 32; 25; 500. Dữ liệu không hợp lí là:", "options": ["A. 20", "B. 40", "C. 500", "D. 25"], "answer": "C", "explain": "Gửi 500 tin nhắn mỗi ngày là bất thường, vô lí → loại bỏ."}, {"type": "mcq", "level": "VD", "q": "Để biết học sinh toàn tỉnh thích đọc loại sách nào nhất, cách làm nào tốt nhất?", "options": ["A. Hỏi tất cả học sinh trong tỉnh", "B. Khảo sát ngẫu nhiên một số trường ở các huyện khác nhau", "C. Chỉ hỏi học sinh trường mình", "D. Hỏi ý kiến thầy cô"], "answer": "B", "explain": "Không thể hỏi tất cả; khảo sát ngẫu nhiên nhiều trường ở các huyện khác nhau cho mẫu đại diện."}, {"type": "truefalse", "level": "TH", "q": "Đo nhiệt độ (°C) lúc 7 giờ sáng trong 5 ngày được: 21; 22; 20; 23; 21. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dãy dữ liệu trên là dữ liệu số.", "b) Cách thu thập là quan sát, đo đạc.", "c) Nhiệt độ trung bình 5 ngày là 21,4°C.", "d) Dữ liệu “nhiệt độ” không sắp xếp theo thứ tự được."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng — (21+22+20+23+21)/5 = 107/5 = 21,4. d) Sai — nhiệt độ là dữ liệu số."}, {"type": "truefalse", "level": "VD", "q": "Thống kê “số giờ ngủ mỗi đêm” của 6 bạn: 8; 7; 9; 8; 7,5; 8. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu trên là dữ liệu số.", "b) Số giờ ngủ xuất hiện nhiều nhất là 8 giờ.", "c) Trung bình số giờ ngủ là 8 giờ.", "d) Dữ liệu này đảm bảo tính đại diện cho học sinh cả nước."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c) Sai — (8+7+9+8+7,5+8)/6 = 47,5/6 ≈ 7,9. d) Sai — chỉ 6 bạn, không đại diện cả nước."}, {"type": "short", "level": "VD", "q": "Trong dãy: 10; “Hà”; 20; “Nam”; 30; “Hà” — dữ liệu “Hà” xuất hiện bao nhiêu lần?", "answer": "2", "explain": "Từ “Hà” xuất hiện 2 lần."}, {"type": "short", "level": "VDC", "q": "Cân nặng (kg) của 8 bạn: 40; 42; 38; 45; 41; 39; 400; 43. Sau khi loại dữ liệu không hợp lí, tính cân nặng trung bình (kg, làm tròn 1 chữ số thập phân).", "answer": "41,1", "explain": "Loại 400. Tổng 7 bạn còn lại: 40+42+38+45+41+39+43 = 288; trung bình 288 : 7 ≈ 41,14 → 41,1."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Dữ liệu nào sau đây là dữ liệu số?", "options": ["A. Quốc tịch của du khách", "B. Số lượng du khách mỗi tháng", "C. Màu da của du khách", "D. Ngôn ngữ của du khách"], "answer": "B", "explain": "Số lượng du khách là dữ liệu số."}, {"type": "mcq", "level": "NB", "q": "Bạn Minh muốn biết các bạn trong lớp thích xem phim thể loại nào. Cách thu thập phù hợp nhất là:", "options": ["A. Lập phiếu hỏi cho cả lớp", "B. Đoán theo sở thích của mình", "C. Chỉ hỏi bạn thân", "D. Tra cứu trên Internet"], "answer": "A", "explain": "Khảo sát ý thích của cả lớp phù hợp với lập phiếu hỏi."}, {"type": "mcq", "level": "TH", "q": "Trong các dữ liệu sau, dữ liệu nào KHÔNG sắp xếp theo thứ tự được?", "options": ["A. Học lực: Giỏi, Khá, Trung bình, Yếu", "B. Thứ tự về đích: Nhất, Nhì, Ba", "C. Màu sắc yêu thích: đỏ, xanh, vàng", "D. Mức độ đồng ý: Rất đồng ý, Đồng ý, Không ý kiến"], "answer": "C", "explain": "Màu sắc yêu thích không có thứ tự cao thấp."}, {"type": "mcq", "level": "TH", "q": "Để có dữ liệu đảm bảo tính đại diện khi khảo sát ý kiến học sinh toàn trường, ta nên:", "options": ["A. Chỉ hỏi học sinh giỏi", "B. Hỏi ngẫu nhiên học sinh ở tất cả các khối lớp", "C. Chỉ hỏi học sinh khối 7", "D. Chỉ hỏi các bạn nam"], "answer": "B", "explain": "Mẫu ngẫu nhiên ở tất cả các khối lớp mới đại diện cho toàn trường."}, {"type": "mcq", "level": "VD", "q": "Ghi lại số lần rửa tay mỗi ngày của 5 bạn: 4; 5; 3; 6; 50. Dữ liệu không hợp lí là:", "options": ["A. 3", "B. 6", "C. 50", "D. 4"], "answer": "C", "explain": "Rửa tay 50 lần mỗi ngày là vô lí → loại bỏ."}, {"type": "mcq", "level": "VD", "q": "Bạn Thu chỉ phỏng vấn các bạn đạt học sinh giỏi về “thời gian tự học mỗi tối” rồi kết luận cho cả lớp. Kết luận này:", "options": ["A. Đáng tin vì phỏng vấn trực tiếp", "B. Thiếu tính đại diện vì mẫu bị thiên lệch (chỉ học sinh giỏi)", "C. Đáng tin vì học sinh giỏi trả lời thật", "D. Sai vì phỏng vấn không phải cách thu thập dữ liệu"], "answer": "B", "explain": "Mẫu chỉ gồm học sinh giỏi → thiên lệch, không đại diện cho cả lớp."}, {"type": "truefalse", "level": "TH", "q": "Khảo sát “loài cây em thích nhất” của lớp 7C: phượng: 12 bạn; bàng: 9 bạn; xà cừ: 7 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “loài cây thích nhất” không phải là dữ liệu số.", "b) Loài cây được thích nhất là cây phượng.", "c) Số bạn thích cây bàng nhiều hơn số bạn thích cây xà cừ 2 bạn.", "d) Dữ liệu “loài cây” sắp xếp theo thứ tự được."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng — 9 − 7 = 2. d) Sai — loài cây không sắp xếp theo thứ tự được."}, {"type": "truefalse", "level": "VD", "q": "Bạn Kiên đếm số xe đạp ở bãi xe của trường vào các buổi sáng: 120; 135; 128; 140; 132. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Cách thu thập của Kiên là quan sát, đếm.", "b) Dãy dữ liệu trên là dữ liệu số.", "c) Buổi có ít xe nhất là buổi thứ nhất.", "d) Trung bình mỗi buổi có 130 chiếc xe đạp."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng — 120 là nhỏ nhất. d) Sai — (120+135+128+140+132)/5 = 655/5 = 131."}, {"type": "short", "level": "VD", "q": "Dãy dữ liệu: “toán”, “văn”, “toán”, “anh”, “toán” — dữ liệu “toán” xuất hiện bao nhiêu lần?", "answer": "3", "explain": "Từ “toán” xuất hiện 3 lần."}, {"type": "short", "level": "VDC", "q": "Số phút tập thể dục mỗi ngày của 7 bạn: 30; 45; 20; 60; 35; 40; 1440. Sau khi loại dữ liệu không hợp lí, tính thời gian tập trung bình (phút).", "answer": "38", "explain": "Loại 1440 (cả ngày có 1440 phút, không thể tập cả ngày). Tổng 6 bạn còn lại: 30+45+20+60+35+40 = 230; trung bình 230 : 6 ≈ 38,3 → 38."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Dữ liệu nào sau đây KHÔNG phải là dữ liệu số?", "options": ["A. Dân số của tỉnh", "B. Diện tích của tỉnh (km²)", "C. Tên của tỉnh", "D. Số huyện của tỉnh"], "answer": "C", "explain": "Tên tỉnh là dữ liệu không phải số."}, {"type": "mcq", "level": "NB", "q": "Để biết số sách mỗi bạn trong tổ đã đọc trong học kì, cách làm tốt nhất là:", "options": ["A. Hỏi trực tiếp từng bạn trong tổ", "B. Đoán theo trí nhớ", "C. Hỏi cô thủ thư", "D. Đọc báo"], "answer": "A", "explain": "Hỏi trực tiếp từng bạn trong tổ cho dữ liệu đầy đủ, chính xác."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu “cỡ áo: S, M, L, XL” thuộc loại:", "options": ["A. Dữ liệu số", "B. Dữ liệu không phải số, sắp xếp theo thứ tự được", "C. Dữ liệu không phải số, không sắp xếp theo thứ tự được", "D. Dữ liệu không hợp lí"], "answer": "B", "explain": "Cỡ áo sắp xếp theo thứ tự từ nhỏ đến lớn được."}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây ĐÚNG?", "options": ["A. Chỉ dữ liệu số mới cần kiểm tra tính hợp lí", "B. Mọi dữ liệu trước khi phân tích đều nên kiểm tra tính hợp lí và tính đại diện", "C. Dữ liệu không phải số thì không bao giờ sai", "D. Càng thu thập ít dữ liệu càng tốt"], "answer": "B", "explain": "Mọi dữ liệu đều cần kiểm tra tính hợp lí và đảm bảo tính đại diện."}, {"type": "mcq", "level": "VD", "q": "Thống kê chiều cao (cm) của đội bóng chuyền nữ khối 7: 160; 165; 158; 162; 16; 164. Dữ liệu không hợp lí là:", "options": ["A. 160", "B. 16", "C. 165", "D. 158"], "answer": "B", "explain": "Chiều cao 16 cm là vô lí (có thể ghi thiếu số 0) → loại bỏ."}, {"type": "mcq", "level": "VD", "q": "Muốn biết thời gian đi từ nhà đến trường trung bình của học sinh toàn huyện, cách làm nào hợp lí nhất?", "options": ["A. Hỏi tất cả học sinh trong huyện", "B. Khảo sát ngẫu nhiên một số trường tiểu học, THCS ở các xã khác nhau", "C. Chỉ hỏi học sinh ở gần trường nhất", "D. Chỉ hỏi học sinh đi xe đạp"], "answer": "B", "explain": "Mẫu ngẫu nhiên ở nhiều trường, nhiều xã mới đại diện cho toàn huyện."}, {"type": "truefalse", "level": "TH", "q": "Điểm kiểm tra 15 phút môn Toán của tổ 1: 8; 9; 7; 10; 8; 9. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dãy điểm trên là dữ liệu số.", "b) Điểm cao nhất của tổ là 10.", "c) Điểm trung bình của tổ là 8,5.", "d) Có 3 bạn đạt điểm 8 trở lên."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng — (8+9+7+10+8+9)/6 = 51/6 = 8,5. d) Sai — có 5 bạn đạt từ 8 trở lên (8; 9; 10; 8; 9)."}, {"type": "truefalse", "level": "VD", "q": "Ghi lại số giờ sử dụng điện thoại mỗi ngày của 7 bạn (giờ): 2; 3; 1,5; 4; 2,5; 3; 48. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu trên là dữ liệu số.", "b) Giá trị 48 là hợp lí.", "c) Cần loại bỏ giá trị 48 trước khi tính trung bình.", "d) Sau khi loại bỏ, bạn dùng nhiều nhất là 4 giờ mỗi ngày."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai — một ngày chỉ có 24 giờ. c) Đúng. d) Đúng."}, {"type": "short", "level": "VD", "q": "Trong dãy: 7; “mai”; 3; “đào”; 9; “mai”; 5 — có bao nhiêu dữ liệu là số?", "answer": "4", "explain": "Các dữ liệu là số: 7; 3; 9; 5 → 4 dữ liệu."}, {"type": "short", "level": "VDC", "q": "Lượng nước uống mỗi ngày (lít) của 6 bạn: 1,5; 2; 1; 2,5; 2; 50. Sau khi loại dữ liệu không hợp lí, tính lượng nước trung bình (lít).", "answer": "1,8", "explain": "Loại 50. Tổng 5 bạn còn lại: 1,5+2+1+2,5+2 = 9; trung bình 9 : 5 = 1,8."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Dữ liệu nào sau đây là dữ liệu số?", "options": ["A. Họ và tên", "B. Ngày sinh", "C. Số đo vòng eo (cm)", "D. Sở thích"], "answer": "C", "explain": "Số đo vòng eo là dữ liệu số. (Ngày sinh tuy có số nhưng thường coi là dữ liệu định danh.)"}, {"type": "mcq", "level": "NB", "q": "Bạn Hà muốn biết bạn nào trong lớp chạy nhanh nhất. Cách thu thập dữ liệu phù hợp là:", "options": ["A. Tổ chức cho cả lớp chạy thi và bấm giờ từng bạn", "B. Hỏi các bạn tự nhận xét", "C. Đoán theo vóc dáng", "D. Bỏ phiếu kín"], "answer": "A", "explain": "Chạy thi và bấm giờ là làm thí nghiệm/đo đạc trực tiếp, cho dữ liệu chính xác."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu nào sau đây KHÔNG sắp xếp theo thứ tự được?", "options": ["A. Xếp loại tốt nghiệp: Xuất sắc, Giỏi, Khá, Trung bình", "B. Cỡ giày: 36, 37, 38, 39", "C. Hãng xe yêu thích: Honda, Yamaha, ...", "D. Mức độ spicy: không cay, cay vừa, rất cay"], "answer": "C", "explain": "Hãng xe yêu thích không có thứ tự cao thấp."}, {"type": "mcq", "level": "TH", "q": "Khi khảo sát bằng phiếu hỏi, để dữ liệu đảm bảo tính đại diện ta cần:", "options": ["A. Phát phiếu cho thật nhiều người một cách ngẫu nhiên, không thiên lệch", "B. Chỉ phát cho người quen", "C. Chỉ phát cho những người rảnh rỗi", "D. Phát cho càng ít người càng tốt"], "answer": "A", "explain": "Mẫu phải đủ lớn, ngẫu nhiên, không thiên lệch."}, {"type": "mcq", "level": "VD", "q": "Bạn Phúc ghi lại số giờ học bài mỗi tối của 6 bạn: 2; 3; 2,5; 1,5; 3; 24. Dữ liệu không hợp lí là:", "options": ["A. 1,5", "B. 3", "C. 24", "D. 2,5"], "answer": "C", "explain": "Học bài 24 giờ mỗi tối là vô lí (cả ngày chỉ có 24 giờ) → loại bỏ."}, {"type": "mcq", "level": "VD", "q": "Cô giáo muốn biết phụ huynh có đồng ý cho con đi tham quan không nên đã gửi phiếu hỏi cho tất cả phụ huynh lớp 7A. Cách làm này:", "options": ["A. Không đảm bảo tính đại diện", "B. Đảm bảo tính đại diện vì hỏi toàn bộ phụ huynh của lớp", "C. Sai vì phải phỏng vấn trực tiếp", "D. Thừa vì chỉ cần hỏi vài người"], "answer": "B", "explain": "Hỏi toàn bộ đối tượng cần khảo sát (phụ huynh lớp 7A) thì dữ liệu đầy đủ, đại diện."}, {"type": "truefalse", "level": "TH", "q": "Số huy chương của đoàn thể thao Việt Nam qua 4 kì SEA Games: 158; 205; 136; 162. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dãy dữ liệu trên là dữ liệu số.", "b) Kì đạt nhiều huy chương nhất là kì thứ hai (205).", "c) Tổng số huy chương 4 kì là 661.", "d) Dữ liệu “số huy chương” sắp xếp theo thứ tự được."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng — 158+205+136+162 = 661. d) Sai — đây là dữ liệu số."}, {"type": "truefalse", "level": "VD", "q": "Khảo sát “thời gian đọc sách mỗi tuần” của 40 học sinh cho kết quả: dưới 1 giờ: 8 bạn; 1–3 giờ: 18 bạn; trên 3 giờ: 14 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “thời gian đọc sách” ở đây không phải là dữ liệu số.", "b) Nhóm đọc 1–3 giờ mỗi tuần đông nhất.", "c) Số bạn đọc trên 3 giờ nhiều hơn số bạn đọc dưới 1 giờ.", "d) Dữ liệu “thời gian đọc sách” (dưới 1 giờ, 1–3 giờ, trên 3 giờ) sắp xếp theo thứ tự được."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng — dữ liệu dạng khoảng. b) Đúng — 18 lớn nhất. c) Đúng — 14 > 8. d) Đúng — các khoảng thời gian sắp xếp từ ít đến nhiều được."}, {"type": "short", "level": "VD", "q": "Dãy dữ liệu: “An”, “Bình”, “An”, “Chi”, “An” — dữ liệu “An” xuất hiện bao nhiêu lần?", "answer": "3", "explain": "Từ “An” xuất hiện 3 lần."}, {"type": "short", "level": "VDC", "q": "Số km chạy bộ mỗi tuần của 7 bạn: 10; 15; 8; 12; 20; 14; 500. Sau khi loại dữ liệu không hợp lí, tính trung bình (km, làm tròn hàng đơn vị).", "answer": "13", "explain": "Loại 500. Tổng 6 bạn còn lại: 10+15+8+12+20+14 = 79; trung bình 79 : 6 ≈ 13,2 → 13."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các dữ liệu sau, dữ liệu nào là dữ liệu số?", "options": ["A. Số lượng sách trong thư viện", "B. Tên tác giả", "C. Thể loại sách", "D. Màu bìa sách"], "answer": "A", "explain": "Số lượng sách là dữ liệu số."}, {"type": "mcq", "level": "NB", "q": "Muốn biết lượng mưa trung bình năm của địa phương, người ta thường:", "options": ["A. Đoán theo kinh nghiệm", "B. Đo lượng mưa mỗi ngày bằng vũ kế rồi tổng hợp cả năm", "C. Hỏi người dân", "D. Xem dự báo thời tiết một ngày"], "answer": "B", "explain": "Đo đạc hằng ngày rồi tổng hợp là cách thu thập dữ liệu quan sát chính xác."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu “đánh giá chất lượng bữa ăn bán trú: Ngon, Bình thường, Chưa ngon” thuộc loại:", "options": ["A. Dữ liệu số", "B. Dữ liệu không phải số, sắp xếp theo thứ tự được", "C. Dữ liệu không phải số, không sắp xếp theo thứ tự được", "D. Dữ liệu không hợp lí"], "answer": "B", "explain": "Mức đánh giá sắp xếp theo thứ tự từ tốt đến chưa tốt được."}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây SAI về thu thập dữ liệu?", "options": ["A. Có thể thu thập bằng quan sát, thí nghiệm, phiếu hỏi, phỏng vấn", "B. Có thể dùng số liệu từ nguồn đáng tin cậy", "C. Dữ liệu càng thiên lệch càng tốt", "D. Cần kiểm tra tính hợp lí của dữ liệu"], "answer": "C", "explain": "Dữ liệu phải đảm bảo tính đại diện, không thiên lệch."}, {"type": "mcq", "level": "VD", "q": "Bạn Vân ghi lại nhiệt độ nước (°C) khi đun của 5 lần đo: 25; 50; 75; 100; 150. Dữ liệu không hợp lí là:", "options": ["A. 25", "B. 100", "C. 150", "D. 75"], "answer": "C", "explain": "Nước sôi ở 100°C (điều kiện thường) nên 150°C là vô lí → loại bỏ."}, {"type": "mcq", "level": "VD", "q": "Để đánh giá chất lượng bữa ăn bán trú của toàn trường, bạn An chỉ hỏi ý kiến các bạn lớp mình vào một bữa ăn. Hạn chế là:", "options": ["A. Tốn thời gian", "B. Mẫu quá nhỏ và chỉ một lớp, một bữa → thiếu tính đại diện", "C. Không thu được dữ liệu số", "D. Không có hạn chế"], "answer": "B", "explain": "Mẫu nhỏ, phạm vi hẹp → không đại diện cho toàn trường."}, {"type": "truefalse", "level": "TH", "q": "Lớp 7D quyên góp sách cho thư viện: truyện: 45 quyển; sách khoa học: 30 quyển; sách tham khảo: 25 quyển. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “thể loại sách” không phải là dữ liệu số.", "b) Các số 45, 30, 25 là dữ liệu số.", "c) Tổng số sách quyên góp là 100 quyển.", "d) Thể loại được quyên góp nhiều nhất là sách tham khảo."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng — 45+30+25 = 100. d) Sai — truyện (45) nhiều nhất."}, {"type": "truefalse", "level": "VD", "q": "Đo chiều cao (cm) của 6 bạn trong tổ: 150; 155; 148; 152; 160; 15. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dãy dữ liệu trên là dữ liệu số.", "b) Giá trị 15 là không hợp lí.", "c) Sau khi loại bỏ, chiều cao trung bình của 5 bạn còn lại là 153 cm.", "d) Dữ liệu này đại diện cho chiều cao học sinh cả nước."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng — (150+155+148+152+160)/5 = 765/5 = 153. d) Sai — chỉ 6 bạn một tổ, không đại diện cả nước."}, {"type": "short", "level": "VD", "q": "Trong dãy: 5; 5; 3; 5; 2; 5 — dữ liệu 5 xuất hiện bao nhiêu lần?", "answer": "4", "explain": "Số 5 xuất hiện 4 lần."}, {"type": "short", "level": "VDC", "q": "Số phút gọi điện mỗi ngày của bạn Mai trong 6 ngày: 10; 15; 8; 12; 20; 600. Sau khi loại dữ liệu không hợp lí, tính trung bình (phút).", "answer": "13", "explain": "Loại 600. Tổng 5 ngày còn lại: 10+15+8+12+20 = 65; trung bình 65 : 5 = 13."}]}]}</script>
