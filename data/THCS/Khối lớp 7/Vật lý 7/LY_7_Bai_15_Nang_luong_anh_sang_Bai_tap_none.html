a có mùi thơm"], "answer": "B", "explain": "Bông hoa hắt lại ánh sáng đến mắt nên ta nhìn thấy.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao gương soi giúp ta nhìn thấy mình?", "options": ["A. Vì gương phát sáng", "B. Vì gương hắt lại (phản xạ) ánh sáng từ ta đến mắt ta", "C. Vì gương trong suốt", "D. Vì mắt ta phát sáng"], "answer": "B", "explain": "Gương phản xạ ánh sáng từ ta trở lại mắt ta.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong rạp chiếu phim, ta nhìn thấy hình ảnh trên màn chiếu vì?", "options": ["A. Màn chiếu tự phát sáng", "B. Màn chiếu hắt lại ánh sáng từ máy chiếu đến mắt ta", "C. Mắt ta phát sáng", "D. Phim phát sáng"], "answer": "B", "explain": "Màn chiếu là vật sáng, hắt lại ánh sáng từ máy chiếu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vật nào sau đây là vật cản sáng?", "options": ["A. Tấm kính trong", "B. Tấm bìa cứng", "C. Tấm nhựa trong", "D. Không khí"], "answer": "B", "explain": "Tấm bìa cứng không cho ánh sáng truyền qua nên là vật cản sáng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặt bàn tay trước ngọn nến, trên tường xuất hiện bóng của bàn tay vì?", "options": ["A. Bàn tay là vật cản sáng", "B. Tường phát sáng", "C. Nến to", "D. Tay nóng"], "answer": "A", "explain": "Bàn tay cản ánh sáng nến nên trên tường có bóng tối.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một học sinh dùng bìa cứng có khoét 3 lỗ thẳng hàng để kiểm tra đường truyền của ánh sáng. Đánh giá các nhận định.", "statements": ["a) Nếu 3 lỗ thẳng hàng, ánh sáng lọt qua.", "b) Nếu một lỗ lệch, ánh sáng không lọt qua.", "c) Thí nghiệm chứng tỏ ánh sáng truyền thẳng.", "d) Thí nghiệm chứng tỏ ánh sáng truyền cong."], "answer": ["T", "T", "T", "F"], "explain": "Thí nghiệm chứng tỏ ánh sáng truyền theo đường thẳng.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về nhìn thấy vật.", "statements": ["a) Ta nhìn thấy vật khi có ánh sáng từ vật đến mắt.", "b) Trong bóng tối hoàn toàn, ta không nhìn thấy gì.", "c) Vật sáng gồm nguồn sáng và vật hắt lại ánh sáng.", "d) Mắt người tự phát ra ánh sáng để nhìn."], "answer": ["T", "T", "T", "F"], "explain": "Mắt người nhận ánh sáng từ vật, không tự phát sáng.", "points": 1}, {"type": "short", "level": "TH", "q": "Ta nhìn thấy đồ vật nhờ ánh sáng từ vật đến đâu?", "answer": "mắt", "explain": "Ta nhìn thấy vật khi ánh sáng từ vật đến mắt.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao ban đêm không có ánh sáng mặt trời ta vẫn nhìn thấy mặt trăng?", "answer": "mặt trăng hắt lại ánh sáng mặt trời", "explain": "Mặt Trăng hắt lại ánh sáng Mặt Trời nên ta nhìn thấy.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Chùm sáng từ bóng đèn dây tóc tỏa ra xung quanh là chùm nào?", "options": ["A. Song song", "B. Hội tụ", "C. Phân kì", "D. Không xác định"], "answer": "C", "explain": "Bóng đèn tỏa sáng ra xung quanh là chùm phân kì.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kính lúp có tác dụng gì với chùm sáng mặt trời?", "options": ["A. Làm phân kì", "B. Hội tụ thành một điểm", "C. Làm song song", "D. Chặn sáng"], "answer": "B", "explain": "Kính lúp hội tụ chùm sáng mặt trời thành điểm nhỏ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao dưới tán cây rậm rạp vẫn có những đốm sáng tròn trên mặt đất?", "options": ["A. Vì lá cây phát sáng", "B. Vì kẽ lá tạo thành lỗ nhỏ, ánh sáng mặt trời lọt qua tạo đốm sáng", "C. Vì mặt đất phát sáng", "D. Vì mắt ta hoa"], "answer": "B", "explain": "Kẽ lá như lỗ nhỏ cho ánh sáng mặt trời lọt qua, tạo đốm sáng (giống hiện tượng lỗ nhỏ).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hiện tượng nguyệt thực toàn phần xảy ra khi Mặt Trăng đi vào vùng nào của Trái Đất?", "options": ["A. Vùng sáng", "B. Vùng bóng tối của Trái Đất", "C. Vùng nửa tối", "D. Ngoài vũ trụ"], "answer": "B", "explain": "Nguyệt thực toàn phần khi Mặt Trăng đi vào vùng bóng tối của Trái Đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bóng nửa tối là vùng?", "options": ["A. Không nhận được ánh sáng", "B. Chỉ nhận được một phần ánh sáng", "C. Nhận đầy đủ ánh sáng", "D. Phát ra ánh sáng"], "answer": "B", "explain": "Bóng nửa tối chỉ nhận được một phần ánh sáng từ nguồn sáng rộng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nguồn sáng càng rộng, bóng nửa tối sẽ?", "options": ["A. Càng lớn", "B. Càng nhỏ", "C. Mất hẳn", "D. Không đổi"], "answer": "A", "explain": "Nguồn sáng càng rộng thì vùng bóng nửa tối càng lớn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Quan sát bóng của cột điện dưới ánh đèn đường vào ban đêm. Đánh giá các nhận định.", "statements": ["a) Cột điện là vật cản sáng.", "b) Bóng của cột điện là bóng tối.", "c) Đèn đường là nguồn sáng.", "d) Ban ngày không có bóng của cột điện."], "answer": ["T", "T", "T", "F"], "explain": "Ban ngày, cột điện vẫn tạo bóng dưới ánh sáng mặt trời.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về ứng dụng của bóng tối.", "statements": ["a) Dùng bóng tối để đo thời gian (đồng hồ mặt trời).", "b) Nhật thực giúp nghiên cứu mặt trời.", "c) Bóng tối giúp ta biết vị trí mặt trời.", "d) Bóng tối không có ứng dụng gì."], "answer": ["T", "T", "T", "F"], "explain": "Bóng tối có nhiều ứng dụng trong đời sống và khoa học.", "points": 1}, {"type": "short", "level": "TH", "q": "Vùng chỉ nhận được một phần ánh sáng gọi là gì?", "answer": "bóng nửa tối", "explain": "Vùng chỉ nhận một phần ánh sáng gọi là bóng nửa tối.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiện tượng mặt trăng đi vào bóng tối của trái đất gọi là gì?", "answer": "nguyệt thực", "explain": "Mặt Trăng đi vào bóng tối của Trái Đất gây nguyệt thực.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Đồng hồ mặt trời hoạt động dựa trên?", "options": ["A. Bóng của cọc thay đổi theo vị trí mặt trời", "B. Âm thanh", "C. Nước chảy", "D. Cát chảy"], "answer": "A", "explain": "Đồng hồ mặt trời dựa trên bóng của cọc thay đổi theo vị trí Mặt Trời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao bóng của vật thay đổi trong ngày?", "options": ["A. Vì vật di chuyển", "B. Vì vị trí Mặt Trời thay đổi làm hướng tia sáng thay đổi", "C. Vì mắt ta thay đổi", "D. Vì gió thổi"], "answer": "B", "explain": "Vị trí Mặt Trời thay đổi nên hướng tia sáng và bóng của vật thay đổi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Buổi sáng, bóng của cây cột đổ về hướng nào? (Mặt Trời mọc ở phía đông)", "options": ["A. Hướng đông", "B. Hướng tây", "C. Hướng nam", "D. Hướng bắc"], "answer": "B", "explain": "Mặt Trời ở phía đông nên bóng đổ về phía tây.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một cột cao 2 m, buổi trưa bóng của cột dài 1 m. Góc giữa tia sáng mặt trời và mặt đất khoảng?", "options": ["A. 30 độ", "B. 45 độ", "C. 63 độ", "D. 90 độ"], "answer": "C", "explain": "tan(góc) = 2/1 = 2 nên góc khoảng 63 độ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năng lượng ánh sáng có thể biến thành?", "options": ["A. Điện năng (pin mặt trời)", "B. Âm thanh", "C. Mùi", "D. Không biến thành gì"], "answer": "A", "explain": "Pin mặt trời biến năng lượng ánh sáng thành điện năng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cây xanh cần ánh sáng để?", "options": ["A. Quang hợp", "B. Hô hấp", "C. Uống nước", "D. Ngủ"], "answer": "A", "explain": "Cây xanh cần năng lượng ánh sáng để quang hợp.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Sử dụng năng lượng mặt trời trong đời sống. Đánh giá các nhận định.", "statements": ["a) Pin mặt trời tạo ra điện từ ánh sáng.", "b) Máy nước nóng năng lượng mặt trời dùng nhiệt từ ánh sáng.", "c) Năng lượng mặt trời là năng lượng sạch.", "d) Năng lượng mặt trời gây ô nhiễm môi trường."], "answer": ["T", "T", "T", "F"], "explain": "Năng lượng mặt trời là năng lượng sạch, không gây ô nhiễm.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định tổng kết bài.", "statements": ["a) Nguồn sáng tự phát ra ánh sáng.", "b) Ánh sáng truyền thẳng trong môi trường trong suốt, đồng tính.", "c) Bóng tối là vùng không nhận được ánh sáng.", "d) Ánh sáng không mang năng lượng."], "answer": ["T", "T", "T", "F"], "explain": "Ánh sáng mang năng lượng.", "points": 1}, {"type": "short", "level": "TH", "q": "Đồng hồ mặt trời dựa vào hiện tượng gì?", "answer": "bóng tối", "explain": "Đồng hồ mặt trời dựa vào bóng của cọc (bóng tối) thay đổi.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Buổi chiều, mặt trời ở phía tây thì bóng của vật đổ về hướng nào?", "answer": "đông", "explain": "Mặt Trời ở phía tây nên bóng đổ về phía đông.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tia sáng mặt trời chiếu xuống mặt đất là tia?", "options": ["A. Cong", "B. Thẳng", "C. Tròn", "D. Gấp khúc"], "answer": "B", "explain": "Ánh sáng truyền thẳng nên tia sáng mặt trời là tia thẳng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi ánh sáng gặp mặt gương, hiện tượng nào xảy ra?", "options": ["A. Phản xạ", "B. Hấp thụ hết", "C. Biến mất", "D. Đi xuyên qua"], "answer": "A", "explain": "Ánh sáng gặp gương bị phản xạ (bài 16 sẽ học kĩ).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao ta thấy vệt sáng của đèn pha ô tô trong đêm sương mù?", "options": ["A. Vì sương mù làm ánh sáng bị tán xạ, ta thấy đường đi của chùm sáng", "B. Vì đèn pha đặc biệt", "C. Vì mắt ta tốt", "D. Vì ô tô chạy nhanh"], "answer": "A", "explain": "Các hạt sương tán xạ ánh sáng giúp ta thấy vệt sáng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một nguồn sáng điểm đặt trước vật cản tròn. Bóng của vật trên màn sẽ có hình gì?", "options": ["A. Hình tròn đậm rõ nét", "B. Hình vuông", "C. Hình tam giác", "D. Không có bóng"], "answer": "A", "explain": "Nguồn điểm tạo bóng tối rõ nét có hình dạng giống vật cản.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vật nào sau đây cho ánh sáng truyền qua?", "options": ["A. Tấm bìa", "B. Tấm kính trong suốt", "C. Quyển sách", "D. Bức tường"], "answer": "B", "explain": "Tấm kính trong suốt cho ánh sáng truyền qua.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bóng tối của vật sẽ đậm nhất khi?", "options": ["A. Nguồn sáng là điểm và môi trường tối", "B. Nguồn sáng rộng", "C. Ban ngày", "D. Có nhiều nguồn sáng"], "answer": "A", "explain": "Nguồn điểm tạo bóng tối đậm, rõ nét nhất.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Chơi trò tạo hình bóng bằng tay trước đèn. Đánh giá các nhận định.", "statements": ["a) Bàn tay là vật cản sáng.", "b) Bóng trên tường có hình dạng bàn tay.", "c) Đưa tay gần đèn, bóng to hơn.", "d) Ánh sáng truyền cong nên bóng méo mó."], "answer": ["T", "T", "T", "F"], "explain": "Ánh sáng truyền thẳng nên bóng có hình dạng giống vật.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định ôn tập chương ánh sáng.", "statements": ["a) Ánh sáng truyền thẳng trong môi trường trong suốt, đồng tính.", "b) Tia sáng là đường thẳng có mũi tên.", "c) Bóng tối là vùng không nhận được ánh sáng.", "d) Mọi vật đều là nguồn sáng."], "answer": ["T", "T", "T", "F"], "explain": "Chỉ vật tự phát ra ánh sáng mới là nguồn sáng.", "points": 1}, {"type": "short", "level": "TH", "q": "Chùm sáng có các tia giao nhau tại một điểm gọi là chùm gì?", "answer": "hội tụ", "explain": "Chùm hội tụ gồm các tia giao nhau tại một điểm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao không nên đọc sách ở nơi thiếu ánh sáng?", "answer": "hại mắt", "explain": "Thiếu ánh sáng khiến mắt phải điều tiết nhiều, gây hại cho mắt.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Ánh sáng do đèn học phát ra là chùm sáng nào?", "options": ["A. Phân kì", "B. Song song", "C. Hội tụ", "D. Không phải chùm sáng"], "answer": "A", "explain": "Đèn học tỏa sáng ra xung quanh là chùm phân kì.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn có chùm sáng hội tụ, ta có thể dùng?", "options": ["A. Kính lúp hứng ánh sáng mặt trời", "B. Tấm bìa", "C. Tấm gương mờ", "D. Tấm vải"], "answer": "A", "explain": "Kính lúp hội tụ chùm sáng mặt trời thành điểm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao khi đọc sách, ta nên ngồi nơi đủ ánh sáng?", "options": ["A. Vì sách đẹp hơn", "B. Vì đủ ánh sáng giúp mắt nhìn rõ, đỡ mỏi", "C. Vì sách phát sáng", "D. Vì không khí trong lành"], "answer": "B", "explain": "Đủ ánh sáng giúp mắt nhìn rõ chữ, giảm mỏi mắt.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người đứng cách nguồn sáng điểm 1 m, vật cản cách nguồn 0,5 m. Bóng của vật trên màn sau người sẽ?", "options": ["A. To hơn vật", "B. Nhỏ hơn vật", "C. Bằng vật", "D. Không có bóng"], "answer": "A", "explain": "Vật ở giữa nguồn và màn, bóng trên màn to hơn vật thật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện tượng nào chứng tỏ ánh sáng truyền thẳng?", "options": ["A. Bóng tối của vật", "B. Tiếng vang", "C. Cầu vồng", "D. Sấm sét"], "answer": "A", "explain": "Bóng tối có hình dạng giống vật chứng tỏ ánh sáng truyền thẳng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyệt thực xảy ra vào lúc nào?", "options": ["A. Ban ngày", "B. Ban đêm khi trăng tròn", "C. Lúc bình minh", "D. Lúc hoàng hôn"], "answer": "B", "explain": "Nguyệt thực xảy ra ban đêm khi trăng tròn, Trái Đất che ánh sáng mặt trời.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một bạn học sinh làm thí nghiệm: chiếu đèn pin qua 3 tấm bìa có lỗ thẳng hàng. Đánh giá các nhận định.", "statements": ["a) Ánh sáng lọt qua 3 lỗ đến màn.", "b) Thí nghiệm chứng minh ánh sáng truyền thẳng.", "c) Nếu dịch một tấm bìa lệch, ánh sáng không qua được.", "d) Kết quả thí nghiệm không liên quan đến đường truyền của ánh sáng."], "answer": ["T", "T", "T", "F"], "explain": "Thí nghiệm chứng minh ánh sáng truyền theo đường thẳng.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về bảo vệ mắt.", "statements": ["a) Không nên nhìn trực tiếp vào mặt trời.", "b) Nên đọc sách nơi đủ ánh sáng.", "c) Không nên đọc sách nơi quá tối.", "d) Ánh sáng quá mạnh không hại mắt."], "answer": ["T", "T", "T", "F"], "explain": "Ánh sáng quá mạnh có thể gây hại cho mắt.", "points": 1}, {"type": "short", "level": "TH", "q": "Không nên nhìn trực tiếp vào đâu?", "answer": "mặt trời", "explain": "Không nên nhìn trực tiếp vào Mặt Trời vì gây hại cho mắt.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu một cách sử dụng năng lượng ánh sáng mặt trời trong đời sống.", "answer": "đun nước nóng", "explain": "Máy nước nóng năng lượng mặt trời dùng nhiệt từ ánh sáng để đun nước.", "points": 0.5}]}]}
