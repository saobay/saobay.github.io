", "options": ["A. Hai vật có cùng tốc độ", "B. Hai vật gặp nhau (cùng vị trí, cùng thời điểm)", "C. Hai vật đứng yên", "D. Hai vật có cùng khối lượng"], "answer": "B", "explain": "Điểm chung (t, s) nghĩa là cùng thời điểm, cùng vị trí: hai vật gặp nhau.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một ô tô có đồ thị s–t là đường thẳng từ (0,0) đến (4 h, 240 km). Đánh giá các nhận định.", "statements": ["a) Ô tô chuyển động đều.", "b) Tốc độ của ô tô là 60 km/h.", "c) Sau 6 giờ, ô tô đi được 360 km.", "d) Đồ thị càng về sau càng ít dốc."], "answer": ["T", "T", "T", "F"], "explain": "Đường thẳng nên độ dốc không đổi.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về đồ thị s–t của chuyển động không đều.", "statements": ["a) Đồ thị có thể là đường cong.", "b) Đồ thị có thể là đường gấp khúc.", "c) Độ dốc thay đổi theo thời gian.", "d) Đồ thị luôn là đường thẳng."], "answer": ["T", "T", "T", "F"], "explain": "Chuyển động không đều có đồ thị là đường cong hoặc gấp khúc.", "points": 1}, {"type": "short", "level": "TH", "q": "Vật chuyển động đều với tốc độ 15 m/s trong 10 s. Quãng đường vật đi được là bao nhiêu mét?", "answer": "150", "explain": "s = 15 x 10 = 150 m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đồ thị s–t của một vật đi qua (1 h, 40 km) và (4 h, 160 km). Tính tốc độ (km/h) của vật.", "answer": "40", "explain": "v = (160-40)/(4-1) = 120/3 = 40 km/h.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Khi vẽ đồ thị s–t, ta đánh dấu các điểm có tọa độ là gì?", "options": ["A. (t, s)", "B. (s, t)", "C. (v, t)", "D. (m, s)"], "answer": "A", "explain": "Mỗi điểm có tọa độ (t, s): hoành độ là thời gian, tung độ là quãng đường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật chuyển động đều, tại t = 0 thì s = 0, tại t = 10 s thì s = 100 m. Tốc độ của vật là?", "options": ["A. 1000 m/s", "B. 10 m/s", "C. 110 m/s", "D. 90 m/s"], "answer": "B", "explain": "v = 100/10 = 10 m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trên đồ thị s–t, đoạn từ t = 2 h đến t = 5 h là đường nằm ngang tại s = 120 km. Điều đó có nghĩa là?", "options": ["A. Xe chạy đều 120 km/h", "B. Xe dừng lại trong 3 giờ tại vị trí cách điểm xuất phát 120 km", "C. Xe quay đầu", "D. Xe chạy nhanh dần"], "answer": "B", "explain": "Đoạn nằm ngang: s không đổi, vật đứng yên 3 giờ tại vị trí 120 km.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "An đi xe đạp từ nhà đến trường với đồ thị s–t là đường thẳng qua (0,0) và (20 phút, 5 km). Hôm sau An đi nhanh gấp 1,5 lần. Đồ thị hôm sau sẽ?", "options": ["A. Dốc hơn 1,5 lần", "B. Ít dốc hơn", "C. Nằm ngang", "D. Không thay đổi"], "answer": "A", "explain": "Tốc độ tăng 1,5 lần thì độ dốc tăng 1,5 lần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đồ thị s–t của vật chuyển động đều nhưng xuất phát từ vị trí s = 20 m có dạng?", "options": ["A. Đường thẳng qua gốc tọa độ", "B. Đường thẳng không qua gốc tọa độ", "C. Đường nằm ngang", "D. Đường cong"], "answer": "B", "explain": "Đường thẳng cắt trục tung tại s = 20 m, không qua gốc tọa độ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một xe chuyển động đều với tốc độ 72 km/h. Trên đồ thị s–t với t tính bằng giờ, s tính bằng km, độ dốc của đồ thị là?", "options": ["A. 72", "B. 20", "C. 259,2", "D. 1"], "answer": "A", "explain": "Độ dốc = tốc độ = 72 (km/h).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đồ thị s–t của tàu hỏa: từ 0 đến 1 giờ đi được 80 km, dừng 30 phút, đi tiếp 1 giờ được 80 km nữa. Đánh giá các nhận định.", "statements": ["a) Tổng quãng đường tàu đi là 160 km.", "b) Tổng thời gian là 2,5 giờ.", "c) Tốc độ lúc chạy của tàu là 80 km/h.", "d) Tốc độ trung bình cả hành trình là 80 km/h."], "answer": ["T", "T", "T", "F"], "explain": "vtb = 160/2,5 = 64 km/h.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về ý nghĩa thực tế của đồ thị s–t.", "statements": ["a) Giúp biết vị trí của vật tại mỗi thời điểm.", "b) Giúp tính tốc độ của vật.", "c) Giúp biết lúc nào vật dừng lại.", "d) Giúp biết khối lượng của vật."], "answer": ["T", "T", "T", "F"], "explain": "Đồ thị s–t không cho biết khối lượng.", "points": 1}, {"type": "short", "level": "TH", "q": "Một vật có đồ thị s–t là đường thẳng đi qua (4 s, 32 m). Tính tốc độ của vật theo m/s.", "answer": "8", "explain": "v = 32/4 = 8 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai xe A, B có đồ thị s–t cắt nhau tại điểm (2 h, 100 km). Hỏi sau 2 giờ, hai xe cách nhau bao xa?", "answer": "0", "explain": "Điểm cắt nhau nghĩa là hai xe gặp nhau, khoảng cách bằng 0.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng về đồ thị quãng đường – thời gian?", "options": ["A. Trục hoành là quãng đường, trục tung là thời gian", "B. Trục hoành là thời gian, trục tung là quãng đường", "C. Cả hai trục đều là thời gian", "D. Cả hai trục đều là quãng đường"], "answer": "B", "explain": "Trục hoành (ngang) là thời gian, trục tung (đứng) là quãng đường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người đi bộ đều với tốc độ 5 km/h trong 2 giờ. Đồ thị s–t của người đó kết thúc tại điểm nào?", "options": ["A. (2 h, 10 km)", "B. (10 h, 2 km)", "C. (2 km, 10 h)", "D. (5 h, 2 km)"], "answer": "A", "explain": "s = 10 km nên điểm cuối là (2 h, 10 km).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồ thị s–t của một vật gồm hai đoạn thẳng: đoạn 1 từ (0,0) đến (2 s, 20 m), đoạn 2 từ (2 s, 20 m) đến (6 s, 20 m). Mô tả chuyển động của vật?", "options": ["A. Chuyển động đều suốt 6 s", "B. Đi đều 2 s đầu rồi đứng yên 4 s sau", "C. Đứng yên 2 s đầu rồi đi 4 s sau", "D. Quay đầu sau 2 s"], "answer": "B", "explain": "Đoạn 1 dốc (đi đều), đoạn 2 nằm ngang (đứng yên).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một xe chuyển động có đồ thị s–t là đường thẳng đi qua (1 h, 60 km) và (4 h, 240 km). Nếu xe tiếp tục chuyển động đều, sau 6 giờ xe đi được bao xa?", "options": ["A. 300 km", "B. 360 km", "C. 240 km", "D. 420 km"], "answer": "B", "explain": "v = 60 km/h; sau 6 giờ s = 360 km.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đồ thị s–t của chuyển động đều luôn?", "options": ["A. Là đường thẳng", "B. Là đường cong", "C. Là đường tròn", "D. Là đường gấp khúc"], "answer": "A", "explain": "Chuyển động đều có đồ thị s–t là đường thẳng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ đồ thị s–t, đoạn nào dốc nhất thì vật chuyển động?", "options": ["A. Chậm nhất", "B. Nhanh nhất", "C. Đứng yên", "D. Quay đầu"], "answer": "B", "explain": "Đoạn dốc nhất ứng với tốc độ lớn nhất.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một xe máy có đồ thị s–t: 0-1 h đi được 40 km, 1-1,5 h nằm ngang, 1,5-3 h đi thêm 60 km. Đánh giá các nhận định.", "statements": ["a) Xe nghỉ 30 phút.", "b) Tổng quãng đường xe đi là 100 km.", "c) Tốc độ trung bình của xe là 40 km/h.", "d) Tốc độ lúc đi (không tính nghỉ) là 50 km/h."], "answer": ["T", "T", "F", "F"], "explain": "Tổng thời gian 3 giờ nên vtb = 100/3 ≈ 33,3 km/h; thời gian đi thực tế 2,5 giờ nên tốc độ lúc đi = 100/2,5 = 40 km/h.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định tổng kết về đồ thị s–t.", "statements": ["a) Đồ thị cho biết quãng đường theo thời gian.", "b) Độ dốc của đồ thị cho biết tốc độ.", "c) Đoạn nằm ngang cho biết vật đứng yên.", "d) Không thể tính tốc độ từ đồ thị."], "answer": ["T", "T", "T", "F"], "explain": "Có thể tính tốc độ từ đồ thị bằng v = (s2-s1)/(t2-t1).", "points": 1}, {"type": "short", "level": "TH", "q": "Đồ thị s–t đi qua (6 s, 48 m). Tính tốc độ của vật theo m/s.", "answer": "8", "explain": "v = 48/6 = 8 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật chuyển động đều, sau 15 phút đi được 3 km. Tính tốc độ của vật theo m/s.", "answer": "3,33", "explain": "v = 12 km/h = 12/3,6 ≈ 3,33 m/s.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các đồ thị sau, đồ thị nào biểu diễn vật đứng yên?", "options": ["A. Đường thẳng đi qua gốc tọa độ", "B. Đường thẳng nằm ngang song song với trục thời gian", "C. Đường thẳng dốc đứng", "D. Đường cong đi lên"], "answer": "B", "explain": "Đường nằm ngang song song với trục t: s không đổi, vật đứng yên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một ô tô chuyển động đều với tốc độ 50 km/h. Sau 3 giờ, đồ thị s–t của ô tô đi qua điểm?", "options": ["A. (3 h, 150 km)", "B. (150 h, 3 km)", "C. (3 km, 150 h)", "D. (50 h, 3 km)"], "answer": "A", "explain": "s = 150 km nên điểm là (3 h, 150 km).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai vật A và B chuyển động đều. Đồ thị s–t của A dốc gấp đôi của B. Tốc độ của B là 15 m/s. Tốc độ của A là?", "options": ["A. 7,5 m/s", "B. 30 m/s", "C. 17 m/s", "D. 13 m/s"], "answer": "B", "explain": "Độ dốc tỉ lệ với tốc độ: vA = 2 x 15 = 30 m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người đi xe máy từ tỉnh X đến tỉnh Y dài 150 km. Đồ thị s–t cho thấy người đó đi 2 giờ đầu được 100 km, nghỉ 1 giờ, rồi đi tiếp với tốc độ cũ. Người đó đến Y sau mấy giờ kể từ lúc xuất phát?", "options": ["A. 3 giờ", "B. 4 giờ", "C. 3,5 giờ", "D. 5 giờ"], "answer": "B", "explain": "v = 50 km/h; 50 km còn lại mất 1 giờ; tổng 2+1+1 = 4 giờ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đồ thị quãng đường – thời gian của chuyển động không đều có thể là?", "options": ["A. Đường cong", "B. Đường thẳng duy nhất", "C. Một điểm", "D. Đường tròn"], "answer": "A", "explain": "Chuyển động không đều có đồ thị là đường cong hoặc gấp khúc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên đồ thị s–t, muốn tìm thời điểm vật đi được 80 km, ta làm thế nào?", "options": ["A. Từ s = 80 km dóng ngang sang đồ thị rồi dóng xuống trục t", "B. Từ t = 80 dóng lên", "C. Đoán", "D. Không làm được"], "answer": "A", "explain": "Từ giá trị s trên trục tung dóng sang đồ thị rồi xuống trục hoành đọc t.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đồ thị s–t của hai ô tô A và B xuất phát cùng lúc từ cùng một điểm: A dốc hơn B. Đánh giá các nhận định.", "statements": ["a) Ô tô A chạy nhanh hơn ô tô B.", "b) Sau cùng một thời gian, A đi được quãng đường dài hơn B.", "c) Nếu B đi 120 km trong 2 giờ thì A đi được hơn 120 km trong 2 giờ.", "d) Đồ thị của A nằm dưới đồ thị của B."], "answer": ["T", "T", "T", "F"], "explain": "A dốc hơn, nhanh hơn nên đồ thị của A nằm trên.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về cách vẽ đồ thị s–t.", "statements": ["a) Lập bảng số liệu (t, s) trước khi vẽ.", "b) Đánh dấu các điểm (t, s) lên hệ trục.", "c) Nối các điểm lại thành đường biểu diễn.", "d) Trục hoành vẽ quãng đường, trục tung vẽ thời gian."], "answer": ["T", "T", "T", "F"], "explain": "Trục hoành là thời gian, trục tung là quãng đường.", "points": 1}, {"type": "short", "level": "TH", "q": "Một vật chuyển động đều với tốc độ 9 m/s. Sau 20 s, quãng đường vật đi được là bao nhiêu mét?", "answer": "180", "explain": "s = 9 x 20 = 180 m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trên đồ thị s–t, vật đi từ (0,0) đến (10 s, 200 m) theo đường thẳng. Tính tốc độ (m/s) của vật.", "answer": "20", "explain": "v = 200/10 = 20 m/s.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Đồ thị s–t đi qua gốc tọa độ có ý nghĩa gì?", "options": ["A. Vật xuất phát từ vị trí s = 0 lúc t = 0", "B. Vật đứng yên", "C. Vật chuyển động không đều", "D. Vật quay đầu"], "answer": "A", "explain": "Đồ thị qua gốc tọa độ nghĩa là lúc t = 0, s = 0.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật chuyển động đều với tốc độ 4 m/s. Đồ thị s–t của vật sau 25 s kết thúc tại?", "options": ["A. (25 s, 100 m)", "B. (100 s, 25 m)", "C. (25 m, 100 s)", "D. (4 s, 25 m)"], "answer": "A", "explain": "s = 100 m nên điểm cuối là (25 s, 100 m).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồ thị s–t của một xe buýt: 0-30 phút đi được 20 km, dừng 10 phút đón khách, đi tiếp 20 phút được 15 km. Tốc độ trung bình của xe là?", "options": ["A. 35 km/h", "B. 30 km/h", "C. 26,25 km/h", "D. 40 km/h"], "answer": "A", "explain": "Tổng s = 35 km, tổng t = 60 phút = 1 giờ; vtb = 35/1 = 35 km/h.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai thành phố A và B cách nhau 200 km. Xe 1 từ A đi B với đồ thị s–t qua (0,0)-(4 h, 200 km); xe 2 từ B đi A với đồ thị qua (0,200 km)-(5 h, 0). Hai xe gặp nhau sau bao lâu?", "options": ["A. 2 giờ", "B. 2,22 giờ", "C. 2,5 giờ", "D. 3 giờ"], "answer": "B", "explain": "v1 = 50 km/h, v2 = 40 km/h; t = 200/90 ≈ 2,22 giờ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Muốn so sánh tốc độ của hai vật từ đồ thị s–t, ta so sánh?", "options": ["A. Màu sắc của đồ thị", "B. Độ dốc của hai đồ thị", "C. Độ dài của đồ thị", "D. Vị trí của đồ thị"], "answer": "B", "explain": "So sánh độ dốc: đồ thị nào dốc hơn thì vật đó nhanh hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có đồ thị s–t là đoạn thẳng từ (2 s, 10 m) đến (7 s, 60 m). Tốc độ của vật là?", "options": ["A. 10 m/s", "B. 8,6 m/s", "C. 70 m/s", "D. 5 m/s"], "answer": "A", "explain": "v = (60-10)/(7-2) = 50/5 = 10 m/s.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một vận động viên chạy marathon có đồ thị s–t gần như đường thẳng trong 2 giờ đầu, sau đó độ dốc giảm dần. Đánh giá các nhận định.", "statements": ["a) 2 giờ đầu vận động viên chạy gần như đều.", "b) Sau đó vận động viên chạy chậm dần.", "c) Đồ thị là đường cong.", "d) Tốc độ trung bình 2 giờ đầu lớn hơn tốc độ trung bình cả quá trình."], "answer": ["T", "T", "T", "T"], "explain": "Độ dốc giảm dần nghĩa là tốc độ giảm dần; tốc độ trung bình 2 giờ đầu lớn hơn.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định ôn tập về đồ thị s–t.", "statements": ["a) Trục hoành: thời gian; trục tung: quãng đường.", "b) Chuyển động đều: đồ thị là đường thẳng.", "c) Đồ thị càng dốc: tốc độ càng lớn.", "d) Đoạn nằm ngang: vật chuyển động đều."], "answer": ["T", "T", "T", "F"], "explain": "Đoạn nằm ngang nghĩa là vật đứng yên.", "points": 1}, {"type": "short", "level": "TH", "q": "Đồ thị s–t của vật là đường thẳng đi qua (8 s, 64 m). Tính tốc độ của vật theo m/s.", "answer": "8", "explain": "v = 64/8 = 8 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xe đi với tốc độ 54 km/h. Tính quãng đường (m) xe đi được trong 10 s.", "answer": "150", "explain": "54 km/h = 15 m/s; s = 15 x 10 = 150 m.", "points": 0.5}]}]}
