er": "nam châm điện", "explain": "Chuông điện dùng nam châm điện đóng ngắt liên tục.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Kể tên một thiết bị dùng nam châm điện.", "answer": "cần cẩu", "explain": "Cần cẩu nam châm điện dùng để nâng sắt thép.", "points": 0.5}]}]}
