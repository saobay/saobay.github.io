plain": "v = 2 x 340 = 680 m/s.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Âm thanh do trống phát ra khi ta?", "options": ["A. Nhìn trống", "B. Đánh vào mặt trống", "C. Lau trống", "D. Khiêng trống"], "answer": "B", "explain": "Đánh vào mặt trống làm mặt trống dao động, phát ra âm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi ta bịt tai lại, tiếng ồn nhỏ đi vì?", "options": ["A. Âm không truyền được nữa", "B. Ít sóng âm lọt vào tai hơn", "C. Tai bị điếc", "D. Nguồn âm ngừng phát"], "answer": "B", "explain": "Bịt tai làm giảm lượng sóng âm đến màng nhĩ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một thí nghiệm với hai chiếc cốc nối bằng sợi dây căng. Đánh giá các nhận định.", "statements": ["a) Nói vào cốc này, người kia áp tai vào cốc kia nghe được.", "b) Âm truyền qua sợi dây.", "c) Dây chùng thì nghe kém hơn dây căng.", "d) Thí nghiệm chứng tỏ âm truyền được trong chất rắn."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn nhận định đều đúng.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định tổng kết bài sóng âm.", "statements": ["a) Âm do vật dao động phát ra.", "b) Sóng âm là sự lan truyền dao động.", "c) Âm không truyền được trong chân không.", "d) Âm truyền nhanh nhất trong chất khí."], "answer": ["T", "T", "T", "F"], "explain": "Âm truyền nhanh nhất trong chất rắn.", "points": 1}, {"type": "short", "level": "TH", "q": "Để sóng âm lan truyền được cần có gì?", "answer": "môi trường vật chất", "explain": "Sóng âm cần môi trường vật chất để lan truyền.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một tiếng động truyền trong nước quãng đường 3 km trong 2 s. Tính tốc độ (m/s).", "answer": "1500", "explain": "v = 3000/2 = 1500 m/s.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các hiện tượng sau, hiện tượng nào liên quan đến sóng âm?", "options": ["A. Nghe tiếng mưa rơi", "B. Nhìn thấy cầu vồng", "C. Sờ thấy vật nóng", "D. N : "NB", "q": "Đánh giá các nhận định về ứng dụng của âm thanh.", "statements": ["a) Sonar dùng sóng âm để đo độ sâu biển.", "b) Siêu âm dùng trong y học để chẩn đoán.", "c) Loa dùng để khuếch đại âm thanh.", "d) Sóng âm không có ứng dụng gì."], "answer": ["T", "T", "T", "F"], "explain": "Sóng âm có nhiều ứng dụng trong đời sống và kĩ thuật.", "points": 1}, {"type": "short", "level": "TH", "q": "Dơi dùng sóng âm để làm gì?", "answer": "định vị", "explain": "Dơi dùng sóng âm (siêu âm) để định vị con mồi và vật cản.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Siêu âm truyền trong nước 1500 m/s, sau 0,2 s nhận được phản xạ. Tính độ sâu (m).", "answer": "150", "explain": "Quãng đường đi về 300 m, độ sâu 150 m.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Âm thanh truyền trong không khí với tốc độ khoảng?", "options": ["A. 300000 km/s", "B. 340 m/s", "C. 1500 m/s", "D. 5000 m/s"], "answer": "B", "explain": "Tốc độ âm trong không khí khoảng 340 m/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi khoảng cách đến nguồn âm tăng gấp đôi, ta nghe thấy âm?", "options": ["A. To hơn", "B. Nhỏ hơn", "C. Như cũ", "D. Mất hẳn"], "answer": "B", "explain": "Càng xa nguồn âm, âm nghe càng nhỏ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người nghe thấy tiếng nổ sau 10 s kể từ khi thấy ánh chớp. Khoảng cách đến chỗ nổ là? (v = 340 m/s)", "options": ["A. 3400 m", "B. 34 m", "C. 350 m", "D. 330 m"], "answer": "A", "explain": "s = 340 x 10 = 3400 m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai người A và B cách nhau 1020 m. A gõ vào ống thép, B áp tai vào ống thép và đồng thời nghe qua không khí. Biết v thép = 5100 m/s, v khí = 340 m/s. B nghe tiếng qua thép trước qua không khí bao lâu?", "options": ["A. 2,8 s", "B. 3 s", "C. 0,2 s", "D. 3,2 s"], "answer": "A", "explain": "t thép = 0,2 s; t khí = 3 s; chênh lệch 2,8 s.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi ta vỗ tay,
