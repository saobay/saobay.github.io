ó thể gây hại cho cơ quan nào?", "answer": "tai", "explain": "Tiếng ồn lớn kéo dài gây hại cho tai (thính giác).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu một tác hại của ô nhiễm tiếng ồn đối với học sinh.", "answer": "mất tập trung", "explain": "Ô nhiễm tiếng ồn làm học sinh mất tập trung, ảnh hưởng học tập.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Vật nào sau đây vừa cứng vừa nhẵn?", "options": ["A. Tấm thảm", "B. Tấm kính", "C. Tấm vải", "D. Tấm xốp"], "answer": "B", "explain": "Tấm kính cứng và nhẵn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Âm phản xạ tốt nhất trên bề mặt nào?", "options": ["A. Bề mặt gồ ghề", "B. Bề mặt cứng, nhẵn", "C. Bề mặt mềm", "D. Bề mặt ướt"], "answer": "B", "explain": "Bề mặt cứng, nhẵn phản xạ âm tốt nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người đứng trước một hang động lớn và hét. Người đó nghe được nhiều tiếng vang vì?", "options": ["A. Âm phản xạ nhiều lần giữa các vách hang", "B. Hang phát ra âm", "C. Gió thổi", "D. Người đó hét nhiều lần"], "answer": "A", "explain": "Âm phản xạ qua lại nhiều lần giữa các vách hang tạo nhiều tiếng vang.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Người ta đo độ sâu của giếng bằng cách thả hòn đá và bấm giờ từ lúc thả đến lúc nghe tiếng đá chạm nước là 3 s. Biết thời gian hòn đá rơi là 2,9 s và tốc độ âm là 340 m/s. Độ sâu của giếng khoảng?", "options": ["A. 34 m", "B. 986 m", "C. 1020 m", "D. 340 m"], "answer": "A", "explain": "Thời gian âm truyền từ mặt nước lên miệng giếng = 3 - 2,9 = 0,1 s; độ sâu ≈ 340 x 0,1 = 34 m.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiếng vang khác âm trực tiếp ở điểm nào?", "options": ["A. Đến tai chậm hơn", "B. To hơn", "C. Cao hơn", "D. Không khác"], "answer": "A", "explain": "Tiếng vang là âm phản xạ nên đến tai chậm hơn âm trực tiếp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phòng karaoke, tường được lót xốp để?", "options": ["A. Trang trí", "B. Hấp thụ âm, tránh vang làm méo tiếng", "C. Giữ ấm", "D. Chống ẩm"], "answer": "B", "explain": "Xốp hấp thụ âm tốt, giúp âm thanh trong phòng rõ, không bị vang.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một lớp học gần đường lớn, giáo viên khó giảng bài vì ồn. Đánh giá các giải pháp.", "statements": ["a) Trồng cây xanh quanh trường giúp giảm ồn.", "b) Đóng cửa kính giúp cách âm.", "c) Lắp thêm rèm vải giúp hấp thụ âm.", "d) Cho học sinh đeo tai nghe chống ồn cả ngày là tốt nhất."], "answer": ["T", "T", "T", "F"], "explain": "Đeo tai nghe cả ngày không thuận tiện cho học tập; nên xử lí nguồn ồn.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định tổng kết bài.", "statements": ["a) Âm phản xạ là âm dội lại khi gặp vật cản.", "b) Vật cứng nhẵn phản xạ âm tốt.", "c) Vật mềm xốp hấp thụ âm tốt.", "d) Không cần chống ô nhiễm tiếng ồn."], "answer": ["T", "T", "T", "F"], "explain": "Cần chống ô nhiễm tiếng ồn để bảo vệ sức khỏe.", "points": 1}, {"type": "short", "level": "TH", "q": "Phòng thu âm lót xốp trên tường để làm gì?", "answer": "hấp thụ âm", "explain": "Xốp hấp thụ âm, tránh tiếng vang.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một người cách vách núi 850 m hét to. Tính thời gian (s) để nghe tiếng vang (v = 340 m/s).", "answer": "5", "explain": "Quãng đường đi về 1700 m; t = 1700/340 = 5 s.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hiện tượng nào sau đây là âm phản xạ?", "options": ["A. Nghe tiếng vang trong hang động", "B. Nghe nhạc", "C. Nghe chim hót", "D. Nghe gió thổi"], "answer": "A", "explain": "Nghe tiếng vang trong hang động là hiện tượng âm phản xạ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao vách núi tạo được tiếng vang?", "options": ["A. Vì núi cao", "B. Vì vách núi cứng, phản xạ âm tốt", "C. Vì núi đẹp", "D. Vì núi có cây"], "answer": "B", "explain": "Vách núi cứng nên phản xạ âm tốt, tạo tiếng vang.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một em bé vỗ tay cách bức tường 34 m. Sau bao lâu em nghe tiếng vang? (v = 340 m/s)", "options": ["A. 0,1 s", "B. 0,2 s", "C. 1 s", "D. 2 s"], "answer": "B", "explain": "Quãng đường đi về 68 m; t = 68/340 = 0,2 s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai người cùng hét trước vách núi, người A cách 170 m, người B cách 340 m. Ai nghe tiếng vang trước?", "options": ["A. Người A", "B. Người B", "C. Cùng lúc", "D. Không ai nghe"], "answer": "A", "explain": "Người A gần hơn nên âm đi về nhanh hơn, nghe tiếng vang trước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để giảm tiếng ồn từ đường vào nhà, ta có thể?", "options": ["A. Mở cửa sổ", "B. Trồng cây xanh và lắp cửa kính cách âm", "C. Phá tường", "D. Mở loa to"], "answer": "B", "explain": "Cây xanh và cửa kính cách âm giúp giảm tiếng ồn vào nhà.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiếng ồn được đo bằng đơn vị nào?", "options": ["A. Đêxiben (dB)", "B. Héc (Hz)", "C. Mét (m)", "D. Giây (s)"], "answer": "A", "explain": "Độ to của tiếng ồn đo bằng đêxiben (dB).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các biện pháp giảm tiếng vang trong hội trường.", "statements": ["a) Lót thảm sàn giúp hấp thụ âm.", "b) Treo rèm vải giúp giảm vang.", "c) Làm trần bằng vật liệu xốp giúp hút âm.", "d) Ốp tường bằng kính sẽ giảm vang."], "answer": ["T", "T", "T", "F"], "explain": "Kính phản xạ âm tốt nên làm tăng vang, không giảm vang.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về âm thanh và môi trường.", "statements": ["a) Giữ yên tĩnh nơi công cộng là văn minh.", "b) Cây xanh giúp giảm tiếng ồn đô thị.", "c) Vật liệu xốp giúp cách âm.", "d) Tiếng ồn lớn tốt cho sức khỏe."], "answer": ["T", "T", "T", "F"], "explain": "Tiếng ồn lớn có hại cho sức khỏe.", "points": 1}, {"type": "short", "level": "TH", "q": "Đơn vị đo độ to của tiếng ồn là gì?", "answer": "đêxiben", "explain": "Độ to của tiếng ồn đo bằng đêxiben (dB).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một người đứng cách vách đá 1020 m. Tính thời gian (s) để nghe tiếng vang (v = 340 m/s).", "answer": "6", "explain": "Quãng đường đi về 2040 m; t = 2040/340 = 6 s.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Âm phản xạ có lợi hay có hại?", "options": ["A. Chỉ có lợi", "B. Chỉ có hại", "C. Vừa có lợi (sonar, dơi định vị) vừa có hại (tiếng vang gây ồn)", "D. Không lợi không hại"], "answer": "C", "explain": "Âm phản xạ có ứng dụng tốt nhưng tiếng vang không mong muốn gây ồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiếng vang trong phòng họp gây khó chịu, cách khắc phục là?", "options": ["A. Dùng vật liệu hấp thụ âm lót tường", "B. Nói to hơn", "C. Mở thêm loa", "D. Để phòng trống"], "answer": "A", "explain": "Vật liệu hấp thụ âm giúp giảm tiếng vang trong phòng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người muốn đo khoảng cách đến vách núi bằng tiếng vang. Người đó hét và bấm giờ được 6 s. Khoảng cách đến vách núi là? (v = 340 m/s)", "options": ["A. 2040 m", "B. 1020 m", "C. 340 m", "D. 170 m"], "answer": "B", "explain": "Quãng đường đi về 2040 m, khoảng cách 1020 m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao cá heo có thể định vị con mồi trong nước đục?", "options": ["A. Vì mắt cá heo tinh", "B. Vì cá heo phát siêu âm và nghe âm phản xạ", "C. Vì nước trong", "D. Vì con mồi phát sáng"], "answer": "B", "explain": "Cá heo dùng siêu âm và nghe âm phản xạ để định vị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ô nhiễm tiếng ồn thường xảy ra ở đâu?", "options": ["A. Nơi yên tĩnh", "B. Gần đường giao thông đông, công trường, nhà máy", "C. Trong rừng sâu", "D. Trên núi cao"], "answer": "B", "explain": "Nơi đông xe cộ, công trường, nhà máy thường bị ô nhiễm tiếng ồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giờ nào sau đây KHÔNG nên gây tiếng ồn lớn?", "options": ["A. Buổi sáng", "B. Buổi chiều", "C. Ban đêm (giờ ngủ)", "D. Buổi trưa"], "answer": "C", "explain": "Ban đêm là giờ nghỉ ngơi, không nên gây tiếng ồn lớn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các ý kiến về việc sử dụng loa kẹo kéo.", "statements": ["a) Mở loa kẹo kéo quá to giữa đêm làm phiền hàng xóm.", "b) Nên hát với âm lượng vừa phải.", "c) Nên hát trong giờ phù hợp, không quá khuya.", "d) Càng mở to càng thể hiện đẳng cấp."], "answer": ["T", "T", "T", "F"], "explain": "Mở loa quá to gây ô nhiễm tiếng ồn, ảnh hưởng cộng đồng.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định ôn tập chương âm thanh.", "statements": ["a) Âm do vật dao động phát ra.", "b) Độ to phụ thuộc biên độ, độ cao phụ thuộc tần số.", "c) Âm phản xạ khi gặp vật cản.", "d) Nên chung tay chống ô nhiễm tiếng ồn."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn nhận định đều đúng.", "points": 1}, {"type": "short", "level": "TH", "q": "Cá heo dùng sóng âm để làm gì?", "answer": "định vị", "explain": "Cá heo dùng siêu âm và âm phản xạ để định vị.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một người hét trước vách núi, sau 8 s nghe tiếng vang. Tính khoảng cách (m) đến vách núi (v = 340 m/s).", "answer": "1360", "explain": "Quãng đường đi về 2720 m, khoảng cách 1360 m.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào đúng về âm phản xạ?", "options": ["A. Chỉ xảy ra với âm to", "B. Xảy ra khi âm gặp vật cản", "C. Không bao giờ xảy ra", "D. Chỉ xảy ra trong chân không"], "answer": "B", "explain": "Âm phản xạ xảy ra khi sóng âm gặp vật cản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vật nào hấp thụ âm tốt nhất trong các vật sau?", "options": ["A. Tường gạch", "B. Tấm xốp dày", "C. Tấm kính", "D. Tấm thép"], "answer": "B", "explain": "Tấm xốp dày mềm, xốp nên hấp thụ âm tốt nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người đứng cách một tòa nhà 68 m và vỗ tay. Sau bao lâu nghe tiếng vang? (v = 340 m/s)", "options": ["A. 0,4 s", "B. 0,2 s", "C. 2 s", "D. 4 s"], "answer": "A", "explain": "Quãng đường đi về 136 m; t = 136/340 = 0,4 s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một phòng có diện tích tường lớn bằng kính. Để giảm vang, nên?", "options": ["A. Thêm rèm vải dày", "B. Thêm nhiều kính hơn", "C. Bỏ hết đồ đạc", "D. Mở loa to"], "answer": "A", "explain": "Rèm vải dày hấp thụ âm tốt, giúp giảm tiếng vang.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiếng ồn ảnh hưởng đến việc học tập như thế nào?", "options": ["A. Giúp học tốt hơn", "B. Gây mất tập trung, khó tiếp thu", "C. Không ảnh hưởng", "D. Giúp nhớ lâu"], "answer": "B", "explain": "Tiếng ồn gây mất tập trung, ảnh hưởng đến học tập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi ở trong thư viện, ta nên?", "options": ["A. Nói chuyện to", "B. Giữ yên tĩnh", "C. Mở nhạc to", "D. Chạy nhảy"], "answer": "B", "explain": "Trong thư viện cần giữ yên tĩnh để mọi người học tập.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các hành vi bảo vệ môi trường âm thanh ở trường học.", "statements": ["a) Không la hét trong lớp học.", "b) Không bấm còi xe inh ỏi trong sân trường.", "c) Trồng cây xanh quanh trường.", "d) Mở loa phát thanh quá to giờ ra chơi."], "answer": ["T", "T", "T", "F"], "explain": "Mở loa quá to gây ô nhiễm tiếng ồn, không nên.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về trách nhiệm chống ồn.", "statements": ["a) Học sinh nên giữ trật tự trong lớp.", "b) Mọi người nên hạn chế gây ồn nơi công cộng.", "c) Chính quyền cần quy định về tiếng ồn.", "d) Chống ồn chỉ là việc của người lớn."], "answer": ["T", "T", "T", "F"], "explain": "Chống ô nhiễm tiếng ồn là trách nhiệm của mọi người.", "points": 1}, {"type": "short", "level": "TH", "q": "Trong thư viện, mọi người nên giữ gì?", "answer": "yên tĩnh", "explain": "Trong thư viện cần giữ yên tĩnh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một tiếng vang đến tai sau 0,5 s. Tính khoảng cách (m) đến vật cản (v = 340 m/s).", "answer": "85", "explain": "Quãng đường đi về 170 m, khoảng cách 85 m.", "points": 0.5}]}]}
