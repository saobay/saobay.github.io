út"], "answer": "A", "explain": "Dòng điện càng lớn, từ trường càng mạnh, hút càng mạnh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai nam châm điện: A quấn 100 vòng, B quấn 50 vòng, cùng dòng điện. Cái nào mạnh hơn?", "options": ["A. Cái A", "B. Cái B", "C. Như nhau", "D. Không xác định"], "answer": "A", "explain": "Số vòng dây nhiều hơn nên từ trường mạnh hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một nam châm điện hút được 8 đinh. Tăng gấp đôi số vòng dây và giữ nguyên dòng điện, số đinh hút được sẽ?", "options": ["A. Tăng lên", "B. Giảm xuống", "C. Vẫn 8", "D. Về 0"], "answer": "A", "explain": "Từ trường mạnh hơn nên hút được nhiều đinh hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lõi sắt có tác dụng gì trong nam châm điện?", "options": ["A. Tăng từ trường", "B. Trang trí", "C. Dẫn điện", "D. Cách điện"], "answer": "A", "explain": "Lõi sắt bị nhiễm từ làm tăng từ trường của cuộn dây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nếu bỏ lõi sắt ra khỏi cuộn dây, từ trường sẽ?", "options": ["A. Yếu đi nhiều", "B. Mạnh lên", "C. Không đổi", "D. Mất hẳn"], "answer": "A", "explain": "Không có lõi sắt, từ trường của cuộn dây yếu đi nhiều.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một nhóm học sinh thi chế tạo nam châm điện khỏe nhất. Đánh giá các chiến thuật.", "statements": ["a) Quấn càng nhiều vòng càng tốt.", "b) Dùng pin mạnh hơn (đúng giới hạn an toàn).", "c) Dùng lõi sắt non to hơn.", "d) Quấn ít vòng cho nhanh."], "answer": ["T", "T", "T", "F"], "explain": "Quấn ít vòng thì từ trường yếu, không khỏe.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các yếu tố ảnh hưởng đến lực hút của nam châm điện.", "statements": ["a) Số vòng dây.", "b) Cường độ dòng điện.", "c) Lõi sắt.", "d) Màu sắc của dây."], "answer": ["T", "T", "T", "F"], "explain": "Màu sắc của dây không ảnh hưởng đến lực hút.", "points": 1}, {"type": "short", "level": "TH", "q": "Lõi sắt trong nam châm đi
