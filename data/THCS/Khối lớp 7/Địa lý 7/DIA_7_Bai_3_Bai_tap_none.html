<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3: Nguồn lao động và vấn đề việc làm - Bài tập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 16px; line-height: 1.6; }
        .question { background: white; padding: 16px; margin: 12px 0; border-radius: 8px; border: 1px solid #e2e8f0; }
        .options label { display: block; padding: 8px; margin: 4px 0; background: #f8fafc; border-radius: 4px; cursor: pointer; }
        .options label:hover { background: #e0f2fe; }
    </style>
</head>
<body class="bg-slate-50">
<div class="max-w-3xl mx-auto">
<h1 class="text-2xl font-bold mb-4">Bài 3: Nguồn lao động và vấn đề việc làm - Bài tập</h1>

<div class="question">
<p class="font-semibold mb-2">Câu 1: Nguồn lao động gồm:</p>
<div class="options">
<label><input type="radio" name="q1" value="A"> A. Trẻ em</label>
<label><input type="radio" name="q1" value="B"> B. Người trong độ tuổi lao động</label>
<label><input type="radio" name="q1" value="C"> C. Người già</label>
<label><input type="radio" name="q1" value="D"> D. Tất cả dân số</label>
</div>
<button onclick="checkAnswer('q1', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q1" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 2: Xu hướng cơ cấu lao động:</p>
<div class="options">
<label><input type="radio" name="q2" value="A"> A. Nông nghiệp tăng</label>
<label><input type="radio" name="q2" value="B"> B. Công nghiệp-dịch vụ tăng</label>
<label><input type="radio" name="q2" value="C"> C. Không thay đổi</label>
<label><input type="radio" name="q2" value="D"> D. Giảm tất cả</label>
</div>
<button onclick="checkAnswer('q2', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q2" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 3: Thất nghiệp là:</p>
<div class="options">
<label><input type="radio" name="q3" value="A"> A. Không có việc làm</label>
<label><input type="radio" name="q3" value="B"> B. Có việc làm</label>
<label><input type="radio" name="q3" value="C"> C. Đang đi học</label>
<label><input type="radio" name="q3" value="D"> D. Đã nghỉ hưu</label>
</div>
<button onclick="checkAnswer('q3', 'A')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q3" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 4: Nước đang phát triển thường:</p>
<div class="options">
<label><input type="radio" name="q4" value="A"> A. Thừa việc làm</label>
<label><input type="radio" name="q4" value="B"> B. Thiếu việc làm</label>
<label><input type="radio" name="q4" value="C"> C. Đủ việc làm</label>
<label><input type="radio" name="q4" value="D"> D. Không cần việc làm</label>
</div>
<button onclick="checkAnswer('q4', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q4" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 5: Lao động qua đào tạo có:</p>
<div class="options">
<label><input type="radio" name="q5" value="A"> A. Năng suất cao hơn</label>
<label><input type="radio" name="q5" value="B"> B. Năng suất thấp hơn</label>
<label><input type="radio" name="q5" value="C"> C. Năng suất bằng nhau</label>
<label><input type="radio" name="q5" value="D"> D. Không ảnh hưởng</label>
</div>
<button onclick="checkAnswer('q5', 'A')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q5" class="mt-2"></div>
</div>
</div>
<script>
function checkAnswer(qid, correct) {
    const selected = document.querySelector(`input[name="${qid}"]:checked`);
    const feedback = document.getElementById(`fb-${qid}`);
    if (!selected) { feedback.innerHTML = '<span class="text-orange-600">Hãy chọn đáp án!</span>'; return; }
    if (selected.value === correct) {
        feedback.innerHTML = '<span class="text-green-600 font-bold">✓ Đúng!</span>';
    } else {
        feedback.innerHTML = '<span class="text-red-600">✗ Chưa đúng. Đáp án đúng: ' + correct + '</span>';
    }
}
</script>
</body>
</html>
