<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1: Dân số và sự gia tăng dân số thế giới - Bài tập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 16px; line-height: 1.6; }
        .question { background: white; padding: 16px; margin: 12px 0; border-radius: 8px; border: 1px solid #e2e8f0; }
        .options label { display: block; padding: 8px; margin: 4px 0; background: #f8fafc; border-radius: 4px; cursor: pointer; }
        .options label:hover { background: #e0f2fe; }
    </style>
</head>
<body class="bg-slate-50">
<div class="max-w-3xl mx-auto">
<h1 class="text-2xl font-bold mb-4">Bài 1: Dân số và sự gia tăng dân số thế giới - Bài tập</h1>

<div class="question">
<p class="font-semibold mb-2">Câu 1: Dân số thế giới năm 2023 khoảng:</p>
<div class="options">
<label><input type="radio" name="q1" value="A"> A. 6 tỉ</label>
<label><input type="radio" name="q1" value="B"> B. 7 tỉ</label>
<label><input type="radio" name="q1" value="C"> C. 8 tỉ</label>
<label><input type="radio" name="q1" value="D"> D. 9 tỉ</label>
</div>
<button onclick="checkAnswer('q1', 'C')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q1" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 2: Gia tăng tự nhiên là:</p>
<div class="options">
<label><input type="radio" name="q2" value="A"> A. Sinh - Tử</label>
<label><input type="radio" name="q2" value="B"> B. Nhập cư - Xuất cư</label>
<label><input type="radio" name="q2" value="C"> C. Sinh + Tử</label>
<label><input type="radio" name="q2" value="D"> D. Nhập cư + Xuất cư</label>
</div>
<button onclick="checkAnswer('q2', 'A')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q2" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 3: Gia tăng cơ học do:</p>
<div class="options">
<label><input type="radio" name="q3" value="A"> A. Sinh đẻ</label>
<label><input type="radio" name="q3" value="B"> B. Tử vong</label>
<label><input type="radio" name="q3" value="C"> C. Di dân</label>
<label><input type="radio" name="q3" value="D"> D. Chiến tranh</label>
</div>
<button onclick="checkAnswer('q3', 'C')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q3" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 4: Hậu quả của tăng dân số nhanh:</p>
<div class="options">
<label><input type="radio" name="q4" value="A"> A. Thiếu việc làm</label>
<label><input type="radio" name="q4" value="B"> B. Ô nhiễm môi trường</label>
<label><input type="radio" name="q4" value="C"> C. Thiếu tài nguyên</label>
<label><input type="radio" name="q4" value="D"> D. Tất cả các ý trên</label>
</div>
<button onclick="checkAnswer('q4', 'D')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q4" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 5: Nước có dân số đông nhất thế giới (2023):</p>
<div class="options">
<label><input type="radio" name="q5" value="A"> A. Mỹ</label>
<label><input type="radio" name="q5" value="B"> B. Indonesia</label>
<label><input type="radio" name="q5" value="C"> C. Ấn Độ</label>
<label><input type="radio" name="q5" value="D"> D. Trung Quốc</label>
</div>
<button onclick="checkAnswer('q5', 'C')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q5" class="mt-2"></div>
</div>
</div>
<script>
function checkAnswer(qid, correct) {
    const selected = document.querySelector(`input[name="${qid}"]:checked`);
    const feedback = document.getElementById(`fb-${qid}`);
    if (!selected) { feedback.innerHTML = '<span class="text-orange-600">Hãy chọn đáp án!</span>'; return; }
    if (selected.value === correct) {
        feedback.innerHTML = '<span class="text-green-600 font-bold">✓ Đúng!</span>';
    } else {
        feedback.innerHTML = '<span class="text-red-600">✗ Chưa đúng. Đáp án đúng: ' + correct + '</span>';
    }
}
</script>
</body>
</html>
