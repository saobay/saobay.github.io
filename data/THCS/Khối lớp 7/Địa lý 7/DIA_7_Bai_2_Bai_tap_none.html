<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2: Phân bố dân cư và các loại hình quần cư - Bài tập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 16px; line-height: 1.6; }
        .question { background: white; padding: 16px; margin: 12px 0; border-radius: 8px; border: 1px solid #e2e8f0; }
        .options label { display: block; padding: 8px; margin: 4px 0; background: #f8fafc; border-radius: 4px; cursor: pointer; }
        .options label:hover { background: #e0f2fe; }
    </style>
</head>
<body class="bg-slate-50">
<div class="max-w-3xl mx-auto">
<h1 class="text-2xl font-bold mb-4">Bài 2: Phân bố dân cư và các loại hình quần cư - Bài tập</h1>

<div class="question">
<p class="font-semibold mb-2">Câu 1: Dân cư tập trung đông ở:</p>
<div class="options">
<label><input type="radio" name="q1" value="A"> A. Núi cao</label>
<label><input type="radio" name="q1" value="B"> B. Đồng bằng ven biển</label>
<label><input type="radio" name="q1" value="C"> C. Sa mạc</label>
<label><input type="radio" name="q1" value="D"> D. Vùng cực</label>
</div>
<button onclick="checkAnswer('q1', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q1" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 2: Quần cư đô thị có đặc điểm:</p>
<div class="options">
<label><input type="radio" name="q2" value="A"> A. Mật độ thấp</label>
<label><input type="radio" name="q2" value="B"> B. Làm nông nghiệp</label>
<label><input type="radio" name="q2" value="C"> C. Mật độ cao, công nghiệp-dịch vụ</label>
<label><input type="radio" name="q2" value="D"> D. Sống rải rác</label>
</div>
<button onclick="checkAnswer('q2', 'C')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q2" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 3: Đô thị hóa là:</p>
<div class="options">
<label><input type="radio" name="q3" value="A"> A. Dân chuyển từ nông thôn ra thành thị</label>
<label><input type="radio" name="q3" value="B"> B. Dân chuyển từ thành thị về nông thôn</label>
<label><input type="radio" name="q3" value="C"> C. Dân số giảm</label>
<label><input type="radio" name="q3" value="D"> D. Dân số không đổi</label>
</div>
<button onclick="checkAnswer('q3', 'A')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q3" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 4: Siêu đô thị có dân số trên:</p>
<div class="options">
<label><input type="radio" name="q4" value="A"> A. 1 triệu</label>
<label><input type="radio" name="q4" value="B"> B. 5 triệu</label>
<label><input type="radio" name="q4" value="C"> C. 10 triệu</label>
<label><input type="radio" name="q4" value="D"> D. 20 triệu</label>
</div>
<button onclick="checkAnswer('q4', 'C')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q4" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 5: Mật độ dân số được tính bằng:</p>
<div class="options">
<label><input type="radio" name="q5" value="A"> A. Người/km²</label>
<label><input type="radio" name="q5" value="B"> B. Người/m²</label>
<label><input type="radio" name="q5" value="C"> C. Hộ/km²</label>
<label><input type="radio" name="q5" value="D"> D. Hộ/m²</label>
</div>
<button onclick="checkAnswer('q5', 'A')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q5" class="mt-2"></div>
</div>
</div>
<script>
function checkAnswer(qid, correct) {
    const selected = document.querySelector(`input[name="${qid}"]:checked`);
    const feedback = document.getElementById(`fb-${qid}`);
    if (!selected) { feedback.innerHTML = '<span class="text-orange-600">Hãy chọn đáp án!</span>'; return; }
    if (selected.value === correct) {
        feedback.innerHTML = '<span class="text-green-600 font-bold">✓ Đúng!</span>';
    } else {
        feedback.innerHTML = '<span class="text-red-600">✗ Chưa đúng. Đáp án đúng: ' + correct + '</span>';
    }
}
</script>
</body>
</html>
