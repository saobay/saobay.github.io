<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. about", "B. around", "C. cat", "D. away"], "answer": "C", "explain": "about, around, away đọc /ə/ ở âm tiết không nhấn; cat đọc /æ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. garden", "B. hobby", "C. collect", "D. picture"], "answer": "C", "explain": "collect nhấn âm 2; các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "She enjoys ___ flowers for the living room.", "options": ["A. arranging", "B. watching", "C. eating", "D. breaking"], "answer": "A", "explain": "arrange flowers (cắm hoa) hợp nghĩa."}, {"type": "mcq", "level": "TH", "q": "I love ___ comics in my free time.", "options": ["A. read", "B. to read", "C. reading", "D. reads"], "answer": "C", "explain": "love + V-ing."}, {"type": "mcq", "level": "VD", "q": "Making pottery is not difficult for her; it is ___.", "options": ["A. a piece of cake", "B. a big problem", "C. a long way", "D. a hard lesson"], "answer": "A", "explain": "'a piece of cake' (dễ ợt) hợp nghĩa với 'not difficult'."}, {"type": "mcq", "level": "VDC", "q": "A: Do you like making pottery? B: ___", "options": ["A. Yes, I do. It is my favourite hobby.", "B. No, I do not like.", "C. Yes, I like.", "D. I like."], "answer": "A", "explain": "Câu trả lời đầy đủ, lịch sự và đúng ngữ pháp."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). My name is Lan. My hobby is gardening. Every morning, I water the flowers in our small garden. I also grow some vegetables like tomatoes and carrots. Gardening helps me relax after school.", "statements": ["a) Lan's hobby is gardening.", "b) She waters the flowers every evening.", "c) She grows vegetables in the garden.", "d) Gardening makes her tired."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: 'My hobby is gardening'. b) Sai: tưới hoa vào buổi sáng. c) Đúng: trồng cà chua và cà rốt. d) Sai: làm vườn giúp thư giãn (relax)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Jim wanted an unusual hobby. Last year, he started carving eggshells. It is very difficult because eggshells break easily. He practises for one hour every evening. Now his carved eggshells are famous in his town.", "statements": ["a) Jim's hobby is carving eggshells.", "b) Carving eggshells is easy.", "c) He practises every evening.", "d) People in his town know his carved eggshells."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: rất khó vì vỏ trứng dễ vỡ. c) Đúng: 'every evening'. d) Đúng: nổi tiếng trong thị trấn."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: I love ___ (read) comic books in my free time.", "answer": "reading", "explain": "love + V-ing."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: My sister is interested in ___ (carve) wooden statues.", "answer": "carving", "explain": "'be interested in' + V-ing."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ir' is pronounced differently from the others.", "options": ["A. bird", "B. girl", "C. first", "D. their"], "answer": "D", "explain": "bird, girl, first đọc /ɜː/; their đọc /eə/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. model", "B. unique", "C. fragile", "D. melody"], "answer": "B", "explain": "unique nhấn âm 2; các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "A ___ is a picture made by sticking photos and paper together.", "options": ["A. collage", "B. model", "C. statue", "D. melody"], "answer": "A", "explain": "collage (tranh ghép) là tranh dán ghép từ ảnh và giấy."}, {"type": "mcq", "level": "TH", "q": "She does not like ___ football. She prefers badminton.", "options": ["A. play", "B. playing", "C. to playing", "D. plays"], "answer": "B", "explain": "like + V-ing."}, {"type": "mcq", "level": "VD", "q": "Their collection of old coins is really ___. No one else has it.", "options": ["A. strange", "B. common", "C. unique", "D. fragile"], "answer": "C", "explain": "unique (độc đáo, có một không hai) hợp nghĩa."}, {"type": "mcq", "level": "VDC", "q": "A: Let us go bird-watching this weekend! B: ___", "options": ["A. That is a great idea!", "B. I do not know.", "C. See you then.", "D. Not at all."], "answer": "A", "explain": "Đáp lại lời rủ rê: 'That is a great idea!' (Ý hay đấy!)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Tom loves making models. He has a big collection of model planes and ships. He usually makes a new model every month. His models are on a shelf in his bedroom.", "statements": ["a) Tom's hobby is making models.", "b) He collects model cars.", "c) He makes a new model every month.", "d) His models are in the living room."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: 'Tom loves making models'. b) Sai: sưu tầm mô hình máy bay và tàu thủy. c) Đúng: 'every month'. d) Sai: để trên kệ trong phòng ngủ."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Mai finds gardening interesting, but her brother finds it boring. He prefers playing video games. Their mum loves flowers, so she often helps Mai in the garden. On Sundays, the whole family has lunch with fresh vegetables from the garden.", "statements": ["a) Mai likes gardening.", "b) Her brother also likes gardening.", "c) Their mum helps Mai in the garden.", "d) The family eats vegetables from their garden."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: 'finds gardening interesting'. b) Sai: em trai thấy chán (boring). c) Đúng: mẹ thường giúp Mai. d) Đúng: ăn rau tươi từ vườn."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: She ___ (arrange) flowers every Sunday.", "answer": "arranges", "explain": "'She' số ít, thì hiện tại đơn thêm -s."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She finds ___ (collect) stamps really exciting.", "answer": "collecting", "explain": "find + V-ing khi tân ngữ là một hành động."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ur' is pronounced differently from the others.", "options": ["A. hurt", "B. turn", "C. burn", "D. pure"], "answer": "D", "explain": "hurt, turn, burn đọc /ɜː/; pure đọc /ʊə/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. enjoy", "B. mountain", "C. flower", "D. eggshell"], "answer": "A", "explain": "enjoy nhấn âm 2; các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Be careful! The eggshell is very ___.", "options": ["A. strong", "B. fragile", "C. heavy", "D. thick"], "answer": "B", "explain": "fragile (dễ vỡ) hợp nghĩa với vỏ trứng."}, {"type": "mcq", "level": "TH", "q": "My mum ___ flowers every Sunday.", "options": ["A. arrange", "B. arranges", "C. arranging", "D. to arrange"], "answer": "B", "explain": "Chủ ngữ 'my mum' số ít, thì hiện tại đơn thêm -s."}, {"type": "mcq", "level": "VD", "q": "It is ___ to see snow in our town because it never snows here.", "options": ["A. usual", "B. unusual", "C. common", "D. normal"], "answer": "B", "explain": "unusual (khác thường, hiếm thấy) hợp nghĩa."}, {"type": "mcq", "level": "VDC", "q": "A: I find swimming boring. B: ___", "options": ["A. Really? I find it very interesting.", "B. Yes, I do.", "C. Me too.", "D. I do not."], "answer": "A", "explain": "B bày tỏ ý kiến trái ngược một cách lịch sự."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). My sister enjoys arranging flowers. She buys fresh flowers at the market every Sunday. Then she puts them in vases around the house. Our house always looks beautiful.", "statements": ["a) The sister's hobby is arranging flowers.", "b) She buys flowers every Sunday.", "c) She throws the flowers away.", "d) The house looks beautiful with the flowers."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: 'every Sunday'. c) Sai: cắm hoa vào lọ trang trí nhà. d) Đúng: 'Our house always looks beautiful'."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Horse-riding is an expensive hobby. You need special clothes and a helmet. You must also pay for the horse. However, many people love it because it is exciting and helps them enjoy nature.", "statements": ["a) Horse-riding is a cheap hobby.", "b) Riders need special clothes and a helmet.", "c) You do not have to pay for the horse.", "d) Many people love horse-riding."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: là sở thích đắt đỏ (expensive). b) Đúng. c) Sai: phải trả tiền thuê ngựa. d) Đúng: 'many people love it'."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: My hobby is ___. I grow roses and tulips in the garden.", "answer": "gardening", "explain": "gardening (làm vườn) là trồng hoa."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: Neither my parents nor my sister ___ (enjoy) bird-watching.", "answer": "enjoys", "explain": "'Neither...nor' chia động từ theo chủ ngữ gần nhất (my sister số ít)."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'er' is pronounced differently from the others.", "options": ["A. her", "B. learn", "C. teacher", "D. work"], "answer": "C", "explain": "her, learn, work đọc /ɜː/; teacher đọc /ə/ ở âm tiết không nhấn."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. forget", "B. remember", "C. water", "D. relax"], "answer": "C", "explain": "water nhấn âm 1; các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "My hobby is ___. I often go to the lake with my binoculars.", "options": ["A. bird-watching", "B. gardening", "C. cooking", "D. fishing"], "answer": "A", "explain": "bird-watching (ngắm chim) cần dùng ống nhòm (binoculars)."}, {"type": "mcq", "level": "TH", "q": "___ your sister like gardening?", "options": ["A. Do", "B. Does", "C. Is", "D. Are"], "answer": "B", "explain": "Chủ ngữ 'your sister' số ít nên câu hỏi dùng Does."}, {"type": "mcq", "level": "VD", "q": "The artist ___ the dragon from a block of wood.", "options": ["A. carved", "B. carves", "C. carving", "D. to carve"], "answer": "A", "explain": "Câu kể chuyện quá khứ nên dùng carved (chạm khắc)."}, {"type": "mcq", "level": "VDC", "q": "A: Would you like to join our gardening club? B: ___", "options": ["A. I would love to!", "B. I do not.", "C. Yes, I am.", "D. No, I like."], "answer": "A", "explain": "'I would love to!' là cách nhận lời mời lịch sự."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Bird-watching is my dad's hobby. He often goes to the park early in the morning. He watches birds with his binoculars. He can name more than fifty kinds of birds.", "statements": ["a) The father's hobby is bird-watching.", "b) He goes to the park in the evening.", "c) He uses binoculars to watch birds.", "d) He knows the names of many birds."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: đi vào buổi sáng sớm. c) Đúng: 'with his binoculars'. d) Đúng: biết tên hơn 50 loài chim."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Peter tried many hobbies. He tried swimming, but he found it boring. He tried collecting stamps, but he lost them all. Finally, he tried making models and he loves it. Now he spends all his free time on his models.", "statements": ["a) Peter loves swimming.", "b) He lost his stamp collection.", "c) His favourite hobby now is making models.", "d) He has no free time for hobbies."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: thấy bơi lội chán. b) Đúng: 'he lost them all'. c) Đúng: 'he loves it'. d) Sai: dành mọi thời gian rảnh cho mô hình."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: ___-watching is my dad's favourite hobby. He loves birds.", "answer": "Bird", "explain": "bird-watching (ngắm chim)."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: I have loved gardening ___ I was six years old.", "answer": "since", "explain": "'since' (từ khi) dùng với mốc thời gian."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'or' is pronounced differently from the others.", "options": ["A. word", "B. world", "C. work", "D. more"], "answer": "D", "explain": "word, world, work đọc /ɜː/; more đọc /ɔː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. hobby", "B. music", "C. unique", "D. model"], "answer": "C", "explain": "unique nhấn âm 2; các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "The ___ of this song is so beautiful.", "options": ["A. word", "B. melody", "C. picture", "D. colour"], "answer": "B", "explain": "melody (giai điệu) hợp nghĩa với bài hát."}, {"type": "mcq", "level": "TH", "q": "I find swimming ___.", "options": ["A. interest", "B. interested", "C. interesting", "D. interestingly"], "answer": "C", "explain": "find + something + adjective: interesting (thú vị)."}, {"type": "mcq", "level": "VD", "q": "He finds carving eggshells difficult, but the results are ___.", "options": ["A. boring", "B. amazing", "C. strange", "D. fragile"], "answer": "B", "explain": "amazing (tuyệt vời) hợp nghĩa: kết quả ấn tượng."}, {"type": "mcq", "level": "VDC", "q": "A: My hobby is quite unusual. B: ___", "options": ["A. Oh? Tell me more about it!", "B. I see.", "C. No problem.", "D. Good luck."], "answer": "A", "explain": "B tỏ ra quan tâm và muốn nghe thêm."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Anna likes ice-skating very much. She goes to the ice rink every Saturday. At first, she fell down many times. Now she can skate very well.", "statements": ["a) Anna's hobby is ice-skating.", "b) She goes skating every Sunday.", "c) She never fell down.", "d) Now she skates very well."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Sai: đi vào thứ Bảy. c) Sai: lúc đầu ngã nhiều lần. d) Đúng: 'Now she can skate very well'."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). My cousin learnt ice-skating when she was six. At first, learning to skate was not a piece of cake. She fell down and hurt her knees many times. But she did not give up. Now she is the best skater in her club.", "statements": ["a) The cousin started skating at six.", "b) Learning to skate was easy for her.", "c) She gave up after falling down.", "d) She is the best skater in her club now."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: 'when she was six'. b) Sai: 'not a piece of cake' (không dễ). c) Sai: không bỏ cuộc. d) Đúng."}, {"type": "short", "level": "NB", "q": "Give the correct form of the word in brackets: I find swimming ___. (interest)", "answer": "interesting", "explain": "find + something + adjective."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: She spends two hours a day ___ (practise) the piano.", "answer": "practising", "explain": "spend + V-ing."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ea' is pronounced differently from the others.", "options": ["A. learn", "B. earth", "C. heart", "D. heard"], "answer": "C", "explain": "learn, earth, heard đọc /ɜː/; heart đọc /ɑː/."}, {"type": "mcq", "level": "NB", "q": "My father likes ___ in the garden every morning.", "options": ["A. gardening", "B. swimming", "C. cooking", "D. reading"], "answer": "A", "explain": "gardening (làm vườn) hợp nghĩa với 'in the garden'."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. unusual", "B. around", "C. happen", "D. begin"], "answer": "C", "explain": "happen nhấn âm 1; các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "He loves ___ wooden statues with a knife.", "options": ["A. carve", "B. carving", "C. to carving", "D. carved"], "answer": "B", "explain": "love + V-ing; carve (chạm khắc) tượng gỗ."}, {"type": "mcq", "level": "VD", "q": "They hate ___ up early on Sundays.", "options": ["A. get", "B. to get", "C. getting", "D. got"], "answer": "C", "explain": "hate + V-ing."}, {"type": "mcq", "level": "VDC", "q": "A: Why do you like collecting stamps? B: ___", "options": ["A. Because it is interesting and relaxing.", "B. I do not know.", "C. Yes, I do.", "D. Twice a week."], "answer": "A", "explain": "Câu hỏi Why cần câu trả lời bắt đầu bằng Because."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). My brother's hobby is surfing. He lives near the beach. He goes surfing every weekend. He says surfing is exciting but sometimes dangerous.", "statements": ["a) The brother lives near the beach.", "b) His hobby is swimming.", "c) He goes surfing every weekend.", "d) He thinks surfing is boring."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: sở thích là lướt sóng (surfing). c) Đúng: 'every weekend'. d) Sai: thấy lướt sóng thú vị (exciting)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Arranging flowers is my mum's hobby, but it is not mine. I prefer something more active like mountain climbing. Last month, I climbed my first mountain with my uncle. It was tiring, but I felt very proud.", "statements": ["a) The writer's hobby is arranging flowers.", "b) The writer likes active hobbies.", "c) The writer climbed a mountain last month.", "d) The writer felt proud after climbing."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: cắm hoa là sở thích của mẹ. b) Đúng: thích hoạt động mạnh như leo núi. c) Đúng: 'Last month'. d) Đúng: 'I felt very proud'."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: They do not like ___ (play) chess.", "answer": "playing", "explain": "like + V-ing."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: ___ did she start making pottery? - Two years ago.", "answer": "When", "explain": "Câu trả lời chỉ thời gian nên hỏi bằng When."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'o' is pronounced differently from the others.", "options": ["A. collect", "B. forget", "C. orange", "D. occur"], "answer": "C", "explain": "collect, forget, occur đọc /ə/ ở âm tiết không nhấn; orange đọc /ɒ/."}, {"type": "mcq", "level": "NB", "q": "___ is a sport of riding a horse.", "options": ["A. Horse-riding", "B. Surfing", "C. Ice-skating", "D. Climbing"], "answer": "A", "explain": "Horse-riding (cưỡi ngựa) là môn thể thao cưỡi ngựa."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. arrange", "B. collect", "C. begin", "D. garden"], "answer": "D", "explain": "garden nhấn âm 1; các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "My brother spends hours ___ models of planes.", "options": ["A. making", "B. make", "C. to make", "D. makes"], "answer": "A", "explain": "spend + V-ing; making models (làm mô hình)."}, {"type": "mcq", "level": "VD", "q": "Do you find bird-watching ___?", "options": ["A. relax", "B. relaxed", "C. relaxing", "D. relaxation"], "answer": "C", "explain": "find + something + adjective: relaxing (thư giãn)."}, {"type": "mcq", "level": "VDC", "q": "My sister is interested in ___ pottery, but she dislikes ___ her hands dirty.", "options": ["A. making / getting", "B. to make / to get", "C. make / get", "D. making / to get"], "answer": "A", "explain": "'be interested in' + V-ing và 'dislike' + V-ing."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Mrs Brown loves making pottery. She learnt it from her grandmother. She makes beautiful vases and bowls. She often gives them to her friends as gifts.", "statements": ["a) Mrs Brown's hobby is making pottery.", "b) She learnt it from her mother.", "c) She makes vases and bowls.", "d) She sells her pottery products."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: học từ bà ngoại (grandmother). c) Đúng. d) Sai: tặng bạn bè làm quà, không bán."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Sharing hobbies with friends is wonderful. Lan and I both love bird-watching. Every spring, we go to the forest together. We take photos of rare birds and share them online. Our photos got a thousand likes last year.", "statements": ["a) Lan and the writer share the same hobby.", "b) They go bird-watching every winter.", "c) They share bird photos online.", "d) Their photos are popular."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: cùng thích ngắm chim. b) Sai: đi vào mùa xuân. c) Đúng: 'share them online'. d) Đúng: được một nghìn lượt thích."}, {"type": "short", "level": "NB", "q": "Give the correct form of the word in brackets: Be careful! The vase is ___. (fragile)", "answer": "fragile", "explain": "fragile (dễ vỡ)."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: I find it difficult ___ learn ice-skating.", "answer": "to", "explain": "Cấu trúc 'find it + adjective + to V'."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ou' is pronounced differently from the others.", "options": ["A. around", "B. about", "C. young", "D. sound"], "answer": "C", "explain": "around, about, sound đọc /aʊ/; young đọc /ʌ/."}, {"type": "mcq", "level": "NB", "q": "We should ___ our toys with poor children.", "options": ["A. keep", "B. share", "C. sell", "D. break"], "answer": "B", "explain": "share (chia sẻ) hợp nghĩa: chia sẻ đồ chơi với trẻ em nghèo."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. interesting", "B. pottery", "C. banana", "D. around"], "answer": "D", "explain": "around nhấn âm 2; các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Do you want to go ___ this weekend?", "options": ["A. mountain climbing", "B. mountain climb", "C. climb mountain", "D. climbing mountain"], "answer": "A", "explain": "mountain climbing (leo núi) là cụm danh từ đúng."}, {"type": "mcq", "level": "VD", "q": "She finds ___ models boring.", "options": ["A. make", "B. making", "C. to make", "D. made"], "answer": "B", "explain": "find + V-ing khi tân ngữ là một hành động: making models."}, {"type": "mcq", "level": "VDC", "q": "Neither my dad nor my mum ___ my hobby of collecting dolls.", "options": ["A. like", "B. likes", "C. liking", "D. to like"], "answer": "B", "explain": "'Neither...nor' chia động từ theo chủ ngữ gần nhất ('my mum' số ít)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). We like playing board games on rainy days. My favourite game is chess. My sister likes playing cards. Board games help our family spend time together.", "statements": ["a) The family plays board games on rainy days.", "b) Chess is the writer's favourite game.", "c) The sister likes playing chess.", "d) Board games bring the family together."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: 'My favourite game is chess'. c) Sai: em gái thích chơi bài (cards). d) Đúng: giúp gia đình quây quần."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). My dad's collection is unique. He collects old board games from many countries. Some games are more than a hundred years old. He never plays with them because they are too fragile. He just keeps them in glass boxes.", "statements": ["a) The dad collects new board games.", "b) His collection comes from many countries.", "c) Some games are very old.", "d) He keeps the games in glass boxes because they break easily."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: sưu tầm cờ bàn cũ (old). b) Đúng: 'from many countries'. c) Đúng: hơn 100 năm tuổi. d) Đúng: dễ vỡ (fragile) nên để trong hộp kính."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: ___ he enjoy listening to music? - Yes, he does.", "answer": "Does", "explain": "Câu hỏi hiện tại đơn với chủ ngữ số ít dùng Does."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: Hardly anyone in my class ___ (enjoy) mountain climbing.", "answer": "enjoys", "explain": "'Hardly anyone' được coi như chủ ngữ số ít."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'e' is pronounced differently from the others.", "options": ["A. happen", "B. listen", "C. seven", "D. these"], "answer": "D", "explain": "happen, listen, seven đọc /ə/ ở âm tiết không nhấn; these đọc /iː/."}, {"type": "mcq", "level": "NB", "q": "My grandmother's hobby is ___. Her roses are beautiful.", "options": ["A. cooking", "B. gardening", "C. singing", "D. dancing"], "answer": "B", "explain": "gardening (làm vườn) hợp nghĩa với trồng hoa hồng."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. bird-watching", "B. gardening", "C. arrange", "D. flower"], "answer": "C", "explain": "arrange nhấn âm 2; các từ còn lại nhấn âm tiết đầu."}, {"type": "mcq", "level": "TH", "q": "What a ___ noise! I have never heard it before.", "options": ["A. nice", "B. loud", "C. strange", "D. sweet"], "answer": "C", "explain": "strange (lạ) hợp nghĩa: tiếng động lạ chưa từng nghe."}, {"type": "mcq", "level": "VD", "q": "My dad enjoys ___ the guitar after dinner.", "options": ["A. play", "B. playing", "C. to play", "D. played"], "answer": "B", "explain": "enjoy + V-ing."}, {"type": "mcq", "level": "VDC", "q": "My brother finds collecting coins ___ hobby.", "options": ["A. an interested", "B. an interesting", "C. interest", "D. interestingly"], "answer": "B", "explain": "find + something + adjective; 'hobby' đếm được số ít nên dùng 'an'."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). My grandpa enjoys mountain climbing. Although he is 65, he is very strong. He climbs with his friends twice a year. He says climbing keeps him healthy.", "statements": ["a) The grandpa's hobby is mountain climbing.", "b) He is 56 years old.", "c) He climbs twice a year.", "d) Climbing keeps him healthy."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: ông 65 tuổi. c) Đúng: 'twice a year'. d) Đúng: 'climbing keeps him healthy'."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Melody is important in music. A beautiful melody can make people happy or sad. My sister is learning to write melodies for songs. She spends hours trying different notes on her piano. Her teacher says she has a talent for music.", "statements": ["a) A melody can change people's feelings.", "b) The sister is learning to sing.", "c) She practises on the piano.", "d) Her teacher thinks she is talented."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: giai điệu làm người ta vui hoặc buồn. b) Sai: đang học viết giai điệu. c) Đúng: thử nốt nhạc trên piano. d) Đúng: 'she has a talent for music'."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Making pottery is a ___ of cake for her. It is very easy.", "answer": "piece", "explain": "'a piece of cake' (dễ ợt)."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: What ___ your brother do in his free time? - He surfs.", "answer": "does", "explain": "Câu hỏi hiện tại đơn, chủ ngữ 'your brother' số ít."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. arrive", "B. banana", "C. father", "D. around"], "answer": "C", "explain": "arrive, banana, around đọc /ə/ ở âm tiết không nhấn; father đọc /ɑː/ ở âm tiết nhấn."}, {"type": "mcq", "level": "NB", "q": "___ is sliding on ice with special boots.", "options": ["A. Surfing", "B. Ice-skating", "C. Climbing", "D. Fishing"], "answer": "B", "explain": "Ice-skating (trượt băng) là trượt trên băng."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. forget", "B. enjoy", "C. happen", "D. collect"], "answer": "C", "explain": "happen nhấn âm 1; các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "___ is my favourite water sport. I love the waves.", "options": ["A. Surfing", "B. Swimming", "C. Fishing", "D. Skating"], "answer": "A", "explain": "surfing (lướt sóng) là môn thể thao với sóng biển."}, {"type": "mcq", "level": "VD", "q": "He does not enjoy ___ chess because he finds it boring.", "options": ["A. play", "B. to play", "C. playing", "D. plays"], "answer": "C", "explain": "enjoy + V-ing."}, {"type": "mcq", "level": "VDC", "q": "She loves gardening, ___ she does not like getting up early to water the plants.", "options": ["A. and", "B. but", "C. so", "D. because"], "answer": "B", "explain": "Hai ý trái ngược nhau nên dùng 'but' (nhưng)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Linda loves making collages. She cuts pictures from old magazines. Then she sticks them on large pieces of paper. Her bedroom wall is full of colourful collages.", "statements": ["a) Linda's hobby is making collages.", "b) She cuts pictures from newspapers.", "c) She sticks pictures on large paper.", "d) Her collages are colourful."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: cắt từ tạp chí cũ (magazines). c) Đúng. d) Đúng: 'colourful collages'."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Tom wanted to impress his friends, so he said his hobby was surfing. In fact, he had never surfed in his life. Last weekend, his friends took him to the beach. He fell off the board again and again, and everyone laughed, including Tom.", "statements": ["a) Tom's real hobby was surfing.", "b) Tom had never surfed before last weekend.", "c) He surfed very well at the beach.", "d) Tom also laughed at himself."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: chỉ nói vậy để gây ấn tượng. b) Đúng: 'never surfed in his life'. c) Sai: ngã khỏi ván liên tục. d) Đúng: 'including Tom'."}, {"type": "short", "level": "NB", "q": "Give the correct form of the word in brackets: My brother is ___ in collecting stamps. (interest)", "answer": "interested", "explain": "'be interested in' (thích, quan tâm)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: His hobby is quite ___. Nobody else does it. (unusual)", "answer": "unusual", "explain": "Sau 'quite' cần tính từ: unusual (khác thường)."}]}]}</script>
