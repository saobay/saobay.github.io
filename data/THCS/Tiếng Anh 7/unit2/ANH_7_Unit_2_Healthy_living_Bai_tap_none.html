hers.", "options": ["A. vitamin", "B. energy", "C. obesity", "D. allergy"], "answer": "C", "explain": "obesity nhấn âm 2; các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Eating too much sugar can ___ your health.", "options": ["A. affect", "B. effect", "C. help", "D. improve"], "answer": "A", "explain": "affect (ảnh hưởng đến) sức khỏe."}, {"type": "mcq", "level": "VD", "q": "___ eat too much candy!", "options": ["A. Not", "B. Don't", "C. Doesn't", "D. No"], "answer": "B", "explain": "Câu mệnh lệnh phủ định: Don't + động từ nguyên thể."}, {"type": "mcq", "level": "VDC", "q": "Mum: Do not read in dim light! Son: ___", "options": ["A. OK, Mum. I will turn on the lamp.", "B. I like it.", "C. No, thanks.", "D. I will not not."], "answer": "A", "explain": "Đáp lại lời nhắc của mẹ một cách lễ phép."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Reading in dim light is bad for your eyes. Your eyes have to work too hard. Always turn on the lamp when you read at night. Your eyes will thank you.", "statements": ["a) Reading in dim light is bad for the eyes.", "b) You should turn on the lamp when reading at night.", "c) Dim light is good for the eyes.", "d) The passage gives advice about eyes."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: ánh sáng mờ có hại cho mắt. d) Đúng: đoạn văn đưa lời khuyên về mắt."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Sunburn is painful and dangerous. Last summer, Tom played beach volleyball all day without suncream. In the evening, his skin was red and hurt a lot. He learnt that suncream is necessary in summer.", "statements": ["a) Tom used suncream at the beach.", "b) He got sunburn.", "c) Sunburn is not dangerous.", "d) He learnt to use suncream."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: không dùng kem chống nắng. b) Đúng: da đỏ và đau. c) Sai: cháy nắng nguy hiểm. d) Đúng."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Do not read in ___ light. It is bad for your eyes. (dim)", "answer": "dim", "explain": "dim light (ánh sáng mờ)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: Lack of sleep ___ your memory. (affect)", "answer": "affects", "explain": "Chủ ngữ 'Lack of sleep' số ít nên động từ thêm -s."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'v/ph' is pronounced differently from the others.", "options": ["A. move", "B. love", "C. phone", "D. above"], "answer": "C", "explain": "phone đọc /f/; các từ còn lại đọc /v/."}, {"type": "mcq", "level": "NB", "q": "We should drink water, not ___.", "options": ["A. milk", "B. soft drinks", "C. juice", "D. tea"], "answer": "B", "explain": "soft drinks (nước ngọt) không tốt bằng nước lọc."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. affect", "B. avoid", "C. begin", "D. tofu"], "answer": "D", "explain": "tofu nhấn âm 1; các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "Do not read in ___. It is bad for your eyes.", "options": ["A. bright light", "B. sunlight", "C. dim light", "D. daylight"], "answer": "C", "explain": "dim light (ánh sáng mờ) có hại cho mắt."}, {"type": "mcq", "level": "VD", "q": "To keep fit, you should ___ more exercise.", "options": ["A. do", "B. doing", "C. to do", "D. does"], "answer": "A", "explain": "should + động từ nguyên thể."}, {"type": "mcq", "level": "VDC", "q": "___ more fruit is good, but ___ too much candy is bad.", "options": ["A. Eat / eat", "B. Eating / eating", "C. To eat / to eat", "D. Eats / eats"], "answer": "B", "explain": "Danh động từ (V-ing) làm chủ ngữ câu."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Vitamins keep our bodies strong. Fruit and vegetables have many vitamins. An orange gives you vitamin C. A carrot gives you vitamin A for good eyes.", "statements": ["a) Vitamins keep our bodies strong.", "b) Fruit has no vitamins.", "c) Oranges give vitamin C.", "d) Carrots are good for the eyes."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: trái cây có nhiều vitamin. c) Đúng. d) Đúng: vitamin A tốt cho mắt."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Energy comes from food. If you skip breakfast, you will feel tired at school. A good breakfast gives you energy for the whole morning. Never skip breakfast before an exam.", "statements": ["a) Food gives us energy.", "b) Skipping breakfast makes you feel well.", "c) Breakfast gives energy for the morning.", "d) You should eat breakfast before an exam."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: bỏ bữa sáng sẽ mệt. c) Đúng. d) Đúng: 'Never skip breakfast before an exam'."}, {"type": "short", "level": "NB", "q": "Give the correct form of the word in brackets: She has an ___ to peanuts. (allergic)", "answer": "allergy", "explain": "'an allergy to' (dị ứng với)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: If you want to lose ___, eat less and move more. (weigh)", "answer": "weight", "explain": "lose weight (giảm cân)."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'f/v' is pronounced differently from the others.", "options": ["A. safe", "B. save", "C. leaf", "D. life"], "answer": "B", "explain": "save đọc /v/; các từ còn lại đọc /f/."}, {"type": "mcq", "level": "NB", "q": "Oranges are rich in ___ C.", "options": ["A. vitamin", "B. energy", "C. water", "D. sugar"], "answer": "A", "explain": "Cam giàu vitamin C."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. energy", "B. vitamin", "C. allergy", "D. avoid"], "answer": "D", "explain": "avoid nhấn âm 2; các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "___ are small red marks on the skin.", "options": ["A. Red spots", "B. Vitamins", "C. Vegetables", "D. Fruits"], "answer": "A", "explain": "red spots (mụn đỏ, đốm đỏ) trên da."}, {"type": "mcq", "level": "VD", "q": "Which sentence is an imperative with 'less'?", "options": ["A. You should eat less sugar.", "B. Eat less sugar!", "C. He eats less sugar.", "D. Eating less sugar is good."], "answer": "B", "explain": "Câu mệnh lệnh bắt đầu bằng động từ: Eat less sugar!"}, {"type": "mcq", "level": "VDC", "q": "Which sentence is correct?", "options": ["A. Avoid to eat fast food.", "B. Avoid eating fast food.", "C. Avoid eat fast food.", "D. Avoids eating fast food."], "answer": "B", "explain": "avoid + V-ing."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). My grandma is 70, but she is very active. She walks in the park every evening. She also does morning exercise with her friends. She says an active life keeps her young.", "statements": ["a) The grandma is 70 years old.", "b) She is very lazy.", "c) She walks in the park every evening.", "d) She thinks an active life is good."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: bà rất năng động (active). c) Đúng. d) Đúng: 'an active life keeps her young'."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). My mum says coloured vegetables are like medicine from nature. Red tomatoes are good for the heart. Orange carrots are good for the eyes. Green vegetables give us lots of vitamins. We eat them every day.", "statements": ["a) Coloured vegetables are good for health.", "b) Tomatoes are good for the heart.", "c) Carrots are good for the eyes.", "d) The family never eats vegetables."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ăn rau mỗi ngày."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: ___ less TV and go out more! (Watch)", "answer": "Watch", "explain": "Câu mệnh lệnh: Watch less TV."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: He was absent because of a serious ___. (ill)", "answer": "illness", "explain": "Danh từ của ill là illness (cơn bệnh, sự ốm)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'f/v' is pronounced differently from the others.", "options": ["A. fever", "B. fit", "C. offer", "D. avoid"], "answer": "D", "explain": "avoid đọc /v/; các từ còn lại đọc /f/."}, {"type": "mcq", "level": "NB", "q": "He goes jogging every day to keep ___.", "options": ["A. fit", "B. fat", "C. thin", "D. ill"], "answer": "A", "explain": "keep fit (giữ dáng cân đối, khỏe mạnh)."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. diet", "B. tofu", "C. breakfast", "D. avoid"], "answer": "D", "explain": "avoid nhấn âm 2; các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "A balanced ___ keeps you healthy.", "options": ["A. meal", "B. food", "C. breakfast", "D. diet"], "answer": "D", "explain": "diet (chế độ ăn) cân bằng giữ cho bạn khỏe mạnh."}, {"type": "mcq", "level": "VD", "q": "___ in dim light. It is bad for your eyes.", "options": ["A. Read", "B. Don't read", "C. Reading", "D. To read"], "answer": "B", "explain": "Câu mệnh lệnh phủ định: Don't read."}, {"type": "mcq", "level": "VDC", "q": "My skin condition got better after I ___ less soft drinks.", "options": ["A. drink", "B. drank", "C. drinking", "D. to drink"], "answer": "B", "explain": "Sau 'after' dùng mệnh đề quá khứ: drank."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Obesity is a big problem for many teenagers. They eat too much fast food and drink too much soda. They also sit all day playing video games. Doctors advise them to do more exercise.", "statements": ["a) Obesity is a problem for many teenagers.", "b) Teenagers eat too much fast food.", "c) Video games help them lose weight.", "d) Doctors advise more exercise."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: ngồi chơi game cả ngày gây béo phì. d) Đúng."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Staying up late affects your health more than you think. Students who sleep less than six hours often feel tired and cannot remember lessons well. Going to bed early is a simple way to stay healthy.", "statements": ["a) Lack of sleep affects health.", "b) Students who sleep little remember lessons well.", "c) Going to bed early is good.", "d) Sleep is not important for students."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: 'affects your health'. b) Sai: 'cannot remember lessons well'. c) Đúng. d) Sai: giấc ngủ rất quan trọng."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Tofu is made from ___. (soy)", "answer": "soybeans", "explain": "tofu (đậu phụ) làm từ đậu nành (soybeans)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: ___ in the sun too long causes sunburn. (Stay)", "answer": "Staying", "explain": "V-ing làm chủ ngữ câu."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'f/v' is pronounced differently from the others.", "options": ["A. over", "B. oven", "C. offer", "D. ever"], "answer": "C", "explain": "offer đọc /f/; các từ còn lại đọc /v/."}, {"type": "mcq", "level": "NB", "q": "She has an ___ because she ate seafood.", "options": ["A. allergy", "B. energy", "C. diet", "D. vitamin"], "answer": "A", "explain": "allergy (dị ứng) khi ăn hải sản."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. affect", "B. avoid", "C. forget", "D. water"], "answer": "D", "explain": "water nhấn âm 1; các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "She uses ___ to keep her lips soft.", "options": ["A. suncream", "B. lip balm", "C. soap", "D. water"], "answer": "B", "explain": "lip balm (son dưỡng môi) giữ cho môi mềm."}, {"type": "mcq", "level": "VD", "q": "'She runs every morning.' The sentence pattern is ___.", "options": ["A. S+V", "B. S+V+O", "C. S+V+A", "D. S+V+O+A"], "answer": "C", "explain": "She (S) + runs (V) + every morning (A - trạng ngữ chỉ thời gian)."}, {"type": "mcq", "level": "VDC", "q": "Choose the sentence with the pattern S+V+A.", "options": ["A. She likes apples.", "B. They run fast.", "C. We eat rice.", "D. He is a doctor."], "answer": "B", "explain": "They (S) + run (V) + fast (A - trạng từ)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). A balanced diet means eating the right food, not too much or too little. Eat more vegetables and fruit. Eat less sugar and salt. Drink enough water every day.", "statements": ["a) A balanced diet means eating the right amount of food.", "b) You should eat more vegetables and fruit.", "c) You should eat more sugar.", "d) Drinking enough water is good."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: nên ăn ít đường (less sugar). d) Đúng."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). My dad gave up smoking last year. He also started walking to work instead of driving. He eats less meat and more vegetables now. He says he feels ten years younger.", "statements": ["a) The dad still smokes.", "b) He walks to work now.", "c) He eats more vegetables.", "d) He feels younger."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: đã bỏ thuốc (gave up). b) Đúng: 'walking to work'. c) Đúng. d) Đúng: 'feels ten years younger'."}, {"type": "short", "level": "NB", "q": "Give the correct form of the word in brackets: He goes jogging every day to keep ___. (fitness)", "answer": "fit", "explain": "keep fit (giữ dáng cân đối)."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: My mum told me ___ more water every day. (drink)", "answer": "to drink", "explain": "'tell somebody to V' (bảo ai làm gì)."}]}]}</script>
