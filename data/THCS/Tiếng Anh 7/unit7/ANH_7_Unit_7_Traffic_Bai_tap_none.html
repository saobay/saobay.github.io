.", "options": ["A. pavement", "B. cycle lane", "C. zebra crossing", "D. station"], "answer": "B", "explain": "Cycle lane là làn đường dành riêng cho xe đạp."}, {"type": "mcq", "level": "VD", "q": "The red ___ on the road warns drivers to slow down.", "options": ["A. sign", "B. light", "C. jam", "D. lane"], "answer": "A", "explain": "Road sign là biển báo đường bộ, cảnh báo tài xế."}, {"type": "mcq", "level": "NB", "q": "My uncle often travels by ___ because it is the fastest way.", "options": ["A. bike", "B. plane", "C. boat", "D. bus"], "answer": "B", "explain": "Plane (máy bay) là phương tiện nhanh nhất."}, {"type": "mcq", "level": "VDC", "q": "___ is a general word for cars, buses, trains and planes.", "options": ["A. Means of transport", "B. Traffic jam", "C. Road sign", "D. Cycle lane"], "answer": "A", "explain": "Means of transport là phương tiện giao thông nói chung."}, {"type": "mcq", "level": "VD", "q": "The police will ___ you if you park your car in the wrong place.", "options": ["A. obey", "B. fine", "C. sail", "D. break"], "answer": "B", "explain": "Fine còn là động từ: phạt tiền ai đó."}, {"type": "mcq", "level": "VDC", "q": "Running a red light is one way to ___.", "options": ["A. obey the law", "B. break the law", "C. follow the sign", "D. keep the rule"], "answer": "B", "explain": "Vượt đèn đỏ là vi phạm luật (break the law)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide True (T) or False (F).\n\nLast Sunday, Lan's family sailed to a small island. It is about 10 kilometres from the port. The trip took 30 minutes. They had a picnic and swam in the sea.", "statements": ["Lan's family went to the island by boat.", "The island is 10 kilometres from the port.", "The trip took one hour.", "They swam in the sea."], "answer": ["T", "T", "F", "T"], "explain": "Gia đình Lan đi thuyền (sail), đảo cách cảng 10 km, chuyến đi mất 30 phút (không phải 1 giờ), họ đã bơi."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide True (T) or False (F).\n\nBreaking traffic laws can cause accidents. Last year, many accidents happened because drivers did not obey the lights. The police fined them a lot of money. Everyone should drive carefully.", "statements": ["Breaking the law is safe.", "Many accidents were caused by bad driving.", "The police fined careless drivers.", "People should drive carefully."], "answer": ["F", "T", "T", "T"], "explain": "Vi phạm luật không an toàn; nhiều tai nạn do không tuân thủ đèn; cảnh sát phạt tiền; mọi người nên lái xe cẩn thận."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE word: Cross the road at the zebra ___ to be safe.", "answer": "crossing", "explain": "Zebra crossing là vạch sang đường cho người đi bộ."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE word: A ___ lane is only for bicycles.", "answer": "cycle", "explain": "Cycle lane là làn đường dành riêng cho xe đạp."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "___ is about 3 kilometres from my house to school.", "options": ["A. It", "B. That", "C. This", "D. There"], "answer": "A", "explain": "Cấu trúc nói khoảng cách: It is about + khoảng cách + from... to..."}, {"type": "mcq", "level": "NB", "q": "___ far is it from here to the bus stop?", "options": ["A. How", "B. What", "C. Where", "D. When"], "answer": "A", "explain": "Hỏi khoảng cách dùng How far is it from... to...?"}, {"type": "mcq", "level": "NB", "q": "You ___ wear a helmet when riding a motorbike.", "options": ["A. should", "B. shouldn't", "C. will", "D. would"], "answer": "A", "explain": "Should + V nguyên thể dùng để khuyên nên làm gì."}, {"type": "mcq", "level": "TH", "q": "It ___ about 5 kilometres from the station to my village.", "options": ["A. are", "B. be", "C. is", "D. were"], "answer": "C", "explain": "Chủ ngữ It đi với động từ is."}, {"type": "mcq", "level": "TH", "q": "How far ___ it from your house to school?", "options": ["A. is", "B. are", "C. do", "D. does"], "answer": "A", "explain": "Câu hỏi How far is it from... to...?"}, {"type": "mcq", "level": "TH", "q": "Drivers ___ use mobile phones while driving.", "options": ["A. should", "B. shouldn't", "C. will", "D. can"], "answer": "B", "explain": "Shouldn't + V dùng để khuyên không nên làm gì nguy hiểm."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide True (T) or False (F).\n\nThe cycle lane in our town is new and safe. Many students ride their bikes to school on it. Cars are not allowed to use the cycle lane. Parents feel happy about this.", "statements": ["The cycle lane is old and dangerous.", "Students use it to go to school.", "Cars can also use the cycle lane.", "Parents are happy about the cycle lane."], "answer": ["F", "T", "F", "T"], "explain": "Làn xe đạp mới và an toàn (không cũ nguy hiểm), học sinh dùng đi học, ô tô không được dùng, phụ huynh hài lòng."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide True (T) or False (F).\n\nMr Hai takes the train to work because it is cheap and fast. The station is 2 kilometres from his house. He walks there in 20 minutes. The train ride takes 15 minutes.", "statements": ["Mr Hai goes to work by train.", "The station is far from his house.", "He walks to the station.", "The train ride is 15 minutes long."], "answer": ["T", "F", "T", "T"], "explain": "Ông Hải đi tàu, ga cách nhà 2 km (không xa), ông đi bộ đến ga, chuyến tàu mất 15 phút."}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: You should (wear) ___ a seatbelt in the car.", "answer": "wear", "explain": "Sau should là động từ nguyên thể không to."}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: It (take) ___ 15 minutes to walk to school.", "answer": "takes", "explain": "Cấu trúc It takes + thời gian: chủ ngữ It nên động từ thêm s."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "We ___ cross the road at the zebra crossing.", "options": ["A. should", "B. shouldn't", "C. mustn't to", "D. don't"], "answer": "A", "explain": "Should + V nguyên thể: nên sang đường ở vạch dành cho người đi bộ."}, {"type": "mcq", "level": "VD", "q": "It is ___ 500 metres from here to the library.", "options": ["A. about", "B. on", "C. at", "D. in"], "answer": "A", "explain": "About nghĩa là khoảng, dùng khi không chắc con số chính xác."}, {"type": "mcq", "level": "VD", "q": "You ___ talk to the driver while he is driving. It is dangerous.", "options": ["A. should", "B. shouldn't", "C. will", "D. shall"], "answer": "B", "explain": "Không nên nói chuyện với tài xế khi đang lái xe."}, {"type": "mcq", "level": "VD", "q": "How far is it ___ your house ___ school?", "options": ["A. from - to", "B. to - from", "C. of - to", "D. from - and"], "answer": "A", "explain": "Cấu trúc: How far is it from A to B?"}, {"type": "mcq", "level": "NB", "q": "It is about 2 kilometres ___ my house ___ school.", "options": ["A. from - to", "B. to - from", "C. of - to", "D. between - and"], "answer": "A", "explain": "Cấu trúc: It is about + khoảng cách + from A to B."}, {"type": "mcq", "level": "TH", "q": "Children ___ play football on the busy road.", "options": ["A. should", "B. shouldn't", "C. will", "D. shall"], "answer": "B", "explain": "Không nên chơi bóng trên đường đông xe."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nIn big cities, traffic jams happen every day at rush hour. People lose a lot of time on the road. Some cities build more cycle lanes to reduce traffic. Riding a bike is good for health and the environment.", "statements": ["Traffic jams never happen in big cities.", "People waste time in traffic jams.", "Cycle lanes can help reduce traffic.", "Cycling is good for health."], "answer": ["F", "T", "T", "T"], "explain": "Tắc đường xảy ra hàng ngày ở thành phố lớn (không phải không bao giờ), mất nhiều thời gian, làn xe đạp giúp giảm tắc, đạp xe tốt cho sức khỏe."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nA seatbelt can save your life in an accident. However, many people forget to wear it on short trips. The law says every passenger must fasten their seatbelt. Breaking this rule means paying a fine.", "statements": ["Seatbelts are useful in accidents.", "People always remember seatbelts on short trips.", "The law requires seatbelts for all passengers.", "You may pay a fine without a seatbelt."], "answer": ["T", "F", "T", "T"], "explain": "Dây an toàn cứu mạng khi tai nạn, nhiều người quên thắt trên quãng đường ngắn (không phải luôn nhớ), luật bắt buộc mọi hành khách thắt, vi phạm bị phạt."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Driving too fast is (danger) ___.", "answer": "dangerous", "explain": "Sau is cần tính từ: dangerous (nguy hiểm)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: You should (obedient) ___ the traffic lights.", "answer": "obey", "explain": "Sau should cần động từ: obedient (adj) chuyển thành obey (v) tuân thủ."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VD", "q": "We ___ obey the road signs to avoid accidents.", "options": ["A. should", "B. shouldn't", "C. will not", "D. don't"], "answer": "A", "explain": "Should + V: nên tuân thủ biển báo để tránh tai nạn."}, {"type": "mcq", "level": "VDC", "q": "It is 10 kilometres from Ha Noi to the airport, ___ it takes about 30 minutes by car.", "options": ["A. and", "B. but", "C. so", "D. because"], "answer": "A", "explain": "Hai mệnh đề bổ sung ý nghĩa cho nhau, dùng and."}, {"type": "mcq", "level": "VDC", "q": "You ___ cross the road when the light is red, ___ you may have an accident.", "options": ["A. should - and", "B. shouldn't - or", "C. should - but", "D. shouldn't - so"], "answer": "B", "explain": "Không nên sang đường khi đèn đỏ, nếu không có thể gặp tai nạn."}, {"type": "mcq", "level": "VD", "q": "She ___ ride a bike without a helmet. It is not safe.", "options": ["A. should", "B. shouldn't", "C. will", "D. does"], "answer": "B", "explain": "Shouldn't + V: không nên đi xe đạp mà không đội mũ bảo hiểm."}, {"type": "mcq", "level": "VDC", "q": "It ___ about 20 minutes to get to school by bike.", "options": ["A. takes", "B. take", "C. taking", "D. is taking"], "answer": "A", "explain": "Cấu trúc It takes + thời gian + to V: mất bao lâu để làm gì."}, {"type": "mcq", "level": "VDC", "q": "___ should I do to stay safe on the road?", "options": ["A. What", "B. How far", "C. Where", "D. When"], "answer": "A", "explain": "What should I do...? Hỏi lời khuyên nên làm gì."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nThe plane from Ha Noi to Ho Chi Minh City takes about 2 hours. It is much faster than the train, which takes more than 30 hours. However, plane tickets are more expensive. Many people still choose the train to save money.", "statements": ["The flight takes about 2 hours.", "The train is faster than the plane.", "Plane tickets cost more than train tickets.", "Some people take the train to save money."], "answer": ["T", "F", "T", "T"], "explain": "Chuyến bay mất 2 giờ, tàu chậm hơn máy bay (không nhanh hơn), vé máy bay đắt hơn, nhiều người đi tàu để tiết kiệm."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nPavements are for people on foot, not for motorbikes. In some places, motorbikes ride on pavements to avoid traffic jams. This is against the law and very dangerous for walkers. The police are trying to stop this.", "statements": ["Pavements are for walkers.", "Motorbikes may ride on pavements legally.", "Riding on pavements is dangerous.", "The police want to stop this behaviour."], "answer": ["T", "F", "T", "T"], "explain": "Vỉa hè dành cho người đi bộ, xe máy đi trên vỉa hè là vi phạm (không hợp pháp), rất nguy hiểm, cảnh sát đang ngăn chặn."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: The plane will ___ at 8 a.m. tomorrow.", "answer": "fly", "explain": "Fly là bay; máy bay sẽ bay lúc 8 giờ sáng mai."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She (go) ___ to school by bus every day.", "answer": "goes", "explain": "Thì hiện tại đơn với she, động từ thêm es."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Nam: How far is it from your house to school? - Lan: ___", "options": ["A. About 2 kilometres.", "B. By bike.", "C. At 7 a.m.", "D. It's near my house."], "answer": "A", "explain": "Hỏi khoảng cách (How far) thì trả lời bằng khoảng cách."}, {"type": "mcq", "level": "VD", "q": "Mai: You should wear a helmet. - Hung: ___", "options": ["A. Thanks, I will.", "B. What a pity.", "C. Good luck.", "D. Never mind."], "answer": "A", "explain": "Đáp lại lời khuyên một cách lịch sự: cảm ơn và đồng ý."}, {"type": "mcq", "level": "TH", "q": "A: Excuse me, how can I get to the station? - B: ___", "options": ["A. Go straight and turn left.", "B. It's 2 kilometres.", "C. By train.", "D. At 8 o'clock."], "answer": "A", "explain": "Hỏi đường thì trả lời bằng cách chỉ đường."}, {"type": "mcq", "level": "VD", "q": "Tom: I was late because of the traffic jam. - Jerry: ___", "options": ["A. What a pity!", "B. Congratulations!", "C. Good idea!", "D. Never mind it."], "answer": "A", "explain": "Tỏ ra thông cảm với chuyện không may: What a pity!"}, {"type": "mcq", "level": "VDC", "q": "Lan: Should we walk to school today? - Hoa: ___", "options": ["A. Good idea! It's a nice day.", "B. I'm afraid I can't.", "C. No, thanks.", "D. See you later."], "answer": "A", "explain": "Đồng ý với lời đề nghị một cách tích cực."}, {"type": "mcq", "level": "VDC", "q": "Minh: The traffic lights are red. - An: ___", "options": ["A. Let's stop and wait.", "B. Let's go quickly.", "C. Hurry up.", "D. No problem."], "answer": "A", "explain": "Đèn đỏ thì phải dừng lại chờ, đó là luật giao thông."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nRoad signs use pictures so everyone can understand them. A red circle usually means something is not allowed. A blue circle gives a positive order, like turn left. Learning road signs helps you travel safely.", "statements": ["Road signs use pictures.", "A red circle means you must do something.", "A blue circle gives an order.", "Road signs help people travel safely."], "answer": ["T", "F", "T", "T"], "explain": "Biển báo dùng hình ảnh, vòng tròn đỏ là cấm (không phải bắt buộc làm), vòng tròn xanh là hiệu lệnh, học biển báo giúp đi lại an toàn."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nIt is about 1,700 kilometres from Ha Noi to Ho Chi Minh City. Going by plane takes 2 hours, but going by train takes over 30 hours. Despite the long time, train travel lets you see beautiful views along the way.", "statements": ["The distance is about 1,700 kilometres.", "The plane is slower than the train.", "Train travel takes more than 30 hours.", "You can enjoy views on the train."], "answer": ["T", "F", "T", "T"], "explain": "Khoảng cách khoảng 1.700 km, máy bay nhanh hơn tàu (không chậm hơn), đi tàu mất hơn 30 giờ, ngắm cảnh đẹp trên tàu."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: How far is it ___ your village to the town?", "answer": "from", "explain": "Cấu trúc How far is it from A to B?"}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The (drive) ___ must stop at the red light.", "answer": "driver", "explain": "Cần danh từ chỉ người: driver (tài xế)."}]}]}</script>
