 is pronounced differently from the others.", "options": ["A. fish", "B. wish", "C. dish", "D. salt"], "answer": "D", "explain": "'salt' phát âm là /s/, các từ còn lại phát âm là /ʃ/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. perform", "B. prefer", "C. control", "D. concert"], "answer": "D", "explain": "'concert' nhấn âm 1, các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "NB", "q": "Beethoven was a famous ______.", "options": ["A. composer", "B. portrait", "C. puppet", "D. gallery"], "answer": "A", "explain": "'composer' nghĩa là nhạc sĩ."}, {"type": "mcq", "level": "TH", "q": "The new gallery is ______ large as the old one.", "options": ["A. as", "B. than", "C. so", "D. like"], "answer": "A", "explain": "Cấu trúc so sánh bằng: as + tính từ + as."}, {"type": "mcq", "level": "VD", "q": "The artist spent three months ______ the music for the film.", "options": ["A. composing", "B. performing", "C. controlling", "D. preferring"], "answer": "A", "explain": "'spend time + V-ing'; 'compose' là sáng tác nhạc."}, {"type": "mcq", "level": "VDC", "q": "A: Who is your favourite composer? B: ______", "options": ["A. I like Beethoven best.", "B. I like music.", "C. He is famous.", "D. Classical music."], "answer": "A", "explain": "Hỏi nhạc sĩ yêu thích thì nêu tên cụ thể."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Linh likes pop music, but her brother likes rock music. They often argue about which is better. Their mother likes folk music. At weekends, they listen to music together.", "statements": ["Linh likes pop music.", "Her brother likes classical music.", "Their mother likes folk music.", "They never listen to music together."], "answer": ["T", "F", "T", "F"], "explain": "Anh trai Linh thích nhạc rock; cả nhà vẫn nghe nhạc cùng nhau."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and fferent from (khác với)."}, {"type": "mcq", "level": "VD", "q": "The water puppet ______ tells stories about village life.", "options": ["A. performance", "B. portrait", "C. anthem", "D. gallery"], "answer": "A", "explain": "'performance' nghĩa là buổi biểu diễn."}, {"type": "mcq", "level": "VDC", "q": "A: Would you like to perform in the school concert? B: ______", "options": ["A. I am not sure. Let me think about it.", "B. I like concerts.", "C. It is at school.", "D. I can sing."], "answer": "A", "explain": "Được mời biểu diễn nhưng chưa chắc chắn thì xin thời gian suy nghĩ."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). In our music lesson today, the teacher taught us a new song. We sang it three times. Then we learned to play a simple tune on the recorder. Everyone enjoyed the lesson.", "statements": ["The teacher taught a new song today.", "The students sang the song three times.", "They learned to play the piano.", "Everyone enjoyed the lesson."], "answer": ["T", "T", "F", "T"], "explain": "Học sinh học chơi recorder (sáo), không phải piano."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Van Gogh was a famous painter from the Netherlands. He painted more than 2,000 artworks, but he was not famous during his life. Today, his portraits are worth millions of dollars.", "statements": ["Van Gogh came from the Netherlands.", "He painted more than 2,000 artworks.", "He was very famous during his life.", "His paintings are very valuable today."], "answer": ["T", "T", "F", "T"], "explain": "Van Gogh không nổi tiếng khi còn sống."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: He bought a new musical ______ yesterday.", "answer": "instrument", "explain": "'musical instrument' nghĩa là nhạc cụ."}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: Water puppetry is a traditional ______ form. (art)", "answer": "art", "explain": "'art' vừa là danh từ vừa dùng như tính từ trong cụm này."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. fish", "B. wish", "C. dish", "D. musician"], "answer": "D", "explain": "'musician' phát âm là /z/, các từ còn lại phát âm là /ʃ/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. anthem", "B. concert", "C. puppet", "D. compose"], "answer": "D", "explain": "'compose' nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "NB", "q": "My sister ______ pop music to rock music.", "options": ["A. prefers", "B. performs", "C. composes", "D. controls"], "answer": "A", "explain": "'prefer' nghĩa là thích hơn."}, {"type": "mcq", "level": "TH", "q": "Water puppetry is ______ popular as ca tru singing.", "options": ["A. as", "B. than", "C. so", "D. like"], "answer": "A", "explain": "Cấu trúc so sánh bằng: as + tính từ + as."}, {"type": "mcq", "level": "VD", "q": "The museum's new ______ shows paintings from the 19th century.", "options": ["A. exhibition", "B. concert", "C. performance", "D. puppet"], "answer": "A", "explain": "'exhibition' nghĩa là cuộc triển lãm."}, {"type": "mcq", "level": "VDC", "q": "A: How often do you listen to folk music? B: ______", "options": ["A. Every evening before bed.", "B. I like folk music.", "C. It is interesting.", "D. With my friends."], "answer": "A", "explain": "Hỏi tần suất thì trả lời bằng trạng từ chỉ tần suất."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last month, our school held a singing contest. Twenty students took part in it. Hoa won first prize with a folk song. She got a beautiful trophy.", "statements": ["The singing contest was last month.", "Twenty students took part in it.", "Hoa sang a pop song.", "Hoa won first prize."], "answer": ["T", "T", "F", "T"], "explain": "Hoa hát một bài dân ca (folk song), không phải nhạc pop."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last summer, Minh composed his first song. It took him two weeks to finish it. He performed it at the school festival. Everyone clapped loudly after his performance.", "statements": ["Minh composed his first song last summer.", "It took him two months to finish the song.", "He performed the song at the school festival.", "Nobody liked his performance."], "answer": ["T", "F", "T", "F"], "explain": "Minh mất hai tuần để sáng tác; mọi người vỗ tay nhiệt liệt."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The singer will ______ at the town hall tonight.", "answer": "perform", "explain": "'perform' nghĩa là biểu diễn."}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: My brother is a good ______. He plays the drums. (music)", "answer": "musician", "explain": "music (âm nhạc) thành musician (nhạc sĩ, người chơi nhạc)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. treasure", "B. pleasure", "C. measure", "D. sure"], "answer": "D", "explain": "'sure' phát âm là /ʃ/, các từ còn lại phát âm là /ʒ/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. prefer", "B. perform", "C. control", "D. gallery"], "answer": "D", "explain": "'gallery' nhấn âm 1, các từ còn lại nhấn âm 2."}, {"type": "mcq", "level": "NB", "q": "______ music comes from the countryside and tells stories of farmers.", "options": ["A. Folk", "B. Pop", "C. Rock", "D. Classical"], "answer": "A", "explain": "'folk music' nghĩa là nhạc dân gian."}, {"type": "mcq", "level": "TH", "q": "She dances ______ a ballerina.", "options": ["A. like", "B. as", "C. from", "D. with"], "answer": "A", "explain": "Cấu trúc: like + danh từ (giống như)."}, {"type": "mcq", "level": "VD", "q": "The painter is famous for his beautiful ______ of village women.", "options": ["A. portraits", "B. puppets", "C. concerts", "D. galleries"], "answer": "A", "explain": "'portrait' nghĩa là bức chân dung."}, {"type": "mcq", "level": "VDC", "q": "A: This portrait is beautiful, is it not? B: ______", "options": ["A. Yes, the artist is very talented.", "B. No, it is ugly.", "C. I do not like art.", "D. It is expensive."], "answer": "A", "explain": "Khen bức tranh đẹp thì đồng tình và khen thêm họa sĩ."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). There is a music club at our school. It meets every Thursday afternoon. Members can learn to sing or play instruments. New members are always welcome.", "statements": ["The music club meets every Thursday afternoon.", "Members can learn to sing or play instruments.", "The club meets on Friday.", "New members are always welcome."], "answer": ["T", "T", "F", "T"], "explain": "Câu lạc bộ họp vào chiều thứ Năm, không phải thứ Sáu."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). A rock concert needs a lot of equipment. The band uses big speakers and bright lights. The tickets are often expensive. However, thousands of fans still come to enjoy the loud music.", "statements": ["A rock concert needs little equipment.", "The band uses big speakers and bright lights.", "Rock concert tickets are often expensive.", "Few fans come to rock concerts."], "answer": ["F", "T", "T", "F"], "explain": "Hòa nhạc rock cần nhiều thiết bị và thu hút hàng nghìn khán giả."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Folk music ______ from the countryside.", "answer": "originated", "explain": "'originate' nghĩa là bắt nguồn; thì quá khứ thêm 'd'."}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: The gallery has many beautiful ______. (paint)", "answer": "paintings", "explain": "paint (vẽ) thành paintings (những bức tranh)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. share", "B. sugar", "C. salt", "D. fish"], "answer": "C", "explain": "'salt' phát âm là /s/, các từ còn lại phát âm là /ʃ/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. classical", "B. portrait", "C. gallery", "D. prefer"], "answer": "D", "explain": "'prefer' nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "level": "NB", "q": "They are going to a ______ to listen to classical music.", "options": ["A. concert", "B. gallery", "C. portrait", "D. puppet"], "answer": "A", "explain": "'concert' nghĩa là buổi hòa nhạc."}, {"type": "mcq", "level": "TH", "q": "My violin sounds the same ______ yours.", "options": ["A. as", "B. like", "C. from", "D. with"], "answer": "A", "explain": "Cấu trúc: the same as (giống như)."}, {"type": "mcq", "level": "VD", "q": "The children laughed loudly at the funny ______ show.", "options": ["A. puppet", "B. portrait", "C. concert", "D. anthem"], "answer": "A", "explain": "'puppet show' nghĩa là buổi biểu diễn rối."}, {"type": "mcq", "level": "VDC", "q": "A: Shall we buy tickets for the concert? B: ______", "options": ["A. Yes, let us do it now.", "B. I do not like concerts.", "C. Tickets are expensive.", "D. It is far away."], "answer": "A", "explain": "Gợi ý mua vé thì đồng ý và hành động ngay."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Yesterday afternoon, Anna visited an art gallery near her house. She saw many beautiful portraits and landscapes. Her favourite was a portrait of a little girl. She stayed there for two hours.", "statements": ["Anna visited an art gallery yesterday afternoon.", "She saw only portraits there.", "Her favourite painting was a portrait of a little girl.", "She stayed there for two hours."], "answer": ["T", "F", "T", "T"], "explain": "Anna còn xem cả tranh phong cảnh (landscapes)."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Hoa and Mai have different tastes in music. Hoa likes pop because it is lively. Mai likes folk music because it is meaningful. They respect each other's choices and sometimes listen together.", "statements": ["Hoa and Mai like the same kind of music.", "Hoa likes pop because it is lively.", "Mai thinks folk music is meaningful.", "They never listen to music together."], "answer": ["F", "T", "T", "F"], "explain": "Hai bạn có gu nhạc khác nhau nhưng đôi khi vẫn nghe cùng nhau."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The ______ at the theatre lasted three hours.", "answer": "performance", "explain": "'performance' nghĩa là buổi biểu diễn."}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: Her ______ is classical music. (prefer)", "answer": "preference", "explain": "prefer (thích hơn) thành preference (sở thích)."}]}]}</script>
