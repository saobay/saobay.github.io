wd clapped nonstop. Even the rain could not reduce their excitement.", "statements": ["The dragon dance was the highlight.", "The dancers moved well together.", "The crowd was quiet.", "The rain spoiled the fun."], "answer": ["T", "T", "F", "F"], "explain": "Múa lân là điểm nhấn, các vũ công phối hợp nhịp nhàng, khán giả vỗ tay không ngớt (không im lặng), mưa không làm giảm hứng thú."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE word: ___ do children love Halloween? - Because of candy.", "answer": "Why", "explain": "Câu trả lời có because nên dùng Why."}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: The streets were (beauty) ___ decorated.", "answer": "beautifully", "explain": "Cần trạng từ bổ nghĩa cho decorated: beautifully."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "___ do children love Halloween? - Because of the costumes.", "options": ["A. Why", "B. When", "C. Where", "D. What"], "answer": "A", "explain": "Câu trả lời có because nên câu hỏi là Why."}, {"type": "mcq", "level": "TH", "q": "___ often do you visit your grandparents at Tet?", "options": ["A. How", "B. What", "C. Where", "D. Who"], "answer": "A", "explain": "Hỏi tần suất dùng How often."}, {"type": "mcq", "level": "TH", "q": "___ he decorate the house yesterday?", "options": ["A. Do", "B. Does", "C. Did", "D. Is"], "answer": "C", "explain": "Yesterday là quá khứ, chủ ngữ he nên dùng Did."}, {"type": "mcq", "level": "TH", "q": "___ is in the parade?", "options": ["A. Who", "B. What", "C. Where", "D. When"], "answer": "A", "explain": "Hỏi về người tham gia diễu hành dùng Who."}, {"type": "mcq", "level": "VD", "q": "___ long does the carnival in Rio last?", "options": ["A. How", "B. What", "C. When", "D. Where"], "answer": "A", "explain": "Hỏi về khoảng thời gian dùng How long."}, {"type": "mcq", "level": "VD", "q": "___ many people join the street parade every year?", "options": ["A. How", "B. What", "C. When", "D. Who"], "answer": "A", "explain": "Hỏi số lượng dùng How many."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nFestivals help keep traditions alive. Young people learn old customs from their grandparents. Despite modern life, many festivals stay popular. They connect the past with the present.", "statements": ["Festivals protect traditions.", "Young people learn customs from elders.", "Modern life killed all festivals.", "Festivals link past and present."], "answer": ["T", "T", "F", "T"], "explain": "Lễ hội giữ gìn truyền thống, người trẻ học phong tục từ ông bà, cuộc sống hiện đại không giết chết lễ hội, lễ hội nối quá khứ với hiện tại."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nThe Venice carnival began hundreds of years ago. Rich and poor wore masks to hide who they were. Everyone could dance together freely. Today, the tradition continues with beautiful costumes.", "statements": ["The carnival is very old.", "Masks hid people's identities.", "Only rich people joined.", "The tradition still continues."], "answer": ["T", "T", "F", "T"], "explain": "Lễ hội Venice có từ hàng trăm năm trước, mặt nạ che giấu thân phận, mọi người đều tham gia (không chỉ người giàu), truyền thống còn tiếp tục."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: ___ often do you go to festivals? - Twice a year.", "answer": "How", "explain": "Hỏi tần suất dùng How often."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Easter is a (religion) ___ festival.", "answer": "religious", "explain": "Cần tính từ: religious (thuộc tôn giáo)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VD", "q": "___ does the word carnival mean?", "options": ["A. What", "B. Where", "C. When", "D. Who"], "answer": "A", "explain": "Hỏi nghĩa của từ dùng What."}, {"type": "mcq", "level": "VD", "q": "___ did they choose this ruins the mood."], "answer": ["T", "T", "T", "F"], "explain": "Chợ Giáng sinh mở tháng 12, mua quà và uống sô-cô-la nóng, đường phố rực rỡ đèn màu, trời lạnh nhưng không khí ấm áp (không bị phá hỏng)."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: In ___ of the rain, the parade went on.", "answer": "spite", "explain": "Cụm in spite of: mặc dù."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Some people are (superstition) ___.", "answer": "superstitious", "explain": "Sau are cần tính từ: superstitious (mê tín)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "A: When is the Mid-Autumn Festival? - B: ___", "options": ["A. It's in September or October.", "B. It's in the street.", "C. With my family.", "D. It's fun."], "answer": "A", "explain": "Hỏi thời gian (When) thì trả lời bằng thời gian."}, {"type": "mcq", "level": "TH", "q": "A: Do you like Halloween? - B: ___", "options": ["A. Yes, I love the costumes.", "B. It's in October.", "C. At night.", "D. With friends."], "answer": "A", "explain": "Câu hỏi Yes/No thì trả lời Yes/No kèm thông tin."}, {"type": "mcq", "level": "VD", "q": "A: What do people eat at Thanksgiving? - B: ___", "options": ["A. Turkey and cranberry sauce.", "B. In November.", "C. With family.", "D. At home."], "answer": "A", "explain": "Hỏi ăn gì (What) thì kể tên món ăn."}, {"type": "mcq", "level": "VD", "q": "A: Shall we join the parade? - B: ___", "options": ["A. Good idea! Let's go.", "B. It's long.", "C. In the street.", "D. At 8 p.m."], "answer": "A", "explain": "Đồng ý với lời đề nghị: Good idea!"}, {"type": "mcq", "level": "VDC", "q": "A: Why do you like the carnival? - B: ___", "options": ["A. Because of the music and dancing.", "B. In February.", "C. In the city.", "D. With my friends."], "answer": "A", "explain": "Hỏi lý do (Why) thì trả lời bằng because."}, {"type": "mcq", "level": "VDC", "q": "A: Did you enjoy the festival? - B: ___", "options": ["A. Yes, it was fascinating.", "B. Last weekend.", "C. In my town.", "D. With my class."], "answer": "A", "explain": "Câu hỏi Yes/No quá khứ thì trả lời Yes/No."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nOktoberfest in Germany is the world's largest beer festival. However, there is more than beer. Visitors enjoy music, parades and traditional food. Millions come to Munich every autumn.", "statements": ["Oktoberfest is about beer only.", "There is music and food too.", "It happens in Munich.", "Few people visit it."], "answer": ["F", "T", "T", "F"], "explain": "Oktoberfest không chỉ có bia, còn có nhạc, diễu hành và ẩm thực, diễn ra ở Munich, hàng triệu người đến (không ít)."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide True (T) or False (F).\n\nThe Mid-Autumn Festival celebrates the full moon. In the past, farmers thanked the moon for a good harvest. Today, children are the stars of the festival. The bright moon reminds everyone of family reunion.", "statements": ["The festival honours the full moon.", "Farmers thanked the moon.", "Children are unimportant.", "The moon means family reunion."], "answer": ["T", "T", "F", "T"], "explain": "Tết Trung thu tôn vinh trăng rằm, nông dân xưa tạ ơn trăng mùa màng, trẻ em là nhân vật chính (không phải không quan trọng), trăng gợi nhớ sum họp."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: ___ was the best part? - The fireworks.", "answer": "What", "explain": "Hỏi điều tuyệt nhất là gì dùng What."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The dancers wore (fascinate) ___ costumes.", "answer": "fascinating", "explain": "Cần tính từ đuôi ing miêu tả: fascinating (hấp dẫn)."}]}]}</script>
