in": "Tứ giác có bốn cạnh bằng nhau là hình thoi."}, {"type": "mcq", "level": "NB", "q": "Trong hình thoi $ABCD$, $O$ là giao điểm của hai đường chéo. Khẳng định đúng là", "options": ["A. $OA=OC$ và $OB=OD$", "B. $OA=OB$", "C. $AC=2AB$", "D. $OA \\perp AB$"], "answer": "A", "explain": "$O$ là trung điểm của mỗi đường chéo nên $OA=OC$ và $OB=OD$."}, {"type": "mcq", "level": "NB", "q": "Hình chữ nhật có hai cạnh kề bằng nhau là", "options": ["A. hình vuông", "B. hình thoi", "C. hình bình hành", "D. hình thang cân"], "answer": "A", "explain": "Dấu hiệu nhận biết: hình chữ nhật có hai cạnh kề bằng nhau là hình vuông."}, {"type": "mcq", "level": "TH", "q": "Cho hình thoi có cạnh bằng $15$ cm, một đường chéo bằng $18$ cm. Độ dài đường chéo còn lại là", "options": ["A. $24$ cm", "B. $12$ cm", "C. $33$ cm", "D. $21$ cm"], "answer": "A", "explain": "Nửa đường chéo còn lại $=\\sqrt{15^2-9^2}=12$ (cm) nên đường chéo $=24$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho hình vuông $ABCD$ có $AB=11$ cm. Độ dài đường chéo $AC$ là", "options": ["A. $11\\sqrt{2}$ cm", "B. $22$ cm", "C. $11\\sqrt{3}$ cm", "D. $121$ cm"], "answer": "A", "explain": "$AC=11\\sqrt{2}$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình thoi $ABCD$ có $\\widehat{B}=120^\\circ$, cạnh bằng $12$ cm. Độ dài đường chéo $AC$ là", "options": ["A. $12\\sqrt{3}$ cm", "B. $12$ cm", "C. $24$ cm", "D. $6\\sqrt{3}$ cm"], "answer": "A", "explain": "Áp dụng định lí côsin trong tam giác $ABC$: $AC^2=12^2+12^2-2\\cdot12\\cdot12\\cdot\\cos120^\\circ=432$, $AC=12\\sqrt{3}$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình vuông có bốn góc vuông.", "b) Hình vuông có bốn cạnh bằng nhau.", "c) Hình vuông là hình chữ nhật.", "d) Mọi hình chữ nhật đều là hình vuông."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình thoi $MNPQ$ có $MN=13$ cm, $MP=10$ cm. Xét tính đúng sai của các qrt{2}$ cm", "B. $24$ cm", "C. $6\\sqrt{2}$ cm", "D. $144$ cm"], "answer": "A", "explain": "Cạnh $=12$ (cm) nên đường chéo $=12\\sqrt{2}$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình thoi $ABCD$ có $\\widehat{D}=60^\\circ$, cạnh bằng $14$ cm. Độ dài đường chéo $AC$ là", "options": ["A. $14$ cm", "B. $14\\sqrt{3}$ cm", "C. $28$ cm", "D. $7$ cm"], "answer": "A", "explain": "Tam giác $ADC$ có $AD=DC$ và $\\widehat{D}=60^\\circ$ nên là tam giác đều, $AC=14$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Cho hình vuông $EFGH$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $EF=FG=GH=HE$.", "b) $EG=FH$.", "c) $EG \\perp FH$.", "d) $EF=EG$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì $EG=EF\\sqrt{2}$."}, {"type": "truefalse", "level": "TH", "q": "Cho hình thoi $ABCD$ có $AC=16$ cm, $BD=12$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Diện tích $ABCD$ bằng $96$ cm$^2$.", "b) Cạnh của hình thoi bằng $10$ cm.", "c) Chu vi $ABCD$ bằng $40$ cm.", "d) $AC=BD$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "q": "Cho hình thoi có hai đường chéo bằng $20$ cm và $21$ cm. Tính diện tích của hình thoi (cm$^2$).", "answer": "210", "explain": "Diện tích $=\\frac{1}{2}\\cdot20\\cdot21=210$ (cm$^2$)."}, {"type": "short", "level": "VDC", "q": "Cho hình vuông có chu vi bằng $48$ cm. Tính diện tích của hình vuông (cm$^2$).", "answer": "144", "explain": "Cạnh $=12$ (cm); diện tích $=12^2=144$ (cm$^2$)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Hình thoi có một góc vuông là hình", "options": ["A. vuông", "B. chữ nhật", "C. bình hành", "D. thang cân"], "answer": "A", "explain": "Hình thoi có một góc vuông là hình vuông."}, {"type": "mcq", "level": "NB", "q": "Trong hình thoi, hai đường chéo", "options": ["A. vuông góc và cắt nhau tại trung điểm của mỗi đường", "B. bằng nhau và vuông góc", "C. song song với các cạnh", "D. là các đường cao của hình thoi"], "answer": "A", "explain": "Hai đường chéo của hình thoi vuông góc và cắt nhau tại trung điểm của mỗi đường."}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu nhận biết hình vuông là", "options": ["A. hình thoi có hai đường chéo bằng nhau", "B. hình thoi có hai đường chéo vuông góc", "C. hình chữ nhật có hai đường chéo cắt nhau", "D. hình bình hành có một góc tù"], "answer": "A", "explain": "Hình thoi có hai đường chéo bằng nhau là hình vuông."}, {"type": "mcq", "level": "TH", "q": "Cho hình thoi $IJKL$ có $IJ=25$ cm, $IK=14$ cm. Độ dài đường chéo $JL$ là", "options": ["A. $48$ cm", "B. $24$ cm", "C. $39$ cm", "D. $28$ cm"], "answer": "A", "explain": "Nửa $JL=\\sqrt{25^2-7^2}=24$ (cm) nên $JL=48$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho hình vuông $MNPQ$ có $MN=15$ cm. Độ dài đường chéo $MP$ là", "options": ["A. $15\\sqrt{2}$ cm", "B. $30$ cm", "C. $15\\sqrt{3}$ cm", "D. $225$ cm"], "answer": "A", "explain": "$MP=15\\sqrt{2}$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình thoi $ABCD$ có $\\widehat{A}=120^\\circ$, $AB=9$ cm. Độ dài đường chéo $BD$ là", "options": ["A. $9\\sqrt{3}$ cm", "B. $9$ cm", "C. $18$ cm", "D. $9\\sqrt{2}$ cm"], "answer": "A", "explain": "Áp dụng định lí côsin trong tam giác $ABD$: $BD^2=9^2+9^2-2\\cdot9\\cdot9\\cdot\\cos120^\\circ=243$, $BD=9\\sqrt{3}$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình thoi có bốn cạnh bằng nhau.", "b) Hình thoi có các góc đối bằng nhau.", "c) Hình thoi có bốn góc vuông.", "d) Hình thoi có hai đường chéo vuông góc với nhau."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai (chỉ đúng với hình vuông)."}, {"type": "truefalse", "level": "TH", "q": "Cho hình vuông $ABCD$ có $AC=6\\sqrt{2}$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Cạnh của hình vuông bằng $6$ cm.", "b) Diện tích của hình vuông bằng $36$ cm$^2$.", "c) Chu vi của hình vuông bằng $24$ cm.", "d) Bán kính đường tròn ngoại tiếp hình vuông bằng $6$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì bán kính $=AC:2=3\\sqrt{2}$ (cm)."}, {"type": "short", "level": "VD", "q": "Cho hình vuông có diện tích bằng $81$ cm$^2$. Tính chu vi của hình vuông (cm).", "answer": "36", "explain": "Cạnh $=9$ (cm); chu vi $=36$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho hình thoi $ABCD$ có cạnh bằng $20$ cm, đường chéo $AC=32$ cm. Tính độ dài đường chéo $BD$ (cm).", "answer": "24", "explain": "Nửa $BD=\\sqrt{20^2-16^2}=12$ (cm) nên $BD=24$ (cm)."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hình vuông là tứ giác có", "options": ["A. bốn góc vuông và bốn cạnh bằng nhau", "B. bốn góc vuông nhưng các cạnh không bằng nhau", "C. bốn cạnh bằng nhau nhưng không có góc vuông", "D. hai đường chéo song song với nhau"], "answer": "A", "explain": "Định nghĩa hình vuông."}, {"type": "mcq", "level": "NB", "q": "Trong hình thoi, các cạnh", "options": ["A. đều bằng nhau", "B. đôi một vuông góc", "C. song song với nhau", "D. có độ dài khác nhau"], "answer": "A", "explain": "Hình thoi có bốn cạnh bằng nhau."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây sai về hình thoi?", "options": ["A. Bốn cạnh bằng nhau.", "B. Hai đường chéo vuông góc với nhau.", "C. Hai đường chéo bằng nhau.", "D. Là hình bình hành."], "answer": "C", "explain": "Hai đường chéo của hình thoi nói chung không bằng nhau nên C sai."}, {"type": "mcq", "level": "TH", "q": "Cho hình thoi $PQRS$ có $PQ=29$ cm, $PR=40$ cm. Độ dài đường chéo $QS$ là", "options": ["A. $42$ cm", "B. $21$ cm", "C. $69$ cm", "D. $58$ cm"], "answer": "A", "explain": "Nửa $QS=\\sqrt{29^2-20^2}=21$ (cm) nên $QS=42$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho hình vuông có đường chéo bằng $18$ cm. Diện tích của hình vuông là", "options": ["A. $162$ cm$^2$", "B. $324$ cm$^2$", "C. $81$ cm$^2$", "D. $18\\sqrt{2}$ cm$^2$"], "answer": "A", "explain": "Diện tích $=\\frac{1}{2}\\cdot18\\cdot18=162$ (cm$^2$)."}, {"type": "mcq", "level": "VD", "q": "Cho hình thoi $ABCD$ có chu vi bằng $80$ cm, $\\widehat{A}=60^\\circ$. Độ dài đường chéo ngắn $BD$ là", "options": ["A. $20$ cm", "B. $20\\sqrt{3}$ cm", "C. $40$ cm", "D. $10$ cm"], "answer": "A", "explain": "Cạnh $=20$ (cm); tam giác $ABD$ đều nên $BD=20$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Cho hình thoi $ABCD$, $O$ là giao điểm của hai đường chéo. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $O$ là trung điểm của $AC$.", "b) $O$ là trung điểm của $BD$.", "c) $AC \\perp BD$ tại $O$.", "d) $OA=OB$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình vuông $EFGH$ có cạnh bằng $8$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Đường chéo của hình vuông bằng $8\\sqrt{2}$ cm.", "b) Diện tích của hình vuông bằng $64$ cm$^2$.", "c) Chu vi của hình vuông bằng $32$ cm.", "d) Bán kính đường tròn ngoại tiếp hình vuông bằng $8$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì bán kính $=4\\sqrt{2}$ (cm)."}, {"type": "short", "level": "VD", "q": "Cho hình thoi $ABCD$ có $AC=14$ cm, $BD=48$ cm. Tính độ dài cạnh của hình thoi (cm).", "answer": "25", "explain": "Cạnh $=\\sqrt{7^2+24^2}=25$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho hình thoi có chu vi bằng $100$ cm, hiệu hai đường chéo bằng $14$ cm. Tính diện tích của hình thoi (cm$^2$).", "answer": "576", "explain": "Cạnh $=25$ (cm). Đặt nửa hai đường chéo là $x,y$ ($x-y=7$, $x^2+y^2=625$) thì $2xy=576$; diện tích $=2xy=576$ (cm$^2$)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hình bình hành có một đường chéo là đường phân giác của một góc là", "options": ["A. hình thoi", "B. hình chữ nhật", "C. hình thang cân", "D. hình vuông"], "answer": "A", "explain": "Dấu hiệu nhận biết: hình bình hành có một đường chéo là phân giác của một góc là hình thoi."}, {"type": "mcq", "level": "NB", "q": "Trong hình vuông, mỗi đường chéo", "options": ["A. là đường phân giác của các góc của hình vuông", "B. song song với một cạnh", "C. dài bằng nửa cạnh", "D. vuông góc với các cạnh"], "answer": "A", "explain": "Trong hình vuông, hai đường chéo là các đường phân giác của các góc."}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu nhận biết hình thoi là", "options": ["A. hình bình hành có hai cạnh kề bằng nhau", "B. hình bình hành có hai đường chéo bằng nhau", "C. tứ giác có bốn góc vuông", "D. hình thang có hai cạnh bên bằng nhau"], "answer": "A", "explain": "Hình bình hành có hai cạnh kề bằng nhau là hình thoi."}, {"type": "mcq", "level": "TH", "q": "Cho hình thoi $ABCD$ có $AC=24$ cm, $BD=32$ cm. Độ dài cạnh của hình thoi là", "options": ["A. $20$ cm", "B. $40$ cm", "C. $56$ cm", "D. $28$ cm"], "answer": "A", "explain": "Cạnh $=\\sqrt{12^2+16^2}=20$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho hình vuông có cạnh bằng $7\\sqrt{2}$ cm. Độ dài đường chéo của hình vuông là", "options": ["A. $14$ cm", "B. $7\\sqrt{2}$ cm", "C. $28$ cm", "D. $14\\sqrt{2}$ cm"], "answer": "A", "explain": "Đường chéo $=7\\sqrt{2}\\cdot\\sqrt{2}=14$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình thoi $ABCD$ có $\\widehat{B}=60^\\circ$, $AC=16$ cm. Độ dài cạnh của hình thoi là", "options": ["A. $16$ cm", "B. $8$ cm", "C. $32$ cm", "D. $16\\sqrt{3}$ cm"], "answer": "A", "explain": "Tam giác $ABC$ có $AB=BC$ và $\\widehat{B}=60^\\circ$ nên là tam giác đều, cạnh $=AC=16$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình vuông vừa là hình chữ nhật vừa là hình thoi.", "b) Hình vuông có hai đường chéo bằng nhau.", "c) Hình vuông có hai đường chéo vuông góc với nhau.", "d) Mọi hình thoi đều là hình vuông."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình thoi $IJKL$ có cạnh bằng $10$ cm, $IK=16$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $JL=12$ cm.", "b) Diện tích $IJKL$ bằng $96$ cm$^2$.", "c) Chu vi $IJKL$ bằng $40$ cm.", "d) $IK=JL$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng vì nửa $JL=\\sqrt{10^2-8^2}=6$ (cm). b), c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "q": "Cho hình vuông có chu vi bằng $52$ cm. Tính diện tích của hình vuông (cm$^2$).", "answer": "169", "explain": "Cạnh $=13$ (cm); diện tích $=169$ (cm$^2$)."}, {"type": "short", "level": "VDC", "q": "Cho hình thoi $ABCD$ có $AC=30$ cm, $BD=16$ cm. Tính chu vi của hình thoi (cm).", "answer": "68", "explain": "Cạnh $=\\sqrt{15^2+8^2}=17$ (cm); chu vi $=4\\cdot17=68$ (cm)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tứ giác có bốn góc vuông và bốn cạnh bằng nhau là", "options": ["A. hình vuông", "B. hình thoi", "C. hình chữ nhật", "D. hình bình hành"], "answer": "A", "explain": "Đó chính là định nghĩa hình vuông."}, {"type": "mcq", "level": "NB", "q": "Trong hình thoi, một đường chéo", "options": ["A. vuông góc với đường chéo còn lại", "B. bằng đường chéo còn lại", "C. song song với một cạnh", "D. dài gấp đôi một cạnh"], "answer": "A", "explain": "Hai đường chéo của hình thoi vuông góc với nhau."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. Hình vuông có hai đường chéo bằng nhau và vuông góc với nhau.", "B. Hình vuông có hai đường chéo song song.", "C. Hình vuông chỉ có hai cạnh bằng nhau.", "D. Hình vuông chỉ có hai góc vuông."], "answer": "A", "explain": "Chỉ có A đúng."}, {"type": "mcq", "level": "TH", "q": "Cho hình thoi $MNPQ$ có $MP=36$ cm, $NQ=48$ cm. Độ dài cạnh của hình thoi là", "options": ["A. $30$ cm", "B. $60$ cm", "C. $84$ cm", "D. $42$ cm"], "answer": "A", "explain": "Cạnh $=\\sqrt{18^2+24^2}=30$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Cho hình vuông $EFGH$ có $EG=20$ cm. Độ dài cạnh của hình vuông là", "options": ["A. $10\\sqrt{2}$ cm", "B. $20$ cm", "C. $20\\sqrt{2}$ cm", "D. $10$ cm"], "answer": "A", "explain": "Cạnh $=20:\\sqrt{2}=10\\sqrt{2}$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình thoi $ABCD$ có $\\widehat{D}=120^\\circ$, cạnh bằng $18$ cm. Độ dài đường chéo ngắn $BD$ là", "options": ["A. $18$ cm", "B. $18\\sqrt{3}$ cm", "C. $36$ cm", "D. $9$ cm"], "answer": "A", "explain": "$\\widehat{A}=60^\\circ$ nên tam giác $ABD$ đều, $BD=18$ (cm)."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Mọi hình vuông đều là hình thoi.", "b) Mọi hình vuông đều là hình chữ nhật.", "c) Mọi hình thoi đều là hình vuông.", "d) Mọi hình chữ nhật đều là hình vuông."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c), d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình vuông $ABCD$ có cạnh bằng $10$ cm, $O$ là giao điểm của hai đường chéo. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $AC=10\\sqrt{2}$ cm.", "b) $OA=5\\sqrt{2}$ cm.", "c) Diện tích $ABCD$ bằng $100$ cm$^2$.", "d) $OA=OB=10$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì $OA=OB=5\\sqrt{2}$ (cm)."}, {"type": "short", "level": "VD", "q": "Cho hình thoi có cạnh bằng $26$ cm, một đường chéo bằng $20$ cm. Tính độ dài đường chéo còn lại (cm).", "answer": "48", "explain": "Nửa đường chéo còn lại $=\\sqrt{26^2-10^2}=24$ (cm) nên đường chéo $=48$ (cm)."}, {"type": "short", "level": "VDC", "q": "Cho hình vuông có đường chéo bằng $14$ cm. Tính diện tích của hình vuông (cm$^2$).", "answer": "98", "explain": "Diện tích $=\\frac{1}{2}\\cdot14\\cdot14=98$ (cm$^2$)."}]}]}
