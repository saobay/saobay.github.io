ns": [{"type": "mcq", "level": "NB", "q": "Tứ giác có hai cạnh đối song song là", "options": ["A. hình thang", "B. hình bình hành", "C. hình chữ nhật", "D. hình thoi"], "answer": "A", "explain": "Tứ giác có hai cạnh đối song song là hình thang."}, {"type": "mcq", "level": "NB", "q": "Trong hình thang $ABCD$ ($AB \\parallel CD$), $AB$ và $CD$ gọi là", "options": ["A. hai đáy", "B. hai cạnh bên", "C. hai đường chéo", "D. hai cạnh kề"], "answer": "A", "explain": "Hai cạnh song song trong hình thang gọi là hai đáy."}, {"type": "mcq", "level": "NB", "q": "Trong hình thang cân, hai đường chéo", "options": ["A. $AC=BD$", "B. $AC \\perp BD$", "C. $AC=2BD$", "D. $AC$ là tia phân giác của góc $A$"], "answer": "A", "explain": "Trong hình thang cân, hai đường chéo bằng nhau: $AC=BD$."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{D}=95^\\circ$. Số đo góc $\\widehat{A}$ là", "options": ["A. $95^\\circ$", "B. $85^\\circ$", "C. $90^\\circ$", "D. $100^\\circ$"], "answer": "B", "explain": "$\\widehat{A}=180^\\circ-\\widehat{D}=180^\\circ-95^\\circ=85^\\circ$."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $AB=4$ cm, $CD=10$ cm, $AD=5$ cm. Chu vi của hình thang là", "options": ["A. $19$ cm", "B. $24$ cm", "C. $20$ cm", "D. $28$ cm"], "answer": "B", "explain": "$BC=AD=5$ cm nên chu vi $=4+10+5+5=24$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{C}=2\\widehat{B}$. Số đo góc $\\widehat{C}$ là", "options": ["A. $120^\\circ$", "B. $60^\\circ$", "C. $90^\\circ$", "D. $100^\\circ$"], "answer": "A", "explain": "$\\widehat{B}+\\widehat{C}=180^\\circ$ mà $\\widehat{C}=2\\widehat{B}$ nên $3\\widehat{B}=180^\\circ$, $\\widehat{B}=60^\\circ$, $\\widehat{C}=120^\\circ$."}, {"type": "truefalse", "level": "NB", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$). Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $AD=BC$.", "b) $\\widehat{C}=\\widehat{D}$.", "c) $AC \\perp BD$.", "d) $AB \\parallel CD$."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai, hai đường chéo bằng nhau chứ không nhất thiết vuông góc."}, {"type": "truefalse", "level": "TH", "q": "Cho hình thang $ABCD$ ($AB \\parallel CD$) có $AC=BD=9$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $ABCD$ là hình thang cân.", "b) $AD=BC$.", "c) Nếu $\\widehat{A}=70^\\circ$ thì $\\widehat{B}=110^\\circ$.", "d) $\\widehat{D}+\\widehat{C}=180^\\circ$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng theo dấu hiệu nhận biết. b) Đúng. c) Sai vì $\\widehat{B}=\\widehat{A}=70^\\circ$. d) Sai."}, {"type": "short", "level": "VD", "q": "Hình thang cân $MNPQ$ ($MN \\parallel PQ$) có $\\widehat{M}=78^\\circ$. Tính số đo góc $\\widehat{Q}$ (độ).", "answer": "102", "explain": "$\\widehat{Q}=180^\\circ-\\widehat{M}=180^\\circ-78^\\circ=102^\\circ$."}, {"type": "short", "level": "VDC", "q": "Hình thang cân $ABCD$ ($AB \\parallel CD$) có $AB=10$ cm, $CD=16$ cm, $AD=5$ cm. Tính độ dài đường cao của hình thang (cm).", "answer": "4", "explain": "$DH=(16-10):2=3$ (cm); đường cao $=\\sqrt{5^2-3^2}=4$ (cm)."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Hình thang có hai góc kề một đáy bằng nhau là", "options": ["A. hình thang cân", "B. hình thang vuông", "C. hình bình hành", "D. hình chữ nhật"], "answer": "A", "explain": "Đó chính là định nghĩa hình thang cân."}, {"type": "mcq", "level": "NB", "q": "Trong hình thang cân $ABCD$ ($AB \\parallel CD$), hai cạnh bên là", "options": ["A. $AD, BC$", "B. $AB, CD$", "C. $AC, BD$", "D. $AB, BC$"], "answer": "A", "explain": "Hai cạnh bên của hình thang cân $ABCD$ là $AD$ và $BC$."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng về hình thang cân?", "options": ["A. Hai đường chéo bằng nhau.", "B. Hai đáy bằng nhau.", "C. Bốn góc bằng nhau.", "D. Hai đường chéo vuông góc với nhau."], "answer": "A", "explain": "Trong hình thang cân, hai đường chéo bằng nhau."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{C}=105^\\circ$. Số đo góc $\\widehat{D}$ là", "options": ["A. $105^\\circ$", "B. $75^\\circ$", "C. $90^\\circ$", "D. $85^\\circ$"], "answer": "A", "explain": "$\\widehat{D}=\\widehat{C}=105^\\circ$ (hai góc kề đáy $CD$)."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}=72^\\circ$. Số đo góc $\\widehat{C}$ là", "options": ["A. $72^\\circ$", "B. $108^\\circ$", "C. $90^\\circ$", "D. $118^\\circ$"], "answer": "B", "explain": "$\\widehat{C}=180^\\circ-\\widehat{A}=108^\\circ$."}, {"type": "mcq", "level": "VD", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{B}-\\widehat{C}=50^\\circ$. Số đo góc $\\widehat{B}$ là", "options": ["A. $115^\\circ$", "B. $65^\\circ$", "C. $90^\\circ$", "D. $100^\\circ$"], "answer": "A", "explain": "$\\widehat{B}+\\widehat{C}=180^\\circ$; giải hệ được $\\widehat{B}=(180^\\circ+50^\\circ):2=115^\\circ$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình thang là tứ giác có hai cạnh đối song song.", "b) Hình thang cân có hai cạnh bên bằng nhau.", "c) Hình thang cân có hai đáy bằng nhau.", "d) Hai đường chéo của hình thang cân bằng nhau."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình thang cân $PQRS$ ($PQ \\parallel RS$) có $\\widehat{P}=80^\\circ$, $PQ=6$ cm, $RS=12$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $\\widehat{Q}=80^\\circ$.", "b) $\\widehat{S}=100^\\circ$.", "c) Nếu $PS=5$ cm thì $QR=5$ cm.", "d) $PQ=RS$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì $PQ=6$ cm, $RS=12$ cm."}, {"type": "short", "level": "VD", "q": "Hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{B}=92^\\circ$. Tính số đo góc $\\widehat{A}$ (độ).", "answer": "92", "explain": "$\\widehat{A}=\\widehat{B}=92^\\circ$ (hai góc kề đáy $AB$)."}, {"type": "short", "level": "VDC", "q": "Hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}=60^\\circ$, $AD=10$ cm, $AB=8$ cm. Tính độ dài đáy lớn $CD$ (cm).", "answer": "18", "explain": "$DH=AD\\cdot\\cos60^\\circ=5$ (cm); $CD=AB+2\\cdot DH=8+10=18$ (cm)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong hình thang, hai cạnh không song song gọi là", "options": ["A. hai cạnh bên", "B. hai đáy", "C. hai đường chéo", "D. hai cạnh kề"], "answer": "A", "explain": "Hai cạnh không song song trong hình thang gọi là hai cạnh bên."}, {"type": "mcq", "level": "NB", "q": "Trong hình thang cân $ABCD$ ($AB \\parallel CD$), cặp góc bằng nhau là", "options": ["A. $\\widehat{A}$ và $\\widehat{B}$", "B. $\\widehat{A}$ và $\\widehat{C}$", "C. $\\widehat{A}$ và $\\widehat{D}$", "D. $\\widehat{B}$ và $\\widehat{D}$"], "answer": "A", "explain": "Hai góc kề một đáy bằng nhau: $\\widehat{A}=\\widehat{B}$, $\\widehat{C}=\\widehat{D}$."}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu nhận biết hình thang cân là", "options": ["A. hình thang có hai góc kề một đáy bằng nhau", "B. hình thang có hai cạnh bên song song", "C. tứ giác có hai đường chéo bằng nhau", "D. hình thang có một góc vuông"], "answer": "A", "explain": "Hình thang có hai góc kề một đáy bằng nhau là hình thang cân."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}=108^\\circ$. Số đo góc $\\widehat{D}$ là", "options": ["A. $108^\\circ$", "B. $72^\\circ$", "C. $90^\\circ$", "D. $82^\\circ$"], "answer": "B", "explain": "$\\widehat{D}=180^\\circ-\\widehat{A}=72^\\circ$."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có đường chéo $AC=15$ cm. Độ dài đường chéo $BD$ là", "options": ["A. $15$ cm", "B. $7,5$ cm", "C. $30$ cm", "D. $10$ cm"], "answer": "A", "explain": "Hai đường chéo của hình thang cân bằng nhau nên $BD=AC=15$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}=3\\widehat{D}$. Số đo góc $\\widehat{D}$ là", "options": ["A. $45^\\circ$", "B. $135^\\circ$", "C. $60^\\circ$", "D. $90^\\circ$"], "answer": "A", "explain": "$4\\widehat{D}=180^\\circ$ nên $\\widehat{D}=45^\\circ$."}, {"type": "truefalse", "level": "NB", "q": "Cho hình thang vuông $ABCD$ ($AB \\parallel CD$, $\\widehat{A}=\\widehat{B}=90^\\circ$). Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $\\widehat{A}=90^\\circ$.", "b) $AB \\parallel CD$.", "c) $ABCD$ là hình thang cân.", "d) $AD \\perp AB$."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai, hình thang vuông nói chung không phải hình thang cân."}, {"type": "truefalse", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}=75^\\circ$, $AB=5$ cm, $CD=11$ cm, $AD=6$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $\\widehat{B}=75^\\circ$.", "b) $\\widehat{D}=105^\\circ$.", "c) $BC=6$ cm.", "d) Chu vi của hình thang bằng $27$ cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai vì chu vi $=5+11+6+6=28$ (cm)."}, {"type": "short", "level": "VD", "q": "Hình thang cân $EFGH$ ($EF \\parallel GH$) có $\\widehat{H}=118^\\circ$. Tính số đo góc $\\widehat{E}$ (độ).", "answer": "62", "explain": "$\\widehat{E}=180^\\circ-\\widehat{H}=180^\\circ-118^\\circ=62^\\circ$."}, {"type": "short", "level": "VDC", "q": "Hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{D}=60^\\circ$, $BC=8$ cm, $CD=20$ cm. Tính độ dài đáy nhỏ $AB$ (cm).", "answer": "12", "explain": "$\\widehat{C}=\\widehat{D}=60^\\circ$; kẻ $BK \\perp CD$ thì $KC=BC\\cdot\\cos60^\\circ=4$ (cm); $AB=CD-2\\cdot KC=20-8=12$ (cm)."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hình thang $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}=90^\\circ$ thì $ABCD$ là", "options": ["A. hình thang vuông", "B. hình thang cân", "C. hình bình hành", "D. hình chữ nhật"], "answer": "A", "explain": "Hình thang có một góc vuông là hình thang vuông."}, {"type": "mcq", "level": "NB", "q": "Trong hình thang cân, hai góc đối nhau", "options": ["A. bù nhau (tổng bằng $180^\\circ$)", "B. bằng nhau", "C. phụ nhau", "D. kề bù"], "answer": "A", "explain": "Hai góc đối của hình thang cân bù nhau, ví dụ $\\widehat{A}+\\widehat{C}=180^\\circ$."}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây sai?", "options": ["A. Hình thang cân có hai cạnh bên bằng nhau.", "B. Hình thang cân có hai đường chéo bằng nhau.", "C. Hình thang cân có hai đáy song song với nhau.", "D. Hình thang cân có hai góc kề một đáy bù nhau."], "answer": "D", "explain": "Hai góc kề một đáy của hình thang cân bằng nhau (không bù nhau) nên D sai."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $MNPQ$ ($MN \\parallel PQ$) có $\\widehat{P}=125^\\circ$. Số đo góc $\\widehat{Q}$ là", "options": ["A. $125^\\circ$", "B. $55^\\circ$", "C. $90^\\circ$", "D. $65^\\circ$"], "answer": "A", "explain": "$\\widehat{Q}=\\widehat{P}=125^\\circ$ (hai góc kề đáy $PQ$)."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{B}=66^\\circ$. Số đo góc $\\widehat{C}$ là", "options": ["A. $66^\\circ$", "B. $114^\\circ$", "C. $90^\\circ$", "D. $124^\\circ$"], "answer": "B", "explain": "$\\widehat{C}=180^\\circ-\\widehat{B}=114^\\circ$."}, {"type": "mcq", "level": "VD", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}+\\widehat{D}+\\widehat{B}=300^\\circ$. Số đo góc $\\widehat{C}$ là", "options": ["A. $60^\\circ$", "B. $120^\\circ$", "C. $90^\\circ$", "D. $100^\\circ$"], "answer": "A", "explain": "$\\widehat{A}+\\widehat{D}=180^\\circ$ nên $\\widehat{B}=120^\\circ$; $\\widehat{C}=180^\\circ-\\widehat{B}=60^\\circ$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Mọi hình thang cân đều là hình thang.", "b) Mọi hình thang đều là hình thang cân.", "c) Hình thang cân có hai cạnh bên bằng nhau.", "d) Hình thang có hai đường chéo bằng nhau là hình thang cân."], "answer": ["T", "F", "T", "T"], "explain": "a), c), d) Đúng. b) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{B}=100^\\circ$, $AD=7$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $\\widehat{A}=100^\\circ$.", "b) $\\widehat{C}=80^\\circ$.", "c) $BC=7$ cm.", "d) $AC \\perp BD$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "q": "Hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{C}=97^\\circ$. Tính số đo góc $\\widehat{D}$ (độ).", "answer": "97", "explain": "$\\widehat{D}=\\widehat{C}=97^\\circ$ (hai góc kề đáy $CD$)."}, {"type": "short", "level": "VDC", "q": "Hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}=60^\\circ$, $AB=9$ cm, $CD=17$ cm. Tính chu vi của hình thang (cm).", "answer": "42", "explain": "$DH=(17-9):2=4$ (cm); $AD=2\\cdot DH=8$ (cm); chu vi $=9+17+8+8=42$ (cm)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hình thang cân có hai đường chéo", "options": ["A. bằng nhau", "B. vuông góc", "C. cắt nhau tại trung điểm", "D. song song"], "answer": "A", "explain": "Trong hình thang cân, hai đường chéo bằng nhau."}, {"type": "mcq", "level": "NB", "q": "Trong hình thang cân $ABCD$ ($AB \\parallel CD$), cặp góc bằng nhau là", "options": ["A. $\\widehat{A}$ và $\\widehat{B}$", "B. $\\widehat{A}$ và $\\widehat{C}$", "C. $\\widehat{B}$ và $\\widehat{D}$", "D. $\\widehat{A}$ và $\\widehat{D}$"], "answer": "A", "explain": "Hai góc kề một đáy bằng nhau: $\\widehat{A}=\\widehat{B}$ và $\\widehat{C}=\\widehat{D}$."}, {"type": "mcq", "level": "NB", "q": "Hình thang có một góc vuông là", "options": ["A. hình thang vuông", "B. hình thang cân", "C. hình bình hành", "D. hình thoi"], "answer": "A", "explain": "Hình thang có một góc vuông là hình thang vuông."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{D}=88^\\circ$. Số đo góc $\\widehat{A}$ là", "options": ["A. $88^\\circ$", "B. $92^\\circ$", "C. $90^\\circ$", "D. $98^\\circ$"], "answer": "B", "explain": "$\\widehat{A}=180^\\circ-\\widehat{D}=92^\\circ$."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có chu vi $34$ cm, $AB=8$ cm, $AD=BC=7$ cm. Độ dài đáy lớn $CD$ là", "options": ["A. $12$ cm", "B. $13$ cm", "C. $10$ cm", "D. $11$ cm"], "answer": "A", "explain": "$CD=34-8-7-7=12$ (cm)."}, {"type": "mcq", "level": "VD", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{C}=2\\widehat{D}-40^\\circ$. Số đo góc $\\widehat{C}$ là", "options": ["A. $40^\\circ$", "B. $140^\\circ$", "C. $60^\\circ$", "D. $100^\\circ$"], "answer": "A", "explain": "Vì $\\widehat{C}=\\widehat{D}$ nên $\\widehat{C}=2\\widehat{C}-40^\\circ$, suy ra $\\widehat{C}=40^\\circ$."}, {"type": "truefalse", "level": "NB", "q": "Cho hình thang cân $EFGH$ ($EF \\parallel GH$). Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $\\widehat{E}=\\widehat{F}$.", "b) $\\widehat{G}=\\widehat{H}$.", "c) $EG=FH$.", "d) $EF=GH$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "q": "Cho hình thang $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}=\\widehat{D}=90^\\circ$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $ABCD$ là hình thang vuông.", "b) $\\widehat{B}+\\widehat{C}=180^\\circ$.", "c) Nếu $\\widehat{B}=100^\\circ$ thì $\\widehat{C}=80^\\circ$.", "d) $ABCD$ là hình thang cân."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "q": "Hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}=64^\\circ$. Tính số đo góc $\\widehat{D}$ (độ).", "answer": "116", "explain": "$\\widehat{D}=180^\\circ-\\widehat{A}=116^\\circ$."}, {"type": "short", "level": "VDC", "q": "Hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{D}=60^\\circ$, $AD=12$ cm, $CD=26$ cm. Tính độ dài đáy nhỏ $AB$ (cm).", "answer": "14", "explain": "$DH=AD\\cdot\\cos60^\\circ=6$ (cm); $AB=CD-2\\cdot DH=26-12=14$ (cm)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tứ giác có hai cạnh đối song song và hai góc kề một đáy bằng nhau là", "options": ["A. hình thang cân", "B. hình thang vuông", "C. hình bình hành", "D. tứ giác lồi bất kì"], "answer": "A", "explain": "Đó chính là định nghĩa hình thang cân."}, {"type": "mcq", "level": "NB", "q": "Trục đối xứng của hình thang cân là", "options": ["A. đường thẳng đi qua trung điểm hai đáy", "B. đường chéo của hình thang", "C. đường thẳng đi qua trung điểm hai cạnh bên", "D. hình thang cân không có trục đối xứng"], "answer": "A", "explain": "Trục đối xứng của hình thang cân là đường thẳng đi qua trung điểm hai đáy."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. Hình thang vuông có một góc vuông.", "B. Hình thang cân có hai đường chéo vuông góc.", "C. Hình thang có hai đáy bằng nhau.", "D. Hình thang cân có bốn cạnh bằng nhau."], "answer": "A", "explain": "Chỉ có A đúng theo định nghĩa."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $PQRS$ ($PQ \\parallel RS$) có $\\widehat{S}=70^\\circ$. Số đo góc $\\widehat{R}$ là", "options": ["A. $70^\\circ$", "B. $110^\\circ$", "C. $90^\\circ$", "D. $100^\\circ$"], "answer": "A", "explain": "$\\widehat{R}=\\widehat{S}=70^\\circ$ (hai góc kề đáy $RS$)."}, {"type": "mcq", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}=55^\\circ$. Tổng $\\widehat{B}+\\widehat{C}$ bằng", "options": ["A. $180^\\circ$", "B. $110^\\circ$", "C. $125^\\circ$", "D. $235^\\circ$"], "answer": "A", "explain": "$\\widehat{B}=\\widehat{A}=55^\\circ$, $\\widehat{C}=180^\\circ-55^\\circ=125^\\circ$ nên tổng bằng $180^\\circ$."}, {"type": "mcq", "level": "VD", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{A}+\\widehat{B}=160^\\circ$. Số đo góc $\\widehat{D}$ là", "options": ["A. $100^\\circ$", "B. $80^\\circ$", "C. $90^\\circ$", "D. $110^\\circ$"], "answer": "A", "explain": "$\\widehat{A}=\\widehat{B}=80^\\circ$ nên $\\widehat{D}=180^\\circ-80^\\circ=100^\\circ$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình thang cân có hai góc kề một đáy bằng nhau.", "b) Hình thang cân có hai đường chéo bằng nhau.", "c) Hình thang cân có hai cạnh bên song song với nhau.", "d) Hình thang vuông là trường hợp đặc biệt của hình thang."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai, hai cạnh bên của hình thang cân cắt nhau (không song song)."}, {"type": "truefalse", "level": "TH", "q": "Cho hình thang cân $ABCD$ ($AB \\parallel CD$) có đường chéo $BD=13$ cm, $\\widehat{A}=70^\\circ$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $AC=13$ cm.", "b) $\\widehat{B}=70^\\circ$.", "c) $\\widehat{D}=110^\\circ$.", "d) $AB=CD$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "q": "Hình thang cân $ABCD$ ($AB \\parallel CD$) có $\\widehat{B}=115^\\circ$. Tính số đo góc $\\widehat{C}$ (độ).", "answer": "65", "explain": "$\\widehat{C}=180^\\circ-\\widehat{B}=65^\\circ$."}, {"type": "short", "level": "VDC", "q": "Hình thang cân $ABCD$ ($AB \\parallel CD$) có $AB=12$ cm, $CD=22$ cm, $AD=13$ cm. Tính độ dài đường cao của hình thang (cm).", "answer": "12", "explain": "$DH=(22-12):2=5$ (cm); đường cao $=\\sqrt{13^2-5^2}=\\sqrt{144}=12$ (cm)."}]}]}
