<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word which has a different 'sl' / 'sn' sound from the others.", "options": ["A. sleep", "B. slow", "C. snake", "D. slim"], "answer": "C", "explain": "snake phát âm /sneɪk/ với cụm /sn/, ba từ còn lại phát âm với cụm /sl/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose initial 'sl' / 'sn' cluster sounds different from the others.", "options": ["A. small", "B. slide", "C. slow", "D. snow"], "answer": "D", "explain": "snow /snəʊ/ có cụm /sn/, các từ còn lại có cụm /sl/."}, {"type": "mcq", "level": "NB", "q": "Ha Long Bay is a natural _____ recognised by UNESCO as a World Heritage Site.", "options": ["A. paradise", "B. landslide", "C. volcano", "D. wonder"], "answer": "D", "explain": "wonder (kỳ quan): Vịnh Hạ Long là kỳ quan thiên nhiên được UNESCO công nhận."}, {"type": "mcq", "level": "TH", "q": "She asked me _____ I had ever visited Ha Long Bay.", "options": ["A. that", "B. what", "C. if", "D. why"], "answer": "C", "explain": "Câu hỏi Yes/No khi tường thuật dùng if hoặc whether + mệnh đề lùi thì."}, {"type": "mcq", "level": "VD", "q": "'Have you bought the tickets?' She asked me _____.", "options": ["A. if I have bought the tickets", "B. that I had bought the tickets", "C. if had I bought the tickets", "D. if I had bought the tickets"], "answer": "D", "explain": "Hiện tại hoàn thành (have bought) lùi thành quá khứ hoàn thành (had bought), bỏ đảo ngữ."}, {"type": "mcq", "level": "TH", "q": "Lan: 'Have you ever visited Son Doong Cave?' Nam: '_____'.", "options": ["A. Yes, I visited it last year.", "B. Yes, I do.", "C. No, I am not.", "D. Yes, it is beautiful."], "answer": "A", "explain": "Câu trả lời đúng thì và đúng ngữ cảnh: đã từng đến năm ngoái."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Ha Long Bay is in Quang Ninh Province in northern Viet Nam. It has about 1,600 limestone islands rising from the sea. UNESCO recognised it as a World Heritage Site in 1994. Many tourists take boat trips to explore its caves and grottos.", "statements": ["a) Ha Long Bay is in the south of Viet Nam.", "b) It has about 1,600 limestone islands.", "c) UNESCO recognised it as a World Heritage Site in 1994.", "d) Tourists can explore its caves by boat."], "answer": ["F", "T", "T", "T"], "explain": "a) F — Vịnh Hạ Long ở phía bắc (Quảng Ninh), không phải phía nam. b) T — bài đọc: about 1,600 limestone islands. c) T — bài đọc: recognised in 1994. d) T — bài đọc: take boat trips to explore caves."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Sustainable tourism is important for natural wonders. When too many tourists visit a place, the environment can be damaged. Local people should take part in protecting their heritage. Small groups and local guides help reduce harm to nature.", "statements": ["a) Sustainable tourism helps protect natural wonders.", "b) More tourists never cause any problems.", "c) Local people should join in protecting their heritage.", "d) Small groups and local guides reduce harm to nature."], "answer": ["T", "F", "T", "T"], "explain": "a) T — du lịch bền vững giúp bảo vệ kỳ quan. b) F — quá nhiều khách có thể gây hại môi trường. c) T — bài đọc: local people should take part. d) T — bài đọc: small groups and local guides help reduce harm."}, {"type": "short", "level": "VD", "q": "Complete the reported question with ONE word: She asked me _____ I had visited Hue before.", "answer": "if", "explain": "Câu hỏi Yes/No tường thuật dùng if (whether cũng đúng)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Ha Long Bay is one of the most (spectacle) _____ natural wonders in Viet Nam.", "answer": "spectacular", "explain": "Sau most cần tính từ: spectacular (kỳ vĩ, ngoạn mục)."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Pick the word with a different initial consonant cluster sound from the others.", "options": ["A. snack", "B. sleep", "C. slim", "D. sleeve"], "answer": "A", "explain": "snack /snæk/ có cụm /sn/, các từ còn lại có cụm /sl/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose 's' is pronounced differently from the others.", "options": ["A. snake", "B. snow", "C. slow", "D. island"], "answer": "D", "explain": "island /ˈaɪlənd/ có chữ s câm, không phát âm /s/ như các từ còn lại."}, {"type": "mcq", "level": "NB", "q": "The view of the bay from the mountain top is truly _____.", "options": ["A. ruinous", "B. sustainable", "C. breathtaking", "D. mysterious"], "answer": "C", "explain": "breathtaking (đẹp đến nghẹt thở): cảnh vịnh nhìn từ đỉnh núi thật ngoạn mục."}, {"type": "mcq", "level": "TH", "q": "He asked us _____ we wanted to join the boat trip.", "options": ["A. who", "B. which", "C. whose", "D. whether"], "answer": "D", "explain": "Câu hỏi Yes/No tường thuật dùng whether hoặc if."}, {"type": "mcq", "level": "VD", "q": "'Will you stay here overnight?' He asked us _____.", "options": ["A. if we would stay there overnight", "B. if we will stay here overnight", "C. whether we would stay here overnight", "D. that we would stay there overnight"], "answer": "A", "explain": "will lùi thành would, here đổi thành there trong câu tường thuật."}, {"type": "mcq", "level": "TH", "q": "Mai: 'The view is breathtaking!' Hoa: '_____'.", "options": ["A. I do not think so.", "B. Yes, it takes my breath away.", "C. No, it is not.", "D. I am fine, thanks."], "answer": "B", "explain": "Đáp lại lời khen cảnh đẹp một cách tự nhiên, đồng tình."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Son Doong Cave is in Phong Nha-Ke Bang National Park in Quang Binh Province. It is one of the largest caves in the world. The cave has its own weather system with clouds inside. Only a small number of tourists can visit it each year.", "statements": ["a) Son Doong is in Quang Binh Province.", "b) It is a small cave.", "c) There are clouds inside the cave.", "d) Millions of tourists visit it every year."], "answer": ["T", "F", "T", "F"], "explain": "a) T — bài đọc: in Quang Binh Province. b) F — là một trong những hang lớn nhất thế giới. c) T — bài đọc: its own weather system with clouds. d) F — chỉ một số ít khách được thăm mỗi năm."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Son Doong Cave was found by a local man in 1991, but it became famous after British explorers studied it in 2009. The cave is so large that a whole city block could fit inside. Because the cave is difficult to reach, tours are expensive and limited.", "statements": ["a) A local man found Son Doong in 1991.", "b) It became famous before the year 2000.", "c) The cave is large enough for a city block.", "d) Tours to Son Doong are cheap and open to everyone."], "answer": ["T", "F", "T", "F"], "explain": "a) T — bài đọc: found by a local man in 1991. b) F — nổi tiếng sau 2009. c) T — bài đọc: a whole city block could fit inside. d) F — tours are expensive and limited."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: He asked us whether we _____ (want) to join the boat tour.", "answer": "wanted", "explain": "Câu tường thuật lùi thì: hiện tại đơn (want) thành quá khứ đơn (wanted)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: (sustain) _____ tourism helps protect natural wonders for future generations.", "answer": "Sustainable", "explain": "Đầu câu cần tính từ: Sustainable (bền vững)."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word that does not share the same 'sl' / 'sn' sound as the others.", "options": ["A. slow", "B. snail", "C. slide", "D. the others.", "options": ["A. island", "B. sleep", "C. slow", "D. slim"], "answer": "A", "explain": "island có chữ s câm, các từ còn lại phát âm /s/."}, {"type": "mcq", "level": "NB", "q": "Son Doong Cave has giant _____ hanging from its ceiling.", "options": ["A. peaks", "B. stalactites", "C. reefs", "D. grottoes"], "answer": "B", "explain": "stalactites (thạch nhũ rủ xuống): nhũ đá treo từ trần hang."}, {"type": "mcq", "level": "TH", "q": "She asked me if I _____ Cham Island before.", "options": ["A. visit", "B. visited", "C. had visited", "D. will visit"], "answer": "C", "explain": "Câu tường thuật lùi thì, dùng quá khứ hoàn thành (had visited)."}, {"type": "mcq", "level": "VD", "q": "'Can you take photos inside the cave?' The tourist asked _____.", "options": ["A. if he can take photos inside the cave", "B. whether could he take photos inside the cave", "C. that he could take photos inside the cave", "D. if he could take photos inside the cave"], "answer": "D", "explain": "can lùi thành could, dùng if, không đảo ngữ trong câu tường thuật."}, {"type": "mcq", "level": "TH", "q": "'How was your trip to Hue?' '_____'.", "options": ["A. I am well.", "B. Yes, it was.", "C. Very much.", "D. It was wonderful."], "answer": "D", "explain": "Hỏi về chuyến đi thì trả lời bằng tính từ miêu tả: wonderful."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Phu Quoc is the largest island in Viet Nam. It is famous for white sand beaches and clear blue water. Tourists can enjoy snorkelling to see coral reefs. The island also has a national park with tropical forests.", "statements": ["a) Phu Quoc is the largest island in Viet Nam.", "b) Its beaches have black sand.", "c) Tourists can see coral reefs when snorkelling.", "d) There is a national park on the island."], "answer": ["T", "F", "T", "T"], "explain": "a) T — bài đọc: the largest island. b) F — bãi cát trắng (white sand). c) T — bài đọc: snorkelling to see coral reefs. d) T — bài đọc: has a national park."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many visitors throw rubbish when they travel. Plastic bottles and bags pollute beaches and rivers. Animals may eat plastic and die. Responsible tourists always take their rubbish home.", "statements": ["a) Littering is a problem at tourist places.", "b) Plastic rubbish does not harm animals.", "c) Animals may die after eating plastic.", "d) Responsible tourists leave rubbish at the beach."], "answer": ["T", "F", "T", "F"], "explain": "a) T — xả rác là vấn đề ở điểm du lịch. b) F — rác nhựa gây hại động vật. c) T — bài đọc: animals may eat plastic and die. d) F — khách có trách nhiệm mang rác về."}, {"type": "short", "level": "VD", "q": "Complete the reported question with ONE word: She asked him _____ he would stay overnight or not.", "answer": "whether", "explain": "Với cụm or not, whether tự nhiên hơn (if cũng chấp nhận được)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Son Doong is famous for its (mystery) _____ beauty.", "answer": "mysterious", "explain": "Sau tính từ sở hữu its cần tính từ: mysterious (bí ẩn)."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose beginning 'sl' / 'sn' sound is different from the others.", "options": ["A. slip", "B. snow", "C. slow", "D. sleep"], "answer": "B", "explain": "snow /snəʊ/ có cụm /sn/, các từ còn lại có cụm /sl/."}, {"type": "mcq", "level": "NB", "q": "Pick the word with a different 'sn' / 'sl' sound from the others.", "options": ["A. snail", "B. sleep", "C. sneeze", "D. snow"], "answer": "B", "explain": "sleep /sliːp/ có cụm /sl/, các từ còn lại có cụm /sn/."}, {"type": "mcq", "level": "NB", "q": "We should develop tourism in a _____ way to protect nature.", "options": ["A. mysterious", "B. breathtaking", "C. sustainable", "D. ruinous"], "answer": "C", "explain": "sustainable (bền vững): phát triển du lịch bền vững để bảo vệ thiên nhiên."}, {"type": "mcq", "level": "TH", "q": "They asked him _____ he could swim in the sea.", "options": ["A. what", "B. which", "C. that", "D. if"], "answer": "D", "explain": "Câu hỏi Yes/No tường thuật dùng if hoặc whether."}, {"type": "mcq", "level": "VD", "q": "She asked me whether I _____ to the top of Fansipan or not.", "options": ["A. had ever climbed", "B. have ever climbed", "C. ever climb", "D. will ever climb"], "answer": "A", "explain": "Hiện tại hoàn thành (have climbed) lùi thành quá khứ hoàn thành (had climbed)."}, {"type": "mcq", "level": "TH", "q": "'Shall we go snorkelling this afternoon?' '_____'.", "options": ["A. Good idea.", "B. I am sorry.", "C. Yes, I shall.", "D. No, we shall."], "answer": "A", "explain": "Đồng ý với đề xuất: Good idea."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Fansipan is the highest mountain in Indochina at 3,143 metres. It is in Lao Cai Province near Sa Pa town. Many climbers spend two days reaching the top. From the peak, visitors can see a sea of clouds on clear days.", "statements": ["a) Fansipan is 3,143 metres high.", "b) It is near Sa Pa town.", "c) Climbers can reach the top in one hour.", "d) Visitors may see clouds from the peak."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: 3,143 metres. b) T — bài đọc: near Sa Pa town. c) F — mất hai ngày leo núi. d) T — bài đọc: see a sea of clouds."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Ha Long Bay faces pollution from boats and nearby cities. Oil and waste from boats dirty the water. The local government now limits the number of boats each day. Cleaner water will bring back fish and attract more tourists.", "statements": ["a) Boats cause pollution in Ha Long Bay.", "b) The government encourages more boats every day.", "c) Limiting boats helps protect the bay.", "d) Clean water is good for tourism."], "answer": ["T", "F", "T", "T"], "explain": "a) T — bài đọc: pollution from boats. b) F — chính quyền hạn chế số tàu. c) T — suy ra: hạn chế tàu giúp bảo vệ vịnh. d) T — suy ra: nước sạch thu hút khách."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: The guide asked if everyone _____ (bring) their tickets.", "answer": "had brought", "explain": "Quá khứ đơn (brought) trong câu tường thuật lùi thành quá khứ hoàn thành (had brought)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The (preserve) _____ of coral reefs is very important.", "answer": "preservation", "explain": "Sau mạo từ the cần danh từ: preservation (sự bảo tồn)."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Find the word with a different 'sl' / 'sn' pronunciation from the others.", "options": ["A. slim", "B. slide", "C. slow", "D. snap"], "answer": "D", "explain": "snap /snæp/ có cụm /sn/, các từ còn lại có cụm /sl/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose 's' sound is different from the others.", "options": ["A. slow", "B. snow", "C. island", "D. sleep"], "answer": "C", "explain": "island có chữ s câm, các từ còn lại phát âm /s/."}, {"type": "mcq", "level": "NB", "q": "The _____ of Ninh Binh with rivers and limestone mountains attracts many visitors.", "options": ["A. landscape", "B. wonder", "C. volcano", "D. paradise"], "answer": "A", "explain": "landscape (phong cảnh): phong cảnh Ninh Bình thu hút du khách."}, {"type": "mcq", "level": "TH", "q": "My teacher asked me whether I _____ the documentary about Son Doong.", "options": ["A. watched", "B. had watched", "C. watch", "D. will watch"], "answer": "B", "explain": "Quá khứ đơn (watched) lùi thành quá khứ hoàn thành (had watched)."}, {"type": "mcq", "level": "VD", "q": "He asked if the boat _____ at 8 a.m. the next morning.", "options": ["A. leaves", "B. would leave", "C. left", "D. will leave"], "answer": "B", "explain": "will lùi thành would trong câu tường thuật."}, {"type": "mcq", "level": "TH", "q": "'Do you think we should hire a local guide?' '_____'.", "options": ["A. Yes, I think it is a good idea.", "B. Yes, I do not.", "C. No, I think.", "D. I am thinking."], "answer": "A", "explain": "Đồng tình với gợi ý một cách đầy đủ, lịch sự."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Trang An in Ninh Binh is called 'Ha Long Bay on land'. It has limestone mountains, caves and rivers. Tourists sit on small boats to travel through the caves. The area was recognised by UNESCO in 2014.", "statements": ["a) Trang An is in Ninh Binh.", "b) It is called 'Ha Long Bay on land'.", "c) Tourists travel through caves on large ships.", "d) UNESCO recognised it in 2014."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: Trang An in Ninh Binh. b) T — bài đọc: called 'Ha Long Bay on land'. c) F — đi thuyền nhỏ (small boats), không phải tàu lớn. d) T — bài đọc: recognised by UNESCO in 2014."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Homestays near natural wonders give tourists real local experiences. Guests eat local food and learn traditions. The money stays in the village and helps families. This kind of tourism protects culture and nature.", "statements": ["a) Homestays offer real local experiences.", "b) Guests only eat fast food at homestays.", "c) Homestay money helps local families.", "d) This tourism protects culture and nature."], "answer": ["T", "F", "T", "T"], "explain": "a) T — bài đọc: real local experiences. b) F — ăn món địa phương (local food). c) T — bài đọc: helps families. d) T — bài đọc: protects culture and nature."}, {"type": "short", "level": "VD", "q": "Complete the reported question with ONE word: He asked me _____ I knew the way to the waterfall.", "answer": "if", "explain": "Câu hỏi Yes/No tường thuật dùng if (whether cũng đúng)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Tourists were amazed by the (breathe) _____ view from the peak.", "answer": "breathtaking", "explain": "Cụm tính từ quen thuộc: breathtaking view (cảnh đẹp đến nghẹt thở)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word pronounced with a different initial cluster ('sl' / 'sn').", "options": ["A. sleeve", "B. snail", "C. slow", "D. sleep"], "answer": "B", "explain": "snail /sneɪl/ có cụm /sn/, các từ còn lại có cụm /sl/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose initial cluster is pronounced differently from the others.", "options": ["A. slim", "B. snap", "C. sneeze", "D. snake"], "answer": "A", "explain": "slim /slɪm/ có cụm /sl/, các từ còn lại có cụm /sn/."}, {"type": "mcq", "level": "NB", "q": "_____ are mounds of limestone rising from the cave floor.", "options": ["A. Volcanoes", "B. Stalagmites", "C. Peaks", "D. Reefs"], "answer": "B", "explain": "Stalagmites (măng đá): khối đá vôi mọc lên từ nền hang."}, {"type": "mcq", "level": "TH", "q": "He asked her if she _____ to Phong Nha the following week.", "options": ["A. will go", "B. goes", "C. went", "D. would go"], "answer": "D", "explain": "will lùi thành would; the following week ứng với next week."}, {"type": "mcq", "level": "VD", "q": "'Is this the way to the grotto?' She asked _____.", "options": ["A. if that was the way to the grotto", "B. if this is the way to the grotto", "C. that that was the way to the grotto", "D. whether was that the way to the grotto"], "answer": "A", "explain": "Hiện tại đơn (is) lùi thành quá khứ đơn (was), this đổi thành that."}, {"type": "mcq", "level": "TH", "q": "'What a majestic waterfall!' '_____'.", "options": ["A. Yes, it is very tall.", "B. No, it is not.", "C. I agree, it is amazing.", "D. Thank you."], "answer": "C", "explain": "Đáp lại câu cảm thán bằng sự đồng tình."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Ba Be Lake is the largest natural lake in Viet Nam. It is in Bac Kan Province in the north. The lake is surrounded by limestone mountains and forests. Tourists can stay in homestays of the Tay ethnic people near the lake.", "statements": ["a) Ba Be is the largest natural lake in Viet Nam.", "b) It is in the south of Viet Nam.", "c) The lake is surrounded by mountains and forests.", "d) Tourists can stay in homestays near the lake."], "answer": ["T", "F", "T", "T"], "explain": "a) T — bài đọc: the largest natural lake. b) F — ở phía bắc (Bac Kan). c) T — bài đọc: surrounded by limestone mountains and forests. d) T — bài đọc: stay in homestays."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Phong Nha caves were formed millions of years ago. Water slowly shaped the limestone into strange shapes. Some chambers are as tall as a 40-storey building. Scientists are still discovering new passages.", "statements": ["a) The caves are millions of years old.", "b) Water helped shape the caves.", "c) All passages have been fully explored.", "d) Some chambers are extremely tall."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: formed millions of years ago. b) T — bài đọc: water slowly shaped the limestone. c) F — các nhà khoa học vẫn đang khám phá lối mới. d) T — bài đọc: as tall as a 40-storey building."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: They asked whether the cave _____ (be) open the next day.", "answer": "would be", "explain": "will lùi thành would trong câu tường thuật."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Phong Nha is a UNESCO World (heritage) _____ Site.", "answer": "Heritage", "explain": "Tên gọi chính thức: World Heritage Site (Di sản Thế giới)."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Which of the following words has a different 'sl' / 'sn' sound? Choose one.", "options": ["A. slow", "B. small", "C. snow", "D. slim"], "answer": "C", "explain": "snow /snəʊ/ có cụm /sn/, các từ còn lại có cụm /sl/."}, {"type": "mcq", "level": "NB", "q": "Which word has a different 'sn' sound from the others? Choose the odd one out.", "options": ["A. small", "B. snore", "C. snoop", "D. sneeze"], "answer": "A", "explain": "small /smɔːl/ có cụm /sm/ khác với cụm /sn/ của các từ còn lại."}, {"type": "mcq", "level": "NB", "q": "Fansipan is the highest _____ in Indochina.", "options": ["A. grotto", "B. reef", "C. peak", "D. wonder"], "answer": "C", "explain": "peak (đỉnh núi): Fansipan là đỉnh núi cao nhất Đông Dương."}, {"type": "mcq", "level": "TH", "q": "The tourist asked the guide _____ the cave was open to visitors.", "options": ["A. what", "B. whether", "C. who", "D. whose"], "answer": "B", "explain": "Câu hỏi Yes/No tường thuật dùng whether hoặc if."}, {"type": "mcq", "level": "VD", "q": "They asked us if we _____ any souvenirs yet.", "options": ["A. bought", "B. had bought", "C. buy", "D. will buy"], "answer": "B", "explain": "Với yet trong câu tường thuật, dùng quá khứ hoàn thành (had bought)."}, {"type": "mcq", "level": "TH", "q": "'Have you booked the hotel yet?' '_____'.", "options": ["A. Yes, I have.", "B. Yes, I do.", "C. No, I have.", "D. Not at all."], "answer": "A", "explain": "Câu trả lời ngắn đúng thì hiện tại hoàn thành: Yes, I have."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Mui Ne in Binh Thuan Province is famous for its sand dunes. The red and white dunes change shape with the wind. Tourists enjoy sandboarding on the dunes. Mui Ne also has beautiful beaches for swimming and surfing.", "statements": ["a) Mui Ne is famous for sand dunes.", "b) The dunes never change shape.", "c) Tourists can try sandboarding there.", "d) Mui Ne has beaches for swimming."], "answer": ["T", "F", "T", "T"], "explain": "a) T — bài đọc: famous for its sand dunes. b) F — cồn cát đổi hình theo gió. c) T — bài đọc: enjoy sandboarding. d) T — bài đọc: beautiful beaches for swimming and surfing."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Tour guides play an important part in sustainable tourism. Good guides teach visitors about nature and history. They remind tourists not to damage the environment. A knowledgeable guide makes the trip more meaningful.", "statements": ["a) Guides are not important for tourism.", "b) Good guides teach visitors about nature.", "c) Guides remind tourists to protect the environment.", "d) A good guide improves the trip."], "answer": ["F", "T", "T", "T"], "explain": "a) F — hướng dẫn viên đóng vai trò quan trọng. b) T — bài đọc: teach visitors about nature and history. c) T — bài đọc: remind tourists not to damage the environment. d) T — bài đọc: makes the trip more meaningful."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: She asked us if we _____ (see) the sunrise that morning.", "answer": "had seen", "explain": "Quá khứ đơn (saw) lùi thành quá khứ hoàn thành (had seen)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The cave system was formed (nature) _____ over millions of years.", "answer": "naturally", "explain": "Cần trạng từ bổ nghĩa cho động từ formed: naturally (một cách tự nhiên)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word that sounds different in its initial 'sl' / 'sn' cluster.", "options": ["A. sleep", "B. slide", "C. snack", "D. slow"], "answer": "C", "explain": "snack /snæk/ có cụm /sn/, các từ còn lại có cụm /sl/."}, {"type": "mcq", "level": "NB", "q": "Which word has a different 's' sound from the others? Choose the odd one out.", "options": ["A. snake", "B. island", "C. sneeze", "D. snow"], "answer": "B", "explain": "island có chữ s câm, các từ còn lại phát âm /s/."}, {"type": "mcq", "level": "NB", "q": "The government is trying to _____ the ancient temples in My Son.", "options": ["A. erode", "B. wander", "C. preserve", "D. estimate"], "answer": "C", "explain": "preserve (bảo tồn): bảo tồn đền tháp cổ ở Mỹ Sơn."}, {"type": "mcq", "level": "TH", "q": "She asked us if we _____ tired after the long trek.", "options": ["A. are", "B. were", "C. will be", "D. have been"], "answer": "B", "explain": "Hiện tại đơn (are) lùi thành quá khứ đơn (were)."}, {"type": "mcq", "level": "VD", "q": "The teacher asked whether all the students _____ their permission slips.", "options": ["A. brought", "B. had brought", "C. bring", "D. will bring"], "answer": "B", "explain": "Quá khứ đơn (brought) lùi thành quá khứ hoàn thành (had brought)."}, {"type": "mcq", "level": "TH", "q": "'Let's protect the coral reefs when we dive.' '_____'.", "options": ["A. I don't agree.", "B. Never mind.", "C. You are welcome.", "D. That's a good point."], "answer": "D", "explain": "Đồng tình với đề xuất bảo vệ rạn san hô."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Cat Ba Island is near Ha Long Bay in Hai Phong. It has a national park with many kinds of animals. Lan Ha Bay next to Cat Ba has clear water for kayaking. Many tourists cycle around the island to enjoy nature.", "statements": ["a) Cat Ba Island is near Ha Long Bay.", "b) It has a national park.", "c) Lan Ha Bay is good for kayaking.", "d) Tourists cannot cycle on the island."], "answer": ["T", "T", "T", "F"], "explain": "a) T — bài đọc: near Ha Long Bay. b) T — bài đọc: has a national park. c) T — bài đọc: clear water for kayaking. d) F — du khách đạp xe quanh đảo."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Travelling in the low season has advantages. Prices for hotels and tours are lower. Famous places are less crowded and more peaceful. However, the weather may not be as good as in the high season.", "statements": ["a) Low season travel is cheaper.", "b) Places are more crowded in the low season.", "c) Low season trips are more peaceful.", "d) The weather is always perfect in the low season."], "answer": ["T", "F", "T", "F"], "explain": "a) T — bài đọc: prices are lower. b) F — ít đông đúc hơn (less crowded). c) T — bài đọc: more peaceful. d) F — thời tiết có thể không đẹp bằng mùa cao điểm."}, {"type": "short", "level": "VD", "q": "Complete the reported question with ONE word: He asked me _____ I liked Vietnamese food.", "answer": "if", "explain": "Câu hỏi Yes/No tường thuật dùng if (whether cũng đúng)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Before (explore) _____ the caves, visitors must wear helmets.", "answer": "exploring", "explain": "Sau giới từ before dùng V-ing: exploring (trước khi khám phá)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Identify the word with a different 'sl' / 'sn' sound from the other three.", "options": ["A. sleep", "B. slow", "C. island", "D. slide"], "answer": "C", "explain": "island có chữ s câm, các từ còn lại có cụm /sl/."}, {"type": "mcq", "level": "NB", "q": "Find the word with a different 'sn' / 'sl' pronunciation from the others.", "options": ["A. slow", "B. snore", "C. snoop", "D. sneeze"], "answer": "A", "explain": "slow /sləʊ/ có cụm /sl/, các từ còn lại có cụm /sn/."}, {"type": "mcq", "level": "NB", "q": "Hon Mun is famous for its beautiful _____ with colourful fish.", "options": ["A. volcanoes", "B. landslides", "C. paradises", "D. coral reefs"], "answer": "D", "explain": "coral reefs (rạn san hô): Hòn Mun nổi tiếng với rạn san hô."}, {"type": "mcq", "level": "TH", "q": "The receptionist asked us _____ we had booked a room.", "options": ["A. that", "B. what", "C. if", "D. why"], "answer": "C", "explain": "Câu hỏi Yes/No tường thuật dùng if hoặc whether."}, {"type": "mcq", "level": "VD", "q": "'Do you need a guide?' He asked me _____.", "options": ["A. if I need a guide", "B. that I needed a guide", "C. whether did I need a guide", "D. if I needed a guide"], "answer": "D", "explain": "Hiện tại đơn (do need) lùi thành quá khứ đơn (needed), bỏ trợ động từ do."}, {"type": "mcq", "level": "TH", "q": "'Excuse me, is this the way to the ticket office?' '_____'.", "options": ["A. Yes, go straight ahead.", "B. No, it isn't.", "C. I am a tourist.", "D. Yes, I am."], "answer": "A", "explain": "Chỉ đường lịch sự: đi thẳng phía trước."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Con Dao Islands are in the south of Viet Nam. They have beautiful beaches and coral reefs for diving. The islands were once a prison during the war. Today, Con Dao is a peaceful place for eco-tourism.", "statements": ["a) Con Dao Islands are in southern Viet Nam.", "b) Tourists can dive to see coral reefs.", "c) The islands were once a prison.", "d) Con Dao is a noisy industrial city."], "answer": ["T", "T", "T", "F"], "explain": "a) T — bài đọc: in the south of Viet Nam. b) T — bài đọc: coral reefs for diving. c) T — bài đọc: once a prison during the war. d) F — nơi yên bình cho du lịch sinh thái."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). National parks protect both nature and wildlife. Rangers stop illegal hunting and logging. Visitors must follow rules such as staying on paths. Entrance fees help pay for protection work.", "statements": ["a) National parks protect nature and wildlife.", "b) Rangers allow illegal hunting.", "c) Visitors should stay on paths.", "d) Entrance fees support protection."], "answer": ["T", "F", "T", "T"], "explain": "a) T — bài đọc: protect both nature and wildlife. b) F — kiểm lâm ngăn chặn săn bắn trái phép. c) T — bài đọc: staying on paths. d) T — bài đọc: help pay for protection work."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: They asked if we _____ (will) come back the following year.", "answer": "would", "explain": "will lùi thành would trong câu tường thuật."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The (magnificent) _____ of the bay left us speechless.", "answer": "magnificence", "explain": "Sau mạo từ the cần danh từ: magnificence (vẻ tráng lệ)."}]}]}</script>
