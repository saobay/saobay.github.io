<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. map", "B. hat", "C. park", "D. cat"], "answer": "C", "explain": "park đọc là /pɑːk/ với âm /ɑː/, còn map, hat, cat đọc với âm /æ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. community", "B. artisan", "C. preserve", "D. pottery"], "answer": "D", "explain": "pottery nhấn âm 1, còn community, artisan, preserve nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "The _____ in Bat Trang village make beautiful ceramic products by hand.", "options": ["A. artisans", "B. tourists", "C. drivers", "D. farmers"], "answer": "A", "explain": "artisan (nghệ nhân) là người làm ra sản phẩm thủ công."}, {"type": "mcq", "level": "TH", "q": "She showed me _____ to weave a basket.", "options": ["A. what", "B. how", "C. where", "D. when"], "answer": "B", "explain": "Cấu trúc: show somebody how to do something (chỉ cho ai cách làm gì)."}, {"type": "mcq", "level": "VD", "q": "The family has _____ the craft _____ from father to son for 200 years.", "options": ["A. passed / down", "B. taken / over", "C. set / up", "D. run / out of"], "answer": "A", "explain": "pass down (truyền lại) phù hợp với nghĩa truyền nghề qua nhiều thế hệ."}, {"type": "mcq", "level": "VDC", "q": "Not only does the village preserve old crafts, _____ it attracts thousands of tourists each year.", "options": ["A. but", "B. and", "C. so", "D. or"], "answer": "A", "explain": "Cấu trúc song hành: Not only... but also... (Không những... mà còn...)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Bat Trang is a famous pottery village near Ha Noi. It has a history of more than 700 years. Artisans there make beautiful ceramic products by hand. Many tourists visit the village every year to try making pottery themselves.", "statements": ["a) Bat Trang is famous for pottery.", "b) The village is over 700 years old.", "c) Tourists cannot try making pottery there.", "d) Artisans make products by machine."], "answer": ["T", "T", "F", "F"], "explain": "a) T (làng gốm nổi tiếng). b) T (hơn 700 năm). c) F (du khách được tự tay làm gốm). d) F (làm bằng tay, không phải bằng máy)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Dong Ho is a traditional painting village in Bac Ninh. In the past, people made paintings for the Tet holiday. The colours come from natural materials like leaves and shells. Today, fewer young people learn this craft, so the village is trying to preserve it.", "statements": ["a) Dong Ho paintings were made for Tet.", "b) The colours come from natural materials.", "c) Many young people are learning the craft now.", "d) The village wants to preserve the craft."], "answer": ["T", "T", "F", "T"], "explain": "a) T (tranh làm cho dịp Tết). b) T (màu từ lá cây, vỏ sò). c) F (ngày càng ít người trẻ học nghề). d) T (làng đang cố bảo tồn)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The artisan showed us _____ to make a clay pot.", "answer": "how", "explain": "show somebody how to do something: chỉ cho ai cách làm gì."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The village is famous for its (tradition) _____ crafts.", "answer": "traditional", "explain": "Trước danh từ crafts cần tính từ: tradition thành traditional."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. start", "B. car", "C. hand", "D. garden"], "answer": "C", "explain": "hand đọc là /hænd/ với âm /æ/, còn start, car, garden đọc với âm /ɑː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. handicraft", "B. memorable", "C. fragrance", "D. embroider"], "answer": "D", "explain": "embroider nhấn âm 2, còn handicraft, memorable, fragrance nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "A _____ is an object made by hand, such as a basket or a pot.", "options": ["A. handicraft", "B. machine", "C. vehicle", "D. building"], "answer": "A", "explain": "handicraft (đồ thủ công) là vật được làm bằng tay."}, {"type": "mcq", "level": "TH", "q": "I don't know _____ to go this weekend.", "options": ["A. when", "B. where", "C. that", "D. which"], "answer": "B", "explain": "Cấu trúc: question word + to V. where to go (đi đâu) phù hợp nhất."}, {"type": "mcq", "level": "VD", "q": "They _____ a new pottery workshop last year.", "options": ["A. set up", "B. passed down", "C. took over", "D. ran out of"], "answer": "A", "explain": "set up (thành lập, mở) phù hợp với việc mở xưởng mới."}, {"type": "mcq", "level": "VDC", "q": "Had the villagers not preserved their craft, the village _____ its fame long ago.", "options": ["A. would have lost", "B. will lose", "C. loses", "D. would lose"], "answer": "A", "explain": "Câu điều kiện loại 3 đảo ngữ: Had + S + V3, S + would have + V3."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). My village is famous for making conical hats. My mother is an artisan. She can make ten hats a day. I am learning to make them from her.", "statements": ["a) The village is famous for conical hats.", "b) Her mother makes ten hats a week.", "c) She is learning from her mother.", "d) She can make hats alone now."], "answer": ["T", "F", "T", "F"], "explain": "a) T (làng nổi tiếng với nón lá). b) F (mười chiếc một ngày, không phải một tuần). c) T (đang học từ mẹ). d) F (đoạn văn chỉ nói đang học, chưa nói làm được một mình)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many craft villages are struggling to survive. Young people prefer to work in cities, so few learn the traditional skills. Some villages have opened workshops for tourists to experience the crafts. This helps artisans earn money and keeps the traditions alive.", "statements": ["a) All craft villages are developing well.", "b) Few young people learn traditional skills.", "c) Tourist workshops help artisans earn money.", "d) These activities help preserve traditions."], "answer": ["F", "T", "T", "T"], "explain": "a) F (nhiều làng nghề đang chật vật tồn tại). b) T (ít người trẻ học nghề). c) T (xưởng cho du khách giúp nghệ nhân kiếm tiền). d) T (giữ nghề truyền thống sống mãi)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: They have lived in the village _____ 2010.", "answer": "since", "explain": "since + mốc thời gian (2010) trong thì hiện tại hoàn thành."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: He is a skilled (art) _____.", "answer": "artisan", "explain": "Sau mạo từ a cần danh từ chỉ người: art thành artisan (nghệ nhân)."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. father", "B. class", "C. glass", "D. happy"], "answer": "D", "explain": "happy đọc là /ˈhæpi/ với âm /æ/, còn father, class, glass đọc với âm /ɑː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. preserve", "B. produce", "C. product", "D. protect"], "answer": "C", "explain": "product là danh từ nhấn âm 1, còn preserve, produce (động từ), protect nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "We should _____ our traditional crafts for future generations.", "options": ["A. preserve", "B. destroy", "C. forget", "D. ignore"], "answer": "A", "explain": "preserve (bảo tồn) phù hợp với việc giữ gìn nghề truyền thống."}, {"type": "mcq", "level": "TH", "q": "Could you tell me _____ to get to the pottery village?", "options": ["A. how", "B. what", "C. that", "D. why"], "answer": "A", "explain": "Cấu trúc: tell somebody how to do something (cho ai biết cách làm gì)."}, {"type": "mcq", "level": "VD", "q": "We _____ clay, so we stopped making pots.", "options": ["A. ran out of", "B. passed down", "C. set up", "D. looked forward to"], "answer": "A", "explain": "run out of (hết sạch, cạn kiệt) phù hợp với việc dừng làm gốm."}, {"type": "mcq", "level": "VDC", "q": "The painting, _____ colours come from nature, is very valuable.", "options": ["A. whose", "B. which", "C. that", "D. whom"], "answer": "A", "explain": "whose + danh từ (colours) chỉ sự sở hữu: bức tranh mà màu sắc của nó đến từ thiên nhiên."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last Sunday, our class visited a craft village. We watched artisans carve wood. We also tried to paint masks. It was a memorable trip for all of us.", "statements": ["a) The class visited a craft village last Sunday.", "b) They watched artisans carve stone.", "c) They tried painting masks.", "d) The trip was boring."], "answer": ["T", "F", "T", "F"], "explain": "a) T (thăm làng nghề Chủ nhật trước). b) F (chạm gỗ, không phải chạm đá). c) T (thử vẽ mặt nạ). d) F (chuyến đi đáng nhớ, không chán)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). To preserve a craft, artisans must pass their skills down to the next generation. They also need to find new markets for their products. The government has supported some villages with training courses. However, preserving crafts still faces many difficulties.", "statements": ["a) Passing skills to the next generation helps preserve crafts.", "b) Finding new markets is unnecessary.", "c) The government has supported some villages.", "d) Preserving crafts is easy."], "answer": ["T", "F", "T", "F"], "explain": "a) T (truyền nghề cho thế hệ sau giúp bảo tồn). b) F (cần tìm thị trường mới). c) T (chính phủ đã hỗ trợ khóa đào tạo). d) F (vẫn còn nhiều khó khăn)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: We ran _____ of paint yesterday.", "answer": "out", "explain": "Cụm động từ run out of (hết sạch): chỗ trống cần out."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She has many (create) _____ ideas.", "answer": "creative", "explain": "Trước danh từ ideas cần tính từ: create thành creative (sáng tạo)."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. heart", "B. smart", "C. dark", "D. hat"], "answer": "D", "explain": "hat đọc là /hæt/ với âm /æ/, còn heart, smart, dark đọc với âm /ɑː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. famous", "B. skilful", "C. local", "D. unique"], "answer": "D", "explain": "unique nhấn âm 2, còn famous, skilful, local nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "My grandmother taught me how to _____ flowers on cloth.", "options": ["A. embroider", "B. cook", "C. drive", "D. sing"], "answer": "A", "explain": "embroider (thêu) hoa lên vải là đáp án đúng."}, {"type": "mcq", "level": "TH", "q": "He wondered _____ to do with the broken vase.", "options": ["A. what", "B. that", "C. this", "D. it"], "answer": "A", "explain": "Cấu trúc: wonder + what to do (tự hỏi nên làm gì). that, this, it không phải từ để hỏi."}, {"type": "mcq", "level": "VD", "q": "After his father retired, he _____ the family business.", "options": ["A. took over", "B. passed down", "C. set up", "D. came back"], "answer": "A", "explain": "take over (tiếp quản) phù hợp với việc nhận lại cơ nghiệp gia đình."}, {"type": "mcq", "level": "VDC", "q": "She advised me _____ the pottery in the shade to dry slowly.", "options": ["A. to leave", "B. leave", "C. leaving", "D. left"], "answer": "A", "explain": "Cấu trúc: advise somebody to V (khuyên ai làm gì)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Lacquerware is a traditional Vietnamese craft. Artisans cover wood or bamboo with many layers of lacquer. Each layer must dry completely. A beautiful product may take months to finish.", "statements": ["a) Lacquerware is a traditional craft.", "b) Artisans use only one layer of lacquer.", "c) Each layer must dry completely.", "d) A product can take months to finish."], "answer": ["T", "F", "T", "T"], "explain": "a) T (đồ sơn mài là nghề truyền thống). b) F (phủ nhiều lớp sơn). c) T (mỗi lớp phải khô hẳn). d) T (có thể mất hàng tháng)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Community activities bring people closer together. In my neighbourhood, we clean the streets every month. We also help poor families with food and clothes. These small actions make our community stronger.", "statements": ["a) Community activities bring people closer.", "b) People clean the streets every week.", "c) They help poor families.", "d) Small actions can strengthen the community."], "answer": ["T", "F", "T", "T"], "explain": "a) T (hoạt động cộng đồng gắn kết mọi người). b) F (dọn phố mỗi tháng, không phải mỗi tuần). c) T (giúp gia đình nghèo). d) T (việc nhỏ làm cộng đồng mạnh hơn)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: She is proud _____ her hometown craft.", "answer": "of", "explain": "Cấu trúc: be proud of (tự hào về)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The (preserve) _____ of old crafts is very important.", "answer": "preservation", "explain": "Sau mạo từ The cần danh từ: preserve thành preservation (sự bảo tồn)."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. after", "B. answer", "C. dance", "D. cat"], "answer": "D", "explain": "cat đọc là /kæt/ với âm /æ/, còn after, answer, dance đọc với âm /ɑː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. pottery", "B. village", "C. bamboo", "D. remind"], "answer": "D", "explain": "remind nhấn âm 2, còn pottery, village, bamboo nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "The village is famous _____ its pottery products.", "options": ["A. for", "B. with", "C. of", "D. about"], "answer": "A", "explain": "Cấu trúc: be famous for (nổi tiếng về)."}, {"type": "mcq", "level": "TH", "q": "They decided _____ up a workshop in the village.", "options": ["A. to set", "B. set", "C. setting", "D. sets"], "answer": "A", "explain": "Cấu trúc: decide to V (quyết định làm gì). set up (mở xưởng)."}, {"type": "mcq", "level": "VD", "q": "The old craft village is in danger of _____ down.", "options": ["A. closing", "B. setting", "C. passing", "D. taking"], "answer": "A", "explain": "close down (đóng cửa hẳn). Sau giới từ of dùng V-ing."}, {"type": "mcq", "level": "VDC", "q": "It was the artisan _____ taught me to make pottery.", "options": ["A. who", "B. whom", "C. which", "D. whose"], "answer": "A", "explain": "Câu chẻ nhấn mạnh chủ ngữ chỉ người: It was + người + who + V."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). The Mid-Autumn Festival is important in my community. Children carry colourful lanterns. Families eat mooncakes together. Everyone feels happy and close.", "statements": ["a) The Mid-Autumn Festival is important in the community.", "b) Children carry colourful lanterns.", "c) Families eat mooncakes separately.", "d) People feel happy and close."], "answer": ["T", "T", "F", "T"], "explain": "a) T (Tết Trung thu quan trọng). b) T (trẻ em rước đèn). c) F (ăn bánh cùng nhau, không riêng lẻ). d) T (mọi người vui vẻ, gần gũi)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Although machines can make products faster, handmade crafts are still valuable. Each product shows the skill and patience of the artisan. That is why many people prefer handmade goods. Supporting artisans helps preserve cultural heritage.", "statements": ["a) Machines make products faster than hands.", "b) Handmade crafts show the artisan's skill.", "c) Nobody prefers handmade goods.", "d) Supporting artisans preserves cultural heritage."], "answer": ["T", "T", "F", "T"], "explain": "a) T (máy làm nhanh hơn tay). b) T (đồ handmade thể hiện kỹ năng). c) F (nhiều người thích đồ handmade). d) T (ủng hộ nghệ nhân giúp bảo tồn di sản)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The workshop opens _____ 8 a.m. every day.", "answer": "at", "explain": "at + giờ cụ thể (8 a.m.)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: They wore (culture) _____ costumes at the festival.", "answer": "cultural", "explain": "Trước danh từ costumes cần tính từ: culture thành cultural (thuộc văn hóa)."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. basket", "B. castle", "C. fast", "D. apple"], "answer": "D", "explain": "apple đọc là /ˈæpl/ với âm /æ/, còn basket, castle, fast đọc với âm /ɑː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. tradition", "B. custom", "C. culture", "D. habit"], "answer": "A", "explain": "tradition nhấn âm 2, còn custom, culture, habit nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Tourists love to buy _____ as souvenirs when they visit craft villages.", "options": ["A. handicrafts", "B. machines", "C. tickets", "D. petrol"], "answer": "A", "explain": "Du khách mua đồ thủ công (handicrafts) làm quà lưu niệm."}, {"type": "mcq", "level": "TH", "q": "My father taught me _____ to carve wood when I was ten.", "options": ["A. how", "B. what", "C. that", "D. which"], "answer": "A", "explain": "Cấu trúc: teach somebody how to do something (dạy ai cách làm gì)."}, {"type": "mcq", "level": "VD", "q": "The artisans _____ their skills _____ to the younger generation.", "options": ["A. passed / down", "B. took / over", "C. set / up", "D. ran / out of"], "answer": "A", "explain": "pass skills down (truyền kỹ năng lại) cho thế hệ trẻ."}, {"type": "mcq", "level": "VDC", "q": "The workshop _____ we visited yesterday is 300 years old.", "options": ["A. which", "B. what", "C. where", "D. when"], "answer": "A", "explain": "Đại từ quan hệ chỉ vật (workshop): which. what không làm đại từ quan hệ."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). My grandfather was a skilled carpenter. He made beautiful wooden furniture. He taught my father the craft. Now my father has his own workshop in the village.", "statements": ["a) His grandfather was a carpenter.", "b) He made wooden furniture.", "c) He taught the craft to his son.", "d) His father works in the city now."], "answer": ["T", "T", "T", "F"], "explain": "a) T (ông là thợ mộc). b) T (làm đồ gỗ đẹp). c) T (truyền nghề cho con trai). d) F (bố có xưởng riêng ở làng, không làm ở thành phố)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Learning a traditional craft takes years of practice. At first, learners only watch the artisan work. Then they try simple tasks. Only after long practice can they make beautiful products.", "statements": ["a) Learning a craft takes a short time.", "b) Learners first watch the artisan.", "c) They start with simple tasks.", "d) Practice is unnecessary."], "answer": ["F", "T", "T", "F"], "explain": "a) F (học nghề mất nhiều năm). b) T (ban đầu chỉ quan sát). c) T (sau đó thử việc đơn giản). d) F (luyện tập lâu dài mới làm được sản phẩm đẹp)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: I don't know _____ to visit first, Bat Trang or Dong Ho.", "answer": "where", "explain": "Cấu trúc: question word + to V. where to visit (nên thăm nơi nào)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The (skill) _____ workers made beautiful pots.", "answer": "skilful", "explain": "Trước danh từ workers cần tính từ: skill thành skilful (khéo léo)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. craft", "B. grass", "C. path", "D. hand"], "answer": "D", "explain": "hand đọc là /hænd/ với âm /æ/, còn craft, grass, path đọc với âm /ɑː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. artisan", "B. artist", "C. worker", "D. farmer"], "answer": "A", "explain": "artisan nhấn âm 2, còn artist, worker, farmer nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "The artisan _____ the clay into the shape of a vase.", "options": ["A. moulded", "B. ate", "C. drank", "D. slept"], "answer": "A", "explain": "mould (nặn, đúc khuôn) đất sét thành hình chiếc bình."}, {"type": "mcq", "level": "TH", "q": "We need to find out _____ the festival starts.", "options": ["A. when", "B. that", "C. this", "D. it"], "answer": "A", "explain": "Cấu trúc: find out + when (tìm hiểu khi nào). that, this, it không phải từ để hỏi."}, {"type": "mcq", "level": "VD", "q": "I wonder _____ to contact the village chief.", "options": ["A. whom", "B. that", "C. this", "D. so"], "answer": "A", "explain": "Cấu trúc: wonder + whom to contact (tự hỏi nên liên hệ với ai)."}, {"type": "mcq", "level": "VDC", "q": "_____ hard the artisans work, they earn little money.", "options": ["A. However", "B. Although", "C. Despite", "D. Because"], "answer": "A", "explain": "Cấu trúc: However + adj + S + V (Dù... đến đâu)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Weaving is a popular craft in many villages. Women weave cloth on traditional looms. The cloth has beautiful patterns and bright colours. Tourists often buy it as gifts.", "statements": ["a) Weaving is popular in many villages.", "b) Women weave on modern machines.", "c) The cloth has beautiful patterns.", "d) Tourists buy it as gifts."], "answer": ["T", "F", "T", "T"], "explain": "a) T (nghề dệt phổ biến). b) F (dệt trên khung cửi truyền thống). c) T (vải có hoa văn đẹp). d) T (du khách mua làm quà)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some young artisans are bringing new ideas to old crafts. They design modern products but keep traditional techniques. Their products are popular with young customers. This mix of old and new keeps the craft alive.", "statements": ["a) Young artisans bring new ideas to old crafts.", "b) They keep traditional techniques.", "c) Their products are unpopular.", "d) Mixing old and new keeps the craft alive."], "answer": ["T", "T", "F", "T"], "explain": "a) T (nghệ nhân trẻ mang ý tưởng mới). b) T (giữ kỹ thuật truyền thống). c) F (sản phẩm được giới trẻ ưa chuộng). d) T (kết hợp cũ mới giữ nghề sống mãi)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: This skill has been passed _____ for generations.", "answer": "down", "explain": "Cụm động từ pass down (truyền lại): chỗ trống cần down."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Dong Ho paintings are (beauty) _____.", "answer": "beautiful", "explain": "Sau động từ tobe cần tính từ: beauty thành beautiful (đẹp)."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. calm", "B. palm", "C. half", "D. man"], "answer": "D", "explain": "man đọc là /mæn/ với âm /æ/, còn calm, palm, half đọc với âm /ɑː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. memorable", "B. beautiful", "C. colourful", "D. eventful"], "answer": "D", "explain": "eventful nhấn âm 2, còn memorable, beautiful, colourful nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Dong Ho paintings are a _____ art of Viet Nam.", "options": ["A. traditional", "B. modern", "C. strange", "D. boring"], "answer": "A", "explain": "Tranh Đông Hồ là nghệ thuật truyền thống (traditional) của Việt Nam."}, {"type": "mcq", "level": "TH", "q": "She asked me _____ to buy some clay.", "options": ["A. where", "B. that", "C. this", "D. so"], "answer": "A", "explain": "Cấu trúc: ask somebody where to buy (hỏi nên mua ở đâu)."}, {"type": "mcq", "level": "VD", "q": "The village decided to _____ with the problem of pollution.", "options": ["A. deal", "B. do", "C. make", "D. take"], "answer": "A", "explain": "deal with (xử lý, giải quyết) vấn đề ô nhiễm."}, {"type": "mcq", "level": "VDC", "q": "By the time we arrived, the artisans _____ making the pots.", "options": ["A. had finished", "B. finish", "C. have finished", "D. finished"], "answer": "A", "explain": "By the time + quá khứ, dùng quá khứ hoàn thành (had finished) cho hành động xảy ra trước."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). The village festival takes place in spring. People wear traditional clothes. There are folk games and delicious food. Visitors from everywhere come to enjoy it.", "statements": ["a) The festival takes place in spring.", "b) People wear modern clothes.", "c) There are folk games and food.", "d) No visitors come."], "answer": ["T", "F", "T", "F"], "explain": "a) T (lễ hội vào mùa xuân). b) F (mặc trang phục truyền thống). c) T (có trò chơi dân gian và món ngon). d) F (du khách khắp nơi đến dự)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). If a craft village wants more visitors, it must improve its services. Clean streets, good food, and friendly guides are important. Visitors will come back and tell their friends. Word of mouth is the best advertisement.", "statements": ["a) Improving services attracts more visitors.", "b) Clean streets and good food matter.", "c) Visitors never return.", "d) Word of mouth is good advertisement."], "answer": ["T", "T", "F", "T"], "explain": "a) T (cải thiện dịch vụ thu hút khách). b) T (phố sạch, đồ ăn ngon quan trọng). c) F (khách sẽ quay lại). d) T (truyền miệng là quảng cáo tốt nhất)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: He is keen _____ learning pottery.", "answer": "on", "explain": "Cấu trúc: be keen on (ham thích, say mê)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The colours come from (nature) _____ materials.", "answer": "natural", "explain": "Trước danh từ materials cần tính từ: nature thành natural (tự nhiên)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. laugh", "B. aunt", "C. plant", "D. cat"], "answer": "D", "explain": "cat đọc là /kæt/ với âm /æ/, còn laugh, aunt, plant đọc với âm /ɑː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. embroider", "B. important", "C. machine", "D. village"], "answer": "D", "explain": "village nhấn âm 1, còn embroider, important, machine nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "She carved her name _____ the wooden box.", "options": ["A. on", "B. in", "C. at", "D. of"], "answer": "A", "explain": "carve on (khắc lên trên) mặt chiếc hộp gỗ."}, {"type": "mcq", "level": "TH", "q": "I have no idea _____ to make Dong Ho paintings.", "options": ["A. how", "B. that", "C. what", "D. this"], "answer": "A", "explain": "Cấu trúc: have no idea how to do something (không biết cách làm gì)."}, {"type": "mcq", "level": "VD", "q": "They live _____ making and selling pottery.", "options": ["A. on", "B. in", "C. at", "D. for"], "answer": "A", "explain": "live on (sống bằng nghề gì)."}, {"type": "mcq", "level": "VDC", "q": "The old man is proud of _____ the craft to his grandchildren.", "options": ["A. having passed", "B. pass", "C. to pass", "D. passing"], "answer": "A", "explain": "Sau giới từ of dùng V-ing; having passed nhấn mạnh hành động đã hoàn thành."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Drum making is a special craft of Doi Tam village. Artisans choose good buffalo skin. They stretch the skin carefully over the drum. A good drum can sound for a long time.", "statements": ["a) Doi Tam village is famous for drum making.", "b) Artisans use buffalo skin.", "c) They stretch the skin carelessly.", "d) A good drum sounds for a long time."], "answer": ["T", "T", "F", "T"], "explain": "a) T (làng Đọi Tam nổi tiếng làm trống). b) T (dùng da trâu tốt). c) F (căng da cẩn thận, không cẩu thả). d) T (trống tốt vang lâu)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Passing down a craft is not only about teaching skills. It is also about passing down love for the craft. When young people love what they do, they work with passion. That passion creates the most beautiful products.", "statements": ["a) Passing down a craft means only teaching skills.", "b) Love for the craft is also passed down.", "c) Passion helps create beautiful products.", "d) Young people should not learn crafts."], "answer": ["F", "T", "T", "F"], "explain": "a) F (không chỉ dạy kỹ năng). b) T (còn truyền tình yêu nghề). c) T (đam mê tạo ra sản phẩm đẹp nhất). d) F (đoạn văn khuyến khích người trẻ học nghề)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The festival takes place _____ March every year.", "answer": "in", "explain": "in + tháng (March)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The fair was a great (succeed) _____.", "answer": "success", "explain": "Sau mạo từ a cần danh từ: succeed thành success (sự thành công)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. march", "B. large", "C. charge", "D. sandwich"], "answer": "D", "explain": "sandwich đọc là /ˈsænwɪtʃ/ với âm /æ/, còn march, large, charge đọc với âm /ɑː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. generation", "B. family", "C. history", "D. market"], "answer": "A", "explain": "generation nhấn âm 3, còn family, history, market nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "The _____ of incense makes the pagoda smell pleasant.", "options": ["A. fragrance", "B. noise", "C. light", "D. colour"], "answer": "A", "explain": "fragrance (hương thơm) của nhang làm chùa thơm dễ chịu."}, {"type": "mcq", "level": "TH", "q": "Can you show us _____ to use this mould?", "options": ["A. how", "B. that", "C. what", "D. when"], "answer": "A", "explain": "Cấu trúc: show somebody how to do something (chỉ cho ai cách làm gì)."}, {"type": "mcq", "level": "VD", "q": "He is looking forward _____ the craft fair next month.", "options": ["A. to", "B. for", "C. at", "D. with"], "answer": "A", "explain": "Cụm động từ look forward to (mong đợi)."}, {"type": "mcq", "level": "VDC", "q": "Scarcely had the fair opened _____ tourists rushed in.", "options": ["A. when", "B. than", "C. then", "D. that"], "answer": "A", "explain": "Cấu trúc đảo ngữ: Scarcely had... when... (Vừa mới... thì...)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Our neighbours are very friendly. We often help each other. On weekends, children play football together. Living here makes me feel safe.", "statements": ["a) The neighbours are friendly.", "b) People never help each other.", "c) Children play football on weekends.", "d) The writer feels safe living there."], "answer": ["T", "F", "T", "T"], "explain": "a) T (hàng xóm thân thiện). b) F (mọi người thường giúp nhau). c) T (trẻ em đá bóng cuối tuần). d) T (người viết thấy an toàn)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The Internet has changed how artisans sell products. They can now sell online to customers far away. Photos and videos show the making process. This helps customers understand the value of handmade products.", "statements": ["a) The Internet changed how artisans sell.", "b) Artisans can sell online to distant customers.", "c) Photos show the making process.", "d) Customers cannot understand handmade value."], "answer": ["T", "T", "T", "F"], "explain": "a) T (Internet thay đổi cách bán hàng). b) T (bán online cho khách xa). c) T (ảnh, video cho thấy quy trình). d) F (khách hiểu được giá trị đồ handmade)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: They decided _____ preserve the old craft.", "answer": "to", "explain": "Cấu trúc: decide to V (quyết định làm gì)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The villagers are (friend) _____ to visitors.", "answer": "friendly", "explain": "Sau động từ tobe cần tính từ: friend thành friendly (thân thiện)."}]}]}</script>
