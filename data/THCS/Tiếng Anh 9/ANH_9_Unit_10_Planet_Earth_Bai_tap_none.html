to orbit the Earth.","statements":["a) Earth is the third planet from the Sun.","b) Earth is called the Blue Planet because of its forests.","c) The Moon is a natural satellite of Earth.","d) The Moon orbits the Earth in about 27 days."],"answer":["T","F","T","T"],"explain":"Câu b sai vì Trái Đất được gọi là Hành tinh Xanh nhờ nước bao phủ bề mặt, không phải rừng."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Mars is known as the Red Planet because of the iron oxide on its surface. It has the largest volcano in the solar system, Olympus Mons. Although Mars is much colder than Earth, scientists believe it once had rivers and lakes. No human has set foot on Mars yet.","statements":["a) Mars is called the Red Planet because of iron oxide.","b) Olympus Mons is the largest volcano in the solar system.","c) Mars is warmer than Earth.","d) Humans have already walked on Mars."],"answer":["T","T","F","F"],"explain":"Câu c sai vì sao Hỏa lạnh hơn Trái Đất. Câu d sai vì chưa có người nào đặt chân lên sao Hỏa."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The (explore) _____ of deep space needs advanced technology.","answer":"exploration","explain":"Sau mạo từ the cần một danh từ, dạng danh từ của explore là exploration."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: Gravity keeps the Moon in _____ around the Earth.","answer":"orbit","explain":"Cụm in orbit nghĩa là trên quỹ đạo."}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'o' is pronounced differently from the others.","options":["A. orbit","B. solar","C. explore","D. astronaut"],"answer":"B","explain":"Chữ o trong solar đọc là əʊ, còn orbit, explore, astronaut đọc là ɔː."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. galaxy","B. meteor","C. satellite","D. preserve"],"answer":"D","explain":"preserve có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"The _____ is the path a planet follows around the Sun.","options":["A. surface","B. orbit","C. gravity","D. climate"],"answer":"B","explain":"orbit nghĩa là quỹ đạo, đường đi của hành tinh quanh Mặt Trời."},{"type":"mcq","level":"TH","q":"My uncle, _____ is an astronaut, has been to space twice.","options":["A. who","B. which","C. that","D. whom"],"answer":"A","explain":"Chỉ người, làm chủ ngữ trong mệnh đề có dấu phẩy nên dùng who."},{"type":"mcq","level":"TH","q":"Lan: The documentary about black holes is amazing! - Hung: _____","options":["A. I agree. I could not take my eyes off it.","B. Black holes are black.","C. I like documentaries.","D. The TV is on."],"answer":"A","explain":"Đáp lại lời khen một bộ phim, cách tự nhiên là đồng ý và bày tỏ sự thích thú."},{"type":"mcq","level":"VD","q":"Ha Long Bay, that is in Quang Ninh, is famous for its beauty. Which part is wrong?","options":["A. Ha Long Bay","B. that","C. is in","D. famous"],"answer":"B","explain":"Mệnh đề quan hệ có dấu phẩy không được dùng that, phải sửa thành which."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Venus is the second planet from the Sun. It is the hottest planet in the solar system because its thick atmosphere traps heat. A day on Venus is longer than a year on Venus. People sometimes call Venus the sister planet of Earth.","statements":["a) Venus is the second planet from the Sun.","b) Venus is the hottest planet because of its thick atmosphere.","c) A year on Venus is longer than a day on Venus.","d) Venus is sometimes called the sister planet of Earth."],"answer":["T","T","F","T"],"explain":"Câu c sai vì một ngày trên sao Kim dài hơn một năm trên sao Kim."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Jupiter is the largest planet in our solar system. It is made mostly of gas, so no human could stand on its surface. Jupiter has at least 95 moons. Its Great Red Spot is a storm larger than the Earth which has lasted for hundreds of years.","statements":["a) Jupiter is the biggest planet in the solar system.","b) Humans could walk on the surface of Jupiter.","c) Jupiter has fewer than 90 moons.","d) The Great Red Spot is a storm bigger than Earth."],"answer":["T","F","F","T"],"explain":"Câu b sai vì sao Mộc chủ yếu là khí nên không thể đứng được. Câu c sai vì sao Mộc có ít nhất 95 mặt trăng."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The astronauts felt completely (weight) _____ when they left the Earth.","answer":"weightless","explain":"Sau felt cần tính từ, dạng tính từ của weight trong ngữ cảnh này là weightless, nghĩa là không trọng lượng."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: The Sun is a star at the center of our solar _____.","answer":"system","explain":"Cụm solar system nghĩa là hệ mặt trời."}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'e' is pronounced differently from the others.","options":["A. meteor","B. Venus","C. ecosystem","D. telescope"],"answer":"D","explain":"Chữ e trong telescope đọc là e, còn meteor, Venus, ecosystem đọc là iː."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. universe","B. gravity","C. surface","D. reserve"],"answer":"D","explain":"reserve có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"An _____ travels into space to explore the universe.","options":["A. astronaut","B. planet","C. orbit","D. meteor"],"answer":"A","explain":"astronaut nghĩa là phi hành gia, người du hành vũ trụ."},{"type":"mcq","level":"TH","q":"The scientists, _____ research focuses on Mars, will give a talk tomorrow.","options":["A. who","B. which","C. whose","D. that"],"answer":"C","explain":"whose cộng danh từ research chỉ sự sở hữu, và có dấu phẩy nên không dùng that."},{"type":"mcq","level":"TH","q":"Linh: What causes climate change? - Khoa: _____","options":["A. Human activities like burning fossil fuels.","B. Climate is nice.","C. I change my clothes.","D. It is hot today."],"answer":"A","explain":"Câu hỏi về nguyên nhân biến đổi khí hậu, đáp án A trả lời đúng trọng tâm."},{"type":"mcq","level":"VD","q":"Da Nang, _____ my grandparents live, is a beautiful coastal city.","options":["A. which","B. where","C. that","D. whose"],"answer":"B","explain":"Chỉ nơi chốn trong mệnh đề có dấu phẩy nên dùng where, không dùng that."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). A solar eclipse happens when the Moon passes between the Sun and the Earth. During a total solar eclipse, the sky becomes dark in the middle of the day. People must wear special glasses to watch it safely. A solar eclipse can be seen from everywhere on Earth at the same time.","statements":["a) A solar eclipse happens when the Moon is between the Sun and the Earth.","b) The sky becomes dark during a total solar eclipse.","c) People can look at the Sun directly during an eclipse.","d) Everyone on Earth can see a solar eclipse at the same time."],"answer":["T","T","F","F"],"explain":"Câu c sai vì phải đeo kính chuyên dụng. Câu d sai vì nhật thực chỉ nhìn thấy ở một số nơi."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). The International Space Station orbits the Earth about 16 times a day. Astronauts from many countries live and work there. They do experiments that cannot be done on Earth. The ISS is the largest man-made object in space, but it can be seen from Earth with the naked eye on clear nights.","statements":["a) The ISS orbits the Earth about 16 times a day.","b) Only American astronauts work on the ISS.","c) Astronauts do experiments on the ISS.","d) The ISS cannot be seen from Earth."],"answer":["T","F","T","F"],"explain":"Câu b sai vì phi hành gia đến từ nhiều nước. Câu d sai vì có thể nhìn thấy ISS bằng mắt thường vào đêm quang đãng."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: (science) _____ believe there may be water on Mars.","answer":"scientists","explain":"Cần danh từ số nhiều chỉ người làm chủ ngữ, dạng đúng là scientists."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: The Earth is called the Blue Planet because of its _____.","answer":"water","explain":"Nước bao phủ khoảng 71 phần trăm bề mặt Trái Đất nên gọi là Hành tinh Xanh."}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'i' is pronounced differently from the others.","options":["A. orbit","B. climate","C. habitat","D. Jupiter"],"answer":"B","explain":"Chữ i trong climate đọc là aɪ, còn orbit, habitat, Jupiter đọc là ɪ."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. atmosphere","B. asteroid","C. telescope","D. eclipse"],"answer":"D","explain":"eclipse có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"We must _____ the environment to protect the Earth.","options":["A. pollute","B. preserve","C. destroy","D. damage"],"answer":"B","explain":"preserve nghĩa là bảo tồn, giữ gìn môi trường."},{"type":"mcq","level":"TH","q":"Mr Ba, _____ son is studying in America, teaches us English.","options":["A. who","B. whose","C. which","D. that"],"answer":"B","explain":"whose cộng danh từ son chỉ sự sở hữu, có dấu phẩy nên không dùng that."},{"type":"mcq","level":"TH","q":"Teacher: Remember to turn off the lights to save energy. - Students: _____","options":["A. Yes, we will.","B. Lights are bright.","C. We like energy.","D. Turn on, please."],"answer":"A","explain":"Đáp lại lời nhắc một cách lễ phép và thể hiện sẽ làm theo."},{"type":"mcq","level":"VD","q":"The Moon is a natural satellite. It orbits the Earth. Combine them using a non-defining relative clause: The Moon, _____, orbits the Earth.","options":["A. which is a natural satellite","B. that is a natural satellite","C. is a natural satellite","D. what is a natural satellite"],"answer":"A","explain":"Gộp câu bằng mệnh đề quan hệ không xác định cần dấu phẩy hai bên và dùng which, không dùng that."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Saturn is famous for its beautiful rings. The rings are made of ice and rock. Saturn is the second largest planet in the solar system. Saturn is the only planet that has rings.","statements":["a) Saturn has beautiful rings.","b) The rings are made of ice and rock.","c) Saturn is the largest planet in the solar system.","d) Saturn is the only planet with rings."],"answer":["T","T","F","F"],"explain":"Câu c sai vì sao Thổ là hành tinh lớn thứ hai. Câu d sai vì các hành tinh khác như sao Mộc, sao Thiên Vương cũng có vành đai."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Mercury is the closest planet to the Sun. It is also the smallest planet in the solar system. Because it has almost no atmosphere, temperatures on Mercury change greatly between day and night. A year on Mercury lasts only 88 Earth days.","statements":["a) Mercury is the nearest planet to the Sun.","b) Mercury is the biggest planet.","c) Mercury has almost no atmosphere.","d) One year on Mercury is shorter than one year on Earth."],"answer":["T","F","T","T"],"explain":"Câu b sai vì sao Thủy là hành tinh nhỏ nhất. Một năm trên sao Thủy chỉ 88 ngày Trái Đất nên ngắn hơn một năm trên Trái Đất."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The rocket (successful) _____ landed on the ocean platform.","answer":"successfully","explain":"Cần trạng từ bổ nghĩa cho động từ landed, dạng trạng từ của successful là successfully."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: The force that pulls objects toward the Earth is called _____.","answer":"gravity","explain":"gravity nghĩa là trọng lực, lực hút các vật về phía Trái Đất."}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'oo' is pronounced differently from the others.","options":["A. Moon","B. soon","C. flood","D. food"],"answer":"C","explain":"Chữ oo trong flood đọc là ʌ, còn Moon, soon, food đọc là uː."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. planet","B. climate","C. nature","D. protect"],"answer":"D","explain":"protect có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"Scientists use a _____ to observe objects far away in space.","options":["A. telescope","B. microscope","C. satellite","D. orbit"],"answer":"A","explain":"telescope là kính viễn vọng, dùng để quan sát vật thể ở xa trong không gian."},{"type":"mcq","level":"TH","q":"Hue, _____ was the capital of Viet Nam, attracts many tourists.","options":["A. which","B. that","C. who","D. whose"],"answer":"A","explain":"Chỉ địa danh, mệnh đề có dấu phẩy nên dùng which, không dùng that."},{"type":"mcq","level":"TH","q":"The _____ of the Earth is getting warmer because of pollution.","options":["A. surface","B. atmosphere","C. orbit","D. gravity"],"answer":"B","explain":"atmosphere là bầu khí quyển, nơi diễn ra hiện tượng nóng lên toàn cầu do ô nhiễm."},{"type":"mcq","level":"VD","q":"My pen pal, _____ lives in London, sent me photos of the solar eclipse.","options":["A. who","B. which","C. that","D. whose"],"answer":"A","explain":"Chỉ người, làm chủ ngữ trong mệnh đề có dấu phẩy nên dùng who."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). The Sun is a star at the center of our solar system. It is much bigger than the Earth. The Sun gives us light and heat. Life on Earth cannot exist without the Sun.","statements":["a) The Sun is at the center of the solar system.","b) The Earth is bigger than the Sun.","c) The Sun gives light and heat to the Earth.","d) Life on Earth needs the Sun."],"answer":["T","F","T","T"],"explain":"Câu b sai vì Mặt Trời lớn hơn Trái Đất rất nhiều."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Black holes are regions in space where gravity is extremely strong. Nothing, not even light, can escape from a black hole. Scientists cannot see black holes directly, but they can observe their effects on nearby stars. The first photo of a black hole was taken in 2019.","statements":["a) Gravity inside a black hole is very weak.","b) Light cannot escape from a black hole.","c) Scientists can see black holes with normal telescopes.","d) The first photo of a black hole was taken in 2019."],"answer":["F","T","F","T"],"explain":"Câu a sai vì trọng lực trong hố đen cực mạnh. Câu c sai vì không thể nhìn trực tiếp hố đen, chỉ quan sát ảnh hưởng của nó."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The view of the Earth from space is absolutely (amaze) _____.","answer":"amazing","explain":"Sau absolutely cần tính từ, dạng tính từ của amaze trong ngữ cảnh này là amazing."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: A _____ is a rock from space that burns when it enters the atmosphere.","answer":"meteor","explain":"meteor là sao băng, thiên thạch cháy sáng khi đi vào khí quyển."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 's' is pronounced differently from the others.","options":["A. solar","B. space","C. universe","D. preserve"],"answer":"D","explain":"Chữ s trong preserve đọc là z, còn solar, space, universe đọc là s."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. galaxy","B. orbit","C. planet","D. beyond"],"answer":"D","explain":"beyond có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"The layer of air around the Earth is called the _____.","options":["A. atmosphere","B. surface","C. gravity","D. climate"],"answer":"A","explain":"atmosphere nghĩa là bầu khí quyển, lớp không khí bao quanh Trái Đất."},{"type":"mcq","level":"TH","q":"Dr Lan, _____ I met yesterday, is a famous scientist.","options":["A. who","B. whom","C. which","D. that"],"answer":"B","explain":"Đại từ quan hệ làm tân ngữ của met trong mệnh đề có dấu phẩy nên dùng whom."},{"type":"mcq","level":"TH","q":"Minh: I think we should use less plastic to protect the oceans. - An: _____","options":["A. I could not agree more.","B. Plastic is cheap.","C. Oceans are big.","D. I use plastic bags."],"answer":"A","explain":"I could not agree more nghĩa là hoàn toàn đồng ý, dùng để hưởng ứng ý kiến."},{"type":"mcq","level":"VD","q":"Choose the correct sentence.","options":["A. My bike, that I bought last year, is broken.","B. My bike, which I bought last year, is broken.","C. My bike which I bought last year, is broken.","D. My bike, which I bought last year is broken."],"answer":"B","explain":"Mệnh đề không xác định cần dấu phẩy ở cả hai đầu và dùng which, không dùng that."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Neptune is the farthest planet from the Sun. It is a blue planet because of the methane in its atmosphere. Neptune has the strongest winds in the solar system. One year on Neptune lasts about 165 Earth years.","statements":["a) Neptune is the closest planet to the Sun.","b) Neptune looks blue because of methane.","c) Neptune has very strong winds.","d) One year on Neptune is shorter than one year on Earth."],"answer":["F","T","T","F"],"explain":"Câu a sai vì sao Hải Vương xa Mặt Trời nhất. Câu d sai vì một năm trên sao Hải Vương dài khoảng 165 năm Trái Đất."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). In 1969, Apollo 11 carried the first humans to the Moon. Neil Armstrong and Buzz Aldrin walked on the Moon while Michael Collins stayed in orbit. Their footprints are still there because the Moon has no wind or water to erase them. Since then, 12 astronauts have walked on the Moon in total.","statements":["a) Apollo 11 took humans to the Moon in 1969.","b) Michael Collins walked on the Moon with Armstrong.","c) Footprints on the Moon disappear quickly.","d) Twelve astronauts have walked on the Moon so far."],"answer":["T","F","F","T"],"explain":"Câu b sai vì Collins ở lại trên quỹ đạo. Câu c sai vì Mặt Trăng không có gió hay nước nên dấu chân vẫn còn."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The (discover) _____ of a new planet excited the scientists.","answer":"discovery","explain":"Sau mạo từ the cần danh từ, dạng danh từ của discover là discovery."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: The Earth takes 365 days to go around the _____.","answer":"Sun","explain":"Trái Đất mất 365 ngày để quay một vòng quanh Mặt Trời."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'a' is pronounced differently from the others.","options":["A. galaxy","B. planet","C. Mars","D. habitat"],"answer":"C","explain":"Chữ a trong Mars đọc là ɑː, còn galaxy, planet, habitat đọc là æ."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. meteor","B. solar","C. surface","D. eclipse"],"answer":"D","explain":"eclipse có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"_____ change is one of the biggest problems facing our planet.","options":["A. Climate","B. Orbit","C. Gravity","D. Surface"],"answer":"A","explain":"climate change nghĩa là biến đổi khí hậu."},{"type":"mcq","level":"TH","q":"The Earth, _____ is the third planet from the Sun, is called the Blue Planet.","options":["A. which","B. that","C. who","D. whose"],"answer":"A","explain":"Chỉ vật, mệnh đề có dấu phẩy nên dùng which, không dùng that."},{"type":"mcq","level":"TH","q":"A _____ is a small rocky object that orbits the Sun, mostly found between Mars and Jupiter.","options":["A. meteor","B. asteroid","C. satellite","D. planet"],"answer":"B","explain":"asteroid là tiểu hành tinh, tập trung chủ yếu ở vành đai giữa sao Hỏa và sao Mộc."},{"type":"mcq","level":"VD","q":"Sapa, _____ is in the north of Viet Nam, is famous for its terraced fields.","options":["A. which","B. that","C. where","D. who"],"answer":"A","explain":"Chỉ địa danh trong mệnh đề có dấu phẩy nên dùng which."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). The Moon is about 384,000 kilometres from the Earth. It is the only place beyond Earth where humans have set foot. The Moon has no atmosphere, so the sky there is always black. Astronauts need special suits to survive on the Moon.","statements":["a) The Moon is about 384,000 km from Earth.","b) Humans have walked on Mars.","c) The sky on the Moon is always black.","d) Astronauts can breathe easily on the Moon."],"answer":["T","F","T","F"],"explain":"Câu b sai vì con người mới chỉ đặt chân lên Mặt Trăng. Câu d sai vì Mặt Trăng không có khí quyển nên cần đồ bảo hộ đặc biệt."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Uranus is an ice giant planet. It spins on its side, unlike other planets. Methane in its atmosphere gives Uranus a pale blue-green colour. Uranus is the coldest planet in the solar system although it is not the farthest from the Sun.","statements":["a) Uranus is called an ice giant.","b) Uranus spins like other planets.","c) Uranus looks pale blue-green because of methane.","d) Uranus is the farthest planet from the Sun."],"answer":["T","F","T","F"],"explain":"Câu b sai vì sao Thiên Vương quay nghiêng một bên. Câu d sai vì sao Hải Vương mới xa Mặt Trời nhất."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The night sky looked (mystery) _____ and beautiful.","answer":"mysterious","explain":"Sau looked cần tính từ, dạng tính từ của mystery là mysterious."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: People build nature _____ to protect wild animals.","answer":"reserves","explain":"nature reserves nghĩa là các khu bảo tồn thiên nhiên."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'ed' is pronounced differently from the others.","options":["A. launched","B. explored","C. orbited","D. called"],"answer":"C","explain":"Đuôi ed trong orbited đọc là ɪd, còn launched đọc là t, explored và called đọc là d."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. universe","B. gravity","C. planet","D. protect"],"answer":"D","explain":"protect có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"Scientists _____ the universe to find new planets.","options":["A. explore","B. preserve","C. launch","D. orbit"],"answer":"A","explain":"explore nghĩa là khám phá, thám hiểm vũ trụ."},{"type":"mcq","level":"TH","q":"Mrs Hoa, _____ husband is a pilot, often travels abroad.","options":["A. who","B. whose","C. which","D. that"],"answer":"B","explain":"whose cộng danh từ husband chỉ sự sở hữu."},{"type":"mcq","level":"TH","q":"Ba: Can you tell me something about the solar system? - Lan: _____","options":["A. Sure. It has eight planets orbiting the Sun.","B. I like the Sun.","C. Space is big.","D. Planets are round."],"answer":"A","explain":"Đáp án A trả lời đúng câu hỏi về hệ mặt trời một cách đầy đủ."},{"type":"mcq","level":"VD","q":"My best friend, _____ I share all my secrets with, moved to Da Lat.","options":["A. who","B. which","C. that","D. whom"],"answer":"D","explain":"Đại từ quan hệ làm tân ngữ của giới từ with trong mệnh đề có dấu phẩy nên dùng whom, không dùng that."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Earth is the only planet known to have life. Water covers about 71 percent of its surface. The atmosphere of Earth protects us from the harmful rays of the Sun. Without the atmosphere, life on Earth could not survive.","statements":["a) Earth is the only planet with life.","b) Land covers 71 percent of Earth.","c) The atmosphere protects Earth from harmful rays.","d) Life could survive without the atmosphere."],"answer":["T","F","T","F"],"explain":"Câu b sai vì nước mới bao phủ 71 phần trăm bề mặt. Câu d sai vì không có khí quyển thì sự sống không tồn tại được."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). A light-year is the distance light travels in one year, about 9.5 trillion kilometres. The nearest star to Earth, apart from the Sun, is Proxima Centauri, about 4.2 light-years away. Even the fastest spacecraft would take thousands of years to reach it. This shows how vast the universe is.","statements":["a) A light-year measures distance, not time.","b) Proxima Centauri is the nearest star to Earth after the Sun.","c) A modern spacecraft can reach Proxima Centauri in a few years.","d) The universe is extremely large."],"answer":["T","T","F","T"],"explain":"Câu c sai vì tàu vũ trụ nhanh nhất cũng mất hàng nghìn năm mới tới được Proxima Centauri."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The (protect) _____ of the rainforest is very important.","answer":"protection","explain":"Sau mạo từ the cần danh từ, dạng danh từ của protect là protection."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: Jupiter is the _____ planet in the solar system.","answer":"largest","explain":"Sao Mộc là hành tinh lớn nhất trong hệ mặt trời."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'o' is pronounced differently from the others.","options":["A. orbit","B. explore","C. solar","D. astronaut"],"answer":"C","explain":"Chữ o trong solar đọc là əʊ, còn orbit, explore, astronaut đọc là ɔː."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. habitat","B. nature","C. planet","D. preserve"],"answer":"D","explain":"preserve có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"A rocket was _____ into space yesterday morning.","options":["A. launched","B. explored","C. preserved","D. orbited"],"answer":"A","explain":"launch nghĩa là phóng tên lửa vào không gian."},{"type":"mcq","level":"TH","q":"The students, _____ are doing a project on Mars, visited the museum.","options":["A. who","B. which","C. that","D. whose"],"answer":"A","explain":"Chỉ người, làm chủ ngữ trong mệnh đề có dấu phẩy nên dùng who."},{"type":"mcq","level":"TH","q":"The _____ of Mars is too thin for humans to breathe.","options":["A. atmosphere","B. surface","C. gravity","D. orbit"],"answer":"A","explain":"atmosphere là khí quyển, khí quyển sao Hỏa quá mỏng để con người thở được."},{"type":"mcq","level":"VD","q":"Thomas Edison, _____ invented the light bulb, was a great inventor.","options":["A. who","B. which","C. that","D. whose"],"answer":"A","explain":"Chỉ người trong mệnh đề có dấu phẩy nên dùng who."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Comets are made of ice, dust and rock. When a comet nd có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"The _____ is everything that exists, including stars and planets.","options":["A. universe","B. orbit","C. surface","D. climate"],"answer":"A","explain":"universe nghĩa là vũ trụ, bao gồm mọi thứ tồn tại."},{"type":"mcq","level":"TH","q":"My father, _____ works at a space center, loves science fiction films.","options":["A. who","B. which","C. that","D. whose"],"answer":"A","explain":"Chỉ người, làm chủ ngữ trong mệnh đề có dấu phẩy nên dùng who."},{"type":"mcq","level":"TH","q":"Hoa: Earth Day is on April 22nd. - Nam: _____","options":["A. Let us do something to protect our planet.","B. April is a month.","C. I like the 22nd.","D. Earth is round."],"answer":"A","explain":"Đáp lại thông tin về Ngày Trái Đất bằng một lời đề nghị hành động là tự nhiên nhất."},{"type":"mcq","level":"VD","q":"The Eiffel Tower, _____ is in Paris, is visited by millions of tourists.","options":["A. which","B. that","C. who","D. whose"],"answer":"A","explain":"Chỉ vật trong mệnh đề có dấu phẩy nên dùng which, không dùng that."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). The Milky Way is the galaxy that contains our solar system. It has billions of stars. From Earth, it looks like a cloudy band of light in the night sky. Our solar system is near the center of the Milky Way.","statements":["a) The Milky Way contains our solar system.","b) The Milky Way has billions of stars.","c) Our solar system is at the edge of the Milky Way.","d) The Milky Way looks like a cloudy band of light."],"answer":["T","T","F","T"],"explain":"Câu c sai vì hệ mặt trời của chúng ta ở gần trung tâm dải Ngân Hà."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Astronauts on the ISS exercise for two hours every day. Without exercise, their muscles would become weak in zero gravity. They also eat special food from packages. Sleeping in space is difficult because there is no up or down.","statements":["a) Astronauts exercise daily on the ISS.","b) Muscles stay strong without exercise in space.","c) Astronauts eat normal meals on plates.","d) Sleeping in space can be difficult."],"answer":["T","F","F","T"],"explain":"Câu b sai vì không tập luyện cơ bắp sẽ yếu đi. Câu c sai vì họ ăn thức ăn đặc biệt đóng gói."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: It is (danger) _____ to look at the Sun directly.","answer":"dangerous","explain":"Sau is cần tính từ, dạng tính từ của danger là dangerous."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: The Moon has no _____ so there is no weather there.","answer":"atmosphere","explain":"Mặt Trăng không có khí quyển nên không có thời tiết."}]}]}</script>
