<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "I have lived in this town ______ 2010.", "options": ["A. since", "B. for", "C. in", "D. from"], "answer": "A", "explain": "since + mốc thời gian (2010)."}, {"type": "mcq", "level": "NB", "q": "The view from the top of the mountain was ______. We could not say a word.", "options": ["A. breathtaking", "B. unpleasant", "C. boring", "D. tired"], "answer": "A", "explain": "breathtaking nghĩa là ngoạn mục, đẹp đến nín thở."}, {"type": "mcq", "level": "TH", "q": "She has worked here ______ five years.", "options": ["A. for", "B. since", "C. from", "D. in"], "answer": "A", "explain": "for + khoảng thời gian (five years)."}, {"type": "mcq", "level": "TH", "q": "Have you ______ eaten sushi?", "options": ["A. ever", "B. never", "C. yet", "D. already"], "answer": "A", "explain": "ever dùng trong câu hỏi về trải nghiệm: Have you ever...?"}, {"type": "mcq", "level": "VD", "q": "Look! The bus ______. Let's run!", "options": ["A. has come", "B. comes", "C. came", "D. is coming"], "answer": "A", "explain": "Hành động vừa mới xảy ra, kết quả còn ở hiện tại (phải chạy ngay) nên dùng hiện tại hoàn thành."}, {"type": "mcq", "level": "VDC", "q": "Choose the word whose underlined letter w is pronounced differently from the others.", "options": ["A. write", "B. wrong", "C. wrestle", "D. water"], "answer": "D", "explain": "Trong write, wrong, wrestle chữ w câm; trong water chữ w được phát âm là /w/."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last month, our class went on a trip to Ha Long Bay. We took a cruise around the bay and enjoyed the breathtaking scenery. I have never seen such beautiful limestone islands before. We took hundreds of photos. It was the most unforgettable experience of my life.", "statements": ["a) The class went to Ha Long Bay last month.", "b) They travelled around the bay by bus.", "c) The writer had seen Ha Long Bay before the trip.", "d) It was an unforgettable experience for the writer."], "answer": ["T", "F", "F", "T"], "explain": "Họ đi du thuyền (cruise) chứ không đi xe buýt; người viết chưa từng thấy Hạ Long trước chuyến đi."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Minh loves travelling. He has visited more than ten countries. Last year, he joined an expedition to explore a rainforest. The trip was thrilling but also tiring. He says every trip gives him new experiences.", "statements": ["a) Minh dislikes travelling.", "b) He has visited over ten countries.", "c) The expedition to the rainforest was boring.", "d) Travelling gives Minh new experiences."], "answer": ["F", "T", "F", "T"], "explain": "Minh yêu du lịch; chuyến thám hiểm rừng mưa rất ly kỳ (thrilling) chứ không nhàm chán."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: She has _____ finished her lunch.", "answer": "just", "explain": "just diễn tả hành động vừa mới xảy ra trong thì hiện tại hoàn thành."}, {"type": "short", "level": "NB", "q": "Give the correct form of the verb in brackets: They (visit) _____ Hue twice.", "answer": "have visited", "explain": "Chủ ngữ they dùng have + V3/ed."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "He hasn't finished his project ______.", "options": ["A. yet", "B. already", "C. just", "D. ever"], "answer": "A", "explain": "yet dùng trong câu phủ định, đặt ở cuối câu."}, {"type": "mcq", "level": "NB", "q": "We decided to ______ the old cave near the village.", "options": ["A. explore", "B. ruin", "C. lose", "D. forget"], "answer": "A", "explain": "explore nghĩa là khám phá."}, {"type": "mcq", "level": "TH", "q": "They have known each other ______ they were children.", "options": ["A. since", "B. for", "C. from", "D. in"], "answer": "A", "explain": "since + mệnh đề chỉ mốc thời gian (they were children)."}, {"type": "mcq", "level": "TH", "q": "The roller coaster ride was really ______. My heart beat fast.", "options": ["A. thrilling", "B. unpleasant", "C. boring", "D. sad"], "answer": "A", "explain": "thrilling nghĩa là hồi hộp, ly kỳ."}, {"type": "mcq", "level": "VD", "q": "I ______ my keys. I can't open the door.", "options": ["A. have lost", "B. lost", "C. lose", "D. am losing"], "answer": "A", "explain": "Hành động trong quá khứ nhưng kết quả còn ở hiện tại (không mở được cửa) nên dùng hiện tại hoàn thành."}, {"type": "mcq", "level": "VDC", "q": "Choose the word whose underlined letter y is pronounced differently from the others.", "options": ["A. year", "B. young", "C. your", "D. rhythm"], "answer": "D", "explain": "Trong year, young, your chữ y phát âm là /j/; trong rhythm chữ y là nguyên âm /ɪ/."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Anna is an exchange student from Australia. She has been in Viet Nam for three months. She has tried many Vietnamese dishes, but she has not tried bun cha yet. Next week, her host family will take her to Ha Noi to try it.", "statements": ["a) Anna comes from Australia.", "b) She has been in Viet Nam for three years.", "c) She has already tried bun cha.", "d) She will try bun cha in Ha Noi next week."], "answer": ["T", "F", "F", "T"], "explain": "Cô ở Việt Nam ba tháng chứ không phải ba năm; cô chưa thử bún chả (has not tried yet)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last summer, Tom took a voyage across the Pacific Ocean. The voyage lasted fifteen days. While he was on the ship, he saw dolphins swimming beside it. He has taken many photos, and he shows them to everyone.", "statements": ["a) Tom's voyage lasted fifteen days.", "b) He travelled by plane across the Pacific.", "c) He saw dolphins during the voyage.", "d) He keeps his pho , "q": "The story of the brave dog was really ______.", "options": ["A. touching", "B. unpleasant", "C. boring", "D. frightening"], "answer": "A", "explain": "touching nghĩa là cảm động."}, {"type": "mcq", "level": "TH", "q": "My parents have been married ______ 25 years.", "options": ["A. for", "B. since", "C. from", "D. in"], "answer": "A", "explain": "for + khoảng thời gian (25 years)."}, {"type": "mcq", "level": "TH", "q": "We stopped to admire the ______ of the valley.", "options": ["A. scenery", "B. expedition", "C. voyage", "D. cruise"], "answer": "A", "explain": "scenery là cảnh vật, phong cảnh."}, {"type": "mcq", "level": "VD", "q": "Choose the word in which the letter w is silent.", "options": ["A. sweet", "B. swim", "C. answer", "D. wait"], "answer": "C", "explain": "Trong sweet, swim, wait chữ w được phát âm; trong answer chữ w câm."}, {"type": "mcq", "level": "VDC", "q": "I ______ here for five years and I love this city.", "options": ["A. have lived", "B. lived", "C. live", "D. am living"], "answer": "A", "explain": "for five years và hành động còn tiếp diễn đến hiện tại nên dùng hiện tại hoàn thành, không dùng quá khứ đơn."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Camping is a popular activity among teenagers. Last weekend, our group went camping by a lake. We put up tents, cooked food and sang songs around the fire. Although it rained a little at night, we still had great fun.", "statements": ["a) Camping is popular with teenagers.", "b) The group went camping by a river.", "c) They sang songs around the fire.", "d) The rain ruined their trip completely."], "answer": ["T", "F", "T", "F"], "explain": "Họ cắm trại bên hồ chứ không phải bên sông; dù mưa nhưng họ vẫn rất vui."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Learning to swim was a big challenge for me. At first, I was afraid of water.  the blank with ONE word: He has worked here _____ a long time.", "answer": "for", "explain": "for + khoảng thời gian (a long time)."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "She ______ never been abroad.", "options": ["A. has", "B. have", "C. is", "D. does"], "answer": "A", "explain": "Chủ ngữ she dùng has + V3/ed."}, {"type": "mcq", "level": "NB", "q": "Our trip to Phu Quoc was ______.", "options": ["A. unforgettable", "B. unpleasant", "C. boring", "D. tiring"], "answer": "A", "explain": "unforgettable nghĩa là khó quên."}, {"type": "mcq", "level": "NB", "q": "Have the children ______ their breakfast yet?", "options": ["A. eaten", "B. ate", "C. eat", "D. eating"], "answer": "A", "explain": "Sau have dùng V3/ed: eaten."}, {"type": "mcq", "level": "TH", "q": "I have wanted to visit Japan ______ I was a child.", "options": ["A. since", "B. for", "C. from", "D. in"], "answer": "A", "explain": "since + mệnh đề chỉ mốc thời gian."}, {"type": "mcq", "level": "VD", "q": "Choose the word in which the letter y is NOT pronounced /j/.", "options": ["A. yes", "B. yet", "C. young", "D. study"], "answer": "D", "explain": "Trong yes, yet, young chữ y phát âm là /j/; trong study chữ y là nguyên âm /i/."}, {"type": "mcq", "level": "VDC", "q": "This is the second time she ______ late this week.", "options": ["A. has been", "B. was", "C. is", "D. will be"], "answer": "A", "explain": "Cấu trúc This is the second time + hiện tại hoàn thành."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Volunteering can change your life. Last summer, Hoa joined a volunteer group in a mountain village. She taught English to local children and helped build a small library. The children were friendly, and the mountain scenery was breathtaking. Hoa says she has learned a lot from the trip.", "statements": ["a) Hoa volunteered in a mountain village last summer.", "b) She taught maths to local children.", "c) She helped build a small library.", "d) The trip taught her nothing."], "answer": ["T", "F", "T", "F"], "explain": "Hoa dạy tiếng Anh chứ không dạy toán; cô nói đã học được rất nhiều từ chuyến đi."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Travelling by train is slower than by plane, but many people love it. You can watch the changing landscape through the window. Last month, I took a night train to Lao Cai. I woke up to a breathtaking sunrise over the mountains. It was an experience I will never forget.", "statements": ["a) The writer travelled to Lao Cai by plane.", "b) Train travel lets you enjoy the landscape.", "c) He saw a sunrise over the mountains.", "d) He wants to forget the experience."], "answer": ["F", "T", "T", "F"], "explain": "Người viết đi tàu đêm; đó là trải nghiệm anh sẽ không bao giờ quên."}, {"type": "short", "level": "TH", "q": "Fill in the blank with ONE word: I have not seen him _____ last Monday.", "answer": "since", "explain": "since + mốc thời gian (last Monday)."}, {"type": "short", "level": "TH", "q": "Give the correct form of the verb in brackets: They (already, do) _____ their homework.", "answer": "have already done", "explain": "Chủ ngữ they dùng have + V3/ed; already đặt sau have."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Life on a farm gave me many valuable ______.", "options": ["A. experiences", "B. expeditions", "C. voyages", "D. cruises"], "answer": "A", "explain": "experience (số nhiều) là những trải nghiệm."}, {"type": "mcq", "level": "NB", "q": "We have lived in this house ______ ten years.", "options": ["A. for", "B. since", "C. from", "D. in"], "answer": "A", "explain": "for + khoảng thời gian (ten years)."}, {"type": "mcq", "level": "NB", "q": "The scientists went on an ______ to study the rainforest.", "options": ["A. expedition", "B. scenery", "C. cruise", "D. landscape"], "answer": "A", "explain": "expedition là chuyến thám hiểm."}, {"type": "mcq", "level": "TH", "q": "She ______ just watered the flowers.", "options": ["A. has", "B. have", "C. is", "D. does"], "answer": "A", "explain": "Chủ ngữ she dùng has; just đặt sau has."}, {"type": "mcq", "level": "VD", "q": "My father ______ for this company since 2000.", "options": ["A. has worked", "B. worked", "C. works", "D. is working"], "answer": "A", "explain": "since 2000 và ông vẫn đang làm nên dùng hiện tại hoàn thành."}, {"type": "mcq", "level": "VDC", "q": "Choose the word which is stressed differently from the others.", "options": ["A. breathtaking", "B. landscape", "C. voyage", "D. explore"], "answer": "D", "explain": "breathtaking, landscape, voyage có trọng âm rơi vào âm tiết đầu; explore có trọng âm rơi vào âm tiết thứ hai."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Street food is an important part of Vietnamese culture. Tourists love trying different dishes at night markets. My foreign friend has tried pho, banh mi and spring rolls. He says Vietnamese food is the most delicious he has ever eaten. He wants to learn to cook some dishes himself.", "statements": ["a) Street food is part of Vietnamese culture.", "b) Tourists dislike night markets.", "c) The friend has tried several Vietnamese dishes.", "d) He thinks Vietnamese food is delicious."], "answer": ["T", "F", "T", "T"], "explain": "Du khách thích chợ đêm; người bạn đã thử nhiều món Việt và thấy rất ngon."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last year, our school held an English speaking contest. I was nervous at first, but my friends encouraged me. I practised every day for a month. Finally, I won the second prize. It was a proud moment, and I have gained more confidence since then.", "statements": ["a) The writer joined an English speaking contest.", "b) He won the first prize.", "c) He practised for a month.", "d) He is more confident now."], "answer": ["T", "F", "T", "T"], "explain": "Cậu đoạt giải nhì chứ không phải giải nhất; giờ cậu tự tin hơn."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: She (learn) _____ English for five years.", "answer": "has learned", "explain": "Chủ ngữ she dùng has + V3/ed; for five years chỉ khoảng thời gian kéo dài đến hiện tại."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE word: This is the best film I have _____ seen.", "answer": "ever", "explain": "ever dùng sau have trong cấu trúc so sánh nhất về trải nghiệm."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "I have ______ finished my homework. Let's go out!", "options": ["A. just", "B. yet", "C. ever", "D. never"], "answer": "A", "explain": "just diễn tả hành động vừa mới xong."}, {"type": "mcq", "level": "NB", "q": "The ______ from the hotel window was amazing.", "options": ["A. scenery", "B. expedition", "C. voyage", "D. cruise"], "answer": "A", "explain": "scenery là cảnh vật nhìn từ cửa sổ."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose letter w has a different pronunciation from the others.", "options": ["A. week", "B. window", "C. write", "D. wonder"], "answer": "C", "explain": "Trong week, window, wonder chữ w được phát âm; trong write chữ w câm."}, {"type": "mcq", "level": "TH", "q": "They have been friends ______ childhood.", "options": ["A. since", "B. for", "C. from", "D. in"], "answer": "A", "explain": "since + mốc thời gian (childhood)."}, {"type": "mcq", "level": "VD", "q": "We had an ______ holiday of three weeks in Da Nang.", "options": ["A. extended", "B. unpleasant", "C. thrilling", "D. touching"], "answer": "A", "explain": "extended nghĩa là kéo dài, hợp với of three weeks."}, {"type": "mcq", "level": "VDC", "q": "I ______ in this school since 2021, and I have many good friends here.", "options": ["A. have studied", "B. studied", "C. study", "D. am studying"], "answer": "A", "explain": "since 2021 và vẫn đang học nên dùng hiện tại hoàn thành, không dùng quá khứ đơn."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Ecotourism helps protect nature while giving tourists special experiences. In Cuc Phuong National Park, visitors can walk through ancient forests and watch rare animals. Local guides, who have lived there all their lives, share interesting stories. The money from tourism helps local people and protects the forest.", "statements": ["a) Ecotourism only benefits tourists.", "b) Visitors can see rare animals in Cuc Phuong.", "c) Local guides know the area well.", "d) Tourism money helps protect the forest."], "answer": ["F", "T", "T", "T"], "explain": "Du lịch sinh thái vừa bảo vệ thiên nhiên vừa giúp người dân địa phương; không chỉ có lợi cho du khách."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Keeping a travel diary is a good habit. Each evening, I write about what I have seen and done during the day. I also stick photos and tickets in the diary. Years later, reading it brings back wonderful memories. I have kept diaries of all my trips since I was ten.", "statements": ["a) The writer writes in the diary every morning.", "b) Photos and tickets are kept in the diary.", "c) The diary helps recall memories later.", "d) He started keeping travel diaries at the age of ten."], "answer": ["F", "T", "T", "T"], "explain": "Người viết ghi nhật ký mỗi tối chứ không phải mỗi sáng."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: He (work) _____ here since last year.", "answer": "has worked", "explain": "Chủ ngữ he dùng has + V3/ed; since last year chỉ mốc thời gian."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE word: Have you finished your project _____?", "answer": "yet", "explain": "yet dùng trong câu hỏi, đặt ở cuối câu."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "The movie gave us a ______ feeling of sadness and hope.", "options": ["A. touching", "B. thrilling", "C. unpleasant", "D. boring"], "answer": "A", "explain": "touching nghĩa là cảm động."}, {"type": "mcq", "level": "NB", "q": "Has she ______ to Ha Long Bay?", "options": ["A. been", "B. be", "C. being", "D. is"], "answer": "A", "explain": "Sau has dùng V3/ed: been."}, {"type": "mcq", "level": "NB", "q": "They haven't arrived ______.", "options": ["A. yet", "B. already", "C. just", "D. ever"], "answer": "A", "explain": "yet dùng trong câu phủ định, đặt ở cuối câu."}, {"type": "mcq", "level": "TH", "q": "How long ______ she lived in Hue?", "options": ["A. has", "B. have", "C. does", "D. did"], "answer": "A", "explain": "Câu hỏi hiện tại hoàn thành với she dùng has."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose letter y sounds different from the others.", "options": ["A. beyond", "B. yellow", "C. yard", "D. happy"], "answer": "D", "explain": "Trong beyond, yellow, yard chữ y phát âm là /j/; trong happy chữ y là nguyên âm /i/."}, {"type": "mcq", "level": "VDC", "q": "She ______ three languages so far.", "options": ["A. has learned", "B. learned", "C. learns", "D. is learning"], "answer": "A", "explain": "so far (cho đến nay) là dấu hiệu của thì hiện tại hoàn thành."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many teenagers dream of studying abroad. It is an exciting but challenging experience. You have to live far from family and adapt to a new culture. However, you will become more independent and confident. Good preparation is the key to a successful study trip.", "statements": ["a) Studying abroad is only exciting, not challenging.", "b) Students must adapt to a new culture.", "c) Living abroad makes students more independent.", "d) Preparation is important for studying abroad."], "answer": ["F", "T", "T", "T"], "explain": "Du học vừa thú vị vừa đầy thử thách; chuẩn bị tốt là chìa khóa thành công."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). My grandfather has lived in the same village for eighty years. He has seen many changes: new roads, new schools and new houses. However, he says people's kindness has never changed. He hopes the village will keep its peaceful beauty forever.", "statements": ["a) The grandfather moved to the city eighty years ago.", "b) He has seen many changes in the village.", "c) He thinks people are less kind now.", "d) He wants the village to stay peaceful."], "answer": ["F", "T", "F", "T"], "explain": "Ông sống ở cùng một làng suốt tám mươi năm; ông nói lòng tốt của con người không hề thay đổi."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: I (not, see) _____ him since Monday.", "answer": "have not seen", "explain": "Chủ ngữ I dùng have not + V3/ed; since Monday chỉ mốc thời gian."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: She has _____ been to the USA, but she wants to go one day.", "answer": "never", "explain": "never diễn tả chưa từng có trải nghiệm."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "We have known each other ______ 2018.", "options": ["A. since", "B. for", "C. from", "D. in"], "answer": "A", "explain": "since + mốc thời gian (2018)."}, {"type": "mcq", "level": "NB", "q": "The paragliding experience was really ______.", "options": ["A. exhilarating", "B. unpleasant", "C. boring", "D. tiring"], "answer": "A", "explain": "exhilarating nghĩa là đầy phấn khích."}, {"type": "mcq", "level": "TH", "q": "She has worked as a nurse ______ five years.", "options": ["A. for", "B. since", "C. from", "D. in"], "answer": "A", "explain": "for + khoảng thời gian (five years)."}, {"type": "mcq", "level": "TH", "q": "A long sea journey is called a ______.", "options": ["A. voyage", "B. cruise", "C. expedition", "D. scenery"], "answer": "A", "explain": "voyage là chuyến đi biển dài."}, {"type": "mcq", "level": "VD", "q": "I can't find my book. I ______ it somewhere.", "options": ["A. have left", "B. left", "C. leave", "D. am leaving"], "answer": "A", "explain": "Mất sách là kết quả còn ở hiện tại nên dùng hiện tại hoàn thành."}, {"type": "mcq", "level": "VDC", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. experience", "B. expedition", "C. adventure", "D. scenery"], "answer": "D", "explain": "experience, expedition, adventure có trọng âm không rơi vào âm tiết đầu; scenery có trọng âm rơi vào âm tiết đầu."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Food tours are popular with foreign visitors in Viet Nam. A guide takes tourists to small local restaurants. They have tried dishes they have never heard of before. The tourists say the food is delicious and cheap. Many of them have promised to come back.", "statements": ["a) Food tours are unpopular in Viet Nam.", "b) Tourists try new dishes on food tours.", "c) The food is expensive.", "d) Some tourists want to return."], "answer": ["F", "T", "F", "T"], "explain": "Tour ẩm thực phổ biến; món ăn ngon và rẻ; nhiều du khách hứa sẽ quay lại."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Learning a musical instrument takes time and patience. I have played the guitar for two years. At first, my fingers hurt a lot. Now I can play several songs. Performing for my family makes me proud, and I have decided to join the school music club.", "statements": ["a) The writer has played the guitar for two months.", "b) Learning was difficult at first.", "c) He can play some songs now.", "d) He will join the school music club."], "answer": ["F", "T", "T", "T"], "explain": "Người viết chơi guitar đã hai năm; cậu quyết định tham gia câu lạc bộ âm nhạc của trường."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The trip was really (forget) ______. I will remember it forever.", "answer": "unforgettable", "explain": "Cần một tính từ bổ nghĩa; unforgettable nghĩa là khó quên."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: He has been a teacher _____ 2010, and he loves his job.", "answer": "since", "explain": "since + mốc thời gian (2010)."}]}]}</script>
