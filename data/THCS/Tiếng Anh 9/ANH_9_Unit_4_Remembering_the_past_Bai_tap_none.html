<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "The trip to Hue last summer was really ______. I will never forget it.", "options": ["A. memorable", "B. boring", "C. tiring", "D. sad"], "answer": "A", "explain": "memorable nghĩa là đáng nhớ, hợp với vế sau I will never forget it."}, {"type": "mcq", "level": "NB", "q": "At 9 pm last night, I ______ my homework.", "options": ["A. was doing", "B. were doing", "C. am doing", "D. do"], "answer": "A", "explain": "Hành động đang diễn ra tại thời điểm xác định trong quá khứ (at 9 pm last night) dùng quá khứ tiếp diễn: was/were + V-ing."}, {"type": "mcq", "level": "TH", "q": "While she ______ to school, it started to rain.", "options": ["A. was walking", "B. walked", "C. is walking", "D. walks"], "answer": "A", "explain": "While + quá khứ tiếp diễn diễn tả hành động đang diễn ra thì bị hành động khác (started) xen vào."}, {"type": "mcq", "level": "TH", "q": "Vietnamese people ______ their ancestors on special occasions.", "options": ["A. worship", "B. behave", "C. observe", "D. ruin"], "answer": "A", "explain": "worship nghĩa là thờ cúng."}, {"type": "mcq", "level": "VD", "q": "I wish I ______ taller so that I could play basketball well.", "options": ["A. were", "B. am", "C. will be", "D. have been"], "answer": "A", "explain": "Câu ước trái với hiện tại dùng wish + quá khứ đơn; động từ to be luôn dùng were cho mọi chủ ngữ."}, {"type": "mcq", "level": "VDC", "q": "Choose the word whose underlined letter l is pronounced differently from the others.", "options": ["A. calm", "B. talk", "C. walk", "D. land"], "answer": "D", "explain": "Trong calm, talk, walk chữ l câm; trong land chữ l được phát âm là /l/."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last summer, my family visited Hoi An Ancient Town. While we were walking along the old streets, the lanterns were shining brightly. My grandmother told us stories about the town's past. We really enjoyed the trip and took a lot of photos.", "statements": ["a) The writer visited Hoi An last summer.", "b) It was raining when they were walking along the old streets.", "c) The grandmother told stories about the town's past.", "d) They did not take any photos."], "answer": ["T", "F", "T", "F"], "explain": "Bài viết nói rõ gia đình thăm Hội An mùa hè năm ngoái, bà kể chuyện về quá khứ của phố cổ; không hề nhắc trời mưa và họ đã chụp rất nhiều ảnh."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Yesterday our class went to the History Museum. While the guide was talking about the ancient kings, some students were taking notes. I wished I had more time to see everything. We left the museum at 4 pm.", "statements": ["a) The class went to the museum yesterday.", "b) The students were playing games while the guide was talking.", "c) The writer wanted more time at the museum.", "d) They left the museum at 5 pm."], "answer": ["T", "F", "T", "F"], "explain": "Học sinh ghi chép chứ không chơi game; người viết ước có thêm thời gian; họ rời bảo tàng lúc 4 giờ chiều chứ không phải 5 giờ."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: At 8 o'clock last night, she _____ watching TV.", "answer": "was", "explain": "Chủ ngữ she dùng was + V-ing trong thì quá khứ tiếp diễn."}, {"type": "short", "level": "NB", "q": "Give the correct form of the verb in brackets: While they (play) _____ football, it began to rain.", "answer": "were playing", "explain": "Chủ ngữ they dùng were + V-ing; hành động đang diễn ra thì bị xen vào."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "We should ______ old temples and pagodas for future generations.", "options": ["A. preserve", "B. ruin", "C. forget", "D. lose"], "answer": "A", "explain": "preserve nghĩa là bảo tồn, gìn giữ."}, {"type": "mcq", "level": "NB", "q": "They ______ football when the rain started.", "options": ["A. were playing", "B. was playing", "C. are playing", "D. play"], "answer": "A", "explain": "Chủ ngữ they dùng were + V-ing; hành động đang diễn ra thì trời bắt đầu mưa."}, {"type": "mcq", "level": "TH", "q": "I wish I ______ a bicycle so that I could cycle to school.", "options": ["A. had", "B. have", "C. will have", "D. am having"], "answer": "A", "explain": "Câu ước ở hiện tại dùng wish + quá khứ đơn: wish + S + had."}, {"type": "mcq", "level": "TH", "q": "Her singing performance last night was ______. Everyone clapped loudly.", "options": ["A. brilliant", "B. ruinous", "C. bored", "D. tired"], "answer": "A", "explain": "brilliant nghĩa là xuất sắc, rực rỡ."}, {"type": "mcq", "level": "VD", "q": "When I arrived, he ______ on the phone, so I waited outside.", "options": ["A. was talking", "B. talked", "C. is talking", "D. has talked"], "answer": "A", "explain": "Hành động đang diễn ra (was talking) khi hành động khác xen vào (arrived)."}, {"type": "mcq", "level": "VDC", "q": "Choose the word which has a different final sound from the others.", "options": ["A. sum", "B. drum", "C. thumb", "D. sun"], "answer": "D", "explain": "sum, drum, thumb kết thúc bằng âm /m/; sun kết thúc bằng âm /n/."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). My grandfather often talks about his childhood. In the past, children played traditional games in the village yard. While the adults were working in the fields, the children were swimming in the river. Life was simple but happy.", "statements": ["a) The grandfather often talks about his childhood.", "b) Children played video games in the past.", "c) The children were swimming while the adults were working.", "d) Life in the past was simple and happy."], "answer": ["T", "F", "T", "T"], "explain": "Trẻ em xưa chơi trò chơi truyền thống chứ không chơi video game; các chi tiết còn lại đúng như bài viết."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last Sunday, Lan visited the Imperial City in Hue with her friends. While they were walking around the palace, it suddenly rained. They quickly ran into a small shop. Lan bought some souvenirs for her family.", "statements": ["a) Lan went to the Imperial City alone.", "b) It rained while they were walking around the palace.", "c) They ran into a small shop to avoid the rain.", "d) Lan bought souvenirs for her friends."], "answer": ["F", "T", "T", "F"], "explain": "Lan đi cùng bạn bè; cô mua quà lưu niệm cho gia đình chứ không phải cho bạn."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: I wish I _____ rich.", "answer": "were", "explain": "Trong câu ước, động từ to be luôn dùng were cho mọi chủ ngữ."}, {"type": "short", "level": "NB", "q": "Give the correct form of the verb in brackets: She (sleep) _____ when her mother came home.", "answer": "was sleeping", "explain": "Chủ ngữ she dùng was + V-ing; hành động đang diễn ra thì mẹ về."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "The old village has many ______ buildings from the 18th century.", "options": ["A. ancient", "B. modern", "C. new", "D. young"], "answer": "A", "explain": "ancient nghĩa là cổ xưa, hợp với from the 18th century."}, {"type": "mcq", "level": "NB", "q": "What ______ you doing at this time yesterday?", "options": ["A. were", "B. was", "C. are", "D. did"], "answer": "A", "explain": "Câu hỏi quá khứ tiếp diễn với you dùng were + V-ing."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. observe", "B. behave", "C. believe", "D. worship"], "answer": "D", "explain": "observe, behave, believe có trọng âm rơi vào âm tiết thứ hai; worship có trọng âm rơi vào âm tiết đầu."}, {"type": "mcq", "level": "TH", "q": "She wishes she ______ in a big city.", "options": ["A. lived", "B. lives", "C. will live", "D. is living"], "answer": "A", "explain": "Câu ước ở hiện tại dùng wish + quá khứ đơn."}, {"type": "mcq", "level": "VD", "q": "The children ______ politely when the guests arrived.", "options": ["A. behaved", "B. observed", "C. worshipped", "D. ruined"], "answer": "A", "explain": "behave nghĩa là cư xử; behaved politely là cư xử lễ phép."}, {"type": "mcq", "level": "VDC", "q": "At this time last Sunday, we ______ along the beach.", "options": ["A. were walking", "B. walked", "C. are walking", "D. have walked"], "answer": "A", "explain": "Cụm at this time last Sunday chỉ thời điểm xác định trong quá khứ, hành động đang diễn ra nên dùng quá khứ tiếp diễn."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Our village holds a traditional festival every spring. Last year, I watched the wrestling competition with my father. While the wrestlers were fighting, the crowd was cheering loudly. It was the most memorable day of my holiday.", "statements": ["a) The festival is held every spring.", "b) The writer watched the wrestling competition alone.", "c) The crowd was cheering while the wrestlers were fighting.", "d) It was a memorable day for the writer."], "answer": ["T", "F", "T", "T"], "explain": "Người viết xem vật cùng bố chứ không một mình; các chi tiết còn lại đúng như bài."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Nam's family moved to a new house last month. His old house was near a beautiful lake. He often played there with his friends after school. Now he wishes he could visit his old friends more often.", "statements": ["a) Nam's family moved house last month.", "b) His old house was far from a lake.", "c) He often played near the lake after school.", "d) He sees his old friends every day now."], "answer": ["T", "F", "T", "F"], "explain": "Nhà cũ gần hồ chứ không xa; giờ cậu ước được thăm bạn cũ thường xuyên hơn, tức là không gặp họ mỗi ngày."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: They _____ having lunch when I called.", "answer": "were", "explain": "Chủ ngữ they dùng were + V-ing."}, {"type": "short", "level": "NB", "q": "Give the correct form of the verb in brackets: I wish I (can) _____ speak English well.", "answer": "could", "explain": "Câu ước ở hiện tại: wish + could + V diễn tả mong muốn có khả năng làm gì."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "The old ______ in the town centre was built 200 years ago.", "options": ["A. monument", "B. structure", "C. behaviour", "D. takeaway"], "answer": "A", "explain": "monument là tượng đài, đài kỷ niệm — công trình được xây để tưởng nhớ."}, {"type": "mcq", "level": "NB", "q": "He ______ a shower when the lights went out.", "options": ["A. was taking", "B. took", "C. is taking", "D. takes"], "answer": "A", "explain": "Hành động đang diễn ra (was taking) thì bị hành động khác xen vào (went out)."}, {"type": "mcq", "level": "TH", "q": "While my mother ______, my father was reading a newspaper.", "options": ["A. was cooking", "B. cooked", "C. is cooking", "D. cooks"], "answer": "A", "explain": "Hai hành động song song trong quá khứ đều dùng quá khứ tiếp diễn."}, {"type": "mcq", "level": "TH", "q": "From the hill, we ______ the whole village below.", "options": ["A. observed", "B. worshipped", "C. behaved", "D. ruined"], "answer": "A", "explain": "observe nghĩa là quan sát."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose letter l has a different pronunciation from the others.", "options": ["A. light", "B. lovely", "C. slow", "D. walk"], "answer": "D", "explain": "Trong light, lovely, slow chữ l được phát âm; trong walk chữ l câm."}, {"type": "mcq", "level": "VDC", "q": "While we ______, the guide suddenly stopped and pointed at an old painting.", "options": ["A. were walking", "B. walked", "C. had walked", "D. walk"], "answer": "A", "explain": "Sau while diễn tả hành động đang diễn ra dùng quá khứ tiếp diễn."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). This is a photo of my great-grandmother. She was cooking in the kitchen when the photo was taken. My grandmother was sitting next to her. They both looked very happy. I wish I had met my great-grandmother.", "statements": ["a) The photo shows the writer's great-grandmother.", "b) She was sleeping when the photo was taken.", "c) The grandmother was sitting next to her mother.", "d) The writer met his great-grandmother."], "answer": ["T", "F", "T", "F"], "explain": "Cụ bà đang nấu ăn chứ không ngủ; người viết ước đã được gặp cụ, tức là chưa từng gặp."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Tet is the most important festival in Viet Nam. Before Tet, families clean and decorate their houses. On New Year's Eve, people gather to welcome the new year. Children wish their grandparents good health and long life.", "statements": ["a) Tet is the most important festival in Viet Nam.", "b) Families clean their houses after Tet.", "c) People gather on New Year's Eve.", "d) Children behave badly on Tet holiday."], "answer": ["T", "F", "T", "F"], "explain": "Các gia đình dọn nhà trước Tết; bài không nói trẻ em cư xử tệ, ngược lại các em chúc sức khỏe ông bà."}, {"type": "short", "level": "TH", "q": "Give the correct form of the verb in brackets: While I (do) _____ my homework, my brother was playing games.", "answer": "was doing", "explain": "Chủ ngữ I dùng was + V-ing."}, {"type": "short", "level": "TH", "q": "Fill in the blank with ONE word: She wishes she _____ taller.", "answer": "were", "explain": "Trong câu ước, động từ to be luôn dùng were."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "The wooden ______ of the communal house is over 100 years old.", "options": ["A. structure", "B. behaviour", "C. memory", "D. worship"], "answer": "A", "explain": "structure là cấu trúc, công trình kiến trúc."}, {"type": "mcq", "level": "NB", "q": "______ she sleeping at 10 pm yesterday?", "options": ["A. Was", "B. Were", "C. Is", "D. Did"], "answer": "A", "explain": "Câu hỏi quá khứ tiếp diễn với she dùng Was + S + V-ing."}, {"type": "mcq", "level": "TH", "q": "I wish I ______ how to swim.", "options": ["A. knew", "B. know", "C. will know", "D. am knowing"], "answer": "A", "explain": "Câu ước trái với hiện tại dùng wish + quá khứ đơn."}, {"type": "mcq", "level": "TH", "q": "We really ______ the beauty of the ancient pagoda.", "options": ["A. appreciate", "B. ruin", "C. forget", "D. lose"], "answer": "A", "explain": "appreciate nghĩa là trân trọng, đánh giá cao."}, {"type": "mcq", "level": "VD", "q": "At midnight, the baby ______ soundly while his parents were watching TV.", "options": ["A. was sleeping", "B. slept", "C. is sleeping", "D. sleeps"], "answer": "A", "explain": "Hai hành động song song trong quá khứ; hành động đang diễn ra dùng quá khứ tiếp diễn."}, {"type": "mcq", "level": "VDC", "q": "After the war, the old citadel was left in ______ and nobody repaired it.", "options": ["A. ruins", "B. structures", "C. behaviours", "D. worships"], "answer": "A", "explain": "Cụm in ruins nghĩa là trong tình trạng đổ nát."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last month, our school organised a trip to the Temple of Literature in Ha Noi. While we were listening to the guide, some foreign tourists were taking photos of the stone turtles. Our teacher said that the temple was built in 1070. We all felt proud of our country's history.", "statements": ["a) The trip to the Temple of Literature was organised last month.", "b) The stone turtles are made of wood.", "c) The teacher said the temple was built in 1070.", "d) The students felt proud of their country's history."], "answer": ["T", "F", "T", "T"], "explain": "Rùa đá làm bằng đá chứ không phải gỗ; các chi tiết còn lại đúng như bài."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). My uncle collects old photos of Ha Noi. One photo shows the Old Quarter in the 1950s. People were riding bicycles on the streets. There were no tall buildings at that time. Looking at the photos, I wish I could travel back in time.", "statements": ["a) The uncle collects modern photos of Ha Noi.", "b) The photo shows the Old Quarter in the 1950s.", "c) People were driving cars on the streets in the photo.", "d) The writer wants to travel back in time."], "answer": ["F", "T", "F", "T"], "explain": "Bác sưu tầm ảnh cũ; trong ảnh người ta đi xe đạp chứ không lái ô tô."}, {"type": "short", "level": "TH", "q": "Give the correct form of the verb in brackets: They (talk) _____ loudly when the teacher entered.", "answer": "were talking", "explain": "Chủ ngữ they dùng were + V-ing."}, {"type": "short", "level": "TH", "q": "Fill in the blank with ONE word: He wishes he _____ a famous singer.", "answer": "were", "explain": "Trong câu ước, động từ to be luôn dùng were."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "The wedding was a ______ event for the whole family.", "options": ["A. memorable", "B. forgetful", "C. boring", "D. sad"], "answer": "A", "explain": "memorable nghĩa là đáng nhớ."}, {"type": "mcq", "level": "NB", "q": "We ______ TV when the phone rang.", "options": ["A. were watching", "B. was watching", "C. watch", "D. are watching"], "answer": "A", "explain": "Hành động đang diễn ra (were watching) thì bị xen vào (rang)."}, {"type": "mcq", "level": "NB", "q": "Hoi An is a world cultural ______ site.", "options": ["A. heritage", "B. behaviour", "C. worship", "D. ruin"], "answer": "A", "explain": "heritage site là di sản văn hóa."}, {"type": "mcq", "level": "TH", "q": "While they ______, someone knocked on the door.", "options": ["A. were sleeping", "B. slept", "C. sleep", "D. are sleeping"], "answer": "A", "explain": "Hành động đang diễn ra thì bị xen vào."}, {"type": "mcq", "level": "VD", "q": "They wish their house ______ near the beach.", "options": ["A. were", "B. is", "C. will be", "D. has been"], "answer": "A", "explain": "Câu ước ở hiện tại: wish + quá khứ đơn; động từ to be luôn dùng were."}, {"type": "mcq", "level": "VDC", "q": "Choose the word which is stressed differently from the others.", "options": ["A. memorable", "B. brilliant", "C. ruinous", "D. behave"], "answer": "D", "explain": "memorable, brilliant, ruinous có trọng âm rơi vào âm tiết đầu; behave có trọng âm rơi vào âm tiết thứ hai."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). In the past, most Vietnamese people lived in extended families. Grandparents, parents and children shared one house. While the men were working in the fields, the women were cooking and taking care of the children. Everyone helped each other, and family bonds were very strong.", "statements": ["a) In the past, nuclear families were common in Viet Nam.", "b) The men were working in the fields while the women were cooking.", "c) Family members did not help each other.", "d) Family bonds were strong in the past."], "answer": ["F", "T", "F", "T"], "explain": "Ngày xưa phổ biến gia đình nhiều thế hệ; mọi người giúp đỡ lẫn nhau."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The Hue Festival is held every two years. During the festival, artists perform traditional music on stages along the Perfume River. Last time, while we were watching a concert, colourful fireworks lit up the sky. It was an unforgettable night.", "statements": ["a) The Hue Festival is held every year.", "b) Artists perform traditional music during the festival.", "c) The writer was watching a concert when the fireworks appeared.", "d) The writer will never forget that night."], "answer": ["F", "T", "T", "T"], "explain": "Lễ hội tổ chức hai năm một lần; đêm đó khó quên (unforgettable)."}, {"type": "short", "level": "TH", "q": "Give the correct form of the verb in brackets: At 7 am yesterday, he (run) _____ in the park.", "answer": "was running", "explain": "Chủ ngữ he dùng was + V-ing; thời điểm xác định trong quá khứ."}, {"type": "short", "level": "TH", "q": "Fill in the blank with ONE word: I wish I _____ play the guitar.", "answer": "could", "explain": "Câu ước về khả năng ở hiện tại dùng wish + could."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "I ______ dinner when my friend arrived.", "options": ["A. was cooking", "B. were cooking", "C. cook", "D. am cooking"], "answer": "A", "explain": "Hành động đang diễn ra thì bị xen vào."}, {"type": "mcq", "level": "NB", "q": "People go to pagodas to ______ their ancestors.", "options": ["A. worship", "B. behave", "C. observe", "D. ruin"], "answer": "A", "explain": "worship nghĩa là thờ cúng."}, {"type": "mcq", "level": "NB", "q": "She ______ to music at 8 pm last night.", "options": ["A. was listening", "B. were listening", "C. listens", "D. is listening"], "answer": "A", "explain": "Thời điểm xác định trong quá khứ + hành động đang diễn ra dùng quá khứ tiếp diễn."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose ending sound is different from the others.", "options": ["A. climb", "B. comb", "C. lamb", "D. lamp"], "answer": "D", "explain": "climb, comb, lamb có b câm nên kết thúc bằng âm /m/; lamp kết thúc bằng âm /mp/."}, {"type": "mcq", "level": "VD", "q": "While the teacher ______, the students were taking notes carefully.", "options": ["A. was explaining", "B. explained", "C. explains", "D. is explaining"], "answer": "A", "explain": "Hai hành động song song trong quá khứ dùng quá khứ tiếp diễn."}, {"type": "mcq", "level": "VDC", "q": "I wish I ______ what to do to protect our heritage sites.", "options": ["A. knew", "B. know", "C. will know", "D. have known"], "answer": "A", "explain": "Câu ước trái với hiện tại dùng wish + quá khứ đơn."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Bat Trang is a famous pottery village near Ha Noi. In the past, artisans made pottery by hand. While the men were shaping the clay, the women were painting beautiful patterns on the pots. Today, tourists can watch the artisans and even try making pottery themselves.", "statements": ["a) Bat Trang is famous for silk products.", "b) In the past, pottery was made by hand.", "c) The women were painting patterns while the men were shaping clay.", "d) Tourists cannot try making pottery in Bat Trang."], "answer": ["F", "T", "T", "F"], "explain": "Bát Tràng nổi tiếng về gốm sứ; du khách có thể tự thử làm gốm."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last weekend, Minh visited his hometown after five years away. Nothing had changed much. The old banyan tree was still there. While he was walking around the village, he met his primary school teacher. They talked happily about the old days.", "statements": ["a) Minh had been away from his hometown for five years.", "b) The old banyan tree had been cut down.", "c) He met his teacher while walking around the village.", "d) They talked sadly about the past."], "answer": ["T", "F", "T", "F"], "explain": "Cây đa cổ vẫn còn đó; họ trò chuyện vui vẻ chứ không buồn."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: While she (read) _____ a book, her baby was crying.", "answer": "was reading", "explain": "Hai hành động song song trong quá khứ dùng quá khứ tiếp diễn."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE word: The students wish the school year _____ longer.", "answer": "were", "explain": "Trong câu ước, động từ to be luôn dùng were."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "The old town was badly damaged and left in ______.", "options": ["A. ruins", "B. worships", "C. behaviours", "D. structures"], "answer": "A", "explain": "in ruins nghĩa là trong tình trạng đổ nát."}, {"type": "mcq", "level": "NB", "q": "What were you ______ at 9 last night?", "options": ["A. doing", "B. do", "C. done", "D. did"], "answer": "A", "explain": "Sau were dùng V-ing trong thì quá khứ tiếp diễn."}, {"type": "mcq", "level": "NB", "q": "Choose the word in which the letter l is NOT pronounced.", "options": ["A. lake", "B. land", "C. long", "D. half"], "answer": "D", "explain": "Trong lake, land, long chữ l được phát âm; trong half chữ l câm."}, {"type": "mcq", "level": "TH", "q": "They wish they ______ on holiday now.", "options": ["A. were", "B. are", "C. will be", "D. have been"], "answer": "A", "explain": "Câu ước trái với hiện tại: wish + quá khứ đơn; to be dùng were."}, {"type": "mcq", "level": "VD", "q": "The Imperial City is a large ______ of palaces and temples.", "options": ["A. complex", "B. behaviour", "C. worship", "D. ruin"], "answer": "A", "explain": "complex nghĩa là khu phức hợp."}, {"type": "mcq", "level": "VDC", "q": "While I ______ across the old bridge, I dropped my camera into the river.", "options": ["A. was walking", "B. walked", "C. had walked", "D. walk"], "answer": "A", "explain": "Hành động đang diễn ra (was walking) thì bị xen vào (dropped)."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Collecting memories is a hobby of many elderly people. Mrs Lan keeps a box of old letters and photos. Every evening, she opens the box and remembers the past. While she is looking at a photo of her wedding, tears of happiness roll down her cheeks. She wishes her grandchildren understood how precious those memories are.", "statements": ["a) Mrs Lan throws away old letters and photos.", "b) She looks at the memory box every evening.", "c) She cries because she is sad.", "d) She wants her grandchildren to understand the value of memories."], "answer": ["F", "T", "F", "T"], "explain": "Bà giữ gìn thư ảnh cũ; bà khóc vì hạnh phúc chứ không phải buồn."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Archaeologists work hard to uncover the past. Last year, while they were digging near an old citadel, they found pieces of ancient pottery. The pieces were carefully cleaned and studied. Thanks to their work, we now know more about how people lived hundreds of years ago.", "statements": ["a) Archaeologists found ancient pottery while digging near an old citadel.", "b) The pottery pieces were thrown away after being found.", "c) Their work helps us understand life in the past.", "d) The citadel was built last year."], "answer": ["T", "F", "T", "F"], "explain": "Các mảnh gốm được làm sạch và nghiên cứu chứ không vứt đi; đó là thành cổ chứ không mới xây."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: He (drive) _____ home when the accident happened.", "answer": "was driving", "explain": "Hành động đang diễn ra thì bị xen vào."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE word: We wish we _____ afford to travel abroad.", "answer": "could", "explain": "Câu ước về khả năng ở hiện tại dùng wish + could."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "They ______ playing chess at 4 pm yesterday.", "options": ["A. were", "B. was", "C. are", "D. is"], "answer": "A", "explain": "Chủ ngữ they dùng were + V-ing."}, {"type": "mcq", "level": "NB", "q": "A ______ is a building made to remember a famous person or event.", "options": ["A. monument", "B. behaviour", "C. worship", "D. takeaway"], "answer": "A", "explain": "monument là tượng đài, đài ) or False (F). Time flies, but memories stay. Mr Ba is now 80 years old. He still remembers the day he left his village for the city. While the bus was moving slowly, he was looking back at his home. He wished he did not have to leave, but life was hard then. Now his grandchildren love hearing his stories.", "statements": ["a) Mr Ba has forgotten his childhood memories.", "b) He was looking back at his home while the bus was moving.", "c) He was happy to leave his village.", "d) His grandchildren enjoy his stories."], "answer": ["F", "T", "F", "T"], "explain": "Ông vẫn nhớ ký ức tuổi thơ; ông ước không phải rời làng, tức là không vui khi ra đi."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: While the children (play) _____ in the yard, their mother was cooking.", "answer": "were playing", "explain": "Hai hành động song song trong quá khứ dùng quá khứ tiếp diễn."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: She wishes she _____ speak three languages.", "answer": "could", "explain": "Câu ước về khả năng ở hiện tại dùng wish + could."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "The children should ______ well in public places.", "options": ["A. behave", "B. ruin", "C. worship", "D. observe"], "answer": "A", "explain": "behave well nghĩa là cư xử tốt."}, {"type": "mcq", "level": "NB", "q": "He ______ TV at 7 pm yesterday.", "options": ["A. was watching", "B. were watching", "C. watches", "D. is watching"], "answer": "A", "explain": "Thời điểm xác định trong quá khứ + hành động đang diễn ra dùng quá khứ tiếp diễn."}, {"type": "mcq", "level": "TH", "q": "I wish my school ______ a swimming pool.", "options": ["A. had", "B. has", "C. will have", "D. is having"], "answer": "A", "explain": "Câu ước ở hiện tại: wish + quá khứ đơn."}, {"type": "mcq", "level": "TH", "q": "The ______ music performance won the first prize.", "options": ["A. brilliant", "B. ruinous", "C. ancient",
