tress is on a different syllable.", "options": ["A. public", "B. Pacific", "C. historic", "D. terrific"], "answer": "A", "explain": "public /ˈpʌblɪk/ nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 (trước -ic)."}, {"type": "mcq", "level": "NB", "q": "Choose the word that does not share the same stress pattern as the others.", "options": ["A. ambitious", "B. various", "C. previous", "D. spacious"], "answer": "A", "explain": "ambitious /æmˈbɪʃəs/ nhấn âm tiết thứ 2 (trước -ious), các từ còn lại nhấn âm tiết đầu."}, {"type": "mcq", "level": "NB", "q": "They bought a _____ which included flights, hotels and meals.", "options": ["A. hop-on hop-off", "B. work out", "C. low season", "D. package tour"], "answer": "D", "explain": "package tour (tour trọn gói): gồm vé máy bay, khách sạn và bữa ăn."}, {"type": "mcq", "level": "TH", "q": "The hotel _____ we stayed in was near the beach.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "B", "explain": "Đại từ quan hệ chỉ vật (the hotel): which."}, {"type": "mcq", "level": "VD", "q": "The teacher to _____ we spoke gave us a free map.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "D", "explain": "Sau giới từ to, chỉ người làm tân ngữ: whom."}, {"type": "mcq", "level": "TH", "q": "'What do you think of a self-guided tour?' '_____'.", "options": ["A. I think it is a great idea for young travellers.", "B. It is a tour.", "C. I do not think.", "D. Yes, I do."], "answer": "A", "explain": "Nêu ý kiến đầy đủ khi được hỏi quan điểm."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). A package tour includes transport, hotels and meals in one price. Travellers do not need to plan anything themselves. This kind of tour is good for people who visit a place for the first time. However, it is usually more expensive than self-guided travel.", "statements": ["a) A package tour includes many services in one price.", "b) Travell
