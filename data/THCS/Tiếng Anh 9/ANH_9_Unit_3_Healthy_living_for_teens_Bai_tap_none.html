<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. food", "B. school", "C. good", "D. moon"], "answer": "C", "explain": "good đọc là /ɡʊd/ với âm /ʊ/, còn food, school, moon đọc với âm /uː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. physical", "B. mental", "C. social", "D. essential"], "answer": "D", "explain": "essential nhấn âm 2, còn physical, mental, social nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Regular exercise is good for your _____ health.", "options": ["A. physical", "B. mental", "C. social", "D. final"], "answer": "A", "explain": "physical health (sức khỏe thể chất) là cụm từ đúng với tập thể dục."}, {"type": "mcq", "level": "TH", "q": "If you want to stay healthy, you _____ eat more vegetables.", "options": ["A. should", "B. shouldn't", "C. can't", "D. mustn't"], "answer": "A", "explain": "should (nên) dùng để đưa ra lời khuyên trong câu điều kiện loại 1."}, {"type": "mcq", "level": "VD", "q": "If you want to pass, you _____ start revising now; there is no other choice.", "options": ["A. must", "B. might", "C. could", "D. may"], "answer": "A", "explain": "must (phải) diễn tả sự bắt buộc khi không còn lựa chọn nào khác."}, {"type": "mcq", "level": "VDC", "q": "If you had told me earlier, I _____ helped you.", "options": ["A. would have", "B. will have", "C. have", "D. had"], "answer": "A", "explain": "Câu điều kiện loại 3: If + S + had + V3, S + would have + V3."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Exercise is very important for teenagers. It keeps the body strong and healthy. It also helps reduce stress. You should exercise at least 30 minutes a day.", "statements": ["a) Exercise is important for teenagers.", "b) It keeps the body strong.", "c) It increases stress.", "d) 30 minutes a day is enough."], "answer": ["T", "T", "F", "T"], "explain": "a) T (tập thể dục quan trọng). b) T (giữ cơ thể khỏe mạnh). c) F (giúp giảm căng thẳng). d) T (ít nhất 30 phút mỗi ngày)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many teenagers feel pressure from schoolwork. Too many assignments and close due dates cause anxiety. Some students stay up late to finish work. This harms both physical and mental health.", "statements": ["a) Schoolwork can pressure teens.", "b) Due dates never cause anxiety.", "c) Staying up late harms health.", "d) Pressure affects mental health."], "answer": ["T", "F", "T", "T"], "explain": "a) T (bài vở gây áp lực). b) F (hạn nộp bài gây lo âu). c) T (thức khuya hại sức khỏe). d) T (áp lực ảnh hưởng sức khỏe tinh thần)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: _____ you want to stay healthy, you should exercise daily.", "answer": "If", "explain": "Câu điều kiện loại 1 bắt đầu bằng If."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She felt (stress) _____ before the big exam.", "answer": "stressed", "explain": "Sau động từ feel cần tính từ: stress thành stressed (căng thẳng)."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. book", "B. look", "C. too", "D. foot"], "answer": "C", "explain": "too đọc là /tuː/ với âm /uː/, còn book, look, foot đọc với âm /ʊ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. stressed", "B. anxious", "C. relaxed", "D. happy"], "answer": "C", "explain": "relaxed nhấn âm 2, còn stressed, anxious, happy nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "She felt _____ out before the exam.", "options": ["A. stressed", "B. relaxed", "C. happy", "D. calm"], "answer": "A", "explain": "stressed out (căng thẳng mạnh) phù hợp với tâm trạng trước kỳ thi."}, {"type": "mcq", "level": "TH", "q": "If he has a fever, he _____ stay in bed.", "options": ["A. should", "B. shouldn't", "C. can", "D. may"], "answer": "A", "explain": "should (nên) đưa ra lời khuyên: bị sốt thì nên nằm nghỉ."}, {"type": "mcq", "level": "VD", "q": "If you are free tonight, we _____ go to the cinema.", "options": ["A. could", "B. must", "C. should", "D. have to"], "answer": "A", "explain": "could (có thể) dùng để đưa ra gợi ý nhẹ nhàng."}, {"type": "mcq", "level": "VDC", "q": "You look tired. You _____ have stayed up late last night.", "options": ["A. must", "B. should", "C. can", "D. may"], "answer": "A", "explain": "must have + V3 diễn tả suy đoán chắc chắn về quá khứ: chắc hẳn đã thức khuya."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Sleep is as important as food. Teenagers need 8 to 10 hours of sleep. Lack of sleep makes you tired and unfocused. Going to bed early is a good habit.", "statements": ["a) Sleep is important.", "b) Teenagers need 8-10 hours.", "c) Lack of sleep makes you focused.", "d) Going to bed early is good."], "answer": ["T", "T", "F", "T"], "explain": "a) T (giấc ngủ quan trọng như thức ăn). b) T (tuổi teen cần 8-10 giờ). c) F (thiếu ngủ làm mệt và mất tập trung). d) T (đi ngủ sớm là thói quen tốt)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). If teenagers manage time well, they will feel less stressed. Making a plan helps them finish tasks on time. They should put important tasks first. Small breaks also help them stay fresh.", "statements": ["a) Time management reduces stress.", "b) Plans help finish tasks on time.", "c) Important tasks should come last.", "d) Small breaks help."], "answer": ["T", "T", "F", "T"], "explain": "a) T (quản lý thời gian giảm căng thẳng). b) T (lập kế hoạch giúp xong việc đúng hạn). c) F (việc quan trọng nên làm trước). d) T (nghỉ ngắn giúp tỉnh táo)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: She has been stressed _____ since last week.", "answer": "out", "explain": "Cụm từ stressed out (căng thẳng): chỗ trống cần out."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: He gave me (value) _____ advice.", "answer": "valuable", "explain": "Trước danh từ advice cần tính từ: value thành valuable (quý báu)."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'u' is pronounced differently from the others.", "options": ["A. put", "B. full", "C. push", "D. group"], "answer": "D", "explain": "group đọc là /ɡruːp/ với âm /uː/, còn put, full, push đọc với âm /ʊ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. diet", "B. habit", "C. routine", "D. enough"], "answer": "D", "explain": "enough nhấn âm 2, còn diet, habit, routine nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Too much _____ can harm your mental health.", "options": ["A. anxiety", "B. joy", "C. laughter", "D. sleep"], "answer": "A", "explain": "anxiety (sự lo âu) quá nhiều hại sức khỏe tinh thần."}, {"type": "mcq", "level": "TH", "q": "If you feel stressed, you _____ talk to someone you trust.", "options": ["A. should", "B. mustn't", "C. can't", "D. shouldn't"], "answer": "A", "explain": "should (nên) đưa ra lời khuyên khi căng thẳng."}, {"type": "mcq", "level": "VD", "q": "You _____ smoke here; it is against the rules.", "options": ["A. mustn't", "B. don't have to", "C. might not", "D. couldn't"], "answer": "A", "explain": "mustn't (không được) diễn tả sự cấm đoán theo nội quy."}, {"type": "mcq", "level": "VDC", "q": "She _____ be at home; the lights are on.", "options": ["A. must", "B. can", "C. may", "D. should"], "answer": "A", "explain": "must + V diễn tả suy đoán chắc chắn ở hiện tại: chắc hẳn đang ở nhà."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). A balanced diet keeps you healthy. Eat more fruit and vegetables. Drink enough water every day. Avoid too much fast food and sweets.", "statements": ["a) A balanced diet keeps you healthy.", "b) Eat more fruit and vegetables.", "c) Drink little water.", "d) Avoid too much fast food."], "answer": ["T", "T", "F", "T"], "explain": "a) T (ăn cân bằng giữ sức khỏe). b) T (ăn nhiều rau quả). c) F (uống đủ nước mỗi ngày). d) T (tránh đồ ăn nhanh và đồ ngọt)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Social media can affect teenagers' feelings. Seeing perfect photos may make them less confident. Spending too much time online reduces real communication. Limiting screen time is a wise choice.", "statements": ["a) Social media can affect feelings.", "b) Perfect photos may lower confidence.", "c) Online time increases real communication.", "d) Limiting screen time is wise."], "answer": ["T", "T", "F", "T"], "explain": "a) T (mạng xã hội ảnh hưởng cảm xúc). b) T (ảnh hoàn hảo làm giảm tự tin). c) F (giảm giao tiếp thật). d) T (hạn chế thời gian màn hình là khôn ngoan)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: He goes jogging _____ the morning.", "answer": "in", "explain": "in + buổi trong ngày (the morning)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Regular exercise makes you (energy) _____.", "answer": "energetic", "explain": "Sau tân ngữ you cần tính từ: energy thành energetic (tràn đầy năng lượng)."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'u' is pronounced differently from the others.", "options": ["A. blue", "B. true", "C. pull", "D. glue"], "answer": "C", "explain": "pull đọc là /pʊl/ với âm /ʊ/, còn blue, true, glue đọc với âm /uː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. counsellor", "B. doctor", "C. teacher", "D. delay"], "answer": "D", "explain": "delay nhấn âm 2, còn counsellor, doctor, teacher nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "A _____ diet includes fruit, vegetables, and protein.", "options": ["A. balanced", "B. heavy", "C. sweet", "D. salty"], "answer": "A", "explain": "balanced diet (chế độ ăn cân bằng) gồm rau quả và đạm."}, {"type": "mcq", "level": "TH", "q": "If it is sunny tomorrow, we _____ go for a picnic.", "options": ["A. can", "B. must", "C. should", "D. have to"], "answer": "A", "explain": "can (có thể) diễn tả khả năng khi thời tiết đẹp."}, {"type": "mcq", "level": "VD", "q": "If you take this medicine, you _____ feel better soon.", "options": ["A. should", "B. must", "C. have to", "D. need"], "answer": "A", "explain": "should (sẽ, nên) diễn tả kết quả có thể xảy ra một cách tự nhiên."}, {"type": "mcq", "level": "VDC", "q": "He _____ have missed the bus; he is always punctual.", "options": ["A. can't", "B. mustn't", "C. shouldn't", "D. may not"], "answer": "A", "explain": "can't have + V3 diễn tả điều không thể đã xảy ra: chắc hẳn đã không lỡ xe buýt."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Stress is normal in teenage life. Exams and homework can cause stress. Talking to friends helps reduce it. You should not keep worries to yourself.", "statements": ["a) Stress is normal for teens.", "b) Exams can cause stress.", "c) Talking to friends increases stress.", "d) Share your worries."], "answer": ["T", "T", "F", "T"], "explain": "a) T (căng thẳng là bình thường). b) T (thi cử gây căng thẳng). c) F (tâm sự với bạn giúp giảm căng thẳng). d) T (nên chia sẻ nỗi lo)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). When you feel anxious, try deep breathing. Breathe in slowly and breathe out slowly. This simple exercise calms your mind. You can do it anywhere, anytime.", "statements": ["a) Deep breathing helps anxiety.", "b) Breathe in and out slowly.", "c) It makes anxiety worse.", "d) You can do it anywhere."], "answer": ["T", "T", "F", "T"], "explain": "a) T (hít thở sâu giúp giảm lo âu). b) T (hít vào thở ra chậm). c) F (bài tập làm dịu tâm trí). d) T (làm được ở mọi nơi, mọi lúc)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Eating _____ many sweets is bad for your teeth.", "answer": "too", "explain": "too many (quá nhiều) + danh từ đếm được."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She looked (anxiety) _____ before the interview.", "answer": "anxious", "explain": "Sau động từ looked cần tính từ: anxiety thành anxious (lo lắng)."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. room", "B. soon", "C. wood", "D. spoon"], "answer": "C", "explain": "wood đọc là /wʊd/ với âm /ʊ/, còn room, soon, spoon đọc với âm /uː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. pressure", "B. deadline", "C. priority", "D. project"], "answer": "C", "explain": "priority nhấn âm 2, còn pressure, deadline, project nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "He tried to _____ on his homework but the noise distracted him.", "options": ["A. concentrate", "B. sleep", "C. play", "D. run"], "answer": "A", "explain": "concentrate on (tập trung vào) bài tập nhưng bị tiếng ồn làm xao nhãng."}, {"type": "mcq", "level": "TH", "q": "If you don't sleep enough, you _____ feel tired.", "options": ["A. may", "B. mustn't", "C. shouldn't", "D. can't"], "answer": "A", "explain": "may (có thể) diễn tả khả năng xảy ra: thiếu ngủ thì có thể mệt."}, {"type": "mcq", "level": "VD", "q": "Students _____ wear uniforms at my school; it is compulsory.", "options": ["A. must", "B. may", "C. might", "D. could"], "answer": "A", "explain": "must (phải) diễn tả sự bắt buộc theo quy định."}, {"type": "mcq", "level": "VDC", "q": "If I were you, I _____ take a break.", "options": ["A. would", "B. will", "C. shall", "D. can"], "answer": "A", "explain": "Câu điều kiện loại 2: If I were you, I would... (Nếu là bạn, tôi sẽ...)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Spending time outdoors is good for health. Fresh air makes you feel better. You can play sports or go for a walk. Nature helps you relax.", "statements": ["a) Outdoors time is healthy.", "b) Fresh air makes you feel better.", "c) You should stay indoors all day.", "d) Nature helps you relax."], "answer": ["T", "T", "F", "T"], "explain": "a) T (ra ngoài tốt cho sức khỏe). b) T (không khí trong lành giúp khỏe hơn). c) F (nên ra ngoài chơi thể thao, đi dạo). d) T (thiên nhiên giúp thư giãn)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). A school counsellor helps students with problems. If you feel sad for a long time, you should talk to one. Asking for help is not weak. It is a smart way to stay healthy.", "statements": ["a) Counsellors help students.", "b) Talk to one if sad long.", "c) Asking for help is weak.", "d) It helps stay healthy."], "answer": ["T", "T", "F", "T"], "explain": "a) T (chuyên gia tư vấn giúp học sinh). b) T (buồn lâu nên tâm sự). c) F (nhờ giúp đỡ không phải yếu đuối). d) T (cách thông minh để khỏe mạnh)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: You should turn _____ your phone before sleeping.", "answer": "off", "explain": "Cụm động từ turn off (tắt): chỗ trống cần off."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: A (balance) _____ diet is very important.", "answer": "balanced", "explain": "Trước danh từ diet cần tính từ (dạng quá khứ phân từ): balance thành balanced (cân bằng)."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. cook", "B. took", "C. food", "D. stood"], "answer": "C", "explain": "food đọc là /fuːd/ với âm /uː/, còn cook, took, stood đọc với âm /ʊ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. accomplish", "B. exercise", "C. diet", "D. sleep"], "answer": "A", "explain": "accomplish nhấn âm 2, còn exercise, diet, sleep nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "You should set _____ for your tasks to manage time well.", "options": ["A. priorities", "B. games", "C. parties", "D. films"], "answer": "A", "explain": "set priorities (đặt ưu tiên) cho công việc để quản lý thời gian tốt."}, {"type": "mcq", "level": "TH", "q": "If she wants good marks, she _____ study harder.", "options": ["A. must", "B. mustn't", "C. can't", "D. shouldn't"], "answer": "A", "explain": "must (phải) diễn tả sự cần thiết để đạt điểm tốt."}, {"type": "mcq", "level": "VD", "q": "If you don't hurry, you _____ miss the bus.", "options": ["A. might", "B. must", "C. should", "D. have to"], "answer": "A", "explain": "might (có thể) diễn tả khả năng lỡ xe buýt."}, {"type": "mcq", "level": "VDC", "q": "You _____ have eaten all that cake; now you feel sick.", "options": ["A. shouldn't", "B. mustn't", "C. can't", "D. may not"], "answer": "A", "explain": "shouldn't have + V3: lẽ ra đã không nên ăn hết bánh (phê phán việc đã làm)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Drinking water is better than soft drinks. Water has no sugar. It keeps your body fresh. You should drink about two litres a day.", "statements": ["a) Water is better than soft drinks.", "b) Water has no sugar.", "c) Soft drinks are healthier.", "d) Drink about two litres daily."], "answer": ["T", "T", "F", "T"], "explain": "a) T (nước tốt hơn nước ngọt). b) T (nước không có đường). c) F (nước ngọt kém lành mạnh hơn). d) T (uống khoảng hai lít mỗi ngày)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Doing housework is also a form of exercise. Cleaning and cooking keep you active. They also teach you life skills. Helping parents makes the family happier.", "statements": ["a) Housework is a form of exercise.", "b) It keeps you active.", "c) It teaches no skills.", "d) Helping parents makes family happier."], "answer": ["T", "T", "F", "T"], "explain": "a) T (làm việc nhà cũng là vận động). b) T (giữ cơ thể năng động). c) F (dạy kỹ năng sống). d) T (giúp bố mẹ làm gia đình hạnh phúc hơn)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: She is tired _____ staying up late.", "answer": "of", "explain": "Cấu trúc: be tired of (mệt mỏi vì)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: His (optimism) _____ attitude impressed everyone.", "answer": "optimistic", "explain": "Trước danh từ attitude cần tính từ: optimism thành optimistic (lạc quan)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'u' is pronounced differently from the others.", "options": ["A. sugar", "B. ruler", "C. duty", "D. music"], "answer": "A", "explain": "sugar đọc là /ˈʃʊɡə/ với âm /ʊ/, còn ruler, duty, music đọc với âm /uː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. optimistic", "B. positive", "C. active", "D. healthy"], "answer": "A", "explain": "optimistic nhấn âm chính ở âm 3, còn positive, active, healthy nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "She felt _____ after a good night's sleep.", "options": ["A. relaxed", "B. tired", "C. stressed", "D. worried"], "answer": "A", "explain": "relaxed (thư thái) sau một đêm ngủ ngon."}, {"type": "mcq", "level": "TH", "q": "If you finish your homework, you _____ watch TV.", "options": ["A. can", "B. must", "C. should", "D. have to"], "answer": "A", "explain": "can (có thể, được phép) xem TV khi xong bài tập."}, {"type": "mcq", "level": "VD", "q": "You _____ eat in class; the teacher forbids it.", "options": ["A. mustn't", "B. needn't", "C. might not", "D. couldn't"], "answer": "A", "explain": "mustn't (không được) diễn tả sự cấm đoán của giáo viên."}, {"type": "mcq", "level": "VDC", "q": "By the time you arrive, I _____ finished my homework.", "options": ["A. will have", "B. have", "C. had", "D. will"], "answer": "A", "explain": "By the time + tương lai dùng tương lai hoàn thành: will have finished (sẽ đã làm xong)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Good friends make you happier. You can share joy and sadness with them. They support you in difficult times. Spending time with friends reduces stress.", "statements": ["a) Good friends make you happier.", "b) Share feelings with friends.", "c) Friends never help you.", "d) Friends reduce stress."], "answer": ["T", "T", "F", "T"], "explain": "a) T (bạn tốt làm ta hạnh phúc hơn). b) T (chia sẻ vui buồn). c) F (bạn bè giúp đỡ lúc khó khăn). d) T (bên bạn bè giảm căng thẳng)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). If you sit too long, your body will ache. Stand up and move every hour. Stretch your arms and legs. These small habits protect your health.", "statements": ["a) Sitting long causes aches.", "b) Move every hour.", "c) Stretching is useless.", "d) Small habits protect health."], "answer": ["T", "T", "F", "T"], "explain": "a) T (ngồi lâu gây đau người). b) T (đứng dậy vận động mỗi giờ). c) F (nên duỗi tay chân). d) T (thói quen nhỏ bảo vệ sức khỏe)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: They have lived a healthy life _____ years.", "answer": "for", "explain": "for + khoảng thời gian (years)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The movie was (disappoint) _____.", "answer": "disappointing", "explain": "Tính từ chỉ tính chất gây thất vọng: disappoint thành disappointing."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'o' is pronounced differently from the others.", "options": ["A. woman", "B. wolf", "C. move", "D. would"], "answer": "C", "explain": "move đọc là /muːv/ với âm /uː/, còn woman, wolf, would đọc với âm /ʊ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. distraction", "B. attention", "C. focus", "D. delay"], "answer": "C", "explain": "focus nhấn âm 1, còn distraction, attention, delay nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "Teenagers should not stay up late; they need enough _____.", "options": ["A. sleep", "B. food", "C. noise", "D. homework"], "answer": "A", "explain": "need enough sleep (cần ngủ đủ giấc)."}, {"type": "mcq", "level": "TH", "q": "If the weather is bad, we _____ stay indoors.", "options": ["A. should", "B. shouldn't", "C. must", "D. can"], "answer": "A", "explain": "should (nên) đưa ra lời khuyên khi thời tiết xấu."}, {"type": "mcq", "level": "VD", "q": "If she practises speaking daily, her English _____ improve a lot.", "options": ["A. will", "B. must", "C. should", "D. can"], "answer": "A", "explain": "will diễn tả kết quả chắc chắn trong câu điều kiện loại 1."}, {"type": "mcq", "level": "VDC", "q": "It is essential that he _____ to the doctor.", "options": ["A. goes", "B. go", "C. went", "D. going"], "answer": "B", "explain": "Cấu trúc giả định: It is essential that + S + V (nguyên mẫu)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Reading books is a good hobby. It improves your knowledge. It also helps you relax after school. You should read a little every day.", "statements": ["a) Reading is a good hobby.", "b) It improves knowledge.", "c) It makes you more stressed.", "d) Read a little daily."], "answer": ["T", "T", "F", "T"], "explain": "a) T (đọc sách là sở thích tốt). b) T (nâng cao kiến thức). c) F (giúp thư giãn sau giờ học). d) T (nên đọc một chút mỗi ngày)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Positive thinking improves mental health. When problems come, look for solutions. Talk to people you trust. Every difficulty teaches you something.", "statements": ["a) Positive thinking helps mental health.", "b) Look for solutions to problems.", "c) Keep problems to yourself.", "d) Difficulties teach lessons."], "answer": ["T", "T", "F", "T"], "explain": "a) T (suy nghĩ tích cực tốt cho tinh thần). b) T (tìm giải pháp cho vấn đề). c) F (nên tâm sự với người tin tưởng). d) T (khó khăn dạy ta bài học)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: If you feel tired, you _____ take a short rest.", "answer": "should", "explain": "should (nên) nghỉ ngơi khi mệt."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She felt (relax) _____ after yoga class.", "answer": "relaxed", "explain": "Sau động từ felt cần tính từ chỉ cảm giác: relax thành relaxed (thư giãn)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ui' is pronounced differently from the others.", "options": ["A. fruit", "B. juice", "C. build", "D. suit"], "answer": "C", "explain": "build đọc là /bɪld/, còn fruit, juice, suit đọc với âm /uː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. anxiety", "B. worry", "C. panic", "D. calm"], "answer": "A", "explain": "anxiety nhấn âm 2, còn worry, panic, calm nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Talking to a _____ can help you solve personal problems.", "options": ["A. counsellor", "B. stranger", "C. driver", "D. singer"], "answer": "A", "explain": "counsellor (chuyên gia tư vấn) giúp giải quyết vấn đề cá nhân."}, {"type": "mcq", "level": "TH", "q": "If you eat too much fast food, you _____ gain weight.", "options": ["A. might", "B. mustn't", "C. shouldn't", "D. can't"], "answer": "A", "explain": "might (có thể) diễn tả khả năng tăng cân."}, {"type": "mcq", "level": "VD", "q": "If you feel dizzy, you _____ sit down and rest.", "options": ["A. should", "B. must", "C. have to", "D. need"], "answer": "A", "explain": "should (nên) đưa ra lời khuyên khi chóng mặt."}, {"type": "mcq", "level": "VDC", "q": "_____ hard you try, you cannot change the past.", "options": ["A. However", "B. Although", "C. Despite", "D. Because"], "answer": "A", "explain": "Cấu trúc: However + adj + S + V (Dù... đến đâu)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Breakfast is the most important meal. It gives you energy for the morning. Students who skip breakfast feel tired. Never go to school hungry.", "statements": ["a) Breakfast is important.", "b) It gives morning energy.", "c) Skipping breakfast is fine.", "d) Don't go to school hungry."], "answer": ["T", "T", "F", "T"], "explain": "a) T (bữa sáng quan trọng nhất). b) T (cung cấp năng lượng buổi sáng). c) F (bỏ bữa sáng sẽ mệt). d) T (đừng đến trường khi đói)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Playing team sports builds both health and friendship. You learn to cooperate with others. Winning and losing both teach lessons. The most important thing is to enjoy the game.", "statements": ["a) Team sports build health and friendship.", "b) You learn cooperation.", "c) Only winning matters.", "d) Enjoying the game matters most."], "answer": ["T", "T", "F", "T"], "explain": "a) T (thể thao đồng đội rèn sức khỏe và tình bạn). b) T (học cách hợp tác). c) F (thắng thua đều dạy bài học). d) T (vui vẻ khi chơi là quan trọng nhất)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: She is good _____ swimming.", "answer": "at", "explain": "Cấu trúc: be good at (giỏi về)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Eating vegetables is (benefit) _____ to health.", "answer": "beneficial", "explain": "Sau động từ tobe cần tính từ: benefit thành beneficial (có lợi)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. shoe", "B. two", "C. look", "D. do"], "answer": "C", "explain": "look đọc là /lʊk/ với âm /ʊ/, còn shoe, two, do đọc với âm /uː/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. lifestyle", "B. habit", "C. custom", "D. behave"], "answer": "D", "explain": "behave nhấn âm 2, còn lifestyle, habit, custom nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Being _____ helps you see the good side of things.", "options": ["A. optimistic", "B. sad", "C. angry", "D. tired"], "answer": "A", "explain": "optimistic (lạc quan) giúp nhìn mặt tốt của mọi việc."}, {"type": "mcq", "level": "TH", "q": "If he apologises, she _____ forgive him.", "options": ["A. may", "B. must", "C. should", "D. has to"], "answer": "A", "explain": "may (có thể) diễn tả khả năng tha thứ."}, {"type": "mcq", "level": "VD", "q": "Teenagers _____ sleep at least eight hours a night.", "options": ["A. should", "B. may", "C. might", "D. could"], "answer": "A", "explain": "should (nên) đưa ra lời khuyên về giấc ngủ."}, {"type": "mcq", "level": "VDC", "q": "She suggested that he _____ a break.", "options": ["A. takes", "B. take", "C. took", "D. taking"], "answer": "B", "explain": "Cấu trúc giả định sau suggest: suggest that + S + V (nguyên mẫu)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Listening to music can reduce stress. Soft music helps you relax. You can listen after studying. But don't listen too loudly.", "statements": ["a) Music can reduce stress.", "b) Soft music relaxes you.", "c) Listen after studying.", "d) Listen as loudly as possible."], "answer": ["T", "T", "T", "F"], "explain": "a) T (âm nhạc giảm căng thẳng). b) T (nhạc nhẹ giúp thư giãn). c) T (nghe sau khi học). d) F (đừng nghe quá to)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). If teenagers sleep late regularly, their study results may drop. The brain needs rest to remember lessons. Going to bed before 11 p.m. is ideal. Good sleep leads to good marks.", "statements": ["a) Late sleep may lower results.", "b) The brain needs rest.", "c) Going to bed early is ideal.", "d) Sleep has no effect on study."], "answer": ["T", "T", "T", "F"], "explain": "a) T (ngủ muộn thường xuyên làm kết quả học tập giảm). b) T (não cần nghỉ để ghi nhớ). c) T (đi ngủ trước 11 giờ là lý tưởng). d) F (giấc ngủ tốt dẫn đến điểm tốt)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Too _____ screen time is harmful to your eyes.", "answer": "much", "explain": "too much (quá nhiều) + danh từ không đếm được."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: He made a (decide) _____ to quit smoking.", "answer": "decision", "explain": "Sau mạo từ a cần danh từ: decide thành decision (quyết định)."}]}]}</script>
