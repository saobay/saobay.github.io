", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) phân tích ý nghĩa chi tiết thầy Đuy-sen bị đánh vẫn kiên trì đến lớp.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: vị trí chi tiết. Thân đoạn: chi tiết tiêu biểu — tương phản giữa bạo lực và ý chí; thể hiện lòng tận tụy, niềm tin vào chữ nghĩa; tác dụng gây xúc động. Kết đoạn: đánh giá giá trị chi tiết. Tiêu chí chấm: chỉ ra được đây là chi tiết tiêu biểu, phân tích sâu."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Chi tiết tiêu biểu trong truyện ngắn là gì?", "options": ["A. Chi tiết dài dòng, lan man.", "B. Chi tiết đắt giá, tập trung thể hiện tính cách nhân vật và chủ đề.", "C. Chi tiết không liên quan đến truyện.", "D. Chi tiết chỉ để cho đủ chữ."], "answer": "B", "explain": "Chi tiết tiêu biểu là chi tiết đắt giá, cô đọng mà giàu sức gợi về nhân vật và chủ đề.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngôi kể thứ nhất có đặc điểm gì?", "options": ["A. Người kể xưng “tôi”, là người trong cuộc của câu chuyện.", "B. Người kể gọi nhân vật bằng tên, đứng ngoài câu chuyện.", "C. Không có người kể.", "D. Nhiều người cùng kể."], "answer": "A", "explain": "Ngôi thứ nhất: người kể xưng “tôi”, trực tiếp tham gia hoặc chứng kiến câu chuyện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngôi kể thứ ba có đặc điểm gì?", "options": ["A. Người kể xưng “tôi”.", "B. Người kể đứng ngoài câu chuyện, gọi nhân vật bằng tên.", "C. Người kể là nhân vật chính.", "D. Người kể không biết gì về truyện."], "answer": "B", "explain": "Ngôi thứ ba: người kể ngoài cuộc, gọi nhân vật bằng tên, có thể biết hết mọi việc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc thầy Đuy-sen cứu An-tư-nai khỏi hủ tục bắt vợ có ý nghĩa gì?", "options": ["A. Thể hiện thầy là người dũng cảm, bảo vệ lẽ phải và quyền được học của trẻ em.", "B. Thể hiện thầy thích gây gổ.", "C. Không có ý nghĩa gì.", "D. Thể hiện thầy giàu có."], "answer": "A", "explain": "Hành động cứu học trò k c) Đúng. d) Sai: người kể là An-tư-nai bằng ngôi thứ nhất.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về nhân vật An-tư-nai trong “Người thầy đầu tiên”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu An-tư-nai. Thân đoạn: cô bé mồ côi bất hạnh, được thầy cứu giúp; nghị lực vươn lên thành đạt; lòng biết ơn thầy qua lời kể ngôi thứ nhất. Kết đoạn: bài học về nghị lực và lòng biết ơn. Tiêu chí chấm: cảm nhận được hai chặng đời nhân vật, có dẫn chứng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu suy nghĩ của em về ý nghĩa việc thầy Đuy-sen cứu An-tư-nai khỏi hủ tục bắt vợ.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: tóm tắt sự việc. Thân đoạn: hành động dũng cảm bảo vệ lẽ phải; bảo vệ quyền được học, được sống của trẻ em gái; tính nhân văn sâu sắc. Kết đoạn: liên hệ đấu tranh với hủ tục hôm nay. Tiêu chí chấm: phân tích được ý nghĩa nhân văn, có liên hệ."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Lời người kể chuyện là gì?", "options": ["A. Lời dẫn dắt câu chuyện, giới thiệu và nhận xét của người kể.", "B. Lời đối thoại của nhân vật.", "C. Lời bài hát trong truyện.", "D. Lời quảng cáo sách."], "answer": "A", "explain": "Lời người kể chuyện dẫn dắt mạch truyện, giới thiệu nhân vật, sự việc và đưa ra nhận xét.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lời nhân vật là gì?", "options": ["A. Lời đối thoại, độc thoại của nhân vật, bộc lộ tính cách và tâm lí.", "B. Lời dẫn của người kể.", "C. Lời tựa của tác giả.", "D. Lời bình của độc giả."], "answer": "A", "explain": "Lời nhân vật gồm đối thoại (nói với nhau) và độc thoại (tự nói với mình), bộc lộ tính cách.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả “Người thầy đầu tiên” là ai?", "options": ["A. Đỗ Trung Quân.", "B. Chyngyz Aitmatov.", "C. Thanh Tịnh.", "D. Tô Hoài."], "answer": "B", "explain": "“Người thầy đầu tiên” là tác phẩm của Chyngyz Aitmatov (1928–2008).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh “Quê hương là chùm khế ngọt” gợi cho em cảm nhận gì?", "options": ["A. Quê hương ngọt ngào, thân thuộc, gắn với tuổi thơ.", "B. Quê hương chua chát, đáng ghét.", "C. Khế là loại quả đắt tiền.", "D. Không gợi cảm nhận gì."], "answer": "A", "explain": "“Chùm khế ngọt” là ẩn dụ: quê hương ngọt ngào, bình dị, gắn với kỉ niệm trèo hái tuổi thơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điệp cấu trúc “Quê hương là…” trong bài thơ có tác dụng gì?", "options": ["A. Nhấn mạnh quê hương hiện diện trong muôn vàn điều thân thuộc, tạo nhịp điệu tha thiết.", "B. Làm bài thơ bị lặp nhàm chán.", "C. Chỉ để cho đủ số câu.", "D. Không có tác dụng."], "answer": "A", "explain": "Điệp “Quê hương là…” vừa nhấn mạnh, vừa tạo nhịp tha thiết — quê hương ở khắp nơi quanh ta.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quê hương trong bài thơ Đỗ Trung Quân hiện lên qua những hình ảnh nào?", "options": ["A. Chùm khế ngọt, đường đi học, con diều biếc — những điều bình dị, thân thuộc.", "B. Nhà cao tầng, xe hơi.", "C. Chiến trường ác liệt.", "D. Cung điện nguy nga."], "answer": "A", "explain": "Quê hương không xa vời mà ở trong những hình ảnh bình dị nhất của tuổi thơ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Thầy Đuy-sen dạy học trong hoàn cảnh muôn vàn thiếu thốn.", "b) Thầy đã cứu An-tư-nai khỏi hủ tục bắt vợ.", "c) Thầy bỏ cuộc khi bị đánh đập.", "d) Thầy hiện lên tận tụy, dũng cảm vì học trò."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: thầy vẫn kiên trì đến lớp gieo chữ. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) An-tư-nai kể lại câu chuyện bằng ngôi thứ nhất.", "b) Lời kể của người trong cuộc tạo sự chân thực, xúc động.", "c) Chi tiết thầy bị đánh vẫn đến lớp là chi tiết tiêu biểu.", "d) Truyện không có chi tiết tiêu biểu nào."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: chi tiết đắt giá thể hiện ý chí thầy. d) Sai.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) kể về một người thầy, người cô mà em kính trọng, biết ơn.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu thầy, cô. Thân đoạn: kỉ niệm cụ thể (dạy dỗ, quan tâm), chi tiết tiêu biểu về tính cách; tình cảm của em. Kết đoạn: lòng biết ơn, lời hứa. Tiêu chí chấm: ngôi thứ nhất, chi tiết chân thực, cảm xúc rõ ràng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về tình thầy trò qua “Người thầy đầu tiên”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: tình thầy trò là gì. Thân đoạn: thầy hết lòng vì trò, trò tri ân thầy; ngôi kể thứ nhất làm tình cảm thêm sâu nặng; liên hệ tình thầy trò của em. Kết đoạn: trân trọng tình thầy trò. Tiêu chí chấm: cảm nhận sâu sắc, có liên hệ bản thân."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Chyngyz Aitmatov là nhà văn của nước nào?", "options": ["A. Việt Nam.", "B. Nga.", "C. Kyrgyzstan.", "D. Pháp."], "answer": "C", "explain": "Aitmatov là nhà văn lớn của Kyrgyzstan, tác phẩm thấm đẫm tình người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thầy Đuy-sen trong “Người thầy đầu tiên” là người như thế nào?", "options": ["A. Chàng thanh niên nhiệt huyết về làng mở trường, dạy chữ cho trẻ em.", "B. Ông lão giàu có trong làng.", "C. Viên quan cai trị làng.", "D. Người lái buôn qua đường."], "answer": "A", "explain": "Thầy Đuy-sen là thanh niên mang ánh sáng chữ nghĩa về làng Ku-ku-rêu, hết lòng vì học trò.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "An-tư-nai trong truyện là ai?", "options": ["A. Cô bé mồ côi, học trò của thầy Đuy-sen.", "B. Vợ của thầy Đuy-sen.", "C. Mẹ của thầy Đuy-sen.", "D. Người hàng xóm."], "answer": "A", "explain": "An-tư-nai là cô bé mồ côi được thầy Đuy-sen cứu giúp, cho đi học và sau này thành đạt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tình mẫu tử trong bài thơ “Mẹ” được thể hiện qua những chi tiết nào?", "options": ["A. Đôi vai gầy, bàn tay chai sần, những đêm thức trắng vì con.", "B. Mẹ mua sắm đồ hiệu.", "C. Mẹ đi du lịch nước ngoài.", "D. Mẹ không quan tâm đến con."], "answer": "A", "explain": "Những chi tiết bình dị — vai gầy, tay chai, đêm thức — làm nổi bật sự hi sinh thầm lặng, lớn lao của mẹ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “ăn” trong “ăn cơm”, “ăn ảnh”, “ăn gian” là từ đa nghĩa vì sao?", "options": ["A. Vì các nghĩa đều liên quan đến nghĩa gốc “đưa vào, tiếp nhận”.", "B. Vì âm giống nhau ngẫu nhiên.", "C. Vì không có nghĩa nào liên quan nhau.", "D. Vì là từ láy."], "answer": "A", "explain": "“Ăn ảnh” (hợp với ảnh), “ăn gian” (chiếm lấy) đều chuyển từ nghĩa gốc “đưa vào miệng” — có liên quan: từ đa nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “lợi” trong “lợi ích” và “lợi (nướu răng)” là từ đồng âm vì sao?", "options": ["A. Vì hai nghĩa có liên quan nhau.", "B. Vì âm giống nhau nhưng nghĩa hoàn toàn không liên quan.", "C. Vì là từ láy.", "D. Vì là từ đa nghĩa."], "answer": "B", "explain": "“Lợi” (cái được) và “lợi” (nướu răng) chỉ trùng âm ngẫu nhiên, nghĩa không liên quan: từ đồng âm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Quê hương” là bài thơ lục bát của Đỗ Trung Quân.", "b) Bài thơ mở đầu bằng “Quê hương là chùm khế ngọt / Cho con trèo hái mỗi ngày”.", "c) Điệp cấu trúc “Quê hương là…” tạo nhịp điệu tha thiết.", "d) Bài thơ viết theo thể thơ năm chữ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bài thơ là thơ lục bát.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Quê hương trong thơ hiện lên qua hình ảnh bình dị: chùm khế, đường đi học, con diều.", "b) “Chùm khế ngọt” là ẩn dụ về quê hương ngọt ngào, thân thuộc.", "c) Quê hương trong bài thơ xa vời, khó chạm tới.", "d) Bài thơ thể hiện tình yêu quê hương sâu nặng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: quê hương ở trong những điều bình dị quanh ta. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) phân tích vẻ đẹp của hình ảnh quê hương trong bài thơ “Quê hương” của Đỗ Trung Quân.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu bài thơ. Thân đoạn: phân tích các hình ảnh (chùm khế ngọt, đường đi học, con diều biếc) — bình dị mà ngọt ngào; điệp “Quê hương là…” tạo nhịp tha thiết. Kết đoạn: tình yêu quê hương. Tiêu chí chấm: phân tích được sức gợi hình ảnh, có dẫn chứng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về điệp cấu trúc “Quê hương là…” trong bài thơ.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: vị trí điệp cấu trúc. Thân đoạn: tác dụng nhấn mạnh quê hương hiện diện muôn nơi; tạo nhịp điệu tha thiết như lời ru; gắn kết các hình ảnh. Kết đoạn: cái hay của điệp ngữ. Tiêu chí chấm: phân tích được tác dụng nghệ thuật, diễn đạt mạch lạc."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Ngôi làng trong “Người thầy đầu tiên” tên là gì?", "options": ["A. Ku-ku-rêu.", "B. Pa-ri.", "C. Hội An.", "D. Làng Chài."], "answer": "A", "explain": "Câu chuyện diễn ra ở làng Ku-ku-rêu, nơi thầy Đuy-sen mở trường dạy chữ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ai là người kể chuyện trong “Người thầy đầu tiên”?", "options": ["A. Thầy Đuy-sen.", "B. An-tư-nai kể lại bằng ngôi thứ nhất.", "C. Người dân trong làng.", "D. Không xác định được."], "answer": "B", "explain": "An-tư-nai — cô học trò năm xưa — kể lại về người thầy đầu tiên của đời mình bằng ngôi thứ nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thầy Đuy-sen đã làm gì cho An-tư-nai?", "options": ["A. Cứu em khỏi hủ tục bắt vợ, đưa em trở lại trường học.", "B. Cho em tiền đi chợ.", "C. Dạy em nghề thợ mộc.", "D. Đưa em đi du lịch."], "answer": "A", "explain": "Thầy Đuy-sen dũng cảm cứu An-tư-nai khỏi hủ tục bắt vợ, giúp em tiếp tục được đi học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây mở rộng chủ ngữ bằng cụm từ?", "options": ["A. “Thầy Đuy-sen, người thầy đầu tiên của làng Ku-ku-rêu, đã gieo chữ cho bao thế hệ.”", "B. “Thầy đi.”", "C. “Trời mưa.”", "D. “Em học.”"], "answer": "A", "explain": "Chủ ngữ “Thầy Đuy-sen” được mở rộng bằng cụm “người thầy đầu tiên của làng Ku-ku-rêu” — câu chi tiết, sinh động hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao thầy cô, quê hương, cha mẹ được gọi là “cội nguồn yêu thương”?", "options": ["A. Vì đó là những nguồn mạch đầu tiên sinh ra, nuôi dưỡng và dạy dỗ ta nên người.", "B. Vì họ đều giàu có.", "C. Vì họ đều nổi tiếng.", "D. Chỉ là cách nói cho hay."], "answer": "A", "explain": "Như cây có cội, nước có nguồn — thầy cô, quê hương, cha mẹ là gốc rễ nuôi dưỡng tâm hồn ta.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài học sâu sắc từ nhân vật thầy Đuy-sen là gì?", "options": ["A. Hãy sống tận tụy, dũng cảm vì lẽ phải và vì thế hệ tương lai.", "B. Hãy tránh xa khó khăn.", "C. Hãy chỉ lo cho bản thân.", "D. Học chữ là vô ích."], "answer": "A", "explain": "Thầy Đuy-sen dạy ta bài học về sự tận tụy, lòng dũng cảm bảo vệ lẽ phải và tình yêu thương con người.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Bài thơ “Mẹ” của Đỗ Trung Quân viết về tình mẫu tử.", "b) Mẹ hiện lên qua hình ảnh bình dị: vai gầy, tay chai, đêm thức trắng.", "c) Tình mẹ trong thơ là sự hi sinh thầm lặng, lớn lao.", "d) Bài thơ phê phán người mẹ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bài thơ ngợi ca tình mẹ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Từ đa nghĩa là một từ có nhiều nghĩa liên quan nhau.", "b) “Mũi” trong “mũi người”, “mũi thuyền” là từ đa nghĩa.", "c) “Ăn” trong “ăn cơm”, “ăn ảnh” là từ đa nghĩa.", "d) Từ đa nghĩa là những từ âm giống nhau nhưng nghĩa không liên quan."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đó là định nghĩa của từ đồng âm.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) bày tỏ tình yêu quê hương của em.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: quê hương trong lòng em. Thân đoạn: hình ảnh, kỉ niệm cụ thể gắn với quê hương; tình cảm gắn bó, tự hào; trách nhiệm giữ gìn. Kết đoạn: lời hứa với quê hương. Tiêu chí chấm: hình ảnh cụ thể, cảm xúc chân thành, có trách nhiệm."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về tình mẫu tử trong bài thơ “Mẹ” của Đỗ Trung Quân.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu bài thơ. Thân đoạn: hình ảnh mẹ bình dị mà lớn lao (vai gầy, tay chai, đêm thức); sự hi sinh thầm lặng; cảm xúc của người con. Kết đoạn: lòng biết ơn mẹ. Tiêu chí chấm: phân tích được chi tiết, cảm xúc chân thành."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả bài thơ “Quê hương” là ai?", "options": ["A. Chyngyz Aitmatov.", "B. Đỗ Trung Quân.", "C. Nguyễn Duy.", "D. Tố Hữu."], "answer": "B", "explain": "“Quê hương” là bài thơ nổi tiếng của Đỗ Trung Quân (sinh 1955).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài thơ “Quê hương” được viết theo thể thơ nào?", "options": ["A. Năm chữ.", "B. Tự do.", "C. Lục bát.", "D. Bảy chữ."], "answer": "C", "explain": "“Quê hương” là bài thơ lục bát mượt mà với điệp cấu trúc “Quê hương là…”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai câu thơ mở đầu bài “Quê hương” là gì?", "options": ["A. “Quê hương là chùm khế ngọt / Cho con trèo hái mỗi ngày”.", "B. “Quê hương là con diều biếc / Tuổi thơ con thả trên đồng”.", "C. “Quê hương mỗi người chỉ một / Như là chỉ một mẹ thôi”.", "D. “Quê hương là vòng tay ấm / Con nằm ngủ giữa mưa đêm”."], "answer": "A", "explain": "Bài thơ mở đầu bằng hai câu lục bát nổi tiếng: “Quê hương là chùm khế ngọt / Cho con trèo hái mỗi ngày”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh tình thầy trò trong “Người thầy đầu tiên” và tình mẫu tử trong “Mẹ”, em thấy điểm chung nào?", "options": ["A. Cả hai đều là tình cảm thiêng liêng, thầm lặng hi sinh vì người mình yêu thương.", "B. Cả hai đều vụ lợi.", "C. Cả hai đều nhạt nhẽo.", "D. Không có điểm chung."], "answer": "A", "explain": "Thầy hi sinh vì học trò, mẹ hi sinh vì con — đều là sự hi sinh thầm lặng, lớn lao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết ngôi trường làng nghèo khó có ý nghĩa gì?", "options": ["A. Làm nổi bật sự thiếu thốn, từ đó tôn vinh tấm lòng và ý chí của thầy Đuy-sen.", "B. Chê bai quê hương nghèo.", "C. Không có ý nghĩa.", "D. Khuyên không nên đi học."], "answer": "A", "explain": "Hoàn cảnh càng thiếu thốn, tấm lòng gieo chữ của thầy càng sáng lên — nghệ thuật tương phản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao An-tư-nai nhớ mãi thầy Đuy-sen?", "options": ["A. Vì thầy đã cứu em khỏi hủ tục, cho em đi học, thay đổi cả cuộc đời em.", "B. Vì thầy cho em tiền.", "C. Vì thầy là người nổi tiếng.", "D. Vì em sợ thầy."], "answer": "A", "explain": "Thầy không chỉ cho em chữ mà còn cứu cả cuộc đời em — ơn nghĩa ấy theo em suốt đời.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Từ đồng âm là những từ âm giống nhau, nghĩa khác nhau, không liên quan.", "b) “Đá” trong “đá bóng” và “hòn đá” là từ đồng âm.", "c) “Đường” trong “đường đi” và “đường ăn” là từ đồng âm.", "d) Từ đồng âm là một từ có nhiều nghĩa liên quan."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đó là từ đa nghĩa.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Điểm phân biệt đa nghĩa và đồng âm là mối quan hệ giữa các nghĩa.", "b) “Đầu” trong “đau đầu”, “đầu làng” là từ đa nghĩa.", "c) “Lợi” trong “lợi ích” và “lợi (nướu)” là từ đồng âm.", "d) “Mũi thuyền” và “mũi đất” không liên quan đến “mũi người”."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: đều từ nghĩa gốc “phần trên cùng”. c) Đúng. d) Sai: đều chuyển từ nghĩa gốc “phần nhô ra”.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) kể về một kỉ niệm đáng nhớ giữa em và mẹ.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu kỉ niệm. Thân đoạn: kể diễn biến cụ thể, chi tiết về sự chăm sóc, hi sinh của mẹ; cảm xúc của em lúc đó và bây giờ. Kết đoạn: ý nghĩa kỉ niệm. Tiêu chí chấm: ngôi thứ nhất, chi tiết chân thực, giàu cảm xúc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) so sánh tình cảm gia đình trong “Mẹ” và tình thầy trò trong “Người thầy đầu tiên”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: điểm chung — sự hi sinh thầm lặng. Thân đoạn: giống nhau (thiêng liêng, vô điều kiện); khác nhau (máu mủ ruột rà và nghĩa thầy trò); cả hai đều là cội nguồn yêu thương. Kết đoạn: lòng biết ơn chung. Tiêu chí chấm: so sánh rõ giống, khác, lập luận mạch lạc."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả bài thơ “Mẹ” là ai?", "options": ["A. Đỗ Trung Quân.", "B. Thanh Thảo.", "C. Xuân Quỳnh.", "D. Huy Cận."], "answer": "A", "explain": "“Mẹ” là bài thơ của Đỗ Trung Quân viết về tình mẫu tử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài thơ “Mẹ” viết về điều gì?", "options": ["A. Người mẹ với bao vất vả, hi sinh thầm lặng vì con.", "B. Người mẹ giàu sang, sung sướng.", "C. Phong cảnh quê hương.", "D. Tình bạn đẹp."], "answer": "A", "explain": "Bài thơ khắc họa người mẹ bình dị mà lớn lao, thầm lặng hi sinh vì con.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ đa nghĩa là gì?", "options": ["A. Một từ có nhiều nghĩa, gồm nghĩa gốc và nghĩa chuyển có liên quan nhau.", "B. Nhiều từ có âm giống nhau.", "C. Từ chỉ có một nghĩa duy nhất.", "D. Từ không có nghĩa."], "answer": "A", "explain": "Từ đa nghĩa: một từ mang nhiều nghĩa, các nghĩa có liên quan với nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong bài thơ “Mẹ”, việc sử dụng hình ảnh bình dị có tác dụng gì?", "options": ["A. Làm cho tình mẹ trở nên gần gũi, chân thực và càng thêm lớn lao.", "B. Làm bài thơ kém hay.", "C. Không có tác dụng.", "D. Làm mẹ trở nên tầm thường."], "answer": "A", "explain": "Chính sự bình dị (vai gầy, tay chai) làm nên vẻ đẹp lớn lao của tình mẹ — cao quý trong đời thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh “Con về rợp bướm vàng bay” trong bài “Quê hương” gợi tả điều gì?", "options": ["A. Con đường quê đẹp như mơ, gắn với niềm vui tuổi thơ.", "B. Đường đi học rất xa xôi.", "C. Cậu bé bị lạc đường.", "D. Trời đang đổ mưa."], "answer": "A", "explain": "Hình ảnh “rợp bướm vàng bay” gợi con đường quê đẹp như mơ, tràn ngập niềm vui tuổi thơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “đường” trong “đường đi” và “đường ăn” là loại từ gì?", "options": ["A. Từ đa nghĩa.", "B. Từ đồng âm (âm giống, nghĩa không liên quan).", "C. Từ đồng nghĩa.", "D. Từ trái nghĩa."], "answer": "B", "explain": "“Đường” (lối đi) và “đường” (chất ngọt) trùng âm ngẫu nhiên, nghĩa không liên quan: từ đồng âm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Mở rộng thành phần câu dùng cụm từ để mở rộng chủ ngữ hoặc vị ngữ.", "b) “Thầy Đuy-sen, người thầy đầu tiên của làng Ku-ku-rêu,…” là mở rộng chủ ngữ.", "c) “Mẹ đã thức trắng nhiều đêm…” là mở rộng vị ngữ.", "d) Mở rộng thành phần câu làm câu ngắn gọn hơn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: mở rộng làm câu chi tiết, sinh động hơn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Cội nguồn” nghĩa là nguồn gốc, gốc rễ nuôi dưỡng con người.", "b) “Hủ tục” là phong tục lạc hậu, có hại cần xóa bỏ.", "c) Thầy cô, quê hương, cha mẹ là “cội nguồn yêu thương”.", "d) “Cội nguồn” nghĩa là ngọn cây cao nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) giải thích vì sao thầy cô, quê hương, cha mẹ được gọi là “cội nguồn yêu thương”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giải thích “cội nguồn”. Thân đoạn: phân tích từng “nguồn” (cha mẹ sinh thành, quê hương nuôi dưỡng, thầy cô dạy dỗ); dẫn chứng từ ba văn bản; tất cả cho ta tình yêu thương đầu đời. Kết đoạn: trách nhiệm đền đáp. Tiêu chí chấm: lí giải thuyết phục, có dẫn chứng từ bài học."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu bài học về lòng biết ơn mà em rút ra sau khi học Bài 3.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: lòng biết ơn là gì. Thân đoạn: dẫn chứng An-tư-nai nhớ ơn thầy, tình cảm với quê hương, mẹ cha; vì sao phải biết ơn; biểu hiện cụ thể hằng ngày. Kết đoạn: lời hứa sống có tình nghĩa. Tiêu chí chấm: bài học rõ ràng, có dẫn chứng và liên hệ bản thân."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Từ đồng âm là gì?", "options": ["A. Những từ âm giống nhau nhưng nghĩa khác nhau, không liên quan với nhau.", "B. Một từ có nhiều nghĩa liên quan.", "C. Những từ có nghĩa giống nhau.", "D. Những từ viết khác nhau hoàn toàn."], "answer": "A", "explain": "Từ đồng âm: âm giống nhau, nghĩa khác nhau và không liên quan (ví dụ “đá” trong “đá bóng” và “hòn đá”).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “mũi” trong “mũi người”, “mũi thuyền”, “mũi đất” là loại từ gì?", "options": ["A. Từ đồng âm.", "B. Từ đa nghĩa.", "C. Từ trái nghĩa.", "D. Từ láy."], "answer": "B", "explain": "Các nghĩa của “mũi” đều từ nghĩa gốc (phần nhô ra) chuyển ra, có liên quan nhau: từ đa nghĩa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “đá” trong “đá bóng” và “hòn đá” là loại từ gì?", "options": ["A. Từ đa nghĩa.", "B. Từ đồng âm.", "C. Từ đồng nghĩa.", "D. Từ láy."], "answer": "B", "explain": "“Đá” (hành động) và “đá” (chất rắn) âm giống nhau nhưng nghĩa không liên quan: từ đồng âm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “đầu” trong “đau đầu”, “đầu làng”, “đứng đầu lớp” là loại từ gì?", "options": ["A. Từ đồng âm.", "B. Từ đa nghĩa (các nghĩa chuyển từ nghĩa gốc “phần trên cùng”).", "C. Từ láy.", "D. Từ ghép đẳng lập."], "answer": "B", "explain": "Các nghĩa đều phát triển từ nghĩa gốc “phần trên cùng, trước nhất” — có liên quan: từ đa nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây mở rộng vị ngữ bằng cụm từ?", "options": ["A. “Mẹ đã thức trắng nhiều đêm để may áo cho con.”", "B. “Mẹ thức.”", "C. “Trời sáng.”", "D. “Em về.”"], "answer": "A", "explain": "Vị ngữ được mở rộng bằng cụm động từ “đã thức trắng nhiều đêm để may áo cho con” — chi tiết, giàu cảm xúc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ngôi kể thứ nhất trong “Người thầy đầu tiên” tạo hiệu quả gì?", "options": ["A. Câu chuyện chân thực, xúc động như lời tri ân từ chính người trong cuộc.", "B. Câu chuyện trở nên khó hiểu.", "C. Không có hiệu quả gì.", "D. Làm truyện mất hay."], "answer": "A", "explain": "Người được cứu kể về ân nhân — lời kể thấm đẫm lòng biết ơn, chân thực và lay động.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Tình thầy trò và tình mẫu tử đều là sự hi sinh thầm lặng, lớn lao.", "b) Thầy Đuy-sen cho An-tư-nai chữ nghĩa và cả cuộc đời mới.", "c) Mẹ cho con sự sống và tình yêu thương vô bờ.", "d) Tình thầy trò và tình mẫu tử đều vụ lợi, toan tính."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cả hai đều là tình cảm thiêng liêng, vô điều kiện.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Con về rợp bướm vàng bay” gợi con đường quê đẹp như mơ.", "b) “Chùm khế ngọt” gợi quê hương ngọt ngào, thân thuộc.", "c) Các hình ảnh thơ trong “Quê hương” đều bình dị, giàu sức gợi.", "d) Bài thơ “Quê hương” không có hình ảnh thơ nào."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) phân biệt từ đa nghĩa và từ đồng âm qua các ví dụ cụ thể.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: nêu khái niệm hai loại. Thân đoạn: ví dụ từ đa nghĩa (“mũi”, “ăn”) — các nghĩa liên quan; ví dụ từ đồng âm (“đá”, “đường”) — nghĩa không liên quan; cách phân biệt. Kết đoạn: ý nghĩa của việc phân biệt. Tiêu chí chấm: ví dụ chính xác, phân biệt rõ ràng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) đặt 3 câu có dùng từ đa nghĩa và giải thích các nghĩa của từ trong từng câu.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: chọn một từ đa nghĩa. Thân đoạn: đặt 3 câu với 3 nghĩa khác nhau; giải thích nghĩa trong từng văn cảnh; chỉ ra mối liên quan giữa các nghĩa. Kết đoạn: nhận xét về sự giàu có của từ đa nghĩa. Tiêu chí chấm: câu đúng ngữ pháp, giải thích nghĩa chính xác."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Muốn mở rộng thành phần câu, ta dùng gì?", "options": ["A. Dùng cụm từ (cụm danh từ, cụm động từ, cụm tính từ) để mở rộng chủ ngữ hoặc vị ngữ.", "B. Xóa bớt từ ngữ trong câu.", "C. Viết câu thật ngắn.", "D. Dùng dấu chấm lửng."], "answer": "A", "explain": "Mở rộng thành phần câu bằng cụm từ giúp câu chi tiết, sinh động hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chủ đề chung của Bài 3 “Cội nguồn yêu thương” là gì?", "options": ["A. Lòng biết ơn thầy cô, quê hương, cha mẹ — những cội nguồn nuôi dưỡng tâm hồn.", "B. Tình yêu thiên nhiên.", "C. Niềm đam mê khoa học.", "D. Ước mơ du lịch."], "answer": "A", "explain": "Ba văn bản cùng ngợi ca thầy cô, quê hương, mẹ cha — những “cội nguồn yêu thương” của mỗi người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “hủ tục” có nghĩa là gì?", "options": ["A. Phong tục tốt đẹp.", "B. Phong tục lạc hậu, có hại cần xóa bỏ.", "C. Món ăn truyền thống.", "D. Lễ hội vui vẻ."], "answer": "B", "explain": "“Hủ tục” chỉ những phong tục lạc hậu, gây hại (như tục bắt vợ trong truyện).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao chi tiết thầy Đuy-sen bị đánh vẫn đến lớp được xem là chi tiết tiêu biểu?", "options": ["A. Vì nó ngắn gọn.", "B. Vì nó tập trung thể hiện ý chí kiên cường và lòng tận tụy với học trò của thầy.", "C. Vì nó gây cười.", "D. Vì nó không quan trọng."], "answer": "B", "explain": "Một chi tiết nhỏ mà nói lên cả tính cách: càng bị ngăn cản, thầy càng kiên trì — đó là chi tiết tiêu biểu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh “con diều biếc” trong “Quê hương” gợi liên tưởng gì?", "options": ["A. Tuổi thơ hồn nhiên, ước mơ bay cao.", "B. Sự giàu sang.", "C. Nỗi buồn.", "D. Chiến tranh."], "answer": "A", "explain": "Cánh diều tuổi thơ bay cao là hình ảnh của hồn nhiên và ước mơ — quê hương nuôi dưỡng tâm hồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau giữa từ đa nghĩa và từ đồng âm thể hiện rõ nhất ở đâu?", "options": ["A. Ở số lượng chữ cái.", "B. Ở mối quan hệ giữa các nghĩa: có liên quan (đa nghĩa) hay không liên quan (đồng âm).", "C. Ở cách phát âm.", "D. Ở vị trí trong câu."], "answer": "B", "explain": "Chìa khóa phân biệt: các nghĩa có liên quan với nhau không? Có — đa nghĩa; không — đồng âm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Chủ đề Bài 3 là lòng biết ơn cội nguồn yêu thương.", "b) Ba văn bản cùng ngợi ca thầy cô, quê hương, mẹ cha.", "c) “Người thầy đầu tiên” là truyện ngắn; “Quê hương”, “Mẹ” là thơ.", "d) Ba văn bản không liên quan gì đến nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cả ba cùng chung chủ đề biết ơn cội nguồn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Ngôi kể thứ nhất giúp “Người thầy đầu tiên” chân thực như lời tri ân.", "b) An-tư-nai nhớ ơn thầy vì thầy đã thay đổi cuộc đời em.", "c) Truyện có giá trị nhân văn sâu sắc, vượt thời gian.", "d) Truyện chỉ có ý nghĩa với người dân làng Ku-ku-rêu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bài học về lòng tốt và sự hi sinh có ý nghĩa với mọi người.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) mở rộng chủ ngữ và vị ngữ cho câu “Thầy giáo dạy học.” để câu trở nên sinh động hơn.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: câu gốc đơn giản. Thân đoạn: mở rộng chủ ngữ bằng cụm danh từ, mở rộng vị ngữ bằng cụm động từ; so sánh câu trước và sau; tác dụng của việc mở rộng. Kết đoạn: vai trò của câu mở rộng trong viết văn. Tiêu chí chấm: mở rộng đúng kĩ thuật, câu mới sinh động, giải thích được tác dụng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về giá trị nhân văn của “Người thầy đầu tiên”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giá trị nhân văn là gì. Thân đoạn: tình yêu thương con người, bảo vệ lẽ phải, chống hủ tục, tôn vinh sự học; sức sống vượt thời gian của tác phẩm. Kết đoạn: bài học cho hôm nay. Tiêu chí chấm: hiểu đúng giá trị nhân văn, phân tích sâu sắc."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Từ “cội nguồn” có nghĩa là gì?", "options": ["A. Ngọn cây cao nhất.", "B. Nguồn gốc, gốc rễ sinh ra và nuôi dưỡng con người.", "C. Dòng sông lớn.", "D. Ngôi nhà mới."], "answer": "B", "explain": "“Cội nguồn” là gốc rễ, nguồn gốc — nơi sinh ra và nuôi dưỡng ta khôn lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thầy Đuy-sen dạy học trong hoàn cảnh như thế nào?", "options": ["A. Trường lớp khang trang, đầy đủ.", "B. Muôn vàn thiếu thốn nhưng thầy vẫn kiên trì gieo chữ.", "C. Được nhà nước hỗ trợ đầy đủ.", "D. Chỉ dạy học vào mùa hè."], "answer": "B", "explain": "Ngôi trường làng nghèo khó, thiếu thốn trăm bề nhưng thầy Đuy-sen vẫn bền bỉ dạy dỗ học trò.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tình cảm chính được thể hiện trong bài thơ “Mẹ” là gì?", "options": ["A. Tình mẫu tử thiêng liêng, sâu nặng.", "B. Tình bạn trong sáng.", "C. Tình yêu đôi lứa.", "D. Tình thầy trò."], "answer": "A", "explain": "Bài thơ là khúc ca về tình mẹ — cội nguồn yêu thương đầu tiên và sâu nặng nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Quê hương là chùm khế ngọt”, từ “ngọt” được hiểu theo nghĩa nào?", "options": ["A. Nghĩa gốc: vị ngọt của quả.", "B. Nghĩa chuyển: sự êm đềm, thân thương, đáng yêu của quê hương.", "C. Nghĩa về độ đường hóa học.", "D. Không có nghĩa."], "answer": "B", "explain": "“Ngọt” ở đây là nghĩa chuyển — quê hương “ngọt ngào” trong tình cảm, kỉ niệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu “An-tư-nai, cô bé mồ côi năm xưa, nay đã trở thành nhà khoa học.” mở rộng thành phần nào?", "options": ["A. Chủ ngữ (“An-tư-nai” được mở rộng bằng cụm “cô bé mồ côi năm xưa”).", "B. Vị ngữ.", "C. Trạng ngữ.", "D. Không mở rộng thành phần nào."], "answer": "A", "explain": "Cụm “cô bé mồ côi năm xưa” mở rộng cho chủ ngữ “An-tư-nai”, giúp người đọc hiểu rõ nhân vật hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao “Người thầy đầu tiên” lại cảm động người đọc nhiều thế hệ?", "options": ["A. Vì truyện dài.", "B. Vì câu chuyện có thật về lòng tốt, sự hi sinh được kể bằng giọng chân thành, giàu tính nhân văn.", "C. Vì có nhiều yếu tố kì ảo.", "D. Vì nhân vật giàu có."], "answer": "B", "explain": "Sức sống của truyện đến từ tính nhân văn sâu sắc và giọng kể chân thành — những giá trị vượt thời gian.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Trong “ngọt” ở “chùm khế ngọt”, đó là nghĩa chuyển chỉ sự thân thương.", "b) Nghĩa của từ phụ thuộc vào văn cảnh sử dụng.", "c) “Ngọt” trong câu thơ là nghĩa gốc chỉ vị giác.", "d) Hiểu nghĩa chuyển giúp cảm nhận sâu sắc hơn hình ảnh thơ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: ở đây “ngọt” mang nghĩa chuyển. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Đọc truyện ngắn cần xác định cốt truyện, nhân vật, chi tiết tiêu biểu, ngôi kể.", "b) Chi tiết thầy bị đánh vẫn đến lớp thể hiện ý chí thầy Đuy-sen.", "c) Lời đối thoại giúp bộc lộ tính cách nhân vật.", "d) Đọc truyện ngắn không cần chú ý ngôi kể."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 4 câu hỏi vàng khi đọc truyện. b) Đúng. c) Đúng. d) Sai: ngôi kể ảnh hưởng lớn đến giọng điệu, hiệu quả.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) tưởng tượng em là An-tư-nai, hãy viết lời tri ân gửi đến thầy Đuy-sen.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: xưng hô, hoàn cảnh (nhiều năm sau). Thân đoạn: nhắc kỉ niệm được thầy cứu giúp, cho đi học; bày tỏ lòng biết ơn sâu nặng; báo tin thành đạt. Kết đoạn: lời hứa sống xứng đáng. Tiêu chí chấm: nhập vai tốt, cảm xúc chân thành, chi tiết gắn với truyện."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu thông điệp mà em tâm đắc nhất sau khi học Bài 3 “Cội nguồn yêu thương”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: chọn thông điệp (biết ơn, hi sinh, bảo vệ lẽ phải…). Thân đoạn: lí giải vì sao tâm đắc, dẫn chứng từ văn bản và đời sống; em sẽ sống thế nào với thông điệp đó. Kết đoạn: khẳng định giá trị. Tiêu chí chấm: thông điệp rõ ràng, lí giải thuyết phục, liên hệ bản thân."}]}]}
