ts": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu vấn đề (môi trường đang bị đe dọa). Thân đoạn: những việc học sinh làm được (tiết kiệm, phân loại rác, trồng cây, tuyên truyền); dẫn chứng thực tế; phê phán thói quen xấu. Kết đoạn: quyết tâm hành động. Tiêu chí: có dẫn chứng, việc làm cụ thể, thiết thực."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) phân tích hình ảnh thiên nhiên trong một khổ thơ về bốn mùa mà em yêu thích (trích dẫn khổ thơ).", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: trích dẫn khổ thơ. Thân đoạn: phân tích hình ảnh (màu sắc, âm thanh, đường nét); cảm xúc của nhà thơ; nghệ thuật dùng từ. Kết đoạn: cảm nhận chung. Tiêu chí: trích dẫn đúng, phân tích được hình ảnh và cảm xúc."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Thơ viết về thiên nhiên thường thể hiện", "options": ["A. tình yêu thiên nhiên, cảm xúc của con người trước vẻ đẹp đất trời.", "B. sự ghét bỏ thiên nhiên.", "C. chỉ toàn số liệu.", "D. các công thức toán học."], "answer": "A", "explain": "Thơ thiên nhiên bộc lộ tình yêu, sự gắn bó và những rung cảm tinh tế của con người trước vẻ đẹp tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hình ảnh thiên nhiên trong thơ thường gợi", "options": ["A. cảm xúc, liên tưởng và thông điệp về cuộc sống.", "B. sự nhàm chán.", "C. nỗi sợ hãi duy nhất.", "D. không gợi gì cả."], "answer": "A", "explain": "Hình ảnh thiên nhiên trong thơ vừa đẹp vừa giàu ý nghĩa: gợi cảm xúc và gửi gắm thông điệp, thường là về bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thông điệp chung của các bài thơ về thiên nhiên là", "options": ["A. kêu gọi yêu quý, bảo vệ thiên nhiên, sống hòa điệu với tự nhiên.", "B. khuyên con người chinh phục thiên nhiên bằng mọi giá.", "C. ca ngợi chiến tranh.", "D. khuyên xa lánh thiên nhiên."], "answer": "A", "explain": "Thơ thiên nhiên nuôi dưỡng tình yêu đất nước, quê hương và ý thức bảo vệ môi trường sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao thơ về bốn mùa thường gắn với cảm xúc con người?", "options": ["A. Vì nhà thơ rảnh rỗi.", "B. Vì thiên nhiên luôn gợi rung cảm; mượn cảnh để bày tỏ tình cảm là đặc trưng của thơ.", "C. Vì bắt buộc phải thế.", "D. Không có lí do."], "answer": "B", "explain": "Thơ là tiếng nói của cảm xúc; cảnh thiên nhiên qua lăng kính tâm hồn trở thành nơi gửi gắm tình cảm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đọc câu thơ tả mùa thu lá vàng, em hiểu thông điệp gì về môi trường?", "options": ["A. Không liên quan gì.", "B. Vẻ đẹp thiên nhiên đáng trân trọng, cần giữ gìn; lá vàng cũng nhắc về quy luật, sự mong manh cần bảo vệ.", "C. Nên chặt hết cây.", "D. Mùa thu không đẹp."], "answer": "B", "explain": "Càng cảm nhận vẻ đẹp thiên nhiên, con người càng thấy trách nhiệm giữ gìn nó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số liệu “nhiệt độ Trái Đất tăng” trong văn bản biến đổi khí hậu có tác dụng gì?", "options": ["A. Dọa nạt người đọc.", "B. Chứng minh mức độ nghiêm trọng của vấn đề một cách cụ thể, thuyết phục.", "C. Không có tác dụng.", "D. Chỉ để trang trí."], "answer": "B", "explain": "Con số cụ thể biến cảnh báo chung thành bằng chứng rõ ràng, thúc giục hành động.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Rừng được ví là “lá phổi xanh” của Trái Đất.", "b) Rừng điều hòa khí hậu, giữ đất, giữ nước.", "c) Phá rừng không ảnh hưởng gì đến môi trường.", "d) Trồng cây xanh góp phần chống biến đổi khí hậu."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phá rừng gây xói mòn, lũ lụt, mất đa dạng sinh học. d) Đúng: cây hấp thụ CO2.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Động vật hoang dã sống tự do trong môi trường tự nhiên.", "b) Săn bắt trái phép làm nhiều loài đứng trước nguy cơ tuyệt chủng.", "c) Bảo vệ động vật hoang dã là giữ gìn đa dạng sinh học.", "d) Tuyệt chủng một loài không ảnh hưởng gì đến hệ sinh thái."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: mỗi loài là mắt xích của chuỗi sinh thái.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) giải thích vì sao rừng được gọi là “lá phổi xanh của Trái Đất”.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu cách gọi. Thân đoạn: giải thích (rừng hấp thụ CO2, thải ô-xi như phổi hô hấp); vai trò điều hòa khí hậu, giữ đất, giữ nước; hậu quả khi mất rừng. Kết đoạn: kêu gọi bảo vệ rừng. Tiêu chí: giải thích khoa học, dễ hiểu."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) nêu suy nghĩ về ý kiến: “Bảo vệ môi trường là bảo vệ chính cuộc sống của chúng ta.”", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giải thích ý kiến. Thân đoạn: con người sống nhờ tự nhiên (không khí, nước); ô nhiễm gây bệnh tật, thiên tai; dẫn chứng thực tế; trách nhiệm mỗi người. Kết đoạn: khẳng định và kêu gọi. Tiêu chí: có lí lẽ, dẫn chứng thực tế."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Biến đổi khí hậu là gì?", "options": ["A. Sự thay đổi thời tiết trong một ngày.", "B. Sự biến đổi lâu dài của khí hậu Trái Đất, phần lớn do hoạt động của con người gây ra.", "C. Một môn thể thao.", "D. Tên một bài hát."], "answer": "B", "explain": "Biến đổi khí hậu là sự thay đổi mang tính hệ thống, lâu dài của khí hậu, gây ra nhiều hậu quả nghiêm trọng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệu ứng nhà kính là hiện tượng", "options": ["A. trồng rau trong nhà kính.", "B. các khí trong khí quyển giữ nhiệt làm Trái Đất nóng lên.", "C. xây nhà bằng kính.", "D. trồng hoa trong chậu."], "answer": "B", "explain": "Khí nhà kính (CO2, mê-tan...) giữ nhiệt từ Mặt Trời khiến nhiệt độ Trái Đất tăng lên — nguyên nhân chính của biến đổi khí hậu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đa dạng sinh học được hiểu là", "options": ["A. sự phong phú của các loài sinh vật và môi trường sống của chúng.", "B. một loài cây duy nhất.", "C. số lượng học sinh trong lớp.", "D. các loại xe cộ."], "answer": "A", "explain": "Đa dạng sinh học là sự phong phú về loài, gen và hệ sinh thái — nền tảng của sự sống trên Trái Đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao văn bản về biến đổi khí hậu cần dùng thuật ngữ khoa học?", "options": ["A. Để khoe chữ.", "B. Vì thuật ngữ diễn đạt chính xác khái niệm, tránh hiểu sai về vấn đề phức tạp.", "C. Để khó hiểu.", "D. Không cần."], "answer": "B", "explain": "Các hiện tượng như “hiệu ứng nhà kính”, “khí mê-tan” cần tên gọi chính xác để trao đổi khoa học thống nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh cách viết về rừng trong văn bản thông tin và trong thơ?", "options": ["A. Giống hệt nhau.", "B. Văn bản thông tin nêu vai trò, số liệu về rừng; thơ ca ngợi vẻ đẹp, bộc lộ tình cảm với rừng.", "C. Thơ cũng toàn số liệu.", "D. Văn bản thông tin không viết về rừng."], "answer": "B", "explain": "Cùng đối tượng “rừng” nhưng hai cách tiếp cận: tri thức khách quan và cảm xúc thẩm mĩ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết “rừng là lá phổi xanh của Trái Đất” là cách diễn đạt của loại văn bản nào?", "options": ["A. Văn bản thông tin dùng so sánh để giải thích vai trò của rừng một cách dễ hiểu.", "B. Truyện cổ tích.", "C. Đơn xin phép.", "D. Hóa đơn."], "answer": "A", "explain": "Văn bản thông tin vẫn có thể dùng so sánh để diễn đạt sinh động, nhưng mục đích là làm rõ tri thức.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thơ về thiên nhiên bộc lộ tình yêu thiên nhiên của con người.", "b) Hình ảnh thiên nhiên trong thơ gợi cảm xúc và thông điệp.", "c) Thơ bốn mùa phản ánh vẻ đẹp riêng của mỗi mùa.", "d) Thơ về thiên nhiên không liên quan gì đến bảo vệ môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: xuân, hạ, thu, đông mỗi mùa một vẻ. d) Sai: tình yêu thiên nhiên là nền tảng của ý thức bảo vệ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mùa xuân gắn với hoa đào, én bay, sức sống mới.", "b) Mùa hạ gắn với phượng đỏ, ve kêu.", "c) Mùa thu gắn với lá vàng, trăng thu.", "d) Mùa đông gắn với hoa sen nở rộ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hoa sen nở vào mùa hạ; mùa đông gắn với giá rét.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) tóm tắt những tri thức chính về biến đổi khí hậu mà em biết (theo cách trình bày của văn bản thông tin).", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu chủ đề. Thân đoạn: khái niệm; nguyên nhân (khí thải, phá rừng); hậu quả (nóng lên, thiên tai); giải pháp. Kết đoạn: nhận thức của bản thân. Tiêu chí: đủ các ý chính, ngắn gọn, chính xác."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) cảm nhận về hình ảnh “trăng thu” trong thơ ca và suy nghĩ về việc giữ gìn vẻ đẹp quê hương.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu hình ảnh trăng thu. Thân đoạn: vẻ đẹp dịu dàng, gợi nhớ quê hương; cảm xúc của em; suy nghĩ (giữ gìn cảnh đẹp, không xả rác nơi công cộng...). Kết đoạn: tình yêu quê hương. Tiêu chí: có cảm xúc, có liên hệ hành động cụ thể."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Động vật hoang dã là", "options": ["A. động vật sống trong tự nhiên, không do con người nuôi dưỡng.", "B. vật nuôi trong nhà.", "C. đồ chơi bằng nhựa.", "D. nhân vật trong phim hoạt hình."], "answer": "A", "explain": "Động vật hoang dã sống tự do trong môi trường tự nhiên, cần được bảo vệ khỏi săn bắt trái phép.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Rừng có vai trò gì đối với môi trường?", "options": ["A. Không có vai trò gì.", "B. Là “lá phổi xanh”: điều hòa khí hậu, giữ đất, giữ nước, nơi cư trú của sinh vật.", "C. Chỉ để lấy củi.", "D. Chỉ để xây nhà."], "answer": "B", "explain": "Rừng điều hòa khí hậu, hấp thụ CO2, giữ đất chống xói mòn, là ngôi nhà của muôn loài.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ô nhiễm môi trường là gì?", "options": ["A. Môi trường bị biến đổi theo chiều hướng xấu do chất thải, hóa chất.", "B. Trời đang mưa.", "C. Đường phố đông đúc.", "D. Mùa hè nóng nực."], "answer": "A", "explain": "Ô nhiễm là sự đưa các chất độc hại vào môi trường vượt ngưỡng cho phép, gây hại cho sinh vật và con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần bảo vệ động vật hoang dã?", "options": ["A. Vì chúng đẹp để ngắm.", "B. Vì mỗi loài là mắt xích trong chuỗi sinh thái; tuyệt chủng gây mất cân bằng, ảnh hưởng con người.", "C. Không cần thiết.", "D. Để nuôi làm cảnh."], "answer": "B", "explain": "Đa dạng sinh học là nền tảng của sự sống; bảo vệ động vật hoang dã là bảo vệ chính cuộc sống con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành động xả rác bừa bãi gây hậu quả gì?", "options": ["A. Không sao cả.", "B. Ô nhiễm đất, nước; hại sinh vật; làm xấu cảnh quan và sức khỏe con người.", "C. Làm đất tốt hơn.", "D. Giúp cây lớn nhanh."], "answer": "B", "explain": "Rác thải, nhất là nhựa, tồn tại hàng trăm năm, đầu độc đất, nước và sinh vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao trồng cây xanh được coi là hành động bảo vệ môi trường?", "options": ["A. Chỉ để đẹp.", "B. Cây hấp thụ CO2, thải ô-xi, điều hòa khí hậu, giữ đất, giữ nước.", "C. Để lấy củi.", "D. Không có tác dụng."], "answer": "B", "explain": "Mỗi cây xanh là một “nhà máy” làm sạch không khí, góp phần chống biến đổi khí hậu.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Văn bản thông tin cung cấp tri thức khách quan; thơ bộc lộ cảm xúc chủ quan.", "b) Hai loại văn bản có thể cùng viết về thiên nhiên.", "c) Thơ về thiên nhiên cũng cần số liệu chính xác như văn bản thông tin.", "d) Cả hai đều có thể nuôi dưỡng tình yêu thiên nhiên."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: cùng đối tượng, khác cách tiếp cận. c) Sai: thơ dùng ngôn ngữ nghệ thuật, cảm xúc. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xả rác bừa bãi gây ô nhiễm đất, nước.", "b) Phân loại rác giúp tái chế hiệu quả.", "c) Tiết kiệm điện, nước góp phần bảo vệ môi trường.", "d) Bảo vệ môi trường là việc của riêng các nhà khoa học."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: là trách nhiệm của mọi người, từ việc nhỏ hằng ngày.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) so sánh cách viết về thiên nhiên trong thơ và trong văn bản thông tin.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu hai cách viết. Thân đoạn: giống nhau (cùng hướng tới thiên nhiên); khác nhau (thơ: cảm xúc, ngôn ngữ nghệ thuật; văn bản thông tin: tri thức, số liệu, ngôn ngữ khoa học). Kết đoạn: hai cách bổ sung cho nhau. Tiêu chí: so sánh rõ giống và khác, có ví dụ."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) trình bày suy nghĩ về việc săn bắt, buôn bán động vật hoang dã trái phép.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu thực trạng. Thân đoạn: hậu quả (tuyệt chủng, mất cân bằng sinh thái); lên án; kêu gọi (nói không với sản phẩm từ động vật quý hiếm). Kết đoạn: trách nhiệm của tuổi trẻ. Tiêu chí: có thái độ rõ ràng, lập luận thuyết phục."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Mùa xuân trong thơ ca thường gắn với hình ảnh nào?", "options": ["A. Hoa đào, hoa mai, chồi non, én bay — sức sống mới.", "B. Lá vàng rơi, gió heo may.", "C. Tuyết trắng, giá rét.", "D. Nắng gắt, hạn hán."], "answer": "A", "explain": "Mùa xuân tượng trưng cho sự sống mới: hoa nở, chồi non, chim én — hình ảnh quen thuộc trong thơ ca.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mùa hạ trong thơ ca thường gắn với hình ảnh nào?", "options": ["A. Phượng đỏ, ve kêu, nắng vàng rực rỡ.", "B. Tuyết rơi trắng xóa.", "C. Lá vàng rụng đầy sân.", "D. Mưa phùn gió bấc."], "answer": "A", "explain": "Mùa hạ rực rỡ với hoa phượng, tiếng ve — mùa của tuổi học trò, của những kỉ niệm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mùa thu trong thơ ca thường gắn với hình ảnh nào?", "options": ["A. Lá vàng rơi, trăng thu, gió heo may — vẻ đẹp dịu dàng, man mác buồn.", "B. Nắng cháy da.", "C. Bão lũ.", "D. Hoa đào nở."], "answer": "A", "explain": "Mùa thu đẹp một cách trầm lắng: lá vàng, trăng sáng, gợi nỗi nhớ và suy tư.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiết kiệm điện, nước góp phần bảo vệ môi trường vì", "options": ["A. giúp gia đình đỡ tốn tiền (và giảm khai thác tài nguyên, giảm khí thải từ sản xuất năng lượng).", "B. không liên quan gì.", "C. chỉ là thói quen.", "D. làm cuộc sống khổ hơn."], "answer": "A", "explain": "Tiết kiệm năng lượng vừa giảm chi phí vừa giảm khai thác tài nguyên và khí thải — lợi cả đôi đường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân loại rác tại nguồn có ý nghĩa gì?", "options": ["A. Mất thời gian vô ích.", "B. Giúp tái chế hiệu quả, giảm rác chôn lấp, tiết kiệm tài nguyên.", "C. Chỉ để vui.", "D. Không cần thiết."], "answer": "B", "explain": "Rác được phân loại sẽ được tái chế thành sản phẩm mới, giảm gánh nặng cho môi trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói “bảo vệ môi trường là bảo vệ chính mình”?", "options": ["A. Nói cho vui.", "B. Vì con người sống nhờ không khí, nước, đất; môi trường ô nhiễm trực tiếp hại sức khỏe con người.", "C. Không đúng.", "D. Vì môi trường là của riêng ai đó."], "answer": "B", "explain": "Không khí bẩn gây bệnh hô hấp, nước bẩn gây dịch bệnh — con người là nạn nhân đầu tiên của ô nhiễm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số liệu làm cho thông tin cụ thể, đáng tin cậy.", "b) Ngôn ngữ hoa mĩ, mơ hồ phù hợp với văn bản thông tin.", "c) Khi đọc văn bản thông tin cần chú ý tiêu đề, đề mục, số liệu.", "d) Tóm tắt văn bản thông tin cần giữ ý chính và số liệu quan trọng."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: văn bản thông tin cần ngôn ngữ rõ ràng, chính xác. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Con người là một phần của tự nhiên.", "b) Hủy hoại tự nhiên là tự hủy hoại cuộc sống của mình.", "c) Con người hoàn toàn độc lập với tự nhiên.", "d) Sống “hòa điệu với tự nhiên” là sống tôn trọng, giữ gìn tự nhiên."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: con người sống nhờ không khí, nước, đất của tự nhiên. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) viết về một loài động vật hoang dã mà em yêu thích theo phong cách văn bản thông tin (có thuật ngữ, số liệu).", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu loài vật (tên khoa học nếu biết). Thân đoạn: đặc điểm, môi trường sống, số lượng hiện nay; tình trạng bảo tồn. Kết đoạn: lời kêu gọi bảo vệ. Tiêu chí: thông tin chính xác, có số liệu, trình bày rõ ràng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) phân tích vì sao số liệu, bảng biểu làm tăng sức thuyết phục của văn bản thông tin.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu vấn đề. Thân đoạn: số liệu biến nhận định thành bằng chứng; bảng biểu giúp so sánh trực quan; ví dụ cụ thể (biến đổi khí hậu, diện tích rừng); người đọc dễ tin, dễ nhớ. Kết đoạn: bài học khi viết. Tiêu chí: lí lẽ sâu, có ví dụ."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Mùa đông trong thơ ca thường gắn với hình ảnh nào?", "options": ["A. Giá rét, mưa phùn, cây trơ trụi — sự khắc nghiệt và sức chịu đựng.", "B. Hoa sen nở.", "C. Ve kêu râm ran.", "D. Én bay về."], "answer": "A", "explain": "Mùa đông với giá lạnh thử thách sức sống, nhưng cũng ấp ủ mầm xuân đang tới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số liệu trong văn bản thông tin có tác dụng gì?", "options": ["A. Làm văn bản dài hơn.", "B. Làm cho thông tin cụ thể, đáng tin cậy, tăng sức thuyết phục.", "C. Trang trí văn bản.", "D. Không có tác dụng."], "answer": "B", "explain": "Số liệu cụ thể biến nhận định chung thành bằng chứng xác thực, khiến người đọc tin tưởng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiêu đề của văn bản thông tin có vai trò gì?", "options": ["A. Không có vai trò gì.", "B. Nêu ngắn gọn nội dung chính, giúp người đọc định hướng khi đọc.", "C. Chỉ để trang trí.", "D. Thay thế toàn bộ nội dung."], "answer": "B", "explain": "Tiêu đề như tấm biển chỉ dẫn: cho biết văn bản viết về vấn đề gì.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh thiên nhiên trong thơ có vai trò gì với thông điệp bảo vệ môi trường?", "options": ["A. Không liên quan.", "B. Gieo tình yêu thiên nhiên — có yêu mới muốn giữ gìn, bảo vệ.", "C. Chỉ để giải trí.", "D. Làm người đọc ghét thiên nhiên."], "answer": "B", "explain": "Thơ nuôi dưỡng tình cảm; tình yêu thiên nhiên là nền tảng của ý thức bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi viết đoạn văn giới thiệu một hiện tượng tự nhiên, cần đảm bảo gì?", "options": ["A. Viết tùy hứng, không cần chính xác.", "B. Thông tin chính xác, có số liệu, dùng thuật ngữ đúng, trình bày rõ ràng.", "C. Bịa đặt cho hấp dẫn.", "D. Chỉ viết cảm xúc."], "answer": "B", "explain": "Đó là yêu cầu của văn bản thông tin: khách quan, chính xác, rõ ràng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên dùng ngôn ngữ hoa mĩ, mơ hồ trong văn bản thông tin?", "options": ["A. Vì tốn giấy.", "B. Vì sẽ gây hiểu sai, làm mất tính chính xác, khách quan của thông tin.", "C. Vì không đẹp.", "D. Không có lí do."], "answer": "B", "explain": "Ngôn ngữ đa nghĩa, hoa mĩ dễ gây hiểu lầm — điều tối kị với văn bản cung cấp tri thức.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ô nhiễm không khí đô thị chủ yếu từ khí thải giao thông, nhà máy.", "b) Ô nhiễm nguồn nước ảnh hưởng sức khỏe con người.", "c) Rác thải nhựa tồn tại hàng trăm năm trong môi trường.", "d) Ô nhiễm môi trường không gây bệnh cho con người."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ô nhiễm gây bệnh hô hấp, dịch bệnh...", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Hiệu ứng nhà kính” diễn đạt chính xác nguyên nhân Trái Đất nóng lên.", "b) “Đa dạng sinh học” chỉ sự phong phú của sinh vật và môi trường sống.", "c) “Quang hợp” là quá trình cây xanh tạo chất hữu cơ và thải ô-xi.", "d) Thuật ngữ khoa học có thể dùng tùy tiện, không cần đúng ngữ cảnh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phải dùng đúng khái niệm, đúng ngữ cảnh.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) nêu cảm nhận về mùa xuân — mùa của sức sống và hi vọng — qua thơ ca.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu mùa xuân trong thơ. Thân đoạn: hình ảnh (hoa đào, én bay, chồi non); cảm xúc (vui tươi, hi vọng); liên hệ (mùa xuân của tuổi trẻ, của học tập). Kết đoạn: yêu mùa xuân, yêu cuộc sống. Tiêu chí: có hình ảnh, cảm xúc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) trình bày suy nghĩ: “Sống hòa điệu với tự nhiên” có nghĩa là gì?", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giải thích cụm từ. Thân đoạn: tôn trọng quy luật tự nhiên; khai thác đi đôi với bảo vệ; ví dụ (trồng rừng, du lịch sinh thái); phê phán lối sống hủy hoại. Kết đoạn: đó là lối sống văn minh. Tiêu chí: giải thích sâu, có ví dụ."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Đề mục trong văn bản thông tin có tác dụng gì?", "options": ["A. Chia nhỏ nội dung thành các phần rõ ràng, dễ theo dõi.", "B. Làm văn bản rối hơn.", "C. Không cần thiết.", "D. Chỉ dùng trong thơ."], "answer": "A", "explain": "Đề mục phân chia bố cục, giúp người đọc nắm cấu trúc và tìm thông tin nhanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hình ảnh, bảng biểu minh họa trong văn bản thông tin giúp", "options": ["A. người đọc hình dung trực quan, dễ hiểu, dễ nhớ thông tin.", "B. văn bản thêm màu mè.", "C. thay thế hoàn toàn chữ viết.", "D. không giúp gì."], "answer": "A", "explain": "Một biểu đồ, bức ảnh đúng chỗ có giá trị hơn nhiều dòng chữ khô khan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quang hợp là quá trình", "options": ["A. cây xanh dùng ánh sáng để tổng hợp chất hữu cơ, thải ra ô-xi.", "B. động vật đi săn mồi.", "C. nước bốc hơi.", "D. đá tan chảy."], "answer": "A", "explain": "Quang hợp là quá trình sinh học quan trọng: cây xanh tạo chất hữu cơ nuôi sống mình và cung cấp ô-xi cho sự sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đọc văn bản về động vật hoang dã, em rút ra bài học gì?", "options": ["A. Nên săn bắt nhiều.", "B. Không săn bắt, buôn bán trái phép; bảo vệ môi trường sống của chúng.", "C. Nuôi nhốt tất cả.", "D. Không quan tâm."], "answer": "B", "explain": "Bài học thiết thực: tôn trọng sự sống hoang dã, nói không với sản phẩm từ động vật quý hiếm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa con người và tự nhiên là", "options": ["A. con người hoàn toàn độc lập.", "B. con người là một phần của tự nhiên, vừa chịu ảnh hưởng vừa tác động trở lại.", "C. tự nhiên không cần con người nên con người muốn làm gì cũng được.", "D. không có quan hệ gì."], "answer": "B", "explain": "Con người sống nhờ tự nhiên nhưng cũng có thể hủy hoại nó — vì vậy phải sống hòa điệu, có trách nhiệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao học sinh cần tìm hiểu về biến đổi khí hậu?", "options": ["A. Để thi cử.", "B. Vì đây là thách thức của thế hệ các em; hiểu biết để có hành động đúng từ hôm nay.", "C. Không cần thiết.", "D. Vì đó là mốt."], "answer": "B", "explain": "Thế hệ trẻ là người gánh chịu hậu quả và cũng là người kiến tạo tương lai — cần hiểu để hành động.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Biểu đồ giúp so sánh số liệu trực quan hơn chữ viết.", "b) Đề mục in đậm giúp người đọc tìm thông tin nhanh.", "c) Hình ảnh minh họa làm văn bản thông tin sinh động, dễ hiểu.", "d) Trình bày trực quan không quan trọng trong văn bản thông tin."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: trình bày trực quan là một phần của văn bản thông tin.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mùa thu trong thơ thường gợi nỗi nhớ, suy tư.", "b) Mùa xuân trong thơ thường gợi niềm vui, hi vọng.", "c) Cảm xúc của nhà thơ không liên quan gì đến cảnh thiên nhiên.", "d) Mượn cảnh để bày tỏ tình cảm là đặc trưng của thơ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cảnh và tình gắn bó mật thiết trong thơ. d) Đúng: “cảnh sinh tình”.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) kể về một hoạt động bảo vệ môi trường mà em đã tham gia và nêu cảm nghĩ.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu hoạt động (trồng cây, dọn rác, tuyên truyền...). Thân đoạn: kể ngắn gọn diễn biến; cảm xúc khi tham gia; ý nghĩa của hoạt động. Kết đoạn: quyết tâm tiếp tục. Tiêu chí: kể chân thực, có cảm xúc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) phân tích tác dụng của tiêu đề và đề mục trong một văn bản thông tin cụ thể mà em đã đọc.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu văn bản. Thân đoạn: tiêu đề cho biết nội dung gì; các đề mục chia văn bản thế nào; tác dụng với người đọc (dễ nắm, dễ tìm thông tin). Kết đoạn: nhận xét về cách trình bày. Tiêu chí: phân tích đúng chức năng."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên nhân chính gây ô nhiễm không khí ở đô thị là", "options": ["A. khí thải từ phương tiện giao thông và nhà máy.", "B. tiếng chim hót.", "C. hoa nở.", "D. mưa rào."], "answer": "A", "explain": "Khói bụi từ xe cộ, nhà máy là nguồn ô nhiễm không khí lớn nhất ở các đô thị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bảo vệ động vật hoang dã có ý nghĩa gì?", "options": ["A. Không có ý nghĩa gì.", "B. Giữ gìn đa dạng sinh học, cân bằng sinh thái, bảo vệ sự sống trên Trái Đất.", "C. Chỉ để ngắm cho vui.", "D. Để săn bắt nhiều hơn."], "answer": "B", "explain": "Mỗi loài bị tuyệt chủng là một mắt xích đứt gãy trong chuỗi sinh thái, ảnh hưởng đến cả con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành động nào dưới đây góp phần bảo vệ môi trường?", "options": ["A. Xả rác bừa bãi.", "B. Tiết kiệm điện, nước; phân loại rác; trồng cây xanh.", "C. Đốt rừng làm nương.", "D. Săn bắt động vật quý hiếm."], "answer": "B", "explain": "Những việc nhỏ hằng ngày: tiết kiệm, phân loại rác, trồng cây — đều góp phần bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh mục đích của văn bản thông tin và bài thơ về thiên nhiên?", "options": ["A. Giống nhau hoàn toàn.", "B. Văn bản thông tin nhằm cung cấp tri thức; thơ nhằm bộc lộ cảm xúc, bồi đắp tâm hồn.", "C. Thơ cũng để cung cấp số liệu.", "D. Văn bản thông tin để giải trí."], "answer": "B", "explain": "Một bên “cho biết”, một bên “gợi cảm” — hai mục đích khác nhau nhưng cùng hướng con người tới thiên nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi tóm tắt một văn bản thông tin, cần làm gì?", "options": ["A. Chép lại toàn bộ.", "B. Nắm tiêu đề, đề mục; rút ra các ý chính, số liệu quan trọng bằng lời văn ngắn gọn.", "C. Bịa thêm ý mới.", "D. Chỉ vẽ tranh."], "answer": "B", "explain": "Tóm tắt là cô đọng nội dung: giữ ý chính, số liệu then chốt, bỏ chi tiết phụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đề mục thường được in đậm hoặc đánh số?", "options": ["A. Để đẹp.", "B. Để nổi bật cấu trúc, giúp người đọc dễ nhận ra các phần và tìm thông tin nhanh.", "C. Tốn mực.", "D. Không có tác dụng."], "answer": "B", "explain": "Trình bày trực quan là một phần của văn bản thông tin: giúp tiếp cận tri thức hiệu quả.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tìm hiểu biến đổi khí hậu giúp học sinh có hành động đúng.", "b) Thế hệ trẻ là người kiến tạo tương lai nên cần hiểu về môi trường.", "c) Học sinh không thể làm gì để bảo vệ môi trường.", "d) Những việc nhỏ như tiết kiệm điện, trồng cây đều có ý nghĩa."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: mỗi học sinh đều có thể hành động từ việc nhỏ. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Quang hợp giúp cây xanh tạo ra ô-xi cho sự sống” dùng thuật ngữ đúng.", "b) “Hôm nay hiệu ứng nhà kính của tôi rất vui” dùng thuật ngữ đúng.", "c) Thuật ngữ cần đặt trong ngữ cảnh khoa học phù hợp.", "d) Dùng sai thuật ngữ gây hiểu lầm về tri thức."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: dùng sai ngữ cảnh, vô nghĩa. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) giải thích hiện tượng quang hợp của cây xanh cho một bạn nhỏ hiểu (dùng lời văn đơn giản, có ví dụ).", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: đặt vấn đề (cây ăn bằng gì?). Thân đoạn: giải thích đơn giản (lá như nhà bếp, ánh sáng như lửa); cây thải ô-xi cho ta thở; ví dụ gần gũi. Kết đoạn: vì thế phải bảo vệ cây xanh. Tiêu chí: giải thích đúng mà đơn giản, dễ hiểu."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (8–10 câu) trình bày suy nghĩ về câu nói: “Trái Đất không phải của riêng chúng ta mà là tài sản chung của muôn loài.”", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giải thích câu nói. Thân đoạn: con người chỉ là một loài trong tự nhiên; không có quyền hủy hoại; dẫn chứng (tuyệt chủng, ô nhiễm); trách nhiệm chia sẻ, bảo vệ. Kết đoạn: sống có trách nhiệm. Tiêu chí: có chiều sâu, lập luận tốt."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Vì sao cần sống “hòa điệu với tự nhiên”?", "options": ["A. Vì con người là một phần của tự nhiên; hủy hoại tự nhiên là tự hủy hoại mình.", "B. Vì tự nhiên không quan trọng.", "C. Vì con người hoàn toàn độc lập với tự nhiên.", "D. Không cần thiết."], "answer": "A", "explain": "Con người sống nhờ không khí, nước, đất của tự nhiên; bảo vệ tự nhiên chính là bảo vệ cuộc sống của mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điểm khác nhau cơ bản giữa văn bản thông tin và thơ về thiên nhiên là", "options": ["A. văn bản thông tin cung cấp tri thức khách quan; thơ bộc lộ cảm xúc chủ quan trước thiên nhiên.", "B. hai loại hoàn toàn giống nhau.", "C. thơ cũng cung cấp số liệu khoa học.", "D. văn bản thông tin không cần chính xác."], "answer": "A", "explain": "Một bên hướng tới tri thức khách quan, một bên hướng tới cảm xúc thẩm mĩ — hai cách tiếp cận thiên nhiên bổ sung cho nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi đọc văn bản thông tin, cần chú ý điều gì?", "options": ["A. Đọc lướt, không cần hiểu.", "B. Nắm tiêu đề, đề mục; chú ý số liệu, sự kiện, thuật ngữ; tóm tắt ý chính.", "C. Chỉ đọc tranh vẽ.", "D. Học thuộc lòng từng chữ."], "answer": "B", "explain": "Đọc văn bản thông tin cần đọc có phương pháp: nắm cấu trúc, ghi nhận số liệu, sự kiện chính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biểu đồ lượng mưa trong văn bản thông tin giúp người đọc", "options": ["A. đỡ phải đọc chữ.", "B. hình dung trực quan xu hướng, so sánh số liệu dễ dàng hơn chữ viết.", "C. không hiểu gì.", "D. buồn ngủ."], "answer": "B", "explain": "Hình ảnh trực quan giúp não bộ nắm bắt số liệu nhanh hơn nhiều so với đọc dãy con số khô khan.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thơ về thiên nhiên và văn bản thông tin về môi trường có điểm chung nào?", "options": ["A. Không có điểm chung.", "B. Cùng hướng con người tới thiên nhiên: một bên bằng tri thức, một bên bằng cảm xúc — đều kêu gọi bảo vệ.", "C. Cùng toàn số liệu.", "D. Cùng là truyện."], "answer": "B", "explain": "Dù khác cách tiếp cận, cả hai đều nuôi dưỡng ở người đọc tình yêu và trách nhiệm với thiên nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây sử dụng thuật ngữ khoa học đúng cách?", "options": ["A. “Hôm nay hiệu ứng nhà kính của tôi rất vui.”", "B. “Quang hợp giúp cây xanh tạo ra ô-xi cho sự sống.”", "C. “Đa dạng sinh học là món ăn ngon.”", "D. “Biến đổi khí hậu làm bài tập về nhà.”"], "answer": "B", "explain": "Câu này dùng “quang hợp”, “ô-xi” đúng khái niệm khoa học trong ngữ cảnh phù hợp.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Văn bản về rừng trong sách cung cấp tri thức về vai trò của rừng.", "b) Bài thơ về rừng bộc lộ tình cảm với rừng.", "c) Hai cách viết cùng hướng tới việc trân trọng, bảo vệ rừng.", "d) Chỉ văn bản thông tin mới có giá trị, thơ ca thì không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: tri thức và cảm xúc bổ sung cho nhau. d) Sai: thơ ca bồi đắp tâm hồn, cũng rất giá trị.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bài 9 giúp học sinh nhận biết đặc điểm văn bản thông tin.", "b) Bài 9 giúp cảm nhận vẻ đẹp thơ về thiên nhiên bốn mùa.", "c) Thuật ngữ khoa học và cách trình bày văn bản thông tin là nội dung tiếng Việt của bài.", "d) Văn bản thông tin và thơ về thiên nhiên không có điểm chung nào."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cùng hướng con người tới thiên nhiên, kêu gọi bảo vệ.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) nêu bài học em rút ra sau khi học Bài 9: “Hòa điệu với tự nhiên”.", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: giới thiệu bài học chung. Thân đoạn: tri thức về văn bản thông tin, thuật ngữ; tình yêu thiên nhiên qua thơ; ý thức bảo vệ môi trường và hành động cụ thể. Kết đoạn: quyết tâm. Tiêu chí: nêu được ít nhất 2 bài học cụ thể."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5–7 câu) chứng minh: “Thiên nhiên là người bạn lớn của con người.”", "points": 0, "explain": "Gợi ý dàn ý: Mở đoạn: nêu luận điểm. Thân đoạn: thiên nhiên cho ta không khí, nước, lương thực; cho ta vẻ đẹp, cảm hứng; dẫn chứng (rừng, biển, thơ ca); khi bị hủy hoại, con người gánh hậu quả. Kết đoạn: khẳng định và kêu gọi. Tiêu chí: có dẫn chứng, lập luận chặt chẽ."}]}]}
