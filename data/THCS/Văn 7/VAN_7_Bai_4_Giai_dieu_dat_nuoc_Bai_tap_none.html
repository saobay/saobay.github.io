 việc."], "answer": "B", "explain": "Tùy bút, tản văn kết hợp linh hoạt tự sự, miêu tả, biểu cảm và nghị luận, trong đó biểu cảm giữ vai trò nổi bật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chữ “tùy” trong “tùy bút” có nghĩa là gì?", "options": ["A. Tùy thuộc hoàn toàn vào người khác.", "B. Tùy tiện, cẩu thả, thiếu nghiêm túc.", "C. Tùy ý, tự do, không gò bó theo khuôn mẫu.", "D. Làm theo một khuôn mẫu có sẵn."], "answer": "C", "explain": "“Tùy” nghĩa là tùy ý, tự do — thể hiện cách viết phóng túng, không gò bó của thể loại này.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Mùa thu Hà Nội dịu dàng như một bản tình ca”, từ “dịu dàng” được hiểu theo nghĩa nào?", "options": ["A. Nghĩa đen: mềm mại khi sờ, chạm vào.", "B. Nghĩa bóng: nhẹ nhàng, êm đềm, gợi cảm nhận về không khí mùa thu.", "C. Nghĩa đen: có nhiệt độ thấp, mát lạnh.", "D. Không có nghĩa gì trong câu."], "answer": "B", "explain": "“Dịu dàng” vốn chỉ tính chất mềm mại; khi dùng cho mùa thu, nó mang nghĩa bóng: nhẹ nhàng, êm đềm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một đoạn văn ghi lại cảm xúc của tác giả khi ngắm hoàng hôn trên sông Sài Gòn, không có cốt truyện rõ ràng. Đoạn văn đó thuộc thể loại nào?", "options": ["A. Truyện trinh thám.", "B. Bản tin thời sự.", "C. Tùy bút.", "D. Kịch bản sân khấu."], "answer": "C", "explain": "Đoạn văn ghi cảm xúc tự do, không có cốt truyện — đúng đặc trưng của tùy bút.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao “Sài Gòn tôi yêu” được xếp vào thể tùy bút?", "options": ["A. Vì tác phẩm ghi lại tự do cảm xúc, ấn tượng của tác giả về Sài Gòn, giàu chất trữ tình.", "B. Vì tác phẩm có rất nhiều nhân vật với số phận khác nhau.", "C. Vì tác phẩm được viết hoàn toàn bằng thơ lục bát.", "D. Vì tác phẩm kể lại một vụ án li kì."], "answer": "A", "explain": "“Sài Gòn tôi yêu” không có cốt truyện mà là dòng cảm xúc tự do, tha thiết về thành phố — đúng chất tùy bút.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phép liệt kê có tác dụng diễn tả sự vật đầy đủ, toàn diện, tạo ấn tượng mạnh.", "b) Trong tùy bút, hình ảnh “tôi” thường chính là tác giả trực tiếp bộc lộ cảm xúc.", "c) “Sài Gòn tôi yêu” ca ngợi con người Nam Bộ phóng khoáng, chân thành, hào sảng.", "d) Tùy bút và truyện ngắn giống nhau hoàn toàn về kết cấu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: cái “tôi” trữ tình thường chính là tác giả. c) Đúng. d) Sai: tùy bút không có cốt truyện chặt chẽ như truyện ngắn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giọng điệu chủ đạo của tùy bút, tản văn là tâm tình, thủ thỉ như lời tâm sự.", "b) Tản văn về miền quê thường gửi gắm nỗi nhớ quê hương và tình yêu vẻ đẹp bình dị.", "c) Từ ngữ trong tiếng Việt chỉ có một lớp nghĩa duy nhất.", "d) Khi đọc tùy bút, cần chú ý cảm xúc tác giả gửi gắm qua hình ảnh và ngôn ngữ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: từ ngữ thường có nghĩa đen và nghĩa bóng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Phân tích tác dụng của biện pháp điệp ngữ trong câu văn sau: “Tôi nhớ Sài Gòn, nhớ những con đường rợp bóng me, nhớ những cơn mưa chợt đến, nhớ những nụ cười thân thiện.” Viết thành đoạn văn (khoảng 120 – 150 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Chỉ ra điệp ngữ: lặp từ “nhớ” và cấu trúc “nhớ...”.\n- Tác dụng: nhấn mạnh nỗi nhớ sâu đậm, da diết; tạo nhịp điệu dồn dập, thiết tha như dòng cảm xúc tuôn trào; khắc sâu tình yêu gắn bó với Sài Gòn.\n- Liên hệ: điệp ngữ là biện pháp quen thuộc của tùy bút để bộc lộ cảm xúc.\nChấm theo: chỉ đúng biện pháp, phân tích được 2 – 3 tác dụng, diễn đạt mạch lạc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) nêu cảm nhận của em về vẻ đẹp mùa thu Hà Nội qua tác phẩm “Mùa thu của em” của Quang Huy.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: cảm nhận chung về mùa thu Hà Nội trong trẻo, dịu dàng.\n- Thân đoạn: vẻ đẹp qua hình ảnh thơ (nắng vàng, lá rơi, hương cốm...); gắn với kỉ niệm tuổi thơ trong sáng; ngôn ngữ giàu nhạc tính, gợi cảm.\n- Kết đoạn: tình yêu Hà Nội, mong muốn giữ gìn vẻ đẹp ấy.\nChấm theo: cảm nhận chân thành, có hình ảnh tiêu biểu, diễn đạt trong sáng."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Tác phẩm “Sài Gòn tôi yêu” là sáng tác của ai?", "options": ["A. Minh Hương.", "B. Nguyễn Tuân.", "C. Quang Huy.", "D. Tô Hoài."], "answer": "A", "explain": "“Sài Gòn tôi yêu” là tùy bút nổi tiếng của nhà văn Minh Hương, người gắn bó với mảnh đất phương Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Sài Gòn tôi yêu” thuộc thể loại nào?", "options": ["A. Thơ lục bát.", "B. Kịch nói.", "C. Truyện ngắn.", "D. Tùy bút."], "answer": "D", "explain": "“Sài Gòn tôi yêu” là tùy bút: ghi lại tự do cảm xúc yêu mến của tác giả với thành phố Sài Gòn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tình cảm chủ đạo trong “Sài Gòn tôi yêu” là gì?", "options": ["A. Nỗi nhớ quê hương miền Bắc da diết.", "B. Nỗi buồn về sự đổi thay nhanh chóng của thành phố.", "C. Sự phê phán lối sống thị thành xô bồ.", "D. Tình yêu tha thiết với thành phố Sài Gòn và con người nơi đây."], "answer": "D", "explain": "Tác phẩm là lời tâm tình tha thiết, ngợi ca vẻ đẹp của cảnh vật, nhịp sống và con người Sài Gòn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điệp ngữ trong câu “Tôi nhớ Sài Gòn. Tôi nhớ những buổi sáng se lạnh. Tôi nhớ những cơn mưa chợt đến.” có tác dụng gì?", "options": ["A. Làm cho câu văn trở nên rời rạc, thiếu liên kết.", "B. Làm giảm bớt cảm xúc của người viết.", "C. Nhấn mạnh nỗi nhớ sâu đậm, tạo nhịp điệu thiết tha, dồn dập.", "D. Không có tác dụng gì đặc biệt."], "answer": "C", "explain": "Điệp cấu trúc “Tôi nhớ...” nhấn mạnh nỗi nhớ da diết, đồng thời tạo nhịp điệu dồn dập, thiết tha.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phép liệt kê trong câu “Phở, bánh mì, cơm tấm, hủ tiếu — Sài Gòn níu chân người bằng muôn vàn món ngon.” có tác dụng gì?", "options": ["A. Chê bai ẩm thực Sài Gòn đơn điệu.", "B. Rút ngắn câu văn một cách tối đa.", "C. Làm câu văn trở nên khó hiểu, rối rắm.", "D. Khắc họa sự phong phú của ẩm thực Sài Gòn, gợi cảm giác đầy đặn, hấp dẫn."], "answer": "D", "explain": "Liệt kê các món ăn giúp diễn tả đầy đủ sự phong phú của ẩm thực Sài Gòn, gợi cảm giác hấp dẫn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong văn bản khoa học, từ “hệ sinh thái” được xem là gì?", "options": ["A. Thành ngữ dân gian.", "B. Từ địa phương Nam Bộ.", "C. Từ láy gợi hình.", "D. Thuật ngữ sinh học, mang nghĩa chính xác và đơn nghĩa."], "answer": "D", "explain": "“Hệ sinh thái” là thuật ngữ của sinh học, biểu thị khái niệm khoa học chính xác, đơn nghĩa.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Giai điệu đất nước” gợi liên tưởng tình yêu quê hương ngân lên như một bản nhạc đẹp.", "b) Minh Hương là tác giả của tùy bút “Sài Gòn tôi yêu”.", "c) Điệp ngữ có tác dụng nhấn mạnh ý và tạo nhịp điệu cho câu văn.", "d) Tùy bút là thể văn trình bày quan điểm bằng hệ thống lí lẽ chặt chẽ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: dùng lí lẽ chặt chẽ là đặc điểm của văn nghị luận, không phải tùy bút.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quang Huy viết “Mùa thu của em” về mùa thu Hà Nội.", "b) Liệt kê là kể ra hàng loạt sự vật cùng loại trong câu văn.", "c) Nghĩa bóng của từ là nghĩa được suy ra từ nghĩa đen trong quá trình sử dụng.", "d) Ngôn ngữ tùy bút càng khô khan thì càng hay."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ngôn ngữ tùy bút cần giàu hình ảnh, cảm xúc.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 – 200 chữ) nêu suy nghĩ của em về trách nhiệm của thế hệ trẻ trong việc giữ gìn vẻ đẹp quê hương, đất nước.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: nêu vấn đề — quê hương có nhiều vẻ đẹp cần được giữ gìn.\n- Thân đoạn: biểu hiện (giữ gìn cảnh quan, bảo vệ môi trường, trân trọng bản sắc văn hóa...); vì sao thế hệ trẻ phải có trách nhiệm; dẫn chứng thực tế.\n- Kết đoạn: liên hệ bản thân, quyết tâm hành động.\nChấm theo: lập luận rõ ràng, có dẫn chứng, liên hệ bản thân chân thành."}, {"type": "essay", "level": "VDC", "q": "Phân tích tác dụng của phép liệt kê trong câu văn: “Phở, bánh mì, cơm tấm, hủ tiếu — Sài Gòn níu chân người bằng muôn vàn món ngon.” Viết thành đoạn văn (khoảng 120 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Chỉ ra phép liệt kê: kể hàng loạt món ăn đặc trưng của Sài Gòn.\n- Tác dụng: diễn tả đầy đủ sự phong phú của ẩm thực; tạo nhịp điệu rộn ràng, gợi cảm giác hấp dẫn; thể hiện tình yêu, niềm tự hào của tác giả.\nChấm theo: chỉ đúng biện pháp, phân tích được tác dụng nội dung và nghệ thuật."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Tác phẩm “Mùa thu của em” là sáng tác của ai?", "options": ["A. Minh Hương.", "B. Xuân Quỳnh.", "C. Hữu Thỉnh.", "D. Quang Huy."], "answer": "D", "explain": "“Mùa thu của em” là sáng tác của nhà thơ Quang Huy, người viết nhiều tác phẩm cho thiếu nhi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Mùa thu của em” gợi tả vẻ đẹp mùa thu của vùng đất nào?", "options": ["A. Đà Lạt.", "B. Sài Gòn.", "C. Huế.", "D. Hà Nội."], "answer": "D", "explain": "Tác phẩm gợi tả vẻ đẹp trong trẻo của mùa thu Hà Nội gắn với kỉ niệm tuổi thơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đề tài chung của các văn bản trong Bài 4 là gì?", "options": ["A. Tình bạn trong sáng của tuổi học trò.", "B. Cuộc sống nông thôn Việt Nam xưa.", "C. Tình yêu quê hương, đất nước qua vẻ đẹp của các vùng miền.", "D. Chiến tranh và khát vọng hòa bình."], "answer": "C", "explain": "Các văn bản trong bài đều gửi gắm tình yêu quê hương qua vẻ đẹp của Sài Gòn, Hà Nội, miền quê — đúng như nhan đề “Giai điệu đất nước”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm nào sau đây KHÔNG phải là đặc điểm của tản văn?", "options": ["A. Viết tự do, phóng túng.", "B. Giàu cảm xúc, ngôn ngữ gợi cảm.", "C. Có cốt truyện chặt chẽ với nút thắt và cao trào.", "D. Ghi lại rung động, suy ngẫm nhẹ nhàng."], "answer": "C", "explain": "Tản văn không có cốt truyện chặt chẽ; cốt truyện với nút thắt, cao trào là đặc điểm của truyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây sử dụng từ ngữ với nghĩa bóng?", "options": ["A. Cô ấy hái hoa trong vườn nhà.", "B. Bông hoa này có màu đỏ rực.", "C. Hoa nở rộ vào mùa xuân.", "D. Lòng tôi nở hoa khi nghe tin quê hương đổi mới."], "answer": "D", "explain": "“Nở hoa” ở câu D không chỉ hoa nở theo nghĩa đen mà chỉ niềm vui nở rộ trong lòng — nghĩa bóng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đọc đoạn văn: “Mỗi lần xa Sài Gòn, lòng tôi lại cồn cào nhớ những con đường rợp bóng me, nhớ tiếng rao đêm thân thuộc.” Cảm xúc chính của đoạn văn là gì?", "options": ["A. Sự chán ghét cuộc sống ồn ào.", "B. Nỗi nhớ da diết và tình yêu gắn bó với Sài Gòn.", "C. Niềm vui khi được đi xa.", "D. Nỗi sợ hãi khi phải xa thành phố."], "answer": "B", "explain": "Các từ ngữ “cồn cào nhớ”, “thân thuộc” cùng điệp từ “nhớ” thể hiện nỗi nhớ da diết và tình yêu gắn bó.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tùy bút kết hợp các phương thức tự sự, miêu tả, biểu cảm và nghị luận.", "b) Chữ “tùy” trong “tùy bút” có nghĩa là tùy ý, tự do, không gò bó.", "c) “Sài Gòn tôi yêu” thể hiện tình yêu qua cảnh vật, nhịp sống và con người thành phố.", "d) Đọc tùy bút chỉ cần nhớ cốt truyện là đủ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tùy bút không có cốt truyện; cần cảm nhận xúc qua hình ảnh, ngôn ngữ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Quang hợp” là thuật ngữ sinh học.", "b) “Ẩn dụ” là thuật ngữ của văn học.", "c) Thuật ngữ thường nhiều nghĩa, giàu sắc thái biểu cảm.", "d) Trong “Sài Gòn tôi yêu”, tác giả yêu cả những đổi thay của thành phố."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: thuật ngữ chính xác, đơn nghĩa. d) Đúng: tình yêu trọn vẹn với sức sống thành phố.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn theo phong cách tản văn (khoảng 150 chữ) giới thiệu một danh lam thắng cảnh của quê hương em.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: giới thiệu danh thắng và ấn tượng chung.\n- Thân đoạn: miêu tả vẻ đẹp qua hình ảnh, âm thanh, màu sắc; gửi gắm cảm xúc, niềm tự hào; có thể dùng so sánh, liệt kê, điệp ngữ.\n- Kết đoạn: lời mời, niềm mong ước.\nChấm theo: đúng chất tản văn, hình ảnh sinh động, cảm xúc chân thành."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) cảm nhận về hình ảnh con người Nam Bộ qua tùy bút “Sài Gòn tôi yêu” của Minh Hương.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: con người là vẻ đẹp nổi bật nhất trong tình yêu Sài Gòn của tác giả.\n- Thân đoạn: nét đẹp phóng khoáng, chân thành, hào sảng; luôn dang tay giúp đỡ; nghệ thuật khắc họa qua chi tiết đời thường, ngôn ngữ mộc mạc mà ấm áp.\n- Kết đoạn: suy nghĩ về cách sống đẹp, học tập nét đẹp ấy.\nChấm theo: nêu được nét đẹp tiêu biểu, có phân tích nghệ thuật, liên hệ bản thân."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Thuật ngữ là gì?", "options": ["A. Từ láy gợi hình ảnh, âm thanh.", "B. Từ ngữ chỉ dùng trong thơ ca trữ tình.", "C. Từ ngữ địa phương của một vùng miền.", "D. Từ ngữ biểu thị khái niệm khoa học, công nghệ, thường dùng trong văn bản khoa học."], "answer": "D", "explain": "Thuật ngữ là từ ngữ biểu thị khái niệm khoa học, công nghệ, dùng trong lĩnh vực chuyên môn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đặc điểm của thuật ngữ là gì?", "options": ["A. Chỉ dùng trong giao tiếp hằng ngày.", "B. Luôn là từ láy hoặc từ ghép.", "C. Nhiều nghĩa, giàu sắc thái biểu cảm.", "D. Chính xác, đơn nghĩa trong phạm vi lĩnh vực sử dụng."], "answer": "D", "explain": "Thuật ngữ đòi hỏi tính chính xác và đơn nghĩa để tránh hiểu lầm trong lĩnh vực chuyên môn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp tu từ điệp ngữ là gì?", "options": ["A. So sánh hai sự vật, hiện tượng với nhau.", "B. Dùng từ trái nghĩa để tạo tương phản.", "C. Lặp lại có chủ đích một từ ngữ trong câu hoặc đoạn văn.", "D. Kể ra hàng loạt sự vật, hiện tượng cùng loại."], "answer": "C", "explain": "Điệp ngữ là lặp lại có chủ đích từ ngữ nhằm nhấn mạnh và tạo nhịp điệu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ngôn ngữ của tùy bút cần giàu hình ảnh?", "options": ["A. Để người đọc dễ thuộc lòng văn bản.", "B. Để gợi cảm xúc, giúp người đọc hình dung rõ và đồng cảm với tác giả.", "C. Để làm cho văn bản dài hơn.", "D. Để chứng tỏ tác giả dùng nhiều từ khó."], "answer": "B", "explain": "Ngôn ngữ giàu hình ảnh khơi gợi trí tưởng tượng và cảm xúc, giúp người đọc đồng cảm với tác giả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhan đề “Mùa thu của em” gợi cho người đọc cảm nhận gì?", "options": ["A. Mùa thu không có gì đặc biệt.", "B. Mùa thu gắn với kỉ niệm tuổi thơ trong sáng và tình cảm yêu thương gần gũi.", "C. Mùa thu buồn bã, ảm đạm, đáng sợ.", "D. Mùa thu chỉ dành cho người lớn tuổi."], "answer": "B", "explain": "Cụm từ “của em” tạo sự gần gũi, gắn mùa thu với kỉ niệm tuổi thơ ngọt ngào, đầy yêu thương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điệp từ “nhớ” trong câu “Nhớ con đường, nhớ hàng me, nhớ tiếng ve râm ran.” có tác dụng gì?", "options": ["A. Nhấn mạnh nỗi nhớ sâu đậm, dồn dập về quê hương.", "B. Giảm nhẹ cảm xúc nhớ nhung.", "C. Chỉ để câu văn dài hơn.", "D. Làm câu văn lủng củng, khó đọc."], "answer": "A", "explain": "Điệp từ “nhớ” nhấn mạnh nỗi nhớ sâu đậm, dồn dập, tạo nhịp điệu thiết tha.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu “Tôi yêu Sài Gòn, yêu những con đường, yêu những nụ cười” có điệp ngữ “yêu”.", "b) Câu “Phở, bánh mì, cơm tấm, hủ tiếu” sử dụng phép liệt kê.", "c) Tản văn thường dài như tiểu thuyết nhiều chương.", "d) Cái “tôi” trong tùy bút khác người kể chuyện hóa thân trong truyện ngắn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: lặp “yêu” có chủ đích. b) Đúng: kể hàng loạt món ăn cùng loại. c) Sai: tản văn là văn xuôi ngắn. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhan đề “Mùa thu của em” tạo cảm giác gần gũi, gắn mùa thu với kỉ niệm riêng.", "b) Viết tản văn cần quan sát tinh tế, cảm xúc chân thành, ngôn ngữ gợi cảm.", "c) Đề tài chung của Bài 4 là tình yêu quê hương qua vẻ đẹp các vùng miền.", "d) Học Bài 4 giúp bồi dưỡng sự vô cảm trước cái đẹp."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bài học bồi dưỡng tình yêu quê hương, sự rung động trước cái đẹp.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 120 – 150 chữ) lí giải vì sao nhan đề “Giai điệu đất nước” phù hợp với nội dung của Bài 4.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- “Giai điệu” gợi bản nhạc với nhiều cung bậc — tương ứng với vẻ đẹp đa dạng của các vùng miền (Sài Gòn sôi động, Hà Nội dịu dàng, miền quê bình dị).\n- Mỗi văn bản là một “giai điệu” riêng, hòa chung thành bản nhạc tình yêu quê hương, đất nước.\n- Nhan đề giàu sức gợi, khái quát được chủ đề.\nChấm theo: lí giải hợp lí, gắn với nội dung các văn bản, diễn đạt mạch lạc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) phân tích vẻ đẹp của cái “tôi” trữ tình trong tùy bút “Sài Gòn tôi yêu”.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Cái “tôi” chính là tác giả, trực tiếp bộc lộ cảm xúc.\n- Vẻ đẹp: tâm hồn nhạy cảm, tinh tế trước cái đẹp; tình yêu chân thành, sâu đậm với thành phố; giọng điệu tâm tình, thủ thỉ.\n- Nghệ thuật: ngôi kể thứ nhất, ngôn ngữ giàu hình ảnh, điệp ngữ, liệt kê.\nChấm theo: làm rõ “tôi” là tác giả, phân tích được vẻ đẹp tâm hồn qua nghệ thuật."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Tác dụng chính của điệp ngữ là gì?", "options": ["A. Nhấn mạnh ý, tạo nhịp điệu cho câu văn, đoạn văn.", "B. Làm giảm bớt cảm xúc của người viết.", "C. Thay thế hoàn toàn cho các dấu câu.", "D. Làm cho câu văn ngắn gọn, súc tích hơn."], "answer": "A", "explain": "Điệp ngữ nhấn mạnh ý cần biểu đạt, đồng thời tạo nhịp điệu dồn dập hoặc thiết tha cho câu văn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp tu từ liệt kê là gì?", "options": ["A. Nói quá lên so với sự thật.", "B. Kể ra hàng loạt sự vật, hiện tượng cùng loại trong câu văn.", "C. Dùng hình ảnh này thay thế cho hình ảnh khác.", "D. Lặp lại một từ ngữ nhiều lần trong câu."], "answer": "B", "explain": "Liệt kê là kể ra hàng loạt sự vật, hiện tượng cùng loại trong câu văn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác dụng của phép liệt kê là gì?", "options": ["A. Làm cho câu văn trở nên mơ hồ, khó hiểu.", "B. Rút ngắn câu văn một cách tối đa.", "C. Che giấu ý nghĩa thực của câu văn.", "D. Diễn tả sự vật một cách đầy đủ, toàn diện, tạo ấn tượng mạnh."], "answer": "D", "explain": "Liệt kê giúp diễn tả đầy đủ, toàn diện sự vật, tạo ấn tượng mạnh và nhịp điệu rộn ràng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phép liệt kê “sông, núi, đồng ruộng, biển cả” trong câu văn tả đất nước có tác dụng gì?", "options": ["A. Gợi tả vẻ đẹp đa dạng, trù phú của đất nước một cách đầy đủ.", "B. Làm câu văn thiếu mạch lạc.", "C. Thể hiện sự nghèo nàn của đất nước.", "D. Không mang ý nghĩa gì."], "answer": "A", "explain": "Liệt kê các cảnh quan giúp diễn tả đầy đủ, toàn diện vẻ đẹp đa dạng, trù phú của đất nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cái “tôi” trong tùy bút khác người kể chuyện trong truyện ngắn ở điểm nào?", "options": ["A. “Tôi” trong tùy bút luôn là nhân vật phản diện.", "B. “Tôi” trong tùy bút chính là tác giả trực tiếp bộc lộ cảm xúc, không hóa thân vào nhân vật hư cấu.", "C. “Tôi” trong tùy bút không bao giờ xuất hiện.", "D. Không có điểm khác biệt nào."], "answer": "B", "explain": "Trong tùy bút, “tôi” thường chính là tác giả bộc lộ trực tiếp cảm xúc; trong truyện, người kể có thể hóa thân hoặc đứng ngoài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thuật ngữ “điệp ngữ” thuộc lĩnh vực nào?", "options": ["A. Toán học.", "B. Vật lí học.", "C. Hóa học.", "D. Ngôn ngữ học, văn học (tu từ học)."], "answer": "D", "explain": "“Điệp ngữ” là thuật ngữ của tu từ học, thuộc lĩnh vực ngôn ngữ và văn học.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tùy bút coi trọng cảm xúc và ấn tượng chủ quan của tác giả hơn cốt truyện.", "b) “Minh Hương” là bút danh của nhà thơ Quang Huy.", "c) Phép liệt kê “sông, núi, đồng ruộng, biển cả” gợi vẻ đẹp đa dạng của đất nước.", "d) Từ “dịu dàng” trong “mùa thu dịu dàng” mang nghĩa bóng."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: Minh Hương và Quang Huy là hai tác giả khác nhau. c) Đúng. d) Đúng: chỉ sự nhẹ nhàng, êm đềm của không khí.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) So sánh, nhân hóa, điệp ngữ, liệt kê thường xuất hiện trong tùy bút, tản văn.", "b) Nhịp điệu câu văn tùy bút thường du dương, uyển chuyển theo cảm xúc.", "c) Tản văn về Hà Nội gửi gắm nỗi nhớ phố cổ và tình yêu vẻ đẹp bình dị.", "d) Thuật ngữ “liệt kê” thuộc lĩnh vực toán học."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: “liệt kê” là thuật ngữ tu từ học, thuộc văn học.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết đoạn văn theo phong cách tản văn (khoảng 150 chữ) kể về một kỉ niệm đẹp gắn với mùa em yêu thích nhất.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: giới thiệu mùa em yêu và kỉ niệm gắn với nó.\n- Thân đoạn: kể lại kỉ niệm qua hình ảnh, cảm xúc cụ thể; ngôn ngữ gợi cảm, giàu chất thơ.\n- Kết đoạn: ý nghĩa của kỉ niệm với bản thân.\nChấm theo: đúng chất tản văn (tự do, cảm xúc), kỉ niệm cụ thể, cảm xúc chân thành."}, {"type": "essay", "level": "VDC", "q": "So sánh tình yêu thành phố trong “Sài Gòn tôi yêu” và tình yêu Hà Nội trong các tản văn về Hà Nội: nêu điểm chung và điểm riêng. Viết thành đoạn văn (khoảng 150 – 200 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Điểm chung: đều là tình yêu quê hương tha thiết, gửi gắm qua cảnh vật, con người, nhịp sống; giọng tâm tình.\n- Điểm riêng: Sài Gòn — sôi động, phóng khoáng, hào sảng; Hà Nội — dịu dàng, cổ kính, sâu lắng.\n- Kết: mỗi vùng miền một vẻ đẹp, cùng làm nên “giai điệu đất nước”.\nChấm theo: so sánh rõ chung, riêng; có dẫn chứng; kết luận sâu sắc."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong tùy bút, hình ảnh “tôi” thường chính là ai?", "options": ["A. Người kể chuyện ở ngôi thứ ba giấu mặt.", "B. Chính tác giả, người trực tiếp bày tỏ cảm xúc, suy nghĩ.", "C. Nhân vật phản diện trong tác phẩm.", "D. Một nhân vật hư cấu do tác giả tưởng tượng ra."], "answer": "B", "explain": "Cái “tôi” trong tùy bút thường chính là tác giả đang trực tiếp bộc lộ cảm xúc, suy nghĩ của mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tùy bút khác truyện ngắn ở điểm cơ bản nào?", "options": ["A. Tùy bút không có nhân vật nào xuất hiện.", "B. Tùy bút được viết hoàn toàn bằng thơ.", "C. Tùy bút không có cốt truyện chặt chẽ, coi trọng cảm xúc và ấn tượng.", "D. Tùy bút luôn dài hơn truyện ngắn rất nhiều."], "answer": "C", "explain": "Điểm khác cơ bản: tùy bút không có cốt truyện chặt chẽ mà coi trọng cảm xúc, ấn tượng chủ quan của tác giả.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giọng điệu chủ đạo của tùy bút, tản văn thường là gì?", "options": ["A. Lạnh lùng, khách quan như bản báo cáo.", "B. Hùng hồn, đanh thép như lời hiệu triệu.", "C. Hài hước, châm biếm sâu cay.", "D. Tâm tình, trữ tình, thủ thỉ như lời tâm sự."], "answer": "D", "explain": "Tùy bút, tản văn thường có giọng tâm tình, thủ thỉ như lời tâm sự chân thành.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ nào dưới đây là thuật ngữ văn học?", "options": ["A. Cái bàn.", "B. Chạy nhanh.", "C. Ẩn dụ.", "D. Vui quá."], "answer": "C", "explain": "“Ẩn dụ” là thuật ngữ văn học chỉ biện pháp tu từ; các từ còn lại là từ ngữ thông thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi viết đoạn văn cảm nhận về một tùy bút, em cần làm gì?", "options": ["A. Kể lại toàn bộ cốt truyện của tác phẩm.", "B. Nêu cảm xúc chủ đạo của tác giả, phân tích những hình ảnh, ngôn ngữ tiêu biểu.", "C. Chép lại nguyên văn tác phẩm.", "D. Chỉ ghi năm sinh của tác giả."], "answer": "B", "explain": "Cảm nhận tùy bút cần nêu cảm xúc chủ đạo và phân tích hình ảnh, ngôn ngữ tiêu biểu thể hiện cảm xúc đó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết nào sau đây phù hợp với vẻ đẹp con người Nam Bộ trong “Sài Gòn tôi yêu”?", "options": ["A. Những con người hào sảng, chân tình, luôn dang tay giúp đỡ người khác.", "B. Những con người lạnh lùng, khép kín, xa cách.", "C. Những con người chỉ biết nghĩ cho bản thân.", "D. Những con người bi quan, chán nản."], "answer": "A", "explain": "Minh Hương ngợi ca con người Nam Bộ phóng khoáng, chân thành, hào sảng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong câu “Lòng tôi nở hoa”, từ “nở hoa” mang nghĩa bóng chỉ niềm vui.", "b) Điệp cấu trúc “Tôi nhớ... Tôi nhớ...” tạo nhịp điệu dồn dập, nhấn mạnh nỗi nhớ.", "c) “Sài Gòn tôi yêu” thuộc thể loại truyện ngắn.", "d) Học tùy bút giúp ta biết rung động trước vẻ đẹp của quê hương."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: niềm vui nở rộ trong lòng. b) Đúng. c) Sai: đây là tùy bút. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tản văn gần gũi với tùy bút nhưng thường ngắn gọn, nhẹ nhàng hơn.", "b) “Tùy bút” nghĩa là viết theo một khuôn mẫu cứng nhắc.", "c) Con người Nam Bộ trong “Sài Gòn tôi yêu” hiện lên chân tình, hào sảng.", "d) Khi viết cảm nhận tùy bút cần phân tích hình ảnh, ngôn ngữ tiêu biểu."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: “tùy” là tùy ý, tự do. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 120 – 150 chữ) bày tỏ cảm xúc của em sau khi đọc xong tác phẩm “Mùa thu của em”.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Cảm xúc chung: xao xuyến, trong trẻo trước vẻ đẹp mùa thu.\n- Điều gây ấn tượng: hình ảnh thơ đẹp, kỉ niệm tuổi thơ ngọt ngào, ngôn ngữ giàu nhạc tính.\n- Suy nghĩ: thêm yêu Hà Nội, yêu mùa thu quê hương.\nChấm theo: cảm xúc chân thành, cụ thể, không chung chung."}, {"type": "essay", "level": "VDC", "q": "Phân tích vai trò của các chi tiết đời thường (tiếng rao đêm, mùi cà phê sáng, nụ cười người xa lạ...) trong việc thể hiện tình yêu Sài Gòn của tác giả. Viết thành đoạn văn (khoảng 150 chữ).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Chi tiết đời thường gần gũi, cụ thể, ai cũng có thể cảm nhận.\n- Vai trò: làm cho tình yêu trở nên chân thật, không chung chung; gợi sự đồng cảm nơi người đọc; thể hiện sự gắn bó, am hiểu sâu sắc của tác giả với thành phố.\n- Nghệ thuật: liệt kê, miêu tả tinh tế.\nChấm theo: phân tích được vai trò, có lí lẽ và dẫn chứng."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Khi đọc tùy bút, tản văn, người đọc cần chú ý điều gì nhất?", "options": ["A. Cảm xúc của tác giả gửi gắm qua hình ảnh và ngôn ngữ.", "B. Tìm ra nhân vật tốt và nhân vật xấu.", "C. Đếm xem có bao nhiêu nhân vật xuất hiện.", "D. Ghi nhớ chính xác năm sáng tác tác phẩm."], "answer": "A", "explain": "Đọc tùy bút, tản văn cần nắm bắt cảm xúc của tác giả qua hệ thống hình ảnh và ngôn ngữ giàu sức gợi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Con người Nam Bộ qua trang viết của Minh Hương hiện lên với nét đẹp nào?", "options": ["A. Phóng khoáng, chân thành, hào sảng.", "B. Tính toán, vụ lợi trong mọi việc.", "C. Bi quan, chán nản với cuộc sống.", "D. Khép kín, lạnh lùng, khó gần."], "answer": "A", "explain": "Con người Nam Bộ trong “Sài Gòn tôi yêu” hiện lên phóng khoáng, chân tình, hào sảng, luôn dang tay giúp đỡ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nghĩa của từ ngữ được hiểu như thế nào?", "options": ["A. Là nội dung, sự vật hay hiện tượng mà từ biểu thị.", "B. Là số lượng nét chữ tạo nên từ.", "C. Là nguồn gốc, xuất xứ của từ.", "D. Là cách phát âm chuẩn của từ."], "answer": "A", "explain": "Nghĩa của từ là nội dung, sự vật hay hiện tượng mà từ biểu thị, cần đặt trong ngữ cảnh để hiểu đúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhịp điệu câu văn trong tùy bút, tản văn thường như thế nào?", "options": ["A. Giật cục, đứt quãng liên tục.", "B. Đều đều như tiếng máy móc.", "C. Không có nhịp điệu gì.", "D. Du dương, uyển chuyển theo dòng cảm xúc của tác giả."], "answer": "D", "explain": "Câu văn tùy bút, tản văn thường du dương, uyển chuyển, nhịp điệu biến đổi theo dòng cảm xúc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tản văn viết về miền quê thường lấy cảm hứng từ đâu?", "options": ["A. Từ các phát minh khoa học hiện đại.", "B. Từ những trận đánh lịch sử.", "C. Từ những kỉ niệm tuổi thơ và cảnh vật bình dị của làng quê.", "D. Từ những cuộc phiêu lưu mạo hiểm ở nước ngoài."], "answer": "C", "explain": "Tản văn miền quê thường bắt nguồn từ kỉ niệm tuổi thơ và vẻ đẹp bình dị của làng quê.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao tác giả đặt nhan đề “Mùa thu của em” mà không phải “Mùa thu Hà Nội”?", "options": ["A. Vì nhan đề dài sẽ hay hơn.", "B. Vì tác giả quên mất tên thành phố.", "C. Vì bài thơ không viết về Hà Nội.", "D. Vì “của em” tạo sự gần gũi, gắn mùa thu với kỉ niệm riêng đầy yêu thương."], "answer": "D", "explain": "“Của em” gợi sự gần gũi, thân thương, gắn mùa thu với kỉ niệm tuổi thơ ngọt ngào.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu “Chợ Bến Thành, Nhà thờ Đức Bà, Bưu điện thành phố” dùng phép liệt kê.", "b) Điệp ngữ làm câu văn ngắn gọn hơn.", "c) “Mùa thu của em” gợi tả mùa thu Hà Nội trong trẻo.", "d) Phương thức biểu cảm giữ vai trò nổi bật trong tùy bút."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: kể các địa danh cùng loại. b) Sai: điệp ngữ nhấn mạnh và tạo nhịp điệu. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Từ “giai điệu” trong nhan đề bài học mang nghĩa bóng về nhịp điệu cảm xúc.", "b) “Tôi yêu Sài Gòn từ những điều bình dị nhất...” là câu văn giàu chất tùy bút.", "c) Tùy bút không sử dụng bất kì biện pháp tu từ nào.", "d) Tình yêu quê hương trong Bài 4 được thể hiện qua nhiều vùng miền."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: cảm xúc tự do, liệt kê, hình ảnh gợi cảm. c) Sai: tùy bút dùng nhiều biện pháp tu từ. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) nêu cảm nghĩ của em về ý kiến: “Yêu quê hương là yêu từ những điều bình dị nhất.”", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: đồng tình với ý kiến.\n- Thân đoạn: lí giải — tình yêu lớn bắt nguồn từ những điều nhỏ bé, gần gũi (con đường, mái nhà, tiếng rao...); dẫn chứng từ “Sài Gòn tôi yêu” và trải nghiệm bản thân.\n- Kết đoạn: bài học — biết trân trọng những điều bình dị quanh mình.\nChấm theo: lập luận thuyết phục, có dẫn chứng, liên hệ bản thân."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn ngắn (5 – 7 câu) giới thiệu một khái niệm khoa học em yêu thích, trong đó có sử dụng ít nhất hai thuật ngữ và giải thích rõ nghĩa của chúng.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Giới thiệu khái niệm (ví dụ: quang hợp, hệ sinh thái, ẩn dụ...).\n- Sử dụng ít nhất 2 thuật ngữ đúng lĩnh vực, chính xác.\n- Giải thích nghĩa của thuật ngữ bằng lời văn dễ hiểu.\nChấm theo: đủ 2 thuật ngữ, giải thích đúng, diễn đạt mạch lạc, đúng số câu."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Xét về nghĩa, từ ngữ tiếng Việt thường có mấy lớp nghĩa cơ bản?", "options": ["A. Hai lớp: nghĩa đen và nghĩa bóng.", "B. Không có lớp nghĩa nào cả.", "C. Một lớp nghĩa duy nhất, không thay đổi.", "D. Ba lớp nghĩa cố định cho mọi từ."], "answer": "A", "explain": "Từ ngữ thường có nghĩa đen (gốc) và có thể phát triển thêm nghĩa bóng (nghĩa chuyển) trong quá trình sử dụng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cụm từ “Giai điệu đất nước” gợi cho em liên tưởng gì?", "options": ["A. Tiếng ồn ào, náo nhiệt của phố thị.", "B. Tình yêu quê hương, đất nước ngân lên như một bản nhạc đẹp.", "C. Âm thanh của chiến tranh năm xưa.", "D. Một bài hát cụ thể đã được phổ nhạc."], "answer": "B", "explain": "“Giai điệu đất nước” là cách nói hình ảnh: tình yêu quê hương ngân lên tha thiết như một bản nhạc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong “Sài Gòn tôi yêu”, tác giả thể hiện tình yêu Sài Gòn qua những phương diện nào?", "options": ["A. Qua những cuộc chiến tranh trong quá khứ.", "B. Qua cảnh vật, nhịp sống và con người thành phố.", "C. Chỉ qua các món ăn đặc sản.", "D. Chỉ qua các công trình kiến trúc cổ."], "answer": "B", "explain": "Minh Hương yêu Sài Gòn qua cảnh vật, nhịp sống sôi động và đặc biệt là con người chân tình nơi đây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Hà Nội mùa thu, cây cơm nguội vàng, cây bàng lá đỏ”, tác giả đã dùng biện pháp gì là chính?", "options": ["A. Liệt kê các loại cây kết hợp miêu tả màu sắc đặc trưng.", "B. Chơi chữ.", "C. Nói giảm, nói tránh.", "D. Nói quá sự thật."], "answer": "A", "explain": "Câu văn kể ra các loại cây (cơm nguội, bàng) cùng màu lá đặc trưng — vừa liệt kê vừa miêu tả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “giai điệu” trong nhan đề bài học được hiểu theo nghĩa bóng là gì?", "options": ["A. Âm thanh của nhạc cụ dân tộc.", "B. Một bản nhạc cụ thể đã được phổ biến.", "C. Nhịp điệu cảm xúc tha thiết của tình yêu quê hương, đất nước.", "D. Tiếng ồn của thành phố."], "answer": "C", "explain": "“Giai điệu” ở đây mang nghĩa bóng: nhịp điệu cảm xúc của tình yêu đất nước ngân lên tha thiết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để viết tốt một đoạn văn theo phong cách tản văn, học sinh cần điều gì?", "options": ["A. Viết thật dài, càng dài càng tốt.", "B. Dùng thật nhiều từ ngữ khó hiểu.", "C. Học thuộc lòng nhiều công thức có sẵn.", "D. Quan sát tinh tế, cảm xúc chân thành và ngôn ngữ gợi cảm."], "answer": "D", "explain": "Tản văn hay cần sự quan sát tinh tế, cảm xúc chân thành và ngôn ngữ giàu sức gợi.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người đọc tùy bút cần nắm bắt cảm xúc tác giả qua hình ảnh, ngôn ngữ.", "b) “Sài Gòn tôi yêu” chỉ viết về ẩm thực Sài Gòn.", "c) Viết tản văn hay cần cảm xúc chân thành và quan sát tinh tế.", "d) Nghĩa của từ cần được hiểu trong ngữ cảnh cụ thể."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: tác phẩm viết về cảnh vật, nhịp sống và con người. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tùy bút và tản văn đều có hình ảnh “tôi” trữ tình bộc lộ cảm xúc.", "b) “Quang hợp” và “điệp ngữ” đều là thuật ngữ, nhưng thuộc hai lĩnh vực khác nhau.", "c) Câu “Trời hôm nay nắng đẹp” có sử dụng điệp ngữ.", "d) Bài 4 bồi dưỡng tình yêu quê hương và ý thức giữ gìn vẻ đẹp các vùng miền."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: sinh học và văn học. c) Sai: câu này không lặp từ ngữ có chủ đích. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) tả cảnh quê hương em vào một buổi sáng đẹp trời, có sử dụng điệp ngữ và liệt kê.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Miêu tả cảnh buổi sáng qua hình ảnh, âm thanh, màu sắc, hương vị.\n- Có sử dụng điệp ngữ (lặp từ có chủ đích) và liệt kê (kể hàng loạt sự vật cùng loại).\n- Gửi gắm cảm xúc yêu mến quê hương.\nChấm theo: đủ 2 biện pháp, hình ảnh sinh động, cảm xúc chân thành."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 chữ) cảm nhận về giọng điệu tâm tình, thủ thỉ trong các văn bản tùy bút, tản văn đã học (lấy dẫn chứng cụ thể).", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Nêu đặc điểm giọng điệu: tâm tình, thủ thỉ như lời tâm sự với người thân.\n- Dẫn chứng: cách xưng hô, câu văn ngắn dài xen kẽ, từ ngữ thân mật, điệp ngữ...\n- Tác dụng: tạo sự gần gũi, khiến người đọc đồng cảm, tin yêu.\nChấm theo: có dẫn chứng cụ thể, phân tích được tác dụng của giọng điệu."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Biện pháp tu từ nào thường được dùng nhiều trong tùy bút, tản văn?", "options": ["A. Không dùng bất kì biện pháp tu từ nào.", "B. Chỉ dùng phép nói giảm, nói tránh.", "C. So sánh, nhân hóa, điệp ngữ, liệt kê.", "D. Chỉ dùng duy nhất phép chơi chữ."], "answer": "C", "explain": "Tùy bút, tản văn giàu chất thơ nên thường dùng so sánh, nhân hóa, điệp ngữ, liệt kê để tăng sức gợi cảm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Văn bản tản văn về Hà Nội, miền quê thường gửi gắm cảm xúc gì?", "options": ["A. Nỗi sợ hãi trước thiên nhiên dữ dội.", "B. Nỗi nhớ quê hương và tình yêu với vẻ đẹp bình dị của làng quê, phố cổ.", "C. Sự chê bai, coi thường quê hương.", "D. Ước muốn rời xa quê hương mãi mãi."], "answer": "B", "explain": "Tản văn về Hà Nội, miền quê gửi gắm nỗi nhớ và tình yêu với vẻ đẹp bình dị, mộc mạc của quê hương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Học Bài 4 “Giai điệu đất nước” giúp chúng ta bồi dưỡng tình cảm gì?", "options": ["A. Sự vô cảm trước cái đẹp của cuộc sống.", "B. Tình yêu quê hương, đất nước và ý thức giữ gìn vẻ đẹp các vùng miền.", "C. Thái độ thờ ơ, lạnh nhạt với quê hương.", "D. Tính ích kỉ, chỉ nghĩ cho bản thân."], "answer": "B", "explain": "Bài học bồi dưỡng tình yêu quê hương, đất nước và ý thức trân trọng, giữ gìn vẻ đẹp của mọi miền Tổ quốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thái độ của tác giả trong “Sài Gòn tôi yêu” trước sự đổi thay của thành phố là gì?", "options": ["A. Yêu cả những đổi thay, tin vào sức sống vươn lên của thành phố.", "B. Chán ghét mọi sự thay đổi.", "C. Thờ ơ, không quan tâm.", "D. Muốn thành phố mãi không thay đổi."], "answer": "A", "explain": "Tình yêu của Minh Hương là tình yêu trọn vẹn: yêu cả những đổi thay và tin vào sức sống của Sài Gòn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu văn nào dưới đây thể hiện rõ nhất chất “tùy bút”?", "options": ["A. Dân số thành phố là hơn 9 triệu người.", "B. Tôi yêu Sài Gòn từ những điều bình dị nhất: mùi cà phê sáng, tiếng rao đêm, nụ cười của người xa lạ.", "C. Hôm qua, lúc 7 giờ, tôi đi học.", "D. Sài Gòn có diện tích khoảng 2.061 km vuông."], "answer": "B", "explain": "Câu D ghi lại cảm xúc tự do, dùng liệt kê và ngôn ngữ giàu hình ảnh — đúng chất tùy bút.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điệp cấu trúc câu “Tôi yêu... Tôi yêu... Tôi yêu...” có tác dụng gì?", "options": ["A. Chỉ để tăng số lượng câu trong bài.", "B. Làm văn bản thiếu mạch lạc.", "C. Tạo nhịp điệu dồn dập, nhấn mạnh tình cảm sâu đậm, tha thiết.", "D. Làm người đọc nhàm chán, không có tác dụng."], "answer": "C", "explain": "Điệp cấu trúc tạo nhịp điệu dồn dập, nhấn mạnh và khắc sâu tình cảm tha thiết của tác giả.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong “Sài Gòn tôi yêu”, nhịp sống sôi động của thành phố cũng là đối tượng được yêu mến.", "b) Tản văn miền quê thường bắt nguồn từ kỉ niệm tuổi thơ.", "c) Liệt kê có tác dụng che giấu ý nghĩa câu văn.", "d) Điệp ngữ “nhớ” nhấn mạnh nỗi nhớ sâu đậm về quê hương."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: liệt kê diễn tả đầy đủ, tạo ấn tượng mạnh. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Văn bản “Mùa thu của em” không liên quan đến đề tài quê hương.", "b) Giọng điệu tâm tình giúp tùy bút gần gũi như lời tâm sự.", "c) Thuật ngữ “tùy bút” thuộc lĩnh vực văn học.", "d) Phép liệt kê tạo nhịp điệu rộn ràng cho câu văn."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: mùa thu Hà Nội chính là một “giai điệu” của đất nước. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150 – 200 chữ) bàn về ý nghĩa của việc đọc tùy bút, tản văn đối với đời sống tâm hồn con người.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Mở đoạn: nêu vấn đề — đời sống tâm hồn cần được nuôi dưỡng.\n- Thân đoạn: tùy bút, tản văn giúp ta biết rung động trước cái đẹp, biết yêu quê hương, sống chậm lại và quan sát cuộc sống, làm giàu cảm xúc và ngôn ngữ.\n- Kết đoạn: lời khuyên — hãy dành thời gian đọc và cảm nhận.\nChấm theo: lập luận rõ, có dẫn chứng từ bài học, diễn đạt giàu cảm xúc."}, {"type": "essay", "level": "VDC", "q": "Hãy tưởng tượng em là một du khách lần đầu đến Sài Gòn. Viết đoạn văn theo phong cách tản văn (khoảng 150 chữ) ghi lại ấn tượng đầu tiên của em về thành phố này.", "points": 0, "explain": "Gợi ý dàn ý cho GV chấm:\n- Ấn tượng đầu tiên: cảnh vật, nhịp sống, con người qua cái nhìn mới mẻ.\n- Ghi lại cảm xúc tự do, hình ảnh cụ thể, sinh động; có thể dùng so sánh, liệt kê, điệp ngữ.\n- Kết: cảm xúc đọng lại, mong muốn quay lại.\nChấm theo: đúng chất tản văn, góc nhìn mới mẻ, hình ảnh sinh động, cảm xúc chân thành."}]}]}
