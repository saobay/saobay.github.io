 là truyện ngắn nổi tiếng của Thanh Tịnh (1911–1988), mang đậm màu sắc hồi kí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu văn “lòng tôi đang có sự thay đổi lớn: Hôm nay tôi đi học.” sử dụng nghệ thuật gì?", "options": ["A. Miêu tả ngoại hình nhân vật.", "B. Độc thoại nội tâm, trực tiếp bộc lộ cảm xúc.", "C. Đối thoại giữa hai nhân vật.", "D. Liệt kê sự việc."], "answer": "B", "explain": "Đây là lời độc thoại nội tâm: nhân vật trực tiếp nói lên cảm xúc của mình trước giờ phút trọng đại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao người lính trong “Gặp lá cơm nếp” lại nhớ mùi cơm nếp bình dị chứ không phải món ăn cao sang?", "options": ["A. Vì anh chưa từng được ăn món cao sang.", "B. Vì mùi cơm nếp gắn với bàn tay mẹ, với quê hương — những gì thiêng liêng nhất.", "C. Vì anh đang rất đói.", "D. Vì đồng đội của anh thích món đó."], "answer": "B", "explain": "Mùi cơm nếp là mùi của mẹ, của quê hương bình dị mà thiêng liêng — thứ nâng đỡ tâm hồn người lính giữa gian khổ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong “Gặp lá cơm nếp”, mùi cơm nếp tượng trưng cho điều gì?", "options": ["A. Sự giàu sang, sung túc.", "B. Tình mẫu tử và tình yêu quê hương.", "C. Nỗi buồn chiến tranh.", "D. Khát vọng chiến thắng."], "answer": "B", "explain": "Mùi cơm nếp gợi nhớ mẹ, nhớ quê — là biểu tượng của tình mẫu tử và tình yêu quê hương.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Gặp lá cơm nếp” là bài thơ năm chữ của Thanh Thảo.", "b) Người lính nhớ mẹ da diết khi bắt gặp mùi lá cơm nếp.", "c) Bài thơ ca ngợi những chiến công oanh liệt ngoài mặt trận.", "d) Mùi cơm nếp tượng trưng cho tình mẫu tử và tình yêu quê hương."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: mùi thơm bình dị đánh thức nỗi nhớ mẹ. c) Sai: bài thơ là khúc ca về tình mẹ, tình quê chứ không ca ngợi chiến công. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Vừa nhắm mắt vừa mở cửa sổ” là tác phẩm của Nguyễn Ngọc Thuần.", "b) Người bố dạy con nhắm mắt để cảm nhận khu vườn bằng tai, mũi và đôi tay.", "c) Truyện phê phán cách dạy con của người bố.", "d) Truyện ca ngợi tình cha con và vẻ đẹp bình dị của cuộc sống."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: đó là “món quà” đặc biệt của người bố. c) Sai: truyện ngợi ca cách dạy con tinh tế, đầy yêu thương. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về hình ảnh người mẹ trong “Tôi đi học” của Thanh Tịnh.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: vai trò của người mẹ trong truyện. Thân đoạn: chi tiết bàn tay mẹ dắt con, lời an ủi dỗ dành; người mẹ là điểm tựa bình yên, biểu tượng tình mẫu tử. Kết đoạn: liên hệ tình cảm với mẹ của mình. Tiêu chí chấm: có dẫn chứng, phân tích được ý nghĩa hình ảnh bàn tay mẹ."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về nhân vật ông đốc trong “Tôi đi học”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu nhân vật ông đốc. Thân đoạn: tính cách hiền từ, bao dung; tác dụng xoa dịu nỗi sợ của học trò mới, tạo không khí ấm áp ngày khai trường. Kết đoạn: suy nghĩ về hình ảnh người thầy đầu đời. Tiêu chí chấm: nêu được tính cách qua chi tiết, đánh giá được ý nghĩa nhân vật."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Truyện “Tôi đi học” được in trong tập truyện nào?", "options": ["A. “Quê mẹ”.", "B. “Tắt đèn”.", "C. “Số đỏ”.", "D. “Lều chõng”."], "answer": "A", "explain": "“Tôi đi học” in trong tập “Quê mẹ” (1941) của Thanh Tịnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Tôi đi học” kể lại kỉ niệm nào của nhân vật “tôi”?", "options": ["A. Kỉ niệm ngày đầu tiên đến trường.", "B. Kỉ niệm chuyến đi chơi xa cùng bạn bè.", "C. Kỉ niệm ngày Tết ở quê.", "D. Kỉ niệm lần đầu đi chợ với mẹ."], "answer": "A", "explain": "Truyện kể lại kỉ niệm ngày đầu tiên đến trường với bao cảm xúc hồi hộp, bỡ ngỡ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong “Tôi đi học”, ai dắt nhân vật “tôi” đến trường?", "options": ["A. Bố.", "B. Ông nội.", "C. Mẹ.", "D. Anh trai."], "answer": "C", "explain": "Nhân vật “tôi” được mẹ dắt tay đến trường trong buổi mai đầy sương thu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc nhắm mắt lại giúp nhân vật trong “Vừa nhắm mắt vừa mở cửa sổ” nhận ra điều gì?", "options": ["A. Bóng tối thật đáng sợ.", "B. Thế giới xung quanh phong phú qua các giác quan; vẻ đẹp nằm trong những điều bình dị.", "C. Mình bị cận thị.", "D. Khu vườn không có gì đặc biệt."], "answer": "B", "explain": "Nhắm mắt lại, cậu bé nghe được tiếng chim, ngửi được mùi hoa — nhận ra vẻ đẹp bình dị quanh mình mà mắt thường bỏ qua.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tình cha con trong “Vừa nhắm mắt vừa mở cửa sổ” thể hiện qua điều gì?", "options": ["A. Người bố mua cho con nhiều đồ chơi đắt tiền.", "B. Người bố dạy con cách cảm nhận cuộc sống tinh tế, đầy yêu thương.", "C. Người bố nghiêm khắc phạt con.", "D. Người bố đi làm xa gửi tiền về."], "answer": "B", "explain": "Tình cha thể hiện qua cách dạy con đầy yêu thương và tinh tế: dạy con biết lắng nghe, biết rung động trước vẻ đẹp đời thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa hồi kí và tự truyện là gì?", "options": ["A. Hồi kí ghi lại một sự việc, một giai đoạn đáng nhớ; tự truyện kể lại toàn bộ cuộc đời.", "B. Hồi kí là hư cấu, tự truyện là có thật.", "C. Hồi kí viết bằng thơ, tự truyện viết bằng văn xuôi.", "D. Không có điểm khác nhau nào."], "answer": "A", "explain": "Hồi kí thường tập trung vào một sự việc, một giai đoạn; tự truyện kể lại cuộc đời mình một cách có hệ thống, đầy đủ hơn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Học sinh”, “kỉ niệm” là những từ Hán Việt.", "b) “Đi học”, “dắt tay” là những từ thuần Việt.", "c) Từ Hán Việt thường mang sắc thái trang trọng.", "d) “Song thân” là từ Hán Việt có nghĩa là thầy cô."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: từ Hán Việt thường trang trọng, khái quát. d) Sai: “song thân” nghĩa là cha mẹ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Dấu chấm lửng còn được gọi là dấu ba chấm.", "b) Trong liệt kê, dấu chấm lửng tỏ ý còn nhiều sự vật chưa liệt kê hết.", "c) Dấu chấm lửng có thể thể hiện lời nói bỏ dở, nghẹn ngào.", "d) Dấu chấm lửng được dùng để kết thúc câu kể."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: ví dụ “Vườn nhà có ổi, khế, na…”. c) Đúng: ví dụ “Mẹ ơi…”. d) Sai: kết thúc câu kể là nhiệm vụ của dấu chấm.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) phân tích ý nghĩa của chi tiết con đường làng trong “Tôi đi học”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: vị trí chi tiết trong truyện. Thân đoạn: con đường quen bỗng lạ — nghệ thuật lấy cảnh ngụ tình, cảnh vật nhuốm màu tâm trạng bỡ ngỡ; con đường còn là hình ảnh quê hương thân thuộc. Kết đoạn: giá trị nghệ thuật của chi tiết. Tiêu chí chấm: chỉ ra được nghệ thuật “cảnh ngụ tình”, diễn đạt rõ ràng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về nỗi nhớ mẹ của người lính trong “Gặp lá cơm nếp” của Thanh Thảo.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: hoàn cảnh người lính xa quê. Thân đoạn: mùi lá cơm nếp đánh thức nỗi nhớ — nhớ bàn tay mẹ, bữa cơm Tết; tình mẫu tử thiêng liêng nâng đỡ người lính. Kết đoạn: cảm xúc của bản thân về tình mẹ. Tiêu chí chấm: bám sát hình ảnh “mùi cơm nếp”, cảm xúc chân thành."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Ông đốc trong “Tôi đi học” hiện lên với tính cách như thế nào?", "options": ["A. Nghiêm khắc, khó tính.", "B. Hiền từ, bao dung.", "C. Vui tính, hài hước.", "D. Lạnh lùng, xa cách."], "answer": "B", "explain": "Ông đốc hiền từ đón học trò mới, giúp xoa dịu nỗi lo sợ của các cậu bé ngày đầu đến trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả bài thơ “Gặp lá cơm nếp” là ai?", "options": ["A. Thanh Tịnh.", "B. Nguyễn Khoa Điềm.", "C. Thanh Thảo.", "D. Hoàng Trung Thông."], "answer": "C", "explain": "“Gặp lá cơm nếp” là bài thơ của Thanh Thảo (sinh 1946), nhà thơ trưởng thành trong kháng chiến chống Mỹ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài thơ “Gặp lá cơm nếp” được viết theo thể thơ nào?", "options": ["A. Lục bát.", "B. Thơ năm chữ.", "C. Thơ tám chữ.", "D. Thơ tự do."], "answer": "B", "explain": "“Gặp lá cơm nếp” là bài thơ năm chữ với nhịp điệu gọn gàng, thiết tha.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Kỉ niệm ngày đầu đến trường thật thiêng liêng.”, từ Hán Việt là những từ nào?", "options": ["A. Ngày, đầu, đến, trường.", "B. Kỉ niệm, thiêng liêng.", "C. Thật, đến, trường.", "D. Ngày, thật, đến."], "answer": "B", "explain": "“Kỉ niệm” và “thiêng liêng” là từ Hán Việt; các từ còn lại là thuần Việt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “bỡ ngỡ” trong văn cảnh “Tôi đi học” có nghĩa là gì?", "options": ["A. Vui vẻ, phấn khởi.", "B. Lạ lẫm, chưa quen với cái mới.", "C. Buồn bã, thất vọng.", "D. Tức giận, khó chịu."], "answer": "B", "explain": "Trong văn cảnh ngày đầu đến trường, “bỡ ngỡ” diễn tả cảm giác lạ lẫm, chưa quen của cậu bé trước ngôi trường mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu chấm lửng trong câu “Mẹ ơi…” — cậu bé nghẹn ngào có tác dụng gì?", "options": ["A. Tỏ ý còn nhiều sự vật chưa liệt kê hết.", "B. Thể hiện lời nói bỏ dở, nghẹn ngào vì xúc động.", "C. Kết thúc câu kể.", "D. Ngăn cách hai vế câu."], "answer": "B", "explain": "Dấu chấm lửng ở đây thể hiện lời nói bỏ dở, nghẹn ngào — cậu bé xúc động đến nghẹn lời.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Tôi đi học” sử dụng ngôi kể thứ nhất, xưng “tôi”.", "b) Truyện kết hợp kể, tả và biểu cảm.", "c) Câu “Hôm nay tôi đi học.” là lời đối thoại giữa nhân vật “tôi” và ông đốc.", "d) Truyện miêu tả tâm lí nhân vật “tôi” rất tinh tế."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đó là lời độc thoại nội tâm, nhân vật tự bộc bạch cảm xúc. d) Đúng: từng rung động nhỏ đều được ghi lại.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Gặp lá cơm nếp” có thể thơ năm chữ với nhịp điệu gọn gàng.", "b) Hình ảnh thơ trong bài rất giản dị: lá cơm nếp, mùi xôi, bàn tay mẹ.", "c) Giọng điệu bài thơ hài hước, vui nhộn.", "d) Bài thơ là khúc ca về tình mẫu tử và tình yêu quê hương."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: giọng thơ thiết tha, sâu lắng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) kể về một món ăn, mùi vị quê hương gợi cho em nỗi nhớ khi xa nhà.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu món ăn, mùi vị. Thân đoạn: kỉ niệm gắn với món ăn (ai nấu, dịp nào), cảm xúc khi nhớ về; kết hợp tả và biểu cảm. Kết đoạn: ý nghĩa của mùi vị quê hương. Tiêu chí chấm: chi tiết cụ thể, giàu cảm xúc, ngôi thứ nhất."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về tình cha con trong “Vừa nhắm mắt vừa mở cửa sổ” của Nguyễn Ngọc Thuần.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu tác phẩm. Thân đoạn: người bố dạy con cảm nhận vườn bằng các giác quan — tình yêu thương tinh tế; người con dần hiểu cha. Kết đoạn: liên hệ tình cảm cha con của mình. Tiêu chí chấm: phân tích được “món quà” của người bố, cảm xúc chân thành."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Người lính trong “Gặp lá cơm nếp” nhớ về ai khi bắt gặp mùi lá cơm nếp?", "options": ["A. Nhớ người yêu.", "B. Nhớ mẹ.", "C. Nhớ người thầy cũ.", "D. Nhớ đồng đội."], "answer": "B", "explain": "Mùi lá cơm nếp gợi trong anh nỗi nhớ mẹ da diết, nhớ những ngày Tết đầm ấm bên gia đình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mùi vị nào đã đánh thức nỗi nhớ quê trong “Gặp lá cơm nếp”?", "options": ["A. Mùi cơm nếp.", "B. Mùi cà phê.", "C. Mùi thuốc súng.", "D. Mùi hoa sữa."], "answer": "A", "explain": "Mùi thơm bình dị của lá cơm nếp làm sống dậy cả một “bầu trời tuổi thơ” với mẹ và quê hương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả “Vừa nhắm mắt vừa mở cửa sổ” là ai?", "options": ["A. Nguyễn Ngọc Thuần.", "B. Thanh Tịnh.", "C. Tô Hoài.", "D. Võ Quảng."], "answer": "A", "explain": "Nguyễn Ngọc Thuần (sinh 1972) là nhà văn chuyên viết cho thiếu nhi với giọng văn hồn nhiên, trong sáng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao tác giả hồi kí thường chọn ngôi kể thứ nhất xưng “tôi”?", "options": ["A. Vì ngôi thứ nhất dễ viết hơn.", "B. Vì người kể chính là người trong cuộc, tạo sự chân thực, gần gũi như lời tâm sự.", "C. Vì ngôi thứ ba đã lỗi thời.", "D. Vì độc giả yêu cầu."], "answer": "B", "explain": "Ngôi thứ nhất giúp người kể trực tiếp giãi bày, tạo cảm giác chân thực như đang tâm sự với người đọc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết bàn tay mẹ dắt tay con đến trường gợi cho em cảm nhận gì?", "options": ["A. Sự che chở, yêu thương, là điểm tựa bình yên của con.", "B. Sự nghiêm khắc của mẹ.", "C. Mẹ không tin tưởng con.", "D. Không gợi cảm nhận gì."], "answer": "A", "explain": "Bàn tay mẹ là biểu tượng của sự che chở, yêu thương — điểm tựa giúp con vững bước vào đời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhan đề “Bầu trời tuổi thơ” gợi liên tưởng gì?", "options": ["A. Bầu trời đầy sao ban đêm.", "B. Thế giới kỉ niệm trong sáng, bao la của tuổi thơ.", "C. Môn thiên văn học.", "D. Những chuyến bay xa."], "answer": "B", "explain": "“Bầu trời” gợi sự bao la, trong trẻo — ẩn dụ cho thế giới kỉ niệm đẹp đẽ của tuổi thơ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Cùng một từ, đặt trong văn cảnh khác nhau có thể mang nghĩa khác nhau.", "b) Muốn hiểu đúng nghĩa của từ phải đọc kĩ cả câu, cả đoạn văn.", "c) Từ “bỡ ngỡ” trong “Tôi đi học” có nghĩa là vui sướng, phấn khởi.", "d) Khi nhận xét văn chương, “xúc động” nghĩa là gợi cảm xúc chân thành, lay động lòng người."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đó là lí do phải xét nghĩa của từ trong văn cảnh. b) Đúng. c) Sai: “bỡ ngỡ” nghĩa là lạ lẫm, chưa quen. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Người bố trong “Vừa nhắm mắt vừa mở cửa sổ” đã tặng con khu vườn của gia đình.", "b) Cậu bé khám phá khu vườn bằng tai nghe, mũi ngửi và tay sờ khi nhắm mắt.", "c) Cậu bé cảm thấy khu vườn chẳng có gì đặc biệt.", "d) Nhan đề truyện gợi ý về việc “mở cửa sổ tâm hồn” để đón nhận vẻ đẹp cuộc sống."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cậu bé phát hiện thế giới phong phú đến bất ngờ. d) Đúng: nhắm mắt thật để mở cửa sổ tâm hồn.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu bài học em rút ra từ truyện “Vừa nhắm mắt vừa mở cửa sổ”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu câu chuyện. Thân đoạn: bài học — hạnh phúc ở những điều bình dị, hãy cảm nhận cuộc sống bằng cả tâm hồn; dẫn chứng chi tiết nhắm mắt nghe chim, ngửi hoa. Kết đoạn: em sẽ áp dụng bài học ra sao. Tiêu chí chấm: rút ra được bài học sâu sắc, có liên hệ bản thân."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) kể về một kỉ niệm tuổi thơ đáng nhớ nhất của em.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu kỉ niệm. Thân đoạn: kể diễn biến với chi tiết cụ thể, kết hợp tả cảnh, tả người và bộc lộ cảm xúc (đúng tinh thần hồi kí). Kết đoạn: kỉ niệm còn đọng lại điều gì. Tiêu chí chấm: ngôi thứ nhất, chi tiết chân thực, cảm xúc rõ ràng."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Người bố trong “Vừa nhắm mắt vừa mở cửa sổ” dạy con cảm nhận khu vườn bằng cách nào?", "options": ["A. Chụp ảnh từng góc vườn.", "B. Nhắm mắt lại, dùng tai nghe, mũi ngửi và tay sờ.", "C. Vẽ tranh về khu vườn.", "D. Đọc sách về các loài cây."], "answer": "B", "explain": "Người bố dạy con nhắm mắt để nghe tiếng chim, ngửi mùi hoa, sờ thân cây — cảm nhận thế giới bằng các giác quan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ Hán Việt là những từ như thế nào?", "options": ["A. Từ thuần Việt có từ xa xưa.", "B. Từ mượn của tiếng Hán, đã được Việt hóa.", "C. Từ mượn của tiếng Anh, tiếng Pháp.", "D. Từ láy tượng thanh, tượng hình."], "answer": "B", "explain": "Từ Hán Việt là từ mượn của tiếng Hán, đã được Việt hóa, ví dụ: học sinh, kỉ niệm, quê hương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ nào sau đây là từ Hán Việt?", "options": ["A. Đi học.", "B. Dắt tay.", "C. Học sinh.", "D. Con đường."], "answer": "C", "explain": "“Học sinh” là từ Hán Việt; “đi học”, “dắt tay”, “con đường” là từ thuần Việt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “thiêng liêng” trong câu “Kỉ niệm ngày đầu đến trường thật thiêng liêng.” thuộc loại từ nào?", "options": ["A. Từ thuần Việt.", "B. Từ Hán Việt.", "C. Từ mượn tiếng Anh.", "D. Từ láy tượng hình."], "answer": "B", "explain": "“Thiêng liêng” là từ Hán Việt, mang sắc thái trang trọng, cao quý.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ thuần Việt tương ứng với từ Hán Việt “tựu trường” là gì?", "options": ["A. Ngày khai trường.", "B. Ngày nghỉ.", "C. Ngày thi.", "D. Ngày lễ."], "answer": "A", "explain": "“Tựu trường” (Hán Việt) tương ứng với cách nói thuần Việt “ngày khai trường”, “ngày đến trường”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Giọng văn của Thanh Tịnh thật xúc động.”, từ “xúc động” được hiểu như thế nào?", "options": ["A. Làm rung chuyển mạnh.", "B. Gợi cảm xúc chân thành, làm lay động lòng người.", "C. Gây sốc, bất ngờ.", "D. Làm cho tức giận."], "answer": "B", "explain": "Trong văn cảnh nhận xét văn chương, “xúc động” nghĩa là gợi cảm xúc chân thành, lay động lòng người đọc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hồi kí đòi hỏi tính xác thực của sự việc được kể.", "b) Truyện ngắn có thể hư cấu hoàn toàn do tác giả tưởng tượng.", "c) Hồi kí không bao giờ sử dụng ngôi kể thứ nhất.", "d) Tự truyện kể lại toàn bộ cuộc đời, còn hồi kí thường chỉ ghi lại một sự việc, một giai đoạn đáng nhớ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: hồi kí thường dùng ngôi thứ nhất xưng “tôi”. d) Đúng: đó là điểm khác nhau cơ bản giữa hai thể loại.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Buổi tựu trường trong “Tôi đi học” diễn ra vào một buổi mai mùa thu.", "b) Con đường làng “bỗng trở nên lạ” vì lòng nhân vật đang bỡ ngỡ, hồi hộp.", "c) Nhân vật “tôi” hoàn toàn tự tin, không chút lo sợ nào.", "d) Bàn tay mẹ dắt con là điểm tựa bình yên, ấm áp."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: “buổi mai đầy sương thu và gió lạnh”. b) Đúng: cảnh vật nhuốm màu tâm trạng. c) Sai: nhân vật xen lẫn “lo sợ vẩn vơ”. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận chung của em về “bầu trời tuổi thơ” qua ba văn bản đã học trong Bài 1.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giải thích “bầu trời tuổi thơ”. Thân đoạn: mỗi văn bản một mảnh kí ức — ngày đến trường, nhớ mẹ, tình cha con; điểm chung là cảm xúc chân thành, trong sáng. Kết đoạn: “bầu trời tuổi thơ” của riêng em. Tiêu chí chấm: bao quát được cả ba văn bản, có cảm nhận riêng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) bày tỏ tình cảm của em dành cho mẹ.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: tình cảm chung. Thân đoạn: kỉ niệm cụ thể về mẹ (chăm sóc, hy sinh), chi tiết giàu cảm xúc; bộc lộ lòng biết ơn. Kết đoạn: lời hứa, mong ước. Tiêu chí chấm: chân thành, có chi tiết cụ thể, tránh sáo rỗng."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Từ “song thân” có nghĩa là gì?", "options": ["A. Hai anh em.", "B. Cha mẹ.", "C. Thầy trò.", "D. Bạn bè."], "answer": "B", "explain": "“Song thân” là từ Hán Việt, “song” là hai, “thân” là thân thích — chỉ cha mẹ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “tựu trường” có nghĩa là gì?", "options": ["A. Ngày nghỉ hè của học sinh.", "B. Ngày học sinh tập trung đến trường bắt đầu năm học mới.", "C. Ngày thi cuối năm.", "D. Ngày tổng kết năm học."], "answer": "B", "explain": "“Tựu trường” là từ Hán Việt chỉ ngày học sinh tựu về trường, bắt đầu năm học mới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu chấm lửng còn được gọi là gì?", "options": ["A. Dấu hai chấm.", "B. Dấu ba chấm.", "C. Dấu chấm than.", "D. Dấu chấm hỏi."], "answer": "B", "explain": "Dấu chấm lửng (…) còn gọi là dấu ba chấm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết “buổi mai đầy sương thu và gió lạnh” gợi không khí như thế nào?", "options": ["A. Nóng bức, oi ả.", "B. Trong trẻo, se lạnh, man mác buồn — rất hợp với tâm trạng bâng khuâng.", "C. Ảm đạm, đáng sợ.", "D. Náo nhiệt, ồn ào."], "answer": "B", "explain": "Sương thu, gió lạnh tạo không khí trong trẻo, se lạnh, man mác — hòa quyện với tâm trạng bâng khuâng của nhân vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nhân vật “tôi” lại thấy “lo sợ vẩn vơ” trong ngày đầu đến trường?", "options": ["A. Vì bị bạn bè bắt nạt.", "B. Vì lần đầu xa vòng tay mẹ, bước vào môi trường hoàn toàn mới lạ.", "C. Vì không thích đi học.", "D. Vì bị thầy cô phạt."], "answer": "B", "explain": "Nỗi lo sợ vẩn vơ của trẻ thơ đến từ việc lần đầu rời vòng tay mẹ, đối diện với thầy cô, bạn bè và trường lớp xa lạ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc kết hợp tả và kể trong hồi kí có tác dụng gì?", "options": ["A. Làm văn bản dài hơn.", "B. Vừa tái hiện sự việc, vừa làm nổi bật cảnh vật, con người và cảm xúc, tăng sức gợi cảm.", "C. Làm văn bản khó hiểu hơn.", "D. Không có tác dụng gì."], "answer": "B", "explain": "Kể tái hiện sự việc, tả làm sống động cảnh và người; kết hợp cả hai, hồi kí vừa chân thực vừa giàu cảm xúc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Phụ mẫu” là từ Hán Việt có nghĩa là cha mẹ.", "b) “Tựu trường” là từ Hán Việt.", "c) “Quê hương” là từ thuần Việt.", "d) “Tuổi thơ” là từ Hán Việt."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: “quê hương” là từ Hán Việt. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Trong câu “Vườn nhà có ổi, khế, na…”, dấu chấm lửng tỏ ý liệt kê chưa hết.", "b) Trong câu “Mẹ ơi…”, dấu chấm lửng thể hiện lời nói bỏ dở, nghẹn ngào.", "c) Trong câu “Buổi mai… sương thu… con đường làng…”, dấu chấm lửng làm giãn nhịp, gợi sự trầm lắng.", "d) Dấu chấm lửng và dấu chấm than có tác dụng hoàn toàn giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: dấu chấm than bộc lộ cảm xúc mạnh, dấu chấm lửng gợi bỏ dở, trầm lắng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) bày tỏ tình cảm của em dành cho cha.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: hình ảnh cha trong lòng em. Thân đoạn: kỉ niệm về sự thầm lặng, dạy dỗ của cha; tình cha sâu nặng theo cách riêng. Kết đoạn: lòng biết ơn và lời hứa. Tiêu chí chấm: cảm xúc chân thành, có chi tiết đời thường cụ thể."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) phân tích nghệ thuật độc thoại nội tâm trong “Tôi đi học” của Thanh Tịnh.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: khái niệm độc thoại nội tâm. Thân đoạn: dẫn chứng câu “lòng tôi đang có sự thay đổi lớn: Hôm nay tôi đi học.”; tác dụng — bộc lộ trực tiếp cảm xúc, tạo sự đồng cảm, chân thực. Kết đoạn: đánh giá giá trị nghệ thuật. Tiêu chí chấm: có dẫn chứng chính xác, phân tích được tác dụng."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Khi liệt kê, dấu chấm lửng có tác dụng gì?", "options": ["A. Kết thúc câu kể.", "B. Tỏ ý còn nhiều sự vật, hiện tượng chưa liệt kê hết.", "C. Ngăn cách các vế câu.", "D. Nhấn mạnh từ ngữ đứng trước."], "answer": "B", "explain": "Trong liệt kê, dấu chấm lửng tỏ ý còn nhiều sự việc chưa kể hết, ví dụ: “Vườn nhà có ổi, khế, na…”", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Buổi tựu trường trong “Tôi đi học” diễn ra vào mùa nào trong năm?", "options": ["A. Mùa xuân.", "B. Mùa hạ.", "C. Mùa thu.", "D. Mùa đông."], "answer": "C", "explain": "Truyện mở đầu bằng khung cảnh “buổi mai đầy sương thu và gió lạnh” — ngày tựu trường đầu thu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tâm trạng chính của nhân vật “tôi” trong ngày đầu đến trường là gì?", "options": ["A. Vui sướng, háo hức tuyệt đối.", "B. Hồi hộp, bỡ ngỡ xen lẫn lo sợ vẩn vơ.", "C. Buồn bã, chán nản.", "D. Tức giận, bực bội."], "answer": "B", "explain": "Nhân vật “tôi” vừa háo hức vừa hồi hộp, bỡ ngỡ trước ngôi trường mới, xen lẫn nỗi lo sợ vẩn vơ của trẻ thơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em hiểu thế nào về “sự thay đổi lớn” trong lòng nhân vật “tôi”?", "options": ["A. Cậu bé bị ốm.", "B. Cậu bé bước từ tuổi thơ vô tư sang một giai đoạn mới: trở thành học trò, có ý thức về bổn phận học tập.", "C. Cậu bé chuyển nhà.", "D. Cậu bé đổi tên."], "answer": "B", "explain": "“Sự thay đổi lớn” là bước ngoặt: từ đứa trẻ vô tư thành cậu học trò — bắt đầu hành trình khôn lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tên gọi “hồi kí” cho ta hiểu gì về thể loại này?", "options": ["A. “Hồi” là nhớ lại, “kí” là ghi chép — ghi lại những điều đã nhớ về quá khứ.", "B. “Hồi” là quay về, “kí” là chữ kí.", "C. “Hồi” là hồi hộp, “kí” là kì lạ.", "D. Tên gọi không mang ý nghĩa gì."], "answer": "A", "explain": "“Hồi” (nhớ lại) + “kí” (ghi chép): hồi kí là ghi lại những sự việc có thật trong quá khứ mà người kể còn nhớ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao “Gặp lá cơm nếp” là thơ nhưng vẫn gắn bó với mạch cảm xúc của hồi kí?", "options": ["A. Vì bài thơ cũng kể về chiến thắng.", "B. Vì bài thơ bộc lộ cảm xúc thật, nỗi nhớ thật của người lính — chân thành như lời tâm sự trong hồi kí.", "C. Vì bài thơ rất dài.", "D. Vì bài thơ viết về tương lai."], "answer": "B", "explain": "Bài thơ là tiếng lòng thật của người lính xa quê — nỗi nhớ mẹ, nhớ quê chân thành, xúc động như trong hồi kí.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Người lính trong “Gặp lá cơm nếp” đang xa quê, đối diện với gian khổ chiến trường.", "b) Mùi cơm nếp đã đánh thức cả một “bầu trời tuổi thơ” trong anh.", "c) Bài thơ thể hiện tình yêu quê hương tha thiết.", "d) Người lính đã quên hẳn gia đình khi ra trận."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ngược lại, nỗi nhớ mẹ, nhớ quê càng da diết hơn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Cả ba văn bản trong Bài 1 đều gắn với kí ức tuổi thơ.", "b) Cả ba văn bản đều sử dụng ngôi kể thứ ba.", "c) Cả ba văn bản đều chan chứa cảm xúc chân thành.", "d) Cả ba văn bản đều là truyện ngắn."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: ngày đến trường, nhớ mẹ, tình cha con. b) Sai: “Tôi đi học” và “Vừa nhắm mắt…” dùng ngôi thứ nhất; “Gặp lá cơm nếp” là thơ trữ tình. c) Đúng. d) Sai: “Gặp lá cơm nếp” là thơ.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) miêu tả một vẻ đẹp bình dị quanh em mà trước đây em ít để ý tới.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu đối tượng (góc vườn, con ngõ, buổi sớm…). Thân đoạn: miêu tả bằng nhiều giác quan (nhìn, nghe, ngửi, chạm) như cách học từ truyện; bộc lộ cảm xúc. Kết đoạn: suy ngẫm về vẻ đẹp bình dị. Tiêu chí chấm: miêu tả sinh động bằng nhiều giác quan, có cảm xúc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) bày tỏ tình yêu quê hương của em.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: quê hương trong lòng em. Thân đoạn: những hình ảnh, mùi vị, kỉ niệm gắn với quê hương; tình cảm gắn bó, tự hào. Kết đoạn: trách nhiệm của bản thân với quê hương. Tiêu chí chấm: hình ảnh cụ thể, cảm xúc chân thành, có suy nghĩ về trách nhiệm."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Chủ đề “Bầu trời tuổi thơ” gợi về điều gì?", "options": ["A. Những kỉ niệm đẹp của tuổi thơ.", "B. Những kiến thức khoa học vũ trụ.", "C. Những chuyến du lịch xa.", "D. Những trò chơi điện tử."], "answer": "A", "explain": "“Bầu trời tuổi thơ” là hình ảnh ẩn dụ cho thế giới kỉ niệm trong sáng, đẹp đẽ của tuổi thơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong hồi kí, người kể chuyện thường là ai?", "options": ["A. Người ngoài cuộc kể lại chuyện người khác.", "B. Chính người trong cuộc, xưng “tôi”.", "C. Nhiều người cùng kể xen kẽ.", "D. Không xác định được người kể."], "answer": "B", "explain": "Người kể hồi kí chính là người trong cuộc, dùng ngôi thứ nhất xưng “tôi” để kể chuyện thật của đời mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “kỉ niệm” thuộc loại từ gốc nào?", "options": ["A. Từ thuần Việt.", "B. Từ Hán Việt.", "C. Từ mượn tiếng Anh.", "D. Từ láy."], "answer": "B", "explain": "“Kỉ niệm” là từ Hán Việt (kỉ: nhớ, niệm: nghĩ), mang sắc thái trang trọng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tình mẫu tử trong “Gặp lá cơm nếp” được thể hiện qua chi tiết nào?", "options": ["A. Người lính được thăng chức.", "B. Mùi cơm nếp gợi nhớ bàn tay mẹ, bữa cơm gia đình ngày Tết.", "C. Người lính mua quà cho mẹ.", "D. Người lính viết thư về nhà."], "answer": "B", "explain": "Mùi cơm nếp bình dị đánh thức hình ảnh bàn tay mẹ, mái nhà xưa — tình mẫu tử thiêng liêng trong nỗi nhớ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài học sâu sắc từ “Vừa nhắm mắt vừa mở cửa sổ” là gì?", "options": ["A. Phải luôn nhắm mắt khi đi đường.", "B. Hạnh phúc nằm trong những điều bình dị; hãy biết cảm nhận cuộc sống bằng cả tâm hồn.", "C. Trẻ con không nên ra vườn.", "D. Chỉ cần học giỏi là đủ."], "answer": "B", "explain": "Truyện nhắn nhủ: vẻ đẹp và hạnh phúc ở quanh ta, trong những điều bình dị nhất — hãy cảm nhận bằng cả tâm hồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao truyện có tên “Vừa nhắm mắt vừa mở cửa sổ”?", "options": ["A. Vì nhân vật bị đau mắt.", "B. “Nhắm mắt” là nhắm mắt thật, “mở cửa sổ” là mở cửa sổ tâm hồn để đón nhận vẻ đẹp cuộc sống.", "C. Vì nhà nhân vật có nhiều cửa sổ.", "D. Tên truyện không có ý nghĩa."], "answer": "B", "explain": "Nhan đề giàu ý nghĩa: nhắm mắt thật lại để “mở cửa sổ tâm hồn” — cảm nhận thế giới bằng trái tim.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Nhân vật “tôi” cảm thấy “lòng đang có sự thay đổi lớn” trước ngày đến trường.", "b) Người mẹ đã an ủi, dỗ dành con trước cổng trường.", "c) Các bạn học sinh trong trường đều là người quen cũ của nhân vật.", "d) Ngày đầu đến trường là bước ngoặt đánh dấu sự khôn lớn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: tất cả đều xa lạ, bỡ ngỡ với cậu bé. d) Đúng: từ đứa trẻ vô tư thành cậu học trò.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Kỉ niệm”, “thiêng liêng” là những từ Hán Việt.", "b) “Bỡ ngỡ” là từ láy thuần Việt.", "c) Dấu chấm lửng chỉ có duy nhất một tác dụng.", "d) Nghĩa của từ ngữ phụ thuộc vào văn cảnh sử dụng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: dấu chấm lửng có nhiều tác dụng (liệt kê chưa hết, lời bỏ dở, giãn nhịp…). d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) so sánh cảm xúc ngày đầu đến trường của em với nhân vật “tôi” trong “Tôi đi học”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: điểm chung — đều hồi hộp, bỡ ngỡ. Thân đoạn: so sánh cụ thể (ai đưa đi, cảnh trường, cảm xúc), rút ra điểm giống và khác; lí giải. Kết đoạn: ý nghĩa của ngày đầu đến trường với mỗi người. Tiêu chí chấm: so sánh rõ giống, khác, có dẫn chứng từ truyện và trải nghiệm thật."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu cảm nhận của em về giọng điệu chân thành của hồi kí qua “Tôi đi học”.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giọng điệu là gì, vì sao hồi kí cần chân thành. Thân đoạn: dẫn chứng lời kể mộc mạc, chi tiết thật (con đường, bàn tay mẹ); tác dụng — tạo sự tin cậy, đồng cảm. Kết đoạn: bài học khi viết hồi kí. Tiêu chí chấm: hiểu đúng khái niệm giọng điệu, có dẫn chứng."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Từ “phụ mẫu” có nghĩa là gì?", "options": ["A. Vợ chồng.", "B. Cha mẹ.", "C. Anh em.", "D. Ông bà."], "answer": "B", "explain": "“Phụ mẫu” là từ Hán Việt chỉ cha mẹ, thường dùng trong văn cảnh trang trọng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu “lòng tôi đang có sự thay đổi lớn: Hôm nay tôi đi học.” là lời của ai?", "options": ["A. Lời người mẹ.", "B. Lời ông đốc.", "C. Lời bộc bạch của nhân vật “tôi”.", "D. Lời của bạn cùng lớp."], "answer": "C", "explain": "Đó là lời độc thoại nội tâm của nhân vật “tôi”, trực tiếp bộc lộ cảm xúc trước giờ phút trọng đại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Món quà đặc biệt người bố dành cho con trong “Vừa nhắm mắt vừa mở cửa sổ” gắn với điều gì?", "options": ["A. Một chiếc xe đạp mới.", "B. Khu vườn của gia đình.", "C. Một chuyến đi xa.", "D. Một bộ sách quý."], "answer": "B", "explain": "Người bố tặng con khu vườn — nơi con học cách cảm nhận thế giới bằng các giác quan và nhận ra vẻ đẹp bình dị quanh mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu chấm lửng trong câu “Buổi mai… sương thu… con đường làng…” có tác dụng gì?", "options": ["A. Liệt kê sự vật chưa hết.", "B. Làm giãn nhịp điệu, gợi sự trầm lắng, suy tư như dòng hồi tưởng.", "C. Thể hiện lời nói bỏ dở.", "D. Kết thúc đoạn văn."], "answer": "B", "explain": "Dấu chấm lửng ngắt nhịp chậm rãi, gợi dòng hồi tưởng trầm lắng, man mác của người kể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây dùng từ Hán Việt phù hợp với sắc thái trang trọng?", "options": ["A. “Tớ rất nhớ kỉ niệm tuổi thơ.”", "B. “Tớ rất nhớ cái hồi bé tí.”", "C. “Tớ rất nhớ lúc nhỏ xíu.”", "D. “Tớ rất nhớ ngày xưa ơi là xưa.”"], "answer": "A", "explain": "“Kỉ niệm”, “tuổi thơ” là từ Hán Việt mang sắc thái trang trọng, phù hợp với văn viết; các cách nói còn lại suồng sã.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết nào cho thấy “Tôi đi học” có sự kết hợp giữa kể và biểu cảm?", "options": ["A. Kể tên các bạn trong lớp.", "B. Vừa kể diễn biến buổi tựu trường, vừa bộc lộ trực tiếp cảm xúc hồi hộp, bâng khuâng của nhân vật.", "C. Chỉ miêu tả ngôi trường.", "D. Chỉ ghi lại lời thầy cô dặn dò."], "answer": "B", "explain": "Truyện vừa kể lại diễn biến ngày đầu đến trường, vừa xen lời bộc bạch cảm xúc (“lòng tôi đang có sự thay đổi lớn…”) — đúng sự kết hợp kể và biểu cảm của hồi kí.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) “Vừa nhắm mắt vừa mở cửa sổ” đề cao vẻ đẹp bình dị quanh ta.", "b) Người bố dạy con bằng tình yêu thương và sự tinh tế.", "c) Truyện khuyên trẻ em nên nhắm mắt khi đi ngoài đường.", "d) Hạnh phúc nằm trong những điều bình dị nhất của cuộc sống."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: “nhắm mắt” trong truyện là cách nói ẩn dụ về việc cảm nhận bằng tâm hồn. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Chủ đề “Bầu trời tuổi thơ” gợi về thế giới kỉ niệm trong sáng của tuổi thơ.", "b) Hồi kí kết hợp các phương thức kể, tả và biểu cảm.", "c) Từ Hán Việt là những từ mượn của tiếng Anh.", "d) Dấu chấm lửng có thể tạo nhịp điệu trầm lắng, suy tư."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: từ Hán Việt mượn của tiếng Hán. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) kể về một người thầy, người cô mà em nhớ mãi.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: giới thiệu thầy, cô. Thân đoạn: kỉ niệm cụ thể (dạy dỗ, quan tâm), tính cách đáng nhớ; tình cảm của em. Kết đoạn: lòng biết ơn. Tiêu chí chấm: ngôi thứ nhất, chi tiết chân thực, cảm xúc rõ ràng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (khoảng 150–200 chữ) nêu thông điệp về tuổi thơ mà em tâm đắc nhất sau khi học Bài 1.", "points": 0, "explain": "Gợi ý dàn ý cho GV: Mở đoạn: chọn một thông điệp (trân trọng kỉ niệm, yêu thương cha mẹ, biết cảm nhận vẻ đẹp bình dị…). Thân đoạn: lí giải vì sao tâm đắc, dẫn chứng từ văn bản và đời sống. Kết đoạn: em sẽ sống thế nào với thông điệp đó. Tiêu chí chấm: thông điệp rõ ràng, lí giải thuyết phục, liên hệ bản thân."}]}]}
