 của tái bản DNA là gì?", "options": ["A. Khuôn mẫu, bổ sung, bán bảo toàn", "B. Khuôn mẫu, liên kết, bảo toàn", "C. Bổ sung, phân li, độc lập", "D. Sao chép, phiên mã, dịch mã"], "answer": "A", "explain": "Tái bản DNA theo nguyên tắc khuôn mẫu, bổ sung và bán bảo toàn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao tái bản DNA phải diễn ra trước khi tế bào phân chia?", "options": ["A. Để tế bào to ra", "B. Để mỗi tế bào con nhận đầy đủ vật chất di truyền", "C. Để tạo protein", "D. Để tiêu hủy DNA cũ"], "answer": "B", "explain": "Tái bản giúp mỗi tế bào con nhận được bộ DNA đầy đủ giống tế bào mẹ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm giống nhau giữa tái bản DNA và phiên mã là gì?", "options": ["A. Đều tạo ra protein", "B. Đều theo nguyên tắc khuôn mẫu và bổ sung", "C. Đều cần ribosome", "D. Đều tạo 2 DNA con"], "answer": "B", "explain": "Cả hai đều dùng mạch polynucleotide làm khuôn và theo nguyên tắc bổ sung.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điểm khác nhau cơ bản giữa tái bản DNA và phiên mã là gì?", "options": ["A. Tái bản dùng cả 2 mạch làm khuôn tạo DNA; phiên mã dùng 1 mạch khuôn tạo RNA", "B. Không khác nhau", "C. Phiên mã tạo DNA", "D. Tái bản tạo RNA"], "answer": "A", "explain": "Tái bản sao chép toàn bộ phân tử DNA; phiên mã chỉ sao chép một đoạn gene thành RNA.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "mRNA sau phiên mã sẽ đi đâu để thực hiện chức năng?", "options": ["A. Ở lại trong nhân", "B. Ra tế bào chất tới ribosome", "C. Ra ngoài tế bào", "D. Vào ti thể"], "answer": "B", "explain": "mRNA mang thông tin ra tế bào chất để tổng hợp protein tại ribosome.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chiều của mạch khuôn trong phiên mã là gì?", "options": ["A. 3' → 5'", "B. 5' → 3'", "C. Tùy ý", "D. Cả hai chiều"], "answer": "A", "explain": "Mạch khuôn (mạch mã gốc) có chiều 3' → 5'.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định v
