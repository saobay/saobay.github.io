.25}, {"type": "mcq", "level": "NB", "q": "Mendel đã công bố kết quả nghiên cứu vào khoảng thời gian nào?", "options": ["A. Đầu thế kỉ XIX", "B. Giữa thế kỉ XIX (1865)", "C. Đầu thế kỉ XX", "D. Giữa thế kỉ XX"], "answer": "B", "explain": "Mendel công bố công trình năm 1865.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm độc đáo trong phương pháp của Mendel so với các nhà khoa học cùng thời là gì?", "options": ["A. Dùng kính hiển vi hiện đại", "B. Dùng toán thống kê xử lí kết quả lai", "C. Nghiên cứu trên người", "D. Không làm thí nghiệm"], "answer": "B", "explain": "Mendel là người đầu tiên dùng toán thống kê phân tích kết quả lai.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một học sinh nói: Di truyền và biến dị là hai hiện tượng đối lập nên không thể cùng tồn tại. Nhận xét này đúng hay sai?", "options": ["A. Đúng", "B. Sai, chúng song song và gắn liền với sinh sản", "C. Đúng một phần", "D. Không xác định được"], "answer": "B", "explain": "Di truyền và biến dị song song, gắn liền với quá trình sinh sản.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao đến đầu thế kỉ XX công trình của Mendel mới được công nhận rộng rãi?", "options": ["A. Vì Mendel giấu kết quả", "B. Vì lúc đó khoa học chưa hiểu về gene, NST; phải đợi ngành tế bào học phát triển", "C. Vì kết quả của Mendel sai", "D. Vì không ai đọc tiếng Đức"], "answer": "B", "explain": "Phải đợi tế bào học phát triển, phát hiện NST thì cơ sở của quy luật Mendel mới được sáng tỏ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về ý nghĩa di truyền học.", "statements": ["a) Di truyền học giúp chọn tạo giống mới.", "b) Di truyền học giúp phòng ngừa bệnh di truyền ở người.", "c) Di truyền học giúp dự báo động đất.", "d) Công nghệ sinh học phát triển dựa trên di truyền học."], "answer": ["T", "T", "F", "T"], "explain": "Di truyền học không liên quan đến dự báo động đất.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định về đậu Hà Lan.", "statements": ["a) Đậu Hà Lan có nhiều cặp tính trạng tương phản rõ rệt.", "b) Vòng đời ngắn giúp Mendel nhanh thu được kết quả.", "c) Tự thụ phấn nghiêm ngặt giúp tạo dòng thuần.", "d) Đậu Hà Lan là đối tượng duy nhất có thể nghiên cứu di truyền."], "answer": ["T", "T", "T", "F"], "explain": "Nhiều đối tượng khác cũng nghiên cứu được di truyền, ví dụ ruồi giấm, ngô.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai nội dung hiện tượng mà di truyền học nghiên cứu là gì?", "answer": "Di truyền và biến dị", "explain": "Di truyền học nghiên cứu di truyền và biến dị.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cơ sở vật chất của hiện tượng di truyền gồm những yếu tố nào?", "answer": "Gene DNA nhiễm sắc thể", "explain": "Gene, DNA, NST là cơ sở vật chất mang thông tin di truyền.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Tính trạng là gì?", "options": ["A. Đặc điểm về hình thái, cấu tạo, sinh lí của cơ thể", "B. Thói quen của sinh vật", "C. Môi trường sống", "D. Thức ăn của sinh vật"], "answer": "A", "explain": "Tính trạng là những đặc điểm về hình thái, cấu tạo, sinh lí của cơ thể.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cặp tính trạng tương phản là cặp tính trạng như thế nào?", "options": ["A. Giống nhau hoàn toàn", "B. Biểu hiện trái ngược nhau của cùng một tính trạng", "C. Thuộc hai cơ thể khác loài", "D. Không liên quan nhau"], "answer": "B", "explain": "Cặp tính trạng tương phản là hai biểu hiện trái ngược của cùng một tính trạng, ví dụ hoa đỏ và hoa trắng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Mendel theo dõi sự di truyền của từng cặp tính trạng riêng rẽ rồi mới xét nhiều cặp cùng lúc. Cách làm này có ưu điểm gì?", "options": ["A. Đơn giản hóa, dễ phát hiện quy luật của từng cặp", "B. Tiết kiệm giấy", "C. Làm nhanh hơn", "D. Không có ưu điểm"], "answer": "A", "explain": "Xét từng cặp riêng giúp đơn giản hóa và phát hiện quy luật rõ ràng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năm 1865, Mendel công bố công trình nghiên cứu trên đối tượng nào?", "options": ["A. Ruồi giấm", "B. Đậu Hà Lan", "C. Ngô", "D. Chuột"], "answer": "B", "explain": "Mendel nghiên cứu trên cây đậu Hà Lan.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thí nghiệm của Mendel chủ yếu dựa trên hiện tượng sinh học nào?", "options": ["A. Quang hợp", "B. Sinh sản (lai tạo)", "C. Hô hấp", "D. Cảm ứng"], "answer": "B", "explain": "Mendel lai các dòng đậu Hà Lan, tức dựa trên sinh sản.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một giống lúa thuần chủng gieo trồng nhiều vụ vẫn giữ nguyên đặc điểm. Điều này liên quan đến khái niệm nào?", "options": ["A. Di truyền ổn định tính trạng qua các thế hệ", "B. Biến dị", "C. Đột biến", "D. Thường biến"], "answer": "A", "explain": "Dòng thuần truyền đạt ổn định tính trạng cho đời sau, thể hiện di truyền.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về Mendel.", "statements": ["a) Mendel được xem là ông tổ của di truyền học.", "b) Mendel nghiên cứu trên cây đậu Hà Lan.", "c) Mendel dùng toán thống kê phân tích kết quả lai.", "d) Mendel nghiên cứu trên ruồi giấm."], "answer": ["T", "T", "T", "F"], "explain": "Mendel nghiên cứu trên đậu Hà Lan; Morgan mới nghiên cứu trên ruồi giấm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về phương pháp của Mendel.", "statements": ["a) Đậu Hà Lan tự thụ phấn nghiêm ngặt nên dễ tạo dòng thuần.", "b) Mendel theo dõi từng cặp tính trạng riêng rẽ.", "c) Dùng toán thống kê giúp Mendel phát hiện quy luật.", "d) Phương pháp của Mendel không cần làm thí nghiệm lai."], "answer": ["T", "T", "T", "F"], "explain": "Mendel tiến hành rất nhiều phép lai, đó là cốt lõi phương pháp của ông.", "points": 1}, {"type": "short", "level": "TH", "q": "Hiện tượng con sinh ra khác bố mẹ ở một số chi tiết gọi là gì?", "answer": "Biến dị", "explain": "Con khác bố mẹ và khác nhau là biến dị.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nhà khoa học nào được xem là ông tổ của di truyền học?", "answer": "Mendel", "explain": "Gregor Mendel đặt nền móng cho di truyền học.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Biến dị và di truyền có mối quan hệ như thế nào?", "options": ["A. Đối lập, loại trừ nhau", "B. Song song, gắn liền với quá trình sinh sản", "C. Không liên quan", "D. Biến dị ngăn di truyền"], "answer": "B", "explain": "Di truyền và biến dị song song, gắn liền với sinh sản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nào sau đây là ý nghĩa thực tiễn của di truyền học?", "options": ["A. Dự báo thời tiết", "B. Chọn tạo giống cây trồng, vật nuôi năng suất cao", "C. Khai thác khoáng sản", "D. Chế tạo máy móc"], "answer": "B", "explain": "Di truyền học là cơ sở của chọn giống cây trồng, vật nuôi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện tượng truyền đạt các tính trạng của bố mẹ cho con cháu được gọi là gì?", "options": ["A. Biến dị", "B. Di truyền", "C. Đột biến", "D. Thường biến"], "answer": "B", "explain": "Di truyền là sự truyền đạt tính trạng của bố mẹ, tổ tiên cho các thế hệ con cháu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói di truyền và biến dị là hai hiện tượng gắn liền với sinh sản?", "options": ["A. Vì chỉ có sinh sản mới tạo ra cá thể mới", "B. Vì sinh sản làm con giống hệt bố mẹ", "C. Vì sinh sản ngăn biến dị", "D. Vì sinh sản chỉ tạo biến dị"], "answer": "A", "explain": "Sinh sản tạo ra thế hệ con, qua đó tính trạng được truyền đạt (di truyền) và xuất hiện sai khác (biến dị).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một lứa mèo con cùng bố mẹ: 2 con lông vàng giống mẹ, 1 con lông đen giống bố, 1 con lông tam thể khác cả bố mẹ. Hiện tượng nào là biến dị?", "options": ["A. Lông vàng giống mẹ", "B. Lông đen giống bố", "C. Lông tam thể khác cả bố mẹ", "D. Cả ba đều là biến dị"], "answer": "C", "explain": "Con lông tam thể khác cả bố lẫn mẹ là biến dị; còn lại là di truyền.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai anh em sinh đôi cùng trứng có kiểu gene giống nhau nhưng vân tay vẫn khác nhau. Điều này chứng tỏ điều gì?", "options": ["A. Di truyền không tồn tại", "B. Biến dị có thể xuất hiện ngay cả khi kiểu gene giống nhau", "C. Vân tay không phải tính trạng", "D. Sinh đôi cùng trứng không giống nhau"], "answer": "B", "explain": "Kiểu gene giống nhau nhưng vẫn có sai khác nhỏ, chứng tỏ biến dị luôn gắn với quá trình phát triển cá thể.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về nội dung di truyền học.", "statements": ["a) Cơ chế di truyền là một nội dung nghiên cứu của di truyền học.", "b) Tính quy luật di truyền là một nội dung nghiên cứu của di truyền học.", "c) Di truyền học nghiên cứu cấu tạo nguyên tử.", "d) Gene là cơ sở vật chất của di truyền."], "answer": ["T", "T", "F", "T"], "explain": "Di truyền học nghiên cứu gene, không nghiên cứu cấu tạo nguyên tử.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về ví dụ di truyền, biến dị.", "statements": ["a) Con có nhóm máu giống bố là di truyền.", "b) Anh em ruột có chiều cao khác nhau là biến dị.", "c) Cây con giống hệt cây mẹ về mọi chi tiết là điều chắc chắn.", "d) Hai cá thể cùng bố mẹ có thể khác nhau một số tính trạng."], "answer": ["T", "T", "F", "T"], "explain": "Dù di truyền, con vẫn có biến dị nên không giống hệt bố mẹ về mọi chi tiết.", "points": 1}, {"type": "short", "level": "NB", "q": "Đối tượng nghiên cứu chính của Mendel là cây gì?", "answer": "Đậu Hà Lan", "explain": "Mendel lai tạo trên cây đậu Hà Lan.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Di truyền học là cơ sở lí thuyết của ngành khoa học nào?", "answer": "Chọn giống", "explain": "Di truyền học là cơ sở lí thuyết của khoa học chọn giống.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Nội d uyền học?", "options": ["A. Darwin", "B. Mendel", "C. Morgan", "D. Watson"], "answer": "B", "explain": "Gregor Mendel được xem là ông tổ của di truyền học.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định khái quát.", "statements": ["a) Di truyền học nghiên cứu cơ sở vật chất của di truyền.", "b) Di truyền học là cơ sở lí thuyết của chọn giống.", "c) Công trình Mendel được công nhận ngay khi công bố.", "d) Tế bào học phát triển giúp sáng tỏ cơ sở của quy luật Mendel."], "answer": ["T", "T", "F", "T"], "explain": "Công trình Mendel phải đến đầu thế kỉ XX mới được công nhận rộng rãi.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về nội dung di truyền học.", "statements": ["a) Cơ chế di truyền là một nội dung nghiên cứu của di truyền học.", "b) Tính quy luật di truyền là một nội dung nghiên cứu của di truyền học.", "c) Di truyền học nghiên cứu cấu tạo nguyên tử.", "d) Gene là cơ sở vật chất của di truyền."], "answer": ["T", "T", "F", "T"], "explain": "Di truyền học nghiên cứu gene, không nghiên cứu cấu tạo nguyên tử.", "points": 1}, {"type": "short", "level": "VDC", "q": "Mendel đã dùng công cụ toán học nào để xử lí kết quả lai?", "answer": "Toán thống kê", "explain": "Mendel dùng toán thống kê phân tích số liệu lai.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Đối tượng nghiên cứu chính của Mendel là cây gì?", "answer": "Đậu Hà Lan", "explain": "Mendel lai tạo trên cây đậu Hà Lan.", "points": 0.5}]}]}
