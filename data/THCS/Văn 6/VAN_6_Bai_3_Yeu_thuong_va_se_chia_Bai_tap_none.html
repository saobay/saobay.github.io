: "mcq", "level": "NB", "q": "An-đéc-xen được mệnh danh là gì?", "options": ["A. Ông vua truyện cổ tích", "B. Nhà thơ của quê hương", "C. Bậc thầy tùy bút", "D. Người kể chuyện dân gian"], "answer": "A", "explain": "Với kho tàng truyện cổ tích nổi tiếng thế giới, An-đéc-xen được gọi là ông vua truyện cổ tích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả truyện Gió lạnh đầu mùa là ai?", "options": ["A. An-đéc-xen", "B. Nguyễn Tuân", "C. Thạch Lam", "D. Tế Hanh"], "answer": "C", "explain": "Gió lạnh đầu mùa là truyện ngắn của Thạch Lam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tên thật của nhà văn Thạch Lam là gì?", "options": ["A. Nguyễn Tường Vinh", "B. Nguyễn Tường Lân", "C. Trần Tế Hanh", "D. Nguyễn Vĩ"], "answer": "A", "explain": "Thạch Lam tên thật là Nguyễn Tường Vinh (1910-1942).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi biết các con mang áo cho Hiên, mẹ Sơn đã xử sự thế nào?", "options": ["A. Mắng các con một trận", "B. Không trách mắng mà còn cho mẹ con Hiên vay tiền", "C. Đòi lại chiếc áo", "D. Cấm các con chơi với Hiên"], "answer": "B", "explain": "Mẹ Sơn nhân hậu, không trách mắng mà còn cho mẹ Hiên vay tiền mua áo, thể hiện lòng thương người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nét đặc sắc trong nghệ thuật kể chuyện của Thạch Lam là gì?", "options": ["A. Giọng văn nhẹ nhàng, tinh tế, giàu cảm xúc", "B. Cốt truyện gay cấn, nhiều tình tiết bất ngờ", "C. Nhiều yếu tố kì ảo", "D. Ngôn ngữ hoa mĩ, cầu kì"], "answer": "A", "explain": "Thạch Lam nổi tiếng với giọng văn nhẹ nhàng, tinh tế, đi sâu vào cảm xúc và vẻ đẹp đời thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây sử dụng biện pháp so sánh?", "options": ["A. Gió gào thét ngoài ô cửa.", "B. Trời rét như cắt da cắt thịt.", "C. Nắng mỉm cười trên cành lá.", "D. Chị gió thủ thỉ bên tai."], "answer": "B", "explain": "Câu B có từ so sánh như nối trời rét với cắt da cắt thịt, các câu còn lại dùng nhân hóa.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhân hóa là gán đặc điểm của con người cho sự vật.", "b) Câu Ông mặt trời cười sử dụng nhân hóa.", "c) Nhân hóa chỉ dùng được cho con vật.", "d) Câu Trăng như quả bóng là nhân hóa."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng: gán hành động cười cho mặt trời. c) Sai: nhân hóa dùng cho mọi sự vật (cây cối, đồ vật, hiện tượng tự nhiên). d) Sai: đây là so sánh vì có từ như.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nóng - lạnh là cặp từ trái nghĩa.", "b) Từ trái nghĩa là những từ có nghĩa giống nhau.", "c) Yêu thương - ghét bỏ là cặp từ trái nghĩa.", "d) Sẻ chia trái nghĩa với ích kỉ."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: từ trái nghĩa có nghĩa trái ngược nhau. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu phân tích nhân vật Sơn trong truyện Gió lạnh đầu mùa.", "points": 0, "explain": "Gợi ý chấm: nêu hành động đẹp (thấy Hiên chịu rét, rủ chị mang áo cho bạn); phân tích tâm hồn (nhân hậu, giàu lòng trắc ẩn, hồn nhiên); vai trò của nhân vật trong việc thể hiện chủ đề sẻ chia. Có dẫn chứng, diễn đạt mạch lạc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu tả cảnh mùa đông, trong đó có sử dụng ít nhất một biện pháp so sánh và một biện pháp nhân hóa.", "points": 0, "explain": "Gợi ý chấm: xác định đúng câu dùng so sánh (có từ như, tựa như...) và câu dùng nhân hóa (gán đặc điểm người cho sự vật); hình ảnh mùa đông sinh động; các biện pháp tu từ dùng đúng và tự nhiên. Diễn đạt mạch lạc, giàu hình ảnh."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Truyện Cô bé bán diêm thuộc thể loại nào?", "options": ["A. Truyện ngắn hiện thực", "B. Truyện cổ tích", "C. Truyện cười", "D. Truyện truyền thuyết"], "answer": "B", "explain": "Truyện có yếu tố kì ảo, kết hợp hiện thực và mộng tưởng nên thuộc truyện cổ tích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Truyện Gió lạnh đầu mùa thuộc thể loại nào?", "options": ["A. Truyện cổ tích", "B. Truyện ngắn hiện thực", "C. Thần thoại", "D. Cổ tích thần kì"], "answer": "B", "explain": "Truyện viết về đời sống thực, không có yếu tố kì ảo nên là truyện ngắn hiện thực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong đêm giao thừa, cô bé bán diêm đã quẹt diêm mấy lần?", "options": ["A. 2 lần", "B. 3 lần", "C. 4 lần", "D. 5 lần"], "answer": "C", "explain": "Em đã quẹt diêm 4 lần, lần cuối quẹt cả bao diêm để níu giữ hình ảnh bà ngoại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây sử dụng biện pháp nhân hóa?", "options": ["A. Mắt em sáng như những vì sao.", "B. Trời rét như cắt da cắt thịt.", "C. Gió gào thét ngoài ô cửa.", "D. Em đẹp như tiên."], "answer": "C", "explain": "Câu C gán hành động gào thét của con người cho gió nên là nhân hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác dụng của biện pháp so sánh là gì?", "options": ["A. Làm cho sự vật có hồn như con người", "B. Làm cho hình ảnh cụ thể, sinh động, gợi cảm hơn", "C. Làm cho câu văn ngắn gọn", "D. Làm cho câu văn khó hiểu"], "answer": "B", "explain": "So sánh giúp hình ảnh được miêu tả cụ thể, sinh động và gợi cảm hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác dụng của biện pháp nhân hóa là gì?", "options": ["A. Làm cho sự vật trở nên có hồn, gần gũi với con người", "B. Làm cho câu văn dài hơn", "C. Làm cho sự vật to lớn hơn", "D. Làm cho câu văn khó hiểu"], "answer": "A", "explain": "Nhân hóa làm cho thế giới sự vật sinh động, có hồn, thể hiện tình cảm gắn bó của con người với thiên nhiên.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tác giả Gió lạnh đầu mùa là Thạch Lam.", "b) Lan là em gái của Sơn.", "c) Bé Hiên là con của người vú nuôi cũ trong nhà Sơn.", "d) Chị em Sơn đã mang áo bông cho Hiên mặc."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: Lan là chị gái của Sơn. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Truyện Cô bé bán diêm được kể ở ngôi thứ ba.", "b) Truyện Gió lạnh đầu mùa được kể ở ngôi thứ nhất.", "c) Ở ngôi thứ ba, người kể giấu mình.", "d) Ở ngôi thứ nhất, người kể xưng tôi."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: truyện kể ở ngôi thứ ba. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu cảm nhận của em về hình ảnh bà ngoại trong truyện Cô bé bán diêm.", "points": 0, "explain": "Gợi ý chấm: nêu vị trí của bà (người duy nhất yêu thương em); phân tích chi tiết bà hiện ra trong ánh lửa diêm (lần quẹt thứ tư, em quẹt cả bao diêm để níu giữ); ý nghĩa (biểu tượng tình yêu thương, khát vọng hạnh phúc); cảm xúc của bản thân. Diễn đạt mạch lạc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu trình bày suy nghĩ: vì sao chúng ta cần sẻ chia với những người bất hạnh?", "points": 0, "explain": "Gợi ý chấm: giải thích người bất hạnh là ai; lí do cần sẻ chia (truyền thống tương thân tương ái, sẻ chia làm cuộc sống tốt đẹp hơn, ai cũng có lúc khó khăn); dẫn chứng (từ văn bản hoặc thực tế); lời kêu gọi hành động. Lập luận thuyết phục."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Lần quẹt diêm đầu tiên, cô bé nhìn thấy gì?", "options": ["A. Con ngỗng quay", "B. Chiếc lò sưởi ấm áp", "C. Cây thông Nô-en", "D. Bà ngoại"], "answer": "B", "explain": "Lần đầu, trong ánh lửa diêm em thấy chiếc lò sưởi sáng rực và ấm áp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lần quẹt diêm thứ hai, cô bé nhìn thấy gì?", "options": ["A. Chiếc lò sưởi", "B. Cây thông Nô-en", "C. Con ngỗng quay thơm phức", "D. Bà ngoại"], "answer": "C", "explain": "Lần thứ hai, em thấy một con ngỗng quay đang tiến về phía mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lần quẹt diêm thứ ba, cô bé nhìn thấy gì?", "options": ["A. Bà ngoại", "B. Cây thông Nô-en lộng lẫy", "C. Chiếc lò sưởi", "D. Mâm cỗ đầy"], "answer": "B", "explain": "Lần thứ ba, em thấy cây thông Nô-en lộng lẫy với hàng ngàn ngọn nến.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu Mắt em sáng như những vì sao, từ ngữ dùng để so sánh là từ nào?", "options": ["A. Mắt em", "B. Sáng", "C. Như", "D. Những vì sao"], "answer": "C", "explain": "Như là từ ngữ so sánh nối sự vật được so sánh (mắt em) với sự vật dùng để so sánh (những vì sao).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ trái nghĩa với ấm áp là từ nào?", "options": ["A. Nóng nực", "B. Lạnh lẽo", "C. Mát mẻ", "D. Dịu dàng"], "answer": "B", "explain": "Ấm áp trái nghĩa với lạnh lẽo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ trái nghĩa với giàu sang là từ nào?", "options": ["A. Nghèo hèn", "B. Sung sướng", "C. Hạnh phúc", "D. Vui vẻ"], "answer": "A", "explain": "Giàu sang trái nghĩa với nghèo hèn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cô bé bán diêm chết trong đêm giao thừa giá lạnh.", "b) Cha của em rất yêu thương em.", "c) Bà ngoại là người duy nhất yêu thương em.", "d) Kết thúc truyện hoàn toàn bi thảm, không có chút ánh sáng nào."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: cha em nghiêm khắc, em sợ bị đánh. c) Đúng. d) Sai: linh hồn em được bà đưa lên thiên đường, kết thúc ấm áp.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sơn thương Hiên vì thấy Hiên phải chịu rét.", "b) Mẹ Sơn đã mắng các con vì mang áo cho Hiên.", "c) Truyện Gió lạnh đầu mùa ca ngợi tình yêu thương, sẻ chia.", "d) Gió lạnh đầu mùa là truyện cổ tích."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: mẹ không trách mắng mà còn cho mẹ con Hiên vay tiền. c) Đúng. d) Sai: đây là truyện ngắn hiện thực.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu so sánh điểm giống và khác nhau giữa hai văn bản Cô bé bán diêm và Gió lạnh đầu mùa.", "points": 0, "explain": "Gợi ý chấm: điểm giống (cùng chủ đề yêu thương, cùng viết về trẻ em nghèo trong mùa đông, cùng được kể ở ngôi thứ ba); điểm khác (cổ tích có yếu tố kì ảo - truyện ngắn hiện thực; kết thúc buồn - kết thúc ấm áp; tác giả nước ngoài - tác giả Việt Nam). So sánh rõ ràng, có dẫn chứng."}, {"type": "essay", "level": "VDC", "q": "Tưởng tượng em là Sơn, viết đoạn văn khoảng 5-7 câu kể lại cảm xúc của mình khi trao chiếc áo cho bé Hiên.", "points": 0, "explain": "Gợi ý chấm: dùng ngôi kể thứ nhất (xưng tôi); kể lại khoảnh khắc trao áo (thấy Hiên co ro, quyết định cho áo, niềm vui khi Hiên mặc ấm); thể hiện cảm xúc hồn nhiên, ấm áp của trẻ thơ. Sáng tạo nhưng phù hợp với nội dung truyện."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Lần quẹt diêm thứ tư, cô bé nhìn thấy ai?", "options": ["A. Người cha", "B. Bà ngoại hiền từ", "C. Người mẹ", "D. Ông già Nô-en"], "answer": "B", "explain": "Lần thứ tư, em thấy bà ngoại hiền từ, người duy nhất yêu thương em.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ai đã mang áo bông cho bé Hiên mặc?", "options": ["A. Mẹ của Sơn", "B. Chị em Sơn và Lan", "C. Người hàng xóm", "D. Cô giáo"], "answer": "B", "explain": "Thương Hiên co ro trong giá rét, Sơn đã rủ chị Lan mang chiếc áo bông cũ cho Hiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bé Hiên là con của ai?", "options": ["A. Con người vú nuôi cũ của nhà Sơn", "B. Con bà hàng xóm", "C. Con cô giáo", "D. Em họ của Sơn"], "answer": "A", "explain": "Bé Hiên là con của người vú nuôi cũ trong nhà Sơn, gia cảnh nghèo khó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điền cặp từ trái nghĩa thích hợp vào chỗ trống: Dù ... hay ..., mẹ vẫn thương con.", "options": ["A. giàu - nghèo", "B. vui - buồn", "C. cao - thấp", "D. nhanh - chậm"], "answer": "A", "explain": "Cặp giàu - nghèo phù hợp với ý nghĩa câu: dù hoàn cảnh nào mẹ vẫn thương con.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Truyện Gió lạnh đầu mùa được kể ở ngôi thứ mấy?", "options": ["A. Ngôi thứ nhất", "B. Ngôi thứ hai", "C. Ngôi thứ ba", "D. Ngôi thứ nhất và thứ ba"], "answer": "C", "explain": "Người kể giấu mình, gọi nhân vật bằng tên (Sơn, Lan, Hiên) nên truyện kể ở ngôi thứ ba.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Truyện Cô bé bán diêm được kể ở ngôi thứ mấy?", "options": ["A. Ngôi thứ nhất", "B. Ngôi thứ ba", "C. Ngôi thứ hai", "D. Không có ngôi kể"], "answer": "B", "explain": "Người kể giấu mình, gọi em là cô bé nên truyện kể ở ngôi thứ ba.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chi tiết tiêu biểu thể hiện tập trung tư tưởng của tác phẩm.", "b) Mọi chi tiết trong truyện đều là chi tiết tiêu biểu.", "c) Que diêm là chi tiết tiêu biểu trong Cô bé bán diêm.", "d) Chiếc áo bông là chi tiết tiêu biểu trong Gió lạnh đầu mùa."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng theo định nghĩa. b) Sai: chỉ những chi tiết có giá trị gợi tả, thể hiện tập trung tư tưởng mới là tiêu biểu. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thạch Lam tên thật là Nguyễn Tường Vinh.", "b) Ông là thành viên của Tự lực văn đoàn.", "c) Ông chỉ viết truyện cổ tích.", "d) Văn phong của ông nhẹ nhàng, tinh tế, giàu cảm xúc."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: ông viết truyện ngắn hiện thực và tùy bút. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu phân tích nghệ thuật tương phản trong truyện Cô bé bán diêm.", "points": 0, "explain": "Gợi ý chấm: chỉ ra các cặp tương phản (đêm giao thừa rộn ràng - em bơ vơ lạnh lẽo; ánh lửa diêm ấm áp - hiện thực giá buốt; ước mơ đẹp - cái chết thương tâm); phân tích tác dụng (làm nổi bật nỗi khổ của em, gây xót thương, tố cáo xã hội thờ ơ). Diễn đạt mạch lạc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu cảm nhận của em về nhân vật người mẹ trong truyện Gió lạnh đầu mùa.", "points": 0, "explain": "Gợi ý chấm: nêu hành động của mẹ (không trách mắng các con, cho mẹ con Hiên vay tiền); phẩm chất (nhân hậu, thương người, dạy con bằng hành động); ý nghĩa (người lớn nêu gương sẻ chia cho con trẻ). Cảm xúc chân thành, diễn đạt mạch lạc."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Từ trái nghĩa là những từ như thế nào?", "options": ["A. Có nghĩa giống nhau", "B. Có nghĩa trái ngược nhau", "C. Có cách phát âm giống nhau", "D. Có cách viết giống nhau"], "answer": "B", "explain": "Từ trái nghĩa là những từ có nghĩa trái ngược nhau, ví dụ giàu - nghèo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cặp từ nào sau đây là từ trái nghĩa?", "options": ["A. Vui vẻ - hân hoan", "B. Giàu - nghèo", "C. Chạy - đi", "D. Ăn - uống"], "answer": "B", "explain": "Giàu và nghèo có nghĩa trái ngược nhau nên là cặp từ trái nghĩa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp so sánh là gì?", "options": ["A. Gán đặc điểm con người cho sự vật", "B. Đối chiếu sự vật này với sự vật khác có nét tương đồng", "C. Lặp lại từ ngữ để nhấn mạnh", "D. Nói quá sự thật"], "answer": "B", "explain": "So sánh là đối chiếu sự vật, sự việc này với sự vật, sự việc khác có nét tương đồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao hình ảnh bà ngoại được coi là chi tiết tiêu biểu?", "options": ["A. Vì bà xuất hiện nhiều nhất", "B. Vì tập trung thể hiện khát vọng được yêu thương của cô bé", "C. Vì bà rất giàu", "D. Vì bà là người kể chuyện"], "answer": "B", "explain": "Bà ngoại là chi tiết tập trung thể hiện tư tưởng của tác phẩm: khát vọng yêu thương của em.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài học rút ra từ truyện Cô bé bán diêm là gì?", "options": ["A. Phải chăm chỉ lao động", "B. Hãy biết yêu thương, sẻ chia với những người bất hạnh", "C. Không nên ra đường ban đêm", "D. Phải nghe lời cha mẹ"], "answer": "B", "explain": "Truyện kêu gọi lòng thương cảm và sự sẻ chia với những số phận bất hạnh trong cuộc sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài học rút ra từ truyện Gió lạnh đầu mùa là gì?", "options": ["A. Tình yêu thương, sự sẻ chia làm cho cuộc sống ấm áp hơn", "B. Mùa đông rất lạnh", "C. Trẻ em không nên cho đồ của mình", "D. Phải mặc áo ấm khi ra đường"], "answer": "A", "explain": "Từ việc làm của chị em Sơn và lòng nhân hậu của người mẹ, truyện ca ngợi tình yêu thương, sẻ chia.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong so sánh có sự vật được so sánh và sự vật dùng để so sánh.", "b) Câu Đẹp như tiên sử dụng biện pháp so sánh.", "c) So sánh luôn phải dùng từ như.", "d) Từ là cũng có thể là từ ngữ so sánh."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: còn có tựa như, giống như, là... d) Đúng, ví dụ: Cô giáo là người mẹ thứ hai của em.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhân vật chính là nhân vật trung tâm của câu chuyện.", "b) Cô bé bán diêm là nhân vật chính của truyện.", "c) Bà ngoại là nhân vật chính của truyện Cô bé bán diêm.", "d) Nhân vật được khắc họa qua hành động, lời nói, suy nghĩ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: bà ngoại là nhân vật phụ. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Đặt 3 câu có sử dụng cặp từ trái nghĩa, rồi viết đoạn văn ngắn khoảng 5-7 câu giải thích tác dụng của việc dùng từ trái nghĩa trong câu văn.", "points": 0, "explain": "Gợi ý chấm: 3 câu đặt đúng, mỗi câu có một cặp từ trái nghĩa dùng chính xác; đoạn văn giải thích được tác dụng (tạo tương phản, nhấn mạnh, tăng sức biểu cảm); lấy ví dụ minh họa. Diễn đạt rõ ràng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu: nếu được gặp cô bé bán diêm, em sẽ nói và làm gì?", "points": 0, "explain": "Gợi ý chấm: thể hiện sự đồng cảm (an ủi, chia sẻ); việc làm cụ thể, thiết thực (mua diêm giúp em, cho em áo ấm, đưa em về nhà...); lời nhắn gửi về tình yêu thương. Cảm xúc chân thành, sáng tạo hợp lí."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Biện pháp nhân hóa là gì?", "options": ["A. Đối chiếu hai sự vật giống nhau", "B. Gọi hoặc tả sự vật bằng từ ngữ của con người", "C. Nói giảm, nói tránh", "D. Dùng từ trái nghĩa"], "answer": "B", "explain": "Nhân hóa là gọi hoặc tả sự vật bằng từ ngữ vốn dùng cho con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ ngữ nào sau đây thường được dùng trong biện pháp so sánh?", "options": ["A. Và", "B. Như", "C. Rất", "D. Đã"], "answer": "B", "explain": "Như là từ ngữ so sánh điển hình, bên cạnh tựa như, giống như, là...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chi tiết tiêu biểu trong truyện là gì?", "options": ["A. Mọi chi tiết xuất hiện trong truyện", "B. Chi tiết có giá trị gợi tả, thể hiện tập trung tư tưởng tác phẩm", "C. Chi tiết dài nhất trong truyện", "D. Chi tiết ở cuối truyện"], "answer": "B", "explain": "Chi tiết tiêu biểu là chi tiết có giá trị gợi tả, biểu hiện tập trung tư tưởng của tác phẩm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận xét nào đúng về nhân vật Sơn?", "options": ["A. Ích kỉ, chỉ biết mình", "B. Nhân hậu, giàu lòng trắc ẩn", "C. Nhút nhát, sợ sệt", "D. Bướng bỉnh, không nghe lời"], "answer": "B", "explain": "Sơn thương Hiên chịu rét, chủ động rủ chị mang áo cho bạn, thể hiện tấm lòng nhân hậu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận xét nào đúng về nhân vật cô bé bán diêm?", "options": ["A. Đáng thương nhưng giàu khát vọng sống và khát vọng yêu thương", "B. Lười biếng, không chịu làm việc", "C. Hư hỏng, không nghe lời cha", "D. Vô cảm với mọi người"], "answer": "A", "explain": "Em nghèo khổ, đáng thương nhưng vẫn mơ ước về cuộc sống ấm no và tình yêu thương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kết thúc truyện Cô bé bán diêm gợi cảm xúc gì cho người đọc?", "options": ["A. Chỉ thấy sợ hãi", "B. Vừa xót thương vừa ấm áp vì em được giải thoát khổ đau, về với bà", "C. Thấy vui vẻ", "D. Không có cảm xúc gì"], "answer": "B", "explain": "Em chết trong giá lạnh gây xót thương, nhưng linh hồn em được bà đưa lên thiên đường nên kết thúc cũng ấm áp.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chủ đề của Bài 3 là yêu thương và sẻ chia.", "b) Hai văn bản trong Bài 3 đều viết về chiến tranh.", "c) Cô bé bán diêm kêu gọi lòng thương cảm với người bất hạnh.", "d) Gió lạnh đầu mùa ca ngợi sự sẻ chia."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: cả hai đều viết về tình yêu thương con người. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vui - buồn là cặp từ trái nghĩa.", "b) Đẹp - xấu là cặp từ trái nghĩa.", "c) To - nhỏ là cặp từ trái nghĩa.", "d) Đi - chạy là cặp từ trái nghĩa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đi và chạy đều chỉ hành động di chuyển, không trái nghĩa nhau.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu phân tích ý nghĩa nhan đề Gió lạnh đầu mùa.", "points": 0, "explain": "Gợi ý chấm: giải thích nghĩa đen (đợt gió lạnh đầu tiên của mùa đông); nghĩa bóng (hoàn cảnh thử thách làm bộc lộ tình người); vai trò (gợi không gian truyện, làm nền cho hành động sẻ chia của chị em Sơn). Phân tích sâu sắc, diễn đạt mạch lạc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể về một việc tốt em đã làm theo lời dạy lá lành đùm lá rách.", "points": 0, "explain": "Gợi ý chấm: giải thích ngắn gọn ý nghĩa câu tục ngữ; kể việc tốt cụ thể (giúp bạn nghèo, ủng hộ lũ lụt, nhường cơm sẻ áo...); cảm xúc sau khi làm việc tốt; bài học rút ra. Kể chân thực, cảm xúc chân thành."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Cốt truyện là gì?", "options": ["A. Lời nói của nhân vật", "B. Hệ thống các sự kiện tạo thành câu chuyện theo trình tự nhất định", "C. Suy nghĩ của tác giả", "D. Phần kết thúc của truyện"], "answer": "B", "explain": "Cốt truyện là hệ thống các sự kiện tạo thành câu chuyện, sắp xếp theo trình tự nhất định.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chủ đề chung của Bài 3 là gì?", "options": ["A. Quê hương yêu dấu", "B. Yêu thương và sẻ chia", "C. Tôi và các bạn", "D. Gõ cửa trái tim"], "answer": "B", "explain": "Bài 3 có chủ đề Yêu thương và sẻ chia với hai văn bản Cô bé bán diêm và Gió lạnh đầu mùa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong truyện Cô bé bán diêm, ai là người duy nhất yêu thương em?", "options": ["A. Người cha", "B. Bà ngoại", "C. Người mẹ", "D. Người hàng xóm"], "answer": "B", "explain": "Bà ngoại đã mất là người duy nhất yêu thương, chiều chuộng em.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ trái nghĩa với sẻ chia là từ nào?", "options": ["A. Giúp đỡ", "B. Ích kỉ", "C. Yêu thương", "D. Đùm bọc"], "answer": "B", "explain": "Sẻ chia là chia sớt cho nhau, trái ngược với ích kỉ là chỉ biết giữ cho mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây dùng cặp từ trái nghĩa tạo sự tương phản?", "options": ["A. Em bé rất ngoan.", "B. Kẻ ăn không hết, người lần không ra.", "C. Trời hôm nay đẹp.", "D. Hoa nở rất thơm."], "answer": "B", "explain": "Câu B dùng cặp ăn không hết - lần không ra tạo sự tương phản giàu nghèo rõ nét.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm giống nhau về chủ đề của hai văn bản trong Bài 3 là gì?", "options": ["A. Cùng viết về chiến tranh", "B. Cùng ca ngợi tình yêu thương con người", "C. Cùng viết về quê hương", "D. Cùng viết về nhà trường"], "answer": "B", "explain": "Cả Cô bé bán diêm và Gió lạnh đầu mùa đều ca ngợi tình yêu thương, lòng sẻ chia giữa con người.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Truyện Cô bé bán diêm kết hợp hiện thực và mộng tưởng.", "b) Truyện sử dụng nghệ thuật tương phản.", "c) Truyện được kể ở ngôi thứ nhất.", "d) Ngôn ngữ truyện giàu cảm xúc xót thương."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: tương phản giữa đêm giao thừa rộn ràng và cảnh em cô đơn. c) Sai: truyện kể ở ngôi thứ ba. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gió lạnh đầu mùa miêu tả tâm lí trẻ thơ tinh tế.", "b) Ngôn ngữ truyện giản dị, giàu cảm xúc.", "c) Truyện có nhiều yếu tố kì ảo.", "d) Kết thúc truyện gợi nhiều suy nghĩ về tình người."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đây là truyện hiện thực, không có yếu tố kì ảo. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu cảm nhận của em về kết thúc truyện Cô bé bán diêm.", "points": 0, "explain": "Gợi ý chấm: tóm tắt kết thúc (em chết cóng, môi mỉm cười, linh hồn theo bà lên thiên đường); cảm xúc (xót thương trước cái chết, ấm áp vì em thoát khổ đau); suy nghĩ (kết thúc vừa buồn vừa đẹp, lời tố cáo xã hội thờ ơ). Diễn đạt mạch lạc, giàu cảm xúc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu trả lời câu hỏi: em học được điều gì từ chị em Sơn trong truyện Gió lạnh đầu mùa?", "points": 0, "explain": "Gợi ý chấm: nêu bài học (biết quan tâm, sẻ chia với người khó khăn hơn mình; lòng tốt không phân biệt giàu nghèo); liên hệ bản thân (việc em sẽ làm); khẳng định giá trị của tình yêu thương. Chân thành, thuyết phục."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Truyện Gió lạnh đầu mùa viết về cơn gió của mùa nào?", "options": ["A. Mùa xuân", "B. Mùa hạ", "C. Mùa thu", "D. Mùa đông"], "answer": "D", "explain": "Gió lạnh đầu mùa là đợt gió lạnh đầu tiên của mùa đông.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lan là gì của Sơn trong truyện Gió lạnh đầu mùa?", "options": ["A. Em gái", "B. Chị gái", "C. Bạn học", "D. Cô giáo"], "answer": "B", "explain": "Lan là chị gái của Sơn; hai chị em cùng mang áo cho bé Hiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mẹ của Sơn trong truyện Gió lạnh đầu mùa là người như thế nào?", "options": ["A. Khó tính, hay mắng con", "B. Nhân hậu, giàu lòng thương người", "C. Lạnh lùng, vô tâm", "D. Keo kiệt, tính toán"], "answer": "B", "explain": "Mẹ Sơn không trách mắng các con mà còn cho mẹ con Hiên vay tiền, thể hiện lòng nhân hậu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Người kể chuyện ở ngôi thứ ba có đặc điểm gì?", "options": ["A. Chỉ biết chuyện của mình", "B. Kể khách quan, có thể biết hết mọi chuyện", "C. Không biết gì về nhân vật", "D. Chỉ kể bằng lời thoại"], "answer": "B", "explain": "Người kể ngôi thứ ba đứng ngoài câu chuyện nên kể khách quan và có thể biết hết mọi chuyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong Gió lạnh đầu mùa, chi tiết nào thể hiện rõ nhất tình yêu thương?", "options": ["A. Gió lạnh đầu mùa tràn về", "B. Chị em Sơn đem áo bông cho bé Hiên mặc", "C. Sơn ra sân chơi", "D. Mẹ may áo mới cho Sơn"], "answer": "B", "explain": "Việc chị em Sơn tự nguyện đem áo cho Hiên là biểu hiện đẹp nhất của tình yêu thương, sẻ chia.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói Thạch Lam có tài phát hiện cái đẹp bình dị?", "options": ["A. Vì ông chỉ viết về người giàu", "B. Vì ông phát hiện vẻ đẹp tâm hồn trong những con người, sự việc đời thường", "C. Vì ông dùng nhiều từ khó", "D. Vì ông viết truyện rất dài"], "answer": "B", "explain": "Thạch Lam tìm thấy vẻ đẹp tâm hồn, tình người trong những điều bình dị nhất của cuộc sống.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu Mặt trời như hòn lửa sử dụng so sánh.", "b) Câu Chị gió thủ thỉ bên tai sử dụng nhân hóa.", "c) Câu Cây bàng có tán lá rộng sử dụng nhân hóa.", "d) So sánh và nhân hóa đều làm cho câu văn sinh động."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: có từ như. b) Đúng: gọi gió là chị và gán hành động thủ thỉ. c) Sai: đây chỉ là câu tả thực, không gán đặc điểm người. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cả Cô bé bán diêm và Gió lạnh đầu mùa đều ca ngợi tình yêu thương.", "b) Cả hai truyện đều có yếu tố kì ảo.", "c) Cả hai truyện đều được kể ở ngôi thứ ba.", "d) Cả hai truyện đều viết về mùa đông giá lạnh."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: chỉ Cô bé bán diêm có yếu tố kì ảo. c) Đúng. d) Đúng: một bên là đêm giao thừa mùa đông, một bên là đợt gió lạnh đầu mùa.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu sử dụng biện pháp nhân hóa để miêu tả cơn gió lạnh đầu mùa.", "points": 0, "explain": "Gợi ý chấm: sử dụng đúng và tự nhiên ít nhất 2 hình ảnh nhân hóa (gọi gió bằng từ chỉ người, gán hành động, cảm xúc của người cho gió); hình ảnh sinh động, gợi cảm; đoạn văn mạch lạc. Tránh nhầm với so sánh."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn ngắn khoảng 10-12 câu kể lại một kỉ niệm về sự sẻ chia khiến em nhớ mãi.", "points": 0, "explain": "Gợi ý chấm: có đủ ba phần (mở bài giới thiệu kỉ niệm; thân bài kể diễn biến theo trình tự, có chi tiết tiêu biểu; kết bài nêu cảm xúc, bài học); kể chân thực, cảm xúc; có thể dùng so sánh, nhân hóa, từ trái nghĩa để bài sinh động. Diễn đạt mạch lạc, đúng chính tả."}]}]}
