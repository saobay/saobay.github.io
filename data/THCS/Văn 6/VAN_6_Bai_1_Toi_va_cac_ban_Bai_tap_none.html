{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "“Bài học đường đời đầu tiên” được trích từ tác phẩm nào?", "options": ["A. Dế Mèn phiêu lưu kí", "B. Hoàng tử bé", "C. Chuyện cổ tích về loài người", "D. Bức tranh của em gái tôi"], "answer": "A", "explain": "“Bài học đường đời đầu tiên” là trích đoạn mở đầu tác phẩm “Dế Mèn phiêu lưu kí” của Tô Hoài, kể về tuổi trẻ bồng bột của Dế Mèn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả của “Dế Mèn phiêu lưu kí” là ai?", "options": ["A. Nam Cao", "B. Tô Hoài", "C. Tạ Duy Anh", "D. Võ Quảng"], "answer": "B", "explain": "Tô Hoài (1920 – 2014) là nhà văn nổi tiếng với các tác phẩm viết về loài vật, viết cho thiếu nhi; “Dế Mèn phiêu lưu kí” ra đời năm 1941.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ đơn là từ như thế nào?", "options": ["A. Từ chỉ gồm một tiếng", "B. Từ gồm hai tiếng trở lên", "C. Cụm từ có cấu tạo cố định", "D. Từ có nghĩa bóng"], "answer": "A", "explain": "Từ đơn là từ chỉ gồm một tiếng có nghĩa tạo thành, ví dụ: nhà, cây, sách, bạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Dế Choắt bị chị Cốc mổ chết?", "options": ["A. Dế Mèn trêu chọc chị Cốc rồi chui vào hang, chị Cốc tưởng Dế Choắt trêu mình", "B. Dế Choắt tự chui ra trêu chị Cốc", "C. Dế Mèn đánh Dế Choắt", "D. Dế Choắt bị chim sẻ bắt"], "answer": "A", "explain": "Dế Mèn hát trêu chị Cốc rồi nhanh chân chui tọt vào hang; chị Cốc nổi giận, trông thấy Dế Choắt ngơ ngác ngoài cửa hang liền mổ Dế Choắt túi bụi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trước lúc chết, Dế Choắt đã trăng trối điều gì với Dế Mèn?", "options": ["A. Mong Dế Mèn bỏ thói hung hăng, bồng bột, làm điều có ích cho đời", "B. Nhờ Dế Mèn trả thù chị Cốc", "C. Dặn Dế Mèn bỏ đi thật xa", "D. Không nói gì, lặng lẽ ra đi"], "answer": "A", "explain": "Dế Choắt khuyên Dế Mèn đừng hung hăng, bồng bột nữa mà nên làm điều có ích; lời trăng trối khiến Dế Mèn ân hận sâu sắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “lấp lánh” thuộc loại từ nào?", "options": ["A. Từ láy", "B. Từ ghép đẳng lập", "C. Từ ghép chính phụ", "D. Từ đơn"], "answer": "A", "explain": "“Lấp lánh” có hai tiếng lặp lại phụ âm đầu l, là từ láy bộ phận (láy âm).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tri thức truyện:", "statements": ["a) Cốt truyện là chuỗi các sự việc chính được sắp xếp theo một trình tự nhất định.", "b) Nhân vật trong truyện chỉ có thể là con người.", "c) Lời người kể chuyện là lời do chính nhân vật nói ra.", "d) “Bài học đường đời đầu tiên” được kể ở ngôi thứ nhất, người kể xưng “tôi” là Dế Mèn."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: cốt truyện gồm các sự việc chính theo trình tự. b) Sai: nhân vật có thể là con vật được nhân hóa như Dế Mèn. c) Sai: đó là lời nhân vật; lời người kể chuyện là lời của người kể lại câu chuyện. d) Đúng: truyện kể ở ngôi thứ nhất.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về từ loại tiếng Việt:", "statements": ["a) “Bàn ghế” là từ ghép đẳng lập.", "b) “Xanh xanh” là từ láy toàn bộ.", "c) “Nhà cửa” là từ láy.", "d) Từ phức gồm hai loại: từ ghép và từ láy."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: bàn và ghế bình đẳng về nghĩa. b) Đúng: hai tiếng giống nhau hoàn toàn. c) Sai: “nhà cửa” là từ ghép đẳng lập. d) Đúng: từ phức (từ 2 tiếng trở lên) gồm từ ghép và từ láy.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể lại một trải nghiệm đáng nhớ của em với bạn bè.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: mở đoạn giới thiệu trải nghiệm (khi nào, ở đâu, với ai); thân đoạn kể diễn biến theo trình tự thời gian, có xen cảm xúc, suy nghĩ, lời đối thoại; kết đoạn nêu bài học hoặc cảm nghĩ. Chấm theo bố cục, mạch kể, cảm xúc chân thành, diễn đạt."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu cảm nghĩ của em về nhân vật Dế Mèn trong “Bài học đường đời đầu tiên”.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu ấn tượng chung về Dế Mèn (khỏe mạnh nhưng kiêu căng, hung hăng); dẫn chi tiết (trêu chị Cốc, gây ra cái chết của Dế Choắt); nhận xét sự thay đổi (ân hận, biết sửa mình); rút ra bài học cho bản thân."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Nhân vật chính trong “Bài học đường đời đầu tiên” là ai?", "options": ["A. Dế Choắt", "B. Chị Cốc", "C. Dế Mèn", "D. Xén Tóc"], "answer": "C", "explain": "Dế Mèn là nhân vật chính, người kể chuyện xưng “tôi”; câu chuyện xoay quanh tuổi trẻ bồng bột và bài học đầu đời của chú.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Nếu cậu muốn có một người bạn...” được trích từ tác phẩm nào?", "options": ["A. Dế Mèn phiêu lưu kí", "B. Hoàng tử bé", "C. Mây và sóng", "D. Chuyện cổ tích về loài người"], "answer": "B", "explain": "Đây là trích đoạn trong “Hoàng tử bé” của Saint-Exupéry, ghi lại cuộc trò chuyện giữa hoàng tử bé và cáo về cách kết bạn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thành ngữ là gì?", "options": ["A. Cụm từ có cấu tạo cố định, thường mang ý nghĩa hàm ẩn", "B. Từ chỉ gồm một tiếng", "C. Câu kể đơn giản", "D. Từ có hai nghĩa"], "answer": "A", "explain": "Thành ngữ là cụm từ có cấu tạo cố định, biểu thị một ý nghĩa hoàn chỉnh, thường là nghĩa bóng, hàm ẩn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dế Mèn đã trêu chị Cốc bằng cách nào?", "options": ["A. Hát trêu chọc rồi nhanh chân chui tọt vào hang", "B. Ném đá vào tổ chị Cốc", "C. Rủ Dế Choắt cùng trêu", "D. Giả tiếng mèo kêu dọa chị Cốc"], "answer": "A", "explain": "Dế Mèn cất tiếng hát trêu chị Cốc rồi chui tọt vào hang, để mặc Dế Choắt yếu ớt ở ngoài chịu trận.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo con cáo trong “Hoàng tử bé”, tình bạn được xây dựng bằng cách nào?", "options": ["A. Sự kiên nhẫn và những nghi thức đều đặn mỗi ngày", "B. Tặng nhau những món quà đắt tiền", "C. Khoe khoang tài giỏi với nhau", "D. Gặp nhau một lần là thành bạn thân"], "answer": "A", "explain": "Cáo dạy hoàng tử bé phải “cảm hóa” nó bằng sự kiên nhẫn: mỗi ngày đến gần hơn một chút, đến đúng giờ, tạo ra những nghi thức.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "“Học thầy không tày học bạn” thuộc loại đơn vị ngôn ngữ nào?", "options": ["A. Thành ngữ", "B. Từ ghép", "C. Từ láy", "D. Từ đơn"], "answer": "A", "explain": "Đây là thành ngữ có cấu tạo cố định, ý nghĩa hàm ẩn: đề cao việc học hỏi từ bạn bè.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nhân vật Dế Mèn:", "statements": ["a) Lúc đầu truyện, Dế Mèn kiêu căng, coi thường mọi người xung quanh.", "b) Dế Mèn trêu chị Cốc là để bênh vực Dế Choắt.", "c) Sau cái chết của Dế Choắt, Dế Mèn ân hận, đắp mộ cho bạn.", "d) Bài học Dế Mèn rút ra là nên hung hăng hơn để không bị bắt nạt."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: Dế Mèn tự cho mình là giỏi, cà khịa với bà con. b) Sai: Dế Mèn trêu chị Cốc chỉ vì nghịch dại, ra oai. c) Đúng: Dế Mèn đắp mộ và hứa sửa mình. d) Sai: bài học là bỏ thói hung hăng, kiêu căng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về “Hoàng tử bé”:", "statements": ["a) Tác giả “Hoàng tử bé” là nhà văn Pháp Saint-Exupéry.", "b) Cáo bảo hoàng tử bé muốn có bạn thì phải mua quà đắt tiền.", "c) “Cảm hóa” nghĩa là tạo sự gắn bó bằng thời gian và sự chân thành.", "d) Hoàng tử bé đã kiên nhẫn mỗi ngày đến gần cáo hơn."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: cáo dạy về sự kiên nhẫn, không phải quà cáp. c) Đúng: “cảm hóa” (thuần hóa) là làm cho hai bên cần nhau, trở nên đặc biệt với nhau. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể lại một trải nghiệm em đã giúp đỡ bạn bè.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu hoàn cảnh bạn gặp khó khăn; kể việc em đã làm theo trình tự; nêu cảm xúc của em và bạn lúc đó; rút ra bài học về sự sẻ chia, giúp đỡ."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu suy nghĩ của em về ý nghĩa của tình bạn qua trích đoạn “Hoàng tử bé”.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu quan niệm của cáo về tình bạn (cần thời gian, kiên nhẫn, nghi thức); liên hệ với tình bạn của em; khẳng định tình bạn chân thành rất đáng quý."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Trong trích đoạn “Hoàng tử bé”, ai đã dạy hoàng tử bé về cách kết bạn?", "options": ["A. Con cáo", "B. Bông hồng", "C. Người phi công", "D. Con rắn"], "answer": "A", "explain": "Con cáo là nhân vật dạy hoàng tử bé bài học về “cảm hóa”, tức cách tạo dựng tình bạn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cốt truyện là gì?", "options": ["A. Chuỗi các sự việc chính được sắp xếp theo một trình tự nhất định", "B. Lời nói trực tiếp của nhân vật", "C. Lời của người kể lại câu chuyện", "D. Phần mở đầu của truyện"], "answer": "A", "explain": "Cốt truyện là hệ thống các sự việc chính tạo thành diễn biến của câu chuyện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các từ sau, từ nào là từ đơn?", "options": ["A. Bàn ghế", "B. Lấp lánh", "C. Sách", "D. Rì rào"], "answer": "C", "explain": "“Sách” chỉ gồm một tiếng nên là từ đơn; các từ còn lại đều gồm hai tiếng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhan đề “Bài học đường đời đầu tiên” có ý nghĩa gì?", "options": ["A. Bài học đầu tiên Dế Mèn rút ra khi bước vào cuộc đời", "B. Bài học ở trường của Dế Mèn", "C. Bài học Dế Mèn dạy cho Dế Choắt", "D. Bài học về cách đào hang"], "answer": "A", "explain": "Sau cái chết của Dế Choắt do trò đùa của mình gây ra, Dế Mèn rút ra bài học đầu tiên của cuộc đời: bỏ thói kiêu căng, hung hăng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “bàn ghế” thuộc loại từ ghép nào?", "options": ["A. Từ ghép đẳng lập", "B. Từ ghép chính phụ", "C. Từ láy bộ phận", "D. Từ láy toàn bộ"], "answer": "A", "explain": "“Bàn ghế” gồm hai tiếng bình đẳng về nghĩa (bàn và ghế), không tiếng nào chính, tiếng nào phụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết nào cho thấy Dế Mèn kiêu căng, tự phụ?", "options": ["A. Cà khịa với tất cả bà con trong xóm, tự cho mình là tay ghê gớm", "B. Đào hang rất sâu và đẹp", "C. Hay giúp đỡ Dế Choắt", "D. Sống chan hòa với mọi người"], "answer": "A", "explain": "Dế Mèn tự đắc về vẻ cường tráng của mình, đi cà khịa, trêu chọc mọi người, coi thường Dế Choắt yếu ớt.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về từ đơn, từ phức:", "statements": ["a) Từ đơn là từ chỉ gồm một tiếng.", "b) “Sách vở” là từ ghép chính phụ.", "c) “Rì rào” là từ láy.", "d) “Long lanh” là từ ghép."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: “sách vở” là từ ghép đẳng lập. c) Đúng: lặp phụ âm đầu r. d) Sai: “long lanh” là từ láy.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về bài văn kể lại trải nghiệm:", "statements": ["a) Kể lại trải nghiệm thuộc kiểu văn bản tự sự.", "b) Khi kể trải nghiệm chỉ cần kể sự việc, không cần nêu cảm xúc.", "c) Nên kể các sự việc theo trình tự thời gian, không gian.", "d) Có thể dùng lời đối thoại để bài kể thêm sinh động."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: cần xen cảm xúc, suy nghĩ của người kể. c) Đúng: trình tự rõ ràng giúp người đọc dễ theo dõi. d) Đúng: lời nhân vật làm bài văn sinh động.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể lại một kỉ niệm đáng nhớ với người bạn thân của em.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu người bạn và kỉ niệm; kể diễn biến kỉ niệm theo trình tự; nêu cảm xúc lúc đó và bây giờ; khẳng định tình bạn đáng trân trọng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu bài học em rút ra cho bản thân từ câu chuyện của Dế Mèn.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: tóm tắt ngắn gọn sai lầm của Dế Mèn; phân tích nguyên nhân (kiêu căng, bồng bột); rút ra bài học (khiêm tốn, suy nghĩ trước khi hành động, biết nhận lỗi)."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Lời người kể chuyện là gì?", "options": ["A. Lời của người kể lại câu chuyện", "B. Lời nói trực tiếp của nhân vật", "C. Lời trong dấu ngoặc kép", "D. Lời bài hát trong truyện"], "answer": "A", "explain": "Lời người kể chuyện là lời của người đứng ra kể lại các sự việc, miêu tả nhân vật, khác với lời nhân vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Cảm hóa” trong “Hoàng tử bé” có nghĩa gần nhất với điều gì?", "options": ["A. Kết bạn bằng sự kiên nhẫn và chân thành", "B. Dùng phép thuật thu phục", "C. Mua chuộc bằng quà cáp", "D. Ra lệnh, sai khiến"], "answer": "A", "explain": "“Cảm hóa” (thuần hóa) theo lời cáo là quá trình tạo sự gắn bó: kiên nhẫn dành thời gian, tạo nghi thức để hai bên trở nên cần nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các từ sau, từ nào là từ láy?", "options": ["A. Nhà cửa", "B. Sách vở", "C. Bạn bè", "D. Rì rào"], "answer": "D", "explain": "“Rì rào” lặp phụ âm đầu r nên là từ láy; các từ còn lại là từ ghép.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ngôi kể thứ nhất trong “Bài học đường đời đầu tiên” có tác dụng gì?", "options": ["A. Câu chuyện chân thực, thể hiện rõ tâm trạng, suy nghĩ của nhân vật", "B. Kể được suy nghĩ của tất cả nhân vật", "C. Làm câu chuyện khó hiểu hơn", "D. Không có tác dụng gì đặc biệt"], "answer": "A", "explain": "Dế Mèn xưng “tôi” kể lại chính câu chuyện của mình nên người đọc cảm nhận rõ sự ân hận, dằn vặt của nhân vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Dế Mèn cảm thấy ân hận sau cái chết của Dế Choắt?", "options": ["A. Nhận ra chính thói kiêu căng, bồng bột của mình đã gây họa cho bạn", "B. Sợ chị Cốc mổ mình", "C. Tiếc không được trêu chị Cốc nữa", "D. Sợ mẹ mắng"], "answer": "A", "explain": "Dế Mèn hiểu rằng trò đùa dại dột của mình là nguyên nhân khiến Dế Choắt chết oan, từ đó dằn vặt và quyết sửa mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “xanh xanh” thuộc loại từ láy nào?", "options": ["A. Từ láy toàn bộ", "B. Từ láy bộ phận (láy âm)", "C. Từ ghép đẳng lập", "D. Từ ghép chính phụ"], "answer": "A", "explain": "“Xanh xanh” lặp lại hoàn toàn cả tiếng nên là từ láy toàn bộ, có tác dụng giảm nhẹ mức độ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tình bạn trong “Hoàng tử bé”:", "statements": ["a) Theo con cáo, tình bạn cần sự chân thành và kiên nhẫn.", "b) Cáo muốn hoàng tử bé “cảm hóa” mình để hai bên trở nên đặc biệt với nhau.", "c) Hoàng tử bé bỏ cuộc vì thấy cáo quá khó gần.", "d) Nghi thức đến đúng giờ mỗi ngày giúp tạo sự mong chờ, gắn bó."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: “cảm hóa” là tạo mối dây liên hệ đặc biệt. c) Sai: hoàng tử bé kiên nhẫn làm theo lời cáo. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về thành ngữ:", "statements": ["a) Thành ngữ có cấu tạo cố định, không thể thay đổi tùy ý.", "b) “Một cây làm chẳng nên non” khuyên con người phải dũng cảm.", "c) “Gần mực thì đen, gần đèn thì sáng” là một thành ngữ.", "d) Thành ngữ thường mang nghĩa bóng, hàm ẩn."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: câu này khuyên về tinh thần đoàn kết. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể lại trải nghiệm lần đầu tiên em làm quen với bạn mới.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu hoàn cảnh (ngày đầu đến lớp, chuyển trường); kể diễn biến cuộc làm quen; nêu cảm xúc bỡ ngỡ rồi thân thiết; rút ra ý nghĩa của tình bạn mới."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu cảm nghĩ của em về nhân vật con cáo trong “Hoàng tử bé”.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nhận xét cáo là nhân vật khôn ngoan, chân thành; dẫn lời dạy về “cảm hóa”; nêu bài học về cách gìn giữ tình bạn; liên hệ bản thân."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Vì trò đùa dại dột của Dế Mèn, ai đã phải chết oan?", "options": ["A. Dế Choắt", "B. Chị Cốc", "C. Xén Tóc", "D. Bọ Ngựa"], "answer": "A", "explain": "Chị Cốc nổi giận vì bị trêu đã mổ chết Dế Choắt yếu ớt đang đứng ngơ ngác ngoài cửa hang.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lời nhân vật là gì?", "options": ["A. Lời nói trực tiếp của nhân vật (đối thoại, độc thoại)", "B. Lời của người kể lại câu chuyện", "C. Lời dẫn truyện của tác giả", "D. Lời bình của người đọc"], "answer": "A", "explain": "Lời nhân vật là lời nói, suy nghĩ trực tiếp của nhân vật, thường đặt trong dấu ngoặc kép hoặc sau dấu gạch ngang.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các từ sau, từ nào là từ ghép?", "options": ["A. Sách vở", "B. Lấp lánh", "C. Rì rào", "D. Mênh mông"], "answer": "A", "explain": "“Sách vở” do hai tiếng có nghĩa ghép lại nên là từ ghép; các từ còn lại là từ láy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh Dế Choắt gợi cho người đọc nghĩ về điều gì?", "options": ["A. Những người yếu thế cần được cảm thông, giúp đỡ", "B. Kẻ xấu cần bị trừng trị", "C. Người giàu có, quyền lực", "D. Kẻ lười biếng"], "answer": "A", "explain": "Dế Choắt gầy gò, yếu ớt, hiền lành là hình ảnh của những người yếu thế trong cuộc sống, cần sự cảm thông thay vì coi thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân biệt hai từ “nhà cửa” và “nhấp nhô”:", "options": ["A. “Nhà cửa” là từ ghép, “nhấp nhô” là từ láy", "B. Cả hai đều là từ ghép", "C. Cả hai đều là từ láy", "D. “Nhà cửa” là từ láy, “nhấp nhô” là từ ghép"], "answer": "A", "explain": "“Nhà cửa” do hai tiếng có nghĩa ghép lại; “nhấp nhô” lặp vần âp nên là từ láy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoàng tử bé đã làm gì để “cảm hóa” con cáo?", "options": ["A. Mỗi ngày đến gần cáo hơn một chút, ngồi im lặng bên cáo", "B. Cho cáo ăn thật nhiều", "C. Buộc dây dắt cáo đi", "D. Hát cho cáo nghe"], "answer": "A", "explain": "Hoàng tử bé kiên nhẫn mỗi ngày xích lại gần cáo hơn, ngồi im lặng, đến đúng giờ như lời cáo dặn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tác phẩm “Dế Mèn phiêu lưu kí”:", "statements": ["a) Tô Hoài sáng tác “Dế Mèn phiêu lưu kí” năm 1941.", "b) Đây là truyện đồng thoại, nhân vật là loài vật được nhân hóa.", "c) Chị Cốc đã mổ chết Dế Mèn.", "d) Dế Choắt là người bạn yếu ớt, hiền lành của Dế Mèn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: truyện viết về thế giới loài vật như con người. c) Sai: chị Cốc mổ chết Dế Choắt. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về từ ghép, từ láy:", "statements": ["a) “Quần áo” là từ ghép đẳng lập.", "b) “Mênh mông” là từ láy.", "c) Từ ghép chính phụ gồm tiếng chính và tiếng phụ, ví dụ “bà ngoại”.", "d) “Đi đứng” là từ láy."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: lặp vần ênh. c) Đúng: “ngoại” là tiếng phụ chỉ loại. d) Sai: “đi đứng” là từ ghép đẳng lập.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể lại một trải nghiệm em mắc lỗi và biết sửa lỗi.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu lỗi em mắc phải; kể diễn biến sự việc theo trình tự; nêu cảm xúc ân hận lúc đó; kể cách em sửa lỗi và bài học rút ra."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu giới thiệu về một người bạn tốt của em.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu chung về người bạn; kể tính cách, việc làm tốt của bạn (có dẫn chứng cụ thể); nêu cảm xúc, mong muốn giữ gìn tình bạn."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Lúc đầu truyện, Dế Mèn có tính cách nổi bật nào?", "options": ["A. Kiêu căng, hung hăng", "B. Hiền lành, nhút nhát", "C. Chăm chỉ, cần cù", "D. Thông minh, điềm đạm"], "answer": "A", "explain": "Dế Mèn khỏe mạnh nên sinh kiêu căng, hay cà khịa, trêu chọc mọi người, coi thường Dế Choắt yếu ớt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân vật trong truyện có thể là ai?", "options": ["A. Con người hoặc con vật, đồ vật được nhân hóa", "B. Chỉ có thể là con người", "C. Chỉ có thể là thần thánh", "D. Chỉ có thể là tác giả"], "answer": "A", "explain": "Nhân vật là hình tượng con người, con vật, đồ vật được nhân hóa, là yếu tố trung tâm của truyện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thành ngữ “Một cây làm chẳng nên non, ba cây chụm lại nên hòn núi cao” khuyên con người điều gì?", "options": ["A. Phải đoàn kết", "B. Phải chăm chỉ", "C. Phải tiết kiệm", "D. Phải dũng cảm"], "answer": "A", "explain": "Thành ngữ dùng hình ảnh cây để khuyên về tinh thần đoàn kết: một mình thì yếu, nhiều người hợp sức thì mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ đầu đến cuối truyện, Dế Mèn đã thay đổi như thế nào?", "options": ["A. Từ kiêu căng, hung hăng trở thành ân hận, biết sửa mình", "B. Từ hiền lành trở thành hung dữ", "C. Không thay đổi gì", "D. Từ dũng cảm trở thành nhút nhát"], "answer": "A", "explain": "Cái chết của Dế Choắt là bước ngoặt khiến Dế Mèn nhận ra sai lầm, ân hận và quyết tâm sửa chữa, làm điều có ích.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết “nghi thức” (đến đúng giờ mỗi ngày) trong “Hoàng tử bé” có ý nghĩa gì?", "options": ["A. Tạo sự gắn bó, mong chờ trong tình bạn", "B. Thể hiện sự nghiêm khắc", "C. Để cáo dễ bắt nạt", "D. Không có ý nghĩa gì"], "answer": "A", "explain": "Nghi thức làm cho mỗi ngày trở nên khác biệt, tạo sự mong chờ, háo hức – đó là cách vun đắp tình bạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để bài văn kể lại trải nghiệm thêm sinh động, người viết nên làm gì?", "options": ["A. Dùng lời đối thoại, miêu tả chi tiết, xen cảm xúc", "B. Chỉ liệt kê sự việc khô khan", "C. Viết thật dài, lan man", "D. Không nêu cảm xúc cá nhân"], "answer": "A", "explain": "Lời nhân vật, chi tiết miêu tả và cảm xúc chân thành làm cho bài kể hấp dẫn, gợi hình, gợi cảm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về truyện “Bài học đường đời đầu tiên”:", "statements": ["a) Truyện được trích từ “Dế Mèn phiêu lưu kí” của Tô Hoài.", "b) Dế Choắt là nhân vật hung hăng, hay bắt nạt kẻ khác.", "c) Lời trăng trối của Dế Choắt là lời nhân vật.", "d) Cốt truyện gồm: Dế Mèn kiêu căng — trêu chị Cốc — Dế Choắt chết — Dế Mèn ân hận."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: Dế Choắt hiền lành, yếu ớt. c) Đúng: lời nói trực tiếp của Dế Choắt. d) Đúng: đó là chuỗi sự việc chính.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về từ tiếng Việt:", "statements": ["a) “Bạn bè” là từ ghép.", "b) “Thánh thót” là từ láy.", "c) “Vui vẻ” là từ ghép.", "d) Thành ngữ “Học thầy không tày học bạn” đề cao việc học hỏi ở bạn bè."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: từ ghép đẳng lập. b) Đúng: lặp vần anh/ót? “thánh thót” lặp vần át/ót – là từ láy. c) Sai: “vui vẻ” là từ láy. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể lại trải nghiệm em tham gia một hoạt động tập thể cùng bạn bè.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu hoạt động (khi nào, ở đâu, với ai); kể diễn biến hoạt động theo trình tự; nêu cảm xúc, kỉ niệm đáng nhớ; rút ra ý nghĩa của tinh thần tập thể."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu suy nghĩ của em về thói kiêu căng trong cuộc sống.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu biểu hiện của thói kiêu căng (qua Dế Mèn hoặc thực tế); phân tích tác hại; rút ra bài học về sự khiêm tốn, biết lắng nghe."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "“Bài học đường đời đầu tiên” được kể theo ngôi thứ mấy?", "options": ["A. Ngôi thứ nhất", "B. Ngôi thứ hai", "C. Ngôi thứ ba", "D. Không xác định được"], "answer": "A", "explain": "Người kể chuyện xưng “tôi” chính là Dế Mèn, nên truyện được kể ở ngôi thứ nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân vật xưng “tôi” trong truyện “Bài học đường đời đầu tiên” là ai?", "options": ["A. Dế Mèn", "B. Dế Choắt", "C. Chị Cốc", "D. Tô Hoài"], "answer": "A", "explain": "Dế Mèn vừa là nhân vật chính vừa là người kể chuyện, xưng “tôi” suốt truyện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ phức gồm những loại nào?", "options": ["A. Từ ghép và từ láy", "B. Từ đơn và từ ghép", "C. Từ láy và thành ngữ", "D. Từ đơn và từ phức"], "answer": "A", "explain": "Từ phức là từ gồm hai tiếng trở lên, chia thành từ ghép và từ láy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ngoại hình của Dế Choắt được miêu tả như thế nào?", "options": ["A. Gầy gò, yếu ớt: cánh ngắn ngủn, càng bè bè", "B. To khỏe, cường tráng như Dế Mèn", "C. Đẹp đẽ, sặc sỡ", "D. Nhỏ nhắn, nhanh nhẹn"], "answer": "A", "explain": "Dế Choắt được miêu tả gầy gò, ốm yếu – tương phản với vẻ cường tráng của Dế Mèn, gợi sự thương cảm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mở bài của bài văn kể lại một trải nghiệm nên làm gì?", "options": ["A. Giới thiệu trải nghiệm: thời gian, địa điểm, nhân vật liên quan", "B. Kể ngay diễn biến chi tiết", "C. Nêu bài học rút ra", "D. Tả cảnh thiên nhiên"], "answer": "A", "explain": "Mở bài giới thiệu khái quát về trải nghiệm để người đọc hình dung bối cảnh câu chuyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “long lanh” thuộc loại từ láy nào?", "options": ["A. Từ láy bộ phận (láy âm đầu)", "B. Từ láy toàn bộ", "C. Từ ghép đẳng lập", "D. Từ ghép chính phụ"], "answer": "A", "explain": "“Long lanh” lặp lại phụ âm đầu l, chỉ láy một bộ phận của tiếng nên là từ láy bộ phận.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tình bạn trong “Hoàng tử bé”:", "statements": ["a) “Hoàng tử bé” là tác phẩm nổi tiếng của Saint-Exupéry.", "b) Con cáo là nhân vật dạy hoàng tử bé bài học về tình bạn.", "c) Muốn có bạn, theo lời cáo, cần kiên nhẫn dành thời gian.", "d) Hoàng tử bé và cáo trở thành bạn thân ngay từ lần gặp đầu tiên."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: đó là ý nghĩa của “cảm hóa”. d) Sai: tình bạn cần thời gian vun đắp.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nói và nghe:", "statements": ["a) Kể lại trải nghiệm trước lớp cần kể rõ ràng, mạch lạc.", "b) Khi kể có thể kết hợp điệu bộ, nét mặt để thêm sinh động.", "c) Người nghe không cần đặt câu hỏi trao đổi.", "d) Kết thúc phần kể nên nêu bài học hoặc cảm nghĩ của mình."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: trao đổi, đặt câu hỏi giúp buổi nói và nghe hiệu quả. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể lại trải nghiệm một chuyến đi dã ngoại cùng lớp của em.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu chuyến đi (khi nào, ở đâu, với ai); kể các hoạt động theo trình tự; nêu kỉ niệm vui nhất và cảm xúc; rút ra ý nghĩa."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu cảm nghĩ của em về một tình bạn đẹp mà em biết.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu đôi bạn (có thể là bạn của em hoặc trong sách); kể việc làm thể hiện tình bạn đẹp; nêu cảm xúc, mong muốn của em."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Nghệ thuật nổi bật của “Dế Mèn phiêu lưu kí” là gì?", "options": ["A. Nhân hóa loài vật", "B. Sử dụng thơ ca", "C. Kể chuyện bằng tranh", "D. Dùng ngôn ngữ khoa học"], "answer": "A", "explain": "Tô Hoài xây dựng thế giới loài dế, loài vật có suy nghĩ, hành động, nói năng như con người – đó là nghệ thuật nhân hóa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Viết “kể lại một trải nghiệm của em” thuộc kiểu bài nào?", "options": ["A. Tự sự", "B. Miêu tả", "C. Biểu cảm", "D. Nghị luận"], "answer": "A", "explain": "Kể lại trải nghiệm là kể lại chuỗi sự việc đã xảy ra với bản thân, thuộc phương thức tự sự.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ nào dưới đây là từ đơn?", "options": ["A. Hoa lá", "B. Xinh xắn", "C. Cây", "D. Rực rỡ"], "answer": "C", "explain": "“Cây” chỉ gồm một tiếng nên là từ đơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thân bài của bài văn kể lại trải nghiệm cần làm gì?", "options": ["A. Kể diễn biến sự việc theo trình tự, xen cảm xúc, suy nghĩ", "B. Chỉ nêu bài học", "C. Giới thiệu nhân vật", "D. Tả cảnh là chính"], "answer": "A", "explain": "Thân bài là phần chính: kể lại diễn biến theo trình tự thời gian, kết hợp miêu tả và bộc lộ cảm xúc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kết bài của bài văn kể lại trải nghiệm thường nêu điều gì?", "options": ["A. Bài học rút ra và cảm nghĩ của người viết", "B. Diễn biến chi tiết", "C. Lời đối thoại dài", "D. Tả ngoại hình nhân vật"], "answer": "A", "explain": "Kết bài khép lại câu chuyện bằng cảm nghĩ, bài học mà người viết rút ra từ trải nghiệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thành ngữ nào sau đây nói về tình bạn, tình nghĩa vợ chồng?", "options": ["A. “Giàu vì bạn, sang vì vợ”", "B. “Chân lấm tay bùn”", "C. “Mẹ tròn con vuông”", "D. “Học một biết mười”"], "answer": "A", "explain": "“Giàu vì bạn, sang vì vợ” khẳng định vai trò của bạn bè và người vợ trong cuộc sống mỗi người.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về các nhân vật trong truyện:", "statements": ["a) Dế Mèn là nhân vật chính, có sự thay đổi trong tính cách.", "b) Chị Cốc là nhân vật hiền lành, nhút nhát.", "c) Dế Choắt yếu ớt nhưng giàu tình nghĩa.", "d) Lời người kể chuyện trong truyện là lời của Dế Choắt."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: từ kiêu căng thành ân hận. b) Sai: chị Cốc hung dữ. c) Đúng: lời trăng trối đầy tình nghĩa. d) Sai: người kể chuyện là Dế Mèn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về từ tiếng Việt:", "statements": ["a) “Trường”, “lớp”, “bạn” đều là từ đơn.", "b) “Đẹp đẽ” là từ láy.", "c) “Học hành” là từ láy.", "d) Từ phức là từ gồm hai tiếng trở lên."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: mỗi từ một tiếng. b) Đúng: lặp vần ẽ. c) Sai: “học hành” là từ ghép đẳng lập. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể lại trải nghiệm em giúp đỡ một người gặp khó khăn.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu người gặp khó khăn và hoàn cảnh; kể việc em đã giúp theo trình tự; nêu cảm xúc của em sau việc làm; rút ra bài học về lòng nhân ái."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu cảm nghĩ của em về nhân vật Dế Choắt.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nhận xét ngoại hình yếu ớt, tính cách hiền lành; dẫn lời trăng trối giàu tình nghĩa; bày tỏ sự thương cảm; rút ra bài học về cách đối xử với người yếu thế."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Sau cái chết của Dế Choắt, Dế Mèn đã làm gì?", "options": ["A. Ân hận, đắp mộ cho bạn và hứa sẽ sửa mình", "B. Bỏ đi nơi khác ngay lập tức", "C. Tiếp tục trêu chọc mọi người", "D. Đổ lỗi cho Dế Choắt"], "answer": "A", "explain": "Dế Mèn đắp mộ cho Dế Choắt, đứng lặng hồi lâu, ân hận và tự hứa sẽ bỏ thói hung hăng, làm điều có ích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài học chính rút ra từ “Bài học đường đời đầu tiên” là gì?", "options": ["A. Không nên kiêu căng, coi thường người khác; biết nhận lỗi và sửa mình", "B. Nên sống khép kín, tránh xa mọi người", "C. Phải luôn hung hăng để tự vệ", "D. Không nên kết bạn"], "answer": "A", "explain": "Câu chuyện phê phán thói kiêu căng, bồng bột và ca ngợi sự dũng cảm nhận lỗi, sửa mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi kể lại một trải nghiệm, người viết cần chú ý điều gì?", "options": ["A. Kể theo trình tự rõ ràng và nêu cảm xúc, suy nghĩ của mình", "B. Bịa thêm nhiều chi tiết giật gân", "C. Viết càng dài càng tốt", "D. Không cần nêu cảm xúc"], "answer": "A", "explain": "Bài kể cần trung thực, có trình tự và thể hiện cảm xúc, suy nghĩ chân thành của người kể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo con cáo, tình bạn cần điều gì nhất?", "options": ["A. Thời gian và sự kiên nhẫn", "B. Tiền bạc và quà cáp", "C. Sự giống nhau về ngoại hình", "D. Lời hứa suông"], "answer": "A", "explain": "Cáo nhấn mạnh phải kiên nhẫn, dành thời gian mỗi ngày, tạo nghi thức – tình bạn không thể vội vàng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ “đi đứng” thuộc loại từ nào?", "options": ["A. Từ ghép đẳng lập", "B. Từ ghép chính phụ", "C. Từ láy bộ phận", "D. Từ láy toàn bộ"], "answer": "A", "explain": "“Đi đứng” gồm hai tiếng bình đẳng về nghĩa, chỉ hoạt động chung nên là từ ghép đẳng lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nói và nghe “kể lại một trải nghiệm”, người nói cần đáp ứng yêu cầu nào?", "options": ["A. Kể rõ ràng, mạch lạc, thể hiện được cảm xúc", "B. Đọc thuộc lòng bài văn mẫu", "C. Nói thật nhanh cho hết giờ", "D. Không cần nhìn người nghe"], "answer": "A", "explain": "Người nói cần trình bày rõ ràng, mạch lạc, kết hợp giọng điệu, điệu bộ để người nghe dễ theo dõi, đồng cảm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về các yếu tố của truyện:", "statements": ["a) Lời nhân vật thường đặt trong dấu ngoặc kép hoặc sau dấu gạch ngang đầu dòng.", "b) Cốt truyện không cần sắp xếp các sự việc theo trình tự.", "c) Nhân vật chính là nhân vật giữ vai trò trung tâm của truyện.", "d) “Bài học đường đời đầu tiên” có cốt truyện đơn giản, dễ hiểu."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: đó là cách trình bày lời đối thoại, độc thoại. b) Sai: cốt truyện là chuỗi sự việc theo trình tự nhất định. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về đặc điểm của thành ngữ:", "statements": ["a) “Lá lành đùm lá rách” là một thành ngữ.", "b) “Chân cứng đá mềm” là một thành ngữ.", "c) “Nước chảy đá mòn” là một thành ngữ.", "d) “Có công mài sắt, có ngày nên kim” là một thành ngữ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: đều là cụm từ cố định mang nghĩa hàm ẩn. d) Sai: đây là tục ngữ (câu hoàn chỉnh đúc kết kinh nghiệm).", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể lại trải nghiệm lần đầu tiên em làm một việc tốt.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu việc tốt em đã làm; kể diễn biến theo trình tự; nêu cảm xúc vui sướng, tự hào; rút ra ý nghĩa của việc làm tốt."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu suy nghĩ của em về ý nghĩa của lời xin lỗi trong cuộc sống.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu vai trò của lời xin lỗi (như Dế Mèn ân hận); dẫn ví dụ thực tế; phân tích tác dụng hàn gắn tình cảm; rút ra bài học."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Saint-Exupéry, tác giả của “Hoàng tử bé”, là nhà văn nước nào?", "options": ["A. Pháp", "B. Việt Nam", "C. Ấn Độ", "D. Nga"], "answer": "A", "explain": "Antoine de Saint-Exupéry (1900 – 1944) là nhà văn, phi công người Pháp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân vật con cáo trong “Hoàng tử bé” tượng trưng cho hình ảnh nào?", "options": ["A. Người bạn khôn ngoan, chân thành", "B. Kẻ gian xảo, lừa lọc", "C. Người xa lạ lạnh lùng", "D. Kẻ thù nguy hiểm"], "answer": "A", "explain": "Cáo là người bạn khôn ngoan, dạy hoàng tử bé bài học sâu sắc về tình bạn bằng sự chân thành.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Chân lấm tay bùn” thuộc loại đơn vị ngôn ngữ nào?", "options": ["A. Thành ngữ", "B. Từ ghép", "C. Từ láy", "D. Từ đơn"], "answer": "A", "explain": "“Chân lấm tay bùn” là thành ngữ cố định, dùng để chỉ người lao động vất vả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao có thể nói tình bạn giữa hoàng tử bé và cáo là sâu sắc?", "options": ["A. Được vun đắp bằng thời gian, sự kiên nhẫn và những nghi thức đều đặn", "B. Vì cáo cho hoàng tử bé nhiều quà", "C. Vì hai bên gặp nhau tình cờ một lần", "D. Vì cáo nghe lời hoàng tử bé răm rắp"], "answer": "A", "explain": "Tình bạn ấy được xây dựng từng ngày bằng sự kiên nhẫn và nghi thức, khiến hai bên trở nên đặc biệt với nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "“Mẹ tròn con vuông” thuộc loại đơn vị ngôn ngữ nào?", "options": ["A. Thành ngữ", "B. Từ ghép đẳng lập", "C. Từ láy toàn bộ", "D. Tục ngữ"], "answer": "A", "explain": "Đây là thành ngữ có cấu tạo cố định, chúc mẹ sinh con bình an, khỏe mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để nhận biết một từ láy, ta dựa vào dấu hiệu nào?", "options": ["A. Các tiếng trong từ có phần âm hoặc phần vần lặp lại nhau", "B. Từ có hai tiếng trở lên", "C. Từ mang nghĩa bóng", "D. Từ đứng trước danh từ"], "answer": "A", "explain": "Từ láy có quan hệ láy âm (lặp phụ âm đầu) hoặc láy vần giữa các tiếng, ví dụ: lấp lánh, rì rào, mênh mông.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về hai tác phẩm của Bài 1:", "statements": ["a) Cả “Dế Mèn phiêu lưu kí” và “Hoàng tử bé” đều gửi gắm bài học về cách sống, cách ứng xử.", "b) “Hoàng tử bé” là truyện viết cho thiếu nhi của một nhà văn Việt Nam.", "c) Dế Mèn đã rút ra bài học sau khi gây ra cái chết thương tâm cho bạn.", "d) Hai tác phẩm đều thuộc thể loại truyện."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: tác giả là nhà văn Pháp Saint-Exupéry. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về từ đơn, từ phức và thành ngữ:", "statements": ["a) “Tươi tốt” là từ láy.", "b) “Ruộng vườn” là từ ghép.", "c) “Nhỏ nhen” là từ ghép.", "d) “Đầu xuôi đuôi lọt” là thành ngữ chỉ mọi việc thuận lợi từ đầu đến cuối."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: lặp vần ươi/ốt. b) Đúng: từ ghép đẳng lập. c) Sai: “nhỏ nhen” là từ láy. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể lại trải nghiệm đáng nhớ nhất của em trong năm học này.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu trải nghiệm; kể diễn biến theo trình tự thời gian; nêu cảm xúc sâu sắc nhất; rút ra bài học hoặc mong muốn."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu mong muốn của em về tình bạn trong những năm học tới.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu mong muốn có thêm bạn tốt; lí giải vì sao tình bạn quan trọng (dẫn bài học từ “Hoàng tử bé”); nêu việc em sẽ làm để gìn giữ tình bạn."}]}]}
