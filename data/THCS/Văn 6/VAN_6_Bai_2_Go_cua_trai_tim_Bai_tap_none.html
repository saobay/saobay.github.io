phẩm của ai?", "options": ["A. Tạ Duy Anh", "B. Tô Hoài", "C. Xuân Quỳnh", "D. Tagore"], "answer": "A", "explain": "Tạ Duy Anh là tác giả truyện ngắn “Bức tranh của em gái tôi”, viết về tình anh em trong gia đình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân vật em gái trong “Bức tranh của em gái tôi” tên là gì?", "options": ["A. Kiều Phương", "B. Kiều Mai", "C. Thu Phương", "D. Hoài An"], "answer": "A", "explain": "Em gái tên là Kiều Phương, ở nhà thường gọi là Mèo, có tài năng hội họa đặc biệt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ đồng âm là gì?", "options": ["A. Những từ phát âm giống nhau nhưng nghĩa khác nhau", "B. Một từ có nhiều nghĩa", "C. Những từ có nghĩa giống nhau", "D. Những từ có nghĩa trái ngược nhau"], "answer": "A", "explain": "Từ đồng âm giống nhau về âm thanh nhưng khác nhau hoàn toàn về nghĩa, ví dụ “đường” (lối đi) và “đường” (chất ngọt).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kiều Phương có tài năng đặc biệt gì?", "options": ["A. Vẽ tranh", "B. Hát hay", "C. Chơi đàn", "D. Làm thơ"], "answer": "A", "explain": "Kiều Phương có năng khiếu hội họa bẩm sinh: vẽ rất đẹp, tranh của em đoạt giải thưởng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "“Chân” trong “chân người”, “chân bàn”, “chân trời” là hiện tượng gì?", "options": ["A. Từ đa nghĩa", "B. Từ đồng âm", "C. Từ đồng nghĩa", "D. Từ trái nghĩa"], "answer": "A", "explain": "Các nghĩa của “chân” đều chỉ bộ phận phía dưới, có liên hệ với nhau nên là từ đa nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhịp trong thơ là gì?", "options": ["A. Sự ngắt nhịp tạo tiết tấu khi đọc thơ", "B. Số dòng trong bài thơ", "C. Tên tác giả bài thơ", "D. Phần chú thích bài thơ"], "answer": "A", "explain": "Nhịp là cách ngắt giọng khi đọc thơ, tạo nên tiết tấu, nhạc điệu cho bài thơ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về truyện “Bức tranh của em gái tôi”:", "statements": ["a) Nhân vật “tôi” là người anh, câu chuyện được kể ở ngôi thứ nhất.", "b) Lúc đầu, người anh có thái độ ghen tị, xem thường em gái.", "c) Bức tranh đoạt giải của Kiều Phương vẽ phong cảnh quê hương.", "d) Cuối truyện, người anh cảm thấy xấu hổ, ân hận về sự ích kỉ của mình."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: người anh ghen tị với tài năng của em. c) Sai: bức tranh vẽ chân dung người anh trai. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nghĩa của từ:", "statements": ["a) “Lá” trong “lá cây” và “lá thư” là từ đa nghĩa.", "b) “Sao” trong “ngôi sao” và “sao chép” là từ đồng âm.", "c) “Cổ” trong “cổ tích” và “cổ áo” là từ đa nghĩa.", "d) Nghĩa bóng là nghĩa được suy ra từ nghĩa đen."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đều chỉ vật mỏng, dẹt. b) Đúng: nghĩa không liên quan. c) Sai: “cổ” (xưa) và “cổ” (bộ phận cơ thể) nghĩa không liên quan nên là từ đồng âm. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu cảm nghĩ của em về nhân vật Kiều Phương trong “Bức tranh của em gái tôi”.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nhận xét tài năng và tâm hồn trong sáng, nhân hậu của Kiều Phương; dẫn chi tiết bức tranh vẽ anh trai; bày tỏ sự yêu mến, khâm phục; rút ra bài học."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu cảm nghĩ của em về nhân vật người anh trong “Bức tranh của em gái tôi”.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nhận xét sự thay đổi của người anh (từ ghen tị đến ân hận); dẫn chi tiết chứng minh; đánh giá cao dũng cảm nhận lỗi; liên hệ bản thân."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Bài thơ “Chuyện cổ tích về loài người” được viết theo thể thơ nào?", "options": ["A. Thơ năm chữ", "B. Thơ bảy chữ", "C. Thơ lục bát", "D. Thơ tám chữ"], "answer": "A", "explain": "Mỗi dòng thơ trong bài có năm tiếng, gieo vần chân, ngắt nhịp 2/3 hoặc 3/2.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài thơ “Mây và sóng” được viết theo thể thơ nào?", "options": ["A. Thơ văn xuôi (thơ tự do)", "B. Thơ năm chữ", "C. Thơ lục bát", "D. Thơ bảy chữ"], "answer": "A", "explain": "“Mây và sóng” không chia dòng theo số tiếng cố định, gần với văn xuôi nên gọi là thơ văn xuôi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ đa nghĩa là gì?", "options": ["A. Một từ có nhiều nghĩa liên quan đến nhau", "B. Những từ phát âm giống nhau", "C. Những từ có nghĩa giống nhau", "D. Những từ có nghĩa trái ngược nhau"], "answer": "A", "explain": "Từ đa nghĩa là một từ có hai nghĩa trở lên, các nghĩa có mối liên hệ với nhau, ví dụ “mũi”, “chân”, “lá”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Người anh trong “Bức tranh của em gái tôi” đã thay đổi như thế nào?", "options": ["A. Từ ghen tị, lạnh nhạt với em trở thành cảm động, biết ơn em", "B. Từ yêu thương em trở thành ghét em", "C. Không thay đổi gì", "D. Từ chăm học trở thành lười biếng"], "answer": "A", "explain": "Khi nhìn bức tranh em vẽ mình với ánh mắt nhân hậu, người anh xấu hổ về sự ích kỉ và cảm động trước tình cảm của em.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vần trong thơ năm chữ “Chuyện cổ tích về loài người” thường là vần gì?", "options": ["A. Vần chân (gieo ở cuối dòng thơ)", "B. Vần lưng (gieo giữa dòng thơ)", "C. Không có vần", "D. Vần ôm"], "answer": "A", "explain": "Thơ năm chữ thường gieo vần chân, tức các tiếng cuối dòng thơ hiệp vần với nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh thơ là gì?", "options": ["A. Hình ảnh gợi cảm được tạo nên bằng ngôn từ trong thơ", "B. Tranh minh họa in kèm bài thơ", "C. Ảnh chân dung tác giả", "D. Hình vẽ trong sách giáo khoa"], "answer": "A", "explain": "Hình ảnh thơ là những hình ảnh sinh động, gợi cảm do nhà thơ tạo nên bằng ngôn từ, ví dụ “mặt trời”, “mây”, “sóng”.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nghệ thuật hai bài thơ:", "statements": ["a) “Mây và sóng” sử dụng hình thức đối thoại tưởng tượng giữa em bé với mây, sóng.", "b) Phép điệp ngữ giúp tạo nhịp điệu cho bài thơ “Mây và sóng”.", "c) Hình ảnh “mây”, “sóng” gợi sự tự do, bay bổng của tuổi thơ.", "d) Bài thơ “Chuyện cổ tích về loài người” không sử dụng vần."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: điệp cấu trúc “Mây ơi... Sóng ơi...”. c) Đúng. d) Sai: thơ năm chữ có gieo vần chân.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về đoạn văn ghi lại cảm xúc:", "statements": ["a) Đoạn văn cần thể hiện cảm xúc chân thành của người viết về bài thơ.", "b) Cần dẫn ra câu thơ, hình ảnh cụ thể làm dẫn chứng.", "c) Chỉ cần tóm tắt nội dung bài thơ là đủ.", "d) Kết đoạn nên khẳng định lại cảm xúc, ấn tượng của mình."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: dẫn chứng làm cảm xúc có cơ sở. c) Sai: trọng tâm là cảm xúc, không phải tóm tắt. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu ghi lại cảm xúc của em về tình anh em qua truyện “Bức tranh của em gái tôi”.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu tình huống anh em trong truyện; cảm xúc trước tấm lòng nhân hậu của Kiều Phương và sự ân hận của người anh; liên hệ tình cảm anh chị em trong gia đình mình."}, {"type": "essay", "level": "VDC", "q": "Trình bày ý kiến của em (khoảng 5 – 7 câu) về vấn đề: vì sao không nên ghen tị với thành công của bạn bè.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu ý kiến rõ ràng (ghen tị là xấu); đưa lí lẽ (ghen tị làm mất tình bạn, cản trở bản thân tiến bộ – dẫn người anh trong truyện); kết luận nên học hỏi, chúc mừng bạn."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Trong bài thơ “Chuyện cổ tích về loài người”, mọi thứ trên trái đất sinh ra vì ai?", "options": ["A. Vì trẻ em, vì con người", "B. Vì các loài vật", "C. Vì thần linh", "D. Vì cây cỏ"], "answer": "A", "explain": "Bài thơ khẳng định: trời sinh ra trước nhất chỉ toàn trẻ con; mặt trời, cây cỏ... đều xuất hiện vì con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xuân Quỳnh là nhà thơ nổi tiếng với đề tài nào?", "options": ["A. Tình yêu, hạnh phúc đời thường và thơ thiếu nhi", "B. Chiến tranh cách mạng", "C. Thiên nhiên hùng vĩ", "D. Lịch sử dân tộc"], "answer": "A", "explain": "Thơ Xuân Quỳnh giàu cảm xúc về tình yêu, hạnh phúc gia đình và dành nhiều bài thơ trong sáng cho thiếu nhi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nghĩa đen của từ là gì?", "options": ["A. Nghĩa gốc, trực tiếp của từ", "B. Nghĩa suy ra từ nghĩa khác", "C. Nghĩa trong thành ngữ", "D. Nghĩa của từ láy"], "answer": "A", "explain": "Nghĩa đen là nghĩa gốc, trực tiếp biểu thị sự vật; từ nghĩa đen có thể phát triển thành nghĩa bóng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết Kiều Phương vẽ bức tranh chân dung người anh cho thấy em là người như thế nào?", "options": ["A. Nhân hậu, yêu thương anh dù bị anh xem thường", "B. Kiêu căng, khoe khoang", "C. Giận dỗi anh trai", "D. Vô tâm, lạnh lùng"], "answer": "A", "explain": "Dù bị anh ghen tị, xa lánh, Kiều Phương vẫn vẽ anh với ánh mắt nhân hậu, chứng tỏ tấm lòng trong sáng, vị tha.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "“Ăn” trong “ăn cơm” và “ăn ảnh” có nghĩa như thế nào?", "options": ["A. “Ăn cơm” là nghĩa đen, “ăn ảnh” là nghĩa bóng", "B. Cả hai đều là nghĩa đen", "C. Cả hai đều là nghĩa bóng", "D. “Ăn cơm” là nghĩa bóng, “ăn ảnh” là nghĩa đen"], "answer": "A", "explain": "“Ăn cơm” chỉ hoạt động ăn uống (nghĩa gốc); “ăn ảnh” nghĩa là lên hình đẹp, là nghĩa suy ra (nghĩa bóng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung về nội dung của hai bài thơ “Chuyện cổ tích về loài người” và “Mây và sóng” là gì?", "options": ["A. Đều ca ngợi tình yêu thương con người", "B. Đều viết về chiến tranh", "C. Đều viết về quê hương", "D. Đều là thơ trào phúng"], "answer": "A", "explain": "Bài thơ Xuân Quỳnh ca ngợi tình yêu thương trẻ thơ, nhân loại; bài thơ Tagore ca ngợi tình mẫu tử – đều hướng tới tình yêu thương con người.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về từ đa nghĩa, từ đồng âm:", "statements": ["a) “Cổ” trong “cổ chai” và “cổ tích” là từ đồng âm.", "b) “Đi” trong “đi học” và “đi chợ” là từ đa nghĩa.", "c) Một từ có thể vừa có nghĩa đen vừa có nghĩa bóng.", "d) “Ngọt” trong “đường ngọt” và “lời nói ngọt ngào” là từ đa nghĩa."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: nghĩa không liên quan. b) Sai: cùng một nghĩa chỉ hoạt động di chuyển. c) Đúng. d) Đúng: nghĩa bóng suy ra từ nghĩa đen.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nội dung truyện “Bức tranh của em gái tôi”:", "statements": ["a) Kiều Phương là cô bé hồn nhiên, trong sáng.", "b) Người anh bí mật theo dõi em vẽ vì tò mò và ghen tị.", "c) Mẹ mua cho em hộp màu thể hiện sự quan tâm của gia đình.", "d) Sau khi xem bức tranh, người anh vẫn không thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: gia đình khích lệ tài năng của em. d) Sai: người anh xấu hổ, ân hận và thay đổi.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu ghi lại cảm xúc của em về tình yêu thương con người trong thơ Xuân Quỳnh.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu cảm xúc chung (ấm áp, xúc động); dẫn hình ảnh đẹp trong bài thơ; cảm nhận về ước mơ thế giới tốt đẹp cho trẻ em; liên hệ bản thân."}, {"type": "essay", "level": "VDC", "q": "Trình bày ý kiến của em (khoảng 5 – 7 câu) về vấn đề: vì sao anh chị em trong gia đình cần yêu thương nhau.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu ý kiến (cần yêu thương, nhường nhịn); lí lẽ (gia đình là chỗ dựa, tình cảm anh em bền chặt – dẫn Kiều Phương); kết luận với mong muốn của bản thân."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Bức tranh đoạt giải thưởng của Kiều Phương vẽ ai?", "options": ["A. Người anh trai", "B. Mẹ của hai anh em", "C. Phong cảnh quê hương", "D. Cô giáo"], "answer": "A", "explain": "Bức tranh đoạt giải vẽ chân dung người anh trai với đôi mắt trong sáng, nhân hậu – điều khiến người anh vô cùng xúc động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lúc đầu, người anh có thái độ như thế nào đối với em gái?", "options": ["A. Ghen tị, xem thường", "B. Yêu thương, chiều chuộng", "C. Không quan tâm", "D. Ngưỡng mộ, học hỏi"], "answer": "A", "explain": "Người anh khó chịu khi thấy em được chú ý, lén xem trộm tranh em vẽ và có thái độ ghen tị, xem thường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhịp thơ năm chữ thường được ngắt như thế nào?", "options": ["A. Nhịp 2/3 hoặc 3/2", "B. Nhịp 4/4", "C. Nhịp 1/4", "D. Không ngắt nhịp"], "answer": "A", "explain": "Thơ năm chữ thường ngắt nhịp 2/3 (ngắt sau tiếng thứ hai) hoặc 3/2 (ngắt sau tiếng thứ ba).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa chính của truyện “Bức tranh của em gái tôi” là gì?", "options": ["A. Ca ngợi tình anh em, phê phán sự ích kỉ, ghen tị", "B. Ca ngợi tài năng hội họa", "C. Phê phán cha mẹ thiên vị", "D. Kêu gọi bảo vệ môi trường"], "answer": "A", "explain": "Truyện ca ngợi tấm lòng nhân hậu của Kiều Phương, đồng thời phê phán thói ghen tị, ích kỉ qua sự ân hận của người anh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cách phân biệt từ đồng âm và từ đa nghĩa là gì?", "options": ["A. Từ đồng âm có các nghĩa không liên quan; từ đa nghĩa có các nghĩa liên quan nhau", "B. Từ đồng âm có hai nghĩa, từ đa nghĩa có ba nghĩa", "C. Không thể phân biệt được", "D. Dựa vào số tiếng của từ"], "answer": "A", "explain": "Tiêu chí phân biệt là mối quan hệ giữa các nghĩa: liên quan nhau là đa nghĩa, không liên quan là đồng âm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi trình bày ý kiến về một vấn đề, người nói nên làm gì?", "options": ["A. Nêu ý kiến rõ ràng, sắp xếp lí lẽ, dẫn chứng theo trình tự", "B. Nói vòng vo, không rõ quan điểm", "C. Chỉ nêu ý kiến, không cần lí lẽ", "D. Đọc thuộc lòng bài mẫu"], "answer": "A", "explain": "Cần nêu rõ quan điểm của mình, đưa ra lí lẽ và dẫn chứng thuyết phục, sắp xếp mạch lạc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về thể thơ, vần, nhịp:", "statements": ["a) Thơ năm chữ mỗi dòng thơ có năm tiếng.", "b) Vần giúp bài thơ có nhạc điệu, dễ nhớ.", "c) Nhịp 2/3 trong thơ năm chữ nghĩa là ngắt sau tiếng thứ hai.", "d) Thơ văn xuôi không chia dòng, gần với văn xuôi."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: thơ văn xuôi viết thành từng đoạn như văn xuôi.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về từ đa nghĩa, từ đồng âm:", "statements": ["a) “Tay” trong “tay người” và “tay nghề” là từ đa nghĩa.", "b) “Đồng” trong “cánh đồng” và “đồng tiền” là từ đồng âm.", "c) “Mắt” trong “mắt người” và “mắt lưới” là từ đa nghĩa.", "d) “Bàn” trong “cái bàn” và “bàn bạc” là từ đa nghĩa."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đều chỉ bộ phận/công cụ làm việc. b) Đúng: nghĩa không liên quan. c) Đúng: đều chỉ lỗ/vật tròn nhỏ. d) Sai: đây là từ đồng âm.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu ghi lại cảm xúc của em về hình ảnh người mẹ trong bài thơ “Mây và sóng”.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu hình ảnh mẹ là bến bờ bình yên; cảm xúc về tình mẹ bao dung; liên hệ với mẹ của mình; bày tỏ lòng biết ơn, yêu thương."}, {"type": "essay", "level": "VDC", "q": "Trình bày ý kiến của em (khoảng 5 – 7 câu) về vấn đề: học sinh nên làm gì để giữ gìn tình bạn đẹp.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu ý kiến (cần chân thành, sẻ chia); lí lẽ (tình bạn cần vun đắp như lời cáo dạy); dẫn ví dụ; kết luận với quyết tâm của bản thân."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Cuối truyện “Bức tranh của em gái tôi”, người anh cảm thấy thế nào?", "options": ["A. Xấu hổ, ân hận về sự ích kỉ của mình", "B. Tự hào, hãnh diện", "C. Tức giận với em gái", "D. Thờ ơ, không quan tâm"], "answer": "A", "explain": "Nhìn bức tranh em vẽ mình, người anh xấu hổ vì đã ghen tị, xem thường em và thầm cảm ơn tấm lòng nhân hậu của em.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Viết đoạn văn ghi lại cảm xúc về một bài thơ cần đáp ứng yêu cầu nào?", "options": ["A. Nêu cảm xúc chân thành, có dẫn chứng từ bài thơ", "B. Chép lại toàn bộ bài thơ", "C. Chỉ tóm tắt nội dung bài thơ", "D. Phê bình tác giả"], "answer": "A", "explain": "Đoạn văn phải thể hiện cảm xúc thật của người viết, có dẫn ra câu thơ, hình ảnh cụ thể làm dẫn chứng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi trình bày ý kiến về một vấn đề, điều quan trọng nhất là gì?", "options": ["A. Nêu rõ ý kiến của mình, có lí lẽ và dẫn chứng", "B. Nói thật dài", "C. Đồng ý với mọi người", "D. Tránh nêu quan điểm cá nhân"], "answer": "A", "explain": "Phải nêu rõ mình nghĩ gì, vì sao nghĩ vậy (lí lẽ) và có ví dụ, dẫn chứng thuyết phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong “Mây và sóng”, em bé đã tưởng tượng trò chơi nào với mẹ?", "options": ["A. Em làm con sóng, mẹ làm bến bờ; hai mẹ con cùng chơi đùa", "B. Em làm đám mây bay đi xa", "C. Em đi thuyền ra biển một mình", "D. Em ngủ quên không chơi gì"], "answer": "A", "explain": "Em bé tưởng tượng mình là sóng, mẹ là bờ: sóng lăn, lăn, lăn rồi vỗ vào bờ, hai mẹ con cùng cười đùa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nghệ thuật nổi bật trong bài thơ “Mây và sóng” là gì?", "options": ["A. Đối thoại tưởng tượng và phép điệp ngữ", "B. Sử dụng vần chân chặt chẽ", "C. Kể chuyện theo ngôi thứ nhất", "D. Dùng nhiều thành ngữ"], "answer": "A", "explain": "Bài thơ là cuộc đối thoại tưởng tượng giữa em bé với mây, sóng; điệp cấu trúc tạo nhịp điệu êm ái.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một đoạn văn ghi lại cảm xúc về bài thơ thường gồm mấy phần?", "options": ["A. Ba phần: mở đoạn, thân đoạn, kết đoạn", "B. Một phần duy nhất", "C. Năm phần", "D. Không cần chia phần"], "answer": "A", "explain": "Mở đoạn giới thiệu bài thơ và cảm xúc chung; thân đoạn triển khai cảm xúc với dẫn chứng; kết đoạn khẳng định lại ấn tượng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về “Chuyện cổ tích về loài người”:", "statements": ["a) Bài thơ mở đầu bằng hình ảnh trái đất lúc đầu chỉ toàn trẻ con.", "b) Mặt trời, cây cỏ trong bài thơ sinh ra để phục vụ con người.", "c) Bài thơ thể hiện ước mơ về một thế giới tốt đẹp cho trẻ em.", "d) Tác giả bài thơ là Tạ Duy Anh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: “Trời sinh ra trước nhất, chỉ toàn là trẻ con”. b) Đúng. c) Đúng. d) Sai: tác giả là Xuân Quỳnh.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nói và nghe khi trình bày ý kiến:", "statements": ["a) Khi trình bày cần nói rõ ràng, tự tin.", "b) Nên dùng lí lẽ và dẫn chứng để thuyết phục người nghe.", "c) Không cần lắng nghe ý kiến của người khác.", "d) Có thể đặt câu hỏi để trao đổi thêm với người nghe."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cần lắng nghe, tôn trọng ý kiến khác. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu ghi lại cảm xúc của em về ước mơ được gửi gắm trong “Chuyện cổ tích về loài người”.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu ước mơ của nhà thơ (thế giới tốt đẹp cho trẻ em); cảm xúc khi đọc (ấm áp, hi vọng); liên hệ ước mơ của bản thân; kết đoạn khẳng định."}, {"type": "essay", "level": "VDC", "q": "Trình bày ý kiến của em (khoảng 5 – 7 câu) về vấn đề: học sinh cần làm gì để bảo vệ môi trường sống.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu ý kiến (mỗi học sinh đều có trách nhiệm); lí lẽ và việc làm cụ thể (không xả rác, trồng cây, tiết kiệm); kết luận kêu gọi hành động."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Bài thơ “Chuyện cổ tích về loài người” ca ngợi điều gì?", "options": ["A. Tình yêu thương con người, đặc biệt là trẻ thơ", "B. Sức mạnh của chiến tranh", "C. Vẻ đẹp của tiền bạc", "D. Sự giàu có"], "answer": "A", "explain": "Bài thơ là khúc ca về tình yêu thương con người: mọi thứ trên đời đều sinh ra vì trẻ em, vì hạnh phúc con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Những hình ảnh trung tâm trong bài thơ “Mây và sóng” là gì?", "options": ["A. Mây, sóng, mẹ và em bé", "B. Núi, sông, đồng ruộng", "C. Trường học, thầy cô", "D. Chim, hoa, bướm"], "answer": "A", "explain": "Bài thơ xoay quanh cuộc trò chuyện tưởng tượng của em bé với mây, sóng và tình cảm với mẹ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Ngọt” trong “kẹo ngọt” và “giọng nói ngọt ngào” là hiện tượng gì?", "options": ["A. Từ đa nghĩa", "B. Từ đồng âm", "C. Từ đồng nghĩa", "D. Từ trái nghĩa"], "answer": "A", "explain": "Nghĩa “ngọt ngào” của giọng nói được suy ra từ nghĩa đen chỉ vị ngọt nên là từ đa nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tình mẫu tử trong “Mây và sóng” được thể hiện qua chi tiết nào?", "options": ["A. Em bé từ chối mọi cuộc vui hấp dẫn để được ở bên mẹ", "B. Em bé đòi mẹ mua quà", "C. Em bé khóc nhè", "D. Em bé đi chơi xa"], "answer": "A", "explain": "Dù mây, sóng rủ đi chơi với bao điều thú vị, em bé vẫn chọn ở nhà với mẹ – đó là biểu hiện cao đẹp của tình mẫu tử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ nhân vật người anh trong “Bức tranh của em gái tôi”, em học được điều gì?", "options": ["A. Biết nhận lỗi, vượt qua sự ghen tị, ích kỉ", "B. Nên ghen tị với người giỏi hơn", "C. Nên xa lánh em gái", "D. Không cần sửa lỗi"], "answer": "A", "explain": "Người anh dám nhìn nhận sự ích kỉ của mình và thay đổi – đó là bài học về lòng dũng cảm nhận lỗi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa thơ và truyện là gì?", "options": ["A. Thơ giàu cảm xúc, nhạc điệu; truyện có cốt truyện, nhân vật, sự việc", "B. Thơ dài hơn truyện", "C. Truyện không có cảm xúc", "D. Thơ không có hình ảnh"], "answer": "A", "explain": "Thơ bộc lộ cảm xúc qua hình ảnh, vần, nhịp; truyện kể lại chuỗi sự việc xoay quanh nhân vật.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về hai bài thơ của Bài 2:", "statements": ["a) Cả hai bài thơ đều viết về tình cảm gia đình và tình yêu thương con người.", "b) “Mây và sóng” được viết theo thể thơ năm chữ.", "c) “Chuyện cổ tích về loài người” sử dụng nhiều hình ảnh sinh động về thiên nhiên.", "d) Vần, nhịp, hình ảnh là những yếu tố quan trọng của thơ."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: “Mây và sóng” là thơ văn xuôi. c) Đúng: mặt trời, cây cỏ, trẻ con... d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phân biệt từ đồng âm và từ đa nghĩa:", "statements": ["a) “Hoa” trong “hoa hồng” và “hoa văn” là từ đa nghĩa.", "b) “Kính” trong “kính đeo mắt” và “kính trọng” là từ đồng âm.", "c) “Xanh” trong “lá xanh” và “tuổi xanh” là từ đa nghĩa.", "d) Từ đồng âm là những từ có nghĩa giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: nghĩa không liên quan. c) Đúng: “tuổi xanh” chỉ tuổi trẻ, suy ra từ màu xanh. d) Sai: từ đồng âm khác nhau về nghĩa.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu ghi lại cảm xúc của em về những hình ảnh thiên nhiên trong thơ Xuân Quỳnh.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu hình ảnh thiên nhiên gây ấn tượng (mặt trời, cây cỏ); cảm xúc khi đọc (tươi vui, ấm áp); cảm nhận về tình yêu thiên nhiên, con người của nhà thơ."}, {"type": "essay", "level": "VDC", "q": "Trình bày ý kiến của em (khoảng 5 – 7 câu) về vấn đề: vì sao cần biết ơn cha mẹ.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu ý kiến (biết ơn là đạo lí); lí lẽ (cha mẹ sinh thành, nuôi dưỡng – dẫn tình mẹ trong “Mây và sóng”); việc làm thể hiện lòng biết ơn; kết luận."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Chủ đề chung của Bài 2 “Gõ cửa trái tim” là gì?", "options": ["A. Tình yêu thương con người và tình cảm gia đình", "B. Chiến tranh và hòa bình", "C. Khoa học và công nghệ", "D. Du lịch khám phá"], "answer": "A", "explain": "Cả ba văn bản của Bài 2 đều hướng tới tình yêu thương: tình yêu trẻ thơ, tình mẫu tử, tình anh em.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tagore đoạt giải Nobel Văn học vào năm nào?", "options": ["A. 1913", "B. 1945", "C. 1900", "D. 1920"], "answer": "A", "explain": "Năm 1913, Tagore trở thành người châu Á đầu tiên đoạt giải Nobel Văn học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Sắt” trong “ý chí sắt đá” mang nghĩa gì?", "options": ["A. Nghĩa bóng (chỉ sự cứng rắn, kiên định)", "B. Nghĩa đen (chỉ kim loại)", "C. Không có nghĩa", "D. Nghĩa của từ láy"], "answer": "A", "explain": "“Sắt đá” ở đây không chỉ kim loại mà chỉ tính cách cứng rắn – là nghĩa bóng suy ra từ nghĩa đen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh “trẻ con” trong bài thơ của Xuân Quỳnh gợi lên điều gì?", "options": ["A. Sự trong sáng và tương lai của nhân loại", "B. Sự nghịch ngợm, khó bảo", "C. Sự yếu đuối", "D. Sự giàu có"], "answer": "A", "explain": "Trẻ em là trung tâm của bài thơ, tượng trưng cho sự trong sáng, niềm hi vọng và tương lai của loài người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao người anh trong truyện lại bí mật theo dõi em gái vẽ tranh?", "options": ["A. Vì tò mò và ghen tị với tài năng của em", "B. Vì muốn học vẽ", "C. Vì được mẹ nhờ trông em", "D. Vì muốn phá đám"], "answer": "A", "explain": "Người anh khó chịu khi em được mọi người chú ý nên lén xem em vẽ với tâm trạng tò mò pha ghen tị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "“Sao” trong “ngôi sao” và “sao chép” là hiện tượng gì?", "options": ["A. Từ đồng âm", "B. Từ đa nghĩa", "C. Từ đồng nghĩa", "D. Từ trái nghĩa"], "answer": "A", "explain": "“Sao” (thiên thể) và “sao” (làm lại giống) phát âm giống nhau nhưng nghĩa không liên quan nên là từ đồng âm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nhân vật trong truyện “Bức tranh của em gái tôi”:", "statements": ["a) Truyện được kể ở ngôi thứ nhất qua lời kể của người anh.", "b) Kiều Phương luôn nhường nhịn và yêu thương anh trai.", "c) Bức tranh của Kiều Phương đoạt giải thưởng quốc tế.", "d) Người anh tự hào khoe mình chính là người mẫu trong tranh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: em vẽ anh với ánh mắt nhân hậu. c) Đúng. d) Sai: người anh xấu hổ, không dám nhận mình là người mẫu.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nghĩa đen, nghĩa bóng và từ đồng âm:", "statements": ["a) Nghĩa của từ là nội dung mà từ biểu thị.", "b) “Lửa” trong “ngọn lửa” và “lửa căm hờn” là từ đa nghĩa.", "c) Từ đồng âm là những từ có các nghĩa liên quan đến nhau.", "d) “Tranh” trong “bức tranh” và “tranh giành” là từ đồng âm."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: nghĩa bóng suy ra từ nghĩa đen. c) Sai: đó là đặc điểm của từ đa nghĩa. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu cảm nghĩ của em về tình anh em trong gia đình mình.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: giới thiệu anh/chị/em của em; kể kỉ niệm thể hiện tình cảm; nêu cảm xúc yêu thương, biết ơn; mong muốn giữ gìn tình cảm."}, {"type": "essay", "level": "VDC", "q": "Trình bày ý kiến của em (khoảng 5 – 7 câu) về vấn đề: học sinh có nên đọc thơ để nuôi dưỡng tâm hồn không.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu ý kiến (nên đọc thơ); lí lẽ (thơ bồi đắp cảm xúc, tình yêu thương – dẫn hai bài thơ đã học); kết luận với thói quen đọc của bản thân."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bài thơ “Mây và sóng” là lời tâm sự của ai?", "options": ["A. Em bé nói với mẹ", "B. Đám mây nói với sóng", "C. Người mẹ nói với con", "D. Sóng nói với bờ"], "answer": "A", "explain": "Bài thơ là lời em bé kể với mẹ về cuộc trò chuyện tưởng tượng với mây, sóng và tình yêu mẹ tha thiết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Đá” trong “hòn đá” và “đá bóng” là hiện tượng gì?", "options": ["A. Từ đồng âm", "B. Từ đa nghĩa", "C. Từ đồng nghĩa", "D. Từ trái nghĩa"], "answer": "A", "explain": "“Đá” (vật rắn) và “đá” (dùng chân tác động) phát âm giống nhau, nghĩa không liên quan nên là từ đồng âm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi viết đoạn văn ghi lại cảm xúc về một bài thơ, mở đoạn nên làm gì?", "options": ["A. Giới thiệu bài thơ và nêu cảm xúc chung của mình", "B. Chép lại bài thơ", "C. Kể tiểu sử tác giả thật dài", "D. Phê phán bài thơ"], "answer": "A", "explain": "Mở đoạn giới thiệu tên bài thơ, tác giả và nêu cảm xúc, ấn tượng chung để dẫn vào phần triển khai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung về nội dung của “Chuyện cổ tích về loài người” và “Mây và sóng” là gì?", "options": ["A. Đều ca ngợi tình yêu thương con người", "B. Đều viết về lao động sản xuất", "C. Đều là thơ trào phúng", "D. Đều viết về lịch sử"], "answer": "A", "explain": "Một bài ca ngợi tình yêu trẻ thơ, nhân loại; một bài ca ngợi tình mẫu tử – đều chan chứa tình yêu thương con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "“Cổ” trong “cổ tích” và “cổ áo” là hiện tượng gì?", "options": ["A. Từ đồng âm", "B. Từ đa nghĩa", "C. Từ đồng nghĩa", "D. Từ trái nghĩa"], "answer": "A", "explain": "“Cổ” (xưa) và “cổ” (bộ phận cơ thể) nghĩa không liên quan nên là từ đồng âm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết “mẹ mua cho em hộp màu” trong truyện có ý nghĩa gì?", "options": ["A. Thể hiện sự quan tâm, khích lệ tài năng của gia đình", "B. Thể hiện sự giàu có", "C. Thể hiện sự thiên vị", "D. Không có ý nghĩa gì"], "answer": "A", "explain": "Chi tiết cho thấy gia đình quan tâm, tạo điều kiện để Kiều Phương phát triển năng khiếu hội họa.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về Bài 2 “Gõ cửa trái tim”:", "statements": ["a) Bài 2 gồm hai bài thơ và một truyện ngắn.", "b) Cả ba văn bản đều hướng tới tình yêu thương con người.", "c) “Bức tranh của em gái tôi” là một bài thơ.", "d) Thực hành tiếng Việt của Bài 2 gồm: nghĩa của từ, từ đồng âm, từ đa nghĩa."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đây là truyện ngắn. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nghĩa của từ và hiện tượng đồng âm, đa nghĩa:", "statements": ["a) “Đầu” trong “đầu người” và “đầu làng” là từ đa nghĩa.", "b) “Mực” trong “lọ mực” và “con mực” là từ đồng âm.", "c) “Chạy” trong “chạy bộ” và “chạy ăn từng bữa” là từ đa nghĩa.", "d) Từ láy là từ có nghĩa bóng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đều chỉ bộ phận đầu tiên. b) Đúng: nghĩa không liên quan. c) Đúng: “chạy ăn” là nghĩa bóng. d) Sai: từ láy là từ phức có quan hệ láy âm, vần.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu ghi lại cảm xúc chung của em về chủ đề Bài 2 “Gõ cửa trái tim”.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu chủ đề chung (tình yêu thương con người); cảm xúc sau khi học (ấm áp, xúc động); dẫn một chi tiết ấn tượng nhất; liên hệ bản thân."}, {"type": "essay", "level": "VDC", "q": "Trình bày ý kiến của em (khoảng 5 – 7 câu) về vấn đề: làm thế nào để đọc thơ và cảm nhận cái hay của thơ.", "points": 0, "explain": "Gợi ý dàn ý cho giáo viên: nêu ý kiến (cần đọc kĩ, đọc diễn cảm); cách làm (chú ý hình ảnh, vần, nhịp; liên tưởng, đồng cảm); dẫn ví dụ từ bài thơ đã học; kết luận."}]}]}
