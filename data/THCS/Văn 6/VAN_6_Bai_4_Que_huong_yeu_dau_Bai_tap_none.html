ức quà của lúa non.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài thơ Quê hương thể hiện tình cảm gì của tác giả?", "options": ["A. Tình yêu quê hương tha thiết qua nỗi nhớ", "B. Sự chán ghét quê hương", "C. Nỗi sợ biển cả", "D. Niềm vui du lịch"], "answer": "A", "explain": "Xa quê, nhà thơ nhớ làng chài da diết, thể hiện tình yêu quê hương tha thiết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh cánh buồm trong bài thơ Quê hương gợi liên tưởng gì?", "options": ["A. Sự yếu đuối", "B. Sức sống mạnh mẽ và khát vọng vươn khơi của người dân chài", "C. Nỗi buồn", "D. Sự cô đơn"], "answer": "B", "explain": "Cánh buồm no gió ra khơi tượng trưng cho sức sống và khát vọng của người dân chài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ngôn ngữ thơ Tế Hanh có đặc điểm gì?", "options": ["A. Cầu kì, hoa mĩ", "B. Giản dị, mộc mạc mà giàu cảm xúc", "C. Khó hiểu", "D. Toàn từ Hán Việt"], "answer": "B", "explain": "Thơ Tế Hanh dùng từ ngữ giản dị, mộc mạc, hình ảnh chân thực mà giàu cảm xúc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dấu chấm dùng để kết thúc câu kể.", "b) Sau dấu chấm, chữ cái đầu câu tiếp theo phải viết hoa.", "c) Dấu chấm dùng để kết thúc câu hỏi.", "d) Câu Tôi đi học. Mẹ đi làm. dùng dấu chấm đúng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: câu hỏi dùng dấu chấm hỏi. d) Đúng: hai câu kể nên kết thúc bằng dấu chấm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dấu phẩy dùng để ngăn cách các bộ phận trong câu.", "b) Dấu phẩy dùng để kết thúc câu.", "c) Trong câu liệt kê cần dùng dấu phẩy ngăn cách.", "d) Câu Mùa xuân, cây cối đâm chồi. dùng dấu phẩy đúng."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: kết thúc câu dùng dấu chấm, chấm hỏi hoặc chấm than. c) Đúng. d) Đúng: dấu phẩy ngăn cách trạng ngữ chỉ thời gian.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu trả lời câu hỏi: quê hương có ý nghĩa như thế nào đối với em?", "points": 0, "explain": "Gợi ý chấm: nêu được quê hương là nơi chôn nhau cắt rốn, nơi gắn với tuổi thơ, gia đình; là nguồn cội, chỗ dựa tinh thần; thể hiện tình cảm gắn bó và trách nhiệm (học tốt, giữ gìn, xây dựng quê hương). Chân thành, thuyết phục."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu phân biệt hồi kí và du kí (có lấy ví dụ minh họa).", "points": 0, "explain": "Gợi ý chấm: nêu đúng định nghĩa hai thể loại (hồi kí viết chuyện đã qua mà tác giả tham gia, chứng kiến; du kí ghi chuyến đi); chỉ ra điểm giống (đều là kí, coi trọng sự thật, thường dùng ngôi thứ nhất) và khác (đối tượng ghi chép); ví dụ minh họa (Cô Tô là du kí). Diễn đạt rõ ràng."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Làng nghề làm cốm nổi tiếng được nhắc trong bài là làng nào?", "options": ["A. Làng Vòng", "B. Làng Đào", "C. Làng Lụa", "D. Làng Gốm"], "answer": "A", "explain": "Cốm làng Vòng (Hà Nội) là đặc sản nổi tiếng được Thạch Lam nhắc tới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả bài kí Cô Tô là ai?", "options": ["A. Thạch Lam", "B. Tế Hanh", "C. Nguyễn Tuân", "D. Vũ Bằng"], "answer": "C", "explain": "Cô Tô là bài kí của Nguyễn Tuân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài Cô Tô thuộc thể loại nào?", "options": ["A. Truyện ngắn", "B. Thơ", "C. Kí", "D. Tùy bút"], "answer": "C", "explain": "Cô Tô ghi lại chuyến đi thực tế của tác giả ra đảo nên thuộc thể kí (du kí).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây dùng dấu phẩy đúng?", "options": ["A. Mùa thu, trời trong xanh.", "B. Tôi, đi học.", "C. Quê tôi ở, ven biển.", "D. Em, rất yêu quê hương."], "answer": "A", "explain": "Câu A dùng dấu phẩy ngăn cách trạng ngữ chỉ thời gian đúng; các câu còn lại đặt dấu phẩy sai vị trí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây dùng dấu chấm than đúng?", "options": ["A. Hôm nay trời đẹp!", "B. Ôi, cánh đồng lúa chín đẹp quá!", "C. Bạn ăn cơm chưa!", "D. Tôi đi học!"], "answer": "B", "explain": "Câu B là câu cảm thán nên dùng dấu chấm than đúng; các câu còn lại là câu kể hoặc câu hỏi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây dùng dấu câu sai và cần sửa?", "options": ["A. Quê bạn ở đâu?", "B. Em ăn cơm chưa.", "C. Trời mưa to quá!", "D. Tôi yêu quê hương."], "answer": "B", "explain": "Câu B là câu hỏi nên phải dùng dấu chấm hỏi, không dùng dấu chấm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dấu chấm hỏi dùng để kết thúc câu hỏi.", "b) Mọi câu hỏi đều phải chứa cụm từ có...không.", "c) Câu Bạn tên là gì? dùng dấu chấm hỏi đúng.", "d) Câu kể cũng có thể dùng dấu chấm hỏi."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: câu hỏi có nhiều dạng (ai, gì, nào, bao nhiêu...). c) Đúng. d) Sai: câu kể dùng dấu chấm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dấu chấm than dùng để kết thúc câu cảm thán.", "b) Câu Đẹp quá! là câu cảm thán.", "c) Dấu chấm than dùng để kết thúc câu kể.", "d) Câu cầu khiến có thể dùng dấu chấm than."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: câu kể dùng dấu chấm. d) Đúng, ví dụ: Hãy giữ gìn quê hương!", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể về một kỉ niệm đẹp của em với quê hương.", "points": 0, "explain": "Gợi ý chấm: kể kỉ niệm cụ thể (với ai, ở đâu, khi nào); diễn biến có chi tiết sinh động; thể hiện cảm xúc gắn bó; rút ra ý nghĩa. Dùng ngôi kể thứ nhất, kể chân thực, giàu cảm xúc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu giải thích vì sao chúng ta phải biết giữ gìn và xây dựng quê hương.", "points": 0, "explain": "Gợi ý chấm: giải thích quê hương là nguồn cội, nơi nuôi dưỡng ta; giữ gìn, xây dựng là trách nhiệm và đạo lí (uống nước nhớ nguồn); nêu việc làm cụ thể (giữ vệ sinh, bảo vệ môi trường, học tốt); lời kêu gọi. Lập luận rõ ràng, thuyết phục."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Đảo Cô Tô thuộc tỉnh nào?", "options": ["A. Quảng Ngãi", "B. Quảng Ninh", "C. Quảng Nam", "D. Quảng Bình"], "answer": "B", "explain": "Cô Tô là huyện đảo thuộc tỉnh Quảng Ninh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu chấm được dùng để làm gì?", "options": ["A. Kết thúc câu hỏi", "B. Kết thúc câu kể", "C. Ngăn cách các bộ phận trong câu", "D. Kết thúc câu cảm thán"], "answer": "B", "explain": "Dấu chấm dùng để kết thúc câu kể.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu phẩy được dùng để làm gì?", "options": ["A. Kết thúc câu kể", "B. Ngăn cách các bộ phận, các sự vật liệt kê trong câu", "C. Kết thúc câu hỏi", "D. Bắt đầu đoạn văn"], "answer": "B", "explain": "Dấu phẩy dùng để ngăn cách các bộ phận trong câu hoặc các sự vật liệt kê.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ tổ quốc có nghĩa là gì?", "options": ["A. Đất nước của tổ tiên để lại, đất nước mình", "B. Thủ đô của đất nước", "C. Làng quê của mình", "D. Vùng đất mới"], "answer": "A", "explain": "Tổ quốc là từ Hán Việt chỉ đất nước của tổ tiên để lại, tức đất nước mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nào nên dùng từ Hán Việt?", "options": ["A. Trong mọi hoàn cảnh", "B. Khi cần sắc thái trang trọng như trong thơ ca, văn nghị luận", "C. Khi nói chuyện với trẻ em", "D. Không bao giờ nên dùng"], "answer": "B", "explain": "Từ Hán Việt tạo sắc thái trang trọng nên phù hợp trong thơ ca, văn nghị luận, văn bản trang trọng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cặp từ nào gồm một từ thuần Việt và một từ Hán Việt đồng nghĩa?", "options": ["A. Cha - phụ thân", "B. Ăn - uống", "C. Đi - chạy", "D. Vui - buồn"], "answer": "A", "explain": "Cha là từ thuần Việt, phụ thân là từ Hán Việt, cả hai đều chỉ người sinh ra mình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Từ Hán Việt là từ có nguồn gốc từ tiếng Hán.", "b) Từ tổ quốc là từ Hán Việt.", "c) Từ bánh chưng là từ Hán Việt.", "d) Từ Hán Việt thường tạo sắc thái trang trọng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: bánh chưng là từ thuần Việt. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kí thường dùng ngôi kể thứ nhất.", "b) Ngôi thứ nhất tạo cảm giác chân thực, tin cậy.", "c) Bài kí Cô Tô được kể ở ngôi thứ ba.", "d) Tùy bút Cốm được kể ở ngôi thứ nhất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: Cô Tô dùng ngôi thứ nhất (tác giả xưng tôi). d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 7-10 câu tả cảnh sinh hoạt của gia đình em vào một buổi tối.", "points": 0, "explain": "Gợi ý chấm: có mở đoạn giới thiệu; thân đoạn tả không gian, hoạt động của từng thành viên theo trình tự hợp lí; xen cảm xúc; kết đoạn nêu cảm nghĩ về mái ấm gia đình. Dùng từ ngữ gợi tả, đúng dấu câu, diễn đạt mạch lạc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu cảm nhận của em về hình ảnh người dân chài trong bài thơ Quê hương.", "points": 0, "explain": "Gợi ý chấm: nêu đặc điểm người dân chài (khỏe khoắn, hăng say, dũng cảm ra khơi); phân tích hình ảnh thơ tiêu biểu; cảm nhận về vẻ đẹp lao động; tình cảm trân trọng của nhà thơ và của bản thân. Có dẫn chứng, diễn đạt mạch lạc."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Dấu chấm hỏi được dùng để làm gì?", "options": ["A. Kết thúc câu kể", "B. Kết thúc câu hỏi", "C. Ngăn cách các bộ phận", "D. Kết thúc câu cảm thán"], "answer": "B", "explain": "Dấu chấm hỏi dùng để kết thúc câu hỏi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu chấm than được dùng để làm gì?", "options": ["A. Kết thúc câu cảm thán hoặc câu cầu khiến", "B. Kết thúc câu kể", "C. Ngăn cách các bộ phận", "D. Kết thúc câu hỏi"], "answer": "A", "explain": "Dấu chấm than dùng để kết thúc câu cảm thán hoặc câu cầu khiến.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ Hán Việt là những từ như thế nào?", "options": ["A. Từ thuần Việt cổ", "B. Từ có nguồn gốc từ tiếng Hán, đã được Việt hóa", "C. Từ mượn tiếng Anh", "D. Từ địa phương"], "answer": "B", "explain": "Từ Hán Việt là những từ có nguồn gốc từ tiếng Hán, được người Việt tiếp nhận và Việt hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây thiếu dấu phẩy?", "options": ["A. Khi mùa xuân đến, cây cối đâm chồi nảy lộc.", "B. Khi mùa xuân đến cây cối đâm chồi nảy lộc.", "C. Tôi thích hoa hồng, hoa lan, hoa cúc.", "D. Sáng nay, em đi học sớm."], "answer": "B", "explain": "Câu B thiếu dấu phẩy ngăn cách trạng ngữ chỉ thời gian với vế chính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác dụng của dấu phẩy trong câu liệt kê là gì?", "options": ["A. Kết thúc câu", "B. Ngăn cách các sự vật cùng loại, làm câu rõ nghĩa", "C. Nhấn mạnh cảm xúc", "D. Bắt đầu câu mới"], "answer": "B", "explain": "Dấu phẩy ngăn cách các sự vật liệt kê giúp câu rõ nghĩa, tránh nhầm lẫn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung về chủ đề của ba văn bản trong Bài 4 là gì?", "options": ["A. Cùng viết về chiến tranh", "B. Cùng thể hiện tình yêu quê hương, đất nước", "C. Cùng viết về nhà trường", "D. Cùng viết về thành phố"], "answer": "B", "explain": "Quê hương, Cốm, Cô Tô đều thể hiện tình yêu quê hương, đất nước qua những vẻ đẹp khác nhau.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cốm là thức quà của lúa non.", "b) Làng Vòng nổi tiếng với nghề làm cốm.", "c) Thạch Lam chê cốm là món quà quê mùa.", "d) Ăn cốm phải thong thả và ngẫm nghĩ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: ông trân trọng, nâng niu cốm. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bài kí Cô Tô được viết sau chuyến đi thực tế của tác giả.", "b) Thiên nhiên Cô Tô hiện lên hùng vĩ, trong sáng.", "c) Con người Cô Tô được miêu tả là lười biếng.", "d) Tác giả dùng nhiều so sánh, nhân hóa khi tả thiên nhiên."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: con người Cô Tô lao động hăng say, lạc quan. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu: em sẽ giới thiệu món đặc sản quê em với bạn bè như thế nào?", "points": 0, "explain": "Gợi ý chấm: giới thiệu tên món ăn, nguồn gốc; miêu tả đặc điểm (hình thức, hương vị, cách làm); cách thưởng thức; bộc lộ niềm tự hào về quê hương. Giọng văn hấp dẫn, diễn đạt mạch lạc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể về một ngày ở quê, chú ý sử dụng đúng các dấu câu (dấu chấm, dấu phẩy, dấu chấm hỏi, dấu chấm than).", "points": 0, "explain": "Gợi ý chấm: sử dụng đúng cả 4 loại dấu câu, mỗi loại ít nhất một lần và đặt đúng vị trí; đoạn văn kể mạch lạc, sinh động. Giáo viên kiểm tra kĩ vị trí từng dấu câu."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Từ nào sau đây là từ Hán Việt?", "options": ["A. Tổ quốc", "B. Bánh chưng", "C. Con trâu", "D. Cái cày"], "answer": "A", "explain": "Tổ quốc là từ Hán Việt; các từ còn lại là từ thuần Việt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ đồng bào có nghĩa là gì?", "options": ["A. Người cùng quê", "B. Người cùng dân tộc, cùng giống nòi", "C. Người cùng lớp", "D. Người hàng xóm"], "answer": "B", "explain": "Đồng bào (cùng một bọc, theo truyền thuyết con Rồng cháu Tiên) chỉ người cùng dân tộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đối tượng miêu tả chính của bài kí Cô Tô là gì?", "options": ["A. Thành phố Hà Nội", "B. Cảnh thiên nhiên và con người đảo Cô Tô", "C. Làng quê của tác giả", "D. Chiến trường"], "answer": "B", "explain": "Bài kí miêu tả thiên nhiên và con người lao động trên đảo Cô Tô sau cơn bão.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cả thơ Quê hương và kí Cô Tô đều viết về biển?", "options": ["A. Vì hai tác giả hẹn nhau", "B. Vì biển là hình ảnh tiêu biểu, gắn bó máu thịt với quê hương của các tác giả", "C. Vì chỉ có biển mới đẹp", "D. Vì yêu cầu của sách"], "answer": "B", "explain": "Tế Hanh sinh ra ở làng chài, Nguyễn Tuân đến với đảo biển; biển gắn bó máu thịt với quê hương họ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp tu từ trong câu Mặt trời tròn trĩnh phúc hậu như lòng đỏ một quả trứng thiên nhiên đầy đặn là gì?", "options": ["A. Chỉ có so sánh", "B. So sánh kết hợp nhân hóa", "C. Chỉ có nhân hóa", "D. Không có biện pháp tu từ"], "answer": "B", "explain": "Câu có từ như (so sánh) và gán đặc điểm phúc hậu của con người cho mặt trời (nhân hóa).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong bài Cốm, Thạch Lam ví cốm là gì?", "options": ["A. Thức quà thanh khiết của đồng nội", "B. Món ăn xa xỉ", "C. Thức quà của người giàu", "D. Món ăn bình thường"], "answer": "A", "explain": "Thạch Lam trân trọng gọi cốm là thức quà thanh khiết của đồng nội, thức dâng của cánh đồng lúa.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kí phản ánh người thật, việc thật.", "b) Truyện có thể hư cấu, tưởng tượng.", "c) Kí và truyện đều thuộc phương thức tự sự.", "d) Bài kí không cần chi tiết chân thực."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: cả hai đều kể lại sự việc, câu chuyện. d) Sai: kí coi trọng tính chân thực của chi tiết.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu Ôi! Mưa to quá! dùng dấu chấm than đúng.", "b) Câu Hôm nay, trời đẹp. dùng dấu phẩy đúng.", "c) Câu Ai đi chợ với tôi không? dùng dấu chấm hỏi đúng.", "d) Câu Hà Nội, Huế, Đà Nẵng đều là thành phố. dùng dấu phẩy đúng."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: câu cảm thán. b) Sai: Hôm nay là trạng ngữ nhưng câu ngắn, không cần dấu phẩy ngăn cách (cách dùng này không sai hoàn toàn nhưng không cần thiết; theo quy tắc chặt chẽ, câu đơn giản không bắt buộc phẩy). c) Đúng. d) Đúng: dấu phẩy ngăn cách các địa danh liệt kê.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu phân tích nét đặc sắc nghệ thuật của bài kí Cô Tô.", "points": 0, "explain": "Gợi ý chấm: chỉ ra ngôi kể thứ nhất; phân tích ngôn ngữ giàu hình ảnh; phân tích việc dùng so sánh, nhân hóa khi tả thiên nhiên (ví dụ mặt trời mọc); nhận xét bài kí giàu chất thơ. Có dẫn chứng, diễn đạt mạch lạc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu: nếu được đi du lịch đảo Cô Tô, em muốn khám phá điều gì?", "points": 0, "explain": "Gợi ý chấm: nêu những điều muốn khám phá dựa vào bài kí (cảnh mặt trời mọc, giếng nước ngọt, cuộc sống ngư dân); lí do muốn khám phá; cảm xúc háo hức; liên hệ ý thức bảo vệ cảnh đẹp. Sáng tạo, phù hợp nội dung bài học."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hình ảnh trung tâm trong bài thơ Quê hương là gì?", "options": ["A. Thành phố Huế", "B. Làng chài ven biển và người dân chài", "C. Cánh đồng lúa", "D. Dòng sông quê"], "answer": "B", "explain": "Bài thơ viết về làng chài ven biển Quảng Ngãi với những người dân chài khỏe khoắn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cảm xúc chủ đạo của bài thơ Quê hương là gì?", "options": ["A. Nỗi nhớ quê hương da diết", "B. Niềm vui chiến thắng", "C. Nỗi buồn chia ly", "D. Sự giận dữ"], "answer": "A", "explain": "Bài thơ được viết khi tác giả xa quê nên tràn ngập nỗi nhớ quê hương da diết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyễn Tuân nổi tiếng nhất với thể loại nào?", "options": ["A. Thơ", "B. Tùy bút và kí", "C. Truyện cổ tích", "D. Kịch"], "answer": "B", "explain": "Nguyễn Tuân là bậc thầy của thể tùy bút và kí với phong cách tài hoa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tình cảm của Thạch Lam với Hà Nội qua tùy bút Cốm là gì?", "options": ["A. Thờ ơ", "B. Chê bai", "C. Yêu mến, trân trọng nét đẹp văn hóa của đất kinh kì", "D. Muốn rời xa"], "answer": "C", "explain": "Qua món quà cốm bình dị, Thạch Lam thể hiện tình yêu mến, trân trọng nét đẹp văn hóa Hà Nội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò của chi tiết trong bài kí là gì?", "options": ["A. Không có vai trò gì", "B. Làm tăng tính chân thực, sinh động cho bài viết", "C. Chỉ để bài dài hơn", "D. Làm bài khó hiểu"], "answer": "B", "explain": "Chi tiết chân thực, cụ thể làm cho bài kí sinh động và đáng tin cậy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây là câu cảm thán?", "options": ["A. Quê bạn ở đâu?", "B. Quê hương tôi đẹp biết bao!", "C. Tôi đi về quê.", "D. Hôm nay trời nắng."], "answer": "B", "explain": "Câu B bộc lộ cảm xúc ngợi ca nên là câu cảm thán, dùng dấu chấm than.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Từ giang sơn là từ Hán Việt.", "b) Từ non sông là từ Hán Việt.", "c) Từ sông khi đứng một mình là từ Hán Việt.", "d) Từ đồng bào là từ Hán Việt."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: sông là từ thuần Việt. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bài thơ Quê hương ca ngợi vẻ đẹp lao động của người dân chài.", "b) Nhà thơ nhớ quê khi phải sống xa quê.", "c) Bài thơ không chứa cảm xúc gì.", "d) Hình ảnh cánh buồm tượng trưng cho khát vọng vươn khơi."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: bài thơ tràn ngập nỗi nhớ quê da diết. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu suy nghĩ của em về câu nói Quê hương là chùm khế ngọt.", "points": 0, "explain": "Gợi ý chấm: giải thích ý nghĩa câu nói (quê hương ngọt ngào, nuôi dưỡng tâm hồn như chùm khế ngọt); phân tích hình ảnh so sánh giản dị mà sâu sắc; liên hệ tình cảm của bản thân với quê hương. Diễn đạt mạch lạc, giàu cảm xúc."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn ngắn khoảng 10-12 câu tả cảnh sinh hoạt nhộn nhịp của quê hương em vào dịp lễ, Tết.", "points": 0, "explain": "Gợi ý chấm: có đủ ba phần (mở bài giới thiệu dịp lễ Tết và không khí chung; thân bài tả chi tiết quang cảnh, hoạt động, con người theo trình tự; kết bài nêu cảm xúc); dùng từ ngữ gợi tả, so sánh, nhân hóa; đúng dấu câu; diễn đạt mạch lạc."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Thạch Lam là thành viên của nhóm văn học nào?", "options": ["A. Thơ mới", "B. Tự lực văn đoàn", "C. Nhân văn giai phẩm", "D. Sáng tạo"], "answer": "B", "explain": "Thạch Lam (Nguyễn Tường Vinh) là thành viên của Tự lực văn đoàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thái độ của Thạch Lam đối với món quà cốm là gì?", "options": ["A. Chê bai", "B. Thờ ơ", "C. Trân trọng, nâng niu", "D. Không quan tâm"], "answer": "C", "explain": "Thạch Lam trân trọng, nâng niu cốm như thức quà thanh khiết của đồng nội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài thơ Quê hương được sáng tác trong hoàn cảnh nào?", "options": ["A. Khi tác giả đang sống ở quê", "B. Khi tác giả xa quê, đang học ở Huế", "C. Khi tác giả đi du lịch", "D. Khi tác giả về già"], "answer": "B", "explain": "Bài thơ sáng tác năm 1939 khi Tế Hanh đang học ở Huế, xa quê hương Quảng Ngãi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điền dấu câu thích hợp vào chỗ trống: Chiều nay(1) trời đổ mưa(2)", "options": ["A. (1) dấu chấm, (2) dấu phẩy", "B. (1) dấu phẩy, (2) dấu chấm", "C. (1) dấu chấm hỏi, (2) dấu chấm", "D. (1) dấu chấm than, (2) dấu chấm"], "answer": "B", "explain": "Chiều nay là trạng ngữ chỉ thời gian nên sau nó dùng dấu phẩy; cuối câu kể dùng dấu chấm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ non sông thuộc loại từ nào?", "options": ["A. Từ thuần Việt", "B. Từ Hán Việt", "C. Từ mượn tiếng Anh", "D. Từ láy"], "answer": "B", "explain": "Non sông là từ Hán Việt chỉ đất nước, quê hương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói bài kí Cô Tô vừa là kí vừa giàu chất thơ?", "options": ["A. Vì viết bằng thơ", "B. Vì miêu tả thiên nhiên bằng ngôn ngữ giàu hình ảnh, cảm xúc như thơ", "C. Vì có vần", "D. Vì ngắn"], "answer": "B", "explain": "Nguyễn Tuân miêu tả thiên nhiên Cô Tô bằng ngôn ngữ giàu hình ảnh, cảm xúc nên bài kí giàu chất thơ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thạch Lam tên thật là Nguyễn Tường Vinh.", "b) Ông là thành viên của Tự lực văn đoàn.", "c) Ông chỉ viết tùy bút, không viết truyện ngắn.", "d) Văn phong của ông tinh tế, giàu cảm xúc."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: ông còn là tác giả nhiều truyện ngắn nổi tiếng như Gió lạnh đầu mùa. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cả ba văn bản trong Bài 4 đều thể hiện tình yêu quê hương.", "b) Quê hương là thơ, Cốm là tùy bút, Cô Tô là kí.", "c) Cả ba văn bản đều được kể ở ngôi thứ ba.", "d) Cả ba đều ca ngợi vẻ đẹp đất nước, con người Việt Nam."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: Cốm và Cô Tô dùng ngôi thứ nhất; Quê hương là thơ trữ tình. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu so sánh cảm xúc của em khi đọc bài thơ Quê hương và bài kí Cô Tô.", "points": 0, "explain": "Gợi ý chấm: nêu cảm xúc khi đọc thơ (xúc động trước nỗi nhớ quê da diết, vẻ đẹp làng chài); cảm xúc khi đọc kí (ngỡ ngàng trước vẻ đẹp thiên nhiên, khâm phục con người); điểm chung (đều bồi đắp tình yêu quê hương). So sánh rõ ràng, chân thành."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu trả lời câu hỏi: em sẽ làm gì để thể hiện tình yêu quê hương?", "points": 0, "explain": "Gợi ý chấm: nêu việc làm cụ thể, thiết thực, phù hợp lứa tuổi (học tốt, giữ vệ sinh môi trường, bảo vệ di tích, quảng bá đặc sản quê hương, giúp đỡ người khó khăn ở quê); giải thích ý nghĩa việc làm; thể hiện quyết tâm. Chân thành, thuyết phục."}]}]}
