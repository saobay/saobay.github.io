<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Siêng năng có nghĩa là gì?", "options": ["A. Chăm chỉ, chịu khó làm việc, học tập một cách thường xuyên, đều đặn", "B. Làm việc thật nhanh trong một thời gian ngắn", "C. Chỉ làm những việc mình thích", "D. Làm việc khi có người giám sát, nhắc nhở"], "answer": "A", "explain": "Siêng năng là đức tính chăm chỉ, chịu khó, làm việc thường xuyên, đều đặn, tự giác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kiên trì có nghĩa là gì?", "options": ["A. Làm được nhiều việc cùng một lúc", "B. Bền bỉ theo đuổi mục tiêu, quyết tâm làm đến cùng, không nản chí trước khó khăn", "C. Luôn thay đổi mục tiêu để không bị nhàm chán", "D. Không bao giờ nghe lời khuyên của người khác"], "answer": "B", "explain": "Kiên trì là bền bỉ, quyết tâm theo đuổi mục tiêu đến cùng, không bỏ cuộc khi gặp khó khăn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu tục ngữ nào sau đây nói về đức tính siêng năng, kiên trì?", "options": ["A. “Ăn quả nhớ kẻ trồng cây”", "B. “Gần mực thì đen, gần đèn thì sáng”", "C. “Có công mài sắt, có ngày nên kim”", "D. “Tốt gỗ hơn tốt nước sơn”"], "answer": "C", "explain": "“Có công mài sắt, có ngày nên kim” khuyên ta kiên trì, chịu khó thì việc khó mấy cũng thành công.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gặp một bài toán khó, chưa nghĩ ra cách giải, bạn Tuấn định chép luôn đáp án của bạn bên cạnh. Nếu em là Tuấn, em nên làm gì để thể hiện tính kiên trì?", "options": ["A. Chép đáp án cho nhanh để còn chơi", "B. Bỏ qua bài đó, không làm nữa", "C. Xin cô cho điểm thấp cũng được", "D. Suy nghĩ thêm, thử vẽ hình, phân tích đề; nếu vẫn bí thì hỏi cô giáo hoặc bạn cách làm"], "answer": "D", "explain": "Tiếp tục suy nghĩ, tìm cách và hỏi người hướng dẫn là biểu hiện của sự kiên trì trong học tập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn Lan đăng kí học đàn piano được hai tuần thì thấy khó, muốn bỏ. Lời khuyên nào phù hợp nhất cho Lan?", "options": ["A. Mới học ai cũng thấy khó, Lan nên kiên trì luyện tập đều đặn, sau một thời gian sẽ tiến bộ", "B. Bỏ ngay vì học đàn không cần thiết", "C. Lan nên chuyển sang học thêm một môn khác cùng lúc cho đỡ chán", "D. Lan chỉ cần học khi nào thấy hứng thú"], "answer": "A", "explain": "Kiên trì luyện tập đều đặn sẽ giúp vượt qua giai đoạn khó ban đầu — đó là cách ứng xử đúng với biểu hiện “cả thèm chóng chán” cần tránh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mỗi chiều, dù trời nắng hay mưa nhẹ, bạn Dũng đều dành 20 phút chạy bộ quanh sân trường để rèn sức khỏe chuẩn bị cho hội khỏe. Việc làm của Dũng thể hiện:", "options": ["A. Dũng thích khoe sức khỏe với bạn bè", "B. Tính siêng năng, kiên trì rèn luyện đều đặn", "C. Dũng không có việc gì khác để làm", "D. Dũng muốn được chọn vào đội tuyển bằng mọi giá"], "answer": "B", "explain": "Luyện tập đều đặn, không gián đoạn vì lí do nhỏ là biểu hiện của siêng năng, kiên trì.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Siêng năng là làm việc chăm chỉ một cách thường xuyên, đều đặn", "b) Kiên trì có nghĩa là làm đi làm lại một việc sai mà không chịu thay đổi cách làm", "c) Người siêng năng, kiên trì thường đạt kết quả tốt trong học tập và lao động", "d) “Cả thèm chóng chán” là biểu hiện của tính kiên trì"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: kiên trì là bền bỉ với mục tiêu, đồng thời biết rút kinh nghiệm, điều chỉnh cách làm cho phù hợp. c) Đúng. d) Sai: cả thèm chóng chán là biểu hiện trái ngược với kiên trì.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau đây:", "statements": ["a) Bạn Hoa lập thời gian biểu và nghiêm túc thực hiện mỗi ngày", "b) Bạn Nam chỉ làm bài tập khi bị bố mẹ nhắc nhiều lần", "c) Bạn Mai dù bị điểm kém vẫn bình tĩnh xem lại lỗi sai và ôn tập lại", "d) Bạn Tuấn bắt đầu làm mô hình được hai hôm thì bỏ dở vì thấy khó"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: tự giác, có kế hoạch. b) Sai: bị động, thiếu siêng năng. c) Đúng: không nản chí. d) Sai: bỏ dở giữa chừng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Kể về một lần em đã kiên trì làm một việc đến cùng và đạt kết quả tốt (khoảng 5–7 câu). Em rút ra bài học gì?", "points": 0, "explain": "Gợi ý: nêu việc em làm (học một môn khó, tập một kĩ năng...); khó khăn em gặp; cách em vượt qua; kết quả đạt được và bài học về siêng năng, kiên trì."}, {"type": "essay", "level": "VDC", "q": "Một người bạn của em than rằng: “Tớ học mãi mà điểm vẫn thấp, chắc tớ không có khả năng”. Em sẽ nói gì để động viên bạn theo tinh thần bài học (khoảng 5–7 câu)?", "points": 0, "explain": "Gợi ý: đồng cảm với bạn; phân tích học thấp có thể do cách học chưa phù hợp, chưa đủ thời gian; khuyên bạn kiên trì, đổi cách học, chia nhỏ mục tiêu; lấy dẫn chứng “có công mài sắt, có ngày nên kim”."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu hiện nào sau đây là siêng năng trong học tập?", "options": ["A. Chỉ học trước ngày kiểm tra một hôm", "B. Học thuộc lòng đáp án các đề kiểm tra cũ", "C. Đi học đều, chăm chú nghe giảng, làm bài tập đầy đủ", "D. Xin nghỉ học khi trời mưa nhỏ"], "answer": "C", "explain": "Đi học đều, nghe giảng chăm chú, làm bài đầy đủ và thường xuyên là biểu hiện của siêng năng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trái với siêng năng, kiên trì là biểu hiện nào?", "options": ["A. Tự giác, chủ động trong công việc", "B. Quyết tâm, bền bỉ theo đuổi mục tiêu", "C. Chịu khó, cần cù trong lao động", "D. Lười biếng, ỷ lại, hay bỏ dở giữa chừng"], "answer": "D", "explain": "Lười biếng, ỷ lại, bỏ dở giữa chừng là những biểu hiện trái ngược với siêng năng, kiên trì.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Siêng năng, kiên trì có tác dụng gì trong học tập và cuộc sống?", "options": ["A. Giúp ta hoàn thành tốt nhiệm vụ, đạt mục tiêu và rèn luyện được ý chí", "B. Giúp ta không bao giờ gặp khó khăn nữa", "C. Giúp ta được mọi người làm thay mọi việc", "D. Giúp ta học giỏi mà không cần cố gắng"], "answer": "A", "explain": "Siêng năng, kiên trì giúp hoàn thành nhiệm vụ, đạt mục tiêu và hình thành ý chí vượt khó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Được giao trực nhật lớp trong tuần, hôm nào em cũng quét lớp cẩn thận dù không có ai kiểm tra. Việc làm đó thể hiện:", "options": ["A. Em sợ bị cô giáo phê bình", "B. Tính siêng năng, tự giác và có trách nhiệm trong công việc", "C. Em muốn được tuyên dương trước lớp", "D. Em không biết phân công cho bạn khác"], "answer": "B", "explain": "Làm việc chăm chỉ, tự giác ngay cả khi không ai giám sát là biểu hiện rõ của siêng năng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn Sơn đặt mục tiêu đọc hết một cuốn sách 200 trang trong tháng. Cách làm nào giúp Sơn kiên trì thực hiện mục tiêu?", "options": ["A. Đọc một mạch 200 trang trong một ngày rồi thôi", "B. Khi nào hứng thì đọc nhiều, không hứng thì bỏ", "C. Mỗi ngày đọc khoảng 10 trang theo kế hoạch, đều đặn đến khi hết sách", "D. Nhờ bạn đọc tóm tắt hộ cho nhanh"], "answer": "C", "explain": "Chia nhỏ mục tiêu và thực hiện đều đặn mỗi ngày là cách rèn tính kiên trì hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong giờ thực hành, nhóm em làm thí nghiệm thất bại hai lần. Một bạn đề nghị chép kết quả của nhóm khác. Em với vai trò nhóm trưởng sẽ làm gì?", "options": ["A. Đồng ý chép kết quả cho kịp giờ", "B. Xin cô hủy bài thực hành", "C. Để các bạn khác làm lại, mình đứng xem", "D. Động viên cả nhóm xem lại các bước, làm lại thí nghiệm cẩn thận hơn"], "answer": "D", "explain": "Làm lại sau thất bại, không bỏ cuộc hay gian lận là biểu hiện của kiên trì và trung thực trong học tập.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về siêng năng, kiên trì:", "statements": ["a) Siêng năng phải đi đôi với làm việc có kế hoạch, hợp lí mới đạt hiệu quả cao", "b) Cứ làm việc liên tục không nghỉ ngơi mới là siêng năng", "c) Kiên trì giúp con người vượt qua khó khăn để đạt mục tiêu", "d) Người thông minh thì không cần siêng năng, kiên trì"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: siêng năng cần kết hợp nghỉ ngơi hợp lí, làm việc khoa học. c) Đúng. d) Sai: thông minh vẫn cần chăm chỉ, bền bỉ mới thành công.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Bạn Quỳnh muốn học tốt môn Tiếng Anh. Xét tính đúng, sai của các cách làm sau:", "statements": ["a) Mỗi ngày Quỳnh học 10 từ mới và ôn lại từ của ngày hôm trước", "b) Quỳnh chỉ học Tiếng Anh khi sắp có bài kiểm tra", "c) Nghe bài hát tiếng Anh không hiểu, Quỳnh tra từ điển để hiểu nội dung", "d) Gặp đoạn văn dài, Quỳnh bỏ qua vì ngại đọc"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: học đều đặn mỗi ngày. b) Sai: học dồn, thiếu đều đặn. c) Đúng: chủ động, không ngại khó. d) Sai: né tránh việc khó.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy lập một kế hoạch ngắn (khoảng 5–7 câu) giúp em rèn luyện tính siêng năng, kiên trì trong học tập ở học kì này.", "points": 0, "explain": "Gợi ý: nêu mục tiêu cụ thể (môn học, kết quả mong muốn); việc làm mỗi ngày/tuần; cách vượt qua lúc nản chí; cách tự kiểm tra tiến bộ của bản thân."}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu về một tấm gương siêng năng, kiên trì mà em biết (người thân, thầy cô, bạn bè hoặc nhân vật em đọc được). Em học tập được gì từ tấm gương đó?", "points": 0, "explain": "Gợi ý: giới thiệu tấm gương; kể việc làm thể hiện sự chăm chỉ, bền bỉ của họ; kết quả họ đạt được; điều em muốn áp dụng vào học tập, cuộc sống của mình."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nói “Việc hôm nay chớ để ngày mai” khuyên chúng ta điều gì?", "options": ["A. Phải làm việc chăm chỉ, không trì hoãn, để việc dồn lại", "B. Nên trì hoãn công việc để có thêm thời gian nghỉ ngơi", "C. Chỉ làm những việc dễ trước", "D. Làm việc gì cũng phải chờ đến hạn cuối"], "answer": "A", "explain": "Câu nói phê phán thói trì hoãn, khuyên ta siêng năng làm việc đúng lúc, không để dồn việc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người có tính kiên trì thường có biểu hiện nào khi gặp thất bại?", "options": ["A. Bỏ cuộc và đổ lỗi cho hoàn cảnh", "B. Rút kinh nghiệm, tìm nguyên nhân và cố gắng làm lại", "C. Chuyển sang việc khác ngay và quên luôn mục tiêu cũ", "D. Buồn bã nhiều ngày, không làm gì nữa"], "answer": "B", "explain": "Người kiên trì biết rút kinh nghiệm sau thất bại và quyết tâm làm lại tốt hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đức tính siêng năng của học sinh được thể hiện qua việc nào?", "options": ["A. Đợi bố mẹ nhắc mới mở sách vở", "B. Chỉ học những môn mình thích", "C. Tự giác học bài và làm bài trước khi đến lớp", "D. Làm bài tập qua loa cho xong"], "answer": "C", "explain": "Tự giác học bài, làm bài đầy đủ là biểu hiện cơ bản nhất của siêng năng ở học sinh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn em học vẽ được một tháng, thấy vẽ chưa đẹp nên nản, định bỏ. Em sẽ khuyên bạn thế nào?", "options": ["A. Bỏ cũng được, vẽ không quan trọng", "B. Bạn nên đăng kí thêm nhiều lớp khác cùng lúc", "C. Bạn chỉ cần xem người khác vẽ là đủ giỏi", "D. Ai mới học cũng vậy, bạn nên kiên trì luyện tập từng bước, tay nghề sẽ khá dần"], "answer": "D", "explain": "Khuyên bạn bền bỉ luyện tập, không nản trước kết quả ban đầu là lời khuyên đúng tinh thần kiên trì.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sáng nào bạn Tâm cũng dậy sớm giúp mẹ tưới rau trước khi đi học, việc nhà xong xuôi mới ăn sáng. Bạn Tâm thể hiện đức tính gì?", "options": ["A. Siêng năng, chăm chỉ, biết giúp đỡ gia đình", "B. Thích làm vườn hơn đi học", "C. Muốn được mẹ cho tiền tiêu vặt", "D. Sợ bị mẹ mắng nếu không làm"], "answer": "A", "explain": "Chăm chỉ làm việc nhà đều đặn, tự giác là biểu hiện của siêng năng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Còn một tuần nữa là thi, nhưng bạn Hải vẫn dành cả buổi tối chơi game, nói “để mai học cũng kịp”. Nhận xét đúng nhất về Hải là:", "options": ["A. Hải biết sắp xếp thời gian hợp lí", "B. Hải có thói quen trì hoãn, thiếu siêng năng trong học tập", "C. Hải rất tự tin vào khả năng của mình", "D. Hải học giỏi nên không cần ôn sớm"], "answer": "B", "explain": "Để nước đến chân mới nhảy cho thấy thói trì hoãn, thiếu siêng năng — cách học như vậy khó đạt kết quả tốt.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Siêng năng, kiên trì là phẩm chất cần có ở mọi lứa tuổi, mọi nghề nghiệp", "b) Chỉ những người có hoàn cảnh khó khăn mới cần siêng năng, kiên trì", "c) Bỏ dở công việc giữa chừng nhiều lần sẽ hình thành thói quen xấu, khó sửa", "d) Kiên trì theo đuổi mục tiêu xấu cũng là điều đáng khen"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: ai cũng cần siêng năng, kiên trì để hoàn thành công việc. c) Đúng. d) Sai: chỉ kiên trì với mục tiêu đúng đắn, chính đáng mới đáng khen.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau của bạn Thắng:", "statements": ["a) Thắng đặt báo thức dậy sớm mỗi ngày để ôn bài", "b) Thắng làm bài tập về nhà ngay sau bữa tối thay vì để đến sáng hôm sau", "c) Thắng học đàn được ba buổi thì bỏ vì “thấy chán”", "d) Thi trượt đội tuyển lần đầu, Thắng ôn luyện chăm chỉ hơn để thi lại năm sau"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: không trì hoãn. c) Sai: cả thèm chóng chán. d) Đúng: không nản chí sau thất bại.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu kể về một thói quen lười biếng, hay trì hoãn mà em từng có (hoặc đang có) và cách em quyết tâm sửa đổi nó.", "points": 0, "explain": "Gợi ý: nêu thói quen xấu cụ thể; hậu quả nó gây ra; kế hoạch sửa đổi từng bước; lời hứa với bản thân theo tinh thần siêng năng, kiên trì."}, {"type": "essay", "level": "VDC", "q": "“Có công mài sắt, có ngày nên kim.” Hãy giải thích ý nghĩa của câu tục ngữ và liên hệ với việc học tập của em trong khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: giải thích hình ảnh mài sắt thành kim — việc tưởng không thể nếu kiên trì cũng thành công; liên hệ: học tập cần chăm chỉ, bền bỉ mỗi ngày; nêu một việc em sẽ áp dụng ngay."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Hành động nào sau đây thể hiện tính kiên trì của một vận động viên nhí?", "options": ["A. Chỉ tập luyện khi sắp thi đấu", "B. Bỏ tập ngay khi bị thua trận đầu tiên", "C. Luyện tập đều đặn mỗi ngày trong nhiều năm để theo đuổi ước mơ thi đấu chuyên nghiệp", "D. Tập luyện tùy hứng, thích thì tập"], "answer": "C", "explain": "Luyện tập đều đặn, lâu dài theo đuổi mục tiêu là biểu hiện điển hình của kiên trì.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao người lười biếng, thiếu kiên trì khó đạt được thành công?", "options": ["A. Vì họ thường không may mắn", "B. Vì họ không được ai giúp đỡ", "C. Vì công việc nào cũng quá khó với họ", "D. Vì họ dễ bỏ dở công việc, không tích lũy được kết quả qua từng ngày"], "answer": "D", "explain": "Lười biếng, bỏ dở giữa chừng khiến công việc không được hoàn thành, kết quả không được tích lũy.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các biểu hiện sau, đâu là biểu hiện của siêng năng, kiên trì trong lao động?", "options": ["A. Làm việc đều đặn, cẩn thận, quyết tâm hoàn thành đến cùng", "B. Làm việc qua loa, cốt cho xong", "C. Chỉ làm khi có người đứng giám sát", "D. Nhận việc rồi để đó, nhờ người khác làm thay"], "answer": "A", "explain": "Làm việc đều đặn, cẩn thận và hoàn thành đến cùng là biểu hiện của siêng năng, kiên trì trong lao động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhóm em nhận trang trí lớp trong một tuần. Đến giữa tuần nhiều bạn mệt, muốn dừng. Là nhóm trưởng, em nên làm gì?", "options": ["A. Tự làm hết một mình cho xong", "B. Chia lại công việc nhẹ hơn, động viên các bạn cố gắng hoàn thành đúng kế hoạch", "C. Đề nghị cô bỏ hoạt động này", "D. Làm qua loa phần còn lại cho có"], "answer": "B", "explain": "Biết sắp xếp lại và động viên nhau hoàn thành nhiệm vụ là cách làm của người kiên trì, có trách nhiệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn Bích đặt mục tiêu giảm thói quen dùng điện thoại quá nhiều: mỗi tối chỉ dùng 30 phút và đã thực hiện đều đặn cả tháng. Việc làm của Bích thể hiện:", "options": ["A. Bích sợ bố mẹ thu điện thoại", "B. Bích không thích chơi điện thoại nữa", "C. Tính kiên trì, quyết tâm thực hiện mục tiêu đã đặt ra", "D. Bích muốn được bạn bè khen ngợi"], "answer": "C", "explain": "Duy trì đều đặn việc đã quyết tâm trong thời gian dài chính là kiên trì.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sáng chủ nhật, em đã hứa giúp bố sơn lại hàng rào nhưng trời hơi nắng, em muốn hoãn sang tuần sau dù công việc chỉ mất một buổi. Suy nghĩ nào là đúng?", "options": ["A. Hoãn cũng không sao, tuần sau làm cũng được", "B. Nhờ bố làm một mình vì đó là việc của bố", "C. Chỉ làm khi bố mua cho đồ ăn ngon", "D. Đã hứa và công việc vừa sức thì nên làm ngay, không trì hoãn, ngại khó"], "answer": "D", "explain": "Không ngại khó, không trì hoãn việc đã hứa là biểu hiện của siêng năng, có trách nhiệm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về cách rèn luyện siêng năng, kiên trì:", "statements": ["a) Nên bắt đầu rèn luyện từ những việc nhỏ, vừa sức và làm đều đặn mỗi ngày", "b) Muốn kiên trì thì phải đặt mục tiêu càng khó càng tốt ngay từ đầu", "c) Lập thời gian biểu và nghiêm túc thực hiện giúp ta siêng năng hơn", "d) Khi gặp việc khó, nên bỏ qua ngay để không mất thời gian"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: mục tiêu cần vừa sức, tăng dần độ khó mới bền vững. c) Đúng. d) Sai: gặp việc khó cần tìm cách giải quyết, không nên né tránh.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Linh mỗi tối đều dành 30 phút đọc sách trước khi ngủ suốt cả học kì", "b) Bạn Phát học thuộc bài cũ chỉ khi cô giáo thông báo kiểm tra miệng", "c) Bạn Trâm tập viết chữ đẹp mỗi ngày dù ban đầu chữ rất xấu", "d) Bạn Quân làm bài tập nhóm một mình vì các bạn trong nhóm lười, không ai nhắc nhở gì các bạn"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: đều đặn, bền bỉ. b) Sai: học tập bị động. c) Đúng. d) Sai: để mặc nhóm lười biếng, không cùng nhau khắc phục là chưa thể hiện tinh thần trách nhiệm, kiên trì chung.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu về một mục tiêu em đặt ra cho bản thân trong năm học này và em sẽ kiên trì thực hiện nó bằng những việc làm cụ thể nào.", "points": 0, "explain": "Gợi ý: nêu mục tiêu (học tập, rèn luyện, kĩ năng...); chia mục tiêu thành các bước nhỏ; việc làm mỗi ngày/tuần; cách em tự động viên khi muốn bỏ cuộc."}, {"type": "essay", "level": "VDC", "q": "Có ý kiến cho rằng: “Chỉ cần thông minh là đủ, không cần siêng năng”. Em đồng ý hay không? Trình bày ý kiến của em trong khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: nêu rõ lập trường (không đồng ý); lí giải: thông minh giúp tiếp thu nhanh nhưng thiếu chăm chỉ, bền bỉ thì không đạt kết quả lâu dài; dẫn ví dụ thực tế hoặc tục ngữ “có công mài sắt...”; kết luận về vai trò của siêng năng, kiên trì."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "“Kiến tha lâu cũng đầy tổ” muốn nói lên điều gì?", "options": ["A. Sự siêng năng, kiên trì từng chút một sẽ tích lũy thành kết quả lớn", "B. Loài kiến rất chăm chỉ kiếm ăn", "C. Kiến là loài vật nhỏ bé nhất", "D. Muốn giàu có phải làm việc như kiến"], "answer": "A", "explain": "Câu tục ngữ ca ngợi sự chăm chỉ, kiên trì: góp nhặt từng ngày sẽ thành kết quả lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biểu hiện nào sau đây là “cả thèm chóng chán”?", "options": ["A. Luyện tập một môn thể thao đều đặn suốt hai năm", "B. Học một môn năng khiếu được vài buổi, thấy khó là bỏ, chuyển môn khác liên tục", "C. Ôn bài mỗi ngày theo thời gian biểu", "D. Làm việc nhà đều đặn mỗi tuần"], "answer": "B", "explain": "Liên tục đổi việc vì ngại khó, mau chán là biểu hiện “cả thèm chóng chán”, trái ngược với kiên trì.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người siêng năng, kiên trì thường được mọi người đánh giá như thế nào?", "options": ["A. Là người khó gần, cứng nhắc", "B. Là người chỉ biết làm việc, không biết nghỉ ngơi", "C. Được tin tưởng, quý trọng vì làm việc có trách nhiệm, đến nơi đến chốn", "D. Không được ai để ý đến"], "answer": "C", "explain": "Người chăm chỉ, bền bỉ, làm việc đến nơi đến chốn luôn được mọi người tin tưởng, quý trọng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn em rủ: “Bài tập này khó quá, bỏ qua đi, mai chép của bạn khác”. Em trả lời thế nào cho đúng?", "options": ["A. Đồng ý ngay cho đỡ mệt", "B. Bảo bạn tự làm một mình", "C. Xin cô miễn bài tập này cho cả hai", "D. Không đồng ý; hai bạn cùng ngồi lại suy nghĩ, chia nhỏ bài toán để giải từng bước"], "answer": "D", "explain": "Cùng nhau tìm cách giải quyết việc khó thay vì bỏ cuộc hay chép bài là thể hiện tính kiên trì và trung thực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em tham gia câu lạc bộ bóng đá của trường. Sau hai tháng tập luyện em vẫn chưa được vào đội hình chính, trong khi một bạn mới vào đã được chọn. Em nên làm gì?", "options": ["A. Tiếp tục kiên trì tập luyện, hỏi huấn luyện viên điểm yếu của mình để cải thiện", "B. Bỏ câu lạc bộ vì thấy bất công", "C. Cho rằng huấn luyện viên thiên vị bạn kia", "D. Chỉ đến tập khi có trận đấu giao hữu"], "answer": "A", "explain": "Kiên trì rèn luyện và tìm cách khắc phục điểm yếu là thái độ đúng khi chưa đạt kết quả mong muốn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cuối tuần, em có bài tập làm văn phải nộp sáng thứ hai. Cách làm nào thể hiện em siêng năng, biết sắp xếp công việc?", "options": ["A. Để đến tối chủ nhật mới làm vội vàng", "B. Lập dàn ý và viết bài từ thứ bảy, chủ nhật xem lại và hoàn thiện", "C. Nhờ chị gái viết hộ cho nhanh", "D. Sáng thứ hai dậy thật sớm để chép bài của bạn"], "answer": "B", "explain": "Chủ động làm sớm, có kế hoạch, tự làm bài là biểu hiện của siêng năng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Siêng năng, kiên trì giúp học sinh hình thành ý chí vượt khó trong cuộc sống", "b) Người kiên trì là người không bao giờ cần sự giúp đỡ của người khác", "c) Học sinh còn nhỏ, chưa cần rèn luyện tính siêng năng, kiên trì", "d) Việc nhỏ làm đều đặn mỗi ngày cũng là cách rèn luyện tính kiên trì"], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Sai: kiên trì không có nghĩa là từ chối mọi giúp đỡ; biết nhờ hướng dẫn đúng lúc là khôn ngoan. c) Sai: đức tính tốt cần rèn từ nhỏ. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau của bạn Hà:", "statements": ["a) Hà duy trì thói quen gấp chăn màn, dọn phòng của mình mỗi sáng", "b) Hà nhận tưới cây cho lớp cả học kì và thực hiện đều đặn không bỏ buổi nào", "c) Hà học thuộc lòng bài thơ bằng cách đọc đi đọc lại nhiều ngày", "d) Hà hứa kèm bạn học yếu nhưng chỉ kèm được hai buổi rồi bỏ vì bận chơi"], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: học thuộc bằng ôn luyện bền bỉ. d) Sai: bỏ dở việc đã hứa, thiếu kiên trì và trách nhiệm.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy kể về một lần em định bỏ cuộc giữa chừng nhưng đã cố gắng hoàn thành công việc (khoảng 5–7 câu). Điều gì đã giúp em không bỏ cuộc?", "points": 0, "explain": "Gợi ý: nêu công việc và khó khăn khiến em muốn bỏ; yếu tố giúp em tiếp tục (lời động viên, mục tiêu, tự nhủ...); kết quả và cảm xúc khi hoàn thành."}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu phân tích tác hại của thói quen lười biếng, hay bỏ dở công việc đối với một học sinh lớp 6, kèm theo lời khuyên của em.", "points": 0, "explain": "Gợi ý: nêu tác hại (học tập sa sút, mất niềm tin của thầy cô/bạn bè, bỏ lỡ cơ hội...); nguyên nhân thường gặp; lời khuyên cụ thể (bắt đầu từ việc nhỏ, lập thời gian biểu, tự thưởng khi hoàn thành...)."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Siêng năng, kiên trì trong lao động thể hiện ở việc nào?", "options": ["A. Chỉ làm việc khi có người giám sát, nhắc nhở", "B. Nhận nhiều việc cùng lúc rồi bỏ dở", "C. Chủ động làm việc, không ngại khó và làm đến nơi đến chốn mọi việc được giao", "D. Làm nhanh cho xong để còn nghỉ sớm"], "answer": "C", "explain": "Siêng năng là tự giác, tận tụy, làm việc đều đặn và có trách nhiệm đến cùng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong học tập, biểu hiện nào là “kém kiên trì” thường gặp?", "options": ["A. Ôn bài đều đặn mỗi ngày", "B. Xin thầy cô giảng lại phần chưa hiểu", "C. Lập kế hoạch ôn tập cho cả tuần", "D. Học được vài hôm hứng thú rồi bỏ bê dần khi gặp phần khó"], "answer": "D", "explain": "Mau chán, bỏ dở khi gặp khó là biểu hiện thiếu kiên trì điển hình trong học tập.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người siêng năng, kiên trì thường gặt hái được kết quả gì?", "options": ["A. Tích lũy dần kiến thức, kĩ năng và đạt thành quả bền vững theo thời gian", "B. Luôn gặp may mắn hơn người khác", "C. Được mọi người tự động giúp đỡ mọi việc", "D. Không bao giờ gặp thất bại"], "answer": "A", "explain": "Thành quả của siêng năng, kiên trì đến từ tích lũy từng ngày nên bền vững, tuy không có nghĩa là không bao giờ thất bại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em tập tâng cầu lông bằng tay trái (tay không thuận). Ban đầu cầu cứ rơi, em cảm thấy rất khó chịu. Cách nghĩ nào giúp em kiên trì tiếp tục?", "options": ["A. “Tay trái của mình yếu nên bỏ cuộc là đúng”", "B. “Ai mới tập cũng vậy; mỗi ngày tập thêm một chút, dần sẽ quen và tiến bộ”", "C. “Chỉ tập khi có bạn bè cổ vũ”", "D. “Đợi vài năm nữa tay khỏe hơn rồi tập”"], "answer": "B", "explain": "Hiểu rằng tiến bộ cần quá trình và đặt mục tiêu nhỏ mỗi ngày là cách duy trì kiên trì hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tổ của em được giao trang trí bảng tin lớp trong một tuần. Hai bạn trong tổ nản vì thấy công việc nhiều, định làm qua loa. Em nên làm gì?", "options": ["A. Cũng làm qua loa cho đồng đều với bạn", "B. Làm hết phần của cả tổ một mình mà không nói gì", "C. Động viên bạn, cùng chia nhỏ công việc theo từng ngày để tổ hoàn thành tốt nhiệm vụ", "D. Báo cô đổi em sang tổ khác"], "answer": "C", "explain": "Chia nhỏ công việc và động viên nhau hoàn thành là cách giữ sự siêng năng, kiên trì trong công việc tập thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn của em học bơi mãi không nổi, định bỏ ngang khóa học. Là bạn thân, lời khuyên nào của em hợp lí nhất?", "options": ["A. “Cậu không có năng khiếu bơi đâu, bỏ đi”", "B. “Cậu cứ nghỉ vài tháng rồi học lại sau”", "C. “Thôi đừng học nữa, đi chơi cho vui”", "D. “Bơi là kĩ năng cần luyện từng bước, cậu cứ kiên trì tập theo hướng dẫn, tớ sẽ tập cùng cậu”"], "answer": "D", "explain": "Động viên bạn kiên trì theo đúng phương pháp và đồng hành cùng bạn là lời khuyên thiết thực, tích cực.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Siêng năng, kiên trì giúp con người biến những việc khó thành có thể làm được", "b) Người kiên trì không bao giờ thay đổi cách làm khi cách cũ không hiệu quả", "c) Kiên trì đúng cách là kiên trì theo hướng đúng, biết điều chỉnh phương pháp khi cần", "d) Chỉ cần kiên trì một lần thật lớn lao là đủ cho cả đời"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: kiên trì không phải là cố chấp; cần linh hoạt đổi cách làm. c) Đúng. d) Sai: kiên trì là phẩm chất cần rèn luyện thường xuyên, suốt đời.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Giang tập đàn mỗi ngày 20 phút theo lịch cố định, dù có hôm rất bận", "b) Bạn Hiếu học thuộc bài bằng cách đọc qua một lần vào tối hôm trước ngày kiểm tra", "c) Bạn Kha ghi chép lại lỗi sai sau mỗi bài kiểm tra để lần sau không lặp lại", "d) Bạn Linh bỏ học thêm tiếng Anh sau hai buổi vì thấy chưa nói được câu nào hoàn chỉnh"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: học dồn một lần không phải là siêng năng, bền bỉ. c) Đúng. d) Sai: bỏ cuộc quá sớm vì chưa thấy kết quả ngay.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu về “ngày thứ 30” trong kế hoạch rèn luyện một thói quen tốt của em (đọc sách, tập thể dục, học từ vựng...): em đã thay đổi thế nào so với ngày đầu?", "points": 0, "explain": "Gợi ý: nhắc lại thói quen và khó khăn ngày đầu; sự thay đổi về cảm giác, kết quả sau 30 ngày kiên trì; điều em tự hào nhất; dự định duy trì tiếp theo của em."}, {"type": "essay", "level": "VDC", "q": "Nếu được viết một lá thư gửi cho “em của 3 tháng sau”, em sẽ dặn bản thân điều gì để không bỏ cuộc giữa chừng trong học tập? Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: nhắc lại mục tiêu đã đặt; dặn cách vượt qua lúc chán nản (nhớ lí do bắt đầu, chia nhỏ việc, tự thưởng khi tiến bộ...); lời hứa và lời động viên với chính mình."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Vì sao nói siêng năng, kiên trì là “chìa khóa” của thành công trong học tập?", "options": ["A. Vì việc học cần tích lũy lâu dài; chăm chỉ, bền bỉ giúp nắm vững kiến thức và vượt qua phần khó", "B. Vì học giỏi chỉ phụ thuộc vào sự chăm chỉ, không cần năng khiếu", "C. Vì học sinh siêng năng luôn được thầy cô ưu ái cho điểm cao", "D. Vì kiên trì giúp đoán trúng đề kiểm tra"], "answer": "A", "explain": "Kiến thức chỉ vững khi được tích lũy, ôn luyện bền bỉ theo thời gian — đó là vai trò của siêng năng, kiên trì.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc làm nào của người nông dân thể hiện rõ tính siêng năng, kiên trì?", "options": ["A. Chỉ xuống đồng khi trời mát và có người đi cùng", "B. Chăm sóc ruộng vườn quanh năm theo mùa vụ, không ngại nắng mưa, chờ đợi mùa thu hoạch", "C. Thuê hết mọi công đoạn, không tự làm việc gì", "D. Bỏ ruộng khi vụ đầu tiên chưa được mùa"], "answer": "B", "explain": "Nghề nông đòi hỏi lao động đều đặn, bền bỉ cả mùa vụ mới có thu hoạch — minh chứng rõ của siêng năng, kiên trì.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thói quen nào sau đây đối lập hoàn toàn với siêng năng, kiên trì?", "options": ["A. Lập thời gian biểu học tập", "B. Hoàn thành bài tập trước khi chơi", "C. Trì hoãn công việc, “để mai tính”, việc hôm nay không làm xong", "D. Nhờ người khác nhắc việc đúng giờ"], "answer": "C", "explain": "Trì hoãn, bỏ việc dang dở là biểu hiện trái ngược hẳn với siêng năng, kiên trì.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em tham gia đội tuyển bóng rổ của lớp, phải tập ném phạt 50 quả mỗi buổi. Đến quả thứ 30, tay em đã mỏi và tỉ lệ trúng giảm hẳn. Em nên:", "options": ["A. Bỏ về vì hôm nay tập thế là đủ", "B. Ném bừa cho hết 20 quả còn lại thật nhanh", "C. Từ tuần sau không tập ném phạt nữa", "D. Nghỉ ngắn vài phút lấy lại sức rồi tập tiếp đủ số lượng theo kế hoạch"], "answer": "D", "explain": "Biết nghỉ hợp lí để phục hồi rồi hoàn thành trọn mục tiêu luyện tập là kiên trì một cách khoa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn em đặt mục tiêu giảm thời gian chơi game để ôn thi nhưng mới được 3 ngày đã quay lại chơi thâu đêm và điểm kiểm tra thử rất thấp. Em nhận xét thế nào về trường hợp này?", "options": ["A. Bạn thiếu kiên trì trong việc thực hiện mục tiêu đã đặt ra nên kết quả chưa tốt", "B. Bạn thông minh nên không cần ôn nhiều", "C. Chơi game nhiều sẽ giúp đầu óc linh hoạt nên điểm thấp chỉ là do xui", "D. Giảm chơi game là mục tiêu không cần thiết với học sinh"], "answer": "A", "explain": "Đặt mục tiêu nhưng không duy trì được là thiếu kiên trì; kết quả thấp phản ánh đúng quá trình ôn tập chưa bền bỉ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thầy giáo giao dự án khoa học làm mô hình núi lửa trong 3 tuần. Nhóm em làm thử lần đầu, chất liệu không phun trào như mong muốn. Cách xử lí nào thể hiện sự kiên trì đúng đắn?", "options": ["A. Bỏ dự án, xin thầy đổi sang đề tài dễ hơn hẳn", "B. Cùng nhóm tìm nguyên nhân thất bại, điều chỉnh tỉ lệ nguyên liệu và làm lại đến khi thành công", "C. Để một bạn giỏi nhất nhóm làm lại một mình", "D. Nộp mô hình không phun trào và viết báo cáo như đã thành công"], "answer": "B", "explain": "Tìm nguyên nhân, điều chỉnh và thử lại là bản chất của kiên trì trong nghiên cứu, làm việc nghiêm túc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kiên trì không có nghĩa là lặp lại mãi một cách làm đã chứng minh là sai", "b) Khi gặp thất bại, người kiên trì sẽ tìm bài học từ thất bại đó thay vì chỉ than thở", "c) Siêng năng chỉ áp dụng cho lao động chân tay, không liên quan đến học tập trí óc", "d) Cần cù mà không biết nghỉ ngơi hợp lí vẫn có thể phản tác dụng cho sức khỏe và kết quả"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: học tập cũng đòi hỏi siêng năng, bền bỉ không kém lao động chân tay. d) Đúng: siêng năng phải đi cùng sự điều độ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau của bạn Mai:", "statements": ["a) Mai chép lại toàn bộ bài giải mẫu mà không tự làm, để “tiết kiệm thời gian ôn tập”", "b) Mai duy trì việc tự làm bài tập trước, chỗ nào không làm được mới xem hướng dẫn", "c) Sau một tuần đạt mục tiêu dậy sớm, Mai tự thưởng cho mình một buổi sáng chủ nhật ngủ nướng", "d) Mai giấu bố mẹ việc mình bỏ học đội tuyển vì thấy tập luyện quá vất vả"], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: chép bài giải thay cho tự học là lười suy nghĩ, không bền vững. b) Đúng. c) Đúng: tự thưởng hợp lí giúp duy trì động lực. d) Sai: bỏ cuộc và giấu giếm là thiếu kiên trì, thiếu trung thực.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy kể lại (khoảng 5–7 câu) một lần em muốn bỏ cuộc giữa chừng trong học tập hoặc rèn luyện nhưng cuối cùng đã vượt qua, và bài học em rút ra.", "points": 0, "explain": "Gợi ý: sự việc và lí do muốn bỏ cuộc; điều gì/người nào giúp em tiếp tục; cách em tự vượt qua; kết quả đạt được; bài học về siêng năng, kiên trì cho bản thân."}, {"type": "essay", "level": "VDC", "q": "Thiết kế một “bảng theo dõi kiên trì” cho bản thân trong 2 tuần: em theo dõi việc gì, đánh dấu ra sao và tự đánh giá cuối tuần thế nào? Trình bày khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: chọn một việc cụ thể đo được (số trang sách, số phút tập...); cách ghi/đánh dấu mỗi ngày; quy tắc không để trống quá 1 ngày; cách tự nhận xét, điều chỉnh vào cuối mỗi tuần."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Thành ngữ “Có chí thì nên” có ý nghĩa gần nhất với câu nào?", "options": ["A. Người giàu có sẽ dễ thành công hơn", "B. Làm việc gì cũng phải nhờ người khác giúp", "C. Người có ý chí, kiên trì theo đuổi mục tiêu sẽ đạt được thành công", "D. Thành công tự đến với người may mắn"], "answer": "C", "explain": "“Có chí thì nên” khẳng định vai trò quyết định của ý chí, sự bền bỉ trong mọi thành công.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong gia đình, việc làm nào của con cái thể hiện siêng năng, lao động tự giác?", "options": ["A. Chỉ làm việc nhà khi bố mẹ trả công", "B. Làm việc nhà thật nhanh cho xong khi có khách đến chơi", "C. Chờ bố mẹ nhắc nhiều lần mới bắt đầu làm", "D. Chủ động phụ giúp công việc nhà phù hợp sức mình một cách đều đặn"], "answer": "D", "explain": "Tự giác, đều đặn giúp việc nhà là biểu hiện siêng năng trong đời sống gia đình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu nào cho thấy một người đang “nước đến chân mới nhảy” — trái ngược với siêng năng?", "options": ["A. Để mọi việc dồn đến hạn chót mới vội vàng làm trong căng thẳng", "B. Ôn bài từ đầu kì học", "C. Chia nhỏ công việc làm dần mỗi ngày", "D. Luôn hoàn thành việc sớm hơn kế hoạch"], "answer": "A", "explain": "Thói quen để việc đến hạn chót mới làm là biểu hiện của sự trì trệ, thiếu siêng năng, bền bỉ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em học môn Mỹ thuật, bài vẽ tĩnh vật mãi không đạt, cô giáo góp ý phải luyện nét mỗi ngày. Kế hoạch nào giúp em cải thiện bền vững?", "options": ["A. Chỉ vẽ lại đúng một bài trước ngày nộp", "B. Mỗi ngày dành 15 phút luyện nét, cuối tuần hoàn thiện một bài vẽ và đối chiếu để thấy tiến bộ", "C. Nhờ bạn vẽ đẹp nhất lớp vẽ hộ bài của mình", "D. Bỏ môn này vì mình không có năng khiếu hội họa"], "answer": "B", "explain": "Luyện tập nhỏ nhưng đều đặn, có tổng kết tiến bộ là con đường bền vững để cải thiện kĩ năng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cả lớp được giao chăm sóc bồn hoa trước cửa lớp trong học kì 1. Sau vài tuần, nhiều bạn quên tưới vì bận trực nhật khác. Là lớp phó lao động, em nên đề xuất cách gì?", "options": ["A. Đề nghị bỏ bồn hoa cho đỡ việc", "B. Nhận tưới một mình suốt học kì", "C. Lập bảng phân công tưới cây theo tổ, theo ngày và kiểm tra nhẹ nhàng vào cuối tuần", "D. Chỉ tưới khi cô giáo nhắc"], "answer": "C", "explain": "Tổ chức phân công rõ ràng là giải pháp giúp công việc chung được duy trì siêng năng, bền bỉ cả tập thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em đọc được câu chuyện một vận động viên tập luyện 6 ngày mỗi tuần suốt 8 năm mới giành được huy chương. Câu chuyện gợi cho em suy nghĩ đúng nhất nào?", "options": ["A. Thành công là nhờ may mắn vào đúng thời điểm", "B. Muốn giỏi thể thao phải bỏ hẳn việc học văn hóa", "C. Chỉ người có tố chất đặc biệt mới cần tập luyện như vậy", "D. Đằng sau thành tích lớn là quá trình siêng năng, kiên trì bền bỉ trong thời gian dài"], "answer": "D", "explain": "Tấm gương vận động viên cho thấy thành công là kết quả của rèn luyện kiên trì lâu dài, không phải may mắn nhất thời.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Có chí thì nên” có nghĩa chỉ cần mơ ước lớn là sẽ thành công, không cần hành động", "b) Ý chí, kiên trì phải đi cùng hành động cụ thể, đều đặn mới tạo nên kết quả", "c) Người siêng năng biết sắp xếp công việc khoa học để làm việc hiệu quả hơn", "d) Siêng năng, kiên trì là phẩm chất chỉ cần khi còn đi học"], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: “chí” là ý chí hành động bền bỉ, không phải mơ ước suông. b) Đúng. c) Đúng. d) Sai: đây là phẩm chất cần suốt đời, trong mọi công việc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Nam đều đặn gửi bài tập làm thêm cho thầy chữa mỗi tuần dù không bắt buộc", "b) Bạn Oanh ôn thi bằng cách chỉ đọc lướt tài liệu vào đêm trước ngày thi", "c) Bạn Phong duy trì viết nhật kí học tập để nhìn lại sự tiến bộ của mình", "d) Bạn Quân tập gõ phím 10 ngón, thấy khó nên chuyển sang gõ tùy tiện như cũ"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: ôn dồn vào giờ chót là thiếu bền bỉ. c) Đúng. d) Sai: bỏ cách đúng vì khó là thiếu kiên trì.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu giới thiệu một tấm gương siêng năng, kiên trì mà em biết (người thật quanh em hoặc nhân vật được học), qua đó em học được điều gì cho bản thân.", "points": 0, "explain": "Gợi ý: giới thiệu ngắn về nhân vật; khó khăn họ gặp; cách họ bền bỉ vượt qua; kết quả đạt được; bài học em áp dụng vào học tập của mình."}, {"type": "essay", "level": "VDC", "q": "Em hãy viết một “cam kết kiên trì” cho chính mình trong học kì này (khoảng 5–7 câu), gồm: mục tiêu, việc làm hằng ngày và cách em tự kiểm tra, nhắc nhở bản thân.", "points": 0, "explain": "Gợi ý: mở đầu bằng mục tiêu cụ thể; nêu việc làm mỗi ngày/tuần; cách ghi nhận tiến độ; cách vượt qua những ngày “muốn bỏ cuộc”; kết bằng quyết tâm của em."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các câu sau, câu nào phê phán đúng thói lười biếng, thiếu kiên trì?", "options": ["A. “Ăn xổi ở thì” — làm việc hời hợt, chỉ lo cái lợi trước mắt, không bền lâu", "B. “Chậm mà chắc”", "C. “Dục tốc bất đạt”", "D. “Một cây làm chẳng nên non”"], "answer": "A", "explain": "“Ăn xổi ở thì” chỉ lối sống, làm việc qua loa, thiếu bền bỉ — đối lập với siêng năng, kiên trì.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi học một kĩ năng mới, thái độ nào giúp em tiến bộ nhanh và chắc nhất?", "options": ["A. Học thật nhiều trong một ngày rồi nghỉ cả tháng", "B. Học đều đặn từng bước, luyện tập thường xuyên và không ngại sai để sửa", "C. Chỉ học phần mình thấy dễ", "D. So sánh mình với người giỏi nhất rồi tự ti, bỏ cuộc"], "answer": "B", "explain": "Tiến bộ bền vững đến từ luyện tập đều đặn và tinh thần không ngại sai, sẵn sàng sửa sai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc duy trì nếp sinh hoạt tự lập, ngăn nắp mỗi ngày có liên quan thế nào đến siêng năng, kiên trì?", "options": ["A. Không liên quan, đó chỉ là thói quen cá nhân", "B. Chỉ quan trọng với học sinh ở nội trú", "C. Chính là biểu hiện của siêng năng, kiên trì trong đời sống thường ngày", "D. Chỉ cần ngăn nắp khi có người kiểm tra"], "answer": "C", "explain": "Giữ nếp sống đều đặn, ngăn nắp mỗi ngày là rèn siêng năng, kiên trì ngay trong sinh hoạt thường nhật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn học cùng bàn hay phàn nàn: “Tớ học mãi mà điểm chưa cao”. Quan sát của em cho thấy bạn học theo kiểu “bữa đực bữa cái”, hôm học hôm không. Lời góp ý chân thành và đúng nhất của em là:", "options": ["A. “Chắc cậu không hợp với việc học”", "B. “Cậu nên học thâu đêm trước kiểm tra để bù lại”", "C. “Thôi, học ít thôi cho khỏe”", "D. “Điểm số cần thời gian tích lũy; cậu thử học đều mỗi ngày một ít, đừng bữa học bữa bỏ, sẽ thấy khác”"], "answer": "D", "explain": "Góp ý vào đúng nguyên nhân — thiếu đều đặn — và đề xuất cách học bền bỉ mới giúp bạn tiến bộ thật sự.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em bắt đầu sưu tầm và học nấu những món ăn đơn giản cho gia đình vào cuối tuần. Tuần đầu, món canh em nấu bị mặn. Phản ứng nào thể hiện sự kiên trì, cầu tiến?", "options": ["A. Ghi lại rút kinh nghiệm về lượng gia vị, tuần sau nấu lại và nhờ mẹ góp ý đến khi vừa miệng", "B. Từ nay không nấu ăn nữa vì sợ bị chê", "C. Đổ lỗi cho nguyên liệu không tươi", "D. Nấu lại ngay món đó 5 lần trong cùng một ngày cho đến khi kiệt sức"], "answer": "A", "explain": "Rút kinh nghiệm và thực hành lại có hướng dẫn là cách tiến bộ bền vững, thể hiện tính kiên trì cầu tiến.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đội văn nghệ lớp tập một tiết mục múa tập thể. Một vài bạn tập mãi vẫn sai nhịp nên muốn bỏ tiết mục. Là thành viên của đội, em nên:", "options": ["A. Đồng ý bỏ tiết mục để khỏi mất công", "B. Động viên các bạn, chia nhóm nhỏ tập chậm từng động tác, kiên trì đến khi cả đội đều đều nhịp", "C. Thay các bạn yếu bằng bạn khác để tiết mục đẹp hơn", "D. Chỉ tập phần của mình, kệ phần của đội"], "answer": "B", "explain": "Cùng nhau khắc phục điểm yếu bằng luyện tập kiên trì, không bỏ rơi thành viên là tinh thần tập thể và sự bền bỉ đúng đắn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người kiên trì thường đặt ra những mục tiêu nhỏ, rõ ràng cho từng giai đoạn", "b) Kiên trì nghĩa là phải làm việc liên tục không nghỉ ngơi mới có kết quả", "c) Sự tiến bộ của bản thân là nguồn động lực quan trọng giúp duy trì sự kiên trì", "d) Nếu đã kiên trì mà vẫn thất bại thì sự kiên trì đó là vô nghĩa"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: nghỉ ngơi hợp lí là một phần của làm việc bền bỉ, khoa học. c) Đúng. d) Sai: quá trình kiên trì vẫn để lại kinh nghiệm, kĩ năng quý giá dù kết quả chưa như ý.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Tâm đặt chuông nhắc giờ học cố định mỗi tối và tuân thủ nghiêm túc", "b) Bạn Uyên làm bài tập về nhà mỗi môn ngay trong ngày được giao, không để tồn đọng", "c) Bạn Việt chỉ ôn bài khi bố mẹ ngồi cạnh giám sát", "d) Bạn Xoan bỏ cuộc thi kể chuyện sau lần đầu bị khớp khi đứng trước đám đông, không tập lại lần nào"], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng. c) Sai: phụ thuộc giám sát là chưa tự giác, chưa siêng năng thật sự. d) Sai: một lần vấp ngã mà bỏ hẳn là thiếu kiên trì.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy phân tích ngắn (5–7 câu) câu nói: “Trên bước đường thành công không có dấu chân của kẻ lười biếng” bằng một ví dụ từ đời sống học tập của em.", "points": 0, "explain": "Gợi ý: giải thích ý nghĩa câu nói; lấy ví dụ một kết quả học tập chỉ đến khi em chăm chỉ bền bỉ (hoặc hệ quả khi em lười); khẳng định bài học cho bản thân."}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu đề xuất với tổ của em một cách làm việc nhóm sao cho mọi thành viên đều phải siêng năng, kiên trì đóng góp như nhau đến cuối bài tập lớn.", "points": 0, "explain": "Gợi ý: phân công rõ người, rõ việc, rõ hạn; họp kiểm tra tiến độ định kì giữa chừng; hỗ trợ bạn chậm tiến độ thay vì chê trách; tổng kết, ghi nhận đóng góp của từng thành viên khi nộp bài."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng nhất về siêng năng, kiên trì?", "options": ["A. Là phẩm chất bẩm sinh, không rèn luyện được", "B. Chỉ cần thiết với những người không thông minh", "C. Là đức tính quý được rèn luyện qua học tập, lao động hằng ngày, quyết định phần lớn kết quả lâu dài của mỗi người", "D. Quan trọng hơn hẳn mọi phẩm chất đạo đức khác"], "answer": "C", "explain": "Siêng năng, kiên trì không phải bẩm sinh cố định mà hình thành, bền vững nhờ rèn luyện mỗi ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cách “ăn mừng tiến bộ” nào lành mạnh và giúp duy trì kiên trì lâu dài?", "options": ["A. Khoe khoang thành tích để bạn bè nể phục", "B. Bỏ hẳn việc học vài tuần để xả hơi", "C. Đòi bố mẹ thưởng món quà đắt tiền nhất", "D. Tự ghi nhận nỗ lực của mình, nghỉ ngơi hợp lí rồi đặt mục tiêu tiếp theo vừa sức"], "answer": "D", "explain": "Ghi nhận tiến bộ và tiếp tục đặt mục tiêu mới vừa sức là cách giữ động lực bền lâu, lành mạnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ở lứa tuổi học sinh lớp 6, rèn luyện siêng năng, kiên trì nên bắt đầu từ đâu?", "options": ["A. Từ những việc nhỏ, cụ thể mỗi ngày trong học tập, gia đình và giữ lời hứa với bản thân", "B. Từ những việc lớn lao thật ấn tượng", "C. Từ việc so sánh mình với bạn giỏi nhất lớp", "D. Từ việc chờ thầy cô, bố mẹ giao nhiệm vụ"], "answer": "A", "explain": "Phẩm chất lớn bắt đầu từ việc nhỏ làm đều đặn mỗi ngày — đó là đặc trưng của quá trình rèn luyện ở học sinh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tổng kết học kì, em tiến bộ rõ rệt ở môn mà đầu năm em yếu nhất. Nhìn lại, yếu tố quyết định nhất giúp em đạt kết quả đó là:", "options": ["A. Đề kiểm tra học kì này dễ hơn hẳn", "B. Em duy trì học đều mỗi ngày theo kế hoạch và không bỏ cuộc ở những phần khó nhất", "C. Em may mắn được ngồi cạnh bạn giỏi trong phòng thi", "D. Thầy cô ưu ái vì biết em cố gắng"], "answer": "B", "explain": "Kết quả tiến bộ bền vững là trái ngọt của việc học đều đặn, kiên trì suốt cả học kì.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bạn mới chuyển trường đến lớp em học rất chăm nhưng tiếp thu chậm. Một số bạn trong lớp có ý chê bạn “học dốt”. Em sẽ ứng xử thế nào?", "options": ["A. Tham gia chê cùng cho vui", "B. Kệ các bạn, không liên quan đến em", "C. Nhắc các bạn rằng mỗi người có tốc độ riêng, bạn đang rất siêng năng và xứng đáng được tôn trọng, giúp đỡ nếu cần", "D. Khuyên bạn mới học ít lại cho đỡ bị để ý"], "answer": "C", "explain": "Tôn trọng nỗ lực siêng năng của người khác và lên tiếng bảo vệ bạn là thái độ đúng đắn, nhân văn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em lập kế hoạch học hè: mỗi tuần hoàn thành 1 chủ đề ôn tập. Tuần đầu tiên cả nhà đi du lịch nên em chậm tiến độ. Kế hoạch ứng xử nào thể hiện tính kiên trì linh hoạt nhất?", "options": ["A. Hủy toàn bộ kế hoạch hè vì đã lỡ nhịp", "B. Học dồn cả chủ đề vào một ngày sau chuyến đi", "C. Nhờ anh chị làm hộ phần bài tập hè", "D. Điều chỉnh lại tiến độ các tuần sau một cách hợp lí và tiếp tục thực hiện cho đến hết kế hoạch"], "answer": "D", "explain": "Điều chỉnh kế hoạch khi có việc đột xuất nhưng không từ bỏ mục tiêu là kiên trì một cách linh hoạt, thực tế.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định tổng hợp sau:", "statements": ["a) Siêng năng, kiên trì giúp học sinh không chỉ học tốt hơn mà còn rèn ý chí cho cuộc sống sau này", "b) Học sinh thông minh thì không cần siêng năng vẫn đạt kết quả tốt lâu dài", "c) Kiên trì cần đi liền với hướng đi đúng và biết lắng nghe góp ý", "d) Thất bại tạm thời là dấu hiệu cho thấy mình nên từ bỏ mục tiêu"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: thông minh mà lười biếng thì kết quả khó bền vững. c) Đúng. d) Sai: thất bại tạm thời là cơ hội rút kinh nghiệm, không phải lí do từ bỏ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm tổng hợp sau:", "statements": ["a) Bạn Anh tổng kết cuối kì những mục tiêu chưa đạt và lập kế hoạch cải thiện cho kì sau", "b) Bạn Bình đạt điểm cao một lần liền chủ quan, bỏ bê ôn tập trong thời gian dài sau đó", "c) Bạn Chi vẫn duy trì ôn bài đều đặn cả khi đã đứng đầu lớp", "d) Bạn Dũng giấu nhẹm bài kiểm tra điểm thấp vì coi đó là thất bại không đáng nhìn lại"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: chủ quan, bỏ bê sau thành công là biểu hiện thiếu bền bỉ. c) Đúng. d) Sai: điểm thấp là dữ liệu để rút kinh nghiệm, giấu đi là né tránh.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu bày tỏ quyết tâm của em trong việc rèn luyện tính siêng năng, kiên trì từ năm học lớp 6 này, gắn với một mục tiêu cụ thể mà em đang theo đuổi.", "points": 0, "explain": "Gợi ý: nêu mục tiêu cụ thể; kể ngắn khó khăn lớn nhất em phải bền bỉ vượt qua; việc làm hằng ngày em cam kết thực hiện; kết quả em hướng tới và điều em tự nhủ khi muốn bỏ cuộc."}, {"type": "essay", "level": "VDC", "q": "Hãy tưởng tượng em được mời chia sẻ 1 phút trong buổi chào cờ về chủ đề “Bền bỉ mỗi ngày”. Em sẽ nói những gì? Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: mở đầu bằng một hình ảnh/câu chuyện ngắn về sự bền bỉ; thông điệp chính: việc nhỏ làm đều mỗi ngày tạo nên thay đổi lớn; ví dụ gần gũi với học sinh; kết bằng lời kêu gọi mọi người bắt đầu từ hôm nay."}]}]}</script>
