<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Truyền thống gia đình, dòng họ là gì?", "options": ["A. Những giá trị tốt đẹp của gia đình, dòng họ được các thế hệ gìn giữ và truyền lại cho thế hệ sau", "B. Toàn bộ tài sản, tiền bạc mà cha mẹ để lại cho con cháu", "C. Ngôi nhà cổ do tổ tiên xây dựng từ lâu đời", "D. Danh sách tên tuổi của các thành viên trong dòng họ"], "answer": "A", "explain": "Truyền thống gia đình, dòng họ là những giá trị tốt đẹp (phong tục, nếp sống, đạo đức, nghề nghiệp...) được hình thành lâu dài và truyền từ đời này sang đời khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Gia đình bạn Lan có nhiều người làm nghề dạy học và rất coi trọng việc học. Đó là truyền thống gì?", "options": ["A. Truyền thống nghề truyền thống", "B. Truyền thống hiếu học", "C. Truyền thống lao động cần cù", "D. Truyền thống đoàn kết"], "answer": "B", "explain": "Gia đình coi trọng việc học, nhiều thế hệ theo nghề dạy học → truyền thống hiếu học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi nào sau đây thể hiện sự tự hào về truyền thống gia đình, dòng họ?", "options": ["A. Giấu bạn bè về nghề nghiệp của bố mẹ vì thấy xấu hổ", "B. Chê bai phong tục của dòng họ mình trước mặt người khác", "C. Tìm hiểu lịch sử dòng họ và kể lại cho bạn bè nghe một cách trân trọng", "D. Từ chối tham gia mọi hoạt động chung của dòng họ"], "answer": "C", "explain": "Tự hào thể hiện ở việc tìm hiểu, trân trọng và giới thiệu truyền thống của gia đình, dòng họ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dòng họ của Tuấn có truyền thống làm nón lá. Nghỉ hè, Tuấn xin bố mẹ cho học cách làm nón cùng bà. Việc làm của Tuấn thể hiện điều gì?", "options": ["A. Tuấn muốn kiếm tiền tiêu vặt", "B. Tuấn không có việc gì khác để làm", "C. Tuấn làm theo sự ép buộc của bố mẹ", "D. Tuấn biết giữ gìn và phát huy nghề truyền thống của dòng họ"], "answer": "D", "explain": "Chủ động học nghề của dòng họ là biểu hiện giữ gìn, phát huy truyền thống tốt đẹp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong giờ sinh hoạt lớp, khi các bạn kể về gia đình mình, Hoa rất vui vẻ kể về nghề trồng hoa truyền thống của gia đình. Thái độ của Hoa cho thấy Hoa:", "options": ["A. Tự hào về truyền thống của gia đình mình", "B. Thích khoe khoang về gia đình", "C. Muốn được cô giáo khen", "D. Chưa hiểu về truyền thống gia đình"], "answer": "A", "explain": "Vui vẻ, trân trọng khi kể về truyền thống gia đình là biểu hiện của lòng tự hào.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn Nam nói: “Nhà tớ nghèo, chẳng có truyền thống gì đáng tự hào cả”. Em sẽ khuyên Nam điều gì?", "options": ["A. Đúng vậy, chỉ nhà giàu mới có truyền thống đáng tự hào", "B. Mỗi gia đình đều có những giá trị tốt đẹp riêng, như sự cần cù, yêu thương nhau — đó cũng là truyền thống đáng tự hào", "C. Nam nên bịa ra một truyền thống cho gia đình mình", "D. Nam không nên kể gì về gia đình mình nữa"], "answer": "B", "explain": "Mọi gia đình đều có truyền thống tốt đẹp riêng (cần cù, đoàn kết, yêu thương...), không phụ thuộc giàu nghèo.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về truyền thống gia đình, dòng họ:", "statements": ["a) Truyền thống gia đình chỉ bao gồm những tài sản vật chất như nhà cửa, ruộng đất", "b) Truyền thống gia đình gồm cả những giá trị tinh thần như nếp sống, đạo đức, phong tục tốt đẹp", "c) Chỉ những gia đình giàu có, nổi tiếng mới có truyền thống", "d) Mỗi gia đình, dòng họ đều có những truyền thống riêng của mình"], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: truyền thống chủ yếu là giá trị tinh thần, phong tục, đạo đức... b) Đúng. c) Sai: gia đình nào cũng có truyền thống riêng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Bạn Phương rất tự hào về dòng họ có truyền thống hiếu học. Xét tính đúng, sai của các việc làm sau của Phương:", "statements": ["a) Hỏi ông nội về những tấm gương học giỏi trong dòng họ để noi theo", "b) Chăm chỉ học tập để xứng đáng với truyền thống của dòng họ", "c) Cho rằng mình là con cháu nhà hiếu học nên không cần cố gắng học nữa", "d) Kể về truyền thống dòng họ cho bạn bè nghe trong giờ sinh hoạt lớp"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: tìm hiểu để noi gương. b) Đúng: hành động xứng đáng với truyền thống. c) Sai: ỷ lại vào truyền thống, không cố gắng là biểu hiện sai. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy giới thiệu một truyền thống tốt đẹp của gia đình hoặc dòng họ em (khoảng 5–7 câu). Em tự hào nhất ở truyền thống đó điều gì?", "points": 0, "explain": "Gợi ý: nêu tên truyền thống (hiếu học, nghề truyền thống, đoàn kết...); kể nguồn gốc/biểu hiện cụ thể qua các thế hệ; nêu cảm xúc tự hào và điều em học được từ truyền thống đó."}, {"type": "essay", "level": "VDC", "q": "Kể về một việc làm cụ thể mà em đã làm hoặc dự định sẽ làm để giữ gìn, phát huy truyền thống tốt đẹp của gia đình, dòng họ mình.", "points": 0, "explain": "Gợi ý: chọn việc gần gũi (phụ giúp nghề truyền thống, tham gia giỗ tổ/họp họ, học tập tốt, thăm hỏi họ hàng...); nêu cách làm, kết quả hoặc ý nghĩa của việc làm đối với bản thân và gia đình."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Truyền thống nào dưới đây thuộc truyền thống lao động của gia đình?", "options": ["A. Gia đình có nhiều người đỗ đạt cao", "B. Gia đình có nghề dệt vải truyền thống", "C. Các thế hệ trong gia đình chăm chỉ làm ăn, vượt khó vươn lên", "D. Gia đình có nhiều người tham gia cách mạng"], "answer": "C", "explain": "Lao động cần cù, chăm chỉ làm ăn, vượt khó là nội dung của truyền thống lao động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc làm nào sau đây KHÔNG phải là biểu hiện giữ gìn truyền thống gia đình?", "options": ["A. Tham gia ngày giỗ tổ của dòng họ", "B. Học hỏi nghề truyền thống từ ông bà", "C. Giữ gìn những kỉ vật của gia đình", "D. Phủ nhận, chê bai mọi phong tục của gia đình, dòng họ"], "answer": "D", "explain": "Chê bai, phủ nhận truyền thống tốt đẹp là biểu hiện trái với việc giữ gìn truyền thống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tự hào về truyền thống gia đình, dòng họ có nghĩa là:", "options": ["A. Trân trọng, giữ gìn và phát huy những giá trị tốt đẹp của gia đình, dòng họ", "B. Khoe khoang, coi thường gia đình người khác", "C. Chỉ nhắc đến truyền thống khi được người khác hỏi", "D. Bắt chước mọi thói quen của người xưa dù tốt hay xấu"], "answer": "A", "explain": "Tự hào đúng nghĩa là trân trọng, giữ gìn và phát huy các giá trị tốt đẹp, không phải khoe khoang.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dịp Tết, bố mẹ bận chuẩn bị mâm cỗ cúng tổ tiên. Hùng chủ động xin giúp mẹ lau dọn bàn thờ và nghe bố kể về ông bà tổ tiên. Việc làm của Hùng thể hiện:", "options": ["A. Hùng chỉ muốn được bố mẹ khen", "B. Hùng biết trân trọng, giữ gìn truyền thống của gia đình", "C. Hùng không muốn đi chơi với bạn bè", "D. Hùng làm việc vì bị bố mẹ bắt buộc"], "answer": "B", "explain": "Chủ động tham gia việc thờ cúng tổ tiên và tìm hiểu về nguồn cội là giữ gìn truyền thống gia đình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gia đình Mai có truyền thống đoàn kết: mỗi khi có thành viên gặp khó khăn, cả họ cùng góp sức giúp đỡ. Năm nay nhà bác Mai bị thiệt hại do bão, bố mẹ em quyết định hỗ trợ bác. Việc làm đó thể hiện:", "options": ["A. Truyền thống hiếu học của gia đình", "B. Truyền thống nghề truyền thống", "C. Truyền thống đoàn kết, yêu thương, đùm bọc lẫn nhau", "D. Truyền thống yêu nước"], "answer": "C", "explain": "Giúp đỡ nhau lúc hoạn nạn là biểu hiện của truyền thống đoàn kết, yêu thương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bạn trong lớp cho rằng: “Phong tục nào của ông bà xưa cũng phải giữ nguyên, không được thay đổi”. Ý kiến của em về quan điểm này?", "options": ["A. Hoàn toàn đồng ý, phong tục xưa luôn luôn đúng", "B. Không cần giữ bất kì phong tục nào của người xưa", "C. Phong tục xưa chỉ nên giữ ở nông thôn", "D. Chỉ giữ gìn những phong tục tốt đẹp, phù hợp; những phong tục lạc hậu cần dần loại bỏ"], "answer": "D", "explain": "Ta chỉ phát huy truyền thống tốt đẹp; phong tục lạc hậu (mê tín, trọng nam khinh nữ...) cần loại bỏ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tự hào về truyền thống gia đình là khoe khoang, tự cao trước bạn bè", "b) Tự hào về truyền thống gia đình giúp em có thêm động lực học tập và rèn luyện", "c) Học sinh còn nhỏ nên chưa cần quan tâm đến truyền thống của gia đình", "d) Tìm hiểu truyền thống gia đình giúp em hiểu và yêu quý gia đình mình hơn"], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: tự hào khác với khoe khoang, tự cao. b) Đúng. c) Sai: học sinh cần tìm hiểu, giữ gìn truyền thống từ nhỏ. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Dòng họ nhà Bình có truyền thống yêu nước, nhiều người từng tham gia kháng chiến. Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bình chăm sóc, giữ gìn cẩn thận huân chương và giấy khen của ông nội", "b) Bình kể cho bạn nghe về truyền thống yêu nước của dòng họ với thái độ trân trọng", "c) Bình cho rằng truyền thống đó đã qua, không liên quan gì đến mình", "d) Bình noi gương ông cha, tích cực tham gia hoạt động Đoàn, Đội của trường"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: giữ gìn kỉ vật là giữ gìn truyền thống. b) Đúng. c) Sai: thế hệ sau cần tiếp nối truyền thống. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Em hãy viết khoảng 5–7 câu kể về một người trong gia đình hoặc dòng họ mà em kính trọng, tự hào. Em học tập được điều gì ở người đó?", "points": 0, "explain": "Gợi ý: giới thiệu người đó là ai, có phẩm chất/việc làm tốt đẹp nào (cần cù, hiếu học, dũng cảm, nhân hậu...); nêu tình cảm của em và bài học em rút ra cho bản thân."}, {"type": "essay", "level": "VDC", "q": "Lớp em tổ chức buổi giới thiệu “Truyền thống gia đình em”. Em sẽ chuẩn bị và trình bày những nội dung gì để các bạn hiểu và trân trọng truyền thống của gia đình em?", "points": 0, "explain": "Gợi ý: chọn 1–2 truyền thống tiêu biểu; chuẩn bị dẫn chứng (câu chuyện, kỉ vật, hình ảnh...); trình bày ngắn gọn, chân thành; kết thúc bằng việc em sẽ làm để phát huy truyền thống đó."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Truyền thống hiếu học của gia đình được biểu hiện qua việc nào sau đây?", "options": ["A. Các thế hệ trong gia đình coi trọng việc học, nhiều người học giỏi, đỗ đạt", "B. Gia đình có nhiều đời làm nghề thủ công", "C. Gia đình thường xuyên giúp đỡ hàng xóm", "D. Gia đình có đông con cháu"], "answer": "A", "explain": "Hiếu học thể hiện ở sự coi trọng học tập qua nhiều thế hệ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hoạt động nào của dòng họ giúp con cháu nhớ về nguồn cội và truyền thống?", "options": ["A. Đi du lịch cùng nhau", "B. Giỗ tổ, họp họ hằng năm", "C. Mở cửa hàng kinh doanh chung", "D. Xây nhà mới cho các thành viên"], "answer": "B", "explain": "Giỗ tổ, họp họ là dịp con cháu tưởng nhớ tổ tiên, ôn lại truyền thống dòng họ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phong tục nào sau đây là lạc hậu, KHÔNG nên giữ gìn?", "options": ["A. Thờ cúng tổ tiên", "B. Sum họp gia đình ngày Tết", "C. Trọng nam khinh nữ", "D. Kính trên nhường dưới"], "answer": "C", "explain": "Trọng nam khinh nữ là hủ tục lạc hậu cần loại bỏ; các phong tục còn lại đều tốt đẹp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bà nội của Thu là nghệ nhân làm bánh truyền thống của làng. Thu thường xuyên theo bà học cách làm bánh để sau này giữ nghề. Việc làm của Thu thể hiện:", "options": ["A. Thu muốn trở thành người bán bánh giỏi nhất làng", "B. Thu chỉ thích ăn bánh do bà làm", "C. Thu giúp bà vì bà đã già yếu", "D. Thu biết trân trọng và tiếp nối nghề truyền thống của gia đình"], "answer": "D", "explain": "Học nghề từ bà là hành động tiếp nối, giữ gìn nghề truyền thống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi chuyển đến trường mới, Tuấn nghe bạn bè chê nghề quét rác của bố mình. Tuấn bình tĩnh nói: “Nghề nào chân chính cũng đáng quý, bố tớ lao động vất vả để nuôi gia đình”. Thái độ của Tuấn cho thấy:", "options": ["A. Tuấn tự hào, trân trọng công việc lao động chân chính của gia đình", "B. Tuấn xấu hổ về nghề của bố", "C. Tuấn muốn gây sự với bạn bè", "D. Tuấn không quan tâm đến lời bạn nói"], "answer": "A", "explain": "Bảo vệ, trân trọng nghề lao động chân chính của bố là biểu hiện tự hào về gia đình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gia đình em có truyền thống làm nông. Một người bạn nói: “Làm nông vất vả, quê mùa, chẳng có gì đáng tự hào”. Em sẽ trả lời thế nào là phù hợp nhất?", "options": ["A. Im lặng vì thấy bạn nói đúng", "B. Tự hào trả lời rằng lao động chân chính nào cũng đáng quý, nghề nông nuôi sống mọi người và là truyền thống cần cù của gia đình", "C. Cãi nhau với bạn đến cùng", "D. Từ nay giấu bạn về nghề của bố mẹ"], "answer": "B", "explain": "Trả lời trân trọng, đúng sự thật về giá trị của lao động chân chính là cách thể hiện lòng tự hào.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về cách giữ gìn truyền thống gia đình:", "statements": ["a) Muốn giữ gìn truyền thống, con cháu chỉ cần nhớ ngày giỗ tổ là đủ", "b) Học tập và rèn luyện tốt cũng là cách phát huy truyền thống tốt đẹp của gia đình", "c) Con cháu cần tìm hiểu về truyền thống của gia đình, dòng họ mình", "d) Truyền thống của gia đình là việc của người lớn, trẻ em không cần biết"], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: giữ gìn truyền thống cần nhiều việc làm cụ thể, không chỉ nhớ ngày giỗ. b) Đúng. c) Đúng. d) Sai: mọi thành viên, kể cả trẻ em, đều cần biết và giữ gìn truyền thống.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các tình huống sau:", "statements": ["a) Bạn Linh luôn giới thiệu quá sự thật về gia đình mình để được bạn bè nể phục", "b) Bạn Sơn giữ gìn cẩn thận cuốn gia phả của dòng họ", "c) Bạn Hà từ chối về quê dự họp họ vì cho rằng đó là việc vô bổ", "d) Bạn Việt dạy em nhỏ những bài hát ru truyền thống của quê hương mà bà đã dạy mình"], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: giới thiệu về gia đình phải đúng sự thật, khoe khoang quá mức là sai. b) Đúng. c) Sai: họp họ là hoạt động gắn kết, ôn truyền thống. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu về một kỉ vật hoặc một phong tục tốt đẹp của gia đình em mà em muốn giữ gìn mãi. Vì sao em muốn giữ gìn điều đó?", "points": 0, "explain": "Gợi ý: mô tả kỉ vật/phong tục đó; kể ý nghĩa của nó với gia đình; nêu tình cảm và cách em sẽ giữ gìn, truyền lại cho thế hệ sau."}, {"type": "essay", "level": "VDC", "q": "Nếu một người bạn nói rằng “truyền thống gia đình chẳng có ích gì cho việc học tập”, em sẽ giải thích thế nào để bạn hiểu đúng? Viết câu trả lời của em trong khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: khẳng định truyền thống tốt đẹp là động lực học tập (tấm gương hiếu học, lời dạy của ông bà...); dẫn ví dụ cụ thể; khuyên bạn tìm hiểu truyền thống của chính gia đình mình."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Việc làm nào thể hiện em đang tìm hiểu về truyền thống của dòng họ mình?", "options": ["A. Chơi điện tử trong ngày họp họ", "B. Đi ngủ sớm vào ngày giỗ tổ", "C. Hỏi ông bà về lịch sử, những tấm gương tốt của dòng họ", "D. Xin tiền bố mẹ mua đồ chơi"], "answer": "C", "explain": "Hỏi ông bà về lịch sử dòng họ là cách tìm hiểu truyền thống trực tiếp, thiết thực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Truyền thống yêu nước của gia đình, dòng họ thường gắn với những việc làm nào?", "options": ["A. Có nhiều người làm kinh doanh giỏi", "B. Có người đạt danh hiệu học sinh giỏi cấp tỉnh", "C. Có đông con cháu sống quây quần", "D. Có người tham gia cách mạng, cống hiến, hi sinh vì quê hương, đất nước"], "answer": "D", "explain": "Truyền thống yêu nước gắn với sự cống hiến cho quê hương, đất nước qua các thế hệ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi giới thiệu về truyền thống gia đình mình với người khác, em cần lưu ý điều gì?", "options": ["A. Giới thiệu đúng sự thật, với thái độ trân trọng, khiêm tốn", "B. Nói thêm thật nhiều cho ấn tượng", "C. Chỉ kể những điều tốt nhất, giấu hết khó khăn của gia đình", "D. Bắt chước cách giới thiệu của bạn khác"], "answer": "A", "explain": "Giới thiệu về gia đình cần đúng sự thật, trân trọng và khiêm tốn, tránh khoe khoang.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gia đình Dũng có truyền thống hiếu học: ông, bố đều là nhà giáo. Dũng học sa sút nhưng nghĩ “nhà mình có truyền thống học giỏi nên mình không cần cố gắng”. Suy nghĩ của Dũng là:", "options": ["A. Đúng, vì truyền thống gia đình sẽ giúp Dũng học tốt", "B. Sai, vì truyền thống chỉ có ý nghĩa khi mỗi người biết nỗ lực, noi gương và phát huy", "C. Đúng, vì Dũng có gen học giỏi của gia đình", "D. Sai, vì Dũng nên chuyển sang học nghề khác"], "answer": "B", "explain": "Ỷ lại vào truyền thống mà không nỗ lực là sai; cần noi gương và phát huy bằng hành động của chính mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vào ngày giỗ tổ, trong khi mọi người bận rộn chuẩn bị, Khánh ngồi chơi game và nói: “Việc của người lớn, cháu không cần tham gia”. Thái độ của Khánh là:", "options": ["A. Đúng, vì Khánh còn nhỏ", "B. Đúng, vì chơi game cũng là nghỉ ngơi hợp lí", "C. Chưa đúng, vì Khánh nên tham gia những việc phù hợp với lứa tuổi để gắn kết và hiểu truyền thống dòng họ", "D. Chưa đúng, vì Khánh phải làm hết mọi việc trong ngày giỗ"], "answer": "C", "explain": "Học sinh cần tham gia các hoạt động của dòng họ ở mức phù hợp với sức mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lớp tổ chức viết bài “Tự hào gia đình em”. Ngọc viết về nghề mây tre đan của bà ngoại với nhiều chi tiết chân thực và niềm tự hào. Bài viết của Ngọc thể hiện:", "options": ["A. Ngọc muốn được điểm cao môn Ngữ văn", "B. Ngọc chỉ viết theo yêu cầu của cô giáo", "C. Ngọc thích nghề mây tre đan nhất trong các nghề", "D. Ngọc biết trân trọng, tự hào về nghề truyền thống của gia đình"], "answer": "D", "explain": "Viết chân thực, trân trọng về nghề truyền thống của gia đình là biểu hiện của lòng tự hào.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mọi phong tục của gia đình, dòng họ từ xưa để lại đều là tốt đẹp và phải giữ gìn nguyên vẹn", "b) Mê tín dị đoan là hủ tục cần loại bỏ, không phải truyền thống tốt đẹp", "c) Thờ cúng tổ tiên là truyền thống tốt đẹp thể hiện lòng biết ơn nguồn cội", "d) Truyền thống gia đình chỉ được tạo nên bởi thế hệ ông bà, cha mẹ không thể tạo thêm truyền thống mới"], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: có phong tục lạc hậu cần loại bỏ. b) Đúng. c) Đúng. d) Sai: mỗi thế hệ đều có thể vun đắp thêm truyền thống tốt đẹp mới.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Gia đình bạn Ân có truyền thống đoàn kết. Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Anh chị em trong nhà nhường nhịn, giúp đỡ nhau trong học tập", "b) Khi em họ bị ốm, Ân cùng bố mẹ đến thăm và động viên", "c) Ân chỉ chơi với những người họ hàng giàu có", "d) Gia đình Ân quyên góp ủng hộ bà con vùng lũ cùng với dòng họ"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phân biệt giàu nghèo trong họ hàng là trái với truyền thống đoàn kết. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy kể lại một lần em tham gia hoạt động chung của gia đình hoặc dòng họ (giỗ tổ, họp họ, sum họp Tết...). Em cảm nhận được điều gì về truyền thống của gia đình, dòng họ mình qua hoạt động đó?", "points": 0, "explain": "Gợi ý: kể ngắn gọn hoạt động (thời gian, việc em làm); nêu không khí, tình cảm gia đình; rút ra cảm nhận về truyền thống và ý định của em trong những lần sau."}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu gửi gắm lời hứa của em với ông bà, bố mẹ về việc giữ gìn và phát huy truyền thống tốt đẹp của gia đình.", "points": 0, "explain": "Gợi ý: bày tỏ lòng biết ơn công lao của các thế hệ trước; nêu quyết tâm cụ thể (học tập, rèn luyện, việc làm hằng ngày); thể hiện tình cảm, trách nhiệm của thế hệ trẻ với gia đình, dòng họ."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Đâu là một truyền thống tốt đẹp thường có trong các gia đình Việt Nam?", "options": ["A. Kính trọng ông bà, cha mẹ, sum họp đầm ấm ngày Tết", "B. Trọng nam khinh nữ", "C. Cúng bái mê tín để chữa bệnh", "D. Ép con cái nghỉ học sớm để lao động"], "answer": "A", "explain": "Kính trên nhường dưới, sum họp ngày Tết là truyền thống tốt đẹp của gia đình Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Truyền thống của gia đình, dòng họ được truyền lại chủ yếu bằng cách nào?", "options": ["A. Chỉ bằng văn bản gia phả", "B. Qua nếp sống, lời dạy, gương sáng và hoạt động chung của các thế hệ", "C. Qua các bài học trong sách giáo khoa", "D. Qua lời kể của hàng xóm"], "answer": "B", "explain": "Truyền thống được truyền lại qua nếp sống hằng ngày, lời dạy và tấm gương của các thế hệ đi trước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi nào sau đây trái với việc tự hào về truyền thống gia đình?", "options": ["A. Kể về truyền thống gia đình trong buổi sinh hoạt lớp", "B. Sửa sang, giữ gìn nhà thờ họ", "C. Chế giễu, cười nhạo phong tục của dòng họ mình", "D. Học hỏi nghề truyền thống của gia đình"], "answer": "C", "explain": "Chế giễu phong tục của dòng họ là biểu hiện thiếu trân trọng truyền thống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bố của Tùng là thợ sửa xe, mẹ bán hàng ở chợ. Tùng luôn tự hào giới thiệu: “Bố mẹ tớ lao động vất vả, trung thực để nuôi anh em tớ ăn học”. Thái độ của Tùng là:", "options": ["A. Đáng chê vì nghề của bố mẹ Tùng bình thường", "B. Bình thường, không có gì đặc biệt", "C. Chỉ đáng quý nếu bố mẹ Tùng giàu có", "D. Đáng quý vì Tùng biết trân trọng lao động chân chính và tự hào về gia đình"], "answer": "D", "explain": "Trân trọng lao động chân chính của cha mẹ là biểu hiện đẹp của lòng tự hào về gia đình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dòng họ em chuẩn bị tổ chức lễ mừng thọ cho cụ trưởng họ 90 tuổi. Việc làm nào của em là phù hợp nhất?", "options": ["A. Cùng các anh chị chuẩn bị chương trình văn nghệ và lời chúc mừng cụ", "B. Xin bố mẹ tiền mua quà thật đắt để khoe với họ hàng", "C. Ở nhà vì cho rằng đó là việc của người lớn", "D. Chỉ đến dự khi được lì xì"], "answer": "A", "explain": "Tham gia chuẩn bị, chúc mừng người cao tuổi trong họ là việc làm phù hợp, thể hiện sự gắn bó và kính trọng truyền thống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em được giao sưu tầm tư liệu cho góc “Dòng họ em” của lớp. Cách làm nào tốt nhất?", "options": ["A. Tự bịa nội dung cho nhanh", "B. Hỏi ông bà, bố mẹ, ghi chép lại câu chuyện, chụp ảnh kỉ vật của gia đình để giới thiệu", "C. Sao chép bài của bạn khác", "D. Chỉ viết vài dòng cho xong việc"], "answer": "B", "explain": "Tìm hiểu từ chính người thân và tư liệu thật giúp bài giới thiệu chân thực, trân trọng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tự hào về truyền thống gia đình phải đi đôi với hành động giữ gìn và phát huy", "b) Chỉ cần nói mình tự hào là đủ, không cần việc làm cụ thể", "c) Học sinh có thể góp phần tạo thêm truyền thống tốt đẹp mới cho gia đình bằng học tập, rèn luyện tốt", "d) Nếu gia đình không có ai nổi tiếng thì không có truyền thống đáng tự hào"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: tự hào phải thể hiện bằng hành động. c) Đúng. d) Sai: truyền thống đáng tự hào nằm ở giá trị tốt đẹp, không ở danh tiếng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Bạn Hải có ông là thương binh. Xét tính đúng, sai của các việc làm sau của Hải:", "statements": ["a) Thường xuyên thăm hỏi, chăm sóc ông và nghe ông kể chuyện xưa", "b) Tự hào kể về ông trong bài viết “Người em kính yêu” ở lớp", "c) Cho rằng việc của ông đã qua lâu rồi, không cần nhắc lại", "d) Noi gương ông, tích cực tham gia phong trào đền ơn đáp nghĩa của trường"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cần trân trọng, ghi nhớ công lao của thế hệ trước. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu về một lời dạy của ông bà, cha mẹ mà em cho là “truyền thống tinh thần” quý giá của gia đình mình. Lời dạy đó giúp em điều gì?", "points": 0, "explain": "Gợi ý: trích lại lời dạy; giải thích ý nghĩa; kể một lần em áp dụng lời dạy vào học tập/cuộc sống; nêu mong muốn truyền lại lời dạy đó cho em nhỏ trong nhà."}, {"type": "essay", "level": "VDC", "q": "Giả sử lớp em làm một cuốn kỉ yếu “Gia đình em – niềm tự hào”. Em sẽ viết mục giới thiệu về gia đình mình như thế nào (khoảng 5–7 câu) để vừa chân thực, vừa thể hiện lòng tự hào?", "points": 0, "explain": "Gợi ý: giới thiệu các thành viên và nghề nghiệp; nêu truyền thống tiêu biểu của gia đình; một chi tiết/câu chuyện nhỏ đáng nhớ; kết bằng tình cảm và quyết tâm của em."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Nghề truyền thống của gia đình, dòng họ là:", "options": ["A. Nghề có thu nhập cao nhất trong xã hội", "B. Nghề mới xuất hiện gần đây trong làng", "C. Nghề được các thế hệ trong gia đình, dòng họ truyền dạy và gìn giữ qua nhiều đời", "D. Nghề mà mọi người trong họ đều bắt buộc phải làm"], "answer": "C", "explain": "Nghề truyền thống là nghề được truyền từ đời này sang đời khác trong gia đình, dòng họ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người đứng đầu dòng họ, chủ trì các việc chung của họ thường được gọi là:", "options": ["A. Trưởng thôn", "B. Chủ tịch xã", "C. Trưởng ban phụ huynh", "D. Trưởng họ"], "answer": "D", "explain": "Trưởng họ là người đứng đầu, chủ trì các hoạt động chung và giữ gìn truyền thống của dòng họ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu tục ngữ “Uống nước nhớ nguồn” gần nhất với ý nghĩa nào sau đây?", "options": ["A. Phải biết ơn những người đi trước đã tạo dựng nên thành quả hôm nay", "B. Phải biết tiết kiệm nước sinh hoạt", "C. Đi xa phải mang theo nước uống", "D. Nguồn nước sạch rất quan trọng với sức khỏe"], "answer": "A", "explain": "“Uống nước nhớ nguồn” dạy ta biết ơn tổ tiên, các thế hệ đi trước — gắn liền với truyền thống gia đình, dòng họ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mỗi dịp Tết, gia đình Vy lại gói bánh chưng theo công thức của cố ngoại truyền lại. Vy xung phong học gói bánh cùng mẹ và bà. Việc làm của Vy thể hiện:", "options": ["A. Vy thích ăn bánh chưng hơn bánh mua ngoài chợ", "B. Vy biết giữ gìn nét đẹp, truyền thống của gia đình qua các thế hệ", "C. Vy muốn giúp mẹ tiết kiệm tiền mua bánh", "D. Vy làm theo yêu cầu bắt buộc của bà"], "answer": "B", "explain": "Học và tiếp nối phong tục, nếp nhà từ thế hệ trước là giữ gìn truyền thống gia đình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lớp tổ chức sưu tầm ảnh “Gia đình xưa và nay”. Em mang đến bức ảnh đen trắng của ông cố và kể câu chuyện về ông cho cả lớp nghe. Việc làm này cho thấy em:", "options": ["A. Thích sưu tầm đồ cổ", "B. Muốn được cô giáo cho điểm cao", "C. Biết trân trọng quá khứ, tự hào về các thế hệ đi trước trong gia đình", "D. Chỉ làm vì đó là bài tập bắt buộc"], "answer": "C", "explain": "Giới thiệu chân thực về thế hệ đi trước thể hiện lòng tự hào và sự trân trọng truyền thống gia đình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn của em sống ở thành phố, mỗi năm chỉ về quê vào dịp giỗ tổ của dòng họ. Bạn nói: “Lần nào về tớ cũng thấy gắn bó với họ hàng hơn”. Điều đó cho thấy giỗ tổ có tác dụng gì?", "options": ["A. Giúp mọi người được nghỉ ngơi, ăn uống", "B. Là dịp để phân chia tài sản trong họ", "C. Là phong tục bắt buộc của địa phương", "D. Gắn kết con cháu trong dòng họ, nhắc nhớ nguồn cội và truyền thống"], "answer": "D", "explain": "Giỗ tổ là dịp con cháu sum họp, gắn kết và ôn lại truyền thống của dòng họ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Họp họ là dịp để con cháu gặp gỡ, bàn việc chung và ôn lại truyền thống của dòng họ", "b) Con cháu ở xa không cần tham gia hoặc quan tâm đến việc họ", "c) Giữ gìn nhà thờ họ, gia phả là cách lưu giữ truyền thống của dòng họ", "d) Truyền thống của dòng họ chỉ được kể lại, không cần việc làm cụ thể để tiếp nối"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: dù ở xa, con cháu vẫn cần hướng về nguồn cội bằng nhiều cách phù hợp. c) Đúng. d) Sai: truyền thống cần được tiếp nối bằng hành động cụ thể.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau của bạn Long:", "statements": ["a) Long giúp bố chụp lại, lưu trữ các bức ảnh cũ của gia đình vào album điện tử", "b) Long chép lại lời dặn của ông nội vào sổ để nhớ và làm theo", "c) Long chê cuốn gia phả là “đồ cổ vô dụng” và đòi vứt đi", "d) Ngày giỗ tổ, Long phụ các anh chị dọn dẹp nhà thờ họ"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: lưu giữ tư liệu gia đình. b) Đúng. c) Sai: gia phả là tư liệu quý về nguồn gốc dòng họ. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy lập kế hoạch (khoảng 5–7 câu) để em tìm hiểu về truyền thống của dòng họ mình trong tháng này: em sẽ hỏi ai, hỏi những gì và ghi chép lại bằng cách nào?", "points": 0, "explain": "Gợi ý: đối tượng hỏi (ông bà, trưởng họ...); nội dung hỏi (nguồn gốc họ, tấm gương tốt, nghề truyền thống...); cách ghi chép (sổ tay, sơ đồ thế hệ, ghi âm khi được đồng ý); mục đích của việc tìm hiểu."}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu giới thiệu về một món ăn truyền thống trong các dịp sum họp của gia đình em (bánh chưng ngày Tết, món cúng giỗ...) và ý nghĩa của nó đối với gia đình em.", "points": 0, "explain": "Gợi ý: giới thiệu món ăn và dịp làm món đó; ai là người truyền dạy cách làm; không khí gia đình khi cùng làm, cùng thưởng thức; cảm nhận của em về sự gắn kết, truyền thống."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Gia phả của dòng họ là:", "options": ["A. Tài liệu ghi chép nguồn gốc, các thế hệ và những người tiêu biểu của dòng họ", "B. Cuốn sổ ghi tiền mừng tuổi hằng năm", "C. Bản đồ đất đai của dòng họ", "D. Danh sách thành viên tham gia họp họ"], "answer": "A", "explain": "Gia phả ghi lại nguồn gốc, thứ bậc các thế hệ — là tư liệu quan trọng về lịch sử dòng họ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Truyền thống đoàn kết của một dòng họ thường thể hiện qua việc nào?", "options": ["A. Mỗi nhà tự lo việc của mình, không qua lại", "B. Con cháu đùm bọc, tương trợ nhau khi có người gặp khó khăn, hoạn nạn", "C. Chỉ giúp đỡ những người họ hàng giàu có", "D. Tổ chức ăn uống linh đình mỗi tháng"], "answer": "B", "explain": "Đoàn kết thể hiện ở sự tương trợ, đùm bọc giữa các thành viên trong dòng họ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc làm nào của thế hệ trẻ giúp truyền thống gia đình không bị mai một?", "options": ["A. Chỉ nghe kể mà không ghi chép, thực hành gì", "B. Để dành việc giữ truyền thống cho người già trong nhà", "C. Học hỏi, thực hành và kể lại truyền thống cho thế hệ sau", "D. Thay toàn bộ phong tục cũ bằng phong tục mới lạ"], "answer": "C", "explain": "Truyền thống sống được nhờ thế hệ trẻ học hỏi, thực hành và truyền lại cho thế hệ tiếp theo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em làm một cuốn album ảnh nhỏ tặng ông nội nhân sinh nhật, trong đó có ảnh các thế hệ của gia đình kèm chú thích em hỏi được từ bố mẹ. Việc làm này thể hiện:", "options": ["A. Em khéo tay, giỏi làm đồ thủ công", "B. Em muốn được ông cho quà sinh nhật lại", "C. Em làm vì không biết mua quà gì khác", "D. Em biết trân trọng và lưu giữ kỉ niệm, truyền thống của gia đình"], "answer": "D", "explain": "Lưu giữ hình ảnh, câu chuyện của các thế hệ là cách giữ gìn truyền thống gia đình rất ý nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thấy em trai xé một trang trong cuốn sổ ghi chép của gia đình để gấp máy bay giấy, em nên làm gì?", "options": ["A. Nhắc em dừng lại, giải thích đó là tư liệu của gia đình cần giữ gìn, và cho em giấy khác để chơi", "B. Mặc kệ vì đó chỉ là cuốn sổ cũ", "C. Giật lại cuốn sổ và mắng em thật to", "D. Xé thêm vài trang cho em gấp cùng"], "answer": "A", "explain": "Nhắc nhở, giải thích nhẹ nhàng giúp em nhỏ hiểu giá trị của tư liệu gia đình là ứng xử đúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn em ở quê khác chuyển đến, kể rằng dòng họ bạn ấy có tục lệ mỗi năm trao học bổng cho con cháu học giỏi từ quỹ khuyến học của họ. Em nhận xét thế nào về tục lệ đó?", "options": ["A. Đó là việc lãng phí tiền của dòng họ", "B. Đó là cách dòng họ phát huy truyền thống hiếu học rất đáng quý", "C. Chỉ những dòng họ giàu mới nên làm như vậy", "D. Việc học là của mỗi người, dòng họ không nên can thiệp"], "answer": "B", "explain": "Quỹ khuyến học của dòng họ là hình thức thiết thực để nuôi dưỡng, phát huy truyền thống hiếu học.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Truyền thống tốt đẹp sẽ tự tồn tại mãi mà không cần con cháu gìn giữ", "b) Mỗi thế hệ đều có trách nhiệm tiếp nối và làm phong phú thêm truyền thống của gia đình, dòng họ", "c) Việc lập quỹ khuyến học, khuyến tài là một cách phát huy truyền thống hiếu học của dòng họ", "d) Chỉ cần giữ truyền thống trong phạm vi gia đình, không nên giới thiệu cho người ngoài biết"], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: truyền thống sẽ mai một nếu không được gìn giữ, thực hành. b) Đúng. c) Đúng. d) Sai: giới thiệu truyền thống tốt đẹp một cách trân trọng là việc nên làm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Thư học thuộc và kể lại cho em nghe câu chuyện về cụ tổ của dòng họ mình", "b) Bạn Đức tự ý sửa nội dung gia phả cho “hay hơn” theo ý mình", "c) Bạn Nga xin phép bà sao chép lại những bài thuốc dân gian gia truyền để lưu giữ", "d) Bạn Phát cho rằng học nghề truyền thống của họ là “lạc hậu” nên nhất quyết không tìm hiểu"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: gia phả phải trung thực, không được tùy tiện sửa đổi. c) Đúng. d) Sai: chưa tìm hiểu đã chê bai là thiếu trân trọng truyền thống.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Nếu gia đình em chưa có một truyền thống thật rõ ràng, em sẽ đề xuất cùng bố mẹ xây dựng một thói quen/truyền thống tốt đẹp nào cho gia đình (ví dụ: bữa cơm sum họp tối chủ nhật, cùng đọc sách cuối tuần...)? Trình bày trong khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: nêu truyền thống em muốn xây dựng; lí do chọn; cách thực hiện cụ thể theo tuần/tháng; ý nghĩa của truyền thống đó với các thành viên, đặc biệt là thế hệ sau."}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu kể về ngày giỗ tổ (hoặc ngày họp họ) ở quê em: không khí, công việc của từng người và cảm xúc của em trong ngày đó.", "points": 0, "explain": "Gợi ý: thời gian, địa điểm; các hoạt động chính (dọn dẹp nhà thờ họ, cúng lễ, sum họp...); việc em tham gia; cảm xúc về sự gắn kết và nguồn cội."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm khác biệt quan trọng giữa truyền thống tốt đẹp và hủ tục là:", "options": ["A. Truyền thống tốt đẹp có từ lâu đời hơn hủ tục", "B. Truyền thống chỉ có ở nông thôn, hủ tục chỉ có ở thành phố", "C. Truyền thống tốt đẹp mang lại giá trị lành mạnh, phù hợp với cuộc sống tiến bộ; hủ tục lạc hậu, gây hại nên cần loại bỏ", "D. Không có điểm khác biệt nào đáng kể"], "answer": "C", "explain": "Tiêu chí phân biệt là giá trị và tác động: tốt đẹp thì giữ gìn, lạc hậu gây hại thì loại bỏ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lễ mừng thọ cho người cao tuổi trong gia đình, dòng họ thể hiện truyền thống nào?", "options": ["A. Truyền thống hiếu học", "B. Truyền thống lao động cần cù", "C. Truyền thống yêu nước", "D. Truyền thống kính trọng người cao tuổi, “kính lão đắc thọ”"], "answer": "D", "explain": "Mừng thọ thể hiện đạo lí kính trọng, biết ơn người cao tuổi của dân tộc và mỗi gia đình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi ở xa quê vào đúng ngày giỗ tổ, việc làm nào thể hiện con cháu vẫn hướng về nguồn cội?", "options": ["A. Gọi điện hỏi thăm, thắp hương tưởng nhớ tại nơi ở và gửi lời chúc tới họ hàng ở quê", "B. Quên hẳn vì ở xa không tham gia được", "C. Chỉ nhớ đến khi có người nhắc", "D. Cho rằng ngày giỗ chỉ quan trọng với người ở quê"], "answer": "A", "explain": "Dù ở xa, con cháu vẫn có nhiều cách phù hợp để tưởng nhớ tổ tiên, giữ mối liên hệ với dòng họ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ngày họp họ trùng với buổi thi đấu bóng đá mà em rất muốn xem cùng bạn bè. Bố mẹ khuyên em về dự họp họ trước. Lựa chọn nào là phù hợp nhất?", "options": ["A. Ở lại xem bóng đá, họp họ sang năm dự cũng được", "B. Về dự họp họ cùng gia đình, xem lại trận đấu qua bản phát lại sau", "C. Giả ốm để được ở nhà xem bóng đá", "D. Về họp họ nhưng ngồi chơi điện thoại suốt buổi"], "answer": "B", "explain": "Ưu tiên hoạt động gắn kết dòng họ, sắp xếp việc riêng hợp lí là lựa chọn thể hiện sự trân trọng truyền thống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em nhận được giấy mời dự lễ vinh danh con cháu học giỏi của dòng họ. Em đạt thành tích tốt năm nay nhưng lại ngại đi vì không quen nhiều họ hàng. Em nên:", "options": ["A. Nhờ bố mẹ đi thay và nhận phần thưởng hộ", "B. Từ chối vì ngại", "C. Mạnh dạn tham dự, coi đây là dịp làm quen họ hàng và tự hứa sẽ tiếp tục học tốt", "D. Chỉ đi nếu có bạn thân trong họ đi cùng"], "answer": "C", "explain": "Tham dự hoạt động của dòng họ là cơ hội gắn kết và thể hiện sự tiếp nối truyền thống hiếu học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người bạn có bố mẹ là công nhân vệ sinh môi trường tâm sự rằng bạn thấy tự ti, không dám kể về nghề của bố mẹ. Em sẽ nói gì với bạn?", "options": ["A. Khuyên bạn từ nay đừng kể gì về gia đình nữa", "B. Đồng ý rằng nghề đó không đáng tự hào", "C. Khuyên bạn nói dối về nghề của bố mẹ cho đẹp mặt", "D. Động viên bạn: nghề lao động chân chính nào cũng đáng trân trọng, bố mẹ bạn vất vả vì gia đình — đó là điều đáng tự hào"], "answer": "D", "explain": "Giúp bạn hiểu giá trị của lao động chân chính và tự hào về gia đình là cách động viên đúng đắn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về lòng tự hào về truyền thống gia đình:", "statements": ["a) Tự hào về truyền thống gia đình phải gắn với hiểu biết đúng về truyền thống đó", "b) Có thể tự hào về gia đình mình đồng thời tôn trọng truyền thống của gia đình người khác", "c) Tự hào về dòng họ mình nghĩa là cho rằng dòng họ mình hơn hẳn mọi dòng họ khác", "d) Người không tìm hiểu gì về gia đình mình vẫn có thể tự hào một cách sâu sắc"], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: tự hào cần dựa trên hiểu biết. b) Đúng. c) Sai: đó là tự cao, phân biệt, không phải tự hào lành mạnh. d) Sai: không hiểu biết thì lòng tự hào chỉ là cảm tính, nông cạn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Oanh tập hợp con cháu trong xóm học hát dân ca mà các cụ trong họ truyền lại", "b) Bạn Khôi cười nhạo lễ hội truyền thống của quê bạn khác vì thấy “quê mùa”", "c) Bạn Yến viết bài giới thiệu về làng nghề truyền thống của gia đình đăng trên bảng tin trường", "d) Bạn Bảo lấy truyền thống “nhà mình ai cũng giỏi” ra để chê bai bạn học yếu hơn"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: phải tôn trọng truyền thống, phong tục của người khác, địa phương khác. c) Đúng. d) Sai: dùng truyền thống gia đình để hạ thấp người khác là biểu hiện sai trái.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết một bài phát biểu ngắn (5–7 câu) với chủ đề: “Em tự hào là con cháu của gia đình em” để đọc trong buổi sinh hoạt lớp.", "points": 0, "explain": "Gợi ý: mở đầu giới thiệu gia đình/dòng họ; nêu 1–2 truyền thống tiêu biểu kèm dẫn chứng ngắn; bày tỏ tình cảm tự hào; kết bằng lời hứa phát huy truyền thống trong học tập, rèn luyện."}, {"type": "essay", "level": "VDC", "q": "Lớp em dự định tổ chức hoạt động “Tìm hiểu truyền thống gia đình em” trong tháng tới. Hãy đề xuất các nội dung và cách tổ chức hoạt động này trong khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: mục đích hoạt động; hình thức (triển lãm ảnh, kể chuyện, góc kỉ vật, phỏng vấn người thân...); phân công chuẩn bị; tiêu chí trân trọng, đúng sự thật khi giới thiệu về gia đình mình."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Thờ cúng tổ tiên trong các gia đình Việt Nam thể hiện điều gì?", "options": ["A. Đạo lí “uống nước nhớ nguồn”, lòng biết ơn với các thế hệ đi trước", "B. Niềm tin mê tín dị đoan cần phải xóa bỏ hoàn toàn", "C. Thói quen do người già áp đặt cho con cháu", "D. Một nghi lễ chỉ mang tính hình thức"], "answer": "A", "explain": "Thờ cúng tổ tiên là tín ngưỡng tốt đẹp thể hiện lòng biết ơn, tưởng nhớ nguồn cội của người Việt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Truyền thống yêu nước của một địa phương thường được lưu giữ qua:", "options": ["A. Các khu vui chơi giải trí mới xây", "B. Các đền thờ, lễ hội tưởng nhớ danh nhân, anh hùng của quê hương", "C. Số lượng cửa hàng, siêu thị trong vùng", "D. Những con đường mới mở"], "answer": "B", "explain": "Đền thờ và lễ hội tưởng nhớ danh nhân, anh hùng là nơi lưu giữ, giáo dục truyền thống yêu nước cho thế hệ sau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi tìm hiểu truyền thống của gia đình bạn mình, em cần có thái độ thế nào?", "options": ["A. So sánh để thấy gia đình mình hơn gia đình bạn", "B. Chỉ quan tâm đến truyền thống của gia đình mình", "C. Tôn trọng, lắng nghe và trân trọng truyền thống của gia đình bạn như của gia đình mình", "D. Chê bai những phong tục khác với nhà mình"], "answer": "C", "explain": "Mỗi gia đình có truyền thống riêng; tôn trọng sự khác biệt là thái độ đúng đắn và văn minh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn cùng lớp của em theo một tôn giáo khác nên gia đình bạn không có bàn thờ tổ tiên như nhà em. Bạn thắc mắc về việc thờ cúng của nhà em. Em nên:", "options": ["A. Chê bai gia đình bạn không biết nhớ ơn tổ tiên", "B. Tránh nói chuyện với bạn về chủ đề này mãi mãi", "C. Bắt bạn phải công nhận cách làm của nhà mình là đúng nhất", "D. Giải thích nhẹ nhàng về ý nghĩa của thờ cúng tổ tiên trong nhà mình, đồng thời tôn trọng tín ngưỡng của gia đình bạn"], "answer": "D", "explain": "Giải thích bằng thái độ tôn trọng, không phán xét giúp bạn bè hiểu và tôn trọng lẫn nhau về phong tục, tín ngưỡng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quê em có lễ hội đền thờ một vị anh hùng dân tộc vào đầu xuân. Năm nay em được phân công cùng các bạn dọn dẹp, chuẩn bị cho lễ hội. Việc tham gia này giúp em:", "options": ["A. Hiểu thêm về lịch sử quê hương và thêm tự hào về truyền thống yêu nước của địa phương", "B. Chỉ đơn giản là làm lao động công ích", "C. Có dịp nghỉ học vài buổi", "D. Được gặp gỡ nhiều bạn mới"], "answer": "A", "explain": "Tham gia lễ hội truyền thống quê hương giúp em gắn bó, hiểu và tự hào về truyền thống của quê hương, dòng họ nơi mình sinh sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gia đình em chuẩn bị đón Tết, bố giao cho em việc lau dọn bàn thờ và bày mâm ngũ quả theo hướng dẫn của bố. Em làm cẩn thận và hỏi bố ý nghĩa của từng việc. Thái độ của em cho thấy:", "options": ["A. Em chỉ làm vì bố yêu cầu", "B. Em biết học hỏi, giữ gìn phong tục tốt đẹp của gia đình trong ngày Tết", "C. Em muốn hoàn thành nhanh để đi chơi", "D. Em thích trang trí nhà cửa"], "answer": "B", "explain": "Vừa làm vừa tìm hiểu ý nghĩa phong tục là cách học hỏi, tiếp nối truyền thống của thế hệ trẻ trong gia đình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tôn trọng truyền thống gia đình mình đi đôi với tôn trọng truyền thống của gia đình, địa phương khác", "b) Phong tục thờ cúng tổ tiên ở các vùng miền có thể khác nhau về hình thức nhưng chung ý nghĩa nhớ ơn nguồn cội", "c) Gia đình nào không có nhà thờ họ riêng thì không có truyền thống dòng họ", "d) Truyền thống gia đình có thể được thể hiện ngay trong nếp ăn, nếp ở, lời ăn tiếng nói hằng ngày"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: hình thức đa dạng, ý nghĩa thống nhất. c) Sai: truyền thống nằm ở giá trị, không ở quy mô vật chất. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Hải chăm chú nghe cụ trưởng họ kể về lịch sử dòng họ trong ngày họp họ", "b) Bạn Ly dùng tiền mừng tuổi để mua thêm sách về lịch sử quê hương", "c) Bạn Mơ bắt chước giọng nói vùng miền của bạn mới để trêu đùa trước lớp", "d) Bạn Nam giúp bố ghi lại danh sách các phần mộ tổ tiên trong sổ tay gia đình"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: trêu chọc sự khác biệt vùng miền là thiếu tôn trọng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy giới thiệu một lễ hội hoặc phong tục truyền thống của quê hương em có liên quan đến việc tưởng nhớ người đi trước (khoảng 5–7 câu) và nêu cảm nghĩ của em.", "points": 0, "explain": "Gợi ý: tên lễ hội/phong tục, thời gian diễn ra; hoạt động chính; ý nghĩa tưởng nhớ, giáo dục truyền thống; cảm nghĩ và mong muốn của em về việc giữ gìn phong tục đó."}, {"type": "essay", "level": "VDC", "q": "“Con hơn cha là nhà có phúc” — theo em, thế hệ con cháu ngày nay cần làm gì để xứng đáng là “hơn cha” và làm rạng danh truyền thống gia đình? Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: hiểu “hơn cha” là tiến bộ, thành đạt hơn nhờ nỗ lực chứ không phải coi thường thế hệ trước; việc cần làm: học tập, rèn đức, giữ truyền thống tốt đẹp và vươn lên bằng năng lực thật; luôn biết ơn người đi trước."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng nhất về truyền thống gia đình, dòng họ?", "options": ["A. Là những thứ cổ xưa, không còn tác dụng trong cuộc sống hiện đại", "B. Chỉ gồm những nghề nghiệp mà cha ông để lại", "C. Là những giá trị tốt đẹp được nhiều thế hệ tạo dựng, gìn giữ và truyền lại, cần được thế hệ sau trân trọng, phát huy", "D. Chỉ có ở những dòng họ lớn, lâu đời"], "answer": "C", "explain": "Truyền thống là tài sản tinh thần quý giá của mỗi gia đình, dòng họ, cần được trân trọng và phát huy trong đời sống hôm nay.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc đầu tiên em nên làm để giữ gìn truyền thống của gia đình mình là:", "options": ["A. Mua sắm nhiều đồ trang trí theo phong cách cổ", "B. Đợi lớn lên rồi tìm hiểu cũng chưa muộn", "C. Nhờ người ngoài viết bài giới thiệu về gia đình mình", "D. Tìm hiểu, hiểu rõ truyền thống của gia đình mình gồm những gì"], "answer": "D", "explain": "Muốn giữ gìn, phát huy được truyền thống, trước hết phải tìm hiểu và hiểu đúng về nó.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các việc sau, việc nào là phát huy truyền thống hiếu học của dòng họ một cách thiết thực nhất?", "options": ["A. Bản thân chăm chỉ học tập, đạt thành tích tốt và giúp em nhỏ trong họ cùng học tốt", "B. Treo thật nhiều bằng khen của người xưa trong nhà", "C. Kể với mọi người rằng họ mình có nhiều người đỗ đạt", "D. Tổ chức ăn mừng mỗi khi có người trong họ đỗ đạt"], "answer": "A", "explain": "Phát huy truyền thống bằng chính hành động học tập và thành tích của bản thân mới là thiết thực nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tổng kết năm học, em được tuyên dương học sinh tiêu biểu. Trong bài phát biểu cảm ơn, em nhắc đến sự dạy dỗ của bố mẹ và truyền thống hiếu học của gia đình. Việc làm đó thể hiện:", "options": ["A. Em muốn lấy lòng thầy cô và bố mẹ", "B. Sự biết ơn và ý thức nối tiếp truyền thống tốt đẹp của gia đình", "C. Em khiêm tốn một cách hình thức", "D. Em cho rằng thành tích hoàn toàn do gia đình mang lại"], "answer": "B", "explain": "Ghi nhận công lao của gia đình và truyền thống dòng họ khi thành công thể hiện lòng biết ơn và sự trân trọng nguồn cội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gia đình em sắp chuyển nhà đến một thành phố xa quê. Em lo lắng sẽ ít được tham gia các hoạt động của dòng họ. Cách nào giúp em vẫn giữ mối liên hệ với dòng họ?", "options": ["A. Chấp nhận dần quên đi họ hàng ở quê", "B. Chỉ liên lạc khi cần nhờ vả việc gì", "C. Thường xuyên gọi điện, nhắn tin hỏi thăm; sắp xếp về quê vào dịp giỗ tổ, Tết; giữ gìn các kỉ vật của gia đình", "D. Nhờ bố mẹ đi lại thay cho mình hoàn toàn"], "answer": "C", "explain": "Khoảng cách địa lí không làm mất truyền thống nếu con cháu chủ động giữ liên hệ và hướng về nguồn cội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em được họ hàng xa nhờ giới thiệu một bạn học giỏi trong họ để làm gia sư cho em họ. Em biết rõ một chị trong họ vừa học giỏi vừa nhiệt tình. Em vui vẻ giới thiệu và kết nối hai người. Việc làm này thể hiện:", "options": ["A. Em thích làm trung gian cho mọi người", "B. Em muốn được chị gia sư cảm ơn", "C. Đây chỉ là việc nhỏ không có ý nghĩa gì", "D. Tinh thần tương trợ, đoàn kết giữa các thành viên trong dòng họ"], "answer": "D", "explain": "Giúp kết nối, hỗ trợ nhau trong họ là biểu hiện sống động của truyền thống đoàn kết, tương trợ của dòng họ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định tổng hợp sau:", "statements": ["a) Yêu quý, tự hào về gia đình mình là tình cảm tự nhiên, chính đáng của mỗi người", "b) Để phát huy truyền thống gia đình, con cháu cần vừa học tập gương xưa vừa nỗ lực vươn lên bằng khả năng của mình", "c) Truyền thống nào cũng bất biến, giới trẻ không được sáng tạo thêm điều mới", "d) Một gia đình có nề nếp, yêu thương nhau cũng là đang tạo truyền thống tốt đẹp cho mai sau"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: thế hệ sau có quyền và có trách nhiệm làm phong phú thêm truyền thống. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm tổng hợp sau:", "statements": ["a) Bạn An lập sơ đồ các thế hệ trong gia đình để hiểu rõ quan hệ họ hàng", "b) Bạn Bích giữ gìn và đọc lại những lá thư cũ của ông bà để hiểu thêm về gia đình", "c) Bạn Cường chỉ tự hào về gia đình khi nhà mình có việc vui, lúc khó khăn thì phủ nhận họ hàng", "d) Bạn Dung dạy em gái lễ phép chào hỏi, cảm ơn theo nếp nhà đã được ông bà dạy"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: tự hào về gia đình phải bền vững trong mọi hoàn cảnh, kể cả lúc khó khăn. d) Đúng: truyền lại nếp nhà cho thế hệ nhỏ hơn.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết một đoạn văn khoảng 5–7 câu với chủ đề: “Điều em sẽ làm hôm nay để xứng đáng với truyền thống gia đình”. Hãy nêu ít nhất hai việc làm cụ thể.", "points": 0, "explain": "Gợi ý: mở đoạn khẳng định quyết tâm; nêu hai việc cụ thể (một trong học tập, một trong sinh hoạt/gắn kết gia đình); giải thích ngắn vì sao hai việc đó là phát huy truyền thống; kết đoạn bằng lời hứa với bản thân."}, {"type": "essay", "level": "VDC", "q": "Hãy tưởng tượng 20 năm sau, em kể cho con mình nghe về gia đình. Em sẽ kể điều gì nhất về truyền thống của gia đình, dòng họ mình? Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: chọn điều đáng tự hào nhất của gia đình/dòng họ; kể bằng giọng trân trọng, có chi tiết cụ thể; nêu mong muốn thế hệ sau tiếp tục giữ gìn; kết bằng tình cảm của em với nguồn cội."}]}]
