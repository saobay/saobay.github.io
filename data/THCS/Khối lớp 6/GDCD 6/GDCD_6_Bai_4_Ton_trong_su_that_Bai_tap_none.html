g bài lên gặp cô, nói rõ việc cộng nhầm để cô sửa lại điểm đúng", "B. Giữ im lặng để được điểm cao", "C. Khoe với bạn bè về sự may mắn của mình", "D. Chỉ nói với bạn thân, không nói với cô"], "answer": "A", "explain": "Nói rõ sự thật để điểm số đúng với năng lực là hành động trung thực đáng khen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn thân của em bị phát hiện quay cóp trong giờ kiểm tra. Cô giáo hỏi em có biết việc này không. Em nên trả lời thế nào?", "options": ["A. Nói là không biết gì để bảo vệ bạn", "B. Trình bày đúng sự thật những gì mình biết một cách thành thật", "C. Nói rằng cả lớp đều quay cóp như vậy", "D. Im lặng không trả lời câu nào"], "answer": "B", "explain": "Trình bày đúng sự thật là tôn trọng sự thật; bao che cho sai trái của bạn không phải là giúp bạn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tôn trọng sự thật là nói và làm đúng với những gì đã xảy ra trong thực tế", "b) Khi mình không bị phát hiện thì có thể nói dối một chút cũng không sao", "c) Nhận lỗi khi làm sai là biểu hiện của người tôn trọng sự thật", "d) Nói dối để bảo vệ bạn thân là việc làm đúng đắn"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: tôn trọng sự thật phải trung thực trong mọi hoàn cảnh, dù có bị phát hiện hay không. c) Đúng. d) Sai: bao che sai trái không phải là bảo vệ bạn mà là tiếp tay cho điều sai.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn An nghe tin đồn về bạn trong lớp nhưng không vội tin, tìm hiểu rõ rồi mới kết luận", "b) Bạn Bình chia sẻ ngay tin chưa kiểm chứng lên nhóm lớp cho mọi người biết", "c) Bạn Cường làm mất sách thư viện và chủ động báo với thủ thư để đền sách", "d) Bạn Duy thấy bạn khác làm rơi tiền nhưng im lặng lấy luôn"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: kiểm chứng thông tin trước khi tin. b) Sai: lan truyền tin chưa kiểm chứng  tưởng, yêu quý vì sống trung thực, ngay thẳng", "B. Là người cứng nhắc, khó tính", "C. Là người hay soi mói lỗi của người khác", "D. Là người không biết giữ bí mật"], "answer": "A", "explain": "Trung thực, tôn trọng sự thật giúp con người chiếm được niềm tin và sự yêu quý của mọi người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em nhặt được chiếc ví có tiền và giấy tờ ở sân trường. Hành động nào đúng nhất?", "options": ["A. Giữ lại tiền, vứt ví đi", "B. Mang nộp cho thầy cô hoặc phòng bảo vệ để trả lại người mất", "C. Mở ví đếm tiền rồi mới quyết định", "D. Đưa cho bạn thân giữ hộ"], "answer": "B", "explain": "Nộp lại của rơi cho nhà trường để trả người mất thể hiện tính trung thực, tôn trọng sự thật và quyền lợi của người khác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong nhóm học tập, bạn làm bài sai nhưng nhóm trưởng (là bạn thân của em) vẫn cho điểm cao khi chấm chéo để nhóm được khen. Em nên làm gì?", "options": ["A. Im lặng vì đó là bạn thân của mình", "B. Khoe với các nhóm khác rằng nhóm mình điểm cao nhất", "C. Góp ý với nhóm trưởng cần chấm đúng theo đáp án, công bằng với các nhóm khác", "D. Xin vào nhóm khác để khỏi liên quan"], "answer": "C", "explain": "Nhắc nhở để việc đánh giá đúng thực tế là tôn trọng sự thật và sự công bằng trong lớp học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em nghe hai bạn nói xấu rằng bạn Hoa lấy cắp đồ của bạn trong lớp, nhưng chưa ai có bằng chứng. Thái độ đúng của em là:", "options": ["A. Tin ngay và tránh chơi với Hoa", "B. Kể lại cho nhiều bạn khác nghe", "C. Hỏi Hoa một cách gay gắt trước cả lớp", "D. Không vội tin, không lan truyền; nếu cần thì khuyên các bạn báo thầy cô để tìm hiểu rõ sự việc"], "answer": "D", "explain": "Trước thông tin chưa có chứng cứ, cần bình tĩnh, không lan truyền, để người có trách nhiệm làm rõ — đó là tôn trọng sự thật.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tôn trọng sự thật:", "statements": ["a) Tôn trọng sự thật đòi hỏi ta nói đúng sự việc, không thêm thắt, bớt xén", "b) Để giữ hòa khí, ta nên đồng ý với cả những điều mình biết là sai", "c) Người tôn trọng sự thật sẵn sàng sửa sai khi nhận ra mình đánh giá chưa đúng", "d) Chỉ cần tôn trọng sự thật trong những việc lớn, việc nhỏ thì tùy ý"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: đồng ý với điều sai là tự mình xa rời sự thật. c) Đúng. d) Sai: tôn trọng sự thật cần rèn từ việc nhỏ nhất.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các tình huống sau:", "statements": ["a) Bạn Phương làm bài kiểm tra được điểm thấp nhưng nói thật với bố mẹ thay vì sửa điểm trong vở", "b) Bạn Quân giấu bố mẹ việc mình bị điểm kém bằng cách nói dối là chưa có điểm", "c) Bạn Hạnh thấy bạn chép bài bạn khác trong giờ kiểm tra, Hạnh nhắc bạn dừng lại", "d) Bạn Tùng biết bạn thân lấy nhầm sách của bạn khác nhưng im lặng để bạn khỏi bị mắng"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: trung thực với bố mẹ. b) Sai: che giấu sự thật. c) Đúng: lên tiếng trước hành vi sai trái. d) Sai: im lặng bao che khiến sự việc không được làm rõ.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu nêu ý kiến của em về câu nói: “Trung thực là sức mạnh”. Em có đồng ý không? Vì sao?", "points": 0, "explain": "Gợi ý: nêu rõ đồng ý; giải thích: người trung thực được tin tưởng, giao việc quan trọng, thanh thản trong lòng; dẫn ví dụ gần gũi trong học tập, gia đình; kết luận về việc rèn tính trung thực mỗi ngày."}, {"type": "essay", "level": "VDC", "q": "Hãy tưởng tượng em là nhân chứng duy nhất thấy bạn lớp bên làm vỡ kính cửa sổ lớp em mà không ai biết. Em sẽ làm gì? Viết đoạn văn 5–7 câu trình bày cách xử lí của em và lí do.", "points": 0, "explain": "Gợi ý: không vu oan hay che giấu; trình bày sự thật với thầy cô một cách bình tĩnh, khách quan; phân biệt tôn trọng sự thật với “mách lẻo” vụ lợi; nêu lí do: sự thật giúp xử lí công bằng, tránh oan sai."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Đánh giá sự việc một cách khách quan có nghĩa là:", "options": ["A. Dựa trên chứng cứ, sự việc thực tế để nhận xét, không thiên vị", "B. Đánh giá theo cảm xúc yêu ghét cá nhân", "C. Đánh giá theo ý kiến của người có tiếng nói nhất", "D. Đánh giá sao cho có lợi cho người thân của mình"], "answer": "A", "explain": "Khách quan là dựa vào sự thật, chứng cứ, không để tình cảm hay lợi ích cá nhân chi phối.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi nào sau đây là bao che, che giấu sự thật cần phê phán?", "options": ["A. Báo với cô giáo khi thấy bạn gian lận thi cử", "B. Biết bạn lấy đồ của người khác nhưng giúp bạn giấu đi", "C. Nhắc nhở bạn khi bạn nói dối thầy cô", "D. Từ chối chép bài hộ bạn trong giờ kiểm tra"], "answer": "B", "explain": "Giúp bạn giấu hành vi sai trái là bao che, che giấu sự thật — biểu hiện đáng phê phán.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tôn trọng sự thật mang lại lợi ích nào sau đây?", "options": ["A. Giúp ta tránh được mọi hình phạt khi làm sai", "B. Giúp ta luôn được điểm cao trong học tập", "C. Giúp mọi người nhận ra sai lầm để sửa chữa, tránh hậu quả đáng tiếc", "D. Giúp ta được mọi người làm thay mọi việc"], "answer": "C", "explain": "Nói đúng sự thật giúp phát hiện và sửa chữa sai lầm kịp thời, hạn chế hậu quả xấu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em làm bài tập nhóm, phần việc của em làm sai khiến cả nhóm bị điểm thấp. Các bạn trong nhóm chưa biết nguyên nhân. Em nên:", "options": ["A. Im lặng để các bạn tự đoán", "B. Đổ lỗi cho bạn khác trình bày không tốt", "C. Xin cô đổi sang nhóm khác", "D. Thành thật nhận phần lỗi của mình với nhóm và cùng các bạn rút kinh nghiệm"], "answer": "D", "explain": "Thành thật nhận lỗi của mình là tôn trọng sự thật và có trách nhiệm với tập thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên mạng xã hội xuất hiện bài viết nói một thầy giáo trong trường “đánh học sinh”, kèm ảnh không rõ nguồn. Nhiều bạn chia sẻ rầm rộ. Em nên làm gì?", "options": ["A. Không chia sẻ khi chưa rõ đúng sai; nếu lo lắng thì hỏi thầy cô, bố mẹ để kiểm chứng thông tin", "B. Chia sẻ ngay để mọi người cùng biết", "C. Bình luận chỉ trích thầy giáo theo đám đông", "D. Lưu bài viết lại để sau này dùng"], "answer": "A", "explain": "Trước thông tin chưa kiểm chứng, không lan truyền là thái độ đúng, tránh làm tổn hại danh dự người khác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em hẹn bạn cùng đi thư viện chiều nay nhưng sau đó em muốn ở nhà chơi game nên định nhắn tin nói dối là “nhà có việc bận”. Suy nghĩ đúng đắn nhất là:", "options": ["A. Nói dối một lần cũng không sao", "B. Nói thật lí do và xin lỗi bạn, hẹn lại buổi khác; tốt hơn nữa là giữ lời hẹn ban đầu", "C. Nhắn tin nói dối rồi chặn tin nhắn của bạn", "D. Không nhắn gì, để bạn tự hiểu"], "answer": "B", "explain": "Nói thật và tôn trọng lời hẹn thể hiện tính trung thực, tôn trọng sự thật và tôn trọng bạn bè.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nói dối vì mục đích tốt thì lúc nào cũng đúng và nên làm", "b) Trong học tập, gian lận thi cử là hành vi không tôn trọng sự thật về năng lực của bản thân", "c) Người tôn trọng sự thật sẵn sàng bảo vệ lẽ phải khi có điều kiện an toàn cho phép", "d) Sự thật đôi khi phũ phàng nên ta không bao giờ nên nói ra"], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: dù mục đích tự cho là tốt, nói dối vẫn làm mất niềm tin; cần tìm cách ứng xử khéo léo nhưng trung thực. b) Đúng. c) Đúng. d) Sai: tôn trọng sự thật không đồng nghĩa với né tránh sự thật.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Khánh ghi chép kết quả thí nghiệm đúng như thực tế quan sát được, dù kết quả khác sách", "b) Bạn Lâm sửa số liệu thí nghiệm cho “đẹp” để được điểm cao", "c) Bạn Ngọc thừa nhận với cô là mình chưa học bài khi được gọi kiểm tra miệng", "d) Bạn Phong nói dối bố mẹ là đi học thêm để đi chơi điện tử"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: ghi đúng thực tế quan sát là tôn trọng sự thật trong học tập. b) Sai: sửa số liệu là gian dối. c) Đúng. d) Sai: nói dối bố mẹ là thiếu trung thực.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu kể về một tình huống em từng chứng kiến có người bị hiểu lầm vì tin đồn sai sự thật. Theo em, cần làm gì để tránh những hiểu lầm như vậy?", "points": 0, "explain": "Gợi ý: kể ngắn gọn tình huống; hậu quả của tin đồn với người bị hiểu lầm; bài học: kiểm chứng thông tin, không lan truyền tin chưa rõ, lắng nghe các phía."}, {"type": "essay", "level": "VDC", "q": "“Nói thật dễ mất lòng” — có bạn vì sợ mất lòng bạn bè nên không dám nói ra sự thật. Em sẽ khuyên bạn thế nào trong khoảng 5–7 câu?", "points": 0, "explain": "Gợi ý: đồng cảm với sự e ngại của bạn; phân tích: nói thật một cách khéo léo, tế nhị sẽ giữ được cả sự thật lẫn tình bạn; im lặng hoặc nói sai sự thật lâu dài gây hại lớn hơn; khuyên bạn chọn lúc và cách nói phù hợp."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Việc làm nào thể hiện học sinh tôn trọng sự thật trong kiểm tra, thi cử?", "options": ["A. Nhìn bài bạn khi gặp câu khó", "B. Mang tài liệu vào phòng thi nhưng không dùng đến", "C. Không quay cóp, không hỏi bài bạn, làm bài bằng thực lực của mình", "D. Nhờ bạn giỏi ngồi cạnh nhắc bài"], "answer": "C", "explain": "Làm bài bằng thực lực, không gian lận là biểu hiện trực tiếp của tôn trọng sự thật trong thi cử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi được hỏi về một việc mình chưa nắm rõ, thái độ đúng là:", "options": ["A. Trả lời bừa cho có chuyện", "B. Đổ cho người khác trả lời thay", "C. Im lặng và bỏ đi", "D. Nói rõ là mình chưa biết, chưa rõ và cần tìm hiểu thêm"], "answer": "D", "explain": "Thừa nhận điều mình chưa biết thay vì nói bừa là thái độ trung thực, tôn trọng sự thật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi lan truyền thông tin chưa kiểm chứng trên mạng xã hội có thể gây ra hậu quả gì?", "options": ["A. Có thể làm tổn hại danh dự, gây hiểu lầm và hoang mang cho nhiều người", "B. Không gây hậu quả gì vì chỉ là trên mạng", "C. Giúp mọi người biết tin nhanh hơn", "D. Chỉ ảnh hưởng đến người đăng bài đầu tiên"], "answer": "A", "explain": "Tin sai lan truyền nhanh có thể gây tổn hại lớn về danh dự, tinh thần cho người liên quan và cộng đồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em và bạn cùng làm trực nhật. Bạn lười, bỏ về sớm, phần việc còn lại em làm hết. Cô giáo hỏi nhóm trực nhật hôm nay thế nào, em nên trả lời ra sao?", "options": ["A. Nói rằng cả hai cùng làm chăm chỉ để bạn khỏi bị phê bình", "B. Trình bày đúng sự thật một cách bình tĩnh, không thêm thắt, để cô nắm tình hình thực tế", "C. Nói xấu bạn thật nhiều để bạn bị phạt nặng", "D. Nhận hết công lao về mình nhưng không nhắc gì đến bạn"], "answer": "B", "explain": "Trình bày đúng sự thật, khách quan, không thêm bớt là cách trả lời đúng với tinh thần tôn trọng sự thật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn của em bị điểm kém, nhờ em nói dối với mẹ bạn rằng bạn được điểm cao để bạn khỏi bị mắng. Em nên:", "options": ["A. Đồng ý giúp bạn vì tình bạn", "B. Đồng ý nhưng kể lại cho mẹ mình nghe", "C. Từ chối nhẹ nhàng, khuyên bạn nên nói thật với mẹ và cố gắng hơn ở lần sau", "D. Nói dối giúp bạn lần này, lần sau thì không"], "answer": "C", "explain": "Từ chối nói dối và khuyên bạn trung thực mới là giúp bạn đúng cách, giữ được lòng tin lâu dài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong trận bóng đá lớp, bóng chạm tay em trong vòng cấm nhưng trọng tài (là bạn lớp khác) không nhìn thấy, đội em đang thua. Em nên làm gì?", "options": ["A. Im lặng vì trọng tài không thấy", "B. Tranh cãi với trọng tài khi bị phát hiện", "C. Đổ cho cầu thủ đội bạn đẩy mình", "D. Chủ động giơ tay thừa nhận bóng đã chạm tay mình, chấp nhận quyết định công bằng"], "answer": "D", "explain": "Tự giác thừa nhận sự thật dù bất lợi cho mình là biểu hiện cao đẹp của tinh thần thể thao và tôn trọng sự thật.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tôn trọng sự thật giúp xây dựng môi trường học tập công bằng, lành mạnh", "b) Học sinh chỉ cần tôn trọng sự thật trước mặt thầy cô, còn với bạn bè thì tùy ý", "c) Dám nhận lỗi là yếu đuối, sẽ bị bạn bè coi thường", "d) Không lan truyền thông tin chưa kiểm chứng cũng là một cách tôn trọng sự thật"], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Sai: tôn trọng sự thật là phẩm chất thường trực, với mọi đối tượng. c) Sai: dám nhận lỗi là dũng cảm, đáng quý. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các tình huống sau:", "statements": ["a) Bạn Giang bị mất bút, chưa rõ thủ phạm nhưng khẳng định chắc chắn là bạn ngồi cạnh lấy", "b) Bạn Hà báo cáo điểm thi của mình với bố mẹ đúng số điểm thật, dù điểm chưa cao", "c) Bạn Khoa khi bị hỏi về việc đi học muộn đã nói thật là do mình dậy muộn, không đổ cho tắc đường", "d) Bạn Mẫn hứa giữ bí mật chuyện bạn thân trốn học đi chơi game và không nói cho ai biết"], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: kết luận không có chứng cứ là thiếu khách quan. b) Đúng. c) Đúng. d) Sai: giữ bí mật cho hành vi sai trái là bao che.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu phân tích hậu quả của thói quen nói dối đối với một học sinh, theo em cần làm gì để bỏ thói quen đó.", "points": 0, "explain": "Gợi ý: hậu quả (mất niềm tin của thầy cô, bạn bè, bố mẹ; phải nói dối thêm để che giấu; kết quả học tập không thật...); cách sửa: bắt đầu nói thật từ việc nhỏ, dám nhận lỗi, nhờ người thân nhắc nhở."}, {"type": "essay", "level": "VDC", "q": "Tưởng tượng lớp em tổ chức diễn đàn “Sống trung thực”. Em được chọn phát biểu đầu tiên. Hãy viết đoạn phát biểu ngắn (5–7 câu) của em.", "points": 0, "explain": "Gợi ý: mở đầu khẳng định giá trị của trung thực; dẫn ví dụ gần gũi trong lớp (thi cử, nhận lỗi...); kêu gọi các bạn cùng rèn tính trung thực, tôn trọng sự thật từ việc nhỏ mỗi ngày."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu hiện nào sau đây cho thấy một người biết tôn trọng sự thật?", "options": ["A. Nhìn nhận sự việc như nó vốn có, không thiên vị, không bóp méo", "B. Luôn nói những điều người nghe muốn nghe", "C. Chỉ tin vào điều mình thích tin", "D. Thay đổi câu trả lời tùy theo người hỏi là ai"], "answer": "A", "explain": "Tôn trọng sự thật là nhìn nhận sự việc đúng bản chất, không thiên vị hay bóp méo theo ý chủ quan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi em làm sai và bị người khác nhắc nhở đúng sự thật, thái độ nào là đúng?", "options": ["A. Cãi lại để bảo vệ mình bằng mọi cách", "B. Lắng nghe, thừa nhận điểm đúng của lời nhắc và sửa chữa", "C. Tỏ ra giận dỗi, không nói chuyện nữa", "D. Đổ lỗi sang hoàn cảnh và người khác"], "answer": "B", "explain": "Biết lắng nghe, thừa nhận sự thật và sửa sai là thái độ của người trưởng thành, cầu thị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nói nào thể hiện người nói biết tôn trọng sự thật?", "options": ["A. “Ai cũng làm thế cả, không riêng gì mình”", "B. “Em thề là em không làm, dù không ai tin cũng kệ”", "C. “Việc này đúng là do lỗi của em, em xin lỗi và sẽ sửa”", "D. “Cô cứ hỏi bạn khác, đừng hỏi em”"], "answer": "C", "explain": "Chủ động thừa nhận lỗi lầm của mình là biểu hiện rõ nhất của tôn trọng sự thật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giờ sinh hoạt, cô giáo phê bình cả lớp vì một số bạn làm ồn trong giờ tự học. Em ngồi yên lặng hôm đó nhưng biết rõ hai bạn gây ồn là ai. Khi cô hỏi, em nên:", "options": ["A. Nói rằng cả lớp đều ồn như nhau cho công bằng", "B. Im lặng tuyệt đối, không liên quan đến mình", "C. Đổ thêm tội cho bạn mà em ghét", "D. Trình bày đúng những gì mình biết để cô xử lí công bằng, tránh phê bình oan cả lớp"], "answer": "D", "explain": "Cung cấp thông tin đúng sự thật giúp xử lí công bằng, không oan người vô tội — đó là tôn trọng sự thật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn An và bạn Bình cùng bị nghi làm bẩn bảng thông báo của trường. Em tình cờ biết chắc chắn chỉ có An làm, Bình không liên quan. Em nên làm gì?", "options": ["A. Nói rõ sự thật với thầy cô để Bình không bị oan, đồng thời khuyên An tự nhận lỗi", "B. Để cả hai cùng bị phạt cho xong chuyện", "C. Giữ kín vì An là bạn cùng tổ với em", "D. Vu thêm cho Bình để An được nhẹ tội"], "answer": "A", "explain": "Nói đúng sự thật bảo vệ người bị oan và giúp bạn mình dũng cảm nhận lỗi — đó là việc làm đúng đắn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em được bạn nhờ “làm chứng” rằng bạn đã ở thư viện cả buổi chiều, trong khi em biết bạn đi chơi game. Em nên trả lời thế nào?", "options": ["A. Đồng ý làm chứng vì bạn đã nhờ rất tha thiết", "B. Từ chối và giải thích rằng em không thể nói sai sự thật, khuyên bạn thành thật với thầy cô", "C. Làm chứng nhưng sau đó kể lại cho người khác nghe sự thật", "D. Né tránh bằng cách nói không nhớ gì cả dù em nhớ rất rõ"], "answer": "B", "explain": "Từ chối nói sai sự thật, đồng thời khuyên bạn trung thực là cách ứng xử đúng, vừa giữ nguyên tắc vừa giữ tình bạn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tôn trọng sự thật:", "statements": ["a) Người tôn trọng sự thật không nói dối ngay cả khi sự thật gây bất lợi cho mình", "b) Trong một số trường hợp, nói dối “vì tập thể” là hoàn toàn đúng và không cần bàn cãi", "c) Tôn trọng sự thật góp phần giúp con người sống thanh thản, không phải lo che giấu", "d) Chỉ người lớn mới cần tôn trọng sự thật, học sinh thì chưa cần"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: mượn danh tập thể để nói dối vẫn làm mất niềm tin và công bằng. c) Đúng. d) Sai: mọi lứa tuổi đều cần rèn đức tính này.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Sương tự giác nộp lại bài kiểm tra khi phát hiện cô chấm nhầm điểm cho mình cao hơn", "b) Bạn Thọ viết thư nặc danh bịa chuyện xấu về bạn cùng lớp", "c) Bạn Uyên thừa nhận mình chưa thuộc bài khi cô kiểm tra miệng thay vì bịa lí do", "d) Bạn Việt bênh vực bạn thân bằng cách khẳng định điều mình không hề chứng kiến"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: bịa chuyện về người khác là hành vi sai trái, thiếu tôn trọng sự thật. c) Đúng. d) Sai: khẳng định điều không chứng kiến là nói không đúng sự thật.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu về một nhân vật hoặc người thật mà em ngưỡng mộ vì tính trung thực (trong truyện đã học, sách đã đọc hoặc ngoài đời). Tính trung thực của họ thể hiện qua việc gì?", "points": 0, "explain": "Gợi ý: giới thiệu nhân vật/người đó; kể việc làm thể hiện sự trung thực, tôn trọng sự thật; nêu cảm nghĩ của em và điều em muốn học tập."}, {"type": "essay", "level": "VDC", "q": "Nếu em là lớp trưởng và phát hiện bạn thân nhất của mình gian lận trong giờ kiểm tra, em sẽ xử lí thế nào để vừa tôn trọng sự thật vừa giữ được tình bạn? Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: khuyên bạn tự thú nhận với thầy cô trước; nếu bạn không tự giác, em cần báo đúng sự thật một cách tế nhị; giải thích cho bạn hiểu báo cáo không phải phản bội mà là giúp bạn sửa sai; khẳng định tình bạn chân chính không bao che điều sai."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nói “Một lần bất tín, vạn lần bất tin” nhắc nhở điều gì?", "options": ["A. Chỉ cần nói dối thành công một lần là đủ", "B. Nói dối nhiều lần sẽ quen và không ai phát hiện", "C. Một lần không giữ sự thật, không giữ lời sẽ khiến người khác mất niềm tin lâu dài", "D. Không nên tin tưởng bất kì ai"], "answer": "C", "explain": "Câu nói nhấn mạnh cái giá rất đắt của việc đánh mất sự tin tưởng chỉ sau một lần không trung thực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong quan hệ với thầy cô, biểu hiện tôn trọng sự thật là:", "options": ["A. Chỉ nói những điều thầy cô thích nghe", "B. Giấu mọi lỗi lầm để giữ hình ảnh đẹp", "C. Xin lỗi cho qua chuyện nhưng không sửa sai", "D. Trình bày trung thực việc học, việc làm của mình kể cả khi bị phê bình"], "answer": "D", "explain": "Trung thực trước thầy cô trong mọi hoàn cảnh, nhất là khi mắc lỗi, là biểu hiện tôn trọng sự thật trong nhà trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc làm nào thể hiện tôn trọng sự thật trong học tập nhóm?", "options": ["A. Ghi nhận đúng đóng góp của từng thành viên khi báo cáo kết quả nhóm", "B. Nhận hết công lao của cả nhóm về mình", "C. Để nhóm trưởng tự quyết ai được khen", "D. Không ghi tên bạn ít nói dù bạn có đóng góp"], "answer": "A", "explain": "Đánh giá, ghi nhận đúng phần việc của mỗi người là tôn trọng sự thật trong làm việc tập thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em phụ trách chấm điểm thi đua của tổ. Bạn thân em trong tổ vi phạm nội quy (đi muộn) nên tổ sẽ bị trừ điểm nếu em ghi đúng. Em nên làm gì?", "options": ["A. Châm chước không ghi để giữ điểm cho tổ và tình bạn", "B. Ghi nhận trung thực theo quy định và động viên bạn rút kinh nghiệm lần sau", "C. Ghi trừ điểm của bạn khác nhẹ hơn thay cho bạn mình", "D. Bỏ trống phần chấm của ngày hôm đó"], "answer": "B", "explain": "Thực thi nhiệm vụ một cách trung thực, công bằng dù với bạn thân là biểu hiện cao của tôn trọng sự thật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi mua hàng ở căng-tin, cô bán hàng thối thừa cho em 10.000 đồng. Em kiểm tiền mới phát hiện. Hành động đúng nhất của em là:", "options": ["A. Giữ im lặng và tiêu luôn số tiền thừa", "B. Để dành tiền đó làm từ thiện coi như bù lại", "C. Quay lại trả lại tiền thừa cho cô và nói rõ lí do", "D. Chờ cô tự phát hiện rồi mới trả"], "answer": "C", "explain": "Trả lại tiền thừa ngay khi phát hiện là hành động trung thực thiết thực trong đời sống hằng ngày.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em vô tình làm vỡ chậu hoa của lớp khi trực nhật, lúc đó không có ai chứng kiến. Cách xử lí nào thể hiện lòng trung thực?", "options": ["A. Im lặng rời đi, giả vờ không biết gì", "B. Đổ cho gió làm đổ chậu hoa", "C. Chờ có bạn khác nhận lỗi thay", "D. Thưa thật với cô giáo, xin lỗi lớp và đề xuất cách khắc phục (góp tiền mua chậu mới, chăm cây khác)"], "answer": "D", "explain": "Tự nhận lỗi dù không ai chứng kiến, kèm cách khắc phục, là biểu hiện trung thực đáng quý nhất.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người tôn trọng sự thật luôn được mọi người tin tưởng và giao việc quan trọng", "b) Trong một số trường hợp, che giấu sự thật để bảo vệ bạn thân là chấp nhận được", "c) Nói thật đi đôi với cách nói khéo léo, tế nhị để không làm tổn thương người khác", "d) Ai cũng có lúc nói dối nên nói dối không phải là vấn đề đáng quan tâm"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: bao che cho bạn là tiếp tay cho sai trái và đánh mất sự công bằng. c) Đúng. d) Sai: nói dối dù phổ biến vẫn là hành vi sai, cần sửa chữa.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Lam thừa nhận với mẹ là mình đã làm mất chiếc ô mới khi bị hỏi", "b) Bạn Mỹ giấu bài kiểm tra bị điểm kém trong cặp suốt cả tuần, nói dối là chưa phát bài", "c) Bạn Ninh báo đúng số tiền nhặt được khi nộp cho thầy tổng phụ trách", "d) Bạn Oanh sửa ngày tháng trên bài nộp muộn để trông như nộp đúng hạn"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: giấu giếm, nói dối về kết quả học tập. c) Đúng. d) Sai: làm giả thời gian nộp bài là gian dối trong học tập.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy kể một lần em phải lựa chọn giữa nói thật (và bị phiền trách) với nói dối (để được yên thân), và bài học em rút ra sau lựa chọn của mình. Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: hoàn cảnh tình huống; hai lựa chọn và suy nghĩ của em lúc đó; lựa chọn cuối cùng và hệ quả; bài học về giá trị của sự trung thực và niềm tin."}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu nêu ý kiến của em về quan điểm: “Học sinh thời nay chỉ cần học giỏi, trung thực là chuyện nhỏ”. Em đồng ý hay không? Vì sao?", "points": 0, "explain": "Gợi ý: khẳng định rõ quan điểm; lí giải vai trò của trung thực đối với uy tín, các mối quan hệ và cả chính kết quả học tập thật; lấy một ví dụ thực tế; kết luận của em."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong thi cử, hành vi nào sau đây là gian lận, vi phạm tôn trọng sự thật?", "options": ["A. Trao đổi bài, nhìn bài bạn hoặc mang tài liệu vào phòng thi", "B. Đọc kĩ đề trước khi làm bài", "C. Xin phép nộp bài sớm khi đã làm xong", "D. Kiểm tra lại bài trước khi nộp"], "answer": "A", "explain": "Mọi hình thức chép bài, trao đổi, dùng tài liệu trái phép đều là gian lận, phá vỡ tính trung thực của thi cử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Ngay thẳng” trong cách cư xử được hiểu là:", "options": ["A. Nói năng bộc trực, nghĩ gì nói nấy không cần lựa lời", "B. Sống trung thực, thẳng thắn, không gian dối, quanh co che đậy", "C. Luôn phê phán người khác một cách gay gắt", "D. Không bao giờ nhận sai về mình"], "answer": "B", "explain": "Ngay thẳng là phẩm chất trung thực, rõ ràng trong lời nói và việc làm, không che giấu điều sai trái.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một thông tin chỉ nên được em chia sẻ cho người khác khi nào?", "options": ["A. Khi thông tin đó nghe “hot” và nhiều người đang bàn tán", "B. Khi người đăng thông tin là người nổi tiếng", "C. Khi em đã kiểm chứng nguồn và biết chắc thông tin là đúng sự thật", "D. Khi bạn bè hối thúc em chia sẻ thật nhanh"], "answer": "C", "explain": "Chỉ chia sẻ thông tin đã xác thực là cách tôn trọng sự thật và trách nhiệm trong không gian mạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong giờ kiểm tra, bạn ngồi cạnh liên tục huých tay xin em cho xem đáp án một câu khó và hứa sẽ “đền ơn” sau. Em xử lí thế nào?", "options": ["A. Cho bạn xem một câu vì tình bạn", "B. La lên cho cả lớp biết để bạn xấu hổ", "C. Làm bài sai một câu cố ý để bạn chép theo bị điểm kém", "D. Từ chối khéo, tập trung làm bài của mình; ra khỏi phòng thi nhẹ nhàng khuyên bạn lần sau tự học"], "answer": "D", "explain": "Từ chối giúp bạn gian lận nhưng vẫn giữ hòa khí và khuyên bạn sau giờ thi là ứng xử vừa trung thực vừa nhân văn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em làm quản trị viên nhóm chat của lớp. Một bạn đăng tin “ngày mai được nghỉ học” không rõ nguồn, khiến cả lớp xôn xao. Em nên làm gì?", "options": ["A. Kiểm chứng với cô chủ nhiệm hoặc thông báo chính thức của trường rồi mới thông tin lại chính xác cho lớp", "B. Ghim tin đó lên đầu nhóm cho mọi người biết", "C. Để mặc, đúng sai tính sau", "D. Đuổi bạn đăng tin ra khỏi nhóm ngay"], "answer": "A", "explain": "Người quản trị nhóm có trách nhiệm kiểm chứng tin trước khi để lan truyền — đó là tôn trọng sự thật trên không gian mạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bố em dặn: “Ai hỏi điểm kiểm tra của con thì cứ nói thật, dù cao hay thấp”. Tuân theo lời dặn này, em thể hiện điều gì?", "options": ["A. Em không có chính kiến của mình", "B. Đức tính trung thực, không chạy theo thành tích ảo hay sĩ diện", "C. Em sợ bị bố phát hiện nói dối", "D. Em muốn khoe khoang với mọi người"], "answer": "B", "explain": "Dám nói thật về kết quả của mình trong mọi hoàn cảnh là trung thực, là tôn trọng sự thật và tôn trọng chính mình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gian lận trong thi cử làm mất đi sự công bằng đối với những bạn học thật, thi thật", "b) Điểm số cao nhờ gian lận vẫn là thành quả đáng tự hào như điểm số thật", "c) Học sinh nên trung thực ngay cả trong những việc nhỏ như mượn đồ, điểm danh, trực nhật", "d) Nói thật là đủ, không cần quan tâm đến cảm xúc của người nghe"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: điểm số gian lận là thành tích giả, không phản ánh năng lực thật. c) Đúng. d) Sai: nói thật cần đi với sự tế nhị, tôn trọng người nghe.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau đây:", "statements": ["a) Bạn Phúc tự giác khai báo với cô là bài kiểm tra của mình bị chấm nhầm thừa điểm", "b) Bạn Quốc xin cô cho kiểm tra lại cùng ngày với bạn vừa khỏi ốm để “tiện chép bài”", "c) Bạn Rạng trả lại đúng cuốn truyện đã mượn dù truyện bị rách một trang và chủ động thưa thật với bạn về sự cố", "d) Bạn San viết đơn xin nghỉ học giả chữ kí của bố mẹ"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: mượn cớ để gian lận còn đáng trách hơn. c) Đúng: trả đồ kèm thành thật về sự cố. d) Sai: giả mạo chữ kí là hành vi gian dối nghiêm trọng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu phân tích tác hại của gian lận trong thi cử đối với chính người gian lận (ít nhất hai tác hại).", "points": 0, "explain": "Gợi ý: về kiến thức (hổng kiến thức mà không biết, khó khăn chồng chất sau này); về nhân cách, uy tín (quen gian dối, mất niềm tin khi bị phát hiện); về tương lai (thói quen ỷ lại, không trung thực lan sang công việc)..."}, {"type": "essay", "level": "VDC", "q": "Nếu là lớp trưởng, em sẽ đề xuất những biện pháp gì để xây dựng “lớp học trung thực” của mình? Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: cam kết không gian lận, nhắc nhau học thật; khen ngợi, nêu gương hành vi trung thực; quy định xử lí công bằng khi vi phạm; vai trò nêu gương của cán bộ lớp."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tôn trọng sự thật trong giao tiếp hằng ngày thể hiện qua:", "options": ["A. Nói điều người khác muốn nghe để lấy lòng", "B. Chỉ nói thật với người thân, còn người ngoài thì tùy ý", "C. Nói đúng những gì đã xảy ra, không thêm thắt, bóp méo theo cảm xúc cá nhân", "D. Nói thật nhưng luôn dùng giọng mỉa mai"], "answer": "C", "explain": "Truyền đạt thông tin khách quan, không bóp méo là nền tảng của tôn trọng sự thật trong giao tiếp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành động nào thể hiện sự công bằng — một biểu hiện của tôn trọng sự thật?", "options": ["A. Ưu ái bạn thân khi phân công việc và đánh giá kết quả", "B. Đánh giá theo cảm tình cá nhân từng lúc", "C. Luôn khen người có quyền thế hơn", "D. Áp dụng cùng một tiêu chuẩn cho mọi người, đánh giá đúng thực tế đóng góp"], "answer": "D", "explain": "Công bằng là đối xử theo cùng tiêu chuẩn sự thật, không thiên vị — giá trị gắn liền với tôn trọng sự thật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi nghe một lời đồn chưa rõ đúng sai về người khác, người tôn trọng sự thật sẽ:", "options": ["A. Giữ thái độ thận trọng, không khẳng định, không lan truyền khi chưa rõ sự thật", "B. Lập tức đồn tiếp cho nhiều người cùng biết", "C. Chỉ đồn cho bạn thân nghe", "D. Cho rằng cứ đồn nhiều người là chắc đúng"], "answer": "A", "explain": "Không tiếp tay cho tin đồn chưa kiểm chứng là biểu hiện căn bản của người tôn trọng sự thật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em là người chứng kiến hai bạn cãi nhau trong giờ ra chơi và được cô giáo hỏi lại sự việc. Một trong hai bạn là bạn thân của em. Em trình bày thế nào cho đúng?", "options": ["A. Thuật lại theo hướng có lợi cho bạn thân", "B. Kể lại khách quan, đầy đủ những gì em tận mắt thấy, phân biệt rõ điều em thấy và điều em nghe kể lại", "C. Nói rằng em không biết gì để tránh rắc rối", "D. Đổ lỗi cho bạn không phải bạn thân"], "answer": "B", "explain": "Kể lại khách quan, tách rõ tai nghe mắt thấy là cách người chứng kiến tôn trọng sự thật, đồng thời giúp cô xử lí công bằng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhóm em thuyết trình, một bạn trong nhóm bịa thêm số liệu “cho bài thêm hay” dù chưa tìm được nguồn. Em phát hiện ra trước buổi thuyết trình. Em nên làm gì?", "options": ["A. Để nguyên vì số liệu đó làm bài thuyết trình ấn tượng hơn", "B. Báo cô ngay để bạn bị trừ điểm", "C. Đề nghị bạn bỏ phần số liệu không có nguồn, thay bằng nhận định có căn cứ hoặc ghi rõ “theo khảo sát nhỏ của nhóm” nếu nhóm tự khảo sát", "D. Tự ý xóa phần của bạn mà không nói với ai"], "answer": "C", "explain": "Loại bỏ dữ kiện bịa đặt, thay bằng thông tin có căn cứ là tôn trọng sự thật trong học tập, đồng thời giữ uy tín cho cả nhóm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em đạt giải trong một cuộc thi cấp trường nhờ bài dự thi có phần ý tưởng của bạn cùng lớp gợi ý. Khi lên nhận giải và phát biểu, điều nên làm là:", "options": ["A. Nhận toàn bộ công lao về mình cho gọn", "B. Chỉ cảm ơn thầy cô cho đúng thủ tục", "C. Tránh nhắc đến bất kì ai để khỏi chia sẻ vinh quang", "D. Cảm ơn và nhắc đến sự gợi ý, hỗ trợ của bạn như một phần đóng góp thật sự"], "answer": "D", "explain": "Ghi nhận đúng đóng góp của người khác là hành động trung thực, công bằng và đáng trân trọng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Công bằng là một biểu hiện quan trọng của tôn trọng sự thật trong tập thể", "b) Để giữ hòa khí, đôi khi cần nói sai sự thật một chút cũng là điều dễ hiểu và nên làm", "c) Người chứng kiến sự việc có trách nhiệm trình bày đúng những gì mình biết khi được hỏi", "d) Lời nói thật có thể được diễn đạt bằng nhiều cách, miễn sao nội dung không sai lệch"], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: “sai một chút” vẫn là làm méo mó sự thật, dễ gây hậu quả và mất niềm tin. c) Đúng. d) Đúng: có thể uyển chuyển trong cách nói nhưng không được đổi nội dung sự thật.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Tâm thuật lại nguyên văn lời bạn nói khi được cô hỏi, không thêm cảm xúc cá nhân", "b) Bạn Thảo tô vẽ thêm thành tích của tổ mình khi báo cáo để tổ được khen", "c) Bạn Uy ghi rõ nguồn của số liệu mình dùng trong bài thuyết trình nhóm", "d) Bạn Việt đổ tội làm hỏng đồ dùng lớp cho em lớp dưới vì em ấy không có mặt để thanh minh"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: báo cáo sai lệch vì thành tích là không trung thực. c) Đúng. d) Sai: đổ tội cho người vắng mặt là gian dối, bất công.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu về mối quan hệ giữa “tôn trọng sự thật” và “sự công bằng” trong lớp học, lấy một ví dụ minh họa.", "points": 0, "explain": "Gợi ý: khi mọi đánh giá, khen chê đều dựa trên sự thật khách quan thì lớp học mới công bằng; ví dụ: chấm thi đua, bầu chọn, phân công công việc...; kết luận về vai trò của từng học sinh trong việc giữ sự công bằng đó."}, {"type": "essay", "level": "VDC", "q": "Kể lại một tình huống trong lớp học hoặc trên mạng xã hội mà một thông tin sai sự thật đã gây hiểu lầm, và theo em người liên quan nên xử lí thế nào. Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: nêu tình huống và hậu quả của thông tin sai; cách xử lí đúng: kiểm chứng, đính chính công khai, xin lỗi người bị ảnh hưởng; bài học về trách nhiệm khi tiếp nhận và chia sẻ thông tin."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Yếu tố nào quyết định một người có thật sự tôn trọng sự thật hay không?", "options": ["A. Hành vi nhất quán: nói và làm theo sự thật, dám nhận sai và sửa sai khi nhầm lẫn", "B. Người đó không bao giờ nói sai điều gì trong đời", "C. Người đó luôn thắng trong các cuộc tranh luận", "D. Người đó được nhiều người khen là thẳng tính"], "answer": "A", "explain": "Điều cốt lõi là sự nhất quán giữa lời nói và việc làm cùng thái độ dám nhận, sửa sai — không ai trên đời không từng nhầm lẫn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong quan hệ bạn bè, việc làm nào giúp gìn giữ sự tin tưởng lâu bền?", "options": ["A. Chỉ nói thật những chuyện không quan trọng", "B. Giữ đúng lời hứa, trung thực trong mọi việc lớn nhỏ với bạn", "C. Tha thứ cho bạn mọi lần nói dối vì tình bạn", "D. Tránh mọi xung đột bằng cách im lặng đồng ý với tất cả"], "answer": "B", "explain": "Niềm tin giữa bạn bè được xây từ sự trung thực nhất quán và giữ lời hứa trong mọi việc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nào sau đây là quan điểm sai về nói thật?", "options": ["A. Nói thật giúp con người sống thanh thản, không phải lo che giấu", "B. Nói thật cần vừa đúng sự thật vừa khéo léo, tế nhị", "C. Nói thật luôn đồng nghĩa với nói thẳng mọi điều nghĩ trong đầu, bất kể hoàn cảnh và cảm xúc của người nghe", "D. Thói quen nói thật cần được rèn luyện từ nhỏ"], "answer": "C", "explain": "Nói thật không có nghĩa là nói thiếu suy nghĩ, thiếu tế nhị; sự thật cần được truyền đạt với thái độ tôn trọng người nghe.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em vô tình đọc được đáp án phần trắc nghiệm của đề kiểm tra ngày mai do thầy để quên trên bàn khi em lên nộp vở. Hành động đúng đắn nhất của em là:", "options": ["A. Ghi nhớ đáp án để mai đạt điểm cao", "B. Chụp lại gửi cho nhóm bạn thân cùng học", "C. Chỉ học thuộc đáp án của những câu khó nhất", "D. Không xem thêm, trả lại vở rồi rời đi; tuyệt đối không chia sẻ điều đã thấy cho bất kì bạn nào"], "answer": "D", "explain": "Không lợi dụng sơ suất để gian lận và không lan truyền đáp án là biểu hiện trung thực, công bằng trong thi cử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em hẹn bạn 7 giờ tối cùng ôn bài trực tuyến nhưng đến giờ đó nhà em có khách, em không thể online. Em nên cư xử thế nào để vẫn giữ được sự tin cậy?", "options": ["A. Nhắn tin xin lỗi bạn ngay khi biết không thể online, giải thích ngắn gọn và hẹn lại buổi khác cụ thể", "B. Mặc kệ, hôm sau nói là mình bận nên quên", "C. Lên mạng muộn 1 tiếng và giả vờ như đúng hẹn", "D. Đổ lỗi cho mạng nhà mình chập chờn"], "answer": "A", "explain": "Thông báo trung thực, kịp thời và đưa ra cách khắc phục cụ thể là cách người tôn trọng sự thật và giữ chữ tín ứng xử khi lỡ hẹn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thầy giáo khen em trước lớp về một ý tưởng trong bài tập nhóm mà thực ra đó là ý tưởng của bạn khác, thầy hiểu nhầm. Em nên:", "options": ["A. Im lặng nhận lời khen cho vui", "B. Thưa với thầy (riêng hoặc trước lớp một cách tế nhị) rằng ý tưởng đó là của bạn, em chỉ trình bày lại", "C. Chờ đến cuối năm học mới nói", "D. Nhận lời khen rồi sau đó mua quà bù cho bạn"], "answer": "B", "explain": "Đính chính ngay đóng góp thật của bạn là hành động trung thực, công bằng, thể hiện em tôn trọng sự thật và tôn trọng bạn mình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người tôn trọng sự thật sẽ không lợi dụng sai sót của người khác để trục lợi cho mình", "b) Có thể giữ im lặng về sự thật trong mọi trường hợp để tránh làm mất lòng người khác", "c) Khi chưa chắc chắn về một thông tin, nói rõ “mình chưa chắc chắn” cũng là tôn trọng sự thật", "d) Trung thực với người khác nhưng có thể tự dối mình về năng lực của bản thân"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: im lặng đồng lõa khi sự thật liên quan đến sai trái là không đúng. c) Đúng: thừa nhận giới hạn hiểu biết là trung thực. d) Sai: tôn trọng sự thật bắt đầu từ trung thực với chính mình.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Ân ghi rõ trong bài tập nhóm phần nào là ý tưởng của mình, phần nào của bạn", "b) Bạn Bích nhận lời khen về chiếc thiệp do chị gái làm hộ như thể là công của mình", "c) Bạn Châu thừa nhận mình chưa đọc kĩ tài liệu khi bị nhóm chất vấn về nội dung chưa chắc chắn", "d) Bạn Duy nghe bạn kể chuyện “người ta bảo thế” và khẳng định ngay đó là sự thật để kể tiếp"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: nhận công của người khác là không trung thực. c) Đúng. d) Sai: khẳng định thông tin chưa kiểm chứng là thiếu tôn trọng sự thật.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu phân tích: vì sao người ta nói “trung thực là nền tảng của niềm tin” trong gia đình, nhà trường?", "points": 0, "explain": "Gợi ý: niềm tin chỉ hình thành khi lời nói khớp với việc làm qua nhiều lần; một lần gian dối có thể phá vỡ niềm tin gây dựng lâu dài; dẫn ví dụ trong gia đình hoặc lớp học; kết luận về việc em sẽ giữ gìn niềm tin ấy."}, {"type": "essay", "level": "VDC", "q": "Tưởng tượng em là thành viên ban biên tập trang thông tin của trường. Em hãy viết quy định ngắn (5–7 câu) về đăng tải thông tin trung thực cho các bạn cộng tác viên.", "points": 0, "explain": "Gợi ý: chỉ đăng tin đã kiểm chứng từ nguồn chính thống; ghi rõ nguồn tin; không thêm thắt cảm xúc, suy đoán vào sự kiện; khi đăng sai phải đính chính, xin lỗi công khai; tôn trọng người được nhắc đến trong tin."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tổng kết đúng nhất về đức tính tôn trọng sự thật là:", "options": ["A. Chỉ cần không nói dối là đủ", "B. Chỉ quan trọng với người làm nghề xét xử, báo chí", "C. Luôn nhận thức, nói năng và hành động theo đúng sự thật; trung thực, công bằng và dám bảo vệ điều đúng", "D. Là phẩm chất khó áp dụng trong đời sống hằng ngày"], "answer": "C", "explain": "Tôn trọng sự thật bao trùm từ nhận thức, lời nói đến hành động, và cần thiết với mọi người trong đời sống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc làm nào dưới đây thể hiện em đã biết “sống thật với chính mình”?", "options": ["A. Luôn bắt chước phong cách của bạn nổi tiếng nhất lớp", "B. Chỉ nhận mình giỏi ở những môn được điểm cao", "C. Giấu mọi sở thích thật của mình vì sợ bạn chê", "D. Nhận ra điểm mạnh, điểm yếu thật của bản thân và lập kế hoạch cải thiện điểm yếu"], "answer": "D", "explain": "Hiểu đúng và thừa nhận đúng về bản thân là bước đầu tiên của tôn trọng sự thật — trung thực với chính mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Học sinh có thể góp phần xây dựng môi trường mạng trung thực bằng cách nào?", "options": ["A. Kiểm chứng trước khi chia sẻ, đính chính khi lỡ chia sẻ sai và không tham gia lan truyền tin đồn", "B. Chia sẻ mọi thông tin gây sốc để tăng tương tác", "C. Chỉ tin thông tin từ người có nhiều người theo dõi", "D. Tránh tham gia mọi hoạt động trên mạng"], "answer": "A", "explain": "Mỗi người dùng mạng có trách nhiệm với thông tin mình phát tán — kiểm chứng và đính chính là góp phần làm mạng xã hội lành mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cuối năm, lớp bình xét danh hiệu thi đua. Em biết một bạn rất thân có một vi phạm chưa bị phát hiện, nếu nêu ra bạn sẽ mất danh hiệu. Cả lớp hỏi ý kiến em với tư cách lớp phó. Em xử lí thế nào?", "options": ["A. Giữ im lặng vì tình bạn lâu năm", "B. Khuyên bạn tự thú nhận với cô chủ nhiệm để được xem xét công bằng; nếu bình xét vẫn phải dựa trên hồ sơ trung thực của cả lớp", "C. Nêu khuyết điểm của bạn khác để đánh lạc hướng", "D. Đề nghị cả lớp bỏ qua hết mọi vi phạm của mọi người cho công bằng"], "answer": "B", "explain": "Ứng xử trung thực mà vẫn có tình: cho bạn cơ hội tự nhận, đồng thời giữ nguyên tắc bình xét dựa trên sự thật cho cả tập thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em được giao viết bài giới thiệu về truyền thống nhà trường cho trang web trường. Có một chi tiết về năm thành lập trường mà hai nguồn tài liệu ghi khác nhau. Em nên làm gì?", "options": ["A. Chọn con số nào nghe “đẹp” hơn để đăng", "B. Bỏ qua không nhắc đến năm thành lập", "C. Trao đổi với thầy cô phụ trách, tra cứu tài liệu chính thống của trường để xác minh trước khi đăng", "D. Đăng cả hai con số và để người đọc tự chọn"], "answer": "C", "explain": "Xác minh thông tin từ nguồn chính thống trước khi công bố là trách nhiệm của người làm thông tin, thể hiện tôn trọng sự thật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn của em nhờ em làm chứng sai rằng bạn “có đi học thêm đầy đủ” để bố mẹ bạn yên tâm. Bạn hứa sẽ chăm học từ tuần sau. Em nên:", "options": ["A. Đồng ý vì bạn đã hứa sẽ thay đổi", "B. Làm chứng sai lần này nhưng dặn bạn không được nhờ nữa", "C. Nói với bố mẹ bạn toàn bộ sự thật sau lưng bạn", "D. Từ chối làm chứng sai, khuyên bạn nói thật với bố mẹ và thực sự bắt đầu học chăm từ bây giờ"], "answer": "D", "explain": "Không tiếp tay cho lời nói dối dù với ý định “tốt”, đồng thời khuyên bạn tự đối diện sự thật là cách ứng xử đúng đắn nhất.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định tổng hợp sau:", "statements": ["a) Tôn trọng sự thật góp phần xây dựng gia đình, nhà trường và xã hội công bằng, văn minh", "b) Ở những việc nhỏ không ai để ý thì có thể linh hoạt không cần trung thực", "c) Học sinh lớp 6 hoàn toàn có thể rèn luyện đức tính trung thực qua việc học và sinh hoạt mỗi ngày", "d) Nói thật lúc nào cũng dễ dàng và không phải trả giá gì"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: trung thực phải nhất quán trong mọi việc, kể cả việc nhỏ không ai kiểm tra. c) Đúng. d) Sai: nói thật đôi khi khó khăn, cần lòng dũng cảm; vì vậy nó mới là phẩm chất đáng quý.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm tổng hợp sau:", "statements": ["a) Bạn Long tự nguyện khai nhận việc mình chưa hoàn thành bài tập dù cô chưa kiểm tra", "b) Bạn Mai “mượn” ý tưởng bài văn của anh trai và nộp như bài của mình", "c) Bạn Nga sửa lại con số đã ghi sai trong sổ trực nhật ngay khi phát hiện, kèm chữ kí xác nhận", "d) Bạn Phong dùng ảnh của người khác để dự thi ảnh đẹp của trường với tên mình"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: lấy bài của người khác là gian dối trong học tập. c) Đúng. d) Sai: dùng tác phẩm của người khác dưới tên mình là vi phạm trung thực nghiêm trọng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu bày tỏ suy nghĩ của em về câu nói: “Nói thật mất lòng, nhưng mất lòng trước được lòng sau” và liên hệ với bản thân em.", "points": 0, "explain": "Gợi ý: giải thích ý nghĩa câu nói; phân tích vì sao sự thật đôi khi làm người nghe không vui trước mắt nhưng lại tạo niềm tin lâu dài; liên hệ một tình huống của em; bài học em tự rút ra về cách nói thật khéo léo."}, {"type": "essay", "level": "VDC", "q": "Hãy viết bản cam kết ngắn (5–7 câu) của em về việc tôn trọng sự thật trong học tập và đời sống từ nay về sau.", "points": 0, "explain": "Gợi ý: mở đầu khẳng định quyết tâm; nêu 3 việc cụ thể (không gian lận, giữ lời hứa, chỉ chia sẻ thông tin đã kiểm chứng...); cách xử lí khi lỡ mắc sai lầm (nhận lỗi, sửa sai); kết bằng mong muốn được mọi người tin tưởng."}]}]}</script>
