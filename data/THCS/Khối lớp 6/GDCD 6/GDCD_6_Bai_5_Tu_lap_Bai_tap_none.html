 làm trước; phần nào bí quá mới hỏi bạn hoặc cô giáo hướng dẫn", "B. Nhờ bạn giỏi làm hộ phần của mình", "C. Bỏ luôn phần việc, chờ nhóm xử lí", "D. Xin đổi sang phần việc dễ nhất của nhóm"], "answer": "A", "explain": "Tự làm trước, chỉ nhờ hướng dẫn khi thật sự quá sức là biểu hiện đúng của tự lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn Tuấn (lớp 6) sáng nào cũng phải để mẹ gọi dậy 4–5 lần, quần áo đi học cũng mẹ chuẩn bị sẵn. Nhận xét đúng nhất về Tuấn là:", "options": ["A. Tuấn còn nhỏ nên như vậy là bình thường, không cần thay đổi", "B. Tuấn chưa có tính tự lập, cần rèn luyện dần từ việc nhỏ như tự đặt báo thức, tự chuẩn bị đồ", "C. Tuấn được mẹ yêu thương nhất nhà", "D. Tuấn chỉ cần học giỏi là đủ, việc khác không quan trọng"], "answer": "B", "explain": "Lớp 6 là lứa tuổi cần bắt đầu tự lập trong sinh hoạt; Tuấn cần rèn luyện dần từ việc nhỏ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tự lập:", "statements": ["a) Tự lập là tự làm lấy công việc của mình, không ỷ lại vào người khác", "b) Người tự lập là người không bao giờ nhận sự giúp đỡ của ai", "c) Học sinh lớp 6 đã có thể tự lập trong nhiều việc sinh hoạt và học tập", "d) Tự lập chỉ cần thiết khi em sống xa gia đình"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: tự lập không có nghĩa là từ chối mọi giúp đỡ; khi việc quá sức, nhờ hướng dẫn là cần thiết. c) Đúng. d) Sai: tự lập cần rèn luyện ngay từ khi còn sống cùng gia đình.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Hà tự giặt đôi tất và khăn của mình sau khi đi học về", "b) Bạn Nam để mẹ đút cơm vì “ăn như vậy nhanh hơn”", "c) Bạn Chi tự lập danh sách đồ cần mang cho chuyến dã ngoại của lớp", "d) Bạn Phong quên bút thì mượn bạn cả học kì thay vì tự sắm"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: tự làm việc sinh hoạt vừa sức. b) Sai: học sinh lớp 6 còn để đút cơm là ỷ lại. c) Đúng. d) Sai: dựa dẫm kéo dài thay vì tự chuẩn bị đồ dùng của mình.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Kể về một việc em đã tập tự làm được trong năm học này (khoảng 5–7 câu). Ban đầu em gặp khó khăn gì và em đã vượt qua như thế nào?", "points": 0, "explain": "Gợi ý: nêu việc em tự làm (soạn cặp, tự dậy sớm, tự làm việc nhà...); khó khăn ban đầu (chậm, quên, vụng về); cách em khắc phục; cảm giác tự tin khi làm chủ được công việc."}, {"type": "essay", "level": "VDC", "q": "Một bạn lớp em cho rằng: “Có bố mẹ lo hết thì cần gì tự lập, lớn lên tự khắc sẽ biết”. Em đồng ý không? Viết khoảng 5–7 câu nêu ý kiến của em.", "points": 0, "explain": "Gợi ý: không đồng ý; phân tích: kĩ năng tự lập phải rèn luyện dần, không tự nhiên mà có; người ỷ lại sẽ lúng túng khi không có người thân bên cạnh; khuyên bạn bắt đầu từ việc nhỏ ngay từ bây giờ."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Tính tự lập giúp học sinh có được điều gì?", "options": ["A. Luôn được điểm cao mà không cần học", "B. Quyền không phải làm bất cứ việc nhà nào", "C. Sự tự tin, chủ động và dần trưởng thành hơn", "D. Sự nổi tiếng trong trường lớp"], "answer": "C", "explain": "Tự lập giúp học sinh tự tin, chủ động, rèn kĩ năng sống và trưởng thành hơn mỗi ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc làm nào sau đây thể hiện học sinh chưa tự lập?", "options": ["A. Tự ôn bài trước khi kiểm tra", "B. Tự ghi chép thời khóa biểu dán ở góc học tập", "C. Tự chuẩn bị nguyên liệu cho giờ thực hành", "D. Chờ bạn làm bài tập xong để chép lại vì “khỏi phải suy nghĩ”"], "answer": "D", "explain": "Chép bài của bạn để trốn tránh suy nghĩ là biểu hiện thiếu tự lập trong học tập.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi gặp một công việc vượt quá khả năng của mình, người có tính tự lập nên làm gì?", "options": ["A. Cố gắng làm phần mình có thể, đồng thời nhờ người có kinh nghiệm hướng dẫn phần khó", "B. Bỏ luôn công việc đó", "C. Chờ người khác tự đến làm hộ toàn bộ", "D. Đổ lỗi cho công việc quá khó"], "answer": "A", "explain": "Tự lập không phải cố làm tất cả một mình: biết làm phần của mình và nhờ hướng dẫn đúng lúc mới là khôn ngoan.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nghỉ hè, mẹ đăng kí cho em học bơi nhưng lịch học trùng giờ em thường ngủ nướng. Em quyết định dậy sớm đi học bơi đều đặn và tự chuẩn bị đồ bơi từ tối hôm trước. Việc làm của em thể hiện:", "options": ["A. Em nghe lời mẹ một cách máy móc", "B. Em có tính tự lập và ý thức rèn luyện bản thân", "C. Em thích bơi hơn ngủ nướng", "D. Em muốn khoe với bạn bè là biết bơi"], "answer": "B", "explain": "Tự sắp xếp thời gian, chuẩn bị đồ dùng và duy trì việc đã định là biểu hiện của tự lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em được mẹ cho 50.000 đồng tiêu vặt trong tuần. Cách sử dụng nào thể hiện em biết tự quản lí, tự lập?", "options": ["A. Tiêu hết trong ngày đầu tiên cho đồ chơi", "B. Xin thêm tiền mỗi ngày vì tiêu không đủ", "C. Lên kế hoạch chi tiêu: để dành một phần, chỉ mua những thứ thật cần thiết", "D. Nhờ mẹ giữ hộ hết, cần gì lại xin mẹ mua"], "answer": "C", "explain": "Biết lên kế hoạch chi tiêu hợp lí là một biểu hiện của tính tự lập ở học sinh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lần đầu em tự đi xe buýt đến trường thay vì bố đưa đón, em hơi lo lắng nhưng đã hỏi trước tuyến xe, chuẩn bị thẻ và đến bến sớm. Nhận xét đúng về hành động của em là:", "options": ["A. Em liều lĩnh, không nên tự đi một mình", "B. Em muốn chứng tỏ mình đã lớn", "C. Em không muốn đi cùng bố nữa", "D. Em đang tập tự lập một cách có chuẩn bị, chủ động và an toàn"], "answer": "D", "explain": "Tự làm việc mới với sự chuẩn bị chu đáo là cách rèn tự lập đúng đắn của học sinh.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tự lập giúp học sinh giảm bớt gánh nặng cho bố mẹ, gia đình", "b) Người tự lập thường bị động, lúng túng khi không có người thân bên cạnh", "c) Rèn tính tự lập nên bắt đầu từ những việc nhỏ, vừa sức", "d) Tự lập là đức tính chỉ cần có ở người trưởng thành"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: người tự lập chủ động, tự tin xử lí công việc của mình. c) Đúng. d) Sai: học sinh cần rèn tự lập từ sớm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Bạn My được giao phụ trách trang trí bảng tin của lớp trong một tuần. Xét tính đúng, sai của các việc làm sau của My:", "statements": ["a) My tự lên ý tưởng, chuẩn bị vật liệu và hoàn thành đúng hạn", "b) Chỗ nào chưa đẹp, My hỏi ý kiến cô chủ nhiệm để sửa cho tốt hơn", "c) My để mặc đến ngày cuối mới nhờ các bạn làm giúp toàn bộ", "d) Sau khi hoàn thành, My tự dọn dẹp vật liệu thừa ngăn nắp"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: biết xin hướng dẫn khi cần. c) Sai: ỷ lại, đùn đẩy việc của mình. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy lập một danh sách khoảng 5–7 việc em quyết tâm tự làm trong tuần này để rèn tính tự lập, kèm cách em sẽ thực hiện từng việc.", "points": 0, "explain": "Gợi ý: chọn việc vừa sức (tự dậy đúng giờ, tự soạn cặp, tự dọn góc học tập, tự giặt đồ nhỏ, tự ôn bài trước...); nêu rõ thời điểm/cách làm cho từng việc; cam kết không chờ nhắc nhở."}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu về một người bạn (hoặc anh, chị) mà em ngưỡng mộ vì tính tự lập. Em muốn học tập ở họ điều gì?", "points": 0, "explain": "Gợi ý: giới thiệu người đó; kể những việc họ tự làm tốt (học tập, sinh hoạt, giúp gia đình...); nêu điều em học được và dự định áp dụng cho bản thân."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Hành vi nào sau đây là ỷ lại, dựa dẫm cần tránh?", "options": ["A. Việc gì của mình cũng chờ bố mẹ, thầy cô làm hộ mới chịu làm", "B. Tự làm bài tập rồi mới đối chiếu đáp án", "C. Nhờ bạn giảng lại một bài toán khó sau khi đã tự suy nghĩ", "D. Hỏi cô giáo cách trình bày một bài văn"], "answer": "A", "explain": "Chờ người khác làm hộ việc của mình là biểu hiện điển hình của ỷ lại, dựa dẫm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Rèn luyện tính tự lập, học sinh nên bắt đầu từ đâu?", "options": ["A. Từ những việc lớn, khó để nhanh trưởng thành", "B. Từ những việc nhỏ, vừa sức, làm đều đặn mỗi ngày", "C. Chờ đến khi lên cấp ba mới bắt đầu", "D. Chỉ rèn khi bố mẹ yêu cầu"], "answer": "B", "explain": "Bắt đầu từ việc nhỏ vừa sức và duy trì đều đặn là cách rèn tự lập hiệu quả, an toàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người có tính tự lập thường có thói quen nào trong học tập?", "options": ["A. Học tùy hứng, khi nào bố mẹ nhắc mới học", "B. Chỉ học khi sắp bị kiểm tra", "C. Học bài theo thời gian biểu tự đặt ra và tự kiểm tra việc thực hiện", "D. Học thuộc đáp án để đối phó với thầy cô"], "answer": "C", "explain": "Tự đặt kế hoạch học tập và tự giám sát thực hiện là thói quen của người tự lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sáng nay mẹ đi công tác sớm, không ai nấu bữa sáng. Em (đã được bố mẹ hướng dẫn dùng bếp an toàn) tự chuẩn bị một bữa sáng đơn giản cho mình và em gái rồi hai chị em đi học đúng giờ. Việc làm của em thể hiện:", "options": ["A. Em phải làm việc thay cho mẹ", "B. Em thích nấu ăn hơn đi học", "C. Em muốn được hàng xóm khen", "D. Em biết tự lập, tự chăm sóc bản thân và em nhỏ khi cần thiết"], "answer": "D", "explain": "Biết tự lo bữa ăn đơn giản, an toàn trong hoàn cảnh cụ thể là biểu hiện trưởng thành, tự lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài kiểm tra sắp tới, bạn cùng bàn rủ em “chia đôi đề cương, mỗi người học một nửa rồi chỉ nhau”. Em muốn tự học toàn bộ đề cương theo cách của mình. Em nên nói thế nào?", "options": ["A. Cảm ơn bạn nhưng em muốn tự học hết để nắm chắc kiến thức, sau đó hai bạn có thể cùng ôn lại với nhau", "B. Đồng ý ngay vì đỡ tốn công", "C. Chê bạn lười học", "D. Im lặng và tránh mặt bạn"], "answer": "A", "explain": "Từ chối khéo léo và giữ cách học chủ động, tự lập, đồng thời vẫn giữ được tình bạn là ứng xử phù hợp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em tham gia trại hè của trường 2 ngày, lần đầu ngủ xa nhà. Việc chuẩn bị nào thể hiện tính tự lập?", "options": ["A. Để mẹ xếp hết đồ vào ba lô, em không cần biết trong đó có gì", "B. Cùng mẹ lên danh sách đồ cần mang, tự xếp ba lô và tự quản lí đồ dùng trong suốt chuyến đi", "C. Mang theo thật nhiều tiền để mua mọi thứ cần thiết", "D. Nhờ bạn thân mang hộ đồ cho nhẹ"], "answer": "B", "explain": "Chủ động chuẩn bị và tự quản lí đồ dùng cá nhân là biểu hiện rõ của tự lập trong sinh hoạt tập thể.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tự lập:", "statements": ["a) Tự chịu trách nhiệm với lời hứa và việc làm của mình là biểu hiện của tự lập", "b) Học sinh tự lập thì không cần tuân theo thời gian biểu của gia đình", "c) Tự lập giúp em tự tin hơn khi bước vào môi trường mới", "d) Nếu bố mẹ giàu có, lo đủ mọi thứ thì em không cần học tính tự lập"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: tự lập đi đôi với kỉ luật, tôn trọng nề nếp chung. c) Đúng. d) Sai: điều kiện vật chất không thay thế được kĩ năng và bản lĩnh tự lập.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Sang tự ghi lại lịch kiểm tra của các môn vào sổ tay và chủ động ôn bài", "b) Bạn Thủy để quên đồ dùng học tập ở nhà rồi trách mẹ không nhắc", "c) Bạn Đạt tự sửa lại chiếc xe đạp bị tuột xích sau khi xem hướng dẫn và hỏi bố một số chỗ chưa rõ", "d) Bạn Vy chờ anh trai làm xong mô hình rồi gắn tên mình nộp cho cô"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: đổ lỗi, chưa tự chịu trách nhiệm với đồ dùng của mình. c) Đúng: tự làm trước, hỏi phần chưa rõ. d) Sai: lấy công sức của người khác là thiếu tự lập và thiếu trung thực.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu phân tích: vì sao học sinh lớp 6 cần bắt đầu rèn tính tự lập ngay từ bây giờ mà không nên chờ đến khi trưởng thành.", "points": 0, "explain": "Gợi ý: lớp 6 là giai đoạn chuyển cấp, nhiều việc mới phải tự lo; kĩ năng hình thành qua thói quen lâu dài; tự lập sớm giúp tự tin, giảm phụ thuộc; nêu ví dụ gần gũi trong học tập và sinh hoạt của em."}, {"type": "essay", "level": "VDC", "q": "Kể về một lần em gặp khó khăn khi phải tự làm một việc mà trước đây luôn có người làm hộ (khoảng 5–7 câu). Em đã xử lí thế nào và học được gì?", "points": 0, "explain": "Gợi ý: nêu hoàn cảnh (bố mẹ vắng nhà, ở trường, đi dã ngoại...); khó khăn cụ thể; cách em tự xoay xở hoặc nhờ hướng dẫn hợp lí; bài học về sự chuẩn bị và tính tự lập."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Việc nào dưới đây thuộc phạm vi học sinh lớp 6 có thể tự lập thực hiện?", "options": ["A. Tự sửa chữa điện trong nhà khi mất điện", "B. Tự lái xe máy đưa em đi học", "C. Tự chuẩn bị bữa sáng đơn giản, tự dọn dẹp góc học tập của mình", "D. Tự quyết định nghỉ học khi thấy mệt nhẹ"], "answer": "C", "explain": "Tự lập phải gắn với việc vừa sức, an toàn: chuẩn bị bữa sáng đơn giản, dọn góc học tập... là phù hợp với học sinh lớp 6.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một trong những ý nghĩa quan trọng của tính tự lập là:", "options": ["A. Giúp em không cần hợp tác với ai nữa", "B. Giúp em được bố mẹ cho nhiều tiền tiêu vặt hơn", "C. Giúp em tránh phải làm việc nhà", "D. Giúp em hình thành kĩ năng sống cần thiết cho tương lai"], "answer": "D", "explain": "Tự lập trang bị kĩ năng sống (tự chăm sóc, xử lí tình huống, quản lí bản thân) rất cần cho tương lai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi được giao một nhiệm vụ mới chưa từng làm, người có tính tự lập sẽ:", "options": ["A. Tìm hiểu yêu cầu, lập kế hoạch và bắt tay làm thử, vừa làm vừa rút kinh nghiệm", "B. Từ chối ngay vì sợ làm hỏng", "C. Chờ người khác làm mẫu hoàn toàn rồi bắt chước máy móc theo", "D. Để đến hạn cuối mới lo làm"], "answer": "A", "explain": "Chủ động tìm hiểu, lên kế hoạch và bắt tay thực hiện là cách người tự lập đối diện nhiệm vụ mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn em học rất phụ thuộc: bài nào khó một chút là chờ đến lớp chép bài bạn khác. Lâu dần bạn không hiểu bài, điểm ngày càng thấp. Nguyên nhân chính là:", "options": ["A. Bạn không thông minh bằng người khác", "B. Thói quen ỷ lại khiến bạn không tự suy nghĩ, không tích lũy được kiến thức", "C. Đề bài của thầy cô quá khó", "D. Bạn không có đủ sách tham khảo"], "answer": "B", "explain": "Ỷ lại trong học tập khiến kiến thức hổng dần — đó là hậu quả trực tiếp của việc thiếu tự lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cuối tuần này em muốn mời hai người bạn đến nhà học nhóm. Việc làm nào thể hiện em tự lập, có trách nhiệm?", "options": ["A. Để mẹ chuẩn bị hết mọi thứ, em chỉ việc chơi với bạn", "B. Rủ bạn đến bất ngờ mà không nói trước với bố mẹ", "C. Xin phép bố mẹ, tự dọn dẹp phòng học, chuẩn bị nước uống đơn giản và cùng bạn học nghiêm túc", "D. Học nhóm xong để nguyên bãi chiến trường cho mẹ dọn"], "answer": "C", "explain": "Chủ động chuẩn bị và giữ trách nhiệm với hoạt động của mình là biểu hiện của tự lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em được chọn làm tổ trưởng, phụ trách nhắc các bạn chuẩn bị bài. Tuần đầu em quên mất nhiệm vụ hai lần. Cách sửa sai thể hiện tính tự lập, trách nhiệm là:", "options": ["A. Đổ lỗi vì các bạn không tự giác", "B. Xin thôi không làm tổ trưởng nữa", "C. Chỉ nhắc các bạn khi cô giáo hỏi đến", "D. Ghi nhiệm vụ vào sổ tay, đặt lời nhắc và chủ động thực hiện nghiêm túc từ tuần sau"], "answer": "D", "explain": "Biết tự tìm giải pháp để hoàn thành trách nhiệm thay vì đổ lỗi là biểu hiện của người tự lập.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tự lập và hợp tác với người khác mâu thuẫn nhau, không thể có cả hai", "b) Trong làm việc nhóm, mỗi thành viên tự lập hoàn thành phần việc của mình sẽ giúp cả nhóm thành công", "c) Tự lập có nghĩa là không cần lắng nghe ý kiến đóng góp của người khác", "d) Người tự lập biết rõ việc nào mình tự làm được, việc nào cần nhờ hỗ trợ"], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: tự lập và hợp tác bổ sung cho nhau; người tự lập vẫn làm việc nhóm tốt. b) Đúng. c) Sai: tự lập vẫn cần biết lắng nghe, học hỏi. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau của bạn Khoa:", "statements": ["a) Khoa tự lên thời gian biểu ôn thi và thực hiện nghiêm túc", "b) Khoa nhờ mẹ đọc đề kiểm tra thử và bấm giờ giúp mình tự làm bài ở nhà", "c) Khoa để bố viết sẵn dàn ý bài văn rồi chép lại nộp cô", "d) Trước ngày thi, Khoa tự chuẩn bị đầy đủ dụng cụ học tập và đi ngủ sớm"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: mẹ chỉ hỗ trợ bấm giờ, bài vẫn do Khoa tự làm. c) Sai: nhờ làm hộ phần việc chính của mình là ỷ lại. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu về sự khác nhau giữa “tự lập” và “làm mọi thứ một mình, không cần ai”. Theo em, hiểu đúng về tự lập là như thế nào?", "points": 0, "explain": "Gợi ý: tự lập là chủ động làm việc của mình, biết nhờ giúp đỡ đúng lúc, biết hợp tác; còn khép kín, từ chối mọi hỗ trợ có thể gây quá tải, sai sót; nêu ví dụ cụ thể từ học tập hoặc sinh hoạt."}, {"type": "essay", "level": "VDC", "q": "Hãy tưởng tượng một ngày bố mẹ đi vắng từ sáng đến tối (em ở nhà cùng anh/chị hoặc người thân gần nhà). Viết kế hoạch tự chăm sóc bản thân của em trong ngày đó (khoảng 5–7 câu).", "points": 0, "explain": "Gợi ý: việc học (ôn bài đúng lịch), bữa ăn đơn giản an toàn, việc nhà vừa sức, thời gian giải trí hợp lí, lưu ý an toàn (khóa cửa, không mở cửa cho người lạ, số điện thoại liên lạc khi cần)."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu hiện tự lập nào sau đây phù hợp nhất với học sinh khi ở trường?", "options": ["A. Tự mang đầy đủ đồ dùng học tập, tự giữ gìn vở sạch chữ đẹp, tự hoàn thành bài được giao", "B. Tự ý đổi chỗ ngồi trong lớp theo ý thích", "C. Tự quyết định bỏ tiết khi không thích môn học", "D. Tự mang đồ ăn vào lớp ăn trong giờ học"], "answer": "A", "explain": "Tự chuẩn bị đồ dùng và hoàn thành nhiệm vụ học tập là biểu hiện tự lập đúng mực và phù hợp ở trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao nói tự lập giúp học sinh được mọi người tin tưởng?", "options": ["A. Vì người tự lập thường học giỏi nhất lớp", "B. Vì người tự lập làm việc có trách nhiệm, nói được làm được, không đùn đẩy", "C. Vì người tự lập không bao giờ mắc sai lầm", "D. Vì người tự lập luôn biết cách lấy lòng người khác"], "answer": "B", "explain": "Sự tin tưởng đến từ tinh thần trách nhiệm và khả năng tự hoàn thành công việc của người tự lập.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu thành ngữ nào phê phán thói ỷ lại, dựa dẫm?", "options": ["A. “Uống nước nhớ nguồn”", "B. “Kính trên nhường dưới”", "C. “Há miệng chờ sung”", "D. “Học ăn, học nói, học gói, học mở”"], "answer": "C", "explain": "“Há miệng chờ sung” châm biếm người lười biếng, chỉ chờ hưởng thụ mà không chịu tự lao động, cố gắng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em nhận thấy mình hay quên mang đồ dùng học tập. Biện pháp nào giúp em tự lập, khắc phục tình trạng này?", "options": ["A. Nhờ mẹ kiểm tra cặp mỗi sáng trước khi đi học", "B. Mượn đồ của bạn mỗi khi quên", "C. Xin cô cho phép không cần mang đủ đồ dùng", "D. Tự làm bảng kiểm đồ dùng dán ở cửa phòng, tự soạn cặp theo bảng đó mỗi tối"], "answer": "D", "explain": "Tự tạo công cụ nhắc việc và tự thực hiện là cách khắc phục chủ động, rèn tính tự lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Anh trai em (học lớp 9) tự học ở nhà rất tốt: tự lên lịch ôn tập, tự nấu ăn khi bố mẹ bận, cuối tuần còn dạy em học. Em rút ra bài học gì đúng nhất?", "options": ["A. Tự lập được rèn từ thói quen hằng ngày và ai cũng có thể học theo từng bước", "B. Anh học giỏi là do thông minh bẩm sinh", "C. Chỉ học sinh lớp lớn mới tự lập được", "D. Anh tự lập vì bố mẹ không quan tâm"], "answer": "A", "explain": "Tự lập là kết quả của rèn luyện thói quen, học sinh lớp 6 hoàn toàn có thể bắt đầu học theo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong giờ lao động của lớp, khu vực tổ em phụ trách quét sân. Hai bạn trong tổ bỏ đi chơi, em nên xử lí thế nào để vừa tự lập vừa có trách nhiệm?", "options": ["A. Bỏ luôn phần sân đó vì không phải lỗi của em", "B. Nhắc nhở hai bạn quay lại làm cùng; nếu các bạn vẫn bỏ đi, em báo cô giáo sau khi đã cố gắng hoàn thành phần việc chung trong khả năng", "C. Một mình quét hết cả khu vực và giận các bạn mãi", "D. Đi chơi cùng các bạn cho công bằng"], "answer": "B", "explain": "Vừa chủ động hoàn thành phần việc, vừa nhắc nhở bạn và báo cáo đúng lúc là ứng xử có trách nhiệm, không ỷ lại cũng không bao che.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về rèn luyện tính tự lập:", "statements": ["a) Kiên trì tự làm dù ban đầu chậm, vụng về sẽ giúp kĩ năng ngày càng thành thạo", "b) Nếu làm tự làm mà hỏng thì tốt nhất cứ để người khác làm cho nhanh", "c) Tự lập cần được rèn luyện liên tục trong học tập, sinh hoạt và lao động", "d) Chỉ cần tự lập trong học tập, sinh hoạt ở nhà thì không cần"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: ngại khó, bỏ cuộc sẽ không bao giờ rèn được kĩ năng. c) Đúng. d) Sai: tự lập cần thể hiện ở mọi mặt đời sống.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Bình tự gấp quần áo và sắp xếp tủ đồ của mình gọn gàng mỗi cuối tuần", "b) Bạn Châu chờ chị gái làm xong bài thủ công rồi xin làm chung sản phẩm để nộp", "c) Bạn Dũng tự tìm hiểu cách sơ cứu vết trầy xước nhẹ và xử lí đúng khi bị ngã trong sân trường", "d) Bạn Giang để bố mẹ quyết định thay mọi hoạt động ngoại khóa của mình mà không bày tỏ mong muốn"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: dựa vào sản phẩm của người khác là thiếu tự lập, thiếu trung thực. c) Đúng: biết tự xử lí tình huống đơn giản, an toàn. d) Sai: không bày tỏ và tham gia quyết định việc của mình là thụ động, dựa dẫm.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu tự đánh giá về tính tự lập của bản thân em hiện nay: em đã tự làm được những việc gì, còn ỷ lại ở điểm nào và em sẽ sửa ra sao.", "points": 0, "explain": "Gợi ý: tự nhận xét trung thực 2–3 điểm đã tự lập được; chỉ ra 1–2 điểm còn dựa dẫm; đề ra việc làm cụ thể và thời gian bắt đầu thực hiện để khắc phục."}, {"type": "essay", "level": "VDC", "q": "Viết một bức “thư cam kết” ngắn (5–7 câu) gửi bố mẹ, trong đó em hứa sẽ rèn tính tự lập trong học kì này bằng những việc làm cụ thể.", "points": 0, "explain": "Gợi ý: mở đầu bày tỏ hiểu được sự vất vả của bố mẹ; liệt kê việc cam kết tự làm (học tập, sinh hoạt, việc nhà); hứa tự chịu trách nhiệm, không chờ nhắc; lời cảm ơn và mong bố mẹ tin tưởng, hướng dẫn em khi cần."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Tự lập trong sinh hoạt hằng ngày của học sinh lớp 6 thể hiện qua việc nào?", "options": ["A. Nhờ người thân làm thay mọi việc cá nhân", "B. Chỉ tự làm việc khi bị người lớn phạt", "C. Tự sắp xếp góc học tập, chuẩn bị sách vở, đồng phục cho ngày hôm sau", "D. Tự làm việc nhà thật nặng nhọc như người lớn"], "answer": "C", "explain": "Tự chuẩn bị đồ dùng học tập, sắp xếp sinh hoạt cá nhân là biểu hiện tự lập vừa sức với học sinh lớp 6.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nói nào thể hiện rõ tinh thần tự lập?", "options": ["A. “Cứ để đấy, thế nào cũng có người làm cho”", "B. “Nhờ được ai làm hộ là khôn nhất”", "C. “Làm một mình dễ sai, tốt nhất chờ người khác”", "D. “Việc của mình, mình tự làm và chịu trách nhiệm”"], "answer": "D", "explain": "Tinh thần tự lập gắn với ý thức tự làm và tự chịu trách nhiệm với công việc của mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điều gì sẽ xảy ra nếu học sinh không rèn tính tự lập từ nhỏ?", "options": ["A. Lớn lên dễ vụng về, lúng túng trước việc của bản thân và khó thích nghi với môi trường mới", "B. Không sao vì lớn lên tự khắc sẽ biết hết", "C. Sẽ được mọi người phục vụ chu đáo hơn", "D. Sẽ tập trung học tốt hơn vì không tốn thời gian việc nhà"], "answer": "A", "explain": "Thiếu tự lập khiến con người khó thích nghi, dễ bối rối khi phải tự xử lí công việc của mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chiều nay mẹ đi làm về muộn và dặn em ở nhà tự hâm lại thức ăn, ăn cơm trước để kịp giờ học thêm. Em nên làm gì?", "options": ["A. Nhịn đói chờ mẹ về nấu cho", "B. Làm theo lời mẹ dặn một cách cẩn thận (chú ý an toàn khi dùng bếp), ăn xong tự dọn rửa gọn gàng", "C. Gọi điện giục mẹ về ngay", "D. Ra hàng quán ăn vặt qua bữa"], "answer": "B", "explain": "Thực hiện đúng việc được giao phó một cách tự giác, an toàn là biểu hiện tự lập trong gia đình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em chuyển sang trường mới, chưa quen đường đi và nề nếp lớp mới. Cách tự lập thích nghi nào là tốt nhất?", "options": ["A. Ngồi yên chờ bạn bè tự đến làm quen, giúp đỡ mọi thứ", "B. Xin bố mẹ đến trường cùng mình cả tuần đầu", "C. Chủ động tìm hiểu nội quy, sơ đồ trường, làm quen bạn mới và hỏi khi chưa rõ", "D. Nghỉ ở nhà đến khi nào quen mới đi học"], "answer": "C", "explain": "Chủ động tìm hiểu và hòa nhập là cách người tự lập thích nghi với môi trường mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn cùng phòng kí túc xá (học sinh nội trú) luôn để đồ đạc bừa bãi và nhờ bạn khác dọn hộ. Nếu là bạn cùng phòng, em nên góp ý thế nào?", "options": ["A. Dọn hộ bạn mãi để giữ hòa khí", "B. Tự ý vứt đồ của bạn vào thùng rác", "C. Báo quản lí đuổi bạn ra khỏi phòng ngay từ lỗi đầu", "D. Nhắc bạn tự sắp xếp đồ của mình, thống nhất quy định chung của phòng để ai cũng tự giác phần mình"], "answer": "D", "explain": "Nhắc nhở kèm quy định chung giúp bạn rèn tự lập mà vẫn giữ được tình bạn và nề nếp tập thể.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tự lập cần được rèn luyện từ những việc nhỏ nhất trong sinh hoạt hằng ngày", "b) Học sinh lớp 6 chưa cần tự lập vì mọi việc đã có người lớn lo hết", "c) Người tự lập thường chủ động học hỏi khi gặp việc mình chưa biết làm", "d) Tự lập đồng nghĩa với không cần nghe lời khuyên của người lớn"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: lứa tuổi nào cũng cần rèn tự lập theo mức phù hợp. c) Đúng. d) Sai: tự lập vẫn cần biết lắng nghe, học hỏi từ người lớn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Tâm tự giặt đồng phục của mình vào cuối tuần theo hướng dẫn của mẹ", "b) Bạn Thu chờ mẹ nhắc từng việc mới làm: học bài, tắm rửa, chuẩn bị cặp sách", "c) Bạn Uyên tự làm bài tập về nhà trước, phần khó mới nhờ anh chị gợi ý", "d) Bạn Việt để bố mẹ thay mình xin phép cô mỗi khi muốn nghỉ hoạt động ngoại khóa"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: phụ thuộc hoàn toàn vào sự sai khiến của người khác. c) Đúng. d) Sai: việc của mình nên tự trình bày với cô giáo cho phù hợp.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy xây dựng một “thời gian biểu tự lập buổi sáng” cho em (khoảng 5–7 câu): từ lúc thức dậy đến khi ra khỏi nhà đi học, em tự làm những việc gì, theo thứ tự nào?", "points": 0, "explain": "Gợi ý: giờ thức dậy; các việc vệ sinh cá nhân, ăn sáng, mặc đồng phục, kiểm tra cặp sách; nguyên tắc không để người lớn phải nhắc; lợi ích của thời gian biểu này với em và gia đình."}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu kể về một kĩ năng tự lập mới mà em học được trong năm nay (gấp chăn màn đúng cách, tự đi xe buýt, nấu món đơn giản...) và quá trình em học kĩ năng đó.", "points": 0, "explain": "Gợi ý: lí do em học kĩ năng; ai hướng dẫn và em luyện tập ra sao; khó khăn, vấp váp ban đầu; cảm giác của em khi tự làm thành thạo; dự định học thêm kĩ năng tự lập nào tiếp theo."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong học tập, biểu hiện nào là tự lập đúng nghĩa?", "options": ["A. Chủ động học bài, tự giải quyết bài tập trong khả năng, biết tìm sự hỗ trợ đúng lúc và đúng cách khi thật sự cần", "B. Tự làm bài mọi lúc, tuyệt đối không trao đổi với ai", "C. Chỉ tự học những môn mình thích nhất", "D. Tự quyết định bỏ học những buổi thấy không quan trọng"], "answer": "A", "explain": "Tự lập trong học tập là chủ động và có trách nhiệm, đồng thời biết sử dụng sự hỗ trợ hợp lí — không phải cô lập bản thân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Gia đình đóng vai trò thế nào trong việc rèn tính tự lập cho con?", "options": ["A. Làm thay con mọi việc để con chỉ việc học", "B. Giao việc vừa sức, hướng dẫn rồi để con tự làm, động viên và tin tưởng con", "C. Chỉ phê bình khi con làm chưa tốt", "D. Không cần quan tâm vì tính tự lập là bẩm sinh"], "answer": "B", "explain": "Người lớn hướng dẫn và trao cơ hội tự làm là điều kiện quan trọng để trẻ hình thành tính tự lập.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hậu quả thường thấy ở học sinh quá ỷ lại vào bạn bè trong làm bài tập là:", "options": ["A. Học lực ngày càng vững chắc", "B. Được bạn bè quý mến hơn", "C. Không nắm được kiến thức thật, lúng túng khi làm bài kiểm tra một mình", "D. Tiết kiệm được nhiều thời gian để chơi"], "answer": "C", "explain": "Chép bài, dựa dẫm khiến kiến thức không vào được chính mình, bộc lộ ngay khi phải tự làm bài kiểm tra.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mai là ngày kiểm tra, tối nay em thấy còn một dạng bài chưa vững. Điện thoại có sẵn đáp án trên mạng. Lựa chọn tự lập và trung thực nhất của em là:", "options": ["A. Chép sẵn đáp án vào giấy nháp mang vào phòng thi", "B. Nhắn tin nhờ bạn giỏi nhất lớp “gánh” mình trong giờ kiểm tra", "C. Bỏ qua dạng bài đó, cầu may không ra trong đề", "D. Tự ngồi làm lại các bài tương tự, chỗ chưa hiểu thì đánh dấu để sáng mai hỏi thầy cô sớm"], "answer": "D", "explain": "Chủ động ôn luyện và tìm thầy cô hỗ trợ trước giờ thi là cách ứng xử tự lập, trung thực và hiệu quả nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bố mẹ đi công tác 2 ngày, em ở nhà với bà. Bà đã lớn tuổi, mắt kém. Em nên sắp xếp sinh hoạt thế nào thể hiện mình là cháu tự lập, biết việc?", "options": ["A. Chủ động làm các việc nhà vừa sức (vo gạo, nhặt rau, dọn nhà), nhắc bà nghỉ ngơi và tự giác học bài đúng giờ", "B. Để bà lo hết cơm nước như thường lệ", "C. Mời bạn về nhà chơi ồn ào cả ngày cho vui", "D. Xin sang nhà bạn ở luôn 2 ngày cho tiện"], "answer": "A", "explain": "Chăm sóc lại người lớn tuổi bằng việc nhà vừa sức và giữ nề nếp học tập là biểu hiện tự lập trưởng thành của học sinh lớp 6.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn em rất tự lập: tự đi học bằng xe buýt, tự quản tiền ăn sáng mẹ cho cả tuần mà không tiêu hoang. Em học được điều gì nhất từ bạn?", "options": ["A. Bạn ấy tiết kiệm quá mức không đáng học theo", "B. Tinh thần tự chủ và biết quản lí chi tiêu, sinh hoạt của bản thân một cách có kế hoạch", "C. Bạn ấy không thân thiết với bố mẹ nên mới phải tự làm hết", "D. Tự đi xe buýt là việc quá sức với học sinh lớp 6"], "answer": "B", "explain": "Quản lí tiền bạc và sinh hoạt cá nhân theo kế hoạch là kĩ năng tự lập quan trọng mà em nên học hỏi.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Rèn tính tự lập là quá trình lâu dài, cần sự kiên trì của bản thân và sự tin tưởng của gia đình", "b) Trẻ được làm thay mọi việc sẽ tự lập hơn vì được quan sát người lớn làm mẫu nhiều lần", "c) Khi được giao việc nhà phù hợp, trẻ vừa rèn tự lập vừa gắn bó hơn với gia đình", "d) Tự lập chỉ cần thiết khi sống xa gia đình, còn ở nhà thì không cần"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: quan sát không thay thế được tự thực hành. c) Đúng. d) Sai: tự lập cần trong mọi hoàn cảnh sống.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau đây:", "statements": ["a) Bạn Xuân tự lên kế hoạch chi tiêu tiền mừng tuổi: một phần mua sách, một phần tiết kiệm", "b) Bạn Yến đòi mẹ may sẵn đồng phục dự phòng mỗi ngày vì không muốn tự giặt, là lượt đồ của mình", "c) Bạn Zân tự đạp xe đi học sau khi đã thuộc đường và được bố mẹ đồng ý", "d) Bạn An để chị gái soạn cặp, chọn quần áo cho mình mỗi tối vì “chị chọn đẹp hơn”"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: ngại làm việc cá nhân, ỷ lại người khác. c) Đúng. d) Sai: việc chọn đồ đi học nằm trong khả năng của học sinh lớp 6.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu đề xuất với bố mẹ một việc nhà mà em muốn nhận trách nhiệm hoàn toàn từ nay (ví dụ: tưới cây, cho vật nuôi ăn, dọn phòng khách...) và cam kết cách em thực hiện.", "points": 0, "explain": "Gợi ý: nêu việc em muốn nhận và lí do; cách em sẽ làm đều đặn, không cần nhắc; cách em tự kiểm tra, báo lại kết quả; mong muốn bố mẹ tin tưởng và chỉ góp ý khi cần thiết."}, {"type": "essay", "level": "VDC", "q": "Phân tích ngắn (5–7 câu): vì sao người ta nói “tự lập sớm, trưởng thành sớm”, lấy ví dụ từ những bạn học sinh mà em biết.", "points": 0, "explain": "Gợi ý: giải thích mối liên hệ giữa tự lập và khả năng xử lí tình huống, sự tự tin; ví dụ cụ thể về một bạn tự lập mà em biết; bài học, dự định rèn luyện của bản thân em."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Một học sinh được coi là có nếp sống tự lập khi nào?", "options": ["A. Khi em tách hoàn toàn khỏi gia đình và bạn bè", "B. Khi em không bao giờ mắc sai lầm trong sinh hoạt", "C. Khi em biết tự quản lí thời gian, công việc và cảm xúc của mình theo hướng tích cực mà không cần giám sát thường xuyên", "D. Khi em được bố mẹ khen là ngoan ngoãn"], "answer": "C", "explain": "Nếp sống tự lập thể hiện ở khả năng tự quản lí bản thân bền vững, không phụ thuộc vào sự giám sát.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc học sinh tự giải quyết mâu thuẫn nhỏ với bạn bè bằng lời nói hòa nhã trước khi nhờ thầy cô can thiệp thể hiện:", "options": ["A. Sự yếu đuối, sợ thầy cô", "B. Thiếu tôn trọng thầy cô", "C. Không liên quan gì đến tính tự lập", "D. Tính tự lập trong giao tiếp và ý thức tự chịu trách nhiệm với các mối quan hệ của mình"], "answer": "D", "explain": "Chủ động xử lí việc trong tầm của mình một cách văn minh là một mặt của tự lập trong đời sống tập thể.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để rèn tự lập, học sinh nên tránh thói quen nào nhất?", "options": ["A. Việc gì cũng chờ người khác nhắc, làm giúp hoặc quyết định thay", "B. Hỏi người lớn khi gặp việc nguy hiểm, khó xử", "C. Lập danh sách việc cần làm mỗi ngày", "D. Tự thưởng cho mình sau khi hoàn thành mục tiêu"], "answer": "A", "explain": "Thói chờ đợi, phó mặc cho người khác là rào cản lớn nhất của tính tự lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sáng nay em ngủ quên, dậy muộn 20 phút. Trong tình huống này, ứng xử tự lập nhất của em là:", "options": ["A. Đổ lỗi cho đồng hồ báo thức và cáu gắt với mẹ", "B. Nhanh chóng làm vệ sinh, ăn sáng gọn nhẹ, đi học ngay và tự rút kinh nghiệm đặt báo thức dự phòng từ tối nay", "C. Ở nhà luôn và nhờ mẹ xin phép nghỉ học", "D. Vừa đi vừa khóc vì sợ bị phạt"], "answer": "B", "explain": "Xử lí nhanh gọn sự cố do mình gây ra và rút kinh nghiệm phòng ngừa là thái độ tự lập, có trách nhiệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhóm học tập giao cho mỗi bạn tự chuẩn bị một phần bài thuyết trình. Đến hạn, một bạn chưa làm gì và đề nghị cả nhóm “bao” phần của bạn ấy. Theo em, nhóm nên xử lí thế nào?", "options": ["A. Làm thay cho bạn để kịp tiến độ, không cần nhắc lại", "B. Loại bạn khỏi nhóm ngay lập tức", "C. Nhắc bạn tự hoàn thành phần của mình trong thời gian bổ sung ngắn, nhóm hỗ trợ góp ý chứ không làm thay toàn bộ", "D. Chia phần của bạn cho các bạn còn lại và trừ điểm bạn đó trong lòng"], "answer": "C", "explain": "Yêu cầu bạn tự chịu trách nhiệm với hỗ trợ hợp lí của nhóm giúp bạn rèn tự lập và giữ công bằng cho tập thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em nhận thấy mình thường xuyên quên mang theo đồ dùng học tập. Giải pháp tự lập nào hiệu quả và bền vững nhất?", "options": ["A. Nhờ mẹ kiểm tra cặp mỗi sáng trước khi đi", "B. Đến lớp mượn đồ của bạn khi cần", "C. Ghi nhớ trong đầu mà không cần lịch soạn cặp", "D. Tự lập danh sách đồ dùng theo thời khóa biểu, soạn cặp vào tối hôm trước và tự kiểm tra theo danh sách"], "answer": "D", "explain": "Tự xây dựng quy trình soạn cặp cho chính mình giúp em chủ động và hết phụ thuộc vào sự kiểm tra của người lớn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Học sinh tự lập thường biết tự đánh giá việc làm của mình và rút kinh nghiệm sau mỗi sự việc", "b) Sai lầm khi tự làm việc là bằng chứng cho thấy học sinh chưa nên tự lập", "c) Biết quản lí cảm xúc (không cáu gắt, không bỏ cuộc khi gặp khó) cũng là một biểu hiện của tự lập", "d) Tự lập trong suy nghĩ nghĩa là không cần tham khảo ý kiến của bất kì ai"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: sai lầm là phần tất yếu của quá trình học tự lập. c) Đúng. d) Sai: tự lập trong suy nghĩ là biết chọn lọc, cân nhắc ý kiến chứ không phải khước từ tất cả.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Giàu tự đến gặp cô chủ nhiệm xin lỗi và trình bày lí do đi học muộn thay vì nhờ bạn nói hộ", "b) Bạn Hà mỗi lần cãi nhau với bạn là về nhà khóc và chờ mẹ gọi điện “xử lí” hộ", "c) Bạn Khánh tự tìm thông tin về câu lạc bộ của trường trên bảng thông báo rồi tự đăng kí tham gia", "d) Bạn Lâm để bố quyết định thay mình mọi hoạt động ngoại khóa vì “bố hiểu mình hơn”"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: phụ thuộc người lớn giải quyết thay mọi mâu thuẫn của bản thân. c) Đúng. d) Sai: hoạt động của mình nên có tiếng nói quyết định của chính mình (cùng bàn với bố mẹ).", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết nhật kí ngắn (5–7 câu) về một ngày em “tự vận hành” hoàn toàn: từ sáng đến tối em đã tự làm những gì và cảm thấy thế nào khi không có ai nhắc nhở?", "points": 0, "explain": "Gợi ý: liệt kê các việc tự làm theo trình tự thời gian; một tình huống khó em tự xử lí được; cảm xúc tự hào/mệt mỏi trung thực của em; điều em muốn duy trì từ ngày hôm đó."}, {"type": "essay", "level": "VDC", "q": "Đề xuất 3 quy tắc cho tổ của em để mọi thành viên đều rèn được tính tự lập trong hoạt động tập thể, trình bày trong khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: quy tắc phân công–tự chịu trách nhiệm; quy tắc không làm thay mà chỉ hỗ trợ, góp ý; quy tắc tự đánh giá cuối hoạt động và ghi nhận thành viên tự lập tốt."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Bước đi đúng đắn khi em muốn tự làm một việc mới nhưng chưa có kinh nghiệm là:", "options": ["A. Quan sát, hỏi người có kinh nghiệm, tập làm từng bước nhỏ dưới sự hướng dẫn rồi dần tự làm một mình", "B. Tự làm ngay bất chấp an toàn để chứng tỏ bản thân", "C. Không bao giờ thử vì sợ sai", "D. Chờ đến khi lớn tự khắc sẽ biết"], "answer": "A", "explain": "Học theo từng bước có hướng dẫn là con đường an toàn và hiệu quả để mở rộng khả năng tự lập.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tính tự lập của học sinh còn được đánh giá qua việc nào trong đời sống số?", "options": ["A. Số lượng bạn bè và lượt theo dõi trên mạng xã hội", "B. Biết tự quản lí thời gian sử dụng thiết bị, tự bảo vệ thông tin cá nhân và ứng xử có trách nhiệm khi trực tuyến", "C. Nhờ bố mẹ dùng điện thoại thay mọi lúc", "D. Chơi trò chơi điện tử giỏi hơn bạn bè"], "answer": "B", "explain": "Tự chủ trong môi trường số là một yêu cầu tự lập mới, rất cần thiết với học sinh ngày nay.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nào thể hiện sự nhầm lẫn về tự lập cần sửa?", "options": ["A. “Mình tự làm được việc này, khó hơn mình sẽ hỏi thêm”", "B. “Mình sẽ tự chuẩn bị đồ cho chuyến dã ngoại theo danh sách”", "C. “Tự lập nghĩa là tuyệt đối không nhận sự giúp đỡ của bất kì ai”", "D. “Lần này mình làm sai, lần sau sẽ rút kinh nghiệm”"], "answer": "C", "explain": "Khước từ mọi sự giúp đỡ không phải là tự lập mà là cực đoan; người tự lập biết nhờ giúp đúng lúc, đúng cách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lớp tổ chức đi dã ngoại, mỗi học sinh tự chuẩn bị đồ cá nhân theo danh sách cô dặn. Bạn cùng lớp nhờ mẹ chuẩn bị hết, đến nơi lại quên mũ vì mẹ không biết cô dặn thêm. Tình huống này cho thấy điều gì?", "options": ["A. Mẹ bạn chuẩn bị chưa chu đáo bằng cô giáo", "B. Đi dã ngoại không cần mũ cũng không sao", "C. Bạn nên trách mẹ vì đã quên đồ cho mình", "D. Việc ỷ lại người khác chuẩn bị thay khiến bạn không nắm được yêu cầu và bị động khi thiếu đồ"], "answer": "D", "explain": "Tự chuẩn bị theo dặn dò giúp em nắm rõ và chịu trách nhiệm với đồ dùng của mình; ỷ lại dễ dẫn đến bị động như trong tình huống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em tự đặt mục tiêu tiết kiệm tiền tiêu vặt để mua cuốn sách yêu thích. Sau 2 tuần, em thấy một món đồ chơi rất “hot”. Em nên quyết định thế nào để giữ đúng tinh thần tự lập, tự chủ?", "options": ["A. Cân nhắc: giữ mục tiêu tiết kiệm đã đặt ra, chỉ xem xét lại nếu thật sự thấy cuốn sách không còn cần thiết nữa", "B. Vứt bỏ mục tiêu, mua đồ chơi ngay cho thỏa thích", "C. Xin bố mẹ mua cả hai món cho nhanh", "D. Vay tiền bạn để mua đồ chơi, tháng sau trả"], "answer": "A", "explain": "Tự chủ trước cám dỗ nhất thời, tôn trọng mục tiêu mình tự đặt là biểu hiện rõ của tính tự lập trong chi tiêu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em học trực tuyến một mình ở nhà vào buổi chiều. Bài giảng có đoạn khó hiểu, không có thầy cô bên cạnh. Cách tự học tự lập nhất của em là:", "options": ["A. Bỏ qua đoạn khó, chuyển sang xem video giải trí", "B. Tua lại đoạn khó, ghi chép câu hỏi ra giấy, tra cứu tài liệu được phép và ghi vào danh sách để hỏi thầy cô buổi học sau", "C. Chụp màn hình gửi cho bạn nhờ bạn học thay", "D. Tắt bài giảng và chờ bố mẹ về giảng lại"], "answer": "B", "explain": "Chủ động tìm cách hiểu bài và biết ghi lại điều chưa rõ để hỏi sau là kĩ năng tự học tự lập rất quan trọng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tự lập gắn liền với khả năng tự ra quyết định phù hợp và chịu trách nhiệm về quyết định đó", "b) Nhờ sự giúp đỡ khi gặp việc vượt quá khả năng là dấu hiệu của sự yếu kém, thiếu tự lập", "c) Học sinh càng tự lập càng dễ được gia đình và thầy cô tin tưởng giao việc quan trọng", "d) Tự lập chỉ thể hiện ở việc tự làm việc nhà và học tập, không liên quan đến quản lí cảm xúc"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: nhờ giúp đúng lúc là biểu hiện khôn ngoan của người tự lập. c) Đúng. d) Sai: quản lí cảm xúc là một phần quan trọng của tự lập.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau đây:", "statements": ["a) Bạn Mơ tự đặt giới hạn 30 phút chơi game sau giờ học và tuân thủ bằng đồng hồ hẹn giờ", "b) Bạn Nở để bố mẹ giữ toàn bộ tiền lì xì mà không hề biết số tiền được dùng vào việc gì", "c) Bạn Ổn tự liên hệ với cô giáo để hỏi lịch tập văn nghệ khi nghe thông báo chưa rõ", "d) Bạn Phê không bao giờ chia sẻ khó khăn của mình với ai vì sợ bị coi là không tự lập"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: quản lí tiền của mình cần có sự tham gia, hiểu biết của bản thân (dù người lớn giữ hộ có lí do). c) Đúng. d) Sai: chia sẻ khó khăn để được hỗ trợ là việc làm lành mạnh, không trái với tự lập.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu về một quyết định tự lập mà em tự hào nhất đến nay (chọn câu lạc bộ, tự đi học, tự tiết kiệm mua đồ...): em đã quyết định thế nào và chịu trách nhiệm ra sao?", "points": 0, "explain": "Gợi ý: hoàn cảnh phải tự quyết định; cân nhắc của em trước khi quyết; kết quả và trách nhiệm em đã gánh (cả khi kết quả chưa như ý); điều em học được về bản thân mình."}, {"type": "essay", "level": "VDC", "q": "Em hãy đóng vai người anh/chị lớn, viết 5–7 câu khuyên một em lớp 4 đang rất ỷ lại vào bố mẹ (bắt mẹ soạn cặp, đút ăn, nhắc từng việc) hãy bắt đầu tập tự lập từ những việc nhỏ.", "points": 0, "explain": "Gợi ý: giọng văn thân thiện, động viên; gợi ý 2–3 việc nhỏ em ấy có thể tự làm ngay; lợi ích của tự lập như được tin tưởng, tự hào về mình; lời chúc, khích lệ cuối thư."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Kết luận đúng nhất rút ra từ bài học Tự lập là:", "options": ["A. Tự lập là việc của người lớn, học sinh chỉ cần học giỏi", "B. Tự lập nghĩa là không cần gia đình, thầy cô nữa", "C. Tự lập là phẩm chất cần rèn luyện từ sớm qua học tập và sinh hoạt, giúp em chủ động, tự tin và được mọi người tin yêu", "D. Ai sinh ra cũng tự lập sẵn như nhau"], "answer": "C", "explain": "Tự lập được hình thành nhờ rèn luyện bền bỉ từ nhỏ và là hành trang quan trọng cho mọi học sinh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi nào là “giả tự lập” mà học sinh cần tránh?", "options": ["A. Tự làm việc nhà và báo lại kết quả cho bố mẹ", "B. Xin hướng dẫn trước khi làm việc mới", "C. Thừa nhận việc mình chưa làm được để học thêm", "D. Tuyên bố “con tự lo được hết” nhưng thực tế vẫn để người khác làm thay, gánh hậu quả thay"], "answer": "D", "explain": "Nói tự lập nhưng hành động ỷ lại là giả tự lập — đối lập với tinh thần trung thực, có trách nhiệm của người tự lập thật sự.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhóm kĩ năng nào thể hiện đầy đủ nhất một học sinh lớp 6 có tính tự lập?", "options": ["A. Tự chăm sóc bản thân, tự học, tự quản lí thời gian, tiền bạc và biết xử lí tình huống đơn giản trong cuộc sống", "B. Chỉ duy nhất kĩ năng học tập tốt", "C. Kĩ năng sử dụng điện thoại thành thạo", "D. Kĩ năng thuyết phục người khác làm việc thay mình"], "answer": "A", "explain": "Tự lập ở học sinh thể hiện toàn diện trong sinh hoạt, học tập, quản lí bản thân và xử lí tình huống đời thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ngày đầu tiên em tự đi xe buýt đến trường, em xuống nhầm một bến. Tình huống đã xảy ra rồi, cách xử lí tự lập và an toàn nhất của em là:", "options": ["A. Hoảng loạn khóc và đứng đợi người nhà đến đón tại chỗ", "B. Bình tĩnh xem lại bản đồ tuyến xe/ứng dụng, xuống xe ở nơi đông người, gọi điện báo bố mẹ và bắt chuyến xe đúng chiều về lại bến cần xuống", "C. Đi bộ men theo đường lớn về trường dù rất xa", "D. Nhờ một người lạ trên đường chở về giúp"], "answer": "B", "explain": "Giữ bình tĩnh, dùng công cụ hỗ trợ và liên lạc với gia đình là cách xử lí tự lập, an toàn khi gặp sự cố trên đường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cuối học kì, cô giáo nhận xét: “Em là học sinh rất tự lập”. Nhận xét đó nhiều khả năng xuất phát từ điều gì trong quá trình học của em?", "options": ["A. Em luôn đạt điểm cao nhất lớp ở mọi bài kiểm tra", "B. Em ít nói và hiếm khi tham gia hoạt động chung", "C. Em luôn tự hoàn thành nhiệm vụ đúng hạn, chủ động hỏi khi chưa hiểu và không để ai phải nhắc việc của mình", "D. Em có bố mẹ thường xuyên liên lạc với cô giáo"], "answer": "C", "explain": "Sự chủ động, đúng hạn và không để người khác phải lo thay là cơ sở thực tế để thầy cô đánh giá một học sinh có tính tự lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em muốn tham gia đội tuyển của trường nhưng lịch tập trùng giờ đưa đón của bố. Là học sinh tự lập, em sẽ xử lí thế nào?", "options": ["A. Bỏ đội tuyển vì không muốn phiền bố", "B. Trốn tập những buổi bố không đón được", "C. Đòi bố nghỉ việc để đưa đón mình", "D. Chủ động tìm phương án di chuyển phù hợp (đi cùng bạn gần nhà, xe buýt tuyến qua trường...) rồi mới trình bày với bố mẹ để cùng quyết định"], "answer": "D", "explain": "Tự tìm giải pháp khả thi rồi bàn bạc với gia đình là cách người tự lập giải quyết vướng mắc thay vì bỏ cuộc hay đòi hỏi.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định tổng hợp sau:", "statements": ["a) Tự lập là tiền đề để học sinh trở thành công dân chủ động, có trách nhiệm trong tương lai", "b) Học sinh tự lập thì không cần sự quan tâm, động viên của gia đình nữa", "c) Môi trường tập thể (lớp học, đội, nhóm) là nơi tốt để rèn luyện và thể hiện tính tự lập", "d) Chỉ những bạn có hoàn cảnh khó khăn mới cần rèn tính tự lập"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: tự lập không làm giảm nhu cầu yêu thương, động viên của gia đình. c) Đúng. d) Sai: tự lập cần cho mọi học sinh, bất kể hoàn cảnh.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm tổng hợp sau:", "statements": ["a) Bạn Sơn tự đến thư viện tra cứu tài liệu cho bài tập lớn thay vì chờ nhóm phát tài liệu sẵn", "b) Bạn Tân đăng kí học thêm theo ý mình nhưng buổi nào cũng chờ bố nhắc mới đi", "c) Bạn Uông tự giác tắt thiết bị điện tử đúng giờ quy định để ôn bài mà không cần ai canh", "d) Bạn Vĩ khoe mình tự lập nhưng điểm danh, trực nhật luôn phải để bạn tổ trưởng làm thay"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: đăng kí tự nguyện nhưng thực hiện ỷ lại là chưa tự lập thật sự. c) Đúng. d) Sai: lời nói và việc làm mâu thuẫn — giả tự lập.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu tổng kết “hành trình tự lập lớp 6” của em: em đã tự lập hơn ở những mặt nào so với hồi lớp 5, và mục tiêu tự lập của em trong năm học lớp 7 là gì?", "points": 0, "explain": "Gợi ý: so sánh cụ thể 2–3 mặt (sinh hoạt, học tập, đi lại, chi tiêu...); khó khăn lớn nhất đã vượt qua; mục tiêu lớp 7 cao hơn một bậc và bước đầu tiên em sẽ làm."}, {"type": "essay", "level": "VDC", "q": "Hãy tưởng tượng em viết thư cho chính mình vào ngày đầu tiên bước vào lớp 6 (khi em còn rất bỡ ngỡ, ỷ lại). Em sẽ nhắn nhủ điều gì về việc tập tự lập? Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: đồng cảm với sự bỡ ngỡ ban đầu; nhắn nhủ bắt đầu từ việc nhỏ mỗi ngày; khẳng định sai lầm khi tự làm là bình thường và đáng quý; kết bằng lời động viên đầy tin tưởng gửi cho chính mình."}]}]}</script>
