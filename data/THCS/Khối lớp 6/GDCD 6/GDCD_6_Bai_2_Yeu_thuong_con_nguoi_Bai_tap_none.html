A. An ủi, động viên bạn và rủ bạn cùng ôn lại bài để lần sau làm tốt hơn", "B. Mặc kệ, đó là việc của bạn", "C. Chê bạn học kém trước mặt các bạn khác", "D. Kể cho cả lớp nghe để mọi người cùng cười"], "answer": "A", "explain": "Động viên và giúp bạn vượt qua khó khăn thể hiện sự quan tâm, yêu thương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lớp có bạn mới chuyển đến, còn rụt rè, chưa quen ai. Em sẽ làm gì để thể hiện sự thân thiện, yêu thương bạn bè?", "options": ["A. Chỉ chơi với nhóm bạn cũ của mình", "B. Chủ động làm quen, giới thiệu bạn với lớp và giúp bạn hòa nhập", "C. Để bạn tự thích nghi theo thời gian", "D. Trêu chọc bạn vì bạn là người mới"], "answer": "B", "explain": "Chủ động giúp bạn mới hòa nhập là biểu hiện của tình yêu thương, đoàn kết với bạn bè.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về yêu thương con người:", "statements": ["a) Yêu thương con người chỉ cần thể hiện với người thân trong gia đình", "b) Giúp đỡ người khuyết tật là biểu hiện của lòng yêu thương con người", "c) Người biết yêu thương người khác sẽ được mọi người yêu quý, tôn trọng", "d) Thờ ơ trước khó khăn của người khác là biểu hiện đáng phê phán"], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: yêu thương con người thể hiện với mọi người xung quanh, không chỉ người thân. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Trường phát động quyên góp ủng hộ học sinh vùng lũ. Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Mai dành tiền ăn sáng của mình để ủng hộ", "b) Bạn Bình nói: “Việc của người ta, không liên quan đến mình”", "c) Bạn Chi vận động các bạn trong tổ cùng tham gia quyên góp", "d) Bạn Dũng mang đến những cuốn sách cũ còn tốt để tặng bạn vùng lũ"], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: sẻ chia trong khả năng của mình. b) Sai: thờ ơ, thiếu yêu thương. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Kể về một lần em đã giúp đỡ ai đó khi họ gặp khó khăn (khoảng 5–7 câu). Em cảm thấy thế nào sau việc làm đó?", "points": 0, "explain": "Gợi ý: nêu hoàn cảnh của người được giúp; em đã giúp bằng việc làm cụ thể nào; kết quả ra sao; cảm xúc của em (vui, hạnh phúc...) và bài học về lòng yêu thương."}, {"type": "essay", "level": "VDC", "q": "Một bạn trong lớp bị các bạn khác trêu chọc vì nhà nghèo. Nếu chứng kiến, em sẽ làm gì? Viết đoạn văn khoảng 5–7 câu trình bày cách ứng xử của em.", "points": 0, "explain": "Gợi ý: bênh vực, ngăn các bạn trêu chọc; an ủi bạn bị trêu; giải thích cho các bạn hiểu trêu chọc người khó khăn là sai; đề xuất cùng giúp đỡ bạn (chia sẻ sách vở, học nhóm...)."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu hiện nào sau đây là yêu thương con người trong gia đình?", "options": ["A. Kính trọng, chăm sóc ông bà, cha mẹ khi ốm đau", "B. Chỉ quan tâm đến việc học của bản thân", "C. Cả hai đáp án chăm sóc ông bà, cha mẹ và nhường em nhỏ đều đúng", "D. Nhường em nhỏ phần ăn ngon hơn"], "answer": "C", "explain": "Yêu thương người thân thể hiện qua chăm sóc ông bà, cha mẹ và nhường nhịn em nhỏ — cả hai việc đều đúng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lòng yêu thương con người có ý nghĩa như thế nào đối với người được giúp đỡ?", "options": ["A. Khiến họ trở nên ỷ lại vào người khác", "B. Làm họ cảm thấy xấu hổ, tự ti", "C. Không có ý nghĩa gì đáng kể", "D. Giúp họ có thêm niềm tin, nghị lực để vượt qua khó khăn"], "answer": "D", "explain": "Sự giúp đỡ đúng lúc giúp người khó khăn có thêm niềm tin và nghị lực vươn lên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi nào sau đây thể hiện thái độ thờ ơ, vô cảm cần phê phán?", "options": ["A. Thấy người bị ngã xe mà bỏ đi, không giúp đỡ", "B. Động viên bạn khi bạn gặp chuyện buồn", "C. Tham gia hoạt động hiến máu nhân đạo cùng gia đình", "D. Chia sẻ đồ dùng học tập với bạn khó khăn"], "answer": "A", "explain": "Bỏ mặc người gặp nạn là biểu hiện thờ ơ, vô cảm, trái với lòng yêu thương con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn em bị gãy chân phải chống nạng đến trường trong một tháng. Em có thể giúp bạn bằng cách nào phù hợp nhất?", "options": ["A. Cõng bạn lên lớp mỗi ngày dù em còn nhỏ", "B. Giúp bạn mang cặp sách, lấy nước và hỗ trợ bạn di chuyển trong trường", "C. Làm hết bài tập hộ bạn trong một tháng", "D. Xin cô cho bạn nghỉ học ở nhà cả tháng"], "answer": "B", "explain": "Giúp đỡ trong khả năng của mình (mang cặp, hỗ trợ di chuyển) là phù hợp và thiết thực nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên đường đi học về, em thấy một em bé khoảng 4 tuổi đứng khóc một mình ở cổng chợ, có vẻ bị lạc. Em nên làm gì?", "options": ["A. Dắt em đi khắp chợ để tìm người nhà một mình", "B. Bỏ đi vì sợ muộn giờ học buổi chiều", "C. Báo cho người lớn gần đó hoặc chú bảo vệ, công an để giúp em tìm người nhà", "D. Cho em bé kẹo rồi đi tiếp"], "answer": "C", "explain": "Nhờ người lớn có trách nhiệm (bảo vệ, công an) giúp đỡ là cách làm an toàn, đúng đắn khi gặp trẻ bị lạc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn của em lỡ làm vỡ chiếc cốc mà em rất quý. Bạn rối rít xin lỗi. Em nên ứng xử thế nào để thể hiện lòng vị tha, yêu thương?", "options": ["A. Giận dữ và không chơi với bạn nữa", "B. Bắt bạn đền một chiếc cốc đắt tiền hơn", "C. Kể cho cả lớp biết để bạn xấu hổ", "D. An ủi bạn, bỏ qua lỗi lầm vì bạn không cố ý"], "answer": "D", "explain": "Tha thứ khi người khác vô ý mắc lỗi là biểu hiện đẹp của lòng yêu thương, vị tha.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Yêu thương con người phải thể hiện bằng việc làm cụ thể, không chỉ bằng lời nói", "b) Chỉ người lớn mới có thể làm việc yêu thương, giúp đỡ người khác", "c) Học sinh có thể yêu thương con người từ những việc nhỏ như giúp bạn học tập, nhường ghế cho người già", "d) Giúp đỡ người khác thì bản thân sẽ bị thiệt thòi, không nên làm"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: học sinh cũng làm được nhiều việc yêu thương phù hợp lứa tuổi. c) Đúng. d) Sai: giúp người cũng mang lại niềm vui, sự quý mến cho chính mình.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau đây:", "statements": ["a) Thấy bạn bị ngã ở sân trường, em đỡ bạn dậy và đưa bạn vào phòng y tế", "b) Em cười đùa khi thấy bạn bị điểm kém", "c) Em giấu sách của bạn vì bạn không cho em chép bài", "d) Em để dành tiền tiết kiệm để mua quà tặng em nhỏ mồ côi ở trung tâm bảo trợ"], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Sai: chế giễu bạn lúc khó khăn là thiếu yêu thương. c) Sai: hành vi trả đũa, ích kỉ. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu về một người mà em biết luôn sẵn lòng giúp đỡ mọi người (người thân, thầy cô, hàng xóm...). Em học được điều gì từ người đó?", "points": 0, "explain": "Gợi ý: giới thiệu người đó; kể 1–2 việc làm giúp người cụ thể; nêu cảm nhận của em và điều em muốn noi theo trong cuộc sống hằng ngày."}, {"type": "essay", "level": "VDC", "q": "Trường em phát động phong trào “Đôi bạn cùng tiến” giúp các bạn học yếu. Em sẽ làm gì để giúp bạn cùng đôi với mình tiến bộ trong học tập (khoảng 5–7 câu)?", "points": 0, "explain": "Gợi ý: cùng lập thời gian biểu học nhóm; giảng lại bài bạn chưa hiểu; động viên khi bạn nản; chia sẻ cách học hiệu quả; giữ thái độ kiên nhẫn, không chê bai bạn."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Câu ca dao, tục ngữ nào sau đây khuyên con người sống yêu thương, đùm bọc lẫn nhau?", "options": ["A. “Thương người như thể thương thân”", "B. “Ăn chắc mặc bền”", "C. “Có công mài sắt, có ngày nên kim”", "D. “Tốt gỗ hơn tốt nước sơn”"], "answer": "A", "explain": "“Thương người như thể thương thân” dạy ta yêu thương người khác như chính bản thân mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Yêu thương con người được thể hiện rõ nhất qua:", "options": ["A. Lời nói hoa mỹ, hứa hẹn nhiều", "B. Hành động quan tâm, giúp đỡ cụ thể, đúng lúc", "C. Việc đăng ảnh làm từ thiện lên mạng xã hội", "D. Việc chỉ giúp đỡ khi có người chứng kiến"], "answer": "B", "explain": "Lòng yêu thương thể hiện qua hành động giúp đỡ cụ thể, chân thành, không phô trương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc làm nào dưới đây là hoạt động nhân đạo, thể hiện yêu thương con người?", "options": ["A. Thi đua học sinh giỏi cấp trường", "B. Quyên góp xây dựng nhà vệ sinh trường học", "C. Tham gia chương trình “Áo ấm mùa đông” tặng trẻ em vùng cao", "D. Tổ chức văn nghệ chào mừng ngày Nhà giáo"], "answer": "C", "explain": "Tặng áo ấm cho trẻ em vùng cao là hoạt động nhân đạo hướng tới người có hoàn cảnh khó khăn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lớp em có bạn H’Linh nhà rất nghèo, đầu năm học bạn chưa có đủ sách vở. Là lớp trưởng, em đề xuất việc gì?", "options": ["A. Để bạn tự xoay xở với gia đình", "B. Đề nghị cô giáo miễn cho bạn mọi bài kiểm tra", "C. Cho bạn chép chung sách của mình cả năm học", "D. Vận động các bạn trong lớp quyên góp sách vở, đồ dùng còn tốt để tặng bạn"], "answer": "D", "explain": "Vận động tập thể cùng giúp đỡ là cách làm thiết thực, lan tỏa lòng yêu thương trong lớp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em và bạn thân cùng đi học. Dọc đường, bạn bị trượt chân ngã, sách vở văng tung tóe, có vài bạn đi qua cười đùa. Em sẽ làm gì?", "options": ["A. Đỡ bạn dậy, giúp bạn nhặt sách vở và hỏi thăm bạn có bị đau không", "B. Cười theo các bạn cho vui", "C. Đi trước để không bị muộn học", "D. Chụp ảnh lại để đăng lên nhóm lớp"], "answer": "A", "explain": "Giúp đỡ bạn ngay khi bạn gặp sự cố, không cười nhạo, là biểu hiện của lòng yêu thương bạn bè.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người ăn xin già yếu đến trước cổng nhà em xin ăn. Việc làm nào của em là phù hợp?", "options": ["A. Đóng cổng lại và không quan tâm", "B. Xin phép bố mẹ để lấy phần cơm, nước mời cụ một cách lễ phép", "C. Đuổi cụ đi vì sợ bẩn nhà", "D. Cho cụ tiền rồi khoe với bạn bè về việc tốt của mình"], "answer": "B", "explain": "Giúp đỡ lễ phép, trong sự cho phép và hướng dẫn của bố mẹ là cách ứng xử nhân ái, an toàn cho học sinh.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về lòng yêu thương con người:", "statements": ["a) Biết tha thứ cho lỗi lầm của người khác cũng là biểu hiện của yêu thương con người", "b) Yêu thương con người là chỉ yêu thương những người giỏi giang, thành đạt", "c) Động viên, an ủi người đang buồn phiền là một cách thể hiện sự yêu thương", "d) Khi giúp đỡ người khác, ta nên kể công để được biết ơn"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: yêu thương dành cho mọi người, nhất là người khó khăn, yếu thế. c) Đúng. d) Sai: giúp đỡ cần chân thành, không kể công.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Tâm nhường phần quà trung thu của mình cho em nhỏ hàng xóm mồ côi", "b) Bạn Long thấy bạn khuyết tật bị trêu chọc thì hùa theo trêu cùng", "c) Bạn Vy thường xuyên qua nhà kèm em lớp dưới học bài", "d) Bạn Sơn chỉ giúp đỡ bạn khi bạn hứa sẽ cho Sơn chép bài kiểm tra"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: hùa theo trêu chọc người khuyết tật là hành vi đáng phê phán. c) Đúng. d) Sai: giúp đỡ có điều kiện vụ lợi không phải yêu thương chân thành.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy tưởng tượng em là người viết thư động viên một bạn học sinh ở vùng vừa bị thiên tai. Viết khoảng 5–7 câu trong bức thư đó.", "points": 0, "explain": "Gợi ý: lời hỏi thăm, chia sẻ với mất mát của bạn; động viên bạn vững tin; hứa hẹn việc làm cụ thể của em và lớp em (quyên góp sách vở, quần áo...); lời chúc bạn sớm trở lại trường học."}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu kể về việc làm của một tập thể lớp hoặc trường em thể hiện tinh thần yêu thương, giúp đỡ cộng đồng. Em rút ra bài học gì?", "points": 0, "explain": "Gợi ý: nêu hoạt động (quyên góp, thăm trung tâm bảo trợ, giúp bạn khó khăn...); không khí và kết quả của hoạt động; bài học về sự sẻ chia, đoàn kết mà em rút ra."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Đối tượng nào sau đây cần được quan tâm, yêu thương và giúp đỡ nhiều nhất?", "options": ["A. Người khỏe mạnh, giàu có", "B. Người nổi tiếng trên mạng xã hội", "C. Người gặp khó khăn, hoạn nạn, người già yếu, trẻ em mồ côi", "D. Bạn bè cùng sở thích với mình"], "answer": "C", "explain": "Yêu thương con người hướng trước hết tới những người yếu thế, khó khăn, hoạn nạn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi nào thể hiện lòng yêu thương con người ở nơi công cộng?", "options": ["A. Chen lấn khi xếp hàng mua vé", "B. Nói chuyện ồn ào trong bệnh viện", "C. Xả rác bừa bãi ở công viên", "D. Nhường ghế ưu tiên cho phụ nữ mang thai trên xe buýt"], "answer": "D", "explain": "Nhường ghế cho người cần ưu tiên là biểu hiện văn minh, nhân ái nơi công cộng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao chúng ta cần phê phán lối sống thờ ơ, vô cảm?", "options": ["A. Vì lối sống đó làm cho xã hội lạnh nhạt, người khó khăn không được giúp đỡ kịp thời", "B. Vì người thờ ơ thường học không giỏi", "C. Vì lối sống đó khiến ta mất nhiều bạn bè trên mạng", "D. Vì người vô cảm không biết tiêu tiền"], "answer": "A", "explain": "Thờ ơ, vô cảm khiến người hoạn nạn bị bỏ mặc, các mối quan hệ xã hội trở nên lạnh nhạt, thiếu nhân ái.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn cùng lớp của em có bố vừa mất vì tai nạn, bạn rất buồn và hay khóc, học hành sa sút. Em và các bạn nên làm gì?", "options": ["A. Tránh xa bạn vì sợ bị lây nỗi buồn", "B. Thường xuyên hỏi thăm, động viên, giúp bạn ghi bài và rủ bạn tham gia hoạt động lớp để bạn khuây khỏa", "C. Chỉ quan tâm đến việc học của mình", "D. Kể chuyện vui cười đùa thật to bên cạnh bạn"], "answer": "B", "explain": "Ở bên động viên, giúp đỡ bạn lúc tang thương là biểu hiện sâu sắc của lòng yêu thương con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em thấy một bạn lớp khác bị nhóm bạn lớn hơn bắt nạt ở góc sân trường. Em nên làm gì?", "options": ["A. Đứng xem vì sợ bị liên lụy", "B. Quay video lại để xem sau", "C. Báo ngay cho thầy cô hoặc bác bảo vệ để can thiệp kịp thời", "D. Rủ thêm bạn đến xem cho đông"], "answer": "C", "explain": "Báo người lớn có trách nhiệm là cách bảo vệ bạn an toàn và đúng đắn nhất khi chứng kiến bắt nạt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mẹ em bảo cuối tuần cả nhà sẽ đi thăm và tặng quà các cụ già neo đơn ở phường. Em đang có hẹn đá bóng với bạn. Em nên chọn cách nào?", "options": ["A. Xin mẹ ở nhà đi đá bóng vì đã hẹn bạn", "B. Đi thăm các cụ nhưng tỏ ra khó chịu suốt buổi", "C. Chỉ đi khi mẹ hứa mua đồ chơi cho", "D. Vui vẻ cùng gia đình đi thăm các cụ, hẹn bạn đá bóng vào dịp khác"], "answer": "D", "explain": "Ưu tiên việc làm nhân ái cùng gia đình và biết sắp xếp việc riêng hợp lí thể hiện em biết yêu thương con người.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lòng yêu thương con người góp phần làm cho xã hội đoàn kết, nhân ái hơn", "b) Giúp đỡ người khác là việc làm lãng phí thời gian của bản thân", "c) Khi được người khác giúp đỡ, ta nên biết ơn và sẵn sàng giúp lại người khác khi có thể", "d) Chỉ nên giúp đỡ những người hứa sẽ đền đáp mình"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: giúp người là việc làm có ý nghĩa, không lãng phí. c) Đúng. d) Sai: yêu thương chân thành không đặt điều kiện đền đáp.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau của học sinh:", "statements": ["a) Chép bài đầy đủ để gửi cho bạn ốm nghỉ học", "b) Chia sẻ bữa ăn sáng của mình cho bạn nhịn đói đến lớp", "c) Giấu cặp của bạn khuyết tật để trêu đùa", "d) An ủi bạn khi bạn bị điểm kém thay vì chế giễu"], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: trêu chọc người khuyết tật là hành vi đáng lên án. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu về một việc làm tử tế nhỏ bé mà em từng chứng kiến trong trường học khiến em xúc động. Việc làm đó dạy em điều gì?", "points": 0, "explain": "Gợi ý: kể lại việc làm (ai làm, trong hoàn cảnh nào); cảm xúc của em khi chứng kiến; bài học về cách quan tâm, giúp đỡ người khác từ những điều nhỏ nhất."}, {"type": "essay", "level": "VDC", "q": "Nếu lớp em nhận đỡ đầu một bạn học sinh có hoàn cảnh đặc biệt khó khăn trong trường, em sẽ đề xuất những việc làm cụ thể nào? Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: quyên góp sách vở, đồ dùng; phân công bạn học nhóm kèm cặp; thăm hỏi, động viên thường xuyên; tổ chức sinh nhật nhỏ cho bạn; giữ thái độ tôn trọng, không làm bạn mặc cảm."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "“Một con ngựa đau, cả tàu bỏ cỏ” muốn nhắc nhở chúng ta điều gì?", "options": ["A. Khi một người gặp khó khăn, mọi người xung quanh cần quan tâm, chia sẻ với họ", "B. Cần chăm sóc ngựa cẩn thận", "C. Không nên nuôi nhiều ngựa trong một chuồng", "D. Người ốm thì không nên đi làm"], "answer": "A", "explain": "Câu tục ngữ nói về tình đoàn kết, yêu thương: một người gặp nạn, cả tập thể cùng quan tâm, chia sẻ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc làm nào sau đây thể hiện yêu thương con người một cách bền vững, thiết thực?", "options": ["A. Cho bạn tiền mỗi khi bạn xin", "B. Dạy bạn cách câu cá, giúp bạn có kế sinh nhai lâu dài thay vì chỉ cho cá ăn sẵn", "C. Chỉ giúp một lần rồi thôi", "D. Giúp bạn để chụp ảnh đăng mạng"], "answer": "B", "explain": "Giúp người có cách làm ăn, học tập lâu dài mới là giúp đỡ thiết thực, bền vững.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi bạn bè xung quanh gặp chuyện buồn, thái độ nào của em là đúng?", "options": ["A. Tò mò hỏi dồn dập về chuyện riêng của bạn để kể cho người khác", "B. Tránh mặt bạn vì không biết nói gì", "C. Lặng lẽ quan tâm, lắng nghe và chia sẻ cùng bạn", "D. Vui mừng vì không phải chuyện của mình"], "answer": "C", "explain": "Lắng nghe, chia sẻ chân thành là cách thể hiện sự quan tâm khi bạn gặp chuyện buồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong giờ ra chơi, em thấy một học sinh lớp dưới bị ngã trầy xước đầu gối, ngồi khóc ở cầu thang. Em sẽ làm gì?", "options": ["A. Đi ngang qua vì sắp vào giờ học", "B. Đứng lại xem một lúc rồi đi", "C. Dọa em không được khóc nữa", "D. Đỡ em dậy, xem vết thương và đưa em đến phòng y tế hoặc báo thầy cô"], "answer": "D", "explain": "Giúp em nhỏ bị thương đến phòng y tế là hành động yêu thương, trách nhiệm của học sinh lớn hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn thân của em được chọn vào đội tuyển học sinh giỏi còn em thì không. Bạn rất vui. Thái độ nào của em thể hiện tình bạn đẹp, biết yêu thương, chia sẻ?", "options": ["A. Chân thành chúc mừng và nhờ bạn chia sẻ cách học để cùng tiến bộ", "B. Giận bạn và không nói chuyện nữa", "C. Nói xấu bạn với các bạn khác", "D. Cho rằng bạn gặp may mắn chứ không giỏi thật"], "answer": "A", "explain": "Vui với niềm vui của bạn, không ghen tị là biểu hiện đẹp của tình yêu thương bạn bè.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khu phố em có bác hàng xóm sống một mình, con cái ở xa. Cuối tuần, em có thể làm gì để thể hiện sự quan tâm?", "options": ["A. Sang nhà bác chơi game cho bác đỡ buồn nhưng làm ồn cả buổi", "B. Cùng bố mẹ sang thăm hỏi, giúp bác những việc nhỏ như quét sân, mua đồ", "C. Không quan tâm vì không phải họ hàng", "D. Chỉ sang khi bác cho quà"], "answer": "B", "explain": "Thăm hỏi, giúp việc nhỏ cho người già neo đơn là biểu hiện thiết thực của lòng yêu thương con người trong khu dân cư.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về yêu thương con người:", "statements": ["a) Yêu thương con người bắt đầu từ những việc làm nhỏ bé, gần gũi hằng ngày", "b) Muốn thể hiện lòng yêu thương phải có thật nhiều tiền để cho người khác", "c) Lắng nghe, chia sẻ khi bạn gặp chuyện buồn cũng là yêu thương con người", "d) Người được giúp đỡ không cần biết ơn người đã giúp mình"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: yêu thương thể hiện trước hết bằng tình cảm và việc làm phù hợp khả năng. c) Đúng. d) Sai: biết ơn là thái độ cần có của người được giúp đỡ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Nga gom quần áo cũ còn tốt của mình để gửi tặng trẻ em vùng cao", "b) Bạn Phúc chỉ chơi với những bạn nhà giàu, chê bạn nhà nghèo", "c) Bạn Trâm kiên nhẫn giảng bài cho bạn học chậm trong nhóm", "d) Bạn Tuấn quay lưng bỏ đi khi thấy bạn cùng lớp bị ngã xe đạp"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: phân biệt giàu nghèo là thiếu yêu thương, thiếu tôn trọng người khác. c) Đúng. d) Sai: bỏ mặc bạn gặp nạn là vô cảm.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu tưởng tượng em gặp một bạn nhỏ lang thang bán vé số trong ngày mưa. Em sẽ làm gì và em mong ước điều gì cho bạn?", "points": 0, "explain": "Gợi ý: tả ngắn hoàn cảnh của bạn; việc làm cụ thể của em (mua giúp tờ vé số, tặng áo mưa/ô, hỏi thăm...); mong ước mọi trẻ em đều được đến trường, được sống trong yêu thương."}, {"type": "essay", "level": "VDC", "q": "Viết một đoạn văn ngắn (5–7 câu) với chủ đề: “Yêu thương bắt đầu từ những việc nhỏ”. Hãy dẫn chứng bằng việc làm quanh em.", "points": 0, "explain": "Gợi ý: mở đoạn nêu chủ đề; dẫn 2–3 việc nhỏ (nhường ghế, giúp bạn chép bài, thăm người ốm...); kết đoạn khẳng định ý nghĩa của những việc nhỏ trong việc xây dựng tình yêu thương giữa con người."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Truyền thống “thương người như thể thương thân” thuộc phẩm chất nào của con người Việt Nam?", "options": ["A. Tính siêng năng, cần cù trong lao động", "B. Lòng dũng cảm trong chiến đấu", "C. Lòng yêu thương con người, tinh thần nhân ái", "D. Sự khéo léo trong giao tiếp"], "answer": "C", "explain": "Câu tục ngữ thể hiện truyền thống nhân ái, yêu thương con người lâu đời của dân tộc ta.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc nào sau đây thể hiện lòng yêu thương con người đối với người khuyết tật?", "options": ["A. Nói chuyện thật to và chậm để trêu chọc họ", "B. Tránh tiếp xúc vì sợ phiền phức", "C. Thương hại và ban phát tiền mỗi lần gặp", "D. Tôn trọng họ, hỗ trợ khi họ cần (chỉ đường, nhường lối đi ưu tiên) như với mọi người bình thường khác"], "answer": "D", "explain": "Tôn trọng và giúp đỡ đúng lúc, đúng cách mới là yêu thương thật sự đối với người khuyết tật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lòng yêu thương con người được nuôi dưỡng tốt nhất từ đâu?", "options": ["A. Từ gia đình, nhà trường và những việc làm nhân ái cụ thể quanh em mỗi ngày", "B. Từ việc xem nhiều chương trình từ thiện trên ti vi", "C. Từ những bài giảng dài về đạo đức", "D. Từ việc được khen thưởng khi làm việc tốt"], "answer": "A", "explain": "Phẩm chất yêu thương hình thành qua môi trường sống và hành động cụ thể hằng ngày, bắt đầu từ gia đình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn trong lớp bị bạn bè tẩy chay, không ai chơi cùng chỉ vì bạn mặc đồng phục cũ, sờn vai. Em sẽ làm gì?", "options": ["A. Cũng tránh xa bạn cho an toàn", "B. Chủ động rủ bạn cùng chơi, cùng học và nhắc các bạn khác không nên phân biệt đối xử", "C. Khuyên bạn nghỉ học vài hôm", "D. Chỉ nói chuyện với bạn khi không có ai nhìn thấy"], "answer": "B", "explain": "Chủ động đến bên và giúp bạn hòa nhập là phản ứng đúng trước sự bất công, thể hiện lòng yêu thương bạn bè.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khu dân cư em ở có đợt tiêm chủng miễn phí cho người già. Em có thể góp phần thể hiện sự quan tâm cộng đồng bằng việc nào?", "options": ["A. Ở nhà chơi, đó là việc của người lớn", "B. Chỉ đi khi được trả công", "C. Cùng tổ dân phố phát tờ rơi thông báo, hướng dẫn các cụ đến điểm tiêm đúng giờ", "D. Nhắc bố mẹ không cần đi tiêm cho đỡ mệt"], "answer": "C", "explain": "Tham gia việc cộng đồng phù hợp sức mình để hỗ trợ người già là biểu hiện thiết thực của lòng yêu thương con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn thân của em buồn vì bị điểm kém hơn em trong khi bạn đã rất cố gắng. Câu nói nào của em thể hiện sự yêu thương, tinh tế nhất?", "options": ["A. “Cậu học kém hơn tớ là đúng rồi”", "B. “Thôi đừng buồn, chuyện nhỏ mà” (nói qua loa rồi bỏ đi chơi)", "C. “Cậu nên bỏ cuộc thi tới đi cho đỡ áp lực”", "D. “Lần này chưa tốt thôi, tớ biết cậu đã cố gắng nhiều; mình cùng ôn lại để lần sau tốt hơn nhé”"], "answer": "D", "explain": "Công nhận nỗ lực của bạn và đồng hành cùng bạn vượt khó là lời động viên yêu thương, có tác dụng nhất.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Yêu thương con người cần xuất phát từ tình cảm chân thành, không vụ lợi", "b) Giúp đỡ người khác để được nổi tiếng cũng là yêu thương con người đúng nghĩa", "c) Mỗi người đều có thể làm việc thiện phù hợp với khả năng của mình", "d) Chỉ khi giàu có, ta mới có điều kiện thể hiện lòng yêu thương con người"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: giúp đỡ vì danh tiếng là vụ lợi, không phải yêu thương chân thành. c) Đúng. d) Sai: yêu thương thể hiện trước hết bằng tình cảm, thái độ và việc làm nhỏ phù hợp.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Liên để dành một phần quà sinh nhật của mình để tặng bạn có hoàn cảnh khó khăn trong lớp", "b) Bạn Mạnh đọc được tin giả về một hoàn cảnh “bị bệnh nặng” nhưng vẫn kêu gọi quyên góp rầm rộ mà không kiểm chứng", "c) Bạn Oanh thăm hỏi, trò chuyện với bạn cùng lớp đang điều trị dài ngày qua tin nhắn mỗi tuần", "d) Bạn Khánh nói: “Nhà bạn ấy nghèo thì kệ, mỗi người tự lo thân mình”"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: làm việc thiện cũng cần tìm hiểu, kiểm chứng để lòng tốt đặt đúng chỗ. c) Đúng. d) Sai: thái độ thờ ơ, thiếu yêu thương.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy đề xuất một “hộp việc tốt” cho lớp em: mỗi bạn ghi lại một việc yêu thương mình đã làm trong tuần. Theo em, hoạt động này có tác dụng gì? Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: cách tổ chức hộp việc tốt (ghi việc, chia sẻ cuối tuần, không khoe thành tích); tác dụng: lan tỏa hành động đẹp, khích lệ nhau, xây dựng tập thể lớp đoàn kết, nhân ái."}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu về cách em sẽ giúp một bạn trong lớp có tính nhút nhát, ít bạn bè trở nên hòa đồng hơn.", "points": 0, "explain": "Gợi ý: chủ động bắt chuyện, rủ bạn tham gia trò chơi/nhóm học; lắng nghe, không chê cười sự nhút nhát; kiên nhẫn, rủ thêm các bạn khác cùng giao lưu; nêu kết quả em mong muốn cho bạn và tập thể lớp."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Đâu là biểu hiện của lòng yêu thương con người trong lao động, học tập tập thể?", "options": ["A. Sẵn sàng hỗ trợ đồng đội, bạn học khi họ gặp khó khăn trong công việc chung", "B. Chỉ lo hoàn thành phần việc của mình thật nhanh để về trước", "C. Nhận hết phần dễ, đẩy phần khó cho người khác", "D. Làm việc qua loa khi không có người kiểm tra"], "answer": "A", "explain": "Tinh thần tương trợ trong công việc chung là biểu hiện của yêu thương con người trong tập thể.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi nhận được sự giúp đỡ của người khác, thái độ đúng đắn nhất là:", "options": ["A. Coi đó là điều hiển nhiên họ phải làm", "B. Biết ơn và khi có điều kiện sẽ giúp đỡ lại người khác", "C. Quên ngay sau khi được giúp xong", "D. Chỉ cảm ơn khi món quà giúp đỡ có giá trị lớn"], "answer": "B", "explain": "Biết ơn và sẵn sàng sẻ chia lại là thái độ đẹp, giúp lòng yêu thương được lan tỏa mãi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi nào sau đây cần bị lên án vì thiếu lòng yêu thương con người?", "options": ["A. Nhường chỗ ngồi cho người già trên phương tiện công cộng", "B. Giúp bạn khuyết tật qua đường", "C. Quay video cảnh bạn bị ngã để đăng lên mạng trêu chọc", "D. An ủi bạn khi gia đình bạn có chuyện buồn"], "answer": "C", "explain": "Dùng nỗi đau, sự cố của người khác để mua vui là hành vi thiếu nhân ái, đáng lên án mạnh mẽ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong buổi lao động, bạn cùng tổ của em bị say nắng, mặt tái nhợt. Em nên xử lí thế nào?", "options": ["A. Để bạn tự nghỉ một lúc sẽ tự khỏe", "B. Rủ bạn về lớp nằm một mình", "C. Tiếp tục làm việc của tổ cho kịp tiến độ", "D. Dìu bạn vào chỗ râm mát, báo thầy cô và giúp bạn uống nước, theo dõi tình trạng của bạn"], "answer": "D", "explain": "Chăm sóc bạn ngay khi bạn có dấu hiệu bất ổn sức khỏe và báo người lớn là xử lí đúng, thể hiện sự quan tâm tới bạn bè.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em thấy trên đường về nhà, một bác bán hàng rong bị đổ xe trái cây giữa đường, trái cây lăn ra đầy mặt đường. Em có thể làm gì?", "options": ["A. Dừng lại giúp bác nhặt trái cây lên xe trong khả năng của mình (khi đường an toàn)", "B. Đi vòng qua để tránh phiền phức", "C. Đứng xem người khác giúp", "D. Nhặt vài quả mang về nhà"], "answer": "A", "explain": "Giúp người gặp sự cố bất ngờ nhặt lại hàng hóa là việc làm nhân ái phù hợp với học sinh khi đảm bảo an toàn giao thông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gia đình em chuẩn bị dọn nhà, có nhiều quần áo, sách vở cũ còn sử dụng tốt. Cách xử lí nào thể hiện lòng yêu thương, sẻ chia nhất?", "options": ["A. Vứt hết vào thùng rác cho gọn", "B. Phân loại, giặt sạch và gửi tặng các bạn vùng khó khăn qua điểm tiếp nhận của trường/địa phương", "C. Để chất đống trong kho mãi mãi", "D. Bán lại cho bạn cùng lớp với giá cao"], "answer": "B", "explain": "Chia sẻ đồ dùng còn tốt cho người cần hơn là việc làm yêu thương thiết thực và gần gũi.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quan tâm tới cảm xúc của người khác cũng là một phần của yêu thương con người", "b) Yêu thương con người chỉ thể hiện qua việc cho tặng vật chất", "c) Một lời động viên đúng lúc đôi khi quý hơn nhiều món quà vật chất", "d) Người hay giúp đỡ người khác là người yếu đuối, dễ bị lợi dụng"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: yêu thương còn thể hiện bằng lời nói, thái độ, sự hiện diện chia sẻ. c) Đúng. d) Sai: giúp đỡ đúng mực là biểu hiện của tấm lòng mạnh mẽ, nhân hậu.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau đây:", "statements": ["a) Bạn Phương kèm cặp em nhỏ hàng xóm học chữ mỗi tối cuối tuần", "b) Bạn Giang thấy bạn bị điểm kém thì giấu bài kiểm tra điểm cao của mình đi để bạn càng tự ti", "c) Bạn Hằng quyên góp đồ chơi của mình cho các em ở lớp học tình thương", "d) Bạn Khoa chê bạn nói ngọng và bắt chước giọng bạn trước lớp"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: hành vi làm tổn thương bạn lúc bạn đang buồn là thiếu yêu thương. c) Đúng. d) Sai: chế giễu khuyết điểm của bạn là việc làm đáng lên án.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu kể về một hoạt động thiện nguyện ở địa phương em (tặng quà Tết cho người nghèo, khám bệnh miễn phí...) mà em biết, và nêu cảm nghĩ của em.", "points": 0, "explain": "Gợi ý: nêu tên/quy mô hoạt động; hình ảnh người được giúp và người tham gia giúp; cảm nghĩ của em về tinh thần tương thân tương ái trong cộng đồng; mong muốn của em khi lớn hơn."}, {"type": "essay", "level": "VDC", "q": "Nếu em là người tổ chức “Ngày hội sẻ chia” ở trường, em sẽ thiết kế những gian hoạt động nào để mọi học sinh đều có thể tham gia giúp đỡ bạn khó khăn? Viết khoảng 5–7 câu.", "points": 0, "explain": "Gợi ý: gian đổi sách/đồ dùng cũ; gian quyên góp theo khả năng; gian thư động viên gửi bạn vùng khó; nguyên tắc tôn trọng người nhận, không chụp ảnh phô trương; thông điệp em muốn gửi qua ngày hội."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "“Nhiễu điều phủ lấy giá gương, người trong một nước phải thương nhau cùng” muốn khuyên chúng ta điều gì?", "options": ["A. Phải biết giữ gìn gương soi cẩn thận", "B. Chỉ nên quan tâm đến người cùng quê với mình", "C. Đồng bào, mọi người trong cộng đồng cần yêu thương, đùm bọc lẫn nhau", "D. Muốn được yêu thương phải có điều kiện vật chất tốt"], "answer": "C", "explain": "Câu ca dao khuyên tinh thần đoàn kết, yêu thương giữa con người trong cùng cộng đồng, đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biểu hiện nào cho thấy một tập thể lớp có tinh thần yêu thương, đoàn kết?", "options": ["A. Mỗi bạn chỉ lo học phần của mình", "B. Chỉ nhóm bạn thân mới giúp nhau", "C. Lớp chỉ đoàn kết khi thi đua với lớp khác", "D. Cả lớp cùng quan tâm, giúp đỡ khi có bạn gặp khó khăn, hoạn nạn"], "answer": "D", "explain": "Tập thể biết chung tay khi một thành viên khó khăn là tập thể có tình yêu thương, đoàn kết thật sự.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc làm nào thể hiện lòng yêu thương con người đối với thầy cô giáo?", "options": ["A. Quan tâm, thăm hỏi khi thầy cô ốm đau; chăm ngoan, học tốt để thầy cô yên lòng", "B. Chỉ tặng quà đắt tiền vào ngày 20/11", "C. Nói những lời khen ngợi dù không thật lòng", "D. Giúp thầy cô làm việc riêng ngoài giờ lên lớp"], "answer": "A", "explain": "Sự quan tâm chân thành và nỗ lực học tập, rèn luyện của học sinh là món quà ý nghĩa nhất với thầy cô.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cô giáo chủ nhiệm của lớp em bị ốm phải nghỉ dạy một tuần. Hành động nào của lớp thể hiện tình cảm yêu thương, biết ơn cô?", "options": ["A. Cả lớp vui vì được nghỉ các tiết của cô", "B. Đại diện lớp cùng phụ huynh thăm hỏi cô, các bạn chép bài, giữ trật tự tốt khi có giáo viên dạy thay", "C. Chỉ vài bạn thân với cô mới cần quan tâm", "D. Gửi thật nhiều tin nhắn làm phiền cô nghỉ ngơi"], "answer": "B", "explain": "Thăm hỏi đúng mực và tự giác học tốt khi cô vắng mặt là cách thể hiện tình cảm trân trọng, yêu thương thầy cô.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên sân trường, em thấy một nhóm học sinh lớn đang vây quanh trêu chọc một em lớp dưới nhỏ con, em ấy sắp khóc. Em nên làm gì?", "options": ["A. Đứng ngoài xem vì không liên quan đến mình", "B. Quay lại video để làm bằng chứng đăng mạng xã hội", "C. Tìm cách báo ngay cho thầy cô hoặc bác bảo vệ; nếu an toàn có thể lên tiếng yêu cầu các bạn dừng lại", "D. Rủ bạn bè đến xem cùng cho vui"], "answer": "C", "explain": "Nhờ người lớn can thiệp kịp thời là cách bảo vệ em nhỏ hiệu quả, an toàn và thể hiện lòng yêu thương con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn cùng tổ được giao trực nhật nhưng nhà bạn có việc tang nên phải về sớm cả tuần. Em và các bạn trong tổ nên làm gì?", "options": ["A. Bắt bạn làm bù gấp đôi vào tuần sau", "B. Báo cô phạt bạn vì không hoàn thành nhiệm vụ", "C. Để phần việc của bạn đó không ai làm", "D. Chủ động chia nhau phần việc của bạn, gửi lời chia buồn và động viên bạn"], "answer": "D", "explain": "San sẻ phần việc, chia buồn với bạn trong lúc gia đình bạn có tang sự là biểu hiện sâu sắc của tình tổ, tình bạn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về yêu thương con người:", "statements": ["a) Yêu thương con người là phẩm chất cần có trong mọi mối quan hệ: gia đình, bạn bè, xã hội", "b) Với người từng làm điều không tốt với mình thì không bao giờ nên tha thứ, giúp đỡ", "c) Biết chia sẻ niềm vui với người khác cũng là một biểu hiện của yêu thương", "d) Lòng yêu thương sẽ mất giá trị nếu người được giúp không biết đến người đã giúp mình"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: tha thứ và giúp người sửa sai vẫn là yêu thương, tùy mức độ và hoàn cảnh. c) Đúng. d) Sai: yêu thương chân thành không cần điều kiện được biết ơn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau:", "statements": ["a) Bạn Lộc trích tiền mừng tuổi mua sách tặng thư viện lớp học tình thương ở xã bên", "b) Bạn Minh giả vờ quan tâm hỏi thăm bạn ốm nhưng thực ra để nghe ngóng chuyện riêng của bạn", "c) Bạn Nhi kiên nhẫn dạy em gái của bạn hàng xóm đọc chữ mỗi chiều", "d) Bạn Phúc từ chối giúp bạn khuyết tật lên cầu thang vì sợ muộn giờ chơi"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: quan tâm giả tạo, vụ lợi thông tin cá nhân là không chân thành. c) Đúng. d) Sai: việc chơi có thể nhường sau, giúp người cần được ưu tiên.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu về hình ảnh một người lao động bình dị quanh em (bác bảo vệ, cô lao công, chú bán hàng...) và một việc làm của em thể hiện sự trân trọng, yêu thương đối với họ.", "points": 0, "explain": "Gợi ý: giới thiệu người lao động và công việc thầm lặng của họ; một việc làm nhỏ của em (chào hỏi lễ phép, giúp một tay, giữ vệ sinh nơi họ làm việc...); cảm nhận của em về giá trị của mọi nghề lao động chân chính."}, {"type": "essay", "level": "VDC", "q": "Hãy tưởng tượng lớp em nhận được một lá thư cảm ơn từ các bạn học sinh vùng lũ mà lớp đã giúp đỡ. Em sẽ viết thư hồi âm như thế nào (khoảng 5–7 câu)?", "points": 0, "explain": "Gợi ý: bày tỏ niềm vui khi biết các bạn đã ổn định học tập; khẳng định việc giúp đỡ là trách nhiệm, tình cảm đồng bào; động viên các bạn; hứa tiếp tục đồng hành trong khả năng của học sinh."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Ý nghĩa lớn nhất của các hoạt động nhân đạo, từ thiện trong xã hội là gì?", "options": ["A. Lan tỏa tinh thần tương thân tương ái, giúp xã hội thêm đoàn kết, nhân văn", "B. Để các tổ chức được nổi tiếng hơn", "C. Để người cho nhận được nhiều quà đáp lễ", "D. Để giải quyết hết mọi vấn đề của xã hội ngay lập tức"], "answer": "A", "explain": "Hoạt động nhân đạo vừa giúp người khó khăn vừa lan tỏa giá trị nhân ái, gắn kết cộng đồng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đâu là cách thể hiện yêu thương con người phù hợp với học sinh khi thấy bạn cùng lớp bị ốm nặng phải điều trị dài ngày?", "options": ["A. Chỉ quan tâm trong vài ngày đầu rồi quên hẳn", "B. Thăm hỏi, động viên bạn đều đặn; giúp bạn chép bài, cập nhật bài học để bạn yên tâm chữa bệnh", "C. Thay bạn nói dối thầy cô về lí do nghỉ học", "D. Tránh nhắc đến bệnh tình của bạn với bất kì ai, kể cả khi bạn cần hỗ trợ"], "answer": "B", "explain": "Sự quan tâm bền bỉ, thiết thực về học tập và tinh thần là cách học sinh thể hiện yêu thương bạn bè lúc hoạn nạn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thái độ nào cần tránh khi làm việc thiện, giúp đỡ người khác?", "options": ["A. Âm thầm giúp đỡ, không khoe khoang", "B. Tôn trọng và giữ thể diện cho người được giúp", "C. Giúp đỡ kèm theo thái độ ban ơn, khinh thường người nhận", "D. Tìm hiểu kĩ hoàn cảnh trước khi giúp"], "answer": "C", "explain": "Giúp đỡ với thái độ ban ơn, coi thường sẽ làm tổn thương người nhận, đi ngược lại tinh thần yêu thương con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn của em có mẹ phải đi viện phẫu thuật, bạn phải thay mẹ chăm em nhỏ ở nhà nhiều ngày nên hay đi học muộn, bài vở thiếu sót. Là bạn thân, em nên hỗ trợ bạn thế nào?", "options": ["A. Chê bạn không biết sắp xếp thời gian", "B. Làm bài hộ bạn tất cả các môn cho nhanh", "C. Rủ bạn bỏ qua việc nhà để đi chơi cho khuây khỏa", "D. Thông cảm, giúp bạn ghi bài đầy đủ, chia sẻ khó khăn và động viên bạn; nếu cần thì cùng bạn thưa với cô chủ nhiệm để được hỗ trợ"], "answer": "D", "explain": "Đồng hành thực tế về học tập và tinh thần, kết nối với thầy cô là cách giúp bạn vượt qua giai đoạn khó khăn một cách bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở bến xe buýt, một người khiếm thị đang dò dẫm tìm đường xuống xe. Em đang ngồi gần cửa. Em sẽ làm gì?", "options": ["A. Nhẹ nhàng hỏi xem họ cần xuống ở đâu và xin phép dìu họ xuống xe an toàn", "B. Ngồi yên vì sợ làm sai cách giúp họ", "C. Nói thật to cho cả xe cùng nghe để mọi người giúp", "D. Đưa tay kéo họ xuống ngay mà không hỏi"], "answer": "A", "explain": "Hỏi trước và xin phép trước khi hỗ trợ thể hiện sự tôn trọng, đúng cách khi giúp người khiếm thị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lớp phát động ủng hộ bạn bị bệnh hiểm nghèo trong trường, mỗi bạn góp tùy khả năng. Một bạn nhà khó khăn chỉ góp được 2.000 đồng và rất ngại. Em sẽ nói gì với bạn?", "options": ["A. “Ít thế này thì đừng góp cho xấu hổ”", "B. “Quan trọng là tấm lòng, góp bao nhiêu cũng quý như nhau, bạn đừng ngại”", "C. “Để tớ góp thay phần của bạn luôn cho nhanh”", "D. “Bạn nên xin tiền bố mẹ thêm để góp cho bằng mọi người”"], "answer": "B", "explain": "Sự sẻ chia quý ở tấm lòng, không ở giá trị vật chất — lời nói của em giúp bạn giữ được tự trọng khi làm việc tốt.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lòng yêu thương con người thể hiện rõ nhất khi con người gặp hoạn nạn, khó khăn", "b) Giúp đỡ người khác một cách âm thầm, kín đáo là không cần thiết vì chẳng ai biết để khen", "c) Học sinh cần cảnh giác, tìm hiểu rõ các trường hợp kêu gọi giúp đỡ để tránh bị lợi dụng lòng tốt", "d) Yêu thương con người đồng nghĩa với việc chiều theo mọi yêu cầu của người khác"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: giá trị của việc tốt không nằm ở lời khen. c) Đúng: yêu thương cần đi cùng sự tỉnh táo. d) Sai: yêu thương không phải là nuông chiều vô nguyên tắc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm sau đây:", "statements": ["a) Bạn Quỳnh nhường chiếc ô duy nhất của mình cho bạn nhà xa hơn trong cơn mưa bất chợt", "b) Bạn Rô đăng ảnh bạn khó khăn lên mạng kèm lời lẽ thương hại để câu tương tác", "c) Bạn Sen âm thầm để phần quà của mình vào cặp bạn khó khăn mà không nói là của ai", "d) Bạn Tài thấy bạn bị bắt nạt nhiều lần nhưng cho rằng “không phải việc của mình”"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: dùng hình ảnh người khó khăn để câu tương tác là thiếu tôn trọng, thiếu yêu thương. c) Đúng. d) Sai: thờ ơ trước bắt nạt là biểu hiện đáng phê phán.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Hãy viết khoảng 5–7 câu phân tích vì sao người ta nói: “Cho đi là còn mãi” khi nói về lòng yêu thương con người.", "points": 0, "explain": "Gợi ý: khi sẻ chia, người nhận có thêm điều kiện/niềm tin để vươn lên; người cho nhận lại niềm vui, sự quý mến và lan tỏa giá trị tốt đẹp trong cộng đồng; dẫn một ví dụ gần gũi quanh em."}, {"type": "essay", "level": "VDC", "q": "Viết một đoạn văn (5–7 câu) kêu gọi các bạn trong trường tham gia chương trình “Tiếp sức đến trường” giúp bạn khó khăn đầu năm học mới.", "points": 0, "explain": "Gợi ý: mở đầu nêu hoàn cảnh của các bạn cần giúp; kêu gọi đóng góp phù hợp khả năng (sách vở, đồ dùng, tiền tiết kiệm...); nhấn mạnh tinh thần tùy tâm, tôn trọng bạn được giúp; kết bằng thông điệp yêu thương, đoàn kết."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tổng kết đúng nhất về bài học Yêu thương con người là:", "options": ["A. Chỉ cần yêu thương người thân trong gia đình là đủ", "B. Muốn yêu thương người khác phải chờ đến khi trưởng thành, có tiền", "C. Yêu thương con người là quan tâm, giúp đỡ, sẻ chia với mọi người, nhất là người khó khăn, bằng những việc làm chân thành, phù hợp khả năng", "D. Yêu thương chỉ nên thể hiện bằng vật chất"], "answer": "C", "explain": "Bài học nhấn mạnh yêu thương dành cho mọi người xung quanh, thể hiện bằng hành động chân thành, vừa sức, bắt đầu từ hôm nay.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nào sau đây thể hiện rõ nhất thái độ vô cảm cần phê phán?", "options": ["A. “Bạn ấy khó khăn, chúng mình cùng giúp một tay nhé”", "B. “Để tớ chép bài giúp bạn trong thời gian bạn ốm”", "C. “Cụ già kia cần qua đường, mình dìu cụ qua nhé”", "D. “Việc của người ta, kệ họ, mình lo thân mình là được”"], "answer": "D", "explain": "Câu nói thể hiện sự thờ ơ, chỉ lo cho bản thân là thái độ vô cảm, trái với truyền thống yêu thương con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một trong những cách giữ gìn và phát huy truyền thống yêu thương con người của dân tộc là:", "options": ["A. Sống nhân ái trong đời sống hằng ngày và giáo dục con em noi theo", "B. Chỉ nhắc lại các câu tục ngữ về tình thương trong sách vở", "C. Chờ các tổ chức lớn phát động mới tham gia", "D. Ghi nhớ các ngày lễ lớn của dân tộc"], "answer": "A", "explain": "Truyền thống được phát huy bằng chính lối sống nhân ái mỗi ngày của mỗi người, nhất là thế hệ trẻ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sáng nay trên đường đi học, em chứng kiến một vụ va chạm nhẹ, một người đi xe máy bị ngã, đồ đạc văng ra đường, xung quanh nhiều người chỉ đứng nhìn. Với vai trò học sinh, hành động phù hợp nhất của em là:", "options": ["A. Đi tiếp để không muộn học, coi như không thấy", "B. Đứng ở vị trí an toàn, gọi người lớn gần đó cùng giúp đỡ, nếu cần thì nhờ gọi cấp cứu/báo người thân của nạn nhân", "C. Chen vào giữa hiện trường để xem cho rõ", "D. Lấy điện thoại quay video lại"], "answer": "B", "explain": "Huy động người lớn giúp đỡ từ vị trí an toàn là việc làm nhân ái và phù hợp với học sinh trong tình huống tai nạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn cùng lớp mồ côi cha, sống với mẹ bán hàng rong. Dịp Tết, lớp tổ chức tặng quà cho bạn nhưng một số bạn đề nghị chụp ảnh đăng lên trang của trường. Bạn được hỏi ý kiến. Ý kiến đúng nhất là:", "options": ["A. Đồng ý để trường được nhiều người biết đến việc tốt", "B. Cứ chụp ảnh thoải mái vì đó là việc tốt", "C. Đề nghị tặng quà một cách kín đáo, tế nhị, tôn trọng cảm xúc và thể diện của bạn; nếu đăng tin cần được bạn và gia đình đồng ý", "D. Không tặng quà nữa để tránh phức tạp"], "answer": "C", "explain": "Làm việc tốt cần đi đôi với sự tế nhị, tôn trọng người nhận — đó mới là yêu thương thật sự.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em có một chiếc áo ấm còn rất tốt nhưng đã chật. Mùa đông sắp đến, em sẽ xử lí thế nào thể hiện lòng sẻ chia?", "options": ["A. Để trong tủ làm kỉ niệm dù không mặc đến", "B. Mang cho bạn thân dù bạn không thiếu áo ấm", "C. Cắt bỏ để không ai dùng được nữa", "D. Giặt sạch, gấp gọn và gửi tặng bạn khó khăn qua tủ đồ yêu thương của trường"], "answer": "D", "explain": "Chuyển món đồ còn tốt đến người đang cần là hành động sẻ chia thiết thực, đúng tinh thần “lá lành đùm lá rách”.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định tổng hợp sau:", "statements": ["a) Yêu thương con người là truyền thống quý báu của dân tộc Việt Nam cần được thế hệ trẻ giữ gìn, phát huy", "b) Học sinh lớp 6 còn nhỏ nên chỉ cần nhận sự yêu thương, chưa cần yêu thương, giúp đỡ người khác", "c) Việc làm yêu thương phải phù hợp khả năng, hoàn cảnh và đảm bảo an toàn cho bản thân", "d) Người được giúp đỡ nhiều lần sẽ sinh tính ỷ lại nên tốt nhất không nên giúp ai"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: học sinh hoàn toàn có thể yêu thương bằng việc nhỏ phù hợp. c) Đúng. d) Sai: cần giúp đúng cách, đúng đối tượng chứ không phải từ chối mọi sự giúp đỡ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các việc làm tổng hợp sau:", "statements": ["a) Bạn Uyên giữ thói quen thăm hỏi cụ bà neo đơn ở đầu ngõ mỗi cuối tuần", "b) Bạn Vân chỉ làm việc tốt khi biết chắc sẽ được tuyên dương trước trường", "c) Bạn Xuân nhặt được ví tiền trên sân trường và mang nộp cho văn phòng nhà trường", "d) Bạn Yến cười nhạo bạn mới chuyển trường nói giọng địa phương khác"], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: làm việc tốt vì thành tích là vụ lợi, không chân thành. c) Đúng. d) Sai: trêu chọc sự khác biệt là thiếu yêu thương, thiếu tôn trọng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết khoảng 5–7 câu với chủ đề: “Một việc nhỏ, một trái tim lớn” — kể một việc làm yêu thương nhỏ bé quanh em và ý nghĩa của nó đối với em.", "points": 0, "explain": "Gợi ý: kể việc làm cụ thể (của em hoặc người khác); hoàn cảnh diễn ra; tác động của việc làm với người được giúp và người chứng kiến; thông điệp em rút ra về sức mạnh của những việc tốt nhỏ bé."}, {"type": "essay", "level": "VDC", "q": "Hãy viết lời kêu gọi ngắn (5–7 câu) gửi các bạn học sinh toàn trường trước đợt quyên góp ủng hộ đồng bào miền Trung bị bão lũ do Đoàn trường phát động.", "points": 0, "explain": "Gợi ý: nêu ngắn gọn tình hình khó khăn của đồng bào; nhắc truyền thống “lá lành đùm lá rách”, “thương người như thể thương thân”; kêu gọi đóng góp tùy khả năng, đúng nơi tiếp nhận của trường; kết bằng lời chúc đồng bào sớm vượt qua khó khăn."}]}]}</script>
