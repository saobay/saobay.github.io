Thương nhớ bầy ong\"?", "options": ["A. Vì gia đình mất đi nguồn thu nhập chính", "B. Vì cậu bé sợ bị cha mẹ quở mắng", "C. Vì bầy ong gắn bó thân thiết như những người bạn của tuổi thơ", "D. Vì từ đó không còn mật ong để ăn"], "answer": "C", "explain": "Bầy ong như những người bạn thân của cậu bé nên khi chúng bỏ đi, cậu mang một trong những nỗi mất mát đầu đời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu ngoặc kép trong câu 'Cậu bé ấy đúng là một \"ông cụ non\".' được dùng để làm gì?", "options": ["A. Đánh dấu lời nói trực tiếp", "B. Đánh dấu tên riêng của người", "C. Kết thúc câu văn", "D. Đánh dấu từ ngữ được dùng với ý nghĩa đặc biệt, mang sắc thái hài hước"], "answer": "D", "explain": "\"Ông cụ non\" được dùng với ý nghĩa đặc biệt (trẻ con mà chững chạc như ông cụ) nên đặt trong dấu ngoặc kép.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về hồi kí:", "statements": ["a) Người kể chuyện trong hồi kí thường xưng \"tôi\".", "b) Nhật kí và hồi kí giống hệt nhau về thời điểm ghi chép.", "c) \"Lao xao ngày hè\" thể hiện tình yêu quê hương của Duy Khán.", "d) Trần Đăng Khoa nổi tiếng với tập thơ \"Góc sân và khoảng trời\"."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: nhật kí ghi ngay trong ngày; hồi kí viết về quá khứ khi nhìn lại. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tiếng Việt:", "statements": ["a) \"Sơn thủy\" là từ Hán Việt chỉ núi và nước, nói về cảnh thiên nhiên.", "b) Yếu tố \"quốc\" trong \"tổ quốc\" có nghĩa là \"làng quê\".", "c) Dấu ngoặc kép gồm dấu mở và dấu đóng đi thành cặp.", "d) Khi trích dẫn lời nói trực tiếp, không bao giờ được dùng dấu hai chấm trước dấu ngoặc kép."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: \"quốc\" nghĩa là đất nước; \"hương\" mới là làng quê. c) Đúng. d) Sai: trước lời dẫn trực tiếp thường có dấu hai chấm.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại một kỉ niệm tuổi thơ đáng nhớ của em, trong đoạn có dùng ít nhất một câu trích dẫn lời nói trực tiếp với dấu ngoặc kép.", "points": 0, "explain": "Gợi ý chấm: kể rõ kỉ niệm (hoàn cảnh, diễn biến, cảm xúc); câu trích dẫn lời nói trực tiếp đặt đúng trong dấu ngoặc kép, có dấu hai chấm báo trước; văn phong mạch lạc, cảm xúc chân thành."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu cảm nhận của em về tình yêu thiên nhiên của Huy Cận qua \"Thương nhớ bầy ong\".", "points": 0, "explain": "Gợi ý chấm: chỉ ra biểu hiện của tình yêu thiên nhiên (say mê ngắm ong, nâng niu chăm sóc, buồn sâu sắc khi ong bỏ đi); nhận xét giọng văn trữ tình, nhân hóa; liên hệ thái độ trân trọng thiên nhiên của bản thân."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nhận định nào sau đây KHÔNG đúng về hồi kí?", "options": ["A. Hồi kí có thể hư cấu nhân vật, sự kiện một cách tùy ý", "B. Hồi kí ghi lại chuyện có thật của tác giả", "C. Hồi kí thường kể ở ngôi thứ nhất", "D. Hồi kí giàu cảm xúc cá nhân của người viết"], "answer": "A", "explain": "Hồi kí coi trọng tính chân thực; tác giả không thể hư cấu tùy ý như truyện hư cấu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Văn bản \"Lao xao ngày hè\" thuộc thể loại nào?", "options": ["A. Truyện ngắn", "B. Hồi kí", "C. Truyền thuyết", "D. Kịch"], "answer": "B", "explain": "\"Lao xao ngày hè\" là bài hồi kí trích từ \"Tuổi thơ im lặng\" của Duy Khán.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong \"Thương nhớ bầy ong\", bầy ong được tác giả coi như thế nào?", "options": ["A. Một nguồn mật để bán lấy tiền", "B. Con vật gây hại cho vườn", "C. Những người bạn gắn bó thân thiết", "D. Vật nuôi để trông giữ nhà"], "answer": "C", "explain": "Cậu bé gắn bó với bầy ong như với những người bạn, nâng niu, chờ đợi và thương nhớ khi chúng bỏ đi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao chi tiết \"đánh thức trầu\" được coi là chi tiết nghệ thuật đặc sắc của truyện?", "options": ["A. Vì chi tiết hoàn toàn là bịa đặt, li kì", "B. Vì cây trầu trong truyện biết nói tiếng người", "C. Vì nó tạo tình huống hài hước gây cười", "D. Vì nó thể hiện một cách hồn nhiên, cảm động tình yêu thương và nỗi nhớ ông của em bé"], "answer": "D", "explain": "Hành động gọi trầu dậy, trò chuyện với trầu bộc lộ tình ông cháu sâu nặng qua điểm nhìn trẻ thơ trong sáng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây dùng dấu ngoặc kép ĐÚNG?", "options": ["A. Em bé nói: \"Trầu ơi, dậy đi nào!\"", "B. Em bé nói: Trầu ơi dậy đi!", "C. \"Em bé rất yêu\" giàn trầu của ông.", "D. Mẹ bảo em phải \"chăm ngoan\" học giỏi."], "answer": "A", "explain": "Lời nói trực tiếp phải được đặt trong dấu ngoặc kép, sau dấu hai chấm, viết hoa chữ đầu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ nào dưới đây chứa yếu tố \"thủy\" với nghĩa là nước?", "options": ["A. Hỏa hoạn", "B. Thủy điện", "C. Sơn lâm", "D. Thiên lí"], "answer": "B", "explain": "\"Thủy\" nghĩa là nước: thủy điện là điện tạo ra từ sức nước; \"hỏa\" là lửa, \"sơn\" là núi, \"thiên\" là trời.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hồi kí là một thể của kí.", "b) Trong hồi kí, tác giả không được bộc lộ cảm xúc cá nhân.", "c) \"Thương nhớ bầy ong\" gắn với quê hương Hà Tĩnh của Huy Cận.", "d) \"Đánh thức trầu\" là một bài thơ của Trần Đăng Khoa."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: hồi kí giàu cảm xúc, suy ngẫm cá nhân. c) Đúng. d) Sai: \"Đánh thức trầu\" là truyện ngắn (văn xuôi).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) \"Lao xao\" là từ gợi tả những âm thanh nhỏ, râm ran xen lẫn nhau.", "b) Dấu ngoặc kép chỉ dùng để dẫn lời nói trực tiếp, ngoài ra không dùng cho việc gì khác.", "c) Em bé trong \"Đánh thức trầu\" chăm trầu thay ông vì yêu thương và nhớ ông.", "d) Yếu tố \"nhân\" trong \"nhân dân\" có nghĩa là \"trời\"."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: dấu ngoặc kép còn đánh dấu từ có ý nghĩa đặc biệt, tên tác phẩm... c) Đúng. d) Sai: \"nhân\" nghĩa là người; \"thiên\" mới là trời.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu tả một âm thanh của quê hương mà em nhớ nhất (tiếng ve, tiếng gà gáy, tiếng mưa trên mái nhà...).", "points": 0, "explain": "Gợi ý chấm: chọn một âm thanh tiêu biểu; miêu tả âm thanh (to nhỏ, nhịp điệu, thời điểm xuất hiện) bằng từ ngữ gợi tả; gắn âm thanh với kỉ niệm, cảm xúc của em; kết đoạn nêu tình cảm với quê hương."}, {"type": "essay", "level": "VDC", "q": "Qua bài học \"Những nẻo đường xứ sở\", em rút ra được điều gì về cách trân trọng kỉ niệm tuổi thơ? Viết đoạn văn khoảng 5-7 câu trình bày suy nghĩ của em.", "points": 0, "explain": "Gợi ý chấm: nêu được giá trị của kỉ niệm tuổi thơ (hình thành tình yêu quê hương, là hành trang tinh thần); cách trân trọng (ghi nhớ, kể lại, giữ gìn những điều bình dị quanh mình); liên hệ bản thân cụ thể, thuyết phục."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Hồi kí khác nhật kí chủ yếu ở điểm nào?", "options": ["A. Hồi kí toàn là chuyện bịa đặt", "B. Nhật kí bao giờ cũng kể ở ngôi thứ ba", "C. Hồi kí viết về quá khứ khi nhìn lại, có chọn lọc và suy ngẫm; nhật kí ghi lại sự việc ngay trong ngày", "D. Hồi kí và nhật kí không có điểm gì khác nhau"], "answer": "C", "explain": "Điểm khác cốt lõi là độ lùi thời gian: hồi kí nhớ lại quá khứ, nhật kí ghi chép hiện tại từng ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Huy Cận — tác giả \"Thương nhớ bầy ong\" — quê ở tỉnh nào?", "options": ["A. Quảng Ngãi", "B. Bắc Ninh", "C. Nghệ An", "D. Hà Tĩnh"], "answer": "D", "explain": "Huy Cận quê ở Hương Sơn, Hà Tĩnh — vùng đất gắn với kỉ niệm bầy ong trong tùy bút.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong nhan đề \"Lao xao ngày hè\", từ \"lao xao\" chủ yếu gợi tả điều gì?", "options": ["A. Âm thanh", "B. Màu sắc", "C. Mùi vị", "D. Hình khối"], "answer": "A", "explain": "\"Lao xao\" là từ gợi tả âm thanh râm ran của gió, lá, ve, chim... trong ngày hè.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tình cảm chủ đạo được thể hiện trong \"Thương nhớ bầy ong\" là gì?", "options": ["A. Nỗi sợ hãi thiên nhiên hoang dã", "B. Tình yêu thiên nhiên, nỗi nhớ quê hương và tuổi thơ", "C. Niềm vui của người chiến thắng", "D. Sự tiếc nuối của cải bị mất"], "answer": "B", "explain": "Văn bản thể hiện tình yêu thiên nhiên tha thiết và nỗi nhớ quê, nhớ tuổi thơ của tác giả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao em bé trong \"Đánh thức trầu\" lại trò chuyện với cây trầu mỗi buổi sáng?", "options": ["A. Vì cây trầu biết trả lời em", "B. Vì em muốn hái trầu đem bán", "C. Vì em coi giàn trầu như người thân, gắn với hình bóng của người ông", "D. Vì em sợ ở nhà một mình"], "answer": "C", "explain": "Giàn trầu là kỉ vật của ông; chăm trầu, nói chuyện với trầu là cách em bé thể hiện nỗi nhớ và tình yêu thương ông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dựa vào yếu tố Hán Việt, từ \"cố hương\" được hiểu là gì?", "options": ["A. Quê của bạn bè", "B. Một vùng đất mới lạ", "C. Đất nước của người khác", "D. Quê hương xưa, nơi sinh ra và lớn lên của mình"], "answer": "D", "explain": "\"Cố\" nghĩa là cũ, xưa; \"hương\" là làng quê — \"cố hương\" là quê hương cũ, nơi chôn nhau cắt rốn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Duy Khán viết nhiều trang hồi kí cảm động về tuổi thơ ở làng quê Bắc Bộ.", "b) \"Tuổi thơ im lặng\" là tập thơ của Trần Đăng Khoa.", "c) Trong hồi kí, hiện tại và quá khứ thường đan xen trong dòng kể.", "d) Hồi kí không cần chi tiết chân thực, chỉ cần có cảm xúc."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: \"Tuổi thơ im lặng\" là tập hồi kí của Duy Khán; tập thơ của Trần Đăng Khoa là \"Góc sân và khoảng trời\". c) Đúng. d) Sai: hồi kí coi trọng chi tiết chân thực.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tiếng Việt:", "statements": ["a) Trước dấu ngoặc kép mở khi dẫn lời trực tiếp thường có dấu hai chấm.", "b) \"Sơn thủy hữu tình\" là cụm từ tả cảnh núi sông đẹp, nên thơ.", "c) Từ \"xứ sở\" có nghĩa gần với \"quê hương, vùng đất\".", "d) Trong \"Đánh thức trầu\", em bé phá bỏ giàn trầu khi ông đi xa."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: em bé thay ông chăm sóc giàn trầu rất chu đáo.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu giới thiệu một vùng đất (quê hương em hoặc nơi em từng đến) mà em yêu thích.", "points": 0, "explain": "Gợi ý chấm: giới thiệu được vị trí, cảnh vật tiêu biểu, con người hoặc món ăn, phong tục đặc trưng; trình bày theo trình tự hợp lí; kết đoạn bộc lộ tình cảm với vùng đất ấy."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu suy nghĩ của em về ý nghĩa của những kỉ niệm tuổi thơ đối với mỗi con người.", "points": 0, "explain": "Gợi ý chấm: nêu được ý nghĩa (nuôi dưỡng tình yêu quê hương, gia đình; là điểm tựa tinh thần khi trưởng thành); dẫn chứng từ các văn bản đã học hoặc từ trải nghiệm bản thân; kết đoạn khẳng định thái độ trân trọng kỉ niệm."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Văn bản \"Thương nhớ bầy ong\" thuộc thể loại nào?", "options": ["A. Tùy bút giàu chất hồi kí", "B. Truyện cổ tích", "C. Truyền thuyết", "D. Kịch"], "answer": "A", "explain": "\"Thương nhớ bầy ong\" là tùy bút của Huy Cận, ghi lại kỉ niệm tuổi thơ một cách trữ tình, giàu cảm xúc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong \"Đánh thức trầu\", em bé thay ông chăm sóc vật gì?", "options": ["A. Cây cau sau nhà", "B. Giàn trầu trước nhà", "C. Bụi tre đầu ngõ", "D. Cây bưởi trong vườn"], "answer": "B", "explain": "Hình ảnh trung tâm của truyện là giàn trầu — kỉ vật gắn với người ông mà em bé thay ông chăm sóc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "\"Lao xao ngày hè\" được trích từ tập hồi kí nào?", "options": ["A. \"Góc sân và khoảng trời\"", "B. \"Hà Nội băm sáu phố phường\"", "C. \"Tuổi thơ im lặng\"", "D. \"Dế Mèn phiêu lưu kí\""], "answer": "C", "explain": "Bài văn trích từ tập hồi kí nổi tiếng \"Tuổi thơ im lặng\" của Duy Khán.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung nổi bật của ba văn bản trong Bài 5 là gì?", "options": ["A. Đều là truyện cổ tích dân gian", "B. Đều kể về những người anh hùng cứu nước", "C. Đều viết về đề tài chiến tranh", "D. Đều gắn với kỉ niệm về quê hương, tuổi thơ và tình cảm chân thành của người viết"], "answer": "D", "explain": "Cả ba văn bản đều viết về quê hương, tuổi thơ với tình cảm chân thành, sâu lắng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu 'Bài kí \"Cô Tô\" của Nguyễn Tuân rất nổi tiếng.', dấu ngoặc kép được dùng để làm gì?", "options": ["A. Đánh dấu tên tác phẩm được nhắc tới", "B. Đánh dấu lời nói của nhân vật", "C. Mỉa mai tác phẩm", "D. Ngăn cách hai vế câu"], "answer": "A", "explain": "Dấu ngoặc kép ở đây đánh dấu tên tác phẩm \"Cô Tô\" được nhắc tới trong câu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong từ \"thiên nhiên\", yếu tố \"thiên\" có nghĩa là gì?", "options": ["A. Đất", "B. Trời", "C. Người", "D. Nước"], "answer": "B", "explain": "\"Thiên\" là yếu tố Hán Việt nghĩa là trời; \"thiên nhiên\" chỉ thế giới tự nhiên quanh ta.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) \"Đánh thức trầu\" ca ngợi tình cảm ông cháu thắm thiết.", "b) Trần Đăng Khoa được bạn đọc biết đến từ khi còn rất nhỏ với những bài thơ thiếu nhi.", "c) Hồi kí chỉ kể chuyện của người khác, không kể chuyện của chính tác giả.", "d) Huy Cận là tác giả của \"Lao xao ngày hè\"."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng. c) Sai: hồi kí kể chuyện của chính tác giả. d) Sai: \"Lao xao ngày hè\" là của Duy Khán.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dấu ngoặc kép luôn đi thành cặp: dấu mở và dấu đóng.", "b) \"Quê hương\" và \"cố hương\" có cùng yếu tố \"hương\" với nghĩa là làng quê.", "c) Trong \"Thương nhớ bầy ong\", cậu bé nuôi ong chủ yếu để bán mật lấy tiền.", "d) Từ láy \"lao xao\" là từ gợi tả âm thanh."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cậu bé nuôi ong vì yêu thích, gắn bó, không phải vì mục đích buôn bán. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại một buổi sáng ở quê em (hoặc nơi em ở) với những âm thanh quen thuộc.", "points": 0, "explain": "Gợi ý chấm: mở đoạn ấn định thời gian, không gian; miêu tả các âm thanh theo trình tự (gà gáy, chim hót, tiếng người lao động...) bằng từ ngữ gợi tả như lao xao, ríu rít, xào xạc; kết đoạn nêu cảm xúc của em."}, {"type": "essay", "level": "VDC", "q": "Nếu phải chăm sóc một cây trồng hay con vật thay người thân đi xa, em sẽ làm gì và cảm thấy thế nào? Viết đoạn văn khoảng 5-7 câu chia sẻ suy nghĩ của em.", "points": 0, "explain": "Gợi ý chấm: nêu việc em sẽ làm (chăm sóc chu đáo, đều đặn); bộc lộ cảm xúc (nhớ người thân, vui khi thấy cây/con vật lớn lên); liên hệ với hình ảnh em bé trong \"Đánh thức trầu\"; kết đoạn khẳng định bài học về tình yêu thương, trách nhiệm."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Đặc điểm nào sau đây là của hồi kí?", "options": ["A. Nhân vật chính thường là thần thánh, tiên phật", "B. Luôn có yếu tố kì ảo, phép thuật", "C. Gắn với những kỉ niệm trong quá khứ của chính tác giả", "D. Kết thúc bao giờ cũng có hậu như cổ tích"], "answer": "C", "explain": "Hồi kí ghi lại chuyện đã qua của bản thân tác giả — đó là đặc điểm cốt lõi của thể loại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trần Đăng Khoa — tác giả \"Đánh thức trầu\" — nổi tiếng từ nhỏ ở lĩnh vực nào?", "options": ["A. Hội họa", "B. Âm nhạc", "C. Thể thao", "D. Thơ ca, được mệnh danh là \"thần đồng thi ca\""], "answer": "D", "explain": "Trần Đăng Khoa làm thơ hay từ khi còn rất nhỏ, được gọi là \"thần đồng thi ca\" với tập \"Góc sân và khoảng trời\".", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Huy Cận được biết đến trước hết là một tác giả thuộc lĩnh vực nào?", "options": ["A. Thơ", "B. Kịch", "C. Truyện trinh thám", "D. Phê bình văn học"], "answer": "A", "explain": "Huy Cận là nhà thơ lớn của Việt Nam hiện đại; ông cũng viết tùy bút, hồi kí trữ tình như \"Thương nhớ bầy ong\".", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong \"Lao xao ngày hè\", ngày hè quê hương được tác giả cảm nhận rõ nhất qua giác quan nào?", "options": ["A. Thị giác — những màu sắc rực rỡ", "B. Thính giác — những âm thanh lao xao của thiên nhiên và cuộc sống", "C. Khứu giác — mùi hương đồng nội", "D. Vị giác — vị ngọt của trái cây"], "answer": "B", "explain": "Nhan đề \"lao xao\" và các chi tiết trong bài đều tập trung gợi tả âm thanh của ngày hè làng quê.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây dùng dấu ngoặc kép để đánh dấu từ ngữ có Ý NGHĨA ĐẶC BIỆT?", "options": ["A. Mẹ dặn: \"Con nhớ tưới nước cho trầu nhé!\"", "B. Ông hỏi: \"Cháu đã ăn cơm chưa?\"", "C. Anh ta tự xưng là \"người hùng\" của cả xóm.", "D. Cô giáo nói: \"Các em mở sách ra nào.\""], "answer": "C", "explain": "\"Người hùng\" ở đây được dùng với ý nghĩa đặc biệt (hàm ý châm biếm), khác với các câu còn lại đều là dẫn lời trực tiếp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Yếu tố \"sơn\" (núi) xuất hiện trong từ nào sau đây?", "options": ["A. Thủy triều", "B. Thiên đường", "C. Nhân dân", "D. Sơn hà"], "answer": "D", "explain": "\"Sơn hà\" gồm \"sơn\" (núi) và \"hà\" (sông) — chỉ đất nước; các từ còn lại chứa thủy, thiên, nhân.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hồi kí thường kết hợp các phương thức kể, miêu tả và biểu cảm.", "b) \"Thương nhớ bầy ong\" thể hiện tình yêu thiên nhiên của tác giả.", "c) Em bé trong \"Đánh thức trầu\" là cháu của người ông có giàn trầu.", "d) \"Lao xao ngày hè\" là truyện ngắn của Trần Đăng Khoa."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: \"Lao xao ngày hè\" là hồi kí của Duy Khán.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tiếng Việt:", "statements": ["a) Khi đoán nghĩa của từ Hán Việt, ta có thể dựa vào nghĩa của từng yếu tố cấu tạo nên từ.", "b) \"Tha hương\" có nghĩa là sống ngay tại quê nhà của mình.", "c) Dấu ngoặc kép trong \"ông cụ non\" được dùng với sắc thái hài hước, đặc biệt.", "d) Hồi kí và tùy bút đều là những thể loại không bao giờ chứa sự việc có thật."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: \"tha hương\" là quê người, nơi đất khách quê người. c) Đúng. d) Sai: hồi kí, tùy bút đều bắt nguồn từ sự thật đời sống của tác giả.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu cảm nhận của em về hình ảnh bầy ong trong \"Thương nhớ bầy ong\".", "points": 0, "explain": "Gợi ý chấm: miêu tả/nêu được hình ảnh bầy ong gần gũi, được nhân hóa như người bạn; phân tích tình cảm của cậu bé với bầy ong (yêu thích, nâng niu, thương nhớ); kết đoạn rút ra cảm nhận về tình yêu thiên nhiên của tác giả và của bản thân."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu về một người thân mà em yêu quý, gắn với một kỉ vật hoặc một vật nuôi, cây trồng mà người ấy để lại cho em chăm sóc.", "points": 0, "explain": "Gợi ý chấm: giới thiệu người thân và kỉ vật/vật nuôi/cây trồng; kể hoặc tả vài chi tiết thể hiện sự gắn bó; bộc lộ tình cảm, nỗi nhớ; kết đoạn khẳng định ý nghĩa của kỉ vật đối với em."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Ngôi kể thường gặp nhất trong hồi kí là ngôi nào?", "options": ["A. Ngôi thứ nhất", "B. Ngôi thứ hai", "C. Ngôi thứ ba", "D. Không có ngôi kể"], "answer": "A", "explain": "Hồi kí do tác giả tự kể chuyện đời mình nên dùng ngôi thứ nhất, xưng \"tôi\".", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "\"Thương nhớ bầy ong\" gợi lại kỉ niệm tuổi thơ của tác giả ở đâu?", "options": ["A. Một thành phố lớn", "B. Quê nhà — miền quê Hương Sơn, Hà Tĩnh", "C. Một làng chài ven biển", "D. Trong sân trường"], "answer": "B", "explain": "Tùy bút gợi kỉ niệm tuổi thơ của Huy Cận ở quê nhà Hương Sơn (Hà Tĩnh).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét theo cấu tạo từ, \"lao xao\" thuộc loại từ nào?", "options": ["A. Từ ghép", "B. Từ Hán Việt", "C. Từ láy", "D. Từ đơn"], "answer": "C", "explain": "\"Lao xao\" là từ láy (láy âm đầu) gợi tả âm thanh râm ran.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Qua truyện \"Đánh thức trầu\", tác giả muốn gửi gắm điều gì?", "options": ["A. Khuyên mọi người nên trồng nhiều trầu để bán", "B. Trẻ em nên ở nhà trông nhà thay người lớn", "C. Cây trầu là loài cây quý hiếm cần được bảo tồn", "D. Tình yêu thương bắt đầu từ việc biết chăm chút những điều bình dị quanh mình"], "answer": "D", "explain": "Truyện ca ngợi tình ông cháu và dạy ta yêu thương, chăm sóc những điều nhỏ bé, thân thuộc trong cuộc sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây trình bày lời dẫn trực tiếp ĐÚNG quy cách?", "options": ["A. Ông cười và nói: \"Cháu của ông ngoan lắm!\"", "B. Ông nói rằng: cháu ngoan lắm.", "C. Ông nói \"cháu ngoan lắm!", "D. Ông nói: cháu \"ngoan lắm\"."], "answer": "A", "explain": "Lời dẫn trực tiếp: có dấu hai chấm báo trước, lời nói đặt trong dấu ngoặc kép và viết hoa chữ đầu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ nào dưới đây KHÔNG chứa yếu tố Hán Việt?", "options": ["A. Tổ quốc", "B. Bầy ong", "C. Quê hương", "D. Thiên nhiên"], "answer": "B", "explain": "\"Bầy ong\" là từ thuần Việt; \"tổ quốc\", \"quê hương\", \"thiên nhiên\" đều chứa yếu tố Hán Việt.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Duy Khán và Huy Cận đều viết về quê hương, tuổi thơ trong Bài 5.", "b) \"Đánh thức trầu\" là hồi kí của Trần Đăng Khoa viết về ông của mình.", "c) Dấu ngoặc kép có thể dùng để đánh dấu tên tác phẩm được nhắc tới.", "d) Yếu tố \"thủy\" trong \"thủy triều\" có nghĩa là \"núi\"."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: \"Đánh thức trầu\" là truyện ngắn. c) Đúng. d) Sai: \"thủy\" nghĩa là nước; \"sơn\" mới là núi.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hồi kí có độ lùi thời gian: người viết nhớ lại quá khứ từ điểm nhìn của hiện tại.", "b) Mọi văn bản kể ở ngôi thứ nhất đều là hồi kí.", "c) Tình cảm trong \"Thương nhớ bầy ong\" là tình yêu thiên nhiên và nỗi nhớ quê hương.", "d) \"Lao xao ngày hè\" chủ yếu miêu tả cảnh thành phố trong ngày hè."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: truyện ngắn, tiểu thuyết cũng có thể kể ngôi thứ nhất. c) Đúng. d) Sai: bài viết về ngày hè ở làng quê.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu tả lại một ngày hè ở quê em (hoặc nơi em ở) với những âm thanh đặc trưng.", "points": 0, "explain": "Gợi ý chấm: tả được quang cảnh ngày hè và các âm thanh tiêu biểu (ve kêu, gió qua vườn, tiếng chim, tiếng người...) bằng từ ngữ gợi tả; có cảm xúc của người viết; trình tự hợp lí, kết đoạn nêu tình cảm với quê hương."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu bày tỏ tình cảm của em đối với một kỉ niệm tuổi thơ mà em không thể nào quên.", "points": 0, "explain": "Gợi ý chấm: giới thiệu kỉ niệm; kể/tả vài chi tiết đáng nhớ nhất; bộc lộ cảm xúc chân thành (vui, buồn, nhớ thương); kết đoạn nêu ý nghĩa của kỉ niệm đối với em hôm nay."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong Bài 5, văn bản nào là truyện ngắn?", "options": ["A. \"Lao xao ngày hè\"", "B. \"Thương nhớ bầy ong\"", "C. \"Đánh thức trầu\"", "D. Cả ba văn bản đều là truyện ngắn"], "answer": "C", "explain": "\"Đánh thức trầu\" của Trần Đăng Khoa là truyện ngắn; hai văn bản còn lại là hồi kí và tùy bút.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tập hồi kí nổi tiếng của Duy Khán có tên là gì?", "options": ["A. \"Tuổi thơ dữ dội\"", "B. \"Góc sân và khoảng trời\"", "C. \"Bên dòng sông Đà\"", "D. \"Tuổi thơ im lặng\""], "answer": "D", "explain": "\"Tuổi thơ im lặng\" là tập hồi kí nổi tiếng của Duy Khán về tuổi thơ làng quê Bắc Bộ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân vật trung tâm trong truyện \"Đánh thức trầu\" là ai?", "options": ["A. Em bé", "B. Người ông", "C. Người cha", "D. Bà cụ hàng xóm"], "answer": "A", "explain": "Câu chuyện xoay quanh em bé với hành động chăm sóc giàn trầu, \"đánh thức\" trầu thay ông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nỗi buồn của cậu bé khi bầy ong bỏ đi trong \"Thương nhớ bầy ong\" cho thấy điều gì?", "options": ["A. Cậu bé rất sợ loài ong", "B. Sự gắn bó sâu sắc của cậu bé với bầy ong, coi chúng như bạn thân, người thân", "C. Cậu bé tiếc số tiền đã bỏ ra mua ong", "D. Cậu bé giận cha mẹ vì không giữ ong lại"], "answer": "B", "explain": "Nỗi buồn mất mát đầu đời ấy chứng tỏ tình cảm gắn bó, yêu thương thiên nhiên của cậu bé.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu 'Tác phẩm \"Tuổi thơ im lặng\" của Duy Khán được nhiều thế hệ yêu thích.', dấu ngoặc kép có tác dụng gì?", "options": ["A. Dẫn lời nói của nhân vật", "B. Mỉa mai tác phẩm", "C. Đánh dấu tên tác phẩm được nhắc tới", "D. Báo hiệu phần liệt kê"], "answer": "C", "explain": "Dấu ngoặc kép đánh dấu nhan đề tác phẩm \"Tuổi thơ im lặng\" được nhắc trong câu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ \"sơn thủy\" được hiểu như thế nào?", "options": ["A. Bầu trời và mặt đất", "B. Con người và xã hội", "C. Hoa cỏ và cây cối", "D. Núi và sông nước — cảnh thiên nhiên"], "answer": "D", "explain": "\"Sơn\" là núi, \"thủy\" là nước; \"sơn thủy\" chỉ cảnh núi sông, thiên nhiên nói chung.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trần Đăng Khoa quê ở Hải Dương và gắn bó sâu nặng với quê hương.", "b) \"Thương nhớ bầy ong\" là tác phẩm của Duy Khán.", "c) \"Lao xao ngày hè\" giàu từ ngữ gợi tả âm thanh.", "d) Dấu ngoặc kép mở có thể đứng một mình mà không cần dấu ngoặc kép đóng."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: đó là tác phẩm của Huy Cận. c) Đúng. d) Sai: dấu ngoặc kép phải đi thành cặp mở — đóng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) \"Quê hương\" là từ có chứa yếu tố Hán Việt \"hương\".", "b) Từ \"lao xao\" là từ ghép tổng hợp.", "c) Trong \"Đánh thức trầu\", giàn trầu gắn liền với tình cảm ông cháu.", "d) Hồi kí tuyệt đối không được sử dụng biện pháp miêu tả."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: \"lao xao\" là từ láy. c) Đúng. d) Sai: hồi kí kết hợp kể với miêu tả và biểu cảm.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể về một lần em chăm sóc cây cối hoặc con vật và điều em cảm nhận được qua việc làm đó.", "points": 0, "explain": "Gợi ý chấm: kể rõ việc chăm sóc (làm gì, trong hoàn cảnh nào); nêu cảm nhận (vui, gắn bó, biết yêu thương, có trách nhiệm); có thể liên hệ với em bé trong \"Đánh thức trầu\"; kết đoạn rút ra bài học."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu phân tích ý nghĩa nhan đề \"Thương nhớ bầy ong\" của Huy Cận.", "points": 0, "explain": "Gợi ý chấm: giải thích \"thương nhớ\" là tình cảm yêu thương, luyến tiếc hướng về bầy ong đã gắn bó tuổi thơ; nhan đề gợi giọng điệu trữ tình của toàn bài và tình yêu thiên nhiên, quê hương của tác giả; nêu cảm nhận của em."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hồi kí thuộc nhóm thể loại nào?", "options": ["A. Kí", "B. Thơ", "C. Kịch", "D. Truyện cười"], "answer": "A", "explain": "Hồi kí là một thể của kí — nhóm văn bản ghi chép sự thật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "\"Lao xao ngày hè\" gợi lại không khí ngày hè ở đâu?", "options": ["A. Phố phường đông đúc", "B. Làng quê yên bình", "C. Một bến cảng biển", "D. Trong sân trường học"], "answer": "B", "explain": "Bài hồi kí gợi không khí ngày hè ở làng quê Bắc Bộ với vườn cây, ao làng và những âm thanh lao xao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong \"Thương nhớ bầy ong\", cậu bé đặc biệt say mê với việc gì?", "options": ["A. Nuôi chim cảnh", "B. Đi câu cá", "C. Nuôi ong, say mê ngắm bầy ong", "D. Thả diều"], "answer": "C", "explain": "Cậu bé say mê nuôi ong: ngắm ong đi về, chăm sóc tổ ong và thương nhớ khi bầy ong bỏ đi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao hồi kí thường gợi được cảm xúc mạnh ở người đọc?", "options": ["A. Vì cốt truyện toàn những chuyện li kì, giật gân", "B. Vì hồi kí thường rất ngắn gọn", "C. Vì hồi kí có nhiều yếu tố kì ảo, phép thuật", "D. Vì chi tiết chân thực và tình cảm chân thành của người viết khi nhớ lại"], "answer": "D", "explain": "Sức hấp dẫn của hồi kí nằm ở sự chân thực của kỉ niệm và cảm xúc chân thành của tác giả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trường hợp nào dưới đây KHÔNG cần dùng dấu ngoặc kép?", "options": ["A. Kết thúc một câu kể thông thường", "B. Đánh dấu lời nói trực tiếp của nhân vật", "C. Đánh dấu tên tác phẩm được nhắc tới trong câu", "D. Đánh dấu từ ngữ được dùng với ý nghĩa đặc biệt"], "answer": "A", "explain": "Câu kể thông thường kết thúc bằng dấu chấm, không dùng dấu ngoặc kép; ba trường hợp còn lại đều là công dụng của dấu ngoặc kép.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Yếu tố Hán Việt \"quốc\" có nghĩa là gì?", "options": ["A. Làng quê", "B. Đất nước", "C. Con người", "D. Bầu trời"], "answer": "B", "explain": "\"Quốc\" nghĩa là nước (đất nước): tổ quốc, quốc gia, quốc ca...", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chủ đề xuyên suốt của Bài 5 là kỉ niệm về quê hương, xứ sở và tuổi thơ.", "b) Cả ba văn bản trong Bài 5 đều là hồi kí.", "c) \"Đánh thức trầu\" thể hiện tình cảm gia đình thắm thiết.", "d) Dấu ngoặc kép và dấu ngoặc đơn có công dụng hoàn toàn giống nhau."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: bài gồm hồi kí, tùy bút và truyện ngắn. c) Đúng. d) Sai: dấu ngoặc đơn dùng để chú thích, bổ sung; dấu ngoặc kép có các công dụng riêng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) \"Cố hương\" có nghĩa là quê hương cũ, nơi mình sinh ra.", "b) Trong \"Thương nhớ bầy ong\", bầy ong bỏ đi khiến cậu bé rất vui mừng.", "c) Từ \"lao xao\" có thể dùng để tả tiếng gió, tiếng lá, tiếng nói râm ran.", "d) Ngôi kể thứ nhất không bao giờ xuất hiện trong hồi kí."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: cậu bé rất buồn và thương nhớ bầy ong. c) Đúng. d) Sai: hồi kí thường kể ở ngôi thứ nhất.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu ghi lại cảm xúc của em mỗi khi xa quê (hoặc khi trở về quê) trong một dịp nào đó.", "points": 0, "explain": "Gợi ý chấm: nêu hoàn cảnh xa quê/trở về; miêu tả cảnh vật, con người gợi cảm xúc; bộc lộ tình cảm nhớ nhung, bồi hồi chân thành; kết đoạn khẳng định tình yêu quê hương."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu bài học em rút ra từ truyện \"Đánh thức trầu\" về tình cảm gia đình.", "points": 0, "explain": "Gợi ý chấm: tóm được chi tiết tiêu biểu (em bé chăm trầu thay ông); rút ra bài học (yêu thương, quan tâm người thân bằng việc làm cụ thể; trân trọng những điều bình dị); liên hệ bản thân thuyết phục."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Điều gì làm nên sức hấp dẫn của một bài hồi kí?", "options": ["A. Cốt truyện li kì như phim hành động", "B. Càng nhiều nhân vật thần thoại càng hay", "C. Chi tiết chân thực và cảm xúc chân thành của người viết", "D. Ngôn ngữ càng khó hiểu càng hay"], "answer": "C", "explain": "Hồi kí hấp dẫn nhờ kỉ niệm có thật được kể lại bằng tình cảm chân thành, sâu lắng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "\"Thương nhớ bầy ong\" của Huy Cận thuộc thể loại nào?", "options": ["A. Truyền thuyết", "B. Truyện ngắn", "C. Thơ lục bát", "D. Tùy bút"], "answer": "D", "explain": "\"Thương nhớ bầy ong\" là tùy bút giàu chất hồi kí, trữ tình của Huy Cận.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hình ảnh trung tâm của truyện \"Đánh thức trầu\" là hình ảnh nào?", "options": ["A. Giàn trầu trước nhà", "B. Con diều giấy", "C. Gốc đa đầu làng", "D. Dòng sông quê"], "answer": "A", "explain": "Giàn trầu là hình ảnh trung tâm, gắn với tình cảm của ông và em bé trong truyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ba văn bản trong Bài 5 đều khơi gợi ở người đọc tình cảm nào?", "options": ["A. Lòng tự hào về những người anh hùng dân tộc", "B. Tình yêu quê hương và sự trân trọng kỉ niệm tuổi thơ", "C. Ham muốn đi phiêu lưu khắp nơi", "D. Nỗi sợ hãi trước thiên nhiên"], "answer": "B", "explain": "Cả ba văn bản đều viết về quê hương, tuổi thơ, khơi gợi tình yêu quê và nỗi nhớ kỉ niệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu 'Đó là những ngày hè \"lao xao\" nhất trong kí ức của tôi.', dấu ngoặc kép đặt quanh từ \"lao xao\" nhằm mục đích gì?", "options": ["A. Dẫn lại lời nói của một người khác", "B. Đánh dấu tên riêng của một người", "C. Nhấn mạnh từ ngữ mang ý nghĩa đặc biệt, gợi nhớ nhan đề văn bản đã học", "D. Báo hiệu câu văn sắp kết thúc"], "answer": "C", "explain": "Từ \"lao xao\" được nhấn mạnh với ý nghĩa đặc biệt (gợi lại nhan đề và không khí ngày hè trong bài hồi kí).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ \"nhân dân\" được tạo thành từ yếu tố \"nhân\" (người) và yếu tố \"dân\" có nghĩa là gì?", "options": ["A. Trời", "B. Đất đai", "C. Núi sông", "D. Người dân"], "answer": "D", "explain": "\"Dân\" nghĩa là người dân; \"nhân dân\" chỉ toàn thể người dân trong một nước.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đọc hồi kí giúp ta hiểu thêm về tác giả và thời đại mà họ đã sống.", "b) \"Lao xao ngày hè\" được kể bằng ngôi thứ ba.", "c) Huy Cận là một nhà thơ lớn của nền thơ Việt Nam hiện đại.", "d) Em bé trong \"Đánh thức trầu\" rất ghét giàn trầu của ông."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: bài hồi kí kể ở ngôi thứ nhất. c) Đúng. d) Sai: em bé yêu quý, chăm sóc giàn trầu rất chu đáo.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tiếng Việt:", "statements": ["a) Yếu tố \"thiên\" trong \"thiên nhiên\" có nghĩa là trời.", "b) Dấu ngoặc kép không bao giờ được dùng để đánh dấu tên tác phẩm.", "c) \"Sơn hà\" là từ Hán Việt chỉ núi sông, đất nước.", "d) Hồi kí là thể loại hư cấu hoàn toàn, không liên quan đến sự thật."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: dấu ngoặc kép có thể đánh dấu tên tác phẩm được nhắc tới. c) Đúng. d) Sai: hồi kí ghi lại chuyện có thật của tác giả.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu giới thiệu với một người bạn ở phương xa về quê hương em (cảnh vật, con người và một kỉ niệm em nhớ nhất).", "points": 0, "explain": "Gợi ý chấm: giới thiệu được cảnh vật, con người quê hương một cách sinh động; kể một kỉ niệm tiêu biểu; giọng văn thân mật, tình cảm chân thành; kết đoạn bộc lộ niềm tự hào về quê hương."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu bày tỏ suy nghĩ của em: Vì sao quê hương và tuổi thơ luôn là hành trang quý giá của mỗi con người?", "points": 0, "explain": "Gợi ý chấm: nêu được lí do (quê hương là nơi sinh ra, nuôi dưỡng tâm hồn; tuổi thơ cho ta kỉ niệm và bài học đầu đời); dẫn chứng từ văn bản đã học hoặc trải nghiệm bản thân; kết đoạn khẳng định thái độ trân trọng, giữ gìn."}]}]}
