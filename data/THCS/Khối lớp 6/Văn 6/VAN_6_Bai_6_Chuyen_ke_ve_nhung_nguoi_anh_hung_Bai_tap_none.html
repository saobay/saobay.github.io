hồ Tả Vọng.", "c) Hồ Gươm còn có tên gọi là hồ Hoàn Kiếm.", "d) Lê Lợi giữ gươm thần làm của riêng suốt đời, không trả lại thần."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: Hoàn Kiếm nghĩa là trả gươm. d) Sai: vua đã trả gươm cho thần Kim Quy.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại cuộc giao tranh giữa Sơn Tinh và Thủy Tinh bằng lời văn của em.", "points": 0, "explain": "Gợi ý chấm: kể đúng trình tự (Thủy Tinh dâng nước — Sơn Tinh dời núi cao lên — Thủy Tinh thua, rút nước); có chi tiết kì ảo tiêu biểu; lời văn sinh động, có thể thêm miêu tả cảnh mưa lũ; kết đoạn nêu ý nghĩa của cuộc giao tranh."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu trình bày suy nghĩ của em về khát vọng hòa bình được thể hiện qua chi tiết Lê Lợi trả gươm thần.", "points": 0, "explain": "Gợi ý chấm: nêu được hoàn cảnh trả gươm (đất nước đã thanh bình); phân tích ý nghĩa (gươm chỉ dùng để chống xâm lược, khi hòa bình thì trả lại thần — khát vọng sống yên bình của nhân dân); liên hệ thực tế thuyết phục."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Ý nào KHÔNG phải là đặc điểm của truyện truyền thuyết?", "options": ["A. Chỉ kể chuyện mua vui, không gắn với lịch sử dân tộc", "B. Kể về nhân vật, sự kiện lịch sử thời quá khứ", "C. Có nhiều yếu tố tưởng tượng, kì ảo", "D. Thể hiện thái độ, tình cảm của nhân dân đối với lịch sử"], "answer": "A", "explain": "Truyền thuyết luôn gắn với nhân vật, sự kiện lịch sử và cách đánh giá của nhân dân — đó là đặc điểm cốt lõi của thể loại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sau khi thắng giặc Ân, Thánh Gióng đã làm gì?", "options": ["A. Ở lại kinh đô làm quan", "B. Cưỡi ngựa sắt bay về trời", "C. Trở về làng sống cùng cha mẹ già", "D. Đi chu du khắp thiên hạ"], "answer": "B", "explain": "Thắng giặc, Gióng cưỡi ngựa lên đỉnh núi rồi bay về trời — kết thúc kì ảo khẳng định sự phi thường của người anh hùng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao Thủy Tinh nổi giận dâng nước đánh Sơn Tinh?", "options": ["A. Vì Sơn Tinh chiếm mất vùng biển của mình", "B. Vì vua Hùng phạt Thủy Tinh tội đến muộn", "C. Vì Thủy Tinh đến cầu hôn sau, không lấy được Mị Nương", "D. Vì Mị Nương chê bai Thủy Tinh"], "answer": "C", "explain": "Thủy Tinh đến sau, Sơn Tinh đã rước Mị Nương về núi, nên Thủy Tinh nổi giận dâng nước đuổi theo đòi cướp lại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết \"lớn nhanh như thổi\" của cậu bé Gióng thể hiện điều gì?", "options": ["A. Sự chăm sóc chu đáo của cha mẹ Gióng", "B. Một hiện tượng sinh học có thật của trẻ em thời xưa", "C. Sự giàu có của gia đình ông lão", "D. Ước mơ của nhân dân về sức mạnh lớn lên thần tốc của dân tộc khi có giặc ngoại xâm"], "answer": "D", "explain": "Chi tiết kì ảo này tượng trưng cho sức mạnh và tinh thần yêu nước lớn nhanh, tập hợp lại khi đất nước lâm nguy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây dùng dấu hai chấm để báo trước phần GIẢI THÍCH?", "options": ["A. Kết quả thật kì lạ: chỉ sau mấy ngày, cậu bé đã lớn thành tráng sĩ.", "B. Gióng yêu cầu nhà vua: ngựa sắt, roi sắt, áo giáp sắt.", "C. Ông lão nói: \"Con hãy ra trận bình an.\"", "D. Hội thi gồm các phần: kể chuyện, thi tài, văn nghệ."], "answer": "A", "explain": "Dấu hai chấm ở đây báo trước lời giải thích cho điều \"kì lạ\" vừa nêu. Các câu còn lại dùng để liệt kê hoặc dẫn lời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phần trong dấu ngoặc đơn có đặc điểm gì?", "options": ["A. Là phần quan trọng nhất, không thể bỏ đi của câu", "B. Là phần chú thích, bổ sung; bỏ đi thì câu vẫn đủ ý chính", "C. Luôn luôn là lời nói của nhân vật", "D. Luôn đứng ở đầu câu"], "answer": "B", "explain": "Phần trong ngoặc đơn chỉ chú thích, giải thích thêm; lược bỏ đi câu vẫn truyền đạt đủ ý chính.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tri thức truyền thuyết:", "statements": ["a) Cốt truyện truyền thuyết thường gắn với cuộc đời và chiến công của người anh hùng.", "b) Truyền thuyết và cổ tích giống hệt nhau, không phân biệt được.", "c) Đền thờ, lễ hội tưởng nhớ người anh hùng thường gắn với các truyền thuyết.", "d) Yếu tố kì ảo làm mất đi hoàn toàn giá trị lịch sử của truyền thuyết."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: truyền thuyết gắn với lịch sử dân tộc, cổ tích kể chuyện đời thường và mơ ước công lí. c) Đúng. d) Sai: yếu tố kì ảo làm nổi bật tình cảm của nhân dân, không xóa đi cốt lõi lịch sử.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) \"Kim Quy\" là tên gọi của thần rùa vàng trong \"Sự tích Hồ Gươm\".", "b) Gươm thần trong truyện gồm lưỡi gươm vớt được dưới nước và chuôi gươm tìm thấy trên cành cây.", "c) Khởi nghĩa Lam Sơn do Nguyễn Trãi lãnh đạo từ đầu đến cuối.", "d) Hồ Gươm nằm ở trung tâm Thăng Long — Hà Nội."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: khởi nghĩa Lam Sơn do Lê Lợi lãnh đạo. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại truyện \"Sự tích Hồ Gươm\" theo trình tự sự việc chính.", "points": 0, "explain": "Gợi ý chấm: kể đủ các sự việc chính (Lê Lợi khởi nghĩa — được mượn gươm thần — thắng giặc Minh — dạo thuyền và trả gươm cho rùa vàng — hồ đổi tên); trình tự rõ ràng; kết đoạn nêu ý nghĩa về khát vọng hòa bình."}, {"type": "essay", "level": "VDC", "q": "Nếu được đặt một câu hỏi phỏng vấn Thánh Gióng sau chiến thắng, em sẽ hỏi gì và vì sao? Viết đoạn văn khoảng 5-7 câu trình bày ý tưởng của em.", "points": 0, "explain": "Gợi ý chấm: nêu được câu hỏi cụ thể, có ý nghĩa (về động lực ra trận, tình yêu quê hương, mong ước sau chiến tranh...); giải thích lí do chọn câu hỏi; bày tỏ tình cảm tôn kính với người anh hùng."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Truyền thuyết \"Thánh Gióng\" ca ngợi người anh hùng trong cuộc chiến chống quân xâm lược nào?", "options": ["A. Quân Minh", "B. Quân Tống", "C. Quân Ân", "D. Quân Nguyên"], "answer": "C", "explain": "Gióng đánh thắng giặc Ân — kẻ thù xâm lược nước ta thời Hùng Vương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sơn Tinh là vị thần cai quản vùng nào?", "options": ["A. Vùng biển khơi", "B. Vùng đồng bằng", "C. Vùng sông nước miền Tây", "D. Vùng núi cao (núi Tản Viên, Ba Vì)"], "answer": "D", "explain": "Sơn Tinh là chúa vùng đất Ba Vì, có phép dời non, dựng núi; đối thủ của ông là Thủy Tinh — chúa vùng nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Con vật nào hiện lên xin lại gươm trong \"Sự tích Hồ Gươm\"?", "options": ["A. Rùa vàng (thần Kim Quy)", "B. Rồng vàng", "C. Cá chép hóa rồng", "D. Phượng hoàng"], "answer": "A", "explain": "Thần Kim Quy — rùa vàng — nổi lên mặt hồ xin lại gươm thần khi đất nước đã thanh bình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói \"Sơn Tinh, Thủy Tinh\" là truyện truyền thuyết mà không phải cổ tích?", "options": ["A. Vì truyện có nhân vật là thần tiên", "B. Vì truyện gắn với thời đại Hùng Vương dựng nước và giải thích một hiện tượng gắn với đời sống dân tộc", "C. Vì truyện có kết thúc buồn", "D. Vì truyện được viết bằng văn xuôi"], "answer": "B", "explain": "Truyền thuyết gắn với nhân vật, sự kiện thuộc lịch sử buổi đầu dựng nước; yếu tố thần tiên chỉ là lớp vỏ kì ảo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu hai chấm trong câu 'Sính lễ vua Hùng yêu cầu thật lạ: voi chín ngà, gà chín cựa, ngựa chín hồng mao.' có công dụng gì?", "options": ["A. Dẫn lời nói trực tiếp", "B. Đánh dấu lời chú thích", "C. Báo trước phần liệt kê, thuyết minh", "D. Kết thúc câu cảm thán"], "answer": "C", "explain": "Dấu hai chấm báo trước phần liệt kê, nói rõ nội dung của \"sính lễ lạ\" vừa nhắc tới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặt dấu ngoặc đơn vào câu 'Gióng quê ở làng Gióng, thuộc vùng đất Phù Đổng ngày nay.' theo cách nào là ĐÚNG?", "options": ["A. Gióng (quê ở làng Gióng), thuộc vùng đất Phù Đổng ngày nay.", "B. Gióng quê ở làng Gióng, thuộc (vùng đất) Phù Đổng ngày nay.", "C. (Gióng quê ở làng Gióng), thuộc vùng đất Phù Đổng ngày nay.", "D. Gióng quê ở làng Gióng (một làng thuộc vùng Phù Đổng ngày nay)."], "answer": "D", "explain": "Phần chú thích về vị trí làng Gióng đặt trong ngoặc đơn ở cuối câu là hợp lí nhất; các cách còn lại đặt ngoặc đơn tùy tiện.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Thánh Gióng\":", "statements": ["a) Trước khi ra trận, Gióng yêu cầu vua sắm ngựa sắt, roi sắt và áo giáp sắt.", "b) Ngựa sắt của Gióng biết phun lửa, hí vang làm giặc khiếp sợ.", "c) Dân làng Gióng ghét bỏ Gióng vì cậu bé ăn khỏe, lớn nhanh.", "d) Những dấu tích về Gióng như bụi tre, ao, đầm vẫn được lưu truyền đến nay."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: nhân dân yêu mến, tự hào về người anh hùng làng mình. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về dấu câu:", "statements": ["a) Sau dấu hai chấm, lời dẫn trực tiếp thường viết hoa và đặt trong ngoặc kép.", "b) Dấu ngoặc đơn phải đi thành cặp: dấu mở và dấu đóng.", "c) Dấu hai chấm có thể thay thế cho mọi dấu phẩy trong câu.", "d) Phần trong dấu ngoặc đơn thường là phần chú thích, bổ sung."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: dấu hai chấm chỉ dùng khi cần báo trước lời dẫn, giải thích, liệt kê. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu tưởng tượng và miêu tả cảnh Thánh Gióng ra trận đánh giặc Ân.", "points": 0, "explain": "Gợi ý chấm: miêu tả được hình ảnh tráng sĩ Gióng trên ngựa sắt, roi sắt, khí thế ra trận; có chi tiết kì ảo tiêu biểu; từ ngữ gợi hình, gợi cảm; thể hiện niềm tự hào về người anh hùng."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu bài học em rút ra từ truyện \"Sơn Tinh, Thủy Tinh\" về mối quan hệ giữa con người và thiên nhiên.", "points": 0, "explain": "Gợi ý chấm: nêu được quá trình con người chống lũ, chế ngự thiên tai từ xưa đến nay; bài học về ý chí, sự chuẩn bị và tôn trọng quy luật thiên nhiên; liên hệ thực tế (trồng rừng, đắp đê, bảo vệ môi trường) thuyết phục."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khi đọc truyền thuyết, yếu tố nào giúp em nhận ra tình cảm của nhân dân dành cho người anh hùng?", "options": ["A. Những chi tiết kì ảo, phi thường hóa nhân vật và việc lập đền thờ, mở hội tưởng nhớ", "B. Số trang của truyện", "C. Tên của người kể chuyện", "D. Thời gian xuất bản truyện"], "answer": "A", "explain": "Nhân dân phi thường hóa người anh hùng và tôn thờ họ qua đền miếu, lễ hội — đó là biểu hiện tình cảm yêu mến, biết ơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vũ khí của Gióng khi roi sắt bị gãy là gì?", "options": ["A. Giáo dài của quân lính", "B. Những bụi tre bên đường được nhổ lên", "C. Gươm thần", "D. Cung tên"], "answer": "B", "explain": "Roi sắt gãy, Gióng nhổ tre làm vũ khí — chi tiết cho thấy tinh thần ứng biến và sức mạnh của người anh hùng gắn với quê hương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Núi nơi Sơn Tinh đưa Mị Nương về ở có tên là gì?", "options": ["A. Núi Hồng Lĩnh", "B. Núi Ngự Bình", "C. Núi Tản Viên", "D. Núi Yên Tử"], "answer": "C", "explain": "Sơn Tinh rước Mị Nương về núi Tản Viên; Thủy Tinh dâng nước đuổi theo, hai bên giao tranh nhiều ngày.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "\"Sự tích Hồ Gươm\" giải thích điều gì?", "options": ["A. Nguồn gốc của thành Thăng Long", "B. Cách chế tạo gươm báu thời xưa", "C. Nguồn gốc họ Lê ở Lam Sơn", "D. Tên gọi của hồ Hoàn Kiếm (Hồ Gươm) ở Hà Nội và đề cao khát vọng hòa bình"], "answer": "D", "explain": "Kết truyện giải thích tên gọi của hồ: vua trả gươm cho thần sau khi đất nước thái bình, hồ mang tên Hồ Gươm / Hoàn Kiếm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây dùng dấu hai chấm để dẫn LỜI NÓI trực tiếp?", "options": ["A. Sứ giả rao: \"Vua cần người tài ra đánh giặc Ân!\"", "B. Mị Nương là con gái vua Hùng: nàng rất xinh đẹp.", "C. Hội Gióng được tổ chức vào các ngày: mùng 8, mùng 9 tháng 4 âm lịch.", "D. Ai cũng biết: Gióng là anh hùng của làng."], "answer": "A", "explain": "Ở câu này, dấu hai chấm báo trước lời rao của sứ giả được trích dẫn trong ngoặc kép.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các câu sau, câu nào phần chú thích trong ngoặc đơn có thể bỏ đi mà câu vẫn đủ ý?", "options": ["A. (Thánh Gióng) là người anh hùng chống giặc Ân.", "B. Lê Lợi (người anh hùng của khởi nghĩa Lam Sơn) đã được thần cho mượn gươm.", "C. Vua Hùng (có) một người con gái đẹp.", "D. Sơn Tinh và (Thủy Tinh) đều đến cầu hôn."], "answer": "B", "explain": "Phần \"(người anh hùng của khởi nghĩa Lam Sơn)\" là chú thích bổ sung cho Lê Lợi, bỏ đi câu vẫn trọn ý.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về các văn bản trong bài:", "statements": ["a) Cả ba truyện đều ca ngợi những con người, sự kiện gắn với lịch sử giữ nước, dựng nước.", "b) \"Sơn Tinh, Thủy Tinh\" hoàn toàn không có chi tiết nào liên quan đến đời sống thật của nhân dân.", "c) Chi tiết rùa vàng đòi lại gươm thể hiện khát vọng hòa bình của nhân dân ta.", "d) Thánh Gióng chiến đấu chống giặc vì muốn được phong quan, hưởng lộc."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: truyện bắt nguồn từ hiện tượng lũ lụt và công cuộc trị thủy có thật của người Việt. c) Đúng. d) Sai: Gióng đánh giặc vì nước, thắng xong bay về trời, không màng danh lợi.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về dấu hai chấm và dấu ngoặc đơn:", "statements": ["a) Dấu hai chấm có thể báo trước phần liệt kê.", "b) Phần trong dấu ngoặc đơn nếu bỏ đi sẽ làm câu mất hẳn ý nghĩa chính.", "c) Lời nói trực tiếp sau dấu hai chấm thường đặt trong dấu ngoặc kép.", "d) Dấu ngoặc đơn dùng để đánh dấu lời nói của nhân vật."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: phần trong ngoặc đơn chỉ là chú thích, bỏ đi câu vẫn đủ ý chính. c) Đúng. d) Sai: lời nói nhân vật đánh dấu bằng dấu ngoặc kép.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại bằng lời văn của em đoạn kết truyện \"Sơn Tinh, Thủy Tinh\" và nêu ý nghĩa của đoạn kết đó.", "points": 0, "explain": "Gợi ý chấm: kể đúng đoạn kết (Thủy Tinh thua nhưng hằng năm vẫn dâng nước; Sơn Tinh lần nào cũng thắng); nêu ý nghĩa (giải thích lũ lụt; khẳng định sức mạnh, ý chí chống thiên tai của nhân dân); lời văn mạch lạc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu giới thiệu về lễ hội Gióng hoặc một lễ hội tưởng nhớ người anh hùng dân tộc mà em biết.", "points": 0, "explain": "Gợi ý chấm: giới thiệu được tên lễ hội, nơi tổ chức, thời gian; vài hoạt động tiêu biểu của lễ hội; ý nghĩa tưởng nhớ, biết ơn người anh hùng; có thể dùng dấu ngoặc đơn để chú thích địa danh, thời gian."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Truyền thuyết thuộc nhóm văn học nào?", "options": ["A. Văn học viết hiện đại", "B. Văn học cung đình", "C. Văn học dân gian", "D. Báo chí"], "answer": "C", "explain": "Truyền thuyết là thể loại của văn học dân gian, do nhân dân sáng tạo và lưu truyền qua nhiều thế hệ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiếng nói đầu tiên của cậu bé Gióng là để làm gì?", "options": ["A. Đòi ăn cơm", "B. Gọi cha mẹ", "C. Xin đồ chơi", "D. Xin được đi đánh giặc cứu nước"], "answer": "D", "explain": "Nghe sứ giả rao tìm người cứu nước, cậu bé ba tuổi bỗng cất tiếng nói, xin vua sắm vũ khí để đi đánh giặc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ai là người đến cầu hôn sau và không lấy được Mị Nương?", "options": ["A. Thủy Tinh", "B. Sơn Tinh", "C. Vua Hùng", "D. Lạc Long Quân"], "answer": "A", "explain": "Thủy Tinh đến sau khi Sơn Tinh đã mang lễ vật tới trước và rước Mị Nương về núi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình tượng Thánh Gióng tượng trưng cho điều gì?", "options": ["A. Sự giàu sang của triều đình phong kiến", "B. Sức mạnh và tinh thần yêu nước, chống giặc ngoại xâm của nhân dân ta", "C. Ước mơ được làm quan của người nông dân", "D. Nỗi sợ hãi của nhân dân trước giặc ngoại xâm"], "answer": "B", "explain": "Gióng lớn lên từ làng quê, đánh giặc vì nước, thắng giặc không màng danh lợi — là biểu tượng của sức mạnh nhân dân và lòng yêu nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dùng dấu hai chấm SAI?", "options": ["A. Vua ra lệnh: \"Hãy tìm người tài cứu nước!\"", "B. Dân làng chuẩn bị nhiều thứ: gạo, muối, vải vóc để tiễn Gióng.", "C. Gióng: là: người: anh hùng của nhân dân.", "D. Một điều lạ đã xảy ra: cậu bé ba tuổi bỗng biết nói."], "answer": "C", "explain": "Câu C lạm dụng dấu hai chấm ở những vị trí không cần báo trước lời dẫn, giải thích hay liệt kê.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi viết \"Hồ Gươm (còn gọi là hồ Hoàn Kiếm) nằm ở trung tâm thủ đô.\", tác giả dùng dấu ngoặc đơn nhằm mục đích gì?", "options": ["A. Nhấn mạnh cảm xúc ngạc nhiên", "B. Dẫn lời của người dân Hà Nội", "C. Báo trước phần liệt kê các hồ nổi tiếng", "D. Bổ sung tên gọi khác của Hồ Gươm"], "answer": "D", "explain": "Phần trong ngoặc đơn bổ sung tên gọi khác (Hoàn Kiếm) cho Hồ Gươm — một chú thích ngắn gọn, hữu ích.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Thánh Gióng\":", "statements": ["a) Gióng sinh ra trong một gia đình nông dân hiền lành, chăm chỉ.", "b) Sứ giả của nhà vua đã tìm đến làng Gióng để xem mặt cậu bé trước khi giao vũ khí.", "c) Đền thờ và lễ hội Gióng thể hiện lòng biết ơn của nhân dân với người anh hùng.", "d) Sau khi Gióng bay về trời, nhân dân quên hẳn công lao của chàng."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: sứ giả rao tìm người tài khắp nơi; Gióng tự cất tiếng xin đi đánh giặc. c) Đúng. d) Sai: nhân dân lập đền thờ và mở hội Gióng tưởng nhớ chàng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) \"Khởi nghĩa\" là từ Hán Việt chỉ việc đứng dậy đấu tranh chống kẻ thống trị.", "b) \"Kim Quy\" là tên gọi của một loài cá trong hồ.", "c) Lê Lợi dựng cờ khởi nghĩa ở Lam Sơn (Thanh Hóa).", "d) Quân Minh là kẻ thù trong truyền thuyết \"Sự tích Hồ Gươm\"."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: Kim Quy là rùa vàng (kim = vàng, quy = rùa). c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Đóng vai một phóng viên nhỏ, viết đoạn văn khoảng 5-7 câu tường thuật lại cảnh dân làng tiễn Thánh Gióng ra trận.", "points": 0, "explain": "Gợi ý chấm: tái hiện được không khí buổi tiễn đưa (dân làng mang gạo, muối; Gióng ăn khỏe, mặc áo giáp sắt, lên ngựa); lời văn giàu hình ảnh, cảm xúc; kết đoạn thể hiện niềm tin và tự hào của nhân dân."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu suy nghĩ của em về truyền thống \"uống nước nhớ nguồn\" qua các truyện truyền thuyết trong Bài 6.", "points": 0, "explain": "Gợi ý chấm: giải thích được truyền thống nhớ ơn người có công (qua đền thờ, lễ hội, câu chuyện được kể lại); dẫn chứng từ ít nhất một truyện trong bài; liên hệ việc làm của học sinh hôm nay (học tốt, tham gia lễ hội, giữ gìn di tích)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Mục đích chính của truyện truyền thuyết là gì?", "options": ["A. Ca ngợi người anh hùng, thể hiện thái độ của nhân dân đối với các sự kiện lịch sử", "B. Chỉ để giải trí, gây cười cho người nghe", "C. Dạy cách làm giàu, buôn bán", "D. Ghi chép nguyên văn biên niên sử của triều đình"], "answer": "A", "explain": "Truyền thuyết là cách nhân dân ghi nhớ và đánh giá lịch sử: ca ngợi anh hùng, bày tỏ lòng biết ơn và tự hào dân tộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vua Hùng phong cho Gióng danh hiệu gì?", "options": ["A. Đông Hải Đại Vương", "B. Phù Đổng Thiên Vương", "C. Nam Hải Tướng Quân", "D. Bắc Bình Vương"], "answer": "B", "explain": "Sau khi Gióng bay về trời, vua phong chàng là Phù Đổng Thiên Vương và cho lập đền thờ ở quê nhà.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điểm khác biệt lớn trong tài năng của Sơn Tinh và Thủy Tinh là gì?", "options": ["A. Sơn Tinh giỏi phép nước, Thủy Tinh giỏi phép núi", "B. Sơn Tinh biết nói tiếng chim, Thủy Tinh biết bay", "C. Sơn Tinh là chúa vùng núi, Thủy Tinh là chúa vùng nước", "D. Cả hai đều có tài năng giống hệt nhau"], "answer": "C", "explain": "Sơn Tinh dời non, dựng núi; Thủy Tinh hô mưa, dâng nước — một bên là núi, một bên là nước, tạo nên cuộc đối đầu của truyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nhân dân lại tưởng tượng ra chi tiết Gióng \"bay về trời\" sau khi thắng giặc?", "options": ["A. Để truyện có kết thúc buồn", "B. Để giải thích hiện tượng mây bay", "C. Vì không biết cho Gióng đi đâu tiếp theo", "D. Để khẳng định người anh hùng thuộc về cõi thiêng, bất tử trong lòng nhân dân"], "answer": "D", "explain": "Kết thúc kì ảo này bất tử hóa người anh hùng: Gióng không chết, chàng về trời và sống mãi trong tâm thức nhân dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu hai chấm trong câu 'Ai nấy đều hiểu một điều: đất nước lâm nguy thì ai cũng phải đứng lên cứu nước.' có công dụng gì?", "options": ["A. Báo trước lời giải thích, thuyết minh cho ý vừa nói", "B. Báo trước lời dẫn trực tiếp", "C. Đánh dấu phần chú thích", "D. Ngăn cách các sự vật được liệt kê"], "answer": "A", "explain": "Phần sau dấu hai chấm giải thích, làm rõ \"một điều\" mà mọi người đều hiểu ở phần trước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây có phần trong dấu ngoặc đơn dùng để CHÚ THÍCH địa danh?", "options": ["A. Mẹ tôi nói (rất khẽ): \"Con nhớ học bài.\"", "B. Hội Gióng (lễ hội lớn của Hà Nội) diễn ra vào tháng 4 âm lịch.", "C. Cậu bé (rất thông minh) ấy là Gióng.", "D. Ông lão (đã ngoài bảy mươi) vẫn chăm chỉ làm ruộng."], "answer": "B", "explain": "Phần \"(lễ hội lớn của Hà Nội)\" chú thích, giới thiệu thêm về hội Gióng; các câu còn lại chú thích về người hoặc cách nói.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Sơn Tinh, Thủy Tinh\":", "statements": ["a) Vua Hùng ra điều kiện: ai mang lễ vật đến trước sẽ được cưới Mị Nương.", "b) Thủy Tinh mang đến những lễ vật lạ hơn nên được vua chọn làm rể.", "c) Khi Thủy Tinh dâng nước cao lên, Sơn Tinh lại làm cho núi cao thêm để ngăn nước.", "d) Truyện cho thấy con người xưa hoàn toàn bất lực trước thiên tai."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: cả hai cùng mang đủ lễ vật, nhưng Sơn Tinh đến trước. c) Đúng. d) Sai: truyện khẳng định ý chí và sức mạnh chống lũ của nhân dân.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tiếng Việt:", "statements": ["a) Dấu ngoặc đơn luôn phải có đủ dấu mở và dấu đóng.", "b) Sau dấu hai chấm dùng để dẫn lời trực tiếp, lời dẫn thường được đặt trong dấu ngoặc kép.", "c) Phần chú thích trong ngoặc đơn có thể viết hoa tùy ý ở giữa câu dù không phải tên riêng.", "d) Dấu hai chấm có công dụng báo trước: lời dẫn, lời giải thích hoặc phần liệt kê."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phần trong ngoặc đơn ở giữa câu thường viết thường, trừ tên riêng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại sự tích một địa danh ở quê em (hoặc một nơi em biết) theo cách kể của truyền thuyết.", "points": 0, "explain": "Gợi ý chấm: kể được sự tích gắn với địa danh (nguồn gốc tên gọi, sự kiện, nhân vật); có thể thêm chi tiết tưởng tượng hợp lí theo phong cách truyền thuyết; kết đoạn nêu tình cảm của em với địa danh ấy."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu bày tỏ suy nghĩ của em về hình ảnh cậu bé Gióng ba tuổi mới cất tiếng nói đầu tiên là xin đi đánh giặc.", "points": 0, "explain": "Gợi ý chấm: phân tích được ý nghĩa chi tiết (tiếng nói đầu tiên dành cho đất nước — lòng yêu nước thiêng liêng, phi thường); cảm xúc khâm phục; liên hệ trách nhiệm của học sinh với đất nước hôm nay."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Truyện nào sau đây thuộc thể loại truyền thuyết?", "options": ["A. \"Thạch Sanh\"", "B. \"Dế Mèn phiêu lưu kí\"", "C. \"Thánh Gióng\"", "D. \"Cô bé bán diêm\""], "answer": "C", "explain": "\"Thánh Gióng\" là truyền thuyết về người anh hùng chống ngoại xâm; \"Thạch Sanh\" là cổ tích, hai tác phẩm còn lại là văn học viết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trước khi cất tiếng nói xin đi đánh giặc, cậu bé Gióng có biểu hiện gì khác thường?", "options": ["A. Biết đọc chữ từ rất sớm", "B. Ăn một bữa hết mười nồi cơm", "C. Biết cưỡi ngựa từ lúc mới sinh", "D. Ba tuổi vẫn không biết nói, biết cười, đặt đâu nằm đó"], "answer": "D", "explain": "Sự \"im lặng\" khác thường ba năm đầu đời làm nổi bật giây phút Gióng cất tiếng nói vì đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo truyện, vì sao năm nào Thủy Tinh cũng dâng nước đánh Sơn Tinh?", "options": ["A. Vì mối oán thù không lấy được Mị Nương vẫn còn, nhưng lần nào Thủy Tinh cũng thua", "B. Vì Thủy Tinh muốn chiếm vùng đồng bằng màu mỡ", "C. Vì Sơn Tinh phá hoại đê điều của Thủy Tinh", "D. Vì đó là lệnh của vua Hùng"], "answer": "A", "explain": "Truyện giải thích: hằng năm Thủy Tinh vẫn dâng nước (mùa lũ) nhưng đều thua Sơn Tinh — nhân dân luôn chống lũ thành công.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đọc \"Sự tích Hồ Gươm\", em hiểu thế nào về hình ảnh thanh gươm thần?", "options": ["A. Là vật báu để nhà vua trưng bày trong cung điện", "B. Là biểu tượng cho sức mạnh chính nghĩa giúp nhân dân đánh thắng kẻ xâm lược", "C. Là món quà thần tặng vua để làm giàu", "D. Là vũ khí chỉ dùng trong các lễ hội"], "answer": "B", "explain": "Gươm thần chỉ xuất hiện khi đất nước có giặc và được trả lại khi thái bình — nó tượng trưng cho sức mạnh chính nghĩa và khát vọng hòa bình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dùng dấu hai chấm để báo trước phần LIỆT KÊ?", "options": ["A. Gióng dặn mẹ: \"Mẹ ở nhà giữ gìn sức khỏe.\"", "B. Mọi người đều tin: Gióng sẽ thắng giặc.", "C. Trên bãi chiến trường còn lại nhiều dấu tích: hố đất, lũy tre, ao nước.", "D. Sơn Tinh có một khả năng lạ: dời được núi cao."], "answer": "C", "explain": "Dấu hai chấm ở đây báo trước các sự vật được liệt kê (hố đất, lũy tre, ao nước).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu 'Lễ hội đền Hùng (ở Phú Thọ) được tổ chức vào ngày giỗ Tổ mùng 10 tháng 3 âm lịch.' — phần trong ngoặc đơn bổ sung thông tin gì?", "options": ["A. Thời gian diễn ra lễ hội", "B. Người tổ chức lễ hội", "C. Ý nghĩa của lễ hội", "D. Địa điểm của đền Hùng"], "answer": "D", "explain": "Phần \"(ở Phú Thọ)\" chú thích địa điểm của đền Hùng — thông tin bổ sung cho danh từ đứng trước.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Truyền thuyết \"Thánh Gióng\" thuộc thời đại Hùng Vương dựng nước.", "b) Gươm thần trong \"Sự tích Hồ Gươm\" chỉ gồm phần chuôi gươm nạm ngọc.", "c) Truyền thuyết thường kết hợp yếu tố lịch sử với yếu tố tưởng tượng kì ảo.", "d) Nhân vật trong truyền thuyết đều là người nông dân bình thường, không có ai là anh hùng."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: gươm gồm lưỡi gươm vớt được dưới nước và chuôi gươm tìm thấy sau đó. c) Đúng. d) Sai: nhân vật trung tâm thường là người anh hùng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Sơn Tinh, Thủy Tinh\":", "statements": ["a) Mị Nương là con gái của vua Hùng thứ mười tám.", "b) Sơn Tinh và Thủy Tinh đều là những chàng trai tài giỏi ngang nhau.", "c) Vua Hùng thiên vị Sơn Tinh nên bày ra chuyện lễ vật để gả con.", "d) Kết quả cuộc giao tranh: Sơn Tinh thắng, Thủy Tinh rút nước về."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: vua phân xử bằng điều kiện lễ vật mang đến trước — một cách xử lí khó xử của nhà vua, không phải thiên vị. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu miêu tả hình tượng Thánh Gióng trong tưởng tượng của em (ngoại hình, trang bị, khí thế).", "points": 0, "explain": "Gợi ý chấm: miêu tả sinh động (tráng sĩ cao lớn, áo giáp sắt, ngựa sắt phun lửa, roi sắt vụt sáng...); có chi tiết kì ảo tiêu biểu của truyện; ngôn từ gợi hình; thể hiện niềm tự hào, khâm phục."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu cảm nghĩ của em về nhân vật Thủy Tinh: đáng trách, đáng thương hay đáng thông cảm? Hãy bày tỏ ý kiến của em.", "points": 0, "explain": "Gợi ý chấm: nêu rõ quan điểm cá nhân; lập luận dựa trên chi tiết truyện (đến cầu hôn chân thành nhưng chậm chân; gây lũ lụt làm khổ nhân dân); kết đoạn rút ra bài học về cách ứng xử khi gặp thất bại, mất mát."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Yếu tố kì ảo trong truyền thuyết có vai trò gì?", "options": ["A. Làm nổi bật vẻ đẹp, sức mạnh phi thường của nhân vật và gửi gắm tình cảm của nhân dân", "B. Làm cho truyện khó hiểu hơn", "C. Thay thế hoàn toàn yếu tố lịch sử", "D. Chỉ để kéo dài câu chuyện"], "answer": "A", "explain": "Nhờ yếu tố kì ảo, người anh hùng hiện lên lớn lao, phi thường; qua đó nhân dân bày tỏ lòng yêu mến, tự hào.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chi tiết nào sau đây thuộc truyện \"Thánh Gióng\"?", "options": ["A. Chàng trai lấy được công chúa nhờ tiếng đàn thần", "B. Cậu bé nhổ tre đánh tan giặc Ân", "C. Chim phượng hoàng trả vàng cho người em", "D. Vua trả gươm cho rùa vàng"], "answer": "B", "explain": "Nhổ tre đánh giặc khi roi sắt gãy là chi tiết nổi tiếng của \"Thánh Gióng\"; các chi tiết còn lại thuộc \"Thạch Sanh\", \"Cây khế\", \"Sự tích Hồ Gươm\".", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Truyện \"Sự tích Hồ Gươm\" gắn liền với địa danh nổi tiếng nào ngày nay?", "options": ["A. Đền Hùng, Phú Thọ", "B. Núi Tản Viên, Ba Vì", "C. Hồ Hoàn Kiếm, Hà Nội", "D. Thành Cổ Loa, Đông Anh"], "answer": "C", "explain": "Truyện giải thích tên gọi hồ Hoàn Kiếm (Hồ Gươm) ở trung tâm thủ đô Hà Nội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm giống nhau cơ bản giữa Thánh Gióng và Lê Lợi trong hai truyền thuyết là gì?", "options": ["A. Đều được thần tiên sinh ra", "B. Đều đánh giặc bằng gươm thần", "C. Đều sống vào thời Hùng Vương", "D. Đều là những người anh hùng đứng lên cứu nước, được nhân dân ca ngợi và tôn thờ"], "answer": "D", "explain": "Cả hai đều là anh hùng chống ngoại xâm, tiêu biểu cho truyền thống yêu nước; sự giúp đỡ thần kì là cách nhân dân tôn vinh họ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu 'Vua Hùng đưa ra một điều kiện: ai mang lễ vật đến trước sẽ được rước Mị Nương.', dấu hai chấm có công dụng gì?", "options": ["A. Thuyết minh, nói rõ nội dung của \"một điều kiện\" vừa nêu", "B. Dẫn lời nói trực tiếp của nhà vua", "C. Chú thích cho tên riêng", "D. Liệt kê các lễ vật cưới"], "answer": "A", "explain": "Phần sau dấu hai chấm làm rõ điều kiện là gì — đó là công dụng báo trước lời giải thích, thuyết minh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào viết ĐÚNG về dấu ngoặc đơn?", "options": ["A. Ngựa sắt của Gióng (hí vang phun lửa.", "B. Ngựa sắt (của Gióng) hí vang, phun lửa khiến giặc khiếp sợ.", "C. Ngựa sắt) của Gióng (hí vang, phun lửa.", "D. Ngựa sắt của Gióng (Phun lửa khi ra trận)."], "answer": "B", "explain": "Câu A dùng ngoặc đơn đúng cặp, chứa phần chú thích và viết thường hợp quy cách; các câu còn lại thiếu/sai dấu hoặc viết hoa sai.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Truyền thuyết được lưu truyền từ đời này sang đời khác trong nhân dân.", "b) Mọi chi tiết trong truyền thuyết đều phải kiểm chứng được bằng sử sách mới có giá trị.", "c) Qua truyền thuyết, ta hiểu thêm cách nhân dân nhìn nhận, đánh giá lịch sử.", "d) \"Thánh Gióng\" là truyện do một tác giả thời hiện đại sáng tác."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: truyền thuyết quý ở tình cảm, cách đánh giá của nhân dân, không đòi hỏi mọi chi tiết đều là sự thật lịch sử. c) Đúng. d) Sai: đây là truyện dân gian truyền miệng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về dấu câu đã học:", "statements": ["a) Dấu hai chấm thường đi cùng dấu ngoặc kép khi dẫn lời nói trực tiếp.", "b) Phần trong dấu ngoặc đơn có thể là một từ, một cụm từ hoặc một câu ngắn chú thích.", "c) Dấu ngoặc đơn và dấu ngoặc kép có thể thay thế cho nhau trong mọi trường hợp.", "d) Khi phần chú thích nằm giữa câu, dấu câu của câu đặt ngoài dấu ngoặc đơn đóng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: hai dấu có công dụng khác nhau. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại lần em được nghe hoặc đọc một truyện truyền thuyết và cảm xúc của em lúc đó.", "points": 0, "explain": "Gợi ý chấm: giới thiệu hoàn cảnh nghe/đọc truyện; nêu tên truyện và một, hai chi tiết gây ấn tượng; bộc lộ cảm xúc chân thành (tự hào, khâm phục, xúc động); kết đoạn nêu mong muốn hoặc bài học của em."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu trình bày ý kiến của em: Học truyện truyền thuyết có ích lợi gì đối với học sinh hôm nay?", "points": 0, "explain": "Gợi ý chấm: nêu được ích lợi cụ thể (hiểu lịch sử dân tộc, bồi dưỡng lòng yêu nước, tự hào; học cách kể chuyện; thêm yêu tiếng Việt và văn học dân gian); dẫn chứng từ các truyện đã học; kết đoạn khẳng định thái độ học tập của em."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Truyền thuyết khác truyện cổ tích cơ bản ở điểm nào?", "options": ["A. Truyền thuyết ngắn hơn cổ tích", "B. Truyền thuyết không có yếu tố kì ảo, cổ tích thì có", "C. Truyền thuyết gắn với nhân vật, sự kiện lịch sử; cổ tích kể chuyện đời thường và mơ ước công lí", "D. Truyền thuyết do vua chúa sáng tác, cổ tích do nông dân sáng tác"], "answer": "C", "explain": "Điểm phân biệt cốt lõi: truyền thuyết dựa trên cốt lõi lịch sử dân tộc; cổ tích xoay quanh số phận con người đời thường và mơ ước về công lí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu tích nào sau đây gắn với truyền thuyết Thánh Gióng?", "options": ["A. Tháp Rùa giữa hồ", "B. Đền thờ ở núi Tản Viên", "C. Chùa Một Cột", "D. Những bụi tre, ao, đầm và đền thờ ở làng Gióng"], "answer": "D", "explain": "Truyền thuyết kể rằng dấu vết Gióng ra trận còn lại ở quê nhà: lũy tre, ao, đầm... và đền thờ Phù Đổng Thiên Vương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo \"Sự tích Hồ Gươm\", lưỡi gươm thần được tìm thấy trong hoàn cảnh nào?", "options": ["A. Một người đánh cá nhiều lần kéo lưới đều vớt được lưỡi gươm", "B. Lê Lợi đào được khi làm ruộng", "C. Một con rùa ngậm lưỡi gươm dâng lên vua", "D. Quân sĩ nhặt được trên chiến trường"], "answer": "A", "explain": "Người đánh cá họ Lê ba lần kéo lưới đều vớt phải lưỡi gươm — chi tiết kì ảo mở đầu phần gươm thần đến với nghĩa quân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Qua ba truyện truyền thuyết trong bài, truyền thống tốt đẹp nào của dân tộc được tôn vinh?", "options": ["A. Truyền thống hiếu học", "B. Truyền thống yêu nước, chống giặc ngoại xâm và chế ngự thiên tai", "C. Truyền thống làm gốm sứ", "D. Truyền thống buôn bán đường biển"], "answer": "B", "explain": "Gióng chống giặc Ân, Sơn Tinh chống lũ, Lê Lợi đánh đuổi quân Minh — tất cả đều tôn vinh tinh thần dựng nước, giữ nước của dân tộc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây cần dùng dấu hai chấm ở vị trí sau \"quyết định\"?", "options": ["A. Nhà vua quyết định phong Gióng làm Thiên Vương.", "B. Quyết định của nhà vua: rất được lòng dân chúng.", "C. Nhà vua tuyên bố quyết định: phong Gióng là Phù Đổng Thiên Vương.", "D. Mọi người: vui mừng: trước quyết định của vua."], "answer": "C", "explain": "Dấu hai chấm đặt sau \"tuyên bố quyết định\" để báo trước nội dung quyết định được thuyết minh ngay sau đó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Em sẽ viết câu nào sau đây khi muốn chú thích thêm về Sơn Tinh bằng dấu ngoặc đơn?", "options": ["A. Sơn Tinh \"chúa của vùng núi\" rất tài giỏi.", "B. Sơn Tinh, chúa của vùng núi: rất tài giỏi.", "C. Sơn Tinh — chúa của vùng núi, rất tài giỏi — đến cầu hôn.", "D. Sơn Tinh (chúa của vùng núi Tản Viên) rất tài giỏi."], "answer": "D", "explain": "Câu này đặt phần chú thích \"chúa của vùng núi Tản Viên\" trong cặp ngoặc đơn đúng vị trí, ngay sau danh từ được chú thích.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về các văn bản trong bài:", "statements": ["a) \"Thánh Gióng\" và \"Sự tích Hồ Gươm\" đều có yếu tố lịch sử chống giặc ngoại xâm.", "b) \"Sơn Tinh, Thủy Tinh\" ca ngợi vẻ đẹp của tình yêu đôi lứa là chính.", "c) Yếu tố kì ảo trong ba truyện đều góp phần ca ngợi nhân vật và gửi gắm ước mơ của nhân dân.", "d) Truyền thuyết chỉ có ở Việt Nam, các nước khác không có thể loại này."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: truyện chủ yếu giải thích lũ lụt và ca ngợi sức mạnh chống thiên tai. c) Đúng. d) Sai: truyền thuyết có ở nhiều dân tộc trên thế giới.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) \"Phù Đổng Thiên Vương\" là danh hiệu vua phong cho Thánh Gióng.", "b) Hồ Hoàn Kiếm có nghĩa là \"hồ trả gươm\".", "c) Thủy Tinh cưới được Mị Nương và sống hạnh phúc ở vùng biển.", "d) Lễ hội là một cách nhân dân tưởng nhớ các nhân vật trong truyền thuyết."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Đúng (Hoàn = trả, Kiếm = gươm). c) Sai: Sơn Tinh mới là người rước được Mị Nương. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại toàn bộ truyện \"Thánh Gióng\" một cách ngắn gọn theo trình tự sự việc.", "points": 0, "explain": "Gợi ý chấm: kể đủ các sự việc chính (cậu bé ra đời khác thường — nghe sứ giả rao, cất tiếng xin đi đánh giặc — lớn nhanh như thổi — ra trận thắng giặc — bay về trời — được phong Thiên Vương); trình tự rõ ràng, lời văn của mình; kết đoạn nêu ý nghĩa."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu bày tỏ niềm tự hào của em về những người anh hùng trong lịch sử dân tộc qua các truyện truyền thuyết đã học.", "points": 0, "explain": "Gợi ý chấm: nêu được tên và chiến công của ít nhất hai người anh hùng; bộc lộ niềm tự hào, biết ơn chân thành; liên hệ trách nhiệm của thế hệ học sinh hôm nay trong việc học tập và giữ gìn truyền thống."}]}]}
