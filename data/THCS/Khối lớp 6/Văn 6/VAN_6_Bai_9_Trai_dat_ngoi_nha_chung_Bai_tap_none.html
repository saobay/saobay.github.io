A. Vì con người là loài đông nhất trên Trái Đất", "B. Vì con người có bộ não và hệ thần kinh phát triển, có ý thức, tình cảm, ngôn ngữ, biết lao động và tổ chức cuộc sống", "C. Vì con người có thể sống ở mọi hành tinh", "D. Vì con người không cần ăn uống, hít thở"], "answer": "B", "explain": "Những khả năng đặc biệt về trí tuệ và đời sống tinh thần nâng con người lên vị trí cao nhất trong thế giới sống – và cũng đặt lên vai con người trách nhiệm lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiện trạng của Trái Đất hiện nay được văn bản đánh giá như thế nào?", "options": ["A. Hoàn toàn tốt đẹp, không có gì phải lo", "B. Chỉ có vài vấn đề nhỏ, không đáng kể", "C. Rất đáng lo ngại: thiên nhiên bị tàn phá, nhiều loài bị đe dọa tuyệt chủng, biến đổi khí hậu, tầng ô-dôn bị thủng", "D. Đang tự hồi phục nhanh chóng mà không cần con người"], "answer": "C", "explain": "“Sức khỏe” của Trái Đất đang có vấn đề; câu hỏi “Trái Đất có thể chịu đựng đến bao giờ?” là lời cảnh tỉnh cho mọi người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ hiện trạng của Trái Đất, văn bản muốn gửi đến người đọc thông điệp gì?", "options": ["A. Hãy khai thác thiên nhiên càng nhiều càng tốt", "B. Việc bảo vệ Trái Đất là của riêng các nhà khoa học", "C. Con người nên rời bỏ Trái Đất càng sớm càng tốt", "D. Con người phải có trách nhiệm bảo vệ ngôi nhà chung, không thể khoanh tay đứng nhìn"], "answer": "D", "explain": "Bảo vệ Trái Đất là trách nhiệm chung, bắt đầu từ ý thức và hành động của mỗi người.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về Trái Đất theo văn bản đã học:", "statements": ["a) Trái Đất là một trong tám hành tinh của hệ Mặt Trời.", "b) Nước bao phủ khoảng một phần tư bề mặt Trái Đất.", "c) Trái Đất tự quay quanh trục và quay quanh Mặt Trời.", "d) Quỹ đạo của Trái Đất quanh Mặt Trời là hình e-lip."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: nước bao phủ ba phần tư bề mặt. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về hiện trạng Trái Đất:", "statements": ["a) Thiên nhiên đang bị con người tàn phá ở nhiều nơi.", "b) Nhiều loài sinh vật có nguy cơ tuyệt chủng.", "c) Tầng ô-dôn bị thủng là điều không đáng lo ngại.", "d) Biến đổi khí hậu là một thách thức lớn của hành tinh."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: thủng tầng ô-dôn làm tia tử ngoại có hại chiếu xuống Trái Đất, rất đáng lo. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu giải thích vì sao Trái Đất được gọi là “cái nôi của sự sống”.", "points": 0, "explain": "Gợi ý: giải thích hình ảnh “cái nôi” (nơi sinh ra, nuôi dưỡng); dẫn chứng từ văn bản: vị trí thuận lợi trong hệ Mặt Trời, nước bao phủ 3/4 bề mặt, sự sống phong phú và con người; kết đoạn: tình cảm, ý thức giữ gìn “cái nôi” chung."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày ý kiến của em về hiện tượng chặt phá rừng bừa bãi.", "points": 0, "explain": "Gợi ý: nêu ý kiến phê phán; lí lẽ: rừng là nơi sống của muôn loài, điều hòa khí hậu, chống lũ, xói mòn; bằng chứng: hậu quả lũ lụt, loài tuyệt chủng; đề xuất: trồng rừng, bảo vệ rừng, lên án hành vi phá rừng."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Trong văn bản, nước được gọi là gì của sự sống trên Trái Đất?", "options": ["A. “Vị thần hộ mệnh”", "B. “Kẻ thù lớn nhất”", "C. “Món quà ngẫu nhiên”", "D. “Bí mật không lời giải”"], "answer": "A", "explain": "Phần 2 của văn bản gọi nước là “vị thần hộ mệnh” của sự sống, vì không có nước thì không thể có sự sống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo văn bản, đỉnh cao kì diệu của sự sống trên Trái Đất là gì?", "options": ["A. Đại dương", "B. Con người", "C. Rừng nhiệt đới", "D. Khí quyển"], "answer": "B", "explain": "Con người là đỉnh cao kì diệu của sự sống vì có bộ não phát triển, ý thức, ngôn ngữ, tình cảm và khả năng lao động, cải tạo thế giới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trái Đất có những chuyển động chính nào?", "options": ["A. Chỉ quay quanh Mặt Trời", "B. Chỉ tự quay quanh trục", "C. Tự quay quanh trục và quay quanh Mặt Trời", "D. Bay thẳng trong không gian"], "answer": "C", "explain": "Trái Đất vừa tự quay quanh trục của mình (tạo ngày và đêm), vừa quay quanh Mặt Trời theo quỹ đạo hình e-lip.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Các loài trên Trái Đất chung sống với nhau theo quan hệ như thế nào?", "options": ["A. Hoàn toàn độc lập, không liên quan gì đến nhau", "B. Chỉ cạnh tranh, loài mạnh ăn loài yếu là đủ", "C. Con người muốn làm gì với các loài cũng được", "D. Gắn bó, phụ thuộc và hỗ trợ lẫn nhau trong một mạng lưới sự sống cân bằng"], "answer": "D", "explain": "Văn bản “Các loài chung sống với nhau như thế nào?” cho thấy muôn loài liên kết thành chuỗi, thành mạng; mất một mắt xích sẽ ảnh hưởng đến tất cả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nếu một loài sinh vật biến mất, điều gì có thể xảy ra?", "options": ["A. Sự cân bằng của hệ sinh thái bị phá vỡ, nhiều loài khác và cả con người bị ảnh hưởng", "B. Không có gì thay đổi trong tự nhiên", "C. Các loài còn lại lập tức khỏe mạnh hơn", "D. Chỉ loài đó chịu thiệt, không liên quan đến ai"], "answer": "A", "explain": "Các loài phụ thuộc lẫn nhau (thức ăn, thụ phấn, nơi ở…); tuyệt chủng một loài là mất một mắt xích của mạng sống chung.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thái độ của nhà thơ đối với những kẻ hủy hoại Trái Đất được thể hiện qua chi tiết nào?", "options": ["A. Khen ngợi chúng khéo léo, nhanh nhẹn", "B. Gọi chúng là “bọn”, “lũ”; kể hành động “bổ”, “cắn”, “giành giật”, “đá” đầy bạo lực", "C. Mời chúng cùng ăn dưa, đá bóng", "D. Im lặng, không nhắc tới chúng"], "answer": "B", "explain": "Cách gọi và hệ thống động từ mạnh bộc lộ thái độ căm phẫn, khinh bỉ của nhà thơ trước sự tham lam, tàn nhẫn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về bài thơ “Trái Đất”:", "statements": ["a) Tác giả bài thơ là Ra-xun Gam-da-tốp.", "b) Bài thơ được viết năm 1967 bằng tiếng Việt.", "c) Bài thơ gồm hai khổ với hai thái độ đối lập của nhà thơ.", "d) Bản dịch tiếng Việt là của dịch giả Minh Tâm."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: bài thơ viết bằng tiếng A-va, dịch qua bản tiếng Nga. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về hình ảnh trong bài thơ “Trái Đất”:", "statements": ["a) Kẻ hủy hoại coi Trái Đất như quả dưa, quả bóng.", "b) Nhà thơ đồng tình với cách nhìn Trái Đất là quả dưa để bổ, cắn.", "c) Ở khổ 2, Trái Đất được nhân hóa như một con người thân thương.", "d) Nhà thơ “rửa sạch máu”, “hát dịu dàng” cho Trái Đất."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: nhà thơ căm phẫn, phủ định cách nhìn ấy (“chẳng là dưa, là bóng”). c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu đề xuất giải pháp khắc phục ô nhiễm môi trường ở trường em.", "points": 0, "explain": "Gợi ý: nêu thực trạng (rác ở sân trường, nhà vệ sinh, căng-tin); đề xuất giải pháp cụ thể (thùng rác phân loại, trực nhật nghiêm túc, cây xanh, tuyên truyền); phân công vai trò của học sinh, giáo viên; kết đoạn: kì vọng môi trường học đường xanh – sạch – đẹp."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày suy nghĩ của em về câu hỏi: “Trái Đất có thể chịu đựng đến bao giờ?”.", "points": 0, "explain": "Gợi ý: giải thích ý nghĩa câu hỏi (giới hạn chịu đựng của hành tinh); dẫn chứng hiện trạng (biến đổi khí hậu, tuyệt chủng, ô nhiễm); thái độ của em (lo lắng, thấy trách nhiệm); kết đoạn: lời kêu gọi hành động từ việc nhỏ."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Quỹ đạo chuyển động của Trái Đất quanh Mặt Trời có hình gì?", "options": ["A. Hình tròn tuyệt đối", "B. Hình vuông", "C. Hình e-lip", "D. Hình tam giác"], "answer": "C", "explain": "Quỹ đạo của Trái Đất là một hình e-lip (hình bầu dục) gần tròn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả bài thơ “Trái Đất” là ai?", "options": ["A. Lạc Thanh", "B. Tế Hanh", "C. Ép-tu-sen-cô", "D. Ra-xun Gam-da-tốp"], "answer": "D", "explain": "Bài thơ “Trái Đất” là của Ra-xun Gam-da-tốp, nhà thơ người A-va ở Đa-ghe-xtan thuộc Liên bang Nga.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài thơ “Trái Đất” được viết vào năm nào?", "options": ["A. Năm 1967", "B. Năm 1945", "C. Năm 2000", "D. Năm 1986"], "answer": "A", "explain": "Bài thơ được sáng tác năm 1967 bằng tiếng A-va; bản dịch tiếng Việt của Minh Tâm dựa trên bản dịch tiếng Nga của Na-um Grep-nhi-ốp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình ảnh Trái Đất trong khổ thơ thứ hai khác gì so với khổ thứ nhất?", "options": ["A. Trái Đất vẫn bị coi là quả bóng để đá", "B. Trái Đất hiện lên như một con người có “khuôn mặt thân thương”, biết khóc, biết đau, được nhà thơ vỗ về", "C. Trái Đất biến thành quả dưa chín", "D. Trái Đất trở thành chiến trường khốc liệt"], "answer": "B", "explain": "Nhà thơ phủ định cách nhìn “là dưa, là bóng”, nhân hóa Trái Đất thành người thân yêu để bày tỏ tình thương và ý thức bảo vệ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Các hành động “lau nước mắt”, “rửa sạch máu”, “hát dịu dàng” của nhân vật trữ tình thể hiện điều gì?", "options": ["A. Sự thờ ơ với nỗi đau của Trái Đất", "B. Ý muốn chiếm hữu Trái Đất cho riêng mình", "C. Tình thương xót, sự nâng niu và quyết tâm chữa lành, bảo vệ Trái Đất", "D. Thái độ đùa vui trước thiên nhiên"], "answer": "C", "explain": "Đó là những cử chỉ của người thân dành cho người thân: an ủi, chăm sóc, xoa dịu – đối lập hẳn với hành vi hủy hoại ở khổ 1.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói bài thơ “Trái Đất” vừa có yếu tố trữ tình vừa truyền đạt một thông điệp thông tin?", "options": ["A. Vì bài thơ có nhiều số liệu thống kê", "B. Vì bài thơ được in trong sách khoa học", "C. Vì tác giả là một nhà khoa học", "D. Vì bài thơ bày tỏ tình cảm của nhà thơ đồng thời nhắc nhở mọi người sự thật rằng Trái Đất đang bị hủy hoại và cần được bảo vệ"], "answer": "D", "explain": "Thông điệp “Hãy bảo vệ Trái Đất” được truyền đi bằng hình tượng thơ và cảm xúc, đó là sức mạnh riêng của văn học.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về cách triển khai văn bản thông tin:", "statements": ["a) Văn bản thông tin chỉ có một cách triển khai duy nhất là theo thời gian.", "b) Có thể triển khai thông tin theo quan hệ nhân quả.", "c) Đề mục giúp người đọc nắm cấu trúc và tra cứu thông tin nhanh.", "d) Số liệu làm cho thông tin thêm chính xác, thuyết phục."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: còn nhiều cách triển khai (nhân quả, mức độ quan trọng…). b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về đoạn văn trong văn bản thông tin:", "statements": ["a) Mỗi đoạn văn thường tập trung một thông tin nhất định.", "b) Câu mở đầu đoạn thường nêu ý chính của đoạn.", "c) Các đoạn văn trong văn bản thông tin hoàn toàn không liên quan đến nhau.", "d) Hiểu chức năng của từng đoạn giúp nắm được mạch thông tin của văn bản."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: các đoạn liên kết thành một chỉnh thể thống nhất quanh chủ đề của văn bản. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu về vai trò của nước đối với sự sống trên Trái Đất và việc em làm để tiết kiệm, bảo vệ nguồn nước.", "points": 0, "explain": "Gợi ý: nêu vai trò của nước (duy trì sự sống của mọi sinh vật, “vị thần hộ mệnh”); thực trạng lãng phí, ô nhiễm nguồn nước quanh em; việc em làm: khóa vòi nước, không xả rác xuống ao hồ, nhắc nhở người thân; kết đoạn khẳng định."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày ý kiến: Con người là “đỉnh cao kì diệu của sự sống” nên càng phải có trách nhiệm với Trái Đất.", "points": 0, "explain": "Gợi ý: giải thích vị thế đặc biệt của con người (trí tuệ, ngôn ngữ, lao động); lí lẽ: khả năng lớn đi kèm trách nhiệm lớn – con người vừa gây tổn thương vừa có thể chữa lành hành tinh; bằng chứng: phong trào trồng cây, khoa học bảo vệ môi trường; kết đoạn liên hệ bản thân."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Ra-xun Gam-da-tốp là người dân tộc nào?", "options": ["A. Dân tộc A-va, nước Cộng hòa Đa-ghe-xtan thuộc Liên bang Nga", "B. Dân tộc Kinh, Việt Nam", "C. Dân tộc Mông Cổ", "D. Dân tộc Nga ở Mát-xcơ-va"], "answer": "A", "explain": "Nhà thơ sinh ra và gắn bó với vùng núi Đa-ghe-xtan; thơ ông giàu tình yêu quê hương, con người và sự sống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong bài thơ, những kẻ hủy hoại Trái Đất coi Trái Đất như những vật gì?", "options": ["A. Như người mẹ hiền", "B. Như quả dưa, như quả bóng trên sân", "C. Như ngôi nhà chung", "D. Như khu vườn quý"], "answer": "B", "explain": "Chúng coi Trái Đất là quả dưa để “bổ”, “cắn”, là quả bóng để giành giật, lao vào “đá” – thái độ tham lam, tàn nhẫn bị nhà thơ lên án.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài thơ “Trái Đất” gồm mấy khổ, tương ứng với hai thái độ nào?", "options": ["A. Ba khổ đều tả cảnh thiên nhiên", "B. Một khổ duy nhất tả chiến tranh", "C. Hai khổ: căm phẫn trước kẻ hủy hoại Trái Đất và xót thương, yêu quý Trái Đất", "D. Bốn khổ kể chuyện lịch sử"], "answer": "C", "explain": "Khổ 1 hướng về những kẻ phá hoại với thái độ khinh bỉ, lên án; khổ 2 hướng về Trái Đất với tình thương xót và vỗ về.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi đọc văn bản thông tin, vì sao em cần chú ý tới các số liệu?", "options": ["A. Vì số liệu làm văn bản dài hơn", "B. Vì số liệu chỉ để trang trí", "C. Vì không có số liệu thì không được gọi là văn bản", "D. Vì số liệu là bằng chứng cụ thể giúp thông tin chính xác, đáng tin và dễ hình dung mức độ của vấn đề"], "answer": "D", "explain": "Số liệu (3/4 bề mặt là nước, một nửa số động vật hoang dã biến mất trong 40 năm…) làm cho thông tin có sức nặng và tính thuyết phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đoạn văn trong văn bản thông tin có đặc điểm gì?", "options": ["A. Mỗi đoạn tập trung trình bày một thông tin nhất định, thường có câu mở đầu nêu ý chính của đoạn", "B. Mỗi đoạn phải có ít nhất một nhân vật", "C. Các đoạn không cần liên quan đến nhau", "D. Đoạn văn càng dài càng chứng tỏ thông tin hay"], "answer": "A", "explain": "Hiểu cấu tạo đoạn (điểm mở đầu – triển khai – điểm kết thúc) giúp em nắm nhanh ý chính của từng phần trong văn bản thông tin.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu mở đầu của một đoạn văn trong văn bản thông tin thường có vai trò gì?", "options": ["A. Kết luận cho toàn bộ văn bản", "B. Giới thiệu, nêu ý chính mà đoạn văn sẽ triển khai", "C. Kể một câu chuyện cười", "D. Nêu tên tác giả của văn bản"], "answer": "B", "explain": "Đọc câu mở đầu (câu chủ đề) là cách nhanh nhất để biết đoạn văn nói về điều gì.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về các loài chung sống trên Trái Đất:", "statements": ["a) Các loài sinh vật phụ thuộc, hỗ trợ lẫn nhau.", "b) Một loài tuyệt chủng không ảnh hưởng gì đến các loài khác.", "c) Con người là một phần của mạng lưới sự sống chung.", "d) Bảo vệ đa dạng sinh học là bảo vệ chính cuộc sống của con người."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: mất một loài phá vỡ cân bằng sinh thái, ảnh hưởng dây chuyền. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nhà thơ Ra-xun Gam-da-tốp:", "statements": ["a) Ông là người dân tộc A-va ở Đa-ghe-xtan thuộc Liên bang Nga.", "b) Thơ ông giàu tình yêu quê hương, con người và sự sống.", "c) Ông viết bài thơ “Trái Đất” để cổ vũ việc khai thác thiên nhiên.", "d) Ông hướng tới xây đắp tình hữu nghị giữa các dân tộc trong thơ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: bài thơ lên án kẻ hủy hoại và kêu gọi bảo vệ Trái Đất. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể về một việc làm cụ thể của lớp em để bảo vệ môi trường, nêu cảm nghĩ của em.", "points": 0, "explain": "Gợi ý: giới thiệu việc làm (lao động trồng cây, thu gom pin cũ, làm thùng rác tái chế…); kể diễn biến và sự tham gia của các bạn; kết quả; cảm nghĩ và bài học về tinh thần chung tay vì ngôi nhà chung."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày suy nghĩ của em về hiện tượng săn bắt, buôn bán động vật hoang dã.", "points": 0, "explain": "Gợi ý: nêu ý kiến lên án; lí lẽ: các loài có quyền chung sống, mất loài là phá vỡ cân bằng sinh thái, vi phạm pháp luật; bằng chứng: loài quý hiếm đứng trước nguy cơ tuyệt chủng; đề xuất: tuyên truyền, không sử dụng sản phẩm từ động vật hoang dã."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Văn bản “Các loài chung sống với nhau như thế nào?” thuộc loại văn bản nào?", "options": ["A. Truyện cười", "B. Văn bản nghị luận", "C. Văn bản thông tin", "D. Kịch"], "answer": "C", "explain": "Cùng với “Trái Đất – cái nôi của sự sống”, đây là văn bản thông tin cung cấp tri thức về thế giới sinh vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chủ đề chung của cả ba văn bản trong bài 9 là gì?", "options": ["A. Lịch sử dựng nước của dân tộc", "B. Tình bạn trong sáng tuổi học trò", "C. Những chuyến phiêu lưu kì thú", "D. Trái Đất – ngôi nhà chung và trách nhiệm bảo vệ môi trường sống"], "answer": "D", "explain": "Ba văn bản (hai văn bản thông tin và một bài thơ) cùng hướng về Trái Đất, kêu gọi con người bảo vệ hành tinh xanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hoạt động nói và nghe của bài 9 là hoạt động nào?", "options": ["A. Thảo luận về giải pháp khắc phục nạn ô nhiễm môi trường", "B. Kể lại một truyền thuyết", "C. Trình bày ý kiến về cuốn sách yêu thích", "D. Giới thiệu về quê hương em"], "answer": "A", "explain": "Bài 9 rèn kĩ năng thảo luận nhóm về một vấn đề thực tiễn: ô nhiễm môi trường và các giải pháp khắc phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao khi thảo luận về giải pháp khắc phục ô nhiễm môi trường, mỗi ý kiến cần có lí do và dẫn chứng?", "options": ["A. Để kéo dài thời gian thảo luận", "B. Để ý kiến thuyết phục, giải pháp đề xuất khả thi và được mọi người đồng thuận", "C. Để chứng tỏ mình nói hay hơn bạn", "D. Vì thảo luận chỉ là hình thức, không cần chất lượng"], "answer": "B", "explain": "Thảo luận là hoạt động nghị luận bằng lời: ý kiến có căn cứ mới giúp nhóm chọn được giải pháp đúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giải pháp nào sau đây thuộc về hành động của học sinh để bảo vệ môi trường?", "options": ["A. Đốt rác thải nhựa ở sân trường", "B. Vứt rác xuống sông cho trôi đi", "C. Phân loại rác, trồng và chăm sóc cây xanh, tiết kiệm điện nước", "D. Chặt cây để sân trường rộng hơn"], "answer": "C", "explain": "Những việc nhỏ, làm được ngay tại trường và ở nhà chính là cách học sinh góp phần bảo vệ ngôi nhà chung.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhan đề “Trái Đất – cái nôi của sự sống” thuộc kiểu nhan đề nào và có tác dụng gì?", "options": ["A. Nhan đề chỉ gồm một từ khó hiểu", "B. Nhan đề không liên quan đến nội dung", "C. Nhan đề đặt ra để gây tranh cãi", "D. Nhan đề nêu chủ đề kèm hình ảnh gợi cảm, vừa thông báo nội dung vừa khơi gợi tình cảm với Trái Đất"], "answer": "D", "explain": "Nhan đề vừa là “biển báo” nội dung (Trái Đất là nơi sự sống ra đời) vừa có sức gợi cảm nhờ hình ảnh “cái nôi”.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về thông điệp bài 9:", "statements": ["a) Trái Đất là ngôi nhà chung của mọi loài.", "b) Bảo vệ môi trường chỉ là việc của người lớn và các nhà khoa học.", "c) Học sinh có thể bảo vệ môi trường bằng những việc nhỏ hằng ngày.", "d) Con người phải học cách sống hài hòa, có trách nhiệm với hành tinh."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: đó là trách nhiệm của mọi người, kể cả học sinh. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau khi đọc văn bản thông tin:", "statements": ["a) Cần chú ý nhan đề, sa-pô để nắm nhanh nội dung chính.", "b) Số liệu và tranh ảnh là những phần có thể bỏ qua khi đọc.", "c) Nên ghi lại các thông tin chính theo từng đề mục.", "d) Đọc văn bản thông tin nhằm thu nhận tri thức chính xác về thế giới."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: số liệu là bằng chứng của thông tin, tranh ảnh hỗ trợ hiểu nội dung. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu giới thiệu ngắn gọn văn bản “Trái Đất – cái nôi của sự sống” cho một bạn chưa đọc.", "points": 0, "explain": "Gợi ý: giới thiệu loại văn bản và chủ đề; tóm tắt năm phần chính bằng câu văn của em; nêu một thông tin em thấy thú vị nhất (vai trò của nước, con người là đỉnh cao kì diệu…); kết đoạn: khuyên bạn đọc và lí do."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày ý kiến của em về việc sử dụng túi ni-lông và đồ nhựa dùng một lần.", "points": 0, "explain": "Gợi ý: nêu ý kiến (cần hạn chế tối đa); lí lẽ: nhựa khó phân hủy, gây ô nhiễm đất, nước, hại sinh vật; bằng chứng quanh em; giải pháp thay thế: túi vải, bình nước cá nhân, hộp đựng dùng lại nhiều lần."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Phần viết của bài 9 yêu cầu viết đoạn văn về chủ đề nào?", "options": ["A. “Để hành tinh xanh mãi xanh”", "B. “Quê hương yêu dấu”", "C. “Cuốn sách tôi yêu”", "D. “Người bạn thân của em”"], "answer": "A", "explain": "Viết kết nối với đọc của bài 9: viết đoạn văn khoảng 5 – 7 câu về chủ đề giữ gìn hành tinh xanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Cái nôi” trong nhan đề “Trái Đất – cái nôi của sự sống” gợi ý nghĩa gì?", "options": ["A. Nơi chôn giấu kho báu", "B. Nơi sinh ra, nuôi dưỡng sự sống", "C. Chiếc nôi để ru em bé ngủ", "D. Nơi nguy hiểm cần tránh xa"], "answer": "B", "explain": "“Cái nôi” là hình ảnh ẩn dụ: Trái Đất là nơi sự sống ra đời, được nuôi dưỡng và phát triển qua hàng tỉ năm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “tuyệt chủng” có nghĩa là gì?", "options": ["A. Một loài sinh vật di cư đến nơi khác", "B. Sinh vật sinh sôi rất nhanh", "C. Một loài sinh vật biến mất hoàn toàn khỏi Trái Đất", "D. Sinh vật thay đổi hình dáng theo mùa"], "answer": "C", "explain": "Tuyệt chủng là tình trạng một giống loài không còn một cá thể nào sống sót – mất mát không thể khôi phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ba văn bản khác thể loại (hai văn bản thông tin, một bài thơ) lại được xếp chung trong bài 9?", "options": ["A. Vì cả ba đều do một tác giả viết", "B. Vì cả ba đều rất ngắn", "C. Vì cả ba đều viết về biển", "D. Vì cùng chung chủ đề Trái Đất – ngôi nhà chung và cùng kêu gọi bảo vệ môi trường sống"], "answer": "D", "explain": "Sự kết hợp giữa tri thức khoa học và cảm xúc thơ ca giúp bài học tác động cả vào hiểu biết lẫn tình cảm của người học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đọc văn bản thông tin khác với đọc truyện ở điểm nào cơ bản?", "options": ["A. Đọc để nắm thông tin, tri thức chính xác về thế giới, cần theo dõi đề mục, số liệu, tranh ảnh", "B. Đọc để theo dõi số phận nhân vật là chính", "C. Đọc văn bản thông tin không cần hiểu nghĩa của từ", "D. Đọc truyện thì không cần tập trung"], "answer": "A", "explain": "Mục đích đọc khác nhau đòi hỏi cách đọc khác nhau: với văn bản thông tin, em đọc để thu nhận và ghi nhớ tri thức.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc văn bản sử dụng tranh ảnh minh họa (ví dụ ảnh Trái Đất, ảnh các loài sinh vật) có tác dụng gì?", "options": ["A. Làm văn bản trở nên kém nghiêm túc", "B. Giúp thông tin trực quan, dễ hiểu, gây ấn tượng và hứng thú cho người đọc", "C. Thay thế hoàn toàn phần chữ viết", "D. Chỉ để lấp đầy trang giấy"], "answer": "B", "explain": "Tranh ảnh là một “kênh” thông tin của văn bản thông tin, đặc biệt hiệu quả với những nội dung khó hình dung.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nước và sự sống:", "statements": ["a) Không có nước, Trái Đất chỉ là hành tinh khô chết, trơ trụi.", "b) Nước được gọi là “vị thần hộ mệnh” của sự sống.", "c) Mọi hành tinh trong hệ Mặt Trời đều có nước và sự sống như Trái Đất.", "d) Nước bao phủ phần lớn bề mặt Trái Đất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cho đến nay, Trái Đất là hành tinh duy nhất được biết có sự sống. d) Đúng (3/4 bề mặt).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về hoạt động thảo luận ở bài 9:", "statements": ["a) Chủ đề thảo luận là giải pháp khắc phục nạn ô nhiễm môi trường.", "b) Khi thảo luận, chỉ cần nói to là ý kiến sẽ được chấp nhận.", "c) Ý kiến trong thảo luận cần có lí do và dẫn chứng.", "d) Cần lắng nghe và tôn trọng ý kiến của các thành viên khác."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: ý kiến thuyết phục nhờ lí lẽ, bằng chứng và tính khả thi. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu phân tích hình ảnh Trái Đất trong hai khổ thơ của bài thơ “Trái Đất”.", "points": 0, "explain": "Gợi ý: khổ 1 – Trái Đất trong mắt kẻ phá hoại (quả dưa, quả bóng bị giành giật); khổ 2 – Trái Đất trong lòng nhà thơ (khuôn mặt thân thương, được vỗ về, chữa lành); nhận xét về hai thái độ đối lập và thông điệp em nhận được."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày suy nghĩ của em về vấn đề rác thải nhựa ở biển.", "points": 0, "explain": "Gợi ý: nêu thực trạng (rác nhựa trôi ra đại dương, sinh vật biển ăn phải, mắc phải); nguyên nhân; hậu quả với hệ sinh thái và con người; giải pháp từ mỗi người: giảm nhựa, thu gom rác khi đi biển; kết đoạn kêu gọi."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tầng ô-dôn có vai trò gì đối với sự sống?", "options": ["A. Tạo ra mưa cho Trái Đất", "B. Giữ cho Trái Đất quay đều", "C. Che chắn cho Trái Đất khỏi tia tử ngoại có hại của Mặt Trời", "D. Sản sinh ô-xi cho con người thở"], "answer": "C", "explain": "Tầng ô-dôn như một tấm lá chắn bảo vệ sự sống; việc nó bị thủng là một trong những thách thức lớn của Trái Đất hiện nay.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Văn bản “Trái Đất – cái nôi của sự sống” được chia thành mấy phần chính?", "options": ["A. Ba phần", "B. Hai phần", "C. Bảy phần", "D. Năm phần"], "answer": "D", "explain": "Năm phần: vị trí của Trái Đất trong hệ Mặt Trời; vai trò của nước; sự sống phong phú; con người – đỉnh cao kì diệu; hiện trạng của Trái Đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phần cuối của văn bản “Trái Đất – cái nôi của sự sống” nói về điều gì?", "options": ["A. Hiện trạng đáng lo ngại của Trái Đất và thách thức mà con người phải đối mặt", "B. Cách chế tạo tàu vũ trụ", "C. Lịch sử khám phá các hành tinh", "D. Đời sống của các loài cá biển"], "answer": "A", "explain": "Phần 5 cảnh báo: thiên nhiên bị tàn phá, nhiều loài biến mất, biến đổi khí hậu… và đặt câu hỏi “Trái Đất có thể chịu đựng đến bao giờ?”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu hỏi “Trái Đất có thể chịu đựng đến bao giờ?” ở cuối văn bản có tác dụng gì?", "options": ["A. Báo hiệu văn bản sắp kết thúc một cách đơn thuần", "B. Thức tỉnh người đọc về giới hạn chịu đựng của hành tinh và trách nhiệm phải hành động ngay", "C. Hỏi về tuổi thọ chính xác của Trái Đất", "D. Mời người đọc đoán một con số cụ thể"], "answer": "B", "explain": "Câu hỏi tu từ này xoáy sâu vào tính cấp bách của vấn đề, buộc người đọc phải suy nghĩ và thay đổi hành vi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo đoạn trích trong sách bài tập, “sự thống trị của loài người” được chứng minh bằng cách nào?", "options": ["A. Bằng cách kể chuyện ngụ ngôn", "B. Bằng những câu thơ trữ tình", "C. Bằng hàng loạt số liệu về đất đai, nước ngọt, tỉ lệ tuyệt chủng và sự biến mất của động vật hoang dã", "D. Bằng việc liệt kê tên các quốc gia"], "answer": "C", "explain": "Tác giả dùng số liệu thực tế (dùng hơn một nửa đất đai, kiểm soát 3/4 lượng nước ngọt, mất một nửa động vật hoang dã trong 40 năm) để chứng minh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi viết đoạn văn “Để hành tinh xanh mãi xanh”, bằng chứng nào phù hợp để đưa vào bài?", "options": ["A. Những câu chuyện cổ tích về thần tiên", "B. Số liệu về các hành tinh khác", "C. Tên các loài hoa trong vườn trường", "D. Những việc làm cụ thể quanh em: lớp trồng cây, trường không rác thải nhựa, gia đình tiết kiệm nước"], "answer": "D", "explain": "Đoạn văn thuyết phục cần dẫn chứng gần gũi, có thật từ đời sống của chính em và cộng đồng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về con người trên Trái Đất:", "statements": ["a) Con người có bộ não phát triển, có ngôn ngữ và biết lao động.", "b) Con người đứng ngoài mạng lưới sự sống, không phụ thuộc vào thiên nhiên.", "c) Chính con người đang gây ra nhiều tổn thương cho Trái Đất.", "d) Con người có khả năng và trách nhiệm cải tạo, bảo vệ hành tinh."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: con người phụ thuộc hoàn toàn vào thiên nhiên (không khí, nước, thức ăn…). c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nghệ thuật bài thơ “Trái Đất”:", "statements": ["a) Nhà thơ dùng nhiều động từ mạnh để tả hành vi hủy hoại Trái Đất.", "b) Bài thơ sử dụng biện pháp nhân hóa khi nói về Trái Đất.", "c) Hai khổ thơ có giọng điệu hoàn toàn giống nhau.", "d) Hình ảnh so sánh “quả dưa”, “quả bóng” làm nổi bật sự tham lam của kẻ phá hoại."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng (Trái Đất biết khóc, có khuôn mặt thân thương). c) Sai: khổ 1 căm phẫn, khổ 2 tha thiết, xót thương. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu về chủ đề: Mỗi học sinh là một “đại sứ xanh” của trường.", "points": 0, "explain": "Gợi ý: giải thích hình ảnh “đại sứ xanh”; những việc đại sứ xanh cần làm (giữ vệ sinh, chăm cây, tuyên truyền, nhắc nhở bạn); dẫn chứng hoạt động của lớp/trường; kết đoạn: quyết tâm và lời mời các bạn cùng tham gia."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày ý kiến của em về hiện tượng đốt rừng, đốt nương gây khói bụi và cháy lan.", "points": 0, "explain": "Gợi ý: nêu ý kiến phê phán hành vi thiếu ý thức; lí lẽ: hậu quả khôn lường (mất rừng, ô nhiễm không khí, nguy hiểm tính mạng, loài mất nơi ở); bằng chứng từ tin tức đời sống; đề xuất cách canh tác, phòng cháy an toàn và vai trò tuyên truyền của học sinh."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Cách triển khai nào có thể dùng trong văn bản thông tin?", "options": ["A. Theo trật tự thời gian hoặc theo quan hệ nhân quả", "B. Chỉ triển khai bằng vần thơ", "C. Triển khai tùy hứng không cần trật tự", "D. Chỉ dùng lời đối thoại"], "answer": "A", "explain": "Mỗi văn bản thông tin có cách triển khai riêng: theo trật tự thời gian, theo quan hệ nhân quả, theo mức độ quan trọng của thông tin…", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong văn bản thông tin, đề mục có tác dụng gì?", "options": ["A. Trang trí cho văn bản đẹp hơn", "B. Đánh dấu, gọi tên nội dung của từng phần, giúp người đọc dễ theo dõi", "C. Thay thế toàn bộ nội dung văn bản", "D. Ghi tên người đọc"], "answer": "B", "explain": "Đề mục như những “biển chỉ đường”, cho biết mỗi phần nói về điều gì và giúp tra cứu thông tin nhanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đặc điểm quan trọng nhất của thông tin trong văn bản thông tin là gì?", "options": ["A. Bay bổng, giàu tưởng tượng", "B. Càng bí ẩn càng hay", "C. Chính xác, khách quan, có căn cứ", "D. Chỉ nêu cảm xúc cá nhân"], "answer": "C", "explain": "Khác với văn học hư cấu, văn bản thông tin đề cao sự thật: số liệu, sự việc phải đúng và kiểm chứng được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác biệt lớn nhất giữa bài thơ “Trái Đất” và hai văn bản thông tin trong bài là gì?", "options": ["A. Bài thơ dài hơn hai văn bản kia rất nhiều", "B. Bài thơ không nói về Trái Đất", "C. Hai văn bản thông tin đều viết bằng thơ", "D. Bài thơ truyền thông điệp bằng hình tượng và cảm xúc; văn bản thông tin truyền tri thức bằng sự việc, số liệu chính xác"], "answer": "D", "explain": "Cùng một chủ đề nhưng hai con đường tác động khác nhau: lí trí (thông tin) và trái tim (thơ) – cả hai đều cần thiết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nếu phải giới thiệu bài 9 cho một bạn chưa học, câu nào sau đây tóm đúng nhất nội dung bài học?", "options": ["A. Bài học cung cấp tri thức về Trái Đất và kêu gọi mọi người chung tay bảo vệ ngôi nhà chung", "B. Bài học dạy cách làm thơ về thiên nhiên", "C. Bài học kể chuyện phiêu lưu trên các hành tinh", "D. Bài học chỉ gồm các bài tập tiếng Việt"], "answer": "A", "explain": "Đó là tinh thần xuyên suốt bài 9, từ lời dẫn của Ét-ga Mô-ranh đến hoạt động thảo luận cuối bài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nói mở đầu bài học “Chúng ta phải học cách có mặt trên hành tinh này” gợi cho em suy nghĩ gì?", "options": ["A. Con người nên tìm cách rời khỏi Trái Đất càng sớm càng tốt", "B. Con người cần học cách sống hài hòa, có trách nhiệm với Trái Đất thay vì khai thác, hủy hoại nó vô ý thức", "C. Mỗi người chỉ cần lo cho cuộc sống của riêng mình", "D. Sự có mặt của con người trên Trái Đất là một sai lầm"], "answer": "B", "explain": "“Có mặt” ở đây là biết sống như một thành viên có trách nhiệm của ngôi nhà chung, biết chia sẻ lo lắng, buồn vui cùng Trái Đất.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về từ ngữ trong bài 9:", "statements": ["a) “Tuyệt chủng” là hiện tượng một loài biến mất hoàn toàn.", "b) “Cái nôi” trong nhan đề gợi nơi sự sống được sinh ra và nuôi dưỡng.", "c) “Hành tinh xanh” là cách gọi Trái Đất vì nước và sự sống bao phủ.", "d) “Ô-dôn” là tên một loài sinh vật biển."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ô-dôn là lớp khí trong khí quyển che chắn tia tử ngoại.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về việc viết đoạn văn “Để hành tinh xanh mãi xanh”:", "statements": ["a) Đoạn văn cần nêu được những việc làm cụ thể để bảo vệ hành tinh.", "b) Có thể dùng dẫn chứng từ đời sống quanh em để đoạn văn thuyết phục.", "c) Đoạn văn nên chỉ kể chuyện cổ tích cho sinh động.", "d) Cần thể hiện tình cảm, trách nhiệm của bản thân với Trái Đất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: chủ đề là bảo vệ hành tinh xanh, cần thông tin và việc làm thực tế. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu thuyết phục mọi người trồng thêm nhiều cây xanh quanh nhà và trường học.", "points": 0, "explain": "Gợi ý: nêu lợi ích của cây xanh (bóng mát, không khí trong lành, nơi sống của chim, giảm bụi và tiếng ồn); dẫn chứng từ con đường/khu phố của em; cách mỗi người có thể góp (trồng một cây, chăm sóc cây sẵn có); kết đoạn: hình ảnh hành tinh xanh trong tương lai."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày điều em học được từ văn bản “Các loài chung sống với nhau như thế nào?”.", "points": 0, "explain": "Gợi ý: tóm tắt điều cốt lõi (muôn loài gắn bó, phụ thuộc lẫn nhau); một ví dụ em nhớ nhất (chuỗi thức ăn, sự cộng sinh); bài học: tôn trọng quy luật tự nhiên, không can thiệp thô bạo; liên hệ việc làm của em với vật nuôi, cây trồng quanh nhà."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bài thơ “Trái Đất” sử dụng ngôn ngữ của dân tộc nào khi sáng tác?", "options": ["A. Tiếng Nga", "B. Tiếng Việt", "C. Tiếng A-va", "D. Tiếng Pháp"], "answer": "C", "explain": "Gam-da-tốp viết bằng tiếng mẹ đẻ A-va; tác phẩm đến với bạn đọc Việt Nam qua bản dịch của Minh Tâm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Học cách có mặt trên hành tinh này” (Ét-ga Mô-ranh) được dùng làm lời dẫn cho bài học nào?", "options": ["A. Bài 8: Khác biệt và gần gũi", "B. Bài 1: Tôi và các bạn", "C. Bài 4: Quê hương yêu dấu", "D. Bài 9: Trái Đất – ngôi nhà chung"], "answer": "D", "explain": "Câu nói của nhà tư tưởng Pháp Ét-ga Mô-ranh (Edgar Morin) mở đầu bài 9, gợi ý con người phải biết sống hài hòa, có trách nhiệm với Trái Đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số liệu “hơn 40% sản lượng sơ cấp của hành tinh” trong đoạn trích sách bài tập bài 9 cho thấy điều gì?", "options": ["A. Mức độ con người sử dụng, chi phối tài nguyên của Trái Đất là rất lớn", "B. Con người hầu như không tác động đến Trái Đất", "C. Động vật hoang dã đang tăng nhanh", "D. Trái Đất còn rất nhiều tài nguyên chưa dùng đến"], "answer": "A", "explain": "Đoạn trích (trích “Thế giới sẽ ra sao?”) dùng số liệu cụ thể để chứng minh sự thống trị của con người và những hậu quả đối với muôn loài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phần 4 khẳng định con người là “đỉnh cao kì diệu của sự sống”, phần 5 lại chỉ ra những tổn thương con người gây cho Trái Đất. Hai phần có mâu thuẫn không? Vì sao?", "options": ["A. Có mâu thuẫn, tác giả viết tùy tiện không suy nghĩ", "B. Không mâu thuẫn: vì có trí tuệ và sức mạnh lớn nhất nên hành vi thiếu ý thức của con người gây hậu quả nghiêm trọng nhất; vị thế cao đi kèm trách nhiệm lớn", "C. Có mâu thuẫn, vì con người không thể vừa cao quý vừa gây hại", "D. Không liên quan gì đến nhau"], "answer": "B", "explain": "Hai phần bổ sung cho nhau: khẳng định giá trị của con người để từ đó nhắc nhở trách nhiệm tương xứng của con người với hành tinh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiện tượng ong thụ phấn cho hoa, chim ăn sâu bảo vệ mùa màng cho thấy điều gì về sự chung sống của các loài?", "options": ["A. Các loài chỉ biết cạnh tranh với nhau", "B. Con người không cần quan tâm tới các loài nhỏ bé", "C. Các loài hỗ trợ, nương tựa vào nhau; lợi ích của loài này gắn liền với sự sống còn của loài khác", "D. Thiên nhiên vận hành hoàn toàn ngẫu nhiên, không quy luật"], "answer": "C", "explain": "Đó là những ví dụ về quan hệ cộng sinh, tương hỗ – nền tảng của sự cân bằng trong thế giới sống mà văn bản đã trình bày.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ở khổ 1, nhà thơ dùng hình ảnh “quả dưa”, “quả bóng” thay vì miêu tả trực tiếp hành vi phá hoại Trái Đất?", "options": ["A. Vì nhà thơ rất thích ăn dưa và chơi bóng", "B. Vì tả trực tiếp thì bài thơ sẽ quá ngắn", "C. Vì tác giả không biết những hành vi phá hoại cụ thể", "D. Vì hình ảnh quen thuộc, dễ hình dung làm nổi bật thái độ coi thường, tham lam của kẻ phá hoại và gây ấn tượng mạnh cho người đọc"], "answer": "D", "explain": "So sánh Trái Đất thiêng liêng với những đồ vật tầm thường bị giành giật, chà đạp là cách tố cáo đầy hình tượng và cảm xúc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về cấu trúc của văn bản “Trái Đất – cái nôi của sự sống”:", "statements": ["a) Phần 1 giới thiệu vị trí của Trái Đất trong hệ Mặt Trời.", "b) Phần 3 nói về sự sống phong phú trên Trái Đất.", "c) Phần 4 khẳng định con người là đỉnh cao kì diệu của sự sống.", "d) Phần 5 ca ngợi Trái Đất đang khỏe mạnh, không có vấn đề gì."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phần 5 nói về hiện trạng đáng lo ngại của Trái Đất.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về chủ đề và hình thức các văn bản bài 9:", "statements": ["a) Hai văn bản thông tin và bài thơ cùng chung chủ đề Trái Đất.", "b) Bài thơ “Trái Đất” thuộc loại văn bản thông tin.", "c) Văn bản “Các loài chung sống với nhau như thế nào?” là văn bản thông tin.", "d) Ba văn bản cùng hướng tới kêu gọi bảo vệ môi trường sống."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: đó là văn bản văn học (thơ trữ tình). c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày suy nghĩ của em về biến đổi khí hậu và những biểu hiện của nó ở quê em.", "points": 0, "explain": "Gợi ý: nêu biểu hiện cụ thể (nắng nóng kéo dài, mưa bão thất thường, hạn hán/ngập lụt); nguyên nhân gắn với hoạt động của con người; tác hại với đời sống, sản xuất; việc học sinh có thể làm để giảm nhẹ và thích ứng."}, {"type": "essay", "level": "VDC", "q": "Viết một đoạn văn ngắn (5 – 7 câu) gửi gắm lời nhắn của em tới “Trái Đất – ngôi nhà chung” trong vai một người bạn nhỏ của hành tinh.", "points": 0, "explain": "Gợi ý: mở đầu bằng lời chào, lời cảm ơn Trái Đất (cho không khí, nước, thức ăn, cảnh đẹp); bày tỏ sự xót xa trước những tổn thương của hành tinh; hứa những việc làm cụ thể; kết đoạn: lời chúc và quyết tâm giữ hành tinh xanh."}]}]}
