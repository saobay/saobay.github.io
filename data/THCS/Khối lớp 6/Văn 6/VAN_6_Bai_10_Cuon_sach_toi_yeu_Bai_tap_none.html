 cùng đọc", "B. Góc lớp dùng để cất cặp sách", "C. Bàn của giáo viên chủ nhiệm", "D. Tủ kính trong thư viện trường"], "answer": "A", "explain": "Học sinh mang sách đến lớp, tạo góc đọc sách để mọi người cùng lựa chọn, trao đổi sách với nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thẻ đọc sách giúp em đọc sâu hơn như thế nào?", "options": ["A. Giúp em đọc nhanh gấp đôi bình thường", "B. Buộc em dừng lại suy nghĩ, ghi lại điều ấn tượng và câu hỏi của mình, nhờ đó hiểu và nhớ cuốn sách lâu hơn", "C. Giúp em không cần đọc hết cuốn sách", "D. Chỉ giúp em đánh dấu trang đang đọc"], "answer": "B", "explain": "Đọc kết hợp ghi chép là đọc chủ động: em vừa tiếp nhận vừa đối thoại với cuốn sách qua thẻ đọc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lời trăng trối của Dế Choắt để lại cho Dế Mèn bài học gì?", "options": ["A. Phải luôn trêu chọc kẻ yếu để tỏ ra mạnh mẽ", "B. Không nên kết bạn với ai để tránh rắc rối", "C. Ở đời không được hung hăng bậy bạ, có đầu óc phải biết suy nghĩ, nếu không sớm muộn cũng mang vạ vào mình", "D. Sức mạnh là điều quan trọng nhất trong cuộc sống"], "answer": "C", "explain": "Đó là “bài học đường đời đầu tiên” bằng xương máu, mở đầu cho sự trưởng thành của Dế Mèn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cái chết của Dế Choắt khiến Dế Mèn ân hận suốt đời?", "options": ["A. Vì Dế Mèn bị mọi người trách mắng quá nhiều", "B. Vì Dế Mèn mất đi người bạn cùng chơi", "C. Vì chị Cốc dọa sẽ quay lại trả thù", "D. Vì chính trò đùa ác và thói kiêu căng của mình đã gây ra cái chết oan cho người bạn hiền lành, yếu đuối"], "answer": "D", "explain": "Sự ân hận xuất phát từ việc nhận ra hậu quả của lối sống hung hăng, thiếu suy nghĩ – hạt nhân ý nghĩa của tác phẩm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về danh mục sách và thẻ đọc sách:", "statements": ["a) Danh mục sách cần ghi tên sách, tác giả, nhà xuất bản, năm xuất bản.", "b) Có thể phân loại sách trong danh mục theo chủ đề hoặc lĩnh vực.", "c) Thẻ đọc sách chỉ dùng để đánh dấu trang, không cần ghi chép.", "d) Thẻ đọc giúp ghi lại nhân vật, sự việc ấn tượng và cảm nghĩ khi đọc."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: thẻ đọc là công cụ ghi chép trong khi đọc. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nhà văn Tô Hoài:", "statements": ["a) Tô Hoài tên khai sinh là Nguyễn Sen.", "b) Bút danh Tô Hoài gắn với sông Tô Lịch và phủ Hoài Đức.", "c) Ông sinh năm 1920 và mất năm 2014.", "d) “Dế Mèn phiêu lưu kí” là tác phẩm của Nguyễn Nhật Ánh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đó là tác phẩm của Tô Hoài.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu cảm nghĩ của em về nhân vật Dế Choắt trong “Dế Mèn phiêu lưu kí”.", "points": 0, "explain": "Gợi ý: giới thiệu nhân vật (ốm yếu, hiền lành, tốt bụng); cảm nghĩ về số phận của Choắt (thương xót); nhận xét về lời trăng trối đầy bao dung và sâu sắc; bài học em rút ra về cách đối xử với người yếu thế."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu giới thiệu tác giả em yêu thích nhất (tiểu sử tóm tắt và một trích dẫn hoặc tác phẩm em thích).", "points": 0, "explain": "Gợi ý: nêu tên tác giả, quê quán, năm sinh – năm mất (nếu có); tóm tắt vài nét chính về cuộc đời, sự nghiệp; giới thiệu tác phẩm tiêu biểu em đã đọc; nêu lí do em yêu thích tác giả; có thể dẫn một chi tiết/câu văn em nhớ nhất."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Một danh mục sách đầy đủ cần có những thông tin nào?", "options": ["A. Tên sách, tác giả, nhà xuất bản, năm xuất bản", "B. Chỉ cần tên sách là đủ", "C. Giá tiền của từng cuốn sách", "D. Số trang và khổ giấy của sách"], "answer": "A", "explain": "Những thông tin bắt buộc của danh mục sách: tên sách, tên tác giả, nhà xuất bản và năm xuất bản; có thể phân loại theo chủ đề hoặc lĩnh vực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thẻ đọc sách được dùng để làm gì trong khi đọc?", "options": ["A. Để kẹp sách đánh dấu trang là chính, không cần ghi chép", "B. Ghi lại những điều cần nhớ và cảm nhận trong quá trình đọc: nhân vật, sự việc ấn tượng, câu văn hay, suy nghĩ của em", "C. Để trang trí bìa sách", "D. Để cho bạn mượn kèm theo sách"], "answer": "B", "explain": "Thẻ đọc giúp em đọc chủ động và sâu: vừa đọc vừa ghi, sau này dễ dàng giới thiệu lại cuốn sách cho bạn bè.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả của “Dế Mèn phiêu lưu kí” là ai?", "options": ["A. Nguyễn Nhật Ánh", "B. Thạch Lam", "C. Tô Hoài", "D. Nam Cao"], "answer": "C", "explain": "“Dế Mèn phiêu lưu kí” (1941) là tác phẩm nổi tiếng nhất của nhà văn Tô Hoài, viết về thế giới loài vật cho thiếu nhi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn thuyết phục bạn cùng đọc cuốn sách mình yêu thích, em cần làm rõ hai điều gì trước tiên?", "options": ["A. Số tiền em đã bỏ ra mua sách và nơi bán sách", "B. Tên tất cả các nhân vật phụ trong sách", "C. Số điểm em được khi đọc xong sách", "D. Điều đặc biệt nhất của cuốn sách và lí do vì sao nên đọc cuốn sách ấy"], "answer": "D", "explain": "Bài giới thiệu thuyết phục phải trả lời được câu hỏi của người nghe: sách có gì đặc biệt và tôi được gì khi đọc nó?", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận xét nào sau đây là một lí lẽ trong nghị luận văn học về “Dế Mèn phiêu lưu kí”?", "options": ["A. “Nhân vật Dế Mèn có tính cách phát triển rõ rệt: từ kiêu căng, hống hách đến biết ân hận, yêu thương, giúp đỡ bạn bè”", "B. “Truyện có mười chương”", "C. “Sách dày hơn một trăm trang”", "D. “Bìa sách in hình một chú dế”"], "answer": "A", "explain": "Đó là nhận xét có tính khái quát về nhân vật – một lí lẽ; muốn chứng minh, người viết sẽ dẫn các sự việc trong truyện làm bằng chứng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi hai nhóm cùng đọc một cuốn sách, việc so sánh điểm tương đồng và khác biệt trong cách hiểu của hai nhóm có ích gì?", "options": ["A. Giúp phân định nhóm nào giỏi hơn để xếp hạng", "B. Giúp mỗi nhóm nhìn cuốn sách từ nhiều góc, hiểu sâu và phong phú hơn", "C. Không có ích gì vì mỗi người hiểu một kiểu", "D. Chỉ để kéo dài thời gian trình bày"], "answer": "B", "explain": "Cùng một trang sách, mỗi người một cảm nhận; trao đổi, so sánh làm cho việc đọc trở thành hoạt động cộng đồng giàu ý nghĩa.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về “Dế Mèn phiêu lưu kí”:", "statements": ["a) Tác phẩm xuất bản lần đầu năm 1941.", "b) Nhân vật chính của truyện là Dế Mèn.", "c) Dế Choắt chết vì bị chị Cốc mổ sau trò đùa ác của Dế Mèn.", "d) Truyện thuộc thể loại truyện trinh thám."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: truyện thuộc thể loại truyện đồng thoại viết cho thiếu nhi.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về bài học của Dế Mèn:", "statements": ["a) Cái chết của Dế Choắt là bài học đường đời đầu tiên của Dế Mèn.", "b) Lời trăng trối của Dế Choắt khuyên người ta sống hung hăng, bậy bạ.", "c) Dế Mèn ân hận vì thói kiêu căng, thiếu suy nghĩ của mình.", "d) Qua các chuyến phiêu lưu, Dế Mèn dần trưởng thành, biết yêu thương, giúp đỡ bạn bè."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: lời trăng trối khuyên đừng hung hăng bậy bạ, có óc phải biết nghĩ. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày “bài học từ trang sách” đọng lại sâu nhất trong em sau khi đọc một cuốn sách.", "points": 0, "explain": "Gợi ý: nêu tên sách, tác giả; tóm tắt ngắn gọn chi tiết/sự việc gợi ra bài học; trình bày bài học bằng lời của em; liên hệ với việc làm, suy nghĩ của bản thân sau khi đọc; kết đoạn: tình cảm của em với cuốn sách."}, {"type": "essay", "level": "VDC", "q": "Viết một bài văn ngắn trình bày ý kiến của em về hiện tượng nghiện điện thoại, xa rời sách vở ở học sinh hiện nay.", "points": 0, "explain": "Gợi ý: mở bài nêu hiện tượng và ý kiến; thân bài: thực trạng, nguyên nhân, tác hại (sức khỏe, học tập, mất thói quen đọc); so sánh với lợi ích của đọc sách (dẫn một cuốn sách/graphic em yêu thích làm bằng chứng); đề xuất giải pháp cân bằng; kết bài khẳng định."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "“Dế Mèn phiêu lưu kí” được xuất bản lần đầu vào năm nào?", "options": ["A. Năm 1954", "B. Năm 1975", "C. Năm 1941", "D. Năm 2000"], "answer": "C", "explain": "Tác phẩm ra mắt năm 1941 tại Hà Nội, đến nay vẫn là cuốn sách thiếu nhi được nhiều thế hệ yêu thích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân vật chính của “Dế Mèn phiêu lưu kí” là ai?", "options": ["A. Dế Choắt", "B. Chị Cốc", "C. Xén Tóc", "D. Dế Mèn"], "answer": "D", "explain": "Câu chuyện theo chân Dế Mèn từ thuở non trẻ, kiêu căng đến khi trưởng thành qua bao chuyến phiêu lưu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dế Choắt trong truyện là nhân vật như thế nào?", "options": ["A. Hàng xóm ốm yếu, hiền lành của Dế Mèn, chết oan vì trò đùa ác của Dế Mèn", "B. Người bạn đồng hành suốt đời của Dế Mèn", "C. Kẻ thù nguy hiểm nhất của Dế Mèn", "D. Anh ruột của Dế Mèn"], "answer": "A", "explain": "Cái chết của Dế Choắt là “bài học đường đời đầu tiên” khiến Dế Mèn ân hận và thay đổi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao em nên đọc kĩ và đọc hết cuốn sách trước khi đứng giới thiệu trước lớp?", "options": ["A. Vì giáo viên sẽ kiểm tra số trang đã đọc", "B. Vì chỉ khi hiểu thật cuốn sách, em mới giới thiệu đúng, trả lời được câu hỏi và thuyết phục được người nghe", "C. Vì đọc hết sách thì không cần chuẩn bị gì thêm", "D. Vì bạn bè chỉ quan tâm em đọc nhanh hay chậm"], "answer": "B", "explain": "Giới thiệu sách là “làm chứng” cho giá trị của cuốn sách; hiểu biết hời hợt sẽ làm bài giới thiệu thiếu sức thuyết phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhan đề “Cho tôi xin một vé đi tuổi thơ” gợi cho người đọc cảm xúc gì?", "options": ["A. Ý muốn mua vé tàu đi du lịch", "B. Nỗi buồn vì không có tiền mua vé", "C. Sự khao khát được trở về tuổi thơ trong trẻo, hồn nhiên đã qua", "D. Sự tiếc nuối vì một chuyến đi bị lỡ"], "answer": "C", "explain": "Nhan đề hình tượng biến tuổi thơ thành một chuyến tàu chỉ đi một chiều – gợi tò mò và đồng cảm ngay từ trước khi mở sách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phần mở đầu của một cuốn sách có vai trò quan trọng như thế nào?", "options": ["A. Không quan trọng, có thể bỏ qua khi đọc", "B. Chỉ là phần in tên tác giả và nhà xuất bản", "C. Là phần khó đọc nhất của cuốn sách", "D. Là “cửa ngõ” dẫn vào thế giới của sách, quyết định người đọc có muốn đi tiếp hay không"], "answer": "D", "explain": "Đọc và cảm nhận sách bắt đầu từ mở đầu: một mở đầu hấp dẫn sẽ giữ chân người đọc đến trang cuối cùng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về việc giới thiệu một cuốn sách:", "statements": ["a) Cần nêu rõ tên sách và tên tác giả ngay từ đầu.", "b) Nên nêu điều đặc biệt nhất của cuốn sách để gây hứng thú.", "c) Chưa đọc sách vẫn có thể giới thiệu thuyết phục như người đã đọc.", "d) Cần cho người nghe biết lí do vì sao nên đọc cuốn sách ấy."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phải đọc thật, hiểu thật mới giới thiệu đúng và thuyết phục. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về sản phẩm minh họa sách:", "statements": ["a) Pô-xtơ minh họa là một sản phẩm của dự án đọc sách.", "b) Có thể xây dựng đoạn phim ngắn để giới thiệu cuốn sách.", "c) Pô-xtơ giới thiệu sách không cần ghi tên cuốn sách.", "d) Sản phẩm minh họa giúp cuốn sách đến gần hơn với người đọc."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: tên sách là thông tin không thể thiếu trên pô-xtơ. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu thuyết phục bạn thân của em đọc cuốn “Dế Mèn phiêu lưu kí”.", "points": 0, "explain": "Gợi ý: mở đầu bằng một chi tiết gây tò mò (bài học đường đời đầu tiên); giới thiệu thế giới loài vật sống động, những chuyến phiêu lưu hấp dẫn; nêu giá trị bài học về tình bạn, sự trưởng thành; kết đoạn: lời rủ rê thân tình."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể về trải nghiệm của em với góc đọc sách của lớp trong dự án “Cuốn sách tôi yêu”.", "points": 0, "explain": "Gợi ý: giới thiệu góc đọc sách (ở đâu, có những cuốn gì); kể một lần em chọn được cuốn sách hay nhờ bạn giới thiệu; cảm xúc khi đọc và chia sẻ; điều em mong muốn cho góc đọc sách của lớp ngày càng phong phú."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Ai là người đã bày trò trêu chị Cốc, gây ra cái chết của Dế Choắt?", "options": ["A. Dế Mèn", "B. Dế Trũi", "C. Châu Chấu Voi", "D. Bọ Ngựa"], "answer": "A", "explain": "Vì thói hung hăng, bậy bạ và thích đùa ác, Dế Mèn đã rủ Dế Choắt trêu chị Cốc; hậu quả là Choắt bị Cốc mổ chết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả của cuốn sách “Cho tôi xin một vé đi tuổi thơ” là ai?", "options": ["A. Tô Hoài", "B. Nguyễn Nhật Ánh", "C. Nguyễn Ngọc Thuần", "D. Trần Đăng Khoa"], "answer": "B", "explain": "Nguyễn Nhật Ánh là nhà văn chuyên viết cho tuổi thơ, học trò, với nhiều tác phẩm được yêu thích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả của “Vừa nhắm mắt vừa mở cửa sổ” là ai?", "options": ["A. Nguyễn Nhật Ánh", "B. Tô Hoài", "C. Nguyễn Ngọc Thuần", "D. Võ Quảng"], "answer": "C", "explain": "Đây là tác phẩm nổi tiếng của nhà văn Nguyễn Ngọc Thuần, giàu chất thơ về thế giới tuổi thơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "“Thế giới từ trang sách” trong phần cảm nhận sách có nghĩa là gì?", "options": ["A. Danh sách các địa danh có thật trên bản đồ", "B. Những bức tranh in trong sách", "C. Tên các chương của cuốn sách", "D. Những con người, vùng đất, sự việc mà em được gặp gỡ, trải nghiệm qua cuốn sách đã đọc"], "answer": "D", "explain": "Qua trang sách, em “đi” đến những nơi chưa từng đến, “gặp” những con người chưa từng gặp – đó là phép màu của việc đọc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "“Bài học từ trang sách” khác với “tóm tắt nội dung sách” ở điểm nào?", "options": ["A. Bài học là điều còn đọng lại, làm thay đổi suy nghĩ, tình cảm của em sau khi đọc; tóm tắt chỉ kể lại sự việc trong sách", "B. Hai việc này hoàn toàn giống nhau", "C. Bài học từ trang sách chỉ có trong sách giáo khoa", "D. Tóm tắt lúc nào cũng dài hơn bài học"], "answer": "A", "explain": "Cảm nhận sách đi từ kể lại (tóm tắt) đến rung động và rút ra ý nghĩa cho bản thân – đó mới là đọc sâu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài viết ý kiến gợi ra từ cuốn sách khác bài cảm nghĩ về cuốn sách ở điểm nào?", "options": ["A. Bài viết ý kiến không được nhắc đến cuốn sách", "B. Từ một chi tiết, nhân vật trong sách, người viết bàn tới một hiện tượng ngoài đời sống và bảo vệ ý kiến bằng lí lẽ, bằng chứng cả trong sách lẫn đời sống", "C. Bài cảm nghĩ luôn dài hơn bài viết ý kiến", "D. Hai kiểu bài hoàn toàn giống nhau"], "answer": "B", "explain": "Ví dụ: từ thói hung hăng của Dế Mèn, em bàn về hiện tượng bắt nạt trong học đường – đó là cách viết đặc trưng của bài 10.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về các tác giả, tác phẩm thiếu nhi quen thuộc:", "statements": ["a) “Cho tôi xin một vé đi tuổi thơ” là của Nguyễn Nhật Ánh.", "b) “Vừa nhắm mắt vừa mở cửa sổ” là của Nguyễn Ngọc Thuần.", "c) “Hoàng tử bé” là tác phẩm của nhà văn Pháp Xanh-tê-xu-pê-ri.", "d) “Dế Mèn phiêu lưu kí” được viết bởi Thạch Lam."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tác giả là Tô Hoài.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phần viết của bài 10:", "statements": ["a) Bài viết trình bày ý kiến về một hiện tượng đời sống được gợi ra từ cuốn sách đã đọc.", "b) Mở bài giới thiệu tên sách, tác giả và hiện tượng đời sống cuốn sách gợi ra.", "c) Thân bài chỉ cần chép lại toàn bộ nội dung cuốn sách.", "d) Kết bài nêu ý nghĩa, tầm quan trọng của vấn đề được bàn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: thân bài nêu ý kiến kèm lí lẽ, bằng chứng; chi tiết sách chỉ là điểm gợi mở. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết một bài nghị luận văn học ngắn (khoảng 7 – 10 câu) nhận xét về sự thay đổi tính cách của nhân vật Dế Mèn trong truyện.", "points": 0, "explain": "Gợi ý: nêu nhận xét khái quát (Dế Mèn trưởng thành rõ rệt); bằng chứng theo chặng đường: thuở kiêu căng gây ra cái chết của Dế Choắt – những ngày bị bắt làm đồ chơi, được Xén Tóc cứu – chuyến phiêu lưu cùng Dế Trũi, biết giúp đỡ kẻ yếu; kết luận về nghệ thuật xây dựng nhân vật của Tô Hoài."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày ý kiến của em về câu nói: “Sách mở ra trước mắt tôi những chân trời mới”.", "points": 0, "explain": "Gợi ý: giải thích hình ảnh “chân trời mới” (tri thức, vùng đất, con người, cảm xúc chưa từng biết); dẫn chứng bằng một cuốn sách cụ thể đã mở ra cho em một “chân trời”; kết đoạn: khẳng định giá trị của thói quen đọc sách."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "“Hoàng tử bé” là tác phẩm của nhà văn nước nào?", "options": ["A. Của nhà văn Anh", "B. Của nhà văn Nga", "C. Của nhà văn Pháp Xanh-tê-xu-pê-ri (Saint-Exupéry)", "D. Của nhà văn Việt Nam"], "answer": "C", "explain": "“Hoàng tử bé” là truyện triết lí nổi tiếng thế giới dành cho cả trẻ em và người lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bút danh Tô Hoài gắn với những địa danh nào?", "options": ["A. Sông Hồng và núi Ba Vì", "B. Hồ Gươm và cầu Thê Húc", "C. Sông Lam và núi Hồng Lĩnh", "D. Sông Tô Lịch và phủ Hoài Đức"], "answer": "D", "explain": "Tô Hoài (1920 – 2014), tên khai sinh Nguyễn Sen, quê ở Thanh Oai, Hà Đông cũ; bút danh của ông ghép từ hai địa danh quê hương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tên khai sinh của nhà văn Tô Hoài là gì?", "options": ["A. Nguyễn Sen", "B. Nguyễn Tường Vinh", "C. Nguyễn Văn Tài", "D. Nguyễn Khắc Viện"], "answer": "A", "explain": "Nguyễn Sen là tên khai sinh của Tô Hoài; ông làm nhiều nghề kiếm sống trước khi trở thành nhà văn lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi chọn sách cho nhóm theo một chủ đề đã học, tiêu chí nào quan trọng nhất?", "options": ["A. Sách càng dày càng tốt bất kể nội dung", "B. Sách đúng chủ đề, phù hợp lứa tuổi, có giá trị nội dung và cả nhóm đều hứng thú đọc", "C. Sách nào rẻ nhất thì chọn", "D. Chỉ chọn sách mà giáo viên đã đọc"], "answer": "B", "explain": "Đúng chủ đề giúp sản phẩm của nhóm gắn với bài học; hứng thú chung giúp mọi thành viên cùng đọc thật sự.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi trình bày ý kiến về hiện tượng gợi ra từ cuốn sách, chi tiết trong sách đóng vai trò gì?", "options": ["A. Chỉ là phần trang trí cho bài nói", "B. Không có vai trò gì, có thể bỏ qua", "C. Là bằng chứng mở đầu, gợi ra và soi sáng cho hiện tượng đời sống mà em bàn luận", "D. Là phần kết luận của bài nói"], "answer": "C", "explain": "Chi tiết sách là “cầu nối” giữa văn học và đời sống; từ đó em triển khai lí lẽ, bằng chứng thực tế để bảo vệ ý kiến.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao tìm hiểu về cuộc đời, sự nghiệp của tác giả lại giúp em hiểu tác phẩm hơn?", "options": ["A. Vì biết tiểu sử thì không cần đọc tác phẩm nữa", "B. Vì mọi tác phẩm đều kể về chính cuộc đời tác giả", "C. Vì đó là phần dễ học thuộc nhất", "D. Vì hoàn cảnh sống và quan điểm của tác giả thường in dấu trong tác phẩm; hiểu tác giả sẽ hiểu sâu hơn điều tác phẩm muốn nói"], "answer": "D", "explain": "Ví dụ: biết Tô Hoài từng trải qua tuổi thơ nghèo khó và yêu thế giới loài vật, ta hiểu vì sao “Dế Mèn phiêu lưu kí” gần gũi, nhân hậu đến vậy.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về hoạt động nói và nghe bài 10:", "statements": ["a) Người nói giới thiệu sản phẩm minh họa sách của nhóm mình.", "b) Người nói trình bày ý kiến về một vấn đề đời sống gợi ra từ cuốn sách.", "c) Người nghe không cần ghi chép hay đặt câu hỏi gì.", "d) Bài nói cần có mở đầu và kết thúc hợp lí, giọng nói rõ ràng, truyền cảm."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: nghe tích cực đòi hỏi theo dõi, ghi chép và trao đổi. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về cách đọc và cảm nhận một cuốn sách:", "statements": ["a) Cần chú ý nhan đề của cuốn sách và suy nghĩ vì sao tác giả đặt nhan đề ấy.", "b) Phần mở đầu của sách không đáng để tâm vì chưa vào truyện.", "c) Qua trang sách, em có thể gặp gỡ nhiều con người và vùng đất mới.", "d) Điều còn đọng lại trong tâm trí sau khi đọc là một phần của cảm nhận sách."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: mở đầu là cửa ngõ của cuốn sách, rất đáng chú ý. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu giới thiệu một cuốn sách về thế giới cổ tích mà em muốn đưa vào góc đọc sách của lớp.", "points": 0, "explain": "Gợi ý: nêu tên truyện/sách, thuộc chủ đề Thế giới cổ tích; tóm tắt cốt truyện vài câu; nêu nhân vật hoặc chi tiết em thích nhất và bài học của truyện; lí do cuốn sách xứng đáng có mặt trong góc đọc sách."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày suy nghĩ của em về thói quen đọc sách mỗi ngày.", "points": 0, "explain": "Gợi ý: nêu ý kiến (đọc mỗi ngày là thói quen quý); lợi ích: tích lũy tri thức, giàu vốn từ, rèn tập trung, nuôi dưỡng tâm hồn; dẫn chứng từ bản thân hoặc người em biết; cách em sắp xếp thời gian đọc; kết đoạn: lời nhắn cho các bạn."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Sản phẩm minh họa cho cuốn sách trong dự án có thể là những gì?", "options": ["A. Pô-xtơ minh họa, đoạn phim ngắn giới thiệu sách", "B. Bản nhạc phổ thơ", "C. Tranh thêu tay", "D. Mô hình nhà ở"], "answer": "A", "explain": "Sau khi đọc, mỗi nhóm thể hiện sản phẩm như pô-xtơ minh họa cho sách hoặc xây dựng đoạn phim ngắn để giới thiệu sách tới các nhóm khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phần viết của bài 10 yêu cầu em viết kiểu bài nào?", "options": ["A. Bài văn tả người thân", "B. Bài văn trình bày ý kiến về một hiện tượng đời sống được gợi ra từ cuốn sách đã đọc", "C. Truyện ngắn tự sáng tác", "D. Đoạn văn chép lại nội dung cuốn sách"], "answer": "B", "explain": "Bài 10 nối tiếp kĩ năng nghị luận của bài 8: từ cuốn sách đã đọc, em rút ra một hiện tượng đời sống và trình bày ý kiến của mình về hiện tượng đó.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hoạt động nói và nghe của bài 10 gồm những nội dung nào?", "options": ["A. Kể lại toàn bộ cuốn sách từ đầu đến cuối", "B. Thi đọc diễn cảm thơ", "C. Giới thiệu sản phẩm minh họa sách và trình bày ý kiến về một vấn đề đời sống gợi ra từ cuốn sách", "D. Thảo luận về ô nhiễm môi trường"], "answer": "C", "explain": "Người nói giới thiệu sản phẩm của nhóm và bày tỏ ý kiến; người nghe theo dõi, nhận xét, đặt câu hỏi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giới thiệu sách khác với quảng cáo bán sách ở mục đích nào?", "options": ["A. Hai việc hoàn toàn giống nhau về mục đích", "B. Giới thiệu sách chỉ dành cho giáo viên", "C. Quảng cáo sách luôn trung thực hơn giới thiệu", "D. Giới thiệu sách nhằm chia sẻ giá trị của cuốn sách và khơi gợi niềm yêu đọc; quảng cáo nhằm bán được hàng"], "answer": "D", "explain": "Bài giới thiệu trong dự án là hoạt động học tập: trung thực với cảm nhận của mình và hướng tới cộng đồng người đọc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nghe bạn giới thiệu sách, thái độ nghe như thế nào là tốt?", "options": ["A. Chăm chú lắng nghe, ghi lại điểm hay và câu hỏi muốn trao đổi, nhận xét chân thành, tôn trọng", "B. Nghe qua loa vì mình sẽ giới thiệu sách khác", "C. Chỉ chờ bắt lỗi bạn để trừ điểm", "D. Nói chuyện riêng trong lúc bạn trình bày"], "answer": "A", "explain": "Nghe tích cực giúp buổi chia sẻ sách thành công và giúp chính em chọn được cuốn sách tiếp theo cho mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu danh ngôn “Để cho con một hòm vàng không bằng dạy cho con một quyển sách hay” nhắc nhở điều gì?", "options": ["A. Cha mẹ không nên tiết kiệm tiền cho con", "B. Giá trị của việc đọc sách đối với mỗi người còn quý hơn của cải vật chất", "C. Sách hay lúc nào cũng đắt tiền", "D. Vàng không có giá trị trong cuộc sống"], "answer": "B", "explain": "Danh ngôn đề cao tri thức và thói quen đọc – tài sản bền vững nhất mà người lớn có thể trao cho trẻ em.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về lựa chọn sách trong dự án:", "statements": ["a) Các nhóm chọn sách gắn với các chủ đề đã học trong năm.", "b) Mỗi nhóm chỉ được chọn đúng một chủ đề duy nhất trong mười bài học.", "c) Sách được chọn cần phù hợp với lứa tuổi và có giá trị nội dung.", "d) Cả nhóm nên cùng đọc cuốn sách đã chọn để cùng làm sản phẩm."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: mỗi nhóm lựa chọn hai trong số các chủ đề đã học. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về ích lợi của việc đọc sách:", "statements": ["a) Đọc sách mở ra trước mắt người đọc những chân trời mới.", "b) Đọc sách chỉ có ích cho môn Ngữ văn.", "c) Thói quen đọc sách mỗi ngày giúp tích lũy tri thức và vốn từ.", "d) Chia sẻ sách hay giúp lan tỏa văn hóa đọc trong lớp học."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng – ý của danh ngôn Go-rơ-ki. b) Sai: đọc sách có ích cho mọi môn học và đời sống. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết một bài văn ngắn trình bày ý kiến về hiện tượng nhiều bạn chỉ đọc truyện tranh, ngại đọc sách chữ.", "points": 0, "explain": "Gợi ý: mở bài nêu hiện tượng và ý kiến (cần cân bằng, không nên ngại sách chữ); thân bài: lí lẽ (truyện tranh có ích nhưng sách chữ rèn tưởng tượng, vốn từ, tư duy sâu); bằng chứng từ trải nghiệm đọc của em; đề xuất cách chuyển dần sang sách chữ (chọn sách mỏng, đúng sở thích); kết bài khẳng định."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu ghi lại cảm nhận của em về phần mở đầu của cuốn sách em đang đọc trong dự án.", "points": 0, "explain": "Gợi ý: giới thiệu tên sách, tác giả; mô tả phần mở đầu (mở ra khung cảnh, nhân vật, câu hỏi nào); nêu chi tiết hoặc câu văn làm em chú ý; dự đoán và mong đợi của em về phần tiếp theo; kết đoạn: cảm xúc muốn đọc tiếp."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Khi bắt đầu giới thiệu một cuốn sách, thông tin nào cần nêu trước tiên?", "options": ["A. Giá bán của cuốn sách", "B. Số lượng sách đã in", "C. Tên cuốn sách và tên tác giả", "D. Tên người đã tặng em cuốn sách"], "answer": "C", "explain": "Tên sách và tác giả là “danh tính” của cuốn sách; sau đó mới đến nhà xuất bản, năm xuất bản, thể loại…", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Đọc và cảm nhận sách” trong dự án gợi ý em nhìn cuốn sách ở những góc nào?", "options": ["A. Bìa trước, bìa sau, gáy sách, mục lục", "B. Giá tiền, số trang, trọng lượng, khổ giấy", "C. Tác giả, dịch giả, họa sĩ, biên tập viên", "D. Nhan đề, mở đầu, thế giới từ trang sách, bài học từ trang sách"], "answer": "D", "explain": "Bốn câu hỏi cảm nhận: vì sao sách có nhan đề ấy? mở đầu có gì đáng chú ý? em đã gặp ai, đến đâu qua trang sách? điều gì còn đọng lại trong em?", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các cuốn sách trong dự án được lựa chọn gắn với điều gì?", "options": ["A. Với các chủ đề đã học trong năm: Tôi và các bạn, Thế giới cổ tích, Khác biệt và gần gũi…", "B. Với danh sách sách bán chạy nhất trên mạng", "C. Với những cuốn sách dày nhất trong thư viện", "D. Với sách do giáo viên chỉ định duy nhất một cuốn"], "answer": "A", "explain": "Mỗi nhóm chọn hai trong số các chủ đề đã học để đọc và giới thiệu sách, giúp việc đọc gắn với bài học cả năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói dự án “Cuốn sách tôi yêu” là hoạt động tổng kết cho cả năm học Ngữ văn 6?", "options": ["A. Vì dự án diễn ra vào cuối năm theo thói quen", "B. Vì dự án quy tụ các kĩ năng đã học: đọc hiểu nhiều thể loại, nghị luận văn học, viết bài trình bày ý kiến, nói và nghe trước tập thể", "C. Vì mọi cuốn sách trong dự án đều do học sinh tự viết", "D. Vì dự án thay cho bài kiểm tra học kì"], "answer": "B", "explain": "Qua dự án, em vận dụng tổng hợp tri thức ngữ văn của mười bài học vào một sản phẩm đọc sách thực tế của chính mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi giới thiệu tác giả yêu thích, vì sao em nên chọn lọc thông tin tiểu sử quan trọng thay vì kể lại toàn bộ cuộc đời tác giả?", "options": ["A. Vì cuộc đời tác giả không có gì đáng nói", "B. Vì kể ít thông tin thì dễ được điểm cao hơn", "C. Vì thời gian trình bày có hạn; thông tin chọn lọc, gắn với tác phẩm sẽ giúp người nghe hiểu đúng và nhớ lâu", "D. Vì tiểu sử tác giả là bí mật không được tiết lộ"], "answer": "C", "explain": "Tiểu sử tóm tắt cần chọn những mốc quan trọng: quê quán, con đường đến với văn chương, tác phẩm tiêu biểu và đóng góp nổi bật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn em nói: “Đọc xong cuốn sách là xong, chẳng cần ghi chép gì”. Theo tinh thần của dự án, ý kiến đúng là gì?", "options": ["A. Bạn nói đúng, ghi chép chỉ làm mất thời gian", "B. Chỉ cần ghi chép khi giáo viên kiểm tra vở", "C. Ghi chép là việc của riêng lớp trưởng", "D. Cần ghi thẻ đọc trong khi đọc và ghi chú sau khi đọc để hiểu sâu, nhớ lâu và giới thiệu lại được cuốn sách"], "answer": "D", "explain": "Ghi chép là khâu không thể thiếu của quy trình đọc trong dự án: thẻ đọc khi đọc, ghi chú và cảm nhận sau khi đọc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về một bài nghị luận văn học ngắn:", "statements": ["a) Bài viết cần có nhận xét rõ ràng về tác phẩm hoặc tác giả.", "b) Nhận xét cần được chứng minh bằng chi tiết trong tác phẩm.", "c) Có thể bịa ra chi tiết không có trong truyện để bài viết sinh động.", "d) Bài viết nên có bố cục rõ ràng: mở, thân, kết."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: bịa chi tiết là sai lệch hoàn toàn với tác phẩm, không thể chấp nhận. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về thói quen đọc sách của học sinh:", "statements": ["a) Nên dành thời gian đọc sách mỗi ngày, dù chỉ vài trang.", "b) Đọc sách chỉ cần đọc lướt bìa và mục lục là đủ hiểu sách.", "c) Ghi chép vào thẻ đọc giúp nhớ lâu những điều đã đọc.", "d) Có thể trao đổi, cho bạn mượn sách để cùng nhau tiến bộ."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: đọc lướt bìa, mục lục không thể thay thế việc đọc nội dung. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu thuyết phục các bạn đóng góp sách cho góc đọc sách của lớp.", "points": 0, "explain": "Gợi ý: nêu ý nghĩa của góc đọc sách chung; lí lẽ: một cuốn sách được nhiều người đọc thì giá trị nhân lên, mọi người đều có sách hay để đọc; cách đóng góp và giữ gìn sách; kết đoạn: lời kêu gọi thân thiện."}, {"type": "essay", "level": "VDC", "q": "Viết một bài văn ngắn trình bày ý kiến về hiện tượng đời sống được gợi ra từ một cuốn sách em đã đọc (tự chọn sách và hiện tượng).", "points": 0, "explain": "Gợi ý dàn ý: mở bài giới thiệu sách, tác giả và hiện tượng; thân bài: nêu ý kiến, trình bày lí lẽ và bằng chứng (chi tiết trong sách + sự việc ngoài đời sống), đề xuất thái độ/giải pháp; kết bài: khẳng định ý nghĩa của vấn đề và của việc đọc sách."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Nghị luận văn học là một bộ phận của loại văn bản lớn nào?", "options": ["A. Văn bản nghị luận", "B. Văn bản thông tin", "C. Văn bản hành chính", "D. Truyện đồng thoại"], "answer": "A", "explain": "Nghị luận văn học là một loại của văn nghị luận; điểm riêng là vấn đề bàn luận thuộc về văn học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi tìm hiểu về một tác giả qua bài nghị luận văn học, em cần nắm những thông tin nào?", "options": ["A. Chiều cao, cân nặng của tác giả", "B. Tiểu sử tóm tắt, các tác phẩm chính và những nhận xét về phong cách, đóng góp của tác giả", "C. Danh sách bạn bè của tác giả", "D. Giá trị tài sản của tác giả"], "answer": "B", "explain": "Hiểu tác giả giúp hiểu tác phẩm sâu hơn; bài nghị luận văn học là nguồn giúp em tiếp cận những nhận xét có căn cứ về tác giả.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một pô-xtơ giới thiệu sách hiệu quả cần có đặc điểm gì?", "options": ["A. Càng nhiều chữ càng tốt, không cần hình ảnh", "B. Chỉ cần vẽ đẹp, không cần ghi tên sách", "C. Hình ảnh hấp dẫn đi kèm thông tin ngắn gọn, rõ ràng về cuốn sách", "D. Phải dùng toàn chữ nước ngoài"], "answer": "C", "explain": "Pô-xtơ là sản phẩm trực quan: nhìn vào là biết cuốn sách gì, hay ở điểm nào và muốn cầm lên đọc ngay.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao pô-xtơ giới thiệu sách thường ít chữ, nhiều hình ảnh và câu chữ phải thật đắt?", "options": ["A. Vì người làm pô-xtơ không biết viết nhiều chữ", "B. Vì in nhiều chữ sẽ tốn mực in", "C. Vì pô-xtơ chỉ dành cho người chưa biết chữ", "D. Vì pô-xtơ tác động trước hết bằng hình ảnh; ít chữ nhưng chọn lọc sẽ gây ấn tượng mạnh và dễ nhớ"], "answer": "D", "explain": "Khác với bài văn, pô-xtơ phải “nói” trong vài giây đầu tiên: hình ảnh nổi bật cộng một vài dòng chữ đắt giá về cuốn sách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điều gì làm nên sức thuyết phục của phần trình bày giới thiệu sản phẩm minh họa sách?", "options": ["A. Sự kết hợp giữa sản phẩm công phu, thông tin chính xác về sách, lời nói rõ ràng, tự tin và dẫn chứng lấy từ chính cuốn sách", "B. Chỉ cần nói thật to và nhanh", "C. Chỉ cần sản phẩm đẹp, không cần nói gì thêm", "D. Chỉ cần thuộc lòng toàn bộ cuốn sách"], "answer": "A", "explain": "Người nghe bị thuyết phục khi thấy nhóm thật sự đã đọc sách: sản phẩm đẹp mắt, giới thiệu đúng và cảm xúc chân thành.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nhóm em bất đồng ý kiến về việc chọn cuốn sách nào để giới thiệu, cách giải quyết hợp lí nhất là gì?", "options": ["A. Bạn nhóm trưởng quyết định một mình", "B. Thảo luận dựa trên các tiêu chí chung (đúng chủ đề, giá trị nội dung, hứng thú của cả nhóm) rồi thống nhất hoặc bỏ phiếu", "C. Chọn cuốn sách dày nhất cho chắc chắn", "D. Bỏ qua, mỗi người giới thiệu một cuốn riêng"], "answer": "B", "explain": "Làm việc nhóm trong dự án cũng là rèn kĩ năng thảo luận: lắng nghe, nêu lí do và tôn trọng quyết định chung.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nhân vật Dế Mèn:", "statements": ["a) Thuở nhỏ, Dế Mèn khỏe mạnh nhưng kiêu căng, hống hách.", "b) Dế Mèn từng bị hai đứa trẻ bắt làm đồ chơi và được anh Xén Tóc cứu.", "c) Dế Mèn kết bạn với Dế Trũi và cùng nhau đi phiêu lưu.", "d) Suốt truyện, Dế Mèn không hề thay đổi tính cách."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tính cách Dế Mèn phát triển rõ rệt qua từng chặng đường – đó là điểm hay của tác phẩm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về mục đích của dự án đọc sách:", "statements": ["a) Dự án giúp hình thành thói quen đọc sách cho học sinh.", "b) Dự án là dịp vận dụng tổng hợp các kĩ năng đọc, viết, nói và nghe đã học.", "c) Dự án bắt buộc học sinh phải mua sách mới bằng tiền của mình.", "d) Sản phẩm của dự án thể hiện sự sáng tạo của mỗi nhóm."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: học sinh có thể mượn sách của nhau, của thư viện để tham gia dự án. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu so sánh điểm giống và khác nhau giữa hai cuốn sách em đã đọc trong dự án.", "points": 0, "explain": "Gợi ý: nêu tên hai cuốn sách, tác giả; chỉ ra điểm tương đồng (chủ đề, đối tượng nhân vật, bài học…); chỉ ra điểm khác biệt (thể loại, cách kể, nhân vật, cảm xúc để lại); kết đoạn: cuốn sách em yêu thích hơn và lí do."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu tưởng tượng em là người làm pô-xtơ giới thiệu sách: hãy viết phần lời cho pô-xtơ về một cuốn sách em yêu thích.", "points": 0, "explain": "Gợi ý: phần lời cần ngắn gọn, hấp dẫn: tên sách, tác giả viết to rõ; một câu giới thiệu “bắt” người đọc (câu hỏi hoặc chi tiết kì thú nhất); hai đến ba lí do nên đọc; lời mời cuối pô-xtơ. Chấm theo tính súc tích, hấp dẫn và đúng thông tin sách."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Mục đích lớn nhất của dự án “Cuốn sách tôi yêu” là gì?", "options": ["A. Bắt học sinh mua thật nhiều sách mới", "B. Chọn ra học sinh đọc nhanh nhất lớp", "C. Giúp học sinh hình thành thói quen đọc sách và biết chia sẻ những cuốn sách hay với bạn bè", "D. Thay thế toàn bộ các bài học trong sách giáo khoa"], "answer": "C", "explain": "Dự án biến việc đọc thành niềm vui được chia sẻ: mỗi em là một người giới thiệu sách cho cộng đồng lớp học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Dế Mèn phiêu lưu kí” thuộc thể loại truyện nào?", "options": ["A. Truyện kiếm hiệp", "B. Truyện trinh thám", "C. Sử thi anh hùng", "D. Truyện đồng thoại (truyện về loài vật, viết cho thiếu nhi)"], "answer": "D", "explain": "Tác phẩm mượn thế giới loài vật để nói chuyện con người, là đỉnh cao của truyện đồng thoại Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nói nổi tiếng “Sách mở ra trước mắt tôi những chân trời mới” là của ai?", "options": ["A. Mác-xim Go-rơ-ki", "B. Tô Hoài", "C. Hồ Chí Minh", "D. Xuân Diệu"], "answer": "A", "explain": "Câu nói của nhà văn Nga Mác-xim Go-rơ-ki thường được nhắc khi nói về lợi ích của việc đọc sách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cùng đọc một cuốn sách, hai bạn lại có thể có cảm nhận khác nhau?", "options": ["A. Vì một trong hai bạn chắc chắn đã đọc sai", "B. Vì mỗi người có trải nghiệm, sở thích và vốn sống khác nhau nên cuốn sách gợi lên những suy nghĩ, rung động khác nhau", "C. Vì cảm nhận chỉ phụ thuộc vào điểm số môn Văn", "D. Vì sách hay thì mọi người phải cảm nhận giống hệt nhau"], "answer": "B", "explain": "Sự phong phú của cảm nhận là điều tự nhiên và quý giá; chia sẻ cảm nhận khác nhau làm cho buổi đọc sách thêm sâu sắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận xét “Hoàng tử bé là cuốn sách viết cho thiếu nhi nhưng người lớn đọc càng thấm thía” thuộc về yếu tố nào của nghị luận văn học?", "options": ["A. Là bằng chứng lấy từ ngoài đời sống", "B. Là sa-pô của cuốn sách", "C. Là một lí lẽ (nhận xét về tác phẩm), cần được chứng minh bằng chi tiết và câu văn trong truyện", "D. Là thông tin xuất bản của cuốn sách"], "answer": "C", "explain": "Đó là nhận xét khái quát về giá trị của tác phẩm; người viết nghị luận sẽ dẫn các chi tiết trong truyện (hoàng tử bé và bông hồng, con cáo…) để làm rõ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi mượn sách của bạn để đọc trong dự án, thái độ nào sau đây là đúng?", "options": ["A. Mượn rồi giữ luôn vì mình thích cuốn sách", "B. Gấp trang, viết lên sách để đánh dấu cho tiện", "C. Trả sách muộn cũng không sao, bạn sẽ quên", "D. Hỏi mượn lịch sự, giữ gìn sách cẩn thận, trả đúng hẹn và chia sẻ lại cảm nhận với bạn sau khi đọc"], "answer": "D", "explain": "Giữ gìn sách của bạn là biểu hiện của văn hóa đọc và sự tôn trọng người cho mượn – cũng là tinh thần của góc đọc sách chung.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau khi nghe bạn giới thiệu sách:", "statements": ["a) Cần lắng nghe chăm chú và ghi lại những điểm đáng chú ý.", "b) Có thể đặt câu hỏi để hiểu thêm về cuốn sách bạn giới thiệu.", "c) Nên chê bai cuốn sách của bạn dù mình chưa đọc.", "d) Nhận xét về bài giới thiệu cần chân thành, tôn trọng người nói."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phê phán phải có căn cứ và thái độ xây dựng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về mối quan hệ giữa văn học và đời sống trong bài 10:", "statements": ["a) Cuốn sách có thể gợi cho người đọc suy nghĩ về một hiện tượng ngoài đời sống.", "b) Chi tiết trong sách có thể làm bằng chứng cho ý kiến về hiện tượng đời sống.", "c) Đọc sách văn học không liên quan gì đến cuộc sống thật.", "d) Từ thói hung hăng của Dế Mèn, ta có thể bàn về hiện tượng bắt nạt trong học đường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: văn học bắt nguồn từ đời sống và soi sáng đời sống. d) Đúng – đó là ví dụ tiêu biểu của bài viết bài 10.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu nêu cảm nghĩ của em sau khi nghe bạn giới thiệu một cuốn sách trong buổi chia sẻ của lớp.", "points": 0, "explain": "Gợi ý: giới thiệu bạn và cuốn sách bạn giới thiệu; điều làm em ấn tượng trong phần trình bày của bạn; cuốn sách ấy gợi cho em mong muốn gì; điều em học được về cách giới thiệu sách; cảm ơn và hẹn trao đổi sách với bạn."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trả lời câu hỏi: Nếu được tặng một cuốn sách cho thư viện lớp, em sẽ chọn cuốn nào? Vì sao?", "points": 0, "explain": "Gợi ý: nêu tên sách, tác giả em chọn; giới thiệu vắn tắt giá trị của sách (nội dung, bài học, độ phù hợp với bạn bè); lí do cuốn sách nên có mặt trong thư viện chung (nhiều bạn cùng đọc được, gắn với bài học); kết đoạn: mong ước về văn hóa đọc của lớp."}]}]}
