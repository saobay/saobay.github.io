", "F", "T", "T"], "explain": "a) Đúng. b) Sai: người em may túi ba gang theo lời chim; người anh mới may túi mười hai gang. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Sọ Dừa\":", "statements": ["a) Sọ Dừa có tài thổi sáo rất hay.", "b) Hai cô chị yêu quý và đối xử tử tế với Sọ Dừa ngay từ đầu.", "c) Trong ngày cưới, Sọ Dừa biến thành chàng trai tuấn tú.", "d) Sọ Dừa thi đỗ trạng nguyên."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: hai cô chị kiêu ngạo, coi thường Sọ Dừa. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại chi tiết em thích nhất trong truyện \"Sọ Dừa\" và nêu lí do.", "points": 0, "explain": "Gợi ý chấm: chọn được chi tiết có ý nghĩa (Sọ Dừa chăn dê giỏi, biến hình trong ngày cưới, đỗ trạng nguyên...); kể lại rõ ràng bằng lời của mình; nêu được lí do yêu thích gắn với thông điệp đừng coi thường người khác qua vẻ bề ngoài."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu bày tỏ suy nghĩ của em về câu nói \"ở hiền gặp lành\" qua các truyện cổ tích đã học trong bài.", "points": 0, "explain": "Gợi ý chấm: giải thích ý nghĩa câu nói; dẫn chứng ít nhất hai truyện (Thạch Sanh, Cây khế, Sọ Dừa); nêu thái độ của em và cách vận dụng bài học vào cuộc sống."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Ai là nhân vật phản diện chính trong truyện \"Thạch Sanh\"?", "options": ["A. Lý Thông", "B. Chằn tinh", "C. Vua Thủy Tề", "D. Hoàng tử các nước chư hầu"], "answer": "A", "explain": "Lý Thông — kẻ kết nghĩa gian xảo — nhiều lần cướp công, hãm hại Thạch Sanh; chằn tinh chỉ là yêu quái bị chàng tiêu diệt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong \"Cây khế\", người em may túi mấy gang theo lời chim thần dặn?", "options": ["A. Túi mười hai gang", "B. Túi ba gang", "C. Túi sáu gang", "D. Túi chín gang"], "answer": "B", "explain": "Chim dặn: \"may túi ba gang, mang đi mà đựng\" — người em nghe lời, chỉ lấy vừa đủ và được sống sung túc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sọ Dừa đi ở cho ai?", "options": ["A. Một vị quan huyện", "B. Nhà vua", "C. Một phú ông giàu có", "D. Một lão đánh cá"], "answer": "C", "explain": "Sọ Dừa xin đi ở chăn dê cho nhà phú ông — nơi chàng gặp ba cô con gái của phú ông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết Thạch Sanh dùng niêu cơm thần để đãi quân mười tám nước chư hầu thể hiện phẩm chất nào của chàng?", "options": ["A. Sự giàu có, khoe khoang", "B. Sự sợ hãi trước quân địch đông đảo", "C. Thói quen thích mở tiệc tùng", "D. Lòng nhân ái, độ lượng và trí tuệ: cảm hóa kẻ thù thay vì chém giết"], "answer": "D", "explain": "Biết quân địch khâm phục trước niêu cơm ăn không hết và tấm lòng của chàng, Thạch Sanh đã tránh được một cuộc chiến đẫm máu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu 'Những chú ong cần mẫn đi hút mật từ sáng sớm.', từ \"cần mẫn\" và hình ảnh ong được tả gợi cho ta thấy ong như con người ở điểm nào?", "options": ["A. Ong có đức tính chăm chỉ, siêng năng lao động như con người", "B. Ong biết nói tiếng người", "C. Ong biết mặc quần áo", "D. Ong biết đọc sách"], "answer": "A", "explain": "Gán đức tính \"cần mẫn\" của con người cho loài ong chính là một biểu hiện của nhân hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nghĩa của từ \"mắt\" trong \"mắt na\" (phần lồi trên quả na) là nghĩa gì xét trong quan hệ với nghĩa gốc \"đôi mắt để nhìn\"?", "options": ["A. Nghĩa gốc", "B. Nghĩa chuyển, dựa trên sự giống nhau về hình dáng lồi, tròn", "C. Một từ đồng âm hoàn toàn khác", "D. Nghĩa do nước ngoài vay mượn"], "answer": "B", "explain": "\"Mắt na\" gọi theo sự tương đồng về hình dáng với con mắt — đây là nghĩa chuyển của từ nhiều nghĩa \"mắt\".", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về truyện cổ tích:", "statements": ["a) Cốt truyện cổ tích thường có sự tham gia giúp đỡ của yếu tố kì ảo đối với nhân vật chính.", "b) Truyện cổ tích bao giờ cũng kết thúc bi thảm để cảnh tỉnh người đọc.", "c) Nhân vật cổ tích thường được chia thành hai tuyến đối lập: tốt — xấu.", "d) Cổ tích là cách nhân dân gửi gắm mơ ước về công lí và hạnh phúc."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: cổ tích thường kết thúc có hậu. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Thạch Sanh\":", "statements": ["a) Thạch Sanh chém chằn tinh nhưng bị Lý Thông cướp công.", "b) Thạch Sanh xuống hang cứu công chúa và bị Lý Thông lấp cửa hang hãm hại.", "c) Tiếng đàn của Thạch Sanh làm cho nhà vua tức giận và xử tử chàng.", "d) Nhờ cứu con vua Thủy Tề, Thạch Sanh được tặng cây đàn thần."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: tiếng đàn giúp chàng giải oan và vạch mặt Lý Thông. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Nếu được gặp Thạch Sanh, em sẽ nói gì với chàng? Viết đoạn văn khoảng 5-7 câu bày tỏ suy nghĩ của em.", "points": 0, "explain": "Gợi ý chấm: bày tỏ được tình cảm khâm phục trước tài năng, lòng nhân hậu của Thạch Sanh; có thể nêu câu hỏi hoặc lời cảm ơn cụ thể; giọng văn chân thành; kết đoạn liên hệ bài học cho bản thân."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nhận xét về nhân vật người anh trong \"Cây khế\".", "points": 0, "explain": "Gợi ý chấm: nêu được các việc làm của người anh (chiếm gia sản, may túi mười hai gang, vơ vét vàng); phân tích tính cách tham lam, ích kỉ; nhận xét kết cục là hậu quả tất yếu; rút ra bài học cho bản thân."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Vật thần kì nào giúp Thạch Sanh giải oan trước nhà vua?", "options": ["A. Niêu cơm thần", "B. Chiếc roi sắt", "C. Cây đàn thần", "D. Cây khế thần"], "answer": "C", "explain": "Bị giam oan, Thạch Sanh gảy đàn; tiếng đàn kể rõ nỗi oan và tội ác của mẹ con Lý Thông.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kết cục của người anh trong \"Cây khế\" là gì?", "options": ["A. Trở thành người giàu nhất vùng và sống hạnh phúc", "B. Bị nhà vua bắt giam", "C. Quay về xin lỗi em và sống hòa thuận", "D. Rơi xuống biển chết cùng túi vàng vì lòng tham"], "answer": "D", "explain": "Túi vàng mười hai gang quá nặng khiến chim nghiêng cánh giữa biển; người anh rơi xuống biển — lòng tham tự hại mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai cô chị trong \"Sọ Dừa\" có thái độ thế nào với Sọ Dừa?", "options": ["A. Kiêu ngạo, coi thường, khinh rẻ chàng", "B. Rất yêu quý, chăm sóc chàng", "C. Sợ hãi, lánh xa chàng", "D. Muốn kết bạn thân với chàng"], "answer": "A", "explain": "Hai cô chị chỉ nhìn vẻ bề ngoài mà coi thường Sọ Dừa; chỉ cô út hiền lành mới đối xử tử tế với chàng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói kết thúc của truyện cổ tích thường \"có hậu\" lại thể hiện mơ ước của nhân dân?", "options": ["A. Vì người xưa thích những câu chuyện dài", "B. Vì nó thể hiện niềm tin và mơ ước: người tốt sẽ được hạnh phúc, kẻ ác sẽ bị trừng phạt", "C. Vì mọi truyện xưa bắt buộc phải kết thúc như vậy", "D. Vì như vậy trẻ em mới thích nghe kể chuyện"], "answer": "B", "explain": "Kết thúc có hậu là nơi nhân dân thực hiện mơ ước về công lí mà trong đời thực không phải lúc nào cũng đạt được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu văn nào dưới đây vận dụng nhân hóa để tả cây cối?", "options": ["A. Hàng tre cao vút trước ngõ làng.", "B. Tre được trồng thành lũy quanh làng.", "C. Những cây tre như những người lính canh gác, ngày đêm bảo vệ xóm làng.", "D. Lá tre xanh quanh năm."], "answer": "C", "explain": "Tre được gán hành động và vai trò của con người (người lính canh gác, bảo vệ) — đó là nhân hóa kết hợp so sánh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ \"ngọt\" trong câu 'Lời nói của cô út thật ngọt.' được dùng với nghĩa nào?", "options": ["A. Vị như đường, mật (nghĩa gốc)", "B. Chỉ một loại kẹo", "C. Chỉ âm thanh của đàn", "D. Êm tai, dễ nghe, dễ chịu (nghĩa chuyển)"], "answer": "D", "explain": "\"Ngọt\" chuyển từ chỉ vị giác sang chỉ lời nói êm ái, dễ nghe — một nghĩa chuyển quen thuộc của từ nhiều nghĩa.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về biện pháp nhân hóa:", "statements": ["a) Nhân hóa là gán đặc điểm, hành động của con người cho sự vật, con vật.", "b) Nhân hóa bắt buộc phải dùng các từ \"như\", \"là\", \"tựa\" trong câu.", "c) Nhân hóa làm cho sự vật trở nên gần gũi, sinh động.", "d) Trong \"Cây khế\", chim phượng hoàng biết nói chuyện là một hình ảnh nhân hóa."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: đó là dấu hiệu của so sánh; nhân hóa trực tiếp coi sự vật như con người. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về từ nhiều nghĩa:", "statements": ["a) Từ nhiều nghĩa gồm một nghĩa gốc và một hay nhiều nghĩa chuyển có liên quan.", "b) \"Chân bàn\" và \"chân người\" là hai từ đồng âm khác nhau.", "c) Muốn hiểu đúng nghĩa của từ nhiều nghĩa, cần đặt từ trong ngữ cảnh cụ thể.", "d) Nghĩa chuyển hình thành dựa trên sự liên tưởng giống nhau về hình dáng, chức năng, tính chất."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: đó là hai nghĩa của cùng một từ nhiều nghĩa \"chân\". c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại đoạn kết của truyện \"Thạch Sanh\" và nêu ý nghĩa của đoạn kết đó.", "points": 0, "explain": "Gợi ý chấm: kể đúng đoạn kết (quân chư hầu rút lui nhờ niêu cơm thần, mẹ con Lý Thông bị trừng phạt, Thạch Sanh lấy công chúa); nêu ý nghĩa (thiện thắng ác, mơ ước công lí, hòa bình của nhân dân); lời văn mạch lạc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu suy nghĩ của em về việc đánh giá con người qua vẻ bề ngoài, qua bài học từ truyện \"Sọ Dừa\".", "points": 0, "explain": "Gợi ý chấm: nêu được bài học từ Sọ Dừa và hai cô chị; phân tích vì sao không nên đánh giá người khác qua vẻ ngoài (tâm hồn, tài năng mới quyết định giá trị); liên hệ những việc làm cụ thể của học sinh (không trêu chọc, biết quan tâm bạn bè)."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Truyện cổ tích \"Thạch Sanh\" thuộc kiểu truyện về nhân vật nào?", "options": ["A. Nhân vật dũng sĩ có tài lạ", "B. Nhân vật bất hạnh bị áp bức", "C. Nhân vật thông minh", "D. Nhân vật là con vật"], "answer": "A", "explain": "Thạch Sanh tiêu biểu cho kiểu nhân vật dũng sĩ: có tài năng phi thường, diệt ác, cứu người, bảo vệ quê hương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong \"Cây khế\", sau khi giàu có, người em có thái độ sống như thế nào?", "options": ["A. Trở nên kiêu ngạo, khinh người", "B. Vẫn hiền lành, nhân hậu, hay giúp đỡ người nghèo", "C. Bỏ quê đi nơi khác sinh sống", "D. Tranh giành thêm tài sản với anh"], "answer": "B", "explain": "Giàu lên nhờ chim thần, người em vẫn giữ lòng nhân hậu — phẩm chất khiến chàng xứng đáng được hưởng hạnh phúc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sọ Dừa thi đỗ danh hiệu gì?", "options": ["A. Thám hoa", "B. Bảng nhãn", "C. Trạng nguyên", "D. Tiến sĩ"], "answer": "C", "explain": "Nhờ chăm chỉ học hành và tài năng, Sọ Dừa thi đỗ trạng nguyên — đỉnh cao học vị thời phong kiến.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết \"túi ba gang\" và \"túi mười hai gang\" trong \"Cây khế\" có ý nghĩa gì?", "options": ["A. Chỉ là hai số đo ngẫu nhiên, không có ý nghĩa", "B. Cho thấy người anh khéo tay hơn người em", "C. Quy định về kích thước túi đựng vàng thời xưa", "D. Thể hiện sự đối lập giữa lòng biết đủ của người em và lòng tham vô độ của người anh"], "answer": "D", "explain": "Hai con số đối lập làm nổi bật hai tính cách và hai kết cục trái ngược — hạt nhân tư tưởng của truyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây có sự vật được nhân hóa rõ nhất?", "options": ["A. Dòng sông quê em hiền hòa ôm lấy xóm làng, ru những bãi ngô xanh mướt.", "B. Mặt hồ phẳng lặng như gương.", "C. Con sông chảy qua ba huyện của tỉnh.", "D. Nước sông mùa lũ dâng cao."], "answer": "A", "explain": "Dòng sông được gán hành động, tình cảm của con người (ôm lấy, ru) — nhân hóa làm cảnh vật gần gũi, có hồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các từ sau, từ nào được dùng theo NGHĨA CHUYỂN trong câu 'Cả nhà quây quần bên nồi cơm mới nấu, thơm phức.'?", "options": ["A. Không có từ nào dùng nghĩa chuyển trong câu này", "B. \"nhà\" trong \"cả nhà\" chỉ những người trong gia đình — nghĩa chuyển từ nghĩa gốc là ngôi nhà", "C. \"thơm\" chuyển sang chỉ mùi vị hấp dẫn nói chung", "D. \"nồi\" là nghĩa chuyển"], "answer": "B", "explain": "\"Cả nhà\" ở đây chỉ mọi người trong gia đình, không phải ngôi nhà vật chất — \"nhà\" đã chuyển nghĩa (từ nơi ở sang người ở).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Thạch Sanh\":", "statements": ["a) Thạch Sanh được thiên thần dạy cho võ nghệ và phép thuật.", "b) Công chúa bị chằn tinh bắt giữ và được Thạch Sanh cứu thoát.", "c) Lý Thông nhiều lần cướp công của Thạch Sanh để được vua ban thưởng.", "d) Cuối truyện, Thạch Sanh từ chối lấy công chúa và bỏ đi tu hành."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: công chúa bị đại bàng bắt; chằn tinh là yêu quái Thạch Sanh chém đầu ở miếu. c) Đúng. d) Sai: Thạch Sanh được vua gả công chúa.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Sọ Dừa\":", "statements": ["a) Sọ Dừa sinh ra sau khi mẹ uống nước trong một chiếc sọ dừa.", "b) Sọ Dừa chăn dê rất giỏi, không để mất con dê nào của phú ông.", "c) Cô út lấy Sọ Dừa vì thương cảm và nhìn thấy phẩm chất tốt của chàng.", "d) Sau khi đỗ trạng nguyên, Sọ Dừa trả thù và làm hại hai cô chị ngay lập tức."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hai cô chị bị vạch mặt vì tội hãm hại cô út, nhưng Sọ Dừa không tự ý trả thù tàn nhẫn; kẻ ác bị trừng phạt theo lẽ công bằng của truyện.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Đóng vai người em trong \"Cây khế\", viết đoạn văn khoảng 5-7 câu kể lại lần em theo chim thần ra đảo lấy vàng.", "points": 0, "explain": "Gợi ý chấm: kể ở ngôi thứ nhất; có các chi tiết chính (chim đến, lời dặn túi ba gang, cảnh đảo vàng, lấy vừa đủ thì trở về); bộc lộ cảm xúc của nhân vật; kết đoạn nêu suy nghĩ về cách sống biết đủ, nhân hậu."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu giới thiệu về một truyện cổ tích Việt Nam mà em yêu thích (ngoài các truyện đã học) và lí do em thích truyện đó.", "points": 0, "explain": "Gợi ý chấm: giới thiệu được tên truyện, nhân vật chính, cốt truyện tóm tắt; chỉ ra yếu tố kì ảo và bài học của truyện; nêu lí do yêu thích thuyết phục; trình bày mạch lạc."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Nhận định nào đúng nhất về truyện cổ tích?", "options": ["A. Cổ tích là lịch sử được ghi lại chính xác", "B. Cổ tích chỉ dành cho trẻ em, không có ý nghĩa với người lớn", "C. Cổ tích là sáng tạo của nhân dân, gửi gắm mơ ước về công lí và hạnh phúc", "D. Cổ tích luôn có nhân vật là vua chúa"], "answer": "C", "explain": "Cổ tích là tiếng nói mơ ước của nhân dân lao động: người tốt được đền đáp, kẻ ác bị trừng phạt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thạch Sanh cứu được ai trong hang sâu dưới lòng đất?", "options": ["A. Công chúa bị đại bàng bắt", "B. Con trai vua Thủy Tề bị giam", "C. Một ông lão đánh cá", "D. Cả công chúa (bị đại bàng bắt) và trước đó chàng từng cứu con vua Thủy Tề khi xuống thủy cung"], "answer": "D", "explain": "Thạch Sanh hai lần cứu người: cứu thái tử con vua Thủy Tề (được tặng đàn thần) và xuống hang cứu công chúa bị đại bàng bắt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nói nổi tiếng của chim thần trong \"Cây khế\" là câu nào?", "options": ["A. \"Ăn một quả, trả cục vàng, may túi ba gang, mang đi mà đựng.\"", "B. \"Khế chín rồi, hái xuống ăn đi!\"", "C. \"Cho ta ăn khế, ta cho nhà ngươi vàng.\"", "D. \"Bay lên trời cao, hái sao xuống đất.\""], "answer": "A", "explain": "Câu nói của chim phượng hoàng trở thành chi tiết trung tâm, quyết định số phận của cả hai anh em trong truyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cô út trong \"Sọ Dừa\" được hưởng hạnh phúc?", "options": ["A. Vì cô là người xinh đẹp nhất trong ba chị em", "B. Vì cô hiền lành, tốt bụng, không coi thường người khác vì vẻ bề ngoài", "C. Vì cô may mắn được phú ông chia nhiều của cải nhất", "D. Vì cô biết Sọ Dừa sẽ biến thành chàng trai tuấn tú"], "answer": "B", "explain": "Cô út được đền đáp nhờ tấm lòng nhân hậu và cách nhìn người không qua vẻ bề ngoài — đúng quy luật \"ở hiền gặp lành\" của cổ tích.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu văn 'Những đám mây trắng như những chú cừu non đang gặm cỏ trên bầu trời.' sử dụng biện pháp tu từ nào là chính?", "options": ["A. Nhân hóa", "B. Nói quá", "C. So sánh", "D. Điệp ngữ"], "answer": "C", "explain": "Câu văn dùng từ \"như\" để so sánh đám mây với đàn cừu — biện pháp so sánh; mây chưa được gán hành động, tính cách của con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ \"đầu\" trong câu 'Anh ấy đứng đầu lớp về thành tích học tập.' mang nghĩa gì?", "options": ["A. Nghĩa gốc — bộ phận trên cùng của cơ thể", "B. Nghĩa chỉ một đơn vị tiền tệ", "C. Là một từ đồng âm khác hẳn", "D. Nghĩa chuyển — vị trí thứ nhất, cao nhất"], "answer": "D", "explain": "\"Đứng đầu lớp\" chỉ vị trí xếp thứ nhất — nghĩa chuyển của \"đầu\" dựa trên vị trí \"ở trên, ở trước\".", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phân biệt truyền thuyết và cổ tích:", "statements": ["a) Truyền thuyết gắn với nhân vật, sự kiện lịch sử của dân tộc.", "b) Cổ tích tập trung vào số phận con người đời thường và mơ ước công lí.", "c) Cả truyền thuyết và cổ tích đều không có yếu tố kì ảo.", "d) \"Thánh Gióng\" là cổ tích, \"Thạch Sanh\" là truyền thuyết."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng. c) Sai: cả hai thể loại đều giàu yếu tố kì ảo. d) Sai: \"Thánh Gióng\" là truyền thuyết, \"Thạch Sanh\" là cổ tích.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tiếng Việt:", "statements": ["a) Nhân hóa giúp sự vật trở nên sinh động, gần gũi với con người.", "b) Mọi câu văn có từ \"như\" đều là nhân hóa.", "c) Từ nhiều nghĩa có các nghĩa liên quan chặt chẽ với nhau.", "d) \"Mắt bão\", \"mắt lưới\" là những nghĩa chuyển của từ \"mắt\"."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: câu có \"như\" thường là so sánh. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại truyện \"Cây khế\" bằng lời văn của em theo trình tự sự việc.", "points": 0, "explain": "Gợi ý chấm: kể đủ sự việc chính (chia gia sản — chim thần đến — người em lấy vàng vừa đủ — người anh đổi gia sản, may túi mười hai gang — kết cục rơi xuống biển); trình tự rõ ràng; kết đoạn nêu bài học về lòng tham."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu bày tỏ suy nghĩ của em về nhân vật Lý Thông trong \"Thạch Sanh\".", "points": 0, "explain": "Gợi ý chấm: chỉ ra các hành vi của Lý Thông (lợi dụng lòng tốt, cướp công, hãm hại người em kết nghĩa); phân tích tính cách gian xảo, tham lam; nhận xét kết cục xứng đáng; rút ra bài học về sống trung thực, biết ơn."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nhân vật chính trong truyện cổ tích thường phải trải qua điều gì trước khi được hạnh phúc?", "options": ["A. Những bất hạnh, thử thách lớn trong cuộc sống", "B. Một chuyến du lịch dài ngày", "C. Một kì thi rất khó của triều đình", "D. Sự ganh đua với anh chị em trong nhà giàu"], "answer": "A", "explain": "Mô típ quen thuộc: nhân vật chính gặp bất hạnh, vượt qua thử thách (nhờ tài năng, lòng tốt và sự giúp đỡ kì diệu) rồi mới được đền đáp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vua gả ai cho Thạch Sanh sau khi chàng được giải oan?", "options": ["A. Một tiểu thư con quan", "B. Công chúa — người chàng đã cứu khỏi hang đại bàng", "C. Con gái của Lý Thông", "D. Một nàng tiên"], "answer": "B", "explain": "Sau khi tiếng đàn giải oan, nhà vua gả công chúa cho Thạch Sanh, phong chàng làm phò mã.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Gia sản người em trong \"Cây khế\" nhận được sau khi cha mẹ mất là gì?", "options": ["A. Một ngôi nhà lớn", "B. Mấy sào ruộng tốt", "C. Một cây khế ở cuối vườn", "D. Một đàn trâu khỏe"], "answer": "C", "explain": "Người anh chiếm hết của cải, chỉ chia cho em cây khế cuối vườn — từ đó câu chuyện kì diệu bắt đầu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết Sọ Dừa chăn dê không để mất một con nào cho thấy điều gì ở chàng?", "options": ["A. Chàng rất may mắn", "B. Chàng được phú ông ưu ái giúp đỡ", "C. Đàn dê của phú ông rất hiền lành", "D. Chàng thông minh, khéo léo và có trách nhiệm trong công việc"], "answer": "D", "explain": "Dù ngoại hình kì dị, Sọ Dừa làm việc giỏi giang, chu đáo — tài năng và phẩm chất bên trong đối lập hẳn với vẻ ngoài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây có biện pháp nhân hóa?", "options": ["A. Tiếng sáo của Sọ Dừa như đang kể câu chuyện buồn vui của chàng với núi rừng.", "B. Sọ Dừa thổi sáo rất hay.", "C. Sọ Dừa chăn dê trên sườn đồi.", "D. Phú ông có ba cô con gái."], "answer": "A", "explain": "Tiếng sáo được gán khả năng \"kể chuyện\" như con người — đó là nhân hóa; các câu còn lại chỉ kể, tả thông thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai từ \"đường\" trong \"con đường làng\" và \"đường (để ăn, pha nước)\" là hiện tượng gì?", "options": ["A. Từ nhiều nghĩa", "B. Từ đồng âm — giống âm nhưng nghĩa không liên quan", "C. Từ trái nghĩa", "D. Từ láy"], "answer": "B", "explain": "\"Đường\" (lối đi) và \"đường\" (chất ngọt) chỉ giống nhau về âm thanh, nghĩa hoàn toàn khác nhau — đó là từ đồng âm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Thạch Sanh\":", "statements": ["a) Thạch Sanh sống một mình dưới gốc đa sau khi cha mẹ mất sớm.", "b) Lý Thông kết nghĩa anh em với Thạch Sanh vì quý mến tài năng của chàng một cách chân thành.", "c) Niêu cơm của Thạch Sanh ăn mãi không hết, khiến quân mười tám nước chư hầu khâm phục rút lui.", "d) Thạch Sanh dùng đàn thần để mưu cầu danh lợi cho bản thân."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: Lý Thông kết nghĩa để lợi dụng và cướp công của Thạch Sanh. c) Đúng. d) Sai: đàn thần giúp chàng giải oan, không phải để mưu lợi.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Cây khế\":", "statements": ["a) Chim phượng hoàng ăn khế và trả ơn người em bằng cách đưa đi lấy vàng.", "b) Người em trở nên giàu có nhưng vẫn hay giúp đỡ người nghèo khó.", "c) Người anh đổi hết gia sản để lấy cây khế từ tay người em.", "d) Cuối truyện, hai anh em hòa giải và cùng nhau sống giàu sang."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: người anh chết dưới biển vì lòng tham, không có sự hòa giải nào.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Tưởng tượng em là Sọ Dừa trong ngày cưới, viết đoạn văn khoảng 5-7 câu kể lại cảm xúc của em khi biến thành chàng trai tuấn tú trước mặt mọi người.", "points": 0, "explain": "Gợi ý chấm: kể ở ngôi thứ nhất, hóa thân hợp lí; miêu tả được phản ứng của mọi người (kinh ngạc, hai cô chị ân hận); bộc lộ cảm xúc của nhân vật (xúc động, hạnh phúc, không oán hận); kết đoạn hướng tới cuộc sống mới."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu mơ ước của em về một xã hội công bằng, tốt đẹp, liên hệ với mơ ước của nhân dân trong truyện cổ tích.", "points": 0, "explain": "Gợi ý chấm: nêu được mơ ước cụ thể (người tốt được bảo vệ, kẻ ác bị lên án, ai cũng được đối xử tử tế); liên hệ ít nhất một truyện cổ tích đã học; thể hiện khát vọng chân thành, tích cực của bản thân."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Truyện nào sau đây là truyện cổ tích?", "options": ["A. \"Thánh Gióng\"", "B. \"Sơn Tinh, Thủy Tinh\"", "C. \"Cây khế\"", "D. \"Sự tích Hồ Gươm\""], "answer": "C", "explain": "\"Cây khế\" là cổ tích về số phận đời thường và lòng tham; ba truyện còn lại đều là truyền thuyết gắn với lịch sử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mẹ con Lý Thông cuối cùng bị trừng phạt như thế nào?", "options": ["A. Bị vua bắt đi đày xa xứ", "B. Bị giam vào ngục tối suốt đời", "C. Bị đuổi khỏi kinh thành", "D. Bị sét đánh chết trên đường về quê"], "answer": "D", "explain": "Đang trên đường được tha về quê, mẹ con Lý Thông bị trời đánh chết — sự trừng phạt của \"ông trời\" theo quan niệm công lí dân gian.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong \"Sọ Dừa\", chi tiết nào cho thấy phú ông bất ngờ nhất trong đám cưới?", "options": ["A. Chàng rể kì dị biến thành một chàng trai tuấn tú, khôi ngô", "B. Sọ Dừa mang đến rất nhiều sính lễ quý", "C. Cô út đồng ý lấy Sọ Dừa", "D. Đàn dê của phú ông tự tìm về chuồng"], "answer": "A", "explain": "Sự biến hình của Sọ Dừa trong ngày cưới làm tất cả kinh ngạc và khiến hai cô chị vô cùng ân hận.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của Thạch Sanh, người em trong \"Cây khế\" và Sọ Dừa là gì?", "options": ["A. Đều là con út trong gia đình", "B. Đều là người hiền lành, tài giỏi hoặc chăm chỉ, cuối cùng đều được đền đáp xứng đáng", "C. Đều được một con chim thần giúp đỡ", "D. Đều sinh ra trong gia đình giàu có"], "answer": "B", "explain": "Ba nhân vật đều tiêu biểu cho quy luật của cổ tích: người tốt, có phẩm chất đẹp sẽ vượt qua thử thách và được hạnh phúc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu 'Gió thổi mạnh, những tàu lá dừa xào xạc như đang thì thầm trò chuyện.', biện pháp nhân hóa nằm ở chi tiết nào?", "options": ["A. Gió thổi mạnh", "B. Lá dừa xào xạc phát ra tiếng", "C. Tàu lá dừa \"thì thầm trò chuyện\" như con người", "D. Không có nhân hóa trong câu này"], "answer": "C", "explain": "Lá dừa được gán hành động \"thì thầm trò chuyện\" của con người — đó chính là nhân hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ \"xuân\" trong \"tuổi xuân\" được hiểu theo nghĩa nào?", "options": ["A. Mùa đầu tiên trong năm (nghĩa gốc)", "B. Tên một loài hoa", "C. Một đơn vị thời gian cổ", "D. Tuổi trẻ, thời thanh niên (nghĩa chuyển)"], "answer": "D", "explain": "\"Tuổi xuân\" dùng \"xuân\" với nghĩa chuyển chỉ tuổi trẻ tươi đẹp, dựa trên sự tương đồng với sức sống của mùa xuân.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về truyện cổ tích:", "statements": ["a) Yếu tố kì ảo trong cổ tích không bao giờ giúp đỡ nhân vật chính.", "b) Nhân vật chính trong cổ tích thường là người lao động nghèo khổ, bất hạnh.", "c) Cổ tích phê phán những thói xấu như tham lam, ích kỉ, gian xảo.", "d) Đọc cổ tích, ta hiểu thêm về đời sống tinh thần và mơ ước của nhân dân xưa."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: yếu tố kì ảo (tiên, vật thần, thú biết nói) thường giúp nhân vật chính vượt qua thử thách. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tiếng Việt:", "statements": ["a) Từ đồng âm là những từ giống nhau về âm thanh nhưng khác hẳn nhau về nghĩa.", "b) \"Chân núi\" dùng từ \"chân\" theo nghĩa gốc là bộ phận cơ thể.", "c) Từ nhiều nghĩa và từ đồng âm là hai hiện tượng hoàn toàn khác nhau.", "d) Nghĩa chuyển của từ luôn xa lạ, không liên quan gì đến nghĩa gốc."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: \"chân núi\" là nghĩa chuyển. c) Đúng. d) Sai: nghĩa chuyển luôn có liên quan đến nghĩa gốc.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu đóng vai chim phượng hoàng, kể lại lần đầu tiên em (chim) gặp người em hiền lành bên cây khế.", "points": 0, "explain": "Gợi ý chấm: kể ở ngôi thứ nhất với lời của chim; có chi tiết ăn khế, nghe người em than thở, hứa trả vàng và dặn may túi ba gang; thể hiện được tấm lòng của chim thần và của người em; giọng kể tự nhiên, sinh động."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu phân tích vì sao hai cô chị trong \"Sọ Dừa\" phải ân hận ở cuối truyện.", "points": 0, "explain": "Gợi ý chấm: chỉ ra thái độ coi thường, đánh giá người qua vẻ ngoài của hai cô chị; sự việc Sọ Dừa biến hình, đỗ trạng nguyên khiến họ ân hận; rút ra bài học về cách nhìn nhận, đối xử với mọi người xung quanh."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Mở đầu quen thuộc của nhiều truyện cổ tích là cụm từ nào?", "options": ["A. \"Ngày xửa ngày xưa...\"", "B. \"Ngày hôm nay...\"", "C. \"Trong một trận đánh lớn...\"", "D. \"Theo sử sách ghi lại...\""], "answer": "A", "explain": "\"Ngày xửa ngày xưa...\" là cách mở đầu đặc trưng, đưa người nghe vào thế giới xa xưa, kì diệu của cổ tích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thạch Sanh bị giam vào ngục vì lí do gì?", "options": ["A. Vì chàng làm mất gươm của nhà vua", "B. Vì bị mẹ con Lý Thông vu oan là kẻ trộm của cải trong kho nhà vua", "C. Vì chàng không chịu lấy công chúa", "D. Vì chàng đánh thua quân chư hầu"], "answer": "B", "explain": "Lý Thông vu cho Thạch Sanh tội ăn trộm, khiến chàng bị bắt giam; chính trong ngục, tiếng đàn thần đã giúp chàng minh oan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người anh trong \"Cây khế\" đã làm gì để có được cây khế?", "options": ["A. Mua lại cây khế bằng rất nhiều tiền", "B. Trồng một cây khế mới bên cạnh", "C. Đổi hết gia sản của mình cho người em để lấy cây khế", "D. Xin vua ban cho cây khế khác"], "answer": "C", "explain": "Nghe chuyện em giàu lên nhờ cây khế, người anh gạ đổi toàn bộ gia sản lấy cây khế — và lòng tham của anh ta bắt đầu từ đây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao truyện \"Sọ Dừa\" lại cho nhân vật chính một ngoại hình kì dị đến vậy?", "options": ["A. Để câu chuyện thêm phần đáng sợ", "B. Vì người xưa tin rằng ai cũng sinh ra như vậy", "C. Để Sọ Dừa dễ dàng đi chăn dê hơn", "D. Để làm nổi bật sự đối lập giữa vẻ ngoài xấu xí và tâm hồn, tài năng đẹp đẽ bên trong"], "answer": "D", "explain": "Ngoại hình kì dị là \"phép thử\" dành cho mọi người xung quanh và cho người đọc: giá trị con người nằm ở bên trong.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu văn nào sau đây tả cảnh bằng nhân hóa?", "options": ["A. Trăng khuya như một người bạn lặng lẽ dõi theo bước chân người lính trẻ.", "B. Bầu trời đêm đầy sao sáng.", "C. Mặt trăng tròn và sáng vào đêm rằm.", "D. Ánh trăng chiếu xuống mặt hồ."], "answer": "A", "explain": "Trăng được gán hành động, tình cảm của con người (người bạn dõi theo) — đó là biện pháp nhân hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nghĩa gốc của từ \"mũi\" là \"bộ phận nhô ra ở giữa mặt dùng để thở và ngửi\". Vậy \"mũi\" trong \"mũi đất nhô ra biển\" là:", "options": ["A. Một từ đồng âm khác", "B. Nghĩa chuyển, dựa trên hình dáng nhô ra phía trước", "C. Nghĩa gốc", "D. Tên riêng của địa danh"], "answer": "B", "explain": "\"Mũi đất\" lấy theo đặc điểm nhô ra như cái mũi — nghĩa chuyển sinh động của từ \"mũi\".", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Thạch Sanh\":", "statements": ["a) Thạch Sanh mồ côi cha mẹ từ nhỏ, sống nghèo khổ dưới gốc đa.", "b) Chàng được Ngọc Hoàng sai thiên thần xuống dạy võ nghệ vì vốn là thái tử đầu thai.", "c) Quân mười tám nước chư hầu kéo đến vì muốn xin Thạch Sanh dạy võ.", "d) Tiếng đàn và niêu cơm thần giúp Thạch Sanh tránh một cuộc chiến tranh lớn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: quân chư hầu kéo đến gây chiến, thách thức nước ta. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về \"Cây khế\" và \"Sọ Dừa\":", "statements": ["a) Cả hai truyện đều kết thúc có hậu cho nhân vật hiền lành.", "b) Người anh trong \"Cây khế\" chết vì bị chim thần ghét bỏ một cách vô cớ.", "c) Cô út trong \"Sọ Dừa\" hạnh phúc vì đã đối xử tử tế với mọi người.", "d) Sọ Dừa và người em trong \"Cây khế\" đều bị người thân đối xử bất công lúc đầu."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: người anh chết vì lòng tham của chính mình (túi vàng quá nặng). c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu nêu cảm nghĩ của em về kết thúc của truyện \"Cây khế\".", "points": 0, "explain": "Gợi ý chấm: tóm được hai kết cục trái ngược; bày tỏ cảm xúc (thương người em, trách và cũng xót xa cho người anh); rút ra bài học về lòng tham và sự biết đủ; trình bày mạch lạc, thuyết phục."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu kể lại một truyện cổ tích em yêu thích theo ngôi thứ nhất, đóng vai nhân vật chính.", "points": 0, "explain": "Gợi ý chấm: kể nhất quán ở ngôi thứ nhất; chọn lọc các sự việc chính của truyện; có cảm xúc, suy nghĩ của nhân vật khi kể; kết đoạn nêu bài học hoặc niềm vui của nhân vật sau khi vượt qua thử thách."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bài học lớn nhất mà truyện cổ tích gửi gắm là gì?", "options": ["A. Hãy tìm mọi cách để trở nên giàu có", "B. Không nên tin tưởng bất kì ai", "C. Ở hiền gặp lành, ác giả ác báo — người tốt sẽ được hạnh phúc, kẻ ác sẽ bị trừng phạt", "D. Phải có phép thuật mới thành công trong cuộc sống"], "answer": "C", "explain": "Đó là mơ ước công lí ngàn đời của nhân dân được kết tinh trong truyện cổ tích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong \"Thạch Sanh\", ai là người đã sinh ra Thạch Sanh theo lời truyện kể?", "options": ["A. Một bà tiên trên trời", "B. Vợ chồng nhà vua", "C. Gia đình của Lý Thông", "D. Vợ chồng người nông dân nghèo, hiền lành, tốt bụng"], "answer": "D", "explain": "Thạch Sanh đầu thai vào gia đình nông dân nghèo mà hiền lành — nguồn gốc khiêm nhường làm nổi bật hành trình của người anh hùng cổ tích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chim thần trong \"Cây khế\" đưa người em đi lấy vàng ở đâu?", "options": ["A. Một hòn đảo giữa biển đầy vàng bạc", "B. Một hang động trong núi sâu", "C. Trong kho báu của nhà vua", "D. Dưới đáy một con sông lớn"], "answer": "A", "explain": "Chim bay qua biển, đưa người em tới một đảo đầy vàng; chàng chỉ lấy vừa đầy túi ba gang rồi quay về.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Qua ba truyện cổ tích trong bài, em thấy yếu tố kì ảo thường xuất hiện với vai trò gì?", "options": ["A. Trang trí cho câu chuyện thêm dài", "B. Giúp đỡ, đền đáp người tốt và trừng phạt kẻ xấu, thực hiện mơ ước công lí của nhân dân", "C. Làm cho nhân vật chính trở nên xấu xa hơn", "D. Thay thế hoàn toàn hành động của nhân vật"], "answer": "B", "explain": "Từ đàn thần, niêu cơm thần đến chim phượng hoàng và sự biến hình của Sọ Dừa — yếu tố kì ảo chính là \"cán cân công lí\" của nhân dân trong truyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây KHÔNG sử dụng nhân hóa?", "options": ["A. Những bông lúa chín cúi đầu lặng lẽ chờ tay người gặt.", "B. Gió thu khẽ vuốt ve những tán lá vàng.", "C. Mùa thu, lúa ngoài đồng chín vàng rực.", "D. Dòng suối róc rách hát ca suốt ngày đêm."], "answer": "C", "explain": "Câu C chỉ miêu tả cảnh vật bình thường; các câu còn lại đều gán hành động, cảm xúc của con người cho lúa, gió, suối.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ \"lòng\" trong \"lòng dân\" (ý chí, tình cảm của nhân dân) so với \"lòng\" trong \"ăn lòng lợn\" là:", "options": ["A. Hai từ đồng âm", "B. Nghĩa gốc trong cả hai trường hợp", "C. Hiện tượng từ láy", "D. Một từ nhiều nghĩa: \"lòng dân\" là nghĩa chuyển chỉ tình cảm, tâm tư con người"], "answer": "D", "explain": "\"Lòng\" từ chỉ cơ quan nội tạng (nghĩa gốc) chuyển sang chỉ tình cảm, tâm tư — một nghĩa chuyển quen thuộc, gần gũi.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về thế giới cổ tích:", "statements": ["a) Cổ tích là nơi nhân dân thực hiện mơ ước về một xã hội công bằng, tốt đẹp.", "b) Trong cổ tích, kẻ gian ác cuối cùng bao giờ cũng chiến thắng người tốt.", "c) Nhân vật cổ tích thường được xây dựng theo hai tuyến thiện — ác rõ rệt.", "d) Yếu tố kì ảo làm cho cổ tích xa lạ, không liên quan gì đến đời sống thật của nhân dân."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: kẻ ác cuối cùng đều bị trừng phạt. c) Đúng. d) Sai: cổ tích phản ánh đời sống và khát vọng thật của nhân dân lao động.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tiếng Việt đã học:", "statements": ["a) Để phân biệt từ nhiều nghĩa với từ đồng âm, ta xét xem các nghĩa có liên quan với nhau hay không.", "b) \"Cổ tích\" nào cũng có nhân vật là con vật biết nói tiếng người.", "c) Nhân hóa thường gặp trong văn miêu tả và trong truyện cổ tích.", "d) Từ \"chân\" trong \"chân trời\" được dùng theo nghĩa gốc là bộ phận cơ thể."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: nghĩa liên quan là từ nhiều nghĩa; không liên quan là đồng âm. b) Sai: không phải cổ tích nào cũng có vật biết nói. c) Đúng. d) Sai: \"chân trời\" là nghĩa chuyển.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu tổng kết điều em học được sau khi học xong Bài 7 \"Thế giới cổ tích\".", "points": 0, "explain": "Gợi ý chấm: nêu được kiến thức đã học (đặc điểm truyện cổ tích, ba truyện tiêu biểu, nhân hóa, từ nhiều nghĩa); chỉ ra văn bản hoặc bài học tâm đắc nhất kèm lí do; thể hiện thái độ yêu thích văn học dân gian."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5-7 câu tưởng tượng một kết thúc khác cho truyện \"Cây khế\" (ví dụ: người anh biết hối lỗi) và giải thích vì sao em chọn kết thúc đó.", "points": 0, "explain": "Gợi ý chấm: kể được kết thúc mới mạch lạc, hợp lí với tính cách nhân vật; giải thích ý nghĩa nhân văn của kết thúc mới (cho người lầm lỗi cơ hội sửa sai); vẫn giữ được tinh thần phê phán lòng tham của truyện gốc."}]}]}
