"options": ["A. Tạp chí Sông Lam, số 8/2020", "B. Tập thơ “Từ ấy”", "C. Truyện ngắn chọn lọc Nam Cao", "D. Báo Thiếu niên Tiền phong"], "answer": "A", "explain": "Văn bản trích từ Tạp chí Sông Lam, số 8 năm 2020.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác giả đã dùng bằng chứng nào để cho thấy mỗi người một vẻ?", "options": ["A. Số liệu điều tra dân số thế giới", "B. Các bạn trong lớp học: mỗi người một hình dáng, sở thích, thói quen khác nhau", "C. Câu chuyện về các vị anh hùng thời xưa", "D. Những câu ca dao về quê hương"], "answer": "B", "explain": "Bằng chứng gần gũi nhất là ngay trong lớp học: các bạn không ai giống ai về ngoại hình, tính cách, sở thích.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu “Ai cũng cần hòa nhập, nhưng sự hòa nhập có nhiều lối chứ không phải một” nên hiểu như thế nào?", "options": ["A. Chỉ có một cách duy nhất để hòa nhập với tập thể", "B. Hòa nhập là việc không quan trọng trong cuộc sống", "C. Hòa nhập không có nghĩa là phải giống hệt người khác; mỗi người hòa nhập theo cách riêng của mình", "D. Muốn hòa nhập phải từ bỏ mọi sở thích cá nhân"], "answer": "C", "explain": "Câu nói nhấn mạnh: giữ cái riêng không mâu thuẫn với hòa đồng; mỗi người đóng góp cho tập thể bằng chính thế mạnh của mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi bị cha mẹ so sánh với “con nhà người ta”, cách hiểu đúng đắn nhất là gì?", "options": ["A. Giận dỗi, cho rằng cha mẹ không thương mình", "B. Bắt chước y hệt bạn kia trong mọi việc", "C. Buông xuôi vì mình không thể bằng người ta", "D. Hiểu đó là mong muốn con tiến bộ của cha mẹ, đồng thời tin vào giá trị riêng và nỗ lực theo cách của mình"], "answer": "D", "explain": "Thái độ đúng: trân trọng tấm lòng cha mẹ, không tự ti, biết phát huy điểm mạnh riêng để tiến bộ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nội dung văn bản “Xem người ta kìa!”:", "statements": ["a) Mẹ nói “Xem người ta kìa!” vì mong con bằng người, không thua kém ai.", "b) Theo tác giả, mỗi người cần đánh mất cái riêng để hòa nhập tập thể.", "c) Sự độc đáo của cá nhân làm cho tập thể trở nên phong phú.", "d) Chỗ giống nhau nhất của mọi người là không ai giống ai cả."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: tác giả khuyên giữ lấy cái riêng và tôn trọng sự khác biệt. c) Đúng. d) Đúng – đây là ý tưởng sâu sắc của văn bản.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về trạng ngữ:", "statements": ["a) Trạng ngữ là thành phần phụ của câu.", "b) Trạng ngữ chỉ bổ sung thông tin về thời gian và nơi chốn.", "c) Trạng ngữ thường đứng ở đầu câu và ngăn cách với phần còn lại bằng dấu phẩy.", "d) Câu không có trạng ngữ thì không thể thành câu."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: trạng ngữ còn chỉ nguyên nhân, mục đích, cách thức… c) Đúng: đó là vị trí phổ biến nhất của trạng ngữ. d) Sai: trạng ngữ có thể lược bỏ, câu vẫn đứng vững.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Trình bày ý kiến của em về hiện tượng: nhiều bạn chê bai, trêu chọc bạn có ngoại hình hoặc sở thích khác mình. Viết đoạn văn khoảng 5 – 7 câu.", "points": 0, "explain": "Gợi ý: nêu ý kiến phê phán hành vi trêu chọc; lí lẽ: khác biệt là tự nhiên, trêu chọc làm tổn thương bạn, phá vỡ tình bạn; bằng chứng: tình huống trong lớp/trường; đề xuất cách ứng xử đúng: tôn trọng, bênh vực bạn bị trêu chọc."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày ý kiến về việc học sinh mặc đồng phục đến trường.", "points": 0, "explain": "Gợi ý: nêu ý kiến (đồng tình/không đồng tình một phần); lí lẽ hai mặt: đồng phục tạo bình đẳng, gọn gàng, giảm so bì giàu nghèo; nhưng cũng cần giữ nét riêng qua cách cư xử, học tập; bằng chứng thực tế trường em; kết đoạn khẳng định lại ý kiến."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "“Xem người ta kìa!” thuộc loại văn bản nào?", "options": ["A. Văn bản nghị luận", "B. Truyện cổ tích", "C. Thơ trữ tình", "D. Kịch"], "answer": "A", "explain": "Văn bản nêu ý kiến về một vấn đề đời sống (sự khác biệt của mỗi người) kèm lí lẽ và bằng chứng nên là văn bản nghị luận.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nói của người mẹ được nhắc đi nhắc lại trong văn bản là câu nào?", "options": ["A. “Học, học nữa, học mãi!”", "B. “Xem người ta kìa!”", "C. “Đi một ngày đàng, học một sàng khôn.”", "D. “Có công mài sắt, có ngày nên kim.”"], "answer": "B", "explain": "Nhan đề văn bản chính là câu nói quen thuộc của người mẹ mỗi khi muốn con mình bằng bạn bằng bè: “Xem người ta kìa!”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trạng ngữ là thành phần câu có vai trò gì?", "options": ["A. Là thành phần chính, bắt buộc phải có trong mọi câu", "B. Là từ dùng để nối hai câu với nhau", "C. Là thành phần phụ, bổ sung thông tin về thời gian, nơi chốn, nguyên nhân, mục đích, cách thức… cho sự việc được nói đến trong câu", "D. Là dấu câu ở cuối câu"], "answer": "C", "explain": "Trạng ngữ là thành phần phụ của câu, giúp câu văn rõ thêm hoàn cảnh diễn ra sự việc: khi nào, ở đâu, vì sao, để làm gì, bằng cách nào…", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong câu “Vào những ngày hè oi ả, ve kêu râm ran trên vòm lá”, trạng ngữ là cụm từ nào?", "options": ["A. Ve", "B. Kêu râm ran", "C. Trên vòm lá", "D. Vào những ngày hè oi ả"], "answer": "D", "explain": "Cụm “Vào những ngày hè oi ả” đứng đầu câu, bổ sung thông tin thời gian cho sự việc ve kêu, là trạng ngữ chỉ thời gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trạng ngữ trong câu “Để chuẩn bị cho kì thi, em ôn bài rất kĩ” thuộc loại nào?", "options": ["A. Trạng ngữ chỉ mục đích", "B. Trạng ngữ chỉ nơi chốn", "C. Trạng ngữ chỉ nguyên nhân", "D. Trạng ngữ chỉ cách thức"], "answer": "A", "explain": "Cụm “Để chuẩn bị cho kì thi” trả lời câu hỏi “để làm gì?”, là trạng ngữ chỉ mục đích.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trạng ngữ trong câu “Ở ven sông, lũ trẻ thả diều mỗi buổi chiều” chỉ điều gì?", "options": ["A. Thời gian", "B. Nơi chốn", "C. Nguyên nhân", "D. Mục đích"], "answer": "B", "explain": "“Ở ven sông” trả lời câu hỏi “ở đâu?”, là trạng ngữ chỉ nơi chốn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau khi phân tích câu “Chiều hôm qua, vì trời đổ mưa, chúng em nghỉ tiết thể dục ngoài sân”:", "statements": ["a) “Chiều hôm qua” là trạng ngữ chỉ thời gian.", "b) “Vì trời đổ mưa” là trạng ngữ chỉ nguyên nhân.", "c) “Ngoài sân” là trạng ngữ chỉ nơi chốn.", "d) Câu văn trên chỉ có một trạng ngữ."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đều đúng: câu có ba trạng ngữ chỉ thời gian, nguyên nhân, nơi chốn. d) Sai.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về các loại trạng ngữ:", "statements": ["a) Trạng ngữ chỉ mục đích trả lời câu hỏi “để làm gì?”.", "b) Trạng ngữ chỉ cách thức trả lời câu hỏi “ở đâu?”.", "c) Trạng ngữ chỉ nơi chốn trả lời câu hỏi “ở đâu?”.", "d) Trạng ngữ chỉ nguyên nhân thường bắt đầu bằng “vì, do, bởi…”."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: trạng ngữ chỉ cách thức trả lời câu hỏi “như thế nào? / bằng cách nào?”. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết một đoạn văn ngắn (5 – 7 câu) giới thiệu “cái riêng” đáng tự hào nhất của em và cách em phát huy nó.", "points": 0, "explain": "Gợi ý: nêu cái riêng (sở trường, tính cách, kĩ năng); kể dẫn chứng cụ thể (lần em thể hiện/được ghi nhận); nêu cách em rèn luyện, phát huy; kết đoạn: liên hệ với việc đóng góp cho tập thể lớp."}, {"type": "essay", "level": "VDC", "q": "Trình bày suy nghĩ của em về câu nói: “Trên đời chẳng có người tẻ nhạt” trong một đoạn văn khoảng 5 – 7 câu.", "points": 0, "explain": "Gợi ý: giải thích câu nói (mỗi người đều có nét riêng thú vị); lí lẽ: con người khác nhau về hoàn cảnh, sở thích, ước mơ; bằng chứng: một người em quen; rút ra cách nhìn người khác bằng con mắt tôn trọng, khám phá."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Câu mở đầu bài 8 “Trên đời chẳng có người tẻ nhạt” là lời của ai?", "options": ["A. Lạc Thanh", "B. Tô Hoài", "C. Ép-tu-sen-cô (Evgheni Evtushenko)", "D. Xuân Diệu"], "answer": "C", "explain": "Câu nói mở đầu bài học là của nhà thơ Nga Ép-tu-sen-cô, gợi đúng chủ đề: mỗi con người đều có nét riêng thú vị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vấn đề được bàn luận trong văn bản “Xem người ta kìa!” là gì?", "options": ["A. Cách nuôi dạy con bằng đòn roi", "B. Hành trình ra khơi đánh cá của người dân chài", "C. Lịch sử hình thành tạp chí văn nghệ", "D. Sự khác biệt (cái riêng) của mỗi người và cách ứng xử với sự khác biệt"], "answer": "D", "explain": "Từ câu nói của mẹ, tác giả bàn về việc mỗi người có một cái riêng và thái độ đúng đắn: tôn trọng sự khác biệt, biết hòa đồng mà không đánh mất mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “hiếu thuận” có nghĩa là gì?", "options": ["A. Có lòng kính yêu và biết nghe lời cha mẹ", "B. Giàu có, sung túc", "C. Thông minh, học giỏi", "D. Mạnh mẽ, dũng cảm"], "answer": "A", "explain": "Hiếu thuận là từ Hán Việt chỉ lòng kính yêu, thuận thảo đối với cha mẹ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trạng ngữ trong câu “Vì trời mưa to, trận bóng phải hoãn lại” chỉ điều gì?", "options": ["A. Nơi chốn", "B. Nguyên nhân", "C. Cách thức", "D. Mục đích"], "answer": "B", "explain": "“Vì trời mưa to” cho biết lí do của sự việc hoãn trận bóng, là trạng ngữ chỉ nguyên nhân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trạng ngữ chỉ cách thức trong câu “Em bé ngủ ngon lành trong vòng tay mẹ” là cụm từ nào?", "options": ["A. Trong vòng tay mẹ", "B. Em bé", "C. Ngon lành", "D. Vòng tay"], "answer": "C", "explain": "“Ngon lành” bổ sung thông tin về cách thức diễn ra sự việc ngủ, là trạng ngữ chỉ cách thức. “Trong vòng tay mẹ” là trạng ngữ chỉ nơi chốn, “em bé” là chủ ngữ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao bài văn nghị luận bắt buộc phải có bằng chứng?", "options": ["A. Vì có bằng chứng thì bài văn sẽ dài hơn", "B. Vì bằng chứng giúp bài văn có nhiều nhân vật hơn", "C. Vì đó là phần dễ viết nhất của bài văn", "D. Vì bằng chứng cụ thể làm cho lí lẽ thuyết phục và ý kiến trở nên đáng tin"], "answer": "D", "explain": "Lí lẽ chỉ là suy luận; muốn người đọc tin, phải có sự việc, ví dụ, số liệu có thật làm bằng chứng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về việc viết bài văn trình bày ý kiến:", "statements": ["a) Mở bài cần giới thiệu vấn đề và nêu ý kiến của người viết.", "b) Thân bài trình bày lí lẽ và bằng chứng theo trình tự hợp lí.", "c) Có thể bịa ra bằng chứng không có thật để bài văn thuyết phục hơn.", "d) Kết bài khẳng định lại ý kiến và có thể liên hệ với bản thân."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: bằng chứng phải chân thực, bịa đặt sẽ làm mất uy tín bài viết và sai đạo đức học tập. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về thái độ tôn trọng sự khác biệt:", "statements": ["a) Chê bai bạn có sở thích khác mình là tôn trọng sự khác biệt.", "b) Mỗi người nên phát huy cái riêng của mình theo hướng tích cực.", "c) Hòa đồng với tập thể đồng nghĩa với việc phải giống hệt mọi người.", "d) Sự khác biệt của mỗi người là điều tự nhiên và đáng quý."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: chê bai là thiếu tôn trọng. b) Đúng. c) Sai: hòa đồng không có nghĩa là hòa tan. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày ý kiến về hiện tượng một số bạn chạy theo trào lưu, bắt chước thần tượng trong mọi việc.", "points": 0, "explain": "Gợi ý: nêu ý kiến (cần học điều hay nhưng không đánh mất mình); lí lẽ: ngưỡng mộ khác với bắt chước máy móc; mỗi người có hoàn cảnh, thế mạnh riêng; bằng chứng thực tế; kết: khẳng định sống là chính mình."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu về chủ đề: Tôn trọng sự khác biệt giúp lớp học đoàn kết hơn.", "points": 0, "explain": "Gợi ý: nêu ý kiến; lí lẽ: hiểu và tôn trọng nhau giảm xung đột, mỗi người phát huy thế mạnh đóng góp cho lớp; bằng chứng: hoạt động nhóm, phong trào lớp có nhiều “màu sắc”; kết đoạn: lời kêu gọi/nhận thức bản thân."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Từ “chuẩn mực” có nghĩa là gì?", "options": ["A. Cái được chọn làm căn cứ, làm mẫu để theo đó mà làm cho đúng", "B. Một loại thước đo chiều dài", "C. Người đứng đầu lớp học", "D. Quy định bắt buộc trong nhà trường"], "answer": "A", "explain": "Chuẩn mực là cái được coi là mẫu đúng đắn để mọi người noi theo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “xuất chúng” có nghĩa là gì?", "options": ["A. Xuất hiện trước đám đông", "B. Nổi bật hơn hẳn mọi người về tài năng, trí tuệ", "C. Đi xa quê hương", "D. Giỏi thể thao hơn người khác"], "answer": "B", "explain": "Xuất chúng dùng để khen người có tài năng, trí tuệ vượt trội hẳn so với mọi người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “thâm tâm” có nghĩa là gì?", "options": ["A. Trái tim của con người", "B. Suy nghĩ thoáng qua", "C. Nơi sâu kín trong lòng người", "D. Lời nói chân thành"], "answer": "C", "explain": "Thâm tâm là phần sâu kín nhất trong lòng, nơi chứa những suy nghĩ, tình cảm thầm kín.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lí lẽ và bằng chứng khác nhau ở điểm nào?", "options": ["A. Lí lẽ luôn đúng còn bằng chứng luôn sai", "B. Lí lẽ chỉ có trong thơ, bằng chứng chỉ có trong truyện", "C. Hai khái niệm này hoàn toàn giống nhau", "D. Lí lẽ là điều giải thích, suy luận; bằng chứng là ví dụ, sự việc cụ thể dùng để chứng minh"], "answer": "D", "explain": "Phân biệt rõ: lí lẽ trả lời “vì sao đúng”, bằng chứng là “có thật như thế nào” – hai yếu tố bổ trợ cho nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận xét nào đúng về cách triển khai của văn bản “Xem người ta kìa!”?", "options": ["A. Dùng lời kể chuyện gần gũi để nêu vấn đề, rồi dùng lí lẽ và bằng chứng để bàn luận", "B. Chỉ liệt kê số liệu khô khan từ đầu đến cuối", "C. Kể chuyện hoàn toàn hư cấu, không bàn luận", "D. Chỉ dùng thơ để bày tỏ cảm xúc"], "answer": "A", "explain": "Nghệ thuật nghị luận của văn bản rất tự nhiên: mở đầu bằng câu chuyện gia đình quen thuộc, sau đó phân tích bằng lí lẽ và dẫn chứng thực tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc tác giả bắt đầu bài viết bằng câu chuyện của mẹ và “tôi” có tác dụng gì?", "options": ["A. Làm bài văn khó hiểu hơn", "B. Làm vấn đề nghị luận trở nên gần gũi, gợi đồng cảm cho người đọc", "C. Để kéo dài dung lượng bài viết", "D. Để giới thiệu quê hương của tác giả"], "answer": "B", "explain": "Câu chuyện đời thường khiến người đọc thấy mình trong đó, từ đó dễ tiếp nhận ý kiến mà tác giả trình bày.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về từ ngữ trong văn bản:", "statements": ["a) “Hiếu thuận” có nghĩa là kính yêu và biết nghe lời cha mẹ.", "b) “Xuất chúng” có nghĩa là bình thường như mọi người.", "c) “Thâm tâm” chỉ nơi sâu kín trong lòng.", "d) “Trách cứ” có nghĩa là khen ngợi, động viên."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: xuất chúng là nổi bật hơn hẳn mọi người. c) Đúng. d) Sai: trách cứ là tỏ ý không bằng lòng, chê trách.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau khi nghe và trình bày ý kiến:", "statements": ["a) Khi nghe, cần tóm tắt được ý kiến chính của người nói.", "b) Ngắt lời bạn liên tục là cách nghe tích cực.", "c) Khi trình bày, ý kiến cần có lí lẽ và bằng chứng đi kèm.", "d) Trình bày ý kiến cần giọng nói rõ ràng, thái độ tôn trọng người nghe."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: ngắt lời là thiếu tôn trọng, làm mất mạch trình bày. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Trình bày ý kiến của em về việc có nên xếp hạng, so sánh điểm số công khai giữa các học sinh trong lớp. Viết đoạn văn khoảng 5 – 7 câu.", "points": 0, "explain": "Gợi ý: nêu ý kiến rõ ràng; lí lẽ: so sánh công khai có thể tạo động lực cho số ít nhưng gây áp lực, tự ti cho nhiều bạn; mỗi bạn tiến bộ theo nhịp riêng; đề xuất cách đánh giá khích lệ (ghi nhận tiến bộ cá nhân); kết đoạn khẳng định."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5 – 7 câu) trình bày suy nghĩ về hiện tượng: bạn chậm hiểu thường bị các bạn khác xa lánh trong lớp.", "points": 0, "explain": "Gợi ý: nêu ý kiến (phê phán việc xa lánh); lí lẽ: mỗi người có tốc độ tiếp thu khác nhau, giúp đỡ nhau là trách nhiệm và cũng là cách học tốt; bằng chứng: lần em giúp bạn/giảng bài cho bạn; kết đoạn: mong muốn lớp học thân thiện."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Văn bản “Xem người ta kìa!” được kể theo ngôi nào?", "options": ["A. Ngôi thứ hai, xưng “bạn”", "B. Ngôi thứ ba, người kể giấu mình", "C. Ngôi thứ nhất, người kể xưng “tôi”", "D. Không có người kể"], "answer": "C", "explain": "Tác giả xưng “tôi”, kể chuyện của chính mình và mẹ, rồi bàn luận, nên văn bản dùng ngôi kể thứ nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phần viết của bài 8 yêu cầu em viết kiểu bài nào?", "options": ["A. Bài văn tả cảnh sinh hoạt", "B. Bài văn kể lại một truyền thuyết", "C. Đoạn văn ghi lại cảm xúc về một bài thơ", "D. Bài văn trình bày ý kiến về một hiện tượng (vấn đề) mà em quan tâm"], "answer": "D", "explain": "Bài 8 rèn kĩ năng viết bài văn nghị luận: trình bày ý kiến về một hiện tượng trong đời sống mà em quan tâm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo văn bản, “chỗ giống nhau nhất của mọi người trên thế gian này” là gì?", "options": ["A. Không ai giống ai cả", "B. Ai cũng có cha mẹ", "C. Ai cũng phải đi học", "D. Ai cũng có quê hương"], "answer": "A", "explain": "Câu nói đầy nghịch lí mà đúng: điểm chung lớn nhất của mọi người chính là mỗi người một vẻ, không ai giống ai cả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nếu đặt lại nhan đề “Hòa nhập nhưng không hòa tan” cho văn bản, nhan đề đó có phù hợp không? Vì sao?", "options": ["A. Không phù hợp, vì bài viết nói về việc học tập", "B. Phù hợp, vì tóm đúng ý kiến của bài: hòa đồng mà vẫn giữ cái riêng", "C. Phù hợp, vì nhan đề càng dài càng hay", "D. Không phù hợp, vì nhan đề gốc không thể thay thế"], "answer": "B", "explain": "“Hòa tan” là mất hẳn cái riêng trong tập thể; văn bản khuyên ta hòa nhập chứ đừng hòa tan, nên nhan đề gợi ý này đúng tinh thần bài học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài học thực tiễn mà văn bản gửi gắm tới học sinh là gì?", "options": ["A. Luôn so sánh mình với người khác để tiến bộ", "B. Chỉ chơi với những bạn giống mình", "C. Tôn trọng sự khác biệt của bạn bè và phát huy cái riêng tích cực của bản thân", "D. Tránh mọi hoạt động tập thể"], "answer": "C", "explain": "Hiểu rằng mỗi người một vẻ, ta sẽ biết quý trọng bản thân đúng cách và đối xử bao dung, tôn trọng với người khác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao sự độc đáo của từng cá nhân lại làm cho tập thể trở nên phong phú?", "options": ["A. Vì tập thể càng đông người càng tốt", "B. Vì cá nhân độc đáo không cần tuân thủ quy định chung", "C. Vì tập thể phong phú thì không cần kỉ luật", "D. Vì mỗi người đóng góp một năng lực, một màu sắc khác nhau cho tập thể"], "answer": "D", "explain": "Một lớp học giàu có khi có bạn giỏi tính toán, bạn khéo tay, bạn hát hay… mỗi người một thế mạnh bổ sung cho nhau.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nghệ thuật của văn bản “Xem người ta kìa!”:", "statements": ["a) Tác giả dùng lời kể chuyện để nêu vấn đề một cách tự nhiên.", "b) Văn bản không có bằng chứng nào từ thực tế.", "c) Giọng văn gần gũi, như lời trò chuyện, tâm tình.", "d) Tác giả lấy ví dụ từ chính lớp học của nhân vật “tôi” để chứng minh."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: bằng chứng của văn bản lấy từ thực tế lớp học và đời sống. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về ý nghĩa câu “sự hòa nhập có nhiều lối chứ không phải một”:", "statements": ["a) Câu nói khuyên mỗi người từ bỏ sở thích riêng để giống mọi người.", "b) Mỗi người có thể hòa nhập tập thể bằng thế mạnh riêng của mình.", "c) Giữ cái riêng không mâu thuẫn với sống hòa đồng.", "d) Câu nói phủ nhận hoàn toàn giá trị của tập thể."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: ý câu nói ngược lại – đừng ép mình giống hệt người khác. b) Đúng. c) Đúng. d) Sai: tác giả vẫn đề cao sự hòa đồng, gần gũi.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Em hãy viết đoạn văn khoảng 5 – 7 câu nêu ý kiến về câu nói của mẹ trong văn bản: “Xem người ta kìa!”.", "points": 0, "explain": "Gợi ý: hiểu tấm lòng cha mẹ (mong con tiến bộ); phân tích mặt chưa hợp lí (so sánh dễ làm con tự ti, mất cái riêng); đề xuất cách tiếp nhận đúng: lắng nghe, cố gắng theo khả năng của mình; kết đoạn: tình cảm với cha mẹ."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày ý kiến về hiện tượng học sinh nghiện trò chơi điện tử.", "points": 0, "explain": "Gợi ý: nêu ý kiến (cần chơi có điều độ); lí lẽ: chơi quá mức ảnh hưởng sức khỏe, học tập, quan hệ bạn bè; bằng chứng: trường hợp thực tế hoặc số liệu quen thuộc; đề xuất giải pháp: sắp xếp thời gian, thay bằng hoạt động thể thao, đọc sách."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong câu “Sáng nay, em đến trường sớm hơn mọi ngày”, trạng ngữ là cụm từ nào?", "options": ["A. Sáng nay", "B. Em", "C. Đến trường", "D. Sớm hơn mọi ngày"], "answer": "A", "explain": "“Sáng nay” bổ sung thông tin về thời gian cho sự việc “đến trường”, nên là trạng ngữ chỉ thời gian.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trạng ngữ chỉ thời gian trả lời cho câu hỏi nào?", "options": ["A. Ở đâu?", "B. Khi nào?", "C. Vì sao?", "D. Để làm gì?"], "answer": "B", "explain": "Muốn tìm trạng ngữ chỉ thời gian, ta đặt câu hỏi “khi nào?” cho sự việc trong câu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “hoàn hảo” có nghĩa là gì?", "options": ["A. Hoàn thành công việc đúng hạn", "B. Tròn trịa, không góc cạnh", "C. Tốt đẹp về mọi mặt", "D. Đẹp nhưng khó gần"], "answer": "C", "explain": "Hoàn hảo chỉ sự tốt đẹp trọn vẹn về mọi mặt, không có chỗ chê.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đoạn thứ hai của văn bản “Xem người ta kìa!” tập trung làm công việc gì?", "options": ["A. Kết thúc toàn bộ bài viết", "B. Giới thiệu quê hương tác giả", "C. Kể lại giấc mơ của nhân vật “tôi”", "D. Phân tích, chứng minh: làm rõ những lí do cha mẹ muốn con giống người khác và giá trị của sự khác biệt"], "answer": "D", "explain": "Đoạn 2 là phần triển khai của bài nghị luận: lí giải và chứng minh cho ý kiến bằng lí lẽ, bằng chứng từ thực tế lớp học và đời sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nghe bạn trình bày ý kiến, vì sao em cần tóm tắt được ý kiến của bạn?", "options": ["A. Để lắng nghe hiệu quả, hiểu đúng điều bạn nói trước khi đồng tình hay phản biện", "B. Để có thể nói chen vào bất cứ lúc nào", "C. Để ghi chép thay cho bạn", "D. Để chứng tỏ mình nghe giỏi hơn bạn"], "answer": "A", "explain": "Tóm tắt đúng ý người khác là biểu hiện của lắng nghe tích cực, là nền tảng của tranh luận văn minh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây có trạng ngữ chỉ nguyên nhân?", "options": ["A. Sáng mai, lớp ta đi lao động.", "B. Vì mải chơi game, Nam làm bài tập muộn.", "C. Em làm bài cẩn thận.", "D. Cô giáo giảng bài rất hay."], "answer": "B", "explain": "“Vì mải chơi game” cho biết nguyên nhân của việc làm bài muộn, là trạng ngữ chỉ nguyên nhân.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau khi xác định trạng ngữ trong câu “Để giữ gìn sức khỏe, em tập thể dục đều đặn mỗi sáng”:", "statements": ["a) “Để giữ gìn sức khỏe” là trạng ngữ chỉ mục đích.", "b) “Mỗi sáng” là trạng ngữ chỉ thời gian.", "c) “Đều đặn” là trạng ngữ chỉ nơi chốn.", "d) Trong câu còn có trạng ngữ chỉ cách thức là “đều đặn”."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: “đều đặn” không chỉ nơi chốn. d) Đúng: “đều đặn” bổ sung thông tin về cách thức thực hiện việc tập thể dục nên là trạng ngữ chỉ cách thức.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về bằng chứng trong bài nghị luận:", "statements": ["a) Bằng chứng nên càng nhiều càng tốt, kể cả khi không liên quan đến lí lẽ.", "b) Bằng chứng phải tiêu biểu, sát với lí lẽ cần chứng minh.", "c) Số liệu, sự việc có thật là những bằng chứng có sức thuyết phục cao.", "d) Có thể lấy bằng chứng từ chính văn bản văn học khi nghị luận về tác phẩm."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: bằng chứng thừa, không liên quan làm bài lan man, kém thuyết phục. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày ý kiến: Có nên cho học sinh lớp 6 dùng điện thoại thông minh khi đến trường?", "points": 0, "explain": "Gợi ý: nêu ý kiến (hạn chế/đồng ý có điều kiện); lí lẽ hai phía: tiện liên lạc, tra cứu học tập >< gây xao nhãng, lệ thuộc; bằng chứng từ thực tế lớp em; kết đoạn: đề xuất quy định hợp lí."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu thuyết phục các bạn cùng tham gia hoạt động văn nghệ của lớp dù mỗi người một khả năng khác nhau.", "points": 0, "explain": "Gợi ý: nêu vấn đề (nhiều bạn ngại vì thấy mình “không giống” bạn giỏi văn nghệ); lí lẽ: mỗi người đóng góp một phần (hát, múa, hậu cần, dẫn chương trình); bằng chứng; kết đoạn: lời mời gọi đoàn kết, tự tin vào cái riêng."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Từ “trách cứ” có nghĩa là gì?", "options": ["A. Khen ngợi, động viên", "B. Nhắc nhở nhẹ nhàng", "C. Tỏ ra không bằng lòng, chê trách", "D. Giao nhiệm vụ cho người khác"], "answer": "C", "explain": "Trách cứ là bộc lộ sự không hài lòng, phàn nàn về ai đó.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong bài văn trình bày ý kiến, thân bài có nhiệm vụ gì?", "options": ["A. Kể lại một câu chuyện vui", "B. Miêu tả ngoại hình nhân vật", "C. Liệt kê các từ khó trong bài", "D. Trình bày các lí lẽ và bằng chứng để làm rõ ý kiến"], "answer": "D", "explain": "Thân bài là phần triển khai: nêu lí lẽ, dẫn bằng chứng, phân tích để ý kiến được sáng tỏ và thuyết phục.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kết bài của bài văn trình bày ý kiến thường làm điều gì?", "options": ["A. Khẳng định lại ý kiến và nêu ý nghĩa, liên hệ thực tế", "B. Mở ra một câu chuyện mới", "C. Đặt thêm nhiều câu hỏi chưa trả lời", "D. Kể lại toàn bộ sự việc từ đầu"], "answer": "A", "explain": "Kết bài chốt lại vấn đề: nhắc lại ý kiến, rút ra bài học hoặc liên hệ với bản thân, đời sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trạng ngữ có thể lược bỏ khỏi câu không? Vì sao?", "options": ["A. Không thể, vì thiếu trạng ngữ câu sẽ sai ngữ pháp", "B. Có thể, vì trạng ngữ là thành phần phụ; bỏ đi câu vẫn đủ ý chính", "C. Có thể, vì trạng ngữ không bao giờ có ích", "D. Không thể, vì trạng ngữ là chủ ngữ của câu"], "answer": "B", "explain": "Trạng ngữ làm giàu thêm thông tin cho câu nhưng không quyết định ý chính, nên khi cần ngắn gọn ta có thể lược bỏ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dẫn chứng nào phù hợp nhất cho lí lẽ “Mỗi bạn đều có một sở trường riêng”?", "options": ["A. Cả lớp hôm nay đều mặc đồng phục", "B. Hôm qua trời mưa rất to", "C. Bạn Lan giải toán nhanh, bạn Hùng vẽ đẹp, bạn Mai hát hay và chơi đàn giỏi", "D. Lớp em có bốn mươi hai học sinh"], "answer": "C", "explain": "Bằng chứng phải gắn trực tiếp với lí lẽ: các bạn khác nhau về năng lực chính là ví dụ cụ thể chứng minh mỗi người có sở trường riêng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi viết bài văn trình bày ý kiến, vì sao em nên chọn hiện tượng mình quan tâm và hiểu biết?", "options": ["A. Vì hiện tượng quen thuộc thì không cần lập dàn ý", "B. Vì giáo viên chỉ chấm những đề tài quen thuộc", "C. Vì chọn đề tài khác sẽ bị coi là lạc đề", "D. Vì có hiểu biết và quan tâm thì mới có lí lẽ sâu sắc, bằng chứng thuyết phục"], "answer": "D", "explain": "Quan tâm và hiểu biết giúp bài viết có cảm xúc thật, lí lẽ chắc, tránh nói chung chung, sáo rỗng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về chủ đề bài 8:", "statements": ["a) Chủ đề của bài là “Khác biệt và gần gũi”.", "b) Câu thơ mở đầu bài học là của nhà thơ Ép-tu-sen-cô.", "c) Bài học dạy ta phải gạt bỏ cái riêng để được mọi người yêu quý.", "d) Bức tranh minh họa văn bản là của họa sĩ Rơ-nê Ma-grit."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: bài học dạy ta giữ cái riêng và tôn trọng khác biệt. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về bố cục văn bản “Xem người ta kìa!”:", "statements": ["a) Đoạn 1 nêu vấn đề: cha mẹ thường so sánh con với người khác.", "b) Đoạn 2 phân tích, chứng minh vấn đề bằng lí lẽ và bằng chứng.", "c) Đoạn 3 kết luận, khẳng định ý kiến của tác giả.", "d) Ba đoạn của văn bản không liên quan gì đến nhau."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng theo bố cục ba phần chuẩn của một bài nghị luận ngắn. d) Sai: các đoạn liên kết chặt chẽ thành một mạch lập luận.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Trình bày suy nghĩ của em về ý kiến: “Hòa nhập nhưng không hòa tan” trong đoạn văn khoảng 5 – 7 câu.", "points": 0, "explain": "Gợi ý: giải thích hai khái niệm (hòa nhập: gần gũi, hợp tác; hòa tan: mất cái riêng); lí lẽ: cần cả hai mặt – gắn bó tập thể và giữ bản sắc; bằng chứng từ lớp học/đời sống; kết đoạn: bài học cho bản thân."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu trình bày ý kiến về hiện tượng chen lấn, xô đẩy khi xếp hàng ở trường.", "points": 0, "explain": "Gợi ý: nêu ý kiến phê phán; lí lẽ: chen lấn gây mất trật tự, nguy hiểm, thể hiện thiếu tôn trọng người khác; bằng chứng: cảnh ở căng-tin/cổng trường; đề xuất: tự giác xếp hàng, nhắc nhở nhau."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Từ “siêu việt” có nghĩa là gì?", "options": ["A. Vượt lên hẳn so với người bình thường", "B. Siêu hình, khó hiểu", "C. Nhanh hơn ánh sáng", "D. Cao hơn mọi vật xung quanh"], "answer": "A", "explain": "Siêu việt chỉ khả năng, phẩm chất vượt xa mức bình thường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bức tranh được dùng minh họa cho văn bản “Xem người ta kìa!” trong sách giáo khoa là tranh của họa sĩ nào?", "options": ["A. Pablo Picasso", "B. Rơ-nê Ma-grit (René Magritte)", "C. Van Gogh", "D. Lê-ô-na đơ Vanh-xi"], "answer": "B", "explain": "Bức tranh “Những bí ẩn của chân trời” của danh họa Rơ-nê Ma-grit minh họa cho văn bản, gợi ý mỗi người nhìn về một hướng riêng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Văn bản “Xem người ta kìa!” gồm mấy đoạn chính?", "options": ["A. Hai đoạn", "B. Bốn đoạn", "C. Ba đoạn", "D. Năm đoạn"], "answer": "C", "explain": "Văn bản có bố cục ba đoạn: nêu vấn đề, phân tích – chứng minh, kết luận khẳng định ý kiến.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "“Hòa đồng” và “hòa tan” khác nhau như thế nào?", "options": ["A. Hai từ này có nghĩa hoàn toàn giống nhau", "B. Hòa đồng là sống một mình, hòa tan là sống với tập thể", "C. Hòa đồng chỉ dùng cho chất lỏng, hòa tan chỉ dùng cho con người", "D. Hòa đồng là gần gũi, hợp tác với mọi người mà vẫn giữ bản sắc riêng; hòa tan là đánh mất hẳn cái riêng của mình"], "answer": "D", "explain": "Hòa đồng là thái độ sống được khuyến khích; hòa tan là điều cần tránh vì làm con người mất đi giá trị độc đáo của bản thân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận xét “Trên đời chẳng có người tẻ nhạt” gợi cho em hiểu điều gì về con người?", "options": ["A. Mỗi người đều có những nét riêng thú vị, đáng quý nếu ta biết nhìn nhận", "B. Con người ai cũng giống nhau hoàn toàn", "C. Chỉ người nổi tiếng mới không tẻ nhạt", "D. Tẻ nhạt là tính cách tốt cần phát huy"], "answer": "A", "explain": "Câu nói khẳng định giá trị riêng của từng con người bình thường – đúng với chủ đề “Khác biệt và gần gũi” của bài học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong lớp học, hành động nào thể hiện sự tôn trọng khác biệt?", "options": ["A. Chê bai bạn có sở thích không giống mình", "B. Lắng nghe bạn trình bày ý kiến khác với mình và góp ý nhẹ nhàng", "C. Chỉ chơi với nhóm bạn giống hệt mình", "D. Bắt bạn phải thay đổi theo ý mình"], "answer": "B", "explain": "Tôn trọng khác biệt thể hiện ở thái độ lắng nghe, không chê bai, không áp đặt – dù quan điểm, sở thích của bạn khác mình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau khi thêm trạng ngữ vào câu:", "statements": ["a) Thêm trạng ngữ làm câu văn thêm thông tin về hoàn cảnh của sự việc.", "b) Mọi câu văn bắt buộc phải thêm trạng ngữ mới đúng ngữ pháp.", "c) Trạng ngữ ở đầu câu thường được ngăn cách bằng dấu phẩy.", "d) Có thể thêm nhiều trạng ngữ khác loại vào cùng một câu."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: trạng ngữ là thành phần phụ, không bắt buộc. c) Đúng. d) Đúng: một câu có thể có trạng ngữ thời gian, nơi chốn, nguyên nhân… cùng lúc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về cách đối xử với bạn bè có khác biệt:", "statements": ["a) Nên tôn trọng sở thích, tính cách riêng của bạn.", "b) Nên ép bạn thay đổi để giống cả nhóm.", "c) Khác biệt về năng lực giữa các bạn là điều bình thường.", "d) Có thể học hỏi điểm mạnh từ những bạn khác mình."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: ép buộc là thiếu tôn trọng sự khác biệt. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn (5 – 7 câu) trình bày ý kiến của em về việc đọc sách giấy và đọc sách điện tử.", "points": 0, "explain": "Gợi ý: nêu ý kiến cá nhân; so sánh ưu – nhược của hai hình thức (cảm giác, sự tập trung / tiện lợi, kho sách lớn); bằng chứng trải nghiệm của em; kết đoạn: chọn cách đọc phù hợp, quan trọng là thói quen đọc mỗi ngày."}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 5 – 7 câu kể về một người bạn có “cái riêng” khiến em khâm phục và điều em học được từ bạn.", "points": 0, "explain": "Gợi ý: giới thiệu bạn và cái riêng nổi bật (tài năng, tính cách, nghị lực); kể sự việc/dẫn chứng cụ thể; nêu điều em học được; kết đoạn: cảm nghĩ về sự khác biệt đáng quý."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Đoạn mở đầu của văn bản “Xem người ta kìa!” có nhiệm vụ gì?", "options": ["A. Kết luận toàn bộ vấn đề", "B. Giới thiệu tiểu sử tác giả", "C. Nêu vấn đề nghị luận: việc cha mẹ thường so sánh con với người khác", "D. Miêu tả cảnh lớp học"], "answer": "C", "explain": "Mở đầu bằng câu chuyện mẹ thường bảo “Xem người ta kìa!”, tác giả nêu vấn đề cần bàn một cách gần gũi, tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hoạt động nói và nghe của bài 8 yêu cầu học sinh làm gì?", "options": ["A. Kể lại một câu chuyện cổ tích", "B. Đọc thuộc lòng một bài thơ", "C. Giới thiệu về quê hương của mình", "D. Trình bày ý kiến về một hiện tượng (vấn đề) và biết tóm tắt ý kiến của người khác"], "answer": "D", "explain": "Bài 8 rèn nói – nghe theo hướng nghị luận: trình bày rõ ý kiến của mình và lắng nghe, tóm tắt đúng ý kiến của người nói.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ý kiến trong bài văn nghị luận là ý kiến của ai?", "options": ["A. Của người viết", "B. Của nhân vật chính trong truyện", "C. Của người đọc", "D. Của giáo viên chấm bài"], "answer": "A", "explain": "Ý kiến là quan điểm của người viết về vấn đề; người đọc có thể đồng tình hoặc phản biện lại ý kiến đó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi tranh luận, muốn phản biện ý kiến của bạn một cách văn minh, em nên làm gì trước tiên?", "options": ["A. Lập tức phủ nhận mọi điều bạn nói", "B. Tóm tắt lại đúng ý kiến của bạn để chắc chắn mình hiểu đúng", "C. Nói thật to để át giọng bạn", "D. Rủ thêm nhiều bạn cùng phản đối"], "answer": "B", "explain": "Nghe và hiểu đúng ý bạn là bước đầu tiên của tranh luận văn minh; phản biện phải dựa trên lí lẽ và bằng chứng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao bằng chứng trong văn bản “Xem người ta kìa!” chủ yếu được lấy từ lớp học và đời sống hằng ngày?", "options": ["A. Vì tác giả không biết thêm ví dụ nào khác", "B. Vì văn bản nghị luận cấm dùng số liệu", "C. Vì những bằng chứng gần gũi, có thật ấy dễ kiểm chứng và đúng với vấn đề bàn về con người trong tập thể", "D. Vì lớp học là nơi duy nhất có sự khác biệt"], "answer": "C", "explain": "Vấn đề bàn luận gắn với cuộc sống thường ngày của mỗi người, nên bằng chứng từ lớp học, gia đình là tiêu biểu và thuyết phục nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn Minh hát hay nhưng không dám tham gia văn nghệ lớp vì sợ bị chê là “khác người”. Dựa vào bài học, em nên khuyên bạn điều gì?", "options": ["A. Nên giấu tài năng của mình để giống mọi người", "B. Chỉ nên tham gia khi cả lớp bắt buộc", "C. Hãy bỏ hát và chọn một sở thích giống các bạn", "D. Hãy tự tin thể hiện cái riêng, vì sự độc đáo của mỗi người làm cho tập thể phong phú hơn"], "answer": "D", "explain": "Bài học khẳng định chỗ “không giống ai” nhiều khi là phần đáng quý; tự tin phát huy thế mạnh riêng là cách đóng góp cho tập thể.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về lí lẽ trong văn bản nghị luận:", "statements": ["a) Lí lẽ là những điều người viết nêu ra để giải thích, chứng minh cho ý kiến.", "b) Lí lẽ phải hợp lí, đúng đắn thì bài viết mới thuyết phục.", "c) Một ý kiến có thể được làm rõ bằng nhiều lí lẽ khác nhau.", "d) Lí lẽ và bằng chứng là hai tên gọi của cùng một yếu tố."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: lí lẽ là suy luận, giải thích; bằng chứng là dẫn chứng cụ thể – hai yếu tố khác nhau.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về trình bày ý kiến trước tập thể:", "statements": ["a) Cần chuẩn bị ý kiến kèm lí lẽ, bằng chứng trước khi nói.", "b) Khi bạn khác ý kiến, em có quyền chê bai cá nhân bạn.", "c) Sau khi nghe, có thể tóm tắt lại ý kiến của người khác để kiểm chứng sự hiểu đúng.", "d) Nói và nghe trong bài 8 cùng hướng tới trao đổi ý kiến về một hiện tượng đời sống."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: tranh luận phải văn minh, tập trung vào ý kiến chứ không công kích cá nhân. c) Đúng. d) Đúng.", "points": 1}, {"type": "essay", "level": "VDC", "q": "Trình bày ý kiến của em về câu nói: “Mỗi người phải được tôn trọng, với tất cả những cái khác biệt vốn có”. Viết đoạn văn khoảng 5 – 7 câu.", "points": 0, "explain": "Gợi ý: đồng tình với ý kiến; lí lẽ: khác biệt là vốn có, tôn trọng là nền tảng của quan hệ tốt đẹp; bằng chứng trong lớp, trong gia đình; kết đoạn: liên hệ hành động của bản thân."}, {"type": "essay", "level": "VDC", "q": "Viết một bài văn ngắn trình bày ý kiến về một hiện tượng ở trường em mà em quan tâm (ví dụ: giữ gìn vệ sinh lớp học, nói lời hay làm việc tốt, an toàn giao thông trước cổng trường…).", "points": 0, "explain": "Gợi ý dàn ý: mở bài giới thiệu hiện tượng và ý kiến; thân bài: thực trạng, nguyên nhân, tác hại/ý nghĩa kèm bằng chứng thực tế, đề xuất giải pháp; kết bài: khẳng định lại ý kiến, lời kêu gọi hoặc liên hệ bản thân. Chấm theo bố cục bài văn nghị luận, lí lẽ – bằng chứng, diễn đạt."}]}]}
