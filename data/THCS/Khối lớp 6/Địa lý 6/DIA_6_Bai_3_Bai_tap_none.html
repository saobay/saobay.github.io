<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3: Tỉ lệ bản đồ - Tính khoảng cách thực tế - Bài tập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 16px; line-height: 1.6; }
        .question { background: white; padding: 16px; margin: 12px 0; border-radius: 8px; border: 1px solid #e2e8f0; }
        .options label { display: block; padding: 8px; margin: 4px 0; background: #f8fafc; border-radius: 4px; cursor: pointer; }
        .options label:hover { background: #e0f2fe; }
    </style>
</head>
<body class="bg-slate-50">
<div class="max-w-3xl mx-auto">
<h1 class="text-2xl font-bold mb-4">Bài 3: Tỉ lệ bản đồ - Tính khoảng cách thực tế - Bài tập</h1>

<div class="question">
<p class="font-semibold mb-2">Câu 1: Trên bản đồ 1:100.000, 2cm ứng với bao nhiêu km thực tế?</p>
<div class="options">
<label><input type="radio" name="q1" value="A"> A. 2km</label>
<label><input type="radio" name="q1" value="B"> B. 20km</label>
<label><input type="radio" name="q1" value="C"> C. 200km</label>
<label><input type="radio" name="q1" value="D"> D. 0,2km</label>
</div>
<button onclick="checkAnswer('q1', 'A')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q1" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 2: Trên bản đồ 1:1.000.000, 3cm ứng với:</p>
<div class="options">
<label><input type="radio" name="q2" value="A"> A. 3km</label>
<label><input type="radio" name="q2" value="B"> B. 30km</label>
<label><input type="radio" name="q2" value="C"> C. 300km</label>
<label><input type="radio" name="q2" value="D"> D. 3000km</label>
</div>
<button onclick="checkAnswer('q2', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q2" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 3: Muốn tính khoảng cách thực tế, ta làm:</p>
<div class="options">
<label><input type="radio" name="q3" value="A"> A. Chia cho mẫu số tỉ lệ</label>
<label><input type="radio" name="q3" value="B"> B. Nhân với mẫu số tỉ lệ</label>
<label><input type="radio" name="q3" value="C"> C. Cộng với mẫu số</label>
<label><input type="radio" name="q3" value="D"> D. Trừ đi mẫu số</label>
</div>
<button onclick="checkAnswer('q3', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q3" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 4: Tỉ lệ thước có ưu điểm:</p>
<div class="options">
<label><input type="radio" name="q4" value="A"> A. Chính xác hơn tỉ lệ số</label>
<label><input type="radio" name="q4" value="B"> B. Đo trực tiếp không cần tính</label>
<label><input type="radio" name="q4" value="C"> C. Đẹp hơn</label>
<label><input type="radio" name="q4" value="D"> D. Rẻ hơn</label>
</div>
<button onclick="checkAnswer('q4', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q4" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 5: Bản đồ tỉ lệ 1:10.000 thuộc loại:</p>
<div class="options">
<label><input type="radio" name="q5" value="A"> A. Tỉ lệ lớn</label>
<label><input type="radio" name="q5" value="B"> B. Tỉ lệ trung bình</label>
<label><input type="radio" name="q5" value="C"> C. Tỉ lệ nhỏ</label>
<label><input type="radio" name="q5" value="D"> D. Không xác định</label>
</div>
<button onclick="checkAnswer('q5', 'A')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q5" class="mt-2"></div>
</div>
</div>
<script>
function checkAnswer(qid, correct) {
    const selected = document.querySelector(`input[name="${qid}"]:checked`);
    const feedback = document.getElementById(`fb-${qid}`);
    if (!selected) { feedback.innerHTML = '<span class="text-orange-600">Hãy chọn đáp án!</span>'; return; }
    if (selected.value === correct) {
        feedback.innerHTML = '<span class="text-green-600 font-bold">✓ Đúng!</span>';
    } else {
        feedback.innerHTML = '<span class="text-red-600">✗ Chưa đúng. Đáp án đúng: ' + correct + '</span>';
    }
}
</script>
</body>
</html>
