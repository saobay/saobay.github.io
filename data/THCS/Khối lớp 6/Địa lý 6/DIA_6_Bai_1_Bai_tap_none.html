<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1: Vị trí, hình dạng và kích thước của Trái Đất - Bài tập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 16px; line-height: 1.6; }
        .question { background: white; padding: 16px; margin: 12px 0; border-radius: 8px; border: 1px solid #e2e8f0; }
        .options label { display: block; padding: 8px; margin: 4px 0; background: #f8fafc; border-radius: 4px; cursor: pointer; }
        .options label:hover { background: #e0f2fe; }
    </style>
</head>
<body class="bg-slate-50">
<div class="max-w-3xl mx-auto">
<h1 class="text-2xl font-bold mb-4">Bài 1: Vị trí, hình dạng và kích thước của Trái Đất - Bài tập</h1>

<div class="question">
<p class="font-semibold mb-2">Câu 1: Trái Đất là hành tinh thứ mấy tính từ Mặt Trời?</p>
<div class="options">
<label><input type="radio" name="q1" value="A"> A. Thứ nhất</label>
<label><input type="radio" name="q1" value="B"> B. Thứ hai</label>
<label><input type="radio" name="q1" value="C"> C. Thứ ba</label>
<label><input type="radio" name="q1" value="D"> D. Thứ tư</label>
</div>
<button onclick="checkAnswer('q1', 'C')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q1" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 2: Hình dạng của Trái Đất là:</p>
<div class="options">
<label><input type="radio" name="q2" value="A"> A. Hình tròn phẳng</label>
<label><input type="radio" name="q2" value="B"> B. Hình cầu hơi dẹt ở hai cực</label>
<label><input type="radio" name="q2" value="C"> C. Hình vuông</label>
<label><input type="radio" name="q2" value="D"> D. Hình elip dẹt</label>
</div>
<button onclick="checkAnswer('q2', 'B')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q2" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 3: Chu vi xích đạo của Trái Đất khoảng:</p>
<div class="options">
<label><input type="radio" name="q3" value="A"> A. 20.000 km</label>
<label><input type="radio" name="q3" value="B"> B. 30.000 km</label>
<label><input type="radio" name="q3" value="C"> C. 40.000 km</label>
<label><input type="radio" name="q3" value="D"> D. 50.000 km</label>
</div>
<button onclick="checkAnswer('q3', 'C')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q3" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 4: Diện tích bề mặt Trái Đất khoảng:</p>
<div class="options">
<label><input type="radio" name="q4" value="A"> A. 310 triệu km²</label>
<label><input type="radio" name="q4" value="B"> B. 410 triệu km²</label>
<label><input type="radio" name="q4" value="C"> C. 510 triệu km²</label>
<label><input type="radio" name="q4" value="D"> D. 610 triệu km²</label>
</div>
<button onclick="checkAnswer('q4', 'C')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q4" class="mt-2"></div>
</div>
<div class="question">
<p class="font-semibold mb-2">Câu 5: Hành tinh nào có sự sống (tính đến nay)?</p>
<div class="options">
<label><input type="radio" name="q5" value="A"> A. Sao Hỏa</label>
<label><input type="radio" name="q5" value="B"> B. Sao Kim</label>
<label><input type="radio" name="q5" value="C"> C. Trái Đất</label>
<label><input type="radio" name="q5" value="D"> D. Sao Mộc</label>
</div>
<button onclick="checkAnswer('q5', 'C')" class="mt-2 px-4 py-1 bg-blue-600 text-white rounded">Kiểm tra</button>
<div id="fb-q5" class="mt-2"></div>
</div>
</div>
<script>
function checkAnswer(qid, correct) {
    const selected = document.querySelector(`input[name="${qid}"]:checked`);
    const feedback = document.getElementById(`fb-${qid}`);
    if (!selected) { feedback.innerHTML = '<span class="text-orange-600">Hãy chọn đáp án!</span>'; return; }
    if (selected.value === correct) {
        feedback.innerHTML = '<span class="text-green-600 font-bold">✓ Đúng!</span>';
    } else {
        feedback.innerHTML = '<span class="text-red-600">✗ Chưa đúng. Đáp án đúng: ' + correct + '</span>';
    }
}
</script>
</body>
</html>
