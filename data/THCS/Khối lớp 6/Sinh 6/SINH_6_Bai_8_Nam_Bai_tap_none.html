<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Nấm thuộc nhóm sinh vật nào theo cấu tạo tế bào?", "options": ["A. Sinh vật nhân sơ", "B. Sinh vật nhân thực, tế bào có thành bằng kitin", "C. Chưa có cấu tạo tế bào", "D. Sinh vật có lục lạp như thực vật"], "answer": "B", "explain": "Nấm là sinh vật nhân thực; thành tế bào nấm được cấu tạo bằng kitin, khác thực vật (xenlulôzơ).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặc điểm dinh dưỡng chung của nấm là gì?", "options": ["A. Tự dưỡng nhờ quang hợp", "B. Dị dưỡng: hoại sinh, kí sinh hoặc cộng sinh", "C. Ăn thịt động vật", "D. Chỉ hút nước và muối khoáng như cây"], "answer": "B", "explain": "Nấm không có lục lạp nên không quang hợp được; chúng sống dị dưỡng bằng cách hoại sinh, kí sinh hay cộng sinh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao nấm không được xếp vào giới Thực vật dù nhiều loài sống cố định như cây?", "options": ["A. Vì nấm quá nhỏ", "B. Vì nấm không có lục lạp, dinh dưỡng dị dưỡng và thành tế bào bằng kitin", "C. Vì nấm không có tế bào", "D. Vì nấm sống dưới đất"], "answer": "B", "explain": "Khác thực vật: nấm không có lục lạp nên không tự dưỡng, thành tế bào bằng kitin — vì vậy nấm thuộc giới riêng: giới Nấm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nấm men là dạng nấm nào?", "options": ["A. Nấm đa bào lớn", "B. Nấm đơn bào", "C. Nấm dạng sợi không có tế bào", "D. Tảo đơn bào"], "answer": "B", "explain": "Nấm men là nấm đơn bào, tế bào hình bầu dục, sinh sản chủ yếu bằng nảy chồi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cơ thể nấm mốc và nấm lớn được cấu tạo từ những cấu trúc nào?", "options": ["A. Rễ, thân, lá", "B. Các sợi nấm mảnh gồm nhiều tế bào nối tiếp nhau", "C. Một tế bào duy nhất", "D. Các lông bơi"], "answer": "B", "explain": "Cơ thể nấm đa bào gồm hệ sợi nấm; các sợi do nhiều tế bào dài nối tiếp tạo thành.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nấm sinh sản chủ yếu bằng bộ phận nào?", "options": ["A. Hạt", "B. Bào tử", "C. Hoa", "D. Quả"], "answer": "B", "explain": "Phần lớn nấm sinh sản bằng bào tử — các hạt rất nhỏ, nhẹ, phát tán nhờ gió, nước.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về đặc điểm chung của nấm.", "statements": ["a) Nấm là sinh vật nhân thực.", "b) Nấm có lục lạp nên tự dưỡng được.", "c) Thành tế bào nấm bằng kitin.", "d) Nấm gồm cả dạng đơn bào và đa bào."], "answer": ["T", "F", "T", "T"], "explain": "Nấm không có lục lạp nên sống dị dưỡng; thành tế bào nấm bằng kitin.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về cấu tạo nấm lớn.", "statements": ["a) Phần ăn được của nấm rơm là thể quả gồm mũ và thân nấm.", "b) Dưới mũ nấm có các phiến chứa bào tử.", "c) Sợi nấm nằm trong giá thể giúp hút chất dinh dưỡng.", "d) Nấm lớn có rễ, thân, lá như cây xanh."], "answer": ["T", "T", "T", "F"], "explain": "Nấm không có rễ, thân, lá thật; cơ thể gồm hệ sợi và thể quả.", "points": 1}, {"type": "short", "level": "NB", "q": "Nhóm sinh vật nhân thực, thành tế bào bằng kitin, sống dị dưỡng như nấm men, nấm mốc thuộc giới nào?", "answer": "Giới Nấm", "explain": "Đó là giới Nấm trong hệ thống năm giới.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Thành tế bào của nấm được cấu tạo bằng chất gì?", "answer": "Kitin", "explain": "Kitin cũng là chất cấu tạo vỏ của côn trùng, tôm cua.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "VD", "q": "Ở nấm lớn ăn được (nấm rơm, nấm hương), phần ta thường ăn là bộ phận nào?", "options": ["A. Sợi nấm dưới đất", "B. Thể quả (mũ nấm và thân nấm) mọc trên mặt đất", "C. Bào tử", "D. Rễ nấm"], "answer": "B", "explain": "Phần thu hái làm thực phẩm là thể quả của nấm gồm mũ và thân; hệ sợi nấm nằm ẩn trong giá thể.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Dưới mũ nấm có các phiến mỏng chứa rất nhiều gì?", "options": ["A. Hạt giống", "B. Bào tử", "C. Nhị hoa", "D. Lông hút"], "answer": "B", "explain": "Dưới mũ nấm là các phiến (lá tia) mang vô số bào tử để nấm sinh sản và phát tán.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nấm men được dùng để làm bánh mì nở xốp nhờ khả năng nào?", "options": ["A. Quang hợp tạo ôxi", "B. Lên men, sinh khí CO₂ làm bột nở", "C. Tạo bào tử", "D. Cố định đạm"], "answer": "B", "explain": "Nấm men lên men đường trong bột, sinh khí cacbonic làm bột nở và tạo nên độ xốp của bánh mì.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nấm men còn được dùng trong sản xuất đồ uống nào?", "options": ["A. Nước ngọt có gas đóng chai", "B. Rượu và bia (lên men tạo cồn)", "C. Sữa tiệt trùng", "D. Trà đá"], "answer": "B", "explain": "Nấm men lên men đường trong nho, lúa mạch... tạo thành cồn ethylic trong rượu và bia.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Kháng sinh penicillin đầu tiên được chiết xuất từ sinh vật nào?", "options": ["A. Vi khuẩn lao", "B. Nấm mốc xanh (Penicillium)", "C. Tảo silic", "D. Trùng roi"], "answer": "B", "explain": "Penicillin do nấm mốc Penicillium tiết ra, là kháng sinh đầu tiên cứu sống hàng triệu người bệnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nấm mốc xanh thường mọc trên thực phẩm nào bị hỏng?", "options": ["A. Cơm mới nấu", "B. Cam, quýt, bánh mì để lâu bị ẩm", "C. Thịt đông lạnh", "D. Đường kính"], "answer": "B", "explain": "Nấm mốc phát triển trên thực phẩm ẩm, giàu dinh dưỡng để lâu như cam quýt hỏng, bánh mì mốc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về nấm men.", "statements": ["a) Nấm men là nấm đơn bào.", "b) Nấm men giúp bột bánh mì nở nhờ sinh khí CO₂ khi lên men.", "c) Nấm men được dùng để sản xuất rượu, bia.", "d) Nấm men sinh sản chủ yếu bằng hạt."], "answer": ["T", "T", "T", "F"], "explain": "Nấm men sinh sản bằng nảy chồi và phân đôi, không sinh sản bằng hạt.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về nấm mốc.", "statements": ["a) Nấm mốc thường phát triển trên thực phẩm ẩm để lâu.", "b) Mốc xanh trên cam hỏng là một loại nấm mốc.", "c) Nấm mốc Penicillium được dùng để sản xuất kháng sinh.", "d) Thực phẩm mới mốc một chút, cắt bỏ phần mốc là ăn an toàn tuyệt đối."], "answer": ["T", "T", "T", "F"], "explain": "Độc tố nấm có thể lan trong thực phẩm mềm; thực phẩm đã mốc nên bỏ toàn bộ.", "points": 1}, {"type": "short", "level": "NB", "q": "Tế bào sinh sản rất nhỏ, nhẹ, giúp nấm phát tán đi xa được gọi là gì?", "answer": "Bào tử", "explain": "Bào tử được tạo ra với số lượng lớn ở mũ nấm và các cấu trúc sinh sản.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Phần nấm lớn mọc trên mặt đất gồm mũ và thân, được thu hái làm thức ăn gọi là gì?", "answer": "Thể quả", "explain": "Thể quả là cơ quan mang bào tử của nấm lớn.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nấm có vai trò gì trong tự nhiên với tư cách sinh vật hoại sinh?", "options": ["A. Gây bệnh cho mọi cây xanh", "B. Phân hủy xác sinh vật và chất hữu cơ, trả lại chất vô cơ cho đất", "C. Quang hợp tạo thức ăn cho rừng", "D. Cố định nitơ cho đất"], "answer": "B", "explain": "Nấm hoại sinh cùng vi khuẩn phân hủy xác chết, lá rụng, giúp vòng tuần hoàn vật chất và làm sạch môi trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một số nấm sống cộng sinh với rễ cây (nấm rễ) có lợi gì cho cây?", "options": ["A. Làm cây héo nhanh", "B. Giúp cây hút nước và muối khoáng tốt hơn", "C. Ăn hết chất dinh dưỡng của cây", "D. Làm cây không cần ánh sáng"], "answer": "B", "explain": "Sợi nấm rễ lan rộng giúp cây hấp thu nước, khoáng tốt hơn; cây cung cấp lại chất hữu cơ cho nấm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Loại nấm nào sau đây là nấm ăn được, được trồng phổ biến?", "options": ["A. Nấm mũ tử thần", "B. Nấm rơm", "C. Nấm mốc xanh trên cam hỏng", "D. Nấm độc đỏ chấm trắng"], "answer": "B", "explain": "Nấm rơm là nấm ăn được, trồng nhiều trên rơm rạ ở nông thôn nước ta.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ăn phải nấm độc có thể gây hậu quả gì?", "options": ["A. Chỉ hơi khó tiêu qua loa", "B. Ngộ độc nặng, tổn thương gan, thận, có thể tử vong", "C. Giúp khỏe mạnh hơn", "D. Không ảnh hưởng gì"], "answer": "B", "explain": "Nhiều nấm độc chứa độc tố mạnh gây ngộ độc nguy hiểm, thậm chí tử vong nếu không cấp cứu kịp thời.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp an toàn nhất để tránh ngộ độc nấm là gì?", "options": ["A. Ăn thử một miếng nhỏ trước", "B. Chỉ ăn nấm rõ nguồn gốc, không hái ăn nấm lạ trong rừng, vườn", "C. Ăn nấm có màu đẹp", "D. Nấu thật kĩ là hết độc"], "answer": "B", "explain": "Không có cách phân biệt nấm độc bằng mắt thường chắc chắn; chỉ nên ăn nấm biết rõ nguồn gốc và được kiểm chứng an toàn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nấm có thể gây bệnh nào cho người?", "options": ["A. Bệnh sốt rét", "B. Bệnh hắc lào, lang ben (nấm da)", "C. Bệnh tả", "D. Bệnh lao"], "answer": "B", "explain": "Một số nấm kí sinh trên da gây hắc lào, lang ben, nấm móng...; sốt rét do trùng, tả và lao do vi khuẩn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về vai trò của nấm trong tự nhiên.", "statements": ["a) Nấm hoại sinh phân hủy xác sinh vật.", "b) Nấm giúp đất giữ được vòng tuần hoàn vật chất.", "c) Một số nấm cộng sinh với rễ cây giúp cây hút khoáng.", "d) Nấm trong tự nhiên chỉ gây hại."], "answer": ["T", "T", "T", "F"], "explain": "Nấm có vai trò phân giải và cộng sinh rất quan trọng trong hệ sinh thái.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về nấm gây bệnh.", "statements": ["a) Nấm có thể gây bệnh hắc lào, lang ben trên da người.", "b) Nấm gây bệnh đạo ôn trên cây lúa.", "c) Mọi loài nấm đều gây bệnh cho người.", "d) Nấm mốc trên ngô, lạc có thể sinh độc tố nguy hiểm."], "answer": ["T", "T", "F", "T"], "explain": "Chỉ một số loài nấm gây bệnh; rất nhiều loài nấm có lợi hoặc vô hại.", "points": 1}, {"type": "short", "level": "NB", "q": "Hệ thống các sợi mảnh của nấm lan trong đất, gỗ mục để hút chất dinh dưỡng được gọi là gì?", "answer": "Hệ sợi nấm (sợi nấm)", "explain": "Từ hệ sợi nấm sẽ mọc lên thể quả khi điều kiện thuận lợi.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nấm đơn bào dùng để làm bánh mì và rượu bia là nấm gì?", "answer": "Nấm men", "explain": "Nấm men lên men đường tạo CO₂ và cồn ethylic.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "VD", "q": "Để phòng bệnh nấm da, cần thực hiện điều gì?", "options": ["A. Dùng chung khăn, quần áo với người khác", "B. Giữ da khô ráo, sạch sẽ, không dùng chung đồ cá nhân", "C. Mặc quần áo ẩm lâu ngày", "D. Không cần tắm rửa"], "answer": "B", "explain": "Nấm da ưa nơi ẩm; giữ vệ sinh, phơi khô quần áo và không dùng chung khăn, lược giúp phòng bệnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thực phẩm bị mốc cần xử lí thế nào?", "options": ["A. Cắt bỏ phần mốc rồi ăn phần còn lại là an toàn tuyệt đối", "B. Bỏ toàn bộ, không nên ăn vì độc tố nấm có thể đã lan khắp thực phẩm", "C. Rửa nước là ăn được", "D. Đem phơi nắng rồi ăn"], "answer": "B", "explain": "Sợi nấm và độc tố có thể lan sâu trong thực phẩm mềm dù mắt chỉ thấy mốc ở một chỗ; an toàn nhất là bỏ đi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nấm hương, mộc nhĩ được dùng làm thực phẩm vì chúng có đặc điểm gì?", "options": ["A. Chứa nhiều chất dinh dưỡng, thơm ngon, là nấm ăn được", "B. Có màu sắc sặc sỡ nhất", "C. Mọc nhanh nhất", "D. Không cần chế biến"], "answer": "A", "explain": "Nấm hương, mộc nhĩ (nấm mèo) là thực phẩm bổ dưỡng, thường được trồng và dùng phổ biến trong bữa ăn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mốc tương dùng để làm tương (nước chấm truyền thống) thuộc nhóm sinh vật nào?", "options": ["A. Vi khuẩn", "B. Nấm mốc", "C. Virus", "D. Tảo"], "answer": "B", "explain": "Người ta dùng nấm mốc tương lên men hạt đậu nành để làm tương truyền thống.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bào tử nấm phát tán đi xa chủ yếu nhờ yếu tố nào?", "options": ["A. Chim ăn quả", "B. Gió, nước và động vật", "C. Ánh nắng mặt trời", "D. Điện"], "answer": "B", "explain": "Bào tử rất nhỏ và nhẹ nên dễ dàng theo gió, nước mưa hoặc bám vào động vật để phát tán.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điểm khác biệt giữa nấm men và nấm mốc là gì?", "options": ["A. Nấm men không phải là nấm", "B. Nấm men là nấm đơn bào, nấm mốc là nấm đa bào dạng sợi", "C. Nấm mốc nhỏ hơn nấm men", "D. Nấm men có lục lạp"], "answer": "B", "explain": "Nấm men chỉ gồm một tế bào; nấm mốc có cơ thể là hệ sợi đa bào.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về nấm độc.", "statements": ["a) Có thể phân biệt nấm độc chắc chắn chỉ bằng màu sắc.", "b) Ăn nấm lạ hái trong rừng rất nguy hiểm.", "c) Một số nấm độc có thể gây tử vong.", "d) Chỉ nên ăn nấm rõ nguồn gốc, được xác định an toàn."], "answer": ["F", "T", "T", "T"], "explain": "Không thể phân biệt nấm độc bằng màu sắc hay các mẹo dân gian.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về sinh sản của nấm.", "statements": ["a) Phần lớn nấm sinh sản bằng bào tử.", "b) Bào tử nấm rất nhỏ, nhẹ, dễ phát tán theo gió.", "c) Nấm men sinh sản bằng nảy chồi.", "d) Nấm sinh sản bằng hạt như cây lúa."], "answer": ["T", "T", "T", "F"], "explain": "Nấm không tạo hạt; sinh sản chủ yếu bằng bào tử, riêng nấm men còn nảy chồi.", "points": 1}, {"type": "short", "level": "NB", "q": "Kháng sinh penicillin được chiết xuất từ loại nấm mốc nào?", "answer": "Nấm mốc xanh Penicillium", "explain": "Penicillium là nấm mốc xanh quen thuộc trên cam quýt hỏng.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nấm không quang hợp được vì tế bào nấm thiếu bào quan nào?", "answer": "Lục lạp", "explain": "Không có lục lạp chứa diệp lục nên nấm phải sống dị dưỡng.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Quần áo, sách vở để nơi ẩm thấp dễ bị mốc vì lí do gì?", "options": ["A. Nấm mốc cần ánh sáng mạnh", "B. Môi trường ẩm và chất hữu cơ trên vải, giấy là điều kiện thuận lợi cho nấm mốc phát triển", "C. Do vi khuẩn tạo màu", "D. Do quần áo tự biến chất"], "answer": "B", "explain": "Độ ẩm cao cùng chất dinh dưỡng trên vải, giấy giúp bào tử nấm nảy mầm và phát triển thành mốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phơi nắng quần áo, đồ dùng có tác dụng gì đối với nấm mốc?", "options": ["A. Giúp nấm phát triển nhanh", "B. Làm khô và tia tử ngoại hạn chế nấm mốc phát triển", "C. Không tác dụng", "D. Làm đồ dùng thêm ẩm"], "answer": "B", "explain": "Phơi nắng làm khô đồ dùng và tia tử ngoại trong nắng ức chế nấm mốc, vi khuẩn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một số nấm gây bệnh cho cây trồng, ví dụ bệnh đạo ôn hại lúa là do sinh vật nào?", "options": ["A. Vi khuẩn", "B. Nấm", "C. Virus", "D. Trùng roi"], "answer": "B", "explain": "Bệnh đạo ôn trên lúa do nấm gây ra, làm lá và cổ bông lúa bị cháy, giảm năng suất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nấm sống kí sinh khác nấm sống hoại sinh ở điểm nào?", "options": ["A. Nấm kí sinh lấy chất dinh dưỡng từ cơ thể sinh vật sống, nấm hoại sinh phân hủy xác sinh vật chết", "B. Nấm kí sinh có lục lạp", "C. Nấm hoại sinh luôn gây bệnh cho người", "D. Không có điểm khác nhau"], "answer": "A", "explain": "Tiêu chí là nguồn dinh dưỡng: cơ thể sống (kí sinh) hay xác sinh vật và chất hữu cơ chết (hoại sinh).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thân (cuống) của nấm lớn có chức năng chính là gì?", "options": ["A. Quang hợp", "B. Nâng mũ nấm lên cao giúp bào tử dễ phát tán", "C. Hút nước từ không khí", "D. Bắt mồi"], "answer": "B", "explain": "Thân nấm nâng mũ nấm lên cao khỏi mặt đất, tạo điều kiện cho bào tử dưới mũ được gió cuốn đi xa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ sợi nấm nằm trong đất hoặc trong giá thể có chức năng gì?", "options": ["A. Trang trí", "B. Hút nước và chất dinh dưỡng nuôi cơ thể nấm", "C. Phát sáng", "D. Bắt côn trùng"], "answer": "B", "explain": "Sợi nấm len lỏi trong giá thể (đất, rơm, gỗ mục) để hấp thu nước và chất hữu cơ nuôi nấm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về dinh dưỡng của nấm.", "statements": ["a) Nấm là sinh vật dị dưỡng.", "b) Nấm hoại sinh lấy chất dinh dưỡng từ xác sinh vật chết.", "c) Nấm kí sinh lấy chất dinh dưỡng từ cơ thể sinh vật sống.", "d) Nấm quang hợp tạo ra phần lớn ôxi cho rừng."], "answer": ["T", "T", "T", "F"], "explain": "Nấm không quang hợp; ôxi của rừng chủ yếu do cây xanh và tảo tạo ra.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về ứng dụng của nấm.", "statements": ["a) Nấm hương, nấm rơm là thực phẩm bổ dưỡng.", "b) Mốc tương được dùng để làm tương truyền thống.", "c) Nấm được dùng để sản xuất kháng sinh.", "d) Nấm không có ứng dụng nào trong công nghiệp thực phẩm."], "answer": ["T", "T", "T", "F"], "explain": "Nấm có nhiều ứng dụng: thực phẩm, lên men, dược phẩm.", "points": 1}, {"type": "short", "level": "NB", "q": "Bệnh nấm trên da gây ngứa, bong vảy thành đám tròn ở người thường gọi là bệnh gì?", "answer": "Hắc lào (nấm da)", "explain": "Hắc lào do nấm kí sinh trên da gây ra, lây qua tiếp xúc và đồ dùng chung.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Loại nấm ăn được trồng phổ biến trên rơm rạ ở vùng trồng lúa nước ta là nấm gì?", "answer": "Nấm rơm", "explain": "Nấm rơm là nấm hoại sinh trên rơm rạ ủ ẩm.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "VD", "q": "Vì sao bánh mì để vài ngày trong túi kín, ẩm lại xuất hiện các đốm mốc xanh, đen?", "options": ["A. Do bánh mì tự đổi màu", "B. Bào tử nấm trong không khí rơi vào, gặp ẩm và dinh dưỡng nên phát triển", "C. Do vi khuẩn lam quang hợp", "D. Do nhiệt độ phòng quá lạnh"], "answer": "B", "explain": "Bào tử nấm luôn có trong không khí; bánh mì ẩm, giàu tinh bột là môi trường lí tưởng cho chúng nảy mầm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhóm nấm nào sau đây đều là nấm ăn được?", "options": ["A. Nấm rơm, nấm bào ngư, nấm kim châm", "B. Nấm mũ tử thần, nấm rơm, nấm hương", "C. Nấm mốc cam, nấm hương, mộc nhĩ", "D. Nấm độc đỏ, nấm rơm, nấm mối"], "answer": "A", "explain": "Nấm rơm, nấm bào ngư, nấm kim châm đều là nấm ăn được trồng phổ biến; các đáp án khác chứa nấm độc hoặc nấm mốc hỏng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Người trồng nấm rơm thường chất đống rơm rạ ẩm để làm gì?", "options": ["A. Thu hút côn trùng", "B. Tạo giá thể cho sợi nấm phát triển và ra thể quả", "C. Làm phân bón trực tiếp", "D. Che nắng cho đất"], "answer": "B", "explain": "Rơm rạ ẩm là thức ăn (chất hữu cơ) cho sợi nấm hoại sinh; từ hệ sợi sẽ mọc lên các thể quả nấm rơm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nấm có tế bào nhân thực, vậy nấm khác vi khuẩn ở điểm nào?", "options": ["A. Nấm không có tế bào", "B. Nấm có nhân hoàn chỉnh có màng bao bọc, vi khuẩn chưa có màng nhân", "C. Nấm nhỏ hơn vi khuẩn", "D. Nấm không bao giờ gây bệnh"], "answer": "B", "explain": "Nấm là sinh vật nhân thực; vi khuẩn là sinh vật nhân sơ chưa có màng nhân.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mộc nhĩ (nấm tai mèo) thường mọc tự nhiên ở đâu?", "options": ["A. Trên mặt nước biển", "B. Trên gỗ mục trong rừng ẩm", "C. Trong sa mạc", "D. Trong ruột người"], "answer": "B", "explain": "Mộc nhĩ là nấm hoại sinh mọc trên gỗ mục ẩm, nay được trồng nhiều trên mùn cưa, gỗ khúc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi hái nấm trong rừng về ăn, nguy hiểm lớn nhất là gì?", "options": ["A. Nấm rừng ít dinh dưỡng", "B. Nhầm lẫn nấm độc với nấm ăn được gây ngộ độc chết người", "C. Nấm rừng khó rửa sạch", "D. Nấm rừng mau hỏng"], "answer": "B", "explain": "Nhiều nấm độc giống nấm ăn được; hái nấm rừng không rõ loài để ăn rất nguy hiểm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về phòng tránh tác hại của nấm mốc.", "statements": ["a) Phơi nắng đồ dùng giúp hạn chế nấm mốc.", "b) Để quần áo ẩm trong tủ kín lâu ngày tránh được mốc.", "c) Kho lương thực cần khô ráo, thông thoáng.", "d) Không nên ăn ngô, lạc đã bị mốc."], "answer": ["T", "F", "T", "T"], "explain": "Quần áo ẩm để kín là điều kiện lí tưởng cho nấm mốc phát triển.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về so sánh nấm với thực vật.", "statements": ["a) Nấm và thực vật đều là sinh vật nhân thực.", "b) Thực vật có lục lạp, nấm thì không.", "c) Thành tế bào nấm bằng xenlulôzơ như thực vật.", "d) Nấm thuộc một giới riêng, không thuộc giới Thực vật."], "answer": ["T", "T", "F", "T"], "explain": "Thành tế bào nấm bằng kitin, khác với xenlulôzơ của thực vật.", "points": 1}, {"type": "short", "level": "NB", "q": "Nấm mốc được dùng để lên men đậu nành làm nước chấm truyền thống gọi là mốc gì?", "answer": "Mốc tương", "explain": "Mốc tương phân hủy protein đậu nành tạo vị ngon cho tương.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trong sản xuất bánh mì, khí nào do nấm men sinh ra làm bột nở?", "answer": "Khí cacbonic (CO₂)", "explain": "Khí CO₂ tạo bọt khí trong bột làm bánh nở xốp khi nướng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Để bảo quản nấm ăn tươi được lâu hơn, nên làm gì?", "options": ["A. Để ở nơi nắng gắt", "B. Bảo quản lạnh hoặc phơi, sấy khô", "C. Ngâm nước cả tuần", "D. Để trong túi nilon kín ngoài trời nóng"], "answer": "B", "explain": "Nhiệt độ thấp hoặc sấy khô làm chậm hoạt động của vi sinh vật gây hỏng nấm tươi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một số loại thuốc kháng sinh và thực phẩm lên men có được là nhờ công lao của nhóm sinh vật nào?", "options": ["A. Virus", "B. Nấm (và vi khuẩn có ích)", "C. Trùng roi", "D. Tảo silic"], "answer": "B", "explain": "Nấm mốc cho kháng sinh penicillin; nấm men cho rượu bia, bánh mì; mốc tương cho nước chấm truyền thống.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hiện tượng “ma trơi” hay nấm phát sáng trong rừng đêm liên quan đến sinh vật nào?", "options": ["A. Đom đóm đất", "B. Một số loài nấm có khả năng phát sáng sinh học ở sợi nấm", "C. Vi khuẩn lam", "D. Tảo biển"], "answer": "B", "explain": "Một số loài nấm (như nấm sò phát sáng) có sợi nấm phát sáng trong đêm tối ẩm của rừng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nấm da (hắc lào) lây truyền qua con đường nào?", "options": ["A. Qua muỗi đốt", "B. Tiếp xúc trực tiếp với vùng da bệnh hoặc dùng chung khăn, quần áo với người bệnh", "C. Qua đường hô hấp", "D. Qua ăn uống"], "answer": "B", "explain": "Nấm da lây qua tiếp xúc và đồ dùng chung ẩm ướt; vì vậy không nên dùng chung khăn, đồ cá nhân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bào tử khác hạt giống của cây ở điểm nào?", "options": ["A. Bào tử lớn hơn hạt", "B. Bào tử là tế bào sinh sản đơn giản, rất nhỏ nhẹ; hạt là cấu trúc phức tạp chứa phôi và chất dự trữ", "C. Bào tử chỉ có ở thực vật", "D. Hạt phát tán nhờ gió còn bào tử thì không"], "answer": "B", "explain": "Bào tử nấm là những tế bào rất nhỏ; hạt của cây là cơ quan sinh sản phức tạp hơn nhiều.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong sản xuất bia, nấm men chuyển hóa đường thành những chất nào?", "options": ["A. Ôxi và nước", "B. Cồn ethylic và khí cacbonic", "C. Axit lactic", "D. Protein và vitamin"], "answer": "B", "explain": "Lên men rượu của nấm men biến đường thành rượu ethylic và CO₂ — cơ sở của sản xuất bia, rượu.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về so sánh nấm với vi khuẩn.", "statements": ["a) Nấm có nhân hoàn chỉnh, vi khuẩn chưa có màng nhân.", "b) Nấm men lớn hơn vi khuẩn và quan sát dễ hơn dưới kính hiển vi.", "c) Mọi nấm đều đa bào còn mọi vi khuẩn đều đơn bào.", "d) Cả nấm và vi khuẩn đều có loài có lợi và có hại."], "answer": ["T", "T", "F", "T"], "explain": "Nấm men là nấm đơn bào nên nhận định “mọi nấm đều đa bào” là sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về nấm rễ cộng sinh.", "statements": ["a) Nấm rễ sống bám vào rễ cây và trao đổi chất với cây.", "b) Nấm rễ luôn làm cây chết dần.", "c) Cây cung cấp chất hữu cơ cho nấm rễ.", "d) Nấm rễ giúp cây hấp thu nước và muối khoáng."], "answer": ["T", "F", "T", "T"], "explain": "Quan hệ nấm rễ - cây là cộng sinh hai bên cùng có lợi, không làm cây chết.", "points": 1}, {"type": "short", "level": "NB", "q": "Nấm sống bám vào rễ cây, giúp cây hút nước và khoáng được gọi là gì?", "answer": "Nấm rễ (nấm cộng sinh rễ)", "explain": "Quan hệ giữa nấm rễ và cây là cộng sinh, hai bên cùng có lợi.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nấm mốc và vi khuẩn hoại sinh trong hệ sinh thái đóng vai trò là sinh vật gì?", "answer": "Sinh vật phân giải (phân hủy)", "explain": "Chúng phân hủy xác sinh vật thành chất vô cơ trả lại cho đất.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Làm sữa chua cần vi khuẩn lactic, còn làm bánh mì cần sinh vật nào?", "options": ["A. Vi khuẩn lactic", "B. Nấm men", "C. Nấm mốc xanh", "D. Trùng giày"], "answer": "B", "explain": "Bánh mì dùng nấm men (men bánh mì) để lên men làm bột nở xốp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi quan sát một cục rơm mục, thấy mạng sợi trắng mịn lan khắp nơi — đó là gì?", "options": ["A. Rễ cây nhỏ", "B. Hệ sợi nấm đang phân hủy rơm", "C. Tơ nhện", "D. Sợi bông"], "answer": "B", "explain": "Mạng sợi trắng là hệ sợi của nấm hoại sinh đang phân hủy chất hữu cơ trong rơm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nấm có vai trò gì đối với những khu rừng tự nhiên?", "options": ["A. Chỉ làm cây bệnh", "B. Phân hủy lá rụng, gỗ chết, giúp đất rừng màu mỡ và nuôi nhiều loài khác", "C. Cạnh tranh ánh sáng với cây", "D. Làm rừng khô hơn"], "answer": "B", "explain": "Nấm phân giải là mắt xích không thể thiếu giúp rừng tuần hoàn dinh dưỡng và duy trì đa dạng sinh học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để hạn chế nấm mốc làm hỏng lương thực trong kho, biện pháp nào đúng?", "options": ["A. Để kho ẩm và kín", "B. Giữ kho khô ráo, thông thoáng, phơi sấy nông sản trước khi cất", "C. Phun nước vào kho thường xuyên", "D. Xếp chung đồ bị mốc với đồ lành"], "answer": "B", "explain": "Nấm mốc cần độ ẩm; kho khô thoáng và nông sản khô giúp ngăn mốc phát triển và sinh độc tố.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Độc tố của một số nấm mốc trên ngô, lạc bị mốc nguy hiểm như thế nào?", "options": ["A. Hoàn toàn vô hại", "B. Có thể gây độc cho gan, là tác nhân gây ung thư nếu ăn lâu dài", "C. Chỉ làm thức ăn mất ngon", "D. Chỉ ảnh hưởng đến gia súc"], "answer": "B", "explain": "Độc tố aflatoxin của mốc trên ngô, lạc rất độc với gan; tuyệt đối không ăn nông sản đã mốc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một học sinh bị hắc lào (nấm da). Việc làm nào đúng để bệnh mau khỏi và không lây cho bạn?", "options": ["A. Gãi nhiều cho đỡ ngứa rồi đi học chung", "B. Đến cơ sở y tế khám, dùng thuốc theo hướng dẫn, giữ da khô, không dùng chung khăn áo", "C. Tự bôi lá cây và che kín", "D. Dùng chung khăn với bạn để bạn có miễn dịch"], "answer": "B", "explain": "Nấm da cần điều trị đúng thuốc, giữ vệ sinh da khô ráo và tránh dùng chung đồ cá nhân để không lây lan.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về nấm ăn được trồng phổ biến ở nước ta.", "statements": ["a) Nấm rơm trồng trên rơm rạ ủ ẩm.", "b) Mộc nhĩ mọc trên gỗ mục và được trồng trên mùn cưa.", "c) Nấm kim châm là nấm ăn được.", "d) Nấm ăn được trồng không cần giữ ẩm."], "answer": ["T", "T", "T", "F"], "explain": "Trồng nấm luôn cần duy trì độ ẩm thích hợp cho sợi nấm và thể quả phát triển.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về lên men nhờ nấm men.", "statements": ["a) Lên men rượu biến đường thành cồn ethylic và khí cacbonic.", "b) Bánh mì nở xốp nhờ khí sinh ra khi nấm men lên men trong bột.", "c) Nấm men lên men cần có lục lạp.", "d) Quá trình lên men của nấm men diễn ra khi thiếu ôxi."], "answer": ["T", "T", "F", "T"], "explain": "Nấm men không có lục lạp; lên men là quá trình phân giải đường trong điều kiện thiếu ôxi.", "points": 1}, {"type": "short", "level": "NB", "q": "Độc tố nguy hiểm do nấm mốc sinh ra trên ngô, lạc bị mốc có tên là gì?", "answer": "Aflatoxin", "explain": "Aflatoxin rất độc với gan; tuyệt đối không ăn nông sản đã mốc.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nấm men sinh sản chủ yếu bằng hình thức nảy ra các tế bào con nhỏ trên tế bào mẹ gọi là gì?", "answer": "Nảy chồi", "explain": "Nảy chồi là hình thức sinh sản vô tính đặc trưng của nấm men.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Nấm linh chi được nhiều người biết đến với vai trò gì?", "options": ["A. Là nấm độc nguy hiểm", "B. Là nấm dược liệu được dùng trong y học cổ truyền", "C. Là nấm gây mốc thực phẩm", "D. Là nấm ăn hằng ngày như rau"], "answer": "B", "explain": "Nấm linh chi là nấm dược liệu quý trong y học cổ truyền, mọc trên gỗ mục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sợi nấm có vách ngăn chia thành nhiều tế bào nối tiếp, mỗi tế bào thường có gì?", "options": ["A. Không có nhân", "B. Nhân hoàn chỉnh (tế bào nhân thực)", "C. Lục lạp", "D. Roi để bơi"], "answer": "B", "explain": "Tế bào nấm là tế bào nhân thực có màng nhân rõ ràng; nấm không có lục lạp và roi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nấm rơm được gọi tên như vậy vì lí do nào?", "options": ["A. Vì nấm có hình giống cọng rơm", "B. Vì nấm thường trồng và mọc trên rơm rạ", "C. Vì nấm có màu vàng rơm", "D. Vì nấm chỉ mọc vào mùa gặt lúa"], "answer": "B", "explain": "Nấm rơm trồng trên giá thể rơm rạ ủ ẩm — nguồn nguyên liệu sẵn có ở vùng trồng lúa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao cùng một khu đất ẩm, sau mưa lại xuất hiện nhiều nấm mọc thành từng đám?", "options": ["A. Do mưa tạo ra nấm từ đất", "B. Bào tử và sợi nấm sẵn có trong đất gặp ẩm, ấm nên nhanh chóng phát triển ra thể quả", "C. Do chim tha hạt nấm đến", "D. Do nắng chiếu mạnh"], "answer": "B", "explain": "Hệ sợi nấm tồn tại sẵn trong đất, gỗ mục; gặp mưa ẩm, chúng nhanh chóng mọc thể quả để phát tán bào tử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân biệt nấm ăn được và nấm độc một cách chắc chắn nhất bằng cách nào?", "options": ["A. Nhìn màu sắc: nấm độc màu đẹp, nấm ăn được màu xấu", "B. Không có dấu hiệu bên ngoài nào chắc chắn; chỉ ăn nấm đã được xác định loài bởi người có chuyên môn/nguồn uy tín", "C. Ngửi mùi: nấm độc thơm hơn", "D. Cho bạc vào nấu: bạc đen là có độc"], "answer": "B", "explain": "Các mẹo dân gian về màu sắc, mùi, thử bạc đều không đáng tin; an toàn nhất là chỉ ăn nấm rõ loài, rõ nguồn gốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nấm mốc trên tường nhà ẩm gây hại gì?", "options": ["A. Chỉ làm mất thẩm mĩ", "B. Làm hỏng tường, đồ dùng và bào tử nấm có thể gây dị ứng, bệnh hô hấp", "C. Giúp tường chắc hơn", "D. Không gây hại gì"], "answer": "B", "explain": "Mốc tường vừa phá hỏng vật liệu, đồ dùng vừa ảnh hưởng sức khỏe hô hấp, nhất là trẻ em và người dị ứng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về bào tử nấm.", "statements": ["a) Bào tử là tế bào sinh sản của nấm.", "b) Bào tử nấm có thể tồn tại lâu trong không khí và trên bề mặt đồ vật.", "c) Chỉ nấm độc mới có bào tử.", "d) Bào tử nảy mầm khi gặp điều kiện ẩm và có chất dinh dưỡng."], "answer": ["T", "T", "F", "T"], "explain": "Mọi loài nấm (ăn được hay độc) đều sinh sản bằng bào tử.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về vệ sinh phòng bệnh nấm da.", "statements": ["a) Không dùng chung khăn, lược với người khác giúp phòng nấm da.", "b) Giữ chân tay khô ráo sau khi tắm giúp hạn chế nấm.", "c) Mặc chung quần áo với người bị hắc lào là an toàn.", "d) Phơi khô giày dép giúp giảm nấm chân."], "answer": ["T", "T", "F", "T"], "explain": "Dùng chung đồ cá nhân và mặc đồ của người bệnh là đường lây nấm da phổ biến.", "points": 1}, {"type": "short", "level": "NB", "q": "Loại nấm dược liệu quý, mọc trên gỗ, được dùng trong y học cổ truyền là nấm gì?", "answer": "Nấm linh chi", "explain": "Linh chi là nấm dược liệu được trồng và khai thác làm thuốc bổ.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Dưới mũ nấm, bào tử được tạo ra ở các phiến mỏng gọi là gì?", "answer": "Phiến nấm (lá tia)", "explain": "Phiến nấm dưới mũ là nơi mang hàng triệu bào tử.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VD", "q": "Đâu là ứng dụng của nấm trong bảo vệ môi trường?", "options": ["A. Nấm ăn hết rác nhựa ngay lập tức", "B. Một số nấm phân hủy được chất hữu cơ ô nhiễm, dùng trong xử lí môi trường", "C. Nấm thay thế hoàn toàn nhà máy xử lí nước", "D. Nấm làm sạch không khí trong nhà kín"], "answer": "B", "explain": "Khả năng phân hủy mạnh của nấm được ứng dụng xử lí chất thải hữu cơ và một số chất ô nhiễm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi làm thí nghiệm quan sát nấm mốc trên bánh mì, học sinh cần lưu ý gì?", "options": ["A. Nếm thử để nhận biết", "B. Không ngửi gần, không mở hộp chứa mẫu mốc và rửa tay sau khi quan sát", "C. Mang mẫu mốc về nhà ngắm", "D. Rải bào tử ra lớp học"], "answer": "B", "explain": "Bào tử nấm mốc có thể gây dị ứng; cần quan sát qua hộp kín và vệ sinh tay cẩn thận.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nấm sò, nấm bào ngư được nuôi trồng trên giá thể nào là phổ biến?", "options": ["A. Nước biển", "B. Mùn cưa, rơm rạ, bã mía đã xử lí", "C. Cát sa mạc", "D. Đất sét nung"], "answer": "B", "explain": "Nấm hoại sinh được nuôi trên các phế phẩm nông nghiệp giàu xenlulôzơ như mùn cưa, rơm rạ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong y học, ngoài penicillin, nấm còn cho con người sản phẩm quý nào?", "options": ["A. Vitamin tổng hợp hóa học", "B. Nhiều loại kháng sinh và thuốc ức chế miễn dịch dùng trong ghép tạng", "C. Thuốc giảm đau từ nhựa cây", "D. Vắc-xin phòng lao"], "answer": "B", "explain": "Nấm là nguồn sản xuất nhiều kháng sinh và một số thuốc quan trọng trong y học hiện đại.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hiện tượng bánh chưng, bánh tét sau Tết bị nhớt, chua, mốc là do sinh vật nào hoạt động?", "options": ["A. Chỉ do nắng nóng", "B. Vi sinh vật (vi khuẩn, nấm men, nấm mốc) phát triển trong điều kiện ấm ẩm của bánh để lâu", "C. Do lá dong gói bánh", "D. Do gạo tự biến chất không liên quan sinh vật"], "answer": "B", "explain": "Bánh giàu dinh dưỡng để lâu ngày ấm ẩm là môi trường cho vi khuẩn và nấm phát triển gây hỏng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để quan sát nấm mốc dưới kính hiển vi, học sinh thường lấy mẫu mốc từ đâu là dễ nhất?", "options": ["A. Từ lá cây xanh tươi", "B. Từ vỏ cam, quýt hoặc bánh mì đã bị mốc", "C. Từ nước máy", "D. Từ đất cát khô"], "answer": "B", "explain": "Mốc trên thực phẩm hỏng có hệ sợi và cơ quan mang bào tử rõ, dễ quan sát dưới kính hiển vi.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về nấm trong thực phẩm.", "statements": ["a) Sữa chua được làm nhờ nấm men.", "b) Bánh mì được làm nở nhờ nấm men.", "c) Tương truyền thống lên men nhờ nấm mốc.", "d) Rượu vang lên men từ nho nhờ nấm men."], "answer": ["F", "T", "T", "T"], "explain": "Sữa chua lên men nhờ vi khuẩn lactic, không phải nấm men.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về đa dạng của nấm.", "statements": ["a) Giới Nấm chỉ gồm các loài nấm lớn ăn được.", "b) Nấm men, nấm mốc, nấm lớn đều thuộc giới Nấm.", "c) Ước tính có rất nhiều loài nấm chưa được mô tả hết.", "d) Một số nấm có khả năng phát sáng trong đêm."], "answer": ["F", "T", "T", "T"], "explain": "Giới Nấm rất đa dạng: từ nấm men đơn bào đến nấm lớn, nhiều loài chưa được khoa học mô tả.", "points": 1}, {"type": "short", "level": "NB", "q": "Vì nấm không có lục lạp nên nấm thuộc nhóm sinh vật có kiểu dinh dưỡng nào?", "answer": "Dị dưỡng", "explain": "Nấm hấp thu chất hữu cơ có sẵn: hoại sinh, kí sinh hoặc cộng sinh.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Khi thấy thực phẩm như bánh mì, cam bị mốc xanh, việc an toàn nhất cần làm là gì?", "answer": "Bỏ đi, không ăn", "explain": "Độc tố nấm có thể lan khắp thực phẩm nên phải bỏ toàn bộ, không ăn.", "points": 0.5}]}]}</script>
