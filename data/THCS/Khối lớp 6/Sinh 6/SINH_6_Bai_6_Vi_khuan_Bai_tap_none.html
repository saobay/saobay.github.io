amin (như vitamin K, nhóm B).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bệnh uốn ván do vi khuẩn gây ra, xâm nhập cơ thể qua con đường nào?", "options": ["A. Qua đường hô hấp", "B. Qua vết thương hở bị nhiễm bẩn (đinh gỉ, đất bẩn)", "C. Qua muỗi đốt", "D. Qua ăn uống"], "answer": "B", "explain": "Vi khuẩn uốn ván sống trong đất, xâm nhập qua vết thương sâu, bẩn; phòng bằng tiêm vắc-xin uốn ván.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiêm vắc-xin BCG cho trẻ sơ sinh nhằm phòng bệnh nào do vi khuẩn gây ra?", "options": ["A. Bệnh tả", "B. Bệnh lao", "C. Bệnh thương hàn", "D. Bệnh sâu răng"], "answer": "B", "explain": "Vắc-xin BCG phòng bệnh lao, được tiêm cho trẻ sơ sinh theo chương trình tiêm chủng mở rộng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi dùng kháng sinh, cần tuân thủ điều gì?", "options": ["A. Uống khi nào nhớ ra thì uống", "B. Uống theo đúng chỉ định của bác sĩ, đủ liều, đủ ngày", "C. Thấy đỡ là dừng ngay", "D. Tự mua uống liều gấp đôi cho nhanh khỏi"], "answer": "B", "explain": "Dùng kháng sinh đủ liều, đúng chỉ định giúp diệt hết vi khuẩn và tránh kháng thuốc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hiện tượng vi khuẩn kháng kháng sinh xảy ra do nguyên nhân nào?", "options": ["A. Do kháng sinh quá rẻ", "B. Do lạm dụng, dùng kháng sinh không đúng cách khiến vi khuẩn sống sót và thích nghi", "C. Do vi khuẩn quá yếu", "D. Do thời tiết thay đổi"], "answer": "B", "explain": "Dùng kháng sinh bừa bãi tạo áp lực chọn lọc, vi khuẩn kháng thuốc sống sót và sinh sôi.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về bào tử vi khuẩn.", "statements": ["a) Bào tử giúp vi khuẩn chống chịu điều kiện bất lợi.", "b) Bào tử vi khuẩn rất dễ bị tiêu diệt bởi nhiệt độ thấp.", "c) Khi gặp điều kiện thuận lợi, bào tử phát triển thành tế bào vi khuẩn mới.", "d) Mọi vi khuẩn đều tạo bào tử."], "answer": ["T", "F", "T", "F"], "explain": "Bào tử chịu nhiệt và khô hạn rất tốt; chỉ cây"], "answer": "A", "explain": "Nhiều vi khuẩn gây bệnh cho cây như bệnh héo xanh, thối nhũn, gây thiệt hại mùa màng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để hạn chế vi khuẩn gây hỏng sữa tươi, nhà sản xuất thường làm gì?", "options": ["A. Để sữa ở nhiệt độ phòng", "B. Thanh trùng (đun nóng ở nhiệt độ thích hợp) rồi bảo quản lạnh", "C. Pha thêm nước", "D. Đậy kín là đủ"], "answer": "B", "explain": "Thanh trùng tiêu diệt phần lớn vi khuẩn gây bệnh và gây hỏng sữa, kết hợp bảo quản lạnh giúp sữa giữ lâu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao vết thương hở cần được rửa sạch và sát trùng ngay?", "options": ["A. Để vết thương đẹp hơn", "B. Để loại bỏ vi khuẩn và bụi bẩn, tránh nhiễm trùng", "C. Để vết thương khô nhanh một cách tự nhiên", "D. Không cần thiết"], "answer": "B", "explain": "Rửa và sát trùng giúp giảm vi khuẩn xâm nhập, phòng nhiễm trùng và các bệnh nguy hiểm như uốn ván.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vi khuẩn lam khác đa số vi khuẩn ở điểm nào?", "options": ["A. Không có tế bào", "B. Có sắc tố quang hợp nên tự dưỡng được", "C. Kích thước lớn như nấm", "D. Sống kí sinh bắt buộc"], "answer": "B", "explain": "Vi khuẩn lam chứa sắc tố quang hợp (gần giống diệp lục) nên tự tổng hợp được chất hữu cơ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về vi khuẩn đường ruột.", "statements": ["a) Trong ruột người luôn có cả vi khuẩn có lợi và có hại.", "b) Vi khuẩn có lợi trong ruột hỗ trợ tiêu hóa.", "c) Cần diệt sạch mọi vi khuẩn trong ruột mới khỏe.", "d) Lạm dụng kháng sinh có thể làm mất cân bằng vi khuẩn ruột."], "answer": ["T", "T", "F", "T"], "explain": "Ruột cần hệ vi khuẩn cân bằng; diệt sạch vi khuẩn có lợi gây rối loạn tiêu hóa.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về bệnh do vi khuẩn lây qua đường tiêu hóa.", "statements": ["a) Bệnh tả lây qua thức ăn, nước uống nhiễm khuẩn.", "b) Bệnh thương hàn không liên quan đến vệ sinh ăn uống.", "c) Rửa tay bằng xà phòng giảm nguy cơ mắc bệnh tiêu hóa.", "d) Ăn rau sống ở quán không vệ sinh có nguy cơ nhiễm khuẩn."], "answer": ["T", "F", "T", "T"], "explain": "Thương hàn lây qua đường tiêu hóa nên vệ sinh ăn uống rất quan trọng.", "points": 1}, {"type": "short", "level": "NB", "q": "Để tồn tại qua điều kiện bất lợi, một số vi khuẩn tạo ra cấu trúc gì có vỏ dày?", "answer": "Bào tử (nội bào tử)", "explain": "Nội bào tử giúp vi khuẩn chịu được nhiệt độ cao và khô hạn.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Vi khuẩn phân hủy xác sinh vật chết thuộc kiểu dinh dưỡng nào?", "answer": "Hoại sinh (dị dưỡng hoại sinh)", "explain": "Vi khuẩn hoại sinh phân hủy xác sinh vật, thuộc nhóm dị dưỡng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Số lượng vi khuẩn trên Trái Đất so với các sinh vật khác như thế nào?", "options": ["A. Rất ít", "B. Cực kì lớn, có mặt ở mọi môi trường", "C. Chỉ có vài trăm loài", "D. Đang biến mất dần"], "answer": "B", "explain": "Vi khuẩn là nhóm sinh vật đông đảo và phân bố rộng nhất trên Trái Đất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Bào tử của vi khuẩn có đặc điểm gì nổi bật?", "options": ["A. Rất yếu, dễ chết", "B. Chịu được nhiệt độ cao, khô hạn, tồn tại lâu trong môi trường", "C. Chỉ sống được trong nước", "D. Là hình thức sinh sản hữu tính"], "answer": "B", "explain": "Nội bào tử có vỏ dày, chịu đựng tốt điều kiện khắc nghiệt, khi gặp điều kiện thuận lợi sẽ phát triển thành tế bào mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn quan sát hình dạng vi khuẩn trong phòng thí nghiệm trường học, ta dùng dụng cụ nào?", "options": ["A. Kính lúp cầm tay", "B. Kính hiển vi", "C. Kính thiên văn", "D. Mắt thường"], "answer": "B", "explain": "Vi khuẩn có kích thước micrômét nên phải dùng kính hiển vi mới quan sát được hình dạng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thực phẩm đóng hộp bị phồng hộp thường là dấu hiệu của điều gì?", "options": ["A. Thực phẩm còn rất tươi", "B. Vi khuẩn phát triển sinh khí làm phồng hộp, thực phẩm đã hỏng, nguy hiểm", "C. Do hộp kim loại giãn nở bình thường", "D. Do để trong tủ lạnh"], "answer": "B", "explain": "Hộp phồng do vi khuẩn (kể cả vi khuẩn sinh độc tố nguy hiểm) hoạt động — tuyệt đối không ăn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vi khuẩn gây bệnh thương hàn lây truyền chủ yếu qua đường nào?", "options": ["A. Hô hấp", "B. Tiêu hóa (thức ăn, nước uống nhiễm khuẩn)", "C. Muỗi đốt", "D. Tiếp xúc da"], "answer": "B", "explain": "Thương hàn lây qua đường tiêu hóa khi ăn uống phải thức ăn, nước nhiễm vi khuẩn từ phân người bệnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phòng bệnh thương hàn và tả, biện pháp chung hiệu quả nhất là gì?", "options": ["A. Đeo khẩu trang", "B. Đảm bảo vệ sinh ăn uống, dùng nước sạch", "C. Ngủ màn", "D. Tiêm kháng sinh dự phòng hàng ngày"], "answer": "B", "explain": "Cả tả và thương hàn đều lây qua đường tiêu hóa nên vệ sinh ăn uống và nước sạch là biện pháp phòng chung hiệu quả.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về kích thước của vi khuẩn.", "statements": ["a) Vi khuẩn nhìn thấy rõ bằng mắt thường.", "b) Vi khuẩn dài khoảng vài micrômét.", "c) Vi khuẩn lớn hơn tế bào động vật.", "d) Cần kính hiển vi để quan sát hình dạng vi khuẩn."], "answer": ["F", "T", "F", "T"], "explain": "Vi khuẩn rất nhỏ (đơn vị micrômét), nhỏ hơn tế bào động vật và phải soi kính hiển vi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về ứng dụng vi khuẩn trong sản xuất.", "statements": ["a) Vi khuẩn lactic được dùng làm sữa chua.", "b) Vi khuẩn biến đổi gen được dùng sản xuất insulin.", "c) Vi khuẩn không được dùng trong xử lí nước thải.", "d) Nấm men và vi khuẩn lactic đều tham gia lên men thực phẩm."], "answer": ["T", "T", "F", "T"], "explain": "Vi khuẩn được ứng dụng rộng rãi, kể cả xử lí nước thải nhờ khả năng phân hủy chất hữu cơ.", "points": 1}, {"type": "short", "level": "NB", "q": "Từ một vi khuẩn, sau một lần phân đôi tạo ra mấy vi khuẩn con?", "answer": "Hai vi khuẩn con", "explain": "Phân đôi tạo ra hai tế bào con giống hệt tế bào mẹ.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Vi khuẩn lam tự dưỡng được nhờ chứa sắc tố gì?", "answer": "Sắc tố quang hợp (diệp lục)", "explain": "Vi khuẩn lam có sắc tố quang hợp nên tự dưỡng như thực vật.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Một số vi khuẩn được dùng trong công nghệ sinh học để sản xuất chất nào cho người bệnh tiểu đường?", "options": ["A. Insulin", "B. Vitamin C", "C. Kháng sinh penicillin từ vi khuẩn", "D. Đường glucôzơ"], "answer": "A", "explain": "Vi khuẩn biến đổi gen được dùng để sản xuất insulin người, phục vụ điều trị bệnh tiểu đường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi phân đôi liên tục, từ 1 vi khuẩn sau 5 lần phân đôi (điều kiện lí tưởng) sẽ có bao nhiêu vi khuẩn?", "options": ["A. 5", "B. 10", "C. 32", "D. 25"], "answer": "C", "explain": "Mỗi lần phân đôi số lượng gấp đôi: sau 5 lần là 2^5 = 32 vi khuẩn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao không nên ăn thức ăn đã có mùi ôi, chua bất thường?", "options": ["A. Vì không ngon miệng", "B. Vì có thể chứa nhiều vi khuẩn gây bệnh và độc tố của chúng", "C. Vì thức ăn mất hết vitamin ngay lập tức", "D. Vì sẽ làm hỏng răng ngay"], "answer": "B", "explain": "Mùi ôi thiu là dấu hiệu vi khuẩn phát triển mạnh, thức ăn có thể chứa độc tố gây ngộ độc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhóm vi khuẩn nào sống cộng sinh trong nốt sần rễ cây họ Đậu?", "options": ["A. Vi khuẩn lactic", "B. Vi khuẩn cố định đạm", "C. Phẩy khuẩn tả", "D. Trực khuẩn lao"], "answer": "B", "explain": "Vi khuẩn cố định đạm (Rhizobium) sống trong nốt sần rễ cây họ Đậu, hai bên cùng có lợi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây họ Đậu trồng luân canh giúp đất tốt hơn nhờ đâu?", "options": ["A. Nhờ lá cây rụng nhiều", "B. Nhờ vi khuẩn nốt sần cố định đạm, làm giàu chất đạm cho đất", "C. Nhờ rễ cây ăn sâu", "D. Nhờ cây che bóng mát"], "answer": "B", "explain": "Vi khuẩn cố định đạm ở nốt sần biến nitơ không khí thành hợp chất đạm bón cho đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vi khuẩn phân hủy xác sinh vật được xếp vào nhóm nào trong chuỗi thức ăn?", "options": ["A. Sinh vật sản xuất", "B. Sinh vật tiêu thụ", "C. Sinh vật phân giải", "D. Sinh vật kí sinh"], "answer": "C", "explain": "Vi khuẩn hoại sinh là sinh vật phân giải trong hệ sinh thái.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về vi khuẩn gây bệnh cho cây.", "statements": ["a) Không có vi khuẩn nào gây bệnh cho cây.", "b) Vi khuẩn gây bệnh héo xanh ở cà chua.", "c) Vi khuẩn gây bệnh cho cây làm giảm năng suất mùa màng.", "d) Phòng bệnh cây do vi khuẩn cần vệ sinh đồng ruộng, chọn giống sạch bệnh."], "answer": ["F", "T", "T", "T"], "explain": "Nhiều vi khuẩn gây bệnh nguy hiểm cho cây trồng như héo xanh, thối nhũn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về vệ sinh cá nhân.", "statements": ["a) Đánh răng hằng ngày giúp hạn chế vi khuẩn gây sâu răng.", "b) Dùng chung bàn chải đánh răng là việc nên làm.", "c) Cắt móng tay sạch sẽ giảm nơi trú ẩn của vi khuẩn.", "d) Tắm rửa thường xuyên giúp loại bỏ bớt vi khuẩn trên da."], "answer": ["T", "F", "T", "T"], "explain": "Dùng chung bàn chải dễ lây bệnh, không nên làm.", "points": 1}, {"type": "short", "level": "NB", "q": "Thức ăn để lâu bị chua, ôi thiu chủ yếu do sinh vật nào hoạt động?", "answer": "Vi khuẩn (hoại sinh)", "explain": "Vi khuẩn phân hủy chất hữu cơ trong thức ăn gây ôi thiu.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Vắc-xin BCG tiêm cho trẻ sơ sinh phòng bệnh gì?", "answer": "Bệnh lao", "explain": "BCG là vắc-xin phòng lao trong chương trình tiêm chủng mở rộng.", "], "answer": "B", "explain": "Vệ sinh răng miệng và hạn chế đường giúp giảm vi khuẩn lên men gây axit phá men răng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một học sinh để hộp sữa chua ngoài trời nắng cả ngày rồi uống và bị đau bụng. Nguyên nhân hợp lí nhất là gì?", "options": ["A. Sữa chua bị nắng làm biến mất vi khuẩn có lợi", "B. Vi khuẩn có hại phát triển trong sữa chua ở nhiệt độ cao gây rối loạn tiêu hóa", "C. Do uống sữa chua lạnh", "D. Do sữa chua quá chua tự nhiên"], "answer": "B", "explain": "Nhiệt độ cao ngoài nắng giúp vi khuẩn gây hại sinh sôi trong thực phẩm, dễ gây ngộ độc, đau bụng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về sự phân đôi của vi khuẩn.", "statements": ["a) Sau mỗi lần phân đôi, số vi khuẩn tăng gấp đôi.", "b) Vi khuẩn phân đôi cần thời gian như nhau ở mọi điều kiện.", "c) Nhiệt độ, thức ăn phù hợp giúp vi khuẩn phân đôi nhanh hơn.", "d) Số lượng vi khuẩn tăng nhanh là nguyên nhân thức ăn nhanh hỏng."], "answer": ["T", "F", "T", "T"], "explain": "Tốc độ phân đôi phụ thuộc điều kiện môi trường: đủ dinh dưỡng, nhiệt độ thích hợp thì nhanh hơn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về vi khuẩn và virus.", "statements": ["a) Vi khuẩn là tế bào hoàn chỉnh, virus chưa có cấu tạo tế bào.", "b) Vi khuẩn tự phân đôi được, virus phải nhờ tế bào chủ.", "c) Kháng sinh diệt được cả vi khuẩn và virus.", "d) Vi khuẩn thuộc giới Khởi sinh."], "answer": ["T", "T", "F", "T"], "explain": "Kháng sinh chỉ tác dụng với vi khuẩn, không diệt được virus.", "points": 1}, {"type": "short", "level": "NB", "q": "Vi khuẩn trong ruột người giúp tổng hợp một số chất nào có lợi?", "answer": "Vitamin (vitamin K và nhóm B)", "explain": "Vi khuẩn đường ruột có lợi hỗ trợ tiêu hóa và tổng hợp vitamin.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hiện tượng vi khuẩn không còn bị kháng sinh tiêu diệt được gọi là gì?", "answer": "Kháng kháng sinh (kháng thuốc)", "explain": "Lạm dụng kháng sinh làm vi khuẩn kháng thuốc, gây khó khăn cho điều trị.", "points": 0.5}]}]}</script>
