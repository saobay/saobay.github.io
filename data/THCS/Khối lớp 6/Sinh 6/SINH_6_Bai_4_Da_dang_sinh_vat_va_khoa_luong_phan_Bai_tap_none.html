ường nào?", "options": ["A. Trên cạn", "B. Trong đất", "C. Dưới nước", "D. Trong cơ thể sinh vật khác"], "answer": "C", "explain": "Cá là sinh vật sống dưới nước, hô hấp bằng mang.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về sự đa dạng của sinh vật.", "statements": ["a) Sinh vật chỉ đa dạng về số lượng loài.", "b) Cá voi xanh và vi khuẩn đều là sinh vật dù kích thước chênh lệch rất lớn.", "c) Sinh vật có thể sống trong cơ thể sinh vật khác.", "d) Mọi sinh vật đều sống trên cạn."], "answer": ["F", "T", "T", "F"], "explain": "Sinh vật đa dạng về loài, kích thước, hình dạng và môi trường sống; nhiều loài sống dưới nước hoặc kí sinh trong cơ thể khác.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về giới Khởi sinh.", "statements": ["a) Vi khuẩn thuộc giới Khởi sinh.", "b) Sinh vật giới Khởi sinh có tế bào nhân thực.", "c) Sinh vật giới Khởi sinh chủ yếu là đơn bào.", "d) Trùng giày thuộc giới Khởi sinh."], "answer": ["T", "F", "T", "F"], "explain": "Giới Khởi sinh gồm sinh vật đơn bào, tế bào nhân sơ; trùng giày thuộc giới Nguyên sinh.", "points": 1}, {"type": "short", "level": "NB", "q": "Việc sắp xếp sinh vật thành từng nhóm dựa trên đặc điểm giống nhau được gọi là gì?", "answer": "Phân loại sinh vật", "explain": "Đó là khái niệm phân loại sinh vật.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Theo hệ thống năm giới, vi khuẩn thuộc giới nào?", "answer": "Giới Khởi sinh", "explain": "Vi khuẩn là sinh vật nhân sơ nên thuộc giới Khởi sinh.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "VD", "q": "Giun đất sống chủ yếu ở môi trường nào?", "options": ["A. Trong nước biển", "B. Trong đất ẩm", "C. Trên không", "D. Trên lá cây"], "answer": "B", "explain": "Giun đất sống trong đất ẩm, giúp đất tơi xốp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sán lá gan sống kí sinh trong cơ thể vật chủ thuộc môi trường nào?", "options": ["A. Môi trường nước", "B. Môi trường trên cạn", "C. Môi trường trong đất", "D. Môi trường sinh vật (trong cơ thể sinh vật khác)"], "answer": "D", "explain": "Sán lá gan kí sinh trong cơ thể động vật khác nên thuộc môi trường sinh vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân loại sinh vật là gì?", "options": ["A. Việc đặt tên cho từng sinh vật", "B. Việc sắp xếp sinh vật thành các nhóm dựa trên đặc điểm giống nhau", "C. Việc đếm số lượng sinh vật", "D. Việc nuôi trồng sinh vật"], "answer": "B", "explain": "Phân loại sinh vật là sắp xếp chúng vào các nhóm dựa trên những đặc điểm giống và khác nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ý nghĩa quan trọng nhất của việc phân loại sinh vật là gì?", "options": ["A. Giúp trang trí sách giáo khoa", "B. Giúp nhận biết, nghiên cứu và bảo vệ sinh vật dễ dàng hơn", "C. Giúp sinh vật sinh trưởng nhanh hơn", "D. Giúp tăng số lượng loài"], "answer": "B", "explain": "Phân loại giúp con người nhận biết các loài, thuận tiện cho nghiên cứu, khai thác và bảo vệ đa dạng sinh học.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Theo hệ thống phân loại năm giới, sinh vật được chia thành những giới nào?", "options": ["A. Khởi sinh, Nguyên sinh, Nấm, Thực vật, Động vật", "B. Vi khuẩn, Nấm, Cây, Con, Người", "C. Đơn bào, Đa bào, Nấm, Cây, Thú", "D. Khởi sinh, Nấm, Tảo, Thực vật, Động vật"], "answer": "A", "explain": "Năm giới gồm: Khởi sinh, Nguyên sinh, Nấm, Thực vật và Động vật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vi khuẩn thuộc giới nào trong hệ thống năm giới?", "options": ["A. Nguyên sinh", "B. Nấm", "C. Khởi sinh", "D. Thực vật"], "answer": "C", "explain": "Vi khuẩn là sinh vật nhân sơ, đơn bào nên thuộc giới Khởi sinh.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về giới Nguyên sinh.", "statements": ["a) Trùng roi là sinh vật nguyên sinh.", "b) Sinh vật nguyên sinh có tế bào nhân thực.", "c) Tất cả sinh vật nguyên sinh đều đa bào.", "d) Tảo lục đơ n sinh gồm các sinh vật có tế bào nhân thực, phần lớn là đơn bào.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sinh vật nào sau đây thuộc giới Nấm?", "options": ["A. Trùng biến hình", "B. Nấm men", "C. Tảo lục", "D. Vi khuẩn lam"], "answer": "B", "explain": "Nấm men là nấm đơn bào, thuộc giới Nấm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đặc điểm nào sau đây đúng với giới Nấm?", "options": ["A. Có lục lạp nên tự dưỡng", "B. Tế bào có thành bằng kitin, dinh dưỡng dị dưỡng", "C. Tế bào nhân sơ", "D. Luôn là cơ thể đơn bào"], "answer": "B", "explain": "Nấm là sinh vật nhân thực, thành tế bào bằng kitin, không có lục lạp nên sống dị dưỡng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cây lúa, cây ngô thuộc giới nào?", "options": ["A. Nguyên sinh", "B. Nấm", "C. Thực vật", "D. Động vật"], "answer": "C", "explain": "Cây lúa, cây ngô là thực vật đa bào, có lục lạp để quang hợp.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về giới Thực vật.", "statements": ["a) Thực vật có khả năng quang hợp nhờ lục lạp.", "b) Thực vật thường di chuyển tích cực như động vật.", "c) Cây lúa thuộc giới Thực vật.", "d) Thực vật là sinh vật nhân thực, đa bào."], "answer": ["T", "F", "T", "T"], "explain": "Thực vật nhân thực, đa bào, tự dưỡng nhờ lục lạp và thường sống cố định.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về giới Động vật.", "statements": ["a) Động vật dinh dưỡng dị dưỡng.", "b) Động vật có lục lạp trong tế bào.", "c) Con người thuộc giới Động vật.", "d) Phần lớn động vật có khả năng di chuyển."], "answer": ["T", "F", "T", "T"], "explain": "Động vật không có lục lạp, sống dị dưỡng và phần lớn di chuyển được.", "points": 1}, {"type": "short", "level": "NB", "q": "Bào quan giúp thực vật quang hợp, tự dưỡng là bào quan nào?", "answer": "Lục lạp", "explain": "Lục lạp chứa chất diệp lục giúp thực vật quang hợp.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Khóa phân loại gồm các cặp đặc điểm đối lập nhau được gọi là khóa gì?", "answer": "Khóa lưỡng phân", "explain": "Đó là khóa lưỡng phân, công cụ phân loại dựa trên cặp đặc điểm trái ngược.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "VD", "q": "Đặc điểm nổi bật của giới Thực vật là gì?", "options": ["A. Dị dưỡng, di chuyển tích cực", "B. Tế bào có lục lạp, tự dưỡng nhờ quang hợp, phần lớn sống cố định", "C. Đơn bào, nhân thực", "D. Thành tế bào bằng kitin"], "answer": "B", "explain": "Thực vật là sinh vật nhân thực, đa bào, có lục lạp nên tự dưỡng bằng quang hợp và thường sống cố định.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Con người thuộc giới nào?", "options": ["A. Nguyên sinh", "B. Nấm", "C. Thực vật", "D. Động vật"], "answer": "D", "explain": "Con người là động vật đa bào, dinh dưỡng dị dưỡng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặc điểm chung của giới Động vật là gì?", "options": ["A. Tự dưỡng nhờ quang hợp", "B. Đa bào, nhân thực, dinh dưỡng dị dưỡng, phần lớn di chuyển được", "C. Đơn bào, nhân sơ", "D. Có thành tế bào bằng kitin"], "answer": "B", "explain": "Động vật là sinh vật nhân thực, đa bào, không tự tổng hợp được chất hữu cơ nên sống dị dưỡng và thường di chuyển được.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để phân loại sinh vật, người ta dựa vào tiêu chí nào?", "options": ["A. Màu sắc yêu thích của nhà khoa học", "B. Đặc điểm cấu tạo, hình dạng và quan hệ họ hàng của sinh vật", "C. Kích thước quần thể", "D. Nơi bán sinh vật"], "answer": "B", "explain": "Phân loại dựa trên các đặc điểm về hình thái, cấu tạo và mối quan hệ tiến hóa giữa các loài.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đơn vị phân loại lớn nhất trong hệ thống năm giới là gì?", "options": ["A. Loài", "B. Giới", "C. Họ", "D. Chi"], "answer": "B", "explain": "Giới là bậc phân loại lớn nhất trong hệ thống phân loại năm giới đang học.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai sinh vật thuộc cùng một giới thường có điểm chung nào?", "options": ["A. Giống hệt nhau về mọi đặc điểm", "B. Có những đặc điểm cấu tạo cơ bản giống nhau", "C. Sống cùng một nơi", "D. Có cùng kích thước"], "answer": "B", "explain": "Các sinh vật cùng giới chia sẻ những đặc điểm cấu tạo cơ bản, ví dụ cùng là nhân sơ hoặc nhân thực.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về phân loại sinh vật.", "statements": ["a) Phân loại sinh vật dựa trên các đặc điểm giống nhau của chúng.", "b) Phân loại giúp việc nghiên cứu sinh vật khó khăn hơn.", "c) Giới là bậc phân loại lớn nhất trong hệ thống năm giới.", "d) Việc phân loại không liên quan đến bảo vệ đa dạng sinh học."], "answer": ["T", "F", "T", "F"], "explain": "Phân loại dựa vào đặc điểm chung, giúp nghiên cứu và bảo vệ sinh vật thuận lợi hơn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về khóa lưỡng phân.", "statements": ["a) Mỗi bước của khóa lưỡng phân gồm một cặp đặc điểm đối lập.", "b) Khi dùng khóa lưỡng phân có thể chọn cả hai đặc điểm cùng lúc.", "c) Khóa lưỡng phân giúp xác định tên (nhóm) của sinh vật.", "d) Đặc điểm trong khóa lưỡng phân nên dễ quan sát."], "answer": ["T", "F", "T", "T"], "explain": "Mỗi bước chỉ chọn một trong hai đặc điểm đối lập phù hợp với sinh vật.", "points": 1}, {"type": "short", "level": "NB", "q": "Ở mỗi bước của khóa lưỡng phân, người dùng phải chọn mấy đặc điểm trong cặp đặc điểm đối lập?", "answer": "Một đặc điểm", "explain": "Mỗi bước chỉ chọn đúng một đặc điểm phù hợp với sinh vật.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Động vật có vú lớn nhất trên Trái Đất hiện nay là loài nào?", "answer": "Cá voi xanh", "explain": "Cá voi xanh dài tới khoảng 30 m, là động vật lớn nhất từng biết.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khóa lưỡng phân là gì?", "options": ["A. Một loại chìa khóa mở cửa phòng thí nghiệm", "B. Khóa phân loại gồm các cặp đặc điểm đối lập, mỗi bước chọn một trong hai đặc điểm", "C. Bảng ghi tên các loài sinh vật", "D. Sơ đồ vẽ hình sinh vật"], "answer": "B", "explain": "Khóa lưỡng phân là khóa phân loại dựa trên từng cặp đặc điểm đối lập nhau để dần xác định sinh vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặc điểm của các cặp đặc điểm dùng trong khóa lưỡng phân là gì?", "options": ["A. Giống nhau hoàn toàn", "B. Đối lập nhau, ví dụ có cánh - không có cánh", "C. Rất khó quan sát", "D. Chỉ dựa vào màu sắc"], "answer": "B", "explain": "Mỗi bước của khóa lưỡng phân gồm hai đặc điểm trái ngược nhau để người dùng chọn đúng một.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi sử dụng khóa lưỡng phân, ở mỗi bước ta phải làm gì?", "options": ["A. Chọn cả hai đặc điểm", "B. Chọn một đặc điểm đúng với sinh vật trong cặp đặc điểm đối lập", "C. Bỏ qua bước khó", "D. Đoán ngẫu nhiên"], "answer": "B", "explain": "Ở mỗi bước, ta đối chiếu sinh vật với cặp đặc điểm đối lập và chọn đặc điểm phù hợp, rồi đi tiếp theo hướng dẫn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Kết quả cuối cùng khi dùng khóa lưỡng phân đúng cách là gì?", "options": ["A. Biết được tuổi của sinh vật", "B. Xác định được tên (nhóm) của sinh vật cần phân loại", "C. Đếm được số lượng sinh vật", "D. Vẽ được hình sinh vật"], "answer": "B", "explain": "Dùng khóa lưỡng phân đúng các bước sẽ dẫn tới tên loài hoặc nhóm của sinh vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để xây dựng khóa lưỡng phân, bước đầu tiên cần làm là gì?", "options": ["A. Vẽ hình sinh vật", "B. Lựa chọn các đặc điểm dễ quan sát, đối lập nhau của các sinh vật cần phân loại", "C. In khóa ra giấy", "D. Đặt tên mới cho sinh vật"], "answer": "B", "explain": "Muốn xây dựng khóa lưỡng phân phải chọn được các đặc điểm phân biệt rõ ràng, dễ quan sát và đối lập nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cặp đặc điểm nào sau đây là cặp đối lập dùng được trong khóa lưỡng phân?", "options": ["A. Có lông - có lông dài", "B. Có cánh - không có cánh", "C. Màu xanh - màu đẹp", "D. To - rất to"], "answer": "B", "explain": "“Có cánh” và “không có cánh” là hai đặc điểm đối lập rõ ràng, dùng được trong khóa lưỡng phân.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về cách xây dựng khóa lưỡng phân.", "statements": ["a) Nên dùng đặc điểm “đẹp - xấu” để phân loại.", "b) Cặp đặc điểm “có cánh - không có cánh” dùng được trong khóa lưỡng phân.", "c) Đặc điểm được chọn phải phân biệt rõ các sinh vật với nhau.", "d) Chỉ thực vật mới xây dựng được khóa lưỡng phân."], "answer": ["F", "T", "T", "F"], "explain": "Khóa lưỡng phân dùng cho mọi nhóm sinh vật, với các cặp đặc điểm đối lập, khách quan.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về môi trường sống của sinh vật.", "statements": ["a) Cá sống trong môi trường nước.", "b) Giun đất sống trong đất.", "c) Sán lá gan sống trong môi trường sinh vật.", "d) Chim chỉ sống trong môi trường nước."], "answer": ["T", "T", "T", "F"], "explain": "Mỗi loài thích nghi với môi trường sống riêng: nước, đất, trên cạn hoặc trong cơ thể sinh vật khác.", "points": 1}, {"type": "short", "level": "NB", "q": "Giun đất sống chủ yếu trong môi trường nào?", "answer": "Trong đất (đất ẩm)", "explain": "Giun đất sống trong đất ẩm và giúp đất tơi xốp.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Sán lá gan sống trong cơ thể vật chủ, vậy nó thuộc môi trường sống nào?", "answer": "Môi trường sinh vật", "explain": "Sinh vật kí sinh sống trong cơ thể sinh vật khác — môi trường sinh vật.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "VD", "q": "Muốn phân biệt chim với cá bằng khóa lưỡng phân, cặp đặc điểm nào phù hợp nhất?", "options": ["A. Có lông vũ, bay được - có vảy, sống dưới nước", "B. Màu sặc sỡ - màu nhạt", "C. To - nhỏ", "D. Nhanh - chậm"], "answer": "A", "explain": "Chim có lông vũ và biết bay, cá có vảy và sống dưới nước — đây là các đặc điểm đối lập, dễ quan sát.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một khóa lưỡng phân phân loại 4 loài thường cần tối thiểu mấy bước lựa chọn?", "options": ["A. 1 bước", "B. 2 bước", "C. 10 bước", "D. Không cần bước nào"], "answer": "B", "explain": "Mỗi bước chia nhóm làm hai, nên phân loại 4 loài thường cần ít nhất 2 bước lựa chọn liên tiếp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong khóa lưỡng phân để phân loại: thỏ, cá chép, chim sẻ, ếch. Bước 1 dùng đặc điểm “sống dưới nước - sống trên cạn”. Nhóm sống dưới nước gồm những con nào?", "options": ["A. Thỏ, chim sẻ", "B. Cá chép", "C. Ếch, thỏ", "D. Chim sẻ, ếch"], "answer": "B", "explain": "Cá chép sống hoàn toàn dưới nước; ếch sống cả trên cạn và dưới nước nhưng theo đặc điểm đời sống chủ yếu thường xếp nhóm lưỡng cư riêng — trong khóa đơn giản này, cá chép là loài sống dưới nước điển hình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao không nên dùng đặc điểm “đẹp - xấu” trong khóa lưỡng phân?", "options": ["A. Vì đặc điểm này không đối lập khách quan, khó thống nhất khi quan sát", "B. Vì sinh vật nào cũng đẹp", "C. Vì tốn giấy", "D. Vì khóa lưỡng phân chỉ dùng cho thực vật"], "answer": "A", "explain": "Đặc điểm trong khóa lưỡng phân phải khách quan, dễ quan sát và đối lập rõ ràng; “đẹp - xấu” mang tính chủ quan.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sinh vật nào sau đây thuộc cùng giới với nấm mốc?", "options": ["A. Vi khuẩn", "B. Nấm men", "C. Trùng roi", "D. Tảo xoắn"], "answer": "B", "explain": "Nấm mốc và nấm men đều thuộc giới Nấm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sinh vật nào sau đây thuộc giới Khởi sinh?", "options": ["A. Trùng giày", "B. Vi khuẩn lao", "C. Nấm hương", "D. Rong biển"], "answer": "B", "explain": "Vi khuẩn lao là vi khuẩn, thuộc giới Khởi sinh.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về sự đa dạng loài ở Việt Nam.", "statements": ["a) Việt Nam có hàng chục nghìn loài sinh vật đã được ghi nhận.", "b) Đa dạng sinh học không cần bảo vệ.", "c) Phá rừng làm mất nơi sống của nhiều loài.", "d) Trồng cây gây hại cho đa dạng sinh học."], "answer": ["T", "F", "T", "F"], "explain": "Việt Nam giàu đa dạng sinh học; phá rừng làm suy giảm loài, trồng cây giúp bảo vệ môi trường sống.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về phân biệt các giới sinh vật.", "statements": ["a) Vi khuẩn và trùng giày đều thuộc một giới.", "b) Nấm khác thực vật ở chỗ nấm không có lục lạp.", "c) Động vật và thực vật đều tự dưỡng.", "d) Tế bào nhân sơ là đặc điểm của giới Khởi sinh."], "answer": ["F", "T", "F", "T"], "explain": "Vi khuẩn (Khởi sinh) khác trùng giày (Nguyên sinh); nấm dị dưỡng, động vật dị dưỡng còn thực vật tự dưỡng.", "points": 1}, {"type": "short", "level": "NB", "q": "Bậc phân loại lớn nhất trong hệ thống phân loại năm giới là bậc nào?", "answer": "Giới", "explain": "Giới là bậc phân loại lớn nhất trong hệ thống đang học.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nấm men thuộc giới nào?", "answer": "Giới Nấm", "explain": "Nấm men là nấm đơn bào thuộc giới Nấm.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tảo lục đơn bào thuộc giới nào?", "options": ["A. Khởi sinh", "B. Nguyên sinh", "C. Thực vật", "D. Nấm"], "answer": "B", "explain": "Tảo lục đơn bào là sinh vật nhân thực đơn bào, xếp vào giới Nguyên sinh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặc điểm nào giúp phân biệt giới Thực vật với giới Nấm?", "options": ["A. Đều là sinh vật nhân thực", "B. Thực vật có lục lạp và tự dưỡng, nấm không có lục lạp và dị dưỡng", "C. Đều sống cố định", "D. Đều có thành tế bào"], "answer": "B", "explain": "Thực vật có lục lạp nên quang hợp tự dưỡng; nấm không có lục lạp, phải sống dị dưỡng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đặc điểm nào giúp phân biệt giới Động vật với giới Thực vật?", "options": ["A. Động vật là sinh vật nhân thực", "B. Động vật dị dưỡng và thường di chuyển được, thực vật tự dưỡng và thường cố định", "C. Động vật có tế bào", "D. Động vật sống trên cạn"], "answer": "B", "explain": "Điểm khác biệt cơ bản: động vật dinh dưỡng dị dưỡng, di chuyển tích cực; thực vật tự dưỡng bằng quang hợp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một sinh vật đơn bào, tế bào có nhân hoàn chỉnh, di chuyển bằng roi. Sinh vật này thuộc giới nào?", "options": ["A. Khởi sinh", "B. Nguyên sinh", "C. Nấm", "D. Động vật"], "answer": "B", "explain": "Đơn bào nhưng đã có nhân hoàn chỉnh (nhân thực) nên thuộc giới Nguyên sinh, ví dụ trùng roi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một sinh vật đơn bào, tế bào chưa có màng nhân. Sinh vật này thuộc giới nào?", "options": ["A. Nguyên sinh", "B. Nấm", "C. Khởi sinh", "D. Thực vật"], "answer": "C", "explain": "Tế bào chưa có màng nhân là tế bào nhân sơ — đặc điểm của giới Khởi sinh (vi khuẩn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quan sát một sinh vật đa bào, có thành tế bào bằng kitin, không có lục lạp, sống hoại sinh trên gỗ mục. Sinh vật này thuộc giới nào?", "options": ["A. Thực vật", "B. Động vật", "C. Nấm", "D. Nguyên sinh"], "answer": "C", "explain": "Thành tế bào kitin, không lục lạp, sống hoại sinh là đặc điểm điển hình của giới Nấm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về ứng dụng của khóa lưỡng phân.", "statements": ["a) Khóa lưỡng phân giúp tra cứu, nhận diện loài ngoài thực địa.", "b) Khóa lưỡng phân chỉ dùng trong phòng thí nghiệm.", "c) Dùng khóa lưỡng phân sai bước có thể cho kết quả sai.", "d) Học sinh có thể tự xây dựng khóa lưỡng phân cho các cây trong trường."], "answer": ["T", "F", "T", "T"], "explain": "Khóa lưỡng phân là công cụ nhận diện loài tiện lợi, học sinh hoàn toàn có thể tự xây dựng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về kích thước sinh vật.", "statements": ["a) Vi khuẩn chỉ nhìn thấy dưới kính hiển vi.", "b) Cá voi xanh là động vật rất lớn.", "c) Mọi sinh vật đều có kích thước như nhau.", "d) Nấm rơm có thể quan sát bằng mắt thường."], "answer": ["T", "T", "F", "T"], "explain": "Kích thước sinh vật biến thiên rất lớn: từ vài micrômét (vi khuẩn) đến hàng chục mét (cá voi xanh).", "points": 1}, {"type": "short", "level": "NB", "q": "Cặp đặc điểm “có cánh - không có cánh” thuộc dạng đặc điểm gì trong khóa lưỡng phân?", "answer": "Cặp đặc điểm đối lập", "explain": "Hai đặc điểm trái ngược nhau tạo thành một cặp đặc điểm đối lập.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Tế bào của sinh vật thuộc giới Khởi sinh có đặc điểm gì nổi bật về nhân?", "answer": "Chưa có nhân hoàn chỉnh (nhân sơ)", "explain": "Tế bào nhân sơ chưa có màng nhân bao bọc vật chất di truyền.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Việt Nam được đánh giá là một trong những quốc gia có đa dạng sinh học cao vì lí do nào?", "options": ["A. Có nhiều nhà máy", "B. Có nhiều kiểu khí hậu, địa hình và hàng chục nghìn loài sinh vật", "C. Có diện tích nhỏ", "D. Có ít loài sinh vật"], "answer": "B", "explain": "Địa hình, khí hậu đa dạng tạo nhiều môi trường sống, giúp Việt Nam có hàng chục nghìn loài sinh vật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Việc nhiều loài sinh vật đang bị suy giảm số lượng cho thấy điều gì?", "options": ["A. Đa dạng sinh học không quan trọng", "B. Cần bảo vệ đa dạng sinh học và môi trường sống của sinh vật", "C. Nên khai thác hết sinh vật", "D. Phân loại sinh vật là không cần thiết"], "answer": "B", "explain": "Sự suy giảm các loài nhắc nhở con người phải bảo vệ đa dạng sinh học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành động nào sau đây góp phần bảo vệ đa dạng sinh học?", "options": ["A. Săn bắt động vật hoang dã", "B. Trồng cây, bảo vệ rừng và không xả rác ra môi trường", "C. Đốt rừng làm nương", "D. Buôn bán ngà voi"], "answer": "B", "explain": "Trồng cây, giữ rừng và giữ môi trường sạch giúp bảo vệ nơi sống của các loài sinh vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi xây dựng khóa lưỡng phân cho các loài cây trong vườn trường, nên chọn đặc điểm nào?", "options": ["A. Lá đơn - lá kép; hoa màu đỏ - hoa màu vàng", "B. Cây đẹp - cây xấu", "C. Cây cao - cây rất cao", "D. Cây già - cây rất già"], "answer": "A", "explain": "Lá đơn/lá kép là cặp đặc điểm đối lập, dễ quan sát, phù hợp xây dựng khóa lưỡng phân.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho khóa lưỡng phân: 1a. Có cánh → chim sẻ; 1b. Không có cánh → đi tới bước 2; 2a. Có vảy, sống dưới nước → cá chép; 2b. Không có vảy, da trần ẩm → ếch. Một con vật không có cánh, da trần ẩm, nhảy được. Đó là con gì?", "options": ["A. Chim sẻ", "B. Cá chép", "C. Ếch", "D. Không xác định được"], "answer": "C", "explain": "Không có cánh → bước 2; da trần ẩm, không vảy → ếch.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một học sinh dùng khóa lưỡng phân và chọn sai đặc điểm ở bước đầu tiên. Điều gì sẽ xảy ra?", "options": ["A. Vẫn ra đúng kết quả", "B. Sẽ đi sai nhánh và không xác định đúng sinh vật", "C. Khóa tự sửa sai", "D. Chỉ chậm hơn một chút"], "answer": "B", "explain": "Chọn sai ngay từ bước đầu sẽ dẫn vào nhánh sai, kết quả phân loại sẽ không đúng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về vai trò của phân loại học.", "statements": ["a) Tên khoa học giúp thống nhất cách gọi loài trên thế giới.", "b) Một loài có thể có nhiều tên địa phương khác nhau.", "c) Phân loại sinh vật không giúp ích cho y học và nông nghiệp.", "d) Biết phân loại giúp chọn đúng loài cần bảo vệ."], "answer": ["T", "T", "F", "T"], "explain": "Phân loại và tên khoa học có nhiều ứng dụng trong nghiên cứu, y học, nông nghiệp và bảo tồn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về giới sinh vật.", "statements": ["a) Hệ thống năm giới gồm: Khởi sinh, Nguyên sinh, Nấm, Thực vật, Động vật.", "b) Giới Nấm gồm các sinh vật có lục lạp.", "c) Giới Động vật gồm các sinh vật dị dưỡng, đa bào.", "d) Giới Thực vật gồm các sinh vật tự dưỡng có lục lạp."], "answer": ["T", "F", "T", "T"], "explain": "Nấm không có lục lạp; các nhận định còn lại đều đúng với hệ thống năm giới.", "points": 1}, {"type": "short", "level": "NB", "q": "Việc đặt tên khoa học thống nhất cho các loài giúp tránh điều gì?", "answer": "Tránh nhầm lẫn giữa các loài (do tên địa phương khác nhau)", "explain": "Tên địa phương khác nhau dễ gây nhầm lẫn, tên khoa học giúp thống nhất toàn thế giới.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Muốn phân biệt chim và cá trong khóa lưỡng phân, có thể dùng đặc điểm chim có lông vũ còn cá có gì?", "answer": "Vảy (và sống dưới nước)", "explain": "Cá có vảy, sống dưới nước; chim có lông vũ — cặp đặc điểm dễ quan sát.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Để khóa lưỡng phân dễ sử dụng, các đặc điểm nên được chọn như thế nào?", "options": ["A. Càng khó quan sát càng tốt", "B. Dễ quan sát, rõ ràng, đối lập nhau", "C. Chỉ dựa vào kích thước", "D. Chỉ dựa vào nơi sống"], "answer": "B", "explain": "Đặc điểm dùng trong khóa lưỡng phân cần dễ quan sát, phân biệt rõ và đối lập nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhóm sinh vật nào sau đây đều thuộc giới Động vật?", "options": ["A. Chim sẻ, cá chép, thỏ", "B. Nấm rơm, thỏ, cá chép", "C. Trùng giày, chim sẻ, thỏ", "D. Vi khuẩn, cá chép, thỏ"], "answer": "A", "explain": "Chim sẻ, cá chép và thỏ đều là động vật đa bào, dị dưỡng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhóm sinh vật nào sau đây đều thuộc giới Thực vật?", "options": ["A. Cây lúa, cây bàng, rong biển đa bào", "B. Nấm hương, cây lúa, cây ngô", "C. Tảo đơn bào, cây lúa, cây xoài", "D. Cây ngô, vi khuẩn lam, nấm rơm"], "answer": "A", "explain": "Cây lúa, cây bàng và rong biển đa bào đều là thực vật có lục lạp, tự dưỡng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao vi khuẩn không được xếp vào giới Nguyên sinh dù đều là sinh vật đơn bào?", "options": ["A. Vì vi khuẩn nhỏ hơn", "B. Vì tế bào vi khuẩn chưa có nhân hoàn chỉnh (nhân sơ), còn nguyên sinh vật có nhân thực", "C. Vì vi khuẩn sống dưới nước", "D. Vì vi khuẩn không di chuyển được"], "answer": "B", "explain": "Tiêu chí phân biệt là cấu tạo tế bào: vi khuẩn nhân sơ thuộc Khởi sinh; nguyên sinh vật nhân thực thuộc Nguyên sinh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sắp xếp các bậc phân loại từ lớn đến nhỏ trong ví dụ: giới Động vật → lớp Thú → loài. Bậc nào nhỏ nhất?", "options": ["A. Giới", "B. Loài", "C. Lớp", "D. Cả ba bằng nhau"], "answer": "B", "explain": "Loài là bậc phân loại nhỏ nhất, gồm các cá thể giống nhau nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi gặp một sinh vật lạ, muốn biết nó thuộc nhóm nào, em nên làm gì?", "options": ["A. Đoán theo cảm tính", "B. Quan sát các đặc điểm và dùng khóa phân loại (khóa lưỡng phân)", "C. Hỏi tên người bán", "D. Nhìn màu sắc là đủ"], "answer": "B", "explain": "Quan sát đặc điểm rồi tra khóa phân loại là cách khoa học để xác định sinh vật lạ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về đặc điểm dùng trong khóa phân loại.", "statements": ["a) Đặc điểm “có hạt - không có hạt” là cặp đặc điểm đối lập.", "b) Đặc điểm về hình thái dễ quan sát thường được ưu tiên dùng.", "c) Màu sắc là đặc điểm duy nhất được dùng.", "d) Đặc điểm đối lập giúp chia nhóm sinh vật thành hai nhánh."], "answer": ["T", "T", "F", "T"], "explain": "Khóa phân loại dùng nhiều loại đặc điểm đối lập dễ quan sát, không chỉ riêng màu sắc.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về bảo vệ đa dạng sinh học.", "statements": ["a) Bảo vệ rừng là bảo vệ nơi sống của nhiều loài.", "b) Săn bắt động vật hoang dã giúp tăng đa dạng sinh học.", "c) Mỗi loài tuyệt chủng là một mất mát của đa dạng sinh học.", "d) Học sinh có thể góp phần bảo vệ đa dạng sinh học bằng việc trồng cây."], "answer": ["T", "F", "T", "T"], "explain": "Săn bắt động vật hoang dã làm suy giảm đa dạng sinh học; bảo vệ rừng và trồng cây là hành động tích cực.", "points": 1}, {"type": "short", "level": "NB", "q": "Sinh vật thuộc giới Động vật có kiểu dinh dưỡng nào?", "answer": "Dị dưỡng", "explain": "Động vật không tự tổng hợp được chất hữu cơ nên sống dị dưỡng.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hành động chặt phá rừng bừa bãi ảnh hưởng thế nào đến đa dạng sinh học?", "answer": "Làm suy giảm đa dạng sinh học (mất nơi sống của nhiều loài)", "explain": "Phá rừng phá hủy môi trường sống khiến nhiều loài suy giảm hoặc tuyệt chủng.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VD", "q": "Đặc điểm “có hạt - không có hạt” dùng trong khóa phân loại thực vật thuộc dạng nào?", "options": ["A. Đặc điểm về màu sắc", "B. Cặp đặc điểm đối lập", "C. Đặc điểm về kích thước", "D. Đặc điểm về mùi"], "answer": "B", "explain": "“Có hạt” và “không có hạt” là hai đặc điểm trái ngược nhau — một cặp đặc điểm đối lập.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Loài người có tên khoa học là Homo sapiens. Việc đặt tên khoa học cho các loài có ích gì?", "options": ["A. Để trang trí", "B. Để thống nhất cách gọi loài trên toàn thế giới, tránh nhầm lẫn", "C. Để loài đó quý hiếm hơn", "D. Để bán được giá cao"], "answer": "B", "explain": "Tên khoa học giúp mọi quốc gia gọi đúng một loài, tránh nhầm lẫn do tên địa phương khác nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vườn quốc gia và khu bảo tồn thiên nhiên được lập ra chủ yếu để làm gì?", "options": ["A. Để nuôi gia súc", "B. Để bảo vệ các loài sinh vật và đa dạng sinh học", "C. Để khai thác gỗ", "D. Để xây khu nghỉ dưỡng"], "answer": "B", "explain": "Vườn quốc gia, khu bảo tồn giúp bảo vệ môi trường sống và các loài sinh vật quý hiếm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong khóa lưỡng phân, mỗi “bước” thường gồm mấy lựa chọn đối lập?", "options": ["A. Một lựa chọn", "B. Hai lựa chọn đối lập nhau", "C. Ba lựa chọn", "D. Bốn lựa chọn"], "answer": "B", "explain": "Đúng như tên gọi “lưỡng phân” (chia hai), mỗi bước có hai lựa chọn trái ngược nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sinh vật nào sau đây thuộc giới Nguyên sinh?", "options": ["A. Nấm hương", "B. Tảo silic", "C. Vi khuẩn lam", "D. Giun đất"], "answer": "B", "explain": "Tảo silic là sinh vật nhân thực đơn bào thuộc giới Nguyên sinh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một khu rừng có nhiều loài cây, chim, côn trùng, nấm... cho thấy điều gì về đa dạng sinh học?", "options": ["A. Đa dạng sinh học thấp", "B. Đa dạng sinh học cao", "C. Không có đa dạng sinh học", "D. Đa dạng sinh học không tồn tại ở rừng"], "answer": "B", "explain": "Số loài phong phú trong cùng một môi trường cho thấy đa dạng sinh học cao.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về sự phân bố của sinh vật.", "statements": ["a) Sinh vật phân bố ở khắp nơi trên Trái Đất.", "b) Không có sinh vật nào sống được trong đất.", "c) Một số vi khuẩn sống được ở suối nước nóng.", "d) Sinh vật biển sống trong môi trường nước mặn."], "answer": ["T", "F", "T", "T"], "explain": "Sinh vật sống cả trong đất, thậm chí một số vi khuẩn sống ở môi trường khắc nghiệt như suối nước nóng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về quan hệ giữa các giới.", "statements": ["a) Thực vật quang hợp tạo thức ăn và khí ôxi cho nhiều sinh vật khác.", "b) Động vật phụ thuộc trực tiếp hoặc gián tiếp vào thực vật để sống.", "c) Nấm phân hủy xác sinh vật, giúp vòng tuần hoàn vật chất.", "d) Các giới sinh vật hoàn toàn không liên quan đến nhau."], "answer": ["T", "T", "T", "F"], "explain": "Các giới sinh vật liên quan mật thiết: thực vật sản xuất, động vật tiêu thụ, nấm phân hủy.", "points": 1}, {"type": "short", "level": "NB", "q": "Một sinh vật đơn bào, có nhân hoàn chỉnh, sống tự do trong nước ao. Nó thuộc giới nào?", "answer": "Giới Nguyên sinh", "explain": "Đơn bào, nhân thực là đặc điểm của giới Nguyên sinh.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Khi dùng khóa lưỡng phân mà chọn sai đặc điểm ở bước đầu, kết quả phân loại sẽ thế nào?", "answer": "Sẽ sai (đi sai nhánh, không xác định đúng sinh vật)", "explain": "Chọn sai bước đầu dẫn vào nhánh sai nên kết quả không đúng.", "points": 0.5}]}]}</script>
