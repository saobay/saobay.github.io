. Ngủ màn chống muỗi", "B. Ăn chín, uống sôi, rửa tay và rửa rau sống thật kĩ", "C. Tiêm vắc-xin", "D. Đeo găng tay khi ra đường"], "answer": "B", "explain": "Bệnh kiết lị lây qua đường tiêu hóa nên vệ sinh ăn uống là biện pháp phòng bệnh chính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tảo đơn bào có vai trò gì trong các thủy vực?", "options": ["A. Làm đục nước, gây hại cá", "B. Quang hợp tạo ôxi và làm thức ăn cho động vật thủy sinh nhỏ", "C. Gây bệnh cho người tắm", "D. Ăn hết cá con"], "answer": "B", "explain": "Tảo đơn bào (thực vật phù du) quang hợp, tạo ôxi và là nguồn thức ăn đầu tiên của nhiều chuỗi thức ăn dưới nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiện tượng “nở hoa nước” (thủy triều đỏ) do tảo phát triển quá mức gây hậu quả gì?", "options": ["A. Làm nước sạch hơn", "B. Làm cá, tôm chết hàng loạt do thiếu ôxi và độc tố", "C. Giúp thủy sản lớn nhanh", "D. Không gây hậu quả gì"], "answer": "B", "explain": "Tảo nở hoa quá mức làm cạn ôxi trong nước và một số loài tiết độc tố, gây chết thủy sản hàng loạt.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về bệnh sốt rét.", "statements": ["a) Bệnh sốt rét do trùng sốt rét gây ra.", "b) Sốt rét lây qua muỗi Anopheles đốt.", "c) Sốt rét lây qua ăn uống chung bát đũa.", "d) Người bệnh sốt rét thường có cơn rét run, sốt cao theo chu kì."], "answer": ["T", "T", "F", "T"], "explain": "Sốt rét lây qua muỗi đốt, không lây qua ăn uống chung.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về phòng bệnh sốt rét.", "statements": ["a) Ngủ màn giúp tránh muỗi đốt.", "b) Để nước đọng quanh nhà giúp giảm muỗi.", "c) Diệt bọ gậy góp phần phòng sốt rét.", "d) Phát quang bụi rậm quanh nhà làm giảm nơi trú ẩn của muỗi."], "answer": ["T", "F", "T", "T"], "explain": "Nước đọng là nơi muỗi đẻ trứng nên phải loại bỏ, không được để tồn tại.", "points": 1}, {"type": "short", "level": "NB", "q": "Vật trung gian truyền trùng sốt rét cho người là con gì?", "answer": "Muỗi Anopheles (muỗi đòn sóc)", "explain": "Muỗi Anopheles cái đốt truyền trùng sốt rét vào máu người.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trùng sốt rét kí sinh và phá vỡ loại tế bào nào trong máu người?", "answer": "Hồng cầu", "explain": "Trùng phá vỡ hồng cầu hàng loạt gây các cơn sốt theo chu kì.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "VD", "q": "Nguyên sinh vật thường sống ở những môi trường nào?", "options": ["A. Chỉ trong cơ thể người", "B. Nước ngọt, nước mặn, đất ẩm và trong cơ thể sinh vật khác", "C. Chỉ trên cạn khô", "D. Chỉ trong băng tuyết"], "answer": "B", "explain": "Nguyên sinh vật phân bố rộng: ao hồ, biển, đất ẩm và kí sinh trong cơ thể sinh vật khác.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Muốn quan sát trùng giày sống trong nước ao, ta dùng dụng cụ nào?", "options": ["A. Kính lúp", "B. Kính hiển vi", "C. Mắt thường là đủ", "D. Kính thiên văn"], "answer": "B", "explain": "Trùng giày có kích thước khoảng 0,1 - 0,3 mm nên cần kính hiển vi để quan sát rõ cấu tạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trùng roi di chuyển nhờ bộ phận nào?", "options": ["A. Một hoặc vài roi dài ở đầu cơ thể", "B. Lông bơi khắp cơ thể", "C. Chân giả", "D. Không di chuyển được"], "answer": "A", "explain": "Trùng roi có roi dài ở phía trước; roi xoáy giúp cơ thể tiến về phía trước trong nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhóm nguyên sinh vật nào có thành tế bào chứa silic, vỏ có hoa văn đẹp?", "options": ["A. Trùng giày", "B. Tảo silic", "C. Amip", "D. Trùng sốt rét"], "answer": "B", "explain": "Tảo silic là tảo đơn bào có vỏ bằng chất silic với hoa văn tinh xảo, là thành phần quan trọng của phù du biển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên sinh vật khác vi khuẩn ở điểm cơ bản nào?", "options": ["A. Nguyên sinh vật nhỏ hơn vi khuẩn", "B. Nguyên sinh vật có tế bào nhân thực, vi khuẩn là tế bào nhân sơ", "C. Nguyên sinh vật không có tế bào", "D. Nguyên sinh vật chỉ sống kí sinh"], "answer": "B", "explain": "Điểm khác biệt cốt lõi: nguyên sinh vật có nhân hoàn chỉnh (nhân thực), vi khuẩn chưa có màng nhân (nhân sơ).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trùng giày bắt mồi và tiêu hóa thức ăn diễn ra ở đâu?", "options": ["A. Ở miệng tế bào, thức ăn vào không bào tiêu hóa", "B. Hấp thụ qua toàn bộ bề mặt da như nấm", "C. Qua rễ giả", "D. Trùng giày quang hợp nên không ăn mồi"], "answer": "A", "explain": "Thức ăn được lông bơi quét vào miệng tế bào, vào không bào tiêu hóa để tiêu hóa, cặn bã thải qua hậu môn tế bào.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về bệnh kiết lị do amip.", "statements": ["a) Trùng kiết lị kí sinh ở ruột người.", "b) Bệnh kiết lị lây qua đường tiêu hóa.", "c) Ăn chín, uống sôi giúp phòng bệnh kiết lị.", "d) Bệnh kiết lị do muỗi truyền."], "answer": ["T", "T", "T", "F"], "explain": "Kiết lị lây qua thức ăn, nước uống nhiễm bào xác, không phải do muỗi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về tảo đơn bào.", "statements": ["a) Tảo đơn bào có lục lạp và quang hợp được.", "b) Tảo đơn bào là thức ăn của nhiều động vật thủy sinh nhỏ.", "c) Tảo phát triển quá mức có thể gây chết cá hàng loạt.", "d) Tảo silic có vỏ bằng chất silic."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn nhận định đều đúng về tảo đơn bào.", "points": 1}, {"type": "short", "level": "NB", "q": "Trùng kiết lị kí sinh ở cơ quan nào của người?", "answer": "Ruột (đại tràng, ruột già)", "explain": "Trùng kiết lị gây loét ruột già, đau bụng, đi ngoài ra máu.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Dạng vỏ dày giúp trùng kiết lị tồn tại ngoài môi trường và lây bệnh được gọi là gì?", "answer": "Bào xác", "explain": "Bào xác theo thức ăn, nước uống nhiễm bẩn vào cơ thể qua đường tiêu hóa.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Vì sao nước ao tù, giàu chất hữu cơ thường có nhiều trùng giày, trùng roi?", "options": ["A. Vì nước tù nóng hơn", "B. Vì đó là nơi nhiều vi khuẩn và chất hữu cơ làm thức ăn cho chúng", "C. Vì chúng thích nước bẩn một cách ngẫu nhiên", "D. Vì không có ánh sáng"], "answer": "B", "explain": "Nguyên sinh vật ăn vi khuẩn và mảnh vụn hữu cơ nên phát triển mạnh ở nước giàu chất hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một số nguyên sinh vật được dùng làm sinh vật chỉ thị môi trường nước vì lí do gì?", "options": ["A. Chúng có màu đẹp", "B. Sự có mặt và số lượng của chúng phản ánh mức độ ô nhiễm của nước", "C. Chúng ăn được chất độc", "D. Chúng làm sạch nước hoàn toàn"], "answer": "B", "explain": "Nhiều loài nguyên sinh vật nhạy cảm với ô nhiễm nên được dùng để đánh giá chất lượng nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Amip (trùng biến hình) sống tự do thường gặp ở đâu?", "options": ["A. Trong máu người", "B. Trong nước ao, bùn ẩm", "C. Trong không khí khô", "D. Trong ruột người khỏe mạnh"], "answer": "B", "explain": "Amip sống tự do ở nước ao, vũng bùn; loài amip kiết lị mới kí sinh gây bệnh ở ruột người.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vòng đời của trùng sốt rét liên quan đến hai vật chủ nào?", "options": ["A. Người và chó", "B. Người và muỗi Anopheles", "C. Muỗi và cá", "D. Người và ruồi"], "answer": "B", "explain": "Trùng sốt rét hoàn thành một phần vòng đời trong cơ thể muỗi Anopheles và một phần trong cơ thể người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để cắt đứt vòng lây truyền bệnh sốt rét, ta cần tác động vào khâu nào?", "options": ["A. Diệt muỗi truyền bệnh và điều trị người bệnh", "B. Chỉ cần uống thuốc bổ", "C. Cách li người bệnh khỏi nước", "D. Không cho người bệnh ăn cơm"], "answer": "A", "explain": "Diệt muỗi Anopheles và chữa khỏi cho người bệnh (nguồn chứa trùng) sẽ cắt đứt đường lây truyền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát quang bụi rậm quanh nhà, khơi thông cống rãnh có tác dụng phòng sốt rét vì sao?", "options": ["A. Làm nhà đẹp hơn", "B. Phá nơi trú ẩn và nơi sinh sản của muỗi", "C. Đuổi được vi khuẩn", "D. Giúp nhà mát hơn"], "answer": "B", "explain": "Muỗi trú ẩn ở bụi rậm, đẻ ở nước đọng; dọn dẹp môi trường làm giảm muỗi truyền bệnh.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về nơi sống của nguyên sinh vật.", "statements": ["a) Nguyên sinh vật chỉ sống trong cơ thể người.", "b) Nhiều nguyên sinh vật sống trong nước ao, hồ.", "c) Một số nguyên sinh vật sống kí sinh trong cơ thể động vật.", "d) Một số nguyên sinh vật sống trong đất ẩm."], "answer": ["F", "T", "T", "T"], "explain": "Nguyên sinh vật sống ở nhiều môi trường: nước, đất ẩm và cơ thể sinh vật khác.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về cách di chuyển của nguyên sinh vật.", "statements": ["a) Trùng roi di chuyển bằng roi.", "b) Trùng giày di chuyển bằng chân giả.", "c) Amip di chuyển bằng chân giả.", "d) Một số nguyên sinh vật không tự di chuyển, trôi theo dòng nước."], "answer": ["T", "F", "T", "T"], "explain": "Trùng giày di chuyển bằng lông bơi, không phải chân giả.", "points": 1}, {"type": "short", "level": "NB", "q": "Trùng roi xanh quang hợp được nhờ bào quan nào trong tế bào?", "answer": "Lục lạp", "explain": "Lục lạp chứa diệp lục giúp trùng roi xanh quang hợp khi có ánh sáng.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Tảo đơn bào có vỏ bằng chất silic được gọi là tảo gì?", "answer": "Tảo silic", "explain": "Tảo silic có vỏ silic hai mảnh với hoa văn đẹp, quang hợp được.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "VD", "q": "Trùng roi xanh sống ở đâu và có đặc điểm gì dễ nhận biết?", "options": ["A. Trong máu người; không màu", "B. Trong nước ao; có roi và điểm mắt đỏ, chứa lục lạp", "C. Trong đất khô; có chân giả", "D. Trong biển; có vỏ silic"], "answer": "B", "explain": "Trùng roi xanh sống ở nước ao, có một roi dài, điểm mắt cảm nhận ánh sáng và lục lạp để quang hợp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ở những ao nuôi cá, tảo và nguyên sinh vật phù du có vai trò quan trọng vì lí do gì?", "options": ["A. Chúng làm nước đục để cá trốn", "B. Chúng là nguồn thức ăn tự nhiên và tạo ôxi cho cá, tôm con", "C. Chúng diệt hết vi khuẩn có hại", "D. Chúng làm cá lớn nhanh bất thường"], "answer": "B", "explain": "Sinh vật phù du là thức ăn tự nhiên quan trọng và nguồn ôxi cho các ao nuôi thủy sản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên sinh vật nào sau đây sống tự do, KHÔNG gây bệnh cho người?", "options": ["A. Trùng sốt rét", "B. Trùng kiết lị", "C. Trùng giày", "D. Không có loài nào"], "answer": "C", "explain": "Trùng giày sống tự do trong nước ao, ăn vi khuẩn, không gây bệnh cho người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kích thước của phần lớn nguyên sinh vật như thế nào?", "options": ["A. Bằng con kiến", "B. Nhỏ, phần lớn phải quan sát bằng kính hiển vi", "C. Nhìn rõ từng cơ quan bằng mắt thường", "D. Lớn hơn vi khuẩn hàng nghìn lần về chiều dài cơ thể động vật"], "answer": "B", "explain": "Nguyên sinh vật có kích thước hiển vi, thường từ vài chục đến vài trăm micrômét.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một số tảo đơn bào được con người khai thác để làm gì?", "options": ["A. Làm thuốc nổ", "B. Làm thực phẩm chức năng, thức ăn chăn nuôi và phân bón", "C. Làm vật liệu xây dựng chính", "D. Làm nhiên liệu dầu mỏ trực tiếp"], "answer": "B", "explain": "Tảo giàu dinh dưỡng được nuôi trồng làm thực phẩm bổ sung, thức ăn cho thủy sản và phân bón sinh học.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi bị sốt rét, vì sao người bệnh thường rét run theo cơn đều đặn?", "options": ["A. Do thời tiết thay đổi", "B. Do trùng sốt rét phá vỡ hồng cầu hàng loạt theo chu kì, giải phóng chất độc vào máu", "C. Do muỗi đốt nhiều lần", "D. Do uống nước lạnh"], "answer": "B", "explain": "Mỗi đợt trùng trưởng thành phá vỡ hồng cầu đồng loạt gây cơn sốt - rét run theo chu kì đặc trưng của bệnh.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về vai trò của nguyên sinh vật.", "statements": ["a) Nguyên sinh vật hoàn toàn có hại.", "b) Tảo đơn bào tạo ôxi nhờ quang hợp.", "c) Một số nguyên sinh vật là chỉ thị cho mức độ sạch của nước.", "d) Nguyên sinh vật là mắt xích trong chuỗi thức ăn thủy sinh."], "answer": ["F", "T", "T", "T"], "explain": "Nguyên sinh vật có cả vai trò có lợi lớn trong tự nhiên, không hoàn toàn có hại.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về trùng sốt rét.", "statements": ["a) Trùng sốt rét kí sinh trong hồng cầu người.", "b) Muỗi Anopheles cái là vật trung gian truyền trùng sốt rét.", "c) Trùng sốt rét là một loại vi khuẩn.", "d) Phá vỡ hồng cầu hàng loạt gây ra các cơn sốt của bệnh sốt rét."], "answer": ["T", "T", "F", "T"], "explain": "Trùng sốt rét là nguyên sinh vật, không phải vi khuẩn.", "points": 1}, {"type": "short", "level": "NB", "q": "Không bào giúp trùng giày đẩy nước thừa ra ngoài có tên là gì?", "answer": "Không bào co bóp", "explain": "Không bào co bóp thu nước thừa rồi co bóp đẩy ra ngoài cơ thể.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hiện tượng tảo phát triển quá mức làm nước đổi màu, cá chết hàng loạt gọi là gì?", "answer": "Nở hoa nước (thủy triều đỏ)", "explain": "Tảo nở hoa gây thiếu ôxi và có thể tiết độc tố làm chết thủy sản.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Bào xác của trùng kiết lị có vai trò gì trong lây bệnh?", "options": ["A. Giúp trùng di chuyển nhanh", "B. Là dạng tồn tại bền vững ngoài môi trường, qua thức ăn, nước uống vào cơ thể mới", "C. Giúp trùng quang hợp", "D. Là dạng sinh sản hữu tính duy nhất"], "answer": "B", "explain": "Bào xác có vỏ dày chịu được môi trường ngoài, là giai đoạn lây nhiễm của trùng kiết lị qua đường tiêu hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để phòng bệnh do nguyên sinh vật kí sinh đường ruột, thói quen nào quan trọng nhất?", "options": ["A. Ngủ sớm", "B. Rửa tay bằng xà phòng trước khi ăn và sau khi đi vệ sinh", "C. Uống nhiều nước ngọt", "D. Ăn nhiều rau sống không cần rửa"], "answer": "B", "explain": "Vệ sinh tay và ăn uống sạch sẽ ngăn bào xác nguyên sinh vật kí sinh xâm nhập qua đường miệng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trùng đế giày còn được gọi là trùng gì?", "options": ["A. Trùng roi", "B. Trùng giày (vì cơ thể dẹt hình đế giày)", "C. Trùng biến hình", "D. Trùng loa kèn"], "answer": "B", "explain": "Cơ thể trùng đế giày dẹt, hình giống đế giày nên còn gọi là trùng giày.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhóm sinh vật phù du trong ao hồ gồm chủ yếu những sinh vật nào và có vai trò gì?", "options": ["A. Cá lớn; ăn tôm", "B. Tảo đơn bào và động vật nguyên sinh nhỏ; là nền tảng chuỗi thức ăn thủy sinh", "C. Rong rêu; trang trí ao", "D. Vi khuẩn; gây bệnh cho cá"], "answer": "B", "explain": "Sinh vật phù du (tảo và nguyên sinh vật nhỏ) là mắt xích đầu tiên, nuôi sống nhiều loài thủy sinh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một học sinh soi giọt nước ao dưới kính hiển vi thấy một sinh vật hình đế giày, bơi nhanh nhờ nhiều lông nhỏ. Đó là sinh vật gì?", "options": ["A. Trùng roi", "B. Trùng giày", "C. Amip", "D. Tảo silic"], "answer": "B", "explain": "Hình đế giày và lông bơi phủ khắp cơ thể là đặc điểm nhận biết trùng giày (trùng đế giày).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sinh vật đơn bào liên tục thay đổi hình dạng, thò ra các mấu lồi để bò và nuốt thức ăn. Đó là sinh vật gì?", "options": ["A. Trùng biến hình (amip)", "B. Trùng giày", "C. Tảo lục", "D. Trùng roi"], "answer": "A", "explain": "Khả năng tạo chân giả làm thay đổi hình dạng liên tục là đặc điểm của amip — trùng biến hình.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về dinh dưỡng của nguyên sinh vật.", "statements": ["a) Trùng giày ăn vi khuẩn và vụn hữu cơ.", "b) Mọi nguyên sinh vật đều quang hợp được.", "c) Trùng sốt rét dinh dưỡng kiểu kí sinh.", "d) Trùng roi xanh vừa tự dưỡng vừa dị dưỡng tùy điều kiện sáng."], "answer": ["T", "F", "T", "T"], "explain": "Chỉ các nguyên sinh vật có lục lạp (tảo, trùng roi xanh) mới quang hợp được.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về quan sát nguyên sinh vật.", "statements": ["a) Có thể nhìn rõ trùng giày bằng mắt thường.", "b) Dùng kính hiển vi để quan sát trùng giày trong nước ao.", "c) Lấy nước ở ao tù, giàu chất hữu cơ dễ tìm thấy nhiều nguyên sinh vật.", "d) Trùng giày có hình dạng giống chiếc đế giày."], "answer": ["F", "T", "T", "T"], "explain": "Trùng giày rất nhỏ (khoảng 0,1 - 0,3 mm), phải dùng kính hiển vi mới thấy rõ.", "points": 1}, {"type": "short", "level": "NB", "q": "Để phòng bệnh sốt rét, khi ngủ cần dùng vật dụng gì để tránh muỗi đốt?", "answer": "Màn (ngủ màn)", "explain": "Ngủ màn là biện pháp đơn giản, hiệu quả để tránh muỗi truyền bệnh đốt.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trùng giày có hai loại nhân nào trong tế bào?", "answer": "Nhân lớn và nhân nhỏ", "explain": "Nhân lớn điều khiển hoạt động sống, nhân nhỏ liên quan đến sinh sản.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Vì sao bệnh sốt rét thường phổ biến ở vùng núi, vùng nhiều ao tù nước đọng?", "options": ["A. Vì người vùng núi yếu hơn", "B. Vì đó là nơi muỗi Anopheles (vật trung gian truyền bệnh) sinh sống nhiều", "C. Vì nước đọng chứa trùng trong nước uống", "D. Vì khí hậu lạnh hơn"], "answer": "B", "explain": "Muỗi truyền bệnh sinh sản ở nơi ẩm, nhiều nước đọng, bụi rậm nên sốt rét lưu hành ở những vùng này.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đặc điểm nào sau đây đúng với tảo silic?", "options": ["A. Là động vật nguyên sinh ăn vi khuẩn", "B. Là tảo đơn bào có vỏ bằng silic, quang hợp được", "C. Kí sinh trong hồng cầu", "D. Di chuyển bằng chân giả"], "answer": "B", "explain": "Tảo silic thuộc nhóm tảo, có vỏ silic hai mảnh và lục lạp để quang hợp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sinh vật nào sau đây thuộc nhóm nguyên sinh vật có khả năng quang hợp?", "options": ["A. Trùng giày", "B. Amip", "C. Tảo lục đơn bào", "D. Trùng kiết lị"], "answer": "C", "explain": "Tảo lục đơn bào có lục lạp nên quang hợp tự dưỡng như thực vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi điều trị bệnh sốt rét, ngoài diệt trùng trong cơ thể người bệnh còn cần chú ý điều gì?", "options": ["A. Không cần chú ý gì thêm", "B. Phòng muỗi đốt để tránh lây sang người khác và tái nhiễm", "C. Ăn kiêng hoàn toàn", "D. Ngừng uống nước"], "answer": "B", "explain": "Người bệnh là nguồn chứa trùng; cần ngủ màn chống muỗi đốt để cắt đường lây truyền và tránh bị đốt tái nhiễm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm mắt đỏ của trùng roi xanh có chức năng gì?", "options": ["A. Tiêu hóa thức ăn", "B. Cảm nhận ánh sáng để bơi về phía có ánh sáng", "C. Bài tiết nước thừa", "D. Bắt mồi"], "answer": "B", "explain": "Điểm mắt giúp trùng roi xanh định hướng ánh sáng, bơi tới nơi có sáng để quang hợp hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên sinh vật sinh sản chủ yếu bằng hình thức nào?", "options": ["A. Sinh sản hữu tính có hoa", "B. Phân đôi vô tính (một số có hình thức sinh sản khác ở giai đoạn nhất định)", "C. Đẻ trứng", "D. Nảy mầm như cây"], "answer": "B", "explain": "Phần lớn nguyên sinh vật sinh sản vô tính bằng phân đôi; một số có giai đoạn sinh sản hữu tính trong vòng đời.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về vòng đời trùng sốt rét.", "statements": ["a) Trùng sốt rét chỉ sống trong cơ thể muỗi.", "b) Muỗi hút máu người bệnh có thể mang trùng truyền sang người khỏe.", "c) Điều trị khỏi cho người bệnh góp phần cắt đường lây truyền.", "d) Trùng sốt rét gây bệnh qua đường nước uống."], "answer": ["F", "T", "T", "F"], "explain": "Vòng đời trùng sốt rét liên quan cả người và muỗi; lây qua muỗi đốt chứ không qua nước uống.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về nguyên sinh vật gây bệnh khác.", "statements": ["a) Ngoài sốt rét và kiết lị, một số nguyên sinh vật còn gây bệnh cho vật nuôi, thủy sản.", "b) Mọi nguyên sinh vật kí sinh đều gây chết người.", "c) Phòng bệnh nguyên sinh vật kí sinh cần vệ sinh môi trường và ăn uống.", "d) Bào xác giúp trùng kiết lị tồn tại lâu ngoài môi trường."], "answer": ["T", "F", "T", "T"], "explain": "Không phải nguyên sinh vật kí sinh nào cũng gây chết người; nhiều bệnh có thể phòng và chữa được.", "points": 1}, {"type": "short", "level": "NB", "q": "Nguyên sinh vật có tế bào thuộc dạng nhân thực hay nhân sơ?", "answer": "Nhân thực", "explain": "Nguyên sinh vật có nhân hoàn chỉnh có màng bao bọc — tế bào nhân thực.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Điểm đỏ ở đầu cơ thể trùng roi xanh giúp nó cảm nhận điều gì?", "answer": "Ánh sáng", "explain": "Điểm mắt giúp trùng roi bơi về phía có ánh sáng để quang hợp.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Vai trò của nguyên sinh vật trong việc làm sạch nước tự nhiên là gì?", "options": ["A. Chúng ăn vi khuẩn và chất hữu cơ lơ lửng, góp phần làm trong nước", "B. Chúng tiết chất độc diệt mọi sinh vật", "C. Chúng không có vai trò", "D. Chúng làm nước đục thêm"], "answer": "A", "explain": "Nhiều nguyên sinh vật ăn vi khuẩn, mảnh hữu cơ nên góp phần vào quá trình tự làm sạch của nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để hạn chế muỗi Anopheles quanh nhà, biện pháp nào sau đây hiệu quả?", "options": ["A. Để các chum, vại nước mở nắp lâu ngày", "B. Đậy kín dụng cụ chứa nước, thả cá ăn bọ gậy, vệ sinh môi trường", "C. Trồng nhiều bụi rậm quanh nhà", "D. Giữ ao tù trước cửa nhà"], "answer": "B", "explain": "Loại bỏ nơi muỗi đẻ và bọ gậy (đậy kín chum vại, thả cá) giúp giảm muỗi truyền bệnh sốt rét.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trùng sốt rét thuộc nhóm nguyên sinh vật nào về mặt dinh dưỡng?", "options": ["A. Tự dưỡng quang hợp", "B. Kí sinh, hút chất dinh dưỡng từ tế bào chủ", "C. Hoại sinh phân hủy xác chết ngoài môi trường", "D. Cộng sinh có lợi cho người"], "answer": "B", "explain": "Trùng sốt rét sống kí sinh trong gan và hồng cầu, lấy dinh dưỡng từ tế bào chủ và gây bệnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên sinh vật nào sau đây có khả năng tạo chân giả để bao lấy và nuốt vi khuẩn làm thức ăn?", "options": ["A. Trùng giày", "B. Amip sống tự do", "C. Tảo silic", "D. Trùng sốt rét trong muỗi"], "answer": "B", "explain": "Amip dùng chân giả bao quanh con mồi rồi đưa vào không bào tiêu hóa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vai trò của không bào tiêu hóa ở trùng giày là gì?", "options": ["A. Chứa và tiêu hóa thức ăn", "B. Đẩy nước thừa ra ngoài", "C. Giúp bơi", "D. Quang hợp"], "answer": "A", "explain": "Thức ăn vào không bào tiêu hóa sẽ được các chất trong tế bào phân giải; còn không bào co bóp mới đẩy nước thừa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhiều loài động vật nguyên sinh trong ruột mối giúp mối tiêu hóa chất gì?", "options": ["A. Protein trong thịt", "B. Xenlulôzơ trong gỗ", "C. Chất béo", "D. Tinh bột trong cơm"], "answer": "B", "explain": "Trùng roi sống cộng sinh trong ruột mối giúp phân giải xenlulôzơ của gỗ — thức ăn chính của mối.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về sự khác nhau giữa nguyên sinh vật và vi khuẩn.", "statements": ["a) Nguyên sinh vật có màng nhân, vi khuẩn thì chưa.", "b) Vi khuẩn thuộc giới Nguyên sinh.", "c) Trùng giày là nguyên sinh vật còn vi khuẩn lao thuộc giới Khởi sinh.", "d) Nguyên sinh vật thường lớn hơn vi khuẩn."], "answer": ["T", "F", "T", "T"], "explain": "Vi khuẩn thuộc giới Khởi sinh (nhân sơ), không thuộc giới Nguyên sinh.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về tảo nở hoa (thủy triều đỏ).", "statements": ["a) Tảo nở hoa làm tăng ôxi hòa tan một cách ổn định cho cá.", "b) Tảo nở hoa quá mức gây thiếu ôxi, làm cá chết.", "c) Một số loài tảo nở hoa tiết độc tố nguy hiểm.", "d) Nước thải giàu chất dinh dưỡng đổ ra sông hồ góp phần gây nở hoa tảo."], "answer": ["F", "T", "T", "T"], "explain": "Khi tảo chết và phân hủy, ôxi bị tiêu hao mạnh khiến cá thiếu ôxi; không làm nước giàu ôxi ổn định.", "points": 1}, {"type": "short", "level": "NB", "q": "Muốn diệt nơi sinh sản của muỗi truyền sốt rét trong các dụng cụ chứa nước, cần diệt giai đoạn nào?", "answer": "Bọ gậy (lăng quăng)", "explain": "Diệt bọ gậy, đậy kín chum vại giúp cắt vòng đời của muỗi.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Sinh vật đơn bào hình đế giày, sống trong nước ao, ăn vi khuẩn là sinh vật gì?", "answer": "Trùng giày (trùng đế giày)", "explain": "Đó là trùng giày, nguyên sinh vật sống tự do không gây bệnh.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VD", "q": "Để tìm trùng giày, nên lấy mẫu nước ở đâu?", "options": ["A. Nước máy đun sôi để nguội", "B. Nước ao, nước ngâm rơm rạ, cỏ khô có nhiều chất hữu cơ", "C. Nước biển sâu", "D. Nước cất trong phòng thí nghiệm"], "answer": "B", "explain": "Nước ngâm rơm cỏ giàu vi khuẩn — nguồn thức ăn của trùng giày — nên dễ tìm thấy chúng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi nhỏ một giọt nước ao lên lam kính soi dưới kính hiển vi, việc đậy lá kính (lamen) có tác dụng gì?", "options": ["A. Trang trí lam kính", "B. Giữ giọt nước mỏng, phẳng, tránh tràn và bảo vệ vật kính", "C. Giết chết sinh vật để dễ xem", "D. Làm sinh vật lớn lên"], "answer": "B", "explain": "Lá kính giúp mẫu vật thành lớp mỏng đều, quan sát rõ và không làm bẩn vật kính hiển vi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bệnh ngủ châu Phi ở người do nguyên sinh vật nào và lây qua ruồi nào?", "options": ["A. Trùng roi Trypanosoma, ruồi xe xe (tsetse) truyền", "B. Trùng giày, ruồi nhà truyền", "C. Amip, muỗi truyền", "D. Tảo độc, nước uống truyền"], "answer": "A", "explain": "Trùng roi kí sinh trong máu (Trypanosoma) do ruồi tsetse truyền gây bệnh ngủ ở châu Phi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao trùng sốt rét được xếp vào nguyên sinh vật mà không phải động vật đa bào?", "options": ["A. Vì chúng gây bệnh", "B. Vì cơ thể chúng chỉ gồm một tế bào nhân thực thực hiện mọi hoạt động sống", "C. Vì chúng rất nhỏ", "D. Vì chúng sống trong máu"], "answer": "B", "explain": "Trùng sốt rét là sinh vật đơn bào nhân thực nên thuộc giới Nguyên sinh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên sinh vật nào giúp nhận biết nước sạch vì chúng chỉ sống được ở nước ít ô nhiễm?", "options": ["A. Trùng kiết lị", "B. Một số loài tảo và trùng nhất định là sinh vật chỉ thị nước sạch", "C. Trùng sốt rét", "D. Amip ăn não người"], "answer": "B", "explain": "Mỗi loài nguyên sinh vật thích nghi với mức ô nhiễm khác nhau nên thành phần loài phản ánh chất lượng nước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Học sinh cần làm gì để bảo vệ mình khỏi các nguyên sinh vật gây bệnh đường tiêu hóa ở trường học?", "options": ["A. Uống nước lã ở vòi nước sân trường thoải mái", "B. Rửa tay trước bữa ăn, ăn chín uống sôi, không ăn hàng rong mất vệ sinh trước cổng trường", "C. Chia sẻ cốc uống nước với bạn", "D. Lội nước ao tù sau mưa"], "answer": "B", "explain": "Vệ sinh ăn uống là chìa khóa phòng các bệnh đường tiêu hóa do nguyên sinh vật và vi khuẩn gây ra.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về sinh sản của nguyên sinh vật.", "statements": ["a) Nhiều nguyên sinh vật sinh sản vô tính bằng phân đôi.", "b) Trùng giày chỉ sinh sản hữu tính.", "c) Trong điều kiện thuận lợi, nguyên sinh vật sinh sản nhanh tạo số lượng lớn.", "d) Một số nguyên sinh vật có giai đoạn sinh sản hữu tính trong vòng đời."], "answer": ["T", "F", "T", "T"], "explain": "Trùng giày sinh sản chủ yếu bằng phân đôi (vô tính), không phải chỉ sinh sản hữu tính.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về bảo vệ sức khỏe trước nguyên sinh vật gây bệnh.", "statements": ["a) Giữ vệ sinh ăn uống giúp phòng bệnh kiết lị.", "b) Ngủ màn giúp phòng bệnh sốt rét.", "c) Không cần diệt muỗi nếu đã uống thuốc bổ.", "d) Vệ sinh môi trường sống giúp giảm cả muỗi và mầm bệnh đường tiêu hóa."], "answer": ["T", "T", "F", "T"], "explain": "Thuốc bổ không thay thế được biện pháp phòng bệnh như diệt muỗi, ngủ màn.", "points": 1}, {"type": "short", "level": "NB", "q": "Tảo và nguyên sinh vật nhỏ trôi nổi trong nước, làm nền tảng chuỗi thức ăn thủy sinh được gọi chung là gì?", "answer": "Sinh vật phù du", "explain": "Sinh vật phù du là mắt xích đầu tiên của nhiều chuỗi thức ăn dưới nước.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Bệnh kiết lị do amip lây truyền chủ yếu qua đường nào?", "answer": "Đường tiêu hóa", "explain": "Bào xác trùng kiết lị vào cơ thể qua thức ăn, nước uống không vệ sinh.", "points": 0.5}]}]}</script>
