<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Virus có kích thước như thế nào?", "options": ["A. Lớn hơn vi khuẩn nhiều lần", "B. Rất nhỏ, nhỏ hơn vi khuẩn, chỉ nhìn thấy dưới kính hiển vi điện tử", "C. Nhìn thấy được bằng mắt thường", "D. Bằng kích thước tế bào động vật"], "answer": "B", "explain": "Virus có kích thước siêu nhỏ (đơn vị nanômét), nhỏ hơn vi khuẩn, phải dùng kính hiển vi điện tử mới thấy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Virus được coi là dạng sống đặc biệt vì lí do nào?", "options": ["A. Virus có đầy đủ các bào quan", "B. Virus chưa có cấu tạo tế bào và chỉ nhân lên được trong tế bào sống", "C. Virus tự tổng hợp được thức ăn", "D. Virus di chuyển được như động vật"], "answer": "B", "explain": "Virus chưa có cấu tạo tế bào, không tự sinh sản được ngoài tế bào sống nên là dạng sống đặc biệt, nằm giữa giới vô sinh và hữu sinh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cấu tạo của virus gồm những thành phần chính nào?", "options": ["A. Thành tế bào, màng, nhân", "B. Vỏ protein và lõi vật chất di truyền (ADN hoặc ARN)", "C. Màng, tế bào chất, lục lạp", "D. Vỏ kitin và bào tử"], "answer": "B", "explain": "Mọi virus đều gồm vỏ protein bao bọc bên ngoài và lõi vật chất di truyền (ADN hoặc ARN) ở bên trong.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thành phần nằm ở phía ngoài cùng của virus là gì?", "options": ["A. Lõi ADN", "B. Vỏ protein (capsit)", "C. Màng sinh chất", "D. Tế bào chất"], "answer": "B", "explain": "Bên ngoài virus là lớp vỏ protein gọi là capsit, bảo vệ vật chất di truyền bên trong.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vật chất di truyền của virus có thể là gì?", "options": ["A. Chỉ là ADN", "B. Chỉ là ARN", "C. ADN hoặc ARN", "D. Protein"], "answer": "C", "explain": "Mỗi loại virus mang vật chất di truyền là ADN hoặc ARN, ví dụ virus cúm mang ARN.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Virus có cấu tạo tế bào hay chưa?", "options": ["A. Đã có tế bào hoàn chỉnh", "B. Chưa có cấu tạo tế bào", "C. Có tế bào nhưng không có màng", "D. Có nhiều tế bào"], "answer": "B", "explain": "Virus chưa có cấu tạo tế bào: không có màng sinh chất, tế bào chất và các bào quan.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về cấu tạo của virus.", "statements": ["a) Virus gồm vỏ protein và lõi vật chất di truyền.", "b) Virus có đầy đủ màng, tế bào chất và nhân như tế bào.", "c) Vật chất di truyền của virus chỉ có thể là ADN.", "d) Một số virus có thêm lớp vỏ ngoài bao bọc."], "answer": ["T", "F", "F", "T"], "explain": "Virus chưa có cấu tạo tế bào; vật chất di truyền có thể là ADN hoặc ARN.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về đặc điểm sống của virus.", "statements": ["a) Virus tự sinh sản được trên môi trường thạch dinh dưỡng.", "b) Virus chỉ nhân lên được trong tế bào sống.", "c) Ngoài tế bào, virus ở trạng thái hạt vô sinh.", "d) Virus là sinh vật kí sinh bắt buộc."], "answer": ["F", "T", "T", "T"], "explain": "Virus không tự nhân lên ngoài tế bào sống nên là kí sinh bắt buộc.", "points": 1}, {"type": "short", "level": "NB", "q": "Dạng hạt gồm vỏ protein và lõi vật chất di truyền, chưa có cấu tạo tế bào được gọi là gì?", "answer": "Virus", "explain": "Đó là virus — dạng sống đặc biệt chưa có cấu tạo tế bào.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Lớp vỏ protein bao bọc bên ngoài virus được gọi là gì?", "answer": "Capsit (vỏ protein)", "explain": "Vỏ protein của virus còn gọi là capsit.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "VD", "q": "Virus nhân lên (sinh sản) bằng cách nào?", "options": ["A. Phân đôi như vi khuẩn", "B. Xâm nhập vào tế bào sống và nhờ tế bào chủ tạo ra virus mới", "C. Nảy chồi trên môi trường dinh dưỡng", "D. Tạo bào tử"], "answer": "B", "explain": "Virus là sinh vật kí sinh bắt buộc: chỉ nhân lên được khi ở trong tế bào sống của vật chủ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao virus được gọi là sinh vật kí sinh bắt buộc?", "options": ["A. Vì virus sống trên da người", "B. Vì virus chỉ nhân lên được trong tế bào sống của vật chủ", "C. Vì virus ăn thịt vi khuẩn", "D. Vì virus sống trong nước bẩn"], "answer": "B", "explain": "Ngoài tế bào sống, virus không thể tự nhân lên và tồn tại như hạt vô sinh, nên gọi là kí sinh bắt buộc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Virus có những hình dạng phổ biến nào?", "options": ["A. Hình cầu, hình que, hình xoắn và các dạng phức tạp", "B. Chỉ có hình cầu", "C. Chỉ có hình que", "D. Hình sao và hình trăng"], "answer": "A", "explain": "Virus có nhiều hình dạng: hình cầu, hình que (hình trụ), hình xoắn, hình khối đa diện hoặc dạng phức tạp như virus ăn vi khuẩn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Virus gây bệnh đậu mùa, sởi, cúm lây truyền chủ yếu qua đường nào?", "options": ["A. Đường tiêu hóa", "B. Đường hô hấp (giọt bắn, không khí)", "C. Qua vết thương hở", "D. Qua muỗi đốt"], "answer": "B", "explain": "Nhiều virus gây bệnh đường hô hấp lây qua giọt bắn khi ho, hắt hơi và tiếp xúc gần.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Virus HIV tấn công chủ yếu vào hệ cơ quan nào của cơ thể người?", "options": ["A. Hệ tiêu hóa", "B. Hệ miễn dịch", "C. Hệ xương", "D. Hệ bài tiết"], "answer": "B", "explain": "HIV phá hủy các tế bào miễn dịch, làm suy giảm khả năng chống bệnh của cơ thể (bệnh AIDS).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Virus HIV lây truyền qua những con đường nào?", "options": ["A. Ôm, bắt tay thông thường", "B. Đường máu, quan hệ tình dục không an toàn và từ mẹ sang con", "C. Muỗi đốt", "D. Ăn uống chung bát đũa"], "answer": "B", "explain": "HIV lây qua máu, quan hệ tình dục không an toàn và từ mẹ sang con; không lây qua tiếp xúc thông thường.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về kích thước và hình dạng virus.", "statements": ["a) Virus nhỏ hơn vi khuẩn.", "b) Virus quan sát được bằng kính hiển vi quang học thông thường.", "c) Virus có nhiều hình dạng: cầu, que, xoắn, phức tạp.", "d) Virus cúm có dạng gần hình cầu."], "answer": ["T", "F", "T", "T"], "explain": "Virus có kích thước nanômét, phải dùng kính hiển vi điện tử mới quan sát được.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về bệnh do virus gây ra.", "statements": ["a) Bệnh cúm do virus gây ra.", "b) Bệnh lao phổi do virus gây ra.", "c) Bệnh sốt xuất huyết do virus Dengue gây ra.", "d) Bệnh dại do virus dại gây ra."], "answer": ["T", "F", "T", "T"], "explain": "Bệnh lao phổi do vi khuẩn lao gây ra, không phải virus.", "points": 1}, {"type": "short", "level": "NB", "q": "Vật chất di truyền của virus có thể là ADN hoặc loại axit nuclêic nào nữa?", "answer": "ARN", "explain": "Virus mang ADN hoặc ARN làm vật chất di truyền.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Virus chỉ nhân lên được trong tế bào sống nên được gọi là sinh vật gì?", "answer": "Kí sinh bắt buộc", "explain": "Virus là sinh vật kí sinh bắt buộc trong tế bào sống.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Bệnh sốt xuất huyết do virus gây ra và lây truyền qua vật trung gian nào?", "options": ["A. Ruồi nhà", "B. Muỗi vằn (muỗi Aedes)", "C. Chó, mèo", "D. Nước uống"], "answer": "B", "explain": "Virus Dengue gây sốt xuất huyết, do muỗi vằn đốt truyền từ người bệnh sang người khỏe.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bệnh viêm gan B do virus gây ra, lây chủ yếu qua đường nào?", "options": ["A. Đường hô hấp", "B. Đường máu và các dịch cơ thể", "C. Qua không khí", "D. Qua da lành"], "answer": "B", "explain": "Virus viêm gan B lây qua máu, dùng chung kim tiêm, dao cạo và từ mẹ sang con.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Virus dại lây vào cơ thể người chủ yếu qua con đường nào?", "options": ["A. Ăn thịt chó", "B. Vết cắn, vết cào của động vật mắc bệnh dại", "C. Uống nước lã", "D. Hít phải bụi"], "answer": "B", "explain": "Virus dại có trong nước bọt động vật bệnh, xâm nhập qua vết cắn, vết cào làm tổn thương da.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vắc-xin có tác dụng gì trong phòng bệnh do virus?", "options": ["A. Tiêu diệt virus ngay lập tức ngoài môi trường", "B. Kích thích cơ thể tạo khả năng miễn dịch, phòng bệnh trước", "C. Chữa khỏi mọi bệnh virus", "D. Thay thế kháng sinh"], "answer": "B", "explain": "Vắc-xin giúp cơ thể tạo kháng thể và ghi nhớ miễn dịch, nên khi virus thật xâm nhập sẽ chống lại hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp nào sau đây giúp phòng tránh bệnh lây qua đường hô hấp do virus?", "options": ["A. Đeo khẩu trang, rửa tay thường xuyên, giữ khoảng cách khi có dịch", "B. Ăn nhiều thịt sống", "C. Uống nước đá", "D. Không cần vệ sinh cá nhân"], "answer": "A", "explain": "Đeo khẩu trang, rửa tay bằng xà phòng và hạn chế tụ tập khi có dịch giúp giảm lây nhiễm virus qua đường hô hấp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kháng sinh có tác dụng điều trị bệnh do virus hay không?", "options": ["A. Có, kháng sinh diệt mọi virus", "B. Không, kháng sinh chỉ diệt vi khuẩn, không diệt được virus", "C. Có, nếu uống liều cao", "D. Có, với mọi loại virus"], "answer": "B", "explain": "Kháng sinh chỉ có tác dụng với vi khuẩn; bệnh do virus cần biện pháp điều trị và phòng ngừa riêng (ví dụ tiêm vắc-xin).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về đường lây truyền của virus.", "statements": ["a) HIV lây qua bắt tay, ôm thông thường.", "b) Virus cúm lây qua giọt bắn khi ho, hắt hơi.", "c) Virus viêm gan B lây chủ yếu qua đường máu.", "d) Muỗi vằn truyền virus gây sốt xuất huyết."], "answer": ["F", "T", "T", "T"], "explain": "HIV không lây qua tiếp xúc thông thường như bắt tay, ôm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về vắc-xin.", "statements": ["a) Vắc-xin giúp cơ thể tạo miễn dịch phòng bệnh trước.", "b) Vắc-xin là thuốc chữa bệnh cho người đã mắc bệnh nặng.", "c) Tiêm vắc-xin phòng dại cần thực hiện sớm sau khi bị chó nghi dại cắn.", "d) Trẻ em cần tiêm/uống vắc-xin theo lịch tiêm chủng mở rộng."], "answer": ["T", "F", "T", "T"], "explain": "Vắc-xin dùng để phòng bệnh (tạo miễn dịch), không phải thuốc chữa bệnh.", "points": 1}, {"type": "short", "level": "NB", "q": "Để quan sát được virus, người ta phải dùng loại kính hiển vi nào?", "answer": "Kính hiển vi điện tử", "explain": "Virus quá nhỏ nên chỉ quan sát được dưới kính hiển vi điện tử.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Bệnh sốt xuất huyết do muỗi nào truyền virus?", "answer": "Muỗi vằn (muỗi Aedes)", "explain": "Muỗi vằn đốt truyền virus Dengue gây sốt xuất huyết.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "VD", "q": "Khi bị chó nghi dại cắn, việc cần làm ngay là gì?", "options": ["A. Băng kín vết thương và để yên", "B. Rửa vết thương dưới vòi nước với xà phòng rồi đến cơ sở y tế tiêm vắc-xin phòng dại", "C. Bôi lá cây vào vết thương", "D. Chờ vài tuần xem có triệu chứng không"], "answer": "B", "explain": "Bệnh dại rất nguy hiểm; phải rửa ngay vết thương và đến cơ sở y tế để được tiêm vắc-xin, huyết thanh phòng dại kịp thời.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Muốn phòng bệnh sốt xuất huyết, biện pháp quan trọng nào sau đây cần làm?", "options": ["A. Đậy kín dụng cụ chứa nước, diệt muỗi và bọ gậy, ngủ màn", "B. Phun thuốc trừ sâu khắp nhà mỗi ngày", "C. Không uống nước đun sôi", "D. Đóng kín cửa cả ngày"], "answer": "A", "explain": "Muỗi vằn đẻ trứng ở nước đọng; đậy kín chum vại, diệt bọ gậy và ngủ màn là biện pháp phòng sốt xuất huyết hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ngoài gây bệnh, virus còn có lợi ích nào?", "options": ["A. Làm thực phẩm trực tiếp cho người", "B. Dùng làm vắc-xin và trong công nghệ sinh học, y học", "C. Dùng để trang trí", "D. Giúp cây quang hợp"], "answer": "B", "explain": "Virus được ứng dụng để sản xuất vắc-xin, nghiên cứu di truyền và một số chế phẩm sinh học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thể thực khuẩn (virus ăn vi khuẩn) tấn công đối tượng nào?", "options": ["A. Tế bào người", "B. Tế bào vi khuẩn", "C. Tế bào nấm", "D. Tế bào thực vật"], "answer": "B", "explain": "Thể thực khuẩn là virus kí sinh trong tế bào vi khuẩn, có dạng phức tạp với đầu và đuôi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi virus xâm nhập vào tế bào chủ, phần nào của virus được đưa vào trong tế bào?", "options": ["A. Cả hạt virus nguyên vẹn", "B. Chủ yếu là vật chất di truyền của virus", "C. Chỉ có vỏ protein", "D. Chỉ có đuôi virus"], "answer": "B", "explain": "Virus bám vào tế bào chủ và đưa vật chất di truyền vào trong, nhờ bộ máy của tế bào chủ để tạo virus mới.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sau khi nhân lên trong tế bào chủ, các virus mới thường làm gì?", "options": ["A. Ở yên trong tế bào mãi", "B. Phá vỡ tế bào chủ, thoát ra và xâm nhập tế bào khác", "C. Biến thành vi khuẩn", "D. Tự chết hết ngay"], "answer": "B", "explain": "Virus mới được tạo thành với số lượng lớn sẽ phá hủy tế bào chủ và tiếp tục lây sang các tế bào khác.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về kháng sinh và virus.", "statements": ["a) Kháng sinh diệt được mọi virus.", "b) Kháng sinh chỉ có tác dụng với vi khuẩn.", "c) Tự ý dùng kháng sinh khi cảm cúm là việc nên làm.", "d) Lạm dụng kháng sinh làm tăng nguy cơ kháng thuốc."], "answer": ["F", "T", "F", "T"], "explain": "Kháng sinh không diệt virus; lạm dụng kháng sinh gây kháng thuốc và tác dụng phụ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về phòng bệnh đường hô hấp do virus.", "statements": ["a) Đeo khẩu trang giúp giảm lây nhiễm qua giọt bắn.", "b) Rửa tay bằng xà phòng giúp loại bỏ virus trên tay.", "c) Thông thoáng phòng ở giúp giảm nồng độ virus trong không khí.", "d) Chỉ cần uống thuốc bổ là không cần biện pháp nào khác."], "answer": ["T", "T", "T", "F"], "explain": "Phòng bệnh hô hấp cần kết hợp khẩu trang, rửa tay, thông gió và tiêm vắc-xin.", "points": 1}, {"type": "short", "level": "NB", "q": "HIV phá hủy chủ yếu bộ phận nào của cơ thể?", "answer": "Hệ miễn dịch (tế bào miễn dịch)", "explain": "HIV tấn công tế bào miễn dịch làm cơ thể suy giảm khả năng chống bệnh.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Chế phẩm sinh học tiêm vào cơ thể để tạo miễn dịch phòng bệnh được gọi là gì?", "answer": "Vắc-xin", "explain": "Vắc-xin giúp cơ thể tạo miễn dịch chủ động phòng bệnh.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Vì sao bệnh do virus gây ra thường khó điều trị hơn bệnh do vi khuẩn?", "options": ["A. Vì virus quá lớn", "B. Vì virus sống kí sinh bên trong tế bào, thuốc khó tác động mà không hại tế bào chủ", "C. Vì virus không gây triệu chứng", "D. Vì virus chỉ có ở động vật"], "answer": "B", "explain": "Virus ẩn trong tế bào chủ và dùng bộ máy của tế bào để nhân lên nên việc dùng thuốc diệt virus mà không hại tế bào rất khó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc rửa tay bằng xà phòng thường xuyên có ý nghĩa gì trong phòng bệnh virus?", "options": ["A. Không có ý nghĩa", "B. Loại bỏ virus bám trên tay, giảm nguy cơ đưa virus vào cơ thể qua miệng, mũi", "C. Làm tay đẹp hơn", "D. Thay thế được tiêm vắc-xin"], "answer": "B", "explain": "Rửa tay đúng cách giúp loại bỏ virus trên tay, là biện pháp đơn giản mà hiệu quả để phòng nhiều bệnh truyền nhiễm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Virus cúm thường gây bệnh theo mùa nào ở nước ta?", "options": ["A. Chỉ mùa hè", "B. Mùa đông - xuân, thời tiết lạnh", "C. Chỉ mùa mưa", "D. Quanh năm không theo mùa"], "answer": "B", "explain": "Cúm thường bùng phát vào mùa đông - xuân khi thời tiết lạnh, virus dễ lây lan qua đường hô hấp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đeo khẩu trang khi đến nơi đông người trong mùa dịch giúp ích gì?", "options": ["A. Chắn bụi là chính, không liên quan virus", "B. Giảm hít phải giọt bắn chứa virus và giảm phát tán virus ra ngoài", "C. Làm ấm cổ họng", "D. Thay thế việc rửa tay"], "answer": "B", "explain": "Khẩu trang giúp ngăn giọt bắn chứa virus từ người bệnh và bảo vệ người khỏe khi tiếp xúc gần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Virus SARS-CoV-2 gây ra bệnh nào?", "options": ["A. Bệnh cúm mùa thông thường", "B. Bệnh COVID-19", "C. Bệnh sởi", "D. Bệnh đậu mùa"], "answer": "B", "explain": "SARS-CoV-2 là virus corona gây đại dịch COVID-19, lây chủ yếu qua đường hô hấp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bệnh thủy đậu (trái rạ) ở trẻ em do tác nhân nào gây ra?", "options": ["A. Vi khuẩn", "B. Virus", "C. Nấm", "D. Trùng roi"], "answer": "B", "explain": "Thủy đậu do virus Varicella zoster gây ra, thường gặp ở trẻ em và có thể phòng bằng vắc-xin.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về virus HIV.", "statements": ["a) HIV tấn công hệ miễn dịch của cơ thể.", "b) HIV lây qua muỗi đốt.", "c) Người nhiễm HIV cần được đối xử bình thường, không kì thị.", "d) Dùng chung bơm kim tiêm có nguy cơ lây HIV."], "answer": ["T", "F", "T", "T"], "explain": "HIV không lây qua muỗi đốt hay tiếp xúc thông thường; cần phòng tránh qua đường máu và không kì thị người bệnh.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về lợi ích của virus.", "statements": ["a) Virus chỉ gây hại, không có lợi ích nào.", "b) Virus được dùng để sản xuất vắc-xin.", "c) Thể thực khuẩn là virus kí sinh trên vi khuẩn.", "d) Virus được nghiên cứu làm thể truyền gen trong công nghệ sinh học."], "answer": ["F", "T", "T", "T"], "explain": "Ngoài gây bệnh, virus còn có ứng dụng trong y học và công nghệ sinh học.", "points": 1}, {"type": "short", "level": "NB", "q": "Virus gây bệnh COVID-19 có tên là gì?", "answer": "SARS-CoV-2", "explain": "SARS-CoV-2 là virus corona gây đại dịch COVID-19.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Virus ăn vi khuẩn (kí sinh trên vi khuẩn) được gọi là gì?", "answer": "Thể thực khuẩn", "explain": "Thể thực khuẩn là virus kí sinh trong tế bào vi khuẩn.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "VD", "q": "Khi một người đã tiêm đủ vắc-xin phòng một bệnh virus, điều đó có nghĩa là gì?", "options": ["A. Người đó không bao giờ ốm nữa", "B. Cơ thể đã có miễn dịch, nếu virus xâm nhập sẽ chống lại tốt hơn, bệnh nhẹ hơn hoặc không mắc", "C. Người đó sẽ lây bệnh cho người khác", "D. Vắc-xin chứa virus sống mạnh gây bệnh"], "answer": "B", "explain": "Tiêm vắc-xin tạo miễn dịch chủ động, giúp cơ thể phòng bệnh hiệu quả và giảm mức độ nặng nếu mắc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao virus không được xếp vào một giới sinh vật nào trong hệ thống năm giới?", "options": ["A. Vì virus quá nhỏ", "B. Vì virus chưa có cấu tạo tế bào, chỉ sống kí sinh trong tế bào sống", "C. Vì virus không gây bệnh", "D. Vì virus chỉ có ở người"], "answer": "B", "explain": "Hệ thống năm giới phân loại dựa trên cấu tạo tế bào; virus chưa có tế bào nên không thuộc giới nào.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quan sát dưới kính hiển vi điện tử, virus khảm thuốc lá có hình dạng gì?", "options": ["A. Hình cầu", "B. Hình que (hình trụ)", "C. Hình xoắn ốc", "D. Hình ngôi sao"], "answer": "B", "explain": "Virus khảm thuốc lá là virus đầu tiên được phát hiện, có dạng hình que.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Muỗi là vật trung gian truyền virus gây bệnh nào sau đây?", "options": ["A. Viêm gan B", "B. Sốt xuất huyết", "C. Dại", "D. Sởi"], "answer": "B", "explain": "Muỗi vằn truyền virus Dengue gây bệnh sốt xuất huyết.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Để phòng bệnh viêm gan B, biện pháp hiệu quả nhất hiện nay là gì?", "options": ["A. Ăn chín uống sôi", "B. Tiêm vắc-xin phòng viêm gan B", "C. Đeo khẩu trang", "D. Ngủ màn"], "answer": "B", "explain": "Viêm gan B lây qua đường máu; tiêm vắc-xin là biện pháp phòng bệnh chủ động, hiệu quả nhất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hành động nào sau đây có nguy cơ lây nhiễm HIV?", "options": ["A. Bắt tay, ôm người nhiễm HIV", "B. Dùng chung bơm kim tiêm với người khác", "C. Ăn cơm cùng mâm", "D. Bị muỗi đốt"], "answer": "B", "explain": "Dùng chung bơm kim tiêm có dính máu là con đường lây HIV; các tiếp xúc thông thường và muỗi đốt không lây HIV.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về quá trình nhân lên của virus.", "statements": ["a) Virus đưa vật chất di truyền vào tế bào chủ.", "b) Virus mới được tạo thành nhờ bộ máy của tế bào chủ.", "c) Virus con phá vỡ tế bào chủ để thoát ra ngoài.", "d) Virus tự tổng hợp protein bằng ribôxôm của chính mình."], "answer": ["T", "T", "T", "F"], "explain": "Virus không có ribôxôm riêng, phải nhờ ribôxôm và bộ máy của tế bào chủ để tổng hợp protein.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về phòng bệnh sốt xuất huyết.", "statements": ["a) Đậy kín chum, vại chứa nước giúp ngăn muỗi đẻ trứng.", "b) Ngủ màn giúp tránh muỗi đốt.", "c) Để nước đọng trong lốp xe, chậu hoa là an toàn.", "d) Diệt bọ gậy là biện pháp phòng sốt xuất huyết."], "answer": ["T", "T", "F", "T"], "explain": "Nước đọng là nơi muỗi vằn đẻ trứng, sinh bọ gậy nên phải loại bỏ.", "points": 1}, {"type": "short", "level": "NB", "q": "Khi bị chó nghi dại cắn, trước hết cần rửa vết thương bằng gì?", "answer": "Nước và xà phòng (dưới vòi nước chảy)", "explain": "Rửa kĩ vết thương bằng xà phòng dưới vòi nước rồi đến cơ sở y tế ngay.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Kháng sinh có diệt được virus không?", "answer": "Không", "explain": "Kháng sinh chỉ diệt vi khuẩn, không có tác dụng với virus.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Khi ho hoặc hắt hơi, ta nên làm gì để giảm lây lan virus cho người khác?", "options": ["A. Ho thoải mái không che", "B. Che miệng bằng khuỷu tay hoặc khăn giấy, sau đó rửa tay", "C. Ngoảnh mặt đi là đủ", "D. Giữ hơi thở càng lâu càng tốt"], "answer": "B", "explain": "Che miệng khi ho, hắt hơi và rửa tay giúp hạn chế giọt bắn chứa virus phát tán.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Virus khác vi khuẩn ở điểm cơ bản nào?", "options": ["A. Virus có tế bào, vi khuẩn không có tế bào", "B. Virus chưa có cấu tạo tế bào, vi khuẩn là sinh vật đơn bào có tế bào", "C. Virus lớn hơn vi khuẩn", "D. Virus tự dưỡng, vi khuẩn dị dưỡng"], "answer": "B", "explain": "Vi khuẩn là cơ thể đơn bào hoàn chỉnh; virus chỉ là hạt gồm vỏ protein và vật chất di truyền, chưa phải tế bào.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong y học, virus còn được nghiên cứu để làm gì?", "options": ["A. Làm thuốc trừ sâu hóa học", "B. Đưa gen vào tế bào trong công nghệ gen và trị liệu", "C. Làm phân bón", "D. Làm vật liệu xây dựng"], "answer": "B", "explain": "Virus được dùng làm thể truyền (vector) đưa gen vào tế bào trong công nghệ sinh học hiện đại.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Bệnh sởi ở trẻ em có thể phòng hiệu quả bằng cách nào?", "options": ["A. Uống nhiều nước", "B. Tiêm vắc-xin phòng sởi theo lịch tiêm chủng", "C. Đắp lá thuốc", "D. Cho trẻ nghỉ học dài hạn"], "answer": "B", "explain": "Sởi là bệnh do virus, phòng hiệu quả nhất bằng tiêm vắc-xin đúng lịch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi có dịch bệnh do virus lây qua hô hấp, việc mở cửa thông thoáng phòng học có ý nghĩa gì?", "options": ["A. Không có ý nghĩa", "B. Giúp không khí lưu thông, giảm nồng độ virus trong phòng", "C. Làm virus sinh sản nhanh hơn", "D. Chỉ để cho mát"], "answer": "B", "explain": "Thông gió tốt giúp giảm mật độ giọt bắn và virus lơ lửng trong không khí kín.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên tự ý dùng kháng sinh khi bị cảm cúm thông thường?", "options": ["A. Vì kháng sinh rất đắt", "B. Vì cảm cúm do virus, kháng sinh không diệt được virus mà còn gây hại (kháng thuốc, tác dụng phụ)", "C. Vì kháng sinh làm virus mạnh lên ngay", "D. Vì bác sĩ không cho phép mua"], "answer": "B", "explain": "Cảm cúm do virus nên kháng sinh không có tác dụng; lạm dụng kháng sinh gây kháng thuốc và nhiều tác dụng phụ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về bệnh dại.", "statements": ["a) Virus dại có trong nước bọt của động vật mắc bệnh.", "b) Bị chó dại cắn chỉ cần rửa qua loa là đủ.", "c) Bệnh dại khi đã phát bệnh thì rất nguy hiểm, tỉ lệ tử vong cao.", "d) Tiêm phòng dại cho chó, mèo giúp phòng bệnh cho người."], "answer": ["T", "F", "T", "T"], "explain": "Bị chó nghi dại cắn phải rửa kĩ vết thương bằng xà phòng và đến cơ sở y tế ngay.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định so sánh virus và vi khuẩn.", "statements": ["a) Vi khuẩn là sinh vật đơn bào, virus chưa có cấu tạo tế bào.", "b) Virus lớn hơn vi khuẩn.", "c) Vi khuẩn có thể tự sinh sản bằng phân đôi.", "d) Cả virus và vi khuẩn đều có thể gây bệnh cho người."], "answer": ["T", "F", "T", "T"], "explain": "Vi khuẩn là tế bào hoàn chỉnh, tự phân đôi; virus nhỏ hơn và chưa có cấu tạo tế bào.", "points": 1}, {"type": "short", "level": "NB", "q": "Virus khảm thuốc lá có hình dạng gì?", "answer": "Hình que (hình trụ)", "explain": "Virus khảm thuốc lá là virus dạng hình que đầu tiên được phát hiện.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Bệnh viêm gan B lây chủ yếu qua con đường nào?", "answer": "Đường máu (và dịch cơ thể)", "explain": "Virus viêm gan B lây qua máu, kim tiêm chung, dao cạo, từ mẹ sang con.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Vật chất di truyền của virus cúm là gì?", "options": ["A. ADN", "B. ARN", "C. Protein", "D. Lipit"], "answer": "B", "explain": "Virus cúm thuộc nhóm virus có vật chất di truyền là ARN.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một số virus có thêm lớp vỏ ngoài bao bọc capsit, lớp vỏ này có nguồn gốc từ đâu?", "options": ["A. Do virus tự tổng hợp từ không khí", "B. Từ màng của tế bào chủ khi virus thoát ra", "C. Từ vỏ vi khuẩn", "D. Từ môi trường nước"], "answer": "B", "explain": "Nhiều virus (như virus cúm, HIV) có vỏ ngoài bắt nguồn từ màng sinh chất của tế bào chủ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi chăm sóc người bệnh cúm tại nhà, người chăm sóc nên làm gì để tránh lây nhiễm?", "options": ["A. Không cần biện pháp gì", "B. Đeo khẩu trang khi tiếp xúc, rửa tay sau khi chăm sóc, để phòng bệnh nhân thông thoáng", "C. Ngủ chung giường cho tiện chăm sóc", "D. Dùng chung khăn mặt với người bệnh"], "answer": "B", "explain": "Người chăm sóc cần tự bảo vệ bằng khẩu trang, vệ sinh tay và giữ phòng thông thoáng để giảm lây nhiễm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp nào sau đây KHÔNG giúp phòng bệnh do virus lây qua đường tiêu hóa (ví dụ viêm gan A)?", "options": ["A. Ăn chín, uống sôi", "B. Rửa tay trước khi ăn", "C. Ăn rau sống rửa qua loa, uống nước lã", "D. Dùng nguồn nước sạch"], "answer": "C", "explain": "Ăn uống không vệ sinh là nguy cơ lây bệnh, không phải biện pháp phòng bệnh đường tiêu hóa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tiêm phòng vắc-xin dại sau khi bị chó cắn được gọi là phòng bệnh như thế nào?", "options": ["A. Phòng bệnh trước khi phơi nhiễm cho mọi người", "B. Tiêm phòng sau phơi nhiễm, cần thực hiện càng sớm càng tốt", "C. Không cần thiết nếu vết cắn nhỏ", "D. Chỉ tiêm khi đã phát bệnh"], "answer": "B", "explain": "Sau khi bị động vật nghi dại cắn, phải tiêm vắc-xin phòng dại càng sớm càng tốt, trước khi virus tấn công hệ thần kinh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi phát hiện bạn học bị thủy đậu, việc nên làm là gì?", "options": ["A. Cho bạn nghỉ học, cách li và báo cho gia đình, nhà trường", "B. Vẫn chơi chung bình thường", "C. Chia sẻ khăn mặt với bạn", "D. Không cần làm gì"], "answer": "A", "explain": "Thủy đậu lây lan nhanh qua tiếp xúc và hô hấp, cần cho học sinh nghỉ học, cách li đến khi khỏi.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về phòng bệnh do virus lây qua tiêu hóa.", "statements": ["a) Ăn chín, uống sôi giúp phòng bệnh viêm gan A.", "b) Rửa tay trước khi ăn là không cần thiết.", "c) Dùng nước sạch trong sinh hoạt giúp giảm nguy cơ mắc bệnh.", "d) Ăn hàng quán mất vệ sinh làm tăng nguy cơ nhiễm bệnh."], "answer": ["T", "F", "T", "T"], "explain": "Bệnh đường tiêu hóa phòng bằng vệ sinh ăn uống; rửa tay trước khi ăn rất quan trọng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về bệnh thủy đậu và sởi.", "statements": ["a) Thủy đậu do virus gây ra.", "b) Sởi có thể phòng bằng tiêm vắc-xin.", "c) Thủy đậu chỉ lây cho người lớn.", "d) Học sinh mắc thủy đậu nên nghỉ học để tránh lây cho bạn."], "answer": ["T", "T", "F", "T"], "explain": "Thủy đậu thường gặp ở trẻ em và lây lan nhanh, cần nghỉ học, cách li khi mắc.", "points": 1}, {"type": "short", "level": "NB", "q": "Để phòng sốt xuất huyết, cần tiêu diệt giai đoạn nào của muỗi trong nước đọng?", "answer": "Bọ gậy (lăng quăng)", "explain": "Diệt bọ gậy trong các dụng cụ chứa nước giúp cắt vòng đời của muỗi vằn.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Virus đưa thành phần nào của mình vào tế bào chủ để nhân lên?", "answer": "Vật chất di truyền", "explain": "Virus đưa ADN hoặc ARN của mình vào tế bào chủ và nhờ tế bào tạo virus mới.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Virus có thể tồn tại ở trạng thái nào khi ở ngoài tế bào sống?", "options": ["A. Sinh trưởng và phát triển bình thường", "B. Ở dạng hạt vô sinh, không hoạt động sống", "C. Di chuyển tự do như vi khuẩn", "D. Quang hợp"], "answer": "B", "explain": "Ngoài tế bào, virus chỉ là hạt vật chất không có hoạt động sống, chỉ “sống dậy” khi xâm nhập tế bào chủ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để giảm nguy cơ mắc bệnh do virus trong mùa dịch, học sinh nên làm gì?", "options": ["A. Giữ vệ sinh cá nhân, ăn uống đủ chất, ngủ đủ giấc, tiêm phòng đầy đủ", "B. Thức khuya chơi điện thoại", "C. Bỏ bữa sáng thường xuyên", "D. Không rửa tay trước khi ăn"], "answer": "A", "explain": "Sức đề kháng tốt nhờ ăn uống, nghỉ ngơi hợp lí cùng vệ sinh và tiêm phòng giúp phòng bệnh hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bệnh bại liệt ở trẻ em do virus gây ra đã được thanh toán ở nhiều nơi nhờ biện pháp nào?", "options": ["A. Dùng kháng sinh diện rộng", "B. Uống vắc-xin phòng bại liệt cho trẻ em theo chương trình tiêm chủng mở rộng", "C. Cách li toàn bộ trẻ em", "D. Đun sôi nước uống"], "answer": "B", "explain": "Vắc-xin bại liệt trong chương trình tiêm chủng mở rộng đã giúp thanh toán bệnh bại liệt ở Việt Nam và nhiều nước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Virus gây bệnh cho cây trồng, ví dụ nào sau đây đúng?", "options": ["A. Virus khảm thuốc lá làm lá cây thuốc lá bị đốm khảm", "B. Virus làm cây lớn nhanh hơn", "C. Virus giúp cây ra hoa sớm", "D. Virus không gây bệnh cho cây"], "answer": "A", "explain": "Virus khảm thuốc lá là virus gây bệnh cho thực vật đầu tiên được con người phát hiện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cúm gia cầm (H5N1...) do virus gây bệnh chủ yếu ở đối tượng nào?", "options": ["A. Cá", "B. Gia cầm như gà, vịt và có thể lây sang người", "C. Cây trồng", "D. Gia súc lớn như trâu bò là chính"], "answer": "B", "explain": "Virus cúm gia cầm gây bệnh ở gà, vịt và có khả năng lây sang người khi tiếp xúc gần với gia cầm bệnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi có gia cầm chết hàng loạt không rõ nguyên nhân, việc nên làm là gì?", "options": ["A. Đem bán ngay ra chợ", "B. Không tự ý giết mổ, ăn thịt; báo cho cán bộ thú y địa phương xử lí", "C. Chôn qua loa sau vườn rồi thôi", "D. Mang cho hàng xóm"], "answer": "B", "explain": "Gia cầm chết bất thường có thể do dịch bệnh nguy hiểm như cúm gia cầm; phải báo thú y và không ăn, không bán.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về virus corona gây bệnh COVID-19.", "statements": ["a) SARS-CoV-2 lây chủ yếu qua đường hô hấp.", "b) Rửa tay, đeo khẩu trang giúp phòng COVID-19.", "c) COVID-19 do vi khuẩn gây ra.", "d) Tiêm vắc-xin giúp giảm nguy cơ mắc bệnh nặng do COVID-19."], "answer": ["T", "T", "F", "T"], "explain": "COVID-19 do virus SARS-CoV-2 gây ra, không phải vi khuẩn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về vệ sinh cá nhân phòng bệnh virus.", "statements": ["a) Rửa tay sau khi đi vệ sinh và trước khi ăn giúp phòng bệnh.", "b) Dùng chung khăn mặt, bàn chải với người bệnh là an toàn.", "c) Che miệng khi ho giúp giảm phát tán giọt bắn.", "d) Giữ nhà ở sạch sẽ, thoáng mát giúp hạn chế mầm bệnh."], "answer": ["T", "F", "T", "T"], "explain": "Không nên dùng chung đồ cá nhân với người khác vì dễ lây truyền mầm bệnh.", "points": 1}, {"type": "short", "level": "NB", "q": "Thủy đậu ở trẻ em do tác nhân nào gây ra?", "answer": "Virus", "explain": "Thủy đậu do virus Varicella zoster gây ra.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Đeo khẩu trang và rửa tay giúp phòng các bệnh virus lây qua đường nào là chủ yếu?", "answer": "Đường hô hấp", "explain": "Các biện pháp này ngăn giọt bắn chứa virus lây qua đường hô hấp.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VD", "q": "Virus được phát hiện lần đầu tiên từ bệnh của cây nào?", "options": ["A. Cây lúa", "B. Cây thuốc lá (bệnh khảm thuốc lá)", "C. Cây ngô", "D. Cây cà chua"], "answer": "B", "explain": "Cuối thế kỉ XIX, các nhà khoa học phát hiện tác nhân gây bệnh khảm ở cây thuốc lá nhỏ hơn vi khuẩn — đó là virus đầu tiên được biết đến.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao vắc-xin phòng cúm thường phải tiêm nhắc lại hằng năm?", "options": ["A. Vì vắc-xin hết hạn rất nhanh trong cơ thể", "B. Vì virus cúm biến đổi liên tục, xuất hiện các chủng mới", "C. Vì cơ thể quên miễn dịch sau đúng một năm", "D. Vì nhà sản xuất khuyến cáo thương mại"], "answer": "B", "explain": "Virus cúm thay đổi vật chất di truyền nhanh nên vắc-xin phải cập nhật theo chủng lưu hành mỗi năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giữ khoảng cách, hạn chế tụ tập đông người khi có dịch bệnh hô hấp giúp ích gì?", "options": ["A. Không có tác dụng", "B. Giảm cơ hội giọt bắn chứa virus truyền từ người bệnh sang người khỏe", "C. Làm virus chết ngoài không khí ngay", "D. Thay thế hoàn toàn vắc-xin"], "answer": "B", "explain": "Giữ khoảng cách làm giảm tiếp xúc với giọt bắn, một biện pháp quan trọng cùng với khẩu trang và rửa tay.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bệnh viêm não Nhật Bản do virus và lây qua vật trung gian nào?", "options": ["A. Muỗi", "B. Ruồi", "C. Ve chó", "D. Ốc sên"], "answer": "A", "explain": "Virus viêm não Nhật Bản do muỗi truyền, thường gặp ở vùng nông thôn có chăn nuôi lợn và ruộng nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Để phòng viêm não Nhật Bản, biện pháp hiệu quả cho trẻ em là gì?", "options": ["A. Uống thuốc kháng sinh dự phòng", "B. Tiêm vắc-xin viêm não Nhật Bản theo lịch tiêm chủng", "C. Ngủ ngoài trời thoáng mát", "D. Ăn nhiều tỏi"], "answer": "B", "explain": "Viêm não Nhật Bản có vắc-xin phòng hiệu quả, được tiêm cho trẻ theo chương trình tiêm chủng mở rộng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một đặc điểm chung của các bệnh do virus gây ra là gì?", "options": ["A. Đều chữa khỏi bằng kháng sinh", "B. Thường lây lan nhanh và chưa có thuốc đặc trị cho nhiều bệnh, nên phòng bệnh rất quan trọng", "C. Chỉ xảy ra ở người già", "D. Không bao giờ nguy hiểm"], "answer": "B", "explain": "Nhiều bệnh virus chưa có thuốc đặc trị; tiêm vắc-xin và vệ sinh phòng bệnh là biện pháp chính.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về virus ở thực vật và động vật.", "statements": ["a) Virus chỉ gây bệnh cho người.", "b) Virus khảm thuốc lá gây bệnh cho cây thuốc lá.", "c) Virus có thể gây bệnh cho vật nuôi như cúm gia cầm.", "d) Virus lở mồm long móng gây bệnh ở trâu, bò."], "answer": ["F", "T", "T", "T"], "explain": "Virus gây bệnh cho cả người, động vật và thực vật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về tiêm chủng.", "statements": ["a) Tiêm chủng đầy đủ giúp bảo vệ cả cộng đồng.", "b) Vắc-xin bại liệt đã giúp thanh toán bệnh bại liệt ở Việt Nam.", "c) Chỉ người bệnh mới cần tiêm vắc-xin.", "d) Sau tiêm vắc-xin, cơ thể cần thời gian để tạo miễn dịch."], "answer": ["T", "T", "F", "T"], "explain": "Vắc-xin tiêm cho người khỏe để phòng bệnh; miễn dịch hình thành sau một thời gian.", "points": 1}, {"type": "short", "level": "NB", "q": "Ngoài tế bào sống, virus tồn tại ở trạng thái nào?", "answer": "Hạt vô sinh (không có hoạt động sống)", "explain": "Ngoài tế bào, virus chỉ là hạt vật chất không hoạt động sống.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Bệnh bại liệt ở trẻ em được phòng bằng cách nào trong chương trình tiêm chủng?", "answer": "Uống (tiêm) vắc-xin phòng bại liệt", "explain": "Vắc-xin bại liệt đã giúp thanh toán căn bệnh này ở Việt Nam.", "points": 0.5}]}]}</script>
