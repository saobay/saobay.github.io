o người lớn biết"], "answer": "D", "explain": "Không một cơ quan, ngân hàng nào yêu cầu gửi mã OTP qua tin nhắn để nhận thưởng; đây là thủ đoạn lừa đảo phổ biến.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi bị bắt nạt hoặc bị lôi kéo làm việc xấu trên mạng, việc đầu tiên em nên làm là:", "options": ["A. Báo cho cha mẹ, thầy cô hoặc người lớn mà em tin cậy", "B. Tự đi gặp người đó để giải quyết", "C. Giấu kín, không nói với ai", "D. Bắt nạt lại người đó trên mạng"], "answer": "A", "explain": "Người lớn sẽ giúp em xử lí đúng cách và bảo vệ em; tự giải quyết một mình có thể gây nguy hiểm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận được thư điện tử từ người lạ có tệp đính kèm, em nên xử lí thế nào?", "options": ["A. Mở ngay tệp đính kèm để xem", "B. Không mở tệp lạ, nên xóa thư hoặc hỏi ý kiến người lớn", "C. Tải tệp về rồi chia sẻ cho bạn bè", "D. Trả lời thư để cảm ơn người gửi"], "answer": "B", "explain": "Tệp đính kèm từ người lạ có thể chứa virus hoặc phần mềm độc hại, tuyệt đối không tùy tiện mở.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi nào sau đây thể hiện tôn trọng bản quyền trên Internet?", "options": ["A. Sao chép bài làm của bạn rồi nộp như của mình", "B. Tải và sử dụng phần mềm bẻ khóa", "C. Khi dùng hình ảnh, tài liệu của người khác thì ghi rõ nguồn và chỉ dùng khi được phép", "D. Phát tán bộ phim chưa được công chiếu"], "answer": "C", "explain": "Tôn trọng bản quyền nghĩa là không sao chép, phát tán sản phẩm của người khác khi chưa được phép và ghi nguồn khi sử dụng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phần mềm nào giúp bảo vệ máy tính khỏi virus và phần mềm độc hại?", "options": ["A. Phần mềm diệt virus", "B. Phần mềm soạn thảo văn bản", "C. Trình duyệt web", "D. Phần mềm vẽ tranh"], "answer": "A", "explain": "Phần mềm diệt virus giúp phát hiện, ngăn chặn và loại bỏ virus, phần mềm độc hại khỏi máy tính.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người quen qua mạng xã hội rủ em đi gặp riêng ở nơi vắng và dặn không được nói với ai. Em nên:", "options": ["A. Đi gặp một mình cho bí mật", "B. Rủ thêm bạn đi gặp mà không báo người lớn", "C. Cho người đó địa chỉ nhà để tiện đón", "D. Từ chối, không gặp riêng người lạ quen qua mạng và nói với cha mẹ"], "answer": "D", "explain": "Tuyệt đối không gặp riêng người lạ quen qua mạng; hãy từ chối và thông báo cho cha mẹ, thầy cô để được bảo vệ.", "points": 0.25}]}]}
