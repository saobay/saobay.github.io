: "mcq", "level": "TH", "q": "Khi muốn tìm hình ảnh về một chủ đề trong trang kết quả tìm kiếm, em chọn thẻ nào?", "options": ["A. Thẻ Bản đồ", "B. Thẻ Tin tức", "C. Thẻ Video", "D. Thẻ Hình ảnh"], "answer": "D", "explain": "Trang kết quả tìm kiếm có các thẻ Web, Hình ảnh, Video, Bản đồ, Tin tức; chọn thẻ Hình ảnh để chỉ xem kết quả là hình ảnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kết quả mà máy tìm kiếm trả về thường là:", "options": ["A. Một tệp văn bản duy nhất", "B. Chỉ một địa chỉ thư điện tử", "C. Danh sách các liên kết đến trang web, hình ảnh, video có liên quan", "D. Các phần mềm bắt buộc phải cài đặt"], "answer": "C", "explain": "Máy tìm kiếm trả về một danh sách các liên kết liên quan đến từ khóa để người dùng lựa chọn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn An gõ từ khóa “thời tiết” và nhận được hàng triệu kết quả, rất khó lựa chọn. An chỉ muốn xem thời tiết của Hà Nội vào ngày mai. An nên làm gì?", "options": ["A. Tìm lại nhiều lần với đúng từ khóa “thời tiết”", "B. Chọn luôn kết quả đầu tiên bất kể nội dung", "C. Bỏ qua, không tìm kiếm nữa", "D. Dùng từ khóa cụ thể hơn, ví dụ “thời tiết Hà Nội ngày mai”"], "answer": "D", "explain": "Từ khóa càng cụ thể, sát với nhu cầu thì kết quả càng ít và chính xác hơn, dễ lựa chọn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi tìm thông tin trên Internet để làm bài tập, em nên ưu tiên nguồn nào sau đây?", "options": ["A. Trang web của trường học, thư viện hoặc báo chí uy tín", "B. Một bình luận bất kì trên mạng xã hội", "C. Trang không rõ nguồn gốc, không ghi tác giả", "D. Tin nhắn chia sẻ chưa được kiểm chứng"], "answer": "A", "explain": "Nguồn tin từ cơ quan, trường học, thư viện, báo chí uy tín có độ tin cậy cao hơn các nguồn không rõ nguồn gốc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào đúng về thông tin trên Internet?", "options": ["A. Mọi thông tin trên Internet đều chính xác", "B. Thông tin nào xuất hiện đầu tiên trong kết quả c
