.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để tạo bảng thời khóa biểu trong văn bản, em cần chỉ định:", "options": ["A. Màu sắc của bảng", "B. Số hàng và số cột của bảng", "C. Phông chữ của máy tính", "D. Tên tệp văn bản"], "answer": "B", "explain": "Khi tạo bảng, thông tin bắt buộc phải chỉ định là số hàng và số cột của bảng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sau khi soạn thảo xong văn bản, việc quan trọng cần làm là:", "options": ["A. Xóa văn bản đi", "B. Lưu tệp văn bản lại", "C. Tắt màn hình", "D. Rút điện máy tính"], "answer": "B", "explain": "Sau khi soạn thảo, cần lưu tệp văn bản lại để không bị mất nội dung đã làm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn tiêu đề bài viết nằm giữa trang, em dùng kiểu căn lề nào?", "options": ["A. Căn lề trái", "B. Căn lề phải", "C. Căn giữa", "D. Căn đều hai bên"], "answer": "C", "explain": "Muốn tiêu đề nằm giữa trang, em dùng lệnh căn giữa (Center).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một văn bản được trình bày đẹp cần có:", "options": ["A. Thật nhiều màu sắc và phông chữ khác nhau", "B. Tiêu đề rõ ràng, định dạng thống nhất, hình ảnh và bảng phù hợp nội dung", "C. Chữ càng to càng tốt", "D. Không cần định dạng gì cả"], "answer": "B", "explain": "Văn bản đẹp cần tiêu đề rõ ràng, định dạng thống nhất và hình ảnh, bảng minh họa phù hợp với nội dung.", "points": 0.25}]}]}
