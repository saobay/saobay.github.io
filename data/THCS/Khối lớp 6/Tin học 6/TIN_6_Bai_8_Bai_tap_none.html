ười nhận", "B. Đính kèm tệp vào thư", "C. Ghi tóm tắt nội dung chính của thư", "D. Trang trí cho thư"], "answer": "C", "explain": "Ô Chủ đề ghi ngắn gọn nội dung chính để người nhận nắm được thư viết về việc gì.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để bắt đầu sử dụng thư điện tử, việc đầu tiên em cần làm là:", "options": ["A. Mua một chiếc máy in", "B. Đăng ký tài khoản với một nhà cung cấp dịch vụ thư điện tử", "C. Cài đặt một trò chơi trực tuyến", "D. Tạo một trang web riêng"], "answer": "B", "explain": "Phải đăng ký tài khoản (hộp thư) với nhà cung cấp như Gmail, Outlook thì mới gửi và nhận thư được.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn Nam muốn gửi bài tập cho cô giáo qua thư điện tử. Thứ tự thao tác nào là đúng?", "options": ["A. Bấm nút Gửi rồi mới viết nội dung thư", "B. Nhập địa chỉ thư của chính mình vào ô người nhận", "C. Chỉ viết nội dung, không cần địa chỉ người nhận", "D. Đăng nhập → Soạn thư → nhập địa chỉ của cô giáo, chủ đề, nội dung, đính kèm tệp bài tập → Gửi"], "answer": "D", "explain": "Quy trình gửi thư: đăng nhập, soạn thư, điền đầy đủ địa chỉ người nhận – chủ đề – nội dung, đính kèm tệp rồi mới bấm Gửi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Em nhận được thư từ một địa chỉ lạ thông báo em đã “trúng thưởng” và yêu cầu cung cấp mật khẩu hộp thư để nhận thưởng. Em nên làm gì?", "options": ["A. Cung cấp mật khẩu ngay để nhận thưởng", "B. Chuyển tiếp thư cho nhiều bạn cùng biết", "C. Không làm theo, xóa thư và báo cho người lớn biết", "D. Trả lời thư để hỏi thêm thông tin"], "answer": "C", "explain": "Đây là thủ đoạn lừa đảo phổ biến; tuyệt đối không cung cấp mật khẩu cho bất kì ai và nên báo cho người lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu điểm của thư điện tử so với thư giấy là:", "options": ["A. Gửi nhanh, chi phí thấp, có thể đính kèm tệp và gửi cho nhiều người cùng lúc", "B. Không cần kết nối Internet vẫn gửi được", "C. Không bao giờ cần mật khẩu", "D. Chỉ gửi
