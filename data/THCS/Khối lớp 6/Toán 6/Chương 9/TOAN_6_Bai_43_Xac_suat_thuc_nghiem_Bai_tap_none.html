": ["A. 50/7", "B. 7/50", "C. 43/50", "D. 7/43"], "answer": "B", "explain": "Số lần xuất hiện mặt 4 chấm là 7, tổng số lần gieo là 50 nên xác suất thực nghiệm là 7/50."}, {"type": "mcq", "level": "TH", "q": "Viết phân số 7/50 dưới dạng số thập phân:", "options": ["A. 0,7", "B. 0,07", "C. 0,14", "D. 0,5"], "answer": "C", "explain": "7/50 = 0,14."}, {"type": "mcq", "level": "TH", "q": "Viết số thập phân 0,14 dưới dạng phần trăm:", "options": ["A. 1,4%", "B. 0,14%", "C. 140%", "D. 14%"], "answer": "D", "explain": "0,14 = 14%."}, {"type": "truefalse", "level": "VD", "q": "Bạn Hùng gieo một con xúc xắc 50 lần: mặt 4 chấm xuất hiện 7 lần, các mặt còn lại xuất hiện 43 lần. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Xác suất thực nghiệm xuất hiện mặt 4 chấm là 7/50.", "b) 7/50 = 0,14.", "c) 7/50 = 14%.", "d) Xác suất thực nghiệm không xuất hiện mặt 4 chấm là 7/43."], "answer": ["T", "T", "T", "F"], "explain": "Mặt 4 chấm xuất hiện 7 trong 50 lần nên a) đúng; 7/50 = 0,14 nên b) đúng; 0,14 = 14% nên c) đúng; phải lấy 43 chia cho 50 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Tung một đồng xu 100 lần: mặt sấp xuất hiện 48 lần, mặt ngửa xuất hiện 52 lần. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Xác suất thực nghiệm xuất hiện mặt sấp là 48/100 = 12/25.", "b) Xác suất thực nghiệm xuất hiện mặt ngửa là 52/100 = 13/25.", "c) 48/100 = 48%.", "d) Tổng hai xác suất thực nghiệm trên bằng 100."], "answer": ["T", "T", "T", "F"], "explain": "48/100 = 12/25 nên a) đúng; 52/100 = 13/25 nên b) đúng; 48/100 = 48% nên c) đúng; tổng hai xác suất bằng 1 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Gieo một con xúc xắc 60 lần, mặt 5 chấm xuất hiện 12 lần. Tính xác suất thực nghiệm của sự kiện “Xuất hiện mặt 5 chấm” (viết dưới dạng phần trăm).", "answer": "20%", "explain": "Xác suất thực nghiệm là 12/60 = 1/5 = 20%."}, {"type": "short", "level": "VDC", "q": "Lấy bóng từ hộp 80 lần (mỗi lần lấy xong bỏ lại vào hộp), 32 lần lấy được b n mặt ngửa là 13/17."], "answer": ["T", "T", "T", "F"], "explain": "Mặt ngửa xuất hiện 13 trong 30 lần nên a) đúng; mặt sấp xuất hiện 17 trong 30 lần nên b) đúng; 13/30 + 17/30 = 30/30 = 1 nên c) đúng; phải lấy 13 chia cho 30 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Bạn Lan gieo một con xúc xắc 120 lần, mặt 2 chấm xuất hiện 18 lần. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Tổng số lần gieo là 120.", "b) Xác suất thực nghiệm xuất hiện mặt 2 chấm là 18/120.", "c) 18/120 = 3/20 = 15%.", "d) Xác suất thực nghiệm xuất hiện mặt 2 chấm là 120/18."], "answer": ["T", "T", "T", "F"], "explain": "Tổng số lần gieo là 120 nên a) đúng; mặt 2 chấm xuất hiện 18 lần nên b) đúng; 18/120 = 3/20 = 15% nên c) đúng; phải lấy 18 chia cho 120 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Tung một đồng xu 200 lần, mặt sấp xuất hiện 98 lần. Tính xác suất thực nghiệm của sự kiện “Xuất hiện mặt sấp” (viết dưới dạng phần trăm).", "answer": "49%", "explain": "Xác suất thực nghiệm là 98/200 = 0,49 = 49%."}, {"type": "short", "level": "VDC", "q": "Quay một vòng quay 50 lần, mũi tên chỉ vào màu đỏ 15 lần. Tính xác suất thực nghiệm của sự kiện “Mũi tên chỉ vào màu đỏ” (viết dưới dạng số thập phân).", "answer": "0,3", "explain": "Xác suất thực nghiệm là 15/50 = 0,3."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Xác suất thực nghiệm cho biết:", "options": ["A. Khả năng xảy ra của sự kiện dựa trên kết quả thí nghiệm thực tế", "B. Kết quả đoán mò", "C. Thời tiết hôm thực hiện", "D. Tuổi của người thực hiện"], "answer": "A", "explain": "Xác suất thực nghiệm cho biết khả năng xảy ra của sự kiện dựa trên kết quả thí nghiệm thực tế."}, {"type": "mcq", "level": "NB", "q": "Gieo một con xúc xắc 20 lần, mặt 1 chấm xuất hiện 2 lần. Xác suất thực nghiệm của sự kiện “Xuất hiện mặt 1 chấm” là:", "options": ["A. 20/2", "B. 18/20", "C. 2/20", "D. 2/18"], "answer": "C", "explain": "Số lần xuất hiện mặt 1 chấm là 2, tổng số lần gieo là 20 nên xác suất thực nghiệm là 2/20."}, {"type": "mcq", "level": "NB", "q": "Rút gọn phân số 2/20 ta được:", "options": ["A. 2/10", "B. 1/20", "C. 2/5", "D. 1/10"], "answer": "D", "explain": "Chia cả tử và mẫu cho 2 ta được 2/20 = 1/10."}, {"type": "mcq", "level": "TH", "q": "Viết phân số 1/10 dưới dạng phần trăm:", "options": ["A. 1%", "B. 10%", "C. 110%", "D. 0,1%"], "answer": "B", "explain": "1/10 = 0,1 = 10%."}, {"type": "mcq", "level": "TH", "q": "Lấy bóng từ hộp 40 lần (mỗi lần lấy xong bỏ lại vào hộp), 16 lần lấy được bóng xanh. Xác suất thực nghiệm của sự kiện “Lấy được bóng xanh” là:", "options": ["A. 16/40", "B. 40/16", "C. 24/40", "D. 16/24"], "answer": "A", "explain": "Số lần lấy được bóng xanh là 16, tổng số lần lấy là 40 nên xác suất thực nghiệm là 16/40."}, {"type": "mcq", "level": "TH", "q": "Rút gọn phân số 16/40 ta được:", "options": ["A. 4/10", "B. 8/20", "C. 2/5", "D. 1/4"], "answer": "C", "explain": "Chia cả tử và mẫu cho 8 ta được 16/40 = 2/5."}, {"type": "truefalse", "level": "VD", "q": "Lấy bóng từ hộp 40 lần (mỗi lần lấy xong bỏ lại vào hộp): 16 lần được bóng xanh, 24 lần được bóng đỏ. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Xác suất thực nghiệm lấy được bóng xanh là 16/40 = 2/5.", "b) Xác suất thực nghiệm lấy được bóng đỏ là 24/40 = 3/5.", "c) 2/5 = 40%.", "d) 3/5 = 30%."], "answer": ["T", "T", "T", "F"], "explain": "16/40 = 2/5 nên a) đúng; 24/40 = 3/5 nên b) đúng; 2/5 = 40% nên c) đúng; 3/5 = 60% nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Gieo một con xúc xắc 20 lần, mặt 1 chấm xuất hiện 2 lần. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Xác suất thực nghiệm xuất hiện mặt 1 chấm là 2/20.", "b) 2/20 = 1/10 = 10%.", "c) Xác suất thực nghiệm không xuất hiện mặt 1 chấm là 18/20 = 9/10.", "d) Xác suất thực nghiệm xuất hiện mặt 1 chấm là 2/18."], "answer": ["T", "T", "T", "F"], "explain": "Mặt 1 chấm xuất hiện 2 trong 20 lần nên a) đúng; 2/20 = 1/10 = 10% nên b) đúng; 18/20 = 9/10 nên c) đúng; phả
