": "truefalse", "level": "VD", "q": "Biểu đồ cột kép “Số học sinh đạt điểm giỏi” (xanh: Nam, hồng: Nữ; đơn vị: bạn). Toán: Nam 8, Nữ 10; Văn: Nam 6, Nữ 9; Anh: Nam 7, Nữ 7. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Môn Toán có 18 bạn đạt điểm giỏi.", "b) Môn Văn có số bạn nữ nhiều hơn số bạn nam 3 bạn.", "c) Môn Anh hai cột cao bằng nhau.", "d) Cả 3 môn có 47 bạn đạt điểm giỏi."], "answer": ["T", "T", "T", "T"], "explain": "8 + 10 = 18 nên a) đúng; 9 − 6 = 3 nên b) đúng; cùng 7 bạn nên c) đúng; 18 + 15 + 14 = 47 nên d) đúng."}, {"type": "short", "level": "VDC", "q": "Với biểu đồ cột kép “Số cây hai lớp trồng được” (6A: 15, 20, 18 cây; 6B: 18, 16, 20 cây), hỏi cả 3 tháng lớp 6A trồng được bao nhiêu cây?", "answer": "53", "explain": "Tổng số cây lớp 6A trồng là 15 + 20 + 18 = 53 cây."}, {"type": "short", "level": "VDC", "q": "Với biểu đồ cột kép trên, hỏi cả 3 tháng lớp 6B trồng được bao nhiêu cây?", "answer": "54", "explain": "Tổng số cây lớp 6B trồng là 18 + 16 + 20 = 54 cây."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ cột kép khác biểu đồ cột đơn ở chỗ:", "options": ["A. Không có trục dọc", "B. Không có tên biểu đồ", "C. Có các nhóm hai cột để so sánh hai bộ số liệu", "D. Không vẽ được"], "answer": "C", "explain": "Biểu đồ cột kép có các nhóm hai cột để so sánh hai bộ số liệu."}, {"type": "mcq", "level": "NB", "q": "Để biết cột màu xanh thể hiện số liệu của đối tượng nào, ta đọc:", "options": ["A. Phần chú thích", "B. Tên trường", "C. Ngày tháng", "D. Đoán mò"], "answer": "A", "explain": "Phần chú thích cho biết mỗi màu ứng với đối tượng nào."}, {"type": "mcq", "level": "NB", "q": "Vẽ biểu đồ cột kép, trục ngang ghi:", "options": ["A. Số lượng", "B. Màu sắc", "C. Tên người vẽ", "D. Tên các nhóm (ví dụ các môn, các tháng)"], "answer": "D", "explain": "Trục ngang của biểu đồ cột kép ghi tên các nhóm."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột kép “Số điểm 10 hai tổ” (xanh: Tổ 1, hồng: Tổ 2). Tuần 1: T cột kép “Số điểm 10 hai tổ” (Tổ 1: 12, 15; Tổ 2: 10, 14), hỏi cả 2 tuần tổ 1 được bao nhiêu điểm 10?", "answer": "27", "explain": "Tổng số điểm 10 của tổ 1 là 12 + 15 = 27."}, {"type": "short", "level": "VDC", "q": "Với biểu đồ cột kép trên, hỏi cả 2 tuần hai tổ được bao nhiêu điểm 10?", "answer": "51", "explain": "Tổ 1 được 27 điểm 10, tổ 2 được 10 + 14 = 24 điểm 10. Tổng cộng 27 + 24 = 51."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ cột kép còn có thể hiểu là biểu đồ:", "options": ["A. Hình tròn", "B. Tranh vẽ", "C. Đường gấp khúc", "D. Cột đôi dùng để so sánh hai bộ số liệu"], "answer": "D", "explain": "Biểu đồ cột kép là biểu đồ cột đôi dùng để so sánh hai bộ số liệu."}, {"type": "mcq", "level": "NB", "q": "Trong biểu đồ cột kép, mỗi màu tượng trưng cho:", "options": ["A. Một tháng", "B. Một đối tượng (một bộ số liệu)", "C. Một con số", "D. Một địa điểm"], "answer": "B", "explain": "Trong biểu đồ cột kép, mỗi màu tượng trưng cho một đối tượng (một bộ số liệu)."}, {"type": "mcq", "level": "NB", "q": "Đọc biểu đồ cột kép, để tìm số liệu ta:", "options": ["A. Đoán mò", "B. Hỏi bạn bè", "C. Gióng cột cần tìm sang trục dọc để đọc giá trị", "D. Đọc tên trường"], "answer": "C", "explain": "Ta gióng cột cần tìm sang trục dọc để đọc giá trị."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột kép “Số học sinh giỏi hai lớp” (xanh: lớp 6A, hồng: lớp 6B; đơn vị: bạn). Môn Toán: 6A 8, 6B 10. Hỏi lớp 6A có bao nhiêu bạn giỏi Toán?", "options": ["A. 8 bạn", "B. 10 bạn", "C. 9 bạn", "D. 7 bạn"], "answer": "A", "explain": "Cột xanh của nhóm Toán gióng sang trục dọc được giá trị 8."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ cột kép trên (môn Anh: 6A 7, 6B 7), hai lớp có tất cả bao nhiêu bạn giỏi Anh?", "options": ["A. 7 bạn", "B. 10 bạn", "C. 12 bạn", "D. 14 bạn"], "answer": "D", "explain": "Tổng số bạn giỏi Anh là 7 + 7 = 14 bạn."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ cột kép trên (môn Văn: 6A 6, 6B 9), lớp 6B nhiều hơn cột kép thường dùng để so sánh hai nhóm đối tượng qua các thời điểm hoặc tiêu chí."}, {"type": "mcq", "level": "NB", "q": "Nếu quên đọc phần chú thích của biểu đồ cột kép, ta có thể:", "options": ["A. Vẫn đọc đúng", "B. Vẽ lại đẹp hơn", "C. Tính nhanh hơn", "D. Nhầm lẫn giữa hai đối tượng"], "answer": "D", "explain": "Không đọc chú thích thì có thể nhầm lẫn giữa hai đối tượng."}, {"type": "mcq", "level": "NB", "q": "Các nhóm trong biểu đồ cột kép được:", "options": ["A. Vẽ chồng lên nhau", "B. Đặt cách đều nhau trên trục ngang", "C. Vẽ tùy ý", "D. Bỏ qua không vẽ"], "answer": "B", "explain": "Các nhóm được đặt cách đều nhau trên trục ngang."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột kép “Số cây hai trường trồng được” (xanh: Trường A, hồng: Trường B; đơn vị: cây). Năm 2024: A 120, B 100; Năm 2025: A 150, B 140. Hỏi năm 2025 trường A trồng được bao nhiêu cây?", "options": ["A. 120 cây", "B. 100 cây", "C. 150 cây", "D. 140 cây"], "answer": "C", "explain": "Cột xanh của nhóm Năm 2025 gióng sang trục dọc được giá trị 150."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ cột kép trên, năm 2024 trường B trồng được bao nhiêu cây?", "options": ["A. 100 cây", "B. 120 cây", "C. 150 cây", "D. 140 cây"], "answer": "A", "explain": "Cột hồng của nhóm Năm 2024 gióng sang trục dọc được giá trị 100."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ cột kép trên, năm 2025 trường A trồng nhiều hơn trường B bao nhiêu cây?", "options": ["A. 20 cây", "B. 30 cây", "C. 40 cây", "D. 10 cây"], "answer": "D", "explain": "Hiệu số cây là 150 − 140 = 10 cây."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột kép “Số cây hai trường trồng được” (xanh: Trường A, hồng: Trường B; đơn vị: cây). Năm 2024: A 120, B 100; Năm 2025: A 150, B 140. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Năm 2024 trường A trồng nhiều hơn trường B 20 cây.", "b) Năm 2025 trường A trồng nhiều hơn trường B 10 cây.", "c) Cả 2 năm trường A trồng được 270 cây.", "d) Cả 2 năm trường B trồng được 250 cây."], "answer": ["T", "T", "T", "F"], "explain": "120 − 100 = 20 nên a) đúng; 150 − 140 = 10 nên b) đúng; 120 + 150 = 270 nên c) đúng; 100 + 140 = 240 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột kép “Số cây hai lớp trồng được” (xanh: 6A, hồng: 6B; đơn vị: cây). Tháng 1: 6A 15, 6B 18; Tháng 2: 6A 20, 6B 16; Tháng 3: 6A 18, 6B 20. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Tháng 2 lớp 6A trồng nhiều nhất trong 3 tháng của lớp 6A.", "b) Tháng 3 lớp 6B trồng nhiều nhất trong 3 tháng của lớp 6B.", "c) Tháng 1 cả hai lớp trồng được 33 cây.", "d) Cả 3 tháng hai lớp trồng được 107 cây."], "answer": ["T", "T", "T", "T"], "explain": "20 là lớn nhất của 6A nên a) đúng; 20 là lớn nhất của 6B nên b) đúng; 15 + 18 = 33 nên c) đúng; 53 + 54 = 107 nên d) đúng."}, {"type": "short", "level": "VDC", "q": "Với biểu đồ cột kép “Số cây hai trường trồng được” (Trường A: 120, 150 cây; Trường B: 100, 140 cây), hỏi cả 2 năm trường A trồng được bao nhiêu cây?", "answer": "270", "explain": "Tổng số cây trường A trồng là 120 + 150 = 270 cây."}, {"type": "short", "level": "VDC", "q": "Với biểu đồ cột kép trên, hỏi cả 2 năm hai trường trồng được bao nhiêu cây?", "answer": "510", "explain": "Trường A trồng 270 cây, trường B trồng 100 + 140 = 240 cây. Tổng cộng 270 + 240 = 510 cây."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ cột kép và biểu đồ cột đơn đều:", "options": ["A. Không có trục", "B. Dùng các cột hình chữ nhật để thể hiện số liệu", "C. Chỉ gồm lời văn", "D. Không có tên biểu đồ"], "answer": "B", "explain": "Cả hai đều dùng các cột hình chữ nhật để thể hiện số liệu."}, {"type": "mcq", "level": "NB", "q": "Điểm mạnh của biểu đồ cột kép là:", "options": ["A. So sánh trực quan hai bộ số liệu trong cùng một hình", "B. Không cần có số liệu", "C. Vẽ rất nhanh", "D. Ai cũng vẽ đẹp"], "answer": "A", "explain": "Điểm mạnh của biểu đồ cột kép là so sánh trực quan hai bộ số liệu trong cùng một hình."}, {"type": "mcq", "level": "NB", "q": "Khi vẽ biểu đồ cột kép, hai cột trong một nhóm phải:", "options": ["A. Cách xa nhau", "B. Có cùng màu", "C. Đặt cạnh nhau", "D. Vẽ chồng lên nhau"], "answer": "C", "explain": "Hai cột trong một nhóm phải đặt cạnh nhau."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột kép “Điểm kiểm tra hai bạn” (xanh: An, hồng: Bình). Lần 1: An 8, Bình 7; Lần 2: An 9, Bình 9; Lần 3: An 10, Bình 8 (đơn vị: điểm). Hỏi lần 3 bạn An được bao nhiêu điểm?", "options": ["A. 8 điểm", "B. 9 điểm", "C. 7 điểm", "D. 10 điểm"], "answer": "D", "explain": "Cột xanh của nhóm Lần 3 gióng sang trục dọc được giá trị 10."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ cột kép trên, lần 1 bạn Bình được bao nhiêu điểm?", "options": ["A. 8 điểm", "B. 7 điểm", "C. 9 điểm", "D. 10 điểm"], "answer": "B", "explain": "Cột hồng của nhóm Lần 1 gióng sang trục dọc được giá trị 7."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ cột kép trên, lần 2 hai bạn được tổng cộng bao nhiêu điểm?", "options": ["A. 18 điểm", "B. 16 điểm", "C. 17 điểm", "D. 19 điểm"], "answer": "A", "explain": "Tổng điểm lần 2 là 9 + 9 = 18 điểm."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột kép “Điểm kiểm tra hai bạn” (xanh: An, hồng: Bình; đơn vị: điểm). Lần 1: An 8, Bình 7; Lần 2: An 9, Bình 9; Lần 3: An 10, Bình 8. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Lần 1 bạn An hơn bạn Bình 1 điểm.", "b) Lần 2 hai bạn bằng điểm nhau.", "c) Lần 3 bạn An hơn bạn Bình 2 điểm.", "d) Cả 3 lần bạn An được 26 điểm."], "answer": ["T", "T", "T", "F"], "explain": "8 − 7 = 1 nên a) đúng; cùng 9 điểm nên b) đúng; 10 − 8 = 2 nên c) đúng; 8 + 9 + 10 = 27 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột kép “Lượng mưa hai năm” (xanh: năm 2024, hồng: năm 2025; đơn vị: mm). Tháng 1: 20 và 25; Tháng 2: 35 và 30; Tháng 3: 25 và 30. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Tháng 2 năm 2024 mưa nhiều nhất.", "b) Tháng 1 năm 2024 mưa ít nhất trong 6
