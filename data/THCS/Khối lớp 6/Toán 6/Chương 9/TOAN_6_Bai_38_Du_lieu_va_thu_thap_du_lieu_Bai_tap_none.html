32 (quyển). Hỏi cả 4 tổ đọc được tất cả bao nhiêu quyển sách?", "answer": "115", "explain": "Tổng số sách là 25 + 30 + 28 + 32 = 115 quyển."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Phiếu hỏi thường được dùng để thu thập loại dữ liệu nào?", "options": ["A. Nhiệt độ không khí", "B. Chiều cao của cây", "C. Ý kiến, sở thích của mọi người", "D. Độ dài của cái bàn"], "answer": "C", "explain": "Phiếu hỏi phù hợp để thu thập ý kiến, sở thích của nhiều người."}, {"type": "mcq", "level": "NB", "q": "Dữ liệu “quê quán của học sinh” thuộc loại nào?", "options": ["A. Dữ liệu là số", "B. Dữ liệu không phải là số", "C. Số liệu thống kê", "D. Không phải là dữ liệu"], "answer": "B", "explain": "Quê quán là thông tin dạng chữ, không phải con số."}, {"type": "mcq", "level": "NB", "q": "Hành động nào sau đây là thu thập dữ liệu bằng cách làm thí nghiệm?", "options": ["A. Tung đồng xu 30 lần và ghi lại mặt xuất hiện mỗi lần", "B. Hỏi các bạn thích ăn món gì", "C. Đọc số liệu trên báo", "D. Ngắm cảnh và tưởng tượng"], "answer": "A", "explain": "Tung đồng xu nhiều lần và ghi lại kết quả là làm thí nghiệm."}, {"type": "mcq", "level": "TH", "q": "Trong các dữ liệu sau, dữ liệu nào là KHÔNG hợp lí?", "options": ["A. Sáng nay nhiệt độ là 25°C", "B. Bạn Lan nặng 38 kg", "C. Một ngày có 30 giờ", "D. Lớp em có 42 học sinh"], "answer": "C", "explain": "Một ngày chỉ có 24 giờ nên “một ngày có 30 giờ” là dữ liệu không hợp lí."}, {"type": "mcq", "level": "TH", "q": "Trường muốn biết món ăn sáng được nhiều học sinh yêu thích nhất để chuẩn bị thực đơn căng tin. Cách thu thập dữ liệu hợp lí nhất là:", "options": ["A. Hỏi ý kiến của 5 bạn", "B. Phát phiếu hỏi cho học sinh các lớp rồi tổng hợp", "C. Đoán theo sở thích của mình", "D. Chỉ hỏi các bạn lớp 6A"], "answer": "B", "explain": "Muốn biết ý kiến của học sinh toàn trường thì phát phiếu hỏi cho học sinh các lớp rồi tổng hợp là hợp lí nhất."}, {"type": "mcq", "level": "TH", "q": "Bạn Hoa ghi lại số phút tập thể dục mỗi  = 4°C."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Dữ liệu nào sau đây được thu thập bằng cách quan sát?", "options": ["A. Ý kiến về món ăn yêu thích", "B. Chiều cao đo bằng thước", "C. Kết quả tung xúc xắc", "D. Số học sinh đi xe đạp qua cổng trường trong 15 phút được đếm lại"], "answer": "D", "explain": "Đếm số học sinh đi qua cổng trường và ghi lại là thu thập dữ liệu bằng cách quan sát."}, {"type": "mcq", "level": "NB", "q": "Trong các dữ liệu sau, dữ liệu nào là số liệu?", "options": ["A. Tên trường", "B. Màu áo đồng phục", "C. Số bàn trong lớp học", "D. Bài hát yêu thích"], "answer": "C", "explain": "Số bàn là con số đếm được nên là số liệu."}, {"type": "mcq", "level": "NB", "q": "“Thu thập dữ liệu từ nguồn có sẵn” nghĩa là:", "options": ["A. Tự làm thí nghiệm", "B. Lấy số liệu, thông tin từ sách, báo, Internet... đã có sẵn", "C. Đoán số liệu theo ý mình", "D. Hỏi bạn bè rồi ghi nhớ trong đầu"], "answer": "B", "explain": "Thu thập từ nguồn có sẵn là lấy thông tin, số liệu từ sách, báo, Internet... đã có."}, {"type": "mcq", "level": "TH", "q": "Bạn An muốn tìm hiểu xem các bạn trong lớp thích đọc loại sách nào nhất. Bạn An nên:", "options": ["A. Phát phiếu hỏi cho cả lớp về loại sách yêu thích", "B. Đếm số sách trong thư viện", "C. Hỏi cô thủ thư", "D. Đoán theo ý thích của mình"], "answer": "A", "explain": "Muốn biết sở thích của cả lớp thì phát phiếu hỏi cho cả lớp là cách hợp lí nhất."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu nào sau đây là KHÔNG hợp lí?", "options": ["A. Lớp 6B có 40 học sinh", "B. Sáng nay nhiệt độ là 26°C", "C. Bạn An nặng 40 kg", "D. Một học sinh lớp 6 cao 300 cm"], "answer": "D", "explain": "Học sinh lớp 6 không thể cao 300 cm (3 mét) nên dữ liệu này không hợp lí."}, {"type": "mcq", "level": "TH", "q": "Kết quả bầu lớp trưởng: An 15 phiếu, Bình 12 phiếu, Chi 9 phiếu. Hỏi có bao nhiêu bạn đã tham gia bỏ phiếu?", "options": ["A. 15 bạn", "B. 27 bạn", "C. 36 bạn", "D. 12 bạn"], "answer": "C", "explain": "Tổng số bạn bỏ phiếu là 15 + 12 + 9 = 36 bạn."}, {"type": "truefalse", "level": "VD", "q": "Bạn Linh gieo một con xúc xắc 10 lần, ghi lại số chấm xuất hiện mỗi lần: 2, 5, 1, 6, 3, 5, 4, 2, 6, 1. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Bạn Linh thu thập dữ liệu bằng cách làm thí nghiệm.", "b) Dữ liệu thu được là dữ liệu số.", "c) Số chấm 5 xuất hiện 3 lần.", "d) Tổng số lần gieo xúc xắc là 10 lần."], "answer": ["T", "T", "F", "T"], "explain": "Gieo xúc xắc và ghi lại là làm thí nghiệm nên a) đúng; số chấm là các con số nên b) đúng; số 5 chỉ xuất hiện 2 lần nên c) sai; dãy số có 10 số nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Thống kê số quyển vở của 4 bạn: Mai 8 quyển, Nam 6 quyển, Hoa 10 quyển, Tuấn 6 quyển. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Bạn Hoa có nhiều vở nhất.", "b) Bạn Nam và bạn Tuấn có số vở bằng nhau.", "c) Tổng số vở của 4 bạn là 28 quyển.", "d) Dữ liệu “số quyển vở” là dữ liệu số."], "answer": ["T", "T", "F", "T"], "explain": "10 là lớn nhất nên a) đúng; cùng 6 quyển nên b) đúng; 8 + 6 + 10 + 6 = 30 nên c) sai; số quyển vở là các con số nên d) đúng."}, {"type": "short", "level": "VDC", "q": "Số điểm 10 của các tổ trong tháng: Tổ 1 được 12 điểm 10, Tổ 2 được 15 điểm 10, Tổ 3 được 9 điểm 10, Tổ 4 được 14 điểm 10. Hỏi cả 4 tổ đạt tổng cộng bao nhiêu điểm 10?", "answer": "50", "explain": "Tổng số điểm 10 là 12 + 15 + 9 + 14 = 50."}, {"type": "short", "level": "VDC", "q": "Lượng mưa 5 ngày liên tiếp: 12 mm, 0 mm, 5 mm, 8 mm, 0 mm. Hỏi có bao nhiêu ngày không mưa?", "answer": "2", "explain": "Những ngày có lượng mưa 0 mm là những ngày không mưa, có 2 ngày."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Ví dụ nào sau đây là dữ liệu?", "options": ["A. Chiều cao của các bạn trong lớp", "B. Một bài thơ", "C. Một bức tranh", "D. Một câu chuyện cổ tích"], "answer": "A", "explain": "Chiều cao đo được là thông tin, số liệu thu được khi đo đạc nên là dữ liệu."}, {"type": "mcq", "level": "NB", "q": "Muốn biết “Màu sắc được nhiều bạn trong lớp yêu thích nhất”, cách thu thập dữ liệu phù hợp là:", "options": ["A. Đo chiều cao của các bạn", "B. Đếm số bàn ghế trong lớp", "C. Lập phiếu hỏi cho tất cả các bạn trong lớp", "D. Quan sát thời tiết ngoài trời"], "answer": "C", "explain": "Muốn biết sở thích của cả lớp thì lập phiếu hỏi là cách phù hợp."}, {"type": "mcq", "level": "NB", "q": "Dữ liệu “số học sinh nghỉ học mỗi ngày trong tuần” thuộc loại:", "options": ["A. Dữ liệu chữ", "B. Dữ liệu hình ảnh", "C. Dữ liệu số", "D. Không phải là dữ liệu"], "answer": "C", "explain": "Số học sinh nghỉ học là các con số nên thuộc loại dữ liệu số."}, {"type": "mcq", "level": "TH", "q": "Trong các dữ liệu sau, dữ liệu nào là hợp lí?", "options": ["A. Bạn học sinh lớp 6 nặng 200 kg", "B. Sân trường dài 5000 m", "C. Mỗi ngày em ngủ khoảng 8 giờ", "D. Một năm có 20 tháng"], "answer": "C", "explain": "Mỗi ngày ngủ khoảng 8 giờ là hợp lí; các dữ liệu còn lại đều vô lí."}, {"type": "mcq", "level": "TH", "q": "Bạn Hùng hỏi 10 bạn “Bạn thích chơi môn thể thao nào?” và ghi lại câu trả lời. Dữ liệu “môn thể thao yêu thích” thuộc loại:", "options": ["A. Dữ liệu không phải là số", "B. Dữ liệu là số", "C. Số liệu đo đạc", "D. Không phải là dữ liệu"], "answer": "A", "explain": "Tên môn thể thao là thông tin dạng chữ, không phải con số."}, {"type": "mcq", "level": "TH", "q": "Thầy giáo ghi lại số bạn đi học muộn mỗi ngày trong tuần (từ thứ Hai đến thứ Bảy): 2, 0, 1, 3, 1, 0 (bạn). Hỏi có bao nhiêu ngày không có bạn nào đi học muộn?", "options": ["A. 1 ngày", "B. 2 ngày", "C. 3 ngày", "D. 0 ngày"], "answer": "B", "explain": "Những ngày có số bạn đi muộn là 0 có 2 ngày."}, {"type": "truefalse", "level": "VD", "q": "Kết quả điều tra “Thức uống yêu thích” của 25 học sinh: Trà sữa 10 bạn, Nước cam 8 bạn, Sữa 7 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “thức uống yêu thích” là dữ liệu số.", "b) Thức uống được yêu thích nhất là trà sữa.", "c) Số bạn thích nước cam nhiều hơn số bạn thích sữa 1 bạn.", "d) Tổng số học sinh được hỏi là 25 bạn."], "answer": ["F", "T", "T", "T"], "explain": "Thức uống là dữ liệu không phải là số nên a) sai; trà sữa (10 bạn) nhiều nhất nên b) đúng; 8 − 7 = 1 nên c) đúng; 10 + 8 + 7 = 25 nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Bạn Phương đo nhiệt độ phòng học lúc 8 giờ sáng trong 5 ngày được: 24, 25, 24, 26, 25 (đơn vị: °C). Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “nhiệt độ” là dữ liệu số.", "b) Nhiệt độ cao nhất đo được là 26°C.", "c) Nhiệt độ 24°C xuất hiện 1 lần.", "d) Bạn Phương thu thập dữ liệu bằng cách quan sát nhiệt kế."], "answer": ["T", "T", "F", "T"], "explain": "Nhiệt độ là các con số nên a) đúng; 26 là lớn nhất nên b) đúng; 24°C xuất hiện 2 lần nên c) sai; đọc nhiệt kế là quan sát nên d) đúng."}, {"type": "short", "level": "VDC", "q": "Số cây mỗi lớp trồng được: 6A trồng 20 cây, 6B trồng 25 cây, 6C trồng 18 cây, 6D trồng 22 cây. Hỏi 4 lớp trồng được tất cả bao nhiêu cây?", "answer": "85", "explain": "Tổng số cây là 20 + 25 + 18 + 22 = 85 cây."}, {"type": "short", "level": "VDC", "q": "Điểm kiểm tra 15 phút của bạn An: 7, 8, 9, 8, 10, 9. Hỏi bạn An đạt điểm 9 bao nhiêu lần?", "answer": "2", "explain": "Điểm 9 xuất hiện 2 lần trong dãy điểm."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Dữ liệu “điểm kiểm tra môn Toán” là:", "options": ["A. Dữ liệu chữ", "B. Dữ liệu hình ảnh", "C. Dữ liệu số", "D. Không phải là dữ liệu"], "answer": "C", "explain": "Điểm kiểm tra là các con số nên là dữ liệu số."}, {"type": "mcq", "level": "NB", "q": "Cách nào sau đây là thu thập dữ liệu bằng quan sát?", "options": ["A. Phát phiếu hỏi", "B. Gieo xúc xắc", "C. Làm thí nghiệm hóa học", "D. Đếm số chim đậu trên cây trong sân trường"], "answer": "D", "explain": "Đếm số chim đậu trên cây và ghi lại là thu thập dữ liệu bằng cách quan sát."}, {"type": "mcq", "level": "NB", "q": "Khi lập phiếu hỏi, cần:", "options": ["A. Đặt câu hỏi rõ ràng, dễ hiểu", "B. Đặt câu hỏi thật khó để thử thách", "C. Chỉ hỏi một người duy nhất", "D. Không cần ghi lại câu trả lời"], "answer": "A", "explain": "Phiếu hỏi cần có câu hỏi rõ ràng, dễ hiểu để mọi người trả lời chính xác."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu nào sau đây là KHÔNG hợp lí?", "options": ["A. Em cao 145 cm", "B. Hôm nay trời 30°C", "C. Bạn Mai 11 tuổi và đang học lớp 6", "D. Một tuần lễ có 3 ngày"], "answer": "D", "explain": "Một tuần lễ có 7 ngày nên “một tuần lễ có 3 ngày” là dữ liệu không hợp lí."}, {"type": "mcq", "level": "TH", "q": "Muốn biết nhiệt độ trung bình các ngày trong tuần ở địa phương, em nên:", "options": ["A. Đoán nhiệt độ các ngày", "B. Hỏi các bạn trong lớp", "C. Đọc và ghi lại số chỉ nhiệt kế vào cùng một giờ mỗi ngày trong tuần", "D. Xem dự báo thời tiết của năm ngoái"], "answer": "C", "explain": "Đọc và ghi lại số chỉ nhiệt kế vào cùng một giờ mỗi ngày là cách thu thập dữ liệu nhiệt độ hợp lí nhất."}, {"type": "mcq", "level": "TH", "q": "Số thành viên trong gia đình của 5 bạn: 4, 5, 3, 4, 6 (người). Hỏi có bao nhiêu gia đình có 4 thành viên?", "options": ["A. 1 gia đình", "B. 3 gia đình", "C. 4 gia đình", "D. 2 gia đình"], "answer": "D", "explain": "Số 4 xuất hiện 2 lần trong dãy số nên có 2 gia đình có 4 thành viên."}, {"type": "truefalse", "level": "VD", "q": "Kết quả khảo sát “Con vật nuôi yêu thích” của 36 học sinh: Chó 14 bạn, Mèo 12 bạn, Chim 6 bạn, Cá 4 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “con vật nuôi yêu thích” không phải là dữ liệu số.", "b) Con vật được yêu thích nhất là mèo.", "c) Số bạn thích chó nhiều hơn số bạn thích mèo 2 bạn.", "d) Tổng số học sinh được khảo sát là 36 bạn."], "answer": ["T", "F", "T", "T"], "explain": "Con vật là dữ liệu không phải là số nên a) đúng; chó (14 bạn) nhiều nhất nên b) sai; 14 − 12 = 2 nên c) đúng; 14 + 12 + 6 + 4 = 36 nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Bạn Tuấn ghi lại số trang sách đọc mỗi ngày trong 5 ngày: 10, 15, 12, 15, 8 (trang). Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “số trang sách” là dữ liệu số.", "b) Ngày đọc nhiều nhất là 15 trang.", "c) Tổng số trang đọc trong 5 ngày là 60 trang.", "d) Dữ liệu này được thu thập bằng cách lập phiếu hỏi."], "answer": ["T", "T", "T", "F"], "explain": "Số trang là các con số nên a) đúng; 15 là lớn nhất nên b) đúng; 10 + 15 + 12 + 15 + 8 = 60 nên c) đúng; tự ghi chép hằng ngày là quan sát, không phải phiếu hỏi nên d) sai."}, {"type": "short", "level": "VDC", "q": "Số học sinh giỏi của các lớp khối 6: 6A có 8 bạn, 6B có 10 bạn, 6C có 7 bạn, 6D có 9 bạn, 6E có 6 bạn. Hỏi khối 6 có tất cả bao nhiêu học sinh giỏi?", "answer": "40", "explain": "Tổng số học sinh giỏi là 8 + 10 + 7 + 9 + 6 = 40 bạn."}, {"type": "short", "level": "VDC", "q": "Chiều cao của các bạn trong tổ: 142, 148, 145, 150, 143 (đơn vị: cm). Hỏi bạn thấp nhất cao bao nhiêu xăng-ti-mét?", "answer": "142", "explain": "Số nhỏ nhất trong dãy là 142 nên bạn thấp nhất cao 142 cm."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các thông tin sau, thông tin nào là dữ liệu số?", "options": ["A. Tên bài hát", "B. Màu của hoa", "C. Số lượng học sinh của trường", "D. Tên món ăn"], "answer": "C", "explain": "Số lượng học sinh là con số đếm được nên là dữ liệu số."}, {"type": "mcq", "level": "NB", "q": "Để tìm hiểu về “sở thích đọc sách” của các bạn, cách thu thập dữ liệu phù hợp nhất là:", "options": ["A. Lập phiếu hỏi", "B. Đo chiều cao", "C. Đếm số cây trong trường", "D. Quan sát mây trên trời"], "answer": "A", "explain": "Tìm hiểu sở thích của nhiều người thì lập phiếu hỏi là cách phù hợp nhất."}, {"type": "mcq", "level": "NB", "q": "Dữ liệu thu được khi gieo xúc xắc nhiều lần và ghi lại số chấm xuất hiện là:", "options": ["A. Dữ liệu chữ", "B. Dữ liệu hình ảnh", "C. Dữ liệu không phải là số", "D. Dữ liệu số"], "answer": "D", "explain": "Số chấm xuất hiện là các con số nên là dữ liệu số."}, {"type": "mcq", "level": "TH", "q": "Câu ghi chép nào sau đây có thể dùng làm dữ liệu để thống kê nhiệt độ?", "options": ["A. Hôm nay trời đẹp", "B. Sáng nay nhiệt kế chỉ 24°C", "C. Trời hôm nay mát mẻ", "D. Hôm nay có nắng to"], "answer": "B", "explain": "Chỉ câu ghi lại số chỉ cụ thể của nhiệt kế mới là dữ liệu dùng để thống kê nhiệt độ."}, {"type": "mcq", "level": "TH", "q": "Trong các dữ liệu sau, dữ liệu nào là hợp lí?", "options": ["A. Nhiệt độ mùa hè ở Hà Nội là 5°C", "B. Một học sinh lớp 6 cao 145 cm", "C. Một ngày có 48 giờ", "D. Tháng Hai có 40 ngày"], "answer": "B", "explain": "Học sinh lớp 6 cao 145 cm là hợp lí; các dữ liệu còn lại đều vô lí."}, {"type": "mcq", "level": "TH", "q": "Số con trong gia đình của các bạn tổ 3: 2, 1, 3, 2, 2, 1 (con). Hỏi có bao nhiêu bạn là con một trong gia đình?", "options": ["A. 2 bạn", "B. 3 bạn", "C. 1 bạn", "D. 4 bạn"], "answer": "A", "explain": "Số 1 xuất hiện 2 lần trong dãy số nên có 2 bạn là con một."}, {"type": "truefalse", "level": "VD", "q": "Kết quả điều tra “Môn học yêu thích” của 32 học sinh: Toán 12 bạn, Văn 8 bạn, Anh 7 bạn, Khoa học 5 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “môn học yêu thích” là dữ liệu số.", "b) Môn Toán được yêu thích nhất.", "c) Số bạn thích Văn nhiều hơn số bạn thích Anh 1 bạn.", "d) Tổng số học sinh được điều tra là 32 bạn."], "answer": ["F", "T", "T", "T"], "explain": "Môn học là dữ liệu không phải là số nên a) sai; Toán (12 bạn) nhiều nhất nên b) đúng; 8 − 7 = 1 nên c) đúng; 12 + 8 + 7 + 5 = 32 nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Bạn Hà đếm số ô tô đi qua trước cổng nhà trong 4 khung giờ, mỗi khung 5 phút, được: 6, 9, 7, 10 (chiếc). Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Bạn Hà thu thập dữ liệu bằng cách quan sát.", "b) Tổng số ô tô đếm được là 32 chiếc.", "c) Khung giờ đếm được nhiều ô tô nhất là khung giờ thứ tư.", "d) Dữ liệu này là dữ liệu không phải là số."], "answer": ["T", "T", "T", "F"], "explain": "Đếm và ghi lại là quan sát nên a) đúng; 6 + 9 + 7 + 10 = 32 nên b) đúng; 10 là lớn nhất ở khung thứ tư nên c) đúng; số ô tô là các con số nên d) sai."}, {"type": "short", "level": "VDC", "q": "Số điểm tốt của các tổ trong tuần: 18, 22, 15, 25, 20 (điểm). Hỏi trung bình mỗi tổ đạt bao nhiêu điểm tốt?", "answer": "20", "explain": "Tổng số điểm tốt là 18 + 22 + 15 + 25 + 20 = 100. Trung bình mỗi tổ đạt 100 : 5 = 20 điểm tốt."}, {"type": "short", "level": "VDC", "q": "Cân nặng của 4 bạn: 35, 42, 38, 45 (đơn vị: kg). Hỏi bạn nặng nhất hơn bạn nhẹ nhất bao nhiêu ki-lô-gam?", "answer": "10", "explain": "Bạn nặng nhất 45 kg, bạn nhẹ nhất 35 kg. Hiệu là 45 − 35 = 10 kg."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Dữ liệu nào sau đây KHÔNG phải là dữ liệu số?", "options": ["A. Số tuổi", "B. Chiều cao", "C. Cân nặng", "D. Tên tỉnh thành"], "answer": "D", "explain": "Tên tỉnh thành là thông tin dạng chữ, không phải là dữ liệu số."}, {"type": "mcq", "level": "NB", "q": "Muốn biết “loại phim hoạt hình được yêu thích nhất”, em nên thu thập dữ liệu bằng cách nào?", "options": ["A. Đo nhiệt độ", "B. Lập phiếu hỏi các bạn", "C. Gieo xúc xắc", "D. Đếm số sách trong tủ"], "answer": "B", "explain": "Muốn biết sở thích của các bạn thì lập phiếu hỏi là cách phù hợp."}, {"type": "mcq", "level": "NB", "q": "Số liệu thu được khi đo, đếm, tính toán được gọi là:", "options": ["A. Dữ liệu chữ", "B. Dữ liệu hình ảnh", "C. Dữ liệu số (số liệu)", "D. Dữ liệu âm thanh"], "answer": "C", "explain": "Các con số thu được khi đo, đếm, tính toán được gọi là dữ liệu số (số liệu)."}, {"type": "mcq", "level": "TH", "q": "Bạn Minh ghi lại thời gian làm bài tập mỗi tối trong tuần: 40, 50, 45, 60, 40, 55, 30 (phút). Dữ liệu “thời gian làm bài tập” thuộc loại:", "options": ["A. Dữ liệu là số", "B. Dữ liệu không phải là số", "C. Không phải là dữ liệu", "D. Dữ liệu hình ảnh"], "answer": "A", "explain": "Thời gian tính bằng phút là các con số nên thuộc loại dữ liệu là số."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu nào sau đây là KHÔNG hợp lí?", "options": ["A. Lớp 6B có 40 học sinh", "B. Sáng nay nhiệt độ là 26°C", "C. Bạn An nặng 40 kg", "D. Một học sinh lớp 6 cao 300 cm"], "answer": "D", "explain": "Học sinh lớp 6 không thể cao tới 300 cm nên dữ liệu này không hợp lí."}, {"type": "mcq", "level": "TH", "q": "Kết quả bầu lớp trưởng: An 15 phiếu, Bình 12 phiếu, Chi 9 phiếu. Hỏi có bao nhiêu bạn đã tham gia bỏ phiếu?", "options": ["A. 15 bạn", "B. 27 bạn", "C. 36 bạn", "D. 12 bạn"], "answer": "C", "explain": "Tổng số bạn bỏ phiếu là 15 + 12 + 9 = 36 bạn."}, {"type": "truefalse", "level": "VD", "q": "Kết quả thống kê “Đồ uống yêu thích” của 30 bạn: Nước lọc 12 bạn, Sữa 9 bạn, Nước trái cây 9 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “đồ uống yêu thích” không phải là dữ liệu số.", "b) Đồ uống được yêu thích nhất là nước lọc.", "c) Số bạn thích sữa bằng số bạn thích nước trái cây.", "d) Tổng số bạn được hỏi là 28 bạn."], "answer": ["T", "T", "T", "F"], "explain": "Đồ uống là dữ liệu không phải là số nên a) đúng; nước lọc (12 bạn) nhiều nhất nên b) đúng; cùng 9 bạn nên c) đúng; 12 + 9 + 9 = 30 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Bạn Đức ghi lại số phút chạy bộ mỗi sáng trong 5 ngày: 20, 25, 20, 30, 25 (phút). Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “số phút chạy bộ” là dữ liệu số.", "b) Ngày chạy nhiều nhất là 30 phút.", "c) Số phút 20 xuất hiện 3 lần.", "d) Tổng số phút chạy trong 5 ngày là 120 phút."], "answer": ["T", "T", "F", "T"], "explain": "Số phút là các con số nên a) đúng; 30 là lớn nhất nên b) đúng; số 20 chỉ xuất hiện 2 lần nên c) sai; 20 + 25 + 20 + 30 + 25 = 120 nên d) đúng."}, {"type": "short", "level": "VDC", "q": "Số học sinh tham gia các câu lạc bộ: Bóng đá 24 bạn, Cầu lông 18 bạn, Mỹ thuật 12 bạn, Âm nhạc 16 bạn. Hỏi câu lạc bộ Bóng đá nhiều hơn câu lạc bộ Mỹ thuật bao nhiêu học sinh?", "answer": "12", "explain": "Hiệu số học sinh là 24 − 12 = 12 bạn."}, {"type": "short", "level": "VDC", "q": "Điểm các bài kiểm tra của bạn Hoa: 8, 9, 7, 10, 8, 9, 9. Hỏi bạn Hoa đạt điểm 8 và điểm 9 tổng cộng bao nhiêu lần?", "answer": "5", "explain": "Điểm 8 xuất hiện 2 lần, điểm 9 xuất hiện 3 lần. Tổng cộng 2 + 3 = 5 lần."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khi thu thập dữ liệu, việc làm nào sau đây là đúng?", "options": ["A. Ghi chép đầy đủ, chính xác, trung thực", "B. Bịa thêm số liệu cho đẹp", "C. Chỉ ghi những số mình thích", "D. Không cần ghi lại, nhớ trong đầu là đủ"], "answer": "A", "explain": "Khi thu thập dữ liệu cần ghi chép đầy đủ, chính xác và trung thực."}, {"type": "mcq", "level": "NB", "q": "Dữ liệu “số điện thoại của các bạn trong lớp” là:", "options": ["A. Dữ liệu chữ", "B. Dữ liệu hình ảnh", "C. Dữ liệu số", "D. Không phải là dữ liệu"], "answer": "C", "explain": "Số điện thoại gồm các chữ số nên là dữ liệu số."}, {"type": "mcq", "level": "NB", "q": "Cách thu thập dữ liệu nào sau đây dùng giác quan để ghi nhận sự việc diễn ra?", "options": ["A. Lập phiếu hỏi", "B. Quan sát", "C. Làm thí nghiệm", "D. Đọc sách báo"], "answer": "B", "explain": "Quan sát là dùng giác quan (chủ yếu là mắt) để ghi nhận sự việc."}, {"type": "mcq", "level": "TH", "q": "Để tìm hiểu lượng mưa trung bình các tháng trong năm ở địa phương, nguồn dữ liệu đáng tin cậy nhất là:", "options": ["A. Đoán theo trí nhớ", "B. Hỏi các bạn trong lớp", "C. Tự ước lượng theo cảm giác", "D. Số liệu đo đạc của trạm khí tượng địa phương"], "answer": "D", "explain": "Số liệu đo đạc của trạm khí tượng là nguồn có sẵn đáng tin cậy nhất."}, {"type": "mcq", "level": "TH", "q": "Bạn Vân hỏi các bạn “Bạn thích màu nào?” và ghi lại: đỏ, xanh, đỏ, vàng, xanh, đỏ. Dữ liệu này thuộc loại:", "options": ["A. Dữ liệu không phải là số", "B. Dữ liệu là số", "C. Số liệu đo đạc", "D. Không phải là dữ liệu"], "answer": "A", "explain": "Tên màu sắc là thông tin dạng chữ, không phải con số."}, {"type": "mcq", "level": "TH", "q": "Số kẹo mỗi bạn có: An 5 cái, Bình 8 cái, Chi 6 cái, Dũng 8 cái, Em 5 cái. Hỏi có bao nhiêu bạn có 8 cái kẹo?", "options": ["A. 1 bạn", "B. 2 bạn", "C. 3 bạn", "D. 4 bạn"], "answer": "B", "explain": "Có 2 bạn (Bình và Dũng) có 8 cái kẹo."}, {"type": "truefalse", "level": "VD", "q": "Kết quả điều tra “Mùa yêu thích” của 28 học sinh: Xuân 8 bạn, Hạ 9 bạn, Thu 7 bạn, Đông 4 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “mùa yêu thích” là dữ liệu số.", "b) Mùa hè được yêu thích nhất.", "c) Số bạn thích mùa xuân nhiều hơn số bạn thích mùa thu 1 bạn.", "d) Tổng số học sinh được điều tra là 30 bạn."], "answer": ["F", "T", "T", "F"], "explain": "Mùa là dữ liệu không phải là số nên a) sai; mùa hạ (9 bạn) nhiều nhất nên b) đúng; 8 − 7 = 1 nên c) đúng; 8 + 9 + 7 + 4 = 28 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Bạn Khoa ghi lại số giờ ngủ mỗi đêm trong 5 đêm: 8, 9, 8, 7, 8 (giờ). Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “số giờ ngủ” là dữ liệu số.", "b) Đêm ngủ nhiều nhất là 9 giờ.", "c) Số giờ ngủ 8 xuất hiện 2 lần.", "d) Bạn Khoa thu thập dữ liệu bằng cách theo dõi và ghi chép hằng ngày."], "answer": ["T", "T", "F", "T"], "explain": "Số giờ là các con số nên a) đúng; 9 là lớn nhất nên b) đúng; số 8 xuất hiện 3 lần nên c) sai; theo dõi và ghi chép hằng ngày là cách quan sát nên d) đúng."}, {"type": "short", "level": "VDC", "q": "Số vở quyên góp của 4 lớp: 6A quyên góp 45 quyển, 6B quyên góp 52 quyển, 6C quyên góp 48 quyển, 6D quyên góp 55 quyển. Hỏi lớp quyên góp nhiều nhất hơn lớp quyên góp ít nhất bao nhiêu quyển?", "answer": "10", "explain": "Lớp nhiều nhất 55 quyển, lớp ít nhất 45 quyển. Hiệu là 55 − 45 = 10 quyển."}, {"type": "short", "level": "VDC", "q": "Chiều dài của 5 chiếc bút chì: 12, 10, 14, 11, 13 (đơn vị: cm). Hỏi chiếc dài nhất hơn chiếc ngắn nhất bao nhiêu xăng-ti-mét?", "answer": "4", "explain": "Chiếc dài nhất 14 cm, chiếc ngắn nhất 10 cm. Hiệu là 14 − 10 = 4 cm."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Dữ liệu là những thông tin, số liệu thu được khi:", "options": ["A. Ngủ", "B. Quan sát, đo đạc, điều tra, làm thí nghiệm...", "C. Chơi trò chơi điện tử", "D. Xem phim hoạt hình"], "answer": "B", "explain": "Dữ liệu là những thông tin, số liệu thu được khi quan sát, đo đạc, điều tra, làm thí nghiệm..."}, {"type": "mcq", "level": "NB", "q": "Trong các dữ liệu sau, dữ liệu nào là dữ liệu số?", "options": ["A. Họ và tên", "B. Địa chỉ nhà", "C. Sở thích", "D. Tuổi của học sinh"], "answer": "D", "explain": "Tuổi là con số nên là dữ liệu số."}, {"type": "mcq", "level": "NB", "q": "Lập phiếu hỏi là cách thu thập dữ liệu phù hợp khi muốn biết:", "options": ["A. Ý kiến, sở thích của nhiều người", "B. Chiều cao của cây", "C. Nhiệt độ không khí", "D. Độ dài của con đường"], "answer": "A", "explain": "Phiếu hỏi phù hợp để thu thập ý kiến, sở thích của nhiều người."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu nào sau đây là hợp lí?", "options": ["A. Một ngày có 25 giờ", "B. Em nặng 35 kg", "C. Tháng Tư có 31 ngày", "D. Nước sôi ở 50°C"], "answer": "B", "explain": "Học sinh lớp 6 nặng 35 kg là hợp lí; các dữ liệu còn lại đều vô lí (một ngày có 24 giờ, tháng Tư có 30 ngày, nước sôi ở 100°C)."}, {"type": "mcq", "level": "TH", "q": "Cô giáo muốn biết bạn nào trong lớp có nhiều điểm 10 nhất trong tháng. Dữ liệu cần thu thập là:", "options": ["A. Chiều cao của từng bạn", "B. Món ăn yêu thích của từng bạn", "C. Số điểm 10 của từng bạn trong tháng", "D. Màu sắc yêu thích của từng bạn"], "answer": "C", "explain": "Muốn biết ai có nhiều điểm 10 nhất thì phải thu thập số điểm 10 của từng bạn."}, {"type": "mcq", "level": "TH", "q": "Số bông hoa điểm tốt của các bạn: Lan 6 bông, Mai 9 bông, Đào 7 bông, Hồng 9 bông, Cúc 5 bông. Hỏi có bao nhiêu bạn được 9 bông hoa điểm tốt?", "options": ["A. 1 bạn", "B. 3 bạn", "C. 4 bạn", "D. 2 bạn"], "answer": "D", "explain": "Có 2 bạn (Mai và Hồng) được 9 bông hoa điểm tốt."}, {"type": "truefalse", "level": "VD", "q": "Thống kê số sách giáo khoa của 4 bạn: An 12 quyển, Bình 10 quyển, Chi 12 quyển, Dũng 11 quyển. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “số sách giáo khoa” là dữ liệu số.", "b) Bạn An và bạn Chi có số sách bằng nhau.", "c) Tổng số sách của 4 bạn là 44 quyển.", "d) Bạn Bình có ít sách nhất."], "answer": ["T", "T", "F", "T"], "explain": "Số sách là các con số nên a) đúng; cùng 12 quyển nên b) đúng; 12 + 10 + 12 + 11 = 45 nên c) sai; 10 là ít nhất nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Bạn Nhi ghi lại số bước chân mỗi ngày trong 4 ngày: 5000, 6500, 5000, 7000 (bước). Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “số bước chân” là dữ liệu số.", "b) Ngày đi bộ nhiều nhất là 7000 bước.", "c) Số bước chân 5000 xuất hiện 3 lần.", "d) Tổng số bước chân trong 4 ngày là 23500 bước."], "answer": ["T", "T", "F", "T"], "explain": "Số bước chân là các con số nên a) đúng; 7000 là lớn nhất nên b) đúng; số 5000 chỉ xuất hiện 2 lần nên c) sai; 5000 + 6500 + 5000 + 7000 = 23500 nên d) đúng."}, {"type": "short", "level": "VDC", "q": "Số học sinh đạt giải của các khối: Khối 6 có 15 bạn, Khối 7 có 12 bạn, Khối 8 có 18 bạn, Khối 9 có 10 bạn. Hỏi khối 8 nhiều hơn khối 9 bao nhiêu bạn đạt giải?", "answer": "8", "explain": "Hiệu số bạn đạt giải là 18 − 10 = 8 bạn."}, {"type": "short", "level": "VDC", "q": "Số phút gọi điện mỗi ngày trong tuần của bố: 10, 15, 20, 10, 25, 30, 10 (phút). Hỏi có bao nhiêu ngày bố gọi điện 10 phút?", "answer": "3", "explain": "Số 10 xuất hiện 3 lần trong dãy số nên có 3 ngày."}]}]}
