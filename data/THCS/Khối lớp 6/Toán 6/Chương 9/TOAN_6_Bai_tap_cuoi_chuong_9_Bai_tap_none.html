 ["A. Chỉ có hình vẽ", "B. Chỉ có lời văn", "C. Các hàng và cột ghi tên đối tượng và số liệu tương ứng", "D. Chỉ các con số rời rạc"], "answer": "C", "explain": "Bảng thống kê gồm các hàng và cột ghi tên đối tượng và số liệu tương ứng."}, {"type": "mcq", "level": "NB", "q": "Chiều cao của mỗi cột trong biểu đồ cột:", "options": ["A. Tỉ lệ với số liệu mà nó thể hiện", "B. Luôn bằng nhau", "C. Tùy ý người vẽ", "D. Luôn bằng 5 cm"], "answer": "A", "explain": "Chiều cao của mỗi cột tỉ lệ với số liệu mà nó thể hiện."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột kép “Lượng mưa hai năm” (xanh: năm 2024, hồng: năm 2025; đơn vị: mm). Tháng 1: năm 2024 là 18, năm 2025 là 22. Hỏi tháng 1 năm 2025 mưa bao nhiêu mi-li-mét?", "options": ["A. 18 mm", "B. 40 mm", "C. 4 mm", "D. 22 mm"], "answer": "D", "explain": "Cột hồng của nhóm Tháng 1 gióng sang trục dọc được giá trị 22."}, {"type": "mcq", "level": "TH", "q": "Hộp chỉ có các quả bóng màu đỏ và màu xanh. Lấy ngẫu nhiên 1 quả. Sự kiện “Lấy được bóng màu vàng”:", "options": ["A. Có thể xảy ra", "B. Không thể xảy ra", "C. Chắc chắn xảy ra", "D. Là một kết quả có thể"], "answer": "B", "explain": "Hộp không có bóng vàng nên sự kiện này không thể xảy ra."}, {"type": "mcq", "level": "TH", "q": "Rút gọn phân số 18/40 ta được:", "options": ["A. 9/21", "B. 18/40", "C. 9/20", "D. 3/8"], "answer": "C", "explain": "Chia cả tử và mẫu cho 2 ta được 18/40 = 9/20."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột “Số điểm 10 các tổ”: Tổ 1 được 14 điểm 10, Tổ 2 được 11 điểm 10, Tổ 3 được 16 điểm 10, Tổ 4 được 9 điểm 10. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Tổ 3 có nhiều điểm 10 nhất.", "b) Tổ 4 có ít điểm 10 nhất.", "c) Tổ 1 nhiều hơn tổ 2 là 3 điểm 10.", "d) Cả 4 tổ có 48 điểm 10."], "answer": ["T", "T", "T", "F"], "explain": "16 là lớn nhất nên a) đúng; 9 là nhỏ nhất nên b) đúng; 14 − 11 = 3 nên c) đúng; 14 + 11 + 16 + 9 = 50 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Tung một đồng xu hai lần liên tiếp. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Có 4 kết quả có thể: SS, SN, NS, NN.", "b) Kết quả “NS” có thể xảy ra.", "c) Hai lần tung luôn cho cùng một mặt.", "d) Kết quả “SN” có nghĩa là lần 1 sấp, lần 2 ngửa."], "answer": ["T", "T", "F", "T"], "explain": "Có 4 kết quả nên a) đúng; NS là một trong các kết quả nên b) đúng; hai lần tung có thể khác nhau nên c) sai; SN nghĩa là lần 1 sấp, lần 2 ngửa nên d) đúng."}, {"type": "short", "level": "VDC", "q": "Biểu đồ cột kép “Số sách hai bạn đọc được” (An: 6, 8, 7 quyển; Bình: 5, 9, 6 quyển). Hỏi cả 3 tháng hai bạn đọc được bao nhiêu quyển sách?", "answer": "41", "explain": "Bạn An đọc 6 + 8 + 7 = 21 quyển, bạn Bình đọc 5 + 9 + 6 = 20 quyển. Tổng cộng 21 + 20 = 41 quyển."}, {"type": "short", "level": "VDC", "q": "Điểm kiểm tra của 5 bạn: 6, 7, 8, 9, 10. Hỏi có bao nhiêu bạn đạt điểm từ 8 trở lên?", "answer": "3", "explain": "Các bạn đạt điểm từ 8 trở lên là các điểm 8, 9, 10, có 3 bạn."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ tranh dùng gì để thể hiện số liệu?", "options": ["A. Các con số khô khan", "B. Các đoạn văn dài", "C. Các hình ảnh (tranh) có cùng kích thước", "D. Các công thức toán học"], "answer": "C", "explain": "Biểu đồ tranh dùng các hình ảnh (tranh) có cùng kích thước để thể hiện số liệu."}, {"type": "mcq", "level": "NB", "q": "Để tìm số liệu của một đối tượng trên biểu đồ cột, ta:", "options": ["A. Đoán mò", "B. Đếm số cột", "C. Đọc tên biểu đồ", "D. Gióng cột của đối tượng đó sang trục dọc để đọc giá trị"], "answer": "D", "explain": "Ta gióng cột của đối tượng sang trục dọc để đọc giá trị."}, {"type": "mcq", "level": "NB", "q": "Trong biểu đồ cột kép, mỗi nhóm gồm:", "options": ["A. Một cột duy nhất", "B. Hai cột đặt cạnh nhau (hai màu khác nhau)", "C. Ba cột", "D. Không có cột nào"], "answer": "B", "explain": "Trong biểu đồ cột kép, mỗi nhóm gồm hai cột đặt cạnh nhau với hai màu khác nhau."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu “chiều cao của học sinh” thuộc loại:", "options": ["A. Dữ liệu là số", "B. Dữ liệu không phải là số", "C. Không phải là dữ liệu", "D. Dữ liệu hình ảnh"], "answer": "A", "explain": "Chiều cao đo được bằng các con số nên thuộc loại dữ liệu là số."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số học sinh giỏi”: mỗi hình ngôi sao ứng với 2 bạn. Môn Văn có 6 hình ngôi sao. Hỏi có bao nhiêu bạn giỏi Văn?", "options": ["A. 6 bạn", "B. 8 bạn", "C. 12 bạn", "D. 3 bạn"], "answer": "C", "explain": "Môn Văn có 6 hình ngôi sao nên có 6 × 2 = 12 bạn giỏi Văn."}, {"type": "mcq", "level": "TH", "q": "Gieo một con xúc xắc một lần, có bao nhiêu kết quả có thể mà số chấm là số lẻ?", "options": ["A. 2", "B. 4", "C. 6", "D. 3"], "answer": "D", "explain": "Các mặt có số chấm lẻ là 1, 3, 5 chấm, có 3 kết quả."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột kép “Số cây hai lớp trồng được” (xanh: 6A, hồng: 6B; đơn vị: cây). Tháng 1: 6A 12, 6B 15; Tháng 2: 6A 18, 6B 14. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Tháng 1 lớp 6B trồng nhiều hơn lớp 6A 3 cây.", "b) Tháng 2 lớp 6A trồng nhiều hơn lớp 6B 4 cây.", "c) Cả 2 tháng lớp 6A trồng được 30 cây.", "d) Cả 2 tháng lớp 6B trồng được 28 cây."], "answer": ["T", "T", "T", "F"], "explain": "15 − 12 = 3 nên a) đúng; 18 − 14 = 4 nên b) đúng; 12 + 18 = 30 nên c) đúng; 15 + 14 = 29 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Kết quả điều tra “Môn học yêu thích” của 30 bạn: Toán 12 bạn, Văn 10 bạn, Anh 8 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “môn học yêu thích” không phải là dữ liệu số.", "b) Môn Toán được yêu thích nhất.", "c) Số bạn thích Văn nhiều hơn số bạn thích Anh 2 bạn.", "d) Tổng số bạn được hỏi là 32 bạn."], "answer": ["T", "T", "T", "F"], "explain": "Môn học là dữ liệu không phải là số nên a) đúng; Toán (12 bạn) nhiều nhất nên b) đúng; 10 − 8 = 2 nên c) đúng; 12 + 10 + 8 = 30 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Gieo một con xúc xắc 150 lần, mặt 4 chấm xuất hiện 27 lần. Tính xác suất thực nghiệm của sự kiện “Xuất hiện mặt 4 chấm” (viết dưới dạng phần trăm).", "answer": "18%", "explain": "Xác suất thực nghiệm là 27/150 = 0,18 = 18%."}, {"type": "short", "level": "VDC", "q": "Mỗi hình quả táo trong biểu đồ tranh ứng với 6 quả táo. Cửa hàng bán được 8 hình quả táo trong một ngày. Hỏi cửa hàng bán được bao nhiêu quả táo?", "answer": "48", "explain": "Số quả táo bán được là 8 × 6 = 48 quả."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ cột giúp ta:", "options": ["A. Viết văn miêu tả", "B. Giải phương trình", "C. Vẽ tranh phong cảnh", "D. So sánh số liệu giữa các đối tượng một cách trực quan"], "answer": "D", "explain": "Biểu đồ cột giúp so sánh số liệu giữa các đối tượng một cách trực quan."}, {"type": "mcq", "level": "NB", "q": "Phần chú thích trong biểu đồ cột kép cho biết:", "options": ["A. Màu nào ứng với đối tượng nào", "B. Tên người vẽ", "C. Ngày vẽ biểu đồ", "D. Giá tiền của biểu đồ"], "answer": "A", "explain": "Phần chú thích cho biết màu nào ứng với đối tượng nào."}, {"type": "mcq", "level": "NB", "q": "Tung một đồng xu một lần, các kết quả có thể là:", "options": ["A. 1, 2, 3", "B. Đỏ, xanh", "C. Mặt sấp (S), mặt ngửa (N)", "D. Chẵn, lẻ"], "answer": "C", "explain": "Tung đồng xu một lần có 2 kết quả có thể: mặt sấp (S) và mặt ngửa (N)."}, {"type": "mcq", "level": "TH", "q": "Lấy bóng từ hộp 70 lần (mỗi lần lấy xong bỏ lại vào hộp), 28 lần lấy được bóng xanh. Xác suất thực nghiệm của sự kiện “Lấy được bóng xanh” là:", "options": ["A. 70/28", "B. 28/70", "C. 42/70", "D. 28/42"], "answer": "B", "explain": "Số lần lấy được bóng xanh là 28, tổng số lần lấy là 70 nên xác suất thực nghiệm là 28/70."}, {"type": "mcq", "level": "TH", "q": "Dữ liệu nào sau đây là KHÔNG hợp lí?", "options": ["A. Em cao 146 cm", "B. Hôm nay nhiệt độ là 28°C", "C. Lớp em có 41 bạn", "D. Một giờ có 90 phút"], "answer": "D", "explain": "Một giờ chỉ có 60 phút nên “một giờ có 90 phút” là dữ liệu không hợp lí."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số cây các tổ trồng được”: mỗi hình cây ứng với 4 cây. Tổ 1 có 5 hình cây. Hỏi tổ 1 trồng được bao nhiêu cây?", "options": ["A. 20 cây", "B. 5 cây", "C. 9 cây", "D. 25 cây"], "answer": "A", "explain": "Tổ 1 có 5 hình cây nên trồng được 5 × 4 = 20 cây."}, {"type": "truefalse", "level": "VD", "q": "Một hộp có 5 thẻ đánh số từ 1 đến 5. Rút ngẫu nhiên 1 thẻ. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Có 5 kết quả có thể.", "b) Sự kiện “Rút được thẻ số 5” có thể xảy ra.", "c) Sự kiện “Rút được thẻ số 0” có thể xảy ra.", "d) Sự kiện “Rút được thẻ số lẻ” có thể xảy ra hoặc không xảy ra."], "answer": ["T", "T", "F", "T"], "explain": "Có 5 thẻ nên a) đúng; có thẻ số 5 nên b) đúng; không có thẻ số 0 nên c) sai; có thể rút được thẻ lẻ (1, 3, 5) hoặc thẻ chẵn nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột “Chiều cao các bạn” (đơn vị: cm): An 146, Bình 151, Chi 149, Dũng 153. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Bạn Dũng cao nhất.", "b) Bạn An thấp nhất.", "c) Bạn Bình cao hơn bạn Chi 2 cm.", "d) Cả 4 bạn đều cao dưới 150 cm."], "answer": ["T", "T", "T", "F"], "explain": "153 là lớn nhất nên a) đúng; 146 là nhỏ nhất nên b) đúng; 151 − 149 = 2 nên c) đúng; bạn Bình cao 151 cm, bạn Dũng cao 153 cm nên d) sai."}, {"type": "short", "level": "VDC", "q": "Biểu đồ cột kép “Điểm kiểm tra hai bạn” (An: 7, 8, 9 điểm; Bình: 6, 9, 8 điểm). Hỏi cả 3 lần bạn An được bao nhiêu điểm?", "answer": "24", "explain": "Tổng điểm của bạn An là 7 + 8 + 9 = 24 điểm."}, {"type": "short", "level": "VDC", "q": "Tung một đồng xu 250 lần, mặt sấp xuất hiện 130 lần. Tính xác suất thực nghiệm của sự kiện “Xuất hiện mặt sấp” (viết dưới dạng số thập phân).", "answer": "0,52", "explain": "Xác suất thực nghiệm là 130/250 = 0,52."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ cột kép dùng để:", "options": ["A. So sánh hai bộ số liệu với nhau", "B. Viết văn miêu tả", "C. Tính diện tích hình học", "D. Vẽ tranh phong cảnh"], "answer": "A", "explain": "Biểu đồ cột kép dùng để so sánh hai bộ số liệu với nhau."}, {"type": "mcq", "level": "NB", "q": "Một sự kiện trong trò chơi, thí nghiệm:", "options": ["A. Chắc chắn xảy ra", "B. Chắc chắn không xảy ra", "C. Có thể xảy ra hoặc không xảy ra", "D. Không bao giờ được xét đến"], "answer": "C", "explain": "Một sự kiện trong trò chơi, thí nghiệm có thể xảy ra hoặc không xảy ra."}, {"type": "mcq", "level": "NB", "q": "Xác suất thực nghiệm là một số:", "options": ["A. Lớn hơn 1", "B. Từ 0 đến 1", "C. Nhỏ hơn 0", "D. Luôn bằng 2"], "answer": "B", "explain": "Xác suất thực nghiệm là một số từ 0 đến 1."}, {"type": "mcq", "level": "TH", "q": "Bạn An muốn biết chiều cao trung bình của các bạn nữ trong lớp. Dữ liệu bạn An cần thu thập là:", "options": ["A. Tên các bạn nữ", "B. Màu sắc yêu thích của các bạn nữ", "C. Môn học yêu thích của các bạn nữ", "D. Chiều cao của từng bạn nữ trong lớp"], "answer": "D", "explain": "Muốn tính chiều cao trung bình thì phải thu thập số đo chiều cao của từng bạn nữ."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột “Số quyển sách các bạn đọc được”: Mai 9 quyển, Nam 6 quyển, Hoa 12 quyển, Tuấn 8 quyển. Hỏi bạn nào đọc được nhiều sách nhất?", "options": ["A. Hoa", "B. Mai", "C. Nam", "D. Tuấn"], "answer": "A", "explain": "Bạn Hoa đọc được 12 quyển là nhiều nhất."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột kép “Số học sinh giỏi” (xanh: 6A, hồng: 6B). Môn Anh: 6A 5 bạn, 6B 8 bạn. Hỏi lớp 6B nhiều hơn lớp 6A bao nhiêu bạn giỏi Anh?", "options": ["A. 2 bạn", "B. 13 bạn", "C. 3 bạn", "D. 5 bạn"], "answer": "C", "explain": "Hiệu số bạn giỏi là 8 − 5 = 3 bạn."}, {"type": "truefalse", "level": "VD", "q": "Tung một đồng xu 50 lần: mặt sấp xuất hiện 22 lần, mặt ngửa xuất hiện 28 lần. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Xác suất thực nghiệm xuất hiện mặt sấp là 22/50 = 11/25.", "b) 11/25 = 44%.", "c) Xác suất thực nghiệm xuất hiện mặt ngửa là 28/50 = 14/25 = 56%.", "d) 11/25 + 14/25 = 1."], "answer": ["T", "T", "T", "T"], "explain": "22/50 = 11/25 nên a) đúng; 11/25 = 44% nên b) đúng; 28/50 = 14/25 = 56% nên c) đúng; 11/25 + 14/25 = 1 nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Bảng thống kê số giờ tự học trong tuần: An 10 giờ, Bình 12 giờ, Chi 9 giờ, Dũng 11 giờ. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Bạn Bình tự học nhiều nhất.", "b) Bạn Chi tự học ít nhất.", "c) Bạn An ít hơn bạn Dũng 1 giờ.", "d) Cả 4 bạn tự học 40 giờ."], "answer": ["T", "T", "T", "F"], "explain": "12 là lớn nhất nên a) đúng; 9 là nhỏ nhất nên b) đúng; 11 − 10 = 1 nên c) đúng; 10 + 12 + 9 + 11 = 42 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Gieo một con xúc xắc một lần. Có bao nhiêu kết quả có thể mà số chấm xuất hiện là ước của 4?", "answer": "3", "explain": "Các ước của 4 không vượt quá 6 là 1, 2, 4, có 3 kết quả."}, {"type": "short", "level": "VDC", "q": "Biểu đồ cột “Số vé xem phim bán được”: Buổi sáng 55 vé, Buổi chiều 70 vé, Buổi tối 85 vé. Hỏi cả 3 buổi bán được bao nhiêu vé?", "answer": "210", "explain": "Tổng số vé là 55 + 70 + 85 = 210 vé."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Khi gieo một con xúc xắc, có bao nhiêu kết quả có thể?", "options": ["A. 2 kết quả", "B. 6 kết quả", "C. 4 kết quả", "D. 8 kết quả"], "answer": "B", "explain": "Khi gieo một con xúc xắc, có 6 kết quả có thể: 1 đến 6 chấm."}, {"type": "mcq", "level": "NB", "q": "Trong công thức tính xác suất thực nghiệm n/N, N là:", "options": ["A. Số lần sự kiện xuất hiện", "B. Số sự kiện được xét", "C. Số lần sự kiện không xuất hiện", "D. Tổng số lần thực hiện thí nghiệm"], "answer": "D", "explain": "Trong công thức n/N, N là tổng số lần thực hiện thí nghiệm."}, {"type": "mcq", "level": "NB", "q": "Dữ liệu “màu sắc yêu thích” thuộc loại:", "options": ["A. Dữ liệu không phải là số", "B. Dữ liệu là số", "C. Số liệu đo đạc", "D. Không phải là dữ liệu"], "answer": "A", "explain": "Màu sắc là thông tin dạng chữ, không phải con số."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số bạn tham gia câu lạc bộ”: mỗi hình người ứng với 4 bạn. Câu lạc bộ Bóng đá có 7 hình người. Hỏi có bao nhiêu bạn tham gia câu lạc bộ Bóng đá?", "options": ["A. 7 bạn", "B. 11 bạn", "C. 28 bạn", "D. 32 bạn"], "answer": "C", "explain": "Câu lạc bộ Bóng đá có 7 hình người nên có 7 × 4 = 28 bạn tham gia."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột “Lượng mưa các tháng” (đơn vị: mm): Tháng 1 là 25, Tháng 2 là 18, Tháng 3 là 32, Tháng 4 là 20. Hỏi tháng nào mưa ít nhất?", "options": ["A. Tháng 1", "B. Tháng 2", "C. Tháng 3", "D. Tháng 4"], "answer": "B", "explain": "Tháng 2 có lượng mưa 18 mm là ít nhất."}, {"type": "mcq", "level": "TH", "q": "Viết phân số 3/4 dưới dạng phần trăm:", "options": ["A. 34%", "B. 43%", "C. 30%", "D. 75%"], "answer": "D", "explain": "3/4 = 0,75 = 75%."}, {"type": "truefalse", "level": "VD", "q": "Bạn Nam đếm số học sinh đi xe đạp qua cổng trường trong 5 ngày: 120, 135, 128, 140, 132 (bạn). Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Bạn Nam thu thập dữ liệu bằng cách quan sát.", "b) Dữ liệu thu được là dữ liệu số.", "c) Ngày đếm được nhiều học sinh nhất là 140 bạn.", "d) Tổng số lượt xe 5 ngày là 655."], "answer": ["T", "T", "T", "T"], "explain": "Đếm và ghi lại là quan sát nên a) đúng; số học sinh là các con số nên b) đúng; 140 là lớn nhất nên c) đúng; 120 + 135 + 128 + 140 + 132 = 655 nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột kép “Số điểm 10 hai tổ” (xanh: Tổ 1, hồng: Tổ 2). Tuần 1: Tổ 1 được 10, Tổ 2 được 8; Tuần 2: Tổ 1 được 12, Tổ 2 được 11. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Tuần 1 tổ 1 nhiều hơn tổ 2 là 2 điểm 10.", "b) Tuần 2 tổ 1 nhiều hơn tổ 2 là 1 điểm 10.", "c) Cả 2 tuần tổ 1 được 22 điểm 10.", "d) Cả 2 tuần tổ 2 được 20 điểm 10."], "answer": ["T", "T", "T", "F"], "explain": "10 − 8 = 2 nên a) đúng; 12 − 11 = 1 nên b) đúng; 10 + 12 = 22 nên c) đúng; 8 + 11 = 19 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Lấy bóng từ hộp 200 lần (mỗi lần lấy xong bỏ lại vào hộp), 70 lần lấy được bóng trắng. Tính xác suất thực nghiệm của sự kiện “Lấy được bóng trắng” (viết dưới dạng phần trăm).", "answer": "35%", "explain": "Xác suất thực nghiệm là 70/200 = 0,35 = 35%."}, {"type": "short", "level": "VDC", "q": "Mỗi hình ngôi nhà trong biểu đồ tranh ứng với 8 hộ gia đình. Thôn A có 12 hình ngôi nhà. Hỏi thôn A có bao nhiêu hộ gia đình?", "answer": "96", "explain": "Số hộ gia đình của thôn A là 12 × 8 = 96 hộ."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Muốn tính xác suất thực nghiệm, ta cần:", "options": ["A. Đoán kết quả", "B. Viết một bài văn", "C. Thực hiện thí nghiệm nhiều lần và đếm số lần sự kiện xuất hiện", "D. Tưởng tượng trong đầu"], "answer": "C", "explain": "Ta thực hiện thí nghiệm nhiều lần rồi đếm số lần sự kiện xuất hiện."}, {"type": "mcq", "level": "NB", "q": "Khi thu thập dữ liệu, cần:", "options": ["A. Đầy đủ, chính xác, trung thực", "B. Bịa thêm số liệu cho đẹp", "C. Chỉ ghi những số mình thích", "D. Không cần ghi lại"], "answer": "A", "explain": "Khi thu thập dữ liệu cần đầy đủ, chính xác, trung thực và ghi chép cẩn thận."}, {"type": "mcq", "level": "NB", "q": "Các tranh trong cùng một biểu đồ tranh phải:", "options": ["A. Khác nhau hoàn toàn", "B. Vẽ tùy ý theo sở thích", "C. Có thật nhiều màu sắc", "D. Có cùng kích thước"], "answer": "D", "explain": "Các tranh trong cùng một biểu đồ tranh phải có cùng kích thước."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột “Số học sinh giỏi các môn”: Toán 16 bạn, Văn 12 bạn, Anh 14 bạn, Sử 10 bạn. Hỏi môn nào có ít bạn giỏi nhất?", "options": ["A. Toán", "B. Sử", "C. Văn", "D. Anh"], "answer": "B", "explain": "Môn Sử có 10 bạn giỏi là ít nhất."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột kép “Số giờ tự học hai bạn” (xanh: An, hồng: Bình; đơn vị: giờ). Thứ Hai: An 5, Bình 7. Hỏi thứ Hai hai bạn tự học tổng cộng bao nhiêu giờ?", "options": ["A. 5 giờ", "B. 7 giờ", "C. 12 giờ", "D. 2 giờ"], "answer": "C", "explain": "Tổng số giờ thứ Hai là 5 + 7 = 12 giờ."}, {"type": "mcq", "level": "TH", "q": "Một vòng quay được chia thành 5 phần bằng nhau, tô 5 màu khác nhau. Quay một lần, số kết quả có thể là:", "options": ["A. 5", "B. 4", "C. 6", "D. 10"], "answer": "A", "explain": "Có 5 kết quả có thể, mỗi phần một màu."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột “Số cây các lớp trồng được”: 6A trồng 22 cây, 6B trồng 26 cây, 6C trồng 19 cây, 6D trồng 24 cây. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Lớp 6B trồng được nhiều cây nhất.", "b) Lớp 6C trồng được ít cây nhất.", "c) Lớp 6D trồng nhiều hơn lớp 6A 2 cây.", "d) Cả 4 lớp trồng được 91 cây."], "answer": ["T", "T", "T", "T"], "explain": "26 là lớn nhất nên a) đúng; 19 là nhỏ nhất nên b) đúng; 24 − 22 = 2 nên c) đúng; 22 + 26 + 19 + 24 = 91 nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Quay một vòng quay 90 lần, mũi tên chỉ vào màu xanh 36 lần. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Xác suất thực nghiệm chỉ vào màu xanh là 36/90 = 2/5.", "b) 2/5 = 40%.", "c) Xác suất thực nghiệm không chỉ vào màu xanh là 54/90 = 3/5 = 60%.", "d) Xác suất thực nghiệm chỉ vào màu xanh là 36/54."], "answer": ["T", "T", "T", "F"], "explain": "Màu xanh xuất hiện 36 trong 90 lần nên a) đúng; 2/5 = 40% nên b) đúng; 54/90 = 3/5 = 60% nên c) đúng; phải lấy 36 chia cho 90 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Số sách giáo khoa của 4 bạn: 11, 13, 12, 14 (quyển). Hỏi cả 4 bạn có bao nhiêu quyển sách giáo khoa?", "answer": "50", "explain": "Tổng số sách giáo khoa là 11 + 13 + 12 + 14 = 50 quyển."}, {"type": "short", "level": "VDC", "q": "Một hộp có 15 quả bóng đánh số từ 1 đến 15. Lấy ngẫu nhiên 1 quả. Có bao nhiêu kết quả có thể mà số trên quả bóng chia hết cho 5?", "answer": "3", "explain": "Các số chia hết cho 5 từ 1 đến 15 là 5, 10, 15, có 3 kết quả."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Dữ liệu nào sau đây là dữ liệu số?", "options": ["A. Tên bạn bè", "B. Màu áo đồng phục", "C. Quê quán", "D. Điểm kiểm tra"], "answer": "D", "explain": "Điểm kiểm tra là các con số nên là dữ liệu số."}, {"type": "mcq", "level": "NB", "q": "Muốn trình bày dữ liệu bằng hình ảnh trực quan, sinh động, ta dùng:", "options": ["A. Đoạn văn dài", "B. Biểu đồ tranh", "C. Bài thơ", "D. Phép tính"], "answer": "B", "explain": "Biểu đồ tranh trình bày dữ liệu bằng hình ảnh trực quan, sinh động."}, {"type": "mcq", "level": "NB", "q": "Biểu đồ cột gồm:", "options": ["A. Các cột hình chữ nhật có chiều cao tỉ lệ với số liệu", "B. Các hình tròn", "C. Các đoạn văn", "D. Các đường cong"], "answer": "A", "explain": "Biểu đồ cột gồm các cột hình chữ nhật có chiều cao tỉ lệ với số liệu."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột kép “Số vé hai rạp bán được” (xanh: Rạp A, hồng: Rạp B; đơn vị: vé). Ngày 1: A 200, B 180; Ngày 2: A 250, B 220. Hỏi ngày 2 rạp A bán được bao nhiêu vé?", "options": ["A. 200 vé", "B. 180 vé", "C. 250 vé", "D. 220 vé"], "answer": "C", "explain": "Cột xanh của nhóm Ngày 2 gióng sang trục dọc được giá trị 250."}, {"type": "mcq", "level": "TH", "q": "Tung một đồng xu một lần. Sự kiện “Xuất hiện mặt sấp” xảy ra khi:", "options": ["A. Xuất hiện mặt ngửa", "B. Không tung đồng xu", "C. Đồng xu bị mất", "D. Xuất hiện mặt sấp"], "answer": "D", "explain": "Sự kiện xảy ra khi đồng xu xuất hiện mặt sấp."}, {"type": "mcq", "level": "TH", "q": "Rút gọn phân số 36/54 ta được:", "options": ["A. 6/9", "B. 2/3", "C. 18/27", "D. 4/6"], "answer": "B", "explain": "Chia cả tử và mẫu cho 18 ta được 36/54 = 2/3."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột kép “Số vé hai rạp bán được” (xanh: Rạp A, hồng: Rạp B; đơn vị: vé). Ngày 1: A 200, B 180; Ngày 2: A 250, B 220. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Ngày 1 rạp A bán nhiều hơn rạp B 20 vé.", "b) Ngày 2 rạp A bán nhiều hơn rạp B 30 vé.", "c) Cả 2 ngày rạp A bán được 450 vé.", "d) Cả 2 ngày rạp B bán được 410 vé."], "answer": ["T", "T", "T", "F"], "explain": "200 − 180 = 20 nên a) đúng; 250 − 220 = 30 nên b) đúng; 200 + 250 = 450 nên c) đúng; 180 + 220 = 400 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ tranh “Số lít sữa các lớp quyên góp”: mỗi hình hộp sữa ứng với 10 lít sữa. 6A có 5 hình, 6B có 7 hình, 6C có 4 hình. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Lớp 6A quyên góp 50 lít sữa.", "b) Lớp 6B quyên góp 70 lít sữa.", "c) Lớp 6C quyên góp 40 lít sữa.", "d) Lớp 6B quyên góp nhiều hơn lớp 6A 30 lít sữa."], "answer": ["T", "T", "T", "F"], "explain": "6A: 5 × 10 = 50 nên a) đúng; 6B: 7 × 10 = 70 nên b) đúng; 6C: 4 × 10 = 40 nên c) đúng; 70 − 50 = 20 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Biểu đồ cột “Dân số các thôn” (đơn vị: người): Thôn A 450 người, Thôn B 520 người, Thôn C 480 người. Hỏi thôn B đông hơn thôn A bao nhiêu người?", "answer": "70", "explain": "Hiệu dân số là 520 − 450 = 70 người."}, {"type": "short", "level": "VDC", "q": "Gieo một con xúc xắc 400 lần, mặt 3 chấm xuất hiện 68 lần. Tính xác suất thực nghiệm của sự kiện “Xuất hiện mặt 3 chấm” (viết dưới dạng số thập phân).", "answer": "0,17", "explain": "Xác suất thực nghiệm là 68/400 = 0,17."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ tranh và bảng thống kê đều dùng để:", "options": ["A. Trình bày dữ liệu đã thu thập", "B. Vẽ tranh nghệ thuật", "C. Viết truyện ngắn", "D. Soạn nhạc"], "answer": "A", "explain": "Biểu đồ tranh và bảng thống kê đều dùng để trình bày dữ liệu đã thu thập."}, {"type": "mcq", "level": "NB", "q": "Trên biểu đồ cột, để so sánh hai đối tượng ta so sánh:", "options": ["A. Màu sắc của hai cột", "B. Chiều rộng của hai cột", "C. Vị trí của hai cột", "D. Chiều cao của hai cột"], "answer": "D", "explain": "Chiều cao cột tỉ lệ với số liệu nên ta so sánh chiều cao hai cột."}, {"type": "mcq", "level": "NB", "q": "Biểu đồ cột kép có phần chú thích để:", "options": ["A. Trang trí cho đẹp", "B. Ghi điểm số", "C. Biết màu nào ứng với đối tượng nào", "D. Ghi tên trường"], "answer": "C", "explain": "Phần chú thích cho biết màu nào ứng với đối tượng nào."}, {"type": "mcq", "level": "TH", "q": "Gieo một con xúc xắc một lần. Sự kiện “Số chấm xuất hiện là số nguyên tố” có thể xảy ra vì:", "options": ["A. Không có mặt nào là số nguyên tố", "B. Các mặt 2, 3, 5 chấm là số nguyên tố", "C. Chắc chắn gieo được số nguyên tố", "D. Xúc xắc chỉ có các mặt là số nguyên tố"], "answer": "B", "explain": "Các mặt 2, 3, 5 chấm là số nguyên tố nên sự kiện có thể xảy ra."}, {"type": "mcq", "level": "TH", "q": "Tung một đồng xu 70 lần, mặt ngửa xuất hiện 31 lần. Xác suất thực nghiệm của sự kiện “Xuất hiện mặt ngửa” là:", "options": ["A. 31/70", "B. 70/31", "C. 39/70", "D. 31/39"], "answer": "A", "explain": "Số lần xuất hiện mặt ngửa là 31, tổng số lần tung là 70 nên xác suất thực nghiệm là 31/70."}, {"type": "mcq", "level": "TH", "q": "Trong các dữ liệu sau, dữ liệu nào là hợp lí?", "options": ["A. Một ngày có 30 giờ", "B. Tháng Hai có 40 ngày", "C. Bạn học sinh lớp 6 nặng 300 kg", "D. Sáng nay nhiệt độ là 27°C"], "answer": "D", "explain": "Sáng nay nhiệt độ 27°C là hợp lí; các dữ liệu còn lại đều vô lí."}, {"type": "truefalse", "level": "VD", "q": "Gieo một con xúc xắc một lần. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Sự kiện “Số chấm là số nguyên tố” có thể xảy ra.", "b) Sự kiện “Số chấm là 8” không thể xảy ra.", "c) Có 6 kết quả có thể.", "d) Sự kiện “Số chấm nhỏ hơn 1” có thể xảy ra."], "answer": ["T", "T", "T", "F"], "explain": "Các mặt 2, 3, 5 chấm là số nguyên tố nên a) đúng; không có mặt 8 chấm nên b) đúng; có 6 mặt nên c) đúng; số chấm nhỏ nhất là 1 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Tung một đồng xu 70 lần: mặt ngửa xuất hiện 31 lần, mặt sấp xuất hiện 39 lần. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Xác suất thực nghiệm xuất hiện mặt ngửa là 31/70.", "b) Xác suất thực nghiệm xuất hiện mặt sấp là 39/70.", "c) 31/70 + 39/70 = 1.", "d) Xác suất thực nghiệm xuất hiện mặt ngửa là 31/39."], "answer": ["T", "T", "T", "F"], "explain": "Mặt ngửa xuất hiện 31 trong 70 lần nên a) đúng; mặt sấp xuất hiện 39 trong 70 lần nên b) đúng; 31/70 + 39/70 = 1 nên c) đúng; phải lấy 31 chia cho 70 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Biểu đồ cột kép “Số học sinh giỏi hai lớp” (6A: 9, 7, 8 bạn; 6B: 11, 10, 8 bạn). Hỏi hai lớp có bao nhiêu bạn giỏi Toán?", "answer": "20", "explain": "Tổng số bạn giỏi Toán là 9 + 11 = 20 bạn."}, {"type": "short", "level": "VDC", "q": "Nhiệt độ các ngày trong tuần (đơn vị: °C): 30, 32, 31, 33, 32, 34, 31. Hỏi nhiệt độ cao nhất hơn nhiệt độ thấp nhất bao nhiêu độ C?", "answer": "4", "explain": "Nhiệt độ cao nhất 34°C, thấp nhất 30°C. Hiệu là 34 − 30 = 4°C."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ cột và biểu đồ tranh đều là:", "options": ["A. Các bài thơ", "B. Các cách trình bày dữ liệu bằng hình ảnh", "C. Các phép tính", "D. Các câu chuyện"], "answer": "B", "explain": "Biểu đồ cột và biểu đồ tranh đều là các cách trình bày dữ liệu bằng hình ảnh."}, {"type": "mcq", "level": "NB", "q": "Điểm mạnh của biểu đồ cột kép là:", "options": ["A. So sánh trực quan hai bộ số liệu trong cùng một hình", "B. Không cần có số liệu", "C. Vẽ rất nhanh", "D. Ai cũng vẽ đẹp"], "answer": "A", "explain": "Điểm mạnh của biểu đồ cột kép là so sánh trực quan hai bộ số liệu trong cùng một hình."}, {"type": "mcq", "level": "NB", "q": "Gieo một con xúc xắc một lần, số kết quả có thể là:", "options": ["A. 2", "B. 4", "C. 5", "D. 6"], "answer": "D", "explain": "Gieo xúc xắc một lần có 6 kết quả có thể: 1 đến 6 chấm."}, {"type": "mcq", "level": "TH", "q": "Quay một vòng quay 60 lần, mũi tên chỉ vào màu vàng 18 lần. Xác suất thực nghiệm của sự kiện “Mũi tên chỉ vào màu vàng” là:", "options": ["A. 60/18", "B. 42/60", "C. 18/60", "D. 18/42"], "answer": "C", "explain": "Số lần chỉ vào màu vàng là 18, tổng số lần quay là 60 nên xác suất thực nghiệm là 18/60."}, {"type": "mcq", "level": "TH", "q": "Muốn biết “Màu sắc được nhiều bạn trong lớp yêu thích nhất”, cách thu thập dữ liệu phù hợp là:", "options": ["A. Đo chiều cao của các bạn", "B. Lập phiếu hỏi cho tất cả các bạn trong lớp", "C. Đếm số bàn ghế", "D. Quan sát mây trên trời"], "answer": "B", "explain": "Muốn biết sở thích của cả lớp thì lập phiếu hỏi là cách phù hợp."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số kẹo các bạn có”: mỗi hình viên kẹo ứng với 5 cái kẹo. Bạn An có 6 hình viên kẹo. Hỏi bạn An có bao nhiêu cái kẹo?", "options": ["A. 30 cái", "B. 6 cái", "C. 11 cái", "D. 25 cái"], "answer": "A", "explain": "Bạn An có 6 hình viên kẹo nên có 6 × 5 = 30 cái kẹo."}, {"type": "truefalse", "level": "VD", "q": "Kết quả thống kê “Phương tiện đến trường” của 35 bạn: Xe đạp 15 bạn, Đi bộ 12 bạn, Bố mẹ đưa bằng xe máy 8 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Dữ liệu “phương tiện đến trường” không phải là dữ liệu số.", "b) Phương tiện được dùng nhiều nhất là xe đạp.", "c) Số bạn đi bộ nhiều hơn số bạn đi xe máy 4 bạn.", "d) Tổng số bạn được hỏi là 36 bạn."], "answer": ["T", "T", "T", "F"], "explain": "Phương tiện là dữ liệu không phải là số nên a) đúng; xe đạp (15 bạn) nhiều nhất nên b) đúng; 12 − 8 = 4 nên c) đúng; 15 + 12 + 8 = 35 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột “Số học sinh tham gia”: Bóng đá 20 bạn, Cầu lông 14 bạn, Bơi lội 16 bạn, Cờ vua 10 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Bóng đá có nhiều bạn tham gia nhất.", "b) Cờ vua có ít bạn tham gia nhất.", "c) Bóng đá nhiều hơn cầu lông 6 bạn.", "d) Cả 4 môn có 58 bạn tham gia."], "answer": ["T", "T", "T", "F"], "explain": "20 là lớn nhất nên a) đúng; 10 là nhỏ nhất nên b) đúng; 20 − 14 = 6 nên c) đúng; 20 + 14 + 16 + 10 = 60 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Lấy bóng từ hộp 180 lần (mỗi lần lấy xong bỏ lại vào hộp), 72 lần lấy được bóng đen. Tính xác suất thực nghiệm của sự kiện “Lấy được bóng đen” (viết dưới dạng phần trăm).", "answer": "40%", "explain": "Xác suất thực nghiệm là 72/180 = 2/5 = 40%."}, {"type": "short", "level": "VDC", "q": "Một hộp có 20 quả bóng đánh số từ 1 đến 20. Lấy ngẫu nhiên 1 quả. Có bao nhiêu kết quả có thể mà số trên quả bóng là bội của 6?", "answer": "3", "explain": "Các bội của 6 từ 1 đến 20 là 6, 12, 18, có 3 kết quả."}]}]}
