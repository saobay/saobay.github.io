 "B. Ngày tháng năm vẽ", "C. Địa điểm vẽ biểu đồ", "D. Mỗi tranh ứng với bao nhiêu đơn vị"], "answer": "D", "explain": "Phần chú thích cho biết mỗi tranh ứng với bao nhiêu đơn vị."}, {"type": "mcq", "level": "NB", "q": "Bảng thống kê giúp ta:", "options": ["A. Vẽ tranh đẹp", "B. Nhìn dữ liệu gọn gàng, dễ đọc, dễ so sánh", "C. Viết văn hay", "D. Tính diện tích hình học"], "answer": "B", "explain": "Bảng thống kê giúp nhìn dữ liệu một cách gọn gàng, dễ đọc, dễ so sánh."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số cây các lớp trồng được”: mỗi hình cây ứng với 5 cây. Lớp 6B có 5 hình cây. Hỏi lớp 6B trồng được bao nhiêu cây?", "options": ["A. 25 cây", "B. 5 cây", "C. 10 cây", "D. 15 cây"], "answer": "A", "explain": "Lớp 6B có 5 hình cây nên trồng được 5 × 5 = 25 cây."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (mỗi hình cây ứng với 5 cây), lớp 6D có 2 hình cây. Hỏi lớp 6D trồng được bao nhiêu cây?", "options": ["A. 2 cây", "B. 7 cây", "C. 10 cây", "D. 12 cây"], "answer": "C", "explain": "Lớp 6D có 2 hình cây nên trồng được 2 × 5 = 10 cây."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (6A có 3 hình, 6B có 5 hình, 6C có 4 hình, 6D có 2 hình), lớp nào trồng được ít cây nhất?", "options": ["A. Lớp 6A", "B. Lớp 6B", "C. Lớp 6C", "D. Lớp 6D"], "answer": "D", "explain": "Lớp 6D chỉ có 2 hình là ít nhất nên trồng được ít cây nhất."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ tranh “Số cây các lớp trồng được”: mỗi hình cây ứng với 5 cây. Lớp 6A có 3 hình, lớp 6B có 5 hình, lớp 6C có 4 hình, lớp 6D có 2 hình. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Lớp 6A trồng được 15 cây.", "b) Lớp 6C trồng được nhiều hơn lớp 6A 5 cây.", "c) Cả 4 lớp trồng được 70 cây.", "d) Lớp 6B trồng được nhiều cây nhất."], "answer": ["T", "T", "T", "T"], "explain": "6A: 3 × 5 = 15 nên a) đúng; 20 − 15 = 5 nên b) đúng; 15 + 25 + 20 + 10 = 70 nên c) đúng; 6B có 5 hình là nhiều nhất nên d) đúng."}, {"type": "truefalse", "level":  Cộng tất cả các tranh lại với nhau"], "answer": "C", "explain": "Để tìm số liệu, ta đếm số tranh của đối tượng rồi nhân với số đơn vị mỗi tranh (xem chú thích)."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số giờ tự học trong tuần”: mỗi hình đồng hồ ứng với 3 giờ. Bạn Chi có 5 hình đồng hồ. Hỏi bạn Chi tự học bao nhiêu giờ trong tuần?", "options": ["A. 5 giờ", "B. 15 giờ", "C. 8 giờ", "D. 10 giờ"], "answer": "B", "explain": "Bạn Chi có 5 hình đồng hồ nên tự học 5 × 3 = 15 giờ."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (mỗi hình đồng hồ ứng với 3 giờ), bạn An có 4 hình đồng hồ. Hỏi bạn An tự học bao nhiêu giờ trong tuần?", "options": ["A. 4 giờ", "B. 7 giờ", "C. 9 giờ", "D. 12 giờ"], "answer": "D", "explain": "Bạn An có 4 hình đồng hồ nên tự học 4 × 3 = 12 giờ."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (An 4 hình, Bình 3 hình, Chi 5 hình, Dũng 2 hình), bạn nào tự học ít giờ nhất?", "options": ["A. Dũng", "B. An", "C. Bình", "D. Chi"], "answer": "A", "explain": "Bạn Dũng chỉ có 2 hình là ít nhất nên tự học ít giờ nhất."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ tranh “Số giờ tự học trong tuần”: mỗi hình đồng hồ ứng với 3 giờ. Bạn An có 4 hình, bạn Bình có 3 hình, bạn Chi có 5 hình, bạn Dũng có 2 hình. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Bạn Bình tự học 9 giờ trong tuần.", "b) Bạn Chi tự học nhiều giờ nhất.", "c) Bạn An tự học nhiều hơn bạn Bình 3 giờ.", "d) Tổng số giờ tự học của 4 bạn là 40 giờ."], "answer": ["T", "T", "T", "F"], "explain": "Bình: 3 × 3 = 9 nên a) đúng; Chi có 5 hình là nhiều nhất nên b) đúng; 12 − 9 = 3 nên c) đúng; 12 + 9 + 15 + 6 = 42 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Bảng thống kê số điểm 10 trong tuần của các tổ: Tổ 1 được 12 điểm 10, Tổ 2 được 15 điểm 10, Tổ 3 được 9 điểm 10, Tổ 4 được 14 điểm 10. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Tổ 2 có nhiều điểm 10 nhất.", "b) Tổ 3 có ít điểm 10 nhất.", "c) Tổ 1 ít hơn Tổ 4 hai điểm 10.", "d) Cả 4 tổ có 48 điểm 10."], "answer": ["T", "T", "T", "F"], "explain": "15 là lớn nhất nên a) đúng; 9 là nhỏ nhất nên b) đúng; 14 − 12 = 2 nên c) đúng; 12 + 15 + 9 + 14 = 50 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Với biểu đồ tranh “Số giờ tự học trong tuần” (mỗi hình đồng hồ ứng với 3 giờ), bạn Chi có 5 hình, bạn Dũng có 2 hình. Hỏi bạn Chi tự học nhiều hơn bạn Dũng bao nhiêu giờ?", "answer": "9", "explain": "Bạn Chi tự học 5 × 3 = 15 giờ, bạn Dũng tự học 2 × 3 = 6 giờ. Hiệu là 15 − 6 = 9 giờ."}, {"type": "short", "level": "VDC", "q": "Mỗi hình chiếc cúp trong biểu đồ tranh ứng với 2 giải thưởng. Đội bóng của trường giành được 9 hình chiếc cúp. Hỏi đội bóng giành được bao nhiêu giải thưởng?", "answer": "18", "explain": "Số giải thưởng là 9 × 2 = 18 giải."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Dữ liệu sau khi thu thập thường được sắp xếp vào:", "options": ["A. Bảng thống kê", "B. Quyển truyện tranh", "C. Tủ quần áo", "D. Hộp bút"], "answer": "A", "explain": "Dữ liệu sau khi thu thập thường được sắp xếp vào bảng thống kê."}, {"type": "mcq", "level": "NB", "q": "Các tranh trong cùng một biểu đồ tranh phải:", "options": ["A. Khác nhau hoàn toàn", "B. Vẽ tùy ý theo sở thích", "C. Có cùng kích thước", "D. Có thật nhiều màu sắc"], "answer": "C", "explain": "Các tranh trong cùng một biểu đồ tranh phải có cùng kích thước để so sánh chính xác."}, {"type": "mcq", "level": "NB", "q": "Muốn biết mỗi tranh ứng với bao nhiêu đơn vị, ta đọc:", "options": ["A. Tên biểu đồ", "B. Phần chú thích", "C. Khung viền", "D. Tiêu đề của sách"], "answer": "B", "explain": "Phần chú thích cho biết mỗi tranh ứng với bao nhiêu đơn vị."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số bạn tham gia các câu lạc bộ”: mỗi hình người ứng với 3 bạn. Câu lạc bộ Bóng đá có 6 hình người. Hỏi có bao nhiêu bạn tham gia câu lạc bộ Bóng đá?", "options": ["A. 6 bạn", "B. 9 bạn", "C. 12 bạn", "D. 18 bạn"], "answer": "D", "explain": "Câu lạc bộ Bóng đá có 6 hình người nên có 6 × 3 = 18 bạn tham gia."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (mỗi hình người ứng với 3 bạn), câu lạc bộ Âm nhạc có 3 hình người. Hỏi có bao nhiêu bạn tham gia câu lạc bộ Âm nhạc?", "options": ["A. 9 bạn", "B. 3 bạn", "C. 6 bạn", "D. 12 bạn"], "answer": "A", "explain": "Câu lạc bộ Âm nhạc có 3 hình người nên có 3 × 3 = 9 bạn tham gia."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (Bóng đá 6 hình, Cầu lông 4 hình, Mỹ thuật 5 hình, Âm nhạc 3 hình), câu lạc bộ nào có nhiều bạn tham gia nhất?", "options": ["A. Cầu lông", "B. Mỹ thuật", "C. Bóng đá", "D. Âm nhạc"], "answer": "C", "explain": "Câu lạc bộ Bóng đá có 6 hình là nhiều nhất."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ tranh “Số bạn tham gia các câu lạc bộ”: mỗi hình người ứng với 3 bạn. Bóng đá có 6 hình, Cầu lông có 4 hình, Mỹ thuật có 5 hình, Âm nhạc có 3 hình. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Câu lạc bộ Cầu lông có 12 bạn tham gia.", "b) Câu lạc bộ Mỹ thuật có 15 bạn tham gia.", "c) Câu lạc bộ Bóng đá nhiều hơn câu lạc bộ Âm nhạc 9 bạn.", "d) Tổng số bạn tham gia 4 câu lạc bộ là 54 bạn."], "answer": ["T", "T", "T", "T"], "explain": "Cầu lông: 4 × 3 = 12 nên a) đúng; Mỹ thuật: 5 × 3 = 15 nên b) đúng; 18 − 9 = 9 nên c) đúng; 18 + 12 + 15 + 9 = 54 nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Bảng thống kê lượng mưa các ngày trong tuần (đơn vị: mm): Thứ Hai 5, Thứ Ba 0, Thứ Tư 12, Thứ Năm 8, Thứ Sáu 0, Thứ Bảy 3, Chủ nhật 0. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Ngày mưa nhiều nhất là thứ Tư.", "b) Có 3 ngày không mưa.", "c) Lượng mưa thứ Hai ít hơn thứ Bảy 2 mm.", "d) Tổng lượng mưa cả tuần là 28 mm."], "answer": ["T", "T", "F", "T"], "explain": "12 là lớn nhất nên a) đúng; các ngày 0 mm là thứ Ba, thứ Sáu, Chủ nhật nên b) đúng; 5 mm nhiều hơn 3 mm nên c) sai; 5 + 0 + 12 + 8 + 0 + 3 + 0 = 28 nên d) đúng."}, {"type": "short", "level": "VDC", "q": "Với biểu đồ tranh “Số bạn tham gia các câu lạc bộ” (mỗi hình người ứng với 3 bạn), câu lạc bộ Mỹ thuật có 5 hình, câu lạc bộ Cầu lông có 4 hình. Hỏi câu lạc bộ Mỹ thuật nhiều hơn câu lạc bộ Cầu lông bao nhiêu bạn?", "answer": "3", "explain": "Mỹ thuật có 5 × 3 = 15 bạn, Cầu lông có 4 × 3 = 12 bạn. Hiệu là 15 − 12 = 3 bạn."}, {"type": "short", "level": "VDC", "q": "Mỗi hình quyển vở trong biểu đồ tranh ứng với 6 quyển vở. Lớp 6C quyên góp được 7 hình quyển vở. Hỏi lớp 6C quyên góp được bao nhiêu quyển vở?", "answer": "42", "explain": "Số quyển vở quyên góp là 7 × 6 = 42 quyển."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ tranh là loại biểu đồ:", "options": ["A. Chỉ gồm các con số", "B. Dùng hình ảnh (tranh) để thể hiện số liệu", "C. Chỉ gồm lời văn", "D. Chỉ gồm các đường thẳng"], "answer": "B", "explain": "Biểu đồ tranh dùng các hình ảnh (tranh) để thể hiện số liệu."}, {"type": "mcq", "level": "NB", "q": "Trong các bước vẽ biểu đồ tranh, bước cuối cùng là:", "options": ["A. Chọn biểu tượng", "B. Quy ước mỗi tranh ứng với bao nhiêu", "C. Vẽ số tranh tương ứng", "D. Ghi tên biểu đồ và chú thích"], "answer": "D", "explain": "Bước cuối cùng khi vẽ biểu đồ tranh là ghi tên biểu đồ và chú thích."}, {"type": "mcq", "level": "NB", "q": "Bảng thống kê số học sinh thích các môn thể thao cho ta biết:", "options": ["A. Số bạn thích mỗi môn thể thao", "B. Chiều cao của từng bạn", "C. Điểm số của từng bạn", "D. Sở thích ăn uống của từng bạn"], "answer": "A", "explain": "Bảng thống kê này cho biết số bạn thích mỗi môn thể thao."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số học sinh giỏi các môn”: mỗi hình ngôi sao ứng với 2 bạn. Môn Toán có 7 hình ngôi sao. Hỏi có bao nhiêu bạn giỏi môn Toán?", "options": ["A. 7 bạn", "B. 9 bạn", "C. 14 bạn", "D. 16 bạn"], "answer": "C", "explain": "Môn Toán có 7 hình ngôi sao nên có 7 × 2 = 14 bạn giỏi môn Toán."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (mỗi hình ngôi sao ứng với 2 bạn), môn Khoa học có 4 hình ngôi sao. Hỏi có bao nhiêu bạn giỏi môn Khoa học?", "options": ["A. 4 bạn", "B. 8 bạn", "C. 6 bạn", "D. 10 bạn"], "answer": "B", "explain": "Môn Khoa học có 4 hình ngôi sao nên có 4 × 2 = 8 bạn giỏi môn Khoa học."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (Toán 7 hình, Văn 5 hình, Anh 6 hình, Khoa học 4 hình), môn nào có ít bạn giỏi nhất?", "options": ["A. Toán", "B. Văn", "C. Anh", "D. Khoa học"], "answer": "D", "explain": "Môn Khoa học chỉ có 4 hình là ít nhất."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ tranh “Số học sinh giỏi các môn”: mỗi hình ngôi sao ứng với 2 bạn. Toán có 7 hình, Văn có 5 hình, Anh có 6 hình, Khoa học có 4 hình. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Số bạn giỏi môn Văn là 10 bạn.", "b) Số bạn giỏi môn Anh là 12 bạn.", "c) Môn Toán có nhiều bạn giỏi nhất.", "d) Tổng số bạn giỏi 4 môn là 42 bạn."], "answer": ["T", "T", "T", "F"], "explain": "Văn: 5 × 2 = 10 nên a) đúng; Anh: 6 × 2 = 12 nên b) đúng; Toán có 7 hình là nhiều nhất nên c) đúng; 14 + 10 + 12 + 8 = 44 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Bảng thống kê số sách đọc được trong tháng của 4 bạn: Mai 8 quyển, Nam 5 quyển, Hoa 10 quyển, Tuấn 7 quyển. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Bạn Hoa đọc được nhiều sách nhất.", "b) Bạn Nam đọc được ít sách nhất.", "c) Bạn Mai đọc nhiều hơn bạn Tuấn 1 quyển.", "d) Cả 4 bạn đọc được 28 quyển sách."], "answer": ["T", "T", "T", "F"], "explain": "10 là lớn nhất nên a) đúng; 5 là nhỏ nhất nên b) đúng; 8 − 7 = 1 nên c) đúng; 8 + 5 + 10 + 7 = 30 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Với biểu đồ tranh “Số học sinh giỏi các môn” (mỗi hình ngôi sao ứng với 2 bạn), môn Toán có 7 hình, môn Văn có 5 hình. Hỏi môn Toán nhiều hơn môn Văn bao nhiêu bạn giỏi?", "answer": "4", "explain": "Môn Toán có 7 × 2 = 14 bạn, môn Văn có 5 × 2 = 10 bạn. Hiệu là 14 − 10 = 4 bạn."}, {"type": "short", "level": "VDC", "q": "Mỗi hình bông hoa trong biểu đồ tranh ứng với 4 bông hoa điểm tốt. Bạn Lan được 6 hình bông hoa. Hỏi bạn Lan được bao nhiêu bông hoa điểm tốt?", "answer": "24", "explain": "Số bông hoa điểm tốt của bạn Lan là 6 × 4 = 24 bông."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Để so sánh số liệu giữa các đối tượng một cách trực quan, ta có thể dùng:", "options": ["A. Máy tính bỏ túi", "B. Thước kẻ", "C. Biểu đồ tranh", "D. Kính lúp"], "answer": "C", "explain": "Biểu đồ tranh giúp so sánh số liệu giữa các đối tượng một cách trực quan."}, {"type": "mcq", "level": "NB", "q": "Biểu đồ tranh cần có phần chú thích vì:", "options": ["A. Mỗi tranh ứng với một số lượng nhất định, cần ghi rõ để đọc đúng", "B. Để trang trí cho đẹp", "C. Để ghi tên người vẽ", "D. Để ghi ngày tháng"], "answer": "A", "explain": "Mỗi tranh ứng với một số lượng nhất định nên cần chú thích ghi rõ để đọc đúng số liệu."}, {"type": "mcq", "level": "NB", "q": "Đọc bảng thống kê, để tìm số liệu của một đối tượng ta:", "options": ["A. Đoán mò", "B. Hỏi bạn bè", "C. Nhắm mắt chọn bừa", "D. Tìm hàng (hoặc cột) ghi tên đối tượng đó rồi đọc số liệu tương ứng"], "answer": "D", "explain": "Ta tìm hàng (hoặc cột) ghi tên đối tượng rồi đọc số liệu tương ứng ở hàng (hoặc cột) còn lại."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số trứng gà các hộ thu được”: mỗi hình quả trứng ứng với 10 quả trứng. Hộ B có 6 hình quả trứng. Hỏi hộ B thu được bao nhiêu quả trứng?", "options": ["A. 6 quả", "B. 60 quả", "C. 16 quả", "D. 50 quả"], "answer": "B", "explain": "Hộ B có 6 hình quả trứng nên thu được 6 × 10 = 60 quả trứng."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (mỗi hình quả trứng ứng với 10 quả trứng), hộ C có 3 hình quả trứng. Hỏi hộ C thu được bao nhiêu quả trứng?", "options": ["A. 3 quả", "B. 13 quả", "C. 30 quả", "D. 33 quả"], "answer": "C", "explain": "Hộ C có 3 hình quả trứng nên thu được 3 × 10 = 30 quả trứng."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (hộ A 4 hình, hộ B 6 hình, hộ C 3 hình, hộ D 5 hình), hộ nào thu được nhiều trứng nhất?", "options": ["A. Hộ B", "B. Hộ A", "C. Hộ C", "D. Hộ D"], "answer": "A", "explain": "Hộ B có 6 hình là nhiều nhất nên thu được nhiều trứng nhất."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ tranh “Số trứng gà các hộ thu được”: mỗi hình quả trứng ứng với 10 quả trứng. Hộ A có 4 hình, hộ B có 6 hình, hộ C có 3 hình, hộ D có 5 hình. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hộ A thu được 40 quả trứng.", "b) Hộ D thu được 50 quả trứng.", "c) Hộ B thu được nhiều hơn hộ C 30 quả trứng.", "d) Cả 4 hộ thu được 180 quả trứng."], "answer": ["T", "T", "T", "T"], "explain": "Hộ A: 4 × 10 = 40 nên a) đúng; hộ D: 5 × 10 = 50 nên b) đúng; 60 − 30 = 30 nên c) đúng; 40 + 60 + 30 + 50 = 180 nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Bảng thống kê số học sinh của 4 lớp khối 6: 6A có 42 bạn, 6B có 40 bạn, 6C có 43 bạn, 6D có 39 bạn. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Lớp 6C đông nhất.", "b) Lớp 6D ít học sinh nhất.", "c) Lớp 6A nhiều hơn lớp 6B 2 học sinh.", "d) Khối 6 có 164 học sinh."], "answer": ["T", "T", "T", "T"], "explain": "43 là lớn nhất nên a) đúng; 39 là nhỏ nhất nên b) đúng; 42 − 40 = 2 nên c) đúng; 42 + 40 + 43 + 39 = 164 nên d) đúng."}, {"type": "short", "level": "VDC", "q": "Với biểu đồ tranh “Số trứng gà các hộ thu được” (mỗi hình quả trứng ứng với 10 quả trứng), hộ B có 6 hình, hộ A có 4 hình. Hỏi hộ B thu được nhiều hơn hộ A bao nhiêu quả trứng?", "answer": "20", "explain": "Hộ B thu được 6 × 10 = 60 quả, hộ A thu được 4 × 10 = 40 quả. Hiệu là 60 − 40 = 20 quả."}, {"type": "short", "level": "VDC", "q": "Mỗi hình chiếc xe trong biểu đồ tranh ứng với 5 chiếc xe đạp. Bãi xe của trường có 11 hình chiếc xe. Hỏi bãi xe có bao nhiêu chiếc xe đạp?", "answer": "55", "explain": "Số xe đạp trong bãi xe là 11 × 5 = 55 chiếc."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ tranh khác bảng thống kê ở điểm nào?", "options": ["A. Biểu đồ tranh không thể hiện số liệu", "B. Bảng thống kê không có tên", "C. Cả hai đều không dùng được", "D. Biểu đồ tranh dùng hình ảnh để thể hiện số liệu, trực quan và sinh động hơn"], "answer": "D", "explain": "Biểu đồ tranh dùng hình ảnh để thể hiện số liệu nên trực quan, sinh động hơn bảng thống kê."}, {"type": "mcq", "level": "NB", "q": "Khi đếm số tranh trong biểu đồ tranh, ta cần đếm:", "options": ["A. Cả những tranh vẽ trang trí ngoài lề", "B. Chỉ những tranh tượng trưng cho số liệu của đối tượng đang xét", "C. Tất cả mọi hình vẽ có trong trang giấy", "D. Chỉ đếm những tranh màu đỏ"], "answer": "B", "explain": "Ta chỉ đếm những tranh tượng trưng cho số liệu của đối tượng đang xét."}, {"type": "mcq", "level": "NB", "q": "Bảng thống kê điểm kiểm tra của tổ thường có:", "options": ["A. Tên từng bạn và điểm số tương ứng", "B. Hình vẽ chân dung các bạn", "C. Lời nhận xét dài dòng", "D. Chữ kí của phụ huynh"], "answer": "A", "explain": "Bảng thống kê điểm của tổ thường có tên từng bạn và điểm số tương ứng."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số lít nước các thùng chứa được”: mỗi hình giọt nước ứng với 8 lít nước. Thùng 2 có 5 hình giọt nước. Hỏi thùng 2 chứa được bao nhiêu lít nước?", "options": ["A. 5 lít", "B. 13 lít", "C. 40 lít", "D. 45 lít"], "answer": "C", "explain": "Thùng 2 có 5 hình giọt nước nên chứa được 5 × 8 = 40 lít nước."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (mỗi hình giọt nước ứng với 8 lít nước), thùng 4 có 2 hình giọt nước. Hỏi thùng 4 chứa được bao nhiêu lít nước?", "options": ["A. 2 lít", "B. 10 lít", "C. 12 lít", "D. 16 lít"], "answer": "D", "explain": "Thùng 4 có 2 hình giọt nước nên chứa được 2 × 8 = 16 lít nước."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (thùng 1 có 3 hình, thùng 2 có 5 hình, thùng 3 có 4 hình, thùng 4 có 2 hình), thùng nào chứa được ít nước nhất?", "options": ["A. Thùng 1", "B. Thùng 4", "C. Thùng 2", "D. Thùng 3"], "answer": "B", "explain": "Thùng 4 chỉ có 2 hình là ít nhất nên chứa được ít nước nhất."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ tranh “Số lít nước các thùng chứa được”: mỗi hình giọt nước ứng với 8 lít nước. Thùng 1 có 3 hình, thùng 2 có 5 hình, thùng 3 có 4 hình, thùng 4 có 2 hình. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Thùng 1 chứa được 24 lít nước.", "b) Thùng 3 chứa được 32 lít nước.", "c) Thùng 2 chứa nhiều hơn thùng 1 là 16 lít nước.", "d) Cả 4 thùng chứa được 112 lít nước."], "answer": ["T", "T", "T", "T"], "explain": "Thùng 1: 3 × 8 = 24 nên a) đúng; thùng 3: 4 × 8 = 32 nên b) đúng; 40 − 24 = 16 nên c) đúng; 24 + 40 + 32 + 16 = 112 nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Bảng thống kê số giờ ngủ mỗi đêm của 4 bạn: An 8 giờ, Bình 9 giờ, Chi 7 giờ, Dũng 8 giờ. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Bạn Bình ngủ nhiều nhất.", "b) Bạn Chi ngủ ít nhất.", "c) Bạn An và bạn Dũng ngủ số giờ bằng nhau.", "d) Trung bình mỗi bạn ngủ 9 giờ mỗi đêm."], "answer": ["T", "T", "T", "F"], "explain": "9 là lớn nhất nên a) đúng; 7 là nhỏ nhất nên b) đúng; cùng 8 giờ nên c) đúng; trung bình là (8 + 9 + 7 + 8) : 4 = 8 giờ nên d) sai."}, {"type": "short", "level": "VDC", "q": "Với biểu đồ tranh “Số lít nước các thùng chứa được” (mỗi hình giọt nước ứng với 8 lít nước), thùng 2 có 5 hình, thùng 4 có 2 hình. Hỏi thùng 2 chứa được nhiều hơn thùng 4 bao nhiêu lít nước?", "answer": "24", "explain": "Thùng 2 chứa được 5 × 8 = 40 lít, thùng 4 chứa được 2 × 8 = 16 lít. Hiệu là 40 − 16 = 24 lít."}, {"type": "short", "level": "VDC", "q": "Mỗi hình viên gạch trong biểu đồ tranh ứng với 20 viên gạch. Đội thợ xây cần 8 hình viên gạch để xây một bức tường. Hỏi cần bao nhiêu viên gạch để xây bức tường đó?", "answer": "160", "explain": "Số viên gạch cần là 8 × 20 = 160 viên."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ tranh thường được vẽ khi:", "options": ["A. Muốn thể hiện số liệu bằng hình ảnh trực quan, sinh động", "B. Không có số liệu nào", "C. Không biết cách vẽ bảng", "D. Muốn viết một bài văn"], "answer": "A", "explain": "Biểu đồ tranh được vẽ khi muốn thể hiện số liệu bằng hình ảnh trực quan, sinh động."}, {"type": "mcq", "level": "NB", "q": "Số tranh vẽ cho mỗi đối tượng trong biểu đồ tranh phụ thuộc vào:", "options": ["A. Sở thích của người vẽ", "B. Màu sắc có sẵn", "C. Thời tiết hôm vẽ", "D. Số liệu của đối tượng đó và quy ước mỗi tranh ứng với bao nhiêu"], "answer": "D", "explain": "Số tranh vẽ cho mỗi đối tượng phụ thuộc vào số liệu của đối tượng đó và quy ước mỗi tranh ứng với bao nhiêu đơn vị."}, {"type": "mcq", "level": "NB", "q": "Trong bảng thống kê, các số liệu được sắp xếp:", "options": ["A. Lộn xộn tùy ý", "B. Theo ý thích người ghi", "C. Gọn gàng theo hàng và cột, tương ứng với tên đối tượng", "D. Theo thứ tự bảng chữ cái"], "answer": "C", "explain": "Trong bảng thống kê, các số liệu được sắp xếp gọn gàng theo hàng và cột, tương ứng với tên đối tượng."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số lượt điểm tốt các ngày trong tuần”: mỗi hình mặt cười ứng với 5 lượt điểm tốt. Thứ Ba có 6 hình mặt cười. Hỏi thứ Ba có bao nhiêu lượt điểm tốt?", "options": ["A. 6 lượt", "B. 30 lượt", "C. 11 lượt", "D. 25 lượt"], "answer": "B", "explain": "Thứ Ba có 6 hình mặt cười nên có 6 × 5 = 30 lượt điểm tốt."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (mỗi hình mặt cười ứng với 5 lượt điểm tốt), thứ Tư có 3 hình mặt cười. Hỏi thứ Tư có bao nhiêu lượt điểm tốt?", "options": ["A. 15 lượt", "B. 3 lượt", "C. 8 lượt", "D. 20 lượt"], "answer": "A", "explain": "Thứ Tư có 3 hình mặt cười nên có 3 × 5 = 15 lượt điểm tốt."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (thứ Hai 4 hình, thứ Ba 6 hình, thứ Tư 3 hình, thứ Năm 5 hình), ngày nào có ít lượt điểm tốt nhất?", "options": ["A. Thứ Hai", "B. Thứ Ba", "C. Thứ Năm", "D. Thứ Tư"], "answer": "D", "explain": "Thứ Tư chỉ có 3 hình là ít nhất."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ tranh “Số lượt điểm tốt các ngày trong tuần”: mỗi hình mặt cười ứng với 5 lượt điểm tốt. Thứ Hai có 4 hình, thứ Ba có 6 hình, thứ Tư có 3 hình, thứ Năm có 5 hình. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Thứ Hai có 20 lượt điểm tốt.", "b) Thứ Năm có 25 lượt điểm tốt.", "c) Thứ Ba nhiều hơn thứ Tư 15 lượt điểm tốt.", "d) Cả 4 ngày có 90 lượt điểm tốt."], "answer": ["T", "T", "T", "T"], "explain": "Thứ Hai: 4 × 5 = 20 nên a) đúng; thứ Năm: 5 × 5 = 25 nên b) đúng; 30 − 15 = 15 nên c) đúng; 20 + 30 + 15 + 25 = 90 nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Bảng thống kê số truyện tranh của 4 bạn: Hùng 20 quyển, Lan 15 quyển, Mai 25 quyển, Tuấn 10 quyển. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Bạn Mai có nhiều truyện nhất.", "b) Bạn Tuấn có ít truyện nhất.", "c) Bạn Hùng nhiều hơn bạn Lan 5 quyển.", "d) Cả 4 bạn có 68 quyển truyện."], "answer": ["T", "T", "T", "F"], "explain": "25 là lớn nhất nên a) đúng; 10 là nhỏ nhất nên b) đúng; 20 − 15 = 5 nên c) đúng; 20 + 15 + 25 + 10 = 70 nên d) sai."}, {"type": "short", "level": "VDC", "q": "Với biểu đồ tranh “Số lượt điểm tốt các ngày trong tuần” (mỗi hình mặt cười ứng với 5 lượt điểm tốt), thứ Ba có 6 hình, thứ Hai có 4 hình. Hỏi thứ Ba nhiều hơn thứ Hai bao nhiêu lượt điểm tốt?", "answer": "10", "explain": "Thứ Ba có 6 × 5 = 30 lượt, thứ Hai có 4 × 5 = 20 lượt. Hiệu là 30 − 20 = 10 lượt."}, {"type": "short", "level": "VDC", "q": "Mỗi hình chiếc lá trong biểu đồ tranh ứng với 6 cây xanh. Trường trồng được 9 hình chiếc lá. Hỏi trường trồng được bao nhiêu cây xanh?", "answer": "54", "explain": "Số cây xanh trường trồng được là 9 × 6 = 54 cây."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ tranh và bảng thống kê đều dùng để:", "options": ["A. Vẽ tranh nghệ thuật", "B. Trình bày dữ liệu đã thu thập", "C. Viết truyện ngắn", "D. Soạn nhạc"], "answer": "B", "explain": "Biểu đồ tranh và bảng thống kê đều dùng để trình bày dữ liệu đã thu thập."}, {"type": "mcq", "level": "NB", "q": "Ưu điểm của biểu đồ tranh so với bảng số liệu là:", "options": ["A. Trực quan, sinh động, dễ hình dung", "B. Không cần có số liệu", "C. Vẽ nhanh hơn viết số", "D. Không cần phần chú thích"], "answer": "A", "explain": "Ưu điểm của biểu đồ tranh là trực quan, sinh động, dễ hình dung."}, {"type": "mcq", "level": "NB", "q": "Khi vẽ biểu đồ tranh, điều nào sau đây là SAI?", "options": ["A. Chọn biểu tượng phù hợp", "B. Quy ước rõ mỗi tranh ứng với bao nhiêu", "C. Ghi tên biểu đồ", "D. Vẽ số tranh tùy ý, không cần theo số liệu"], "answer": "D", "explain": "Số tranh vẽ phải tương ứng với số liệu của đối tượng, không được vẽ tùy ý."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tranh “Số ki-lô-gam giấy vụn các lớp thu gom”: mỗi hình chồng giấy ứng với 7 kg giấy vụn. Lớp 6C có 6 hình chồng giấy. Hỏi lớp 6C thu gom được bao nhiêu ki-lô-gam giấy vụn?", "options": ["A. 6 kg", "B. 13 kg", "C. 42 kg", "D. 48 kg"], "answer": "C", "explain": "Lớp 6C có 6 hình chồng giấy nên thu gom được 6 × 7 = 42 kg giấy vụn."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (mỗi hình chồng giấy ứng với 7 kg), lớp 6B có 3 hình chồng giấy. Hỏi lớp 6B thu gom được bao nhiêu ki-lô-gam giấy vụn?", "options": ["A. 3 kg", "B. 21 kg", "C. 10 kg", "D. 24 kg"], "answer": "B", "explain": "Lớp 6B có 3 hình chồng giấy nên thu gom được 3 × 7 = 21 kg giấy vụn."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ tranh trên (6A 5 hình, 6B 3 hình, 6C 6 hình, 6D 4 hình), lớp nào thu gom được nhiều giấy vụn nhất?", "options": ["A. Lớp 6C", "B. Lớp 6A", "C. Lớp 6B", "D. Lớp 6D"], "answer": "A", "explain": "Lớp 6C có 6 hình là nhiều nhất."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ tranh “Số ki-lô-gam giấy vụn các lớp thu gom”: mỗi hình chồng giấy ứng với 7 kg. Lớp 6A có 5 hình, lớp 6B có 3 hình, lớp 6C có 6 hình, lớp 6D có 4 hình. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Lớp 6A thu
