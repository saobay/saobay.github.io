êu bạn?", "answer": "12", "explain": "Hiệu số bạn là 24 − 12 = 12 bạn."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Biểu đồ cột còn có thể vẽ theo chiều ngang, khi đó:", "options": ["A. Không đọc được số liệu", "B. Chiều dài mỗi thanh ngang tỉ lệ với số liệu", "C. Các thanh phải vẽ đứng", "D. Không cần vẽ trục"], "answer": "B", "explain": "Biểu đồ cột nằm ngang dùng các thanh ngang có chiều dài tỉ lệ với số liệu."}, {"type": "mcq", "level": "NB", "q": "Khi các số liệu chênh lệch không nhiều, để dễ so sánh ta:", "options": ["A. Nhìn chiều cao các cột", "B. Đoán mò", "C. Bỏ qua không đọc", "D. Vẽ lại tùy ý"], "answer": "A", "explain": "Nhìn chiều cao các cột là cách so sánh trực quan nhất."}, {"type": "mcq", "level": "NB", "q": "Biểu đồ cột KHÔNG thể hiện được:", "options": ["A. Số liệu của từng đối tượng", "B. Đối tượng nào có số liệu lớn nhất", "C. Đối tượng nào có số liệu nhỏ nhất", "D. Sở thích cá nhân của người vẽ"], "answer": "D", "explain": "Biểu đồ cột thể hiện số liệu, không thể hiện sở thích cá nhân của người vẽ."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột “Nhiệt độ các ngày trong tuần” (đơn vị: °C): Thứ Hai 31, Thứ Ba 33, Thứ Tư 32, Thứ Năm 34, Thứ Sáu 33. Hỏi ngày nào nóng nhất?", "options": ["A. Thứ Hai", "B. Thứ Năm", "C. Thứ Ba", "D. Thứ Tư"], "answer": "B", "explain": "Thứ Năm có nhiệt độ 34°C là nóng nhất."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ cột trên, nhiệt độ thứ Hai là:", "options": ["A. 33°C", "B. 34°C", "C. 31°C", "D. 32°C"], "answer": "C", "explain": "Gióng cột “Thứ Hai” sang trục dọc ta đọc được 31°C."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ cột trên, thứ Năm nóng hơn thứ Hai bao nhiêu độ C?", "options": ["A. 3°C", "B. 1°C", "C. 2°C", "D. 4°C"], "answer": "A", "explain": "Hiệu nhiệt độ là 34 − 31 = 3°C."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột “Nhiệt độ các ngày trong tuần” (đơn vị: °C): Thứ Hai 31, Thứ Ba 33, Thứ Tư 32, Thứ Năm 34, Thứ Sáu 33. Xét tính đúng sai của ểu đồ cột thường bắt đầu từ giá trị 0."}, {"type": "mcq", "level": "NB", "q": "Biểu đồ cột “Số bạn thích các môn thể thao” có 4 cột, mỗi cột ứng với:", "options": ["A. 4 bạn", "B. 4 môn thể thao", "C. Một môn thể thao", "D. Một lớp học"], "answer": "C", "explain": "Mỗi cột ứng với một môn thể thao (một đối tượng)."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ cột “Số điểm 10 các tổ”: Tổ 1 được 12 điểm 10, Tổ 2 được 15 điểm 10, Tổ 3 được 9 điểm 10, Tổ 4 được 14 điểm 10. Hỏi tổ nào có nhiều điểm 10 nhất?", "options": ["A. Tổ 2", "B. Tổ 1", "C. Tổ 3", "D. Tổ 4"], "answer": "A", "explain": "Tổ 2 có 15 điểm 10 là nhiều nhất."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ cột trên, tổ 3 có bao nhiêu điểm 10?", "options": ["A. 12 điểm 10", "B. 15 điểm 10", "C. 14 điểm 10", "D. 9 điểm 10"], "answer": "D", "explain": "Gióng cột “Tổ 3” sang trục dọc ta đọc được 9 điểm 10."}, {"type": "mcq", "level": "TH", "q": "Với biểu đồ cột trên, tổ 2 nhiều hơn tổ 3 bao nhiêu điểm 10?", "options": ["A. 3 điểm 10", "B. 6 điểm 10", "C. 5 điểm 10", "D. 4 điểm 10"], "answer": "B", "explain": "Hiệu số điểm 10 là 15 − 9 = 6."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột “Số điểm 10 các tổ”: Tổ 1 được 12 điểm 10, Tổ 2 được 15 điểm 10, Tổ 3 được 9 điểm 10, Tổ 4 được 14 điểm 10. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Cột “Tổ 2” cao nhất.", "b) Cột “Tổ 3” thấp nhất.", "c) Tổ 1 ít hơn tổ 4 là 2 điểm 10.", "d) Cả 4 tổ có 48 điểm 10."], "answer": ["T", "T", "T", "F"], "explain": "15 là lớn nhất nên a) đúng; 9 là nhỏ nhất nên b) đúng; 14 − 12 = 2 nên c) đúng; 12 + 15 + 9 + 14 = 50 nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Biểu đồ cột “Số vé xem phim bán được”: Buổi sáng 45 vé, Buổi chiều 60 vé, Buổi tối 75 vé. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Buổi tối bán được nhiều vé nhất.", "b) Buổi sáng bán được ít vé nhất.", "c) Buổi chiều bán nhiều hơn buổi sáng 15 vé.", "d) Cả 3 buổi bán được 170 vé."], "answer": ["T", "T", "
