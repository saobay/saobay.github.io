 "explain": "$66 = 2 \\cdot 3 \\cdot 11$ với $2, 3, 11$ đều là số nguyên tố. Các cách viết còn lại đều chứa thừa số là hợp số."}, {"type": "mcq", "level": "TH", "q": "Số $81$ viết dưới dạng lũy thừa của thừa số nguyên tố là:", "options": ["A. $3 \\cdot 27$", "B. $9^2$", "C. $3^4$", "D. $9 \\cdot 9$"], "answer": "C", "explain": "$81 = 3 \\cdot 3 \\cdot 3 \\cdot 3 = 3^4$. Các cách viết còn lại đều chứa thừa số là hợp số."}, {"type": "mcq", "level": "TH", "q": "Trong các số $59; 60; 61; 62$, có bao nhiêu số nguyên tố?", "options": ["A. $4$ số", "B. $1$ số", "C. $2$ số", "D. $3$ số"], "answer": "C", "explain": "Trong bốn số, $59$ và $61$ là số nguyên tố; $60$ và $62$ là hợp số. Vậy có $2$ số nguyên tố."}, {"type": "truefalse", "level": "VD", "q": "Cho số $25$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $25 = 5^2$.", "b) $25$ là hợp số.", "c) $25$ có $3$ ước.", "d) $25$ là số nguyên tố."], "answer": ["T", "T", "T", "F"], "explain": "$25 = 5 \\cdot 5$ có các ước là $1, 5, 25$ nên là hợp số, không phải là số nguyên tố."}, {"type": "truefalse", "level": "VD", "q": "Cho số $48 = 2^4 \\cdot 3$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $48$ là hợp số.", "b) $48$ có $10$ ước.", "c) Tổng các thừa số nguyên tố (tính cả số lặp lại) của $48$ bằng $11$.", "d) $48 = 6 \\cdot 8$ là phân tích ra thừa số nguyên tố."], "answer": ["T", "T", "T", "F"], "explain": "$48$ có nhiều hơn hai ước nên là hợp số. Số ước của $48$ là $(4 + 1) \\cdot (1 + 1) = 10$. Tổng các thừa số nguyên tố là $2 + 2 + 2 + 2 + 3 = 11$. $48 = 6 \\cdot 8$ chưa phải là phân tích ra thừa số nguyên tố vì $6$ và $8$ đều là hợp số."}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu số nguyên tố lớn hơn $10$ và nhỏ hơn $30$?", "answer": "6", "explain": "Các số nguyên tố lớn hơn $10$ và nhỏ hơn $30$ là $11, 13, 17, 19, 23, 29$, gồm $6$ số."}, {"type": "short", "level": "VDC", "q": "Cho $a = 2^2 \\cdot 3 \\cdot 5$. Số ước của $a$ bằng bao nhiêu?", "answer": "12", "explain": "Số ướ  tính đúng sai của các khẳng định sau.", "statements": ["a) $49 = 7^2$.", "b) $49$ là hợp số.", "c) $49$ có đúng $3$ ước.", "d) $49$ là số nguyên tố."], "answer": ["T", "T", "T", "F"], "explain": "$49 = 7 \\cdot 7$ có các ước là $1, 7, 49$ nên là hợp số, không phải là số nguyên tố."}, {"type": "truefalse", "level": "VD", "q": "Cho số $120 = 2^3 \\cdot 3 \\cdot 5$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $120$ là hợp số.", "b) $120$ có $16$ ước.", "c) Các thừa số nguyên tố của $120$ là $2, 3$ và $5$.", "d) $120 = 8 \\cdot 15$ là phân tích ra thừa số nguyên tố."], "answer": ["T", "T", "T", "F"], "explain": "$120$ có nhiều hơn hai ước nên là hợp số. Số ước của $120$ là $(3 + 1) \\cdot (1 + 1) \\cdot (1 + 1) = 16$. $120 = 8 \\cdot 15$ chưa phải là phân tích ra thừa số nguyên tố vì $8$ và $15$ đều là hợp số."}, {"type": "short", "level": "VDC", "q": "Hợp số nhỏ nhất có hai chữ số là số nào?", "answer": "10", "explain": "Số nhỏ nhất có hai chữ số là $10$; $10 = 2 \\cdot 5$ có nhiều hơn hai ước nên là hợp số."}, {"type": "short", "level": "VDC", "q": "Cho $b = 3^2 \\cdot 5^2$. Tổng các ước nguyên tố của $b$ bằng bao nhiêu?", "answer": "8", "explain": "Các ước nguyên tố của $b$ là $3$ và $5$. Tổng của chúng là $3 + 5 = 8$."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Số nào sau đây là số nguyên tố?", "options": ["A. $79$", "B. $81$", "C. $85$", "D. $77$"], "answer": "A", "explain": "$79$ chỉ có hai ước là $1$ và $79$ nên là số nguyên tố. Các số còn lại đều là hợp số ($77 = 7 \\cdot 11$, $81 = 9^2$, $85 = 5 \\cdot 17$)."}, {"type": "mcq", "level": "NB", "q": "Số nào sau đây là hợp số?", "options": ["A. $89$", "B. $97$", "C. $83$", "D. $84$"], "answer": "D", "explain": "$84$ là số chẵn lớn hơn $2$ nên có nhiều hơn hai ước, là hợp số. Ba số còn lại đều là số nguyên tố."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây sai?", "options": ["A. Số $3$ là số nguyên tố", "B. Số $0$ không phải là số nguyên tố", "C. Số $1$ không phải là hợp số", "D. Số $2$ là hợp số"], "answer": "D", "explain": "$2$ chỉ có hai ước là $1$ và $2$ nên $2$ là số nguyên tố; khẳng định $2$ là hợp số là sai."}, {"type": "mcq", "level": "TH", "q": "Phân tích số $78$ ra thừa số nguyên tố được kết quả nào sau đây?", "options": ["A. $3 \\cdot 26$", "B. $2 \\cdot 3 \\cdot 13$", "C. $6 \\cdot 13$", "D. $2 \\cdot 39$"], "answer": "B", "explain": "$78 = 2 \\cdot 3 \\cdot 13$ với $2, 3, 13$ đều là số nguyên tố. Các cách viết còn lại đều chứa thừa số là hợp số."}, {"type": "mcq", "level": "TH", "q": "Cho $32 = 2^5$. Số $32$ là số nguyên tố hay hợp số?", "options": ["A. Không xác định được", "B. Số nguyên tố", "C. Hợp số", "D. Không phải số nguyên tố cũng không phải hợp số"], "answer": "C", "explain": "$32$ có nhiều hơn hai ước (ví dụ $1, 2, 4, 32$) nên $32$ là hợp số."}, {"type": "mcq", "level": "TH", "q": "Trong các số $71; 72; 73; 79$, số nào là hợp số?", "options": ["A. $79$", "B. $71$", "C. $72$", "D. $73$"], "answer": "C", "explain": "$72$ là số chẵn lớn hơn $2$ nên là hợp số. Ba số còn lại đều là số nguyên tố."}, {"type": "truefalse", "level": "VD", "q": "Cho số $6$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $6 = 2 \\cdot 3$.", "b) $6$ là hợp số.", "c) $6$ có $4$ ước.", "d) $6$ là số nguyên tố."], "answer": ["T", "T", "T", "F"], "explain": "$6 = 2 \\cdot 3$ có các ước là $1, 2, 3, 6$ nên là hợp số, không phải là số nguyên tố."}, {"type": "truefalse", "level": "VD", "q": "Cho số $150 = 2 \\cdot 3 \\cdot 5^2$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $150$ là hợp số.", "b) $150$ có $12$ ước.", "c) Tổng các thừa số nguyên tố (tính cả số lặp lại) của $150$ bằng $15$.", "d) Các thừa số nguyên tố của $150$ là $2, 3$ và $5$."], "answer": ["T", "T", "T", "T"], "explain": "$150$ có nhiều hơn hai ước nên là hợp số. Số ước của $150$ là $(1 + 1) \\cdot (1 + 1) \\cdot (2 + 1) = 12$. Tổng các thừa số nguyên tố là $2 + 3 + 5 + 5 = 15$."}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu số nguyên tố có hai chữ số?", "answer": "21", "explain": "Có $25$ số nguyên tố nhỏ hơn $100$, trong đó $4$ số có một chữ số là $2, 3, 5, 7$. Vậy có $25 - 4 = 21$ số nguyên tố có hai chữ số."}, {"type": "short", "level": "VDC", "q": "$143$ là hợp số và $143 = 11 \\cdot 13$. Tổng của hai thừa số nguyên tố đó bằng bao nhiêu?", "answer": "24", "explain": "$143 = 11 \\cdot 13$ với $11$ và $13$ đều là số nguyên tố. Tổng của chúng là $11 + 13 = 24$."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. $4$ là số nguyên tố", "B. $2$ là số nguyên tố", "C. $1$ là số nguyên tố", "D. $2$ là hợp số"], "answer": "B", "explain": "$2$ chỉ có hai ước là $1$ và $2$ nên là số nguyên tố. Số $1$ không thuộc loại nào; $4$ là hợp số."}, {"type": "mcq", "level": "NB", "q": "Số nào sau đây là số nguyên tố?", "options": ["A. $97$", "B. $98$", "C. $95$", "D. $96$"], "answer": "A", "explain": "$97$ chỉ có hai ước là $1$ và $97$ nên là số nguyên tố. Các số còn lại đều là hợp số ($95 = 5 \\cdot 19$, $96$ là số chẵn, $98 = 2 \\cdot 49$)."}, {"type": "mcq", "level": "NB", "q": "Số nào sau đây là hợp số?", "options": ["A. $101$", "B. $103$", "C. $107$", "D. $99$"], "answer": "D", "explain": "$99 = 9 \\cdot 11$ có nhiều hơn hai ước nên là hợp số. Ba số còn lại đều là số nguyên tố."}, {"type": "mcq", "level": "TH", "q": "Phân tích số $84$ ra thừa số nguyên tố được kết quả nào sau đây?", "options": ["A. $6 \\cdot 14$", "B. $2^2 \\cdot 3 \\cdot 7$", "C. $4 \\cdot 21$", "D. $2 \\cdot 42$"], "answer": "B", "explain": "$84 = 2 \\cdot 2 \\cdot 3 \\cdot 7 = 2^2 \\cdot 3 \\cdot 7$. Các cách viết còn lại đều chứa thừa số là hợp số."}, {"type": "mcq", "level": "TH", "q": "Số $1000$ viết dưới dạng tích các thừa số nguyên tố là:", "options": ["A. $4 \\cdot 250$", "B. $2 \\cdot 500$", "C. $2^3 \\cdot 5^3$", "D. $10^3$"], "answer": "C", "explain": "$1000 = 2 \\cdot 2 \\cdot 2 \\cdot 5 \\cdot 5 \\cdot 5 = 2^3 \\cdot 5^3$. Các cách viết còn lại đều chứa thừa số là hợp số."}, {"type": "mcq", "level": "TH", "q": "Số $169$ là số nguyên tố hay hợp số?", "options": ["A. Hợp số", "B. Không phải số nguyên tố cũng không phải hợp số", "C. Không xác định được", "D. Số nguyên tố"], "answer": "A", "explain": "$169 = 13 \\cdot 13$ có nhiều hơn hai ước nên $169$ là hợp số."}, {"type": "truefalse", "level": "VD", "q": "Cho số $169$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $169 = 13^2$.", "b) $169$ là hợp số.", "c) $169$ ⋮ $13$.", "d) $169$ có đúng $3$ ước."], "answer": ["T", "T", "T", "T"], "explain": "$169 = 13 \\cdot 13$ có các ước là $1, 13, 169$ nên là hợp số với đúng $3$ ước."}, {"type": "truefalse", "level": "VD", "q": "Cho số $200 = 2^3 \\cdot 5^2$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $200$ là hợp số.", "b) $200$ có $12$ ước.", "c) Tổng các thừa số nguyên tố (tính cả số lặp lại) của $200$ bằng $16$.", "d) $200 = 4 \\cdot 50$ là phân tích ra thừa số nguyên tố."], "answer": ["T", "T", "T", "F"], "explain": "$200$ có nhiều hơn hai ước nên là hợp số. Số ước của $200$ là $(3 + 1) \\cdot (2 + 1) = 12$. Tổng các thừa số nguyên tố là $2 + 2 + 2 + 5 + 5 = 16$. $200 = 4 \\cdot 50$ chưa phải là phân tích ra thừa số nguyên tố vì $4$ và $50$ đều là hợp số."}, {"type": "short", "level": "VDC", "q": "Số nguyên tố lớn nhất nhỏ hơn $50$ là số nào?", "answer": "47", "explain": "$48 = 2 \\cdot 24$ và $49 = 7^2$ đều là hợp số; $47$ chỉ có hai ước là $1$ và $47$ nên là số nguyên tố lớn nhất nhỏ hơn $50$."}, {"type": "short", "level": "VDC", "q": "Cho $c = 2 \\cdot 3^3 \\cdot 5$. Số ước của $c$ bằng bao nhiêu?", "answer": "16", "explain": "Số ước của $c$ là $(1 + 1) \\cdot (3 + 1) \\cdot (1 + 1) = 2 \\cdot 4 \\cdot 2 = 16$."}]}]}
