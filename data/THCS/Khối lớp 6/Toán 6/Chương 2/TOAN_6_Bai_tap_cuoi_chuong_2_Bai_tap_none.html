 6$.", "b) BCNN($a, b$) $= 210$.", "c) $a$ và $b$ là hai số nguyên tố cùng nhau.", "d) ƯC($a, b$) $= \\{1; 2; 3; 6\\}$."], "answer": ["T", "T", "F", "T"], "explain": "Thừa số chung của $a$ và $b$ là $2$ và $3$. ƯCLN $= 2 \\cdot 3 = 6$; BCNN $= 2 \\cdot 3 \\cdot 5 \\cdot 7 = 210$. Vì ƯCLN khác $1$ nên $a$ và $b$ không phải là hai số nguyên tố cùng nhau."}, {"type": "truefalse", "level": "VD", "q": "Cho số $555$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $555$ ⋮ $5$.", "b) $555$ ⋮ $3$.", "c) $555$ ⋮ $9$.", "d) $555$ là hợp số."], "answer": ["T", "T", "F", "T"], "explain": "$555$ có tận cùng là $5$ nên ⋮ $5$. Tổng các chữ số là $15$; $15$ ⋮ $3$ nhưng $15$ ∤ $9$ nên $555$ ⋮ $3$ và $555$ ∤ $9$. $555$ có nhiều hơn hai ước nên là hợp số."}, {"type": "short", "level": "VDC", "q": "Số lớn nhất có hai chữ số chia hết cho $3$ là số nào?", "answer": "99", "explain": "$99$ có tổng các chữ số bằng $18$ ⋮ $3$ nên $99$ ⋮ $3$. Đây là số lớn nhất có hai chữ số."}, {"type": "short", "level": "VDC", "q": "Tìm số tự nhiên $n$ nhỏ nhất khác $0$ sao cho $n$ ⋮ $4$ và $(n + 12)$ ⋮ $6$.", "answer": "12", "explain": "$n$ ⋮ $4$: $4, 8, 12, \\dots$ Thử dần: $4 + 12 = 16$ ∤ $6$; $8 + 12 = 20$ ∤ $6$; $12 + 12 = 24 = 6 \\cdot 4$ ✓. Vậy $n = 12$."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Số nào sau đây chia hết cho $9$?", "options": ["A. $209$", "B. $210$", "C. $207$", "D. $208$"], "answer": "C", "explain": "Tổng các chữ số của $207$ là $9$; $9$ ⋮ $9$ nên $207$ ⋮ $9$. Tổng các chữ số của các số còn lại đều ∤ $9$."}, {"type": "mcq", "level": "NB", "q": "BCNN($5, 8$) bằng bao nhiêu?", "options": ["A. $40$", "B. $80$", "C. $13$", "D. $20$"], "answer": "A", "explain": "$5$ và $8$ là hai số nguyên tố cùng nhau nên BCNN($5, 8$) $= 5 \\cdot 8 = 40$."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. $5$ ⋮ $0$", "B. $0$ ∤ $5$", "C. $5$ ∤ $5$", "D. $0$ ⋮ $5$"], "answer": "D", "explain": "$0 = 5 \\cdot 0$ nên $0$ ⋮ $5$. Không có phép chia cho $0$ nên $5$ ⋮ $0$ sai; $5$ ⋮ $5$ nên hai khẳng định còn lại sai."}, {"type": "mcq", "level": "TH", "q": "ƯCLN($36, 54$) bằng bao nhiêu?", "options": ["A. $18$", "B. $27$", "C. $36$", "D. $9$"], "answer": "A", "explain": "$36 = 2^2 \\cdot 3^2$; $54 = 2 \\cdot 3^3$. Thừa số chung với số mũ nhỏ nhất: $2 \\cdot 3^2 = 18$."}, {"type": "mcq", "level": "TH", "q": "Phân tích số $48$ ra thừa số nguyên tố được kết quả nào sau đây?", "options": ["A. $2^4 \\cdot 3$", "B. $6 \\cdot 8$", "C. $4 \\cdot 12$", "D. $3 \\cdot 16$"], "answer": "A", "explain": "$48 = 2 \\cdot 2 \\cdot 2 \\cdot 2 \\cdot 3 = 2^4 \\cdot 3$. Các cách viết còn lại đều chứa thừa số là hợp số."}, {"type": "mcq", "level": "TH", "q": "Điền chữ số thích hợp vào dấu $*$ để số $7*2$ chia hết cho $3$.", "options": ["A. $2$", "B. $4$", "C. $0$", "D. $1$"], "answer": "C", "explain": "Tổng các chữ số là $7 + * + 2 = 9 + *$. Để số ⋮ $3$ thì $(9 + *)$ ⋮ $3$; trong các đáp án, $* = 0$ cho tổng bằng $9$ ⋮ $3$."}, {"type": "truefalse", "level": "VD", "q": "Cho số $96 = 2^5 \\cdot 3$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $96$ là hợp số.", "b) $96$ ⋮ $6$.", "c) $96$ có $12$ ước.", "d) Tổng các thừa số nguyên tố (tính cả số lặp lại) của $96$ bằng $13$."], "answer": ["T", "T", "T", "T"], "explain": "$96$ có nhiều hơn hai ước nên là hợp số. $96$ ⋮ $6$ vì $96 = 6 \\cdot 16$. Số ước của $96$ là $(5 + 1) \\cdot (1 + 1) = 12$. Tổng các thừa số nguyên tố là $2 + 2 + 2 + 2 + 2 + 3 = 13$."}, {"type": "truefalse", "level": "VD", "q": "Cho hai số $15$ và $28$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) ƯCLN($15, 28$) $= 1$.", "b) BCNN($15, 28$) $= 420$.", "c) $15$ và $28$ là hai số nguyên tố cùng nhau.", "d) ƯC($15, 28$) $= \\{1; 5\\}$."], "answer": ["T", "T", "T", "F"], "explain": "$15 = 3 \\cdot 5$ và $28 = 2^2 \\cdot 7$ không có thừa số nguyên tố chung nên ƯCLN $= 1$ và BCNN $= 3 \\cdot 5 \\cdot 2^2 \\cdot 7 = 420$. Ước chung duy nhất là $1$."}, {"type": "short", "level": "VDC", "q": "Số $36$ có bao nhiêu ước?", "answer": "9", "explain": "$36 = 2^2 \\cdot 3^2$ nên số ước của $36$ là $(2 + 1) \\cdot (2 + 1) = 9$."}, {"type": "short", "level": "VDC", "q": "Một số có hai chữ số vừa chia hết cho $9$ vừa chia hết cho $5$. Số lớn nhất thỏa mãn là số nào?", "answer": "90", "explain": "Số ⋮ $5$ có hai chữ số lớn nhất là $95$ (∤ $9$); giảm dần: $90$ có tổng các chữ số bằng $9$ ⋮ $9$. Vậy số cần tìm là $90$."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Số nào sau đây chia hết cho cả $2$ và $3$?", "options": ["A. $135$", "B. $132$", "C. $133$", "D. $134$"], "answer": "B", "explain": "$132$ là số chẵn nên ⋮ $2$; tổng các chữ số là $6$ ⋮ $3$ nên ⋮ $3$. Các số còn lại không thỏa mãn cả hai điều kiện."}, {"type": "mcq", "level": "NB", "q": "Số nào sau đây là số nguyên tố?", "options": ["A. $93$", "B. $95$", "C. $97$", "D. $91$"], "answer": "C", "explain": "$97$ chỉ có hai ước là $1$ và $97$ nên là số nguyên tố. Các số còn lại đều là hợp số ($91 = 7 \\cdot 13$, $93 = 3 \\cdot 31$, $95 = 5 \\cdot 19$)."}, {"type": "mcq", "level": "NB", "q": "ƯCLN($12, 30$) bằng bao nhiêu?", "options": ["A. $12$", "B. $15$", "C. $3$", "D. $6$"], "answer": "D", "explain": "$12 = 2^2 \\cdot 3$; $30 = 2 \\cdot 3 \\cdot 5$. Thừa số chung với số mũ nhỏ nhất: $2 \\cdot 3 = 6$."}, {"type": "mcq", "level": "TH", "q": "BCNN($9, 12$) bằng bao nhiêu?", "options": ["A. $18$", "B. $36$", "C. $72$", "D. $108$"], "answer": "B", "explain": "$9 = 3^2$; $12 = 2^2 \\cdot 3$. Thừa số chung và riêng với số mũ lớn nhất: $2^2 \\cdot 3^2 = 36$."}, {"type": "mcq", "level": "TH", "q": "Không thực hiện phép tính, cho biết tổng $(30 + 12 + 18)$ có chia hết cho $6$ không?", "options": ["A. Không, vì $30$ ∤ $6$", "B. Không, vì $12$ ∤ $6$", "C. Không, vì $18$ ∤ $6$", "D. Có, vì mỗi số hạng đều ⋮ $6$"], "answer": "D", "explain": "$30, 12, 18$ đều ⋮ $6$ nên theo tính chất mở rộng, tổng ⋮ $6$."}, {"type": "mcq", "level": "TH", "q": "Số $2^3 \\cdot 3^2$ bằng bao nhiêu?", "options": ["A. $36$", "B. $108$", "C. $48$", "D. $72$"], "answer": "D", "explain": "$2^3 \\cdot 3^2 = 8 \\cdot 9 = 72$."}, {"type": "truefalse", "level": "VD", "q": "Cho số $60 = 2^2 \\cdot 3 \\cdot 5$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $60$ là hợp số.", "b) $60$ có $12$ ước.", "c) BCNN($60, 90$) $= 180$.", "d) ƯCLN($60, 90$) $= 30$."], "answer": ["T", "T", "T", "T"], "explain": "$60$ có nhiều hơn hai ước nên là hợp số. Số ước của $60$ là $(2 + 1) \\cdot (1 + 1) \\cdot (1 + 1) = 12$. $90 = 2 \\cdot 3^2 \\cdot 5$ nên BCNN($60, 90$) $= 2^2 \\cdot 3^2 \\cdot 5 = 180$ và ƯCLN($60, 90$) $= 2 \\cdot 3 \\cdot 5 = 30$."}, {"type": "truefalse", "level": "VD", "q": "Cho số $1001$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $1001$ ∤ $2$.", "b) $1001$ ⋮ $7$.", "c) $1001 = 7 \\cdot 11 \\cdot 13$.", "d) $1001$ là số nguyên tố."], "answer": ["T", "T", "T", "F"], "explain": "$1001$ lẻ nên ∤ $2$. Ta có $1001 = 7 \\cdot 11 \\cdot 13$ nên $1001$ ⋮ $7$ và $1001$ là hợp số, không phải là số nguyên tố."}, {"type": "short", "level": "VDC", "q": "Số nhỏ nhất có bốn chữ số chia hết cho $3$ là số nào?", "answer": "1002", "explain": "Số nhỏ nhất có bốn chữ số là $1000$, tổng các chữ số bằng $1$ ∤ $3$. Tăng dần: $1001$ có tổng bằng $2$ ∤ $3$; $1002$ có tổng bằng $3$ ⋮ $3$."}, {"type": "short", "level": "VDC", "q": "ƯCLN($48, 80$) bằng bao nhiêu?", "answer": "16", "explain": "$48 = 2^4 \\cdot 3$; $80 = 2^4 \\cdot 5$. Thừa số chung với số mũ nhỏ nhất: $2^4 = 16$."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Số nào sau đây chia hết cho $10$?", "options": ["A. $110$", "B. $115$", "C. $125$", "D. $105$"], "answer": "A", "explain": "$110$ có chữ số tận cùng là $0$ nên $110$ ⋮ $10$. Các số còn lại có tận cùng khác $0$ nên ∤ $10$."}, {"type": "mcq", "level": "NB", "q": "BCNN($7, 9$) bằng bao nhiêu?", "options": ["A. $63$", "B. $16$", "C. $7$", "D. $9$"], "answer": "A", "explain": "$7$ và $9$ là hai số nguyên tố cùng nhau nên BCNN($7, 9$) $= 7 \\cdot 9 = 63$."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây sai?", "options": ["A. $18$ là hợp số", "B. $19$ là số nguyên tố", "C. $20$ là số nguyên tố", "D. $17$ là số nguyên tố"], "answer": "C", "explain": "$20 = 2 \\cdot 10$ có nhiều hơn hai ước nên $20$ là hợp số; khẳng định $20$ là số nguyên tố là sai."}, {"type": "mcq", "level": "TH", "q": "ƯCLN($42, 70$) bằng bao nhiêu?", "options": ["A. $21$", "B. $35$", "C. $7$", "D. $14$"], "answer": "D", "explain": "$42 = 2 \\cdot 3 \\cdot 7$; $70 = 2 \\cdot 5 \\cdot 7$. Thừa số chung với số mũ nhỏ nhất: $2 \\cdot 7 = 14$."}, {"type": "mcq", "level": "TH", "q": "Không thực hiện phép tính, cho biết hiệu $(100 - 40)$ có chia hết cho $20$ không?", "options": ["A. Có, vì $100$ ⋮ $20$ và $40$ ⋮ $20$", "B. Không, vì $100$ ∤ $20$", "C. Không, vì $40$ ∤ $20$", "D. Không kết luận được"], "answer": "A", "explain": "Cả số bị trừ và số trừ đều ⋮ $20$ nên theo tính chất của hiệu, $(100 - 40)$ ⋮ $20$."}, {"type": "mcq", "level": "TH", "q": "Quy đồng mẫu số hai phân số $\\frac{1}{8}$ và $\\frac{1}{12}$, mẫu số chung nhỏ nhất là:", "options": ["A. $24$", "B. $12$", "C. $48$", "D. $8$"], "answer": "A", "explain": "Mẫu số chung nhỏ nhất chính là BCNN($8, 12$) $= 24$."}, {"type": "truefalse", "level": "VD", "q": "Cho số $84 = 2^2 \\cdot 3 \\cdot 7$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $84$ là hợp số.", "b) $84$ có $12$ ước.", "c) $84$ ⋮ $7$.", "d) Tổng các ước nguyên tố của $84$ bằng $12$."], "answer": ["T", "T", "T", "T"], "explain": "$84$ có nhiều hơn hai ước nên là hợp số. Số ước của $84$ là $(2 + 1) \\cdot (1 + 1) \\cdot (1 + 1) = 12$. $84$ ⋮ $7$ vì có thừa số $7$. Tổng các ước nguyên tố là $2 + 3 + 7 = 12$."}, {"type": "truefalse", "level": "VD", "q": "Cho số $7777$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $7777$ ∤ $2$.", "b) $7777$ ∤ $5$.", "c) Tổng các chữ số của $7777$ bằng $28$.", "d) $7777$ ⋮ $3$."], "answer": ["T", "T", "T", "F"], "explain": "$7777$ lẻ nên ∤ $2$; tận cùng là $7$ nên ∤ $5$. Tổng các chữ số là $28$; $28$ ∤ $3$ nên $7777$ ∤ $3$."}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu hợp số có một chữ số?", "answer": "4", "explain": "Các hợp số có một chữ số là $4, 6, 8, 9$, gồm $4$ số."}, {"type": "short", "level": "VDC", "q": "BCNN($12, 18, 24$) bằng bao nhiêu?", "answer": "72", "explain": "$12 = 2^2 \\cdot 3$; $18 = 2 \\cdot 3^2$; $24 = 2^3 \\cdot 3$. Thừa số chung và riêng với số mũ lớn nhất: $2^3 \\cdot 3^2 = 72$."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Số nào sau đây chia hết cho $3$ nhưng không chia hết cho $9$?", "options": ["A. $126$", "B. $102$", "C. $108$", "D. $117$"], "answer": "B", "explain": "$102$ có tổng các chữ số bằng $3$; $3$ ⋮ $3$ nhưng $3$ ∤ $9$ nên $102$ ⋮ $3$ và $102$ ∤ $9$. Ba số còn lại đều có tổng các chữ số ⋮ $9$."}, {"type": "mcq", "level": "NB", "q": "ƯCLN($16, 20$) bằng bao nhiêu?", "options": ["A. $4$", "B. $8$", "C. $10$", "D. $2$"], "answer": "A", "explain": "$16 = 2^4$; $20 = 2^2 \\cdot 5$. Thừa số chung với số mũ nhỏ nhất: $2^2 = 4$."}, {"type": "mcq", "level": "NB", "q": "Số nào sau đây là hợp số?", "options": ["A. $103$", "B. $107$", "C. $101$", "D. $102$"], "answer": "D", "explain": "$102 = 2 \\cdot 3 \\cdot 17$ có nhiều hơn hai ước nên là hợp số. Ba số còn lại đều là số nguyên tố."}, {"type": "mcq", "level": "TH", "q": "BCNN($12, 16$) bằng bao nhiêu?", "options": ["A. $192$", "B. $24$", "C. $48$", "D. $96$"], "answer": "C", "explain": "$12 = 2^2 \\cdot 3$; $16 = 2^4$. Thừa số chung và riêng với số mũ lớn nhất: $2^4 \\cdot 3 = 48$."}, {"type": "mcq", "level": "TH", "q": "Không thực hiện phép tính, cho biết tổng $(25 + 35)$ có chia hết cho $5$ không?", "options": ["A. Không kết luận được", "B. Có, vì $25$ ⋮ $5$ và $35$ ⋮ $5$", "C. Không, vì $25$ ∤ $5$", "D. Không, vì $35$ ∤ $5$"], "answer": "B", "explain": "Cả hai số hạng đều ⋮ $5$ nên theo tính chất 1, tổng ⋮ $5$."}, {"type": "mcq", "level": "TH", "q": "Phân tích số $75$ ra thừa số nguyên tố được kết quả nào sau đây?", "options": ["A. $15 \\cdot 5$", "B. $3 \\cdot 25$", "C. $5^3$", "D. $3 \\cdot 5^2$"], "answer": "D", "explain": "$75 = 3 \\cdot 5 \\cdot 5 = 3 \\cdot 5^2$. Các cách viết còn lại đều chứa thừa số là hợp số."}, {"type": "truefalse", "level": "VD", "q": "Cho $a = 48 = 2^4 \\cdot 3$ và $b = 60 = 2^2 \\cdot 3 \\cdot 5$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) ƯCLN($a, b$) $= 12$.", "b) BCNN($a, b$) $= 240$.", "c) ƯC($a, b$) $= \\{1; 2; 3; 4; 6; 12\\}$.", "d) $a$ và $b$ là hai số nguyên tố cùng nhau."], "answer": ["T", "T", "T", "F"], "explain": "ƯCLN($48, 60$) $= 2^2 \\cdot 3 = 12$; BCNN($48, 60$) $= 2^4 \\cdot 3 \\cdot 5 = 240$. Các ước chung chính là các ước của $12$. Vì ƯCLN khác $1$ nên $a$ và $b$ không phải là hai số nguyên tố cùng nhau."}, {"type": "truefalse", "level": "VD", "q": "Cho số $30303$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $30303$ ∤ $2$.", "b) $30303$ ⋮ $3$.", "c) Tổng các chữ số của $30303$ bằng $9$.", "d) $30303$ ⋮ $9$."], "answer": ["T", "T", "T", "T"], "explain": "$30303$ lẻ nên ∤ $2$. Tổng các chữ số là $9$; $9$ ⋮ $9$ (do đó cũng ⋮ $3$) nên $30303$ ⋮ $3$ và ⋮ $9$."}, {"type": "short", "level": "VDC", "q": "Số lớn nhất có ba chữ số chia hết cho $5$ là số nào?", "answer": "995", "explain": "Số lớn nhất có ba chữ số là $999$ (∤ $5$). Giảm dần: $998, 997, 996$ đều ∤ $5$; $995$ có tận cùng là $5$ nên ⋮ $5$."}, {"type": "short", "level": "VDC", "q": "Tìm số tự nhiên $a$ nhỏ nhất khác $0$ sao cho $a$ ⋮ $10$ và $(a + 30)$ ⋮ $15$.", "answer": "30", "explain": "$a$ ⋮ $10$: $10, 20, 30, \\dots$ Thử dần: $10 + 30 = 40$ ∤ $15$; $20 + 30 = 50$ ∤ $15$; $30 + 30 = 60 = 15 \\cdot 4$ ✓. Vậy $a = 30$."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Số nào sau đây là số nguyên tố?", "options": ["A. $111$", "B. $112$", "C. $113$", "D. $114$"], "answer": "C", "explain": "$113$ chỉ có hai ước là $1$ và $113$ nên là số nguyên tố. Các số còn lại đều là hợp số ($111 = 3 \\cdot 37$, $112$ và $114$ là số chẵn)."}, {"type": "mcq", "level": "NB", "q": "BCNN($10, 12$) bằng bao nhiêu?", "options": ["A. $120$", "B. $20$", "C. $30$", "D. $60$"], "answer": "D", "explain": "$10 = 2 \\cdot 5$; $12 = 2^2 \\cdot 3$. Thừa số chung và riêng với số mũ lớn nhất: $2^2 \\cdot 3 \\cdot 5 = 60$."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. $24$ ∤ $8$", "B. $24$ ⋮ $6$", "C. $24$ ∤ $6$", "D. $24$ ⋮ $5$"], "answer": "B", "explain": "$24 = 6 \\cdot 4$ nên $24$ ⋮ $6$ (và cũng ⋮ $8$); các khẳng định còn lại đều sai."}, {"type": "mcq", "level": "TH", "q": "ƯCLN($45, 60$) bằng bao nhiêu?", "options": ["A. $30$", "B. $45$", "C. $5$", "D. $15$"], "answer": "D", "explain": "$45 = 3^2 \\cdot 5$; $60 = 2^2 \\cdot 3 \\cdot 5$. Thừa số chung với số mũ nhỏ nhất: $3 \\cdot 5 = 15$."}, {"type": "mcq", "level": "TH", "q": "Số nào sau đây chia hết cho $9$?", "options": ["A. $1008$", "B. $1010$", "C. $1012$", "D. $1014$"], "answer": "A", "explain": "Tổng các chữ số của $1008$ là $9$; $9$ ⋮ $9$ nên $1008$ ⋮ $9$. Tổng các chữ số của các số còn lại đều ∤ $9$."}, {"type": "mcq", "level": "TH", "q": "Không thực hiện phép tính, cho biết hiệu $(81 - 27)$ có chia hết cho $9$ không?", "options": ["A. Không, vì $81$ ∤ $9$", "B. Không, vì $27$ ∤ $9$", "C. Không kết luận được", "D. Có, vì $81$ ⋮ $9$ và $27$ ⋮ $9$"], "answer": "D", "explain": "Cả số bị trừ và số trừ đều ⋮ $9$ nên theo tính chất của hiệu, $(81 - 27)$ ⋮ $9$."}, {"type": "truefalse", "level": "VD", "q": "Cho số $100 = 2^2 \\cdot 5^2$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $100$ là hợp số.", "b) $100$ có $9$ ước.", "c) $100$ ⋮ $4$.", "d) ƯCLN($100, 150$) $= 50$."], "answer": ["T", "T", "T", "T"], "explain": "$100$ có nhiều hơn hai ước nên là hợp số. Số ước của $100$ là $(2 + 1) \\cdot (2 + 1) = 9$. $100 = 4 \\cdot 25$ nên ⋮ $4$. $150 = 2 \\cdot 3 \\cdot 5^2$ nên ƯCLN($100, 150$) $= 2 \\cdot 5^2 = 50$."}, {"type": "truefalse", "level": "VD", "q": "Cho số $24680$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $24680$ ⋮ $2$.", "b) $24680$ ⋮ $5$.", "c) $24680$ ⋮ $10$.", "d) $24680$ ⋮ $3$."], "answer": ["T", "T", "T", "F"], "explain": "$24680$ có tận cùng là $0$ nên ⋮ $2$, ⋮ $5$ và ⋮ $10$. Tổng các chữ số là $20$; $20$ ∤ $3$ nên $24680$ ∤ $3$."}, {"type": "short", "level": "VDC", "q": "Số $60$ có bao nhiêu ước nguyên tố?", "answer": "3", "explain": "$60 = 2^2 \\cdot 3 \\cdot 5$ nên các ước nguyên tố của $60$ là $2, 3, 5$, gồm $3$ ước."}, {"type": "short", "level": "VDC", "q": "Một đội văn nghệ có $24$ bạn nam và $36$ bạn nữ, chia thành các nhóm sao cho số bạn nam và số bạn nữ ở mỗi nhóm đều bằng nhau, số nhóm là nhiều nhất. Mỗi nhóm có mấy bạn nam?", "answer": "2", "explain": "Số nhóm nhiều nhất là ƯCLN($24, 36$) $= 12$. Mỗi nhóm có $24 : 12 = 2$ bạn nam."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Số nào sau đây chia hết cho cả $2$ và $5$?", "options": ["A. $130$", "B. $135$", "C. $145$", "D. $125$"], "answer": "A", "explain": "Số ⋮ cả $2$ và $5$ phải có tận cùng là $0$. Trong bốn số, chỉ có $130$ thỏa mãn."}, {"type": "mcq", "level": "NB", "q": "ƯCLN($18, 45$) bằng bao nhiêu?", "options": ["A. $15$", "B. $18$", "C. $3$", "D. $9$"], "answer": "D", "explain": "$18 = 2 \\cdot 3^2$; $45 = 3^2 \\cdot 5$. Thừa số chung với số mũ nhỏ nhất: $3^2 = 9$."}, {"type": "mcq", "level": "NB", "q": "Số nào sau đây là số nguyên tố?", "options": ["A. $122$", "B. $123$", "C. $127$", "D. $121$"], "answer": "C", "explain": "$127$ chỉ có hai ước là $1$ và $127$ nên là số nguyên tố. Các số còn lại đều là hợp số ($121 = 11^2$, $122$ là số chẵn, $123 = 3 \\cdot 41$)."}, {"type": "mcq", "level": "TH", "q": "BCNN($14, 35$) bằng bao nhiêu?", "options": ["A. $35$", "B. $70$", "C. $140$", "D. $490$"], "answer": "B", "explain": "$14 = 2 \\cdot 7$; $35 = 5 \\cdot 7$. Thừa số chung và riêng với số mũ lớn nhất: $2 \\cdot 5 \\cdot 7 = 70$."}, {"type": "mcq", "level": "TH", "q": "Không thực hiện phép tính, cho biết tổng $(16 + 24 + 32)$ có chia hết cho $8$ không?", "options": ["A. Không, vì $24$ ∤ $8$", "B. Không, vì $32$ ∤ $8$", "C. Có, vì mỗi số hạng đều ⋮ $8$", "D. Không, vì $16$ ∤ $8$"], "answer": "C", "explain": "$16, 24, 32$ đều ⋮ $8$ nên theo tính chất mở rộng, tổng ⋮ $8$."}, {"type": "mcq", "level": "TH", "q": "Rút gọn phân số $\\frac{45}{60}$ được phân số tối giản nào sau đây?", "options": ["A. $\\frac{15}{20}$", "B. $\\frac{3}{4}$", "C. $\\frac{4}{3}$", "D. $\\frac{9}{12}$"], "answer": "B", "explain": "ƯCLN($45, 60$) $= 15$ nên chia cả tử và mẫu cho $15$: $\\frac{45}{60} = \\frac{3}{4}$."}, {"type": "truefalse", "level": "VD", "q": "Cho $a = 90 = 2 \\cdot 3^2 \\cdot 5$ và $b = 120 = 2^3 \\cdot 3 \\cdot 5$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) ƯCLN($a, b$) $= 30$.", "b) BCNN($a, b$) $= 360$.", "c) ƯC($a, b$) $= \\{1; 2; 3; 5; 6; 10; 15; 30\\}$.", "d) BC($a, b$) $= \\{0; 360; 720; \\dots\\}$."], "answer": ["T", "T", "T", "T"], "explain": "ƯCLN($90, 120$) $= 2 \\cdot 3 \\cdot 5 = 30$; BCNN($90, 120$) $= 2^3 \\cdot 3^2 \\cdot 5 = 360$. Các ước chung chính là các ước của $30$; các bội chung đều là bội của $360$."}, {"type": "truefalse", "level": "VD", "q": "Cho số $99999$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $99999$ ∤ $2$.", "b) $99999$ ⋮ $5$.", "c) Tổng các chữ số của $99999$ bằng $45$.", "d) $99999$ ⋮ $9$."], "answer": ["T", "F", "T", "T"], "explain": "$99999$ lẻ nên ∤ $2$; tận cùng là $9$ nên ∤ $5$. Tổng các chữ số là $45$; $45$ ⋮ $9$ nên $99999$ ⋮ $9$."}, {"type": "short", "level": "VDC", "q": "Số nhỏ nhất có hai chữ số vừa chia hết cho $3$ vừa chia hết cho $5$ là số nào?", "answer": "15", "explain": "Số vừa ⋮ $3$ vừa ⋮ $5$ thì ⋮ $15$. Số nhỏ nhất có hai chữ số ⋮ $15$ là $15$."}, {"type": "short", "level": "VDC", "q": "BCNN($20, 30, 40$) bằng bao nhiêu?", "answer": "120", "explain": "$20 = 2^2 \\cdot 5$; $30 = 2 \\cdot 3 \\cdot 5$; $40 = 2^3 \\cdot 5$. Thừa số chung và riêng với số mũ lớn nhất: $2^3 \\cdot 3 \\cdot 5 = 120$."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Số nào sau đây chia hết cho $6$?", "options": ["A. $130$", "B. $132$", "C. $134$", "D. $136$"], "answer": "B", "explain": "$132$ là số chẵn nên ⋮ $2$; tổng các chữ số là $6$ ⋮ $3$ nên ⋮ $3$; do đó $132$ ⋮ $6$. Các số còn lại đều là số lẻ nên ∤ $6$."}, {"type": "mcq", "level": "NB", "q": "BCNN($16, 20$) bằng bao nhiêu?", "options": ["A. $80$", "B. $160$", "C. $20$", "D. $40$"], "answer": "A", "explain": "$16 = 2^4$; $20 = 2^2 \\cdot 5$. Thừa số chung và riêng với số mũ lớn nhất: $2^4 \\cdot 5 = 80$."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây sai?", "options": ["A. $4$ là hợp số", "B. $1$ là số nguyên tố", "C. $6$ là hợp số", "D. $2$ là số nguyên tố"], "answer": "B", "explain": "Số $1$ chỉ có một ước nên không phải là số nguyên tố, cũng không phải là hợp số; khẳng định $1$ là số nguyên tố là sai."}, {"type": "mcq", "level": "TH", "q": "ƯCLN($56, 84$) bằng bao nhiêu?", "options": ["A. $28$", "B. $42$", "C. $56$", "D. $14$"], "answer": "A", "explain": "$56 = 2^3 \\cdot 7$; $84 = 2^2 \\cdot 3 \\cdot 7$. Thừa số chung với số mũ nhỏ nhất: $2^2 \\cdot 7 = 28$."}, {"type": "mcq", "level": "TH", "q": "Số nào sau đây chia hết cho $9$?", "options": ["A. $1824$", "B. $1818$", "C. $1820$", "D. $1822$"], "answer": "B", "explain": "Tổng các chữ số của $1818$ là $18$; $18$ ⋮ $9$ nên $1818$ ⋮ $9$. Tổng các chữ số của các số còn lại đều ∤ $9$."}, {"type": "mcq", "level": "TH", "q": "Phân tích số $90$ ra thừa số nguyên tố được kết quả nào sau đây?", "options": ["A. $3 \\cdot 30$", "B. $6 \\cdot 15$", "C. $2 \\cdot 3^2 \\cdot 5$", "D. $9 \\cdot 10$"], "answer": "C", "explain": "$90 = 2 \\cdot 3 \\cdot 3 \\cdot 5 = 2 \\cdot 3^2 \\cdot 5$. Các cách viết còn lại đều chứa thừa số là hợp số."}, {"type": "truefalse", "level": "VD", "q": "Cho số $144 = 2^4 \\cdot 3^2$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $144$ là hợp số.", "b) $144$ có $15$ ước.", "c) $144$ ⋮ $12$.", "d) BCNN($144, 180$) $= 720$."], "answer": ["T", "T", "T", "T"], "explain": "$144$ có nhiều hơn hai ước nên là hợp số. Số ước của $144$ là $(4 + 1) \\cdot (2 + 1) = 15$. $144 = 12 \\cdot 12$ nên ⋮ $12$. $180 = 2^2 \\cdot 3^2 \\cdot 5$ nên BCNN($144, 180$) $= 2^4 \\cdot 3^2 \\cdot 5 = 720$."}, {"type": "truefalse", "level": "VD", "q": "Cho hai số $12$ và $18$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) ƯCLN($12, 18$) $= 6$.", "b) BCNN($12, 18$) $= 36$.", "c) Tích ƯCLN($12, 18$) và BCNN($12, 18$) bằng $216$.", "d) Tích ƯCLN và BCNN của hai số bằng tích của hai số đó."], "answer": ["T", "T", "T", "T"], "explain": "ƯCLN($12, 18$) $= 6$; BCNN($12, 18$) $= 36$. Ta có $6 \\cdot 36 = 216 = 12 \\cdot 18$, đúng với tính chất: tích ƯCLN và BCNN của hai số bằng tích của hai số đó."}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu số có hai chữ số chia hết cho $6$?", "answer": "15", "explain": "Các số có hai chữ số ⋮ $6$ là $12, 18, \\dots, 96$. Số lượng là $(96 - 12) : 6 + 1 = 15$ số."}, {"type": "short", "level": "VDC", "q": "Tìm số tự nhiên $n$ lớn nhất có hai chữ số sao cho $n$ ⋮ $4$ và $n$ ⋮ $6$.", "answer": "96", "explain": "$n$ vừa ⋮ $4$ vừa ⋮ $6$ thì $n$ ⋮ BCNN($4, 6$) $= 12$. Số lớn nhất có hai chữ số ⋮ $12$ là $96$."}]}]}
