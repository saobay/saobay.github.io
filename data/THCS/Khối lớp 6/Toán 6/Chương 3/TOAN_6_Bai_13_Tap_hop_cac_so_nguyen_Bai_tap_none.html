, 2$; d) đúng vì $-1$ có trong $B$ còn $3$ không có."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về thứ tự số nguyên.", "statements": ["a) $-7 \\lt -3$.", "b) $-1 \\gt -10$.", "c) $0 \\gt -100$.", "d) $-50 \\gt 1$."], "answer": ["T", "T", "T", "F"], "explain": "Vì $7 \\gt 3$ nên $-7 \\lt -3$; vì $1 \\lt 10$ nên $-1 \\gt -10$; mọi số nguyên âm đều nhỏ hơn $0$; $-50$ là số nguyên âm nên nhỏ hơn $1$, d) sai."}, {"type": "short", "level": "VDC", "q": "Tính tổng của số nguyên âm lớn nhất và số nguyên dương nhỏ nhất.", "answer": "0", "explain": "Số nguyên âm lớn nhất là $-1$, số nguyên dương nhỏ nhất là $1$. Tổng là $(-1) + 1 = 0$."}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu số nguyên nằm giữa $-8$ và $-3$ (không kể $-8$ và $-3$)?", "answer": "4", "explain": "Các số nguyên nằm giữa $-8$ và $-3$ là $-7; -6; -5; -4$, tất cả có $4$ số."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Cách viết nào sau đây biểu diễn đúng tập hợp các số nguyên $Z$?", "options": ["A. $Z = \\{0; 1; 2; 3; \\dots\\}$", "B. $Z = \\{1; 2; 3; \\dots\\}$", "C. $Z = \\{\\dots; -2; -1; 0; 1; 2; \\dots\\}$", "D. $Z = \\{\\dots; -2; -1; 0\\}$"], "answer": "C", "explain": "Tập hợp $Z$ gồm số nguyên âm, số $0$ và số nguyên dương, kéo dài vô hạn về cả hai phía."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. $-6 \\notin Z$", "B. $0 \\notin Z$", "C. $1,2 \\in Z$", "D. $-6 \\in Z$"], "answer": "D", "explain": "$-6$ và $0$ đều là số nguyên nên thuộc $Z$; $1,2$ không phải số nguyên."}, {"type": "mcq", "level": "NB", "q": "Trên trục số nằm ngang, điểm biểu diễn số $-3$ nằm ở phía nào của điểm $0$?", "options": ["A. Bên phải", "B. Trùng với điểm $0$", "C. Không xác định được", "D. Bên trái"], "answer": "D", "explain": "Các số nguyên âm nằm bên trái điểm $0$ trên trục số nằm ngang."}, {"type": "mcq", "level": "TH", "q": "Số đối của số đối của $-4$ là số nào?", "options": ["A. $4$", "B. $0$", "C. $-4$", "D. $8$"], "answer": "C", "explain": "Số đối của $-4$ là $4$, số đối của $4$ là $-4$. Vậy số đối của số đối của $-4$ là $-4$."}, {"type": "mcq", "level": "TH", "q": "Tìm số nguyên $x$ biết số đối của $x$ là $-11$.", "options": ["A. $-11$", "B. $11$", "C. $0$", "D. $1$"], "answer": "B", "explain": "Số đối của $x$ là $-x$. Ta có $-x = -11$ nên $x = 11$."}, {"type": "mcq", "level": "TH", "q": "So sánh $-15$ và $-20$.", "options": ["A. $-15 \\lt -20$", "B. $-15 = -20$", "C. Không so sánh được", "D. $-15 \\gt -20$"], "answer": "D", "explain": "Vì $15 \\lt 20$ nên $-15 \\gt -20$."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Tập hợp $Z$ bao gồm các số nguyên âm, số $0$ và các số nguyên dương.", "b) Số nguyên dương cũng có thể viết với dấu $+$ đằng trước, ví dụ $+3$.", "c) Số $-0$ là một số nguyên âm.", "d) Mọi số tự nhiên đều là số nguyên."], "answer": ["T", "T", "F", "T"], "explain": "a), b) đúng theo định nghĩa; c) sai vì $-0 = 0$ không phải số nguyên âm; d) đúng vì mọi số tự nhiên đều có trong $Z$."}, {"type": "truefalse", "level": "VD", "q": "Cho các số $-3; 0; 4; -7; 2$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Số lớn nhất trong các số đã cho là $4$.", "b) Số nhỏ nhất trong các số đã cho là $-7$.", "c) Có $2$ số nguyên âm trong các số đã cho.", "d) Số đối của $-3$ là $3$ và $3$ nhỏ hơn mọi số còn lại."], "answer": ["T", "T", "T", "F"], "explain": "a) đúng vì $4$ là số nguyên dương lớn nhất; b) đúng vì $-7$ là số nguyên âm nhỏ nhất; c) đúng ($-3, -7$); d) sai vì $3 \\lt 4$."}, {"type": "short", "level": "VDC", "q": "Số nguyên $x$ thỏa mãn $x$ là số đối của $6$ và $x$ nhỏ hơn $-4$. Hỏi $x$ là số nào?", "answer": "-6", "explain": "Số đối của $6$ là $-6$, và $-6 \\lt -4$ nên $x = -6$ thỏa mãn."}, {"type": "short", "level": "VDC", "q": "Tính tổng tất cả các số nguyên $x$ thỏa mãn $-4 \\le x \\le 4$.", "answer": "0", "explain": "Các số là $-4; -3; -2; -1; 0; 1; 2; 3; 4$. Các cặp số đối nhau có tổng bằng $0$ nên tổng tất cả bằng $0$."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Nhiệt độ $-5^{\\circ}C$ được đọc là gì?", "options": ["A. Âm năm độ C", "B. Trừ năm độ C", "C. Năm độ C", "D. Không năm độ C"], "answer": "A", "explain": "Số $-5$ đọc là âm năm, nên $-5^{\\circ}C$ đọc là âm năm độ C."}, {"type": "mcq", "level": "NB", "q": "Số nguyên âm lớn nhất là số nào?", "options": ["A. $-100$", "B. $0$", "C. $-9$", "D. $-1$"], "answer": "D", "explain": "Trong các số nguyên âm, $-1$ gần $0$ nhất nên $-1$ là số nguyên âm lớn nhất."}, {"type": "mcq", "level": "NB", "q": "Hai số $3$ và $-3$ được gọi là hai số gì của nhau?", "options": ["A. Hai số bằng nhau", "B. Hai số đối nhau", "C. Hai số nguyên tố cùng nhau", "D. Hai số nghịch đảo của nhau"], "answer": "B", "explain": "$3$ và $-3$ nằm về hai phía của điểm $0$ và cách đều điểm $0$ nên là hai số đối nhau."}, {"type": "mcq", "level": "TH", "q": "Điểm $A$ trên trục số biểu diễn số $-6$, điểm $B$ biểu diễn số $2$. Hỏi điểm nào nằm bên phải?", "options": ["A. Điểm $B$", "B. Điểm $A$", "C. Cả hai điểm trùng nhau", "D. Không so sánh được"], "answer": "A", "explain": "Vì $-6 \\lt 2$ nên điểm $A$ nằm bên trái điểm $B$; điểm $B$ nằm bên phải."}, {"type": "mcq", "level": "TH", "q": "Số liền trước của số nguyên $-1$ là số nào?", "options": ["A. $0$", "B. $-1$", "C. $-2$", "D. $1$"], "answer": "C", "explain": "Trên trục số, số liền trước của $-1$ là số nằm ngay bên trái nó, tức là $-2$."}, {"type": "mcq", "level": "TH", "q": "Trong các số $5; -5; 0; -1; 1$, có bao nhiêu số là số nguyên âm?", "options": ["A. $2$", "B. $1$", "C. $3$", "D. $5$"], "answer": "A", "explain": "Các số nguyên âm trong dãy là $-5$ và $-1$, tất cả có $2$ số."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Nếu $a$ là số nguyên dương thì $-a$ là số nguyên âm.", "b) Số đối của một số nguyên âm là một số nguyên dương.", "c) Số đối của mọi số nguyên đều là số nguyên âm.", "d) $0$ có hai số đối là $0$ và $-0$."], "answer": ["T", "T", "F", "F"], "explain": "a), b) đúng theo định nghĩa số đối; c) sai vì số đối của số nguyên dương là số nguyên âm, số đối của $0$ là $0$; d) sai vì $-0 = 0$, $0$ chỉ có một số đối là chính nó."}, {"type": "truefalse", "level": "VD", "q": "Cho $C$ là tập hợp các số nguyên lớn hơn $-4$ và nhỏ hơn $3$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $C = \\{-3; -2; -1; 0; 1; 2\\}$.", "b) $-4 \\notin C$.", "c) $C$ có $6$ phần tử.", "d) $3 \\in C$."], "answer": ["T", "T", "T", "F"], "explain": "Các số nguyên lớn hơn $-4$ và nhỏ hơn $3$ là $-3; -2; -1; 0; 1; 2$ nên a), b), c) đúng; $3$ không nhỏ hơn $3$ nên d) sai."}, {"type": "short", "level": "VDC", "q": "Số nguyên $x$ thỏa mãn $-6 \\lt x \\lt -1$. Hỏi $x$ có bao nhiêu giá trị?", "answer": "4", "explain": "Các giá trị của $x$ là $-5; -4; -3; -2$, tất cả có $4$ giá trị."}, {"type": "short", "level": "VDC", "q": "Tìm số nguyên $a$ biết số đối của $a$ là $-20$.", "answer": "20", "explain": "Số đối của $a$ là $-a$. Ta có $-a = -20$ nên $a = 20$."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Số nào sau đây vừa là số nguyên, vừa không phải số nguyên âm, cũng không phải số nguyên dương?", "options": ["A. $1$", "B. $0$", "C. $-1$", "D. $10$"], "answer": "B", "explain": "Số $0$ là số nguyên nhưng không phải số nguyên âm, cũng không phải số nguyên dương."}, {"type": "mcq", "level": "NB", "q": "Kí hiệu nào sau đây chỉ một số nguyên âm?", "options": ["A. $8$", "B. $+8$", "C. $0$", "D. $-8$"], "answer": "D", "explain": "Số nguyên âm được viết với dấu trừ đằng trước: $-8$."}, {"type": "mcq", "level": "NB", "q": "Điền kí hiệu thích hợp vào chỗ trống: $5$ ... $Z$.", "options": ["A. $\\notin$", "B. $\\in$", "C. $=$", "D. $\\lt$"], "answer": "B", "explain": "$5$ là số nguyên nên $5 \\in Z$."}, {"type": "mcq", "level": "TH", "q": "So sánh hai số $-12$ và $-9$ rồi điền dấu thích hợp: $-12$ ... $-9$.", "options": ["A. $\\lt$", "B. $\\gt$", "C. $=$", "D. $\\ne$"], "answer": "A", "explain": "Vì $12 \\gt 9$ nên $-12 \\lt -9$."}, {"type": "mcq", "level": "TH", "q": "Sắp xếp các số $0; -3; 7; -10; 2$ theo thứ tự giảm dần.", "options": ["A. $-10; -3; 0; 2; 7$", "B. $7; 2; 0; -10; -3$", "C. $0; 7; 2; -3; -10$", "D. $7; 2; 0; -3; -10$"], "answer": "D", "explain": "Thứ tự giảm dần: số nguyên dương lớn trước ($7 \\gt 2$), rồi đến $0$, rồi đến số nguyên âm ($-3 \\gt -10$)."}, {"type": "mcq", "level": "TH", "q": "Nhiệt độ ở Sa Pa là $-2^{\\circ}C$, ở Hà Nội là $5^{\\circ}C$. Hỏi nơi nào lạnh hơn?", "options": ["A. Sa Pa", "B. Hà Nội", "C. Cả hai nơi lạnh như nhau", "D. Không so sánh được"], "answer": "A", "explain": "Vì $-2 \\lt 5$ nên $-2^{\\circ}C$ thấp hơn $5^{\\circ}C$; Sa Pa lạnh hơn Hà Nội."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $-100 \\lt -99$.", "b) $-1 \\gt -2$.", "c) Mọi số nguyên âm đều nhỏ hơn mọi số nguyên dương.", "d) Không có số nguyên nào vừa lớn hơn $-1$ vừa nhỏ hơn $1$."], "answer": ["T", "T", "T", "F"], "explain": "Vì $100 \\gt 99$ nên $-100 \\lt -99$; vì $1 \\lt 2$ nên $-1 \\gt -2$; c) là quy tắc so sánh; d) sai vì số $0$ thỏa mãn."}, {"type": "truefalse", "level": "VD", "q": "Cho $D = \\{x \\mid x$ là số nguyên, $x$ lớn hơn $-3$ và $x$ nhỏ hơn hoặc bằng $2\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $-2 \\in D$.", "b) $2 \\in D$.", "c) $-3 \\in D$.", "d) $D$ có $5$ phần tử."], "answer": ["T", "T", "F", "T"], "explain": "$D = \\{-2; -1; 0; 1; 2\\}$ có $5$ phần tử nên a), b), d) đúng; $-3$ không lớn hơn $-3$ nên c) sai."}, {"type": "short", "level": "VDC", "q": "Tính tổng của số nguyên âm nhỏ nhất có một chữ số và số nguyên dương nhỏ nhất.", "answer": "-8", "explain": "Số nguyên âm nhỏ nhất có một chữ số là $-9$, số nguyên dương nhỏ nhất là $1$. Tổng là $(-9) + 1 = -8$."}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu số nguyên $x$ thỏa mãn $-20 \\le x \\le -15$?", "answer": "6", "explain": "Các số thỏa mãn là $-20; -19; -18; -17; -16; -15$, tất cả có $6$ số."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các số $-4; 0; 6; -11$, số nào là số nguyên dương?", "options": ["A. $-4$", "B. $6$", "C. $0$", "D. $-11$"], "answer": "B", "explain": "$6$ là số tự nhiên khác $0$ nên là số nguyên dương."}, {"type": "mcq", "level": "NB", "q": "Số đối của $0$ là số nào?", "options": ["A. $0$", "B. $1$", "C. $-1$", "D. Không có số đối"], "answer": "A", "explain": "Số $0$ là số đối của chính nó."}, {"type": "mcq", "level": "NB", "q": "Trên trục số, các số nguyên âm nằm ở phía nào của điểm $0$?", "options": ["A. Bên phải", "B. Trùng với điểm $0$", "C. Cả hai phía", "D. Bên trái"], "answer": "D", "explain": "Trên trục số nằm ngang, các số nguyên âm nằm bên trái điểm $0$."}, {"type": "mcq", "level": "TH", "q": "Tìm tất cả các số nguyên $x$ thỏa mãn $-3 \\le x \\lt 2$.", "options": ["A. $-3; -2; -1; 0; 1$", "B. $-2; -1; 0; 1$", "C. $-3; -2; -1; 0; 1; 2$", "D. $-3; -2; -1; 0$"], "answer": "A", "explain": "$x$ là số nguyên lớn hơn hoặc bằng $-3$ và nhỏ hơn $2$: $-3; -2; -1; 0; 1$."}, {"type": "mcq", "level": "TH", "q": "So sánh $-a$ và $0$ biết $a = 7$.", "options": ["A. $-a \\gt 0$", "B. $-a = 0$", "C. Không so sánh được", "D. $-a \\lt 0$"], "answer": "D", "explain": "Với $a = 7$ thì $-a = -7$ là số nguyên âm nên $-7 \\lt 0$."}, {"type": "mcq", "level": "TH", "q": "Số nguyên nào lớn hơn $-5$ và nhỏ hơn $-3$?", "options": ["A. $-5$", "B. $-4$", "C. $-3$", "D. $-6$"], "answer": "B", "explain": "Số nguyên duy nhất nằm giữa $-5$ và $-3$ là $-4$."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Số nguyên âm lớn nhất là $-1$.", "b) Số nguyên dương nhỏ nhất là $1$.", "c) Giữa hai số nguyên $-2$ và $0$ không có số nguyên nào.", "d) Số $0$ nhỏ hơn mọi số nguyên âm."], "answer": ["T", "T", "F", "F"], "explain": "a), b) đúng; c) sai vì số $-1$ nằm giữa $-2$ và $0$; d) sai vì $0$ lớn hơn mọi số nguyên âm."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Nhiệt độ $-8^{\\circ}C$ thấp hơn nhiệt độ $3^{\\circ}C$.", "b) Độ cao $-50$m là độ cao dưới mực nước biển.", "c) Một người nợ $200$ nghìn đồng có thể biểu diễn bằng số nguyên $-200$ (nghìn đồng).", "d) Số nguyên $-5$ biểu diễn số tiền lãi $5$ nghìn đồng."], "answer": ["T", "T", "T", "F"], "explain": "a) đúng vì $-8 \\lt 3$; b), c) đúng theo cách dùng số nguyên âm trong thực tế; d) sai vì tiền lãi được biểu diễn bằng số nguyên dương $5$."}, {"type": "short", "level": "VDC", "q": "Tính hiệu của số nguyên dương nhỏ nhất và số nguyên âm lớn nhất.", "answer": "2", "explain": "Số nguyên dương nhỏ nhất là $1$, số nguyên âm lớn nhất là $-1$. Hiệu là $1 - (-1) = 2$."}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu số nguyên $x$ thỏa mãn $x$ lớn hơn $-100$ và $x$ nhỏ hơn $-97$?", "answer": "2", "explain": "Các số thỏa mãn là $-99; -98$, tất cả có $2$ số."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Số nguyên âm được viết như thế nào?", "options": ["A. Viết dấu trừ đằng trước số tự nhiên khác $0$", "B. Viết dấu cộng đằng trước số tự nhiên", "C. Viết số $0$ đằng trước số tự nhiên", "D. Viết dấu trừ đằng sau số tự nhiên"], "answer": "A", "explain": "Số nguyên âm là số có dấu trừ ($-$) đằng trước một số tự nhiên khác $0$."}, {"type": "mcq", "level": "NB", "q": "Trong các khẳng định sau, khẳng định nào sai?", "options": ["A. $-3 \\in Z$", "B. $0 \\in Z$", "C. $-3 \\notin Z$", "D. $7 \\in Z$"], "answer": "C", "explain": "$-3$ là số nguyên nên $-3 \\in Z$; khẳng định $-3 \\notin Z$ là sai."}, {"type": "mcq", "level": "NB", "q": "Số đối của $-a$ ($a$ là số nguyên dương) là số nào?", "options": ["A. $-a$", "B. $a$", "C. $0$", "D. $-2a$"], "answer": "B", "explain": "Vì $a$ là số nguyên dương nên $-a$ là số nguyên âm; số đối của số nguyên âm $-a$ là số nguyên dương $a$."}, {"type": "mcq", "level": "TH", "q": "Cho $a = -6$. Hỏi số đối của $a$ lớn hơn hay nhỏ hơn $0$?", "options": ["A. Nhỏ hơn", "B. Bằng", "C. Lớn hơn", "D. Không so sánh được"], "answer": "C", "explain": "Số đối của $-6$ là $6$, là số nguyên dương nên lớn hơn $0$."}, {"type": "mcq", "level": "TH", "q": "Trong các số $-1; -5; -3; -9$, số nào gần điểm $0$ nhất trên trục số?", "options": ["A. $-5$", "B. $-1$", "C. $-3$", "D. $-9$"], "answer": "B", "explain": "Trong các số nguyên âm, số có giá trị tuyệt đối nhỏ nhất thì gần điểm $0$ nhất. Số $-1$ gần điểm $0$ nhất."}, {"type": "mcq", "level": "TH", "q": "Điền số thích hợp vào chỗ trống: Số đối của $13$ là ... .", "options": ["A. $-13$", "B. $13$", "C. $0$", "D. $1$"], "answer": "A", "explain": "Hai số $13$ và $-13$ là hai số đối nhau."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Trên trục số nằm ngang, điểm $-4$ nằm bên trái điểm $-1$.", "b) Điểm $3$ nằm bên phải điểm $-3$.", "c) Hai điểm biểu diễn hai số đối nhau cách đều điểm $0$.", "d) Điểm $-2$ và điểm $2$ trùng nhau trên trục số."], "answer": ["T", "T", "T", "F"], "explain": "a) đúng vì $-4 \\lt -1$; b) đúng vì $3 \\gt -3$; c) đúng theo định nghĩa số đối; d) sai vì $-2$ và $2$ nằm về hai phía của điểm $0$."}, {"type": "truefalse", "level": "VD", "q": "Cho $E$ là tập hợp các số nguyên âm lớn hơn $-6$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $E = \\{-5; -4; -3; -2; -1\\}$.", "b) $-6 \\notin E$.", "c) $E$ có $5$ phần tử.", "d) $0 \\in E$."], "answer": ["T", "T", "T", "F"], "explain": "Các số nguyên âm lớn hơn $-6$ là $-5; -4; -3; -2; -1$ nên a), b), c) đúng; $0$ không phải số nguyên âm nên d) sai."}, {"type": "short", "level": "VDC", "q": "Tìm số nguyên $x$ biết $x$ là số đối của số nguyên âm lớn nhất.", "answer": "1", "explain": "Số nguyên âm lớn nhất là $-1$; số đối của $-1$ là $1$. Vậy $x = 1$."}, {"type": "short", "level": "VDC", "q": "Tính tổng các số nguyên $x$ thỏa mãn $-5 \\lt x \\lt 5$.", "answer": "0", "explain": "Các số là $-4; -3; -2; -1; 0; 1; 2; 3; 4$. Các cặp số đối nhau có tổng bằng $0$ nên tổng tất cả bằng $0$."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Số nào sau đây không phải là số nguyên âm?", "options": ["A. $-1$", "B. $-25$", "C. $-100$", "D. $0$"], "answer": "D", "explain": "$0$ không phải số nguyên âm; các số còn lại đều là số nguyên âm."}, {"type": "mcq", "level": "NB", "q": "Hai số đối nhau có đặc điểm gì trên trục số?", "options": ["A. Trùng nhau tại điểm $0$", "B. Nằm về hai phía của điểm $0$ và cách đều điểm $0$", "C. Cùng nằm bên phải điểm $0$", "D. Cùng nằm bên trái điểm $0$"], "answer": "B", "explain": "Hai số đối nhau nằm về hai phía của điểm $0$ và cách đều điểm $0$ (trừ số $0$ là số đối của chính nó)."}, {"type": "mcq", "level": "NB", "q": "Số nguyên nào nhỏ nhất trong các số $-2; 1; -5; 0$?", "options": ["A. $-2$", "B. $0$", "C. $-5$", "D. $1$"], "answer": "C", "explain": "Vì $-5 \\lt -2 \\lt 0 \\lt 1$ nên số nhỏ nhất là $-5$."}, {"type": "mcq", "level": "TH", "q": "Số đối của $-a$ ($a$ là số nguyên dương) là số nào?", "options": ["A. $a$", "B. $-a$", "C. $0$", "D. $-2a$"], "answer": "A", "explain": "Vì $a$ là số nguyên dương nên $-a$ là số nguyên âm; số đối của $-a$ là $a$."}, {"type": "mcq", "level": "TH", "q": "Trong các số nguyên $-8; -3; 0; 4; -12$, số nào có số đối lớn nhất?", "options": ["A. $-8$", "B. $4$", "C. $-3$", "D. $-12$"], "answer": "D", "explain": "Số đối của các số lần lượt là $8; 3; 0; -4; 12$. Số đối lớn nhất là $12$, ứng với số $-12$."}, {"type": "mcq", "level": "TH", "q": "Điền dấu thích hợp vào chỗ trống: $-25$ ... $-30$.", "options": ["A. $\\lt$", "B. $=$", "C. $\\gt$", "D. $\\ne$"], "answer": "C", "explain": "Vì $25 \\lt 30$ nên $-25 \\gt -30$."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $Z = \\{\\dots; -3; -2; -1; 0; 1; 2; 3; \\dots\\}$.", "b) Mọi số nguyên đều hoặc là số nguyên âm, hoặc là số nguyên dương.", "c) Tập hợp $Z$ không có phần tử nhỏ nhất.", "d) Tập hợp $Z$ có phần tử lớn nhất."], "answer": ["T", "F", "T", "F"], "explain": "a) đúng theo định nghĩa; b) sai vì còn số $0$; c) đúng vì $Z$ kéo dài vô hạn về phía âm; d) sai vì $Z$ kéo dài vô hạn về phía dương."}, {"type": "truefalse", "level": "VD", "q": "Cho $F = \\{-10; -7; -4; -1; 2; 5\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Số nhỏ nhất của $F$ là $-10$.", "b) Số lớn nhất của $F$ là $5$.", "c) Sắp xếp $F$ theo thứ tự tăng dần được $-10; -7; -4; -1; 2; 5$.", "d) $F$ gồm $3$ số nguyên âm và $3$ số nguyên dương."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng; d) sai vì $F$ gồm $4$ số nguyên âm ($-10; -7; -4; -1$) và $2$ số nguyên dương ($2; 5$)."}, {"type": "short", "level": "VDC", "q": "Tìm số nguyên $x$ lớn nhất thỏa mãn $x$ nhỏ hơn $-7$.", "answer": "-8", "explain": "Các số nguyên nhỏ hơn $-7$ là $-8; -9; -10; \\dots$, trong đó số lớn nhất là $-8$."}, {"type": "short", "level": "VDC", "q": "Tính tổng của số nguyên dương nhỏ nhất có hai chữ số và số nguyên âm lớn nhất có một chữ số.", "answer": "9", "explain": "Số nguyên dương nhỏ nhất có hai chữ số là $10$, số nguyên âm lớn nhất có một chữ số là $-1$. Tổng là $10 + (-1) = 9$."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Số nguyên dương được viết như thế nào?", "options": ["A. Viết dấu trừ đằng trước số tự nhiên", "B. Viết số $0$ đằng trước", "C. Viết số tự nhiên khác $0$, có thể thêm dấu $+$ đằng trước", "D. Viết dấu trừ đằng sau số"], "answer": "C", "explain": "Số nguyên dương là số tự nhiên khác $0$; có thể viết thêm dấu $+$ đằng trước, ví dụ $+6$."}, {"type": "mcq", "level": "NB", "q": "Trong các số $3; -7; 0; -2; 8$, có bao nhiêu số nguyên âm?", "options": ["A. $1$", "B. $2$", "C. $3$", "D. $5$"], "answer": "B", "explain": "Các số nguyên âm trong dãy là $-7$ và $-2$, tất cả có $2$ số."}, {"type": "mcq", "level": "NB", "q": "Số $-15$ và số $15$ là hai số gì của nhau?", "options": ["A. Hai số bằng nhau", "B. Hai số nghịch đảo", "C. Hai số nguyên tố", "D. Hai số đối nhau"], "answer": "D", "explain": "$-15$ và $15$ nằm về hai phía của điểm $0$ và cách đều điểm $0$ nên là hai số đối nhau."}, {"type": "mcq", "level": "TH", "q": "Điểm $M$ biểu diễn số $-9$, điểm $N$ biểu diễn số $-4$. Hỏi điểm nào gần điểm $0$ hơn?", "options": ["A. Điểm $M$", "B. Cả hai gần như nhau", "C. Không so sánh được", "D. Điểm $N$"], "answer": "D", "explain": "Vì $-4 \\gt -9$ nên điểm $N$ gần điểm $0$ hơn điểm $M$."}, {"type": "mcq", "level": "TH", "q": "Tìm số nguyên $x$ biết $x$ là số đối của $25$.", "options": ["A. $25$", "B. $0$", "C. $-1$", "D. $-25$"], "answer": "D", "explain": "Số đối của $25$ là $-25$, vậy $x = -25$."}, {"type": "mcq", "level": "TH", "q": "Điền dấu thích hợp vào chỗ trống: $0$ ... $-8$.", "options": ["A. $\\gt$", "B. $\\lt$", "C. $=$", "D. $\\ne$"], "answer": "A", "explain": "Mọi số nguyên âm đều nhỏ hơn $0$ nên $0 \\gt -8$."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Nếu $a \\lt b$ thì trên trục số nằm ngang, điểm $a$ nằm bên trái điểm $b$.", "b) $-6 \\lt 0 \\lt 6$.", "c) Số nguyên âm $-3$ lớn hơn số nguyên dương $2$.", "d) Mọi số nguyên lớn hơn $-1$ đều là số nguyên dương."], "answer": ["T", "T", "F", "F"], "explain": "a) đúng theo cách đọc trục số; b) đúng vì số nguyên âm nhỏ hơn $0$, $0$ nhỏ hơn số nguyên dương; c) sai vì số nguyên âm luôn nhỏ hơn số nguyên dương; d) sai vì số $0$ lớn hơn $-1$ nhưng không phải số nguyên dương."}, {"type": "truefalse", "level": "VD", "q": "Cho $G = \\{x \\mid x$ là số nguyên, $-5 \\le x \\lt 1\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $G = \\{-5; -4; -3; -2; -1; 0\\}$.", "b) $1 \\notin G$.", "c) $G$ có $6$ phần tử.", "d) Số đối của $-5$ thuộc $G$."], "answer": ["T", "T", "T", "F"], "explain": "Các số nguyên thỏa mãn $-5 \\le x \\lt 1$ là $-5; -4; -3; -2; -1; 0$ nên a), b), c) đúng; số đối của $-5$ là $5 \\notin G$ nên d) sai."}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu số nguyên $x$ thỏa mãn $-3 \\le x \\le 3$ và $x$ là số nguyên âm?", "answer": "3", "explain": "Các số nguyên âm thỏa mãn là $-3; -2; -1$, tất cả có $3$ số."}, {"type": "short", "level": "VDC", "q": "Tính tổng các số nguyên $x$ thỏa mãn $-10 \\lt x \\lt -5$.", "answer": "-30", "explain": "Các số là $-9; -8; -7; -6$. Tổng là $(-9) + (-8) + (-7) + (-6) = -30$."}]}]}
