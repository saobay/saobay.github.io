h hành là có tâm đối xứng; tam giác đều và hình thang cân không có."}, {"type": "mcq", "level": "TH", "q": "Chữ cái in hoa nào sau đây có tâm đối xứng nhưng KHÔNG có trục đối xứng?", "options": ["A. H", "B. O", "C. X", "D. S"], "answer": "D", "explain": "Chữ S có tâm đối xứng nhưng không có trục đối xứng; H, O, X vừa có tâm vừa có trục đối xứng."}, {"type": "mcq", "level": "TH", "q": "Hình ảnh nào sau đây có tâm đối xứng?", "options": ["A. Mặt đồng hồ hình tròn", "B. Chiếc lá bị rách một bên", "C. Con bướm xòe cánh", "D. Một chiếc giày"], "answer": "A", "explain": "Mặt đồng hồ hình tròn có tâm đối xứng là tâm của nó; con bướm chỉ có trục đối xứng chứ không có tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Tâm đối xứng của hình lục giác đều là điểm nào?", "options": ["A. Một đỉnh của lục giác đều", "B. Giao điểm của các đường chéo chính (tâm của hình)", "C. Trung điểm của một cạnh", "D. Điểm nằm ngoài lục giác đều"], "answer": "B", "explain": "Tâm đối xứng của hình lục giác đều là tâm của hình, cũng là giao điểm của các đường chéo chính."}, {"type": "truefalse", "level": "VD", "q": "Cho hình vuông ABCD, O là giao điểm của hai đường chéo. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình vuông ABCD có tâm đối xứng.", "b) Tâm đối xứng của hình vuông là giao điểm của hai đường chéo.", "c) Hình vuông có 4 tâm đối xứng.", "d) Hình vuông vừa có tâm đối xứng, vừa có trục đối xứng."], "answer": ["T", "T", "F", "T"], "explain": "Hình vuông chỉ có đúng một tâm đối xứng là giao điểm hai đường chéo; ngoài ra nó còn có 4 trục đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về chữ cái in hoa.", "statements": ["a) Chữ H in hoa có tâm đối xứng.", "b) Chữ Z in hoa có tâm đối xứng.", "c) Chữ N in hoa có tâm đối xứng.", "d) Chữ M in hoa có tâm đối xứng."], "answer": ["T", "T", "T", "F"], "explain": "Các chữ H, Z, N đều có tâm đối xứng; chữ M không có tâm đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ HINH HOC viết bằng chữ in hoa (cụm từ \"HÌNH HỌC\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "6", "explain": "Các chữ H, I, N, H, H, O có tâm đối xứng; chữ C không có. Vậy có 6 chữ cái."}, {"type": "short", "level": "VDC", "q": "Một hình tròn và một hình vuông có cùng tâm O (tâm hình vuông trùng với tâm đường tròn). Điểm O có phải là tâm đối xứng của hình gồm cả hai hình này không?", "answer": "Có", "explain": "O vừa là tâm đối xứng của hình tròn, vừa là tâm đối xứng của hình vuông nên O cũng là tâm đối xứng của hình hợp."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm $O$ là tâm đối xứng của hình $H$ nghĩa là gì?", "options": ["A. $O$ nằm ở giữa hình $H$", "B. $O$ cách đều mọi điểm của hình $H$", "C. Mỗi điểm trên $H$ có điểm đối xứng qua $O$ cũng thuộc $H$", "D. Hình $H$ quay được quanh $O$"], "answer": "C", "explain": "Đó chính là khái niệm tâm đối xứng của một hình."}, {"type": "mcq", "level": "NB", "q": "Tâm đối xứng của hình vuông ABCD là điểm nào?", "options": ["A. Đỉnh A", "B. Trung điểm của cạnh AB", "C. Trung điểm của đường chéo AC", "D. Giao điểm của hai đường chéo AC và BD"], "answer": "D", "explain": "Tâm đối xứng của hình vuông là giao điểm của hai đường chéo."}, {"type": "mcq", "level": "NB", "q": "Chữ số nào sau đây có tâm đối xứng?", "options": ["A. 8", "B. 1", "C. 3", "D. 7"], "answer": "A", "explain": "Chữ số 8 có tâm đối xứng (cũng như trục đối xứng); 1, 3, 7 không có tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Trong các hình: đoạn thẳng, đường tròn, hình bình hành, tam giác cân, hình KHÔNG có tâm đối xứng là hình nào?", "options": ["A. Đoạn thẳng", "B. Tam giác cân", "C. Đường tròn", "D. Hình bình hành"], "answer": "B", "explain": "Tam giác cân không có tâm đối xứng; ba hình còn lại đều có."}, {"type": "mcq", "level": "TH", "q": "Cho O là trung điểm của đoạn thẳng AB. Điểm đối xứng của điểm A qua O là điểm nào?", "options": ["A. Điểm A", "B. Điểm O", "C. Điểm B", "D. Một điểm khác"], "answer": "C", "explain": "Vì O là trung điểm của AB nên B đối xứng với A qua O."}, {"type": "mcq", "level": "TH", "q": "Hình thoi (không phải hình vuông) vừa có tâm đối xứng, vừa có bao nhiêu trục đối xứng?", "options": ["A. 1 trục đối xứng", "B. 3 trục đối xứng", "C. Không có trục đối xứng", "D. 2 trục đối xứng"], "answer": "D", "explain": "Hình thoi có 2 trục đối xứng là hai đường chéo, đồng thời có tâm đối xứng là giao điểm hai đường chéo."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Đoạn thẳng có đúng 1 tâm đối xứng.", "b) Tâm đối xứng của đoạn thẳng là trung điểm của nó.", "c) Hình tròn có nhiều hơn 1 tâm đối xứng.", "d) Điểm O là tâm đối xứng của chính nó (điểm O)."], "answer": ["T", "T", "F", "T"], "explain": "Đoạn thẳng và đường tròn đều chỉ có đúng một tâm đối xứng; điểm O đối xứng với chính nó qua O."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình bình hành có tâm đối xứng nhưng không có trục đối xứng.", "b) Hình chữ nhật vừa có tâm đối xứng, vừa có trục đối xứng.", "c) Hình thang cân có tâm đối xứng.", "d) Tam giác đều có tâm đối xứng."], "answer": ["T", "T", "F", "F"], "explain": "Hình thang cân và tam giác đều chỉ có trục đối xứng, không có tâm đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ DEP viết bằng chữ in hoa (từ \"ĐẸP\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "0", "explain": "Các chữ D, E, P đều không có tâm đối xứng. Vậy có 0 chữ cái."}, {"type": "short", "level": "VDC", "q": "Hai đường tròn có cùng bán kính, tâm lần lượt là O1 và O2. Hình gồm cả hai đường tròn này có tâm đối xứng là điểm nào?", "answer": "trung điểm của đoạn O1O2", "explain": "Tâm đối xứng của hình hợp là trung điểm của đoạn thẳng nối hai tâm O1 và O2."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tâm đối xứng của hình lục giác đều là điểm nào?", "options": ["A. Tâm của hình (giao điểm các đường chéo chính)", "B. Một đỉnh của lục giác đều", "C. Trung điểm của một cạnh", "D. Một điểm nằm ngoài hình"], "answer": "A", "explain": "Tâm đối xứng của hình lục giác đều là tâm của hình."}, {"type": "mcq", "level": "NB", "q": "Điểm đối xứng của tâm O qua chính điểm O là điểm nào?", "options": ["A. Một điểm khác O", "B. Chính điểm O", "C. Không xác định được", "D. Không tồn tại"], "answer": "B", "explain": "Điểm O cách chính nó một khoảng bằng 0 nên điểm đối xứng của O qua O là chính O."}, {"type": "mcq", "level": "NB", "q": "Trong các chữ cái in hoa H, N, O, các chữ cái có tâm đối xứng là:", "options": ["A. Chỉ có H", "B. Chỉ có O", "C. Cả ba chữ H, N, O", "D. Chỉ có H và O"], "answer": "C", "explain": "Cả ba chữ H, N, O đều có tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Hình nào sau đây vừa có tâm đối xứng, vừa có trục đối xứng?", "options": ["A. Hình bình hành", "B. Hình thang cân", "C. Tam giác thường", "D. Hình chữ nhật"], "answer": "D", "explain": "Hình chữ nhật vừa có tâm đối xứng vừa có 2 trục đối xứng; hình bình hành chỉ có tâm; hình thang cân chỉ có trục."}, {"type": "mcq", "level": "TH", "q": "Cho hình bình hành ABCD, O là giao điểm của hai đường chéo. Điểm đối xứng của đỉnh A qua O là đỉnh nào?", "options": ["A. Đỉnh C", "B. Đỉnh B", "C. Đỉnh D", "D. Đỉnh A"], "answer": "A", "explain": "Vì O là trung điểm của đường chéo AC nên C đối xứng với A qua O."}, {"type": "mcq", "level": "TH", "q": "Chữ cái in hoa nào sau đây có tâm đối xứng mà không có trục đối xứng?", "options": ["A. H", "B. Z", "C. X", "D. O"], "answer": "B", "explain": "Chữ Z có tâm đối xứng nhưng không có trục đối xứng; H, X, O vừa có tâm vừa có trục đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Cho hình bình hành ABCD, O là giao điểm của hai đường chéo. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Mọi hình bình hành đều có tâm đối xứng.", "b) Tâm đối xứng của hình bình hành là trung điểm của một cạnh.", "c) Hai đường chéo của hình bình hành cắt nhau tại tâm đối xứng.", "d) Hình bình hành có 2 tâm đối xứng."], "answer": ["T", "F", "T", "F"], "explain": "Tâm đối xứng của hình bình hành là giao điểm hai đường chéo và mỗi hình bình hành chỉ có một tâm đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Quay một hình 180 độ quanh điểm O mà được hình trùng khít thì O là tâm đối xứng của hình.", "b) Quay một hình 90 độ quanh điểm O mà được hình trùng khít thì O là tâm đối xứng của hình.", "c) Hình tròn quay một góc bất kì quanh tâm của nó vẫn trùng khít với chính nó.", "d) Hình vuông quay 90 độ quanh tâm của nó thì trùng khít với chính nó."], "answer": ["T", "F", "T", "T"], "explain": "Tâm đối xứng gắn với phép quay nửa vòng (180 độ); quay 90 độ trùng khít chưa đủ để kết luận O là tâm đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ VIET NAM viết bằng chữ in hoa (cụm từ \"VIỆT NAM\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "2", "explain": "Các chữ I và N có tâm đối xứng; V, E, T, A, M không có. Vậy có 2 chữ cái."}, {"type": "short", "level": "VDC", "q": "Hình chữ nhật ABCD có AB = 8 cm, BC = 6 cm. Gọi O là tâm đối xứng của hình chữ nhật. Độ dài đoạn thẳng OA bằng bao nhiêu cm?", "answer": "5", "explain": "Đường chéo AC = 10 cm (theo định lí Pythagore: căn bậc hai của 64 + 36). O là trung điểm của AC nên OA = 10 : 2 = 5 cm."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Hai điểm $A$ và $B$ được gọi là đối xứng nhau qua điểm $O$ khi nào?", "options": ["A. $O$ trùng với $A$", "B. $O$ trùng với $B$", "C. $O$ là trung điểm của đoạn thẳng $AB$", "D. $A$ trùng với $B$"], "answer": "C", "explain": "Định nghĩa: $A$ và $B$ đối xứng nhau qua $O$ khi $O$ là trung điểm của $AB$."}, {"type": "mcq", "level": "NB", "q": "Đường tròn có bao nhiêu tâm đối xứng?", "options": ["A. 0", "B. 2", "C. Vô số", "D. 1 (duy nhất là tâm đường tròn)"], "answer": "D", "explain": "Đường tròn chỉ có đúng một tâm đối xứng là tâm của nó (khác với trục đối xứng có vô số)."}, {"type": "mcq", "level": "NB", "q": "Chữ cái in hoa nào sau đây có tâm đối xứng?", "options": ["A. X", "B. A", "C. T", "D. V"], "answer": "A", "explain": "Chữ X có tâm đối xứng; A, T, V không có tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Điểm $M$ thuộc hình $H$, điểm $O$ là tâm đối xứng của hình $H$. Điểm đối xứng của $M$ qua $O$ là điểm như thế nào?", "options": ["A. Nằm ngoài hình $H$", "B. Thuộc hình $H$", "C. Trùng với $O$", "D. Không xác định được"], "answer": "B", "explain": "Theo khái niệm tâm đối xứng, điểm đối xứng của $M$ qua $O$ cũng thuộc hình $H$."}, {"type": "mcq", "level": "TH", "q": "Trong các hình: tam giác cân, hình thang cân, hình thoi, tam giác đều, hình có tâm đối xứng là hình nào?", "options": ["A. Tam giác cân", "B. Hình thang cân", "C. Hình thoi", "D. Tam giác đều"], "answer": "C", "explain": "Chỉ có hình thoi là có tâm đối xứng (giao điểm hai đường chéo); ba hình còn lại không có."}, {"type": "mcq", "level": "TH", "q": "Cho hình bình hành ABCD, O là tâm đối xứng của nó. Điểm đối xứng của đỉnh B qua O là đỉnh nào?", "options": ["A. Đỉnh A", "B. Đỉnh C", "C. Đỉnh B", "D. Đỉnh D"], "answer": "D", "explain": "Vì O là trung điểm của đường chéo BD nên D đối xứng với B qua O."}, {"type": "truefalse", "level": "VD", "q": "Cho hình thoi ABCD, O là giao điểm của hai đường chéo. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình thoi ABCD có tâm đối xứng.", "b) Tâm đối xứng của hình thoi là giao điểm của hai đường chéo.", "c) Hình thoi không có trục đối xứng.", "d) Hình thoi vừa có tâm đối xứng, vừa có trục đối xứng."], "answer": ["T", "T", "F", "T"], "explain": "Hình thoi có 2 trục đối xứng là hai đường chéo, đồng thời có tâm đối xứng là giao điểm hai đường chéo."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về chữ cái in hoa.", "statements": ["a) Chữ S in hoa có tâm đối xứng.", "b) Chữ S in hoa có trục đối xứng.", "c) Chữ Z in hoa có tâm đối xứng.", "d) Chữ Z in hoa có trục đối xứng."], "answer": ["T", "F", "T", "F"], "explain": "Chữ S và chữ Z đều có tâm đối xứng nhưng không có trục đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ TOAN HOC viết bằng chữ in hoa (cụm từ \"TOÁN HỌC\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "4", "explain": "Các chữ O, N, H, O có tâm đối xứng; T, A, C không có. Vậy có 4 chữ cái."}, {"type": "short", "level": "VDC", "q": "Một hình vuông có tâm đối xứng O. Vẽ thêm một hình tròn tâm O, bán kính bằng nửa cạnh hình vuông. Tâm đối xứng của hình mới (gồm cả hình vuông và hình tròn) là điểm nào?", "answer": "O", "explain": "O vừa là tâm đối xứng của hình vuông, vừa là tâm đối xứng của hình tròn nên O cũng là tâm đối xứng của hình hợp."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tâm đối xứng của hình bình hành ABCD là điểm nào?", "options": ["A. Giao điểm của hai đường chéo AC và BD", "B. Trung điểm của cạnh AB", "C. Đỉnh A", "D. Trung điểm của cạnh BC"], "answer": "A", "explain": "Tâm đối xứng của hình bình hành là giao điểm của hai đường chéo."}, {"type": "mcq", "level": "NB", "q": "Cho đoạn thẳng AB dài 10 cm, O là tâm đối xứng của đoạn thẳng AB. Độ dài đoạn thẳng OA bằng bao nhiêu?", "options": ["A. 10 cm", "B. 5 cm", "C. 20 cm", "D. 2,5 cm"], "answer": "B", "explain": "O là trung điểm của AB nên OA = AB : 2 = 10 : 2 = 5 cm."}, {"type": "mcq", "level": "NB", "q": "Hình nào sau đây KHÔNG có tâm đối xứng?", "options": ["A. Hình bình hành", "B. Hình chữ nhật", "C. Hình thang cân", "D. Đường tròn"], "answer": "C", "explain": "Hình thang cân không có tâm đối xứng; ba hình còn lại đều có."}, {"type": "mcq", "level": "TH", "q": "Chữ số nào sau đây vừa có tâm đối xứng, vừa có trục đối xứng?", "options": ["A. 1", "B. 3", "C. 7", "D. 8"], "answer": "D", "explain": "Chữ số 8 vừa có tâm đối xứng, vừa có trục đối xứng (thẳng đứng và nằm ngang)."}, {"type": "mcq", "level": "TH", "q": "Hình chữ nhật có tâm đối xứng đồng thời là điểm nào?", "options": ["A. Giao điểm của hai đường chéo (cũng là giao điểm của hai trục đối xứng)", "B. Trung điểm của một cạnh", "C. Một đỉnh của hình chữ nhật", "D. Điểm nằm ngoài hình chữ nhật"], "answer": "A", "explain": "Tâm đối xứng của hình chữ nhật là giao điểm hai đường chéo, cũng là điểm chung của hai trục đối xứng."}, {"type": "mcq", "level": "TH", "q": "Điểm $A$ và điểm $B$ đối xứng nhau qua điểm $O$. Biết $OA = 7$ cm. Độ dài đoạn thẳng $OB$ bằng bao nhiêu?", "options": ["A. $14$ cm", "B. $7$ cm", "C. $3,5$ cm", "D. Không xác định được"], "answer": "B", "explain": "$O$ là trung điểm của $AB$ nên $OB = OA = 7$ cm."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về đường tròn.", "statements": ["a) Mọi điểm O đều là tâm đối xứng của đường tròn.", "b) Tâm đối xứng của đường tròn là duy nhất.", "c) Đường tròn vừa có tâm đối xứng, vừa có trục đối xứng.", "d) Mọi trục đối xứng của đường tròn đều đi qua tâm đối xứng của nó."], "answer": ["F", "T", "T", "T"], "explain": "Chỉ có tâm của đường tròn mới là tâm đối xứng của nó (duy nhất); mọi trục đối xứng đều đi qua tâm này."}, {"type": "truefalse", "level": "VD", "q": "Cho hình vuông ABCD, O là tâm đối xứng của nó. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình vuông có tâm đối xứng.", "b) Hình vuông có trục đối xứng.", "c) Tâm đối xứng của hình vuông trùng với giao điểm của các trục đối xứng.", "d) Hình chữ nhật không có tâm đối xứng."], "answer": ["T", "T", "T", "F"], "explain": "Hình vuông và hình chữ nhật đều có tâm đối xứng là giao điểm hai đường chéo, trùng với giao điểm các trục đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ DOI XUNG viết bằng chữ in hoa (từ \"ĐỐI XỨNG\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "4", "explain": "Các chữ O, I, X, N có tâm đối xứng; D, U, G không có. Vậy có 4 chữ cái."}, {"type": "short", "level": "VDC", "q": "Cho tam giác ABC. Gọi O là trung điểm của cạnh BC. Điểm O có phải là tâm đối xứng của tam giác ABC không?", "answer": "Không", "explain": "Tam giác (kể cả tam giác cân) không có tâm đối xứng, nên O không phải là tâm đối xứng của tam giác ABC."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hình ảnh nào sau đây có tâm đối xứng?", "options": ["A. Chiếc lá bị rách một bên", "B. Con cá đang bơi", "C. Bông hoa có 4 cánh đều nhau", "D. Ngôi nhà bị nghiêng"], "answer": "C", "explain": "Bông hoa 4 cánh đều nhau có tâm đối xứng là điểm giữa của hoa; các hình còn lại không có."}, {"type": "mcq", "level": "NB", "q": "Điểm $O$ là trung điểm của đoạn thẳng $AA'$. Khi đó $A$ và $A'$ được gọi là hai điểm như thế nào với nhau?", "options": ["A. Đối xứng nhau qua đường thẳng $O$", "B. Trùng nhau", "C. Không có quan hệ gì", "D. Đối xứng nhau qua điểm $O$"], "answer": "D", "explain": "Định nghĩa: $A$ và $A'$ đối xứng nhau qua $O$ khi $O$ là trung điểm của $AA'$."}, {"type": "mcq", "level": "NB", "q": "Tâm đối xứng O của đoạn thẳng AB dài 12 cm chia đoạn AB thành hai đoạn thẳng có độ dài bằng bao nhiêu?", "options": ["A. 6 cm và 6 cm", "B. 12 cm và 12 cm", "C. 6 cm và 12 cm", "D. 3 cm và 9 cm"], "answer": "A", "explain": "O là trung điểm của AB nên OA = OB = 12 : 2 = 6 cm."}, {"type": "mcq", "level": "TH", "q": "Trong các hình: hình vuông, hình chữ nhật, hình thoi, hình bình hành, hình nào CHỈ có tâm đối xứng mà không có trục đối xứng?", "options": ["A. Hình vuông", "B. Hình bình hành", "C. Hình chữ nhật", "D. Hình thoi"], "answer": "B", "explain": "Hình bình hành có tâm đối xứng nhưng không có trục đối xứng; ba hình còn lại vừa có tâm vừa có trục."}, {"type": "mcq", "level": "TH", "q": "Chữ cái in hoa nào sau đây KHÔNG có tâm đối xứng?", "options": ["A. H", "B. N", "C. M", "D. S"], "answer": "C", "explain": "Chữ M không có tâm đối xứng; H, N, S đều có tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Cho $O$ là tâm đối xứng của hình $H$. Điểm $P$ thuộc hình $H$ và $P$ khác $O$. Điểm đối xứng của $P$ qua $O$ là điểm như thế nào?", "options": ["A. Trùng với $P$", "B. Nằm ngoài hình $H$", "C. Trùng với $O$", "D. Khác $P$ và thuộc hình $H$"], "answer": "D", "explain": "Vì $P$ khác $O$ nên điểm đối xứng của $P$ qua $O$ khác $P$, và theo khái niệm thì nó thuộc hình $H$."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Đoạn thẳng AB có tâm đối xứng là trung điểm của nó.", "b) Mọi điểm trên đường thẳng AB đều là tâm đối xứng của đoạn thẳng AB.", "c) Hình tròn có đúng một tâm đối xứng.", "d) Mỗi điểm bất kì đều có thể là tâm đối xứng của một hình nào đó."], "answer": ["T", "F", "T", "T"], "explain": "Đoạn thẳng chỉ có một tâm đối xứng là trung điểm; mỗi điểm O đều là tâm đối xứng của đường tròn tâm O."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về chữ cái in hoa.", "statements": ["a) Chữ I in hoa vừa có tâm đối xứng, vừa có trục đối xứng.", "b) Chữ O in hoa vừa có tâm đối xứng, vừa có trục đối xứng.", "c) Chữ H in hoa vừa có tâm đối xứng, vừa có trục đối xứng.", "d) Chữ N in hoa vừa có tâm đối xứng, vừa có trục đối xứng."], "answer": ["T", "T", "T", "F"], "explain": "Chữ N chỉ có tâm đối xứng mà không có trục đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ BINH MINH viết bằng chữ in hoa (cụm từ \"BÌNH MINH\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "6", "explain": "Các chữ I, N, H, I, N, H có tâm đối xứng; B và M không có. Vậy có 6 chữ cái."}, {"type": "short", "level": "VDC", "q": "Ba đoạn thẳng bằng nhau có chung trung điểm O (tạo thành hình ngôi sao 6 cánh dẹt). Điểm O có phải là tâm đối xứng của hình này không?", "answer": "Có", "explain": "Mỗi điểm trên hình đều có điểm đối xứng qua O thuộc hình nên O là tâm đối xứng của hình."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tâm đối xứng của hình chữ nhật ABCD là điểm nào?", "options": ["A. Giao điểm của hai đường chéo AC và BD", "B. Trung điểm của cạnh AB", "C. Đỉnh B", "D. Trung điểm của cạnh AD"], "answer": "A", "explain": "Tâm đối xứng của hình chữ nhật là giao điểm của hai đường chéo."}, {"type": "mcq", "level": "NB", "q": "Hai điểm $A$ và $B$ đối xứng nhau qua điểm $O$. Khẳng định nào sau đây đúng?", "options": ["A. $O$ trùng với $A$", "B. $OA = OB$ và $O$ nằm giữa $A$ và $B$", "C. $OA$ gấp đôi $OB$", "D. $O$ nằm ngoài đoạn thẳng $AB$"], "answer": "B", "explain": "$O$ là trung điểm của $AB$ nên $OA = OB$ và $O$ nằm giữa $A$, $B$."}, {"type": "mcq", "level": "NB", "q": "Hình nào sau đây có tâm đối xứng?", "options": ["A. Tam giác cân", "B. Hình thang cân", "C. Đường tròn", "D. Tam giác đều"], "answer": "C", "explain": "Đường tròn có tâm đối xứng là tâm của nó; ba hình còn lại không có tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Chữ cái in hoa nào sau đây có tâm đối xứng?", "options": ["A. A", "B. T", "C. M", "D. S"], "answer": "D", "explain": "Chữ S có tâm đối xứng; A, T, M không có tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Cho hình bình hành ABCD, O là tâm đối xứng của nó. Điểm đối xứng của đỉnh A qua O là đỉnh nào?", "options": ["A. Đỉnh C", "B. Đỉnh B", "C. Đỉnh D", "D. Đỉnh A"], "answer": "A", "explain": "O là trung điểm của đường chéo AC nên C đối xứng với A qua O."}, {"type": "mcq", "level": "TH", "q": "Trong các chữ số 0, 6, 8, 9, có bao nhiêu chữ số có tâm đối xứng?", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "B", "explain": "Chữ số 0 và 8 có tâm đối xứng; 6 và 9 không có (6 quay nửa vòng thành 9, không trùng với chính nó)."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về chữ số.", "statements": ["a) Chữ số 0 có tâm đối xứng.", "b) Chữ số 8 có tâm đối xứng.", "c) Chữ số 6 có tâm đối xứng.", "d) Chữ số 9 có tâm đối xứng."], "answer": ["T", "T", "F", "F"], "explain": "Chữ số 0 và 8 quay nửa vòng quanh điểm giữa vẫn trùng với chính nó; 6 và 9 thì không."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Mọi hình chữ nhật đều có tâm đối xứng.", "b) Mọi hình thoi đều có tâm đối xứng.", "c) Mọi hình thang đều có tâm đối xứng.", "d) Mọi hình bình hành đều có tâm đối xứng."], "answer": ["T", "T", "F", "T"], "explain": "Hình thang (kể cả thang cân) không có tâm đối xứng; ba loại hình còn lại đều có."}, {"type": "short", "level": "VDC", "q": "Từ SANG TAO viết bằng chữ in hoa (cụm từ \"SÁNG TẠO\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "3", "explain": "Các chữ S, N, O có tâm đối xứng; A, G, T không có. Vậy có 3 chữ cái."}, {"type": "short", "level": "VDC", "q": "Cho hình vuông ABCD có tâm đối xứng O. Điểm M là trung điểm của cạnh AB. Điểm đối xứng của M qua O là trung điểm của cạnh nào?", "answer": "CD", "explain": "O là tâm đối xứng nên điểm đối xứng của M (trên cạnh AB) qua O là trung điểm của cạnh đối diện CD."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm $O$ là tâm đối xứng của hình $H$ khi nào?", "options": ["A. $O$ là điểm duy nhất của hình $H$", "B. Mọi điểm của hình $H$ đều trùng với $O$", "C. Mỗi điểm trên $H$ có điểm đối xứng qua $O$ cũng thuộc $H$", "D. Hình $H$ không chứa điểm $O$"], "answer": "C", "explain": "Đó chính là khái niệm tâm đối xứng của một hình."}, {"type": "mcq", "level": "NB", "q": "Tâm đối xứng của hình thoi ABCD là điểm nào?", "options": ["A. Đỉnh A", "B. Trung điểm của cạnh AB", "C. Điểm nằm ngoài hình thoi", "D. Giao điểm của hai đường chéo AC và BD"], "answer": "D", "explain": "Tâm đối xứng của hình thoi là giao điểm của hai đường chéo."}, {"type": "mcq", "level": "NB", "q": "Trong các hình: tam giác đều, hình vuông, hình thang cân, hình có tâm đối xứng là hình nào?", "options": ["A. Hình vuông", "B. Tam giác đều", "C. Hình thang cân", "D. Cả ba hình"], "answer": "A", "explain": "Chỉ có hình vuông là có tâm đối xứng; tam giác đều và hình thang cân không có."}, {"type": "mcq", "level": "TH", "q": "Chữ cái in hoa nào sau đây có tâm đối xứng?", "options": ["A. E", "B. Z", "C. F", "D. L"], "answer": "B", "explain": "Chữ Z có tâm đối xứng; E, F, L không có tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Cho đường tròn tâm O bán kính 5 cm. Điểm A nằm trên đường tròn, điểm B đối xứng với A qua O. Độ dài đoạn thẳng AB bằng bao nhiêu?", "options": ["A. 5 cm", "B. 15 cm", "C. 10 cm", "D. 20 cm"], "answer": "C", "explain": "AB là đường kính của đường tròn nên AB = 2 x 5 = 10 cm."}, {"type": "mcq", "level": "TH", "q": "Hình nào sau đây vừa có vô số trục đối xứng, vừa có tâm đối xứng?", "options": ["A. Hình vuông", "B. Hình chữ nhật", "C. Hình thoi", "D. Hình tròn"], "answer": "D", "explain": "Hình tròn có vô số trục đối xứng và có tâm đối xứng là tâm của nó."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về hình tròn.", "statements": ["a) Hình tròn có tâm đối xứng.", "b) Hình tròn có trục đối xứng.", "c) Tâm đối xứng của hình tròn nằm trên mọi trục đối xứng của nó.", "d) Hình tròn có 2 tâm đối xứng."], "answer": ["T", "T", "T", "F"], "explain": "Hình tròn có đúng một tâm đối xứng là tâm của nó, và tâm này nằm trên mọi trục đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình bình hành có tâm đối xứng nhưng không có trục đối xứng.", "b) Hình thang cân có trục đối xứng nhưng không có tâm đối xứng.", "c) Hình chữ nhật có cả tâm đối xứng và trục đối xứng.", "d) Tam giác đều có cả tâm đối xứng và trục đối xứng."], "answer": ["T", "T", "T", "F"], "explain": "Tam giác đều chỉ có trục đối xứng (3 trục) mà không có tâm đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ HOA BINH viết bằng chữ in hoa (cụm từ \"HÒA BÌNH\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "5", "explain": "Các chữ H, O, I, N, H có tâm đối xứng; A và B không có. Vậy có 5 chữ cái."}, {"type": "short", "level": "VDC", "q": "Một hình bình hành có hai đường chéo dài 10 cm và 24 cm. Khoảng cách từ tâm đối xứng đến mỗi đỉnh nằm trên đường chéo dài 10 cm bằng bao nhiêu cm?", "answer": "5", "explain": "Tâm đối xứng là trung điểm của mỗi đường chéo nên khoảng cách cần tìm là 10 : 2 = 5 cm."}]}]}
