u trục đối xứng?", "options": ["A. 1", "B. 2", "C. 6", "D. 3"], "answer": "D", "explain": "Tam giác đều có 3 trục đối xứng: ba đường thẳng đi qua mỗi đỉnh và trung điểm của cạnh đối diện."}, {"type": "mcq", "level": "NB", "q": "Hình thoi có bao nhiêu trục đối xứng?", "options": ["A. 2", "B. 1", "C. 3", "D. 4"], "answer": "A", "explain": "Hình thoi có 2 trục đối xứng chính là hai đường chéo của hình thoi."}, {"type": "mcq", "level": "TH", "q": "Hình lục giác đều có bao nhiêu trục đối xứng?", "options": ["A. 3", "B. 6", "C. 4", "D. 12"], "answer": "B", "explain": "Hình lục giác đều có 6 trục đối xứng: 3 đường thẳng đi qua hai đỉnh đối diện và 3 đường thẳng đi qua trung điểm hai cạnh đối diện."}, {"type": "mcq", "level": "TH", "q": "Chữ cái in hoa nào sau đây có trục đối xứng nằm ngang?", "options": ["A. A", "B. F", "C. E", "D. G"], "answer": "C", "explain": "Chữ E có trục đối xứng nằm ngang; chữ A có trục thẳng đứng; F và G không có trục đối xứng."}, {"type": "mcq", "level": "TH", "q": "Trong các chữ số 0, 1, 2, 3, chữ số nào có trục đối xứng thẳng đứng?", "options": ["A. 1", "B. 2", "C. 3", "D. 0"], "answer": "D", "explain": "Chữ số 0 có cả trục đối xứng thẳng đứng và nằm ngang; các chữ số 1, 2, 3 không có trục thẳng đứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về tam giác.", "statements": ["a) Tam giác cân có đúng 1 trục đối xứng.", "b) Trục đối xứng của tam giác cân đi qua đỉnh cân và trung điểm của cạnh đáy.", "c) Tam giác đều có 6 trục đối xứng.", "d) Mọi tam giác đều có trục đối xứng."], "answer": ["T", "T", "F", "F"], "explain": "Tam giác đều chỉ có 3 trục đối xứng; tam giác thường (không cân) không có trục đối xứng nên khẳng định d) sai."}, {"type": "truefalse", "level": "VD", "q": "Gấp đôi một tờ giấy, cắt một hình rồi mở tờ giấy ra. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình nhận được luôn có trục đối xứng là nếp gấp.", "b) Nếu cắt một nửa hình trái tim sát nếp gấp thì mở ra được hình t "Chữ cái in hoa nào sau đây có cả trục đối xứng thẳng đứng và trục đối xứng nằm ngang?", "options": ["A. A", "B. E", "C. F", "D. O"], "answer": "D", "explain": "Chữ O có cả hai trục; chữ A chỉ có trục thẳng đứng; chữ E chỉ có trục nằm ngang; F không có trục đối xứng."}, {"type": "mcq", "level": "TH", "q": "Hình ảnh nào sau đây có trục đối xứng?", "options": ["A. Con bướm đang xòe cánh", "B. Chiếc lá bị sâu cắn mất một nửa", "C. Tảng đá có hình thù ngẫu nhiên", "D. Một chiếc giày"], "answer": "A", "explain": "Hai cánh của con bướm đối xứng nhau qua trục dọc giữa thân; các hình còn lại không có tính đối xứng."}, {"type": "mcq", "level": "TH", "q": "Gấp một hình theo trục đối xứng của nó thì hai nửa của hình sẽ như thế nào?", "options": ["A. Rời xa nhau", "B. Trùng khít lên nhau", "C. Chồng lấn một phần", "D. Biến mất"], "answer": "B", "explain": "Đây chính là dấu hiệu nhận biết trục đối xứng: gấp theo trục thì hai nửa trùng khít."}, {"type": "truefalse", "level": "VD", "q": "Cho hình vuông ABCD. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình vuông ABCD có 4 trục đối xứng.", "b) Hai đường chéo của hình vuông đều là trục đối xứng.", "c) Hai đường thẳng nối trung điểm hai cặp cạnh đối diện đều là trục đối xứng.", "d) Hình vuông có 6 trục đối xứng."], "answer": ["T", "T", "T", "F"], "explain": "Hình vuông có đúng 4 trục đối xứng: hai đường chéo và hai đường nối trung điểm hai cặp cạnh đối diện."}, {"type": "truefalse", "level": "VD", "q": "Cho điểm A và đường thẳng d, H là chân đường vuông góc kẻ từ A đến d. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Điểm đối xứng của A qua d nằm trên đường thẳng vuông góc với d tại H.", "b) Nếu điểm M nằm trên d thì điểm đối xứng của M qua d là chính M.", "c) Điểm đối xứng của A qua d luôn khác điểm A.", "d) Đoạn thẳng nối A với điểm đối xứng của nó qua d luôn vuông góc với d."], "answer": ["T", "T", "F", "T"], "explain": "Nếu A nằm trên d thì điểm đối xứng của A qua d là chính A, nên khẳng định c) sai."}, {"type": "short", "level": "VDC", "q": "Chữ X viết in hoa có bao nhiêu trục đối xứng?", "answer": "2", "explain": "Chữ X có 2 trục đối xứng: một thẳng đứng và một nằm ngang."}, {"type": "short", "level": "VDC", "q": "Một hình chữ nhật có chiều dài gấp đôi chiều rộng. Hỏi hình chữ nhật đó có bao nhiêu trục đối xứng?", "answer": "2", "explain": "Mọi hình chữ nhật (không phải hình vuông) đều có 2 trục đối xứng, không phụ thuộc vào kích thước."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Hình bình hành (không phải hình chữ nhật, hình thoi) có bao nhiêu trục đối xứng?", "options": ["A. 1", "B. 2", "C. Không có (0)", "D. 4"], "answer": "C", "explain": "Hình bình hành thường không có trục đối xứng nào."}, {"type": "mcq", "level": "NB", "q": "Tam giác ABC cân tại B. Trục đối xứng của tam giác ABC là đường thẳng nào?", "options": ["A. Đường thẳng đi qua A và trung điểm của cạnh BC", "B. Đường thẳng đi qua C và trung điểm của cạnh AB", "C. Cạnh AC", "D. Đường thẳng đi qua B và trung điểm của cạnh AC"], "answer": "D", "explain": "Trục đối xứng của tam giác cân đi qua đỉnh cân (đỉnh B) và trung điểm của cạnh đáy (cạnh AC)."}, {"type": "mcq", "level": "NB", "q": "Điểm $A$ đối xứng với điểm $B$ qua đường thẳng $d$, $H$ là giao điểm của $AB$ và $d$. Khẳng định nào sau đây đúng?", "options": ["A. $H$ là trung điểm của $AB$ và $AB$ vuông góc với $d$", "B. $H$ trùng với $A$", "C. $AB$ song song với $d$", "D. $HA$ gấp đôi $HB$"], "answer": "A", "explain": "Vì $d$ là đường trung trực của $AB$ nên $H$ là trung điểm của $AB$ và $AB$ vuông góc với $d$."}, {"type": "mcq", "level": "TH", "q": "Chữ cái in hoa nào sau đây KHÔNG có trục đối xứng?", "options": ["A. A", "B. N", "C. H", "D. O"], "answer": "B", "explain": "Chữ N không có trục đối xứng (nhưng có tâm đối xứng); A, H, O đều có trục đối xứng."}, {"type": "mcq", "level": "TH", "q": "Hai trục đối xứng của hình thoi là hai đường nào?", "options": ["A. Hai cạnh kề nhau của hình thoi", "B. Hai đường thẳng nối trung điểm các cạnh", "C. Hai đường chéo của hình thoi", "D. Hai cạnh đối diện của hình thoi"], "answer": "C", "explain": "Hai đường chéo của hình thoi chính là hai trục đối xứng của nó."}, {"type": "mcq", "level": "TH", "q": "Trong các chữ số 0, 3, 8, có bao nhiêu chữ số có trục đối xứng nằm ngang?", "options": ["A. 0", "B. 1", "C. 2", "D. 3"], "answer": "D", "explain": "Cả ba chữ số 0, 3, 8 đều có trục đối xứng nằm ngang."}, {"type": "truefalse", "level": "VD", "q": "Cho hình lục giác đều ABCDEF. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình lục giác đều có 6 trục đối xứng.", "b) Ba trục đối xứng đi qua hai đỉnh đối diện của lục giác đều.", "c) Ba trục đối xứng đi qua trung điểm của hai cạnh đối diện.", "d) Hình lục giác đều có 12 trục đối xứng."], "answer": ["T", "T", "T", "F"], "explain": "Hình lục giác đều có đúng 6 trục đối xứng: 3 qua hai đỉnh đối diện và 3 qua trung điểm hai cạnh đối diện."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về hình tròn.", "statements": ["a) Hình tròn có vô số trục đối xứng.", "b) Mọi trục đối xứng của hình tròn đều đi qua tâm của nó.", "c) Đoạn thẳng nối tâm với một điểm trên đường tròn (bán kính) là trục đối xứng của hình tròn.", "d) Hình tròn có đúng 2 trục đối xứng."], "answer": ["T", "T", "F", "F"], "explain": "Trục đối xứng phải là đường thẳng (kéo dài vô hạn về hai phía); đoạn bán kính chỉ là một phần của trục đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ ME viết bằng chữ in hoa (từ \"MẸ\" không dấu) có bao nhiêu chữ cái có trục đối xứng?", "answer": "2", "explain": "Chữ M có trục đối xứng thẳng đứng, chữ E có trục đối xứng nằm ngang. Vậy có 2 chữ cái."}, {"type": "short", "level": "VDC", "q": "Điểm A cách đường thẳng d một khoảng 3 cm. Điểm A' đối xứng với A qua d. Độ dài đoạn thẳng AA' bằng bao nhiêu cm?", "answer": "6", "explain": "Gọi H là giao điểm của AA' và d thì HA = HA' = 3 cm, nên AA' = 3 + 3 = 6 cm."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khi gấp một hình theo đường thẳng d mà hai nửa của hình trùng khít lên nhau thì d được gọi là gì của hình?", "options": ["A. Trục đối xứng của hình", "B. Đường chéo của hình", "C. Đường trung bình của hình", "D. Đường phân giác của hình"], "answer": "A", "explain": "Đường thẳng mà khi gấp hình theo nó, hai nửa trùng khít thì gọi là trục đối xứng của hình."}, {"type": "mcq", "level": "NB", "q": "Cho đường tròn tâm O. Đường thẳng nào sau đây là trục đối xứng của đường tròn?", "options": ["A. Chỉ có đường thẳng đứng đi qua O", "B. Mọi đường thẳng đi qua O", "C. Chỉ có đường thẳng nằm ngang đi qua O", "D. Mọi đường thẳng không đi qua O"], "answer": "B", "explain": "Mọi đường thẳng đi qua tâm O đều là trục đối xứng của đường tròn."}, {"type": "mcq", "level": "NB", "q": "Hình vuông ABCD có các trục đối xứng là:", "options": ["A. Bốn cạnh của hình vuông", "B. Hai đường chéo của hình vuông", "C. Hai đường chéo và hai đường thẳng nối trung điểm hai cặp cạnh đối diện", "D. Hai đường thẳng nối trung điểm hai cặp cạnh đối diện"], "answer": "C", "explain": "Hình vuông có 4 trục đối xứng gồm hai đường chéo và hai đường nối trung điểm hai cặp cạnh đối diện."}, {"type": "mcq", "level": "TH", "q": "Chữ cái in hoa nào sau đây chỉ có trục đối xứng thẳng đứng mà không có trục đối xứng nằm ngang?", "options": ["A. B", "B. E", "C. H", "D. A"], "answer": "D", "explain": "Chữ A chỉ có trục thẳng đứng; B và E chỉ có trục nằm ngang; H có cả hai trục."}, {"type": "mcq", "level": "TH", "q": "Hình ảnh nào sau đây có trục đối xứng?", "options": ["A. Lá cờ Việt Nam (ngôi sao năm cánh)", "B. Chiếc lá bị rách một bên", "C. Bàn tay đang xòe", "D. Một chiếc giày thể thao"], "answer": "A", "explain": "Ngôi sao năm cánh có trục đối xứng thẳng đứng nên lá cờ Việt Nam có trục đối xứng."}, {"type": "mcq", "level": "TH", "q": "Cho $A'$ đối xứng với $A$ qua đường thẳng $d$. Đoạn thẳng $AA'$ và đường thẳng $d$ có quan hệ như thế nào?", "options": ["A. $d$ song song với $AA'$", "B. $d$ là đường trung trực của $AA'$", "C. $d$ cắt $AA'$ tại $A$", "D. $AA'$ nằm trên $d$"], "answer": "B", "explain": "Theo định nghĩa điểm đối xứng qua đường thẳng, $d$ là đường trung trực của $AA'$."}, {"type": "truefalse", "level": "VD", "q": "Cho hình thang cân ABCD (AB song song với CD). Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình thang cân ABCD có đúng 1 trục đối xứng.", "b) Trục đối xứng đi qua trung điểm của hai đáy AB và CD.", "c) Hình thang vuông có trục đối xứng.", "d) Đường chéo của hình thang cân là trục đối xứng của nó."], "answer": ["T", "T", "F", "F"], "explain": "Hình thang cân có đúng 1 trục đối xứng đi qua trung điểm hai đáy; hình thang vuông không có trục đối xứng; đường chéo không phải là trục đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về chữ cái in hoa.", "statements": ["a) Chữ O in hoa có vô số trục đối xứng.", "b) Chữ A in hoa có đúng 1 trục đối xứng.", "c) Chữ E in hoa có trục đối xứng thẳng đứng.", "d) Chữ M in hoa có trục đối xứng nằm ngang."], "answer": ["T", "T", "F", "F"], "explain": "Chữ O (vẽ tròn) có vô số trục đối xứng; chữ A có 1 trục thẳng đứng; chữ E có trục nằm ngang; chữ M có trục thẳng đứng."}, {"type": "short", "level": "VDC", "q": "Từ VIET viết bằng chữ in hoa (từ \"VIỆT\" không dấu) có bao nhiêu chữ cái có trục đối xứng?", "answer": "4", "explain": "Các chữ V, I, T có trục đối xứng thẳng đứng; chữ E và I có trục đối xứng nằm ngang. Cả 4 chữ V, I, E, T đều có trục đối xứng."}, {"type": "short", "level": "VDC", "q": "Một đường tròn có bán kính 7 cm. Đoạn trục đối xứng nằm trong hình tròn dài nhất bằng bao nhiêu cm?", "answer": "14", "explain": "Trục đối xứng dài nhất nằm trong hình tròn chính là đường kính: 7 x 2 = 14 cm."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Hình nào sau đây có đúng 3 trục đối xứng?", "options": ["A. Hình vuông", "B. Hình chữ nhật", "C. Tam giác đều", "D. Hình thoi"], "answer": "C", "explain": "Tam giác đều có 3 trục đối xứng; hình vuông có 4; hình chữ nhật và hình thoi có 2."}, {"type": "mcq", "level": "NB", "q": "Hình nào sau đây có 6 trục đối xứng?", "options": ["A. Hình vuông", "B. Hình tròn", "C. Hình thoi", "D. Hình lục giác đều"], "answer": "D", "explain": "Hình lục giác đều có 6 trục đối xứng; hình tròn có vô số trục đối xứng."}, {"type": "mcq", "level": "NB", "q": "Các trục đối xứng của đường tròn là những đường thẳng nào?", "options": ["A. Mọi đường thẳng đi qua tâm của đường tròn", "B. Mọi đường thẳng trên mặt phẳng", "C. Các bán kính của đường tròn", "D. Các đoạn đường kính của đường tròn"], "answer": "A", "explain": "Mỗi trục đối xứng của đường tròn là một đường thẳng đi qua tâm; bán kính hay đoạn đường kính chỉ là một phần của trục."}, {"type": "mcq", "level": "TH", "q": "Trong các hình: hình tròn, hình vuông, hình chữ nhật, hình bình hành, hình nào có NHIỀU trục đối xứng nhất?", "options": ["A. Hình vuông", "B. Hình tròn", "C. Hình chữ nhật", "D. Hình bình hành"], "answer": "B", "explain": "Hình tròn có vô số trục đối xứng, nhiều hơn mọi hình còn lại."}, {"type": "mcq", "level": "TH", "q": "Điểm M nằm trên trục đối xứng d của một hình. Điểm đối xứng của M qua d là điểm nào?", "options": ["A. Một điểm khác M", "B. Không xác định được", "C. Chính điểm M", "D. Không tồn tại điểm đối xứng"], "answer": "C", "explain": "Mọi điểm nằm trên trục đối xứng d đều đối xứng với chính nó qua d."}, {"type": "mcq", "level": "TH", "q": "Hình thoi ABCD (không phải hình vuông) có bao nhiêu trục đối xứng?", "options": ["A. 1", "B. 3", "C. 4", "D. 2"], "answer": "D", "explain": "Hai trục đối xứng của hình thoi chính là hai đường chéo của nó."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Mọi hình chữ nhật đều có 2 trục đối xứng.", "b) Hình vuông là hình chữ nhật đặc biệt nên cũng chỉ có 2 trục đối xứng.", "c) Mọi hình thoi đều có 2 trục đối xứng.", "d) Hình thang cân có 2 trục đối xứng."], "answer": ["T", "F", "T", "F"], "explain": "Hình vuông có 4 trục đối xứng (không phải 2); hình thang cân chỉ có 1 trục đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về chữ cái in hoa.", "statements": ["a) Chữ T in hoa có trục đối xứng thẳng đứng.", "b) Chữ B in hoa có trục đối xứng nằm ngang.", "c) Chữ C in hoa có trục đối xứng nằm ngang.", "d) Chữ D in hoa có trục đối xứng thẳng đứng."], "answer": ["T", "T", "T", "F"], "explain": "Chữ D in hoa có trục đối xứng nằm ngang (không phải thẳng đứng)."}, {"type": "short", "level": "VDC", "q": "Một hình vuông và một tam giác đều có chung một cạnh, tam giác nằm phía ngoài hình vuông (tạo thành hình \"ngôi nhà\"). Hình mới có bao nhiêu trục đối xứng?", "answer": "1", "explain": "Hình \"ngôi nhà\" chỉ có 1 trục đối xứng là đường thẳng đứng đi qua đỉnh của tam giác và trung điểm của cạnh đáy hình vuông."}, {"type": "short", "level": "VDC", "q": "Trong 29 chữ cái in hoa tiếng Việt (không dấu), có bao nhiêu chữ cái có trục đối xứng thẳng đứng?", "answer": "11", "explain": "Các chữ cái đó là: A, H, I, M, O, T, U, V, W, X, Y. Vậy có 11 chữ cái."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Cho $A'$ đối xứng với $A$ qua đường thẳng $d$, $H$ là giao điểm của $AA'$ và $d$. Khẳng định nào sau đây SAI?", "options": ["A. $AA'$ song song với $d$", "B. $H$ là trung điểm của $AA'$", "C. $AA'$ vuông góc với $d$", "D. $HA = HA'$"], "answer": "A", "explain": "Vì $d$ là đường trung trực của $AA'$ nên $AA'$ vuông góc với $d$ (không song song); khẳng định $AA'$ song song với $d$ là sai."}, {"type": "mcq", "level": "NB", "q": "Hình thang cân ABCD (AB song song với CD, AB và CD là hai đáy). Trục đối xứng của hình là đường thẳng nào?", "options": ["A. Đường chéo AC", "B. Đường thẳng đi qua trung điểm của AB và trung điểm của CD", "C. Đường chéo BD", "D. Cạnh bên AD"], "answer": "B", "explain": "Trục đối xứng của hình thang cân là đường thẳng đi qua trung điểm của hai đáy."}, {"type": "mcq", "level": "NB", "q": "Trong các hình sau, hình nào có trục đối xứng?", "options": ["A. Hình thang vuông", "B. Hình bình hành", "C. Hình tròn", "D. Tam giác thường (không cân)"], "answer": "C", "explain": "Hình tròn có vô số trục đối xứng; ba hình còn lại không có trục đối xứng."}, {"type": "mcq", "level": "TH", "q": "Trong các chữ số 0, 1, 8, chữ số nào có cả trục đối xứng thẳng đứng và trục đối xứng nằm ngang?", "options": ["A. 0", "B. 1", "C. 8", "D. Cả 0 và 8"], "answer": "D", "explain": "Cả hai chữ số 0 và 8 đều có trục thẳng đứng và trục nằm ngang; chữ số 1 không có trục đối xứng."}, {"type": "mcq", "level": "TH", "q": "Hai trục đối xứng của hình chữ nhật cắt nhau tại điểm nào?", "options": ["A. Giao điểm của hai đường chéo", "B. Trung điểm của một cạnh", "C. Một đỉnh của hình chữ nhật", "D. Một điểm nằm ngoài hình chữ nhật"], "answer": "A", "explain": "Hai trục đối xứng cắt nhau tại tâm của hình chữ nhật, cũng chính là giao điểm của hai đường chéo."}, {"type": "mcq", "level": "TH", "q": "Muốn kiểm tra một đường thẳng có phải là trục đối xứng của một hình hay không, ta có thể làm như thế nào?", "options": ["A. Đo độ dài của đường thẳng", "B. Gấp hình theo đường thẳng đó, nếu hai nửa trùng khít thì đó là trục đối xứng", "C. Đếm số điểm nằm trên đường thẳng", "D. Vẽ thêm một đường thẳng khác"], "answer": "B", "explain": "Dấu hiệu đơn giản nhất: gấp hình theo đường thẳng, hai nửa trùng khít thì đó là trục đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Một hình có thể có nhiều trục đối xứng.", "b) Mọi hình đều có ít nhất một trục đối xứng.", "c) Nếu d là trục đối xứng của hình thì gấp hình theo d, hai nửa trùng khít.", "d) Đường thẳng chia hình thành hai phần có diện tích bằng nhau thì luôn là trục đối xứng của hình."], "answer": ["T", "F", "T", "F"], "explain": "Hình bình hành, tam giác thường không có trục đối xứng nên b) sai; chia đôi diện tích chưa đủ, hai nửa còn phải trùng khít khi gấp nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Tam giác vuông cân có 1 trục đối xứng.", "b) Tam giác vuông (không cân) có trục đối xứng.", "c) Hai đường chéo của hình thoi đều là trục đối xứng.", "d) Hai đường chéo của hình bình hành là trục đối xứng."], "answer": ["T", "F", "T", "F"], "explain": "Tam giác vuông cân có 1 trục đối xứng; tam giác vuông không cân và hình bình hành không có trục đối xứng."}, {"type": "short", "level": "VDC", "q": "Một hình tròn bị khoét đi một hình tròn nhỏ hơn có tâm khác với tâm của hình tròn lớn. Hình còn lại có bao nhiêu trục đối xứng?", "answer": "1", "explain": "Trục đối xứng duy nhất là đường thẳng đi qua tâm của cả hai đường tròn."}, {"type": "short", "level": "VDC", "q": "Điểm A cách đường thẳng d một khoảng 4 cm, điểm B đối xứng với A qua d, điểm C đối xứng với B qua d. Điểm C và điểm A có quan hệ như thế nào?", "answer": "trùng nhau", "explain": "Đối xứng hai lần liên tiếp qua cùng một đường thẳng d thì trở về điểm ban đầu, nên điểm C trùng với điểm A."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Các trục đối xứng của hình lục giác đều gồm những đường thẳng nào?", "options": ["A. 6 đường chéo của lục giác đều", "B. 3 đường chéo của lục giác đều", "C. 3 đường thẳng đi qua hai đỉnh đối diện và 3 đường thẳng đi qua trung điểm hai cạnh đối diện", "D. 6 cạnh của lục giác đều"], "answer": "C", "explain": "Hình lục giác đều có 6 trục đối xứng: 3 qua hai đỉnh đối diện và 3 qua trung điểm hai cạnh đối diện."}, {"type": "mcq", "level": "NB", "q": "Tam giác ABC cân tại A, M là trung điểm của BC. Trục đối xứng của tam giác ABC là đường thẳng nào?", "options": ["A. Đường thẳng AB", "B. Đường thẳng AC", "C. Đường thẳng BC", "D. Đường thẳng AM"], "answer": "D", "explain": "Trục đối xứng đi qua đỉnh cân A và trung điểm M của cạnh đáy BC, tức là đường thẳng AM."}, {"type": "mcq", "level": "NB", "q": "Trong các hình sau, hình nào KHÔNG có trục đối xứng?", "options": ["A. Hình thang thường (không cân)", "B. Hình thang cân", "C. Hình thoi", "D. Hình chữ nhật"], "answer": "A", "explain": "Chỉ có hình thang cân mới có trục đối xứng; hình thang thường không có."}, {"type": "mcq", "level": "TH", "q": "Từ nào sau đây khi viết bằng chữ in hoa thì TẤT CẢ các chữ cái đều có trục đối xứng?", "options": ["A. AN", "B. TO", "C. FE", "D. GI"], "answer": "B", "explain": "Cả hai chữ T và O đều có trục đối xứng; các từ còn lại chứa chữ không có trục đối xứng (N, F, G)."}, {"type": "mcq", "level": "TH", "q": "So với hình vuông, hình tròn có số trục đối xứng như thế nào?", "options": ["A. Ít hơn", "B. Bằng nhau", "C. Nhiều hơn (vô số)", "D. Không so sánh được"], "answer": "C", "explain": "Hình tròn có vô số trục đối xứng, nhiều hơn 4 trục của hình vuông."}, {"type": "mcq", "level": "TH", "q": "Đường thẳng d cắt hình chữ nhật tại trung điểm của hai cạnh dài (hai cạnh đối diện). Khẳng định nào sau đây đúng?", "options": ["A. d không phải là trục đối xứng", "B. d là đường chéo của hình chữ nhật", "C. Không xác định được", "D. d là trục đối xứng của hình chữ nhật"], "answer": "D", "explain": "Đường thẳng nối trung điểm hai cạnh đối diện của hình chữ nhật chính là một trục đối xứng của nó."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về hình tròn.", "statements": ["a) Mọi đường thẳng đi qua tâm của đường tròn đều là trục đối xứng của nó.", "b) Đoạn thẳng nối tâm với một điểm trên đường tròn là trục đối xứng của hình tròn.", "c) Hình tròn có nhiều trục đối xứng hơn hình vuông.", "d) Bán kính của đường tròn là trục đối xứng của hình tròn."], "answer": ["T", "F", "T", "F"], "explain": "Trục đối xứng phải là đường thẳng (kéo dài vô hạn); đoạn thẳng hay bán kính chỉ là một phần của trục."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về chữ cái in hoa.", "statements": ["a) Chữ Y in hoa có trục đối xứng thẳng đứng.", "b) Chữ W in hoa có trục đối xứng thẳng đứng.", "c) Chữ Z in hoa có trục đối xứng.", "d) Chữ S in hoa có trục đối xứng."], "answer": ["T", "T", "F", "F"], "explain": "Chữ Y và W có trục thẳng đứng; chữ Z và S không có trục đối xứng (nhưng có tâm đối xứng)."}, {"type": "short", "level": "VDC", "q": "Hình vuông ABCD. Dựng 4 tam giác đều ra phía ngoài trên mỗi cạnh của hình vuông. Hình mới tạo thành có bao nhiêu trục đối xứng?", "answer": "4", "explain": "Thêm 4 tam giác đều đối xứng nhau trên 4 cạnh không làm mất tính đối xứng của hình vuông, hình mới vẫn có 4 trục đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ DOI XUNG viết bằng chữ in hoa (từ \"ĐỐI XỨNG\" không dấu) có bao nhiêu chữ cái có trục đối xứng?", "answer": "5", "explain": "Các chữ D, O, I, X, U có trục đối xứng; N và G không có. Vậy có 5 chữ cái."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm $A'$ được gọi là điểm đối xứng của điểm $A$ qua đường thẳng $d$ khi nào?", "options": ["A. $d$ là đường trung trực của đoạn thẳng $AA'$", "B. $d$ đi qua $A$", "C. $d$ song song với $AA'$", "D. $A'$ nằm trên $d$"], "answer": "A", "explain": "Định nghĩa: $A'$ đối xứng với $A$ qua $d$ khi $d$ là đường trung trực của đoạn thẳng $AA'$."}, {"type": "mcq", "level": "NB", "q": "Hai trục đối xứng của hình thoi là hai đường nào?", "options": ["A. Hai cạnh đối diện của hình thoi", "B. Hai đường chéo của hình thoi", "C. Hai đường thẳng nối trung điểm các cạnh", "D. Một đường chéo và một cạnh"], "answer": "B", "explain": "Hai đường chéo của hình thoi chính là hai trục đối xứng của nó."}, {"type": "mcq", "level": "NB", "q": "Hình chữ nhật (không phải hình vuông) có bao nhiêu trục đối xứng?", "options": ["A. 1", "B. 3", "C. 2", "D. 4"], "answer": "C", "explain": "Hai trục đối xứng là hai đường thẳng nối trung điểm hai cặp cạnh đối diện."}, {"type": "mcq", "level": "TH", "q": "Trong các hình: tam giác đều, hình vuông, hình lục giác đều, hình tròn, hình có SỐ trục đối xứng ÍT NHẤT là hình nào?", "options": ["A. Hình vuông", "B. Hình lục giác đều", "C. Hình tròn", "D. Tam giác đều"], "answer": "D", "explain": "Tam giác đều có 3 trục, ít nhất trong các hình đã cho (vuông 4, lục giác đều 6, tròn vô số)."}, {"type": "mcq", "level": "TH", "q": "Chữ cái in hoa nào sau đây có đúng một trục đối xứng và trục đó nằm ngang?", "options": ["A. B", "B. A", "C. O", "D. H"], "answer": "A", "explain": "Chữ B chỉ có một trục đối xứng nằm ngang; A chỉ có trục thẳng đứng; O và H có hai trục."}, {"type": "mcq", "level": "TH", "q": "Hình ảnh con diều hình thoi có bao nhiêu trục đối xứng?", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "B", "explain": "Con diều hình thoi có 2 trục đối xứng là hai đường chéo của hình thoi."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định so sánh số trục đối xứng.", "statements": ["a) Hình vuông có nhiều trục đối xứng hơn hình chữ nhật.", "b) Hình thoi có số trục đối xứng bằng số trục đối xứng của hình chữ nhật.", "c) Hình thang cân có số trục đối xứng bằng số trục đối xứng của tam giác cân.", "d) Hình lục giác đều có số trục đối xứng gấp đôi số trục đối xứng của tam giác đều."], "answer": ["T", "T", "T", "T"], "explain": "4 lớn hơn 2; 2 bằng 2; 1 bằng 1; 6 gấp đôi 3. Cả bốn khẳng định đều đúng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Mọi hình thang đều có trục đối xứng.", "b) Mọi hình bình hành đều không có trục đối xứng.", "c) Mọi hình chữ nhật đều có trục đối xứng.", "d) Mọi tứ giác đều có trục đối xứng."], "answer": ["F", "T", "T", "F"], "explain": "Chỉ hình thang cân mới có trục đối xứng; tứ giác thường (lồi lõm tùy ý) không có trục đối xứng."}, {"type": "short", "level": "VDC", "q": "Bốn hình tròn bằng nhau được xếp sao cho tâm của chúng là bốn đỉnh của một hình vuông. Hình gồm 4 hình tròn này có bao nhiêu trục đối xứng?", "answer": "4", "explain": "Bốn tâm tạo thành hình vuông nên hình hợp có tính đối xứng như hình vuông: 4 trục đối xứng."}, {"type": "short", "level": "VDC", "q": "Chữ O viết in hoa được vẽ thành một đường tròn. Hỏi chữ O này có bao nhiêu trục đối xứng?", "answer": "vô số", "explain": "Mọi đường thẳng đi qua tâm của đường tròn đều là trục đối xứng nên chữ O có vô số trục đối xứng."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trục đối xứng của hình thang cân ABCD (đáy AB, CD) là đường thẳng nào?", "options": ["A. Đường chéo AC", "B. Đường chéo BD", "C. Đường thẳng đi qua trung điểm của hai đáy AB và CD", "D. Cạnh bên AD"], "answer": "C", "explain": "Trục đối xứng của hình thang cân là đường thẳng đi qua trung điểm của hai đáy."}, {"type": "mcq", "level": "NB", "q": "Cho đường tròn tâm O. Khẳng định nào sau đây đúng về trục đối xứng của đường tròn?", "options": ["A. Chỉ có một trục đối xứng duy nhất", "B. Không có trục đối xứng nào", "C. Mọi đường thẳng đều là trục đối xứng", "D. Mọi đường thẳng đi qua O đều là trục đối xứng"], "answer": "D", "explain": "Mọi đường thẳng đi qua tâm O đều là trục đối xứng của đường tròn (vô số trục)."}, {"type": "mcq", "level": "NB", "q": "Trong các khẳng định sau, khẳng định nào đúng?", "options": ["A. Hình vuông có 4 trục đối xứng", "B. Hình chữ nhật có 4 trục đối xứng", "C. Hình thoi có 4 trục đối xứng", "D. Hình bình hành có 2 trục đối xứng"], "answer": "A", "explain": "Hình vuông có 4 trục; hình chữ nhật và hình thoi (thường) chỉ có 2 trục; hình bình hành không có trục."}, {"type": "mcq", "level": "TH", "q": "Hình nào sau đây có đúng 2 trục đối xứng?", "options": ["A. Hình vuông", "B. Hình chữ nhật", "C. Hình tròn", "D. Tam giác đều"], "answer": "B", "explain": "Hình chữ nhật (thường) có đúng 2 trục đối xứng; hình vuông có 4; hình tròn có vô số; tam giác đều có 3."}, {"type": "mcq", "level": "TH", "q": "Điểm $B$ đối xứng với điểm $A$ qua đường thẳng $d$, $H$ là chân đường vuông góc kẻ từ $A$ đến $d$ và $AH = 5$ cm. Độ dài đoạn $BH$ bằng bao nhiêu?", "options": ["A. $10$ cm", "B. $2,5$ cm", "C. $5$ cm", "D. Không xác định được"], "answer": "C", "explain": "$H$ là trung điểm của $AB$ nên $BH = AH = 5$ cm."}, {"type": "mcq", "level": "TH", "q": "Hình ảnh nào sau đây KHÔNG có trục đối xứng?", "options": ["A. Con bướm xòe cánh", "B. Chiếc lá nguyên vẹn", "C. Mặt đồng hồ hình tròn", "D. Một chiếc giày"], "answer": "D", "explain": "Một chiếc giày đơn lẻ không có tính đối xứng; ba hình còn lại đều có trục đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Đường tròn có vô số trục đối xứng.", "b) Hình bình hành không có trục đối xứng.", "c) Mọi tam giác cân đều có đúng 1 trục đối xứng.", "d) Mọi hình thang đều có 1 trục đối xứng."], "answer": ["T", "T", "T", "F"], "explain": "Chỉ hình thang cân mới có 1 trục đối xứng; hình thang thường không có."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Nếu gấp hình theo đường thẳng d mà hai nửa trùng khít thì d là trục đối xứng của hình.", "b) Một hình chỉ có tối đa 1 trục đối xứng.", "c) Hình vuông có 4 trục đối xứng.", "d) Chữ N in hoa có trục đối xứng."], "answer": ["T", "F", "T", "F"], "explain": "Nhiều hình có hơn 1 trục đối xứng (vuông 4, tròn vô số) nên b) sai; chữ N không có trục đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ DEP viết bằng chữ in hoa (từ \"ĐẸP\" không dấu) có bao nhiêu chữ cái có trục đối xứng?", "answer": "2", "explain": "Chữ D và E có trục đối xứng (nằm ngang); chữ P không có. Vậy có 2 chữ cái."}, {"type": "short", "level": "VDC", "q": "Vẽ tất cả các trục đối xứng của một hình chữ nhật (không phải hình vuông). Các trục đối xứng đó cắt nhau tại mấy điểm?", "answer": "1", "explain": "Hình chữ nhật có 2 trục đối xứng, chúng cắt nhau tại đúng 1 điểm là tâm của hình chữ nhật."}]}]}
