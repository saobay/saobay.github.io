 Trung điểm của cạnh AD", "D. Giao điểm của hai đường chéo AC và BD"], "answer": "D", "explain": "Tâm đối xứng của hình bình hành là giao điểm của hai đường chéo."}, {"type": "mcq", "level": "NB", "q": "Hình nào sau đây không có trục đối xứng?", "options": ["A. Hình bình hành", "B. Hình chữ nhật", "C. Hình thoi", "D. Hình vuông"], "answer": "A", "explain": "Hình bình hành (thường) không có trục đối xứng; ba hình còn lại đều có."}, {"type": "mcq", "level": "TH", "q": "Chữ H viết in hoa có tính đối xứng như thế nào?", "options": ["A. Chỉ có tâm đối xứng", "B. Có cả tâm đối xứng và 2 trục đối xứng", "C. Chỉ có 1 trục đối xứng", "D. Không có cả tâm và trục đối xứng"], "answer": "B", "explain": "Chữ H vừa có tâm đối xứng, vừa có 2 trục đối xứng (thẳng đứng và nằm ngang)."}, {"type": "mcq", "level": "TH", "q": "Hình thoi (không phải hình vuông) có bao nhiêu trục đối xứng và bao nhiêu tâm đối xứng?", "options": ["A. 4 trục đối xứng và 1 tâm đối xứng", "B. 2 trục đối xứng và 2 tâm đối xứng", "C. 2 trục đối xứng và 1 tâm đối xứng", "D. 1 trục đối xứng và 1 tâm đối xứng"], "answer": "C", "explain": "Hình thoi có 2 trục đối xứng là hai đường chéo và 1 tâm đối xứng là giao điểm hai đường chéo."}, {"type": "mcq", "level": "TH", "q": "Tam giác cân có tính đối xứng như thế nào?", "options": ["A. Có 1 trục đối xứng và 1 tâm đối xứng", "B. Không có trục đối xứng nhưng có tâm đối xứng", "C. Có 3 trục đối xứng", "D. Có 1 trục đối xứng và không có tâm đối xứng"], "answer": "D", "explain": "Tam giác cân có đúng 1 trục đối xứng (qua đỉnh cân và trung điểm cạnh đáy) và không có tâm đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Mọi hình có tâm đối xứng đều có trục đối xứng.", "b) Mọi hình có trục đối xứng đều có tâm đối xứng.", "c) Hình bình hành là ví dụ về hình có tâm đối xứng nhưng không có trục đối xứng.", "d) Hình thang cân là ví dụ về hình có trục đối xứng nhưng không có tâm đối xứng."], "answer": ["F", "F", "T", "T"], "explain": "Có tâm chưa chắc có trục (hình bình hành) và có trục chưa chắc có tâm (hình thang cân)."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Điểm đối xứng của A qua đường thẳng d: d là đường trung trực của đoạn nối A với điểm đó.", "b) Điểm đối xứng của A qua điểm O: O là trung điểm của đoạn nối A với điểm đó.", "c) Nếu điểm M nằm trên trục đối xứng d thì M đối xứng với chính nó qua d.", "d) Nếu điểm M trùng với tâm đối xứng O thì M đối xứng với chính nó qua O."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn khẳng định đều đúng theo định nghĩa điểm đối xứng qua đường thẳng và qua một điểm."}, {"type": "short", "level": "VDC", "q": "Từ TAM DOI XUNG viết bằng chữ in hoa (cụm từ \"TÂM ĐỐI XỨNG\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "4", "explain": "Các chữ O, I, X, N có tâm đối xứng; T, A, M, D, U, G không có. Vậy có 4 chữ cái."}, {"type": "short", "level": "VDC", "q": "Hình vuông ABCD có tâm đối xứng O. Có bao nhiêu đường thẳng đi qua O là trục đối xứng của hình vuông?", "answer": "4", "explain": "Cả 4 trục đối xứng của hình vuông đều đi qua tâm O."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Hình tròn có bao nhiêu trục đối xứng?", "options": ["A. Vô số", "B. 1", "C. 2", "D. 4"], "answer": "A", "explain": "Mọi đường thẳng đi qua tâm của đường tròn đều là trục đối xứng của nó."}, {"type": "mcq", "level": "NB", "q": "Tâm đối xứng của đoạn thẳng AB là điểm nào?", "options": ["A. Điểm A", "B. Trung điểm của đoạn thẳng AB", "C. Điểm B", "D. Một điểm nằm ngoài đoạn thẳng AB"], "answer": "B", "explain": "Trung điểm của đoạn thẳng là tâm đối xứng của đoạn thẳng đó."}, {"type": "mcq", "level": "NB", "q": "Hình thang cân có bao nhiêu trục đối xứng?", "options": ["A. 0", "B. 2", "C. 1", "D. 3"], "answer": "C", "explain": "Hình thang cân có đúng 1 trục đối xứng đi qua trung điểm của hai đáy."}, {"type": "mcq", "level": "TH", "q": "Chữ O viết in hoa (vẽ thành đường tròn) có tính đối xứng như thế nào?", "options": ["A. Có 2 trục đối xứng và 1 tâm đối xứng", "B. Có vô số trục đối xứng nhưng không có tâm đối xứng", "C. Có 1 trục đối xứng và 1 tâm đối xứng", "D. Có vô số trục đối xứng và 1 tâm đối xứng"], "answer": "D", "explain": "Chữ O vẽ tròn có tính đối xứng như hình tròn: vô số trục đối xứng và 1 tâm đối xứng là tâm của nó."}, {"type": "mcq", "level": "TH", "q": "Trong các hình: hình vuông, hình chữ nhật, hình bình hành, hình thoi, hình nào KHÁC với các hình còn lại về tính đối xứng?", "options": ["A. Hình bình hành", "B. Hình vuông", "C. Hình chữ nhật", "D. Hình thoi"], "answer": "A", "explain": "Hình bình hành không có trục đối xứng, còn ba hình kia vừa có trục vừa có tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Điểm $A$ cách đường thẳng $d$ một khoảng $6$ cm, điểm $A'$ đối xứng với $A$ qua $d$. Độ dài đoạn thẳng $AA'$ bằng bao nhiêu?", "options": ["A. $6$ cm", "B. $12$ cm", "C. $3$ cm", "D. $18$ cm"], "answer": "B", "explain": "$d$ là đường trung trực của $AA'$ nên $AA' = 2 x 6 = 12$ cm."}, {"type": "truefalse", "level": "VD", "q": "Cho hình vuông ABCD, O là tâm đối xứng của nó. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình vuông có 4 trục đối xứng.", "b) Hình vuông có 1 tâm đối xứng.", "c) Giao điểm của các trục đối xứng trùng với tâm đối xứng O.", "d) Hình vuông có 2 tâm đối xứng."], "answer": ["T", "T", "T", "F"], "explain": "Hình vuông có 4 trục đối xứng và đúng 1 tâm đối xứng là giao điểm của chúng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình lục giác đều có 6 trục đối xứng.", "b) Hình lục giác đều có tâm đối xứng.", "c) Tam giác đều có tâm đối xứng.", "d) Hình tròn có nhiều trục đối xứng hơn hình lục giác đều."], "answer": ["T", "T", "F", "T"], "explain": "Tam giác đều không có tâm đối xứng; hình tròn có vô số trục, nhiều hơn 6 trục của lục giác đều."}, {"type": "short", "level": "VDC", "q": "Từ TRUC DOI XUNG viết bằng chữ in hoa (cụm từ \"TRỤC ĐỐI XỨNG\" không dấu) có bao nhiêu chữ cái có trục đối xứng?", "answer": "8", "explain": "Các chữ T, U, C, D, O, I, X, U có trục đối xứng; R, N, G không có. Vậy có 8 chữ cái."}, {"type": "short", "level": "VDC", "q": "Một hình chữ nhật có chu vi 36 cm, chiều dài hơn chiều rộng 6 cm. Đoạn trục đối xứng nằm trong hình chữ nhật dài hơn bằng bao nhiêu cm?", "answer": "12", "explain": "Chiều dài = (36 : 2 + 6) : 2 = 12 cm, chiều rộng = 6 cm. Trục đối xứng dài hơn nằm dọc theo chiều dài nên dài 12 cm."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Tam giác đều có bao nhiêu trục đối xứng?", "options": ["A. 1", "B. 2", "C. 3", "D. 6"], "answer": "C", "explain": "Tam giác đều có 3 trục đối xứng qua mỗi đỉnh và trung điểm cạnh đối diện."}, {"type": "mcq", "level": "NB", "q": "Tâm đối xứng của hình thoi ABCD là điểm nào?", "options": ["A. Đỉnh A", "B. Trung điểm của cạnh AB", "C. Giao điểm của một đường chéo với một cạnh", "D. Giao điểm của hai đường chéo AC và BD"], "answer": "D", "explain": "Tâm đối xứng của hình thoi là giao điểm của hai đường chéo."}, {"type": "mcq", "level": "NB", "q": "Hai điểm $A$ và $B$ đối xứng nhau qua đường thẳng $d$. Khẳng định nào sau đây đúng?", "options": ["A. $d$ là đường trung trực của đoạn thẳng $AB$", "B. $d$ song song với $AB$", "C. $d$ đi qua $A$ và $B$", "D. $AB$ nằm trên $d$"], "answer": "A", "explain": "Định nghĩa hai điểm đối xứng qua đường thẳng: $d$ là đường trung trực của $AB$."}, {"type": "mcq", "level": "TH", "q": "Chữ S viết in hoa có tính đối xứng như thế nào?", "options": ["A. Có trục đối xứng nhưng không có tâm đối xứng", "B. Có tâm đối xứng nhưng không có trục đối xứng", "C. Có cả tâm và trục đối xứng", "D. Không có cả tâm và trục đối xứng"], "answer": "B", "explain": "Chữ S có tâm đối xứng nhưng không có trục đối xứng nào."}, {"type": "mcq", "level": "TH", "q": "Hình nào sau đây có vô số trục đối xứng?", "options": ["A. Hình vuông", "B. Hình lục giác đều", "C. Hình tròn", "D. Hình chữ nhật"], "answer": "C", "explain": "Chỉ có hình tròn là có vô số trục đối xứng."}, {"type": "mcq", "level": "TH", "q": "Cho hình bình hành ABCD, O là tâm đối xứng của nó. Điểm đối xứng của đỉnh B qua O là đỉnh nào?", "options": ["A. Đỉnh A", "B. Đỉnh C", "C. Đỉnh B", "D. Đỉnh D"], "answer": "D", "explain": "O là trung điểm của đường chéo BD nên D đối xứng với B qua O."}, {"type": "truefalse", "level": "VD", "q": "Cho hình chữ nhật ABCD (không phải hình vuông), O là tâm đối xứng. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình chữ nhật có 2 trục đối xứng.", "b) Hai trục đối xứng của hình chữ nhật vuông góc với nhau.", "c) Hai đường chéo của hình chữ nhật là trục đối xứng của nó.", "d) Tâm đối xứng của hình chữ nhật là giao điểm của hai đường chéo."], "answer": ["T", "T", "F", "T"], "explain": "Hai trục nối trung điểm cạnh đối diện vuông góc với nhau; hai đường chéo không phải là trục đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về chữ cái in hoa.", "statements": ["a) Chữ A in hoa có trục đối xứng.", "b) Chữ A in hoa có tâm đối xứng.", "c) Chữ N in hoa có trục đối xứng.", "d) Chữ N in hoa có tâm đối xứng."], "answer": ["T", "F", "F", "T"], "explain": "Chữ A chỉ có trục đối xứng; chữ N chỉ có tâm đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ HINH PHANG viết bằng chữ in hoa (cụm từ \"HÌNH PHẲNG\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "6", "explain": "Các chữ H, I, N, H, H, N có tâm đối xứng; P, A, G không có. Vậy có 6 chữ cái."}, {"type": "short", "level": "VDC", "q": "Một hình vuông và một hình tròn có cùng tâm O. Hình gồm cả hai hình này có bao nhiêu trục đối xứng?", "answer": "4", "explain": "Trục đối xứng của hình hợp phải là trục chung của cả hai: hình vuông có 4 trục, hình tròn có vô số trục, phần chung là 4 trục."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Hình lục giác đều có bao nhiêu trục đối xứng?", "options": ["A. 6", "B. 3", "C. 4", "D. 12"], "answer": "A", "explain": "Hình lục giác đều có 6 trục đối xứng."}, {"type": "mcq", "level": "NB", "q": "Tâm đối xứng của đường tròn là điểm nào?", "options": ["A. Một điểm trên đường tròn", "B. Tâm của đường tròn", "C. Trung điểm của một bán kính", "D. Điểm nằm ngoài đường tròn"], "answer": "B", "explain": "Tâm của đường tròn chính là tâm đối xứng (duy nhất) của nó."}, {"type": "mcq", "level": "NB", "q": "Hình nào sau đây vừa có tâm đối xứng, vừa có trục đối xứng?", "options": ["A. Hình bình hành", "B. Hình thang cân", "C. Hình chữ nhật", "D. Tam giác thường"], "answer": "C", "explain": "Hình chữ nhật vừa có tâm vừa có 2 trục đối xứng; hình bình hành chỉ có tâm; hình thang cân chỉ có trục."}, {"type": "mcq", "level": "TH", "q": "Chữ X viết in hoa có tính đối xứng như thế nào?", "options": ["A. Có 4 trục đối xứng và 1 tâm đối xứng", "B. Chỉ có tâm đối xứng", "C. Chỉ có 2 trục đối xứng", "D. Có 2 trục đối xứng và 1 tâm đối xứng"], "answer": "D", "explain": "Chữ X có 2 trục đối xứng (thẳng đứng, nằm ngang) và 1 tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Điểm M nằm trên trục đối xứng d của một hình. Điểm đối xứng của M qua d là điểm nào?", "options": ["A. Chính điểm M", "B. Một điểm khác M", "C. Không xác định được", "D. Điểm đối xứng với M qua tâm"], "answer": "A", "explain": "Mọi điểm nằm trên trục đối xứng đều đối xứng với chính nó qua trục đó."}, {"type": "mcq", "level": "TH", "q": "Hình thang cân có tính đối xứng như thế nào?", "options": ["A. Có 1 trục đối xứng và 1 tâm đối xứng", "B. Có 1 trục đối xứng và không có tâm đối xứng", "C. Không có trục đối xứng nhưng có tâm đối xứng", "D. Có 2 trục đối xứng"], "answer": "B", "explain": "Hình thang cân có đúng 1 trục đối xứng (qua trung điểm hai đáy) và không có tâm đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về hình tròn.", "statements": ["a) Mọi đường thẳng đi qua tâm của đường tròn đều là trục đối xứng của nó.", "b) Hình tròn có vô số tâm đối xứng.", "c) Bán kính của đường tròn là trục đối xứng của hình tròn.", "d) Đường thẳng chứa đường kính của đường tròn là trục đối xứng của nó."], "answer": ["T", "F", "F", "T"], "explain": "Hình tròn chỉ có một tâm đối xứng; trục đối xứng phải là đường thẳng (không phải đoạn bán kính)."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Đoạn thẳng có 1 tâm đối xứng là trung điểm của nó.", "b) Hình bình hành có 2 trục đối xứng là hai đường chéo.", "c) Hình thoi có 2 trục đối xứng là hai đường chéo.", "d) Hình vuông có 4 trục đối xứng."], "answer": ["T", "F", "T", "T"], "explain": "Hình bình hành không có trục đối xứng nào; hai đường chéo chỉ là trục đối xứng của hình thoi (và hình vuông)."}, {"type": "short", "level": "VDC", "q": "Từ TU NHIEN viết bằng chữ in hoa (cụm từ \"TỰ NHIÊN\" không dấu) có bao nhiêu chữ cái có trục đối xứng?", "answer": "5", "explain": "Các chữ T, U, H, I, E có trục đối xứng; N (2 lần) không có. Vậy có 5 chữ cái."}, {"type": "short", "level": "VDC", "q": "Cho điểm O. Vẽ hai đoạn thẳng AB và CD cùng nhận O làm trung điểm, AB vuông góc với CD và AB = CD = 10 cm. Tứ giác ACBD là hình gì?", "answer": "hình vuông", "explain": "Hai đường chéo AB, CD bằng nhau, vuông góc và cắt nhau tại trung điểm nên tứ giác ACBD là hình vuông."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Đường thẳng $d$ được gọi là trục đối xứng của một hình khi nào?", "options": ["A. $d$ đi qua mọi điểm của hình", "B. $d$ không cắt hình", "C. Mỗi điểm trên hình có điểm đối xứng qua $d$ cũng thuộc hình", "D. $d$ là cạnh của hình"], "answer": "C", "explain": "Khái niệm trục đối xứng của một hình."}, {"type": "mcq", "level": "NB", "q": "Hình thoi (không phải hình vuông) có bao nhiêu trục đối xứng?", "options": ["A. 1", "B. 3", "C. 4", "D. 2"], "answer": "D", "explain": "Hai trục đối xứng của hình thoi là hai đường chéo của nó."}, {"type": "mcq", "level": "NB", "q": "Điểm $O$ được gọi là tâm đối xứng của một hình khi nào?", "options": ["A. Mỗi điểm trên hình có điểm đối xứng qua $O$ cũng thuộc hình", "B. $O$ là điểm duy nhất của hình", "C. Hình gồm duy nhất điểm $O$", "D. $O$ nằm ngoài hình"], "answer": "A", "explain": "Khái niệm tâm đối xứng của một hình."}, {"type": "mcq", "level": "TH", "q": "Chữ E viết in hoa có tính đối xứng như thế nào?", "options": ["A. Có 1 trục đối xứng thẳng đứng và không có tâm đối xứng", "B. Có 1 trục đối xứng nằm ngang và không có tâm đối xứng", "C. Có tâm đối xứng nhưng không có trục đối xứng", "D. Có cả tâm và trục đối xứng"], "answer": "B", "explain": "Chữ E chỉ có một trục đối xứng nằm ngang, không có tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Cho đường tròn tâm O, điểm A nằm trên đường tròn, điểm B đối xứng với A qua O. Đoạn thẳng AB là gì của đường tròn?", "options": ["A. Bán kính của đường tròn", "B. Dây cung bất kì", "C. Đường kính của đường tròn", "D. Tiếp tuyến của đường tròn"], "answer": "C", "explain": "B đối xứng với A qua tâm O nên AB đi qua O và có độ dài gấp đôi bán kính, tức là đường kính."}, {"type": "mcq", "level": "TH", "q": "Trong các hình: tam giác cân, tam giác đều, hình vuông, hình có NHIỀU trục đối xứng nhất là hình nào?", "options": ["A. Tam giác cân", "B. Tam giác đều", "C. Cả ba hình bằng nhau", "D. Hình vuông"], "answer": "D", "explain": "Hình vuông có 4 trục, nhiều hơn tam giác đều (3) và tam giác cân (1)."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về tam giác.", "statements": ["a) Tam giác cân có 1 trục đối xứng.", "b) Tam giác cân không có tâm đối xứng.", "c) Tam giác đều có 3 trục đối xứng.", "d) Tam giác đều có tâm đối xứng."], "answer": ["T", "T", "T", "F"], "explain": "Tam giác (kể cả tam giác đều) không có tâm đối xứng."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình vuông là hình chữ nhật đặc biệt.", "b) Hình vuông có nhiều trục đối xứng hơn hình chữ nhật.", "c) Hình vuông có tâm đối xứng còn hình chữ nhật thì không.", "d) Cả hình vuông và hình chữ nhật đều vừa có tâm vừa có trục đối xứng."], "answer": ["T", "T", "F", "T"], "explain": "Cả hai hình đều có tâm đối xứng là giao điểm hai đường chéo; hình vuông có 4 trục, hình chữ nhật có 2 trục."}, {"type": "short", "level": "VDC", "q": "Từ THUC TIEN viết bằng chữ in hoa (cụm từ \"THỰC TIỄN\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "3", "explain": "Các chữ H, I, N có tâm đối xứng; T, U, C, E không có. Vậy có 3 chữ cái."}, {"type": "short", "level": "VDC", "q": "Chữ H viết in hoa có bao nhiêu trục đối xứng?", "answer": "2", "explain": "Chữ H có 2 trục đối xứng: một thẳng đứng và một nằm ngang."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tâm đối xứng của hình bình hành là điểm nào?", "options": ["A. Giao điểm của hai đường chéo", "B. Trung điểm của một cạnh", "C. Một đỉnh của hình bình hành", "D. Điểm nằm ngoài hình bình hành"], "answer": "A", "explain": "Tâm đối xứng của hình bình hành là giao điểm của hai đường chéo."}, {"type": "mcq", "level": "NB", "q": "Hình chữ nhật (không phải hình vuông) có bao nhiêu trục đối xứng?", "options": ["A. 1", "B. 2", "C. 4", "D. Vô số"], "answer": "B", "explain": "Hai trục đối xứng là hai đường thẳng nối trung điểm hai cặp cạnh đối diện."}, {"type": "mcq", "level": "NB", "q": "Chữ cái in hoa nào sau đây có cả trục đối xứng thẳng đứng và trục đối xứng nằm ngang?", "options": ["A. A", "B. E", "C. O", "D. N"], "answer": "C", "explain": "Chữ O có cả hai trục; A chỉ có trục thẳng đứng; E chỉ có trục nằm ngang; N không có trục."}, {"type": "mcq", "level": "TH", "q": "Hình nào sau đây KHÔNG có tâm đối xứng?", "options": ["A. Hình vuông", "B. Hình thoi", "C. Hình tròn", "D. Tam giác đều"], "answer": "D", "explain": "Tam giác đều không có tâm đối xứng; ba hình còn lại đều có."}, {"type": "mcq", "level": "TH", "q": "Muốn kiểm tra một đường thẳng có phải là trục đối xứng của một hình hay không, ta có thể làm gì?", "options": ["A. Gấp hình theo đường thẳng đó, nếu hai nửa trùng khít thì đó là trục đối xứng", "B. Đo độ dài đường thẳng đó", "C. Đếm số giao điểm của đường thẳng với hình", "D. Quay hình nửa vòng quanh đường thẳng"], "answer": "A", "explain": "Dấu hiệu nhận biết trục đối xứng: gấp theo đường thẳng, hai nửa trùng khít."}, {"type": "mcq", "level": "TH", "q": "Điểm $A'$ đối xứng với điểm $A$ qua điểm $O$, biết $OA = 9$ cm. Độ dài đoạn thẳng $OA'$ bằng bao nhiêu?", "options": ["A. $18$ cm", "B. $9$ cm", "C. $4,5$ cm", "D. Không xác định được"], "answer": "B", "explain": "$O$ là trung điểm của $AA'$ nên $OA' = OA = 9$ cm."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Nếu đường thẳng d là trục đối xứng của hình thì d chia hình thành hai nửa bằng nhau.", "b) Mọi đường thẳng chia hình thành hai nửa bằng nhau đều là trục đối xứng của hình.", "c) Trục đối xứng của hình chữ nhật đi qua trung điểm các cặp cạnh đối diện.", "d) Mọi đường thẳng đi qua tâm của hình chữ nhật đều là trục đối xứng của nó."], "answer": ["T", "F", "T", "F"], "explain": "Chia đôi diện tích chưa đủ để là trục đối xứng (hai nửa còn phải trùng khít khi gấp); chỉ có 2 đường qua trung điểm cạnh đối diện là trục."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau về chữ cái in hoa.", "statements": ["a) Chữ H in hoa có 2 trục đối xứng.", "b) Chữ H in hoa có tâm đối xứng.", "c) Chữ I in hoa có 2 trục đối xứng.", "d) Chữ I in hoa có tâm đối xứng."], "answer": ["T", "T", "T", "T"], "explain": "Cả hai chữ H và I đều vừa có 2 trục đối xứng, vừa có tâm đối xứng."}, {"type": "short", "level": "VDC", "q": "Từ KET NOI viết bằng chữ in hoa (cụm từ \"KẾT NỐI\" không dấu) có bao nhiêu chữ cái có trục đối xứng?", "answer": "4", "explain": "Các chữ E, T, O, I có trục đối xứng; K và N không có. Vậy có 4 chữ cái."}, {"type": "short", "level": "VDC", "q": "Vẽ hình đối xứng của tam giác ABC qua điểm O (O nằm ngoài tam giác). Hình nhận được là hình gì?", "answer": "hình tam giác", "explain": "Phép đối xứng qua một điểm biến tam giác thành tam giác bằng với nó, nên hình nhận được vẫn là một hình tam giác."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tâm đối xứng của hình vuông là điểm nào?", "options": ["A. Một đỉnh của hình vuông", "B. Trung điểm của một cạnh", "C. Giao điểm của hai đường chéo", "D. Điểm nằm ngoài hình vuông"], "answer": "C", "explain": "Tâm đối xứng của hình vuông là giao điểm của hai đường chéo."}, {"type": "mcq", "level": "NB", "q": "Hình tròn có bao nhiêu trục đối xứng và bao nhiêu tâm đối xứng?", "options": ["A. 1 trục đối xứng và 1 tâm đối xứng", "B. Vô số trục đối xứng và vô số tâm đối xứng", "C. 4 trục đối xứng và 1 tâm đối xứng", "D. Vô số trục đối xứng và 1 tâm đối xứng"], "answer": "D", "explain": "Mọi đường thẳng qua tâm đều là trục (vô số); tâm đối xứng duy nhất là tâm đường tròn."}, {"type": "mcq", "level": "NB", "q": "Chữ Z viết in hoa có tính đối xứng như thế nào?", "options": ["A. Có tâm đối xứng nhưng không có trục đối xứng", "B. Có trục đối xứng nhưng không có tâm đối xứng", "C. Có cả tâm và trục đối xứng", "D. Không có cả tâm và trục đối xứng"], "answer": "A", "explain": "Chữ Z có tâm đối xứng nhưng không có trục đối xứng nào."}, {"type": "mcq", "level": "TH", "q": "Trong các chữ số 0 và 8, các chữ số có cả tâm đối xứng và trục đối xứng là:", "options": ["A. Chỉ chữ số 0", "B. Cả hai chữ số 0 và 8", "C. Chỉ chữ số 8", "D. Không có chữ số nào"], "answer": "B", "explain": "Cả hai chữ số 0 và 8 đều vừa có tâm đối xứng, vừa có trục đối xứng."}, {"type": "mcq", "level": "TH", "q": "Cho hình thoi ABCD, O là giao điểm của hai đường chéo. Khẳng định nào sau đây đúng?", "options": ["A. O là tâm đối xứng nhưng hình thoi không có trục đối xứng", "B. Hai đường chéo là trục đối xứng nhưng hình thoi không có tâm đối xứng", "C. O là tâm đối xứng, hai đường chéo là hai trục đối xứng", "D. O không phải là tâm đối xứng"], "answer": "C", "explain": "Hình thoi vừa có tâm đối xứng là giao điểm hai đường chéo, vừa có 2 trục đối xứng là hai đường chéo."}, {"type": "mcq", "level": "TH", "q": "Điểm $B$ đối xứng với điểm $A$ qua đường thẳng $d$, $H$ là giao điểm của $AB$ và $d$. Khẳng định nào sau đây đúng?", "options": ["A. $H$ trùng với $A$", "B. $AB$ song song với $d$", "C. $H$ trùng với $B$", "D. $H$ là trung điểm của $AB$"], "answer": "D", "explain": "Vì $d$ là đường trung trực của $AB$ nên $H$ là trung điểm của $AB$."}, {"type": "truefalse", "level": "VD", "q": "Cho hình thoi ABCD (không phải hình vuông), O là giao điểm hai đường chéo. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Hình thoi có 2 trục đối xứng là hai đường chéo.", "b) Hình thoi có 1 tâm đối xứng là giao điểm hai đường chéo.", "c) Hình vuông cũng là hình thoi nên có cùng số trục đối xứng với hình thoi.", "d) Hình bình hành có tâm đối xứng là giao điểm hai đường chéo."], "answer": ["T", "T", "F", "T"], "explain": "Hình vuông có 4 trục đối xứng, nhiều hơn 2 trục của hình thoi thường."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Quay một hình nửa vòng quanh tâm đối xứng thì hình trùng khít với chính nó.", "b) Gấp một hình theo trục đối xứng thì hai nửa trùng khít với nhau.", "c) Mọi hình có tâm đối xứng quay 90 độ quanh tâm đều trùng khít.", "d) Hình tròn quay một góc bất kì quanh tâm của nó đều trùng khít với chính nó."], "answer": ["T", "T", "F", "T"], "explain": "Quay 90 độ trùng khít không đúng với mọi hình có tâm đối xứng (ví dụ hình chữ nhật thường)."}, {"type": "short", "level": "VDC", "q": "Từ CUOC SONG viết bằng chữ in hoa (cụm từ \"CUỘC SỐNG\" không dấu) có bao nhiêu chữ cái có tâm đối xứng?", "answer": "4", "explain": "Các chữ O, S, O, N có tâm đối xứng; C, U, G không có. Vậy có 4 chữ cái."}, {"type": "short", "level": "VDC", "q": "Hai đường tròn bằng nhau có tâm lần lượt là O1 và O2. Tâm đối xứng của hình gồm cả hai đường tròn là điểm nào?", "answer": "trung điểm của đoạn O1O2", "explain": "Tâm đối xứng của hình hợp hai đường tròn bằng nhau là trung điểm của đoạn thẳng nối hai tâm."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đường tròn có bao nhiêu tâm đối xứng?", "options": ["A. 1 (duy nhất là tâm đường tròn)", "B. 0", "C. 2", "D. Vô số"], "answer": "A", "explain": "Đường tròn chỉ có đúng một tâm đối xứng là tâm của nó."}, {"type": "mcq", "level": "NB", "q": "Hình thang cân có tính đối xứng như thế nào?", "options": ["A. Có 1 trục đối xứng và 1 tâm đối xứng", "B. Có 1 trục đối xứng và không có tâm đối xứng", "C. Không có trục đối xứng nhưng có tâm đối xứng", "D. Có 2 trục đối xứng"], "answer": "B", "explain": "Hình thang cân có đúng 1 trục đối xứng và không có tâm đối xứng."}, {"type": "mcq", "level": "NB", "q": "Chữ cái in hoa nào sau đây có tâm đối xứng?", "options": ["A. A", "B. T", "C. N", "D. M"], "answer": "C", "explain": "Chữ N có tâm đối xứng; A, T, M không có tâm đối xứng."}, {"type": "mcq", "level": "TH", "q": "Trong các hình đã học, hình có SỐ trục đối xứng NHIỀU NHẤT là hình nào?", "options": ["A. Hình vuông", "B. Hình lục giác đều", "C. Tam giác đều", "D. Hình tròn"], "answer": "D", "explain": "Hình tròn có vô số trục đối xứng, nhiều nhất trong các hình đã học."}, {"type": "mcq", "level": "TH", "q": "Điểm M nằm trên trục đối xứng d của một hình. Điểm đối xứng của M qua d là điểm nào?", "options": ["A. Chính điểm M", "B. Một điểm khác M", "C. Không xác định được", "D. Điểm đối xứng với M qua tâm"], "answer": "A", "explain": "Mọi điểm nằm trên trục đối xứng đều đối xứng với chính nó qua trục đó."}, {"type": "mcq", "level": "TH", "q": "Hình lục giác đều có bao nhiêu trục đối xứng và có tâm đối xứng không?", "options": ["A. 6 trục đối xứng nhưng không có tâm đối xứng", "B. 6 trục đối xứng và có tâm đối xứng", "C. 3 trục đối xứng và có tâm đối xứng", "D. 12 trục đối xứng và có tâm đối xứng"], "answer": "B", "explain": "Hình lục giác đều có 6 trục
