: "mcq", "level": "TH", "q": "Hình bình hành có cạnh đáy $33$ cm, chiều cao tương ứng $18$ cm thì diện tích của nó là bao nhiêu?", "options": ["A. $102$ cm2", "B. $594$ cm2", "C. $1188$ cm2", "D. $51$ cm2"], "answer": "B", "explain": "Diện tích là $33 \\times 18 = 594$ (cm2)."}, {"type": "truefalse", "level": "VD", "q": "Cho hình thoi $EFGH$ có cạnh $13$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Chu vi của hình thoi là $52$ cm.", "b) Hai đường chéo của hình thoi vuông góc với nhau.", "c) Hình thoi có bốn góc vuông.", "d) $EF = FG = GH = HE$."], "answer": ["T", "T", "F", "T"], "explain": "Chu vi là $4 \\times 13 = 52$ (cm) nên a) đúng; hai đường chéo vuông góc nên b) đúng; hình thoi nói chung không có góc vuông nên c) sai; bốn cạnh bằng nhau nên d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Cho hình thang có hai đáy dài $28$ cm, $20$ cm và chiều cao $12$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Diện tích của hình thang là $288$ cm2.", "b) Diện tích của hình thang là $(28 + 20) \\times 12 : 2$ cm2.", "c) Nếu đáy lớn gấp đôi và các yếu tố khác không đổi thì diện tích gấp đôi.", "d) Chu vi của hình thang bằng tổng hai đáy cộng hai lần cạnh bên (nếu là thang cân)."], "answer": ["T", "T", "F", "T"], "explain": "Diện tích là $(28 + 20) \\times 12 : 2 = 288$ (cm2) nên a), b) đúng; diện tích không gấp đôi khi chỉ đáy lớn gấp đôi nên c) sai; d) đúng theo công thức chu vi thang cân."}, {"type": "short", "level": "VDC", "q": "Một lá cờ hình thoi có hai đường chéo dài $45$ cm và $60$ cm. Tính diện tích của lá cờ đó (đơn vị: cm2).", "answer": "1350", "explain": "Diện tích là $(45 \\times 60) : 2 = 1350$ (cm2)."}, {"type": "short", "level": "VDC", "q": "Một hình chữ nhật có nửa chu vi $72$ m, chiều dài $45$ m. Tính diện tích của hình chữ nhật đó (đơn vị: m2).", "answer": "1215", "explain": "Chiều rộng là $72 - 45 = 27$ (m). Diện tích là $45 \\times 27 = 1215$ (m2)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hình tam giác đều $ABC$ có $AB = 8$ cm thì chu vi của nó là bao nhiêu?", "options": ["A. $24$ cm", "B. $16$ cm", "C. $64$ cm", "D. $11$ cm"], "answer": "A", "explain": "Chu vi là $3 \\times 8 = 24$ (cm)."}, {"type": "mcq", "level": "NB", "q": "Hình chữ nhật là tứ giác có đặc điểm nào sau đây?", "options": ["A. Ba góc vuông", "B. Hai cạnh bằng nhau", "C. Bốn góc vuông", "D. Hai góc vuông"], "answer": "C", "explain": "Hình chữ nhật là tứ giác có bốn góc vuông."}, {"type": "mcq", "level": "NB", "q": "Diện tích của hình vuông có cạnh $12$ cm là bao nhiêu?", "options": ["A. $48$ cm2", "B. $144$ cm2", "C. $24$ cm2", "D. $36$ cm2"], "answer": "B", "explain": "Diện tích là $12 \\times 12 = 144$ (cm2)."}, {"type": "mcq", "level": "TH", "q": "Hình thoi có hai đường chéo dài $32$ cm và $26$ cm thì diện tích của nó là bao nhiêu?", "options": ["A. $58$ cm2", "B. $116$ cm2", "C. $832$ cm2", "D. $416$ cm2"], "answer": "D", "explain": "Diện tích là $(32 \\times 26) : 2 = 416$ (cm2)."}, {"type": "mcq", "level": "TH", "q": "Hình lục giác đều có cạnh $23$ cm thì chu vi của nó là bao nhiêu?", "options": ["A. $46$ cm", "B. $529$ cm", "C. $138$ cm", "D. $115$ cm"], "answer": "C", "explain": "Chu vi là $6 \\times 23 = 138$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Hình bình hành có hai cạnh kề dài $37$ cm và $24$ cm thì chu vi của nó là bao nhiêu?", "options": ["A. $122$ cm", "B. $61$ cm", "C. $888$ cm", "D. $85$ cm"], "answer": "A", "explain": "Chu vi là $2 \\times (37 + 24) = 122$ (cm)."}, {"type": "truefalse", "level": "VD", "q": "Cho hình chữ nhật có chiều dài $36$ cm, chiều rộng $24$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Diện tích của hình chữ nhật là $864$ cm2.", "b) Chu vi của hình chữ nhật là $120$ cm.", "c) Chiều dài gấp rưỡi chiều rộng.", "d) Hai đường chéo của hình chữ nhật không bằng nhau."], "answer": ["T", "T", "T", "F"], "explain": "Diện tích là $36 \\times 24 = 864$ (cm2) nên a) đúng; chu vi là $2 \\times (36 + 24) = 120$ (c , "level": "TH", "q": "Một hình vuông có diện tích $256$ cm2 thì chu vi của nó là bao nhiêu?", "options": ["A. $64$ cm", "B. $16$ cm", "C. $1024$ cm", "D. $32$ cm"], "answer": "A", "explain": "Độ dài cạnh là $16$ cm (vì $16 \\times 16 = 256$). Chu vi là $4 \\times 16 = 64$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Hình chữ nhật có chiều dài $29$ cm, chiều rộng $21$ cm thì chu vi của nó là bao nhiêu?", "options": ["A. $50$ cm", "B. $609$ cm2", "C. $200$ cm", "D. $100$ cm"], "answer": "D", "explain": "Chu vi là $2 \\times (29 + 21) = 100$ (cm)."}, {"type": "mcq", "level": "TH", "q": "Hình thang có hai đáy dài $32$ cm, $24$ cm và chiều cao $15$ cm thì diện tích của nó là bao nhiêu?", "options": ["A. $840$ cm2", "B. $420$ cm2", "C. $71$ cm2", "D. $56$ cm2"], "answer": "B", "explain": "Diện tích là $(32 + 24) \\times 15 : 2 = 420$ (cm2)."}, {"type": "truefalse", "level": "VD", "q": "Cho hình lục giác đều có cạnh $9$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Chu vi của hình lục giác đều là $54$ cm.", "b) Mỗi góc của hình lục giác đều bằng $120^\\circ$.", "c) Hình lục giác đều có chín cạnh.", "d) Hình lục giác đều được ghép từ sáu hình tam giác đều."], "answer": ["T", "T", "F", "T"], "explain": "Chu vi là $6 \\times 9 = 54$ (cm) nên a) đúng; mỗi góc bằng $120^\\circ$ nên b) đúng; lục giác có sáu cạnh nên c) sai; d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Cho hình bình hành $ABCD$ có $AB = 21$ cm, $AD = 14$ cm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Chu vi của hình bình hành là $70$ cm.", "b) $CD = 21$ cm.", "c) $BC = 21$ cm.", "d) Góc $B$ bằng góc $D$."], "answer": ["T", "T", "F", "T"], "explain": "Chu vi là $2 \\times (21 + 14) = 70$ (cm) nên a) đúng; cạnh đối $CD = AB = 21$ (cm) nên b) đúng; $BC = AD = 14$ (cm) nên c) sai; các góc đối bằng nhau nên d) đúng."}, {"type": "short", "level": "VDC", "q": "Một khu đất hình bình hành có cạnh đáy $60$ m, chiều cao tương ứng $42$ m. Tính diện tích của khu đất đó (đơn vị: m2).", "answer": "2520", "explain": "Diện tích là $60 \\times 42 = 2520$ (m2)."}, {"type": "short", "level": "VDC", "q": "Một hình chữ nhật có chiều dài $48$ cm, chiều rộng $36$ cm. Tính chu vi của hình chữ nhật đó (đơn vị: cm).", "answer": "168", "explain": "Chu vi là $2 \\times (48 + 36) = 168$ (cm)."}]}]}
