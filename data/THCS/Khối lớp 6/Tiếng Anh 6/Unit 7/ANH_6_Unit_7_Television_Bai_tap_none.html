 songs on Saturdays.", "d) The programmes for children finish at 4 p.m."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: đài truyền hình nhỏ (small). b) Đúng. c) Đúng. d) Sai: chương trình từ 4 đến 6 giờ, tức kết thúc lúc 6 giờ."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["educational", "có tính giáo dục"], ["popular", "được yêu thích, phổ biến"], ["boring", "nhàm chán"], ["funny", "buồn cười, hài hước"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["do", "What", "channel", "you", "usually", "watch", "in", "the", "evening"], "points": 1, "explain": "Câu đúng: What channel do you usually watch in the evening?"}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Mum, can I watch the cartoon on VTV7? B: OK, but finish your homework first. A: I finished it. The cartoon starts at five. B: All right. You can watch it.", "sub_questions": [{"q": "Which channel is the cartoon on?", "options": ["VTV1", "VTV3", "VTV7"], "answer": 2}, {"q": "What must the child do first?", "options": ["Finish homework", "Have dinner", "Go to bed"], "answer": 0}], "points": 1, "explain": "Phim hoạt hình chiếu trên VTV7; bạn nhỏ phải làm xong bài tập về nhà trước."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Please turn on the television and choose channel seven.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm và ngữ điệu."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'th' is pronounced differently from the others.", "options": ["A. think", "B. than", "C. thick", "D. three"], "answer": "B", "explain": "than có th đọc là /ð/; think, thick, three đều có th đọc là /θ/."}, {"type": "mcq", "level": "NB", "q": "A TV programme where people play games and win prizes is a ___.", "options": ["A. documentary", "B. game show", "C. news", "D. cartoon"], "answer": "B", "explain": "game show là chương trình trò chơi, người chơi tham gia trò chơi và giành giải thưởng."}, {"type": "mcq", "level": "TH", "q": "___ does your sister watch after school? — Cartoons.", "options": ["A. Who", "B. When", "C. What", "D. Where"], "answer": "C", "explain": "Câu trả lời 'Cartoons' là sự vật nên hỏi What (cái gì)."}, {"type": "mcq", "level": "TH", "q": "I want to watch the film ___ I have a lot of homework today.", "options": ["A. and", "B. because", "C. so", "D. but"], "answer": "D", "explain": "Hai ý trái ngược nhau (muốn xem phim nhưng nhiều bài tập) nối bằng but."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. animal", "B. umbrella", "C. library", "D. hospital"], "answer": "B", "explain": "umbrella nhấn âm thứ hai (um-BREL-la); animal, library, hospital đều nhấn âm thứ nhất."}, {"type": "mcq", "level": "VD", "q": "___ is sitting in front of the TV? — My grandfather.", "options": ["A. What", "B. Who", "C. Where", "D. Which"], "answer": "B", "explain": "Câu trả lời chỉ người (My grandfather) nên hỏi Who."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Hoa's favourite programme is Master Chef, a cooking show. It is on TV every Saturday evening. Hoa watches it with her mother. They learn new dishes from the show. Last week, they cooked noodles together.", "statements": ["a) Master Chef is a cooking show.", "b) The show is on TV every Sunday evening.", "c) Hoa watches it with her father.", "d) Hoa and her mother cooked noodles last week."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Sai: chương trình chiếu tối thứ Bảy. c) Sai: Hoa xem cùng mẹ. d) Đúng."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Jack is from England. He is learning Vietnamese. He watches Vietnamese programmes every day to learn the language. He likes the programme Learn Vietnamese on VTV7 most. Now he can say many Vietnamese words.", "statements": ["a) Jack is from Vietnam.", "b) He watches TV to learn Vietnamese.", "c) His favourite programme is on VTV1.", "d) He cannot speak any Vietnamese."], "answer": ["F", "T", "F", "F"], "explain": "a) Sai: Jack đến từ nước Anh. b) Đúng. c) Sai: chương trình ở trên VTV7. d) Sai: bây giờ anh ấy nói được nhiều từ tiếng Việt."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["screen", "màn hình"], ["volume", "âm lượng"], ["actor", "diễn viên nam"], ["schedule", "lịch phát sóng"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["are", "They", "watching", "a", "football", "match", "on", "television", "now"], "points": 1, "explain": "Câu đúng: They are watching a football match on television now."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What is on TV tonight, Dad? B: There is a great film at half past seven. A: What is it about? B: It is about animals in Africa.", "sub_questions": [{"q": "What is on TV tonight?", "options": ["A cartoon", "A great film", "A game show"], "answer": 1}, {"q": "What is the film about?", "options": ["Animals in Africa", "Life in the city", "Sports in Viet Nam"], "answer": 0}], "points": 1, "explain": "Tối nay có một bộ phim hay về các loài vật ở châu Phi."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Documentaries about nature are very interesting.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm và ngữ điệu."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'th' is pronounced differently from the others.", "options": ["A. together", "B. birthday", "C. weather", "D. mother"], "answer": "B", "explain": "birthday có th đọc là /θ/; together, weather, mother đều có th đọc là /ð/."}, {"type": "mcq", "level": "NB", "q": "The people in a film or a TV programme are called ___.", "options": ["A. viewers", "B. characters", "C. channels", "D. programmes"], "answer": "B", "explain": "characters là các nhân vật trong phim hoặc chương trình."}, {"type": "mcq", "level": "TH", "q": "___ is your favourite programme on? — On Sunday mornings.", "options": ["A. When", "B. Who", "C. Whose", "D. How"], "answer": "A", "explain": "Câu trả lời 'On Sunday mornings' chỉ thời điểm nên hỏi When."}, {"type": "mcq", "level": "TH", "q": "Our TV is broken, ___ we cannot watch the match tonight.", "options": ["A. because", "B. so", "C. but", "D. and"], "answer": "B", "explain": "'we cannot watch the match' là kết quả của việc TV hỏng, nên dùng so."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. director", "B. reporter", "C. presenter", "D. audience"], "answer": "D", "explain": "audience nhấn âm thứ nhất (AU-dience); director, reporter, presenter đều nhấn âm thứ hai."}, {"type": "mcq", "level": "VD", "q": "___ channels does your TV have? — More than fifty.", "options": ["A. How many", "B. How much", "C. How long", "D. How often"], "answer": "A", "explain": "channels là danh từ đếm được nên hỏi số lượng bằng How many."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: My school has a TV room. Students can watch educational programmes there at break time. The programmes are about science and history. Students love them because they are interesting and useful.", "statements": ["a) Students can watch TV in the TV room at break time.", "b) The programmes are only about music.", "c) The programmes are about science and history.", "d) Students do not like the programmes."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: chương trình về khoa học và lịch sử. c) Đúng. d) Sai: học sinh rất thích các chương trình đó."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Last night, there was a big storm in our city. The TV news told people to stay at home. My family stayed in and watched a film together. The storm stopped at midnight.", "statements": ["a) There was a big storm last night.", "b) The TV news told people to go out.", "c) The family watched a film together.", "d) The storm stopped in the morning."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: bản tin khuyên mọi người ở trong nhà. c) Đúng. d) Sai: cơn bão dừng lúc nửa đêm."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["turn on", "bật lên"], ["turn off", "tắt đi"], ["watch", "xem"], ["favourite", "yêu thích nhất"]], "points": 1, "explain": "Nối mỗi từ/cụm từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["often", "My", "father", "watches", "the", "news", "after", "dinner"], "points": 1, "explain": "Câu đúng: My father often watches the news after dinner."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: I am bored. What can we watch? B: There is a funny comedy on channel 2. A: Great! When does it start? B: In ten minutes.", "sub_questions": [{"q": "What can they watch?", "options": ["A sad film", "A funny comedy", "The news"], "answer": 1}, {"q": "Which channel is the comedy on?", "options": ["Channel 2", "Channel 5", "Channel 7"], "answer": 0}], "points": 1, "explain": "Có một chương trình hài vui nhộn trên kênh 2, bắt đầu sau mười phút nữa."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "My brother and I always watch cartoons together.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm và ngữ điệu."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'th' is pronounced differently from the others.", "options": ["A. this", "B. that", "C. thin", "D. them"], "answer": "C", "explain": "thin có th đọc là /θ/; this, that, them đều có th đọc là /ð/."}, {"type": "mcq", "level": "NB", "q": "A ___ is a person who watches television at home.", "options": ["A. viewer", "B. character", "C. actor", "D. channel"], "answer": "A", "explain": "viewer là người xem truyền hình."}, {"type": "mcq", "level": "TH", "q": "___ programme do you like, the comedy or the cartoon?", "options": ["A. Which", "B. Who", "C. When", "D. Whose"], "answer": "A", "explain": "Câu hỏi đưa ra hai lựa chọn (the comedy or the cartoon) nên dùng Which."}, {"type": "mcq", "level": "TH", "q": "Do you want to watch the news ___ a game show?", "options": ["A. and", "B. or", "C. so", "D. because"], "answer": "B", "explain": "Câu hỏi đưa ra sự lựa chọn nên dùng or (hoặc)."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. wonderful", "B. terrible", "C. exciting", "D. interesting"], "answer": "C", "explain": "exciting nhấn âm thứ hai (ex-CI-ting); wonderful, terrible, interesting đều nhấn âm thứ nhất."}, {"type": "mcq", "level": "VD", "q": "___ did you miss the show? — Because I was busy.", "options": ["A. Why", "B. When", "C. Who", "D. Which"], "answer": "A", "explain": "Câu trả lời bắt đầu bằng Because nên câu hỏi phải là Why."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Anna gets up early every morning. She watches the weather forecast at 6.30 to know the weather for the day. Then she has breakfast and goes to school. She never watches cartoons in the morning.", "statements": ["a) Anna gets up late every morning.", "b) She watches the weather forecast at 6.30.", "c) She has breakfast before going to school.", "d) She watches cartoons in the morning."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: Anna dậy sớm. b) Đúng. c) Đúng. d) Sai: cô không bao giờ xem hoạt hình vào buổi sáng."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: The programme Who Is the Millionaire is a famous game show in Viet Nam. Players answer questions to win money. Many questions are about history, sports and science. The show is on VTV3 every Tuesday evening.", "statements": ["a) Who Is the Millionaire is a cartoon.", "b) Players answer questions to win money.", "c) The questions are only about music.", "d) The show is on VTV3 on Tuesday evenings."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: đó là chương trình trò chơi (game show). b) Đúng. c) Sai: câu hỏi về lịch sử, thể thao và khoa học. d) Đúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["local", "địa phương"], ["national", "toàn quốc"], ["popular", "phổ biến"], ["live", "trực tiếp"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["not", "He", "does", "like", "horror", "films", "because", "they", "are", "scary"], "points": 1, "explain": "Câu đúng: He does not like horror films because they are scary."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What do you think of this talent show? B: It is great. The singers are wonderful. A: Who is your favourite singer? B: I like Lan Anh best.", "sub_questions": [{"q": "What do they think of the talent show?", "options": ["It is boring", "It is great", "It is too long"], "answer": 1}, {"q": "Who is the favourite singer?", "options": ["Lan Anh", "Mai Anh", "Thu Ha"], "answer": 0}], "points": 1, "explain": "Họ thấy chương trình tìm kiếm tài năng rất hay và ca sĩ được yêu thích là Lan Anh."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Television programmes can be educational and funny.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm và ngữ điệu."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'th' is pronounced differently from the others.", "options": ["A. earth", "B. they", "C. their", "D. there"], "answer": "A", "explain": "earth có th ở cuối đọc là /θ/; they, their, there đều có th đọc là /ð/."}, {"type": "mcq", "level": "NB", "q": "The ___ tells us which programmes are on TV and when they start.", "options": ["A. schedule", "B. screen", "C. volume", "D. character"], "answer": "A", "explain": "schedule là lịch phát sóng, cho biết chương trình nào phát lúc mấy giờ."}, {"type": "mcq", "level": "TH", "q": "___ can we watch the match? — On VTV3.", "options": ["A. What", "B. Where", "C. When", "D. Who"], "answer": "B", "explain": "Câu trả lời 'On VTV3' chỉ nơi/kênh xem; trong các lựa chọn, Where phù hợp để hỏi nơi xem."}, {"type": "mcq", "level": "TH", "q": "I like this programme ___ it is very educational.", "options": ["A. so", "B. but", "C. because", "D. or"], "answer": "C", "explain": "'it is very educational' là lí do yêu thích chương trình, nên dùng because."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. comedy", "B. computer", "C. channel", "D. programme"], "answer": "B", "explain": "computer nhấn âm thứ hai (com-PU-ter); comedy, channel, programme đều nhấn âm thứ nhất."}, {"type": "mcq", "level": "VD", "q": "___ did you buy that new TV? — Last weekend.", "options": ["A. When", "B. Where", "C. Who", "D. How"], "answer": "A", "explain": "Câu trả lời 'Last weekend' chỉ thời gian trong quá khứ nên hỏi When."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: There is a new cartoon about a clever cat and a funny dog. It is on TV every afternoon at 5. Children love it because the stories are short and funny. My little brother watches it every day.", "statements": ["a) The cartoon is about a cat and a dog.", "b) It is on TV every morning.", "c) The stories are long and boring.", "d) Children love the cartoon."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Sai: phim chiếu vào buổi chiều lúc 5 giờ. c) Sai: các câu chuyện ngắn và vui nhộn. d) Đúng."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Mr Brown is a reporter. He works for a TV station in London. He often travels to many places to make news reports. He loves his job because he can meet many people.", "statements": ["a) Mr Brown works in a school.", "b) He travels to many places for his job.", "c) He makes cartoons for children.", "d) He loves his job."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: ông làm việc cho một đài truyền hình. b) Đúng. c) Sai: ông làm bản tin thời sự. d) Đúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["singer", "ca sĩ"], ["dancer", "vũ công"], ["winner", "người thắng cuộc"], ["prize", "giải thưởng"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["should", "Children", "not", "watch", "too", "much", "TV", "every", "day"], "points": 1, "explain": "Câu đúng: Children should not watch too much TV every day."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Which programme is more interesting, the news or the documentary? B: I think the documentary is. It is about the sea. A: When is it on? B: At nine tonight.", "sub_questions": [{"q": "Which programme does the speaker like more?", "options": ["The news", "The documentary", "A game show"], "answer": 1}, {"q": "What is the documentary about?", "options": ["The mountains", "The sea", "The forest"], "answer": 1}], "points": 1, "explain": "Người nói thích phim tài liệu hơn; bộ phim nói về biển và chiếu lúc 9 giờ tối nay."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "We are watching an interesting film about animals.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm và ngữ điệu."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'th' is pronounced differently from the others.", "options": ["A. bath", "B. both", "C. then", "D. month"], "answer": "C", "explain": "then có th đọc là /ð/; bath, both, month đều có th đọc là /θ/."}, {"type": "mcq", "level": "NB", "q": "A programme that teaches you new things is ___.", "options": ["A. educational", "B. boring", "C. local", "D. funny"], "answer": "A", "explain": "educational nghĩa là có tính giáo dục, giúp học điều mới."}, {"type": "mcq", "level": "TH", "q": "___ are you watching? — A football match.", "options": ["A. What", "B. Where", "C. Who", "D. When"], "answer": "A", "explain": "Câu trả lời 'A football match' là sự vật nên hỏi What."}, {"type": "mcq", "level": "TH", "q": "The show is interesting ___ a bit long.", "options": ["A. but", "B. so", "C. and", "D. because"], "answer": "A", "explain": "'interesting' và 'a bit long' là hai nhận xét trái chiều, nối bằng but."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. banana", "B. tomato", "C. favourite", "D. potato"], "answer": "C", "explain": "favourite nhấn âm thứ nhất (FA-vourite); banana, tomato, potato đều nhấn âm thứ hai."}, {"type": "mcq", "level": "VD", "q": "___ is the weather forecast on? — After the news.", "options": ["A. When", "B. Who", "C. Which", "D. Whose"], "answer": "A", "explain": "Câu trả lời 'After the news' chỉ thời điểm phát sóng nên hỏi When."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: My father is a busy man, but he watches the news every evening. He says the news helps him know about the world. He does not like game shows. He thinks they are noisy.", "statements": ["a) The father watches the news every evening.", "b) He thinks the news is boring.", "c) He likes game shows very much.", "d) The news helps him know about the world."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Sai: bố nói bản tin giúp ông biết về thế giới. c) Sai: bố không thích chương trình trò chơi. d) Đúng."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Many years ago, families did not have colour TV. They watched black and white programmes. Today, smart TVs can connect to the Internet. People can watch films and programmes at any time they like.", "statements": ["a) Long ago, families watched colour TV.", "b) Old TVs showed black and white programmes.", "c) Smart TVs cannot connect to the Internet.", "d) People can watch programmes at any time today."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: ngày xưa chưa có TV màu. b) Đúng. c) Sai: TV thông minh kết nối được Internet. d) Đúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["clever", "thông minh"], ["noisy", "ồn ào"], ["quiet", "yên tĩnh"], ["scary", "đáng sợ"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["watch", "Let", "us", "the", "talent", "show", "together", "tonight"], "points": 1, "explain": "Câu đúng: Let us watch the talent show together tonight."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Dad, I cannot find the remote control. B: It is on the table, next to the TV. A: Oh, I see it. Thank you. B: You are welcome.", "sub_questions": [{"q": "What is the child looking for?", "o
