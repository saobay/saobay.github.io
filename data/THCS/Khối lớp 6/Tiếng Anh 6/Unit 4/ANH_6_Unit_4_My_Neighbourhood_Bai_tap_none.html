el": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. station", "B. museum", "C. temple", "D. garden"], "answer": "B", "explain": "Museum nhấn âm thứ 2 (mu-SE-um); station, temple, garden đều nhấn âm thứ 1."}, {"type": "mcq", "level": "TH", "q": "Trains stop at the ______.", "options": ["A. post office", "B. railway station", "C. square", "D. pharmacy"], "answer": "B", "explain": "Railway station là nhà ga xe lửa, nơi trains (tàu hỏa) dừng."}, {"type": "mcq", "level": "TH", "q": "This street is ______ than the one near my school.", "options": ["A. long", "B. longer", "C. longest", "D. more long"], "answer": "B", "explain": "Có than nên dùng so sánh hơn của long là longer."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. He is gooder than his brother at English.", "B. He is better than his brother at English.", "C. He is more good than his brother at English.", "D. He is the better than his brother at English."], "answer": "B", "explain": "Good là tính từ bất quy tắc: so sánh hơn của good là better, không phải gooder hay more good."}, {"type": "mcq", "level": "VD", "q": "A: I am lost. Can you help me? B: ______", "options": ["A. Where do you want to go?", "B. I am lost too.", "C. It is a nice day.", "D. Goodbye."], "answer": "A", "explain": "Người kia bị lạc, câu đáp hợp lý là hỏi họ muốn đi đâu để chỉ đường."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: There is a big square in my town. People come here every evening. Children play football and fly kites. There are many trees around the square, so it is cool and green.", "statements": ["a) The square is small.", "b) People come to the square every evening.", "c) Children fly kites in the square.", "d) There are no trees around the square."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: quảng trường lớn (big square). b) Đúng: mọi người đến đây mỗi buổi tối. c) Đúng: trẻ em thả diều ở quảng trường. d) Sai: có nhiều cây quanh quảng trường."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: My grandmother lives in a village. It is smaller and quieter than my town. The air is cleaner and the people are friendlier. However, there are fewer shops, and the hospital is farther than in the town.", "statements": ["a) The village is bigger than the town.", "b) The air in the village is cleaner.", "c) There are more shops in the village.", "d) The hospital is nearer in the village."], "answer": ["F", "T", "F", "F"], "explain": "a) Sai: làng nhỏ hơn thị trấn. b) Đúng: không khí sạch hơn. c) Sai: làng có ít cửa hàng hơn (fewer shops). d) Sai: bệnh viện ở làng xa hơn (farther)."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["post office", "bưu điện"], ["swimming pool", "bể bơi"], ["restaurant", "nhà hàng"], ["bookshop", "hiệu sách"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng của nó."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["My", "house", "is", "nearer", "than", "yours"], "points": 1, "explain": "Câu đúng: My house is nearer than yours."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Where is the post office? B: It is on Le Loi Street. Go straight and turn right at the bookshop. A: Is it far? B: No, it is near here.", "sub_questions": [{"q": "Where is the post office?", "options": ["On Le Loi Street", "On Tran Hung Dao Street", "Near the park"], "answer": 0}, {"q": "Is the post office far?", "options": ["Yes, very far", "No, it is near", "It is opposite the school"], "answer": 1}], "points": 1, "explain": "Bưu điện ở phố Le Loi và ở gần đây (near here), không xa."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "My neighbourhood is quieter than yours", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm và trọng âm của từ."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'i' is pronounced differently from the others.", "options": ["A. dinner", "B. visa", "C. winter", "D. river"], "answer": "B", "explain": "Visa có chữ i đọc là /iː/ kéo dài; dinner, winter, river đều có âm /ɪ/ ngắn."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. between", "B. noisy", "C. quiet", "D. crowded"], "answer": "A", "explain": "Between nhấn âm thứ 2 (be-TWEEN); noisy, quiet, crowded đều nhấn âm thứ 1."}, {"type": "mcq", "level": "TH", "q": "People send letters and buy stamps at the ______.", "options": ["A. cinema", "B. post office", "C. bakery", "D. gym"], "answer": "B", "explain": "Post office là bưu điện, nơi gửi letters (thư) và mua stamps (tem)."}, {"type": "mcq", "level": "TH", "q": "The new supermarket is ______ than the old market.", "options": ["A. big", "B. bigger", "C. biggest", "D. more big"], "answer": "B", "explain": "Có than nên dùng so sánh hơn; big gấp đôi chữ g thành bigger."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. This test is easier than that one.", "B. This test is easyer than that one.", "C. This test is more easy than that one.", "D. This test is the easier than that one."], "answer": "A", "explain": "Easy tận cùng là phụ âm + y nên đổi y thành i rồi thêm -er: easier."}, {"type": "mcq", "level": "VD", "q": "A: Is there a cinema near your house? B: ______", "options": ["A. Yes. It is only five minutes from here.", "B. I like action films.", "C. My house is very new.", "D. It is in the evening."], "answer": "A", "explain": "Câu hỏi hỏi có rạp chiếu phim gần nhà không nên trả lời có và nói khoảng cách."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: My school is in a busy neighbourhood. There are many shops and cafes near the school. The streets are noisy in the morning. However, there is a beautiful park behind the school.", "statements": ["a) The school is in a quiet neighbourhood.", "b) There are many shops near the school.", "c) The streets are quiet in the morning.", "d) There is a park behind the school."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: trường nằm ở khu phố nhộn nhịp (busy). b) Đúng: có nhiều cửa hàng gần trường. c) Sai: đường phố ồn ào vào buổi sáng (noisy). d) Đúng: có một công viên đẹp sau trường."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Phong's street is longer than Tuan's street. It has more trees and more shops. Phong's street is also cleaner because people clean it every Sunday. Tuan's street is shorter but quieter.", "statements": ["a) Tuan's street is longer than Phong's street.", "b) Phong's street has more trees.", "c) People clean Phong's street every Saturday.", "d) Tuan's street is quieter."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: phố của Phong dài hơn. b) Đúng: phố của Phong có nhiều cây hơn. c) Sai: mọi người dọn phố vào Chủ nhật (Sunday). d) Đúng: phố của Tuấn yên tĩnh hơn."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["theatre", "nhà hát"], ["playground", "sân chơi"], ["bridge", "cây cầu"], ["road", "con đường"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng của nó."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["The", "new", "market", "is", "bigger", "and", "cleaner"], "points": 1, "explain": "Câu đúng: The new market is bigger and cleaner."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: How do I get to the library? B: Cross this street and turn left. The library is opposite the park. A: Thank you for your help.", "sub_questions": [{"q": "Where does the man want to go?", "options": ["The park", "The library", "The school"], "answer": 1}, {"q": "Where is the library?", "options": ["Next to the park", "Opposite the park", "Behind the park"], "answer": 1}], "points": 1, "explain": "Thư viện đối diện công viên (opposite the park)."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Is there a bakery near here", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm và trọng âm của từ."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'i' is pronounced differently from the others.", "options": ["A. litre", "B. village", "C. cinema", "D. clinic"], "answer": "A", "explain": "Litre có chữ i đọc là /iː/ kéo dài; village, cinema, clinic đều có âm /ɪ/ ngắn."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. hospital", "B. pharmacy", "C. exciting", "D. cinema"], "answer": "C", "explain": "Exciting nhấn âm thứ 2 (ex-CI-ting); hospital, pharmacy, cinema đều nhấn âm thứ 1."}, {"type": "mcq", "level": "TH", "q": "We can read and borrow books at the ______.", "options": ["A. library", "B. station", "C. market", "D. temple"], "answer": "A", "explain": "Library là thư viện, nơi đọc và mượn books (sách)."}, {"type": "mcq", "level": "TH", "q": "Winter in the north is ______ than in the south.", "options": ["A. cold", "B. colder", "C. coldest", "D. more cold"], "answer": "B", "explain": "Có than nên dùng so sánh hơn của cold là colder."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. The red bag is cheaper than the blue one.", "B. The red bag is cheapper than the blue one.", "C. The red bag is more cheap than the blue one.", "D. The red bag is the cheaper than the blue one."], "answer": "A", "explain": "Cheap là tính từ ngắn, chỉ thêm -er thành cheaper; không gấp đôi chữ p và không dùng more."}, {"type": "mcq", "level": "VD", "q": "A: Excuse me. Can you tell me the way to the park? B: ______", "options": ["A. Go along this street and turn left at the bakery.", "B. The park is very green.", "C. I often play in the park.", "D. Yes, I am."], "answer": "A", "explain": "Câu hỏi xin chỉ đường nên trả lời bằng chỉ dẫn: đi dọc phố này và rẽ trái ở tiệm bánh."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Huong lives near a river. Every morning, she walks to the market with her mother. The market is small but busy. They buy vegetables and fish for the family.", "statements": ["a) Huong lives near a lake.", "b) She walks to the market every morning.", "c) The market is big and quiet.", "d) They buy vegetables and fish."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: Hương sống gần một con sông (river). b) Đúng: mỗi sáng cô ấy đi bộ ra chợ với mẹ. c) Sai: chợ nhỏ nhưng nhộn nhịp (small but busy). d) Đúng: họ mua rau và cá."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: The new bridge is longer than the old one. It is also wider and stronger. Now, people can cross the river faster. The old bridge is smaller and more dangerous in the rainy season.", "statements": ["a) The old bridge is longer than the new one.", "b) The new bridge is wider than the old one.", "c) People cross the river more slowly now.", "d) The old bridge is dangerous in the rainy season."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: cầu mới dài hơn. b) Đúng: cầu mới cũng rộng hơn. c) Sai: giờ mọi người qua sông nhanh hơn (faster). d) Đúng: cầu cũ nguy hiểm hơn vào mùa mưa."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["suburb", "vùng ngoại ô"], ["neighbourhood", "khu dân cư"], ["traffic", "giao thông"], ["corner", "góc phố"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng của nó."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["Is", "there", "a", "pharmacy", "near", "here"], "points": 1, "explain": "Câu đúng: Is there a pharmacy near here?"}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Excuse me. Where is the nearest supermarket? B: It is on Tran Phu Street, next to the cinema. A: How far is it? B: About ten minutes on foot.", "sub_questions": [{"q": "What is the woman looking for?", "options": ["A cinema", "A supermarket", "A bookshop"], "answer": 1}, {"q": "Where is the supermarket?", "options": ["Opposite the cinema", "Next to the cinema", "Behind the cinema"], "answer": 1}], "points": 1, "explain": "Siêu thị ở phố Tran Phu, cạnh rạp chiếu phim (next to the cinema)."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "This road is wider and cleaner", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm và trọng âm của từ."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'i' is pronounced differently from the others.", "options": ["A. swim", "B. fish", "C. ship", "D. police"], "answer": "D", "explain": "Police có chữ i đọc là /iː/ kéo dài; swim, fish, ship đều có âm /ɪ/ ngắn."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. opposite", "B. supermarket", "C. remember", "D. neighbourhood"], "answer": "C", "explain": "Remember nhấn âm thứ 2 (re-MEM-ber); opposite, supermarket, neighbourhood đều nhấn âm thứ 1."}, {"type": "mcq", "level": "TH", "q": "People pray and visit the old ______ in our village.", "options": ["A. temple", "B. cinema", "C. station", "D. grocery"], "answer": "A", "explain": "Temple là ngôi đền, nơi mọi người cầu nguyện và tham quan."}, {"type": "mcq", "level": "TH", "q": "This exercise is ______ than that one.", "options": ["A. easy", "B. easier", "C. easiest", "D. more easy"], "answer": "B", "explain": "Có than nên dùng so sánh hơn; easy đổi y thành i rồi thêm -er: easier."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. The hospital is farther than the school from my house.", "B. The hospital is more far than the school from my house.", "C. The hospital is farer than the school from my house.", "D. The hospital is the farther than the school from my house."], "answer": "A", "explain": "Far là tính từ bất quy tắc: so sánh hơn của far là farther, không dùng more far hay farer."}, {"type": "mcq", "level": "VD", "q": "A: Where is the bus stop? B: ______", "options": ["A. It is in front of the supermarket, across the street.", "B. I go home by bus.", "C. The bus is yellow.", "D. At six o'clock."], "answer": "A", "explain": "Câu hỏi hỏi vị trí trạm xe buýt nên trả lời: ở trước siêu thị, bên kia đường."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: There is a small cinema near my house. It is older than the new cinema in the city centre. My family often goes there on Sunday evenings. The tickets are cheaper there.", "statements": ["a) The cinema near the house is new.", "b) It is older than the cinema in the city centre.", "c) The family goes there on Saturday evenings.", "d) The tickets are cheaper there."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: rạp gần nhà nhỏ và cũ hơn. b) Đúng: nó cũ hơn rạp ở trung tâm. c) Sai: gia đình đi vào tối Chủ nhật (Sunday). d) Đúng: vé ở đó rẻ hơn."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: City life is busier than village life. The streets are wider and the shops are bigger. However, the air is dirtier and life is more expensive. Many people still love the city because there are better schools and hospitals.", "statements": ["a) Village life is busier than city life.", "b) The shops in the city are bigger.", "c) The air in the city is cleaner.", "d) There are better schools in the city."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: cuộc sống thành phố nhộn nhịp hơn. b) Đúng: cửa hàng ở thành phố lớn hơn. c) Sai: không khí thành phố bẩn hơn (dirtier). d) Đúng: thành phố có trường học và bệnh viện tốt hơn."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["clinic", "phòng khám"], ["hotel", "khách sạn"], ["bank", "ngân hàng"], ["street", "con phố"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng của nó."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["Our", "square", "is", "quieter", "in", "the", "morning"], "points": 1, "explain": "Câu đúng: Our square is quieter in the morning."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: How can I get to the temple? B: Go straight, cross the bridge, and the temple is on your left. A: Thank you very much.", "sub_questions": [{"q": "Where does the man want to go?", "options": ["The temple", "The theatre", "The market"], "answer": 0}, {"q": "Where is the temple?", "options": ["On the right", "On the left", "Behind the bridge"], "answer": 1}], "points": 1, "explain": "Ngôi đền ở phía bên trái sau khi qua cầu (on your left)."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "The museum is bigger than the library", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm và trọng âm của từ."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'i' is pronounced differently from the others.", "options": ["A. sit", "B. cinema", "C. ski", "D. village"], "answer": "C", "explain": "Ski có chữ i đọc là /iː/ kéo dài; sit, cinema, village đều có âm /ɪ/ ngắn."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. bakery", "B. grocery", "C. expensive", "D. pharmacy"], "answer": "C", "explain": "Expensive nhấn âm thứ 2 (ex-PEN-sive); bakery, grocery, pharmacy đều nhấn âm thứ 1."}, {"type": "mcq", "level": "TH", "q": "You can see old and interesting things at the ______.", "options": ["A. museum", "B. bakery", "C. pharmacy", "D. park"], "answer": "A", "explain": "Museum là bảo tàng, nơi trưng bày những vật cổ và thú vị."}, {"type": "mcq", "level": "TH", "q": "The streets here are ______ than in my village.", "options": ["A. busy", "B. busier", "C. busiest", "D. more busy"], "answer": "B", "explain": "Có than nên dùng so sánh hơn; busy đổi y thành i rồi thêm -er: busier."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. This film is worse than that one.", "B. This film is badder than that one.", "C. This film is more bad than that one.", "D. This film is the worse than that one."], "answer": "A", "explain": "Bad là tính từ bất quy tắc: so sánh hơn của bad là worse, không phải badder hay more bad."}, {"type": "mcq", "level": "VD", "q": "A: Can you show me the way to the hospital? B: ______", "options": ["A. Turn left here and go straight ahead.", "B. The hospital is white.", "C. My father is a doctor.", "D. I am fine, thank you."], "answer": "A", "explain": "Câu hỏi xin chỉ đường nên trả lời bằng chỉ dẫn: rẽ trái ở đây và đi thẳng."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Mai's house is on a small street. There is a grocery opposite her house. Next to the grocery, there is a small cafe. Mai often has breakfast at the cafe with her sister.", "statements": ["a) Mai's house is on a big street.", "b) There is a grocery opposite her house.", "c) The cafe is behind the grocery.", "d) Mai has breakfast at the cafe with her sister."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: nhà Mai ở một con phố nhỏ. b) Đúng: có tiệm tạp hóa đối diện nhà. c) Sai: quán cà phê ở cạnh tiệm tạp hóa (next to). d) Đúng: Mai ăn sáng ở quán với chị gái."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: The library in our town is bigger than the old one. It has more books and a larger reading room. Students come here every afternoon because it is quieter than their classrooms.", "statements": ["a) The old library is bigger than the new one.", "b) The library has more books.", "c) Students come to the library every morning.", "d) The library is quieter than the classrooms."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: thư viện mới lớn hơn thư viện cũ. b) Đúng: nó có nhiều sách hơn. c) Sai: học sinh đến vào mỗi buổi chiều (afternoon). d) Đúng: thư viện yên tĩnh hơn lớp học."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["river", "con sông"], ["lake", "hồ"], ["village", "ngôi làng"], ["city", "thành phố"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng của nó."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["Our", "village", "is", "smaller", "than", "your", "town"], "points": 1, "explain": "Câu đúng: Our village is smaller than your town."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Is there a park near the school? B: Yes, there is. It is behind the school, next to the lake. A: Great. Thank you.", "sub_questions": [{"q": "What is near the school?", "options": ["A park", "A market", "A cinema"], "answer": 0}, {"q": "Where is the park?", "options": ["In front of the school", "Behind the school", "Opposite the school"], "answer": 1}], "points": 1, "explain": "Công viên ở phía sau trường học, cạnh hồ (behind the school)."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Turn left at the traffic lights", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm và trọng âm của từ."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'i' is pronounced differently from the others.", "options": ["A. big", "B. river", "C. machine", "D. picture"], "answer": "C", "explain": "Machine có chữ i đọc là /iː/ kéo dài; big, river, picture đều có âm /ɪ/ ngắn."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. direction", "B. temple", "C. market", "D. village"], "answer": "A", "explain": "Direction nhấn âm thứ 2 (di-REC-tion); temple, market, village đều nhấn âm thứ 1."}, {"type": "mcq", "level": "TH", "q": "My father works at the ______ and helps sick people.", "options": ["A. hospital", "B. cinema", "C. square", "D. bakery"], "answer": "A", "explain": "Hospital là bệnh viện, nơi giúp đỡ sick people (người bệnh)."}, {"type": "mcq", "level": "TH", "q": "The blue pen is ______ than the red one.", "options": ["A. cheap", "B. cheaper", "C. cheapest", "D. more cheap"], "answer": "B", "explain": "Có than nên dùng so sánh hơn của cheap là cheaper."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. She runs faster than her brother.", "B. She runs more fast than her brother.", "C. She runs fastter than her brother.", "D. She runs the faster than her brother."], "answer": "A", "explain": "Fast là tính từ/trạng từ ngắn, so sánh hơn là faster; không dùng more fast và không gấp đôi chữ t."}, {"type": "mcq", "level": "VD", "q": "A: Excuse me. I want to go to the square. B: ______", "options": ["A. Go straight for five minutes. It is on your left.", "B. The square is very big.", "C. I am going home now.", "D. It is a sunny day."], "answer": "A", "explain": "Người hỏi muốn tới quảng trường nên trả lời bằng chỉ dẫn đường đi."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: There is a new bookshop on my street. It is bigger than the old one. The bookshop opens at 8 a.m. and closes at 9 p.m. I often go there after school to read comics.", "statements": ["a) The bookshop is old.", "b) It is bigger than the old bookshop.", "c) It closes at 8 p.m.", "d) The writer reads comics there after school."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: đây là hiệu sách mới (new bookshop). b) Đúng: nó lớn hơn hiệu sách cũ. c) Sai: đóng cửa lúc 9 giờ tối (9 p.m.). d) Đúng: bạn ấy đọc truyện tranh ở đó sau giờ học."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: An's neighbourhood is nearer the city centre than Binh's. An can walk to school in ten minutes. Binh's neighbourhood is farther, but it is greener and quieter. Binh goes to school by bus every day.", "statements": ["a) Binh's neighbourhood is nearer the city centre.", "b) An can walk to school in ten minutes.", "c) Binh's neighbourhood is noisier.", "d) Binh goes to school by bus every day."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: khu của An gần trung tâm hơn. b) Đúng: An đi bộ tới trường trong mười phút. c) Sai: khu của Bình xanh hơn và yên tĩnh hơn. d) Đúng: Bình đi học bằng xe buýt mỗi ngày."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["left", "bên trái"], ["right", "bên phải"], ["straight", "thẳng"], ["opposite", "đối diện"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng của nó."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["Her", "street", "is", "longer", "and", "busier"], "points": 1, "explain": "Câu đúng: Her street is longer and busier."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Where is the cinema? B: It is on Nguyen Hue Street, between the bank and the bookshop. A: Is it big? B: Yes, it is bigger than the old cinema.", "sub_questions": [{"q": "Where is the cinema?", "options": ["Between the bank and the bookshop", "Opposite the bank", "Next to the school"], "answer": 0}, {"q": "How is the cinema?", "options": ["Smaller than the old one", "Bigger than the old one", "The same as the old one"], "answer": 1}], "points": 1, "explain": "Rạp chiếu phim nằm giữa ngân hàng và hiệu sách, lớn hơn rạp cũ."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "The square is quieter in the evening", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm và trọng âm của từ."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'i' is pronounced differently from the others.", "options": ["A. milk", "B. winter", "C. visa", "D. listen"], "answer": "C", "explain": "Visa có chữ i đọc là /iː/ kéo dài; milk, winter, listen đều có âm /ɪ/ ngắn."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. quiet", "B. noisy", "C. museum", "D. busy"], "answer": "C", "explain": "Museum nhấn âm thứ 2 (mu-SE-um); quiet, noisy, busy đều nhấn âm thứ 1."}, {"type": "mcq", "level": "TH", "q": "Children play and old people do exercise in the ______ every morning.", "options": ["A. park", "B. pharmacy", "C. station", "D. post office"], "answer": "A", "explain": "Park là công viên, nơi trẻ em chơi và người già tập thể dục."}, {"type": "mcq", "level": "TH", "q": "The weather today is ______ than yesterday.", "options": ["A. bad", "B. worse", "C. worst", "D. more bad"], "answer": "B", "explain": "Bad là tính từ bất quy tắc: so sánh hơn của bad là worse."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. Our classroom is cleaner than theirs.", "B. Our classroom is more clean than theirs.", "C. Our classroom is cleanner than theirs.", "D. Our classroom is the cleaner than theirs."], "answer": "A", "explain": "Clean là tính từ ngắn, chỉ thêm -er thành cleaner; không dùng more và không thêm chữ n."}, {"type": "mcq", "level": "VD", "q": "A: Thank you for showing me the way. B: ______", "options": ["A. You are welcome.", "B. I am sorry.", "C. Good night.", "D. See you yesterday."], "answer": "A", "explain": "Khi ai đó cảm ơn, câu đáp lịch sự là You are welcome (Không có gì)."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: My neighbourhood has a small hospital. It is next to the pharmacy on Le Lai Street. The doctors are kind and helpful. People in my neighbourhood feel safe because the hospital is near.", "statements": ["a) The hospital is big.", "b) It is next to the pharmacy.", "c) It is on Nguyen Trai Street.", "d) The doctors are kind and helpful."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: đây là bệnh viện nhỏ (small hospital). b) Đúng: nó ở cạnh nhà thuốc. c) Sai: bệnh viện ở phố Le Lai. d) Đúng: các bác sĩ tốt bụng và hay giúp đỡ."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: The streets in Hue are narrower than the streets in Da Nang. Hue is also quieter and more peaceful. However, Da Nang has longer beaches and more modern buildings. Both cities are beautiful in their own way.", "statements": ["a) The streets in Da Nang are narrower.", "b) Hue is quieter than Da Nang.", "c) Da Nang has shorter beaches.", "d) Both cities are beautiful."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: đường phố ở Huế hẹp hơn. b) Đúng: Huế yên tĩnh hơn Đà Nẵng. c) Sai: Đà Nẵng có bãi biển dài hơn. d) Đúng: cả hai thành phố đều đẹp theo cách riêng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["turn left", "rẽ trái"], ["turn right", "rẽ phải"], ["go straight", "đi thẳng"], ["get lost", "bị lạc đường"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng của nó."}, {"type": "ordering", "level": "TH", "q": "
