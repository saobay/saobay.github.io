year and their plans for the new year.", "statements": ["a) People give special food to their grandparents at Tet.", "b) Families only eat and do not talk at Tet.", "c) They talk about their plans for the new year.", "d) Tet is a sad time for Vietnamese families."], "answer": ["T", "F", "T", "F"], "explain": "a) Dung: tang do an dac biet cho ong ba. b) Sai: ho vua an vua noi chuyen. c) Dung: noi ve ke hoach nam moi. d) Sai: Tet la dip vui, khong phai dip buon."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["red envelope", "bao lì xì"], ["New Year", "năm mới"], ["gathering", "sum họp"], ["lucky", "may mắn"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["together", "Families", "at", "gather", "Tet"], "points": 1, "explain": "Câu đúng: Families gather together at Tet."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Dad, when do we visit Grandma? B: On the morning of the second day of Tet. A: Should I bring her some fruit? B: Yes. And remember to wish her good health.", "sub_questions": [{"q": "When do they visit Grandma?", "options": ["On New Year's Eve", "On the first day of Tet", "On the morning of the second day of Tet", "Before Tet"], "answer": 2}, {"q": "What should the boy bring Grandma?", "options": ["Some flowers", "Some fruit", "Some candy", "A cake"], "answer": 1}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "My mother makes sticky rice cakes", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 's' is pronounced differently from the others.", "options": ["A. sugar", "B. sure", "C. she", "D. soup"], "answer": "D", "explain": "sugar, sure co chu s doc la /ʃ/ va she co am /ʃ/; soup co  đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "People wish each other good luck", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'c' is pronounced differently from the others.", "options": ["A. precious", "B. cat", "C. cup", "D. cold"], "answer": "A", "explain": "Trong precious, chu c doc la /ʃ/; trong cat, cup, cold, chu c doc la /k/."}, {"type": "mcq", "level": "NB", "q": "We ___ the house with peach blossoms and red lights for Tet.", "options": ["A. decorate", "B. visit", "C. wish", "D. gather"], "answer": "A", "explain": "decorate nghia la trang tri, hop voi viec trang tri nha bang hoa dao va den do."}, {"type": "mcq", "level": "TH", "q": "You ___ say bad words at Tet. It can bring bad luck.", "options": ["A. should", "B. shouldn't", "C. are", "D. is"], "answer": "B", "explain": "Noi loi xui xeo co the mang lai dieu khong may nen khong nen: shouldn't."}, {"type": "mcq", "level": "TH", "q": "My father buys ___ fruit and candy for Tet.", "options": ["A. any", "B. some", "C. an", "D. a"], "answer": "B", "explain": "Day la cau khang dinh nen dung some."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. decorate", "B. celebrate", "C. beautiful", "D. pagoda"], "answer": "D", "explain": "decorate, celebrate, beautiful co trong am am tiet 1; pagoda co trong am am tiet 2."}, {"type": "mcq", "level": "VD", "q": "You look very tired after cleaning the house. You ___ go to bed early tonight.", "options": ["A. shouldn't", "B. should", "C. are", "D. do"], "answer": "B", "explain": "Met thi nen di ngu som: loi khuyen dung should."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: In the south of Viet Nam, apricot blossoms are the symbol of ke about Tet?", "options": ["Cooking and cleaning", "Getting new clothes and lucky money", "Visiting the pagoda", "Making cakes"], "answer": 1}, {"q": "When are the fireworks amazing?", "options": ["On the first morning of Tet", "On New Year's Eve", "On the last day of Tet", "Every night"], "answer": 1}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Fireworks light up the sky", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letters 'ch' are pronounced differently from the others.", "options": ["A. chef", "B. cheese", "C. lunch", "D. watch"], "answer": "A", "explain": "Trong chef, ch doc la /ʃ/; trong cheese, lunch, watch, ch doc la /tʃ/."}, {"type": "mcq", "level": "NB", "q": "Tet is a time for family ___. Everyone comes home.", "options": ["A. gathering", "B. calendar", "C. envelope", "D. blossom"], "answer": "A", "explain": "family gathering la buoi sum hop gia dinh, hop voi y moi nguoi tro ve nha."}, {"type": "mcq", "level": "TH", "q": "Students ___ wish their teachers a happy new year at Tet.", "options": ["A. should", "B. shouldn't", "C. is", "D. are"], "answer": "A", "explain": "Chuc Tet thay co la viec nen lam, dung should."}, {"type": "mcq", "level": "TH", "q": "We don't need ___ more chairs for the Tet party.", "options": ["A. some", "B. any", "C. a", "D. an"], "answer": "B", "explain": "Day la cau phu dinh (don't need) nen dung any."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. people", "B. money", "C. around", "D. lucky"], "answer": "C", "explain": "people, money, lucky co trong am am tiet 1; around co trong am am tiet 2."}, {"type": "mcq", "level": "VD", "q": "Choose the INCORRECT sentence.", "options": ["A. You should clean your room.", "B. Children shouldn't play with fire.", "C. He shoulds visit his grandma.", "D. We should be kind to everyone."], "answer": "C", "explain": "should khong bao gio them s theo chu ngu; cau dung phai la: He should visit his grandma."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: My school has a Tet fair before the holiday. Students sell food, flowers and small gifts. Teachers and parents come and buy many things. The money helps poor students in our school.", "statements": ["a) The school has a Tet fair after the holiday.", "b) Students sell flowers at the fair.", "c) Only students come to the fair.", "d) The money helps poor students."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: hoi cho Tet dien ra truoc ki nghi. b) Dung: hoc sinh ban hoa. c) Sai: ca giao vien va phu huynh cung den. d) Dung: tien giup hoc sinh ngheo."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: On New Year's Eve, the streets are full of people. Everyone counts down to the new year. At midnight, fireworks light up the sky. People hug and wish each other health, luck and happiness.", "statements": ["a) The streets are empty on New Year's Eve.", "b) Fireworks light up the sky at midnight.", "c) People wish each other good things.", "d) People count down in the morning."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: duong pho dong nguoi. b) Dung: phao hoa thap sang luc nua dem. c) Dung: moi nguoi chuc nhau dieu tot dep. d) Sai: dem nguoc vao dem giao thua, khong phai buoi sang."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["first-foot", "xông đất"], ["apricot blossom", "hoa mai"], ["sticky rice", "xôi"], ["prepare", "chuẩn bị"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["cakes", "eat", "We", "at", "sticky", "Tet", "rice"], "points": 1, "explain": "Câu đúng: We eat sticky rice cakes at Tet."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Grandma, what is in the red envelope? B: Some lucky money for you, my dear. A: Thank you! I will save it to buy books. B: Good girl. I wish you a great new year at school.", "sub_questions": [{"q": "What is in the red envelope?", "options": ["Candy", "Some lucky money", "A letter", "New clothes"], "answer": 1}, {"q": "What will the girl buy with the money?", "options": ["Toys", "Books", "Flowers", "Food"], "answer": 1}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Families gather together at Tet", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'c' is pronounced differently from the others.", "options": ["A. delicious", "B. cat", "C. cake", "D. cold"], "answer": "A", "explain": "Trong delicious, chu c doc la /ʃ/; trong cat, cake, cold, chu c doc la /k/."}, {"type": "mcq", "level": "NB", "q": "People ___ Tet with family dinners, flowers and visits to relatives.", "options": ["A. celebrate", "B. decorate", "C. clean", "D. sweep"], "answer": "A", "explain": "celebrate Tet nghia la an mung/don Tet, hop voi cac hoat dong liet ke trong cau."}, {"type": "mcq", "level": "TH", "q": "You ___ eat too many sweets at Tet. It is bad for your teeth.", "options": ["A. should", "B. shouldn't", "C. are", "D. is"], "answer": "B", "explain": "An nhieu do ngot hai cho rang nen khong nen: shouldn't."}, {"type": "mcq", "level": "TH", "q": "Are there ___ peach blossoms in the garden?", "options": ["A. some", "B. any", "C. a", "D. an"], "answer": "B", "explain": "Day la cau hoi (nghi van) nen dung any."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from
