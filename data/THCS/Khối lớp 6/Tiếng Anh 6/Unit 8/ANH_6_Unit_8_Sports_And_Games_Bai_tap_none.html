"C", "explain": "Last year là quá khứ; take là động từ bất quy tắc: take - took."}, {"type": "mcq", "level": "TH", "q": "___ she at the stadium yesterday?", "options": ["A. Was", "B. Were", "C. Is", "D. Did"], "answer": "A", "explain": "Chủ ngữ she ở quá khứ đi với Was."}, {"type": "mcq", "level": "TH", "q": "A: Congratulations! You won the race. B: ___", "options": ["A. Thank you.", "B. You are welcome.", "C. Goodbye.", "D. Yes, I am."], "answer": "A", "explain": "Khi được chúc mừng (Congratulations!), ta đáp lại Thank you."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. The students was at school yesterday.", "B. The students were at school yesterday.", "C. The students is at school yesterday.", "D. The students be at school yesterday."], "answer": "B", "explain": "The students là số nhiều, yesterday là quá khứ nên dùng were."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Last Friday was Sports Day at our school. All the students came to the schoolyard early. I ran in the 100-metre race and came second. My friend Hoa won the first prize in badminton.", "statements": ["a) Sports Day was last Friday.", "b) Students came to school late.", "c) The writer won the running race.", "d) Hoa won the first prize in badminton."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: Last Friday was Sports Day. b) Sai: học sinh came early (đến sớm). c) Sai: người viết came second (về nhì). d) Đúng: Hoa won the first prize in badminton."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Sports Day is a special day for students. They can play their favourite sports and cheer for their classes. Teachers also join some games with students. Last year, more than 200 students joined the games at our school.", "statements": ["a) Students can play sports on Sports Day.", "b) Teachers never join the games.", "c) More than 200 students joined last year.", "d) Sports Day is only for teachers."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: They can play their favourite sports. b) Sai: Teachers also join some games. c) Đúng: more than 200 students joined. d) Sai: Sports Day là ngày của học sinh."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["race", "cuộc đua"], ["prize", "giải thưởng"], ["first", "thứ nhất"], ["cheer", "cổ vũ"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["came", "I", "second", "in", "running", "the", "race"], "points": 1, "explain": "Câu đúng: I came second in the running race."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What did you do on Sports Day? B: I played badminton and won a prize. A: Wow! Congratulations! B: Thank you. I practised a lot last month.", "sub_questions": [{"q": "What sport did she play on Sports Day?", "options": ["Badminton", "Volleyball", "Football"], "answer": 0}, {"q": "Did she win a prize?", "options": ["No, she didn't", "Yes, she did", "She came second"], "answer": 1}], "points": 1, "explain": "Cô ấy chơi cầu lông (badminton) trong ngày hội thể thao và giành được giải thưởng."}, {"type": "speaking", "level": "VD", "q": "Đọc to câu sau", "target": "I took part in the running race last Friday.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'e' is pronounced differently from the others.", "options": ["A. chess", "B. tennis", "C. helmet", "D. me"], "answer": "D", "explain": "Trong me, chữ e đọc là /iː/; trong chess, tennis và helmet, chữ e đọc là /e/."}, {"type": "mcq", "level": "NB", "q": "A sports player who wins a big competition is a ___.", "options": ["A. champion", "B. fan pen every four years. Athletes from many countries take part in running, swimming, and other sports. The winners get gold, silver, or bronze medals.", "statements": ["a) The Olympics happen every four years.", "b) Only one country takes part in the Olympics.", "c) Winners get medals.", "d) There is no swimming in the Olympics."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: They happen every four years. b) Sai: Athletes from many countries take part. c) Đúng: The winners get gold, silver, or bronze medals. d) Sai: có swimming trong các môn thi đấu."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["champion", "nhà vô địch"], ["medal", "huy chương"], ["goal", "bàn thắng"], ["fan", "người hâm mộ"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["scored", "He", "two", "goals", "in", "final", "the", "match"], "points": 1, "explain": "Câu đúng: He scored two goals in the final match."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Did you watch the game on TV last night? B: Yes. Our team played very well. A: What was the score? B: It was 3-1. We won!", "sub_questions": [{"q": "Where did he watch the game?", "options": ["At the stadium", "On TV", "At school"], "answer": 1}, {"q": "What was the score?", "options": ["3-1", "2-1", "1-0"], "answer": 0}], "points": 1, "explain": "Anh ấy xem trận đấu trên TV (on TV) và tỉ số là 3-1."}, {"type": "speaking", "level": "VD", "q": "Đọc to câu sau", "target": "The champion trained hard every day.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'a' is pronounced differently from the others.", "options": ["A. badminton", "B. marathon", "C. flat", "D. skate"], "answer": "D", "explain": "Trong skate, chữ a đọc là /eɪ/; trong badminton, mara
