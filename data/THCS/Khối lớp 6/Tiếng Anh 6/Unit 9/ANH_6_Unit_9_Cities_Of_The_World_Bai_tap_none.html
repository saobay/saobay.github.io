d has many tall buildings.", "sub_questions": [{"q": "Which city does B want to visit?", "options": ["London", "New York", "Tokyo"], "answer": 1}, {"q": "Why does he want to visit it?", "options": ["It is quiet and small", "It is exciting with many tall buildings", "It has beautiful beaches"], "answer": 1}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "New York is the biggest city in the USA.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'o' is pronounced differently from the others.", "options": ["A. nose", "B. rose", "C. brown", "D. close"], "answer": "C", "explain": "Nose, rose, close có 'o' đọc là /əʊ/, còn brown đọc là /aʊ/."}, {"type": "mcq", "level": "NB", "q": "The Great Wall is a famous ______ in China.", "options": ["A. landmark", "B. continent", "C. capital", "D. beach"], "answer": "A", "explain": "Vạn Lý Trường Thành là một địa danh (landmark) nổi tiếng của Trung Quốc."}, {"type": "mcq", "level": "TH", "q": "Summer in the desert is ______ season of the year.", "options": ["A. the hotest", "B. the hottest", "C. the most hot", "D. hot"], "answer": "B", "explain": "Hot gấp đôi phụ âm cuối rồi thêm -est: hot → the hottest."}, {"type": "mcq", "level": "TH", "q": "The cat is hungry. ______ food is in the kitchen.", "options": ["A. It", "B. Its", "C. It's", "D. Their"], "answer": "B", "explain": "Cần tính từ sở hữu 'its' (của nó) đứng trước danh từ 'food'."}, {"type": "mcq", "level": "VD", "q": "Russia is ______ country in the world.", "options": ["A. the largest", "B. the most large", "C. larger", "D. the large"], "answer": "A", "explain": "Large tận cùng bằng e nên chỉ thêm -st: the largest. Nga là nước rộng nhất thế giới."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. city", "B. palace", "C. exciting", "D. country"], "answer": "C", "explain": "Exciting nhấn âm 2 (ex-CIT-ing); city, palace, country đều nhấn âm 1."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Tokyo is the capital of Japan. It is a modern and busy city. Tokyo has many tall buildings and delicious food. In spring, people enjoy the beautiful cherry blossoms.", "statements": ["a) Tokyo is the capital of Japan.", "b) Tokyo is an ancient and quiet city.", "c) People enjoy cherry blossoms in spring.", "d) Tokyo has no tall buildings."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: Tokyo 'modern and busy' (hiện đại và nhộn nhịp). c) Đúng. d) Sai: Tokyo có nhiều tòa nhà cao tầng."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Hue is an old city in Viet Nam. It is famous for the Citadel and the Huong River. Hue is smaller and quieter than Ha Noi. Many tourists visit Hue to see its ancient palaces.", "statements": ["a) Hue is a new city.", "b) The Huong River is in Hue.", "c) Hue is bigger than Ha Noi.", "d) Tourists visit Hue to see its ancient palaces."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: Huế là thành phố cổ (old city). b) Đúng. c) Sai: Huế nhỏ hơn Hà Nội. d) Đúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["busy", "bận rộn"], ["quiet", "yên tĩnh"], ["delicious", "ngon"], ["exciting", "thú vị, sôi động"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["capital", "Tokyo", "of", "is", "Japan", "the"], "points": 1, "explain": "Câu đúng: Tokyo is the capital of Japan."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What is the capital of Japan? B: It is Tokyo. A: Is Tokyo a modern city? B: Yes, it is very modern and busy.", "sub_questions": [{"q": "What is the capital of Japan?", "options": ["Beijing", "Seoul", "Tokyo"], "answer": 2}, {"q": "What is Tokyo like?", "options": ["Ancient and quiet", "Modern and busy", "Small and boring"], "answer": 1}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Tokyo is a modern and busy city.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letters 'ow' are pronounced differently from the others.", "options": ["A. yellow", "B. pillow", "C. down", "D. follow"], "answer": "C", "explain": "Yellow, pillow, follow có 'ow' đọc là /əʊ/, còn down đọc là /aʊ/."}, {"type": "mcq", "level": "NB", "q": "Kings and queens live in a ______.", "options": ["A. tower", "B. palace", "C. beach", "D. street"], "answer": "B", "explain": "Palace là 'cung điện' — nơi ở của vua và hoàng hậu."}, {"type": "mcq", "level": "TH", "q": "Today is ______ day of my life. I won the first prize!", "options": ["A. the happyest", "B. the happiest", "C. the most happy", "D. happier"], "answer": "B", "explain": "Happy tận cùng là phụ âm + y: đổi y thành i rồi thêm -est: the happiest."}, {"type": "mcq", "level": "TH", "q": "My sister has a new bike. ______ bike is red.", "options": ["A. His", "B. Her", "C. Their", "D. Its"], "answer": "B", "explain": "Sister là nữ nên dùng tính từ sở hữu 'her' (của cô ấy)."}, {"type": "mcq", "level": "VD", "q": "This hotel is ______ in the city, but it is also the most expensive one.", "options": ["A. the best", "B. the goodest", "C. best", "D. the most good"], "answer": "A", "explain": "Good là tính từ bất quy tắc: good → better → the best. Không có dạng 'goodest'."}, {"type": "mcq", "level": "VD", "q": "Which sentence is correct?", "options": ["A. Paris is the most beautifulest city.", "B. This is the worse day of my life.", "C. He is the tallest boy in our class.", "D. She is the more famous singer."], "answer": "C", "explain": "Câu C đúng: the tallest. Câu A thừa cả most lẫn -est; câu B thiếu 'the'; câu D dùng so sánh hơn 'more famous' trong khi cần so sánh nhất."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Sydney is a famous city in Australia. Its Opera House looks like white sails on the water. The city has many beautiful beaches. Summer in Sydney is in December.", "statements": ["a) Sydney is in Australia.", "b) The Opera House looks like white sails.", "c) Sydney has no beaches.", "d) Summer in Sydney is in June."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng: nhà hát trông như những cánh buồm trắng. c) Sai: Sydney có nhiều bãi biển đẹp. d) Sai: mùa hè ở Sydney là tháng 12 vì Australia ở Nam bán cầu."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Bangkok is the capital of Thailand. It is famous for its temples and street food. The city is hot and crowded all year. Many tourists love Bangkok because the food is delicious and cheap.", "statements": ["a) Bangkok is the capital of Thailand.", "b) Bangkok is famous for its temples and street food.", "c) Bangkok is a cold and quiet city.", "d) The food in Bangkok is expensive."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng. c) Sai: Bangkok nóng và đông đúc quanh năm. d) Sai: đồ ăn ở Bangkok ngon và rẻ (cheap)."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["visit", "thăm, tham quan"], ["travel", "đi du lịch"], ["weather", "thời tiết"], ["building", "tòa nhà"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["for", "Sydney", "famous", "its", "is", "beaches"], "points": 1, "explain": "Câu đúng: Sydney is famous for its beaches."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Where did you go last summer? B: I went to Sydney. A: What did you do there? B: I saw the Opera House and swam at Bondi Beach.", "sub_questions": [{"q": "Where did B go last summer?", "options": ["London", "Sydney", "Paris"], "answer": 1}, {"q": "What did he do at Bondi Beach?", "options": ["He swam", "He skied", "He climbed a tower"], "answer": 0}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Sydney is famous for the Opera House.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'o' is pronounced differently from the others.", "options": ["A. cold", "B. hold", "C. now", "D. most"], "answer": "C", "explain": "Cold, hold, most có 'o' đọc là /əʊ/, còn now đọc là /aʊ/."}, {"type": "mcq", "level": "NB", "q": "Hoan Kiem Lake is in the ______ of Ha Noi.", "options": ["A. centre", "B. continent", "C. country", "D. island"], "answer": "A", "explain": "Centre là 'trung tâm'. Hồ Hoàn Kiếm nằm ở trung tâm Hà Nội."}, {"type": "mcq", "level": "TH", "q": "Ho Chi Minh City is ______ city in Viet Nam.", "options": ["A. the largest", "B. the most large", "C. largest", "D. the larger"], "answer": "A", "explain": "Large tận cùng bằng e: thêm -st thành 'the largest'. So sánh nhất bắt buộc có 'the'."}, {"type": "mcq", "level": "TH", "q": "We love our school. ______ school is big and modern.", "options": ["A. Their", "B. Our", "C. Its", "D. His"], "answer": "B", "explain": "Câu trước dùng 'our school' và chủ ngữ 'we' nên tiếp tục dùng 'our'."}, {"type": "mcq", "level": "VD", "q": "Yesterday was ______ day of the week. It rained all day and we could not go out.", "options": ["A. the baddest", "B. the worst", "C. the most bad", "D. worse"], "answer": "B", "explain": "Bad là tính từ bất quy tắc: bad → worse → the worst. Không có dạng 'baddest'."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. This is the cheaper shop in town.", "B. Singapore is the cleanest city I know.", "C. He is the most tall player on the team.", "D. That is the hotest country in Asia."], "answer": "B", "explain": "Câu B đúng: the cleanest. Câu A thiếu 'the' và dùng so sánh hơn; câu C: tall là tính từ ngắn, không dùng most; câu D: hot phải gấp đôi t: hottest."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Ho Chi Minh City is the biggest city in Viet Nam. It is modern and busy. Ben Thanh Market is a famous place in the city centre. The weather there is hot all year.", "statements": ["a) Ho Chi Minh City is the biggest city in Viet Nam.", "b) Ben Thanh Market is in Ha Noi.", "c) The city is modern and busy.", "d) The weather there is cold all year."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: chợ Bến Thành ở TP. Hồ Chí Minh. c) Đúng. d) Sai: thời tiết nóng quanh năm."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Singapore is a small country in Asia. It is one of the cleanest cities in the world. People speak English and other languages there. Gardens by the Bay is a famous landmark in Singapore.", "statements": ["a) Singapore is a very big country.", "b) Singapore is one of the cleanest cities in the world.", "c) People speak only Vietnamese in Singapore.", "d) Gardens by the Bay is a famous landmark in Singapore."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: Singapore là nước nhỏ. b) Đúng. c) Sai: người dân nói tiếng Anh và nhiều ngôn ngữ khác. d) Đúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["clean", "sạch sẽ"], ["dirty", "bẩn"], ["safe", "an toàn"], ["dangerous", "nguy hiểm"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["capital", "Ha", "of", "Noi", "Viet", "is", "Nam", "the"], "points": 1, "explain": "Câu đúng: Ha Noi is the capital of Viet Nam."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Is Ha Noi the capital of Viet Nam? B: Yes, it is. A: What is Ha Noi famous for? B: It is famous for Hoan Kiem Lake and its old streets.", "sub_questions": [{"q": "Is Ha Noi the capital of Viet Nam?", "options": ["Yes, it is", "No, it is not", "Yes, it does"], "answer": 0}, {"q": "What is Ha Noi famous for?", "options": ["Beaches and islands", "Hoan Kiem Lake and old streets", "Tall buildings"], "answer": 1}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Ha Noi is the capital of Viet Nam.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letters 'ou' are pronounced differently from the others.", "options": ["A. house", "B. mouse", "C. about", "D. slow"], "answer": "D", "explain": "House, mouse, about có 'ou' đọc là /aʊ/. Slow không có 'ou' và đọc là /əʊ/ nên khác nhất."}, {"type": "mcq", "level": "NB", "q": "Asia is the largest ______ in the world.", "options": ["A. country", "B. city", "C. continent", "D. island"], "answer": "C", "explain": "Châu Á là châu lục (continent) lớn nhất thế giới."}, {"type": "mcq", "level": "TH", "q": "The Sahara is ______ desert in the world.", "options": ["A. the biggest", "B. the bigest", "C. the most big", "D. bigger"], "answer": "A", "explain": "Big gấp đôi phụ âm cuối: the biggest. Sa mạc Sahara là sa mạc nóng lớn nhất thế giới."}, {"type": "mcq", "level": "TH", "q": "Tom and Jerry are brothers. ______ house is near the beach.", "options": ["A. His", "B. Her", "C. Their", "D. Its"], "answer": "C", "explain": "Tom and Jerry là hai người (they) nên dùng 'their' (của họ)."}, {"type": "mcq", "level": "VD", "q": "This exercise is ______ in the book. Nobody in my class can do it.", "options": ["A. the most difficult", "B. the difficultest", "C. more difficult", "D. difficult"], "answer": "A", "explain": "Difficult là tính từ dài (3 âm tiết) nên so sánh nhất là 'the most difficult'."}, {"type": "mcq", "level": "VD", "q": "A: Which is the smallest continent in the world? B: ______", "options": ["A. Asia", "B. Australia", "C. Africa", "D. Europe"], "answer": "B", "explain": "Australia là châu lục nhỏ nhất thế giới; Asia (châu Á) là châu lục lớn nhất."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Beijing is the capital of China. The Great Wall near Beijing is the longest wall in the world. Millions of tourists visit the Great Wall every year. Beijing is cold in winter.", "statements": ["a) Beijing is the capital of China.", "b) The Great Wall is the shortest wall in the world.", "c) Many tourists visit the Great Wall every year.", "d) Beijing is hot in winter."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: Vạn Lý Trường Thành là bức tường dài nhất thế giới. c) Đúng. d) Sai: Bắc Kinh lạnh vào mùa đông."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Rome is an ancient city in Italy. It is famous for the Colosseum, an old building nearly 2,000 years old. Rome has many beautiful old streets and delicious food like pizza and pasta.", "statements": ["a) Rome is a new and modern city.", "b) The Colosseum is nearly 2,000 years old.", "c) Rome is in France.", "d) Pizza and pasta are famous foods in Rome."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: Rome là thành phố cổ. b) Đúng. c) Sai: Rome ở Italy (Ý). d) Đúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["world", "thế giới"], ["people", "con người, mọi người"], ["street", "đường phố"], ["food", "đồ ăn"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["China", "Beijing", "capital", "of", "is", "the"], "points": 1, "explain": "Câu đúng: Beijing is the capital of China."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Which city is one of the biggest in the world? B: Tokyo is one of the biggest cities. A: And which city do you like best? B: I like Paris best because it is beautiful.", "sub_questions": [{"q": "Which city is one of the biggest in the world?", "options": ["Paris", "Tokyo", "London"], "answer": 1}, {"q": "Which city does B like best?", "options": ["Tokyo", "London", "Paris"], "answer": 2}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "The Great Wall is the longest wall in the world.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letters 'oa' are pronounced differently from the others.", "options": ["A. road", "B. coat", "C. out", "D. boat"], "answer": "C", "explain": "Road, coat, boat có 'oa' đọc là /əʊ/. Out không có 'oa' và đọc là /aʊ/ nên khác nhất."}, {"type": "mcq", "level": "NB", "q": "We can swim and play on the sand at the ______.", "options": ["A. beach", "B. palace", "C. tower", "D. desert"], "answer": "A", "explain": "Beach là 'bãi biển' — nơi có cát để bơi và chơi."}, {"type": "mcq", "level": "TH", "q": "July is ______ month of the year in my country.", "options": ["A. the sunnyest", "B. the sunniest", "C. the most sunny", "D. sunnier"], "answer": "B", "explain": "Sunny tận cùng là phụ âm + y: đổi y thành i rồi thêm -est: the sunniest."}, {"type": "mcq", "level": "TH", "q": "The dog is thirsty. ______ water bowl is empty.", "options": ["A. It's", "B. Its", "C. It", "D. Their"], "answer": "B", "explain": "Cần tính từ sở hữu 'its' (của nó). It's nghĩa là 'it is' nên không đứng trước danh từ được."}, {"type": "mcq", "level": "VD", "q": "This is ______ film I have ever seen. I slept for most of it!", "options": ["A. the most boring", "B. the boringest", "C. more boring", "D. boring"], "answer": "A", "explain": "Boring là tính từ dài nên dùng 'the most boring' cho so sánh nhất."}, {"type": "mcq", "level": "VD", "q": "The Pacific is ______ ocean in the world.", "options": ["A. the deepest", "B. the deeper", "C. the most deep", "D. deepest"], "answer": "A", "explain": "Deep là tính từ ngắn: so sánh nhất là 'the deepest'. Thái Bình Dương là đại dương sâu nhất (và lớn nhất) thế giới."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Da Lat is a city in the mountains of Viet Nam. The weather is cool all year. Da Lat is famous for its flowers and pine forests. Many people visit Da Lat in summer to enjoy the cool weather.", "statements": ["a) Da Lat is in the mountains.", "b) The weather in Da Lat is hot all year.", "c) Da Lat is famous for its flowers.", "d) Nobody visits Da Lat in summer."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: thời tiết mát mẻ quanh năm. c) Đúng. d) Sai: nhiều người đến Đà Lạt vào mùa hè."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: The Amazon rainforest is in South America. It is the largest forest in the world. Many kinds of animals and plants live there. People call it the lungs of the Earth.", "statements": ["a) The Amazon rainforest is in Asia.", "b) It is the largest forest in the world.", "c) No animals live in the Amazon rainforest.", "d) People call it the lungs of the Earth."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: rừng Amazon ở Nam Mỹ. b) Đúng. c) Sai: rất nhiều loài động thực vật sống ở đó. d) Đúng: 'the lungs of the Earth' = lá phổi của Trái Đất."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["mountain", "núi"], ["river", "sông"], ["lake", "hồ"], ["sea", "biển"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["tower", "This", "tallest", "in", "is", "the", "city", "the"], "points": 1, "explain": "Câu đúng: This is the tallest tower in the city."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What is your favourite city? B: My favourite city is Da Lat. A: Why do you like it? B: Because the weather is cool and the flowers are beautiful.", "sub_questions": [{"q": "What is B's favourite city?", "options": ["Ha Noi", "Da Lat", "Hue"], "answer": 1}, {"q": "Why does he like it?", "options": ["The food is delicious", "The weather is cool and the flowers are beautiful", "It has many beaches"], "answer": 1}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Da Lat is famous for its beautiful flowers.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letters 'ow' are pronounced differently from the others.", "options": ["A. know", "B. show", "C. flower", "D. grow"], "answer": "C", "explain": "Know, show, grow có 'ow' đọc là /əʊ/, còn flower đọc là /aʊ/."}, {"type": "mcq", "level": "NB", "q": "Tokyo is the capital of ______.", "options": ["A. France", "B. Japan", "C. Italy", "D. Spain"], "answer": "B", "explain": "Tokyo là thủ đô của Nhật Bản (Japan)."}, {"type": "mcq", "level": "TH", "q": "This is ______ restaurant in town. A meal costs only 20,000 dong!", "options": ["A. the cheapest", "B. the cheap", "C. cheaper", "D. the most cheap"], "answer": "A", "explain": "Cheap là tính từ ngắn: so sánh nhất là 'the cheapest' (rẻ nhất)."}, {"type": "mcq", "level": "TH", "q": "Miss Lan is our teacher. ______ lessons are always interesting.", "options": ["A. His", "B. Her", "C. Their", "D. Its"], "answer": "B", "explain": "Miss Lan là nữ nên dùng tính từ sở hữu 'her' (của cô ấy)."}, {"type": "mcq", "level": "VD", "q": "Antarctica is ______ place on Earth.", "options": ["A. the coldest", "B. the cold", "C. the most cold", "D. colder"], "answer": "A", "explain": "Cold là tính từ ngắn: so sánh nhất 'the coldest'. Nam Cực là nơi lạnh nhất Trái Đất."}, {"type": "mcq", "level": "VD", "q": "Choose the sentence with the correct superlative.", "options": ["A. She is the prettiest girl in our class.", "B. This is the most fast car in the shop.", "C. He is the baddest player on the team.", "D. That is the expensivest hotel in the city."], "answer": "A", "explain": "Câu A đúng: pretty → the prettiest. Fast là tính từ ngắn (không dùng most); bad → the worst; expensive là tính từ dài (the most expensive)."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Seoul is the capital of South Korea. It is a modern city with many tall buildings. Korean food like kimchi is famous all over the world. Winter in Seoul is very cold.", "statements": ["a) Seoul is the capital of South Korea.", "b) Seoul has no tall buildings.", "c) Kimchi is a famous Korean food.", "d) Winter in Seoul is hot."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: Seoul có nhiều tòa nhà cao tầng. c) Đúng. d) Sai: mùa đông ở Seoul rất lạnh."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Last year, our class visited Hoi An. The old town is beautiful with colourful lanterns. We walked along the Thu Bon River and ate cao lau. Hoi An is the most beautiful town we have ever seen.", "statements": ["a) The class visited Hoi An last year.", "b) The old town has colourful lanterns.", "c) They swam in the Thu Bon River.", "d) They think Hue is the most beautiful town."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng. c) Sai: họ đi bộ dọc sông (walked along), không bơi. d) Sai: họ nghĩ Hội An là thị trấn đẹp nhất."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["lantern", "đèn lồng"], ["market", "chợ"], ["temple", "ngôi đền"], ["bridge", "cây cầu"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["most", "Kimchi", "food", "is", "the", "famous"], "points": 1, "explain": "Câu đúng: Kimchi is the most famous food."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Have you ever visited Hoi An? B: Yes, I have. It is an ancient town. A: What is it famous for? B: It is famous for its colourful lanterns.", "sub_questions": [{"q": "Has B visited Hoi An?", "options": ["Yes, he has", "No, he has not", "Yes, he does"], "answer": 0}, {"q": "What is Hoi An famous for?", "options": ["Tall buildings", "Colourful lanterns", "Beautiful beaches"], "answer": 1}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Hoi An is an ancient and beautiful town.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letters 'oa' are pronounced differently from the others.", "options": ["A. boat", "B. coat", "C. road", "D. shout"], "answer": "D", "explain": "Boat, coat, road có 'oa' đọc là /əʊ/. Shout không có 'oa' và đọc là /aʊ/ nên khác nhất."}, {"type": "mcq", "level": "NB", "q": "Many people visit the Eiffel Tower when they come to ______.", "options": ["A. London", "B. Paris", "C. Tokyo", "D. Sydney"], "answer": "B", "explain": "Tháp Eiffel nằm ở Paris, thủ đô nước Pháp."}, {"type": "mcq", "level": "TH", "q": "The Mekong is one of ______ rivers in the world.", "options": ["A. the longest", "B. the most long", "C. the long", "D. longer"], "answer": "A", "explain": "Long là tính từ ngắn: so sánh nhất 'the longest'. Cụm 'one of...' luôn đi với so sánh nhất."}, {"type": "mcq", "level": "TH", "q": "The children are playing in the park. ______ parents are watching them.", "options": ["A. Their", "B. His", "C. Her", "D. Its"], "answer": "A", "explain": "The children là số nhiều (they) nên dùng 'their' (của họ)."}, {"type": "mcq", "level": "VD", "q": "The blue whale is ______ animal in the world.", "options": ["A. the biggest", "B. the most big", "C. bigger", "D. the big"], "answer": "A", "explain": "Big gấp đôi phụ âm cuối: the biggest. Cá voi xanh là loài động vật lớn nhất thế giới."}, {"type": "mcq", "level": "VD", "q": "A: What is the highest mountain in the world? B: ______", "options": ["A. Fansipan", "B. Everest", "C. Fuji", "D. Ba Den"], "answer": "B", "explain": "Everest là ngọn núi cao nhất thế giới. Fansipan là nóc nhà Đông Dương, cao nhất Việt Nam nhưng không phải nhất thế giới."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Canberra is the capital of Australia. It is smaller and quieter than Sydney. Canberra has a big lake and many parks. The Parliament House is a famous building there.", "statements": ["a) Canberra is the capital of Australia.", "b) Canberra is bigger than Sydney.", "c) Canberra has a big lake and many parks.", "d) The Opera House is in Canberra."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: Canberra nhỏ hơn và yên tĩnh hơn Sydney. c) Đúng. d) Sai: nhà hát Opera ở Sydney."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: My dream city is Singapore. It is clean, modern and safe. People speak English there, so I can talk with everyone. I want to visit Singapore next summer with my family.", "statements": ["a) The writer's dream city is Singapore.", "b) Singapore is dirty and dangerous.", "c) People speak English in Singapore.", "d) The writer wants to visit Singapore alone."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: Singapore sạch, hiện đại và an toàn. c) Đúng. d) Sai: người viết muốn đi cùng gia đình."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["north", "phía bắc"], ["south", "phía nam"], ["east", "phía đông"], ["west", "phía tây"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["mountain", "Everest", "the", "highest", "in", "is", "world", "the"], "points": 1, "explain": "Câu đúng: Everest is the highest mountain in the world."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Which country do you want to visit? B: I want to visit Japan. A: Which places do you want to see? B: I want to see Tokyo and Mount Fuji.", "sub_questions": [{"q": "Which country does B want to visit?", "options": ["China", "Japan", "Korea"], "answer": 1}, {"q": "What does he want to see?", "options": ["Tokyo and Mount Fuji", "Seoul and kimchi", "Beijing and the Great Wall"], "answer": 0}], "points": 1, "explain": "Nghe kỹ đoạn hội thoại để trả lời."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Everest is the highest mountain in the world.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}]}</script>
