Đọc rõ ràng, đúng phát âm, chú ý các từ plastic và environment."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'a' is pronounced differently from the others.", "options": ["A. start", "B. art", "C. sand", "D. heart"], "answer": "C", "explain": "start, art, heart có chữ a đọc là /ɑː/; sand có chữ a đọc là /æ/."}, {"type": "mcq", "level": "NB", "q": "To ______ means to give one thing and take another thing in return.", "options": ["A. swap", "B. save", "C. waste", "D. pollute"], "answer": "A", "explain": "Swap nghĩa là trao đổi — đưa một thứ và nhận lại một thứ khác."}, {"type": "mcq", "level": "TH", "q": "If we swap our old books, we ______ money and paper.", "options": ["A. saves", "B. will save", "C. save will", "D. saved"], "answer": "B", "explain": "Mệnh đề chính của câu điều kiện loại 1: will + động từ nguyên thể (will save)."}, {"type": "mcq", "level": "TH", "q": "At the charity fair, students ______ their old toys to poor children.", "options": ["A. give", "B. throw", "C. waste", "D. drop"], "answer": "A", "explain": "Tại hội chợ từ thiện, học sinh tặng (give) đồ chơi cũ cho trẻ em nghèo."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. If we will swap books, we will save money.", "B. If we swap books, we will save money.", "C. If we swaps books, we will save money.", "D. If we swap books, we save will money."], "answer": "B", "explain": "Mệnh đề If dùng hiện tại đơn (we swap), không dùng will sau If."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. return", "B. garden", "C. basket", "D. plastic"], "answer": "A", "explain": "garden, basket, plastic có trọng âm ở âm tiết thứ nhất; return có trọng âm ở âm tiết thứ hai."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Our school has a swap fair every spring. Students bring their old books, toys and clothes to school. They swap things with their friends. Old things become new and useful again. The students do not throw away many things.", "statements": ["a) The swap fair is every winter.", "b) Students bring old books, toys and clothes.", "c) Students throw their old things away at the fair.", "d) Old things become useful again."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: hội chợ trao đổi diễn ra mỗi mùa xuân. b) Đúng. c) Sai: học sinh trao đổi đồ với bạn, không vứt đi. d) Đúng: đồ cũ lại trở nên hữu ích."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Last month, Hoa's class collected old clothes for children in the mountains. They washed the clothes and put them in big boxes. A charity group took the boxes to a small village. The children there were very happy.", "statements": ["a) Hoa's class collected old clothes last month.", "b) They put the clothes in plastic bags.", "c) A charity group took the clothes to a village.", "d) The children in the village were sad."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: quần áo được xếp vào các hộp lớn. c) Đúng. d) Sai: các em nhỏ ở làng rất vui."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["swap", "trao đổi"], ["charity", "từ thiện"], ["old clothes", "quần áo cũ"], ["give", "cho, tặng"]], "points": 1, "explain": "swap: trao đổi; charity: từ thiện; old clothes: quần áo cũ; give: cho, tặng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["We", "can", "give", "our", "old", "books", "to", "poor", "children"], "points": 1, "explain": "Câu đúng: We can give our old books to poor children."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What are you doing, Nam? B: I am collecting my old toys for the swap fair. A: When is the fair? B: It is on Saturday morning at school.", "sub_questions": [{"q": "What is Nam collecting?", "options": ["Old books", "Old toys", "Old clothes"], "answer": 1}, {"q": "When is the swap fair?", "options": ["On Saturday afternoon", "On Sunday morning", "On Saturday morning"], "answer": 2}], "points": 1, "explain": "Nam đang gom đồ chơi cũ; hội chợ trao đổi diễn ra vào sáng thứ Bảy ở trường."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "We can swap our old books with friends", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm, chú ý từ swap."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'a' is pronounced differently from the others.", "options": ["A. apple", "B. dance", "C. fast", "D. plant"], "answer": "A", "explain": "dance, fast, plant có chữ a đọc là /ɑː/ (tiếng Anh Anh); apple có chữ a đọc là /æ/."}, {"type": "mcq", "level": "NB", "q": "To ______ the environment means to keep it clean and safe.", "options": ["A. pollute", "B. protect", "C. waste", "D. drop"], "answer": "B", "explain": "Protect nghĩa là bảo vệ — giữ cho môi trường sạch và an toàn."}, {"type": "mcq", "level": "TH", "q": "If it ______ sunny tomorrow, we will plant trees in the park.", "options": ["A. is", "B. will be", "C. are", "D. be"], "answer": "A", "explain": "Sau If dùng hiện tại đơn; chủ ngữ it đi với is."}, {"type": "mcq", "level": "TH", "q": "Please pick up the ______ on the ground and put it in the bin.", "options": ["A. rubbish", "B. flowers", "C. grass", "D. money"], "answer": "A", "explain": "Rác (rubbish) trên mặt đất cần được nhặt bỏ vào thùng rác."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. happy", "B. camping", "C. reduce", "D. rubbish"], "answer": "C", "explain": "happy, camping, rubbish có trọng âm ở âm tiết thứ nhất; reduce có trọng âm ở âm tiết thứ hai."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. The sun gives us light and heat.", "B. A sun rises in the east.", "C. Sun rises in an east.", "D. The sun rises in a east."], "answer": "A", "explain": "Mặt trời là vật duy nhất nên dùng the sun; east (phía đông) cũng xác định duy nhất nên dùng the east."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: On Sunday morning, our class went to the beach for a clean-up. We picked up plastic bottles, cans and bags. We put the rubbish in big black bags. After two hours, the beach was clean and beautiful.", "statements": ["a) The class went to the beach on Saturday morning.", "b) They picked up plastic bottles and cans.", "c) They put the rubbish in big black bags.", "d) The clean-up lasted all day."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: lớp đi vào sáng Chủ nhật. b) Đúng. c) Đúng. d) Sai: buổi dọn dẹp kéo dài hai giờ."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Trees are very important for the Earth. They give us clean air and shade. They are also homes for birds and small animals. If we cut down too many trees, the air will become dirty.", "statements": ["a) Trees give us clean air and shade.", "b) Trees are homes for fish.", "c) Cutting down many trees makes the air dirty.", "d) Trees are not important for the Earth."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: cây là nhà của chim và các con vật nhỏ. c) Đúng. d) Sai: cây rất quan trọng đối với Trái Đất."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["plant trees", "trồng cây"], ["pick up", "nhặt lên"], ["clean-up", "buổi dọn dẹp"], ["air pollution", "ô nhiễm không khí"]], "points": 1, "explain": "plant trees: trồng cây; pick up: nhặt lên; clean-up: buổi dọn dẹp; air pollution: ô nhiễm không khí."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["If", "we", "plant", "more", "trees", "the", "air", "will", "be", "cleaner"], "points": 1, "explain": "Câu đúng: If we plant more trees, the air will be cleaner."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What are you doing this Sunday? B: I am joining a clean-up at the beach. A: What do you need? B: I need gloves and a big bag for rubbish.", "sub_questions": [{"q": "Where is the clean-up?", "options": ["At the park", "At the beach", "At school"], "answer": 1}, {"q": "What does he need?", "options": ["Gloves and a big bag", "A hat and water", "A bike and a bag"], "answer": 0}], "points": 1, "explain": "Buổi dọn dẹp ở bãi biển; cậu ấy cần găng tay và một túi lớn đựng rác."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Let us plant more trees in our school yard", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm, chú ý từ plant với âm /ɑː/."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'a' is pronounced differently from the others.", "options": ["A. class", "B. grass", "C. black", "D. basket"], "answer": "C", "explain": "class, grass, basket có chữ a đọc là /ɑː/; black có chữ a đọc là /æ/."}, {"type": "mcq", "level": "NB", "q": "______ pollution makes rivers and lakes dirty.", "options": ["A. Water", "B. Air", "C. Noise", "D. Light"], "answer": "A", "explain": "Water pollution (ô nhiễm nguồn nước) làm sông hồ bị bẩn."}, {"type": "mcq", "level": "TH", "q": "If we waste water, there ______ enough clean water in the future.", "options": ["A. will not be", "B. is not", "C. not be", "D. will be not"], "answer": "A", "explain": "Mệnh đề chính phủ định trong câu điều kiện loại 1: there will not be (won't be)."}, {"type": "mcq", "level": "TH", "q": "Water is important for life. ______ water in this river is dirty now.", "options": ["A. A", "B. An", "C. The", "D. Some"], "answer": "C", "explain": "Nước trong con sông này đã được xác định cụ thể (in this river) nên dùng the."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. If we won't save water, we will have problems.", "B. If we don't save water, we will have problems.", "C. If we doesn't save water, we will have problems.", "D. If we not save water, we will have problems."], "answer": "B", "explain": "Mệnh đề If phủ định dùng hiện tại đơn: we don't save; không dùng will trong mệnh đề If."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. bottle", "B. collect", "C. paper", "D. plastic"], "answer": "B", "explain": "bottle, paper, plastic có trọng âm ở âm tiết thứ nhất; collect có trọng âm ở âm tiết thứ hai."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Tom is a good boy. He turns off the tap when he brushes his teeth. He takes a shower in five minutes. He never leaves the tap running. Tom's little sister learns from him and saves water too.", "statements": ["a) Tom leaves the tap running.", "b) Tom turns off the tap when he brushes his teeth.", "c) Tom takes a shower in fifteen minutes.", "d) His little sister saves water too."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: Tom không bao giờ để vòi nước chảy. b) Đúng. c) Sai: Tom tắm trong năm phút. d) Đúng: em gái Tom học theo anh."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: The river near my village is dirty now. People throw rubbish and plastic bags into the river. The water smells bad and the fish are dying. If people stop throwing rubbish, the river will be clean again.", "statements": ["a) The river near the village is clean now.", "b) People throw rubbish into the river.", "c) The fish in the river are dying.", "d) The river will be dirty again if people stop throwing rubbish."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: con sông đang bẩn. b) Đúng. c) Đúng: cá đang chết dần. d) Sai: nếu ngừng xả rác, con sông sẽ sạch trở lại."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["water pollution", "ô nhiễm nước"], ["river", "con sông"], ["save water", "tiết kiệm nước"], ["dirty", "bẩn"]], "points": 1, "explain": "water pollution: ô nhiễm nước; river: con sông; save water: tiết kiệm nước; dirty: bẩn."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["We", "must", "save", "water", "for", "the", "future"], "points": 1, "explain": "Câu đúng: We must save water for the future."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Why is the river dirty, Dad? B: Because people throw rubbish into it. A: What can we do? B: We must not throw rubbish in the river, and we can clean it this weekend.", "sub_questions": [{"q": "Why is the river dirty?", "options": ["Because of the rain", "Because people throw rubbish into it", "Because there are many fish"], "answer": 1}, {"q": "What will they do this weekend?", "options": ["Clean the river", "Go swimming", "Have a picnic"], "answer": 0}], "points": 1, "explain": "Con sông bẩn vì người ta xả rác xuống sông; cuối tuần này họ sẽ dọn sạch con sông."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "We must save water every day", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm, chú ý từ save."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'a' is pronounced differently from the others.", "options": ["A. father", "B. large", "C. dark", "D. camping"], "answer": "D", "explain": "father, large, dark có chữ a đọc là /ɑː/; camping có chữ a đọc là /æ/."}, {"type": "mcq", "level": "NB", "q": "A ______ bottle can be filled with water again and again.", "options": ["A. refillable", "B. broken", "C. dirty", "D. heavy"], "answer": "A", "explain": "Refillable nghĩa là có thể làm đầy lại nhiều lần."}, {"type": "mcq", "level": "TH", "q": "If we ______ glass bottles, we can reuse them many times.", "options": ["A. collects", "B. collect", "C. will collect", "D. collected"], "answer": "B", "explain": "Mệnh đề If dùng hiện tại đơn với chủ ngữ we: collect."}, {"type": "mcq", "level": "TH", "q": "A: What do you think about using plastic straws? B: ______", "options": ["A. I think we should use paper straws.", "B. I am a student.", "C. It is Monday today.", "D. Yes, I do."], "answer": "A", "explain": "Câu hỏi xin ý kiến (What do you think about...?) nên trả lời bằng I think we should... (Tôi nghĩ chúng ta nên dùng ống hút giấy)."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. recycle", "B. apple", "C. factory", "D. traffic"], "answer": "A", "explain": "apple, factory, traffic có trọng âm ở âm tiết thứ nhất; recycle có trọng âm chính ở âm tiết thứ hai (re-CY-cle)."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. He is a honest boy.", "B. He is an honest boy.", "C. He is the honest boy in a world.", "D. He is honest a boy."], "answer": "B", "explain": "Honest đọc bắt đầu bằng nguyên âm (chữ h câm: /ˈɒnɪst/) nên dùng an: an honest boy."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: My family lives in a green home. We sort our rubbish into paper, plastic and glass. We keep old glass bottles and use them again. My mother uses the glass bottles to keep flowers.", "statements": ["a) The family sorts rubbish into paper, plastic and glass.", "b) They throw old glass bottles away.", "c) The mother keeps flowers in glass bottles.", "d) They use plastic bottles to keep flowers."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: họ giữ chai thủy tinh cũ lại để dùng tiếp. c) Đúng. d) Sai: mẹ cắm hoa trong chai thủy tinh, không phải chai nhựa."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Noise pollution is a problem in big cities. Cars, motorbikes and factories make loud noise all day. Loud noise can make people sick and tired. People should not make loud noise at night.", "statements": ["a) Noise pollution is a problem in big cities.", "b) Only cars make loud noise in cities.", "c) Loud noise is good for people's health.", "d) People should not make loud noise at night."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Sai: ô tô, xe máy và nhà máy đều gây tiếng ồn. c) Sai: tiếng ồn lớn làm người ta ốm và mệt. d) Đúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["glass bottle", "chai thủy tinh"], ["refill", "làm đầy lại"], ["sort", "phân loại"], ["noise pollution", "ô nhiễm tiếng ồn"]], "points": 1, "explain": "glass bottle: chai thủy tinh; refill: làm đầy lại; sort: phân loại; noise pollution: ô nhiễm tiếng ồn."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["If", "we", "sort", "the", "rubbish", "recycling", "will", "be", "easier"], "points": 1, "explain": "Câu đúng: If we sort the rubbish, recycling will be easier."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Do you bring a water bottle to school? B: Yes. I use a refillable bottle. A: Why don't you buy bottled water? B: Because plastic bottles make a lot of rubbish.", "sub_questions": [{"q": "What kind of bottle does she use?", "options": ["A plastic bottle", "A refillable bottle", "A glass cup"], "answer": 1}, {"q": "Why doesn't she buy bottled water?", "options": ["She doesn't like water", "It is too cold", "Plastic bottles make a lot of rubbish"], "answer": 2}], "points": 1, "explain": "Cô bé dùng chai làm đầy lại được và không mua nước đóng chai vì chai nhựa tạo nhiều rác."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "I use a refillable bottle every day", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm, chú ý từ refillable."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'a' is pronounced differently from the others.", "options": ["A. catch", "B. plan", "C. farm", "D. factory"], "answer": "C", "explain": "catch, plan, factory có chữ a đọc là /æ/; farm có chữ a đọc là /ɑː/."}, {"type": "mcq", "level": "NB", "q": "The ______ is everything around us, like air, water and land.", "options": ["A. environment", "B. electricity", "C. charity", "D. machine"], "answer": "A", "explain": "Environment (môi trường) là tất cả những gì xung quanh chúng ta như không khí, nước và đất."}, {"type": "mcq", "level": "TH", "q": "There will be more fresh air if we ______ less.", "options": ["A. pollutes", "B. pollute", "C. will pollute", "D. polluting"], "answer": "B", "explain": "Mệnh đề if (đứng sau mệnh đề chính) vẫn dùng hiện tại đơn: if we pollute less."}, {"type": "mcq", "level": "TH", "q": "______ sun gives us light and energy.", "options": ["A. A", "B. An", "C. The", "D. Some"], "answer": "C", "explain": "Mặt trời là vật duy nhất nên dùng the: The sun."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. If we protect the environment, it will be greener.", "B. If we will protect the environment, it will be greener.", "C. If we protects the environment, it will be greener.", "D. If we protect the environment, it be will greener."], "answer": "A", "explain": "Câu điều kiện loại 1 đúng: If + hiện tại đơn (we protect), will + động từ nguyên thể (will be)."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. plastic", "B. return", "C. paper", "D. happy"], "answer": "B", "explain": "plastic, paper, happy có trọng âm ở âm tiết thứ nhất; return có trọng âm ở âm tiết thứ hai."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Class 6A is a green class. The students do not use plastic cups. They bring their own water bottles to school. They also keep the classroom clean and green with small plants.", "statements": ["a) The students of 6A use plastic cups.", "b) They bring their own water bottles to school.", "c) There are small plants in the classroom.", "d) The green class is 6B."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: học sinh không dùng cốc nhựa. b) Đúng. c) Đúng: lớp có cây nhỏ. d) Sai: lớp học xanh là 6A."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: In the future, our city will be greener. People will plant trees along the streets. Buses will use clean energy. If everyone recycles, there will be less rubbish on the streets.", "statements": ["a) People will plant trees along the streets.", "b) Buses will use more petrol in the future.", "c) Recycling will make more rubbish on the streets.", "d) The city will be greener in the future."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Sai: xe buýt sẽ dùng năng lượng sạch. c) Sai: tái chế làm giảm rác. d) Đúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["environment", "môi trường"], ["protect", "bảo vệ"], ["green", "xanh lá; thân thiện với môi trường"], ["future", "tương lai"]], "points": 1, "explain": "environment: môi trường; protect: bảo vệ; green: xanh; future: tương lai."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["The", "city", "will", "be", "greener", "if", "we", "plant", "trees"], "points": 1, "explain": "Câu đúng: The city will be greener if we plant trees."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What will our school be like in ten years? B: I think it will be greener. There will be more trees. A: And students will recycle more rubbish. B: Yes, our school will be clean and beautiful.", "sub_questions": [{"q": "What will the school be like in ten years?", "options": ["Busier", "Greener", "Noisier"], "answer": 1}, {"q": "What will students do more?", "options": ["Cut down trees", "Use more plastic", "Recycle more rubbish"], "answer": 2}], "points": 1, "explain": "Trường sẽ xanh hơn, nhiều cây hơn và học sinh sẽ tái chế nhiều rác hơn."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Our city will be greener in the future", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm, chú ý từ greener và future."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'a' is pronounced differently from the others.", "options": ["A. answer", "B. ask", "C. aunt", "D. candle"], "answer": "D", "explain": "answer, ask, aunt có chữ a đọc là /ɑː/ (tiếng Anh Anh); candle có chữ a đọc là /æ/."}, {"type": "mcq", "level": "NB", "q": "______ bags are bad for animals in the sea.", "options": ["A. Plastic", "B. Paper", "C. Cloth", "D. School"], "answer": "A", "explain": "Túi ni lông (plastic bags) rất có hại cho động vật biển vì chúng có thể ăn phải."}, {"type": "mcq", "level": "TH", "q": "If my sister ______ time, she will join the clean-up.", "options": ["A. has", "B. have", "C. will have", "D. had"], "answer": "A", "explain": "Mệnh đề If dùng hiện tại đơn; chủ ngữ my sister (số ít) nên động từ là has."}, {"type": "mcq", "level": "TH", "q": "We can get ______ energy from the sun and the wind.", "options": ["A. clean", "B. dirty", "C. loud", "D. heavy"], "answer": "A", "explain": "Năng lượng từ mặt trời và gió là năng lượng sạch (clean energy)."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. plastic", "B. paper", "C. environment", "D. bottle"], "answer": "C", "explain": "plastic, paper, bottle có trọng âm ở âm tiết thứ nhất; environment có trọng âm chính ở âm tiết thứ hai (en-VI-ron-ment)."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. If you will help me, I will finish the poster today.", "B. If you help me, I will finish the poster today.", "C. If you helps me, I will finish the poster today.", "D. If you help me, I finish will the poster today."], "answer": "B", "explain": "Sau If với chủ ngữ you dùng động từ nguyên thể (help); mệnh đề chính: will finish."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Our school has a poster competition about the environment. Students draw pictures of green trees, clean rivers and blue skies. Mai's poster says: Protect the Earth. She wins the first prize.", "statements": ["a) The competition is about sports.", "b) Students draw pictures of green trees and clean rivers.", "c) Mai's poster says: Save Money.", "d) Mai wins the first prize."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: cuộc thi vẽ áp phích về môi trường. b) Đúng. c) Sai: áp phích của Mai viết Protect the Earth. d) Đúng."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Our school has three recycling bins. The green bin is for paper, the blue bin is for plastic, and the yellow bin is for glass and cans. Students must put rubbish in the right bin. This helps workers recycle things easily.", "statements": ["a) The green bin is for plastic.", "b) The blue bin is for plastic.", "c) The yellow bin is for glass and cans.", "d) Students can put rubbish in any bin they like."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: thùng xanh lá dành cho giấy. b) Đúng: thùng xanh dương dành cho nhựa. c) Đúng. d) Sai: học sinh phải bỏ rác vào đúng thùng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["poster", "tấm áp phích"], ["competition", "cuộc thi"], ["prize", "giải thưởng"], ["draw", "vẽ"]], "points": 1, "explain": "poster: tấm áp phích; competition: cuộc thi; prize: giải thưởng; draw: vẽ."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["Students", "must", "put", "rubbish", "in", "the", "right", "bin"], "points": 1, "explain": "Câu đúng: Students must put rubbish in the right bin."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Which bin is for paper? B: The green one. A: And where do I put this glass bottle? B: Put it in the yellow bin.", "sub_questions": [{"q": "Which bin is for paper?", "options": ["The blue bin", "The green bin", "The yellow bin"], "answer": 1}, {"q": "Where does the glass bottle go?", "options": ["In the green bin", "In the blue bin", "In the yellow bin"], "answer": 2}], "points": 1, "explain": "Giấy bỏ vào thùng xanh lá; chai thủy tinh bỏ vào thùng vàng."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Please put the rubbish in the right bin", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm, chú ý từ rubbish."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letter 'a' is pronounced differently from the others.", "options": ["A. fantastic", "B. laugh", "C. activity", "D. charity"], "answer": "B", "explain": "fantastic, activity, charity có chữ a đọc là /æ/; laugh có chữ a đọc là /ɑː/."}, {"type": "mcq", "level": "NB", "q": "Old paper can be ______ to make new paper.", "options": ["A. recycled", "B. wasted", "C. thrown", "D. dropped"], "answer": "A", "explain": "Giấy cũ có thể được tái chế (recycled) để làm giấy mới."}, {"type": "mcq", "level": "TH", "q": "If everyone ______ bikes to school, the air will be cleaner.", "options": ["A. ride", "B. rides", "C. will ride", "D. riding"], "answer": "B", "explain": "Everyone là chủ ngữ số ít nên động từ trong mệnh đề If phải thêm -s: rides."}, {"type": "mcq", "level": "TH", "q": "He bought ______ new bike. ______ bike is green.", "options": ["A. a / The", "B. an / The", "C. the / A", "D. a / A"], "answer": "A", "explain": "Nhắc đến chiếc xe đạp lần đầu dùng a (a new bike); nhắc lại lần hai dùng the (The bike)."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. The Earth is the our home.", "B. Earth is our home only.", "C. The Earth is our only home.", "D. An Earth is our only home."], "answer": "C", "explain": "Dùng the với Earth (vật duy nhất); vị trí tính từ only đứng trước danh từ home: our only home."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. begin", "B. plastic", "C. bottle", "D. paper"], "answer": "A", "explain": "plastic, bottle, paper có trọng âm ở âm tiết thứ nhất; begin có trọng âm ở âm tiết thứ hai."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Last weekend, my family had a green day. We walked to the park instead of going by motorbike. We ate lunch on the grass and took all our rubbish home. My brother planted a small tree in our garden.", "statements": ["a) The family went to the park by motorbike.", "b) They ate lunch on the grass.", "c) They left their rubbish in the park.", "d) The brother planted a tree in the garden."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: gia đình đi bộ ra công viên. b) Đúng. c) Sai: họ mang hết rác về nhà. d) Đúng."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Wind and sun give us clean energy. Many schools now use solar panels on their roofs. Solar energy helps schools save electricity. If more schools use solar panels, the air will be cleaner.", "statements": ["a) Wind and sun give us dirty energy.", "b) Many schools use solar panels on their roofs.", "c) Solar energy helps schools save electricity.", "d) Solar panels make the air dirtier."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: gió và mặt trời cho năng lượng sạch. b) Đúng. c) Đúng. d) Sai: dùng tấm pin mặt trời giúp không khí sạch hơn."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["solar energy", "năng lượng mặt trời"], ["wind", "gió"], ["roof", "mái nhà"], ["clean energy", "năng lượng sạch"]], "points": 1, "explain": "solar energy: năng lượng mặt trời; wind: gió; roof: mái nhà; clean energy: năng lượng sạch."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["If", "more", "schools", "use", "solar", "panels", "the", "air", "will", "be", "cleaner"], "points": 1, "explain": "Câu đúng: If more schools use solar panels, the air will be cleaner."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: How do you go to school, Hoa? B: I ride my bike. It is clean and healthy. A: I walk to school with my friends. B: Great. We do not make air pollution.", "sub_questions": [{"q": "How does Hoa go to school?", "options": ["By bus", "By bike", "By car"], "answer": 1}, {"q": "How does the boy go to school?", "options": ["On foot", "By motorbike", "By car"], "answer": 0}], "points": 1, "explain": "Hoa đi học bằng xe đạp; cậu bé đi bộ đến trường cùng bạn bè."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "If we ride bikes, the air will be cleaner", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm, chú ý ngữ điệu của câu điều kiện."}]}]}</script>
