i expensive là the most expensive."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Taro is a teaching robot. It works in a school in Tokyo. Taro can speak English and Japanese. It helps students with their homework, but it cannot play sports with them.", "statements": ["a) Taro works in a hospital.", "b) Taro can speak two languages.", "c) Taro helps students with their homework.", "d) Taro can play sports with students."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: Taro làm việc ở trường học. b) Đúng: Taro nói được tiếng Anh và tiếng Nhật. c) Đúng: đoạn văn nói rõ. d) Sai: Taro không chơi thể thao được với học sinh."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Guard robots work at night. They walk around houses and offices to keep them safe. If they hear a strange noise, they make a loud sound and call the people in the house. People feel safe with guard robots.", "statements": ["a) Guard robots work in the morning.", "b) They keep houses and offices safe.", "c) They make a loud sound when they hear a strange noise.", "d) People feel safe with guard robots."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: rô-bốt bảo vệ làm việc vào ban đêm. b) Đúng: chúng giữ an toàn cho nhà và văn phòng. c) Đúng: nghe tiếng động lạ, chúng phát ra âm thanh lớn. d) Đúng: mọi người cảm thấy an toàn nhờ chúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["guard", "canh gác"], ["iron", "là, ủi quần áo"], ["clothes", "quần áo"], ["strong", "khỏe, mạnh"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["could", "This", "robot", "lift", "heavy", "boxes"], "points": 1, "explain": "Câu đúng: This robot could lift heavy boxes."}, {"type": "listening", ced differently from the others.", "options": ["A. computer", "B. robot", "C. planet", "D. heavy"], "answer": "A", "explain": "robot, planet, heavy nhấn âm tiết thứ nhất; computer nhấn âm tiết thứ hai."}, {"type": "mcq", "level": "VD", "q": "Could your robot speak English last year? — No, it ___.", "options": ["A. couldn't", "B. can't", "C. isn't", "D. doesn't"], "answer": "A", "explain": "Câu hỏi dùng Could (quá khứ) nên câu trả lời phủ định là No, it couldn't."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Pepper is a friendly robot in a shopping mall. It talks to people and tells them where the shops are. Pepper can speak three languages. Children like taking photos with Pepper.", "statements": ["a) Pepper works in a school.", "b) Pepper can speak three languages.", "c) Pepper tells people where the shops are.", "d) Children do not like Pepper."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: Pepper làm việc ở trung tâm thương mại. b) Đúng: Pepper nói được ba thứ tiếng. c) Đúng: đoạn văn nói rõ. d) Sai: trẻ em thích chụp ảnh với Pepper."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Long ago, people did all the housework by hand. Today, home robots help us a lot. They can clean the floor, wash the dishes and do the laundry. Our lives are easier with robots.", "statements": ["a) Long ago, robots did all the housework.", "b) Home robots can wash the dishes.", "c) Home robots cannot do the laundry.", "d) Our lives are easier with robots."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: ngày xưa con người tự làm việc nhà bằng tay. b) Đúng: rô-bốt rửa được bát đĩa. c) Sai: rô-bốt giặt được quần áo. d) Đúng: cuộc sống dễ dàng hơn nhờ rô-bốt."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["lift", "nâng lên"], ["future", "tương lai"], ["voice", "giọng nói"], ["noise", "tiếng ồn"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["be", "Robots", "will", "very", "useful", "in", "the", "future"], "points": 1, "explain": "Câu đúng: Robots will be very useful in the future."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: I want a home robot. B: What do you want it to do? A: I want it to iron my clothes and clean my room. B: That is a good idea.", "sub_questions": [{"q": "What does speaker A want?", "options": ["A home robot", "A teaching robot", "A new phone"], "answer": 0}, {"q": "What does A want the robot to do?", "options": ["Cook meals", "Iron clothes and clean the room"], "answer": 1}], "points": 1, "explain": "Bạn A muốn mua rô-bốt gia đình để là quần áo và dọn phòng."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "In the future, robots will help us a lot.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letters 'ow' are pronounced differently from the others.", "options": ["A. flower", "B. tower", "C. down", "D. yellow"], "answer": "D", "explain": "flower, tower, down có âm /aʊ/; yellow có âm /əʊ/ nên khác các từ còn lại."}, {"type": "mcq", "level": "NB", "q": "Robots that work in space can help astronauts on a space ___.", "options": ["A. station", "B. garden", "C. kitchen", "D. beach"], "answer": "A", "explain": "space station nghĩa là trạm vũ trụ, nơi các phi hành gia sống và làm việc."}, {"type": "mcq", "level": "TH", "q": "When my mother was a child, she ___ sing very well.", "options": ["A. could", "B. can", "C. will", "D. is"], "answer": "A", "explain": "When my mother was a child là quá khứ nên dùng could."}, {"type": "mcq", "level": "TH", "q": "A: Could robots cook in the past? B: ___", "options": ["A. No, they couldn't.", "B. Yes, they can.", "C. No, they aren't.", "D. Yes, they do."], "answer": "A", "explain": "Câu hỏi Could... in the past nên trả lời phủ định bằng No, they couldn't."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. expensive", "B. dangerous", "C. wonderful", "D. difficult"], "answer": "A", "explain": "dangerous, wonderful, difficult nhấn âm tiết thứ nhất; expensive nhấn âm tiết thứ hai."}, {"type": "mcq", "level": "VD", "q": "That robot is the ___ popular in our school.", "options": ["A. most", "B. more", "C. very", "D. much"], "answer": "A", "explain": "So sánh nhất của tính từ dài popular là the most popular."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Aibo is a robot dog. It can run, jump and play with children. Aibo cannot eat or drink. When you call its name, Aibo comes to you.", "statements": ["a) Aibo is a real dog.", "b) Aibo can run and jump.", "c) Aibo can eat and drink.", "d) Aibo comes when you call its name."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: Aibo là chó rô-bốt, không phải chó thật. b) Đúng: Aibo chạy và nhảy được. c) Sai: Aibo không ăn uống được. d) Đúng: gọi tên là Aibo chạy đến."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Factory robots work day and night. They make cars and phones. They never feel tired, but people must check them every week. A robot can stop working if it is broken.", "statements": ["a) Factory robots work only in the day.", "b) They make cars and phones.", "c) Robots never need checking.", "d) People check the robots every month."], "answer": ["F", "T", "F", "F"], "explain": "a) Sai: rô-bốt nhà máy làm việc cả ngày lẫn đêm. b) Đúng: chúng sản xuất ô tô và điện thoại. c) Sai: con người phải kiểm tra chúng hằng tuần. d) Sai: kiểm tra hằng tuần, không phải hằng tháng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["repair", "sửa chữa"], ["smart", "thông minh"], ["dangerous", "nguy hiểm"], ["recognise", "nhận ra"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["couldn't", "The", "robot", "open", "the", "heavy", "door"], "points": 1, "explain": "Câu đúng: The robot couldn't open the heavy door."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: This teaching robot is great. B: What can it do? A: It can teach English and maths. B: Could it teach music last year? A: No, it couldn't.", "sub_questions": [{"q": "What can the robot teach?", "options": ["English and maths", "Music and art", "Sports"], "answer": 0}, {"q": "Could it teach music last year?", "options": ["Yes, it could", "No, it couldn't"], "answer": 1}], "points": 1, "explain": "Rô-bốt dạy được tiếng Anh và toán; năm ngoái nó chưa dạy được nhạc."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Teaching robots can help students learn English.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letters 'ou' are pronounced differently from the others.", "options": ["A. mouth", "B. south", "C. count", "D. group"], "answer": "D", "explain": "mouth, south, count có âm /aʊ/; group có âm /uː/ nên khác các từ còn lại."}, {"type": "mcq", "level": "NB", "q": "Please ___ the clothes after washing them. They are wet.", "options": ["A. iron", "B. lift", "C. guard", "D. repair"], "answer": "A", "explain": "iron nghĩa là là, ủi quần áo cho phẳng sau khi giặt."}, {"type": "mcq", "level": "TH", "q": "I ___ swim when I was six, but I can swim now.", "options": ["A. could", "B. couldn't", "C. can", "D. will"], "answer": "B", "explain": "Khi sáu tuổi chưa biết bơi (đối lập với can swim now) nên dùng couldn't."}, {"type": "mcq", "level": "TH", "q": "A space robot is the ___ expensive machine in this lab.", "options": ["A. most", "B. more", "C. very", "D. much"], "answer": "A", "explain": "So sánh nhất của tính từ dài expensive là the most expensive."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. remember", "B. laundry", "C. factory", "D. station"], "answer": "A", "explain": "laundry, factory, station nhấn âm tiết thứ nhất; remember nhấn âm tiết thứ hai."}, {"type": "mcq", "level": "VD", "q": "Could he ride a horse when he was ten? — Yes, he ___.", "options": ["A. could", "B. can", "C. did", "D. was"], "answer": "A", "explain": "Câu hỏi dùng Could nên câu trả lời khẳng định là Yes, he could."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Cooking robots are new in some restaurants. They can cook noodles and rice. They work fast and the food is always hot. Many people want to try their food.", "statements": ["a) Cooking robots work in some restaurants.", "b) They can cook noodles and rice.", "c) Their food is always cold.", "d) Many people want to try their food."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đoạn văn nói rõ. b) Đúng: chúng nấu được mì và cơm. c) Sai: thức ăn luôn nóng. d) Đúng: nhiều người muốn thử món ăn của chúng."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Nurse robots help old people in their homes. They bring food and water to them. They can also talk and sing with the old people. The old people are very happy with the robots.", "statements": ["a) Nurse robots help children in schools.", "b) They bring food and water to old people.", "c) They cannot talk to old people.", "d) The old people like the robots."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: rô-bốt y tá giúp người già tại nhà. b) Đúng: chúng mang thức ăn và nước uống. c) Sai: chúng nói chuyện và hát cùng người già. d) Đúng: người già rất vui với chúng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["housework", "việc nhà"], ["factory", "nhà máy"], ["laundry", "việc giặt quần áo"], ["strong", "khỏe, mạnh"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["could", "My", "robot", "sing", "and", "dance", "very", "well"], "points": 1, "explain": "Câu đúng: My robot could sing and dance very well."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What is the most useful robot here? B: I think the doctor robot is. A: Why? B: Because it helps sick people every day.", "sub_questions": [{"q": "Which robot is the most useful?", "options": ["The home robot", "The doctor robot", "The factory robot"], "answer": 1}, {"q": "Why is it the most useful?", "options": ["It helps sick people", "It is very cheap"], "answer": 0}], "points": 1, "explain": "Rô-bốt bác sĩ là hữu ích nhất vì nó giúp người bệnh mỗi ngày."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "Home robots can clean the house and cook meals.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined letters 'ow' are pronounced differently from the others.", "options": ["A. how", "B. town", "C. crown", "D. slow"], "answer": "D", "explain": "how, town, crown có âm /aʊ/; slow có âm /əʊ/ nên khác các từ còn lại."}, {"type": "mcq", "level": "NB", "q": "A ___ robot stands at the door and keeps the house safe.", "options": ["A. guard", "B. doctor", "C. teaching", "D. cooking"], "answer": "A", "explain": "guard robot nghĩa là rô-bốt bảo vệ, canh cửa và giữ an toàn cho ngôi nhà."}, {"type": "mcq", "level": "TH", "q": "When she was eight, she ___ play chess very well.", "options": ["A. could", "B. can", "C. will", "D. is"], "answer": "A", "explain": "When she was eight là quá khứ nên dùng could."}, {"type": "mcq", "level": "TH", "q": "This is the ___ interesting robot book in the library.", "options": ["A. most", "B. more", "C. very", "D. much"], "answer": "A", "explain": "So sánh nhất của tính từ dài interesting là the most interesting."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. dangerous", "B. popular", "C. apartment", "D. wonderful"], "answer": "C", "explain": "dangerous, popular, wonderful nhấn âm tiết thứ nhất; apartment nhấn âm tiết thứ hai."}, {"type": "mcq", "level": "VD", "q": "He was very tired, so he ___ do his homework last night.", "options": ["A. couldn't", "B. can't", "C. isn't", "D. won't"], "answer": "A", "explain": "Last night và was tired cho thấy việc ở quá khứ, dùng couldn't."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Robots in hotels can carry bags to your room. They can also open doors with their arms. A hotel robot never sleeps, so it works all day and all night.", "statements": ["a) Hotel robots can carry bags.", "b) They cannot open doors.", "c) A hotel robot sleeps at night.", "d) It works all day and all night."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: rô-bốt khách sạn mang được hành lý. b) Sai: chúng mở được cửa bằng cánh tay. c) Sai: rô-bốt không bao giờ ngủ. d) Đúng: chúng làm việc cả ngày lẫn đêm."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Some robots can understand our voices. When you say 'Hello', they answer you. They can learn new words every day. In the future, they will talk like people.", "statements": ["a) Robots cannot understand our voices.", "b) They answer when you say hello.", "c) They can learn new words.", "d) They talk like people now."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: một số rô-bốt hiểu được giọng nói của chúng ta. b) Đúng: bạn chào là chúng đáp lại. c) Đúng: chúng học từ mới mỗi ngày. d) Sai: việc nói chuyện như người là ở tương lai."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["do the laundry", "giặt quần áo"], ["space station", "trạm vũ trụ"], ["smart", "thông minh"], ["repair", "sửa chữa"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["washes", "The", "home", "robot", "the", "dishes", "after", "dinner"], "points": 1, "explain": "Câu đúng: The home robot washes the dishes after dinner."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Can your robot understand English? B: Yes, it can. It could understand Vietnamese last year, and now it can understand English too.", "sub_questions": [{"q": "What languages can the robot understand?", "options": ["Only English", "Vietnamese and English", "Only Vietnamese"], "answer": 1}, {"q": "Could it understand English last year?", "options": ["Yes, it could", "No, it couldn't"], "answer": 1}], "points": 1, "explain": "Rô-bốt hiểu cả tiếng Việt và tiếng Anh; năm ngoái nó chỉ hiểu tiếng Việt."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "A strong robot can lift heavy things easily.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined part is pronounced differently from the others.", "options": ["A. point", "B. join", "C. oil", "D. about"], "answer": "D", "explain": "point, join, oil có âm /ɔɪ/; about có âm /aʊ/ nên khác các từ còn lại."}, {"type": "mcq", "level": "NB", "q": "The machine is broken. We need to ___ it before using it again.", "options": ["A. repair", "B. iron", "C. lift", "D. guard"], "answer": "A", "explain": "repair nghĩa là sửa chữa; máy hỏng thì cần sửa trước khi dùng lại."}, {"type": "mcq", "level": "TH", "q": "___ your robot dance two years ago?", "options": ["A. Can", "B. Could", "C. Is", "D. Does"], "answer": "B", "explain": "Two years ago là quá khứ nên câu hỏi dùng Could."}, {"type": "mcq", "level": "TH", "q": "She thinks robots are the ___ wonderful machines in the world.", "options": ["A. most", "B. more", "C. very", "D. much"], "answer": "A", "explain": "So sánh nhất của tính từ dài wonderful là the most wonderful."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. holiday", "B. dangerous", "C. exciting", "D. popular"], "answer": "C", "explain": "holiday, dangerous, popular nhấn âm tiết thứ nhất; exciting nhấn âm tiết thứ hai."}, {"type": "mcq", "level": "VD", "q": "People ___ make robots a hundred years ago.", "options": ["A. couldn't", "B. can't", "C. don't", "D. aren't"], "answer": "A", "explain": "A hundred years ago là quá khứ nên dùng couldn't."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: My school has a teaching robot named Edu. Edu teaches us English words and songs. Edu is never tired and is always happy. We love learning with Edu.", "statements": ["a) Edu is a student.", "b) Edu teaches English words and songs.", "c) Edu is often tired.", "d) Students love learning with Edu."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: Edu là rô-bốt dạy học. b) Đúng: Edu dạy từ tiếng Anh và bài hát. c) Sai: Edu không bao giờ mệt. d) Đúng: học sinh thích học cùng Edu."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Robots are helpful, but they canno
