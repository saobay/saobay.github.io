. flat", "C. motorhome", "D. skyscraper"], "answer": "A", "explain": "castle là lâu đài, nơi vua và hoàng hậu sống ngày xưa."}, {"type": "mcq", "level": "TH", "q": "She ___ a super fridge for her new kitchen next month.", "options": ["A. will buys", "B. will buy", "C. buy yesterday", "D. buys now"], "answer": "B", "explain": "Next month là dấu hiệu tương lai và sau will là động từ nguyên thể: will buy."}, {"type": "mcq", "level": "TH", "q": "___ will you live in the future? – In a villa by the sea.", "options": ["A. What", "B. Where", "C. When", "D. Who"], "answer": "B", "explain": "Câu trả lời chỉ nơi chốn (In a villa by the sea) nên câu hỏi dùng Where."}, {"type": "mcq", "level": "VD", "q": "Nam is not sure about the trip. He ___ go with us.", "options": ["A. will", "B. is", "C. might", "D. goes"], "answer": "C", "explain": "Nam chưa chắc chắn (not sure) về chuyến đi nên dùng might + động từ nguyên thể."}, {"type": "mcq", "level": "VD", "q": "A: Will there be robots in every house in 2050? B: ___", "options": ["A. Yes, there will.", "B. Yes, there is.", "C. Yes, it does.", "D. Yes, they are."], "answer": "A", "explain": "Câu hỏi Will there be... trả lời ngắn là Yes, there will / No, there won't."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Anna wants a house with a garden full of flowers. Her house will be small but comfortable. A robot will water the flowers every day. In the evening, Anna will read books in the garden.", "statements": ["a) Anna wants a big house.", "b) A robot will water the flowers every day.", "c) Anna will read books in the garden in the morning.", "d) The garden will have many flowers."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: Anna muốn một ngôi nhà nhỏ nhưng thoải mái. b) Đúng: người máy sẽ tưới hoa mỗi ngày. c) Sai: Anna đọc sách vào buổi tối, không phải buổi sáng. d) Đúng: khu vườn sẽ đầy hoa."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: My uncle might build a house under the ground. It will be cool in summer and warm in winter. It will have small windows and a strong door. A computer will control everything in the house.", "statements": ["a) The uncle is sure he will build the house.", "b) The house will be hot in summer.", "c) A computer will control everything in the house.", "d) The house will have big windows."], "answer": ["F", "F", "T", "F"], "explain": "a) Sai: đoạn văn dùng might nên chú của người viết chưa chắc chắn. b) Sai: nhà sẽ mát vào mùa hè. c) Đúng: máy tính sẽ điều khiển mọi thứ trong nhà. d) Sai: nhà có cửa sổ nhỏ, không phải cửa sổ to."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["apartment", "căn hộ chung cư"], ["air conditioner", "máy điều hòa"], ["palace", "cung điện"], ["future", "tương lai"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["by", "flying", "car", "They", "will", "travel"], "points": 1, "explain": "Câu đúng: They will travel by flying car."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What kind of house will you have? B: I will have a motorhome. I will travel to many places with it. A: That sounds great! Where will you go first? B: I will go to the beach.", "sub_questions": [{"q": "What kind of house will B have?", "options": ["A motorhome", "A villa", "A tree house"], "answer": 0}, {"q": "Where will B go first?", "options": ["To the mountains", "To the beach", "To the city"], "answer": 1}], "points": 1, "explain": "Nghe kỹ: B sẽ có một ngôi nhà di động và đầu tiên sẽ đi đến bãi biển."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "In the future, houses will be very smart.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm, chú ý trọng âm và ngữ điệu cuối câu."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. picture", "B. future", "C. machine", "D. garden"], "answer": "C", "explain": "machine có trọng âm rơi vào âm tiết thứ 2, các từ còn lại rơi vào âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "We cook meals in the ___.", "options": ["A. bathroom", "B. bedroom", "C. kitchen", "D. garden"], "answer": "C", "explain": "kitchen là phòng bếp, nơi nấu các bữa ăn."}, {"type": "mcq", "level": "TH", "q": "My parents will ___ a new house next month.", "options": ["A. builds", "B. building", "C. build", "D. built"], "answer": "C", "explain": "Sau will phải dùng động từ nguyên thể: will build."}, {"type": "mcq", "level": "TH", "q": "Will there be a swimming pool in your house? – Yes, ___.", "options": ["A. there will", "B. it is", "C. they will", "D. will there"], "answer": "A", "explain": "Câu hỏi Will there be... trả lời ngắn: Yes, there will."}, {"type": "mcq", "level": "VD", "q": "Choose the sentence that shows the speaker is NOT sure.", "options": ["A. I will visit Hue next month.", "B. I might visit Hue next month.", "C. I won't visit Hue next month.", "D. I visit Hue every year."], "answer": "B", "explain": "might diễn tả khả năng có thể, người nói chưa chắc chắn. Các câu còn lại hoặc chắc chắn, hoặc là thói quen hiện tại."}, {"type": "mcq", "level": "VD", "q": "Choose the sentence that is NOT correct.", "options": ["A. She might not come.", "B. Might he will help us?", "C. They might live in a castle.", "D. We might buy a flat."], "answer": "B", "explain": "might không đi cùng will. Câu đúng phải là Might he help us hoặc Will he help us."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: In the future, Minh will live in a smart flat. When he comes home, the lights will turn on. The super fridge will tell him what food to buy. A robot will open the door for his dog.", "statements": ["a) Minh will live in a smart flat.", "b) The lights will turn off when he comes home.", "c) The super fridge will tell him what food to buy.", "d) A robot will open the door for his cat."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: Minh sẽ sống trong một căn hộ thông minh. b) Sai: đèn sẽ bật (turn on) khi cậu ấy về nhà. c) Đúng: tủ lạnh sẽ cho cậu ấy biết cần mua thức ăn gì. d) Sai: người máy mở cửa cho chú chó, không phải mèo."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Some people think we will live in houses under the sea in 2100. The houses will have glass walls, so we can watch fish swimming. Special cars will take us to the land. We might keep sea animals as pets.", "statements": ["a) The writer is sure people will live under the sea in 2100.", "b) People can watch fish through the glass walls.", "c) People will walk to the land.", "d) People might keep sea animals as pets."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: đoạn văn nói một số người nghĩ vậy (some people think), không khẳng định chắc chắn. b) Đúng: tường kính giúp ngắm cá bơi. c) Sai: ô tô đặc biệt sẽ đưa mọi người lên đất liền. d) Đúng: chúng ta có thể nuôi động vật biển làm thú cưng."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["smart TV", "ti vi thông minh"], ["super fridge", "tủ lạnh siêu cấp"], ["bedroom", "phòng ngủ"], ["bathroom", "phòng tắm"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["might", "a", "She", "house", "have", "in", "space"], "points": 1, "explain": "Câu đúng: She might have a house in space."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What will your house have? B: It will have a big garden and a swimming pool. A: Will it have a robot? B: No, it won't, but it will have a smart TV.", "sub_questions": [{"q": "What will the house have?", "options": ["A big garden and a swimming pool", "A robot and a garden", "Only a smart TV"], "answer": 0}, {"q": "Will the house have a robot?", "options": ["Yes, it will", "No, it won't", "Yes, it might"], "answer": 1}], "points": 1, "explain": "Nghe kỹ: ngôi nhà sẽ có vườn lớn và hồ bơi, không có người máy nhưng có ti vi thông minh."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "My dream house will have a beautiful garden.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm, chú ý trọng âm và ngữ điệu cuối câu."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. begin", "B. relax", "C. modern", "D. enjoy"], "answer": "C", "explain": "modern có trọng âm rơi vào âm tiết thứ 1, các từ còn lại rơi vào âm tiết thứ 2."}, {"type": "mcq", "level": "NB", "q": "A very large house with a big garden, usually for rich people, is a ___.", "options": ["A. villa", "B. flat", "C. classroom", "D. tent"], "answer": "A", "explain": "villa là biệt thự, nhà to có vườn rộng, thường của người giàu."}, {"type": "mcq", "level": "TH", "q": "We ___ our grandparents next Sunday.", "options": ["A. will visits", "B. will visit", "C. visit yesterday", "D. visiting"], "answer": "B", "explain": "Next Sunday là dấu hiệu tương lai và sau will là động từ nguyên thể: will visit."}, {"type": "mcq", "level": "TH", "q": "The robot will ___ the floor every morning.", "options": ["A. cleans", "B. cleaned", "C. clean", "D. cleaning"], "answer": "C", "explain": "Sau will phải dùng động từ nguyên thể: will clean."}, {"type": "mcq", "level": "VD", "q": "Choose the correct sentence.", "options": ["A. Won't you will help me?", "B. You won't believe it!", "C. Will won't they come?", "D. He wills not go."], "answer": "B", "explain": "won't = will not, đứng sau chủ ngữ trong câu trần thuật. Các câu còn lại sai cấu trúc với will và won't."}, {"type": "mcq", "level": "VD", "q": "A: Where might you live in the future? B: ___", "options": ["A. I might live in a tree house.", "B. I live in a flat now.", "C. I lived in a villa last year.", "D. Yes, I might."], "answer": "A", "explain": "Câu hỏi hỏi về nơi ở có thể trong tương lai (might) nên đáp án dùng might và một nơi ở."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Lucy's future house will be a penthouse. From her windows, she will see the whole city. The penthouse will have a modern kitchen and three bedrooms. Lucy will grow vegetables on the roof.", "statements": ["a) Lucy will live in a penthouse.", "b) She will see the sea from her windows.", "c) The penthouse will have an old kitchen.", "d) Lucy will grow vegetables on the roof."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: nhà tương lai của Lucy sẽ là một căn hộ áp mái. b) Sai: cô ấy sẽ ngắm toàn thành phố, không phải biển. c) Sai: nhà bếp hiện đại (modern), không phải cũ. d) Đúng: Lucy sẽ trồng rau trên mái nhà."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: One day, houses might move! A motorhome will take families to new places every week. In the morning, you might wake up by the sea. In the evening, you might sleep in the mountains.", "statements": ["a) The writer says houses will certainly move one day.", "b) A motorhome will take families to new places every week.", "c) You might wake up in the mountains in the morning.", "d) You might sleep in the mountains in the evening."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: đoạn văn dùng might nên chưa chắc chắn. b) Đúng: nhà di động sẽ đưa gia đình đến nơi mới mỗi tuần. c) Sai: buổi sáng thức dậy bên bờ biển, còn núi là vào buổi tối. d) Đúng: buổi tối có thể ngủ trên núi."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["motorhome", "nhà di động"], ["penthouse", "căn hộ áp mái"], ["roof", "mái nhà"], ["window", "cửa sổ"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["will", "robots", "You", "see", "everywhere"], "points": 1, "explain": "Câu đúng: You will see robots everywhere."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: Will your house be in the city or in the countryside? B: It will be in the countryside. It will be quiet and comfortable. A: Will it have a garden? B: Yes, it will have a big garden with flowers.", "sub_questions": [{"q": "Where will the house be?", "options": ["In the city", "In the countryside", "Under the sea"], "answer": 1}, {"q": "What will the garden have?", "options": ["Vegetables", "Flowers", "Trees"], "answer": 1}], "points": 1, "explain": "Nghe kỹ: ngôi nhà sẽ ở nông thôn, yên tĩnh và thoải mái, khu vườn lớn có nhiều hoa."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "The robot will clean the house for me.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm, chú ý trọng âm và ngữ điệu cuối câu."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. villa", "B. castle", "C. hotel", "D. garden"], "answer": "C", "explain": "hotel có trọng âm rơi vào âm tiết thứ 2, các từ còn lại rơi vào âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "This machine washes your dirty dishes. It is a ___.", "options": ["A. dishwasher", "B. washing machine", "C. fridge", "D. computer"], "answer": "A", "explain": "dishwasher là máy rửa bát, rửa các bát đĩa bẩn."}, {"type": "mcq", "level": "TH", "q": "They will ___ a small party in their new house.", "options": ["A. has", "B. have", "C. having", "D. had"], "answer": "B", "explain": "Sau will phải dùng động từ nguyên thể: will have."}, {"type": "mcq", "level": "TH", "q": "___ there be flying cars in 2050?", "options": ["A. Will", "B. Are", "C. Is", "D. Do"], "answer": "A", "explain": "Câu hỏi về tương lai với there be dùng Will there be..."}, {"type": "mcq", "level": "VD", "q": "She might ___ her umbrella at home. Let's call her.", "options": ["A. leave", "B. leaves", "C. left", "D. leaving"], "answer": "A", "explain": "Sau might phải dùng động từ nguyên thể: might leave."}, {"type": "mcq", "level": "VD", "q": "Choose the sentence that is a promise.", "options": ["A. I will help you with your homework.", "B. It might rain tonight.", "C. Will you open the door?", "D. He might come late."], "answer": "A", "explain": "will dùng để hứa hẹn: I will help you... Các câu còn lại là khả năng có thể hoặc câu hỏi."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Peter will live in a house with solar panels. The house will make electricity from the sun. It will have a smart TV and a computer in every room. Peter will play games with his robot friend.", "statements": ["a) Peter's house will make electricity from the sun.", "b) There will be a computer in every room.", "c) The house will have no TV.", "d) Peter will play games alone."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: nhà có tấm pin mặt trời để tạo điện từ ánh nắng. b) Đúng: mỗi phòng sẽ có một máy tính. c) Sai: nhà có ti vi thông minh. d) Sai: Peter chơi trò chơi với bạn người máy, không phải một mình."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: In the future, we might control our houses with our voices. We will say 'open' and the door will open. We will say 'music' and songs will play. Our houses will know what we need.", "statements": ["a) People might control their houses with their voices.", "b) The door will open when we say 'close'.", "c) Songs will play when we say 'music'.", "d) Our houses will know what we need."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: ta có thể điều khiển nhà bằng giọng nói. b) Sai: cửa mở khi ta nói open, không phải close. c) Đúng: nói music thì nhạc sẽ phát. d) Đúng: ngôi nhà sẽ biết ta cần gì."}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["UFO", "đĩa bay"], ["solar energy", "năng lượng mặt trời"], ["control", "điều khiển"], ["voice", "giọng nói"]], "points": 1, "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng."}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["use", "solar", "We", "energy", "will", "at", "home"], "points": 1, "explain": "Câu đúng: We will use solar energy at home."}, {"type": "listening", "level": "TH", "q": "Nghe và trả lời câu hỏi", "audio_text": "A: What will your future kitchen have? B: It will have a super fridge and an automatic cooker. A: Will a robot cook for you? B: Yes, it might. Robots will be very clever.", "sub_questions": [{"q": "What will the kitchen have?", "options": ["A super fridge and an automatic cooker", "A TV and a computer", "A big garden"], "answer": 0}, {"q": "Will a robot cook for B?", "options": ["Yes, it will surely", "Yes, it might", "No, never"], "answer": 1}], "points": 1, "explain": "Nghe kỹ: nhà bếp sẽ có tủ lạnh siêu cấp và bếp nấu tự động; người máy có thể sẽ nấu ăn."}, {"type": "speaking", "level": "TH", "q": "Đọc to câu sau", "target": "I will travel around the world one day.", "points": 1, "explain": "Đọc rõ ràng, đúng phát âm, chú ý trọng âm và ngữ điệu cuối câu."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. apartment", "B. villa", "C. castle", "D. picture"], "answer": "A", "explain": "apartment có trọng âm rơi vào âm tiết thứ 2, các từ còn lại rơi vào âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "Her flat is on the 15th floor of a tall ___.", "options": ["A. skyscraper", "B. castle", "C. motorhome", "D. tree house"], "answer": "A", "explain": "skyscraper là tòa nhà chọc trời có nhiều tầng, tầng 15 ở trong tòa nhà như vậy."}, {"type": "mcq", "level": "TH", "q": "My sister will ___ a doctor in the future.", "options": ["A. is", "B. be", "C. being", "D. was"], "answer": "B", "explain": "Sau will phải dùng động từ nguyên thể, động từ to be ở dạng nguyên thể là be."}, {"type": "mcq", "level": "TH", "q": "Will you come to my new house this weekend? – Yes, I ___.", "options": ["A. will", "B. do", "C. am", "D. did"], "answer": "A", "explain": "Câu hỏi bắt đầu bằng Will nên trả lời ngắn là Yes, I will."}, {"type": "mcq", "level": "VD", "q": "Choose the correct negative sentence.", "options": ["A. He willn't come.", "B. He won't come.", "C. He not will come.", "D. He will doesn't come."], "answer": "B", "explain": "Phủ định của will là will not, viết tắt là won't. Không có dạng willn't."}, {"type": "mcq", "level": "VD", "q": "What does 'might' mean in the sentence 'It might rain tonight'?", "options": ["A. It is sure to rain.", "B. It is possible that it will rain.", "C. It will not rain.", "D. It rained last night."], "answer": "B", "explain": "might nghĩa là có thể, sự việc có khả năng xảy ra nhưng chưa chắc chắn."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the following statements are True (T) or False (F). Passage: Sara's dream is a small house near a river. She will plant fruit trees around the house. Every morning, she will swim in the river. Her house will have big windows and a red roof.", "statements": ["a) Sara wants a house near a river.", "b) She will plant flowers around the house.", "c) She will swim in the river every morning.", "d) The roof of her house will be blue."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: Sara
