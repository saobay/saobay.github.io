{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. book", "B. school", "C. soon", "D. food"], "answer": "A", "explain": "Các từ school, soon, food có 'oo' đọc là /uː/ (âm dài), còn book có 'oo' đọc là /ʊ/ (âm ngắn)."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'u' is pronounced differently from the others.", "options": ["A. cut", "B. fun", "C. sun", "D. put"], "answer": "D", "explain": "'u' trong cut, fun, sun đọc là /ʌ/, còn trong put đọc là /ʊ/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. hobby", "B. soccer", "C. enjoy", "D. leisure"], "answer": "C", "explain": "enjoy có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "My sister loves ___ scarves and hats in winter.", "options": ["A. cycling", "B. knitting", "C. cooking", "D. swimming"], "answer": "B", "explain": "knitting (đan len) dùng để làm khăn và mũ len."}, {"type": "mcq", "level": "TH", "q": "In their ___, the Browns often go cycling together.", "options": ["A. leisure time", "B. work time", "C. school time", "D. meal time"], "answer": "A", "explain": "leisure time (thời gian rảnh rỗi) mới hợp nghĩa: gia đình đi xe đạp cùng nhau lúc rảnh."}, {"type": "mcq", "level": "VD", "q": "I enjoy ___ books in my free time.", "options": ["A. read", "B. to read", "C. reads", "D. reading"], "answer": "D", "explain": "Sau enjoy phải dùng V-ing: enjoy + reading."}, {"type": "mcq", "level": "TH", "q": "A: \"Would you like to join our DIY club?\" - B: \"___\"", "options": ["A. No way, never.", "B. I dislike you.", "C. Yes, I'd love to.", "D. I hate clubs."], "answer": "C", "explain": "Lời mời lịch sự thì đáp lại 'Yes, I'd love to.' (Vâng, tôi rất muốn)."}, {"type": "truefalse", "level": "NB", "q": "Minh is 13 years old. In his free time, he loves playing badminton with his friends at the school yard. He plays every afternoon after school. On Sunday mornings, he sometimes goes cycling with his dad in the park.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Minh is thirteen years old.", "b) Minh plays badminton in the morning.", "c) Minh goes cycling with his dad every day.", "d) Minh plays badminton after school."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng (13 years old). b) Sai (chơi buổi chiều - every afternoon). c) Sai (chỉ sáng Chủ nhật - sometimes). d) Đúng."}, {"type": "truefalse", "level": "VDC", "q": "Minh plays badminton every afternoon. He never misses a training session, even when it rains. His coach says he is the most hard-working player in the team. Minh dreams of becoming a professional player one day.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Minh is a lazy player.", "b) Bad weather stops Minh from training.", "c) The coach admires Minh's effort.", "d) Minh wants to play badminton as a job."], "answer": ["F", "F", "T", "T"], "explain": "a) Sai (chăm chỉ nhất đội). b) Sai (không nghỉ tập ngay cả khi mưa). c) Đúng (huấn luyện viên khen ngợi). d) Đúng (mơ thành cầu thủ chuyên nghiệp)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: She enjoys ___ (read) detective stories.", "answer": "reading", "explain": "Sau enjoy dùng V-ing nên read thành reading."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. cook", "B. look", "C. foot", "D. moon"], "answer": "D", "explain": "Các từ cook, look, foot có 'oo' đọc là /ʊ/, còn moon có 'oo' đọc là /uː/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'u' is pronounced differently from the others.", "options": ["A. pull", "B. push", "C. mud", "D. full"], "answer": "C", "explain": "'u' trong full, pull, push đọc là /ʊ/, còn trong mud đọc là /ʌ/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. judo", "B. origami", "C. knitting", "D. pottery"], "answer": "B", "explain": "origami có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "I like making small statues from soap. This hobby is called ___.", "options": ["A. soap carving", "B. soap washing", "C. soap cooking", "D. soap painting"], "answer": "A", "explain": "soap carving là nghệ thuật chạm khắc xà phòng."}, {"type": "mcq", "level": "TH", "q": "While waiting for the bus, she enjoys ___ the Internet.", "options": ["A. cooking", "B. knitting", "C. painting", "D. browsing"], "answer": "D", "explain": "browse the Internet (lướt web) là cụm từ đúng."}, {"type": "mcq", "level": "VD", "q": "She dislikes ___ up early at weekends.", "options": ["A. get", "B. gets", "C. getting", "D. to get"], "answer": "C", "explain": "Sau dislike phải dùng V-ing: dislike + getting."}, {"type": "mcq", "level": "TH", "q": "A: \"What do you like doing in your free time?\" - B: \"___\"", "options": ["A. I enjoy nothing.", "B. I enjoy reading books.", "C. I hate reading books.", "D. I dislike free time."], "answer": "B", "explain": "Hỏi về sở thích thì trả lời bằng cấu trúc enjoy + V-ing."}, {"type": "truefalse", "level": "NB", "q": "Lan enjoys DIY activities. She often makes bracelets and necklaces from beads. Last month, she made a beautiful bracelet for her mother's birthday. Her mother was very happy.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Lan likes making things by hand.", "b) Lan bought a bracelet for her mother.", "c) Lan's mother liked the bracelet.", "d) Lan never makes DIY things."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng (thích làm đồ thủ công). b) Sai (cô ấy tự làm, không mua). c) Đúng (mẹ rất vui). d) Sai (cô ấy thường xuyên làm)."}, {"type": "truefalse", "level": "VDC", "q": "Lan spent three weeks making a dollhouse for her little sister. She cut the wood, painted the walls, and made tiny furniture. When her sister saw it, she jumped with joy. Lan felt all her hard work was worth it.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Lan bought the dollhouse in a shop.", "b) Lan's sister didn't like the gift.", "c) Making the dollhouse took Lan a long time.", "d) Lan felt happy about her effort."], "answer": ["F", "F", "T", "T"], "explain": "a) Sai (tự tay làm). b) Sai (em gái nhảy cẫng vì vui). c) Đúng (mất 3 tuần). d) Đúng (cảm thấy công sức bỏ ra xứng đáng)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: My brother is interested in ___ (collect) coins.", "answer": "collecting", "explain": "Sau interested in dùng V-ing nên collect thành collecting."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. wool", "B. look", "C. afternoon", "D. good"], "answer": "C", "explain": "Các từ good, wool, look có 'oo' đọc là /ʊ/, còn afternoon có 'oo' đọc là /uː/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'u' is pronounced differently from the others.", "options": ["A. lunch", "B. sugar", "C. jump", "D. luck"], "answer": "B", "explain": "'u' trong jump, luck, lunch đọc là /ʌ/, còn trong sugar đọc là /ʊ/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. DIY", "B. craft", "C. picnic", "D. cycling"], "answer": "A", "explain": "DIY có trọng âm chính rơi vào âm tiết cuối, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "\"Do It Yourself\" is shortened as ___.", "options": ["A. DIV", "B. DYI", "C. DIW", "D. DIY"], "answer": "D", "explain": "DIY là viết tắt của Do It Yourself (tự làm đồ thủ công)."}, {"type": "mcq", "level": "TH", "q": "Choose the word CLOSEST in meaning to \"pastime\".", "options": ["A. chore", "B. task", "C. hobby", "D. job"], "answer": "C", "explain": "pastime và hobby đều có nghĩa là sở thích, thú tiêu khiển."}, {"type": "mcq", "level": "VD", "q": "They hate ___ in long queues.", "options": ["A. waited", "B. waiting", "C. wait", "D. to waiting"], "answer": "B", "explain": "Sau hate phải dùng V-ing: hate + waiting."}, {"type": "mcq", "level": "TH", "q": "A: \"Let's go cycling this weekend!\" - B: \"___\"", "options": ["A. Great idea!", "B. I hate cycling.", "C. No, I dislike you.", "D. Cycling is boring."], "answer": "A", "explain": "Đồng ý với lời rủ thì nói 'Great idea!' (Ý kiến hay đấy!)."}, {"type": "truefalse", "level": "NB", "q": "Tom and his friends have a chess club. They meet twice a week, on Tuesdays and Fridays. Tom is the best player in the club. He practises playing chess for one hour every evening.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Tom's club meets two times a week.", "b) The club meets on Mondays.", "c) Tom practises chess every day.", "d) Tom is the worst player in the club."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng (twice a week). b) Sai (họp thứ Ba và thứ Sáu). c) Đúng (every evening). d) Sai (cậu ấy chơi giỏi nhất)."}, {"type": "truefalse", "level": "VDC", "q": "Some people think hobbies are a waste of time. But scientists say hobbies make people happier and healthier. A good hobby can reduce stress and help people make new friends. It can even help students study better.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The writer thinks hobbies are useless.", "b) Hobbies can help people feel less stressed.", "c) Hobbies stop students from studying well.", "d) A hobby can bring people together."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai (tác giả bênh vực sở thích). b) Đúng (giảm căng thẳng). c) Sai (còn giúp học tốt hơn). d) Đúng (giúp kết bạn mới)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: They dislike ___ (wait) for the bus in the rain.", "answer": "waiting", "explain": "Sau dislike dùng V-ing nên wait thành waiting."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. noon", "B. put", "C. balloon", "D. pool"], "answer": "B", "explain": "Các từ balloon, pool, noon có 'oo' đọc là /uː/, còn put có 'oo' đọc là /ʊ/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'u' is pronounced differently from the others.", "options": ["A. music", "B. cook", "C. wood", "D. good"], "answer": "A", "explain": "'u' trong cook, wood, good đọc là /ʊ/, còn trong music đọc là /juː/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. badminton", "B. tennis", "C. soccer", "D. karate"], "answer": "D", "explain": "karate có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "A ___ is a small house where children play with dolls.", "options": ["A. warehouse", "B. clubhouse", "C. dollhouse", "D. doghouse"], "answer": "C", "explain": "dollhouse (nhà búp bê) là nhà nhỏ cho trẻ em chơi búp bê."}, {"type": "mcq", "level": "TH", "q": "Tom is ___ on skateboarding.", "options": ["A. angry", "B. keen", "C. tired", "D. bored"], "answer": "B", "explain": "be keen on (ham thích) là cụm từ đúng khi nói về sở thích."}, {"type": "mcq", "level": "VD", "q": "Would you like ___ badminton this afternoon?", "options": ["A. to play", "B. playing", "C. play", "D. played"], "answer": "A", "explain": "Sau would like phải dùng to-V (ý muốn cụ thể), không dùng V-ing."}, {"type": "mcq", "level": "TH", "q": "A: \"Do you like playing chess?\" - B: \"___\"", "options": ["A. Yes, I hate it.", "B. No, I love it very much.", "C. Yes, I dislike it.", "D. No, I find it boring."], "answer": "D", "explain": "Trả lời 'không thích' một cách lịch sự: No, I find it boring (tôi thấy nó chán)."}, {"type": "truefalse", "level": "NB", "q": "Anna loves messaging her friends in the evening. However, her parents think she spends too much time on her phone. Now she only uses her phone for one hour a day.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Anna likes sending messages to friends.", "b) Anna's parents are happy about her phone use.", "c) Anna now uses her phone less than before.", "d) Anna never touches her phone."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng (thích nhắn tin). b) Sai (bố mẹ nghĩ cô ấy dùng điện thoại quá nhiều). c) Đúng (giờ chỉ dùng 1 tiếng/ngày). d) Sai (vẫn dùng 1 tiếng mỗi ngày)."}, {"type": "truefalse", "level": "VDC", "q": "Anna's parents made a new rule: no phones during family meals. At first, Anna was unhappy. But after a week, she found family dinners more fun. They talked and laughed together, something they hadn't done for a long time.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Anna's parents allow phones at dinner.", "b) Anna liked the new rule immediately.", "c) The rule helped the family talk more.", "d) Family meals became worse after the rule."], "answer": ["F", "F", "T", "F"], "explain": "a) Sai (cấm điện thoại khi ăn). b) Sai (lúc đầu không vui). c) Đúng (gia đình trò chuyện nhiều hơn). d) Sai (bữa ăn vui hơn)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: He spends two hours ___ (practise) the piano every day.", "answer": "practising", "explain": "Sau spend + thời gian dùng V-ing nên practise thành practising."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. food", "B. pull", "C. full", "D. bull"], "answer": "A", "explain": "Các từ pull, full, bull có 'oo' đọc là /ʊ/, còn food có 'oo' đọc là /uː/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'u' is pronounced differently from the others.", "options": ["A. menu", "B. unit", "C. duty", "D. bush"], "answer": "D", "explain": "'u' trong menu, unit, duty đọc là /juː/, còn trong bush đọc là /ʊ/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. movie", "B. music", "C. relax", "D. weekend"], "answer": "C", "explain": "relax có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "He plays ___ with a shuttlecock.", "options": ["A. volleyball", "B. badminton", "C. tennis", "D. football"], "answer": "B", "explain": "Cầu lông (badminton) là môn dùng quả cầu (shuttlecock)."}, {"type": "mcq", "level": "TH", "q": "Lan decided to ___ up pottery as a new hobby.", "options": ["A. take", "B. give", "C. put", "D. bring"], "answer": "A", "explain": "take up (bắt đầu một sở thích mới) là cụm động từ đúng."}, {"type": "mcq", "level": "VD", "q": "My dad is interested ___ making origami.", "options": ["A. to make", "B. making", "C. make", "D. in making"], "answer": "D", "explain": "Cấu trúc đúng là be interested in + V-ing."}, {"type": "mcq", "level": "TH", "q": "A: \"How about watching a movie tonight?\" - B: \"___\"", "options": ["A. I dislike movies.", "B. No, I hate it.", "C. Sounds great!", "D. It sounds boring."], "answer": "C", "explain": "Đồng ý với gợi ý thì nói 'Sounds great!' (Nghe tuyệt đấy!)."}, {"type": "truefalse", "level": "NB", "q": "Judo is a popular sport in Mai's school. Many students join the judo club after school. They practise kicks and throws with their teacher. Mai has learnt judo for two years and she loves it.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Many students in Mai's school like judo.", "b) Mai has learnt judo for two months.", "c) The judo club practises after school.", "d) Mai hates judo."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng (nhiều học sinh tham gia). b) Sai (học đã 2 năm). c) Đúng (tập sau giờ học). d) Sai (cô ấy rất thích)."}, {"type": "truefalse", "level": "VDC", "q": "Mai chose judo because she wanted to be stronger. At first, the training was very hard and she wanted to give up. Her teacher told her never to give up. Now Mai can do difficult throws, and she is proud of herself.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Mai gave up judo after the first week.", "b) Mai's teacher encouraged her to continue.", "c) Mai regrets learning judo.", "d) Mai's hard work brought her success."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai (cô ấy kiên trì tập). b) Đúng (thầy động viên không bỏ cuộc). c) Sai (cô ấy tự hào). d) Đúng (nỗ lực mang lại thành công)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: Knitting requires a lot of ___ (patient).", "answer": "patience", "explain": "Sau a lot of cần danh từ nên patient (tính từ) thành patience (danh từ: sự kiên nhẫn)."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. soon", "B. tooth", "C. cool", "D. book"], "answer": "D", "explain": "Các từ soon, tooth, cool có 'oo' đọc là /uː/, còn book có 'oo' đọc là /ʊ/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'ue' is pronounced differently from the others.", "options": ["A. glue", "B. flew", "C. stood", "D. true"], "answer": "C", "explain": "'ue/ew' trong true, glue, flew đọc là /uː/, còn 'oo' trong stood đọc là /ʊ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. knitting", "B. crochet", "C. messaging", "D. browsing"], "answer": "B", "explain": "crochet có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "___ is a Japanese art of folding paper.", "options": ["A. Origami", "B. Pottery", "C. Knitting", "D. Painting"], "answer": "A", "explain": "Origami là nghệ thuật gấp giấy của Nhật Bản."}, {"type": "mcq", "level": "TH", "q": "My grandfather enjoys ___ chess with his friends.", "options": ["A. to playing", "B. play", "C. played", "D. playing"], "answer": "D", "explain": "Sau enjoy phải dùng V-ing."}, {"type": "mcq", "level": "VD", "q": "He can't stand ___ the same game every day.", "options": ["A. play", "B. played", "C. playing", "D. to play"], "answer": "C", "explain": "Sau can't stand phải dùng V-ing: can't stand + playing."}, {"type": "mcq", "level": "VD", "q": "A: \"I want to try soap carving, but I don't know how to start.\" - B: \"___\"", "options": ["A. Don't ask me anything.", "B. Why don't you watch some tutorial videos first?", "C. You should give up now.", "D. Soap carving is boring."], "answer": "B", "explain": "Đưa ra gợi ý lịch sự: 'Why don't you...?' (Sao bạn không...?)."}, {"type": "truefalse", "level": "VD", "q": "Doing DIY helps children in many ways. When they make things with their own hands, they learn to be patient and careful. They also feel proud when they finish a beautiful product. That is why many parents encourage their children to try DIY at weekends.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) DIY teaches children patience.", "b) Children feel proud of their DIY products.", "c) Parents stop children from doing DIY.", "d) DIY is only about making money."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng (học tính kiên nhẫn — suy ra từ bài). b) Đúng (tự hào khi hoàn thành). c) Sai (bố mẹ khuyến khích). d) Sai (bài không nói về kiếm tiền)."}, {"type": "truefalse", "level": "VDC", "q": "Many teenagers say they have no free time because of homework. Yet they spend hours on social media every day. Time management experts say people always have time for what they truly love - they just need to use their time wisely.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Teenagers really have no free time at all.", "b) Social media takes up much of teenagers' time.", "c) Experts think teenagers should give up all hobbies.", "d) Using time wisely helps people enjoy their hobbies."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai (họ vẫn dành hàng giờ cho mạng xã hội). b) Đúng. c) Sai (chuyên gia khuyên dùng thời gian khôn ngoan). d) Đúng (ý chính của bài)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: ___ (play) chess is his favourite hobby.", "answer": "Playing", "explain": "Chủ ngữ là động từ thì dùng V-ing: Playing chess (việc chơi cờ)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. afternoon", "B. room", "C. foot", "D. school"], "answer": "C", "explain": "Các từ school, afternoon, room có 'oo' đọc là /uː/, còn foot có 'oo' đọc là /ʊ/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. blue", "B. foot", "C. through", "D. too"], "answer": "B", "explain": "'oo/ou' trong through, too, blue đọc là /uː/, còn trong foot đọc là /ʊ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. boring", "B. activity", "C. exciting", "D. relaxing"], "answer": "A", "explain": "boring có trọng âm rơi vào âm tiết thứ 1, các từ còn lại nhấn âm tiết thứ 2."}, {"type": "mcq", "level": "NB", "q": "Sending short written messages on the phone is called ___.", "options": ["A. calling", "B. browsing", "C. knitting", "D. messaging"], "answer": "D", "explain": "messaging là việc nhắn tin trên điện thoại."}, {"type": "mcq", "level": "TH", "q": "She finds ___ very relaxing.", "options": ["A. garden", "B. gardened", "C. gardening", "D. to garden"], "answer": "C", "explain": "Sau find + tân ngữ dùng V-ing: find gardening relaxing."}, {"type": "mcq", "level": "VD", "q": "We spend two hours ___ messages to friends.", "options": ["A. sent", "B. sending", "C. send", "D. to send"], "answer": "B", "explain": "Cấu trúc spend + thời gian + V-ing."}, {"type": "mcq", "level": "VD", "q": "A: \"Would you mind helping me with this craft kit?\" - B: \"___\"", "options": ["A. Not at all. Happy to help.", "B. Yes, I mind a lot.", "C. No, I won't help you.", "D. I dislike helping."], "answer": "A", "explain": "Đáp lại lời nhờ giúp đỡ lịch sự: 'Not at all. Happy to help.' (Không sao cả, rất sẵn lòng)."}, {"type": "truefalse", "level": "VD", "q": "In the past, children played outside most of the day. They ran, climbed trees, and played hide-and-seek. Today, many children spend their free time in front of screens. Doctors say children should play outside more to stay healthy.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Children in the past played outdoors a lot.", "b) Modern children spend less time on screens than before.", "c) Doctors want children to play outside more.", "d) Playing outside is bad for health."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai (ngày nay trẻ dành nhiều thời gian trước màn hình hơn). c) Đúng (bác sĩ khuyên chơi ngoài trời nhiều hơn). d) Sai (chơi ngoài trời tốt cho sức khỏe)."}, {"type": "truefalse", "level": "VDC", "q": "The origami club started with only five members. They met in a small classroom and folded paper cranes. Their beautiful works were shown at the school fair. This year, more than fifty students have joined the club.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The club was unpopular from the start.", "b) The members' works impressed people at the fair.", "c) The club has grown a lot.", "d) The club stopped meeting this year."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai (ban đầu ít thành viên nhưng vẫn hoạt động). b) Đúng (tác phẩm đẹp được trưng bày ở hội chợ — suy ra gây ấn tượng). c) Đúng (từ 5 lên hơn 50 thành viên). d) Sai."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: She is good at ___ (draw) cartoons.", "answer": "drawing", "explain": "Sau good at dùng V-ing nên draw thành drawing."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. wool", "B. moon", "C. stood", "D. understood"], "answer": "B", "explain": "Các từ stood, understood, wool có 'oo' đọc là /ʊ/, còn moon có 'oo' đọc là /uː/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'u' is pronounced differently from the others.", "options": ["A. but", "B. bush", "C. push", "D. pull"], "answer": "A", "explain": "'u' trong bush, push, pull đọc là /ʊ/, còn trong but đọc là /ʌ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. collection", "B. exciting", "C. relaxing", "D. hobby"], "answer": "D", "explain": "hobby có trọng âm rơi vào âm tiết thứ 1, các từ còn lại nhấn âm tiết thứ 2."}, {"type": "mcq", "level": "NB", "q": "People make pots and bowls in ___.", "options": ["A. messaging", "B. cycling", "C. pottery", "D. knitting"], "answer": "C", "explain": "pottery (nghề làm gốm) là nơi/lĩnh vực làm nồi, bát bằng đất sét."}, {"type": "mcq", "level": "TH", "q": "They went on a ___ in the park.", "options": ["A. concert", "B. picnic", "C. meeting", "D. lesson"], "answer": "B", "explain": "picnic (buổi dã ngoại) hợp ngữ cảnh công viên nhất."}, {"type": "mcq", "level": "VD", "q": "The kids enjoy ___ hide-and-seek in the yard.", "options": ["A. playing", "B. play", "C. to play", "D. played"], "answer": "A", "explain": "Sau enjoy phải dùng V-ing."}, {"type": "mcq", "level": "VD", "q": "A: \"Sorry, I can't come to the picnic. I have to look after my grandma.\" - B: \"___\"", "options": ["A. You are lazy.", "B. I don't care.", "C. That's your problem.", "D. That's a pity. Maybe next time."], "answer": "D", "explain": "Đáp lại lời từ chối lịch sự, thông cảm: 'That's a pity. Maybe next time.' (Tiếc quá. Để lần sau nhé.)."}, {"type": "truefalse", "level": "VD", "q": "Knitting was once seen as a hobby for old people. Now many young people enjoy it too. They knit scarves, hats, and even toys. Some young people say knitting helps them relax after a busy day at school.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Only old people like knitting now.", "b) Young people knit different things.", "c) Knitting can help students relax.", "d) Knitting is becoming less popular with the young."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai (nhiều người trẻ cũng thích). b) Đúng (đan khăn, mũ, đồ chơi). c) Đúng (giúp thư giãn sau ngày học bận rộn). d) Sai (ngày càng phổ biến)."}, {"type": "truefalse", "level": "VDC", "q": "Collecting stamps may sound old-fashioned, but it teaches children about the world. Each stamp tells a story about a country, an animal, or a famous person. Many collectors say their collections are like small museums.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Stamp collecting teaches children nothing.", "b) Stamps can tell stories about different topics.", "c) Collectors compare their hobby to a museum.", "d) Only old people collect stamps."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai (dạy trẻ về thế giới). b) Đúng (mỗi tem kể một câu chuyện). c) Đúng (như những bảo tàng nhỏ). d) Sai (bài không nói vậy)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: Would you like ___ (join) our badminton club?", "answer": "to join", "explain": "Sau would like dùng to-V nên join thành to join."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. took", "B. noon", "C. smooth", "D. spoon"], "answer": "A", "explain": "Các từ noon, smooth, spoon có 'oo' đọc là /uː/, còn took có 'oo' đọc là /ʊ/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. cruel", "B. true", "C. jewel", "D. wool"], "answer": "D", "explain": "'oo/ue/ew' trong cruel, true, jewel đọc là /uː/, còn trong wool đọc là /ʊ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. cycling", "B. soccer", "C. crochet", "D. pottery"], "answer": "C", "explain": "crochet có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "The time when you are free and can do what you like is your ___.", "options": ["A. meal time", "B. leisure time", "C. work time", "D. sleep time"], "answer": "B", "explain": "leisure time là thời gian rảnh rỗi."}, {"type": "mcq", "level": "TH", "q": "Karate and judo are Japanese ___ arts.", "options": ["A. martial", "B. musical", "C. visual", "D. culinary"], "answer": "A", "explain": "martial arts (võ thuật) là cụm từ đúng cho karate và judo."}, {"type": "mcq", "level": "VD", "q": "I don't mind ___ the dishes after dinner.", "options": ["A. wash", "B. to washing", "C. washed", "D. washing"], "answer": "D", "explain": "Sau don't mind dùng V-ing: don't mind + washing."}, {"type": "mcq", "level": "VD", "q": "A: \"What kind of music do you enjoy listening to?\" - B: \"___\"", "options": ["A. I hate listening.", "B. Music is boring.", "C. I'm really into pop music.", "D. I dislike music."], "answer": "C", "explain": "Trả lời về sở thích âm nhạc: 'I'm really into pop music.' (Tôi rất mê nhạc pop)."}, {"type": "truefalse", "level": "VD", "q": "Nam wanted to learn karate, but his parents were worried. They thought karate was dangerous. The teacher explained that karate teaches respect and self-control. After one term, Nam's parents saw he became more confident and polite.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Nam's parents supported him from the start.", "b) Karate teaches more than fighting skills.", "c) Nam became less polite after learning karate.", "d) The karate teacher talked to Nam's parents."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai (lúc đầu lo lắng). b) Đúng (dạy sự tôn trọng và tự chủ). c) Sai (trở nên tự tin và lịch sự hơn). d) Đúng (thầy đã giải thích với bố mẹ)."}, {"type": "truefalse", "level": "VDC", "q": "When it rains, the children cannot play outside. Instead, they stay at home and do indoor hobbies. Some draw pictures, others build models from craft kits. Rainy days become their favourite days for creative activities.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Children hate rainy days.", "b) Indoor hobbies keep children busy when it rains.", "c) Craft kits are useless on rainy days.", "d) Rainy days inspire children's creativity."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai (ngày mưa thành ngày yêu thích). b) Đúng (sở thích trong nhà giúp trẻ bận rộn). c) Sai (trẻ lắp mô hình từ bộ dụng cụ). d) Đúng (ngày mưa khơi gợi sáng tạo)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: He hates ___ (do) the washing-up.", "answer": "doing", "explain": "Sau hate dùng V-ing nên do thành doing."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. push", "B. cook", "C. shook", "D. soon"], "answer": "D", "explain": "Các từ push, cook, shook có 'oo' đọc là /ʊ/, còn soon có 'oo' đọc là /uː/."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'oo' is pronounced differently from the others.", "options": ["A. could", "B. would", "C. food", "D. wood"], "answer": "C", "explain": "'oo/ou' trong wood, could, would đọc là /ʊ/, còn trong food đọc là /uː/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. messaging", "B. DIY", "C. judo", "D. knitting"], "answer": "B", "explain": "DIY có trọng âm chính rơi vào âm tiết cuối, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "A ___ is a set of tools for making crafts at home.", "options": ["A. craft kit", "B. cook kit", "C. school kit", "D. first-aid kit"], "answer": "A", "explain": "craft kit là bộ dụng cụ làm đồ thủ công."}, {"type": "mcq", "level": "TH", "q": "He is ___ in DIY projects.", "options": ["A. bored", "B. tired", "C. angry", "D. interested"], "answer": "D", "explain": "be interested in (quan tâm, thích thú) hợp nghĩa nhất."}, {"type": "mcq", "level": "VD", "q": "She is fond ___ reading comics.", "options": ["A. reading", "B. read", "C. of reading", "D. to read"], "answer": "C", "explain": "Cấu trúc đúng là be fond of + V-ing."}, {"type": "mcq", "level": "VD", "q": "A: \"The origami club meets every Saturday.\" - B: \"___\"", "options": ["A. Don't tell me.", "B. Really? I'd love to join.", "C. I hate origami.", "D. That's boring."], "answer": "B", "explain": "Bày tỏ hứng thú muốn tham gia: 'Really? I'd love to join.' (Thật à? Tôi rất muốn tham gia)."}, {"type": "truefalse", "level": "VD", "q": "Screen time is the time people spend using phones, tablets, or computers. A little screen time can be fun and useful. However, too much screen time can hurt children's eyes and sleep. Experts advise children to balance screen time with outdoor activities.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Screen time means time spent on electronic devices.", "b) A little screen time is always harmful.", "c) Too much screen time may affect children's health.", "d) Experts say children should avoid all screens."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng (định nghĩa trong bài). b) Sai (một chút thì vui và hữu ích). c) Đúng (hại mắt và giấc ngủ). d) Sai (chuyên gia khuyên cân bằng, không phải tránh hoàn toàn)."}, {"type": "truefalse", "level": "VDC", "q": "Hoa's grandmother knits a sweater for her every winter. Each sweater takes weeks to finish. Hoa wears them with pride and tells her friends, 'My grandma made this with love.' The sweaters keep her warm, but her grandmother's love keeps her warmer.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Hoa buys sweaters in shops.", "b) Hoa's grandmother knits very quickly.", "c) Hoa is proud of her grandmother's gifts.", "d) The writer suggests love is the best gift."], "answer": ["F", "F", "T", "T"], "explain": "a) Sai (bà tự đan tặng). b) Sai (mỗi chiếc mất nhiều tuần). c) Đúng (mặc với niềm tự hào). d) Đúng (tình yêu của bà khiến cô ấm áp hơn — ý sâu của bài)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: ___ (swim) is a great leisure activity in summer.", "answer": "Swimming", "explain": "Chủ ngữ là động từ thì dùng V-ing: Swimming (việc bơi lội)."}]}]}
