following statements are True (T) or False (F).\nThe environment is everything around us: air, water, land, plants and animals. Many people damage the environment by throwing litter and using too much plastic. We can protect it by reducing, reusing and recycling.", "statements": ["a) The environment includes air, water, land, plants and animals.", "b) Throwing litter damages the environment.", "c) Using plastic protects the environment.", "d) We should reduce, reuse and recycle."], "answer": ["T", "T", "F", "T"], "level": "NB", "explain": "Đoạn văn nói rõ môi trường gồm những gì và cách bảo vệ bằng 3R."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nLast Saturday, our class cleaned the river near our school. While we were collecting rubbish, some local people joined us. We filled ten bags with plastic bottles and bags. The river looks cleaner now.", "statements": ["a) The class cleaned the river last Sunday.", "b) Local people helped them clean the river.", "c) They collected ten bags of rubbish.", "d) The river is still dirty now."], "answer": ["F", "T", "T", "F"], "level": "TH", "explain": "Chú ý chi tiết thời gian (Saturday, không phải Sunday) và kết quả sau khi dọn."}, {"type": "short", "q": "The (pollute) ____ of rivers kills many fish.", "answer": "pollution", "level": "VDC", "explain": "Sau mạo từ the cần một danh từ: pollution (sự ô nhiễm)."}], "name": "Đề 1"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. name", "B. rain", "C. day", "D. bad"], "answer": "D", "level": "NB", "explain": "Từ bad phát âm âm a là /æ/, các từ còn lại là /eɪ/."}, {"type": "mcq", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. light", "B. time", "C. river", "D. wild"], "answer": "C", "level": "TH", "explain": "Từ river phát âm âm i là /ɪ/, các từ còn lại là /aɪ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. protect", "B. reduce", "C. climate", "D. machine"], "answer": "C", "level": "VDC", "explain": "climate nhấn âm 1 (CLImate), các từ còn lại nhấn âm 2."}, {"type": "mcq", "q": "Don't ____ rubbish in the street. Put it in the bin.", "options": ["A. throw", "B. drink", "C. cook", "D. wear"], "answer": "A", "level": "NB", "explain": "throw rubbish là vứt rác, phù hợp với ngữ cảnh."}, {"type": "mcq", "q": "____ is cutting down too many trees, which destroys animals' homes.", "options": ["A. Deforestation", "B. Recycling", "C. Protection", "D. Planting"], "answer": "A", "level": "VD", "explain": "Deforestation là sự phá rừng, phù hợp với việc chặt quá nhiều cây."}, {"type": "mcq", "q": "They ____ TV at 8 p.m. yesterday.", "options": ["A. were watching", "B. watch", "C. watched", "D. are watching"], "answer": "A", "level": "TH", "explain": "Hành động đang xảy ra tại một thời điểm xác định trong quá khứ: at 8 p.m. yesterday + quá khứ tiếp diễn."}, {"type": "mcq", "q": "Tom: Shall we plant more trees in our school? — Anna: ____", "options": ["A. That is a great idea!", "B. I don't like schools.", "C. Trees are tall.", "D. I am busy now."], "answer": "A", "level": "VD", "explain": "Đáp lại lời đề nghị bằng cách đồng tình nhiệt tình."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nPlastic bags are bad for the environment. They take hundreds of years to break down. Many countries now ask people to use cloth bags instead.", "statements": ["a) Plastic bags are good for the environment.", "b) Plastic bags last for a very long time.", "c) Cloth bags are a better choice than plastic bags.", "d) Many countries encourage people to use cloth bags."], "answer": ["F", "T", "T", "T"], "level": "NB", "explain": "Túi nhựa mất hàng trăm năm mới phân hủy nên các nước khuyến khích dùng túi vải."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWhile the students were planting trees, it began to rain heavily. They did not stop. After one hour, they planted 50 young trees around the playground.", "statements": ["a) The students planted trees in the rain.", "b) They stopped planting when it rained.", "c) They planted 50 young trees.", "d) They planted the trees in the park."], "answer": ["T", "F", "T", "F"], "level": "TH", "explain": "Chú ý chi tiết: họ không dừng lại và trồng quanh sân trường (playground), không phải công viên."}, {"type": "short", "q": "Many (endanger) ____ animals need our protection.", "answer": "endangered", "level": "VDC", "explain": "Cụm từ cố định endangered animals: động vật có nguy cơ tuyệt chủng, cần tính từ."}], "name": "Đề 2"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. mine", "B. fish", "C. like", "D. smile"], "answer": "B", "level": "NB", "explain": "Từ fish phát âm âm i là /ɪ/, các từ còn lại là /aɪ/."}, {"type": "mcq", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. plane", "B. waste", "C. map", "D. lake"], "answer": "C", "level": "TH", "explain": "Từ map phát âm âm a là /æ/, các từ còn lại là /eɪ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. recycle", "B. reduce", "C. protect", "D. plastic"], "answer": "D", "level": "VDC", "explain": "plastic nhấn âm 1 (PLAStic), các từ còn lại nhấn âm 2."}, {"type": "mcq", "q": "We should ____ old bottles to make new things.", "options": ["A. recycle", "B. throw", "C. burn", "D. hide"], "answer": "A", "level": "NB", "explain": "recycle là tái chế chai cũ thành đồ mới."}, {"type": "mcq", "q": "Factories must reduce ____ gases to fight climate change.", "options": ["A. greenhouse", "B. clean", "C. fresh", "D. bright"], "answer": "A", "level": "VD", "explain": "greenhouse gases là khí nhà kính, cần giảm để chống biến đổi khí hậu."}, {"type": "mcq", "q": "What ____ you doing at 9 o'clock last night?", "options": ["A. were", "B. are", "C. did", "D. do"], "answer": "A", "level": "TH", "explain": "Câu hỏi về hành động đang xảy ra trong quá khứ: Was/Were + S + V-ing."}, {"type": "mcq", "q": "Hoa: Why don't we reuse shopping bags? — Mai: ____", "options": ["A. Good idea. It helps reduce waste.", "B. I love shopping.", "C. Bags are heavy.", "D. Let's buy more bags."], "answer": "A", "level": "VD", "explain": "Đồng tình với đề xuất và nêu lý do bảo vệ môi trường."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nTrees give us oxygen and make the air clean. They also give homes to birds and animals. Cutting down too many trees is harmful to the environment.", "statements": ["a) Trees help make the air clean.", "b) Birds and animals live in trees.", "c) Cutting down trees is good for the environment.", "d) Trees give us oxygen."], "answer": ["T", "T", "F", "T"], "level": "NB", "explain": "Cây cho ô-xi, làm sạch không khí và là nơi ở của chim thú; chặt cây gây hại."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWhen the teacher arrived, the students were cleaning the classroom. Some were sweeping the floor while others were watering the plants. Everyone worked happily.", "statements": ["a) The students were cleaning when the teacher arrived.", "b) They were playing games in the classroom.", "c) Some students watered the plants.", "d) The students were unhappy."], "answer": ["T", "F", "T", "F"], "level": "TH", "explain": "Chú ý chi tiết: họ đang quét dọn và tưới cây, làm việc vui vẻ."}, {"type": "short", "q": "You should (reduction) ____ the amount of water you use.", "answer": "reduce", "level": "VDC", "explain": "Sau should cần động từ nguyên thể: reduce (giảm)."}], "name": "Đề 3"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. today", "B. play", "C. small", "D. say"], "answer": "C", "level": "NB", "explain": "Từ small phát âm âm a là /ɔː/, các từ còn lại là /eɪ/."}, {"type": "mcq", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. wild", "B. night", "C. skin", "D. drive"], "answer": "C", "level": "TH", "explain": "Từ skin phát âm âm i là /ɪ/, các từ còn lại là /aɪ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. protect", "B. polluted", "C. greenhouse", "D. emission"], "answer": "C", "level": "VDC", "explain": "greenhouse nhấn âm 1, các từ còn lại nhấn âm 2."}, {"type": "mcq", "q": "Air ____ comes from cars and factories.", "options": ["A. pollution", "B. flower", "C. song", "D. game"], "answer": "A", "level": "NB", "explain": "Ô nhiễm không khí đến từ xe cộ và nhà máy."}, {"type": "mcq", "q": "We can ____ old clothes by giving them to poor children.", "options": ["A. reuse", "B. break", "C. throw", "D. waste"], "answer": "A", "level": "VD", "explain": "reuse là tái sử dụng: cho quần áo cũ cho trẻ em nghèo."}, {"type": "mcq", "q": "She ____ her bike when she fell down.", "options": ["A. was riding", "B. rode", "C. rides", "D. is riding"], "answer": "A", "level": "TH", "explain": "Hành động đang diễn ra (đạp xe) thì hành động khác xen vào (ngã): quá khứ tiếp diễn + quá khứ đơn."}, {"type": "mcq", "q": "Nam: Our school uses too much plastic. — Linh: ____", "options": ["A. We should use paper cups instead.", "B. Plastic is cheap.", "C. I like our school.", "D. Let's go home."], "answer": "A", "level": "VD", "explain": "Đưa ra giải pháp thay thế cụ thể cho vấn đề nhựa dùng một lần."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWater pollution is a big problem. Dirty water from factories goes into rivers and kills fish. People should not throw chemicals into the water.", "statements": ["a) Water pollution kills fish.", "b) Dirty water from factories is clean.", "c) People should not put chemicals into water.", "d) Fish like living in dirty water."], "answer": ["T", "F", "T", "F"], "level": "NB", "explain": "Nước bẩn từ nhà máy chảy ra sông giết chết cá; không được đổ hóa chất xuống nước."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWhile Mai was walking in the park, she saw a man throwing rubbish into the lake. She told him to pick it up, and he did. Mai felt proud of herself.", "statements": ["a) Mai saw a man in the park.", "b) The man was fishing in the lake.", "c) The man picked up the rubbish.", "d) Mai felt ashamed of herself."], "answer": ["T", "F", "T", "F"], "level": "TH", "explain": "Chú ý chi tiết: người đàn ông vứt rác, sau đó nhặt lên; Mai thấy tự hào."}, {"type": "short", "q": "The (protect) ____ of forests is everyone's job.", "answer": "protection", "level": "VDC", "explain": "Sau mạo từ the cần danh từ: protection (sự bảo vệ)."}], "name": "Đề 4"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. time", "B. drink", "C. high", "D. dry"], "answer": "B", "level": "NB", "explain": "Từ drink phát âm âm i là /ɪ/, các từ còn lại là /aɪ/."}, {"type": "mcq", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. paper", "B. cat", "C. April", "D. baby"], "answer": "B", "level": "TH", "explain": "Từ cat phát âm âm a là /æ/, các từ còn lại là /eɪ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. reduce", "B. species", "C. habitat", "D. danger"], "answer": "A", "level": "VDC", "explain": "reduce nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "q": "The ____ is the natural home of a plant or an animal.", "options": ["A. habitat", "B. shop", "C. school", "D. kitchen"], "answer": "A", "level": "NB", "explain": "habitat là môi trường sống tự nhiên của động thực vật."}, {"type": "mcq", "q": "We must ____ water because it is a precious resource.", "options": ["A. save", "B. waste", "C. pollute", "D. use up"], "answer": "A", "level": "VD", "explain": "save water là tiết kiệm nước vì nước là tài nguyên quý giá."}, {"type": "mcq", "q": "I ____ a book when the lights went out.", "options": ["A. was reading", "B. read", "C. reads", "D. am reading"], "answer": "A", "level": "TH", "explain": "Hành động đang diễn ra (đọc sách) thì đèn tắt: quá khứ tiếp diễn + quá khứ đơn."}, {"type": "mcq", "q": "Teacher: How can we protect the environment? — Student: ____", "options": ["A. By planting trees and saving water.", "B. I like music.", "C. It's sunny today.", "D. We are students."], "answer": "A", "level": "VD", "explain": "Trả lời đúng trọng tâm câu hỏi bằng các hành động bảo vệ môi trường."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nMany animals are in danger. People cut down forests, so animals lose their homes. We need to protect forests to save these animals.", "statements": ["a) Many animals are safe now.", "b) Forests are the homes of animals.", "c) Cutting down forests is dangerous for animals.", "d) We should protect forests."], "answer": ["F", "T", "T", "T"], "level": "NB", "explain": "Phá rừng làm động vật mất nơi ở, vì vậy cần bảo vệ rừng."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nAt 7 a.m. yesterday, the volunteers were picking up litter on the beach. The sun was shining, but the beach was full of plastic. After two hours, the beach became clean and beautiful.", "statements": ["a) The volunteers worked in the morning.", "b) The beach was already clean.", "c) They worked for two hours.", "d) The beach looked beautiful after cleaning."], "answer": ["T", "F", "T", "T"], "level": "TH", "explain": "Chú ý chi tiết thời gian (7 a.m. yesterday) và thời lượng (two hours)."}, {"type": "short", "q": "She is (worry) ____ about climate change.", "answer": "worried", "level": "VDC", "explain": "Cụm tính từ be worried about: lo lắng về điều gì."}], "name": "Đề 5"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. cake", "B. rain", "C. late", "D. water"], "answer": "D", "level": "NB", "explain": "Từ water phát âm âm a là /ɔː/, các từ còn lại là /eɪ/."}, {"type": "mcq", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. child", "B. thin", "C. white", "D. ice"], "answer": "B", "level": "TH", "explain": "Từ thin phát âm âm i là /ɪ/, các từ còn lại là /aɪ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. plastic", "B. pollute", "C. reduce", "D. reuse"], "answer": "A", "level": "VDC", "explain": "plastic nhấn âm 1, các từ còn lại nhấn âm 2."}, {"type": "mcq", "q": "____ change makes the weather hotter and causes floods.", "options": ["A. Climate", "B. Colour", "C. Game", "D. Lesson"], "answer": "A", "level": "NB", "explain": "Climate change là biến đổi khí hậu, gây nóng lên và lũ lụt."}, {"type": "mcq", "q": "Old newspapers can be recycled to make new ____.", "options": ["A. paper", "B. plastic", "C. water", "D. air"], "answer": "A", "level": "VD", "explain": "Báo cũ được tái chế thành giấy mới, hợp logic nhất."}, {"type": "mcq", "q": "While they ____ football, it started raining.", "options": ["A. were playing", "B. played", "C. play", "D. are playing"], "answer": "A", "level": "TH", "explain": "Hành động đang diễn ra (đá bóng) thì trời mưa: while + quá khứ tiếp diễn."}, {"type": "mcq", "q": "Peter: The air in our city is polluted. — Mary: ____", "options": ["A. We should plant more trees and use buses.", "B. I like polluted air.", "C. Cities are big.", "D. Let's stay at home."], "answer": "A", "level": "VD", "explain": "Đưa ra giải pháp giảm ô nhiễm không khí."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nRecycling means turning old things into new things. We can recycle paper, glass and plastic. Recycling saves trees, water and energy.", "statements": ["a) Recycling makes new things from old ones.", "b) We cannot recycle glass.", "c) Recycling saves energy.", "d) Recycling wastes water."], "answer": ["T", "F", "T", "F"], "level": "NB", "explain": "Tái chế biến đồ cũ thành đồ mới, tiết kiệm cây, nước và năng lượng."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWhile the children were sleeping, their parents were packing bags for the camping trip. In the morning, the whole family went to the forest to enjoy nature.", "statements": ["a) The parents packed bags at night.", "b) The children helped their parents pack.", "c) The family went camping in the morning.", "d) They went to the beach."], "answer": ["T", "F", "T", "F"], "level": "TH", "explain": "Cha mẹ chuẩn bị đồ khi con ngủ; cả nhà đi rừng vào buổi sáng."}, {"type": "short", "q": "She (not listen) ____ to music at 8 last night; she was studying.", "answer": "wasn't listening", "level": "VDC", "explain": "Hành động đang diễn ra trong quá khứ ở thể phủ định: was not listening."}], "name": "Đề 6"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. five", "B. nice", "C. sing", "D. line"], "answer": "C", "level": "NB", "explain": "Từ sing phát âm âm i là /ɪ/, các từ còn lại là /aɪ/."}, {"type": "mcq", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. table", "B. land", "C. radio", "D. taste"], "answer": "B", "level": "TH", "explain": "Từ land phát âm âm a là /æ/, các từ còn lại là /eɪ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. reduce", "B. reuse", "C. protect", "D. waste"], "answer": "D", "level": "VDC", "explain": "waste nhấn âm 1, các từ còn lại nhấn âm 2."}, {"type": "mcq", "q": "Please put your ____ in the recycling bin.", "options": ["A. plastic bottles", "B. books", "C. pens", "D. shoes"], "answer": "A", "level": "NB", "explain": "Chai nhựa bỏ vào thùng tái chế là hợp lý nhất."}, {"type": "mcq", "q": "The government asks factories to cut down on ____ emissions.", "options": ["A. carbon", "B. oxygen", "C. water", "D. light"], "answer": "A", "level": "VD", "explain": "carbon emissions là khí thải các-bon, cần cắt giảm."}, {"type": "mcq", "q": "He ____ his homework when his friend called.", "options": ["A. was doing", "B. did", "C. does", "D. is doing"], "answer": "A", "level": "TH", "explain": "Hành động đang diễn ra (làm bài) thì bạn gọi điện: quá khứ tiếp diễn + quá khứ đơn."}, {"type": "mcq", "q": "Mai: Let's turn off the lights when we leave. — Nam: ____", "options": ["A. You're right. It saves electricity.", "B. I like the dark.", "C. The lights are bright.", "D. Turn them on."], "answer": "A", "level": "VD", "explain": "Đồng tình và nêu lợi ích tiết kiệm điện."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nLitter on the street looks ugly and smells bad. It can also make people sick. Everyone should put litter in bins.", "statements": ["a) Litter on the street looks nice.", "b) Litter can make people sick.", "c) We should put litter in bins.", "d) Litter has no smell."], "answer": ["F", "T", "T", "F"], "level": "NB", "explain": "Rác trên đường xấu xí, hôi và gây bệnh; cần bỏ vào thùng rác."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWhile Lan was riding to school, she saw rubbish along the road. She stopped and picked it up. Her teacher praised her in front of the class.", "statements": ["a) Lan saw rubbish on her way to school.", "b) She ignored the rubbish.", "c) She picked up the rubbish.", "d) Her teacher praised her."], "answer": ["T", "F", "T", "T"], "level": "TH", "explain": "Lan nhặt rác trên đường đi học và được cô giáo khen."}, {"type": "short", "q": "At this time yesterday, we (clean) ____ the classroom.", "answer": "were cleaning", "level": "VDC", "explain": "Dấu hiệu at this time yesterday: hành động đang diễn ra trong quá khứ, chủ ngữ we dùng were."}], "name": "Đề 7"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. face", "B. hand", "C. game", "D. train"], "answer": "B", "level": "NB", "explain": "Từ hand phát âm âm a là /æ/, các từ còn lại là /eɪ/."}, {"type": "mcq", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. kind", "B. visit", "C. mind", "D. fine"], "answer": "B", "level": "TH", "explain": "Từ visit phát âm âm i là /ɪ/, các từ còn lại là /aɪ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. machine", "B. plastic", "C. reduce", "D. protect"], "answer": "B", "level": "VDC", "explain": "plastic nhấn âm 1, các từ còn lại nhấn âm 2."}, {"type": "mcq", "q": "We should save ____ because we need it to live.", "options": ["A. water", "B. money", "C. time", "D. cars"], "answer": "A", "level": "NB", "explain": "Con người cần nước để sống, vì vậy phải tiết kiệm nước."}, {"type": "mcq", "q": "Using ____ bags instead of plastic ones is good for the earth.", "options": ["A. reusable", "B. expensive", "C. new", "D. old"], "answer": "A", "level": "VD", "explain": "reusable bags là túi tái sử dụng, tốt cho trái đất."}, {"type": "mcq", "q": "____ they waiting for the bus at 7 a.m.?", "options": ["A. Were", "B. Are", "C. Did", "D. Do"], "answer": "A", "level": "TH", "explain": "Câu hỏi về hành động đang diễn ra trong quá khứ: Were + they + V-ing."}, {"type": "mcq", "q": "Ba: Why is the river dirty? — An: ____", "options": ["A. Because people throw waste into it.", "B. Rivers are long.", "C. I like swimming.", "D. The river is near my house."], "answer": "A", "level": "VD", "explain": "Trả lời đúng câu hỏi why bằng nguyên nhân gây ô nhiễm sông."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nThe 3Rs are reduce, reuse and recycle. Reduce means using less. Reuse means using things again. Recycle means making new things from old ones.", "statements": ["a) The 3Rs help protect the environment.", "b) Reduce means using more things.", "c) Reuse means using things again.", "d) Recycle means throwing things away."], "answer": ["T", "F", "T", "F"], "level": "NB", "explain": "3R gồm giảm thiểu, tái sử dụng và tái chế; chú ý nghĩa từng từ."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWhile the scientists were studying the forest, they found a new species of frog. It was very small and green. They took photos and wrote a report about it.", "statements": ["a) The scientists found a new frog species.", "b) The frog was big and brown.", "c) They took photos of the frog.", "d) They ignored the frog."], "answer": ["T", "F", "T", "F"], "level": "TH", "explain": "Chú ý chi tiết: con ếch rất nhỏ và màu xanh, không phải to và nâu."}, {"type": "short", "q": "We (plant) ____ trees when it started to rain.", "answer": "were planting", "level": "VDC", "explain": "Hành động đang diễn ra (trồng cây) thì trời mưa: quá khứ tiếp diễn."}], "name": "Đề 8"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. nine", "B. sit", "C. rice", "D. bike"], "answer": "B", "level": "NB", "explain": "Từ sit phát âm âm i là /ɪ/, các từ còn lại là /aɪ/."}, {"type": "mcq", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. great", "B. hate", "C. snake", "D. apple"], "answer": "D", "level": "TH", "explain": "Từ apple phát âm âm a là /æ/, các từ còn lại là /eɪ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. protect", "B. nature", "C. reduce", "D. reuse"], "answer": "B", "level": "VDC", "explain": "nature nhấn âm 1, các từ còn lại nhấn âm 2."}, {"type": "mcq", "q": "Many ____ die when forests are cut down.", "options": ["A. animals", "B. cars", "C. houses", "D. books"], "answer": "A", "level": "NB", "explain": "Động vật chết khi rừng bị chặt phá, hợp ngữ cảnh nhất."}, {"type": "mcq", "q": "A ____ is a gas that keeps the Earth warm, like carbon dioxide.", "options": ["A. greenhouse gas", "B. clean gas", "C. fresh air", "D. cool wind"], "answer": "A", "level": "VD", "explain": "greenhouse gas là khí nhà kính, giữ ấm cho trái đất."}, {"type": "mcq", "q": "My mother ____ dinner while my father was washing the dishes.", "options": ["A. was cooking", "B. cooked", "C. cooks", "D. is cooking"], "answer": "A", "level": "TH", "explain": "Hai hành động song song trong quá khứ: while + quá khứ tiếp diễn."}, {"type": "mcq", "q": "Lan: Can we reuse these bottles? — Hoa: ____", "options": ["A. Sure, we can use them to water plants.", "B. No, they are bottles.", "C. Bottles are green.", "D. Throw them away."], "answer": "A", "level": "VD", "explain": "Đồng ý và đưa ra cách tái sử dụng cụ thể."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nCars give off smoke that pollutes the air. Riding a bike or walking is better for the environment. Buses and trains also help reduce air pollution.", "statements": ["a) Car smoke pollutes the air.", "b) Riding a bike is bad for the environment.", "c) Walking is good for the air.", "d) Buses and trains help reduce pollution."], "answer": ["T", "F", "T", "T"], "level": "NB", "explain": "Đi xe đạp, đi bộ, xe buýt và tàu hỏa giúp giảm ô nhiễm không khí."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWhile they were hiking in the mountains, the students saw a lot of wild flowers. They took photos but did not pick any flowers. They wanted to keep nature beautiful.", "statements": ["a) The students picked many wild flowers.", "b) They took photos of the flowers.", "c) They were hiking in the mountains.", "d) They wanted to protect nature."], "answer": ["F", "T", "T", "T"], "level": "TH", "explain": "Họ chỉ chụp ảnh, không hái hoa để giữ thiên nhiên đẹp."}, {"type": "short", "q": "The air in big cities is (serious) ____ polluted.", "answer": "seriously", "level": "VDC", "explain": "Cần trạng từ bổ nghĩa cho tính từ polluted: seriously."}], "name": "Đề 9"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. day", "B. say", "C. party", "D. May"], "answer": "C", "level": "NB", "explain": "Từ party phát âm âm a là /ɑː/, các từ còn lại là /eɪ/."}, {"type": "mcq", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. live", "B. like", "C. nice", "D. smile"], "answer": "A", "level": "TH", "explain": "Từ live phát âm âm i là /ɪ/, các từ còn lại là /aɪ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. reduce", "B. polluted", "C. rubbish", "D. protect"], "answer": "C", "level": "VDC", "explain": "rubbish nhấn âm 1, các từ còn lại nhấn âm 2."}, {"type": "mcq", "q": "Turn off the tap to save ____.", "options": ["A. water", "B. paper", "C. money", "D. time"], "answer": "A", "level": "NB", "explain": "Khóa vòi nước để tiết kiệm nước."}, {"type": "mcq", "q": "The panda's ____ is the bamboo forest.", "options": ["A. habitat", "B. house", "C. school", "D. shop"], "answer": "A", "level": "VD", "explain": "habitat là môi trường sống tự nhiên của gấu trúc."}, {"type": "mcq", "q": "She ____ to music when I came in.", "options": ["A. was listening", "B. listened", "C. listens", "D. is listening"], "answer": "A", "level": "TH", "explain": "Hành động đang diễn ra (nghe nhạc) thì tôi bước vào: quá khứ tiếp diễn + quá khứ đơn."}, {"type": "mcq", "q": "Teacher: What did you do to protect the environment? — Student: ____", "options": ["A. I planted trees and cleaned the park.", "B. I watched TV.", "C. I played games.", "D. I slept late."], "answer": "A", "level": "VD", "explain": "Trả lời đúng câu hỏi về hành động bảo vệ môi trường đã làm."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nForests are called the lungs of the Earth. They take in carbon dioxide and give out oxygen. We must stop cutting down forests.", "statements": ["a) Forests give out oxygen.", "b) Forests take in oxygen.", "c) We should stop cutting down forests.", "d) Forests are important for the Earth."], "answer": ["T", "F", "T", "T"], "level": "NB", "explain": "Rừng là lá phổi của trái đất: hấp thụ CO2, thải ô-xi."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWhile Tom was fishing by the river, he saw a turtle stuck in a plastic bag. He quickly saved it and threw the bag into the bin. Tom learned an important lesson that day.", "statements": ["a) Tom was fishing by the river.", "b) A turtle was stuck in a plastic bag.", "c) Tom left the turtle there.", "d) Tom threw the bag into the river."], "answer": ["T", "T", "F", "F"], "level": "TH", "explain": "Tom cứu con rùa và bỏ túi nhựa vào thùng rác, không phải xuống sông."}, {"type": "short", "q": "If we (not protect) ____ the environment, many species will disappear.", "answer": "don't protect", "level": "VDC", "explain": "Câu điều kiện loại 1: If + hiện tại đơn; chủ ngữ we dùng do not."}], "name": "Đề 10"}]}
