{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. after", "B. about", "C. ago", "D. above"], "answer": "A", "explain": "'a' trong about, ago, above đọc là /ə/, còn trong after đọc là /ɑː/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'o' is pronounced differently from the others.", "options": ["A. village", "B. ticket", "C. dinner", "D. woman"], "answer": "D", "explain": "'i' trong village, ticket, dinner đọc là /ɪ/, còn 'o' trong woman đọc là /ʊ/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. village", "B. harvest", "C. again", "D. country"], "answer": "C", "explain": "again có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "___ is the time when farmers cut and gather their crops.", "options": ["A. Midnight", "B. Harvest", "C. Spring", "D. Winter"], "answer": "B", "explain": "Harvest (vụ thu hoạch) là thời điểm nông dân gặt hái."}, {"type": "mcq", "level": "TH", "q": "The fields stretch as far as the eye can see; they are ___.", "options": ["A. vast", "B. tiny", "C. narrow", "D. small"], "answer": "A", "explain": "vast (mênh mông, rộng lớn) hợp nghĩa: cánh đồng trải dài tít tắp."}, {"type": "mcq", "level": "VD", "q": "The city is ___ than the countryside.", "options": ["A. noisy", "B. most noisy", "C. more noisy", "D. noisier"], "answer": "D", "explain": "Tính từ ngắn noisy tận cùng -y thành noisier + than."}, {"type": "mcq", "level": "TH", "q": "A: \"Have you ever been to the countryside?\" - B: \"___\"", "options": ["A. I hate the countryside.", "B. Never ask me that.", "C. Yes, I visited my grandparents' village last summer.", "D. No, I dislike villages."], "answer": "C", "explain": "Trả lời câu hỏi Yes/No về trải nghiệm một cách tự nhiên, đầy đủ."}, {"type": "truefalse", "level": "NB", "q": "My grandparents live in a small village. Their house is next to vast paddy fields. Every morning, my grandfather goes to the fields while my grandmother feeds the chickens. I love visiting them in summer.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The writer's grandparents live in a village.", "b) Their house is far from the paddy fields.", "c) The grandfather works in the fields in the morning.", "d) The grandmother feeds the ducks."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai (nhà ngay cạnh đồng lúa). c) Đúng (mỗi sáng ra đồng). d) Sai (cho gà ăn, không phải vịt)."}, {"type": "truefalse", "level": "VDC", "q": "My grandfather says the countryside has changed a lot. When he was young, there were no machines, no phones, and no electricity. People worked harder, but they were happy. Now life is easier, yet he thinks people talk to each other less.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The grandfather dislikes all modern things.", "b) People in the past worked harder.", "c) Modern life has some disadvantages.", "d) The grandfather never uses a phone."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai (ông chỉ nhận xét, không ghét mọi thứ hiện đại). b) Đúng. c) Đúng (mọi người ít trò chuyện hơn — suy ra). d) Sai (bài không nói vậy)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: The city is ___ (noisy) than the village.", "answer": "noisier", "explain": "Tính từ ngắn noisy: đổi -y thành -ier + than."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. happen", "B. better", "C. father", "D. apple"], "answer": "D", "explain": "'a' trong happen, better, father đọc là /ə/, còn trong apple đọc là /æ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'u' is pronounced differently from the others.", "options": ["A. business", "B. build", "C. buy", "D. busy"], "answer": "C", "explain": "'u' trong busy, business, build đọc là /ɪ/, còn trong buy đọc là /aɪ/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. peaceful", "B. collect", "C. cattle", "D. paddy"], "answer": "B", "explain": "collect có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "Cows, buffaloes and oxen are called ___.", "options": ["A. cattle", "B. poultry", "C. insects", "D. pets"], "answer": "A", "explain": "cattle là danh từ chỉ gia súc (trâu, bò...)."}, {"type": "mcq", "level": "TH", "q": "\"The children helped their parents ___ the rice onto the truck.\"", "options": ["A. plant", "B. cook", "C. paint", "D. load"], "answer": "D", "explain": "load (chất, bốc lên xe) hợp nghĩa nhất."}, {"type": "mcq", "level": "VD", "q": "Buffaloes are ___ than cows.", "options": ["A. more strong", "B. strongest", "C. stronger", "D. strong"], "answer": "C", "explain": "Tính từ ngắn strong + -er + than."}, {"type": "mcq", "level": "TH", "q": "A: \"What is life in the countryside like?\" - B: \"___\"", "options": ["A. It's terrible there.", "B. It's peaceful and the air is fresh.", "C. It's noisy and crowded.", "D. I dislike the countryside."], "answer": "B", "explain": "Miêu tả cuộc sống nông thôn: yên bình, không khí trong lành."}, {"type": "truefalse", "level": "NB", "q": "Harvest time is the busiest time in my village. Everyone helps cut the rice and carry it home. The children bring water to the workers. In the evening, people gather and share a big meal together.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Harvest time is very busy.", "b) Only old people work at harvest time.", "c) Children help by bringing water.", "d) People eat alone in the evening."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng (busiest time). b) Sai (mọi người cùng giúp). c) Đúng. d) Sai (cùng ăn bữa tối chung)."}, {"type": "truefalse", "level": "VDC", "q": "Tourists love visiting our village because it is peaceful and beautiful. But too many tourists can cause problems. They leave litter and make the village noisy. The villagers want tourists to respect their home.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Tourists bring only good things to the village.", "b) The villagers dislike all visitors.", "c) Villagers ask tourists to protect the environment.", "d) The village is attractive to visitors."], "answer": ["F", "F", "T", "T"], "explain": "a) Sai (đông khách gây ồn ào, rác). b) Sai (chỉ mong khách tôn trọng). c) Đúng (không xả rác, giữ yên tĩnh). d) Đúng (khách thích đến thăm)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: This field is ___ (wide) than that one.", "answer": "wider", "explain": "Tính từ ngắn wide + -r + than (tận cùng -e chỉ thêm -r)."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. tractor", "B. actor", "C. packet", "D. doctor"], "answer": "C", "explain": "'a/o' trong doctor, tractor, actor đọc là /ə/, còn 'a' trong packet đọc là /æ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'e' is pronounced differently from the others.", "options": ["A. seven", "B. even", "C. pretty", "D. eleven"], "answer": "B", "explain": "'e' trong pretty, eleven, seven đọc là /ɪ/, còn trong even đọc là /iː/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. behind", "B. farmer", "C. tractor", "D. orchard"], "answer": "A", "explain": "behind có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "A ___ is a building where farmers keep hay and animals.", "options": ["A. cottage", "B. tower", "C. bridge", "D. barn"], "answer": "D", "explain": "barn là kho thóc / chuồng trại của nông dân."}, {"type": "mcq", "level": "TH", "q": "Choose the word CLOSEST in meaning to \"peaceful\".", "options": ["A. hot and dry", "B. dark and cold", "C. quiet and calm", "D. noisy and busy"], "answer": "C", "explain": "peaceful (yên bình) gần nghĩa nhất với quiet and calm."}, {"type": "mcq", "level": "VD", "q": "Life in the countryside is ___ peaceful than in the city.", "options": ["A. many", "B. more", "C. most", "D. much"], "answer": "B", "explain": "peaceful là tính từ dài nên dùng more + peaceful + than."}, {"type": "mcq", "level": "TH", "q": "A: \"Would you like to live in the countryside?\" - B: \"___\"", "options": ["A. Yes, I'd love to.", "B. No way, I hate it.", "C. I dislike villages.", "D. Never, it's boring."], "answer": "A", "explain": "Đồng ý với lời hỏi một cách tích cực: 'Yes, I'd love to.'"}, {"type": "truefalse", "level": "NB", "q": "A buffalo is the most important animal on our farm. It helps my father plough the fields. It is strong and works hard all day. In the evening, we let it rest and eat hay.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The buffalo helps plough the fields.", "b) The buffalo is weak and lazy.", "c) The buffalo eats hay in the evening.", "d) The family has no buffalo."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng (giúp cày ruộng). b) Sai (khỏe và chăm chỉ). c) Đúng. d) Sai (trâu là con vật quan trọng nhất)."}, {"type": "truefalse", "level": "VDC", "q": "Some people say country children are luckier than city children. They have vast fields to run in and clean air to breathe. They learn about nature by living in it. However, they have fewer schools and hospitals than city children.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The writer thinks country children have no advantages.", "b) Country children learn about nature directly.", "c) City children have better services.", "d) Both groups of children have exactly the same life."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai (tác giả nêu nhiều lợi thế). b) Đúng (học về thiên nhiên qua cuộc sống). c) Đúng (ít trường học, bệnh viện hơn — suy ra). d) Sai."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: Life here is ___ (peaceful) than in the city.", "answer": "more peaceful", "explain": "Tính từ dài peaceful dùng more + peaceful + than."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. woman", "B. garden", "C. banana", "D. happen"], "answer": "B", "explain": "'a' trong banana, happen, woman đọc là /ə/, còn trong garden đọc là /ɑː/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. minute", "B. invite", "C. divide", "D. decide"], "answer": "A", "explain": "'i' trong invite, divide, decide đọc là /aɪ/, còn trong minute đọc là /ɪ/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. cottage", "B. dairy", "C. garden", "D. bamboo"], "answer": "D", "explain": "bamboo có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "Farmers grow fruit trees in an ___.", "options": ["A. cottage", "B. market", "C. orchard", "D. barn"], "answer": "C", "explain": "orchard là vườn cây ăn quả."}, {"type": "mcq", "level": "TH", "q": "After a busy week in the city, they enjoyed the ___ life in the village.", "options": ["A. noisy", "B. slow-paced", "C. fast-paced", "D. modern"], "answer": "B", "explain": "slow-paced (nhịp sống chậm rãi) đối lập với tuần bận rộn ở thành phố."}, {"type": "mcq", "level": "VD", "q": "This river is ___ than that one.", "options": ["A. wider", "B. more wide", "C. widest", "D. wide"], "answer": "A", "explain": "Tính từ ngắn wide + -r + than."}, {"type": "mcq", "level": "TH", "q": "A: \"Let's help the farmers harvest rice this weekend!\" - B: \"___\"", "options": ["A. I hate farmers.", "B. Harvesting is boring.", "C. No, I dislike helping.", "D. Sounds great!"], "answer": "D", "explain": "Hưởng ứng lời rủ: 'Sounds great!' (Nghe tuyệt đấy!)."}, {"type": "truefalse", "level": "NB", "q": "There is a small orchard behind our house. We grow oranges, mangoes, and bananas there. In summer, the fruits are ripe and sweet. My mother sells them at the village market.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The orchard is in front of the house.", "b) They grow different kinds of fruit.", "c) The fruits are ripe in summer.", "d) The family buys fruit at the market."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai (vườn sau nhà). b) Đúng (cam, xoài, chuối). c) Đúng. d) Sai (nhà bán trái cây ở chợ)."}, {"type": "truefalse", "level": "VDC", "q": "The harvest festival is the happiest time of the year in our village. People wear new clothes and cook special food. They thank the gods for a good harvest. Children love the festival because they get gifts and play games all day.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The festival happens after the harvest.", "b) People show thanks during the festival.", "c) Children dislike the festival.", "d) The festival is a sad event."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng (lễ hội sau vụ thu hoạch — suy ra từ tên gọi). b) Đúng (tạ ơn thần linh). c) Sai (trẻ em rất thích). d) Sai (thời điểm vui nhất trong năm)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: Buffaloes are ___ (strong) than cows.", "answer": "stronger", "explain": "Tính từ ngắn strong + -er + than."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'o' is pronounced differently from the others.", "options": ["A. collect", "B. village", "C. cottage", "D. image"], "answer": "A", "explain": "'a/i' trong village, cottage, image đọc là /ɪ/, còn 'o' trong collect đọc là /ə/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'a' is pronounced differently from the others.", "options": ["A. guitar", "B. agree", "C. again", "D. garden"], "answer": "D", "explain": "'a' trong guitar, agree, again đọc là /ə/, còn trong garden đọc là /ɑː/ nên khác."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. basket", "B. donkey", "C. machine", "D. buffalo"], "answer": "C", "explain": "machine có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "Dried grass used as food for animals is ___.", "options": ["A. wheat", "B. hay", "C. rice", "D. corn"], "answer": "B", "explain": "hay (cỏ khô) là thức ăn cho gia súc."}, {"type": "mcq", "level": "TH", "q": "\"The farmer ___ the cows to the field every morning.\"", "options": ["A. herds", "B. milks", "C. paints", "D. washes"], "answer": "A", "explain": "herd (chăn dắt) hợp nghĩa: lùa bò ra đồng mỗi sáng."}, {"type": "mcq", "level": "VD", "q": "Her house is ___ than mine.", "options": ["A. big", "B. more big", "C. biggest", "D. bigger"], "answer": "D", "explain": "Tính từ ngắn big gấp đôi phụ âm cuối + -er: bigger + than."}, {"type": "mcq", "level": "TH", "q": "A: \"Do you prefer the city or the countryside?\" - B: \"___\"", "options": ["A. I dislike questions.", "B. Neither, I prefer nothing.", "C. I prefer the countryside because it's quiet.", "D. I hate both places."], "answer": "C", "explain": "Trả lời câu hỏi lựa chọn kèm lý do một cách tự nhiên."}, {"type": "truefalse", "level": "NB", "q": "Life in the countryside is different from life in the city. There are no tall buildings or busy streets. People know each other well and often help their neighbours. Children play freely in the fields.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The countryside has many tall buildings.", "b) People in the village help each other.", "c) Children have little space to play.", "d) Country life is different from city life."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai (không có nhà cao tầng). b) Đúng (thường giúp đỡ hàng xóm). c) Sai (chơi thoải mái trên đồng). d) Đúng."}, {"type": "truefalse", "level": "VDC", "q": "A paddy field looks different in each season. In spring, it is bright green with young rice. In summer, it turns golden when the rice is ripe. After harvest, it becomes brown and empty, waiting for the next season.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Paddy fields never change colour.", "b) The field is golden before harvest.", "c) The field stays empty forever after harvest.", "d) Each season gives the field a different look."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai (thay đổi theo mùa). b) Đúng (vàng óng khi lúa chín). c) Sai (chỉ chờ vụ mùa tiếp theo). d) Đúng (ý chính của bài)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: His house is ___ (big) than mine.", "answer": "bigger", "explain": "Tính từ ngắn big: gấp đôi phụ âm cuối + -er."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'e' is pronounced differently from the others.", "options": ["A. sister", "B. picture", "C. mother", "D. river"], "answer": "D", "explain": "'e' trong sister, picture, mother đọc là /ə/, còn 'i' trong river đọc là /ɪ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. alike", "B. arrive", "C. village", "D. alive"], "answer": "C", "explain": "'i' trong alive, alike, arrive đọc là /aɪ/, còn trong village đọc là /ɪ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. harvest", "B. afternoon", "C. countryside", "D. grandmother"], "answer": "B", "explain": "afternoon có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "A ___ is a small house in the countryside.", "options": ["A. cottage", "B. castle", "C. hotel", "D. factory"], "answer": "A", "explain": "cottage là ngôi nhà nhỏ ở nông thôn."}, {"type": "mcq", "level": "TH", "q": "\"A ___ is a person who grows crops and keeps animals.\"", "options": ["A. teacher", "B. doctor", "C. driver", "D. farmer"], "answer": "D", "explain": "farmer (nông dân) là người trồng trọt, chăn nuôi."}, {"type": "mcq", "level": "VD", "q": "The air in the village is ___ than in the city.", "options": ["A. more fresh", "B. freshest", "C. fresher", "D. fresh"], "answer": "C", "explain": "Tính từ ngắn fresh + -er + than."}, {"type": "mcq", "level": "VD", "q": "A: \"I'm going to my uncle's farm this weekend.\" - B: \"___\"", "options": ["A. Farms are boring.", "B. Lucky you! Have a great time.", "C. That's terrible.", "D. I don't care."], "answer": "B", "explain": "Chúc bạn vui vẻ một cách thân thiện: 'Lucky you! Have a great time.'"}, {"type": "truefalse", "level": "VD", "q": "Many young people leave the countryside to work in cities. They think city life is more exciting. However, some of them return after a few years. They miss the fresh air, the quiet nights, and the warm hearts of villagers.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) All young people stay in the countryside.", "b) Some young people miss village life after leaving.", "c) City life attracts young villagers.", "d) Villagers are unfriendly."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai (nhiều người rời quê lên phố). b) Đúng (nhớ quê sau vài năm). c) Đúng (cho rằng phố thú vị hơn). d) Sai (người làng ấm áp, thân thiện)."}, {"type": "truefalse", "level": "VDC", "q": "My father wakes up at 5 a.m. every day, even in winter. He says farmers cannot be lazy because plants and animals depend on them. I admire his hard work, and I want to be like him when I grow up.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The father is a lazy farmer.", "b) The child respects the father's work.", "c) Farmers' work affects plants and animals.", "d) The child wants to leave the farm."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai (dậy từ 5 giờ sáng). b) Đúng (ngưỡng mộ sự chăm chỉ). c) Đúng (cây trồng, vật nuôi phụ thuộc vào nông dân). d) Sai (muốn giống bố khi lớn lên)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: Tom runs ___ (fast) than his brother.", "answer": "faster", "explain": "Tính từ ngắn fast + -er + than."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'e' is pronounced differently from the others.", "options": ["A. city", "B. happy", "C. better", "D. busy"], "answer": "C", "explain": "'u/i/y' trong busy, city, happy đọc là /ɪ/, còn 'e' trong better đọc là /ə/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'ough' is pronounced differently from the others.", "options": ["A. rough", "B. through", "C. enough", "D. tough"], "answer": "B", "explain": "'ough' trong enough, tough, rough đọc là /ʌ/, còn trong through đọc là /uː/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. asleep", "B. peaceful", "C. friendly", "D. quiet"], "answer": "A", "explain": "asleep có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "The countryside is ___, with clean air and little noise.", "options": ["A. noisy", "B. crowded", "C. polluted", "D. peaceful"], "answer": "D", "explain": "peaceful (yên bình) hợp nghĩa với không khí sạch, ít ồn ào."}, {"type": "mcq", "level": "TH", "q": "\"They ___ rice in June and harvest it in October.\"", "options": ["A. sell", "B. cook", "C. plant", "D. eat"], "answer": "C", "explain": "plant (trồng) rồi mới harvest (thu hoạch): đúng quy trình."}, {"type": "mcq", "level": "VD", "q": "Today is ___ than yesterday.", "options": ["A. hottest", "B. hotter", "C. hot", "D. more hot"], "answer": "B", "explain": "Tính từ ngắn hot gấp đôi phụ âm cuối + -er: hotter + than."}, {"type": "mcq", "level": "VD", "q": "A: \"The countryside is so boring. There's nothing to do.\" - B: \"___\"", "options": ["A. I don't think so. There are lots of interesting activities.", "B. You are right, it's boring.", "C. I agree, let's leave.", "D. Yes, nothing is fun there."], "answer": "A", "explain": "Phản đối ý kiến một cách lịch sự: 'I don't think so...' (Tôi không nghĩ vậy...)."}, {"type": "truefalse", "level": "VD", "q": "In the past, farmers used buffaloes to plough their fields. Today, many farmers use machines called tractors. Tractors work faster and save time. But some old farmers still prefer buffaloes because machines are expensive.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Farmers never used buffaloes in the past.", "b) Tractors help farmers save time.", "c) All farmers now use tractors.", "d) Some farmers can't afford machines."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai (xưa dùng trâu cày). b) Đúng (máy làm nhanh, tiết kiệm thời gian). c) Sai (một số nông dân già vẫn thích trâu). d) Đúng (máy móc đắt đỏ — suy ra)."}, {"type": "truefalse", "level": "VDC", "q": "Buffaloes and cows both give us milk and help on the farm. However, buffaloes are stronger and can work in muddy fields. Cows are gentler and give more milk. Each animal has its own value to farmers.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Buffaloes and cows are useless to farmers.", "b) Buffaloes work better in wet fields.", "c) Cows produce more milk than buffaloes.", "d) Farmers should keep only one kind of animal."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai (cả hai đều có ích). b) Đúng (trâu khỏe, làm được ở ruộng lầy). c) Đúng (bò hiền và cho nhiều sữa hơn). d) Sai (mỗi loài có giá trị riêng)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: The Mekong River is ___ (long) than the Red River.", "answer": "longer", "explain": "Tính từ ngắn long + -er + than."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. chicken", "B. behind", "C. listen", "D. visit"], "answer": "B", "explain": "'i' trong listen, visit, chicken đọc là /ɪ/, còn trong behind đọc là /aɪ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'o' is pronounced differently from the others.", "options": ["A. both", "B. mother", "C. other", "D. brother"], "answer": "A", "explain": "'o' trong mother, other, brother đọc là /ʌ/, còn trong both đọc là /əʊ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. unload", "B. repeat", "C. return", "D. farmer"], "answer": "D", "explain": "farmer có trọng âm rơi vào âm tiết thứ 1, các từ còn lại nhấn âm tiết thứ 2."}, {"type": "mcq", "level": "NB", "q": "A large farm tool pulled by buffaloes to turn the soil is a ___.", "options": ["A. rope", "B. ladder", "C. plough", "D. basket"], "answer": "C", "explain": "plough (cái cày) là nông cụ do trâu kéo để xới đất."}, {"type": "mcq", "level": "TH", "q": "\"Farmers get up ___ to work in the fields.\"", "options": ["A. angrily", "B. early", "C. late", "D. slowly"], "answer": "B", "explain": "Nông dân dậy sớm (early) ra đồng làm việc."}, {"type": "mcq", "level": "VD", "q": "This road is ___ and ___ than the old one.", "options": ["A. longer, wider", "B. more long, more wide", "C. longest, widest", "D. long, wide"], "answer": "A", "explain": "long và wide là tính từ ngắn: longer, wider + than."}, {"type": "mcq", "level": "VD", "q": "A: \"Could you show me how to milk a cow?\" - B: \"___\"", "options": ["A. No way, never.", "B. I dislike cows.", "C. Don't bother me.", "D. Sure. It's easier than you think."], "answer": "D", "explain": "Đồng ý giúp đỡ vui vẻ: 'Sure. It's easier than you think.'"}, {"type": "truefalse", "level": "VD", "q": "The dairy farm near my house has over a hundred cows. Workers milk the cows twice a day, in the morning and in the evening. The fresh milk is taken to the city every day. Children in the city drink this milk.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The farm keeps a lot of cows.", "b) Cows are milked once a day.", "c) The milk goes to the city daily.", "d) The farm sells milk only in the village."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng (hơn 100 con bò). b) Sai (vắt sữa 2 lần/ngày). c) Đúng (chở sữa lên thành phố mỗi ngày). d) Sai."}, {"type": "truefalse", "level": "VDC", "q": "The village market opens only on Sundays. People from nearby villages come to buy and sell things. It is not just a place to shop - it is where people meet, talk, and share news. The market is the heart of village life.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The market opens every day.", "b) The market is important for social life.", "c) People only buy things at the market.", "d) The writer compares the market to a heart."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai (chỉ mở Chủ nhật). b) Đúng (nơi gặp gỡ, trò chuyện). c) Sai (còn là nơi giao lưu). d) Đúng (trái tim của đời sống làng quê)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: Today is ___ (hot) than yesterday.", "answer": "hotter", "explain": "Tính từ ngắn hot: gấp đôi phụ âm cuối + -er."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. machine", "B. children", "C. chicken", "D. kitchen"], "answer": "A", "explain": "'i' trong children, chicken, kitchen đọc là /ɪ/, còn trong machine đọc là /iː/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'o' is pronounced differently from the others.", "options": ["A. come", "B. some", "C. love", "D. home"], "answer": "D", "explain": "'o' trong come, some, love đọc là /ʌ/, còn trong home đọc là /əʊ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. feeding", "B. milking", "C. prefer", "D. herding"], "answer": "C", "explain": "prefer có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "___ fields are where farmers grow rice.", "options": ["A. Flower", "B. Paddy", "C. Corn", "D. Wheat"], "answer": "B", "explain": "Paddy fields (ruộng lúa) là nơi trồng lúa."}, {"type": "mcq", "level": "TH", "q": "\"Children in the village love ___ kites on the dyke.\"", "options": ["A. flying", "B. to flying", "C. fly", "D. flew"], "answer": "A", "explain": "Sau love dùng V-ing: love flying kites (thả diều)."}, {"type": "mcq", "level": "VD", "q": "Tom is ___ at football than his brother.", "options": ["A. good", "B. more good", "C. best", "D. better"], "answer": "D", "explain": "good là tính từ bất quy tắc: good thành better + than."}, {"type": "mcq", "level": "VD", "q": "A: \"Our village is more beautiful than yours.\" - B: \"___\"", "options": ["A. You are wrong.", "B. I don't think so.", "C. I agree. Your village is really lovely.", "D. No, mine is better."], "answer": "C", "explain": "Đáp lại lời khen làng quê một cách lịch sự, khiêm tốn."}, {"type": "truefalse", "level": "VD", "q": "Cottage gardens in the countryside are full of flowers and vegetables. The owners grow what they eat, so the food is always fresh. They also share vegetables with their neighbours. A small garden can feed a whole family.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Cottage gardens provide fresh food.", "b) Villagers never share food with neighbours.", "c) A small garden is useless.", "d) The owners eat what they grow."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng (thực phẩm luôn tươi). b) Sai (chia sẻ rau với hàng xóm). c) Sai (vườn nhỏ nuôi được cả nhà). d) Đúng (trồng gì ăn nấy)."}, {"type": "truefalse", "level": "VDC", "q": "In the countryside, neighbours treat each other like family. When someone is sick, others come to help. When there is a wedding, the whole village celebrates. This close bond is something money cannot buy.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Villagers care little about each other.", "b) Neighbours support each other in difficult times.", "c) Village celebrations involve the whole community.", "d) Money can buy the village bond."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai (coi nhau như gia đình). b) Đúng (giúp nhau khi ốm đau). c) Đúng (cả làng cùng vui). d) Sai (tiền không mua được tình làng nghĩa xóm)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: Her village is ___ (beautiful) than ours.", "answer": "more beautiful", "explain": "Tính từ dài beautiful dùng more + beautiful + than."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. sit", "B. milk", "C. pig", "D. rice"], "answer": "D", "explain": "'i' trong sit, milk, pig đọc là /ɪ/, còn trong rice đọc là /aɪ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'o' is pronounced differently from the others.", "options": ["A. wonder", "B. front", "C. hotel", "D. son"], "answer": "C", "explain": "'o' trong son, wonder, front đọc là /ʌ/, còn trong hotel đọc là /əʊ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. peaceful", "B. expect", "C. natural", "D. culture"], "answer": "B", "explain": "expect có trọng âm rơi vào âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "Milk, cheese and butter are ___ products.", "options": ["A. dairy", "B. meat", "C. wooden", "D. plastic"], "answer": "A", "explain": "dairy products là các sản phẩm từ sữa."}, {"type": "mcq", "level": "TH", "q": "\"There is a ___ behind the house where they keep chickens.\"", "options": ["A. river", "B. desert", "C. factory", "D. garden"], "answer": "D", "explain": "garden (vườn) sau nhà là nơi nuôi gà hợp lý nhất."}, {"type": "mcq", "level": "VD", "q": "Which is ___: the Red River or the Mekong River?", "options": ["A. longest", "B. more long", "C. longer", "D. long"], "answer": "C", "explain": "So sánh hai con sông dùng so sánh hơn: longer."}, {"type": "mcq", "level": "VD", "q": "A: \"Thanks for showing us around your farm.\" - B: \"___\"", "options": ["A. You should pay me.", "B. You're welcome. Come back anytime.", "C. It's my farm, not yours.", "D. Don't come again."], "answer": "B", "explain": "Đáp lại lời cảm ơn lịch sự: 'You're welcome. Come back anytime.'"}, {"type": "truefalse", "level": "VD", "q": "Hay is dried grass that farmers store for winter. In winter, there is no fresh grass in the fields, so animals need hay to eat. Farmers cut grass in summer and dry it in the sun. A barn full of hay means the animals will not go hungry.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) Hay is food for animals in winter.", "b) Farmers make hay in winter.", "c) Animals eat fresh grass all year round.", "d) Storing hay helps farmers in cold months."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng (cỏ khô dự trữ cho mùa đông). b) Sai (cắt cỏ, phơi khô vào mùa hè). c) Sai (mùa đông không có cỏ tươi). d) Đúng (kho đầy cỏ khô thì vật nuôi không đói)."}, {"type": "truefalse", "level": "VDC", "q": "Climate change is affecting the countryside. The weather becomes strange: too much rain in some years, too little in others. Farmers find it harder to plan their crops. Scientists are helping them find new ways to farm.\n\nDecide whether the following statements are True (T) or False (F).", "statements": ["a) The weather is becoming unusual.", "b) Farmers find farming easier than before.", "c) Scientists are trying to help farmers.", "d) Climate change has no effect on farming."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng (thời tiết thất thường). b) Sai (khó lên kế hoạch mùa vụ hơn). c) Đúng (nhà khoa học giúp tìm cách canh tác mới). d) Sai (biến đổi khí hậu đang ảnh hưởng nông thôn)."}, {"type": "short", "level": "VDC", "q": "Complete the sentence with the correct form of the word in brackets: This story is ___ (interesting) than that one.", "answer": "more interesting", "explain": "Tính từ dài interesting dùng more + interesting + than."}]}]}
