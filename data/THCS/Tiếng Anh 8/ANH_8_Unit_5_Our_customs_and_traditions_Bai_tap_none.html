<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","q":"Choose the word in which the letter 'n' has a different pronunciation from the others.","options":["A. king","B. sing","C. fun","D. long"],"answer":"C","level":"NB","explain":"Các từ sing, long, king có 'ng' phát âm là /ŋ/ (sɪŋ, lɒŋ, kɪŋ), còn fun phát âm là /fʌn/ với âm /n/ nên khác."},{"type":"mcq","q":"Pick out the word whose 'n' sound is different from the others.","options":["A. moon","B. song","C. thin","D. green"],"answer":"B","level":"NB","explain":"Các từ thin, moon, green có âm /n/, còn song có 'ng' phát âm là /ŋ/ (sɒŋ) nên khác."},{"type":"mcq","q":"Choose the word with a different main stress from the others.","options":["A. lantern","B. gather","C. custom","D. tradition"],"answer":"D","level":"TH","explain":"Các từ custom, lantern, gather nhấn âm tiết 1, còn tradition nhấn âm tiết 2 (traˈdition) nên khác."},{"type":"mcq","q":"Tet is a special ___ when Vietnamese families get together and enjoy a big feast.","options":["A. custom","B. festival","C. ceremony","D. tradition"],"answer":"B","level":"NB","explain":"festival = lễ hội. Tết là lễ hội đặc biệt của người Việt."},{"type":"mcq","q":"People burn ___ to show respect to their ancestors on special days.","options":["A. lanterns","B. candles","C. flowers","D. incense"],"answer":"D","level":"TH","explain":"incense = hương (nhang). Đốt hương (burn incense) để tỏ lòng thành kính với tổ tiên."},{"type":"mcq","q":"Visitors ___ take off their shoes before entering the temple. It is a strict rule here.","options":["A. should","B. have to","C. shouldn't","D. don't have to"],"answer":"B","level":"VD","explain":"have to diễn tả nghĩa vụ, sự bắt buộc theo quy định; should chỉ là lời khuyên nên không đủ mạnh ở đây."},{"type":"mcq","q":"Mai: Should I wear ao dai to the ceremony? - Lan: ___","options":["A. \"Never mind.\"","B. \"Yes, that's a great idea.\"","C. \"I think so not.\"","D. \"No, you don't.\""],"answer":"B","level":"TH","explain":"Khi được hỏi xin lời khuyên, ta đáp đồng tình một cách lịch sự: Yes, that's a great idea."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). The Mid-Autumn Festival is a beloved tradition in Vietnam. It falls on the 15th day of the 8th lunar month. On this night, children parade with colourful lanterns and share mooncakes. Families gather to admire the bright full moon.","statements":["a) The Mid-Autumn Festival takes place in autumn.","b) It falls on the 15th day of the 8th solar month.","c) Children carry lanterns and eat mooncakes.","d) Families stay apart on this night."],"answer":["T","F","T","F"],"level":"VD","explain":"a) Đúng: lễ hội diễn ra vào mùa thu. b) Sai: là tháng 8 âm lịch (lunar), không phải dương lịch (solar). c) Đúng: trẻ em rước đèn và ăn bánh trung thu. d) Sai: các gia đình sum họp (gather), không ở riêng lẻ."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Ancestor worship is a deep-rooted custom in Vietnam. Many families keep an altar at home. They offer fruit, flowers and incense to their ancestors on special days. People believe their ancestors can protect the family.","statements":["a) Most Vietnamese families keep an altar for their ancestors.","b) People offer food and incense on special occasions.","c) Ancestor worship is a very new custom in Vietnam.","d) People think ancestors can bring protection to the family."],"answer":["T","T","F","T"],"level":"VDC","explain":"a) Đúng: nhiều gia đình có bàn thờ tổ tiên. b) Đúng: dâng hoa quả, hương vào dịp đặc biệt. c) Sai: đây là phong tục lâu đời (deep-rooted), không phải mới. d) Đúng: người ta tin tổ tiên phù hộ gia đình."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. The ___ (tradition) dances at the festival attracted many tourists.","answer":"traditional","level":"VDC","explain":"Trước danh từ 'dances' cần một tính từ; tradition (danh từ) chuyển thành traditional (tính từ)."}]},{"name":"Đề 2","questions":[{"type":"mcq","q":"Choose the word with a different pronunciation of the letter 'n'.","options":["A. sun","B. ring","C. spring","D. bring"],"answer":"A","level":"NB","explain":"Các từ spring, ring, bring có 'ng' phát âm là /ŋ/, còn sun phát âm là /sʌn/ với âm /n/ nên khác."},{"type":"mcq","q":"Which word has a different 'n' sound from the others?","options":["A. young","B. plane","C. nine","D. clean"],"answer":"A","level":"NB","explain":"Các từ nine, plane, clean có âm /n/, còn young có 'ng' phát âm là /ŋ/ (jʌŋ) nên khác."},{"type":"mcq","q":"Choose the word with its main stress on the second syllable.","options":["A. custom","B. respect","C. unity","D. lantern"],"answer":"B","level":"TH","explain":"respect nhấn âm tiết 2 (reˈspect); custom, lantern, unity đều nhấn âm tiết 1."},{"type":"mcq","q":"At Tet, children receive ___ money in small red envelopes.","options":["A. gold","B. lucky","C. happy","D. rich"],"answer":"B","level":"NB","explain":"lucky money = tiền lì xì, phong tục Tết của trẻ em."},{"type":"mcq","q":"The village ___ takes place every spring with folk games and traditional singing.","options":["A. festival","B. feast","C. custom","D. prayer"],"answer":"A","level":"TH","explain":"festival = lễ hội. Lễ hội làng diễn ra mỗi mùa xuân với trò chơi dân gian."},{"type":"mcq","q":"You ___ talk loudly in the pagoda. People are praying inside.","options":["A. should","B. shouldn't","C. don't have to","D. have to"],"answer":"B","level":"VD","explain":"shouldn't = không nên (lời khuyên). Không gian chùa trang nghiêm nên ta khuyên không nên nói to."},{"type":"mcq","q":"Nam: What should we bring to the festival? - Hoa: ___","options":["A. \"We should bring some fruit as offerings.\"","B. \"I don't like festivals.\"","C. \"No, we shouldn't.\"","D. \"See you later.\""],"answer":"A","level":"TH","explain":"Đáp lại câu hỏi xin lời khuyên bằng một gợi ý cụ thể và hợp lý: mang hoa quả làm lễ vật."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Banh chung is a traditional cake of Vietnam. People often make it before Tet. The cake is made of sticky rice, green beans and pork. Making banh chung is a chance for the whole family to gather.","statements":["a) Banh chung is made of sticky rice, green beans and pork.","b) People make banh chung after Tet.","c) Making banh chung brings the family together.","d) Banh chung is a kind of modern fast food."],"answer":["T","F","T","F"],"level":"VD","explain":"a) Đúng: nguyên liệu đúng như bài đọc. b) Sai: làm trước Tết (before Tet). c) Đúng: dịp để cả nhà sum họp. d) Sai: đây là bánh truyền thống, không phải fast food."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). The Hung Kings were the first kings of Vietnam. Every year, millions of people travel to Phu Tho to honour them. The worship of the Hung Kings shows the unity of the Vietnamese people. It became a national ceremony long ago.","statements":["a) The Hung Kings are regarded as the founders of Vietnam.","b) People visit Phu Tho to honour the Hung Kings.","c) This worship is a very recent custom.","d) The ceremony celebrates the unity of the nation."],"answer":["T","T","F","T"],"level":"VDC","explain":"a) Đúng: các Vua Hùng là những vị vua đầu tiên. b) Đúng: người dân về Phú Thọ hành lễ. c) Sai: đã thành quốc lễ từ lâu đời (long ago). d) Đúng: thể hiện tinh thần đoàn kết dân tộc."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. We should ___ (preservation) our beautiful traditions for future generations.","answer":"preserve","level":"VDC","explain":"Sau should là động từ nguyên thể; preservation (danh từ) chuyển thành preserve (động từ)."}]},{"name":"Đề 3","questions":[{"type":"mcq","q":"Find the word whose 'n' is pronounced differently from the others.","options":["A. wrong","B. thing","C. night","D. hang"],"answer":"C","level":"NB","explain":"Các từ hang, wrong, thing có 'ng' phát âm là /ŋ/, còn night phát âm là /naɪt/ với âm /n/ nên khác."},{"type":"mcq","q":"Choose the word where the letter 'n' sounds different from the others.","options":["A. name","B. green","C. long","D. one"],"answer":"C","level":"NB","explain":"Các từ one, name, green có âm /n/, còn long có 'ng' phát âm là /ŋ/ (lɒŋ) nên khác."},{"type":"mcq","q":"Pick the word with a different stress pattern from the others.","options":["A. respect","B. worship","C. celebrate","D. festival"],"answer":"A","level":"TH","explain":"Các từ worship, celebrate, festival nhấn âm tiết 1, còn respect nhấn âm tiết 2 (reˈspect) nên khác."},{"type":"mcq","q":"We ___ our ancestors by offering fruit and flowers on the family altar.","options":["A. obey","B. celebrate","C. gather","D. worship"],"answer":"D","level":"NB","explain":"worship = thờ cúng. Dâng lễ vật lên bàn thờ là cách thờ cúng tổ tiên."},{"type":"mcq","q":"The bride and groom wore beautiful ao dai at the traditional ___.","options":["A. old / custom","B. traditional / ceremony","C. red / party","D. modern / festival"],"answer":"B","level":"TH","explain":"traditional ceremony = nghi lễ truyền thống; cô dâu chú rể mặc áo dài trong lễ cưới truyền thống."},{"type":"mcq","q":"Students ___ learn about local customs at school. It helps them love their culture.","options":["A. shouldn't","B. should","C. don't have to","D. have to"],"answer":"B","level":"VD","explain":"should = nên (lời khuyên). Đây là điều tốt nên làm, không phải nghĩa vụ bắt buộc nên không dùng have to."},{"type":"mcq","q":"Teacher: You should arrive early for the ceremony. - Minh: ___","options":["A. \"Maybe not.\"","B. \"I don't think.\"","C. \"No, I won't.\"","D. \"Yes, I will.\""],"answer":"D","level":"TH","explain":"Đáp lại lời khuyên một cách lễ phép và tích cực: Yes, I will."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Lim Festival is a famous spring festival in Bac Ninh. It is known for quan ho folk songs. Young men and women sing to each other on boats. Thousands of visitors come to enjoy the music every year.","statements":["a) Lim Festival is famous for quan ho singing.","b) The festival is held in winter.","c) People sing quan ho on boats.","d) Few people visit the festival each year."],"answer":["T","F","T","F"],"level":"VD","explain":"a) Đúng: nổi tiếng với hát quan họ. b) Sai: lễ hội mùa xuân (spring). c) Đúng: hát trên thuyền. d) Sai: hàng nghìn du khách (thousands of visitors) đến mỗi năm."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). In a traditional Vietnamese wedding, the groom's family brings betel and areca to the bride's house. Betel and areca are symbols of love and marriage. The ceremony also includes asking for blessings from the ancestors. Today, many couples still keep these customs.","statements":["a) Betel and areca symbolise love and marriage.","b) The groom's family offers betel and areca to the bride's family.","c) The couple asks for the ancestors' blessings during the ceremony.","d) Modern couples have given up all the old wedding customs."],"answer":["T","T","T","F"],"level":"VDC","explain":"a) Đúng: trầu cau tượng trưng cho tình yêu, hôn nhân. b) Đúng: nhà trai mang trầu cau sang nhà gái. c) Đúng: xin phép tổ tiên trong lễ cưới. d) Sai: nhiều cặp đôi vẫn giữ các phong tục này."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. ___ (obey) your parents is an important value in Vietnamese families.","answer":"Obeying","level":"VDC","explain":"Đầu câu cần danh động từ (gerund) làm chủ ngữ; obey (động từ) chuyển thành obeying."}]},{"name":"Đề 4","questions":[{"type":"mcq","q":"Pick the word with a different 'n' pronunciation.","options":["A. sun","B. sing","C. run","D. fun"],"answer":"B","level":"NB","explain":"Các từ fun, sun, run có âm /n/, còn sing có 'ng' phát âm là /ŋ/ (sɪŋ) nên khác."},{"type":"mcq","q":"Which of these words has a different 'n' sound?","options":["A. pen","B. men","C. sing","D. ten"],"answer":"C","level":"NB","explain":"Các từ ten, pen, men có âm /n/, còn sing có 'ng' phát âm là /ŋ/ nên khác."},{"type":"mcq","q":"Choose the word with its main stress on the first syllable.","options":["A. incense","B. obey","C. respect","D. tradition"],"answer":"A","level":"TH","explain":"incense (danh từ: hương) nhấn âm tiết 1; respect, obey, tradition đều nhấn âm tiết 2."},{"type":"mcq","q":"The whole village ___ at the communal house for the spring festival.","options":["A. obeys","B. prays","C. worships","D. gathers"],"answer":"D","level":"NB","explain":"gather = tụ họp. Cả làng tụ họp tại đình làng dự lễ hội xuân."},{"type":"mcq","q":"Children should ___ their grandparents and listen to their advice.","options":["A. worship","B. obey","C. celebrate","D. gather"],"answer":"B","level":"TH","explain":"obey = vâng lời. Trẻ em nên vâng lời ông bà."},{"type":"mcq","q":"You ___ eat with your hands at a formal dinner. It is impolite.","options":["A. shouldn't","B. don't have to","C. should","D. have to"],"answer":"A","level":"VD","explain":"shouldn't = không nên (lời khuyên về phép lịch sự). Dùng tay ăn trong bữa tiệc trang trọng là bất lịch sự."},{"type":"mcq","q":"Anna: Is it OK to take photos in the temple? - Tour guide: ___","options":["A. \"Take as many as you like.\"","B. \"Yes, but please don't use flash.\"","C. \"No, you can't.\"","D. \"I don't know.\""],"answer":"B","level":"TH","explain":"Hướng dẫn viên trả lời lịch sự, vừa cho phép vừa đưa ra lời khuyên: được chụp nhưng đừng dùng đèn flash."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Xong dat, or first-footing, is a Tet custom in Vietnam. The first visitor of the new year is believed to bring luck to the family. Therefore, families often invite a successful person to be the first-footer. This custom shows people's wish for a lucky new year.","statements":["a) The first visitor is thought to bring luck to the family.","b) Families invite any stranger to be the first-footer.","c) Xong dat is a custom at Tet.","d) The custom shows people's hope for good luck."],"answer":["T","F","T","T"],"level":"VD","explain":"a) Đúng: người xông đất đầu năm được tin là mang lại may mắn. b) Sai: gia đình thường mời người thành đạt, không phải người lạ bất kỳ. c) Đúng: phong tục ngày Tết. d) Đúng: thể hiện ước mong năm mới may mắn."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). On the 23rd day of the 12th lunar month, Vietnamese families worship the Kitchen Gods. People believe the Kitchen Gods report the family's behaviour to the Jade Emperor. They offer fruit and release carp into rivers. The carp is believed to carry the Gods to heaven.","statements":["a) The Kitchen Gods are worshipped in the 12th lunar month.","b) People think the Gods report to the Jade Emperor.","c) Families release carp as the Gods' ride to heaven.","d) The Kitchen Gods are worshipped only in the north of Vietnam."],"answer":["T","T","T","F"],"level":"VDC","explain":"a) Đúng: cúng ông Táo ngày 23 tháng Chạp. b) Đúng: Táo quân bẩm báo với Ngọc Hoàng. c) Đúng: cá chép đưa ông Táo về trời. d) Sai: bài đọc không nói chỉ cúng ở miền Bắc."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. Tet is the most important ___ (celebrate) of the year in Vietnam.","answer":"celebration","level":"VDC","explain":"Sau cụm 'the most important' cần một danh từ; celebrate (động từ) chuyển thành celebration (danh từ)."}]},{"name":"Đề 5","questions":[{"type":"mcq","q":"Identify the word whose 'n' pronunciation is different.","options":["A. ring","B. king","C. ten","D. song"],"answer":"C","level":"NB","explain":"Các từ king, ring, song có 'ng' phát âm là /ŋ/, còn ten phát âm là /ten/ với âm /n/ nên khác."},{"type":"mcq","q":"Select the word in which 'n' is pronounced differently.","options":["A. thing","B. win","C. thin","D. tin"],"answer":"A","level":"NB","explain":"Các từ thin, tin, win có âm /n/, còn thing có 'ng' phát âm là /ŋ/ (θɪŋ) nên khác."},{"type":"mcq","q":"Which word has a different main stress from the others?","options":["A. offering","B. ancestor","C. ceremony","D. generation"],"answer":"D","level":"TH","explain":"Các từ ceremony, ancestor, offering nhấn âm tiết 1, còn generation nhấn âm tiết 3 (ˌdʒenəˈreɪʃn) nên khác."},{"type":"mcq","q":"My grandmother always lights ___ on the altar on the first day of each lunar month.","options":["A. incense","B. flowers","C. lamps","D. lanterns"],"answer":"A","level":"NB","explain":"light incense = thắp hương. Bà thắp hương lên bàn thờ vào mùng một mỗi tháng."},{"type":"mcq","q":"The dragon dance is a popular ___ at the Mid-Autumn Festival.","options":["A. custom","B. performance","C. offering","D. prayer"],"answer":"B","level":"TH","explain":"performance = tiết mục biểu diễn. Múa lân là tiết mục được yêu thích."},{"type":"mcq","q":"You ___ wear shorts when visiting a pagoda. It shows disrespect.","options":["A. shouldn't","B. have to","C. should","D. don't have to"],"answer":"A","level":"VD","explain":"shouldn't = không nên. Mặc quần ngắn khi vào chùa là thiếu tôn trọng nên ta đưa lời khuyên không nên."},{"type":"mcq","q":"Linh: Can you tell me about Tet customs? - Mai: ___","options":["A. \"I don't celebrate Tet.\"","B. \"Tet is boring.\"","C. \"No, I can't.\"","D. \"Sure. Families gather and enjoy a big feast.\""],"answer":"D","level":"TH","explain":"Đáp lại lời đề nghị một cách nhiệt tình và đưa thông tin đúng chủ đề: sum họp và bữa tiệc lớn."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Giving lucky money is a lovely Tet tradition. Elders put money in small red envelopes and give them to children. The red colour is believed to bring good luck. Children often wish their grandparents good health in return.","statements":["a) Lucky money is put in red envelopes.","b) The red colour is believed to bring good luck.","c) Only children give lucky money to elders.","d) This tradition happens at Christmas."],"answer":["T","T","F","F"],"level":"VD","explain":"a) Đúng: tiền lì xì đựng trong phong bao đỏ. b) Đúng: màu đỏ tượng trưng cho may mắn. c) Sai: người lớn lì xì cho trẻ em, ngược lại. d) Sai: phong tục ngày Tết, không phải Giáng sinh."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Water puppetry is a unique Vietnamese art form. It began in the Red River Delta about 1,000 years ago. Puppets dance on the water to tell stories about village life. Today, tourists from all over the world enjoy this traditional art.","statements":["a) Water puppetry started about 1,000 years ago.","b) It began in the Mekong Delta.","c) The puppets perform on the water surface.","d) Only Vietnamese people watch water puppetry today."],"answer":["T","F","T","F"],"level":"VDC","explain":"a) Đúng: bắt đầu cách đây khoảng 1.000 năm. b) Sai: bắt nguồn từ đồng bằng sông Hồng (Red River Delta). c) Đúng: rối biểu diễn trên mặt nước. d) Sai: du khách khắp thế giới thưởng thức."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. We should be ___ (pride) of our rich culture.","answer":"proud","level":"VDC","explain":"Sau động từ be cần một tính từ; pride (danh từ) chuyển thành proud (tính từ)."}]},{"name":"Đề 6","questions":[{"type":"mcq","q":"Spot the word whose 'n' is pronounced differently.","options":["A. clean","B. green","C. begin","D. sing"],"answer":"D","level":"NB","explain":"Các từ green, clean, begin có âm /n/, còn sing có 'ng' phát âm là /ŋ/ (sɪŋ) nên khác."},{"type":"mcq","q":"Which word has the odd 'n' sound out?","options":["A. name","B. nine","C. night","D. song"],"answer":"D","level":"NB","explain":"Các từ name, nine, night có âm /n/, còn song có 'ng' phát âm là /ŋ/ (sɒŋ) nên khác."},{"type":"mcq","q":"Pick the word stressed on the second syllable.","options":["A. custom","B. lantern","C. tradition","D. gather"],"answer":"C","level":"TH","explain":"tradition nhấn âm tiết 2 (traˈdition); custom, lantern, gather đều nhấn âm tiết 1."},{"type":"mcq","q":"During the festival, the streets are decorated with colourful ___.","options":["A. altars","B. offerings","C. incense","D. lanterns"],"answer":"D","level":"NB","explain":"lantern = đèn lồng. Phố được trang trí bằng đèn lồng rực rỡ trong lễ hội."},{"type":"mcq","q":"We should ___ the environment during festivals by not littering.","options":["A. protect","B. worship","C. obey","D. celebrate"],"answer":"A","level":"TH","explain":"protect the environment = bảo vệ môi trường. Không xả rác khi đi lễ hội."},{"type":"mcq","q":"Guests ___ bring an expensive gift to the wedding. A small gift is fine.","options":["A. shouldn't","B. have to","C. should","D. don't have to"],"answer":"D","level":"VD","explain":"don't have to = không cần thiết. Không bắt buộc phải mang quà đắt tiền."},{"type":"mcq","q":"Peter: What do Vietnamese people do on Tet Eve? - Nam: ___","options":["A. \"They go to bed early.\"","B. \"They work in the fields.\"","C. \"They go to school.\"","D. \"They stay up late to welcome the new year.\""],"answer":"D","level":"TH","explain":"Đáp án đúng mô tả phong tục đón giao thừa: thức khuya chào đón năm mới."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Ao dai is the traditional dress of Vietnam. Women often wear it at weddings and important ceremonies. The long dress shows the grace of Vietnamese women. Today, ao dai is also popular with young people.","statements":["a) Ao dai is worn at weddings and ceremonies.","b) It shows the grace of Vietnamese women.","c) Ao dai is only for old people.","d) Ao dai is the traditional dress of Vietnam."],"answer":["T","T","F","T"],"level":"VD","explain":"a) Đúng: mặc trong lễ cưới và nghi lễ quan trọng. b) Đúng: tôn vẻ duyên dáng. c) Sai: giới trẻ ngày nay cũng yêu thích áo dài. d) Đúng: trang phục truyền thống của Việt Nam."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). The communal house, or dinh lang, is the heart of a Vietnamese village. Villagers gather there for festivals and meetings. The house also honours the village's guardian god. Its wooden carvings show the great skill of ancient craftsmen.","statements":["a) Dinh lang is where villagers hold festivals and meetings.","b) The communal house honours a guardian god.","c) The carvings show the skill of ancient craftsmen.","d) Dinh lang is found only in big cities."],"answer":["T","T","T","F"],"level":"VDC","explain":"a) Đúng: nơi tổ chức lễ hội và hội họp. b) Đúng: thờ thành hoàng làng. c) Đúng: chạm khắc gỗ thể hiện tay nghề nghệ nhân xưa. d) Sai: đình làng ở các làng quê, không phải thành phố lớn."},{"type":"short","q":"Complete the sentence with ONE word. We ___ to respect the customs of the places we visit.","answer":"have","level":"VDC","explain":"have to = phải (nghĩa vụ). Khi đi du lịch, ta phải tôn trọng phong tục nơi đến."}]},{"name":"Đề 7","questions":[{"type":"mcq","q":"Choose the word whose 'n' differs in pronunciation.","options":["A. sing","B. win","C. spring","D. bring"],"answer":"B","level":"NB","explain":"Các từ bring, spring, sing có 'ng' phát âm là /ŋ/, còn win phát âm là /wɪn/ với âm /n/ nên khác."},{"type":"mcq","q":"Pick out the odd one out for the pronunciation of 'n'.","options":["A. strong","B. young","C. one","D. long"],"answer":"C","level":"NB","explain":"Các từ young, long, strong có 'ng' phát âm là /ŋ/, còn one phát âm là /wʌn/ với âm /n/ nên khác."},{"type":"mcq","q":"Find the word whose stress pattern is different from the others.","options":["A. obey","B. heritage","C. lucky","D. ritual"],"answer":"A","level":"TH","explain":"Các từ lucky, ritual, heritage nhấn âm tiết 1, còn obey nhấn âm tiết 2 (oˈbey) nên khác."},{"type":"mcq","q":"The ___ is a quiet place where people pray and worship.","options":["A. pagoda","B. school","C. market","D. park"],"answer":"A","level":"NB","explain":"pagoda = chùa, nơi yên tĩnh để cầu nguyện và thờ cúng."},{"type":"mcq","q":"Our school held a ___ to celebrate its 50th birthday.","options":["A. habit","B. custom","C. tradition","D. ceremony"],"answer":"D","level":"TH","explain":"ceremony = buổi lễ. Trường tổ chức buổi lễ kỷ niệm 50 năm thành lập."},{"type":"mcq","q":"You ___ learn some basic customs before travelling abroad. It helps you avoid mistakes.","options":["A. shouldn't","B. should","C. don't have to","D. have to"],"answer":"B","level":"VD","explain":"should = nên (lời khuyên). Đây là điều khôn ngoan nên làm, không phải quy định bắt buộc."},{"type":"mcq","q":"Mum: You should help me cook for Tet. - Daughter: ___","options":["A. \"OK, Mum. What should I do first?\"","B. \"No way.\"","C. \"I don't like Tet.\"","D. \"I am busy.\""],"answer":"A","level":"TH","explain":"Đáp lại lời đề nghị của mẹ một cách lễ phép và hợp tác."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Flower markets are a beautiful part of Tet in Vietnam. In late January, streets are full of peach blossoms and kumquat trees. People buy flowers to decorate their houses. The markets are busiest on the last days of the lunar year.","statements":["a) Flower markets appear before Tet.","b) People buy flowers to decorate their houses.","c) The markets are quietest at the end of the year.","d) Peach blossoms are popular at Tet."],"answer":["T","T","F","T"],"level":"VD","explain":"a) Đúng: chợ hoa họp trước Tết. b) Đúng: mua hoa trang trí nhà cửa. c) Sai: chợ đông nhất (busiest) vào những ngày cuối năm. d) Đúng: hoa đào được ưa chuộng ngày Tết."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Tet Thanh Minh is a time to remember ancestors. Families visit and clean the graves of their loved ones. They offer flowers, fruit and incense at the graves. This custom teaches young people to respect their roots.","statements":["a) At Thanh Minh, families clean their ancestors' graves.","b) They bring offerings to the graves.","c) The custom teaches respect for one's roots.","d) Thanh Minh is a festival only for children."],"answer":["T","T","T","F"],"level":"VDC","explain":"a) Đúng: tảo mộ, dọn dẹp mộ phần tổ tiên. b) Đúng: dâng hoa, quả, hương. c) Đúng: dạy con cháu nhớ về cội nguồn. d) Sai: đây là dịp của cả gia đình, không riêng trẻ em."},{"type":"short","q":"Complete the sentence with ONE word. Tourists ___ not touch the offerings on the altar.","answer":"should","level":"VDC","explain":"shouldn't = không nên (lời khuyên về phép lịch sự khi thăm nơi thờ cúng)."}]},{"name":"Đề 8","questions":[{"type":"mcq","q":"Find the odd one out in the pronunciation of the letter 'n'.","options":["A. fun","B. song","C. sun","D. run"],"answer":"B","level":"NB","explain":"Các từ sun, fun, run có âm /n/, còn song có 'ng' phát âm là /ŋ/ (sɒŋ) nên khác."},{"type":"mcq","q":"Which word's 'n' is pronounced differently?","options":["A. men","B. ring","C. pen","D. ten"],"answer":"B","level":"NB","explain":"Các từ pen, men, ten có âm /n/, còn ring có 'ng' phát âm là /ŋ/ (rɪŋ) nên khác."},{"type":"mcq","q":"Pick the word stressed on the first syllable.","options":["A. worship","B. obey","C. respect","D. tradition"],"answer":"A","level":"TH","explain":"worship nhấn âm tiết 1; respect, obey, tradition đều nhấn âm tiết 2."},{"type":"mcq","q":"Before the ceremony starts, the village chief says a short ___.","options":["A. speech","B. story","C. prayer","D. song"],"answer":"C","level":"NB","explain":"prayer = lời cầu nguyện, phù hợp với không khí nghi lễ."},{"type":"mcq","q":"Tet customs help keep family ___ strong through generations.","options":["A. union","B. unit","C. unite","D. unity"],"answer":"D","level":"TH","explain":"unity (danh từ) = sự đoàn kết. Sau tính từ 'family' cần danh từ."},{"type":"mcq","q":"She ___ wear ao dai to the wedding because it is not required, but she wants to.","options":["A. should","B. shouldn't","C. doesn't have to","D. has to"],"answer":"C","level":"VD","explain":"doesn't have to = không cần thiết. Không bắt buộc nhưng cô ấy vẫn muốn mặc."},{"type":"mcq","q":"Hoa: Let's join the lantern parade tonight! - Lan: ___","options":["A. \"Maybe tomorrow.\"","B. \"Great idea! What time does it start?\"","C. \"I hate lanterns.\"","D. \"No, thanks.\""],"answer":"B","level":"TH","explain":"Hưởng ứng lời rủ một cách hào hứng và hỏi thêm thông tin."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). The dragon dance is a lively part of many Vietnamese festivals. A team of dancers moves under a long dragon costume. Drums and cymbals make exciting music. People believe the dance brings good luck.","statements":["a) Dancers perform under a dragon costume.","b) The dance is quiet and slow.","c) People believe the dance brings good luck.","d) Drums make music for the dance."],"answer":["T","F","T","T"],"level":"VD","explain":"a) Đúng: đội múa di chuyển dưới bộ trang phục rồng. b) Sai: múa lân sôi động (lively), không yên tĩnh. c) Đúng: người ta tin múa lân mang lại may mắn. d) Đúng: trống tạo nhạc điệu."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). In coastal villages, fishermen worship Ca Ong, the whale. They believe whales protect them at sea. Every year, villages hold a festival to honour the whale. This tradition shows deep respect for nature.","statements":["a) Fishermen believe whales protect them at sea.","b) The whale festival is held in mountain villages.","c) The tradition shows respect for nature.","d) Ca Ong is the whale that fishermen worship."],"answer":["T","F","T","T"],"level":"VDC","explain":"a) Đúng: ngư dân tin cá voi che chở họ trên biển. b) Sai: lễ hội ở làng chài ven biển (coastal), không phải miền núi. c) Đúng: thể hiện sự tôn trọng thiên nhiên. d) Đúng: Cá Ông chính là cá voi được thờ."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. This village is famous for its ___ (colour) lanterns.","answer":"colourful","level":"VDC","explain":"Trước danh từ 'lanterns' cần một tính từ; colour (danh từ) chuyển thành colourful (tính từ)."}]},{"name":"Đề 9","questions":[{"type":"mcq","q":"Choose the word that has a different 'n' sound.","options":["A. green","B. begin","C. thing","D. clean"],"answer":"C","level":"NB","explain":"Các từ clean, green, begin có âm /n/, còn thing có 'ng' phát âm là /ŋ/ (θɪŋ) nên khác."},{"type":"mcq","q":"Spot the different pronunciation of the letter 'n'.","options":["A. night","B. name","C. young","D. nine"],"answer":"C","level":"NB","explain":"Các từ night, nine, name có âm /n/, còn young có 'ng' phát âm là /ŋ/ (jʌŋ) nên khác."},{"type":"mcq","q":"Choose the word stressed differently from the others.","options":["A. obey","B. ancestor","C. celebrate","D. custom"],"answer":"A","level":"TH","explain":"Các từ celebrate, ancestor, custom nhấn âm tiết 1, còn obey nhấn âm tiết 2 (oˈbey) nên khác."},{"type":"mcq","q":"On special occasions, Vietnamese people often wear ___ ao dai.","options":["A. modern","B. old","C. short","D. traditional"],"answer":"D","level":"NB","explain":"traditional ao dai = áo dài truyền thống, trang phục trong các dịp đặc biệt."},{"type":"mcq","q":"The festival is held to ___ the village's guardian god.","options":["A. gather","B. pray","C. honour","D. obey"],"answer":"C","level":"TH","explain":"honour = tôn vinh. Lễ hội được tổ chức để tôn vinh thành hoàng làng."},{"type":"mcq","q":"According to tradition, the eldest son ___ take care of the family altar.","options":["A. has to","B. shouldn't","C. should","D. don't have to"],"answer":"A","level":"VD","explain":"have to diễn tả trách nhiệm, nghĩa vụ theo truyền thống gia đình."},{"type":"mcq","q":"Tourist: Should I take off my hat in the temple? - Guide: ___","options":["A. \"No need at all.\"","B. \"Keep it on.\"","C. \"Yes, please. It shows respect.\"","D. \"I don't care.\""],"answer":"C","level":"TH","explain":"Hướng dẫn viên khuyên du khách bỏ mũ để tỏ lòng tôn trọng nơi thờ cúng."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Many Vietnamese people visit pagodas at the start of the new year. They offer incense and pray for health and luck. The pagodas are crowded but peaceful. Visiting pagodas is a meaningful custom for a fresh start.","statements":["a) People visit pagodas at the beginning of the year.","b) They pray for health and luck.","c) The pagodas are empty at Tet.","d) Visiting pagodas is a meaningful custom."],"answer":["T","T","F","T"],"level":"VD","explain":"a) Đúng: đi chùa đầu năm. b) Đúng: cầu sức khỏe và may mắn. c) Sai: chùa đông đúc (crowded) dịp Tết. d) Đúng: phong tục ý nghĩa khởi đầu năm mới."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). Greeting elders politely is an important custom in Vietnam. Children bow their heads and say hello with both hands together. This small act shows respect and good manners. Parents teach it to children from a very young age.","statements":["a) Children greet elders with both hands together.","b) The custom shows respect and good manners.","c) Parents teach polite greeting from a young age.","d) Greeting elders is not important in Vietnam."],"answer":["T","T","T","F"],"level":"VDC","explain":"a) Đúng: trẻ chào người lớn với hai tay chắp lại. b) Đúng: thể hiện sự tôn trọng và lễ phép. c) Đúng: cha mẹ dạy từ khi còn nhỏ. d) Sai: chào hỏi lễ phép là phong tục quan trọng."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. The Mid-Autumn Festival is a ___ (joy) time for children.","answer":"joyful","level":"VDC","explain":"Trước danh từ 'time' cần một tính từ; joy (danh từ) chuyển thành joyful (tính từ)."}]},{"name":"Đề 10","questions":[{"type":"mcq","q":"Which word breaks the 'n' pronunciation pattern?","options":["A. long","B. sun","C. hang","D. song"],"answer":"B","level":"NB","explain":"Các từ hang, song, long có 'ng' phát âm là /ŋ/, còn sun phát âm là /sʌn/ với âm /n/ nên khác."},{"type":"mcq","q":"Pick the word where 'n' is pronounced in a different way.","options":["A. soon","B. king","C. noon","D. moon"],"answer":"B","level":"NB","explain":"Các từ moon, soon, noon có âm /n/, còn king có 'ng' phát âm là /ŋ/ (kɪŋ) nên khác."},{"type":"mcq","q":"Which word has its main stress on the second syllable?","options":["A. worship","B. lantern","C. obey","D. gather"],"answer":"C","level":"TH","explain":"obey nhấn âm tiết 2 (oˈbey); worship, gather, lantern đều nhấn âm tiết 1."},{"type":"mcq","q":"___ is the first day of the lunar new year in Vietnam.","options":["A. Halloween","B. Tet","C. Thanksgiving","D. Christmas"],"answer":"B","level":"NB","explain":"Tet = Tết Nguyên Đán, ngày đầu năm mới âm lịch."},{"type":"mcq","q":"The old ___ of making banh chung passes from parents to children.","options":["A. habit","B. custom","C. routine","D. rule"],"answer":"B","level":"TH","explain":"custom = phong tục được truyền từ đời này sang đời khác."},{"type":"mcq","q":"We ___ forget to thank our hosts after the feast. It's polite to do so.","options":["A. have to","B. shouldn't","C. should","D. don't have to"],"answer":"B","level":"VD","explain":"shouldn't forget = không nên quên (lời khuyên về phép lịch sự sau bữa tiệc)."},{"type":"mcq","q":"Ba: I think we should keep our Tet traditions. - Nam: ___","options":["A. \"No idea.\"","B. \"I agree with you.\"","C. \"I don't think.\"","D. \"Whatever.\""],"answer":"B","level":"TH","explain":"Đồng tình với ý kiến của bạn: I agree with you."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). In Vietnam, family meals are an important daily custom. Everyone tries to come home for dinner. The eldest people are invited to eat first. Sharing meals keeps the family close and happy.","statements":["a) Vietnamese families value eating together.","b) The youngest members eat first.","c) Sharing meals brings the family closer.","d) Family meals happen every day."],"answer":["T","F","T","T"],"level":"VD","explain":"a) Đúng: bữa cơm gia đình là phong tục quan trọng. b) Sai: người lớn tuổi nhất được mời ăn trước. c) Đúng: gắn kết gia đình. d) Đúng: phong tục hằng ngày (daily)."},{"type":"truefalse","q":"Read the passage and decide whether the statements are True (T) or False (F). The Do Son Buffalo Fighting Festival is held every spring. Buffalo owners train their animals for months before the event. The festival attracts thousands of visitors. It is a proud tradition of the people of Hai Phong.","statements":["a) The festival is held in spring.","b) Buffalo owners train their buffalo for months.","c) Few people come to watch the festival.","d) It is a tradition of Hai Phong people."],"answer":["T","T","F","T"],"level":"VDC","explain":"a) Đúng: tổ chức mỗi mùa xuân. b) Đúng: chủ trâu huấn luyện trâu nhiều tháng. c) Sai: thu hút hàng nghìn du khách (thousands of visitors). d) Đúng: truyền thống tự hào của người Hải Phòng."},{"type":"short","q":"Complete the sentence with the correct form of the word in brackets. The temple ceremony was very ___ (impress).","answer":"impressive","level":"VDC","explain":"Sau be và very cần một tính từ; impress (động từ) chuyển thành impressive (tính từ)."}]}]}
