{"sets": [{"questions": [{"type": "mcq", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. shop", "B. sing", "C. sun", "D. sit"], "answer": "A", "level": "NB", "explain": "Từ shop phát âm chữ s là /ʃ/, các từ còn lại là /s/."}, {"type": "mcq", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. cheap", "B. school", "C. cheese", "D. lunch"], "answer": "B", "level": "TH", "explain": "Từ school phát âm chữ ch là /k/, các từ còn lại là /tʃ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. market", "B. customer", "C. discount", "D. expensive"], "answer": "D", "level": "VDC", "explain": "expensive nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "q": "I want to buy a new dress. Let's go to the ____.", "options": ["A. shop", "B. river", "C. park", "D. school"], "answer": "A", "level": "NB", "explain": "Mua váy mới thì đến cửa hàng (shop)."}, {"type": "mcq", "q": "The ____ gave me the wrong change, so I asked him to check again.", "options": ["A. cashier", "B. teacher", "C. driver", "D. doctor"], "answer": "A", "level": "VD", "explain": "cashier là nhân viên thu ngân, người thối tiền cho khách."}, {"type": "mcq", "q": "We ____ our grandparents this weekend. We bought the train tickets already.", "options": ["A. are visiting", "B. visit", "C. visited", "D. will visiting"], "answer": "A", "level": "TH", "explain": "Kế hoạch đã sắp xếp chắc chắn (đã mua vé): hiện tại tiếp diễn diễn tả tương lai."}, {"type": "mcq", "q": "Shopkeeper: Can I help you? — Customer: ____", "options": ["A. Yes, I'd like to try on this shirt.", "B. I don't like shopping.", "C. How are you?", "D. Goodbye."], "answer": "A", "level": "VD", "explain": "Đáp lại lời mời giúp đỡ bằng yêu cầu cụ thể."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nShopping is a popular activity. People buy food, clothes and many other things. Some people shop at markets, others shop at supermarkets or online.", "statements": ["a) Shopping is a popular activity.", "b) People only buy food when shopping.", "c) Some people shop online.", "d) Nobody shops at traditional markets."], "answer": ["T", "F", "T", "F"], "level": "NB", "explain": "Mọi người mua nhiều thứ và mua sắm ở chợ, siêu thị hoặc trực tuyến."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nYesterday, Mai went to the market with her mother. While they were choosing vegetables, it started to rain. They bought some fruit and hurried home.", "statements": ["a) Mai went to the market alone.", "b) They were choosing vegetables when it rained.", "c) They bought some fruit.", "d) They stayed at the market all day."], "answer": ["F", "T", "T", "F"], "level": "TH", "explain": "Mai đi chợ với mẹ; họ mua trái cây rồi vội về nhà khi trời mưa."}, {"type": "short", "q": "Look at the clouds! It (rain) ____ soon.", "answer": "is going to rain", "level": "VDC", "explain": "Dự đoán dựa trên bằng chứng hiện tại (mây đen): be going to + V."}], "name": "Đề 1"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. she", "B. see", "C. say", "D. sell"], "answer": "A", "level": "NB", "explain": "Từ she phát âm chữ s là /ʃ/, các từ còn lại là /s/."}, {"type": "mcq", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. machine", "B. much", "C. chicken", "D. catch"], "answer": "A", "level": "TH", "explain": "Từ machine phát âm chữ ch là /ʃ/, các từ còn lại là /tʃ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. supermarket", "B. customer", "C. receipt", "D. bargain"], "answer": "C", "level": "VDC", "explain": "receipt nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "q": "This shirt is too ____. I can't buy it.", "options": ["A. expensive", "B. cheap", "C. small", "D. nice"], "answer": "A", "level": "NB", "explain": "Áo quá đắt (expensive) nên không mua nổi."}, {"type": "mcq", "q": "You can get a 20% ____ on all shoes this weekend.", "options": ["A. discount", "B. price", "C. receipt", "D. money"], "answer": "A", "level": "VD", "explain": "discount là sự giảm giá: giảm 20% cho tất cả giày."}, {"type": "mcq", "q": "Look! She ____ a new dress for the party tonight.", "options": ["A. is going to wear", "B. wears", "C. wore", "D. wearing"], "answer": "A", "level": "TH", "explain": "Dự định đã quyết định cho tối nay: be going to + V."}, {"type": "mcq", "q": "Customer: How much is this bag? — Shopkeeper: ____", "options": ["A. It's 200,000 dong.", "B. It's red.", "C. It's new.", "D. It's big."], "answer": "A", "level": "VD", "explain": "Hỏi giá thì trả lời bằng số tiền cụ thể."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nOnline shopping is very convenient. You can buy things at home and the shop will deliver them to your house. Many young people like shopping online.", "statements": ["a) Online shopping is convenient.", "b) You must go to the shop to buy things online.", "c) Shops deliver goods to your house.", "d) Nobody likes shopping online."], "answer": ["T", "F", "T", "F"], "level": "NB", "explain": "Mua sắm trực tuyến tiện lợi: mua tại nhà, cửa hàng giao hàng tận nơi."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nNam is going to buy a birthday gift for his sister. He is looking at some teddy bears in the shop. The brown one is too expensive, so he chooses the white one.", "statements": ["a) Nam is buying a gift for his brother.", "b) He is looking at teddy bears in a shop.", "c) He chooses the brown teddy bear.", "d) The white bear is cheaper than the brown one."], "answer": ["F", "T", "F", "T"], "level": "TH", "explain": "Chú ý chi tiết: quà cho em gái, chọn con gấu trắng vì con nâu quá đắt."}, {"type": "short", "q": "I (buy) ____ a new phone tomorrow. I have saved enough money.", "answer": "am going to buy", "level": "VDC", "explain": "Dự định đã quyết định trong tương lai: be going to + V."}], "name": "Đề 2"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. chair", "B. watch", "C. chicken", "D. school"], "answer": "D", "level": "NB", "explain": "Từ school phát âm chữ ch là /k/, các từ còn lại là /tʃ/."}, {"type": "mcq", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. shop", "B. wish", "C. sun", "D. fish"], "answer": "C", "level": "TH", "explain": "Từ sun phát âm chữ s là /s/, các từ còn lại là /ʃ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. cheap", "B. expensive", "C. market", "D. customer"], "answer": "B", "level": "VDC", "explain": "expensive nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "q": "Mum made a ____ before going to the supermarket.", "options": ["A. shopping list", "B. shopping bag", "C. phone call", "D. birthday cake"], "answer": "A", "level": "NB", "explain": "shopping list là danh sách mua sắm, lập trước khi đi siêu thị."}, {"type": "mcq", "q": "In Viet Nam, people often ____ when they buy things at the market.", "options": ["A. bargain", "B. sleep", "C. run", "D. sing"], "answer": "A", "level": "VD", "explain": "bargain là mặc cả, phổ biến ở chợ truyền thống Việt Nam."}, {"type": "mcq", "q": "A: Have you decided what to do? — B: Yes, I ____ to Da Nang this summer.", "options": ["A. am going to travel", "B. travel", "C. travelled", "D. travelling"], "answer": "A", "level": "TH", "explain": "Quyết định đã có cho mùa hè: be going to + V."}, {"type": "mcq", "q": "Mai: This T-shirt doesn't fit me. — Shop assistant: ____", "options": ["A. You can try a larger size.", "B. It is red.", "C. T-shirts are nice.", "D. Goodbye."], "answer": "A", "level": "VD", "explain": "Áo không vừa thì gợi ý thử cỡ lớn hơn."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nA shopping list helps you remember what to buy. Before going shopping, write down everything you need. This saves time and money.", "statements": ["a) A shopping list helps you remember things.", "b) You should write the list after shopping.", "c) A shopping list saves time.", "d) A shopping list wastes money."], "answer": ["T", "F", "T", "F"], "level": "NB", "explain": "Lập danh sách trước khi đi mua sắm giúp nhớ đồ cần mua, tiết kiệm thời gian và tiền."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nThe new supermarket is very big. It sells food, clothes, toys and books. Many people go there at the weekend because everything is cheaper.", "statements": ["a) The new supermarket is small.", "b) It sells many kinds of goods.", "c) Many people go there at the weekend.", "d) Things there are expensive."], "answer": ["F", "T", "T", "F"], "level": "TH", "explain": "Siêu thị mới rất lớn, bán nhiều mặt hàng với giá rẻ hơn vào cuối tuần."}, {"type": "short", "q": "We (have) ____ a sale on all clothes next week.", "answer": "are having", "level": "VDC", "explain": "Kế hoạch đã sắp xếp chắc chắn (tuần tới): hiện tại tiếp diễn diễn tả tương lai."}], "name": "Đề 3"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. sugar", "B. see", "C. sit", "D. sun"], "answer": "A", "level": "NB", "explain": "Từ sugar phát âm chữ s là /ʃ/, các từ còn lại là /s/."}, {"type": "mcq", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. choose", "B. chemistry", "C. change", "D. church"], "answer": "B", "level": "TH", "explain": "Từ chemistry phát âm chữ ch là /k/, các từ còn lại là /tʃ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. receipt", "B. market", "C. price", "D. shopper"], "answer": "A", "level": "VDC", "explain": "receipt nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "q": "After paying, don't forget to take your ____.", "options": ["A. receipt", "B. bag", "C. money", "D. change"], "answer": "A", "level": "NB", "explain": "receipt là hóa đơn, cần lấy sau khi thanh toán."}, {"type": "mcq", "q": "These shoes are too small. Can I ____ them for a bigger pair?", "options": ["A. exchange", "B. buy", "C. sell", "D. keep"], "answer": "A", "level": "VD", "explain": "exchange là đổi hàng: đổi đôi nhỏ lấy đôi lớn hơn."}, {"type": "mcq", "q": "They ____ football at 4 p.m. tomorrow. The coach told us.", "options": ["A. are playing", "B. play", "C. played", "D. will plays"], "answer": "A", "level": "TH", "explain": "Lịch đã định sẵn (huấn luyện viên đã báo): hiện tại tiếp diễn diễn tả tương lai."}, {"type": "mcq", "q": "Customer: Excuse me, where can I try on these jeans? — Assistant: ____", "options": ["A. The fitting room is over there.", "B. They are blue.", "C. Jeans are expensive.", "D. I don't know."], "answer": "A", "level": "VD", "explain": "Hỏi chỗ thử đồ thì chỉ phòng thử đồ (fitting room)."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nBargaining is common at traditional markets. Buyers ask for a lower price and sellers agree or refuse. It is a fun part of shopping for many people.", "statements": ["a) Bargaining is common at traditional markets.", "b) Buyers want to pay lower prices.", "c) Sellers always refuse to lower prices.", "d) Bargaining is fun for many people."], "answer": ["T", "T", "F", "T"], "level": "NB", "explain": "Mặc cả phổ biến ở chợ truyền thống; người bán có thể đồng ý hoặc từ chối."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nLinh wants to buy a new school bag. She is going to the shop this afternoon. She likes the red one, but it is too expensive, so she will buy the blue one.", "statements": ["a) Linh is going to buy a bag this morning.", "b) She likes the red school bag.", "c) The red bag is cheap.", "d) She will buy the blue bag."], "answer": ["F", "T", "F", "T"], "level": "TH", "explain": "Chú ý chi tiết thời gian (this afternoon) và lựa chọn cuối cùng (blue one)."}, {"type": "short", "q": "She (not go) ____ shopping tomorrow; she is busy.", "answer": "is not going", "level": "VDC", "explain": "Phủ định của hiện tại tiếp diễn diễn tả tương lai: is not going."}], "name": "Đề 4"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. lunch", "B. much", "C. teacher", "D. character"], "answer": "D", "level": "NB", "explain": "Từ character phát âm chữ ch là /k/, các từ còn lại là /tʃ/."}, {"type": "mcq", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. fashion", "B. shop", "C. fish", "D. see"], "answer": "D", "level": "TH", "explain": "Từ see phát âm chữ s là /s/, các từ còn lại là /ʃ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. customer", "B. discount", "C. cashier", "D. market"], "answer": "C", "level": "VDC", "explain": "cashier nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "q": "You can buy fresh vegetables at the ____.", "options": ["A. market", "B. cinema", "C. park", "D. zoo"], "answer": "A", "level": "NB", "explain": "Mua rau tươi ở chợ (market)."}, {"type": "mcq", "q": "The ____ helped me carry my bags to the car.", "options": ["A. shop assistant", "B. teacher", "C. doctor", "D. farmer"], "answer": "A", "level": "VD", "explain": "shop assistant là nhân viên bán hàng, người giúp xách túi."}, {"type": "mcq", "q": "Look at those black clouds! It ____.", "options": ["A. is going to rain", "B. rains", "C. rained", "D. raining"], "answer": "A", "level": "TH", "explain": "Dự đoán dựa trên bằng chứng (mây đen): be going to + V."}, {"type": "mcq", "q": "Nam: Do you want to go shopping with me? — Lan: ____", "options": ["A. Sure, I'd love to.", "B. I hate you.", "C. Shopping is boring.", "D. Go away."], "answer": "A", "level": "VD", "explain": "Đáp lại lời rủ đi mua sắm bằng cách vui vẻ đồng ý."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nPrices at the market are often lower than in supermarkets. However, supermarkets are cleaner and more comfortable. Many people like both places.", "statements": ["a) Market prices are often lower than supermarket prices.", "b) Supermarkets are dirty.", "c) Many people like both markets and supermarkets.", "d) Supermarkets are more comfortable."], "answer": ["T", "F", "T", "T"], "level": "NB", "explain": "Giá ở chợ thường rẻ hơn; siêu thị sạch và thoải mái hơn; nhiều người thích cả hai."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWhile Hoa was trying on a dress, her mother was choosing shoes. They spent two hours in the shop and bought many things. Hoa was very happy.", "statements": ["a) Hoa was trying on shoes.", "b) Her mother was choosing shoes.", "c) They spent two hours shopping.", "d) Hoa was unhappy."], "answer": ["F", "T", "T", "F"], "level": "TH", "explain": "Chú ý chi tiết: Hoa thử váy, mẹ chọn giày; cả hai đều vui."}, {"type": "short", "q": "I (meet) ____ my friend at the mall at 3 p.m. tomorrow.", "answer": "am meeting", "level": "VDC", "explain": "Cuộc hẹn đã định sẵn với thời gian cụ thể: hiện tại tiếp diễn diễn tả tương lai."}], "name": "Đề 5"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. cash", "B. best", "C. dish", "D. wish"], "answer": "B", "level": "NB", "explain": "Từ best phát âm chữ s là /s/, các từ còn lại là /ʃ/."}, {"type": "mcq", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. brochure", "B. cheese", "C. chips", "D. change"], "answer": "A", "level": "TH", "explain": "Từ brochure phát âm chữ ch là /ʃ/, các từ còn lại là /tʃ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. bargain", "B. exchange", "C. market", "D. price"], "answer": "B", "level": "VDC", "explain": "exchange nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "q": "This dress is ____. It only costs 50,000 dong.", "options": ["A. cheap", "B. expensive", "C. big", "D. old"], "answer": "A", "level": "NB", "explain": "Giá chỉ 50.000 đồng là rẻ (cheap)."}, {"type": "mcq", "q": "The shop offers free ____ for orders over 500,000 dong.", "options": ["A. delivery", "B. money", "C. price", "D. shop"], "answer": "A", "level": "VD", "explain": "delivery là giao hàng: miễn phí giao hàng cho đơn trên 500.000 đồng."}, {"type": "mcq", "q": "We ____ a birthday party for Lan next Sunday. Everything is ready.", "options": ["A. are having", "B. have", "C. had", "D. having"], "answer": "A", "level": "TH", "explain": "Kế hoạch đã chuẩn bị xong: hiện tại tiếp diễn diễn tả tương lai."}, {"type": "mcq", "q": "Assistant: What size are you? — Customer: ____", "options": ["A. I'm size M.", "B. I'm fine.", "C. I'm tall.", "D. I'm happy."], "answer": "A", "level": "VD", "explain": "Hỏi cỡ quần áo thì trả lời bằng cỡ cụ thể."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nShopping malls are big buildings with many shops. People can buy clothes, eat food and watch films there. They are popular with young people.", "statements": ["a) Shopping malls have many shops.", "b) People can watch films in malls.", "c) Old people never go to shopping malls.", "d) Malls are popular with young people."], "answer": ["T", "T", "F", "T"], "level": "NB", "explain": "Trung tâm thương mại có nhiều cửa hàng, được giới trẻ yêu thích."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nTom is going to buy some apples. He is standing in front of the fruit shop. The apples look fresh, but they are quite expensive, so he buys only one kilo.", "statements": ["a) Tom is going to buy some oranges.", "b) The apples look fresh.", "c) The apples are cheap.", "d) He buys one kilo of apples."], "answer": ["F", "T", "F", "T"], "level": "TH", "explain": "Chú ý chi tiết: Tom mua táo (không phải cam), táo tươi nhưng khá đắt."}, {"type": "short", "q": "They (open) ____ a new supermarket next month.", "answer": "are opening", "level": "VDC", "explain": "Kế hoạch đã định cho tháng tới: hiện tại tiếp diễn diễn tả tương lai."}], "name": "Đề 6"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. catch", "B. kitchen", "C. school", "D. choose"], "answer": "C", "level": "NB", "explain": "Từ school phát âm chữ ch là /k/, các từ còn lại là /tʃ/."}, {"type": "mcq", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. sure", "B. shop", "C. send", "D. sugar"], "answer": "C", "level": "TH", "explain": "Từ send phát âm chữ s là /s/, các từ còn lại là /ʃ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. shopper", "B. market", "C. expensive", "D. bargain"], "answer": "C", "level": "VDC", "explain": "expensive nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "q": "The ____ is the person who buys things.", "options": ["A. customer", "B. seller", "C. cashier", "D. owner"], "answer": "A", "level": "NB", "explain": "customer là khách hàng, người mua hàng."}, {"type": "mcq", "q": "Before you buy shoes, you should ____ to see if they fit.", "options": ["A. try them on", "B. wash them", "C. throw them", "D. sell them"], "answer": "A", "level": "VD", "explain": "try on là thử (giày, quần áo) để xem có vừa không."}, {"type": "mcq", "q": "She ____ a doctor. She is going to study medicine.", "options": ["A. is going to be", "B. is", "C. was", "D. be"], "answer": "A", "level": "TH", "explain": "Dự định nghề nghiệp tương lai: be going to + be."}, {"type": "mcq", "q": "Mai: The price is too high. Can you lower it a bit? — Seller: ____", "options": ["A. OK, I can give you a small discount.", "B. No way.", "C. It's good.", "D. Bye."], "answer": "A", "level": "VD", "explain": "Khi khách mặc cả, người bán lịch sự đồng ý giảm giá một chút."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nCashiers work at the checkout in shops. They take money from customers and give change. Their job is important in every shop.", "statements": ["a) Cashiers work in shops.", "b) They give change to customers.", "c) Their job is not important.", "d) Customers pay money to cashiers."], "answer": ["T", "T", "F", "T"], "level": "NB", "explain": "Nhân viên thu ngân nhận tiền và thối lại tiền thừa; công việc của họ rất quan trọng."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nAnna is going to travel to Hue this summer. She is buying some new clothes for the trip. She has already booked the train tickets.", "statements": ["a) Anna is going to travel this winter.", "b) She is buying new clothes for the trip.", "c) She has booked the train tickets.", "d) She is travelling to Hue by plane."], "answer": ["F", "T", "T", "F"], "level": "TH", "explain": "Chú ý chi tiết: đi vào mùa hè, bằng tàu hỏa (train tickets)."}, {"type": "short", "q": "Be careful! You (drop) ____ your bag.", "answer": "are going to drop", "level": "VDC", "explain": "Dự đoán dựa trên bằng chứng ngay trước mắt: be going to + V."}], "name": "Đề 7"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. fish", "B. sad", "C. see", "D. sit"], "answer": "A", "level": "NB", "explain": "Từ fish phát âm chữ s là /ʃ/, các từ còn lại là /s/."}, {"type": "mcq", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. machine", "B. chair", "C. cheap", "D. child"], "answer": "A", "level": "TH", "explain": "Từ machine phát âm chữ ch là /ʃ/, các từ còn lại là /tʃ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. market", "B. receipt", "C. customer", "D. shopper"], "answer": "B", "level": "VDC", "explain": "receipt nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "q": "How ____ is this watch?", "options": ["A. much", "B. many", "C. long", "D. often"], "answer": "A", "level": "NB", "explain": "Hỏi giá dùng How much."}, {"type": "mcq", "q": "My mum always ____ prices before buying anything.", "options": ["A. compares", "B. forgets", "C. loses", "D. breaks"], "answer": "A", "level": "VD", "explain": "compare prices là so sánh giá trước khi mua."}, {"type": "mcq", "q": "I ____ my homework. I will play games after that.", "options": ["A. am going to do", "B. do", "C. did", "D. doing"], "answer": "A", "level": "TH", "explain": "Dự định làm bài tập trước khi chơi: be going to + V."}, {"type": "mcq", "q": "Customer: I'd like to return this shirt. — Assistant: ____", "options": ["A. What's the problem with it?", "B. It's nice.", "C. Goodbye.", "D. Thank you."], "answer": "A", "level": "VD", "explain": "Khi khách muốn trả hàng, nhân viên hỏi lý do một cách lịch sự."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nDiscounts make things cheaper. Shops often give discounts at the end of the year. Many people wait for discounts to buy what they want.", "statements": ["a) Discounts make things more expensive.", "b) Shops often give discounts at the end of the year.", "c) Many people wait for discounts.", "d) Nobody likes discounts."], "answer": ["F", "T", "T", "F"], "level": "NB", "explain": "Giảm giá làm hàng rẻ hơn; nhiều người chờ đợt giảm giá để mua."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWhile the mother was paying at the cashier, her son was looking at the toys. He wanted a robot, but it was too expensive. His mother promised to buy it next month.", "statements": ["a) The mother was paying at the cashier.", "b) The son was choosing food.", "c) The robot was too expensive.", "d) The mother bought the robot at once."], "answer": ["T", "F", "T", "F"], "level": "TH", "explain": "Chú ý chi tiết: cậu bé xem đồ chơi, mẹ hứa mua robot vào tháng sau."}, {"type": "short", "q": "What (you do) ____ this evening?", "answer": "are you doing", "level": "VDC", "explain": "Hỏi về kế hoạch tối nay: hiện tại tiếp diễn diễn tả tương lai."}], "name": "Đề 8"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. much", "B. character", "C. lunch", "D. rich"], "answer": "B", "level": "NB", "explain": "Từ character phát âm chữ ch là /k/, các từ còn lại là /tʃ/."}, {"type": "mcq", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. shop", "B. sugar", "C. sun", "D. sure"], "answer": "C", "level": "TH", "explain": "Từ sun phát âm chữ s là /s/, các từ còn lại là /ʃ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. discount", "B. cashier", "C. market", "D. bargain"], "answer": "B", "level": "VDC", "explain": "cashier nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "q": "She went to the supermarket to buy some ____.", "options": ["A. food", "B. homework", "C. lessons", "D. exams"], "answer": "A", "level": "NB", "explain": "Đi siêu thị để mua thực phẩm (food)."}, {"type": "mcq", "q": "This shop sells clothes at a ____ price, so many students come here.", "options": ["A. reasonable", "B. terrible", "C. strange", "D. difficult"], "answer": "A", "level": "VD", "explain": "reasonable price là giá hợp lý, thu hút nhiều học sinh."}, {"type": "mcq", "q": "We ____ to the new mall this afternoon. Mum promised.", "options": ["A. are going", "B. go", "C. went", "D. gone"], "answer": "A", "level": "TH", "explain": "Kế hoạch đã hứa cho chiều nay: hiện tại tiếp diễn diễn tả tương lai."}, {"type": "mcq", "q": "Lan: I can't decide which bag to buy. — Hoa: ____", "options": ["A. Take the blue one. It suits you.", "B. Bags are useful.", "C. I like blue.", "D. Don't buy anything."], "answer": "A", "level": "VD", "explain": "Gợi ý cụ thể khi bạn phân vân chọn túi."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nA receipt shows what you bought and how much you paid. Keep your receipt if you want to return things later. Most shops ask for the receipt.", "statements": ["a) A receipt shows the price you paid.", "b) You don't need a receipt to return things.", "c) Most shops ask for receipts for returns.", "d) Receipts are useless."], "answer": ["T", "F", "T", "F"], "level": "NB", "explain": "Hóa đơn ghi món đã mua và số tiền; cần giữ để đổi trả hàng."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nBa is going to have a party next Saturday. He is inviting ten friends. He is going to buy snacks and drinks this Friday.", "statements": ["a) The party is next Sunday.", "b) He is inviting ten friends.", "c) He is going to buy snacks this Friday.", "d) He is going to cook all the food himself."], "answer": ["F", "T", "T", "F"], "level": "TH", "explain": "Chú ý chi tiết: tiệc vào thứ Bảy tới, mua đồ ăn nhẹ vào thứ Sáu."}, {"type": "short", "q": "I think it (be) ____ a nice day tomorrow.", "answer": "is going to be", "level": "VDC", "explain": "Dự đoán về tương lai: be going to + be."}], "name": "Đề 9"}, {"questions": [{"type": "mcq", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. see", "B. shop", "C. sit", "D. sun"], "answer": "B", "level": "NB", "explain": "Từ shop phát âm chữ s là /ʃ/, các từ còn lại là /s/."}, {"type": "mcq", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. cheese", "B. school", "C. chicken", "D. church"], "answer": "B", "level": "TH", "explain": "Từ school phát âm chữ ch là /k/, các từ còn lại là /tʃ/."}, {"type": "mcq", "q": "Choose the word whose stress pattern is different from the others.", "options": ["A. expensive", "B. market", "C. customer", "D. discount"], "answer": "A", "level": "VDC", "explain": "expensive nhấn âm 2, các từ còn lại nhấn âm 1."}, {"type": "mcq", "q": "The ____ told us the total price.", "options": ["A. cashier", "B. teacher", "C. student", "D. farmer"], "answer": "A", "level": "NB", "explain": "Nhân viên thu ngân (cashier) báo tổng số tiền."}, {"type": "mcq", "q": "You should ____ the receipt in case you need to exchange the goods.", "options": ["A. keep", "B. throw", "C. lose", "D. burn"], "answer": "A", "level": "VD", "explain": "keep the receipt là giữ hóa đơn để đổi hàng khi cần."}, {"type": "mcq", "q": "Look! The bus ____. Let's run!", "options": ["A. is coming", "B. comes", "C. came", "D. come"], "answer": "A", "level": "TH", "explain": "Hành động đang diễn ra ngay lúc nói (Look!): hiện tại tiếp diễn."}, {"type": "mcq", "q": "Shopkeeper: This shirt is on sale. — Customer: ____", "options": ["A. Great! I'll take it.", "B. It's ugly.", "C. I don't want it.", "D. Sales are bad."], "answer": "A", "level": "VD", "explain": "Nghe tin giảm giá thì vui vẻ quyết định mua."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nTrying on clothes before buying is a good idea. It helps you choose the right size. Most shops have fitting rooms for customers.", "statements": ["a) Trying on clothes before buying is a bad idea.", "b) Trying on clothes helps you choose the right size.", "c) Most shops have fitting rooms.", "d) Customers cannot try on clothes."], "answer": ["F", "T", "T", "F"], "level": "NB", "explain": "Nên thử quần áo trước khi mua để chọn đúng cỡ; hầu hết cửa hàng có phòng thử đồ."}, {"type": "truefalse", "q": "Read the passage and decide whether the following statements are True (T) or False (F).\nWhile they were shopping, the children saw a sale on toys. They asked their father to buy a teddy bear. He agreed because they had good marks at school.", "statements": ["a) The children saw a sale on toys.", "b) They wanted their father to buy a robot.", "c) Their father agreed to buy a teddy bear.", "d) They had bad marks at school."], "answer": ["T", "F", "T", "F"], "level": "TH", "explain": "Chú ý chi tiết: họ xin mua gấu bông (không phải robot) vì đạt điểm tốt."}, {"type": "short", "q": "He (not come) ____ to the party tonight. He is ill.", "answer": "is not coming", "level": "VDC", "explain": "Kế hoạch tương lai ở thể phủ định: is not coming."}], "name": "Đề 10"}]}
