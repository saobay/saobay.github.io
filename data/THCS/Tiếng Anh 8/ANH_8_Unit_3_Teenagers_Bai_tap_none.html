. Many students find useful answers on the forum.", "statements": ["a) The forum is for old people.", "b) Teenagers share stories on the forum.", "c) They ask for advice there.", "d) Nobody finds the forum useful."], "answer": ["F", "T", "T", "F"], "explain": "a) sai vì diễn đàn dành cho tuổi teen; d) sai vì nhiều học sinh thấy diễn đàn hữu ích."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nJoining a club is a good way for teens to relax. At clubs, they meet friends with the same interests. They learn new skills and become more confident. However, teens should not join too many clubs, or they will have no time to rest.", "statements": ["a) Clubs help teens meet friends with the same interests.", "b) Club activities make teens less confident.", "c) Teens should join as many clubs as possible.", "d) Too many clubs can leave teens with no time to rest."], "answer": ["T", "F", "F", "T"], "explain": "b) sai vì câu lạc bộ giúp tự tin hơn; c) sai vì không nên tham gia quá nhiều."}, {"type": "short", "level": "VD", "q": "The school ______ (counsel) helps students with their problems.", "answer": "counsellor", "explain": "Cần danh từ chỉ người: counsel thành counsellor (cố vấn)."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oi' is pronounced differently from the others.", "options": ["A. destroy", "B. curious", "C. annoyed", "D. join"], "answer": "B", "explain": "annoyed, join, destroy có 'oy/oi' phát âm /ɔɪ/; curious có 'ur' phát âm /ʊə/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'our' is pronounced differently from the others.", "options": ["A. furious", "B. curious", "C. noisy", "D. tourist"], "answer": "C", "explain": "tourist, furious, curious có 'our/ur' phát âm /ʊə/; noisy có 'oi' phát âm /ɔɪ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. worried", "B. support", "C. relaxed", "D. depressed"], "answer": "B", "explain": "support nhấn âm tiết thứ 2; các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "An online ___ is a place where people discuss and share ideas.", "options": ["A. forum", "B. craft", "C. bullying", "D. pressure"], "answer": "A", "explain": "forum (diễn đàn) là nơi mọi người thảo luận trực tuyến."}, {"type": "mcq", "level": "TH", "q": "Doing yoga every morning helps me stay ___ and relaxed.", "options": ["A. depressed", "B. ashamed", "C. calm", "D. anxious"], "answer": "C", "explain": "stay calm and relaxed (giữ bình tĩnh và thư giãn) nhờ tập yoga."}, {"type": "mcq", "level": "VD", "q": "Hurry up, ___ you will miss the bus.", "options": ["A. and", "B. so", "C. or", "D. but"], "answer": "C", "explain": "Đây là lời cảnh báo với hai lựa chọn (nhanh lên hoặc lỡ xe) nên dùng or."}, {"type": "mcq", "level": "VDC", "q": "Minh: \"I am ashamed of my low marks.\" - His friend: \"___\"", "options": ["A. Marks do not matter at all.", "B. Do not worry, you can do better next time.", "C. You should be ashamed.", "D. Stop studying then."], "answer": "B", "explain": "An ủi bạn: đừng lo, lần sau bạn có thể làm tốt hơn."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nPeer pressure is the pressure from friends of the same age. Sometimes friends ask you to do things you do not want to do. You should learn to say no.", "statements": ["a) Peer pressure comes from friends of the same age.", "b) Friends always ask you to do good things.", "c) You should learn to say no.", "d) Peer pressure only comes from teachers."], "answer": ["T", "F", "T", "F"], "explain": "b) sai vì bạn bè đôi khi rủ làm điều mình không muốn; d) sai vì áp lực đến từ bạn cùng trang lứa."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nSome teenagers stay up late to use their phones. This is a bad habit because lack of sleep makes them tired and unable to concentrate. Doctors advise teens to stop using phones one hour before bed.", "statements": ["a) Staying up late with phones is a good habit.", "b) Lack of sleep makes it hard to concentrate.", "c) Doctors advise teens to use phones in bed.", "d) Teens should stop using phones one hour before bed."], "answer": ["F", "T", "F", "T"], "explain": "a) sai vì đây là thói quen xấu; c) sai vì bác sĩ khuyên ngừng dùng điện thoại trước khi ngủ."}, {"type": "short", "level": "VD", "q": "She could not ______ (concentration) on her homework.", "answer": "concentrate", "explain": "Sau could not là động từ nguyên thể: concentration thành concentrate (tập trung)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ur' is pronounced differently from the others.", "options": ["A. insurance", "B. pure", "C. sure", "D. coin"], "answer": "D", "explain": "sure, insurance, pure có 'ur' phát âm /ʊə/; coin có 'oi' phát âm /ɔɪ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'oor' is pronounced differently from the others.", "options": ["A. door", "B. spoor", "C. poor", "D. moor"], "answer": "A", "explain": "poor, moor, spoor có 'oor' phát âm /ʊə/; door phát âm /dɔː/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. forum", "B. donate", "C. practical", "D. bully"], "answer": "B", "explain": "donate nhấn âm tiết thứ 2; các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "___ is the act of hurting or frightening someone weaker than you.", "options": ["A. Pressure", "B. Craft", "C. Bullying", "D. Forum"], "answer": "C", "explain": "bullying (sự bắt nạt) là hành vi làm tổn thương người yếu hơn."}, {"type": "mcq", "level": "TH", "q": "You should not ___ others just because they are different from you.", "options": ["A. respect", "B. encourage", "C. support", "D. bully"], "answer": "D", "explain": "bully (bắt nạt) người khác vì họ khác mình là hành vi sai."}, {"type": "mcq", "level": "VD", "q": "Which word is NOT a coordinating conjunction?", "options": ["A. But", "B. Because", "C. And", "D. So"], "answer": "B", "explain": "And, but, so là liên từ kết hợp; because là liên từ phụ thuộc."}, {"type": "mcq", "level": "VDC", "q": "A: \"Would you like to join our teen club?\" - B: \"___\"", "options": ["A. Maybe never.", "B. No way.", "C. I would love to. When does it meet?", "D. Clubs are boring."], "answer": "C", "explain": "Nhận lời lịch sự và hỏi thêm thông tin về câu lạc bộ."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nHoa was shy last year. She joined the speaking club and practised a lot. Now she is confident when she talks in front of the class.", "statements": ["a) Hoa was shy last year.", "b) She joined the football club.", "c) She practised speaking a lot.", "d) She is still shy in front of the class."], "answer": ["T", "F", "T", "F"], "explain": "b) sai vì Hoa tham gia câu lạc bộ nói; d) sai vì giờ bạn ấy đã tự tin."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nParents sometimes do not understand their teenage children. Teens want more freedom, but parents worry about their safety. Both sides should listen to each other and talk calmly. Good communication can solve most problems.", "statements": ["a) Parents always understand their teenage children.", "b) Teens want more freedom.", "c) Parents never worry about their children.", "d) Good communication can solve most problems."], "answer": ["F", "T", "F", "T"], "explain": "a) sai vì đôi khi bố mẹ không hiểu con; c) sai vì bố mẹ lo lắng cho sự an toàn của con."}, {"type": "short", "level": "VD", "q": "Too much stress makes teenagers ______ (anxiety).", "answer": "anxious", "explain": "Sau make + tân ngữ cần tính từ: anxiety thành anxious (lo âu)."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oy' is pronounced differently from the others.", "options": ["A. enjoy", "B. royal", "C. loyal", "D. rural"], "answer": "D", "explain": "royal, loyal, enjoy có 'oy' phát âm /ɔɪ/; rural có 'ur' phát âm /ʊə/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'ur' is pronounced differently from the others.", "options": ["A. noisy", "B. obscure", "C. surely", "D. purely"], "answer": "A", "explain": "surely, purely, obscure có 'ur' phát âm /ʊə/; noisy có 'oi' phát âm /ɔɪ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. pressure", "B. counsellor", "C. concentrate", "D. delay"], "answer": "D", "explain": "delay nhấn âm tiết thứ 2; các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "Stay ___ and take a deep breath before the test.", "options": ["A. calm", "B. ashamed", "C. frustrated", "D. depressed"], "answer": "A", "explain": "stay calm (giữ bình tĩnh) là lời khuyên trước khi thi."}, {"type": "mcq", "level": "TH", "q": "Her teacher set a ___ for the science project: next Friday.", "options": ["A. pressure", "B. craft", "C. forum", "D. due date"], "answer": "D", "explain": "due date (hạn chót) nộp bài là thứ Sáu tuần tới."}, {"type": "mcq", "level": "VD", "q": "The film was long, ___ it was interesting.", "options": ["A. so", "B. or", "C. and", "D. but"], "answer": "D", "explain": "Hai vế đối lập (dài nhưng hay) nên dùng but."}, {"type": "mcq", "level": "VDC", "q": "Mum: \"You spend too much time on your phone.\" - Son: \"___\"", "options": ["A. Leave me alone.", "B. Phones are great.", "C. It is my phone.", "D. I know, I will cut down on it."], "answer": "D", "explain": "Phản hồi tích cực: con biết rồi, con sẽ bớt dùng điện thoại."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nThe teacher gave the class a project. The due date is next Friday. Students must finish their work before that day. Late work will get lower marks.", "statements": ["a) The project due date is next Friday.", "b) Students can finish after the due date.", "c) They must finish before that day.", "d) Late work will get higher marks."], "answer": ["T", "F", "T", "F"], "explain": "b) sai vì phải xong trước hạn; d) sai vì nộp muộn bị trừ điểm."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nDoing housework may sound boring, but it teaches teens useful life skills. Cooking, cleaning and washing clothes help them become independent. Many parents now ask their children to share the housework.", "statements": ["a) Housework teaches teens no useful skills.", "b) Cooking and cleaning help teens become independent.", "c) No parents ask children to do housework.", "d) Sharing housework is becoming common in families."], "answer": ["F", "T", "F", "T"], "explain": "a) sai vì việc nhà dạy kỹ năng sống; c) sai vì nhiều bố mẹ nhờ con chia sẻ việc nhà."}, {"type": "short", "level": "VD", "q": "He gave me some ______ (practice) advice.", "answer": "practical", "explain": "Trước danh từ advice cần tính từ: practice thành practical (thiết thực)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oi' is pronounced differently from the others.", "options": ["A. spoil", "B. appointment", "C. moisture", "D. mature"], "answer": "D", "explain": "moisture, appointment, spoil có 'oi' phát âm /ɔɪ/; mature có 'ure' phát âm /ʊə/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'our' is pronounced differently from the others.", "options": ["A. tour", "B. noisy", "C. detour", "D. contour"], "answer": "B", "explain": "tour, detour, contour có 'our' phát âm /ʊə/; noisy có 'oi' phát âm /ɔɪ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. social", "B. compare", "C. network", "D. media"], "answer": "B", "explain": "compare nhấn âm tiết thứ 2; các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "My teacher gave me some ___ advice about my future job.", "options": ["A. anxious", "B. ashamed", "C. calm", "D. practical"], "answer": "D", "explain": "practical advice (lời khuyên thiết thực) phù hợp với ngữ cảnh."}, {"type": "mcq", "level": "TH", "q": "Teenagers should learn to ___ their time between study and rest.", "options": ["A. pressure", "B. delay", "C. balance", "D. bully"], "answer": "C", "explain": "balance (cân bằng) thời gian giữa học và nghỉ ngơi."}, {"type": "mcq", "level": "VD", "q": "Which of the following is a simple sentence?", "options": ["A. I woke up late, so I missed breakfast.", "B. Teenagers need love and understanding.", "C. You can stay, or you can leave.", "D. He called me, but I did not answer."], "answer": "B", "explain": "Câu đơn chỉ có một mệnh đề độc lập: Teenagers need love and understanding."}, {"type": "mcq", "level": "VDC", "q": "A: \"I cannot sleep because of anxiety.\" - B: \"___\"", "options": ["A. Stay up all night.", "B. Try reading a book before bed.", "C. Do not sleep then.", "D. Drink more coffee."], "answer": "B", "explain": "Lời khuyên hợp lý: thử đọc sách trước khi ngủ để dễ ngủ hơn."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nNam studies hard, but he also plays sports. He balances his time between study and play. He sleeps eight hours every night.", "statements": ["a) Nam only studies and never plays sports.", "b) He balances study and play.", "c) He sleeps eight hours every night.", "d) He does not play sports."], "answer": ["F", "T", "T", "F"], "explain": "a) và d) sai vì Nam vừa học chăm vừa chơi thể thao."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nReading is one of the best habits for teenagers. It improves vocabulary and helps them concentrate better. Teens who read regularly often do better at school. Even 20 minutes of reading a day can make a big difference.", "statements": ["a) Reading helps improve vocabulary.", "b) Reading makes it harder to concentrate.", "c) Teens who read regularly often do better at school.", "d) 20 minutes of reading a day is useless."], "answer": ["T", "F", "T", "F"], "explain": "b) sai vì đọc sách giúp tập trung tốt hơn; d) sai vì 20 phút đọc mỗi ngày tạo khác biệt lớn."}, {"type": "short", "level": "VD", "q": "______ (bully) is a serious problem in many schools.", "answer": "Bullying", "explain": "Đầu câu cần danh từ làm chủ ngữ: bully thành Bullying (sự bắt nạt)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'our' is pronounced differently from the others.", "options": ["A. shout", "B. tour", "C. contour", "D. detour"], "answer": "A", "explain": "tour, detour, contour có 'our' phát âm /ʊə/; shout có 'ou' phát âm /aʊ/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose underlined 'oi' is pronounced differently from the others.", "options": ["A. choice", "B. courier", "C. voice", "D. rejoice"], "answer": "B", "explain": "choice, voice, rejoice có 'oi' phát âm /ɔɪ/; courier có 'our' phát âm /ʊə/ nên khác."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. anxious", "B. frustrated", "C. mention", "D. confident"], "answer": "B", "explain": "frustrated nhấn âm tiết thứ 2; các từ còn lại nhấn âm tiết thứ 1."}, {"type": "mcq", "level": "NB", "q": "Teenagers join clubs to make friends and share ___.", "options": ["A. pressures", "B. bullies", "C. forums", "D. interests"], "answer": "D", "explain": "share interests (chia sẻ sở thích) là cụm tự nhiên nhất."}, {"type": "mcq", "level": "TH", "q": "Joining a teen club is a good way to ___ new friends.", "options": ["A. pressure", "B. bully", "C. delay", "D. make"], "answer": "D", "explain": "make friends (kết bạn) khi tham gia câu lạc bộ tuổi teen."}, {"type": "mcq", "level": "VD", "q": "Study hard, ___ you will regret it later.", "options": ["A. so", "B. and", "C. or", "D. but"], "answer": "C", "explain": "Câu điều kiện ẩn với hai lựa chọn (học chăm hoặc sẽ hối hận) nên dùng or."}, {"type": "mcq", "level": "VDC", "q": "A: \"Thanks for listening to me.\" - B: \"___\"", "options": ["A. Bye.", "B. Whatever.", "C. Anytime. I am always here for you.", "D. Do not thank me."], "answer": "C", "explain": "Đáp lại lời cảm ơn một cách ấm áp, thể hiện sự quan tâm."}, {"type": "truefalse", "level": "NB", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nBefore a test, Lan feels nervous. She closes her eyes and takes deep breaths. This helps her stay calm. Then she does the test well.", "statements": ["a) Lan feels nervous before a test.", "b) She takes deep breaths to stay calm.", "c) Deep breaths do not help her.", "d) She does the test badly."], "answer": ["T", "T", "F", "F"], "explain": "c) và d) sai vì hít thở sâu giúp cô ấy bình tĩnh và làm bài tốt."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F).\nVolunteering is popular among teenagers in many countries. They help old people, clean the beach or teach young children. Volunteering makes them feel happy and more confident. It also looks good on their future job applications.", "statements": ["a) Volunteering is unpopular among teenagers.", "b) Volunteers help old people and clean the beach.", "c) Volunteering can make teens more confident.", "d) Volunteering is bad for future jobs."], "answer": ["F", "T", "T", "F"], "explain": "a) sai vì tình nguyện rất phổ biến; d) sai vì nó tốt cho hồ sơ xin việc sau này."}, {"type": "short", "level": "VD", "q": "Stay ______ (calmness) and breathe deeply.", "answer": "calm", "explain": "Sau stay cần tính từ: calmness thành calm (bình tĩnh)."}]}]}
