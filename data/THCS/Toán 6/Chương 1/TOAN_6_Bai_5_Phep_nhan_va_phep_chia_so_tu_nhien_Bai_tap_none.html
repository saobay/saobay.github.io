<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Tính tích $12 \\times 5$.","options":["A. $60$","B. $55$","C. $65$","D. $70$"],"answer":"A","explain":"Ta có $12 \\times 5 = 60$."},{"type":"mcq","level":"NB","q":"Trong phép nhân $7 \\times 8 = 56$, số $56$ được gọi là gì?","options":["A. Thừa số","B. Tích","C. Thương","D. Số dư"],"answer":"B","explain":"Trong phép nhân $7 \\times 8 = 56$, các số $7$ và $8$ là thừa số, còn kết quả $56$ là tích."},{"type":"mcq","level":"TH","q":"Áp dụng tính chất giao hoán của phép nhân, $36 \\times 25 = 25 \\times$ bao nhiêu?","options":["A. $25$","B. $36$","C. $50$","D. $12$"],"answer":"B","explain":"Theo tính chất giao hoán $a \\times b = b \\times a$ nên $36 \\times 25 = 25 \\times 36$."},{"type":"mcq","level":"TH","q":"Tính $19 \\times 4 + 19 \\times 6$.","options":["A. $190$","B. $180$","C. $200$","D. $210$"],"answer":"A","explain":"Dùng tính chất phân phối: $19 \\times 4 + 19 \\times 6 = 19 \\times (4 + 6) = 19 \\times 10 = 190$."},{"type":"mcq","level":"VD","q":"Tính nhanh $25 \\times 36$.","options":["A. $900$","B. $800$","C. $950$","D. $1000$"],"answer":"A","explain":"Tách $36 = 4 \\times 9$ rồi dùng tính chất kết hợp: $25 \\times 36 = 25 \\times 4 \\times 9 = 100 \\times 9 = 900$."},{"type":"mcq","level":"VDC","q":"Biết $a \\times b = 48$ và $b = 3 \\times a$, trong đó $a, b$ là số tự nhiên. Giá trị của $a$ là","options":["A. $4$","B. $6$","C. $8$","D. $12$"],"answer":"A","explain":"Thay $b = 3 \\times a$ vào $a \\times b = 48$ được $a \\times 3 \\times a = 48$, tức $3 \\times a \\times a = 48$ nên $a \\times a = 16$. Vậy $a = 4$ (vì $4 \\times 4 = 16$)."},{"type":"truefalse","level":"TH","q":"Xét phép chia $37 = 5 \\times 7 + 2$. Xét tính đúng sai của các khẳng định sau:","statements":["a) Số bị chia là $37$.","b) Thương của phép chia là $5$.","c) Số dư của phép chia là $2$.","d) Số chia là $7$."],"answer":["T","F","T","F"],"explain":"Trong $37 = 5 \\times 7 + 2$: số bị chia là $37$ (a đúng), số chia là $5$ (d sai), thương là $7$ (b sai), số dư là $2$ (c đúng, thỏa mãn $2$ nhỏ hơn $5$)."},{"type":"truefalse","level":"VDC","q":"Chia số tự nhiên $a = 63$ cho $b = 8$. Xét tính đúng sai của các khẳng định sau:","statements":["a) Thương của phép chia là $7$.","b) Số dư của phép chia là $7$.","c) Nếu thêm $1$ đơn vị vào $a$ thì số dư của phép chia mới là $8$.","d) $63$ chia hết cho $8$."],"answer":["T","T","F","F"],"explain":"Ta có $63 = 8 \\times 7 + 7$ nên thương là $7$ (a đúng), số dư là $7$ (b đúng, $7$ nhỏ hơn $8$). Với $a = 64$ thì $64 = 8 \\times 8 + 0$ nên số dư là $0$, không phải $8$ (c sai; số dư luôn nhỏ hơn số chia). $63$ không chia hết cho $8$ vì số dư bằng $7$ khác $0$ (d sai)."},{"type":"short","level":"NB","q":"Tính thương của phép chia $96 : 12$.","answer":"8","explain":"Vì $96 = 12 \\times 8$ nên $96 : 12 = 8$."},{"type":"short","level":"VD","q":"Tìm $x$ biết $x \\times 7 = 84$.","answer":"12","explain":"Muốn tìm thừa số chưa biết, lấy tích chia cho thừa số đã biết: $x = 84 : 7 = 12$."}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Tính tích $7 \\times 9$.","options":["A. $63$","B. $62$","C. $56$","D. $72$"],"answer":"A","explain":"Ta có $7 \\times 9 = 63$."},{"type":"mcq","level":"NB","q":"Khẳng định nào sau đây là đúng?","options":["A. Chỉ có số $0$ nhân với $1$ mới bằng chính nó","B. Chỉ có số $1$ nhân với $1$ mới bằng chính nó","C. Mọi số tự nhiên nhân với $1$ đều bằng chính nó","D. Không có số tự nhiên nào như vậy"],"answer":"C","explain":"Theo tính chất nhân với $1$: $a \\times 1 = 1 \\times a = a$ với mọi số tự nhiên $a$."},{"type":"mcq","level":"TH","q":"Tính $0 \\times 2026$.","options":["A. $2026$","B. $0$","C. $1$","D. $4052$"],"answer":"B","explain":"Theo tính chất nhân với $0$: $a \\times 0 = 0$ với mọi số tự nhiên $a$, nên $0 \\times 2026 = 0$."},{"type":"mcq","level":"TH","q":"Tính $45 \\times 102$.","options":["A. $4590$","B. $4510$","C. $4509$","D. $4690$"],"answer":"A","explain":"Dùng tính chất phân phối: $45 \\times 102 = 45 \\times (100 + 2) = 45 \\times 100 + 45 \\times 2 = 4500 + 90 = 4590$."},{"type":"mcq","level":"VD","q":"Tính nhanh $125 \\times 32$.","options":["A. $4000$","B. $3000$","C. $3500$","D. $4500$"],"answer":"A","explain":"Tách $32 = 8 \\times 4$ rồi dùng tính chất kết hợp: $125 \\times 32 = 125 \\times 8 \\times 4 = 1000 \\times 4 = 4000$."},{"type":"mcq","level":"VDC","q":"Tích của hai số tự nhiên bằng $72$. Biết số lớn gấp $2$ lần số bé. Số bé là","options":["A. $6$","B. $8$","C. $4$","D. $9$"],"answer":"A","explain":"Gọi số bé là $a$ thì số lớn là $2 \\times a$, tích là $a \\times 2 \\times a = 72$ nên $a \\times a = 36$. Vì $6 \\times 6 = 36$ nên số bé là $6$ (số lớn là $12$, kiểm tra $6 \\times 12 = 72$)."},{"type":"truefalse","level":"TH","q":"Xét tính đúng sai của các khẳng định sau về phép nhân các số tự nhiên:","statements":["a) $a \\times b = b \\times a$ với mọi số tự nhiên $a, b$.","b) $a \\times 0 = a$ với mọi số tự nhiên $a$.","c) $(a \\times b) \\times c = a \\times (b \\times c)$ với mọi số tự nhiên $a, b, c$.","d) $1 \\times a = 1$ với mọi số tự nhiên $a$."],"answer":["T","F","T","F"],"explain":"a) Đúng theo tính chất giao hoán. b) Sai: $a \\times 0 = 0$. c) Đúng theo tính chất kết hợp. d) Sai: $1 \\times a = a$."},{"type":"truefalse","level":"VDC","q":"Chia $100$ cho $7$. Xét tính đúng sai của các khẳng định sau:","statements":["a) Thương của phép chia là $14$.","b) Số dư của phép chia là $3$.","c) Nếu cộng thêm $5$ vào $100$ thì phép chia mới là phép chia hết.","d) Số dư lớn nhất có thể khi chia một số cho $7$ là $6$."],"answer":["T","F","T","T"],"explain":"Ta có $100 = 7 \\times 14 + 2$ nên thương là $14$ (a đúng), số dư là $2$ (b sai). $100 + 5 = 105 = 7 \\times 15$ nên là phép chia hết (c đúng). Số dư luôn nhỏ hơn số chia nên số dư lớn nhất khi chia cho $7$ là $6$ (d đúng)."},{"type":"short","level":"NB","q":"Tính thương của phép chia $84 : 7$.","answer":"12","explain":"Vì $84 = 7 \\times 12$ nên $84 : 7 = 12$."},{"type":"short","level":"VD","q":"Tìm số bị chia $x$ biết $x : 6 = 13$ (phép chia hết).","answer":"78","explain":"Muốn tìm số bị chia, lấy số chia nhân với thương: $x = 6 \\times 13 = 78$."}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Tính tích $15 \\times 4$.","options":["A. $45$","B. $60$","C. $56$","D. $64$"],"answer":"B","explain":"Ta có $15 \\times 4 = 60$."},{"type":"mcq","level":"NB","q":"Trong phép chia $48 : 6 = 8$, số $6$ được gọi là gì?","options":["A. Số bị chia","B. Số chia","C. Thương","D. Số dư"],"answer":"B","explain":"Trong phép chia $48 : 6 = 8$: $48$ là số bị chia, $6$ là số chia, $8$ là thương."},{"type":"mcq","level":"TH","q":"Đẳng thức $(2 \\times 50) \\times 7 = 2 \\times (50 \\times 7)$ minh họa tính chất nào của phép nhân?","options":["A. Tính chất giao hoán","B. Tính chất kết hợp","C. Tính chất phân phối","D. Tính chất nhân với $1$"],"answer":"B","explain":"Đẳng thức có dạng $(a \\times b) \\times c = a \\times (b \\times c)$, đó là tính chất kết hợp của phép nhân."},{"type":"mcq","level":"TH","q":"Tính $27 \\times 11$.","options":["A. $297$","B. $287$","C. $307$","D. $277$"],"answer":"A","explain":"Dùng tính chất phân phối: $27 \\times 11 = 27 \\times (10 + 1) = 27 \\times 10 + 27 = 270 + 27 = 297$."},{"type":"mcq","level":"VD","q":"Tính nhanh $99 \\times 18$.","options":["A. $1782$","B. $1800$","C. $1780$","D. $1792$"],"answer":"A","explain":"Viết $99 = 100 - 1$ rồi dùng tính chất phân phối đối với phép trừ: $99 \\times 18 = 100 \\times 18 - 1 \\times 18 = 1800 - 18 = 1782$."},{"type":"mcq","level":"VDC","q":"Tổng của số bị chia, số chia, thương và số dư trong một phép chia bằng $60$. Biết thương bằng $4$ và số dư bằng $3$. Số bị chia là","options":["A. $43$","B. $40$","C. $45$","D. $53$"],"answer":"A","explain":"Gọi số bị chia là $a$, số chia là $b$. Ta có $a + b + 4 + 3 = 60$ nên $a + b = 53$. Mặt khác $a = 4 \\times b + 3$. Thay vào: $4 \\times b + 3 + b = 53$, tức $5 \\times b = 50$ nên $b = 10$. Vậy $a = 4 \\times 10 + 3 = 43$ (kiểm tra số dư $3$ nhỏ hơn số chia $10$)."},{"type":"truefalse","level":"TH","q":"Chia $43$ cho $6$ ta được $43 = 6 \\times 7 + 1$. Xét tính đúng sai của các khẳng định sau:","statements":["a) Đẳng thức $43 = 6 \\times 7 + 1$ là đúng.","b) Thương của phép chia là $6$.","c) Số dư của phép chia là $1$.","d) $43$ chia hết cho $6$."],"answer":["T","F","T","F"],"explain":"a) Đúng: $6 \\times 7 + 1 = 42 + 1 = 43$. Trong phép chia này số chia là $6$, thương là $7$ (b sai), số dư là $1$ (c đúng). Vì số dư bằng $1$ khác $0$ nên $43$ không chia hết cho $6$ (d sai)."},{"type":"truefalse","level":"VDC","q":"Xét tính đúng sai của các khẳng định sau về phép chia:","statements":["a) Mọi phép chia cho $0$ đều không xác định.","b) $0 : 5 = 0$.","c) Trong mọi phép chia có dư, số dư luôn nhỏ hơn số chia.","d) $5 : 0 = 0$."],"answer":["T","T","T","F"],"explain":"a) Đúng: không được chia cho $0$. b) Đúng: $0 = 5 \\times 0$ nên $0 : 5 = 0$. c) Đúng: đây là điều kiện bắt buộc của phép chia có dư. d) Sai: $5 : 0$ không xác định."},{"type":"short","level":"NB","q":"Tính thương của phép chia $125 : 5$.","answer":"25","explain":"Vì $125 = 5 \\times 25$ nên $125 : 5 = 25$."},{"type":"short","level":"VD","q":"Tìm số chia $x$ biết $96 : x = 12$ (phép chia hết).","answer":"8","explain":"Muốn tìm số chia, lấy số bị chia chia cho thương: $x = 96 : 12 = 8$."}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Tính tích $9 \\times 8$.","options":["A. $72$","B. $71$","C. $81$","D. $63$"],"answer":"A","explain":"Ta có $9 \\times 8 = 72$."},{"type":"mcq","level":"NB","q":"$a \\times (b + c)$ bằng biểu thức nào sau đây?","options":["A. $a \\times b + c$","B. $a + b \\times c$","C. $a \\times b + a \\times c$","D. $a \\times b \\times c$"],"answer":"C","explain":"Theo tính chất phân phối của phép nhân đối với phép cộng: $a \\times (b + c) = a \\times b + a \\times c$."},{"type":"mcq","level":"TH","q":"Tính nhanh $16 \\times 5$.","options":["A. $70$","B. $75$","C. $80$","D. $85$"],"answer":"C","explain":"Viết $16 = 8 \\times 2$: $16 \\times 5 = 8 \\times 2 \\times 5 = 8 \\times 10 = 80$."},{"type":"mcq","level":"TH","q":"Số dư của phép chia $29$ cho $4$ là","options":["A. $3$","B. $2$","C. $1$","D. $0$"],"answer":"C","explain":"Ta có $29 = 4 \\times 7 + 1$ nên số dư là $1$ (thỏa mãn $1$ nhỏ hơn $4$)."},{"type":"mcq","level":"VD","q":"Tính nhanh $8 \\times 4 \\times 25$.","options":["A. $800$","B. $200$","C. $8000$","D. $80$"],"answer":"A","explain":"Nhóm $4 \\times 25 = 100$ trước (tính chất giao hoán và kết hợp): $8 \\times 4 \\times 25 = 8 \\times 100 = 800$."},{"type":"mcq","level":"VDC","q":"Một cửa hàng có $125$ kg gạo, định đóng vào các bao, mỗi bao $8$ kg. Cần ít nhất bao nhiêu bao để đóng hết số gạo đó?","options":["A. $15$ bao","B. $16$ bao","C. $17$ bao","D. $14$ bao"],"answer":"B","explain":"Ta có $125 = 8 \\times 15 + 5$ nên đóng được $15$ bao đầy và còn dư $5$ kg gạo. Số gạo dư này cần thêm $1$ bao nữa, vậy cần ít nhất $15 + 1 = 16$ bao."},{"type":"truefalse","level":"TH","q": "Xét tính đúng, sai của các khẳng định sau đây:","statements":["a) $5 \\times 0 = 0$.","b) $0 : 7$ là phép chia không xác định.","c) $7 : 0 = 0$.","d) $1 \\times 999 = 999$."],"answer":["T","F","F","T"],"explain":"a) Đúng: mọi số nhân với $0$ đều bằng $0$. b) Sai: $0 : 7 = 0$ vì $0 = 7 \\times 0$. c) Sai: không được chia cho $0$. d) Đúng: $1 \\times a = a$."},{"type":"truefalse","level":"VDC","q":"Xét tính đúng sai của các khẳng định sau về phép chia có dư $a = b \\times q + r$:","statements":["a) Với $b$ khác $0$, luôn tìm được duy nhất các số tự nhiên $q, r$ thỏa mãn đẳng thức.","b) Nếu $r = 0$ thì $a$ chia hết cho $b$.","c) Số dư $r$ có thể bằng số chia $b$.","d) Thương của phép chia $50$ cho $9$ là $6$."],"answer":["T","T","F","F"],"explain":"a) Đúng theo định lí về phép chia có dư. b) Đúng: $a = b \\times q$ nghĩa là $a$ chia hết cho $b$. c) Sai: số dư luôn nhỏ hơn số chia. d) Sai: $50 = 9 \\times 5 + 5$ nên thương là $5$."},{"type":"short","level":"NB","q":"Tính tích $13 \\times 6$.","answer":"78","explain":"Ta có $13 \\times 6 = 78$."},{"type":"short","level":"VD","q":"Tìm thừa số $x$ biết $9 \\times x = 108$.","answer":"12","explain":"Muốn tìm thừa số chưa biết, lấy tích chia cho thừa số đã biết: $x = 108 : 9 = 12$."}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Tính tích $11 \\times 7$.","options":["A. $77$","B. $76$","C. $78$","D. $70$"],"answer":"A","explain":"Ta có $11 \\times 7 = 77$."},{"type":"mcq","level":"NB","q":"Kết quả của phép chia $36 : 9$ là","options":["A. $3$","B. $4$","C. $5$","D. $6$"],"answer":"B","explain":"Vì $36 = 9 \\times 4$ nên $36 : 9 = 4$."},{"type":"mcq","level":"TH","q":"Áp dụng tính chất phân phối, $7 \\times 53 = 7 \\times (50 + 3)$ bằng","options":["A. $371$","B. $361$","C. $381$","D. $370$"],"answer":"A","explain":"$7 \\times (50 + 3) = 7 \\times 50 + 7 \\times 3 = 350 + 21 = 371$."},{"type":"mcq","level":"TH","q":"Trong phép chia $50 = 8 \\times 6 + 2$, số dư là","options":["A. $8$","B. $6$","C. $2$","D. $50$"],"answer":"C","explain":"Trong $50 = 8 \\times 6 + 2$: $50$ là số bị chia, $8$ là số chia, $6$ là thương, $2$ là số dư (thỏa mãn $2$ nhỏ hơn $8$)."},{"type":"mcq","level":"VD","q":"Tính nhanh $4 \\times 37 \\times 25$.","options":["A. $3700$","B. $370$","C. $37000$","D. $730$"],"answer":"A","explain":"Nhóm $4 \\times 25 = 100$ trước: $4 \\times 37 \\times 25 = 37 \\times 100 = 3700$."},{"type":"mcq","level":"VDC","q":"Hai số tự nhiên có tích bằng $100$ và hiệu bằng $15$. Số lớn trong hai số đó là","options":["A. $25$","B. $20$","C. $15$","D. $10$"],"answer":"B","explain":"Thử các cặp số có tích bằng $100$: $10 \\times 10 = 100$ (hiệu $0$), $20 \\times 5 = 100$ (hiệu $15$), $25 \\times 4 = 100$ (hiệu $21$). Vậy hai số là $20$ và $5$, số lớn là $20$."},{"type":"truefalse","level":"TH","q": "Các khẳng định dưới đây đúng hay sai?","statements":["a) $12 \\times 11 = 132$.","b) $144 : 12 = 11$.","c) $0 \\times 15 = 15$.","d) $1 \\times 15 = 15$."],"answer":["T","F","F","T"],"explain":"a) Đúng: $12 \\times 11 = 12 \\times 10 + 12 = 132$. b) Sai: $144 : 12 = 12$ vì $12 \\times 12 = 144$. c) Sai: $0 \\times 15 = 0$. d) Đúng: $1 \\times a = a$."},{"type":"truefalse","level":"VDC","q":"Một số tự nhiên $n$ chia cho $6$ dư $4$. Xét tính đúng sai của các khẳng định sau:","statements":["a) $n$ có thể bằng $10$.","b) $n$ có thể bằng $16$.","c) $n$ có thể bằng $18$.","d) Số dư lớn nhất có thể khi chia cho $6$ là $5$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $10 = 6 \\times 1 + 4$. b) Đúng: $16 = 6 \\times 2 + 4$. c) Sai: $18 = 6 \\times 3 + 0$ nên $18$ chia hết cho $6$, không dư $4$. d) Đúng: số dư luôn nhỏ hơn số chia nên số dư lớn nhất khi chia cho $6$ là $5$."},{"type":"short","level":"NB","q":"Tính tích $14 \\times 5$.","answer":"70","explain":"Ta có $14 \\times 5 = 70$."},{"type":"short","level":"VD","q":"Tìm số bị chia $x$ biết $x : 8 = 9$ dư $5$.","answer":"77","explain":"Áp dụng công thức $a = b \\times q + r$: $x = 8 \\times 9 + 5 = 72 + 5 = 77$."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Tính tích $6 \\times 12$.","options":["A. $62$","B. $66$","C. $72$","D. $76$"],"answer":"C","explain":"Ta có $6 \\times 12 = 72$."},{"type":"mcq","level":"NB","q":"Phép tính $20 : 4 = 5$ còn được viết dưới dạng nào sau đây?","options":["A. $20 = 4 + 5$","B. $20 = 4 \\times 5$","C. $20 = 4 - 5$","D. $20 = 5 - 4$"],"answer":"B","explain":"Theo định nghĩa phép chia hết: $20 : 4 = 5$ vì $20 = 4 \\times 5$."},{"type":"mcq","level":"TH","q":"Tính nhanh $25 \\times 4 \\times 7$.","options":["A. $700$","B. $280$","C. $175$","D. $1000$"],"answer":"A","explain":"Nhóm $25 \\times 4 = 100$ trước (tính chất kết hợp): $25 \\times 4 \\times 7 = 100 \\times 7 = 700$."},{"type":"mcq","level":"TH","q":"Số bị chia là $73$, số chia là $9$. Thương và số dư của phép chia là","options":["A. Thương $8$, dư $1$","B. Thương $7$, dư $10$","C. Thương $8$, dư $2$","D. Thương $9$, dư $1$"],"answer":"A","explain":"Ta có $73 = 9 \\times 8 + 1$ nên thương là $8$, số dư là $1$ (thỏa mãn $1$ nhỏ hơn $9$). Đáp án B sai vì số dư $10$ lớn hơn số chia $9$."},{"type":"mcq","level":"VD","q":"Tính nhanh $15 \\times 98$.","options":["A. $1470$","B. $1500$","C. $14700$","D. $1407$"],"answer":"A","explain":"Viết $98 = 100 - 2$ rồi dùng tính chất phân phối đối với phép trừ: $15 \\times 98 = 15 \\times 100 - 15 \\times 2 = 1500 - 30 = 1470$."},{"type":"mcq","level":"VDC","q":"Lớp 6A có $45$ học sinh xếp thành các hàng, mỗi hàng $6$ bạn. Hỏi xếp được nhiều nhất bao nhiêu hàng và còn thừa mấy bạn?","options":["A. $7$ hàng, thừa $3$ bạn","B. $8$ hàng vừa đủ","C. $7$ hàng, thừa $2$ bạn","D. $6$ hàng, thừa $9$ bạn"],"answer":"A","explain":"Ta có $45 = 6 \\times 7 + 3$ nên xếp được nhiều nhất $7$ hàng ($7 \\times 6 = 42$ bạn) và còn thừa $3$ bạn."},{"type":"truefalse","level":"TH","q": "Hãy cho biết mỗi khẳng định sau là đúng hay sai:","statements":["a) Tích của hai số tự nhiên luôn là một số tự nhiên.","b) $a : 1 = a$ với mọi số tự nhiên $a$.","c) $a : a = 0$ với mọi số tự nhiên $a$ khác $0$.","d) $0 : a = a$ với mọi số tự nhiên $a$ khác $0$."],"answer":["T","T","F","F"],"explain":"a) Đúng theo định nghĩa phép nhân. b) Đúng: $a = 1 \\times a$ nên $a : 1 = a$. c) Sai: $a : a = 1$ vì $a = a \\times 1$. d) Sai: $0 : a = 0$ vì $0 = a \\times 0$."},{"type":"truefalse","level":"VDC","q":"Xét tính đúng sai của các cách tính nhanh sau:","statements":["a) $36 \\times 25 = (9 \\times 4) \\times 25 = 9 \\times 100 = 900$.","b) $47 \\times 99 = 47 \\times 100 - 47 = 4653$.","c) $125 \\times 16 = 125 \\times 8 \\times 2 = 1000 \\times 2 = 2000$.","d) $13 \\times 101 = 1300 + 3 = 1303$."],"answer":["T","T","T","F"],"explain":"a) Đúng: tách $36 = 9 \\times 4$ rồi nhóm $4 \\times 25 = 100$. b) Đúng: $47 \\times 99 = 47 \\times (100 - 1) = 4700 - 47 = 4653$. c) Đúng: $16 = 8 \\times 2$ và $125 \\times 8 = 1000$. d) Sai: $13 \\times 101 = 13 \\times 100 + 13 = 1300 + 13 = 1313$."},{"type":"short","level":"NB","q":"Tính thương của phép chia $72 : 8$.","answer":"9","explain":"Vì $72 = 8 \\times 9$ nên $72 : 8 = 9$."},{"type":"short","level":"VD","q":"Tìm $x$ biết $5 \\times x + 12 = 72$.","answer":"12","explain":"Ta có $5 \\times x = 72 - 12 = 60$, suy ra $x = 60 : 5 = 12$."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Tính tích $8 \\times 11$.","options":["A. $88$","B. $80$","C. $86$","D. $98$"],"answer":"A","explain":"Ta có $8 \\times 11 = 88$."},{"type":"mcq","level":"NB","q":"$a \\times 1 = 1 \\times a$ bằng","options":["A. $1$","B. $0$","C. $a$","D. $2 \\times a$"],"answer":"C","explain":"Theo tính chất nhân với $1$: $a \\times 1 = 1 \\times a = a$ với mọi số tự nhiên $a$."},{"type":"mcq","level":"TH","q":"Tính $3 \\times 4 \\times 5$.","options":["A. $60$","B. $70$","C. $12$","D. $20$"],"answer":"A","explain":"Ta có $3 \\times 4 \\times 5 = 12 \\times 5 = 60$."},{"type":"mcq","level":"TH","q":"Số dư của phép chia $58$ cho $7$ là","options":["A. $2$","B. $3$","C. $1$","D. $4$"],"answer":"A","explain":"Ta có $58 = 7 \\times 8 + 2$ nên số dư là $2$ (thỏa mãn $2$ nhỏ hơn $7$)."},{"type":"mcq","level":"VD","q":"Tính nhanh $35 \\times 12$.","options":["A. $420$","B. $400$","C. $360$","D. $440$"],"answer":"A","explain":"Dùng tính chất phân phối: $35 \\times 12 = 35 \\times (10 + 2) = 35 \\times 10 + 35 \\times 2 = 350 + 70 = 420$."},{"type":"mcq","level":"VDC","q":"Một số tự nhiên chia cho $5$ được thương là $12$ và số dư là số dư lớn nhất có thể. Số đó là","options":["A. $64$","B. $65$","C. $60$","D. $61$"],"answer":"A","explain":"Số dư luôn nhỏ hơn số chia nên số dư lớn nhất khi chia cho $5$ là $4$. Áp dụng $a = b \\times q + r$: số cần tìm là $5 \\times 12 + 4 = 64$."},{"type":"truefalse","level":"TH","q": "Đánh giá tính đúng, sai của các phát biểu sau:","statements":["a) $9 \\times 9 = 81$.","b) $81 : 9 = 8$.","c) Trong phép chia hết, số dư bằng $0$.","d) $a \\times b = a + b$ với mọi số tự nhiên $a, b$."],"answer":["T","F","T","F"],"explain":"a) Đúng: $9 \\times 9 = 81$. b) Sai: $81 : 9 = 9$ vì $9 \\times 9 = 81$. c) Đúng theo định nghĩa phép chia hết. d) Sai, ví dụ $2 \\times 3 = 6$ còn $2 + 3 = 5$."},{"type":"truefalse","level":"VDC","q":"Cho đẳng thức $a = 9 \\times q + 5$, trong đó $a, q$ là số tự nhiên. Xét tính đúng sai của các khẳng định sau:","statements":["a) $a$ chia cho $9$ dư $5$.","b) $q$ có thể bằng $0$.","c) Số dư $5$ thỏa mãn điều kiện nhỏ hơn số chia $9$.","d) Nếu $q = 3$ thì $a = 41$."],"answer":["T","T","T","F"],"explain":"a) Đúng theo dạng $a = b \\times q + r$. b) Đúng: $q = 0$ cho $a = 5$, vẫn là số tự nhiên. c) Đúng: $5$ nhỏ hơn $9$. d) Sai: $q = 3$ cho $a = 9 \\times 3 + 5 = 32$, không phải $41$."},{"type":"short","level":"NB","q":"Tính thương của phép chia $56 : 7$.","answer":"8","explain":"Vì $56 = 7 \\times 8$ nên $56 : 7 = 8$."},{"type":"short","level":"VD","q":"Tìm số chia $x$ biết $132 : x = 11$ (phép chia hết).","answer":"12","explain":"Muốn tìm số chia, lấy số bị chia chia cho thương: $x = 132 : 11 = 12$."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Tính tích $13 \\times 4$.","options":["A. $52$","B. $48$","C. $56$","D. $42$"],"answer":"A","explain":"Ta có $13 \\times 4 = 52$."},{"type":"mcq","level":"NB","q":"Trong phép chia có dư $a = b \\times q + r$, chữ $r$ được gọi là gì?","options":["A. Thương","B. Số dư","C. Số chia","D. Số bị chia"],"answer":"B","explain":"Trong $a = b \\times q + r$: $a$ là số bị chia, $b$ là số chia, $q$ là thương, $r$ là số dư."},{"type":"mcq","level":"TH","q":"Tính nhanh $20 \\times 35$.","options":["A. $700$","B. $600$","C. $750$","D. $650$"],"answer":"A","explain":"Viết $20 = 2 \\times 10$: $20 \\times 35 = 2 \\times 10 \\times 35 = 2 \\times 350 = 700$."},{"type":"mcq","level":"TH","q":"Tính thương $105 : 15$.","options":["A. $6$","B. $7$","C. $8$","D. $5$"],"answer":"B","explain":"Vì $105 = 15 \\times 7$ nên $105 : 15 = 7$."},{"type":"mcq","level":"VD","q":"Tính nhanh $48 \\times 25$.","options":["A. $1200$","B. $1000$","C. $1250$","D. $1100$"],"answer":"A","explain":"Tách $48 = 12 \\times 4$ rồi nhóm $4 \\times 25 = 100$: $48 \\times 25 = 12 \\times 4 \\times 25 = 12 \\times 100 = 1200$."},{"type":"mcq","level":"VDC","q":"Hai số tự nhiên có tổng bằng $30$ và tích bằng $221$. Hiệu của số lớn trừ số bé là","options":["A. $4$","B. $5$","C. $6$","D. $3$"],"answer":"A","explain":"Thử các cặp số có tổng bằng $30$: $13 + 17 = 30$ và $13 \\times 17 = 221$. Vậy hai số là $13$ và $17$, hiệu là $17 - 13 = 4$."},{"type":"truefalse","level":"TH","q": "Xác định tính đúng, sai của từng khẳng định sau:","statements":["a) $25 \\times 4 = 100$.","b) $100 : 25 = 5$.","c) $1 \\times 1 = 1$.","d) $10 : 10 = 0$."],"answer":["T","F","T","F"],"explain":"a) Đúng: $25 \\times 4 = 100$. b) Sai: $100 : 25 = 4$ vì $25 \\times 4 = 100$. c) Đúng: $1 \\times 1 = 1$. d) Sai: $10 : 10 = 1$ vì $10 = 10 \\times 1$."},{"type":"truefalse","level":"VDC","q":"Xét tính đúng sai của các khẳng định sau về phép chia có dư:","statements":["a) Chia số tự nhiên $a$ cho $b$ (với $b$ khác $0$) luôn tìm được duy nhất thương $q$ và số dư $r$.","b) Nếu $a$ nhỏ hơn $b$ thì thương bằng $0$ và số dư bằng $a$.","c) $7 : 9 = 0$ dư $7$.","d) Số dư của một phép chia có thể là số âm."],"answer":["T","T","T","F"],"explain":"a) Đúng theo định lí về phép chia có dư. b) Đúng: $a = b \\times 0 + a$ với $a$ nhỏ hơn $b$. c) Đúng: $7 = 9 \\times 0 + 7$. d) Sai: số dư là số tự nhiên nên không thể là số âm."},{"type":"short","level":"NB","q":"Tính tích $15 \\times 6$.","answer":"90","explain":"Ta có $15 \\times 6 = 90$."},{"type":"short","level":"VD","q":"Tính nhanh $2 \\times 26 \\times 50$.","answer":"2600","explain":"Nhóm $2 \\times 50 = 100$ trước: $2 \\times 26 \\times 50 = 26 \\times 100 = 2600$."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tính tích $7 \\times 12$.","options":["A. $74$","B. $84$","C. $72$","D. $94$"],"answer":"B","explain":"Ta có $7 \\times 12 = 84$."},{"type":"mcq","level":"NB","q":"$a \\times 0 = 0 \\times a$ bằng","options":["A. $a$","B. $1$","C. $0$","D. $2 \\times a$"],"answer":"C","explain":"Theo tính chất nhân với $0$: $a \\times 0 = 0 \\times a = 0$ với mọi số tự nhiên $a$."},{"type":"mcq","level":"TH","q":"Chia $100$ cho $11$. Thương và số dư của phép chia là","options":["A. Thương $9$, dư $1$","B. Thương $10$, dư $1$","C. Thương $9$, dư $2$","D. Thương $8$, dư $12$"],"answer":"A","explain":"Ta có $100 = 11 \\times 9 + 1$ nên thương là $9$, số dư là $1$ (thỏa mãn $1$ nhỏ hơn $11$). Đáp án D sai vì số dư $12$ lớn hơn số chia $11$."},{"type":"mcq","level":"TH","q":"Tính $17 \\times 9$.","options":["A. $153$","B. $143$","C. $163$","D. $151$"],"answer":"A","explain":"Viết $9 = 10 - 1$ rồi dùng tính chất phân phối đối với phép trừ: $17 \\times 9 = 17 \\times 10 - 17 = 170 - 17 = 153$."},{"type":"mcq","level":"VD","q":"Tính nhanh $250 \\times 24$.","options":["A. $6000$","B. $600$","C. $5000$","D. $6250$"],"answer":"A","explain":"Tách $24 = 4 \\times 6$ rồi nhóm $250 \\times 4 = 1000$: $250 \\times 24 = 250 \\times 4 \\times 6 = 1000 \\times 6 = 6000$."},{"type":"mcq","level":"VDC","q":"Ba bạn An, Bình, Chi góp tiền mua quà. An góp gấp đôi Bình, Chi góp gấp ba Bình, tổng số tiền ba bạn góp là $120$ nghìn đồng. Bình đã góp bao nhiêu?","options":["A. $20$ nghìn đồng","B. $30$ nghìn đồng","C. $15$ nghìn đồng","D. $24$ nghìn đồng"],"answer":"A","explain":"Gọi số tiền Bình góp là $x$ (nghìn đồng). Khi đó An góp $2 \\times x$, Chi góp $3 \\times x$. Tổng là $x + 2 \\times x + 3 \\times x = 6 \\times x = 120$ nên $x = 120 : 6 = 20$. Vậy Bình góp $20$ nghìn đồng."},{"type":"truefalse","level":"TH","q": "Trong các khẳng định sau, khẳng định nào đúng, khẳng định nào sai?","statements":["a) $6 \\times 7 = 42$.","b) $42 : 6 = 8$.","c) $42 : 7 = 6$.","d) $0 \\times 42 = 42$."],"answer":["T","F","T","F"],"explain":"a) Đúng: $6 \\times 7 = 42$. b) Sai: $42 : 6 = 7$ vì $6 \\times 7 = 42$. c) Đúng: $42 : 7 = 6$. d) Sai: $0 \\times 42 = 0$."},{"type":"truefalse","level":"VDC","q":"Xét tính đúng sai của các đẳng thức sau:","statements":["a) $5 \\times (6 + 4) = 5 \\times 6 + 5 \\times 4$.","b) $5 \\times (6 - 4) = 5 \\times 6 - 5 \\times 4$.","c) $(6 + 4) \\times 5 = 6 \\times 5 + 4 \\times 5$.","d) $5 \\times 6 + 4 = 5 \\times (6 + 4)$."],"answer":["T","T","T","F"],"explain":"a) Đúng theo tính chất phân phối đối với phép cộng. b) Đúng theo tính chất phân phối đối với phép trừ. c) Đúng: cũng là tính chất phân phối, chỉ đổi thứ tự thừa số. d) Sai: vế trái bằng $30 + 4 = 34$, vế phải bằng $5 \\times 10 = 50$."},{"type":"short","level":"NB","q":"Tính thương của phép chia $96 : 6$.","answer":"16","explain":"Vì $96 = 6 \\times 16$ nên $96 : 6 = 16$."},{"type":"short","level":"VD","q":"Tìm thừa số $x$ biết $4 \\times x = 96$.","answer":"24","explain":"Muốn tìm thừa số chưa biết, lấy tích chia cho thừa số đã biết: $x = 96 : 4 = 24$."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tính tích $9 \\times 6$.","options":["A. $54$","B. $45$","C. $56$","D. $63$"],"answer":"A","explain":"Ta có $9 \\times 6 = 54$."},{"type":"mcq","level":"NB","q":"Tính thương $100 : 4$.","options":["A. $20$","B. $25$","C. $30$","D. $15$"],"answer":"B","explain":"Vì $100 = 4 \\times 25$ nên $100 : 4 = 25$."},{"type":"mcq","level":"TH","q":"Đẳng thức $(4 \\times 25) \\times 13 = 4 \\times (25 \\times 13)$ minh họa tính chất nào của phép nhân?","options":["A. Tính chất giao hoán","B. Tính chất kết hợp","C. Tính chất phân phối","D. Tính chất nhân với $0$"],"answer":"B","explain":"Đẳng thức có dạng $(a \\times b) \\times c = a \\times (b \\times c)$, đó là tính chất kết hợp của phép nhân."},{"type":"mcq","level":"TH","q":"Tính thương $63 : 9$.","options":["A. $6$","B. $7$","C. $8$","D. $9$"],"answer":"B","explain":"Vì $63 = 9 \\times 7$ nên $63 : 9 = 7$."},{"type":"mcq","level":"VD","q":"Tính nhanh $16 \\times 125$.","options":["A. $2000$","B. $1500$","C. $200$","D. $1600$"],"answer":"A","explain":"Tách $16 = 2 \\times 8$ rồi nhóm $8 \\times 125 = 1000$: $16 \\times 125 = 2 \\times 8 \\times 125 = 2 \\times 1000 = 2000$."},{"type":"mcq","level":"VDC","q":"Tích của ba số tự nhiên liên tiếp bằng $120$. Số nhỏ nhất trong ba số đó là","options":["A. $3$","B. $4$","C. $5$","D. $6$"],"answer":"B","explain":"Thử: $3 \\times 4 \\times 5 = 60$, $4 \\times 5 \\times 6 = 120$, $5 \\times 6 \\times 7 = 210$. Vậy ba số là $4, 5, 6$ và số nhỏ nhất là $4$."},{"type":"truefalse","level":"TH","q": "Cho các phát biểu sau, hãy xét tính đúng, sai:","statements":["a) Mọi số tự nhiên nhân với $0$ đều bằng $0$.","b) Phép chia cho $0$ cho kết quả bằng $0$.","c) Nếu $a : b = c$ (với $b$ khác $0$) thì $a = b \\times c$.","d) Số chia trong một phép chia phải khác $0$."],"answer":["T","F","T","T"],"explain":"a) Đúng theo tính chất nhân với $0$. b) Sai: phép chia cho $0$ là không xác định. c) Đúng theo định nghĩa phép chia hết. d) Đúng: không được chia cho $0$."},{"type":"truefalse","level":"VDC","q":"Xét các số tự nhiên có dạng $a = 7 \\times q + 3$. Xét tính đúng sai của các khẳng định sau:","statements":["a) Khi $q = 2$ thì $a = 17$.","b) Mọi số $a$ có dạng trên chia cho $7$ đều dư $3$.","c) Số $a$ nhỏ nhất (với $q$ là số tự nhiên) là $3$.","d) Khi $q = 4$ thì $a = 24$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $7 \\times 2 + 3 = 17$. b) Đúng: đây chính là dạng $a = b \\times q + r$ với số dư $3$ nhỏ hơn $7$. c) Đúng: $q$ nhỏ nhất bằng $0$ cho $a = 3$. d) Sai: $q = 4$ cho $a = 7 \\times 4 + 3 = 31$, không phải $24$."},{"type":"short","level":"NB","q":"Tính tích $11 \\times 9$.","answer":"99","explain":"Ta có $11 \\times 9 = 99$."},{"type":"short","level":"VD","q":"Một hộp có $12$ chiếc bút. Hỏi $8$ hộp như thế có bao nhiêu chiếc bút?","answer":"96","explain":"Số bút là $12 \\times 8 = 96$ chiếc."}]}]}
