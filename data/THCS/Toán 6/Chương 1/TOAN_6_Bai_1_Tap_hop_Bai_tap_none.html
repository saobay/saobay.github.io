Tập hợp gồm các số $11, 12, 13, 14$, tức là các số tự nhiên lớn hơn $10$ và nhỏ hơn $15$."}, {"type": "mcq", "level": "TH", "q": "Trong sơ đồ Venn, vòng tròn $C$ chứa các chấm ghi chữ $a, e, i$; chữ $o$ được chấm ở ngoài vòng tròn. Chữ cái nào sau đây thuộc tập hợp $C$?", "options": ["A. $o$", "B. $a$", "C. $x$", "D. $y$"], "answer": "B", "explain": "Chữ $a$ nằm trong vòng tròn nên $a \\in C$; chữ $o$ nằm ngoài nên không thuộc $C$."}, {"type": "truefalse", "level": "VD", "q": "Cho $D = \\{x \\mid x$ là số tự nhiên thỏa mãn $x + 2$ nhỏ hơn $6\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $D = \\{0; 1; 2; 3\\}$.", "b) $4 \\notin D$.", "c) $3 \\in D$.", "d) $D$ có $3$ phần tử."], "answer": ["T", "T", "T", "F"], "explain": "$x + 2$ nhỏ hơn $6$ nên $x$ nhỏ hơn $4$, tức $D = \\{0; 1; 2; 3\\}$ có $4$ phần tử. Do đó a), b), c) đúng; d) sai."}, {"type": "truefalse", "level": "VD", "q": "Cho $E = \\{10; 20; 30\\}$ và $F = \\{x \\mid x$ là số tự nhiên, $x$ là bội của $10$, $x$ nhỏ hơn $40$ và $x$ khác $0\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $10 \\in E$.", "b) $0 \\in F$.", "c) $40 \\notin F$.", "d) $E$ và $F$ gồm các phần tử như nhau."], "answer": ["T", "F", "T", "T"], "explain": "$F = \\{10; 20; 30\\}$ giống hệt $E$. Do đó a) đúng; $0$ bị loại khỏi $F$ nên b) sai; $40$ không nhỏ hơn $40$ nên c) đúng; d) đúng."}, {"type": "short", "level": "VDC", "q": "Tập hợp $G$ gồm các số tự nhiên có một chữ số mà số đó cộng với $5$ được số nhỏ hơn $10$. Hỏi $G$ có bao nhiêu phần tử?", "answer": "5", "explain": "Gọi số cần tìm là $x$, ta có $x + 5$ nhỏ hơn $10$ nên $x$ nhỏ hơn $5$. Các số thỏa mãn là $0, 1, 2, 3, 4$. Vậy $G$ có $5$ phần tử."}, {"type": "short", "level": "VDC", "q": "Cho $H = \\{x \\mid x$ là số tự nhiên chẵn, $x$ lớn hơn $20$ và $x$ nhỏ hơn $40\\}$. Tính tổng các phần tử của $H$.", "answer": "270", "explain": "$H = \\{22; 24; 26; 28; 30; 32; 34; 36; 38\\}$. Tổng các phần tử là $22 + 24 + 26 + 28 + 30 + 32 + 34 + 36 + 38 = 270$."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Cho $A = \\{1; 3; 5; 7\\}$. Tập hợp $A$ có bao nhiêu phần tử?", "options": ["A. $3$ phần tử", "B. $4$ phần tử", "C. $5$ phần tử", "D. $7$ phần tử"], "answer": "B", "explain": "$A$ gồm các phần tử $1, 3, 5, 7$ nên $A$ có $4$ phần tử."}, {"type": "mcq", "level": "NB", "q": "Điền kí hiệu thích hợp vào chỗ trống: $9$ ... $\\{2; 4; 6; 8\\}$.", "options": ["A. $\\in$", "B. $\\notin$", "C. $\\subset$", "D. $=$"], "answer": "B", "explain": "$9$ không có trong $\\{2; 4; 6; 8\\}$ nên ta viết $9 \\notin \\{2; 4; 6; 8\\}$."}, {"type": "mcq", "level": "NB", "q": "Trong các khẳng định sau, khẳng định nào đúng?", "options": ["A. $0 \\notin \\{0; 1\\}$", "B. $1 \\in \\{0; 1\\}$", "C. $2 \\in \\{0; 1\\}$", "D. $0 \\notin \\{1; 2\\}$"], "answer": "B", "explain": "$1$ là phần tử của $\\{0; 1\\}$ nên $1 \\in \\{0; 1\\}$ là khẳng định đúng."}, {"type": "mcq", "level": "TH", "q": "Cho $K = \\{x \\mid x$ là số tự nhiên, $x$ là bội của $3$, $x$ nhỏ hơn $15$ và $x$ khác $0\\}$. Viết tập hợp $K$ bằng cách liệt kê.", "options": ["A. $\\{3; 6; 9; 12\\}$", "B. $\\{0; 3; 6; 9; 12\\}$", "C. $\\{3; 6; 9; 12; 15\\}$", "D. $\\{6; 9; 12\\}$"], "answer": "A", "explain": "Các bội của $3$ nhỏ hơn $15$ là $0, 3, 6, 9, 12$; loại $0$ theo điều kiện nên $K = \\{3; 6; 9; 12\\}$."}, {"type": "mcq", "level": "TH", "q": "Viết tập hợp các tháng có $31$ ngày trong năm bằng cách liệt kê.", "options": ["A. $\\{1; 3; 5; 7; 8; 10; 12\\}$", "B. $\\{2; 4; 6; 9; 11\\}$", "C. $\\{1; 2; 3\\}$", "D. $\\{4; 6; 9; 11\\}$"], "answer": "A", "explain": "Các tháng có $31$ ngày là tháng $1, 3, 5, 7, 8, 10, 12$."}, {"type": "mcq", "level": "TH", "q": "Trong sơ đồ Venn, vòng tròn $D$ chứa các chấm ghi số $11, 13, 17$; số $15$ được chấm ở ngoài vòng tròn. Khẳng định nào sau đây sai?", "options": ["A. $11 \\in D$", "B. $15 \\notin D$", "C. $13 \\in D$", "D. $15 \\in D$"], "answer": "D", "explain": "Số $15$ nằm ngoài vòng tròn nên $15 \\notin D$; khẳng định $15 \\in D$ là sai."}, {"type": "truefalse", "level": "VD", "q": "Cho $M = \\{x \\mid x$ là số tự nhiên thỏa mãn $2x + 1$ nhỏ hơn $11\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $M = \\{0; 1; 2; 3; 4\\}$.", "b) $5 \\notin M$.", "c) $4 \\in M$.", "d) $M$ có $6$ phần tử."], "answer": ["T", "T", "T", "F"], "explain": "$2x + 1$ nhỏ hơn $11$ nên $x$ nhỏ hơn $5$, tức $M = \\{0; 1; 2; 3; 4\\}$ có $5$ phần tử. Do đó a), b), c) đúng; d) sai."}, {"type": "truefalse", "level": "VD", "q": "Cho $A = \\{a; b; c\\}$ và $B = \\{x \\mid x$ là một trong ba chữ cái $a, b, c\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $a \\in A$.", "b) $d \\notin B$.", "c) $A$ và $B$ gồm các phần tử như nhau.", "d) $b \\notin A$."], "answer": ["T", "T", "T", "F"], "explain": "$B = \\{a; b; c\\}$ giống hệt $A$. Do đó a), b), c) đúng; $b$ là phần tử của $A$ nên d) sai."}, {"type": "short", "level": "VDC", "q": "Tập hợp $N$ gồm các số tự nhiên nhỏ hơn $50$ chia hết cho cả $2$ và $5$. Hỏi $N$ có bao nhiêu phần tử?", "answer": "5", "explain": "Số chia hết cho cả $2$ và $5$ là số chia hết cho $10$. Các số nhỏ hơn $50$ chia hết cho $10$ là $0, 10, 20, 30, 40$. Vậy $N$ có $5$ phần tử."}, {"type": "short", "level": "VDC", "q": "Cho $P = \\{x \\mid x$ là số tự nhiên lẻ, $x$ lớn hơn $30$ và $x$ nhỏ hơn $50\\}$. Tính tổng các phần tử của $P$.", "answer": "400", "explain": "$P = \\{31; 33; 35; 37; 39; 41; 43; 45; 47; 49\\}$. Tổng các phần tử là $(31 + 49) \\times 10 : 2 = 400$."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Cho $B = \\{x; y; z\\}$. Khẳng định nào sau đây đúng?", "options": ["A. $x \\notin B$", "B. $y \\in B$", "C. $z \\notin B$", "D. $t \\in B$"], "answer": "B", "explain": "$y$ là phần tử của $B$ nên $y \\in B$ là khẳng định đúng."}, {"type": "mcq", "level": "NB", "q": "Điền kí hiệu thích hợp vào chỗ trống: $3$ ... $\\{1; 2; 3; 4\\}$.", "options": ["A. $\\in$", "B. $\\notin$", "C. $\\lt$", "D. $\\gt$"], "answer": "A", "explain": "$3$ là phần tử của $\\{1; 2; 3; 4\\}$ nên ta viết $3 \\in \\{1; 2; 3; 4\\}$."}, {"type": "mcq", "level": "NB", "q": "Cách viết nào sau đây là đúng của tập hợp các số tự nhiên nhỏ hơn $3$?", "options": ["A. $\\{1; 2\\}$", "B. $\\{0; 1; 2\\}$", "C. $\\{1; 2; 3\\}$", "D. $\\{0; 1; 2; 3\\}$"], "answer": "B", "explain": "Các số tự nhiên nhỏ hơn $3$ là $0, 1, 2$."}, {"type": "mcq", "level": "TH", "q": "Cho $C = \\{x \\mid x$ là số tự nhiên, $x$ là ước của $6\\}$. Viết tập hợp $C$ bằng cách liệt kê.", "options": ["A. $\\{1; 2; 3\\}$", "B. $\\{1; 2; 3; 6\\}$", "C. $\\{2; 3; 6\\}$", "D. $\\{1; 6\\}$"], "answer": "B", "explain": "Các ước của $6$ là $1, 2, 3, 6$."}, {"type": "mcq", "level": "TH", "q": "Viết tập hợp $D = \\{0; 1; 2; 3\\}$ bằng cách chỉ ra tính chất đặc trưng.", "options": ["A. $D = \\{x \\mid x$ là số tự nhiên nhỏ hơn $4\\}$", "B. $D = \\{x \\mid x$ là số tự nhiên nhỏ hơn $3\\}$", "C. $D = \\{x \\mid x$ là số tự nhiên lớn hơn $4\\}$", "D. $D = \\{x \\mid x$ là số tự nhiên bằng $4\\}$"], "answer": "A", "explain": "$D$ gồm đúng các số tự nhiên $0, 1, 2, 3$, tức là các số tự nhiên nhỏ hơn $4$."}, {"type": "mcq", "level": "TH", "q": "Trong sơ đồ Venn, vòng tròn $E$ chứa các chấm ghi chữ $m, n$; chữ $p$ được chấm ở ngoài vòng tròn $E$. Khẳng định nào sau đây đúng?", "options": ["A. $p \\in E$", "B. $q \\notin E$", "C. $m \\notin E$", "D. $n \\notin E$"], "answer": "B", "explain": "Chỉ biết $m, n$ thuộc $E$ và $p$ không thuộc $E$. Chữ $q$ không được chấm trong vòng tròn nên $q \\notin E$ là khẳng định đúng."}, {"type": "truefalse", "level": "VD", "q": "Cho $F = \\{x \\mid x$ là số tự nhiên, $x$ chia $3$ dư $1$ và $x$ nhỏ hơn $10\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $F = \\{1; 4; 7\\}$.", "b) $10 \\notin F$.", "c) $4 \\in F$.", "d) $F$ có $4$ phần tử."], "answer": ["T", "T", "T", "F"], "explain": "Các số nhỏ hơn $10$ chia $3$ dư $1$ là $1, 4, 7$ nên $F$ có $3$ phần tử. Do đó a), b), c) đúng; d) sai."}, {"type": "truefalse", "level": "VD", "q": "Cho $G = \\{5; 10; 15; 20\\}$ và $H = \\{x \\mid x$ là số tự nhiên, $x$ là bội của $5$, $x$ nhỏ hơn $25$ và $x$ khác $0\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $5 \\in G$.", "b) $25 \\notin H$.", "c) $0 \\notin H$.", "d) $G$ và $H$ gồm các phần tử như nhau."], "answer": ["T", "T", "T", "T"], "explain": "$H = \\{5; 10; 15; 20\\}$ giống hệt $G$. Do đó cả bốn khẳng định đều đúng."}, {"type": "short", "level": "VDC", "q": "Tập hợp $I$ gồm các số tự nhiên có hai chữ số mà hiệu của chữ số hàng chục và chữ số hàng đơn vị bằng $3$. Hỏi $I$ có bao nhiêu phần tử?", "answer": "7", "explain": "Các số thỏa mãn là $30, 41, 52, 63, 74, 85, 96$. Vậy $I$ có $7$ phần tử."}, {"type": "short", "level": "VDC", "q": "Cho $J = \\{x \\mid x$ là số tự nhiên, $x$ chia hết cho $6$ và $x$ nhỏ hơn $40\\}$. Tính tổng các phần tử của $J$.", "answer": "126", "explain": "$J = \\{0; 6; 12; 18; 24; 30; 36\\}$. Tổng các phần tử là $0 + 6 + 12 + 18 + 24 + 30 + 36 = 126$."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Kí hiệu $\\in$ đọc là gì?", "options": ["A. không thuộc", "B. thuộc", "C. chứa", "D. bằng"], "answer": "B", "explain": "Kí hiệu $\\in$ đọc là thuộc; kí hiệu $\\notin$ đọc là không thuộc."}, {"type": "mcq", "level": "NB", "q": "Cho $A = \\{2; 4; 6\\}$. Khẳng định nào sau đây sai?", "options": ["A. $2 \\in A$", "B. $4 \\in A$", "C. $8 \\notin A$", "D. $6 \\notin A$"], "answer": "D", "explain": "$6$ là phần tử của $A$ nên $6 \\in A$; khẳng định $6 \\notin A$ là sai."}, {"type": "mcq", "level": "NB", "q": "Điền kí hiệu thích hợp vào chỗ trống: $7$ ... $\\{7; 14; 21\\}$.", "options": ["A. $\\notin$", "B. $\\in$", "C. $=$", "D. $+$"], "answer": "B", "explain": "$7$ là phần tử của $\\{7; 14; 21\\}$ nên ta viết $7 \\in \\{7; 14; 21\\}$."}, {"type": "mcq", "level": "TH", "q": "Cho $B = \\{x \\mid x$ là số tự nhiên, $x$ là số nguyên tố và $x$ nhỏ hơn $10\\}$. Viết tập hợp $B$ bằng cách liệt kê.", "options": ["A. $\\{1; 2; 3; 5; 7\\}$", "B. $\\{2; 3; 5; 7\\}$", "C. $\\{2; 3; 5; 7; 9\\}$", "D. $\\{3; 5; 7\\}$"], "answer": "B", "explain": "Các số nguyên tố nhỏ hơn $10$ là $2, 3, 5, 7$ (chú ý $1$ không phải số nguyên tố)."}, {"type": "mcq", "level": "TH", "q": "Viết tập hợp các số tự nhiên chẵn lớn hơn $4$ và nhỏ hơn $12$ bằng cách liệt kê.", "options": ["A. $\\{4; 6; 8; 10; 12\\}$", "B. $\\{6; 8; 10\\}$", "C. $\\{5; 7; 9; 11\\}$", "D. $\\{6; 8; 10; 12\\}$"], "answer": "B", "explain": "Các số tự nhiên chẵn lớn hơn $4$ và nhỏ hơn $12$ là $6, 8, 10$."}, {"type": "mcq", "level": "TH", "q": "Trong sơ đồ Venn, vòng tròn $F$ chứa các chấm ghi số $1, 3, 5$; số $2$ được chấm ở ngoài vòng tròn. Khẳng định nào sau đây đúng?", "options": ["A. $2 \\in F$", "B. $1 \\notin F$", "C. $3 \\in F$", "D. $5 \\notin F$"], "answer": "C", "explain": "Số $3$ nằm trong vòng tròn nên $3 \\in F$; số $2$ nằm ngoài nên không thuộc $F$."}, {"type": "truefalse", "level": "VD", "q": "Cho $K = \\{x \\mid x$ là số tự nhiên thỏa mãn $3x$ nhỏ hơn $20\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $K = \\{0; 1; 2; 3; 4; 5; 6\\}$.", "b) $7 \\notin K$.", "c) $6 \\in K$.", "d) $K$ có $6$ phần tử."], "answer": ["T", "T", "T", "F"], "explain": "$3x$ nhỏ hơn $20$ nên $x$ nhỏ hơn $7$ (vì $3 \\times 6 = 18$ còn $3 \\times 7 = 21$). Vậy $K = \\{0; 1; 2; 3; 4; 5; 6\\}$ có $7$ phần tử. Do đó a), b), c) đúng; d) sai."}, {"type": "truefalse", "level": "VD", "q": "Cho $L = \\{x \\mid x$ là số tự nhiên có một chữ số chia hết cho $2\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $0 \\in L$.", "b) $8 \\in L$.", "c) $10 \\notin L$.", "d) $L = \\{2; 4; 6; 8\\}$."], "answer": ["T", "T", "T", "F"], "explain": "$L = \\{0; 2; 4; 6; 8\\}$ có $5$ phần tử. Do đó a), b), c) đúng; d) sai vì thiếu phần tử $0$."}, {"type": "short", "level": "VDC", "q": "Tập hợp $M$ gồm các số tự nhiên có hai chữ số chia hết cho $9$. Hỏi $M$ có bao nhiêu phần tử?", "answer": "9", "explain": "Các số có hai chữ số chia hết cho $9$ là $18, 27, 36, 45, 54, 63, 72, 81, 99$. Vậy $M$ có $9$ phần tử."}, {"type": "short", "level": "VDC", "q": "Cho $N = \\{x \\mid x$ là số tự nhiên, $x$ là bội của $7$, $x$ lớn hơn $20$ và $x$ nhỏ hơn $60\\}$. Tính tổng các phần tử của $N$.", "answer": "231", "explain": "$N = \\{21; 28; 35; 42; 49; 56\\}$. Tổng các phần tử là $21 + 28 + 35 + 42 + 49 + 56 = 231$."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Cho $P = \\{a; e; i; o; u\\}$. Tập hợp $P$ có bao nhiêu phần tử?", "options": ["A. $4$ phần tử", "B. $5$ phần tử", "C. $6$ phần tử", "D. $3$ phần tử"], "answer": "B", "explain": "$P$ gồm các phần tử $a, e, i, o, u$ nên $P$ có $5$ phần tử."}, {"type": "mcq", "level": "NB", "q": "Điền kí hiệu thích hợp vào chỗ trống: $12$ ... $\\{3; 6; 9\\}$.", "options": ["A. $\\in$", "B. $\\notin$", "C. $\\subset$", "D. $=$"], "answer": "B", "explain": "$12$ không có trong $\\{3; 6; 9\\}$ nên ta viết $12 \\notin \\{3; 6; 9\\}$."}, {"type": "mcq", "level": "NB", "q": "Cho các khẳng định về phần tử và tập hợp. Khẳng định đúng là khẳng định nào?", "options": ["A. $3 \\notin \\{1; 2; 3\\}$", "B. $4 \\in \\{4; 5; 6\\}$", "C. $5 \\notin \\{5; 6; 7\\}$", "D. $6 \\in \\{1; 2; 3\\}$"], "answer": "B", "explain": "$4$ là phần tử của $\\{4; 5; 6\\}$ nên $4 \\in \\{4; 5; 6\\}$ là khẳng định đúng."}, {"type": "mcq", "level": "TH", "q": "Cho $Q = \\{x \\mid x$ là số tự nhiên thỏa mãn $x + 5 = 12\\}$. Viết tập hợp $Q$ bằng cách liệt kê.", "options": ["A. $\\{5\\}$", "B. $\\{12\\}$", "C. $\\{7\\}$", "D. $\\{17\\}$"], "answer": "C", "explain": "Từ $x + 5 = 12$ ta tìm được $x = 7$. Vậy $Q = \\{7\\}$."}, {"type": "mcq", "level": "TH", "q": "Viết tập hợp $R = \\{2; 4; 6; 8\\}$ bằng cách chỉ ra tính chất đặc trưng.", "options": ["A. $R = \\{x \\mid x$ là số tự nhiên chẵn nhỏ hơn $10\\}$", "B. $R = \\{x \\mid x$ là số tự nhiên lẻ nhỏ hơn $10\\}$", "C. $R = \\{x \\mid x$ là số tự nhiên chẵn nhỏ hơn $8\\}$", "D. $R = \\{x \\mid x$ là số tự nhiên nhỏ hơn $9\\}$"], "answer": "A", "explain": "$R$ gồm đúng các số tự nhiên chẵn $2, 4, 6, 8$, tức là các số tự nhiên chẵn nhỏ hơn $10$."}, {"type": "mcq", "level": "TH", "q": "Trong sơ đồ Venn, vòng tròn $G$ chứa các chấm ghi số $5, 10, 15, 20$; số $25$ được chấm ở ngoài vòng tròn. Số nào sau đây không thuộc tập hợp $G$?", "options": ["A. $5$", "B. $10$", "C. $20$", "D. $25$"], "answer": "D", "explain": "Số $25$ nằm ngoài vòng tròn nên $25 \\notin G$; ba số còn lại đều thuộc $G$."}, {"type": "truefalse", "level": "VD", "q": "Cho $S = \\{x \\mid x$ là số tự nhiên, $x$ là ước của $10\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $S = \\{1; 2; 5; 10\\}$.", "b) $3 \\notin S$.", "c) $S$ có $4$ phần tử.", "d) $10 \\notin S$."], "answer": ["T", "T", "T", "F"], "explain": "Các ước của $10$ là $1, 2, 5, 10$ nên $S$ có $4$ phần tử. Do đó a), b), c) đúng; $10$ là ước của $10$ nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Cho $T = \\{1; 4; 9; 16\\}$ và $U = \\{x \\mid x$ là số tự nhiên, $x$ là bình phương của một số tự nhiên và $x$ nhỏ hơn $20\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $9 \\in T$.", "b) $25 \\notin U$.", "c) $4 \\in U$.", "d) $T$ và $U$ gồm các phần tử như nhau."], "answer": ["T", "T", "T", "F"], "explain": "$U = \\{0; 1; 4; 9; 16\\}$ vì $0 = 0 \\times 0$. Do đó a), b), c) đúng; d) sai vì $0 \\in U$ nhưng $0 \\notin T$."}, {"type": "short", "level": "VDC", "q": "Tập hợp $V$ gồm các số tự nhiên có hai chữ số mà chữ số hàng đơn vị gấp ba lần chữ số hàng chục. Hỏi $V$ có bao nhiêu phần tử?", "answer": "3", "explain": "Các số thỏa mãn là $13, 26, 39$. Vậy $V$ có $3$ phần tử."}, {"type": "short", "level": "VDC", "q": "Cho $W = \\{x \\mid x$ là số tự nhiên, $x$ chia hết cho $8$ và $x$ nhỏ hơn $50\\}$. Tính tổng các phần tử của $W$.", "answer": "168", "explain": "$W = \\{0; 8; 16; 24; 32; 40; 48\\}$. Tổng các phần tử là $0 + 8 + 16 + 24 + 32 + 40 + 48 = 168$."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tập hợp các số tự nhiên lẻ nhỏ hơn $7$ là tập hợp nào?", "options": ["A. $\\{1; 3; 5\\}$", "B. $\\{1; 3; 5; 7\\}$", "C. $\\{2; 4; 6\\}$", "D. $\\{0; 1; 3; 5\\}$"], "answer": "A", "explain": "Các số tự nhiên lẻ nhỏ hơn $7$ là $1, 3, 5$ (số $7$ không nhỏ hơn $7$)."}, {"type": "mcq", "level": "NB", "q": "Điền kí hiệu thích hợp vào chỗ trống: $0$ ... $\\{1; 2; 3\\}$.", "options": ["A. $\\in$", "B. $\\notin$", "C. $=$", "D. $\\lt$"], "answer": "B", "explain": "$0$ không có trong $\\{1; 2; 3\\}$ nên ta viết $0 \\notin \\{1; 2; 3\\}$."}, {"type": "mcq", "level": "NB", "q": "Cho $A = \\{x; y\\}$. Khẳng định nào sau đây đúng?", "options": ["A. $x \\in A$", "B. $z \\in A$", "C. $x \\notin A$", "D. $y \\notin A$"], "answer": "A", "explain": "$x$ là phần tử của $A$ nên $x \\in A$ là khẳng định đúng."}, {"type": "mcq", "level": "TH", "q": "Cho $B = \\{x \\mid x$ là số tự nhiên có hai chữ số nhỏ nhất$\\}$. Viết tập hợp $B$ bằng cách liệt kê.", "options": ["A. $\\{1\\}$", "B. $\\{9\\}$", "C. $\\{10\\}$", "D. $\\{11\\}$"], "answer": "C", "explain": "Số tự nhiên có hai chữ số nhỏ nhất là $10$. Vậy $B = \\{10\\}$."}, {"type": "mcq", "level": "TH", "q": "Viết tập hợp $C = \\{5; 10; 15; 20; 25\\}$ bằng cách chỉ ra tính chất đặc trưng.", "options": ["A. $C = \\{x \\mid x$ là số tự nhiên, $x$ là bội của $5$, $x$ nhỏ hơn $30$ và $x$ khác $0\\}$", "B. $C = \\{x \\mid x$ là số tự nhiên, $x$ là bội của $5$ và $x$ nhỏ hơn $25\\}$", "C. $C = \\{x \\mid x$ là số tự nhiên lẻ nhỏ hơn $30\\}$", "D. $C = \\{x \\mid x$ là số tự nhiên nhỏ hơn $26\\}$"], "answer": "A", "explain": "$C$ gồm đúng các bội của $5$ từ $5$ đến $25$, tức là các bội của $5$ nhỏ hơn $30$ và khác $0$."}, {"type": "mcq", "level": "TH", "q": "Trong sơ đồ Venn, vòng tròn $H$ chứa các chấm ghi tên Lan, Mai; tên Hùng được chấm ở ngoài vòng tròn. Bạn nào sau đây thuộc tập hợp $H$?", "options": ["A. Hùng", "B. Lan", "C. Nam", "D. Tuấn"], "answer": "B", "explain": "Lan được chấm trong vòng tròn nên Lan thuộc $H$; Hùng nằm ngoài nên không thuộc $H$."}, {"type": "truefalse", "level": "VD", "q": "Cho $D = \\{x \\mid x$ là số tự nhiên, $x$ chia $4$ dư $3$ và $x$ nhỏ hơn $15\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $D = \\{3; 7; 11\\}$.", "b) $15 \\notin D$.", "c) $7 \\in D$.", "d) $D$ có $4$ phần tử."], "answer": ["T", "T", "T", "F"], "explain": "Các số nhỏ hơn $15$ chia $4$ dư $3$ là $3, 7, 11$ nên $D$ có $3$ phần tử. Do đó a), b), c) đúng; d) sai."}, {"type": "truefalse", "level": "VD", "q": "Cho $E = \\{2; 3; 5; 7\\}$ và $F = \\{x \\mid x$ là số tự nhiên, $x$ là số nguyên tố và $x$ nhỏ hơn $10\\}$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $2 \\in E$.", "b) $1 \\notin F$.", "c) $9 \\notin F$.", "d) $E$ và $F$ gồm các phần tử như nhau."], "answer": ["T", "T", "T", "T"], "explain": "$F = \\{2; 3; 5; 7\\}$ giống hệt $E$. Do đó cả bốn khẳng định đều đúng."}, {"type": "short", "level": "VDC", "q": "Tập hợp $G$ gồm các số tự nhiên có ba chữ số mà tổng các chữ số bằng $2$. Hỏi $G$ có bao nhiêu phần tử?", "answer": "3", "explain": "Các số có ba chữ số với tổng các chữ số bằng $2$ là $101, 110, 200$. Vậy $G$ có $3$ phần tử."}, {"type": "short", "level": "VDC", "q": "Cho $H = \\{x \\mid x$ là số tự nhiên lẻ, $x$ lớn hơn $100$ và $x$ nhỏ hơn $120\\}$. Tính tổng các phần tử của $H$.", "answer": "1100", "explain": "$H = \\{101; 103; 105; 107; 109; 111; 113; 115; 117; 119\\}$. Tổng các phần tử là $(101 + 119) \\times 10 : 2 = 1100$."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Cho $A = \\{1; 2; 3; 4; 5\\}$. Điền kí hiệu thích hợp vào chỗ trống: $6$ ... $A$.", "options": ["A. $\\in$", "B. $\\notin$", "C. $=$", "D. $+$"], "answer": "B", "explain": "$6$ không có trong $A$ nên ta viết $6 \\notin A$."}, {"type": "mcq", "level": "NB", "q": "Kí hiệu nào sau đây được dùng để viết một tập hợp?", "options": ["A. ( )", "B. [ ]", "C. { }", "D. \" \""], "answer": "C", "explain": "Tập hợp được viết bằng dấu ngoặc nhọn $\\{\\ \\}$ bao quanh các phần tử."}, {"type": "mcq",
