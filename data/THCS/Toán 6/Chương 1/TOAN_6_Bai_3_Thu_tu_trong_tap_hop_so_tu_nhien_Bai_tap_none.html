{"type": "mcq", "level": "VDC", "q": "Cho $x, y, z$ là các số tự nhiên thỏa mãn $x \\lt y \\lt z$ và $x + z = 20$. Giá trị lớn nhất có thể của $y$ là:", "options": ["A. $9$", "B. $10$", "C. $18$", "D. $19$"], "answer": "D", "explain": "$z = 20 - x$; $y \\lt z = 20 - x$ và $y \\gt x$. Để $y$ lớn nhất thì $x$ nhỏ nhất, lấy $x = 0$ thì $y \\lt 20$ và $y \\gt 0$ nên $y$ lớn nhất là $19$ (kiểm tra: $0 \\lt 19 \\lt 20$)."},

{"type": "short", "level": "VD", "q": "Sắp xếp các số $9080, 9800, 8900$ theo thứ tự từ lớn đến bé rồi viết số đứng đầu.", "answer": "9800", "explain": "So hàng nghìn: $9 = 9 = 8$; trong hai số có hàng nghìn là $9$, so hàng trăm: $8 \\gt 0$ nên $9800 \\gt 9080 \\gt 8900$. Số đứng đầu là $9800$."},

{"type": "mcq", "level": "VD", "q": "Trên tia số có hai điểm $P, Q$ lần lượt biểu diễn số $a$ và số $a + 6$. Điểm $R$ là điểm chính giữa của đoạn $PQ$. Số mà điểm $R$ biểu diễn là:", "options": ["A. $a + 2$", "B. $a + 3$", "C. $a + 4$", "D. $a + 5$"], "answer": "B", "explain": "Đoạn $PQ$ dài $6$ đơn vị nên điểm chính giữa $R$ cách $P$ một khoảng $3$ đơn vị về phía bên phải; số $R$ biểu diễn là $a + 3$."},
{"type": "mcq", "level": "VDC", "q": "Trên tia số, điểm $A$ biểu diễn số $x$, điểm $B$ biểu diễn số $y$ với $x \\lt y$. Biết đoạn $AB$ dài $10$ đơn vị và trung điểm của đoạn $AB$ biểu diễn số $25$. Giá trị của $x + y$ là:", "options": ["A. $40$", "B. $45$", "C. $50$", "D. $55$"], "answer": "C", "explain": "Trung điểm của $AB$ biểu diễn số $25$ nên $\\frac{x + y}{2} = 25$, suy ra $x + y = 50$ (kiểm tra: $x = 20, y = 30$ thỏa mãn)."},
{"type": "truefalse", "level": "NB", "q": "Đọc các khẳng định sau rồi cho biết đúng hay sai:", "statements": ["a) Trên tia số, điểm biểu diễn số càng lớn nằm càng về bên phải.", "b) Đoạn thẳng nối điểm biểu diễn số $2$ và điểm biểu diễn số $7$ dài $5$ đơn vị.", "c) Điểm biểu diễn số $0$ nằm bên trái điểm biểu diễn số $1$.", "d) Điểm biểu diễn số $4$ nằm bên phải điểm biểu diễn số $6$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: theo chiều mũi tên của tia số. b) Đúng: $7 - 2 = 5$. c) Đúng: $0 \\lt 1$. d) Sai: $4 \\lt 6$ nên điểm $4$ nằm bên trái điểm $6$."},
{"type": "truefalse", "level": "TH", "q": "Trong các phát biểu dưới đây, phát biểu nào đúng, phát biểu nào sai?", "statements": ["a) Nếu điểm $A$ nằm bên trái điểm $B$ trên tia số thì số $A$ biểu diễn nhỏ hơn số $B$ biểu diễn.", "b) Điểm chính giữa của đoạn nối số $10$ và số $21$ trên tia số biểu diễn số $15$.", "c) Trên tia số, từ điểm biểu diễn số $5$ đi sang phải $3$ đơn vị ta được điểm biểu diễn số $8$.", "d) Từ điểm biểu diễn số $9$ đi sang trái $9$ đơn vị ta được điểm gốc."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: theo quy tắc so sánh trên tia số. b) Sai: điểm chính giữa biểu diễn số $15{,}5$, không phải số tự nhiên $15$. c) Đúng: $5 + 3 = 8$. d) Đúng: $9 - 9 = 0$ là điểm gốc."},
{"type": "short", "level": "VD", "q": "Trên tia số, từ điểm biểu diễn số $30$ đi sang trái $12$ đơn vị ta được điểm biểu diễn số nào?", "answer": "18", "explain": "Đi sang trái $12$ đơn vị nghĩa là trừ đi $12$: $30 - 12 = 18$."},
{"type": "short", "level": "VDC", "q": "Điểm $M$ trên tia số biểu diễn số $a$. Từ $M$ đi sang phải $7$ đơn vị được điểm $N$ biểu diễn số $40$. Từ $M$ đi sang trái $5$ đơn vị được điểm $P$. Số mà điểm $P$ biểu diễn là:", "answer": "28", "explain": "Từ $M$ đi sang phải $7$ đơn vị được $40$ nên $a + 7 = 40$, suy ra $a = 33$. Từ $M$ đi sang trái $5$ đơn vị: $33 - 5 = 28$. Vậy điểm $P$ biểu diễn số $28$."}
]},
{"name": "Đề 9", "questions": [
{"type": "mcq", "level": "NB", "q": "Số liền trước của số $a$ ($a$ là số tự nhiên khác $0$) là:", "options": ["A. $a + 1$", "B. $a - 1$", "C. $a$", "D. $2a$"], "answer": "B", "explain": "Số liền trước của $a$ (với $a \\gt 0$) là $a - 1$."},
{"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây SAI?", "options": ["A. $0 \\lt 1$", "B. $10 \\gt 9$", "C. $5 = 5$", "D. $3 \\gt 7$"], "answer": "D", "explain": "$3 \\lt 7$ nên khẳng định \"$3 \\gt 7$\" là sai; các khẳng định còn lại đều đúng."},
{"type": "mcq", "level": "TH", "q": "Có bao nhiêu số tự nhiên $x$ thỏa mãn $x \\lt 5$?", "options": ["A. $4$", "B. $5$", "C. $6$", "D. Vô số"], "answer": "B", "explain": "Các số thỏa mãn là $0, 1, 2, 3, 4$, gồm $5$ số."},
{"type": "mcq", "level": "TH", "q": "Số tự nhiên $x$ lớn nhất thỏa mãn $x \\lt 100$ là:", "options": ["A. $100$", "B. $99$", "C. $101$", "D. $90$"], "answer": "B", "explain": "Số liền trước của $100$ là $99$, đó cũng là số tự nhiên lớn nhất nhỏ hơn $100$."},
{"type": "mcq", "level": "VD", "q": "Có bao nhiêu chữ số $x$ để $\\overline{3x} \\lt 35$?", "options": ["A. $4$", "B. $5$", "C. $6$", "D. $3$"], "answer": "B", "explain": "$\\overline{3x} \\lt 35$ nghĩa là chữ số hàng đơn vị $x \\lt 5$; $x \\in \\{0, 1, 2, 3, 4\\}$ gồm $5$ giá trị."},
{"type": "mcq", "level": "VDC", "q": "Cho $\\overline{ab}$ là số có hai chữ số thỏa mãn $\\overline{ab} \\lt \\overline{ba}$ và $a + b = 9$. Có bao nhiêu số $\\overline{ab}$ như vậy?", "options": ["A. $3$", "B. $4$", "C. $5$", "D. $6$"], "answer": "B", "explain": "$\\overline{ab} \\lt \\overline{ba}$ nghĩa là $a \\lt b$; với $a + b = 9$ và $a \\ge 1$ ta có các cặp $(1, 8), (2, 7), (3, 6), (4, 5)$, tương ứng $4$ số."},
{"type": "truefalse", "level": "NB", "q": "Hãy đánh dấu đúng, sai cho mỗi khẳng định sau:", "statements": ["a) $a - 1$ là số liền trước của $a$ (với $a \\gt 0$).", "b) $a + 1$ là số liền sau của $a$.", "c) Số $0$ là số liền trước của số $1$.", "d) Số liền trước của $100$ là $101$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: theo định nghĩa. b) Đúng: theo định nghĩa. c) Đúng: $1 - 1 = 0$. d) Sai: số liền trước của $100$ là $99$."},
{"type": "truefalse", "level": "TH", "q": "Cho biết tính đúng, sai của các khẳng định sau đây:", "statements": ["a) Có $5$ số tự nhiên nhỏ hơn hoặc bằng $5$.", "b) Số tự nhiên lớn nhất nhỏ hơn $20$ là $19$.", "c) Mọi số có hai chữ số đều lớn hơn $9$.", "d) Số $99$ là số liền trước của số $100$."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: có $6$ số là $0, 1, 2, 3, 4, 5$. b) Đúng: $19$ là số liền trước của $20$. c) Đúng: số có hai chữ số nhỏ nhất là $10 \\gt 9$. d) Đúng: $100 - 1 = 99$."},
{"type": "short", "level": "VD", "q": "Tìm số tự nhiên $x$ nhỏ nhất thỏa mãn $x \\gt 47$.", "answer": "48", "explain": "Số liền sau của $47$ là $48$, đó cũng là số tự nhiên nhỏ nhất lớn hơn $47$."},
{"type": "short", "level": "VDC", "q": "Có bao nhiêu số tự nhiên có hai chữ số $\\overline{ab}$ thỏa mãn $a \\gt b$?", "answer": "45", "explain": "Với $a = 1$ có $1$ số ($10$); $a = 2$ có $2$ số; ...; $a = 9$ có $9$ số. Tổng: $1 + 2 + \\dots + 9 = 45$ số."}
]},
{"name": "Đề 10", "questions": [
{"type": "mcq", "level": "NB", "q": "Trong các số $19, 91, 109, 190$, số lớn nhất là:", "options": ["A. $19$", "B. $91$", "C. $109$", "D. $190$"], "answer": "D", "explain": "Các số có ba chữ số ($109, 190$) lớn hơn các số có hai chữ số ($19, 91$); so hàng trăm bằng nhau ($1 = 1$), hàng chục $9 \\gt 0$ nên $190$ là số lớn nhất."},
{"type": "mcq", "level": "NB", "q": "Dãy số nào sau đây được sắp xếp theo thứ tự từ bé đến lớn?", "options": ["A. $30, 20, 10$", "B. $10, 30, 20$", "C. $10, 20, 30$", "D. $20, 10, 30$"], "answer": "C", "explain": "Dãy $10, 20, 30$ thỏa mãn $10 \\lt 20 \\lt 30$ nên được sắp xếp từ bé đến lớn."},
{"type": "mcq", "level": "TH", "q": "Cho ba số tự nhiên $a \\lt b \\lt c$. Biết $b = 50$. Khẳng định nào sau đây chắc chắn đúng?", "options": ["A. $a = 49$", "B. $c = 51$", "C. $a \\lt 50 \\lt c$", "D. $a + c = 100$"], "answer": "C", "explain": "Từ $a \\lt b = 50$ và $50 = b \\lt c$ ta chỉ biết $a \\lt 50$ và $c \\gt 50$, tức $a \\lt 50 \\lt c$; không xác định được giá trị cụ thể của $a$ và $c$."},
{"type": "mcq", "level": "TH", "q": "Số $x$ thỏa mãn: $x$ là số liền sau của $a$ và $x$ là số liền trước của $b$, với $a + b = 40$. Giá trị của $x$ là:", "options": ["A. $19$", "B. $20$", "C. $21$", "D. $22$"], "answer": "B", "explain": "$x = a + 1 = b - 1$ nên $b = a + 2$; $a + b = 2a + 2 = 40$ suy ra $a = 19$, vậy $x = 19 + 1 = 20$."},
{"type": "mcq", "level": "VD", "q": "Sắp xếp bốn số $2025, 2052, 2205, 2502$ theo thứ tự từ bé đến lớn, ta được:", "options": ["A. $2025 \\lt 2052 \\lt 2205 \\lt 2502$", "B. $2025 \\lt 2205 \\lt 2052 \\lt 2502$", "C. $2052 \\lt 2025 \\lt 2205 \\lt 2502$", "D. $2025 \\lt 2052 \\lt 2502 \\lt 2205$"], "answer": "A", "explain": "Hàng nghìn đều là $2$; so hàng trăm: $0, 0, 2, 5$. Trong hai số có hàng trăm là $0$, so hàng chục: $2 \\lt 5$ nên $2025 \\lt 2052$. Vậy $2025 \\lt 2052 \\lt 2205 \\lt 2502$."},
{"type": "mcq", "level": "VDC", "q": "Cho $n$ là số tự nhiên thỏa mãn: số liền trước của $n$ là số lớn nhất có hai chữ số. Hỏi số liền sau của $n$ là số có mấy chữ số?", "options": ["A. $2$ chữ số", "B. $3$ chữ số", "C. $4$ chữ số", "D. $1$ chữ số"], "answer": "B", "explain": "Số liền trước của $n$ là $99$ nên $n = 100$; số liền sau của $n$ là $101$, có $3$ chữ số."},
{"type": "truefalse", "level": "NB", "q": "Các khẳng định sau đúng hay sai? Hãy xét từng khẳng định:", "statements": ["a) $25 \\lt 52$.", "b) $100 \\gt 99$.", "c) Số liền sau của $29$ là $30$.", "d) $7 \\gt 70$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: hàng chục $2 \\lt 5$. b) Đúng: $100$ có $3$ chữ số, $99$ có $2$ chữ số. c) Đúng: $29 + 1 = 30$. d) Sai: $7 \\lt 70$."},
{"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai của mỗi phát biểu sau:", "statements": ["a) Dãy $5, 10, 15, 20$ được sắp xếp theo thứ tự tăng dần.", "b) Nếu $a \\lt b$ thì trên tia số điểm $A$ nằm bên trái điểm $B$.", "c) Số $0$ không có số liền trước nhưng có số liền sau.", "d) Mọi số tự nhiên đều có số liền trước và số liền sau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $5 \\lt 10 \\lt 15 \\lt 20$. b) Đúng: theo quy tắc so sánh trên tia số. c) Đúng: số liền sau của $0$ là $1$. d) Sai: số $0$ không có số liền trước."},
{"type": "short", "level": "VD", "q": "Viết các số $33, 303, 330, 3030$ theo thứ tự từ lớn đến bé, rồi cho biết số đứng thứ hai.", "answer": "330", "explain": "$3030 \\gt 330 \\gt 303 \\gt 33$ nên số đứng thứ hai là $330$."},
{"type": "short", "level": "VDC", "q": "Tìm số tự nhiên $n$ nhỏ nhất sao cho $n \\gt 100$ và tổng các chữ số của $n$ bằng $5$.", "answer": "104", "explain": "$n \\gt 100$ nên $n$ có ít nhất $3$ chữ số; số nhỏ nhất có $3$ chữ số với tổng các chữ số bằng $5$ là $104$ (vì $1 + 0 + 4 = 5$)."}
]}
