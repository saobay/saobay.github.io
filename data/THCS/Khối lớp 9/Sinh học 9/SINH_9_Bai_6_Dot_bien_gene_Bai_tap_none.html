ay 1 cặp nu có thể đổi 1 amino acid.", "c) Protein biến đổi có thể gây bệnh.", "d) Mọi bệnh đều do đột biến gene."], "answer": ["T", "T", "T", "F"], "explain": "Nhiều bệnh do virus, vi khuẩn, môi trường, không phải đột biến gene.", "points": 1}, {"type": "short", "level": "NB", "q": "Đột biến nào làm thay đổi số lượng nucleotide của gene?", "answer": "Mất hoặc thêm cặp nucleotide", "explain": "Thay thế thì số lượng không đổi.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Đột biến ở tế bào nào mới di truyền qua sinh sản hữu tính?", "answer": "Tế bào sinh dục", "explain": "Đột biến giao tử đi vào giao tử.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Tác nhân nào sau đây có thể gây đột biến gene?", "options": ["A. Tia phóng xạ", "B. Ánh sáng đèn học", "C. Nước sạch", "D. Không khí trong lành"], "answer": "A", "explain": "Tia phóng xạ là tác nhân vật lí gây đột biến gene.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Người thường xuyên tiếp xúc với thuốc trừ sâu không bảo hộ có nguy cơ gì về di truyền?", "options": ["A. Không có nguy cơ", "B. Tăng nguy cơ đột biến gene do hóa chất", "C. Khỏe mạnh hơn", "D. Tăng chiều cao"], "answer": "B", "explain": "Thuốc trừ sâu là tác nhân hóa học gây đột biến gene.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao đột biến gene phát sinh chủ yếu trong quá trình tái bản DNA?", "options": ["A. Vì DNA bị phá hủy", "B. Vì khi tách mạch và tổng hợp mạch mới dễ xảy ra bắt cặp nhầm", "C. Vì enzyme ngừng hoạt động", "D. Vì tế bào chết"], "answer": "B", "explain": "Tái bản là lúc DNA tháo xoắn, dễ bắt cặp nhầm nucleotide.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bệnh hồng cầu hình liềm do dạng đột biến gene nào gây ra?", "options": ["A. Mất 1 cặp nucleotide", "B. Thêm 1 cặp nucleotide", "C. Thay thế 1 cặp nucleotide", "D. Mất đoạn NST"], "answer": "C", "explain": "Bệnh do đột biến thay thế 1 cặp nucleotide làm đổi 1 amino acid của hemoglobin.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hậu quả chung của đột biến gene là gì?", "options": ["A. Thay đổi trình tự nucleotide, có thể thay đổi protein và tính trạng", "B. Luôn làm tăng sức sống", "C. Không bao giờ biểu hiện", "D. Làm mất gene"], "answer": "A", "explain": "Đột biến gene thay đổi trình tự nucleotide, có thể kéo theo thay đổi protein và tính trạng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đột biến gene nào sau đây có thể có lợi cho chọn giống?", "options": ["A. Đột biến làm mất hoàn toàn gene", "B. Đột biến tạo giống lúa chịu mặn tốt hơn", "C. Đột biến gây chết", "D. Đột biến làm cây còi cọc"], "answer": "B", "explain": "Đột biến tạo tính trạng tốt mới là nguyên liệu cho chọn giống.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định khái quát.", "statements": ["a) Đột biến phát sinh trong tái bản DNA do bắt cặp nhầm.", "b) Alen đột biến lặn khó phát hiện ở thể dị hợp.", "c) Sàng lọc trước sinh giúp phòng bệnh di truyền.", "d) Đột biến gene luôn làm tăng số lượng gene."], "answer": ["T", "T", "T", "F"], "explain": "Đột biến gene không làm tăng số lượng gene.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về khái niệm đột biến gene.", "statements": ["a) Đột biến gene là biến đổi cấu trúc của gene.", "b) Các dạng gồm mất, thêm, thay thế cặp nucleotide.", "c) Đột biến gene làm thay đổi trình tự nucleotide.", "d) Đột biến gene là biến đổi số lượng NST."], "answer": ["T", "T", "T", "F"], "explain": "Biến đổi số lượng NST là đột biến NST, không phải đột biến gene.", "points": 1}, {"type": "short", "level": "VDC", "q": "Đa số đột biến gene có lợi hay có hại?", "answer": "Có hại", "explain": "Đa số đột biến gene là có hại.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Biến đổi trong cấu trúc của gene gọi là gì?", "answer": "Đột biến gene", "explain": "Đột biến gene gồm mất, thêm, thay thế cặp nucleotide.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Đột biến gene xảy ra ở tế bào sinh dưỡng (xoma) thì di truyền cho đời sau qua sinh sản hữu tính không?", "options": ["A. Có", "B. Không, chỉ đột biến ở tế bào sinh dục mới di truyền qua sinh sản hữu tính", "C. Luôn di truyền", "D. Tùy ý"], "answer": "B", "explain": "Đột biến xoma không đi vào giao tử nên không di truyền qua sinh sản hữu tính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đột biến tiền phôi (giao tử) có đặc điểm gì?", "options": ["A. Không di truyền", "B. Di truyền cho đời sau qua sinh sản hữu tính", "C. Tự biến mất", "D. Chỉ có ở thực vật"], "answer": "B", "explain": "Đột biến giao tử đi vào giao tử nên di truyền cho thế hệ sau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một cây bị đột biến ở cành (đột biến xoma) cho quả to hơn. Muốn nhân giống đặc điểm này, nên dùng phương pháp nào?", "options": ["A. Gieo hạt", "B. Chiết cành, ghép (sinh sản vô tính)", "C. Để tự nhiên", "D. Không thể nhân"], "answer": "B", "explain": "Đột biến xoma không qua giao tử nên phải nhân bằng sinh sản vô tính.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao đa số đột biến gene là có hại?", "options": ["A. Vì gene đã thích nghi qua tiến hóa lâu dài, thay đổi ngẫu nhiên thường phá vỡ sự thích nghi", "B. Vì đột biến luôn làm chết tế bào", "C. Vì gene không quan trọng", "D. Vì môi trường xấu"], "answer": "A", "explain": "Cơ thể đã thích nghi; biến đổi ngẫu nhiên thường phá vỡ trạng thái hài hòa đó.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác nhân sinh học gây đột biến gene là gì?", "options": ["A. Vi khuẩn", "B. Virus", "C. Nấm", "D. Tảo"], "answer": "B", "explain": "Virus là tác nhân sinh học có thể gây đột biến gene.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thuốc lá có thể gây đột biến gene ở người vì chứa chất gì?", "options": ["A. Nước", "B. Các hóa chất độc hại gây đột biến", "C. Vitamin", "D. Đường"], "answer": "B", "explain": "Khói thuốc chứa nhiều hóa chất gây đột biến gene.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về hậu quả.", "statements": ["a) Đột biến gene có thể làm thay đổi protein.", "b) Đa số đột biến gene là có hại.", "c) Đột biến gene là nguyên liệu của tiến hóa.", "d) Mọi đột biến gene đều gây bệnh."], "answer": ["T", "T", "T", "F"], "explain": "Một số đột biến trung tính hoặc có lợi, không phải mọi đột biến đều gây bệnh.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định về di truyền đột biến.", "statements": ["a) Đột biến giao tử di truyền cho đời sau.", "b) Đột biến xoma không di truyền qua sinh sản hữu tính.", "c) Muốn nhân đột biến xoma nên dùng sinh sản vô tính.", "d) Mọi đột biến đều biểu hiện ngay thành kiểu hình."], "answer": ["T", "T", "T", "F"], "explain": "Đột biến lặn ở trạng thái dị hợp không biểu hiện thành kiểu hình.", "points": 1}, {"type": "short", "level": "VD", "q": "Bệnh hồng cầu hình liềm do dạng đột biến gene nào?", "answer": "Thay thế một cặp nucleotide", "explain": "Thay 1 cặp nu làm đổi 1 amino acid của hemoglobin.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đột biến gene là nguyên liệu sơ cấp của quá trình nào?", "answer": "Tiến hóa", "explain": "Đột biến tạo alen mới cho tiến hóa và chọn giống.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VDC", "q": "Trong chọn giống, người ta chủ động gây đột biến bằng tia phóng xạ để làm gì?", "options": ["A. Gây bệnh", "B. Tạo nguồn biến dị mới để chọn lọc giống tốt", "C. Diệt cây trồng", "D. Làm cảnh"], "answer": "B", "explain": "Gây đột biến nhân tạo tạo biến dị mới phục vụ chọn giống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đột biến thay thế 1 cặp nucleotide có làm thay đổi số lượng nucleotide của gene không?", "options": ["A. Có, tăng lên", "B. Có, giảm đi", "C. Không", "D. Tùy trường hợp"], "answer": "C", "explain": "Thay thế chỉ đổi loại cặp nucleotide, số lượng không đổi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đột biến mất 3 cặp nucleotide liên tiếp gây hậu quả gì?", "options": ["A. Dịch khung đọc mã", "B. Mất 1 amino acid nhưng không dịch khung", "C. Không ảnh hưởng", "D. Mất cả gene"], "answer": "B", "explain": "Mất đúng 3 cặp (1 codon) chỉ làm mất 1 amino acid, khung đọc phía sau giữ nguyên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một đột biến làm codon UAU thành UAA trong gene. Hậu quả là gì?", "options": ["A. Không đổi", "B. Xuất hiện mã kết thúc sớm, chuỗi polypeptide ngắn lại", "C. Chuỗi dài thêm", "D. Thêm amino acid"], "answer": "B", "explain": "UAA là codon kết thúc nên dịch mã dừng sớm, protein ngắn bất thường.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đột biến câm (không đổi amino acid) có thể có hại không?", "options": ["A. Không bao giờ", "B. Có thể, nếu ảnh hưởng đến quá trình phiên mã, dịch mã hoặc cắt nối", "C. Luôn có lợi", "D. Luôn trung tính tuyệt đối"], "answer": "B", "explain": "Dù không đổi amino acid, đột biến câm vẫn có thể ảnh hưởng điều hòa biểu hiện gene.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đột biến gene là nguồn nguyên liệu của quá trình nào?", "options": ["A. Quang hợp", "B. Tiến hóa và chọn giống", "C. Hô hấp", "D. Tiêu hóa"], "answer": "B", "explain": "Đột biến gene là nguyên liệu sơ cấp cho tiến hóa và chọn giống.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về bệnh di truyền.", "statements": ["a) Hồng cầu hình liềm do thay thế 1 cặp nu.", "b) Thay 1 cặp nu có thể đổi 1 amino acid.", "c) Protein biến đổi có thể gây bệnh.", "d) Mọi bệnh đều do đột biến gene."], "answer": ["T", "T", "T", "F"], "explain": "Nhiều bệnh do virus, vi khuẩn, môi trường, không phải đột biến gene.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về chọn giống.", "statements": ["a) Đột biến tạo biến dị mới cho chọn giống.", "b) Gây đột biến nhân tạo phục vụ chọn tạo giống.", "c) Chỉ đột biến có lợi mới được giữ lại khi chọn giống.", "d) Đột biến gene không ứng dụng được trong chọn giống."], "answer": ["T", "T", "T", "F"], "explain": "Gây đột biến nhân tạo là phương pháp quan trọng trong chọn giống.", "points": 1}, {"type": "short", "level": "TH", "q": "Đột biến ở tế bào nào mới di truyền qua sinh sản hữu tính?", "answer": "Tế bào sinh dục", "explain": "Đột biến giao tử đi vào giao tử.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Muốn nhân nhanh một cành cây bị đột biến xoma có lợi, dùng phương pháp nào?", "answer": "Sinh sản vô tính", "explain": "Chiết, ghép giữ nguyên đặc điểm đột biến.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VD", "q": "Một alen đột biến lặn chỉ biểu hiện thành kiểu hình khi nào?", "options": ["A. Ở trạng thái dị hợp", "B. Ở trạng thái đồng hợp lặn", "C. Luôn biểu hiện", "D. Không bao giờ"], "answer": "B", "explain": "Alen lặn chỉ biểu hiện khi ở trạng thái đồng hợp lặn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Bệnh máu khó đông do gene lặn trên NST X. Bố bình thường, mẹ mang gene bệnh (dị hợp). Xác suất con trai bị bệnh là bao nhiêu?", "options": ["A. 0%", "B. 25%", "C. 50%", "D. 100%"], "answer": "C", "explain": "Con trai nhận Y từ bố và X từ mẹ (50% X mang bệnh), nên 50% bị bệnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đột biến gene có di truyền được không?", "options": ["A. Không bao giờ", "B. Có, nếu xảy ra ở tế bào sinh dục", "C. Luôn di truyền", "D. Chỉ ở thực vật"], "answer": "B", "explain": "Đột biến gene di truyền cho đời sau khi xảy ra ở tế bào sinh dục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp nào giúp phát hiện sớm bệnh di truyền ở thai nhi?", "options": ["A. Đoán mò", "B. Sàng lọc trước sinh, chẩn đoán di truyền", "C. Chờ sinh ra", "D. Không thể phát hiện"], "answer": "B", "explain": "Sàng lọc trước sinh giúp phát hiện sớm bệnh di truyền.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đột biến gene là gì?", "options": ["A. Biến đổi số lượng NST", "B. Biến đổi trong cấu trúc của gene", "C. Biến đổi cấu trúc NST", "D. Biến đổi tế bào chất"], "answer": "B", "explain": "Đột biến gene là những biến đổi trong cấu trúc của gene.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dạng đột biến gene nào sau đây làm thay đổi số lượng nucleotide của gene?", "options": ["A. Thay thế 1 cặp nucleotide", "B. Mất hoặc thêm 1 cặp nucleotide", "C. Đảo vị trí nucleotide", "D. Không dạng nào"], "answer": "B", "explain": "Mất hoặc thêm cặp nucleotide làm thay đổi số lượng nucleotide; thay thế thì số lượng không đổi.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về khái niệm đột biến gene.", "statements": ["a) Đột biến gene là biến đổi cấu trúc của gene.", "b) Các dạng gồm mất, thêm, thay thế cặp nucleotide.", "c) Đột biến gene làm thay đổi trình tự nucleotide.", "d) Đột biến gene là biến đổi số lượng NST."], "answer": ["T", "T", "T", "F"], "explain": "Biến đổi số lượng NST là đột biến NST, không phải đột biến gene.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về nguyên nhân.", "statements": ["a) Tia phóng xạ có thể gây đột biến gene.", "b) Hóa chất độc hại có thể gây đột biến gene.", "c) Virus có thể gây đột biến gene.", "d) Nước sạch là tác nhân gây đột biến gene."], "answer": ["T", "T", "T", "F"], "explain": "Nước sạch không phải tác nhân gây đột biến.", "points": 1}, {"type": "short", "level": "NB", "q": "Biến đổi trong cấu trúc của gene gọi là gì?", "answer": "Đột biến gene", "explain": "Đột biến gene gồm mất, thêm, thay thế cặp nucleotide.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Kể một tác nhân vật lí gây đột biến gene.", "answer": "Tia phóng xạ", "explain": "Tia phóng xạ, tia tử ngoại là tác nhân vật lí.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VDC", "q": "Đột biến thay thế 1 cặp nucleotide làm codon AAA thành AAG, cả hai cùng quy định lysine. Đây là đột biến gì?", "options": ["A. Đột biến có hại", "B. Đột biến câm (trung tính)", "C. Đột biến dịch khung", "D. Đột biến NST"], "answer": "B", "explain": "Không làm thay đổi amino acid nên là đột biến câm, thường trung tính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các dạng đột biến gene gồm những dạng nào?", "options": ["A. Mất, thêm, thay thế cặp nucleotide", "B. Mất đoạn, đảo đoạn NST", "C. Thể ba, thể một", "D. Đa bội"], "answer": "A", "explain": "Đột biến gene gồm mất, thêm, thay thế một cặp nucleotide.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác nhân nào sau đây có thể gây đột biến gene?", "options": ["A. Tia phóng xạ", "B. Ánh sáng đèn học", "C. Nước sạch", "D. Không khí trong lành"], "answer": "A", "explain": "Tia phóng xạ là tác nhân vật lí gây đột biến gene.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Người thường xuyên tiếp xúc với thuốc trừ sâu không bảo hộ có nguy cơ gì về di truyền?", "options": ["A. Không có nguy cơ", "B. Tăng nguy cơ đột biến gene do hóa chất", "C. Khỏe mạnh hơn", "D. Tăng chiều cao"], "answer": "B", "explain": "Thuốc trừ sâu là tác nhân hóa học gây đột biến gene.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao đột biến gene phát sinh chủ yếu trong quá trình tái bản DNA?", "options": ["A. Vì DNA bị phá hủy", "B. Vì khi tách mạch và tổng hợp mạch mới dễ xảy ra bắt cặp nhầm", "C. Vì enzyme ngừng hoạt động", "D. Vì tế bào chết"], "answer": "B", "explain": "Tái bản là lúc DNA tháo xoắn, dễ bắt cặp nhầm nucleotide.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bệnh hồng cầu hình liềm do dạng đột biến gene nào gây ra?", "options": ["A. Mất 1 cặp nucleotide", "B. Thêm 1 cặp nucleotide", "C. Thay thế 1 cặp nucleotide", "D. Mất đoạn NST"], "answer": "C", "explain": "Bệnh do đột biến thay thế 1 cặp nucleotide làm đổi 1 amino acid của hemoglobin.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định về di truyền đột biến.", "statements": ["a) Đột biến giao tử di truyền cho đời sau.", "b) Đột biến xoma không di truyền qua sinh sản hữu tính.", "c) Muốn nhân đột biến xoma nên dùng sinh sản vô tính.", "d) Mọi đột biến đều biểu hiện ngay thành kiểu hình."], "answer": ["T", "T", "T", "F"], "explain": "Đột biến lặn ở trạng thái dị hợp không biểu hiện thành kiểu hình.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về dạng đột biến.", "statements": ["a) Thay thế cặp nucleotide không đổi số lượng nu của gene.", "b) Mất 1 cặp nu gây dịch khung đọc mã.", "c) Thêm 1 cặp nu gây dịch khung đọc mã.", "d) Mất 3 cặp nu liên tiếp gây dịch khung."], "answer": ["T", "T", "T", "F"], "explain": "Mất đúng 3 cặp (trọn codon) không gây dịch khung.", "points": 1}, {"type": "short", "level": "VDC", "q": "Đột biến gene là nguyên liệu sơ cấp của quá trình nào?", "answer": "Tiến hóa", "explain": "Đột biến tạo alen mới cho tiến hóa và chọn giống.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Đột biến nào làm thay đổi số lượng nucleotide của gene?", "answer": "Mất hoặc thêm cặp nucleotide", "explain": "Thay thế thì số lượng không đổi.", "points": 0.5}]}]}
