 lai AB/ab × ab/ab cho đời con có kiểu gene nào?", "options": ["A. Chỉ AB/ab", "B. AB/ab và ab/ab", "C. 4 loại", "D. Chỉ ab/ab"], "answer": "B", "explain": "AB/ab tạo giao tử AB, ab; ab/ab tạo ab → con AB/ab và ab/ab.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong chọn giống, muốn phá vỡ liên kết giữa gene tốt và gene xấu người ta dựa vào hiện tượng nào?", "options": ["A. Đột biến", "B. Hoán vị gene", "C. Nguyên phân", "D. Đa bội"], "answer": "B", "explain": "Hoán vị gene tạo tổ hợp mới, phá vỡ liên kết không mong muốn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các gene trên cùng một NST phân li như thế nào trong giảm phân?", "options": ["A. Độc lập nhau", "B. Cùng nhau về một giao tử", "C. Ngẫu nhiên", "D. Biến mất"], "answer": "B", "explain": "Gene cùng NST cùng phân li về giao tử.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về giao tử.", "statements": ["a) AB/ab liên kết hoàn toàn tạo 2 loại giao tử.", "b) AB/ab có hoán vị tạo 4 loại giao tử.", "c) Giao tử hoán vị mang tổ hợp gene mới.", "d) Liên kết hoàn toàn tạo 4 loại giao tử."], "answer": ["T", "T", "T", "F"], "explain": "Liên kết hoàn toàn chỉ tạo 2 loại giao tử.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định ứng dụng.", "statements": ["a) Liên kết gene giúp giữ vững phẩm chất giống.", "b) Hoán vị gene giúp phá liên kết gene xấu.", "c) Chọn giống luôn muốn liên kết hoàn toàn.", "d) Biến dị tổ hợp có lợi cho chọn giống."], "answer": ["T", "T", "F", "T"], "explain": "Đôi khi cần hoán vị để tạo tổ hợp mới tốt hơn.", "points": 1}, {"type": "short", "level": "TH", "q": "Số nhóm gene liên kết bằng số NST trong bộ nào?", "answer": "Bộ đơn bội", "explain": "Số nhóm liên kết = n.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ở người, số nhóm gene liên kết là bao nhiêu?", "answer": "23", "explain": "n = 23.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VD", "q": "Một tế bào có kiểu gene Ab/aB liên kết hoàn toàn giảm phân tạo giao tử nào?", "options": ["A. AB, ab", "B. Ab, aB", "C. 4 loại", "D. Chỉ Ab"], "answer": "B", "explain": "Liên kết hoàn toàn tạo giao tử giống P: Ab và aB.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ý nghĩa tiến hóa của hoán vị gene là gì?", "options": ["A. Giảm đa dạng", "B. Tạo biến dị tổ hợp, cung cấp nguyên liệu cho tiến hóa", "C. Gây chết", "D. Ổn định tuyệt đối"], "answer": "B", "explain": "Hoán vị gene tạo biến dị tổ hợp là nguyên liệu tiến hóa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn vị đo khoảng cách giữa các gene trên bản đồ di truyền là gì?", "options": ["A. Centimorgan (cM)", "B. Mét", "C. Kilogam", "D. Micrômét"], "answer": "A", "explain": "1% tần số hoán vị = 1 centimorgan.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tần số hoán vị 10% có nghĩa là gì?", "options": ["A. 10% giao tử là giao tử hoán vị", "B. 10% gene bị mất", "C. 10% tế bào chết", "D. 10% NST đứt"], "answer": "A", "explain": "10% số giao tử tạo ra là giao tử hoán vị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Di truyền liên kết là hiện tượng gì?", "options": ["A. Các gene trên cùng một NST di truyền cùng nhau", "B. Các gene phân li độc lập", "C. Gene bị đột biến", "D. NST bị mất"], "answer": "A", "explain": "Các gene cùng nằm trên một NST sẽ cùng phân li, cùng tổ hợp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Morgan đã nghiên cứu di truyền liên kết trên đối tượng nào?", "options": ["A. Đậu Hà Lan", "B. Ruồi giấm", "C. Ngô", "D. Chuột"], "answer": "B", "explain": "Morgan nghiên cứu trên ruồi giấm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về di truyền liên kết.", "statements": ["a) Các gene trên cùng một NST di truyền cùng nhau.", "b) Liên kết gene hạn chế biến dị tổ hợp.", "c) Morgan nghiên cứu trên ruồi giấm.", "d) Các gene trên cùng NST phân li độc lập."], "answer": ["T", "T", "T", "F"], "explain": "Gene cùng NST cùng evel": "VDC", "q": "Hai gene càng xa nhau trên NST thì tần số hoán vị như thế nào?", "options": ["A. Càng nhỏ", "B. Càng lớn", "C. Không đổi", "D. Bằng 0"], "answer": "B", "explain": "Khoảng cách càng lớn, khả năng trao đổi chéo càng cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ý nghĩa của di truyền liên kết là gì?", "options": ["A. Tạo nhiều biến dị tổ hợp", "B. Đảm bảo di truyền ổn định nhóm tính trạng tốt cùng nhau", "C. Gây đột biến", "D. Làm tăng số NST"], "answer": "B", "explain": "Liên kết gene giữ các tính trạng tốt luôn đi cùng nhau.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định về ý nghĩa.", "statements": ["a) Liên kết gene giữ ổn định nhóm tính trạng tốt.", "b) Hoán vị gene là nguyên liệu cho tiến hóa.", "c) Bản đồ gene dựa trên tần số hoán vị.", "d) Liên kết gene làm tăng biến dị tổ hợp."], "answer": ["T", "T", "T", "F"], "explain": "Liên kết gene hạn chế biến dị tổ hợp.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về số nhóm liên kết.", "statements": ["a) Số nhóm liên kết bằng số NST trong bộ n.", "b) Người có 23 nhóm gene liên kết.", "c) Ruồi giấm có 4 nhóm gene liên kết.", "d) Số nhóm liên kết bằng 2n."], "answer": ["T", "T", "T", "F"], "explain": "Số nhóm liên kết bằng n, không phải 2n.", "points": 1}, {"type": "short", "level": "VDC", "q": "Tần số hoán vị gene tối đa là bao nhiêu phần trăm?", "answer": "50", "explain": "Không vượt quá 50%.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Đối tượng nghiên cứu của Morgan là loài nào?", "answer": "Ruồi giấm", "explain": "Ruồi giấm dễ nuôi, vòng đời ngắn.", "points": 0.5}]}]}
