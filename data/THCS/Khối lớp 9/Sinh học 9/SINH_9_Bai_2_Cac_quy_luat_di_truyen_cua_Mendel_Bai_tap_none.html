: ["T", "T", "T", "F"], "explain": "Các gene trên cùng một NST di truyền liên kết, không phân li độc lập.", "points": 1}, {"type": "short", "level": "VD", "q": "Aa × Aa cho F2 có tỉ lệ kiểu gene như thế nào?", "answer": "1:2:1", "explain": "F2 có 1AA : 2Aa : 1aa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Lai hai cặp tính trạng theo Mendel, F2 phân li kiểu hình theo tỉ lệ nào?", "answer": "9:3:3:1", "explain": "Đây là tỉ lệ đặc trưng của quy luật phân li độc lập.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VDC", "q": "Muốn kiểm tra một con bò lông đen (trội) là thuần chủng hay không, người ta làm gì?", "options": ["A. Cho giao phối với bò lông vàng (lặn) - phép lai phân tích", "B. Cho tự phối", "C. Quan sát màu lông", "D. Đếm số con"], "answer": "A", "explain": "Lai với cá thể lặn để kiểm tra kiểu gene chính là phép lai phân tích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tỉ lệ phân li kiểu hình 3 trội : 1 lặn ở F2 đặc trưng cho phép lai nào?", "options": ["A. Lai phân tích", "B. Lai một cặp tính trạng (Aa × Aa)", "C. Lai hai cặp tính trạng", "D. Lai xa"], "answer": "B", "explain": "Aa × Aa cho F2 phân li kiểu hình 3 trội : 1 lặn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tỉ lệ 9:3:3:1 ở F2 đặc trưng cho phép lai nào?", "options": ["A. Lai một cặp tính trạng", "B. Lai hai cặp tính trạng theo quy luật phân li độc lập", "C. Lai phân tích", "D. Trội không hoàn toàn"], "answer": "B", "explain": "9:3:3:1 là tỉ lệ F2 của lai hai cặp tính trạng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở cà chua, quả đỏ (A) trội hoàn toàn quả vàng (a). Lai hai cây F1 đều quả đỏ (Aa × Aa), trong 400 cây F2 có bao nhiêu cây quả vàng?", "options": ["A. 100", "B. 200", "C. 300", "D. 400"], "answer": "A", "explain": "F2 phân li 3 đỏ : 1 vàng nên số cây quả vàng là 400 chia 4 bằng 100.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho biết mỗi gene quy định một tính trạng, trội lặn hoàn toàn. Phép lai AaBb × aabb cho đời con có tỉ lệ kiểu hình nào?", "options": ["A. 9:3:3:1", "B. 1:1:1:1", "C. 3:1", "D. 1:1"], "answer": "B", "explain": "AaBb tạo 4 loại giao tử, aabb tạo 1 loại, đời con phân li 1:1:1:1.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân tố di truyền theo quan niệm của Mendel ngày nay được gọi là gì?", "options": ["A. Protein", "B. Gene", "C. Lipid", "D. Hormone"], "answer": "B", "explain": "Nhân tố di truyền chính là gene.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về thí nghiệm Mendel.", "statements": ["a) Mendel lai đậu Hà Lan qua nhiều thế hệ.", "b) Mendel dùng toán thống kê phân tích kết quả.", "c) Mendel xét từng cặp tính trạng riêng rẽ.", "d) Mendel nghiên cứu biến dị tổ hợp ở lai một cặp tính trạng."], "answer": ["T", "T", "T", "F"], "explain": "Biến dị tổ hợp xuất hiện ở lai hai cặp tính trạng trở lên.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về trội không hoàn toàn.", "statements": ["a) F1 hoa mõm sói có màu hồng trung gian.", "b) F2 phân li 1 đỏ : 2 hồng : 1 trắng.", "c) Alen trội át hoàn toàn alen lặn.", "d) Kiểu hình F1 cho biết kiểu gene là dị hợp."], "answer": ["T", "T", "F", "T"], "explain": "Trội không hoàn toàn thì alen trội không át hoàn toàn alen lặn.", "points": 1}, {"type": "short", "level": "TH", "q": "Biểu hiện ra bên ngoài của kiểu gene được gọi là gì?", "answer": "Kiểu hình", "explain": "Kiểu hình ví dụ hoa đỏ, thân cao.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Hiện tượng F1 mang tính trạng trung gian giữa bố mẹ gọi là gì?", "answer": "Trội không hoàn toàn", "explain": "Ví dụ hoa mõm sói F1 màu hồng.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VD", "q": "Ở người, bệnh bạch tạng do alen lặn a quy định. Bố mẹ bình thường sinh con bạch tạng. Kiểu gene của bố mẹ là gì?", "options": ["A. AA × AA", "B. Aa × Aa", "C. AA × aa", "D. aa × aa"], "answer": "B", "explain": "Con aa nhận a từ cả bố và mẹ bình thường nên bố mẹ đều là Aa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Bố mẹ đều mắt nâu (A trội) sinh được con mắt xanh (aa). Xác suất để đứa con tiếp theo mắt nâu là bao nhiêu?", "options": ["A. 25%", "B. 50%", "C. 75%", "D. 100%"], "answer": "C", "explain": "Bố mẹ Aa × Aa, xác suất con mắt nâu (A-) là 75%.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giao tử của cơ thể có kiểu gene Aa mang những alen nào?", "options": ["A. Chỉ A", "B. Chỉ a", "C. Hai loại: A và a với tỉ lệ ngang nhau", "D. Aa"], "answer": "C", "explain": "Mỗi giao tử mang một alen, cơ thể Aa tạo hai loại giao tử A và a tỉ lệ 1:1.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao F1 trong thí nghiệm của Mendel đồng tính trội?", "options": ["A. Vì alen lặn bị mất", "B. Vì alen trội át biểu hiện của alen lặn ở thể dị hợp", "C. Vì P không thuần chủng", "D. Vì môi trường"], "answer": "B", "explain": "Ở thể dị hợp Aa, alen trội A át alen lặn a nên F1 đồng tính trội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cặp tính trạng tương phản là gì?", "options": ["A. Hai tính trạng giống nhau", "B. Hai biểu hiện trái ngược của cùng một tính trạng", "C. Hai tính trạng của hai loài", "D. Tính trạng tốt và xấu"], "answer": "B", "explain": "Cặp tính trạng tương phản là hai biểu hiện trái ngược của cùng một tính trạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Alen là gì?", "options": ["A. Một loại protein", "B. Các trạng thái khác nhau của cùng một gene", "C. Một loại tế bào", "D. Một loại hormone"], "answer": "B", "explain": "Alen là các trạng thái khác nhau của cùng một gene.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về thuật ngữ di truyền.", "statements": ["a) Kiểu gene là tổ hợp các alen trong tế bào.", "b) Kiểu hình là biểu hiện bên ngoài của kiểu gene.", "c) Alen là các trạng thái khác nhau của cùng một gene.", "d) Cơ thể Aa là đồng hợp."], "answer": ["T", "T", "T", "F"], "explain": "Aa mang hai alen khác nhau nên là dị hợp.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về quy luật phân li.", "statements": ["a) P thuần chủng tương phản cho F1 đồng tính trội.", "b) F1 tự thụ cho F2 phân li 3 trội : 1 lặn.", "c) Tỉ lệ kiểu gene ở F2 là 1:2:1.", "d) Alen lặn biến mất ở F1."], "answer": ["T", "T", "T", "F"], "explain": "Alen lặn không mất đi mà bị alen trội át, vẫn truyền cho F2.", "points": 1}, {"type": "short", "level": "NB", "q": "Hai biểu hiện trái ngược của cùng một tính trạng gọi là gì?", "answer": "Cặp tính trạng tương phản", "explain": "Ví dụ hoa đỏ và hoa trắng là cặp tính trạng tương phản.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Phép lai giữa cá thể trội chưa rõ kiểu gene với cá thể lặn aa gọi là phép lai gì?", "answer": "Lai phân tích", "explain": "Lai phân tích dùng để kiểm tra kiểu gene của cá thể trội.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VDC", "q": "Cho cây hoa đỏ có kiểu gene chưa xác định lai phân tích, F1 thu được 50% hoa đỏ : 50% hoa trắng. Kiểu gene của cây đem lai là gì?", "options": ["A. AA", "B. Aa", "C. aa", "D. Không xác định"], "answer": "B", "explain": "Lai phân tích cho tỉ lệ 1:1 chứng tỏ cây đem lai có kiểu gene dị hợp Aa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kiểu hình là gì?", "options": ["A. Tổ hợp các alen trong tế bào", "B. Biểu hiện ra bên ngoài của kiểu gene", "C. Số lượng gene", "D. Màu sắc của gene"], "answer": "B", "explain": "Kiểu hình là biểu hiện ra bên ngoài của kiểu gene.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phép lai nào sau đây là phép lai phân tích?", "options": ["A. AA × AA", "B. Aa × Aa", "C. Cây hoa đỏ chưa rõ kiểu gene × cây hoa trắng (aa)", "D. aa × aa"], "answer": "C", "explain": "Lai phân tích là lai cá thể trội chưa rõ kiểu gene với cá thể lặn aa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "P thuần chủng hoa đỏ (AA) × hoa trắng (aa). Tỉ lệ kiểu gene ở F2 là bao nhiêu?", "options": ["A. 3:1", "B. 1:2:1", "C. 1:1", "D. 9:3:3:1"], "answer": "B", "explain": "Aa × Aa cho F2 có tỉ lệ kiểu gene 1AA : 2Aa : 1aa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ở người, alen A quy định mắt nâu trội hoàn toàn so với a quy định mắt xanh. Bố mắt nâu (Aa), mẹ mắt xanh (aa). Xác suất con mắt xanh là bao nhiêu?", "options": ["A. 100%", "B. 75%", "C. 50%", "D. 25%"], "answer": "C", "explain": "Aa × aa cho 1 Aa (nâu) : 1 aa (xanh), xác suất con mắt xanh là 50%.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nội dung quy luật phân li của Mendel là gì?", "options": ["A. Các alen phân li độc lập", "B. Mỗi nhân tố di truyền trong cặp phân li về một giao tử", "C. Các gene liên kết với nhau", "D. Giao tử mang cả hai alen"], "answer": "B", "explain": "Trong phát sinh giao tử, mỗi nhân tố di truyền trong cặp phân li về một giao tử.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định về phân li độc lập.", "statements": ["a) F2 lai hai cặp tính trạng phân li 9:3:3:1.", "b) Xuất hiện biến dị tổ hợp không có ở P.", "c) Các cặp alen phân li độc lập khi phát sinh giao tử.", "d) Quy luật này đúng với mọi cặp gene trên cùng một NST."], "answer": ["T", "T", "T", "F"], "explain": "Các gene trên cùng một NST di truyền liên kết, không phân li độc lập.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về trội, lặn.", "statements": ["a) AA biểu hiện kiểu hình trội.", "b) Aa biểu hiện kiểu hình trội.", "c) aa biểu hiện kiểu hình lặn.", "d) Aa biểu hiện kiểu hình lặn."], "answer": ["T", "T", "T", "F"], "explain": "Aa có alen trội A nên biểu hiện kiểu hình trội.", "points": 1}, {"type": "short", "level": "VDC", "q": "Lai hai cặp tính trạng theo Mendel, F2 phân li kiểu hình theo tỉ lệ nào?", "answer": "9:3:3:1", "explain": "Đây là tỉ lệ đặc trưng của quy luật phân li độc lập.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Tổ hợp các alen trong tế bào được gọi là gì?", "answer": "Kiểu gene", "explain": "Kiểu gene ví dụ AA, Aa, aa.", "points": 0.5}]}]}
