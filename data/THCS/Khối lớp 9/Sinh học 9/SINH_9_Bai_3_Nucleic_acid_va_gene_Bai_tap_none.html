hông phải 1 mạch.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về RNA.", "statements": ["a) RNA gồm 1 mạch polynucleotide.", "b) RNA có uracil thay cho thymine.", "c) mRNA mang thông tin di truyền ra tế bào chất.", "d) tRNA là thành phần cấu tạo ribosome."], "answer": ["T", "T", "T", "F"], "explain": "rRNA mới là thành phần cấu tạo ribosome; tRNA vận chuyển amino acid.", "points": 1}, {"type": "short", "level": "NB", "q": "Đơn phân cấu tạo nên DNA và RNA gọi là gì?", "answer": "Nucleotide", "explain": "DNA và RNA đều cấu tạo theo nguyên tắc đa phân với đơn phân là nucleotide.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trong DNA, base nào liên kết bổ sung với adenine?", "answer": "Thymine", "explain": "A liên kết bổ sung với T bằng 2 liên kết hiđrô.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VDC", "q": "Một gene có 3000 nucleotide, trong đó A chiếm 20%. Số liên kết hiđrô của gene là bao nhiêu?", "options": ["A. 3000", "B. 3600", "C. 3900", "D. 4200"], "answer": "C", "explain": "A = T = 600, G = C = 900. Số liên kết hiđrô = 2A + 3G = 1200 + 2700 = 3900.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân tử RNA được cấu tạo từ bao nhiêu mạch polynucleotide?", "options": ["A. 1 mạch", "B. 2 mạch", "C. 3 mạch", "D. 4 mạch"], "answer": "A", "explain": "RNA gồm một mạch polynucleotide.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa DNA và RNA về đơn phân là gì?", "options": ["A. DNA có U, RNA có T", "B. DNA có T không có U; RNA có U không có T", "C. DNA có 5 loại đơn phân", "D. Không khác nhau"], "answer": "B", "explain": "DNA có 4 loại nucleotide A, T, G, C; RNA có A, U, G, C.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Loại RNA nào trực tiếp mang thông tin di truyền từ DNA ra tế bào chất?", "options": ["A. tRNA", "B. rRNA", "C. mRNA", "D. Cả ba"], "answer": "C", "explain": "mRNA (RNA thông tin) sao chép thông tin từ gene rồi mang ra tế bào chất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một phân tử mRNA có 600 ribonucleotide. Gene tổng hợp nên nó có bao nhiêu nucleotide?", "options": ["A. 600", "B. 1200", "C. 300", "D. 1800"], "answer": "B", "explain": "mRNA được tổng hợp từ một mạch của gene nên gene dài gấp đôi: 1200 nucleotide.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Gene là gì?", "options": ["A. Một phân tử protein", "B. Một đoạn DNA mang thông tin quy định một chuỗi polypeptide hay một phân tử RNA", "C. Một bào quan", "D. Một loại lipid"], "answer": "B", "explain": "Đúng định nghĩa gene theo SGK.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Đánh giá các nhận định về gene.", "statements": ["a) Gene là đoạn DNA mang thông tin di truyền.", "b) Mỗi gene chiếm một locus xác định trên NST.", "c) Các alen là trạng thái khác nhau của cùng một gene.", "d) Một gene quy định nhiều chuỗi polypeptide khác nhau."], "answer": ["T", "T", "T", "F"], "explain": "Mỗi gene chỉ quy định một chuỗi polypeptide hoặc một phân tử RNA.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về chức năng.", "statements": ["a) DNA mang thông tin di truyền.", "b) RNA tham gia tổng hợp protein.", "c) tRNA vận chuyển amino acid.", "d) DNA trực tiếp tổng hợp protein."], "answer": ["T", "T", "T", "F"], "explain": "Protein được tổng hợp từ thông tin của gene qua RNA, DNA không trực tiếp tổng hợp protein.", "points": 1}, {"type": "short", "level": "VDC", "q": "Một đoạn DNA có trình tự một mạch là – T – A – C –. Mạch bổ sung là gì?", "answer": "A T G", "explain": "Theo nguyên tắc bổ sung: T-A, A-T, C-G.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Một đoạn DNA mang thông tin quy định một chuỗi polypeptide gọi là gì?", "answer": "Gene", "explain": "Gene là đoạn DNA mang thông tin di truyền.", "points": 0.5}]}]}
