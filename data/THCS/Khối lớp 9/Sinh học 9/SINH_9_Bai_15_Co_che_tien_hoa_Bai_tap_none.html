el": "VDC", "q": "Vì sao cách li địa lí chưa đủ để thành loài mới?", "options": ["A. Vì vẫn có thể giao phối khi gặp lại", "B. Vì địa lí thay đổi", "C. Vì không có đột biến", "D. Vì xa quá"], "answer": "A", "explain": "Phải có cách li sinh sản mới thành loài mới thực sự.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân tố tiến hóa nào làm nghèo vốn gene của quần thể?", "options": ["A. Đột biến", "B. Chọn lọc tự nhiên (đào thải alen)", "C. Di nhập", "D. Giao phối ngẫu nhiên"], "answer": "B", "explain": "Chọn lọc đào thải alen bất lợi làm nghèo vốn gene.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhân tố nào làm tăng đa dạng di truyền của quần thể?", "options": ["A. Đột biến và di nhập gene", "B. Chọn lọc ổn định", "C. Cận huyết", "D. Yếu tố ngẫu nhiên"], "answer": "A", "explain": "Đột biến tạo alen mới, di nhập đưa alen từ quần thể khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguồn nguyên liệu sơ cấp của tiến hóa là gì?", "options": ["A. Chọn lọc tự nhiên", "B. Đột biến", "C. Di cư", "D. Lai tạo"], "answer": "B", "explain": "Đột biến tạo alen mới, là nguyên liệu sơ cấp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhân tố tiến hóa nào có tính định hướng?", "options": ["A. Đột biến", "B. Chọn lọc tự nhiên", "C. Yếu tố ngẫu nhiên", "D. Di nhập gene"], "answer": "B", "explain": "Chọn lọc tự nhiên giữ alen có lợi nên có định hướng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về nhân tố tiến hóa.", "statements": ["a) Đột biến là nguyên liệu sơ cấp.", "b) Chọn lọc tự nhiên định hướng tiến hóa.", "c) Di nhập gene trao đổi gene giữa quần thể.", "d) Đột biến là nhân tố định hướng."], "answer": ["T", "T", "T", "F"], "explain": "Đột biến ngẫu nhiên, không định hướng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về chọn lọc tự nhiên.", "statements": ["a) Giữ lại alen có lợi.", "b) Đào thải alen có hại.", "c) Là nhân tố tiến hóa chủ yếu.", "d) Tạo ra
