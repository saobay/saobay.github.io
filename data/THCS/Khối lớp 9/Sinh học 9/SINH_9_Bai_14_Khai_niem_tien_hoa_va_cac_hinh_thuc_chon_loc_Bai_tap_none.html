n kháng kháng sinh", "explain": "Tần số alen kháng thuốc tăng.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Cá thể thích nghi sống sót nhiều hơn gọi là hiện tượng gì?", "answer": "Chọn lọc tự nhiên", "explain": "Môi trường chọn lọc.", "points": 0.5}]}]}
