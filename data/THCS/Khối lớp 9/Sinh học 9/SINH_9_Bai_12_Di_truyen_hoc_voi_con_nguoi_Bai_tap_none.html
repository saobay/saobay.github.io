 cận huyết làm tăng nguy cơ gì ở con?", "answer": "Tăng tỉ lệ con bị bệnh di truyền", "explain": "Cận huyết tăng đồng hợp gene lặn gây bệnh.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VDC", "q": "Một phụ nữ 40 tuổi mang thai. Bác sĩ khuyên nên sàng lọc trước sinh vì lí do gì?", "options": ["A. Vì tuổi cao tăng nguy cơ đột biến NST như Down", "B. Vì thai to", "C. Vì mẹ mệt", "D. Không cần thiết"], "answer": "A", "explain": "Tuổi mẹ cao tăng nguy cơ rối loạn phân li NST.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bảo vệ vốn gene của loài người gồm những biện pháp nào?", "options": ["A. Kết hôn cận huyết", "B. Tư vấn di truyền, sàng lọc trước sinh, tránh tác nhân gây đột biến", "C. Sinh nhiều con", "D. Không cần biện pháp"], "answer": "B", "explain": "Các biện pháp bảo vệ vốn gene đúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phụ nữ mang thai nên tránh gì để bảo vệ thai nhi?", "options": ["A. Ăn uống đủ chất", "B. Rượu bia, thuốc lá, hóa chất độc, tia phóng xạ", "C. Vận động nhẹ", "D. Khám thai"], "answer": "B", "explain": "Các tác nhân gây đột biến cần tránh khi mang thai.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một gia đình có tiền sử bệnh di truyền muốn sinh con. Họ nên làm gì trước?", "options": ["A. Sinh ngay", "B. Đến cơ sở y tế tư vấn di truyền", "C. Chờ đợi", "D. Không cần làm gì"], "answer": "B", "explain": "Tư vấn di truyền giúp đánh giá nguy cơ trước khi sinh con.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Liệu pháp gene (chữa bệnh bằng cách đưa gene lành vào cơ thể) dựa trên cơ sở nào?", "options": ["A. Thay đổi toàn bộ NST", "B. Đưa gene bình thường vào để bù đắp gene đột biến", "C. Cắt bỏ cơ quan", "D. Dùng thuốc"], "answer": "B", "explain": "Liệu pháp gene đưa gene lành thay thế chức năng gene bệnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phương pháp tế bào học phát hiện được loại bệnh nào?", "options": ["A. Bệnh do virus", "B. Bệnh do đột biến NST (Down, Turner...)", "C. Cảm cúm", "D. Đau đầu"], "answer": "B", "explain": "Karyotype phát hiện bất thường NST.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Đánh giá các nhận định về ung thư.", "statements": ["a) Ung thư liên quan đột biến gene.", "b) Chất gây đột biến tăng nguy cơ ung thư.", "c) Mọi ung thư đều di truyền cho con.", "d) Thuốc lá là tác nhân gây đột biến."], "answer": ["T", "T", "F", "T"], "explain": "Không phải mọi ung thư đều di truyền.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Đánh giá các nhận định về tư vấn di truyền.", "statements": ["a) Giúp đánh giá nguy cơ sinh con bệnh.", "b) Thay thế được sàng lọc trước sinh.", "c) Nên thực hiện khi có tiền sử bệnh di truyền.", "d) Có thể chữa khỏi mọi bệnh di truyền."], "answer": ["T", "F", "T", "F"], "explain": "Tư vấn không thay thế sàng lọc và không chữa được mọi bệnh.", "points": 1}, {"type": "short", "level": "TH", "q": "Phương pháp nào phát hiện bệnh do đột biến NST?", "answer": "Tế bào học", "explain": "Karyotype phát hiện bất thường NST.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Biện pháp phát hiện sớm bệnh di truyền ở thai nhi là gì?", "answer": "Sàng lọc trước sinh", "explain": "Chọc ối, siêu âm...", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VD", "q": "Để xác định một bệnh do gene trội hay lặn, dùng phương pháp nào?", "options": ["A. Nuôi cấy", "B. Phân tích phả hệ", "C. Đo chiều cao", "D. Xét nghiệm máu thường"], "answer": "B", "explain": "Phả hệ cho biết quy luật di truyền của bệnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một bệnh xuất hiện ở mọi thế hệ, người bệnh có ít nhất một bố/mẹ bệnh. Quy luật di truyền có thể là gì?", "options": ["A. Gene lặn NST thường", "B. Gene trội NST thường", "C. Gene NST Y", "D. Ngoài nhân"], "answer": "B", "explain": "Di truyền liên tục qua các thế hệ gợi ý gene trội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kiểu gene giống nhau nhưng biểu hiện kh
