e": "mcq", "level": "TH", "q": "The ______ of young people today is very different from the past.", "options": ["A. lifestyle", "B. custom", "C. value", "D. privacy"], "answer": "A", "explain": "lifestyle nghĩa là lối sống."}, {"type": "mcq", "level": "VD", "q": "I don't mind ______ for you.", "options": ["A. waiting", "B. to wait", "C. wait", "D. waited"], "answer": "A", "explain": "mind + V-ing."}, {"type": "mcq", "level": "VDC", "q": "Choose the word whose underlined letters nk are pronounced differently from the others.", "options": ["A. think", "B. bank", "C. thank", "D. singer"], "answer": "D", "explain": "Trong think, bank, thank cụm nk đọc là /ŋk/; trong singer cụm ng đọc là /ŋ/."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). In traditional Vietnamese families, the father was the breadwinner and the mother was a housewife. The father worked outside while the mother took care of the house and children. Today, both parents often work, and they share housework.", "statements": ["a) In the past, only the father worked outside.", "b) Mothers in the past did not work at all.", "c) Today both parents often share housework.", "d) Family roles have changed over time."], "answer": ["T", "F", "T", "T"], "explain": "Người mẹ xưa quán xuyến việc nhà và con cái — đó cũng là công việc; vai trò trong gia đình đã thay đổi."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Respecting the elderly is a beautiful Vietnamese tradition. Young people should behave politely towards older people. On Tet holiday, children wish their grandparents good health. These customs help keep family bonds strong.", "statements": ["a) Respecting the elderly is a Vietnamese tradition.", "b) Young people should behave rudely to older people.", "c) Children wish grandparents good health on Tet.", "d) Customs help strengthen family bonds."], "answer": ["T", "F", "T", "T"], "explain": "Người trẻ nên cư xử lễ phép (politely) chứ không thô lỗ với người lớn tuổi."}, {"type": "short", "level": "NB", "q": "Give the correct form of the verb in brackets: He hopes (become) ______ a doctor.", "answer": "to become", "explain": "hope + to V."}, {"type": "short", "level": "NB", "q": "Give the correct form of the verb in brackets: We enjoy (spend) ______ time together.", "answer": "spending", "explain": "enjoy + V-ing."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Young people today enjoy more ______ than in the past.", "options": ["A. freedom", "B. custom", "C. value", "D. privacy"], "answer": "A", "explain": "freedom nghĩa là sự tự do."}, {"type": "mcq", "level": "NB", "q": "She hopes ______ a scholarship next year.", "options": ["A. to win", "B. winning", "C. win", "D. won"], "answer": "A", "explain": "hope + to V."}, {"type": "mcq", "level": "TH", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. tolerant", "B. freedom", "C. custom", "D. behave"], "answer": "D", "explain": "tolerant, freedom, custom có trọng âm rơi vào âm tiết đầu; behave có trọng âm rơi vào âm tiết thứ hai."}, {"type": "mcq", "level": "TH", "q": "Would you mind ______ the window?", "options": ["A. opening", "B. to open", "C. open", "D. opened"], "answer": "A", "explain": "mind + V-ing."}, {"type": "mcq", "level": "VD", "q": "In an extended family, grandparents, parents and children live together. There are three ______ in one house.", "options": ["A. generations", "B. freedoms", "C. values", "D. customs"], "answer": "A", "explain": "generation nghĩa là thế hệ; ba thế hệ cùng sống trong một nhà."}, {"type": "mcq", "level": "VDC", "q": "I remember ______ the door, so it must be locked.", "options": ["A. locking", "B. to lock", "C. lock", "D. locked"], "answer": "A", "explain": "remember + V-ing nghĩa là nhớ đã làm gì (việc đã xảy ra)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Meals are important in Vietnamese families. In the past, the whole family ate together at fixed times. The youngest served rice to the elders first. Today, busy schedules make family meals less common, but many families still try to eat together at weekends.", "statements": ["a) Family meals were important in the past.", "b) The youngest served the elders first.", "c) Family meals are more common today.", "d) Many families still eat together at weekends."], "answer": ["T", "T", "F", "T"], "explain": "Bữa cơm gia đình ngày nay ít phổ biến hơn vì lịch trình bận rộn."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Clothes have changed a lot over time. In the past, Vietnamese women often wore ao dai every day. Men wore simple dark clothes. Nowadays, young people wear jeans and T-shirts, but ao dai is still worn on special occasions.", "statements": ["a) Vietnamese women wore ao dai daily in the past.", "b) Men in the past wore colourful clothes.", "c) Young people today never wear ao dai.", "d) Clothes have changed over time."], "answer": ["T", "F", "F", "T"], "explain": "Đàn ông xưa mặc đồ tối màu đơn giản; giới trẻ nay vẫn mặc áo dài vào dịp đặc biệt."}, {"type": "short", "level": "NB", "q": "Give the correct form of the verb in brackets: I want (learn) ______ to cook.", "answer": "to learn", "explain": "want + to V."}, {"type": "short", "level": "NB", "q": "Give the correct form of the verb in brackets: Keep (try) ______! You will succeed.", "answer": "trying", "explain": "keep + V-ing nghĩa là tiếp tục làm gì."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "They expect ______ the match.", "options": ["A. to win", "B. winning", "C. win", "D. won"], "answer": "A", "explain": "expect + to V."}, {"type": "mcq", "level": "NB", "q": "Respecting teachers is a traditional ______ in Viet Nam.", "options": ["A. value", "B. freedom", "C. privacy", "D. generation"], "answer": "A", "explain": "value nghĩa là giá trị."}, {"type": "mcq", "level": "TH", "q": "She keeps ______ about the past.", "options": ["A. talking", "B. to talk", "C. talk", "D. talked"], "answer": "A", "explain": "keep + V-ing nghĩa là tiếp tục làm gì."}, {"type": "mcq", "level": "TH", "q": "Children should ______ politely at school.", "options": ["A. behave", "B. ruin", "C. lose", "D. forget"], "answer": "A", "explain": "behave politely nghĩa là cư xử lễ phép."}, {"type": "mcq", "level": "VD", "q": "Choose the word in which the letter n sounds different from the others.", "options": ["A. morning", "B. evening", "C. running", "D. sun"], "answer": "D", "explain": "Trong morning, evening, running chữ n phát âm là /ŋ/; trong sun chữ n phát âm là /n/."}, {"type": "mcq", "level": "VDC", "q": "I forgot ______ the door, so I went back to check.", "options": ["A. to lock", "B. locking", "C. lock", "D. locked"], "answer": "A", "explain": "forget + to V nghĩa là quên phải làm gì (việc chưa làm)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Education was different in the past. Many children had to leave school early to work. Girls especially had fewer chances to study. Today, all children can go to school, and many girls become excellent students.", "statements": ["a) Many children left school early in the past.", "b) Girls had more chances to study than boys.", "c) All children can go to school today.", "d) Girls cannot be good students."], "answer": ["T", "F", "T", "F"], "explain": "Bé gái xưa ít cơ hội học hành hơn; ngày nay nhiều em trở thành học sinh xuất sắc."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Weddings in Viet Nam have both traditional and modern styles. In the past, parents chose partners for their children. Today, young people choose their own partners, but they still ask for their parents' blessing. The wedding ceremony is still an important family event.", "statements": ["a) Parents chose partners for children in the past.", "b) Young people today ignore their parents completely.", "c) Weddings are still important family events.", "d) Wedding styles have not changed."], "answer": ["T", "F", "T", "F"], "explain": "Người trẻ nay vẫn xin phép bố mẹ; phong cách cưới hỏi có cả truyền thống và hiện đại."}, {"type": "short", "level": "TH", "q": "Give the correct form of the verb in brackets: She practises (speak) ______ English every day.", "answer": "speaking", "explain": "practise + V-ing."}, {"type": "short", "level": "TH", "q": "Give the correct form of the verb in brackets: He refused (join) ______ the club.", "answer": "to join", "explain": "refuse + to V."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Every family needs some ______. Don't read my diary!", "options": ["A. privacy", "B. freedom", "C. custom", "D. value"], "answer": "A", "explain": "privacy nghĩa là sự riêng tư."}, {"type": "mcq", "level": "NB", "q": "We plan ______ Da Lat this summer.", "options": ["A. to visit", "B. visiting", "C. visit", "D. visited"], "answer": "A", "explain": "plan + to V."}, {"type": "mcq", "level": "TH", "q": "He suggested ______ early.", "options": ["A. leaving", "B. to leave", "C. leave", "D. left"], "answer": "A", "explain": "suggest + V-ing."}, {"type": "mcq", "level": "TH", "q": "The father is often the ______ in the family.", "options": ["A. breadwinner", "B. housewife", "C. custom", "D. value"], "answer": "A", "explain": "breadwinner là trụ cột gia đình, người kiếm tiền chính."}, {"type": "mcq", "level": "VD", "q": "She delayed ______ her decision.", "options": ["A. making", "B. to make", "C. make", "D. made"], "answer": "A", "explain": "delay + V-ing."}, {"type": "mcq", "level": "VDC", "q": "She decided to ______ her dream of becoming a singer.", "options": ["A. pursue", "B. obey", "C. behave", "D. ruin"], "answer": "A", "explain": "pursue nghĩa là theo đuổi."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Technology has changed family communication. In the past, families talked face to face every evening. Today, each person often looks at their own phone. Parents worry that children spend too little time talking with the family. Experts advise families to have phone-free meals together.", "statements": ["a) Families communicated face to face in the past.", "b) Technology has brought family members closer at meals.", "c) Parents are worried about phone use.", "d) Experts suggest phone-free family meals."], "answer": ["T", "F", "T", "T"], "explain": "Mỗi người dán mắt vào điện thoại riêng nên công nghệ chưa giúp gia đình gần nhau hơn trong bữa ăn."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Living in an extended family has both advantages and disadvantages. Grandparents can help look after children, and everyone shares the housework. However, different generations may disagree about lifestyles. Young couples sometimes prefer nuclear families to have more freedom.", "statements": ["a) Extended families have only advantages.", "b) Grandparents help with childcare in extended families.", "c) Generations never disagree.", "d) Some young couples prefer nuclear families for more freedom."], "answer": ["F", "T", "F", "T"], "explain": "Sống chung nhiều thế hệ có cả ưu và nhược điểm; các thế hệ đôi khi bất đồng về lối sống."}, {"type": "short", "level": "TH", "q": "Give the correct form of the verb in brackets: Do you mind (help) ______ me?", "answer": "helping", "explain": "mind + V-ing."}, {"type": "short", "level": "TH", "q": "Give the correct form of the verb in brackets: She wants (buy) ______ a new dress.", "answer": "to buy", "explain": "want + to V."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "I enjoy ______ books in my free time.", "options": ["A. reading", "B. to read", "C. read", "D. readed"], "answer": "A", "explain": "enjoy + V-ing."}, {"type": "mcq", "level": "NB", "q": "My mother is a ______. She takes care of our family full-time.", "options": ["A. housewife", "B. breadwinner", "C. custom", "D. value"], "answer": "A", "explain": "housewife là người nội trợ."}, {"type": "mcq", "level": "NB", "q": "He wants ______ a new phone.", "options": ["A. to buy", "B. buying", "C. buy", "D. bought"], "answer": "A", "explain": "want + to V."}, {"type": "mcq", "level": "TH", "q": "They avoid ______ out late at night.", "options": ["A. going", "B. to go", "C. go", "D. went"], "answer": "A", "explain": "avoid + V-ing."}, {"type": "mcq", "level": "VD", "q": "Choose the word whose underlined letters ng are pronounced differently from the others.", "options": ["A. sing", "B. long", "C. spring", "D. finger"], "answer": "D", "explain": "Trong sing, long, spring cụm ng đọc là /ŋ/; trong finger cụm ng đọc là /ŋg/."}, {"type": "mcq", "level": "VDC", "q": "I regret ______ you that the trip is cancelled.", "options": ["A. to tell", "B. telling", "C. tell", "D. told"], "answer": "A", "explain": "regret + to V nghĩa là tiếc phải thông báo việc gì (việc chưa xảy ra)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). In the past, Vietnamese villages had communal houses where people gathered for festivals and meetings. The village chief was highly respected. Today, community centres play a similar role. People still gather there for celebrations, keeping the community spirit alive.", "statements": ["a) Communal houses were meeting places in the past.", "b) The village chief was not respected.", "c) Community centres have a similar role today.", "d) Community spirit has disappeared."], "answer": ["T", "F", "T", "F"], "explain": "Trưởng làng rất được kính trọng; tinh thần cộng đồng vẫn được giữ gìn."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Food habits have changed in Viet Nam. In the past, people ate mostly rice and vegetables. Meat was only for special occasions. Today, people eat more meat and fast food. Doctors advise people to keep a balanced diet for good health.", "statements": ["a) People in the past ate a lot of fast food.", "b) Meat was for special occasions in the past.", "c) People today eat more meat and fast food.", "d) Doctors advise against a balanced diet."], "answer": ["F", "T", "T", "F"], "explain": "Người xưa chủ yếu ăn cơm và rau; bác sĩ khuyên giữ chế độ ăn cân bằng."}, {"type": "short", "level": "TH", "q": "Give the correct form of the verb in brackets: He enjoys (play) ______ chess.", "answer": "playing", "explain": "enjoy + V-ing."}, {"type": "short", "level": "TH", "q": "Give the correct form of the verb in brackets: We decided (stay) ______ at home.", "answer": "to stay", "explain": "decide + to V."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Children must ______ their parents.", "options": ["A. obey", "B. ruin", "C. lose", "D. forget"], "answer": "A", "explain": "obey nghĩa là vâng lời."}, {"type": "mcq", "level": "NB", "q": "She learnt ______ when she was five.", "options": ["A. to swim", "B. swimming", "C. swim", "D. swam"], "answer": "A", "explain": "learn + to V (học cách làm gì)."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose letter n has a different pronunciation from the others.", "options": ["A. nine", "B. name", "C. night", "D. sing"], "answer": "D", "explain": "Trong nine, name, night chữ n phát âm là /n/; trong sing chữ n phát âm là /ŋ/."}, {"type": "mcq", "level": "TH", "q": "He admitted ______ the window.", "options": ["A. breaking", "B. to break", "C. break", "D. broke"], "answer": "A", "explain": "admit + V-ing nghĩa là thừa nhận đã làm gì."}, {"type": "mcq", "level": "VD", "q": "I can't stand ______ in queues.", "options": ["A. waiting", "B. to wait", "C. wait", "D. waited"], "answer": "A", "explain": "can't stand + V-ing nghĩa là không chịu nổi việc gì."}, {"type": "mcq", "level": "VDC", "q": "Try ______ the window; it's very hot in here.", "options": ["A. opening", "B. to open", "C. open", "D. opened"], "answer": "A", "explain": "try + V-ing nghĩa là thử làm gì xem sao."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Leisure activities have changed a lot. In the past, children played folk games like hide-and-seek and tug of war. They also flew kites in the fields. Today, many children play video games on phones. Parents hope their children will spend more time outdoors.", "statements": ["a) Children in the past played folk games.", "b) Kite flying was popular in the countryside.", "c) All children today play outdoors.", "d) Parents want children to be more active outdoors."], "answer": ["T", "T", "F", "T"], "explain": "Trẻ em xưa thả diều trên đồng; ngày nay nhiều em chơi game trên điện thoại."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The ao dai is a symbol of Vietnamese women. In the past, female students wore white ao dai to school every day. Today, they wear it only on special occasions like Tet or graduation. However, the ao dai remains a source of pride for Vietnamese people.", "statements": ["a) The ao dai symbolises Vietnamese women.", "b) Female students wore ao dai daily in the past.", "c) Students never wear ao dai today.", "d) Vietnamese people are proud of the ao dai."], "answer": ["T", "T", "F", "T"], "explain": "Ngày nay học sinh vẫn mặc áo dài vào dịp đặc biệt như Tết hay lễ tốt nghiệp."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: She considered (move) ______ to the city.", "answer": "moving", "explain": "consider + V-ing."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE suitable word: He promised ______ help me with maths.", "answer": "to", "explain": "promise + to V: promised to help."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "They decided ______ early.", "options": ["A. to leave", "B. leaving", "C. leave", "D. left"], "answer": "A", "explain": "decide + to V."}, {"type": "mcq", "level": "NB", "q": "Burning incense for ancestors is an old ______.", "options": ["A. custom", "B. freedom", "C. privacy", "D. value"], "answer": "A", "explain": "custom nghĩa là phong tục."}, {"type": "mcq", "level": "NB", "q": "Choose the word which is stressed differently from the others.", "options": ["A. family", "B. custom", "C. value", "D. obey"], "answer": "D", "explain": "family, custom, value có trọng âm rơi vào âm tiết đầu; obey có trọng âm rơi vào âm tiết thứ hai."}, {"type": "mcq", "level": "TH", "q": "She finished ______ her essay an hour ago.", "options": ["A. writing", "B. to write", "C. write", "D. wrote"], "answer": "A", "explain": "finish + V-ing."}, {"type": "mcq", "level": "VD", "q": "Young children are ______ on their parents for everything.", "options": ["A. dependent", "B. tolerant", "C. free", "D. strict"], "answer": "A", "explain": "dependent on nghĩa là phụ thuộc vào."}, {"type": "mcq", "level": "VDC", "q": "Remember ______ your homework before class.", "options": ["A. to do", "B. doing", "C. do", "D. done"], "answer": "A", "explain": "remember + to V nghĩa là nhớ phải làm gì (việc chưa làm)."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Gender roles in Vietnamese families are changing. In the past, men made all important decisions. Women stayed at home and followed their husbands' decisions. Today, women work as doctors, teachers and managers. Couples now discuss and decide things together, which makes families happier.", "statements": ["a) Men made all decisions in the past.", "b) Women in the past had successful careers outside.", "c) Modern couples decide things together.", "d) Sharing decisions makes families happier."], "answer": ["T", "F", "T", "T"], "explain": "Phụ nữ xưa ở nhà theo quyết định của chồng; nay các cặp vợ chồng cùng bàn bạc, quyết định."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many young Vietnamese are returning to traditional values. They enjoy wearing ao dai, learning folk songs and cooking traditional dishes. They believe modern life and tradition can go together. This trend shows that Vietnamese culture remains strong among the young generation.", "statements": ["a) Young people are ignoring traditions.", "b) They enjoy traditional clothes, music and food.", "c) They think tradition conflicts with modern life.", "d) Vietnamese culture is still strong among the youth."], "answer": ["F", "T", "F", "T"], "explain": "Giới trẻ đang quay về với giá trị truyền thống; họ tin hiện đại và truyền thống có thể song hành."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: I suggest (visit) ______ the museum.", "answer": "visiting", "explain": "suggest + V-ing."}, {"type": "short", "level": "VD", "q": "Give the correct form of the verb in brackets: She expects (pass) ______ the exam.", "answer": "to pass", "explain": "expect + to V."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "He agreed ______ me his bike.", "options": ["A. to lend", "B. lending", "C. lend", "D. lent"], "answer": "A", "explain": "agree + to V."}, {"type": "mcq", "level": "NB", "q": "Three ______ live in our house: grandparents, parents and children.", "options": ["A. generations", "B. freedoms", "C. values", "D. customs"], "answer": "A", "explain": "generation nghĩa là thế hệ."}, {"type": "mcq", "level": "NB", "q": "Do you fancy ______ to the cinema tonight?", "options": ["A. going", "B. to go", "C. go", "D. went"], "answer": "A", "explain": "fancy + V-ing nghĩa là thích."}, {"type": "mcq", "level": "TH", "q": "She refused ______ the invitation.", "options": ["A. to accept", "B. accepting", "C. accept", "D. accepted"], "answer": "A", "explain": "refuse + to V."}, {"type": "mcq", "level": "VD", "q": "Choose the word in which ng is pronounced differently from the others.", "options": ["A. morning", "B. singing", "C. dancing", "D. longer"], "answer": "D", "explain": "Trong morning, singing, dancing cụm ng đọc là /ŋ/; trong longer cụm ng đọc là /ŋg/."}, {"type": "mcq", "level": "VDC", "q": "Stop ______ noise, please! I'm studying.", "options": ["A. making", "B. to make", "C. make", "D. made"], "answer": "A", "explain": "stop + V-ing nghĩa là dừng hẳn việc đang làm."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Family reunions on Tet are precious moments. Family members living far away try to come home. They cook traditional foods like banh chung together. While the adults are preparing the feast, children are playing and laughing. These moments create lifelong memories.", "statements": ["a) Family members try to return home on Tet.", "b) They cook banh chung together.", "c) Children help cook while adults play.", "d) Tet reunions create lasting memories."], "answer": ["T", "T", "F", "T"], "explain": "Người lớn chuẩn bị cỗ còn trẻ em chơi đùa; những khoảnh khắc này tạo nên ký ức suốt đời."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some old customs are disappearing. Fewer young people know how to make traditional crafts. However, many schools now teach folk arts to students. Artisans also open workshops for tourists. Thanks to these efforts, some traditions are being revived.", "statements": ["a) All old customs have disappeared.", "b) Schools teach folk arts to students.", "c) Artisans open workshops for tourists.", "d) Efforts are helping revive some traditions."], "answer": ["F", "T", "T", "T"], "explain": "Chỉ một số phong tục đang mai một; nhờ các nỗ lực, một số truyền thống đang được hồi sinh."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: Would you mind (open) ______ the door?", "answer": "opening", "explain": "mind + V-ing."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Parents should be (tolerance) ______ towards their children.", "answer": "tolerant", "explain": "Sau be cần một tính từ: tolerant nghĩa là khoan dung."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "She hopes ______ her grandparents this weekend.", "options": ["A. to visit", "B. visiting", "C. visit", "D. visited"], "answer": "A", "explain": "hope + to V."}, {"type": "mcq", "level": "NB", "q": "Honesty is an important ______ in life.", "options": ["A. value", "B. custom", "C. freedom", "D. privacy"], "answer": "A", "explain": "value nghĩa là giá trị."}, {"type": "mcq", "level": "TH", "q": "We enjoy ______ together on Sundays.", "options": ["A. cooking", "B. to cook", "C. cook", "D. cooked"], "answer": "A", "explain": "enjoy + V-ing."}, {"type": "mcq", "level": "TH", "q": "Choose the word with a different n sound from the others.", "options": ["A. sun", "B. run", "C. fun", "D. song"], "answer": "D", "explain": "Trong sun, run, fun chữ n phát âm là /n/; trong song chữ n phát âm là /ŋ/."}, {"type": "mcq", "level": "VD", "q": "He denied ______ my pen.", "options": ["A. taking", "B. to take", "C. take", "D. took"], "answer": "A", "explain": "deny + V-ing nghĩa là phủ nhận đã làm gì."}, {"type": "mcq", "level": "VDC", "q": "Lan: In my opinion, young people should live in nuclear families. Minh: ______", "options": ["A. I agree. It gives them more privacy.", "B. I don't like rice.", "C. That's a nice shirt.", "D. See you later."], "answer": "A", "explain": "Câu trả lời đồng tình với ý kiến được nêu ra."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Balancing tradition and modern life is a challenge for many families. Grandparents want to keep old customs, while teenagers love new trends. Good communication helps both sides understand each other. When family members are tolerant, the family stays happy despite differences.", "statements": ["a) Grandparents and teenagers always agree.", "b) Communication helps generations understand each other.", "c) Tolerance keeps families happy.", "d) Differences always destroy families."], "answer": ["F", "T", "T", "F"], "explain": "Cân bằng truyền thống và hiện đại là thách thức; gia đình vẫn hạnh phúc dù có khác biệt."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Vietnamese lifestyles will keep changing in the future. More people will live in cities and work online. However, core values like family love and respect for elders will remain. The young generation will decide how to blend the old and the new.", "statements": ["a) Lifestyles will stay exactly the same.", "b) More people may work online in cities.", "c) Core family values will disappear.", "d) The young will shape the future lifestyle."], "answer": ["F", "T", "F", "T"], "explain": "Lối sống sẽ tiếp tục thay đổi; các giá trị cốt lõi như tình cảm gia đình vẫn còn đó."}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE suitable word: She is looking forward ______ hearing from you.", "answer": "to", "explain": "look forward to + V-ing; to ở đây là giới từ nên điền to."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: They have decided (build) ______ a new house.", "answer": "to build", "explain": "decide + to V."}]}]}</script>
