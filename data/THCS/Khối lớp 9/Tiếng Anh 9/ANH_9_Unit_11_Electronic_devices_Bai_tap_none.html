<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'a' is pronounced differently from the others.","options":["A. camcorder","B. plastic","C. laptop","D. smartwatch"],"answer":"D","explain":"Chữ a trong smartwatch đọc là ɑː, còn camcorder, plastic, laptop đọc là æ."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. touchscreen","B. smartwatch","C. wireless","D. device"],"answer":"D","explain":"device có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"Most modern phones have a _____, so you can use your fingers to control them.","options":["A. touchscreen","B. camcorder","C. charger","D. leaflet"],"answer":"A","explain":"touchscreen nghĩa là màn hình cảm ứng."},{"type":"mcq","level":"TH","q":"I suggest _____ a new password for your account.","options":["A. to use","B. using","C. use","D. used"],"answer":"B","explain":"Sau suggest dùng V-ing, không dùng to V."},{"type":"mcq","level":"TH","q":"Shop assistant: Can I help you? - Customer: _____","options":["A. Yes, I am looking for a wireless charger.","B. I help you.","C. No, you cannot.","D. Chargers are good."],"answer":"A","explain":"Khi được hỏi có cần giúp gì, khách hàng nêu rõ món đồ mình muốn tìm."},{"type":"mcq","level":"VD","q":"She recommended that he _____ his phone regularly.","options":["A. updates","B. update","C. to update","D. updating"],"answer":"B","explain":"Cấu trúc recommend cộng that cộng S cộng should cộng động từ nguyên thể, nên dùng update."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). A smartwatch is a small computer on your wrist. It can show the time, count your steps and measure your heart rate. Many smartwatches need a phone nearby to work well. You can also use some smartwatches to make phone calls.","statements":["a) A smartwatch is worn on the wrist.","b) A smartwatch can measure your heart rate.","c) All smartwatches work without a phone.","d) Some smartwatches can make phone calls."],"answer":["T","T","F","T"],"explain":"Câu c sai vì nhiều đồng hồ thông minh cần điện thoại ở gần mới hoạt động tốt."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). E-readers are devices for reading digital books. They use special screens that are easy on the eyes, even in bright sunlight. One e-reader can hold thousands of books, so readers do not need to carry heavy bags. However, e-readers cannot replace the feeling of holding a real paper book for many people.","statements":["a) E-readers are used for reading digital books.","b) E-reader screens are hard to read in sunlight.","c) An e-reader can store thousands of books.","d) Everyone prefers e-readers to paper books."],"answer":["T","F","T","F"],"explain":"Câu b sai vì màn hình máy đọc sách dễ đọc ngay cả dưới nắng. Câu d sai vì nhiều người vẫn thích cảm giác cầm sách giấy."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The new phone is very (style) _____ and modern.","answer":"stylish","explain":"Sau very cần tính từ, dạng tính từ của style trong ngữ cảnh này là stylish."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: You need a _____ to charge your phone when the battery is low.","answer":"charger","explain":"charger nghĩa là bộ sạc, cục sạc."}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'ea' is pronounced differently from the others.","options":["A. e-reader","B. leaflet","C. cleaner","D. headset"],"answer":"D","explain":"Chữ ea trong headset đọc là e, còn e-reader, leaflet, cleaner đọc là iː."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. portable","B. virtual","C. copper","D. suggest"],"answer":"D","explain":"suggest có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"A robotic vacuum _____ can clean the floor automatically.","options":["A. cleaner","B. printer","C. camcorder","D. leaflet"],"answer":"A","explain":"robotic vacuum cleaner nghĩa là robot hút bụi."},{"type":"mcq","level":"TH","q":"The teacher advised us _____ our phones during the exam.","options":["A. to turn off","B. turning off","C. turn off","D. turned off"],"answer":"A","explain":"Cấu trúc advise cộng tân ngữ cộng to V, nên dùng to turn off."},{"type":"mcq","level":"TH","q":"This laptop is made of _____, a light metal, so it is easy to carry.","options":["A. aluminium","B. rubber","C. plastic","D. cardboard"],"answer":"A","explain":"aluminium là nhôm, kim loại nhẹ dùng làm vỏ laptop."},{"type":"mcq","level":"VD","q":"The shop assistant recommended that we _____ the new smartwatch.","options":["A. should try","B. to try","C. trying","D. tries"],"answer":"A","explain":"Cấu trúc recommend cộng that cộng S cộng should cộng động từ nguyên thể."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). 3D printers can make real objects from digital designs. They build objects layer by layer using materials like plastic. Today people use 3D printers to make toys, tools and even parts of houses. In the future, 3D printers may print food.","statements":["a) 3D printers make objects from digital designs.","b) 3D printers build objects layer by layer.","c) People only use 3D printers to make toys.","d) 3D printers may print food in the future."],"answer":["T","T","F","T"],"explain":"Câu c sai vì máy in 3D còn dùng để làm dụng cụ và bộ phận nhà cửa."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Wireless headphones connect to your phone without cables. They use Bluetooth technology to receive sound. Most wireless headphones need charging after several hours of use. Some people think wired headphones give better sound quality, but wireless ones are more convenient for sports.","statements":["a) Wireless headphones need cables to connect.","b) Wireless headphones use Bluetooth technology.","c) Wireless headphones never need charging.","d) Wireless headphones are convenient for sports."],"answer":["F","T","F","T"],"explain":"Câu a sai vì tai nghe không dây không cần cáp. Câu c sai vì chúng cần sạc sau vài giờ sử dụng."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: This old laptop is not (rely) _____ anymore.","answer":"reliable","explain":"Sau is not cần tính từ, dạng tính từ của rely là reliable, nghĩa là đáng tin cậy."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: The programs you install on a computer are called _____.","answer":"software","explain":"software nghĩa là phần mềm máy tính."}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'a' is pronounced differently from the others.","options":["A. smartwatch","B. cardboard","C. charger","D. plastic"],"answer":"D","explain":"Chữ a trong plastic đọc là æ, còn smartwatch, cardboard, charger đọc là ɑː."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. camcorder","B. stylish","C. plastic","D. advise"],"answer":"D","explain":"advise có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"My phone is _____, so I can take it everywhere with me.","options":["A. portable","B. wireless","C. virtual","D. durable"],"answer":"A","explain":"portable nghĩa là có thể mang theo, xách tay."},{"type":"mcq","level":"TH","q":"He suggested _____ to the cinema this weekend.","options":["A. to go","B. going","C. go","D. goes"],"answer":"B","explain":"Sau suggest dùng V-ing, không dùng to V."},{"type":"mcq","level":"TH","q":"Minh: My laptop is very slow. - Hoa: _____","options":["A. Why do not you buy a new one?","B. Laptops are expensive.","C. I like slow laptops.","D. Slow is good."],"answer":"A","explain":"Why do not you cộng động từ là cấu trúc gợi ý, phù hợp với tình huống."},{"type":"mcq","level":"VD","q":"He suggested to buy a new phone. Which part is wrong?","options":["A. He","B. suggested","C. to buy","D. a new phone"],"answer":"C","explain":"Sau suggest phải dùng V-ing, phải sửa to buy thành buying."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). A camcorder is a small camera for recording videos. Many people use camcorders to film family events and trips. Modern camcorders are light and easy to carry. Some phones today can record videos as well as a camcorder.","statements":["a) A camcorder is used to record videos.","b) People use camcorders to film family events.","c) Modern camcorders are heavy and big.","d) Phones cannot record videos."],"answer":["T","T","F","F"],"explain":"Câu c sai vì máy quay hiện đại nhẹ và dễ mang. Câu d sai vì điện thoại ngày nay quay video rất tốt."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Virtual reality headsets let users enter a computer-made world. When you wear one, you can look around and feel like you are inside a game or a film. Schools are starting to use virtual reality for lessons. However, wearing the headset for too long can make some people feel dizzy.","statements":["a) Virtual reality headsets create a computer-made world.","b) Users can look around inside the virtual world.","c) Schools never use virtual reality.","d) Long use of the headset is always comfortable."],"answer":["T","T","F","F"],"explain":"Câu c sai vì trường học đã bắt đầu dùng thực tế ảo. Câu d sai vì đeo lâu có thể gây chóng mặt."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The instructions were (help) _____ for beginners.","answer":"helpful","explain":"Sau were cần tính từ, dạng tính từ của help trong ngữ cảnh này là helpful."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: Headphones without wires are called _____ headphones.","answer":"wireless","explain":"wireless nghĩa là không dây."}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'e' is pronounced differently from the others.","options":["A. e-reader","B. headset","C. steel","D. leaflet"],"answer":"B","explain":"Chữ e trong headset đọc là e, còn e-reader, steel, leaflet đọc là iː."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. wireless","B. virtual","C. rubber","D. submit"],"answer":"D","explain":"submit có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"Tyres are usually made of _____, which is soft and elastic.","options":["A. rubber","B. steel","C. cardboard","D. copper"],"answer":"A","explain":"rubber nghĩa là cao su, vật liệu làm lốp xe."},{"type":"mcq","level":"TH","q":"They recommended _____ up smoking.","options":["A. give","B. to give","C. giving","D. gave"],"answer":"C","explain":"Sau recommend dùng V-ing khi không chỉ rõ người thực hiện."},{"type":"mcq","level":"TH","q":"Please _____ your homework on the school website before Friday.","options":["A. submit","B. suggest","C. advise","D. recommend"],"answer":"A","explain":"submit nghĩa là nộp bài tập trực tuyến."},{"type":"mcq","level":"VD","q":"The doctor advised that he _____ more water every day.","options":["A. should drink","B. to drink","C. drinking","D. drinks"],"answer":"A","explain":"Cấu trúc advise cộng that cộng S cộng should cộng động từ nguyên thể."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Aluminium is a light silver-grey metal. Many laptops have an aluminium body to make them lightweight. Aluminium does not rust easily. It is also used to make cans and kitchen tools.","statements":["a) Aluminium is a heavy metal.","b) Laptops use aluminium to become lighter.","c) Aluminium rusts easily.","d) Aluminium is used to make cans."],"answer":["F","T","F","T"],"explain":"Câu a sai vì nhôm là kim loại nhẹ. Câu c sai vì nhôm không dễ bị gỉ."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Self-driving cars use cameras and sensors to see the road. They can follow traffic rules without a driver. Many companies are testing self-driving cars in cities. However, most countries still do not allow them on public roads.","statements":["a) Self-driving cars use cameras and sensors.","b) Self-driving cars need a driver to follow rules.","c) Companies are testing self-driving cars.","d) All countries allow self-driving cars on roads."],"answer":["T","F","T","F"],"explain":"Câu b sai vì xe tự lái không cần tài xế. Câu d sai vì hầu hết các nước vẫn chưa cho phép xe tự lái trên đường công cộng."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The new smartwatch is (afford) _____ for most students.","answer":"affordable","explain":"Sau is cần tính từ, dạng tính từ của afford là affordable, nghĩa là giá phải chăng."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: A small device you wear on your wrist that shows time and messages is a _____.","answer":"smartwatch","explain":"smartwatch nghĩa là đồng hồ thông minh."}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'oo' is pronounced differently from the others.","options":["A. Bluetooth","B. soon","C. look","D. school"],"answer":"C","explain":"Chữ oo trong look đọc là ʊ, còn Bluetooth, soon, school đọc là uː."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. touchscreen","B. charger","C. plastic","D. recommend"],"answer":"D","explain":"recommend có trọng âm ở âm tiết 3, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"You can read thousands of books on an _____, which is lighter than a bag of books.","options":["A. e-reader","B. camcorder","C. leaflet","D. printer"],"answer":"A","explain":"e-reader là máy đọc sách điện tử, chứa được hàng nghìn cuốn sách."},{"type":"mcq","level":"TH","q":"I suggest _____ the user manual before using the device.","options":["A. reading","B. to read","C. read","D. reads"],"answer":"A","explain":"Sau suggest dùng V-ing."},{"type":"mcq","level":"TH","q":"Lan: This printer is too slow. - Mai: _____","options":["A. I suggest buying a new one.","B. Printers print.","C. Slow printers are cheap.","D. I like printing."],"answer":"A","explain":"Dùng cấu trúc suggest cộng V-ing để đưa ra gợi ý phù hợp tình huống."},{"type":"mcq","level":"VD","q":"She advised me _____ my password regularly.","options":["A. to change","B. changing","C. change","D. changed"],"answer":"A","explain":"Cấu trúc advise cộng tân ngữ cộng to V."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Copper is a reddish-brown metal. It conducts electricity very well, so it is used to make wires and cables. Copper is also used in phones and computers. Old copper coins turn green over time.","statements":["a) Copper is reddish-brown.","b) Copper is a poor conductor of electricity.","c) Copper is used to make wires.","d) Copper is used in phones and computers."],"answer":["T","F","T","T"],"explain":"Câu b sai vì đồng dẫn điện rất tốt."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Portable chargers, also called power banks, store electricity for later use. They are useful when you travel and cannot find a socket. A full power bank can charge a phone several times. However, power banks themselves need recharging after use.","statements":["a) Power banks store electricity.","b) Power banks are useful when travelling.","c) One power bank can charge a phone only once.","d) Power banks never need recharging."],"answer":["T","T","F","F"],"explain":"Câu c sai vì một cục sạc dự phòng đầy có thể sạc điện thoại nhiều lần. Câu d sai vì bản thân nó cũng cần sạc lại."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The new phone has a large (touch) _____.","answer":"touchscreen","explain":"Cần danh từ ghép chỉ màn hình cảm ứng, dạng đúng là touchscreen."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: A machine that cleans floors by itself is a robotic vacuum _____.","answer":"cleaner","explain":"robotic vacuum cleaner nghĩa là robot hút bụi."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 's' is pronounced differently from the others.","options":["A. touchscreen","B. wireless","C. software","D. advise"],"answer":"D","explain":"Chữ s trong advise đọc là z, còn touchscreen, wireless, software đọc là s."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. smartwatch","B. touchscreen","C. camcorder","D. electronic"],"answer":"D","explain":"electronic có trọng âm ở âm tiết 3, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"_____ is a strong metal used to build bridges and tall buildings.","options":["A. Steel","B. Rubber","C. Cardboard","D. Plastic"],"answer":"A","explain":"steel nghĩa là thép, kim loại cứng dùng trong xây dựng."},{"type":"mcq","level":"TH","q":"Our teacher suggested _____ a robot for the science fair.","options":["A. to make","B. making","C. make","D. made"],"answer":"B","explain":"Sau suggest dùng V-ing."},{"type":"mcq","level":"TH","q":"A _____ is a piece of paper that gives information about a product.","options":["A. leaflet","B. charger","C. printer","D. screen"],"answer":"A","explain":"leaflet nghĩa là tờ rơi quảng cáo."},{"type":"mcq","level":"VD","q":"The manual recommended that users _____ the device away from water.","options":["A. should keep","B. to keep","C. keeping","D. keeps"],"answer":"A","explain":"Cấu trúc recommend cộng that cộng S cộng should cộng động từ nguyên thể."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Plastic is a common material for electronic devices. It is cheap and easy to shape. However, plastic waste harms the environment. People should recycle plastic products after use.","statements":["a) Plastic is cheap and easy to shape.","b) Plastic is rarely used for devices.","c) Plastic waste is good for the environment.","d) People should recycle plastic products."],"answer":["T","F","F","T"],"explain":"Câu b sai vì nhựa được dùng phổ biến. Câu c sai vì rác thải nhựa gây hại môi trường."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Smart homes use connected devices to control lights, temperature and security. Owners can control everything from a phone app. Smart homes save energy by turning off devices automatically. However, they can be expensive to set up and need a stable internet connection.","statements":["a) Smart homes use connected devices.","b) Owners control smart homes with a phone app.","c) Smart homes waste a lot of energy.","d) Setting up a smart home is always cheap."],"answer":["T","T","F","F"],"explain":"Câu c sai vì nhà thông minh tiết kiệm năng lượng. Câu d sai vì lắp đặt nhà thông minh có thể tốn kém."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The (invent) _____ of the telephone changed the world.","answer":"invention","explain":"Sau mạo từ the cần danh từ, dạng danh từ của invent là invention."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: Modern phones are controlled by touching the _____.","answer":"screen","explain":"screen nghĩa là màn hình, chạm vào màn hình để điều khiển điện thoại."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'a' is pronounced differently from the others.","options":["A. laptop","B. plastic","C. cardboard","D. camcorder"],"answer":"C","explain":"Chữ a trong cardboard đọc là ɑː, còn laptop, plastic, camcorder đọc là æ."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. virtual","B. durable","C. software","D. submit"],"answer":"D","explain":"submit có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"_____ reality lets you experience a world created by a computer.","options":["A. Virtual","B. Wireless","C. Portable","D. Durable"],"answer":"A","explain":"virtual reality nghĩa là thực tế ảo."},{"type":"mcq","level":"TH","q":"My dad advised _____ too much time on the phone.","options":["A. not to spend","B. not spending","C. do not spend","D. to not spend"],"answer":"A","explain":"Cấu trúc advise cộng tân ngữ cộng to V, dạng phủ định là not to V."},{"type":"mcq","level":"TH","q":"Hoa: Can you show me how to use this e-reader? - Nam: _____","options":["A. Sure, it is very easy.","B. E-readers are small.","C. I read books.","D. No, I cannot read."],"answer":"A","explain":"Đáp lại lời nhờ giúp đỡ một cách nhiệt tình và tích cực."},{"type":"mcq","level":"VD","q":"The experts suggest that schools _____ more computers for students.","options":["A. should buy","B. to buy","C. buying","D. buys"],"answer":"A","explain":"Cấu trúc suggest cộng that cộng S cộng should cộng động từ nguyên thể."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). A drone is a small flying device with a camera. People use drones to take photos from the sky. Farmers use drones to check their fields. Drones must follow safety rules when flying.","statements":["a) A drone can fly and take photos.","b) Farmers use drones to check fields.","c) Drones are large planes for passengers.","d) Drone users must follow safety rules."],"answer":["T","T","F","T"],"explain":"Câu c sai vì drone là thiết bị bay nhỏ, không phải máy bay chở khách."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Old electronic devices should not go into normal bins. They contain harmful materials that pollute soil and water. Many cities have special places to collect old phones and computers. Recycling them also saves valuable metals like gold and copper.","statements":["a) Old devices are safe in normal bins.","b) Old devices can pollute soil and water.","c) Cities collect old electronics at special places.","d) Recycling saves valuable metals."],"answer":["F","T","T","T"],"explain":"Câu a sai vì thiết bị cũ chứa chất độc hại, không được bỏ vào thùng rác thường."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The laptop works (perfect) _____ after the repair.","answer":"perfectly","explain":"Cần trạng từ bổ nghĩa cho động từ works, dạng trạng từ của perfect là perfectly."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: Wires made of _____ carry electricity into our homes.","answer":"copper","explain":"Dây điện thường làm bằng đồng vì đồng dẫn điện tốt."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'ed' is pronounced differently from the others.","options":["A. charged","B. submitted","C. plugged","D. saved"],"answer":"B","explain":"Đuôi ed trong submitted đọc là ɪd, còn charged, plugged, saved đọc là d."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. portable","B. wireless","C. steel","D. advise"],"answer":"D","explain":"advise có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"This bag is made of _____, so it is light but not very strong.","options":["A. cardboard","B. steel","C. copper","D. aluminium"],"answer":"A","explain":"cardboard là bìa các tông, nhẹ nhưng không chắc."},{"type":"mcq","level":"TH","q":"She recommended _____ this software to protect your computer.","options":["A. to install","B. installing","C. install","D. installed"],"answer":"B","explain":"Sau recommend dùng V-ing khi không chỉ rõ người thực hiện."},{"type":"mcq","level":"TH","q":"A good school bag should be _____ enough to last for years.","options":["A. durable","B. virtual","C. wireless","D. portable"],"answer":"A","explain":"durable nghĩa là bền, dùng được lâu."},{"type":"mcq","level":"VD","q":"The teacher suggested that we should to bring laptops to class. Which part is wrong?","options":["A. suggested","B. that","C. should to bring","D. to class"],"answer":"C","explain":"Sau should là động từ nguyên thể không có to, phải sửa thành should bring."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Touchscreens respond to the touch of a finger. They are used on phones, tablets and cash machines. Touchscreens are easy to use, even for young children. However, they can break easily if dropped.","statements":["a) Touchscreens work by touch.","b) Touchscreens are only on phones.","c) Young children can use touchscreens easily.","d) Touchscreens never break."],"answer":["T","F","T","F"],"explain":"Câu b sai vì màn hình cảm ứng còn có trên máy tính bảng và cây ATM. Câu d sai vì rơi có thể làm vỡ màn hình."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Artificial intelligence is now inside many devices. It helps phones understand your voice and cameras take better photos. AI can also suggest films you may like. Some people worry that AI will ợi ý mẫu rẻ hơn khi khách chê đắt."},{"type":"mcq","level":"VD","q":"I suggest that you _____ your phone before the flight.","options":["A. should turn off","B. to turn off","C. turning off","D. turns off"],"answer":"A","explain":"Cấu trúc suggest cộng that cộng S cộng should cộng động từ nguyên thể."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Tablets are bigger than phones but smaller than laptops. Students use tablets to read books and watch lessons. Many tablets have long battery life. Tablets are heavier than desktop computers.","statements":["a) Tablets are bigger than phones.","b) Students use tablets for learning.","c) Tablets have short battery life.","d) Tablets are heavier than desktops."],"answer":["T","T","F","F"],"explain":"Câu c sai vì nhiều máy tính bảng có pin lâu. Câu d sai vì máy tính bảng nhẹ hơn máy tính để bàn."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Passwords protect our devices and accounts. A strong password should mix letters, numbers and symbols. People should not use birthdays as passwords. Changing passwords regularly keeps accounts safer.","statements":["a) Passwords protect devices and accounts.","b) Strong passwords mix letters, numbers and symbols.","c) Birthdays are good passwords.","d) Regular changes make accounts safer."],"answer":["T","T","F","T"],"explain":"Câu c sai vì không nên dùng ngày sinh làm mật khẩu."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The robot moves (quick) _____ around the room.","answer":"quickly","explain":"Cần trạng từ bổ nghĩa cho động từ moves, dạng đúng là quickly."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: Steel is made mostly from _____.","answer":"iron","explain":"Thép được luyện chủ yếu từ sắt."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'o' is pronounced differently from the others.","options":["A. robotic","B. portable","C. software","D. copper"],"answer":"A","explain":"Chữ o trong robotic đọc là əʊ, còn portable đọc là ɔː, software và copper đọc là ɒ."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. touchscreen","B. portable","C. virtual","D. device"],"answer":"D","explain":"device có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"Many food boxes are made of _____, which is cheap and recyclable.","options":["A. cardboard","B. steel","C. copper","D. aluminium"],"answer":"A","explain":"cardboard là bìa các tông, rẻ và có thể tái chế."},{"type":"mcq","level":"TH","q":"They suggested _____ a break after two hours of work.","options":["A. to take","B. taking","C. take","D. took"],"answer":"B","explain":"Sau suggest dùng V-ing."},{"type":"mcq","level":"TH","q":"Minh: How do I connect to the wifi? - Lan: _____","options":["A. I will show you step by step.","B. Wifi is fast.","C. I like wifi.","D. Connect it."],"answer":"A","explain":"Đáp lại lời nhờ hướng dẫn bằng cách nhận lời chỉ từng bước."},{"type":"mcq","level":"VD","q":"Her parents advised that she _____ a durable laptop for college.","options":["A. should buy","B. to buy","C. buying","D. buys"],"answer":"A","explain":"Cấu trúc advise cộng that cộng S cộng should cộng động từ nguyên thể."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Video calls let people see each other while talking. Students use video calls to join online classes. Video calls need a camera and the internet. They are useless for long-distance communication.","statements":["a) Video calls show both sound and image.","b) Students join online classes by video calls.","c) Video calls need the internet.","d) Video calls are useless for long distance."],"answer":["T","T","T","F"],"explain":"Câu d sai vì gọi video rất hữu ích cho liên lạc đường dài."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Too much screen time can harm your eyes and sleep. Experts suggest taking a short break every 30 minutes. They also advise keeping phones away at bedtime. Using devices wisely helps you stay healthy.","statements":["a) Too much screen time is bad for eyes and sleep.","b) Experts suggest breaks every 30 minutes.","c) Experts advise using phones in bed.","d) Wise use of devices is good for health."],"answer":["T","T","F","T"],"explain":"Câu c sai vì chuyên gia khuyên để điện thoại tránh xa khi đi ngủ."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The instructions are (ease) _____ to follow.","answer":"easy","explain":"Sau are cần tính từ, dạng tính từ của ease là easy."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: The opposite of wired is _____.","answer":"wireless","explain":"wired nghĩa là có dây, trái nghĩa là wireless, không dây."}]}]}</script>
