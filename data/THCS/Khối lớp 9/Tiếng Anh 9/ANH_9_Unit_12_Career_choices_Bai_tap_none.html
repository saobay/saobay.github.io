 from the others.","options":["A. career","B. mechanic","C. cashier","D. surgeon"],"answer":"D","explain":"surgeon có trọng âm ở âm tiết 1, các từ còn lại trọng âm ở âm tiết 2."},{"type":"mcq","level":"NB","q":"A _____ receives and pays out money in a shop.","options":["A. cashier","B. tailor","C. surgeon","D. bartender"],"answer":"A","explain":"cashier nghĩa là thu ngân."},{"type":"mcq","level":"TH","q":"_____ she was late, she could not join the meeting.","options":["A. Although","B. Since","C. Despite","D. Because of"],"answer":"B","explain":"since cộng mệnh đề, đứng đầu câu chỉ nguyên nhân, nghĩa là vì."},{"type":"mcq","level":"TH","q":"After leaving school, he took a _____ course to become an electrician.","options":["A. training","B. career","C. passion","D. vacancy"],"answer":"A","explain":"training course nghĩa là khóa đào tạo nghề."},{"type":"mcq","level":"VD","q":"Despite of the rain, they went out. Which part is wrong?","options":["A. Despite of","B. the rain","C. they","D. went out"],"answer":"A","explain":"despite không đi với of, phải sửa thành despite the rain hoặc in spite of the rain."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Assembly workers put parts together in factories. They often do the same tasks every day. The work can be repetitive but it needs care. Many factories train new workers before they start.","statements":["a) Assembly workers work in factories.","b) Their tasks change every hour.","c) The work needs care.","d) New workers get training."],"answer":["T","F","T","T"],"explain":"Câu b sai vì công nhân lắp ráp thường làm cùng một việc mỗi ngày."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Some students choose a gap year before university. They may travel or do volunteer work during the year. A gap year helps them understand themselves better. However, they must plan carefully to use the time well.","statements":["a) A gap year comes before university.","b) Students may travel during a gap year.","c) A gap year is always a waste of time.","d) Planning is important for a gap year."],"answer":["T","T","F","T"],"explain":"Câu c sai vì năm gap year giúp hiểu bản thân hơn nếu lên kế hoạch cẩn thận."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The (employ) _____ asked many difficult questions.","answer":"employer","explain":"Cần danh từ chỉ người phỏng vấn, dạng đúng là employer, nghĩa là nhà tuyển dụng."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: _____ he had little experience, he got the job.","answer":"Although","explain":"although cộng mệnh đề, nghĩa là mặc dù."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'e' is pronounced differently from the others.","options":["A. repetitive","B. well-paid","C. engineer","D. mechanic"],"answer":"D","explain":"Chữ e trong mechanic đọc là ə, còn repetitive, well-paid, engineer đọc là e."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. artist","B. teacher","C. worker","D. unique"],"answer":"D","explain":"unique có trọng âm ở âm tiết 2, các từ còn lại trọng âm ở âm tiết 1."},{"type":"mcq","level":"NB","q":"A software _____ designs computer programs.","options":["A. engineer","B. tailor","C. cashier","D. bartender"],"answer":"A","explain":"software engineer nghĩa là kỹ sư phần mềm."},{"type":"mcq","level":"TH","q":"James wants to become a tour guide _____ he loves travelling.","options":["A. because","B. although","C. despite","D. so"],"answer":"A","explain":"because cộng mệnh đề, chỉ nguyên nhân."},{"type":"mcq","level":"TH","q":"Mai: I have decided to become a teacher. - Nam: _____","options":["A. That is wonderful! You love children.","B. Teachers teach.","C. I do not like school.","D. Teaching is hard."],"answer":"A","explain":"Đáp lại quyết định nghề nghiệp của bạn bằng sự ủng hộ và khen ngợi."},{"type":"mcq","level":"VD","q":"He was _____ tired that he fell asleep at once.","options":["A. so","B. such","C. very","D. too"],"answer":"A","explain":"Cấu trúc so cộng tính từ cộng that."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Garment workers make clothes in factories. They cut fabric and sew pieces together. The job needs skillful hands and patience. Many garment workers work long hours.","statements":["a) Garment workers make clothes.","b) They cut and sew fabric.","c) The job needs no skills.","d) They often work long hours."],"answer":["T","T","F","T"],"explain":"Câu c sai vì công việc cần đôi tay khéo léo và sự kiên nhẫn."},{"type":"truefalse","level":"VD","q":"Read the passage and decide whether the statements are True (T) or False (F). Freelancers work for themselves, not for a company. They can choose when and where to work. Many freelancers work from home using the internet. However, their income is not always stable.","statements":["a) Freelancers work for a company.","b) Freelancers choose their working time.","c) Many freelancers work online from home.","d) Freelancers always earn stable money."],"answer":["F","T","T","F"],"explain":"Câu a sai vì freelancer làm việc cho chính mình. Câu d sai vì thu nhập của họ không phải lúc nào cũng ổn định."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The job interview went (smooth) _____.","answer":"smoothly","explain":"Cần trạng từ bổ nghĩa cho động từ went, dạng đúng là smoothly."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: A doctor who performs operations is a _____.","answer":"surgeon","explain":"surgeon nghĩa là bác sĩ phẫu thuật."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'i' is pronounced differently from the others.","options":["A. interview","B. me has become popular. People save time on travel and can wear comfortable clothes. However, they may feel lonely without colleagues. Good time management is very important for home workers.","statements":["a) Home workers save travel time.","b) Home workers must wear uniforms.","c) They may feel lonely.","d) Time management matters for them."],"answer":["T","F","T","T"],"explain":"Câu b sai vì làm việc ở nhà có thể mặc đồ thoải mái."},{"type":"short","level":"VDC","q":"Give the correct form of the word in brackets: The company offers good (train) _____ programmes.","answer":"training","explain":"Cần danh từ trước programmes, dạng danh từ của train là training."},{"type":"short","level":"VDC","q":"Fill in the blank with ONE word: A _____ is a formal meeting for a job.","answer":"interview","explain":"interview nghĩa là buổi phỏng vấn xin việc."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose underlined 'o' is pronounced differently from the others.","options":["A. overtime","B. vocational","C. go","D. follow"],"answer":"D","explain":"Chữ o trong follow đọc là ɒ, còn overtime, vocational, go đọc là əʊ."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. mechanic","B. career","C. perform","D. follow"],"answer":"D","explain":"follow có trọng âm ở âm tiết 1, các từ còn lại trọng âm ở âm tiết 2."},{"type":"mcq","level":"NB","q":"A surgeon must have _____ hands to perform operations.","options":["A. skilful","B. repetitive","C. demanding","D. well-paid"],"answer":"A","explain":"skilful nghĩa là khéo léo, cần thiết cho bác sĩ phẫu thuật."},{"type":"mcq","level":"TH","q":"The match was cancelled _____ the storm.","options":["A. because","B. because of","C. although","D. despite"],"answer":"B","explain":"because of cộng danh từ the storm, chỉ nguyên nhân."},{"type":"mcq","level":"TH","q":"Son: Mum, I want to be a chef. - Mum: _____","options":["A. Follow your passion, ons":["A. artist","B. garment","C. hard","D. passion"],"answer":"D","explain":"Chữ a trong passion đọc là æ, còn artist, garment, hard đọc là ɑː."},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. demanding","B. receive","C. perform","D. passion"],"answer":"D","explain":"passion có trọng âm ở âm tiết 1, các từ còn lại trọng âm ở âm tiết 2."},{"type":"mcq","level":"NB","q":"A _____ college trains students for practical jobs.","options":["A. vocational","B. academic","C. medical","D. musical"],"answer":"A","explain":"vocational college nghĩa là trường cao đẳng nghề."},{"type":"mcq","level":"TH","q":"_____ he is young, he runs a successful company.","options":["A. Although","B. Despite","C. Because","D. Because of"],"answer":"A","explain":"although cộng mệnh đề he is young, chỉ sự nhượng bộ."},{"type":"mcq","level":"TH","q":"Her job as a doctor is _____, but she loves helping patients.","options":["A. demanding","B. repetitive","C. boring","D. simple"],"answer":"A","explain":"demanding nghĩa là đòi hỏi khắt khe, vất vả."},{"type":"mcq","level":"VD","q":"Although the bad weather, the game continued. Which part is wrong?","options":["A. Although","B. the bad weather","C. the game","D. continued"],"answer":"A","explain":"although phải đi với mệnh đề, ở đây phải dùng despite the bad weather."},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Engineers design and build machines, bridges and buildings. They use maths and science every day. Engineering jobs are often well-paid. Many engineers work in teams.","statements":["a) Engineers design machines and buildings.","b) Engineers never use maths.","c) Engineering jobs are often well-paid.","d) Engineers always work alone."],"answer":["T","F","T","F"],"explain":"Câu b sai vì kỹ sư dùng toán mỗi ngày. Câu d sai vì nhiều kỹ sư làm việc theo nhóm."},{"type":"truefalse","level":"VD","q":"Read
