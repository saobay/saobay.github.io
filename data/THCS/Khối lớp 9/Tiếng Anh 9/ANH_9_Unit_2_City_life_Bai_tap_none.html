<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ow' is pronounced differently from the others.", "options": ["A. town", "B. now", "C. show", "D. brown"], "answer": "C", "explain": "show đọc là /ʃəʊ/ với âm /əʊ/, còn town, now, brown đọc với âm /aʊ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. bustling", "B. skyscraper", "C. metro", "D. congested"], "answer": "D", "explain": "congested nhấn âm 2, còn bustling, skyscraper, metro nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "The city centre is always _____ with people and traffic.", "options": ["A. bustling", "B. quiet", "C. empty", "D. silent"], "answer": "A", "explain": "bustling (nhộn nhịp, sầm uất) phù hợp với trung tâm thành phố đông người."}, {"type": "mcq", "level": "TH", "q": "_____ the city is, _____ stressful life becomes.", "options": ["A. The busier / the more", "B. Busier / more", "C. The busy / the stressful", "D. More busy / more stress"], "answer": "A", "explain": "So sánh kép: The + so sánh hơn..., the + so sánh hơn... (càng... càng...)."}, {"type": "mcq", "level": "VD", "q": "The government decided to _____ the old market and build a new one.", "options": ["A. pull down", "B. put up", "C. take off", "D. get over"], "answer": "A", "explain": "pull down (phá dỡ) phù hợp với việc dỡ chợ cũ để xây chợ mới."}, {"type": "mcq", "level": "VDC", "q": "No sooner had we arrived _____ the traffic jam began.", "options": ["A. than", "B. when", "C. then", "D. that"], "answer": "A", "explain": "Cấu trúc đảo ngữ: No sooner had... than... (Vừa mới... thì...)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Ha Noi is the capital of Viet Nam. It has a history of over a thousand years. The Old Quarter is famous for its narrow streets. Many tourists visit Ha Noi every year.", "statements": ["a) Ha Noi is the capital of Viet Nam.", "b) It is over a thousand years old.", "c) The Old Quarter has wide streets.", "d) Few tourists visit Ha Noi."], "answer": ["T", "T", "F", "F"], "explain": "a) T (Hà Nội là thủ đô). b) T (hơn nghìn năm lịch sử). c) F (phố cổ nổi tiếng với phố hẹp). d) F (nhiều du khách đến thăm mỗi năm)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Although city life is exciting, it can be stressful. The noise and crowds tire people out. However, cities offer better education and healthcare. Each person must decide what suits them best.", "statements": ["a) City life is always relaxing.", "b) Noise and crowds can tire people.", "c) Cities offer better education.", "d) Everyone should live in cities."], "answer": ["F", "T", "T", "F"], "explain": "a) F (sống ở thành phố có thể căng thẳng). b) T (tiếng ồn và đám đông làm người ta mệt). c) T (giáo dục tốt hơn). d) F (mỗi người tự chọn nơi phù hợp)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: She gets _____ the metro at 7 a.m. every day.", "answer": "on", "explain": "get on (lên tàu, xe buýt): chỗ trống cần on."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The streets were (crowd) _____ at rush hour.", "answer": "crowded", "explain": "Sau động từ tobe cần tính từ: crowd thành crowded (đông đúc)."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. time", "B. sky", "C. give", "D. nice"], "answer": "C", "explain": "give đọc là /ɡɪv/ với âm /ɪ/, còn time, sky, nice đọc với âm /aɪ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. pricey", "B. lively", "C. crowded", "D. alive"], "answer": "D", "explain": "alive nhấn âm 2, còn pricey, lively, crowded nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "A _____ is a very tall building in a big city.", "options": ["A. skyscraper", "B. cottage", "C. hut", "D. tent"], "answer": "A", "explain": "skyscraper (tòa nhà chọc trời) là tòa nhà rất cao ở thành phố lớn."}, {"type": "mcq", "level": "TH", "q": "The more you practise, _____ you speak English.", "options": ["A. the better", "B. better", "C. the best", "D. best"], "answer": "A", "explain": "So sánh kép: The + so sánh hơn... Vế sau cần the better (càng giỏi hơn)."}, {"type": "mcq", "level": "VD", "q": "She _____ the noise of the city after a month.", "options": ["A. got used to", "B. got over", "C. took off", "D. ran into"], "answer": "A", "explain": "get used to (quen dần với) phù hợp với việc quen tiếng ồn sau một tháng."}, {"type": "mcq", "level": "VDC", "q": "The city, _____ population is over ten million, never sleeps.", "options": ["A. whose", "B. which", "C. that", "D. whom"], "answer": "A", "explain": "whose + danh từ (population) chỉ sự sở hữu: thành phố mà dân số của nó hơn mười triệu."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). The metro is a popular means of transport in big cities. It is fast and cheap. It helps reduce traffic jams. Many people use it every day.", "statements": ["a) The metro is popular in big cities.", "b) It is slow and expensive.", "c) It helps reduce traffic jams.", "d) Few people use it."], "answer": ["T", "F", "T", "F"], "explain": "a) T (tàu điện ngầm phổ biến). b) F (nhanh và rẻ). c) T (giúp giảm kẹt xe). d) F (nhiều người dùng mỗi ngày)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The more a city develops, the more problems it may face. Traffic jams waste people's time. Pollution harms people's health. Good planning can reduce these problems.", "statements": ["a) Development brings no problems.", "b) Traffic jams waste time.", "c) Pollution harms health.", "d) Planning cannot help."], "answer": ["F", "T", "T", "F"], "explain": "a) F (phát triển có thể kéo theo vấn đề). b) T (kẹt xe lãng phí thời gian). c) T (ô nhiễm hại sức khỏe). d) F (quy hoạch tốt giảm được vấn đề)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The traffic jam lasted _____ two hours.", "answer": "for", "explain": "for + khoảng thời gian (two hours)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The bus system is very (rely) _____.", "answer": "reliable", "explain": "Sau trạng từ very cần tính từ: rely thành reliable (đáng tin cậy)."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'o' is pronounced differently from the others.", "options": ["A. go", "B. home", "C. hot", "D. most"], "answer": "C", "explain": "hot đọc là /hɒt/, còn go, home, most đọc với âm /əʊ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. reliable", "B. convenient", "C. attract", "D. modern"], "answer": "D", "explain": "modern nhấn âm 1, còn reliable, convenient, attract nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "We were stuck in a _____ for an hour this morning.", "options": ["A. traffic jam", "B. picnic", "C. parade", "D. concert"], "answer": "A", "explain": "stuck in a traffic jam (kẹt trong đám tắc đường) suốt một giờ."}, {"type": "mcq", "level": "TH", "q": "The higher the price, _____ people buy the product.", "options": ["A. the fewer", "B. fewer", "C. few", "D. the fewest"], "answer": "A", "explain": "So sánh kép: The higher..., the fewer... (giá càng cao, càng ít người mua)."}, {"type": "mcq", "level": "VD", "q": "Which sentence is correct?", "options": ["A. The more busier the city, the more crowded it is.", "B. The busier the city is, the more crowded it is.", "C. More busier the city is, more crowded it is.", "D. The busier the city, the crowdedder it is."], "answer": "B", "explain": "So sánh kép đúng: The + so sánh hơn + S + V, the + so sánh hơn + S + V. Không dùng more busier, không có crowdedder."}, {"type": "mcq", "level": "VDC", "q": "By 2030, the city _____ a new metro line.", "options": ["A. will have built", "B. will build", "C. builds", "D. is building"], "answer": "A", "explain": "By 2030 (mốc tương lai) dùng tương lai hoàn thành: will have built (sẽ đã xây xong)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Rush hour is the busiest time of the day. Everyone goes to work or school. The streets are full of cars and motorbikes. It is best to leave home early.", "statements": ["a) Rush hour is the busiest time.", "b) The streets are empty at rush hour.", "c) People go to work or school.", "d) Leaving early is a good idea."], "answer": ["T", "F", "T", "T"], "explain": "a) T (giờ cao điểm nhộn nhịp nhất). b) F (phố đầy xe). c) T (mọi người đi làm, đi học). d) T (nên ra khỏi nhà sớm)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Young people are moving to cities for better opportunities. They hope to find good jobs and modern lifestyles. However, housing prices are very high. Many must share small apartments.", "statements": ["a) Young people move to cities for opportunities.", "b) They all find good jobs easily.", "c) Housing prices are high.", "d) Many share small apartments."], "answer": ["T", "F", "T", "T"], "explain": "a) T (người trẻ lên thành phố tìm cơ hội). b) F (đoạn văn không nói ai cũng dễ tìm việc). c) T (giá nhà rất cao). d) T (nhiều người phải ở chung căn hộ nhỏ)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: He has lived in the city _____ 2015.", "answer": "since", "explain": "since + mốc thời gian (2015) trong thì hiện tại hoàn thành."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The air is heavily (pollute) _____.", "answer": "polluted", "explain": "Sau trạng từ heavily cần tính từ (dạng quá khứ phân từ): pollute thành polluted (bị ô nhiễm)."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ou' is pronounced differently from the others.", "options": ["A. house", "B. about", "C. tourist", "D. cloud"], "answer": "C", "explain": "tourist đọc là /ˈtʊərɪst/, còn house, about, cloud đọc với âm /aʊ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. underground", "B. highway", "C. railway", "D. subway"], "answer": "A", "explain": "underground nhấn âm chính ở âm 3, còn highway, railway, subway nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "The _____ is the fastest way to travel around the city.", "options": ["A. metro", "B. horse", "C. boat", "D. walk"], "answer": "A", "explain": "metro (tàu điện ngầm) là cách đi lại nhanh nhất trong thành phố."}, {"type": "mcq", "level": "TH", "q": "She gets _____ well with her neighbours.", "options": ["A. on", "B. up", "C. over", "D. off"], "answer": "A", "explain": "Cụm động từ get on with (hòa thuận với ai)."}, {"type": "mcq", "level": "VD", "q": "I can't _____ living without my family.", "options": ["A. put up with", "B. get on with", "C. hang out", "D. come down"], "answer": "A", "explain": "put up with (chịu đựng): không thể chịu được việc sống xa gia đình."}, {"type": "mcq", "level": "VDC", "q": "He denied _____ the money.", "options": ["A. taking", "B. to take", "C. take", "D. taken"], "answer": "A", "explain": "Cấu trúc: deny + V-ing (phủ nhận đã làm gì)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Skyscrapers make the city look modern. People work and live in them. From the top, you can see the whole city. However, building them costs a lot of money.", "statements": ["a) Skyscrapers make the city modern.", "b) People work and live in them.", "c) You can see the city from the top.", "d) They are cheap to build."], "answer": ["T", "T", "T", "F"], "explain": "a) T (nhà chọc trời làm thành phố hiện đại). b) T (người ta làm việc và sống trong đó). c) T (từ trên cao nhìn thấy cả thành phố). d) F (xây dựng tốn rất nhiều tiền)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). To reduce traffic jams, the city built more metro lines. It also encouraged people to cycle. As a result, fewer people drive cars to work. The air is cleaner than before.", "statements": ["a) The city built more metro lines.", "b) It encouraged cycling.", "c) More people drive to work now.", "d) The air is cleaner."], "answer": ["T", "T", "F", "T"], "explain": "a) T (thành phố xây thêm tuyến metro). b) T (khuyến khích đi xe đạp). c) F (ít người lái xe đi làm hơn). d) T (không khí sạch hơn trước)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: They are looking forward _____ the weekend.", "answer": "to", "explain": "Cụm động từ look forward to (mong đợi): chỗ trống cần to."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The new shopping mall is quite (fascinate) _____.", "answer": "fascinating", "explain": "Trước danh từ? Không, sau tobe cần tính từ chỉ tính chất: fascinate thành fascinating (hấp dẫn)."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. like", "B. fine", "C. live", "D. shine"], "answer": "C", "explain": "live (động từ sống) đọc là /lɪv/, còn like, fine, shine đọc với âm /aɪ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. vibrant", "B. lively", "C. crowded", "D. polluted"], "answer": "D", "explain": "polluted nhấn âm 2, còn vibrant, lively, crowded nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "The streets are _____ during rush hour.", "options": ["A. congested", "B. empty", "C. wide", "D. clean"], "answer": "A", "explain": "congested (tắc nghẽn, đông đúc) phù hợp với giờ cao điểm."}, {"type": "mcq", "level": "TH", "q": "They carried _____ a survey about city life.", "options": ["A. out", "B. on", "C. over", "D. away"], "answer": "A", "explain": "Cụm động từ carry out (thực hiện, tiến hành) một cuộc khảo sát."}, {"type": "mcq", "level": "VD", "q": "The meeting was _____ until next week.", "options": ["A. put off", "B. put up", "C. put on", "D. put out"], "answer": "A", "explain": "put off (hoãn lại) phù hợp với việc dời cuộc họp sang tuần sau."}, {"type": "mcq", "level": "VDC", "q": "_____ the heavy traffic, he arrived on time.", "options": ["A. Despite", "B. Although", "C. Because", "D. However"], "answer": "A", "explain": "Despite + cụm danh từ (the heavy traffic): mặc dù kẹt xe nặng."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). City parks are important for residents. Children play there after school. Old people do exercise in the morning. Parks make the city greener and fresher.", "statements": ["a) City parks are important.", "b) Children play there after school.", "c) Old people exercise in the evening.", "d) Parks make the city greener."], "answer": ["T", "T", "F", "T"], "explain": "a) T (công viên quan trọng). b) T (trẻ em chơi sau giờ học). c) F (người già tập buổi sáng). d) T (công viên làm thành phố xanh hơn)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Living costs in big cities keep rising. Food, housing, and transport are all expensive. People must work hard to earn enough money. That is why many feel stressed.", "statements": ["a) Living costs are rising.", "b) Everything is cheap in big cities.", "c) People work hard to earn money.", "d) High costs can cause stress."], "answer": ["T", "F", "T", "T"], "explain": "a) T (chi phí sinh hoạt tăng). b) F (mọi thứ đều đắt). c) T (người ta làm việc vất vả kiếm tiền). d) T (chi phí cao gây căng thẳng)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: The new skyscraper is still _____ construction.", "answer": "under", "explain": "Cụm từ under construction (đang xây dựng)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Life here is (convenience) _____.", "answer": "convenient", "explain": "Sau động từ tobe cần tính từ: convenience thành convenient (thuận tiện)."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ow' is pronounced differently from the others.", "options": ["A. down", "B. brown", "C. low", "D. now"], "answer": "C", "explain": "low đọc là /ləʊ/ với âm /əʊ/, còn down, brown, now đọc với âm /aʊ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. dweller", "B. city", "C. town", "D. village"], "answer": "A", "explain": "dweller nhấn âm 2, còn city, town, village nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Eating out in the city centre is quite _____.", "options": ["A. pricey", "B. cheap", "C. free", "D. boring"], "answer": "A", "explain": "pricey (đắt đỏ) phù hợp với việc ăn uống ở trung tâm thành phố."}, {"type": "mcq", "level": "TH", "q": "The earlier we leave, _____ traffic we meet.", "options": ["A. the less", "B. less", "C. the least", "D. little"], "answer": "A", "explain": "So sánh kép: The earlier..., the less... (đi càng sớm, càng ít gặp kẹt xe)."}, {"type": "mcq", "level": "VD", "q": "He _____ an old friend in the supermarket yesterday.", "options": ["A. ran into", "B. ran out of", "C. ran after", "D. ran over"], "answer": "A", "explain": "run into (tình cờ gặp) phù hợp với việc gặp bạn cũ bất ngờ."}, {"type": "mcq", "level": "VDC", "q": "It is high time we _____ something about pollution.", "options": ["A. did", "B. do", "C. have done", "D. will do"], "answer": "A", "explain": "Cấu trúc: It is high time + S + V2 (đã đến lúc phải làm gì)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Night markets are popular in many Asian cities. They sell food, clothes, and souvenirs. The prices are usually cheap. Both locals and tourists enjoy them.", "statements": ["a) Night markets are popular in Asian cities.", "b) They sell only food.", "c) Prices are usually cheap.", "d) Tourists enjoy them."], "answer": ["T", "F", "T", "T"], "explain": "a) T (chợ đêm phổ biến). b) F (bán cả đồ ăn, quần áo, quà lưu niệm). c) T (giá thường rẻ). d) T (du khách thích chợ đêm)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Green spaces are disappearing as cities grow. Without trees, cities become hotter. People feel less relaxed. Planting more trees can solve this problem.", "statements": ["a) Green spaces are increasing.", "b) Cities become hotter without trees.", "c) People feel less relaxed.", "d) Planting trees helps."], "answer": ["F", "T", "T", "T"], "explain": "a) F (không gian xanh đang biến mất). b) T (thiếu cây, thành phố nóng hơn). c) T (người ta kém thư thái). d) T (trồng thêm cây giải quyết được)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: We hung _____ with friends at the mall yesterday.", "answer": "out", "explain": "Cụm động từ hang out (đi chơi, tụ tập): chỗ trống cần out."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The restaurant is too (price) _____ for us.", "answer": "pricey", "explain": "Sau trạng từ too cần tính từ: price thành pricey (đắt đỏ)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'oa' is pronounced differently from the others.", "options": ["A. boat", "B. road", "C. cost", "D. soap"], "answer": "C", "explain": "cost đọc là /kɒst/, còn boat, road, soap đọc với âm /əʊ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. amenity", "B. facility", "C. police", "D. market"], "answer": "D", "explain": "market nhấn âm 1, còn amenity, facility, police nhấn âm 2."}, {"type": "mcq", "level": "TH", "q": "Public transport here is very _____, so I never worry about being late.", "options": ["A. reliable", "B. slow", "C. crowded", "D. noisy"], "answer": "A", "explain": "reliable (đáng tin cậy) nên không lo bị muộn."}, {"type": "mcq", "level": "TH", "q": "He came _____ with the flu after the trip.", "options": ["A. down", "B. up", "C. over", "D. back"], "answer": "A", "explain": "Cụm động từ come down with (mắc bệnh cúm)."}, {"type": "mcq", "level": "VD", "q": "The more people move to the city, _____.", "options": ["A. the higher the housing prices become", "B. higher the housing prices become", "C. the housing prices become higher", "D. housing prices the higher become"], "answer": "A", "explain": "So sánh kép đầy đủ: The + so sánh hơn + S + V. Chỉ có A đúng cấu trúc."}, {"type": "mcq", "level": "VDC", "q": "She would rather _____ at home than go out in the rain.", "options": ["A. stay", "B. to stay", "C. staying", "D. stayed"], "answer": "A", "explain": "Cấu trúc: would rather + V (thích... hơn)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Public transport helps protect the environment. Buses and metros carry many people at once. This means fewer cars on the road. The air becomes cleaner.", "statements": ["a) Public transport protects the environment.", "b) Buses carry many people at once.", "c) It increases cars on the road.", "d) The air becomes cleaner."], "answer": ["T", "T", "F", "T"], "explain": "a) T (giao thông công cộng bảo vệ môi trường). b) T (chở nhiều người cùng lúc). c) F (ít xe hơi hơn trên đường). d) T (không khí sạch hơn)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The city never sleeps at night. Shops and restaurants stay open late. Young people enjoy the nightlife. However, the noise can disturb residents.", "statements": ["a) The city is quiet at night.", "b) Shops stay open late.", "c) Young people enjoy nightlife.", "d) Noise never disturbs anyone."], "answer": ["F", "T", "T", "F"], "explain": "a) F (thành phố không ngủ về đêm). b) T (cửa hàng mở khuya). c) T (người trẻ thích cuộc sống về đêm). d) F (tiếng ồn có thể làm phiền cư dân)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: Life in the countryside is slower _____ life in the city.", "answer": "than", "explain": "So sánh hơn: slower than (chậm hơn)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The market is always (bustle) _____.", "answer": "bustling", "explain": "Sau động từ tobe cần tính từ: bustle thành bustling (nhộn nhịp)."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'i' is pronounced differently from the others.", "options": ["A. bright", "B. night", "C. city", "D. flight"], "answer": "C", "explain": "city đọc là /ˈsɪti/ với âm /ɪ/, còn bright, night, flight đọc với âm /aɪ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. concrete", "B. jungle", "C. exhaust", "D. fume"], "answer": "C", "explain": "exhaust (động từ) nhấn âm 2, còn concrete, jungle, fume nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Living near the station is very _____ for commuters.", "options": ["A. convenient", "B. difficult", "C. far", "D. inconvenient"], "answer": "A", "explain": "convenient (thuận tiện) cho người đi làm xa."}, {"type": "mcq", "level": "TH", "q": "The more expensive the restaurant is, _____ the service is.", "options": ["A. the better", "B. better", "C. best", "D. the best"], "answer": "A", "explain": "So sánh kép: The more expensive..., the better... (càng đắt, phục vụ càng tốt)."}, {"type": "mcq", "level": "VD", "q": "She is trying to _____ smoking.", "options": ["A. give up", "B. give in", "C. give out", "D. give off"], "answer": "A", "explain": "give up (từ bỏ) việc hút thuốc."}, {"type": "mcq", "level": "VDC", "q": "The more I learn about this city, _____.", "options": ["A. the more I love it", "B. more I love it", "C. I love it more", "D. the most I love it"], "answer": "A", "explain": "So sánh kép: The more..., the more... Cả hai vế đều cần The."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Living in the city has many advantages. There are good schools and hospitals. You can find many kinds of jobs. Entertainment is easy to find too.", "statements": ["a) City life has advantages.", "b) There are good schools and hospitals.", "c) Jobs are hard to find.", "d) Entertainment is easy to find."], "answer": ["T", "T", "F", "T"], "explain": "a) T (sống ở thành phố có nhiều lợi thế). b) T (trường học, bệnh viện tốt). c) F (dễ tìm nhiều loại việc làm). d) T (dễ tìm chỗ giải trí)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). If more people used public transport, traffic would improve. The government is building new bus routes. Tickets are cheaper than before. Hopefully, fewer people will drive cars.", "statements": ["a) Public transport can improve traffic.", "b) New bus routes are being built.", "c) Tickets are more expensive.", "d) The writer hopes fewer people drive."], "answer": ["T", "T", "F", "T"], "explain": "a) T (giao thông công cộng cải thiện giao thông). b) T (đang xây tuyến buýt mới). c) F (vé rẻ hơn trước). d) T (mong ít người lái xe hơn)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: She goes to work _____ bus every morning.", "answer": "by", "explain": "by + phương tiện (bus): đi bằng xe buýt."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The show was (excite) _____.", "answer": "exciting", "explain": "Sau động từ tobe cần tính từ chỉ tính chất: excite thành exciting (thú vị)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ou' is pronounced differently from the others.", "options": ["A. crowd", "B. proud", "C. group", "D. loud"], "answer": "C", "explain": "group đọc là /ɡruːp/, còn crowd, proud, loud đọc với âm /aʊ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. gallery", "B. museum", "C. theatre", "D. market"], "answer": "B", "explain": "museum nhấn âm 2, còn gallery, theatre, market nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "Many people move to the city in _____ of better jobs.", "options": ["A. search", "B. need", "C. lack", "D. front"], "answer": "A", "explain": "Cụm từ in search of (để tìm kiếm) công việc tốt hơn."}, {"type": "mcq", "level": "TH", "q": "We often hang _____ with friends at the weekend.", "options": ["A. out", "B. up", "C. over", "D. on"], "answer": "A", "explain": "Cụm động từ hang out (đi chơi, tụ tập) với bạn bè."}, {"type": "mcq", "level": "VD", "q": "The company decided to _____ more workers.", "options": ["A. take on", "B. take off", "C. take over", "D. take up"], "answer": "A", "explain": "take on (tuyển dụng) thêm công nhân."}, {"type": "mcq", "level": "VDC", "q": "Had I known about the traffic jam, I _____ the metro.", "options": ["A. would have taken", "B. will take", "C. take", "D. would take"], "answer": "A", "explain": "Câu điều kiện loại 3 đảo ngữ: Had + S + V3, S + would have + V3."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Street food is a special part of city life. You can find noodles, bread, and snacks everywhere. The food is tasty and cheap. Many visitors love trying it.", "statements": ["a) Street food is part of city life.", "b) It is tasty and cheap.", "c) Visitors dislike it.", "d) You can find it everywhere."], "answer": ["T", "T", "F", "T"], "explain": "a) T (ẩm thực đường phố là nét đặc trưng). b) T (ngon và rẻ). c) F (nhiều du khách thích thử). d) T (tìm thấy ở khắp nơi)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some people prefer the countryside to the city. The air is fresher and life is slower. However, there are fewer schools and hospitals. Each place has its own advantages.", "statements": ["a) Some prefer the countryside.", "b) Country air is fresher.", "c) The countryside has more hospitals.", "d) Each place has advantages."], "answer": ["T", "T", "F", "T"], "explain": "a) T (một số người thích nông thôn hơn). b) T (không khí trong lành hơn). c) F (ít trường học và bệnh viện hơn). d) T (mỗi nơi có lợi thế riêng)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: He is tired _____ the noise.", "answer": "of", "explain": "Cấu trúc: be tired of (mệt mỏi vì, chán)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The seats are (comfort) _____.", "answer": "comfortable", "explain": "Sau động từ tobe cần tính từ: comfort thành comfortable (thoải mái)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ow' is pronounced differently from the others.", "options": ["A. yellow", "B. window", "C. know", "D. cow"], "answer": "D", "explain": "cow đọc là /kaʊ/ với âm /aʊ/, còn yellow, window, know đọc với âm /əʊ/."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. hurry", "B. worry", "C. carry", "D. delay"], "answer": "D", "explain": "delay nhấn âm 2, còn hurry, worry, carry nhấn âm 1."}, {"type": "mcq", "level": "TH", "q": "The city has many _____, such as parks, schools, and hospitals.", "options": ["A. amenities", "B. problems", "C. dangers", "D. deserts"], "answer": "A", "explain": "amenities (tiện ích) như công viên, trường học, bệnh viện."}, {"type": "mcq", "level": "TH", "q": "The faster you drive, _____ dangerous it is.", "options": ["A. the more", "B. more", "C. most", "D. the most"], "answer": "A", "explain": "So sánh kép: The faster..., the more dangerous... (càng nhanh càng nguy hiểm)."}, {"type": "mcq", "level": "VD", "q": "_____ the apartment is, the less I want to live there.", "options": ["A. The noisier", "B. Noisier", "C. The noisy", "D. More noisy"], "answer": "A", "explain": "So sánh kép: The noisier..., the less... Vế đầu cần The + so sánh hơn."}, {"type": "mcq", "level": "VDC", "q": "Not only is the city crowded, _____ it is also polluted.", "options": ["A. but", "B. and", "C. so", "D. or"], "answer": "A", "explain": "Cấu trúc: Not only... but also... (Không những... mà còn...)."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). High-rise buildings save land in crowded cities. Many families live in apartments. They share parks and playgrounds. Life in apartments can be convenient.", "statements": ["a) High-rise buildings save land.", "b) Many families live in apartments.", "c) They have private parks.", "d) Apartment life can be convenient."], "answer": ["T", "T", "F", "T"], "explain": "a) T (nhà cao tầng tiết kiệm đất). b) T (nhiều gia đình sống ở chung cư). c) F (dùng chung công viên, sân chơi). d) T (sống chung cư có thể thuận tiện)."}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Technology is changing city life quickly. People can work from home and shop online. They spend less time travelling. However, they may feel lonelier than before.", "statements": ["a) Technology changes city life.", "b) People can work from home.", "c) They travel more than before.", "d) They may feel lonelier."], "answer": ["T", "T", "F", "T"], "explain": "a) T (công nghệ thay đổi cuộc sống thành thị). b) T (làm việc tại nhà). c) F (ít tốn thời gian đi lại hơn). d) T (có thể cảm thấy cô đơn hơn)."}, {"type": "short", "level": "NB", "q": "Fill in the blank with ONE word: They moved to the city _____ search of better jobs.", "answer": "in", "explain": "Cụm từ in search of (để tìm kiếm)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She felt (loneliness) _____ in the big city.", "answer": "lonely", "explain": "Sau động từ feel cần tính từ: loneliness thành lonely (cô đơn)."}]}]}</script>
