<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. relation", "B. decision", "C. quality", "D. position"], "answer": "C", "explain": "quality /ˈkwɒləti/ nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 (trước -ion/-ity)."}, {"type": "mcq", "level": "NB", "q": "Choose the word with a different stress pattern from the others.", "options": ["A. education", "B. clarity", "C. quality", "D. charity"], "answer": "A", "explain": "education /ˌedʒuˈkeɪʃn/ nhấn âm tiết thứ 3 (trước -ion), các từ còn lại nhấn âm tiết đầu (trước -ity)."}, {"type": "mcq", "level": "NB", "q": "English is an _____ language in Singapore.", "options": ["A. official", "B. fluent", "C. bilingual", "D. foreign"], "answer": "A", "explain": "official language (ngôn ngữ chính thức): tiếng Anh là ngôn ngữ chính thức ở Singapore."}, {"type": "mcq", "level": "TH", "q": "A bilingual is a person _____ can speak two languages.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "A", "explain": "Mệnh đề quan hệ xác định chỉ người làm chủ ngữ: who."}, {"type": "mcq", "level": "VD", "q": "The word _____ I looked up means 'bản sắc'.", "options": ["A. which", "B. whose", "C. whom", "D. who"], "answer": "A", "explain": "Chỉ vật (the word) làm tân ngữ trong mệnh đề xác định: which."}, {"type": "mcq", "level": "TH", "q": "'How can I improve my English pronunciation?' '_____'.", "options": ["A. You should listen and imitate native speakers.", "B. It is difficult.", "C. You are welcome.", "D. I do not know."], "answer": "A", "explain": "Gợi ý cách học cụ thể: nghe và bắt chước người bản ngữ."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). English is spoken in many countries around the world. It is the official language in countries like Singapore and the Philippines. In India, English is widely used in business and education. About 1.5 billion people speak English today.", "statements": ["a) English is spoken in many countries.", "b) English is an official language in Singapore.", "c) English is never used in India.", "d) About 1.5 billion people speak English."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: spoken in many countries. b) T — bài đọc: official language in Singapore. c) F — được dùng rộng rãi ở Ấn Độ. d) T — bài đọc: about 1.5 billion people."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). World Englishes means the different kinds of English spoken globally. Each variety follows its own rules and has its own beauty. No variety is better than another. Respecting all varieties helps people communicate better.", "statements": ["a) World Englishes refers to different kinds of English.", "b) Each variety has its own rules.", "c) British English is the only correct variety.", "d) Respecting varieties improves communication."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: different kinds of English spoken globally. b) T — bài đọc: follows its own rules. c) F — không có biến thể nào hơn biến thể nào. d) T — bài đọc: helps people communicate better."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE relative pronoun: A bilingual is a person _____ speaks two languages.", "answer": "who", "explain": "Chỉ người làm chủ ngữ trong mệnh đề quan hệ xác định: who."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She speaks English (fluent) _____.", "answer": "fluently", "explain": "Sau động từ speaks cần trạng từ: fluently (một cách trôi chảy)."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Pick the word whose main stress is on a different syllable.", "options": ["A. ability", "B. charity", "C. quality", "D. clarity"], "answer": "A", "explain": "ability /əˈbɪləti/ nhấn âm tiết thứ 2 (trước -ity), các từ còn lại nhấn âm tiết đầu."}, {"type": "mcq", "level": "NB", "q": "Choose the word that does not share the same stress pattern as the others.", "options": ["A. discussion", "B. quality", "C. charity", "D. clarity"], "answer": "A", "explain": "discussion /dɪˈskʌʃn/ nhấn âm tiết thứ 2 (trước -ion), các từ còn lại nhấn âm tiết đầu (trước -ity)."}, {"type": "mcq", "level": "NB", "q": "She speaks English _____.", "options": ["A. fluent", "B. bilingual", "C. official", "D. fluently"], "answer": "D", "explain": "Sau động từ speaks cần trạng từ: fluently (trôi chảy)."}, {"type": "mcq", "level": "TH", "q": "English is the language _____ connects people around the world.", "options": ["A. whose", "B. whom", "C. who", "D. which"], "answer": "D", "explain": "Mệnh đề quan hệ xác định chỉ vật làm chủ ngữ: which."}, {"type": "mcq", "level": "VD", "q": "The woman to _____ I spoke is an English teacher.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "D", "explain": "Sau giới từ to, chỉ người làm tân ngữ: whom."}, {"type": "mcq", "level": "TH", "q": "'What does bilingual mean?' '_____'.", "options": ["A. It means 'song ngữ'.", "B. It means nothing.", "C. It is a word.", "D. I do not like it."], "answer": "A", "explain": "Giải thích nghĩa của từ: bilingual nghĩa là song ngữ."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). There are different varieties of English in the world. British English and American English have different words for some things. For example, 'lorry' in British English is 'truck' in American English. Accents also differ from country to country.", "statements": ["a) There are different varieties of English.", "b) British and American English are exactly the same.", "c) 'Lorry' and 'truck' mean the same vehicle.", "d) Accents differ between countries."], "answer": ["T", "F", "T", "T"], "explain": "a) T — bài đọc: different varieties of English. b) F — có từ vựng khác nhau. c) T — bài đọc: 'lorry' is 'truck'. d) T — bài đọc: accents also differ."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Singlish is the English spoken in Singapore. It mixes English with Malay, Mandarin and Tamil words. At first, visitors may not understand Singlish well. However, it shows the rich culture of Singapore.", "statements": ["a) Singlish is spoken in Singapore.", "b) It mixes English with other languages.", "c) All visitors understand Singlish easily.", "d) Singlish reflects Singapore's culture."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: the English spoken in Singapore. b) T — bài đọc: mixes English with Malay, Mandarin and Tamil. c) F — lúc đầu khách có thể không hiểu. d) T — bài đọc: shows the rich culture of Singapore."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE relative pronoun: English is the language _____ connects people worldwide.", "answer": "which", "explain": "Chỉ vật làm chủ ngữ trong mệnh đề quan hệ xác định: which (that cũng đúng)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: English is an (office) _____ language in many countries.", "answer": "official", "explain": "Cần tính từ bổ nghĩa cho danh từ language: official (chính thức)."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Which word has a different main stress from the others? Choose the odd one out.", "options": ["A. attention", "B. ability", "C. obesity", "D. quality"], "answer": "D", "explain": "quality nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 (trước -ion/-ity)."}, {"type": "mcq", "level": "NB", "q": "Choose the word stressed on a different syllable from the others.", "options": ["A. identity", "B. community", "C. possibility", "D. charity"], "answer": "D", "explain": "charity nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 3 (trước -ity)."}, {"type": "mcq", "level": "NB", "q": "My friend is _____: he can speak Vietnamese and English well.", "options": ["A. bilingual", "B. official", "C. fluent", "D. foreign"], "answer": "A", "explain": "bilingual (song ngữ): nói tốt cả tiếng Việt và tiếng Anh."}, {"type": "mcq", "level": "TH", "q": "The teacher _____ teaches us English is very kind.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "A", "explain": "Mệnh đề quan hệ xác định chỉ người làm chủ ngữ: who."}, {"type": "mcq", "level": "VD", "q": "This is the book _____ I told you about.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "B", "explain": "Chỉ vật (the book) làm tân ngữ, có giới từ about ở cuối: which."}, {"type": "mcq", "level": "TH", "q": "'Shall we practise speaking English together?' '_____'.", "options": ["A. No, we shall.", "B. Yes, let's.", "C. I am practising.", "D. Yes, we do."], "answer": "B", "explain": "Đồng ý với đề xuất cùng luyện nói: Yes, let's."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). A bilingual person can speak two languages well. Many children in Singapore grow up bilingual. They speak English at school and Mandarin or Malay at home. Being bilingual gives people more job chances.", "statements": ["a) A bilingual person speaks two languages.", "b) Children in Singapore never learn two languages.", "c) They may speak English at school.", "d) Being bilingual helps people find jobs."], "answer": ["T", "F", "T", "T"], "explain": "a) T — bài đọc: can speak two languages well. b) F — nhiều trẻ em Singapore lớn lên song ngữ. c) T — bài đọc: speak English at school. d) T — bài đọc: more job chances."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many people think they must speak like native speakers. In fact, clear communication is more important than a perfect accent. A Vietnamese accent is fine if people understand you. Confidence matters more than imitation.", "statements": ["a) Everyone must copy native accents exactly.", "b) Clear communication matters most.", "c) A Vietnamese accent is acceptable.", "d) Confidence is important in speaking."], "answer": ["F", "T", "T", "T"], "explain": "a) F — không bắt buộc nói giống người bản ngữ. b) T — bài đọc: clear communication is more important. c) T — bài đọc: a Vietnamese accent is fine. d) T — bài đọc: confidence matters more than imitation."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE relative pronoun: The dictionary _____ I bought is very helpful.", "answer": "which", "explain": "Chỉ vật (the dictionary) làm tân ngữ: which (that cũng đúng, có thể lược bỏ)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The (able) _____ to speak English well takes time.", "answer": "ability", "explain": "Sau mạo từ the cần danh từ: ability (khả năng)."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Find the word with a different stress pattern from the other three.", "options": ["A. revision", "B. intention", "C. function", "D. decision"], "answer": "C", "explain": "function /ˈfʌŋkʃn/ nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 (trước -ion)."}, {"type": "mcq", "level": "NB", "q": "Choose the word whose stress is placed differently from the others.", "options": ["A. activity", "B. ability", "C. quality", "D. obesity"], "answer": "C", "explain": "quality nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 (trước -ity/-ion)."}, {"type": "mcq", "level": "NB", "q": "People in different regions may speak different _____ of English.", "options": ["A. dialects", "B. identities", "C. operations", "D. notebooks"], "answer": "A", "explain": "dialects (phương ngữ): các vùng miền có phương ngữ tiếng Anh khác nhau."}, {"type": "mcq", "level": "TH", "q": "The dictionary _____ I bought yesterday is very useful.", "options": ["A. whom", "B. who", "C. whose", "D. which"], "answer": "D", "explain": "Mệnh đề quan hệ xác định chỉ vật làm tân ngữ: which."}, {"type": "mcq", "level": "VD", "q": "The singer _____ songs we love is coming to Viet Nam.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "C", "explain": "Chỉ sự sở hữu (songs của ca sĩ): whose."}, {"type": "mcq", "level": "TH", "q": "'Do you think English is difficult?' '_____'.", "options": ["A. Yes, I think.", "B. A little, but regular practice helps a lot.", "C. No, I do not think.", "D. Difficult is it."], "answer": "B", "explain": "Nêu quan điểm đầy đủ, tự nhiên về việc học tiếng Anh."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). To speak English fluently, learners need regular practice. Listening to English songs and films helps a lot. Speaking with friends in English is also useful. Learners should not be afraid of making mistakes.", "statements": ["a) Regular practice helps fluency.", "b) Songs and films can help learners.", "c) Learners should never speak with friends.", "d) Making mistakes is part of learning."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: need regular practice. b) T — bài đọc: listening to songs and films helps. c) F — nên nói với bạn bè. d) T — suy ra: should not be afraid of making mistakes."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Children pick up languages faster than adults. They learn by listening and imitating every day. Adults can also learn well with good methods. Age is not the only factor in success.", "statements": ["a) Children learn languages quickly.", "b) They learn by listening and imitating.", "c) Adults cannot learn languages well.", "d) Good methods help adult learners."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: pick up languages faster. b) T — bài đọc: listening and imitating. c) F — người lớn cũng học tốt với phương pháp hay. d) T — bài đọc: with good methods."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE relative pronoun: The woman to _____ I spoke is an English teacher.", "answer": "whom", "explain": "Sau giới từ to, chỉ người làm tân ngữ: whom."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Her (pronounce) _____ is clear and easy to understand.", "answer": "pronunciation", "explain": "Sau tính từ sở hữu her cần danh từ: pronunciation (phát âm)."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Pick the odd one out in terms of main stress.", "options": ["A. operation", "B. education", "C. relation", "D. charity"], "answer": "D", "explain": "charity nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 3 hoặc 2 (trước -ion)."}, {"type": "mcq", "level": "NB", "q": "Which of the following words is stressed differently? Choose one.", "options": ["A. quality", "B. clarity", "C. charity", "D. ability"], "answer": "D", "explain": "ability nhấn âm tiết thứ 2 (trước -ity), các từ còn lại nhấn âm tiết đầu."}, {"type": "mcq", "level": "NB", "q": "The _____ of Indian English is quite different from British English.", "options": ["A. notebook", "B. community", "C. accent", "D. relation"], "answer": "C", "explain": "accent (giọng): giọng tiếng Anh Ấn Độ khác giọng Anh-Anh."}, {"type": "mcq", "level": "TH", "q": "The students _____ study hard will speak English well.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "A", "explain": "Mệnh đề quan hệ xác định chỉ người làm chủ ngữ: who."}, {"type": "mcq", "level": "VD", "q": "The language centre _____ I study English is near my house.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "B", "explain": "Chỉ vật, nơi chốn (the language centre): which."}, {"type": "mcq", "level": "TH", "q": "'Could you speak more slowly, please?' '_____'.", "options": ["A. I am slow.", "B. Yes, I could.", "C. No, I could not.", "D. Sure, no problem."], "answer": "D", "explain": "Đồng ý yêu cầu một cách lịch sự: Sure, no problem."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). When you do not know a word, look it up in a dictionary. Online dictionaries also show pronunciation. After looking up a word, make an example with it. This helps you remember the word longer.", "statements": ["a) Dictionaries help you learn new words.", "b) Online dictionaries show pronunciation.", "c) You should forget the word after looking it up.", "d) Making examples helps memory."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: look it up in a dictionary. b) T — bài đọc: show pronunciation. c) F — nên đặt câu ví dụ để nhớ lâu. d) T — bài đọc: helps you remember the word longer."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). English keeps changing over time. New words appear every year, especially in technology. Old words may disappear or change meaning. A living language never stands still.", "statements": ["a) English changes over time.", "b) New words appear yearly.", "c) Old words never change.", "d) English is a living language."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: keeps changing over time. b) T — bài đọc: new words appear every year. c) F — từ cũ có thể biến mất hoặc đổi nghĩa. d) T — bài đọc: a living language."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE relative pronoun: The students _____ work hard will succeed.", "answer": "who", "explain": "Chỉ người làm chủ ngữ trong mệnh đề quan hệ xác định: who (that cũng đúng)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The (vary) _____ of English accents is interesting.", "answer": "variety", "explain": "Sau mạo từ the cần danh từ: variety (sự đa dạng)."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word with the main stress on a different syllable.", "options": ["A. relation", "B. position", "C. decision", "D. function"], "answer": "D", "explain": "function nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 (trước -ion)."}, {"type": "mcq", "level": "NB", "q": "Identify the word whose stress pattern is different from the others.", "options": ["A. obesity", "B. ability", "C. charity", "D. activity"], "answer": "C", "explain": "charity nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 (trước -ity)."}, {"type": "mcq", "level": "NB", "q": "If you do not know a word, _____ it up in the dictionary.", "options": ["A. pick", "B. go", "C. look", "D. take"], "answer": "C", "explain": "look up (tra cứu): tra từ trong từ điển."}, {"type": "mcq", "level": "TH", "q": "The app _____ helps you learn vocabulary is free.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "B", "explain": "Mệnh đề quan hệ xác định chỉ vật làm chủ ngữ: which."}, {"type": "mcq", "level": "VD", "q": "She is the only student _____ got full marks.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "A", "explain": "Chỉ người làm chủ ngữ (sau the only thường dùng that, who cũng đúng)."}, {"type": "mcq", "level": "TH", "q": "'Why do you want to learn English?' '_____'.", "options": ["A. I want.", "B. Because I want to study abroad.", "C. For learning.", "D. Because of."], "answer": "B", "explain": "Trả lời đầy đủ cho câu hỏi Why: Because I want to study abroad."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). English borrows words from many languages. The word 'coffee' came from Arabic through Turkish. 'Piano' came from Italian. This borrowing makes English vocabulary very rich.", "statements": ["a) English borrows words from other languages.", "b) 'Coffee' came from Arabic.", "c) 'Piano' came from Italian.", "d) Borrowing makes English poorer."], "answer": ["T", "T", "T", "F"], "explain": "a) T — bài đọc: borrows words from many languages. b) T — bài đọc: 'coffee' came from Arabic. c) T — bài đọc: 'piano' came from Italian. d) F — làm vốn từ phong phú hơn (richer)."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Identity is connected with language. The way people speak shows their culture. When people lose their mother tongue, they may lose part of their identity. Protecting local languages is therefore important.", "statements": ["a) Language is linked to identity.", "b) Speech reflects culture.", "c) Losing a mother tongue is not a problem.", "d) Local languages should be protected."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: identity is connected with language. b) T — bài đọc: shows their culture. c) F — mất tiếng mẹ đẻ có thể mất một phần bản sắc. d) T — bài đọc: protecting local languages is important."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE relative pronoun: The app _____ teaches pronunciation is free.", "answer": "which", "explain": "Chỉ vật làm chủ ngữ trong mệnh đề quan hệ xác định: which (that cũng đúng)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Speaking with a clear (articulate) _____ helps communication.", "answer": "articulation", "explain": "Sau tính từ clear cần danh từ: articulation (cách phát âm rõ ràng)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word that has a different stress position from the others.", "options": ["A. education", "B. operation", "C. quality", "D. decision"], "answer": "C", "explain": "quality nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 hoặc 3 (trước -ion)."}, {"type": "mcq", "level": "NB", "q": "Find the word which is stressed differently from the others.", "options": ["A. community", "B. identity", "C. ability", "D. possibility"], "answer": "C", "explain": "ability nhấn âm tiết thứ 2, các từ còn lại nhấn âm tiết thứ 3 (trước -ity)."}, {"type": "mcq", "level": "NB", "q": "_____ over your vocabulary before the exam.", "options": ["A. Look", "B. Pick", "C. Go", "D. Take"], "answer": "C", "explain": "go over (ôn lại): ôn lại từ vựng trước kỳ thi."}, {"type": "mcq", "level": "TH", "q": "The girl _____ sits next to me is from Australia.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "A", "explain": "Mệnh đề quan hệ xác định chỉ người làm chủ ngữ: who."}, {"type": "mcq", "level": "VD", "q": "The job _____ he applied for needs good English.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "B", "explain": "Chỉ vật (the job) làm tân ngữ, có giới từ for ở cuối: which."}, {"type": "mcq", "level": "TH", "q": "'Let's join the English speaking club.' '_____'.", "options": ["A. Yes, let's not.", "B. Good idea.", "C. No, let's.", "D. I am joining."], "answer": "B", "explain": "Đồng ý với đề xuất: Good idea."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). In some countries, English is a second language. People use it at work and in schools. In Viet Nam, students learn English as a foreign language. Good English opens doors to the world.", "statements": ["a) English is a second language in some countries.", "b) People use it at work and school.", "c) Vietnamese students never learn English.", "d) Good English brings opportunities."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: English is a second language. b) T — bài đọc: use it at work and in schools. c) F — học sinh Việt Nam học tiếng Anh. d) T — bài đọc: opens doors to the world."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Translation helps people understand each other. Good translators keep both meaning and feeling of the text. Machine translation is fast but not always correct. Human translators are still needed for important texts.", "statements": ["a) Translation connects people.", "b) Good translation keeps meaning and feeling.", "c) Machine translation is always perfect.", "d) Humans are needed for important translation."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: helps people understand each other. b) T — bài đọc: keep both meaning and feeling. c) F — dịch máy không phải lúc nào cũng đúng. d) T — bài đọc: human translators are still needed."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE relative pronoun: The singer _____ songs we love is famous.", "answer": "whose", "explain": "Chỉ sự sở hữu (songs của ca sĩ): whose."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: (communicate) _____ in English is important for his job.", "answer": "Communication", "explain": "Đầu câu cần danh từ làm chủ ngữ: Communication (giao tiếp)."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose primary stress falls on a different syllable.", "options": ["A. intention", "B. revision", "C. discussion", "D. quality"], "answer": "D", "explain": "quality nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 (trước -ion)."}, {"type": "mcq", "level": "NB", "q": "Pick the word that breaks the stress pattern of the group.", "options": ["A. ability", "B. obesity", "C. activity", "D. charity"], "answer": "D", "explain": "charity nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 (trước -ity)."}, {"type": "mcq", "level": "NB", "q": "You can _____ up a new language by living abroad.", "options": ["A. look", "B. go", "C. take", "D. pick"], "answer": "D", "explain": "pick up (học lỏm, tiếp thu): tiếp thu ngôn ngữ mới khi sống ở nước ngoài."}, {"type": "mcq", "level": "TH", "q": "The course _____ I am taking is quite cheap.", "options": ["A. who", "B. whose", "C. which", "D. whom"], "answer": "C", "explain": "Mệnh đề quan hệ xác định chỉ vật làm tân ngữ: which."}, {"type": "mcq", "level": "VD", "q": "The novel _____ was written by a Vietnamese author is famous.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "B", "explain": "Chỉ vật (the novel) làm chủ ngữ: which."}, {"type": "mcq", "level": "TH", "q": "'How do you say bản sắc in English?' '_____'.", "options": ["A. It is Vietnamese.", "B. We say 'identity'.", "C. I do not say.", "D. Say it again."], "answer": "B", "explain": "Trả lời đúng câu hỏi về cách nói một từ bằng tiếng Anh."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Accents show where a person comes from. An Australian accent sounds different from an American one. At first, learners may find some accents hard to understand. With practice, they will get used to them.", "statements": ["a) Accents show a person's origin.", "b) All English accents sound the same.", "c) Some accents are hard at first.", "d) Practice helps learners understand accents."], "answer": ["T", "F", "T", "T"], "explain": "a) T — bài đọc: show where a person comes from. b) F — giọng Úc khác giọng Mỹ. c) T — bài đọc: may find some accents hard. d) T — bài đọc: with practice, they will get used to them."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). English clubs give learners a place to practise. Members play games and discuss topics in English. Shy students become more confident over time. Joining a club makes learning fun.", "statements": ["a) English clubs help learners practise.", "b) Members only study grammar at clubs.", "c) Shy students can gain confidence.", "d) Clubs make learning enjoyable."], "answer": ["T", "F", "T", "T"], "explain": "a) T — bài đọc: give learners a place to practise. b) F — chơi trò chơi và thảo luận chủ đề. c) T — bài đọc: become more confident. d) T — bài đọc: makes learning fun."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE relative pronoun: The school _____ she studies is near my house.", "answer": "which", "explain": "Chỉ vật, nơi chốn (the school): which (that cũng đúng)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The (translate) _____ of the book took two years.", "answer": "translation", "explain": "Sau mạo từ the cần danh từ: translation (bản dịch)."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Which word does not follow the same stress pattern? Choose it.", "options": ["A. relation", "B. quality", "C. decision", "D. position"], "answer": "B", "explain": "quality nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 (trước -ion)."}, {"type": "mcq", "level": "NB", "q": "Choose the word with main stress in a different position.", "options": ["A. charity", "B. clarity", "C. education", "D. quality"], "answer": "C", "explain": "education nhấn âm tiết thứ 3 (trước -ion), các từ còn lại nhấn âm tiết đầu (trước -ity)."}, {"type": "mcq", "level": "NB", "q": "Vietnamese is my _____, and English is my second language.", "options": ["A. official language", "B. foreign language", "C. community", "D. mother tongue"], "answer": "D", "explain": "mother tongue (tiếng mẹ đẻ): tiếng Việt là tiếng mẹ đẻ của tôi."}, {"type": "mcq", "level": "TH", "q": "The man _____ car was stolen is my neighbour.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "C", "explain": "Mệnh đề quan hệ xác định chỉ sự sở hữu: whose."}, {"type": "mcq", "level": "VD", "q": "The club _____ organises English speaking contests is very active.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "B", "explain": "Chỉ vật, tổ chức (the club) làm chủ ngữ: which."}, {"type": "mcq", "level": "TH", "q": "'Excuse me, do you speak English?' '_____'.", "options": ["A. No, I am not.", "B. I speak Vietnamese.", "C. Yes, a little.", "D. Yes, I am."], "answer": "C", "explain": "Trả lời tự nhiên, đúng ngữ cảnh khi được hỏi có biết tiếng Anh không."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Going over vocabulary regularly is important. Learners should review old words every week. Flashcards are a useful tool for revision. Small daily practice is better than long rare sessions.", "statements": ["a) Regular revision is important.", "b) Learners should review old words weekly.", "c) Flashcards are useless.", "d) Daily short practice is effective."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: going over vocabulary regularly is important. b) T — bài đọc: review old words every week. c) F — thẻ từ vựng rất hữu ích. d) T — bài đọc: small daily practice is better."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some people learn English for travel, others for work. Clear goals help learners stay motivated. Without goals, learners may give up easily. A good plan with small steps leads to success.", "statements": ["a) People learn English for different reasons.", "b) Goals keep learners motivated.", "c) Learners never give up.", "d) Small steps lead to success."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: for travel, others for work. b) T — bài đọc: help learners stay motivated. c) F — không có mục tiêu dễ bỏ cuộc. d) T — bài đọc: small steps leads to success."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE relative pronoun: The man _____ opinions I respect is my teacher.", "answer": "whose", "explain": "Chỉ sự sở hữu (opinions của người đàn ông): whose."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She is (confidence) _____ when speaking English.", "answer": "confident", "explain": "Sau động từ be cần tính từ: confident (tự tin)."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Select the word whose stress differs from the other three.", "options": ["A. function", "B. discussion", "C. attention", "D. revision"], "answer": "A", "explain": "function nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 2 (trước -ion)."}, {"type": "mcq", "level": "NB", "q": "Choose the word pronounced with a different stress pattern.", "options": ["A. identity", "B. charity", "C. community", "D. possibility"], "answer": "B", "explain": "charity nhấn âm tiết đầu, các từ còn lại nhấn âm tiết thứ 3 (trước -ity)."}, {"type": "mcq", "level": "NB", "q": "English has become a _____ language in many countries.", "options": ["A. foreign", "B. official", "C. concentric", "D. second"], "answer": "D", "explain": "second language (ngôn ngữ thứ hai): tiếng Anh là ngôn ngữ thứ hai ở nhiều nước."}, {"type": "mcq", "level": "TH", "q": "The school _____ she studies has many foreign teachers.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "B", "explain": "Mệnh đề quan hệ xác định chỉ nơi chốn, vật: which."}, {"type": "mcq", "level": "VD", "q": "He is a person _____ opinions I respect.", "options": ["A. who", "B. which", "C. whose", "D. whom"], "answer": "C", "explain": "Chỉ sự sở hữu (opinions của anh ấy): whose."}, {"type": "mcq", "level": "TH", "q": "'Thank you for helping me with my English.' '_____'.", "options": ["A. Thank you too.", "B. You are welcome.", "C. I am fine.", "D. I am happy."], "answer": "B", "explain": "Đáp lại lời cảm ơn một cách chuẩn mực: You are welcome."}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). English is the language of the internet. Most websites use English as the main language. People around the world communicate in English online. Learning English helps you explore the digital world.", "statements": ["a) English is widely used on the internet.", "b) Most websites use English.", "c) People cannot communicate online in English.", "d) English helps you explore the digital world."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: the language of the internet. b) T — bài đọc: most websites use English. c) F — mọi người giao tiếp bằng tiếng Anh trên mạng. d) T — bài đọc: helps you explore the digital world."}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Reading English books improves vocabulary naturally. Learners meet new words in real contexts. They should guess meaning before using a dictionary. Regular reading builds both language and knowledge.", "statements": ["a) Reading builds vocabulary naturally.", "b) Books show words in real contexts.", "c) Learners should never guess word meaning.", "d) Reading builds language and knowledge."], "answer": ["T", "T", "F", "T"], "explain": "a) T — bài đọc: improves vocabulary naturally. b) T — bài đọc: meet new words in real contexts. c) F — nên đoán nghĩa trước khi tra từ điển. d) T — bài đọc: builds both language and knowledge."}, {"type": "short", "level": "VD", "q": "Fill in the blank with ONE relative pronoun: The course _____ I am taking finishes next month.", "answer": "which", "explain": "Chỉ vật (the course) làm tân ngữ: which (that cũng đúng, có thể lược bỏ)."}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: (regular) _____ practice is the key to fluency.", "answer": "Regular", "explain": "Đầu câu cần tính từ bổ nghĩa cho danh từ practice: Regular (đều đặn)."}]}]}</script>
