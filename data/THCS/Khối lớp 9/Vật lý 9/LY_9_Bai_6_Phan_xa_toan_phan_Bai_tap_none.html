TH","q": "Phản xạ toàn phần khác phản xạ thông thường ở điểm:","options": ["A. Không tuân theo định luật phản xạ","B. Không có tia khúc xạ, tia phản xạ rất sáng","C. Góc phản xạ khác góc tới","D. Chỉ xảy ra trên gương"],"answer": "B","explain": "Phản xạ toàn phần không có tia khúc xạ và tia phản xạ rất sáng.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong phản xạ toàn phần, góc phản xạ so với góc tới thì:","options": ["A. Bằng nhau","B. Bằng 90°","C. Bằng 0°","D. Lớn hơn"],"answer": "A","explain": "Vẫn tuân theo định luật phản xạ: góc phản xạ bằng góc tới.","points": 0.25},{"type": "mcq","level": "VD","q": "Chiếu tia sáng từ nước ra không khí với góc tới 50°. Hiện tượng xảy ra là:","options": ["A. Khúc xạ bình thường","B. Phản xạ toàn phần","C. Tia sáng truyền thẳng","D. Tia sáng bị hấp thụ"],"answer": "B","explain": "Góc giới hạn nước-không khí là 48,6°, góc tới 50° lớn hơn.","points": 0.25},{"type": "mcq","level": "VDC","q": "Chiếu tia sáng từ nước ra không khí với góc tới 48°. Hiện tượng xảy ra là:","options": ["A. Phản xạ toàn phần","B. Vừa phản xạ vừa khúc xạ","C. Chỉ có khúc xạ","D. Tia sáng biến mất"],"answer": "B","explain": "Góc tới 48° nhỏ hơn góc giới hạn 48,6° nên vẫn có tia khúc xạ.","points": 0.25},{"type": "mcq","level": "TH","q": "Muốn quan sát hiện tượng phản xạ toàn phần trong thí nghiệm với nước, ta phải:","options": ["A. Chiếu tia sáng từ không khí vào nước","B. Chiếu tia sáng từ nước ra không khí với góc tới tăng dần","C. Chiếu tia sáng vuông góc mặt nước","D. Đun nóng nước"],"answer": "B","explain": "Phải đi từ nước (chiết quang hơn) ra không khí và tăng dần góc tới.","points": 0.25},{"type": "mcq","level": "NB","q": "Dụng cụ quang học nào sau đây sử dụng lăng kính phản xạ toàn phần?","options": ["A. Kính lúp","B. Ống nhòm","C. Kính hiển vi","D. Kính cận"],"answer": "B","explain": "Ống nhòm dùng lăng kính phản xạ toàn phần để đổi hướng chùm sáng.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về phản xạ toàn phần.","statements": ["a) Phản xạ toàn phần vẫn tuân theo định luật phản xạ ánh sáng.","b) Tia phản xạ trong phản xạ toàn phần rất sáng.","c) Ống nhòm dùng lăng kính phản xạ toàn phần để gọn nhẹ.","d) Phản xạ toàn phần làm tia sáng yếu đi nhiều."],"answer": ["T","T","T","F"],"explain": "Phản xạ toàn phần gần như không làm mất mát ánh sáng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về thí nghiệm.","statements": ["a) Tăng dần góc tới, đến góc giới hạn thì tia khúc xạ biến mất.","b) Vượt quá góc giới hạn, toàn bộ ánh sáng bị phản xạ.","c) Hiện tượng này được ứng dụng trong cáp quang.","d) Phản xạ toàn phần chỉ xảy ra với ánh sáng đỏ."],"answer": ["T","T","T","F"],"explain": "Phản xạ toàn phần xảy ra với mọi ánh sáng.","points": 1},{"type": "short","level": "NB","q": "Trong phản xạ toàn phần, góc phản xạ và góc tới liên hệ với nhau như thế nào?","answer": "Bằng nhau","explain": "Tuân theo định luật phản xạ: góc phản xạ bằng góc tới.","points": 0.5},{"type": "short","level": "TH","q": "Nêu tên một dụng cụ quang học dùng lăng kính phản xạ toàn phần để làm gọn ống kính.","answer": "Ống nhòm","explain": "Ống nhòm dùng lăng kính phản xạ toàn phần.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Góc giới hạn phản xạ toàn phần thường được kí hiệu là:","options": ["A. i","B. r","C. igh","D. D"],"answer": "C","explain": "Góc giới hạn kí hiệu là igh.","points": 0.25},{"type": "mcq","level": "TH","q": "Công thức tính góc giới hạn phản xạ toàn phần là:","options": ["A. sin igh = n2 / n1 (với n1 lớn hơn n2)","B. sin igh = n1 / n2","C. cos igh = n2 / n1","D. igh = n1 / n2"],"answer": "A","explain": "sin igh = n2/n1, trong đó n1 lớn hơn n2.","points": 0.25},{"type": "mcq","level": "VD","q": "Một môi trường trong suốt X có chiết suất 2,0 so với không khí. Góc giới hạn phản xạ toàn phần là:","options": ["A. 30°","B. 60°","C. 45°","D. 90°"],"answer": "A","explain": "sin igh = 1/2, suy ra igh = 30°.","points": 0.25},{"type": "mcq","level": "VDC","q": "Chiếu tia sáng từ môi trường X (n = 2,0) ra không khí với góc tới 35°. Hiện tượng xảy ra là:","options": ["A. Khúc xạ bình thường","B. Phản xạ toàn phần","C. Tia sáng truyền thẳng","D. Tia sáng bị hấp thụ"],"answer": "B","explain": "Góc giới hạn là 30°, góc tới 35° lớn hơn.","points": 0.25},{"type": "mcq","level": "TH","q": "Chiết suất của môi trường (so với không khí) càng lớn thì góc giới hạn:","options": ["A. Càng lớn","B. Càng nhỏ","C. Không thay đổi","D. Bằng 90°"],"answer": "B","explain": "sin igh = 1/n nên n càng lớn thì igh càng nhỏ.","points": 0.25},{"type": "mcq","level": "NB","q": "Phản xạ toàn phần KHÔNG thể xảy ra khi ánh sáng truyền từ:","options": ["A. Nước ra không khí","B. Thủy tinh ra không khí","C. Không khí vào nước","D. Dầu ra không khí"],"answer": "C","explain": "Từ không khí vào nước là đi từ chiết quang kém sang hơn.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về góc giới hạn của các chất.","statements": ["a) Chiết suất càng lớn thì góc giới hạn càng nhỏ.","b) Kim cương (n = 2,42) có góc giới hạn khoảng 24,4°.","c) Thủy tinh (n = 1,5) có góc giới hạn khoảng 41,8°.","d) Nước (n = 1,33) có góc giới hạn khoảng 48,6°."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định sau.","statements": ["a) Không thể có phản xạ toàn phần khi đi từ môi trường chiết quang kém sang chiết quang hơn.","b) Góc giới hạn luôn nhỏ hơn 90°.","c) Khi hai môi trường có chiết suất bằng nhau thì không có góc giới hạn.","d) Phản xạ toàn phần là trường hợp đặc biệt của khúc xạ."],"answer": ["T","T","T","F"],"explain": "Phản xạ toàn phần là hiện tượng phản xạ, không phải khúc xạ.","points": 1},{"type": "short","level": "VD","q": "Tính góc giới hạn phản xạ toàn phần khi ánh sáng truyền từ thủy tinh (n = 1,5) ra không khí (làm tròn 1 chữ số thập phân).","answer": "41,8","explain": "sin igh = 1/1,5 = 0,667, suy ra igh khoảng 41,8°.","points": 0.5},{"type": "short","level": "VDC","q": "Một môi trường trong suốt có góc giới hạn phản xạ toàn phần (với không khí) là 30°. Chiết suất của môi trường đó là bao nhiêu?","answer": "2","explain": "n = 1/sin30° = 2.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "TH","q": "Trong thí nghiệm tăng dần góc tới (ánh sáng từ nước ra không khí), hiện tượng quan sát được là:","options": ["A. Phản xạ toàn phần ngay từ đầu","B. Ban đầu vừa phản xạ vừa khúc xạ, đến góc giới hạn thì mất tia khúc xạ","C. Chỉ có khúc xạ","D. Tia sáng biến mất"],"answer": "B","explain": "Khi i nhỏ hơn igh thì vừa phản xạ vừa khúc xạ; khi i lớn hơn hoặc bằng igh thì phản xạ toàn phần.","points": 0.25},{"type": "mcq","level": "NB","q": "Tia phản xạ trong hiện tượng khúc xạ thông thường (chưa đạt góc giới hạn) thì:","options": ["A. Rất sáng","B. Khá mờ (chỉ một phần nhỏ)","C. Không tồn tại","D. Mạnh hơn tia tới"],"answer": "B","explain": "Phần lớn ánh sáng đi vào tia khúc xạ, tia phản xạ khá mờ.","points": 0.25},{"type": "mcq","level": "VD","q": "Chiếu tia sáng từ không khí vào nước với góc tới 60°. Có xảy ra phản xạ toàn phần không?","options": ["A. Có","B. Không, vì ánh sáng đi từ môi trường chiết quang kém sang chiết quang hơn","C. Có một phần","D. Không xác định được"],"answer": "B","explain": "Đi từ chiết quang kém sang hơn thì không thể phản xạ toàn phần.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một người thợ lặn ở dưới nước nhìn lên thấy mặt nước như một tấm gương (trừ một vùng tròn sáng phía trên). Vùng mặt nước như tấm gương là do:","options": ["A. Khúc xạ ánh sáng","B. Phản xạ toàn phần","C. Tán sắc ánh sáng","D. Nhiễu xạ ánh sáng"],"answer": "B","explain": "Ánh sáng từ dưới tới mặt nước với góc tới lớn bị phản xạ toàn phần.","points": 0.25},{"type": "mcq","level": "TH","q": "Nhìn từ dưới nước lên, mặt nước ngoài một vùng tròn trông như gương là do:","options": ["A. Phản xạ toàn phần","B. Khúc xạ thông thường","C. Hấp thụ ánh sáng","D. Tán sắc"],"answer": "A","explain": "Đó là hiện tượng phản xạ toàn phần.","points": 0.25},{"type": "mcq","level": "NB","q": "Cáp quang gồm:","options": ["A. Lõi và lớp vỏ có chiết suất khác nhau","B. Chỉ một sợi vật liệu đồng nhất","C. Dây kim loại","D. Ống rỗng"],"answer": "A","explain": "Lõi có chiết suất lớn hơn lớp vỏ bao quanh.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về phản xạ toàn phần trong thực tế.","statements": ["a) Từ không khí vào nước không thể xảy ra phản xạ toàn phần.","b) Tia phản xạ trong khúc xạ thông thường khá mờ.","c) Thợ lặn nhìn lên thấy mặt nước như gương là do phản xạ toàn phần.","d) Lõi cáp quang có chiết suất lớn hơn lớp vỏ."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về cáp quang.","statements": ["a) Chiết suất của lõi lớn hơn của vỏ giúp giữ ánh sáng trong lõi.","b) Ánh sáng trong cáp quang phản xạ toàn phần liên tiếp.","c) Cáp quang dùng để truyền tín hiệu internet, truyền hình.","d) Cáp quang truyền trực tiếp dòng điện."],"answer": ["T","T","T","F"],"explain": "Cáp quang truyền tín hiệu ánh sáng, không phải dòng điện.","points": 1},{"type": "short","level": "NB","q": "Bộ phận nào của cáp quang có chiết suất lớn hơn: lõi hay lớp vỏ?","answer": "Lõi","explain": "Lõi có chiết suất lớn hơn lớp vỏ.","points": 0.5},{"type": "short","level": "TH","q": "Vì sao lõi cáp quang phải có chiết suất lớn hơn lớp vỏ bao quanh?","answer": "Để xảy ra phản xạ toàn phần giữ ánh sáng trong lõi","explain": "Có như vậy ánh sáng mới bị phản xạ toàn phần liên tiếp trong lõi.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Phản xạ toàn phần xảy ra khi góc tới:","options": ["A. Bằng 0","B. Lớn hơn hoặc bằng góc giới hạn","C. Nhỏ hơn góc giới hạn","D. Bằng 90°"],"answer": "B","explain": "Điều kiện: i ≥ igh.","points": 0.25},{"type": "mcq","level": "TH","q": "Nếu góc tới nhỏ hơn góc giới hạn thì:","options": ["A. Xảy ra phản xạ toàn phần","B. Xảy ra cả phản xạ và khúc xạ","C. Không có hiện tượng gì","D. Tia sáng biến mất"],"answer": "B","explain": "Chưa đủ điều kiện nên vẫn có tia khúc xạ.","points": 0.25},{"type": "mcq","level": "VD","q": "Tính sin của góc giới hạn khi ánh sáng truyền từ nước (n = 1,33) ra không khí:","options": ["A. 1,33","B. 0,75","C. 1","D. 0,5"],"answer": "B","explain": "sin igh = 1/1,33 = 0,75.","points": 0.25},{"type": "mcq","level": "VDC","q": "Tia sáng truyền từ thủy tinh (n = 1,5) sang nước (n = 1,33). Góc giới hạn xấp xỉ:","options": ["A. 41,8°","B. 48,6°","C. Khoảng 62,5°","D. 90°"],"answer": "C","explain": "sin igh = 1,33/1,5 = 0,887, suy ra igh khoảng 62,5°.","points": 0.25},{"type": "mcq","level": "TH","q": "So với cặp thủy tinh-không khí, góc giới hạn của cặp thủy tinh-nước thì:","options": ["A. Nhỏ hơn","B. Lớn hơn","C. Bằng nhau","D. Không so sánh được"],"answer": "B","explain": "62,5° lớn hơn 41,8° vì hai môi trường ít chênh lệch chiết suất hơn.","points": 0.25},{"type": "mcq","level": "NB","q": "Hiện tượng phản xạ toàn phần được ứng dụng trong:","options": ["A. Gương cầu","B. Sợi quang học","C. Kính cận","D. Kính viễn vọng"],"answer": "B","explain": "Sợi quang học (cáp quang) ứng dụng phản xạ toàn phần.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về góc giới hạn.","statements": ["a) Góc giới hạn của cặp thủy tinh-nước lớn hơn của cặp thủy tinh-không khí.","b) Hai môi trường càng chênh lệch chiết suất thì góc giới hạn càng nhỏ.","c) sin igh = n2 / n1.","d) Góc giới hạn không phụ thuộc vào bước sóng ánh sáng."],"answer": ["T","T","T","F"],"explain": "Do tán sắc, chiết suất hơi khác nhau theo màu nên góc giới hạn cũng hơi khác.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về lăng kính phản xạ toàn phần.","statements": ["a) Ánh sáng trắng bị tán sắc nên mỗi màu có góc giới hạn hơi khác nhau.","b) Phản xạ toàn phần không làm thay đổi màu sắc của ánh sáng.","c) Lăng kính phản xạ toàn phần thay được gương trong ống nhòm.","d) Gương thường phản xạ tốt hơn lăng kính phản xạ toàn phần."],"answer": ["T","T","T","F"],"explain": "Phản xạ toàn phần gần như không mất mát nên tốt hơn gương thường.","points": 1},{"type": "short","level": "VD","q": "So sánh góc giới hạn của cặp thủy tinh-không khí và cặp thủy tinh-nước. Cặp nào có góc giới hạn lớn hơn?","answer": "Thủy tinh-nước","explain": "62,5° lớn hơn 41,8°.","points": 0.5},{"type": "short","level": "VDC","q": "Vì sao lăng kính phản xạ toàn phần được dùng thay gương trong ống nhòm cao cấp?","answer": "Vì phản xạ toàn phần gần như không mất mát ánh sáng","explain": "Gương thường hấp thụ một phần ánh sáng, lăng kính phản xạ toàn phần thì không.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "TH","q": "Điều kiện về môi trường để có phản xạ toàn phần là:","options": ["A. n1 nhỏ hơn n2","B. n1 lớn hơn n2","C. n1 = n2","D. n1 + n2 = 1"],"answer": "B","explain": "Môi trường tới phải chiết quang hơn môi trường khúc xạ.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong công thức sin igh = n2 / n1, n1 là chiết suất của:","options": ["A. Môi trường mà tia tới đang truyền (chiết quang hơn)","B. Môi trường mà tia khúc xạ đi vào","C. Chân không","D. Không khí"],"answer": "A","explain": "n1 là chiết suất của môi trường tới (lớn hơn).","points": 0.25},{"type": "mcq","level": "VD","q": "Ánh sáng truyền từ môi trường A (n = 1,6) ra không khí. Góc giới hạn xấp xỉ:","options": ["A. 51,3°","B. Khoảng 38,7°","C. 90°","D. 30°"],"answer": "B","explain": "sin igh = 1/1,6 = 0,625, suy ra igh khoảng 38,7°.","points": 0.25},{"type": "mcq","level": "VDC","q": "Tia sáng trong môi trường A (n = 1,6) tới mặt phân cách với không khí với góc tới 40°. Hiện tượng xảy ra là:","options": ["A. Khúc xạ với góc khúc xạ lớn","B. Phản xạ toàn phần","C. Tia sáng truyền thẳng","D. Tia sáng bị hấp thụ"],"answer": "B","explain": "Góc giới hạn khoảng 38,7°, góc tới 40° lớn hơn.","points": 0.25},{"type": "mcq","level": "TH","q": "Nếu tăng chiết suất n1 của môi trường tới thì góc giới hạn sẽ:","options": ["A. Tăng lên","B. Giảm đi","C. Không thay đổi","D. Bằng 90°"],"answer": "B","explain": "sin igh = n2/n1 nên n1 tăng thì igh giảm.","points": 0.25},{"type": "mcq","level": "NB","q": "Phản xạ toàn phần là hiện tượng của:","options": ["A. Khúc xạ","B. Phản xạ","C. Tán sắc","D. Giao thoa"],"answer": "B","explain": "Đó là một dạng của hiện tượng phản xạ.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về phản xạ toàn phần.","statements": ["a) Phản xạ toàn phần là một dạng của hiện tượng phản xạ.","b) Cần môi trường tới chiết quang hơn môi trường bên kia.","c) Cần góc tới lớn hơn hoặc bằng góc giới hạn.","d) Tia khúc xạ vẫn tồn tại nhưng rất mờ."],"answer": ["T","T","T","F"],"explain": "Khi phản xạ toàn phần thì không còn tia khúc xạ.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về góc giới hạn.","statements": ["a) Chiết suất môi trường tới càng lớn thì góc giới hạn càng nhỏ.","b) Khi góc tới bằng góc giới hạn thì góc khúc xạ bằng 90°.","c) Khi góc tới lớn hơn góc giới hạn thì không còn tia khúc xạ.","d) Định luật phản xạ vẫn đúng trong phản xạ toàn phần."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Để xảy ra phản xạ toàn phần, ánh sáng phải truyền từ môi trường chiết quang hơn sang môi trường chiết quang kém hay ngược lại?","answer": "Từ môi trường chiết quang hơn sang môi trường chiết quang kém","explain": "Phải đi từ môi trường chiết quang hơn sang chiết quang kém.","points": 0.5},{"type": "short","level": "TH","q": "Một tia sáng truyền từ nước ra không khí với góc tới 60°. Có xảy ra phản xạ toàn phần không? Vì sao?","answer": "Có, vì 60° lớn hơn góc giới hạn 48,6°","explain": "Góc tới vượt quá góc giới hạn nên xảy ra phản xạ toàn phần.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Ứng dụng nào sau đây KHÔNG sử dụng hiện tượng phản xạ toàn phần?","options": ["A. Cáp quang","B. Ống nhòm (lăng kính)","C. Gương phẳng","D. Đèn trang trí sợi quang"],"answer": "C","explain": "Gương phẳng dùng phản xạ thông thường.","points": 0.25},{"type": "mcq","level": "TH","q": "Đèn trang trí dùng sợi quang phát sáng rực rỡ là nhờ:","options": ["A. Dòng điện trong sợi","B. Phản xạ toàn phần dẫn ánh sáng trong sợi","C. Sóng âm trong sợi","D. Nhiệt năng"],"answer": "B","explain": "Ánh sáng được dẫn trong sợi nhờ phản xạ toàn phần.","points": 0.25},{"type": "mcq","level": "VD","q": "Trong y học, thiết bị nội soi sử dụng:","options": ["A. Cáp quang","B. Gương phẳng","C. Thấu kính phân kì","D. Lăng kính tán sắc"],"answer": "A","explain": "Ống nội soi dùng bó sợi quang.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao ống nội soi dùng bó sợi quang thay vì ống kim loại rỗng?","options": ["A. Vì rẻ hơn","B. Vì sợi quang mềm dẻo, dẫn ánh sáng tốt nhờ phản xạ toàn phần","C. Vì nhẹ hơn","D. Vì đẹp hơn"],"answer": "B","explain": "Sợi quang mềm, luồn được vào cơ thể và dẫn sáng hiệu quả.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong cáp quang, ánh sáng truyền đi theo đường:","options": ["A. Thẳng","B. Gấp khúc do phản xạ toàn phần liên tiếp","C. Cong đều","D. Xoắn ốc"],"answer": "B","explain": "Ánh sáng phản xạ toàn phần liên tiếp nên đi theo đường gấp khúc.","points": 0.25},{"type": "mcq","level": "NB","q": "Tín hiệu truyền trong cáp quang là:","options": ["A. Dòng điện","B. Tín hiệu ánh sáng","C. Sóng âm","D. Sóng nước"],"answer": "B","explain": "Cáp quang truyền tín hiệu bằng ánh sáng.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về ứng dụng của sợi quang.","statements": ["a) Ống nội soi y học dùng bó sợi quang.","b) Đèn sợi quang trang trí dùng phản xạ toàn phần.","c) Cáp quang truyền tín hiệu ánh sáng.","d) Gương phẳng dùng phản xạ toàn phần."],"answer": ["T","T","T","F"],"explain": "Gương phẳng dùng phản xạ thông thường.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về sợi quang.","statements": ["a) Sợi quang mềm dẻo, luồn được vào cơ thể.","b) Nội soi giúp quan sát bên trong cơ thể ít xâm lấn.","c) Cáp quang biển truyền tín hiệu liên lục địa.","d) Cáp quang không thể uốn cong."],"answer": ["T","T","T","F"],"explain": "Sợi quang có thể uốn cong mà vẫn dẫn sáng.","points": 1},{"type": "short","level": "NB","q": "Thiết bị y học dùng bó sợi quang để quan sát bên trong cơ thể gọi là gì?","answer": "Ống nội soi","explain": "Đó là ống nội soi.","points": 0.5},{"type": "short","level": "TH","q": "Nêu hai ứng dụng của cáp quang trong đời sống.","answer": "Truyền tín hiệu internet và nội soi y học","explain": "Hai ứng dụng phổ biến của cáp quang.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Khi nào thì KHÔNG thể xảy ra phản xạ toàn phần?","options": ["A. Ánh sáng từ nước ra không khí","B. Ánh sáng từ không khí vào nước","C. Ánh sáng từ thủy tinh ra không khí","D. Ánh sáng từ dầu ra không khí"],"answer": "B","explain": "Đi từ chiết quang kém sang hơn thì không thể phản xạ toàn phần.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi nào thì chắc chắn xảy ra phản xạ toàn phần?","options": ["A. Môi trường tới chiết quang hơn và góc tới lớn hơn hoặc bằng góc giới hạn","B. Môi trường tới chiết quang kém hơn","C. Góc tới bằng 0","D. Hai môi trường giống nhau"],"answer": "A","explain": "Đó chính là hai điều kiện của phản xạ toàn phần.","points": 0.25},{"type": "mcq","level": "VD","q": "Tia sáng truyền từ dầu (n = 1,47) ra không khí. Góc giới hạn xấp xỉ:","options": ["A. 47,1°","B. Khoảng 42,9°","C. 90°","D. 30°"],"answer": "B","explain": "sin igh = 1/1,47 = 0,68, suy ra igh khoảng 42,9°.","points": 0.25},{"type": "mcq","level": "VDC","q": "Chiếu tia sáng từ dầu (n = 1,47) ra không khí với góc tới 45°. Hiện tượng xảy ra là:","options": ["A. Khúc xạ bình thường","B. Phản xạ toàn phần","C. Tia sáng truyền thẳng","D. Tia sáng bị hấp thụ"],"answer": "B","explain": "Góc giới hạn khoảng 42,9°, góc tới 45° lớn hơn.","points": 0.25},{"type": "mcq","level": "TH","q": "So sánh góc giới hạn của cặp dầu-không khí với cặp nước-không khí:","options": ["A. Lớn hơn","B. Nhỏ hơn","C. Bằng nhau","D. Không so sánh được"],"answer": "B","explain": "42,9° nhỏ hơn 48,6° vì dầu chiết quang hơn nước.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong phản xạ toàn phần, năng lượng của ánh sáng:","options": ["A. Mất hẳn","B. Gần như được bảo toàn trong tia phản xạ","C. Chuyển hết thành nhiệt","D. Chuyển hết thành điện"],"answer": "B","explain": "Gần như toàn bộ năng lượng đi vào tia phản xạ.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định tổng kết về phản xạ toàn phần.","statements": ["a) Từ không khí vào nước không thể xảy ra phản xạ toàn phần.","b) Điều kiện đủ: môi trường tới chiết quang hơn và góc tới lớn hơn hoặc bằng góc giới hạn.","c) Dầu (n = 1,47) có góc giới hạn khoảng 42,9°.","d) Trong phản xạ toàn phần, tia phản xạ rất sáng."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về góc giới hạn.","statements": ["a) Góc giới hạn của dầu nhỏ hơn của nước.","b) Chiết suất càng lớn thì góc giới hạn càng nhỏ.","c) Phản xạ toàn phần không làm mất mát năng lượng đáng kể.","d) Mọi tia sáng từ nước ra không khí đều bị phản xạ toàn phần."],"answer": ["T","T","T","F"],"explain": "Chỉ những tia có góc tới đủ lớn mới bị phản xạ toàn phần.","points": 1},{"type": "short","level": "NB","q": "Nêu điều kiện về góc tới để xảy ra phản xạ toàn phần.","answer": "Góc tới lớn hơn hoặc bằng góc giới hạn","explain": "Cần i ≥ igh.","points": 0.5},{"type": "short","level": "TH","q": "Nêu điều kiện về môi trường để xảy ra phản xạ toàn phần.","answer": "Ánh sáng truyền từ môi trường chiết quang hơn sang môi trường chiết quang kém","explain": "Đó là điều kiện về môi trường.","points": 0.5}]}]}
