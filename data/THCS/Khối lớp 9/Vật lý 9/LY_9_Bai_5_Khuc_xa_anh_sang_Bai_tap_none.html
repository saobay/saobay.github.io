{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Hiện tượng khúc xạ ánh sáng là hiện tượng:","options": ["A. Tia sáng bị gãy khúc khi truyền xiên góc qua mặt phân cách hai môi trường trong suốt","B. Tia sáng bị phản xạ trở lại môi trường cũ","C. Tia sáng luôn truyền thẳng","D. Tia sáng bị hấp thụ hoàn toàn"],"answer": "A","explain": "Khúc xạ là hiện tượng tia sáng bị gãy khúc tại mặt phân cách hai môi trường trong suốt.","points": 0.25},{"type": "mcq","level": "TH","q": "Tia khúc xạ nằm ở vị trí nào so với tia tới?","options": ["A. Cùng phía với tia tới so với pháp tuyến","B. Phía bên kia pháp tuyến so với tia tới","C. Trùng với pháp tuyến","D. Trùng với tia tới"],"answer": "B","explain": "Tia khúc xạ nằm trong mặt phẳng tới, ở phía bên kia pháp tuyến so với tia tới.","points": 0.25},{"type": "mcq","level": "VD","q": "Tia sáng truyền xiên góc từ không khí vào nước với góc tới 60°. Góc khúc xạ sẽ:","options": ["A. Lớn hơn 60°","B. Nhỏ hơn 60°","C. Bằng 60°","D. Bằng 0°"],"answer": "B","explain": "Nước chiết quang hơn không khí nên tia khúc xạ gần pháp tuyến hơn (r nhỏ hơn i).","points": 0.25},{"type": "mcq","level": "VDC","q": "Chiết suất của nước là 4/3. Vận tốc của ánh sáng trong nước là (c = 3.10^8 m/s):","options": ["A. 3.10^8 m/s","B. 2,25.10^8 m/s","C. 4.10^8 m/s","D. 1,5.10^8 m/s"],"answer": "B","explain": "v = c/n = 3.10^8/(4/3) = 2,25.10^8 m/s.","points": 0.25},{"type": "mcq","level": "NB","q": "Góc tới là góc tạo bởi:","options": ["A. Tia tới và mặt phân cách","B. Tia tới và pháp tuyến","C. Tia khúc xạ và pháp tuyến","D. Tia tới và tia khúc xạ"],"answer": "B","explain": "Góc tới là góc giữa tia tới và pháp tuyến tại điểm tới.","points": 0.25},{"type": "mcq","level": "TH","q": "Chiết suất tỉ đối của môi trường 2 đối với môi trường 1 được xác định bằng:","options": ["A. n21 = sin i / sin r","B. n21 = sin r / sin i","C. n21 = i / r","D. n21 = r / i"],"answer": "A","explain": "Theo định luật khúc xạ: sin i / sin r = n21.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về hiện tượng khúc xạ.","statements": ["a) Khúc xạ là hiện tượng tia sáng bị gãy khúc tại mặt phân cách hai môi trường trong suốt.","b) Tia khúc xạ nằm trong mặt phẳng tới.","c) Góc khúc xạ là góc giữa tia khúc xạ và mặt phân cách.","d) Khi tia tới vuông góc với mặt phân cách thì tia sáng truyền thẳng."],"answer": ["T","T","F","T"],"explain": "Góc khúc xạ là góc giữa tia khúc xạ và pháp tuyến.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về chiết suất.","statements": ["a) Tỉ số sin i / sin r là hằng số đối với hai môi trường xác định.","b) Chiết suất tuyệt đối của chân không bằng 1.","c) Chiết suất của mọi môi trường đều nhỏ hơn 1.","d) Ánh sáng truyền trong môi trường chiết suất càng lớn thì vận tốc càng nhỏ."],"answer": ["T","T","F","T"],"explain": "Chiết suất của các môi trường trong suốt đều lớn hơn 1 (trừ chân không, không khí xấp xỉ 1).","points": 1},{"type": "short","level": "NB","q": "Hiện tượng tia sáng bị gãy khúc khi truyền xiên góc qua mặt phân cách hai môi trường trong suốt gọi là hiện tượng gì?","answer": "Khúc xạ ánh sáng","explain": "Đó là hiện tượng khúc xạ ánh sáng.","points": 0.5},{"type": "short","level": "TH","q": "Tia sáng truyền xiên góc từ không khí vào nước. So sánh góc khúc xạ với góc tới.","answer": "Góc khúc xạ nhỏ hơn góc tới","explain": "Nước chiết quang hơn nên tia khúc xạ gần pháp tuyến hơn.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "TH","q": "Tia sáng truyền xiên góc từ nước ra không khí. So với tia tới, tia khúc xạ:","options": ["A. Gần pháp tuyến hơn","B. Xa pháp tuyến hơn","C. Trùng với pháp tuyến","D. Truyền thẳng không gãy khúc"],"answer": "B","explain": "Đi từ môi trường chiết quang hơn sang kém, tia khúc xạ xa pháp tuyến hơn (r lớn hơn i).","points": 0.25},{"type": "mcq","level": "NB","q": "Chiết suất tuyệt đối của một môi trường được tính bằng công thức:","options": ["A. n = c / v","B. n = v / c","C. n = sin i / sin r","D. n = c.v"],"answer": "A","explain": "n = c/v: vận tốc ánh sáng trong chân không chia cho vận tốc trong môi trường.","points": 0.25},{"type": "mcq","level": "VD","q": "Chiếu tia sáng từ không khí vào nước (n = 1,33) với góc tới 45°. Góc khúc xạ xấp xỉ:","options": ["A. 45°","B. Khoảng 32°","C. 58°","D. 90°"],"answer": "B","explain": "sin r = sin45°/1,33 = 0,532, suy ra r khoảng 32°.","points": 0.25},{"type": "mcq","level": "VDC","q": "Tia sáng truyền từ thủy tinh (n = 1,5) ra không khí với góc tới 30°. Góc khúc xạ xấp xỉ:","options": ["A. 20°","B. 30°","C. Khoảng 48,6°","D. 90°"],"answer": "C","explain": "sin r = 1,5.sin30° = 0,75, suy ra r khoảng 48,6°.","points": 0.25},{"type": "mcq","level": "NB","q": "Môi trường chiết quang hơn là môi trường có:","options": ["A. Chiết suất lớn hơn","B. Chiết suất nhỏ hơn","C. Trong suốt hơn","D. Khối lượng riêng lớn hơn"],"answer": "A","explain": "Chiết suất càng lớn thì càng chiết quang.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi ánh sáng truyền từ môi trường chiết quang kém sang môi trường chiết quang hơn, tia khúc xạ:","options": ["A. Xa pháp tuyến hơn tia tới","B. Gần pháp tuyến hơn tia tới","C. Trùng với pháp tuyến","D. Biến mất"],"answer": "B","explain": "Vào môi trường chiết quang hơn, tia khúc xạ lại gần pháp tuyến.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về đường đi của tia sáng.","statements": ["a) Ánh sáng từ không khí vào thủy tinh: tia khúc xạ gần pháp tuyến hơn tia tới.","b) Ánh sáng từ thủy tinh ra không khí: tia khúc xạ xa pháp tuyến hơn tia tới.","c) Góc tới tăng thì góc khúc xạ cũng tăng.","d) Chiết suất tỉ đối n21 = n2 / n1."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định sau.","statements": ["a) Khi góc tới bằng 0° thì góc khúc xạ bằng 0°, tia sáng truyền thẳng.","b) Hiện tượng khúc xạ giải thích vì sao chiếc đũa nhúng nước trông như á ở vị trí:","options": ["A. Đúng vị trí thật của cá","B. Gần mặt nước hơn vị trí thật","C. Sâu hơn vị trí thật","D. Ngoài bể nước"],"answer": "B","explain": "Do khúc xạ, ta thấy ảnh ảo của cá gần mặt nước hơn.","points": 0.25},{"type": "mcq","level": "NB","q": "Tia sáng truyền từ môi trường trong suốt này sang môi trường trong suốt khác mà KHÔNG bị gãy khúc khi:","options": ["A. Truyền xiên góc","B. Truyền vuông góc với mặt phân cách","C. Góc tới rất lớn","D. Hai môi trường khác nhau"],"answer": "B","explain": "Tia tới vuông góc mặt phân cách (i = 0) thì truyền thẳng.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về các thuật ngữ.","statements": ["a) Điểm tới là điểm tia sáng gặp mặt phân cách.","b) Pháp tuyến vuông góc với mặt phân cách tại điểm tới.","c) Góc tới là góc giữa tia tới và mặt phân cách.","d) Tia khúc xạ và tia tới nằm ở hai bên pháp tuyến."],"answer": ["T","T","F","T"],"explain": "Góc tới là góc giữa tia tới và pháp tuyến.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về quan sát vật trong nước.","statements": ["a) Nhìn từ trên xuống, đáy bể nước trông nông hơn thực tế vì khúc xạ.","b) Cá dưới nước nhìn người trên bờ thấy người như ở xa hơn thực tế.","c) Tia sáng truyền từ nước ra không khí bị gãy khúc ra xa pháp tuyến.","d) Hiện tượng khúc xạ tuân theo định luật phản xạ ánh sáng."],"answer": ["T","T","T","F"],"explain": "Khúc xạ tuân theo định luật khúc xạ, không phải định luật phản xạ.","points": 1},{"type": "short","level": "NB","q": "Đường thẳng vuông góc với mặt phân cách tại điểm tới được gọi là gì?","answer": "Pháp tuyến","explain": "Đó là pháp tuyến.","points": 0.5},{"type": "short","level": "TH","q": "Khi nhìn từ trên xuống, đáy bể nước trông nông hơn hay sâu hơn so với thực tế?","answer": "Nông hơn","explain": "Do khúc xạ, đáy bể trông như được nâng lên.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "VD","q": "Tia sáng từ không khí vào một môi trường trong suốt X có góc tới 50°, góc khúc xạ 35°. Chiết suất của X xấp xỉ:","options": ["A. Khoảng 1,33","B. 0,75","C. 1,5","D. 2,42"],"answer": "A","explain": "n = sin50°/sin35° = 0,766/0,574 = 1,335.","points": 0.25},{"type": "mcq","level": "VDC","q": "Tia sáng truyền trong nước (n = 4/3) tới mặt phân cách với không khí. Góc tới giới hạn để bắt đầu xảy ra phản xạ toàn phần xấp xỉ:","options": ["A. 41,8°","B. 48,6°","C. 90°","D. 30°"],"answer": "B","explain": "sin igh = 1/(4/3) = 0,75, suy ra igh khoảng 48,6°.","points": 0.25},{"type": "mcq","level": "NB","q": "Chiết suất của không khí xấp xỉ bằng:","options": ["A. 1","B. 1,33","C. 1,5","D. 2,42"],"answer": "A","explain": "Chiết suất không khí xấp xỉ bằng 1.","points": 0.25},{"type": "mcq","level": "TH","q": "Chiết suất của nước là 1,33 và của thủy tinh là 1,5. Môi trường nào chiết quang hơn?","options": ["A. Nước","B. Thủy tinh","C. Hai môi trường như nhau","D. Không so sánh được"],"answer": "B","explain": "Thủy tinh có chiết suất lớn hơn nên chiết quang hơn.","points": 0.25},{"type": "mcq","level": "TH","q": "Ánh sáng truyền từ nước (n = 1,33) sang thủy tinh (n = 1,5). So với tia tới, tia khúc xạ:","options": ["A. Gần pháp tuyến hơn","B. Xa pháp tuyến hơn","C. Trùng với tia tới","D. Biến mất"],"answer": "A","explain": "Đi vào môi trường chiết quang hơn nên tia khúc xạ gần pháp tuyến hơn.","points": 0.25},{"type": "mcq","level": "NB","q": "Hiện tượng nào sau đây là do khúc xạ ánh sáng?","options": ["A. Bóng của vật trên mặt đất","B. Chiếc thìa trong cốc nước trông như bị gãy","C. Ảnh của vật trong gương phẳng","D. Ảnh của vật trên phim"],"answer": "B","explain": "Thìa trông bị gãy tại mặt nước là do khúc xạ.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về ứng dụng của khúc xạ.","statements": ["a) Thìa nhúng nước trông bị gãy là do khúc xạ.","b) Cầu vồng hình thành do khúc xạ và phản xạ trong giọt nước.","c) Gương phẳng tạo ảnh là do khúc xạ.","d) Kính lúp phóng to vật nhờ khúc xạ qua thấu kính."],"answer": ["T","T","F","T"],"explain": "Gương phẳng tạo ảnh là do phản xạ.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về chiết suất.","statements": ["a) Chiết suất càng lớn thì ánh sáng truyền trong môi trường càng chậm.","b) Kim cương có chiết suất khoảng 2,42 nên rất lấp lánh.","c) Chiết suất phụ thuộc vào màu sắc của ánh sáng (hiện tượng tán sắc).","d) Mọi ánh sáng đơn sắc có cùng chiết suất trong một môi trường."],"answer": ["T","T","T","F"],"explain": "Mỗi màu có chiết suất hơi khác nhau nên mới có tán sắc.","points": 1},{"type": "short","level": "VD","q": "Chiết suất của một môi trường cho biết điều gì về vận tốc ánh sáng trong môi trường đó?","answer": "Chiết suất càng lớn thì vận tốc ánh sáng càng nhỏ","explain": "n = c/v nên n càng lớn thì v càng nhỏ.","points": 0.5},{"type": "short","level": "VDC","q": "Tia sáng từ không khí vào một môi trường trong suốt có góc tới 60°, góc khúc xạ 35°. Chiết suất của môi trường đó xấp xỉ bao nhiêu (làm tròn 2 chữ số thập phân)?","answer": "1,51","explain": "n = sin60°/sin35° = 0,866/0,574 = 1,51.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Định luật khúc xạ ánh sáng gồm mấy nội dung?","options": ["A. 1 nội dung","B. 2 nội dung","C. 3 nội dung","D. 4 nội dung"],"answer": "B","explain": "Hai nội dung: vị trí tia khúc xạ và tỉ số sin i / sin r.","points": 0.25},{"type": "mcq","level": "TH","q": "Nội dung thứ nhất của định luật khúc xạ ánh sáng là:","options": ["A. Tia khúc xạ nằm trong mặt phẳng tới, ở phía bên kia pháp tuyến so với tia tới","B. Góc tới luôn bằng góc khúc xạ","C. Tia khúc xạ luôn trùng với pháp tuyến","D. Không có tia khúc xạ"],"answer": "A","explain": "Đó là nội dung thứ nhất của định luật khúc xạ.","points": 0.25},{"type": "mcq","level": "VD","q": "Chiếu tia sáng từ không khí vào thủy tinh (n = 1,5) với góc tới 45°. Góc khúc xạ xấp xỉ:","options": ["A. 45°","B. Khoảng 28°","C. 62°","D. 90°"],"answer": "B","explain": "sin r = sin45°/1,5 = 0,471, suy ra r khoảng 28°.","points": 0.25},{"type": "mcq","level": "VDC","q": "Chiếu tia sáng từ thủy tinh (n = 1,5) ra không khí với góc tới 40°. Hiện tượng xảy ra là:","options": ["A. Phản xạ toàn phần","B. Vừa khúc xạ vừa phản xạ","C. Chỉ có phản xạ","D. Tia sáng bị hấp thụ"],"answer": "B","explain": "Góc giới hạn là 41,8°, góc tới 40° nhỏ hơn nên vẫn có tia khúc xạ.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi tia sáng truyền xiên góc từ không khí vào nước, tia khúc xạ:","options": ["A. Gần pháp tuyến hơn tia tới","B. Xa pháp tuyến hơn tia tới","C. Trùng với tia tới","D. Vuông góc với tia tới"],"answer": "A","explain": "Vào môi trường chiết quang hơn, tia khúc xạ lại gần pháp tuyến.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi góc tới tăng lên thì góc khúc xạ:","options": ["A. Giảm đi","B. Tăng lên","C. Không thay đổi","D. Bằng 0"],"answer": "B","explain": "Theo định luật khúc xạ, i tăng thì r cũng tăng.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về định luật khúc xạ.","statements": ["a) Tia khúc xạ luôn nằm trong mặt phẳng tới.","b) Góc tới và góc khúc xạ luôn bằng nhau.","c) Khi góc tới bằng 0 thì góc khúc xạ bằng 0.","d) Tia sáng luôn bị gãy khúc khi qua mặt phân cách hai môi trường."],"answer": ["T","F","T","F"],"explain": "Tia tới vuông góc mặt phân cách thì truyền thẳng, không gãy khúc.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về đường đi của tia sáng.","statements": ["a) Từ không khí vào nước, tia khúc xạ lệch về phía pháp tuyến.","b) Từ nước ra không khí, tia khúc xạ lệch ra xa pháp tuyến.","c) Góc tới càng lớn thì độ gãy khúc càng rõ.","d) Khúc xạ chỉ xảy ra với ánh sáng nhìn thấy."],"answer": ["T","T","T","F"],"explain": "Khúc xạ xảy ra với mọi bức xạ điện từ, không chỉ ánh sáng nhìn thấy.","points": 1},{"type": "short","level": "NB","q": "Tia khúc xạ nằm trong mặt phẳng nào?","answer": "Mặt phẳng tới","explain": "Tia khúc xạ nằm trong mặt phẳng tới.","points": 0.5},{"type": "short","level": "TH","q": "Khi góc tới tăng lên thì góc khúc xạ thay đổi thế nào?","answer": "Tăng lên","explain": "Góc tới tăng thì góc khúc xạ cũng tăng.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "TH","q": "Chiết suất tỉ đối của môi trường 2 đối với môi trường 1 được tính bằng:","options": ["A. n21 = n2 / n1","B. n21 = n1 / n2","C. n21 = n1.n2","D. n21 = n1 + n2"],"answer": "A","explain": "n21 = n2/n1.","points": 0.25},{"type": "mcq","level": "VD","q": "Chiết suất của thủy tinh là 1,5; của nước là 1,33. Chiết suất tỉ đối của thủy tinh đối với nước xấp xỉ:","options": ["A. 1,13","B. 0,89","C. 1,99","D. 2,83"],"answer": "A","explain": "n21 = 1,5/1,33 = 1,13.","points": 0.25},{"type": "mcq","level": "NB","q": "Chiết suất tuyệt đối của chân không bằng:","options": ["A. 0","B. 1","C. 1,33","D. Vô cùng"],"answer": "B","explain": "Chiết suất chân không bằng 1.","points": 0.25},{"type": "mcq","level": "VDC","q": "Tia sáng truyền từ môi trường A (n = 1,2) sang môi trường B (n = 1,8) với góc tới 30°. Góc khúc xạ xấp xỉ:","options": ["A. 30°","B. Khoảng 19,5°","C. 48,6°","D. 90°"],"answer": "B","explain": "sin r = 1,2.sin30°/1,8 = 0,333, suy ra r khoảng 19,5°.","points": 0.25},{"type": "mcq","level": "TH","q": "Môi trường chiết quang hơn là môi trường có:","options": ["A. Chiết suất lớn hơn","B. Chiết suất nhỏ hơn","C. Khối lượng riêng lớn hơn","D. Nhiệt độ cao hơn"],"answer": "A","explain": "Chiết suất lớn hơn thì chiết quang hơn.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi ánh sáng truyền từ môi trường chiết quang kém sang môi trường chiết quang hơn thì:","options": ["A. Góc khúc xạ lớn hơn góc tới","B. Góc khúc xạ nhỏ hơn góc tới","C. Góc khúc xạ bằng góc tới","D. Không có tia khúc xạ"],"answer": "B","explain": "Tia khúc xạ gần pháp tuyến hơn nên r nhỏ hơn i.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về chiết suất tỉ đối.","statements": ["a) Chiết suất tỉ đối n21 = n2 / n1.","b) Chiết suất tỉ đối của nước đối với không khí xấp xỉ 1,33.","c) Chiết suất tỉ đối luôn lớn hơn 1.","d) n12 = 1 / n21."],"answer": ["T","T","F","T"],"explain": "Chiết suất tỉ đối có thể nhỏ hơn 1 nếu n2 nhỏ hơn n1.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định sau.","statements": ["a) Ánh sáng đi từ môi trường chiết quang hơn sang kém thì góc khúc xạ lớn hơn góc tới.","b) Khi góc khúc xạ đạt 90° thì bắt đầu xảy ra phản xạ toàn phần.","c) Chiết suất tỉ đối phụ thuộc vào bản chất của hai môi trường.","d) Chiết suất tuyệt đối có thể nhỏ hơn 1."],"answer": ["T","T","T","F"],"explain": "Chiết suất tuyệt đối của môi trường trong suốt luôn lớn hơn hoặc bằng 1.","points": 1},{"type": "short","level": "NB","q": "Tỉ số sin i / sin r trong định luật khúc xạ chính là đại lượng nào?","answer": "Chiết suất tỉ đối n21","explain": "sin i / sin r = n21 là chiết suất tỉ đối của môi trường 2 đối với môi trường 1.","points": 0.5},{"type": "short","level": "VDC","q": "Chiết suất của nước là 1,33. Chiết suất tỉ đối của không khí đối với nước xấp xỉ bao nhiêu (làm tròn 2 chữ số thập phân)?","answer": "0,75","explain": "n12 = 1/1,33 = 0,75.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Hiện tượng khúc xạ ánh sáng xảy ra tại:","options": ["A. Mặt phân cách giữa hai môi trường trong suốt","B. Trong lòng một môi trường đồng tính","C. Trên gương phẳng","D. Trong chân không"],"answer": "A","explain": "Khúc xạ xảy ra tại mặt phân cách hai môi trường trong suốt.","points": 0.25},{"type": "mcq","level": "TH","q": "Điều kiện để xảy ra hiện tượng khúc xạ ánh sáng là:","options": ["A. Tia sáng truyền vuông góc với mặt phân cách","B. Tia sáng truyền xiên góc qua mặt phân cách hai môi trường trong suốt","C. Hai môi trường hoàn toàn giống nhau","D. Không cần điều kiện gì"],"answer": "B","explain": "Phải truyền xiên góc qua mặt phân cách hai môi trường trong suốt.","points": 0.25},{"type": "mcq","level": "VD","q": "Đặt một đồng xu dưới đáy cốc, đổ nước vào rồi nhìn xiên từ trên xuống, ta thấy đồng xu:","options": ["A. Ở đúng vị trí cũ","B. Như được nâng lên cao hơn","C. Chìm sâu hơn","D. Biến mất"],"answer": "B","explain": "Do khúc xạ, ảnh của đồng xu như được nâng lên.","points": 0.25},{"type": "mcq","level": "VDC","q": "Người đứng trên bờ nhìn xuống nước thấy con cá. Tia sáng từ con cá đến mắt người đã:","options": ["A. Phản xạ trên mặt nước","B. Khúc xạ tại mặt nước","C. Truyền thẳng không gãy khúc","D. Bị nước hấp thụ hết"],"answer": "B","explain": "Ánh sáng từ cá bị khúc xạ tại mặt nước khi vào mắt người.","points": 0.25},{"type": "mcq","level": "NB","q": "Góc khúc xạ là góc tạo bởi:","options": ["A. Tia khúc xạ và pháp tuyến","B. Tia khúc xạ và mặt phân cách","C. Tia tới và tia khúc xạ","D. Tia tới và mặt phân cách"],"answer": "A","explain": "Góc khúc xạ là góc giữa tia khúc xạ và pháp tuyến.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi tia sáng truyền từ không khí vào nước, vận tốc của ánh sáng:","options": ["A. Tăng lên","B. Giảm đi","C. Không thay đổi","D. Bằng 0"],"answer": "B","explain": "Nước chiết quang hơn nên ánh sáng truyền chậm hơn.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về hiện tượng khúc xạ.","statements": ["a) Khúc xạ xảy ra tại mặt phân cách hai môi trường trong suốt.","b) Tia tới vuông góc với mặt phân cách thì truyền thẳng.","c) Góc khúc xạ được đo giữa tia khúc xạ và mặt phân cách.","d) Môi trường càng chiết quang thì ánh sáng truyền trong đó càng chậm."],"answer": ["T","T","F","T"],"explain": "Góc khúc xạ đo giữa tia khúc xạ và pháp tuyến.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về quan sát vật trong nước.","statements": ["a) Nhìn xiên xuống nước thấy vật như nổi lên gần mặt nước.","b) Đó là do ánh sáng từ vật bị khúc xạ tại mặt nước khi vào mắt.","c) Vị trí ta nhìn thấy là vị trí thật của vật.","d) Ta nhìn thấy ảnh ảo của vật."],"answer": ["T","T","F","T"],"explain": "Vị trí nhìn thấy là ảnh ảo, không phải vị trí thật.","points": 1},{"type": "short","level": "NB","q": "Khi tia sáng chiếu vuông góc với mặt phân cách hai môi trường trong suốt thì có xảy ra hiện tượng khúc xạ không?","answer": "Không, tia sáng truyền thẳng","explain": "Góc tới bằng 0 nên tia sáng truyền thẳng.","points": 0.5},{"type": "short","level": "TH","q": "Người trên bờ nhìn thấy cá trong nước ở vị trí thật hay vị trí ảo của cá?","answer": "Vị trí ảo","explain": "Do khúc xạ, ta chỉ thấy ảnh ảo của cá.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "TH","q": "Tia sáng truyền xiên góc từ thủy tinh ra không khí. So với tia tới, tia khúc xạ:","options": ["A. Gần pháp tuyến hơn","B. Xa pháp tuyến hơn","C. Trùng với pháp tuyến","D. Truyền thẳng"],"answer": "B","explain": "Đi từ chiết quang hơn sang kém, tia khúc xạ xa pháp tuyến hơn.","points": 0.25},{"type": "mcq","level": "VD","q": "Một bể nước sâu 1,2 m. Nhìn từ trên xuống theo phương gần thẳng đứng, đáy bể trông như ở độ sâu khoảng:","options": ["A. 1,2 m","B. Khoảng 0,9 m","C. 1,6 m","D. 2,4 m"],"answer": "B","explain": "Độ sâu biểu kiến = 1,2/1,33 = 0,9 m.","points": 0.25},{"type": "mcq","level": "TH","q": "Định luật khúc xạ ánh sáng dạng sin còn được gọi là định luật:","options": ["A. Newton","B. Snell","C. Einstein","D. Faraday"],"answer": "B","explain": "Định luật Snell (Snell-Descartes).","points": 0.25},{"type": "mcq","level": "VDC","q": "Chiếu tia laser từ không khí vào khối thủy tinh hình bán cầu (tâm tại điểm tới) với góc tới 30°. Tia khúc xạ trong thủy tinh (n = 1,5) rồi ra ngoài theo phương bán kính (không gãy khúc nữa). Góc lệch của tia ló so với tia tới xấp xỉ:","options": ["A. 0°","B. Khoảng 10,5°","C. 30°","D. 49,5°"],"answer": "B","explain": "r = 19,5°, góc lệch D = i - r = 10,5°.","points": 0.25},{"type": "mcq","level": "TH","q": "Khối thủy tinh hình bán cầu trong thí nghiệm trên có tác dụng:","options": ["A. Làm tia khúc xạ ra ngoài không bị gãy khúc lần nữa","B. Làm tăng chiết suất của thủy tinh","C. Làm giảm góc tới","D. Hấp thụ ánh sáng"],"answer": "A","explain": "Tia đi theo phương bán kính nên vuông góc mặt cong, truyền thẳng ra ngoài.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị của chiết suất là:","options": ["A. m/s","B. Không có đơn vị","C. Độ","D. Jun"],"answer": "B","explain": "Chiết suất là đại lượng không có đơn vị.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về thí nghiệm đo chiết suất.","statements": ["a) Chiết suất là đại lượng không có đơn vị.","b) Định luật khúc xạ còn gọi là định luật Snell.","c) Khối bán cầu giúp đo chiết suất chính xác.","d) Tia tới mặt cong theo phương bán kính thì không bị khúc xạ."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về chiết suất các chất.","statements": ["a) Đo được góc tới và góc khúc xạ thì tính được chiết suất.","b) Chiết suất của thủy tinh thường khoảng 1,5.","c) Chiết suất của kim cương khoảng 2,42.","d) Chiết suất không phụ thuộc vào nhiệt độ."],"answer": ["T","T","T","F"],"explain": "Chiết suất có phụ thuộc (ít) vào nhiệt độ.","points": 1},{"type": "short","level": "VD","q": "Thấu kính (kính lúp, mắt kính) hoạt động dựa trên hiện tượng nào của ánh sáng?","answer": "Khúc xạ ánh sáng","explain": "Thấu kính hoạt động dựa trên sự khúc xạ ánh sáng.","points": 0.5},{"type": "short","level": "VDC","q": "Vì sao khi nhìn xiên xuống bể bơi, đáy bể trông nông hơn thực tế?","answer": "Vì ánh sáng từ đáy bể bị khúc xạ tại mặt nước","explain": "Khúc xạ làm ta thấy ảnh ảo của đáy bể gần mặt nước hơn.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Tia tới, tia khúc xạ và pháp tuyến tại điểm tới có đặc điểm:","options": ["A. Không đồng phẳng","B. Đồng phẳng với nhau","C. Vuông góc với nhau","D. Song song với nhau"],"answer": "B","explain": "Ba đường này đồng phẳng (trong mặt phẳng tới).","points": 0.25},{"type": "mcq","level": "TH","q": "Khi ánh sáng truyền từ môi trường 1 sang môi trường 2, nếu n2 lớn hơn n1 thì:","options": ["A. Góc khúc xạ lớn hơn góc tới","B. Góc khúc xạ nhỏ hơn góc tới","C. Góc khúc xạ bằng góc tới","D. Không có tia khúc xạ"],"answer": "B","explain": "Vào môi trường chiết quang hơn, tia khúc xạ gần pháp tuyến hơn.","points": 0.25},{"type": "mcq","level": "VD","q": "Chiếu tia sáng từ không khí vào thủy tinh (n = 1,5) với góc tới 60°. Góc khúc xạ xấp xỉ:","options": ["A. 60°","B. Khoảng 35,3°","C. 90°","D. 24,7°"],"answer": "B","explain": "sin r = sin60°/1,5 = 0,577, suy ra r khoảng 35,3°.","points": 0.25},{"type": "mcq","level": "VDC","q": "Tia sáng truyền từ môi trường A sang môi trường B có góc tới 45°, góc khúc xạ 30°. Chiết suất tỉ đối của B đối với A là:","options": ["A. 0,707","B. 1,414","C. 1","D. 2"],"answer": "B","explain": "nBA = sin45°/sin30° = 0,707/0,5 = 1,414.","points": 0.25},{"type": "mcq","level": "TH","q": "Môi trường B trong ví dụ trên so với môi trường A thì:","options": ["A. Chiết quang hơn","B. Chiết quang kém hơn","C. Chiết quang bằng","D. Không so sánh được"],"answer": "A","explain": "nBA lớn hơn 1 nên B chiết quang hơn A.","points": 0.25},{"type": "mcq","level": "NB","q": "Ánh sáng Mặt Trời chiếu xiên xuống mặt nước biển thì bị:","options": ["A. Phản xạ hoàn toàn","B. Khúc xạ khi đi vào nước","C. Hấp thụ hoàn toàn","D. Tán sắc thành cầu vồng"],"answer": "B","explain": "Ánh sáng bị khúc xạ khi truyền từ không khí vào nước.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về định luật khúc xạ.","statements": ["a) Tia tới, tia khúc xạ và pháp tuyến đồng phẳng.","b) Môi trường 2 chiết quang hơn môi trường 1 thì góc khúc xạ nhỏ hơn góc tới.","c) Ánh sáng đi vào nước bị khúc xạ.","d) Khúc xạ làm thay đổi màu sắc của ánh sáng."],"answer": ["T","T","T","F"],"explain": "Khúc xạ không làm thay đổi màu sắc ánh sáng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về tính toán khúc xạ.","statements": ["a) Đo được góc tới và góc khúc xạ thì tính được chiết suất tỉ đối.","b) Môi trường chiết quang hơn có chiết suất lớn hơn.","c) Khi góc tới tăng thì góc khúc xạ giảm.","d) Ánh sáng luôn đi chậm lại khi vào môi trường chiết quang hơn."],"answer": ["T","T","F","T"],"explain": "Góc tới tăng thì góc khúc xạ cũng tăng.","points": 1},{"type": "short","level": "NB","q": "Tia tới, tia khúc xạ và pháp tuyến tại điểm tới như thế nào với nhau?","answer": "Đồng phẳng","explain": "Cả ba đều nằm trong mặt phẳng tới.","points": 0.5},{"type": "short","level": "TH","q": "Khi ánh sáng truyền từ không khí vào một môi trường chiết quang hơn, vận tốc ánh sáng tăng hay giảm?","answer": "Giảm","explain": "Môi trường chiết quang hơn làm ánh sáng truyền chậm hơn.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Hiện tượng nào sau đây KHÔNG phải do khúc xạ ánh sáng?","options": ["A. Chiếc đũa nhúng nước trông như bị gãy","B. Ảnh của cái cây trong gương phẳng","C. Đáy bể nước trông nông hơn thực tế","D. Chiếc thìa trong cốc nước trông to hơn"],"answer": "B","explain": "Ảnh trong gương phẳng là do phản xạ.","points": 0.25},{"type": "mcq","level": "TH","q": "Kính lúp làm cho vật trông to hơn là dựa trên hiện tượng:","options": ["A. Phản xạ ánh sáng","B. Khúc xạ ánh sáng","C. Tán sắc ánh sáng","D. Giao thoa ánh sáng"],"answer": "B","explain": "Thấu kính của kính lúp hoạt động nhờ khúc xạ.","points": 0.25},{"type": "mcq","level": "VD","q": "Chiếu tia sáng từ nước (n = 4/3) ra không khí với góc tới 45°. Góc khúc xạ xấp xỉ:","options": ["A. 45°","B. Khoảng 70,5°","C. 32°","D. 90°"],"answer": "B","explain": "sin r = (4/3).sin45° = 0,943, suy ra r khoảng 70,5°.","points": 0.25},{"type": "mcq","level": "VDC","q": "Nếu góc tới trong ví dụ trên tăng lên 50° thì hiện tượng gì sẽ xảy ra?","options": ["A. Khúc xạ bình thường","B. Phản xạ toàn phần","C. Tia sáng biến mất","D. Tán sắc ánh sáng"],"answer": "B","explain": "sin r = (4/3).sin50° = 1,021 (lớn hơn 1): không có tia khúc xạ, xảy ra phản xạ toàn phần.","points": 0.25},{"type": "mcq","level": "TH","q": "Điều kiện về góc tới để xảy ra phản xạ toàn phần khi ánh sáng truyền từ nước ra không khí là:","options": ["A. Nhỏ hơn góc giới hạn","B. Lớn hơn hoặc bằng góc giới hạn","C. Bằng 0","D. Bằng 90°"],"answer": "B","explain": "Cần i ≥ igh.","points": 0.25},{"type": "mcq","level": "NB","q": "Góc giới hạn phản xạ toàn phần khi ánh sáng truyền từ nước ra không khí xấp xỉ:","options": ["A. 41,8°","B. 48,6°","C. 90°","D. 30°"],"answer": "B","explain": "sin igh = 3/4, suy ra igh khoảng 48,6°.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về các hiện tượng quang học.","statements": ["a) Ảnh trong gương phẳng là do phản xạ, không phải khúc xạ.","b) Kính lúp hoạt động dựa trên hiện tượng khúc xạ.","c) Mắt người nhìn vật nhờ thể thủy tinh khúc xạ ánh sáng.","d) Bóng của vật trên sân là do khúc xạ ánh sáng."],"answer": ["T","T","T","F"],"explain": "Bóng của vật là do ánh sáng truyền thẳng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về phản xạ toàn phần.","statements": ["a) Khi góc tới đủ lớn, tia sáng từ nước ra không khí bị phản xạ toàn phần.","b) Phản xạ toàn phần chỉ xảy ra khi đi từ môi trường chiết quang hơn sang kém.","c) Cáp quang truyền tín hiệu nhờ phản xạ toàn phần.","d) Khúc xạ và phản xạ toàn phần là hai hiện tượng hoàn toàn giống nhau."],"answer": ["T","T","T","F"],"explain": "Đó là hai hiện tượng khác nhau.","points": 1},{"type": "short","level": "NB","q": "Hiện tượng nào giúp cáp quang truyền được tín hiệu ánh sáng đi xa?","answer": "Phản xạ toàn phần","explain": "Cáp quang dẫn sáng nhờ phản xạ toàn phần liên tiếp.","points": 0.5},{"type": "short","level": "TH","q": "Khi ánh sáng truyền từ nước ra không khí với góc tới lớn hơn góc giới hạn thì xảy ra hiện tượng gì?","answer": "Phản xạ toàn phần","explain": "Vượt quá góc giới hạn thì xảy ra phản xạ toàn phần.","points": 0.5}]}]}
