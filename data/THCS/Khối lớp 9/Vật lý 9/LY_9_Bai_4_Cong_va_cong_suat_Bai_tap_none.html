<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Công thức tính công cơ học khi lực F làm vật chuyển dời quãng đường s theo phương của lực là:","options": ["A. A = F.s","B. A = F/s","C. A = F + s","D. A = P.t"],"answer": "A","explain": "Công cơ học: A = F.s.","points": 0.25},{"type": "mcq","level": "TH","q": "Đơn vị đo công cơ học là:","options": ["A. Oát (W)","B. Jun (J)","C. Niutơn (N)","D. Mét (m)"],"answer": "B","explain": "Công đo bằng jun (J).","points": 0.25},{"type": "mcq","level": "VD","q": "Một lực 20 N kéo vật chuyển dời 5 m theo phương của lực. Công của lực là:","options": ["A. 100 J","B. 25 J","C. 4 J","D. 15 J"],"answer": "A","explain": "A = 20.5 = 100 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Kéo một vật với lực 50 N đi được 12 m trong 30 s. Công suất của lực kéo là:","options": ["A. 20 W","B. 600 W","C. 1800 W","D. 2,5 W"],"answer": "A","explain": "A = 600 J; P = 600/30 = 20 W.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị đo công suất là:","options": ["A. Jun (J)","B. Oát (W)","C. Niutơn (N)","D. Mét (m)"],"answer": "B","explain": "Công suất đo bằng oát (W).","points": 0.25},{"type": "mcq","level": "TH","q": "1 kW bằng bao nhiêu oát?","options": ["A. 100 W","B. 1000 W","C. 10 W","D. 1 W"],"answer": "B","explain": "1 kW = 1000 W.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về công và công suất.","statements": ["a) Công cơ học tính bằng A = F.s.","b) Đơn vị của công là jun.","c) Công suất tính bằng P = A/t.","d) Đơn vị của công suất là oát."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về công suất.","statements": ["a) 1 kW = 1000 W.","b) 1 MW = 1 000 000 W.","c) Công suất càng lớn thì thực hiện công càng nhanh.","d) Hai máy cùng thực hiện một công, máy nào xong nhanh hơn thì công suất lớn hơn."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Công cơ học được tính bằng tích của những đại lượng nào?","answer": "Lực tác dụng và quãng đường chuyển dời","explain": "A = F.s: tích của lực tác dụng và quãng đường chuyển dời theo phương của lực.","points": 0.5},{"type": "short","level": "TH","q": "Một lực 10 N kéo vật đi 3 m theo phương của lực. Công của lực là bao nhiêu jun?","answer": "30","explain": "A = 10.3 = 30 J.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "TH","q": "Trường hợp nào sau đây CÓ công cơ học?","options": ["A. Người đứng giữ bao gạo trên vai","B. Người kéo xe chuyển động trên đường","C. Học sinh ngồi học bài","D. Tảng đá nằm yên trên mặt đất"],"answer": "B","explain": "Kéo xe: có lực tác dụng và xe chuyển dời theo phương của lực.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi lực tác dụng vuông góc với phương chuyển dời thì công của lực:","options": ["A. Cực đại","B. Bằng 0","C. Có giá trị âm","D. Không xác định được"],"answer": "B","explain": "Lực vuông góc phương chuyển dời không sinh công.","points": 0.25},{"type": "mcq","level": "VD","q": "Người xách vali nặng 100 N đi ngang 20 m (lực nâng vuông góc phương chuyển động). Công của lực nâng là:","options": ["A. 2000 J","B. 0 J","C. 120 J","D. 80 J"],"answer": "B","explain": "Lực nâng vuông góc phương chuyển dời nên công bằng 0.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một con ngựa kéo xe với lực 300 N đi được 2 km trong 10 phút. Công suất của ngựa là:","options": ["A. 100 W","B. 1000 W","C. 60 W","D. 6000 W"],"answer": "B","explain": "A = 300.2000 = 600 000 J; t = 600 s; P = 1000 W.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi vật chuyển động đều với vận tốc v dưới tác dụng của lực F cùng phương chuyển động, công suất được tính bằng:","options": ["A. P = F.v","B. P = F/v","C. P = A.s","D. P = F + v"],"answer": "A","explain": "P = A/t = F.s/t = F.v.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong công thức P = F.v, v là:","options": ["A. Vận tốc của vật","B. Thể tích của vật","C. Hiệu điện thế","D. Thời gian"],"answer": "A","explain": "v là vận tốc của vật (m/s).","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về công cơ học.","statements": ["a) Người kéo xe đang chuyển động sinh công cơ học.","b) Người đứng giữ vật nặng không sinh công cơ học.","c) Lực vuông góc với phương chuyển dời không sinh công.","d) Vật chuyển động theo quán tính (không có lực tác dụng) thì không có công cơ học."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định sau.","statements": ["a) Xách cặp đi ngang, lực nâng của tay không sinh công.","b) Quả táo rơi, trọng lực sinh công.","c) Vệ tinh chuyển động tròn quanh Trái Đất, trọng lực không sinh công.","d) Đẩy bức tường không nhúc nhích thì có công cơ học."],"answer": ["T","T","T","F"],"explain": "Tường không chuyển dời nên không có công cơ học.","points": 1},{"type": "short","level": "NB","q": "Vì sao người đứng giữ bao gạo trên vai không sinh công cơ học?","answer": "Vì bao gạo không chuyển dời","explain": "Không có chuyển dời nên không có công cơ học dù có lực tác dụng.","points": 0.5},{"type": "short","level": "TH","q": "Một đầu tàu kéo đoàn tàu với lực 5000 N, đoàn tàu đi được 100 m. Công của lực kéo là bao nhiêu kilôjun?","answer": "500","explain": "A = 5000.100 = 500 000 J = 500 kJ.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Công cơ học bằng 0 trong trường hợp nào sau đây?","options": ["A. Lực tác dụng nhưng vật không chuyển dời","B. Lực cùng phương, cùng chiều chuyển dời","C. Vật chuyển động rất nhanh","D. Lực tác dụng rất lớn"],"answer": "A","explain": "Vật không chuyển dời (s = 0) nên A = 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Dùng sức đẩy chiếc tủ nhưng tủ không nhúc nhích. Kết luận nào đúng?","options": ["A. Có công vì đã tốn sức","B. Không có công cơ học","C. Công rất lớn","D. Công có giá trị âm"],"answer": "B","explain": "Tủ không chuyển dời nên không có công cơ học.","points": 0.25},{"type": "mcq","level": "VD","q": "Một máy nâng vật nặng 1000 N lên cao 5 m trong 20 s. Công suất của máy là:","options": ["A. 250 W","B. 100 W","C. 5000 W","D. 25 W"],"answer": "A","explain": "A = 5000 J; P = 5000/20 = 250 W.","points": 0.25},{"type": "mcq","level": "VDC","q": "Người A thực hiện công 600 J trong 30 s, người B thực hiện công 600 J trong 20 s. Ai có công suất lớn hơn?","options": ["A. Người A","B. Người B","C. Hai người bằng nhau","D. Không so sánh được"],"answer": "B","explain": "PA = 20 W, PB = 30 W. Người B xong nhanh hơn nên công suất lớn hơn.","points": 0.25},{"type": "mcq","level": "TH","q": "Công suất cho biết điều gì?","options": ["A. Lực mạnh hay yếu","B. Thực hiện công nhanh hay chậm","C. Quãng đường dài hay ngắn","D. Vật nặng hay nhẹ"],"answer": "B","explain": "Công suất đặc trưng cho tốc độ thực hiện công.","points": 0.25},{"type": "mcq","level": "NB","q": "Kí hiệu của công suất là:","options": ["A. A","B. P","C. F","D. W"],"answer": "B","explain": "Công suất kí hiệu là P.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về công suất.","statements": ["a) Công suất kí hiệu là P.","b) Công suất tính bằng P = A/t.","c) Máy có công suất lớn thực hiện công nhanh hơn.","d) Đơn vị của công suất là jun."],"answer": ["T","T","T","F"],"explain": "Đơn vị công suất là oát, không phải jun.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về công suất.","statements": ["a) Cùng một công, thời gian càng ngắn thì công suất càng lớn.","b) Cùng thời gian, công càng lớn thì công suất càng lớn.","c) Công suất 100 W nghĩa là mỗi giây thực hiện 100 J công.","d) Công suất càng lớn thì lực tác dụng càng lớn."],"answer": ["T","T","T","F"],"explain": "Công suất còn phụ thuộc vận tốc (P = F.v), không chỉ phụ thuộc lực.","points": 1},{"type": "short","level": "NB","q": "Máy nào thực hiện công nhanh hơn: máy có công suất 500 W hay máy có công suất 300 W?","answer": "Máy có công suất 500 W","explain": "Công suất lớn hơn thì thực hiện công nhanh hơn.","points": 0.5},{"type": "short","level": "TH","q": "Một máy thực hiện công 1200 J trong 1 phút. Công suất của máy là bao nhiêu oát?","answer": "20","explain": "t = 60 s; P = 1200/60 = 20 W.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "VD","q": "Một người kéo gàu nước trọng lượng 20 N lên cao 6 m. Công của người là:","options": ["A. 120 J","B. 26 J","C. 14 J","D. 3,3 J"],"answer": "A","explain": "A = 20.6 = 120 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một ô tô chuyển động đều với vận tốc 20 m/s, lực kéo của động cơ là 800 N. Công suất của động cơ là:","options": ["A. 40 W","B. 1600 W","C. 16 000 W","D. 160 000 W"],"answer": "C","explain": "P = F.v = 800.20 = 16 000 W.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong công thức P = F.v, v phải được tính bằng đơn vị:","options": ["A. km/h","B. m/s","C. m/phút","D. km/phút"],"answer": "B","explain": "Trong hệ SI, vận tốc tính bằng m/s.","points": 0.25},{"type": "mcq","level": "TH","q": "Ô tô chuyển động đều, lực kéo cân bằng với lực cản. Công suất của động cơ vẫn được tính bằng:","options": ["A. P = F.v","B. P = 0","C. P = F/v","D. P = F + v"],"answer": "A","explain": "Dù lực kéo cân bằng lực cản, động cơ vẫn sinh công nên P = F.v.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi vận tốc tăng gấp đôi (lực kéo không đổi) thì công suất:","options": ["A. Không thay đổi","B. Tăng gấp đôi","C. Giảm một nửa","D. Tăng 4 lần"],"answer": "B","explain": "P = F.v nên v tăng gấp đôi thì P tăng gấp đôi.","points": 0.25},{"type": "mcq","level": "NB","q": "1 mã lực (HP) xấp xỉ bằng:","options": ["A. 736 W","B. 100 W","C. 1000 W","D. 1 W"],"answer": "A","explain": "1 HP tương đương khoảng 736 W.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về công thức P = F.v.","statements": ["a) Công thức P = F.v đúng khi lực cùng phương với vận tốc.","b) Ô tô chạy càng nhanh (cùng lực kéo) thì công suất càng lớn.","c) Công suất động cơ ô tô thường được tính bằng mã lực.","d) 1 HP = 736 W."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về ô tô.","statements": ["a) Hai ô tô cùng công suất, ô tô nào chạy nhanh hơn thì lực kéo nhỏ hơn.","b) Khi leo dốc cần lực kéo lớn nên phải giảm tốc độ (với cùng công suất).","c) Xe tải nặng cần động cơ có công suất lớn.","d) Công suất càng lớn thì vận tốc càng lớn trong mọi trường hợp."],"answer": ["T","T","T","F"],"explain": "Vận tốc còn phụ thuộc lực kéo (v = P/F).","points": 1},{"type": "short","level": "VD","q": "Một động cơ có công suất 2000 W kéo vật chuyển động đều với vận tốc 5 m/s. Lực kéo của động cơ là bao nhiêu niutơn?","answer": "400","explain": "F = P/v = 2000/5 = 400 N.","points": 0.5},{"type": "short","level": "VDC","q": "Một thác nước cao 20 m, mỗi giây có 500 kg nước chảy xuống (g = 10 m/s^2). Công suất của thác nước là bao nhiêu kilôoát?","answer": "100","explain": "P = m.g.h/t = 500.10.20 = 100 000 W = 100 kW.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Công phát động là công của:","options": ["A. Lực cản","B. Lực cùng chiều chuyển động","C. Lực vuông góc phương chuyển động","D. Trọng lực khi vật đi lên"],"answer": "B","explain": "Lực cùng chiều chuyển động sinh công phát động.","points": 0.25},{"type": "mcq","level": "TH","q": "Công cản là công của:","options": ["A. Lực cùng chiều chuyển động","B. Lực ngược chiều chuyển động","C. Lực vuông góc phương chuyển động","D. Lực hấp dẫn"],"answer": "B","explain": "Lực ngược chiều chuyển động (như ma sát) sinh công cản.","points": 0.25},{"type": "mcq","level": "VD","q": "Vật trượt trên mặt sàn, lực ma sát 15 N, quãng đường 4 m. Công của lực ma sát là:","options": ["A. 60 J","B. -60 J (công cản)","C. 0 J","D. 19 J"],"answer": "B","explain": "Ma sát ngược chiều chuyển động nên công cản: A = -15.4 = -60 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Kéo vật nặng 200 N lên cao 3 m bằng mặt phẳng nghiêng dài 6 m với lực kéo 120 N (có ma sát). Công có ích và công toàn phần lần lượt là:","options": ["A. 600 J và 720 J","B. 720 J và 600 J","C. 600 J và 600 J","D. 120 J và 200 J"],"answer": "A","explain": "Aci = 200.3 = 600 J; Atp = 120.6 = 720 J.","points": 0.25},{"type": "mcq","level": "TH","q": "Hiệu suất của mặt phẳng nghiêng trong ví dụ trên là:","options": ["A. Khoảng 83,3%","B. 120%","C. 100%","D. 20%"],"answer": "A","explain": "H = 600/720 = 83,3%.","points": 0.25},{"type": "mcq","level": "NB","q": "Công có ích khi dùng mặt phẳng nghiêng kéo vật lên cao là:","options": ["A. Công của lực ma sát","B. Công nâng vật lên trực tiếp theo phương thẳng đứng","C. Tổng công của lực kéo","D. Công vô ích"],"answer": "B","explain": "Công có ích là công nâng vật lên trực tiếp: Aci = P.h.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về công phát động và công cản.","statements": ["a) Công phát động là công của lực cùng chiều chuyển động.","b) Công cản là công của lực ngược chiều chuyển động.","c) Lực ma sát sinh công cản khi vật trượt.","d) Công cản luôn có giá trị dương."],"answer": ["T","T","T","F"],"explain": "Công cản có giá trị âm.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về mặt phẳng nghiêng.","statements": ["a) Dùng mặt phẳng nghiêng được lợi về lực.","b) Dùng mặt phẳng nghiêng không được lợi về công.","c) Hiệu suất của mặt phẳng nghiêng luôn nhỏ hơn 100%.","d) Mặt phẳng nghiêng càng dài thì lực kéo càng nhỏ."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Công của lực ma sát khi vật trượt được gọi là công gì?","answer": "Công cản","explain": "Lực ma sát ngược chiều chuyển động nên sinh công cản.","points": 0.5},{"type": "short","level": "TH","q": "Vì sao dùng mặt phẳng nghiêng không được lợi về công?","answer": "Vì quãng đường kéo dài hơn","explain": "Được lợi về lực bao nhiêu thì thiệt về đường đi bấy nhiêu.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "TH","q": "Một người dùng ròng rọc kéo vật nặng 300 N lên cao 4 m (bỏ qua ma sát). Công của người là:","options": ["A. 1200 J","B. 304 J","C. 296 J","D. 75 J"],"answer": "A","explain": "A = 300.4 = 1200 J.","points": 0.25},{"type": "mcq","level": "VD","q": "Dùng ròng rọc động được lợi 2 lần về lực thì thiệt mấy lần về đường đi?","options": ["A. 1 lần","B. 2 lần","C. 4 lần","D. Không thiệt về đường đi"],"answer": "B","explain": "Được lợi 2 lần về lực thì thiệt 2 lần về đường đi.","points": 0.25},{"type": "mcq","level": "NB","q": "Định luật về công phát biểu: không một máy cơ đơn giản nào cho lợi về:","options": ["A. Lực","B. Công","C. Đường đi","D. Thời gian"],"answer": "B","explain": "Đó chính là nội dung định luật về công.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một máy cơ có hiệu suất 90%, công có ích là 900 J. Công toàn phần mà máy tiêu thụ là:","options": ["A. 810 J","B. 900 J","C. 1000 J","D. 990 J"],"answer": "C","explain": "Atp = Aci/H = 900/0,9 = 1000 J.","points": 0.25},{"type": "mcq","level": "TH","q": "Công hao phí trong các máy cơ chủ yếu là do:","options": ["A. Trọng lượng của vật","B. Ma sát","C. Lực kéo quá lớn","D. Thời gian dài"],"answer": "B","explain": "Ma sát sinh công hao phí (thành nhiệt năng).","points": 0.25},{"type": "mcq","level": "NB","q": "Ròng rọc cố định giúp ta được lợi về:","options": ["A. Lực","B. Hướng của lực kéo","C. Công","D. Đường đi"],"answer": "B","explain": "Ròng rọc cố định chỉ đổi hướng lực kéo, không lợi về lực.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về máy cơ đơn giản.","statements": ["a) Không một máy cơ đơn giản nào cho lợi về công.","b) Được lợi về lực thì thiệt về đường đi.","c) Ròng rọc động cho lợi 2 lần về lực.","d) Dùng máy cơ luôn đạt hiệu suất 100%."],"answer": ["T","T","T","F"],"explain": "Do ma sát nên hiệu suất luôn nhỏ hơn 100%.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về máy cơ đơn giản.","statements": ["a) Đòn bẩy cho lợi về lực nhưng thiệt về đường đi.","b) Mặt phẳng nghiêng dài gấp 3 lần độ cao thì lực kéo nhỏ hơn 3 lần (bỏ qua ma sát).","c) Hiệu suất bằng tỉ số giữa công có ích và công toàn phần.","d) Công toàn phần luôn lớn hơn công có ích."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Phát biểu định luật về công đối với máy cơ đơn giản.","answer": "Không một máy cơ đơn giản nào cho lợi về công","explain": "Đó là nội dung định luật về công.","points": 0.5},{"type": "short","level": "VDC","q": "Một máy nâng có công suất 500 W, hiệu suất 80%. Trong 10 s, máy thực hiện công có ích là bao nhiêu jun?","answer": "4000","explain": "Atp = 500.10 = 5000 J; Aci = 5000.80% = 4000 J.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Trong các đơn vị sau, đơn vị nào là đơn vị của công suất?","options": ["A. Jun (J)","B. Oát (W)","C. Niutơn (N)","D. Kilôgam (kg)"],"answer": "B","explain": "Công suất đo bằng oát.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong các đơn vị sau, đơn vị nào KHÔNG phải đơn vị của công?","options": ["A. Jun (J)","B. Kilôjun (kJ)","C. Oát (W)","D. Calo"],"answer": "C","explain": "Oát là đơn vị công suất, không phải đơn vị công.","points": 0.25},{"type": "mcq","level": "VD","q": "Một bóng đèn 60 W sáng trong 2 giờ. Điện năng mà đèn tiêu thụ là:","options": ["A. 120 J","B. 432 000 J","C. 7200 J","D. 30 J"],"answer": "B","explain": "A = P.t = 60.7200 = 432 000 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một máy bơm có công suất 2 kW bơm nước trong 30 phút. Công mà máy thực hiện là:","options": ["A. 60 000 J","B. 3 600 000 J","C. 1000 J","D. 360 J"],"answer": "B","explain": "A = 2000.1800 = 3 600 000 J.","points": 0.25},{"type": "mcq","level": "TH","q": "Công thức liên hệ giữa công, công suất và thời gian là:","options": ["A. A = P.t","B. A = P/t","C. A = P + t","D. A = t/P"],"answer": "A","explain": "Từ P = A/t suy ra A = P.t.","points": 0.25},{"type": "mcq","level": "NB","q": "2 kW bằng bao nhiêu oát?","options": ["A. 200 W","B. 2000 W","C. 20 W","D. 2 W"],"answer": "B","explain": "2 kW = 2000 W.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về công suất.","statements": ["a) Công có thể tính bằng A = P.t.","b) 2 kW = 2000 W.","c) Bóng đèn 60 W mỗi giây tiêu thụ 60 J điện năng.","d) Công suất càng lớn, trong cùng thời gian thực hiện công càng nhiều."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về sử dụng thiết bị điện.","statements": ["a) Máy bơm 2 kW chạy 1 giờ thực hiện 7 200 000 J công.","b) Khi tính công từ công suất (oát), thời gian phải đổi ra giây.","c) Công suất định mức ghi trên thiết bị là công suất hoạt động an toàn.","d) Dùng quá công suất định mức có thể gây quá tải, cháy nổ."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Trên bóng đèn ghi 60 W, con số 60 W cho biết điều gì?","answer": "Công suất của bóng đèn","explain": "Số oát ghi trên thiết bị cho biết công suất của nó.","points": 0.5},{"type": "short","level": "TH","q": "Một thiết bị có công suất 100 W hoạt động trong 5 phút. Công mà thiết bị thực hiện là bao nhiêu jun?","answer": "30000","explain": "A = 100.300 = 30 000 J.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "TH","q": "Một cần cẩu nâng kiện hàng 2000 N lên cao 10 m trong 25 s. Công suất của cần cẩu là:","options": ["A. 800 W","B. 500 W","C. 2000 W","D. 80 W"],"answer": "A","explain": "A = 20 000 J; P = 20 000/25 = 800 W.","points": 0.25},{"type": "mcq","level": "VD","q": "Một người đi xe đạp tạo ra công suất 150 W, xe chuyển động đều với vận tốc 5 m/s. Lực đẩy của người là:","options": ["A. 750 N","B. 30 N","C. 155 N","D. 145 N"],"answer": "B","explain": "F = P/v = 150/5 = 30 N.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi đi xe đạp lên dốc, để đỡ mệt người ta thường:","options": ["A. Phóng thật nhanh lên dốc","B. Về số nhỏ, đi chậm để lực đạp lớn hơn","C. Thả trôi xe","D. Dừng lại nghỉ"],"answer": "B","explain": "Cùng công suất, đi chậm thì lực đạp lớn hơn (P = F.v).","points": 0.25},{"type": "mcq","level": "VDC","q": "Một ô tô có công suất động cơ 75 kW. Khi chạy với vận tốc 25 m/s, lực kéo của động cơ là:","options": ["A. 3000 N","B. 1875 N","C. 300 N","D. 1875000 N"],"answer": "A","explain": "F = P/v = 75 000/25 = 3000 N.","points": 0.25},{"type": "mcq","level": "TH","q": "Công suất động cơ ô tô càng lớn thì:","options": ["A. Xe càng nặng","B. Khả năng tăng tốc và leo dốc càng tốt","C. Xe càng dài","D. Xe càng rộng"],"answer": "B","explain": "Công suất lớn cho lực kéo lớn ở cùng vận tốc.","points": 0.25},{"type": "mcq","level": "NB","q": "Công tơ điện (đồng hồ đo điện năng) đo đại lượng nào?","options": ["A. Công suất","B. Công (điện năng tiêu thụ)","C. Cường độ dòng điện","D. Hiệu điện thế"],"answer": "B","explain": "Công tơ điện đo điện năng tiêu thụ (số kWh).","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về công suất trong thực tế.","statements": ["a) Cần cẩu nâng hàng càng nhanh thì công suất càng lớn.","b) Công thức P = A/t dùng được cho mọi loại máy.","c) Đi xe đạp lên dốc nên về số nhỏ để tăng lực đạp.","d) Công suất 1 W tương đương 1 J/s."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về ô tô.","statements": ["a) Hai ô tô cùng công suất, ô tô nào chạy nhanh hơn thì lực kéo nhỏ hơn.","b) Tàu hỏa cần lực kéo lớn nên công suất động cơ rất lớn.","c) Công suất cho biết khả năng thực hiện công nhanh hay chậm.","d) Hai xe cùng công suất thì luôn chạy nhanh như nhau."],"answer": ["T","T","T","F"],"explain": "Vận tốc còn phụ thuộc vào lực cản và tải trọng.","points": 1},{"type": "short","level": "VD","q": "Một cần cẩu thực hiện công 40 000 J trong 20 s. Công suất của cần cẩu là bao nhiêu kilôoát?","answer": "2","explain": "P = 40 000/20 = 2000 W = 2 kW.","points": 0.5},{"type": "short","level": "VDC","q": "Một xe tải có công suất động cơ 120 kW, chuyển động đều với vận tốc 20 m/s. Lực kéo của động cơ là bao nhiêu niutơn?","answer": "6000","explain": "F = 120 000/20 = 6000 N.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Khi dùng ròng rọc cố định kéo vật lên cao (bỏ qua ma sát), lực kéo ít nhất bằng:","options": ["A. Trọng lượng của vật","B. Một nửa trọng lượng của vật","C. Gấp đôi trọng lượng của vật","D. Không phụ thuộc trọng lượng"],"answer": "A","explain": "Ròng rọc cố định không lợi về lực nên F = P.","points": 0.25},{"type": "mcq","level": "TH","q": "Dùng ròng rọc động kéo vật nặng 100 N lên cao (bỏ qua ma sát và khối lượng ròng rọc), lực kéo dây là:","options": ["A. 100 N","B. 50 N","C. 200 N","D. 25 N"],"answer": "B","explain": "Ròng rọc động cho lợi 2 lần về lực: F = P/2 = 50 N.","points": 0.25},{"type": "mcq","level": "VD","q": "Kéo vật bằng ròng rọc động lên cao 2 m, đầu dây tự do phải kéo một quãng đường là:","options": ["A. 1 m","B. 2 m","C. 4 m","D. 0,5 m"],"answer": "C","explain": "Thiệt 2 lần về đường đi: s = 2.h = 4 m.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một palăng có 2 ròng rọc động nâng vật nặng 800 N (bỏ qua ma sát). Lực kéo dây là:","options": ["A. 800 N","B. 400 N","C. 200 N","D. 1600 N"],"answer": "C","explain": "Lợi 4 lần về lực: F = 800/4 = 200 N.","points": 0.25},{"type": "mcq","level": "TH","q": "Palăng gồm những bộ phận nào?","options": ["A. Chỉ có ròng rọc cố định","B. Ròng rọc cố định và ròng rọc động","C. Chỉ có ròng rọc động","D. Đòn bẩy và mặt phẳng nghiêng"],"answer": "B","explain": "Palăng kết hợp cả ròng rọc cố định và ròng rọc động.","points": 0.25},{"type": "mcq","level": "NB","q": "Ròng rọc động giúp ta:","options": ["A. Đổi hướng của lực kéo","B. Lợi 2 lần về lực","C. Lợi về công","D. Giảm ma sát"],"answer": "B","explain": "Ròng rọc động cho lợi 2 lần về lực, thiệt 2 lần về đường đi.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về ròng rọc.","statements": ["a) Ròng rọc cố định chỉ đổi hướng của lực kéo.","b) Ròng rọc động cho lợi 2 lần về lực.","c) Dùng ròng rọc động phải kéo dây dài gấp đôi độ cao cần nâng.","d) Palăng kết hợp cả hai loại ròng rọc."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về palăng (bỏ qua ma sát).","statements": ["a) Palăng có n ròng rọc động cho lợi 2n lần về lực.","b) Được lợi về lực thì thiệt về đường đi.","c) Dùng palăng không được lợi về công.","d) Trong thực tế, hiệu suất của palăng nhỏ hơn 100% do ma sát."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Ròng rọc được gắn cố định vào xà nhà được gọi là ròng rọc gì?","answer": "Ròng rọc cố định","explain": "Ròng rọc gắn cố định gọi là ròng rọc cố định.","points": 0.5},{"type": "short","level": "TH","q": "Dùng một ròng rọc động kéo vật nặng 60 N lên cao (bỏ qua ma sát). Lực kéo dây là bao nhiêu niutơn?","answer": "30","explain": "F = P/2 = 30 N.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Công thức tính công suất là:","options": ["A. P = A.t","B. P = A/t","C. P = F.s","D. P = m.v"],"answer": "B","explain": "Công suất: P = A/t.","points": 0.25},{"type": "mcq","level": "TH","q": "Đại lượng nào đặc trưng cho tốc độ thực hiện công?","options": ["A. Công","B. Công suất","C. Lực","D. Năng lượng"],"answer": "B","explain": "Công suất đặc trưng cho tốc độ thực hiện công.","points": 0.25},{"type": "mcq","level": "VD","q": "Một máy kéo thực hiện công 36 000 J trong 2 phút. Công suất của máy là:","options": ["A. 18 000 W","B. 300 W","C. 72 000 W","D. 18 W"],"answer": "B","explain": "t = 120 s; P = 36 000/120 = 300 W.","points": 0.25},{"type": "mcq","level": "VDC","q": "Máy A thực hiện 5000 J trong 25 s; máy B thực hiện 6000 J trong 40 s. So sánh công suất hai máy:","options": ["A. Công suất máy A lớn hơn máy B","B. Công suất máy B lớn hơn máy A","C. Công suất hai máy bằng nhau","D. Không so sánh được"],"answer": "A","explain": "PA = 200 W, PB = 150 W.","points": 0.25},{"type": "mcq","level": "TH","q": "Muốn tăng công suất của máy, có thể:","options": ["A. Giảm công thực hiện trong cùng thời gian","B. Tăng công trong cùng thời gian hoặc rút ngắn thời gian","C. Tăng thời gian thực hiện công","D. Giảm lực tác dụng"],"answer": "B","explain": "P = A/t nên tăng A hoặc giảm t đều tăng P.","points": 0.25},{"type": "mcq","level": "NB","q": "Oát là đơn vị của:","options": ["A. Công","B. Công suất","C. Lực","D. Năng lượng"],"answer": "B","explain": "Oát (W) là đơn vị công suất.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về công suất.","statements": ["a) Công suất tính bằng P = A/t.","b) Đơn vị của công suất là oát (W).","c) 1 W = 1 J/s.","d) Công suất càng lớn thì máy càng khỏe."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về công suất.","statements": ["a) Muốn tăng công suất, có thể rút ngắn thời gian thực hiện công.","b) Hai máy cùng công suất thì thực hiện công nhanh như nhau.","c) Công suất tỉ lệ thuận với công thực hiện trong cùng thời gian.","d) Công suất tỉ lệ nghịch với thời gian khi thực hiện cùng một công."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Một oát (1 W) bằng bao nhiêu jun trên giây?","answer": "1","explain": "1 W = 1 J/s.","points": 0.5},{"type": "short","level": "TH","q": "Một động cơ thực hiện công 9000 J trong 30 s. Công suất của động cơ là bao nhiêu oát?","answer": "300","explain": "P = 9000/30 = 300 W.","points": 0.5}]}]}
