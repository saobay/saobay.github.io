{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Trong đoạn mạch gồm hai điện trở mắc nối tiếp, cường độ dòng điện:","options": ["A. Có cường độ như nhau tại mọi điểm (I = I1 = I2)","B. Bằng tổng các cường độ thành phần","C. Tỉ lệ thuận với điện trở","D. Bằng 0"],"answer": "A","explain": "Mạch nối tiếp: dòng điện như nhau tại mọi điểm.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong đoạn mạch nối tiếp, hiệu điện thế giữa hai đầu đoạn mạch:","options": ["A. Bằng tổng các hiệu điện thế thành phần (U = U1 + U2)","B. Bằng nhau trên mỗi điện trở","C. Bằng 0","D. Không xác định"],"answer": "A","explain": "U = U1 + U2.","points": 0.25},{"type": "mcq","level": "VD","q": "Hai điện trở R1 = 10 Ω, R2 = 20 Ω mắc nối tiếp. Điện trở tương đương là:","options": ["A. 30 Ω","B. 6,67 Ω","C. 200 Ω","D. 15 Ω"],"answer": "A","explain": "R = 10 + 20 = 30 Ω.","points": 0.25},{"type": "mcq","level": "VDC","q": "Đặt hiệu điện thế 12 V vào hai đầu đoạn mạch trên. Cường độ dòng điện trong mạch là:","options": ["A. 0,4 A","B. 1,2 A","C. 0,6 A","D. 12 A"],"answer": "A","explain": "I = 12/30 = 0,4 A.","points": 0.25},{"type": "mcq","level": "NB","q": "Điện trở tương đương của đoạn mạch gồm hai điện trở mắc nối tiếp là:","options": ["A. R = R1 + R2","B. 1/R = 1/R1 + 1/R2","C. R = R1.R2","D. R = R1 - R2"],"answer": "A","explain": "Nối tiếp: R = R1 + R2.","points": 0.25},{"type": "mcq","level": "TH","q": "Hiệu điện thế giữa hai đầu R1 trong ví dụ trên là:","options": ["A. 4 V","B. 8 V","C. 12 V","D. 0,4 V"],"answer": "A","explain": "U1 = I.R1 = 0,4.10 = 4 V.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về đoạn mạch nối tiếp.","statements": ["a) Cường độ dòng điện như nhau tại mọi điểm.","b) Hiệu điện thế toàn mạch bằng tổng các hiệu điện thế thành phần.","c) Điện trở tương đương bằng tổng các điện trở thành phần.","d) Hiệu điện thế trên mỗi điện trở bằng nhau."],"answer": ["T","T","T","F"],"explain": "Hiệu điện thế tỉ lệ với điện trở nên thường khác nhau.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về ví dụ trên.","statements": ["a) R1 = 10 Ω, R2 = 20 Ω nối tiếp thì R = 30 Ω.","b) Đặt U = 12 V thì I = 0,4 A.","c) Hiệu điện thế trên R1 là 4 V, trên R2 là 8 V.","d) Cường độ qua R1 khác qua R2."],"answer": ["T","T","T","F"],"explain": "Mạch nối tiếp nên cường độ qua hai điện trở bằng nhau.","points": 1},{"type": "short","level": "NB","q": "Trong đoạn mạch nối tiếp, cường độ dòng điện qua các điện trở như thế nào với nhau?","answer": "Bằng nhau","explain": "Dòng điện như nhau tại mọi điểm.","points": 0.5},{"type": "short","level": "TH","q": "Hai điện trở 15 Ω và 25 Ω mắc nối tiếp. Điện trở tương đương là bao nhiêu ôm?","answer": "40","explain": "R = 15 + 25 = 40 Ω.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Trong đoạn mạch gồm hai điện trở mắc song song, hiệu điện thế:","options": ["A. Bằng nhau trên mỗi điện trở (U = U1 = U2)","B. Bằng tổng các hiệu điện thế thành phần","C. Bằng 0","D. Tỉ lệ với điện trở"],"answer": "A","explain": "Mạch song song: U bằng nhau trên các nhánh.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong đoạn mạch song song, cường độ dòng điện trong mạch chính:","options": ["A. Bằng tổng các cường độ trong các mạch rẽ (I = I1 + I2)","B. Bằng nhau trên mọi nhánh","C. Bằng 0","D. Không xác định"],"answer": "A","explain": "I = I1 + I2.","points": 0.25},{"type": "mcq","level": "VD","q": "Hai điện trở R1 = R2 = 10 Ω mắc song song. Điện trở tương đương là:","options": ["A. 5 Ω","B. 20 Ω","C. 10 Ω","D. 100 Ω"],"answer": "A","explain": "1/R = 1/10 + 1/10 = 1/5, suy ra R = 5 Ω.","points": 0.25},{"type": "mcq","level": "VDC","q": "Hai điện trở R1 = 6 Ω, R2 = 3 Ω mắc song song. Điện trở tương đương là:","options": ["A. 2 Ω","B. 9 Ω","C. 4,5 Ω","D. 18 Ω"],"answer": "A","explain": "R = (6.3)/(6+3) = 2 Ω.","points": 0.25},{"type": "mcq","level": "NB","q": "Điện trở tương đương của đoạn mạch song song được e": "short","level": "NB","q": "Các thiết bị điện trong gia đình được mắc nối tiếp hay song song với nhau?","answer": "Song song","explain": "Mắc song song.","points": 0.5},{"type": "short","level": "TH","q": "Vì sao một bóng đèn trong nhà bị cháy mà các đèn khác vẫn sáng bình thường?","answer": "Vì các đèn mắc song song, độc lập với nhau","explain": "Các nhánh song song hoạt động độc lập.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "VD","q": "Ba điện trở R1 = 2 Ω, R2 = 3 Ω, R3 = 6 Ω mắc nối tiếp. Điện trở tương đương là:","options": ["A. 11 Ω","B. 36 Ω","C. 1 Ω","D. 5,5 Ω"],"answer": "A","explain": "R = 2 + 3 + 6 = 11 Ω.","points": 0.25},{"type": "mcq","level": "VDC","q": "Ba điện trở trên mắc song song. Điện trở tương đương là:","options": ["A. 1 Ω","B. 11 Ω","C. 36 Ω","D. 3,67 Ω"],"answer": "A","explain": "1/R = 1/2 + 1/3 + 1/6 = 1, suy ra R = 1 Ω.","points": 0.25},{"type": "mcq","level": "TH","q": "Đoạn mạch nối tiếp gồm n điện trở có điện trở tương đương:","options": ["A. R = R1 + R2 + ... + Rn","B. 1/R = 1/R1 + ... + 1/Rn","C. R = R1.R2...Rn","D. R = R1 = R2 = ... = Rn"],"answer": "A","explain": "Nối tiếp: cộng các điện trở lại.","points": 0.25},{"type": "mcq","level": "NB","q": "Đoạn mạch song song gồm n điện trở có điện trở tương đương tính bằng:","options": ["A. 1/R = 1/R1 + 1/R2 + ... + 1/Rn","B. R = R1 + R2 + ... + Rn","C. R = R1.R2...Rn","D. R = n.R1"],"answer": "A","explain": "Song song: cộng nghịch đảo các điện trở.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai điện trở bằng nhau (cùng là R) mắc song song, điện trở tương đương là:","options": ["A. R/2","B. 2R","C. R","D. R^2"],"answer": "A","explain": "R = R/2.","points": 0.25},{"type": "mcq","level": "NB","q": "Hai điện trở bằng nhau (cùng là R) mắc nối tiếp, điện trở tương đương là:","options": ["A. 2R","B. R/2","C. R","D. 0"],"answer": "A","explain": "R = 2R.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về nhiều điện trở.","statements": ["a) Ba điện trở 2 Ω, 3 Ω, 6 Ω nối tiếp thì R = 11 Ω.","b) Ba điện trở trên mắc song song thì R = 1 Ω.","c) Hai điện trở bằng nhau mắc song song thì R = R/2.","d) Hai điện trở bằng nhau mắc nối tiếp thì R = R/2."],"answer": ["T","T","T","F"],"explain": "Hai điện trở bằng nhau nối tiếp thì R = 2R.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về điện trở tương đương.","statements": ["a) Mắc thêm điện trở nối tiếp làm điện trở tương đương tăng.","b) Mắc thêm điện trở song song làm điện trở tương đương giảm.","c) Điện trở tương đương của mạch nối tiếp lớn hơn mỗi điện trở thành phần.","d) Điện trở tương đương của mạch song song lớn hơn mỗi điện trở thành phần."],"answer": ["T","T","T","F"],"explain": "R tương đương song song nhỏ hơn mỗi R thành phần.","points": 1},{"type": "short","level": "VD","q": "Ba điện trở 10 Ω mắc nối tiếp. Điện trở tương đương là bao nhiêu ôm?","answer": "30","explain": "R = 10 + 10 + 10 = 30 Ω.","points": 0.5},{"type": "short","level": "VDC","q": "Ba điện trở 30 Ω mắc song song. Điện trở tương đương là bao nhiêu ôm?","answer": "10","explain": "R = 30/3 = 10 Ω.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "TH","q": "Trong đoạn mạch nối tiếp, hiệu điện thế trên mỗi điện trở tỉ lệ:","options": ["A. Thuận với điện trở của nó (U1/U2 = R1/R2)","B. Nghịch với điện trở của nó","C. Không liên quan đến điện trở","D. Bằng nhau"],"answer": "A","explain": "U = I.R, I như nhau nên U tỉ lệ thuận với R.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong đoạn mạch song song, cường độ dòng điện qua mỗi nhánh tỉ lệ:","options": ["A. Nghịch với điện trở của nhánh đó (I1/I2 = R2/R1)","B. Thuận với điện trở","C. Bằng nhau","D. Không liên quan"],"answer": "A","explain": "I = U/R, U như nhau nên I tỉ lệ nghịch với R.","points": 0.25},{"type": "mcq","level": "VD","q": "Hai điện trở R1 = 10 Ω, R2 = 30 Ω mắc nối tiếp vào hiệu điện thế 40 V. Hiệu điện thế giữa hai đầu R1 là:","options": ["A. 10 V","B. 30 V","C. 40 V","D. 20 V"],"answer": "A","explain": "U1 = 40.10/40 = 10 V.","points": 0.25},{"type": "mcq","level": "VDC","q": "Hai điện trở trên mắc song song, cường độ dòng điện trong mạch chính là 4 A. Cường độ qua R1 là:","options": ["A. 3 A","B. 1 A","C. 4 A","D. 40 A"],"answer": "A","explain": "I1 = 4.30/40 = 3 A.","points": 0.25},{"type": "mcq","level": "TH","q": "Tỉ số U1/U2 trong đoạn mạch nối tiếp bằng:","options": ["A. R1/R2","B. R2/R1","C. I1/I2","D. 1"],"answer": "A","explain": "U1/U2 = R1/R2.","points": 0.25},{"type": "mcq","level": "NB","q": "Tỉ số I1/I2 trong đoạn mạch song song bằng:","options": ["A. R2/R1","B. R1/R2","C. U1/U2","D. 1"],"answer": "A","explain": "I1/I2 = R2/R1.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về phân bố U và I.","statements": ["a) Mạch nối tiếp: U1/U2 = R1/R2.","b) Mạch song song: I1/I2 = R2/R1.","c) R1 = 10 Ω, R2 = 30 Ω nối tiếp, U = 40 V thì U1 = 10 V.","d) Mạch nối tiếp: I1/I2 = R1/R2."],"answer": ["T","T","T","F"],"explain": "Mạch nối tiếp: I1 = I2 nên tỉ số bằng 1.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về phân bố dòng điện.","statements": ["a) Mạch song song: nhánh nào điện trở lớn thì dòng điện nhỏ.","b) Mạch nối tiếp: điện trở nào lớn thì hiệu điện thế lớn.","c) R1 = 10 Ω, R2 = 30 Ω song song, I = 4 A thì I1 = 3 A.","d) Mạch song song: U1/U2 = R1/R2."],"answer": ["T","T","T","F"],"explain": "Mạch song song: U1 = U2 nên tỉ số bằng 1.","points": 1},{"type": "short","level": "VD","q": "Hai điện trở mắc nối tiếp có R1 gấp đôi R2. Tỉ số U1/U2 bằng bao nhiêu?","answer": "2","explain": "U tỉ lệ thuận với R nên U1/U2 = 2.","points": 0.5},{"type": "short","level": "VDC","q": "Hai điện trở mắc song song có R1 gấp 3 lần R2. Tỉ số I1/I2 bằng bao nhiêu?","answer": "1/3","explain": "I tỉ lệ nghịch với R nên I1/I2 = 1/3.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Trong sơ đồ mạch điện, điện trở được kí hiệu bằng:","options": ["A. Hình chữ nhật","B. Hình tròn","C. Hình tam giác","D. Đường thẳng"],"answer": "A","explain": "Điện trở kí hiệu bằng hình chữ nhật.","points": 0.25},{"type": "mcq","level": "TH","q": "Muốn đo cường độ dòng điện qua R1 trong mạch nối tiếp, ampe kế được mắc:","options": ["A. Nối tiếp trong mạch","B. Song song với R1","C. Tùy ý","D. Không cần mắc"],"answer": "A","explain": "Ampe kế mắc nối tiếp.","points": 0.25},{"type": "mcq","level": "VD","q": "Muốn đo hiệu điện thế giữa hai đầu R1 trong mạch nối tiếp, vôn kế được mắc:","options": ["A. Song song với R1","B. Nối tiếp với R1","C. Tùy ý","D. Vào nguồn"],"answer": "A","explain": "Vôn kế mắc song song với R1.","points": 0.25},{"type": "mcq","level": "VDC","q": "Trong sơ đồ mạch điện, nguồn điện được kí hiệu bằng:","options": ["A. Hai vạch dài ngắn song song","B. Hình tròn","C. Hình chữ nhật","D. Mũi tên"],"answer": "A","explain": "Nguồn kí hiệu bằng hai vạch dài ngắn.","points": 0.25},{"type": "mcq","level": "TH","q": "Công tắc trong mạch điện có tác dụng:","options": ["A. Đóng, ngắt mạch điện","B. Tăng hiệu điện thế","C. Giảm điện trở","D. Đo cường độ"],"answer": "A","explain": "Công tắc dùng để đóng ngắt mạch.","points": 0.25},{"type": "mcq","level": "NB","q": "Các kí hiệu trong sơ đồ mạch điện:","options": ["A. Theo quy ước chung","B. Do mỗi người tự đặt","C. Thay đổi tùy ý","D. Không cần thống nhất"],"answer": "A","explain": "Các kí hiệu theo quy ước chung.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về sơ đồ mạch điện.","statements": ["a) Điện trở kí hiệu bằng hình chữ nhật.","b) Ampe kế mắc nối tiếp trong mạch.","c) Vôn kế mắc song song với đoạn cần đo.","d) Công tắc dùng để đóng, ngắt mạch."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về đọc sơ đồ.","statements": ["a) Sơ đồ mạch giúp lắp mạch đúng.","b) Các kí hiệu trong sơ đồ theo quy ước chung.","c) Mỗi người vẽ kí hiệu tùy ý.","d) Đọc sơ đồ biết được cách mắc các thiết bị."],"answer": ["T","T","F","T"],"explain": "Kí hiệu phải theo quy ước chung.","points": 1},{"type": "short","level": "NB","q": "Trong sơ đồ mạch điện, điện trở được kí hiệu bằng hình gì?","answer": "Hình chữ nhật","explain": "Hình chữ nhật.","points": 0.5},{"type": "short","level": "TH","q": "Muốn đo hiệu điện thế của R1, vôn kế phải mắc như thế nào với R1?","answer": "Song song","explain": "Vôn kế mắc song song với R1.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Cầu chì được mắc:","options": ["A. Nối tiếp với mạch điện cần bảo vệ","B. Song song với mạch điện","C. Tùy ý","D. Không mắc vào mạch"],"answer": "A","explain": "Cầu chì mắc nối tiếp.","points": 0.25},{"type": "mcq","level": "TH","q": "Tác dụng của cầu chì là:","options": ["A. Tự động ngắt mạch khi dòng điện quá lớn","B. Làm tăng dòng điện","C. Giảm hiệu điện thế","D. Đo cường độ dòng điện"],"answer": "A","explain": "Cầu chì bảo vệ mạch khi quá tải.","points": 0.25},{"type": "mcq","level": "VD","q": "Mạch điện có dòng điện định mức 5 A, nên chọn cầu chì có định mức:","options": ["A. 5 A","B. 20 A","C. 1 A","D. 100 A"],"answer": "A","explain": "Chọn cầu chì đúng định mức 5 A.","points": 0.25},{"type": "mcq","level": "VDC","q": "Dây chảy của cầu chì có đặc điểm:","options": ["A. Nhiệt độ nóng chảy thấp, dễ đứt khi dòng điện quá lớn","B. Nhiệt độ nóng chảy rất cao","C. Điện trở bằng 0","D. Không dẫn điện"],"answer": "A","explain": "Dây chảy dễ nóng chảy để ngắt mạch.","points": 0.25},{"type": "mcq","level": "TH","q": "Biến trở là:","options": ["A. Điện trở có thể thay đổi được trị số","B. Điện trở cố định","C. Dụng cụ đo điện trở","D. Nguồn điện"],"answer": "A","explain": "Biến trở thay đổi được trị số.","points": 0.25},{"type": "mcq","level": "NB","q": "Biến trở trong mạch điện dùng để:","options": ["A. Điều chỉnh cường độ dòng điện","B. Đo hiệu điện thế","C. Đo công suất","D. Tích điện"],"answer": "A","explain": "Biến trở điều chỉnh cường độ dòng điện.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về cầu chì và biến trở.","statements": ["a) Cầu chì mắc nối tiếp với mạch.","b) Cầu chì tự ngắt mạch khi quá tải.","c) Biến trở thay đổi được trị số điện trở.","d) Biến trở dùng để đo điện trở."],"answer": ["T","T","T","F"],"explain": "Biến trở dùng để điều chỉnh dòng điện.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về sử dụng.","statements": ["a) Dây chảy của cầu chì có nhiệt độ nóng chảy thấp.","b) Chọn cầu chì đúng với định mức của mạch.","c) Biến trở con chạy thay đổi chiều dài dây dẫn.","d) Có thể thay cầu chì bằng dây đồng to."],"answer": ["T","T","T","F"],"explain": "Dây đồng to không tự đứt khi quá tải, rất nguy hiểm.","points": 1},{"type": "short","level": "NB","q": "Cầu chì được mắc nối tiếp hay song song với mạch điện cần bảo vệ?","answer": "Nối tiếp","explain": "Cầu chì mắc nối tiếp.","points": 0.5},{"type": "short","level": "TH","q": "Biến trở có tác dụng gì trong mạch điện?","answer": "Điều chỉnh cường độ dòng điện","explain": "Biến trở điều chỉnh cường độ dòng điện.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "VD","q": "Hai điện trở R1 = 8 Ω, R2 = 4 Ω mắc nối tiếp vào nguồn 12 V. Cường độ dòng điện qua mỗi điện trở là:","options": ["A. 1 A","B. 2 A","C. 0,5 A","D. 3 A"],"answer": "A","explain": "R = 12 Ω, I = 12/12 = 1 A.","points": 0.25},{"type": "mcq","level": "VDC","q": "Hiệu điện thế giữa hai đầu R1 trong ví dụ trên là:","options": ["A. 8 V","B. 4 V","C. 12 V","D. 2 V"],"answer": "A","explain": "U1 = 1.8 = 8 V.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong mạch nối tiếp, nếu tháo một điện trở ra thì mạch sẽ:","options": ["A. Bị hở, không có dòng điện","B. Vẫn có dòng điện","C. Dòng điện tăng lên","D. Hiệu điện thế tăng lên"],"answer": "A","explain": "Tháo ra thì mạch hở.","points": 0.25},{"type": "mcq","level": "NB","q": "Mạch hở là mạch điện:","options": ["A. Bị ngắt, không có dòng điện chạy qua","B. Có dòng điện rất lớn","C. Bị chập","D. Hoạt động bình thường"],"answer": "A","explain": "Mạch hở không có dòng điện.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong mạch nối tiếp, tháo một điện trở ra thì các thiết bị khác sẽ:","options": ["A. Ngừng hoạt động","B. Vẫn hoạt động bình thường","C. Hoạt động mạnh hơn","D. Bị cháy"],"answer": "A","explain": "Mạch hở nên tất cả ngừng hoạt động.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong mạch song song, tháo một nhánh ra thì các nhánh khác sẽ:","options": ["A. Vẫn hoạt động bình thường","B. Ngừng hoạt động","C. Hoạt động mạnh hơn","D. Bị cháy"],"answer": "A","explain": "Các nhánh độc lập nên vẫn hoạt động.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về ví dụ.","statements": ["a) R1 = 8 Ω, R2 = 4 Ω nối tiếp, U = 12 V thì I = 1 A.","b) Hiệu điện thế trên R1 là 8 V.","c) Tháo R2 ra thì mạch bị hở.","d) Các thiết bị mắc nối tiếp hoạt động độc lập."],"answer": ["T","T","T","F"],"explain": "Mạch nối tiếp: một chỗ hở thì cả mạch ngừng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về mạch hở.","statements": ["a) Mạch nối tiếp: một thiết bị hỏng thì cả mạch ngừng.","b) Mạch song song: một nhánh hỏng, các nhánh khác vẫn hoạt động.","c) Vì vậy các thiết bị trong nhà mắc song song.","d) Dây đèn trang trí mắc song song."],"answer": ["T","T","T","F"],"explain": "Dây đèn trang trí mắc nối tiếp.","points": 1},{"type": "short","level": "VD","q": "Hai điện trở 8 Ω và 4 Ω mắc nối tiếp vào nguồn 12 V. Cường độ dòng điện qua mỗi điện trở là bao nhiêu ampe?","answer": "1","explain": "I = 12/12 = 1 A.","points": 0.5},{"type": "short","level": "VDC","q": "Vì sao dây đèn trang trí mắc nối tiếp thì một bóng cháy cả dây tắt?","answer": "Vì mạch bị hở","explain": "Một bóng cháy làm hở mạch.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "TH","q": "Đoạn mạch gồm R1 mắc nối tiếp với cụm (R2 song song R3) được gọi là:","options": ["A. Mạch hỗn hợp","B. Mạch nối tiếp","C. Mạch song song","D. Mạch hở"],"answer": "A","explain": "Đó là mạch hỗn hợp.","points": 0.25},{"type": "mcq","level": "NB","q": "Để tính điện trở tương đương của mạch hỗn hợp, ta:","options": ["A. Tính từng cụm rồi gộp dần","B. Cộng tất cả các điện trở","C. Nhân tất cả các điện trở","D. Lấy trung bình"],"answer": "A","explain": "Tính từng cụm rồi gộp dần.","points": 0.25},{"type": "mcq","level": "VD","q": "Cho R1 = 4 Ω mắc nối tiếp với cụm gồm R2 = 6 Ω song song R3 = 3 Ω. Điện trở tương đương của đoạn mạch là:","options": ["A. 6 Ω","B. 13 Ω","C. 2 Ω","D. 18 Ω"],"answer": "A","explain": "R cụm = 2 Ω, R = 4 + 2 = 6 Ω.","points": 0.25},{"type": "mcq","level": "VDC","q": "Đặt hiệu điện thế 12 V vào hai đầu đoạn mạch trên. Hiệu điện thế giữa hai đầu R1 là:","options": ["A. 8 V","B. 12 V","C. 4 V","D. 2 V"],"answer": "A","explain": "I = 2 A, U1 = 2.4 = 8 V.","points": 0.25},{"type": "mcq","level": "TH","q": "Hiệu điện thế giữa hai đầu cụm song song trong ví dụ trên là:","options": ["A. 4 V","B. 12 V","C. 8 V","D. 2 V"],"answer": "A","explain": "U cụm = 12 - 8 = 4 V.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong cụm song song, hiệu điện thế trên các nhánh:","options": ["A. Bằng nhau","B. Khác nhau","C. Bằng 0","D. Tỉ lệ với điện trở"],"answer": "A","explain": "Các nhánh song song có U bằng nhau.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về mạch hỗn hợp.","statements": ["a) Mạch hỗn hợp được tính bằng cách tính từng cụm.","b) Cụm 6 Ω song song 3 Ω có điện trở 2 Ω.","c) Điện trở toàn mạch trong ví dụ là 6 Ω.","d) Với U = 12 V, cường độ mạch chính là 2 A."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về phân bố điện.","statements": ["a) Hiệu điện thế trên R1 là 8 V.","b) Hiệu điện thế trên cụm song song là 4 V.","c) Cường độ qua R3 là khoảng 1,33 A.","d) Cường độ qua R2 lớn hơn qua R3."],"answer": ["T","T","T","F"],"explain": "R2 lớn hơn R3 nên I2 nhỏ hơn I3.","points": 1},{"type": "short","level": "VD","q": "Đoạn mạch gồm R1 nối tiếp với cụm (R2 song song R3) được gọi là mạch gì?","answer": "Mạch hỗn hợp","explain": "Đó là mạch hỗn hợp.","points": 0.5},{"type": "short","level": "VDC","q": "R1 = 5 Ω mắc nối tiếp với cụm gồm R2 = R3 = 10 Ω mắc song song. Điện trở tương đương là bao nhiêu ôm?","answer": "10","explain": "R cụm = 5 Ω, R = 5 + 5 = 10 Ω.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Trong đoạn mạch nối tiếp:","options": ["A. Cường độ bằng nhau, hiệu điện thế cộng lại","B. Hiệu điện thế bằng nhau, cường độ cộng lại","C. Cả hai đều bằng nhau","D. Cả hai đều bằng 0"],"answer": "A","explain": "Nối tiếp: I bằng nhau, U cộng lại.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong đoạn mạch song song:","options": ["A. Hiệu điện thế bằng nhau, cường độ cộng lại","B. Cường độ bằng nhau, hiệu điện thế cộng lại","C. Cả hai đều bằng nhau","D. Cả hai đều bằng 0"],"answer": "A","explain": "Song song: U bằng nhau, I cộng lại.","points": 0.25},{"type": "mcq","level": "VD","q": "Hai điện trở R1 = 5 Ω, R2 = 15 Ω mắc nối tiếp vào hiệu điện thế 20 V. Cường độ dòng điện là:","options": ["A. 1 A","B. 4 A","C. 0,25 A","D. 20 A"],"answer": "A","explain": "R = 20 Ω, I = 1 A.","points": 0.25},{"type": "mcq","level": "VDC","q": "Hai điện trở trên mắc song song vào hiệu điện thế 20 V. Cường độ dòng điện trong mạch chính là:","options": ["A. Khoảng 5,33 A","B. 1 A","C. 20 A","D. 0,27 A"],"answer": "A","explain": "I1 = 4 A, I2 = 1,33 A, I = 5,33 A.","points": 0.25},{"type": "mcq","level": "TH","q": "Điện trở tương đương khi hai điện trở trên mắc song song (3,75 Ω) so với khi mắc nối tiếp (20 Ω) thì:","options": ["A. Nhỏ hơn nhiều","B. Lớn hơn","C. Bằng nhau","D. Gấp đôi"],"answer": "A","explain": "3,75 Ω nhỏ hơn nhiều so với 20 Ω.","points": 0.25},{"type": "mcq","level": "NB","q": "Muốn có điện trở tương đương lớn hơn mỗi điện trở thành phần thì mắc:","options": ["A. Nối tiếp","B. Song song","C. Hỗn hợp","D. Tùy ý"],"answer": "A","explain": "Mắc nối tiếp cho R lớn hơn.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định tổng kết.","statements": ["a) Mạch nối tiếp: cường độ bằng nhau.","b) Mạch song song: hiệu điện thế bằng nhau.","c) Muốn điện trở lớn thì mắc nối tiếp.","d) Muốn điện trở lớn thì mắc song song."],"answer": ["T","T","T","F"],"explain": "Muốn R lớn thì mắc nối tiếp.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về ví dụ tổng hợp.","statements": ["a) R1 = 5 Ω, R2 = 15 Ω nối tiếp, U = 20 V thì I = 1 A.","b) Hai điện trở trên mắc song song thì R = 3,75 Ω.","c) Cường độ mạch chính khi song song là 5,33 A.","d) Mắc song song cho điện trở lớn hơn mắc nối tiếp."],"answer": ["T","T","T","F"],"explain": "Mắc nối tiếp cho điện trở lớn hơn.","points": 1},{"type": "short","level": "NB","q": "Muốn điện trở tương đương lớn hơn mỗi điện trở thành phần thì mắc nối tiếp hay song song?","answer": "Nối tiếp","explain": "Mắc nối tiếp.","points": 0.5},{"type": "short","level": "TH","q": "Muốn điện trở tương đương nhỏ hơn mỗi điện trở thành phần thì mắc nối tiếp hay song song?","answer": "Song song","explain": "Mắc song song.","points": 0.5}]}]}
