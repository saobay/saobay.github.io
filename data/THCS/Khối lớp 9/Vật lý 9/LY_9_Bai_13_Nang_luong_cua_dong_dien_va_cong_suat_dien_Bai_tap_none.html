": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về tính toán.","statements": ["a) U = 220 V, I = 2 A thì P = 440 W.","b) Đèn 100 W/220 V có dòng điện định mức 0,45 A.","c) Thiết bị hoạt động đúng công suất định mức khi đúng hiệu điện thế định mức.","d) Công suất càng lớn thì càng tốn ít điện."],"answer": ["T","T","T","F"],"explain": "Công suất càng lớn thì càng tốn nhiều điện.","points": 1},{"type": "short","level": "NB","q": "Đại lượng đặc trưng cho tốc độ thực hiện công của dòng điện gọi là gì?","answer": "Công suất điện","explain": "Đó là công suất điện.","points": 0.5},{"type": "short","level": "TH","q": "Một thiết bị có U = 12 V, I = 3 A. Công suất của thiết bị là bao nhiêu oát?","answer": "36","explain": "P = 12.3 = 36 W.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "TH","q": "Từ công thức P = U.I và định luật Ohm, công suất điện còn được tính bằng:","options": ["A. P = I^2.R","B. P = I/R","C. P = R/I","D. P = U + I"],"answer": "A","explain": "P = I^2.R.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức P = U^2/R được dùng khi biết:","options": ["A. Hiệu điện thế U và điện trở R","B. Cường độ I và điện trở R","C. Điện năng và thời gian","D. Khối lượng dây"],"answer": "A","explain": "Biết U và R thì dùng P = U^2/R.","points": 0.25},{"type": "mcq","level": "VD","q": "Một dây dẫn có R = 100 Ω, dòng điện qua dây là 0,5 A. Công suất tỏa nhiệt trên dây là:","options": ["A. 25 W","B. 50 W","C. 2500 W","D. 200 W"],"answer": "A","explain": "P = 0,25.100 = 25 W.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một bóng đèn có U = 220 V, R = 484 Ω. Công suất của đèn là:","options": ["A. 100 W","B. 106480 W","C. 0,45 W","D. 704 W"],"answer": "A","explain": "P = 220^2/484 = 100 W.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai bóng đèn cùng hiệu điện thế định mức 220 V: một đèn 60 W, một đèn 100 W. Đèn nào sáng hơn khi đúng hiệu điện thế định mức?","options": ["A. Đèn 100 W","B. Đèn 60 W","C. Sáng như nhau","D. Không xác định"],"answer": "A","explain": "Công suất lớn hơn thì sáng hơn.","points": 0.25},{"type": "mcq","level": "NB","q": "So với đèn 60 W (cùng 220 V), đèn 100 W có điện trở:","options": ["A. Nhỏ hơn","B. Lớn hơn","C. Bằng nhau","D. Gấp đôi"],"answer": "A","explain": "R = U^2/P nên P lớn thì R nhỏ.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về công thức công suất.","statements": ["a) Công suất tính bằng P = I^2.R.","b) Công suất tính bằng P = U^2/R.","c) R = 100 Ω, I = 0,5 A thì P = 25 W.","d) U = 220 V, R = 484 Ω thì P = 100 W."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về hai bóng đèn.","statements": ["a) Đèn 100 W sáng hơn đèn 60 W (cùng 220 V).","b) Đèn 100 W có điện trở nhỏ hơn đèn 60 W.","c) Khi I không đổi, P tỉ lệ thuận với R.","d) Khi U không đổi, P tỉ lệ thuận với R."],"answer": ["T","T","T","F"],"explain": "Khi U không đổi, P = U^2/R tỉ lệ nghịch với R.","points": 1},{"type": "short","level": "VD","q": "Một dây dẫn có R = 20 Ω, dòng điện qua dây là 2 A. Công suất tỏa nhiệt trên dây là bao nhiêu oát?","answer": "80","explain": "P = 4.20 = 80 W.","points": 0.5},{"type": "short","level": "VDC","q": "Hai bóng đèn 220 V: một đèn 40 W, một đèn 100 W. Bóng nào có điện trở lớn hơn?","answer": "Bóng 40 W","explain": "R = U^2/P nên P nhỏ thì R lớn.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Định luật Jun - Lenxơ phát biểu: nhiệt lượng tỏa ra trên dây dẫn được tính bằng:","options": ["A. Q = I^2.R.t","B. Q = I.R.t","C. Q = U.I","D. Q = P.t^2"],"answer": "A","explain": "Q = I^2.R.t.","points": 0.25},{"type": "mcq","level": "TH","q": "Nhiệt lượng tỏa ra trên dây dẫn tỉ lệ thuận với:","options": ["A. Bình phương cường độ dòng điện, điện trở và thời gian","B. Cường độ dòng điện","C. Hiệu điện thế","D. Khối lượng dây"],"answer": "A","explain": "Q tỉ lệ với I^2, R và t.","points": 0.25},{"type": "mcq","level": "VD","q": "Dòng điện 2 A qua điện trở 10 Ω trong 60 s. Nhiệt lượng tỏa ra là:","options": ["A. 2400 J","B. 1200 J","C. 120 J","D. 72000 J"],"answer": "A","explain": "Q = 4.10.60 = 2400 J.","points": 0.25},{"type": "mcq","level": "VDC","q": "Ấm điện 1000 W đun nước trong 5 phút. Nhiệt lượng tỏa ra là:","options": ["A. 300000 J","B. 5000 J","C. 200 J","D. 1200 J"],"answer": "A","explain": "Q = 1000.300 = 300000 J.","points": 0.25},{"type": "mcq","level": "TH","q": "Tác dụng nhiệt của dòng điện được ứng dụng trong:","options": ["A. Bàn là, ấm điện, bóng đèn sợi đốt","B. Quạt điện","C. Động cơ điện","D. Chuông điện"],"answer": "A","explain": "Các thiết bị đốt nóng dùng tác dụng nhiệt.","points": 0.25},{"type": "mcq","level": "NB","q": "Dây đốt nóng của ấm điện thường làm bằng:","options": ["A. Nicrom","B. Đồng","C. Bạc","D. Nhôm"],"answer": "A","explain": "Nicrom có điện trở suất lớn, chịu nhiệt tốt.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về định luật Jun - Lenxơ.","statements": ["a) Nhiệt lượng tính bằng Q = I^2.R.t.","b) Q tỉ lệ thuận với bình phương cường độ dòng điện.","c) Bàn là, ấm điện dùng tác dụng nhiệt của dòng điện.","d) Dây đốt nóng của ấm điện làm bằng đồng."],"answer": ["T","T","T","F"],"explain": "Dây đốt nóng làm bằng nicrom.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về tính toán nhiệt lượng.","statements": ["a) I = 2 A, R = 10 Ω, t = 60 s thì Q = 2400 J.","b) Ấm 1000 W đun 5 phút tỏa nhiệt 300000 J.","c) Dòng điện càng lớn thì tỏa nhiệt càng nhiều.","d) Nhiệt lượng tỏa ra không phụ thuộc thời gian."],"answer": ["T","T","T","F"],"explain": "Nhiệt lượng tỉ lệ thuận với thời gian.","points": 1},{"type": "short","level": "NB","q": "Nhiệt lượng tỏa ra trên dây dẫn tỉ lệ thuận với những đại lượng nào?","answer": "Bình phương cường độ dòng điện, điện trở và thời gian","explain": "Q tỉ lệ với I^2, R và t.","points": 0.5},{"type": "short","level": "TH","q": "Nêu hai ứng dụng của tác dụng nhiệt của dòng điện.","answer": "Bàn là và ấm điện","explain": "Bàn là, ấm điện dùng tác dụng nhiệt.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "TH","q": "Hiệu suất của ấm điện được tính bằng:","options": ["A. Tỉ số giữa nhiệt lượng nước thu được và điện năng tiêu thụ","B. Tích của hai đại lượng trên","C. Hiệu của hai đại lượng trên","D. Tổng hai đại lượng trên"],"answer": "A","explain": "H = Q có ích / A toàn phần.","points": 0.25},{"type": "mcq","level": "NB","q": "Vì sao hiệu suất của ấm điện nhỏ hơn 100%?","options": ["A. Vì một phần nhiệt lượng tỏa ra môi trường xung quanh","B. Vì điện năng biến mất","C. Vì nước bay hơi hết","D. Vì ấm bị hỏng"],"answer": "A","explain": "Một phần nhiệt hao phí ra môi trường.","points": 0.25},{"type": "mcq","level": "VD","q": "Ấm điện tiêu thụ 500000 J điện năng, nước thu được 450000 J nhiệt lượng. Hiệu suất của ấm là:","options": ["A. 90%","B. 111%","C. 10%","D. 100%"],"answer": "A","explain": "H = 450000/500000 = 90%.","points": 0.25},{"type": "mcq","level": "VDC","q": "Đun sôi 2 lít nước từ 20°C lên 100°C bằng ấm điện 1000 W có hiệu suất 90%. Thời gian đun là:","options": ["A. Khoảng 12,5 phút","B. 11,2 phút","C. 5 phút","D. 20 phút"],"answer": "A","explain": "Q = 672000 J, t = 672000/900 = 747 s = 12,5 phút.","points": 0.25},{"type": "mcq","level": "TH","q": "Nhiệt dung riêng của nước là:","options": ["A. 4200 J/kg.K","B. 420 J/kg.K","C. 8400 J/kg.K","D. 1000 J/kg.K"],"answer": "A","explain": "c của nước là 4200 J/kg.K.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị đo nhiệt lượng là:","options": ["A. Jun (J)","B. Oát (W)","C. Vôn (V)","D. Ampe (A)"],"answer": "A","explain": "Nhiệt lượng đo bằng jun.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về hiệu suất.","statements": ["a) Hiệu suất = năng lượng có ích / năng lượng toàn phần.","b) Hiệu suất của ấm điện nhỏ hơn 100%.","c) Nước thu 450000 J, tiêu thụ 500000 J thì H = 90%.","d) Hiệu suất có thể lớn hơn 100%."],"answer": ["T","T","T","F"],"explain": "Hiệu suất không thể vượt quá 100%.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về đun nước.","statements": ["a) Đun 2 lít nước từ 20 lên 100°C cần 672000 J.","b) Ấm 1000 W hiệu suất 90% cần khoảng 12,5 phút.","c) Nhiệt dung riêng của nước là 4200 J/kg.K.","d) Ấm có công suất càng lớn thì đun càng nhanh."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "VD","q": "Một ấm điện tiêu thụ 600000 J điện năng, nước thu được 540000 J nhiệt lượng. Hiệu suất của ấm là bao nhiêu phần trăm?","answer": "90","explain": "H = 540000/600000 = 90%.","points": 0.5},{"type": "short","level": "VDC","q": "Vì sao không nên để ấm điện đun khi không có nước?","answer": "Vì không có nước hấp thụ nhiệt, dây đốt nóng quá gây cháy","explain": "Dây đốt nóng quá nhiệt có thể gây cháy, hỏng ấm.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Công tơ điện dùng để đo:","options": ["A. Điện năng tiêu thụ của gia đình","B. Công suất của thiết bị","C. Cường độ dòng điện","D. Hiệu điện thế"],"answer": "A","explain": "Công tơ điện đo điện năng tiêu thụ.","points": 0.25},{"type": "mcq","level": "TH","q": "Số đếm của công tơ điện cho biết số:","options": ["A. Kilôoát giờ (kWh) đã dùng","B. Jun","C. Oát","D. Ampe"],"answer": "A","explain": "Số đếm tính bằng kWh.","points": 0.25},{"type": "mcq","level": "VD","q": "Gia đình dùng 150 kWh trong một tháng, giá điện 2000 đồng/kWh. Tiền điện phải trả là:","options": ["A. 300000 đồng","B. 30000 đồng","C. 75000 đồng","D. 3000 đồng"],"answer": "A","explain": "150.2000 = 300000 đồng.","points": 0.25},{"type": "mcq","level": "VDC","q": "Mỗi ngày một hộ dùng: 5 đèn 100 W trong 5 giờ, quạt 75 W trong 8 giờ, tủ lạnh 150 W trong 10 giờ. Điện năng tiêu thụ trong 30 ngày là:","options": ["A. 78 kWh","B. 26 kWh","C. 7,8 kWh","D. 780 kWh"],"answer": "A","explain": "Mỗi ngày 2,6 kWh, 30 ngày 78 kWh.","points": 0.25},{"type": "mcq","level": "TH","q": "Để tiết kiệm điện năng, nên:","options": ["A. Tắt thiết bị khi không dùng, dùng thiết bị hiệu suất cao","B. Bật tất cả thiết bị cùng lúc","C. Dùng đèn sợi đốt","D. Để tủ lạnh mở cửa"],"answer": "A","explain": "Các biện pháp tiết kiệm điện.","points": 0.25},{"type": "mcq","level": "NB","q": "So với đèn sợi đốt, đèn LED:","options": ["A. Tiết kiệm điện hơn","B. Tốn điện hơn","C. Sáng yếu hơn hẳn","D. Nóng hơn"],"answer": "A","explain": "Đèn LED tiết kiệm điện hơn.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về công tơ điện.","statements": ["a) Công tơ điện đo điện năng tiêu thụ.","b) Số đếm của công tơ tính bằng kWh.","c) Dùng 150 kWh giá 2000 đồng/kWh thì trả 300000 đồng.","d) Công tơ điện đo công suất."],"answer": ["T","T","T","F"],"explain": "Công tơ đo điện năng, không đo công suất.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về tiết kiệm điện.","statements": ["a) Đèn LED tiết kiệm điện hơn đèn sợi đốt.","b) Tắt thiết bị khi không dùng giúp tiết kiệm điện.","c) Thiết bị dán nhãn năng lượng 5 sao tiết kiệm điện.","d) Để điều hòa 16°C cả ngày giúp tiết kiệm điện."],"answer": ["T","T","T","F"],"explain": "Để nhiệt độ quá thấp tốn nhiều điện.","points": 1},{"type": "short","level": "NB","q": "Dụng cụ đo điện năng tiêu thụ của mỗi gia đình gọi là gì?","answer": "Công tơ điện","explain": "Đó là công tơ điện.","points": 0.5},{"type": "short","level": "TH","q": "Nêu hai biện pháp tiết kiệm điện trong gia đình.","answer": "Tắt thiết bị khi không dùng và dùng đèn LED","explain": "Hai biện pháp tiết kiệm điện.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "TH","q": "Trên bóng đèn ghi 220 V - 60 W. Con số 220 V cho biết:","options": ["A. Hiệu điện thế định mức của bóng đèn","B. Cường độ dòng điện định mức","C. Điện năng tiêu thụ","D. Tuổi thọ"],"answer": "A","explain": "220 V là hiệu điện thế định mức.","points": 0.25},{"type": "mcq","level": "NB","q": "Con số 60 W cho biết:","options": ["A. Công suất định mức của bóng đèn","B. Điện năng tiêu thụ","C. Cường độ dòng điện","D. Điện trở"],"answer": "A","explain": "60 W là công suất định mức.","points": 0.25},{"type": "mcq","level": "VD","q": "Mắc bóng đèn 220 V - 60 W vào hiệu điện thế 220 V, đèn sẽ:","options": ["A. Sáng bình thường","B. Sáng yếu","C. Bị cháy","D. Không sáng"],"answer": "A","explain": "Đúng HĐT định mức thì sáng bình thường.","points": 0.25},{"type": "mcq","level": "VDC","q": "Mắc bóng đèn trên vào hiệu điện thế 110 V, đèn sẽ:","options": ["A. Sáng yếu hơn bình thường","B. Sáng bình thường","C. Bị cháy","D. Không sáng"],"answer": "A","explain": "HĐT thấp hơn định mức nên đèn sáng yếu.","points": 0.25},{"type": "mcq","level": "TH","q": "Công suất thực tế của đèn khi mắc vào 110 V là:","options": ["A. 15 W","B. 60 W","C. 30 W","D. 120 W"],"answer": "A","explain": "P = 60.(110/220)^2 = 15 W.","points": 0.25},{"type": "mcq","level": "NB","q": "Nếu hiệu điện thế đặt vào lớn hơn nhiều so với hiệu điện thế định mức, bóng đèn sẽ:","options": ["A. Có thể bị cháy","B. Sáng bình thường","C. Sáng yếu đi","D. Tiết kiệm điện"],"answer": "A","explain": "Quá áp làm đèn cháy.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về số liệu định mức.","statements": ["a) 220 V là hiệu điện thế định mức.","b) 60 W là công suất định mức.","c) Mắc đúng 220 V thì đèn sáng bình thường.","d) Mắc vào 110 V thì công suất là 15 W."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về sử dụng đèn.","statements": ["a) Hiệu điện thế thấp hơn định mức thì đèn sáng yếu.","b) Hiệu điện thế cao hơn nhiều thì đèn bị cháy.","c) Nên dùng thiết bị đúng hiệu điện thế định mức.","d) Bóng đèn 60 W luôn tiêu thụ đúng 60 W."],"answer": ["T","T","T","F"],"explain": "Công suất thực tế phụ thuộc hiệu điện thế sử dụng.","points": 1},{"type": "short","level": "VD","q": "Trên bóng đèn ghi 220 V - 60 W. Ý nghĩa của các con số đó là gì?","answer": "Hiệu điện thế định mức 220 V, công suất định mức 60 W","explain": "Đó là các số liệu định mức.","points": 0.5},{"type": "short","level": "VDC","q": "Mắc bóng đèn 220 V - 60 W vào hiệu điện thế 110 V. Công suất tiêu thụ của đèn là bao nhiêu oát?","answer": "15","explain": "P = 60/4 = 15 W.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Dòng điện có thể biến điện năng thành:","options": ["A. Nhiệt năng, quang năng, cơ năng...","B. Chỉ thành nhiệt năng","C. Chỉ thành quang năng","D. Không thành dạng nào"],"answer": "A","explain": "Điện năng chuyển thành nhiều dạng năng lượng.","points": 0.25},{"type": "mcq","level": "TH","q": "Quạt điện biến điện năng thành chủ yếu là:","options": ["A. Cơ năng","B. Quang năng","C. Hóa năng","D. Nhiệt năng"],"answer": "A","explain": "Quạt điện biến điện năng thành cơ năng.","points": 0.25},{"type": "mcq","level": "VD","q": "Bóng đèn sợi đốt biến điện năng thành:","options": ["A. Quang năng và nhiệt năng","B. Cơ năng","C. Hóa năng","D. Chỉ thành quang năng"],"answer": "A","explain": "Đèn sợi đốt cho ánh sáng và tỏa nhiệt.","points": 0.25},{"type": "mcq","level": "VDC","q": "Động cơ điện biến điện năng thành:","options": ["A. Cơ năng","B. Quang năng","C. Hóa năng","D. Nhiệt năng"],"answer": "A","explain": "Động cơ điện biến điện năng thành cơ năng.","points": 0.25},{"type": "mcq","level": "TH","q": "Máy bơm nước biến điện năng thành:","options": ["A. Cơ năng rồi thành thế năng của nước","B. Quang năng","C. Hóa năng","D. Chỉ thành nhiệt năng"],"answer": "A","explain": "Máy bơm đưa nước lên cao.","points": 0.25},{"type": "mcq","level": "NB","q": "Pin mặt trời biến đổi:","options": ["A. Quang năng thành điện năng","B. Điện năng thành quang năng","C. Cơ năng thành điện năng","D. Nhiệt năng thành cơ năng"],"answer": "A","explain": "Pin mặt trời biến quang năng thành điện năng.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về biến đổi năng lượng.","statements": ["a) Điện năng có thể chuyển thành nhiều dạng năng lượng khác.","b) Quạt điện biến điện năng thành cơ năng.","c) Đèn sợi đốt biến điện năng thành quang năng và nhiệt năng.","d) Điện năng chỉ biến thành nhiệt năng."],"answer": ["T","T","T","F"],"explain": "Điện năng biến thành nhiều dạng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về các thiết bị điện.","statements": ["a) Động cơ điện biến điện năng thành cơ năng.","b) Máy bơm biến điện năng thành thế năng của nước.","c) Pin mặt trời biến quang năng thành điện năng.","d) Acquy khi nạp điện biến điện năng thành hóa năng."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Quạt điện biến điện năng thành dạng năng lượng nào là chủ yếu?","answer": "Cơ năng","explain": "Quạt điện tạo ra cơ năng.","points": 0.5},{"type": "short","level": "TH","q": "Bóng đèn sợi đốt biến điện năng thành những dạng năng lượng nào?","answer": "Quang năng và nhiệt năng","explain": "Đèn vừa phát sáng vừa tỏa nhiệt.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "TH","q": "Việc nào sau đây MẤT an toàn về điện?","options": ["A. Chạm tay vào ổ điện đang có điện","B. Ngắt cầu dao khi sửa chữa điện","C. Dùng bút thử điện để kiểm tra","D. Đi giày cách điện khi sửa điện"],"answer": "A","explain": "Chạm tay vào ổ điện rất nguy hiểm.","points": 0.25},{"type": "mcq","level": "NB","q": "Trước khi sửa chữa điện trong nhà, việc đầu tiên cần làm là:","options": ["A. Ngắt cầu dao (ngắt nguồn điện)","B. Chạm tay thử","C. Dội nước","D. Gọi hàng xóm"],"answer": "A","explain": "Phải ngắt nguồn điện trước.","points": 0.25},{"type": "mcq","level": "VD","q": "Phát hiện dây điện bị hở vỏ, cần:","options": ["A. Ngắt điện rồi bọc lại bằng băng keo cách điện","B. Chạm tay vào kiểm tra","C. Để nguyên","D. Dội nước vào"],"answer": "A","explain": "Ngắt điện rồi bọc cách điện.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao chim đậu trên dây điện cao thế không bị điện giật?","options": ["A. Vì không tạo thành mạch kín qua cơ thể chim","B. Vì lông chim cách điện","C. Vì chim bay nhanh","D. Vì dây điện không có điện"],"answer": "A","explain": "Không có dòng điện qua người chim.","points": 0.25},{"type": "mcq","level": "TH","q": "Bút thử điện dùng để:","options": ["A. Kiểm tra chỗ nào có điện","B. Đo chính xác hiệu điện thế","C. Đo cường độ dòng điện","D. Sửa chữa điện"],"answer": "A","explain": "Bút thử điện kiểm tra có điện hay không.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi phát hiện có người bị điện giật, việc đầu tiên cần làm là:","options": ["A. Ngắt nguồn điện rồi mới cứu người","B. Dùng tay kéo người ra ngay","C. Dội nước vào người đó","D. Bỏ chạy"],"answer": "A","explain": "Ngắt điện trước khi cứu.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về an toàn điện.","statements": ["a) Sửa chữa điện phải ngắt cầu dao trước.","b) Không chạm tay vào dây điện trần.","c) Cứu người bị điện giật phải ngắt điện trước.","d) Có thể chạm tay vào ổ điện để kiểm tra có điện không."],"answer": ["T","T","T","F"],"explain": "Tuyệt đối không chạm tay vào ổ điện.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về an toàn điện.","statements": ["a) Bút thử điện dùng để kiểm tra có điện hay không.","b) Dây điện hở phải được bọc băng keo cách điện.","c) Chim đậu trên dây điện không bị giật vì không tạo mạch kín.","d) Đi chân đất sửa chữa điện là an toàn."],"answer": ["T","T","T","F"],"explain": "Đi chân đất sửa điện rất nguy hiểm.","points": 1},{"type": "short","level": "NB","q": "Trước khi sửa chữa điện trong nhà cần làm gì đầu tiên?","answer": "Ngắt cầu dao","explain": "Phải ngắt nguồn điện.","points": 0.5},{"type": "short","level": "TH","q": "Khi phát hiện người bị điện giật, việc đầu tiên cần làm là gì?","answer": "Ngắt nguồn điện","explain": "Ngắt điện rồi mới cứu người.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Công thức tính điện năng tiêu thụ là:","options": ["A. A = U.I.t","B. A = P/t","C. A = U/I","D. A = I.t"],"answer": "A","explain": "A = U.I.t.","points": 0.25},{"type": "mcq","level": "TH","q": "Công thức tính công suất điện là:","options": ["A. P = U.I","B. P = A.t","C. P = U/I","D. P = I/U"],"answer": "A","explain": "P = U.I.","points": 0.25},{"type": "mcq","level": "VD","q": "Bàn là 220 V - 1000 W được dùng trong 30 phút. Điện năng tiêu thụ là:","options": ["A. 0,5 kWh","B. 500 kWh","C. 30000 kWh","D. 0,05 kWh"],"answer": "A","explain": "A = 1000.0,5 = 500 Wh = 0,5 kWh.","points": 0.25},{"type": "mcq","level": "VDC","q": "Cường độ dòng điện qua bàn là trên là:","options": ["A. Khoảng 4,55 A","B. 220000 A","C. 0,22 A","D. 1220 A"],"answer": "A","explain": "I = 1000/220 = 4,55 A.","points": 0.25},{"type": "mcq","level": "TH","q": "Điện trở của bàn là trên là:","options": ["A. 48,4 Ω","B. 0,22 Ω","C. 220000 Ω","D. 1020 Ω"],"answer": "A","explain": "R = 220^2/1000 = 48,4 Ω.","points": 0.25},{"type": "mcq","level": "NB","q": "Nhiệt lượng mà bàn là tỏa ra trong 30 phút là:","options": ["A. 1800000 J","B. 500 J","C. 30 J","D. 220 J"],"answer": "A","explain": "Q = 1000.1800 = 1800000 J.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định tổng kết.","statements": ["a) Điện năng tính bằng A = U.I.t.","b) Công suất điện tính bằng P = U.I.","c) Bàn là 1000 W dùng 30 phút tốn 0,5 kWh.","d) 1 kWh = 3,6.10^6 J."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về bàn là.","statements": ["a) Dòng điện qua bàn là 1000 W/220 V khoảng 4,55 A.","b) Điện trở của bàn là là 48,4 Ω.","c) Nhiệt lượng tỏa ra trong 30 phút là 1800000 J.","d) Bàn là biến điện năng thành cơ năng."],"answer": ["T","T","T","F"],"explain": "Bàn là biến điện năng thành nhiệt năng.","points": 1},{"type": "short","level": "NB","q": "Viết công thức tính công suất điện theo U và I.","answer": "P = U.I","explain": "P = U.I.","points": 0.5},{"type": "short","level": "TH","q": "Một ấm điện 1500 W hoạt động trong 10 phút. Điện năng tiêu thụ là bao nhiêu kWh?","answer": "0,25","explain": "A = 1500.(1/6) = 250 Wh = 0,25 kWh.","points": 0.5}]}]}
