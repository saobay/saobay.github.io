 chiều, lớn hơn vật (kính lúp).","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về ảnh qua thấu kính hội tụ.","statements": ["a) Vật ngoài 2F: ảnh thật, ngược chiều, nhỏ hơn vật.","b) Vật tại 2F: ảnh thật, ngược chiều, bằng vật.","c) Vật từ F đến 2F: ảnh thật, ngược chiều, lớn hơn vật.","d) Vật trong F: ảnh ảo, cùng chiều, lớn hơn vật."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về ảnh qua thấu kính.","statements": ["a) Thấu kính phân kì luôn cho ảnh ảo, cùng chiều, nhỏ hơn vật.","b) Ảnh ảo không hứng được trên màn.","c) Ảnh thật hứng được trên màn.","d) Thấu kính hội tụ luôn cho ảnh lớn hơn vật."],"answer": ["T","T","T","F"],"explain": "Vật ngoài 2F cho ảnh nhỏ hơn vật.","points": 1},{"type": "short","level": "NB","q": "Ảnh của vật qua thấu kính phân kì luôn là ảnh thật hay ảnh ảo?","answer": "Ảnh ảo","explain": "Thấu kính phân kì luôn cho ảnh ảo.","points": 0.5},{"type": "short","level": "TH","q": "Vật đặt ngoài khoảng 2F của thấu kính hội tụ cho ảnh thật hay ảnh ảo?","answer": "Ảnh thật","explain": "Ngoài 2F cho ảnh thật.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "VD","q": "Muốn hứng được ảnh thật của vật trên màn, ta dùng:","options": ["A. Thấu kính hội tụ với vật đặt ngoài khoảng tiêu cự","B. Thấu kính phân kì","C. Gương phẳng","D. Tấm bìa"],"answer": "A","explain": "Chỉ thấu kính hội tụ với vật ngoài F mới cho ảnh thật.","points": 0.25},{"type": "mcq","level": "VDC","q": "Máy ảnh sử dụng thấu kính nào để tạo ảnh trên phim?","options": ["A. Thấu kính hội tụ tạo ảnh thật trên phim","B. Thấu kính phân kì","C. Gương cầu","D. Lăng kính"],"answer": "A","explain": "Máy ảnh dùng thấu kính hội tụ tạo ảnh thật nhỏ trên phim.","points": 0.25},{"type": "mcq","level": "NB","q": "Mắt người có thể xem như một thấu kính hội tụ (thể thủy tinh) tạo ảnh thật trên:","options": ["A. Võng mạc","B. Giác mạc","C. Đồng tử","D. Lòng trắng"],"answer": "A","explain": "Ảnh thật hiện trên võng mạc.","points": 0.25},{"type": "mcq","level": "TH","q": "Kính cận thị là loại thấu kính:","options": ["A. Phân kì","B. Hội tụ","C. Lồi lõm","D. Phẳng"],"answer": "A","explain": "Kính cận là thấu kính phân kì.","points": 0.25},{"type": "mcq","level": "TH","q": "Kính chữa viễn thị (kính lão) là loại thấu kính:","options": ["A. Hội tụ","B. Phân kì","C. Phẳng","D. Trụ"],"answer": "A","explain": "Kính lão là thấu kính hội tụ.","points": 0.25},{"type": "mcq","level": "NB","q": "Người ta dùng thấu kính hội tụ để:","options": ["A. Làm kính lúp, chữa viễn thị","B. Chữa cận thị","C. Làm gương chiếu hậu","D. Làm kính râm"],"answer": "A","explain": "Kính lúp và kính lão đều là thấu kính hội tụ.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về ứng dụng của thấu kính.","statements": ["a) Máy ảnh dùng thấu kính hội tụ tạo ảnh thật nhỏ trên phim.","b) Mắt dùng thể thủy tinh (thấu kính hội tụ) tạo ảnh thật trên võng mạc.","c) Kính cận là thấu kính phân kì.","d) Kính lão là thấu kính phân kì."],"answer": ["T","T","T","F"],"explain": "Kính lão là thấu kính hội tụ.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về ứng dụng của thấu kính.","statements": ["a) Ảnh trên phim của máy ảnh là ảnh thật, ngược chiều.","b) Não xử lý để ta cảm nhận ảnh thuận chiều.","c) Máy chiếu dùng thấu kính hội tụ phóng to ảnh thật lên màn.","d) Thấu kính phân kì có thể tạo ảnh thật trên màn."],"answer": ["T","T","T","F"],"explain": "Thấu kính phân kì không tạo được ảnh thật.","points": 1},{"type": "short","level": "VD","q": "Máy ảnh sử dụng thấu kính hội tụ hay phân kì để tạo ảnh trên phim?","answer": "Thấu kính hội tụ","explain": "Máy ảnh dùng thấu kính hội tụ.","points": 0.5},{"type": "short","level": "VDC","q": "Kính cận thị là thấu kính hội tụ hay phân kì?","answer": "Thấu kính phân kì","explain": "Kính cận là thấu kính phân kì.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Trục chính của thấu kính là:","options": ["A. Đường thẳng đi qua quang tâm, vuông góc với thấu kính","B. Đường thẳng nằm trên mặt thấu kính","C. Đường tròn quanh thấu kính","D. Điểm giữa thấu kính"],"answer": "A","explain": "Trục chính qua quang tâm và vuông góc với thấu kính.","points": 0.25},{"type": "mcq","level": "TH","q": "Quang tâm O của thấu kính là:","options": ["A. Điểm giữa thấu kính mà mọi tia qua đó đều truyền thẳng","B. Tiêu điểm của thấu kính","C. Điểm rìa của thấu kính","D. Điểm bất kì"],"answer": "A","explain": "Quang tâm là điểm mọi tia qua đó truyền thẳng.","points": 0.25},{"type": "mcq","level": "VD","q": "Chùm tia tới hội tụ tại tiêu điểm F của thấu kính hội tụ, chùm tia ló sẽ:","options": ["A. Song song với trục chính","B. Hội tụ tại tiêu điểm còn lại","C. Phân kì","D. Hội tụ tại quang tâm"],"answer": "A","explain": "Theo tính thuận nghịch: tia qua F cho tia ló song song.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một điểm sáng đặt trên trục chính, ngoài khoảng 2F của thấu kính hội tụ. Ảnh của nó là:","options": ["A. Một điểm sáng trên trục chính, nằm giữa F và 2F phía bên kia","B. Một điểm sáng tại quang tâm","C. Không có ảnh","D. Một vệt sáng dài"],"answer": "A","explain": "Vật ngoài 2F cho ảnh thật nằm giữa F và 2F.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật là mũi tên đặt vuông góc với trục chính thì ảnh của nó:","options": ["A. Cũng vuông góc với trục chính","B. Song song với trục chính","C. Nghiêng một góc","D. Là một điểm"],"answer": "A","explain": "Ảnh của mũi tên vuông góc cũng vuông góc với trục chính.","points": 0.25},{"type": "mcq","level": "NB","q": "Để vẽ ảnh của vật qua thấu kính, ta thường dùng:","options": ["A. 2 trong 3 tia đặc biệt","B. 1 tia đặc biệt","C. 4 tia đặc biệt","D. Không cần tia nào"],"answer": "A","explain": "Dùng 2 trong 3 tia đặc biệt, giao điểm là ảnh.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về các yếu tố của thấu kính.","statements": ["a) Trục chính vuông góc với thấu kính tại quang tâm.","b) Mọi tia đi qua quang tâm đều truyền thẳng.","c) Thấu kính hội tụ có hai tiêu điểm đối xứng qua quang tâm.","d) Tiêu cự của thấu kính phân kì là khoảng cách từ quang tâm đến tiêu điểm ảo."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về cách vẽ ảnh.","statements": ["a) Vẽ ảnh dùng 2 trong 3 tia đặc biệt, giao nhau tại ảnh.","b) Ảnh thật là giao điểm của chùm tia ló.","c) Ảnh ảo là giao điểm của đường kéo dài các tia ló.","d) Chỉ cần 1 tia đặc biệt là vẽ được ảnh."],"answer": ["T","T","T","F"],"explain": "Cần ít nhất 2 tia mới xác định được giao điểm.","points": 1},{"type": "short","level": "NB","q": "Đường thẳng đi qua quang tâm và vuông góc với thấu kính gọi là gì?","answer": "Trục chính","explain": "Đó là trục chính.","points": 0.5},{"type": "short","level": "TH","q": "Điểm nằm giữa thấu kính mà mọi tia sáng đi qua đều truyền thẳng gọi là gì?","answer": "Quang tâm","explain": "Đó là quang tâm O.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "TH","q": "Thấu kính nào sau đây là thấu kính hội tụ?","options": ["A. Kính lúp","B. Kính cận","C. Kính râm","D. Gương phẳng"],"answer": "A","explain": "Kính lúp là thấu kính hội tụ.","points": 0.25},{"type": "mcq","level": "NB","q": "Thấu kính nào sau đây là thấu kính phân kì?","options": ["A. Kính cận","B. Kính lúp","C. Kính lão","D. Kính hiển vi"],"answer": "A","explain": "Kính cận là thấu kính phân kì.","points": 0.25},{"type": "mcq","level": "VD","q": "Muốn dùng ánh sáng Mặt Trời để đốt cháy một mẩu giấy, ta dùng:","options": ["A. Thấu kính hội tụ hứng chùm tia Mặt Trời tại tiêu điểm","B. Thấu kính phân kì","C. Gương phẳng","D. Tấm kính trắng"],"answer": "A","explain": "Thấu kính hội tụ hội tụ năng lượng tại tiêu điểm.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao thấu kính hội tụ có thể đốt cháy được mẩu giấy?","options": ["A. Vì nó hội tụ năng lượng ánh sáng tại tiêu điểm","B. Vì nó làm giấy nóng lên do ma sát","C. Vì nó phát ra lửa","D. Vì nó hấp thụ nhiệt"],"answer": "A","explain": "Năng lượng tập trung tại tiêu điểm đủ đốt cháy giấy.","points": 0.25},{"type": "mcq","level": "TH","q": "Chùm sáng Mặt Trời chiếu đến Trái Đất có thể coi là:","options": ["A. Chùm song song","B. Chùm hội tụ","C. Chùm phân kì","D. Chùm hỗn loạn"],"answer": "A","explain": "Mặt Trời ở rất xa nên chùm sáng coi như song song.","points": 0.25},{"type": "mcq","level": "NB","q": "Đặt thấu kính hội tụ hứng ánh sáng Mặt Trời, vệt sáng nhỏ nhất và sáng nhất trên màn ở:","options": ["A. Tiêu điểm của thấu kính","B. Quang tâm","C. Rìa thấu kính","D. Bất kì đâu"],"answer": "A","explain": "Chùm song song hội tụ tại tiêu điểm.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về thấu kính trong đời sống.","statements": ["a) Kính lúp là thấu kính hội tụ.","b) Kính cận là thấu kính phân kì.","c) Thấu kính hội tụ hội tụ ánh sáng Mặt Trời đốt cháy được giấy.","d) Thấu kính phân kì cũng đốt cháy được giấy."],"answer": ["T","T","T","F"],"explain": "Thấu kính phân kì làm phân tán năng lượng.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về đốt giấy bằng thấu kính.","statements": ["a) Chùm sáng Mặt Trời coi như chùm song song.","b) Thấu kính hội tụ biến chùm song song thành chùm hội tụ tại F.","c) Năng lượng tập trung tại tiêu điểm đủ đốt cháy giấy.","d) Đặt giấy tại quang tâm cũng cháy được."],"answer": ["T","T","T","F"],"explain": "Phải đặt giấy tại tiêu điểm mới cháy được.","points": 1},{"type": "short","level": "VD","q": "Muốn dùng ánh sáng Mặt Trời để đốt cháy mẩu giấy, ta dùng thấu kính hội tụ hay phân kì?","answer": "Thấu kính hội tụ","explain": "Dùng thấu kính hội tụ.","points": 0.5},{"type": "short","level": "VDC","q": "Đặt mẩu giấy ở vị trí nào của thấu kính hội tụ để hứng được chùm sáng Mặt Trời hội tụ mạnh nhất?","answer": "Tiêu điểm","explain": "Đặt tại tiêu điểm F.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Ảnh thật khác ảnh ảo ở điểm cơ bản nào?","options": ["A. Ảnh thật hứng được trên màn, ảnh ảo thì không","B. Ảnh thật luôn lớn hơn ảnh ảo","C. Ảnh thật luôn ngược chiều","D. Ảnh ảo luôn nhỏ hơn"],"answer": "A","explain": "Ảnh thật hứng được trên màn, ảnh ảo không.","points": 0.25},{"type": "mcq","level": "TH","q": "Ảnh của vật qua thấu kính phân kì:","options": ["A. Luôn là ảnh ảo","B. Có thể là ảnh thật","C. Luôn là ảnh thật","D. Không có ảnh"],"answer": "A","explain": "Thấu kính phân kì luôn cho ảnh ảo.","points": 0.25},{"type": "mcq","level": "VD","q": "Vật đặt rất gần thấu kính hội tụ (d rất nhỏ), ảnh thu được là:","options": ["A. Ảo, cùng chiều, lớn hơn vật","B. Thật, ngược chiều, nhỏ hơn vật","C. Thật, cùng chiều, bằng vật","D. Không có ảnh"],"answer": "A","explain": "Vật trong F cho ảnh ảo, cùng chiều, lớn hơn vật.","points": 0.25},{"type": "mcq","level": "VDC","q": "Dịch vật từ rất xa lại gần thấu kính hội tụ, ảnh thật sẽ:","options": ["A. Dịch ra xa thấu kính và lớn dần","B. Dịch lại gần thấu kính","C. Nhỏ dần","D. Biến thành ảnh ảo ngay"],"answer": "A","explain": "Vật lại gần thì ảnh thật ra xa và lớn dần.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi vật ở rất xa (vô cực), ảnh qua thấu kính hội tụ ở:","options": ["A. Tiêu điểm","B. Quang tâm","C. Vô cực","D. Rìa thấu kính"],"answer": "A","explain": "Vật ở vô cực cho ảnh tại tiêu điểm.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật tiến dần về tiêu điểm F, ảnh thật sẽ:","options": ["A. Tiến ra xa vô cực và lớn dần","B. Tiến lại gần thấu kính","C. Nhỏ dần","D. Biến mất"],"answer": "A","explain": "Vật ở F cho ảnh ở vô cực.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về ảnh thật và ảnh ảo.","statements": ["a) Ảnh thật hứng được trên màn.","b) Ảnh ảo không hứng được trên màn.","c) Vật ở vô cực cho ảnh tại tiêu điểm.","d) Thấu kính phân kì cho ảnh thật khi vật ở xa."],"answer": ["T","T","T","F"],"explain": "Thấu kính phân kì không bao giờ cho ảnh thật.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về sự dịch chuyển của ảnh.","statements": ["a) Dịch vật lại gần thấu kính hội tụ, ảnh thật ra xa và lớn dần.","b) Vật ở F cho ảnh ở vô cực.","c) Vật qua F vào trong, ảnh chuyển thành ảnh ảo.","d) Thấu kính phân kì: vật càng xa thì ảnh ảo càng lớn."],"answer": ["T","T","T","F"],"explain": "Vật càng xa thì ảnh ảo càng gần tiêu điểm và càng nhỏ.","points": 1},{"type": "short","level": "VD","q": "Ảnh thật và ảnh ảo khác nhau cơ bản ở điểm nào?","answer": "Ảnh thật hứng được trên màn, ảnh ảo thì không","explain": "Đó là điểm khác biệt cơ bản.","points": 0.5},{"type": "short","level": "VDC","q": "Vật ở rất xa thấu kính hội tụ cho ảnh ở vị trí nào?","answer": "Tiêu điểm","explain": "Vật ở vô cực cho ảnh tại tiêu điểm.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "TH","q": "Trong 3 tia đặc biệt của thấu kính hội tụ, tia nào KHÔNG bị đổi hướng?","options": ["A. Tia đi qua quang tâm","B. Tia song song với trục chính","C. Tia đi qua tiêu điểm","D. Không có tia nào"],"answer": "A","explain": "Tia qua quang tâm truyền thẳng.","points": 0.25},{"type": "mcq","level": "NB","q": "Tia tới song song với trục chính của thấu kính phân kì thì tia ló:","options": ["A. Có đường kéo dài đi qua tiêu điểm","B. Đi qua tiêu điểm thật","C. Song song với trục chính","D. Đi qua quang tâm"],"answer": "A","explain": "Đường kéo dài của tia ló qua tiêu điểm ảo.","points": 0.25},{"type": "mcq","level": "VD","q": "Tia tới hướng vào tiêu điểm phía sau của thấu kính phân kì thì tia ló:","options": ["A. Song song với trục chính","B. Đi qua tiêu điểm","C. Đi qua quang tâm","D. Vuông góc với trục chính"],"answer": "A","explain": "Đó là tia đặc biệt thứ ba của thấu kính phân kì.","points": 0.25},{"type": "mcq","level": "VDC","q": "Chiếu chùm tia phân kì xuất phát từ tiêu điểm F của thấu kính hội tụ tới thấu kính, chùm tia ló sẽ:","options": ["A. Song song với nhau","B. Hội tụ","C. Phân kì mạnh hơn","D. Hội tụ tại F"],"answer": "A","explain": "Các tia qua F cho chùm ló song song.","points": 0.25},{"type": "mcq","level": "TH","q": "Tia tới đi qua tiêu điểm F của thấu kính hội tụ thì tia ló:","options": ["A. Song song với trục chính","B. Đi qua tiêu điểm còn lại","C. Đi qua quang tâm","D. Vuông góc với trục chính"],"answer": "A","explain": "Tia qua F cho tia ló song song với trục chính.","points": 0.25},{"type": "mcq","level": "NB","q": "Có mấy tia đặc biệt thường dùng để vẽ ảnh qua thấu kính?","options": ["A. 3 tia","B. 2 tia","C. 1 tia","D. 4 tia"],"answer": "A","explain": "Có 3 tia đặc biệt.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về các tia đặc biệt.","statements": ["a) Có 3 tia đặc biệt để vẽ ảnh qua thấu kính.","b) Tia qua quang tâm thì truyền thẳng.","c) Thấu kính hội tụ: tia song song với trục chính cho tia ló qua tiêu điểm.","d) Thấu kính phân kì: tia song song với trục chính cho tia ló qua tiêu điểm thật."],"answer": ["T","T","T","F"],"explain": "Thấu kính phân kì chỉ có tiêu điểm ảo.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về thấu kính phân kì.","statements": ["a) Tia tới hướng đến tiêu điểm phía sau cho tia ló song song với trục chính.","b) Đây là tia đặc biệt thứ ba của thấu kính phân kì.","c) Thấu kính hội tụ: tia qua F cho tia ló song song với trục chính.","d) Mọi tia ló của thấu kính phân kì đều phân kì."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "short","level": "NB","q": "Tia tới đi qua quang tâm của thấu kính thì tia ló như thế nào?","answer": "Truyền thẳng","explain": "Tia qua quang tâm truyền thẳng.","points": 0.5},{"type": "short","level": "TH","q": "Kể tên 3 tia đặc biệt dùng để vẽ ảnh qua thấu kính hội tụ.","answer": "Tia qua quang tâm, tia song song trục chính, tia qua tiêu điểm","explain": "Đó là 3 tia đặc biệt.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Thấu kính thường được làm bằng:","options": ["A. Vật liệu trong suốt như thủy tinh, nhựa","B. Kim loại","C. Gỗ","D. Giấy"],"answer": "A","explain": "Thấu kính làm bằng vật liệu trong suốt.","points": 0.25},{"type": "mcq","level": "TH","q": "Các mặt của thấu kính thường là:","options": ["A. Mặt cầu","B. Mặt phẳng","C. Mặt trụ","D. Mặt nón"],"answer": "A","explain": "Thấu kính thường có các mặt cầu.","points": 0.25},{"type": "mcq","level": "VD","q": "Một thấu kính có hai mặt đều lồi là thấu kính:","options": ["A. Hội tụ","B. Phân kì","C. Phẳng","D. Trụ"],"answer": "A","explain": "Hai mặt lồi, rìa mỏng là thấu kính hội tụ.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một thấu kính có hai mặt đều lõm là thấu kính:","options": ["A. Phân kì","B. Hội tụ","C. Phẳng","D. Trụ"],"answer": "A","explain": "Hai mặt lõm, rìa dày là thấu kính phân kì.","points": 0.25},{"type": "mcq","level": "TH","q": "Thấu kính một mặt lồi, một mặt lõm nhưng rìa mỏng hơn phần giữa là thấu kính:","options": ["A. Hội tụ","B. Phân kì","C. Phẳng","D. Không xác định"],"answer": "A","explain": "Rìa mỏng hơn giữa là thấu kính hội tụ.","points": 0.25},{"type": "mcq","level": "NB","q": "Cách nhận biết nhanh thấu kính hội tụ và phân kì bằng mắt thường là:","options": ["A. Nhìn độ dày của rìa so với phần giữa","B. Nhìn màu sắc","C. Ngửi mùi","D. Gõ nghe tiếng"],"answer": "A","explain": "So sánh độ dày rìa và giữa.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về cấu tạo thấu kính.","statements": ["a) Thấu kính làm bằng vật liệu trong suốt.","b) Hai mặt của thấu kính thường là mặt cầu.","c) Thấu kính hai mặt lồi là thấu kính hội tụ.","d) Thấu kính hai mặt lõm là thấu kính hội tụ."],"answer": ["T","T","T","F"],"explain": "Hai mặt lõm là thấu kính phân kì.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về nhận biết thấu kính.","statements": ["a) Rìa mỏng hơn giữa là thấu kính hội tụ.","b) Rìa dày hơn giữa là thấu kính phân kì.","c) Có thể nhận biết bằng cách sờ nắn.","d) Mọi thấu kính hội tụ đều có hai mặt lồi."],"answer": ["T","T","T","F"],"explain": "Có thấu kính hội tụ một mặt lồi một mặt lõm (rìa vẫn mỏng hơn).","points": 1},{"type": "short","level": "NB","q": "Thấu kính thường được làm bằng vật liệu gì?","answer": "Vật liệu trong suốt","explain": "Thấu kính làm bằng vật liệu trong suốt.","points": 0.5},{"type": "short","level": "TH","q": "Thấu kính có hai mặt đều lõm là thấu kính hội tụ hay phân kì?","answer": "Thấu kính phân kì","explain": "Hai mặt lõm là thấu kính phân kì.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Kính lúp là:","options": ["A. Thấu kính hội tụ có tiêu cự ngắn","B. Thấu kính phân kì","C. Gương cầu","D. Lăng kính"],"answer": "A","explain": "Kính lúp là thấu kính hội tụ tiêu cự ngắn.","points": 0.25},{"type": "mcq","level": "TH","q": "Để quan sát vật nhỏ bằng kính lúp, ta đặt vật:","options": ["A. Trong khoảng tiêu cự của kính","B. Ngoài khoảng 2F","C. Tại tiêu điểm","D. Rất xa kính"],"answer": "A","explain": "Vật trong F cho ảnh ảo lớn hơn.","points": 0.25},{"type": "mcq","level": "VD","q": "Kính lúp cho ảnh có tính chất:","options": ["A. Ảo, cùng chiều, lớn hơn vật","B. Thật, ngược chiều, nhỏ hơn vật","C. Thật, cùng chiều, bằng vật","D. Ảo, ngược chiều, nhỏ hơn vật"],"answer": "A","explain": "Kính lúp cho ảnh ảo, cùng chiều, lớn hơn vật.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao kính lúp giúp ta nhìn rõ được vật nhỏ?","options": ["A. Vì tạo ra ảnh ảo lớn hơn, góc trông vật lớn hơn","B. Vì làm vật to ra thật","C. Vì phát sáng","D. Vì làm mắt sáng hơn"],"answer": "A","explain": "Ảnh ảo lớn làm tăng góc trông.","points": 0.25},{"type": "mcq","level": "TH","q": "Số bội giác của kính lúp cho biết:","options": ["A. Độ phóng đại khi ngắm chừng ở cực cận","B. Tiêu cự của kính","C. Đường kính của kính","D. Khối lượng của kính"],"answer": "A","explain": "Số bội giác cho biết độ phóng đại.","points": 0.25},{"type": "mcq","level": "NB","q": "Kính lúp 3x có số bội giác là:","options": ["A. 3","B. 30","C. 1/3","D. 300"],"answer": "A","explain": "Kính 3x có số bội giác G = 3.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về kính lúp.","statements": ["a) Kính lúp là thấu kính hội tụ có tiêu cự ngắn.","b) Vật đặt trong khoảng tiêu cự cho ảnh ảo lớn hơn vật.","c) Số bội giác cho biết độ phóng đại.","d) Kính lúp là thấu kính phân kì."],"answer": ["T","T","T","F"],"explain": "Kính lúp là thấu kính hội tụ.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về kính lúp.","statements": ["a) Ngắm chừng là điều chỉnh để nhìn rõ ảnh.","b) Kính lúp 2x phóng đại gấp 2 lần.","c) Tiêu cự càng ngắn thì số bội giác càng lớn.","d) Đặt vật ngoài F vẫn quan sát được bằng kính lúp."],"answer": ["T","T","T","F"],"explain": "Vật ngoài F cho ảnh thật, không dùng làm kính lúp được.","points": 1},{"type": "short","level": "NB","q": "Kính lúp là thấu kính hội tụ hay phân kì?","answer": "Thấu kính hội tụ","explain": "Kính lúp là thấu kính hội tụ.","points": 0.5},{"type": "short","level": "TH","q": "Khi dùng kính lúp, ta đặt vật ở vị trí nào so với kính?","answer": "Trong khoảng tiêu cự","explain": "Đặt vật trong khoảng tiêu cự.","points": 0.5}]}]}
