{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Mục đích của bài thực hành này là:","options": ["A. Đo tiêu cự của thấu kính hội tụ","B. Đo khối lượng của thấu kính","C. Đo nhiệt độ phòng","D. Đo vận tốc ánh sáng"],"answer": "A","explain": "Bài thực hành nhằm đo tiêu cự của thấu kính hội tụ.","points": 0.25},{"type": "mcq","level": "TH","q": "Dụng cụ nào sau đây KHÔNG cần thiết trong bài thực hành?","options": ["A. Thấu kính hội tụ","B. Màn hứng ảnh","C. Nhiệt kế","D. Thước đo"],"answer": "C","explain": "Không cần nhiệt kế trong bài thực hành này.","points": 0.25},{"type": "mcq","level": "VD","q": "Cơ sở lí thuyết của phương pháp đo là: vật ở rất xa thấu kính hội tụ cho ảnh:","options": ["A. Thật, hiện gần như tại tiêu điểm","B. Ảo, cùng chiều với vật","C. Thật, rất lớn","D. Không có ảnh"],"answer": "A","explain": "Vật ở xa cho ảnh thật tại tiêu điểm F.","points": 0.25},{"type": "mcq","level": "VDC","q": "Vì sao trong thí nghiệm lại dùng vật ở xa (cửa sổ, cây ngoài sân)?","options": ["A. Vì khi d rất lớn so với f thì ảnh hiện gần như tại tiêu điểm","B. Vì vật ở xa dễ nhìn","C. Vì vật ở xa cho ảnh lớn","D. Vì vật ở gần không cho ảnh"],"answer": "A","explain": "d rất lớn so với f thì d' xấp xỉ f, đo khoảng cách thấu kính-màn được tiêu cự.","points": 0.25},{"type": "mcq","level": "NB","q": "Màn hứng ảnh trong thí nghiệm dùng để:","options": ["A. Hứng ảnh thật của vật","B. Chắn ánh sáng","C. Làm vật sáng","D. Đo khoảng cách"],"answer": "A","explain": "Màn dùng để hứng ảnh thật.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi ảnh của vật ở xa hiện rõ nét nhất trên màn, khoảng cách từ thấu kính đến màn bằng:","options": ["A. Tiêu cự f của thấu kính","B. Hai lần tiêu cự","C. Một nửa tiêu cự","D. Không xác định"],"answer": "A","explain": "Khoảng cách đó xấp xỉ bằng tiêu cự f.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về bài thực hành.","statements": ["a) Mục đích của bài là đo tiêu cự của thấu kính hội tụ.","b) Dụng cụ cần: thấu kính hội tụ, vật sáng, màn, thước.","c) Vật ở rất xa cho ảnh thật tại tiêu điểm.","d) Đo khoảng cách thấu kính-màn khi ảnh rõ nét nhất được tiêu cự."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về tiến hành thí nghiệm.","statements": ["a) Có thể dùng cửa sổ lớp học làm vật ở xa.","b) Điều chỉnh màn đến khi ảnh hiện rõ nét nhất.","c) Đo nhiều lần rồi lấy trung bình cho chính xác.","d) Chỉ cần đo một lần là đủ chính xác."],"answer": ["T","T","T","F"],"explain": "Nên đo nhiều lần lấy trung bình để giảm sai số.","points": 1},{"type": "short","level": "NB","q": "Bài thực hành này nhằm đo đại lượng nào của thấu kính hội tụ?","answer": "Tiêu cự","explain": "Đo tiêu cự f của thấu kính hội tụ.","points": 0.5},{"type": "short","level": "TH","q": "Khi ảnh của vật ở xa hiện rõ nét nhất trên màn, khoảng cách từ thấu kính đến màn bằng gì?","answer": "Tiêu cự","explain": "Khoảng cách đó bằng tiêu cự của thấu kính.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "TH","q": "Để có vật ở xa trong thí nghiệm, ta có thể dùng:","options": ["A. Ngọn nến đặt sát thấu kính","B. Cửa sổ lớp học, cây ngoài sân","C. Quyển sách trên bàn","D. Bàn tay"],"answer": "B","explain": "Cửa sổ, cây ngoài sân là những vật ở xa.","points": 0.25},{"type": "mcq","level": "NB","q": "Giá quang học trong thí nghiệm dùng để:","options": ["A. Giữ thấu kính, vật và màn thẳng hàng","B. Đo khoảng cách","C. Hứng ảnh","D. Phát sáng"],"answer": "A","explain": "Giá quang học giữ các dụng cụ thẳng hàng trên trục chính.","points": 0.25},{"type": "mcq","level": "VD","q": "Đo được khoảng cách từ thấu kính đến màn là 12 cm khi ảnh rõ nét nhất. Tiêu cự của thấu kính là:","options": ["A. 12 cm","B. 24 cm","C. 6 cm","D. 120 cm"],"answer": "A","explain": "Khoảng cách đó xấp xỉ bằng tiêu cự: f ≈ 12 cm.","points": 0.25},{"type": "mcq","level": "VDC","q": "Đo 3 lần được các kết quả: 11,8 cm; 12,1 cm; 12,0 cm. Giá trị trung bình là:","options": ["A. Khoảng 12,0 cm","B. 11,8 cm","C. 12,1 cm","D. 36 cm"],"answer": "A","explain": "Trung bình = (11,8 + 12,1 + 12,0)/3 ≈ 12,0 cm.","points": 0.25},{"type": "mcq","level": "TH","q": "Vì sao phải đo nhiều lần rồi lấy trung bình?","options": ["A. Để giảm sai số ngẫu nhiên","B. Để tốn thời gian","C. Để làm đẹp báo cáo","D. Không vì lí do gì"],"answer": "A","explain": "Đo nhiều lần lấy trung bình giúp giảm sai số ngẫu nhiên.","points": 0.25},{"type": "mcq","level": "NB","q": "Thước đo trong thí nghiệm dùng để đo:","options": ["A. Khoảng cách từ thấu kính đến màn","B. Khối lượng thấu kính","C. Nhiệt độ","D. Thời gian"],"answer": "A","explain": "Thước đo khoảng cách thấu kính-màn.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về xử lí kết quả.","statements": ["a) Đo 3 lần được 11,8 cm; 12,1 cm; 12,0 cm thì trung bình là 12,0 cm.","b) Đo nhiều lần giúp giảm sai số ngẫu nhiên.","c) Kết quả mỗi lần đo luôn giống hệt nhau.","d) Cần ghi chép cẩn thận kết quả mỗi lần đo."],"answer": ["T","T","F","T"],"explain": "Các lần đo có thể chênh lệch chút ít do sai số.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về sai số.","statements": ["a) Đặt mắt đọc thước không vuông góc gây sai số.","b) Xác định ảnh rõ nét nhất bằng mắt gây sai số.","c) Làm tròn kết quả đến mm là hợp lí.","d) Khi báo cáo không cần ghi đơn vị đo."],"answer": ["T","T","T","F"],"explain": "Báo cáo phải ghi đầy đủ đơn vị đo.","points": 1},{"type": "short","level": "VD","q": "Đo 3 lần được 10,1 cm; 9,9 cm; 10,0 cm. Tiêu cự trung bình là bao nhiêu xăngtimét?","answer": "10,0","explain": "Trung bình = (10,1 + 9,9 + 10,0)/3 = 10,0 cm.","points": 0.5},{"type": "short","level": "VDC","q": "Nêu một nguyên nhân gây sai số trong bài thực hành này.","answer": "Xác định ảnh rõ nét nhất bằng mắt","explain": "Việc xác định bằng mắt gây sai số chủ quan.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Vật sáng trong thí nghiệm có thể là:","options": ["A. Ngọn nến, bóng đèn, cửa sổ","B. Cục đá","C. Quyển vở","D. Bàn ghế"],"answer": "A","explain": "Vật sáng có thể là nến, bóng đèn, cửa sổ...","points": 0.25},{"type": "mcq","level": "TH","q": "Khi dùng ngọn nến làm vật sáng, cần đặt nến:","options": ["A. Rất xa thấu kính","B. Sát thấu kính","C. Chạm vào thấu kính","D. Sau thấu kính"],"answer": "A","explain": "Nến phải đặt xa để ảnh hiện gần tiêu điểm.","points": 0.25},{"type": "mcq","level": "VD","q": "Nếu đặt ngọn nến quá gần thấu kính (trong khoảng tiêu cự), trên màn sẽ:","options": ["A. Không hứng được ảnh (vì ảnh là ảo)","B. Hiện ảnh thật rõ nét","C. Hiện ảnh thật rất lớn","D. Hiện vệt sáng mờ"],"answer": "A","explain": "Vật trong F cho ảnh ảo, không hứng được trên màn.","points": 0.25},{"type": "mcq","level": "VDC","q": "Muốn hứng được ảnh trên màn, vật phải được đặt:","options": ["A. Ngoài khoảng tiêu cự","B. Trong khoảng tiêu cự","C. Tại quang tâm","D. Tại tiêu điểm"],"answer": "A","explain": "Vật ngoài F mới cho ảnh thật hứng được trên màn.","points": 0.25},{"type": "mcq","level": "TH","q": "Ảnh của vật ở xa qua thấu kính hội tụ là ảnh:","options": ["A. Thật, ngược chiều, nhỏ","B. Ảo, cùng chiều, lớn","C. Thật, cùng chiều, lớn","D. Ảo, ngược chiều, nhỏ"],"answer": "A","explain": "Vật ở xa cho ảnh thật, ngược chiều, nhỏ.","points": 0.25},{"type": "mcq","level": "NB","q": "Màn hứng ảnh nên được đặt:","options": ["A. Vuông góc với trục chính","B. Song song với trục chính","C. Nghiêng một góc bất kì","D. Sau lưng người quan sát"],"answer": "A","explain": "Màn đặt vuông góc với trục chính.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về vật sáng và màn.","statements": ["a) Nến, bóng đèn, cửa sổ đều có thể làm vật sáng.","b) Vật phải đặt ở xa thấu kính.","c) Ảnh hiện trên màn là ảnh thật.","d) Màn đặt song song với trục chính."],"answer": ["T","T","T","F"],"explain": "Màn phải đặt vuông góc với trục chính.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về vị trí vật.","statements": ["a) Vật trong F cho ảnh ảo, không hứng được trên màn.","b) Muốn có ảnh trên màn, vật phải đặt ngoài F.","c) Ảnh của vật ở xa là ảnh thật nhỏ.","d) Vật càng xa thì ảnh càng lớn."],"answer": ["T","T","T","F"],"explain": "Vật càng xa thì ảnh càng nhỏ, càng gần tiêu điểm.","points": 1},{"type": "short","level": "NB","q": "Ảnh hứng được trên màn là ảnh thật hay ảnh ảo?","answer": "Ảnh thật","explain": "Ảnh hứng được trên màn là ảnh thật.","points": 0.5},{"type": "short","level": "TH","q": "Muốn hứng được ảnh trên màn, phải đặt vật ở ngoài hay trong khoảng tiêu cự?","answer": "Ngoài khoảng tiêu cự","explain": "Vật ngoài F mới cho ảnh thật.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "TH","q": "Một cách khác để đo tiêu cự: điều chỉnh để ảnh thật trên màn cao bằng vật, khi đó vật cách thấu kính:","options": ["A. d = 2f","B. d = f","C. d = 3f","D. d = f/2"],"answer": "A","explain": "Ảnh thật bằng vật khi vật đặt tại 2F.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật đặt tại 2F của thấu kính hội tụ, ảnh thu được là:","options": ["A. Thật, ngược chiều, bằng vật, tại 2F phía bên kia","B. Ảo, cùng chiều, lớn hơn vật","C. Thật, cùng chiều, nhỏ hơn vật","D. Không có ảnh"],"answer": "A","explain": "Tại 2F: ảnh thật, ngược chiều, bằng vật.","points": 0.25},{"type": "mcq","level": "VD","q": "Điều chỉnh để ảnh thật trên màn cao bằng vật, đo được vật cách thấu kính 30 cm. Tiêu cự của thấu kính là:","options": ["A. 15 cm","B. 30 cm","C. 60 cm","D. 7,5 cm"],"answer": "A","explain": "d = 2f = 30 cm, suy ra f = 15 cm.","points": 0.25},{"type": "mcq","level": "VDC","q": "So sánh phương pháp vật ở xa với phương pháp ảnh bằng vật:","options": ["A. Phương pháp vật ở xa đơn giản hơn nhưng kém chính xác hơn một chút","B. Phương pháp vật ở xa phức tạp hơn","C. Hai phương pháp khó như nhau","D. Phương pháp ảnh bằng vật không dùng được"],"answer": "A","explain": "Vật ở xa đơn giản, nhanh; ảnh bằng vật chính xác hơn.","points": 0.25},{"type": "mcq","level": "TH","q": "Ưu điểm của phương pháp dùng vật ở xa là:","options": ["A. Đơn giản, thực hiện nhanh","B. Rất chính xác","C. Không cần màn","D. Không cần thước"],"answer": "A","explain": "Phương pháp này đơn giản, nhanh gọn.","points": 0.25},{"type": "mcq","level": "NB","q": "Nhược điểm của phương pháp dùng vật ở xa là:","options": ["A. Ảnh nhỏ, khó xác định vị trí rõ nét nhất","B. Cần nhiều dụng cụ","C. Tốn thời gian","D. Không đo được"],"answer": "A","explain": "Ảnh nhỏ nên khó xác định chính xác vị trí rõ nét nhất.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về phương pháp ảnh bằng vật.","statements": ["a) Ảnh thật bằng vật khi vật đặt tại 2F.","b) Đo được d khi ảnh bằng vật thì suy ra f = d/2.","c) Phương pháp vật ở xa đơn giản hơn.","d) Phương pháp ảnh bằng vật kém chính xác hơn phương pháp vật ở xa."],"answer": ["T","T","T","F"],"explain": "Phương pháp ảnh bằng vật thường chính xác hơn.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về các phương pháp đo.","statements": ["a) Cả hai phương pháp đều dựa trên tính chất tạo ảnh của thấu kính hội tụ.","b) Phương pháp ảnh bằng vật cho f = d/2.","c) Nên kết hợp cả hai phương pháp để kiểm tra chéo.","d) Chỉ có một cách duy nhất để đo tiêu cự."],"answer": ["T","T","T","F"],"explain": "Có nhiều cách đo tiêu cự khác nhau.","points": 1},{"type": "short","level": "VD","q": "Khi ảnh thật trên màn cao bằng vật, vật cách thấu kính 24 cm. Tiêu cự của thấu kính là bao nhiêu xăngtimét?","answer": "12","explain": "d = 2f = 24 cm, suy ra f = 12 cm.","points": 0.5},{"type": "short","level": "VDC","q": "Nêu một phương pháp khác để đo tiêu cự của thấu kính hội tụ.","answer": "Điều chỉnh để ảnh thật bằng vật rồi lấy f = d/2","explain": "Khi ảnh thật bằng vật thì d = 2f.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Khi thực hành với ngọn nến, cần chú ý an toàn:","options": ["A. Cẩn thận với lửa, không để gần vật dễ cháy","B. Để nến gần rèm cửa","C. Đùa nghịch với lửa","D. Thổi nến thật mạnh"],"answer": "A","explain": "Phải cẩn thận với lửa, tránh vật dễ cháy.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi dùng ánh sáng Mặt Trời làm vật ở xa, cần chú ý:","options": ["A. Không nhìn trực tiếp vào Mặt Trời qua thấu kính","B. Nhìn thẳng vào Mặt Trời","C. Để thấu kính ngoài nắng lâu","D. Không cần chú ý gì"],"answer": "A","explain": "Chùm sáng hội tụ rất mạnh, gây hại cho mắt.","points": 0.25},{"type": "mcq","level": "VD","q": "Vì sao không được nhìn trực tiếp vào chùm sáng hội tụ qua thấu kính?","options": ["A. Vì gây hại cho mắt","B. Vì chùm sáng quá đẹp","C. Vì sẽ làm hỏng thấu kính","D. Vì không nhìn thấy gì"],"answer": "A","explain": "Năng lượng tập trung cao gây tổn thương mắt.","points": 0.25},{"type": "mcq","level": "VDC","q": "Sau khi làm thí nghiệm xong, cần:","options": ["A. Tắt nến, thu dọn dụng cụ gọn gàng","B. Bỏ đi ngay","C. Để nguyên hiện trường","D. Vứt thấu kính đi"],"answer": "A","explain": "Tắt nến và thu dọn dụng cụ sau thí nghiệm.","points": 0.25},{"type": "mcq","level": "TH","q": "Thấu kính sau khi dùng nên được:","options": ["A. Lau sạch, cất cẩn thận","B. Để bừa bãi","C. Ngâm nước","D. Phơi nắng"],"answer": "A","explain": "Lau sạch và cất cẩn thận để dùng lần sau.","points": 0.25},{"type": "mcq","level": "NB","q": "Báo cáo thực hành gồm các nội dung:","options": ["A. Mục đích, dụng cụ, các bước, kết quả, nhận xét","B. Chỉ ghi kết quả","C. Chỉ vẽ hình","D. Không cần báo cáo"],"answer": "A","explain": "Báo cáo đầy đủ các nội dung trên.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về an toàn thực hành.","statements": ["a) Cẩn thận với lửa khi dùng nến.","b) Không nhìn trực tiếp vào chùm sáng mạnh.","c) Thu dọn dụng cụ sau thí nghiệm.","d) Có thể đùa nghịch với lửa nến."],"answer": ["T","T","T","F"],"explain": "Tuyệt đối không đùa nghịch với lửa.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về báo cáo thực hành.","statements": ["a) Báo cáo ghi đầy đủ các bước tiến hành.","b) Bảng kết quả ghi các lần đo.","c) Nhận xét về sai số và cách khắc phục.","d) Khi báo cáo không cần ghi đơn vị đo."],"answer": ["T","T","T","F"],"explain": "Báo cáo phải ghi đầy đủ đơn vị đo.","points": 1},{"type": "short","level": "NB","q": "Khi dùng nến trong thí nghiệm cần chú ý an toàn gì?","answer": "Cẩn thận với lửa","explain": "Phải cẩn thận với lửa.","points": 0.5},{"type": "short","level": "TH","q": "Báo cáo thực hành cần có những nội dung nào?","answer": "Mục đích, dụng cụ, các bước, kết quả, nhận xét","explain": "Đó là các nội dung của báo cáo.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "TH","q": "Nếu thấu kính bị xước, kết quả thí nghiệm sẽ:","options": ["A. Ảnh bị mờ, khó xác định vị trí rõ nét nhất","B. Không ảnh hưởng gì","C. Ảnh to hơn","D. Ảnh nhỏ hơn"],"answer": "A","explain": "Thấu kính xước làm ảnh mờ.","points": 0.25},{"type": "mcq","level": "NB","q": "Trước khi đo, cần kiểm tra thấu kính:","options": ["A. Sạch, không bị xước","B. Có màu sắc đẹp","C. Có nặng không","D. Có đắt không"],"answer": "A","explain": "Thấu kính phải sạch và không xước.","points": 0.25},{"type": "mcq","level": "VD","q": "Màn hứng ảnh nên có màu:","options": ["A. Trắng để dễ quan sát ảnh","B. Đen","C. Đỏ","D. Xanh"],"answer": "A","explain": "Màn trắng giúp quan sát ảnh rõ.","points": 0.25},{"type": "mcq","level": "VDC","q": "Phòng làm thí nghiệm nên:","options": ["A. Hơi tối để quan sát ảnh rõ hơn","B. Càng sáng càng tốt","C. Mở hết cửa sổ","D. Bật tất cả đèn"],"answer": "A","explain": "Phòng hơi tối giúp ảnh nổi bật, dễ quan sát.","points": 0.25},{"type": "mcq","level": "TH","q": "Vì sao phòng hơi tối giúp quan sát ảnh tốt hơn?","options": ["A. Vì ảnh nổi bật trên nền tối","B. Vì thấu kính hoạt động tốt hơn","C. Vì mắt nhìn rõ hơn","D. Vì không khí mát hơn"],"answer": "A","explain": "Ảnh sáng nổi bật trên nền tối.","points": 0.25},{"type": "mcq","level": "NB","q": "Giá đỡ các dụng cụ thí nghiệm phải:","options": ["A. Chắc chắn, cố định","B. Lung lay","C. Thật cao","D. Thật thấp"],"answer": "A","explain": "Giá đỡ phải chắc chắn để kết quả ổn định.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về chuẩn bị thí nghiệm.","statements": ["a) Thấu kính bị xước làm ảnh bị mờ.","b) Màn trắng giúp dễ quan sát ảnh.","c) Phòng hơi tối giúp thấy ảnh rõ hơn.","d) Giá đỡ lung lay không ảnh hưởng kết quả."],"answer": ["T","T","T","F"],"explain": "Giá đỡ lung lay làm kết quả thiếu ổn định.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về kĩ năng thực hành.","statements": ["a) Chuẩn bị tốt giúp giảm sai số.","b) Kiểm tra dụng cụ trước khi đo.","c) Ghi chép ngay kết quả đo được.","d) Đo một lần rồi kết luận ngay là đủ."],"answer": ["T","T","T","F"],"explain": "Nên đo nhiều lần lấy trung bình.","points": 1},{"type": "short","level": "VD","q": "Vì sao nên làm thí nghiệm trong phòng hơi tối?","answer": "Để quan sát ảnh rõ nét hơn","explain": "Phòng tối giúp ảnh nổi bật, dễ quan sát.","points": 0.5},{"type": "short","level": "VDC","q": "Màn hứng ảnh nên có màu gì? Vì sao?","answer": "Màu trắng để dễ quan sát ảnh","explain": "Màn trắng giúp nhìn rõ ảnh.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Tiêu cự của kính lúp thường:","options": ["A. Ngắn (dưới 10 cm)","B. Rất dài (trên 1 m)","C. Bằng 0","D. Vô cực"],"answer": "A","explain": "Kính lúp có tiêu cự ngắn, dưới 10 cm.","points": 0.25},{"type": "mcq","level": "TH","q": "Có thể đo tiêu cự của kính lúp bằng phương pháp vật ở xa không?","options": ["A. Được, vì kính lúp là thấu kính hội tụ","B. Không được","C. Chỉ đo được ban đêm","D. Chỉ đo được ban ngày"],"answer": "A","explain": "Kính lúp là thấu kính hội tụ nên đo được.","points": 0.25},{"type": "mcq","level": "VD","q": "Đo được tiêu cự của một kính lúp là 8 cm. Số bội giác của kính là:","options": ["A. Khoảng 3x","B. 2x","C. 5x","D. 8x"],"answer": "A","explain": "G = 25/8 = 3,125, khoảng 3x.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một kính lúp ghi 5x. Tiêu cự của kính là:","options": ["A. 5 cm","B. 125 cm","C. 0,2 cm","D. 30 cm"],"answer": "A","explain": "f = 25/5 = 5 cm.","points": 0.25},{"type": "mcq","level": "TH","q": "Công thức G = 25/f (f tính bằng cm) cho biết:","options": ["A. Số bội giác của kính lúp","B. Tiêu cự của kính","C. Đường kính của kính","D. Khối lượng của kính"],"answer": "A","explain": "Đó là công thức tính số bội giác.","points": 0.25},{"type": "mcq","level": "NB","q": "Kính lúp 2x có tiêu cự là:","options": ["A. 12,5 cm","B. 50 cm","C. 2 cm","D. 27 cm"],"answer": "A","explain": "f = 25/2 = 12,5 cm.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về kính lúp.","statements": ["a) Số bội giác tính bằng G = 25/f (f tính bằng cm).","b) Kính 5x có tiêu cự 5 cm.","c) Kính 2x có tiêu cự 12,5 cm.","d) Tiêu cự càng dài thì số bội giác càng lớn."],"answer": ["T","T","T","F"],"explain": "Tiêu cự càng ngắn thì số bội giác càng lớn.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về đo tiêu cự kính lúp.","statements": ["a) Đo được tiêu cự thì tính được số bội giác.","b) Kính lúp là thấu kính hội tụ nên đo được bằng phương pháp vật ở xa.","c) Số bội giác càng lớn thì quan sát vật càng to.","d) Mọi kính lúp đều có cùng tiêu cự."],"answer": ["T","T","T","F"],"explain": "Mỗi kính lúp có tiêu cự khác nhau.","points": 1},{"type": "short","level": "VD","q": "Kính lúp có tiêu cự 5 cm thì số bội giác là bao nhiêu?","answer": "5","explain": "G = 25/5 = 5.","points": 0.5},{"type": "short","level": "VDC","q": "Viết công thức tính số bội giác G của kính lúp theo tiêu cự f (tính bằng cm).","answer": "G = 25/f","explain": "Công thức: G = 25/f.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "TH","q": "Có thể đo tiêu cự của thấu kính phân kì bằng phương pháp vật ở xa không?","options": ["A. Không, vì thấu kính phân kì không cho ảnh thật trên màn","B. Được bình thường","C. Được nếu màn đủ lớn","D. Được nếu vật đủ xa"],"answer": "A","explain": "Thấu kính phân kì chỉ cho ảnh ảo nên không hứng được trên màn.","points": 0.25},{"type": "mcq","level": "NB","q": "Vì sao thấu kính phân kì không cho ảnh thật trên màn?","options": ["A. Vì nó luôn cho ảnh ảo","B. Vì nó quá dày","C. Vì nó quá mỏng","D. Vì nó không trong suốt"],"answer": "A","explain": "Thấu kính phân kì luôn cho ảnh ảo.","points": 0.25},{"type": "mcq","level": "VD","q": "Muốn xác định tiêu cự của thấu kính phân kì, ta có thể:","options": ["A. Ghép nó với một thấu kính hội tụ đã biết tiêu cự","B. Dùng phương pháp vật ở xa trực tiếp","C. Đo bằng thước thẳng","D. Cân khối lượng"],"answer": "A","explain": "Ghép với thấu kính hội tụ để đo gián tiếp.","points": 0.25},{"type": "mcq","level": "VDC","q": "Ghép một thấu kính phân kì với một thấu kính hội tụ (f1 = 20 cm) được hệ hội tụ có tiêu cự 30 cm. Độ lớn tiêu cự của thấu kính phân kì là:","options": ["A. 60 cm","B. 10 cm","C. 50 cm","D. 20 cm"],"answer": "A","explain": "1/30 = 1/20 + 1/f2, suy ra f2 = -60 cm, độ lớn 60 cm.","points": 0.25},{"type": "mcq","level": "TH","q": "Dấu âm của tiêu cự thấu kính phân kì cho biết:","options": ["A. Tiêu điểm của nó là ảo","B. Thấu kính bị hỏng","C. Đo sai","D. Thấu kính rất dày"],"answer": "A","explain": "Tiêu cự âm ứng với tiêu điểm ảo.","points": 0.25},{"type": "mcq","level": "NB","q": "Tiêu cự của thấu kính phân kì mang dấu:","options": ["A. Âm","B. Dương","C. Bằng 0","D. Không có dấu"],"answer": "A","explain": "Theo quy ước, tiêu cự thấu kính phân kì mang dấu âm.","points": 0.25},{"type": "truefalse","level": "VD","q": "Đánh giá các nhận định về đo tiêu cự thấu kính phân kì.","statements": ["a) Thấu kính phân kì không cho ảnh thật nên không đo trực tiếp được.","b) Có thể ghép với thấu kính hội tụ để đo gián tiếp.","c) Tiêu cự của thấu kính phân kì mang dấu âm.","d) Mọi thấu kính đều đo được bằng phương pháp vật ở xa."],"answer": ["T","T","T","F"],"explain": "Thấu kính phân kì không đo trực tiếp được.","points": 1},{"type": "truefalse","level": "VDC","q": "Đánh giá các nhận định về hệ thấu kính ghép.","statements": ["a) Hệ ghép thấu kính hội tụ và phân kì có thể cho ảnh thật.","b) Biết tiêu cự của hệ và của thấu kính hội tụ thì suy ra được tiêu cự của thấu kính phân kì.","c) Công thức thấu kính ghép: 1/f = 1/f1 + 1/f2.","d) Thấu kính phân kì có tiêu điểm thật."],"answer": ["T","T","T","F"],"explain": "Thấu kính phân kì chỉ có tiêu điểm ảo.","points": 1},{"type": "short","level": "VD","q": "Vì sao không đo trực tiếp tiêu cự của thấu kính phân kì bằng phương pháp vật ở xa?","answer": "Vì thấu kính phân kì không cho ảnh thật trên màn","explain": "Nó chỉ cho ảnh ảo nên không hứng được trên màn.","points": 0.5},{"type": "short","level": "VDC","q": "Tiêu cự của thấu kính phân kì mang dấu gì?","answer": "Dấu âm","explain": "Theo quy ước dấu, tiêu cự thấu kính phân kì mang dấu âm.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Đơn vị thường dùng để đo tiêu cự là:","options": ["A. Xăngtimét","B. Kilôgam","C. Giây","D. Ampe"],"answer": "A","explain": "Tiêu cự thường đo bằng cm.","points": 0.25},{"type": "mcq","level": "TH","q": "Đổi 0,12 m ra xăngtimét được:","options": ["A. 12 cm","B. 1,2 cm","C. 120 cm","D. 0,012 cm"],"answer": "A","explain": "0,12 m = 12 cm.","points": 0.25},{"type": "mcq","level": "VD","q": "Đo được tiêu cự f = 125 mm. Đổi ra xăngtimét được:","options": ["A. 12,5 cm","B. 1,25 cm","C. 125 cm","D. 0,125 cm"],"answer": "A","explain": "125 mm = 12,5 cm.","points": 0.25},{"type": "mcq","level": "VDC","q": "Kính lúp ghi 4x. Tiêu cự của kính lúp đó là:","options": ["A. 6,25 cm","B. 100 cm","C. 4 cm","D. 21 cm"],"answer": "A","explain": "f = 25/4 = 6,25 cm.","points": 0.25},{"type": "mcq","level": "TH","q": "Kính lúp 4x cho ảnh lớn gấp mấy lần vật khi ngắm chừng ở cực cận?","options": ["A. 4 lần","B. 25 lần","C. 100 lần","D. 6,25 lần"],"answer": "A","explain": "Số bội giác 4x nghĩa là phóng đại 4 lần.","points": 0.25},{"type": "mcq","level": "NB","q": "Điểm cực cận của mắt người bình thường cách mắt khoảng:","options": ["A. 25 cm","B. 10 cm","C. 1 m","D. 1 cm"],"answer": "A","explain": "Cực cận khoảng 25 cm.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về đơn vị đo.","statements": ["a) Tiêu cự thường được đo bằng xăngtimét.","b) 0,12 m = 12 cm.","c) Điểm cực cận của mắt khoảng 25 cm.","d) Số bội giác là đại lượng không có đơn vị."],"answer": ["T","T","T","T"],"explain": "Cả bốn nhận định đều đúng.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về kính lúp.","statements": ["a) Kính lúp 4x có tiêu cự 6,25 cm.","b) Đổi đúng đơn vị giúp tính toán chính xác.","c) Công thức G = 25/f dùng f tính bằng cm.","d) Tiêu cự càng nhỏ thì số bội giác càng nhỏ."],"answer": ["T","T","T","F"],"explain": "Tiêu cự càng nhỏ thì số bội giác càng lớn.","points": 1},{"type": "short","level": "NB","q": "Điểm cực cận của mắt người bình thường cách mắt khoảng bao nhiêu xăngtimét?","answer": "25","explain": "Khoảng 25 cm.","points": 0.5},{"type": "short","level": "TH","q": "Kính lúp 4x có tiêu cự bao nhiêu xăngtimét?","answer": "6,25","explain": "f = 25/4 = 6,25 cm.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Bài thực hành đo tiêu cự giúp rèn luyện kĩ năng:","options": ["A. Lắp ráp, quan sát, đo đạc","B. Vẽ tranh","C. Hát","D. Chạy nhanh"],"answer": "A","explain": "Thực hành rèn kĩ năng lắp ráp, quan sát, đo đạc.","points": 0.25},{"type": "mcq","level": "TH","q": "Thái độ cần có khi làm thực hành là:","options": ["A. Cẩn thận, trung thực, hợp tác","B. Cẩu thả, gian dối","C. Làm cho xong","D. Đùa nghịch"],"answer": "A","explain": "Cần cẩn thận, trung thực và hợp tác.","points": 0.25},{"type": "mcq","level": "VD","q": "Khi kết quả đo của các nhóm khác nhau, em nên:","options": ["A. Kiểm tra lại các bước, tìm nguyên nhân","B. Chép kết quả của nhóm khác","C. Bịa ra kết quả","D. Bỏ qua"],"answer": "A","explain": "Kiểm tra lại và tìm nguyên nhân sai khác.","points": 0.25},{"type": "mcq","level": "VDC","q": "Kết quả đo được f = 12 cm trong khi lí thuyết ghi trên kính là 10 cm. Nguyên nhân có thể là:","options": ["A. Sai số khi xác định vị trí ảnh rõ nét nhất","B. Lí thuyết ghi sai","C. Thước đo bị hỏng hoàn toàn","D. Mắt bị cận"],"answer": "A","explain": "Sai số chủ quan khi xác định ảnh rõ nét nhất.","points": 0.25},{"type": "mcq","level": "TH","q": "Để giảm sai số trong bài thực hành, nên:","options": ["A. Đo nhiều lần, làm trong phòng hơi tối, dùng màn trắng","B. Đo một lần thật nhanh","C. Nhờ người khác đo hộ","D. Đoán kết quả"],"answer": "A","explain": "Các biện pháp trên giúp giảm sai số.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi ghi kết quả đo, cần kèm theo:","options": ["A. Đơn vị đo","B. Tên người đo","C. Ngày sinh","D. Chữ kí"],"answer": "A","explain": "Kết quả đo phải kèm đơn vị.","points": 0.25},{"type": "truefalse","level": "NB","q": "Đánh giá các nhận định về thái độ thực hành.","statements": ["a) Thực hành rèn luyện kĩ năng đo đạc.","b) Cần trung thực với kết quả đo được.","c) Kết quả khác nhau giữa các nhóm là bình thường.","d) Nên chép kết quả của nhóm khác cho nhanh."],"answer": ["T","T","T","F"],"explain": "Phải trung thực, không chép kết quả.","points": 1},{"type": "truefalse","level": "TH","q": "Đánh giá các nhận định về sai số.","statements": ["a) Sai số là điều không tránh khỏi trong thực hành.","b) Cần tìm nguyên nhân và cách khắc phục sai số.","c) Báo cáo cần có phần nhận xét kết quả.","d) Thực hành không cần ghi chép gì."],"answer": ["T","T","T","F"],"explain": "Thực hành cần ghi chép đầy đủ.","points": 1},{"type": "short","level": "NB","q": "Khi làm thực hành, đức tính nào là quan trọng nhất?","answer": "Trung thực","explain": "Phải trung thực với kết quả đo.","points": 0.5},{"type": "short","level": "TH","q": "Khi kết quả đo khác với lí thuyết, em nên làm gì?","answer": "Kiểm tra lại các bước và tìm nguyên nhân sai số","explain": "Kiểm tra lại thí nghiệm thay vì bịa kết quả.","points": 0.5}]}]}
