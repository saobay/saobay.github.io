{"type": "mcq", "level": "NB", "q": "Cung bị chắn có số đo $130^\\circ$. Góc nội tiếp chắn cung đó có số đo là", "options": ["A. $130^\\circ$", "B. $65^\\circ$", "C. $260^\\circ$", "D. $26^\\circ$"], "answer": "B", "explain": "$130^\\circ : 2 = 65^\\circ$."},
{"type": "mcq", "level": "TH", "q": "Góc nội tiếp $\\widehat{DEF}$ có số đo $54^\\circ$. Số đo cung bị chắn là", "options": ["A. $27^\\circ$", "B. $54^\\circ$", "C. $108^\\circ$", "D. $216^\\circ$"], "answer": "C", "explain": "$2 \\times 54^\\circ = 108^\\circ$."},
{"type": "mcq", "level": "TH", "q": "Các góc nội tiếp bằng nhau thì", "options": ["A. Chắn các cung bằng nhau", "B. Chắn các cung bù nhau", "C. Có đỉnh trùng nhau", "D. Cùng chắn nửa đường tròn"], "answer": "A", "explain": "Hệ quả: các góc nội tiếp bằng nhau chắn các cung bằng nhau."},
{"type": "mcq", "level": "VD", "q": "Cho đường tròn $(O)$, dây $AB$ căng cung lớn $AB$ bằng $260^\\circ$. Điểm $C$ nằm trên cung nhỏ $AB$. Số đo góc $\\widehat{ACB}$ là", "options": ["A. $100^\\circ$", "B. $50^\\circ$", "C. $260^\\circ$", "D. $130^\\circ$"], "answer": "D", "explain": "$C$ nằm trên cung nhỏ $AB$ nên $\\widehat{ACB}$ chắn cung lớn $AB$ ($260^\\circ$). Vậy $\\widehat{ACB} = 260^\\circ : 2 = 130^\\circ$."},
{"type": "truefalse", "level": "TH", "q": "Cho đường tròn $(O)$, $AB$ là dây không đi qua tâm. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Các góc nội tiếp cùng chắn cung nhỏ $AB$ thì bằng nhau.", "b) Góc nội tiếp chắn cung lớn $AB$ bù với góc nội tiếp chắn cung nhỏ $AB$.", "c) Nếu cung nhỏ $AB$ bằng $80^\\circ$ thì góc nội tiếp chắn cung lớn $AB$ bằng $140^\\circ$.", "d) Góc ở tâm chắn cung nhỏ $AB$ bằng $160^\\circ$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: tổng hai góc bằng nửa $360^\\circ$. c) Đúng: cung lớn $280^\\circ$. d) Sai: bằng $80^\\circ$."},
{"type": "truefalse", "level": "VD", "q": "Cho tam giác đều $ABC$ nội tiếp đường tròn $(O)$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $O$ là trọng tâm tam giác $ABC$.", "b) Số đo mỗi cung nhỏ $AB, BC, CA$ bằng $120^\\circ$.", "c) Góc nội tiếp chắn cung $BC$ không chứa $A$ bằng $60^\\circ$.", "d) Góc ở tâm $\\widehat{AOB}$ bằng $60^\\circ$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: tâm đường tròn ngoại tiếp tam giác đều trùng trọng tâm. b) Đúng. c) Đúng: chắn cung nhỏ $BC$. d) Sai: $\\widehat{AOB}$ chắn cung $AB$ nên bằng $120^\\circ$."},
{"type": "short", "level": "VDC", "q": "Tổng số đo của góc ở tâm và góc nội tiếp cùng chắn một cung bằng $150^\\circ$. Tính số đo góc nội tiếp (đơn vị: độ, chỉ ghi số).", "answer": "50", "explain": "Gọi $x$ là số đo góc nội tiếp thì góc ở tâm bằng $2x$. Ta có $x + 2x = 150$, suy ra $x = 50$."},
{"type": "short", "level": "VDC", "q": "Cho đường tròn $(O)$, $AB$ là đường kính, $AB = 10$. Điểm $C$ trên $(O)$ sao cho $\\widehat{CAB} = 30^\\circ$. Tính độ dài $BC$ (chỉ ghi số).", "answer": "5", "explain": "Tam giác $ABC$ vuông tại $C$ (góc nội tiếp chắn nửa đường tròn), cạnh $BC$ đối diện góc $30^\\circ$ nên $BC = AB : 2 = 5$."}
]},
{"name": "Đề 9", "questions": [
{"type": "mcq", "level": "NB", "q": "Trong một đường tròn, số đo góc nội tiếp bằng", "options": ["A. Số đo cung bị chắn", "B. Nửa số đo cung bị chắn", "C. Hai lần số đo cung bị chắn", "D. Tổng số đo hai cung kề"], "answer": "B", "explain": "Định lí về góc nội tiếp."},
{"type": "mcq", "level": "NB", "q": "Góc nội tiếp chắn cung có số đo $90^\\circ$ thì", "options": ["A. Bằng $45^\\circ$", "B. Bằng $90^\\circ$", "C. Là góc vuông", "D. Bằng $180^\\circ$"], "answer": "A", "explain": "$90^\\circ : 2 = 45^\\circ$. Chú ý: góc nội tiếp chắn NỬA đường tròn (cung $180^\\circ$) mới là góc vuông."},
{"type": "mcq", "level": "NB", "q": "Góc ở tâm bằng $64^\\circ$. Góc nội tiếp cùng chắn cung với góc ở tâm đó bằng", "options": ["A. $64^\\circ$", "B. $16^\\circ$", "C. $32^\\circ$", "D. $128^\\circ$"], "answer": "C", "explain": "$64^\\circ : 2 = 32^\\circ$."},
{"type": "mcq", "level": "TH", "q": "Cho đường tròn $(O)$, góc nội tiếp $\\widehat{BAC} = 37^\\circ$ chắn cung $BC$. Số đo cung $BC$ là", "options": ["A. $37^\\circ$", "B. $143^\\circ$", "C. $74^\\circ$", "D. $148^\\circ$"], "answer": "C", "explain": "$2 \\times 37^\\circ = 74^\\circ$."},
{"type": "mcq", "level": "TH", "q": "Nếu một góc nội tiếp bằng $90^\\circ$ thì dây căng hai cạnh của góc là", "options": ["A. Bán kính", "B. Dây bất kì", "C. Tiếp tuyến", "D. Đường kính"], "answer": "D", "explain": "Góc nội tiếp $90^\\circ$ chắn nửa đường tròn nên dây căng hai cạnh là đường kính."},
{"type": "mcq", "level": "VD", "q": "Cho đường tròn $(O)$, $AB$ là đường kính. Điểm $C$ trên $(O)$ sao cho $\\widehat{CAB} = 25^\\circ$. Số đo cung nhỏ $BC$ là", "options": ["A. $130^\\circ$", "B. $25^\\circ$", "C. $65^\\circ$", "D. $50^\\circ$"], "answer": "D", "explain": "$\\widehat{CAB}$ là góc nội tiếp chắn cung $BC$ nên cung $BC$ bằng $2 \\times 25^\\circ = 50^\\circ$."},
{"type": "truefalse", "level": "TH", "q": "Cho góc nội tiếp có số đo $x$ và cung bị chắn có số đo $y$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $y = 2x$.", "b) Nếu $x = 90^\\circ$ thì cung bị chắn là nửa đường tròn.", "c) Nếu $y = 180^\\circ$ thì $x = 90^\\circ$.", "d) $x$ có thể lớn hơn $180^\\circ$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cung gấp đôi góc. b) Đúng: $y = 180^\\circ$. c) Đúng: $x = 90^\\circ$. d) Sai: góc nội tiếp luôn nhỏ hơn $180^\\circ$."},
{"type": "truefalse", "level": "VD", "q": "Cho đường tròn $(O)$, $ABCD$ là hình chữ nhật nội tiếp. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) $AC$ là đường kính.", "b) $\\widehat{ABC} = 90^\\circ$.", "c) Tâm $O$ là giao điểm hai đường chéo.", "d) Số đo cung $ABC$ bằng $360^\\circ$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: góc $B$ nội tiếp chắn nửa đường tròn. b) Đúng. c) Đúng. d) Sai: cung $ABC$ là nửa đường tròn, bằng $180^\\circ$."},
{"type": "short", "level": "VDC", "q": "Góc nội tiếp $\\widehat{MNP}$ chắn cung $MP$. Biết số đo cung lớn $MP$ gấp 5 lần số đo cung nhỏ $MP$. Tính số đo góc $\\widehat{MNP}$ là góc chắn cung nhỏ $MP$ (đơn vị: độ, chỉ ghi số).", "answer": "30", "explain": "Gọi cung nhỏ là $x$ thì cung lớn là $5x$. Ta có $6x = 360$, suy ra $x = 60$. Góc nội tiếp bằng $60 : 2 = 30$."},
{"type": "short", "level": "VDC", "q": "Cho đường tròn $(O)$, $AB$ là đường kính, $C$ thuộc $(O)$ sao cho $AC = \\frac{1}{2}AB$. Tính số đo cung nhỏ $BC$ (đơn vị: độ, chỉ ghi số).", "answer": "120", "explain": "Tam giác $ABC$ vuông tại $C$, $AC = AB : 2$ nên $\\widehat{ABC} = 30^\\circ$, suy ra $\\widehat{BAC} = 60^\\circ$. Cung $BC$ bị chắn bởi góc $\\widehat{BAC}$ nên bằng $120^\\circ$."}
]},
{"name": "Đề 10", "questions": [
{"type": "mcq", "level": "NB", "q": "Đỉnh của góc nội tiếp", "options": ["A. Nằm ở tâm", "B. Nằm trên đường tròn", "C. Nằm trong đường tròn", "D. Nằm ngoài đường tròn"], "answer": "B", "explain": "Định nghĩa: góc nội tiếp có đỉnh nằm trên đường tròn."},
{"type": "mcq", "level": "NB", "q": "Hai cạnh của góc nội tiếp", "options": ["A. Là hai bán kính", "B. Chứa hai dây cung", "C. Là hai đường kính", "D. Là hai tiếp tuyến"], "answer": "B", "explain": "Hai cạnh của góc nội tiếp chứa hai dây cung của đường tròn."},
{"type": "mcq", "level": "NB", "q": "Góc nội tiếp có số đo $52^\\circ$ thì cung bị chắn có số đo là", "options": ["A. $26^\\circ$", "B. $52^\\circ$", "C. $104^\\circ$", "D. $208^\\circ$"], "answer": "C", "explain": "$2 \\times 52^\\circ = 104^\\circ$."},
{"type": "mcq", "level": "TH", "q": "Cung bị chắn có số đo $168^\\circ$. Góc nội tiếp chắn cung đó có số đo là", "options": ["A. $336^\\circ$", "B. $168^\\circ$", "C. $84^\\circ$", "D. $42^\\circ$"], "answer": "C", "explain": "$168^\\circ : 2 = 84^\\circ$."},
{"type": "mcq", "level": "TH", "q": "Góc nội tiếp và góc ở tâm cùng chắn cung $BC$, góc ở tâm bằng $110^\\circ$. Góc nội tiếp có số đo là", "options": ["A. $55^\\circ$", "B. $220^\\circ$", "C. $110^\\circ$", "D. $70^\\circ$"], "answer": "A", "explain": "$110^\\circ : 2 = 55^\\circ$."},
{"type": "mcq", "level": "VD", "q": "Cho đường tròn $(O)$, ba điểm $A, B, C$ trên $(O)$ sao cho $AB = BC$ và $\\widehat{ABC} = 80^\\circ$. Số đo cung nhỏ $AC$ là", "options": ["A. $160^\\circ$", "B. $80^\\circ$", "C. $100^\\circ$", "D. $200^\\circ$"], "answer": "A", "explain": "$\\widehat{ABC}$ là góc nội tiếp chắn cung $AC$ nên cung $AC$ bằng $2 \\times 80^\\circ = 160^\\circ$ (cung nhỏ vì nhỏ hơn $180^\\circ$)."},
{"type": "truefalse", "level": "TH", "q": "Cho đường tròn $(O)$ và góc nội tiếp $\\widehat{BAC} = 70^\\circ$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Cung bị chắn $BC$ có số đo $140^\\circ$.", "b) Góc ở tâm cùng chắn cung $BC$ bằng $140^\\circ$.", "c) Mọi góc nội tiếp chắn cung lớn $BC$ đều bằng $70^\\circ$.", "d) $BC$ không thể là đường kính của $(O)$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $2 \\times 70^\\circ$. b) Đúng. c) Sai: góc nội tiếp chắn cung lớn $BC$ bằng $(360^\\circ - 140^\\circ) : 2 = 110^\\circ$. d) Đúng: nếu $BC$ là đường kính thì góc bằng $90^\\circ$."},
{"type": "truefalse", "level": "VD", "q": "Cho đường tròn $(O)$, $AB$ là đường kính, $C$ thuộc $(O)$. Xét tính đúng sai của các khẳng định sau.", "statements": ["a) Tam giác $ABC$ vuông tại $C$.", "b) Nếu $AB = 2R$ và $AC = R$ thì $\\widehat{ABC} = 30^\\circ$.", "c) Khi đó cung $BC$ bằng $120^\\circ$.", "d) $BC$ luôn lớn hơn $AC$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: chắn nửa đường tròn. b) Đúng: cạnh đối diện góc $30^\\circ$ bằng nửa cạnh huyền. c) Đúng: $\\widehat{BAC} = 60^\\circ$ nên cung $BC$ bằng $120^\\circ$. d) Sai: ví dụ $AC = R\\sqrt{3}$ thì $BC = R$."},
{"type": "short", "level": "VDC", "q": "Cho đường tròn $(O)$, hai điểm $A, B$ sao cho góc ở tâm $\\widehat{AOB} = 80^\\circ$. Lấy điểm $M$ trên cung lớn $AB$. Tính số đo góc $\\widehat{AMB}$ (đơn vị: độ, chỉ ghi số).", "answer": "140", "explain": "Cung lớn $AB$ bằng $360^\\circ - 80^\\circ = 280^\\circ$. Góc $\\widehat{AMB}$ chắn cung lớn $AB$ nên bằng $280^\\circ : 2 = 140^\\circ$."},
{"type": "short", "level": "VDC", "q": "Cho góc nội tiếp $\\widehat{XYZ} = x^\\circ$. Biết ba lần số đo góc hơn số đo cung bị chắn $40^\\circ$. Tính $x$ (chỉ ghi số).", "answer": "40", "explain": "Cung bị chắn bằng $2x$. Ta có $3x - 2x = 40$, suy ra $x = 40$."}
]}
