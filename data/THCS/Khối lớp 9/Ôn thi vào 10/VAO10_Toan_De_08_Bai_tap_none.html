 = 1 \\\\ y = 2 \\end{cases}$ có nghiệm là $(1;2)$.", "Nếu hai đường thẳng song song thì hệ tương ứng vô nghiệm."], "answer": ["T", "F", "T", "T"], "explain": "Thay $(3;3)$ vào hệ thứ nhất: $3+3=6$ và $3-3=0$ đều đúng."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Đường kính của đường tròn bán kính $5$ cm bằng $5$ cm.", "Tiếp tuyến của đường tròn vuông góc với bán kính tại tiếp điểm.", "Góc nội tiếp chắn nửa đường tròn là góc vuông.", "Diện tích hình tròn bán kính $5$ cm là $25\\pi$ cm$^2$."], "answer": ["F", "T", "T", "T"], "explain": "Đường kính $=2R$; tiếp tuyến vuông góc bán kính tại tiếp điểm; góc chắn nửa đường tròn là góc vuông."}, {"type": "short", "level": "TH", "q": "Cho hệ $\\begin{cases} x + y = 8 \\\\ x - y = 4 \\end{cases}$. Giá trị của $x$ là:", "answer": "6", "explain": "Cộng hai phương trình: $2x = 12$ nên $x = 6$."}, {"type": "short", "level": "TH", "q": "Cho phương trình $x^2 + 4x + 11 = 0$. Tính $\\Delta$.", "answer": "-28", "explain": "$\\Delta = 4^2 - 4\\cdot11 = -28$."}]}]}</script>
