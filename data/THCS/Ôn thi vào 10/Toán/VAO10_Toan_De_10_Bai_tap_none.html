<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Giá trị của $(\\sqrt{14}+3)(\\sqrt{14}-3)$ bằng:", "options": ["A. $28$", "B. $5$", "C. $23$", "D. $6$"], "answer": "B", "explain": "Áp dụng hằng đẳng thức: $(\\sqrt{14})^2-3^2=14-9=5$."}, {"type": "mcq", "level": "NB", "q": "Góc nội tiếp chắn cung $60^\\circ$ có số đo bằng:", "options": ["A. $120^\\circ$", "B. $30^\\circ$", "C. $70^\\circ$", "D. $60^\\circ$"], "answer": "B", "explain": "Số đo góc nội tiếp bằng nửa số đo cung bị chắn: $\\frac{60^\\circ}{2}=30^\\circ$."}, {"type": "mcq", "level": "TH", "q": "Tam giác $ABC$ vuông tại $A$ có $AB = 5$ cm, $AC = 12$ cm. $\\sin B$ bằng:", "options": ["A. $\\frac{5}{12}$", "B. $\\frac{5}{13}$", "C. $\\frac{12}{13}$", "D. $\\frac{12}{5}$"], "answer": "C", "explain": "$BC=\\sqrt{5^2+12^2}=13$; $\\sin B=\\frac{\\text{đối}}{\\text{huyền}}=\\frac{AC}{BC}=\\frac{12}{13}$."}, {"type": "mcq", "level": "TH", "q": "Phương trình $x^2 + 6x + 4 = 0$ có:", "options": ["A. vô nghiệm", "B. một nghiệm", "C. hai nghiệm phân biệt", "D. nghiệm kép"], "answer": "C", "explain": "$\\Delta = 6^2-4\\cdot4=20$ \\gt 0$ nên phương trình có hai nghiệm phân biệt."}, {"type": "mcq", "level": "VD", "q": "Tam giác vuông có đường cao ứng với cạnh huyền chia cạnh huyền thành hai đoạn $4$ cm và $9$ cm. Độ dài đường cao là:", "options": ["A. $13$ cm", "B. $6$ cm", "C. $5$ cm", "D. $7$ cm"], "answer": "B", "explain": "$h^2=4 \\cdot 9=36$ nên $h=6$ cm."}, {"type": "mcq", "level": "TH", "q": "Góc nội tiếp và góc ở tâm cùng chắn một cung. Góc nội tiếp bằng $40^\\circ$. Góc ở tâm bằng:", "options": ["A. $80^\\circ$", "B. $90^\\circ$", "C. $70^\\circ$", "D. $40^\\circ$"], "answer": "A", "explain": "Góc ở tâm bằng hai lần góc nội tiếp cùng chắn một cung: $2 \\cdot 40^\\circ = 80^\\circ$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["$\\sqrt{(6-5)^2} = 5-6$.", "$\\sqrt{6}$ là số vô tỉ.", "Biểu thức $\\sqrt{x}$ xác định với mọi $x \\in \\mathbb{R}$.", "$(\\sqrt{6})^2 = 6$."], "answer": ["F", "T", "F", "T"], "explain": "$\\sqrt{A^2}=|A|$; $\\sqrt{x}$ xác định khi $x \\ge 0$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Trong tam giác vuông, bình phương đường cao bằng tích hai hình chiếu.", "$\\sin^2\\alpha + \\cos^2\\alpha = 1$ với mọi góc nhọn $\\alpha$.", "Nếu hai góc phụ nhau thì sin góc này bằng cos góc kia.", "$\\tan 45^\\circ = 1$."], "answer": ["T", "T", "T", "T"], "explain": "Các hệ thức lượng cơ bản trong tam giác vuông."}, {"type": "short", "level": "TH", "q": "Phương trình $x^2 - 6x = 0$ có nghiệm lớn hơn bằng bao nhiêu?", "answer": "6", "explain": "$x(x-6)=0$ nên nghiệm là $0$ và $6$; nghiệm lớn hơn là $6$."}, {"type": "short", "level": "TH", "q": "Tổng của hai số là $14$, số lớn hơn số bé $4$. Số lớn bằng bao nhiêu?", "answer": "9", "explain": "Số lớn $=\\frac{(14)+4}{2}=9$."}]}]}</script>
