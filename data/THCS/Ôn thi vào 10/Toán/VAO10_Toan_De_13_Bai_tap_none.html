<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 13", "questions": [{"type": "mcq", "level": "TH", "q": "Phương trình $x^2 + 4x - 0 = 0$ có tập nghiệm là:", "options": ["A. $\\{-4;-4\\}$", "B. $\\{-4;0\\}$", "C. $\\{-4;-3\\}$", "D. $\\{4;0\\}$"], "answer": "B", "explain": "Theo Vi-ét: tổng hai nghiệm $=4$, tích $=0$ nên nghiệm là $-4$ và $0$."}, {"type": "mcq", "level": "VD", "q": "Trục căn thức ở mẫu của $\\frac{5}{\\sqrt{5}+1}$ được:", "options": ["A. $\\frac{5\\sqrt{5}-5}{4}$", "B. $\\sqrt{5}-1$", "C. $\\frac{5\\sqrt{5}+5}{4}$", "D. $\\frac{5}{\\sqrt{5}-1}$"], "answer": "A", "explain": "Nhân cả tử và mẫu với $\\sqrt{5}-1$: $\\frac{5(\\sqrt{5}-1)}{5-1}=\\frac{5\\sqrt{5}-5}{4}$."}, {"type": "mcq", "level": "TH", "q": "Tọa độ đỉnh của parabol $y = x^2 - 2x + 4$ là:", "options": ["A. $(1;3)$", "B. $(-1;3)$", "C. $(1;-3)$", "D. $(2;3)$"], "answer": "A", "explain": "Hoành độ đỉnh $x_I=-\\frac{-21}{2}=1$; tung độ $y_I=1^2-2\\cdot1\\cdot1+4=3$."}, {"type": "mcq", "level": "TH", "q": "Độ dài cung $120^\\circ$ của đường tròn bán kính $12$ cm là:", "options": ["A. $12\\pi$ cm", "B. $\\frac{24\\pi}{3}$ cm", "C. $\\frac{48\\pi}{3}$ cm", "D. $\\frac{12\\pi}{3}$ cm"], "answer": "B", "explain": "$l=\\frac{\\pi R n}{180}=\\frac{\\pi \\cdot 12 \\cdot 120}{180}$."}, {"type": "mcq", "level": "NB", "q": "Đường thẳng $y = 5x + 4$ song song với đường thẳng nào sau đây?", "options": ["A. $y = 5x$", "B. $y = 5x + 3$", "C. $y = 6x + 4$", "D. $y = -5x + 4$"], "answer": "B", "explain": "Hai đường thẳng song song khi hệ số góc bằng nhau và tung độ gốc khác nhau."}, {"type": "mcq", "level": "TH", "q": "Đồ thị hàm số $y = -2x + 5$ đi qua điểm nào sau đây?", "options": ["A. $(1;3)$", "B. $(0;6)$", "C. $(1;4)$", "D. $(2;3)$"], "answer": "A", "explain": "Thay $x=1$ vào: $y=-2\\cdot1+5=3$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Hàm số $y = -3x + 4$ nghịch biến trên $\\mathbb{R}$.", "Đồ thị hàm số $y = -3x + 4$ cắt trục tung tại điểm $(0;4)$.", "Đồ thị hàm số $y = -3x + 4$ đi qua gốc tọa độ.", "Đồ thị hàm số $y = -3x + 4$ là một đường thẳng."], "answer": ["T", "T", "F", "T"], "explain": "Hàm số bậc nhất có $a=-3$ nên nghịch biến; cắt $Oy$ tại $(0;4)$; chỉ qua gốc tọa độ khi $b=0$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Cặp số $(4;4)$ là nghiệm của hệ $\\begin{cases} x + y = 8 \\\\ x - y = 0 \\end{cases}$.", "Mọi hệ hai phương trình bậc nhất hai ẩn đều có nghiệm duy nhất.", "Hệ $\\begin{cases} x = 1 \\\\ y = 2 \\end{cases}$ có nghiệm là $(1;2)$.", "Nếu hai đường thẳng song song thì hệ tương ứng vô nghiệm."], "answer": ["T", "F", "T", "T"], "explain": "Thay $(4;4)$ vào hệ thứ nhất: $4+4=8$ và $4-4=0$ đều đúng."}, {"type": "short", "level": "NB", "q": "Diện tích hình tròn có bán kính $5$ cm bằng $k\\pi$ cm$^2$. Giá trị của $k$ là:", "answer": "25", "explain": "$S=\\pi R^2=\\pi \\cdot 5^2=25\\pi$ nên $k=25$."}, {"type": "short", "level": "TH", "q": "Cho phương trình $x^2 + 6x + 11 = 0$. Tính $\\Delta$.", "answer": "-8", "explain": "$\\Delta = 6^2 - 4\\cdot11 = -8$."}]}]}</script>
