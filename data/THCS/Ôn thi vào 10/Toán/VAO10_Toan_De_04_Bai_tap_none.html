<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 4", "questions": [{"type": "mcq", "level": "VD", "q": "Tọa độ giao điểm của hai đường thẳng $y = 2x + 2$ và $y = -x + 5$ là:", "options": ["A. $(1;-4)$", "B. $(-1;4)$", "C. $(1;4)$", "D. $(2;4)$"], "answer": "C", "explain": "Hoành độ giao điểm: $2x+2=-x+5 \\Leftrightarrow x=1$, suy ra $y=4$."}, {"type": "mcq", "level": "TH", "q": "Tứ giác $ABCD$ nội tiếp đường tròn có $\\widehat{A} = 80^\\circ$. Số đo góc $C$ là:", "options": ["A. $100^\\circ$", "B. $90^\\circ$", "C. $260^\\circ$", "D. $80^\\circ$"], "answer": "A", "explain": "Tứ giác nội tiếp có tổng hai góc đối bằng $180^\\circ$: $\\widehat{C}=180^\\circ-80^\\circ=100^\\circ$."}, {"type": "mcq", "level": "NB", "q": "Đường thẳng $y = 4x + 1$ song song với đường thẳng nào sau đây?", "options": ["A. $y = 4x$", "B. $y = -4x + 1$", "C. $y = 5x + 1$", "D. $y = 4x + 3$"], "answer": "D", "explain": "Hai đường thẳng song song khi hệ số góc bằng nhau và tung độ gốc khác nhau."}, {"type": "mcq", "level": "TH", "q": "Góc nội tiếp và góc ở tâm cùng chắn một cung. Góc nội tiếp bằng $45^\\circ$. Góc ở tâm bằng:", "options": ["A. $45^\\circ$", "B. $90^\\circ$", "C. $80^\\circ$", "D. $100^\\circ$"], "answer": "B", "explain": "Góc ở tâm bằng hai lần góc nội tiếp cùng chắn một cung: $2 \\cdot 45^\\circ = 90^\\circ$."}, {"type": "mcq", "level": "VD", "q": "Nghiệm của hệ $\\begin{cases} 2x + 4y = -20 \\\\ 3x -2y = -6 \\end{cases}$ là:", "options": ["A. $(-4;-3)$", "B. $(-4;3)$", "C. $(-3;-4)$", "D. $(4;-3)$"], "answer": "A", "explain": "Thay $x=-4, y=-3$ vào cả hai phương trình đều thỏa mãn."}, {"type": "mcq", "level": "NB", "q": "Hệ số góc của đường thẳng $y = \\frac{1}{2}x + 1$ là:", "options": ["A. $\\frac{1}{2}$", "B. $0$", "C. $1$", "D. $2$"], "answer": "A", "explain": "Đường thẳng $y=ax+b$ có hệ số góc là $a$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Trong tam giác vuông, bình phương đường cao bằng tích hai hình chiếu.", "$\\sin^2\\alpha + \\cos^2\\alpha = 1$ với mọi góc nhọn $\\alpha$.", "Nếu hai góc phụ nhau thì sin góc này bằng cos góc kia.", "$\\tan 45^\\circ = 1$."], "answer": ["T", "T", "T", "T"], "explain": "Các hệ thức lượng cơ bản trong tam giác vuông."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai:", "statements": ["Nếu $x_1, x_2$ là nghiệm của $x^2 - 6x + 12 = 0$ thì $x_1 + x_2 = 6$.", "Nếu $x_1, x_2$ là nghiệm của $x^2 - 6x + 12 = 0$ thì $x_1 \\cdot x_2 = 12$.", "Phương trình $x^2 - 6x + 12 = 0$ luôn có hai nghiệm phân biệt.", "Nếu $\\Delta \\lt 0$ thì phương trình bậc hai vô nghiệm."], "answer": ["T", "T", "F", "T"], "explain": "Định lí Vi-ét đúng khi phương trình có nghiệm; chưa chắc luôn có hai nghiệm phân biệt."}, {"type": "short", "level": "TH", "q": "Góc tạo bởi tia tiếp tuyến và dây cung chắn cung $70^\\circ$ có số đo bằng bao nhiêu độ?", "answer": "35", "explain": "Bằng nửa số đo cung bị chắn: $35^\\circ$."}, {"type": "short", "level": "TH", "q": "Tổng của hai số là $20$, số lớn hơn số bé $2$. Số lớn bằng bao nhiêu?", "answer": "11", "explain": "Số lớn $=\\frac{(20)+2}{2}=11$."}]}]}</script>
