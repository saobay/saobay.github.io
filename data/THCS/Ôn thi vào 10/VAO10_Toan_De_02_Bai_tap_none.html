<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Hệ số góc của đường thẳng $y = \\frac{1}{2}x + 1$ là:", "options": ["A. $\\frac{1}{2}$", "B. $1$", "C. $2$", "D. $0$"], "answer": "A", "explain": "Đường thẳng $y=ax+b$ có hệ số góc là $a$."}, {"type": "mcq", "level": "TH", "q": "Góc nội tiếp và góc ở tâm cùng chắn một cung. Góc nội tiếp bằng $30^\\circ$. Góc ở tâm bằng:", "options": ["A. $50^\\circ$", "B. $60^\\circ$", "C. $30^\\circ$", "D. $70^\\circ$"], "answer": "B", "explain": "Góc ở tâm bằng hai lần góc nội tiếp cùng chắn một cung: $2 \\cdot 30^\\circ = 60^\\circ$."}, {"type": "mcq", "level": "NB", "q": "Góc nội tiếp chắn cung $50^\\circ$ có số đo bằng:", "options": ["A. $60^\\circ$", "B. $100^\\circ$", "C. $50^\\circ$", "D. $25^\\circ$"], "answer": "D", "explain": "Số đo góc nội tiếp bằng nửa số đo cung bị chắn: $\\frac{50^\\circ}{2}=25^\\circ$."}, {"type": "mcq", "level": "TH", "q": "Phương trình $x^2 - 1x + 12 = 0$ có tập nghiệm là:", "options": ["A. $\\{3;-4\\}$", "B. $\\{-3;-2\\}$", "C. $\\{-3;-3\\}$", "D. $\\{-3;4\\}$"], "answer": "D", "explain": "Theo Vi-ét: tổng hai nghiệm $=-1$, tích $=-12$ nên nghiệm là $-3$ và $4$."}, {"type": "mcq", "level": "VD", "q": "Từ điểm $M$ cách tâm $O$ một khoảng $5$ cm, kẻ tiếp tuyến $MA$ đến đường tròn $(O;3$ cm$)$. Độ dài $MA$ bằng:", "options": ["A. $2$ cm", "B. $5$ cm", "C. $6$ cm", "D. $4$ cm"], "answer": "D", "explain": "$OA \\perp MA$ nên $MA=\\sqrt{OM^2-OA^2}=\\sqrt{5^2-3^2}=4$ cm."}, {"type": "mcq", "level": "VD", "q": "Tọa độ giao điểm của hai đường thẳng $y = 2x + 5$ và $y = -x + 2$ là:", "options": ["A. $(-1;3)$", "B. $(0;3)$", "C. $(-1;-3)$", "D. $(1;3)$"], "answer": "A", "explain": "Hoành độ giao điểm: $2x+5=-x+2 \\Leftrightarrow x=-1$, suy ra $y=3$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai:", "statements": ["Nếu $x_1, x_2$ là nghiệm của $x^2 - 9x + 9 = 0$ thì $x_1 + x_2 = 9$.", "Nếu $x_1, x_2$ là nghiệm của $x^2 - 9x + 9 = 0$ thì $x_1 \\cdot x_2 = 9$.", "Phương trình $x^2 - 9x + 9 = 0$ luôn có hai nghiệm phân biệt.", "Nếu $\\Delta \\lt 0$ thì phương trình bậc hai vô nghiệm."], "answer": ["T", "T", "F", "T"], "explain": "Định lí Vi-ét đúng khi phương trình có nghiệm; chưa chắc luôn có hai nghiệm phân biệt."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Cặp số $(3;2)$ là nghiệm của hệ $\\begin{cases} x + y = 5 \\\\ x - y = 1 \\end{cases}$.", "Mọi hệ hai phương trình bậc nhất hai ẩn đều có nghiệm duy nhất.", "Hệ $\\begin{cases} x = 1 \\\\ y = 2 \\end{cases}$ có nghiệm là $(1;2)$.", "Nếu hai đường thẳng song song thì hệ tương ứng vô nghiệm."], "answer": ["T", "F", "T", "T"], "explain": "Thay $(3;2)$ vào hệ thứ nhất: $3+2=5$ và $3-2=1$ đều đúng."}, {"type": "short", "level": "TH", "q": "Phương trình $x^2 - 8x = 0$ có nghiệm lớn hơn bằng bao nhiêu?", "answer": "8", "explain": "$x(x-8)=0$ nên nghiệm là $0$ và $8$; nghiệm lớn hơn là $8$."}, {"type": "short", "level": "TH", "q": "Cho phương trình $x^2 + 6x + 7 = 0$. Tính $\\Delta$.", "answer": "8", "explain": "$\\Delta = 6^2 - 4\\cdot7 = 8$."}]}]}</script>
