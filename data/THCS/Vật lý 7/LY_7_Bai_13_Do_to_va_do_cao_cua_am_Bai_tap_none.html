n định.", "statements": ["a) Tiếng ồn giao thông có độ to lớn.", "b) Nghe tiếng ồn lớn lâu dài có hại cho tai.", "c) Nên đeo bảo hộ tai khi làm việc nơi ồn ào.", "d) Tiếng ồn càng to càng tốt cho sức khỏe."], "answer": ["T", "T", "T", "F"], "explain": "Tiếng ồn lớn có hại cho thính giác và sức khỏe.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về bảo vệ tai.", "statements": ["a) Không nên nghe nhạc quá to bằng tai nghe.", "b) Tránh nơi có tiếng ồn lớn kéo dài.", "c) Tiếng nổ lớn đột ngột có thể gây hại cho tai.", "d) Tai người chịu được mọi độ to của âm."], "answer": ["T", "T", "T", "F"], "explain": "Âm quá to có thể gây hại cho thính giác.", "points": 1}, {"type": "short", "level": "TH", "q": "Âm có tần số 30000 Hz có phải siêu âm không? (Trả lời: có hoặc không)", "answer": "có", "explain": "30000 Hz lớn hơn 20000 Hz nên là siêu âm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật dao động 240 lần trong 2 phút. Tính tần số (Hz).", "answer": "2", "explain": "2 phút = 120 giây; f = 240/120 = 2 Hz.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khi biên độ dao động tăng gấp đôi, độ to của âm sẽ?", "options": ["A. Tăng lên", "B. Giảm xuống", "C. Không đổi", "D. Bằng không"], "answer": "A", "explain": "Biên độ càng lớn, âm càng to.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi tần số dao động tăng, độ cao của âm sẽ?", "options": ["A. Giảm xuống", "B. Tăng lên", "C. Không đổi", "D. Mất hẳn"], "answer": "B", "explain": "Tần số càng lớn, âm càng cao.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một dây đàn phát ra âm có tần số 660 Hz. So với âm chuẩn 440 Hz, âm này?", "options": ["A. Cao hơn", "B. Thấp hơn", "C. Bằng nhau", "D. To hơn"], "answer": "A", "explain": "660 Hz lớn hơn 440 Hz nên âm cao hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một nguồn phát ra hai âm: âm 1 có f = 200 Hz, A = 3 mm; âm 2 có f = 600 Hz, A = 1 mm. Nhận định đún
