 Nhẹ"], "answer": "A", "explain": "Mạt sắt dễ nhiễm từ, định hướng theo đường sức từ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi gõ nhẹ tấm bìa trong thí nghiệm từ phổ, mạt sắt?", "options": ["A. Dễ dàng định hướng theo từ trường", "B. Bay đi", "C. Nóng lên", "D. Biến mất"], "answer": "A", "explain": "Gõ nhẹ giúp mạt sắt vượt ma sát, định hướng theo từ trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Từ phổ của hai nam châm đặt gần nhau cho thấy?", "options": ["A. Sự tương tác giữa hai từ trường", "B. Không có gì", "C. Nam châm bị hỏng", "D. Mạt sắt bay"], "answer": "A", "explain": "Từ phổ cho thấy sự chồng chất, tương tác của hai từ trường.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đặt mạt sắt quanh một dây dẫn thẳng có dòng điện lớn. Mạt sắt sắp xếp thành?", "options": ["A. Các đường tròn đồng tâm quanh dây dẫn", "B. Đường thẳng", "C. Ngẫu nhiên", "D. Không sắp xếp"], "answer": "A", "explain": "Từ trường của dòng điện thẳng là các đường tròn đồng tâm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đường sức từ của dòng điện thẳng có dạng?", "options": ["A. Đường tròn đồng tâm", "B. Đường thẳng", "C. Đường cong khép kín bất kì", "D. Điểm"], "answer": "A", "explain": "Đường sức từ của dòng điện thẳng là các đường tròn đồng tâm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chiều của đường sức từ quanh dây dẫn phụ thuộc vào?", "options": ["A. Chiều dòng điện", "B. Màu dây", "C. Độ dài dây", "D. Nhiệt độ"], "answer": "A", "explain": "Chiều đường sức từ phụ thuộc vào chiều dòng điện (quy tắc nắm tay phải).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Rắc mạt sắt quanh dây dẫn thẳng có dòng điện. Đánh giá các nhận định.", "statements": ["a) Mạt sắt sắp xếp thành đường tròn.", "b) Các đường tròn đồng tâm với dây dẫn.", "c) Dòng điện càng lớn, từ trường càng mạnh.", "d) Không có từ trường quanh dây dẫn."], "answer": ["T", "T", "T", "F"], "explain": "Dòng điện tạo ra từ trường quanh dây dẫn.  {"type": "mcq", "level": "NB", "q": "Lực từ càng lớn khi?", "options": ["A. Từ trường càng mạnh", "B. Từ trường càng yếu", "C. Không liên quan", "D. Khi không có từ trường"], "answer": "A", "explain": "Từ trường càng mạnh thì lực từ tác dụng càng lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim nam châm đặt trong từ trường đều sẽ?", "options": ["A. Định hướng theo một hướng nhất định", "B. Quay liên tục", "C. Đứng yên bất kì", "D. Biến mất"], "answer": "A", "explain": "Kim định hướng dọc theo đường sức từ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "So sánh từ trường ở hai vị trí A (gần cực) và B (xa nam châm). Đánh giá các nhận định.", "statements": ["a) Từ trường tại A mạnh hơn tại B.", "b) Đường sức từ tại A mau hơn tại B.", "c) Kim đặt tại A chịu lực lớn hơn tại B.", "d) Từ trường tại A và B bằng nhau."], "answer": ["T", "T", "T", "F"], "explain": "Từ trường mạnh dần khi lại gần nam châm.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về độ mạnh của từ trường.", "statements": ["a) Gần nam châm, từ trường mạnh.", "b) Xa nam châm, từ trường yếu.", "c) Đường sức mau thì từ trường mạnh.", "d) Từ trường mạnh như nhau ở mọi nơi."], "answer": ["T", "T", "T", "F"], "explain": "Từ trường không đều, mạnh gần yếu xa.", "points": 1}, {"type": "short", "level": "TH", "q": "Nơi đường sức từ càng mau thì từ trường càng mạnh hay yếu?", "answer": "mạnh", "explain": "Nơi đường sức từ mau thì từ trường mạnh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Kim nam châm đặt càng gần cực thì chịu tác dụng càng mạnh hay yếu?", "answer": "mạnh", "explain": "Gần cực từ trường mạnh nên lực tác dụng mạnh.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Từ trường có nhìn thấy được bằng mắt thường không?", "options": ["A. Không", "B. Có", "C. Tùy lúc", "D. Chỉ ban đêm"], "answer": "A", "explain": "Từ trường vô hình, không nhìn thấy bằng mắt thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để quan sát hình dạng từ trường, ta dùng?", "options": ["A. Mạt sắt", "B. Kính lúp", "C. Kính hiển vi", "D. Mắt thường"], "answer": "A", "explain": "Rắc mạt sắt để hiện hình đường sức từ (từ phổ).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vùng không gian làm lệch kim nam châm. Kết luận nào đúng?", "options": ["A. Vùng đó có từ trường", "B. Vùng đó không có gì", "C. Kim bị hỏng", "D. Gió thổi"], "answer": "A", "explain": "Kim bị lệch chứng tỏ có lực từ, tức có từ trường.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao ta không cảm nhận được từ trường Trái Đất?", "options": ["A. Vì từ trường Trái Đất rất yếu so với nam châm thường", "B. Vì không có từ trường", "C. Vì ta không có giác quan cảm nhận từ", "D. Cả A và C"], "answer": "D", "explain": "Từ trường Trái Đất yếu và con người không có giác quan cảm nhận từ trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nam châm vĩnh cửu luôn có từ trường xung quanh vì?", "options": ["A. Nó luôn có từ tính", "B. Nó nóng", "C. Nó đẹp", "D. Ngẫu nhiên"], "answer": "A", "explain": "Nam châm vĩnh cửu luôn có từ tính nên luôn có từ trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ trường của nam châm điện tồn tại khi nào?", "options": ["A. Khi có dòng điện chạy qua", "B. Luôn luôn", "C. Khi ngắt điện", "D. Không bao giờ"], "answer": "A", "explain": "Nam châm điện chỉ có từ trường khi có dòng điện.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một khu vực được che chắn bằng vật liệu chống từ. Đánh giá các nhận định.", "statements": ["a) Kim nam châm trong đó ít bị ảnh hưởng.", "b) Vật liệu từ có thể che chắn từ trường.", "c) Từ trường có thể bị che chắn một phần.", "d) Từ trường không thể bị ảnh hưởng."], "answer": ["T", "T", "T", "F"], "explain": "Vật liệu từ (sắt) có thể che chắn, làm yếu từ trường.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về tính chất của từ trường.", "statements": ["a) Từ trường vô hình.", "b) Từ trường tác dụng lực lên vật liệu từ.", "c) Từ trường tồn tại quanh nam châm.", "d) Từ trường chỉ tồn tại trong nam châm."], "answer": ["T", "T", "T", "F"], "explain": "Từ trường tồn tại trong không gian xung quanh nam châm.", "points": 1}, {"type": "short", "level": "TH", "q": "Từ trường có nhìn thấy được không? (Trả lời: có hoặc không)", "answer": "không", "explain": "Từ trường vô hình, không nhìn thấy được.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Để hiện hình từ trường, người ta rắc vật liệu gì?", "answer": "mạt sắt", "explain": "Rắc mạt sắt để tạo từ phổ.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Đường sức từ bên trong nam châm đi như thế nào?", "options": ["A. Từ cực S đến cực N", "B. Từ cực N đến cực S", "C. Đứng yên", "D. Không có"], "answer": "A", "explain": "Bên trong nam châm, đường sức từ đi từ cực S đến cực N tạo thành đường khép kín.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đường sức từ là đường khép kín vì?", "options": ["A. Đi ra từ N, vòng qua không gian, đi vào S rồi đi trong nam châm về N", "B. Ngẫu nhiên", "C. Do vẽ", "D. Không khép kín"], "answer": "A", "explain": "Đường sức từ tạo thành vòng khép kín liên tục.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một kim nam châm đặt tại điểm giữa hai cực N của hai nam châm giống nhau đặt đối diện. Kim sẽ?", "options": ["A. Ở trạng thái cân bằng không bền", "B. Quay tít", "C. Chỉ về một cực", "D. Biến mất"], "answer": "A", "explain": "Tại điểm giữa, từ trường triệt tiêu, kim ở cân bằng không bền.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Từ trường tại một điểm do hai nam châm tạo ra được xác định bằng?", "options": ["A. Nguyên lí chồng chất từ trường", "B. Cộng đại số đơn giản", "C. Nhân với nhau", "D. Không xác định được"], "answer": "A", "explain": "Từ trường tuân theo nguyên lí chồng chất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lực từ giữa hai nam
