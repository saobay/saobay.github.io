c độ và thời gian", "B. Quãng đường và thời gian", "C. Quãng đường và tốc độ", "D. Thời gian và quãng đường"], "answer": "B", "explain": "s là quãng đường, t là thời gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật chuyển động với tốc độ 72 km/h. Tốc độ này bằng bao nhiêu m/s?", "options": ["A. 20 m/s", "B. 259,2 m/s", "C. 2 m/s", "D. 200 m/s"], "answer": "A", "explain": "72 : 3,6 = 20 m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người đi xe đạp trong 20 phút với tốc độ 15 km/h. Quãng đường đi được là?", "options": ["A. 300 km", "B. 5 km", "C. 35 km", "D. 0,75 km"], "answer": "B", "explain": "20 phút = 1/3 giờ; s = 15 x 1/3 = 5 km.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Lúc 7 giờ, xe A xuất phát từ tỉnh X đi tỉnh Y với tốc độ 50 km/h. Lúc 8 giờ, xe B xuất phát từ X đi Y với tốc độ 75 km/h. Hỏi xe B đuổi kịp xe A lúc mấy giờ?", "options": ["A. 9 giờ", "B. 10 giờ", "C. 11 giờ", "D. 12 giờ"], "answer": "B", "explain": "Khi B xuất phát, A đã đi 50 km. Hiệu tốc độ 25 km/h nên cần 2 giờ để đuổi kịp: 10 giờ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn vị nào sau đây là đơn vị của quãng đường?", "options": ["A. km/h", "B. m/s", "C. km", "D. giờ"], "answer": "C", "explain": "Kilômét (km) là đơn vị độ dài/quãng đường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một con ốc sên bò được 12 m trong 1 giờ. Tốc độ của ốc sên là?", "options": ["A. 12 m/s", "B. 12 km/h", "C. 12 m/h", "D. 0,2 m/s"], "answer": "C", "explain": "v = 12 m / 1 giờ = 12 m/h.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Bảng ghi quãng đường của một xe theo thời gian: 1 giờ - 40 km, 2 giờ - 80 km, 3 giờ - 120 km. Đánh giá các nhận định.", "statements": ["a) Xe chuyển động đều với tốc độ 40 km/h.", "b) Đồ thị quãng đường theo thời gian là đường thẳng.", "c) Sau 2,5 giờ xe đi được 100 km.", "d) Tốc độ trung bình của xe là 120 km/h."], "answer": ["T", "T", "T", "F"], "explain": "Tốc độ trung bình là 40 km/h.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về tốc độ trung bình.", "statements": ["a) Tốc độ trung bình dùng cho chuyển động không đều.", "b) Tốc độ trung bình bằng tổng quãng đường chia tổng thời gian.", "c) Tốc độ trung bình luôn bằng tốc độ lớn nhất.", "d) Khi chuyển động đều, tốc độ trung bình bằng tốc độ của vật."], "answer": ["T", "T", "F", "T"], "explain": "Tốc độ trung bình không nhất thiết bằng tốc độ lớn nhất.", "points": 1}, {"type": "short", "level": "TH", "q": "Một tàu thủy đi với tốc độ 15 m/s trong 10 phút. Quãng đường đi được là bao nhiêu mét?", "answer": "9000", "explain": "10 phút = 600 giây; s = 15 x 600 = 9000 m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một người chạy marathon 42 km với tốc độ trung bình 14 km/h. Tính thời gian chạy (theo giờ).", "answer": "3", "explain": "t = 42/14 = 3 giờ.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Muốn biết xe nào chạy nhanh hơn, ta so sánh đại lượng nào của chúng?", "options": ["A. Màu sắc", "B. Tốc độ", "C. Giá tiền", "D. Hãng sản xuất"], "answer": "B", "explain": "Xe nào có tốc độ lớn hơn thì chạy nhanh hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đi quãng đường 100 m trong 25 giây. Tốc độ của vật là?", "options": ["A. 2500 m/s", "B. 4 m/s", "C. 125 m/s", "D. 0,25 m/s"], "answer": "B", "explain": "v = 100/25 = 4 m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một ô tô đi 150 km trong 2,5 giờ. Nếu giữ nguyên tốc độ, ô tô đi 90 km mất bao lâu?", "options": ["A. 1,5 giờ", "B. 2 giờ", "C. 1 giờ", "D. 4,2 giờ"], "answer": "A", "explain": "v = 60 km/h; t = 90/60 = 1,5 giờ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người đi bộ từ A đến B dài 6 km với tốc độ 4 km/h, rồi quay về A với tốc độ 6 km/h. Tốc độ trung bình cả đi và về là?", "options": ["A. 5 km/h", "B. 4,8 km/h", "C. 5,2 km/h", "D. 10 km/h"], "answer": "B", "explain": "t đi = 1,5 h, t về = 1 h; vtb = 12/2,5 = 4,8 km/h.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cách viết đúng đơn vị mét trên giây là?", "options": ["A. m/s", "B. ms", "C. s/m", "D. m.s"], "answer": "A", "explain": "Mét trên giây viết là m/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đổi 10 m/s ra km/h và 36 km/h ra m/s, cặp kết quả đúng là?", "options": ["A. 36 km/h và 10 m/s", "B. 3,6 km/h và 100 m/s", "C. 360 km/h và 1 m/s", "D. 16 km/h và 20 m/s"], "answer": "A", "explain": "10 x 3,6 = 36 km/h; 36 : 3,6 = 10 m/s.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Hai bạn cùng chạy 100 m: An mất 12,5 giây, Bình mất 14 giây. Đánh giá các nhận định.", "statements": ["a) Tốc độ của An là 8 m/s.", "b) Tốc độ của Bình xấp xỉ 7,14 m/s.", "c) An chạy nhanh hơn Bình.", "d) Nếu cùng chạy 200 m với tốc độ đó, Bình sẽ về đích trước."], "answer": ["T", "T", "T", "F"], "explain": "An nhanh hơn nên An về đích trước.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về đổi đơn vị tốc độ.", "statements": ["a) Muốn đổi m/s ra km/h, ta nhân với 3,6.", "b) Muốn đổi km/h ra m/s, ta chia cho 3,6.", "c) 20 m/s = 72 km/h.", "d) 90 km/h = 9 m/s."], "answer": ["T", "T", "T", "F"], "explain": "90 km/h = 25 m/s.", "points": 1}, {"type": "short", "level": "TH", "q": "Một xe buýt đi với tốc độ 40 km/h. Tính thời gian (theo phút) để xe đi hết quãng đường 20 km.", "answer": "30", "explain": "t = 20/40 = 0,5 giờ = 30 phút.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật chuyển động đều với tốc độ 2,5 m/s. Tính quãng đường (theo mét) vật đi được trong 1 phút.", "answer": "150", "explain": "1 phút = 60 giây; s = 2,5 x 60 = 150 m.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tốc độ 60 km/h có nghĩa là gì?", "options": ["A. Mỗi giờ đi được 60 km", "B. Mỗi phút đi được 60 km", "C. Mỗi giây đi được 60 km", "D. Mỗi ngày đi được 60 km"], "answer": "A", "explain": "60 km/h nghĩa là mỗi giờ đi được 60 km.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một học sinh đi xe đạp 3 km mất 15 phút. Tốc độ của học sinh đó là?", "options": ["A. 45 km/h", "B. 12 km/h", "C. 0,2 km/h", "D. 18 km/h"], "answer": "B", "explain": "15 phút = 0,25 giờ; v = 3/0,25 = 12 km/h.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một máy bay bay 900 km trong 1,5 giờ. Tốc độ của máy bay tính theo m/s là?", "options": ["A. 600 m/s", "B. 166,7 m/s", "C. 1350 m/s", "D. 60 m/s"], "answer": "B", "explain": "v = 600 km/h = 600/3,6 ≈ 166,7 m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Quãng đường từ nhà An đến trường là 4 km. An đi xe với tốc độ 16 km/h. Hỏi An phải xuất phát chậm nhất lúc mấy giờ để đến trường trước 7 giờ?", "options": ["A. 6 giờ 30 phút", "B. 6 giờ 45 phút", "C. 6 giờ 15 phút", "D. 7 giờ"], "answer": "B", "explain": "t = 4/16 = 0,25 giờ = 15 phút; xuất phát lúc 6 giờ 45 phút.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đại lượng tốc độ có thể nhận giá trị nào?", "options": ["A. Chỉ số dương", "B. Số không âm", "C. Số âm", "D. Không có giá trị"], "answer": "B", "explain": "Tốc độ là số không âm (có thể bằng 0 khi vật đứng yên).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đứng yên có tốc độ bằng bao nhiêu?", "options": ["A. 1 m/s", "B. 0 m/s", "C. Không xác định", "D. Vô cùng"], "answer": "B", "explain": "Vật đứng yên không đi được quãng đường nào nên tốc độ bằng 0.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một ô tô đi từ A đến B: nửa quãng đường đầu đi với tốc độ 40 km/h, nửa sau đi với tốc độ 60 km/h. Quãng đường AB dài 120 km. Đánh giá các nhận định.", "statements": ["a) Thời gian đi nửa đầu là 1,5 giờ.", "b) Thời gian đi nửa sau là 1 giờ.", "c) Tốc độ trung bình là 50 km/h.", "d) Tốc độ trung bình là 48 km/h."], "answer": ["T", "T", "F", "T"], "explain": "vtb = 120/2,5 = 48 km/h, không phải trung bình cộng 50 km/h.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về ý nghĩa của tốc độ.", "statements": ["a) Tốc độ 5 km/h nghĩa là mỗi giờ đi được 5 km.", "b) Vật đứng yên có tốc độ bằng 0.", "c) Tốc độ cho biết vật chuyển động nhanh hay chậm.", "d) Hai vật có cùng tốc độ thì luôn đi được quãng đường bằng nhau."], "answer": ["T", "T", "T", "F"], "explain": "Quãng đường còn phụ thuộc thời gian chuyển động.", "points": 1}, {"type": "short", "level": "TH", "q": "Một người đi xe máy với tốc độ 30 km/h trong 40 phút. Quãng đường đi được là bao nhiêu km?", "answer": "20", "explain": "40 phút = 2/3 giờ; s = 30 x 2/3 = 20 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một đoàn xe đi 60 km đầu với tốc độ 30 km/h và 60 km sau với tốc độ 60 km/h. Tính tốc độ trung bình (km/h) của cả hành trình.", "answer": "40", "explain": "t1 = 2 h, t2 = 1 h; vtb = 120/3 = 40 km/h.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức tính tốc độ trung bình của chuyển động không đều là?", "options": ["A. Tổng quãng đường chia tổng thời gian", "B. Tổng thời gian chia tổng quãng đường", "C. Quãng đường dài nhất chia thời gian ngắn nhất", "D. Trung bình cộng các tốc độ"], "answer": "A", "explain": "vtb = tổng quãng đường / tổng thời gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật chuyển động đều với tốc độ 5 m/s. Sau 2 phút, vật đi được quãng đường bao nhiêu?", "options": ["A. 10 m", "B. 600 m", "C. 300 m", "D. 60 m"], "answer": "B", "explain": "2 phút = 120 giây; s = 5 x 120 = 600 m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người đi ô tô từ tỉnh A đến tỉnh B dài 180 km hết 3 giờ, nghỉ 30 phút rồi quay về A hết 3,5 giờ. Tốc độ trung bình cả đi và về (không tính thời gian nghỉ) là?", "options": ["A. 55,4 km/h", "B. 60 km/h", "C. 51,4 km/h", "D. 50 km/h"], "answer": "A", "explain": "Tổng s = 360 km, tổng t = 6,5 h; vtb ≈ 55,4 km/h.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai thành phố cách nhau 300 km. Xe tải đi với tốc độ 60 km/h, xe con đi với tốc độ 100 km/h, cùng xuất phát một lúc từ hai thành phố ngược chiều nhau. Sau bao lâu hai xe gặp nhau?", "options": ["A. 1,875 giờ", "B. 3 giờ", "C. 5 giờ", "D. 2,5 giờ"], "answer": "A", "explain": "Tổng tốc độ 160 km/h; t = 300/160 = 1,875 giờ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các giá trị sau, giá trị nào có thể là tốc độ của một người đi bộ?", "options": ["A. 50 km/h", "B. 5 km/h", "C. 300 km/h", "D. 1000 m/s"], "answer": "B", "explain": "Người đi bộ thường có tốc độ khoảng 4-6 km/h.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tốc độ của một con báo khoảng 30 m/s. Đổi ra km/h được?", "options": ["A. 108 km/h", "B. 8,3 km/h", "C. 300 km/h", "D. 83 km/h"], "answer": "A", "explain": "30 x 3,6 = 108 km/h.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một xe đi 120 km trong 2 giờ đầu và 80 km trong 2 giờ sau. Đánh giá các nhận định.", "statements": ["a) Tốc độ trung bình của xe là 50 km/h.", "b) Xe chuyển động không đều.", "c) Tốc độ trung bình bằng trung bình cộng của hai tốc độ từng đoạn.", "d) Tổng thời gian xe đi là 4 giờ."], "answer": ["T", "T", "F", "T"], "explain": "vtb = 200/4 = 50 km/h; phát biểu c chỉ đúng khi thời gian các đoạn bằng nhau, nói chung là sai.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về tốc độ trong đời sống.", "statements": ["a) Tốc độ giới hạn trên đường giúp đảm bảo an toàn giao thông.", "b) Đồng hồ tốc độ trên xe cho biết tốc độ tức thời của xe.", "c) Tốc độ của máy bay thường lớn hơn tốc độ của ô tô.", "d) Đơn vị km/h chỉ dùng cho ô tô, không dùng cho tàu thủy."], "answer": ["T", "T", "T", "F"], "explain": "km/h dùng chung cho nhiều phương tiện, kể cả tàu thủy.", "points": 1}, {"type": "short", "level": "TH", "q": "Một vận động viên bơi với tốc độ 2 m/s. Tính thời gian (theo giây) để bơi hết 100 m.", "answer": "50", "explain": "t = 100/2 = 50 giây.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một ô tô đi quãng đường 240 km với tốc độ trung bình 80 km/h. Tính thời gian đi (theo giờ).", "answer": "3", "explain": "t = 240/80 = 3 giờ.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khi nói tốc độ của ô tô là 50 km/h, điều đó có nghĩa là?", "options": ["A. Ô tô luôn đi đúng 50 km mỗi giờ", "B. Trung bình mỗi giờ ô tô đi được 50 km", "C. Ô tô không thể đi nhanh hơn 50 km/h", "D. Ô tô đi được 50 km trong 1 phút"], "answer": "B", "explain": "50 km/h nghĩa là trung bình mỗi giờ đi được 50 km.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một xe lửa đi với tốc độ 90 km/h trong 20 phút. Quãng đường xe lửa đi được là?", "options": ["A. 1800 km", "B. 30 km", "C. 110 km", "D. 4,5 km"], "answer": "B", "explain": "20 phút = 1/3 giờ; s = 90 x 1/3 = 30 km.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người đi xe đạp từ nhà đến cơ quan dài 9 km với tốc độ 18 km/h. Thời gian người đó đi là?", "options": ["A. 2 giờ", "B. 0,5 giờ", "C. 162 giờ", "D. 27 giờ"], "answer": "B", "explain": "t = 9/18 = 0,5 giờ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một ca nô xuôi dòng từ A đến B với tốc độ 30 km/h hết 2 giờ, ngược dòng từ B về A hết 3 giờ. Tốc độ trung bình cả đi và về là?", "options": ["A. 25 km/h", "B. 24 km/h", "C. 27,5 km/h", "D. 30 km/h"], "answer": "B", "explain": "AB = 60 km; vtb = 120/5 = 24 km/h.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn vị tốc độ nào lớn hơn: 1 m/s hay 1 km/h?", "options": ["A. 1 m/s lớn hơn", "B. 1 km/h lớn hơn", "C. Hai đơn vị bằng nhau", "D. Không so sánh được"], "answer": "A", "explain": "1 m/s = 3,6 km/h nên 1 m/s lớn hơn 1 km/h.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật chuyển động với tốc độ 12 m/s trong 1 phút. Quãng đường vật đi được là?", "options": ["A. 12 m", "B. 720 m", "C. 72 m", "D. 120 m"], "answer": "B", "explain": "s = 12 x 60 = 720 m.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đồ thị quãng đường - thời gian của một chuyển động là đường , "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "An và Bình cùng xuất phát chạy 400 m. An chạy với tốc độ 8 m/s, Bình chạy với tốc độ 6,4 m/s. Khi An về đích thì Bình còn cách đích bao xa?", "options": ["A. 80 m", "B. 100 m", "C. 320 m", "D. 50 m"], "answer": "A", "explain": "An mất 50 giây; Bình chạy được 320 m; còn cách đích 80 m.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn vị của thời gian trong hệ SI là gì?", "options": ["A. Giờ", "B. Phút", "C. Giây", "D. Ngày"], "answer": "C", "explain": "Đơn vị SI của thời gian là giây (s).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một ô tô đi với tốc độ không đổi 25 m/s. Trong 1 giờ, ô tô đi được quãng đường bao nhiêu km?", "options": ["A. 25 km", "B. 90 km", "C. 1500 km", "D. 1,5 km"], "answer": "B", "explain": "25 m/s = 90 km/h; s = 90 km.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một người đi xe máy từ A đến B dài 60 km: 20 km đầu đi với tốc độ 40 km/h, đoạn còn lại đi với tốc độ 60 km/h. Đánh giá các nhận định.", "statements": ["a) Thời gian đi 20 km đầu là 0,5 giờ.", "b) Thời gian đi đoạn còn lại là 40 phút.", "c) Tốc độ trung bình là 50 km/h.", "d) Tổng thời gian đi là 70 phút."], "answer": ["T", "T", "F", "T"], "explain": "t2 = 40/60 = 2/3 h = 40 phút; tổng t = 70 phút; vtb = 60/(7/6) ≈ 51,4 km/h.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về chuyển động đều.", "statements": ["a) Chuyển động đều là chuyển động có tốc độ không đổi.", "b) Trong chuyển động đều, quãng đường tỉ lệ thuận với thời gian.", "c) Xe chạy trên đường cao tốc với tốc độ ổn định là chuyển động đều.", "d) Mọi chuyển động trong thực tế đều là chuyển động đều."], "answer": ["T", "T", "T", "F"], "explain": "Trong thực tế hầu hết là chuyển động không đều.", "points": 1}, {"type": "short", "level": "TH", "q": "Đổi 72 km/h ra m/s được bao nhiêu?", "answer": "20", "explain": "72 : 3,6 = 20 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật đi 30 m đầu trong 10 giây và 30 m sau trong 5 giây. Tính tốc độ trung bình (m/s) của vật.", "answer": "4", "explain": "Tổng s = 60 m, tổng t = 15 s; vtb = 4 m/s.", "points": 0.5}]}]}
