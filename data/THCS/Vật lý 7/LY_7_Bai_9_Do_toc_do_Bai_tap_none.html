"T", "T", "T", "F"], "explain": "Có thể đo tốc độ gió bằng máy đo gió chuyên dụng.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về công thức đo tốc độ.", "statements": ["a) Đo được s và t thì tính được v theo v = s/t.", "b) s càng lớn, t càng nhỏ thì v càng lớn.", "c) s càng nhỏ, t càng lớn thì v càng nhỏ.", "d) Chỉ cần đo s là đủ để biết tốc độ."], "answer": ["T", "T", "T", "F"], "explain": "Phải đo cả quãng đường s và thời gian t mới tính được tốc độ.", "points": 1}, {"type": "short", "level": "TH", "q": "Đổi 15 m/s ra km/h được bao nhiêu?", "answer": "54", "explain": "15 x 3,6 = 54 km/h.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một ô tô đi với tốc độ 90 km/h. Tính quãng đường (km) ô tô đi được trong 20 phút.", "answer": "30", "explain": "20 phút = 1/3 giờ; s = 90 x 1/3 = 30 km.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Người ta thường đo tốc độ của vận động viên chạy 100 m bằng cách nào?", "options": ["A. Đo khối lượng vận động viên", "B. Bấm giờ khi xuất phát và khi về đích", "C. Đo chiều cao vận động viên", "D. Đếm bước chạy"], "answer": "B", "explain": "Bấm giờ lúc xuất phát và lúc về đích để biết thời gian chạy 100 m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một thuyền đi 12 km trong 1 giờ. Tốc độ của thuyền là?", "options": ["A. 12 km/h", "B. 13 km/h", "C. 11 km/h", "D. 6 km/h"], "answer": "A", "explain": "v = 12/1 = 12 km/h.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật rơi từ độ cao 20 m xuống đất mất 2 s. Tốc độ trung bình của vật khi rơi là?", "options": ["A. 40 m/s", "B. 10 m/s", "C. 22 m/s", "D. 18 m/s"], "answer": "B", "explain": "vtb = 20/2 = 10 m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cổng quang điện đo thời gian tấm chắn dài 6 cm đi qua là 0,03 s. Nếu thay tấm chắn dài 12 cm, thời gian đo được là bao nhiêu (giả sử tốc độ không đổi)?", "options": ["A. 0,015 s", "B. 0,06 s", "C. 0,03 s", "D. 0,09 s"], "answer": "B", "explain": "Tấm chắn dài gấp đôi nên thời gian che tia gấp đôi: 0,06 s.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi đo tốc độ, việc ghi chép kết quả các lần đo nhằm mục đích gì?", "options": ["A. Để trang trí", "B. Để tính giá trị trung bình và đánh giá sai số", "C. Để nộp cho giáo viên chấm điểm chữ đẹp", "D. Không có mục đích"], "answer": "B", "explain": "Ghi chép để tính trung bình và đánh giá độ tin cậy của phép đo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một xe đạp đi 10 km trong 40 phút. Tốc độ của xe là?", "options": ["A. 400 km/h", "B. 15 km/h", "C. 50 km/h", "D. 4 km/h"], "answer": "B", "explain": "40 phút = 2/3 giờ; v = 10/(2/3) = 15 km/h.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Kiểm tra tốc độ xe trên cao tốc giới hạn 120 km/h bằng súng bắn tốc độ. Đánh giá các nhận định.", "statements": ["a) Xe chạy 100 km/h không vi phạm.", "b) Xe chạy 130 km/h vi phạm giới hạn.", "c) Súng bắn tốc độ cần hướng đúng vào xe.", "d) Xe chạy đúng 120 km/h là vi phạm."], "answer": ["T", "T", "T", "F"], "explain": "Chạy đúng bằng giới hạn 120 km/h thì không vi phạm.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về đo tốc độ viên bi.", "statements": ["a) Cần máng để bi lăn theo đường thẳng.", "b) Cần thước để đo quãng đường bi lăn.", "c) Cần đồng hồ để đo thời gian bi lăn.", "d) Có thể tính tốc độ mà không cần đo thời gian."], "answer": ["T", "T", "T", "F"], "explain": "Phải đo thời gian mới tính được tốc độ theo v = s/t.", "points": 1}, {"type": "short", "level": "TH", "q": "Một vật đi 40 m trong 8 s. Tốc độ của vật là bao nhiêu m/s?", "answer": "5", "explain": "v = 40/8 = 5 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xe máy đi với tốc độ 45 km/h trong 1 giờ 20 phút. Tính quãng đường (km) xe đi được.", "answer": "60", "explain": "1 giờ 20 phút = 4/3 giờ; s = 45 x 4/3 = 60 km.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "leve
