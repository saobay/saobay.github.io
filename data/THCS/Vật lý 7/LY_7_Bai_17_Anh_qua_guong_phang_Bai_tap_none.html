 ["A. Má phải của ảnh", "B. Má trái của ảnh", "C. Giữa trán", "D. Không thấy"], "answer": "A", "explain": "Gương đảo ngược trái-phải nên nốt ruồi ở má phải của ảnh.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một biển số xe nhìn qua gương chiếu hậu. Đánh giá các nhận định.", "statements": ["a) Chữ số trong gương bị đảo ngược trái-phải.", "b) Cần làm quen để đọc đúng biển số qua gương.", "c) Gương chiếu hậu giúp quan sát phía sau.", "d) Ảnh trong gương là ảnh thật."], "answer": ["T", "T", "T", "F"], "explain": "Ảnh trong gương là ảnh ảo.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định về tính đảo ngược của gương.", "statements": ["a) Gương đảo ngược trái-phải.", "b) Gương không đảo ngược trên-dưới.", "c) Chữ đối xứng qua trục dọc không bị thay đổi.", "d) Mọi chữ cái đều bị đảo ngược."], "answer": ["T", "T", "T", "F"], "explain": "Chữ đối xứng qua trục dọc (A, H, I...) không bị thay đổi.", "points": 1}, {"type": "short", "level": "TH", "q": "Khi soi gương, tay phải của ta thành tay nào của ảnh?", "answer": "tay trái", "explain": "Gương đảo ngược trái-phải nên tay phải thành tay trái của ảnh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chữ cái nào soi gương không thay đổi: A hay B?", "answer": "A", "explain": "Chữ A đối xứng qua trục dọc nên không thay đổi.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Ảnh của một điểm sáng qua gương phẳng là?", "options": ["A. Một điểm sáng ảo đối xứng qua gương", "B. Một điểm sáng thật", "C. Một vệt sáng", "D. Không có"], "answer": "A", "explain": "Ảnh của điểm sáng là điểm sáng ảo đối xứng qua gương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặt hai gương phẳng vuông góc nhau, một vật đặt trước hai gương sẽ có mấy ảnh?", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "C", "explain": "Hai gương vuông góc tạo 3 ảnh của một vật.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật đặt giữa hai gương phẳng song song đối diện nhau sẽ cho?", "options": ["A. Vô số ảnh", "B. Một ảnh", "C. Hai ảnh", "D. Không có ảnh"], "answer": "A", "explain": "Hai gương song song đối diện tạo vô số ảnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người đứng giữa hai gương phẳng đặt song song, cách gương thứ nhất 1 m, cách gương thứ hai 2 m. Ảnh gần nhất của người đó cách người bao nhiêu?", "options": ["A. 1 m", "B. 2 m", "C. 3 m", "D. 4 m"], "answer": "B", "explain": "Ảnh gần nhất cách gương 1 là 1 m nên cách người 2 m.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Gương ghép nhiều tấm nhỏ tạo hiệu ứng?", "options": ["A. Nhiều ảnh", "B. Một ảnh", "C. Không có ảnh", "D. Ảnh mờ"], "answer": "A", "explain": "Gương ghép tạo nhiều ảnh của vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong thang máy có gương, ta thấy nhiều ảnh của mình vì?", "options": ["A. Có nhiều mặt gương phản xạ qua lại", "B. Mắt ta hoa", "C. Thang máy rung", "D. Đèn sáng"], "answer": "A", "explain": "Nhiều mặt gương tạo nhiều ảnh qua phản xạ nhiều lần.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đặt một cây nến giữa hai gương phẳng song song. Đánh giá các nhận định.", "statements": ["a) Có vô số ảnh của cây nến.", "b) Các ảnh nằm trên một đường thẳng.", "c) Ảnh càng xa càng mờ.", "d) Chỉ có một ảnh duy nhất."], "answer": ["T", "T", "T", "F"], "explain": "Hai gương song song tạo vô số ảnh.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Đánh giá các nhận định mở rộng về gương.", "statements": ["a) Một gương phẳng cho một ảnh.", "b) Hai gương vuông góc cho ba ảnh.", "c) Hai gương song song cho vô số ảnh.", "d) Gương càng nhiều, ảnh càng ít."], "answer": ["T", "T", "T", "F"], "explain": "Càng nhiều gương (phản xạ nhiều lần) càng tạo nhiều ảnh.", "points": 1}, {"type": "short", "level": "TH", "q": "Hai gương phẳng đặt song song đối diện nhau tạo bao nhiêu ảnh?", "answer": "vô số", "explain": "Hai gương song song tạo vô số ảnh.", "points": 0.5},
