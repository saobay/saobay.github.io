<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài của tôi - SAOBAY</title>
<style>
body{font-family:system-ui;margin:0;padding:16px;background:#f3f4f6}
h1{font-size:20px}
.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
button{padding:10px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:15px}
ul{list-style:none;padding:0}
li{padding:10px;border-bottom:1px solid #eee}
small{color:#888}
</style>
</head>
<body>
<h1>📚 Bài đã đăng của bạn</h1>
<div class="card">
<button onclick="load()">🔄 Tải danh sách</button>
<div id="list" style="margin-top:12px"><p style="color:#666">Bấm nút để tải.</p></div>
</div>
<p><a href="teacher-hub.html">← Về Teacher Hub</a></p>
<script>
async function load(){
  var l=document.getElementById('list');
  l.innerHTML='<p>⏳ Đang tải...</p>';
  try{
    var r=await fetch('https://api.github.com/repos/saobay/saobay.github.io/git/trees/main?recursive=1');
    var d=await r.json();
    var f=d.tree.filter(function(i){return i.type==='blob'&&i.path.endsWith('.html')&&i.path.indexOf('data/')===0&&i.path.indexOf('data/bank')!==0;});
    if(!f.length){l.innerHTML='<p>Chưa có bài nào.</p>';return;}
    var h='<p><b>'+f.length+'</b> bài:</p><ul>';
    f.forEach(function(x){
      var n=x.path.split('/').pop().replace('.html','');
      h+='<li>📄 <b>'+n+'</b><br><small>'+x.path+'</small></li>';
    });
    l.innerHTML=h+'</ul>';
  }catch(e){l.innerHTML='<p style="color:red">Lỗi: '+e.message+'</p>';}
}
</script>
</body>
</html>
