<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Phòng họp — Thầy &amp; 2 Mèo (Firebase v1)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #eef2f7; color: #0f172a; display: flex; flex-direction: column; height: 100dvh; }
  .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 10px; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  header { background: #0f766e; color: #fff; padding: 6px 16px; text-align: center; }
  header .t { font-size: 20px; font-weight: 700; }
  header .s { font-size: 13.5px; opacity: .88; margin-top: 1px; }
  #connbar { display: flex; align-items: center; gap: 8px; padding: 5px 14px; font-size: 13.5px; color: #334155; background: #e2e8f0; border-bottom: 1px solid #cbd5e1; }
  #connDot { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; flex: none; }
  #connDot.on { background: #16a34a; }
  #connDot.off { background: #dc2626; }
  #connText { font-weight: 600; }
  #msgCount { margin-left: auto; color: #64748b; font-weight: 400; }
  .cols { display: flex; justify-content: space-between; padding: 7px 14px 0; font-size: 14px; font-weight: 700; }
  .cols .c1 { color: #dc2626; } .cols .c2 { color: #16a34a; } .cols .c3 { color: #065f46; }
  #msgs { flex: 1; overflow-y: auto; padding: 8px 14px 14px; }
  .msg { background: #fff; border-radius: 18px; padding: 11px 15px; margin-bottom: 11px; box-shadow: 0 1px 3px rgba(15,23,42,.08); width: 74%; max-width: 800px; }
  .msg.a-meo1 { background: #fef2f2; margin-left: 0; margin-right: auto; border: 2.5px solid #dc2626; }
  .msg.a-meo2 { background: #fff; margin-left: 0; margin-right: auto; border: 2.5px solid #065f46; }
  .msg.a-thay { background: #f0fdf4; margin-left: auto; margin-right: 0; width: 78%; border: 2.5px solid #16a34a; }
  .msg .meta { font-size: 13.5px; margin-bottom: 4px; display: flex; align-items: center; }
  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #94a3b8; background: #fff; vertical-align: middle; font-size: 15px; margin-right: 5px; flex: none; }
  .avatar.av-thay { border-color: #16a34a; }
  .avatar.av-meo1 { border-color: #dc2626; }
  .avatar.av-meo2 { border-color: #ea580c; }
  .msg .name { font-weight: 700; font-size: 15px; }
  .n-thay { color: #16a34a; } .n-meo1 { color: #dc2626; } .n-meo2 { color: #065f46; }
  .msg .time { color: #94a3b8; margin-left: 7px; }
  .msg .txt { font-size: 18px; line-height: 1.58; word-break: break-word; }
  .msg .txt p { margin: 0 0 8px; }
  .msg .txt p:last-child { margin-bottom: 0; }
  .msg .txt h1 { font-size: 22px; margin: 2px 0 8px; }
  .msg .txt h2 { font-size: 20px; margin: 2px 0 7px; }
  .msg .txt h3 { font-size: 18.5px; margin: 2px 0 6px; }
  .msg .txt ul, .msg .txt ol { margin: 0 0 8px; padding-left: 24px; }
  .msg .txt li { margin: 2px 0; }
  .msg .txt blockquote { margin: 0 0 8px; padding: 4px 12px; border-left: 4px solid #cbd5e1; color: #334155; background: rgba(255,255,255,.55); border-radius: 0 10px 10px 0; }
  .msg .txt code { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 0 5px; font-size: 15.5px; font-family: ui-monospace, Consolas, monospace; }
  .msg .txt pre { background: #0f172a; color: #e2e8f0; border-radius: 12px; padding: 10px 12px; overflow-x: auto; margin: 0 0 8px; }
  .msg .txt pre code { background: none; border: none; color: inherit; padding: 0; font-size: 14.5px; }
  .msg .txt a { color: #2563eb; text-decoration: underline; }
  .msg .txt hr { border: none; border-top: 1px solid #cbd5e1; margin: 8px 0; }
  #empty { text-align: center; color: #94a3b8; padding: 34px 10px; font-size: 16px; }
  #bar { display: flex; gap: 8px; padding: 8px 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; margin: 0 0 10px; box-shadow: 0 1px 3px rgba(15,23,42,.08); align-items: stretch; }
  #sender { border: 1.5px solid #cbd5e1; border-radius: 14px; padding: 0 10px; font-size: 16px; font-family: inherit; font-weight: 700; background: #f8fafc; cursor: pointer; }
  #txt { flex: 1; resize: none; border: 1.5px solid #cbd5e1; border-radius: 14px; padding: 10px 12px; font-size: 17px; font-family: inherit; max-height: 120px; }
  #send { background: #0f766e; color: #fff; border: none; border-radius: 14px; padding: 0 22px; font-size: 17px; font-weight: 700; cursor: pointer; }
  #send:disabled { opacity: .5; }
  .notev1 { font-size: 12.5px; color: #64748b; text-align: center; padding: 0 10px 8px; }
  @media (max-width: 640px) { .msg { width: 90%; } .msg.a-thay { width: 92%; } .msg .txt { font-size: 17px; } header .t { font-size: 18px; } #sender { font-size: 15px; padding: 0 6px; } #send { padding: 0 14px; } }
</style>
</head>
<body>
<header>
  <div class="t">Phòng họp — Thầy &amp; 2 Mèo</div>
  <div class="s">Bản Firebase v1 — tin nhắn thời gian thực qua Realtime Database</div>
</header>
<div id="connbar"><span id="connDot"></span><span id="connText">Đang kết nối Firebase…</span><span id="msgCount"></span></div>
<div class="wrap">
  <div class="cols"><span class="c1">🐈 Mèo 1</span><span class="c2">Thầy 👨‍🏫</span><span class="c3">Mèo 2 🐈‍⬛</span></div>
  <div id="msgs"><div id="empty">Đang tải tin…</div></div>
  <form id="bar">
    <select id="sender" title="Chọn người gửi">
      <option value="thay">Thầy</option>
      <option value="meo1">Mèo 1</option>
      <option value="meo2">Mèo 2</option>
    </select>
    <textarea id="txt" rows="2" placeholder="Nhắn vào phòng… (Enter để gửi, Shift+Enter để xuống dòng)"></textarea>
    <button id="send" type="submit">Gửi</button>
  </form>
  <div class="notev1">Bản v1: chưa hỗ trợ đính kèm file. Tin lưu ở nút “messages”, mốc đã đọc ở nút “reads” trên Realtime Database.</div>
</div>
<noscript><div style="padding:16px;text-align:center">Trang phòng cần bật JavaScript để chạy.</div></noscript>

<script type="module" id="fb-app">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getDatabase, ref, push, set, onValue, query, orderByChild } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';

/* Thông số dự án saobay-phonghop (bản cấu hình web công khai của Firebase). */
const firebaseConfig = {
  apiKey: 'AIzaSyDxjpPtupfYzVCQUy4Pk6w3x8amydRynMg',
  authDomain: 'saobay-phonghop.firebaseapp.com',
  databaseURL: 'https://saobay-phonghop-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'saobay-phonghop',
  storageBucket: 'saobay-phonghop.firebasestorage.app',
  messagingSenderId: '427138375370',
  appId: '1:427138375370:web:832956aa25f3b96ab51e33'
};

const NAMES = { thay: 'Thầy', meo1: 'Mèo 1', meo2: 'Mèo 2' };
const AVATARS = { thay: '👨‍🏫', meo1: '🐈', meo2: '🐈‍⬛' };
const SENDER_KEY = 'phfb_sender';

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const msgsEl = document.getElementById('msgs');
const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');
const msgCount = document.getElementById('msgCount');
const senderEl = document.getElementById('sender');
const txtEl = document.getElementById('txt');
const sendBtn = document.getElementById('send');
const formEl = document.getElementById('bar');

let myAuthor = 'thay';
try {
  const saved = localStorage.getItem(SENDER_KEY);
  if (saved && NAMES[saved]) myAuthor = saved;
} catch (e) { /* localStorage không dùng được — giữ mặc định */ }
senderEl.value = myAuthor;
senderEl.addEventListener('change', () => {
  myAuthor = senderEl.value;
  try { localStorage.setItem(SENDER_KEY, myAuthor); } catch (e) {}
  lastMarkedKey = '';
  markRead(latestKey);
});

/* Giờ ISO 8601 theo múi +07:00, khớp chuẩn trường "at" của phòng. */
function isoNow() {
  return new Date(Date.now() + 7 * 3600 * 1000).toISOString().replace('Z', '+07:00');
}
const timeFmt = new Intl.DateTimeFormat('vi-VN', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric', hour12: false });
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso || '');
  return timeFmt.format(d);
}

/* ---------- Render markdown đơn giản, an toàn (thoát HTML trước) ---------- */
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function renderInline(escaped) {
  const codes = [];
  let s = escaped.replace(/`([^`\n]+)`/g, (m, c) => { codes.push('<code>' + c + '</code>'); return '\u0001' + (codes.length - 1) + '\u0001'; });
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => codes[Number(i)] || '');
  return s;
}
function renderMarkdown(src) {
  const lines = String(src == null ? '' : src).replace(/\u0000/g, '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  const isBlockStart = (ln) => /^\s*```/.test(ln) || /^#{1,3}\s/.test(ln) || /^\s*>\s?/.test(ln) || /^\s*[-*]\s+/.test(ln) || /^\s*\d+[.)]\s+/.test(ln) || /^\s*---+\s*$/.test(ln);
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*```/.test(ln)) {
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre>');
    } else if (/^\s*$/.test(ln)) {
      i++;
    } else if (/^#{1,3}\s/.test(ln)) {
      const lvl = ln.match(/^(#{1,3})\s/)[1].length;
      out.push('<h' + lvl + '>' + renderInline(escapeHtml(ln.replace(/^#{1,3}\s+/, ''))) + '</h' + lvl + '>');
      i++;
    } else if (/^\s*---+\s*$/.test(ln)) {
      out.push('<hr>');
      i++;
    } else if (/^\s*>\s?/.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(renderInline(escapeHtml(lines[i].replace(/^\s*>\s?/, '')))); i++; }
      out.push('<blockquote>' + buf.join('<br>') + '</blockquote>');
    } else if (/^\s*[-*]\s+/.test(ln)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push('<li>' + renderInline(escapeHtml(lines[i].replace(/^\s*[-*]\s+/, ''))) + '</li>'); i++; }
      out.push('<ul>' + items.join('') + '</ul>');
    } else if (/^\s*\d+[.)]\s+/.test(ln)) {
      const items = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { items.push('<li>' + renderInline(escapeHtml(lines[i].replace(/^\s*\d+[.)]\s+/, ''))) + '</li>'); i++; }
      out.push('<ol>' + items.join('') + '</ol>');
    } else {
      const buf = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !isBlockStart(lines[i])) { buf.push(renderInline(escapeHtml(lines[i]))); i++; }
      out.push('<p>' + buf.join('<br>') + '</p>');
    }
  }
  return out.join('');
}

/* ---------- Hiển thị tin ---------- */
const seenKeys = new Set();
let firstLoad = true;
let latestKey = '';
let lastMarkedKey = '';

function markRead(lastKey) {
  if (!lastKey || lastKey === lastMarkedKey) return;
  lastMarkedKey = lastKey;
  set(ref(db, 'reads/' + myAuthor), { lastKey: lastKey, at: isoNow() }).catch(() => { lastMarkedKey = ''; });
}

function renderMessages(list) {
  const frag = document.createDocumentFragment();
  if (!list.length) {
    const d = document.createElement('div');
    d.id = 'empty';
    d.textContent = 'Chưa có tin nào trong phòng Firebase. Hãy gửi tin đầu tiên.';
    frag.appendChild(d);
  }
  for (const m of list) {
    const a = NAMES[m.author] ? m.author : 'meo1';
    const art = document.createElement('article');
    art.className = 'msg a-' + a;
    const meta = document.createElement('div');
    meta.className = 'meta';
    const av = document.createElement('span');
    av.className = 'avatar av-' + a;
    av.textContent = AVATARS[a];
    const nm = document.createElement('span');
    nm.className = 'name n-' + a;
    nm.textContent = m.name || NAMES[a];
    const tm = document.createElement('span');
    tm.className = 'time';
    tm.textContent = fmtTime(m.at);
    meta.append(av, nm, tm);
    const tx = document.createElement('div');
    tx.className = 'txt';
    tx.innerHTML = renderMarkdown(m.text || '');
    art.append(meta, tx);
    frag.appendChild(art);
  }
  msgsEl.replaceChildren(frag);
  msgCount.textContent = list.length ? (list.length + ' tin') : '';
}

const messagesQuery = query(ref(db, 'messages'), orderByChild('at'));
onValue(messagesQuery, (snap) => {
  const list = [];
  snap.forEach((child) => {
    const v = child.val() || {};
    list.push({ key: child.key, author: v.author || '', name: v.name || '', at: v.at || '', text: v.text || '' });
  });
  list.sort((x, y) => (x.at < y.at ? -1 : x.at > y.at ? 1 : (x.key < y.key ? -1 : 1)));
  const newKeys = list.filter((m) => !seenKeys.has(m.key)).map((m) => m.key);
  for (const m of list) seenKeys.add(m.key);
  latestKey = list.length ? list[list.length - 1].key : '';
  renderMessages(list);
  markRead(latestKey);
  if (firstLoad || newKeys.length) {
    requestAnimationFrame(() => { msgsEl.scrollTop = msgsEl.scrollHeight; });
  }
  firstLoad = false;
}, (err) => {
  connDot.className = 'off';
  connText.textContent = 'Lỗi đọc dữ liệu phòng: ' + (err && err.message ? err.message : err);
});

/* ---------- Trạng thái kết nối ---------- */
onValue(ref(db, '.info/connected'), (snap) => {
  if (snap.val() === true) {
    connDot.className = 'on';
    connText.textContent = 'Đã kết nối Firebase';
  } else {
    connDot.className = 'off';
    connText.textContent = 'Mất kết nối Firebase — đang chờ kết nối lại…';
  }
});

/* ---------- Gửi tin ---------- */
async function sendCurrent() {
  const text = txtEl.value.trim();
  if (!text) return;
  sendBtn.disabled = true;
  try {
    await push(ref(db, 'messages'), { author: myAuthor, name: NAMES[myAuthor], at: isoNow(), text: text });
    txtEl.value = '';
    txtEl.focus();
  } catch (e) {
    connDot.className = 'off';
    connText.textContent = 'Không gửi được tin — kiểm tra kết nối rồi thử lại.';
  } finally {
    sendBtn.disabled = false;
  }
}
formEl.addEventListener('submit', (ev) => { ev.preventDefault(); sendCurrent(); });
txtEl.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendCurrent(); }
});
</script>
</body>
</html>
