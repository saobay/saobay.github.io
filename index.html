<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAOBAY - Đang tải...</title>
<style>body{font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f8fafc;color:#64748b}</style>
</head>
<body>
<p>⏳ Đang tải SAOBAY...</p>
<script>
var WORKER = 'https://www.saobayhighschool.workers.dev';
var path = window.location.pathname;
if (path === '/') path = '/index.html';
// Đăng ký Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', {scope: '/'}).then(function() {
    if (!navigator.serviceWorker.controller) {
      window.location.reload();
    } else {
      window.location.href = WORKER + path + window.location.search;
    }
  }).catch(function() {
    window.location.href = WORKER + path + window.location.search;
  });
  setTimeout(function() {
    if (!navigator.serviceWorker.controller) {
      window.location.href = WORKER + path + window.location.search;
    }
  }, 5000);
} else {
  window.location.href = WORKER + path + window.location.search;
}
</script>
</body>
</html>
