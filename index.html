<!DOCTYPE html>
<!-- SB_SHELL_20261013_V1: trang vo nhe cho saobay.github.io.
     Nhiem vu duy nhat: dang ky service worker (sw.js) de trinh duyet tu lay
     noi dung tinh tu Cloudflare Worker, giu nguyen URL + dang nhap (cung origin).
     Du lieu dong (/data/, /used/) do sw.js cho di thang ve repo origin. -->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAOBAY - THPT Sào Báy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f0f6ff; color: #1a3a6b; padding: 20px;
  }
  #sb-shell { text-align: center; max-width: 420px; }
  #sb-shell .logo { font-size: 42px; font-weight: 800; letter-spacing: 2px; color: #0b5ed7; }
  #sb-shell .sub { margin-top: 6px; font-size: 15px; color: #4a6a9b; }
  #sb-shell .spin {
    margin: 22px auto 0; width: 38px; height: 38px; border-radius: 50%;
    border: 4px solid #cfe0f7; border-top-color: #0b5ed7;
    animation: sbrot 0.9s linear infinite;
  }
  @keyframes sbrot { to { transform: rotate(360deg); } }
  #sb-shell-status { margin-top: 14px; font-size: 13px; color: #6b8ab5; min-height: 18px; }
  #sb-maint {
    background: #fff; border: 1px solid #e3ecf9; border-radius: 12px;
    padding: 28px 24px; box-shadow: 0 4px 18px rgba(11,94,215,.08);
  }
  #sb-maint h2 { font-size: 20px; margin-bottom: 10px; }
  #sb-maint p { font-size: 14px; color: #4a6a9b; line-height: 1.6; }
  #sb-maint button {
    margin-top: 16px; padding: 9px 18px; font-size: 14px; border-radius: 8px;
    border: 1px solid #0b5ed7; background: #fff; color: #0b5ed7; cursor: pointer;
  }
</style>
</head>
<body>
<div id="sb-shell">
  <div class="logo">SAOBAY</div>
  <div class="sub">THPT Sào Báy</div>
  <div class="spin"></div>
  <div id="sb-shell-status">Đang tải...</div>
</div>
<script>
(function () {
  'use strict';
  var WORKER_URL = 'https://saobay.saobayhighschool.workers.dev/';
  var statusEl = document.getElementById('sb-shell-status');
  function setStatus(t) { if (statusEl) statusEl.textContent = t; }

  // 1. Kiem tra bao tri tu origin (luon moi, khong qua SW vi SW chua active)
  fetch('data/maintenance.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : { on: false }; })
    .then(function (m) {
      if (m && m.on === true && !isAdminBypass()) { showMaintenance(m); return; }
      boot();
    })
    .catch(function () { boot(); }); // khong doc duoc -> cu boot

  function isAdminBypass() {
    try {
      if (new URLSearchParams(location.search).get('sbmain') === '0') return true;
      if (sessionStorage.getItem('sbmain_bypass') === '1') return true;
      var u = JSON.parse(localStorage.getItem('saobay_user') || 'null');
      return !!(u && u.role === 'admin');
    } catch (_) { return false; }
  }

  function showMaintenance(m) {
    var box = document.getElementById('sb-shell');
    box.innerHTML =
      '<div id="sb-maint"><h2>Web đang cập nhật</h2>' +
      '<p>' + escapeHtml(m.message || 'Hệ thống đang được nâng cấp, vui lòng quay lại sau.') + '</p>' +
      '<button id="sb-admin-btn" type="button">Quản trị viên?</button></div>';
    document.getElementById('sb-admin-btn').onclick = function () {
      try { sessionStorage.setItem('sbmain_bypass', '1'); } catch (_) {}
      location.reload();
    };
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 2. Dang ky service worker -> reload de SW phuc vu app tu Worker
  function boot() {
    if (!('serviceWorker' in navigator)) { goDirect(); return; }
    var done = false;
    function go() { if (!done) { done = true; location.reload(); } }
    // Sau 6s ma SW chua kiem soat duoc trang -> di thang sang Worker
    setTimeout(function () {
      if (!done && !navigator.serviceWorker.controller) {
        done = true;
        setStatus('Đang chuyển sang máy chủ dự phòng...');
        location.replace(WORKER_URL + location.search + location.hash);
      }
    }, 6000);

    if (navigator.serviceWorker.controller) { go(); return; }
    navigator.serviceWorker.addEventListener('controllerchange', go);
    navigator.serviceWorker.register('/sw.js').then(function () {
      setStatus('Đang khởi động...');
    }).catch(function () { goDirect(); });
  }

  function goDirect() {
    location.replace(WORKER_URL + location.search + location.hash);
  }
})();
</script>
</body>
</html>
